# review
id: poddac
format: 2
lemma: "poddać"
rank: 1109
pos: verb
aspect: perf
pron: { cyr: "по́ддаць" }
senses:
  - id: surrender
    ru: "poddać się — сдаться, признать поражение"
    examples:
      - pl: "Poddał się."
        ru: "Он сдался."
        source: { kind: translated, id: 10595034 }
      - pl: "Poddaj się."
        ru: "Сдавайся."
        source: { kind: translated, id: 6729602 }
      - pl: "Nie poddamy się."
        ru: "Мы не сдадимся."
        source: { kind: translated, id: 3427230 }
  - id: give-in
    ru: "поддаться (давлению, искушению)"
    examples:
      - pl: "Poddał się presji."
        ru: "Он поддался давлению."
        source: { kind: translated, id: 6305760 }
      - pl: "W końcu poddała się pokusie i zjadła całe ciasto."
        ru: "В конце концов она поддалась искушению и съела весь торт."
        source: { kind: translated, id: 14018639 }
  - id: subject
    ru: "подвергнуть, вынести (на обсуждение, на операцию)"
    examples:
      - pl: "Poddano go narkozie."
        ru: "Его подвергли наркозу."
        source: { kind: translated, id: 362568 }
      - pl: "Tom został poddany transfuzji krwi."
        ru: "Тому сделали переливание крови."
        source: { kind: translated, id: 3857369 }
notes:
  - { kind: usage, text: "Совершенный вид к poddawać. Почти всегда с się: poddać się «сдаться»." }
  - { kind: government, text: "poddać się czemu — дательный падеж: poddać się presji «поддаться давлению», poddać się pokusie «поддаться искушению»." }
  - { kind: usage, text: "Без się значит «подвергнуть, вынести»: poddać coś pod dyskusję «вынести что-то на обсуждение», poddać kogoś operacji." }
  - { kind: false-friend, text: "Формы poddanym и poddanymi в корпусе почти всегда принадлежат существительному poddany «подданный» (Pan miał absolutną władzę nad swoimi poddanymi), а не этому глаголу. Различает только контекст." }
collocations:
  - { pl: "poddać się", ru: "сдаться" }
  - { pl: "nie poddawać się", ru: "не сдаваться" }
  - { pl: "poddać pod dyskusję", ru: "вынести на обсуждение" }
etymology: "Приставка pod- и dać «дать» (праславянское *dati). Русское «поддаться» собрано из тех же частей, и главное значение совпадает."
memory: "poddać się — «сдаться»: Poddaj się! «Сдавайся!». Без się глагол значит «подвергнуть»: poddać operacji. А с дательным — «поддаться»: poddać się presji. Разбирается прозрачно: pod- плюс dać."
idioms:
  - { pl: "poddać się", ru: "сдаться" }
  - { pl: "nie poddawać się", ru: "не сдаваться" }
  - { pl: "poddać pod dyskusję", ru: "вынести на обсуждение" }
formExamplesSkip:
  - { form: "poddanym", reason: "в корпусе эта форма принадлежит существительному poddany «подданный» (Książę nadał swoim poddanym ziemię), а не глаголу poddać" }
  - { form: "poddanymi", reason: "в корпусе эта форма принадлежит существительному poddany «подданный» (Książę nadał swoim poddanym ziemię), а не глаголу poddać" }
