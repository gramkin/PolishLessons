notes:
  - { kind: false-friend, text: "Русского родственника у слова нет, и это как раз надо запомнить: наш «фонарь» пришёл из греческого, а польская LATARNIA из латинского LANTERNA, то же слово, что английское LANTERN. У нас от этого корня осталась только «латерна» в «латерне магике». И не путайте LATARNIA с LATARKA: первое это большой фонарь, уличный или маячный, второе — карманный фонарик, который носят в сумке." }
  - { kind: usage, text: "Десять форм, женский род, мягкая основа на -NIA. Родительный, дательный и местный падежи единственного числа совпадают: все три дают LATARNI, и та же форма служит родительным множественного. Рядом с ней есть вариант LATARŃ, более книжный. Звательный падеж LATARNIO встречается только в стихах. Самое употребительное сочетание — LATARNIA MORSKA, и это обычное польское название маяка." }
  - { kind: government, text: "Под фонарём — POD LATARNIĄ, предлог POD с творительным, как и по-русски. У фонаря — PRZY LATARNI, предлог PRZY с местным падежом, где русский скажет «у фонаря», с родительным. Зажечь фонарь — ZAPALIĆ LATARNIĘ, винительный без предлога. В фонаре — W LATARNI, местный. Обратите внимание, что PRZY и W требуют одной и той же формы LATARNI, а POD — другой." }
  - { kind: pronunciation, text: "Читается «лата́рня», три слога, ударение на предпоследнем. Буква L перед гласной даёт «л», а мягкость забирает сама гласная, поэтому первый слог это «ла», а не «ля». Сочетание NIA даёт «ня», то есть N здесь мягкое. В форме LATARNIĄ носовой Ą на конце звучит «он» и слово читается «лата́рнён», а LATARŃ оканчивается мягким «нь»: «ла́тарнь»." }
  - { kind: register, text: "Слово нейтральное и обиходное. На улице это LATARNIA ULICZNA или просто LATARNIA, и поляки говорят SŁUP LATARNI о фонарном столбе. На море это LATARNIA MORSKA, маяк, и человек при нём называется LATARNIK, слово известное каждому поляку по повести Сенкевича. Прилагательное LATARNIOWY значит «фонарный» и встречается в технических текстах." }
