etymology: "Из латинского LANTERNA, которое само пришло из греческого названия светильника. То же слово дало английское LANTERN и немецкое LATERNE, так что узнать его легко по любому западному языку, только не по русскому: наш «фонарь» идёт от греческого корня со значением «свет», а латинская «латерна» осталась у нас лишь в «латерне магике», старинном проекционном фонаре. Польский взял латинское слово как обычное, повседневное."
memory: "Латинское слово, то же, что английское lantern, а русский «фонарь» греческий, поэтому родства не слышно совсем. Главное сочетание — latarnia morska, дословно «морской фонарь», то есть маяк. Не путать с latarka: это карманный фонарик. Родительный, дательный и местный единственного числа совпадают в latarni. Читается «лата́рня», где la даёт «ла», а nia — «ня»."
idioms:
  - { pl: "latarnia morska", ru: "маяк" }
