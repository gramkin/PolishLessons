# review
id: aktywny
format: 2
lemma: "aktywny"
rank: 4425
pos: adj
pron: { cyr: "акты́вны" }
senses:
  - id: active
    ru: "активный, деятельный"
    examples:
      - pl: "Mój dziadek jest bardzo aktywny, codziennie biega."
        ru: "Мой дедушка очень активный, бегает каждый день."
        source: { kind: authored }
      - pl: "Wulkan jest wciąż aktywny."
        ru: "Вулкан всё ещё действующий."
        source: { kind: authored }
      - pl: "To najaktywniejszy członek klubu."
        ru: "Это самый активный член клуба."
        source: { kind: authored }
  - id: in-use
    ru: "действующий, включённый (о счёте, функции)"
    examples:
      - pl: "Twoje konto jest aktywne."
        ru: "Ваш аккаунт активен."
        source: { kind: authored }
      - pl: "Ta karta nie jest już aktywna."
        ru: "Эта карта больше не действует."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «активный» полное, но польское слово чаще встречается в значении «действующий»: AKTYWNY WULKAN, «действующий вулкан», AKTYWNE KONTO, «активный аккаунт». Противоположность — BIERNY, «пассивный», и в грамматике STRONA BIERNA — «страдательный залог»." }
  - { kind: usage, text: "Полная парадигма: AKTYWNY, AKTYWNIEJSZY, NAJAKTYWNIEJSZY. Все степени живые: AKTYWNIEJSZY TRYB ŻYCIA, NAJAKTYWNIEJSI UCZNIOWIE. Форма для мужчин-людей: AKTYWNI, AKTYWNIEJSI, NAJAKTYWNIEJSI." }
  - { kind: government, text: "Активный в чём-то — AKTYWNY W + местный: AKTYWNY W POLITYCE, W SIECI. Активен на ниве — AKTYWNY NA RZECZ + родительный: «работающий в пользу». Наречие AKTYWNIE — «активно»." }
  - { kind: pronunciation, text: "Читается «акты́вны», три слога, ударение на предпоследнем. TY — твёрдое «ты», без русского «ти». В AKTYWNIEJSZY: «актывне́йшы», с тем же твёрдым «ты»." }
  - { kind: register, text: "Нейтральное слово, частое в спорте, медицине, политике и интернете: AKTYWNY WYPOCZYNEK, «активный отдых», AKTYWNY UŻYTKOWNIK, «активный пользователь»." }
collocations:
  - { pl: "aktywny wypoczynek", ru: "активный отдых" }
  - { pl: "aktywny wulkan", ru: "действующий вулкан" }
  - { pl: "aktywny tryb życia", ru: "активный образ жизни" }
family:
  - { pl: "aktywność", ru: "активность", relation: derived, id: aktywnosc }
  - { pl: "aktywnie", ru: "активно", relation: derived }
  - { pl: "bierny", ru: "пассивный", relation: root }
etymology: "Из латинского activus, «деятельный», от agere «действовать». Тот же корень в польском AKT, AKCJA, AKTOR и в русском «акт», «актёр». Польский оформил его суффиксом -YWNY, как в NEGATYWNY и POZYTYWNY."
memory: "Aktywny — активный; и действующий: aktywny wulkan, aktywne konto. Aktywniejszy, najaktywniejszy. Противоположность — bierny. Читается «акты́вны»."
idioms:
  - { pl: "aktywny wypoczynek", ru: "активный отдых" }
