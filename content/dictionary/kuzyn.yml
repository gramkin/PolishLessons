# review
id: kuzyn
format: 2
lemma: "kuzyn"
rank: 1773
pos: noun
pron: { cyr: "ку́зын" }
senses:
  - id: cousin
    ru: "двоюродный брат, кузен"
    examples:
      - pl: "Tom to mój kuzyn."
        ru: "Том — мой двоюродный брат."
        source: { kind: authored }
      - pl: "Mój kuzyn jest z Egiptu."
        ru: "Мой двоюродный брат из Египта."
        source: { kind: authored }
      - pl: "Mam sześciu kuzynów."
        ru: "У меня шесть двоюродных братьев."
        source: { kind: authored }
  - id: relative
    ru: "родственник (в широком смысле)"
    examples:
      - pl: "Kuzynowie zjechali się z całej Polski."
        ru: "Двоюродные братья собрались со всей Польши."
        source: { kind: authored }
      - pl: "Z kuzynami widuję się raz w roku."
        ru: "С двоюродными братьями я вижусь раз в год."
        source: { kind: authored }
notes:
  - { kind: usage, text: "У этого слова ДВА равноправных именительных множественного: kuzyni и kuzynowie. Оба правильны; вариант на -owie чуть теплее и чаще звучит о родне, вариант на -i нейтрален. Такие пары есть у целого ряда существительных мужского лица (ср. profesorzy и profesorowie)." }
  - { kind: false-friend, text: "Польское kuzyn — слово повседневное, а русское «кузен» книжное и слегка устарелое: по-русски обычно говорят «двоюродный брат». Так что kuzyn почти всегда переводится описательно, хотя заимствование в оба языка пришло из французского." }
  - { kind: government, text: "Родство указывают предлогом: kuzyn ze strony matki «двоюродный брат по матери», kuzyn po ojcu. Женская пара — kuzynka, а kuzynostwo обозначает двоюродных братьев и сестёр вместе." }
collocations:
  - { pl: "mój kuzyn", ru: "мой двоюродный брат" }
  - { pl: "kuzyn ze strony matki", ru: "двоюродный брат по матери" }
  - { pl: "daleki kuzyn", ru: "дальний родственник" }
family:
  - { pl: "kuzynka", ru: "двоюродная сестра", relation: derived }
  - { pl: "kuzynostwo", ru: "двоюродные братья и сёстры", relation: derived }
etymology: "Из французского cousin, а то — от латинского consobrinus «сын материной сестры». В русский то же французское слово пришло как «кузен», но осталось книжным, тогда как польский сделал его обычным, повседневным названием двоюродного родства."
memory: "kuzyn — «двоюродный брат», в польском это обиходное слово, а русское «кузен» книжное. Запомните двойную форму множественного: и kuzyni, и kuzynowie правильны."
idioms:
  - { pl: "daleki kuzyn", ru: "дальний родственник" }
  - { pl: "kuzyn ze strony matki", ru: "двоюродный брат по матери" }
