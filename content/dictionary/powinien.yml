# review
id: powinien
format: 2
lemma: "powinien"
rank: 79
pos: verb
pron: { cyr: "пови́нен" }
senses:
  - id: should
    ru: "должен, следует"
    examples:
      - pl: "Tom powinien spać."
        ru: "Том должен спать."
        source: { kind: tatoeba, id: 6313480 }
      - pl: "Powinna podstrzyc się."
        ru: "Ей надо подстричься."
        source: { kind: tatoeba, id: 4101540 }
      - pl: "Jak powinno być?"
        ru: "Как должно быть?"
        source: { kind: tatoeba, id: 2789391 }
  - id: ought
    ru: "должен (о долге, ожидании)"
    examples:
      - pl: "Nikt nie powinien tego wiedzieć."
        ru: "Никто не должен этого знать."
        source: { kind: tatoeba, id: 8721032 }
      - pl: "Działa jak powinno."
        ru: "Все работает как надо."
        source: { kind: tatoeba, id: 3429316 }
notes:
  - { kind: usage, text: "Ведёт себя как прилагательное: меняется по роду и числу (powinien, powinna, powinni), а личные окончания приклеиваются — powinienem «я должен», powinnaś «ты должна»." }
  - { kind: usage, text: "Прошедшее время образуется добавлением był: powinien był przyjść «он должен был прийти»." }
collocations:
  - { pl: "powinien był", ru: "должен был" }
  - { pl: "tak być powinno", ru: "так и должно быть" }
etymology: "От причастия старого глагола powinąć się «надлежать, случаться»; ср. устаревшее русское «повинен»."
memory: "powinien = «должен» и, как русское «должен/должна/должны», меняется по роду: on powinien, ona powinna, oni powinni. Личное окончание приклеивается к слову: powinienem to zrobić «я должен это сделать»."
idioms:
  - { pl: "powinien był", ru: "должен был" }
  - { pl: "tak być powinno", ru: "так и должно быть" }
