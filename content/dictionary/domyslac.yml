notes:
  - { kind: usage, text: "Глагол живёт только с SIĘ, и это не стилистика, а устройство: DOMYŚLAĆ без SIĘ в польском не употребляется вовсе. Поэтому в карточке все пятьдесят две формы даны с SIĘ, а одиннадцать страдательных причастий пропущены: у возвратного глагола страдательного залога не бывает, и PoliMorf строит DOMYŚLANY механически от основы. Зато безличное DOMYŚLANO SIĘ и отглагольное DOMYŚLANIE SIĘ вполне живые." }
  - { kind: government, text: "Управление — родительный падеж без предлога: DOMYŚLAĆ SIĘ CZEGOŚ. DOMYŚLAM SIĘ PRAWDY значит «я догадываюсь о правде», и предлога «о» здесь нет. Это уже третья карточка подряд, где русский предлог сменяется в польском чистым падежом: OBWINIAĆ меняет «в» на предлог O с винительным, ODMAWIAĆ меняет «в» на чистый родительный, а DOMYŚLAĆ SIĘ меняет на чистый родительный уже «о». Правило для русского простое: не переносите предлог, сначала проверьте, не хватает ли польскому одного падежа. Можно и с союзом: DOMYŚLAM SIĘ, ŻE WIEDZIAŁ." }
  - { kind: false-friend, text: "Существительное из этого гнезда — ловушка. DOMYSŁ значит нейтральное «догадка, предположение»: TO TYLKO DOMYSŁY — «это всего лишь догадки». Русский же «домысел» почти всегда укоризненный, ближе к «выдумка, отсебятина». Так что польское слово слабее и безобиднее русского. А прилагательное DOMYŚLNY значит «догадливый»: ON JEST BARDZO DOMYŚLNY — «он очень догадливый»." }
  - { kind: usage, text: "Второе значение DOMYŚLNY пришло из техники и русскому знакомо по переводу, а не по корню: WARTOŚĆ DOMYŚLNA — это «значение по умолчанию», USTAWIENIA DOMYŚLNE — «настройки по умолчанию». Логика та же, что в живой речи: то, что система «додумывает» сама, когда вы не указали. Прилагательное при этом степени сравнения имеет полные — DOMYŚLNIEJSZY, NAJDOMYŚLNIEJSZY, — но только в значении «догадливый»: настройки догадливее других не бывают." }
collocations:
  - { pl: "domyślać się prawdy", ru: "догадываться о правде" }
  - { pl: "łatwo się domyślić", ru: "легко догадаться" }
