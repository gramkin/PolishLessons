family:
  - { pl: "domyślić", ru: "догадаться", relation: aspect }
  - { pl: "myśleć", ru: "думать", relation: root, id: myslec }
  - { pl: "domysł", ru: "догадка", relation: derived }
etymology: "Приставка do- и MYŚLEĆ «думать», из праславянского *mysliti — то же, что русское «мыслить». Буквально «домыслить, додумать до конца», откуда «догадаться». Русское «домысливать» собрано из тех же частей и значит почти то же, только в русском оно отдаёт произволом, а в польском нет. Из этого гнезда вышли DOMYSŁ «догадка», DOMYŚLNY «догадливый» и DOMYŚLNOŚĆ «догадливость»."
memory: "Только с SIĘ и только с родительным: domyślam się prawdy — без всякого «о». А domysł — это нейтральная «догадка», не русский укоризненный «домысел»."
