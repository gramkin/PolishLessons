notes:
  - { kind: usage, text: "Антоним — ciekawy «интересный», у него своя карточка. Существительное того же корня — nuda «скука»." }
  - { kind: usage, text: "Сравнительная степень — nudniejszy «скучнее», превосходная — najnudniejszy." }
  - { kind: usage, text: "Сравнение nudny jak flaki z olejem «скучный как фляки с маслом» — польский эквивалент русского «скучно до зевоты»." }
  - { kind: false-friend, text: "Не путайте с русским «нудный»: слова однокоренные, но польское nudny нейтрально и значит просто «скучный», без оттенка назойливости." }
collocations:
  - { pl: "nudny film", ru: "скучный фильм" }
  - { pl: "jest nudno", ru: "скучно" }
  - { pl: "nudny jak flaki z olejem", ru: "смертельно скучный" }
etymology: "От nuda «скука», праславянское *nuda «принуждение, тягота». Русское «нудный» — то же самое слово, но в русском оно сдвинулось к значению «назойливый»."
memory: "nudny — «скучный», нейтральное слово. Антоним ciekawy. Не путайте с русским «нудным»: тот про назойливость, а польское — про скуку."
