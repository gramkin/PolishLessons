# review
id: nudny
format: 2
lemma: "nudny"
rank: 1881
pos: adj
pron: { cyr: "ну́дны" }
senses:
  - id: boring-thing
    ru: "скучный (о предмете, занятии)"
    examples:
      - pl: "Szkoła jest nudna."
        ru: "Школа скучная."
        source: { kind: translated, id: 1627372 }
      - pl: "Ta powieść jest nudna."
        ru: "Этот роман скучный."
        source: { kind: translated, id: 768743 }
      - pl: "Moje życie jest nudne."
        ru: "Моя жизнь скучна."
        source: { kind: tatoeba, id: 4954676 }
      - pl: "Czy to nie jest nudne?"
        ru: "Разве это не скучно?"
        source: { kind: tatoeba, id: 3749813 }
      - pl: "Czekanie jest nudne."
        ru: "Ждать скучно."
        source: { kind: translated, id: 8982934 }
      - pl: "Podróżowanie statkiem jest nudne."
        ru: "Путешествовать на корабле скучно."
        source: { kind: translated, id: 631997 }
  - id: boring-person
    ru: "скучный (о человеке)"
    examples:
      - pl: "Jesteś nudny."
        ru: "Ты скучный."
        source: { kind: tatoeba, id: 5664913 }
      - pl: "Tom jest nudny."
        ru: "Том скучный."
        source: { kind: translated, id: 4734433 }
      - pl: "Wszyscy ludzie są nudni."
        ru: "Все люди скучные."
        source: { kind: translated, id: 2178487 }
notes:
  - { kind: usage, text: "Антоним — ciekawy «интересный», у него своя карточка. Существительное того же корня — nuda «скука»." }
  - { kind: usage, text: "Сравнительная степень — nudniejszy «скучнее», превосходная — najnudniejszy." }
  - { kind: usage, text: "Сравнение nudny jak flaki z olejem «скучный как фляки с маслом» — польский эквивалент русского «скучно до зевоты»." }
  - { kind: false-friend, text: "Не путайте с русским «нудный»: слова однокоренные, но польское nudny нейтрально и значит просто «скучный», без оттенка назойливости." }
collocations:
  - { pl: "nudny film", ru: "скучный фильм" }
  - { pl: "jest nudno", ru: "скучно" }
  - { pl: "nudny jak flaki z olejem", ru: "смертельно скучный" }
etymology: "От nuda «скука», праславянское *nuda «принуждение, тягота». Русское «нудный» — то же самое слово, но в русском оно сдвинулось к значению «назойливый»."
memory: "nudny — «скучный», нейтральное слово. Антоним ciekawy. Не путайте с русским «нудным»: тот про назойливость, а польское — про скуку."
idioms:
  - { pl: "nudny film", ru: "скучный фильм" }
  - { pl: "nudny jak flaki z olejem", ru: "смертельно скучный" }
  - { pl: "najnudniejszy dzień", ru: "самый скучный день" }
