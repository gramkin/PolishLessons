# review
id: spowic
format: 2
lemma: "spowić"
rank: 2312
pos: verb
aspect: perf
pron: { cyr: "спо́виць" }
senses:
  - id: shroud
    ru: "окутать, обволочь"
    examples:
      - pl: "Miasto było spowite mgłą."
        ru: "Город был окутан туманом."
        source: { kind: translated, id: 1133674 }
      - pl: "Cały kraj był spowity śniegiem."
        ru: "Вся страна была укрыта снегом."
        source: { kind: translated, id: 1592161 }
      - pl: "Smog spowił Tokio."
        ru: "Смог окутал Токио."
        source: { kind: translated, id: 722098 }
  - id: swaddle
    ru: "спеленать, обвить"
    examples:
      - pl: "Spowiła niemowlę w kocyk."
        ru: "Она спеленала младенца в одеяльце."
        source: { kind: authored }
      - pl: "Mgła spowiła dolinę."
        ru: "Туман окутал долину."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Живёт почти только в причастии: spowity mgłą «окутанный туманом», spowite śniegiem. Личные формы редки." }
  - { kind: government, text: "Чем окутан — ТВОРИТЕЛЬНЫЙ падеж: spowity mgłą, spowity śniegiem." }
  - { kind: false-friend, text: "От powić «спеленать, родить», корень wić «вить». Ср. русское «повить», «пелёнка» — образ обматывания тот же." }
  - { kind: usage, text: "Слово книжное и поэтическое; в обычной речи скажут otoczyć или pokryć. Несовершенный вид — spowijać." }
collocations:
  - { pl: "spowity mgłą", ru: "окутанный туманом" }
  - { pl: "spowić w koc", ru: "укутать в одеяло" }
etymology: "От powić «спеленать», корень wić «вить»; ср. русское «повить», «пелёнка»."
memory: "spowić — «окутать», и встречается почти только в причастии: spowity mgłą «окутанный туманом», с творительным падежом. Слово книжное."
