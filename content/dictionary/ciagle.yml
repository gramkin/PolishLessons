# review
id: ciagle
format: 2
lemma: "ciągle"
rank: 394
pos: adv
pron: { cyr: "цьо́нгле" }
senses:
  - id: constantly
    ru: "постоянно, всё время"
    examples:
      - pl: "Jestem ciągle zajęty."
        ru: "Я постоянно занят."
        source: { kind: tatoeba, id: 350105 }
      - pl: "Ciągle rozmawiam sam z sobą."
        ru: "Я постоянно разговариваю сам с собой."
        source: { kind: tatoeba, id: 1844953 }
      - pl: "Dlaczego ciągle łazienka jest zajęta?"
        ru: "Почему туалет постоянно занят?"
        source: { kind: tatoeba, id: 1348779 }
  - id: still
    ru: "всё ещё, по-прежнему"
    examples:
      - pl: "Ciągle tu jest."
        ru: "Он всё ещё здесь."
        source: { kind: authored }
      - pl: "Ciągle nie wiem."
        ru: "Я всё ещё не знаю."
        source: { kind: authored }
      - pl: "Ciągle czekam na odpowiedź."
        ru: "Я всё ещё жду ответа."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения в одном слове: «постоянно, всё время» (Jestem ciągle zajęty «Я постоянно занят») и «всё ещё, по-прежнему» (Ciągle nie wiem «Я всё ещё не знаю»)." }
  - { kind: usage, text: "Полный синоним — wciąż, в обоих значениях они взаимозаменяемы." }
  - { kind: usage, text: "Часто звучит с раздражением, как русское «вечно»: Ciągle się spóźniasz «Ты вечно опаздываешь»." }
  - { kind: usage, text: "Внутри слова ciąg «непрерывный ряд, тяга», отсюда же ciągnąć «тянуть». ciągle буквально значит «непрерывно»." }
collocations:
  - { pl: "ciągle jeszcze", ru: "всё ещё" }
  - { pl: "ciągle to samo", ru: "вечно одно и то же" }
  - { pl: "ciągle zajęty", ru: "постоянно занят" }
etymology: "От ciąg «тяга, непрерывный ряд», праславянский корень *tęg-; тот же корень, что в русских «тянуть» и «протяжение». ciągle — это «непрерывно»."
memory: "ciągle — «постоянно» и «всё ещё». Внутри ciąg, родня русскому «тянуть»: то, что тянется без перерыва. С досадой переводится как «вечно»: Ciągle się spóźniasz."
idioms:
  - { pl: "ciągle to samo", ru: "вечно одно и то же" }
  - { pl: "ciągle jeszcze", ru: "всё ещё" }
  - { pl: "ciągle i ciągle", ru: "снова и снова" }
