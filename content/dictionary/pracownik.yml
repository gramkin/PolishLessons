# review
id: pracownik
format: 2
lemma: "pracownik"
rank: 1182
pos: noun
pron: { cyr: "працо́вник" }
senses:
  - id: worker
    ru: "работник, сотрудник"
    examples:
      - pl: "To nasz najlepszy pracownik."
        ru: "Это наш лучший сотрудник."
        source: { kind: tatoeba, id: 13694063 }
      - pl: "To rzetelny pracownik."
        ru: "Это добросовестный работник."
        source: { kind: translated, id: 959132 }
      - pl: "Firma uważa go za bardzo użytecznego pracownika."
        ru: "Фирма считает его очень полезным работником."
        source: { kind: translated, id: 951310 }
  - id: be-worker
    ru: "быть работником, работать кем-то"
    examples:
      - pl: "Jestem pracownikiem socjalnym."
        ru: "Я социальный работник."
        source: { kind: tatoeba, id: 2563942 }
      - pl: "Jestem pracownikiem."
        ru: "Я работник."
        source: { kind: translated, id: 12031350 }
  - id: staff
    ru: "работники, персонал"
    examples:
      - pl: "Ilu pracowników zwolniłeś?"
        ru: "Скольких работников ты уволил?"
        source: { kind: translated, id: 10077491 }
      - pl: "Zatrudnił kilku nowych pracowników."
        ru: "Он нанял несколько новых работников."
        source: { kind: translated, id: 2302828 }
notes:
  - { kind: usage, text: "Мужской одушевлённый: винительный совпадает с родительным — widzę pracownika. Множественное о людях — pracownicy." }
  - { kind: usage, text: "Собрано прозрачно: praca «работа» плюс суффикс -ownik, ровно как русский «работник» от «работы»." }
  - { kind: usage, text: "Частые сочетания: pracownik biurowy «офисный работник», pracownik socjalny «социальный работник», pracownik naukowy «научный сотрудник»." }
  - { kind: false-friend, text: "Работодатель — это не pracownik, а pracodawca, буквально «дающий работу». Пара pracownik / pracodawca прозрачнее русской." }
collocations:
  - { pl: "pracownik biurowy", ru: "офисный работник" }
  - { pl: "pracownik socjalny", ru: "социальный работник" }
  - { pl: "zatrudnić pracownika", ru: "нанять работника" }
  - { pl: "pracownicy firmy", ru: "работники фирмы" }
family:
  - { pl: "praca", ru: "работа", relation: root, id: praca }
  - { pl: "pracować", ru: "работать", relation: root, id: pracowac }
  - { pl: "pracodawca", ru: "работодатель", relation: derived }
etymology: "От praca «работа» плюс суффикс -ownik. Русский «работник» собран из тех же частей и тем же способом."
memory: "pracownik — «работник, сотрудник», мужской одушевлённый, множественное pracownicy. А работодатель — pracodawca, буквально «дающий работу»: пара выходит прозрачнее русской."
idioms:
  - { pl: "pracownik biurowy", ru: "офисный работник" }
  - { pl: "pracownicy firmy", ru: "работники фирмы" }
