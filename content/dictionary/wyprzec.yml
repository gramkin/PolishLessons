# review
id: wyprzec
format: 2
lemma: "wyprzeć"
rank: 2340
pos: verb
aspect: perf
pron: { cyr: "вы́пшець" }
senses:
  - id: displace
    ru: "вытеснить, заместить"
    examples:
      - pl: "Czy uważasz, że książka elektroniczna wyprze papierową?"
        ru: "Считаешь ли ты, что электронная книга вытеснит бумажную?"
        source: { kind: tatoeba, id: 965034 }
      - pl: "Parowozy zostały wyparte przez lokomotywy elektryczne."
        ru: "Паровозы были вытеснены электровозами."
        source: { kind: translated, id: 5229168 }
      - pl: "Napędy dyskietek zostały już wyparte przez napędy CD."
        ru: "Дисководы уже вытеснены приводами CD."
        source: { kind: translated, id: 7255257 }
  - id: deny
    ru: "отречься, отпереться (wyprzeć się)"
    examples:
      - pl: "Moi rodzice wyparliby się mojego brata, gdyby odkryli, że jest gejem."
        ru: "Мои родители отреклись бы от брата, если бы узнали, что он гей."
        source: { kind: translated, id: 3090844 }
      - pl: "Zanim kur zapieje, trzy razy się mnie wyprzesz."
        ru: "Прежде чем пропоёт петух, трижды отречёшься от меня."
        source: { kind: translated, id: 12696366 }
notes:
  - { kind: usage, text: "Два разных глагола в одном: без się — «вытеснить» (обычно в страдательном: zostać wypartym przez coś), с się — «отречься от кого-л.», с родительным падежом." }
  - { kind: government, text: "Отречься от кого-л. — wyprzeć się kogoś, РОДИТЕЛЬНЫЙ падеж. Вытеснить чем-л. — przez coś, с винительным после przez." }
  - { kind: false-friend, text: "wy- + przeć «напирать», та же семья, что odeprzeć. Русское «выпереть» просторечно и значит другое — «вытолкать»." }
  - { kind: usage, text: "Несовершенный вид — wypierać (się). В психологии wyparcie значит «вытеснение»." }
  - { kind: government, text: "Прошедшее время у этого глагола — wyparł, wyparła, wyparli, а будущее — wyprze, wyprą; повелительное wyprzyj. Отглагольное существительное — wyparcie, и в психологии оно значит «вытеснение»." }
collocations:
  - { pl: "wyprzeć się kogoś", ru: "отречься от кого-л." }
  - { pl: "zostać wypartym", ru: "быть вытесненным" }
etymology: "wy- + przeć «напирать», та же семья, что odeprzeć."
memory: "wyprzeć — «вытеснить», а wyprzeć się kogoś — «отречься от кого-л.», с родительным падежом. Две почти разные жизни у одного глагола."
idioms:
  - { pl: "wyprzeć się kogoś", ru: "отречься от кого-л." }
