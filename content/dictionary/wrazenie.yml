# review
id: wrazenie
format: 2
lemma: "wrażenie"
rank: 1021
pos: noun
pron: { cyr: "вражэ́не" }
senses:
  - id: impression
    ru: "впечатление"
    examples:
      - pl: "Ta książka zrobiła na mnie mocne wrażenie."
        ru: "Эта книга произвела на меня сильное впечатление."
        source: { kind: translated, id: 5733255 }
      - pl: "Zrobił dobre wrażenie."
        ru: "Он произвёл хорошее впечатление."
        source: { kind: translated, id: 4885129 }
      - pl: "Jakie są twoje wrażenia z Ameryki?"
        ru: "Какие у тебя впечатления от Америки?"
        source: { kind: translated, id: 355240 }
  - id: seem
    ru: "mam wrażenie, że… — у меня ощущение, что…"
    note: "Русскому «мне кажется» чаще всего отвечает именно этот оборот."
    examples:
      - pl: "Mam wrażenie, jakbym tu kiedyś był."
        ru: "Такое впечатление, будто я здесь уже бывал."
        source: { kind: translated, id: 676222 }
      - pl: "Robi wrażenie uczciwego."
        ru: "Он производит впечатление честного человека."
        source: { kind: translated, id: 361924 }
      - pl: "Mam wrażenie, że się znamy."
        ru: "У меня ощущение, что мы знакомы."
        source: { kind: authored }
  - id: impressed
    ru: "być pod wrażeniem — быть под впечатлением"
    examples:
      - pl: "Jestem pod wrażeniem."
        ru: "Я под впечатлением."
        source: { kind: translated, id: 352188 }
      - pl: "Tom był pod wrażeniem."
        ru: "Том был под впечатлением."
        source: { kind: translated, id: 8772645 }
      - pl: "Jesteś pod wrażeniem?"
        ru: "Ты под впечатлением?"
        source: { kind: translated, id: 957075 }
notes:
  - { kind: government, text: "być pod wrażeniem — «быть под впечатлением», предлог pod с творительным падежом, ровно как в русском." }
  - { kind: usage, text: "robić wrażenie — «производить впечатление»: zrobił dobre wrażenie. А robić wrażenie kogoś значит «производить впечатление кого-то»: robi wrażenie uczciwego «производит впечатление честного»." }
  - { kind: usage, text: "Mam wrażenie, że… — «у меня ощущение, что…». Это самый обычный способ сказать по-польски «мне кажется»." }
  - { kind: usage, text: "mocne wrażenia — «острые ощущения», pełen wrażeń — «полный впечатлений», pierwsze wrażenie — «первое впечатление»." }
collocations:
  - { pl: "robić wrażenie", ru: "производить впечатление" }
  - { pl: "pod wrażeniem", ru: "под впечатлением" }
  - { pl: "mam wrażenie, że", ru: "у меня ощущение, что" }
  - { pl: "pierwsze wrażenie", ru: "первое впечатление" }
family:
  - { pl: "wrażliwy", ru: "чувствительный", relation: derived }
  - { pl: "wrazić", ru: "вонзить, врезать", relation: root }
etymology: "От wrazić «вонзить, врезать»: впечатление — это то, что врезалось. Русское «впечатление» построено на той же метафоре, только от «печать» — то, что отпечаталось."
memory: "wrażenie — «впечатление». Запомните три оборота: robić wrażenie «производить впечатление», być POD wrażeniem «быть под впечатлением» (предлог pod, как в русском) и mam wrażenie, że… — обычный польский способ сказать «мне кажется»."
idioms:
  - { pl: "robić wrażenie", ru: "производить впечатление" }
  - { pl: "być pod wrażeniem", ru: "быть под впечатлением" }
  - { pl: "mocne wrażenia", ru: "острые ощущения" }
  - { pl: "pełen wrażeń", ru: "полный впечатлений" }
formExamplesSkip:
  - { form: "wrażeniu", reason: "дательный и предложный единственного числа вытеснены оборотом pod wrażeniem" }
  - { form: "wrażenia", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
