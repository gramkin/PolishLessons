# review
id: dobiec
format: 2
lemma: "dobiec"
rank: 4472
pos: verb
pron: { cyr: "до́бец" }
senses:
  - id: run-to
    ru: "добежать"
    examples:
      - pl: "Dobiegł do mety pierwszy."
        ru: "Он первым добежал до финиша."
        source: { kind: authored }
      - pl: "Dobiegła do przystanku zdyszana."
        ru: "Она добежала до остановки, запыхавшись."
        source: { kind: authored }
      - pl: "Dobiegnij do mety, dasz radę!"
        ru: "Добеги до финиша, ты сможешь!"
        source: { kind: authored }
  - id: reach-sound
    ru: "донестись (о звуке)"
    examples:
      - pl: "Z ulicy dobiegł krzyk."
        ru: "С улицы донёсся крик."
        source: { kind: authored }
      - pl: "Z oddali dobiegły odgłosy wystrzałów."
        ru: "Издалека донеслись звуки выстрелов."
        source: { kind: authored }
  - id: end
    ru: "DOBIEC KOŃCA — подойти к концу"
    examples:
      - pl: "Wakacje dobiegły końca."
        ru: "Каникулы подошли к концу."
        source: { kind: authored }
      - pl: "Rozmowa dobiegła końca."
        ru: "Разговор подошёл к концу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DOBIEC — «добежать», но о звуках — «донестись»: Z ULICY DOBIEGŁ KRZYK. DOBIEC KOŃCA — «подойти к концу». Русское «добить» — DOBIĆ." }
  - { kind: usage, text: "Сорок одна форма: редкий вариант инфинитива «dobiegnąć» и безличная форма в карточку не включены. Будущее с -N-: DOBIEGNĘ, DOBIEGNIESZ, повелительное DOBIEGNIJ; прошедшее — DOBIEGŁ, DOBIEGLI; деепричастие — DOBIEGŁSZY. Несовершенный вид — DOBIEGAĆ: DOBIEGA PIĘĆDZIESIĄTKI «ему под пятьдесят»." }
  - { kind: government, text: "Куда — DO с родительным: DOBIEC DO METY; NA с винительным: NA PERON. Откуда донёсся звук — Z с родительным: Z KUCHNI. Чего — родительный в DOBIEC KOŃCA." }
  - { kind: pronunciation, text: "Читается «до́бец», ударение на первом слоге. DOBIEGNĘ — «добе́гнэ», DOBIEGŁ — «до́бегу»." }
  - { kind: register, text: "Нейтральное слово. DOBIEC KOŃCA и о звуках — книжное. В разговоре: DOBIEC DO AUTOBUSU «успеть добежать до автобуса»." }
collocations:
  - { pl: "dobiec do mety", ru: "добежать до финиша" }
  - { pl: "dobiec końca", ru: "подойти к концу" }
  - { pl: "dobiegł krzyk", ru: "донёсся крик" }
family:
  - { pl: "biec", ru: "бежать", relation: root, id: biec }
  - { pl: "biegać", ru: "бегать", relation: derived, id: biegac }
  - { pl: "dobiegać", ru: "добегать; доноситься", relation: aspect }
etymology: "Приставка DO- «до-» плюс BIEC «бежать», праславянское *běgti. Русское «добежать», «бег» — то же гнездо."
memory: "Dobiec do mety — добежать до финиша. Dobiegł krzyk — донёсся крик. Dobiec końca — подойти к концу. Читается «до́бец»."
idioms:
  - { pl: "dobiec końca", ru: "подойти к концу" }
formExamplesSkip:
