pos: noun
pron: { cyr: "ха́уас" }
senses:
  - id: noise
    ru: "шум, гам (неприятный)"
    examples:
      - pl: "Hałas z ulicy nie pozwalał spać."
        ru: "Шум с улицы не давал спать."
        source: { kind: authored }
      - pl: "Nie znoszę hałasu."
        ru: "Я не выношу шума."
        source: { kind: authored }
  - id: din
    ru: "грохот, галдёж"
    examples:
      - pl: "Dziwne hałasy dobiegały z piwnicy."
        ru: "Странные шумы доносились из подвала."
        source: { kind: authored }
      - pl: "Drzwi zamknęły się z hałasem."
        ru: "Дверь закрылась с грохотом."
        source: { kind: authored }
  - id: fuss
    ru: "шумиха, скандал"
    examples:
      - pl: "Narobili hałasu o drobiazg."
        ru: "Они подняли шум из-за пустяка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКИЙ «ШУМ» ПОЛЬСКИЙ ДЕЛИТ НАДВОЕ. HAŁAS — это шум неприятный, мешающий: гам, грохот, галдёж. А SZUM — шум ровный и чаще приятный: szum morza «шум моря», szum drzew «шум деревьев». Сказать szum z ulicy о грохоте машин нельзя, нужно hałas." }
  - { kind: usage, text: "Предложный — HAŁASIE, с мягким si: w hałasie. Глагол hałasować значит «шуметь», прилагательное hałaśliwy — «шумный». Название шекспировской комедии в обоих языках построено одинаково: Wiele hałasu o nic, «Много шума из ничего»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: HA-łas. Польское h читается как русское х, ł как краткое у: «ха́уас». Конечное s глухое и короткое." }
collocations:
  - { pl: "robić hałas", ru: "шуметь, поднимать шум" }
  - { pl: "wiele hałasu o nic", ru: "много шума из ничего" }
  - { pl: "hałas uliczny", ru: "уличный шум" }
family:
  - { pl: "hałasować", ru: "шуметь", relation: derived }
  - { pl: "cisza", ru: "тишина", relation: antonym, id: cisza }
  - { pl: "szum", ru: "шум (ровный)", relation: root, id: szum }
etymology: "Слово звукоподражательное. Тот же корень в чешском halas и украинском «галас» «крик, шум». Родство с «голос» этимологи предполагают, но надёжно оно не доказано, и вернее считать это самостоятельным подражанием гулу голосов."
memory: "hałas — «шум», но именно неприятный: грохот, галдёж. Ровный и приятный шум по-польски szum: szum morza. Предложный — w hałasie. И помни заглавие: Wiele hałasu o nic."
idioms:
  - { pl: "wiele hałasu o nic", ru: "много шума из ничего" }
  - { pl: "narobić hałasu", ru: "поднять шум" }
