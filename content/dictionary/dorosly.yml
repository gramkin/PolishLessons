# review
id: dorosly
format: 2
lemma: "dorosły"
rank: 1619
pos: adj
pron: { cyr: "доро́суы" }
senses:
  - id: adult-adj
    ru: "взрослый (прилагательное)"
    examples:
      - pl: "Motyl to dorosła postać gąsienicy."
        ru: "Бабочка - это зрелая гусеница."
        source: { kind: tatoeba, id: 367825 }
      - pl: "Tom jest dorosły."
        ru: "Том взрослый."
        source: { kind: translated, id: 4735521 }
      - pl: "Ona jest dorosła, więc tak powinieneś ją traktować."
        ru: "Она взрослая, так что тебе следует так к ней и относиться."
        source: { kind: translated, id: 940949 }
  - id: adult-noun
    ru: "взрослый (в значении существительного)"
    examples:
      - pl: "Tylko dla dorosłych."
        ru: "Только для взрослых."
        source: { kind: translated, id: 362994 }
      - pl: "To film dla dorosłych."
        ru: "Это фильм для взрослых."
        source: { kind: translated, id: 354069 }
      - pl: "Wszyscy dorośli byli kiedyś dziećmi."
        ru: "Все взрослые когда-то были детьми."
        source: { kind: translated, id: 6483108 }
notes:
  - { kind: usage, text: "Прилагательное свободно работает как существительное: dorośli «взрослые», dla dorosłych «для взрослых», film dla dorosłych «фильм для взрослых». В русском ровно так же." }
  - { kind: false-friend, text: "Формы dorosły и dorosła совпадают с прошедшим временем глагола dorosnąć «вырасти»: Jego dzieci dorosły — это «его дети выросли», а не «взрослые дети»." }
  - { kind: usage, text: "Лично-мужская форма множественного — dorośli: Jesteśmy dorośli «Мы взрослые»." }
  - { kind: usage, text: "Сравнительная степень doroślejszy в корпусе не встречается; обычно говорят bardziej dorosły." }
collocations:
  - { pl: "dla dorosłych", ru: "для взрослых" }
  - { pl: "osoba dorosła", ru: "взрослый человек" }
  - { pl: "film dla dorosłych", ru: "фильм для взрослых" }
etymology: "Приставка do- + rosnąć «расти» — буквально «доросший». Русское «взрослый» от «взрасти» собрано той же метафорой роста, только с другой приставкой."
memory: "dorosły = «взрослый», буквально «доросший» (do- + rosnąć). Как и в русском, слово легко становится существительным: dorośli «взрослые», dla dorosłych «для взрослых». Осторожно: dorosły и dorosła — ещё и прошедшее время глагола dorosnąć «вырасти»."
idioms:
