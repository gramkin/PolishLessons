notes:
  - { kind: false-friend, text: "Одно польское слово покрывает два русских, и они из разных миров. WSPÓLNIK W INTERESACH это «компаньон, партнёр по делу», слово вполне деловое и нейтральное; WSPÓLNIK W ZBRODNI это «соучастник, сообщник», слово уголовное. По-польски это буквально одно и то же понятие — тот, с кем общее дело, — и уголовный смысл берётся только из контекста, из слова рядом. Русский же развёл эти роли по разным корням: «компаньон» из французского, «соучастник» от «участия». Поэтому переводить WSPÓLNIK вслепую нельзя, надо сначала посмотреть, какое дело имеется в виду. Ровно та же картина была в слове CELA, где одно польское слово отвечало «камере» и «келье»." }
  - { kind: government, text: "Мужской род, одушевлённое, лицо. Винительный равен родительному: SZUKAŁ WSPÓLNIKA. Местный и звательный совпадают в форме WSPÓLNIKU. В чём совладение — предлог W с местным: WSPÓLNIK W INTERESACH, WSPÓLNIK W ZBRODNI. Чьим компаньоном — родительный без предлога: WSPÓLNIK SPÓŁKI, WSPÓLNIK MOJEGO OJCA. В именительном множественного обязательно WSPÓLNICY, с чередованием K в C, потому что это мужское лицо; формы WSPÓLNIKI не существует. Родительный множественного WSPÓLNIKÓW." }
  - { kind: pronunciation, text: "Читается «фспу́льник», ударение на предпоследнем слоге из трёх. Начальное W перед глухим S оглушается в «ф», и это обычное польское уподобление: не «вспульник», а «фспульник». Буква Ó звучит «у», а не «о». Буква L мягкая, отсюда «ль». В именительном множественного WSPÓLNICY сочетание CY читается «цы»: «фспу́льницы». В местном WSPÓLNIKU звучит «фспу́льнику», ударение остаётся на предпоследнем слоге." }
  - { kind: usage, text: "Суффикс -NIK обозначает лицо по занятию и отвечает русскому -НИК почти буква в букву: ROBOTNIK и «работник», ROLNIK и «земледелец» через ту же модель, OGRODNIK и «огородник», PRACOWNIK «сотрудник». Поэтому WSPÓLNIK разбирается как «совместник», тот, кто в общем деле. Частотные сочетания: WSPÓLNIK W INTERESACH, GŁÓWNY WSPÓLNIK «главный компаньон», WSPÓLNIK SPÓŁKI, CICHY WSPÓLNIK «негласный компаньон». В уголовном смысле рядом стоит WSPÓŁSPRAWCA, более официальное слово для соучастника, и в приговорах пишут именно его." }
