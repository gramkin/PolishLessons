etymology: "От прилагательного WSPÓLNY «общий, совместный» с суффиксом -NIK, обозначающим лицо. WSPÓLNY, в свою очередь, идёт от старого наречия SPOŁEM «вместе, сообща», которое собрано из приставки S- и корня *polъ «сторона, половина» — то есть исходно «по одной стороне, пополам». Русскому этот корень знаком с другой стороны: «пол», «половина», «пополам», «вполовину». В польском из того же гнезда вышли SPÓŁKA «товарищество», SPOŁECZNY «общественный», SPOŁECZEŃSTWO «общество», WSPÓLNOTA «общность». Русский для той же мысли выбрал «вместе» и «общий», так что польское «общее дело» построено на делении надвое, а русское — на совместности, и совпадают они только в значении. Суффикс -NIK отвечает русскому -НИК, как в ROBOTNIK и «работник»."
memory: "Одно слово на две роли: wspólnik w interesach — «компаньон», wspólnik w zbrodni — «соучастник». Различает только контекст, как у cela, где одно слово отвечало «камере» и «келье». Именительный множественного обязательно wspólnicy, с k→c, потому что это мужское лицо; wspólniki не существует. Начальное W перед S оглушается: «фспу́льник». Корень — через wspólny и społem от *polъ «сторона, половина», знакомого русскому по «пополам»."
