etymology: "Праславянское слово, давшее и русский «уголь»: это один и тот же корень, и здесь видно самое полезное соответствие между языками. Польский удержал носовой гласный там, где русский его потерял: WĘGIEL против «угля», DĄB против «дуба», RĘKA против «руки», PIĘĆ против «пяти». Правило простое: где у поляка Ę или Ą, у нас стоит У или Я. Узнав его, вы будете угадывать десятки слов с первого взгляда."
memory: "Уголь, и слово то же, что русское. Главное правило из этой карточки шире самого слова: польские носовые e и a с хвостиком отвечают русским у и я — wegiel при «угле», dab при «дубе», reka при «руке», piec при «пяти». Читается «ве́нгель». Беглое e выпадает: wegiel, но wegla. И wegiel это ещё и углерод, отдельного слова для элемента у поляков нет."
idioms:
