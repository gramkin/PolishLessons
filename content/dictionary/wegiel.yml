notes:
  - { kind: false-friend, text: "Слово то же, что русский «уголь», но есть и расхождение в значении. Польское WĘGIEL называет и уголь, и химический элемент, который по-русски «углерод»: WĘGIEL W ORGANIZMIE значит именно углерод. Отдельного слова для элемента у поляков нет. Запомните и то, что KAMIEŃ WĘGIELNY значит «краеугольный камень», а не «каменный уголь»: каменный уголь — это WĘGIEL KAMIENNY, с обратным порядком слов." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В основе беглое E, которое выпадает во всех косвенных падежах: WĘGIEL, но WĘGLA, WĘGLEM, WĘGLU. Множественное WĘGLE значит уже не топливо вообще, а отдельные угольки в печи или в гриле: WĘGLE SIĘ TLIŁY. Так же устроены и другие слова на -IEL." }
  - { kind: government, text: "Рисовать углём — RYSOWAĆ WĘGLEM, творительный без предлога, как и по-русски. Шахта угля — KOPALNIA WĘGLA, родительный без предлога. На угольях — NA WĘGLACH, местный множественного, и именно так говорят о готовке на гриле. Тонна угля — TONA WĘGLA, родительный." }
  - { kind: pronunciation, text: "Читается «ве́нгель», два слога, ударение на первом. Носовой Ę перед G даёт «эн», поэтому первый слог это «вен». Сочетание GIE даёт «ге», мягкое. Конечная L перед концом слова звучит «ль». В косвенных падежах беглое E пропадает: WĘGLA звучит «ве́нгля», а WĘGLEM — «ве́нглем»." }
  - { kind: register, text: "Слово нейтральное и в Польше очень весомое: WĘGIEL KAMIENNY был главным богатством страны, и о нём говорят в новостях постоянно. В быту это WĘGIEL DRZEWNY для гриля и WĘGLE в печи. В рисовании WĘGIEL это тот же уголь, которым рисуют, и RYSUNEK WĘGLEM значит «рисунок углём»." }
