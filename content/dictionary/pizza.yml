notes:
  - { kind: pronunciation, text: "Читается «пицца»: сочетание zz передаёт звук ц, как в итальянском оригинале." }
  - { kind: usage, text: "Слово полностью вошло в польское женское склонение: pizza, pizzy, pizzę, pizzą." }
  - { kind: government, text: "Заказать пиццу — zamówić pizzę (винительный падеж); кусок пиццы — kawałek pizzy (родительный)." }
  - { kind: usage, text: "dostawca pizzy — «доставщик пиццы», pizzeria — «пиццерия»." }
collocations:
  - { pl: "zamówić pizzę", ru: "заказать пиццу" }
  - { pl: "kawałek pizzy", ru: "кусок пиццы" }
  - { pl: "dostawca pizzy", ru: "доставщик пиццы" }
family:
  - { pl: "pizzeria", ru: "пиццерия", relation: root }
etymology: "Прямое заимствование из итальянского pizza, как и русское «пицца». Польский просто включил его в женское склонение."
memory: "pizza — «пицца», читается «пицца». Склоняется как своё слово: zamówię pizzę «закажу пиццу», kawałek pizzy «кусок пиццы»."
idioms:
  - { pl: "zamówić pizzę", ru: "заказать пиццу" }
  - { pl: "kawałek pizzy", ru: "кусок пиццы" }
  - { pl: "pizza na wynos", ru: "пицца навынос" }
