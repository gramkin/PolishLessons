etymology: "Из праславянского *vesna, того же слова, что русская «весна». Различие только в огласовке: польский перед твёрдым N развил io на месте старого e, отсюда WIOSNA против «весны»; то же соответствие видно в WIOSŁO и «весле», в WIOZĘ и «везу». Суффикс -NA здесь часть древней основы, а не продуктивное образование. Второе значение, счёт лет по вёснам, восходит к поэтической традиции и существует в обоих языках одинаково: «прожила восемьдесят вёсен» звучит по-русски так же книжно, как PRZEŻYŁA OSIEMDZIESIĄT WIOSEN по-польски. Историческое WIOSNA LUDÓW — калька французского PRINTEMPS DES PEUPLES, и русский перевёл то же выражение тем же способом."
memory: "Прямая пара к «весне», с регулярным соответствием wio- против ве-: wiosło «весло», wiozę «везу». Дательный и местный wiośnie, с s→ś. Родительный множественного wiosen, с беглой e — и это один из трёх разных вариантов в этой карточке: trosk нулевой, trumien со вставным -ie-. «Весной» двумя способами: na wiosnę и wiosną, оба равно обычны."
