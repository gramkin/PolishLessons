notes:
  - { kind: usage, text: "Два места в склонении стоит заметить. В дательном и местном единственного S смягчается в Ś: WIOŚNIE, а не «wiosnie». Такое смягчение перед окончанием -IE обычно для основ на S: так же PROŚBA даёт PROŚBIE, а SOSNA — SOŚNIE. В родительном множественного появляется беглая гласная E, разбивающая скопление SN: WIOSEN, а не «wiosn». Это стоит сопоставить с двумя соседями по карточке: TROSKA даёт TROSK с нулевым окончанием и без вставки, а TRUMNA даёт TRUMIEN со вставным -IE-. Три женских слова, три разных родительных множественного, и по виду именительного ни одно не угадывается." }
  - { kind: false-friend, text: "Прямое соответствие русской «весне», из общего праславянского слова, и ошибиться в значении негде. Расходится только огласовка корня: польский дал WIO- там, где русский даёт ВЕ-, и это регулярное соответствие, то же, что в WIOSŁO «весло» и WIOZĘ «везу». Поэтому, встретив в польском WIO-, пробуйте подставить русское ВЕ-. Запомнить стоит, что «весной» по-польски передаётся двумя способами: NA WIOSNĘ с винительным и WIOSNĄ творительным, причём оба равно обычны. Прилагательное WIOSENNY значит «весенний», а не «вешний»." }
  - { kind: government, text: "Женский род. «Весной» — либо NA с винительным, NA WIOSNĘ, либо творительный без предлога, WIOSNĄ; разница стилистическая, не смысловая. «К весне» — DO с родительным: DO WIOSNY. «О весне» — O с местным: O WIOŚNIE. Частотные сочетания: WCZESNA WIOSNA «ранняя весна», PÓŹNA WIOSNA, PIERWSZY DZIEŃ WIOSNY «первый день весны», WIOSNA LUDÓW — историческое название событий тысяча восемьсот сорок восьмого года, по-русски «Весна народов». Прилагательное — WIOSENNY." }
  - { kind: pronunciation, text: "Читается «вё́сна», два слога, ударение на первом. Сочетание WIO даёт «вё», одним слогом: буква I здесь не гласная, а знак мягкости предшествующего W. Группа SN выговаривается слитно. В дательном и местном WIOŚNIE буква Ś даёт мягкое «сь», и форма звучит «вё́сьне». В родительном множественного WIOSEN вставная E читается «э»: «вё́сэн». Все три формы различаются на слух отчётливо." }
