etymology: "Из французского. Русское «массаж» — из того же источника. Польский сохранил французское Ж на конце слова, но оглушает его."
memory: "Masaż — массаж, читается «ма́саш». Iść na masaż — пойти на массаж. Masaż pleców — массаж спины. Masować — массировать."
