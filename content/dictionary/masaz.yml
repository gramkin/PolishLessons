notes:
  - { kind: false-friend, text: "MASAŻ — «массаж», но с одним S и с Ż на конце, которое оглушается: «ма́саш». Массировать — MASOWAĆ, массажист — MASAŻYSTA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — MASAŻU. Во множественном — MASAŻE, в родительном множественного две формы: MASAŻY и MASAŻÓW." }
  - { kind: government, text: "Пойти на массаж — IŚĆ NA MASAŻ, NA с винительным. Массаж чего — родительный: MASAŻ PLECÓW, MASAŻ STÓP. Записаться на массаж — ZAPISAĆ SIĘ NA MASAŻ." }
  - { kind: pronunciation, text: "Читается «ма́саш», ударение на первом слоге. Конечное Ż оглушается в «ш». В форме MASAŻU: «маса́жу»." }
collocations:
