# review
id: nieco
format: 2
lemma: "nieco"
rank: 1206
pos: adv
pron: { cyr: "не́цо" }
senses:
  - id: slightly
    ru: "немного, слегка, чуть"
    examples:
      - pl: "Mój ojciec jest nieco staromodny."
        ru: "Мой отец немного старомоден."
        source: { kind: tatoeba, id: 348706 }
      - pl: "Dzień był bezchmurny i nieco chłodny."
        ru: "День был безоблачный и прохладный."
        source: { kind: tatoeba, id: 6106117 }
      - pl: "Esej Toma był za krótki, więc postanowił go nieco rozwinąć."
        ru: "Эссе Тома было слишком короткое, поэтому он решил его немного развернуть."
        source: { kind: tatoeba, id: 10977004 }
  - id: a-bit
    ru: "немного (с прилагательным или причастием)"
    examples:
      - pl: "Byłem nieco zajęty."
        ru: "Я был немного занят."
        source: { kind: translated, id: 3780241 }
      - pl: "Byłem nieco zaskoczony."
        ru: "Я был немного удивлён."
        source: { kind: translated, id: 352901 }
notes:
  - { kind: usage, text: "Наречие степени: nieco zmęczony «немного уставший», nieco później «чуть позже». В реестре слово помечено как числительное, но ведёт себя как наречие." }
  - { kind: usage, text: "Рядом стоят trochę и troszkę с тем же значением; nieco заметно книжнее и в разговоре встречается реже." }
  - { kind: usage, text: "Разбирается прозрачно: nie + co, буквально «не что», то есть «самая малость»." }
  - { kind: usage, text: "co nieco значит «кое-что, немножко»: Zjedzmy co nieco «Перекусим чего-нибудь»." }
collocations:
  - { pl: "nieco później", ru: "чуть позже" }
  - { pl: "nieco inaczej", ru: "немного иначе" }
  - { pl: "co nieco", ru: "кое-что, немножко" }
family:
  - { pl: "trochę", ru: "немного", relation: derived }
  - { pl: "co", ru: "что", relation: root, id: co }
etymology: "Из nie + co, буквально «не что» — то есть «самая малость». Русское «нечто» собрано из тех же частей, но пошло в другую сторону, к значению «некий предмет»."
memory: "nieco — «немного, слегка», книжнее разговорных trochę и troszkę. Оборот co nieco значит «кое-что, немножко»: Zjedzmy co nieco «Перекусим чего-нибудь»."
idioms:
  - { pl: "co nieco", ru: "кое-что, немножко" }
  - { pl: "nieco później", ru: "чуть позже" }
