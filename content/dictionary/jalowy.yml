# review
id: jalowy
format: 2
lemma: "jałowy"
rank: 5462
pos: adj
pron: { cyr: "яуо́вы" }
senses:
  - id: barren
    ru: "бесплодный, пустой (о споре, усилиях)"
    examples:
      - pl: "Dyskusja na ten temat jest jałowa."
        ru: "Дискуссия на эту тему бесплодна."
        source: { kind: translated, id: 756466 }
      - pl: "To jałowy spór."
        ru: "Это бесплодный спор."
        source: { kind: authored }
      - pl: "Jałowe dyskusje nic nie dają."
        ru: "Пустые дискуссии ничего не дают."
        source: { kind: authored }
  - id: sterile
    ru: "стерильный; неплодородный (о почве)"
    examples:
      - pl: "Ziemia tu jest jałowa."
        ru: "Земля здесь неплодородная."
        source: { kind: authored }
      - pl: "Opatrunek musi być jałowy."
        ru: "Повязка должна быть стерильной."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Три круга значений: бесплодный спор, неплодородная земля и стерильный материал в медицине." }
  - { kind: false-friend, text: "Не «жалкий» и не «вялый». Корень тот же, что в jałowiec «можжевельник» и в русском «яловый» — о корове, не дающей телят." }
  - { kind: government, text: "Обычное прилагательное на -y; наречие — jałowo." }
  - { kind: usage, text: "bieg jałowy «холостой ход» — технический оборот, где значение «впустую» видно прямо." }
  - { kind: government, text: "Мужско-личной формы jałowi не бывает: слово говорится о споре, земле или стерильном материале, а о человеке в этом значении — bezpłodny." }
collocations:
  - { pl: "jałowy spór", ru: "бесплодный спор" }
  - { pl: "bieg jałowy", ru: "холостой ход" }
etymology: "Праславянское *jalovъ «бесплодный»; русское «яловый» — то же слово, о корове без телёнка."
memory: "jałowy — «бесплодный, пустой», а в медицине «стерильный». Русское «яловый» — прямое соответствие. Отсюда bieg jałowy «холостой ход»."
idioms:
  - { pl: "jałowy spór", ru: "бесплодный спор" }
  - { pl: "bieg jałowy", ru: "холостой ход" }
formExamplesSkip:
  - { form: "jałowi", reason: "мужско-личная форма множественного числа, а jałowy описывает спор, землю или медицинский материал: jałowy spór, jałowa ziemia, jałowy opatrunek. О бесплодном человеке говорят bezpłodny, и связь со словом «яловый» о корове тоже уводит от людей, поэтому формы jałowi в текстах не бывает" }
