etymology: "Сложено из приставки NA-, корня SZYJA и суффикса -NIK: буквально «нашейник», то, что носят на шее. SZYJA идёт из праславянского *šija, и русское «шея» — то же слово. Суффикс -NIK обозначает предмет по назначению и отвечает русскому -НИК в «чайнике» и «ошейнике»; показательно, что русский тем же суффиксом и от того же образа построил именно «ошейник», но для украшения взял другое слово — «ожерелье», от старого «жерло» в значении «горло». Так два языка, располагая одинаковыми средствами, назвали украшение по шее и по горлу соответственно. Польское OBROŻA, кстати, и означает «ошейник», так что распределение значений в двух языках вышло перекрёстным."
memory: "Разбирается на части: na + szyja + -nik, «то, что на шее». Русское «ожерелье» построено на старом «жерло» — горле, так что по русскому слову польское не угадать. Зато суффикс -nik тот же, что в «ошейнике» и «чайнике». Осторожно: obroża — это ошейник для животного, а не украшение. Местный падеж на -u: w naszyjniku. Y читается «ы»: «нашы́йник»."
