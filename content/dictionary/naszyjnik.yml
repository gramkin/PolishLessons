notes:
  - { kind: false-friend, text: "Оба языка назвали украшение по части тела, но по разным частям. Польский взял SZYJA «шея» и построил NASZYJNIK — буквально «то, что на шее», с приставкой NA- и суффиксом -NIK. Русский построил «ожерелье» на старом «жерло», то есть на горле, и этот корень сегодня виден только в «жерле» вулкана. Поэтому угадать польское слово по русскому нельзя, зато разобрать его на части можно сразу: NA плюс SZYJA плюс -NIK. Рядом в гнезде SZYJKA «шейка», в том числе у бутылки, и NASZYJNIK не путайте с OBROŻA — это ошейник для животного, а не украшение." }
  - { kind: usage, text: "Мужской род, неодушевлённое, склонение без чередований. Суффикс -NIK обозначает предмет по назначению и чрезвычайно продуктивен: CZAJNIK «чайник», SŁOWNIK «словарь», PODRĘCZNIK «учебник». Местный падеж здесь на -U: W NASZYJNIKU, потому что основа кончается на K. Форма NASZYJNIKA служит родительным единственного, а винительный ей равен не будет, потому что слово неодушевлённое: WIDZIAŁ NASZYJNIK. Родительный множественного — NASZYJNIKÓW." }
  - { kind: government, text: "Мужской род, неодушевлённое. Из чего ожерелье — предлог Z с родительным: NASZYJNIK Z PEREŁ «ожерелье из жемчуга», NASZYJNIK ZE SREBRA. Частотные глаголы: ZAŁOŻYĆ NASZYJNIK «надеть ожерелье», ZDJĄĆ NASZYJNIK «снять ожерелье», NOSIĆ NASZYJNIK. «На шее» — NA с местным: NASZYJNIK NA SZYI. Прилагательное от SZYJA — SZYJNY, медицинское: KRĘGI SZYJNE «шейные позвонки». Уменьшительное NASZYJNICZEK существует, но употребляется редко." }
  - { kind: pronunciation, text: "Читается «нашы́йник», три слога, ударение на предпоследнем. Сочетание SZ даёт «ш», буква Y — «ы», поэтому второй слог звучит «шы», а не «ши». Буква J читается «й». Конечное -IK даёт «ик» с мягким н перед ним. В родительном NASZYJNIKA слогов четыре, ударение переходит на предпоследний: «нашыйни́ка». В родительном множественного NASZYJNIKÓW буква Ó даёт «у», конечное W оглушается: «нашыйни́куф»." }
