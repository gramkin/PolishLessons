# review
id: niewatpliwie
format: 2
lemma: "niewątpliwie"
rank: 2063
pos: adv
pron: { cyr: "невонтпли́вье" }
senses:
  - id: undoubtedly
    ru: "несомненно, без сомнения"
    examples:
      - pl: "Niewątpliwie widział to."
        ru: "Он несомненно это видел."
        source: { kind: translated, id: 357027 }
      - pl: "To niewątpliwie egoista."
        ru: "Это несомненно эгоист."
        source: { kind: translated, id: 768748 }
      - pl: "Niewątpliwie miałem szczęście."
        ru: "Мне несомненно повезло."
        source: { kind: translated, id: 11722770 }
  - id: certainly
    ru: "конечно, безусловно (как отдельная реплика)"
    examples:
      - pl: "Niewątpliwie."
        ru: "Несомненно."
        source: { kind: translated, id: 6160770 }
      - pl: "Niewątpliwie była w Anglii tego lata."
        ru: "Она несомненно была в Англии этим летом."
        source: { kind: translated, id: 511548 }
      - pl: "Niewątpliwie była bardziej winna, niż się przedstawiała."
        ru: "Она несомненно была виновнее, чем показывала."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово буквально значит «без сомнения»: nie- + wątpliwy «сомнительный», от wątpić «сомневаться». Русское «несомненно» собрано точно так же." }
  - { kind: usage, text: "Часто стоит отдельной репликой: Niewątpliwie. — «Несомненно.»" }
  - { kind: usage, text: "Рядом живёт оборот bez wątpienia «без сомнения» и nie ulega wątpliwości «не подлежит сомнению»." }
  - { kind: register, text: "Слово книжное; в разговоре чаще скажут na pewno «точно» или oczywiście «конечно»." }
collocations:
  - { pl: "bez wątpienia", ru: "без сомнения" }
  - { pl: "nie ulega wątpliwości", ru: "не подлежит сомнению" }
  - { pl: "na pewno", ru: "точно" }
etymology: "Из nie- + wątpliwy «сомнительный», от wątpić «сомневаться». Русское «несомненно» собрано из тех же частей."
memory: "niewątpliwie — «несомненно», буквально «без сомнения»: nie- + wątpliwy, от wątpić «сомневаться». Русское слово устроено точно так же. Часто стоит отдельной репликой: Niewątpliwie. В разговоре вместо него скажут na pewno."
idioms:
  - { pl: "bez wątpienia", ru: "без сомнения" }
  - { pl: "nie ulega wątpliwości", ru: "не подлежит сомнению" }
