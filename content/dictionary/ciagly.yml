notes:
  - { kind: usage, text: "В мужском личном именительном множественного Ł переходит в L: CIĄGLI, а не «ciągły». Это чередование работает у всех прилагательных с основой на -ŁY: MIŁY даёт MILI, DUŻY — нет, у него другая основа; надёжные примеры — ZŁY с ZLI и CAŁY с CALI. В остальных формах Ł сохраняется: CIĄGŁA, CIĄGŁE, CIĄGŁYCH. Так в одной карточке сходятся три разных чередования в одной и той же позиции: MIŁOSNY даёт MIŁOŚNI с переходом S в Ś, CIĄGŁY даёт CIĄGLI с переходом Ł в L, а JUTRZEJSZY даёт JUTRZEJSI с переходом SZ в S." }
  - { kind: false-friend, text: "Прилагательное образовано от CIĄGNĄĆ «тянуть», и в русском ему отвечает не однокоренное слово, а «непрерывный» или «постоянный». Русское «тягловый» и «тягучий» идут от того же корня, но значат другое. Самое полезное здесь — наречие CIĄGLE, которое значит «постоянно, всё время» и встречается в разговоре на каждом шагу: CIĄGLE ZAPOMINAM «я всё время забываю». Не путайте его с CIĄG «тяга, последовательность» и с W CIĄGU «в течение», где тот же корень: W CIĄGU TYGODNIA «в течение недели». Третье: CIĄGŁOŚĆ значит «непрерывность, преемственность»." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Относительное по происхождению, но употребляется и как качественное, поэтому степени строятся описательно: BARDZIEJ CIĄGŁY. Частотные сочетания: CIĄGŁA LINIA «сплошная линия» — дорожный термин, CIĄGŁY HAŁAS, CIĄGŁE ZMIANY «постоянные перемены», CIĄGŁA KONTROLA. Наречие CIĄGLE употребительнее самого прилагательного и ставится перед глаголом: CIĄGLE PADA «всё время идёт дождь». Существительное того же гнезда — CIĄGŁOŚĆ, с шестью формами, как все слова на -OŚĆ." }
  - { kind: pronunciation, text: "Читается «цё́нгуы», два слога, ударение на первом. Сочетание CIĄ даёт мягкое «ць» с носовым «он», то есть «цён». Буква G твёрдая. Буква Ł даёт неслоговое «у», а конечное Y — «ы», поэтому второй слог звучит «гуы». В мужском личном множественном CIĄGLI буква L обычная, мягче русского «л», и форма звучит «цё́нгли» — на слух отличие от CIĄGŁY очень заметно. В наречии CIĄGLE слышно «цё́нгле»." }
