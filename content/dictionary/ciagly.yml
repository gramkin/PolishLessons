etymology: "От CIĄGNĄĆ «тянуть», из праславянского *tęgnǫti, того же корня, что русские «тянуть», «тяга», «натянуть». Польское начальное CI- на месте русского Т- объясняется смягчением перед передним гласным, и то же соответствие видно в CIĘŻKI и «тяжкий», в CIAŁO и «теле». Суффикс -ŁY образует прилагательные от глаголов со значением состояния или свойства, как в DOJRZAŁY «зрелый» и ZMARŁY «умерший»; русскому он отвечает в -ЛЫЙ, например в «усталый». Из того же гнезда идут CIĄG «тяга, ряд», CIĄGŁOŚĆ «непрерывность», W CIĄGU «в течение» и POCIĄG «поезд», где тяга видна прямо: поезд назван по тому, что его тянут."
memory: "Мужской личный множественного ciągli, с ł→l — третье чередование в этой позиции рядом с miłośni (s→ś) и jutrzejsi (sz→s). Корень тот же, что в «тянуть»: польское ci- отвечает русскому т- (ciężki/«тяжкий», ciało/«тело»). Отсюда pociąg «поезд» — по тяге. Наречие ciągle «всё время» употребительнее прилагательного, а w ciągu значит «в течение»."
