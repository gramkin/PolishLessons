# review
id: wraz
format: 2
lemma: "wraz"
rank: 1598
pos: prep
pron: { cyr: "враз" }
senses:
  - id: together-with
    ru: "wraz z — вместе с"
    examples:
      - pl: "Zwiedzali Kioto wraz z rodzinami."
        ru: "Они осматривали Киото вместе с семьями."
        source: { kind: translated, id: 730409 }
      - pl: "Przyszedłem tutaj wraz z moimi przyjaciółmi."
        ru: "Я пришёл сюда вместе с моими друзьями."
        source: { kind: translated, id: 11731070 }
      - pl: "Przeszedłem całą drogę wraz z nauczycielem."
        ru: "Я прошёл всю дорогу вместе с учителем."
        source: { kind: translated, id: 355830 }
  - id: along-with
    ru: "вместе с, по мере (о времени и процессе)"
    examples:
      - pl: "Wraz z deszczem rzeki rosną."
        ru: "Вместе с дождём реки растут."
        source: { kind: translated, id: 12039589 }
      - pl: "Opowiadanie kończy się wraz z jego śmiercią."
        ru: "Рассказ заканчивается вместе с его смертью."
        source: { kind: translated, id: 528493 }
      - pl: "Czasy się zmieniają i my zmieniamy się wraz z nimi."
        ru: "Времена меняются, и мы меняемся вместе с ними."
        source: { kind: tatoeba, id: 1397656 }
notes:
  - { kind: usage, text: "Слово несамостоятельное: в живом языке оно встречается почти только в связке wraz z с творительным падежом — wraz z rodziną «вместе с семьёй»." }
  - { kind: usage, text: "Синоним — razem z, более разговорный; wraz z звучит книжнее и официальнее." }
  - { kind: usage, text: "Второе употребление — о времени и процессе: wraz z wiekiem «с возрастом», wraz z rozwojem «по мере развития»." }
  - { kind: false-friend, text: "Словарь приписывает wraz ещё и старое значение существительного «образ, представление», но в корпусе такого нет ни разу: все примеры — предлог. Поэтому формы вроде wrazu и wrazem здесь пропущены." }
collocations:
  - { pl: "wraz z", ru: "вместе с" }
  - { pl: "wraz z rodziną", ru: "вместе с семьёй" }
  - { pl: "wraz z wiekiem", ru: "с возрастом" }
etymology: "Из w + raz «раз» — буквально «в один раз, заодно». Русское «враз» существует и собрано точно так же, но значит «сразу», а польское wraz — «вместе с»."
memory: "wraz само по себе не употребляется — оно живёт в связке wraz z с творительным падежом: wraz z rodziną «вместе с семьёй». Разговорный синоним — razem z. И не путайте с русским «враз» = «сразу»."
idioms:
  - { pl: "wraz z", ru: "вместе с" }
  - { pl: "wraz z rodziną", ru: "вместе с семьёй" }
  - { pl: "wraz z wiekiem", ru: "с возрастом" }
