notes:
  - { kind: false-friend, text: "Польский KALENDARZ шире русского «календаря». Это и ежедневник, KALENDARZ KSIĄŻKOWY, и личное расписание: MÓJ KALENDARZ JEST PEŁNY значит «у меня всё расписано». Для ежедневника есть и отдельное слово, TERMINARZ, но в разговоре чаще говорят просто KALENDARZ." }
  - { kind: government, text: "Записать в календарь — ZAPISAĆ W KALENDARZU, местный падеж: поляк записывает «в календаре», где по-русски винительный. Отметить в календаре — ZAZNACZYĆ W KALENDARZU. Сорвать листок с календаря — ZERWAĆ KARTKĘ Z KALENDARZA, родительный." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, неодушевлённое. В родительном множественного две правильные формы, KALENDARZY и KALENDARZÓW, и обе в ходу. Звательный совпадает с местным: KALENDARZU." }
  - { kind: pronunciation, text: "Читается «кале́ндаш», три слога, ударение на втором. Конечное RZ оглушается и звучит как «ш», так же как в LEKARZ «ле́каш». В косвенных формах RZ стоит перед гласной и звучит как «ж», а ударение уходит вперёд: KALENDARZA — «календа́жа»." }
  - { kind: register, text: "Сверх перевода стоит знать оборот KOPNĄĆ W KALENDARZ, буквально «пнуть календарь». Он значит «умереть», шутливо и грубовато, как наше «дать дуба» или «отбросить коньки». Так же говорят UDERZYĆ W KALENDARZ. В серьёзном разговоре о смерти близкого так не скажут." }
