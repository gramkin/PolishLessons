etymology: "Из латинского CALENDARIUM, «долговая книга», от CALENDAE — первого дня месяца, когда платили проценты по долгам. Русское «календарь» — то же слово, и окончания совпадают по общему правилу: польское -ARZ отвечает русскому -АРЬ, как в PISARZ и «писарь», LEKARZ и «лекарь»."
memory: "Kalendarz — «календарь» по правилу -arz и -арь, как lekarz и «лекарь». Читается «кале́ндаш». Записывают w kalendarzu, в местном падеже. Это ещё и ежедневник: mój kalendarz jest pełny. А kopnąć w kalendarz — шутливо «дать дуба»."
idioms:
  - { pl: "kopnąć w kalendarz", ru: "дать дуба, отбросить коньки" }
  - { pl: "uderzyć w kalendarz", ru: "отдать концы" }
