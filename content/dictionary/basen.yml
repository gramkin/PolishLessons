# review
id: basen
format: 2
lemma: "basen"
rank: 1921
pos: noun
pron: { cyr: "ба́сэн" }
senses:
  - id: pool
    ru: "бассейн (для плавания)"
    examples:
      - pl: "Idę na basen."
        ru: "Я иду в бассейн."
        source: { kind: translated, id: 2349193 }
      - pl: "Ona ma basen."
        ru: "У неё есть бассейн."
        source: { kind: translated, id: 3498225 }
      - pl: "O której idziesz na basen?"
        ru: "Во сколько ты идёшь в бассейн?"
        source: { kind: translated, id: 6154889 }
      - pl: "Pływałem wtedy w basenie."
        ru: "Я тогда плавал в бассейне."
        source: { kind: translated, id: 3421833 }
      - pl: "Skoczyła do basenu."
        ru: "Она прыгнула в бассейн."
        source: { kind: translated, id: 2571005 }
      - pl: "Tom i Mary kupili dom z basenem."
        ru: "Том и Мэри купили дом с бассейном."
        source: { kind: tatoeba, id: 12061992 }
  - id: basin
    ru: "бассейн (реки, моря); акватория порта"
    examples:
      - pl: "Basen Morza Śródziemnego jest bardzo zaludniony."
        ru: "Бассейн Средиземного моря очень густо заселён."
        source: { kind: authored }
      - pl: "Statki stoją w basenie portowym."
        ru: "Суда стоят в портовом бассейне."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Направление — na basen «в бассейн» с винительным, место — w basenie «в бассейне» или na basenie с предложным." }
  - { kind: usage, text: "Второе значение, как и в русском, — «бассейн реки или моря»: basen Morza Bałtyckiego." }
  - { kind: usage, text: "Есть и медицинское значение «судно для лежачих больных» — о нём стоит знать, чтобы не удивиться в больнице." }
collocations:
  - { pl: "iść na basen", ru: "идти в бассейн" }
  - { pl: "pływać w basenie", ru: "плавать в бассейне" }
  - { pl: "dom z basenem", ru: "дом с бассейном" }
etymology: "Из французского bassin через немецкий. Русское «бассейн» пришло тем же путём от того же слова, поэтому совпадают и звучание, и оба значения — и водоём для плавания, и бассейн реки."
memory: "basen — «бассейн». Направление с винительным: idę na basen «иду в бассейн», а место с предложным: pływam w basenie «плаваю в бассейне»."
idioms:
  - { pl: "iść na basen", ru: "идти в бассейн" }
  - { pl: "dom z basenem", ru: "дом с бассейном" }
  - { pl: "basen portowy", ru: "портовый бассейн" }
