# review
id: pensja
format: 2
lemma: "pensja"
rank: 3948
pos: noun
pron: { cyr: "пэ́нсья" }
senses:
  - id: salary
    ru: "зарплата, оклад"
    examples:
      - pl: "Ile wynosi twoja pensja?"
        ru: "Какая у тебя зарплата?"
        source: { kind: authored }
      - pl: "Dostał pierwszą pensję i kupił mamie kwiaty."
        ru: "Он получил первую зарплату и купил маме цветы."
        source: { kind: authored }
      - pl: "Pensja nauczyciela jest niewielka."
        ru: "Зарплата учителя небольшая."
        source: { kind: authored }
      - pl: "Czekam na pensję do dziesiątego."
        ru: "Я жду зарплату до десятого числа."
        source: { kind: authored }
      - pl: "Za taką pensję nie da się utrzymać rodziny."
        ru: "На такую зарплату семью не прокормить."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PENSJA — «зарплата», а не «пенсия»! Пенсия по старости — EMERYTURA, по инвалидности — RENTA. Пенсионер — EMERYT. Сказать о пенсионере, что он «получает PENSJĘ», значит сказать, что он работает." }
  - { kind: usage, text: "Восемь живых форм, женский род. Родительный, дательный и местный единственного — PENSJI, родительный множественного тоже PENSJI. Архаичная форма PENSYJ и звательный не даются." }
  - { kind: government, text: "Жить на зарплату — ŻYĆ Z PENSJI, Z с родительным, где в русском «на» с винительным. Прибавка к зарплате — PODWYŻKA PENSJI. На такую зарплату — ZA TAKĄ PENSJĘ." }
  - { kind: pronunciation, text: "Читается «пэ́нсья», ударение на первом слоге. PE — твёрдое «пэ», SJA — «сья»." }
  - { kind: register, text: "Слово нейтральное. В разговоре о дне выдачи говорят WYPŁATA: DZIŚ WYPŁATA, «сегодня зарплата». В документах — WYNAGRODZENIE." }
collocations:
  - { pl: "podwyżka pensji", ru: "прибавка к зарплате" }
  - { pl: "niska pensja", ru: "низкая зарплата" }
  - { pl: "żyć z pensji", ru: "жить на зарплату" }
family:
  - { pl: "pensjonat", ru: "пансионат", relation: root }
  - { pl: "pensyjka", ru: "зарплатка (разг.)", relation: derived }
  - { pl: "pensjonariusz", ru: "постоялец пансионата", relation: root }
etymology: "Из латинского слова со значением «платёж», от глагола «взвешивать, платить». Из того же источника русские «пенсия» и «пансион», но польский сохранил значение регулярной платы за работу."
memory: "Pensja — зарплата, не «пенсия» (это emerytura). Читается «пэ́нсья». Żyć z pensji — жить на зарплату. Od pierwszego do pierwszego — от зарплаты до зарплаты."
idioms:
  - { pl: "od pierwszego do pierwszego", ru: "от зарплаты до зарплаты" }
formExamplesSkip:
  - { form: "pensyj", reason: "архаичная форма родительного множественного; сейчас говорят PENSJI" }
  - { form: "pensjo", reason: "звательный падеж у этого слова не употребляется" }
