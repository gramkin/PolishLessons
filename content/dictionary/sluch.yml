pos: noun
pron: { cyr: "суух" }
senses:
  - id: hearing
    ru: "слух"
    examples:
      - pl: "Słuch zaczął mu słabnąć po sześćdziesiątce."
        ru: "Слух начал у него слабеть после шестидесяти."
        source: { kind: authored }
      - pl: "Bez słuchu nie zagrasz w orkiestrze."
        ru: "Без слуха в оркестре не сыграешь."
        source: { kind: authored }
      - pl: "Ma dobry słuch do języków."
