  - id: ear
    ru: "музыкальный слух"
    examples:
      - pl: "Grał ze słuchu, bez nut."
        ru: "Он играл на слух, без нот."
        source: { kind: authored }
      - pl: "Słuch absolutny ma jeden na dziesięć tysięcy."
        ru: "Абсолютный слух есть у одного из десяти тысяч."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Родительный и предложный совпадают в форме SŁUCHU, с окончанием -u, и она же служит звательным. Так же устроен ŚMIECH — śmiechu, уже знакомый по словарю: мужские существительные на -ch берут -u, а не -a. Начальное sł читается как «су»: «суух», потому что ł даёт неслоговое у." }
  - { kind: usage, text: "Значения те же, что у русского «слуха»: способность слышать и музыкальный слух. GRAĆ ZE SŁUCHU — «играть на слух», SŁUCH ABSOLUTNY — «абсолютный слух», mieć słuch do języków — «иметь слух к языкам». Отдельно стоит запомнить оборот ZAMIENIĆ SIĘ W SŁUCH — «превратиться в слух», то есть слушать с полным вниманием." }
collocations:
  - { pl: "grać ze słuchu", ru: "играть на слух" }
  - { pl: "słuch absolutny", ru: "абсолютный слух" }
  - { pl: "mieć dobry słuch", ru: "иметь хороший слух" }
family:
  - { pl: "słuchać", ru: "слушать", relation: root, id: sluchac }
  - { pl: "słuchowy", ru: "слуховой", relation: derived }
  - { pl: "posłuch", ru: "послушание", relation: derived }
etymology: "Из праславянского *sluxъ — то же слово, что русский «слух», от корня *slu- «слышать». Отсюда же słuchać «слушать» и słyszeć «слышать», в точности как наши «слушать» и «слышать». Расхождений здесь нет ни в форме, ни в значении, и запоминать приходится только окончание родительного."
memory: "Родительный и предложный — SŁUCHU, на -u, как śmiech — śmiechu. А звучит начало слова «су»: «суух»."
idioms:
  - { pl: "grać ze słuchu", ru: "играть на слух" }
  - { pl: "zamienić się w słuch", ru: "превратиться в слух" }
