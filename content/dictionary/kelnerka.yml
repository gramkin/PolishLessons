notes:
  - { kind: false-friend, text: "KELNERKA — «официантка», пара к KELNER. Позвать официантку вежливо — PROSZĘ PANI!, а не KELNERKO!" }
  - { kind: usage, text: "Девять живых форм, женский род, лицо. Перед E K переходит в C: KELNERCE. Родительный множественного — KELNEREK. Звательный не даётся." }
  - { kind: government, text: "Работать официанткой — PRACOWAĆ JAKO KELNERKA, после JAKO именительный, или BYĆ KELNERKĄ. Оставить официантке чаевые — ZOSTAWIĆ KELNERCE NAPIWEK." }
  - { kind: pronunciation, text: "Читается «кельнэ́рка», ударение на предпоследнем слоге. L перед N мягкое, NE — твёрдое «нэ»." }
collocations:
  - { pl: "pracować jako kelnerka", ru: "работать официанткой" }
  - { pl: "miła kelnerka", ru: "приветливая официантка" }
  - { pl: "zawołać kelnerkę", ru: "позвать официантку" }
family:
