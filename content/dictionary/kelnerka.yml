  - { pl: "kelnerski", ru: "официантский", relation: derived }
etymology: "От KELNER «официант», из немецкого слова, которое исходно значило «ключник, заведующий погребом». Суффикс -KA делает из него название женщины."
memory: "Kelnerka — официантка, kelner — официант. Читается «кельнэ́рка». Proszę pani! — так зовут официантку."
idioms:
