etymology: "Из французского REQUIN, слова неясного происхождения: одни связывают его с REQUIEM, заупокойной молитвой, по зловещей репутации рыбы, другие считают заимствованием из нормандских говоров. Польский взял французскую форму в девятнадцатом веке и приспособил к своему склонению. Русский пошёл совсем другим путём: «акула» пришла из древнескандинавского HÁKARL «акула», буквально «морской мужик», через поморские говоры. Так два языка назвали одну рыбу словами из разных концов Европы, и никакого родства между REKIN и «акулой» нет. Переносное значение, однако, развилось в обоих языках независимо и одинаково, из образа хищника, который не отпускает добычу; то же случилось в английском с SHARK и в немецком с HAI. Прилагательное REKINI образовано польским суффиксом -I, продуктивным в названиях животных: PTASI «птичий», KOCI «кошачий», PSI «собачий»."
memory: "Два именительных множественного по смыслу: rekiny о рыбах, rekini о людях — польский переводит слово в мужской личный род, как только оно означает человека. Rekini finansowi — «финансовые акулы». Родства с «акулой» нет: rekin из французского requin, «акула» из скандинавского. Переносный смысл совпал сам. Прилагательное rekini «акулий» омонимично личной форме множественного."
