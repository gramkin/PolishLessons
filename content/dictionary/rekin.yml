notes:
  - { kind: usage, text: "У этого слова два именительных множественного, и выбор между ними зависит от значения. О рыбе говорят REKINY: REKINY PŁYWAJĄ BEZ PRZERWY. О людях — хищных дельцах — говорят REKINI: REKINI FINANSOWI, REKINI BIZNESU. Причина в том, что польский различает мужской личный род и мужской неличный, и слово переходит из второго в первый, как только начинает обозначать человека. Это редкая и полезная возможность увидеть, как грамматический род следует за смыслом, а не за словом. В единственном числе разницы нет: и о рыбе, и о человеке будет REKIN, REKINA, REKINOWI. Винительный в единственном равен родительному в обоих случаях: WIDZIAŁ REKINA." }
  - { kind: false-friend, text: "Общего корня с русским «акулой» у этого слова нет: польский взял REKIN из французского REQUIN, а русский — «акулу» из древнескандинавского HÁKARL через северные говоры. Два заимствования из разных источников, и угадать одно по другому нельзя. Зато переносное значение совпало полностью, потому что оба языка пришли к нему через один и тот же образ хищника: REKIN FINANSOWY это «финансовая акула», REKIN BIZNESU — «акула бизнеса». Прилагательное REKINI значит «акулий», и оно омонимично личной форме множественного числа: REKINI UŚMIECH «акулья улыбка», но REKINI FINANSOWI «финансовые акулы»." }
  - { kind: government, text: "Мужской род; как название животного это одушевлённое неличное (m2), а в переносном значении о человеке — одушевлённое личное (m1). Винительный единственного равен родительному: BOI SIĘ REKINA. Частотные сочетания: REKIN FINANSOWY «финансовая акула», REKIN BIZNESU, PŁETWA REKINA «плавник акулы», NURKOWAĆ Z REKINAMI «погружаться с акулами». Местный единственного — REKINIE, с мягким N перед -IE. Родительный множественного — REKINÓW в обоих значениях." }
  - { kind: pronunciation, text: "Читается «рэ́кин», два слога, ударение на первом. Буква E даёт «э» без смягчения предшествующего согласного, поэтому начало звучит «рэ», а не «ре». Конечное N твёрдое. В местном падеже REKINIE сочетание NIE даёт мягкое «не»: «рэ́кине». В личной форме множественного REKINI конечное -I мягкое, и N смягчается: «рэ́кини». Разница между REKINY и REKINI слышна отчётливо, и она не стилистическая, а смысловая." }
