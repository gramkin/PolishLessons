id: domniemany
format: 2
lemma: "domniemany"
rank: 2009
pos: adj
pron: { cyr: "домнема́ны" }
senses:
  - id: alleged
    ru: "предполагаемый, мнимый (о виновнике, факте)"
    examples:
      - pl: "Domniemany sprawca został zatrzymany."
        ru: "Предполагаемый виновник задержан."
        source: { kind: authored }
      - pl: "To tylko domniemany fakt, nie dowód."
        ru: "Это лишь предполагаемый факт, а не доказательство."
        source: { kind: authored }
      - pl: "Domniemany ojciec dziecka zaprzeczył."
        ru: "Предполагаемый отец ребёнка всё отрицал."
        source: { kind: authored }
  - id: presumed
    ru: "презюмируемый (юридический термин)"
    examples:
      - pl: "Sąd bada domniemaną zgodę właściciela."
        ru: "Суд проверяет предполагаемое согласие владельца."
        source: { kind: authored }
      - pl: "Domniemani sprawcy czekają na proces."
        ru: "Предполагаемые виновники ждут суда."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово книжное и прежде всего юридическое: domniemany sprawca «предполагаемый виновник», domniemana śmierć «предполагаемая смерть»." }
  - { kind: government, text: "Склоняется как обычное прилагательное на -y: domniemany, domniemanego, domniemanemu." }
  - { kind: false-friend, text: "Ничего общего с dom «дом». Корень — mniemać «полагать, думать», родственное русскому «мнить», «мнение»." }
  - { kind: usage, text: "Рядом стоит существительное domniemanie «презумпция»: domniemanie niewinności «презумпция невиновности»." }
collocations:
  - { pl: "domniemany sprawca", ru: "предполагаемый виновник" }
  - { pl: "domniemana śmierć", ru: "предполагаемая смерть" }
etymology: "От domniemać «предположить», от mniemać «полагать, думать» — тот же корень, что в русском «мнить», «мнение», «сомнение»."
memory: "domniemany = «предполагаемый». Корень mniemać «полагать» — русское «мнить»: то, что лишь мнится, но не доказано. Отсюда domniemanie niewinności «презумпция невиновности»."
