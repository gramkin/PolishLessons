# review
id: zwierz
format: 2
lemma: "zwierz"
rank: 5591
pos: noun
pron: { cyr: "звеш" }
senses:
  - id: beast
    ru: "зверь (книжное, собирательное)"
    examples:
      - pl: "Niech ryczy zatem ranny łoś, zwierz zdrów przebiega knieję."
        ru: "Пусть ревёт раненый лось, а здоровый зверь бежит по чаще."
        source: { kind: translated, id: 13453519 }
      - pl: "Dziki zwierz nie boi się człowieka."
        ru: "Дикий зверь не боится человека."
        source: { kind: authored }
      - pl: "W lesie żyje wszelki zwierz."
        ru: "В лесу живёт всякий зверь."
        source: { kind: authored }
  - id: animal
    ru: "животное (вариант zwierzę)"
    examples:
      - pl: "Przesuń palcem w lewo lub w prawo aby zobaczyć inne zwierze."
        ru: "Передвинь палец влево или вправо, чтобы увидеть другое животное."
        source: { kind: tatoeba, id: 1399756 }
      - pl: "Lew to zwierze mięsożerne."
        ru: "Лев — плотоядное животное."
        source: { kind: translated, id: 13337170 }
notes:
  - { kind: usage, text: "Книжное и охотничье слово. Обычное «животное» — zwierzę, у которого своя карточка; zwierz звучит как из поэмы или из речи егеря." }
  - { kind: false-friend, text: "Корень тот же, что в русском «зверь». Но по-польски нейтральное слово для животного — zwierzę, а zwierz сохранил высокий и собирательный оттенок." }
  - { kind: government, text: "Мужской неодушевлённый в единственном числе; родительный — zwierza." }
  - { kind: usage, text: "В корпусе форма zwierze чаще оказывается опиской вместо zwierzę, что само по себе говорит о редкости слова." }
collocations:
  - { pl: "dziki zwierz", ru: "дикий зверь" }
  - { pl: "gruby zwierz", ru: "крупный зверь" }
etymology: "Праславянское *zvěrь; русское «зверь» — то же слово."
memory: "zwierz — книжное «зверь». Обычное «животное» по-польски zwierzę. Корень общий с русским «зверь», но регистр выше."
idioms:
  - { pl: "dziki zwierz", ru: "дикий зверь" }
