# review
id: nagrzac
format: 2
lemma: "nagrzać"
rank: 5749
pos: verb
pron: { cyr: "на́гжаць" }
senses:
  - id: heat-up
    ru: "нагреть (воду, печь, комнату)"
    examples:
      - pl: "Nagrzeję wodę na herbatę."
        ru: "Я нагрею воду для чая."
        source: { kind: authored }
      - pl: "Piec nagrzał izbę w godzinę."
        ru: "Печь нагрела комнату за час."
        source: { kind: authored }
      - pl: "Nagrzej piekarnik do dwustu stopni."
        ru: "Нагрей духовку до двухсот градусов."
        source: { kind: authored }
  - id: warm-through
    ru: "прогреть, разогреть (о солнце, о бане)"
    examples:
      - pl: "Słońce nagrzeje piasek do południa."
        ru: "Солнце нагреет песок к полудню."
        source: { kind: authored }
      - pl: "Piasek jest nagrzany słońcem."
        ru: "Песок нагрет солнцем."
        source: { kind: authored }
      - pl: "Wyszli z sauny nagrzani i spokojni."
        ru: "Они вышли из сауны разогретые и спокойные."
        source: { kind: authored }
notes:
  - { kind: government, text: "nagrzać coś — ВИНИТЕЛЬНЫЙ падеж: nagrzać wodę, piec, pokój. Дополнением бывает и человек, когда его прогревает солнце или баня, поэтому мужсколичное nagrzani работает: nagrzani słońcem leżeli na piasku." }
  - { kind: usage, text: "В форме мужского лица прошедшего времени есть ДВА равноправных варианта: nagrzali и nagrzeli. Оба засвидетельствованы — PoliMorf даёт им одну и ту же помету praet:pl:m1.p1, — причём вариант на -eli ощущается более книжным и старым. То же колебание у lać: lali наряду с leli." }
  - { kind: false-friend, text: "Корень grzać — прямой родственник русского «греть», и nagrzać отвечает русскому «нагреть» приставка в приставку. Но однокоренное grzejnik значит «радиатор, обогреватель», а не «грелка»: грелка по-польски termofor." }
  - { kind: usage, text: "Совершенный вид; несовершенный — nagrzewać. Рядом стоят ogrzewać «отапливать» и ogrzewanie «отопление» — то, что пишут в счетах за квартиру." }
collocations:
  - { pl: "nagrzać wodę", ru: "нагреть воду" }
  - { pl: "nagrzać piekarnik", ru: "нагреть духовку" }
  - { pl: "nagrzany słońcem", ru: "нагретый солнцем" }
family:
  - { pl: "nagrzewać", ru: "нагревать", relation: aspect }
  - { pl: "grzać", ru: "греть", relation: root }
  - { pl: "grzejnik", ru: "радиатор, обогреватель", relation: derived }
etymology: "Приставка na- и глагол grzać, от праславянского *grěti. Русское «греть» — прямой родственник, и «нагреть» сложено из тех же двух частей. Из того же гнезда grzanka «тост, поджаренный хлеб» и ogrzewanie «отопление»."
memory: "nagrzać = na- + grzać, буквально русское «нагреть», корень как в «греть». В мужском лице прошедшего времени допустимы оба варианта: nagrzali и nagrzeli."
idioms:
  - { pl: "nagrzany słońcem", ru: "нагретый солнцем" }
  - { pl: "nagrzać piekarnik", ru: "разогреть духовку (перед выпечкой)" }
