# review
id: oczywiscie
format: 2
lemma: "oczywiście"
rank: 185
pos: adv
pron: { cyr: "очыви́сьце" }
senses:
  - id: of-course
    ru: "конечно, разумеется (согласие)"
    examples:
      - pl: "Oczywiście!"
        ru: "Естественно!"
        source: { kind: tatoeba, id: 456980 }
      - pl: "Tak, oczywiście."
        ru: "Да, конечно."
        source: { kind: tatoeba, id: 2164497 }
      - pl: "Aby obsługiwać dźwig, oczywiście potrzebny jest certyfikat."
        ru: "Конечно, для управления краном нужна лицензия."
        source: { kind: tatoeba, id: 368126 }
  - id: obviously
    ru: "очевидно, явно (оценка факта)"
    examples:
      - pl: "To oczywiście kłamstwo."
        ru: "Это явная ложь."
        source: { kind: tatoeba, id: 4717689 }
      - pl: "To oczywiście nieprawda."
        ru: "Это, очевидно, неправда."
        source: { kind: authored }
      - pl: "Oczywiście się mylisz."
        ru: "Ты, очевидно, ошибаешься."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В ответе oczywiście значит «конечно»; разговорные синонимы — jasne! и pewnie!" }
  - { kind: usage, text: "Oczywiście, że tak — «конечно, да»; oczywiście, że nie — «конечно, нет»." }
  - { kind: usage, text: "Прилагательное oczywisty значит «очевидный»: rzecz oczywista «дело очевидное»." }
collocations:
  - { pl: "oczywiście, że tak", ru: "конечно, да" }
  - { pl: "no oczywiście", ru: "ну конечно" }
  - { pl: "rzecz oczywista", ru: "дело очевидное" }
etymology: "От oczywisty «очевидный», где корень тот же, что в oko «глаз»: буквально «видимый глазом». Русское «очевидно» построено точно так же — «очи» плюс «видеть»."
memory: "oczywiście — «конечно» в ответе и «очевидно» в оценке. Строение то же, что у русского «очевидно», так что слово легко запомнить."
