# review
id: swiat
format: 2
lemma: "świat"
rank: 178
pos: noun
pron: { cyr: "сьвят" }
senses:
  - id: world
    ru: "мир, свет (земля и люди)"
    examples:
      - pl: "Świat jest pełen głupców."
        ru: "Мир полон дураков."
        source: { kind: tatoeba, id: 533534 }
      - pl: "Cały świat pragnie pokoju."
        ru: "Весь мир желает мира."
        source: { kind: tatoeba, id: 6154983 }
      - pl: "Chcemy zmieniać świat."
        ru: "Мы хотим изменить мир."
        source: { kind: tatoeba, id: 2194700 }
  - id: world-phrases
    ru: "мир в устойчивых оборотах (na świecie, koniec świata)"
    examples:
      - pl: "Ile jest krajów na świecie?"
        ru: "Сколько стран в мире?"
        source: { kind: tatoeba, id: 2535358 }
      - pl: "Kiedy będzie koniec świata?"
        ru: "Когда будет конец света?"
        source: { kind: tatoeba, id: 908081 }
      - pl: "Koty rządzą światem."
        ru: "Коты правят миром."
        source: { kind: tatoeba, id: 9952244 }
notes:
  - { kind: false-friend, text: "Русское «свет» распалось на два польских слова: świat — «мир», а światło — «свет, освещение». Не путайте их." }
  - { kind: usage, text: "«В мире» — na świecie, с предлогом na и предложным падежом; «на свет» (родиться) — na świat: przyjść na świat." }
  - { kind: usage, text: "koniec świata значит и «конец света», и разговорное «ужас, кошмар»." }
collocations:
  - { pl: "na świecie", ru: "в мире" }
  - { pl: "cały świat", ru: "весь мир" }
  - { pl: "koniec świata", ru: "конец света" }
  - { pl: "przyjść na świat", ru: "появиться на свет" }
etymology: "Праславянское *světъ; то же слово, что русское «свет», но в польском оно значит «мир», а освещение — это światło."
memory: "Русское «свет» распалось надвое: świat «мир» и światło «свет». «В мире» — na świecie, «появиться на свет» — przyjść na świat."
idioms:
  - { pl: "koniec świata", ru: "конец света" }
  - { pl: "cud świata", ru: "чудо света" }
  - { pl: "mieć świat u stóp", ru: "весь мир у ног" }
