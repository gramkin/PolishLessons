notes:
  - { kind: usage, text: "Самое важное о слове — его склонение. В единственном числе terrorysta меняется как существительное ЖЕНСКОГО типа на -a: terrorysty, terryście… то есть terroryście, terrorystę, terrorystą. Но род у него мужской, и согласование мужское: ten terrorysta, zatrzymany terrorysta. Во множественном числе всё возвращается к мужскому образцу: terroryści, terrorystów." }
  - { kind: false-friend, text: "Само слово совпадает с русским «террорист». Расхождение только в склонении: русское «террорист» склоняется как обычное мужское слово, а польское в единственном числе берёт женские окончания, потому что кончается на -a. Та же модель у artysta, turysta, kierowca, poeta." }
  - { kind: government, text: "Именительный множественного — terroryści, с чередованием st → ść. Это мужско-личная форма, поэтому и глагол в прошедшем будет мужско-личным: terroryści zajęli, а не zajęły." }
collocations:
  - { pl: "zamach terrorystyczny", ru: "теракт" }
  - { pl: "zatrzymać terrorystę", ru: "задержать террориста" }
  - { pl: "negocjacje z terrorystami", ru: "переговоры с террористами" }
family:
  - { pl: "terroryzm", ru: "терроризм", relation: derived }
  - { pl: "terror", ru: "террор", relation: root }
etymology: "Из французского terroriste, впервые — о деятелях эпохи Террора во Французской революции; корень латинский, terror «ужас» от terrere «пугать». Русское «террорист» пришло тем же путём, поэтому слова совпадают буква в букву; польский лишь присоединил греко-латинский суффикс -ista, который в польском склоняется по женскому образцу."
memory: "terrorysta — «террорист», слово то же. Запоминать надо склонение: в единственном числе женские окончания (terrorysty, terrorystę), но род мужской, а во множественном terroryści с st → ść. Так же ведут себя artysta и turysta."
idioms:
