# review
id: cena
format: 2
lemma: "cena"
rank: 978
pos: noun
pron: { cyr: "цэ́на" }
senses:
  - id: price
    ru: "цена"
    examples:
      - pl: "Cena rośnie."
        ru: "Цена растёт."
        source: { kind: translated, id: 5518238 }
      - pl: "Ceny spadły."
        ru: "Цены упали."
        source: { kind: translated, id: 3611494 }
      - pl: "Cena ropy rośnie."
        ru: "Цена на нефть растёт."
        source: { kind: translated, id: 2809334 }
  - id: at-any-price
    ru: "za wszelką cenę — любой ценой"
    examples:
      - pl: "Chcemy wygrać za wszelką cenę!"
        ru: "Мы хотим выиграть любой ценой!"
        source: { kind: translated, id: 4786718 }
      - pl: "Muszę jej pomóc za wszelką cenę."
        ru: "Я должен помочь ей любой ценой."
        source: { kind: translated, id: 2146238 }
      - pl: "Za wszelką cenę musimy uniknąć wojny."
        ru: "Мы должны любой ценой избежать войны."
        source: { kind: translated, id: 3788507 }
  - id: in-price
    ru: "w cenie — включено в цену; в цене, ценится"
    note: "Оборот двусмысленный: и «входит в стоимость», и «высоко ценится»."
    examples:
      - pl: "Czy to jest ujęte w cenie?"
        ru: "Это включено в цену?"
        source: { kind: translated, id: 7905674 }
      - pl: "Usługi wyższej jakości są w cenie."
        ru: "Услуги высокого качества в цене."
        source: { kind: translated, id: 944086 }
      - pl: "Kupiłem to po dobrej cenie."
        ru: "Я купил это по хорошей цене."
        source: { kind: translated, id: 6328216 }
notes:
  - { kind: usage, text: "za wszelką cenę — «любой ценой», za żadną cenę — «ни за что на свете», za pół ceny — «за полцены»." }
  - { kind: usage, text: "Оборот w cenie значит и «включено в стоимость» (Czy to jest ujęte w cenie?), и «ценится, в цене» (Usługi wyższej jakości są w cenie). Различает только контекст." }
  - { kind: usage, text: "po dobrej cenie — «по хорошей цене», предлог po с предложным падежом, как и в русском." }
  - { kind: false-friend, text: "Само слово совпадает с русским, а вот однокоренной глагол расходится: cenić значит «ценить», а не «оценивать»; «оценивать» будет oceniać." }
collocations:
  - { pl: "za wszelką cenę", ru: "любой ценой" }
  - { pl: "za pół ceny", ru: "за полцены" }
  - { pl: "wzrost cen", ru: "рост цен" }
  - { pl: "po dobrej cenie", ru: "по хорошей цене" }
family:
  - { pl: "cenić", ru: "ценить", relation: root }
  - { pl: "cenny", ru: "ценный", relation: derived }
  - { pl: "bezcenny", ru: "бесценный", relation: derived }
etymology: "Праславянское *cěna — то же слово, что русская «цена», с тем же значением. Родственно также «каяться» и латинскому poena «наказание»: изначально «плата, возмездие»."
memory: "cena — «цена», полное совпадение с русским. Запомните обороты: za wszelką cenę «любой ценой», za pół ceny «за полцены» и двусмысленное w cenie — это и «включено в стоимость», и «ценится»."
idioms:
  - { pl: "za wszelką cenę", ru: "любой ценой" }
  - { pl: "za żadną cenę", ru: "ни за что на свете" }
  - { pl: "za pół ceny", ru: "за полцены" }
  - { pl: "być w cenie", ru: "быть в цене" }
formExamplesSkip:
  - { form: "ceno", reason: "звательный падеж: к цене не обращаются, форма не употребляется" }
