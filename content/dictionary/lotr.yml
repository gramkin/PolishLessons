# review
id: lotr
format: 2
lemma: "łotr"
rank: 5702
pos: noun
pron: { cyr: "уотр" }
senses:
  - id: scoundrel
    ru: "негодяй, злодей"
    examples:
      - pl: "Ten łotr oszukał całą wieś."
        ru: "Этот негодяй обманул всю деревню."
        source: { kind: authored }
      - pl: "Nie ufaj mu, to łotr."
        ru: "Не доверяй ему, он негодяй."
        source: { kind: authored }
      - pl: "Łotr uciekł przed karą."
        ru: "Негодяй избежал наказания."
        source: { kind: authored }
  - id: rogue
    ru: "разбойник, лиходей (книжное и библейское)"
    examples:
      - pl: "Ukrzyżowano z nim dwóch łotrów."
        ru: "С ним распяли двух разбойников."
        source: { kind: authored }
      - pl: "W bajce łotr zawsze przegrywa."
        ru: "В сказке злодей всегда проигрывает."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово книжное и слегка старомодное; в живой речи скорее скажут drań или łajdak." }
  - { kind: government, text: "Мужской ЛИЧНЫЙ род: мн. ч. łotrzy или łotry, родительный мн. łotrów." }
  - { kind: false-friend, text: "Пишется через ł, поэтому звучит «уотр», а не «лотр». Написание обманывает глаз, привыкший к кириллице." }
  - { kind: usage, text: "В евангельском тексте dobry łotr «благоразумный разбойник» — тот самый, распятый рядом с Христом." }
  - { kind: government, text: "Два равноправных множественных числа: łotrzy и łotrowie. Оба мужско-личные, оба литературные." }
collocations:
  - { pl: "dobry łotr", ru: "благоразумный разбойник" }
  - { pl: "skończony łotr", ru: "отъявленный негодяй" }
etymology: "Древнее заимствование, вероятно из средневерхненемецкого lotter «бродяга, шалопай»."
memory: "łotr — «негодяй», но читается «уотр»: ł даёт звук у. Слово книжное; в разговоре чаще drań. В Евангелии dobry łotr — благоразумный разбойник."
idioms:
  - { pl: "dobry łotr", ru: "благоразумный разбойник" }
