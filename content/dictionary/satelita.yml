notes:
  - { kind: false-friend, text: "Русское «спутник» — это калька того самого латинского слова, которое польский взял целиком. Латинское SATELLES означало телохранителя, того, кто идёт рядом; когда понадобилось назвать тело, обращающееся вокруг планеты, учёные взяли это слово, а русский перевёл его по частям — «спутник», тот, кто в пути вместе. Поэтому SATELITA и «спутник» — одно понятие в двух одеждах. Запомнить стоит и второе значение, политическое: PAŃSTWO SATELICKIE «государство-сателлит», и здесь русский тоже пользуется латинским словом. Спутник в смысле попутчика по-польски TOWARZYSZ PODRÓŻY." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, и склонение то же, что у KOSMITA: в единственном по женскому образцу — SATELITY, SATELICIE, SATELITĘ, SATELITĄ, — а во множественном по мужскому: SATELICI, SATELITÓW. Прилагательные всегда мужские: SZTUCZNY SATELITA «искусственный спутник». Именительный множественного имеет при этом две формы, и они разошлись по значению: SATELICI о людях и государствах как лицах, SATELITY об аппаратах и небесных телах. Это редкий и удобный случай, когда грамматика сама различает одушевлённое и неодушевлённое употребление." }
  - { kind: pronunciation, text: "Читается «сатэли́та», четыре слога, ударение на третьем. Буква E во втором слоге даёт «э» без смягчения предыдущего согласного, поэтому звучит «тэ», а не «те». В форме SATELICIE сочетание CIE даёт мягкое «це»: «сатэли́це». В форме SATELICI слышно «сатэли́ци». В форме SATELITĄ последнее Ą звучит «он»: «сатэли́тон». В форме SATELITÓW буква Ó читается как «у», а конечное W оглушается: «сатэли́туф»." }
  - { kind: register, text: "Слово нейтральное, одинаково уместное в научной статье и в прогнозе погоды. Устойчивые сочетания: SZTUCZNY SATELITA, SATELITA POGODOWY, TELEWIZJA SATELITARNA «спутниковое телевидение», ZDJĘCIA SATELITARNE. В политическом значении слово несёт отрицательный оттенок: PAŃSTWO SATELICKIE говорят о стране, лишённой самостоятельности. В разговоре о человеке SATELITA звучит книжно и слегка пренебрежительно — о том, кто всюду следует за более важной фигурой. Прилагательное SATELITARNY относится к технике, SATELICKI — к политике." }
