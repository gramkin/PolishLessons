etymology: "Из латинского SATELLES, родительный SATELLITIS, что означало телохранителя, спутника знатного лица, а в поздней латыни и просто сопровождающего. Происхождение самого латинского слова неясно, его считают заимствованием из этрусского. В астрономию термин ввёл Кеплер в начале семнадцатого века, назвав так луны Юпитера: они ходят при планете, как телохранители при господине. Отсюда слово разошлось по всем европейским языкам. Русский пошёл другим путём и перевёл образ своими средствами, получив «спутник» — того, кто делит путь; слово это оказалось настолько удачным, что в тысяча девятьсот пятьдесят седьмом году вошло во все языки мира уже как название первого аппарата."
memory: "Одно понятие в двух одеждах: польский взял латинское satelles «телохранитель, идущий рядом», русский перевёл образ и получил «спутник». В астрономию термин ввёл Кеплер для лун Юпитера. Склонение как у kosmita: единственное по женскому образцу, множественное по мужскому, прилагательные мужские — sztuczny satelita. И редкая удача: именительный множественного различает смысл, satelici о людях и государствах, satelity об аппаратах."
idioms:
  - { pl: "sztuczny satelita", ru: "искусственный спутник" }
