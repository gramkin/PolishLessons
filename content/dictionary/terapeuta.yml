notes:
  - { kind: false-friend, text: "TERAPEUTA — не русский «терапевт»-врач, а «психотерапевт» или «реабилитолог». Врач общей практики, к которому идут с простудой, по-польски — LEKARZ RODZINNY или INTERNISTA." }
  - { kind: usage, text: "Десять живых форм. Мужской род, но в единственном склоняется как женское на -A: TERAPEUTY, TERAPEUTĘ, TERAPEUTĄ, а в дательном и местном T смягчается: TERAPEUCIE. Множественное — TERAPEUCI. Звательный не даётся. Женщина — TERAPEUTKA." }
  - { kind: government, text: "К психотерапевту — DO TERAPEUTY. Специалист по чему — родительный: TERAPEUTA UZALEŻNIEŃ, «по зависимостям». Заниматься с реабилитологом — ĆWICZYĆ Z TERAPEUTĄ." }
  - { kind: pronunciation, text: "Читается «тэрапэ́ута», ударение на предпоследнем слоге: EU — не один звук, а «эу». TE и PE твёрдые." }
collocations:
  - { pl: "terapeuta rodzinny", ru: "семейный психотерапевт" }
  - { pl: "terapeuta uzależnień", ru: "специалист по зависимостям" }
  - { pl: "chodzić do terapeuty", ru: "ходить к психотерапевту" }
family:
  - { pl: "terapia", ru: "терапия", relation: root, id: terapia }
