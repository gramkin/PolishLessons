  - { pl: "terapeutyczny", ru: "терапевтический", relation: derived }
etymology: "Из греческого слова со значением «служитель, лекарь». Русское «терапевт» — то же слово, но в русском оно закрепилось за врачом-интернистом."
memory: "Terapeuta — психотерапевт, реабилитолог, а не врач-«терапевт» (lekarz rodzinny). Читается «тэрапэ́ута». Chodzić do terapeuty — ходить к психотерапевту."
