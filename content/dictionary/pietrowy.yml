notes:
  - { kind: false-friend, text: "Польские этажи считаются иначе, чем русские. PARTER — это русский первый этаж, а PIERWSZE PIĘTRO — уже второй. Поэтому DOM PIĘTROWY значит «дом с первым этажом и одним надстроенным», то есть двухэтажный, а DOM PARTEROWY — одноэтажный. Слово PIĘTRO само по себе обозначает надземный этаж над партером, отсюда и PIĘTROWY." }
  - { kind: usage, text: "Устойчивые сочетания стоит выучить целиком: ŁÓŻKO PIĘTROWE «двухъярусная кровать», AUTOBUS PIĘTROWY «двухэтажный автобус», PARKING PIĘTROWY «многоуровневая парковка», UŁAMEK PIĘTROWY «многоэтажная дробь». Для точного числа этажей есть сложные слова: DWUPIĘTROWY, TRZYPIĘTROWY, WIELOPIĘTROWY. Степеней сравнения у прилагательного нет." }
  - { kind: pronunciation, text: "Носовое Ę перед T звучит как «эн»: PIĘTROWY читается «пентро́вы». Ударение на предпоследнем слоге, на O, как в любом польском слове из трёх слогов." }
