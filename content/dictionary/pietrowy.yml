  - { pl: "parterowy", ru: "одноэтажный", relation: antonym }
etymology: "Образовано от PIĘTRO «этаж» суффиксом -OWY, так же как ZIMOWY от ZIMA."
memory: "PIĘTRO — этаж над партером, значит DOM PIĘTROWY — партер плюс один этаж, двухэтажный дом. Łóżko piętrowe — кровать в два яруса."
idioms:
