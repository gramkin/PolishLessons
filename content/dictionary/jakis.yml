# review
id: jakis
format: 2
lemma: "jakiś"
rank: 94
pos: adj
pron: { cyr: "я́кищ" }
senses:
  - id: some
    ru: "какой-то, какой-нибудь"
    examples:
      - pl: "Uprawiasz jakiś sport?"
        ru: "Ты занимаешься каким-нибудь видом спорта?"
        source: { kind: tatoeba, id: 1353836 }
      - pl: "W jego słowach kryje się jakaś zagadka."
        ru: "В его словах кроется какая-то загадка."
        source: { kind: tatoeba, id: 448856 }
      - pl: "To jakieś bajki."
        ru: "Это какие-то сказки."
        source: { kind: tatoeba, id: 6156323 }
  - id: certain
    ru: "некий, некоторый"
    examples:
      - pl: "Gęś jakimś cudem przeżyła."
        ru: "Гусь каким-то чудом выжил."
        source: { kind: tatoeba, id: 7053595 }
      - pl: "Przeczytałem to opowiadanie w jakiejś książce."
        ru: "Я прочитал этот рассказ в какой-то книге."
        source: { kind: tatoeba, id: 352497 }
notes:
  - { kind: usage, text: "Склоняется как прилагательное с добавленной частицей -ś: jakiegoś, jakiemuś, jakimś." }
  - { kind: usage, text: "Польский не различает «-то» и «-нибудь»: jakiś значит и то и другое, разницу берёт контекст." }
collocations:
  - { pl: "jakiś czas", ru: "некоторое время" }
  - { pl: "w jakimś sensie", ru: "в каком-то смысле" }
etymology: "Из jaki с частицей -ś — так же собраны coś и ktoś; ср. русское «какой-то»."
memory: "Строится по той же модели, что coś и ktoś: основа плюс -ś. Одно слово покрывает оба русских варианта — «какой-то» и «какой-нибудь»."
idioms:
  - { pl: "jakiś czas temu", ru: "некоторое время назад" }
  - { pl: "w jakimś sensie", ru: "в каком-то смысле" }
