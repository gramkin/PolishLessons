# review
id: podszywac
format: 2
lemma: "podszywać"
rank: 5865
pos: verb
aspect: imperf
aspectPair: podszyc
pron: { cyr: "потшыва́ць" }
senses:
  - id: impersonate
    ru: "выдавать себя за кого-л. (podszywać się pod kogoś)"
    examples:
      - pl: "Oszust podszywa się pod pracownika banku."
        ru: "Мошенник выдаёт себя за сотрудника банка."
        source: { kind: authored }
      - pl: "Ktoś podszywał się pod mnie w internecie."
        ru: "Кто-то выдавал себя за меня в интернете."
        source: { kind: authored }
      - pl: "Złodzieje podszywają się pod hydraulików."
        ru: "Воры выдают себя за сантехников."
        source: { kind: authored }
  - id: line-garment
    ru: "подшивать, подбивать (подкладкой, мехом); подшивать подол"
    examples:
      - pl: "Babcia podszywa płaszcz ciepłym futrem."
        ru: "Бабушка подбивает пальто тёплым мехом."
        source: { kind: authored }
      - pl: "Krawcowa podszywała spódnice jedwabiem."
        ru: "Портниха подшивала юбки шёлком."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное значение сегодня — возвратное PODSZYWAĆ SIĘ POD KOGOŚ «выдавать себя за кого-л.»: о мошенниках, фальшивых аккаунтах, фишинге. Буквальное «подшивать подкладку» встречается гораздо реже." }
  - { kind: government, text: "PODSZYWAĆ SIĘ POD + ВИНИТЕЛЬНЫЙ: PODSZYWA SIĘ POD POLICJANTA. По-русски «выдавать себя ЗА кого-то», по-польски — «ПОД кого-то», как будто прячешься под чужой маской. В значении «подшивать»: PODSZYWAĆ COŚ CZYMŚ — винительный и творительный, как в русском." }
  - { kind: usage, text: "Несовершенный вид; совершенный — PODSZYĆ (PODSZYĆ SIĘ). Спряжение на -AM: PODSZYWAM, PODSZYWASZ, PODSZYWAJĄ. Мужско-личное страдательное PODSZYWANI в карточку не включено: подшивают одежду, а не людей." }
  - { kind: pronunciation, text: "D перед SZ оглушается: «потшыва́ць». Ударение на предпоследнем слоге: PODSZYWAM — «потшы́вам»." }
collocations:
  - { pl: "podszywać się pod policjanta", ru: "выдавать себя за полицейского" }
  - { pl: "podszywać się pod bank", ru: "выдавать себя за банк (о мошенниках)" }
  - { pl: "podszywać płaszcz futrem", ru: "подбивать пальто мехом" }
family:
  - { pl: "podszyć", ru: "подшить", relation: aspect, id: podszyc }
  - { pl: "szyć", ru: "шить", relation: root }
  - { pl: "podszewka", ru: "подкладка", relation: derived }
  - { pl: "podszywanie się", ru: "выдача себя за другого", relation: derived }
etymology: "Приставка POD- и SZYWAĆ, итератив от SZYĆ «шить», праславянское *šiti. Переносное «выдавать себя за кого-то» родилось из образа подкладки: прятаться под чужой одеждой."
memory: "Podszywać się pod kogoś — «подшиться под кого-то»: спрятаться под чужой подкладкой. Мошенник podszywa się pod bank."
idioms:
  - { pl: "podszywać się pod kogoś", ru: "выдавать себя за кого-л." }
