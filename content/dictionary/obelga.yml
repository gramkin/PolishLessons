notes:
  - { kind: usage, text: "Женский род. G перед E переходит в DZ: в дательном и местном OBELDZE (как NOGA → NODZE). Звательный OBELGO не употребляется." }
  - { kind: government, text: "«Осыпать оскорблениями» — OBRZUCAĆ KOGOŚ OBELGAMI, «выкрикивать оскорбления» — RZUCAĆ OBELGAMI: оба с творительным, без предлога." }
  - { kind: register, text: "Слово книжное и нейтральное; это всегда слова, а не действие. Разговорный синоним — WYZWISKO «ругательство», более широкое — OBRAZA, ZNIEWAGA «оскорбление»." }
collocations:
