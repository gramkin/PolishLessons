# review
id: dowiadywac
format: 2
lemma: "dowiadywać"
rank: 5296
pos: verb
pron: { cyr: "довяды́ваць" }
senses:
  - id: find-out
    ru: "узнавать (DOWIADYWAĆ SIĘ)"
    examples:
      - pl: "Z gazet dowiadujemy się o wszystkim."
        ru: "Из газет мы узнаём обо всём."
        source: { kind: authored }
      - pl: "Codziennie dowiaduję się czegoś nowego."
        ru: "Каждый день я узнаю что-то новое."
        source: { kind: authored }
      - pl: "O takich rzeczach dowiadywał się ostatni."
        ru: "О таких вещах он узнавал последним."
        source: { kind: authored }
  - id: inquire
    ru: "справляться, наводить справки (DOWIADYWAĆ SIĘ O)"
    examples:
      - pl: "Dowiadywała się o pociągi do Gdańska."
        ru: "Она справлялась о поездах в Гданьск."
        source: { kind: authored }
      - pl: "Dowiaduj się w sekretariacie."
        ru: "Справляйся в секретариате."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DOWIADYWAĆ SIĘ — «узнавать» в смысле «получать сведения». Не путать с POZNAWAĆ «узнавать в лицо» и ROZPOZNAWAĆ «распознавать». Корень тот же, что WIEDZIEĆ «знать» и русское «ведать»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — DOWIEDZIEĆ SIĘ «узнать». Спряжение на -UJĘ: DOWIADUJĘ SIĘ, DOWIADUJESZ SIĘ, DOWIADUJĄ SIĘ. Без SIĘ не употребляется. Безличное DOWIADYWANO и отглагольное существительное в карточку не включены." }
  - { kind: government, text: "Чего — родительный: DOWIADYWAĆ SIĘ CZEGOŚ NOWEGO. О чём — O с предложным: DOWIADYWAĆ SIĘ O WYPADKU. О чём справляться — O с винительным: DOWIADYWAĆ SIĘ O CENĘ, O POCIĄGI. От кого, откуда — OD с родительным, Z с родительным: OD SĄSIADÓW, Z TELEWIZJI." }
  - { kind: pronunciation, text: "Читается «довяды́ваць»: WIA — «вя», ударение на предпоследнем слоге. DOWIADUJĘ SIĘ — «довяду́е сен»." }
  - { kind: register, text: "Нейтральное бытовое слово. В официальной речи о справках — ZASIĘGAĆ INFORMACJI «наводить справки»." }
collocations:
  - { pl: "dowiadywać się czegoś nowego", ru: "узнавать что-то новое" }
  - { pl: "dowiadywać się z gazet", ru: "узнавать из газет" }
  - { pl: "dowiadywać się o cenę", ru: "справляться о цене" }
family:
  - { pl: "dowiedzieć", ru: "узнать (DOWIEDZIEĆ SIĘ)", relation: aspect, id: dowiedziec }
  - { pl: "wiedzieć", ru: "знать", relation: root, id: wiedziec }
  - { pl: "wiadomość", ru: "новость, сообщение", relation: derived, id: wiadomosc }
etymology: "Приставка DO- плюс многократное от WIEDZIEĆ «знать», праславянское *věděti, как русское «ведать», «проведать». Буквально «доузнавать»."
memory: "Dowiadywać się — узнавать: codziennie dowiaduję się czegoś nowego. O + предложный — узнать о; o + винительный — справиться о."
idioms:
  - { pl: "dowiadywać się ostatni", ru: "узнавать последним" }
