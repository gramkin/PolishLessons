notes:
  - { kind: usage, text: "Мужской одушевлённый: винительный совпадает с родительным — widzę pułkownika." }
  - { kind: usage, text: "Слово прозрачно собрано от pułk «полк», ровно как русский «полковник» от «полка»." }
  - { kind: pronunciation, text: "ł читается как у: pułkownik звучит «пууковник», а не «пулковник»." }
  - { kind: usage, text: "Обращение — звательный падеж: panie pułkowniku! По-русски здесь именительный." }
collocations:
  - { pl: "awansować na pułkownika", ru: "получить звание полковника" }
  - { pl: "panie pułkowniku", ru: "господин полковник" }
  - { pl: "stopień pułkownika", ru: "звание полковника" }
family:
  - { pl: "pułk", ru: "полк", relation: root }
  - { pl: "podpułkownik", ru: "подполковник", relation: derived }
etymology: "От pułk «полк» плюс суффикс -ownik. Русский «полковник» собран из тех же частей и тем же способом."
memory: "pułkownik — «полковник», и слово прозрачно: pułk «полк» плюс суффикс. Читается «пууковник», потому что ł даёт у. Обращение — panie pułkowniku."
idioms:
  - { pl: "panie pułkowniku", ru: "господин полковник" }
  - { pl: "awansować na pułkownika", ru: "стать полковником" }
