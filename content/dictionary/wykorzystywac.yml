notes:
  - { kind: false-friend, text: "Корень слова — настоящая ловушка, и притом тонкая. Польское korzyść значит «ПОЛЬЗА, выгода», совершенно нейтрально, а русское однокоренное «корысть» несёт осуждение. Один корень, противоположная оценка. Именно поэтому польский глагол сам по себе нейтрален, а окраску ему задаёт дополнение: wykorzystywać okazję «использовать возможность» — хорошо, wykorzystywać pracowników «эксплуатировать работников» — скверно. Одно слово, два полюса." }
  - { kind: register, text: "ВНИМАНИЕ, важное предупреждение. В юридическом и газетном польском wykorzystywanie — устойчивый термин для злоупотребления и насилия, в том числе над детьми. Поэтому фразу wykorzystywać kogoś нельзя бросать о человеке небрежно: она звучит гораздо тяжелее, чем русское «он меня использует». Если речь о мелкой несправедливости, лучше сказать wykorzystać czyjąś dobroć или просто nadużywać." }
  - { kind: usage, text: "Основа настоящего времени меняется: -ywa- уступает место -uj-, то есть wykorzystywać, но wykorzystuję, wykorzystujesz. Это тот же образец, что у глаголов на -ować (całować — całuję, głosować — głosuję), уже разобранный на соседних карточках. Совершенная пара — wykorzystać." }
  - { kind: government, text: "Используют ЧТО и КОГО — винительный: wykorzystywać okazję, wykorzystywać ludzi. Для чего — предлог DO с РОДИТЕЛЬНЫМ: wykorzystywać program DO pracy, что совпадает с русским «для работы»." }
collocations:
  - { pl: "wykorzystywać okazję", ru: "использовать возможность" }
  - { pl: "wykorzystywać pracowników", ru: "эксплуатировать работников" }
  - { pl: "wykorzystywać dane", ru: "использовать данные" }
family:
  - { pl: "korzyść", ru: "польза, выгода", relation: root }
  - { pl: "wykorzystać", ru: "использовать", relation: aspect, id: wykorzystac }
  - { pl: "korzystać", ru: "пользоваться", relation: root, id: korzystac }
etymology: "Приставка wy- плюс korzystać, от korzyść «польза, выгода». Корень тот же, что в русском «корысть», но оценка разошлась: польский сохранил нейтральное «польза», русский сдвинул слово в сторону осуждения. Отсюда и двойственность глагола — он может значить и честное использование, и эксплуатацию, а решает это дополнение."
memory: "wykorzystywać — «использовать», от korzyść «польза» (русская «корысть» — тот же корень, но с осуждением). Окраску задаёт дополнение: okazję — нейтрально, ludzi — скверно. И основа меняется: wykorzystuję, как całuję."
idioms:
