etymology: "Из немецкого слова, обозначавшего плоскодонную баржу для переправы. Русское «паром» похоже по звуку, но происхождение у него своё."
memory: "Prom — паром. Płynąć promem — плыть на пароме. Prom kosmiczny — шаттл. Płynąć pod prąd — плыть против течения."
idioms:
  - { pl: "płynąć pod prąd", ru: "плыть против течения" }
