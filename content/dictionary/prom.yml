notes:
  - { kind: false-friend, text: "PROM — «паром», и к «промышленности» отношения не имеет. PROM KOSMICZNY — «космический челнок», «шаттл». Переправа на пароме — PRZEPRAWA PROMOWA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — PROMU, местный — NA PROMIE." }
