pos: noun
pron: { cyr: "трэ́нэр" }
senses:
  - id: coach
    ru: "тренер"
    examples:
      - pl: "Mój trener zjada 6 tys. kalorii dziennie."
        ru: "Мой тренер ест 6000 калорий в день."
        source: { kind: tatoeba, id: 993951 }
      - pl: "Trener poprowadził drużynę do zwycięstwa."
        ru: "Тренер привёл команду к победе."
        source: { kind: translated, id: 1354134 }
      - pl: "Jestem trenerem."
        ru: "Я тренер."
        source: { kind: translated, id: 10558480 }
  - id: instructor
    ru: "наставник, инструктор"
    examples:
      - pl: "Wiem, że Tom był kiedyś trenerem mowy."
        ru: "Я знаю, что Том когда-то был тренером по речи."
        source: { kind: translated, id: 9137236 }
      - pl: "Ta drużyna ma dobrego trenera."
        ru: "У этой команды хороший тренер."
        source: { kind: translated, id: 367666 }
notes:
  - { kind: government, text: "В именной части сказуемого творительный: Jestem trenerem «Я тренер», zostać trenerem «стать тренером»." }
  - { kind: usage, text: "Мужской одушевлённый: винительный совпадает с родительным — zatrudnić trenera." }
  - { kind: usage, text: "Лично-мужское множественное — trenerzy, а не trenerowie: Trenerzy rozmawiali przed meczem." }
  - { kind: usage, text: "Женский род — trenerka, глагол — trenować «тренировать и тренироваться»." }
collocations:
  - { pl: "dobry trener", ru: "хороший тренер" }
  - { pl: "trener drużyny", ru: "тренер команды" }
  - { pl: "zostać trenerem", ru: "стать тренером" }
etymology: "Из английского trainer через немецкий. Русский «тренер» пришёл тем же путём, поэтому слова совпадают полностью."
memory: "trener — «тренер», слово то же самое. Творительный после być и zostać: Jestem trenerem. Множественное лично-мужское — trenerzy. Глагол — trenować."
