etymology: "От WYBUCH «взрыв», а тот от WYBUCHNĄĆ, где приставка WY- означает движение изнутри наружу, а корень BUCH- звукоподражательный: он передаёт глухой удар, как русское «бух». Русский из того же звука сделал «бухнуть», польский — «взрыв», и это обычная судьба звукоподражаний: один язык оставляет их в разговорной речи, другой возводит в терминологию. Суффикс -OWY, образующий прилагательные от существительных, даёт WYBUCHOWY буквально «взрывной, относящийся к взрыву», и уже оттуда идёт переносное значение о человеке. Русский для той же метафоры взял другой корень, «вспыльчивый» от «пыла», так что совпадает здесь не слово, а способ думать: внезапное чувство в обоих языках описывают через физическое событие."
memory: "Корень buch- звукоподражательный, как русское «бух», отсюда wybuch «взрыв» и wybuchnąć «взорваться». Прилагательное wybuchowy значит буквально «взрывчатый» (materiał wybuchowy), а переносно — «вспыльчивый» (wybuchowy charakter): там, где русский берёт «пыл», польский берёт взрыв. Та же метафора работает в глаголе: wybuchnąć płaczem — «расплакаться», wybuchnąć śmiechem — «расхохотаться». Степень — через bardziej."
