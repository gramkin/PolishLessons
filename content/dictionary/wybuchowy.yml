notes:
  - { kind: false-friend, text: "Прилагательное образовано от WYBUCH «взрыв», а не от слова со значением «буря», и первое значение прямое: WYBUCHOWY значит «взрывчатый», MATERIAŁ WYBUCHOWY это «взрывчатое вещество». Второе значение переносное и в русском передаётся другим корнем: WYBUCHOWY CHARAKTER это «вспыльчивый характер», то есть человек, который «взрывается». Русский строит этот образ от «пыла», польский — от взрыва, и путаницы здесь не бывает, если помнить корень BUCH. Зато бывает другая ошибка: WYBUCHOWY не значит «взрывоопасный» в техническом смысле — для этого есть ŁATWOPALNY «легковоспламеняющийся» и WYBUCHOWO NIEBEZPIECZNY." }
  - { kind: usage, text: "Одиннадцать форм, степеней сравнения в наборе нет. Для переносного значения степень всё же нужна, и строят её аналитически: BARDZIEJ WYBUCHOWY «более вспыльчивый». Корень виден в целом гнезде: WYBUCH «взрыв», WYBUCHNĄĆ «взорваться, вспыхнуть», и глагол работает и буквально, и о чувствах — WYBUCHNĄĆ PŁACZEM «расплакаться», буквально «взорваться плачем», WYBUCHNĄĆ ŚMIECHEM «расхохотаться». Это продуктивная польская модель: взрыв как метафора внезапного чувства. Наречие — WYBUCHOWO. Устойчивое MIESZANKA WYBUCHOWA употребляется и о веществе, и о людях, которых нельзя сажать рядом." }
  - { kind: pronunciation, text: "Читается «выбухо́вы», четыре слога, ударение на предпоследнем, то есть на CHO. Буква Y в первом слоге это «ы»: «вы», а не «ви». Сочетание CH даёт «х», и это тот же звук, что в русском «ухо». Буква U это «у». Конечное -WY это «вы». В форме WYBUCHOWĄ последнее Ą даёт «он»: «выбухо́вон». В длинной форме WYBUCHOWYMI ударение переезжает на WY: «выбухо́выми» произносится с ударением на третьем слоге от начала и на втором от конца." }
  - { kind: stress, text: "Слово показывает польское правило предпоследнего слога в чистом виде, потому что слогов много и сдвиг заметен. WYBUCHOWY — четыре слога, ударение на CHO. WYBUCHOWEGO — пять слогов, ударение на HO в середине. WYBUCHOWYMI — пять слогов, ударение на WY. Русское «взрывча́тыми» ударение не двигает. Практический вывод: длинные польские прилагательные нельзя произносить по русской инерции, ударение в них считается от конца слова, а не от корня, и каждая новая падежная форма требует нового счёта." }
