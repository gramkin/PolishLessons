family:
  - { pl: "nienawidzić", ru: "ненавидеть", relation: derived, id: nienawidzic }
  - { pl: "widzieć", ru: "видеть", relation: root, id: widziec }
  - { pl: "miłość", ru: "любовь", relation: antonym, id: milosc }
etymology: "Отрицание nie плюс старопольское nawidzieć «смотреть с приязнью, любить», из na и widzieć «видеть». Русское «ненавидеть» собрано из тех же частей: не плюс «навидеть». Суффикс -ość равен русскому -ость, так что буквально это «не-приязнь»."
memory: "nienawiść — «ненависть», разбирается как русское: не плюс «навидеть», то есть смотреть с приязнью. Но управление другое: nienawiść DO kogoś, а глагол nienawidzić требует родительного — nienawidzę GO."
idioms:
