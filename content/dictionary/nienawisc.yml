notes:
  - { kind: government, text: "ДВА РАСХОЖДЕНИЯ В УПРАВЛЕНИИ, И ОБА ЛОВЯТ. Существительное: nienawiść DO kogoś, с предлогом do и родительным, тогда как русский говорит «ненависть К кому-то» с дательным. Глагол ещё коварнее: NIENAWIDZIĆ требует РОДИТЕЛЬНОГО — nienawidzę go, nienawidzę tego człowieka, — а русское «ненавидеть» берёт винительный." }
  - { kind: false-friend, text: "Слово разбирается на части точно так же, как русское. Nie плюс старое nawidzieć «смотреть с приязнью», от na и widzieć «видеть». Русское «ненавидеть» — это не плюс «навидеть», та же сборка. В старопольском nawidzieć ещё значило «любить», и именно его отрицание дало ненависть." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: nie-na-WIŚĆ, точнее nie-NA-wiść. Ni читается как нь, ść как мягкое щць: «нена́віщць». Форма nienawiścią звучит «нена́віщцён»." }
collocations:
