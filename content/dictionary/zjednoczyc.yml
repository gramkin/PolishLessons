notes:
  - { kind: false-friend, text: "ЗВУКОВОЙ ЗАКОН, КОТОРЫЙ ОТКРЫВАЕТ ЦЕЛЫЙ РЯД СЛОВ: польское начальное je- отвечает русскому о-. Jeden — «один», jeleń — «олень», jezioro — «озеро», jesień — «осень». Праславянское начальное *e- в польском получило j-, а в русском перешло в о-. Встретив польское слово на je-, попробуйте русское на о-." }
  - { kind: government, text: "Объединяют КОГО или ЧТО — винительный: zjednoczyć kraj, ludzi, obie firmy. Объединяются С кем — z с ТВОРИТЕЛЬНЫМ: zjednoczyć się z sąsiadami. Против кого — przeciwko с дательным: zjednoczyć się przeciwko komuś. Первые две модели совпадают с русскими, третья требует дательного там, где русский берёт родительный с «против»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — jednoczyć. Причастие zjednoczony закрепилось в названиях, которые нужно знать: Stany Zjednoczone «Соединённые Штаты», Zjednoczone Królestwo «Соединённое Королевство», Organizacja Narodów Zjednoczonych — ООН. Существительное zjednoczenie значит «объединение»." }
  - { kind: pronunciation, text: "Начальное zj- читается слитно и звонко: «зье». Ударение, как всегда, на предпоследнем слоге: zjed-NO-czyć даёт «зьедно́чыць». В формах настоящего-будущего ударение перемещается: zjednoczę — «зьедно́чэн»." }
collocations:
  - { pl: "zjednoczyć kraj", ru: "объединить страну" }
  - { pl: "Stany Zjednoczone", ru: "Соединённые Штаты" }
  - { pl: "zjednoczyć się przeciwko komuś", ru: "объединиться против кого-л." }
family:
  - { pl: "jeden", ru: "один", relation: root, id: jeden }
  - { pl: "jedność", ru: "единство", relation: root }
  - { pl: "zjednoczenie", ru: "объединение", relation: derived }
etymology: "Приставка z- плюс jednoczyć от jeden «один» — та же мысль, что в русском «объединить» от «одного». Корень общий, но начало расходится по закону: польское je- отвечает русскому о-, отсюда jeden при «одном», jesień при «осени», jezioro при «озере». Из того же гнезда jedność «единство» и zjednoczenie «объединение»."
memory: "zjednoczyć — «объединить», от jeden «один». Запомните закон: польское je- отвечает русскому о- (jeden/один, jesień/осень, jezioro/озеро). И название на каждый день: Stany Zjednoczone — «Соединённые Штаты»."
idioms:
