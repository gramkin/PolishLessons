notes:
  - { kind: false-friend, text: "Вот настоящая ловушка: POWROTNY выглядит как русское «поворотный», но значит совсем другое — «обратный». Оно идёт от POWRÓT «возвращение» и от WRACAĆ «возвращаться», а к повороту отношения не имеет. Поворот по-польски ZAKRĘT, а «поворотный момент» — PRZEŁOMOWY MOMENT. Так что BILET POWROTNY это обратный билет, а не какой-нибудь поворотный." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — POWROTNI, именительный множественного для мужчин-людей, и её не употребляют: прилагательное относительное, оно описывает дорогу, билет или рейс, а не человека. Примеров к этой форме в карточке поэтому нет. Прилагательное стоит после существительного и порядок закреплён: BILET POWROTNY, DROGA POWROTNA, LOT POWROTNY." }
  - { kind: government, text: "Запомните оборот целиком: на обратном пути — W DRODZE POWROTNEJ, местный падеж, и предлог именно W, хотя по-русски мы говорим «на пути». Без обратного билета — BEZ BILETU POWROTNEGO, предлог BEZ с родительным. С обратным билетом — Z BILETEM POWROTNYM, творительный. Обратите внимание, что DROGA в местном падеже даёт DRODZE, с чередованием G в DZ." }
  - { kind: pronunciation, text: "Читается «повро́тны», три слога, ударение на предпоследнем. Сочетание WR произносится полностью, без всякой гласной между согласными: «повро», а не «поворо». Конечная Y даёт «ы», и слово кончается на «ны». В женском роде POWROTNA это «повро́тна», в среднем POWROTNE — «повро́тнэ», с «э» на конце." }
  - { kind: register, text: "Слово нейтральное, из языка путешествий и расписаний. На вокзале и в аэропорту слышно BILET POWROTNY, LOT POWROTNY, REJS POWROTNY. В рассказе о поездке — W DRODZE POWROTNEJ и PODRÓŻ POWROTNA. В быту поляки часто говорят просто BILET W DWIE STRONY, «билет в две стороны», и это выражение полезно знать рядом с книжным POWROTNY." }
