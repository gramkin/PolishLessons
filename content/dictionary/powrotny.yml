etymology: "От POWRÓT «возвращение», а то — от WRACAĆ, восходящего к праславянскому корню со значением «вертеть, поворачивать». Тот же корень дал русские «воротить», «возврат» и «обратно». Вот откуда и обманчивое сходство с «поворотным»: корень действительно один, когда-то означавший поворот. Но языки развели смыслы: польский закрепил за POWROTNY возвращение, а поворот отдал слову ZAKRĘT."
memory: "Обратный, а не «поворотный», и это главное: слово идёт от powrot «возвращение» и wracac «возвращаться». Поворот по-польски zakret. Заучите два оборота целиком: bilet powrotny «обратный билет» и w drodze powrotnej «на обратном пути», где предлог w, хотя по-русски «на». Читается «повро́тны», сочетание wr без гласной внутри."
idioms:
