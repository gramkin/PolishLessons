notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: wesele — это СВАДЬБА, а не веселье. Веселье по-польски wesołość или zabawa. Корень общий — wesoły «весёлый», — но слово закрепилось за свадебным пиром." }
  - { kind: government, text: "Средний род: to wesele, tego wesela. На свадьбе — na weselu, предложный падеж." }
  - { kind: usage, text: "Различают ślub «венчание, роспись» и wesele «свадебное застолье»: ślub w kościele, potem wesele." }
  - { kind: usage, text: "Родительный мн. — wesel, без окончания." }
collocations:
  - { pl: "na weselu", ru: "на свадьбе" }
  - { pl: "ślub i wesele", ru: "венчание и свадьба" }
etymology: "От wesoły «весёлый»; русское «веселье» — то же слово, но польское закрепилось за свадьбой."
memory: "wesele — это СВАДЬБА, а не веселье: веселье по-польски zabawa. Различают ślub «венчание» и wesele «застолье»."
