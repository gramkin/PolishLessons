notes:
  - { kind: pronunciation, text: "Этот глагол показывает мену, которой в словаре ещё не было: r переходит в rz. Инфинитив и прошедшее держат r — UKARAĆ, UKARAŁ, UKARANY. А всё настоящее время берёт rz: UKARZĘ, UKARZESZ, UKARZE, UKARZEMY, UKARZECIE, UKARZĄ, и повелительное тоже — UKARZ, UKARZMY, UKARZCIE. Это пятый член набора смягчений перед -e, разобранного в карточке BLIZNA: t даёт ć, d даёт dź, s даёт ś, z даёт ź, а r даёт rz. Русскому мена кажется странной, потому что в русском r перед e не меняется вовсе." }
  - { kind: register, text: "Корень общий с русским, но стилистика разная, и это сбивает. KARA по-польски — слово совершенно обиходное и чаще всего означает «штраф» или «наказание» в самом обычном смысле: KARA PIENIĘŻNA «денежный штраф», KARA UMOWNA «неустойка по договору», KARA ŚMIERCI «смертная казнь». Русская же «кара» звучит книжно и торжественно, в договоре её не встретишь. Так что переводить KARA надо обычно как «наказание» или «штраф», а не как «кара»." }
  - { kind: government, text: "Управление двойное и оба варианта нужны. Человек идёт в винительном: UKARAĆ KOGOŚ. Чем наказали — творительный без предлога: UKARALI GO GRZYWNĄ, MANDATEM, NAGANĄ, то есть «наказали штрафом, выговором». За что — предлог ZA с винительным: UKARAĆ ZA SPÓŹNIENIE, ZA PARKOWANIE. Русский берёт здесь те же предлоги и падежи, так что переносится всё без поправок. Несовершенная пара — KARAĆ." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие UKARAWSZY. Страдательное причастие UKARANY работает и как обычное прилагательное: UKARANY KIEROWCA — «оштрафованный водитель», а в документах UKARANY стоит существительным, как OSKARŻONY: то есть «наказанный, лицо, подвергнутое наказанию». Мужская личная форма множественного — UKARANI." }
collocations:
  - { pl: "ukarać grzywną", ru: "наказать штрафом" }
  - { pl: "ukarać za spóźnienie", ru: "наказать за опоздание" }
  - { pl: "kara pieniężna", ru: "денежный штраф" }
family:
  - { pl: "karać", ru: "наказывать", relation: aspect }
  - { pl: "kara", ru: "наказание, штраф", relation: root, id: kara }
  - { pl: "bezkarny", ru: "безнаказанный", relation: derived }
etymology: "Приставка u- и KARAĆ «наказывать», от KARA «наказание», из праславянского *kara — то же слово, что русская «кара». Соответствие прямое, расходится только стилистика: в польском слово обиходное, в русском возвышенное. Из гнезда вышли KARAĆ, UKARAĆ, KARALNY «наказуемый», BEZKARNY «безнаказанный», KARNY «штрафной» — отсюда RZUT KARNY «пенальти», буквально «штрафной удар»."
memory: "Корень как в русской «каре», но по-польски kara — это обычный «штраф». И помните мену r на rz: ukarać, но ukarzę, ukarz."
idioms:
  - { pl: "rzut karny", ru: "пенальти, штрафной удар" }
  - { pl: "ukarać grzywną", ru: "наказать штрафом" }
