notes:
  - { kind: false-friend, text: "SZCZEPIONKA — «вакцина», от SZCZEPIĆ «прививать». Сама процедура — SZCZEPIENIE: SZCZEPIENIE PRZECIW GRYPIE — прививка от гриппа, но в разговоре говорят и DOSTAĆ SZCZEPIONKĘ. Слово садоводческое: SZCZEPIĆ значило «прививать черенок». Отсюда ZASZCZEPIĆ — и «привить», и «внушить»: ZASZCZEPIĆ MIŁOŚĆ DO KSIĄŻEK." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах K переходит в C: PO SZCZEPIONCE. В родительном множественного беглое E: SZCZEPIONEK. Звательная форма не нужна." }
  - { kind: government, text: "Вакцина от чего-то — SZCZEPIONKA NA COŚ или PRZECIW CZEMUŚ: NA GRYPĘ, PRZECIW ODRZE. После прививки — PO SZCZEPIONCE, местный. Доза вакцины — DAWKA SZCZEPIONKI, родительный." }
  - { kind: pronunciation, text: "Читается «шчэпё́нка», три слога, ударение на втором. SZCZ — «шч», PIO сливается в «пё», как в PIOSENKA «пёсе́нка». В форме SZCZEPIONCE: «шчэпё́нце»." }
collocations:
  - { pl: "nowa szczepionka", ru: "новая вакцина" }
  - { pl: "dawka szczepionki", ru: "доза вакцины" }
  - { pl: "szczepionka przeciw odrze", ru: "вакцина против кори" }
family:
  - { pl: "szczepić", ru: "прививать", relation: root }
  - { pl: "szczepienie", ru: "прививка, вакцинация", relation: derived }
  - { pl: "zaszczepić", ru: "привить; внушить", relation: derived }
etymology: "От SZCZEPIĆ «прививать», сперва в садоводстве: «расщепить ветку и вставить черенок». Корень тот же, что в русских «щепа», «щепка», «расщепить»: польское SZCZ — русское «щ»."
memory: "Szczepionka — вакцина; szczepienie — прививка. Читается «шчэпё́нка». Szczepionka na grypę — прививка от гриппа. Родня русской «щепы»: прививали, расщепив ветку. Zaszczepić miłość — привить любовь."
idioms:
  - { pl: "szczepionka na grypę", ru: "прививка от гриппа" }
  - { pl: "zaszczepić komuś miłość do czegoś", ru: "привить кому-то любовь к чему-то" }
formExamplesSkip:
