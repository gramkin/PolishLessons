        ru: "Усталость металла привела к трещине."
        source: { kind: authored }
      - pl: "Badają zmęczenie materiału pod obciążeniem."
        ru: "Они исследуют усталость материала под нагрузкой."
        source: { kind: authored }
notes:
  - { kind: government, text: "Средний род: zmęczenie, zmęczenia, zmęczeniu. Отглагольное существительное от zmęczyć «утомить»." }
  - { kind: usage, text: "Причину ставят с przez или z: ze zmęczenia «от усталости», padać ze zmęczenia «валиться с ног»." }
  - { kind: usage, text: "Техническое значение «усталость материала» совпадает с русским термином." }
  - { kind: false-friend, text: "Корень тот же, что в русском «мучить» и «мука»: польское męczyć значит «мучить» и «утомлять», поэтому zmęczenie это «измученность», а не «мучение»." }
collocations:
  - { pl: "ze zmęczenia", ru: "от усталости" }
  - { pl: "padać ze zmęczenia", ru: "валиться с ног от усталости" }
  - { pl: "zmęczenie materiału", ru: "усталость материала" }
family:
