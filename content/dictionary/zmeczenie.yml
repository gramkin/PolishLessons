# review
id: zmeczenie
format: 2
lemma: "zmęczenie"
rank: 2606
pos: noun
pron: { cyr: "змэнчэ́нье" }
senses:
  - id: tiredness
    ru: "усталость, утомление"
    examples:
      - pl: "Dosłownie padam z nóg ze zmęczenia."
        ru: "Я буквально валюсь с ног от усталости."
