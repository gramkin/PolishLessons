etymology: "Отглагольное существительное от zmęczyć «утомить», корень тот же, что в русском «мучить» и «мука». Польский развил его в сторону утомления, русский — в сторону страдания, отсюда ложное созвучие."
memory: "zmęczenie — «усталость», от męczyć «мучить, утомлять». Русское «мучение» того же корня, но значение польского слова мягче: не мука, а измученность."
