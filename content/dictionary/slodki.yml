# review
id: slodki
format: 2
lemma: "słodki"
rank: 690
pos: adj
pron: { cyr: "сво́дки" }
senses:
  - id: sweet
    ru: "сладкий"
    examples:
      - pl: "Cukier jest słodki."
        ru: "Сахар сладкий."
        source: { kind: tatoeba, id: 1581297 }
      - pl: "To jabłko jest słodkie."
        ru: "Это яблоко сладкое."
        source: { kind: tatoeba, id: 531574 }
      - pl: "Ta herbata jest zbyt słodka."
        ru: "Этот чай слишком сладкий."
        source: { kind: tatoeba, id: 8658895 }
  - id: cute
    ru: "милый, славный (о человеке, животном)"
    note: "Второе значение, как английское sweet."
    examples:
      - pl: "Sowy są słodkie."
        ru: "Совы милые."
        source: { kind: tatoeba, id: 12470084 }
      - pl: "Jesteś słodki."
        ru: "Ты милый."
        source: { kind: translated, id: 5665035 }
      - pl: "Jesteś słodka."
        ru: "Ты милая."
        source: { kind: translated, id: 2216874 }
  - id: something-sweet
    ru: "coś słodkiego — что-нибудь сладкое"
    examples:
      - pl: "Mam ochotę na coś słodkiego."
        ru: "Мне хочется чего-нибудь сладкого."
        source: { kind: tatoeba, id: 8493344 }
      - pl: "Chciałbym coś słodkiego."
        ru: "Я хотел бы чего-нибудь сладкого."
        source: { kind: translated, id: 356056 }
      - pl: "Chcę coś słodkiego."
        ru: "Хочу чего-нибудь сладкого."
        source: { kind: translated, id: 531163 }
  - id: sweeter
    ru: "słodszy — слаще; милее"
    examples:
      - pl: "Czy króliki są słodsze niż wiewiórki?"
        ru: "Кролики милее белок?"
        source: { kind: tatoeba, id: 5397505 }
      - pl: "Twój głos jest dla mnie słodszy nawet od śpiewu młodych ptaków."
        ru: "Твой голос для меня слаще даже пения молодых птиц."
        source: { kind: translated, id: 3894947 }
      - pl: "Kobieta to najsłodsza rzecz na świecie."
        ru: "Женщина — самое милое создание на свете."
        source: { kind: translated, id: 13074612 }
notes:
  - { kind: pronunciation, text: "Читается «сло́дки»: ł здесь даёт «в»-образный звук, так что на слух ближе «сву́дки». Главное — не читать ł как русское «л»." }
  - { kind: usage, text: "Кроме вкуса слово значит «милый, славный»: Sowy są słodkie «Совы милые», Jesteś słodki. Русский разводит «сладкий» и «милый», польский держит оба смысла." }
  - { kind: usage, text: "Степени сравнения живые: słodki — słodszy — najsłodszy, с чередованием d/dz перед -szy." }
  - { kind: usage, text: "Устойчивое: słodkich snów! «сладких снов!», słodka woda «пресная вода» (не «сладкая»)." }
collocations:
  - { pl: "słodkich snów!", ru: "сладких снов!" }
  - { pl: "coś słodkiego", ru: "что-нибудь сладкое" }
  - { pl: "słodka woda", ru: "пресная вода" }
  - { pl: "Jesteś słodki", ru: "Ты милый" }
family:
  - { pl: "słodycz", ru: "сладость", relation: derived }
  - { pl: "słodzić", ru: "подслащивать", relation: derived }
  - { pl: "słodycze", ru: "сладости", relation: derived }
etymology: "Праславянское *soldъkъ — то же слово, что русское «сладкий». Польское ło стоит на месте русского полногласного «оло»: słodki — «солодкий, сладкий», złoto — «золото»."
memory: "słodki — «сладкий», и корень тот же, что в русском, только без полногласия: польское ło отвечает русскому «оло», как в złoto «золото». Держите в голове второе значение: słodki это ещё и «милый, славный» — Sowy są słodkie, Jesteś słodki, — там, где русский берёт другое слово. И запомните słodka woda: это «пресная вода», а не сладкая."
idioms:
  - { pl: "słodkich snów!", ru: "сладких снов!" }
  - { pl: "coś słodkiego", ru: "что-нибудь сладкое" }
  - { pl: "słodka woda", ru: "пресная вода" }
