# review
id: firanka
format: 2
lemma: "firanka"
rank: 6044
pos: noun
pron: { cyr: "фира́нка" }
senses:
  - id: net-curtain
    ru: "тюль, тюлевая занавеска"
    examples:
      - pl: "Firanki, które kupiła mama, nie pasowały kolorystycznie do dywanu."
        ru: "Тюль, который купила мама, не подходил по цвету к ковру."
        source: { kind: translated, id: 3140022 }
      - pl: "Miałem rozsunięte firanki, więc widziałem, co się działo na dworze."
        ru: "Занавески у меня были раздвинуты, так что я видел, что происходит на улице."
        source: { kind: translated, id: 12041164 }
      - pl: "Przez cienką firankę wpadało słońce."
        ru: "Сквозь тонкую занавеску пробивалось солнце."
        source: { kind: authored }
  - id: veil
    ru: "перен. завеса, пелена (дождя, тумана)"
    examples:
      - pl: "Za firanką deszczu ledwo było widać wieżę kościoła."
        ru: "За пеленой дождя едва была видна колокольня."
        source: { kind: authored }
      - pl: "Nad jeziorem wisiała biała firanka mgły."
        ru: "Над озером висела белая завеса тумана."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "FIRANKA — не «фиранка» и не штора, а лёгкий прозрачный тюль на окне. Плотная штора, которую задёргивают на ночь, — ZASŁONA. В польской квартире обычно висит и то и другое: firanka днём, zasłony вечером." }
  - { kind: usage, text: "Чаще во множественном: wieszać firanki, prać firanki — «вешать, стирать тюль», даже если полотно одно. Русское «тюль» мужского рода и единственного числа, польское FIRANKA — женского, и у окна их обычно несколько." }
  - { kind: pronunciation, text: "Читается «фира́нка», ударение на предпоследнем слоге. В родительном множественного выпадает беглое E: FIRANEK — «фира́нэк». В дательном и предложном K переходит в C: na firance, «на занавеске»." }
  - { kind: register, text: "Нейтральное бытовое слово. Выражение ZZA FIRANKI — «из-за занавески» — устойчиво описывает любопытную соседку, которая подглядывает за двором." }
collocations:
  - { pl: "powiesić firanki", ru: "повесить тюль" }
  - { pl: "prać firanki", ru: "стирать занавески" }
  - { pl: "rozsunąć firanki", ru: "раздвинуть занавески" }
  - { pl: "zza firanki", ru: "из-за занавески" }
family:
  - { pl: "firana", ru: "занавес, длинная занавеска", relation: root }
  - { pl: "firankowy", ru: "тюлевый, для тюля", relation: derived }
etymology: "Уменьшительное от FIRANA, «занавеска», из немецкого VORHANG — «то, что висит впереди», от VOR, «перед», и HANGEN, «висеть». Слово пришло в польский через городской немецкий быт, как и многие названия домашних вещей; русский взял для того же предмета французское «тюль»."
memory: "Firanka — тюль на окне, от немецкого Vorhang, «висящее впереди». Плотная штора — zasłona. Подглядывать zza firanki — как любопытная соседка. Родительный множественного — firanek."
idioms:
  - { pl: "zza firanki", ru: "исподтишка, из-за занавески (о любопытных соседях)" }
