    pl: "Lubię podążać za modą."
    ru: "Я люблю следовать моде."
    source: { kind: translated, id: 12720560 }
  - form: "podążać"
    pl: "Ludzie szukają drogi, którą powinni podążać nawet, gdy są w ciemności."
    ru: "Люди ищут дорогу, по которой им идти, даже когда они в темноте."
    source: { kind: translated, id: 13560434 }
  - form: "podążaj"
    pl: "Podążaj jego przykładem."
    ru: "Следуй его примеру."
    source: { kind: translated, id: 10605257 }
  - form: "podążaj"
    pl: "Podążaj za tym samochodem."
    ru: "Следуй за той машиной."
    source: { kind: translated, id: 10572615 }
  - form: "podążaj"
    pl: "Nie podążaj za mną."
    ru: "Не иди за мной."
    source: { kind: translated, id: 10634797 }
  - form: "podążają"
    pl: "Jak to jest mieć cały czas ludzi, którzy za tobą podążają?"
    ru: "Каково это — всё время иметь людей, которые ходят за тобой?"
    source: { kind: translated, id: 5988575 }
  - form: "podążają"
    pl: "Dzieci podążają za matką."
    ru: "Дети идут за матерью."
    source: { kind: authored }
  - form: "podążają"
    pl: "Wszyscy podążają w tę samą stronę."
    ru: "Все движутся в одну сторону."
    source: { kind: authored }
  - form: "podążając"
    pl: "Nauczył się grać w golfa obserwując innych i podążając za ich przykładem."
    ru: "Он научился играть в гольф, наблюдая за другими и следуя их примеру."
    source: { kind: translated, id: 1354020 }
  - form: "podążając"
    pl: "Szedł, podążając za śladami."
    ru: "Он шёл, следуя по следам."
    source: { kind: authored }
  - form: "podążając"
    pl: "Podążając za mapą, dotarli na miejsce."
    ru: "Следуя карте, они добрались до места."
    source: { kind: authored }
  - form: "podążajcie"
    pl: "Podążajcie za tym samochodem."
    ru: "Следуйте за той машиной."
    source: { kind: translated, id: 12184134 }
  - form: "podążajcie"
    pl: "Podążajcie za przewodnikiem."
    ru: "Следуйте за проводником."
    source: { kind: authored }
  - form: "podążajcie"
    pl: "Podążajcie tą ścieżką."
    ru: "Идите по этой тропинке."
    source: { kind: authored }
  - form: "podążał"
    pl: "Podążał za nią."
    ru: "Он шёл за ней."
    source: { kind: translated, id: 6534261 }
  - form: "podążał"
    pl: "On podążał za liderem."
    ru: "Он следовал за лидером."
    source: { kind: translated, id: 12953736 }
  - form: "podążał"
    pl: "Mężczyzna w czerni uciekał przez pustynię, a rewolwerowiec podążał za nim."
    ru: "Человек в чёрном убегал через пустыню, а стрелок шёл за ним."
    source: { kind: translated, id: 1110189 }
  - form: "podążała"
    pl: "Chmara komarów podążała za nim."
    ru: "Туча комаров летела за ним."
    source: { kind: translated, id: 6446342 }
  - form: "podążała"
    pl: "Dziewczyna wszędzie podążała za swoją matką."
    ru: "Девочка всюду ходила за своей матерью."
    source: { kind: translated, id: 10581621 }
  - form: "podążała"
    pl: "Podążała za nim bez słowa."
    ru: "Она шла за ним молча."
    source: { kind: authored }
  - form: "podążało"
    pl: "Dwóch detektywów podążało za podejrzanym."
    ru: "Двое детективов следовали за подозреваемым."
    source: { kind: translated, id: 4769066 }
  - form: "podążało"
    pl: "Za wozem podążało kilka psów."
    ru: "За телегой бежало несколько собак."
    source: { kind: authored }
  - form: "podążało"
    pl: "Stado podążało na południe."
    ru: "Стадо двигалось на юг."
    source: { kind: authored }
  - form: "podążały"
    pl: "Podążały za nimi."
    ru: "Они шли за ними."
    source: { kind: translated, id: 12189136 }
  - form: "podążały"
    pl: "Chmury podążały na wschód."
    ru: "Облака двигались на восток."
    source: { kind: authored }
  - form: "podążały"
    pl: "Dzieci podążały za nauczycielką."
    ru: "Дети шли за учительницей."
    source: { kind: authored }
  - form: "podążasz"
    pl: "Podążasz we właściwym kierunku."
    ru: "Ты движешься в правильном направлении."
    source: { kind: translated, id: 13296327 }
