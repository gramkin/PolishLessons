formExamples:
  - form: "podąża"
    pl: "Podąża za nim z dużej odległości."
    ru: "Он следует за ним с большого расстояния."
    source: { kind: translated, id: 12352521 }
  - form: "podąża"
    pl: "Chwała podąża za cnotą jak by była jej cieniem."
    ru: "Слава следует за доблестью, словно её тень."
    source: { kind: translated, id: 3743351 }
  - form: "podąża"
    pl: "Pies podąża za panem."
    ru: "Собака идёт за хозяином."
    source: { kind: authored }
  - form: "podążać"
    pl: "Przestań podążać za Tomem."
    ru: "Перестань ходить за Томом."
    source: { kind: translated, id: 3501201 }
