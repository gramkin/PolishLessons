# review
id: podazac
format: 2
lemma: "podążać"
rank: 2460
pos: verb
aspect: imperf
pron: { cyr: "подо́нжаць" }
senses:
  - id: follow
    ru: "следовать, идти за (кем-л.)"
    examples:
      - pl: "Podążał za nią."
        ru: "Он шёл за ней."
        source: { kind: translated, id: 6534261 }
      - pl: "Podążaj za tym samochodem."
        ru: "Следуй за той машиной."
        source: { kind: translated, id: 10572615 }
      - pl: "Przestań podążać za Tomem."
        ru: "Перестань ходить за Томом."
        source: { kind: translated, id: 3501201 }
  - id: head-for
    ru: "направляться, двигаться (куда-л.)"
    examples:
      - pl: "Podążasz we właściwym kierunku."
        ru: "Ты движешься в правильном направлении."
        source: { kind: translated, id: 13296327 }
      - pl: "Lubię podążać za modą."
        ru: "Я люблю следовать моде."
        source: { kind: translated, id: 12720560 }
notes:
  - { kind: government, text: "Следовать ЗА кем-л. — podążać ZA kimś, с творительным падежом, ровно как в русском." }
  - { kind: usage, text: "Слово книжное и слегка приподнятое. В обычной речи «идти за кем-то» — iść za kimś, а «следить за кем-то» — śledzić kogoś, уже без предлога." }
  - { kind: false-friend, text: "Корень dążyć «стремиться»: podążać — это идти, стремясь за чем-то. Не путайте с dążyć do czegoś «стремиться к чему-л.», где предлог другой." }
  - { kind: usage, text: "Совершенный вид — podążyć. Podążaj za mną «Следуй за мной» — обычная команда." }
collocations:
  - { pl: "podążać za kimś", ru: "следовать за кем-л." }
  - { pl: "podążać za modą", ru: "следовать моде" }
etymology: "po- + dążyć «стремиться»; идти, стремясь за чем-то."
memory: "podążać za kimś — «следовать за кем-л.», с творительным, как в русском. Слово книжное: в живой речи скажут iść za kimś. Совершенный вид — podążyć."
idioms:
  - { pl: "podążać za kimś", ru: "следовать за кем-л." }
