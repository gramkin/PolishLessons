notes:
  - { kind: false-friend, text: "Слово то же, что русский «карабин», но объём значений разный, и русский здесь шире. По-польски KARABIN это огнестрельное оружие, винтовка, и ничего больше. Металлический крюк с защёлкой, который по-русски тоже «карабин» — альпинистский, на поводке, на ремне, — по-польски называется KARABINEK, и это не уменьшительное от KARABIN в бытовом смысле, а отдельное слово. Путаница возможна в обе стороны, потому что KARABINEK вдобавок означает и короткую винтовку, карабин в военном смысле. Поэтому KARABINEK DO PSA это «карабин для собаки», а KARABINEK WOJSKOWY — «армейский карабин»." }
  - { kind: government, text: "Мужской род, неодушевлённое, и у него два родительных единственного: KARABINA и KARABINU. Оба нормативны, и это та же свобода, что у KRAWAT с его KRAWATA и KRAWATU. Винительный равен именительному: WZIĄĆ KARABIN. Местный KARABINIE, где N смягчается перед -IE. С чем идут — предлог Z с творительным: Z KARABINEM NA RAMIENIU. Из чего стреляют — предлог Z с родительным: STRZELAĆ Z KARABINU. Родительный множественного KARABINÓW." }
  - { kind: pronunciation, text: "Читается «кара́бин», ударение на предпоследнем слоге из трёх, как и в русском. Все согласные твёрдые, кроме конечного сочетания. В местном падеже KARABINIE буква N смягчается и звучит «не»: «караби́не», слогов становится четыре, и ударение переходит на предпоследний. В родительном множественного KARABINÓW буква Ó даёт «у», а конечное W оглушается в «ф»: «караби́нуф». Фонетически слово простое, и внимание уходит на два родительных." }
  - { kind: usage, text: "Частотные сочетания: KARABIN MASZYNOWY «пулемёт» — буквально «машинный карабин», и это главное, что стоит запомнить, потому что по-русски это уже не карабин вовсе; KARABIN SNAJPERSKI «снайперская винтовка», ZŁOŻYĆ KARABINY W KOZŁY, STRZELAĆ Z KARABINU. Уменьшительное KARABINEK означает и короткую винтовку, и металлический крюк. Прилагательное KARABINOWY встречается в сочетании NABÓJ KARABINOWY «винтовочный патрон»." }
