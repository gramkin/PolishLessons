etymology: "Через французское CARABINE из средневекового CARABIN — так называли конного стрелка, и слово это, по одной из версий, идёт от CALABRIN, то есть «калабрийца», по итальянской области, а по другой — от арабского корня со значением «метательное оружие». Польский взял слово из французского, русский — тем же путём и в то же время, поэтому формы совпадают. Расхождение в значениях возникло позже и уже внутри каждого языка: русский перенёс название на пружинный крюк по сходству защёлки с ружейным замком, а польский для крюка образовал отдельное слово KARABINEK. Так одно заимствование дало в двух языках разный объём смыслов, и ошибка возникает не из происхождения, а из последующего развития."
memory: "Только огнестрельное оружие: альпинистский или собачий карабин по-польски karabinek, отдельное слово. Karabin maszynowy значит «пулемёт», а не карабин. Два родительных единственного, karabina и karabinu, оба правильные — та же свобода, что у krawata и krawatu. Местный karabinie с мягким н. Стрелять — strzelać z karabinu, родительный с предлогом z."
