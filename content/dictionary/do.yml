notes:
  - { kind: government, text: "do требует родительного падежа: do domu, do Polski, do ciebie." }
  - { kind: usage, text: "Русское «в» при направлении передаётся именно через do: jadę do Warszawy «еду в Варшаву». Предлог w отвечает только на вопрос «где»." }
collocations:
