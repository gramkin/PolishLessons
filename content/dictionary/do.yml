  - { pl: "do domu", ru: "домой" }
etymology: "Праславянское *do — то же, что русское «до»; в польском этот предлог взял на себя ещё и значение русского «в (куда)»."
memory: "Главное расхождение с русским: направление — это do + родительный, а не «в» с винительным. Idę do domu «иду домой», jadę do Warszawy «еду в Варшаву». Отсюда же формула прощания Do widzenia."
