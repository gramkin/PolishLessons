# review
id: zwyczajnie
format: 2
lemma: "zwyczajnie"
rank: 4223
pos: adv
pron: { cyr: "звыча́йне" }
senses:
  - id: plainly
    ru: "обыкновенно, просто, без затей"
    examples:
      - pl: "Wyglądał zupełnie zwyczajnie."
        ru: "Он выглядел совершенно обыкновенно."
        source: { kind: authored }
      - pl: "Dzień zaczął się zwyczajnie."
        ru: "День начался как обычно."
        source: { kind: authored }
      - pl: "Pokój był urządzony zwyczajnie, ale gustownie."
        ru: "Комната была обставлена просто, но со вкусом."
        source: { kind: authored }
  - id: simply
    ru: "просто (усилительное)"
    examples:
      - pl: "Zwyczajnie nie miałem czasu."
        ru: "У меня просто не было времени."
        source: { kind: authored }
      - pl: "On się zwyczajnie boi."
        ru: "Он просто боится."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZWYCZAJNIE — «обыкновенно, просто», а «обычно» в смысле «как правило» — ZWYKLE: ZWYKLE WSTAJĘ O SIÓDMEJ. ZWYCZAJNIE описывает не частоту, а заурядность: UBRANY ZWYCZAJNIE, «одет просто»." }
  - { kind: usage, text: "Наречие со степенями: ZWYCZAJNIE, ZWYCZAJNIEJ, NAJZWYCZAJNIEJ. Превосходная живёт в обороте NAJZWYCZAJNIEJ W ŚWIECIE, «самым обыкновенным образом». В разговоре ZWYCZAJNIE часто значит «просто»: ZWYCZAJNIE ZAPOMNIAŁEM." }
  - { kind: government, text: "Наречие ничем не управляет. Синоним в значении «просто» — PO PROSTU: PO PROSTU NIE CHCĘ, «просто не хочу»." }
  - { kind: pronunciation, text: "Читается «звыча́йне», ударение на предпоследнем слоге. ZWY — «звы», CZAJ — «чай»." }
collocations:
  - { pl: "zwyczajnie zapomnieć", ru: "просто забыть" }
  - { pl: "ubrany zwyczajnie", ru: "одетый просто" }
  - { pl: "najzwyczajniej w świecie", ru: "самым обыкновенным образом" }
family:
  - { pl: "zwyczaj", ru: "обычай", relation: root, id: zwyczaj }
  - { pl: "zwyczajny", ru: "обыкновенный", relation: root }
  - { pl: "zwykły", ru: "обычный", relation: root, id: zwykly }
etymology: "От ZWYCZAJNY «обыкновенный», а то — от ZWYCZAJ «обычай». Корень тот же, что в русских «обычай», «привыкнуть», «навык»."
memory: "Zwyczajnie — обыкновенно, просто: zwyczajnie zapomniałem. «Обычно» как правило — zwykle. Читается «звыча́йне». Najzwyczajniej w świecie — самым обыкновенным образом."
idioms:
  - { pl: "najzwyczajniej w świecie", ru: "самым обыкновенным образом, проще простого" }
formExamples:
  - form: "najzwyczajniej"
    pl: "Najzwyczajniej w świecie zasnął."
    ru: "Он самым обыкновенным образом уснул."
    source: { kind: authored }
  - form: "najzwyczajniej"
    pl: "Najzwyczajniej zapomniał o urodzinach żony."
    ru: "Он попросту забыл о дне рождения жены."
    source: { kind: authored }
  - form: "najzwyczajniej"
    pl: "To się stało najzwyczajniej, bez żadnych cudów."
    ru: "Всё произошло проще простого, безо всяких чудес."
    source: { kind: authored }
  - form: "zwyczajnie"
    pl: "Ubrała się zwyczajnie, bez biżuterii."
    ru: "Она оделась просто, без украшений."
    source: { kind: authored }
  - form: "zwyczajnie"
    pl: "Zwyczajnie zapomniałem."
    ru: "Я просто забыл."
    source: { kind: authored }
  - form: "zwyczajnie"
    pl: "Chcę po prostu zwyczajnie odpocząć."
    ru: "Я хочу просто отдохнуть, без затей."
    source: { kind: authored }
  - form: "zwyczajniej"
    pl: "Mów zwyczajniej, bez tych mądrych słów."
    ru: "Говори проще, без этих умных слов."
