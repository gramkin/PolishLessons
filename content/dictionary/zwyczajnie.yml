  - form: "zwyczajniej"
    pl: "Na co dzień ubiera się zwyczajniej."
    ru: "В будни она одевается проще."
    source: { kind: authored }
  - form: "zwyczajniej"
    pl: "Mieszkanie urządzili zwyczajniej, niż myślałem."
