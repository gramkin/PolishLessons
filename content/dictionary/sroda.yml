etymology: "От праславянского *serda «середина»: среда это середина недели, если считать её от воскресенья. Русскому корень знаком с двух сторон сразу — книжное «среда» пришло из церковнославянского, а народное «середа» сохранилось в говорах, и рядом стоят «середина», «средний», «посреди». Польский дал ŚRO- там, где русский даёт СЕРЕ- или СРЕ-, и это же соответствие видно в паре ŚRODEK и «середина», ŚRÓDMIEŚCIE и «центр города», буквально «средогородье», WŚRÓD и «среди». Значение «окружение» выросло в русском из той же середины, как то, что находится вокруг и посреди, но польский для этого смысла построил отдельное слово ŚRODOWISKO, и потому многозначности русской «среды» здесь нет."
memory: "Только день недели. Окружающая среда — środowisko, и ochrona środowiska «охрана окружающей среды». В среду — w środę, винительный, как и в русском; но «по средам» — одним словом środami, творительный без предлога. Родительный множественного śród редкий и с ó. Корень тот же, что в «середине»: польское śro- против русского сере-, как środek и «середина»."
