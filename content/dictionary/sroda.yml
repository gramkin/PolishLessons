notes:
  - { kind: false-friend, text: "Русская «среда» значит две вещи: день недели и окружение. Польская ŚRODA — только день. Окружение, среда обитания это ŚRODOWISKO: OCHRONA ŚRODOWISKA «охрана окружающей среды», ŚRODOWISKO NAUKOWE «научная среда». Сказать OCHRONA ŚRODY нельзя, это прозвучит как «охрана среды, дня недели». Разделение строгое и запомнить его стоит сразу: ŚRODA это календарь, ŚRODOWISKO это всё остальное, что по-русски называется средой." }
  - { kind: government, text: "Женский род на -A. Главная конструкция — день недели с предлогом W и винительным падежом: W ŚRODĘ «в среду», и это совпадает с русским «в среду». Не местный падеж: W ŚRODZIE сказать нельзя. Повторяемость выражается творительным множественного без предлога: ŚRODAMI «по средам», где русский берёт предлог «по» с дательным. Рядом живёт равноправное W KAŻDĄ ŚRODĘ «каждую среду». Родительный множественного ŚRÓD, без окончания и с Ó, формой редкой и книжной; в живой речи обходятся оборотом с числительным и словом «раз»." }
  - { kind: pronunciation, text: "Читается «сьро́да», ударение на предпоследнем слоге. Начальное ŚR это сочетание мягкого «сь» с «р», для русского непривычное: в русском на этом месте стоит «сре» или «сере». Буква O в корне обычная, не Ó, поэтому звучит «о». В винительном ŚRODĘ конечное -Ę на конце слова теряет носовой призвук и звучит просто «э»: «сьро́дэ». В местном ŚRODZIE сочетание DZI даёт «дзь»: «сьро́дзе». В родительном множественного ŚRÓD буква Ó звучит «у»: «сьруд»." }
  - { kind: usage, text: "Названия дней недели в польском пишутся с маленькой буквы, как и в русском: ŚRODA, PONIEDZIAŁEK, CZWARTEK. С большой — только в составных названиях праздников: ŚRODA POPIELCOWA «Пепельная среда». Нужные обороты: W ŚRODĘ, DO ŚRODY, OD ŚRODY, CO DRUGĄ ŚRODĘ «через среду». В значении «в прошлую среду» говорят W ZESZŁĄ ŚRODĘ, «в следующую» — W PRZYSZŁĄ ŚRODĘ. Слово ŚRODEK «середина, средство» того же корня, и его многозначность — середина, средство, медикамент — к дню недели отношения не имеет." }
