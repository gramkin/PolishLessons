  - id: under-bridge
    ru: "под мостом, на мосту, через мост"
    examples:
      - pl: "Pod mostem było ciemno."
        ru: "Под мостом было темно."
        source: { kind: translated, id: 8541233 }
      - pl: "Niebezpiecznie jest iść po moście."
        ru: "По мосту идти опасно."
        source: { kind: tatoeba, id: 5909090 }
      - pl: "Po moście można przedostać się na wyspę."
        ru: "По мосту можно перебраться на остров."
        source: { kind: translated, id: 676161 }
  - id: burn-bridges
    ru: "palić mosty — сжигать мосты"
    examples:
      - pl: "Nie pal za sobą mostów."
        ru: "Не жги за собой мосты."
        source: { kind: translated, id: 13661966 }
      - pl: "Mów prosto z mostu."
        ru: "Говори прямо, без обиняков."
        source: { kind: translated, id: 590324 }
notes:
  - { kind: usage, text: "«На мосту» — na moście (предложный), «под мостом» — pod mostem (творительный), «с моста» — z mostu (родительный)." }
  - { kind: usage, text: "palić za sobą mosty — «сжигать за собой мосты», то же выражение, что в русском." }
  - { kind: usage, text: "mówić prosto z mostu значит «говорить прямо, без обиняков» — буквально «прямо с моста»." }
  - { kind: usage, text: "potrzebny jak dziura w moście — «нужен как дырка в мосту», то есть совершенно не нужен." }
collocations:
  - { pl: "na moście", ru: "на мосту" }
  - { pl: "pod mostem", ru: "под мостом" }
  - { pl: "palić za sobą mosty", ru: "сжигать мосты" }
etymology: "Праславянское *mostъ — то же слово, что русское «мост», с тем же значением и теми же идиомами: palić mosty «сжигать мосты»."
memory: "most = «мост», прямой родственник. Падежи: na moście «на мосту», pod mostem «под мостом». И две идиомы: palić za sobą mosty «сжигать мосты», prosto z mostu «прямо, без обиняков»."
idioms:
