notes:
  - { kind: false-friend, text: "koszula — это рубашка с рукавами и пуговицами. Футболка называется koszulka, с уменьшительным суффиксом, а не koszula." }
  - { kind: usage, text: "koszula nocna — «ночная рубашка»; być bez koszuli — «быть без рубашки»." }
  - { kind: government, text: "В рубашке — w koszuli (предложный падеж): dobrze ci w tej koszuli «тебе идёт эта рубашка»." }
  - { kind: usage, text: "Пословица bliższa koszula ciału слово в слово отвечает русской «своя рубашка ближе к телу»." }
collocations:
  - { pl: "koszula nocna", ru: "ночная рубашка" }
  - { pl: "wyprasować koszulę", ru: "погладить рубашку" }
  - { pl: "biała koszula", ru: "белая рубашка" }
family:
  - { pl: "koszulka", ru: "футболка", relation: root }
  - { pl: "podkoszulek", ru: "майка", relation: root }
etymology: "Из латинского casula «плащ с капюшоном» через германские языки; русское «рубашка» — слово другого корня, от «руб» «кусок ткани»."
memory: "koszula — «рубашка», а футболка — koszulka, с уменьшительным суффиксом. И пословица та же: bliższa koszula ciału «своя рубашка ближе к телу»."
idioms:
  - { pl: "bliższa koszula ciału", ru: "своя рубашка ближе к телу" }
  - { pl: "koszula nocna", ru: "ночная рубашка" }
  - { pl: "oddać ostatnią koszulę", ru: "отдать последнюю рубашку" }
