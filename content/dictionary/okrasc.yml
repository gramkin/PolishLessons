# review
id: okrasc
format: 2
lemma: "okraść"
rank: 3586
pos: verb
pron: { cyr: "о́красьць" }
senses:
  - id: rob
    ru: "обокрасть, ограбить (кого-то)"
    examples:
      - pl: "Kieszonkowiec okradł turystę."
        ru: "Карманник обокрал туриста."
        source: { kind: authored }
      - pl: "Okradli nas w nocy."
        ru: "Нас обокрали ночью."
        source: { kind: authored }
      - pl: "Okradli bank i uciekli."
        ru: "Они ограбили банк и сбежали."
        source: { kind: authored }
  - id: rob-of
    ru: "лишить, обобрать (кого-то чего-то) — OKRAŚĆ Z"
    examples:
      - pl: "Okradła męża z oszczędności."
        ru: "Она обобрала мужа, забрав его сбережения."
        source: { kind: authored }
      - pl: "Czuł się okradziony z najlepszych lat."
        ru: "Он чувствовал, что у него украли лучшие годы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OKRAŚĆ — «обокрасть» (кого-то), а UKRAŚĆ — «украсть» (что-то): OKRAŚĆ SĄSIADA, но UKRAŚĆ PORTFEL. OKRAŚĆ KOGOŚ Z CZEGOŚ — «обобрать кого-то, лишив чего-то»." }
  - { kind: usage, text: "Пятьдесят три формы. Будущее с -N-: OKRADNĘ, OKRADNIESZ, повелительное OKRADNIJ; прошедшее — OKRADŁ, страдательное — OKRADZIONY, деепричастие — OKRADŁSZY. Глагола «okradnąć» нет, хотя будущее время его напоминает. Несовершенный вид — OKRADAĆ." }
  - { kind: government, text: "Кого или что — винительный: OKRAŚĆ TURYSTĘ, OKRAŚĆ SKLEP. Чего лишить — Z с родительным: OKRAŚĆ KOGOŚ Z PIENIĘDZY, Z OSZCZĘDNOŚCI." }
  - { kind: pronunciation, text: "Читается «о́красьць»: ŚĆ — «сьць», ударение на первом слоге. OKRADNĘ — «окра́днэ», OKRADZIONY — «окрадзё́ны»." }
  - { kind: register, text: "Нейтральное слово, частое в новостях. Переносное OKRADZIONO NAS Z DZIECIŃSTWA — книжное. В разговоре о мелкой краже чаще говорят UKRADLI MI PORTFEL «у меня украли бумажник»." }
collocations:
  - { pl: "okraść bank", ru: "ограбить банк" }
  - { pl: "okraść turystę", ru: "обокрасть туриста" }
  - { pl: "okraść kogoś z oszczędności", ru: "лишить кого-то сбережений" }
family:
  - { pl: "kraść", ru: "красть", relation: root, id: krasc }
  - { pl: "ukraść", ru: "украсть", relation: derived, id: ukrasc }
  - { pl: "złodziej", ru: "вор", relation: derived, id: zlodziej }
etymology: "Приставка O- плюс KRAŚĆ «красть», праславянское *krasti, *kradǫ. Русское «обокрасть» — то же гнездо; польское O- соответствует русскому «об-»."
memory: "Okraść — обокрасть кого-то: kieszonkowiec okradł turystę. Ukraść — украсть что-то. Будущее: okradnę. Читается «о́красьць»."
idioms:
  - { pl: "okraść kogoś do ostatniego grosza", ru: "обобрать кого-то до нитки" }
