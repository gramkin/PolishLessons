pron: { cyr: "змярко́ваць" }
senses:
  - id: realize
    ru: "смекнуть, сообразить"
    examples:
      - pl: "Zmiarkował, że coś jest nie tak."
        ru: "Он смекнул, что что-то не так."
        source: { kind: authored }
      - pl: "Szybko zmiarkowała, o co chodzi."
        ru: "Она быстро сообразила, в чём дело."
        source: { kind: authored }
      - pl: "Nie zmiarkowałem w porę."
        ru: "Я вовремя не сообразил."
        source: { kind: authored }
  - id: moderate
    ru: "умерить, сдержать"
    examples:
      - pl: "Trzeba zmiarkować wydatki."
        ru: "Нужно умерить расходы."
        source: { kind: authored }
      - pl: "Zmiarkuj trochę zapał."
        ru: "Умерь немного пыл."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид к miarkować. Слово книжное и устаревающее, в живой речи почти не встречается." }
  - { kind: usage, text: "Сегодня заметнее значение «смекнуть, сообразить»; значение «умерить» осталось за несовершенным miarkować." }
  - { kind: false-friend, text: "Корень miara «мера» — ср. русское «мерить», «соразмерять»." }
  - { kind: government, text: "С придаточным (zmiarkować, że…) или с винительным падежом." }
  - { kind: usage, text: "Совершенный вид к miarkować, и управление то же: умеряют расходы или гнев, а не человека." }
collocations:
  - { pl: "zmiarkować sytuację", ru: "оценить обстановку" }
etymology: "z- + miarkować, от miara «мера»; ср. русское «мера», «соразмерять»."
memory: "zmiarkować — «смекнуть, сообразить», совершенный вид к miarkować. Корень miara «мера»: понять меру вещей."
