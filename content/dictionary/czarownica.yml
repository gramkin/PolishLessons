etymology: "От CZAROWAĆ «колдовать, чаровать», а то от CZAR, CZARY «чары», из праславянского *čarъ «колдовство, заклинание». Русские «чары», «чародей», «очаровать» — того же корня, и значение в них сохранилось полностью, только в русском слово ушло в сторону обаяния: «очаровательный» уже не о колдовстве. Польский держит оба смысла рядом: CZAROWAĆ значит и колдовать, и очаровывать, а CZAROWNICA осталась при первом. Суффикс -NICA образует названия женщин по действию или признаку, и надёжнее всего запомнить саму пару: CZAROWNIK «колдун» и CZAROWNICA «колдунья»."
memory: "Польская czarownica названа по действию — от czary «чары», та, которая чарует. Русская «ведьма» названа по знанию, от «ведать». Книжное wiedźma в польском есть, но в сказках и в брани говорят czarownica. Второе значение — настоящая брань, не шутка. Охота на ведьм — polowanie na czarownice. Корень тот же, что в русском «очаровать»."
