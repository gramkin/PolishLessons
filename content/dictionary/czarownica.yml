notes:
  - { kind: false-friend, text: "Значение совпадает с русской «ведьмой», а вот образ за словом совершенно другой, и это стоит знать. Польская CZAROWNICA происходит от CZARY «колдовство, чары», то есть названа по тому, что делает: та, которая чарует. Русская «ведьма» идёт от «ведать», знать, то есть названа по тому, что знает: ведающая, сведущая. Поэтому в польском слове на первом плане действие, а в русском — тайное знание. Польское слово WIEDŹMA тоже существует, прямо соответствует русскому и значит то же, но звучит книжно и реже: в сказках и в брани обычное слово — CZAROWNICA." }
  - { kind: register, text: "В первом значении слово нейтральное и сказочное: так называют персонажа, историческую обвиняемую, фигуру фольклора. Во втором — грубое, и это настоящая брань, не шутливая: назвать женщину CZAROWNICA значит её оскорбить. Поэтому в разговоре о реальных людях слово требует осторожности. Мужской пары у него в этом смысле нет: колдун будет CZAROWNIK или CZARNOKSIĘŻNIK, и ни одно из этих слов бранным не стало. Устойчивое POLOWANIE NA CZAROWNICE «охота на ведьм» употребляется в политическом смысле так же, как в русском." }
  - { kind: government, text: "Женский род на -A, склонение правильное, но с чередованием в основе: C перед окончанием -Y и -E остаётся, однако родительный, дательный и местный единственного дают одну форму CZAROWNICY, а именительный множественного — CZAROWNICE. Винительный на -Ę: NAZWAŁ JĄ CZAROWNICĄ требует творительного после NAZWAĆ, а прямое дополнение было бы CZAROWNICĘ. При отрицании винительный уходит в родительный: NIE WIDZIAŁ CZAROWNICY." }
  - { kind: pronunciation, text: "Читается «чаровни́ца», ударение на предпоследнем слоге. Начальное CZ даёт «ч». Сочетание NI перед гласной читается «ни» с мягким n. Конечное -CA звучит «ца». Слово четырёхсложное: CZA-ROW-NI-CA, и ударение падает на -NI-. В родительном CZAROWNICY конечное Y даёт «ы»: «чаровни́цы»." }
