# review
id: wchodzic
format: 2
lemma: "wchodzić"
rank: 505
pos: verb
aspect: imperf
pron: { cyr: "вхо́дзиць" }
senses:
  - id: enter
    ru: "входить (do czegoś — с родительным)"
    note: "wchodzić do pokoju «входить в комнату»: предлог do и родительный падеж."
    examples:
      - pl: "Nie wchodzić."
        ru: "Не входить."
        source: { kind: tatoeba, id: 4921556 }
      - pl: "Wchodzę do domu."
        ru: "Я вхожу в дом."
        source: { kind: translated, id: 1780462 }
      - pl: "Widziałem jak wchodził do pokoju."
        ru: "Я видел, как он входил в комнату."
        source: { kind: translated, id: 826674 }
  - id: go-up
    ru: "подниматься (na coś — с винительным)"
    note: "wchodzić na górę «подниматься на гору», wchodzić po schodach «подниматься по лестнице»."
    examples:
      - pl: "Tom wchodzi po schodach."
        ru: "Том поднимается по лестнице."
        source: { kind: translated, id: 5240096 }
      - pl: "Widziałem, jak wchodzi na górę."
        ru: "Я видел, как он поднимается наверх."
        source: { kind: translated, id: 366643 }
      - pl: "Wchodząc na tę górę, stanie pan twarzą w twarz z niebezpieczeństwem."
        ru: "Поднимаясь на эту гору, вы окажетесь лицом к лицу с опасностью."
        source: { kind: translated, id: 989456 }
  - id: take-effect
    ru: "wchodzić w życie / w skład / w grę — вступать в силу, входить в состав, приниматься в расчёт"
    note: "Группа устойчивых оборотов с w и винительным падежом."
    examples:
      - pl: "Prawo wchodzi w życie."
        ru: "Закон вступает в силу."
        source: { kind: translated, id: 11305458 }
      - pl: "Ile republik wchodziło w skład Związku Radzieckiego?"
        ru: "Сколько республик входило в состав Советского Союза?"
        source: { kind: tatoeba, id: 12564146 }
      - pl: "Liczne czynniki wchodzą w grę."
        ru: "В игру вступает множество факторов."
        source: { kind: translated, id: 3656613 }
notes:
  - { kind: government, text: "Предлог зависит от смысла: wchodzić do czegoś — родительный (wchodzić do pokoju «входить в комнату»), но wchodzić na coś — винительный (wchodzić na górę «подниматься на гору»). Русское «в» покрывает оба случая, поэтому падеж приходится помнить отдельно." }
  - { kind: usage, text: "Устойчивые обороты с w и винительным: wchodzić w życie «вступать в силу», wchodzić w skład «входить в состав», wchodzić w grę «приниматься в расчёт, быть возможным»." }
  - { kind: usage, text: "Разговорное Wchodzę w to! значит «Я в деле!», а Nie wchodźmy w szczegóły — «Не будем вдаваться в подробности»." }
  - { kind: usage, text: "Совершенный вид — wejść: wszedł do pokoju «вошёл в комнату»." }
collocations:
  - { pl: "wchodzić do pokoju", ru: "входить в комнату" }
  - { pl: "wchodzić na górę", ru: "подниматься на гору" }
  - { pl: "wchodzić w życie", ru: "вступать в силу" }
  - { pl: "wchodzić w skład", ru: "входить в состав" }
family:
  - { pl: "chodzić", ru: "ходить", relation: root }
  - { pl: "wejść", ru: "войти", relation: derived }
  - { pl: "wejście", ru: "вход", relation: derived }
etymology: "Приставка w- плюс chodzić «ходить», от праславянского *choditi — то же слово, что русское «входить»."
memory: "wchodzić — «входить», но предлог зависит от смысла: wchodzić DO pokoju с родительным «входить в комнату», а wchodzić NA górę с винительным «подниматься на гору». Русское «в» покрывает оба случая, так что падеж приходится помнить отдельно. Плюс группа устойчивых оборотов с w и винительным: wchodzić w życie «вступать в силу», wchodzić w skład «входить в состав», wchodzić w grę «приниматься в расчёт». Совершенный вид — wejść."
idioms:
  - { pl: "wchodzić w życie", ru: "вступать в силу" }
  - { pl: "wchodzić w grę", ru: "рассматриваться, быть возможным (nie wchodzi w grę — исключено)" }
  - { pl: "Wchodzę w to!", ru: "Я в деле!" }
