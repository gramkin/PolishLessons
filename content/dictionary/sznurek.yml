notes:
  - { kind: false-friend, text: "Главная ловушка: SZNUREK — не «шнурок», а бечёвка, верёвочка. Шнурок для ботинок по-польски SZNUROWADŁO, от SZNUROWAĆ «шнуровать». А SZNUR — толстая верёвка или длинный ряд: SZNUR PEREŁ — нитка жемчуга, SZNUR SAMOCHODÓW — вереница машин." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E: SZNUREK, но SZNURKA, SZNURKI. Родительный единственного — SZNURKA, с окончанием -A." }
  - { kind: government, text: "Перевязать бечёвкой — ZAWIĄZAĆ SZNURKIEM, творительный без предлога. На верёвке — NA SZNURKU, местный. Дёргать за ниточки — POCIĄGAĆ ZA SZNURKI, ZA с винительным." }
  - { kind: pronunciation, text: "Читается «шну́рэк», два слога, ударение на первом. SZ даёт «ш», а E после R звучит твёрдо, «э». В формах без беглого E: SZNURKA — «шну́рка»." }
  - { kind: register, text: "Слово бытовое. IŚĆ JAK PO SZNURKU — «идти как по маслу», о деле без помех. POCIĄGAĆ ZA SZNURKI — тайно управлять, как наше «дёргать за ниточки». POD SZNUREK — ровно, по линейке: GRZĄDKI POD SZNUREK." }
collocations:
  - { pl: "kłębek sznurka", ru: "моток бечёвки" }
  - { pl: "zawiązać sznurkiem", ru: "перевязать бечёвкой" }
  - { pl: "sznurek do bielizny", ru: "бельевая верёвка" }
family:
  - { pl: "sznur", ru: "верёвка, шнур; вереница", relation: root }
  - { pl: "sznurowadło", ru: "шнурок для обуви", relation: derived }
  - { pl: "sznurować", ru: "шнуровать", relation: derived }
etymology: "Из немецкого SCHNUR «шнур, верёвка». Русский «шнур» — то же немецкое слово, но значения разошлись: русский «шнурок» стал обувным, а польский SZNUREK остался просто верёвочкой, и для обуви понадобилось новое слово, SZNUROWADŁO."
memory: "Sznurek — бечёвка, а не шнурок; шнурок для обуви — sznurowadło. Читается «шну́рэк», в родительном sznurka. Iść jak po sznurku — идти как по маслу. Pociągać za sznurki — дёргать за ниточки."
idioms:
  - { pl: "iść jak po sznurku", ru: "идти как по маслу" }
  - { pl: "pociągać za sznurki", ru: "дёргать за ниточки" }
  - { pl: "pod sznurek", ru: "ровно, по линеечке" }
formExamplesSkip:
