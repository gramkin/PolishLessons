etymology: "От WRAŻENIE «впечатление», а то от глагола WRAZIĆ «вонзить, вдавить», из приставки W- и корня RAZ-, того же, что в RAZIĆ «поражать, резать глаза» и в русских «разить», «поразить», «удар». Образ здесь ударный: впечатление есть нечто вонзившееся, оставившее след, а WRAŻLIWY — тот, в кого легко вонзается. Русское «впечатление» построено на другом образе, от «впечатать», то есть от оттиска печати, и потому слова значат одно, а картинки за ними разные: польская резкая, русская типографская. Суффикс -LIWY в польском обозначает склонность или способность и очень продуктивен: PŁACZLIWY «плаксивый», CIERPLIWY «терпеливый», WĄTPLIWY «сомнительный», и по нему незнакомое слово читается как «склонный к чему-то»."
memory: "Управление расходится: wrażliwy NA coś с винительным, а русское «чувствительный К чему-то» с дательным. От wrażenie «впечатление», а то от wrazić «вонзить»: впечатление — то, что вонзилось, тогда как русское «впечатление» от печати. К «врагу» и «вражде» отношения нет. Суффикс -liwy даёт склонность: cierpliwy, płaczliwy, wątpliwy."
