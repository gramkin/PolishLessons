notes:
  - { kind: government, text: "Главное в карточке — управление, и оно расходится с русским. WRAŻLIWY требует предлога NA с винительным падежом: WRAŻLIWY NA KRYTYKĘ «чувствительный к критике», WRAŻLIWY NA ZIMNO «чувствительный к холоду», WRAŻLIWY NA PIĘKNO. Русский в этом месте берёт предлог «к» с дательным, и буквальный перенос даёт ошибку: сказать WRAŻLIWY DO CZEGOŚ нельзя. Запоминать стоит сразу с предлогом, как единую формулу: NA CO JEST WRAŻLIWY. Степени сравнения правильные, суффиксом: WRAŻLIWSZY, NAJWRAŻLIWSZY, но в живой речи часто говорят и BARDZIEJ WRAŻLIWY." }
  - { kind: false-friend, text: "Русского однокоренного прилагательного нет, и слово приходится учить заново, зато корень в нём знакомый, если присмотреться. WRAŻLIWY происходит от WRAŻENIE «впечатление», а то — от старого глагола WRAZIĆ «вонзить, вдавить». Русский строит «впечатление» от «впечатать», то есть от печати, а польский от удара: WRAŻENIE есть то, что вонзилось. Поэтому WRAŻLIWY буквально значит «способный принять удар, восприимчивый к вонзающемуся». К русскому «вражескому» и «вражде» слово отношения не имеет вовсе, хотя начало совпадает: там корень WRÓG «враг», здесь RAZ- «разить»." }
  - { kind: pronunciation, text: "Читается «вражли́вы», ударение на предпоследнем слоге, то есть на -LI-. Сочетание RZ даёт «ж», поэтому первый слог звучит «враж», а не «врас» и не «врж». Буква L мягкая, как всегда в польском, отсюда «ли». Конечное Y даёт «ы». В мужско-личной форме множественного WRAŻLIWI смягчается и конечное W: «вражли́ви». В сравнительной степени WRAŻLIWSZY стечение ŻLIWSZ требует отдельной отработки: «вражли́фшы», с оглушением W перед SZ." }
  - { kind: usage, text: "Слово работает в двух кругах, и оба частотны. О человеке оно значит эмоциональную восприимчивость и звучит скорее одобрительно, с оттенком сочувствия: WRAŻLIWY CHŁOPIEC, WRAŻLIWA DUSZA. О предметах — техническую чувствительность: SKÓRA WRAŻLIWA «чувствительная кожа», написанное на каждом втором тюбике, CZUJNIK WRAŻLIWY, DANE WRAŻLIWE «персональные данные особой категории», это уже юридический термин из закона о защите данных. Существительное — WRAŻLIWOŚĆ «чувствительность», наречие — WRAŻLIWIE." }
