senses:
  - id: rest
    ru: "отдохнуть"
    examples:
      - pl: "Chcę odpocząć."
        ru: "Я хочу отдохнуть."
        source: { kind: tatoeba, id: 6729691 }
      - pl: "Muszę odpocząć."
        ru: "Мне нужно отдохнуть."
        source: { kind: translated, id: 2679970 }
      - pl: "Masz iść i trochę odpocząć."
        ru: "Тебе нужно отдохнуть."
        source: { kind: tatoeba, id: 6441637 }
  - id: lets-rest
    ru: "отдохнём, отдохни (побуждение)"
    examples:
      - pl: "Odpocznij."
        ru: "Отдохни."
        source: { kind: translated, id: 737264 }
      - pl: "Odpocznijmy chwilę."
        ru: "Отдохнём минутку."
        source: { kind: translated, id: 639860 }
      - pl: "Może trochę odpoczniemy?"
        ru: "Может, немного отдохнём?"
        source: { kind: translated, id: 6329769 }
notes:
  - { kind: usage, text: "Страдательного причастия у odpocząć нет: глагол непереходный, отдыхают сами, а не кого-то. Поэтому odpoczęty, odpoczęta, odpoczęci и весь этот ряд оставлены без примеров. Форма выглядит правдоподобно из-за соседнего wypoczęty «отдохнувший» — но это отдельное прилагательное, которое закрепилось в языке само по себе, а odpoczęty так и не закрепилось." }
  - { kind: usage, text: "Несовершенный вид — odpoczywać; существительное odpoczynek значит «отдых»." }
  - { kind: usage, text: "Повелительное Odpocznij! «Отдохни!» и Odpocznijmy «Отдохнём» — самые частые формы в корпусе." }
  - { kind: government, text: "«Отдохнуть от чего-то» — odpocząć od czegoś: odpocząć od pracy «отдохнуть от работы»." }
  - { kind: usage, text: "Слово прозрачно разбирается: od- + poczywać «покоиться», то есть «отойти к покою». Русское «отдохнуть» построено от «дух», метафора другая." }
collocations:
  - { pl: "chcę odpocząć", ru: "я хочу отдохнуть" }
  - { pl: "odpocznij trochę", ru: "отдохни немного" }
  - { pl: "odpocząć od pracy", ru: "отдохнуть от работы" }
etymology: "Приставка od- + poczywać «покоиться», праславянское *počiti «успокоиться». Русское «почить» и «покой» — то же гнездо, а «отдохнуть» построено от «дух»: метафора другая, результат тот же."
memory: "odpocząć = «отдохнуть», несовершенный вид — odpoczywać, существительное — odpoczynek «отдых». Самые частые формы: Odpocznij! «Отдохни!» и Odpocznijmy «Отдохнём»."
