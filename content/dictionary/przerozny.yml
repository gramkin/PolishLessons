# review
id: przerozny
format: 2
lemma: "przeróżny"
rank: 6060
pos: adj
pron: { cyr: "пшэру́жны" }
senses:
  - id: all-sorts
    ru: "самый разный, всевозможный, всякий"
    examples:
      - pl: "W Tokio mieszkają przeróżni ludzie."
        ru: "В Токио живут самые разные люди."
        source: { kind: translated, id: 1470701 }
      - pl: "To jezioro obfituje w przeróżne gatunki ryb."
        ru: "Это озеро богато самыми разными видами рыб."
        source: { kind: translated, id: 4127512 }
      - pl: "Ciekawe jest to, że one są tutaj przeróżne."
        ru: "Интересно, что они здесь самые разные."
        source: { kind: authored }
  - id: manifold
    ru: "многообразный, всяческий (о причинах, способах)"
    examples:
      - pl: "Próbował przeróżnych sposobów, ale nic nie działało."
        ru: "Он пробовал всевозможные способы, но ничего не помогало."
        source: { kind: authored }
      - pl: "Ludzie przychodzą do nas z przeróżnych powodów."
        ru: "Люди приходят к нам по самым разным причинам."
        source: { kind: authored }
notes:
  - { kind: usage, text: "PRZERÓŻNY — усиленное RÓŻNY, «разный»: приставка PRZE- значит «очень». Почти всегда во множественном: przeróżne rzeczy, przeróżni ludzie. Степеней сравнения нет: przeróżny уже «самый разный»." }
  - { kind: false-friend, text: "PRZE- похоже на русское «пере-», но здесь оно не про повторение, а про высокую степень, как в русском «пре-»: «премилый», «пренеприятный». Przeróżny — не «переразный», а «преразный», то есть «самый разный»." }
  - { kind: pronunciation, text: "«пшэру́жны»: RZ после P оглушается в «ш», Ó — «у», Ż — «ж». Ударение на предпоследнем слоге RÓŻ." }
  - { kind: register, text: "Разговорно-нейтральное, немного экспрессивное; в официальном тексте спокойнее RÓŻNORODNY, RÓŻNY." }
collocations:
  - { pl: "przeróżne rzeczy", ru: "всякая всячина" }
  - { pl: "z przeróżnych powodów", ru: "по самым разным причинам" }
  - { pl: "przeróżni ludzie", ru: "самые разные люди" }
family:
  - { pl: "różny", ru: "разный", relation: root, id: rozny }
  - { pl: "różnorodny", ru: "разнообразный", relation: derived }
  - { pl: "przeróżnie", ru: "по-разному, всячески", relation: derived }
etymology: "Из PRZE- и RÓŻNY, «разный»; RÓŻNY — от древнего *rozьnъ, «отдельный», того же корня, что русское «рознь», «врозь», «разный». Усилительная приставка PRZE- та же, что в старорусском «пре-»: «превеликий»."
memory: "Przeróżny = prze + różny, «преразный», то есть самый разный. Przeróżni ludzie — самые разные люди. Сравнительной степени нет."
idioms:
  - { pl: "przeróżne cuda", ru: "всякие чудеса, всякая всячина" }
