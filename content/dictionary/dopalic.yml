# review
id: dopalic
format: 2
lemma: "dopalić"
rank: 5622
pos: verb
aspect: perf
pron: { cyr: "допа́лиць" }
senses:
  - id: burn-out
    ru: "догореть, дожечь"
    examples:
      - pl: "Ogień dopalił się nad ranem."
        ru: "Огонь догорел под утро."
        source: { kind: authored }
      - pl: "Świeca dopaliła się do końca."
        ru: "Свеча догорела до конца."
        source: { kind: authored }
      - pl: "Dopalili resztę drewna."
        ru: "Они дожгли остаток дров."
        source: { kind: authored }
  - id: finish-smoking
    ru: "докурить"
    examples:
      - pl: "Dopalił papierosa i wszedł."
        ru: "Он докурил сигарету и вошёл."
        source: { kind: authored }
      - pl: "Poczekaj, dopalę do końca."
        ru: "Подожди, я докурю."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В значении «догореть» глагол почти всегда возвратный: dopalić się. Без się он переходный — «дожечь что-л.»." }
  - { kind: false-friend, text: "do- + palić «жечь, курить», у которого уже есть карточка. Приставка do- означает доведение до конца, как русская «до-» в «догореть», «докурить»." }
  - { kind: government, text: "Переходное употребление — винительный падеж: dopalić papierosa." }
  - { kind: usage, text: "Несовершенный вид — dopalać. В корпусе глагол не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "dopalić się", ru: "догореть" }
  - { pl: "dopalić papierosa", ru: "докурить сигарету" }
etymology: "do- + palić «жечь, курить»; приставка do- значит доведение до конца, как русская «до-»."
memory: "dopalić — «догореть» (обычно dopalić się) и «докурить». Приставка do- работает как русская «до-»: догореть, дожечь, докурить."
idioms:
  - { pl: "dopalić się", ru: "догореть" }
formExamplesSkip:
  - { form: "dopaleni", reason: "страдательное причастие мужского лица, а догорают сигарета, свеча или полено: dopalić papierosa. Человека не дожигают, поэтому формы нет" }
