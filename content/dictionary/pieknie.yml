etymology: "От PIĘKNY, из праславянского *pękъnъ, связанного с корнем, означавшим «набухать, наливаться», откуда идея полноты и расцвета. Русского однокоренного слова не сохранилось, и это один из тех случаев, где польское слово приходится запоминать без опоры: «красивый» и «прекрасный» идут от «красы», совсем другого корня. Наречный суффикс -IE в польском отвечает русскому -О в наречиях: PIĘKNIE и «красиво», DOBRZE и «хорошо». Степени сравнения оба языка образуют от основы прилагательного, но превосходную польский собирает приставкой NAJ-, родственной русской частице «наи-» в «наилучший»; русский эту приставку сохранил только в книжных формах, а в живой речи заменил описательным оборотом."
memory: "Три формы, потому что наречие не склоняется, но сравнивается: pięknie, piękniej, najpiękniej. Схема общая для наречий на -ie: -iej в сравнительной, naj- в превосходной. Главное отличие от русского — превосходная одним словом: najpiękniej против «красивее всего». Корень без русской опоры: «красивый» от другого корня. И формула dziękuję pięknie — просто «большое спасибо»."
