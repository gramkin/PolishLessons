notes:
  - { kind: usage, text: "Форм у этого слова три, и причина не в бедности, а в части речи: наречие не склоняется, зато образует степени сравнения. PIĘKNIE «красиво», PIĘKNIEJ «красивее», NAJPIĘKNIEJ «красивее всего». Схема общая для всех польских наречий на -IE: окончание меняется на -IEJ, а превосходная степень получает приставку NAJ-. Сравните ŁADNIE и ŁADNIEJ, SZYBKO и SZYBCIEJ, DOBRZE и LEPIEJ. Главное отличие от русского здесь в превосходной степени: польский строит её одним словом, NAJPIĘKNIEJ, тогда как русский обходится описательно — «красивее всего», «лучше всех». Поэтому NAJ- переводится не словом, а оборотом." }
  - { kind: false-friend, text: "PIĘKNIE значит «красиво, прекрасно», от PIĘKNY «красивый». Русского однокоренного соответствия нет, и опереться не на что: «пышно» и «пикантно» к этому корню отношения не имеют. Зато стоит знать вежливую формулу DZIĘKUJĘ PIĘKNIE, буквально «благодарю красиво», которая значит просто «большое спасибо» и звучит теплее сухого DZIĘKUJĘ. В ироническом употреблении PIĘKNIE означает «ну прекрасно», то есть ровно противоположное: PIĘKNIE, I CO TERAZ? «прекрасно, и что теперь?». Этот перенос в русском устроен точно так же, так что интонация переводится сама." }
  - { kind: government, text: "Наречие: определяет глагол, прилагательное или другое наречие и не согласуется ни с чем. Сравнение строится через NIŻ с именительным: PIĘKNIEJ NIŻ W ZESZŁYM ROKU, или через OD с родительным: PIĘKNIEJ OD SIOSTRY. Безличные конструкции обычны: BYŁO PIĘKNIE «было красиво», JEST PIĘKNIE «красиво». Частотные сочетания: PIĘKNIE WYGLĄDAĆ «прекрасно выглядеть», PIĘKNIE DZIĘKUJĘ, PIĘKNIE PROSZĘ «очень прошу». Прилагательное, от которого образовано наречие, — PIĘKNY, и у него полный набор из тридцати трёх форм, потому что оно качественное." }
  - { kind: pronunciation, text: "Читается «пе́нкне», два слога, ударение на первом. Носовое Ę перед K даёт «эн» с задним призвуком. Сочетание KN выговаривается слитно. Конечное -NIE звучит «не», с мягким н. В сравнительной степени PIĘKNIEJ слогов два, ударение на первом: «пе́нкней», и конечное J даёт «й». В превосходной NAJPIĘKNIEJ слогов три, ударение на предпоследнем: «найпе́нкней», и приставка NAJ- произносится слитно с основой." }
