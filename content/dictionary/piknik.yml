etymology: "Из французского PIQUE-NIQUE, XVII век: обед, куда каждый приносит своё. Русское «пикник» — то же слово."
memory: "Piknik — пикник и гулянье. Na pikniku — на пикнике. Piknik rodzinny — семейный праздник. Читается «пи́кник»."
idioms:
  - { pl: "to nie piknik", ru: "это вам не прогулка, дело серьёзное" }
