notes:
  - { kind: false-friend, text: "PIKNIK — «пикник», но в Польше это и большое общественное гулянье: PIKNIK RODZINNY, PIKNIK LOTNICZY, PIKNIK NAUKOWY — «фестиваль науки». Не только корзинка с бутербродами на траве." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — PIKNIKU; разговорное PIKNIKA не учим. Множественное — PIKNIKI." }
  - { kind: government, text: "Поехать на пикник — JECHAĆ NA PIKNIK, NA с винительным. На пикнике — NA PIKNIKU, NA с местным. Корзинка для пикника — KOSZ PIKNIKOWY." }
  - { kind: pronunciation, text: "Читается «пи́кник», ударение на первом слоге." }
collocations:
  - { pl: "piknik rodzinny", ru: "семейный праздник" }
  - { pl: "jechać na piknik", ru: "поехать на пикник" }
  - { pl: "koc piknikowy", ru: "покрывало для пикника" }
