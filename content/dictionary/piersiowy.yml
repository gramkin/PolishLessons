notes:
  - { kind: false-friend, text: "PIERSIOWY — «грудной», от PIERŚ, «грудь». Русское «перси» — то же слово, только устаревшее. Грудной ребёнок по-польски не PIERSIOWE DZIECKO, а NIEMOWLĘ. Грудное молоко — MLEKO MATKI, кормить грудью — KARMIĆ PIERSIĄ. KLATKA PIERSIOWA — «грудная клетка»." }
  - { kind: usage, text: "Десять форм без степеней и без формы для мужчин-людей: это относительное прилагательное. Самое частое сочетание — KLATKA PIERSIOWA. В анатомии: MIĘŚNIE PIERSIOWE, KRĘGI PIERSIOWE, «грудные позвонки»." }
  - { kind: government, text: "Ставится после существительного, как термин: KLATKA PIERSIOWA, GŁOS PIERSIOWY, ODCINEK PIERSIOWY, «грудной отдел»." }
  - { kind: pronunciation, text: "Читается «перьсьо́вы», три слога, ударение на предпоследнем. R перед SI звучит чуть смягчённо, SI перед O — «сьо», W перед Y — «в»." }
  - { kind: register, text: "Нейтральное слово медицины, анатомии и спорта. В быту живёт почти только в KLATKA PIERSIOWA. Грудь у женщины в бытовой речи — PIERSI или BIUST." }
collocations:
