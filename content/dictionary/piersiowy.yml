etymology: "От PIERŚ «грудь», праславянское *pьrsь, то же, что русское устаревшее «перси». Суффикс -OWY — обычный для относительных прилагательных, как в DOMOWY."
memory: "Piersiowy — грудной. Klatka piersiowa — грудная клетка, ból w klatce piersiowej — боль в груди. От pierś, как русские «перси». Читается «перьсьо́вы»."
