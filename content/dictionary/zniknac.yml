# review
id: zniknac
format: 2
lemma: "zniknąć"
rank: 535
pos: verb
aspect: perf
pron: { cyr: "зни́кнонць" }
senses:
  - id: vanish
    ru: "исчезнуть, пропасть (стать невидимым)"
    examples:
      - pl: "Śnieg znikł."
        ru: "Снег исчез."
        source: { kind: tatoeba, id: 562243 }
      - pl: "Zniknął."
        ru: "Он исчез."
        source: { kind: translated, id: 10596153 }
      - pl: "Znikł bez śladu."
        ru: "Он исчез без следа."
        source: { kind: translated, id: 349174 }
  - id: go-missing
    ru: "пропасть, деться (перестать быть на месте)"
    examples:
      - pl: "Moja walizka zniknęła."
        ru: "Мой чемодан пропал."
        source: { kind: translated, id: 9417464 }
      - pl: "Pieniądze zniknęły."
        ru: "Деньги пропали."
        source: { kind: translated, id: 11606270 }
      - pl: "Klucze od garażu zniknęły"
        ru: "Ключи от гаража пропали."
        source: { kind: translated, id: 2832468 }
notes:
  - { kind: usage, text: "У глагола два равноправных ряда прошедшего времени: znikł, znikła, znikli и zniknął, zniknęła, zniknęli. Оба правильны и встречаются одинаково часто — выбирайте любой, но не смешивайте в одной фразе." }
  - { kind: usage, text: "Формы zniknę, znikniesz, zniknie — это БУДУЩЕЕ время, а не настоящее: глагол совершенного вида. Несовершенный вид — znikać: Znika mi z oczu «Он исчезает у меня из глаз»." }
  - { kind: usage, text: "Разбирается по частям: z- + niknąć «никнуть, убывать». Русское «никнуть» — то же слово, и значение «сходить на нет» в нём слышно." }
  - { kind: usage, text: "Отглагольное существительное zniknięcie «исчезновение» — обычное живое слово: upozorować zniknięcie «инсценировать исчезновение»." }
collocations:
  - { pl: "zniknąć bez śladu", ru: "исчезнуть без следа" }
  - { pl: "zniknąć z pola widzenia", ru: "скрыться из виду" }
  - { pl: "nagle zniknąć", ru: "внезапно пропасть" }
  - { pl: "zniknięcie", ru: "исчезновение" }
family:
  - { pl: "znikać", ru: "исчезать", relation: derived }
  - { pl: "zniknięcie", ru: "исчезновение", relation: derived }
  - { pl: "niknąć", ru: "никнуть, убывать", relation: derived }
etymology: "Приставка z- плюс niknąć «никнуть, убывать, сходить на нет» — то же слово, что русское «никнуть». Буквально «сойти на нет до конца»."
memory: "zniknąć — «исчезнуть», совершенный вид от znikać. Две вещи стоит запомнить. Первая: zniknę, znikniesz, zniknie — это будущее время, а не настоящее. Вторая: у глагола два равноправных ряда прошедшего времени — znikł, znikła, znikli и zniknął, zniknęła, zniknęli; оба правильны, но не смешивайте их в одной фразе. Корень прозрачен: z- + niknąć, родня русскому «никнуть»."
idioms:
  - { pl: "zniknąć bez śladu", ru: "исчезнуть без следа" }
  - { pl: "zniknąć jak kamfora", ru: "испариться, как не было" }
  - { pl: "zniknąć z pola widzenia", ru: "скрыться из виду" }
