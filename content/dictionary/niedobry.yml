pron: { cyr: "недо́бры" }
senses:
  - id: unkind
    ru: "недобрый, злой (о человеке, поступке)"
    examples:
      - pl: "To był niedobry człowiek."
        ru: "Это был недобрый человек."
        source: { kind: authored }
      - pl: "Jesteś dziś niedobra dla brata."
        ru: "Ты сегодня злая к брату."
        source: { kind: authored }
      - pl: "Rzucił mi niedobre spojrzenie."
        ru: "Он бросил на меня недобрый взгляд."
        source: { kind: authored }
  - id: bad
    ru: "нехороший, плохой (о вкусе, состоянии, знаке)"
    examples:
      - pl: "Ta zupa jest niedobra, za słona."
        ru: "Этот суп невкусный, пересоленный."
        source: { kind: authored }
      - pl: "Mam niedobre przeczucie."
        ru: "У меня нехорошее предчувствие."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «недобрый» частичное. О человеке и взгляде — то же самое: NIEDOBRY CZŁOWIEK, NIEDOBRE SPOJRZENIE. Но о еде польское NIEDOBRY значит «невкусный»: ZUPA JEST NIEDOBRA. Русское «недобрый суп» так не скажешь. В детской речи NIEDOBRY — «плохой, нехороший»: NIEDOBRY PIESEK!" }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ NIEDOBRY; простых степеней нет, потому что DOBRY сравнивается супплетивно: LEPSZY, NAJLEPSZY. Все одиннадцать форм живые. Форма для мужчин-людей NIEDOBRZY встречается: NIEDOBRZY LUDZIE. Чередование: R перед I даёт RZ: NIEDOBRY, но NIEDOBRZY." }
  - { kind: government, text: "Злой к кому-то — NIEDOBRY DLA KOGOŚ, DLA с родительным: BYŁ DLA NIEJ NIEDOBRY. Мне нехорошо — NIEDOBRZE MI, наречие с дательным, о самочувствии: ROBI MI SIĘ NIEDOBRZE, «меня тошнит»." }
  - { kind: pronunciation, text: "Читается «недо́бры», три слога, ударение на предпоследнем. NIE — «не», DO — чёткое «до», BRY — твёрдое «бры». В форме NIEDOBRZY: «недо́бжы», RZ после B звучит «ж»." }
  - { kind: register, text: "Нейтральное, но мягкое слово, часто детское и семейное: NIEDOBRY CHŁOPIEC, «нехороший мальчик». Взрослые о плохом человеке скажут сильнее: ZŁY, PODŁY. О еде NIEDOBRY — обычное бытовое «невкусный»." }
collocations:
  - { pl: "niedobre przeczucie", ru: "нехорошее предчувствие" }
  - { pl: "niedobry znak", ru: "дурной знак" }
  - { pl: "niedobry dla kogoś", ru: "злой к кому-то" }
family:
  - { pl: "dobry", ru: "добрый, хороший", relation: root }
  - { pl: "niedobrze", ru: "нехорошо, плохо", relation: derived, id: niedobrze }
  - { pl: "zły", ru: "злой, плохой", relation: root, id: zly }
etymology: "От DOBRY «хороший», общеславянского *dobrъ, родственного русскому «добрый», с отрицанием NIE-. В польском DOBRY значит прежде всего «хороший»: DOBRA ZUPA — «вкусный суп», DOBRY FILM — «хороший фильм». Поэтому и NIEDOBRY шире русского «недобрый»: это и «злой», и «невкусный»."
memory: "Niedobry — недобрый, злой: niedobry człowiek. О еде — невкусный: zupa jest niedobra. Niedobre przeczucie — нехорошее предчувствие. Читается «недо́бры»."
idioms:
  - { pl: "robi mi się niedobrze", ru: "меня мутит, тошнит" }
