        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "В дательном и предложном единственного k переходит в c: KOSTKA — KOSTCE. Это то же смягчение заднеязычного, что в przeciwnik — przeciwnicy, только здесь оно работает в женском роде единственного числа. По тому же образцу matka — matce, ręka — ręce, Polska — Polsce." }
  - { kind: pronunciation, text: "Родительный множественного — KOSTEK, с беглым e, которое появляется между t и k, чтобы не столкнулись три согласных. Так же устроены matka — matek, notatka — notatek, poprawka — poprawek. Гласной этой в других формах нет, и забыть её вставить — самая частая ошибка в этом падеже." }
  - { kind: usage, text: "Слово шире русской «косточки». KOSTKA — это и кубик сахара или льда, и игральная кость, и лодыжка, и элемент брусчатки: kostka brukowa. Русское «косточка» в значении плодовой будет PESTKA, а не kostka, и эту пару стоит держать врозь." }
collocations:
  - { pl: "kostka cukru", ru: "кусочек сахара" }
  - { pl: "kostka lodu", ru: "кубик льда" }
  - { pl: "skręcić kostkę", ru: "подвернуть лодыжку" }
family:
  - { pl: "kość", ru: "кость", relation: root, id: kosc }
  - { pl: "kosteczka", ru: "косточка", relation: derived }
  - { pl: "kostny", ru: "костный", relation: derived }
etymology: "Уменьшительное от KOŚĆ «кость», из праславянского *kostь — того же слова, что русская «кость», с обычным суффиксом -ka. Русская «косточка» сделана теми же частями, но осталась при узком значении, а польская kostka разошлась широко: от кубика сахара до лодыжки и брусчатки. Общий образ один — маленькая твёрдая вещь правильной формы."
memory: "Дательный и предложный — KOSTCE, с k → c, как matka — matce. А родительный множественного — KOSTEK, с беглым e."
idioms:
  - { pl: "kostka brukowa", ru: "брусчатка" }
  - { pl: "rzucić kostką", ru: "бросить кубик" }
