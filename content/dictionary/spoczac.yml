# review
id: spoczac
format: 2
lemma: "spocząć"
rank: 4314
pos: verb
pron: { cyr: "спо́чонць" }
senses:
  - id: rest
    ru: "отдохнуть, присесть (книжно); упокоиться (о покойном)"
    examples:
      - pl: "Spocznij na chwilę, jesteś zmęczony."
        ru: "Отдохни минутку, ты устал."
        source: { kind: authored }
      - pl: "Dziadek spoczął na starym cmentarzu."
        ru: "Дедушка упокоился на старом кладбище."
        source: { kind: authored }
      - pl: "Po długiej drodze spoczęliśmy pod dębem."
        ru: "После долгой дороги мы отдохнули под дубом."
        source: { kind: authored }
  - id: fall-on
    ru: "лечь (о взгляде, ответственности)"
    examples:
      - pl: "Jego wzrok spoczął na zdjęciu."
        ru: "Его взгляд остановился на фотографии."
        source: { kind: authored }
      - pl: "Cała odpowiedzialność spoczęła na niej."
        ru: "Вся ответственность легла на неё."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SPOCZĄĆ — книжное «отдохнуть», «упокоиться», а не «спочить» и не «спать». Корень тот же, что в ODPOCZĄĆ «отдохнуть» и SPOKÓJ «покой», русском «почить», «покой». Команда SPOCZNIJ! — «вольно!»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — SPOCZYWAĆ. Спряжение: SPOCZNĘ, SPOCZNIESZ, SPOCZNĄ; прошедшее SPOCZĄŁ, SPOCZĘŁA, SPOCZĘLI. Глагол непереходный, поэтому страдательные причастия из словаря — артефакт; они, как и безличное SPOCZĘTO и отглагольное существительное, в карточку не включены." }
  - { kind: government, text: "На чём — NA с предложным: SPOCZĄĆ NA ŁAWCE; о взгляде и ответственности — тоже NA с предложным: SPOCZĘŁA NA NIM ODPOWIEDZIALNOŚĆ. Где похоронен — W или NA с предложным: SPOCZĄĆ NA CMENTARZU, W GROBIE." }
  - { kind: pronunciation, text: "Читается «спо́чонць»: CZ — «ч», ĄĆ — «онць». Ударение на первом слоге. SPOCZĄŁ — «спо́чоу», SPOCZĘŁA — «спочэ́уа»." }
  - { kind: register, text: "Книжное и торжественное слово: некрологи, военные команды, высокий стиль. В быту — ODPOCZĄĆ, USIĄŚĆ. Выражение NIE SPOCZĄĆ NA LAURACH — «не почивать на лаврах»." }
collocations:
  - { pl: "spocząć na ławce", ru: "присесть на скамейку" }
  - { pl: "spocząć na wieki", ru: "упокоиться навеки" }
  - { pl: "odpowiedzialność spoczęła na", ru: "ответственность легла на" }
family:
  - { pl: "odpocząć", ru: "отдохнуть", relation: root, id: odpoczac }
  - { pl: "spoczywać", ru: "покоиться, лежать", relation: aspect }
  - { pl: "spokój", ru: "покой", relation: root, id: spokoj }
etymology: "Праславянское *sъ-počiti «успокоиться, отдохнуть», того же корня, что русское «почить», «покой», «опочивальня». Польское ĄĆ на месте русского -ИТЬ — следствие старого носового гласного."
memory: "Spocząć — отдохнуть, почить: spocznij na chwilę. Spocznij! — «вольно!». Wzrok spoczął na — взгляд остановился на."
idioms:
