# review
id: pomalu
format: 2
lemma: "pomału"
rank: 6053
pos: adv
pron: { cyr: "пома́уу" }
senses:
  - id: slowly
    ru: "медленно, не спеша, потихоньку"
    examples:
      - pl: "Pomału wykopał całą dziurę."
        ru: "Потихоньку он выкопал всю яму."
        source: { kind: translated, id: 982983 }
      - pl: "Płyniemy dalej, podziwiając ptaki i pomału zbliżając się do lodowca."
        ru: "Мы плывём дальше, любуясь птицами и потихоньку приближаясь к леднику."
        source: { kind: authored }
      - pl: "Jedź pomału, droga jest śliska."
        ru: "Езжай медленно, дорога скользкая."
        source: { kind: authored }
  - id: gradually
    ru: "постепенно, мало-помалу; пора уже (pomału czas…)"
    examples:
      - pl: "Pomału się ściemnia."
        ru: "Понемногу темнеет."
        source: { kind: translated, id: 357039 }
      - pl: "Pomału czas na mnie."
        ru: "Мне, пожалуй, пора."
        source: { kind: translated, id: 737243 }
      - pl: "Niebo pomału się rozpogadza."
        ru: "Небо понемногу проясняется."
        source: { kind: translated, id: 13081746 }
notes:
  - { kind: usage, text: "POMAŁU — и «медленно» (jedź pomału), и «постепенно, понемногу» (pomału się ściemnia). Разговорное POMAŁU CZAS…, «пора уже»: pomału czas spać, «пора бы и спать». Синоним POWOLI; повторение POMAŁU, POMAŁU — «тише, не торопись»." }
  - { kind: false-friend, text: "Русское «помалу» почти вышло из употребления и значит «понемногу, в малом количестве». Польское POMAŁU — прежде всего о скорости: «медленно, неторопливо»." }
  - { kind: pronunciation, text: "«пома́уу»: Ł — «у», так что получается два «у» подряд. Ударение на предпоследнем слоге MA." }
  - { kind: register, text: "Разговорное и тёплое; в письменной речи нейтральнее POWOLI и STOPNIOWO, «постепенно»." }
collocations:
  - { pl: "pomału, pomału", ru: "тише, не спеши" }
  - { pl: "pomału czas", ru: "пора уже" }
  - { pl: "jechać pomału", ru: "ехать медленно" }
family:
  - { pl: "mały", ru: "маленький", relation: root, id: maly }
  - { pl: "powoli", ru: "медленно", relation: root }
etymology: "Из PO и MAŁU, старого дательного от MAŁY, «малый»: «по малу», по чуть-чуть. Русское «помалу», «мало-помалу» — то же образование; в польском значение сместилось от количества к скорости."
memory: "Pomału — медленно и понемногу, «по малу». Pomału się ściemnia — понемногу темнеет. Pomału czas spać — пора бы спать. Ł читается «у»: «пома́уу»."
idioms:
  - { pl: "pomału, pomału", ru: "тише едешь — дальше будешь, не торопись" }
formExamples:
  - form: "pomału"
    pl: "Pomału czas spać."
    ru: "Пора бы и спать."
    source: { kind: translated, id: 919831 }
  - form: "pomału"
    pl: "Będę się pomału żegnać."
    ru: "Я, пожалуй, потихоньку попрощаюсь."
    source: { kind: translated, id: 652400 }
  - form: "pomału"
    pl: "Na dworze robi się pomału ciemno."
    ru: "На улице понемногу темнеет."
    source: { kind: translated, id: 367724 }
  - form: "pomału"
    pl: "Jedź pomału, droga jest śliska."
    ru: "Езжай медленно, дорога скользкая."
    source: { kind: authored }
  - form: "pomału"
    pl: "Babcia pomału wchodziła po schodach."
    ru: "Бабушка медленно поднималась по лестнице."
    source: { kind: authored }
