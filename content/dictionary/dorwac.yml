# review
id: dorwac
format: 2
lemma: "dorwać"
rank: 1657
pos: verb
pron: { cyr: "до́рваць" }
senses:
  - id: catch
    ru: "разг. схватить, сцапать, достать (кого-л.)"
    examples:
      - pl: "Dorwał go pod klubem."
        ru: "Он сцапал его у клуба."
        source: { kind: authored }
      - pl: "Dorwano go na granicy."
        ru: "Его схватили на границе."
        source: { kind: authored }
      - pl: "Dorwani złodzieje milczeli."
        ru: "Схваченные воры молчали."
        source: { kind: authored }
  - id: get-hold
    ru: "разг. раздобыть, ухватить (что-л. труднодоступное)"
    examples:
      - pl: "Wreszcie dorwał tę książkę."
        ru: "Он наконец раздобыл эту книгу."
        source: { kind: authored }
      - pl: "Dorwała ostatnie wolne miejsce."
        ru: "Она ухватила последнее свободное место."
        source: { kind: authored }
  - id: get-at
    ru: "dorwać się do czegoś — дорваться до чего-л."
    examples:
      - pl: "Dorwali się do władzy i zapomnieli o obietnicach."
        ru: "Они дорвались до власти и забыли об обещаниях."
        source: { kind: authored }
      - pl: "Dziecko dorwało pilota i zmieniło kanał."
        ru: "Ребёнок дорвался до пульта и переключил канал."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово РАЗГОВОРНОЕ и грубоватое, с оттенком расправы или жадного захвата. Нейтральные замены — złapać «поймать», schwytać «схватить», dopaść «настигнуть». Русскоязычный часто встречает dorwać в фильмах и переносит в обычную речь, а звучит это по-хулигански: в вежливом разговоре или на письме так не скажут." }
  - { kind: false-friend, text: "Возвратное dorwać się do czegoś отвечает русскому «дорваться до чего-то» буква в букву: dorwać się do władzy — «дорваться до власти». А вот переходное dorwać kogoś одним русским словом не передать — ближе всего «сцапать» или «схватить», и это тоже разговорные слова, так что оттенок сохраняется." }
  - { kind: government, text: "Схватить КОГО — винительный: dorwać go, dorwać sprawcę. Дорваться ДО чего — возвратное się плюс do с РОДИТЕЛЬНЫМ: dorwać się do władzy, do jedzenia. Падеж и предлог те же, что в русском." }
collocations:
  - { pl: "dorwać sprawcę", ru: "схватить виновника" }
  - { pl: "dorwać się do władzy", ru: "дорваться до власти" }
  - { pl: "dorwać bilety", ru: "раздобыть билеты" }
family:
  - { pl: "rwać", ru: "рвать", relation: root }
  - { pl: "porwać", ru: "похитить; разорвать", relation: derived, id: porwac }
  - { pl: "zerwać", ru: "сорвать", relation: derived, id: zerwac }
etymology: "Приставка do- плюс rwać, праславянское *rъvati «рвать». Приставка do- даёт значение достижения предела — «дорваться», — и именно в возвратной форме русский сохранил то же слово: dorwać się do władzy и «дорваться до власти» собраны одинаково. В переходном значении «схватить» образ тот же: дотянуться и рвануть к себе."
memory: "dorwać — разговорное «сцапать, схватить», от rwać «рвать» с приставкой do-. Возвратное dorwać się do czegoś это в точности русское «дорваться до чего-то». Слово грубоватое: нейтрально будет złapać."
idioms:
  - { pl: "dorwać się do władzy", ru: "дорваться до власти" }
  - { pl: "dorwać kogoś w swoje ręce", ru: "заполучить кого-л. в свои руки" }
