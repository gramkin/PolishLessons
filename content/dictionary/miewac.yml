# review
id: miewac
format: 2
lemma: "miewać"
rank: 2296
pos: verb
pron: { cyr: "ме́ваць" }
senses:
  - id: occasionally-have
    ru: "иметь время от времени, бывать (о состояниях)"
    examples:
      - pl: "Miewam bóle głowy przy zmianie pogody."
        ru: "У меня бывают головные боли при смене погоды."
        source: { kind: authored }
      - pl: "Miewa dobre dni i gorsze."
        ru: "У него бывают хорошие дни и похуже."
        source: { kind: authored }
      - pl: "Miewali wątpliwości, ale nigdy ich nie okazywali."
        ru: "У них бывали сомнения, но они их никогда не показывали."
        source: { kind: authored }
  - id: fare
    ru: "поживать"
    examples:
      - pl: "Jak się miewasz?"
        ru: "Как поживаешь?"
        source: { kind: authored }
      - pl: "Miewa się lepiej niż w zeszłym roku."
        ru: "Он поживает лучше, чем в прошлом году."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЭТО МНОГОКРАТНЫЙ ГЛАГОЛ ОТ MIEĆ, И ТАКОЙ КЛАСС В ПОЛЬСКОМ ЖИВОЙ. Miewać значит не «иметь», а «иметь время от времени, бывать»: miewam bóle głowy «у меня бывают головные боли». Рядом стоят BYWAĆ от być, JADAĆ от jeść, SYPIAĆ od spać, WIDYWAĆ от widzieć, CZYTYWAĆ от czytać, CHADZAĆ от chodzić. Русский этот разряд почти потерял: «бывать» ещё живо, а «сиживать», «хаживать», «едать» отдают стариной или деревней. По-польски это обычные слова нейтрального стиля." }
  - { kind: usage, text: "JAK SIĘ MIEWASZ? — «как поживаешь?», и это самая частая встреча с этим глаголом. Чуть официальнее, чем jak leci, и мягче, чем co słychać. Ответ строится так же: miewam się dobrze «поживаю хорошо». Обрати внимание на się: в значении «поживать» глагол без него не употребляется." }
  - { kind: government, text: "Управление то же, что у mieć: винительный падеж прямого дополнения. Miewać wątpliwości, miewać gości, miewać kłopoty. Но помни общую ловушку всего гнезда: там, где русский говорит «у меня есть», поляк говорит mam, с подлежащим-человеком и винительным падежом вещи. Miewam kłopoty — буквально «имею хлопоты», а не «у меня бывают хлопоты»." }
collocations:
  - { pl: "miewać wątpliwości", ru: "иметь сомнения время от времени" }
  - { pl: "jak się miewasz?", ru: "как поживаешь?" }
  - { pl: "miewać bóle głowy", ru: "страдать головными болями" }
family:
  - { pl: "mieć", ru: "иметь", relation: root, id: miec }
  - { pl: "bywać", ru: "бывать", relation: root, id: bywac }
  - { pl: "miewać się", ru: "поживать", relation: derived }
etymology: "Многократная форма от mieć, из праславянского *jьměti — того же корня, что русское «иметь». Суффикс -ewa-/-ywa- здесь ровно тот, что в русских «сиживать», «хаживать», только в польском он остался продуктивным, а в русском застыл в горстке слов с оттенком старины. Так что miewać — это «имать» с повторяемостью, и ближайший живой русский аналог ему не «иметь», а «бывать»."
memory: "miewać — это не «иметь», а «иметь время от времени»: miewam bóle głowy «у меня бывают головные боли». И главное, ради чего это слово встретится первым: Jak się miewasz? — «Как поживаешь?»"
idioms:
  - { pl: "jak się miewasz?", ru: "как поживаешь?" }
  - { pl: "miewać się dobrze", ru: "поживать хорошо, чувствовать себя хорошо" }
