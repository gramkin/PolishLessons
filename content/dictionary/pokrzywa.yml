# review
id: pokrzywa
format: 2
lemma: "pokrzywa"
rank: 5923
pos: noun
pron: { cyr: "покшы́ва" }
senses:
  - id: nettle
    ru: "крапива (растение)"
    examples:
      - pl: "Pokrzywa parzy nawet przez cienkie spodnie."
        ru: "Крапива жжётся даже через тонкие брюки."
        source: { kind: authored }
      - pl: "Za stodołą rosła wysoka pokrzywa."
        ru: "За сараем росла высокая крапива."
        source: { kind: authored }
      - pl: "Wpadłem w pokrzywy i miałem bąble na rękach."
        ru: "Я упал в крапиву, и руки покрылись волдырями."
        source: { kind: authored }
      - pl: "Poparzyłam się pokrzywą przy płocie."
        ru: "Я обожглась крапивой у забора."
        source: { kind: authored }
  - id: food
    ru: "крапива как еда и лекарственная трава"
    examples:
      - pl: "Babcia parzyła herbatę z pokrzywy."
        ru: "Бабушка заваривала чай из крапивы."
        source: { kind: authored }
      - pl: "Placki z pokrzywą smakowały zaskakująco dobrze."
        ru: "Оладьи с крапивой оказались на удивление вкусными."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Читается «покшы́ва»: RZ после глухого K оглушается в «ш», Y — «ы». Ударение на KRZY. Слово то же, что русская «крапива», только в польском согласные переставлены — отсюда непривычный вид." }
  - { kind: usage, text: "Женский род на -A, склоняется как KNAJPA: W POKRZYWIE, Z POKRZYWĄ, родительный множественного POKRZYW. Звательный POKRZYWO не употребляется. Заросли крапивы обычно называют множественным числом: WPAŚĆ W POKRZYWY «упасть в крапиву», W POKRZYWACH «в крапиве»." }
  - { kind: government, text: "«Обжечься крапивой» — POPARZYĆ SIĘ POKRZYWĄ, с творительным без предлога. Сама крапива «жжётся» — POKRZYWA PARZY, от PARZYĆ «обжигать, ошпаривать»." }
collocations:
  - { pl: "poparzyć się pokrzywą", ru: "обжечься крапивой" }
  - { pl: "herbata z pokrzywy", ru: "крапивный чай" }
  - { pl: "wpaść w pokrzywy", ru: "упасть в крапиву" }
  - { pl: "zupa z pokrzywy", ru: "крапивный суп" }
family:
  - { pl: "pokrzywka", ru: "крапивница (сыпь)", relation: derived }
  - { pl: "pokrzywowate", ru: "крапивные (семейство растений)", relation: derived }
  - { pl: "herbata", ru: "чай", relation: root, id: herbata }
synonyms:
  - "koprzywa"
etymology: "Из старопольского KOPRZYWA, праславянское *kopriva или *kropiva — то же слово, что русское «крапива». В польском первые согласные поменялись местами, и получилось POKRZYWA."
memory: "Pokrzywa — это «крапива» с переставленными согласными: kopr- → pokr-. Pokrzywa parzy — крапива жжётся."
idioms:
  - { pl: "róży nic nie szkodzi, choć w pokrzywach stoi", ru: "розе ничего не сделается, хоть она и растёт в крапиве (хорошее плохим не испортишь)" }
formExamplesSkip:
