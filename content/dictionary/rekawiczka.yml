etymology: "Уменьшительное от RĘKAWICA, а то — от RĘKAW «рукав» и RĘKA «рука». Польское Ę на месте русского «у»: RĘKA — «рука», RĘKAWICA — «рукавица»."
memory: "Rękawiczka — перчатка, от ręka «рука». Читается «рэнкави́чка». Para rękawiczek — пара перчаток. Zmieniać jak rękawiczki — менять как перчатки."
idioms:
  - { pl: "zmieniać coś jak rękawiczki", ru: "менять что-то как перчатки" }
