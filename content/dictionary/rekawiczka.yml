notes:
  - { kind: false-friend, text: "RĘKAWICZKA — «перчатка», уменьшительное от RĘKAWICA. Сама RĘKAWICA — «рукавица, большая перчатка»: RĘKAWICA BOKSERSKA, «боксёрская перчатка». Варежка — RĘKAWICZKA Z JEDNYM PALCEM, а RĘKAWICZKI BEZ PALCÓW — это митенки." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: W RĘKAWICZCE. Родительный множественного — RĘKAWICZEK. Звательный не даётся." }
  - { kind: government, text: "Надеть перчатки — ZAŁOŻYĆ RĘKAWICZKI или WŁOŻYĆ RĘKAWICZKI. В перчатках — W RĘKAWICZKACH, местный. Пара перчаток — PARA RĘKAWICZEK." }
  - { kind: pronunciation, text: "Читается «рэнкави́чка», ударение на предпоследнем слоге. Ę перед K звучит «эн», CZ — «ч»." }
collocations:
  - { pl: "para rękawiczek", ru: "пара перчаток" }
  - { pl: "gumowe rękawiczki", ru: "резиновые перчатки" }
  - { pl: "skórzane rękawiczki", ru: "кожаные перчатки" }
