notes:
  - { kind: usage, text: "ЦЕЛЫЙ КЛАСС СЛОВ НА -JA ОТВЕЧАЕТ РУССКОМУ -ИЯ: komisja «комиссия», stacja «станция», lekcja «урок», policja «полиция», relacja «отношение». Все они пришли из латыни на -io и склоняются одинаково, так что выучив komisja, ты получаешь сразу несколько десятков слов." }
  - { kind: government, text: "Родительный множественного у этого класса двойной. Обычная форма — KOMISJI, совпадающая с единственным числом, а старая книжная — KOMISYJ, с окончанием -yj. Вторая встречается в довоенных текстах и юридическом языке; как у sekcji и relacji, обе формы правильны, но живая только первая." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: ko-MI-sja. Sj звучит как «сь» плюс «я», слитно: «коми́ся». Звательный komisjo используется в обращениях: Wysoka komisjo." }
collocations:
  - { pl: "komisja śledcza", ru: "следственная комиссия" }
  - { pl: "komisja egzaminacyjna", ru: "экзаменационная комиссия" }
  - { pl: "powołać komisję", ru: "создать комиссию" }
family:
  - { pl: "komitet", ru: "комитет", relation: root }
  - { pl: "komisarz", ru: "комиссар", relation: derived }
  - { pl: "urząd", ru: "учреждение, ведомство", relation: root }
etymology: "Из латинского commissio «поручение», от committere «поручать, вверять». То же слово дало русское «комиссия», немецкое Kommission и английское commission. Латинское -io во всех славянских языках превратилось в суффикс: по-польски -ja, по-русски -ия."
memory: "komisja — «комиссия», и вместе с ней весь класс на -ja: stacja, lekcja, policja. Родительный множественного двойной: обычное komisji и старое книжное komisyj. Звательный komisjo живёт в обращении Wysoka komisjo."
idioms:
  - { pl: "Wysoka komisjo", ru: "Уважаемая комиссия (обращение)" }
  - { pl: "stanąć przed komisją", ru: "предстать перед комиссией" }
