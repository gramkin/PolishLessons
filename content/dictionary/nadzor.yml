# review
id: nadzor
format: 2
lemma: "nadzór"
rank: 3989
pos: noun
pron: { cyr: "на́дзур" }
senses:
  - id: supervision
    ru: "надзор, контроль, присмотр"
    examples:
      - pl: "Dzieci bawiły się pod nadzorem nauczyciela."
        ru: "Дети играли под присмотром учителя."
        source: { kind: authored }
      - pl: "Pacjent jest pod stałym nadzorem lekarzy."
        ru: "Пациент под постоянным наблюдением врачей."
        source: { kind: authored }
      - pl: "Nadzór budowlany wstrzymał prace."
        ru: "Стройнадзор остановил работы."
        source: { kind: authored }
      - pl: "Sprawuje nadzór nad finansami firmy."
        ru: "Он контролирует финансы фирмы."
        source: { kind: authored }
      - pl: "Bez nadzoru nie wolno używać tej maszyny."
        ru: "Без присмотра этой машиной пользоваться нельзя."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NADZÓR — «надзор, контроль», и в быту чаще «присмотр»: POD NADZOREM DOROSŁYCH, «под присмотром взрослых». RADA NADZORCZA — «наблюдательный совет» компании, NADZÓR BUDOWLANY — «стройнадзор»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Ó в начальной форме, O в остальных: NADZÓR, NADZORU. В местном R переходит в RZ: W NADZORZE." }
  - { kind: government, text: "Под присмотром кого — POD NADZOREM, и родительный: POD NADZOREM LEKARZA. Надзор над чем — NADZÓR NAD, и творительный: SPRAWOWAĆ NADZÓR NAD BUDOWĄ." }
  - { kind: pronunciation, text: "Читается «на́дзур», ударение на первом слоге. D и Z произносятся раздельно, Ó — «у»." }
collocations:
  - { pl: "pod nadzorem", ru: "под присмотром, под контролем" }
  - { pl: "nadzór budowlany", ru: "строительный надзор" }
  - { pl: "rada nadzorcza", ru: "наблюдательный совет" }
family:
  - { pl: "nadzorować", ru: "контролировать, надзирать", relation: derived }
  - { pl: "nadzorca", ru: "надзиратель, контролёр", relation: derived }
  - { pl: "rada nadzorcza", ru: "наблюдательный совет", relation: derived }
etymology: "NAD «над» и корень ZOR-, тот же, что в «зреть, взор». Русское «надзор» построено точно так же."
memory: "Nadzór — надзор, присмотр: pod nadzorem lekarza. Читается «на́дзур». Rada nadzorcza — наблюдательный совет. Nadzorować — контролировать."
idioms:
  - { pl: "mieć oko na coś", ru: "приглядывать за чем-то" }
formExamplesSkip:
  - { form: "nadzorze", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
