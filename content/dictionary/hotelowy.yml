notes:
  - { kind: false-friend, text: "Самое полезное здесь — само сочетание. Русский называет гостиничную комнату «номером», по числу на двери, а поляк — тем, что она есть: POKÓJ HOTELOWY, то есть «гостиничная комната». Сказать NUMER HOTELOWY нельзя. И запомните, что слово POKÓJ само по себе значит и «комната», и «мир», и это одна из самых известных польских двусмысленностей: POKÓJ NA ZIEMI значит «мир на земле»." }
  - { kind: usage, text: "Все одиннадцать форм живые. Форма для мужчин-людей здесь есть и употребляется, потому что PRACOWNIK HOTELOWY и KELNER HOTELOWY — это люди, а значит бывают PRACOWNICY HOTELOWI и KELNERZY HOTELOWI. Пропускать её, как у LODOWY или PODZIEMNY, здесь нельзя. Прилагательное стоит после существительного: POKÓJ HOTELOWY, OBSŁUGA HOTELOWA." }
  - { kind: government, text: "В гостинице — W HOTELU, местный падеж. В гостиничном номере — W POKOJU HOTELOWYM, тоже местный, и обратите внимание, что POKÓJ даёт POKOJU, с переходом Ó в O. Снять номер — WYNAJĄĆ POKÓJ, винительный без предлога. Счёт за гостиницу — RACHUNEK HOTELOWY, без всякого предлога, тогда как русский вставляет «за»." }
  - { kind: pronunciation, text: "Читается «хотэло́вы», четыре слога, ударение на предпоследнем. Буква H даёт «х», а не «г». Буква E после T даёт «э», как и во всех таких словах: TEREN «тэ́рэн», TEMAT «тэ́мат». Сочетание LO даёт «ло», с твёрдым «л». Конечная Y даёт «ы». В женском роде HOTELOWA это «хотэло́ва»." }
  - { kind: register, text: "Слово нейтральное, из языка путешествий и объявлений. Частые сочетания — POKÓJ HOTELOWY, OBSŁUGA HOTELOWA «гостиничный сервис», RACHUNEK HOTELOWY, ŚNIADANIE HOTELOWE. Любопытно, что обычное польское название гостиницы — HOTEL, прямо из французского, тогда как у нас повседневное слово «гостиница», от «гостя», а «отель» звучит по-нарядному." }
collocations:
  - { pl: "obsługa hotelowa", ru: "гостиничный сервис" }
  - { pl: "rachunek hotelowy", ru: "счёт за гостиницу" }
