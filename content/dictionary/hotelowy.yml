family:
  - { pl: "hotel", ru: "гостиница, отель", relation: root, id: hotel }
  - { pl: "hotelarz", ru: "владелец гостиницы, отельер", relation: derived }
  - { pl: "hotelarstwo", ru: "гостиничное дело", relation: derived }
etymology: "От HOTEL, взятого из французского, а то — от латинского HOSPITALE «дом для гостей», от HOSPES «гость». Любопытно, что русский из той же латыни получил и «госпиталь», и «гостиницу» своим путём, через «гостя». Польский же сделал французское HOTEL обычным, повседневным словом, а на нём построил целое гнездо: HOTELARZ «отельер» и HOTELARSTWO «гостиничное дело», где суффикс -ARSTWO называет отрасль."
memory: "Гостиничный. Главное — pokoj hotelowy: русский говорит «номер», по числу на двери, а поляк называет комнату комнатой. Numer hotelowy сказать нельзя. Читается «хотэло́вы», где e после t даёт «э», как в teren «тэ́рэн». И запомните двусмысленность самого слова pokoj: это и «комната», и «мир». Форма для людей живая: pracownicy hotelowi."
idioms:
  - { pl: "pokój hotelowy", ru: "номер в гостинице" }
