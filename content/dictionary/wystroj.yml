  - { kind: usage, text: "Мужской род, неодушевлённое. Ó чередуется с O: WYSTRÓJ — WYSTROJU, WYSTROJE. Звательный совпадает с местным: WYSTROJU." }
  - { kind: pronunciation, text: "Ó читается «у»: «вы́струй». В остальных формах — «о»: WYSTROJU «выстро́ю». Ударение на предпоследнем слоге." }
