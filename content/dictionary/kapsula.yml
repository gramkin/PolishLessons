notes:
  - { kind: false-friend, text: "KAPSUŁA — «капсула», с Ł: «капсу́уа». Таблетка — TABLETKA, а KAPSUŁKA — маленькая капсула, в аптеке обычно говорят так. KAPSUŁA CZASU — «капсула времени», KAPSUŁKA DO KAWY — «кофейная капсула»." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном Ł переходит в L: W KAPSULE. Звательный KAPSUŁO не употребляется." }
  - { kind: government, text: "В капсулах — W KAPSUŁACH, местный. Принять капсулу — ZAŻYĆ KAPSUŁĘ, винительный. Капсула с чем — KAPSUŁA Z и творительный." }
  - { kind: pronunciation, text: "Читается «капсу́уа»: Ł — «у», две «у» подряд звучат как долгое «у». Ударение на предпоследнем слоге. KAPSULE — «капсу́ле»." }
