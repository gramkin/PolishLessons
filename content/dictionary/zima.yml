notes:
  - { kind: pronunciation, text: "Дательный и предложный — ZIMIE, с мягким mi вместо твёрдого m. Так ведут себя все основы на -ma: mama — mamie, forma — formie, zima — zimie. Мягкость эта на письме видна только по букве i, а на слух даёт призвук «мь»: «зи́ме»." }
  - { kind: usage, text: "Творительный падеж работает здесь как наречие: ZIMĄ значит «зимой», без всякого предлога. Так же устроены остальные времена года — LATEM, WIOSNĄ, JESIENIĄ, — и русский делает ровно то же самое своим творительным: «зимой», «летом», «весной», «осенью». Это один из тех случаев, где переводить можно буквально. Форма w zimie тоже существует, но звучит тяжелее и используется реже." }
collocations:
  - { pl: "sroga zima", ru: "суровая зима" }
  - { pl: "na zimę", ru: "на зиму" }
  - { pl: "zimą", ru: "зимой" }
family:
  - { pl: "zimowy", ru: "зимний", relation: derived }
  - { pl: "zimno", ru: "холодно, холод", relation: root }
  - { pl: "zimować", ru: "зимовать", relation: derived }
etymology: "Из праславянского *zima — то же слово, что русская «зима», без малейших расхождений. От него же zimny «холодный» и zimno «холодно», а у нас «зимний» и, через другое слово, «холод». Корень этот очень старый и встречается далеко за пределами славянских языков: латинское hiems и греческое cheimṓn — его дальняя родня."
memory: "Предложный мягкий: w ZIMIE, как w mamie. А «зимой» — это просто творительный ZIMĄ, без предлога, ровно как у нас."
idioms:
