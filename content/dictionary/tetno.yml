notes:
  - { kind: false-friend, text: "TĘTNO — «пульс», от TĘTNIĆ «биться, пульсировать». Отсюда же TĘTNICA — «артерия», а не что-то «тётино». Слово PULS по-польски тоже есть и значит то же самое, но в медицине и спорте обычнее TĘTNO." }
  - { kind: usage, text: "Пять живых форм, средний род. У пульса нет множественного числа в обычной речи, поэтому формы TĘTN, TĘTNOM, TĘTNAMI, TĘTNACH не даются. Местный падеж — W TĘTNIE." }
  - { kind: government, text: "Измерить пульс — ZMIERZYĆ TĘTNO, винительный. Нащупать пульс — WYCZUĆ TĘTNO. Нет пульса — BRAK TĘTNA, родительный. С учащённым пульсом — Z PRZYSPIESZONYM TĘTNEM." }
  - { kind: pronunciation, text: "Читается «тэ́нтно», два слога, ударение на первом. Ę перед T звучит «эн», T перед E твёрдое: «тэ»." }
  - { kind: register, text: "Слово нейтральное: у врача, на тренировке, в часах-трекере. Переносное «пульс города» — книжное, но встречается часто." }
collocations:
  - { pl: "zmierzyć tętno", ru: "измерить пульс" }
  - { pl: "przyspieszone tętno", ru: "учащённый пульс" }
  - { pl: "tętno spoczynkowe", ru: "пульс в покое" }
family:
  - { pl: "tętnić", ru: "пульсировать, биться", relation: root }
  - { pl: "tętnica", ru: "артерия", relation: root, id: tetnica }
  - { pl: "tętent", ru: "топот копыт", relation: root }
etymology: "От TĘTNIĆ «стучать, биться», корень звукоподражательный: тот же стук слышен в TĘTENT «топот копыт». Пульс — это стук крови, а артерия, TĘTNICA, — сосуд, который бьётся."
memory: "Tętno — пульс; tętnica — артерия, tętnić — биться. Читается «тэ́нтно». Zmierzyć tętno — измерить пульс. Miasto tętni życiem — город бурлит жизнью."
idioms:
  - { pl: "tętnić życiem", ru: "бурлить жизнью" }
