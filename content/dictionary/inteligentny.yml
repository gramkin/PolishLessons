rank: 2672
pos: adj
pron: { cyr: "интэлиге́нтны" }
senses:
  - id: smart
    ru: "умный, сообразительный"
    examples:
      - pl: "To bardzo inteligentny chłopak."
        ru: "Это очень умный парень."
        source: { kind: authored }
      - pl: "Inteligentni ludzie też popełniają błędy."
