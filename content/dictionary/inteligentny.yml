  - id: clever
    ru: "разумный, продуманный"
    examples:
      - pl: "To było inteligentne rozwiązanie."
        ru: "Это было умное решение."
        source: { kind: authored }
      - pl: "Inteligentny dom sam gasi światło."
        ru: "Умный дом сам гасит свет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "INTELIGENTNY значит «умный», «сообразительный», и говорит о способностях головы, а не о манерах. Русское «интеллигентный» оценивает совсем другое: воспитанность, культурность, принадлежность к определённому кругу. По-польски это KULTURALNY или DOBRZE WYCHOWANY. Назвав поляка inteligentny, вы хвалите его ум; сказав по-русски «интеллигентный», вы хвалите его обхождение, и это не одно и то же." }
  - { kind: usage, text: "Форм тридцать три: одиннадцать падежных на каждую из трёх степеней, как у słoneczny. Заимствованность слову не мешает — степени строятся по-польски, своими суффиксами: inteligentniejszy, najinteligentniejszy, а не «bardziej inteligentny». Описательная степень остаётся для тех прилагательных, у которых собственной нет." }
  - { kind: pronunciation, text: "Мужская личная форма множественного смягчается в каждой степени по-своему: в положительной n переходит в мягкое ń — INTELIGENTNI, а в сравнительной и превосходной смягчается sz, давая INTELIGENTNIEJSI и NAJINTELIGENTNIEJSI. Та же пара превращений, что у słoneczny, и заметить её легче на слух, чем в написании." }
collocations:
  - { pl: "inteligentny człowiek", ru: "умный человек" }
  - { pl: "inteligentne rozwiązanie", ru: "умное решение" }
  - { pl: "inteligentny dom", ru: "умный дом" }
family:
  - { pl: "inteligencja", ru: "ум; интеллигенция", relation: derived }
  - { pl: "inteligentnie", ru: "умно", relation: derived }
  - { pl: "głupi", ru: "глупый", relation: antonym, id: glupi }
etymology: "Из латинского intelligens, причастия от intellegere «различать, понимать», буквально «выбирать между»: inter «между» и legere «собирать, выбирать». Оба языка взяли слово из латыни через учёный обиход, но развели значения. Существительное inteligencja в польском держит оба смысла сразу — и способность соображать, и образованный слой общества, тот самый, который по-русски называется интеллигенцией."
memory: "inteligentny — это «умный», а не «интеллигентный». Воспитанный и культурный по-польски kulturalny."
idioms:
  - { pl: "inteligentny dom", ru: "умный дом" }
  - { pl: "inteligentny inaczej", ru: "не блещет умом" }
