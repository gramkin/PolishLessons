pos: noun
pron: { cyr: "ку́хаш" }
senses:
  - id: cook
    ru: "повар"
    examples:
      - pl: "Kucharz pracuje w restauracji od rana."
        ru: "Повар работает в ресторане с утра."
        source: { kind: authored }
      - pl: "Zatrudniliśmy nowego kucharza."
        ru: "Мы наняли нового повара."
        source: { kind: authored }
      - pl: "Szef kuchni dowodzi wszystkimi kucharzami."
        ru: "Шеф-повар руководит всеми поварами."
        source: { kind: authored }
  - id: home-cook
    ru: "кулинар (о любителе)"
    examples:
      - pl: "Mój tata jest świetnym kucharzem."
        ru: "Мой папа отлично готовит."
        source: { kind: authored }
      - pl: "Nie jestem dobrym kucharzem, ale się staram."
        ru: "Готовлю я не очень, но стараюсь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KUCHARZ — «повар», от KUCHNIA «кухня». Русское «кухарка» — домашняя прислуга, а польская KUCHARKA — просто «повариха». Шеф-повар — SZEF KUCHNI." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Именительный множественного — KUCHARZE, как LEKARZE, а не на -RZY. В родительном множественного две формы: KUCHARZY и KUCHARZÓW. Местный и звательный совпадают: KUCHARZU." }
  - { kind: government, text: "Работать поваром — PRACOWAĆ JAKO KUCHARZ или BYĆ KUCHARZEM, творительный. Передать повару благодарность — PRZEKAZAĆ KUCHARZOWI POCHWAŁY, дательный." }
  - { kind: pronunciation, text: "Читается «ку́хаш», ударение на первом слоге. CH — «х», конечное RZ оглушается в «ш». В форме KUCHARZA: «куха́жа»." }
collocations:
  - { pl: "szef kuchni", ru: "шеф-повар" }
  - { pl: "dobry kucharz", ru: "хороший повар" }
  - { pl: "kucharz amator", ru: "повар-любитель" }
family:
  - { pl: "kuchnia", ru: "кухня", relation: root, id: kuchnia }
  - { pl: "kucharka", ru: "повариха", relation: derived }
  - { pl: "kucharski", ru: "поварской, кулинарный", relation: derived }
etymology: "От KUCHNIA «кухня», через немецкий из латыни. Суффикс деятеля -ARZ, как в LEKARZ «врач» и PIEKARZ «пекарь»."
memory: "Kucharz — повар, от kuchnia. Читается «ку́хаш». Kucharze — повара. Szef kuchni — шеф-повар. Książka kucharska — кулинарная книга."
idioms:
  - { pl: "gdzie kucharek sześć, tam nie ma co jeść", ru: "у семи нянек дитя без глазу" }
