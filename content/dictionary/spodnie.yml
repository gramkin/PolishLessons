    examples:
      - pl: "Włożył czyste spodnie."
        ru: "Он надел чистые брюки."
        source: { kind: translated, id: 579974 }
      - pl: "Czy on wyprasował swoje spodnie?"
        ru: "Он отутюжил свои брюки?"
