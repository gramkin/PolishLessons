notes:
  - { kind: usage, text: "Слово только множественного числа (plurale tantum), как русские «брюки» и «штаны»: единственного нет ни в одном языке." }
  - { kind: usage, text: "Поэтому «одни брюки» — para spodni, буквально «пара брюк», как и в русском «пара брюк»." }
  - { kind: usage, text: "Родительный — spodni: kieszeń spodni «карман брюк», potrzebuję nowych spodni «мне нужны новые брюки»." }
  - { kind: usage, text: "nosić spodnie — идиома «носить брюки», то есть верховодить в доме; совпадает с русским." }
collocations:
  - { pl: "para spodni", ru: "пара брюк" }
  - { pl: "kieszeń spodni", ru: "карман брюк" }
  - { pl: "włożyć spodnie", ru: "надеть брюки" }
etymology: "От spód «низ» — буквально «то, что внизу». Русские «штаны» (из тюркского) и «брюки» (из голландского) названы иначе, так что родства нет, но логика «нижней одежды» та же."
memory: "spodnie = «брюки, штаны», и слово только множественного числа, как в русском. Отсюда para spodni «пара брюк». В основе spód «низ» — нижняя одежда."
idioms:
  - { pl: "para spodni", ru: "пара брюк" }
  - { pl: "nosić spodnie", ru: "верховодить в доме" }
  - { pl: "włożyć spodnie", ru: "надеть брюки" }
