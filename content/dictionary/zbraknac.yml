        source: { kind: authored }
notes:
  - { kind: government, text: "Безличный глагол: того, чего не хватило, ставят в РОДИТЕЛЬНЫЙ падеж, а человека — в дательный. Zbrakło mi sił «мне не хватило сил», ровно как русское «не хватило чего кому»." }
  - { kind: usage, text: "Парадигма дефектная: живых форм всего четыре, и встречается слово практически только в прошедшем среднего рода — zbrakło." }
  - { kind: usage, text: "Несовершенный вид — brakować, который уже есть в словаре." }
  - { kind: false-friend, text: "Корень brak «нехватка, недостаток», который тоже есть отдельной карточкой." }
collocations:
  - { pl: "zbrakło sił", ru: "не хватило сил" }
  - { pl: "zbrakło czasu", ru: "не хватило времени" }
etymology: "z- + braknąć, от brak «нехватка»; ср. русское «браковать» и оборот «не хватает»."
memory: "zbraknąć — безличное «не хватить»: zbrakło mi sił. Чего не хватило — родительный, кому — дательный, как в русском. Несовершенный вид — brakować."
