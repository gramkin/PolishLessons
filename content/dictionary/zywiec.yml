lemma: "żywiec"
rank: 3926
pos: noun
pron: { cyr: "жы́вец" }
senses:
  - id: livestock
    ru: "живой скот (на продажу, на убой), живой вес"
    examples:
      - pl: "Cena żywca wieprzowego spadła."
        ru: "Цена на живых свиней упала."
        source: { kind: authored }
      - pl: "Rolnik sprzedał żywiec do rzeźni."
        ru: "Фермер продал скот на бойню."
        source: { kind: authored }
      - pl: "Transport żywca wymaga specjalnych pozwoleń."
        ru: "Перевозка живого скота требует специальных разрешений."
        source: { kind: authored }
  - id: live-bait
    ru: "живец (живая рыбка как наживка)"
    examples:
      - pl: "Szczupaka łowi się na żywca."
        ru: "Щуку ловят на живца."
        source: { kind: authored }
      - pl: "Założył żywca na haczyk."
        ru: "Он насадил живца на крючок."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «живец» — только рыбка-наживка, а польское ŻYWIEC прежде всего «живой скот» в торговле: ŻYWIEC WOŁOWY, «живой крупный рогатый скот». Значение «наживка» тоже есть: ŁOWIĆ NA ŻYWCA. С большой буквы Żywiec — город на юге Польши, известный пивом." }
  - { kind: usage, text: "Мужской род, неодушевлённое в значении «скот» и одушевлённое в значении «рыбка»: SPRZEDAĆ ŻYWIEC, но ZAŁOŻYĆ ŻYWCA. Беглое E: ŻYWIEC, ŻYWCA. Множественное употребляется редко, в карточке только единственное. Творительный ŻYWCEM стал наречием «заживо»: SPALIĆ ŻYWCEM." }
  - { kind: government, text: "На живца — NA ŻYWCA, NA с винительным. Цена живого веса — CENA ŻYWCA, родительный. Заживо — ŻYWCEM, творительный, без предлога: POGRZEBANY ŻYWCEM, «погребённый заживо»." }
  - { kind: pronunciation, text: "Читается «жы́вец», два слога, ударение на первом. Ż — твёрдое «ж», за ним «ы». В ŻYWCA беглая E выпадает: «жы́вца», W перед C оглушается: «жы́фца»." }
  - { kind: register, text: "В значении «скот» — слово торговли и сельского хозяйства, его видно в биржевых сводках. В значении «наживка» — рыбацкий жаргон. Наречие ŻYWCEM и выражение NA ŻYWCA разговорные: NA ŻYWCA значит «вживую», без подготовки или без наркоза." }
collocations:
  - { pl: "żywiec wieprzowy", ru: "живые свиньи (на продажу)" }
  - { pl: "łowić na żywca", ru: "ловить на живца" }
  - { pl: "spalić żywcem", ru: "сжечь заживо" }
family:
  - { pl: "żywy", ru: "живой", relation: root, id: zywy }
  - { pl: "przynęta", ru: "наживка, приманка", relation: root, id: przyneta }
  - { pl: "bydło", ru: "скот", relation: root, id: bydlo }
etymology: "От ŻYWY «живой», общеславянского *živъ, с суффиксом -IEC, как в русском «живец». В польском слово расширилось до «живого товара»: скот, который продают ещё живым, по весу. Город ŻYWIEC назван, по-видимому, от того же корня, но связи со скотом у названия нет."
memory: "Żywiec — живой скот на продажу: cena żywca. И живец-наживка: łowić na żywca. Żywcem — заживо. Na żywca — вживую. Читается «жы́вец»."
idioms:
  - { pl: "na żywca", ru: "вживую, без подготовки; без наркоза" }
