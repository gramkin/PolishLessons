# review
id: historia
format: 2
lemma: "historia"
rank: 345
pos: noun
pron: { cyr: "исто́рья" }
senses:
  - id: story
    ru: "история, рассказ"
    examples:
      - pl: "To smutna historia."
        ru: "Это грустная история."
        source: { kind: tatoeba, id: 4716805 }
      - pl: "Opowiedziałem jemu historię."
        ru: "Я рассказал ему историю."
        source: { kind: tatoeba, id: 13633152 }
      - pl: "Słyszeliście już tę historię?"
        ru: "Вы уже слышали эту историю?"
        source: { kind: tatoeba, id: 10747446 }
  - id: history
    ru: "история (наука, прошлое)"
    examples:
      - pl: "Lubię studiować historię."
        ru: "Люблю изучать историю."
        source: { kind: tatoeba, id: 959028 }
      - pl: "Oparto na prawdziwej historii."
        ru: "Основано на реальных событиях."
        source: { kind: tatoeba, id: 3657482 }
      - pl: "Historia poruszyła mnie do łez."
        ru: "Рассказ тронул меня до слёз."
        source: { kind: tatoeba, id: 2143132 }
notes:
  - { kind: usage, text: "Одно слово покрывает оба русских значения: «история» как наука и «история» как рассказ." }
  - { kind: usage, text: "opowiedzieć historię — «рассказать историю»; przejść do historii — «войти в историю»." }
  - { kind: usage, text: "Разговорное ładna historia! значит «хорошенькое дело!», с иронией." }
collocations:
  - { pl: "smutna historia", ru: "грустная история" }
  - { pl: "opowiedzieć historię", ru: "рассказать историю" }
  - { pl: "przejść do historii", ru: "войти в историю" }
  - { pl: "prawdziwa historia", ru: "реальная история" }
etymology: "Из латинского historia, а то — из греческого ἱστορία «расспрашивание,知ание»; в русский «история» пришла тем же путём."
memory: "historia — и наука «история», и «история» в смысле рассказа: opowiedzieć historię. Из греческого через латынь, как и русское слово."
idioms:
  - { pl: "przejść do historii", ru: "войти в историю" }
  - { pl: "ładna historia", ru: "хорошенькое дело" }
  - { pl: "to już historia", ru: "это уже история" }
formExamplesSkip:
  - { form: "historio", reason: "звательный падеж от этого слова в живой речи не употребляется" }
  - { form: "historyj", reason: "устаревшая форма родительного множественного; современная — historii" }
