# review
id: pobic
format: 2
lemma: "pobić"
rank: 1691
pos: verb
pron: { cyr: "по́биць" }
senses:
  - id: beat-up
    ru: "побить, избить"
    examples:
      - pl: "Pobił go na oczach świadków."
        ru: "Он побил его на глазах свидетелей."
        source: { kind: authored }
      - pl: "Pobito go pod klubem."
        ru: "Его побили у клуба."
        source: { kind: authored }
      - pl: "Pobity przechodzień trafił do szpitala."
        ru: "Избитый прохожий попал в больницу."
        source: { kind: authored }
  - id: beat-record
    ru: "побить (рекорд), превзойти"
    examples:
      - pl: "Pobił rekord świata."
        ru: "Он побил мировой рекорд."
        source: { kind: authored }
      - pl: "Rekord został pobity."
        ru: "Рекорд был побит."
        source: { kind: authored }
  - id: battery
    ru: "pobicie — побои (юридический термин)"
    examples:
      - pl: "Pobicie zgłoszono na policję."
        ru: "О побоях сообщили в полицию."
        source: { kind: authored }
      - pl: "Za pobicie grozi kara."
        ru: "За побои грозит наказание."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Страдательное причастие здесь другого класса, чем у большинства глаголов: не -ony, а -ty — pobity, pobita, pobite. И мужско-личное множественное даёт pobici, с чередованием t → ci. Сравните с рядом -ony/-eni из соседних карточек (zatrudniony — zatrudnieni, podzielony — podzieleni): это два разных образца, и важно не смешивать их." }
  - { kind: government, text: "Бьют КОГО — винительный, как по-русски: pobić kogoś. Рекорд тоже в винительном: pobić rekord. Угроза ставится в творительный: grozić pobiciem «угрожать побоями». Все три схемы совпадают с русскими." }
  - { kind: false-friend, text: "Значения совпадают с русским «побить» — и «избить», и «побить рекорд». Но осторожно с кулинарией: «побить, взбить» (яйца, сливки) по-польски не pobić, а ubić или roztrzepać. Pobić в кухне не употребляют." }
  - { kind: register, text: "В первом значении слово описывает настоящее нападение, а pobicie — юридический термин, отвечающий русским «побоям»: это формулировка из полицейского протокола, а не разговорное преувеличение. О шутливой потасовке скажут скорее poszturchać się." }
collocations:
  - { pl: "pobić rekord", ru: "побить рекорд" }
  - { pl: "grozić pobiciem", ru: "угрожать побоями" }
  - { pl: "zostać pobitym", ru: "быть избитым" }
family:
  - { pl: "bić", ru: "бить", relation: root, id: bic }
  - { pl: "pobicie", ru: "побои", relation: derived }
  - { pl: "pobijać", ru: "побивать", relation: aspect }
etymology: "Приставка po- плюс bić, праславянское *biti «бить». Русское «побить» собрано из тех же частей и держит оба значения — и «избить», и «превзойти» (побить рекорд), так что совпадение полное. Из того же корня польские bitwa «битва», bicz «бич» и bić serce «сердце бьётся»."
memory: "pobić — «побить», и в смысле избить, и в смысле побить рекорд. Главное о формах: причастие здесь на -ty (pobity), а не на -ony, а во множественном мужско-личном pobici (t → ci)."
idioms:
  - { pl: "pobić rekord", ru: "побить рекорд" }
  - { pl: "pobić na głowę", ru: "превзойти на голову" }
