etymology: "Из латинского EXSECUTIO «доведение до конца, исполнение», от глагола EXSEQUI, сложения EX- и SEQUI «следовать»: исполнить значило проследовать за делом до самого конца. От того же SEQUI идут «секвенция», «консеквентный» и польское KONSEKWENCJA. Оба языка взяли слово из латыни канцелярий, но закрепили за разными сторонами понятия: польский за исполнением приговора и взысканием, то есть за юридической сутью, а русский за телесным наказанием, то есть за самой зримой формой исполнения, и оттого слово у него обросло насмешливым оттенком. Суффикс -CJA отвечает русскому -ЦИЯ и восходит к латинскому -TIO."
memory: "Одно латинское exsecutio «доведение до конца», от exsequi «следовать до конца», но значения разошлись: русская «экзекуция» это порка, звучит старомодно, а польская egzekucja — казнь или, гораздо чаще, принудительное взыскание долга, которым занимается komornik. Глагол egzekwować «взыскивать, требовать исполнения» в деловой речи постоянен. Два родительных множественного: обычное egzekucji и архаичное egzekucyj, как amunicyj."
