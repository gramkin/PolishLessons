notes:
  - { kind: false-friend, text: "Русская «экзекуция» и польская EGZEKUCJA — одно латинское слово, разошедшееся по смыслу. По-русски это прежде всего телесное наказание, порка, и слово сегодня звучит старомодно или шутливо. По-польски EGZEKUCJA означает, во-первых, казнь и приведение смертного приговора в исполнение, а во-вторых — принудительное взыскание долга, то есть работу судебного пристава, который называется KOMORNIK. Второе значение в современной речи встречается чаще первого: EGZEKUCJA Z WYNAGRODZENIA «взыскание из заработной платы» — обычная строка в документе, и ничего жестокого она не означает." }
  - { kind: usage, text: "Десять форм, женский род, основа на -CJA. Форма EGZEKUCJI покрывает родительный, дательный и местный единственного и служит обычным родительным множественного. Рядом с ней стоит старая форма родительного множественного EGZEKUCYJ, с нулевым окончанием: она принадлежит языку документов и старых актов, как AMUNICYJ и BIŻUTERYJ. Именительный и винительный множественного — EGZEKUCJE. Все существительные на -CJA склоняются одинаково, и этот образец покрывает сотни слов: LEKCJA, STACJA, PORCJA, INFORMACJA." }
  - { kind: pronunciation, text: "Читается «эгзэку́ця», четыре слога, ударение на третьем. Начальное E даёт «э», сочетание GZ произносится слитно и звонко. Буквосочетание CJA читается как «ця» в один слог: польский стягивает латинское окончание, и слово выходит короче русского на слог — в этом главное отличие на слух от «экзекуции». В форме EGZEKUCJI слышно «эгзэку́ци». В форме EGZEKUCYJ буква Y даёт «ы»: «эгзэку́цый», и форма эта на слух заметно архаична." }
  - { kind: register, text: "В значении казни слово историческое и газетное, в значении взыскания — строго юридическое и очень частое. Устойчивые сочетания: EGZEKUCJA WYROKU, EGZEKUCJA KOMORNICZA, EGZEKUCJA Z RACHUNKU BANKOWEGO, POSTĘPOWANIE EGZEKUCYJNE «исполнительное производство». Производные: EGZEKWOWAĆ «требовать исполнения, взыскивать» — слово совершенно обиходное и в деловой речи постоянное, EGZEKUTOR, EGZEKUCYJNY. Переносное EGZEKWOWAĆ OBIETNICE значит «требовать выполнения обещаний» и не несёт никакой жестокости." }
