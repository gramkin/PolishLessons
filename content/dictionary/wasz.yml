# review
id: wasz
format: 2
lemma: "wasz"
rank: 212
pos: adj
pron: { cyr: "ваш" }
senses:
  - id: yours
    ru: "ваш, ваша, ваше (принадлежность)"
    examples:
      - pl: "Mam wasze bilety."
        ru: "Ваши билеты у меня."
        source: { kind: tatoeba, id: 5528891 }
      - pl: "To wasze zwycięstwo."
        ru: "Это ваша победа."
        source: { kind: tatoeba, id: 756576 }
      - pl: "A gdzie wasze rzeczy?"
        ru: "А где ваши вещи?"
        source: { kind: tatoeba, id: 10747402 }
  - id: address
    ru: "ваш (в обращении и устойчивых оборотах)"
    examples:
      - pl: "Jestem waszym tatą."
        ru: "Я ваш папа."
        source: { kind: tatoeba, id: 6553627 }
      - pl: "To nie wasza sprawa."
        ru: "Это не ваше дело."
        source: { kind: tatoeba, id: 13865805 }
      - pl: "Za naszą i waszą wolność."
        ru: "За нашу и вашу свободу."
        source: { kind: tatoeba, id: 13472055 }
notes:
  - { kind: usage, text: "wasz — «ваш» к группе, с которой на «ты». Вежливое «Ваш» к одному человеку строится иначе: pana samochód «Ваша машина» (к мужчине), pani książka (к женщине)." }
  - { kind: usage, text: "Если владелец совпадает с подлежащим, вместо wasz ставится swój: Weźcie swoje rzeczy «Возьмите свои вещи»." }
collocations:
  - { pl: "wasz dom", ru: "ваш дом" }
  - { pl: "wasza sprawa", ru: "ваше дело" }
  - { pl: "po waszemu", ru: "по-вашему" }
  - { pl: "wasze zdrowie!", ru: "ваше здоровье!" }
etymology: "Праславянское *vašь — то же слово, что русское «ваш»."
memory: "wasz — «ваш» к тем, с кем на «ты». Вежливое «Ваш» к одному человеку — pana или pani: pana książka. И не забывайте swój: Weźcie swoje rzeczy."
idioms:
  - { pl: "za naszą i waszą wolność", ru: "за нашу и вашу свободу" }
  - { pl: "po waszemu", ru: "по-вашему" }
  - { pl: "wasze zdrowie!", ru: "ваше здоровье!" }
