senses:
  - id: blunt
    ru: "тупой (о ноже, инструменте)"
    examples:
      - pl: "Ten nóż jest tępy, nic nie kroi."
        ru: "Этот нож тупой, ничего не режет."
        source: { kind: authored }
      - pl: "Ołówek jest tępy, trzeba go zatemperować."
