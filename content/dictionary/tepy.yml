        ru: "Это самый тупой топор в сарае."
        source: { kind: authored }
  - id: dull
    ru: "тупой, недалёкий (о человеке); тупой (о боли, взгляде)"
    examples:
      - pl: "Nie jest tępy, tylko leniwy."
        ru: "Он не тупой, просто ленивый."
        source: { kind: authored }
      - pl: "Czuł tępy ból w plecach."
        ru: "Он чувствовал тупую боль в спине."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «тупой» полное, и в обоих значениях: о ноже и о человеке. Корень тот же, только польское носовое Ę на месте русского «у»: TĘPY — «тупой», как RĘKA — «рука». О человеке TĘPY — грубо; вежливее — NIEROZGARNIĘTY, «несообразительный»." }
  - { kind: usage, text: "Полная парадигма с простыми степенями: TĘPY, TĘPSZY, NAJTĘPSZY. Мужское-личное: TĘPI, TĘPSI, NAJTĘPSI — о несообразительных людях, грубовато. Наречие TĘPO — «тупо»: PATRZEĆ TĘPO, «тупо смотреть»." }
  - { kind: government, text: "Тупой как что-то — TĘPY JAK BUT, «тупой как сапог», JAK с именительным. В сравнении — NIŻ или OD с родительным. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «тэ́мпы», два слога, ударение на первом. Ę перед P звучит «эм». В TĘPSZY: «тэ́мпшы»." }
  - { kind: register, text: "О предметах и боли — нейтральное. О человеке — грубоватое, оскорбительное: TĘPY JAK BUT, TĘPAK, «тупица». В медицине TĘPY BÓL — точный термин, «тупая боль»." }
collocations:
  - { pl: "tępy nóż", ru: "тупой нож" }
  - { pl: "tępy ból", ru: "тупая боль" }
  - { pl: "tępy jak but", ru: "тупой как сапог" }
family:
  - { pl: "ostry", ru: "острый", relation: root, id: ostry }
  - { pl: "głupi", ru: "глупый", relation: root, id: glupi }
  - { pl: "tępak", ru: "тупица", relation: derived }
etymology: "Общеславянское *tǫpъ, того же, что русское «тупой». Польское Ę на месте русского «у» — постоянное соответствие носовых гласных: TĘPY — «тупой», ZĄB — «зуб». Переносное «недалёкий» развилось в обоих языках одинаково."
memory: "Tępy — тупой: tępy nóż, tępy ból; и о человеке, грубо: tępy jak but. Ę на месте «у». Tępszy, najtępszy. Читается «тэ́мпы»."
idioms:
  - { pl: "tępy jak but", ru: "тупой как сапог" }
