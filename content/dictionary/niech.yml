# review
id: niech
format: 2
lemma: "niech"
rank: 180
pos: part
pron: { cyr: "нех" }
senses:
  - id: let
    ru: "пусть, да (побуждение к третьему лицу)"
    examples:
      - pl: "Niech żyje król!"
        ru: "Да здравствует король!"
        source: { kind: tatoeba, id: 730604 }
      - pl: "Niech żyje chaos!"
        ru: "Да здравствует хаос!"
        source: { kind: tatoeba, id: 1795252 }
      - pl: "Niech żyje Ukraina!"
        ru: "Слава Украине!"
        source: { kind: tatoeba, id: 13726634 }
  - id: polite
    ru: "вежливое повеление к pan/pani"
    note: "Главный способ вежливой просьбы: Niech pan usiądzie — буквально «пусть господин сядет»."
    examples:
      - pl: "Niech pan powie."
        ru: "Скажите."
        source: { kind: tatoeba, id: 13784992 }
      - pl: "Niech pan wejdzie."
        ru: "Входите."
        source: { kind: tatoeba, id: 8617143 }
      - pl: "Niech pani powie."
        ru: "Скажите."
        source: { kind: tatoeba, id: 13784990 }
notes:
  - { kind: usage, text: "niech + глагол в 3-м лице отвечает русскому «пусть»: Niech wejdzie «Пусть войдёт»." }
  - { kind: usage, text: "Вежливая просьба к незнакомому человеку строится именно так: Niech pan poczeka «Подождите, пожалуйста». Прямое повелительное наклонение звучало бы грубо." }
  - { kind: usage, text: "Niech żyje…! — «Да здравствует…!»; a niech to! — досадливое «да чтоб его!»." }
collocations:
  - { pl: "niech żyje!", ru: "да здравствует!" }
  - { pl: "niech pan poczeka", ru: "подождите, пожалуйста" }
  - { pl: "niech będzie", ru: "пусть будет" }
  - { pl: "niech tak zostanie", ru: "пусть так и останется" }
etymology: "Сокращение от niechaj, восходящего к старопольскому niechać «оставлять, позволять»."
memory: "niech = «пусть»: Niech wejdzie. И это главный способ вежливо попросить: Niech pan usiądzie «Присаживайтесь» — дословно «пусть господин сядет»."
idioms:
  - { pl: "niech żyje!", ru: "да здравствует!" }
  - { pl: "a niech to!", ru: "да чтоб его!" }
  - { pl: "niech cię głowa o to nie boli", ru: "пусть у тебя об этом голова не болит" }
