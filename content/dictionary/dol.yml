# review
id: dol
format: 2
lemma: "dół"
rank: 521
pos: noun
pron: { cyr: "дуу" }
senses:
  - id: pit
    ru: "яма, углубление"
    examples:
      - pl: "Wpadł do dołu bez dna."
        ru: "Он упал в бездонную яму."
        source: { kind: translated, id: 12450226 }
      - pl: "Jeśli ślepiec prowadzi ślepca, obaj wpadną do dołu."
        ru: "Если слепой ведёт слепого, оба упадут в яму."
        source: { kind: translated, id: 12450229 }
      - pl: "Wykopali dół pod fundament."
        ru: "Они выкопали яму под фундамент."
        source: { kind: authored }
  - id: bottom
    ru: "низ, нижняя часть; вниз"
    examples:
      - pl: "Spójrz w dół."
        ru: "Посмотри вниз."
        source: { kind: tatoeba, id: 8745529 }
      - pl: "Spadł głową w dół."
        ru: "Он упал головой вниз."
        source: { kind: tatoeba, id: 1085712 }
      - pl: "Zostawiłem swój słownik na dole."
        ru: "Я оставил свой словарь внизу."
        source: { kind: tatoeba, id: 930109 }
notes:
  - { kind: usage, text: "Праславянское *dolъ; русское «дол» и «долина» — то же гнездо, но в польском слово стало бытовым и значит прежде всего «яма» и «низ»." }
  - { kind: usage, text: "Направление и место различаются предлогом и падежом: w dół «вниз» (винительный), na dole «внизу» (предложный). Ровно как русские «вниз» и «внизу»." }
  - { kind: usage, text: "Разговорное mieć doła — «быть в хандре, в депрессии»; отсюда и dołek «упадок сил»." }
  - { kind: usage, text: "u dołu ekranu — «внизу экрана»; na dole tabeli — «внизу таблицы»." }
collocations:
  - { pl: "w dół", ru: "вниз" }
  - { pl: "na dole", ru: "внизу" }
  - { pl: "mieć doła", ru: "хандрить" }
  - { pl: "u dołu", ru: "внизу" }
etymology: "Праславянское *dolъ; русские «дол» и «долина» — то же гнездо. В польском слово обытовилось и значит прежде всего «яма» и «низ»."
memory: "dół — «яма» и «низ» разом. Направление и место различает падеж, ровно как в русском: w dół «вниз», но na dole «внизу». И запомните разговорное mieć doła — «хандрить, быть в депрессии»."
idioms:
  - { pl: "w dół", ru: "вниз" }
  - { pl: "na dole", ru: "внизу" }
  - { pl: "mieć doła", ru: "хандрить" }
