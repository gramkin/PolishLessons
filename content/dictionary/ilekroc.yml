# review
id: ilekroc
format: 2
lemma: "ilekroć"
rank: 5512
pos: adv
pron: { cyr: "иле́кроць" }
senses:
  - id: whenever
    ru: "каждый раз, когда; всякий раз, как"
    examples:
      - pl: "Ilekroć go widzę, jest uśmiechnięty."
        ru: "Каждый раз, когда я вижу его, он улыбается."
        source: { kind: tatoeba, id: 722319 }
      - pl: "Ilekroć chcemy wyrazić własne myśli używamy języka."
        ru: "Каждый раз, когда мы хотим выразить собственные мысли, мы используем язык."
        source: { kind: tatoeba, id: 4388687 }
      - pl: "Ilekroć oglądam tę sztukę, płaczę."
        ru: "Каждый раз, когда я смотрю эту пьесу, я плачу."
        source: { kind: translated, id: 365053 }
  - id: every-time
    ru: "сколько раз ни"
    examples:
      - pl: "Ilekroć dzwonię, nikt nie odbiera."
        ru: "Каждый раз, когда я звоню, никто не отвечает."
        source: { kind: authored }
      - pl: "Ilekroć tam byłem, padało."
        ru: "Каждый раз, когда я там был, шёл дождь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Книжный союз времени: вводит придаточное и стоит в его начале, в отличие от bowiem." }
  - { kind: usage, text: "Собрано из ile «сколько» и -kroć «раз», старой формы, сохранившейся ещё в po wielekroć «многократно»." }
  - { kind: false-friend, text: "Не «иногда». ilekroć значит именно «каждый раз, когда», без исключений." }
  - { kind: government, text: "Не изменяется. В разговорной речи вместо него скажут za każdym razem, gdy." }
collocations:
  - { pl: "ilekroć go widzę", ru: "каждый раз, когда я его вижу" }
etymology: "ile «сколько» + -kroć «раз» (старая форма, ср. po wielekroć «многократно»)."
memory: "ilekroć — «каждый раз, когда». Книжный союз, открывающий придаточное. Разговорный вариант — za każdym razem, gdy."
