# review
id: uwzgledniac
format: 2
lemma: "uwzględniać"
rank: 6067
pos: verb
aspect: imperf
pron: { cyr: "увзглэ́дняць" }
senses:
  - id: take-into-account
    ru: "учитывать, принимать во внимание"
    examples:
      - pl: "Nasza strategia wojskowa nie uwzględnia współczesnych realiów."
        ru: "Наша военная стратегия не учитывает современных реалий."
        source: { kind: translated, id: 6406142 }
      - pl: "Cena nie uwzględnia kosztów dostawy."
        ru: "Цена не учитывает стоимости доставки."
        source: { kind: authored }
      - pl: "Musimy uwzględniać potrzeby wszystkich mieszkańców."
        ru: "Мы должны учитывать потребности всех жителей."
        source: { kind: authored }
  - id: include
    ru: "включать (в план, список), предусматривать"
    examples:
      - pl: "Nie uwzględniaj mnie w tym planie. Nie chcę się angażować."
        ru: "Не включай меня в этот план. Я не хочу ввязываться."
        source: { kind: translated, id: 591886 }
      - pl: "Budżet uwzględnia remont szkoły."
        ru: "Бюджет предусматривает ремонт школы."
        source: { kind: authored }
  - id: grant
    ru: "удовлетворять (просьбу, жалобу) — офиц."
    examples:
      - pl: "Sąd zwykle uwzględnia takie wnioski."
        ru: "Суд обычно удовлетворяет такие ходатайства."
        source: { kind: authored }
notes:
  - { kind: government, text: "Что — винительный, как в русском: uwzględniać koszty, opinię. С отрицанием — родительный: nie uwzględnia kosztów, «не учитывает расходов». Где — W + предложный: uwzględniać w planie, w budżecie, «включать в план, в бюджет» (русское «в» + винительный)." }
  - { kind: usage, text: "Несовершенный вид, пара — UWZGLĘDNIĆ: cena uwzględnia podatek, «цена включает налог», но uwzględniłem twoje uwagi, «я учёл твои замечания». В судебном и канцелярском языке UWZGLĘDNIĆ WNIOSEK, SKARGĘ — «удовлетворить ходатайство, жалобу». Причастие UWZGLĘDNIAJĄC в значении «с учётом» — очень частое: uwzględniając inflację, «с учётом инфляции»." }
  - { kind: pronunciation, text: "«увзглэ́дняць»: UW — «ув», ZGL — «згл», Ę перед D — «эн», но в сочетании ĘDN носовой почти пропадает: «-глэ́дн-». Ударение на предпоследнем слоге DNIA." }
  - { kind: register, text: "Книжно-деловое: отчёты, договоры, законы, научные тексты. В разговоре — BRAĆ POD UWAGĘ, «принимать во внимание», и LICZYĆ, «считать, включать»." }
collocations:
  - { pl: "uwzględniać potrzeby", ru: "учитывать потребности" }
  - { pl: "uwzględniając", ru: "с учётом" }
  - { pl: "uwzględniać w planie", ru: "включать в план" }
  - { pl: "uwzględnić wniosek", ru: "удовлетворить ходатайство" }
family:
  - { pl: "uwzględnić", ru: "учесть", relation: aspect }
  - { pl: "względ", ru: "отношение, соображение", relation: root, id: wzglad }
  - { pl: "uwzględnienie", ru: "учёт", relation: derived }
etymology: "От WZGLĄD, «взгляд; отношение, соображение», того же корня, что русское «взгляд», «оглядываться». UWZGLĘDNIAĆ — буквально «принимать во взгляд», то есть иметь в виду. Ср. русское «принимать во внимание» и польское BRAĆ POD UWAGĘ."
memory: "Uwzględniać — от wzgląd, «взгляд»: брать во взгляд, учитывать. Uwzględniając koszty — с учётом расходов. Пара — uwzględnić. В суде — удовлетворить жалобу."
idioms:
  - { pl: "uwzględniając powyższe", ru: "с учётом вышеизложенного (канц.)" }
