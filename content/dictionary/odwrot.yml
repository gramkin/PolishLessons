notes:
  - { kind: usage, text: "Два значения расходятся далеко, и объединяет их только образ поворота. Первое — военное и переносное: ODWRÓT WOJSK «отступление войск», ODWRÓT OD REFORM «отход от реформ». Второе — совершенно бытовое: NA ODWROCIE значит «на обороте», на обратной стороне листа, фотографии, открытки, и по-русски это именно «оборот», а не «отступление». Третье слово того же корня, ODWROTNIE, значит «наоборот, наизнанку», и его стоит держать рядом: ODWROTNIE NIŻ MYŚLAŁEM «наоборот, чем я думал»." }
  - { kind: pronunciation, text: "Читается «о́дврут», ударение на первом слоге из двух. Буква Ó даёт «у», поэтому не «одврот», а «о́дврут». И здесь карточка показывает правило в обратную сторону по сравнению с WĄTROBA: там O переходило в Ó, когда слог закрывался, здесь Ó стоит в именительном, потому что слог закрыт согласной T, а во всех косвенных падежах, где за ним идёт гласная, возвращается обычное O: ODWRÓT, но ODWROTU, ODWROTEM, ODWROCIE. Правило одно, просто видно его с другого конца." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: ZARZĄDZIŁ ODWRÓT. Родительный на -U: DO ODWROTU, BEZ ODWROTU. Местный на -IE с чередованием T в C: NA ODWROCIE, и это седьмой случай того же перехода после MONECIE, PASZPORCIE, TORCIE, KASECIE, INSTYNKCIE и FRONCIE. Отход от чего-то вводится предлогом OD с родительным: ODWRÓT OD DAWNEJ POLITYKI. При отрицании винительный уходит в родительный: NIE zarządził ODWROTU." }
  - { kind: false-friend, text: "Русского слова «отворот» в этом значении нет, и угадать польское не получится: русский скажет «отступление» в военном смысле и «оборот» в бумажном. Зато родственные слова прозрачны, если знать корень WRÓCIĆ «вернуть, повернуть»: ODWRÓCIĆ «отвернуть, перевернуть», ODWROTNY «обратный», POWRÓT «возвращение», WRÓCIĆ «вернуться». Все они об одном движении — повороте, — и ODWRÓT есть поворот назад, будь то войско или страница." }
collocations:
  - { pl: "na odwrocie", ru: "на обороте" }
  - { pl: "zarządzić odwrót", ru: "отдать приказ об отступлении" }
  - { pl: "odwrót od reform", ru: "отход от реформ" }
family:
  - { pl: "odwrotnie", ru: "наоборот, наизнанку", relation: derived }
  - { pl: "powrót", ru: "возвращение", relation: root, id: powrot }
  - { pl: "wrócić", ru: "вернуться", relation: root, id: wrocic }
etymology: "От глагола ODWRÓCIĆ «отвернуть, повернуть обратно», собранного из приставки OD- и корня WRÓT-, того же, что в WRÓCIĆ «вернуться» и POWRÓT «возвращение». Корень праславянский, *vort-, и в русском он дал «воротить», «возврат», «ворота», «поворот». То есть ODWRÓT буквально «поворот от», и оба польских значения выводятся прямо из этого: войско поворачивает назад, а страница поворачивается другой стороной. Русское «отступление» построено на другом образе, от «ступать», то есть на шаге, а не на повороте; русский «оборот» зато на повороте, и потому для второго значения русский и польский совпадают по образу, хотя и не по слову."
memory: "Два значения от одного образа поворота: отступление войск и «на обороте» листа — na odwrocie zdjęcia. Корень wrócić «вернуть», как в powrót. Ó стоит только в закрытом слоге: odwrót, но odwrotu, odwrocie — то же правило, что в wątroba и wątrób, видное с другого конца. В местном t переходит в c: odwrocie."
idioms:
  - { pl: "na odwrocie", ru: "на обороте" }
  - { pl: "odwrót od reform", ru: "отход от реформ" }
