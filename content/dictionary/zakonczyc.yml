    ru: "zakończyć się — закончиться"
    note: "Разницу между «закончить» и «закончиться» делает się."
    examples:
      - pl: "Mecz zakończył się."
        ru: "Матч закончился."
        source: { kind: tatoeba, id: 3657952 }
