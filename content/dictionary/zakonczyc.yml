        source: { kind: translated, id: 2482556 }
  - id: outcome
    ru: "zakończyć się CZYMŚ — закончиться чем-л. (творительный)"
    examples:
      - pl: "Wszystkie nasze próby zakończyły się niepowodzeniem."
        ru: "Все наши попытки закончились неудачей."
        source: { kind: translated, id: 6177477 }
      - pl: "Wszystko zakończyło się szczęśliwie."
        ru: "Всё закончилось счастливо."
        source: { kind: translated, id: 2981544 }
      - pl: "Bez twojej rady, moja próba zakończyłaby się fiaskiem."
        ru: "Без твоего совета моя попытка закончилась бы провалом."
        source: { kind: translated, id: 827745 }
notes:
  - { kind: usage, text: "Без się глагол переходный, с się — непереходный, ровно как русское -ся: Zakończyliśmy dyskusję «Мы закончили обсуждение», но Dyskusja się zakończyła «Обсуждение закончилось»." }
  - { kind: government, text: "zakończyć się CZYMŚ требует творительного падежа: zakończyć się sukcesem «закончиться успехом», zakończyć się niepowodzeniem «закончиться неудачей». Русский здесь ставит тот же падеж." }
  - { kind: usage, text: "Несовершенный вид — kończyć. Рядом живёт почти синоним skończyć «окончить»: skończyć szkołę «окончить школу»." }
  - { kind: usage, text: "Существительное zakończenie значит и «окончание», и «концовка, развязка»: szczęśliwe zakończenie «счастливый конец». Оборот na zakończenie — «в заключение»." }
collocations:
  - { pl: "zakończyć się sukcesem", ru: "закончиться успехом" }
  - { pl: "szczęśliwe zakończenie", ru: "счастливый конец" }
  - { pl: "zakończyć dyskusję", ru: "закончить обсуждение" }
  - { pl: "na zakończenie", ru: "в заключение" }
family:
  - { pl: "kończyć", ru: "кончать", relation: aspect }
  - { pl: "koniec", ru: "конец", relation: root }
  - { pl: "skończyć", ru: "окончить", relation: root }
  - { pl: "zakończenie", ru: "окончание", relation: derived }
etymology: "za- + koniec «конец» — та же сборка, что русское «за-кончить»."
memory: "zakończyć — «закончить», za- + koniec, ровно как русское «за-кончить». Разницу делает się: Zakończyliśmy dyskusję «Мы закончили обсуждение», но Dyskusja się zakończyła «Обсуждение закончилось». Управление совпадает с русским — zakończyć się sukcesem, творительный падеж. Несовершенный вид — kończyć."
