notes:
  - { kind: government, text: "Женский род: chrząstka, chrząstki, chrząstce. Множественное число обычное: chrząstki, chrząstek." }
  - { kind: usage, text: "Медицинское и бытовое значения те же, что у русского «хрящ»: chrząstka stawowa «суставной хрящ» и chrząstka w mięsie «хрящик в мясе»." }
  - { kind: usage, text: "Виды: chrząstka szklista «гиалиновый», włóknista «волокнистый», sprężysta «эластический»." }
  - { kind: pronunciation, text: "Сочетание chrz звучит как «хш»: хшо́нстка. Носовое ą перед st даёт «он»." }
