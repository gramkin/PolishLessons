etymology: "От того же корня, что chrzęst «хруст»: хрящ назван по звуку, который он издаёт. Русское «хрящ» — родственное слово с тем же праславянским корнем."
memory: "chrząstka — «хрящ», и в колене, и в котлете, как в русском. Корень тот же, что в chrzęst «хруст»: хрящ хрустит."
