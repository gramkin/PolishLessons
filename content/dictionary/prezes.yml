notes:
  - { kind: false-friend, text: "PREZES — это не президент. Это председатель: правления, клуба, общества, партии, а в быту — глава фирмы, то, что по-русски «гендиректор» или «председатель совета директоров». А вот PREZYDENT в польском значит и президента страны, и — что русского озадачивает сильнее всего — мэра крупного города: PREZYDENT WARSZAWY есть мэр Варшавы, а не глава государства. Русское «президент города» невозможно, польское совершенно обычно. Поэтому пара запоминается так: страна и большой город имеют PREZYDENTA, а фирма, клуб и правление — PREZESA." }
  - { kind: pronunciation, text: "Читается «прэ́зэс», ударение на первом слоге из двух. Оба E звучат «э» и не смягчают согласных: «прэ-зэс», а не «пре-зес». Конечное S глухое и короткое. В местном и звательном падеже PREZESIE согласная S смягчается перед -IE и звучит «сь»: «прэ́зэсе». В именительном множественного PREZESI смягчение то же: «прэ́зэси». Это обычное для мужско-личных существительных смягчение конечной согласной перед -I." }
  - { kind: government, text: "Мужской род одушевлённый, мужско-личный разряд. Винительный единственного равен родительному: WYBRANO PREZESA. Именительный множественного на -I со смягчением: PREZESI. Чего или кого возглавляет — родительный без предлога: PREZES ZARZĄDU «председатель правления», PREZES KLUBU, PREZES SĄDU «председатель суда». Обращение в звательном падеже обязательно и в деловой речи: PANIE PREZESIE «господин председатель», и это стандартная вежливая формула, которую надо узнавать на слух." }
  - { kind: register, text: "Слово официальное, из устава и визитной карточки, но в разговоре приобрело оттенок иронии: PREZES может прозвучать и как шутливое обращение к начальнику любого ранга. Женская форма PREZESKA в последние годы употребляется всё шире, хотя в документах по-прежнему пишут PANI PREZES, без изменения. Сокращение PREZ. встречается в списках и на табличках. Смежные должности стоит держать рядом: DYREKTOR «директор», KIEROWNIK «руководитель, завотделом», SZEF «шеф, начальник» в разговорном смысле." }
