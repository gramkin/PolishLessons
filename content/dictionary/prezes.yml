etymology: "Из латинского PRAESES «предстоящий, стоящий впереди», от PRAESIDERE: PRAE- «перед» и SEDERE «сидеть». То есть буквально это тот, кто сидит впереди, во главе стола — образ совершенно прозрачный и совпадающий с русским «председателем», которое есть калька того же латинского слова: «пред» плюс «седать». Так что PREZES и «председатель» — одно и то же понятие, собранное в одном языке заимствованием, в другом переводом по частям. От того же PRAESIDERE идут и PREZYDENT, и «президиум», и английское PRESIDENT, так что все эти слова — родня, разошедшаяся по должностям. Корень SEDERE виден и в польском SIEDZIEĆ, и в русском «сидеть»: он общий индоевропейский."
memory: "Не президент! prezes — председатель правления, клуба, глава фирмы. А prezydent — это и президент страны, и мэр большого города: prezydent Warszawy — мэр. Обращение в звательном: panie prezesie. Из латинского praeses «сидящий впереди» — то же, что русское «председатель», только калькой."
