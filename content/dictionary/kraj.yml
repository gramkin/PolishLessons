# review
id: kraj
format: 2
lemma: "kraj"
rank: 507
pos: noun
pron: { cyr: "край" }
senses:
  - id: country
    ru: "страна"
    examples:
      - pl: "Polska to duży kraj."
        ru: "Польша - большая страна."
        source: { kind: tatoeba, id: 5229065 }
      - pl: "Holandia to mały kraj."
        ru: "Голландия — маленькая страна."
        source: { kind: tatoeba, id: 355256 }
      - pl: "Z jakiego kraju jesteś?"
        ru: "Из какой ты страны?"
        source: { kind: tatoeba, id: 1245040 }
  - id: homeland
    ru: "родина, отечество; край (в поэтическом смысле)"
    examples:
      - pl: "Zdradziłeś swój kraj."
        ru: "Ты предал свою страну."
        source: { kind: tatoeba, id: 6694862 }
      - pl: "Cały kraj o tym mówi."
        ru: "Вся страна говорит об этом."
        source: { kind: tatoeba, id: 2378410 }
      - pl: "Wrócił do kraju po latach."
        ru: "Он вернулся на родину спустя годы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "kraj — это обычное польское слово для «страна», а не для русского «край» как области. Polska to duży kraj — «Польша — большая страна»." }
  - { kind: usage, text: "w kraju значит «на родине, внутри страны» и противопоставляется za granicą «за границей»." }
  - { kind: usage, text: "Поэтическое значение «край» сохранилось в оборотах: ciepłe kraje «тёплые края», na kraju świata «на краю света»." }
  - { kind: usage, text: "Внутри сидит krajać «резать»: край — это изначально «отрезанный кусок земли». Русское «край» — то же самое слово." }
collocations:
  - { pl: "obcy kraj", ru: "чужая страна" }
  - { pl: "w kraju", ru: "на родине" }
  - { pl: "ciepłe kraje", ru: "тёплые края" }
  - { pl: "rodzinny kraj", ru: "родная страна" }
etymology: "От krajać «резать», праславянское *krajь — «отрезанный кусок, край». Русское «край» — то же самое слово; польский сделал его обычным названием страны."
memory: "kraj — это русский «край», от того же корня, что krajać «резать»: изначально «отрезанный кусок земли». Только в польском это обычное слово для «страна»: Polska to duży kraj. Русское «край» в значении области так не переводится, зато ciepłe kraje — ровно «тёплые края», а moja chata z kraja — «моя хата с краю»."
idioms:
  - { pl: "moja chata z kraja", ru: "моя хата с краю" }
  - { pl: "ciepłe kraje", ru: "тёплые края" }
  - { pl: "kraj mlekiem i miodem płynący", ru: "страна, текущая молоком и мёдом" }
