# review
id: niezupelnie
format: 2
lemma: "niezupełnie"
rank: 3279
pos: adv
pron: { cyr: "незупэ́уне" }
senses:
  - id: not-quite
    ru: "не совсем"
    examples:
      - pl: "Niezupełnie się z tobą zgadzam."
        ru: "Я не совсем с тобой согласен."
        source: { kind: authored }
      - pl: "Jestem niezupełnie pewien."
        ru: "Я не совсем уверен."
        source: { kind: authored }
      - pl: "Stało się to niezupełnie tak, jak planowaliśmy."
        ru: "Всё вышло не совсем так, как мы планировали."
        source: { kind: authored }
  - id: reply
    ru: "не совсем (в ответе)"
    examples:
      - pl: "Skończyłeś? Niezupełnie, zostały mi dwie strony."
        ru: "Закончил? Не совсем, мне осталось две страницы."
        source: { kind: authored }
      - pl: "Niezupełnie, ale prawie."
        ru: "Не совсем, но почти."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NIEZUPEŁNIE — «не совсем», и пишется слитно, в отличие от русского. Польское правило: NIE с наречиями от прилагательных пишется вместе: NIEZUPEŁNIE, NIEDOBRZE, NIEDALEKO. ZUPEŁNIE — «совсем, полностью», от PEŁNY «полный»." }
  - { kind: usage, text: "Наречие, одна форма. Мягко выражает несогласие или неполноту: NIEZUPEŁNIE TAK, «не совсем так». Синонимы — NIE CAŁKIEM и NIE DO KOŃCA. В ответе на вопрос звучит вежливее, чем прямое NIE." }
  - { kind: government, text: "Наречие ничем не управляет. Оно ставится перед словом, которое смягчает: NIEZUPEŁNIE ROZUMIEM, NIEZUPEŁNIE GOTOWY." }
  - { kind: pronunciation, text: "Читается «незупэ́уне», ударение на предпоследнем слоге. Ł — краткое «у», PE — твёрдое «пэ», как в ZUPEŁNIE «зупэ́уне»." }
collocations:
  - { pl: "niezupełnie tak", ru: "не совсем так" }
  - { pl: "niezupełnie rozumiem", ru: "не совсем понимаю" }
  - { pl: "niezupełnie się zgadzam", ru: "не совсем согласен" }
family:
  - { pl: "zupełnie", ru: "совсем, полностью", relation: root, id: zupelnie }
  - { pl: "zupełny", ru: "полный, совершенный", relation: root }
  - { pl: "pełny", ru: "полный", relation: root, id: pelny }
etymology: "NIE + ZUPEŁNIE, от ZUPEŁNY «полный, совершенный», а то — от PEŁNY «полный». Польское EŁ на месте русского «ол»: PEŁNY — «полный»."
memory: "Niezupełnie — не совсем, пишется слитно. Читается «незупэ́уне». Niezupełnie tak — не совсем так. Zupełnie — совсем, от pełny «полный»."
idioms:
  - { pl: "nie do końca", ru: "не до конца, не совсем" }
formExamples:
  - form: "niezupełnie"
    pl: "To niezupełnie prawda."
    ru: "Это не совсем правда."
    source: { kind: authored }
  - form: "niezupełnie"
    pl: "Niezupełnie rozumiem, o co ci chodzi."
    ru: "Я не совсем понимаю, что ты имеешь в виду."
    source: { kind: authored }
  - form: "niezupełnie"
    pl: "Zupa jest niezupełnie gotowa."
    ru: "Суп ещё не совсем готов."
    source: { kind: authored }
