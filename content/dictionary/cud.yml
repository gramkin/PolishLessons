# review
id: cud
format: 2
lemma: "cud"
rank: 1052
pos: noun
pron: { cyr: "цут" }
senses:
  - id: miracle
    ru: "чудо (сверхъестественное)"
    examples:
      - pl: "Wiara czyni cuda!"
        ru: "Вера творит чудеса!"
        source: { kind: tatoeba, id: 1430399 }
      - pl: "To cud, że wyzdrowiał."
        ru: "Это чудо, что он выздоровел."
        source: { kind: translated, id: 744164 }
      - pl: "Wierzy się, że Chrystus dokonał wielu cudów."
        ru: "Считается, что Христос совершил много чудес."
        source: { kind: translated, id: 3239723 }
  - id: marvel
    ru: "чудо, диво (нечто необыкновенное)"
    examples:
      - pl: "Życie to niezliczona ilość cudów."
        ru: "Жизнь — это бесчисленное множество чудес."
        source: { kind: translated, id: 12312915 }
      - pl: "To lekarstwo zdziałało u niego cuda."
        ru: "Это лекарство сотворило с ним чудеса."
        source: { kind: translated, id: 945807 }
  - id: somehow
    ru: "jakimś cudem — каким-то чудом; jakim cudem? — как так вышло?"
    note: "Самый частый оборот со словом в разговорной речи."
    examples:
      - pl: "Gęś jakimś cudem przeżyła."
        ru: "Гусь каким-то чудом выжил."
        source: { kind: tatoeba, id: 7053595 }
      - pl: "Jakimś cudem znalazłem jego dom."
        ru: "Каким-то чудом я нашёл его дом."
        source: { kind: translated, id: 349302 }
      - pl: "Jakim cudem ty tego nie wiesz?"
        ru: "Как так вышло, что ты этого не знаешь?"
        source: { kind: translated, id: 521251 }
notes:
  - { kind: usage, text: "Множественное число — cuda, как русское «чудеса»: siedem cudów świata «семь чудес света». Форма cudy устарела." }
  - { kind: usage, text: "jakimś cudem «каким-то чудом» и разговорный вопрос jakim cudem? «как так вышло?»: Jakim cudem to zrobiłeś?" }
  - { kind: usage, text: "Мужской род: ten cud, а не «то чудо», как в русском. Отсюда и окончания: cudu, cudem, cudy нет — только cuda." }
  - { kind: false-friend, text: "cud — это «чудо», а не «чудак». Чудак по-польски — dziwak." }
collocations:
  - { pl: "czynić cuda", ru: "творить чудеса" }
  - { pl: "siedem cudów świata", ru: "семь чудес света" }
  - { pl: "jakimś cudem", ru: "каким-то чудом" }
  - { pl: "cud techniki", ru: "чудо техники" }
family:
  - { pl: "cudowny", ru: "чудесный, замечательный", relation: derived, id: cudowny }
  - { pl: "cudownie", ru: "чудесно", relation: derived }
  - { pl: "cudotwórca", ru: "чудотворец", relation: derived }
etymology: "Праславянское *čudo — то же слово, что русское «чудо». В польском оно потеряло конечный гласный и ушло в мужской род, тогда как русское «чудо» осталось средним."
memory: "cud — «чудо», но мужского рода: ten cud. Множественное — cuda «чудеса», не cudy. Главный оборот разговорной речи — jakimś cudem «каким-то чудом» и вопрос Jakim cudem? «как так вышло?»."
idioms:
  - { pl: "ósmy cud świata", ru: "восьмое чудо света" }
  - { pl: "cuda na kiju", ru: "золотые горы, небылицы" }
  - { pl: "jakim cudem?", ru: "как так вышло?, каким образом?" }
formExamplesSkip:
  - { form: "cudy", reason: "устаревший вариант множественного числа; нормой является cuda" }
