# review
id: bowiem
format: 2
lemma: "bowiem"
rank: 5492
pos: conj
pron: { cyr: "бо́вем" }
senses:
  - id: for
    ru: "ибо, ведь, потому что"
    examples:
      - pl: "Zawsze bowiem wysoko cenimy człowieka roztropnego."
        ru: "Ведь мы всегда высоко ценим рассудительного человека."
        source: { kind: translated, id: 12327735 }
      - pl: "Nie przyszedł, chory bowiem był."
        ru: "Он не пришёл, ибо был болен."
        source: { kind: authored }
      - pl: "Milczał, bowiem nie miał nic do dodania."
        ru: "Он молчал, ибо ему нечего было добавить."
        source: { kind: authored }
  - id: because
    ru: "поскольку (книжный союз причины)"
    examples:
      - pl: "Sprawa jest pilna, bowiem termin mija jutro."
        ru: "Дело срочное, поскольку срок истекает завтра."
        source: { kind: authored }
      - pl: "Wracamy, bowiem zrobiło się ciemno."
        ru: "Мы возвращаемся, поскольку стемнело."
        source: { kind: authored }
notes:
  - { kind: government, text: "Главная особенность — позиция: bowiem почти никогда не открывает придаточное, а стоит вторым или третьим словом внутри него: chory bowiem był. Русское «ибо» так не умеет." }
  - { kind: usage, text: "Книжный союз причины. В обычной речи — bo или ponieważ." }
  - { kind: usage, text: "Усиленный вариант — albowiem, ещё более книжный и почти исключительно библейский." }
  - { kind: false-friend, text: "Состоит из bo «потому что» и -wiem, старой частицы; со словом wiem «я знаю» связи нет." }
collocations:
  - { pl: "bowiem nie", ru: "ибо не" }
etymology: "bo «потому что» + старая частица -wiem; со словом wiem «я знаю» не связано."
memory: "bowiem — книжное «ибо, ведь». Главное отличие от русского: оно не открывает придаточное, а стоит внутри него вторым словом — chory bowiem był."
idioms:
  - { pl: "bowiem nie", ru: "ибо не" }
