notes:
  - { kind: false-friend, text: "РУССКОГО ГЛАГОЛА ЗДЕСЬ НЕТ, И ЭТО ГЛАВНОЕ. Польский взял латинское offerre и построил oferować, zaoferować, oferta; русский в этом месте обошёлся своим «предложить». Слово «оферта» в русском есть, но оно узкое и деловое, тогда как польская oferta совершенно обиходна: oferta pracy «предложение о работе», oferta specjalna «спецпредложение», w ofercie sklepu «в ассортименте магазина»." }
  - { kind: government, text: "Предлагают ЧТО КОМУ — винительный плюс дательный, как по-русски: zaoferować komuś pomoc, pracę, wyższą cenę. Расхождений нет. Можно и zaoferować się z pomocą «вызваться помочь», но этот оборот книжный." }
  - { kind: pronunciation, text: "МЕЖДУНАРОДНЫЕ ГЛАГОЛЫ ПОЛЬСКИЙ ПРИНИМАЕТ ОДИНАКОВО: латинский или французский корень плюс -ować, а настоящее время по правилу -uj-. Zorganizować даёт zorganizuję, zaoferować — zaoferuję, так же pracować — pracuję и dziękować — dziękuję. Зная окончание неопределённой формы, спряжение строить не нужно — оно одно на всю группу." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — oferować. Страдательное причастие zaoferowany употребляется широко, особенно в деловой речи: zaoferowane warunki, zaoferowana cena. Безличное zaoferowano — обычная формула протокола: zaoferowano nam trzy warianty." }
collocations:
  - { pl: "zaoferować pomoc", ru: "предложить помощь" }
  - { pl: "oferta pracy", ru: "предложение о работе" }
  - { pl: "zaoferować wyższą cenę", ru: "предложить более высокую цену" }
family:
  - { pl: "oferta", ru: "предложение", relation: root, id: oferta }
  - { pl: "oferować", ru: "предлагать", relation: aspect }
  - { pl: "proponować", ru: "предлагать", relation: derived }
etymology: "Приставка za- плюс oferować, от латинского offerre «подносить, предлагать», пришедшего через французский и немецкий. Русский этого глагола не принял и пользуется своим «предложить», так что родства между словами нет — есть только общий латинский источник, знакомый всякому, кто знает английское offer."
memory: "zaoferować — «предложить», от oferta. Русского родственника у глагола нет, запоминайте напрямую, зато управление родное: zaoferować komuś coś. И помните, что oferta по-польски слово будничное, а не деловой термин."
idioms:
  - { pl: "zaoferować komuś pomoc", ru: "предложить кому-л. помощь" }
  - { pl: "nie mam nic do zaoferowania", ru: "мне нечего предложить" }
