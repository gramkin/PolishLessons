# review
id: koniecznie
format: 2
lemma: "koniecznie"
rank: 4577
pos: adv
pron: { cyr: "коне́чне" }
senses:
  - id: necessarily
    ru: "обязательно, непременно"
    examples:
      - pl: "Przyjdź koniecznie!"
        ru: "Обязательно приходи!"
        source: { kind: translated, id: 8749619 }
      - pl: "Koniecznie tak zrobię."
        ru: "Я непременно так сделаю."
        source: { kind: translated, id: 675496 }
      - pl: "Koniecznie trzeba zdać."
        ru: "Сдать обязательно нужно."
        source: { kind: translated, id: 712436 }
  - id: not-necessarily
    ru: "обязательно (часто с отрицанием: nie koniecznie)"
    examples:
      - pl: "Nie musisz koniecznie odpowiadać."
        ru: "Тебе не обязательно отвечать."
        source: { kind: authored }
      - pl: "Koniecznie chciał nas zobaczyć."
        ru: "Он непременно хотел нас увидеть."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от konieczny «необходимый», который уже есть в словаре." }
  - { kind: false-friend, text: "Не «конечно»! Русское «конечно» — это oczywiście или jasne. koniecznie значит «обязательно, непременно». Это одна из самых частых ошибок русскоговорящих." }
  - { kind: government, text: "Не изменяется; сравнительной степени не имеет." }
  - { kind: usage, text: "Слитное niekoniecznie значит «не обязательно, не факт» и пишется одним словом." }
collocations:
  - { pl: "koniecznie trzeba", ru: "обязательно нужно" }
  - { pl: "niekoniecznie", ru: "не обязательно" }
etymology: "От konieczny «необходимый», от koniec «конец»: то, без чего дело не доходит до конца."
memory: "koniecznie — «обязательно, непременно», и это ложный друг: русское «конечно» будет oczywiście. Слитное niekoniecznie значит «не обязательно»."
idioms:
