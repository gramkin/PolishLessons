# review
id: wzruszony
format: 2
lemma: "wzruszony"
rank: 2162
pos: adj
pron: { cyr: "взрушо́ны" }
senses:
  - id: moved
    ru: "растроганный, взволнованный"
    examples:
      - pl: "Jestem wzruszony."
        ru: "Я растроган."
        source: { kind: translated, id: 5662039 }
      - pl: "Byłem wzruszony ich serdecznością."
        ru: "Я был растроган их сердечностью."
        source: { kind: translated, id: 956825 }
      - pl: "Była wzruszona tą opowieścią do łez."
        ru: "Она была растрогана этим рассказом до слёз."
        source: { kind: translated, id: 613071 }
  - id: touched
    ru: "тронутый (чьей-л. добротой, поступком)"
    examples:
      - pl: "Wszyscy goście byli wzruszeni jej gościnnością."
        ru: "Все гости были тронуты её гостеприимством."
        source: { kind: translated, id: 3565590 }
      - pl: "Wzruszona, z trudem ukrywała łzy."
        ru: "Растроганная, она с трудом скрывала слёзы."
        source: { kind: translated, id: 11646961 }
notes:
  - { kind: government, text: "Чем растроган — творительный падеж: wzruszony jej gościnnością «тронут её гостеприимством», как в русском." }
  - { kind: usage, text: "По форме это причастие от wzruszyć «растрогать», но в речи оно работает как обычное прилагательное и склоняется по родам: wzruszony, wzruszona, wzruszeni." }
  - { kind: false-friend, text: "Не «взрослый» и не «рушить». Корень ruszyć «двинуть»: растрогать — значит «сдвинуть» человека внутри, как русское «тронуть»." }
  - { kind: usage, text: "Существительное wzruszenie значит «волнение, растроганность»." }
collocations:
  - { pl: "wzruszony do łez", ru: "растроганный до слёз" }
etymology: "Причастие от wzruszyć «растрогать», от ruszyć «двинуть»; русское «тронуть» построено на том же образе движения."
memory: "wzruszony — «растроганный», по форме причастие от wzruszyć, но ведёт себя как прилагательное. Чем растроган — творительным падежом, как в русском."
