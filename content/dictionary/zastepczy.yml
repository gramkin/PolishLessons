etymology: "От ZASTĘPOWAĆ «замещать», от приставки ZA- и корня STĄP-, того же, что в STĄPIĆ «ступить» и в русских «ступать», «заступать». Чередование носовых Ą и Ę внутри гнезда обычное: ZASTĄPIĆ, но ZASTĘPOWAĆ и ZASTĘPCZY, ровно как WSTĄPIĆ при WSTĘP и WSTĘPNY. Русский для той же мысли взял корень «мест»: «заместитель», «замещать». Образ в обоих случаях один, место другого занимает кто-то иной."
memory: "Корень тот же, что в «ступать» и «заступать», и чередование носовых такое же, как в wstąpić — wstęp: zastąpić, но zastępczy. Но значения сдвинуты: zastępca это «заместитель», а не «заступник» (тот будет obrońca), а rodzina zastępcza это «приёмная семья», а не «запасная». Форм десять, основа на -czy слила мужско-личную форму. Читается «засте́мпчы»: ę перед p даёт «эм»."
idioms:
