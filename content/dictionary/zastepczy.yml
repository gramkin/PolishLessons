notes:
  - { kind: false-friend, text: "Существительное того же корня ставит ловушку: ZASTĘPCA это «заместитель», а не «заступник». Русский «заступник» по-польски OBROŃCA. Прилагательное тоже требует осторожности: RODZINA ZASTĘPCZA это «приёмная семья», а не «запасная», запасная была бы ZAPASOWA. Образ в основе один: тот, кто заступает на место другого, и русское «заместитель» построено по той же мысли, только от «места», а не от «ступи»." }
  - { kind: usage, text: "Десять форм, а не одиннадцать: твёрдая основа на -CZY слила мужскую форму единственного числа с мужско-личной множественного, ровно как в LOTNICZY и ŚLEDCZY. Степеней сравнения нет, прилагательное относительное. В обороте RODZINA ZASTĘPCZA оно образует устойчивый термин детского права, и от него же идёт RODZIC ZASTĘPCZY «приёмный родитель», совершенно обиходное слово в Польше." }
  - { kind: government, text: "В приёмной семье — предлог W с местным падежом: W RODZINIE ZASTĘPCZEJ. Стать приёмным родителем — ZOSTAĆ с творительным: ZOSTAĆ RODZICEM ZASTĘPCZYM. Пройти альтернативную службу — ODBYĆ SŁUŻBĘ ZASTĘPCZĄ, винительный без предлога. Прилагательное в этих терминах неизменно стоит после существительного: MATKA ZASTĘPCZA, MIESZKANIE ZASTĘPCZE." }
  - { kind: pronunciation, text: "Читается «засте́мпчы», три слога, ударение на втором. Носовое Ę перед губным P даёт «эм», а не «эн», поэтому середина звучит «тэмп»: то же правило, что в WSTĘPNY «фстэ́мпны» и ZĘBY «зэмбы». Дальше CZ даёт «ч», а Y даёт «ы», и конец слова звучит «чы». Родственное ZASTĄPIĆ произносится «засто́мпиць», с «ом» вместо «эм», потому что там стоит Ą." }
  - { kind: register, text: "Слово официальное, из языка социальных служб и права: RODZINA ZASTĘPCZA «приёмная семья», RODZIC ZASTĘPCZY, PIECZA ZASTĘPCZA «замещающая опека», MATKA ZASTĘPCZA «суррогатная мать», SŁUŻBA ZASTĘPCZA «альтернативная служба». В обычной речи оно звучит в смысле «временный, на замену»: ROZWIĄZANIE ZASTĘPCZE, MIESZKANIE ZASTĘPCZE, которое выдают погорельцам или при сносе дома." }
