notes:
  - { kind: false-friend, text: "METRO — «метро», но в отличие от русского склоняется: METRA, METRU, METREM, W METRZE. Не путайте с METR — «метр»: формы METRA, METRZE совпадают, значение — по контексту." }
  - { kind: usage, text: "Средний род. Учим единственное: METRO, METRA, METRU, METREM, METRZE. Множественное число почти не используется." }
  - { kind: government, text: "Ехать на метро — JECHAĆ METREM, творительный без предлога. В метро — W METRZE, местный. Из метро — Z METRA, родительный." }
  - { kind: pronunciation, text: "Читается «мэ́тро»: ME — твёрдое «мэ». Ударение на первом слоге. METRZE — «мэ́тшэ»." }
collocations:
  - { pl: "jechać metrem", ru: "ехать на метро" }
