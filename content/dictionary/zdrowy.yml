formExamples:
  - form: "zdrowa"
    pl: "Jestem zdrowa."
    ru: "Я здорова."
    source: { kind: tatoeba, id: 12625717 }
  - form: "zdrowa"
    pl: "Jest młoda i zdrowa."
    ru: "Она молодая и здоровая."
    source: { kind: translated, id: 3427209 }
  - form: "zdrowa"
    pl: "Jestem zdrowa jak ryba."
    ru: "Я здорова как бык."
    source: { kind: translated, id: 4414186 }
  - form: "zdrowa"
    pl: "Na świat przyszła zdrowa dziewczynka."
    ru: "На свет появилась здоровая девочка."
    source: { kind: translated, id: 5585103 }
  - form: "zdrową"
    pl: "Wygląda na zdrową."
    ru: "Она выглядит здоровой."
    source: { kind: translated, id: 525519 }
  - form: "zdrową"
    pl: "Jej twarz miała zdrową karnację."
    ru: "У её лица был здоровый цвет."
    source: { kind: translated, id: 735810 }
  - form: "zdrową"
    pl: "Wyrobił sobie zdrową kondycję dzięki pływaniu."
    ru: "Он набрал хорошую форму благодаря плаванию."
    source: { kind: translated, id: 739266 }
  - form: "zdrowe"
    pl: "Owoce są zdrowe."
    ru: "Фрукты полезны."
    source: { kind: translated, id: 13713050 }
  - form: "zdrowe"
    pl: "Warzywa są zdrowe."
    ru: "Овощи полезны."
    source: { kind: translated, id: 5320114 }
  - form: "zdrowe"
    pl: "Bieganie jest zdrowe."
    ru: "Бег полезен."
    source: { kind: translated, id: 7868975 }
  - form: "zdrowe"
    pl: "Urodziła zdrowe dziecko."
    ru: "Она родила здорового ребёнка."
    source: { kind: translated, id: 352139 }
  - form: "zdrowego"
    pl: "Używam zdrowego rozsądku."
    ru: "Я пользуюсь здравым смыслом."
    source: { kind: translated, id: 7610539 }
  - form: "zdrowego"
    pl: "Brakuje mu zdrowego rozsądku."
    ru: "Ему не хватает здравого смысла."
    source: { kind: translated, id: 737280 }
  - form: "zdrowego"
    pl: "Wygląda na zdrowego."
    ru: "Он выглядит здоровым."
    source: { kind: translated, id: 10605228 }
  - form: "zdrowego"
    pl: "Doświadczenie nauczy cię zdrowego rozsądku."
    ru: "Опыт научит тебя здравому смыслу."
    source: { kind: translated, id: 7610543 }
  - form: "zdrowej"
    pl: "Nasza szkoła położona jest w zdrowej okolicy."
    ru: "Наша школа расположена в здоровой местности."
    source: { kind: translated, id: 351377 }
  - form: "zdrowej"
    pl: "Tłuszcze nienasycone są niezbędne w zdrowej diecie."
    ru: "Ненасыщенные жиры необходимы в здоровом питании."
    source: { kind: translated, id: 1351739 }
  - form: "zdrowej"
    pl: "Mój dwulatek nie chce jeść zdrowej żywności, którą próbuję go karmić."
    ru: "Мой двухлетний сын не хочет есть здоровую еду, которой я пытаюсь его кормить."
    source: { kind: translated, id: 997612 }
  - form: "zdrowi"
    pl: "Są młodzi i zdrowi."
    ru: "Они молодые и здоровые."
    source: { kind: translated, id: 3452686 }
  - form: "zdrowi"
    pl: "Jak w domu? Wszyscy zdrowi?"
    ru: "Как дома? Все здоровы?"
    source: { kind: translated, id: 736769 }
  - form: "zdrowi"
    pl: "Oni powiedzieli, że są zdrowi."
    ru: "Они сказали, что здоровы."
    source: { kind: translated, id: 7977905 }
  - form: "zdrowi"
    pl: "Zdrowi i chorzy nie myślą tak samo."
    ru: "Здоровые и больные думают по-разному."
    source: { kind: translated, id: 4730353 }
  - form: "zdrowsze"
    pl: "On je teraz zdrowsze jedzenie."
    ru: "Он теперь ест более здоровую пищу."
    source: { kind: translated, id: 12956387 }
  - form: "zdrowsze"
    pl: "Lekarze twierdzą, że dzieci karmione piersią zwykle są zdrowsze."
    ru: "Врачи утверждают, что дети на грудном вскармливании обычно здоровее."
    source: { kind: translated, id: 7179959 }
  - form: "zdrowsze"
    pl: "Niektórzy uważają, że jedzenie w domu jest zdrowsze niż na mieście."
    ru: "Некоторые считают, что домашняя еда полезнее, чем в городе."
    source: { kind: translated, id: 1000600 }
  - form: "zdrowszy"
    pl: "Gdybyś jadł mniej hamburgerów, pewnie byłbyś zdrowszy."
    ru: "Если бы ты ел меньше гамбургеров, то, возможно, был бы здоровее."
    source: { kind: tatoeba, id: 976193 }
  - form: "zdrowszy"
    pl: "Który rodzaj ryby jest zdrowszy: ryba morska czy słodkowodna?"
    ru: "Какая рыба полезнее: морская или пресноводная?"
    source: { kind: tatoeba, id: 13006901 }
  - form: "zdrowszy"
    pl: "Jesteś młodszy, zdrowszy i silniejszy. Możesz to zrobić."
    ru: "Ты моложе, здоровее и сильнее. Ты можешь это сделать."
    source: { kind: translated, id: 5969991 }
  - form: "zdrowych"
    pl: "Zakładników uwolniono całych i zdrowych."
    ru: "Заложников освободили целыми и невредимыми."
    source: { kind: translated, id: 728421 }
  - form: "zdrowych"
    pl: "Szukamy zdrowych ochotników do badania."
    ru: "Мы ищем здоровых добровольцев для исследования."
    source: { kind: authored }
  - form: "zdrowych"
    pl: "Nie ma tu zdrowych drzew."
    ru: "Здоровых деревьев тут нет."
    source: { kind: authored }
  - form: "zdrowym"
    pl: "Byłem zdrowym dzieckiem."
    ru: "Я был здоровым ребёнком."
    source: { kind: translated, id: 933025 }
  - form: "zdrowym"
    pl: "W zdrowym ciele zdrowy duch."
    ru: "В здоровом теле здоровый дух."
    source: { kind: translated, id: 502053 }
  - form: "zdrowym"
    pl: "Ona dała mu radę, co ma zrobić żeby pozostać zdrowym."
    ru: "Она посоветовала ему, что делать, чтобы оставаться здоровым."
    source: { kind: translated, id: 2189388 }
  - form: "zdrowym"
    pl: "Nikt przy zdrowym umyśle nie będzie chodził po tym lesie w nocy."
    ru: "Никто в здравом уме не пойдёт ночью по этому лесу."
    source: { kind: translated, id: 3031581 }
  - form: "zdrów"
    pl: "Bądź zdrów!"
    ru: "Будь здоров!"
    source: { kind: tatoeba, id: 1866778 }
  - form: "zdrów"
    pl: "Bywaj zdrów!"
    ru: "Бывай здоров!"
    source: { kind: translated, id: 7264461 }
  - form: "zdrów"
    pl: "Ostatniego lata był zdrów."
    ru: "Прошлым летом он был здоров."
    source: { kind: translated, id: 927125 }
  - form: "zdrów"
    pl: "Tom wydaje się być zdrów jak ryba."
    ru: "Том, кажется, здоров как бык."
    source: { kind: translated, id: 4414188 }
