# review
id: zdrowy
format: 2
lemma: "zdrowy"
rank: 1219
pos: adj
pron: { cyr: "здро́вы" }
senses:
  - id: healthy
    ru: "здоровый (о человеке)"
    examples:
      - pl: "Jestem zdrowy."
        ru: "Я здоров."
        source: { kind: tatoeba, id: 525035 }
      - pl: "Jestem zdrowa."
        ru: "Я здорова."
        source: { kind: tatoeba, id: 12625717 }
      - pl: "Zawsze byłem zdrowy."
        ru: "Я всегда был здоров."
        source: { kind: tatoeba, id: 12297633 }
  - id: good-for-you
    ru: "полезный для здоровья (о еде, занятиях)"
    examples:
      - pl: "Owoce są zdrowe."
        ru: "Фрукты полезны."
        source: { kind: translated, id: 13713050 }
      - pl: "Warzywa są zdrowe."
        ru: "Овощи полезны."
        source: { kind: translated, id: 5320114 }
      - pl: "Bieganie jest zdrowe."
        ru: "Бег полезен."
        source: { kind: translated, id: 7868975 }
  - id: common-sense
    ru: "zdrowy rozsądek — здравый смысл"
    examples:
      - pl: "Miejmy nadzieję, że tym razem zdrowy rozsądek zwycięży."
        ru: "Будем надеяться, в этот раз здравый смысл восторжествует."
        source: { kind: tatoeba, id: 7610546 }
      - pl: "Używam zdrowego rozsądku."
        ru: "Я пользуюсь здравым смыслом."
        source: { kind: translated, id: 7610539 }
      - pl: "Brakuje mu zdrowego rozsądku."
        ru: "Ему не хватает здравого смысла."
        source: { kind: translated, id: 737280 }
notes:
  - { kind: false-friend, text: "Zdrowy значит и «здоровый» (о человеке), и «полезный» (о еде): Warzywa są zdrowe — это «овощи полезны», а не «овощи здоровы»." }
  - { kind: usage, text: "Короткая форма zdrów осталась в устойчивых пожеланиях: Bądź zdrów! «Будь здоров!», zdrów jak ryba «здоров как бык», буквально «как рыба»." }
  - { kind: usage, text: "Zdrowy rozsądek «здравый смысл» — одно из самых частых сочетаний. Сравнительная степень — zdrowszy." }
  - { kind: pronunciation, text: "Начальное zdr- произносится слитно, без гласного между з и д: здро́вы." }
collocations:
  - { pl: "zdrowy rozsądek", ru: "здравый смысл" }
  - { pl: "zdrowe jedzenie", ru: "здоровая еда" }
  - { pl: "cały i zdrowy", ru: "цел и невредим" }
  - { pl: "bądź zdrów", ru: "будь здоров" }
etymology: "Праславянское *sъdorvъ — то же слово, что русское «здоровый». Приставка *sъ- «хорошо» и *dorvo «дерево»: буквально «из хорошего дерева»."
memory: "zdrowy — «здоровый», но ещё и «полезный»: Warzywa są zdrowe «Овощи полезны». Короткая форма zdrów осталась в пожеланиях: Bądź zdrów! И запомните zdrowy rozsądek «здравый смысл»."
idioms:
  - { pl: "zdrowy rozsądek", ru: "здравый смысл" }
  - { pl: "cały i zdrowy", ru: "цел и невредим" }
  - { pl: "zdrów jak ryba", ru: "здоров как бык" }
