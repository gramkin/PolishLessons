# review
id: gowno
format: 2
lemma: "gówno"
rank: 597
pos: noun
pron: { cyr: "гу́вно" }
senses:
  - id: excrement
    ru: "говно, дерьмо (буквально)"
    examples:
      - pl: "Gówno śmierdzi."
        ru: "Говно воняет."
        source: { kind: translated, id: 1348589 }
      - pl: "Wdepnął w psie gówno."
        ru: "Он вляпался в собачье дерьмо."
        source: { kind: translated, id: 11254019 }
      - pl: "Nie chcę czyścić psiego gówna."
        ru: "Я не хочу убирать собачье дерьмо."
        source: { kind: translated, id: 524042 }
  - id: worthless
    ru: "дрянь, ерунда; ничто"
    examples:
      - pl: "Gówno."
        ru: "Дерьмо."
        source: { kind: translated, id: 10565687 }
      - pl: "Gówno prawda."
        ru: "Ни фига подобного."
        source: { kind: translated, id: 6160557 }
      - pl: "Jak pozbyć się tego gówna?"
        ru: "Как избавиться от этого дерьма?"
        source: { kind: translated, id: 6154948 }
notes:
  - { kind: register, text: "Вульгарное слово, грубое. Прямой эквивалент русского «говно» — и по силе, и по употреблению. В приличной речи заменяется на kupa или odchody." }
  - { kind: usage, text: "Оборот gówno prawda значит «ни фига подобного», буквально «говно-правда» — распространённое возражение." }
  - { kind: usage, text: "Второе значение, как и в русском, — «дрянь, ерунда»: To jest gówno warte «Это ни черта не стоит»." }
collocations:
  - { pl: "gówno prawda", ru: "ни фига подобного" }
  - { pl: "psie gówno", ru: "собачье дерьмо" }
  - { pl: "gówno mnie to obchodzi", ru: "мне на это плевать" }
etymology: "Праславянское *govьno. Русское «говно» — то же самое слово, с тем же значением и той же грубостью."
memory: "gówno — «говно», настолько же грубо, как по-русски. Запомните gówno prawda «ни фига подобного»."
idioms:
  - { pl: "gówno prawda", ru: "ни фига подобного" }
  - { pl: "psie gówno", ru: "собачье дерьмо" }
  - { pl: "siedzieć po uszy w gównie", ru: "сидеть по уши в дерьме" }
