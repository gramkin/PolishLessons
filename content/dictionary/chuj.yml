# review
id: chuj
format: 2
lemma: "chuj"
rank: 1605
pos: noun
pron: { cyr: "хуй" }
senses:
  - id: vulgar
    ru: "самое грубое ругательство польского языка"
    examples:
      - pl: "A chuj ci do tego."
        ru: "А тебе какое дело."
        source: { kind: translated, id: 13781642 }
      - pl: "Chuj to najmocniejsze polskie przekleństwo."
        ru: "Chuj — самое сильное польское ругательство."
        source: { kind: authored }
      - pl: "W grzecznej rozmowie słowo chuj nie pada nigdy."
        ru: "В вежливом разговоре слово chuj не звучит никогда."
        source: { kind: authored }
      - pl: "Chuj wie, co się właściwie stało."
        ru: "Хрен знает, что там на самом деле случилось."
        source: { kind: authored }
      - pl: "Powiedział chuj i wszyscy zamilkli."
        ru: "Он сказал chuj, и все замолчали."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово стоит в словаре потому, что его слышно повсюду, а не для того, чтобы его употреблять: это самое грубое ругательство польского. Примеры намеренно даны со стороны — о персонажах книг и фильмов, о цензуре в газете, о трудностях перевода. Звательная форма chuju в примерах не используется: в обращении это уже прямое оскорбление." }
  - { kind: register, text: "Самое грубое слово польского языка, вульгарное в высшей степени, точный аналог русского мата. В любом публичном или вежливом контексте неприемлемо; в словаре оно нужно лишь для того, чтобы понимать чужую речь." }
  - { kind: usage, text: "Прямое значение анатомическое, но в живой речи слово работает прежде всего как ругательство и как основа множества оборотов." }
  - { kind: usage, text: "A chuj ci do tego значит «а тебе какое дело», chuj wie — «хрен знает», chuj z tym — «да и хрен с ним»." }
collocations:
  - { pl: "chuj ci do tego", ru: "не твоё дело" }
  - { pl: "chuj wie", ru: "хрен знает" }
  - { pl: "chuj z tym", ru: "да и хрен с ним" }
etymology: "Праславянское *xujь. Русское однокоренное слово — то же самое и по форме, и по значению, и по степени грубости."
memory: "chuj — самое сильное польское ругательство, точный аналог русского мата. Из оборотов запомните A chuj ci do tego «А тебе какое дело» и chuj wie «хрен знает»."
idioms:
