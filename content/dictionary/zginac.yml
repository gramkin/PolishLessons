# review
id: zginac
format: 2
lemma: "zginąć"
rank: 410
pos: verb
aspect: perf
pron: { cyr: "зги́ноньць" }
senses:
  - id: perish
    ru: "погибнуть"
    examples:
      - pl: "Tom zginął w październiku."
        ru: "Том погиб в октябре."
        source: { kind: tatoeba, id: 10602879 }
      - pl: "Nasz syn zginął na wojnie."
        ru: "Наш сын погиб на войне."
        source: { kind: tatoeba, id: 364730 }
      - pl: "Jego jedyny syn zginął w wypadku samochodowym."
        ru: "Его единственный сын погиб в автокатастрофе."
        source: { kind: tatoeba, id: 1350352 }
  - id: go-missing
    ru: "пропасть, потеряться (о вещах)"
    examples:
      - pl: "Zginęły mi klucze."
        ru: "У меня пропали ключи."
        source: { kind: authored }
      - pl: "Gdzieś zginął mój telefon."
        ru: "Где-то пропал мой телефон."
        source: { kind: authored }
      - pl: "Zginął bez śladu."
        ru: "Он пропал без следа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «сгинуть» — то же самое слово, но в польском оно совершенно нейтральное и обиходное: zginął na wojnie «погиб на войне», без всякой грубости." }
  - { kind: usage, text: "Второе значение — «пропасть, потеряться», о вещах: Zginęły mi klucze «У меня пропали ключи»." }
  - { kind: usage, text: "Прошедшее время чередует носовые: zginął в мужском роде, но zginęła в женском — как у всех глаголов на -nąć." }
  - { kind: usage, text: "Несовершенный вид — ginąć. Резкое Zgiń! отвечает русскому «Сгинь!»" }
collocations:
  - { pl: "zginąć na wojnie", ru: "погибнуть на войне" }
  - { pl: "zginąć bez śladu", ru: "пропасть без следа" }
  - { pl: "zginąć w wypadku", ru: "погибнуть в аварии" }
etymology: "Из z- + ginąć, праславянское *gybnǫti; русские «гибнуть», «погибнуть» и «сгинуть» — то же самое гнездо."
memory: "zginąć — «погибнуть», и русское «сгинуть» это буквально то же слово, только в польском оно совершенно обиходное. Второе значение — «пропасть»: Zginęły mi klucze. Прошедшее чередует носовые: zginął (он) — zginęła (она)."
idioms:
  - { pl: "chcącego zginąć nikt nie ustrzeże", ru: "кто хочет погибнуть, того не убережёшь" }
  - { pl: "zginąć bez śladu", ru: "пропасть без следа" }
  - { pl: "zgiń, przepadnij!", ru: "сгинь, пропади!" }
