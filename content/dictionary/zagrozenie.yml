notes:
  - { kind: false-friend, text: "ZAGROŻENIE — «угроза, опасность», от GROZIĆ «грозить», а не «загорожение». Устная угроза, запугивание — GROŹBA. ZAGROŻONY — «находящийся под угрозой»: GATUNEK ZAGROŻONY, «вымирающий вид»." }
  - { kind: usage, text: "Восемь форм, средний род на -ENIE. Родительный множественного — ZAGROŻEŃ. Местный — W ZAGROŻENIU." }
  - { kind: government, text: "Угроза для кого — ZAGROŻENIE DLA, и родительный. Представлять угрозу — STANOWIĆ ZAGROŻENIE, винительный. Под угрозой — W STANIE ZAGROŻENIA." }
  - { kind: pronunciation, text: "Читается «загроже́не», ударение на предпоследнем слоге. Ż — «ж», NIE — «не»." }
collocations:
  - { pl: "stanowić zagrożenie", ru: "представлять угрозу" }
  - { pl: "zagrożenie dla zdrowia", ru: "угроза здоровью" }
  - { pl: "stan zagrożenia", ru: "режим чрезвычайной ситуации" }
family:
  - { pl: "grozić", ru: "грозить", relation: root, id: grozic }
  - { pl: "groźba", ru: "угроза (словесная)", relation: root, id: grozba }
  - { pl: "zagrożony", ru: "находящийся под угрозой", relation: derived }
etymology: "От ZAGROZIĆ «пригрозить», а то — от GROZIĆ «грозить». Корень тот же, что в русских «гроза», «грозить». Z переходит в Ż: GROZIĆ, ZAGROŻENIE."
memory: "Zagrożenie — угроза, опасность; groźba — словесная угроза. Читается «загроже́не». Stanowić zagrożenie — представлять угрозу."
idioms:
