        source: { kind: authored }
notes:
  - { kind: usage, text: "Шестьдесят три формы — несовершенный переходный, последняя и самая полная клетка таблицы из карточки PRZYŁĄCZYĆ. У слова есть совершенная пара UŁOŻYĆ, и она попадает в соседнюю клетку с пятьюдесятью тремя формами. Получается удобный случай увидеть всю систему на одном корне: układać с действительным и страдательным причастиями сразу, ułożyć только со страдательным и деепричастием на -wszy. Разница в десять форм — это ровно действительное причастие, которого у совершенного вида не бывает." }
  - { kind: usage, text: "Корень у слова русскому знаком, хотя и не сразу. ŁAD значит «порядок, лад», и от него идёт UKŁAD, а układać буквально значит «приводить в порядок, укладывать». Русские «лад», «ладно», «уклад» и «укладывать» — та же семья. Заметьте, насколько шире польское UKŁAD: это и «система» (układ nerwowy «нервная система», układ scalony «микросхема»), и «договор» (układ o współpracy), и «расположение» (układ mebli). Русский «уклад» сузился до образа жизни, так что переводить układ им почти всегда неверно." }
  - { kind: usage, text: "Русский разносит это слово по четырём глаголам, и выбор подсказывает дополнение. UKŁADAĆ KLOCKI — «складывать кубики», UKŁADAĆ KOSTKĘ — «укладывать плитку», UKŁADAĆ PLAN — «составлять план», UKŁADAĆ WIERSZE — «сочинять стихи». Одно польское слово на все эти работы, и общий смысл у них один: приводить части в порядок." }
  - { kind: government, text: "С частицей SIĘ глагол значит «складываться, налаживаться», и выражение WSZYSTKO SIĘ UKŁADA — одно из самых употребительных в языке: «всё налаживается». Говорят и UKŁADA MI SIĘ W PRACY «на работе у меня всё складывается», и NIE UKŁADA IM SIĘ «у них не ладится» — последнее особенно часто об отношениях. Русское «ладиться» от того же корня и значит почти то же, так что здесь родство работает в полную силу." }
collocations:
  - { pl: "układać plan", ru: "составлять план" }
  - { pl: "układać klocki", ru: "складывать кубики" }
  - { pl: "wszystko się układa", ru: "всё налаживается" }
family:
  - { pl: "ład", ru: "порядок, лад", relation: root }
  - { pl: "układ", ru: "система, устройство", relation: derived, id: uklad }
  - { pl: "ułożyć", ru: "сложить, уложить", relation: aspect, id: ulozyc }
etymology: "Приставка u- и KŁADAĆ, от KŁAŚĆ «класть», из праславянского *klasti — того же корня, что русское «класть» и «кладь». Рядом стоит существительное ŁAD «порядок», с которым глагол сблизился по смыслу настолько, что układać значит именно приведение в порядок. Русские однокоренные — «укладывать», «уклад», «ладно», «ладиться», — и все они о порядке и складности, так что гнездо узнаётся целиком."
memory: "Шестьдесят три формы: несовершенный переходный, оба причастия. Пара — ułożyć с пятьюдесятью тремя. Корень тот же, что в «укладывать» и «ладиться», а układ значит ещё «система» и «договор»."
idioms:
  - { pl: "wszystko się układa", ru: "всё налаживается" }
  - { pl: "układać plan", ru: "составлять план" }
