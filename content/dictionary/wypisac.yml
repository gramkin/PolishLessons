# review
id: wypisac
format: 2
lemma: "wypisać"
rank: 4079
pos: verb
pron: { cyr: "выпи́саць" }
senses:
  - id: write-out
    ru: "выписать (рецепт, счёт, документ)"
    examples:
      - pl: "Lekarz wypisał mi receptę."
        ru: "Врач выписал мне рецепт."
        source: { kind: authored }
      - pl: "Wypisz fakturę na firmę."
        ru: "Выпиши счёт-фактуру на фирму."
        source: { kind: authored }
      - pl: "Wypisała wszystkie słówka z tekstu."
        ru: "Она выписала все слова из текста."
        source: { kind: authored }
  - id: discharge
    ru: "выписать (из больницы); отписаться, выйти (wypisać się)"
    examples:
      - pl: "Jutro wypiszą go ze szpitala."
        ru: "Завтра его выпишут из больницы."
        source: { kind: authored }
      - pl: "Wypisałem się z newslettera."
        ru: "Я отписался от рассылки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYPISAĆ похоже на «выписать журнал» — подписаться, но по-польски наоборот: WYPISAĆ SIĘ — «отписаться, выйти»: WYPISAĆ SIĘ Z KLUBU, Z NEWSLETTERA. Подписаться — ZAPISAĆ SIĘ или ZAPRENUMEROWAĆ. Из больницы — WYPISAĆ, как по-русски. DŁUGOPIS SIĘ WYPISAŁ — «ручка исписалась»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное WYPISANY и деепричастие WYPISAWSZY. Чередование S → SZ: WYPISAĆ, но WYPISZĘ, WYPISZ. Видовой партнёр — WYPISYWAĆ. WYPIS — «выписка»: WYPIS ZE SZPITALA." }
  - { kind: government, text: "Что — винительный, кому — дательный: WYPISAĆ KOMUŚ RECEPTĘ. Откуда — Z с родительным: WYPISAĆ ZE SZPITALA, ZE SZKOŁY. Выписаться из чего — WYPISAĆ SIĘ Z: Z KURSU, Z PARTII." }
  - { kind: pronunciation, text: "Читается «выпи́саць», три слога, ударение на предпоследнем. Y — «ы», S твёрдое, конечное Ć — «ць». Будущее WYPISZĘ — «выпи́шэ», с твёрдым «ш»." }
  - { kind: register, text: "Нейтральное слово больниц, школ и учреждений. WYPISAĆ SIĘ — разговорное «выйти из чего-то, бросить»: WYPISUJĘ SIĘ Z TEGO, «я в этом не участвую». Приказное WYPISZ MI TO — «выпиши мне это»." }
collocations:
  - { pl: "wypisać receptę", ru: "выписать рецепт" }
  - { pl: "wypisać ze szpitala", ru: "выписать из больницы" }
  - { pl: "wypisać się z kursu", ru: "выйти с курса, отписаться" }
family:
  - { pl: "wypisywać", ru: "выписывать", relation: aspect }
  - { pl: "pisać", ru: "писать", relation: root, id: pisac }
  - { pl: "zapisać", ru: "записать", relation: root, id: zapisac }
etymology: "Приставка WY- «вы-» плюс PISAĆ «писать». Значение «отписаться» — от «вычеркнуть себя из списка», противоположное ZAPISAĆ SIĘ, «записаться»."
memory: "Wypisać — выписать: receptę, fakturę, ze szpitala. Wypisać się — отписаться, выйти! Подписаться — zapisać się. Długopis się wypisał — ручка исписалась. Читается «выпи́саць»."
idioms:
  - { pl: "wypisać się z czegoś", ru: "выйти из чего-то, перестать участвовать" }
