# review
id: wzdy
format: 2
lemma: "wżdy"
rank: 5834
pos: adv
pron: { cyr: "вжды" }
senses:
  - id: yet
    ru: "однако, всё-таки, ведь"
    note: "архаизм"
    examples:
      - pl: "Trudno było, wżdy jakoś przetrwaliśmy zimę."
        ru: "Трудно было, но всё-таки мы как-то пережили зиму."
        source: { kind: authored }
      - pl: "Niech wżdy obcy wiedzą, że mamy swój język."
        ru: "Пусть же чужие знают, что у нас свой язык."
        source: { kind: authored }
      - pl: "Bieda była wielka, wżdy nikt nie narzekał."
        ru: "Нужда была большая, однако никто не жаловался."
        source: { kind: authored }
  - id: at-last
    ru: "наконец, в конце концов"
    note: "архаизм"
    examples:
      - pl: "Długo prosił, aż wżdy ojciec się zgodził."
        ru: "Он долго просил, пока отец наконец не согласился."
        source: { kind: authored }
      - pl: "Po wielu latach tułaczki wżdy wrócił do domu."
        ru: "После многих лет скитаний он наконец вернулся домой."
        source: { kind: authored }
notes:
  - { kind: register, text: "Архаизм старопольского языка и литературы эпохи Возрождения. Сегодня его знают в основном по строке Миколая Рея о польском языке; в живой речи вместо него JEDNAK, PRZECIEŻ, WRESZCIE." }
  - { kind: false-friend, text: "Не «всегда», хотя чешское VŽDY значит именно «всегда». Польское WŻDY в текстах значит «однако, всё-таки» или «наконец»." }
  - { kind: pronunciation, text: "Один слог: «вжды». W перед звонким Ż не оглушается." }
collocations:
  - { pl: "a wżdy", ru: "а всё-таки" }
  - { pl: "niechaj wżdy", ru: "пусть же" }
  - { pl: "choć…, wżdy…", ru: "хотя…, однако…" }
etymology: "Старопольское слово, известное по текстам XVI века. Родственно чешскому VŽDY «всегда»."
memory: "wżdy — «а всё-таки»: так писал Рей — a niechaj narodowie wżdy postronni znają, iż Polacy nie gęsi."
idioms:
  - { pl: "a niechaj narodowie wżdy postronni znają, iż Polacy nie gęsi, iż swój język mają", ru: "пусть же и чужие народы знают, что поляки не гуси и у них есть свой язык (Миколай Рей)" }
formExamples:
  - form: "wżdy"
    pl: "Rycerz był ranny, wżdy walczył do końca."
    ru: "Рыцарь был ранен, однако бился до конца."
    source: { kind: authored }
  - form: "wżdy"
    pl: "Choć król był stary, wżdy rządził mądrze."
    ru: "Хотя король был стар, всё же правил мудро."
    source: { kind: authored }
  - form: "wżdy"
    pl: "Po długiej podróży statek wżdy dotarł do portu."
    ru: "После долгого плавания корабль наконец добрался до порта."
    source: { kind: authored }
