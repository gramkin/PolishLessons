notes:
  - { kind: pronunciation, text: "Читается «о́жэх», два слога, ударение на первом. RZ звучит как «ж», а CH — как «х». Здесь видно правило: польское RZ выросло из мягкого «р» и часто стоит там, где в русском «ре»: ORZECH — «орех», MORZE — «море», RZEKA — «река»." }
  - { kind: false-friend, text: "Грецкий орех по-польски ORZECH WŁOSKI, то есть «итальянский», а не «греческий». Фундук — ORZECH LASKOWY, от LASKA «орешник», а арахис — ORZESZKI ZIEMNE, «земляные орешки». Щелкунчик из балета — DZIADEK DO ORZECHÓW, буквально «дедушка для орехов», и так же называют обычные щипцы для орехов." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — ORZECHA, с окончанием -A. Для дерева и для древесины слово то же самое: STÓŁ Z ORZECHA — «стол из ореха»." }
  - { kind: government, text: "Колоть орехи — ŁUPAĆ ORZECHY, винительный. Щипцы для орехов — DZIADEK DO ORZECHÓW, родительный после DO. Крепкий орешек — TWARDY ORZECH DO ZGRYZIENIA, буквально «твёрдый орех для разгрызания»." }
  - { kind: register, text: "Слово нейтральное. TWARDY ORZECH DO ZGRYZIENIA говорят и о трудной задаче, и о трудном человеке, как наше «крепкий орешек». Прилагательное ORZECHOWY значит ещё и цвет, «светло-карий»: ORZECHOWE OCZY." }
collocations:
