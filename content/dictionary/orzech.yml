  - { pl: "orzechówka", ru: "ореховая настойка", relation: derived }
etymology: "Слово праславянское, общее с русским «орех». Польское RZ на месте русского «р» перед «е» — обычное соответствие: древнее мягкое «р» в польском стало RZ. Суффикс -ÓWKA дал ORZECHÓWKA — ореховую настойку, как WIŚNIÓWKA — вишнёвую."
memory: "Orzech — «орех»: польское rz на месте русского «ре», как morze и «море». Читается «о́жэх». Грецкий орех — orzech włoski, «итальянский». Twardy orzech do zgryzienia — крепкий орешек, а dziadek do orzechów — щелкунчик."
idioms:
  - { pl: "twardy orzech do zgryzienia", ru: "крепкий орешек" }
  - { pl: "dziadek do orzechów", ru: "щелкунчик; щипцы для орехов" }
