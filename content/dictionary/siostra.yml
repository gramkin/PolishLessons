# review
id: siostra
format: 2
lemma: "siostra"
rank: 338
pos: noun
pron: { cyr: "сьо́стра" }
senses:
  - id: sister
    ru: "сестра"
    examples:
      - pl: "Nie mam siostry."
        ru: "У меня нет сестры."
        source: { kind: tatoeba, id: 4721694 }
      - pl: "Ona ma dwie siostry."
        ru: "У неё есть две сестры."
        source: { kind: tatoeba, id: 3049245 }
      - pl: "Tom ma dwie siostry."
        ru: "У Тома две сестры."
        source: { kind: tatoeba, id: 3805713 }
  - id: sisters
    ru: "сестра (во множественном, в сравнениях)"
    examples:
      - pl: "Jestem siostrą Toma."
        ru: "Я сестра Тома."
        source: { kind: tatoeba, id: 5907093 }
      - pl: "Byłyśmy jak siostry."
        ru: "Мы были как сёстры."
        source: { kind: tatoeba, id: 12451370 }
      - pl: "Jesteście siostrami?"
        ru: "Вы сёстры?"
        source: { kind: tatoeba, id: 3664686 }
notes:
  - { kind: usage, text: "siostra значит не только «сестра»: так обращаются к медсестре и к монахине. Siostro, proszę o pomoc «Сестра, помогите». Формальное название профессии — pielęgniarka." }
  - { kind: usage, text: "Именно этим обращением и держится живой звательный падеж siostro." }
  - { kind: usage, text: "siostra cioteczna / stryjeczna — «двоюродная сестра»; rodzona siostra — «родная сестра»." }
collocations:
  - { pl: "starsza siostra", ru: "старшая сестра" }
  - { pl: "młodsza siostra", ru: "младшая сестра" }
  - { pl: "siostra cioteczna", ru: "двоюродная сестра" }
  - { pl: "brat i siostra", ru: "брат и сестра" }
etymology: "Праславянское *sestra — то же слово, что русское «сестра»; родственно латинскому soror."
memory: "siostra — «сестра», но так же обращаются к медсестре и к монахине: Siostro! Именно поэтому звательный падеж здесь живой."
idioms:
  - { pl: "brat i siostra", ru: "брат и сестра" }
  - { pl: "siostra cioteczna", ru: "двоюродная сестра" }
  - { pl: "rodzona siostra", ru: "родная сестра" }
