etymology: "Из латинского IUNIOR «младший», сравнительной степени от IUVENIS «молодой». Тот же корень дал польское JUNAK «молодец, удалец», латинское IUVENTUS «молодость», и — через другую ветвь — русское «юный», «юность», потому что праславянское *junъ родственно латинскому IUVENIS напрямую. Так что JUNIOR и «юный» в конечном счёте одно гнездо, и русское слово даже ближе к исходному корню, чем заимствованное «юниор». Противоположная форма SENIOR есть сравнительная степень от SENEX «старый», откуда и «сенат», то есть собрание старейшин, и польское SENAT. Пара IUNIOR и SENIOR пришла в европейские языки из латинских юридических текстов, где отличала отца от сына с тем же именем."
memory: "Читается «ю́нёр» в два слога, не «юниор» в три: польское i между согласной и гласной слога не образует. Множественное juniorzy, r переходит в rz, как rura и rurze. Шире русского: не только спорт, но и «младший» при одинаковых именах — Kowalski junior. Пара к нему — senior. От латинского iuvenis «молодой», родня русскому «юный»."
