notes:
  - { kind: pronunciation, text: "Читается «ю́нёр», ударение на первом слоге из двух. Начальное JU даёт «ю», а сочетание NIO в середине произносится «нё», одним слогом с мягким n: не «ю-ни-ор» в три слога, как по-русски, а «ю́-нёр» в два. Это общее правило: польское I между согласной и гласной не образует слога, а только смягчает предыдущую согласную. В именительном множественного JUNIORZY согласная R переходит в RZ и звучит «ж»: «ю́нёжы». Это то же чередование, что в RURA и RURZE." }
  - { kind: government, text: "Существительное мужского рода одушевлённое, мужско-личного разряда, и из этого следует всё остальное. Винительный единственного равен родительному: WIDZĘ JUNIORA. Именительный множественного — JUNIORZY, с обязательным переходом R в RZ; форма JUNIORY для людей неправильна. Категория вводится предлогом W с местным: W KATEGORII JUNIORÓW. Во втором значении слово ставится после фамилии без всякого предлога и не склоняется вместе с ней в разговоре: KOWALSKI JUNIOR, DO KOWALSKIEGO JUNIORA." }
  - { kind: usage, text: "В спорте слово официальное и означает точную возрастную категорию, границы которой зависят от вида: обычно до восемнадцати или до двадцати лет. Противоположность — SENIOR, и эта пара работает и в спорте, и в семье. Во втором значении JUNIOR значит «младший» при совпадении имён, как в KOWALSKI SENIOR и KOWALSKI JUNIOR, и употребляется заметно свободнее русского «младшего»: по-польски так скажут и в газете, и в разговоре. Женская форма — JUNIORKA." }
  - { kind: register, text: "Слово нейтральное, заимствованное и прозрачное, без всякого оттенка. Разговорно JUNIOR может означать просто «малыш» в семье, но это употребление шутливое и редкое. В документах пишут полностью: KATEGORIA JUNIORÓW MŁODSZYCH «категория младших юниоров». Русское «юниор» живёт только в спорте, и это главное отличие по сфере: польское слово вышло за пределы стадиона, русское осталось внутри." }
collocations:
