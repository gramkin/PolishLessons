pos: noun
pron: { cyr: "вилько́уак" }
senses:
  - id: werewolf
    ru: "оборотень, волколак"
    examples:
      - pl: "Wilkołak to człowiek, który zamienia się w wilka."
        ru: "Оборотень — это человек, который превращается в волка."
        source: { kind: authored }
      - pl: "Babcia straszyła nas wilkołakiem."
        ru: "Бабушка пугала нас оборотнем."
        source: { kind: authored }
      - pl: "Dzieci przebrały się za wilkołaki na Halloween."
        ru: "На Хэллоуин дети нарядились оборотнями."
        source: { kind: authored }
      - pl: "W legendach wilkołak zmienia postać podczas pełni."
        ru: "В легендах оборотень меняет облик в полнолуние."
        source: { kind: authored }
      - pl: "Czy wierzysz w wilkołaki?"
        ru: "Ты веришь в оборотней?"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WILKOŁAK — «оборотень». Русское «волколак» — то же слово, но редкое, а «вурдалак» — его искажённый вариант у Пушкина, и значит он уже «вампир». По-польски вампир — WAMPIR, а WILKOŁAK — только человек-волк." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое. Во множественном — WILKOŁAKI, как у зверей, а не личная форма. Винительный единственного равен родительному: ZASTRZELIĆ WILKOŁAKA, а множественного — именительному: WIERZYĆ W WILKOŁAKI." }
  - { kind: government, text: "Превратиться в оборотня — ZAMIENIĆ SIĘ W WILKOŁAKA, W с винительным. Верить в оборотней — WIERZYĆ W WILKOŁAKI. Нарядиться оборотнем — PRZEBRAĆ SIĘ ZA WILKOŁAKA." }
  - { kind: pronunciation, text: "Читается «вилько́уак», ударение на предпоследнем слоге. L перед K мягкое, как в WILK «вильк». Ł — краткое «у»." }
  - { kind: register, text: "Слово из фольклора, сказок и фильмов ужасов. Нейтральное, без переносных значений." }
collocations:
  - { pl: "zamienić się w wilkołaka", ru: "превратиться в оборотня" }
  - { pl: "legenda o wilkołaku", ru: "легенда об оборотне" }
  - { pl: "srebrna kula", ru: "серебряная пуля" }
family:
  - { pl: "wilk", ru: "волк", relation: root, id: wilk }
  - { pl: "wilczy", ru: "волчий", relation: root }
  - { pl: "wilczyca", ru: "волчица", relation: root }
etymology: "Из праславянского сложения «волк» + «шерсть»: тот, кто покрыт волчьей шкурой. Во второй части польский потерял D: в сербском и хорватском DLAKA до сих пор значит «шерсть». WILK — «волк»: польское IL на месте русского «ол», как в WILGOTNY — «волглый, сырой»."
memory: "Wilkołak — оборотень, человек-волк: wilk «волк». Читается «вилько́уак». Zamienić się w wilkołaka — превратиться в оборотня. Вурдалак — пушкинская переделка того же слова."
idioms:
  - { pl: "wyć do księżyca", ru: "выть на луну" }
