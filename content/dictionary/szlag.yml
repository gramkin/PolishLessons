# review
id: szlag
format: 2
lemma: "szlag"
rank: 1809
pos: noun
pron: { cyr: "шляк" }
senses:
  - id: curse
    ru: "чёрт (в проклятиях)"
    examples:
      - pl: "Szlag!"
        ru: "Чёрт!"
        source: { kind: translated, id: 12572602 }
      - pl: "Niech to szlag!"
        ru: "Чёрт побери!"
        source: { kind: translated, id: 8676399 }
      - pl: "Niech to szlag jasny trafi!"
        ru: "Чтоб его совсем разорвало!"
        source: { kind: translated, id: 1042192 }
      - pl: "Toma szlag trafił."
        ru: "Тома хватил удар."
        source: { kind: translated, id: 13657523 }
      - pl: "Szlag mnie trafia, gdy to widzę."
        ru: "Меня бесит, когда я это вижу."
        source: { kind: authored }
      - pl: "Niech to szlag, znowu się zepsuło."
        ru: "Чёрт побери, опять сломалось."
        source: { kind: authored }
notes:
  - { kind: register, text: "Умеренное ругательство, ближе к русскому «Чёрт!» или «Зараза!», чем к непристойной лексике. В разговоре звучит привычно." }
  - { kind: usage, text: "Живёт почти исключительно в оборотах: niech to szlag «чёрт побери», szlag mnie trafia «меня это бесит», coś szlag trafił «что-то пошло прахом»." }
  - { kind: usage, text: "Исходное значение — «удар, апоплексический удар»: szlag kogoś trafił значит и «кого-то хватил удар», и переносно «кто-то взбесился»." }
collocations:
  - { pl: "niech to szlag", ru: "чёрт побери" }
  - { pl: "szlag mnie trafia", ru: "меня это бесит" }
  - { pl: "szlag trafił", ru: "пошло прахом" }
etymology: "Из немецкого Schlag «удар». Русское «кондрашка хватила» передаёт ту же мысль об ударе, но образовано от совсем другого слова."
memory: "szlag — «удар», но в живой речи только в проклятиях: Niech to szlag! «Чёрт побери!», Szlag mnie trafia «Меня бесит»."
