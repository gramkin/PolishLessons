etymology: "Общеславянский корень *lagod-, «удобство, мягкость»; в русских диалектах есть «лагодить», «ладить, угождать». В литературном русском прилагательное не сохранилось, а в польском стало главным словом для «мягкого» нрава и климата."
memory: "Łagodny — мягкий, кроткий: łagodny pies, łagodna zima, łagodna kara. Łagodny guz — доброкачественная опухоль. Мягкий на ощупь — miękki. Читается «уаго́дны»."
idioms:
  - { pl: "łagodny jak baranek", ru: "кроткий как ягнёнок" }
