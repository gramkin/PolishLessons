# review
id: lagodny
format: 2
lemma: "łagodny"
rank: 4578
pos: adj
pron: { cyr: "уаго́дны" }
senses:
  - id: gentle
    ru: "мягкий, кроткий, ласковый (о человеке, животном)"
    examples:
      - pl: "Ten pies jest łagodny jak baranek."
        ru: "Этот пёс кроткий как ягнёнок."
        source: { kind: authored }
      - pl: "Mówiła łagodnym głosem."
        ru: "Она говорила мягким голосом."
        source: { kind: authored }
      - pl: "To najłagodniejszy koń w stajni."
        ru: "Это самая смирная лошадь в конюшне."
        source: { kind: authored }
  - id: mild
    ru: "мягкий, слабый (о климате, болезни, наказании, вкусе)"
    examples:
      - pl: "Zima była łagodna w tym roku."
        ru: "Зима в этом году была мягкой."
        source: { kind: authored }
      - pl: "Sąd wymierzył mu łagodną karę."
        ru: "Суд назначил ему мягкое наказание."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому ŁAGODNY похож на «ладный» или «угодный», но это «мягкий, кроткий». Корень тот же, что в русском «лагодить» в диалектах, но в литературном русском слова нет. Польское ŁAGODNY покрывает русское «мягкий» там, где речь не о текстуре: ŁAGODNY KLIMAT, ŁAGODNA KARA, ŁAGODNY SER. Мягкий на ощупь — MIĘKKI." }
  - { kind: usage, text: "Полная парадигма: ŁAGODNY, ŁAGODNIEJSZY, NAJŁAGODNIEJSZY. Все степени очень частотны: ŁAGODNIEJSZY WYROK, NAJŁAGODNIEJSZA ZIMA. Форма для мужчин-людей: ŁAGODNI, ŁAGODNIEJSI, NAJŁAGODNIEJSI." }
  - { kind: government, text: "Мягкий к кому-то — ŁAGODNY DLA KOGOŚ или WOBEC KOGOŚ, с родительным. Мягкий как ягнёнок — ŁAGODNY JAK BARANEK, JAK с именительным. Наречие ŁAGODNIE — «мягко, кротко»." }
  - { kind: pronunciation, text: "Читается «уаго́дны», три слога, ударение на предпоследнем. Ł в начале — «у», и слово начинается с «уа». В ŁAGODNIEJSZY: «уагодне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в медицине (ŁAGODNY GUZ, «доброкачественная опухоль»), в праве (ŁAGODNY WYROK) и в кулинарии (ŁAGODNA PAPRYKA, «неострый перец»). ŁAGODNY GUZ — термин, который стоит запомнить: «мягкая» опухоль значит «не злокачественная»." }
collocations:
  - { pl: "łagodny jak baranek", ru: "кроткий как ягнёнок" }
  - { pl: "łagodny klimat", ru: "мягкий климат" }
  - { pl: "łagodny guz", ru: "доброкачественная опухоль" }
family:
