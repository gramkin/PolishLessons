# review
id: sejmik
format: 2
lemma: "sejmik"
rank: 5840
pos: noun
pron: { cyr: "се́ймик" }
senses:
  - id: gentry
    ru: "сеймик, собрание шляхты воеводства или земли (ист.)"
    examples:
      - pl: "Szlachta zjechała na sejmik do Środy."
        ru: "Шляхта съехалась на сеймик в Шроду."
        source: { kind: authored }
      - pl: "Na sejmiku wybierano posłów na sejm."
        ru: "На сеймике выбирали послов на сейм."
        source: { kind: authored }
  - id: regional
    ru: "сеймик воеводства, региональный совет (орган самоуправления)"
    examples:
      - pl: "Sejmik województwa uchwalił nowy budżet."
        ru: "Сеймик воеводства принял новый бюджет."
        source: { kind: authored }
      - pl: "Kandyduje do sejmiku z listy lokalnego komitetu."
        ru: "Он баллотируется в сеймик от местного комитета."
        source: { kind: authored }
  - id: flock
    ru: "сбор птиц перед отлётом (шутл.)"
    examples:
      - pl: "Jesienią bociany zbierają się na sejmik przed odlotem."
        ru: "Осенью аисты слетаются на сбор перед отлётом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "SEJMIK — уменьшительное от SEJM «сейм», буквально «маленький сейм». Сегодня это прежде всего SEJMIK WOJEWÓDZTWA — выборный совет воеводства; его депутаты называются RADNI, а исполнительную власть возглавляет MARSZAŁEK WOJEWÓDZTWA. В Польше шестнадцать воеводств и шестнадцать сеймиков." }
  - { kind: register, text: "Историческое значение — собрание шляхты одной земли или воеводства в Речи Посполитой: там выбирали послов на сейм и давали им инструкции. Шутливое значение «птичий сбор» встречается в выражении SEJMIK BOCIANI — аисты перед отлётом." }
  - { kind: government, text: "Выборы в сеймик — WYBORY DO SEJMIKU, баллотироваться — KANDYDOWAĆ DO SEJMIKU: предлог DO с родительным, как и у SEJM (WYBORY DO SEJMU)." }
  - { kind: pronunciation, text: "Читается «се́ймик»: J после гласной звучит как «й», ударение на первом слоге." }
collocations:
  - { pl: "sejmik województwa", ru: "сеймик (совет) воеводства" }
  - { pl: "radny sejmiku", ru: "депутат сеймика" }
  - { pl: "wybory do sejmiku", ru: "выборы в сеймик" }
  - { pl: "sejmik szlachecki", ru: "шляхетский сеймик" }
family:
  - { pl: "sejm", ru: "сейм", relation: root }
  - { pl: "sejmikowy", ru: "сеймиковый", relation: derived }
  - { pl: "sejmikować", ru: "совещаться, обсуждать сообща (шутл.)", relation: derived }
etymology: "Уменьшительное от SEJM «сейм» с суффиксом -IK. Само SEJM — древнее славянское слово со значением «собрание», родственное русскому «сонм»."
memory: "Sejm — сейм, sejmik — «маленький сейм»: раньше съезд шляхты, теперь совет воеводства. А осенью на «сеймик» собираются аисты."
idioms:
  - { pl: "sejmik bociani", ru: "аистиный сбор перед отлётом" }
