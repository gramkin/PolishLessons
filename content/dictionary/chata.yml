        ru: "Их хата стоит в долине."
        source: { kind: translated, id: 749217 }
  - id: cabin
    ru: "домик, хижина (в горах, в лесу)"
    examples:
      - pl: "Pustelnik mieszkał w drewnianej chacie."
        ru: "Отшельник жил в деревянной хижине."
        source: { kind: translated, id: 749170 }
      - pl: "Tom powiedział nam, że zjemy, jak tylko dotrzemy do chaty."
        ru: "Том сказал нам, что мы поедим, как только доберёмся до домика."
        source: { kind: translated, id: 3787945 }
notes:
  - { kind: false-friend, text: "Русская «хата» и польское chata — одно слово, и значение совпадает: простой деревенский дом." }
  - { kind: government, text: "Женский род: ta chata, tej chaty. В хате — w chacie, предложный падеж." }
  - { kind: usage, text: "Разговорно chata значит «хата» и в русском молодёжном смысле — своё жильё, куда можно позвать: Wpadnij do mnie na chatę." }
  - { kind: usage, text: "Поговорка Wolnoć Tomku w swoim domku — про то же, что русское «мой дом — моя крепость»." }
collocations:
  - { pl: "drewniana chata", ru: "деревянная хата" }
  - { pl: "w chacie", ru: "в хате" }
etymology: "Праславянское *chata; русская «хата» — то же слово."
memory: "chata — «хата, изба». Разговорно ещё и «хата» в смысле своего жилья: wpaść na chatę. В хате — w chacie."
idioms:
  - { pl: "drewniana chata", ru: "деревянная хата" }
formExamplesSkip:
  - { form: "chat", reason: "единственный кандидат — о французском слове chat «кот», а не о польском chata" }
