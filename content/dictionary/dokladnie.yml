# review
id: dokladnie
format: 2
lemma: "dokładnie"
rank: 316
pos: adv
pron: { cyr: "докла́дне" }
senses:
  - id: exactly
    ru: "именно, точно"
    examples:
      - pl: "Tutaj dokładnie?"
        ru: "Прямо здесь?"
        source: { kind: tatoeba, id: 366715 }
      - pl: "Czego dokładnie oczekiwałeś?"
        ru: "Чего ты именно ожидал?"
        source: { kind: tatoeba, id: 4953264 }
      - pl: "Co dokładnie robi ten przycisk?"
        ru: "Что именно делает эта кнопка?"
        source: { kind: tatoeba, id: 4558491 }
  - id: precisely
    ru: "точно, в точности; тщательно"
    examples:
      - pl: "Nie wiem dokładnie, gdzie się urodziłam."
        ru: "Я не знаю точно, где родилась."
        source: { kind: tatoeba, id: 12202570 }
      - pl: "Jeśli chodzi o odległości, to 100 metrów oznacza dokładnie 100 metrów."
        ru: "Что касается расстояния, то 100 метров — это в точности 100 метров."
        source: { kind: tatoeba, id: 951201 }
      - pl: "Umyj ręce dokładnie."
        ru: "Вымой руки тщательно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Отдельное Dokładnie! в разговоре значит «Вот именно!», «Точно!» — частый способ согласиться." }
  - { kind: usage, text: "Слово покрывает два русских: «точно, именно» (dokładnie tak) и «тщательно» (sprzątać dokładnie)." }
  - { kind: usage, text: "Степени сравнения: dokładnie — dokładniej — najdokładniej." }
collocations:
  - { pl: "dokładnie tak", ru: "именно так" }
  - { pl: "dokładnie o siódmej", ru: "ровно в семь" }
  - { pl: "nie wiem dokładnie", ru: "точно не знаю" }
  - { pl: "co dokładnie", ru: "что именно" }
etymology: "От dokładny «точный», из do- + kłaść «класть»: то, что приложено вплотную; ср. русское «докладный, подробный»."
memory: "dokładnie значит и «точно, именно», и «тщательно». А одинокое Dokładnie! в разговоре — это «Вот именно!»."
idioms:
  - { pl: "dokładnie tak", ru: "именно так" }
  - { pl: "dokładnie na czas", ru: "точно вовремя" }
  - { pl: "dokładnie tyle samo", ru: "ровно столько же" }
