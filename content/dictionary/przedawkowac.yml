# review
id: przedawkowac
format: 2
lemma: "przedawkować"
rank: 5281
pos: verb
pron: { cyr: "пшэдавко́ваць" }
senses:
  - id: overdose
    ru: "принять слишком большую дозу; без дополнения — «передозировка»"
    examples:
      - pl: "Przedawkował leki nasenne."
        ru: "Он принял слишком много снотворного."
        source: { kind: authored }
      - pl: "Muzyk przedawkował narkotyki."
        ru: "У музыканта была передозировка наркотиков."
        source: { kind: authored }
      - pl: "Łatwo przedawkować ten lek."
        ru: "Это лекарство легко передозировать."
        source: { kind: authored }
  - id: overdo
    ru: "перен. переборщить (с кофе, солнцем, пафосом)"
    examples:
      - pl: "Przedawkował kofeinę i nie mógł spać."
        ru: "Он перебрал с кофеином и не мог уснуть."
        source: { kind: authored }
      - pl: "Przedawkowała słońce i dostała udaru."
        ru: "Она перегрелась на солнце и получила удар."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEDAWKOWAĆ — «принять слишком много, передозировать», от DAWKA «доза». Часто без дополнения: PRZEDAWKOWAŁ — «у него была передозировка». Не путать с русским «передавить» — PRZYGNIEŚĆ." }
  - { kind: usage, text: "Пятьдесят две формы: формы для мужчин-людей PRZEDAWKOWANI нет. Спряжение на -UJĘ: PRZEDAWKUJĘ, PRZEDAWKUJESZ; повелительное PRZEDAWKUJ — обычно с отрицанием: NIE PRZEDAWKUJ! PRZEDAWKOWANIE — «передозировка»." }
  - { kind: government, text: "Что — винительный: PRZEDAWKOWAĆ LEKI, KOFEINĘ. Кому дали лишнее — дательный в безличной форме: PACJENTOWI PRZEDAWKOWANO LEK." }
  - { kind: pronunciation, text: "Читается «пшэдавко́ваць»: PRZE — «пшэ», ударение на предпоследнем слоге KO. PRZEDAWKUJĘ — «пшэдавку́е»." }
  - { kind: register, text: "Медицинское и газетное слово. Переносное PRZEDAWKOWAĆ SŁOŃCE, KAWĘ — шутливое разговорное «переборщить»." }
collocations:
  - { pl: "przedawkować leki", ru: "передозировать лекарства" }
  - { pl: "przedawkować kofeinę", ru: "перебрать с кофеином" }
  - { pl: "zmarł z przedawkowania", ru: "умер от передозировки" }
family:
  - { pl: "dawka", ru: "доза", relation: root, id: dawka }
  - { pl: "przedawkowanie", ru: "передозировка", relation: derived }
  - { pl: "dawkować", ru: "дозировать", relation: derived }
etymology: "Приставка PRZE- «пере-» плюс DAWKOWAĆ «дозировать», от DAWKA «доза», связанного с DAWAĆ «давать». Буквально — «передать лишнего»."
memory: "Przedawkować — передозировать: przedawkował leki. Przedawkowanie — передозировка. Nie przedawkuj! — не переборщи! Читается «пшэдавко́ваць»."
idioms:
  - { pl: "przedawkować słońce", ru: "перегреться на солнце, перебрать с загаром" }
