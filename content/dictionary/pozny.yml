etymology: "Из праславянского *pozdьnъ — того же слова, что русское «поздний», от наречия *pozdě «поздно». Польское ó здесь из древнего долгого o, а źn — из смягчённого zdn. Отсюда późno, później, spóźnić się, opóźnienie и popołudnie."
memory: "późny — «поздний», слово в слово. Запомнить надо наречие: później значит не только «позже», но и «ПОТОМ»; zrobię to później это «сделаю потом». А najpóźniej значит «самое позднее»: najpóźniej o siódmej."
idioms:
  - { pl: "najpóźniej o siódmej", ru: "самое позднее в семь" }
  - { pl: "lepiej późno niż wcale", ru: "лучше поздно, чем никогда" }
