notes:
  - { kind: false-friend, text: "Слово прозрачно: то же, что русское «поздний». Ловушка не в нём, а в наречии. Później значит и «позже», и просто «ПОТОМ, затем»: zrobię to później «сделаю это потом». Русское «позже» так не употребляется, и начинающие по привычке говорят potem там, где поляк скажет później." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: PÓŹ-ny. Ó читается как у, ź — как мягкое зь: «пу́жны», точнее «пу́зьны». В сравнительной степени ź оказывается перед ni и звучит так же мягко: późniejszy — «пузьне́йшы»." }
  - { kind: usage, text: "Наречие późno «поздно», сравнительная степень później «позже, потом», превосходная najpóźniej «самое позднее, не позже чем». Последнее очень частотно в договорённостях: przyjdę najpóźniej o siódmej «приду самое позднее в семь». Глагол spóźnić się «опоздать», существительное opóźnienie «опоздание, задержка»." }
  - { kind: register, text: "Нейтрально. Степени сравнения употребляются постоянно, поэтому парадигма полная, в тридцать три формы. Сравнительная późniejszy часто значит не «более поздний», а «последующий»: w późniejszych latach «в последующие годы»." }
collocations:
  - { pl: "późny wieczór", ru: "поздний вечер" }
  - { pl: "w późniejszym terminie", ru: "в более поздний срок" }
  - { pl: "najpóźniej o siódmej", ru: "самое позднее в семь" }
family:
  - { pl: "późno", ru: "поздно", relation: derived, id: pozno }
  - { pl: "spóźnić się", ru: "опоздать", relation: derived, id: spoznic }
  - { pl: "opóźnienie", ru: "опоздание, задержка", relation: derived }
