# review
id: wymienic
format: 2
lemma: "wymienić"
rank: 2088
pos: verb
aspect: perf
pron: { cyr: "выме́ниць" }
senses:
  - id: replace
    ru: "заменить, поменять"
    examples:
      - pl: "\"Ilu Niemców potrzeba, żeby wymienić żarówkę?\" \"Jednego. Nie jesteśmy zabawni, ale bardzo wydajni.\""
        ru: "«Сколько немцев нужно, чтобы поменять лампочку?» – «Один. Мы не смешны, но очень эффективны»."
        source: { kind: tatoeba, id: 10774702 }
      - pl: "Umiesz wymienić żarówkę?"
        ru: "Ты умеешь менять лампочку?"
        source: { kind: translated, id: 12567507 }
      - pl: "Najwyższy czas, abym wymienił swoje okulary!"
        ru: "Самое время поменять очки!"
        source: { kind: translated, id: 1085517 }
  - id: exchange
    ru: "обменять, обменяться"
    examples:
      - pl: "Gdzie mogę wymienić pieniądze?"
        ru: "Где я могу обменять деньги?"
        source: { kind: translated, id: 1597993 }
      - pl: "Wymienili pozdrowienia."
        ru: "Они обменялись приветствиями."
        source: { kind: translated, id: 818745 }
  - id: name
    ru: "назвать, перечислить"
    examples:
      - pl: "Wymień rzeki Arkansas."
        ru: "Назови реки в Арканзасе."
        source: { kind: tatoeba, id: 5437694 }
notes:
  - { kind: government, text: "Заменить одно на другое — na с винительным: wymienić kamerę na gitarę. Обменяться друг с другом — się plus творительный: wymienić się zegarkami." }
  - { kind: usage, text: "Третье значение — «назвать, перечислить»: wymień rzeki «назови реки», wymienić kogoś z nazwiska «назвать кого-л. по фамилии»." }
  - { kind: usage, text: "Несовершенный вид — wymieniać." }
  - { kind: false-friend, text: "Корень miana/mienić «менять» — ср. русское «менять», «обменять», «измена»." }
  - { kind: usage, text: "Третье значение — «назвать, перечислить» — даёт мужско-личное причастие: wymienieni w umowie z nazwiska «названные в договоре поимённо»." }
collocations:
  - { pl: "wymienić pieniądze", ru: "обменять деньги" }
  - { pl: "wymienić żarówkę", ru: "поменять лампочку" }
etymology: "wy- + mieniać, от mienić «менять», праславянское *měna; ср. русское «менять», «обмен», «измена»."
memory: "wymienić — «заменить», «обменять» и «назвать» сразу. Заменить одно на другое — na с винительным, обменяться — się с творительным. Несовершенный вид — wymieniać."
idioms:
  - { pl: "wymienić pieniądze", ru: "обменять деньги" }
  - { pl: "wymienić kogoś z nazwiska", ru: "назвать кого-л. по фамилии" }
formExamplesSkip:
  - { form: "wymieniono", reason: "безличная форма; в корпусе примеров нет" }
