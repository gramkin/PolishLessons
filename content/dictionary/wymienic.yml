  - form: "wymienili"
    pl: "Wymienili swoją kamerę na gitarę."
    ru: "Они обменяли свою камеру на гитару."
    source: { kind: translated, id: 3847575 }
  - form: "wymienili"
    pl: "Obaj prezydenci wymienili się numerami telefonów, aby móc rozmawiać bez pośredników."
    ru: "Оба президента обменялись номерами телефонов, чтобы поддерживать связь."
    source: { kind: translated, id: 13497994 }
  - form: "wymieniliby"
    pl: "Gdyby poszli do banku, wymieniliby pieniądze po lepszym kursie."
    ru: "Если бы они пошли в банк, они обменяли бы деньги по лучшему курсу."
    source: { kind: translated, id: 980778 }
  - form: "wymieniliby"
    pl: "Wymieniliby okna, gdyby mieli pieniądze."
    ru: "Они поменяли бы окна, будь у них деньги."
    source: { kind: authored }
  - form: "wymieniliby"
    pl: "Chętnie wymieniliby mieszkanie na dom."
    ru: "Они охотно обменяли бы квартиру на дом."
    source: { kind: authored }
  - form: "wymieniliśmy"
    pl: "Wymieniliśmy pozdrowienia."
    ru: "Мы обменялись приветствиями."
    source: { kind: translated, id: 10595515 }
  - form: "wymieniliśmy"
    pl: "Wymieniliśmy się zegarkami."
    ru: "Мы обменялись часами."
    source: { kind: translated, id: 7998980 }
  - form: "wymieniliśmy"
    pl: "Wymieniliśmy jeny na dolary."
    ru: "Мы обменяли иены на доллары."
    source: { kind: translated, id: 363616 }
  - form: "wymienił"
    pl: "Po raz pierwszy wymienił jej nazwisko."
    ru: "Он впервые назвал её фамилию."
    source: { kind: translated, id: 365067 }
  - form: "wymienił"
    pl: "Najwyższy czas, abym wymienił swoje okulary!"
    ru: "Самое время поменять очки!"
    source: { kind: translated, id: 1085517 }
  - form: "wymienił"
    pl: "Tom wymienił ludzi z nazwiska i narobił sobie wrogów."
    ru: "Том назвал людей по фамилиям и нажил себе врагов."
    source: { kind: translated, id: 13655434 }
  - form: "wymieniłbym"
    pl: "Wymieniłbym wszystkie stare okna."
    ru: "Я заменил бы все старые окна."
    source: { kind: authored }
  - form: "wymieniłbym"
    pl: "Wymieniłbym ten telefon na nowszy."
    ru: "Я обменял бы этот телефон на более новый."
    source: { kind: authored }
  - form: "wymieniłbym"
    pl: "Chętnie wymieniłbym miejsce z tobą."
    ru: "Я охотно поменялся бы с тобой местом."
    source: { kind: authored }
  - form: "wymieniłem"
    pl: "Wymieniłem pękniętą filiżankę."
    ru: "Я заменил треснувшую чашку."
    source: { kind: translated, id: 771710 }
  - form: "wymieniłem"
    pl: "Wymieniłem jeny na dolary."
    ru: "Я обменял иены на доллары."
    source: { kind: translated, id: 3292926 }
  - form: "wymieniłem"
    pl: "Wymieniłem się z nim znaczkami."
    ru: "Я обменялся с ним марками."
    source: { kind: translated, id: 1531990 }
  - form: "wymieniona"
    pl: "Pościel została wymieniona wczoraj."
    ru: "Постельное бельё поменяли вчера."
    source: { kind: translated, id: 4353985 }
  - form: "wymieniona"
    pl: "Żarówka została wymieniona."
    ru: "Лампочку заменили."
    source: { kind: authored }
  - form: "wymieniona"
    pl: "Ta część nie była wymieniona."
    ru: "Эта деталь не была заменена."
    source: { kind: authored }
  - form: "wymień"
    pl: "Wymień rzeki Arkansas."
    ru: "Назови реки в Арканзасе."
