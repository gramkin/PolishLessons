# review
id: pewnie
format: 2
lemma: "pewnie"
rank: 191
pos: adv
pron: { cyr: "пэ́вне" }
senses:
  - id: probably
    ru: "наверное, вероятно"
    examples:
      - pl: "Stół stoi krzywo i pewnie zaraz się przewróci."
        ru: "Стол стоит криво и, вероятно, скоро перевернётся."
        source: { kind: tatoeba, id: 827792 }
      - pl: "Gdybyś jadł mniej hamburgerów, pewnie byłbyś zdrowszy."
        ru: "Если бы ты ел меньше гамбургеров, то, возможно, был бы здоровее."
        source: { kind: tatoeba, id: 976193 }
      - pl: "Jeśli Tom by wiedział, to pewnie by nam powiedział."
        ru: "Если бы Том знал, уверен, он бы нам сказал."
        source: { kind: tatoeba, id: 13784388 }
  - id: confidently
    ru: "уверенно, твёрдо (о манере)"
    examples:
      - pl: "W siodle czuje się pewnie."
        ru: "В седле он чувствует себя уверенно."
        source: { kind: tatoeba, id: 3686374 }
      - pl: "Mówił pewnie i spokojnie."
        ru: "Он говорил уверенно и спокойно."
        source: { kind: authored }
      - pl: "Stoi pewnie na nogach."
        ru: "Он твёрдо стоит на ногах."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "В разговоре pewnie значит «наверное», а не «уверенно». «Наверняка» передаётся оборотом na pewno: Na pewno przyjdzie «Он наверняка придёт»." }
  - { kind: usage, text: "no pewnie! — «ну конечно!»; czuć się pewnie — «чувствовать себя уверенно»." }
collocations:
  - { pl: "no pewnie!", ru: "ну конечно!" }
  - { pl: "na pewno", ru: "наверняка" }
  - { pl: "czuć się pewnie", ru: "чувствовать себя уверенно" }
etymology: "От pewny «уверенный, надёжный»; то же слово, что в na pewno «наверняка»."
memory: "Ловушка: pewnie чаще значит «наверное», а не «уверенно». «Наверняка» — это na pewno. А no pewnie! — «ну конечно!»."
idioms:
