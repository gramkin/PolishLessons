etymology: "Из средневековой латыни QUITUS «свободный от долга», от QUIETUS «спокойный». Русское «квиты» и французское QUITTE — из того же источника."
memory: "Kwita — квиты: jesteśmy kwita. И kwita! — и баста! Kwit — квитанция, того же корня."
