notes:
  - { kind: false-friend, text: "KWITA — «квиты», то же слово, пришедшее из латыни. Не путать с KWIT «квитанция» и KWITNĄĆ «цвести». Второе значение, «и баста», в русском «квиты» отсутствует." }
  - { kind: usage, text: "Неизменяемое слово. Обычно BYĆ KWITA «быть квитами»: JESTEŚMY KWITA. В конце фразы — «и всё»: I KWITA." }
  - { kind: government, text: "Ничем не управляет. С кем — Z с творительным: JESTEM Z NIM KWITA «мы с ним квиты»." }
  - { kind: pronunciation, text: "Читается «кфи́та»: W после K оглушается в «ф». Ударение на первом слоге." }
  - { kind: register, text: "Разговорное слово. В деловой речи — ROZLICZENI «в расчёте»." }
collocations:
