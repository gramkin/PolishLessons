# review
id: boj
format: 2
lemma: "bój"
rank: 4444
pos: noun
pron: { cyr: "буй" }
senses:
  - id: battle
    ru: "бой, сражение (книжн.)"
    examples:
      - pl: "Żołnierze ruszyli do boju."
        ru: "Солдаты ринулись в бой."
        source: { kind: authored }
      - pl: "W boju zginęło wielu rycerzy."
        ru: "В бою погибло много рыцарей."
        source: { kind: authored }
      - pl: "Ostatni bój stoczyli pod Warszawą."
        ru: "Последний бой они дали под Варшавой."
        source: { kind: authored }
  - id: struggle
    ru: "борьба (перен.)"
    examples:
      - pl: "Toczy bój o życie syna."
        ru: "Он ведёт борьбу за жизнь сына."
        source: { kind: authored }
      - pl: "To był zacięty bój o mistrzostwo."
        ru: "Это была упорная борьба за чемпионство."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BÓJ — «бой», но книжное и торжественное. В обычной речи — WALKA, «борьба, бой», и BITWA, «битва». DO BOJU! — «в бой!». Не путайте с BOJA — «буй, бакен»: формы BOJE совпадают." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Ó чередуется с O: BÓJ, но BOJU. Учим единственное; множественное BOJE путается с BOJE «буи»." }
  - { kind: government, text: "Идти в бой — RUSZYĆ DO BOJU, родительный. Пасть в бою — POLEC W BOJU, местный. Бой за что — BÓJ O и винительный: BÓJ O MIASTO." }
  - { kind: pronunciation, text: "Читается «буй», один слог: Ó — «у», J — «й». BOJU — «бо́ю»." }
collocations:
  - { pl: "ruszyć do boju", ru: "ринуться в бой" }
  - { pl: "polec w boju", ru: "пасть в бою" }
  - { pl: "zacięty bój", ru: "упорная борьба" }
family:
  - { pl: "walka", ru: "борьба, бой", relation: root, id: walka }
  - { pl: "bitwa", ru: "битва", relation: root, id: bitwa }
  - { pl: "bić", ru: "бить", relation: root, id: bic }
etymology: "От BIĆ «бить», общеславянский корень. Русское «бой» — то же слово."
memory: "Bój — бой, книжное; в быту walka. Do boju! — в бой! Polec w boju — пасть в бою. Читается «буй»."
idioms:
  - { pl: "do boju!", ru: "в бой!, вперёд!" }
