notes:
  - { kind: false-friend, text: "Русское «амуниция» и польское AMUNICJA — ложная пара, и ошибка здесь дорогая. По-русски «амуниция» означает снаряжение: ремни, подсумки, походное имущество. По-польски AMUNICJA значит только «боеприпасы, патроны», то есть то, чем стреляют. Русское «снаряжение» по-польски OPORZĄDZENIE или WYPOSAŻENIE, а «амуниция» в русском смысле — RZĘDY и PASY в кавалерийском контексте. Поэтому фраза ŻOŁNIERZE BEZ AMUNICJI значит «солдаты без патронов», а не «без снаряжения». Слово употребляется почти всегда в единственном числе как собирательное, точно как русское «боеприпасы» во множественном." }
  - { kind: usage, text: "Десять форм, женский род, существительное на -CJA. Собирательное: множественное число AMUNICJE почти не употребляется, и обычно слово стоит в единственном — AMUNICJA SIĘ SKOŃCZYŁA, где по-русски естественно множественное «боеприпасы кончились». Родительный множественного — AMUNICYJ, архаичная форма на -YJ, та же, что в AKADEMIJ и CEREMONIJ: в современных текстах она почти не встречается, но в парадигме стоит. Звательный AMUNICJO существует формально и в речи не употребляется. Суффикс -CJA отвечает русскому -ЦИЯ: AMUNICJA и «амуниция», STACJA и «станция»." }
  - { kind: pronunciation, text: "Читается «амуни́цья», четыре слога, ударение на предпоследнем. Буква C даёт «ц», и сочетание CJ произносится как «ць» с последующим «й», слитно: «цья». Это то же сочетание, что в STACJA и LEKCJA. Буква U читается «у». Конечное A — чистое «а», без редукции. В родительном AMUNICJI сочетание CJI звучит «цьи»: «амуни́цьи». В архаичном родительном множественного AMUNICYJ конечное Y даёт «ы», а слово кончается на согласный: «амуни́цый»." }
  - { kind: register, text: "Слово военное и техническое, вне этих контекстов не употребляется: в быту о патронах скажут NABOJE, а о выстрелах STRZAŁY. В переносном смысле AMUNICJA встречается в публицистике и означает «аргументы, доводы»: DOSTARCZYŁ PRZECIWNIKOM AMUNICJI «он снабдил противников аргументами», и этот оборот совпадает с русским «дал боеприпасы противникам». В официальных документах слово стоит рядом с BROŃ: BROŃ I AMUNICJA — стандартная формула в законах и инструкциях." }
