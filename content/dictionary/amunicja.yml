etymology: "Из французского MUNITION «снабжение, припасы», от латинского MUNIRE «укреплять, снабжать», с начальным A- из слитого артикля — та же история, что у русского «амуниция», пришедшего тем же путём через немецкий или польский. Исходное значение было широким: всё, чем снабжают войско. Дальше языки разошлись. Польский сузил слово до боеприпасов, а снаряжение назвал OPORZĄDZENIEM и WYPOSAŻENIEM. Русский, напротив, закрепил за «амуницией» именно снаряжение, а для боеприпасов построил своё слово из «боя» и «припаса». Так одно французское заимствование поделило поле ровно наоборот в двух соседних языках, и именно поэтому пара обманчива. Суффикс -CJA в польском отвечает русскому -ЦИЯ во всём этом слое: AMUNICJA, STACJA, RACJA."
memory: "Ложный друг, и опасный: польское amunicja значит только «боеприпасы, патроны», а русское «амуниция» — снаряжение. Снаряжение по-польски oporządzenie, wyposażenie. Żołnierze bez amunicji — это «без патронов». Слово собирательное, стоит в единственном числе там, где русский берёт множественное. Родительный множественного архаичный, на -yj: amunicyj, как akademij. Переносно — «аргументы»: dostarczyć komuś amunicji."
idioms:
  - { pl: "dostarczyć komuś amunicji", ru: "дать кому-то аргументы" }
