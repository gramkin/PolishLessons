# review
id: kiedykolwiek
format: 2
lemma: "kiedykolwiek"
rank: 640
pos: adv
pron: { cyr: "кедыко́львек" }
senses:
  - id: ever-question
    ru: "когда-нибудь (в вопросе)"
    note: "Byłeś kiedykolwiek w Kanadzie? «Ты был когда-нибудь в Канаде?»"
    examples:
      - pl: "Byłeś kiedykolwiek w Kanadzie?"
        ru: "Ты был когда-нибудь в Канаде?"
        source: { kind: tatoeba, id: 4101618 }
      - pl: "Czy kiedykolwiek widziałeś ducha?"
        ru: "Ты когда-нибудь видел привидение?"
        source: { kind: tatoeba, id: 5550604 }
      - pl: "Czy kiedykolwiek o tym myślałeś?"
        ru: "Ты когда-нибудь об этом думал?"
        source: { kind: authored }
  - id: ever-superlative
    ru: "когда-либо (при превосходной степени)"
    note: "najlepszy prezent, jaki kiedykolwiek dostałem."
    examples:
      - pl: "To najlepszy prezent, jaki kiedykolwiek dostałem!"
        ru: "Это лучший подарок, какой я когда-либо получал!"
        source: { kind: tatoeba, id: 13785951 }
      - pl: "To jest najpyszniejsza pizza, jaką kiedykolwiek jadłem."
        ru: "Это самая вкусная пицца, какую я когда-либо ел."
        source: { kind: tatoeba, id: 3945927 }
      - pl: "To najdziwniejsza historia, jaką kiedykolwiek słyszałem."
        ru: "Это самая странная история, какую я когда-либо слышал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Собрано тем же способом, что ktokolwiek и cokolwiek: kiedy плюс частица -kolwiek. Весь ряд: ktokolwiek, cokolwiek, gdziekolwiek, jakkolwiek, kiedykolwiek." }
  - { kind: usage, text: "В вопросе значит «когда-нибудь»: Czy kiedykolwiek widziałeś ducha?" }
  - { kind: usage, text: "При превосходной степени — «когда-либо»: najlepszy prezent, jaki kiedykolwiek dostałem." }
  - { kind: usage, text: "В обычном утверждении звучит книжно; обиходнее kiedyś «когда-то, как-нибудь»." }
collocations:
  - { pl: "czy kiedykolwiek", ru: "когда-нибудь ли" }
  - { pl: "jaki kiedykolwiek", ru: "какой когда-либо" }
  - { pl: "kiedykolwiek zechcesz", ru: "когда бы ты ни захотел" }
  - { pl: "kiedyś", ru: "когда-то" }
family:
  - { pl: "kiedy", ru: "когда", relation: root }
  - { pl: "ktokolwiek", ru: "кто угодно", relation: derived }
  - { pl: "kiedyś", ru: "когда-то", relation: derived }
etymology: "Из kiedy «когда» плюс частица -kolwiek, тем же способом, что ktokolwiek «кто угодно». Русское «когда-либо» собрано параллельно: «когда» плюс «либо»."
memory: "kiedykolwiek — «когда-нибудь, когда-либо», и собрано оно как весь свой ряд: kiedy плюс -kolwiek, наравне с ktokolwiek, cokolwiek, gdziekolwiek. В вопросе это «когда-нибудь»: Byłeś kiedykolwiek w Kanadzie? А при превосходной степени — «когда-либо»: najlepszy prezent, jaki kiedykolwiek dostałem. В простом утверждении обиходнее kiedyś."
idioms:
