notes:
  - { kind: false-friend, text: "Совпадение с русским «рискованный» полное, разница в корне: польское RYZYKO, с Y, а не «риск». Русское «риск» — мужского рода, польское RYZYKO — среднего: TO DUŻE RYZYKO. Глагол RYZYKOWAĆ — «рисковать». О человеке, который любит риск, скажут RYZYKANT, «рисковый парень»." }
  - { kind: usage, text: "Полная парадигма: RYZYKOWNY, RYZYKOWNIEJSZY, NAJRYZYKOWNIEJSZY. Простые степени обычны: RYZYKOWNIEJSZA INWESTYCJA. Форма для мужчин-людей RYZYKOWNI встречается редко, о людях скорее говорят ODWAŻNI или LEKKOMYŚLNI; но в карточке все три степени, как у всякого качественного прилагательного." }
  - { kind: government, text: "Рискованно что-то делать — TO RYZYKOWNE + инфинитив: RYZYKOWNE JEST JECHAĆ W NOCY. Рискованный для кого-то — RYZYKOWNY DLA KOGOŚ, DLA с родительным. В сравнении — NIŻ или OD." }
  - { kind: pronunciation, text: "Читается «рызыко́вны», четыре слога, ударение на предпоследнем. RY — твёрдое «ры», ZY — «зы», без русского «и». В RYZYKOWNIEJSZY: «рызыковне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в экономике и спорте: RYZYKOWNA INWESTYCJA, RYZYKOWNE ZAGRANIE. В разговоре о шутке или наряде — «на грани приличия». Поговорка KTO NIE RYZYKUJE, TEN NIE PIJE SZAMPANA — «кто не рискует, тот не пьёт шампанского», как и по-русски." }
collocations:
