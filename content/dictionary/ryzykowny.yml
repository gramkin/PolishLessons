  - { pl: "ryzykant", ru: "рисковый человек", relation: derived }
etymology: "От RYZYKO, заимствованного через итальянское risico или испанское riesgo, происхождение которых спорно: одни выводят его из арабского, другие из греческого «утёс», опасный для моряков. Польская форма с -YKO сохранила итальянское окончание, а русский взял короткое французское risque."
memory: "Ryzykowny — рискованный: ryzykowny plan, ryzykowna inwestycja. От ryzyko (ср. род!). Ryzykowniejszy, najryzykowniejszy. Kto nie ryzykuje, ten nie pije szampana. Читается «рызыко́вны»."
idioms:
  - { pl: "kto nie ryzykuje, ten nie pije szampana", ru: "кто не рискует, тот не пьёт шампанского" }
