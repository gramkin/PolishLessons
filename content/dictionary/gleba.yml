etymology: "Из латинского GLEBA «комок земли, глыба». То же слово пришло и в русский, но осталось книжным: «глеба» у нас встречается в исторических текстах о земле и о крестьянах, прикреплённых к ней. Польский же сделал латинское слово основным названием почвы, вытеснив им всё остальное, и построил на нём целое гнездо: GLEBOWY, GLEBOZNAWSTWO, GLEBOGRYZARKA. Разговорное значение «падение» появилось поздно, от образа падения лицом в землю."
memory: "То же латинское слово, что русская книжная «глеба» из «прикреплённый к глебе», только у поляков это обычное название почвы. Читается «гле́ба», где le даёт «ле». В местном падеже b смягчается: w glebie. И запомните разговорное dać glebę — «растянуться, грохнуться», от образа падения лицом в землю; услышите его гораздо чаще, чем научное значение."
idioms:
  - { pl: "dać glebę", ru: "растянуться, грохнуться" }
