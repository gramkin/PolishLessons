notes:
  - { kind: false-friend, text: "Русское соответствие есть, но книжное: «глеба», старое слово для земли и почвы, которое мы помним по выражению «прикреплённый к глебе» о крепостных. Оба слова взяты из латинского GLEBA «комок земли». Разница в употреблении: у нас это историзм, у поляков обычное повседневное слово, главный термин для почвы и в науке, и в разговоре о саде." }
  - { kind: usage, text: "Десять форм, женский род, твёрдая основа. В дательном и местном падежах B смягчается перед окончанием: GLEBA, но W GLEBIE, DZIĘKI GLEBIE. Родительный множественного — GLEB, без окончания, как у всех таких слов. Разговорное значение «падение» живёт только в единственном числе и в двух оборотах: DAĆ GLEBĘ и STRZELIĆ GLEBĘ, то есть «растянуться, упасть»." }
  - { kind: government, text: "В почве — W GLEBIE, предлог W с местным падежом. Обработка почвы — UPRAWA GLEBY, родительный без предлога, как и по-русски. Удобрять почву — NAWOZIĆ GLEBĘ, винительный без предлога. А разговорный оборот DAĆ GLEBĘ требует винительного и никогда не меняет формы: сказать DAĆ GLEBIE нельзя, это была бы уже другая конструкция, с дательным." }
  - { kind: pronunciation, text: "Читается «гле́ба», два слога, ударение на первом. Буква L перед гласной даёт «л», а мягкость берёт на себя сама гласная, поэтому первый слог это «ле», а не «лэ». В формах GLEBIE и GLEBĄ ударение остаётся на предпоследнем слоге: «гле́бе» и «гле́бон», где конечный носовой Ą звучит «он»." }
  - { kind: register, text: "В прямом значении слово научное и хозяйственное: GLEBOZNAWSTWO «почвоведение», GLEBA PIASZCZYSTA «песчаная почва», BADANIE GLEBY. В разговорной речи, особенно у молодёжи, GLEBA значит падение: DAŁ GLEBĘ значит «он грохнулся». Второе употребление шутливое и в письменной речи неуместно, но услышать его можно постоянно." }
