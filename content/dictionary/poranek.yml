notes:
  - { kind: usage, text: "У слова два родительных падежа единственного числа, и оба правильные: PORANKA и PORANKU. Это первый такой случай в словаре — все прежние дублеты были в родительном множественного (bagaży и bagażów, napoi и napojów, bani и bań). Напомню, что обычно выбор между -a и -u закреплён за словом наглухо и не выводится ни из чего: карточки OGON и ZGON показали это на минимальной паре, где слова различаются одной буквой, а родительные разные. Poranek показывает третью возможность — слово, которое выбора так и не сделало." }
  - { kind: usage, text: "Форма PORANKU при этом работает за три падежа: родительный, местный и звательный. Получается, что в родительном она делит место с PORANKA, а в местном и звательном стоит одна. Отдельно отметьте беглое e: PORANEK, но PORANKA, PORANKU, PORANKIEM — гласная суффикса -ek исчезает во всех косвенных формах, ровно как у PIESEK из партии 235 и у DOMEK, KOTEK." }
  - { kind: false-friend, text: "Повседневное слово для утра — RANO, а PORANEK книжнее и означает утро как отдельное, цельное событие: mglisty poranek, wczesnym porankiem. И вот тут ловушка: польское RANO значит «утро» и «утром», а похожее русское «рано» значит совсем другое — «не поздно». Сказать по-польски rano wstałem — это «я встал утром», а не «я встал рано»; для «рано» нужно WCZEŚNIE. Второе значение самого poranek — утренник, утреннее представление для детей или авторская встреча." }
collocations:
  - { pl: "wczesny poranek", ru: "раннее утро" }
  - { pl: "od poranka do wieczora", ru: "с утра до вечера" }
  - { pl: "poranek autorski", ru: "авторский утренник" }
family:
  - { pl: "rano", ru: "утро; утром", relation: root, id: rano }
  - { pl: "poranny", ru: "утренний", relation: derived }
etymology: "От RANO «утро», из праславянского *rano — того же корня, что русское «рано», с приставкой po- и суффиксом -ek. Значения у корня разошлись: польский закрепил за ним утро как время суток, русский — раннее время вообще. Поэтому rano и «рано» созвучны, но означают разное, а польское «рано» в русском смысле будет WCZEŚNIE."
memory: "Два родительных: poranka и poranku, оба верны — единственный такой случай. Беглое e, как у piesek. И rano значит «утро», а не «рано»."
idioms:
