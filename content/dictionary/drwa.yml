notes:
  - { kind: usage, text: "У слова нет единственного числа вовсе — ни одной формы. Словарь помечает его особым разрядом, который польская грамматика держит для таких слов, и весь набор состоит из пяти форм множественного: DRWA в именительном и винительном, DREW в родительном, DRWOM в дательном, DRWAMI в творительном, DRWACH в местном. Сказать «одно дрово» нельзя ни по-польски, ни по-русски: русские «дрова» устроены точно так же." }
  - { kind: usage, text: "Совпадение с русским тут приятное, но полагаться на него нельзя: разряды в двух языках не совпадают. Польское DRZWI «дверь» тоже не имеет единственного — говорят только drzwi, и «одна дверь» будет JEDNE DRZWI, — тогда как русская «дверь» единственное имеет и прекрасно им пользуется. Значит принадлежность к этому разряду приходится запоминать по каждому слову отдельно, а не выводить из русского." }
  - { kind: usage, text: "Родительный множественного — DREW, и это форма неправильная. Обычно такой родительный выглядит как голая основа: ras, klinik, środowisk, wymian, lig, stad. Здесь же в основе появляется гласная и переставляется согласный: drwa даёт DREW, а не drw или drwów. Отдельно заметьте родственное DREWNO «древесина, кусок дерева» — у него единственное есть, и путать два слова не стоит: drwa жгут, z drewna строят." }
collocations:
  - { pl: "rąbać drwa", ru: "рубить дрова" }
  - { pl: "sąg drew", ru: "сажень дров" }
  - { pl: "drwa na zimę", ru: "дрова на зиму" }
family:
  - { pl: "drewno", ru: "древесина", relation: derived }
  - { pl: "drzewo", ru: "дерево", relation: root, id: drzewo }
etymology: "Из праславянского *drъva, множественного от *drъvo «дерево» — того же слова, что русские «дрова» и «древо». Оба языка оставили за этой формой только множественное число и только значение топлива, а для дерева как растения завели отдельные слова: польское DRZEWO, русское «дерево». Поэтому drwa, drzewo и drewno — три ветви одного корня, разошедшиеся по трём смыслам."
memory: "Единственного числа нет совсем: пять форм, все множественные. Родительный неправильный — drew. И не путать с drewno «древесина», у которого единственное есть."
idioms:
