# review
id: nastepowac
format: 2
lemma: "następować"
rank: 2306
pos: verb
aspect: imperf
aspectPair: nastapic
pron: { cyr: "настэмпо́ваць" }
senses:
  - id: follow
    ru: "следовать, наступать (за чем-л.)"
    examples:
      - pl: "Jedno pytanie następowało po drugim."
        ru: "Один вопрос следовал за другим."
        source: { kind: translated, id: 989447 }
      - pl: "Tego typu zmiany nie następują tylko w naszym kraju, lecz na całym świecie."
        ru: "Такого рода перемены происходят не только в нашей стране."
        source: { kind: translated, id: 3385478 }
      - pl: "Powiedział, co następuje."
        ru: "Он сказал следующее."
        source: { kind: translated, id: 606064 }
  - id: following
    ru: "следующий (причастие następujący)"
    examples:
      - pl: "Rozważ następujący problem."
        ru: "Рассмотри следующую задачу."
        source: { kind: translated, id: 4952847 }
      - pl: "Wyniki były następujące."
        ru: "Результаты были следующие."
        source: { kind: translated, id: 776452 }
notes:
  - { kind: usage, text: "Причастие następujący «следующий» и оборот co następuje «следующее» встречаются намного чаще личных форм: Strony uzgodniły, co następuje «Стороны договорились о следующем»." }
  - { kind: government, text: "Следовать за чем-л. — po с предложным: następować po sobie «следовать друг за другом»." }
  - { kind: false-friend, text: "Корень stąpać «ступать»: наступать — значит ставить ногу следом. Русское «наступать» и «следующий» разводят этот смысл по двум корням." }
  - { kind: usage, text: "Совершенный вид — nastąpić." }
collocations:
  - { pl: "co następuje", ru: "следующее" }
  - { pl: "następujący sposób", ru: "следующий способ" }
etymology: "na- + stępować, от stąpać «ступать»; ср. русское «наступать», «поступь»."
memory: "następować — «следовать, наступать», но в речи чаще всего встречается причастие następujący «следующий» и оборот co następuje «следующее». Совершенный вид — nastąpić."
idioms:
  - { pl: "co następuje", ru: "следующее" }
formExamplesSkip:
  - { form: "następowano", reason: "безличная форма на -no предполагает человека-деятеля, а подлежащее у następować — событие, которое идёт за другим, но не человек, поэтому формы następowano живой язык не образует" }
