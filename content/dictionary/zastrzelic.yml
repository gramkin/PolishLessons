# review
id: zastrzelic
format: 2
lemma: "zastrzelić"
rank: 815
pos: verb
aspect: perf
pron: { cyr: "застшэ́лиць" }
senses:
  - id: shoot
    ru: "застрелить"
    examples:
      - pl: "Myśliwy zastrzelił lisa."
        ru: "Охотник застрелил лису."
        source: { kind: tatoeba, id: 3481846 }
      - pl: "John złapał tygrysa i zastrzelił dwa lwy."
        ru: "Джон поймал тигра и застрелил двух львов."
        source: { kind: tatoeba, id: 10091405 }
      - pl: "Ktoś próbował zastrzelić Toma."
        ru: "Кто-то пытался застрелить Тома."
        source: { kind: translated, id: 3954281 }
  - id: threat
    ru: "о выстреле в будущем"
    examples:
      - pl: "Zastrzelę go."
        ru: "Я пристрелю его."
        source: { kind: tatoeba, id: 526087 }
      - pl: "Zastrzelę cię."
        ru: "Я тебя застрелю."
        source: { kind: translated, id: 8715151 }
      - pl: "Nikogo nie zastrzeliłem."
        ru: "Я никого не застрелил."
        source: { kind: translated, id: 3616559 }
  - id: passive
    ru: "zastrzelony — застреленный, убитый выстрелом"
    examples:
      - pl: "Tom został zastrzelony."
        ru: "Том был застрелен."
        source: { kind: translated, id: 8630225 }
      - pl: "Nie chcę być zastrzelony."
        ru: "Я не хочу быть застреленным."
        source: { kind: translated, id: 3945586 }
      - pl: "To w tym miejscu w 1980 roku zastrzelono Johna Lennona."
        ru: "Именно здесь в тысяча девятьсот восьмидесятом году застрелили Джона Леннона."
        source: { kind: translated, id: 714990 }
notes:
  - { kind: government, text: "zastrzelić kogoś «застрелить кого-то» — винительный падеж. С się глагол значит «застрелиться»: Zastrzeliła się." }
  - { kind: usage, text: "Приставка za- добавляет к strzelać «стрелять» значение доведённого до конца действия, ровно как русское «за-» в «застрелить»." }
  - { kind: usage, text: "Ранить выстрелом — postrzelić, а просто выстрелить — strzelić. Выстрел — strzał." }
  - { kind: usage, text: "Несовершенный вид — zastrzeliwać, но он встречается редко: обычно говорят strzelać do kogoś «стрелять в кого-то»." }
collocations:
  - { pl: "zastrzelić kogoś", ru: "застрелить кого-то" }
  - { pl: "został zastrzelony", ru: "был застрелен" }
  - { pl: "zastrzelić się", ru: "застрелиться" }
  - { pl: "strzał", ru: "выстрел" }
family:
  - { pl: "strzelać", ru: "стрелять", relation: root, id: strzelac }
  - { pl: "strzał", ru: "выстрел", relation: derived }
  - { pl: "postrzelić", ru: "ранить выстрелом", relation: derived }
etymology: "Из za- + strzelić «выстрелить», от strzała «стрела». Русское «застрелить» собрано ровно так же, и приставка за- работает одинаково."
memory: "zastrzelić — «застрелить». Приставка za- доводит strzelać «стрелять» до результата, как и русское «за-». С się выходит «застрелиться». Ранить выстрелом — postrzelić, выстрел — strzał."
idioms:
  - { pl: "zastrzelić kogoś", ru: "застрелить кого-то" }
  - { pl: "został zastrzelony", ru: "был застрелен" }
  - { pl: "zastrzelić się", ru: "застрелиться" }
