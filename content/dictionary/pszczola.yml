notes:
  - { kind: false-friend, text: "Слово то же, что русская «пчела», но на слух этого не угадать. Праславянская основа дала у нас «пчелу», а у поляков PSZCZOŁA, и всё различие в начале: польское сочетание PSZCZ отвечает русскому «пч». Запомнив это соответствие, вы перестанете слышать здесь чужое слово. А MIÓD при «мёде» лежит в том же гнезде понятий и узнаётся сразу." }
  - { kind: usage, text: "Десять форм, женский род. Обратите внимание на родительный множественного: PSZCZÓŁ, с Ó вместо O. Так работает польское удлинение гласной в слоге без окончания, то же самое видно в STÓŁ при STOŁU и в MIÓD при MIODU. В дательном и местном падежах получается PSZCZOLE, с Ł, перешедшим в L перед окончанием -E." }
  - { kind: government, text: "Ужалила пчела — UŻĄDLIŁA PSZCZOŁA, именительный, подлежащее. А «ужаленный пчелой» — UŻĄDLONY PRZEZ PSZCZOŁĘ, предлог PRZEZ с винительным, тогда как русский поставит творительный без предлога. Рой пчёл — RÓJ PSZCZÓŁ, родительный множественного. Трудолюбивый как пчела — PRACOWITY JAK PSZCZOŁA, именительный после JAK." }
  - { kind: pronunciation, text: "Читается «пшчо́уа», три слога, ударение на предпоследнем. Начало слова самое трудное: PSZCZ даёт «пшч», то есть «п», потом «ш», потом «ч», три согласных подряд и ни одной гласной. Буква Ł даёт «у», поэтому конец слова это «уа». В родительном множественного PSZCZÓŁ звучит «пшчуу», с двумя «у» подряд." }
  - { kind: register, text: "Слово нейтральное и совершенно обиходное. Пчеловода называют PSZCZELARZ, а само дело — PSZCZELARSTWO, и в Польше оно в большом почёте. Сравнение PRACOWITY JAK PSZCZOŁA живое и частое, о человеке, который не сидит без дела. А PSZCZELI MIÓD на этикетке значит просто «пчелиный мёд», в отличие от сиропов." }
collocations:
