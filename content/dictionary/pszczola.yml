etymology: "Праславянское слово от корня со значением «жужжать», того же, что в польском BZYCZEĆ. Пчелу назвали по звуку. Русское «пчела» и польское PSZCZOŁA — одно и то же слово, разошедшееся только в начале: у нас «пч», у поляков PSZCZ. Соответствие это надёжное, и стоит его запомнить, потому что иначе родство здесь просто не слышно."
memory: "Пчела, и слово то же, что русское, только на слух не узнать: польское pszcz отвечает нашему «пч», отсюда pszczola при «пчеле». Читается «пшчо́уа», где pszcz даёт три согласных подряд, а l со штрихом — «у». В родительном множественного o удлиняется в o с черточкой: pszczol, как stol при stolu. Сравнение pracowity jak pszczola живое и частое."
idioms:
