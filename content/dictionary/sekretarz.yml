etymology: "Из средневекового латинского SECRETARIUS «тот, кому доверены тайны», от SECRETUM «тайна» и далее от SECERNERE «отделять, откладывать в сторону»: тайна есть то, что отложено от общего знания. Исходно это был доверенный писец при особе, знавший то, что не предназначалось другим, и обе должности — скромная и высокая — выросли из этого одного значения. Русское «секретарь» прошло тот же путь через латынь и немецкий, поэтому слова совпадают. Корень виден и в SEKRET, и в SEKRETNY, и в русской «секреции» — последнее уже прямо от «отделять», в медицинском смысле. Суффикс -ARZ, которым польский заменил латинское -ARIUS, тот же, что в PISARZ и LEKARZ, и он же стоит за русским «-арь»."
memory: "Весомее русского «секретаря»: называет и помощника, и высокую должность — sekretarz stanu, sekretarz generalny. Женская форма sekretarka к должности не прилагается, о женщине скажут pani sekretarz. Родительный множественного двойной: sekretarzy (обычнее) и sekretarzów. Суффикс -arz даёт профессии: pisarz, lekarz, kucharz. От латинского secretum «тайна» — тот, кому доверены тайны."
