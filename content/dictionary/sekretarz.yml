notes:
  - { kind: false-friend, text: "С русским «секретарём» слово совпадает, но его вес в польском выше, и это стоит знать. SEKRETARZ по-польски называет не только помощника, но и высокую должность: SEKRETARZ STANU «госсекретарь», SEKRETARZ GENERALNY, SEKRETARZ SĄDU «секретарь суда». В русском «секретарь» без уточнения чаще значит помощника, а для должности нужно добавлять слово. Отдельно помните женскую форму: SEKRETARKA — это помощница и, в другом значении, автоответчик, и к высокой должности она не прилагается. О женщине на посту скажут PANI SEKRETARZ, не меняя слова, или всё чаще PANI SEKRETARZ STANU." }
  - { kind: usage, text: "Родительный множественного имеет две формы, и обе нормативны: SEKRETARZY и SEKRETARZÓW. Первая обычнее, вторая встречается в официальных текстах и в старых документах. Выбирая, безопаснее сказать SEKRETARZY. Суффикс -ARZ в польском образует названия людей по занятию и крайне продуктивен: PISARZ «писатель», LEKARZ «врач», KUCHARZ «повар», DRUKARZ «печатник». Он отвечает русскому «-арь» в «пекаре» и «-тель» в «писателе», и по нему легко узнать профессию в незнакомом слове." }
  - { kind: pronunciation, text: "Читается «сэкрэ́таж», ударение на предпоследнем слоге. Оба E звучат «э» и не смягчают согласных: «сэ-крэ-», а не «се-кре-». Конечное RZ даёт «ж», и на конце слова оно оглушается полностью, поэтому «таж», а не «таж» с призвуком. В местном и звательном падеже SEKRETARZU звучит «сэкрэ́тажу», а в именительном множественного SEKRETARZE — «сэкрэ́таже»." }
  - { kind: government, text: "Существительное мужского рода одушевлённое, мужско-личного разряда. Винительный единственного равен родительному: WIDZĘ SEKRETARZA. Чего секретарь — родительный без предлога: SEKRETARZ KOMISJI, SEKRETARZ SĄDU, SEKRETARZ PARTII. Обращение в звательном обязательно в официальной речи: PANIE SEKRETARZU «господин секретарь», и эту формулу надо узнавать на слух, потому что она частотна в учреждениях. При отрицании винительный остаётся родительным: NIE WIDZĘ SEKRETARZA." }
