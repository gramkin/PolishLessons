etymology: "Из позднелатинского potentialis, от potentia «сила, мощь», а то от posse «мочь». Потенциальное — то, что может стать действительным. Русское «потенциальный» и польское POTENCJALNY пришли одним путём, через немецкий и французский. Польское -CJ- на месте латинского -TI- — обычное соответствие: NACJA, STACJA, POTENCJA."
memory: "Potencjalny — потенциальный, возможный: potencjalny klient, potencjalne zagrożenie. В польском слово обычное, не канцелярское. Читается «потэнцья́льны»."
idioms:
