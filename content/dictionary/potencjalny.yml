        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Значение то же, что у русского «потенциальный», но польское слово намного чаще встречается в обычной речи. Где русский скажет «возможный» или «будущий», поляк охотно скажет POTENCJALNY: POTENCJALNY KUPIEC, «возможный покупатель», POTENCJALNY TEŚĆ, «будущий тесть» в шутку. Слово не звучит канцелярски." }
  - { kind: usage, text: "Степеней сравнения нет. Все одиннадцать форм живые. Форма для мужчин-людей POTENCJALNI очень частая: POTENCJALNI KLIENCI, POTENCJALNI KUPCY, POTENCJALNI PRACODAWCY. Наречие POTENCJALNIE значит «потенциально, теоретически»: TO POTENCJALNIE NIEBEZPIECZNE." }
  - { kind: government, text: "Ставится перед существительным, когда говорят о людях и событиях: POTENCJALNY KLIENT, POTENCJALNE RYZYKO. После — в терминах: ENERGIA POTENCJALNA. Падежных требований нет." }
  - { kind: pronunciation, text: "Читается «потэнцья́льны», пять слогов, ударение на предпоследнем: «тэн-цья́ль». CJA даёт «цья», L перед N мягкая, «ль». Сравните с POTENCJAŁ «потэ́нцьяу», где Ł даёт «у»." }
  - { kind: register, text: "Нейтральное слово, привычное в бизнесе и журналистике. В разговоре его тоже не стесняются: TO POTENCJALNY PROBLEM, «это может стать проблемой». В рекламных текстах POTENCJALNY KLIENT — стандартный термин." }
collocations:
  - { pl: "potencjalny klient", ru: "потенциальный клиент" }
  - { pl: "potencjalne zagrożenie", ru: "потенциальная угроза" }
  - { pl: "energia potencjalna", ru: "потенциальная энергия" }
family:
  - { pl: "potencjał", ru: "потенциал", relation: root, id: potencjal }
