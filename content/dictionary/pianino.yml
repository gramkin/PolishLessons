# review
id: pianino
format: 2
lemma: "pianino"
rank: 4531
pos: noun
pron: { cyr: "пьяни́но" }
senses:
  - id: piano
    ru: "пианино"
    examples:
      - pl: "W salonie stoi stare pianino."
        ru: "В гостиной стоит старое пианино."
        source: { kind: authored }
      - pl: "Córka uczy się grać na pianinie."
        ru: "Дочь учится играть на пианино."
        source: { kind: authored }
      - pl: "Pianino trzeba nastroić."
        ru: "Пианино нужно настроить."
        source: { kind: authored }
      - pl: "Kupiliśmy używane pianino."
        ru: "Мы купили подержанное пианино."
        source: { kind: authored }
      - pl: "Grał na pianinie do późna w nocy."
        ru: "Он играл на пианино до поздней ночи."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PIANINO — вертикальное «пианино», а рояль — FORTEPIAN. В обиходе FORTEPIAN говорят и о пианино, а в музыкальной школе — о фортепиано как предмете: LEKCJE FORTEPIANU." }
  - { kind: usage, text: "Девять форм, средний род, склоняется: PIANINA, PIANINIE, PIANINEM. Родительный множественного — PIANIN." }
  - { kind: government, text: "Играть на пианино — GRAĆ NA PIANINIE, NA с местным, как в русском. Учиться игре — UCZYĆ SIĘ GRAĆ NA PIANINIE." }
  - { kind: pronunciation, text: "Читается «пьяни́но», ударение на предпоследнем слоге. PIA — один слог «пья»." }
collocations:
  - { pl: "grać na pianinie", ru: "играть на пианино" }
  - { pl: "nastroić pianino", ru: "настроить пианино" }
  - { pl: "stare pianino", ru: "старое пианино" }
family:
  - { pl: "fortepian", ru: "рояль; фортепиано", relation: root }
  - { pl: "pianista", ru: "пианист", relation: derived }
  - { pl: "pianistka", ru: "пианистка", relation: derived }
etymology: "Из итальянского, уменьшительное от слова «тихо, мягко»: FORTEPIANO — «громко-тихо», инструмент, на котором можно играть и громко, и тихо."
memory: "Pianino — пианино; fortepian — рояль. Читается «пьяни́но». Grać na pianinie — играть на пианино. Склоняется: na pianinie."
idioms:
  - { pl: "grać pierwsze skrzypce", ru: "играть первую скрипку" }
