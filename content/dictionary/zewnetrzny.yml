notes:
  - { kind: usage, text: "У этого прилагательного одиннадцать форм, а не тридцать три, и причина грамматическая, а не случайная. Это прилагательное относительное: оно не описывает качество, а приписывает предмет к разряду, и степеней сравнения у него поэтому нет. Нельзя быть «более внешним», как нельзя быть более деревянным или более вчерашним. Сравните с MARNY «жалкий», у которого тридцать три формы, потому что жалким можно быть в разной мере. Если в черновике у прилагательного ровно одиннадцать форм, это и значит, что оно относительное, и степеней искать не надо." }
  - { kind: government, text: "Само прилагательное падежом не управляет, но два наречия того же гнезда управляют, и они употребительнее его. NA ZEWNĄTRZ значит «наружу» и «снаружи» и требует родительного: NA ZEWNĄTRZ BUDYNKU «снаружи здания», WYJDŹ NA ZEWNĄTRZ «выйди наружу». WEWNĄTRZ значит «внутри» и тоже берёт родительный: WEWNĄTRZ DOMU. Отдельно стоит Z ZEWNĄTRZ «извне». Русский в этих оборотах обходится без родительного и ставит предлог: «снаружи здания» совпало случайно, а «выйди наружу» уже устроено иначе." }
  - { kind: false-friend, text: "Опасность здесь не в русском языке, а внутри польского: ZEWNĘTRZNY «внешний» и WEWNĘTRZNY «внутренний» различаются двумя буквами в начале слова и означают прямо противоположное. SPRAWY WEWNĘTRZNE это «внутренние дела», а SPRAWY ZEWNĘTRZNE — внешние, и спутать их в документе дорого. Запомнить проще через наречия: WEWNĄTRZ начинается с WE, как «внутри», а ZEWNĄTRZ с Z, как «снаружи», от «из»." }
  - { kind: pronunciation, text: "Читается «зэвнэ́нтшны», три слога, ударение на предпоследнем. Буква Ę перед T звучит как «эн», поэтому середина слова «нэнт». Сочетание TRZ даёт «тш», как в TRZY «тшы», а не «тр». Начальное ZEW читается «зэв». В наречии ZEWNĄTRZ носовой другой: Ą даёт «он», и слышно «зэвно́нтш»." }
  - { kind: register, text: "Слово принадлежит официальному и техническому языку: HANDEL ZEWNĘTRZNY «внешняя торговля», POLITYKA ZEWNĘTRZNA «внешняя политика», DYSK ZEWNĘTRZNY «внешний диск», DO UŻYTKU ZEWNĘTRZNEGO «для наружного применения» на упаковке лекарства. О человеке говорят WYGLĄD ZEWNĘTRZNY «внешний вид». В бытовой речи вместо прилагательного чаще скажут наречием: NA ZEWNĄTRZ JEST ZIMNO «снаружи холодно»." }
