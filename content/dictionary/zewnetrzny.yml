etymology: "Образовано от наречия ZEWNĄTRZ «снаружи», а оно само сложено из приставки Z- «из» и основы WNĄTRZ, той же, что в WNĘTRZE «внутренность». Получается буквально «из-внутри», то есть взгляд наружу изнутри. Основа восходит к праславянскому корню, от которого русские «нутро», «внутрь», «внутренний». Русский для «внешнего» взял другое слово, «вне», и построил «внешний» от него, поэтому внешнее сходство двух прилагательных потеряно, хотя корень внутренней половины общий. Из того же гнезда WNĘTRZE, WEWNĄTRZ и WNĘTRZNOŚCI «внутренности»."
memory: "Одиннадцать форм вместо тридцати трёх, и это грамматический знак: прилагательное относительное, степеней сравнения у него нет, потому что нельзя быть «более внешним». Главная ловушка внутри польского: zewnętrzny «внешний» и wewnętrzny «внутренний» различаются двумя буквами. Проще держать в голове наречия: wewnątrz «внутри», zewnątrz «снаружи», оба с родительным, na zewnątrz budynku. Читается «зэвнэ́нтшны», где trz это «тш»."
