etymology: "От ZIEMIA с суффиксом -AK: буквально «земляной», то, что растёт в земле. Название родилось в польском сам, когда картофель завезли из Америки через Германию в восемнадцатом веке и понадобилось его как-то звать. Немецкое KARTOFFEL тоже вошло в язык и осталось в областной речи, а русский взял именно немецкое слово и сделал его единственным. Поэтому в этой паре языки поменялись привычками: обычно заимствование берёт польский, а свой корень оставляет русский, здесь же наоборот. Суффикс -AK очень плодовит и образует названия предметов по признаку: PRZYSTANEK, PIERWSZAK, SIÓDMAK, и в каждом случае значение выводится из основы без словаря."
memory: "Звучит как «земляк», значит «картошка». Построено от ziemia с суффиксом -ak, то есть «земляной»: название польский придумал сам, когда картофель завезли из Германии, а русский взял немецкое Kartoffel. Земляк в русском смысле это rodak, в разговоре ziomek. Областное kartofel в Польше тоже есть, а в Познани говорят pyra. В мундире — ziemniaki w mundurkach, образ тот же самый."
