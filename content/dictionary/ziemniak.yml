notes:
  - { kind: false-friend, text: "Слово построено от ZIEMIA «земля», и русскому слышится «земляк» — а значит оно «картофель». Русский «земляк», то есть человек из тех же мест, по-польски называется RODAK или, в разговоре, ZIOMEK; последнее в молодёжной речи стало значить просто «приятель». Второе: польский знает и слово KARTOFEL, но оно областное, употребительное главным образом в Великопольше, а в Познани картошку зовут PYRA. Литературная норма по всей стране — ZIEMNIAK. Третье: во множественном ZIEMNIAKI означает и овощ, и готовое блюдо, ровно как русская «картошка»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — ZIEMNIAKU, с окончанием -U, потому что основа кончается на заднеязычный K: так же идут PASKU и OŚRODKU. Винительный равен именительному. Родительный множественного — ZIEMNIAKÓW. В разговоре о еде слово почти всегда стоит во множественном: ZIEMNIAKI NA OBIAD, OBIERAĆ ZIEMNIAKI «чистить картошку». Единственное число употребляется, когда речь о клубне поштучно: JEDEN ZIEMNIAK. Уменьшительное ZIEMNIACZEK ласковое и кулинарное." }
  - { kind: pronunciation, text: "Читается «земня́к», два слога, ударение на втором. Начальное ZIE даёт мягкое «зе», а сочетание MNIA — «мня» с двумя мягкими согласными подряд. Конечное K твёрдое. В форме ZIEMNIAKA слышно «земня́ка», в форме ZIEMNIAKIEM — «земня́кем». Во множественном ZIEMNIAKI звучит «земня́ки». В форме ZIEMNIAKÓW буква Ó даёт «у», а конечное W оглушается: «земня́куф»." }
  - { kind: register, text: "Слово нейтральное и ежедневное: картофель в Польше основной гарнир, и формул вокруг него много. ZIEMNIAKI W MUNDURKACH значит «картошка в мундире», причём MUNDUREK это уменьшительное от MUNDUR, то есть образ тот же самый, что в русском. PUREE Z ZIEMNIAKÓW «картофельное пюре», PLACKI ZIEMNIACZANE «драники». Прилагательное ZIEMNIACZANY употребляется в кулинарии, а MĄKA ZIEMNIACZANA это картофельный крахмал, который в рецептах встречается постоянно. Пренебрежительного оттенка у слова нет." }
