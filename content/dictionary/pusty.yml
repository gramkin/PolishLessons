# review
id: pusty
format: 2
lemma: "pusty"
rank: 1214
pos: adj
pron: { cyr: "пу́сты" }
senses:
  - id: empty
    ru: "пустой (о вместилище, помещении)"
    examples:
      - pl: "Jedna z toreb jest zupełnie pusta."
        ru: "Одна из сумок совершенно пуста."
        source: { kind: tatoeba, id: 960909 }
      - pl: "Pokój jest pusty."
        ru: "Комната пустая."
        source: { kind: translated, id: 3853629 }
      - pl: "Pudełko jest puste."
        ru: "Коробка пустая."
        source: { kind: translated, id: 494577 }
  - id: empty-hands
    ru: "z pustymi rękami — с пустыми руками"
    examples:
      - pl: "Nie chciałam przyjść z pustymi rękami."
        ru: "Я не хотела приходить с пустыми руками."
        source: { kind: tatoeba, id: 12987542 }
      - pl: "Nie idź z pustymi rękami."
        ru: "Не ходи с пустыми руками."
        source: { kind: translated, id: 989351 }
      - pl: "Przeważnie wracaliśmy z pustymi rękami."
        ru: "Чаще всего мы возвращались с пустыми руками."
        source: { kind: translated, id: 8537496 }
  - id: stomach
    ru: "na pusty żołądek — натощак, на голодный желудок"
    examples:
      - pl: "Picie na pusty żołądek jest szkodliwe."
        ru: "Пить натощак вредно."
        source: { kind: tatoeba, id: 9532556 }
      - pl: "Nie potrafię się uczyć z pustym żołądkiem."
        ru: "Я не могу учиться на голодный желудок."
        source: { kind: translated, id: 6905339 }
      - pl: "Nie bierz leków na pusty żołądek."
        ru: "Не принимай лекарства натощак."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Форма puściejsi оставлена без примеров: pusty не образует простой сравнительной степени, говорят bardziej pusty «более пустой»." }
  - { kind: usage, text: "Pusty покрывает и «пустой», и «порожний»: pusta butelka «пустая бутылка», pusty pokój «пустая комната», pusty autobus «пустой автобус»." }
  - { kind: government, text: "Устойчивое z pustymi rękami «с пустыми руками» стоит в творительном падеже множественного числа." }
  - { kind: usage, text: "Переносно — «пустой, бессодержательный»: puste słowa «пустые слова», pusty dźwięk «пустой звук»." }
  - { kind: false-friend, text: "Форма puści в текстах почти всегда оказывается глаголом puścić «отпустить», а не формой этого прилагательного." }
collocations:
  - { pl: "pusty pokój", ru: "пустая комната" }
  - { pl: "z pustymi rękami", ru: "с пустыми руками" }
  - { pl: "na pusty żołądek", ru: "натощак" }
  - { pl: "puste słowa", ru: "пустые слова" }
etymology: "Праславянское *pustъ — то же слово, что русское «пустой». Отсюда же pustynia «пустыня» и pustkowie «пустошь»."
memory: "pusty — «пустой», один в один с русским. Запомните три оборота: z pustymi rękami «с пустыми руками», na pusty żołądek «натощак» и puste słowa «пустые слова». И осторожно с формой puści — это обычно глагол puścić."
idioms:
  - { pl: "z pustymi rękami", ru: "с пустыми руками" }
  - { pl: "na pusty żołądek", ru: "натощак" }
  - { pl: "puste słowa", ru: "пустые слова" }
