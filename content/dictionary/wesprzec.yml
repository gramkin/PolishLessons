        ru: "Депутаты поддержали заявку единогласно."
        source: { kind: authored }
  - id: lean
    ru: "wesprzeć się — опереться"
    examples:
      - pl: "Wsparł się o ścianę, żeby złapać oddech."
        ru: "Он опёрся о стену, чтобы отдышаться."
        source: { kind: authored }
