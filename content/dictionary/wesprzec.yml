notes:
  - { kind: false-friend, text: "КОРЕНЬ «ПЕРЕТЬ», И ЧЕРЕДОВАНИЕ ТОЖЕ ЗНАКОМОЕ. Wesprzeć собрано из ws- и przeć, а przeć — это русское «переть». Отсюда и смысл: поддержать значит подпереть. Главное — перелом в основе: в инфинитиве и будущем времени prze (wesprzeć, wesprę, wesprzesz), а в прошедшем, причастии и существительном par (wsparł, wsparty, wsparcie). Русский делает ровно то же самое: «запереть» даёт «запер», «умереть» даёт «умер». Только там на месте перелома ноль, а в польском появляется a." }
  - { kind: government, text: "Поддерживают КОГО или ЧТО — винительный падеж: wesprzeć rodzinę, wniosek, projekt. Чем — творительный без предлога: wesprzeć kogoś pieniędzmi, radą, głosem. Возвратное wesprzeć się значит «опереться» и идёт либо с na и предложным (wesprzeć się na lasce), либо с o и винительным (wesprzeć się o ścianę) — различие ровно то же, что между русскими «опереться на» и «опереться о»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — wspierać. Отглагольное существительное wsparcie «поддержка» живёт самостоятельной жизнью и встречается чаще самого глагола: wsparcie finansowe, wsparcie techniczne «техподдержка», udzielić wsparcia «оказать поддержку». Причастие wsparty работает в двух смыслах сразу: «поддержанный» (projekt wsparty przez miasto) и «опирающийся» (dach wsparty na słupach)." }
  - { kind: pronunciation, text: "Начальное w перед глухим s оглушается, а rz после p звучит как ш. Поэтому wesprzeć — это «вэ́спшэць», а wsparł — «фспау». Оба правила обычные, но на таком стыке согласных они срабатывают разом, и звучание заметно расходится с написанием." }
collocations:
  - { pl: "wsparcie finansowe", ru: "финансовая поддержка" }
  - { pl: "wesprzeć się na lasce", ru: "опереться на трость" }
  - { pl: "udzielić wsparcia", ru: "оказать поддержку" }
family:
