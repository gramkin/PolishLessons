# review
id: wesprzec
format: 2
lemma: "wesprzeć"
rank: 2118
pos: verb
pron: { cyr: "вэ́спшэць" }
senses:
  - id: support
    ru: "поддержать (помочь)"
    examples:
      - pl: "Rodzice wsparli go finansowo przez pierwsze lata."
