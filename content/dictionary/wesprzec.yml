  - { pl: "wsparcie", ru: "поддержка", relation: derived, id: wsparcie }
  - { pl: "przeć", ru: "переть, напирать", relation: root }
  - { pl: "oprzeć", ru: "опереть; опереться", relation: derived, id: oprzec }
etymology: "Приставка ws- (русское вз-) плюс przeć «переть, напирать», от общеславянского корня, давшего «переть», «опереться», «подпереть». Чередование prze/par отвечает русскому «переть»/«пёр». От того же гнезда wspierać, wsparcie «поддержка», podpora «опора», opór «сопротивление» и oprzeć się «опереться; воспротивиться»."
memory: "wesprzeć — «поддержать», то есть буквально «подпереть»: корень тот же, что в «переть». Запомните перелом в основе: wesprzeć и wesprę, но wsparł, wsparty, wsparcie — как русское «запереть», но «запер». И звучит это не так, как пишется: «вэ́спшэць», «фспау»."
idioms:
  - { pl: "udzielić wsparcia", ru: "оказать поддержку" }
  - { pl: "wesprzeć się na kimś", ru: "опереться на кого-л." }
  - { pl: "wsparcie techniczne", ru: "техническая поддержка" }
