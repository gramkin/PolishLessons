        ru: "Она опёрлась на плечо сына."
        source: { kind: authored }
  - id: wsparcie
    ru: "wsparcie — поддержка"
    examples:
      - pl: "Wsparcie techniczne odpowiedziało po minucie."
        ru: "Техподдержка ответила через минуту."
        source: { kind: authored }
      - pl: "Bez wsparcia rodziny nie dałby rady."
        ru: "Без поддержки семьи он не справился бы."
