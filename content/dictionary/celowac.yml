# review
id: celowac
format: 2
lemma: "celować"
rank: 3819
pos: verb
pron: { cyr: "цэло́ваць" }
senses:
  - id: aim
    ru: "целиться"
    examples:
      - pl: "Myśliwy celuje do jelenia."
        ru: "Охотник целится в оленя."
        source: { kind: authored }
      - pl: "Celuj w środek tarczy."
        ru: "Целься в центр мишени."
        source: { kind: authored }
      - pl: "Policjant celował w opony samochodu."
        ru: "Полицейский целился в шины машины."
        source: { kind: authored }
  - id: target
    ru: "метить, нацеливаться (на рынок, цель); преуспевать (книжно)"
    examples:
      - pl: "Firma celuje w młodych klientów."
        ru: "Фирма нацелена на молодых клиентов."
        source: { kind: authored }
      - pl: "Celujemy w złoty medal."
        ru: "Мы метим на золотую медаль."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CELOWAĆ — «целиться», а не «целовать» (CAŁOWAĆ)! Это классическая ловушка: CELUJE DO NIEGO — «целится в него», а CAŁUJE GO — «целует его». Корень — CEL «цель»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYCELOWAĆ. Спряжение на -UJĘ: CELUJĘ, CELUJESZ, CELUJĄ. Глагол непереходный, страдательные причастия в карточку не включены; прилагательное CELOWANY «целевой» — отдельное слово: TERAPIA CELOWANA." }
  - { kind: government, text: "В кого — DO с родительным: CELOWAĆ DO ZŁODZIEJA. Во что — W с винительным: CELOWAĆ W TARCZĘ. Из чего — Z с родительным: CELOWAĆ Z KARABINU. Книжное «преуспевать в» — W с предложным: CELOWAĆ W MATEMATYCE." }
  - { kind: pronunciation, text: "Читается «цэло́ваць»: C — «ц», ударение на предпоследнем слоге. CELUJĘ — «цэлу́е». Сравните: CAŁUJĘ — «цау́е» «целую»." }
  - { kind: register, text: "Нейтральное слово: охота, спорт, маркетинг. Значение «преуспевать» — книжное и старомодное." }
collocations:
  - { pl: "celować do celu", ru: "целиться в цель" }
  - { pl: "celować z broni", ru: "целиться из оружия" }
  - { pl: "celować w rynek", ru: "нацеливаться на рынок" }
family:
  - { pl: "cel", ru: "цель", relation: root, id: cel }
  - { pl: "wycelować", ru: "нацелиться, прицелиться", relation: aspect }
  - { pl: "celny", ru: "меткий", relation: derived }
etymology: "От CEL «цель», которое польский взял из немецкого ZIEL «цель». Русское «цель» — то же заимствование. Глагол образован польским суффиксом -OWAĆ."
memory: "Celować — целиться: celuje do jelenia. Не путать с całować — «целовать»! Cel — цель."
idioms:
  - { pl: "celować w dziesiątkę", ru: "попадать в десятку" }
