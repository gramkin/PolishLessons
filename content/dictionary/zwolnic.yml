# review
id: zwolnic
format: 2
lemma: "zwolnić"
rank: 644
pos: verb
aspect: perf
pron: { cyr: "зво́льниць" }
senses:
  - id: fire
    ru: "уволить"
    examples:
      - pl: "Nie może mnie pan zwolnić."
        ru: "Вы не можете меня уволить."
        source: { kind: tatoeba, id: 3587277 }
      - pl: "Zwolniłem go."
        ru: "Я его уволил."
        source: { kind: tatoeba, id: 6533999 }
      - pl: "Zwolnili mnie."
        ru: "Меня уволили."
        source: { kind: translated, id: 2282522 }
  - id: fired
    ru: "zostać zwolnionym — быть уволенным"
    examples:
      - pl: "Tom bał się, że zostanie zwolniony."
        ru: "Том боялся, что его уволят."
        source: { kind: tatoeba, id: 8108543 }
      - pl: "Tom został zwolniony w październiku."
        ru: "Том был уволен в октябре."
        source: { kind: tatoeba, id: 10602903 }
      - pl: "Zostali zwolnieni."
        ru: "Их уволили."
        source: { kind: translated, id: 11750100 }
  - id: free-up
    ru: "освободить (место, память, номер)"
    examples:
      - pl: "Usuń niepotrzebne pliki aby zwolnić pamięć."
        ru: "Удали ненужные файлы, чтобы освободить память."
        source: { kind: tatoeba, id: 12889065 }
      - pl: "Zwolnij miejsce na dysku."
        ru: "Освободи место на диске."
        source: { kind: authored }
      - pl: "Trzeba zwolnić pokój do południa."
        ru: "Нужно освободить номер до полудня."
        source: { kind: authored }
  - id: slow-down
    ru: "Zwolnij! — Сбавь скорость!"
    note: "Третье живое значение — о скорости."
    examples:
      - pl: "Zwolnij!"
        ru: "Сбавь скорость!"
        source: { kind: translated, id: 8617598 }
      - pl: "Zwolnijcie nieco."
        ru: "Сбавьте немного."
        source: { kind: translated, id: 12360292 }
      - pl: "Scena została pokazana w zwolnionym tempie."
        ru: "Сцену показали в замедленном темпе."
        source: { kind: translated, id: 6404016 }
notes:
  - { kind: usage, text: "Ключ к слову — прилагательное wolny, которое значит и «свободный», и «медленный». Отсюда все три значения глагола: zwolnić pracownika «уволить», то есть освободить от должности; zwolnić miejsce «освободить место»; Zwolnij! «Сбавь скорость!»." }
  - { kind: usage, text: "Существительное zwolnienie — это и «увольнение», и «больничный». Второе слышишь куда чаще: Byłem na zwolnieniu lekarskim «Я был на больничном»." }
  - { kind: usage, text: "w zwolnionym tempie — «в замедленном темпе»: и о съёмке, и о том, как разворачиваются события." }
  - { kind: usage, text: "Несовершенный вид — zwalniać. Родня: wolny «свободный, медленный», wolność «свобода», zwolnienie «увольнение; больничный»." }
collocations:
  - { pl: "zwolnić pracownika", ru: "уволить работника" }
  - { pl: "zwolnić miejsce", ru: "освободить место" }
  - { pl: "być na zwolnieniu", ru: "быть на больничном" }
  - { pl: "w zwolnionym tempie", ru: "в замедленном темпе" }
family:
  - { pl: "wolny", ru: "свободный; медленный", relation: root }
  - { pl: "zwalniać", ru: "увольнять; освобождать", relation: aspect }
  - { pl: "zwolnienie", ru: "увольнение; больничный", relation: derived }
  - { pl: "wolność", ru: "свобода", relation: derived }
etymology: "z- + wolny «свободный, медленный» — и оба значения прилагательного дали свои значения глаголу. Русское «вольный» из того же гнезда."
memory: "Ключ к слову — прилагательное wolny, которое значит и «свободный», и «медленный». Отсюда сразу три значения глагола: zwolnić pracownika «уволить», то есть освободить от должности; zwolnić miejsce «освободить место»; Zwolnij! «Сбавь скорость!». И запомните zwolnienie: это и «увольнение», и «больничный» — być na zwolnieniu значит «быть на больничном»."
idioms:
  - { pl: "być na zwolnieniu", ru: "быть на больничном" }
  - { pl: "w zwolnionym tempie", ru: "в замедленном темпе" }
  - { pl: "zwolnić tempo", ru: "сбавить темп" }
