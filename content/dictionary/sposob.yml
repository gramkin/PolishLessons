# review
id: sposob
format: 2
lemma: "sposób"
rank: 215
pos: noun
pron: { cyr: "спо́суп" }
senses:
  - id: way
    ru: "способ, метод"
    examples:
      - pl: "Jest mnóstwo innych sposobów."
        ru: "Есть множество других способов."
        source: { kind: tatoeba, id: 6109654 }
      - pl: "Znalazłem prosty sposób."
        ru: "Я нашёл простой способ."
        source: { kind: authored }
      - pl: "To najlepszy sposób na przeziębienie."
        ru: "Это лучшее средство от простуды."
        source: { kind: authored }
  - id: manner
    ru: "образ, манера (w ten sposób — таким образом)"
    examples:
      - pl: "W ten sposób znalazł się na ulicy."
        ru: "Так он оказался на улице."
        source: { kind: tatoeba, id: 13084371 }
      - pl: "W jaki sposób to zrobiłeś?"
        ru: "Каким образом ты это сделал?"
        source: { kind: authored }
      - pl: "Mówi w dziwny sposób."
        ru: "Он говорит странным образом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чередование в корне: sposób, но sposobu, sposobem — ó переходит в o во всех падежах, кроме именительного." }
  - { kind: usage, text: "w ten sposób — «таким образом»; w jaki sposób — «каким образом»; sposób na coś — «средство от чего-то»." }
collocations:
  - { pl: "w ten sposób", ru: "таким образом" }
  - { pl: "w jaki sposób", ru: "каким образом" }
  - { pl: "sposób na", ru: "средство от" }
  - { pl: "nie ma sposobu", ru: "нет способа" }
etymology: "Праславянское *sъposobъ; то же слово, что русское «способ»."
memory: "Чередование ó/o: sposób, но sposobu, sposobem. Две готовые связки: w ten sposób «таким образом» и sposób na coś «средство от чего-то»."
idioms:
  - { pl: "w ten sposób", ru: "таким образом" }
  - { pl: "w jaki sposób", ru: "каким образом" }
  - { pl: "nie ma sposobu", ru: "никак не получится" }
formExamplesSkip:
  - { form: "sposobie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
