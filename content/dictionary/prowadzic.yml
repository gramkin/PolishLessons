# review
id: prowadzic
format: 2
lemma: "prowadzić"
rank: 406
pos: verb
aspect: imperf
pron: { cyr: "прова́дзиць" }
senses:
  - id: lead
    ru: "вести (о дороге, о пути)"
    examples:
      - pl: "Droga prowadzi do stacji."
        ru: "Эта дорога ведёт к станции."
        source: { kind: tatoeba, id: 526352 }
      - pl: "Wszystkie drogi prowadzą do Rzymu."
        ru: "Все дороги ведут в Рим."
        source: { kind: tatoeba, id: 525822 }
      - pl: "Czy ta droga prowadzi na dworzec?"
        ru: "Эта дорога ведёт к вокзалу?"
        source: { kind: tatoeba, id: 360420 }
  - id: drive-run
    ru: "водить (машину); вести (дневник, дело, жизнь)"
    examples:
      - pl: "Umiem prowadzić, a Tom nie."
        ru: "Я умею водить, а Том нет."
        source: { kind: tatoeba, id: 364873 }
      - pl: "Mężczyzna prowadzi samochód."
        ru: "Мужчина ведёт машину."
        source: { kind: tatoeba, id: 3657329 }
      - pl: "Prowadzę dziennik."
        ru: "Я веду дневник."
        source: { kind: tatoeba, id: 12524398 }
notes:
  - { kind: false-friend, text: "prowadzić samochód — «водить машину». Русскому «водить» отвечает именно этот глагол, а не kierować, которое значит «управлять, руководить»." }
  - { kind: usage, text: "Сочетания совпадают с русскими: prowadzić dziennik «вести дневник», prowadzić firmę «вести дело», prowadzić życie «вести жизнь»." }
  - { kind: usage, text: "Причастие прижилось как самостоятельное слово: lekarz prowadzący «лечащий врач», prowadzący program «ведущий программы»." }
  - { kind: usage, text: "Wszystkie drogi prowadzą do Rzymu — поговорка слово в слово совпадает с русской «Все дороги ведут в Рим»." }
collocations:
  - { pl: "prowadzić samochód", ru: "водить машину" }
  - { pl: "prowadzić dziennik", ru: "вести дневник" }
  - { pl: "lekarz prowadzący", ru: "лечащий врач" }
  - { pl: "prowadzić firmę", ru: "вести дело" }
etymology: "Праславянское *provoditi, из pro- + voditi «водить». Польское ro стоит на месте русского «оро»: prowadzić — это, по сути, «проводить»."
memory: "prowadzić — «вести, водить», и польское ro сидит там, где русское «оро»: prowadzić ≈ «проводить». Запомните prowadzić samochód «водить машину» — не kierować, это «руководить». И lekarz prowadzący — «лечащий врач»."
idioms:
  - { pl: "wszystkie drogi prowadzą do Rzymu", ru: "все дороги ведут в Рим" }
  - { pl: "prowadzić za nos", ru: "водить за нос" }
  - { pl: "lekarz prowadzący", ru: "лечащий врач" }
