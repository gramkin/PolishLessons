# review
id: magia
format: 2
lemma: "magia"
rank: 1439
pos: noun
pron: { cyr: "ма́гья" }
senses:
  - id: magic
    ru: "магия, волшебство, колдовство"
    examples:
      - pl: "Wierzę w magię."
        ru: "Я верю в магию."
        source: { kind: translated, id: 8915532 }
      - pl: "To magia."
        ru: "Это магия."
        source: { kind: translated, id: 6729541 }
      - pl: "Użyję na nim swojej magii i zmienię go w żabę."
        ru: "Я применю к нему свою магию и превращу его в лягушку."
        source: { kind: translated, id: 4124258 }
  - id: charm
    ru: "необъяснимое обаяние, особая сила воздействия"
    examples:
      - pl: "Jego opanowanie piłki graniczy z magią."
        ru: "Его владение мячом граничит с магией."
        source: { kind: translated, id: 930258 }
      - pl: "Przekonał mnie do magii swoich pomysłów."
        ru: "Он убедил меня магией своих идей."
        source: { kind: translated, id: 2311092 }
      - pl: "Jest w tym mieście jakaś magia."
        ru: "В этом городе есть какая-то магия."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Женский род на -ia: в родительном, дательном и предложном падежах окончание -ii — bez magii, dzięki magii, o magii. Так же ведут себя historia, lekcja, Francja." }
  - { kind: usage, text: "Устойчивая пара: czarna magia «чёрная магия» и biała magia «белая магия». Первое выражение часто значит просто «тёмный лес, то, в чём не разобраться»." }
  - { kind: false-friend, text: "magia — это только «магия» как искусство или обаяние. «Маг» — mag или czarodziej, а «магазин» — sklep, ничего общего." }
collocations:
  - { pl: "czarna magia", ru: "чёрная магия" }
  - { pl: "wierzyć w magię", ru: "верить в магию" }
  - { pl: "magia słów", ru: "магия слов" }
etymology: "Из латинского magia, а то — из греческого μαγεία «учение магов»; в русский «магия» пришла тем же книжным путём, поэтому слова совпадают почти буквально."
memory: "magia — «магия», род женский, как и в русском. Главное — окончание -ii в родительном и предложном: bez magii, o magii. А czarna magia значит не только «чёрная магия», но и «тёмный лес, китайская грамота»."
idioms:
  - { pl: "czarna magia", ru: "чёрная магия; нечто совершенно непонятное" }
  - { pl: "to dla mnie czarna magia", ru: "для меня это тёмный лес" }
  - { pl: "jak za dotknięciem czarodziejskiej różdżki", ru: "как по волшебству" }
formExamplesSkip:
  - { form: "magij", reason: "правописание до реформы 1936 года: родительный падеж множественного числа существительных на -ia писался тогда через -yj/-ij (magij, wersyj). Современная норма — magii, так что magij в нынешних текстах не форма слова, а старое написание" }
