notes:
  - { kind: usage, text: "Форм девять, а не десять, потому что PLIKU делает сразу три работы: это родительный, местный и звательный падеж одновременно. Причина в родительном: мужские неодушевлённые слова выбирают между окончаниями -a и -u, и plik взял -u, которое совпало с местным. Сравните DZIENNIK из партии 221: там родительный DZIENNIKA, а местный DZIENNIKU, и они разошлись. Оба слова мужские неодушевлённые, оба кончаются на -k, и предсказать выбор по виду слова нельзя — его приходится запоминать поштучно." }
  - { kind: usage, text: "Местный падеж PLIKU оставляет k нетронутым, как и DZIENNIKU: у мужского рода местный берёт окончание -u, а смягчает только -e. Женское KLINICE из той же партии показывает обратное. Третий образец даёт DYM из этой партии: родительный DYMU с тем же -u, но местный DYMIE с -e и смягчением. Три слова, три разные комбинации родительного и местного." }
  - { kind: usage, text: "Компьютерное значение пришло не из английского звучания, а из собственного польского слова: plik давно значит «связка, кипа» — о бумагах, о банкнотах. Английское FILE значит ровно то же самое, и когда понадобилось назвать файл, польский просто дал старому слову новый смысл. Русский же взял английское слово целиком и получил «файл», ничего не значащий сам по себе. Поэтому plik dokumentów и plik na dysku — одно слово в двух его возрастах." }
collocations:
  - { pl: "zapisać plik", ru: "сохранить файл" }
  - { pl: "otworzyć plik", ru: "открыть файл" }
  - { pl: "plik dokumentów", ru: "кипа документов" }
family:
  - { pl: "plikowy", ru: "файловый", relation: derived }
etymology: "В значении «связка, кипа» слово известно задолго до компьютеров: plik papierów, plik banknotów. Компьютерный смысл — перевод английского FILE, которое само восходит к латинскому filum «нить»: бумаги нанизывали на нить, и связка документов стала делом, а потом файлом. Польский перевёл понятие своим словом, уже значившим «связка», русский передал английское звучание, и получились два совершенно разных слова для одной вещи."
memory: "Девять форм, потому что pliku — это и родительный, и местный, и звательный. А «файл» здесь не заимствование: plik значил «кипа бумаг» раньше компьютеров."
idioms:
  - { pl: "plik dokumentów", ru: "кипа документов" }
  - { pl: "gruby plik banknotów", ru: "толстая пачка банкнот" }
