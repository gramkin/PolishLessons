  - form: "zmianom"
    pl: "W tegorocznych wyborach dotknęła palcem ekranu i oddała głos. Żyjąc w Ameryce przez 106 lat, zarówno w dobrych, jak i złych czasach, p. Cooper widziała, jak Ameryka żyje i jakim zmianom może ulegać."
    ru: "На нынешних выборах она коснулась пальцем экрана и отдала свой голос. Прожив в Америке сто шесть лет, и в хорошие времена, и в плохие, госпожа Купер видела, как Америка живёт и каким переменам может поддаваться."
