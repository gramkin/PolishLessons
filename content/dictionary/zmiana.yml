# review
id: zmiana
format: 2
lemma: "zmiana"
rank: 594
pos: noun
pron: { cyr: "зми́ана" }
senses:
  - id: change
    ru: "изменение, перемена"
    examples:
      - pl: "Zmiana jest przerażająca."
        ru: "Перемена пугает."
        source: { kind: translated, id: 4735397 }
      - pl: "Potrzebna jest zmiana."
        ru: "Нужна перемена."
        source: { kind: translated, id: 12453966 }
      - pl: "Sytuacja uległa zmianie."
        ru: "Ситуация изменилась."
        source: { kind: translated, id: 959242 }
  - id: shift
    ru: "смена (рабочая); в обороте na zmianę — по очереди"
    examples:
      - pl: "Pracuję na rannej zmianie."
        ru: "Я работаю в утреннюю смену."
        source: { kind: tatoeba, id: 3461132 }
      - pl: "Pracuję na nocną zmianę."
        ru: "Я работаю в ночную смену."
        source: { kind: tatoeba, id: 9021962 }
      - pl: "Pilnowali na zmianę."
        ru: "Они дежурили по очереди."
        source: { kind: translated, id: 411570 }
notes:
  - { kind: usage, text: "От zmienić «изменить», от miana/mienić «менять»; русское «менять» и «измена» — то же гнездо." }
  - { kind: usage, text: "Второе значение бытовое и очень частое: nocna zmiana «ночная смена», ranna zmiana «утренняя смена»." }
  - { kind: usage, text: "na zmianę значит «по очереди, поочерёдно»: Pilnowali na zmianę «Они дежурили по очереди»." }
  - { kind: usage, text: "ulec zmianie — «измениться», книжный оборот: Sytuacja uległa zmianie." }
collocations:
  - { pl: "na zmianę", ru: "по очереди" }
  - { pl: "nocna zmiana", ru: "ночная смена" }
  - { pl: "ulec zmianie", ru: "измениться" }
  - { pl: "zmiana planu", ru: "изменение плана" }
etymology: "От zmienić «изменить», от корня mienić «менять», праславянское *měna. Русские «менять», «мена» и «измена» — то же гнездо."
memory: "zmiana — и «перемена», и «смена». Второе значение бытовое: nocna zmiana «ночная смена». А оборот na zmianę значит «по очереди»: Pilnowali na zmianę. Корень тот же, что в русском «менять»."
idioms:
  - { pl: "na zmianę", ru: "по очереди" }
  - { pl: "nocna zmiana", ru: "ночная смена" }
  - { pl: "ulec zmianie", ru: "измениться" }
