notes:
  - { kind: usage, text: "GARNCARSKI — относительное прилагательное от GARNCARZ «гончар», а тот от GARNEK «горшок» и старого GARNIEC. Как всякое относительное прилагательное, степеней сравнения оно не имеет. Самое частое сочетание — KOŁO GARNCARSKIE «гончарный круг»; польский обычно ставит такое прилагательное после существительного: WARSZTAT GARNCARSKI, PRACOWNIA GARNCARSKA." }
  - { kind: false-friend, text: "Русское «гончар» и польское GARNCARZ — родственники, хотя узнать это непросто: оба восходят к слову со значением «горшок», только в русском сочетание «рн» упростилось, а в польском осталось. Поэтому GARNCARSKI — это именно «гончарный», а не что-то связанное с «гарнизоном» или «гарниром». Слово CERAMIKA шире: это и промышленная керамика, и изделия из фарфора." }
  - { kind: pronunciation, text: "Читается «гарнца́рски»: C — это «ц», а не «к», ударение на предпоследнем слоге. Мужско-личная форма множественного числа звучит иначе: GARNCARSCY, «гарнца́рсцы», потому что SK перед этим окончанием переходит в SC." }
