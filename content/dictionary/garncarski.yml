etymology: "От GARNCARZ «гончар», образованного от старого GARNIEC «горшок». Русское «гончар» восходит к тому же слову со значением «горшок»."
memory: "GARNEK — горшок, GARNCARZ — тот, кто делает горшки, то есть гончар, а GARNCARSKI — гончарный. Koło garncarskie — гончарный круг."
