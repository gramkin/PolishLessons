etymology: "От RĘCZNY «ручной», а то — от RĘKA «рука». Польское Ę на месте русского «у»: RĘKA — «рука». K перед суффиксом переходит в CZ, как в русском «рука — ручной»."
memory: "Ręcznie — вручную: ręka «рука». Читается «рэ́нчне». Ręcznie robiony — ручной работы. Ręcznik — полотенце, не «ручник»."
