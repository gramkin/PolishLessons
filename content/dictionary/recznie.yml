notes:
  - { kind: false-friend, text: "RĘCZNIE — «вручную», от RĘKA «рука». Главная ловушка — в родне: RĘCZNIK — это «полотенце», а не «ручник». Ручной тормоз — HAMULEC RĘCZNY, в разговоре просто RĘCZNY." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Часто с причастиями: RĘCZNIE ROBIONY, RĘCZNIE MALOWANY, RĘCZNIE SZYTY. Прилагательное — RĘCZNY: PRANIE RĘCZNE, «ручная стирка»." }
  - { kind: government, text: "Наречие ничем не управляет. Противоположность — MASZYNOWO или AUTOMATYCZNIE: PRAĆ RĘCZNIE ALBO W PRALCE." }
  - { kind: pronunciation, text: "Читается «рэ́нчне», ударение на первом слоге. Ę перед CZ звучит «эн», RE — твёрдое «рэ»." }
