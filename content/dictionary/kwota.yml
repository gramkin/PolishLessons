notes:
  - { kind: false-friend, text: "KWOTA — «сумма» денег, а не «квота». Квота, лимит — LIMIT или KONTYNGENT. KWOTA DO ZAPŁATY — «сумма к оплате», KWOTA NETTO/BRUTTO — «сумма без налога / с налогом»." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже T переходит в C: W KWOCIE. Родительный множественного — KWOT. Звательный не даётся." }
  - { kind: government, text: "Сумма в сто злотых — KWOTA STU ZŁOTYCH, родительный, или KWOTA W WYSOKOŚCI STU ZŁOTYCH. На сумму — NA KWOTĘ, NA с винительным: FAKTURA NA KWOTĘ TYSIĄCA ZŁOTYCH." }
  - { kind: pronunciation, text: "Читается «кфо́та», ударение на первом слоге. W после K оглушается в «ф»." }
collocations:
  - { pl: "kwota do zapłaty", ru: "сумма к оплате" }
  - { pl: "niewielka kwota", ru: "небольшая сумма" }
  - { pl: "kwota netto", ru: "сумма без НДС" }
family:
  - { pl: "kwotowy", ru: "суммовой, количественный", relation: derived }
  - { pl: "kwota netto", ru: "сумма без налога", relation: derived }
  - { pl: "kwota brutto", ru: "сумма с налогом", relation: derived }
etymology: "Из латыни: QUOTA PARS — «какая часть». Русская «квота» — то же слово, но значение разошлось: по-польски это любая денежная сумма."
memory: "Kwota — сумма денег, не «квота» (limit). Читается «кфо́та». Kwota do zapłaty — сумма к оплате. Grosz do grosza — копейка к копейке."
idioms:
  - { pl: "grosz do grosza", ru: "копейка к копейке" }
