# review
id: krzyczec
format: 2
lemma: "krzyczeć"
rank: 1279
pos: verb
aspect: imperf
pron: { cyr: "кшы́чэць" }
senses:
  - id: shout
    ru: "кричать"
    examples:
      - pl: "Tom krzyczał."
        ru: "Том кричал."
        source: { kind: translated, id: 5630003 }
      - pl: "Tom krzyczy."
        ru: "Том кричит."
        source: { kind: translated, id: 8745379 }
      - pl: "Proszę, nie krzycz."
        ru: "Пожалуйста, не кричи."
        source: { kind: tatoeba, id: 5907091 }
  - id: shout-at
    ru: "krzyczeć na kogoś — кричать на кого-то"
    examples:
      - pl: "Nie krzycz na mnie."
        ru: "Не кричи на меня."
        source: { kind: translated, id: 750562 }
      - pl: "Mam już dość tego twojego krzyczenia na mnie."
        ru: "Мне уже надоел твой крик на меня."
        source: { kind: translated, id: 973251 }
      - pl: "On dużo krzyczy."
        ru: "Он много кричит."
        source: { kind: translated, id: 1112959 }
  - id: cry-for-help
    ru: "krzyczeć o pomoc — звать на помощь"
    examples:
      - pl: "Krzyczałem o pomoc."
        ru: "Я кричал о помощи."
        source: { kind: translated, id: 8571667 }
      - pl: "Krzyczeliśmy po pomoc, ale nikt nie przyszedł."
        ru: "Мы звали на помощь, но никто не пришёл."
        source: { kind: translated, id: 716031 }
      - pl: "Krzyczał po pomoc."
        ru: "Он звал на помощь."
        source: { kind: translated, id: 363849 }
notes:
  - { kind: government, text: "krzyczeć na kogoś «кричать на кого-то» — предлог na с винительным падежом. А «звать на помощь» — krzyczeć o pomoc или po pomoc." }
  - { kind: usage, text: "Повелительное Nie krzycz! «Не кричи!» — одна из самых частых форм в живой речи." }
  - { kind: usage, text: "Вид несовершенный; совершенный — krzyknąć «крикнуть», об однократном действии." }
  - { kind: usage, text: "Отглагольное существительное — krzyczenie «крик, ор», а обычный «крик» будет krzyk." }
collocations:
  - { pl: "krzyczeć na kogoś", ru: "кричать на кого-то" }
  - { pl: "nie krzycz", ru: "не кричи" }
  - { pl: "krzyczeć o pomoc", ru: "звать на помощь" }
etymology: "Праславянское *kričati — то же слово, что русское «кричать». Корень звукоподражательный."
memory: "krzyczeć — «кричать», с тем же праславянским корнем. Управление: krzyczeć na kogoś «кричать на кого-то» (винительный), krzyczeć o pomoc «звать на помощь». Совершенный вид — krzyknąć «крикнуть»."
