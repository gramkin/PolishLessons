# review
id: aktualny
format: 2
lemma: "aktualny"
rank: 4641
pos: adj
pron: { cyr: "актуа́льны" }
senses:
  - id: current
    ru: "нынешний, текущий, действующий"
    examples:
      - pl: "Aktualny prezydent wygrał wybory."
        ru: "Нынешний президент выиграл выборы."
        source: { kind: authored }
      - pl: "Podaj aktualny adres."
        ru: "Укажи текущий адрес."
        source: { kind: authored }
      - pl: "Najaktualniejsze dane są na stronie."
        ru: "Самые свежие данные — на сайте."
        source: { kind: authored }
  - id: valid
    ru: "действительный, в силе; свежий (о данных)"
    examples:
      - pl: "Ta oferta jest wciąż aktualna."
        ru: "Это предложение всё ещё в силе."
        source: { kind: authored }
      - pl: "Paszport nie jest już aktualny."
        ru: "Паспорт уже недействителен."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Опасный ложный друг. Польское AKTUALNY — «нынешний, текущий, действительный», а не «актуальный» в смысле «важный, злободневный». AKTUALNY PREZES — «нынешний председатель», OFERTA AKTUALNA — «предложение в силе». Русское «актуальная тема» по-польски — TEMAT NA CZASIE или WAŻNY TEMAT. Наречие AKTUALNIE — «в настоящее время»: AKTUALNIE PRACUJĘ W BANKU." }
  - { kind: usage, text: "Полная парадигма: AKTUALNY, AKTUALNIEJSZY, NAJAKTUALNIEJSZY. Степени — в значении «свежий»: NAJAKTUALNIEJSZE INFORMACJE. Мужское-личное: AKTUALNI, AKTUALNIEJSI, NAJAKTUALNIEJSI — например, AKTUALNI MISTRZOWIE, «действующие чемпионы»." }
  - { kind: government, text: "Ставится перед существительным в значении «нынешний»: AKTUALNY RZĄD, AKTUALNA SYTUACJA. После — в значении «действующий»: CENNIK AKTUALNY OD STYCZNIA, «прайс, действующий с января»." }
  - { kind: pronunciation, text: "Читается «актуа́льны», четыре слога, ударение на предпоследнем. U и A раздельно: «ту-а». L перед N мягкая. В AKTUALNIEJSZY: «актуальне́йшы»." }
  - { kind: register, text: "Нейтральное слово, особенно частое в официальных текстах и интерфейсах: AKTUALNE CENY, AKTUALNOŚCI, «новости». В разговоре AKTUALNIE часто значит просто «сейчас»." }
collocations:
  - { pl: "aktualna sytuacja", ru: "текущая ситуация" }
  - { pl: "oferta aktualna", ru: "предложение в силе" }
  - { pl: "aktualny adres", ru: "текущий адрес" }
family:
  - { pl: "aktualnie", ru: "в настоящее время", relation: derived }
  - { pl: "aktualność", ru: "новость; актуальность", relation: derived }
  - { pl: "obecny", ru: "нынешний", relation: root, id: obecny }
etymology: "Из позднелатинского actualis, «действительный, деятельный», от actus «действие». Польское слово сохранило значение «действующий сейчас», а русское «актуальный» сместилось к «злободневный, важный». Отсюда и путаница."
memory: "Aktualny — нынешний, текущий, действительный: aktualny prezydent, oferta aktualna. НЕ «важный»! Актуальная тема — temat na czasie. Aktualnie — сейчас. Читается «актуа́льны»."
idioms:
  - { pl: "na czasie", ru: "актуальный, злободневный" }
