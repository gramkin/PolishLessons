notes:
  - { kind: usage, text: "Самое важное в карточке — склонение, и оно для русского неожиданно: в единственном числе слово не изменяется вовсе. IMPERIUM стоит так во всех падежах: TO IMPERIUM, BEZ IMPERIUM, W IMPERIUM, Z IMPERIUM. Изменяется только множественное: IMPERIA, IMPERIÓW, IMPERIOM, IMPERIAMI, IMPERIACH. Отсюда шесть форм в таблице, а не десять. Это целый класс латинских существительных на -UM, и все они ведут себя одинаково: MUZEUM, LICEUM, GIMNAZJUM, AKWARIUM, STUDIUM, CENTRUM. Русский склоняет их все, польский в единственном числе не склоняет ни одного." }
  - { kind: false-friend, text: "Расхождение не в значении, а в роде и в склонении. Русская «империя» — слово женского рода и склоняется полностью: «империи», «империю», «империей». Польское IMPERIUM — среднего рода и в единственном числе неизменяемое. Поэтому фраза «в империи» по-польски будет W IMPERIUM, без всякого окончания, и попытка сказать W IMPERII выдаёт русскоязычного немедленно. Запоминать стоит сразу классом: W MUZEUM, W LICEUM, W CENTRUM, W IMPERIUM — все без окончаний." }
  - { kind: pronunciation, text: "Читается «импэ́рюм», ударение на предпоследнем слоге, то есть на -PE-. Буква E даёт «э» и согласную не смягчает. Сочетание RIUM читается «рюм», одним слогом: буква I здесь знак мягкости, а не гласная, поэтому слово трёхсложное, IM-PE-RIUM. В форме множественного IMPERIA конечное -IA даёт «я», и слово остаётся трёхсложным: «импэ́ря»." }
  - { kind: government, text: "Средний род. В единственном числе падежи различаются только предлогами и согласованием: TO WIELKIE IMPERIUM, TEGO WIELKIEGO IMPERIUM — прилагательное склоняется, существительное нет. Во множественном склонение обычное. Чего империя — родительный без предлога: IMPERIUM RZYMSKIE или IMPERIUM RZYMU. Распад описывают глаголом ROZPAŚĆ SIĘ: IMPERIUM ROZPADŁO SIĘ, и согласование в прошедшем времени среднего рода, на -O." }
