etymology: "Из латинского IMPERIUM «власть, повеление, держава», от IMPERARE «повелевать», собранного из IN- и PARARE «готовить, устраивать». Исходно слово означало не страну, а полномочие: право командовать, которым наделяли римского магистрата, и лишь затем перешло на державу, где эта власть действует. Русская «империя» пришла тем же путём, через латынь и западные языки, но приобрела женский род по образцу слов на -ия. Польский сохранил латинское -UM и вместе с ним латинскую несклоняемость в единственном числе, а также средний род. Тот же корень PARARE виден в PREPARAT и в русском «препарат», а IMPERARE — в IMPERATOR."
memory: "В единственном числе не склоняется совсем: w imperium, bez imperium, z imperium — весь класс латинских слов на -um ведёт себя так же: w muzeum, w liceum, w centrum. Русский склоняет их все, польский ни одного. И род другой: польское imperium среднего рода, русская «империя» женского. Склоняется только множественное: imperia, imperiów."
