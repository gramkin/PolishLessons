# review
id: obiecywac
format: 2
lemma: "obiecywać"
rank: 1241
pos: verb
aspect: imperf
aspectPair: obiecac
pron: { cyr: "обецы́ваць" }
senses:
  - id: promise
    ru: "обещать"
    examples:
      - pl: "Obiecuję Ci, że się zobaczymy."
        ru: "Я обещаю Вам, что мы увидимся."
        source: { kind: tatoeba, id: 5396634 }
      - pl: "Obiecuję, że pomogę."
        ru: "Обещаю, что помогу."
        source: { kind: translated, id: 967043 }
      - pl: "Obiecuję cię nie zawieść."
        ru: "Обещаю тебя не подвести."
        source: { kind: translated, id: 10584739 }
  - id: dont-promise
    ru: "nie obiecuj — не обещай"
    examples:
      - pl: "Nie obiecuj tego, czego nie będziesz mógł spełnić."
        ru: "Не обещай того, чего не сможешь выполнить."
        source: { kind: tatoeba, id: 363109 }
      - pl: "Nic nie obiecuj!"
        ru: "Ничего не обещай!"
        source: { kind: translated, id: 8753331 }
      - pl: "Nie obiecuj czegoś, czego nie będziesz w stanie dotrzymać."
        ru: "Не обещай того, чего не сможешь сдержать."
        source: { kind: translated, id: 493162 }
  - id: promised
    ru: "obiecywano — обещали (безлично)"
    examples:
      - pl: "Obiecywano reformy,jednak wszystko pozostalo po staremu."
        ru: "Обещали реформы, однако всё осталось по-старому."
        source: { kind: translated, id: 1354557 }
      - pl: "Obiecujesz?"
        ru: "Обещаешь?"
        source: { kind: translated, id: 9637883 }
      - pl: "Co mi obiecujesz?"
        ru: "Что ты мне обещаешь?"
        source: { kind: translated, id: 6603050 }
notes:
  - { kind: government, text: "obiecywać komuś coś «обещать кому-то что-то» — дательный и винительный. С придаточным — obiecuję, że…" }
  - { kind: usage, text: "Вид несовершенный; совершенный — obiecać, карточка уже есть. Obiecuję! «Обещаю!» — готовая формула." }
  - { kind: usage, text: "Причастие obiecujący значит «подающий надежды»: obiecujący gracz «многообещающий игрок»." }
  - { kind: usage, text: "Идиома obiecywać gruszki na wierzbie — «обещать золотые горы», буквально «обещать груши на иве»." }
collocations:
  - { pl: "obiecuję", ru: "обещаю" }
  - { pl: "nie obiecuj", ru: "не обещай" }
  - { pl: "obiecujący gracz", ru: "многообещающий игрок" }
etymology: "Приставка o- и старое biec в значении «сулить», от того же корня, что obietnica «обещание». Русское «обещать» от «вещать» — другой корень, но та же логика речи."
memory: "obiecywać — «обещать», несовершенный вид; совершенный — obiecać. Управление двойное: obiecywać komuś coś. Причастие obiecujący значит «многообещающий». И идиома obiecywać gruszki na wierzbie «обещать золотые горы»."
idioms:
  - { pl: "obiecuję", ru: "обещаю" }
  - { pl: "nie obiecuj", ru: "не обещай" }
  - { pl: "obiecywać gruszki na wierzbie", ru: "обещать золотые горы" }
