formExamples:
  - form: "obiecuj"
    pl: "Nie obiecuj tego, czego nie będziesz mógł spełnić."
    ru: "Не обещай того, чего не сможешь выполнить."
    source: { kind: tatoeba, id: 363109 }
  - form: "obiecuj"
    pl: "Nic nie obiecuj!"
    ru: "Ничего не обещай!"
    source: { kind: translated, id: 8753331 }
  - form: "obiecuj"
    pl: "Nie obiecuj czegoś, czego nie będziesz w stanie dotrzymać."
    ru: "Не обещай того, чего не сможешь сдержать."
    source: { kind: translated, id: 493162 }
  - form: "obiecuje"
    pl: "Nigdy nie wybieraj zawodu tylko dlatego, że obiecuje ci pozycję społeczną."
    ru: "Никогда не выбирай профессию только потому, что она обещает тебе положение в обществе."
    source: { kind: translated, id: 2154188 }
  - form: "obiecuje"
    pl: "Obiecuje, ale nigdy nie dotrzymuje słowa."
    ru: "Он обещает, но никогда не держит слово."
    source: { kind: authored }
  - form: "obiecuje"
    pl: "Pogoda obiecuje piękny weekend."
    ru: "Погода обещает прекрасные выходные."
    source: { kind: authored }
  - form: "obiecujemy"
    pl: "My nie obiecujemy, my robimy!"
    ru: "Мы не обещаем, мы делаем!"
    source: { kind: translated, id: 12023387 }
  - form: "obiecujemy"
    pl: "Wiele sobie po nim obiecujemy."
    ru: "Мы многого от него ждём."
    source: { kind: translated, id: 403551 }
  - form: "obiecujemy"
    pl: "Następnym razem obiecujemy lepszą obsługę."
    ru: "В следующий раз обещаем лучшее обслуживание."
    source: { kind: translated, id: 354068 }
  - form: "obiecujesz"
    pl: "Obiecujesz?"
    ru: "Обещаешь?"
    source: { kind: translated, id: 9637883 }
  - form: "obiecujesz"
    pl: "Co mi obiecujesz?"
    ru: "Что ты мне обещаешь?"
    source: { kind: translated, id: 6603050 }
  - form: "obiecujesz"
    pl: "Obiecujesz, że nie powiesz Tomowi, że miałem wypadek?"
    ru: "Обещаешь, что не скажешь Тому, что я попал в аварию?"
    source: { kind: translated, id: 8610269 }
  - form: "obiecuję"
    pl: "Obiecuję."
    ru: "Обещаю."
    source: { kind: translated, id: 8753520 }
  - form: "obiecuję"
    pl: "Obiecuję, że pomogę."
    ru: "Обещаю, что помогу."
    source: { kind: translated, id: 967043 }
  - form: "obiecuję"
    pl: "Obiecuję Ci, że się zobaczymy."
    ru: "Я обещаю Вам, что мы увидимся."
    source: { kind: tatoeba, id: 5396634 }
  - form: "obiecuję"
    pl: "Obiecuję cię nie zawieść."
    ru: "Обещаю тебя не подвести."
    source: { kind: translated, id: 10584739 }
  - form: "obiecywał"
    pl: "Tom nic mi nie obiecywał."
    ru: "Том мне ничего не обещал."
    source: { kind: translated, id: 4953339 }
  - form: "obiecywał"
    pl: "Obiecywał złote góry."
    ru: "Он обещал золотые горы."
    source: { kind: authored }
  - form: "obiecywał"
    pl: "Zawsze obiecywał, że przyjedzie."
    ru: "Он всегда обещал, что приедет."
    source: { kind: authored }
  - form: "obiecywano"
    pl: "Obiecywano reformy,jednak wszystko pozostalo po staremu."
    ru: "Обещали реформы, однако всё осталось по-старому."
    source: { kind: translated, id: 1354557 }
  - form: "obiecywano"
    pl: "Chciałbym odzyskać moje pieniądze, ponieważ ten program komputerowy nie jest tak wydajny jak obiecywano."
    ru: "Я хотел бы вернуть свои деньги, потому что эта программа не так хороша, как обещали."
    source: { kind: translated, id: 1348659 }
  - form: "obiecywano"
    pl: "Obiecywano nam podwyżkę."
    ru: "Нам обещали прибавку."
    source: { kind: authored }
