notes:
  - { kind: false-friend, text: "WOŁOWINA — «говядина», от WÓŁ «вол», а не от «корова». Мясо по-польски называют суффиксом -INA, как по-русски: WIEPRZOWINA — «свинина», CIELĘCINA — «телятина», BARANINA — «баранина». Русская «говядина» — от старого «говядо», «крупный скот», которого в польском нет." }
  - { kind: usage, text: "Слово вещественное: употребляется в единственном числе. Множественного и звательного падежа у него на практике нет. В местном падеже: W WOŁOWINIE. Прилагательное — WOŁOWY: PIECZEŃ WOŁOWA, «говяжье жаркое», ROSÓŁ WOŁOWY, «говяжий бульон»." }
  - { kind: government, text: "Блюдо из говядины — Z WOŁOWINY, Z с родительным: GULASZ Z WOŁOWINY. С говядиной — Z WOŁOWINĄ, творительный: PIEROGI Z WOŁOWINĄ. Количество — родительный: KILO WOŁOWINY, PÓŁ KILO WOŁOWINY." }
  - { kind: pronunciation, text: "Читается «воуо́вина», четыре слога, ударение на предпоследнем. Ł звучит как краткое «у», а не как русское «л». В корне WÓŁ «вол» Ó читается «у»: «вуу»." }
  - { kind: register, text: "Слово нейтральное: в магазине, в меню, на кухне. В рецептах часто пишут прилагательным: MIĘSO WOŁOWE, MIELONE WOŁOWE, «говяжий фарш»." }
