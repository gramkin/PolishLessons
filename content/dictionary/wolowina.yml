etymology: "От WÓŁ «вол» с суффиксом -OWINA, которым польский называет мясо: WIEPRZ «боров» — WIEPRZOWINA. Тот же суффикс, что в русском «свинина, баранина». Чередование Ó и O: WÓŁ, но WOŁU, WOŁOWINA."
memory: "Wołowina — говядина, мясо вола, wół. Читается «воуо́вина». Wieprzowina — свинина, cielęcina — телятина. Gulasz z wołowiny — гуляш из говядины."
idioms:
