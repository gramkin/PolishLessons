# review
id: zamknac
format: 2
lemma: "zamknąć"
rank: 214
pos: verb
aspect: perf
pron: { cyr: "за́мкнонць" }
senses:
  - id: close
    ru: "закрыть, запереть (дверь, окно, глаза)"
    examples:
      - pl: "Zamknij właz."
        ru: "Закрой люк."
        source: { kind: tatoeba, id: 3457081 }
      - pl: "Zamknij bramę."
        ru: "Закрой ворота."
        source: { kind: tatoeba, id: 564988 }
      - pl: "Zamknij za sobą drzwi."
        ru: "Закрой за собой дверь."
        source: { kind: tatoeba, id: 998693 }
  - id: shut-up
    ru: "zamknąć się — замолчать; закрыться"
    note: "Zamknij się! — грубое «Заткнись!», не «закройся»."
    examples:
      - pl: "Zamknij się!"
        ru: "Заткнись!"
        source: { kind: tatoeba, id: 524093 }
      - pl: "Zamknij się."
        ru: "Замолкни."
        source: { kind: tatoeba, id: 5652466 }
      - pl: "Drzwi zamknęły się z trzaskiem."
        ru: "Дверь с треском закрылась."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид — zamykać: Zamykam sklep o ósmej «Закрываю магазин в восемь»." }
  - { kind: usage, text: "zamknąć na klucz — «запереть на ключ»; zamknięty значит «закрыт»: Sklep jest zamknięty." }
  - { kind: register, text: "Zamknij się! звучит грубо, примерно как русское «Заткнись!». Вежливо попросить тишины — Proszę o ciszę." }
collocations:
  - { pl: "zamknąć drzwi", ru: "закрыть дверь" }
  - { pl: "zamknąć oczy", ru: "закрыть глаза" }
  - { pl: "zamknąć na klucz", ru: "запереть на ключ" }
  - { pl: "zamknij się!", ru: "заткнись!" }
etymology: "Приставка za- + mknąć «смыкать, двигать»; тот же корень, что в русском «замкнуть» и «замок»."
memory: "zamknąć — совершенный вид, zamykać — несовершенный. Zamknij się! значит грубое «Заткнись!», а zamknięty — «закрыт»: Sklep jest zamknięty."
idioms:
  - { pl: "z zamkniętymi oczami", ru: "с закрытыми глазами" }
  - { pl: "zamknąć się w sobie", ru: "замкнуться в себе" }
  - { pl: "zamknąć oczy na coś", ru: "закрыть на что-то глаза" }
