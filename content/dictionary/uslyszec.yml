# review
id: uslyszec
format: 2
lemma: "usłyszeć"
rank: 491
pos: verb
aspect: perf
pron: { cyr: "усуы́шэць" }
senses:
  - id: hear
    ru: "услышать"
    examples:
      - pl: "Usłyszałem wczoraj piękną piosenkę."
        ru: "Вчера я слышал красивую песню."
        source: { kind: tatoeba, id: 1729249 }
      - pl: "Usłyszała jak płacze."
        ru: "Она услышала, как он плачет."
        source: { kind: tatoeba, id: 6312668 }
      - pl: "Myślę, że usłyszałem wystarczająco."
        ru: "Думаю, я услышал достаточно."
        source: { kind: tatoeba, id: 13660032 }
  - id: hear-q
    ru: "услышать (в вопросах и оборотах)"
    examples:
      - pl: "Co chcesz usłyszeć?"
        ru: "Что ты хочешь услышать?"
        source: { kind: tatoeba, id: 12955859 }
      - pl: "Co usłyszałeś?"
        ru: "Что ты услышал?"
        source: { kind: translated, id: 6602797 }
      - pl: "Do usłyszenia zaraz!"
        ru: "До скорой связи!"
        source: { kind: translated, id: 11266020 }
notes:
  - { kind: usage, text: "Совершенный вид к słyszeć: słyszeć — «слышать вообще», usłyszeć — «услышать один раз»." }
  - { kind: usage, text: "Do usłyszenia! — «До связи!», прощание по телефону. Оно построено ровно как русское «до свидания», только через «услышать»." }
  - { kind: false-friend, text: "Различайте słyszeć «слышать» и słuchać «слушать»: второе требует родительного падежа — słuchać muzyki «слушать музыку»." }
  - { kind: usage, text: "Причастие на -wszy у этого глагола живое: Usłyszawszy to, zapłakał «Услышав это, он заплакал»." }
collocations:
  - { pl: "do usłyszenia", ru: "до связи" }
  - { pl: "usłyszeć wiadomość", ru: "услышать новость" }
  - { pl: "co usłyszałeś?", ru: "что ты услышал?" }
  - { pl: "usłyszeć odpowiedź", ru: "услышать ответ" }
etymology: "Из u- + słyszeć, праславянское *slyšati; русское «услышать» — то же самое слово."
memory: "usłyszeć — «услышать», совершенный вид к słyszeć. Запомните прощание Do usłyszenia! «До связи!» — оно построено как русское «до свидания», только через «услышать». И различайте słyszeć «слышать» и słuchać «слушать», которое требует родительного."
idioms:
  - { pl: "do usłyszenia", ru: "до связи" }
  - { pl: "kto mówi, co chce, usłyszy, czego nie chce", ru: "кто говорит что хочет, услышит чего не хочет" }
  - { pl: "usłyszeć odpowiedź", ru: "услышать ответ" }
