# review
id: radosc
format: 2
lemma: "radość"
rank: 1529
pos: noun
pron: { cyr: "ра́досьць" }
senses:
  - id: joy
    ru: "радость (чувство)"
    examples:
      - pl: "Płakała z radości, kiedy usłyszała, że jej syn przeżył katastrofę samolotu."
        ru: "Она заплакала от радости, когда услышала, что ее сын выжил в авиакатастрофе."
        source: { kind: tatoeba, id: 350027 }
      - pl: "Płakał z radości."
        ru: "Он плакал от радости."
        source: { kind: translated, id: 349242 }
      - pl: "Ani radość ani smutek nie trwają wiecznie."
        ru: "Ни радость, ни печаль не длятся вечно."
        source: { kind: tatoeba, id: 3754116 }
  - id: source-of-joy
    ru: "радость (то, что радует)"
    examples:
      - pl: "Jest radością całej rodziny."
        ru: "Она радость всей семьи."
        source: { kind: translated, id: 11342769 }
      - pl: "Rób to, co przynosi ci radość."
        ru: "Делай вещи, которые приносят тебе радость."
        source: { kind: tatoeba, id: 13225501 }
  - id: with-pleasure
    ru: "с радостью"
    examples:
      - pl: "Z radością!"
        ru: "С радостью!"
        source: { kind: translated, id: 8608341 }
      - pl: "Z radością idzie do szpitala."
        ru: "Он с радостью идёт в больницу."
        source: { kind: translated, id: 956771 }
notes:
  - { kind: government, text: "Родительный — radości: płakać z radości «плакать от радости», skakać z radości «прыгать от радости». Русскому «от радости» отвечает z + родительный." }
  - { kind: usage, text: "Z radością! — «С радостью!», обычный вежливый ответ на приглашение или просьбу." }
  - { kind: usage, text: "Существительное женского рода на -ść, как wolność и miłość; такие слова в родительном и предложном дают -ści." }
  - { kind: usage, text: "Прилагательное — radosny «радостный», наречие — radośnie «радостно»." }
collocations:
  - { pl: "z radością", ru: "с радостью" }
  - { pl: "płakać z radości", ru: "плакать от радости" }
  - { pl: "sprawiać radość", ru: "доставлять радость" }
etymology: "От rad «рад» с суффиксом -ość, ровно как русское «радость» от «рад» с суффиксом -ость. Соответствие суффиксов регулярное: польское -ość отвечает русскому -ость."
memory: "radość = «радость», и собрано слово точно как русское: rad + -ość. Запомните управление: z radości «от радости» (płakać z radości) и z radością «с радостью»."
