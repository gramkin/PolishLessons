# review
id: rozum
format: 2
lemma: "rozum"
rank: 2516
pos: noun
pron: { cyr: "ро́зум" }
senses:
  - id: reason
    ru: "разум, рассудок"
    examples:
      - pl: "Rozum podpowiada co innego niż serce."
        ru: "Разум подсказывает иное, чем сердце."
        source: { kind: authored }
      - pl: "Stracił rozum ze zmartwienia."
        ru: "Он потерял рассудок от горя."
        source: { kind: authored }
  - id: common-sense
    ru: "ум, здравый смысл"
    examples:
      - pl: "Miej rozum i nie podpisuj tego."
        ru: "Имей голову и не подписывай это."
        source: { kind: authored }
      - pl: "Nie starczyło mu rozumu, żeby się wycofać."
        ru: "У него не хватило ума отступить."
        source: { kind: authored }
  - id: wits
    ru: "ум, соображение"
    examples:
      - pl: "Rusz rozumem, to proste zadanie."
        ru: "Пошевели мозгами, это простая задача."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ОБЩИЙ С РУССКИМ «РАЗУМОМ», НО ГЛАГОЛЫ РАЗОШЛИСЬ. ROZUMIEĆ по-польски — обычное, самое частое слово «понимать»: nie rozumiem. Русское «разуметь» звучит устарело, обиходное там «понимать». Так что rozum узнаётся сразу, а rozumieć надо запомнить как рабочий глагол на каждый день." }
  - { kind: usage, text: "Обороты стоит взять готовыми: MIEĆ ROZUM «иметь голову на плечах», RUSZYĆ ROZUMEM «пошевелить мозгами», STRACIĆ ROZUM «потерять рассудок». Предложный — w ROZUMIE, с мягким mi. Прилагательное rozumny значит «разумный», а rozsądny — «рассудительный»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: RO-zum. Оба o открытые, z звонкое: «ро́зум». Предложный rozumie читается «ро́зуме», с мягким ми." }
collocations:
  - { pl: "mieć rozum", ru: "иметь голову на плечах" }
  - { pl: "ruszyć rozumem", ru: "пошевелить мозгами" }
  - { pl: "stracić rozum", ru: "потерять рассудок" }
family:
  - { pl: "rozumieć", ru: "понимать", relation: derived, id: rozumiec }
  - { pl: "rozsądek", ru: "рассудок, благоразумие", relation: root }
  - { pl: "głupota", ru: "глупость", relation: antonym, id: glupota }
etymology: "Приставка roz- и корень um-, тот же, что в umieć «уметь» и русском «ум». Русское «разум» собрано точно так же: раз- плюс «ум». Отсюда rozumieć «понимать», rozumny «разумный» и nierozumny «неразумный»."
memory: "rozum — «разум», и собрано как русское: roz- плюс um, то есть «ум». Но глагол другой по весу: rozumieć это обиходное «понимать», а не книжное «разуметь». Предложный — w rozumie."
idioms:
  - { pl: "ruszyć rozumem", ru: "пошевелить мозгами" }
  - { pl: "postradać rozum", ru: "лишиться рассудка" }
