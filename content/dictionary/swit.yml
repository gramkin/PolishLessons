notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «свете», а слово другое. ŚWIT это «рассвет», от ŚWITAĆ «светать», и праславянский корень *svьt- дал в русском и «свет», и «светать», и «рассвет». Но русское существительное построено с приставкой рас-, а польское без неё, и потому ŚWIT выглядит как русский «свет», а значит «рассвет». Собственно свет по-польски ŚWIATŁO, а мир как вселенная — ŚWIAT, и эти три слова стоит держать отдельно: ŚWIT «рассвет», ŚWIATŁO «свет», ŚWIAT «мир». Ошибка переводить ŚWIT как «свет» — самая естественная из возможных и самая частая." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному. Родительный на -U: DO ŚWITU «до рассвета», OD ŚWITU «с рассвета». Местный ŚWICIE, с чередованием T в C перед -IE, и в этой форме слово живёт чаще всего: O ŚWICIE «на рассвете», где польский берёт предлог O с местным, а русский — предлог «на» с местным. Оборот PRZED ŚWITEM «перед рассветом» идёт с творительным. Множественное число ŚWITY употребляется, когда речь о рассветах как о череде или о виде." }
  - { kind: pronunciation, text: "Читается «сьвит», один слог, ударять нечего. Начальное ŚW это мягкое «сь» с «в», сочетание для русского непривычное: не «св» и не «шв». Гласная I звучит «и». В местном падеже ŚWICIE буква T переходит в C и читается «ць»: «сьви́це», и слогов становится два. В родительном ŚWITU слышно «сьви́ту». В творительном ŚWITEM — «сьви́тэм». Чередование T в C здесь то же, что в NAMIOT и NAMIOCIE." }
  - { kind: usage, text: "Самые нужные обороты: O ŚWICIE «на рассвете», PRZED ŚWITEM, DO ŚWITU, OD ŚWITU DO NOCY «от рассвета до ночи». Глагол ŚWITAĆ «светать» употребляется безлично: ŚWITA «светает», JUŻ ŚWITAŁO «уже светало». Переносное выражение ŚWITA MI, ŻE COŚ JEST NIE TAK значит «мне начинает казаться, что что-то не так», буквально «у меня светает», и в русском ему отвечает «меня осенило» или «до меня дошло». Прилагательное от ŚWIT не образуется; для утренних дел берут PORANNY." }
