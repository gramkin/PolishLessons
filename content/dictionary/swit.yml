etymology: "От глагола ŚWITAĆ «светать», из праславянского *svьtěti, и это тот же корень, что дал русские «свет», «светить», «светать», «рассвет», а также «свеча» и «святой» — последнее через иную ступень. Польский построил название рассвета без приставки, прямо от корня, и получилось короткое ŚWIT; русский взял приставку рас- и получил «рассвет», а само слово «свет» оставил за освещением. Отсюда и ловушка: формально польское ŚWIT ближе всего к русскому «свету», а по смыслу отвечает «рассвету». В польском гнезде рядом стоят ŚWIATŁO «свет», ŚWIECA «свеча», ŚWIECIĆ «светить», ŚWIAT «мир» — последнее тоже от этого корня, потому что мир понимался как освещённое, видимое."
memory: "Не «свет», а «рассвет»: świt от świtać «светать». Свет — światło, мир — świat, и три слова надо держать отдельно. Главная форма — местный świcie с t→c: o świcie «на рассвете», как namiot — namiocie. Польский берёт предлог o там, где русский берёт «на». Безличное świta значит «светает»; świta mi, że to nie przypadek — «до меня начинает доходить, что что-то не так»."
