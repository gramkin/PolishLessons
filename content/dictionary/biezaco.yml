pron: { cyr: "бежо́нцо" }
senses:
  - id: up-to-date
    ru: "NA BIEŻĄCO — в курсе, своевременно"
    examples:
      - pl: "Informuj mnie na bieżąco."
        ru: "Держи меня в курсе."
        source: { kind: authored }
      - pl: "Jestem na bieżąco z wiadomościami."
        ru: "Я в курсе новостей."
        source: { kind: authored }
      - pl: "Rachunki płacę na bieżąco."
        ru: "Счета я оплачиваю вовремя."
        source: { kind: authored }
  - id: as-it-goes
    ru: "NA BIEŻĄCO — по ходу дела, сразу"
    examples:
      - pl: "Tłumaczył na bieżąco."
        ru: "Он переводил синхронно."
        source: { kind: authored }
      - pl: "Błędy poprawiamy na bieżąco."
        ru: "Ошибки мы исправляем по ходу дела."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BIEŻĄCO отдельно не употребляется: только NA BIEŻĄCO. Корень тот же, что в BIEC «бежать» и русском «бег», а BIEŻĄCY — «текущий»: ROK BIEŻĄCY «текущий год», WODA BIEŻĄCA «водопровод, проточная вода». Русское «бегущий» по значению не подходит." }
  - { kind: usage, text: "Неизменяемое наречие в обороте NA BIEŻĄCO. Часто с BYĆ и TRZYMAĆ: BYĆ NA BIEŻĄCO «быть в курсе», TRZYMAĆ KOGOŚ NA BIEŻĄCO «держать кого-то в курсе»." }
  - { kind: government, text: "В чём быть в курсе — Z с творительным: NA BIEŻĄCO Z NOWINKAMI «в курсе новинок». Кого информировать — винительный: INFORMOWAĆ KOGOŚ NA BIEŻĄCO." }
  - { kind: pronunciation, text: "Читается «бежо́нцо»: IE — «е», Ż — «ж», Ą перед C — «он». Ударение на предпоследнем слоге. NA BIEŻĄCO — «на бежо́нцо»." }
  - { kind: register, text: "Нейтральное слово; особенно часто в деловой речи и прессе: AKTUALIZOWANE NA BIEŻĄCO «обновляется в реальном времени»." }
collocations:
  - { pl: "być na bieżąco", ru: "быть в курсе" }
  - { pl: "informować na bieżąco", ru: "держать в курсе" }
  - { pl: "relacja na bieżąco", ru: "репортаж в прямом эфире" }
family:
  - { pl: "biec", ru: "бежать", relation: root, id: biec }
  - { pl: "bieżący", ru: "текущий", relation: derived }
  - { pl: "bieg", ru: "бег, ход", relation: root, id: bieg }
etymology: "От BIEŻĄCY «текущий», причастия от BIEC «бежать». Образ тот же, что в русском «текущий»: время, которое бежит прямо сейчас."
memory: "Na bieżąco — в курсе, по ходу дела: informuj mnie na bieżąco. Bieżący — текущий, от biec «бежать»."
idioms:
  - { pl: "trzymać rękę na pulsie", ru: "держать руку на пульсе (о том, кто всегда на bieżąco)" }
