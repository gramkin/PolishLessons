notes:
  - { kind: false-friend, text: "KELNER — «официант». Русское «кельнер» знакомо только по старым книгам. Женщина — KELNERKA. Позвать официанта вежливо — PROSZĘ PANA!, а не KELNER!" }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном R переходит в RZ: KELNERZY. В местном тоже: O KELNERZE." }
  - { kind: government, text: "Позвать официанта — ZAWOŁAĆ KELNERA, винительный равен родительному. Оставить официанту чаевые — ZOSTAWIĆ KELNEROWI NAPIWEK, дательный. Заказать у официанта — ZAMÓWIĆ U KELNERA." }
  - { kind: pronunciation, text: "Читается «ке́льнэр», ударение на первом слоге. L перед N мягкое, NE — твёрдое «нэ»." }
collocations:
  - { pl: "zawołać kelnera", ru: "позвать официанта" }
  - { pl: "napiwek dla kelnera", ru: "чаевые официанту" }
  - { pl: "pracować jako kelner", ru: "работать официантом" }
family:
  - { pl: "kelnerka", ru: "официантка", relation: derived }
  - { pl: "kelnerować", ru: "работать официантом (разг.)", relation: derived }
  - { pl: "kelnerski", ru: "официантский", relation: derived }
etymology: "Из немецкого: там это слово произведено от слова «погреб». Исходно так называли ключника, заведовавшего погребом с вином, а затем — того, кто подаёт к столу."
memory: "Kelner — официант, kelnerka — официантка. Читается «ке́льнэр». Kelnerzy — официанты. Rachunek, proszę! — Счёт, пожалуйста!"
idioms:
  - { pl: "rachunek, proszę", ru: "счёт, пожалуйста" }
