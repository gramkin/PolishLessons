# review
id: wewnatrz
format: 2
lemma: "wewnątrz"
rank: 1627
pos: prep
pron: { cyr: "вэ́внонтш" }
senses:
  - id: inside-prep
    ru: "внутри (чего-либо)"
    examples:
      - pl: "Wewnątrz domu było ciepło."
        ru: "Внутри дома было тепло."
        source: { kind: authored }
      - pl: "Coś porusza się wewnątrz pudełka."
        ru: "Что-то движется внутри коробки."
        source: { kind: authored }
  - id: inside-adv
    ru: "внутри, изнутри (наречие)"
    examples:
      - pl: "Jestem wewnątrz."
        ru: "Я внутри."
        source: { kind: translated, id: 10566226 }
      - pl: "Tomasz czekał wewnątrz."
        ru: "Томаш ждал внутри."
        source: { kind: translated, id: 2238969 }
      - pl: "Jemy śniadanie wewnątrz."
        ru: "Мы завтракаем внутри."
        source: { kind: translated, id: 11575410 }
      - pl: "Drzwi były zamknięte od wewnątrz."
        ru: "Дверь была заперта изнутри."
        source: { kind: translated, id: 952199 }
notes:
  - { kind: government, text: "Как предлог требует родительного падежа: wewnątrz domu «внутри дома», wewnątrz grupy «внутри группы»." }
  - { kind: usage, text: "Противоположность — na zewnątrz «снаружи, наружу»: Poczekaj na zewnątrz «Подожди снаружи»." }
  - { kind: usage, text: "od wewnątrz значит «изнутри»: Drzwi były zamknięte od wewnątrz «Дверь была заперта изнутри»." }
  - { kind: usage, text: "Слово работает и как предлог с дополнением (wewnątrz budynku), и как наречие без него (Jestem wewnątrz «Я внутри»)." }
collocations:
  - { pl: "wewnątrz domu", ru: "внутри дома" }
  - { pl: "od wewnątrz", ru: "изнутри" }
  - { pl: "na zewnątrz", ru: "снаружи" }
etymology: "Из w + wnątrz, от праславянского *ǫtrь «внутренность» — то же гнездо, что русские «нутро», «внутри», «утроба». Русское «внутри» собрано из тех же частей: в- и нутр-."
memory: "wewnątrz = «внутри», требует родительного падежа: wewnątrz domu. Пара к нему — na zewnątrz «снаружи». И запомните od wewnątrz «изнутри»."
idioms:
  - { pl: "od wewnątrz", ru: "изнутри" }
  - { pl: "wewnątrz kraju", ru: "внутри страны" }
  - { pl: "wewnątrz i na zewnątrz", ru: "внутри и снаружи" }
