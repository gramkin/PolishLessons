# review
id: przyjaciel
format: 2
lemma: "przyjaciel"
rank: 170
pos: noun
pron: { cyr: "пшыя́чель" }
senses:
  - id: friend
    ru: "друг (близкий человек)"
    examples:
      - pl: "To mój przyjaciel."
        ru: "Это мой друг."
        source: { kind: tatoeba, id: 928019 }
      - pl: "Bob to mój przyjaciel."
        ru: "Боб — мой друг."
        source: { kind: tatoeba, id: 351455 }
      - pl: "To mój stary przyjaciel."
        ru: "Это мой старый друг."
        source: { kind: tatoeba, id: 410716 }
  - id: friends
    ru: "друг, друзья (в общем смысле)"
    examples:
      - pl: "Mam przyjaciela."
        ru: "У меня есть друг."
        source: { kind: tatoeba, id: 3428102 }
      - pl: "Masz wielu przyjaciół?"
        ru: "У тебя много друзей?"
        source: { kind: tatoeba, id: 982801 }
      - pl: "Tom nie ma przyjaciół."
        ru: "У Тома нет друзей."
        source: { kind: tatoeba, id: 2774114 }
notes:
  - { kind: false-friend, text: "przyjaciel — это «друг», а не «приятель», хотя корень общий. Русскому «приятель, знакомый» отвечает kolega." }
  - { kind: usage, text: "Множественное число неправильное: przyjaciel — przyjaciele — przyjaciół — przyjaciołom — przyjaciółmi." }
  - { kind: usage, text: "Женский род — przyjaciółka «подруга»: moja przyjaciółka." }
collocations:
  - { pl: "mój przyjaciel", ru: "мой друг" }
  - { pl: "stary przyjaciel", ru: "старый друг" }
  - { pl: "najlepszy przyjaciel", ru: "лучший друг" }
  - { pl: "bez przyjaciół", ru: "без друзей" }
etymology: "Праславянское *prijateljь от *prijati «благоволить»; тот же корень, что в русском «приятель», но значение сильнее — это «друг»."
memory: "Ловушка: przyjaciel — «друг», а «приятель» — kolega. Множественное неправильное: przyjaciele, przyjaciół, przyjaciołom."
idioms:
  - { pl: "przyjaciel od serca", ru: "закадычный друг" }
  - { pl: "fałszywy przyjaciel", ru: "ложный друг" }
  - { pl: "przyjaciel domu", ru: "друг дома" }
