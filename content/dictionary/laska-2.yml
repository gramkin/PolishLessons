# review
id: laska-2
format: 2
lemma: "łaska"
rank: 2153
pos: noun
pron: { cyr: "уа́ска" }
senses:
  - id: mercy
    ru: "милость, снисхождение"
    examples:
      - pl: "Był na łasce i niełasce sztormu."
        ru: "Он был во власти шторма."
        source: { kind: translated, id: 722161 }
      - pl: "Statek był na łasce wiatru i fal."
        ru: "Корабль был во власти ветра и волн."
        source: { kind: translated, id: 856012 }
      - pl: "Biedni ludzie zdani byli na łaskę okrutnego dyktatora."
        ru: "Бедняки были отданы на милость жестокого диктатора."
        source: { kind: translated, id: 1351118 }
  - id: grace
    ru: "благодать (церковное); расположение"
    examples:
      - pl: "Zdrowaś Mario, łaski pełna."
        ru: "Радуйся, Мария, благодати полная."
        source: { kind: translated, id: 12783251 }
      - pl: "On zawsze próbuje wkraść się w łaski szefa."
        ru: "Он всегда пытается втереться в доверие к начальнику."
        source: { kind: translated, id: 13654108 }
notes:
  - { kind: false-friend, text: "Две разные буквы, один ASCII-идентификатор: łaska «милость, благодать» и laska «трость, палка» пишутся по-разному, но в латинской транслитерации совпадают. Поэтому у этой карточки id laska-2." }
  - { kind: government, text: "na łasce i niełasce kogoś «во власти кого-л.» — предложный падеж; zdany na łaskę «отданный на милость» — винительный." }
  - { kind: usage, text: "z łaski swojej «будь любезен» звучит иронично, почти как русское «сделайте одолжение»." }
  - { kind: usage, text: "Русское «ласка» — то же праславянское слово, но значение сузилось до нежности, тогда как польское осталось при «милости»." }
collocations:
  - { pl: "na łasce i niełasce", ru: "во власти" }
  - { pl: "z łaski swojej", ru: "будь любезен" }
etymology: "Праславянское *laska «ласка, милость»; русское «ласка» — то же слово, но значение сузилось до нежности."
memory: "łaska — «милость, благодать». Не путайте с laska «трость»: разные слова, совпадающие только в ASCII-записи, отсюда id laska-2. Пара к нему — niełaska «немилость»."
idioms:
  - { pl: "na łasce i niełasce", ru: "во власти" }
  - { pl: "z łaski swojej", ru: "будь любезен" }
formExamplesSkip:
  - { form: "łasko", reason: "звательная форма, а łaska — это милость или расположение. Обращаться к самой милости некому, поэтому форма остаётся только в таблице склонения" }
