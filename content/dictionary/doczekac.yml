# review
id: doczekac
format: 2
lemma: "doczekać"
rank: 1510
pos: verb
aspect: perf
pron: { cyr: "доче́каць" }
senses:
  - id: wait-for
    ru: "дождаться (чего-л.); не мочь дождаться"
    examples:
      - pl: "Tom nie może się doczekać, aby wziąć się do pracy."
        ru: "Том не может дождаться, чтобы приняться за работу."
        source: { kind: tatoeba, id: 8661272 }
      - pl: "Nie mogę się doczekać końca wojny."
        ru: "Я не могу дождаться конца войны."
        source: { kind: translated, id: 12871941 }
      - pl: "Nie mogła się doczekać jego powrotu."
        ru: "Она не могла дождаться его возвращения."
        source: { kind: translated, id: 712475 }
  - id: live-to-see
    ru: "дожить до, дождаться (события)"
    examples:
      - pl: "Końca wojny doczekali jedynie martwi."
        ru: "Конца войны дождались только мёртвые."
        source: { kind: translated, id: 416251 }
      - pl: "Kto czeka, ten się doczeka."
        ru: "Кто ждёт, тот дождётся."
        source: { kind: translated, id: 13669957 }
      - pl: "Nie może się doczekać letnich wakacji."
        ru: "Он не может дождаться летних каникул."
        source: { kind: translated, id: 3079809 }
notes:
  - { kind: government, text: "doczekać się требует родительного падежа: doczekać się wyników «дождаться результатов». Почти всегда употребляется с się." }
  - { kind: usage, text: "Самая частая конструкция — nie mogę się doczekać «не могу дождаться», выражающая нетерпение: Nie mogę się doczekać twojej wizyty." }
  - { kind: usage, text: "się может стоять и перед глаголом, и после: nie mogę się doczekać и nie mogę doczekać się одинаково правильны." }
  - { kind: usage, text: "Отдельной пары несовершенного вида у глагола нет: «ждать» — это czekać, «дождаться» — doczekać się." }
collocations:
  - { pl: "nie móc się doczekać", ru: "не мочь дождаться" }
  - { pl: "doczekać się wyników", ru: "дождаться результатов" }
  - { pl: "doczekać końca", ru: "дождаться конца" }
etymology: "Приставка do- + czekać «ждать» — ровно то же строение, что русское «до-ждать-ся»: приставка задаёт достижение конца ожидания."
memory: "doczekać się = «дождаться», собрано как русское: do- + czekać, как «до-» + «ждать». Требует родительного падежа и почти всегда идёт с się. Главная фраза — nie mogę się doczekać «не могу дождаться»."
idioms:
  - { pl: "nie mogę się doczekać", ru: "не могу дождаться" }
  - { pl: "kto czeka, ten się doczeka", ru: "кто ждёт, тот дождётся" }
  - { pl: "doczekać się wyników", ru: "дождаться результатов" }
