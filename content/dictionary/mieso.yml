notes:
  - { kind: usage, text: "Существительное среднего рода: mięso, mięsa, mięsu. Множественное mięsa значит «сорта мяса»." }
  - { kind: pronunciation, text: "Звуковое соответствие регулярное: польское ię отвечает русскому «я» — mięso «мясо», pięć «пять», dziesięć «десять»." }
  - { kind: usage, text: "rzucać mięsem — идиома «материться, ругаться матом», буквально «бросаться мясом»." }
  - { kind: usage, text: "Прилагательное — mięsny: danie mięsne «мясное блюдо», sklep mięsny «мясной магазин»." }
collocations:
  - { pl: "jeść mięso", ru: "есть мясо" }
  - { pl: "mięso wołowe", ru: "говядина" }
  - { pl: "danie mięsne", ru: "мясное блюдо" }
etymology: "Праславянское *męso — то же слово, что русское «мясо». Соответствие регулярное: польское ię отвечает русскому «я»."
memory: "mięso = «мясо», прямой родственник. Запомните звуковое соответствие: польское ię = русское «я» — mięso «мясо», pięć «пять», dziesięć «десять». И идиому rzucać mięsem «материться»."
idioms:
  - { pl: "rzucać mięsem", ru: "материться" }
  - { pl: "mięso armatnie", ru: "пушечное мясо" }
  - { pl: "mięso wołowe", ru: "говядина" }
