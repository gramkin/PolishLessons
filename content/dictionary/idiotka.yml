notes:
  - { kind: register, text: "Слово бранное в обоих языках, и степень грубости совпадает: это не шутливое «глупышка», а настоящее оскорбление, хотя и не из самых тяжёлых. В устах самого говорящего о себе оно звучит мягче и почти безобидно: JAKA JA IDIOTKA есть обычное досадливое восклицание, как русское «какая я дура». О другом человеке в лицо это уже обида. В медицинском смысле слово давно не употребляется ни в польском, ни в русском: там IDIOTA и IDIOTKA вышли из терминологии в начале двадцатого века." }
  - { kind: usage, text: "Женская форма от IDIOTA, и здесь самое интересное в карточке: само IDIOTA — существительное мужского рода с женскими окончаниями, из того же разряда, что OBROŃCA и SPRZEDAWCA. То есть IDIOTA склоняется как женское слово, оставаясь мужским по согласованию: TEN IDIOTA, TEGO IDIOTY, TEMU IDIOCIE. А IDIOTKA — обычное женское существительное, и склоняется просто. Поэтому пара даёт наглядный контраст: слово, которое выглядит женским, но мужское, и настоящее женское рядом с ним." }
  - { kind: pronunciation, text: "Читается «идё́тка», ударение на предпоследнем слоге. Сочетание IO в середине слова даёт «ё», одним слогом: не «иди-от-ка» в три приёма, а «и-дё́т-ка». Это общее правило для польского I перед гласной: оно смягчает согласную и не образует отдельного слога. В дательном и местном падеже IDIOTCE согласная T переходит в C: «идё́тце». Это то же чередование, что в SEKRETARKA и SEKRETARCE, ODZNAKA и ODZNACE." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę, но при глаголе NAZWAĆ нужен не он, а творительный: NAZWAŁ JĄ IDIOTKĄ «он назвал её идиоткой». Прямое дополнение IDIOTKĘ возможно при других глаголах: WIDZIAŁ IDIOTKĘ. Чувствовать себя кем-то — тоже творительный: CZUĆ SIĘ IDIOTKĄ. Родительный множественного IDIOTEK, со вставной гласной E, как DESKA и DESEK." }
