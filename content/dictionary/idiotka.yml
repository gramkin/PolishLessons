etymology: "От IDIOTA, из греческого IDIOTES «частное лицо, человек не при должности», от IDIOS «свой, собственный, частный». Исходно слово не содержало оскорбления вовсе: идиот был просто частным человеком, не занимавшим общественной должности и потому не сведущим в делах полиса. Отсюда через значение «неспециалист, невежда» оно пришло к современному. Тот же корень IDIOS виден в словах IDIOM «идиома», то есть «своеобразное выражение», и IDIOSYNKRAZJA. Русский «идиот» прошёл тот же путь через латынь и французский. Польская женская форма образована суффиксом -KA, как LEKARKA от LEKARZ, и этот суффикс в польском образует женские соответствия почти свободно."
memory: "Пара даёт контраст склонений: idiota — мужское существительное с женскими окончаниями (ten idiota, tego idioty), как obrońca и sprzedawca, а idiotka — обычное женское. Читается «идё́тка»: io даёт «ё» одним слогом. При nazwać нужен творительный: nazwał ją idiotką. Греческое idiotes значило «частное лицо», без всякой брани."
idioms:
