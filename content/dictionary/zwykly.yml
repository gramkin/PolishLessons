# review
id: zwykly
format: 2
lemma: "zwykły"
rank: 851
pos: adj
pron: { cyr: "зву́кўы" }
senses:
  - id: ordinary
    ru: "обычный, обыкновенный"
    examples:
      - pl: "Kolejny zwykły dzień."
        ru: "Очередной обычный день."
        source: { kind: translated, id: 629935 }
      - pl: "On jest zwykłym urzędnikiem."
        ru: "Он обычный служащий."
        source: { kind: translated, id: 525494 }
      - pl: "Tom jest zwykłym nastolatkiem."
        ru: "Том обычный подросток."
        source: { kind: translated, id: 10567260 }
  - id: mere
    ru: "просто, всего лишь (перед существительным)"
    note: "Часто с оттенком «всего лишь, не более чем»."
    examples:
      - pl: "To jest zwykłe polowanie na czarownice."
        ru: "Это обычная охота на ведьм."
        source: { kind: tatoeba, id: 6156512 }
      - pl: "Jest tylko zwykłą dziewczyną."
        ru: "Она просто обычная девушка."
        source: { kind: translated, id: 4789119 }
      - pl: "To zwykła inwazja."
        ru: "Это обычное вторжение."
        source: { kind: translated, id: 738996 }
  - id: plain-people
    ru: "zwykli ludzie — обычные люди"
    examples:
      - pl: "Nie interesują mnie zwykli ludzie."
        ru: "Обычные люди меня не интересуют."
        source: { kind: translated, id: 552901 }
      - pl: "Projektujemy technologie dla zwykłych ludzi."
        ru: "Мы проектируем технологии для обычных людей."
        source: { kind: translated, id: 2006341 }
      - pl: "Na bezsensownej wojnie trudno odróżnić odwagę od zwykłej głupoty."
        ru: "На бессмысленной войне трудно отличить отвагу от обычной глупости."
        source: { kind: tatoeba, id: 12014057 }
notes:
  - { kind: false-friend, text: "Осторожно с формами zwykli и zwykła: чаще всего это не прилагательное, а глагол zwyknąć «иметь обыкновение». Ludzie zwykli żyć w wioskach — «Люди обыкновенно жили в деревнях», а не «обычные люди». Прилагательное узнаётся по согласованию с существительным: zwykli ludzie «обычные люди»." }
  - { kind: usage, text: "Степеней сравнения нет: «обычный» не бывает «обычнее». При необходимости говорят bardziej pospolity или zwyczajny." }
  - { kind: usage, text: "Перед существительным часто значит «всего лишь»: to zwykły politykier «это всего лишь политикан», zwykła formalność «простая формальность»." }
  - { kind: usage, text: "Наречие — zwykle «обычно», и это очень частое слово: Zwykle wstaję o siódmej «Обычно я встаю в семь»." }
collocations:
  - { pl: "zwykły dzień", ru: "обычный день" }
  - { pl: "zwykli ludzie", ru: "обычные люди" }
  - { pl: "zwykła formalność", ru: "простая формальность" }
  - { pl: "jak zwykle", ru: "как обычно" }
family:
  - { pl: "zwykle", ru: "обычно", relation: derived }
  - { pl: "zwyczaj", ru: "обычай", relation: root }
  - { pl: "zwyczajny", ru: "обыкновенный", relation: root }
  - { pl: "przyzwyczaić", ru: "приучить", relation: derived }
etymology: "От zwyczaj «обычай», праславянское *vyknǫti «привыкать» — тот же корень, что в русском «привыкать» и «навык»."
memory: "zwykły — «обычный», и корень тот же, что в русском «привыкать»: zwyczaj «обычай», przyzwyczaić «приучить». Главная ловушка — формы zwykli и zwykła: чаще это глагол zwyknąć «иметь обыкновение» (Ludzie zwykli żyć w wioskach), а не прилагательное. И помните наречие zwykle «обычно» — оно встречается на каждом шагу."
idioms:
