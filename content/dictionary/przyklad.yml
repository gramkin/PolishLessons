# review
id: przyklad
format: 2
lemma: "przykład"
rank: 780
pos: noun
pron: { cyr: "пшы́куат" }
senses:
  - id: example
    ru: "пример"
    examples:
      - pl: "To nie jest najlepszy przykład."
        ru: "Это не лучший пример."
        source: { kind: tatoeba, id: 5369961 }
      - pl: "Podam wam jeszcze jeden przykład."
        ru: "Я приведу вам ещё один пример."
        source: { kind: tatoeba, id: 8658860 }
      - pl: "Przykładów może być mnóstwo."
        ru: "Примеров может быть много."
        source: { kind: tatoeba, id: 2064618 }
  - id: role-model
    ru: "пример для подражания, образец"
    note: "iść za czyimś przykładem «следовать чьему-то примеру», dawać przykład «подавать пример»."
    examples:
      - pl: "Idź za jego przykładem."
        ru: "Следуй его примеру."
        source: { kind: translated, id: 353992 }
      - pl: "Jesteś dobrym przykładem, Tom."
        ru: "Ты хороший пример, Том."
        source: { kind: translated, id: 4475900 }
      - pl: "Rodzice powinni dawać dobry przykład."
        ru: "Родители должны подавать хороший пример."
        source: { kind: authored }
notes:
  - { kind: usage, text: "na przykład «например» — сокращается на письме как np., одно из самых частых сокращений в польском тексте." }
  - { kind: usage, text: "Мужской род, неодушевлённый: ten przykład, dobry przykład. Родительный единственного — przykładu, множественного — przykładów." }
  - { kind: usage, text: "Управление: podać przykład «привести пример», iść za przykładem «следовать примеру» (za + творительный), dla przykładu «для примера»." }
  - { kind: usage, text: "Слово прозрачно: przy- + kład- от kłaść «класть», буквально «приложенное». Русское «пример» устроено иначе, но «прикладывать» — та же основа." }
collocations:
  - { pl: "na przykład", ru: "например" }
  - { pl: "podać przykład", ru: "привести пример" }
  - { pl: "iść za przykładem", ru: "следовать примеру" }
  - { pl: "dawać przykład", ru: "подавать пример" }
family:
  - { pl: "przykładać", ru: "прикладывать", relation: derived }
  - { pl: "kłaść", ru: "класть", relation: root }
etymology: "Приставка przy- плюс kład- от kłaść «класть» — буквально «приложенное, приложение». Русское «прикладывать» содержит ту же основу, хотя «пример» образовано иначе."
memory: "przykład — «пример». Первым делом запомните сокращение: na przykład «например», на письме np. — оно встречается в каждом втором абзаце. Управление: podać przykład «привести пример», iść za przykładem «следовать примеру» (za + творительный), dawać przykład «подавать пример». Слово разбирается прозрачно: przy- + kłaść, то есть «приложенное»."
idioms:
  - { pl: "na przykład", ru: "например" }
  - { pl: "świecić przykładem", ru: "подавать пример" }
  - { pl: "iść za przykładem", ru: "следовать примеру" }
