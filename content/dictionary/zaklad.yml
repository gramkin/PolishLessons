# review
id: zaklad
format: 2
lemma: "zakład"
rank: 1670
pos: noun
pron: { cyr: "за́куат" }
senses:
  - id: bet
    ru: "пари, спор"
    examples:
      - pl: "Przegrał zakład."
        ru: "Он проиграл пари."
        source: { kind: tatoeba, id: 7881238 }
      - pl: "Przegrałem zakład."
        ru: "Я проиграл пари."
        source: { kind: translated, id: 3452662 }
      - pl: "Wygrałem tamten zakład."
        ru: "Я выиграл то пари."
        source: { kind: translated, id: 12060416 }
  - id: establishment
    ru: "предприятие, заведение"
    examples:
      - pl: "Zakład oferuje wymianę pasków w zegarku."
        ru: "Заведение предлагает замену ремешков в часах."
        source: { kind: translated, id: 8617754 }
      - pl: "Pracownicy tego zakładu przeprowadzili strajk."
        ru: "Работники этого предприятия провели забастовку."
        source: { kind: translated, id: 357067 }
      - pl: "Jadę na rowerze do zakładu pracy."
        ru: "Я езжу на велосипеде на работу."
        source: { kind: translated, id: 1414488 }
notes:
  - { kind: usage, text: "Два далёких значения в одном слове: «пари» (przegrać zakład «проиграть пари») и «предприятие, заведение» (zakład pracy «место работы», zakład fryzjerski «парикмахерская»). Различает только контекст." }
  - { kind: usage, text: "iść o zakład — «спорить, биться об заклад»; русское «заклад» и польское zakład — одно и то же слово." }
  - { kind: usage, text: "zakład pracy — «место работы, предприятие»; zakłady в форме множественного часто значит «ставки» (у букмекера)." }
  - { kind: usage, text: "Образовано от założyć «заложить, основать»: и «основанное дело», и «заложенное в спор»." }
collocations:
  - { pl: "przegrać zakład", ru: "проиграть пари" }
  - { pl: "zakład pracy", ru: "место работы" }
  - { pl: "iść o zakład", ru: "биться об заклад" }
etymology: "От założyć «заложить, основать» (za- + łożyć «класть»). Русское «заклад» — то же слово и тот же корень, и значение «пари» сохранилось в обоих языках: «биться об заклад»."
memory: "zakład — и «пари» (przegrać zakład «проиграть пари»), и «предприятие, заведение» (zakład pracy «место работы»). Русское «заклад» — то же слово, отсюда «биться об заклад» = iść o zakład."
idioms:
  - { pl: "przegrać zakład", ru: "проиграть пари" }
  - { pl: "zakład pracy", ru: "место работы" }
  - { pl: "iść o zakład", ru: "биться об заклад" }
formExamplesSkip:
  - { form: "zakładzie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
