  - { pl: "zablokowanie", ru: "блокировка", relation: derived }
etymology: "Приставка za- и BLOKOWAĆ, из немецкого blockieren и французского bloquer, от bloc «блок, глыба». Русское «блокировать» пришло тем же путём и из того же источника, поэтому корень и смысл совпадают полностью. Приставка za- даёт здесь завершённость, как в русском «за-блокировать». Из гнезда вышли BLOKADA «блокада, блокировка», BLOK «блок, жилой дом», ODBLOKOWAĆ «разблокировать», BLOKOWISKO — разговорное о районе панельных домов."
memory: "Про банк и про двор одним словом: zablokować konto «заблокировать счёт», но zablokować wyjazd «загородить выезд». И -owa- в настоящем меняется на -uj-: zablokuję."
idioms:
