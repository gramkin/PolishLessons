notes:
  - { kind: usage, text: "Первое значение русскому знакомо насквозь, потому что слово в оба языка пришло одним путём: ZABLOKOWAĆ KONTO, NUMER, STRONĘ — «заблокировать счёт, номер, страницу». А вот второе значение бытовое, и русский берёт здесь другие глаголы: ZABLOKOWAĆ WYJAZD — «загородить выезд», ZABLOKOWAĆ DRZWI — «заклинить дверь», ZABLOKOWAĆ KOŁO — «заблокировать колесо». То есть по-польски одним словом и про банк, и про машину во дворе, а по-русски придётся выбирать." }
  - { kind: usage, text: "Шестой глагол класса на -OWAĆ в словаре, после DOPILNOWAĆ, DOPASOWAĆ, ZORIENTOWAĆ, OFEROWAĆ и SZYKOWAĆ, и ведёт себя точно так же: в настоящем времени -owa- сменяется на -uj-, то есть ZABLOKUJĘ, ZABLOKUJESZ, ZABLOKUJE, ZABLOKUJĄ, повелительное ZABLOKUJ. Прошедшее и причастия держат -owa-: ZABLOKOWAŁ, ZABLOKOWANY, ZABLOKOWANIE. Класс этот стоит знать твёрдо: почти все заимствованные глаголы входят в польский именно через него, и BLOKOWAĆ — типичный пример." }
  - { kind: government, text: "Переходный, винительный: ZABLOKOWAĆ COŚ — zablokować konto, drogę, wyjazd. Кому заблокировали — дательный: ZABLOKOWALI MI KONTO, ровно как русское «мне заблокировали счёт». Возвратное ZABLOKOWAĆ SIĘ значит «заклиниться, застрять»: ZAMEK SIĘ ZABLOKOWAŁ — «замок заклинило». Несовершенная пара — BLOKOWAĆ, и у неё та же мена на -uj-: BLOKUJĘ, BLOKUJE." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный: сорок одна основная, одиннадцать страдательных причастий и деепричастие ZABLOKOWAWSZY. Страдательное причастие ZABLOKOWANY в живой речи слышно чаще самого глагола, потому что описывает состояние: KONTO ZABLOKOWANE, NUMER ZABLOKOWANY, DROGA ZABLOKOWANA. Отглагольное существительное ZABLOKOWANIE встречается в документах, а в обиходе про запрет говорят BLOKADA." }
