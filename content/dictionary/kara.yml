# review
id: kara
format: 2
lemma: "kara"
rank: 1353
pos: noun
pron: { cyr: "ка́ра" }
senses:
  - id: punishment
    ru: "наказание, кара"
    examples:
      - pl: "Nie minie go kara."
        ru: "Наказание его не минует."
        source: { kind: translated, id: 352283 }
      - pl: "Za każde przestępstwo należy się kara."
        ru: "За каждое преступление полагается наказание."
        source: { kind: translated, id: 767245 }
      - pl: "Gdybyśmy to zrobili, groziłaby nam kara."
        ru: "Если бы мы это сделали, нам грозило бы наказание."
        source: { kind: translated, id: 365149 }
  - id: death-penalty
    ru: "kara śmierci — смертная казнь"
    examples:
      - pl: "Kara śmierci powinna zostać zniesiona."
        ru: "Смертную казнь следует отменить."
        source: { kind: translated, id: 691830 }
      - pl: "Trzeba znieść karę śmierci."
        ru: "Нужно отменить смертную казнь."
        source: { kind: translated, id: 356446 }
      - pl: "Wiele państw zniosło karę śmierci."
        ru: "Многие государства отменили смертную казнь."
        source: { kind: translated, id: 982851 }
  - id: avoid
    ru: "uniknąć kary — избежать наказания"
    examples:
      - pl: "Uniknęli kary."
        ru: "Они избежали наказания."
        source: { kind: translated, id: 363090 }
      - pl: "Tym razem nie uniknie kary."
        ru: "На этот раз он не избежит наказания."
        source: { kind: translated, id: 998887 }
      - pl: "Boję się kary."
        ru: "Я боюсь наказания."
        source: { kind: translated, id: 2905760 }
notes:
  - { kind: government, text: "uniknąć kary «избежать наказания» — родительный падеж. Zasługiwać na karę «заслуживать наказания» — предлог na с винительным." }
  - { kind: usage, text: "Kara śmierci — «смертная казнь», kara cielesna — «телесное наказание». Это самые частые сочетания." }
  - { kind: false-friend, text: "Форма karze в текстах обычно оказывается глаголом karać «наказывать»: Tę zbrodnię karze się śmiercią «Это преступление карается смертью»." }
  - { kind: false-friend, text: "Есть и омоним kary «вороной» (о масти лошади): kara klacz — это «вороная кобыла», а не «кобыла-наказание»." }
collocations:
  - { pl: "kara śmierci", ru: "смертная казнь" }
  - { pl: "uniknąć kary", ru: "избежать наказания" }
  - { pl: "zasługiwać na karę", ru: "заслуживать наказания" }
etymology: "Праславянское *kara «наказание, укор». Русская «кара» — то же слово, только в русском оно звучит книжно, а в польском нейтрально."
memory: "kara — «наказание», нейтральное слово: kara śmierci «смертная казнь», uniknąć kary «избежать наказания» (родительный). Осторожно: форма karze обычно глагол karać, а kara klacz — «вороная кобыла», другое слово."
idioms:
  - { pl: "kara śmierci", ru: "смертная казнь" }
  - { pl: "uniknąć kary", ru: "избежать наказания" }
  - { pl: "kara boska", ru: "кара небесная" }
