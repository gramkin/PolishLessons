# review
id: niebieski
format: 2
lemma: "niebieski"
rank: 1233
pos: adj
pron: { cyr: "небе́ски" }
senses:
  - id: blue
    ru: "синий, голубой"
    examples:
      - pl: "Mój samochód jest niebieski."
        ru: "Моя машина синяя."
        source: { kind: tatoeba, id: 5974899 }
      - pl: "Macie niebieskie oczy?"
        ru: "У Вас голубые глаза?"
        source: { kind: tatoeba, id: 13616086 }
      - pl: "Kolory amerykańskiej flagi to czerwony, biały i niebieski."
        ru: "Цвета американского флага — красный, белый и синий."
        source: { kind: tatoeba, id: 13563203 }
  - id: clothing
    ru: "о цвете одежды: w niebieskim «в синем»"
    examples:
      - pl: "Do twarzy ci w niebieskim."
        ru: "Тебе идёт синее."
        source: { kind: translated, id: 2467057 }
      - pl: "Dziewczyna w niebieskim płaszczu to moja córka."
        ru: "Девушка в синем пальто — моя дочь."
        source: { kind: translated, id: 362942 }
      - pl: "Tom poprosił Mary, żeby włożyła niebieską sukienkę."
        ru: "Том попросил Мэри, чтобы она надела голубое платье."
        source: { kind: tatoeba, id: 6159933 }
  - id: heavenly
    ru: "небесный (от niebo «небо»)"
    examples:
      - pl: "Kocham Boga, Ojca Niebieskiego, który mnie stworzył."
        ru: "Я люблю Бога, Отца Небесного, который меня создал."
        source: { kind: translated, id: 2244749 }
      - pl: "Łatwiej jest wielbłądowi przejść przez ucho igielne niż bogatemu wejść do Królestwa Niebieskiego."
        ru: "Легче верблюду пройти сквозь игольное ушко, чем богатому войти в Царство Небесное."
        source: { kind: translated, id: 2244557 }
      - pl: "W czasie lekcji myślał o niebieskich migdałach."
        ru: "На уроке он витал в облаках."
        source: { kind: translated, id: 613007 }
notes:
  - { kind: false-friend, text: "Niebieski покрывает и русское «синий», и «голубой»: niebieskie oczy — это «голубые глаза», а niebieski samochód — «синяя машина». Отдельное błękitny значит именно «голубой, лазурный»." }
  - { kind: usage, text: "Слово образовано от niebo «небо», буквально «небесный». Отсюда второе значение: Ojciec Niebieski «Отец Небесный», Królestwo Niebieskie «Царство Небесное»." }
  - { kind: usage, text: "Идиома myśleć o niebieskich migdałach «витать в облаках», буквально «думать о голубом миндале»." }
  - { kind: government, text: "О цвете одежды — предложный падеж с w: Do twarzy ci w niebieskim «Тебе идёт синее»." }
collocations:
  - { pl: "niebieskie oczy", ru: "голубые глаза" }
  - { pl: "niebieska sukienka", ru: "синее платье" }
  - { pl: "w niebieskim", ru: "в синем" }
  - { pl: "niebieskie migdały", ru: "мечты, витание в облаках" }
etymology: "От niebo «небо» плюс суффикс -ski: буквально «небесный». Русское «голубой» пришло от «голубя», а «синий» — отдельное праславянское слово, так что пути разошлись."
memory: "niebieski — и «синий», и «голубой» сразу: niebieskie oczy «голубые глаза», niebieski samochód «синяя машина». Образовано от niebo «небо», отсюда Ojciec Niebieski. И идиома myśleć o niebieskich migdałach «витать в облаках»."
idioms:
  - { pl: "niebieskie oczy", ru: "голубые глаза" }
  - { pl: "myśleć o niebieskich migdałach", ru: "витать в облаках" }
  - { pl: "Królestwo Niebieskie", ru: "Царство Небесное" }
