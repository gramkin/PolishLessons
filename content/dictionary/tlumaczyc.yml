# review
id: tlumaczyc
format: 2
lemma: "tłumaczyć"
rank: 529
pos: verb
aspect: imperf
pron: { cyr: "туума́чыць" }
senses:
  - id: translate
    ru: "переводить (с языка на язык)"
    note: "Самое частое значение. Управление: tłumaczyć z + родительный na + винительный."
    examples:
      - pl: "On tłumaczy z francuskiego na japoński."
        ru: "Он переводит с французского на японский."
        source: { kind: tatoeba, id: 5489614 }
      - pl: "Lubię tłumaczyć dialogi."
        ru: "Мне нравится переводить диалоги."
        source: { kind: tatoeba, id: 13785411 }
      - pl: "Jak tłumaczysz to zdanie na angielski?"
        ru: "Как ты переводишь это предложение на английский?"
        source: { kind: translated, id: 13321188 }
  - id: explain
    ru: "объяснять, растолковывать"
    examples:
      - pl: "Tłumaczę."
        ru: "Я объясняю."
        source: { kind: tatoeba, id: 526177 }
      - pl: "Już bitą godzinę to ci tłumaczę."
        ru: "Я тебе это уже битый час объясняю."
        source: { kind: tatoeba, id: 12624965 }
      - pl: "Ile razy ci tłumaczyłem, że twoje wytłumaczenie jest mało przekonywujące?"
        ru: "Сколько раз я тебе объяснял, что твоё объяснение неубедительно."
        source: { kind: translated, id: 897736 }
  - id: make-excuses
    ru: "tłumaczyć się — оправдываться"
    note: "С się значение меняется: не «объяснять», а «оправдываться»."
    examples:
      - pl: "Winny się tłumaczy."
        ru: "Виноватый оправдывается."
        source: { kind: translated, id: 13669986 }
      - pl: "Nie musisz się tłumaczyć."
        ru: "Тебе не нужно оправдываться."
        source: { kind: translated, id: 2402991 }
      - pl: "Zaczął się tłumaczyć."
        ru: "Он начал оправдываться."
        source: { kind: translated, id: 352716 }
notes:
  - { kind: government, text: "tłumaczyć z czegoś na coś — «переводить с чего-то на что-то»: tłumaczyć z polskiego na rosyjski. Предлог z с родительным, na с винительным, ровно как в русском." }
  - { kind: usage, text: "С się глагол значит «оправдываться»: Nie musisz się tłumaczyć «Тебе не нужно оправдываться», Winny się tłumaczy «Виноватый оправдывается». Тот же механизм, что в uczyć / uczyć się." }
  - { kind: false-friend, text: "Существительное tłumacz — это «переводчик», а tłumaczenie — и «перевод», и «объяснение». Русское «толмач» — то же слово, но в русском оно устарело." }
  - { kind: usage, text: "Совершенный вид разный для разных значений: przetłumaczyć «перевести», wytłumaczyć «объяснить». Отсюда и wytłumaczenie «объяснение»." }
collocations:
  - { pl: "tłumaczyć na rosyjski", ru: "переводить на русский" }
  - { pl: "tłumaczyć się", ru: "оправдываться" }
  - { pl: "tłumacz przysięgły", ru: "присяжный переводчик" }
  - { pl: "nie ma sensu się tłumaczyć", ru: "нет смысла оправдываться" }
family:
  - { pl: "tłumacz", ru: "переводчик", relation: derived }
  - { pl: "tłumaczenie", ru: "перевод; объяснение", relation: derived }
  - { pl: "przetłumaczyć", ru: "перевести", relation: derived }
  - { pl: "wytłumaczyć", ru: "объяснить", relation: derived }
etymology: "От старого tłumacz «толмач, переводчик», заимствованного через тюркское посредство; русское «толмач» — то же слово, но в русском оно устарело, а в польском осталось основным."
memory: "tłumaczyć — прежде всего «переводить»: tłumaczyć z polskiego na rosyjski, с z и родительным, na и винительным, как в русском. Второе значение — «объяснять»: Już bitą godzinę ci to tłumaczę. А с частицей się смысл переворачивается в «оправдываться»: Nie musisz się tłumaczyć. Совершенный вид разный для разных значений: przetłumaczyć «перевести», но wytłumaczyć «объяснить». Существительное tłumacz «переводчик» — родня русскому «толмачу»."
idioms:
  - { pl: "tłumaczyć się", ru: "оправдываться" }
  - { pl: "tłumacz przysięgły", ru: "присяжный переводчик" }
  - { pl: "nie ma sensu się tłumaczyć", ru: "нет смысла оправдываться" }
