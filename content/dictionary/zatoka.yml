notes:
  - { kind: false-friend, text: "Слово разбирается на части с первого взгляда: ZA + TOK, то есть «за течением», место, куда вода заходит в сторону от основного потока. Украинское «затока» значит ровно то же самое и устроено так же. Русский для этого понятия выбрал другой образ, «залив», от «лить». Но корень ТОК русскому прекрасно знаком по словам «поток», «проток», «исток», так что ZATOKA разгадывается без словаря, если только не искать сходства с «затокой», которой в русском нет." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа K переходит в C: ZATOKA, но W ZATOCE. Это то же чередование, что в RĘKA — RĘCE и MATKA — MATCE, и оно работает у всех существительных на -KA. Родительный множественного ZATOK, без окончания, как у большинства слов на -A." }
  - { kind: usage, text: "Три значения, и два из них русскому в голову не придут. Первое это залив. Второе анатомическое: ZATOKI, чаще ZATOKI PRZYNOSOWE, это придаточные пазухи носа, а ZAPALENIE ZATOK это гайморит. Третье городское: ZATOKA AUTOBUSOWA или ZATOKA PRZYSTANKOWA это карман у края дороги, куда съезжает автобус. Образ во всех трёх один и тот же: углубление сбоку от основного русла, будь то море, нос или улица." }
  - { kind: government, text: "В заливе — предлог W с местным падежом: W ZATOCE. Над заливом — предлог NAD с творительным: NAD ZATOKĄ. Войти в залив — WPŁYNĄĆ W ZATOKĘ, предлог W с винительным, то есть тот же предлог меняет падеж вместе со смыслом, как и в русском. Автобус съезжает в карман — WJECHAĆ W ZATOKĘ, та же схема." }
  - { kind: pronunciation, text: "Читается «зато́ка», три слога, ударение на втором. Все согласные твёрдые, никаких носовых. В форме ZATOCE сочетание CE даёт твёрдое «цэ», так что слышно «зато́цэ»: польское C это всегда «ц», а не «к» и не «с». В творительном ZATOKĄ конечное Ą даёт «он», и слово звучит «зато́кон», с лёгким носовым призвуком." }
