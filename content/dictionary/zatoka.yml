etymology: "От приставки ZA- и корня ТОК, от праславянского TEK- «течь», того самого, что дал русские «поток», «проток», «исток» и «течение». Залив это место, куда вода заходит за основное течение, в сторону. Украинское «затока» собрано точно так же и значит то же. Русский для моря выбрал «залив», от «лить», а слово «затока» в литературном языке не удержалось. Анатомическое и дорожное значения выросли из того же образа бокового углубления."
memory: "Разбирается на части: za + tok, «за течением», место сбоку от основного русла. Украинское «затока» такое же, русский выбрал «залив» от «лить», но корень ток знаком по «потоку» и «истоку». Три значения из одного образа углубления: залив, пазухи носа (zapalenie zatok это гайморит) и карман для автобуса. В местном падеже k переходит в c: w zatoce, как ręka — ręce. Читается «зато́ка»."
idioms:
