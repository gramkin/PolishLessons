notes:
  - { kind: false-friend, text: "Русское «салат» означает и растение, и блюдо, а польский делит это надвое. SAŁATA — это зелень, лист, то, что растёт на грядке: GŁÓWKA SAŁATY «головка салата». SAŁATKA — приготовленное блюдо, и чаще всего оно вовсе не из листьев: SAŁATKA JARZYNOWA делается из варёных овощей с майонезом и отвечает примерно русскому «оливье». Поэтому заказать SAŁATĘ в ресторане значит получить зелень, а SAŁATKĘ — готовое блюдо. Отдельно стоит SURÓWKA: это салат из сырых овощей без майонеза, и русского однословного соответствия у него нет." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — SAŁATCE, с меной K в C перед окончанием -E; родительный множественного — SAŁATEK, с беглым E. Состав выражается предлогом Z с родительным: SAŁATKA Z POMIDORÓW, SAŁATKA Z TUŃCZYKA. Вид салата называют прилагательным: SAŁATKA JARZYNOWA «овощной», SAŁATKA GRECKA, SAŁATKA OWOCOWA «фруктовый». Уменьшительное от уменьшительного язык не образует, зато есть увеличительное SAŁATA, то есть исходное слово, от которого SAŁATKA и произошла." }
  - { kind: pronunciation, text: "Читается «сауа́тка», три слога, ударение на втором. Буква Ł даёт «у» неслоговое, поэтому середина звучит «уа», а не «ла»: это та же ловушка, что в ZWŁOKA рядом. Сочетание TK произносится слитно и глухо. В форме SAŁATCE сочетание TC читается «тц»: «сауа́тце». В форме SAŁATEK беглое E слышно отчётливо: «сауа́тэк». В форме SAŁATKĄ последнее Ą даёт «он»." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Устойчивые сочетания: SAŁATKA JARZYNOWA, SAŁATKA OWOCOWA, SAŁATKA ZIEMNIACZANA «картофельный салат». В польском застолье салаты занимают особое место: на Рождество и на поминках их ставят по нескольку сразу, и слово звучит в каждом разговоре о приготовлениях. Переносное употребление есть и оно шутливое: SAŁATKA значит путаницу, мешанину, как русское «каша» о беспорядке в голове. Прилагательное SAŁATKOWY относится к посуде: MISKA SAŁATKOWA." }
