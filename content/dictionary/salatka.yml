etymology: "Уменьшительное от SAŁATA, а то — из итальянского INSALATA «посоленное», от SALARE «солить» и SAL «соль». Блюдо названо по способу приготовления: зелень посыпали солью, и этого было достаточно. Польский получил слово через немецкое SALAT, русский — через французское SALADE, и потому два слова звучат по-разному при одном источнике. Расхождение в значении чисто польское: язык воспользовался уменьшительным суффиксом, чтобы отделить блюдо от растения, и получил пару SAŁATA и SAŁATKA там, где русский обходится одним словом и уточняющим прилагательным. Корень SAL тот же, что в «салями», «соусе» и в самой «соли»."
memory: "Польский делит то, что русский держит в одном слове: sałata это растение, лист с грядки, а sałatka — приготовленное блюдо, чаще всего из варёных овощей с майонезом, вроде оливье. Ещё одно слово в ряду: surówka, салат из сырых овощей без майонеза. Из итальянского insalata «посоленное», от sal «соль» — тот же корень, что в «соли» и «салями». Звук: ł это «у», «сауа́тка». Падежи: sałatce с меной k→c, sałatek с беглым e."
