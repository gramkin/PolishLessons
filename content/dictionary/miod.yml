        ru: "Двойняк — крепкая медовуха."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Читается «мют», один слог. Ó звучит как «у», и после мягкого «м» получается «мю». Конечное D оглушается в «т». В косвенных формах вместо Ó пишется O и звучит «ё»: MIODU — «мёду»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Ó в корне чередуется с O: MIÓD, но MIODU, MIODEM, так же как STÓŁ и STOŁU, WÓZ и WOZU. В местном падеже D переходит в DZ: W MIODZIE. Множественное MIODY значит «сорта мёда»." }
  - { kind: government, text: "Чай с мёдом — HERBATA Z MIODEM, творительный после Z. Ложка мёда — ŁYŻKA MIODU, родительный. Липнуть, как мухи на мёд — CIĄGNĄĆ JAK MUCHY DO MIODU: у поляка мухи летят «к мёду», DO с родительным, а не «на мёд»." }
  - { kind: false-friend, text: "MIÓD PITNY — не «питьевой мёд», а медовуха, старинный польский напиток; крепкие сорта называют DWÓJNIAK и TRÓJNIAK. CUD-MIÓD, «чудо-мёд», говорят обо всём прекрасном: TA SUKIENKA TO CUD-MIÓD — «платье просто чудо». А MIODOWY MIESIĄC — медовый месяц, как у нас." }
collocations:
  - { pl: "miód lipowy", ru: "липовый мёд" }
  - { pl: "miód pitny", ru: "медовуха" }
  - { pl: "herbata z miodem", ru: "чай с мёдом" }
family:
  - { pl: "miodowy", ru: "медовый", relation: derived, id: miodowy }
  - { pl: "miodek", ru: "мёдок", relation: derived }
  - { pl: "miodownik", ru: "медовый пряник, медовик", relation: derived }
etymology: "Слово праславянское, общее с русским «мёд». Польское Ó на месте русского «ё» — обычное соответствие в закрытом слоге: MIÓD и «мёд», LÓD и «лёд». Тот же древний индоевропейский корень дал английское MEAD, медовуху."
memory: "Miód — «мёд», читается «мют»: ó звучит как «у», d оглушается. В косвенных формах o: miodu, miodem, а в местном w miodzie. Miód pitny — медовуха. Cud-miód — просто чудо. И мухи летят do miodu, «к мёду»."
idioms:
  - { pl: "cud-miód", ru: "просто чудо, лучше не бывает" }
  - { pl: "ciągnąć jak mucha do miodu", ru: "липнуть как муха на мёд" }
  - { pl: "bez zachodu nie ma miodu", ru: "без труда не выловишь и рыбку из пруда" }
