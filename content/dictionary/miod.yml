senses:
  - id: honey
    ru: "мёд"
    examples:
      - pl: "Herbata z miodem pomaga na kaszel."
        ru: "Чай с мёдом помогает от кашля."
        source: { kind: authored }
      - pl: "Pszczoły zbierają nektar i robią miód."
