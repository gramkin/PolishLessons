notes:
  - { kind: false-friend, text: "Русский «шум» и польское szum — одно слово. Но szum чаще о ровном природном звуке: шум леса, моря, ветра. Громкий шум людей — hałas." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — szumu." }
  - { kind: usage, text: "Оборот robić szum wokół czegoś значит «поднимать шумиху вокруг чего-л.»." }
  - { kind: usage, text: "Глагол szumieć «шуметь»: las szumi «лес шумит»." }
collocations:
  - { pl: "szum morza", ru: "шум моря" }
  - { pl: "robić szum", ru: "поднимать шумиху" }
etymology: "Праславянское *šumъ; русский «шум» — то же слово."
memory: "szum — «шум», чаще ровный природный: szum morza, szum drzew. Громкий людской шум — hałas. Оборот robić szum — «поднимать шумиху»."
