# review
id: zle
format: 2
lemma: "źle"
rank: 326
pos: adv
pron: { cyr: "зьле" }
senses:
  - id: badly
    ru: "плохо"
    examples:
      - pl: "Źle słyszę."
        ru: "Я плохо слышу."
        source: { kind: tatoeba, id: 2146070 }
      - pl: "Po prostu źle spałem."
        ru: "Я просто не очень хорошо спал."
        source: { kind: tatoeba, id: 13784838 }
      - pl: "Naprawdę źle się dzisiaj czuję."
        ru: "Я себя реально плохо чувствую сегодня."
        source: { kind: tatoeba, id: 12569635 }
  - id: worse
    ru: "плохо (о ходе дел); gorzej — хуже"
    examples:
      - pl: "To się źle skończy."
        ru: "Это плохо кончится."
        source: { kind: tatoeba, id: 6327958 }
      - pl: "Czasami wszystko idzie źle."
        ru: "Иногда все идет плохо."
        source: { kind: tatoeba, id: 2125491 }
      - pl: "Źle wymierzył i spudłowal."
        ru: "Он плохо прицелился и промахнулся."
        source: { kind: tatoeba, id: 1350202 }
notes:
  - { kind: usage, text: "Степени супплетивные, ровно как в русском: źle — gorzej — najgorzej («плохо — хуже — хуже всего»)." }
  - { kind: usage, text: "źle się czuję — «я плохо себя чувствую»; źle mi — «мне плохо»; nie najgorzej — «неплохо»." }
  - { kind: false-friend, text: "Наречие образовано от zły, а оно значит и «злой», и «плохой»: zły człowiek «злой человек», zła pogoda «плохая погода»." }
collocations:
  - { pl: "źle się czuć", ru: "плохо себя чувствовать" }
  - { pl: "źle wygląda", ru: "плохо выглядит" }
  - { pl: "coraz gorzej", ru: "всё хуже" }
  - { pl: "nie najgorzej", ru: "неплохо" }
etymology: "От zły «злой, плохой», праславянское *zъlъ — то же слово, что русское «злой»; сравнительная степень gorzej образована от другого корня, как русское «хуже»."
memory: "źle — «плохо», и степени супплетивные, как в русском: źle — gorzej — najgorzej. А zły значит сразу и «злой», и «плохой»."
idioms:
  - { pl: "coraz gorzej", ru: "всё хуже и хуже" }
  - { pl: "źle się czuć", ru: "плохо себя чувствовать" }
  - { pl: "nie najgorzej", ru: "неплохо" }
