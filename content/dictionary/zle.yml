  - form: "najgorzej"
    pl: "Z matematyki poszło mu najgorzej."
    ru: "Хуже всего у него вышло с математикой."
    source: { kind: authored }
  - form: "najgorzej"
    pl: "Najgorzej, gdy nikt nic nie mówi."
    ru: "Хуже всего, когда никто ничего не говорит."
    source: { kind: authored }
