# review
id: pokazac
format: 2
lemma: "pokazać"
rank: 268
pos: verb
aspect: perf
pron: { cyr: "пока́заць" }
senses:
  - id: show
    ru: "показать (что-либо)"
    examples:
      - pl: "Pokaż nam drogę!"
        ru: "Покажи нам дорогу!"
        source: { kind: tatoeba, id: 8446168 }
      - pl: "Pokaż mi pieniądze."
        ru: "Покажи мне деньги."
        source: { kind: tatoeba, id: 3526139 }
      - pl: "Pokazał mi swój album."
        ru: "Он показал мне свой альбом."
        source: { kind: tatoeba, id: 742715 }
  - id: show-to
    ru: "показать кому-либо; pokazać się — показаться, появиться"
    note: "pokazać komuś coś — дательный и винительный, как в русском."
    examples:
      - pl: "Tom pokazał mi to."
        ru: "Том показал мне это."
        source: { kind: tatoeba, id: 3416422 }
      - pl: "Pokazał tobie zdjęcie?"
        ru: "Он показал тебе фотографию?"
        source: { kind: tatoeba, id: 3696314 }
      - pl: "Pokażę ci, że mam rację."
        ru: "Я докажу тебе, что прав."
        source: { kind: tatoeba, id: 6316952 }
notes:
  - { kind: usage, text: "Управление совпадает с русским: pokazać komuś coś — Pokaż mi drogę «Покажи мне дорогу», Pokazał nam zdjęcia." }
  - { kind: usage, text: "Возвратное pokazać się значит «показаться, появиться»: Pokazało się słońce «Показалось солнце»." }
  - { kind: usage, text: "Несовершенный вид — pokazywać: Pokazuję mu miasto." }
  - { kind: usage, text: "Корень kazać значит «велеть», но в паре с po- дал «показать» — как русские «казать», «показать», «сказать»." }
collocations:
  - { pl: "pokazać drogę", ru: "показать дорогу" }
  - { pl: "pokazać się", ru: "показаться" }
  - { pl: "pokaż mi", ru: "покажи мне" }
  - { pl: "czas pokaże", ru: "время покажет" }
etymology: "Из po- + kazać, от праславянского *kazati «показывать, говорить»; тот же корень, что в русских «казать», «показать», «сказать»."
memory: "pokazać — «показать», и управление как в русском: pokazać komuś coś, Pokaż mi drogę. А pokazać się значит «показаться, появиться»."
idioms:
  - { pl: "pokazać język", ru: "показать язык" }
  - { pl: "pokazać, gdzie raki zimują", ru: "показать, где раки зимуют" }
  - { pl: "pokazać klasę", ru: "показать класс" }
