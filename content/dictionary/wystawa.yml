etymology: "От WYSTAWIĆ, сложенного из WY- и STAWIĆ «ставить», из праславянского *staviti, того же корня, что русские «ставить», «выставить», «выставка». То есть слово построено в двух языках из одинаковых частей и значит буквально «выставленное». Расхождение чисто смысловое: польский распространил слово и на витрину, потому что товар в витрине тоже выставлен, а русский для витрины взял французское VITRINE, от VITRE «стекло». Так одна метафора выставления покрыла в польском оба случая, а русский один из них отдал заимствованию. Из того же гнезда идут WYSTAWCA, WYSTAWOWY и WYSTAWNY «роскошный», где исходное значение показа видно в оттенке напоказ."
memory: "Одно слово на два русских: wystawa — и «выставка» (wystawa malarstwa), и «витрина» (wystawa sklepowa). Oglądać wystawy значит «разглядывать витрины», а не ходить по музеям. Построено как русская «выставка», от wystawić «выставить», но русский для витрины взял французское слово. В дательном и местном w только смягчается: wystawie — в отличие от przejażdżce (k→c) и szmacie (t→c)."
