notes:
  - { kind: false-friend, text: "Одно польское слово отвечает двум русским. WYSTAWA — это «выставка», как в музее: WYSTAWA MALARSTWA, WYSTAWA ŚWIATOWA. И это же слово значит «витрина»: WYSTAWA SKLEPOWA «витрина магазина», TOWAR NA WYSTAWIE «товар в витрине». Русский развёл эти значения по двум словам, и «выставка» о витрине не говорится. Поэтому PATRZEĆ NA WYSTAWY значит «смотреть на витрины», то есть разглядывать магазины, а не ходить по музеям. Отдельно существует WYSTAWCA «экспонент, участник выставки» и WYSTAWIAĆ «выставлять», от которого слово и образовано." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа губное W только смягчается перед окончанием -IE: WYSTAWIE, без чередования в основе. Это стоит сравнить с двумя соседями по карточке, где перед тем же окончанием согласный меняется: PRZEJAŻDŻKA даёт PRZEJAŻDŻCE с переходом K в C, а SZMATA даёт SZMACIE с переходом T в C. Родительный множественного — WYSTAW, с нулевым окончанием и без вставной гласной. Форма WYSTAWY покрывает родительный единственного вместе с именительным и винительным множественного." }
  - { kind: government, text: "Женский род. Чего выставка — родительный: WYSTAWA MALARSTWA, WYSTAWA FOTOGRAFII. «На выставке» — предлог NA с местным: NA WYSTAWIE. «На выставку» — NA с винительным: POJECHAĆ NA WYSTAWĘ. Частотные глаголы: OTWORZYĆ WYSTAWĘ «открыть выставку», ZWIEDZIĆ WYSTAWĘ «осмотреть выставку», PRZYGOTOWAĆ WYSTAWĘ. В значении витрины: TOWAR NA WYSTAWIE, OGLĄDAĆ WYSTAWY «разглядывать витрины». Прилагательное WYSTAWOWY значит «выставочный»: SALA WYSTAWOWA." }
  - { kind: pronunciation, text: "Читается «выста́ва», три слога, ударение на предпоследнем. Буква Y в первом слоге даёт «ы», поэтому начало звучит «вы», а не «ви». Группа ST выговаривается слитно. Буква W между гласными читается «в». В дательном и местном WYSTAWIE сочетание WIE даёт мягкое «ве»: «выста́ве». В родительном множественного WYSTAW конечное W оглушается до «ф»: «вы́стаф»." }
