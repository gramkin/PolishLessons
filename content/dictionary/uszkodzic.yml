# review
id: uszkodzic
format: 2
lemma: "uszkodzić"
rank: 1826
pos: verb
aspect: perf
pron: { cyr: "ушко́дзиць" }
senses:
  - id: damage
    ru: "повредить (предмет)"
    examples:
      - pl: "Uwaga, proszę nie uszkodzić tego wazonu."
        ru: "Осторожно, не повредите эту вазу."
        source: { kind: translated, id: 355833 }
      - pl: "Byłoby lepiej tego nie uszkodzić."
        ru: "Лучше бы это не повредить."
        source: { kind: translated, id: 6109682 }
      - pl: "Wypadek uszkodził przednie koła jej wozu."
        ru: "Авария повредила передние колёса её машины."
        source: { kind: translated, id: 4917260 }
      - pl: "Dach został uszkodzony podczas burzy."
        ru: "Крыша была повреждена штормом."
        source: { kind: tatoeba, id: 363024 }
      - pl: "Mój bagaż został uszkodzony."
        ru: "Мой багаж повредили."
        source: { kind: translated, id: 3757120 }
      - pl: "Plik jest uszkodzony."
        ru: "Файл повреждён."
        source: { kind: translated, id: 5930838 }
  - id: injure
    ru: "повредить (часть тела)"
    examples:
      - pl: "Kiedy upadł, uszkodził sobie lewą nogę."
        ru: "Когда он упал, он повредил себе левую ногу."
        source: { kind: translated, id: 880299 }
      - pl: "Uszkodziłem sobie bark."
        ru: "Я повредил себе плечо."
        source: { kind: translated, id: 362829 }
      - pl: "Palenie uszkodziło mu płuca."
        ru: "Курение повредило ему лёгкие."
        source: { kind: translated, id: 856187 }
notes:
  - { kind: usage, text: "Совершенный вид к uszkadzać. Отличается от zepsuć «испортить, сломать»: uszkodzić — нанести повреждение, чаще частичное, zepsuć — вывести из строя." }
  - { kind: usage, text: "О частях тела употребляется с возвратным местоимением sobie: uszkodził sobie nogę «он повредил себе ногу»." }
  - { kind: usage, text: "Страдательное причастие uszkodzony «повреждённый» встречается едва ли не чаще самого глагола: plik jest uszkodzony «файл повреждён»." }
  - { kind: usage, text: "Отглагольное существительное — uszkodzenie «повреждение»." }
  - { kind: false-friend, text: "О людях так не говорят. Повреждают вещь или часть тела — uszkodzić ekran, uszkodzić kolano, — а о пострадавших людях скажут ranni или poszkodowani." }
collocations:
  - { pl: "uszkodzić sobie nogę", ru: "повредить себе ногу" }
  - { pl: "zostać uszkodzonym", ru: "быть повреждённым" }
  - { pl: "uszkodzenie ciała", ru: "телесное повреждение" }
etymology: "u- + szkodzić «вредить», от szkoda «вред, ущерб». Русское «вредить» — другой корень, зато польское szkoda узнаётся через заимствованное «шкода»."
memory: "uszkodzić — «повредить», совершенный вид к uszkadzać. О частях тела — с sobie: uszkodził sobie nogę. Чаще всего встречается причастие uszkodzony «повреждён»."
idioms:
  - { pl: "uszkodzić sobie nogę", ru: "повредить себе ногу" }
  - { pl: "plik jest uszkodzony", ru: "файл повреждён" }
  - { pl: "uszkodzenie ciała", ru: "телесное повреждение" }
formExamplesSkip:
  - { form: "uszkodzeni", reason: "uszkodzić говорится о вещи или о части тела, но не о человеке целиком: о пострадавших людях поляк скажет ranni «раненые» или poszkodowani «пострадавшие», а не uszkodzeni" }
