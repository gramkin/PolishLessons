# review
id: drzewo
format: 2
lemma: "drzewo"
rank: 957
pos: noun
pron: { cyr: "джэ́во" }
senses:
  - id: tree
    ru: "дерево"
    examples:
      - pl: "To jest drzewo."
        ru: "Это дерево."
        source: { kind: tatoeba, id: 8352070 }
      - pl: "Zrąbał drzewo."
        ru: "Он срубил дерево."
        source: { kind: tatoeba, id: 6328223 }
      - pl: "Kto posadził te drzewa?"
        ru: "Кто посадил эти деревья?"
        source: { kind: tatoeba, id: 12476409 }
  - id: on-tree
    ru: "na drzewie, pod drzewem — на дереве, под деревом"
    examples:
      - pl: "Chłopiec wyciął swoje imię na drzewie."
        ru: "Мальчик вырезал своё имя на дереве."
        source: { kind: tatoeba, id: 1453205 }
      - pl: "Siedziała pod drzewem."
        ru: "Она сидела под деревом."
        source: { kind: tatoeba, id: 754201 }
      - pl: "Małpy żyją na drzewach."
        ru: "Обезьяны живут на деревьях."
        source: { kind: tatoeba, id: 6156506 }
  - id: family-tree
    ru: "drzewo genealogiczne — генеалогическое древо"
    examples:
      - pl: "Od czego zacząć tworzenie drzewa genealogicznego?"
        ru: "С чего начать построение генеалогического древа?"
        source: { kind: tatoeba, id: 12470274 }
      - pl: "Liście już spadają z drzew."
        ru: "Листья уже опадают с деревьев."
        source: { kind: tatoeba, id: 6849525 }
      - pl: "Posadźmy tu dużo drzew."
        ru: "Посадим здесь много деревьев."
        source: { kind: translated, id: 735860 }
notes:
  - { kind: usage, text: "drzewo genealogiczne — «генеалогическое древо», устойчивое сочетание. Русское «древо» в этом обороте книжное, польское drzewo — обычное слово." }
  - { kind: usage, text: "Древесина как материал — drewno, а не drzewo: meble z drewna «мебель из дерева». Различие чёткое, и его стоит запомнить." }
  - { kind: government, text: "na drzewie «на дереве» — предложный, na drzewo «на дерево» — винительный; pod drzewem «под деревом» — творительный." }
  - { kind: usage, text: "Лес из таких деревьев — las, роща — gaj. Прилагательное drzewny значит «древесный»." }
collocations:
  - { pl: "drzewo genealogiczne", ru: "генеалогическое древо" }
  - { pl: "na drzewie", ru: "на дереве" }
  - { pl: "pod drzewem", ru: "под деревом" }
  - { pl: "drewno", ru: "древесина" }
family:
  - { pl: "drewno", ru: "древесина", relation: root }
  - { pl: "drzewny", ru: "древесный", relation: derived }
  - { pl: "las", ru: "лес", relation: root, id: las }
etymology: "Праславянское *dervo, из праиндоевропейского *dóru. Русское «дерево» — то же слово, только польское rze на месте русского ере: drzewo — дерево, brzeg — берег."
memory: "drzewo — «дерево» растущее. Древесина как материал это drewno, и путать их не стоит: meble z drewna «мебель из дерева». Запомните чередование rze — ере: drzewo — дерево, brzeg — берег. И drzewo genealogiczne «родословное древо»."
idioms:
  - { pl: "drzewo genealogiczne", ru: "генеалогическое древо" }
  - { pl: "na drzewie", ru: "на дереве" }
  - { pl: "pod drzewem", ru: "под деревом" }
