# review
id: mila
format: 2
lemma: "mila"
rank: 1009
pos: noun
pron: { cyr: "ми́ля" }
senses:
  - id: mile
    ru: "миля (единица длины)"
    examples:
      - pl: "Jeden węzeł to jedna mila morska na godzinę."
        ru: "Один узел — это одна морская миля в час."
        source: { kind: tatoeba, id: 12302150 }
      - pl: "Ta rzeka ma 500 mil długości."
        ru: "Эта река длиной в пятьсот миль."
        source: { kind: translated, id: 359116 }
      - pl: "Mieszkam zaledwie milę stąd."
        ru: "Я живу всего в миле отсюда."
        source: { kind: translated, id: 351297 }
  - id: distance
    ru: "миля как мера расстояния вообще"
    examples:
      - pl: "Żyjemy wiele mil od siebie."
        ru: "Мы живём за много миль друг от друга."
        source: { kind: translated, id: 3844573 }
      - pl: "Ostatnia mila jest najdłuższa."
        ru: "Последняя миля — самая длинная."
        source: { kind: translated, id: 3656488 }
notes:
  - { kind: false-friend, text: "Главная трудность — формы. mile и mili в корпусе почти всегда принадлежат прилагательному miły «милый»: Bądźcie mili «Будьте милы», Jest mile widziany «Его тут рады видеть». К мере длины они отношения не имеют." }
  - { kind: usage, text: "Различайте написание: mila «миля» через l, miła «милая» через ł. Разница в одной букве." }
  - { kind: usage, text: "Женский род: mila, mili, milę. В Польше считают в километрах, так что миля встречается в переводах и в морском деле." }
  - { kind: usage, text: "mila morska — «морская миля», единица в судоходстве и авиации." }
collocations:
  - { pl: "mila morska", ru: "морская миля" }
  - { pl: "o milę stąd", ru: "в миле отсюда" }
  - { pl: "wiele mil", ru: "много миль" }
etymology: "Из латинского milia passuum «тысяча шагов» через немецкий. Русская «миля» пришла тем же путём, поэтому слова совпадают."
memory: "mila — «миля», но главная трудность не в значении: формы mile и mili почти всегда принадлежат прилагательному miły «милый». Bądźcie mili! это «Будьте милы!», а вовсе не про мили. И различайте написание: mila через l, miła через ł."
idioms:
  - { pl: "mila morska", ru: "морская миля" }
  - { pl: "o milę stąd", ru: "в миле отсюда" }
  - { pl: "jednym krokiem mili nie ujdziesz", ru: "одним шагом мили не пройдёшь" }
