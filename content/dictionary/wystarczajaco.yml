  - { pl: "wystarczający", ru: "достаточный", relation: derived }
etymology: "Наречие от причастия wystarczający, от глагола wystarczyć «хватить», собранного из wy- и starczyć. Русское «достаточно» — от «достать», логика та же: «дотянуться до нужного»."
memory: "wystarczająco — «достаточно». Покороче и поразговорнее будут dość и dosyć, а безличное Wystarczy! значит «Хватит!»."
idioms:
