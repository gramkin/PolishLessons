# review
id: wystarczajaco
format: 2
lemma: "wystarczająco"
rank: 1087
pos: adv
pron: { cyr: "выстарчайо́нцо" }
senses:
  - id: enough
    ru: "достаточно, довольно"
    examples:
      - pl: "Mam wystarczająco pieniędzy."
        ru: "У меня достаточно денег."
        source: { kind: tatoeba, id: 2631235 }
      - pl: "Tutaj jest wystarczająco miejsca dla każdego."
        ru: "Здесь для каждого достаточно места."
        source: { kind: tatoeba, id: 4720748 }
      - pl: "Wystarczająco szybko."
        ru: "Достаточно быстро."
        source: { kind: translated, id: 10567239 }
  - id: with-adj
    ru: "достаточно + прилагательное или наречие"
    examples:
      - pl: "Chleb nie jest wystarczająco świeży."
        ru: "Хлеб недостаточно свежий."
        source: { kind: tatoeba, id: 13694048 }
      - pl: "Nie masz wystarczająco dużo doświadczenia."
        ru: "У тебя ещё недостаточно опыта."
        source: { kind: tatoeba, id: 6313068 }
notes:
  - { kind: usage, text: "Наречие от причастия wystarczający «достаточный», а оно — от глагола wystarczyć «хватить»." }
  - { kind: usage, text: "Рядом живут два синонима покороче: dość и dosyć. Wystarczająco чуть официальнее." }
  - { kind: usage, text: "wystarczająco dużo «достаточно много» — усиленный вариант, очень частый в речи." }
  - { kind: false-friend, text: "Безличное wystarczy значит «хватит, достаточно» как реплика: Wystarczy! «Хватит!». Само wystarczająco так не употребляется." }
collocations:
  - { pl: "wystarczająco dużo", ru: "достаточно много" }
  - { pl: "wystarczająco szybko", ru: "достаточно быстро" }
  - { pl: "nie wystarczająco", ru: "недостаточно" }
family:
