# review
id: sie
format: 2
depth: deep
lemma: "się"
rank: 4
pos: part
pron: { cyr: "сье" }
senses:
  - id: reflexive
    ru: "себя: действие направлено на самого деятеля (myć się, golić się, budzić się)"
    note: "Прямое соответствие русскому -ся в «мыться», «бриться», «просыпаться»."
    examples:
      - pl: "Kobieta budzi się."
        ru: "Женщина просыпается."
        source: { kind: tatoeba, id: 6320920 }
      - pl: "Każdego ranka golę się."
        ru: "Я бреюсь каждое утро."
        source: { kind: tatoeba, id: 3786689 }
      - pl: "Jak się czujesz?"
        ru: "Как ты себя чувствуешь?"
        source: { kind: tatoeba, id: 1109960 }
  - id: inherent
    ru: "глаголы, которые без się не употребляются (bać się, uczyć się, śmiać się, spóźnić się)"
    note: "Здесь się — не «себя», а неотделимая часть глагола: формы без niego просто не существует."
    examples:
      - pl: "Boję się psów."
        ru: "Я боюсь собак."
        source: { kind: tatoeba, id: 591364 }
      - pl: "Tom uczy się programowania."
        ru: "Том учится программированию."
        source: { kind: tatoeba, id: 5370010 }
      - pl: "Tom spóźnił się do pracy."
        ru: "Том опоздал на работу."
        source: { kind: tatoeba, id: 8160905 }
  - id: reciprocal
    ru: "друг друга: взаимное действие (znać się, spotkać się, całować się)"
    examples:
      - pl: "Tom nie miał ochoty spotkać się z Mary."
        ru: "У Тома не было желания встречаться с Мэри."
        source: { kind: tatoeba, id: 6017180 }
      - pl: "Znamy się od dziecka."
        ru: "Мы знакомы с детства."
        source: { kind: authored }
      - pl: "Całują się na pożegnanie."
        ru: "Они целуются на прощание."
        source: { kind: authored }
  - id: impersonal
    ru: "безличное «говорят, делают»: 3-е лицо + się"
    note: "Русскому «говорят, делают» без подлежащего отвечает mówi się, robi się — глагол стоит в 3-м лице единственного числа."
    examples:
      - pl: "Mąkę robi się z pszenicy."
        ru: "Муку делают из пшеницы."
        source: { kind: tatoeba, id: 831693 }
      - pl: "Po jakiemu mówi się w Korei?"
        ru: "На каком языке говорят в Корее?"
        source: { kind: tatoeba, id: 640342 }
      - pl: "Wino robi się z winogron."
        ru: "Вино делается из винограда."
        source: { kind: tatoeba, id: 8160835 }
  - id: dative
    ru: "с дательным: chce mi się «мне хочется», podoba mi się «мне нравится», udało się «удалось»"
    examples:
      - pl: "Pić mi się chce."
        ru: "Я хочу пить."
        source: { kind: tatoeba, id: 349176 }
      - pl: "Nie podoba mi się kolor."
        ru: "Мне не нравится цвет."
        source: { kind: tatoeba, id: 12476559 }
      - pl: "Nie udało nam się go przekonać."
        ru: "Нам не удалось его убедить."
        source: { kind: tatoeba, id: 6373129 }
  - id: change
    ru: "становление и происшествие: stać się «стать, случиться», okazać się «оказаться», robi się «становится»"
    examples:
      - pl: "To stało się w październiku."
        ru: "Это случилось в октябре."
        source: { kind: tatoeba, id: 10602881 }
      - pl: "Tom okazał się złodziejem."
        ru: "Том оказался вором."
        source: { kind: tatoeba, id: 3230919 }
      - pl: "Robi się ciemno."
        ru: "Темнеет."
        source: { kind: authored }
  - id: located
    ru: "положение, название, начало: znajdować się «находиться», nazywać się «называться», zaczynać się «начинаться»"
    examples:
      - pl: "Dworzec znajduje się w centrum miasta."
        ru: "Вокзал находится в центре города."
        source: { kind: tatoeba, id: 1354588 }
      - pl: "Jak nazywa się ten ptak?"
        ru: "Как называется эта птица?"
        source: { kind: tatoeba, id: 364012 }
      - pl: "Wakacje zaczynają się w lipcu."
        ru: "Каникулы начинаются в июле."
        source: { kind: tatoeba, id: 12564132 }
  - id: meaning-shift
    ru: "się меняет значение глагола: uczyć «учить кого-то» → uczyć się «учиться», znać «знать» → znać się «разбираться»"
    note: "Пара без się и с się может значить совсем разное — это одна из главных ловушек."
    examples:
      - pl: "Nie znam się na tym."
        ru: "Я в этом не разбираюсь."
        source: { kind: tatoeba, id: 9019751 }
      - pl: "Czego się uczysz w szkole?"
        ru: "Что ты учишь в школе?"
        source: { kind: tatoeba, id: 362512 }
      - pl: "Uczę dzieci, a sam uczę się polskiego."
        ru: "Я учу детей, а сам учусь польскому."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Порядок слов — главное отличие от русского. się не приклеивается к глаголу: оно свободно стоит перед ним или после него, но никогда не открывает предложение. Jak się nazywasz? «Как тебя зовут?», Nie boję się «Я не боюсь»." }
  - { kind: usage, text: "Если в предложении два глагола, się может стоять при любом из них: Nie chcę się uczyć и Nie chcę uczyć się одинаково правильны, но первый вариант естественнее." }
  - { kind: usage, text: "После вопросительного слова, отрицания или союза się обычно уходит вперёд, ближе к началу: Czego się boisz?, Nic mi się nie podoba, Znowu się zaczyna." }
  - { kind: usage, text: "się не меняется по лицам и числам — одна форма на всё: myję się, myjesz się, myjemy się. В русском -ся/-сь сливается с глаголом и меняет вид (мою-сь, мое-шься), в польском это отдельное слово." }
  - { kind: false-friend, text: "Различайте три слова: się — безударная частица при глаголе (myję się); siebie — ударная форма, обязательная после предлога (dla siebie «для себя»); sobie — дательный падеж (kupiłem sobie książkę «купил себе книгу»)." }
  - { kind: usage, text: "В прошедшем времени безличность чаще передаётся формой на -no/-to, а не через się: mówiono «говорили», zrobiono «сделали»." }
collocations:
  - { pl: "uczyć się", ru: "учиться" }
  - { pl: "bać się", ru: "бояться" }
  - { pl: "podobać się", ru: "нравиться" }
  - { pl: "nazywać się", ru: "называться, зваться" }
  - { pl: "znajdować się", ru: "находиться" }
  - { pl: "czuć się", ru: "чувствовать себя" }
  - { pl: "spieszyć się", ru: "спешить" }
