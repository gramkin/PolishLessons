  - { pl: "udać się", ru: "удаться" }
etymology: "Праславянское *sę — краткая (безударная) форма возвратного местоимения; то же самое, что русское -ся в «умываться». Полная форма — siebie, дательный — sobie."
memory: "Русское -ся приклеено к глаголу намертво, польское się — отдельное слово, которое ходит по предложению: Jak się masz? но Nie chcę się uczyć и даже Uczyć się trzeba. Запомните три ступени: się (безударное при глаголе), siebie (после предлога), sobie (дательный). И держите в голове пары, где się переворачивает смысл: uczyć «учить кого-то» — uczyć się «учиться», znać «знать» — znać się «разбираться», stać «стоять» — stać się «стать»."
