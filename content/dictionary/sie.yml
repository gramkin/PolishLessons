# review
id: sie
format: 2
lemma: "się"
rank: 4
pos: part
pron: { cyr: "сье" }
senses:
  - id: reflexive
    ru: "возвратная частица: -ся, -сь"
    note: "Пишется отдельно от глагола и может стоять перед ним."
    examples:
      - pl: "Zgadzam się."
        ru: "Я согласен."
        source: { kind: tatoeba, id: 349105 }
      - pl: "Zamknij się!"
        ru: "Заткнись!"
        source: { kind: tatoeba, id: 524093 }
      - pl: "Uspokój się."
        ru: "Успокойся."
        source: { kind: tatoeba, id: 547699 }
  - id: impersonal
    ru: "в безличных оборотах: mówi się — говорят"
    examples:
      - pl: "Tak się mówi."
        ru: "Так говорят."
        source: { kind: authored }
      - pl: "Jak się to robi?"
        ru: "Как это делается?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "В отличие от русского -ся, się — отдельное слово: оно может стоять перед глаголом (Nie chcę się uczyć) и отрываться от него." }
collocations:
  - { pl: "uczyć się", ru: "учиться" }
  - { pl: "bać się", ru: "бояться" }
  - { pl: "podobać się", ru: "нравиться" }
etymology: "Праславянское *sę — краткая форма возвратного местоимения; то же самое, что русское -ся в «умываться»."
memory: "się — та же частица, что русское -ся, но пишется отдельно и не обязана стоять после глагола: Jak się nazywasz? «Как тебя зовут?», Nie chcę się uczyć «Не хочу учиться». Полноударная форма — siebie."
idioms:
  - { pl: "mieć się dobrze", ru: "хорошо себя чувствовать" }
  - { pl: "tak się składa", ru: "так уж выходит" }
  - { pl: "jak się masz?", ru: "как дела?" }
formExamples:
  - form: "się"
    pl: "Uspokój się."
    ru: "Успокойся."
    source: { kind: tatoeba, id: 547699 }
  - form: "się"
    pl: "Spieszę się."
    ru: "Я спешу."
    source: { kind: tatoeba, id: 1302776 }
  - form: "się"
    pl: "Nie martw się."
    ru: "Не волнуйся."
    source: { kind: authored }
