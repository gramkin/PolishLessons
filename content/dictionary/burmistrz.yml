lemma: "burmistrz"
rank: 1677
pos: noun
pron: { cyr: "бу́рмистш" }
senses:
  - id: mayor
    ru: "мэр, бургомистр"
    examples:
      - pl: "Burmistrz przekazał mu klucze do miasta."
        ru: "Мэр передал ему ключи от города."
        source: { kind: translated, id: 901403 }
      - pl: "Burmistrz zaprzeczył, jakoby wziął łapówkę."
        ru: "Мэр отрицал, что брал взятку."
        source: { kind: translated, id: 901401 }
      - pl: "Żądali by burmistrz zrezygnował ze stanowiska."
        ru: "Они требовали, чтобы мэр ушёл с должности."
