lemma: "burmistrz"
rank: 1608
pos: noun
pron: { cyr: "бурми́стш" }
senses:
  - id: mayor
    ru: "мэр, бургомистр"
    examples:
      - pl: "Burmistrz przekazał mu klucze do miasta."
        ru: "Мэр передал ему ключи от города."
