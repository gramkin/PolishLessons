        ru: "Её выбрали мэром."
        source: { kind: translated, id: 1000612 }
      - pl: "Wybraliśmy go na burmistrza."
        ru: "Мы выбрали его мэром."
        source: { kind: translated, id: 549986 }
      - pl: "Tom kandydował na burmistrza."
        ru: "Том баллотировался в мэры."
        source: { kind: translated, id: 4420357 }
notes:
  - { kind: usage, text: "burmistrz — глава города или гмины; в больших городах Польши глава называется prezydent miasta." }
  - { kind: usage, text: "«Выбрать мэром» — wybrać na burmistrza (винительный с na) или wybrać burmistrzem (творительный); обе конструкции живые." }
  - { kind: usage, text: "Женская форма — burmistrzyni; звательная форма burmistrzu в корпусе не встречается." }
  - { kind: usage, text: "Слово немецкое по происхождению, поэтому пишется через -rz, но читается как «ж»: бурмистш." }
collocations:
  - { pl: "wybrać na burmistrza", ru: "выбрать мэром" }
  - { pl: "kandydować na burmistrza", ru: "баллотироваться в мэры" }
  - { pl: "burmistrz miasta", ru: "мэр города" }
etymology: "Из немецкого Bürgermeister «бургомистр» (Burg «город» + Meister «мастер, глава»). Русский «бургомистр» — то же заимствование, только напрямую, без польского посредничества."
memory: "burmistrz = «мэр, бургомистр», из немецкого Bürgermeister. В крупных польских городах глава называется иначе — prezydent miasta. Читается «бурмистш»: rz здесь звучит как ж."
