        ru: "Кусок жёлтого сыра."
        source: { kind: translated, id: 13030257 }
  - id: into-pieces
    ru: "na kawałki — на куски"
    examples:
      - pl: "Pokrój łososia na małe kawałki."
        ru: "Разрежьте лосось на мелкие кусочки."
        source: { kind: tatoeba, id: 352645 }
      - pl: "Rozwalili pudełko na kawałki."
        ru: "Они разбили коробку на куски."
        source: { kind: translated, id: 739002 }
      - pl: "Podarła list na kawałki."
        ru: "Она порвала письмо на куски."
        source: { kind: translated, id: 8633071 }
  - id: a-bit-away
    ru: "kawałek stąd — недалеко отсюда"
    note: "Буквально «кусок отсюда» — пространственное значение."
    examples:
      - pl: "Poczta jest kawałek stąd."
        ru: "Почта недалеко отсюда."
        source: { kind: translated, id: 914937 }
      - pl: "Sklep jest kawałek dalej."
        ru: "Магазин немного дальше."
        source: { kind: authored }
      - pl: "Mieszka kawałek za miastem."
        ru: "Он живёт неподалёку за городом."
        source: { kind: authored }
  - id: track
    ru: "вещь, трек (разговорное, о музыке)"
    examples:
      - pl: "To mój ulubiony kawałek."
        ru: "Это моя любимая вещь."
        source: { kind: authored }
      - pl: "Puść ten kawałek jeszcze raz."
        ru: "Поставь этот трек ещё раз."
        source: { kind: authored }
      - pl: "Dobry kawałek, kto to gra?"
        ru: "Хорошая вещь, кто это играет?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Беглое e выпадает в косвенных падежах: kawałek, но kawałka, kawałkiem, kawałkowi." }
  - { kind: usage, text: "Кроме еды слово работает в пространстве: Poczta jest kawałek stąd «Почта недалеко отсюда», буквально «кусок отсюда»." }
  - { kind: register, text: "В разговоре о музыке kawałek значит «вещь, трек»: dobry kawałek, puść ten kawałek." }
  - { kind: usage, text: "Устойчивое na kawałki «на куски»: rozbić na kawałki, podrzeć na kawałki." }
collocations:
