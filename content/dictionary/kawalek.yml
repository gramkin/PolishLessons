etymology: "Уменьшительное от kawał «большой кусок, глыба» с суффиксом -ek. Прямого русского родственника у слова нет — его стоит запомнить отдельно."
memory: "kawałek — «кусок, кусочек», уменьшительное от kawał. Следите за беглым e: kawałek, но kawałka, kawałkiem. Кроме еды слово работает и в пространстве: Poczta jest kawałek stąd «Почта недалеко отсюда», буквально «кусок отсюда». А в разговоре о музыке kawałek значит «вещь, трек» — dobry kawałek."
idioms:
