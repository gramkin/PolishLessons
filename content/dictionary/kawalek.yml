# review
id: kawalek
format: 2
lemma: "kawałek"
rank: 698
pos: noun
pron: { cyr: "кава́уэк" }
senses:
  - id: piece
    ru: "кусок, кусочек"
    note: "Беглое e: kawałek, но kawałka."
    examples:
      - pl: "Chcesz kawałek?"
