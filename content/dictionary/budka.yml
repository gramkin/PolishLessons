notes:
  - { kind: false-friend, text: "BUDKA — уменьшительное от BUDA, «будка, конура»: маленькая постройка. BUDKA TELEFONICZNA — «телефонная будка», BUDKA DLA PTAKÓW — «скворечник». Собачья будка — BUDA или PSIA BUDA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: W BUDCE. Родительный множественного — BUDEK, с беглым E. Звательный BUDKO не употребляется." }
  - { kind: government, text: "В будке — W BUDCE, местный. Будка с чем — BUDKA Z и творительный: BUDKA Z HOT-DOGAMI. Будка для кого — BUDKA DLA и родительный." }
  - { kind: pronunciation, text: "Читается «бу́тка»: D перед K оглушается в «т». BUDCE — «бу́тце»." }
