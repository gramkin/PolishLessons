etymology: "Из французского TABLETTE «плиточка, дощечка», уменьшительного от TABLE «доска, стол», а то — от латинского TABULA. Путь значения прост: лекарство прессовали в плоские кружки, похожие на дощечки, и назвали их уменьшительным от доски. Из того же латинского корня в польском выросли TABLICA «доска, таблица» и позднейший TABLET для планшета, который по форме снова оказался дощечкой — круг замкнулся через шесть веков. Русский взял слово тем же путём, через французский, и сохранил его почти без изменений. Польское -KA на конце — это уже своё, приспособление чужого слова к родному женскому склонению, как в BUTELKA и KOTLETKA."
memory: "То же французское tablette «дощечка», уменьшительное от table, что и русская «таблетка»: лекарство прессовали в плоские кружочки. Из того же латинского tabula выросли tablica «доска, таблица» и tablet «планшет» — три слова, различающиеся одной-двумя буквами, и путать их нельзя. Управление через na: tabletka na ból głowy, не od. Падежи: tabletce с меной k→c, tabletek с беглым e."
