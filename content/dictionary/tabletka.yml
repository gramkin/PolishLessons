notes:
  - { kind: false-friend, text: "Значение совпадает с русской «таблеткой» полностью, и слова заимствованы из одного источника. Беречься нужно соседа: TABLET по-польски означает планшетный компьютер, а не таблетку, и разница всего в одной букве на конце. Второй сосед — TABLICA «доска, таблица»: TABLICA REJESTRACYJNA это автомобильный номер, TABLICA OGŁOSZEŃ — доска объявлений. Все три слова идут от латинского TABULA, но разошлись по предметам, и в польском они различаются отчётливее, чем в русском. Лекарство в целом называется LEK или LEKARSTWO." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — TABLETCE, с меной K в C перед окончанием -E; родительный множественного — TABLETEK, с беглым E. Рядом с GADCE и HISTORYJCE это третий случай того же правила в одной партии. Дозировка выражается винительным с предлогом NA: TABLETKA NA BÓL GŁOWY «таблетка от головной боли», и предлог здесь именно NA, а не OD, как подсказывал бы русский. Принимают таблетку глаголами BRAĆ, ZAŻYĆ или POŁKNĄĆ." }
  - { kind: pronunciation, text: "Читается «табле́тка», три слога, ударение на втором — как и в русском. Буква E в середине даёт «е» с мягким L, потому что польское L всегда мягче русского твёрдого. Сочетание TK на конце основы произносится слитно и глухо. В форме TABLETCE сочетание TC читается «тц»: «табле́тце». В форме TABLETEK беглое E звучит отчётливо: «табле́тэк». В форме TABLETKĘ конечное Ę даёт чистое «э»: «табле́ткэ»." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Устойчивые сочетания: TABLETKA NA BÓL GŁOWY, TABLETKA NASENNA «снотворное», TABLETKI PRZECIWBÓLOWE «обезболивающие», TABLETKA MUSUJĄCA «шипучая таблетка», BEZ RECEPTY «без рецепта». В аптеке спрашивают COŚ NA BÓL GARDŁA, то есть называют не лекарство, а то, против чего оно. Уменьшительное TABLETECZKA звучит ласково и встречается в разговоре с детьми. Переносного употребления у слова нет, в отличие от русского «горькой пилюли», которой по-польски отвечает GORZKA PIGUŁKA." }
