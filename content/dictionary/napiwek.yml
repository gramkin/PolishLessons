notes:
  - { kind: false-friend, text: "NAPIWEK — «чаевые», буквально «на пиво»: русские дают «на чай», поляки — «на пиво». И число другое: по-польски одно существительное в единственном, ZOSTAWIĆ NAPIWEK, а в русском «чаевые» всегда во множественном." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Беглое E: NAPIWEK, но NAPIWKU, NAPIWKI. Творительный — NAPIWKIEM." }
  - { kind: government, text: "Дать чаевые — DAĆ NAPIWEK, оставить — ZOSTAWIĆ NAPIWEK, кому — дательный: KELNEROWI. Жить на чаевые — ŻYĆ Z NAPIWKÓW, Z с родительным." }
  - { kind: pronunciation, text: "Читается «напи́вэк», ударение на предпоследнем слоге. WE — твёрдое «вэ»." }
collocations:
  - { pl: "zostawić napiwek", ru: "оставить чаевые" }
  - { pl: "duży napiwek", ru: "щедрые чаевые" }
  - { pl: "napiwek dla kelnera", ru: "чаевые официанту" }
family:
  - { pl: "piwo", ru: "пиво", relation: root, id: piwo }
  - { pl: "pić", ru: "пить", relation: root, id: pic }
  - { pl: "zostawić napiwek", ru: "оставить чаевые", relation: derived }
etymology: "NA + PIWO: деньги «на пиво». Так же устроены русское «на чай», откуда «чаевые», и немецкое слово «на выпивку». Корень тот же, что в PIĆ «пить»."
memory: "Napiwek — чаевые, «на пиво», а русские — «на чай». Читается «напи́вэк». Zostawić napiwek — оставить чаевые. Reszty nie trzeba — сдачи не надо."
idioms:
  - { pl: "reszty nie trzeba", ru: "сдачи не надо" }
formExamplesSkip:
  - { form: "napiwku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
