notes:
  - { kind: false-friend, text: "Слово совпадает с русской «заслугой» и по смыслу, и по составу: оба от служения, ZASŁUŻYĆ и «заслужить». Разница только в управлении. Заслуга перед городом по-польски ZASŁUGI DLA MIASTA, с предлогом DLA и родительным, тогда как русский скажет «перед городом», с творительным. И прилагательное ZASŁUŻONY значит не только «заслуженный», но и «уставший по праву»: ZASŁUŻONY ODPOCZYNEK — заслуженный отдых." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах G переходит в DZ: ZASŁUGA, но W ZASŁUDZE. Это обычное польское чередование, то же самое в DROGA — W DRODZE. В родительном множественного окончания нет: ZASŁUG. Множественное ZASŁUGI употребляется чаще единственного, потому что заслуги обычно считают во множестве." }
  - { kind: government, text: "Заслуга перед кем-то — ZASŁUGI DLA KOGOŚ, предлог DLA с родительным: ZASŁUGI DLA KRAJU. За заслуги — ZA ZASŁUGI, предлог ZA с винительным множественного, и так пишут на медалях. Это его заслуга — TO JEGO ZASŁUGA, просто именительный, без всякого предлога. В заслуге — W ZASŁUDZE, местный с переходом G в DZ." }
  - { kind: pronunciation, text: "Читается «засуу́га», четыре слога, ударение на предпоследнем. Буква Ł даёт «у», а следующая U — тоже «у», и выходит два «у» подряд: «суу». Так же читаются SŁUŻBOWY «суужбо́вы» и DŁUGI «дуу́ги». В форме ZASŁUDZE сочетание DZ даёт один слитный звук: «засуу́дзе»." }
  - { kind: register, text: "Слово торжественное, из языка награждений и некрологов: ZA ZASŁUGI DLA KULTURY POLSKIEJ — так называется настоящая государственная медаль. В обиходной речи оно живёт в коротком обороте TO JEGO ZASŁUGA, когда хотят отдать кому-то должное, и в его обратной форме NIE MOJA ZASŁUGA, «не моя заслуга»." }
