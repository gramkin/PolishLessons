etymology: "От глагола ZASŁUŻYĆ «заслужить», а тот — от SŁUŻYĆ, слова праславянского и того же, что русское «служить». Русская «заслуга» собрана буквально из тех же частей, за и служить, так что переводить тут нечего. Из того же гнезда идёт и SŁUŻBOWY, и SŁUŻBA, и USŁUGA «услуга». Запомнив один корень, вы получаете сразу пять слов, и все они в польском вполне обиходны."
memory: "Заслуга, и слово собрано как русское: za плюс sluzyc, как «за» плюс «служить». Переводить нечего, зато надо помнить управление: заслуги перед городом — zaslugi dla miasta, с предлогом dla, а не «перед». Читается «засуу́га», с двумя «у» подряд, потому что l со штрихом даёт «у» и следующая u тоже. В местном падеже g переходит в dz: w zasludze."
idioms:
  - { pl: "za zasługi", ru: "за заслуги" }
