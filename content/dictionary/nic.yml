lemma: "nic"
rank: 53
pos: noun
pron: { cyr: "ниц" }
senses:
  - id: nothing
    ru: "ничто, ничего"
    examples:
      - pl: "Nic."
        ru: "Ничего."
        source: { kind: tatoeba, id: 6160606 }
      - pl: "Niczego innego nie jadłem."
        ru: "Я больше ничего не ел."
        source: { kind: tatoeba, id: 6771308 }
      - pl: "Nie możemy niczego obiecać."
        ru: "Мы ничего не можем обещать."
        source: { kind: tatoeba, id: 4328621 }
  - id: like
    ru: "niczym — словно, подобно"
    examples:
      - pl: "Życie jest niczym podróż."
        ru: "Жизнь - словно путешествие."
        source: { kind: tatoeba, id: 1133647 }
      - pl: "To na nic."
        ru: "Оно никуда не годится."
        source: { kind: tatoeba, id: 676681 }
notes:
  - { kind: usage, text: "Двойное отрицание обязательно: Nic nie wiem «Я ничего не знаю»." }
  - { kind: usage, text: "Вне отрицания niczym значит «словно»: niczym sen «словно сон»." }
collocations:
  - { pl: "nic nie szkodzi", ru: "ничего страшного" }
  - { pl: "za nic", ru: "ни за что" }
  - { pl: "nic dziwnego", ru: "неудивительно" }
etymology: "Из ni + co, буквально «ни что» — ровно так же собрано русское «ничто»."
memory: "Склоняется как co: niczego, niczemu, niczym. Глагол обязательно с nie: Nic nie rozumiem. А в сравнении niczym значит «словно»: Życie jest niczym podróż."
idioms:
  - { pl: "nic nie szkodzi", ru: "ничего страшного" }
  - { pl: "nic podobnego", ru: "ничего подобного" }
  - { pl: "za nic w świecie", ru: "ни за что на свете" }
