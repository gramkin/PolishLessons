notes:
  - { kind: usage, text: "Это пятое слово без единственного числа в нашем словаре, после NEGOCJACJE, KAJDANY, DRZWI и FRYTKI. Форм поэтому шесть: KAJDANKI, KAJDANEK, KAJDANKOM, KAJDANKAMI, KAJDANKACH, и ещё устаревшее KAJDANKÓW. Русские «наручники» тоже только во множественном, так что число совпадает и переводится прямо. В родительном множественного появляется беглое E: KAJDANEK, как в MATKA и MATEK." }
  - { kind: false-friend, text: "Исходное слово KAJDANY значит «кандалы», и это прямая родня русскому: оба языка взяли его из тюркских через татарское посредство. А KAJDANKI — уменьшительное от него, и означает именно современные наручники. Русский пошёл другим путём: кандалы остались кандалами, а для наручников он построил своё слово от «руки». Получилось, что поляк назвал новый предмет старым заимствованным словом, а русский новым своим." }
  - { kind: government, text: "Надеть кому-то наручники — ZAŁOŻYĆ KOMUŚ KAJDANKI, дательный на лицо и винительный на предмет, ровно как по-русски. Снять — ZDJĄĆ KAJDANKI, винительный. В наручниках — W KAJDANKACH, предлог W с местным падежом. Заковать — ZAKUĆ W KAJDANKI, предлог W с винительным, и здесь русский говорит «заковать в наручники», то есть схема совпадает полностью." }
  - { kind: pronunciation, text: "Читается «кайда́нки», три слога, ударение на втором. Сочетание AJ даёт «ай», как в русском. Все согласные твёрдые, никаких носовых и мягких знаков здесь нет. В родительном множественного KAJDANEK слышно «кайда́нэк», с беглым «э» перед последней согласной. В исходном KAJDANY слышно «кайда́ны», почти как русские «кандалы», только без второго «л»." }
  - { kind: register, text: "Слово нейтральное, из языка полиции и репортажей. Частые обороты: ZAŁOŻYĆ KAJDANKI «надеть наручники», ZDJĄĆ KAJDANKI «снять наручники», W KAJDANKACH «в наручниках», ZAKUĆ W KAJDANKI «заковать в наручники». Старшее слово KAJDANY звучит исторически и книжно, о цепях на ногах узника, и в переносном смысле о тяжёлой зависимости: KAJDANY NIEWOLI «оковы неволи»." }
