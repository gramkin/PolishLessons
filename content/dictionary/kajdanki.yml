etymology: "Уменьшительное от KAJDANY «кандалы», а то пришло к славянам из тюркских языков, через татарское слово со значением оков. Русские «кандалы» и польские KAJDANY — одно и то же заимствование, разошедшееся только в огласовке. Когда понадобилось название для лёгких наручников, польский просто уменьшил старое слово, а русский построил новое от «руки», отсюда «наручники». Так один предмет получил в двух языках слова разного происхождения, хотя исходное название оков у них общее."
memory: "Пятое слово только во множественном числе, как negocjacje и frytki, и русские «наручники» тоже множественные, так что число совпадает. Исходное kajdany это «кандалы», общее тюркское заимствование; наручники поляк назвал уменьшительным от него, а русский построил своё слово от «руки». Управление переносится целиком: założyć komuś kajdanki, zakuć w kajdanki. Родительный множественного с беглым e: kajdanek. Читается «кайда́нки»."
idioms:
  - { pl: "zakuć w kajdanki", ru: "заковать в наручники" }
