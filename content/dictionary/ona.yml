id: ona
format: 2
lemma: "ona"
rank: 2506
pos: pron
pron: { cyr: "о́на" }
senses:
  - id: she
    ru: "она"
    examples:
      - pl: "Ona żyje!"
        ru: "Она жива!"
        source: { kind: tatoeba, id: 3460717 }
      - pl: "Ona szyła."
        ru: "Она шила."
        source: { kind: tatoeba, id: 10747474 }
      - pl: "Ona czyta."
        ru: "Она читает."
        source: { kind: tatoeba, id: 13420903 }
  - id: she-emphatic
    ru: "она (в подчёркнутой позиции)"
    examples:
      - pl: "To ona miała rację."
        ru: "Это она была права."
        source: { kind: authored }
      - pl: "Ona nic nie wie."
        ru: "Она ничего не знает."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ГЛАВНОЕ: в польском местоимение-подлежащее обычно ОПУСКАЮТ, потому что лицо видно по глаголу. Czyta значит «она читает». Ona czyta добавляют, чтобы подчеркнуть: «именно она»." }
  - { kind: government, text: "Склонение супплетивное: ona, jej, jej, ją, nią, niej. После предлога — niej, nią: o niej «о ней», z nią «с ней»." }
  - { kind: false-friend, text: "Русское «она» и польское ona — одно слово. Но множественное различается по роду: one «они» без мужчин, oni «они» с мужчинами." }
  - { kind: usage, text: "Формы jej и ją легко спутать: jej — родительный и дательный («её, ей»), ją — винительный («её»)." }
collocations:
  - { pl: "to ona", ru: "это она" }
  - { pl: "z nią", ru: "с ней" }
etymology: "Праславянское *ona; русское «она» — то же слово."
memory: "ona — «она», но в польском подлежащее-местоимение обычно опускают: Czyta уже значит «она читает». Ona добавляют для подчёркивания."
idioms:
  - { pl: "to ona", ru: "это она" }
