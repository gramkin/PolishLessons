etymology: "Отглагольное существительное от ZADAĆ «задать», с суффиксом -NIE, и собрано оно в точности как русское «задание» от «задать»: приставка ZA- отвечает русской за-, корень DA- тот же, что в DAĆ и «дать». Совпадение полное, вплоть до суффикса, потому что польское -NIE и русское -НИЕ происходят от одного праславянского *-nьje. Разошлись языки только в объёме значения: русский со временем выделил «задачу» отдельным словом от «задать» через другую модель, а польский оставил одно слово на оба смысла. Отсюда и ощущение, что ZADANIE шире русского «задания» — оно не шире, просто русский его разделил."
memory: "Одно слово на русские «задание» и «задача»: zadanie domowe — задание, zadanie z geometrii — задача. Слова «zadacza» не существует. Поручение выполняют, wykonać zadanie; задачу решают, rozwiązać zadanie. Собрано точно как русское «задание» от «задать»: za- плюс da- плюс -nie, и -nie отвечает русскому -ние. Но читается оно одним слогом, «зада́не», так что слово короче русского."
idioms:
