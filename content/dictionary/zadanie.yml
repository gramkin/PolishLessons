notes:
  - { kind: false-friend, text: "Русский делит это понятие на два слова, польский — нет. ZADANIE значит и «задание», поручение, и «задача», в том числе математическая: ZADANIE DOMOWE «домашнее задание», ZADANIE Z GEOMETRII «задача по геометрии». Отдельного слова для задачи в польском нет, и ZADACZA не существует. Поэтому при переводе на русский выбирать приходится по содержанию: если это поручение — «задание», если это то, что решают — «задача». В военном и служебном языке ZADANIE тоже на месте: WYKONAĆ ZADANIE «выполнить задание». Третье русское слово, «проблема», отвечает польскому PROBLEM и к ZADANIE отношения не имеет." }
  - { kind: government, text: "Средний род на -NIE, именительный и винительный совпадают: DOSTAŁ ZADANIE. Родительный на -A: BEZ ZADANIA. Местный на -U: W ZADANIU. Родительный множественного ZADAŃ, без окончания и с мягким Ń, как у всех слов этого типа. Кому дают — дательный: DAĆ KOMUŚ ZADANIE. Из какой области — предлог Z с родительным: ZADANIE Z GEOMETRII, ZADANIE Z FIZYKI. Выполнить — WYKONAĆ ZADANIE с винительным, решить — ROZWIĄZAĆ ZADANIE, и эти два глагола не взаимозаменяемы: поручение выполняют, задачу решают." }
  - { kind: pronunciation, text: "Читается «зада́не», ударение на предпоследнем слоге из трёх. Конечное -NIE произносится «не» одним слогом, с мягким н, а не «ние» в два слога, как было бы в русском «задание». Из-за этого польское слово короче русского на слог. В родительном множественного ZADAŃ один слог с мягким Ń на конце: «задань». В местном ZADANIU звучит «зада́ню», и ударение остаётся на предпоследнем слоге." }
  - { kind: usage, text: "Суффикс -NIE отвечает русскому -НИЕ и образует отглагольные существительные тысячами: ZADANIE от ZADAĆ, как «задание» от «задать»; CZYTANIE «чтение», PISANIE «письмо», SPOTKANIE «встреча». Разница только в слогах: польское -NIE читается одним слогом. Частотные сочетания: ZADANIE DOMOWE «домашнее задание», WYKONAĆ ZADANIE, POSTAWIĆ SOBIE ZADANIE «поставить себе задачу», ZADANIE SPECJALNE. Выражение NIE LADA ZADANIE значит «задача не из простых»." }
