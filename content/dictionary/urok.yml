etymology: "Приставка U- и корень *rek-/*rok- от праславянского *rekti «говорить», того же, что дал польские RZEC «сказать», WYROK «приговор», PROROK «пророк», ZAROK и русские «речь», «изречь», «пророк», «оброк», «срок». UROK исходно — то, что над кем-то сказано, наговор; отсюда и чары, и сглаз, а затем, через идею неотразимого воздействия, обаяние и очарование. Русский «урок» вырос из того же «сказанного», но в другую сторону: сказанное как назначенное, заданное, отсюда задание и школьное занятие. Так один корень дал в двух языках слова, которые звучат почти одинаково и не значат ничего общего, и это самый чистый случай такого расхождения в карточках."
memory: "Не «урок», а «обаяние» или «сглаз»: русский «урок» по-польски lekcja. Корень один, *rekti «говорить» — то, что над человеком сказано: в польском наговор и чары, в русском назначенное и заданное. Ударение тоже расходится: у́rok на первом слоге против русского уро́к. Zły urok — «сглаз», mieć urok — «быть обаятельным», uroki życia — «прелести жизни». Прилагательное uroczy «очаровательный», но uroczysty — «торжественный», другое гнездо."
