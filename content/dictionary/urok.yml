notes:
  - { kind: false-friend, text: "Один из самых резких ложных друзей в этом словаре. UROK не значит «урок» ни в каком контексте: по-польски это «обаяние, очарование», а в старом смысле — «сглаз, чары». Русский «урок» это LEKCJA, и спутать их легко, потому что слова звучат почти одинаково. Корень при этом общий, праславянское *rekti «говорить», и расхождение смыслов объяснимо: то, что над человеком сказано, в польском стало наговором и чарами, а в русском — заданным, назначенным, отсюда «урок». Различается и ударение: польское у́рок на первом слоге, русское уро́к на втором. Выражение ZŁY UROK значит «сглаз», а MIEĆ UROK — «быть обаятельным»." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: RZUCIĆ UROK. Родительный, местный и звательный совпадают в форме UROKU: BEZ UROKU, W UROKU, O UROKU. Множественное число UROKI в значении прелестей, привлекательных сторон: UROKI ŻYCIA NA WSI «прелести деревенской жизни», и в этом значении слово употребляется чаще всего именно во множественном. На кого навели — предлог NA с винительным: RZUCIĆ UROK NA KOGOŚ. Снять сглаз — ODCZYNIĆ UROK. Родительный множественного UROKÓW." }
  - { kind: pronunciation, text: "Читается «у́рок», ударение на предпоследнем слоге из двух, то есть на первом — и в этом слово расходится с русским «уро́к», где ударение на втором. Для русскоговорящего это главная ошибка: слово узнаётся на слух, и ударение ставится по привычке не туда. Буква U звучит «у», R твёрдое, конечное K ясное. В родительном UROKU ударение остаётся на предпоследнем слоге: «уро́ку», и вот здесь оно совпадает с русским «уроку», что путает ещё сильнее." }
  - { kind: usage, text: "Частотные сочетания: MIEĆ UROK «быть обаятельным», DODAWAĆ UROKU «придавать очарование», UROKI ŻYCIA «прелести жизни», ZŁY UROK «сглаз», RZUCIĆ UROK «навести чары», ODCZYNIĆ UROK «снять сглаз». Прилагательное UROCZY значит «очаровательный, прелестный» и употребляется постоянно: UROCZA DZIEWCZYNA, UROCZE MIASTECZKO. Не путать с UROCZYSTY «торжественный», словом другого гнезда. Во множественном UROKI почти всегда означает привлекательные стороны, а не чары, и смысл различает контекст." }
