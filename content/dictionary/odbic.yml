# review
id: odbic
format: 2
lemma: "odbić"
rank: 1693
pos: verb
pron: { cyr: "о́дбиць" }
senses:
  - id: reflect
    ru: "отразить (свет, изображение)"
    examples:
      - pl: "Lustro odbiło światło latarki."
        ru: "Зеркало отразило свет фонарика."
        source: { kind: authored }
      - pl: "W szybie odbiła się cała ulica."
        ru: "В стекле отразилась вся улица."
        source: { kind: authored }
  - id: deflect
    ru: "отбить (мяч, удар, атаку)"
    examples:
      - pl: "Bramkarz odbił piłkę jedną ręką."
        ru: "Вратарь отбил мяч одной рукой."
        source: { kind: authored }
      - pl: "Odbili atak przed świtem."
        ru: "Они отбили атаку до рассвета."
        source: { kind: authored }
  - id: recapture
    ru: "отбить, отвоевать"
    examples:
      - pl: "Oddział odbił zakładników bez jednego strzału."
        ru: "Отряд отбил заложников без единого выстрела."
        source: { kind: authored }
notes:
  - { kind: government, text: "ОТБИВАЮТ У КОГО-ТО ЧЕРЕЗ ДАТЕЛЬНЫЙ. Odbić KOMUŚ dziewczynę, odbić KOMUŚ klienta — «отбить У кого-л. девушку, клиента». Русский ставит «у» с родительным, поляк обходится голым дательным без предлога. Зато отражение и отскок совпадают: odbić się OD ściany «отскочить ОТ стены», родительный в обоих языках." }
  - { kind: usage, text: "ODBIĆ SIĘ значит и «отразиться», и «отскочить», и «сказаться»: to się na nim odbiło «это на нём сказалось». Существительное ODBICIE — это прежде всего «отражение»: odbicie w lustrze «отражение в зеркале». А ODBIĆ KARTĘ значит «отметиться» на проходной." }
  - { kind: usage, text: "Страдательное причастие здесь ODBITY, а не «odbijony»: глаголы на -ić с корнем bić дают -ity, как bity, zbity, pobity. Русское «отбитый» устроено точно так же. Вид совершенный, odbiję значит «отобью», несовершенная пара — ODBIJAĆ." }
collocations:
  - { pl: "odbić piłkę", ru: "отбить мяч" }
  - { pl: "odbicie w lustrze", ru: "отражение в зеркале" }
  - { pl: "odbić kartę", ru: "отметиться на проходной" }
family:
  - { pl: "odbijać", ru: "отбивать, отражать (несов.)", relation: aspect }
  - { pl: "bić", ru: "бить", relation: root, id: bic }
  - { pl: "zbić", ru: "разбить, сбить", relation: root }
etymology: "Приставка od- и bić, из праславянского *biti — то же слово, что русское «бить». Разбор совпадает морфема в морфему: od-bić и «от-бить», odbity и «отбитый». Из этого же гнезда odbicie «отражение», где образ тот же, что в нашем «отбить свет»."
memory: "odbić komuś coś — дательный без предлога: odbił mu dziewczynę «он отбил у него девушку». А odbicie — это «отражение»: odbicie w lustrze. И причастие на -ity, не -ony: odbity, как «отбитый»."
idioms:
  - { pl: "odbić się czkawką", ru: "аукнуться, выйти боком" }
  - { pl: "odbić sobie coś", ru: "наверстать, отыграться" }
