# review
id: paliwo
format: 2
lemma: "paliwo"
rank: 2257
pos: noun
pron: { cyr: "пали́во" }
senses:
  - id: fuel
    ru: "топливо, горючее"
    examples:
      - pl: "Paliwo podrożało o złotówkę."
        ru: "Топливо подорожало на злотый."
        source: { kind: authored }
      - pl: "Zabrakło nam paliwa pod samym domem."
        ru: "У нас кончилось топливо у самого дома."
        source: { kind: authored }
  - id: fuel-types
    ru: "виды топлива"
    examples:
      - pl: "Paliwa kopalne powoli odchodzą do lamusa."
        ru: "Ископаемое топливо потихоньку уходит в прошлое."
        source: { kind: authored }
      - pl: "Elektrownia pracuje na dwóch paliwach."
        ru: "Электростанция работает на двух видах топлива."
        source: { kind: authored }
  - id: figurative
    ru: "топливо (перен.), пища для чего-л."
    examples:
      - pl: "Plotki są paliwem tej kampanii."
        ru: "Сплетни — топливо этой кампании."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ЗНАКОМЫЙ, НО ГЛАГОЛ ОБМАНЧИВ. Paliwo от palić «жечь», и это тот же корень, что русское «палить». Ловушка в том, что palić значит ещё и «КУРИТЬ»: palić papierosa. А русское «курить» по-польски никогда не kurzyć — kurzyć значит «пылить». Пара выходит перекрёстная: palić это и жечь, и курить; kurzyć — только пылить." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: pa-LI-wo. Конечное o чистое, не редуцируется в «а», как было бы по-русски: «пали́во», а не «палива». В предложном падеже w смягчается: w paliwie." }
  - { kind: usage, text: "Суффикс -wo образует названия веществ и средств: paliwo «топливо», mydło «мыло», masło «масло». Множественное paliwa нормально и значит «виды топлива»: paliwa kopalne, paliwa płynne. Прилагательное paliwowy: zbiornik paliwowy «топливный бак»." }
collocations:
  - { pl: "zabrakło paliwa", ru: "кончилось топливо" }
  - { pl: "paliwa kopalne", ru: "ископаемое топливо" }
  - { pl: "zbiornik paliwa", ru: "топливный бак" }
family:
  - { pl: "palić", ru: "жечь; курить", relation: root, id: palic }
  - { pl: "spalić", ru: "сжечь", relation: derived, id: spalic }
  - { pl: "paliwowy", ru: "топливный", relation: derived }
etymology: "От palić «жечь», из праславянского *paliti — того же корня, что русские «палить», «пламя», «пепел». Суффикс -wo называет средство: то, чем жгут. Отсюда paliwo, palenie, spalanie, opał «топливо для печи» и zapalniczka «зажигалка»."
memory: "paliwo — «топливо», от palić «жечь», как русское «палить». Но запомнить надо и второе значение глагола: palić значит ещё «КУРИТЬ». А «пылить» — это kurzyć, совсем другое слово."
idioms:
  - { pl: "dolewać oliwy do ognia", ru: "подливать масла в огонь" }
  - { pl: "paliwa kopalne", ru: "ископаемое топливо" }
