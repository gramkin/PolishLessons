notes:
  - { kind: false-friend, text: "ЭТОГО СЛОВА В РУССКОМ НЕТ, ХОТЯ В СОСЕДНИХ СЛАВЯНСКИХ ОНО ЕСТЬ. Польскому zdrada точно отвечают украинское «зрада» и чешское zrada, а русский заменил его на «измену» и «предательство». Поэтому узнать слово по-русски не получится, зато украинский даёт прямую подсказку." }
  - { kind: usage, text: "Дательный и предложный — ZDRADZIE, с переходом d→dzi: mówić o zdradzie. Глагол — ZDRADZIĆ, и он значит не только «предать», но и «выдать, проговориться»: zdradzić tajemnicę «выдать тайну». Оборот ZDRADA STANU — «государственная измена»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: ZDRA-da. Начальное zdr произносится слитно, без гласной: «здра́да». Форма zdradzie звучит «здра́дзе», с мягким дзь." }
collocations:
  - { pl: "zdrada stanu", ru: "государственная измена" }
  - { pl: "zdrada małżeńska", ru: "супружеская измена" }
  - { pl: "dopuścić się zdrady", ru: "совершить предательство" }
family:
  - { pl: "zdradzić", ru: "предать; выдать", relation: derived, id: zdradzic }
  - { pl: "zdrajca", ru: "предатель", relation: derived, id: zdrajca }
  - { pl: "wierność", ru: "верность", relation: antonym }
etymology: "От zdradzić, из праславянского *sъ-raditi, связанного с rada «совет»: предательство понималось как дурной совет, сбивание с пути. То же слово живёт в украинском «зрада» и чешском zrada. Русский утратил его и взял «измену» от «менять»."
memory: "zdrada — «предательство, измена». Русского когната нет, зато украинское «зрада» совпадает полностью. Дательный и предложный — zdradzie, с d→dzi. И запомни zdradzić tajemnicę — «выдать тайну»."
idioms:
  - { pl: "zdrada stanu", ru: "государственная измена" }
  - { pl: "paść ofiarą zdrady", ru: "стать жертвой предательства" }
