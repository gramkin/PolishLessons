# review
id: przepadac
format: 2
lemma: "przepadać"
rank: 4694
pos: verb
pron: { cyr: "пшэпа́даць" }
senses:
  - id: be-fond
    ru: "обожать, любить (PRZEPADAĆ ZA); чаще с отрицанием: NIE PRZEPADAM — «не очень люблю»"
    examples:
      - pl: "Nie przepadam za szpinakiem."
        ru: "Я не очень люблю шпинат."
        source: { kind: authored }
      - pl: "Dzieci przepadają za lodami."
        ru: "Дети обожают мороженое."
        source: { kind: authored }
      - pl: "Babcia przepadała za kryminałami."
        ru: "Бабушка обожала детективы."
        source: { kind: authored }
  - id: vanish
    ru: "пропадать, исчезать; пропадать даром"
    examples:
      - pl: "Bilety przepadają, jeśli się spóźnisz."
        ru: "Если опоздаешь, билеты пропадают."
        source: { kind: authored }
      - pl: "Ludzie przepadali bez śladu."
        ru: "Люди пропадали без следа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEPADAĆ ZA CZYMŚ — «обожать что-то», а не «пропадать за чем-то». Самая частая форма — вежливое отрицание NIE PRZEPADAM ZA RYBAMI «я не очень люблю рыбу», мягче, чем NIE LUBIĘ. Второе значение — «пропадать»: BILET PRZEPADA «билет пропадает», ZALICZKA PRZEPADA «задаток сгорает»." }
  - { kind: usage, text: "Несовершенный вид; совершенный в значении «пропасть» — PRZEPAŚĆ. В значении «обожать» пары нет. Спряжение на -AM: PRZEPADAM, PRZEPADASZ, PRZEPADAJĄ. Повелительное, безличное PRZEPADANO и отглагольное существительное в карточку не включены." }
  - { kind: government, text: "За кем, чем — ZA с творительным: PRZEPADAĆ ZA CZEKOLADĄ, ZA KOTAMI. По-русски «обожать» — винительный без предлога. Где пропасть — W с предложным: PRZEPADAĆ W TŁUMIE, BEZ ŚLADU." }
  - { kind: pronunciation, text: "Читается «пшэпа́даць»: PRZ — «пш», ударение на предпоследнем слоге. PRZEPADAM — «пшэпа́дам»." }
  - { kind: register, text: "Разговорно-нейтральное. NIE PRZEPADAM ZA — вежливый способ сказать «не люблю», не обижая хозяев: NIE PRZEPADAM ZA RYBAMI, ALE SPRÓBUJĘ." }
collocations:
  - { pl: "nie przepadać za czymś", ru: "не очень любить что-то" }
  - { pl: "przepadać bez śladu", ru: "пропадать без следа" }
  - { pl: "bilet przepada", ru: "билет пропадает" }
family:
  - { pl: "przepaść", ru: "пропасть", relation: aspect, id: przepasc }
  - { pl: "lubić", ru: "любить", relation: root, id: lubic }
  - { pl: "uwielbiać", ru: "обожать", relation: root, id: uwielbiac }
etymology: "Приставка PRZE- плюс PADAĆ «падать»: «проваливаться, пропадать». Значение «обожать» развилось из «пропадать за кем-то», то есть «сохнуть по кому-то»."
memory: "Przepadać za czymś — обожать: dzieci przepadają za lodami. Nie przepadam za rybami — вежливое «не очень люблю рыбу». Za + творительный!"
idioms:
  - { pl: "przepadać jak kamień w wodę", ru: "пропадать как в воду канул" }
