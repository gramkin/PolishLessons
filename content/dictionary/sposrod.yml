# review
id: sposrod
format: 2
lemma: "spośród"
rank: 6068
pos: prep
pron: { cyr: "спо́сьрут" }
senses:
  - id: from-among
    ru: "из (числа), среди (+ род.) — о выборе части из множества"
    examples:
      - pl: "Maria została wybrana spośród 500 osób."
        ru: "Марию выбрали из 500 человек."
        source: { kind: translated, id: 4314152 }
      - pl: "Niektórzy spośród studentów lubią malować."
        ru: "Некоторые из студентов любят рисовать."
        source: { kind: translated, id: 567118 }
      - pl: "Spośród pór roku najbardziej lubię wiosnę."
        ru: "Из всех времён года я больше всего люблю весну."
        source: { kind: translated, id: 2975731 }
  - id: out-from-between
    ru: "из-за, из гущи (о движении изнутри множества предметов)"
    examples:
      - pl: "Spośród drzew wyszedł jeleń."
        ru: "Из-за деревьев вышел олень."
        source: { kind: authored }
      - pl: "Spośród chmur wyjrzało słońce."
        ru: "Из-за туч выглянуло солнце."
        source: { kind: authored }
notes:
  - { kind: government, text: "Требует родительного, как русское «из», «среди»: spośród studentów, spośród kandydatów. Множество всегда во множественном числе: wybrać spośród wielu." }
  - { kind: usage, text: "Главное употребление — выбор из группы: wybrać, wyróżnić, najlepszy spośród. Рядом стоят Z и SPOŚRÓD: jeden z nas — нейтрально, jeden spośród nas — книжнее и подчёркивает «из числа». При превосходной степени: najlepszy spośród uczniów, «лучший из учеников»." }
  - { kind: pronunciation, text: "«спо́сьрут»: Ś — мягкое «сь», конечное D оглушается в «т». Ударение на первом слоге: два слога, SPO-ŚRÓD." }
  - { kind: register, text: "Нейтрально-книжное; в разговоре чаще простое Z: wybierz jedną z tych." }
collocations:
  - { pl: "wybrać spośród", ru: "выбрать из" }
  - { pl: "jeden spośród wielu", ru: "один из многих" }
  - { pl: "wyróżniać się spośród", ru: "выделяться среди" }
family:
  - { pl: "pośród", ru: "среди", relation: root }
  - { pl: "środek", ru: "середина; средство", relation: root, id: srodek }
etymology: "Срастание Z + POŚRÓD, «из среды»: предлог Z, «из», и POŚRÓD, «посреди», от ŚRODEK, «середина». Русское «из среды» и «среди» — тот же корень *serd-, «середина»."
memory: "Spośród = z + pośród, «из среды»: выбрать spośród wielu — из многих. С родительным. Najlepszy spośród uczniów — лучший из учеников."
idioms:
  - { pl: "jeden spośród wielu", ru: "один из многих" }
formExamples:
  - form: "spośród"
    pl: "Wybrałam spośród dwóch alternatyw."
    ru: "Я выбрала из двух вариантов."
    source: { kind: translated, id: 7875561 }
  - form: "spośród"
    pl: "Wyróżnia się spośród ówczesnych malarzy."
    ru: "Он выделяется среди художников своего времени."
    source: { kind: translated, id: 1473059 }
  - form: "spośród"
    pl: "Emi tańczyła najlepiej spośród trzech dziewcząt."
    ru: "Эми танцевала лучше всех из трёх девочек."
    source: { kind: translated, id: 880403 }
  - form: "spośród"
    pl: "Proszę wybrać jedną spośród tych nagród."
    ru: "Выберите, пожалуйста, одну из этих наград."
    source: { kind: translated, id: 1571166 }
  - form: "spośród"
    pl: "Który spośród tych chłopców to Masao?"
    ru: "Который из этих мальчиков Масао?"
    source: { kind: translated, id: 8090282 }
