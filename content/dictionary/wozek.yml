notes:
  - { kind: pronunciation, text: "ДВА ЯВЛЕНИЯ СРАЗУ, ОБА ЗНАКОМЫЕ. Беглое e выпадает во всех косвенных падежах: wózek, но wózka, wózkiem — как dodatek, pierścionek, ładunek. А ó держится во всех формах, потому что это ó исходного wóz «воз»: wóz — wozu, но wózek — wózka. Читается ó как у: «ву́зэк»." }
  - { kind: false-friend, text: "СЛОВО РОДСТВЕННО РУССКОМУ «ВОЗОК», НО УПОТРЕБЛЯЕТСЯ ИНАЧЕ. Wózek это уменьшительное от wóz «воз, повозка», как русский «возок». Но русское слово устарело, а польское обслуживает три повседневных предмета: детскую коляску, магазинную тележку и инвалидное кресло. Переводить его надо по контексту, одним словом не выйдет." }
  - { kind: usage, text: "Виды уточняют прилагательным: wózek dziecięcy «детская коляска», wózek sklepowy «магазинная тележка», wózek inwalidzki «инвалидная коляска», wózek widłowy «погрузчик». Оборот być na wózku значит «быть в инвалидной коляске» и звучит нейтрально." }
collocations:
  - { pl: "wózek dziecięcy", ru: "детская коляска" }
  - { pl: "wózek sklepowy", ru: "магазинная тележка" }
  - { pl: "wózek inwalidzki", ru: "инвалидная коляска" }
family:
  - { pl: "wóz", ru: "воз, повозка", relation: root, id: woz }
  - { pl: "wozić", ru: "возить", relation: root }
  - { pl: "samochód", ru: "автомобиль", relation: derived, id: samochod }
etymology: "Уменьшительное от wóz «воз, телега», из праславянского *vozъ — того же слова, что русский «воз», от *vezti «везти». Русский «возок» того же устройства, но вышел из употребления. Суффикс -ek несёт беглое e, выпадающее при склонении. Отсюда wózkowy, wozić, przewóz."
memory: "wózek — «коляска» и «тележка» разом: детская, магазинная, инвалидная. Уменьшительное от wóz «воз», как русский «возок», только живое. Беглое e выпадает: wózka, wózkiem."
idioms:
  - { pl: "wózek inwalidzki", ru: "инвалидная коляска" }
  - { pl: "wózek widłowy", ru: "вилочный погрузчик" }
