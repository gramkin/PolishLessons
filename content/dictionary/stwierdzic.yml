        ru: "Он заявил, что это невозможно."
        source: { kind: authored }
      - pl: "Stwierdziła krótko, że nie przyjdzie."
        ru: "Она коротко сказала, что не придёт."
        source: { kind: authored }
  - id: finding
    ru: "stwierdzenie — утверждение, констатация"
    examples:
      - pl: "To stwierdzenie wymaga dowodu."
        ru: "Это утверждение требует доказательства."
        source: { kind: authored }
      - pl: "Po stwierdzeniu usterki wstrzymano produkcję."
        ru: "После обнаружения неисправности производство остановили."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушка не с русским словом, а с собственной несовершенной парой. Twierdzić значит «УТВЕРЖДАТЬ, заявлять как своё мнение» — это и есть русское «утверждать». А stwierdzić значит «УСТАНОВИТЬ, констатировать как факт». Русскоязычный, желая сказать «он утверждает», тянется к stwierdza — и получается, будто человек выносит заключение, а не высказывает мнение. Для мнения нужен twierdzić." }
  - { kind: register, text: "Слово официальное: язык врача, суда, протокола и экспертизы. Lekarz stwierdził zgon, sąd stwierdził nieważność, komisja stwierdziła uchybienia. Во втором значении, «заявить», оно звучит сухо и веско — так говорят, подводя черту, а не поддерживая беседу." }
  - { kind: government, text: "Констатируют ЧТО — винительный: stwierdzić zgon, stwierdzić usterkę. Либо целое придаточное с że: stwierdził, ŻE to niemożliwe. А если речь о человеке, у которого что-то обнаружили, он идёт с предлогом U и РОДИТЕЛЬНЫМ: stwierdzono U niego chorobę — «у него обнаружили болезнь»." }
collocations:
  - { pl: "stwierdzić zgon", ru: "констатировать смерть" }
  - { pl: "stwierdzić nieważność", ru: "установить недействительность" }
  - { pl: "stwierdzić, że...", ru: "заявить, что..." }
family:
  - { pl: "twierdzić", ru: "утверждать, заявлять", relation: root, id: twierdzic }
  - { pl: "twardy", ru: "твёрдый", relation: root, id: twardy }
  - { pl: "stwierdzenie", ru: "утверждение, констатация", relation: derived }
etymology: "Приставка s- плюс twierdzić, от twardy «твёрдый», праславянское *tvьrdъ. Русские «твёрдый», «утверждать», «твердить» — из того же гнезда, и логика общая: установить что-то значит сделать его твёрдым, незыблемым. Отсюда же польские twierdza «крепость» и potwierdzić «подтвердить»."
memory: "stwierdzić — «констатировать, установить как факт», а не «утверждать»: мнение высказывают глаголом twierdzić. Корень тот же, что «твёрдый»: установить значит закрепить твёрдо. Слово официальное — язык врача и суда."
idioms:
  - { pl: "stwierdzić zgon", ru: "констатировать смерть" }
  - { pl: "trzeba stwierdzić, że...", ru: "надо констатировать, что..." }
formExamplesSkip:
  - { form: "stwierdzeni", reason: "Мужско-личная форма страдательного причастия. Глагол stwierdzić берёт дополнением ФАКТ — zgon, usterkę, nieważność, — но никогда человека: о человеке, у которого что-то обнаружили, говорят stwierdzono U niego chorobę, с предлогом u и родительным. Винительного дополнения-лица у глагола нет, поэтому подлежащего для такого оборота не существует: людей не «констатируют». Та же причина, что у przerwani, głosowani, uprawiani, przespani и pieczeni." }
