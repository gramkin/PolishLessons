etymology: "Из праславянского *tęti с настоящим временем *tьnǫ — отсюда и двойная основа CIĄĆ при TNĘ. Современный русский этот глагол не сохранил и говорит «резать», но само чередование русскому знакомо по другим словам того же устройства, где носовая гласная сменяется сочетанием с -n-. Из польского гнезда вышли CIĘCIE «разрез», PRZECINEK «запятая», то есть «прорез», OBCIĄĆ «обрезать», WYCIĄĆ «вырезать», ROZCIĄĆ «разрезать»."
memory: "Две основы, запоминать парой: ciąć, но tnę и tnij. А ciąć koszty — «резать расходы», как по-русски."
idioms:
  - { pl: "ciąć koszty", ru: "урезать расходы" }
  - { pl: "cięta riposta", ru: "резкий ответ, остроумная отповедь" }
