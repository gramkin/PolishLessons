notes:
  - { kind: pronunciation, text: "Самое поразительное в этом глаголе — две основы, совсем друг на друга не похожие. Инфинитив, прошедшее время и причастия идут от CIĄ-/CIĘ-: CIĄĆ, CIĄŁ, CIĘŁA, CIĘLI, CIĘTY, CIĘCIE. А всё настоящее время и повелительное — от TN-: TNĘ, TNIESZ, TNIE, TNĄ, TNIJ. Со стороны кажется, что это два разных глагола, но нет: мена идёт от древнего чередования носовой гласной с сочетанием -n-, и в польском она же работает у GIĄĆ при GNĘ и у WZIĄĆ при WEZMĘ. Запоминать такие глаголы надо сразу парой: CIĄĆ и TNĘ." }
  - { kind: usage, text: "Шестьдесят четыре формы — на одну больше обычных шестидесяти трёх, и причина та же, что у PRZENOSIĆ из партии 280: PoliMorf помечает этот глагол и как несовершенный, и как совершенный, тридцать три помёты против тридцати семи. Лишняя форма — деепричастие CIĄWSZY, какое бывает только у совершенного вида, рядом с несовершенным TNĄC. Так что шестьдесят четыре складываются как шестьдесят три плюс одна форма от второго чтения." }
  - { kind: pronunciation, text: "Повелительное TNIJ — ещё одна проверка правила, исправленного в партии 259. Третье лицо TNIE, отбрасываем -ie, остаётся TN-, и такой основой польское слово закончиться не может: нет слов на -tn. Поэтому вставляется -ij, выходит TNIJ, TNIJMY, TNIJCIE. Сравните с POGRZEB и SKOP, где основа слово закончить могла и вставки не было." }
  - { kind: government, text: "Переходный, винительный: CIĄĆ COŚ — ciąć chleb, drewno, materiał. Чем режут — творительный без предлога: CIĄĆ PIŁĄ, NOŻYCAMI. Переносное значение экономическое и в новостях постоянное: CIĄĆ KOSZTY, CIĄĆ BUDŻET, CIĄĆ ETATY — «резать расходы, бюджет, штаты», ровно как по-русски. Из гнезда идут CIĘCIE «разрез, сокращение», PRZECINEK «запятая», CIĘTY «резкий» в обороте CIĘTA RIPOSTA — «резкий ответ»." }
collocations:
  - { pl: "ciąć chleb", ru: "резать хлеб" }
  - { pl: "ciąć koszty", ru: "урезать расходы" }
  - { pl: "cięta riposta", ru: "резкий ответ" }
family:
