# review
id: laska
format: 2
lemma: "laska"
rank: 1285
pos: noun
pron: { cyr: "ля́ска" }
senses:
  - id: stick
    ru: "трость, палка (для опоры)"
    examples:
      - pl: "Starzec oparł się o swoją laskę."
        ru: "Старик опёрся на свою трость."
        source: { kind: translated, id: 10774146 }
      - pl: "Mój dziadek nie umie chodzić bez laski."
        ru: "Мой дедушка не умеет ходить без трости."
        source: { kind: translated, id: 823210 }
      - pl: "Dziadek poprosił chłopca, aby przyniósł mu laskę."
        ru: "Дедушка попросил мальчика принести ему трость."
        source: { kind: translated, id: 11750469 }
  - id: girl
    ru: "разговорное: красотка, девушка"
    examples:
      - pl: "Fajna z niej laska."
        ru: "Клёвая она девчонка."
        source: { kind: translated, id: 13008699 }
      - pl: "Mary to prawdziwa laska."
        ru: "Мэри — настоящая красотка."
        source: { kind: translated, id: 13655331 }
      - pl: "Miała laska gadane i przyfarciło jej."
        ru: "Девчонка была языкастая, и ей повезло."
        source: { kind: translated, id: 13781214 }
  - id: unit
    ru: "палочка чего-либо: laska wanilii «палочка ванили»"
    examples:
      - pl: "Laska wanilii."
        ru: "Палочка ванили."
        source: { kind: translated, id: 13030242 }
      - pl: "Laska była długa i sękata."
        ru: "Трость была длинная и сучковатая."
        source: { kind: translated, id: 13008701 }
      - pl: "Kup dwie laski cynamonu."
        ru: "Купи две палочки корицы."
        source: { kind: authored }
notes:
  - { kind: register, text: "Три разных регистра в одном слове: нейтральное «трость», разговорное «красотка, девчонка» и счётное «палочка» (laska wanilii, laska dynamitu)." }
  - { kind: usage, text: "Chodzić o lasce «ходить с тростью» — предлог o с предложным падежом. Biała laska — «белая трость» незрячего." }
  - { kind: false-friend, text: "Не путайте с łaska «милость, благодать», где ł: to inne słowo. В Псалме 23 laska Twoja значит именно «посох»." }
  - { kind: pronunciation, text: "l перед a мягкое: ля́ска. Ударение на первый слог." }
collocations:
  - { pl: "chodzić o lasce", ru: "ходить с тростью" }
  - { pl: "biała laska", ru: "белая трость" }
  - { pl: "laska wanilii", ru: "палочка ванили" }
etymology: "Уменьшительное от laga «палка», из праславянского *laska. Слово не связано с łaska «милость», где другое начальное ł."
memory: "laska — «трость», но в разговорной речи ещё и «красотка», а при счёте — «палочка»: laska wanilii. Осторожно: łaska через ł — совсем другое слово, «милость»."
idioms:
  - { pl: "chodzić o lasce", ru: "ходить с тростью" }
  - { pl: "biała laska", ru: "белая трость" }
  - { pl: "laska wanilii", ru: "палочка ванили" }
formExamplesSkip:
  - { form: "lasko", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
