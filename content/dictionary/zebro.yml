etymology: "Праславянское слово, давшее русское «ребро». Начиналось оно с Р, и в русском так и осталось, а польский заменил этот звук на Ż — случай редкий и необъяснимый, без других подобных примеров в языке. Поэтому родство здесь не слышно совсем, хотя слово одно и то же. В местном падеже проступает исходное Р, только смягчённое до RZ: W ŻEBRZE."
memory: "Ребро, и слово то же, что русское, но начало подменилось: праславянское р- стало в польском z с точкой, без всякого правила, отсюда zebro при «ребре». Читается «жэ́бро». В местном падеже r переходит в rz: w zebrze, «жэ́бже», с двумя «ж». В родительном множественного беглое e: zeber. И zeberka в меню — это свиные рёбрышки."
