notes:
  - { kind: false-friend, text: "Слово то же, что русское «ребро», но узнать его почти невозможно, и причина редкая. Праславянское слово начиналось с Р, и русский это сохранил. Польский же заменил начальное Р на Ż, безо всякого правила и без других примеров: вышло ŻEBRO. Так что РЕБРО и ŻEBRO — одно слово, разошедшееся в самом начале. Запомните заодно ŻEBERKA: так называют свиные рёбрышки, блюдо." }
  - { kind: usage, text: "Девять форм, средний род. В местном падеже R переходит в RZ: ŻEBRO, но W ŻEBRZE. В родительном множественного появляется беглое E: ŻEBER. Множественное ŻEBRA значит и рёбра человека, и рёбра свода в архитектуре, и различает их только смысл. Уменьшительное ŻEBERKO в множественном числе стало названием еды." }
  - { kind: government, text: "Сломать ребро — ZŁAMAĆ ŻEBRO, винительный без предлога, совпадающий с именительным, потому что слово среднего рода. В ребре — W ŻEBRZE, местный падеж с переходом R в RZ. Между рёбрами — MIĘDZY ŻEBRAMI, творительный множественного. Под ребром — POD ŻEBREM, творительный единственного." }
  - { kind: pronunciation, text: "Читается «жэ́бро», два слога, ударение на первом. Буква Ż даёт «ж». Буква B перед R не оглушается, поэтому середина слова это «бро». В местном падеже ŻEBRZE сочетание RZ даёт «ж», и форма звучит «жэ́бже», с двумя «ж» в одном слове. В родительном множественного ŻEBER появляется беглое E: «жэ́бэр»." }
  - { kind: register, text: "Слово нейтральное, из языка врача и из обиходной речи. У хирурга это ŻEBRO ZŁAMANE и KLATKA PIERSIOWA. В архитектуре ŻEBRA SKLEPIENIA — рёбра готического свода, и так написано в каждом путеводителе по костёлам. А ŻEBERKA в меню значат свиные рёбрышки, и это одно из самых частых польских блюд." }
