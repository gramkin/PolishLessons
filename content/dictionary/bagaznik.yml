etymology: "От BAGAŻ, из французского BAGAGE, от старофранцузского BAGUE «узел, тюк», и дальше, по-видимому, от скандинавского слова со значением «связка». Русский «багаж» пришёл тем же французским путём в восемнадцатом веке, поэтому корень совпадает. Польский добавил к нему свой суффикс -NIK, обозначающий предмет по назначению, и получил название отсека; русский в этом месте сделал то же самое со своим «-ник», и слова вышли параллельными, построенными независимо из одного корня и одинаковых по смыслу суффиксов. Такое двойное совпадение в словаре редкость, и его стоит отметить именно потому, что обычно языки расходятся."
memory: "Совпадает с русским полностью, включая ударение: «бага́жник». Суффикс -nik даёт предметы по назначению — czajnik, słownik, ręcznik — и это одно из самых полезных правил для догадки. Внутрь — do bagażnika с родительным, внутри — w bagażniku с местным, как у sejf. Крышка — klapa bagażnika, а klapa в разговоре ещё и «провал»."
