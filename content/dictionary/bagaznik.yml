notes:
  - { kind: usage, text: "Слово покрывает все виды багажников сразу, и уточняет их прилагательное: BAGAŻNIK DACHOWY «багажник на крыше», BAGAŻNIK ROWEROWY «велосипедный», а без уточнения это почти всегда автомобильный отсек. Крышка багажника — KLAPA BAGAŻNIKA, и слово KLAPA тут же стоит запомнить, потому что оно значит и «крышка», и, в разговоре, «провал, неудача»: PRZEDSTAWIENIE BYŁO KLAPĄ. Носильщик на вокзале, однокоренной BAGAŻOWY, в современной Польше почти исчез вместе с профессией." }
  - { kind: pronunciation, text: "Читается «бага́жник», ударение на предпоследнем слоге, как и в русском слове. Буква Ż даёт «ж», и на этом сходство заканчивается: польское слово звучит почти как русское, и это один из немногих случаев в словаре, когда ничего перестраивать не нужно. В местном и звательном падеже BAGAŻNIKU ударение остаётся на том же слоге: «бага́жнику». Во множественном BAGAŻNIKI сочетание KI смягчается: «бага́жники»." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: OTWÓRZ BAGAŻNIK. Движение внутрь — предлог DO с родительным: WRZUCIĆ DO BAGAŻNIKA, нахождение внутри — W с местным: W BAGAŻNIKU. Это та же пара, что у SEJF: польский меняет предлог там, где русский меняет только падеж при одном «в». Родительный на -A, что для неодушевлённых реже, чем -U, но для слов на -NIK обычно: BAGAŻNIKA, как SŁOWNIKA, CZAJNIKA." }
  - { kind: false-friend, text: "Значение совпадает с русским «багажником», и ловушки нет, но корень стоит разобрать, потому что он даёт целый ряд. BAGAŻ значит «багаж», а суффикс -NIK в польском образует названия предметов по назначению: BAGAŻNIK «то, для багажа», CZAJNIK «чайник», SŁOWNIK «словарь», то есть «то, для слов», RĘCZNIK «полотенце», уже знакомое из более ранней карточки. Поэтому незнакомое слово на -NIK почти всегда читается как «приспособление для чего-то», и это одно из самых продуктивных правил польского словообразования." }
