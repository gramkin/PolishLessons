# review
id: opiekowac
format: 2
lemma: "opiekować"
rank: 1997
pos: verb
pron: { cyr: "опьеко́ваць" }
senses:
  - id: care-for
    ru: "заботиться, ухаживать (opiekować się kimś)"
    examples:
      - pl: "Opiekuje się chorą matką od roku."
        ru: "Он год ухаживает за больной матерью."
        source: { kind: authored }
      - pl: "Opiekowali się psem sąsiadów przez wakacje."
        ru: "Они присматривали за соседской собакой все каникулы."
        source: { kind: authored }
      - pl: "Kto się opiekuje dziećmi po lekcjach?"
        ru: "Кто присматривает за детьми после уроков?"
        source: { kind: authored }
  - id: supervise
    ru: "курировать, вести (о научном руководителе, кураторе)"
    examples:
      - pl: "Opiekuje się grupą pierwszoroczniaków."
        ru: "Он курирует группу первокурсников."
        source: { kind: authored }
      - pl: "Opiekujący się projektem profesor wyjechał."
        ru: "Куратор проекта, профессор, уехал."
        source: { kind: authored }
  - id: caring
    ru: "opiekowanie — уход, присмотр (как действие)"
    examples:
      - pl: "Opiekowanie się chorym to praca na cały etat."
        ru: "Уход за больным — работа на полную ставку."
        source: { kind: authored }
      - pl: "Po latach opiekowania się matką potrzebowała odpoczynku."
        ru: "После лет ухода за матерью ей нужен был отдых."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень родной и узнаваемый: opieka — это русская «ОПЕКА», opiekun — «опекун». Но по-русски «опекать» звучит сухо, почти юридически, а польское opiekować się — слово обиходное и тёплое: так говорят и о больной матери, и о соседской кошке. Ближе всего по смыслу русское «ухаживать за» или «присматривать за»." }
  - { kind: government, text: "ГЛАВНОЕ РАСХОЖДЕНИЕ, И ОНО В ПАДЕЖЕ. Польский требует ТВОРИТЕЛЬНОГО без предлога: opiekować się dzieckiem, matką, psem. Русский так не умеет: он говорит «опекать кого-то» (винительный) или «ухаживать ЗА кем-то» (за плюс творительный). Падеж тот же, что в русском «за», но предлога быть не должно — вот это и забывается." }
  - { kind: usage, text: "Глагол живёт только с się. Совершенная пара — zaopiekować się: opiekowała się nim latami «она ухаживала за ним годами», но zaopiekuj się nim «позаботься о нём». Настоящее время по правилу -ować: opiekuję, opiekujesz." }
  - { kind: register, text: "ПОЧЕМУ НЕТ СТРАДАТЕЛЬНЫХ ФОРМ. Дополнение стоит в творительном, а не в винительном, поэтому превращать в подлежащее нечего, и причастия вроде *opiekowany не существует. Та же причина, что у współpracować z kimś, skorzystać z czegoś и gapić się na coś — одно правило на четыре карточки." }
collocations:
  - { pl: "opiekować się dzieckiem", ru: "присматривать за ребёнком" }
  - { pl: "opieka zdrowotna", ru: "здравоохранение" }
  - { pl: "zaopiekować się kimś", ru: "позаботиться о ком-л." }
family:
  - { pl: "opieka", ru: "опека, забота, уход", relation: root, id: opieka }
  - { pl: "opiekun", ru: "опекун, куратор", relation: root }
  - { pl: "zaopiekować", ru: "позаботиться", relation: aspect }
etymology: "От opieka «забота, опека», а то — от piecza «попечение», родственного русским «опека», «печься о ком-то», «попечитель». Корень тот же, что в piec «печь»: исходный образ — согревать, держать в тепле, отсюда и забота. Русская «опека» и польская opieka — одно слово, только у поляка оно осталось будничным."
memory: "opiekować się — «ухаживать, присматривать», от opieka «опека». Падеж запомнить обязательно: творительный БЕЗ предлога — opiekować się dzieckiem, тогда как по-русски «ухаживать ЗА ребёнком». И страдательных форм у глагола нет: дополнение не винительное."
idioms:
  - { pl: "opiekować się kimś jak własnym dzieckiem", ru: "заботиться о ком-л. как о родном ребёнке" }
  - { pl: "zostawić kogoś bez opieki", ru: "оставить кого-л. без присмотра" }
