# review
id: magiczny
format: 2
lemma: "magiczny"
rank: 1883
pos: adj
pron: { cyr: "маги́чны" }
senses:
  - id: magic
    ru: "магический, волшебный"
    examples:
      - pl: "Magiczne słowo brzmi „proszę”."
        ru: "Волшебное слово — «пожалуйста»."
        source: { kind: authored }
      - pl: "Wypowiedział magiczną formułę."
        ru: "Он произнёс магическую формулу."
        source: { kind: authored }
      - pl: "Pokazał dzieciom magiczną sztuczkę."
        ru: "Он показал детям волшебный фокус."
        source: { kind: authored }
  - id: enchanting
    ru: "чудесный, завораживающий (о впечатлении)"
    examples:
      - pl: "Wieczór był wprost magiczny."
        ru: "Вечер был просто волшебный."
        source: { kind: authored }
      - pl: "To miejsce ma magiczną atmosferę."
        ru: "У этого места волшебная атмосфера."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушек нет: слово латинское и в оба языка пришло одинаковым, magiczny при русском «магический». Помнить надо лишь о втором, разговорном употреблении — magiczny wieczór значит просто «чудесный, незабываемый вечер», без всякого колдовства, как и русское «волшебный вечер»." }
  - { kind: usage, text: "Рядом стоят czarodziejski «волшебный, от волшебника» и cudowny «чудесный». Magiczny тяготеет к обрядам и фокусам: magiczna formuła, magiczna sztuczka, magiczne zaklęcie. Про сказочное скорее скажут bajkowy." }
  - { kind: pronunciation, text: "ОДИННАДЦАТЬ ФОРМ И ОДНА РАЗВИЛКА. У прилагательного этого типа нет степеней сравнения, поэтому форм всего одиннадцать, а не тридцать с лишним. Зато во множественном числе развилка: мужско-личная форма отдельно от всех прочих — ślepi ludzie против ślepe konie, magiczni czarodzieje против magiczne słowa, męscy koledzy против męskie koszule. Про людей-мужчин одно окончание, про всё остальное другое." }
collocations:
  - { pl: "magiczne słowo", ru: "волшебное слово" }
  - { pl: "magiczna sztuczka", ru: "фокус" }
  - { pl: "magiczna formuła", ru: "магическая формула" }
family:
  - { pl: "magia", ru: "магия", relation: root, id: magia }
  - { pl: "mag", ru: "волшебник, маг", relation: root }
  - { pl: "czarodziejski", ru: "волшебный", relation: derived }
etymology: "От magia, через латинское magia и греческое mageia, а то — от персидских «магов», жрецов-звездочётов. Русское «магия» и «магический» пришли тем же путём и тем же корнем, поэтому слово узнаётся без усилий. Разошлись только привычные сочетания."
memory: "magiczny — «магический, волшебный», слово латинское и совпадает с русским. Запоминать стоит сочетания: magiczne słowo «волшебное слово» (это „proszę”) и magiczna sztuczka «фокус». Форм одиннадцать: степеней сравнения нет."
idioms:
  - { pl: "magiczne słowo", ru: "волшебное слово" }
  - { pl: "magiczna różdżka", ru: "волшебная палочка" }
