notes:
  - { kind: false-friend, text: "Корень PSU- русскому языку в чистом виде не достался, и опереться на знакомое слово тут не получится: польское PSUĆ значит «портить», а русское «портить» идёт от совсем другого корня, от «портить, пороть». Поэтому всё гнездо приходится учить как новое. Зато внутри польского оно очень связное: ZEPSUĆ «испортить», ZEPSUTY «испорченный, сломанный», PSUĆ SIĘ «портиться, ломаться», PSOTA «шалость, озорство», PSOTNIK «шалун». Ловушка в созвучии с PIES «собака»: PSI значит «собачий», от PIES, и к PSUĆ отношения не имеет, хотя формы PSUJ и PSY на слух похожи." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия PSUJĄCY, одиннадцать от страдательного PSUTY. Основа настоящего времени получает J: инфинитив PSUĆ, но PSUJĘ, PSUJESZ, PSUJE — как у всех глаголов на -UĆ, сравните CZUĆ и CZUJĘ. Совершенная пара — ZEPSUĆ, и причастие от неё, ZEPSUTY, в живой речи встречается гораздо чаще, чем PSUTY: «сломанный телефон» это ZEPSUTY TELEFON. Возвратное PSUĆ SIĘ — главный способ сказать, что техника ломается или еда портится, и подлежащим тут выступает сам предмет." }
  - { kind: government, text: "Переходный: портить что — винительный без предлога, PSUĆ ZABAWĘ, PSUĆ NASTRÓJ, PSUĆ WZROK. Кому — дательный: PSUĆ KOMUŚ NASTRÓJ, PSUĆ DZIECIOM ZABAWĘ, в точности как русское «портить кому-то настроение». Отрицание требует родительного: NIE PSUJ ZABAWY, а не NIE PSUJ ZABAWĘ. Возвратное PSUĆ SIĘ непереходно и дополнения не принимает: TELEFON SIĘ PSUJE. Отдельно стоит значение «баловать»: PSUĆ DZIECKO значит «баловать ребёнка», то есть портить воспитанием, и по-русски это передаётся другим словом, хотя образ тот же." }
  - { kind: pronunciation, text: "Читается «псуць», один слог, и в нём три согласных подряд в начале: P, S и U уже гласная, но сочетание PS произносится полностью, без вставного гласного — «псуць», а не «псуить». Конечное Ć — мягкое «ць». В формах настоящего времени появляется J: PSUJĘ звучит «псу́е» с лёгким носовым на конце, PSUJESZ — «псу́еш», PSUJĄ — «псу́йон». В причастии PSUJĄCY три слога: «псуйо́нцы». В совершенном ZEPSUĆ два слога, ударение на первом: «зэ́псуць»." }
