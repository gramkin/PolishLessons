etymology: "Из праславянского *pьsovati «портить, бранить», от того же корня, что *pьsъ «собака»: исходный образ — обойтись с чем-то по-собачьи, испортить. Русский этот глагол утратил почти полностью и сохранил лишь следы в диалектном «псовать» и в «опсовать» со значением «обругать», а для основного смысла взял «портить». Польский, напротив, сделал PSUĆ центральным словом и развил из него целое гнездо: ZEPSUTY «сломанный», PSOTA «шалость», PSOTNIK «шалун», где собачий оттенок уже совсем выветрился и осталось просто озорство. Поэтому для русскоязычного это слово — одно из немногих частых польских слов без опоры на русский корень, и запоминать его приходится через гнездо, а не через созвучие. Основа на -UJ- в настоящем времени у глаголов на -UĆ регулярна, как в CZUĆ и CZUJĘ."
memory: "Редкий случай: опереться на русский корень нельзя, «портить» и psuć не родственны. Зато гнездо связное: psuć «портить», psuć się «ломаться, портиться», zepsuć «испортить», zepsuty «сломанный» (zepsuty telefon), psota «шалость». Исходный образ — от pies «собака», обойтись по-собачьи. Настоящее время получает j: psuję, psujesz, как czuć/czuję. Дательный для пострадавшего, как в русском: psuć komuś nastrój. И psuć dziecko значит «баловать»."
