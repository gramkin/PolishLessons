etymology: "Из немецкого SCHEIBE «диск, круглая пластина, срез». Русский взял то же слово и получил «шайбу» — и хоккейную, и ту, что кладут под гайку, — а польский закрепил за ним оконное стекло. Один источник, два совершенно разных предмета, и созвучие тут сбивает с толку сильнее, чем помогает."
memory: "Та же немецкая Scheibe, что русская «шайба», но значит «оконное стекло». Стекло-материал — szkło, стакан — szklanka. Местный szybie: b даёт bi."
