notes:
  - { kind: false-friend, text: "Слово и русская «шайба» — одно и то же заимствование, разошедшееся по смыслам. Оба пришли из немецкого SCHEIBE «диск, круглая пластина»: польский взял за ним стекло в раме, русский — хоккейную шайбу и деталь под гайку. Поэтому SZYBA никогда не значит «шайба», а «шайба» никогда не переводится как szyba. Хоккейная шайба по-польски называется KRĄŻEK, а та, что под гайкой, — PODKŁADKA." }
  - { kind: usage, text: "Русское «стекло» покрывает и вещество, и вставленный в раму лист, польский же разводит их по трём словам. SZKŁO — это стекло как материал, SZYBA — лист в окне или в машине, SZKLANKA — стакан, из которого пьют. Значит «разбить стекло» будет STŁUC SZYBĘ, а «сделано из стекла» — ZE SZKŁA, и подменять одно другим нельзя. Самое частое сочетание — PRZEDNIA SZYBA «лобовое стекло»." }
  - { kind: pronunciation, text: "Дательный и местный — SZYBIE: b переходит в мягкое, которое перед гласной пишется bi. Это один из тех согласных, которых не было в списке, приведённом в карточке ZESTAW, и вместе с z из BLIZNA в этой же партии они показывают, что список там был неполон. Полный ряд приведён в карточке BLIZNA. Родительный множественного здесь — SZYB, голая основа, как blizn и ław." }
