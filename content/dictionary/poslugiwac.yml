formExamples:
  - form: "posługiwać"
    pl: "Czy mógłbyś mnie nauczyć posługiwać się Excelem?"
    ru: "Ты бы не мог научить меня пользоваться Excel?"
    source: { kind: tatoeba, id: 12692271 }
  - form: "posługiwać"
    pl: "Nie wiem, jak się posługiwać tym kompasem."
    ru: "Я не знаю, как пользоваться этим компасом."
    source: { kind: translated, id: 921423 }
  - form: "posługiwać"
    pl: "Jedynym językiem obcym, którym umiem się posługiwać, jest francuski."
    ru: "Единственный иностранный язык, которым я владею, — французский."
    source: { kind: translated, id: 4957006 }
  - form: "posługiwał"
    pl: "Dobrze posługiwał się nożem i widelcem."
    ru: "Он хорошо управлялся с ножом и вилкой."
    source: { kind: translated, id: 440483 }
  - form: "posługiwał"
    pl: "Posługiwał się fałszywym nazwiskiem."
    ru: "Он пользовался чужой фамилией."
    source: { kind: authored }
  - form: "posługiwał"
    pl: "Posługiwał się tylko młotkiem."
    ru: "Он пользовался только молотком."
    source: { kind: authored }
  - form: "posługiwanie"
    pl: "Posługiwanie się ogniem można uznać za największy wynalazek człowieka."
    ru: "Пользование огнём можно считать величайшим изобретением человека."
    source: { kind: translated, id: 10806792 }
  - form: "posługiwanie"
    pl: "Posługiwanie się nożem wymaga wprawy."
    ru: "Пользование ножом требует навыка."
    source: { kind: authored }
  - form: "posługiwanie"
    pl: "Posługiwanie się mapą jest proste."
    ru: "Пользование картой несложно."
    source: { kind: authored }
  - form: "posługiwaniem"
    pl: "Jest wielka różnica pomiędzy posługiwaniem się językiem dobrze, a posługiwaniem się językiem biegle."
    ru: "Есть большая разница между тем, чтобы владеть языком хорошо, и тем, чтобы владеть им свободно."
    source: { kind: translated, id: 4558065 }
  - form: "posługiwaniem"
    pl: "Ma kłopot z posługiwaniem się myszką."
    ru: "У него трудности с пользованием мышкой."
    source: { kind: authored }
  - form: "posługiwaniem"
    pl: "Radzi sobie z posługiwaniem się komputerem."
    ru: "Он справляется с пользованием компьютером."
    source: { kind: authored }
  - form: "posługiwaniu"
    pl: "Poeta jest przede wszystkim artystą w posługiwaniu się słowem."
    ru: "Поэт — прежде всего художник в обращении со словом."
    source: { kind: translated, id: 12165184 }
  - form: "posługiwaniu"
    pl: "W posługiwaniu się nożem liczy się wprawa."
    ru: "В обращении с ножом важен навык."
    source: { kind: authored }
  - form: "posługiwaniu"
    pl: "Pomógł mi w posługiwaniu się programem."
    ru: "Он помог мне в пользовании программой."
    source: { kind: authored }
  - form: "posługują"
    pl: "Nie ma wielu Japończyków, którzy dobrze posługują się angielskim."
    ru: "Немного найдётся японцев, которые хорошо владеют английским."
    source: { kind: translated, id: 2420381 }
  - form: "posługują"
    pl: "Posługują się starym sprzętem."
    ru: "Они пользуются старым оборудованием."
    source: { kind: authored }
  - form: "posługują"
    pl: "Posługują się dwoma językami."
    ru: "Они владеют двумя языками."
    source: { kind: authored }
  - form: "posługując"
    pl: "Tom kupił piwo posługując się fałszywym dowodem osobistym."
    ru: "Том купил пиво, воспользовавшись поддельным удостоверением."
    source: { kind: translated, id: 10543392 }
  - form: "posługując"
    pl: "Odpowiedział, posługując się słownikiem."
    ru: "Он ответил, пользуясь словарём."
    source: { kind: authored }
  - form: "posługując"
    pl: "Pracuje, posługując się starym laptopem."
    ru: "Он работает, пользуясь старым ноутбуком."
    source: { kind: authored }
  - form: "posługuje"
    pl: "Ona biegle posługuje się francuskim."
    ru: "Она свободно владеет французским."
    source: { kind: translated, id: 6972367 }
  - form: "posługuje"
    pl: "Język suahili posługuje się pismem łacińskim."
    ru: "Язык суахили пользуется латинской письменностью."
    source: { kind: translated, id: 964975 }
  - form: "posługuje"
    pl: "Chłopak świetnie posługuje się nożem i widelcem."
    ru: "Мальчик отлично управляется с ножом и вилкой."
    source: { kind: translated, id: 951098 }
  - form: "posługujemy"
    pl: "Posługujemy się tym słownikiem."
    ru: "Мы пользуемся этим словарём."
    source: { kind: authored }
  - form: "posługujemy"
    pl: "Na co dzień posługujemy się polskim."
    ru: "В быту мы пользуемся польским."
    source: { kind: authored }
  - form: "posługujemy"
    pl: "Posługujemy się prostym narzędziem."
    ru: "Мы пользуемся простым инструментом."
    source: { kind: authored }
  - form: "posługujesz"
    pl: "Iloma językami płynnie się posługujesz?"
    ru: "Сколькими языками ты свободно владеешь?"
    source: { kind: translated, id: 849078 }
  - form: "posługujesz"
    pl: "Iloma językami dobrze się posługujesz?"
    ru: "Сколькими языками ты хорошо владеешь?"
    source: { kind: translated, id: 4917235 }
  - form: "posługujesz"
    pl: "Jakim programem się posługujesz?"
    ru: "Какой программой ты пользуешься?"
    source: { kind: authored }
