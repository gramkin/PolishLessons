# review
id: poslugiwac
format: 2
lemma: "posługiwać"
rank: 2400
pos: verb
aspect: imperf
pron: { cyr: "послуги́ваць" }
senses:
  - id: use-tool
    ru: "пользоваться (чем-л.), владеть"
    examples:
      - pl: "Czy mógłbyś mnie nauczyć posługiwać się Excelem?"
        ru: "Ты бы не мог научить меня пользоваться Excel?"
        source: { kind: tatoeba, id: 12692271 }
      - pl: "Nie wiem, jak się posługiwać tym kompasem."
        ru: "Я не знаю, как пользоваться этим компасом."
        source: { kind: translated, id: 921423 }
      - pl: "Czy możesz mi powiedzieć, jak posługiwać się tym edytorem tekstów?"
        ru: "Можешь сказать мне, как пользоваться этим текстовым редактором?"
        source: { kind: translated, id: 527750 }
  - id: speak-language
    ru: "владеть (языком), говорить на"
    examples:
      - pl: "Ona biegle posługuje się francuskim."
        ru: "Она свободно владеет французским."
        source: { kind: translated, id: 6972367 }
      - pl: "Iloma językami płynnie się posługujesz?"
        ru: "Сколькими языками ты свободно владеешь?"
        source: { kind: translated, id: 849078 }
notes:
  - { kind: government, text: "ГЛАВНОЕ: всегда с się и с ТВОРИТЕЛЬНЫМ падежом — posługiwać się czymś. Русское «пользоваться чем-л.» тоже берёт творительный, так что здесь языки совпадают." }
  - { kind: false-friend, text: "От sługa «слуга», służyć «служить»: буквально «заставлять служить себе». Русское «пользоваться» построено от «пользы» — образ другой." }
  - { kind: usage, text: "О языках это основной глагол: posługiwać się językiem obcym «владеть иностранным языком», биeglе «свободно»." }
  - { kind: usage, text: "Совершенный вид — posłużyć się. Отглагольное posługiwanie się «пользование»." }
collocations:
  - { pl: "posługiwać się czymś", ru: "пользоваться чем-л." }
  - { pl: "biegle posługiwać się językiem", ru: "свободно владеть языком" }
etymology: "От sługa «слуга», służyć «служить» — буквально «заставлять служить себе»."
memory: "posługiwać się czymś — «пользоваться чем-л.», всегда с się и творительным. О языках это основной глагол: biegle posługiwać się francuskim."
