notes:
  - { kind: false-friend, text: "Самая опасная карточка этой партии. Русское «брутальный» — заимствование свежее и означает «мужественный, грубовато-привлекательный»; это похвала: «брутальный мужчина». Польское BRUTALNY — никогда не похвала. Оно значит «жестокий, грубый, беспощадный»: BRUTALNY ATAK «жестокое нападение», BRUTALNE MORDERSTWO «зверское убийство», BRUTALNA SIŁA «грубая сила». Назвать человека BRUTALNY по-польски — обвинить его в жестокости, а не отметить обаяние. Русскому «брутальный» в польском отвечают MĘSKI или SUROWY." }
  - { kind: usage, text: "Два значения, и оба отрицательные. Первое — о действии и человеке: применена сила, причинена боль. Второе — о словах и правде: сказано без пощады к слушателю, BRUTALNA PRAWDA, BRUTALNIE SZCZERY. Во втором значении слово уже не обвиняет, а скорее хвалит прямоту, и это единственный случай, когда BRUTALNY звучит почти одобрительно. Наречие BRUTALNIE употребляется чаще самого прилагательного." }
  - { kind: pronunciation, text: "Снова класс -ALNY: там, где русский пишет «-альный» с мягким знаком, польский пишет -ALNY твёрдо, без всякой мягкости. BRUTALNY — «брута́лны», ударение на предпоследнем слоге, l твёрдое. Сравните ORYGINALNY из предыдущей партии, а также NORMALNY, LEGALNY, SPECJALNY: одна латинская модель -ALIS на оба языка, но мягкость появилась только в русском. Мужско-личная форма BRUTALNI — с мягким ni, «брута́льни»." }
  - { kind: government, text: "Прилагательное согласуется с существительным и своего управления не имеет, но степени сравнения образует правильно и по тому же образцу, что ORYGINALNY: BRUTALNY — BRUTALNIEJSZY — NAJBRUTALNIEJSZY, и рядом живёт описательная форма BARDZIEJ BRUTALNY. При сравнении — OD с родительным или NIŻ: BRUTALNIEJSZY OD POPRZEDNIEGO, BRUTALNIEJSZY NIŻ POPRZEDNI." }
