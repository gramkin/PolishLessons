etymology: "Из латинского BRUTUS «тяжёлый, тупой, неразумный» — того же слова, что в имени Брута, — через позднелатинское BRUTALIS «свойственный животному, бессмысленный» и французское BRUTAL. В польский слово пришло книжным путём и сохранило исходное значение: тот, кто действует как зверь, без рассудка и без жалости. Русское «брутальный» взято из того же латинского корня, но много позже и другим путём — через западную модную речь, где BRUTAL успело получить одобрительный оттенок силы и мужественности. Поэтому корень общий, а оценка противоположная: редкий случай, когда разошлись не формы, а знак."
memory: "Класс -ALNY без мягкого знака, как ORYGINALNY. Но значение не русское: BRUTALNY — «жестокий», это обвинение, а не комплимент. Русскому «брутальному мужчине» отвечает MĘSKI, не BRUTALNY."
