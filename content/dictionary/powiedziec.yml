# review
id: powiedziec
format: 2
lemma: "powiedzieć"
rank: 29
pos: verb
aspect: perf
aspectPair: mowic
pron: { cyr: "повье́дзець" }
senses:
  - id: say
    ru: "сказать"
    examples:
      - pl: "Mam im powiedzieć?"
        ru: "Мне им сказать?"
        source: { kind: tatoeba, id: 5909113 }
      - pl: "Powiedz"
        ru: "Скажи."
        source: { kind: tatoeba, id: 13627131 }
      - pl: "Co on powiedział?"
        ru: "Что он сказал?"
        source: { kind: tatoeba, id: 6373405 }
  - id: tell
    ru: "сказать кому-л., сообщить"
    examples:
      - pl: "Więcej już ci nic nie powiem."
        ru: "Я тебе вообще больше ничего рассказывать не буду."
        source: { kind: tatoeba, id: 12476616 }
      - pl: "Powiedziano mi, żebym się wyspał."
        ru: "Мне сказали, чтобы я выспался."
        source: { kind: tatoeba, id: 1259281 }
notes:
  - { kind: usage, text: "Видовая пара: mówić «говорить» — powiedzieć «сказать»." }
  - { kind: usage, text: "Управление как в русском: powiedzieć komuś coś — дательный адресата и винительный содержания." }
collocations:
  - { pl: "powiedzieć prawdę", ru: "сказать правду" }
  - { pl: "że tak powiem", ru: "так сказать" }
  - { pl: "co powiesz?", ru: "что скажешь?" }
etymology: "Приставочное образование от wiedzieć: po- + wiedzieć, буквально «поведать»; ср. русское «поведать»."
memory: "Слово буквально собрано из «по» и «ведать» — отсюда и русская параллель «поведать». Видовая пара: mówić «говорить» → powiedzieć «сказать», как и в русском."
idioms:
  - { pl: "prawdę powiedziawszy", ru: "по правде говоря" }
  - { pl: "powiedzieć komuś do słuchu", ru: "высказать кому-то всё" }
  - { pl: "powiedziałeś A, powiedz B", ru: "сказал А, говори Б" }
