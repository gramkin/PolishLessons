# review
id: skontaktowac
format: 2
lemma: "skontaktować"
rank: 1595
pos: verb
aspect: perf
pron: { cyr: "сконтакто́ваць" }
senses:
  - id: contact
    ru: "связаться (с кем-л.)"
    examples:
      - pl: "Chcę się z nią skontaktować."
        ru: "Я хочу с ней связаться."
        source: { kind: translated, id: 480032 }
      - pl: "Możesz skontaktować się z Tomem?"
        ru: "Ты можешь связаться с Томом?"
        source: { kind: tatoeba, id: 2406001 }
      - pl: "Jak mogę się z tobą skontaktować?"
        ru: "Как я могу с тобой связаться?"
        source: { kind: translated, id: 585529 }
  - id: get-in-touch
    ru: "связаться, выйти на связь"
    examples:
      - pl: "Skontaktuj się z nim."
        ru: "Свяжись с ним."
        source: { kind: translated, id: 7180464 }
      - pl: "Skontaktuję się z tobą."
        ru: "Я с тобой свяжусь."
        source: { kind: tatoeba, id: 5291471 }
      - pl: "Skontaktujemy się z Tobą."
        ru: "Мы с тобой свяжемся."
        source: { kind: translated, id: 11432919 }
notes:
  - { kind: government, text: "Почти всегда с się и предлогом z с творительным: skontaktować się z kimś «связаться с кем-то»." }
  - { kind: usage, text: "Без się значит «свести двоих»: skontaktował mnie z lekarzem «он свёл меня с врачом»." }
  - { kind: usage, text: "Несовершенный вид — kontaktować (się); существительное kontakt — «контакт, связь»." }
  - { kind: usage, text: "Skontaktujemy się z Panem — стандартная формула в письмах и объявлениях: «Мы с Вами свяжемся»." }
collocations:
  - { pl: "skontaktować się z", ru: "связаться с" }
  - { pl: "skontaktujemy się", ru: "мы свяжемся" }
  - { pl: "trudno się skontaktować", ru: "трудно связаться" }
etymology: "Приставка s- + kontaktować, из латинского contactus «прикосновение, соприкосновение». Русское «контакт» и «сконтактировать» — то же заимствование, но по-русски привычнее «связаться»."
memory: "skontaktować się z kimś = «связаться с кем-то»: się обязательно, а предлог z требует творительного падежа. Несовершенный вид — kontaktować się. Формула из писем: Skontaktujemy się z Panem."
idioms:
  - { pl: "skontaktować się z", ru: "связаться с" }
  - { pl: "skontaktujemy się", ru: "мы свяжемся" }
  - { pl: "nie mogę się skontaktować", ru: "не могу дозвониться" }
