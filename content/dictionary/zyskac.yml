notes:
  - { kind: usage, text: "Это второй член пары, начатой карточкой TKWIĆ, и теперь контраст виден целиком. Общее ядро у двух глаголов одно и то же — сорок одна форма. Дальше ZYSKAĆ, совершенный и переходный, получает одиннадцать форм страдательного причастия (ZYSKANY, ZYSKANA, ZYSKANI и прочие) и деепричастие на -wszy: ZYSKAWSZY. Итого пятьдесят три. А TKWIĆ, несовершенный и непереходный, получил вместо этого действительное причастие и деепричастие на -ąc, итого пятьдесят две. Вид выбирает, какая из двух пар достанется глаголу; переходность решает, бывает ли вообще страдательное причастие." }
  - { kind: government, text: "Два управления дают два разных смысла, и путать их нельзя. ZYSKAĆ COŚ с винительным значит «приобрести, получить»: zyskać zaufanie, zyskać czas, zyskać dostęp, zyskać przewagę. ZYSKAĆ NA CZYMŚ с местным значит «выиграть от чего-то, выгадать»: zyskać na wymianie okien, akcje zyskały na wartości. Проверять просто: если есть предмет приобретения — винительный; если речь о выгоде от обстоятельства — na с местным." }
  - { kind: usage, text: "Русский разносит это по нескольким глаголам, и выбор зависит от предмета. ZYSKAĆ ZAUFANIE — «завоевать доверие», ZYSKAĆ CZAS — «выиграть время», ZYSKAĆ KLIENTÓW — «приобрести клиентов», ZYSKAĆ NA WARTOŚCI — «вырасти в цене». Одно польское слово на четыре русских, и ни одно из них не покрывает всё поле. Несовершенная пара — ZYSKIWAĆ, а естественный антоним — STRACIĆ «потерять», и пара zyskać/stracić в польском столь же обиходна, как русская «выиграть/проиграть»." }
collocations:
  - { pl: "zyskać czas", ru: "выиграть время" }
  - { pl: "zyskać zaufanie", ru: "завоевать доверие" }
  - { pl: "zyskać na wartości", ru: "вырасти в цене" }
family:
  - { pl: "zysk", ru: "прибыль, выгода", relation: root, id: zysk }
  - { pl: "zyskiwać", ru: "приобретать", relation: aspect }
  - { pl: "stracić", ru: "потерять", relation: antonym, id: stracic }
etymology: "От существительного ZYSK «прибыль, выгода». Корень связывают с гнездом глагола со значением «искать», откуда и русское «иск», «искать»: добытое есть то, что отыскано. Связь эта признаётся не всеми, поэтому привожу её как объяснение, а не как доказательство. Русский в этом значении своего однокоренного слова не держит и говорит «прибыль», «выгода», «нажива», так что zysk и zyskać приходится запоминать отдельно."
memory: "Пятьдесят три формы: совершенный и переходный, отсюда страдательное причастие и zyskawszy — против tkwić с его действительным и tkwiąc. Управление двойное: zyskać COŚ «приобрести», zyskać NA czymś «выиграть от»."
idioms:
  - { pl: "zyskać na czasie", ru: "выиграть время" }
  - { pl: "zyskać przewagę", ru: "получить преимущество" }
