notes:
  - { kind: false-friend, text: "Существительное PRASA отвечает русской «прессе», но глагол того же гнезда — настоящая ловушка. PRASOWAĆ значит «гладить утюгом»: PRASOWAĆ KOSZULĘ это «гладить рубашку», а не «прессовать» её. Образ один и тот же, давление, но языки развели применения. Запомните и то, что KONFERENCJA PRASOWA это «пресс-конференция»: русский сжал два слова в одно, поляк оставил оба." }
  - { kind: usage, text: "Все одиннадцать форм живые, и это отличает слово от большинства относительных прилагательных. Форма для мужчин-людей здесь есть и употребляется постоянно, потому что RZECZNIK PRASOWY — это человек, пресс-секретарь, а значит бывают и RZECZNICY PRASOWI. Так что пропускать эту форму, как у PODWODNY или RATUNKOWY, здесь нельзя." }
  - { kind: government, text: "На пресс-конференции — NA KONFERENCJI PRASOWEJ, местный падеж. В сообщении для печати — W KOMUNIKACIE PRASOWYM, тоже местный. Прилагательное стоит после существительного и порядок закреплён: KONFERENCJA PRASOWA, RZECZNIK PRASOWY, BIURO PRASOWE, NOTATKA PRASOWA. Дать пресс-конференцию по-польски — ZWOŁAĆ KONFERENCJĘ PRASOWĄ, буквально «созвать»." }
  - { kind: pronunciation, text: "Читается «прасо́вы», три слога, ударение на предпоследнем. Буква A в первом слоге даёт «а», и начало слова это «пра», без всякого смягчения. Конечная Y даёт «ы», поэтому слово кончается на «вы». В женском роде PRASOWA это «прасо́ва», в среднем PRASOWE — «прасо́вэ», а в форме для мужчин-людей PRASOWI — «прасо́ви»." }
  - { kind: register, text: "Слово официальное, из языка учреждений и редакций. Чаще всего слышно RZECZNIK PRASOWY «пресс-секретарь», KONFERENCJA PRASOWA, BIURO PRASOWE «пресс-служба», KOMUNIKAT PRASOWY «пресс-релиз». В школе и в армии бывает PRASÓWKA — обзор печати, слово разговорное и к обязанностям относящееся без восторга." }
collocations:
  - { pl: "rzecznik prasowy", ru: "пресс-секретарь" }
  - { pl: "biuro prasowe", ru: "пресс-служба" }
