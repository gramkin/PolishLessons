family:
  - { pl: "prasa", ru: "пресса, печать", relation: root, id: prasa }
  - { pl: "prasowac", ru: "гладить утюгом; прессовать", relation: root }
  - { pl: "prasowka", ru: "обзор печати", relation: derived }
etymology: "От PRASA, взятого из немецкого PRESSE, а то — из латинского глагола со значением «давить». Русская «пресса» пришла тем же путём, поэтому корень общий. Но польский построил на нём ещё и бытовой глагол PRASOWAĆ «гладить», потому что утюгом тоже давят, а русский в этом месте оставил своё «гладить» и отдал корню только технику: «пресс», «прессовать». Отсюда и ловушка."
memory: "Относится к прессе: konferencja prasowa «пресс-конференция», rzecznik prasowy «пресс-секретарь». Главная ловушка в гнезде — глагол prasowac, который значит «гладить утюгом», а не «прессовать»: prasowac koszule это «гладить рубашку». Читается «прасо́вы». И запомните, что здесь, в отличие от многих относительных прилагательных, форма для мужчин-людей живая: rzecznicy prasowi."
idioms:
  - { pl: "konferencja prasowa", ru: "пресс-конференция" }
