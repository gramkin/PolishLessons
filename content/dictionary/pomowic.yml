  - id: slander
    ru: "обвинить, оклеветать"
    examples:
      - pl: "Pomówiono go o kradzież."
        ru: "Его обвинили в краже."
        source: { kind: authored }
      - pl: "Pomówił sąsiada bez cienia dowodu."
        ru: "Он оклеветал соседа без тени доказательства."
        source: { kind: authored }
  - id: defamation
    ru: "pomówienie — клевета"
    examples:
      - pl: "Pomówienie jest ścigane z oskarżenia prywatnego."
        ru: "Клевета преследуется в порядке частного обвинения."
        source: { kind: authored }
      - pl: "Padła ofiarą pomówienia w sieci."
        ru: "Она пала жертвой клеветы в сети."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОДИН ГЛАГОЛ, ДВА СМЫСЛА, И ВТОРОЙ ОПАСЕН. Pomówić z kimś значит мирное «поговорить с кем-то», ровно как русское «поговорить». Но pomówić kogoś o coś значит «обвинить, оклеветать», а существительное pomówienie — это юридический термин «КЛЕВЕТА». Русского «помовения» не существует, догадаться не выйдет. Увидев pomówienie в газете или в суде, читайте «клевета», а не «беседа»." }
  - { kind: government, text: "Различает смыслы падеж, и только он. Разговор: pomówić Z kimś O czymś — творительный после z, предложный после o. Обвинение: pomówić KOGOŚ O coś — винительный лица и винительный после o. Предлог o в обоих случаях один и тот же, так что сравните: pomówić o sprawie «поговорить о деле» и pomówić o kradzież «обвинить в краже»." }
  - { kind: usage, text: "Вид совершенный. Несовершенная пара к первому смыслу — rozmawiać, ко второму — pomawiać. Страдательное причастие принадлежит только второму смыслу: pomówiony значит «оклеветанный», и «поговорённым» быть нельзя. Образовано оно по знакомому правилу: -ić даёт -ony, как poprawić даёт poprawiony." }
  - { kind: pronunciation, text: "ó звучит как у: «пому́виць», ударение на предпоследнем слоге. Корень здесь тот же, что в mówić «говорить», а mówić — это русское «молвить», потерявшее л: праславянское *mъlviti дало и «молвить», и mówić. Русская «молва» и польская mowa «речь» — такая же пара." }
collocations:
  - { pl: "pomówić w cztery oczy", ru: "поговорить с глазу на глаз" }
  - { pl: "pomówić kogoś o kradzież", ru: "обвинить кого-л. в краже" }
  - { pl: "ofiara pomówienia", ru: "жертва клеветы" }
family:
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
  - { pl: "mowa", ru: "речь", relation: derived, id: mowa }
  - { pl: "pomówienie", ru: "клевета", relation: derived }
  - { pl: "pomawiać", ru: "обвинять, клеветать", relation: aspect }
etymology: "Приставка po- плюс mówić «говорить», из праславянского *mъlviti. Русский сохранил л в «молвить» и «молве», польский его утратил, и вышли mówić и mowa. Второй смысл, «оклеветать», вырос из «наговорить на кого-то» — ровно как русские «наговорить» и «оговорить». Отсюда pomówienie «клевета», pomawiać и obmowa «пересуды»."
memory: "pomówić — это и «поговорить», и «оклеветать», а pomówienie значит «клевета». Различает их падеж: pomówić Z kimś O czymś — разговор, pomówić KOGOŚ O coś — обвинение. Корень же знакомый: mówić это «молвить» без л."
idioms:
