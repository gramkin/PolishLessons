  - id: guards
    ru: "во множественном — охрана, стража"
    examples:
      - pl: "Strażnicy pilnują, aby wszystkie drzwi w muzeum były zamknięte."
        ru: "Охранники следят, чтобы все двери в музее были закрыты."
        source: { kind: translated, id: 10202717 }
      - pl: "Kto pilnuje strażników?"
        ru: "Кто сторожит сторожей?"
        source: { kind: translated, id: 8166675 }
