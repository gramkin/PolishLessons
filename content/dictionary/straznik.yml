# review
id: straznik
format: 2
lemma: "strażnik"
rank: 1282
pos: noun
pron: { cyr: "стра́жник" }
senses:
  - id: guard
    ru: "охранник, сторож"
    examples:
      - pl: "Pracuje jako strażnik."
        ru: "Он работает охранником."
        source: { kind: translated, id: 12949551 }
