        ru: "Нам никогда не удастся обойти охрану."
        source: { kind: translated, id: 3865354 }
notes:
  - { kind: government, text: "«Работать охранником» — pracować jako strażnik, с jako и именительным. А «быть охранником» — być strażnikiem, творительный." }
  - { kind: usage, text: "Мужско-личное множественное — strażnicy, с чередованием k в c. Женская форма — strażniczka." }
  - { kind: usage, text: "Образовано от straż «стража, охрана»: straż pożarna «пожарная охрана», Straż Miejska «городская стража»." }
  - { kind: pronunciation, text: "ż звучит как «ж», и слово читается «стра́жник» — почти как русское «стражник»." }
collocations:
  - { pl: "nocny strażnik", ru: "ночной сторож" }
  - { pl: "pracować jako strażnik", ru: "работать охранником" }
  - { pl: "straż pożarna", ru: "пожарная охрана" }
etymology: "От straż «стража», из праславянского *storža. Русские «стража» и «сторож» — то же слово, только с полногласием -оро-."
memory: "strażnik — «охранник, сторож», от straż «стража». Русское «сторож» — то же слово, только с полногласием. Множественное мужско-личное — strażnicy, с чередованием k в c."
