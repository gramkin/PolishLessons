# review
id: straznik
format: 2
lemma: "strażnik"
rank: 1252
pos: noun
pron: { cyr: "стра́жник" }
senses:
  - id: guard
    ru: "охранник, сторож"
    examples:
      - pl: "Pracuje jako strażnik."
        ru: "Он работает охранником."
        source: { kind: translated, id: 12949551 }
      - pl: "Nocny strażnik nie słyszał złodziei."
        ru: "Ночной сторож не слышал воров."
        source: { kind: translated, id: 2265127 }
      - pl: "Tom jest strażnikiem."
        ru: "Том — охранник."
        source: { kind: translated, id: 3032306 }
  - id: guards
    ru: "во множественном — охрана, стража"
    examples:
      - pl: "Strażnicy pilnują, aby wszystkie drzwi w muzeum były zamknięte."
        ru: "Охранники следят, чтобы все двери в музее были закрыты."
        source: { kind: translated, id: 10202717 }
      - pl: "Kto pilnuje strażników?"
        ru: "Кто сторожит сторожей?"
        source: { kind: translated, id: 8166675 }
      - pl: "Nigdy nie będziemy w stanie ominąć strażników."
        ru: "Нам никогда не удастся обойти охрану."
        source: { kind: translated, id: 3865354 }
notes:
  - { kind: government, text: "«Работать охранником» — pracować jako strażnik, с jako и именительным. А «быть охранником» — być strażnikiem, творительный." }
  - { kind: usage, text: "Мужско-личное множественное — strażnicy, с чередованием k в c. Женская форма — strażniczka." }
  - { kind: usage, text: "Образовано от straż «стража, охрана»: straż pożarna «пожарная охрана», Straż Miejska «городская стража»." }
  - { kind: pronunciation, text: "ż звучит как «ж», и слово читается «стра́жник» — почти как русское «стражник»." }
collocations:
  - { pl: "nocny strażnik", ru: "ночной сторож" }
  - { pl: "pracować jako strażnik", ru: "работать охранником" }
  - { pl: "straż pożarna", ru: "пожарная охрана" }
etymology: "От straż «стража», из праславянского *storža. Русские «стража» и «сторож» — то же слово, только с полногласием -оро-."
memory: "strażnik — «охранник, сторож», от straż «стража». Русское «сторож» — то же слово, только с полногласием. Множественное мужско-личное — strażnicy, с чередованием k в c."
idioms:
  - { pl: "nocny strażnik", ru: "ночной сторож" }
  - { pl: "straż pożarna", ru: "пожарная охрана" }
  - { pl: "strażnik więzienny", ru: "тюремный надзиратель" }
formExamplesSkip:
  - { form: "strażniku", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
