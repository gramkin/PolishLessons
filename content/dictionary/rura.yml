notes:
  - { kind: false-friend, text: "Русского родственника у этого слова нет, и это как раз полезно знать: RURA пришла из немецкого, а русская «труба» — из совсем другого источника. Поэтому угадать слово не получится, его надо выучить. Зато производные прозрачны: RURKA «трубочка», в том числе пирожное, RUROCIĄG «трубопровод» — буквально «трубо-тяг», по той же модели, что русское слово. А вот «труба» как музыкальный инструмент по-польски TRĄBA, и это слово как раз русскому родственно: TRĄBA и «труба» — одно и то же, с польской носовой на месте русского У." }
  - { kind: pronunciation, text: "Читается «ру́ра», ударение на первом слоге из двух. Главное в карточке — местный и дательный падеж RURZE: там R переходит в RZ и звучит «ж», то есть «ру́же». Это сквозное польское чередование перед окончанием -E: SIOSTRA и SIOSTRZE, GÓRA и GÓRZE, WIARA и WIERZE. Для русского это самое неожиданное из всех чередований, потому что русский в этих словах ничего не меняет: «сестре», «горе». Проговорить стоит парами: RURA — RURZE, SIOSTRA — SIOSTRZE." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: WYMIENILI RURĘ. Назначение вводится предлогом DO с родительным: RURA DO WODY «труба для воды». Движение сквозь — PRZEZ с винительным: PRZEZ RURĘ. Содержимое или материал — Z с родительным: RURA Z MIEDZI «труба из меди». При отрицании винительный уходит в родительный: NIE WYMIENILI RURY. Устойчивое RURA WYDECHOWA «выхлопная труба» согласуется как обычное прилагательное." }
  - { kind: usage, text: "Основное значение бытовое и техническое: водопроводная, газовая, канализационная труба. В разговоре слово попало и в мир автомобилей: RURA WYDECHOWA, и в кулинарию: RURKI Z KREMEM «трубочки с кремом». Переносных значений у слова мало, и это редкость для такого частого существительного. Обратите внимание, что печную трубу на крыше называют не RURA, а KOMIN, и телефонную трубку — SŁUCHAWKA, так что круг употребления уже, чем у русской «трубы»." }
