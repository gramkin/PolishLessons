etymology: "Из немецкого ROHR «труба, тростник», заимствованное в позднем средневековье вместе с ремеслом водопроводчика; то же слово стоит за немецким ROHRE и за фамилией Rohr. Русская «труба» пришла другим путём, из германского TRUMBA через значение «рог, духовой инструмент», и потому родственна польскому TRĄBA, а не RURA. Получается любопытная развязка: польский назвал водопроводную трубу немецким словом, а музыкальную — старым общеславянским, и два понятия, которые русский держит под одним словом, в польском разошлись по разным корням. Для памяти это удобно: RURA — только то, по чему течёт, TRĄBA — то, во что дуют."
memory: "Из немецкого Rohr, русского родственника нет — учить как новое. Музыкальная труба — trąba, и вот она русской «трубе» родня. Печная труба — komin, телефонная трубка — słuchawka. В дательном и местном r переходит в rz: w rurze «в ру́же», как siostra и siostrze."
