# review
id: wypadek
format: 2
lemma: "wypadek"
rank: 437
pos: noun
pron: { cyr: "выпа́дэк" }
senses:
  - id: accident
    ru: "авария, несчастный случай"
    examples:
      - pl: "Wypadek zdarzył się nagle."
        ru: "Авария произошла внезапно."
        source: { kind: tatoeba, id: 2995884 }
      - pl: "Dick miał wypadek samochodowy."
        ru: "Дик попал в ДТП."
        source: { kind: tatoeba, id: 361291 }
      - pl: "Jeśli nie będziesz jechać uważniej, będzie wypadek."
        ru: "Если не будешь ехать внимательнее, попадёшь в аварию."
        source: { kind: tatoeba, id: 350150 }
  - id: case
    ru: "случай (в устойчивых оборотах)"
    examples:
      - pl: "W żadnym wypadku."
        ru: "Ни в коем случае."
        source: { kind: tatoeba, id: 3363038 }
      - pl: "W nagłych wypadkach, zadzwoń 119."
        ru: "В экстренных случаях звоните 119."
        source: { kind: translated, id: 5336552 }
      - pl: "Na wszelki wypadek weź parasol."
        ru: "На всякий случай возьми зонт."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения: «авария, несчастный случай» (wypadek samochodowy «ДТП») и просто «случай» (w żadnym wypadku «ни в коем случае»)." }
  - { kind: usage, text: "na wszelki wypadek — «на всякий случай»; w razie wypadku — «в случае аварии»." }
  - { kind: usage, text: "Слово буквально значит «то, что выпало»: wy- + padać «падать». Русское «случай» от «случиться» устроено по той же логике." }
  - { kind: usage, text: "mieć wypadek — «попасть в аварию»: Dick miał wypadek samochodowy «Дик попал в ДТП»." }
collocations:
  - { pl: "wypadek samochodowy", ru: "ДТП" }
  - { pl: "w żadnym wypadku", ru: "ни в коем случае" }
  - { pl: "na wszelki wypadek", ru: "на всякий случай" }
  - { pl: "mieć wypadek", ru: "попасть в аварию" }
etymology: "От wypaść «выпасть», из wy- + paść «падать»: wypadek — это буквально «то, что выпало, случилось». Русское «случай» от «случиться» построено по той же логике."
memory: "wypadek — и «авария», и «случай». Слово буквально значит «то, что выпало»: wy- + padać. Отсюда две готовые формулы: w żadnym wypadku «ни в коем случае» и na wszelki wypadek «на всякий случай»."
idioms:
  - { pl: "w żadnym wypadku", ru: "ни в коем случае" }
  - { pl: "na wszelki wypadek", ru: "на всякий случай" }
  - { pl: "wypadek samochodowy", ru: "ДТП" }
