notes:
  - { kind: false-friend, text: "Значение то же, что у русской «капли», но слова построены от разных корней, и самое любопытное, что каждый язык выбрал корень, свободно живущий в другом. Польское KROPLA идёт от KROPIĆ «кропить, брызгать» — глагол, который русский прекрасно знает: «кропить», «окропить», «кропление». Русская «капля» идёт от «капать» — глагола, который столь же жив в польском: KAPAĆ «капать», KAPIE Z KRANU «капает из крана». То есть оба корня есть в обоих языках, но существительное каждый построил от своего. Поэтому догадаться о слове нельзя, а объяснить его — легко." }
  - { kind: usage, text: "Десять форм, женский род, мягкая основа на -L. Форма KROPLI несёт сразу три падежа единственного числа — родительный, дательный и местный: BEZ KROPLI, W KROPLI, и это то же тройное совмещение, что у OWCY. Именительный и винительный множественного — KROPLE. Родительный множественного — KROPEL, где между P и L появляется беглое E: иначе на конце слова столкнулись бы три согласных. Во множественном числе слово получает отдельное значение «капли» как лекарство, и там оно употребляется только во множественном: KROPLE DO OCZU, KROPLE NA KASZEL." }
  - { kind: pronunciation, text: "Читается «кро́пля», два слога, ударение на первом. Польское L перед A звучит мягче русского «л», но транскрипция передаёт его как «ль» только перед I. В форме KROPLI сочетание LI даёт «ли» с отчётливо мягким L: «кро́пли». В форме KROPLĘ конечное Ę читается как чистое «э»: «кро́плэ». В форме KROPLĄ последнее Ą звучит «он»: «кро́плон». В форме KROPEL ударение падает на первый слог, а беглое E произносится отчётливо: «кро́пэль»." }
  - { kind: register, text: "Слово нейтральное во всех значениях. Пословица KROPLA DRĄŻY KAMIEŃ отвечает русскому «капля камень точит» и употребляется так же часто. Устойчивое KROPLA W MORZU — «капля в море», о ничтожно малой доле. Оборот OSTATNIA KROPLA, то есть последняя капля, переполнившая чашу, в польском существует в полной форме TO BYŁA OSTATNIA KROPLA. В аптеке слово всегда во множественном: KROPLE DO NOSA, KROPLE NASERCOWE. Уменьшительное KROPELKA ласковое и частое в разговоре с детьми." }
