etymology: "От глагола KROPIĆ «кропить, брызгать», праславянское *kropiti, звукоподражательное по происхождению — оно передавало звук падающих брызг. Русский сохранил этот глагол полностью: «кропить», «окропить», «кропление» живы и понятны, но существительное от него русский не образовал. Вместо этого он взял корень *kap-, давший «капать» и «каплю». Польский поступил зеркально: KAPAĆ «капать» у него тоже есть и употребляется постоянно, но название самой капли он построил от KROPIĆ. Так два языка разделили между собой два звукоподражательных корня, и разделили случайно: никакого смыслового различия между ними нет. Уменьшительное KROPELKA образовано от основы с беглым E, той же, что в родительном множественном KROPEL."
memory: "Корни оба знакомы, но языки поменялись ими: польское kropla от kropić — глагола, живого и в русском («кропить, окропить»), а русская «капля» от «капать», и kapać столь же живо в польском. Форма kropli делает три падежа сразу: родительный, дательный и местный единственного. Родительный множественного kropel с беглым e. Во множественном отдельное значение — лекарство: krople do oczu. Пословица та же: kropla drąży kamień."
