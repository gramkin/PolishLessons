# review
id: tlic
format: 2
lemma: "tlić"
rank: 5944
pos: verb
aspect: imperf
pron: { cyr: "тли́ць" }
senses:
  - id: smoulder
    ru: "тлеть (гореть без пламени)"
    examples:
      - pl: "W kominku jeszcze tlą się węgle."
        ru: "В камине ещё тлеют угли."
        source: { kind: authored }
      - pl: "Na ziemi tlił się niedopałek papierosa."
        ru: "На земле тлел окурок."
        source: { kind: authored }
      - pl: "Ognisko tliło się aż do rana."
        ru: "Костёр тлел до самого утра."
        source: { kind: authored }
  - id: linger
    ru: "теплиться (о надежде, чувстве, жизни)"
    examples:
      - pl: "W sercu wciąż tli się nadzieja."
        ru: "В сердце всё ещё теплится надежда."
        source: { kind: authored }
      - pl: "Między nimi tliła się dawna niechęć."
        ru: "Между ними тлела давняя неприязнь."
        source: { kind: authored }
      - pl: "Życie ledwo się w nim tliło."
        ru: "Жизнь в нём едва теплилась."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Почти всегда с SIĘ: TLIĆ SIĘ — «тлеть, теплиться». Несовершенный вид, парного совершенного нет. Подлежащее — огонь, угли, сигарета или чувство, поэтому живут только формы 3-го лица: WĘGIEL SIĘ TLI, NADZIEJA SIĘ TLIŁA. Форм «я тлею», «тлей!» в карточке нет." }
  - { kind: false-friend, text: "Русское «тлеть» значит ещё и «гнить, истлевать» (тление, тлен). Польское TLIĆ SIĘ — только «гореть без пламени» и переносно «теплиться». Гниение — BUTWIEĆ, ROZKŁADAĆ SIĘ. И не путайте с TLEN — «кислород»: это другое слово." }
  - { kind: pronunciation, text: "Читается «тли́ць»: L перед гласной — мягкое «ль», конечное Ć — «ць». Носовое в формах читается по общему правилу: TLĄ — «тлоу̃», причастие TLĄCY — «тло́нцы»." }
collocations:
  - { pl: "tlić się w popiele", ru: "тлеть в золе" }
  - { pl: "tląca się nadzieja", ru: "теплящаяся надежда" }
  - { pl: "tlący się konflikt", ru: "тлеющий конфликт" }
family:
  - { pl: "tlenie się", ru: "тление (горение без пламени)", relation: derived }
  - { pl: "roztlić", ru: "раздуть тлеющий огонь", relation: derived }
  - { pl: "żarzyć się", ru: "тлеть, светиться жаром", relation: root }
  - { pl: "dymić", ru: "дымить", relation: root }
etymology: "Общеславянское слово, родственное русскому «тлеть» и чешскому doutnat в значении «тлеть»."
memory: "Tli się — тлеет: в tlić слышно русское «тлеть», но без гниения — только угли и надежда."
idioms:
  - { pl: "życie ledwo się w kimś tli", ru: "жизнь в ком-то еле теплится" }
  - { pl: "tląca się iskierka nadziei", ru: "теплящаяся искорка надежды" }
