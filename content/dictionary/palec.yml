# review
id: palec
format: 2
lemma: "palec"
rank: 750
pos: noun
pron: { cyr: "па́лец" }
senses:
  - id: finger
    ru: "палец (на руке)"
    examples:
      - pl: "Nasza córka poparzyła sobie palec zapałką."
        ru: "Наша дочь обожгла палец спичкой."
        source: { kind: tatoeba, id: 5097457 }
      - pl: "Jego palec krwawi."
        ru: "У него кровоточит палец."
        source: { kind: translated, id: 2216999 }
      - pl: "Spuchł mi mały palec."
        ru: "У меня распух мизинец."
        source: { kind: translated, id: 744212 }
  - id: toe
    ru: "palec u nogi — палец на ноге"
    note: "На ноге палец уточняют, иначе поймут «на руке»."
    examples:
      - pl: "Z łatwością mogę dotknąć palców stóp."
        ru: "Я легко могу достать до пальцев ног."
        source: { kind: tatoeba, id: 6306751 }
      - pl: "Mogę z łatwością dotknąć moich palców u stóp."
        ru: "Я легко достаю до пальцев ног."
        source: { kind: translated, id: 1313365 }
      - pl: "Uderzyłem się w palec u nogi."
        ru: "Я ударился пальцем ноги."
        source: { kind: authored }
  - id: wrap
    ru: "owinąć wokół palca — обвести вокруг пальца"
    examples:
      - pl: "Ma go owiniętego wokół palca."
        ru: "Она обвела его вокруг пальца."
        source: { kind: translated, id: 524965 }
      - pl: "Mam to w małym palcu."
        ru: "Я знаю это как свои пять пальцев."
        source: { kind: authored }
      - pl: "Nie kiwnął palcem, żeby pomóc."
        ru: "Он палец о палец не ударил, чтобы помочь."
        source: { kind: authored }
  - id: tiptoe
    ru: "na palcach — на цыпочках"
    examples:
      - pl: "Wszedłem na palcach do sypialni."
        ru: "Я на цыпочках вошёл в спальню."
        source: { kind: translated, id: 917740 }
      - pl: "Nie musisz chodzić wokół mnie na palcach."
        ru: "Тебе не нужно ходить вокруг меня на цыпочках."
        source: { kind: translated, id: 13655245 }
      - pl: "Nie mam czucia w palcach."
        ru: "Я не чувствую пальцев."
        source: { kind: translated, id: 349470 }
notes:
  - { kind: usage, text: "Беглое e, как в budynek: гласная живёт только в именительном. Palec, но palca, palcem, pięć palców." }
  - { kind: usage, text: "palec — и палец руки, и палец ноги; последний уточняют: palec u nogi. А большой палец руки — отдельное слово, kciuk, в отличие от русского «большой палец»." }
  - { kind: usage, text: "Идиомы переносятся почти дословно: owinąć kogoś wokół palca «обвести вокруг пальца», mieć coś w małym palcu «знать как свои пять пальцев», palce lizać «пальчики оближешь», nie kiwnąć palcem «палец о палец не ударить»." }
  - { kind: false-friend, text: "Не путайте palce «пальцы» с czucie: Nie mam czucia w palcach — «я не чувствую пальцев», речь об ощущении, а не о самих пальцах." }
collocations:
  - { pl: "palec u nogi", ru: "палец на ноге" }
  - { pl: "odciski palców", ru: "отпечатки пальцев" }
  - { pl: "na palcach", ru: "на цыпочках" }
  - { pl: "pstrykać palcami", ru: "щёлкать пальцами" }
family:
  - { pl: "kciuk", ru: "большой палец руки", relation: root }
  - { pl: "paznokieć", ru: "ноготь", relation: root }
  - { pl: "dłoń", ru: "ладонь", relation: root }
etymology: "Праславянское *palьcь — то же самое слово, что русский «палец»."
memory: "palec — «палец», слово то же самое, и беглое e работает как в budynek: palec, но palca, palcem, pięć palców. Большой палец руки — отдельное слово kciuk. А идиомы переносятся почти дословно: owinąć wokół palca «обвести вокруг пальца», mieć w małym palcu «знать как свои пять пальцев», palce lizać «пальчики оближешь»."
idioms:
  - { pl: "owinąć kogoś wokół palca", ru: "обвести вокруг пальца" }
  - { pl: "mieć coś w małym palcu", ru: "знать как свои пять пальцев" }
  - { pl: "palce lizać", ru: "пальчики оближешь" }
