# review
id: zdechnac
format: 2
lemma: "zdechnąć"
rank: 4964
pos: verb
pron: { cyr: "здэ́хнонць" }
senses:
  - id: die-animal
    ru: "сдохнуть, издохнуть (о животном)"
    examples:
      - pl: "Pies zdechł ze starości."
        ru: "Собака сдохла от старости."
        source: { kind: authored }
      - pl: "Ryby zdechły w brudnej wodzie."
        ru: "Рыбы сдохли в грязной воде."
        source: { kind: authored }
      - pl: "Bez wody krowa zdechnie."
        ru: "Без воды корова сдохнет."
        source: { kind: authored }
  - id: die-rude
    ru: "сдохнуть (грубо о человеке); сломаться (о технике, разг.)"
    examples:
      - pl: "Zdechł mi telefon."
        ru: "У меня сдох телефон."
        source: { kind: authored }
      - pl: "Zaraz zdechnę z gorąca."
        ru: "Я сейчас сдохну от жары."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZDECHNĄĆ — «сдохнуть», совпадение почти полное, включая грубость. О человеке это оскорбление или грубая шутка: ZDECHNIJ! — «сдохни!». О животных — обычное слово: умирает человек (UMRZEĆ), а животное ZDYCHA или PADA. Вежливо о питомце говорят ODEJŚĆ или UMRZEĆ." }
  - { kind: usage, text: "Тридцать пять форм. Прошедшее без -NĄ-: ZDECHŁ, ZDECHŁA, ZDECHLI. Безличное ZDECHNIĘTO, отглагольное ZDECHNIĘCIE, деепричастие ZDECHŁSZY и форма ZDECHNIJMY не употребляются и в карточку не включены. Несовершенный вид — ZDYCHAĆ." }
  - { kind: government, text: "От чего — Z с родительным: ZDECHNĄĆ Z GŁODU, Z NUDÓW. У кого (о вещи) — дательный: ZDECHŁ MI AKUMULATOR «у меня сел аккумулятор»." }
  - { kind: pronunciation, text: "Читается «здэ́хнонць»: CH — «х», ĄĆ — «онць». В прошедшем ZDECHŁ — «здэх»: конечное Ł после согласного обычно не слышно; ZDECHŁA — «здэ́хуа»." }
  - { kind: register, text: "О животных — нейтральное; о людях — грубое и оскорбительное. В шутку о себе — разговорное: ZDECHNĘ Z NUDÓW «помру со скуки». О технике — сленг: BATERIA ZDECHŁA." }
collocations:
  - { pl: "zdechnąć z głodu", ru: "сдохнуть с голоду" }
  - { pl: "zdechnąć z nudów", ru: "помереть со скуки" }
  - { pl: "zdechł akumulator", ru: "сел аккумулятор" }
family:
  - { pl: "zdychać", ru: "дохнуть, издыхать", relation: aspect }
  - { pl: "dech", ru: "дыхание", relation: root, id: dech }
  - { pl: "oddech", ru: "дыхание, вдох", relation: root, id: oddech }
etymology: "От праславянского *dъchnǫti «дохнуть, выдохнуть» с приставкой ZE-: буквально «выдохнуть последний раз». Тот же корень в DECH «дыхание» и русских «дохнуть», «сдохнуть», «дыхание»."
memory: "Zdechnąć — сдохнуть: pies zdechł. Корень dech «дыхание» — последний выдох. О человеке — грубо, о телефоне — сленг: zdechł mi telefon."
idioms:
  - { pl: "zdechł pies", ru: "дело кончено, пиши пропало (букв. «собака сдохла»)" }
