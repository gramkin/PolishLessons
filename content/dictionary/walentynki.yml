notes:
  - { kind: false-friend, text: "WALENTYNKI — и «День святого Валентина», и сами открытки-валентинки. Праздник — только во множественном: NA WALENTYNKI, «на Валентинов день». Одна открытка — WALENTYNKA, но это уже отдельная форма единственного числа." }
  - { kind: usage, text: "В значении праздника — только множественное число: пять форм WALENTYNKI, WALENTYNEK, WALENTYNKOM, WALENTYNKAMI, WALENTYNKACH. Родительный — WALENTYNEK, с беглым E." }
