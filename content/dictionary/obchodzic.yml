# review
id: obchodzic
format: 2
lemma: "obchodzić"
rank: 547
pos: verb
aspect: imperf
pron: { cyr: "обхо́дзиць" }
senses:
  - id: celebrate
    ru: "отмечать, праздновать"
    note: "obchodzić urodziny «отмечать день рождения», obchodzić święto «отмечать праздник»."
    examples:
      - pl: "W Indiach Dzień Republiki obchodzi się 26 stycznia."
        ru: "В Индии День республики празднуется 26 января."
        source: { kind: tatoeba, id: 952117 }
      - pl: "Obchodzę urodziny dwudziestego drugiego marca."
        ru: "Я отмечаю день рождения двадцать второго марта."
        source: { kind: translated, id: 7881656 }
      - pl: "14 lutego Amerykanie obchodzą Walentynki."
        ru: "14 февраля американцы отмечают День святого Валентина."
        source: { kind: translated, id: 841691 }
  - id: concern
    ru: "Kogo to obchodzi? — кого это волнует?"
    note: "Безлично: подлежащее — to, а лицо стоит в винительном: nic mnie to nie obchodzi."
    examples:
      - pl: "Kogo to obchodzi?"
        ru: "Кого это волнует?"
        source: { kind: translated, id: 5627104 }
      - pl: "Nikogo to nie będzie obchodzić."
        ru: "Это никого не будет волновать."
        source: { kind: translated, id: 3750051 }
      - pl: "Moje poglądy mało kogo w firmie obchodzą."
        ru: "Мои взгляды мало кого в фирме волнуют."
        source: { kind: translated, id: 840302 }
  - id: handle
    ru: "obchodzić się z czymś — обращаться с чем-л.; obchodzić przepisy — обходить правила"
    note: "С się и творительным падежом: obchodzić się ostrożnie z czymś."
    examples:
      - pl: "Musimy obchodzić się z tym ostrożnie."
        ru: "Мы должны обращаться с этим осторожно."
        source: { kind: translated, id: 758289 }
      - pl: "Obchodź się ze szklankami ostrożnie."
        ru: "Обращайся со стаканами осторожно."
        source: { kind: translated, id: 355553 }
      - pl: "Ona umie obchodzić przepisy."
        ru: "Она умеет обходить правила."
        source: { kind: translated, id: 358953 }
notes:
  - { kind: usage, text: "Три расходящихся значения: obchodzić urodziny «отмечать», Kogo to obchodzi? «кого это волнует», obchodzić przepisy «обходить правила»." }
  - { kind: government, text: "В значении «волновать» глагол безличный: подлежащее — to, а человек стоит в винительном: nic mnie to nie obchodzi «меня это совсем не волнует»." }
  - { kind: government, text: "obchodzić się z czymś «обращаться с чем-либо» требует się и творительного падежа: obchodź się ostrożnie ze szklankami." }
  - { kind: usage, text: "Совершенный вид зависит от значения: obejść przepisy «обойти правила», но для «отмечать» пары нет — говорят просто obchodzić." }
collocations:
  - { pl: "obchodzić urodziny", ru: "отмечать день рождения" }
  - { pl: "Kogo to obchodzi?", ru: "Кого это волнует?" }
  - { pl: "obchodzić się z czymś", ru: "обращаться с чем-либо" }
  - { pl: "obchodzić przepisy", ru: "обходить правила" }
family:
  - { pl: "chodzić", ru: "ходить", relation: root }
  - { pl: "obejść", ru: "обойти", relation: derived }
  - { pl: "obchody", ru: "торжества", relation: derived }
etymology: "Приставка ob- плюс chodzić «ходить», от праславянского *choditi — буквально «обходить». Значение «отмечать» выросло из обрядового обхода, а «волновать» — из «касаться, иметь отношение»."
memory: "obchodzić — один глагол с тремя расходящимися значениями. Первое: obchodzić urodziny «отмечать день рождения». Второе — безличное: Kogo to obchodzi? «Кого это волнует?», nic mnie to nie obchodzi «меня это совсем не волнует», где лицо стоит в винительном. Третье: obchodzić przepisy «обходить правила» и obchodzić się z czymś «обращаться с чем-либо» — с się и творительным."
idioms:
  - { pl: "obchodzić urodziny", ru: "отмечать день рождения" }
  - { pl: "Kogo to obchodzi?", ru: "Кого это волнует?" }
  - { pl: "obchodzić się z czymś", ru: "обращаться с чем-либо" }
