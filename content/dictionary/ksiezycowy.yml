        ru: "Лунный месяц короче солнечного."
        source: { kind: translated, id: 351999 }
      - pl: "Ciastko księżycowe to rodzaj chińskiej przekąski."
        ru: "Лунный пряник — это род китайского лакомства."
        source: { kind: translated, id: 2838376 }
notes:
  - { kind: usage, text: "Два круга: поэтический «лунный» о ночи и свете, и терминологический — miesiąc księżycowy «лунный месяц», kalendarz księżycowy «лунный календарь»." }
  - { kind: false-friend, text: "Корень księżyc «луна», который буквально значит «сын князя»: księżyc — уменьшительное от książę. Русское «месяц» такой истории не имеет." }
  - { kind: government, text: "Обычное прилагательное на -y." }
  - { kind: usage, text: "ciastko księżycowe «лунный пряник» — китайская выпечка, калька с английского." }
