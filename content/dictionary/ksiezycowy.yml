# review
id: ksiezycowy
format: 2
lemma: "księżycowy"
rank: 2293
pos: adj
pron: { cyr: "ксьенжыцо́вы" }
senses:
  - id: moonlit
    ru: "лунный (о ночи, свете)"
    examples:
      - pl: "Była to księżycowa noc."
        ru: "Та ночь была лунной."
        source: { kind: tatoeba, id: 923136 }
      - pl: "Inne leśne zwierzęta przyszły oglądać weselne tańce, a wkrótce i one ruszyły w tan w księżycową noc."
        ru: "Другие лесные звери пришли смотреть свадебные танцы, а вскоре и сами пустились в пляс в лунную ночь."
        source: { kind: translated, id: 358043 }
      - pl: "Księżycowy blask padał na wodę."
        ru: "Лунный свет падал на воду."
        source: { kind: authored }
  - id: lunar
    ru: "лунный (астрономический, календарный)"
    examples:
      - pl: "Miesiąc księżycowy jest krótszy od słonecznego."
        ru: "Лунный месяц короче солнечного."
        source: { kind: translated, id: 351999 }
      - pl: "Ciastko księżycowe to rodzaj chińskiej przekąski."
        ru: "Лунный пряник — это род китайского лакомства."
        source: { kind: translated, id: 2838376 }
notes:
  - { kind: usage, text: "Два круга: поэтический «лунный» о ночи и свете, и терминологический — miesiąc księżycowy «лунный месяц», kalendarz księżycowy «лунный календарь»." }
  - { kind: false-friend, text: "Корень księżyc «луна», который буквально значит «сын князя»: księżyc — уменьшительное от książę. Русское «месяц» такой истории не имеет." }
  - { kind: government, text: "Обычное прилагательное на -y." }
  - { kind: usage, text: "ciastko księżycowe «лунный пряник» — китайская выпечка, калька с английского." }
collocations:
  - { pl: "miesiąc księżycowy", ru: "лунный месяц" }
  - { pl: "księżycowa noc", ru: "лунная ночь" }
etymology: "От księżyc «луна», уменьшительного от książę «князь»: луна как «сын» солнца-князя."
memory: "księżycowy — «лунный». Корень księżyc буквально значит «княжич»: луна мыслилась сыном солнца. Запомните miesiąc księżycowy."
idioms:
  - { pl: "miesiąc księżycowy", ru: "лунный месяц" }
formExamplesSkip:
  - { form: "księżycowi", reason: "мужско-личная форма множественного числа, а księżycowy говорится о свете, ночи, фазе или календаре: światło księżycowe, kalendarz księżycowy. О людях так не говорят, поэтому этой формы в текстах нет" }
