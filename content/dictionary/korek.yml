notes:
  - { kind: false-friend, text: "Редкий случай, когда ловушки нет вовсе, и это стоит заметить отдельно. Русская «пробка» и польский KOREK покрывают ровно одни и те же три предмета: затычку в бутылке, затор на дороге и плавкий предохранитель в щитке. Два языка независимо проделали один и тот же перенос значения, и потому любое русское выражение с «пробкой» переводится буквально: STAĆ W KORKU «стоять в пробке», WYSKOCZYŁ KOREK «вылетела пробка», KORKI WYSIADŁY «пробки вылетели». Различаются только сами слова: русское от «пробивать», польское от названия коры пробкового дуба." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E исчезает во всех косвенных формах: KOREK, но KORKA, KORKOWI, KORKIEM, KORKU — как в PASEK и OŚRODEK. Местный единственного — KORKU, с окончанием -U, потому что основа кончается на заднеязычный K. Винительный равен именительному. Родительный множественного — KORKÓW. В значении затора слово чаще стоит во множественном, когда речь об обычном положении дел: W TYM MIEŚCIE SĄ KORKI; в единственном — о конкретном заторе здесь и сейчас." }
  - { kind: pronunciation, text: "Читается «ко́рэк», два слога, ударение на первом. Буква E даёт чистое «э» без смягчения предыдущего согласного, поэтому второй слог звучит «рэк», а не «рек». Конечное K твёрдое и глухое. В косвенных формах беглое E пропадает: KORKA звучит «ко́рка», KORKIEM — «ко́ркем», KORKU — «ко́рку». В форме KORKÓW буква Ó читается как «у», а конечное W оглушается: «ко́ркуф»." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Устойчивые сочетания: STAĆ W KORKU, WPAŚĆ W KOREK «попасть в пробку», KOREK DO BUTELKI, KOREK TOPIKOWY «плавкий предохранитель». Уменьшительное KORECZEK в кулинарии означает закуску на шпажке, и это значение совершенно отдельное. Прилагательное KORKOWY относится к материалу: PODŁOGA KORKOWA «пробковый пол», KORKOWA MATA. В разговоре о дороге слово звучит без всякой эмоции: пробки в польских городах обсуждают так же буднично, как погоду." }
