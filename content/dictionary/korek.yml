etymology: "Из немецкого KORK, а то — через испанское CORCHO из латинского CORTEX «кора»: пробку делают из коры пробкового дуба, и название предмета есть название материала. Самое любопытное здесь то, что латинское CORTEX и славянское «кора» — слова родственные, оба от индоевропейского корня со значением «резать, отделять», того же, что в «кожуре» и в «скорлупе». Получается, что слово вернулось к славянам в чужой одежде: польский KOREK и польская KORA идут от одного древнего корня, но первое пришло кружным путём через Испанию и Германию, а второе стояло на месте. Русская «пробка», напротив, своя и построена от «пробить», то есть названа по действию, а не по материалу."
memory: "Ловушки нет: русская «пробка» и польский korek значат одно и то же во всех трёх смыслах — затычка, затор на дороге, предохранитель. Два языка сделали один и тот же перенос независимо. Слово от латинского cortex «кора» через немецкий, а cortex и славянская «кора» — дальняя родня, так что корень вернулся домой кружным путём. Беглое e пропадает: korek, но korka; местный korku на -u."
idioms:
  - { pl: "stać w korku", ru: "стоять в пробке" }
