        ru: "Он занимается в спортзале, чтобы улучшить рельеф мышц."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "RZEŹBA — «скульптура», а не «резьба». Резьба по дереву — SNYCERKA или RZEŹBIENIE W DREWNIE, резьба винта — GWINT. Не путать и с RZEŹ «резня, бойня»." }
  - { kind: usage, text: "Девять живых форм, женский род. В дательном и предложном B смягчается: W RZEŹBIE. Родительный множественного — RZEŹB. Звательный RZEŹBO не употребляется. Скульптор — RZEŹBIARZ, ваять — RZEŹBIĆ." }
  - { kind: pronunciation, text: "Читается «жэ́зьба»: RZ — «ж», Ź — мягкое «зь». Ударение на первом слоге." }
collocations:
  - { pl: "rzeźba z brązu", ru: "бронзовая скульптура" }
  - { pl: "rzeźba terenu", ru: "рельеф местности" }
  - { pl: "studiować rzeźbę", ru: "изучать скульптуру" }
family:
  - { pl: "rzeźbić", ru: "ваять, вырезать", relation: derived }
  - { pl: "rzeźbiarz", ru: "скульптор", relation: derived }
  - { pl: "płaskorzeźba", ru: "барельеф", relation: derived }
  - { pl: "sztuka", ru: "искусство", relation: root, id: sztuka }
etymology: "От глагола RZEZAĆ «резать» с суффиксом -BA. Корень тот же, что в русском «резать», но польское слово стало значить «скульптура»."
memory: "Rzeźba — скульптура, не «резьба». Rzeźbiarz — скульптор. Rzeźba terenu — рельеф."
idioms:
  - { pl: "stać jak rzeźba", ru: "стоять как статуя, не шевелясь" }
  - { pl: "rzeźba terenu", ru: "рельеф местности" }
formExamplesSkip:
