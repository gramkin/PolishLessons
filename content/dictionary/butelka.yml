  - id: counting
    ru: "счёт бутылок: dwie butelki, pięć butelek"
    examples:
      - pl: "Kupiłam dwie butelki mleka."
        ru: "Я купила две бутылки молока."
        source: { kind: tatoeba, id: 549982 }
      - pl: "Poproszę dwie małe butelki."
