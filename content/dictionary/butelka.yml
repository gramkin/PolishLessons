        source: { kind: tatoeba, id: 6322301 }
      - pl: "Kupiłem pięć butelek wina i trzy skrzynki piwa."
        ru: "Я купил пять бутылок вина и три ящика пива."
        source: { kind: translated, id: 12069302 }
notes:
  - { kind: government, text: "butelka wina «бутылка вина» — содержимое стоит в родительном падеже, как и в русском." }
  - { kind: usage, text: "При счёте формы чередуются: dwie butelki «две бутылки», но pięć butelek «пять бутылок» — родительный множественного без окончания." }
  - { kind: usage, text: "Устойчивое nabić kogoś w butelkę значит «обмануть, надуть», буквально «набить в бутылку»." }
  - { kind: pronunciation, text: "l перед e мягкое: буте́лька. Ударение на предпоследний слог." }
collocations:
  - { pl: "butelka wina", ru: "бутылка вина" }
  - { pl: "w butelce", ru: "в бутылке" }
  - { pl: "pięć butelek", ru: "пять бутылок" }
etymology: "Из французского bouteille через немецкое Buttel. Русская «бутылка» пришла тем же путём, через польский."
memory: "butelka — «бутылка», содержимое в родительном: butelka wina. При счёте формы чередуются: dwie butelki, но pięć butelek. И запомните оборот nabić w butelkę «обмануть»."
idioms:
  - { pl: "butelka wina", ru: "бутылка вина" }
  - { pl: "nabić w butelkę", ru: "обмануть" }
  - { pl: "zaglądać do butelki", ru: "закладывать за воротник" }
formExamplesSkip:
  - { form: "butelko", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
