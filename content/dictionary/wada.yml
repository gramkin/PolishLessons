notes:
  - { kind: false-friend, text: "Русского существительного с таким корнем в литературном языке нет, и слово приходится переводить по контексту: WADA это и недостаток характера, и изъян товара, и врождённый порок. Главное противопоставление, которое поляк слышит сразу, — WADY I ZALETY, то есть «недостатки и достоинства», и эта пара в речи неразлучна. Не следует путать WADA с WINA «вина»: вторая о проступке, первая о свойстве. От того же корня идёт глагол WADZIĆ «мешать, быть помехой» и существительное ZAWADA «помеха», которое русский знает в областном «завада»." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — WADZIE, где конечное D основы переходит в DZI перед окончанием -E: та же мена, что в REKORDZIE, только здесь она попадает в женское склонение. Родительный множественного — WAD, с нулевым окончанием и без вставного гласного. Родительный единственного и именительный множественного — одна форма WADY. Управление: WADA CZEGO в родительном — WADA WZROKU, WADA SERCA, WADA WYMOWY «дефект речи». В значении изъяна товара употребляется предлог Z: TOWAR Z WADĄ." }
  - { kind: pronunciation, text: "Читается «ва́да», два слога, ударение на первом. Буква W даёт «в», а A — чистое «а», так что слово звучит почти как русское «вода», но с «а» в первом слоге, и спутать их легко. В форме WADZIE сочетание DZI читается как мягкое «дзи»: «ва́дзе». В форме WADĄ последнее Ą даёт «он»: «ва́дон». В форме WADĘ конечное Ę звучит как чистое «э»: «ва́дэ». В форме WAD конечное D оглушается в «т»: «ват»." }
  - { kind: register, text: "Слово нейтральное и частое. Устойчивые сочетания: WADY I ZALETY, WADA WRODZONA «врождённый порок», WADA SERCA, WADA WZROKU, WADA WYMOWY, WADA FABRYCZNA «заводской брак», WADA UKRYTA «скрытый дефект» — последнее юридический термин, важный при покупке. Выражение MIEĆ WADĘ говорится и о вещи, и о человеке, и во втором случае звучит мягче, чем русское «порок»: это скорее слабость, чем нравственный изъян. Прилагательное WADLIWY значит «дефектный, неисправный»." }
