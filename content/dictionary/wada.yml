etymology: "Из праславянского *vada, означавшего ссору, обвинение, а затем изъян. Корень в русском сохранился скупо и по краям: в устаревшем «вадить» со значением «клеветать, наговаривать», в областном «завада» со значением «помеха» и в слове «повадка», хотя последнее связано иначе. Польский удержал существительное в самом ходовом слое и расширил его до всякого недостатка — характера, вещи, здоровья. Сюда же относится и глагол WADZIĆ «мешать», с приставочным ZAWADZAĆ, и выражение NIE ZAWADZI «не помешает», очень частое в разговоре. Таким образом русскому доступен весь корень, но только через слова, которых он почти не употребляет, и опознать WADA на слух не удастся."
memory: "Корень в русском есть, но на окраине: устаревшее «вадить» значило клеветать, областное «завада» — помеха. Польское wada ходовое и широкое: недостаток характера, изъян товара, врождённый порок. Неразлучная пара в речи: wady i zalety «недостатки и достоинства». Не путать с wina «вина»: wada о свойстве, wina о проступке. Дательный и местный wadzie с меной d→dzi, как rekordzie. Очень частое nie zawadzi «не помешает»."
