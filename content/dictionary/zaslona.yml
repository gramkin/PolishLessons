etymology: "От ZASŁONIĆ, из приставки ZA- и корня SŁON-, того же, что в OSŁONA «защита» и в русских «заслонить», «заслон», «заслонка». Корень связан со словом «слонить», то есть прислонять, ставить вплотную. Русский удержал за ним военный и технический смысл, а польский пустил его в быт и назвал им оконную штору. Поэтому слова выглядят одинаково, а живут в разных комнатах языка."
memory: "Корень тот же, что в русском «заслонить», но употребление сдвинуто: польская zasłona это прежде всего штора на окне, вещь ежедневная, а русский «заслон» военный и редкий. Для шторы русский берёт чужое слово, и родство пропадает. Переносное zasłona dymna совпадает с «дымовой завесой» целиком. Читается «засуо́на», потому что ł это «у». В местном падеже w zasłonie."
idioms:
  - { pl: "zasłona dymna", ru: "дымовая завеса" }
