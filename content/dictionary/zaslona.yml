notes:
  - { kind: false-friend, text: "Корень общий с русским «заслоном» и «заслонить», но распределение сдвинуто. Русский «заслон» это преграда или отряд прикрытия, слово военное и редкое в быту. Польская ZASŁONA, наоборот, прежде всего штора на окне, вещь ежедневная: для неё русский берёт персидскую «штору» или «занавеску», и корень теряется. Переносное ZASŁONA DYMNA совпадает с русской «дымовой завесой» целиком." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа N смягчается: ZASŁONA, но W ZASŁONIE. Родительный множественного ZASŁON, без окончания. Уменьшительное ZASŁONKA значит и «шторку», например в душе, и «заслонку» в печи, то есть покрывает оба русских слова сразу, что для уменьшительных в этом словаре обычно." }
  - { kind: government, text: "Задёрнуть шторы — ZASUNĄĆ ZASŁONY, винительный без предлога; раздвинуть — ODSUNĄĆ ZASŁONY. За шторой — ZA ZASŁONĄ, предлог ZA с творительным, как и русский. Сквозь штору — PRZEZ ZASŁONĘ, предлог PRZEZ с винительным. Все четыре конструкции совпадают с русскими, и переносить их можно без изменений." }
  - { kind: pronunciation, text: "Читается «засуо́на», три слога, ударение на втором. Буква Ł даёт «у», поэтому середина слова звучит «суо», а не «сло»: это главное отличие от русского «заслона» на слух. Буква S между гласными остаётся глухой. В местном падеже ZASŁONIE сочетание NIE даёт мягкое «не», и слышно «засуо́не»." }
  - { kind: register, text: "Слово нейтральное и бытовое: ZASUNĄĆ ZASŁONY «задёрнуть шторы», ZASŁONA PRYSZNICOWA «шторка для душа», GRUBE ZASŁONY «плотные шторы». Военное и переносное ZASŁONA DYMNA звучит и буквально, о дымовой завесе, и в газетах, о том, чем прикрывают настоящие намерения. Второе употребление частое и понятное без пояснений, потому что русский образ тот же." }
collocations:
  - { pl: "zasunąć zasłony", ru: "задёрнуть шторы" }
