notes:
  - { kind: pronunciation, text: "Слово выглядит знакомым и читается не так, как кажется. Польская C всегда даёт «ц», а Y даёт «ы», поэтому CYRK звучит «цырк», а не «цирк». Это не прихоть одного слова, а общее правило: CYTRYNA это «цытрына», CYFRA «цыфра», CYRKIEL «цыркель». Русскому уху сочетание «цы» в начале слова кажется неправильным, но в польском оно совершенно обычно, потому что польская C мягкой не бывает: мягкий звук пишется другой буквой, Ć." }
  - { kind: usage, text: "Существительное мужского рода неодушевлённое, девять падежных форм. Обратить внимание стоит на две разные формы, которые русский привык видеть одной: местный падеж это W CYRKU, а дательный — CYRKOWI. Польский различает их у большинства существительных мужского рода, тогда как у русского «в цирке» и «цирку» тоже различаются, но по другой схеме. Переносное значение употребляется только в единственном числе: о беспорядке скажут TO JAKIŚ CYRK, но не во множественном." }
  - { kind: government, text: "Направление и место разводятся предлогами, как в русском, но с другими падежами. Идти в цирк — IŚĆ DO CYRKU, предлог DO с родительным, тогда как русский ставит «в» с винительным. Быть в цирке — BYĆ W CYRKU, предлог W с местным, и здесь уже как по-русски. Работать в цирке тоже PRACOWAĆ W CYRKU. Это общая польская схема: DO плюс родительный на вопрос куда, W плюс местный на вопрос где." }
  - { kind: register, text: "В прямом значении слово нейтральное и детское, в переносном — разговорное и сердитое. CO TO ZA CYRK значит ровно русское «что это за цирк», и употребляется о бестолковом собрании, о суде, о ремонте, который никак не кончится. Самое сильное выражение этого ряда — CYRK NA KÓŁKACH, буквально «цирк на колёсах», о полной неразберихе. Прилагательное CYRKOWY нейтрально: ARTYSTA CYRKOWY «цирковой артист», NAMIOT CYRKOWY «цирковой шатёр»." }
