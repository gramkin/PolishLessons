etymology: "Из латинского CIRCUS «круг, арена», и в польский слово пришло через немецкий, как и в русский. Поэтому PL и RU здесь совпадают по смыслу полностью, а расходятся только в чтении: латинское C перед I в польском осталось твёрдым «ц» с последующим «ы», а в русском дало «ци». Корень тот же, что в CYRKIEL «циркуль», CYRKULACJA «циркуляция» и в слове CYRKUMFLEKS. Переносное значение «балаган» выросло в обоих языках независимо и из одного и того же образа: арена, на которой каждый кувыркается по-своему."
memory: "Пишется как русское слово, читается иначе: «цырк», потому что польская C это всегда «ц», а Y это «ы». Правило общее: cytryna «цытрына», cyfra «цыфра». Переносное значение совпадает с русским: co to za cyrk значит «что это за цирк», а самое сильное выражение cyrk na kółkach «цирк на колёсах», о полной неразберихе. Управление: iść DO cyrku с родительным на вопрос куда, być W cyrku с местным на вопрос где."
idioms:
  - { pl: "cyrk na kółkach", ru: "цирк на колёсах, полная неразбериха" }
