notes:
  - { kind: false-friend, text: "Русскому KOPERTA непонятна: «конверт» по-польски совсем другое слово. Зато польское KONWERTER — «преобразователь», а KONWERSJA — «конверсия», и с почтой они не связаны. Переносное значение совпадает с русским: KOPERTA, как и «конверт», — это деньги в конверте, взятка врачу или чиновнику." }
  - { kind: usage, text: "Женский род, неодушевлённое. В местном и дательном T чередуется с C: W KOPERCIE, NA KOPERCIE. Множественное KOPERTY, родительный KOPERT. Звательный KOPERTO не употребляется. Уменьшительное KOPERTKA — маленький конвертик, например для денег на свадьбу." }
  - { kind: government, text: "Положить в конверт — WŁOŻYĆ DO KOPERTY, DO с родительным. На конверте — NA KOPERCIE, местный. В конверте — W KOPERCIE. Заклеить конверт — ZAKLEIĆ KOPERTĘ, винительный." }
  - { kind: pronunciation, text: "Читается «копэ́рта», три слога, ударение на предпоследнем. PE — твёрдое «пэ». В KOPERCIE CIE даёт мягкое «це»: «копэ́рце»." }
  - { kind: register, text: "Нейтральное бытовое слово. В значении взятки — разговорное и ироничное: DAĆ W KOPERTĘ, «дать в конверте». На польской свадьбе гости дарят KOPERTĘ, конверт с деньгами, — это обычай, а не взятка." }
collocations:
  - { pl: "zaklejona koperta", ru: "запечатанный конверт" }
  - { pl: "włożyć do koperty", ru: "положить в конверт" }
  - { pl: "koperta z pieniędzmi", ru: "конверт с деньгами" }
family:
  - { pl: "list", ru: "письмо", relation: root, id: list }
  - { pl: "znaczek", ru: "марка", relation: root }
  - { pl: "kopertka", ru: "конвертик", relation: derived }
etymology: "Из итальянского coperta, «покрышка, обёртка», от латинского coopertus, «покрытый». Конверт — то, что покрывает письмо. Русское «конверт» — из французского couvert с тем же значением «покрытие», так что слова родственны по смыслу и отчасти по корню."
memory: "Koperta — конверт: włożyć do koperty, na kopercie. И конверт с деньгами — взятка. На свадьбе дарят kopertę. Читается «копэ́рта»."
idioms:
  - { pl: "dać w kopertę", ru: "дать в конверте, сунуть взятку" }
formExamplesSkip:
