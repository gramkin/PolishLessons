# review
id: napad
format: 2
lemma: "napad"
rank: 1918
pos: noun
pron: { cyr: "на́пат" }
senses:
  - id: robbery
    ru: "нападение, налёт, ограбление"
    examples:
      - pl: "Gang planował napad."
        ru: "Банда планировала налёт."
        source: { kind: translated, id: 733086 }
      - pl: "Ręce do góry! To napad."
        ru: "Руки вверх! Это ограбление."
        source: { kind: translated, id: 2391507 }
      - pl: "Tom jest skazany za napad na bank."
        ru: "Том осуждён за налёт на банк."
        source: { kind: translated, id: 3502821 }
      - pl: "Kradzież to przestępstwo, napad na bank to zbrodnia."
        ru: "Кража — это проступок, а налёт на банк — тяжкое преступление."
        source: { kind: translated, id: 13871904 }
      - pl: "Mała staruszka udaremniła napad, waląc złodzieja w głowę laską."
        ru: "Маленькая старушка сорвала налёт, ударив вора палкой по голове."
        source: { kind: translated, id: 11272674 }
      - pl: "Tom upierał się, że nie ma nic wspólnego z napadem."
        ru: "Том настаивал, что не имеет никакого отношения к налёту."
        source: { kind: translated, id: 9679574 }
  - id: attack-medical
    ru: "приступ (болезни)"
    examples:
      - pl: "Ona miała napad kaszlu."
        ru: "У неё был приступ кашля."
        source: { kind: translated, id: 1889752 }
      - pl: "On cierpi na nagłe napady kaszlu."
        ru: "Он страдает от внезапных приступов кашля."
        source: { kind: translated, id: 1889748 }
notes:
  - { kind: false-friend, text: "Второе значение неожиданно для русского уха: napad kaszlu — это «приступ кашля», а не «нападение кашля». Так же napad złości «приступ гнева»." }
  - { kind: usage, text: "Рядом с карточкой atak: atak — нападение вообще, в том числе военное и спортивное, napad — уголовное нападение, налёт." }
  - { kind: government, text: "Нападение на кого-либо — napad na kogoś с винительным: napad na bank «налёт на банк»." }
collocations:
  - { pl: "napad na bank", ru: "налёт на банк" }
  - { pl: "napad kaszlu", ru: "приступ кашля" }
  - { pl: "napad złości", ru: "приступ гнева" }
etymology: "От napaść «напасть», na- + paść «пасть, упасть». Русское «нападение» собрано так же: на- + «падать»."
memory: "napad — «налёт, нападение»: napad na bank. Но napad kaszlu — это уже «приступ кашля», а не нападение."
