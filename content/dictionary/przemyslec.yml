# review
id: przemyslec
format: 2
lemma: "przemyśleć"
rank: 1689
pos: verb
aspect: perf
pron: { cyr: "пшэмы́сьлець" }
senses:
  - id: think-over
    ru: "обдумать, продумать"
    examples:
      - pl: "Muszę przemyśleć to co powiedziałeś."
        ru: "Мне нужно обдумать то, что ты сказал."
        source: { kind: tatoeba, id: 6109717 }
      - pl: "Muszę to przemyśleć."
        ru: "Мне нужно это обдумать."
        source: { kind: translated, id: 575092 }
      - pl: "Przemyślał sytuację."
        ru: "Он обдумал ситуацию."
        source: { kind: translated, id: 3781081 }
  - id: reconsider
    ru: "обдумать заново, пересмотреть (решение)"
    examples:
      - pl: "Przemyślałem ponownie twoją ofertę."
        ru: "Я ещё раз обдумал твоё предложение."
        source: { kind: translated, id: 11260264 }
      - pl: "Przemyślę to i odpowiem."
        ru: "Я это обдумаю и отвечу."
        source: { kind: translated, id: 1691433 }
notes:
  - { kind: usage, text: "Совершенный вид: przemyśleć значит «обдумать до конца». Просто «думать» — myśleć, «подумать» — pomyśleć." }
  - { kind: government, text: "przemyśleć coś (винительный падеж): przemyśl to, przemyślał sytuację — без предлога, как русское «обдумать что-то»." }
  - { kind: usage, text: "Причастие przemyślany значит «продуманный»: dobrze przemyślany plan «хорошо продуманный план»." }
  - { kind: false-friend, text: "Не путайте przemyśleć «обдумать» и przemysł «промышленность» — слова похожи, но к размышлению przemysł отношения уже не имеет." }
collocations:
  - { pl: "przemyśleć sprawę", ru: "обдумать дело" }
  - { pl: "dobrze przemyślany", ru: "хорошо продуманный" }
  - { pl: "do przemyślenia", ru: "для размышления" }
family:
  - { pl: "myśleć", ru: "думать", relation: root, id: myslec }
  - { pl: "pomyśleć", ru: "подумать", relation: root, id: pomyslec }
  - { pl: "myśl", ru: "мысль", relation: root }
etymology: "Приставка prze- «пере-, про-» + myśleć «думать»: буквально «продумать». Русское «обдумать» использует приставку «об-», но образ тот же."
memory: "przemyśleć — «обдумать», совершенный вид от myśleć: Muszę to przemyśleć «мне нужно это обдумать». Причастие przemyślany — «продуманный». И не путайте с przemysł «промышленность»."
idioms:
  - { pl: "do przemyślenia", ru: "для размышления" }
  - { pl: "dobrze przemyślany", ru: "хорошо продуманный" }
  - { pl: "przemyśleć sprawę", ru: "обдумать дело" }
