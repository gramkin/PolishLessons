formExamples:
  - form: "przemyśl"
    pl: "Przemyśl to!"
    ru: "Обдумай это!"
    source: { kind: translated, id: 9845813 }
  - form: "przemyśl"
    pl: "Proszę, przemyśl to."
    ru: "Пожалуйста, обдумай это."
    source: { kind: translated, id: 569874 }
  - form: "przemyśl"
    pl: "Przemyśl to, proszę, i powiedz mi, jaką decyzję podjąłeś."
    ru: "Обдумай это, пожалуйста, и скажи мне, какое решение ты принял."
    source: { kind: translated, id: 2243966 }
  - form: "przemyślał"
    pl: "Przemyślał sytuację."
    ru: "Он обдумал ситуацию."
    source: { kind: translated, id: 3781081 }
  - form: "przemyślał"
    pl: "Dokładnie przemyślał jej plan."
    ru: "Он тщательно обдумал её план."
    source: { kind: translated, id: 11566025 }
  - form: "przemyślał"
    pl: "Dobrze przemyślał sprawę i postanowił nie jechać."
    ru: "Он хорошо обдумал дело и решил не ехать."
    source: { kind: translated, id: 970635 }
  - form: "przemyślałem"
    pl: "Przemyślałem to."
    ru: "Я это обдумал."
    source: { kind: translated, id: 5879342 }
  - form: "przemyślałem"
    pl: "Tego nie przemyślałem."
    ru: "Этого я не обдумал."
    source: { kind: translated, id: 2299581 }
  - form: "przemyślałem"
    pl: "Przemyślałem twoje słowa."
    ru: "Я обдумал твои слова."
    source: { kind: translated, id: 6467272 }
  - form: "przemyślcie"
    pl: "Przemyślcie to, proszę, i powiedzcie mi, jaką decyzję podjęliście."
    ru: "Обдумайте это, пожалуйста, и скажите мне, какое решение вы приняли."
    source: { kind: translated, id: 2243968 }
  - form: "przemyślcie"
    pl: "Przemyślcie to spokojnie."
    ru: "Обдумайте это спокойно."
    source: { kind: authored }
  - form: "przemyślcie"
    pl: "Przemyślcie moją propozycję do jutra."
    ru: "Обдумайте моё предложение до завтра."
    source: { kind: authored }
  - form: "przemyśleć"
    pl: "Muszę to przemyśleć."
    ru: "Мне нужно это обдумать."
    source: { kind: translated, id: 575092 }
  - form: "przemyśleć"
    pl: "Chciałbym to przemyśleć."
    ru: "Я хотел бы это обдумать."
    source: { kind: translated, id: 3695477 }
  - form: "przemyśleć"
    pl: "Musimy przemyśleć wiele spraw."
    ru: "Нам нужно обдумать много вопросов."
    source: { kind: translated, id: 731888 }
  - form: "przemyślę"
    pl: "Przemyślę to i odpowiem."
    ru: "Я это обдумаю и отвечу."
    source: { kind: translated, id: 1691433 }
  - form: "przemyślę"
    pl: "Przemyślę to jeszcze raz."
    ru: "Я обдумаю это ещё раз."
    source: { kind: authored }
  - form: "przemyślę"
    pl: "Najpierw wszystko przemyślę."
    ru: "Сначала я всё обдумаю."
    source: { kind: authored }
  - form: "przemyśli"
    pl: "Tom to przemyśli."
    ru: "Том это обдумает."
    source: { kind: translated, id: 7960761 }
  - form: "przemyśli"
    pl: "Ona to przemyśli i zadzwoni."
    ru: "Она это обдумает и позвонит."
    source: { kind: authored }
  - form: "przemyśli"
    pl: "Mam nadzieję, że przemyśli swoją decyzję."
    ru: "Надеюсь, он обдумает своё решение."
    source: { kind: authored }
  - form: "przemyślimy"
    pl: "Przemyślimy to wszystko, by przekonać się, czy będziemy mieć możliwość tworzenia."
    ru: "Мы всё это обдумаем, чтобы понять, сможем ли мы творить."
    source: { kind: translated, id: 2346314 }
  - form: "przemyślimy"
    pl: "Przemyślimy to razem."
    ru: "Мы обдумаем это вместе."
    source: { kind: authored }
  - form: "przemyślimy"
    pl: "Jutro przemyślimy cały plan."
    ru: "Завтра мы обдумаем весь план."
    source: { kind: authored }
  - form: "przemyślisz"
    pl: "Może przemyślisz to jeszcze raz?"
    ru: "Может, ты обдумаешь это ещё раз?"
    source: { kind: authored }
  - form: "przemyślisz"
    pl: "Jeśli to przemyślisz, zrozumiesz."
    ru: "Если ты это обдумаешь, поймёшь."
    source: { kind: authored }
  - form: "przemyślisz"
    pl: "Przemyślisz moją propozycję?"
    ru: "Ты обдумаешь моё предложение?"
    source: { kind: authored }
