  - { form: "przemyślenia", reason: "формы отглагольного существительного przemyślenie «обдумывание, размышление», в статье глагола примеры не приводятся" }
  - { form: "przemyślenie", reason: "формы отглагольного существительного przemyślenie «обдумывание, размышление», в статье глагола примеры не приводятся" }
  - { form: "przemyśleniu", reason: "формы отглагольного существительного przemyślenie «обдумывание, размышление», в статье глагола примеры не приводятся" }
