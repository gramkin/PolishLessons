etymology: "Приставка WY- плюс WALIĆ, от праславянского *valiti «валить, катить». Русский хранит и глагол, и всё гнездо: «валить», «вывалить», «завалить», «обвал», «вал». Польский взял тот же материал, но распределил значения иначе. Простое WALIĆ сдвинулось к удару, ZAWALIĆ осталось при заваливании и добавило «провалить», а WYWALIĆ ушло в сторону выбрасывания и увольнения. Русское «вывалить» этого последнего шага не сделало и осталось при высыпании. Приставки в обоих языках одни и те же, а дорожки, по которым они повели корень, разошлись, и сравнение двух слов одного гнезда показывает это лучше любого правила."
memory: "Корень тот же, что в «валить», приставка та же, что в «вывалить», но смысл ушёл дальше: wywalić значит прежде всего «выбросить» и «выгнать». Wywalili go z pracy это «его выгнали с работы». Сравнить стоит с zawalić, где совпадение с русским полное, — один корень, две приставки, два разных отношения к русскому. Слово разговорное; нейтрально будет wyrzucić и zwolnić. И помнить wywalić oczy «вытаращить глаза»."
idioms:
  - { pl: "wywalić oczy", ru: "вытаращить глаза" }
