notes:
  - { kind: register, text: "Это слово разговорное от начала до конца, и в учебной речи им лучше не пользоваться, хотя узнавать его надо: оно звучит в автобусе, в офисе и в школе постоянно. Нейтральные замены есть на каждое значение: WYRZUCIĆ «выбросить», ZWOLNIĆ «уволить», USUNĄĆ «удалить». WYWALILI GO Z PRACY грубее, чем ZWOLNILI GO, и несёт оттенок несправедливости. Ещё разговорнее возвратное WYWALIĆ SIĘ — «растянуться, грохнуться»: WYWALIŁ SIĘ NA LODZIE. И отдельно WYWALIĆ OCZY — «вытаращить глаза»." }
  - { kind: false-friend, text: "Русское «вывалить» и польское WYWALIĆ совпадают только в одном узком смысле — высыпать содержимое наружу. Польский глагол пошёл гораздо дальше и значит прежде всего «выбросить» и «выгнать», чего русский не умеет: WYWALIĆ Z PRACY это «уволить». Сравните с предыдущим словом того же корня: ZAWALIĆ значит «завалить», и там совпадение полное, а здесь приставка увела смысл. Один корень, две приставки, два разных отношения к русскому." }
  - { kind: government, text: "Прямое дополнение в винительном: WYWALIĆ ŚMIECI, WYWALIĆ GAZETY. Место, откуда выбрасывают или выгоняют, идёт с предлогом Z и родительным: WYWALIĆ COŚ Z SZAFY, WYWALIĆ KOGOŚ Z PRACY, ZE SZKOŁY. Русский здесь берёт «из» с родительным, так что падеж и предлог совпадают полностью. Причастие работает так же: WYWALENI Z PRACY. Возвратное WYWALIĆ SIĘ дополнения не требует, а место падения вводится предлогом NA с предложным: WYWALIĆ SIĘ NA LODZIE." }
  - { kind: usage, text: "Приставка WY- отвечает русской ВЫ-, и в этом слове соответствие прозрачно: WY- плюс WALIĆ даёт движение наружу. Видовой партнёр — WYWALAĆ. Пятьдесят три формы — подпись переходного глагола совершенного вида. Причастие WYWALONY спокойно принимает формы мужского лица во множественном числе, WYWALENI, потому что выгоняют именно людей, и в этом отличие от WYWALIĆ ŚMIECI. Оба употребления живут в одной парадигме." }
  - { kind: pronunciation, text: "Читается «выва́личь», три слога, ударение на предпоследнем. Первая Y звучит как «ы», а не как «и», поэтому начало слова «выва», и это та же гласная, что в WYJŚCIE «вы́йще». Буква L перед I мягкая, как русское «ль». Конечное Ć мягкое, «чь». В причастии WYWALONY слышно «вывалё́ны», где группа IO даёт «ё»." }
collocations:
