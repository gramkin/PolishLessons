  - { pl: "żałować", ru: "жалеть, сожалеть", relation: derived, id: zalowac }
  - { pl: "żałośnie", ru: "жалко, жалобно", relation: derived }
etymology: "От żal «жаль, печаль», праславянское *žalь, — то же слово, что русские «жаль», «жалость», «жалкий». Суффикс -osny дал значение «вызывающий жалость», откуда и «жалкий», и «жалобный». Русское «жалкий» построено от того же корня, поэтому пара żałosny — «жалкий» надёжна; сбивает только то, что по-русски есть ещё и «жалостливый», с обратным направлением чувства."
memory: "żałosny — «жалкий, плачевный, жалобный», от żal, то есть русского «жаль». Главное: это про того, КОГО жалеют, а не про того, кто жалеет (тот — współczujący). Множественное мужско-личное żałośni (sn → śni)."
idioms:
