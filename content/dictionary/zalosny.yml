notes:
  - { kind: false-friend, text: "Вот где легко ошибиться. Żałosny описывает того, кого жалеют или кем брезгуют, — то есть отвечает русскому «жалкий», «плачевный», «жалобный». Он НЕ значит «жалостливый, сочувствующий»: тот, кто жалеет других, по-польски współczujący или litościwy. Так что żałosny człowiek — это «жалкий человек», а не «жалостливый»." }
  - { kind: usage, text: "От żal «жаль, печаль», поэтому корень русскому понятен. Мужско-личная форма множественного — żałośni, с чередованием sn → śni. В сравнительной степени чередование сохраняется: żałośniejszy, najżałośniejszy." }
  - { kind: government, text: "Сравнение, как у всех прилагательных: żałośniejszy OD czegoś (родительный с od) или niż (с именительным). Наречие — żałośnie: wyglądać żałośnie «выглядеть жалко», brzmieć żałośnie «звучать жалобно»." }
  - { kind: register, text: "В первом значении слово оценочное и резкое — примерно как русское «жалкий» в адрес человека или поступка: żałosna wymówka, żałosny występ. Это не брань, но и не нейтральная характеристика, и в вежливом разговоре о человеке так не скажут." }
  - { kind: pronunciation, text: "Прилагательное даёт три степени, и каждая склоняется полностью: положительная, сравнительная и превосходная с приставкой naj-. Поэтому в списке форм их втрое больше, чем кажется нужным. Превосходная строится механически: naj- + сравнительная." }
collocations:
