# review
id: rowniez
format: 2
lemma: "również"
rank: 411
pos: part
pron: { cyr: "ру́внеш" }
senses:
  - id: also
    ru: "тоже, также"
    examples:
      - pl: "On nie lubi sportu. Ja również."
        ru: "Он не любит спорт. Я тоже."
        source: { kind: tatoeba, id: 3176873 }
      - pl: "Ta zasada dotyczy również ciebie."
        ru: "Это правило и тебя касается."
        source: { kind: tatoeba, id: 930070 }
      - pl: "On ma nadzieję na zwycięstwo, ja również."
        ru: "Он надеется на победу, как и я."
        source: { kind: tatoeba, id: 1611645 }
  - id: in-addition
    ru: "также, к тому же (при перечислении)"
    examples:
      - pl: "Mieszkanie posiada również mały balkon."
        ru: "В квартире есть также небольшой балкон."
        source: { kind: tatoeba, id: 13785431 }
      - pl: "Rozważam również wyjazd do Korei."
        ru: "Я подумываю над тем, чтобы поехать в Корею."
        source: { kind: tatoeba, id: 2211908 }
      - pl: "Oni śpią również w pokojach."
        ru: "Они спят тоже в комнатах."
        source: { kind: tatoeba, id: 3655795 }
notes:
  - { kind: usage, text: "również и też — синонимы «тоже, также». też короче и разговорнее, również чуть книжнее." }
  - { kind: usage, text: "Ja również — готовый ответ «И я тоже», как русское «Я тоже»." }
  - { kind: usage, text: "Ставится перед тем словом, к которому относится: dotyczy również ciebie «касается и тебя»." }
  - { kind: false-friend, text: "Не путайте również «тоже» с równo «ровно» и równie «столь же»: równie dobry «столь же хороший»." }
collocations:
  - { pl: "ja również", ru: "и я тоже" }
  - { pl: "nie tylko, ale również", ru: "не только, но и" }
  - { pl: "a również", ru: "а также" }
etymology: "От równo «ровно», от równy «равный» — буквально «равным образом». Русский оборот «равно как и» построен из того же корня."
memory: "również — «тоже, также», а буквально «равным образом»: внутри równy «равный», как в русском «равно как и». Разговорный синоним — też, он короче."
idioms:
  - { pl: "ja również", ru: "и я тоже" }
  - { pl: "nie tylko..., ale również", ru: "не только..., но и" }
  - { pl: "również i to", ru: "и это тоже" }
