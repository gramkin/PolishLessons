notes:
  - { kind: false-friend, text: "ОБА СЛОВА ПОСТРОЕНЫ НА «ЦЕЛОМ» — И ЭТО НЕ СОВПАДЕНИЕ. Pocałunek от całować, а то — от cały «ЦЕЛЫЙ». Русское «поцеловать» от «целый» ровно так же: поцеловать значило пожелать быть целым, то есть здоровым. Два языка сохранили один и тот же древний образ, и слова разбираются до конца." }
  - { kind: pronunciation, text: "БЕГЛОЕ E ВЫПАДАЕТ ВО ВСЕХ КОСВЕННЫХ ПАДЕЖАХ: POCAŁUNEK, НО POCAŁUNKU. Так ведёт себя весь суффикс -ek: dodatek, pierścionek, ładunek, wózek. Ł читается как краткое у, поэтому середина звучит «цауу»: «поцауу́нэк»." }
  - { kind: usage, text: "Поцелуй ДАЮТ или СКЛАДЫВАЮТ: dać komuś pocałunek, złożyć pocałunek na czole. Воздушный — pocałunek przesłany ręką, а послать его — posłać komuś całusa. Разговорное całus мягче и теплее, чем книжное pocałunek: buziak ещё домашнее." }
collocations:
  - { pl: "pierwszy pocałunek", ru: "первый поцелуй" }
  - { pl: "pocałunek Judasza", ru: "поцелуй Иуды" }
  - { pl: "złożyć pocałunek", ru: "запечатлеть поцелуй" }
family:
  - { pl: "całować", ru: "целовать", relation: root, id: calowac }
  - { pl: "cały", ru: "целый", relation: root, id: caly }
  - { pl: "całus", ru: "поцелуйчик", relation: derived }
etymology: "От całować «целовать», от cały «целый», из праславянского *cělъ — того же слова, что русское «целый», родственного немецкому heil. Поцеловать значило пожелать целости и здоровья. Русское «поцелуй» собрано точно так же. Отсюда całus, całować, uzdrowić и ocaleć «уцелеть»."
memory: "pocałunek — «поцелуй», и слово разбирается как русское: от cały «ЦЕЛЫЙ», потому что поцеловать значило пожелать быть целым. Беглое e выпадает: pocałunku. Разговорно теплее сказать całus."
idioms:
  - { pl: "pocałunek Judasza", ru: "иудин поцелуй" }
  - { pl: "przesłać komuś całusa", ru: "послать кому-л. воздушный поцелуй" }
