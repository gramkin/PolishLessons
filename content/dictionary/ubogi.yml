# review
id: ubogi
format: 2
lemma: "ubogi"
rank: 2589
pos: adj
pron: { cyr: "убо́ги" }
senses:
  - id: poor
    ru: "бедный, неимущий"
    examples:
      - pl: "Pochodził z ubogiej rodziny."
        ru: "Он происходил из бедной семьи."
        source: { kind: authored }
      - pl: "Ubodzy mieszkańcy nie mieli dostępu do lekarza."
        ru: "Бедные жители не имели доступа к врачу."
        source: { kind: authored }
      - pl: "Był ubogi, ale dumny."
        ru: "Он был беден, но горд."
        source: { kind: authored }
  - id: scanty
    ru: "скудный, бедный чем-либо"
    examples:
      - pl: "Gleba jest tu uboga w składniki odżywcze."
        ru: "Почва здесь бедна питательными веществами."
        source: { kind: authored }
      - pl: "Jego słownictwo było ubogie."
        ru: "Его словарный запас был скудным."
        source: { kind: authored }
notes:
  - { kind: government, text: "Обычное прилагательное со степенями: ubogi, uboższy, najuboższy. В значении «бедный чем-либо» требует предлога w с винительным: uboga w witaminy." }
  - { kind: usage, text: "Два круга значений: о людях — «бедный, неимущий»; о вещах — «скудный»." }
  - { kind: usage, text: "Мужско-личное множественное ubodzy часто стоит как существительное: «бедняки»." }
  - { kind: false-friend, text: "Русское «убогий» — то же самое слово, но значение разошлось: по-русски это «жалкий, увечный», по-польски прежде всего «бедный». Русское «убогий» переводится как żałosny или nędzny." }
collocations:
  - { pl: "ubogi krewny", ru: "бедный родственник" }
  - { pl: "uboga gleba", ru: "бедная почва" }
  - { pl: "ubogi w witaminy", ru: "бедный витаминами" }
family:
  - { pl: "bogaty", ru: "богатый", relation: antonym, id: bogaty }
  - { pl: "ubóstwo", ru: "бедность", relation: derived }
etymology: "Праславянское *ubogъ: приставка u- в отрицающем значении плюс корень *bog- «доля, богатство», буквально «обделённый долей». Русское «убогий» — то же слово, но русский развил его в «жалкий, увечный», а польский сохранил «бедный»."
memory: "ubogi — «бедный», буквально «обделённый долей»: u- плюс тот же корень, что в bogaty. Русское «убогий» родственно, но значит «жалкий»."
idioms:
  - { pl: "ubogi krewny", ru: "бедный родственник" }
