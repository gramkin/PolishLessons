# review
id: wyjsc
format: 2
lemma: "wyjść"
rank: 150
pos: verb
aspect: perf
pron: { cyr: "вы́йсьць" }
senses:
  - id: leave
    ru: "выйти (откуда-либо), уйти"
    examples:
      - pl: "Wyjdźmy na zewnątrz."
        ru: "Давай выйдем на улицу."
        source: { kind: tatoeba, id: 6328360 }
      - pl: "Powiedz, że wyszłam."
        ru: "Скажи, что я вышла."
        source: { kind: tatoeba, id: 13045926 }
      - pl: "Wyjdę dziś po południu."
        ru: "Я выйду сегодня после полудня."
        source: { kind: tatoeba, id: 827808 }
  - id: turn-out
    ru: "получиться, выйти (о результате)"
    note: "Очень частое разговорное значение: Tak wyszło «Так получилось»."
    examples:
      - pl: "Nic z tego nie wyszło."
        ru: "Из этого ничего не вышло."
        source: { kind: authored }
      - pl: "Zdjęcie wyszło dobrze."
        ru: "Фотография вышла хорошо."
        source: { kind: authored }
      - pl: "Wyszło na moje."
        ru: "Вышло по-моему."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид к wychodzić: Wychodzę co rano «Выхожу каждое утро» — Wyszedłem wcześniej «Я вышел раньше»." }
  - { kind: usage, text: "Направление: wyjść z domu «выйти из дома» (z + родительный), wyjść na ulicę «выйти на улицу» (na + винительный)." }
  - { kind: usage, text: "wyjść za mąż — «выйти замуж» (только о женщине); мужчина в этом случае ożenić się." }
collocations:
  - { pl: "wyjść z domu", ru: "выйти из дома" }
  - { pl: "wyjść za mąż", ru: "выйти замуж" }
  - { pl: "wyjść na jaw", ru: "выйти наружу" }
  - { pl: "tak wyszło", ru: "так получилось" }
etymology: "Приставка wy- + iść — то же строение, что у русского «выйти» (вы + идти); в прошедшем времени основа меняется: wyszedł, как «вышел»."
memory: "wyjdę «выйду» — wyszedłem «я вышел», ровно как в русском. Два оборота на каждый день: wyjść za mąż «выйти замуж» и Tak wyszło «так получилось»."
idioms:
  - { pl: "wyjść za mąż", ru: "выйти замуж" }
  - { pl: "wyjść na jaw", ru: "выйти наружу, обнаружиться" }
  - { pl: "wyszło szydło z worka", ru: "шило в мешке не утаишь" }
