      - pl: "Po stracie pracy przeżywał bardzo trudne chwile."
        ru: "После потери работы он переживал очень трудные времена."
        source: { kind: translated, id: 936259 }
      - pl: "Nie rozpaczaj za długo po stracie najbliższych."
        ru: "Не горюй слишком долго после потери близких."
        source: { kind: translated, id: 366729 }
  - id: financial
    ru: "убыток, убытки"
    examples:
      - pl: "Strata wyniosła 100 dolarów."
        ru: "Убыток составил сто долларов."
        source: { kind: translated, id: 2784633 }
      - pl: "To przedsiębiorstwo przynosi straty."
        ru: "Это предприятие приносит убытки."
        source: { kind: translated, id: 765758 }
      - pl: "Straty sięgnęły 2 mln jenów."
        ru: "Убытки достигли двух миллионов иен."
        source: { kind: translated, id: 858457 }
notes:
  - { kind: government, text: "po stracie czegoś «после потери чего-то»: сам strata стоит в предложном, зависимое слово в родительном — po stracie pracy." }
  - { kind: usage, text: "Strata czasu «пустая трата времени» — самое частое сочетание. Русские «трата» и «утрата» покрываются одним польским словом." }
  - { kind: usage, text: "Во множественном straty значит «убытки» и «потери», в том числе военные: ponieść straty «понести потери»." }
  - { kind: usage, text: "Родственный глагол — stracić «потерять», карточка уже есть." }
collocations:
  - { pl: "strata czasu", ru: "пустая трата времени" }
  - { pl: "ponieść straty", ru: "понести потери" }
  - { pl: "po stracie", ru: "после потери" }
etymology: "От stracić «потерять», из праславянского *tratiti. Русское «тратить» — то же слово, но в русском оно ушло в сторону расходования, а в польском сохранило и значение утраты."
memory: "strata — и «трата», и «утрата», и «убыток». Самое частое: strata czasu «пустая трата времени». Во множественном straty — «убытки, потери». Глагол рядом — stracić «потерять»."
idioms:
