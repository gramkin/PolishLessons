notes:
  - { kind: false-friend, text: "Корень тот же, что в русских «блуждать» и «заблуждение»: OBŁĘD это буквально заблуждение, помрачение, уход с пути. Соседнее BŁĄD значит «ошибка», а BŁĄDZIĆ — «блуждать». Русское «блуд» от того же корня, но ушло к распутству, так что совпадения с ним нет никакого. Держитесь за «заблуждение», и всё гнездо станет понятным." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Носовое Ę держится во всех падежах. В местном падеже D переходит в DZI: OBŁĘD, но W OBŁĘDZIE. Разговорное значение, о чём-то невообразимом, стоит почти всегда в именительном и как сказуемое: TO OBŁĘD, и во множественное число не идёт, тогда как медицинское значение множественное допускает." }
  - { kind: government, text: "Впасть в безумие — POPAŚĆ W OBŁĘD, предлог W с винительным, как и по-русски. Доводить до безумия — DOPROWADZAĆ DO OBŁĘDU, предлог DO с родительным, и схема совпадает. На грани безумия — NA GRANICY OBŁĘDU, родительный после существительного. В безумии — W OBŁĘDZIE, предлог W с местным падежом." }
  - { kind: pronunciation, text: "Читается «о́буэнт», два слога, ударение на первом, и в этом коротком слове сразу три перемены. Ł даёт «у». Носовое Ę перед D даёт «эн». Конечное D оглушается до «т». В итоге от написания почти ничего не остаётся. В местном падеже OBŁĘDZIE оглушения уже нет, и слышно «обуэ́ндзе», с мягким «дзе»." }
  - { kind: register, text: "В прямом значении слово книжное и тяжёлое, из медицины и литературы: POPAŚĆ W OBŁĘD, OBŁĘD STARCZY, NA GRANICY OBŁĘDU. В разговорной речи оно, наоборот, лёгкое и частое как восклицание: TO OBŁĘD! говорят о ценах, о пробках, об очередях, примерно как русское «это просто безумие». Прилагательное OBŁĘDNY в разговоре значит уже «потрясающий»." }
collocations:
  - { pl: "popaść w obłęd", ru: "впасть в безумие" }
  - { pl: "na granicy obłędu", ru: "на грани безумия" }
  - { pl: "obłęd w oczach", ru: "безумие в глазах" }
family:
  - { pl: "błąd", ru: "ошибка", relation: root, id: blad }
  - { pl: "błądzić", ru: "блуждать, заблуждаться", relation: root }
  - { pl: "obłędny", ru: "безумный; потрясающий", relation: derived }
etymology: "От приставки OB- и корня BŁĄD-, того же, что в польских BŁĄD «ошибка» и BŁĄDZIĆ «блуждать», и в русских «блуждать», «заблуждение», «блуд». Исходный образ — сойти с пути, и от него оба языка пошли в переносную сторону. Польский получил и ошибку, и безумие, то есть помрачение ума. Русский от того же корня произвёл «заблуждение», близкое к ошибке, и «блуд», ушедший совсем в другую область."
memory: "Держитесь за «заблуждение»: obłęd это буквально уход с пути, помрачение ума, и корень тот же, что в «блуждать» и «заблуждении». Соседнее błąd значит «ошибка», błądzić «блуждать». Русский «блуд» того же корня, но ушёл к распутству. Читается «о́буэнт»: ł даёт «у», ę перед d даёт «эн», конечное d оглушается. В разговоре to obłęd! значит «это просто безумие»."
idioms:
  - { pl: "doprowadzać do obłędu", ru: "доводить до безумия" }
