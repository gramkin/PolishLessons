pos: noun
pron: { cyr: "розмо́ва" }
senses:
  - id: conversation
    ru: "разговор, беседа"
    examples:
      - pl: "Czy pamiętasz naszą wczorajszą rozmowę?"
        ru: "Ты помнишь наш вчерашний разговор?"
        source: { kind: tatoeba, id: 6154875 }
      - pl: "Jak wypadła rozmowa?"
        ru: "Как прошёл разговор?"
        source: { kind: translated, id: 2405927 }
      - pl: "Zgubiłem się w rozmowie."
        ru: "Я потерял нить разговора."
        source: { kind: translated, id: 958993 }
  - id: interview
    ru: "собеседование; переговоры"
    examples:
      - pl: "Miałem rozmowę o pracę."
        ru: "У меня было собеседование о работе."
        source: { kind: translated, id: 11324097 }
      - pl: "Mam już dosyć rozmów z nią."
        ru: "Мне уже надоели разговоры с ней."
        source: { kind: translated, id: 415309 }
      - pl: "Tom nie lubi rozmów o sporcie."
        ru: "Том не любит разговоров о спорте."
        source: { kind: translated, id: 3300880 }
notes:
  - { kind: false-friend, text: "rozmowa o pracę — это «собеседование при приёме на работу», а вовсе не «разговор о работе». Готовая формула, которую стоит запомнить целиком." }
  - { kind: usage, text: "Слово сложено из roz- + mowa «речь». Те же части, что в русской «размолвке», но польское слово совершенно нейтральное." }
  - { kind: usage, text: "Ходовые сочетания: rozmowa telefoniczna «телефонный разговор», prowadzić rozmowę «вести разговор», przerwać rozmowę «прервать разговор»." }
  - { kind: usage, text: "Во множественном rozmowy часто значит «переговоры»: rozmowy pokojowe «мирные переговоры»." }
collocations:
  - { pl: "rozmowa o pracę", ru: "собеседование" }
  - { pl: "rozmowa telefoniczna", ru: "телефонный разговор" }
  - { pl: "prowadzić rozmowę", ru: "вести разговор" }
  - { pl: "rozmowy pokojowe", ru: "мирные переговоры" }
etymology: "Из roz- + mowa «речь», праславянское *mъlva. Русские «молва» и «молвить» — то же гнездо, и «размолвка» сложена из тех же частей, но значения разошлись."
memory: "rozmowa — «разговор», из roz- + mowa «речь». Те же части, что в русской «размолвке», но польское слово совершенно нейтральное. Главное — запомнить формулу rozmowa o pracę: это «собеседование при приёме на работу», а не «разговор о работе»."
idioms:
