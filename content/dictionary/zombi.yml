notes:
  - { kind: government, text: "Русское «зомби» не склоняется вовсе; польское склоняется, и притом по прилагательному образцу. ZOMBI остаётся без окончания в именительном, а дальше идут адъективные формы: ZOMBIEGO в родительном и винительном, ZOMBIEMU в дательном, ZOMBIM в творительном и местном, ZOMBICH в родительном и местном множественного, ZOMBIMI в творительном множественного. Причина в конечном -I: заимствованные одушевлённые существительные на -I и -Y польский втягивает в прилагательное склонение, как фамилии вроде LINDE и LINDEGO. Винительный равен родительному, потому что слово одушевлённое мужского лица." }
  - { kind: false-friend, text: "Ловушка не в значении, а в привычке. Русскоговорящий ждёт, что слово будет несклоняемым, и говорит BEZ ZOMBI или O ZOMBI, а польский требует BEZ ZOMBIEGO и O ZOMBIM. Это общее свойство: польский склоняет заимствования гораздо охотнее русского, и там, где русский оставляет «метро», «кино», «зомби» неизменными, польский либо склоняет, либо, как с METRO и KINO, тоже оставляет. Поэтому запоминать нужно не правило о неизменяемости, а конкретный образец, и для ZOMBI это образец прилагательного." }
  - { kind: pronunciation, text: "Читается «зо́мби», ударение на предпоследнем слоге, то есть на первом из двух. Буква Z даёт «з», а не «ц». Конечное -I звучит как полноценное «и». В формах ZOMBIEGO и ZOMBIEMU сочетание BIE читается «бе» с мягким б: «зомбе́го», «зомбе́му», и ударение по правилу переходит на предпоследний слог, который теперь третий. В ZOMBIM буква M на конце не смягчается: «зо́мбим». Написание ZOMBIE, с конечным E, в польском тоже встречается, но нормативным считается ZOMBI." }
  - { kind: register, text: "Слово разговорное и принадлежит языку поп-культуры, кино и игр; в научном или официальном тексте оно появится только как предмет описания. Частотные сочетания: FILM O ZOMBI, APOKALIPSA ZOMBI «зомби-апокалипсис», CHODZIĆ JAK ZOMBI «ходить как зомби» о человеке без сна. Последнее выражение живое и в русском совпадает буквально. Переносное употребление о бездумной массе встречается в публицистике. Производное ZOMBIFIKACJA книжное и редкое." }
