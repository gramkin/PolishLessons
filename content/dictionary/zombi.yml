etymology: "Из западноафриканских языков: киконго NZAMBI «бог, дух» и кимбунду NZÚMBE «призрак умершего» дали на Гаити креольское ZONBI, обозначавшее тело без души, поднятое колдуном. Оттуда слово попало в американский английский как ZOMBIE в двадцатых годах двадцатого века, вместе с рассказами о гаитянских верованиях, а кинематограф шестидесятых сделал его названием целого жанра. В польский и русский оно пришло уже из английского и в готовом киношном значении, поэтому ни в одном из двух языков нет следов исходного религиозного смысла. Разошлись языки только в обращении с формой: польский приспособил слово к своему склонению, русский оставил неизменяемым."
memory: "Склоняется, в отличие от русского «зомби», и притом как прилагательное: zombiego, zombiemu, zombim, zombich, zombimi. Причина — конечное -i: заимствованные одушевлённые на -i польский втягивает в адъективное склонение. Ошибка русскоговорящего — bez zombi вместо bez zombiego. Из киконго nzambi «дух» через гаитянское zonbi и английское zombie."
