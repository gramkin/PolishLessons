id: inny
format: 2
lemma: "inny"
rank: 98
pos: adj
pron: { cyr: "и́нны" }
senses:
  - id: other
    ru: "другой, иной"
    examples:
      - pl: "Mam inny pomysł."
        ru: "У меня есть другая идея."
        source: { kind: tatoeba, id: 8658874 }
      - pl: "Mam inne plany."
        ru: "У меня другие планы."
        source: { kind: tatoeba, id: 6406151 }
      - pl: "Jedni wolą morze, inni góry."
        ru: "Одни предпочитают море, другие — горы."
        source: { kind: tatoeba, id: 733096 }
  - id: different
    ru: "не такой, отличающийся"
    examples:
      - pl: "To inna skrajność."
        ru: "Это другая крайность."
        source: { kind: tatoeba, id: 8675029 }
      - pl: "Jestem z innej planety."
        ru: "Я с другой планеты."
        source: { kind: tatoeba, id: 5397512 }
notes:
  - { kind: usage, text: "В сочетаниях стоит после местоимения: kto inny «кто-то другой», coś innego «что-то другое»." }
collocations:
  - { pl: "między innymi", ru: "в том числе, среди прочего" }
  - { pl: "kto inny", ru: "кто-то другой" }
  - { pl: "coś innego", ru: "что-то другое" }
etymology: "Праславянское *(j)inъ — то же слово, что русское «иной»."
memory: "inny = «другой», а русское «иной» — его прямой родственник. Запомните обороты целиком: kto inny «кто-то другой», innymi słowy «иными словами», między innymi «между прочим»."
idioms:
  - { pl: "między innymi", ru: "в том числе, среди прочего" }
  - { pl: "inna para kaloszy", ru: "совсем другое дело" }
  - { pl: "z innej beczki", ru: "на другую тему" }
