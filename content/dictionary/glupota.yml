notes:
  - { kind: false-friend, text: "Корень знакомый: głupi это «глупый», слово в слово. Но польский делит то, что русский держит вместе. Głupota — это глупость как СВОЙСТВО, качество ума: ludzka głupota, szczyt głupoty. А głupstwo — глупость как ПОСТУПОК или пустяк: popełnić głupstwo «сделать глупость», а восклицание Głupstwo! значит «Пустяки!». Русское «глупость» покрывает оба случая." }
  - { kind: pronunciation, text: "Сочетание gł звучит как г с коротким у, которое сливается со следующим u: «гупо́та», ударение на предпоследнем слоге. В предложном падеже t смягчается в ci: w głupocie — «в гупо́це», ровно как płyta даёт na płycie." }
  - { kind: usage, text: "Родительный множественного — голая основа głupot, без вставного e, как у metod. Множественное число głupoty значит «глупости» в смысле вздора: opowiadać głupoty «нести чушь», narobić głupot «наделать глупостей»." }
collocations:
