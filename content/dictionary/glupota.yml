family:
  - { pl: "głupi", ru: "глупый", relation: root, id: glupi }
  - { pl: "głupstwo", ru: "глупость, пустяк", relation: derived, id: glupstwo }
  - { pl: "głupiec", ru: "глупец", relation: derived, id: glupiec }
  - { pl: "mądrość", ru: "мудрость", relation: antonym }
etymology: "От głupi «глупый», из праславянского *glupъ — того же слова, что русское «глупый». Суффикс -ota образует названия свойств, как в ciemnota «невежество» и dobrota «доброта». Рядом стоит głupstwo, где суффикс -stwo даёт не свойство, а поступок или пустяк."
memory: "głupota — «глупость», но только как свойство. Поступок называется głupstwo: popełnić głupstwo «сделать глупость», а Głupstwo! в разговоре значит «Пустяки!». Русское слово одно, польских два."
