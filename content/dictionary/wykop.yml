# review
id: wykop
format: 2
lemma: "wykop"
rank: 5846
pos: noun
pron: { cyr: "вы́коп" }
senses:
  - id: pit
    ru: "котлован, траншея; раскоп"
    examples:
      - pl: "Na budowie wykonano już głęboki wykop."
        ru: "На стройке уже вырыли глубокий котлован."
        source: { kind: authored }
      - pl: "Robotnicy otoczyli wykop taśmą."
        ru: "Рабочие оградили котлован лентой."
        source: { kind: authored }
      - pl: "Pod ulicą zrobiono wykop pod nową rurę."
        ru: "Под улицей вырыли траншею для новой трубы."
        source: { kind: authored }
  - id: kick
    ru: "выбивание мяча, дальний удар (футбол)"
    examples:
      - pl: "Bramkarz posłał piłkę długim wykopem na połowę rywali."
        ru: "Вратарь отправил мяч длинным выбиванием на половину соперника."
        source: { kind: authored }
      - pl: "Po wykopie bramkarza napastnik przejął piłkę."
        ru: "После выбивания вратаря нападающий подхватил мяч."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYKOP совпадает по звучанию с повелительным наклонением WYKOP! «выкопай!» от WYKOPAĆ, но существительное — мужского рода: WYKOPU, W WYKOPIE. Русского «выкоп» нет: это «котлован», «траншея», у археологов «раскоп». Сами раскопки — WYKOPALISKA, а копка картофеля — WYKOPKI." }
  - { kind: usage, text: "Глагол KOPAĆ значит и «копать», и «пинать», поэтому у WYKOP есть футбольное значение: выбивание мяча вратарём, дальний удар ногой. Родительный единственного — WYKOPU, с -U, как у большинства неодушевлённых." }
  - { kind: pronunciation, text: "Читается «вы́коп»: Y — «ы», ударение на первом слоге. В формах с окончанием ударение сдвигается: «выко́пу», «выко́пы»." }
collocations:
  - { pl: "głęboki wykop", ru: "глубокий котлован" }
  - { pl: "wykop pod fundamenty", ru: "котлован под фундамент" }
  - { pl: "wykop archeologiczny", ru: "археологический раскоп" }
  - { pl: "długi wykop", ru: "дальнее выбивание (мяча)" }
family:
  - { pl: "wykopać", ru: "выкопать; выбить ногой", relation: root, id: wykopac }
  - { pl: "kopać", ru: "копать; пинать", relation: root, id: kopac }
  - { pl: "wykopalisko", ru: "раскоп, раскопки", relation: derived }
  - { pl: "wykopki", ru: "копка картофеля", relation: derived }
etymology: "От глагола WYKOPAĆ «выкопать»: «то, что выкопано». Футбольное значение — от второго смысла того же глагола, «выбить ногой»."
memory: "Wykop — то, что выкопали: котлован. Но kopać — ещё и «пинать», поэтому wykop у вратаря — выбивание мяча."
idioms:
  - { pl: "wykop pod fundamenty", ru: "котлован под фундамент (первый шаг стройки)" }
