# review
id: sojusznik
format: 2
lemma: "sojusznik"
rank: 4978
pos: noun
pron: { cyr: "сою́шник" }
senses:
  - id: ally
    ru: "союзник"
    examples:
      - pl: "Polska jest sojusznikiem Stanów Zjednoczonych."
        ru: "Польша — союзник США."
        source: { kind: authored }
      - pl: "Sojusznicy wysłali pomoc wojskową."
        ru: "Союзники направили военную помощь."
        source: { kind: authored }
      - pl: "W tej walce potrzebujemy sojuszników."
        ru: "В этой борьбе нам нужны союзники."
        source: { kind: authored }
  - id: supporter
    ru: "сторонник, помощник"
    examples:
      - pl: "Znalazł w niej sojusznika."
        ru: "Он нашёл в ней союзника."
        source: { kind: authored }
      - pl: "Czas jest naszym sojusznikiem."
        ru: "Время — наш союзник."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SOJUSZNIK — «союзник», от SOJUSZ, «союз». Не путайте с ZWIĄZEK — «союз, связь»: военно-политический союз — SOJUSZ, а профсоюз — ZWIĄZEK ZAWODOWY. Союзница — SOJUSZNICZKA." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: SOJUSZNICY. Местный и звательный — SOJUSZNIKU." }
  - { kind: government, text: "Стать союзником — STAĆ SIĘ SOJUSZNIKIEM, творительный. Союзник кого — родительный: SOJUSZNIK POLSKI. Искать союзников — SZUKAĆ SOJUSZNIKÓW, родительный." }
  - { kind: pronunciation, text: "Читается «сою́шник»: SZ — «ш», ударение на предпоследнем слоге. SOJUSZNICY — «союшни́цы»." }
collocations:
  - { pl: "wierny sojusznik", ru: "верный союзник" }
  - { pl: "szukać sojuszników", ru: "искать союзников" }
  - { pl: "sojusznik w walce", ru: "союзник в борьбе" }
family:
  - { pl: "sojusz", ru: "союз, альянс", relation: root, id: sojusz }
  - { pl: "przyjaciel", ru: "друг", relation: root, id: przyjaciel }
  - { pl: "wróg", ru: "враг", relation: root, id: wrog }
etymology: "От SOJUSZ «союз», заимствованного из русского в XIX–XX веке; суффикс -NIK уже польский. Польское SZ передаёт русское З в конце: «союз» — SOJUSZ."
memory: "Sojusznik — союзник, от sojusz — союз. Sojusznicy — союзники. Czas jest naszym sojusznikiem. Читается «сою́шник»."
idioms:
  - { pl: "czas jest sojusznikiem", ru: "время работает на нас" }
