notes:
  - { kind: false-friend, text: "PORÓD — «роды», и это единственное число: PORÓD BYŁ CIĘŻKI, «роды были тяжёлыми». Русское «роды» — только множественное, польское PORODY — несколько отдельных родов. Не путайте с RÓD — «род, семья»." }
  - { kind: usage, text: "Десять форм, мужской род. Ó чередуется с O: PORÓD, но PORODU. В местном D переходит в DZ: PRZY PORODZIE. Роддом — SZPITAL POŁOŻNICZY или разговорное PORODÓWKA." }
  - { kind: government, text: "При родах — PRZY PORODZIE, местный. После родов — PO PORODZIE. До родов — PRZED PORODEM, творительный. Принимать роды — ODBIERAĆ PORÓD, винительный." }
  - { kind: pronunciation, text: "Читается «по́рут», ударение на первом слоге. Ó — «у», конечное D оглушается в «т». В PORODU — «поро́ду»." }
collocations:
  - { pl: "poród naturalny", ru: "естественные роды" }
  - { pl: "odebrać poród", ru: "принять роды" }
  - { pl: "przedwczesny poród", ru: "преждевременные роды" }
family:
  - { pl: "urodzić", ru: "родить", relation: root, id: urodzic }
  - { pl: "narodziny", ru: "рождение", relation: root, id: narodziny }
  - { pl: "porodówka", ru: "родильное отделение", relation: derived }
etymology: "От RODZIĆ «рожать» с приставкой PO-. Корень тот же, что в русском «роды», «родить», «урожай»."
memory: "Poród — роды, в единственном числе. Przy porodzie — при родах. Читается «по́рут». Porodówka — родильное отделение."
idioms:
  - { pl: "ciężki poród", ru: "тяжёлые роды; дело, давшееся с трудом" }
