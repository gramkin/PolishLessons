etymology: "Из английского nuclear, от латинского nucleus «ядро», уменьшительного от nux «орех». Так что «ядерный» по-латыни — буквально «ореховый»: ядро атома сравнили с ядрышком ореха. Польский JĄDROWY — та же метафора своими словами, JĄDRO и «ядро» — одно и то же слово."
memory: "Nuklearny — ядерный, слово из новостей: broń nuklearna, program nuklearny. Синонимы — jądrowy (наука) и atomowy (быт). Читается «нуклэа́рны», ударение на «а»."
