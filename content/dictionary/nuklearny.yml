notes:
  - { kind: false-friend, text: "Русскому NUKLEARNY кажется экзотикой: «нуклеарный» по-русски звучит как термин из учебника. А в польском это обычное газетное слово, калька английского nuclear. Получается три синонима: NUKLEARNY, JĄDROWY и ATOMOWY. NUKLEARNY любят политика и новости: PROGRAM NUKLEARNY, ODSTRASZANIE NUKLEARNE. JĄDROWY — наука и закон, ATOMOWY — быт и история." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет. Форма для мужчин-людей NUKLEARNI в карточку не включена: людей так не описывают, а специалистов называют FIZYCY JĄDROWI. Остальные десять форм живые." }
  - { kind: government, text: "Ставится после существительного: BROŃ NUKLEARNA, PROGRAM NUKLEARNY, MOCARSTWO NUKLEARNE. Перед существительным почти не встречается. Отказ от ядерного оружия — REZYGNACJA Z BRONI NUKLEARNEJ, Z с родительным." }
  - { kind: pronunciation, text: "Читается «нуклэа́рны», четыре слога, ударение на предпоследнем, на A. Буквы E и A произносятся раздельно, «э-а», без слияния. L перед E обычная, «л», E после согласной твёрдое. Конечная Y — «ы»." }
  - { kind: register, text: "Слово книжное и газетное, из международной политики и медицины. В бытовой речи поляк скорее скажет ATOMOWY: BOMBA ATOMOWA, а не BOMBA NUKLEARNA, хотя обе возможны. В официальных документах чаще встречается JĄDROWY." }
