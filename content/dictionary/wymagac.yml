# review
id: wymagac
format: 2
lemma: "wymagać"
rank: 1435
pos: verb
aspect: imperf
pron: { cyr: "выма́гаць" }
senses:
  - id: demand
    ru: "требовать (от кого-либо)"
    examples:
      - pl: "Czego wymaga się ode mnie w zamian?"
        ru: "Что от меня требуется взамен?"
        source: { kind: tatoeba, id: 13784965 }
      - pl: "Wymagam od was inicjatywy."
        ru: "Я требую от вас инициативы."
        source: { kind: translated, id: 1410261 }
      - pl: "Wymagasz ode mnie niemożliwego."
        ru: "Ты требуешь от меня невозможного."
        source: { kind: translated, id: 611639 }
  - id: require
    ru: "требовать, нуждаться (о деле, вещи)"
    examples:
      - pl: "To wymaga czasu."
        ru: "Это требует времени."
        source: { kind: tatoeba, id: 6844669 }
      - pl: "Dom wymaga naprawy."
        ru: "Дом требует ремонта."
        source: { kind: translated, id: 5961867 }
      - pl: "Rozwiązanie problemu wymagało niemałego wysiłku."
        ru: "Проблема требовала больших усилий, чтобы её решить."
        source: { kind: tatoeba, id: 352006 }
notes:
  - { kind: government, text: "wymagać czego — родительный падеж, ровно как русское «требовать чего»: wymaga czasu, wymaga cierpliwości. Лицо вводится через od: Wymagam od was inicjatywy." }
  - { kind: usage, text: "Только несовершенный вид; однократное требование выражают глаголом zażądać «потребовать»." }
  - { kind: usage, text: "Страдательное wymagany значит «обязательный, требуемый»: Hasło jest wymagane «Пароль обязателен», wymagane pola «обязательные поля» — стандартная формула в анкетах." }
  - { kind: usage, text: "Причастие wymagający живёт как отдельное прилагательное «требовательный»: wymagający szef. Существительное — wymagania «требования»." }
collocations:
  - { pl: "wymagać czasu", ru: "требовать времени" }
  - { pl: "spełniać wymagania", ru: "отвечать требованиям" }
  - { pl: "wymagane pola", ru: "обязательные поля" }
etymology: "Приставка wy- и magać, от móc «мочь» (праславянское *mogti). Буквально «вы-мочь», то есть «добиваться». Русское «требовать» — другое слово, но падеж у обоих одинаковый."
memory: "wymagać — «требовать», и падеж тот же, что в русском: родительный — wymaga czasu. От кого — через od. Запомните две ходовые вещи: wymagane pola «обязательные поля» и wymagający «требовательный»."
idioms:
  - { pl: "wymagać czasu", ru: "требовать времени" }
  - { pl: "spełniać wymagania", ru: "отвечать требованиям" }
  - { pl: "wymagane pola", ru: "обязательные поля" }
formExamplesSkip:
  - { form: "wymagani", reason: "мужско-личной страдательной формы у этого глагола практически не бывает: wymagać czegoś управляет родительным падежом, а лицо вводится предлогом od (Wymagam od was inicjatywy), поэтому человек не бывает прямым дополнением. Формы wymagany, wymagana, wymagane в карточке есть с примерами и живут как прилагательное «обязательный»: wymagane pola" }
