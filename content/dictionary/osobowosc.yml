notes:
  - { kind: usage, text: "Форм шесть, и устроены они в точности как у MYŚL из партии 228: одна форма OSOBOWOŚCI делает восемь работ — родительный, дательный, местный и звательный единственного, а затем именительный, винительный, родительный и звательный множественного. Но здесь это уже не про одно слово. Суффикс -OŚĆ строит отвлечённые существительные женского рода сотнями, и все они склоняются одинаково: wolność, miłość, świadomość, możliwość, ciekawość. Выучив шесть форм один раз, вы получаете весь разряд сразу." }
  - { kind: usage, text: "Суффиксу -OŚĆ в русском отвечает -ость и -ность, и соответствие почти всегда прямое: wolność — «вольность», możliwość — «возможность», ciekawość — «любопытство» по смыслу, но «-ость» по устройству. Это делает разряд вдвойне выгодным: и склонение одно, и перевод подсказывается суффиксом. Осторожность нужна только там, где русский выбрал другой корень, как здесь: osobowość построена от OSOBA, а русская «личность» — от «лица»." }
  - { kind: pronunciation, text: "Окончание -ość читается «ось-ць»: ś даёт сь, ć даёт ць, и оба мягкие. В творительном падеже появляется носовое ą — OSOBOWOŚCIĄ, «особо́всьцён». Для русского уха сочетание śc выговаривается легче, чем кажется, если помнить, что это просто два мягких согласных подряд, как в русском «гвоздь», только с другой парой." }
