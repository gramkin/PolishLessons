etymology: "От OSOBA «особа, человек», из праславянского *osoba — того же слова, что русская «особа», — с суффиксом -ość, отвечающим русскому -ость. Русский построил то же понятие от другого корня: «личность» идёт от «лица». Поэтому слова не узнаются друг через друга, хотя оба собраны одинаково: корень со значением человека плюс суффикс отвлечённости."
memory: "Шесть форм, как у myśl, и это весь разряд на -ość: wolność, miłość, możliwość. Суффиксу -ość отвечает русское -ость, но корень тут «особа», а не «лицо»."
