# review
id: system
format: 2
lemma: "system"
rank: 627
pos: noun
pron: { cyr: "сы́стэм" }
senses:
  - id: system
    ru: "система"
    note: "system operacyjny «операционная система», system edukacji «система образования»."
    examples:
      - pl: "Na świecie jest 10 rodzajów ludzi: ci którzy rozumieją system dwójkowy i ci którzy go nie rozumieją"
        ru: "В мире есть 10 типов людей: те, кто понимает двоичную систему счисления, и те, кто не понимает."
        source: { kind: tatoeba, id: 526774 }
      - pl: "System zadziałał."
        ru: "Система сработала."
        source: { kind: translated, id: 12060410 }
      - pl: "Jakiego systemu operacyjnego używasz?"
        ru: "Какой операционной системой ты пользуешься?"
        source: { kind: translated, id: 11607330 }
  - id: method
    ru: "система как метод, порядок"
    note: "Nie mam systemu «У меня нет системы»."
    examples:
      - pl: "Nie mam systemu."
        ru: "У меня нет системы."
        source: { kind: translated, id: 11597552 }
      - pl: "Nie rozumiem tego systemu."
        ru: "Я не понимаю этой системы."
        source: { kind: translated, id: 4770297 }
      - pl: "Oni zmienili system."
        ru: "Они изменили систему."
        source: { kind: translated, id: 4770298 }
  - id: systems
    ru: "systemy — системы (письма, счисления)"
    note: "system binarny «двоичная система»."
    examples:
      - pl: "Wszystkie systemy pisania mają wady i zalety."
        ru: "Все системы письма имеют свои преимущества и недостатки."
        source: { kind: tatoeba, id: 2151468 }
      - pl: "Uwielbiam nowe systemy pisma."
        ru: "Я обожаю новые системы письма."
        source: { kind: translated, id: 11001831 }
      - pl: "liczba 2015 wyrażona w systemie binarnym to 11111011111."
        ru: "Число 2015 в двоичной системе — 11111011111."
        source: { kind: translated, id: 3748032 }
notes:
  - { kind: government, text: "«В системе» — w systemie с предложным: błąd w systemie «ошибка в системе». «Из системы» — z systemu с родительным." }
  - { kind: usage, text: "Частые сочетания: system operacyjny «операционная система», system edukacji «система образования», system podatkowy «налоговая система»." }
  - { kind: usage, text: "Разговорное nie mam systemu значит «у меня нет системы, действую наугад»." }
  - { kind: usage, text: "Прилагательное — systemowy «системный», наречие — systematycznie «систематически»." }
collocations:
  - { pl: "system operacyjny", ru: "операционная система" }
  - { pl: "błąd w systemie", ru: "ошибка в системе" }
  - { pl: "system edukacji", ru: "система образования" }
  - { pl: "system binarny", ru: "двоичная система" }
family:
  - { pl: "systemowy", ru: "системный", relation: derived }
  - { pl: "systematycznie", ru: "систематически", relation: derived }
etymology: "Из греческого σύστημα «составленное целое» через латынь и немецкое System — то же слово, что русская «система», и пришло тем же путём."
memory: "system — «система», и здесь польский с русским совпадают почти во всём: system operacyjny, system edukacji, system podatkowy. Помнить нужно только падежи по предлогам: w systemie «в системе» с предложным, do systemu «в систему» с родительным. Разговорное nie mam systemu значит «действую наугад». Прилагательное — systemowy."
idioms:
  - { pl: "system operacyjny", ru: "операционная система" }
  - { pl: "błąd w systemie", ru: "ошибка в системе" }
  - { pl: "system edukacji", ru: "система образования" }
