# review
id: nauczyc
format: 2
lemma: "nauczyć"
rank: 436
pos: verb
aspect: perf
pron: { cyr: "нау́чыць" }
senses:
  - id: teach
    ru: "научить (кого-либо чему-либо)"
    examples:
      - pl: "Nauczę cię grać w szachy."
        ru: "Я научу тебя играть в шахматы."
        source: { kind: tatoeba, id: 355898 }
      - pl: "Mama nauczyła mnie gotować."
        ru: "Я научился готовить у своей матери."
        source: { kind: tatoeba, id: 13785408 }
      - pl: "Nauczysz mnie grać w szachy?"
        ru: "Ты научишь меня играть в шахматы?"
        source: { kind: tatoeba, id: 539324 }
  - id: learn
    ru: "научиться (nauczyć się)"
    examples:
      - pl: "On nauczył się pływać."
        ru: "Он научился плавать."
        source: { kind: tatoeba, id: 3743447 }
      - pl: "Nauczyłem się żyć bez niej."
        ru: "Я научился жить без неё."
        source: { kind: tatoeba, id: 526432 }
      - pl: "Gdzie się tego nauczyłeś?"
        ru: "Где ты этому научился?"
        source: { kind: tatoeba, id: 3238112 }
notes:
  - { kind: usage, text: "Управление отличается от русского: кого — винительный, а чему — родительный падеж. Nauczył mnie polskiego «Он научил меня польскому»." }
  - { kind: usage, text: "С возвратным się значит «научиться»: nauczyć się pływać «научиться плавать», nauczyć się polskiego «выучить польский»." }
  - { kind: usage, text: "Несовершенный вид — uczyć: Uczę się «Я учусь», но Nauczyłem się «Я научился»." }
  - { kind: usage, text: "Пословица przygody nauczą zgody — «беды научат ладить»." }
collocations:
  - { pl: "nauczyć się", ru: "научиться" }
  - { pl: "nauczyć kogoś czegoś", ru: "научить кого-либо чему-либо" }
  - { pl: "naucz mnie", ru: "научи меня" }
  - { pl: "nauczyć się na pamięć", ru: "выучить наизусть" }
etymology: "Из na- + uczyć, праславянское *učiti; русское «научить» собрано ровно из тех же частей."
memory: "nauczyć — «научить», слово буква в букву русское. А вот управление другое: кого — винительный, но чему — родительный: nauczył mnie polskiego. С się это уже «научиться»."
idioms:
  - { pl: "przygody nauczą zgody", ru: "беды научат ладить" }
  - { pl: "nauczyć się na pamięć", ru: "выучить наизусть" }
  - { pl: "nauczyć się na własnych błędach", ru: "научиться на своих ошибках" }
