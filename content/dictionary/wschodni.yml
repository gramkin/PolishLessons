  - id: eastern-border
    ru: "восточный (о границе, рубеже)"
    examples:
      - pl: "Granica wschodnia jest dobrze pilnowana."
        ru: "Восточная граница хорошо охраняется."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЭТО ПРИЛАГАТЕЛЬНОЕ МЯГКОЙ ОСНОВЫ, И ПОТОМУ ФОРМ У НЕГО ДЕСЯТЬ, А НЕ ОДИННАДЦАТЬ. У мягких на -ni мужской именительный и мужско-личный множественного совпадают: wschodni sąsiad и wschodni sąsiedzi — одна и та же форма. Так же ведут себя tani, ostatni, dzisiejszy по мягкому типу." }
  - { kind: false-friend, text: "Корень тот же, что в русском, и работает так же двояко. WSCHÓD значит и «восток», и «восход»: wschód słońca — «восход солнца». Русские «восток» и «восход» тоже оба от «восходить», просто разошлись на два слова, а польский обходится одним." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: wscho-DNI, точнее WSCHO-dni. Начальное w перед глухим s оглушается до ф, ch читается как х: «фсхо́дні». Конечное ni мягкое." }
collocations:
  - { pl: "Europa Wschodnia", ru: "Восточная Европа" }
  - { pl: "wiatr wschodni", ru: "восточный ветер" }
  - { pl: "granica wschodnia", ru: "восточная граница" }
family:
  - { pl: "wschód", ru: "восток; восход", relation: root, id: wschod }
  - { pl: "zachodni", ru: "западный", relation: antonym }
  - { pl: "schodzić", ru: "сходить", relation: root }
etymology: "От wschód «восток, восход», из w- и корня schod-, того же, что в schodzić «сходить» и wschodzić «восходить». Русское «восход» собрано из тех же частей: вос- плюс «ход». Сторона света названа по восходу солнца в обоих языках."
memory: "wschodni — «восточный», от wschód, которое значит и «восток», и «восход». Прилагательное мягкой основы, поэтому wschodni служит и мужским единственным, и мужско-личным множественным — отсюда всего десять форм."
idioms:
  - { pl: "Europa Wschodnia", ru: "Восточная Европа" }
  - { pl: "wschodnia flanka", ru: "восточный фланг" }
