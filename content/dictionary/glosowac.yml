notes:
  - { kind: government, text: "Главное в этом глаголе — выбор предлога, и он расходится с русским. За КАНДИДАТА голосуют с предлогом NA и винительным: głosować NA kogoś (głosuję na nią). За ПРЕДЛОЖЕНИЕ — с предлогом ZA и творительным: głosować ZA ustawą. Против — PRZECIW с дательным: głosować PRZECIW ustawie. По-русски во всех трёх случаях «за» или «против», поэтому na при кандидате надо запомнить отдельно." }
  - { kind: false-friend, text: "Ловушки в значении нет: głosować построено от głos «голос», как русское «голосовать» от «голоса», и это праславянское *golsъ. Расходится только управление, см. выше. Ещё одна мелочь: głosować nad czymś значит «проводить голосование по чему-л.» (sejm głosuje nad ustawą)." }
  - { kind: usage, text: "Вид несовершенный; совершенная пара — zagłosować «проголосовать». Отглагольное существительное głosowanie значит и «голосование» как процедуру, и «голосование» как отдельный акт: tajne głosowanie, głosowanie korespondencyjne." }
  - { kind: pronunciation, text: "Глаголы на -ować меняют основу в настоящем времени: -ow- уступает место -uj-. Отсюда całować — całuję, całujesz, и głosować — głosuję, głosujesz. Это правило без исключений, и оно охватывает сотни польских глаголов, в том числе все заимствованные (telefonować, organizować). Вид несовершенный, поэтому есть причастия настоящего времени (całujący, głosując) и НЕТ формы на -wszy." }
collocations:
  - { pl: "głosować na kogoś", ru: "голосовать за кого-л." }
  - { pl: "głosować przeciw", ru: "голосовать против" }
  - { pl: "tajne głosowanie", ru: "тайное голосование" }
family:
  - { pl: "głos", ru: "голос", relation: root, id: glos }
  - { pl: "głosowanie", ru: "голосование", relation: derived }
  - { pl: "zagłosować", ru: "проголосовать", relation: aspect }
etymology: "От głos «голос», праславянское *golsъ — то же слово, что русский «голос», с польским перестановочным развитием ol вместо русского оло (głos при «голос», głowa при «голова»). Поэтому głosować и «голосовать» построены одинаково: подать голос. Эта мена oło/ol — надёжный опознавательный знак: złoto при «золото», mleko при «молоко»."
memory: "głosować — «голосовать», от głos «голос» (ср. «голова» и głowa). Запомните предлоги: за кандидата NA kogoś, за предложение ZA czymś, против PRZECIW czemuś."
idioms:
  - { pl: "głosować na kogoś", ru: "голосовать за кого-л." }
  - { pl: "tajne głosowanie", ru: "тайное голосование" }
formExamplesSkip:
  - { form: "głosowani", reason: "Мужско-личная форма страдательного причастия. Глагол głosować не берёт человека прямым дополнением: голосуют NA kogoś, ZA czymś, PRZECIW czemuś, а в переходном употреблении — только документ (głosować ustawę). Поэтому формы вроде głosowana ustawa правильны, а мужско-личного подлежащего у этого причастия быть не может: людей не «голосуют»." }
