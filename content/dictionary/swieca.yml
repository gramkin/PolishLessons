notes:
  - { kind: false-friend, text: "Слово прямо соответствует русской «свече», и образовано так же: ŚWIECA от ŚWIECIĆ «светить», как «свеча» от «светить». Даже второе значение совпало: ŚWIECA ZAPŁONOWA это «свеча зажигания», и обе страны назвали деталь двигателя по её виду. Ловушек тут нет вовсе, и запоминать нужно только произношение, которое уводит слово далеко от русского образца." }
  - { kind: usage, text: "Десять форм, женский род, мягкая основа. Родительный, дательный и местный падежи единственного числа совпадают в ŚWIECY, а именительный множественного ŚWIECE отличается от них только последней буквой, что на письме легко проглядеть. Родительный множественного ŚWIEC, без окончания. Звательный ŚWIECO звучит поэтично и встречается в стихах и в молитвенном языке." }
  - { kind: government, text: "При свечах — предлог PRZY с местным падежом: KOLACJA PRZY ŚWIECACH, и русский строит оборот так же. Зажечь свечу — ZAPALIĆ ŚWIECĘ, винительный без предлога. Задуть — ZDMUCHNĄĆ ŚWIECĘ, тоже винительный. Пламя свечи — PŁOMIEŃ ŚWIECY, родительный без предлога. Все четыре конструкции совпадают с русскими, так что переносить их можно без оглядки." }
  - { kind: pronunciation, text: "Читается «сьве́ца», два слога, ударение на первом. Буква Ś даёт мягкое «сь», и это главное отличие от русского слова: поляк начинает с мягкого свистящего, а не с твёрдого «св». Сочетание IE даёт «е». Конечное A звучит отчётливо. Во множественном ŚWIECE слышно «сьве́це», а в родительном множественного ŚWIEC — короткое «сьвец»." }
  - { kind: register, text: "Слово нейтральное и повседневное: ZAPALIĆ ŚWIECĘ, ŚWIECA WOSKOWA «восковая свеча», KOLACJA PRZY ŚWIECACH. Отдельный и очень важный для Польши пласт — свечи на кладбище: первого ноября в день Всех Святых вся страна ставит на могилах ZNICZE, особые лампадки, и слово ŚWIECA в этом контексте уступает место им. В технике ŚWIECA ZAPŁONOWA это обычный термин автомеханика." }
