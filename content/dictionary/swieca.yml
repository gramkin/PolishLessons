etymology: "От ŚWIECIĆ «светить», от праславянского корня SVĚT-, давшего и русские «свет», «свеча», «светить». Образование в обоих языках одинаковое: от глагола свечения суффиксом предмета. Польское Ś на месте русского «св» объясняется смягчением перед передним гласным, и та же пара видна в ŚWIAT и «свет», ŚWIĘTY и «святой». Выучив это соответствие, узнаёшь целое гнездо слов, которые иначе кажутся чужими."
memory: "Полное соответствие русской «свече», включая образование от świecić «светить» и второе значение, świeca zapłonowa «свеча зажигания». Запоминать надо только звук: ś даёт мягкое «сь», поэтому слово звучит «сьве́ца», а не «свеча». Та же пара в świat и «свет», święty и «святой». Родительный, дательный и местный единственного совпадают в świecy, а множественное świece отличается одной буквой."
idioms:
  - { pl: "kolacja przy świecach", ru: "ужин при свечах" }
