notes:
  - { kind: government, text: "Женский род, и чередование здесь другое, чем у GALAKTYKA: перед окончанием -E буква G переходит в DZ, и дательный с местным дают RÓWNOWADZE. Это та же замена, что в SKARGA и SKARDZE, FLAGA и FLADZE, USŁUGA и USŁUDZE — правило для всех основ на -GA, и оно идёт парой к правилу K в C для основ на -KA. Винительный на -Ę: STRACIĆ RÓWNOWAGĘ. Родительный множественного RÓWNOWAG. Равновесие чего — родительный без предлога: RÓWNOWAGA SIŁ, RÓWNOWAGA BUDŻETOWA через прилагательное. Где — предлог W с местным: W RÓWNOWADZE." }
  - { kind: false-friend, text: "Значение совпадает с русским «равновесием», а устройство слова почти совпадает, и это стоит разглядеть. RÓWNOWAGA это сложение RÓWNY «равный» и WAGA «вес, весы» — буквально «равный вес». Русское «равновесие» собрано из тех же частей: «равно» и «весие», от «веса». Оба языка сделали кальку латинского AEQUILIBRIUM, из AEQUUS «равный» и LIBRA «весы», и сделали её независимо, но одинаково. Расходятся они только в роде и суффиксе: польское слово женского рода, с живым WAGA на конце, русское среднего, с книжным «-весие». Поэтому TA RÓWNOWAGA, и согласование по женскому роду." }
  - { kind: pronunciation, text: "Читается «рувнова́га», ударение на предпоследнем слоге из четырёх. Буква Ó звучит «у», а не «о» — это главное место ошибки, потому что русское «равно-» подсказывает «о». Буква W в середине даёт «в». В дательном и местном RÓWNOWADZE сочетание DZ читается как один слитный звук «дз»: «рувнова́дзе». В родительном множественного RÓWNOWAG конечное G оглушается в «к»: «рувнова́к»." }
  - { kind: usage, text: "Частотные сочетания: STRACIĆ RÓWNOWAGĘ «потерять равновесие», ZACHOWAĆ RÓWNOWAGĘ «сохранить равновесие», RÓWNOWAGA SIŁ, RÓWNOWAGA BUDŻETOWA, WYPROWADZIĆ KOGOŚ Z RÓWNOWAGI «выбить кого-то из равновесия». Последний оборот частотен и в русском совпадает дословно. Прилагательное ZRÓWNOWAŻONY значит «уравновешенный» о человеке и «сбалансированный» о диете или бюджете, и оба значения обиходны. Существительное WAGA само значит и «вес», и «весы», и входит в оборот PRZYWIĄZYWAĆ WAGĘ «придавать значение»." }
