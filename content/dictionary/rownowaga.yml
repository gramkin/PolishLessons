etymology: "Сложение RÓWNY «равный» и WAGA «вес», то есть буквально «равный вес». Оба составных слова свои: RÓWNY из праславянского *orvьnъ, откуда и русское «ровный» и «равный», а WAGA — из средневерхненемецкого WÂGE «весы», родственного WIEGEN «взвешивать». Само же сложение есть калька латинского AEQUILIBRIUM, из AEQUUS «равный» и LIBRA «весы», и русский сделал ту же кальку из своих частей, получив «равновесие». Так два языка независимо перевели одно латинское слово и пришли к одинаковому составу, разойдясь только в роде: польское слово женское, потому что WAGA женского рода, русское среднее из-за книжного суффикса. Чередование G в DZ перед -E — славянское правило, парное к K в C."
memory: "Сложение równy плюс waga, «равный вес» — калька латинского aequilibrium, и русское «равновесие» собрано из тех же частей независимо. Но род расходится: ta równowaga, женский, против среднего «равновесия». Ó читается «у»: «рувнова́га», и русское «равно-» здесь сбивает. Дательный и местный — równowadze, с g→dz, как skarga — skardze и flaga — fladze; это правило парно к k→c у слов на -ka."
