  - id: upland
    ru: "верхний (о течении реки, части региона); горный"
    examples:
      - pl: "Górny Śląsk to region przemysłowy."
        ru: "Верхняя Силезия — промышленный регион."
        source: { kind: authored }
      - pl: "W górnym biegu Wisły woda jest czysta."
        ru: "В верхнем течении Вислы вода чистая."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушка в созвучии: GÓRNY — «верхний», а не «горный». Хотя оба от GÓRA, «гора», польское GÓRNY означает положение: GÓRNA PÓŁKA — «верхняя полка». «Горный» — GÓRSKI: GÓRSKA WIOSKA, «горная деревня». Пара противоположностей — GÓRNY и DOLNY, «верхний» и «нижний»." }
  - { kind: usage, text: "Относительное прилагательное: степеней сравнения нет, хотя генератор форм выдаёт GÓRNIEJSZY. Сказать «выше» — WYŻSZY. Форма для мужчин-людей GÓRNI в карточку не включена: людей так не описывают. Остаются десять форм положительной степени." }
  - { kind: government, text: "Ставится перед существительным: GÓRNA PÓŁKA, GÓRNE PIĘTRO, GÓRNA WARGA. В географии — тоже перед: GÓRNY ŚLĄSK. Падежных требований нет. Наверху — NA GÓRZE, наверх — NA GÓRĘ." }
  - { kind: pronunciation, text: "Читается «гу́рны», два слога, ударение на первом. Ó — «у», как в GÓRA «гу́ра». RN — без гласной между ними." }
  - { kind: register, text: "Нейтральное повседневное слово. GÓRNY ŚLĄSK — регион с Катовице, его жители — ŚLĄZACY, а прилагательное — GÓRNOŚLĄSKI. В анатомии GÓRNE DROGI ODDECHOWE — «верхние дыхательные пути»." }
collocations:
  - { pl: "górna półka", ru: "верхняя полка" }
  - { pl: "Górny Śląsk", ru: "Верхняя Силезия" }
  - { pl: "górna warga", ru: "верхняя губа" }
family:
  - { pl: "góra", ru: "гора; верх", relation: root, id: gora }
  - { pl: "dolny", ru: "нижний", relation: root, id: dolny }
  - { pl: "górski", ru: "горный", relation: derived }
etymology: "От GÓRA «гора, верх», общеславянского *gora, того же, что русское «гора». В польском GÓRA значит и «гору», и «верх»: NA GÓRZE — «наверху». Отсюда GÓRNY — «верхний», а для «горного» польский взял другой суффикс: GÓRSKI."
memory: "Górny — верхний, не горный! Górna półka, górne piętro, Górny Śląsk. Горный — górski. Противоположность — dolny. Читается «гу́рны»."
idioms:
  - { pl: "górna granica", ru: "верхний предел" }
