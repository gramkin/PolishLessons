notes:
  - { kind: false-friend, text: "Самое неожиданное значение этого слова русский не угадает никогда: BATERIA по-польски значит ещё и водопроводный смеситель, кран. BATERIA ŁAZIENKOWA «смеситель для ванной», BATERIA KUCHENNA, BATERIA ZLEWOZMYWAKOWA — так называются товары в любом строительном магазине. Русская «батарея» этого значения не имеет вовсе: по-русски это «смеситель» или «кран». Зато русское значение «радиатор отопления» в польском отсутствует: отопительная батарея — KALORYFER или GRZEJNIK. Остальные значения совпадают: батарейка, аккумулятор, артиллерийская батарея." }
  - { kind: usage, text: "Класс на -IA после согласной, и правило уже знакомо из RELIGIA: в родительном, дательном и местном падеже единственного числа буква I удваивается, и все три падежа дают одну форму BATERII. BEZ BATERII, W BATERII, DZIĘKI BATERII — одна форма на три падежа. Именительный множественного — BATERIE, а родительный множественного BATERYJ есть старая книжная форма, рядом с обычным BATERII. То же устройство у RELIGIA и RELIGII, STRATEGIA и STRATEGII." }
  - { kind: pronunciation, text: "Читается «батэ́рья», ударение на предпоследнем слоге. Буква E даёт «э» и согласную не смягчает: «тэ», а не «те». Сочетание RIA читается «рья», одним слогом, поэтому слово трёхсложное: BA-TE-RIA. В форме BATERII двойная I даёт долгое «и», и слогов становится четыре: «батэ́рии». Русское слово длиннее и мягче почти всюду, так что произношение приходится перестраивать целиком." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: WYMIEŃ BATERIĘ. Для чего батарейка — предлог DO с родительным: BATERIE DO APARATU «батарейки для фотоаппарата», BATERIA DO TELEFONU. Где стоит смеситель — предлог W с местным: BATERIA W ŁAZIENCE. Разряженная батарейка описывается глаголом PADNĄĆ: BATERIA PADŁA «батарейка села», и это обиходное выражение, а не BATERIA UMARŁA, как могло бы показаться по аналогии с английским." }
