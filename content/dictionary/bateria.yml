etymology: "Из французского BATTERIE, от BATTRE «бить», и первоначальное значение было военным: батарея как набор орудий, которые бьют. Отсюда через идею набора однородных предметов слово перешло на набор гальванических элементов, то есть на электрическую батарею, и русский прошёл этот путь вместе с польским. Сантехническое значение — польское развитие того же образа набора: смеситель есть соединение двух подводок, горячей и холодной, в один узел. Поэтому для поляка BATERIA в ванной так же естественна, как батарея орудий, а для русского это разные вещи. Корень BATTRE виден и в словах BATALIA, BATUTA, и в русском «батальон»."
memory: "Третье значение русский не угадает: bateria — это ещё и смеситель, кран. Bateria łazienkowa «смеситель для ванной». А отопительная батарея по-польски kaloryfer или grzejnik. Класс на -ia: baterii служит родительному, дательному и местному; старая форма родительного множественного — bateryj. Батарейка села — bateria padła."
