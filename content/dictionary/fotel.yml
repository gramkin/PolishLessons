notes:
  - { kind: false-friend, text: "Русского слова с таким корнем нет, и запоминать приходится заново, зато различение внутри польского простое и важное. FOTEL — это кресло, с подлокотниками и мягкое. KRZESŁO — обычный стул, со спинкой и без подлокотников. TABORET — табурет. STOŁEK — тоже табурет, а в переносном значении должность, и в этом смысле он отвечает русскому «креслу» наравне с FOTEL. Переносное значение у FOTEL тоже есть и совпадает с русским: FOTEL PREZESA, FOTEL MINISTRA — о должности. В самолёте и в машине сиденье называется FOTEL, а не SIEDZENIE, если речь о кресле целиком." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — FOTELU, с окончанием -U, потому что основа кончается на мягкое L; формы на -E у таких слов не бывает, и в этом отличие от CZARZE и TUZINIE, где основа твёрдая и окончание -E требует смягчения. Родительный множественного — FOTELI, тоже с мягким окончанием. Именительный и винительный множественного — FOTELE. Винительный единственного равен именительному. Уменьшительное FOTELIK означает детское автомобильное кресло и в этом значении обязательно." }
  - { kind: pronunciation, text: "Читается «фо́тель», два слога, ударение на первом. Буквосочетание FO звучит как в русском, а конечное L заметно мягче русского твёрдого «л» и передаётся как «ль». В форме FOTELA слышно «фоте́ля», в форме FOTELU — «фоте́лю», то есть мягкость сохраняется во всех формах. В форме FOTELEM звучит «фоте́лем». Во множественном FOTELE слышно «фоте́ле», а FOTELI — «фоте́ли», и две эти формы различаются только последним звуком." }
  - { kind: register, text: "Слово нейтральное и бытовое. Устойчивые сочетания: FOTEL BUJANY «кресло-качалка», FOTEL BIUROWY «офисное кресло», FOTEL DENTYSTYCZNY «зубоврачебное кресло», FOTELIK SAMOCHODOWY «детское автокресло». Переносное употребление о должности распространено в газетном языке: WALKA O FOTEL PREZYDENTA. Разговорное ROZSIĄŚĆ SIĘ W FOTELU значит «развалиться в кресле». Слово часто встречается в объявлениях о мебели, и приезжему полезно отличать его от KANAPA «диван» и WERSALKA «диван-кровать»." }
