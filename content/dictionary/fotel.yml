etymology: "Из французского FAUTEUIL, пришедшего в польский через немецкое посредство и сокращённого до FOTEL. Само французское слово германского происхождения: оно восходит к франкскому FALDISTOL «складной стул», сложению из корней «складывать» и «стул», и тот же FALDISTOL дал немецкое FALTSTUHL и итальянское FALDISTORIO. То есть предок кресла — складной табурет, и во второй части слова сидит то же STUHL, что в польском STOŁEK и в русском «стуле». Русский в этом месте взял другое слово: «кресло» — исконное, от праславянского *krěslo, и родственно оно скорее «кресать» в смысле «тесать, вырубать». Так два языка назвали один предмет с совершенно разных сторон."
memory: "Кресло это fotel, обычный стул — krzesło, табурет — taboret или stołek. Слово французское, fauteuil, но в основе германское faldistol «складной стул», где вторая часть та же, что в русском «стуле» и в польском stołek. Переносно как по-русски: fotel prezesa о должности. Местный fotelu на -u, потому что основа мягкая, а не на -e со смягчением, как czarze и tuzinie. Детское автокресло — fotelik."
idioms:
  - { pl: "fotel bujany", ru: "кресло-качалка" }
