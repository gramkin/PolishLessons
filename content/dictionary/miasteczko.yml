notes:
  - { kind: usage, text: "Это уменьшительное от MIASTO «город», и польский строит такие формы охотно: miasto — miasteczko, okno — okienko, drzewo — drzewko. Русский на том же месте скажет «городок», но суффикс выберет другой, -ок вместо -ечко. Смысл у польского слова не только размерный: miasteczko это городок со своим укладом, а не просто маленький город." }
  - { kind: usage, text: "Родительный множественного — MIASTECZEK, с беглым e, которого в основе нет: miasteczk- плюс нулевое окончание даёт вставное e между k и поредевшим концом. Тот же механизм в okienko — okienek и matka — matek. Беглая гласная появляется именно там, где окончание исчезает." }
