  - { pl: "mieszczanin", ru: "горожанин, мещанин", relation: root }
  - { pl: "wieś", ru: "деревня", relation: antonym, id: wies }
etymology: "Уменьшительное от miasto, а то из праславянского *město «место». Тут кроется старое расхождение: у поляков слово ушло в значение «город», а у нас осталось «место». Русское «местечко» — буквально то же самое слово, и в значении небольшого городка оно у нас тоже было в ходу, особенно о городках бывшей Речи Посполитой."
memory: "miasteczko — уменьшительное от miasto, то есть «городок». А родительный множественного с беглым e: kilka miasteczek, как okienek от okienko."
