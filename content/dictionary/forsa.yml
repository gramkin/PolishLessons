pos: noun
pron: { cyr: "фо́рса" }
senses:
  - id: money
    ru: "бабки, бабло (разговорное о деньгах)"
    examples:
      - pl: "Dawaj forsę!"
        ru: "Давай деньги!"
        source: { kind: translated, id: 6729583 }
      - pl: "Ma forsy jak lodu."
        ru: "У него денег куры не клюют."
