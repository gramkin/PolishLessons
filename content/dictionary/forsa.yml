      - pl: "Forsa się skończyła."
        ru: "Деньги кончились."
        source: { kind: authored }
  - id: well-off
    ru: "być przy forsie — быть при деньгах"
    examples:
      - pl: "Jest przy forsie."
        ru: "Он при деньгах."
        source: { kind: authored }
      - pl: "Od nowej pracy jest przy forsie."
        ru: "С новой работы он при деньгах."
        source: { kind: authored }
      - pl: "Nie jestem teraz przy forsie."
        ru: "Я сейчас не при деньгах."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово неисчисляемое: forsa значит деньги вообще. Формы множественного числа (fors, forsach, forsami, forsom) таблица строит механически, но в речи их не употребляют, поэтому они оставлены без примеров." }
  - { kind: register, text: "Forsa — разговорное слово, примерно как русские «бабки» или «бабло». Нейтральное — pieniądze, официальное — środki." }
  - { kind: usage, text: "Оборот mieć forsy jak lodu значит «денег куры не клюют», буквально «иметь денег как льда»." }
  - { kind: government, text: "być przy forsie «быть при деньгах» — предлог przy с предложным падежом, форма forsie." }
  - { kind: false-friend, text: "Несмотря на вид, слово не связано с русским «форсить»: оно пришло из французского force «сила» в значении «средства, наличность»." }
collocations:
  - { pl: "mieć forsę", ru: "иметь деньги" }
  - { pl: "być przy forsie", ru: "быть при деньгах" }
  - { pl: "gruba forsa", ru: "большие деньги" }
etymology: "Из французского force «сила» через немецкий: слово пришло в значении «средства, наличность». Русское «форсить» восходит к тому же французскому корню, но другим путём и в другом значении."
memory: "forsa — разговорные «бабки», нейтрально pieniądze. Два оборота стоит запомнить целиком: mieć forsy jak lodu «денег куры не клюют» и być przy forsie «быть при деньгах»."
