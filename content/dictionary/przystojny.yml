notes:
  - { kind: false-friend, text: "Слово применяют почти только к мужчинам: przystojny mężczyzna. Красивая женщина — piękna или ładna. Русское «красивый» не делает такого различия." }
  - { kind: usage, text: "Корпус подтверждает асимметрию: есть даже вопрос Dlaczego kobiety nie mogą być przystojne, a mężczyźni piękni? — «Почему женщины не могут быть przystojne, а мужчины piękni?»" }
  - { kind: government, text: "После być — творительный падеж: jest przystojnym mężczyzną." }
  - { kind: usage, text: "Сравнительная степень — przystojniejszy: z każdym rokiem jesteś coraz przystojniejszy." }
