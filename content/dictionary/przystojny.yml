etymology: "От przystać «подобать»: буквально «тот, кому подобает», то есть видный, статный. Русское «статный» передаёт тот же образ."
memory: "przystojny — «красивый», но почти только о мужчине: przystojny mężczyzna. Красивая женщина — piękna или ładna."
