  - { kind: usage, text: "Сравнительная степень — przystojniejszy: z każdym rokiem jesteś coraz przystojniejszy." }
  - { kind: usage, text: "Слово прежде всего о мужчинах. О женщине przystojna сказать можно, но это значит «видная, статная», а не просто «красивая»: для этого есть ładna и piękna." }
