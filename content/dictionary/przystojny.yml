# review
id: przystojny
format: 2
lemma: "przystojny"
rank: 1840
pos: adj
pron: { cyr: "пшысто́йны" }
senses:
  - id: handsome
    ru: "красивый (о мужчине), статный"
    examples:
      - pl: "Jest przystojny."
        ru: "Он красивый."
        source: { kind: tatoeba, id: 12186622 }
      - pl: "Tom jest przystojny."
        ru: "Том красивый."
        source: { kind: translated, id: 2120143 }
      - pl: "Pan młody jest przystojny."
        ru: "Жених красив."
        source: { kind: tatoeba, id: 12678782 }
  - id: handsome-man
    ru: "красивый мужчина"
    examples:
      - pl: "Jest przystojnym mężczyzną."
        ru: "Он красивый мужчина."
        source: { kind: translated, id: 826676 }
      - pl: "Tom jest przystojnym młodym człowiekiem."
        ru: "Том — красивый молодой человек."
        source: { kind: translated, id: 3951259 }
      - pl: "Spójrz na tego przystojnego chłopca."
        ru: "Посмотри на этого красивого мальчика."
        source: { kind: translated, id: 592346 }
notes:
  - { kind: false-friend, text: "Слово применяют почти только к мужчинам: przystojny mężczyzna. Красивая женщина — piękna или ładna. Русское «красивый» не делает такого различия." }
  - { kind: usage, text: "Корпус подтверждает асимметрию: есть даже вопрос Dlaczego kobiety nie mogą być przystojne, a mężczyźni piękni? — «Почему женщины не могут быть przystojne, а мужчины piękni?»" }
  - { kind: government, text: "После być — творительный падеж: jest przystojnym mężczyzną." }
  - { kind: usage, text: "Сравнительная степень — przystojniejszy: z każdym rokiem jesteś coraz przystojniejszy." }
  - { kind: usage, text: "Слово прежде всего о мужчинах. О женщине przystojna сказать можно, но это значит «видная, статная», а не просто «красивая»: для этого есть ładna и piękna." }
