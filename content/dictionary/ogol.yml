# review
id: ogol
format: 2
lemma: "ogół"
rank: 486
pos: noun
pron: { cyr: "о́гуу" }
senses:
  - id: at-all
    ru: "вообще (в обороте w ogóle)"
    examples:
      - pl: "Jesteś w ogóle głodna?"
        ru: "Ты вообще голодная?"
        source: { kind: tatoeba, id: 9637861 }
      - pl: "Nie mam w ogóle pieniędzy."
        ru: "У меня совсем нет денег."
        source: { kind: tatoeba, id: 4643870 }
      - pl: "Kim ty w ogóle jesteś?"
        ru: "Кто ты вообще такой?"
        source: { kind: tatoeba, id: 11260312 }
  - id: generally
    ru: "в целом, вообще говоря; общность"
    examples:
      - pl: "Alpy są na ogół niższe po stronie włoskiej."
        ru: "Альпы в целом ниже с итальянской стороны."
        source: { kind: translated, id: 12368123 }
      - pl: "Mówiąc ogółem, psy są bardziej wierne niż koty."
        ru: "Вообще говоря, собаки вернее кошек."
        source: { kind: translated, id: 10458846 }
      - pl: "Język jest własnością ogółu."
        ru: "Язык — достояние всех."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Само существительное в живой речи редко. Вы встретите прежде всего застывшие обороты: w ogóle «вообще», na ogół «как правило», ogółem «в общей сложности»." }
  - { kind: usage, text: "w ogóle nie — «вообще не»: Nie piję kawy w ogóle «Я вообще не пью кофе»." }
  - { kind: usage, text: "na ogół значит «обычно, как правило»: Na ogół wstaję o szóstej." }
  - { kind: usage, text: "Как существительное ogół значит «все вместе, общность»: własność ogółu «достояние всех»." }
collocations:
  - { pl: "w ogóle", ru: "вообще" }
  - { pl: "na ogół", ru: "как правило" }
  - { pl: "ogółem", ru: "в общей сложности" }
  - { pl: "w ogóle nie", ru: "вообще не" }
etymology: "Старопольское oguł, из праславянского *o(b)gulъ «то, что окружено, целое»."
memory: "ogół — слово, которое в живой речи почти всегда прячется в оборотах: w ogóle «вообще», na ogół «как правило», ogółem «в общей сложности». Само существительное значит «общность, все вместе»."
idioms:
  - { pl: "w ogóle", ru: "вообще" }
  - { pl: "na ogół", ru: "как правило" }
  - { pl: "ogółem", ru: "в общей сложности" }
