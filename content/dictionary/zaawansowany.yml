notes:
  - { kind: false-friend, text: "Слово, от которого всё это образовано, один из самых обидных ложных друзей: AWANS по-польски значит «повышение по службе», а не «аванс». DOSTAŁ AWANS означает «его повысили», и денег тут нет никаких. Русский «аванс», то есть предоплата, по-польски ZALICZKA. Глагол AWANSOWAĆ значит «получить повышение», а ZAAWANSOWANY — «продвинувшийся», отсюда «продвинутый» о курсе и «запущенный» о болезни." }
  - { kind: usage, text: "Одиннадцать форм. По происхождению это причастие от ZAAWANSOWAĆ, но ведёт себя как обычное прилагательное, и степени сравнения у него описательные: BARDZIEJ ZAAWANSOWANY, NAJBARDZIEJ ZAAWANSOWANY. Мужско-личная форма множественного числа ZAAWANSOWANI совершенно обиходна в школьном и спортивном языке: ZAAWANSOWANI UCZNIOWIE, ZAAWANSOWANI GRACZE, и она же работает как существительное, GRUPA DLA ZAAWANSOWANYCH." }
  - { kind: government, text: "На продвинутом курсе — предлог NA с местным падежом: NA KURSIE ZAAWANSOWANYM. В запущенной стадии — предлог W с местным: W STADIUM ZAAWANSOWANYM, причём STADIUM здесь не склоняется, как все латинские слова на -UM в единственном числе. Продвинутый в чём-либо — ZAAWANSOWANY W CZYMŚ, предлог W с местным падежом: ZAAWANSOWANY W NAUCE." }
  - { kind: pronunciation, text: "Читается «заавансова́ны», шесть слогов, ударение на предпоследнем. Главная трудность в начале: две буквы A подряд произносятся раздельно, в два слога, «за-а», а не сливаются в один долгий звук. Дальше идёт «ван-со-ва-ны» без всяких неожиданностей. В существительном AWANS конечное S звучит глухо, «а́ванс», с ударением на первом слоге, как и положено двусложному слову." }
  - { kind: register, text: "Слово нейтральное и частое в трёх кругах. В обучении: KURS ZAAWANSOWANY, POZIOM ZAAWANSOWANY, GRUPA ZAAWANSOWANA — так подписаны все языковые курсы в Польше. В технике: ZAAWANSOWANE TECHNOLOGIE, ZAAWANSOWANE METODY. В медицине, и здесь оно звучит тревожно: ZAAWANSOWANE STADIUM CHOROBY, ZAAWANSOWANY NOWOTWÓR. Оборот W ZAAWANSOWANYM WIEKU вежливее, чем STARY." }
