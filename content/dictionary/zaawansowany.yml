etymology: "От ZAAWANSOWAĆ, от AWANS, а то из французского AVANCE «продвижение вперёд», от народнолатинского ABANTE «впереди». Русский взял то же французское слово, но удержал за ним только денежный смысл: «аванс» это выданное вперёд. Польский пошёл за исходным значением движения вперёд и получил «повышение по службе», а в причастии — «продвинутый». Один французский корень, два языка, и почти не пересекающиеся области употребления."
memory: "Ключ в корне: awans это «повышение по службе», а не «аванс». Dostał awans значит «его повысили»; русский «аванс» по-польски zaliczka. Отсюда zaawansowany — «продвинувшийся», то есть «продвинутый» о курсе, «передовой» о технологии и «запущенный» о болезни. Оборот w zaawansowanym wieku вежливее, чем stary. Читается «заавансова́ны», и две a в начале произносятся раздельно, в два слога."
idioms:
  - { pl: "w zaawansowanym wieku", ru: "в преклонном возрасте" }
