# review
id: przeciw
format: 2
lemma: "przeciw"
rank: 1483
pos: prep
pron: { cyr: "пше́циф" }
senses:
  - id: against
    ru: "против (в споре, голосовании, борьбе)"
    examples:
      - pl: "Tom jest za, Mary przeciw."
        ru: "Том за, а Мэри против."
        source: { kind: tatoeba, id: 2406028 }
      - pl: "Jestem przeciw."
        ru: "Я против."
        source: { kind: translated, id: 5081416 }
      - pl: "Wszystkie cywilizowane kraje są przeciw wojnie."
        ru: "Все цивилизованные страны против войны."
        source: { kind: tatoeba, id: 351565 }
  - id: remedy
    ru: "против, от (о средстве, прививке)"
    examples:
      - pl: "Jesteś za czy przeciw aborcji?"
        ru: "Ты за или против абортов?"
        source: { kind: tatoeba, id: 352001 }
      - pl: "Szczepionka przeciw grypie jest darmowa."
        ru: "Прививка от гриппа бесплатная."
        source: { kind: authored }
notes:
  - { kind: government, text: "przeciw требует дательного падежа: przeciw wojnie «против войны», przeciw komuś «против кого-то». Русское «против» берёт родительный, так что падеж приходится переучивать." }
  - { kind: usage, text: "Почти всегда взаимозаменяем с przeciwko, и в живой речи przeciwko звучит чаще; управление у обоих одинаковое." }
  - { kind: usage, text: "Без дополнения значит просто «против» как позиция при голосовании: Jestem przeciw «Я против», Kto był przeciw? «Кто был против?»." }
  - { kind: usage, text: "В медицине — «от»: szczepionka przeciw grypie «прививка от гриппа», lek przeciw bólowi «обезболивающее»." }
collocations:
  - { pl: "być przeciw", ru: "быть против" }
  - { pl: "przeciw wojnie", ru: "против войны" }
  - { pl: "szczepionka przeciw grypie", ru: "прививка от гриппа" }
etymology: "Праславянское *protivъ — то же слово, что русское «против»; польское начало развилось в prze-."
memory: "przeciw — «против», но падеж другой: по-русски «против войны» (родительный), по-польски przeciw wojnie (дательный). Чаще в речи звучит przeciwko, управление у него такое же. А Jestem przeciw — это «Я против» при голосовании."
idioms:
