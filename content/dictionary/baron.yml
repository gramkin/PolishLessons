notes:
  - { kind: false-friend, text: "BARON — «барон»: и титул, и «магнат, воротила». Две формы множественного: BARONOWIE — о титулованных особах, BARONI — о «баронах» в переносном смысле: BARONI PARTYJNI, BARONI NARKOTYKOWI." }
  - { kind: usage, text: "Мужской род, лицо. Множественное — BARONOWIE или BARONI. Местный и звательный — BARONIE: PANIE BARONIE. Баронесса — BARONOWA или BARONESSA." }
  - { kind: government, text: "Титул барона — TYTUŁ BARONA, родительный. Наркобарон — BARON NARKOTYKOWY. Обращение — PANIE BARONIE." }
  - { kind: pronunciation, text: "Читается «ба́рон», ударение на первом слоге. BARONIE — «баро́не»." }
