# review
id: odrzucic
format: 2
lemma: "odrzucić"
rank: 1742
pos: verb
pron: { cyr: "оджу́циць" }
senses:
  - id: reject
    ru: "отвергнуть, отклонить"
    examples:
      - pl: "Odrzucił ofertę bez wahania."
        ru: "Он отверг предложение без колебаний."
        source: { kind: authored }
      - pl: "Wniosek odrzucono jednogłośnie."
        ru: "Заявление отклонили единогласно."
        source: { kind: authored }
      - pl: "Odrzuceni kandydaci złożyli odwołania."
        ru: "Отвергнутые кандидаты подали апелляции."
        source: { kind: authored }
  - id: throw-aside
    ru: "отбросить (физически)"
    examples:
      - pl: "Odrzuć koc, jest ciepło."
        ru: "Отбрось одеяло, тепло."
        source: { kind: authored }
      - pl: "Odrzuciła włosy do tyłu."
        ru: "Она отбросила волосы назад."
        source: { kind: authored }
  - id: rejection
    ru: "odrzucenie — отклонение, отказ"
    examples:
      - pl: "Odrzucenie wniosku zaskoczyło wszystkich."
        ru: "Отклонение заявления удивило всех."
        source: { kind: authored }
      - pl: "Po odrzuceniu wniosku złożył apelację."
        ru: "После отклонения заявления он подал апелляцию."
        source: { kind: authored }
notes:
  - { kind: government, text: "Отвергают ВЕЩЬ в винительном: odrzucić wniosek, odrzucić ofertę, odrzucić pozew. А отказывают ЧЕЛОВЕКУ другим глаголом и в дательном: odmówić KOMUŚ. Русский делит так же («отклонить заявление» против «отказать кому-то»), поэтому достаточно не смешивать два польских глагола: odrzucić о деле, odmówić о человеке." }
  - { kind: false-friend, text: "Корень rzucić прозрачного русского родственника не имеет — русский на это значение взял другой корень, «бросить», — и об этом же сказано на карточке porzucić. Зато приставка od- полностью отвечает русскому «от-», поэтому odrzucić читается как «отбросить» и «отвергнуть» без усилий." }
  - { kind: usage, text: "Страдательное причастие идёт по знакомому образцу -ony/-eni: odrzucony, но мужско-личное множественное odrzuceni. Тот же ряд уже встречался в zatrudniony — zatrudnieni и podzielony — podzieleni. Несовершенная пара — odrzucać." }
  - { kind: pronunciation, text: "Приставка od- отвечает русскому «от-» и несёт отделение или отказ: odciąć «отрезать», odrzucić «отвергнуть», odejść «отойти», odmówić «отказать». Это одна из самых прозрачных польских приставок для русскоязычного, и опираться на неё можно смело." }
collocations:
  - { pl: "odrzucić ofertę", ru: "отклонить предложение" }
  - { pl: "odrzucić wniosek", ru: "отклонить заявление" }
  - { pl: "czuć się odrzuconym", ru: "чувствовать себя отвергнутым" }
family:
  - { pl: "rzucić", ru: "бросить", relation: root, id: rzucic }
  - { pl: "odrzut", ru: "отдача; отброс", relation: derived }
  - { pl: "odrzucać", ru: "отвергать, отклонять", relation: aspect }
etymology: "Приставка od- плюс rzucić, от праславянского *rutiti «валить, бросать». Русский на это значение пошёл другим корнем («бросить»), так что корневого соответствия нет, и выдумывать его не стоит. Приставка же прозрачна: od- это «от-», откуда и «отбросить», и переносное «отвергнуть». Из того же гнезда odrzut «отдача» и wyrzut «упрёк»."
memory: "odrzucić — «отбросить» и «отвергнуть». Приставка od- это «от-», корень rzucić русского родственника не имеет. И помните разницу: odrzucić wniosek о деле, но odmówić komuś о человеке."
idioms:
  - { pl: "odrzucić ofertę", ru: "отклонить предложение" }
  - { pl: "odrzucić wszelkie wątpliwości", ru: "отбросить все сомнения" }
