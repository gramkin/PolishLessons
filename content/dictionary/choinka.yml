# review
id: choinka
format: 2
lemma: "choinka"
rank: 5336
pos: noun
pron: { cyr: "хои́нка" }
senses:
  - id: xmas-tree
    ru: "ёлка (рождественская)"
    examples:
      - pl: "Ubraliśmy choinkę w Wigilię rano."
        ru: "Мы нарядили ёлку утром в Сочельник."
        source: { kind: authored }
      - pl: "Pod choinką leżały prezenty."
        ru: "Под ёлкой лежали подарки."
        source: { kind: authored }
      - pl: "Kupiliśmy żywą choinkę."
        ru: "Мы купили живую ёлку."
        source: { kind: authored }
  - id: young-tree
    ru: "ёлочка (молодое дерево)"
    examples:
      - pl: "W lesie rosły młode choinki."
        ru: "В лесу росли молодые ёлочки."
        source: { kind: authored }
      - pl: "Posadził choinkę przed domem."
        ru: "Он посадил ёлочку перед домом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "В Польше ёлку ставят к Рождеству, а не к Новому году: CHOINKA — главный знак сочельника, WIGILIA. Подарки кладут POD CHOINKĘ, «под ёлку», и так же говорят о самом подарке: CO DOSTAŁEŚ POD CHOINKĘ? — «что тебе подарили на Рождество?». А URWAĆ SIĘ Z CHOINKI, «сорваться с ёлки», — наше «с луны свалиться»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: NA CHOINCE. В родительном множественного беглое E: CHOINEK. Взрослое дерево в лесу — чаще ŚWIERK или JODŁA, а CHOINKA — молодое деревце или праздничная ёлка." }
  - { kind: government, text: "Под ёлку — POD CHOINKĘ, винительный: направление. Под ёлкой — POD CHOINKĄ, творительный: место. На ёлке — NA CHOINCE, местный. Нарядить ёлку — UBRAĆ CHOINKĘ, буквально «одеть ёлку»." }
  - { kind: pronunciation, text: "Читается «хои́нка», три слога, ударение на втором. O и I произносятся раздельно, как в KRAINA «краи́на». В форме CHOINCE: «хои́нце»." }
collocations:
  - { pl: "ubierać choinkę", ru: "наряжать ёлку" }
  - { pl: "sztuczna choinka", ru: "искусственная ёлка" }
  - { pl: "bombki na choinkę", ru: "ёлочные шары" }
family:
  - { pl: "choinkowy", ru: "ёлочный", relation: derived }
  - { pl: "choina", ru: "хвойное дерево; хвоя", relation: root }
  - { pl: "chojak", ru: "сосна, ёлка (разг.)", relation: derived }
etymology: "От CHOINA «хвойное дерево», праславянского корня, общего с русским «хвоя»: польский потерял в нём W. Уменьшительный суффикс -KA сделал из «хвои» праздничную ёлочку."
memory: "Choinka — ёлка, рождественская: ubrać choinkę — нарядить ёлку. Читается «хои́нка». Pod choinkę — подарок на Рождество. Urwać się z choinki — с луны свалиться. Корень тот же, что в «хвоя»."
idioms:
  - { pl: "urwać się z choinki", ru: "с луны свалиться" }
  - { pl: "pod choinkę", ru: "в подарок на Рождество" }
