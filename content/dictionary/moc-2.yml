# review
id: moc-2
format: 2
lemma: "moc"
rank: 541
pos: noun
pron: { cyr: "моц" }
senses:
  - id: power
    ru: "сила, мощь"
    note: "Омоним глагола móc «мочь» — различает контекст."
    examples:
      - pl: "Niech moc będzie z tobą."
        ru: "Да пребудет с тобой Сила."
        source: { kind: translated, id: 2244507 }
      - pl: "Ta idea ma w sobie moc."
        ru: "В этой идее есть сила."
        source: { kind: translated, id: 520021 }
      - pl: "W oczach Tom'a jest moc."
        ru: "В глазах Тома есть сила."
        source: { kind: translated, id: 6154768 }
  - id: in-power
    ru: "w czyjejś mocy — в чьих-либо силах, во власти"
    note: "zrobię, co w mojej mocy «сделаю всё, что в моих силах»."
    examples:
      - pl: "Bóg mi świadkiem, zrobiliśmy wszystko, co w naszej mocy."
        ru: "Бог свидетель, мы сделали всё, что могли."
        source: { kind: tatoeba, id: 3656727 }
      - pl: "Zrobię, co w mojej mocy."
        ru: "Я сделаю всё, что в моих силах."
        source: { kind: translated, id: 520042 }
      - pl: "Nie lekceważ mojej mocy."
        ru: "Не недооценивай мою силу."
        source: { kind: translated, id: 600698 }
notes:
  - { kind: false-friend, text: "Омоним: moc — существительное «сила, мощь», а móc — глагол «мочь». Отличает контекст: Niech moc będzie z tobą «Да пребудет с тобой Сила», но nie mogę «я не могу»." }
  - { kind: usage, text: "Самый частый оборот — zrobić, co w czyjejś mocy «сделать всё, что в чьих-либо силах»." }
  - { kind: usage, text: "Разговорное moc czegoś значит «уйма, масса»: moc ludzi «уйма народу»." }
  - { kind: usage, text: "Прилагательное — mocny «сильный, крепкий», наречие — mocno «сильно»." }
collocations:
  - { pl: "Niech moc będzie z tobą", ru: "Да пребудет с тобой Сила" }
  - { pl: "w mojej mocy", ru: "в моих силах" }
  - { pl: "z całą mocą", ru: "со всей силой" }
  - { pl: "moc ludzi", ru: "уйма народу" }
family:
  - { pl: "móc", ru: "мочь", relation: root }
  - { pl: "mocny", ru: "сильный", relation: derived }
  - { pl: "mocno", ru: "сильно", relation: derived }
etymology: "От праславянского *mogtь «сила, могущество» — то же слово, что русские «мощь» и «мочь» в значении силы."
memory: "moc — «сила, мощь», и это полный омоним глагола móc «мочь»: Niech moc będzie z tobą «Да пребудет с тобой Сила», но nie mogę «я не могу». Различает только контекст. Самый частый оборот — zrobię, co w mojej mocy «сделаю всё, что в моих силах». Корень тот же, что в русских «мощь» и «могучий», а прилагательное — mocny «сильный, крепкий»."
idioms:
