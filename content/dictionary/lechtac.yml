  - { kind: government, text: "Кого — винительный, где — W + винительный или POD + творительный: ŁECHTAĆ KOGOŚ W STOPY, POD PACHAMI. В переносном смысле — ŁECHTAĆ CZYJĄŚ PRÓŻNOŚĆ, AMBICJĘ «тешить тщеславие, самолюбие»." }
  - { kind: register, text: "В прямом значении в быту чаще говорят ŁASKOTAĆ или детское GILGOTAĆ. ŁECHTAĆ особенно обычно в переносных оборотах: ŁECHTAĆ PRÓŻNOŚĆ, ŁECHTAĆ PODNIEBIENIE." }
  - { kind: pronunciation, text: "Ł читается «у», CH — «х»: «уэ́хтаць». ŁECHCĘ — «уэ́хцэ», ŁECHCZĘ — «уэ́хчэ»." }
