notes:
  - { kind: false-friend, text: "Значение совпадает, а род — нет, и это единственный день недели, где два языка расходятся. PIĄTEK мужского рода: TEN PIĄTEK, DŁUGI PIĄTEK, а русская «пятница» женского. Поэтому PIĄTKOWY WIECZÓR «пятничный вечер» согласуется по мужскому роду, и сказать TA PIĄTEK нельзя. Остальные дни ведут себя предсказуемо: PONIEDZIAŁEK, WTOREK, CZWARTEK мужского рода, как и русские «понедельник», «вторник», «четверг»; ŚRODA, SOBOTA, NIEDZIELA женского, как «среда» и «суббота». Выпадает из ряда только пятница, и запомнить это стоит отдельно." }
  - { kind: government, text: "Мужской род, неодушевлённое. День недели вводится предлогом W с винительным, который равен именительному: W PIĄTEK «в пятницу», ровно как в русском. Местный падеж PIĄTKU с предлогом W не употребляется: W PIĄTKU сказать нельзя. Родительный тоже PIĄTKU: DO PIĄTKU «до пятницы», OD PIĄTKU «с пятницы». Повторяемость — творительный множественного без предлога: PIĄTKAMI «по пятницам», где русский берёт предлог «по» с дательным. Это та же конструкция, что ŚRODAMI на карточке среды." }
  - { kind: pronunciation, text: "Читается «пёнтэк», ударение на предпоследнем слоге из двух. Буква Ą перед T звучит «он» с носовым призвуком, а предшествующее P смягчается перед ним, отсюда «пён». В родительном и местном PIĄTKU носовой сохраняется: «пёнтку». В именительном множественного PIĄTKI звучит «пёнтки». Беглая гласная E выпадает во всех косвенных формах: PIĄTEK, но PIĄTKU, PIĄTKIEM — то же явление, что в русском «пятнице» нет, зато есть в «ветер — ветра»." }
  - { kind: usage, text: "Названия дней пишутся с маленькой буквы, как и в русском; с большой — только в названиях праздников: WIELKI PIĄTEK «Великая пятница». Нужные обороты: W PIĄTEK, DO PIĄTKU, OD PIĄTKU, W KAŻDY PIĄTEK «каждую пятницу», W ZESZŁY PIĄTEK «в прошлую пятницу», W PRZYSZŁY PIĄTEK «в следующую». Прилагательное PIĄTKOWY «пятничный». Не путать с PIĄTKA, отдельным словом женского рода: это и цифра пять, и школьная пятёрка, и группа из пяти человек." }
