etymology: "От PIĄTY «пятый» с суффиксом -EK: пятница это пятый день, если считать неделю от воскресенья. Русская «пятница» сделана из того же числительного «пять», только другим суффиксом, женским, и вот откуда расхождение в роде: польский взял мужской -EK, как в WTOREK от WTÓRY «второй» и CZWARTEK от CZWARTY, а русский для этого дня выбрал женский «-ица». Любопытно, что в русском тот же мужской тип тоже есть, во «вторнике» и «четверге», так что из ряда выпадает именно пятница, и притом в одном языке. Числительное PIĄTY восходит к праславянскому *pętь, давшему и русское «пять», и носовой Ą в польском стоит ровно там, где русский потерял носовое звучание."
memory: "Мужского рода, в отличие от русской «пятницы»: ten piątek, piątkowy wieczór. Единственный день недели, где род расходится; остальные совпадают. В пятницу — w piątek, винительный; «по пятницам» — одним словом piątkami, как środami. Беглое E выпадает: piątek, но piątku, piątkiem. От piąty «пятый», как wtorek от wtóry и czwartek от czwarty."
