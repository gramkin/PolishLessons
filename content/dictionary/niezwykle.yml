notes:
  - { kind: usage, text: "Три формы, и образец правильный: NIEZWYKLE, NIEZWYKLEJ, NAJNIEZWYKLEJ — сравнительная на -ej, превосходная с naj-. Это второе правильное наречие в словаре после SŁUSZNIE, и устроены они одинаково. Степени здесь словарём засвидетельствованы, но смотрятся они странно, и причина в том, что у слова два смысла: буквальное «необычно», где степени естественны, и усилительное «крайне», где сравнивать нечего — niezwykle ważny значит просто «очень важный»." }
  - { kind: false-friend, text: "Русский развёл эти два смысла по двум словам, польский держит их в одном. NIEZWYKLE значит и «необычно» (буквально, о странной манере), и «необычайно, крайне» (как усилитель перед прилагательным). Поэтому NIEZWYKLE TRUDNY — это «крайне трудный», а не «необычно трудный»; усилительное чтение в польском обычнее. Угадывать по русскому тут опасно: «необычно» и «необычайно» для русского разные слова, для польского одно." }
  - { kind: usage, text: "Слово построено приставкой NIE- от ZWYKŁY «обычный», и его положительную пару стоит выучить рядом: ZWYKLE значит «обычно, как правило» и само по себе частотно. Пара выходит зеркальной — zwykle и niezwykle, «обычно» и «необычайно». Заметьте, что приставка nie- в польском пишется с прилагательными и наречиями слитно, как здесь, и в этом польский с русским согласны." }
