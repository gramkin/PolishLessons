etymology: "Приставка nie- и ZWYKŁY «обычный, привычный», от ZWYKNĄĆ «привыкнуть», из праславянского *vyknǫti — того же корня, что русские «привыкнуть», «навык» и «обычай». Русское «необычайно» построено из тех же частей и того же корня, только через «обычай», так что пара niezwykle и «необычайно» совпадает по устройству целиком, несмотря на разные концовки."
memory: "Три формы, правильный образец: niezwykle — niezwyklej — najniezwyklej. Чаще всего это усилитель «крайне», а не буквальное «необычно». Пара к нему — zwykle «обычно»."
