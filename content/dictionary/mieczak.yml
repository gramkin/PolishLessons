etymology: "От MIĘKKI «мягкий»: мягкотелое животное. Русское «мягкий», «мягкотелый» — того же корня."
memory: "Mięczak — моллюск и «тряпка». Nie bądź mięczakiem! — не будь тряпкой! Mięczaki — моллюски, mięczacy — слабаки. Читается «мэ́нчак»."
idioms:
