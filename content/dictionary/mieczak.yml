notes:
  - { kind: false-friend, text: "MIĘCZAK — «моллюск», от MIĘKKI «мягкий». В разговоре — «слабак, тряпка» о человеке. Во множественном различие: MIĘCZAKI — моллюски, MIĘCZACY — слабаки." }
  - { kind: register, text: "О человеке — пренебрежительное: NIE BĄDŹ MIĘCZAKIEM! — «не будь тряпкой!». В биологии — нейтральный термин." }
  - { kind: usage, text: "Мужской род, одушевлённый. Два множественных: MIĘCZAKI (животные) и MIĘCZACY (люди). Местный и звательный — MIĘCZAKU." }
  - { kind: pronunciation, text: "Читается «мэ́нчак»: Ę перед CZ — «эн», CZ — «ч». Ударение на первом слоге." }
collocations:
