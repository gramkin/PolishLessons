etymology: "Приставка ZA- плюс KŁÓCIĆ «мутить, взбалтывать»: сначала мутили воду, затем покой и порядок. От того же корня KŁÓTNIA «ссора»."
memory: "Zakłócać — «замутить» тишину: kłótnia za ścianą zakłóca mi sen."
