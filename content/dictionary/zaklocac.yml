notes:
  - { kind: false-friend, text: "ZAKŁÓCAĆ — «нарушать (покой, порядок), мешать», а не «заклёвывать» и не «закалывать». Корень тот же, что в KŁÓCIĆ SIĘ «ссориться»: изначально «мутить, взбалтывать». Помехи в эфире — ZAKŁÓCENIA." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZAKŁÓCIĆ: ZAKŁÓCIŁ CISZĘ «нарушил тишину». Спряжение на -AM: ZAKŁÓCAM, ZAKŁÓCASZ, ZAKŁÓCAJĄ. Мужско-личное страдательное ZAKŁÓCANI в карточку не включено: нарушают покой и сигнал, а не людей." }
  - { kind: government, text: "Что — винительный: ZAKŁÓCAĆ SPOKÓJ, PORZĄDEK, SEN. После отрицания — родительный: NIE ZAKŁÓCAĆ SPOKOJU. Табличка на двери отеля — PROSZĘ NIE ZAKŁÓCAĆ «просьба не беспокоить»." }
  - { kind: register, text: "Слово нейтрально-книжное, частое в праве и технике: ZAKŁÓCANIE PORZĄDKU PUBLICZNEGO «нарушение общественного порядка», ZAKŁÓCAĆ SYGNAŁ «глушить сигнал». В быту о людях чаще говорят PRZESZKADZAĆ." }
