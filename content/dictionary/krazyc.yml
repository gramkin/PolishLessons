etymology: "От KRĄG, из праславянского *krǫgъ, того же слова, что русский «круг». Носовое Ą в польском стоит там, где русский даёт У, и это соответствие регулярно для всего слоя слов с бывшим носовым: KRĄG и «круг», ZĄB и «зуб», DĄB и «дуб», RĘKA и «рука». Заметив его один раз, учащийся получает доступ к десяткам слов. Суффикс -YĆ образует глаголы состояния и многократного действия, и русскому отвечает в -ИТЬ: KRĄŻYĆ и «кружить». Медицинское значение «кровообращение» у отглагольного KRĄŻENIE появилось в девятнадцатом веке как калька латинского CIRCULATIO, и русский перевёл тот же термин по-своему, через «обращение», так что здесь языки разошлись в выборе образа: польский оставил круг, русский взял вращение."
memory: "Корень krąg — это «круг»: польское носовое ą отвечает русскому у регулярно (ząb/зуб, dąb/дуб, ręka/рука). Отсюда krążyć «кружить», krążenie krwi «кровообращение», okrągły «круглый». Переносный смысл совпадает: plotka krąży — «слух ходит». Пятьдесят две формы: сорок две от непереходного глагола плюс десять действительного причастия krążący. Страдательного причастия нет — кружат над чем-то, а не что-то."
