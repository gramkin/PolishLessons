notes:
  - { kind: false-friend, text: "Корень здесь KRĄG, и это русское «круг»: польское носовое Ą отвечает русскому У регулярно, как в ZĄB и «зубе», DĄB и «дубе», GŁĘBOKI и «глубоком». Значит, KRĄŻYĆ это «кружить», а KRĄŻENIE — «кружение» и, в медицине, «кровообращение»: KRĄŻENIE KRWI. Русское «кружить» и польское KRĄŻYĆ совпадают и в переносном смысле: PLOTKA KRĄŻY это «слух ходит», и образ движения по кругу в обоих языках один. Рядом стоят KRĄG «круг», KRĄŻEK «кружок, диск» и OKRĄGŁY «круглый», и всё это гнездо открывается, как только замечено соответствие Ą и У." }
  - { kind: usage, text: "Глагол несовершенного вида и непереходный, и поэтому в таблице пятьдесят две формы. Разбирается это так: сорок две формы даёт непереходный глагол сам по себе, и ещё десять добавляет действительное причастие KRĄŻĄCY, которое есть только у несовершенного вида. Страдательного причастия нет вовсе, потому что нет прямого дополнения: кружить можно над чем-то, а не что-то. Отглагольное существительное KRĄŻENIE входит в набор четырьмя формами. Совершенного соответствия у глагола нет: однократное движение по кругу выражают иначе, например OKRĄŻYĆ «обогнуть, объехать кругом»." }
  - { kind: government, text: "Непереходный. Над чем — предлог NAD с творительным: KRĄŻYĆ NAD MIASTEM. Вокруг чего — WOKÓŁ с родительным: KRĄŻYĆ WOKÓŁ TEMATU «кружить вокруг темы», то есть не говорить прямо. Где — PO с местным: KRĄŻYĆ PO MIEŚCIE. В переносном значении о слухах употребляется без предлога или с PO: PLOTKA KRĄŻY, WIADOMOŚĆ KRĄŻY PO MIEŚCIE. Устойчивое W OBIEGU KRĄŻĄ значит «в обороте обращаются», о деньгах и документах. Медицинское KRĄŻENIE KRWI «кровообращение» — стандартный термин." }
  - { kind: pronunciation, text: "Читается «кро́нжыць», два слога, ударение на первом. Носовое Ą перед Ż даёт «он». Буква Ż произносится как «ж», твёрдо. Буква Y это «ы», поэтому второй слог звучит «жыць», а не «жить». Конечное Ć это мягкое «ць». В форме KRĄŻĘ носовое Ę на конце звучит как «э» с лёгким носовым призвуком: «кро́нжэ». В причастии KRĄŻĄCY два носовых подряд: «кронжо́нцы»." }
