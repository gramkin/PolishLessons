etymology: "Отрицательная приставка NIE- и прилагательное SPRAWIEDLIWY, которое образовано от SPRAWA «дело» суффиксом -LIWY, обозначающим склонность. Справедлив, таким образом, тот, кто склонен вести дело как должно. Русское «справедливый» собрано иначе: от «правда» с приставкой с-, и справедлив там тот, кто с правдой. Два языка выбрали разные основания для одного понятия — дело против истины, — и это различие в основе любопытно само по себе, потому что значение вышло одинаковым. Приставка NIE- в польском прирастает к прилагательному намертво и пишется слитно, отчего слово получает собственные степени сравнения; русское «несправедливый» ведёт себя точно так же и тоже имеет «несправедливее»."
memory: "Отрицание лексикализовано: nie- часть слова, а не частица, и доказательство в степенях — niesprawiedliwszy, najniesprawiedliwszy, чего у частицы быть не может. Тридцать три формы считаются от отрицательной формы. Основа расходится с русской: польское sprawiedliwy от sprawa «дело», русское «справедливый» от «правды» — разные основания, одинаковый смысл. Суффикс -liwy даёт склонность: cierpliwy, wątpliwy."
