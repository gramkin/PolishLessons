notes:
  - { kind: government, text: "Самое важное здесь — что NIE- не частица, а часть слова. Доказательство в таблице: прилагательное имеет свои степени сравнения, NIESPRAWIEDLIWSZY и NAJNIESPRAWIEDLIWSZY, а частица степеней не бывает. Поэтому отрицание здесь лексикализовано: NIESPRAWIEDLIWY это самостоятельное слово, пишется слитно, и тридцать три формы считаются от него, а не от SPRAWIEDLIWY. По отношению к кому — предлог DLA с родительным: NIESPRAWIEDLIWY DLA SŁABSZYCH. В чём — предлог W с местным: NIESPRAWIEDLIWY W OCENACH. Сравнение предлогом OD с родительным или союзом NIŻ." }
  - { kind: false-friend, text: "Значение отвечает русскому «несправедливому» точно, а вот основа под отрицанием собрана иначе. Польское SPRAWIEDLIWY идёт от SPRAWA «дело, вопрос», то есть справедлив тот, кто ведёт дело как следует. Русское «справедливый» построено на «правде»: прав тот, кто держится правды. Поэтому угадать SPRAWIEDLIWY через «справедливый» можно, но разбирать его надо через SPRAWA, а не через PRAWDA — хотя PRAWDA в польском тоже есть и означает то же, что русская «правда». Суффикс -LIWY образует прилагательные со значением склонности: SPRAWIEDLIWY, CIERPLIWY «терпеливый», WĄTPLIWY «сомнительный»." }
  - { kind: pronunciation, text: "Читается «несправедли́вы», ударение на предпоследнем слоге из пяти. Приставка NIE- безударна и читается «не», одним слогом. Сочетание DLI даёт «дли» с мягким л. Конечное -Y звучит «ы». В сравнительной степени NIESPRAWIEDLIWSZY слогов шесть, сочетание WSZ читается «фш», и ударение по правилу остаётся на предпоследнем: «несправедли́фшы». В превосходной NAJNIESPRAWIEDLIWSZY семь слогов, и приставка NAJ- тоже безударна." }
  - { kind: usage, text: "Частотные сочетания: NIESPRAWIEDLIWY WYROK, NIESPRAWIEDLIWA OCENA, NIESPRAWIEDLIWY PODZIAŁ, TO NIESPRAWIEDLIWE «это несправедливо» — последнее употребляется в среднем роде как безличная оценка, ровно как русское. Существительное NIESPRAWIEDLIWOŚĆ «несправедливость» принадлежит к типу на -OŚĆ и имеет шесть форм, как WIECZNOŚĆ. Наречие NIESPRAWIEDLIWIE. Положительная форма SPRAWIEDLIWY входит в оборот SPRAWIEDLIWY SĄD и в имя собственное SPRAWIEDLIWY SPOŚRÓD NARODÓW ŚWIATA." }
