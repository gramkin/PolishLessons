# review
id: wytwornia
format: 2
lemma: "wytwórnia"
rank: 5205
pos: noun
pron: { cyr: "вытфу́рня" }
senses:
  - id: factory
    ru: "фабрика, предприятие, производство"
    examples:
      - pl: "Wytwórnia czekolady zatrudnia stu pracowników."
        ru: "Шоколадная фабрика нанимает сто рабочих."
        source: { kind: authored }
      - pl: "Pracował w wytwórni mebli."
        ru: "Он работал на мебельной фабрике."
        source: { kind: authored }
      - pl: "Wytwórnia wódki działa od XIX wieku."
        ru: "Водочный завод работает с XIX века."
        source: { kind: authored }
  - id: label
    ru: "студия, лейбл (кино, музыка)"
    examples:
      - pl: "Wytwórnia płytowa podpisała kontrakt z zespołem."
        ru: "Звукозаписывающая компания подписала контракт с группой."
        source: { kind: authored }
      - pl: "Film powstał w wytwórni w Łodzi."
        ru: "Фильм сняли на студии в Лодзи."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYTWÓRNIA — «фабрика, производство», чаще небольшое, и «студия, лейбл»: WYTWÓRNIA FILMOWA — «киностудия», WYTWÓRNIA PŁYTOWA — «звукозаписывающая компания». Крупный завод — FABRYKA или ZAKŁAD." }
  - { kind: usage, text: "Женский род, мягкая основа. Родительный единственного и множественного — WYTWÓRNI. Звательный WYTWÓRNIO не используем." }
  - { kind: government, text: "На фабрике — W WYTWÓRNI, местный. Фабрика чего — родительный: WYTWÓRNIA LODÓW. Подписать контракт с лейблом — PODPISAĆ KONTRAKT Z WYTWÓRNIĄ." }
  - { kind: pronunciation, text: "Читается «вытфу́рня»: W после T оглушается в «ф», Ó — «у», NIA — «ня». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "wytwórnia filmowa", ru: "киностудия" }
  - { pl: "wytwórnia płytowa", ru: "звукозаписывающая компания" }
  - { pl: "wytwórnia lodów", ru: "фабрика мороженого" }
family:
  - { pl: "wytworzyć", ru: "произвести", relation: root }
  - { pl: "fabryka", ru: "фабрика", relation: root, id: fabryka }
  - { pl: "zakład", ru: "предприятие", relation: root, id: zaklad }
etymology: "От WYTWORZYĆ «произвести», корень TWOR-, как в русском «творить». Суффикс -NIA обозначает место, как PIEKARNIA, «пекарня»."
memory: "Wytwórnia — фабрика, производство; wytwórnia filmowa — киностудия, płytowa — лейбл. Читается «вытфу́рня»."
idioms:
  - { pl: "wytwórnia snów", ru: "фабрика грёз, киноиндустрия" }
formExamplesSkip:
