pron: { cyr: "роспо́знаць" }
senses:
  - id: recognise
    ru: "узнать (человека, голос, почерк)"
    examples:
      - pl: "Rozpoznał go od razu."
        ru: "Он сразу его узнал."
        source: { kind: authored }
      - pl: "Rozpoznam go po głosie."
        ru: "Я узнаю его по голосу."
        source: { kind: authored }
      - pl: "Rozpoznani sprawcy trafili do aresztu."
        ru: "Опознанных виновников взяли под арест."
        source: { kind: authored }
  - id: identify
    ru: "опознать (тело, преступника, вещь)"
    examples:
      - pl: "Ciało rozpoznano po uzębieniu."
        ru: "Тело опознали по зубам."
        source: { kind: authored }
      - pl: "Świadek rozpozna sprawcę."
        ru: "Свидетель опознает виновника."
        source: { kind: authored }
  - id: diagnose
    ru: "диагностировать; rozpoznanie — диагноз"
    examples:
      - pl: "Lekarz rozpoznał zapalenie płuc."
        ru: "Врач диагностировал воспаление лёгких."
        source: { kind: authored }
      - pl: "Lekarz postawił rozpoznanie w pięć minut."
        ru: "Врач поставил диагноз за пять минут."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Соответствие сдвинуто по стилю. Польское rozpoznać — обиходное слово: rozpoznałem go od razu значит «я его сразу УЗНАЛ». Русское «распознать» звучит книжно и технично, им говорят о приборах и системах, а не о встрече на улице. Так что переводите rozpoznać как «узнать» (о человеке) или «опознать» (о теле, преступнике), и лишь в технических контекстах — «распознать»." }
  - { kind: usage, text: "В медицине существительное rozpoznanie значит ДИАГНОЗ: postawić rozpoznanie «поставить диагноз», błędne rozpoznanie «ошибочный диагноз». Это слово вы услышите в поликлинике раньше, чем сам глагол. Несовершенная пара — rozpoznawać." }
  - { kind: government, text: "Узнают КОГО и ЧТО — винительный: rozpoznać sprawcę, rozpoznać podpis. А ПО чему — предлог PO с ПРЕДЛОЖНЫМ: rozpoznać PO głosie, PO chodzie, PO uzębieniu. Русский здесь берёт дательный («узнать по голосу»), так что падеж меняется, хотя предлог тот же." }
  - { kind: pronunciation, text: "Основа у этого глагола одинаковая во всём настоящем времени: rozpoznam, rozpoznasz, rozpozna, rozpoznamy, rozpoznacie, rozpoznają — никаких чередований. Сравните с ogłosić на соседней карточке, где первое лицо и третье множественного выделяются: ogłoszę, ogłoszą против ogłosisz." }
collocations:
  - { pl: "rozpoznać po głosie", ru: "узнать по голосу" }
  - { pl: "postawić rozpoznanie", ru: "поставить диагноз" }
  - { pl: "rozpoznać sprawcę", ru: "опознать виновника" }
family:
  - { pl: "poznać", ru: "познакомиться, узнать", relation: root, id: poznac }
  - { pl: "znać", ru: "знать", relation: root, id: znac }
  - { pl: "rozpoznawać", ru: "узнавать, распознавать", relation: aspect }
etymology: "Приставка roz- плюс poznać, от znać «знать», праславянское *znati. Русские «знать», «познать», «узнать» и «распознать» — из того же гнезда, и приставка roz- отвечает русскому «рас-». Логика общая: разобрать знаемое по частям и опознать. Отсюда же rozpoznawalny «узнаваемый» и rozpoznanie «опознание, диагноз»."
memory: "rozpoznać — «узнать» (человека) и «опознать» (тело, преступника), а не книжное «распознать». Корень тот же, что «знать». Запомните два падежа: узнают кого в винительном, а PO czymś — в предложном. И rozpoznanie значит «диагноз»."
idioms:
  - { pl: "postawić rozpoznanie", ru: "поставить диагноз" }
  - { pl: "rozpoznać się w czymś", ru: "разобраться в чём-л." }
