notes:
  - { kind: false-friend, text: "Русское «зависимый» — и о наркотиках, и о деньгах. Польский разводит: UZALEŻNIONY — прежде всего о зависимости болезненной, о наркотиках, алкоголе, играх, а ZALEŻNY — о простой зависимости одного от другого: ZALEŻNY OD RODZICÓW. Во втором значении UZALEŻNIONY тоже возможно, но звучит официальнее: «поставленный в зависимость»." }
  - { kind: usage, text: "Сравнивается описательно: BARDZIEJ UZALEŻNIONY. Все одиннадцать форм живые. Форма для мужчин-людей UZALEŻNIENI очень частая: UZALEŻNIENI OD NARKOTYKÓW, UZALEŻNIENI PACJENCI. Обратите внимание на чередование: UZALEŻNIONY, но UZALEŻNIENI, O переходит в E." }
  - { kind: government, text: "Зависимый от чего-то — UZALEŻNIONY OD CZEGOŚ, OD с родительным, как и русское «от чего»: UZALEŻNIONY OD HAZARDU, OD SŁODYCZY. Поставить в зависимость — UZALEŻNIĆ COŚ OD CZEGOŚ." }
  - { kind: pronunciation, text: "Читается «узалежньо́ны», пять слогов, ударение на предпоследнем. LE даёт «ле», Ż — твёрдое «ж», NIO — «ньо». В форме UZALEŻNIENI: «узалежне́ни»." }
  - { kind: register, text: "Нейтральное слово, медицинское и бытовое одновременно. В шутку о любой страсти: JESTEM UZALEŻNIONY OD KAWY, «я кофеман». Существительное — UZALEŻNIONY как субстантив, «зависимый человек», или NAŁOGOWIEC, книжное." }
collocations:
  - { pl: "uzależniony od alkoholu", ru: "страдающий алкогольной зависимостью" }
  - { pl: "uzależniony od hazardu", ru: "игроман, зависимый от азартных игр" }
  - { pl: "uzależniony od pogody", ru: "зависящий от погоды" }
family:
  - { pl: "uzależnienie", ru: "зависимость", relation: derived }
  - { pl: "zależeć", ru: "зависеть", relation: root, id: zalezec }
