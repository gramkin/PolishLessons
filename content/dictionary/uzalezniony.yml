etymology: "Причастие от UZALEŻNIĆ «поставить в зависимость», от ZALEŻNY «зависимый», а то от ZALEŻEĆ, родственного LEŻEĆ «лежать». Русский «зависимый» висит, польский «лежит» на чём-то. Медицинский смысл «зависимый от вещества» слово получило в двадцатом веке."
memory: "Uzależniony — зависимый, особенно от вещества: uzależniony od alkoholu. Просто зависимый от кого-то — zależny. Od с родительным, как в русском. Читается «узалежньо́ны»."
idioms:
  - { pl: "uzależniony od kawy", ru: "кофеман (шутл.)" }
