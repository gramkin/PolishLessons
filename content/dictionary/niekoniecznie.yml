# review
id: niekoniecznie
format: 2
lemma: "niekoniecznie"
rank: 3907
pos: adv
pron: { cyr: "неконе́чне" }
senses:
  - id: not-necessarily
    ru: "не обязательно, не факт"
    examples:
      - pl: "Duże miasto niekoniecznie oznacza lepsze życie."
        ru: "Большой город не обязательно означает лучшую жизнь."
        source: { kind: authored }
      - pl: "Możesz przyjść, ale niekoniecznie dzisiaj."
        ru: "Можешь прийти, но не обязательно сегодня."
        source: { kind: authored }
      - pl: "Ekspert niekoniecznie ma rację."
        ru: "Эксперт не обязательно прав."
        source: { kind: authored }
  - id: reply
    ru: "необязательно, не факт (в ответе)"
    examples:
      - pl: "Myślisz, że on przyjdzie? Niekoniecznie."
        ru: "Думаешь, он придёт? Не факт."
        source: { kind: authored }
      - pl: "Musimy wyjść o szóstej? Niekoniecznie, możemy później."
        ru: "Нам надо выйти в шесть? Необязательно, можно позже."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка — KONIECZNIE: это «обязательно, непременно», а не русское «конечно». «Конечно» по-польски — OCZYWIŚCIE или PEWNIE. Соответственно NIEKONIECZNIE — «не обязательно», а вовсе не «не конечно»." }
  - { kind: usage, text: "Наречие, одна форма, пишется слитно: NIE с наречиями от прилагательных пишется вместе. Часто служит вежливым несогласием в ответе: NIEKONIECZNIE — мягче, чем прямое NIE." }
  - { kind: government, text: "Наречие ничем не управляет. Ставится перед тем, что ставит под сомнение: NIEKONIECZNIE DZISIAJ, NIEKONIECZNIE MUSISZ." }
  - { kind: pronunciation, text: "Читается «неконе́чне», ударение на предпоследнем слоге. NIE — «не», NIECZ — «неч», как в KONIECZNIE «коне́чне»." }
collocations:
  - { pl: "niekoniecznie teraz", ru: "не обязательно сейчас" }
  - { pl: "niekoniecznie prawda", ru: "не обязательно правда" }
  - { pl: "niekoniecznie musisz", ru: "тебе не обязательно" }
family:
  - { pl: "koniecznie", ru: "обязательно, непременно", relation: root, id: koniecznie }
  - { pl: "konieczny", ru: "необходимый", relation: root, id: konieczny }
  - { pl: "koniec", ru: "конец", relation: root, id: koniec }
etymology: "NIE + KONIECZNIE, от KONIECZNY «необходимый», а то — от KONIEC «конец»: необходимое — то, без чего не дойти до конца. Русское «конечно» выросло из того же «конец», но ушло к значению «разумеется»."
memory: "Niekoniecznie — не обязательно. Koniecznie — обязательно, а «конечно» — oczywiście. Читается «неконе́чне»."
idioms:
  - { pl: "koniec końców", ru: "в конце концов" }
formExamples:
  - form: "niekoniecznie"
    pl: "Drogie wino niekoniecznie jest lepsze."
    ru: "Дорогое вино не обязательно лучше."
    source: { kind: authored }
  - form: "niekoniecznie"
    pl: "Niekoniecznie musisz przychodzić."
    ru: "Тебе не обязательно приходить."
    source: { kind: authored }
  - form: "niekoniecznie"
    pl: "To niekoniecznie zła wiadomość."
    ru: "Это не обязательно плохая новость."
    source: { kind: authored }
