# review
id: wspiac
format: 2
lemma: "wspiąć"
rank: 5555
pos: verb
aspect: perf
pron: { cyr: "фспёнць" }
senses:
  - id: climb
    ru: "взобраться, залезть (wspiąć się na)"
    examples:
      - pl: "Chcemy się wspiąć na tamtą górę."
        ru: "Мы хотим забраться на ту гору."
        source: { kind: tatoeba, id: 350143 }
      - pl: "Bez trudu wspiął się na drzewo."
        ru: "Он без труда залез на дерево."
        source: { kind: tatoeba, id: 525643 }
      - pl: "Chcę wspiąć się na tę górę."
        ru: "Я хочу взобраться на эту гору."
        source: { kind: translated, id: 1563258 }
  - id: ascend
    ru: "подняться, взойти"
    examples:
      - pl: "Wspięliśmy się na sam szczyt."
        ru: "Мы взобрались на самую вершину."
        source: { kind: tatoeba, id: 6305501 }
      - pl: "Wspiął się po schodach."
        ru: "Он поднялся по лестнице."
        source: { kind: translated, id: 550647 }
notes:
  - { kind: government, text: "Всегда с się и с предлогом na плюс винительный: wspiąć się na górę «взобраться на гору». По лестнице — po schodach, предложный." }
  - { kind: usage, text: "Излюбленный пример корпуса — восхождение на гору: почти каждый второй пример про górę Fuji." }
  - { kind: false-friend, text: "Корень piąć się «карабкаться»; ср. русское «пнуть»? Нет — ближе «пясть», «опираться». Русское «взобраться» иного корня, но приставка вз- та же." }
  - { kind: usage, text: "Несовершенный вид — wspinać się; отсюда wspinaczka «скалолазание»." }
collocations:
  - { pl: "wspiąć się na górę", ru: "взобраться на гору" }
  - { pl: "wspiąć się po schodach", ru: "подняться по лестнице" }
etymology: "wz- + piąć się «карабкаться»; ср. русское «взобраться», приставка та же."
memory: "wspiąć się na coś — «взобраться на что-л.», всегда с się и na с винительным. Несовершенный вид — wspinać się, отсюда wspinaczka «скалолазание»."
idioms:
  - { pl: "wspiąć się na górę", ru: "взобраться на гору" }
