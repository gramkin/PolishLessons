notes:
  - { kind: false-friend, text: "Самое прозрачное название в польском календаре, и русскому оно знакомо целиком. LISTOPAD разбирается на LIŚĆ «лист» и PADAĆ «падать»: это и есть листопад. Русский держит это слово для самого явления, и только поляк, украинец и белорус сделали из него имя месяца. Запоминать тут нечего: достаточно сообразить, что листопад бывает осенью, и ноябрь находится сам. Осторожно с соседями: у хорватов LISTOPAD это октябрь." }
  - { kind: usage, text: "Десять форм, мужской род. В отличие от KWIECIEŃ, SIERPIEŃ, GRUDZIEŃ и CZERWIEC, беглого E здесь нет вовсе: основа LISTOPAD- остаётся целой во всех падежах. Зато в местном падеже появляется смягчение D в DZI: LISTOPAD, но W LISTOPADZIE. Это то же чередование, что в SĄSIAD — O SĄSIEDZIE, и русский знает его по паре «ходить — хожу», только с другим исходом." }
  - { kind: government, text: "В каком месяце — предлог W с местным падежом: W LISTOPADZIE «в ноябре». До и от — DO и OD с родительным: DO LISTOPADA, OD LISTOPADA. Дата идёт родительным без предлога, и самая известная из них JEDENASTEGO LISTOPADA «одиннадцатого ноября», день независимости Польши. В конце ноября — POD KONIEC LISTOPADA, предлог POD с родительным." }
  - { kind: pronunciation, text: "Читается «листо́пат», три слога, ударение на втором. Конечное D оглушается и звучит как «т»: это общее польское правило, и русский делает то же самое в слове «сад». В местном падеже оглушения уже нет, зато есть смягчение: LISTOPADZIE звучит «листопа́дзе», где DZI даёт слитное мягкое «дзь». В родительном LISTOPADA слышно «листопа́да», с обычным звонким «д»." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Для поляка ноябрь густо населён датами: первого ноября WSZYSTKICH ŚWIĘTYCH, когда вся страна едет на кладбища, второго ZADUSZKI, одиннадцатого ŚWIĘTO NIEPODLEGŁOŚCI. Из истории сюда же относится POWSTANIE LISTOPADOWE «Ноябрьское восстание» тысяча восемьсот тридцатого года. Поэтому само слово звучит для поляка серьёзнее, чем просто название месяца." }
