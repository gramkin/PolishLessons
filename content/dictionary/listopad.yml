etymology: "Сложение двух слов: LIŚĆ «лист» и PADAĆ «падать», то есть буквально «листопад». Образ прозрачен и общеславянский, поэтому то же название месяца взяли украинский и белорусский. Русский собрал из тех же частей слово «листопад», но оставил его за самим явлением, а для месяца взял латинское NOVEMBER, «девятый», потому что римский год начинался в марте. Любопытно, что у хорватов LISTOPAD означает октябрь: один образ, разные месяцы."
memory: "Разбирается на части без словаря: liść плюс padać, то есть «листопад», и это ноябрь. Русский держит то же слово для самого явления, а месяцем его сделали поляки, украинцы и белорусы. Беглого e здесь нет, в отличие от kwiecień и czerwiec, зато в местном падеже d смягчается: w listopadzie. Читается «листо́пат», с оглушением конечного d. Главная дата: jedenastego listopada, день независимости."
idioms:
