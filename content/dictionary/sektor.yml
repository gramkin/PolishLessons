etymology: "Из латинского SECTOR «тот, кто режет», от глагола SECARE «резать» — того же, что дал SECTIO, откуда польское SEKCJA и русская «секция», а также «сегмент» и садовый «секатор». В геометрии сектором назвали отрезанную часть круга, и от этого наглядного образа значение разошлось во все стороны: участок трибуны, полоса ответственности, часть хозяйства. Оба языка взяли слово из латыни через научную и деловую письменность нового времени, поэтому совпадение полное. Корень SECARE родствен, через индоевропейскую основу, славянскому «сечь» и польскому SIEC, так что в самой глубине русское «сечение» и латинский «сектор» оказываются роднёй."
memory: "Полное совпадение с русским «сектором», от латинского secare «резать» — отсюда же секция, сегмент и садовый секатор, а в самой глубине и русское «сечь». Звучит с твёрдым «сэ». Родительный sektora на -a, как traktora. Местный sektorze с меной r→rz, как komorze и erze. Полезная мелочь: sektor publiczny значит «государственный сектор», потому что publiczny это «общественный», а не «публичный»."
idioms:
  - { pl: "sektor publiczny", ru: "государственный сектор" }
