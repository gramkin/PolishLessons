notes:
  - { kind: false-friend, text: "Значение совпадает с русским «сектором» во всех трёх областях — в экономике, на стадионе и в геометрии, — и оба языка взяли слово из латыни. Запомнить стоит только разницу в звучании и в сочетаемости. По-польски говорят SEKTOR PUBLICZNY там, где русский скажет «государственный сектор»: PUBLICZNY значит «общественный, государственный», а не «публичный» в русском смысле, и эта пара уже встречалась в карточке PUBLICZNOŚĆ. Из того же латинского гнезда в польском SEKCJA «отдел, секция», SEKATOR «садовые ножницы» и SEKWENCJA, и все они русскому знакомы." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — SEKTORZE, где конечное R основы переходит в RZ перед окончанием -E: та же мена, что в KOMORZE, ERZE и FRYZURZE. Родительный единственного — SEKTORA, с окончанием -A, а не -U: заимствованные названия участков и устройств берут именно это окончание, как TRAKTORA и MOTORA. Винительный равен именительному. Родительный множественного — SEKTORÓW. Прилагательное образуется суффиксом -OWY: SEKTOROWY." }
  - { kind: pronunciation, text: "Читается «сэ́ктор», два слога, ударение на первом — в отличие от русского «се́ктор», где ударение там же, но первый гласный мягче. Польское E всегда даёт «э», поэтому начало звучит «сэ», а не «се». Сочетание KT произносится слитно. В форме SEKTORA слышно «сэкто́ра», с ударением на втором слоге. В форме SEKTORZE буквосочетание RZ даёт «ж»: «сэкто́же». В форме SEKTORÓW буква Ó читается как «у», а конечное W оглушается: «сэкто́руф»." }
  - { kind: register, text: "Слово нейтральное и книжное, частое в экономике, в журналистике и в спортивном репортаже. Устойчивые сочетания: SEKTOR PRYWATNY, SEKTOR PUBLICZNY, SEKTOR BANKOWY, SEKTOR USŁUG, SEKTOR GOŚCI «гостевой сектор» на стадионе. В военном языке SEKTOR означает полосу ответственности, в геометрии — часть круга. Разговорного употребления у слова нет, и переносного тоже: это термин, одинаково уместный в отчёте и в учебнике, но не в бытовом разговоре." }
