notes:
  - { kind: false-friend, text: "Формы stała, stali, stały совпадают с прошедшим временем глагола stać «стоять»: Siostra stała na balkonie — это «сестра стояла», а не «постоянная». Различает только контекст." }
  - { kind: usage, text: "stan stały значит «твёрдое состояние» вещества, ciało stałe — «твёрдое тело». Здесь stały = «твёрдый», а не «постоянный»." }
  - { kind: usage, text: "Наречие — stale «постоянно», а na stałe значит «насовсем, навсегда»: wyjechać na stałe «уехать навсегда»." }
  - { kind: usage, text: "Степени сравнения (stalszy, najstalszy) в корпусе не встречаются — прилагательное почти не градуируется." }
collocations:
