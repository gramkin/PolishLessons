etymology: "От stać «стоять» — буквально «стоящий, устойчивый». Русское «постоянный» построено ровно так же: «по-сто-янный» от «стоять». Отсюда же и совпадение форм с прошедшим временем глагола."
memory: "stały = «постоянный», и родословная у него та же, что у русского «постоянный»: оба от «стоять». Поэтому формы stała, stali, stały совпадают с прошедшим временем stać — Ona stała значит «она стояла». Второе значение — «твёрдый»: stan stały «твёрдое состояние»."
idioms:
