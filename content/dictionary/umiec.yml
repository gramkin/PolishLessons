# review
id: umiec
format: 2
lemma: "umieć"
rank: 709
pos: verb
aspect: imperf
pron: { cyr: "у́мець" }
senses:
  - id: know-how
    ru: "уметь (владеть навыком)"
    examples:
      - pl: "On umie pływać."
        ru: "Он умеет плавать."
        source: { kind: tatoeba, id: 358787 }
      - pl: "Nie umiem latać."
        ru: "Я не умею летать."
        source: { kind: tatoeba, id: 956981 }
      - pl: "Umiesz pisać?"
        ru: "Ты умеешь писать?"
        source: { kind: tatoeba, id: 5336646 }
  - id: cannot
    ru: "nie umieć — не уметь, не суметь"
    examples:
      - pl: "On nie umie pływać."
        ru: "Он не умеет плавать."
        source: { kind: tatoeba, id: 357825 }
      - pl: "Nie umiem kłamać."
        ru: "Я не умею врать."
        source: { kind: tatoeba, id: 13830839 }
      - pl: "Tom nie umiał pływać."
        ru: "Том не умел плавать."
        source: { kind: translated, id: 8763053 }
  - id: vs-moc
    ru: "umieć «уметь» ≠ móc «мочь» ≠ wiedzieć «знать»"
    note: "Навык, возможность и знание факта — три разных глагола."
    examples:
      - pl: "Umiem prowadzić, a Tom nie."
        ru: "Я умею водить, а Том нет."
        source: { kind: tatoeba, id: 364873 }
      - pl: "Umiem czytać w myślach."
        ru: "Я могу читать мысли."
        source: { kind: tatoeba, id: 2495934 }
      - pl: "Umiem pływać, ale dziś nie mogę."
        ru: "Я умею плавать, но сегодня не могу."
        source: { kind: authored }
  - id: wish
    ru: "chciałbym umieć — хотел бы уметь"
    examples:
      - pl: "Chciałbym umieć pływać."
        ru: "Хотел бы я уметь плавать."
        source: { kind: translated, id: 599889 }
      - pl: "Chciałbym umieć mówić po angielsku."
        ru: "Хотел бы я уметь говорить по-английски."
        source: { kind: translated, id: 412923 }
      - pl: "Każdy powinien umieć pływać."
        ru: "Каждый должен уметь плавать."
        source: { kind: translated, id: 751598 }
notes:
  - { kind: false-friend, text: "Три глагола, которые русский покрывает двумя. umieć — владеть навыком (Umiem pływać «Я умею плавать»); móc — иметь возможность (Nie mogę dziś pływać «Сегодня не могу»); wiedzieć — знать факт (Wiem, gdzie jest basen). Путать их — самая частая ошибка." }
  - { kind: usage, text: "Спряжение запоминают по третьему лицу множественного: umieją, а не «umią». Полностью: umiem, umiesz, umie, umiemy, umiecie, umieją." }
  - { kind: usage, text: "В прошедшем времени e переходит в a: umieć — umiał, umiała, но во множественном мужско-личном возвращается e: umieli. Точно как mieć — miał — mieli." }
  - { kind: usage, text: "Страдательных форм и отглагольного существительного у umieć нет: «умение» — это umiejętność, «умелый» — umiejętny." }
collocations:
  - { pl: "umieć pływać", ru: "уметь плавать" }
  - { pl: "nie umieć", ru: "не уметь" }
  - { pl: "umieć się znaleźć", ru: "уметь себя держать" }
  - { pl: "umiejętność", ru: "умение" }
family:
  - { pl: "umiejętność", ru: "умение", relation: derived }
  - { pl: "umiejętny", ru: "умелый", relation: derived }
  - { pl: "rozumieć", ru: "понимать", relation: root }
  - { pl: "nauczyć się", ru: "научиться", relation: root }
etymology: "Праславянское *uměti, от того же корня, что *umъ «ум» — русские «уметь» и «ум» из этого же гнезда."
memory: "umieć — это «уметь» в смысле навыка, и рядом с ним надо держать ещё два глагола: móc «мочь, иметь возможность» и wiedzieć «знать факт». Umiem pływać, ale dziś nie mogę, bo wiem, że basen jest zamknięty. Спряжение проверяйте по третьему лицу множественного: umieją, а не «umią». Существительного от глагола нет — «умение» это umiejętność."
idioms:
  - { pl: "czego Jaś się nie nauczy, tego Jan nie będzie umiał", ru: "чему Ваня не научился, того Иван знать не будет" }
  - { pl: "umieć się znaleźć", ru: "уметь себя держать" }
  - { pl: "głupi milczeć nie umie", ru: "глупый молчать не умеет" }
