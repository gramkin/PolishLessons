# review
id: propozycja
format: 2
lemma: "propozycja"
rank: 1769
pos: noun
pron: { cyr: "пропозы́цья" }
senses:
  - id: offer
    ru: "предложение (то, что предлагают)"
    examples:
      - pl: "Oto propozycja."
        ru: "Вот предложение."
        source: { kind: translated, id: 2251822 }
      - pl: "To bardzo hojna propozycja, ale muszę ją odrzucić."
        ru: "Это очень щедрое предложение, но я вынужден его отклонить."
        source: { kind: tatoeba, id: 4812859 }
      - pl: "To moja ostateczna propozycja."
        ru: "Это моё окончательное предложение."
        source: { kind: translated, id: 3600388 }
  - id: accept-reject
    ru: "предложение (принять или отклонить)"
    examples:
      - pl: "Odrzuciła naszą propozycję."
        ru: "Она отклонила наше предложение."
        source: { kind: tatoeba, id: 742772 }
      - pl: "Zgodziłem się na propozycję."
        ru: "Я согласился на это предложение."
        source: { kind: tatoeba, id: 580590 }
      - pl: "Chętnie przyjął naszą propozycję."
        ru: "Он с радостью принял наше предложение."
        source: { kind: tatoeba, id: 5198883 }
notes:
  - { kind: usage, text: "Форма propozycyj — устаревший родительный множественного; современная норма propozycji, поэтому propozycyj оставлена без примеров. Так у всех слов на -ja: lekcja — lekcji, stacja — stacji." }
  - { kind: false-friend, text: "Русское «предложение» значит и оферту, и фразу. По-польски фраза — это zdanie, а propozycja только «то, что предлагают»." }
  - { kind: government, text: "Согласиться на предложение — zgodzić się na propozycję (винительный с na); согласиться с предложением — zgadzać się z propozycją (творительный с z)." }
  - { kind: usage, text: "przyjąć propozycję «принять предложение», odrzucić propozycję «отклонить предложение»." }
  - { kind: usage, text: "Глагол — proponować «предлагать»." }
collocations:
  - { pl: "przyjąć propozycję", ru: "принять предложение" }
  - { pl: "odrzucić propozycję", ru: "отклонить предложение" }
  - { pl: "kusząca propozycja", ru: "заманчивое предложение" }
family:
  - { pl: "proponować", ru: "предлагать", relation: root }
  - { pl: "propozycjodawca", ru: "автор предложения", relation: root }
etymology: "Из латинского propositio «изложение, предложение» через западные языки; русское «предложение» — калька того же латинского слова."
memory: "propozycja — «предложение» в смысле оферты: przyjąć propozycję «принять предложение». А предложение-фраза — это zdanie."
idioms:
  - { pl: "propozycja nie do odrzucenia", ru: "предложение, от которого нельзя отказаться" }
  - { pl: "kusząca propozycja", ru: "заманчивое предложение" }
  - { pl: "otwarty na propozycje", ru: "открыт для предложений" }
formExamplesSkip:
  - { form: "propozycyj", reason: "устаревший родительный падеж множественного числа; современная норма — propozycji" }
