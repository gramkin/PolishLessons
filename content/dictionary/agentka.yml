        source: { kind: authored }
notes:
  - { kind: usage, text: "Это женская пара к agent, образованная суффиксом -ka. В польском такие формы обычны и нейтральны: agentka, nauczycielka, lekarka. По-русски «агентка» звучит разговорно или иронично, и обычно говорят «агент» о женщине тоже, или «женщина-агент». Поэтому переводить agentka лучше словом «агент» в женском согласовании." }
  - { kind: false-friend, text: "Расхождение не в значении, а в стиле: польское agentka — обычное слово, русское «агентка» — нет. Это общая черта двух языков: польский охотно делает женские названия профессий, русский чаще оставляет мужскую форму." }
  - { kind: government, text: "Чей агент или по какой части — в родительном: agentka wywiadu «агент разведки», agentka nieruchomości «агент по недвижимости», agentka ubezpieczeniowa «страховой агент» (здесь прилагательным). Дательный и предложный совпадают: agentce." }
  - { kind: pronunciation, text: "Звательный падеж у неодушевлённых существительных формально есть, но в живой речи почти не встречается: его берегут для стихов, песен и шутливого обращения к вещи. Примеры в этом слоте именно такие — запоминать их как образец повседневной речи не нужно." }
collocations:
  - { pl: "agentka wywiadu", ru: "агент разведки" }
  - { pl: "agentka nieruchomości", ru: "агент по недвижимости" }
  - { pl: "tajna agentka", ru: "тайный агент" }
family:
  - { pl: "agent", ru: "агент", relation: root, id: agent }
  - { pl: "agencja", ru: "агентство", relation: derived, id: agencja }
etymology: "Женская форма с суффиксом -ka от agent, а agent — из латинского agens «действующий», причастия от agere «делать, вести». Из того же корня «акт», «акция», «агентство». Русское «агентка» существует, но осталось разговорным, тогда как польский сделал такие формы нормой."
memory: "agentka — женщина-агент, от agent плюс -ka. По-польски это нейтральное слово, а русское «агентка» разговорно, поэтому переводят просто «агент». Дательный и предложный — agentce."
idioms:
