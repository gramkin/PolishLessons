# review
id: ochrona
format: 2
lemma: "ochrona"
rank: 749
pos: noun
pron: { cyr: "охро́на" }
senses:
  - id: protection
    ru: "защита, охрана (отвлечённо)"
    examples:
      - pl: "Ochrona Toma to moja praca."
        ru: "Охранять Тома — моя работа."
        source: { kind: translated, id: 3954295 }
      - pl: "Chcieli ochrony."
        ru: "Они хотели защиты."
        source: { kind: translated, id: 10606718 }
      - pl: "Tom potrzebuje ochrony."
        ru: "Тому нужна защита."
        source: { kind: translated, id: 3851795 }
  - id: guards
    ru: "охрана (люди)"
    note: "Совершенно конкретное значение."
    examples:
      - pl: "Wezwij ochronę!"
        ru: "Вызови охрану!"
        source: { kind: translated, id: 8617219 }
      - pl: "Dzwoń po ochronę!"
        ru: "Звони в охрану!"
        source: { kind: translated, id: 8617220 }
      - pl: "Tom ma ochronę."
        ru: "У Тома есть охрана."
        source: { kind: translated, id: 6441713 }
  - id: environment
    ru: "ochrona środowiska — охрана окружающей среды"
    examples:
      - pl: "Dzisiejszy tekst jest o ochronie środowiska."
        ru: "Сегодняшний текст — об охране окружающей среды."
        source: { kind: translated, id: 13791023 }
      - pl: "Ochrona zdrowia to w tym roku wyjątkowo ważka sprawa."
        ru: "Охрана здоровья в этом году — исключительно важное дело."
        source: { kind: translated, id: 8617768 }
      - pl: "Ochrona środowiska to nasz obowiązek."
        ru: "Охрана окружающей среды — наш долг."
        source: { kind: authored }
  - id: under
    ru: "pod ochroną — под охраной, под защитой"
    examples:
      - pl: "Jestem pod ich ochroną."
        ru: "Я под их защитой."
        source: { kind: translated, id: 13459486 }
      - pl: "Szukał ochrony przed deszczem."
        ru: "Он искал укрытия от дождя."
        source: { kind: translated, id: 363556 }
      - pl: "Ten gatunek jest pod ochroną."
        ru: "Этот вид под охраной."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два режима, отвлечённый и конкретный. Отвлечённый — «защита»: ochrona środowiska, ochrona danych. Конкретный — «охрана» как люди: Wezwij ochronę! значит «Вызови охрану!»." }
  - { kind: government, text: "pod ochroną — творительный падеж; podlegać ochronie — дательный; szukać ochrony — родительный." }
  - { kind: usage, text: "Корень тот же, что в русских «хранить» и «хоронить»: chronić «беречь, охранять». Родня — ochroniarz «охранник», schronienie «убежище», chroniony «охраняемый»." }
  - { kind: usage, text: "Готовые сочетания: ochrona środowiska «охрана окружающей среды», ochrona zdrowia «здравоохранение», ochrona danych «защита данных»." }
collocations:
  - { pl: "ochrona środowiska", ru: "охрана окружающей среды" }
  - { pl: "pod ochroną", ru: "под охраной" }
  - { pl: "wezwać ochronę", ru: "вызвать охрану" }
  - { pl: "ochrona danych", ru: "защита данных" }
family:
  - { pl: "chronić", ru: "охранять", relation: root }
  - { pl: "ochroniarz", ru: "охранник", relation: derived }
  - { pl: "schronienie", ru: "убежище", relation: derived }
etymology: "От chronić «беречь, охранять» с приставкой o- — то же гнездо, что русские «хранить» и «хоронить»."
memory: "ochrona — от chronić «охранять», и корень тот же, что в русских «хранить» и «хоронить». Слово работает в двух режимах: отвлечённом — ochrona środowiska «охрана окружающей среды» — и совершенно конкретном: Wezwij ochronę! значит «Вызови охрану!», то есть людей."
idioms:
