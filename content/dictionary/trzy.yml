# review
id: trzy
format: 2
lemma: "trzy"
rank: 212
pos: num
pron: { cyr: "тшы" }
senses:
  - id: three
    ru: "три"
    examples:
      - pl: "Tom ma trzy psy."
        ru: "У Тома есть три собаки."
        source: { kind: tatoeba, id: 4829984 }
      - pl: "Masz trzy samochody."
        ru: "У тебя три машины."
        source: { kind: tatoeba, id: 361302 }
      - pl: "Tom zjadł trzy jajka."
        ru: "Том съел три яйца."
        source: { kind: tatoeba, id: 12069009 }
  - id: collective
    ru: "трое: trzej/trzech о мужчинах, troje о смешанных группах и детях"
    note: "Польский различает строже, чем русский: trzy psy, trzej panowie, troje dzieci."
    examples:
      - pl: "Przyszło troje dzieci."
        ru: "Пришло трое детей."
        source: { kind: authored }
      - pl: "Trzej panowie czekają na zewnątrz."
        ru: "Трое мужчин ждут снаружи."
        source: { kind: authored }
      - pl: "Mam troje rodzeństwa."
        ru: "У меня трое братьев и сестёр."
        source: { kind: authored }
notes:
  - { kind: government, text: "После trzy существительное стоит во множественном числе именительного или винительного: trzy psy, trzy książki. После pięć и дальше — родительный: pięć psów." }
  - { kind: usage, text: "О мужских лицах употребляется trzej (trzej panowie) или trzech (trzech panów), о смешанных группах и детях — собирательное troje: troje dzieci." }
  - { kind: usage, text: "Творительный — trzema: mówi trzema językami «говорит на трёх языках»." }
collocations:
  - { pl: "trzy razy", ru: "три раза" }
  - { pl: "trzej panowie", ru: "трое мужчин" }
  - { pl: "troje dzieci", ru: "трое детей" }
  - { pl: "trzema językami", ru: "на трёх языках" }
etymology: "Праславянское *trьje — то же слово, что русское «три»; родственники есть во всех славянских языках."
memory: "trzy psy, но о мужчинах — trzej panowie (или trzech panów), а о детях и смешанных группах — troje dzieci. Русский обходится парой «три/трое», польский различает строже."
idioms:
  - { pl: "do trzech razy sztuka", ru: "бог троицу любит" }
  - { pl: "mówić trzy po trzy", ru: "нести околесицу" }
  - { pl: "trzy po trzy", ru: "ни к селу ни к городу" }
formExamplesSkip:
  - { form: "trój", reason: "не самостоятельная форма, а первая часть сложных слов: trójkąt, trójka" }
  - { form: "trzej", cell: "Звательный", reason: "звательный падеж: в обращении это слово не употребляется" }
