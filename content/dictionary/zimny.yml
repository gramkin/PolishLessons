# review
id: zimny
format: 2
lemma: "zimny"
rank: 866
pos: adj
pron: { cyr: "зи́мны" }
senses:
  - id: cold
    ru: "холодный (о температуре)"
    examples:
      - pl: "Woda jest zimna."
        ru: "Вода холодная."
        source: { kind: tatoeba, id: 8448609 }
      - pl: "Ogień jest gorący, a lód zimny."
        ru: "Огонь горячий, а лёд холодный."
        source: { kind: tatoeba, id: 12678722 }
      - pl: "Miała policzki zimne jak lód."
        ru: "Щёки у неё были холодные как лёд."
        source: { kind: tatoeba, id: 6541944 }
  - id: unfeeling
    ru: "холодный, бесстрастный; равнодушный"
    examples:
      - pl: "Co za zimna krew!"
        ru: "Какое хладнокровие!"
        source: { kind: authored }
      - pl: "Jego głos był zimny i obojętny."
        ru: "Его голос был холодным и равнодушным."
        source: { kind: authored }
      - pl: "Zachował zimną krew do końca."
        ru: "Он сохранял хладнокровие до конца."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Праславянское *zimьnъ, от zima «зима»; русское «зимний» — то же слово, но польское zimny значит просто «холодный», а «зимний» будет zimowy." }
  - { kind: false-friend, text: "Не путайте zimny «холодный» и zimowy «зимний»: zimna woda «холодная вода», но zimowy sen «зимняя спячка»." }
  - { kind: usage, text: "zachować zimną krew — «сохранить хладнокровие»; z zimną krwią — «хладнокровно». Оба оборота совпадают с русскими." }
  - { kind: usage, text: "dmuchać na zimne — «дуть на холодное», то есть перестраховываться; русский аналог — «обжёгшись на молоке, дуть на воду»." }
collocations:
  - { pl: "zimna woda", ru: "холодная вода" }
  - { pl: "zimna krew", ru: "хладнокровие" }
  - { pl: "z zimną krwią", ru: "хладнокровно" }
  - { pl: "dmuchać na zimne", ru: "перестраховываться" }
etymology: "Праславянское *zimьnъ, от zima «зима». Русское «зимний» — то же слово, но польское zimny значит «холодный»; «зимний» по-польски zimowy."
memory: "zimny — «холодный», от zima «зима». Осторожно с соседом: zimowy значит «зимний», а zimny — просто «холодный». Обороты совпадают с русскими: zachować zimną krew «сохранить хладнокровие», z zimną krwią «хладнокровно». А dmuchać na zimne — это «перестраховываться»."
idioms:
  - { pl: "zachować zimną krew", ru: "сохранить хладнокровие" }
  - { pl: "z zimną krwią", ru: "хладнокровно" }
  - { pl: "dmuchać na zimne", ru: "перестраховываться" }
