# review
id: data
format: 2
lemma: "data"
rank: 1774
pos: noun
pron: { cyr: "да́та" }
senses:
  - id: date
    ru: "дата, число"
    examples:
      - pl: "Jaka jest dzisiaj data?"
        ru: "Какое сегодня число?"
        source: { kind: translated, id: 702127 }
      - pl: "Jaka jest twoja data urodzenia?"
        ru: "Какая у тебя дата рождения?"
        source: { kind: tatoeba, id: 733630 }
      - pl: "Data ważności tego mleka minęła."
        ru: "Срок годности этого молока истёк."
        source: { kind: translated, id: 7558735 }
  - id: set-date
    ru: "дата (назначить, вписать, уточнить)"
    examples:
      - pl: "Ustalmy datę pikniku."
        ru: "Давайте назначим дату пикника."
        source: { kind: translated, id: 991303 }
      - pl: "Proszę tu wpisać datę urodzenia."
        ru: "Впишите здесь, пожалуйста, дату рождения."
        source: { kind: translated, id: 765750 }
      - pl: "Nie jestem pewien dokładnej daty."
        ru: "Я не уверен в точной дате."
        source: { kind: translated, id: 352623 }
notes:
  - { kind: false-friend, text: "Форма dacie в таблице ниже принадлежит не этому слову, а глаголу dać: dacie radę значит «вы справитесь», а не что-либо про дату." }
  - { kind: government, text: "Назначить дату — ustalić datę (винительный падеж); до этой даты — przed tą datą (творительный)." }
  - { kind: usage, text: "data urodzenia — «дата рождения», data ważności — «срок годности», буквально «дата действительности»." }
  - { kind: usage, text: "Русское «дата» и польское data — одно латинское слово, но по-русски ещё говорят «число», а по-польски в этом смысле тоже data: Jaka jest dzisiaj data?" }
collocations:
  - { pl: "data urodzenia", ru: "дата рождения" }
  - { pl: "data ważności", ru: "срок годности" }
  - { pl: "ustalić datę", ru: "назначить дату" }
family:
  - { pl: "datować", ru: "датировать", relation: root }
  - { pl: "dzień", ru: "день", relation: root, id: dzien }
etymology: "Из латинского data «данная», от datum — так начинались средневековые письма. Русское «дата» пришло тем же путём."
memory: "data — «дата» и «число»: Jaka jest dzisiaj data? «Какое сегодня число?». Осторожно: форма dacie принадлежит глаголу dać, а не этому слову."
