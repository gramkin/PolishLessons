# review
id: przestawiac
format: 2
lemma: "przestawiać"
rank: 5985
pos: verb
aspect: imperf
pron: { cyr: "пшэста́вяць" }
senses:
  - id: move
    ru: "переставлять (вещи, мебель)"
    examples:
      - pl: "Co roku przestawiam meble w salonie."
        ru: "Каждый год я переставляю мебель в гостиной."
        source: { kind: authored }
      - pl: "Mama przestawia doniczki bliżej okna."
        ru: "Мама переставляет горшки ближе к окну."
        source: { kind: authored }
      - pl: "Nie przestawiaj moich książek na półce!"
        ru: "Не переставляй мои книги на полке!"
        source: { kind: authored }
  - id: reorder
    ru: "менять порядок (слов, букв, пунктов); переводить (часы)"
    examples:
      - pl: "Uczeń przestawia litery w wyrazach."
        ru: "Ученик переставляет буквы в словах."
        source: { kind: authored }
      - pl: "W marcu przestawiamy zegarki na czas letni."
        ru: "В марте мы переводим часы на летнее время."
        source: { kind: authored }
  - id: switch
    ru: "перестраивать, переводить на другой режим; przestawiać się — переключаться"
    examples:
      - pl: "Firma przestawia produkcję na samochody elektryczne."
        ru: "Фирма переводит производство на электромобили."
        source: { kind: authored }
      - pl: "Powoli przestawiam się na zdrowe jedzenie."
        ru: "Я постепенно перехожу на здоровое питание."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZESTAWIĆ. Спряжение на -AM: PRZESTAWIAM, PRZESTAWIASZ, PRZESTAWIAJĄ. Часы «переводят» тоже этим глаголом: PRZESTAWIAĆ ZEGARKI NA CZAS LETNI." }
  - { kind: government, text: "Что — винительный, куда — NA + винительный или DO + родительный: PRZESTAWIAĆ SZAFĘ POD OKNO, PRZESTAWIAĆ FABRYKĘ NA NOWĄ PRODUKCJĘ. С SIĘ — «переключаться, перестраиваться»: PRZESTAWIAĆ SIĘ NA ZDROWE JEDZENIE." }
  - { kind: false-friend, text: "Не путать с PRZEDSTAWIAĆ «представлять, показывать»: одна буква D меняет смысл. PRZESTAWIAM MEBLE — переставляю мебель; PRZEDSTAWIAM GOŚCI — представляю гостей." }
  - { kind: pronunciation, text: "Читается «пшэста́вяць»: PRZ — «пш», WIA — «вя». Ударение на предпоследнем слоге: PRZESTAWIAM — «пшэста́вям»." }
collocations:
  - { pl: "przestawiać meble", ru: "переставлять мебель" }
  - { pl: "przestawiać zegarki", ru: "переводить часы" }
  - { pl: "przestawiać kolejność", ru: "менять порядок" }
  - { pl: "przestawiać się na coś", ru: "переключаться, переходить на что-то" }
family:
  - { pl: "przestawić", ru: "переставить, перевести", relation: aspect }
  - { pl: "stawiać", ru: "ставить", relation: root, id: stawiac }
  - { pl: "przedstawiać", ru: "представлять", relation: root, id: przedstawiac }
  - { pl: "przestawienie", ru: "перестановка; переключение", relation: derived }
etymology: "Приставка PRZE- «пере-» плюс STAWIAĆ «ставить»: слово построено точно как русское «переставлять»."
memory: "Prze- = пере-, stawiać = ставить: przestawiać — переставлять. Wiosną przestawiamy zegarki."
idioms:
  - { pl: "przestawiać zegarki", ru: "переводить часы (на летнее или зимнее время)" }
  - { pl: "przestawiać się na inne tory", ru: "переключаться на другие рельсы, менять подход" }
