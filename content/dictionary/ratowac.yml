# review
id: ratowac
format: 2
lemma: "ratować"
rank: 1500
pos: verb
aspect: imperf
aspectPair: uratowac
pron: { cyr: "рато́ваць" }
senses:
  - id: rescue
    ru: "спасать"
    examples:
      - pl: "Oddał krew, by ratować swoją siostrę."
        ru: "Он сдал кровь, чтобы спасти свою сестру."
        source: { kind: tatoeba, id: 2607544 }
      - pl: "Przeszczepy ratują życia."
        ru: "Пересадки спасают жизни."
        source: { kind: translated, id: 10598457 }
      - pl: "Ratuj się kto może!"
        ru: "Спасайся кто может!"
        source: { kind: translated, id: 2305392 }
  - id: help-out
    ru: "выручать, спасать положение"
    examples:
      - pl: "Przewodniki ratują mi życie w obcych miejscach."
        ru: "Гиды спасают мне жизнь в незнакомых местах."
        source: { kind: tatoeba, id: 1110248 }
      - pl: "Został pochwalony za ratowanie życia."
        ru: "Его похвалили за спасение жизни."
        source: { kind: translated, id: 358805 }
notes:
  - { kind: usage, text: "Несовершенный вид к uratować, которое уже есть карточкой." }
  - { kind: government, text: "ratować kogo lub co, винительный: ratować życie, ratować przyjaciela. С się — «спасаться»." }
  - { kind: usage, text: "Ratuj się kto może! — «Спасайся кто может!», устойчивый возглас." }
  - { kind: usage, text: "Гнездо слова: ratunek «спасение», ratownik «спасатель», pogotowie ratunkowe «скорая помощь»." }
collocations:
  - { pl: "ratować życie", ru: "спасать жизнь" }
  - { pl: "ratować sytuację", ru: "спасать положение" }
  - { pl: "ratuj się kto może", ru: "спасайся кто может" }
etymology: "Из немецкого retten «спасать» через средневековое посредство. Русское «спасать» — своё слово, так что опоры на родство здесь нет."
memory: "ratować — «спасать», совершенный вид uratować. Запомните гнездо: ratunek «спасение», ratownik «спасатель», pogotowie ratunkowe «скорая помощь». И возглас Ratuj się kto może!"
idioms:
  - { pl: "ratować życie", ru: "спасать жизнь" }
  - { pl: "ratuj się kto może", ru: "спасайся кто может" }
  - { pl: "ratować sytuację", ru: "спасать положение" }
