  - { pl: "granica", ru: "граница", relation: root, id: granica }
  - { pl: "ograniczenie", ru: "ограничение", relation: derived }
etymology: "Приставка o- «вокруг» и GRANICA «граница», от GRAŃ «грань, ребро», из праславянского *granь — то же, что русские «грань» и «граница». Буквально «обвести границей, поставить предел», и русское «ограничить» собрано из тех же частей в том же порядке. Гнездо полностью совпадает: OGRANICZENIE «ограничение», OGRANICZONY «ограниченный», NIEOGRANICZONY «неограниченный», а также GRANICZYĆ Z CZYMŚ «граничить с чем-то»."
memory: "granica — это «граница», o- значит «вокруг»: обвести границей. Но ограничиться по-польски — DO czegoś, а не чем-то: ograniczyć się do jednej strony."
idioms:
