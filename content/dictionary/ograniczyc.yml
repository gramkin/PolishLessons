notes:
  - { kind: government, text: "Два управления, и второе русскому придётся запомнить. Прямое — винительный: OGRANICZYĆ COŚ, ograniczyć wydatki, ograniczyć dostęp. Возвратное — предлог DO с родительным: OGRANICZYĆ SIĘ DO CZEGOŚ, OGRANICZYLIŚMY SIĘ DO JEDNEJ STRONY. Русский же берёт здесь творительный без предлога: «ограничились одной страницей». Это уже четвёртая карточка подряд с таким расхождением: OBWINIAĆ меняет «в» на O, ODMAWIAĆ и DOMYŚLAĆ SIĘ меняют предлог на чистый родительный, а здесь наоборот — русский падеж без предлога становится польским предлогом с падежом. Общее правило одно: управление надо смотреть, а не переносить." }
  - { kind: usage, text: "Корень прозрачен: GRANICA — это «граница», то же слово. Приставка o- значит «вокруг», так что OGRANICZYĆ буквально «обвести границей», и русское «ограничить» собрано точно так же. Отсюда OGRANICZENIE «ограничение», OGRANICZONY «ограниченный», NIEOGRANICZONY «неограниченный». Запоминать здесь нечего: гнездо совпадает с русским слово в слово." }
  - { kind: false-friend, text: "Одно место всё же стоит отметить, и это скорее приятная новость. OGRANICZONY, как и русское «ограниченный», работает в двух смыслах: буквальном (DOSTĘP OGRANICZONY «доступ ограничен», OGRANICZONA ODPOWIEDZIALNOŚĆ «ограниченная ответственность») и обидном о человеке (ON JEST OGRANICZONY «он ограниченный»). Метафора в двух языках одна и та же, так что переносить её можно смело — включая обидность." }
  - { kind: usage, text: "Пятьдесят три формы — совершенный переходный, та же клетка, что у WYCZUĆ из партии 258: сорок одна основная форма, одиннадцать страдательных причастий и деепричастие OGRANICZYWSZY. Действительного причастия нет, потому что у совершенного вида его не бывает. Повелительное OGRANICZ выходит из третьего лица OGRANICZY отбрасыванием -y, и это ровно тот простой случай из карточки KARMIĆ, где основа на -cz слово закончить вполне может, так что никакого -ij не вставляется. Несовершенная пара — OGRANICZAĆ." }
collocations:
  - { pl: "ograniczyć wydatki", ru: "ограничить расходы" }
  - { pl: "ograniczyć dostęp", ru: "ограничить доступ" }
