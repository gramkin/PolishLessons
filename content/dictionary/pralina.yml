etymology: "Из французского praline. Название, по преданию, связано с маршалом дю Плесси-Праленом, чей повар будто бы первым приготовил такие сладости."
memory: "Pralina — конфета с начинкой, а не «пралине»-начинка. Pudełko pralin — коробка конфет в подарок."
