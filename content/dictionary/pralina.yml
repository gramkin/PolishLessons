notes:
  - { kind: false-friend, text: "PRALINA — целая шоколадная конфета с начинкой, а русское «пралине» — ореховая масса для начинки, слово несклоняемое. Польская PRALINA склоняется как обычное существительное женского рода. Ласково — PRALINKA." }
  - { kind: usage, text: "Девять живых форм. В дательном и предложном N смягчается: W PRALINIE. Родительный множественного — PRALIN: PUDEŁKO PRALIN. Звательный PRALINO не употребляется." }
