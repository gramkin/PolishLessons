# review
id: przecznica
format: 2
lemma: "przecznica"
rank: 3872
pos: noun
pron: { cyr: "пшэчни́ца" }
senses:
  - id: cross-street
    ru: "поперечная улица, квартал между улицами"
    examples:
      - pl: "Dwie przecznice dalej jest apteka."
        ru: "Через два квартала есть аптека."
        source: { kind: authored }
      - pl: "Na najbliższej przecznicy skręć w prawo."
        ru: "На ближайшем перекрёстке поверни направо."
        source: { kind: authored }
      - pl: "Następna przecznica to już rynek."
        ru: "Следующий квартал — уже рыночная площадь."
        source: { kind: authored }
  - id: block
    ru: "отрезок улицы, пересечение"
    examples:
      - pl: "Przecznicę przed kościołem zamknięto."
        ru: "Квартал перед костёлом закрыли."
        source: { kind: authored }
      - pl: "Mieszka o trzy przecznice od szkoły."
        ru: "Он живёт в трёх кварталах от школы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русского слова на это нет, и в том вся трудность: PRZECZNICA это улица, которая перерезает нашу, и отрезок между двумя такими улицами. Расстояние в польском городе считают именно так: DWIE PRZECZNICE DALEJ. И не берите на помощь KWARTAŁ: по-польски это четверть года или крупный район города, но никогда не отрезок между улицами." }
  - { kind: usage, text: "Десять форм, женский род. Родительный, дательный и местный единственного числа совпадают: все три дают PRZECZNICY. В родительном множественного окончания нет вовсе: PRZECZNIC. Слово употребляется прежде всего в указании дороги, поэтому самые частые формы — винительный PRZECZNICĘ и множественное PRZECZNICE." }
  - { kind: government, text: "Через два квартала — DWIE PRZECZNICE DALEJ, винительный с наречием DALEJ, без всякого предлога. В трёх кварталах от школы — O TRZY PRZECZNICE OD SZKOŁY, предлог O с винительным при измерении расстояния: это польская особенность, O TRZY KILOMETRY, O DWA DNI. На перекрёстке — NA PRZECZNICY, местный падеж." }
  - { kind: pronunciation, text: "Читается «пшэчни́ца», четыре слога, ударение на предпоследнем. Сочетание PRZ даёт «пш», и никакого «р» не слышно. Сочетание CZ даёт «ч», а NI перед гласной — «ни» с мягким «н». Начало слова для русского уха самое трудное: три шипящих подряд, «пшэч»." }
  - { kind: register, text: "Слово нейтральное и совершенно необходимое в городе: именно так поляк объяснит дорогу. ZA DRUGĄ PRZECZNICĄ, PO TRZECH PRZECZNICACH, O PRZECZNICĘ DALEJ — эти обороты слышны каждый день. Прилагательное POPRZECZNY значит «поперечный» и живёт в технике и в анатомии." }
collocations:
  - { pl: "następna przecznica", ru: "следующий квартал" }
  - { pl: "na przecznicy", ru: "на перекрёстке" }
