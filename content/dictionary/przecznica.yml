family:
  - { pl: "przeciąć", ru: "перерезать, пересечь", relation: root }
  - { pl: "poprzeczny", ru: "поперечный", relation: derived }
  - { pl: "przecięcie", ru: "пересечение, разрез", relation: derived }
etymology: "От PRZECZNY «поперечный», а то — от PRZECIĄĆ «перерезать», от приставки PRZE- и корня CIĄĆ «резать», праславянского и того же, что русское «сечь» и старое «тяти». Образ прямой: улица, которая перерезает нашу поперёк. Русский на это построил не слово, а описание, «поперечная улица», и в живой речи пользуется «кварталом», который у поляков значит совсем другое."
memory: "Улица, перерезающая нашу поперёк, и отрезок между двумя такими улицами. Одним русским словом не передать, а расстояние поляк считает именно так: dwie przecznice dalej «через два квартала». Читается «пшэчни́ца», где prz даёт «пш». Не подставляйте kwartal: по-польски это четверть года или район города. Корень тот же, что в przeciac «перерезать»."
idioms:
  - { pl: "dwie przecznice dalej", ru: "через два квартала" }
