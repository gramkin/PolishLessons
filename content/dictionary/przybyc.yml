# review
id: przybyc
format: 2
lemma: "przybyć"
rank: 668
pos: verb
aspect: perf
pron: { cyr: "пшы́быць" }
senses:
  - id: arrive
    ru: "прибыть, приехать"
    examples:
      - pl: "Tom przybył."
        ru: "Том прибыл."
        source: { kind: translated, id: 6178341 }
      - pl: "Przybył na czas."
        ru: "Он прибыл вовремя."
        source: { kind: translated, id: 577778 }
      - pl: "Mary przybyła do szpitala."
        ru: "Мэри прибыла в больницу."
        source: { kind: translated, id: 600292 }
  - id: increase
    ru: "прибавиться, прибыть (об увеличении)"
    note: "Второе значение — рост количества: przybyło gości «прибавилось гостей», przybyły mi dwa kilogramy «я поправился на два килограмма»."
    examples:
      - pl: "Jak do tej pory przybyło tylko pięciu gości."
        ru: "До сих пор прибыло только пять гостей."
        source: { kind: translated, id: 1589387 }
      - pl: "Zeszłego lata przybyły mi dwa kilogramy."
        ru: "Прошлым летом я поправился на два килограмма."
        source: { kind: translated, id: 1118550 }
      - pl: "Szybkie przybycie policji zaskoczyło nas."
        ru: "Быстрый приезд полиции был для нас сюрпризом."
        source: { kind: tatoeba, id: 1003433 }
notes:
  - { kind: usage, text: "Формы przybędę, przybędziesz, przybędzie — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный — przybywać." }
  - { kind: register, text: "przybyć книжнее и официальнее, чем przyjść «прийти» или przyjechać «приехать». В объявлениях и протоколах — przybyć, в разговоре — przyjść." }
  - { kind: usage, text: "Безличное przybyło + родительный значит «прибавилось»: przybyło gości «гостей прибавилось», przybyło mi lat «мне прибавилось лет»." }
  - { kind: usage, text: "Отглагольное существительное przybycie «прибытие» очень употребительно: dziękuję za przybycie «спасибо, что пришли», po przybyciu «по прибытии»." }
collocations:
  - { pl: "przybyć na czas", ru: "прибыть вовремя" }
  - { pl: "dziękuję za przybycie", ru: "спасибо, что пришли" }
  - { pl: "po przybyciu", ru: "по прибытии" }
  - { pl: "przybyło gości", ru: "гостей прибавилось" }
family:
  - { pl: "przybywać", ru: "прибывать", relation: derived }
  - { pl: "przybycie", ru: "прибытие", relation: derived }
  - { pl: "przyjść", ru: "прийти", relation: derived }
etymology: "Приставка przy- плюс być «быть», от праславянского *byti — то же слово, что русское «прибыть». Значение «прибавиться» выросло из того же «стать больше»."
memory: "przybyć — «прибыть», и слово разбирается как русское: przy- + być. Оно книжнее, чем przyjść «прийти» или przyjechać «приехать» — так пишут в объявлениях и протоколах. Формы przybędę, przybędziesz — будущее время. Второе значение — «прибавиться»: przybyło gości «гостей прибавилось», przybyły mi dwa kilogramy. А существительное przybycie звучит постоянно: dziękuję za przybycie «спасибо, что пришли»."
idioms:
  - { pl: "dziękuję za przybycie", ru: "спасибо, что пришли" }
  - { pl: "po przybyciu", ru: "по прибытии" }
  - { pl: "przybyło gości", ru: "гостей прибавилось" }
