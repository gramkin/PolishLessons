notes:
  - { kind: usage, text: "Прилагательное, которое свободно употребляется как существительное, и в мужско-личной форме множественного BEZDOMNI это стандартное обозначение людей без жилья: POMOC DLA BEZDOMNYCH «помощь бездомным», SCHRONISKO DLA BEZDOMNYCH. Русский делает то же самое со своим «бездомным», так что модель переносится. Отличать стоит от BEZDOMNY о животных: там слово остаётся прилагательным, BEZDOMNE ZWIERZĘTA, и приют для них называется SCHRONISKO, то же слово, что и для людей, но с уточнением: SCHRONISKO DLA ZWIERZĄT." }
  - { kind: false-friend, text: "Строение слова совпадает с русским полностью, часть за частью: BEZ- плюс DOM плюс -NY против «без-» плюс «дом» плюс «-ный». Поэтому угадывается оно сразу, и это один из тех случаев, когда догадке можно доверять. Ловушка только в орфографии приставки: по-польски BEZDOMNY пишется слитно, как и по-русски, но польское BEZ как самостоятельный предлог значит «без» и требует родительного падежа — BEZ DOMU. Пару BEZ DOMU и BEZDOMNY стоит проговорить вместе, чтобы отделить предлог от приставки." }
  - { kind: pronunciation, text: "Читается «бэздо́мны», ударение на предпоследнем слоге. Буква E даёт «э» и предыдущую согласную не смягчает: «бэз-», а не «без-». Конечное Y — русское «ы». Мужско-личная форма множественного BEZDOMNI звучит «бэздо́мни», с мягким n, и именно она служит существительным. Степеней сравнения у слова нет: бездомность не бывает большей или меньшей, и в таблице одиннадцать форм." }
  - { kind: government, text: "Прилагательное согласуется с существительным. В роли существительного склоняется по-прилагательному: DLA BEZDOMNYCH, с родительным после DLA, POMAGAĆ BEZDOMNYM, с дательным. Это та же модель, что у PRZEWODNICZĄCY и OSKARŻONY, разобранная на отдельной карточке: причастия и прилагательные в роли существительных сохраняют прилагательное склонение. Учреждения называются с предлогом DLA и родительным: SCHRONISKO DLA BEZDOMNYCH, JADŁODAJNIA DLA BEZDOMNYCH." }
collocations:
  - { pl: "schronisko dla bezdomnych", ru: "приют для бездомных" }
