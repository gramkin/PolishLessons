etymology: "Сложение приставки BEZ- и существительного DOM с прилагательным суффиксом -NY, то есть буквально «не имеющий дома». Русское «бездомный» собрано из тех же трёх частей и тем же способом, и совпадение здесь полное: приставка отвечает приставке, корень корню, суффикс суффиксу. Корень DOM праславянский, *domъ, и родствен латинскому DOMUS «дом» и греческому DOMOS, то есть принадлежит к древнейшему слою индоевропейской лексики. Приставка BEZ- в польском так же продуктивна, как в русском, и даёт целые ряды: BEZPŁATNY «бесплатный», BEZSENNY «бессонный», BEZRADNY «беспомощный», и все они разбираются насквозь."
memory: "Строение совпадает с русским целиком: bez- плюс dom плюс -ny. Догадке здесь можно доверять. Мужско-личное множественное bezdomni служит существительным: schronisko dla bezdomnych. Степеней нет, одиннадцать форм. Отделять приставку от предлога: bez domu раздельно, bezdomny слитно."
