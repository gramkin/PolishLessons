notes:
  - { kind: false-friend, text: "ГЛАВНОЕ ЗНАЧЕНИЕ РУССКОМУ НЕЗНАКОМО. Русский «салон» — это парикмахерская, автосалон или салон самолёта. Польское salon всё это тоже значит, но прежде всего оно значит «ГОСТИНАЯ»: salon z widokiem na ogród, goście czekali w salonie. Комнату в квартире по-русски салоном не называют — там «гостиная» или «зал»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SA-lon, «са́лён». Польское l мягче русского, поэтому lo звучит ближе к «лё». В предложном падеже мягкость усиливается: w salonie — «в саля́не»." }
  - { kind: usage, text: "Уменьшительное salonik значит «маленькая гостиная». Прилагательное salonowy относится и к мебели (meble salonowe), и к светской жизни: rozmowa salonowa «светский разговор», lew salonowy «светский лев»." }
collocations:
  - { pl: "salon fryzjerski", ru: "парикмахерская" }
  - { pl: "salon samochodowy", ru: "автосалон" }
  - { pl: "czekać w salonie", ru: "ждать в гостиной" }
family:
  - { pl: "sala", ru: "зал", relation: root, id: sala }
  - { pl: "salonik", ru: "маленькая гостиная", relation: derived }
  - { pl: "salonowy", ru: "салонный, светский", relation: derived }
etymology: "Из французского salon, а то — из итальянского salone, увеличительного от sala «зал». В русский слово пришло тем же путём, но закрепилось за заведением, а не за комнатой. Ближайший родственник прямо перед глазами: sala «зал», от которого salon и образован."
memory: "salon — прежде всего «ГОСТИНАЯ», комната в доме, и только потом парикмахерская или автосалон. Русский про комнату так не говорит. Родня простая: sala «зал»."
idioms:
  - { pl: "salon fryzjerski", ru: "парикмахерская" }
  - { pl: "lew salonowy", ru: "светский лев" }
formExamplesSkip:
