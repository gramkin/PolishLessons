      - pl: "Rozebrał się i wskoczył do wody."
        ru: "Он разделся и прыгнул в воду."
        source: { kind: authored }
  - id: dismantle
    ru: "разобрать (механизм, постройку)"
    examples:
      - pl: "Mechanik rozebrał silnik na części."
        ru: "Механик разобрал двигатель на части."
        source: { kind: authored }
      - pl: "Stary most rozebrano w zeszłym roku."
        ru: "Старый мост разобрали в прошлом году."
        source: { kind: authored }
  - id: analyse
    ru: "разобрать (проблему, текст)"
    examples:
      - pl: "Nauczyciel rozebrał zdanie na części."
        ru: "Учитель разобрал предложение по членам."
        source: { kind: authored }
      - pl: "Rozbierzmy ten problem krok po kroku."
        ru: "Давайте разберём эту проблему шаг за шагом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROZEBRAĆ — и «разобрать», и «раздеть». Русское «разобрать» в смысле «понять, разглядеть» по-польски — ROZRÓŻNIĆ или ZROZUMIEĆ: NIE MOGŁEM ROZRÓŻNIĆ SŁÓW. «Разобрать вещи по местам» — POSORTOWAĆ, а «разобрать чемодан» — ROZPAKOWAĆ." }
  - { kind: usage, text: "Пятьдесят три формы, включая ROZEBRANI: людей раздевают. Будущее время с чередованием: ROZBIORĘ, ROZBIERZESZ, ROZBIORĄ; повелительное — ROZBIERZ. Несовершенный вид — ROZBIERAĆ. «Раздеться» — ROZEBRAĆ SIĘ, «снять пальто» — ROZEBRAĆ SIĘ Z PŁASZCZA или ZDJĄĆ PŁASZCZ." }
  - { kind: government, text: "Кого или что — винительный: ROZEBRAĆ DZIECKO, ROZEBRAĆ SZAFĘ. До какой степени — DO с родительным: ROZEBRAĆ SIĘ DO PASA, DO NAGA. На что — NA с винительным: ROZEBRAĆ NA CZĘŚCI." }
  - { kind: pronunciation, text: "Читается «розэ́браць», ударение на предпоследнем слоге. ROZBIORĘ — «розбё́рэ», конечное Ę почти не слышно. ROZBIERZ — «ро́збеж»: RZ на конце оглушается в «ш»." }
  - { kind: register, text: "Нейтральное слово. У врача говорят ROZEBRAĆ SIĘ DO PASA. ROZEBRAĆ NA CZYNNIKI PIERWSZE — книжное «разложить по полочкам». В разговоре о вещах часто DEMONTOWAĆ, если речь о технике." }
collocations:
  - { pl: "rozebrać się do pasa", ru: "раздеться до пояса" }
  - { pl: "rozebrać silnik", ru: "разобрать двигатель" }
  - { pl: "rozebrać dom", ru: "разобрать дом" }
family:
  - { pl: "brać", ru: "брать", relation: root, id: brac }
  - { pl: "rozbierać", ru: "раздевать; разбирать", relation: aspect }
  - { pl: "rozbiór", ru: "раздел (государства); разбор", relation: derived }
etymology: "Приставка ROZ- «раз-» плюс BRAĆ «брать», будущее ROZBIORĘ — от того же корня. Русское «разобрать» устроено так же; значение «раздеть» развилось из «разобрать одежду»."
memory: "Rozebrać — и раздеть, и разобрать: rozebrał się, rozebrał silnik. Будущее: rozbiorę, rozbierzesz. Читается «розэ́браць»."
idioms:
  - { pl: "rozebrać na czynniki pierwsze", ru: "разложить по полочкам, разобрать до мелочей" }
