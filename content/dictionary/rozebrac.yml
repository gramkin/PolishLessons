# review
id: rozebrac
format: 2
lemma: "rozebrać"
rank: 5341
pos: verb
pron: { cyr: "розэ́браць" }
senses:
  - id: undress
    ru: "раздеть; с SIĘ — раздеться"
    examples:
      - pl: "Mama rozebrała dziecko do kąpieli."
        ru: "Мама раздела ребёнка для купания."
