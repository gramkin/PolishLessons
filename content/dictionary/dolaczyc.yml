# review
id: dolaczyc
format: 2
lemma: "dołączyć"
rank: 1166
pos: verb
aspect: perf
pron: { cyr: "доуо́нчиць" }
senses:
  - id: join
    ru: "присоединиться (dołączyć do kogoś)"
    examples:
      - pl: "Dołącz do nas."
        ru: "Присоединяйся к нам."
        source: { kind: translated, id: 5627153 }
      - pl: "Tom dołączył do nas."
        ru: "Том к нам присоединился."
        source: { kind: translated, id: 3031620 }
      - pl: "Jest gotowy, pod jednym warunkiem, by do nas dołączyć."
        ru: "Он готов присоединиться к нам при одном условии."
        source: { kind: tatoeba, id: 1352082 }
  - id: will-join
    ru: "dołączę — присоединюсь"
    examples:
      - pl: "Dołączę do was."
        ru: "Я к вам присоединюсь."
        source: { kind: translated, id: 6553799 }
      - pl: "Zaraz do ciebie dołączę."
        ru: "Сейчас к тебе присоединюсь."
        source: { kind: translated, id: 3977840 }
  - id: attach
    ru: "приложить, прикрепить (файл, документ)"
    examples:
      - pl: "Dołączyłem plik Microsoft Excel."
        ru: "Я приложил файл Microsoft Excel."
        source: { kind: translated, id: 368063 }
      - pl: "Notatka została spinaczem dołączona do dokumentu."
        ru: "Записка была скрепкой прикреплена к документу."
        source: { kind: translated, id: 3863053 }
notes:
  - { kind: government, text: "dołączyć DO kogoś «присоединиться к кому-то» — предлог do с родительным падежом. Русское «присоединиться к» требует дательного, так что падеж другой." }
  - { kind: usage, text: "Совершенный вид; несовершенный — dołączać. Без do глагол значит «приложить, прикрепить»: dołączyć plik «приложить файл»." }
  - { kind: usage, text: "Приставка do- плюс łączyć «соединять» — то же łączyć, что в wyłączyć «выключить» и włączyć «включить»." }
  - { kind: usage, text: "Причастие dołączony значит «приложенный»: ulotka dołączona do opakowania «вкладыш, приложенный к упаковке»." }
collocations:
  - { pl: "dołączyć do nas", ru: "присоединиться к нам" }
  - { pl: "dołączyć plik", ru: "приложить файл" }
  - { pl: "dołączyć do grupy", ru: "присоединиться к группе" }
family:
  - { pl: "dołączać", ru: "присоединять (несовершенный вид)", relation: aspect }
  - { pl: "łączyć", ru: "соединять", relation: root }
  - { pl: "załącznik", ru: "приложение, вложение", relation: derived }
etymology: "Приставка do- плюс łączyć «соединять» — буквально «до-соединить». Тот же корень, что в włączyć «включить» и wyłączyć «выключить»."
memory: "dołączyć — «присоединиться», и падеж другой: dołączyć DO kogoś, предлог do с родительным, а по-русски «присоединиться к» — дательный. Без do глагол значит «приложить»: dołączyć plik."
idioms:
  - { pl: "dołączyć do nas", ru: "присоединиться к нам" }
  - { pl: "dołączyć plik", ru: "приложить файл" }
