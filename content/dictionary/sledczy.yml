etymology: "От ŚLEDZIĆ «следить», а то от ŚLAD «след», от праславянского *slědъ, то есть от того же слова, что русский «след». Всё гнездо совпадает с русским часть в часть: ŚLAD и «след», ŚLEDZIĆ и «следить», ŚLEDZTWO и «следствие», ŚLEDCZY и «следователь». Различие только в первом звуке, где польское Ś отвечает русскому С, и это регулярно: ŚWIAT и «свет», ŚRODA и «среда», ŚNIEG и «снег». Образ за словом общий: идти по следу. Из того же гнезда NASTĘPSTWO уже не происходит, там другой корень."
memory: "Вся цепочка переносится на русский часть в часть: ślad «след», śledzić «следить», śledztwo «следствие», śledczy «следователь». Польское ś отвечает русскому с, как в świat и «свет», śnieg и «снег». Десять форм, потому что основа на cz, и мужско-личное множественное совпадает с именительным единственного, как у pojedynczy. Поправить управление: śledzić kogoś винительным, где русский говорит «следить за кем-то». И не спутать со śledź, это «сельдь»."
