notes:
  - { kind: usage, text: "Десять форм, а не одиннадцать, и причина та же, что у POJEDYNCZY: основа кончается отвердевшей согласной CZ, поэтому мужско-личное множественное совпадает с именительным единственного, и форма ŚLEDCZY работает в двух клетках сразу. Здесь это особенно удобно, потому что слово постоянно употребляется существительным: ŚLEDCZY значит «следователь», а ŚLEDCZY во множественном — «следователи». В этой роли оно склоняется как прилагательное, то есть ŚLEDCZEGO, ŚLEDCZEMU." }
  - { kind: false-friend, text: "Корень здесь полностью русский, и всю цепочку стоит выписать: ŚLAD это «след», ŚLEDZIĆ «следить», ŚLEDZTWO «следствие», ŚLEDCZY «следователь». Соответствие буква в букву, только польское Ś отвечает русскому С. Ловушка одна, зато смешная: ŚLEDŹ, с мягким Ź на конце, значит «сельдь», и от ŚLEDZIĆ отличается только последним звуком. Фраза ŚLEDŹ W OCCIE значит «селёдка в уксусе», а не какое-либо наблюдение." }
  - { kind: government, text: "Вести следствие — PROWADZIĆ ŚLEDZTWO, винительный. Следователь по делу — ŚLEDCZY W SPRAWIE, предлог W с местным падежом. Находиться в следственном изоляторе — SIEDZIEĆ W ARESZCIE ŚLEDCZYM, тоже местный. Глагол ŚLEDZIĆ управляет винительным прямо: ŚLEDZIĆ KOGOŚ «следить за кем-то», и здесь русский ставит предлог «за» с творительным, так что конструкцию надо менять целиком." }
  - { kind: pronunciation, text: "Читается «сьле́дчы», два слога, ударение на первом. Буква Ś даёт мягкое «сь», а не «ш», и это первое, что надо поймать. Сочетание DCZ произносится слитно, как «дч». Конечное Y — это «ы». В существительном ŚLEDZTWO слышно «сьле́дзтфо», где DZ даёт слитное «дз», а W перед O оглушается после Т. В слове ŚLAD слышно «сьлят», с оглушением конечной согласной." }
  - { kind: register, text: "Слово официальное, из языка права и прессы. Частые обороты: ARESZT ŚLEDCZY «следственный изолятор», ORGANY ŚLEDCZE «следственные органы», DZIENNIKARSTWO ŚLEDCZE «журналистское расследование», W TOKU ŚLEDZTWA «в ходе следствия». В роли существительного слово обиходно в детективах и в новостях: ŚLEDCZY USTALILI, ŻE значит «следователи установили, что». Официальное название должности при этом другое, PROKURATOR или OFICER ŚLEDCZY." }
