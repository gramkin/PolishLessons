etymology: "От STYKAĆ SIĘ «соприкасаться», от корня TYK-, того же, что в русских «стык», «тыкать», «соприкасаться». Январь назван местом, где сходятся старый и новый год. Русское название пришло из латыни, от JANUARIUS, по имени Януса, бога дверей и начал, глядевшего сразу в обе стороны: образ двойного взгляда и образ стыка совпали, хотя слова независимы. Украинское «січень» идёт от рубки леса и даёт третий, совсем иной образ."
memory: "Название от stykać się «соприкасаться»: январь это стык старого и нового года, и корень тот же, что в русском «стыке». Латинский «январь» назван по двуликому Янусу, глядевшему в обе стороны, так что мысль совпала, а слова разошлись. Парадигма привычная: беглое e выпадает, styczeń, но stycznia. Читается «сты́чень», где y даёт «ы», а не «и». Powstanie styczniowe знает каждый польский школьник."
idioms:
