notes:
  - { kind: false-friend, text: "Имя месяца идёт от глагола STYKAĆ SIĘ «соприкасаться»: январь это стык старого и нового года. Корень русскому знаком по словам «стык», «стыковать», «соприкасаться», так что название разбирается без словаря, если подсказать образ. Русский взял латинское JANUARIUS, по имени двуликого Януса, который как раз глядел в прошедший и в наступающий год, то есть мысль оказалась та же, а слова разные. Украинское «січень» идёт от «сікти» и образ даёт третий." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, и парадигма та же, что у KWIECIEŃ, SIERPIEŃ и GRUDZIEŃ: беглое E исчезает в косвенных падежах, STYCZEŃ, но STYCZNIA, STYCZNIEM, STYCZNIU. Мягкое конечное Ń уходит вместе с ним. Форм на одну больше десяти, потому что рядом с обычным родительным множественного STYCZNIÓW держится старое STYCZNI, как GRUDNI у декабря." }
  - { kind: government, text: "В каком месяце — предлог W с местным падежом: W STYCZNIU «в январе». До и от — DO и OD с родительным: DO STYCZNIA, OD STYCZNIA. Дата идёт родительным без предлога: PIERWSZEGO STYCZNIA «первого января». Перед сочетанием согласных предлог Z удлиняется до ZE: ZE STYCZNIEM «с январём», иначе три согласных подряд не выговорить." }
  - { kind: pronunciation, text: "Читается «сты́чень», два слога, ударение на первом. Буква Y даёт «ы», и первый слог звучит «сты», а не «сти»: это первое, что выдаёт русского. Сочетание CZ даёт «ч», конечное Ń мягкое «нь». В косвенных падежах беглое E пропадает вместе с мягкостью, и STYCZNIA звучит «сты́чня», где три согласных подряд, но мягкое NI их связывает." }
  - { kind: register, text: "Слово нейтральное и ежедневное: W STYCZNIU, POCZĄTEK STYCZNIA, STYCZNIOWY MRÓZ «январский мороз». Первого января, как и везде, NOWY ROK, а шестого TRZECH KRÓLI, выходной день в Польше. Из истории сюда относится POWSTANIE STYCZNIOWE тысяча восемьсот шестьдесят третьего года, последнее большое восстание против России, и это словосочетание знает каждый польский школьник." }
