pron: { cyr: "покойу́фка" }
senses:
  - id: chambermaid
    ru: "горничная (в гостинице)"
    examples:
      - pl: "Pokojówka zmienia ręczniki codziennie."
        ru: "Горничная меняет полотенца каждый день."
        source: { kind: authored }
      - pl: "Poprosiłem pokojówkę o dodatkowy koc."
        ru: "Я попросил горничную принести ещё одно одеяло."
