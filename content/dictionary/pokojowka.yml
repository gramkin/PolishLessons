notes:
  - { kind: false-friend, text: "POKOJÓWKA — от POKÓJ «комната», а не от «покоя». Само POKÓJ значит и «комната», и «мир», а русское «покои» в значении «комнаты» — тот же корень. Горничная — это «комнатная» прислуга." }
  - { kind: usage, text: "Десять форм, женский род, лицо. Перед E K переходит в C: POKOJÓWCE. Родительный множественного — POKOJÓWEK. В гостиничных штатах должность часто пишут прилагательным: POKOJOWA." }
  - { kind: government, text: "Работать горничной — PRACOWAĆ JAKO POKOJÓWKA, после JAKO именительный, или BYĆ POKOJÓWKĄ, творительный. Позвать горничную — ZADZWONIĆ PO POKOJÓWKĘ, PO с винительным." }
  - { kind: pronunciation, text: "Читается «покойу́фка», ударение на предпоследнем слоге. JÓ звучит «йу», как в POKOJOWY «покойо́вы», W перед K оглушается в «ф»." }
  - { kind: register, text: "В гостиничном контексте слово нейтральное. Второе значение — домашняя прислуга — историческое: из романов и фильмов о дворянских усадьбах." }
collocations:
  - { pl: "pokojówka hotelowa", ru: "гостиничная горничная" }
  - { pl: "wezwać pokojówkę", ru: "вызвать горничную" }
  - { pl: "praca pokojówki", ru: "работа горничной" }
family:
  - { pl: "pokój", ru: "комната; мир", relation: root, id: pokoj }
  - { pl: "pokoik", ru: "комнатка", relation: root }
  - { pl: "pokojowy", ru: "комнатный; мирный", relation: root, id: pokojowy }
etymology: "От POKÓJ «комната» с суффиксом -ÓWKA. POKÓJ — общеславянское «покой»: комната — место, где отдыхают. Отсюда же русские «покои», «опочивальня». Ó в POKÓJ чередуется с O: POKOJU, POKOJÓWKA."
memory: "Pokojówka — горничная, от pokój «комната» (ср. русское «покои»). Читается «покойу́фка». Pracuje jako pokojówka — работает горничной."
idioms:
  - { pl: "spoczywaj w pokoju", ru: "покойся с миром" }
