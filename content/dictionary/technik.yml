notes:
  - { kind: pronunciation, text: "Мужская личная форма множественного — TECHNICY, с переходом k в c. Это четвёртый согласный в уже знакомом ряду смягчений перед -y и -i: przeciwnik — przeciwnicy тоже k в c, chirurg — chirurdzy это g в dz, suchy — susi это ch в s. Ряд можно считать закрытым: заднеязычные перед передним гласным не выживают ни в одном случае." }
  - { kind: usage, text: "Родительный единственного TECHNIKA совпадает по виду с именительным совсем другого слова — женского TECHNIKA «техника». Это не слияние парадигм, а случайная встреча двух слов в одной форме, и разводит их только контекст: bez technika значит «без техника», а nowa technika — «новая техника». Существительное одушевлённое, поэтому винительный равен родительному: widzę technika." }
collocations:
  - { pl: "technik dentystyczny", ru: "зубной техник" }
  - { pl: "wezwać technika", ru: "вызвать техника" }
  - { pl: "technik budowy", ru: "техник-строитель" }
family:
  - { pl: "technika", ru: "техника", relation: root }
  - { pl: "techniczny", ru: "технический", relation: derived }
  - { pl: "technologia", ru: "технология", relation: root, id: technologia }
etymology: "Из греческого technikós «искусный, умелый», от téchnē «ремесло, искусство», через латынь и западноевропейские языки. Русский «техник» и «техника» заимствованы тем же путём и образуют такую же пару: человек и область. Разница лишь в том, что по-польски родительный от человека случайно совпал с именительным области."
memory: "Множественное TECHNICY, с k → c — как przeciwnicy. А technika — это и родительный от «техника», и «техника» сама по себе."
idioms:
  - { pl: "technik dentystyczny", ru: "зубной техник" }
  - { pl: "wezwać technika", ru: "вызвать техника" }
