etymology: "Из латинского COLONIA «поселение», от слова со значением «земледелец». Русский и польский взяли одно слово; детский лагерь польский назвал так по сходству: дети на лето «поселяются» вдали от дома."
memory: "Kolonia — колония, но kolonie — детский летний лагерь: jechać na kolonie. Читается «коло́ня». Kolonia karna — исправительная колония. Лагерь с палатками — obóz."
idioms:
