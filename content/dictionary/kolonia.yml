notes:
  - { kind: false-friend, text: "Главная ловушка — множественное число. KOLONIE, особенно в сочетании JECHAĆ NA KOLONIE, — это детский летний лагерь, а не «колонии». Каждое польское лето тысячи детей едут NA KOLONIE NAD MORZE. Подростковый лагерь с палатками — OBÓZ. А исправительная колония — KOLONIA KARNA, хотя сегодня чаще говорят ZAKŁAD KARNY." }
  - { kind: usage, text: "Десять форм в таблице, женский род. Родительный, дательный и местный единственного и родительный множественного совпадают: KOLONII. Старинная форма KOLONIJ и звательная KOLONIO сегодня не нужны." }
  - { kind: government, text: "Ехать в лагерь — JECHAĆ NA KOLONIE, NA с винительным. Быть в лагере — BYĆ NA KOLONIACH, NA с местным. Колония чего-то — KOLONIA CZEGOŚ: KOLONIA MRÓWEK." }
  - { kind: pronunciation, text: "Читается «коло́ня», три слога, ударение на втором: NIA в конце сливается в один слог, «ня», как в LINIA «ли́ня». В форме KOLONII: «коло́ньи»." }
collocations:
