etymology: "Приставка PRZY- плюс основа SIĘG-, от праславянского *sęgti «протягивать руку, достигать». Образ в основе телесный: присягающий протягивает руку к знамени, к книге, к огню. Русский сохранил и сам корень, и это слово: «присяга», «присягнуть», а рядом «посягать» и «досягаемый», где протягивание руки видно ещё яснее. Польское SIĘGAĆ значит «тянуться, доставать»: SIĘGNĄĆ PO KSIĄŻKĘ «потянуться за книгой». Носовой Ę в польском стоит на месте древнего носового гласного, который в русском дал обычное Я, и та же пара видна в PIĘĆ и «пять», DZIESIĘĆ и «десять»."
memory: "Корень совпадает с русским прямо: przysięga это «присяга», przysięgać — «присягать». Исходный смысл телесный — протянуть руку, как в sięgać «тянуться» и в русском «посягать». Главная трудность в прошедшем времени: мужская форма przysiągł с ą, женская przysięgła с ę, и то же в przysiągłem против przysięgłam. И помнить, что у глагола два инфинитива: przysiąc и przysięgnąć, оба правильные."
idioms:
