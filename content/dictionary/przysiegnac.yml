notes:
  - { kind: false-friend, text: "Корень здесь прямо совпадает с русским: PRZYSIĘGA это «присяга», PRZYSIĘGAĆ — «присягать», a ZAPRZYSIĘGNĄĆ — «привести к присяге». Исходный корень тот же, что в SIĘGAĆ «тянуться, достигать», и в русском он виден в словах «посягать», «досягаемый», «присяга»: присягающий как бы протягивает руку. Осторожнее с существительным PRZYSIĘGŁY: оно значит «присяжный», как в SĄD PRZYSIĘGŁYCH «суд присяжных», и к прилагательным на -ły по смыслу не относится." }
  - { kind: usage, text: "Пятьдесят четыре формы, и лишняя против обычных пятидесяти трёх объясняется тем же, что у ZAPOBIEC: у глагола два инфинитива, PRZYSIĄC и PRZYSIĘGNĄĆ, оба литературные. Первый короче и употребительнее, второй строит личные формы будущего времени: PRZYSIĘGNĘ, PRZYSIĘGNIESZ. Деепричастие — PRZYSIĄGŁSZY. Несовершенный партнёр — PRZYSIĘGAĆ. Такое раздвоение у польских глаголов на -C встречается не раз, и видеть его стоит заранее." }
  - { kind: government, text: "Предмет клятвы ставится в винительный: PRZYSIĄC WIERNOŚĆ, PRZYSIĄC MILCZENIE, PRZYSIĄC ZEMSTĘ. Тот, кому клянутся, идёт в дательный: PRZYSIĘGLI SOBIE ZEMSTĘ. Придаточное строится через ŻE: PRZYSIĘGNIJ, ŻE NIKOMU NIE POWIESZ. То, на чём присягают, вводится предлогом NA с винительным: PRZYSIĄC NA SZTANDAR, NA BIBLIĘ, NA HONOR. Русский в последнем случае говорит так же, «присягнуть на знамени», и предлог совпадает." }
  - { kind: stress, text: "В прошедшем времени корень меняет гласную, и это самое заметное в парадигме: мужская форма PRZYSIĄGŁ с носовым Ą, а женская PRZYSIĘGŁA с носовым Ę. То же в первом лице: PRZYSIĄGŁEM против PRZYSIĘGŁAM. Чередование древнее и закономерное, оно связано с качеством слога, и похожая мена видна в русском «нёс» рядом с «несла». Ударение во всех формах падает на предпоследний слог, так что в PRZYSIĄGŁEM оно на SIĄ, а в PRZYSIĘGLIŚMY — на GLI." }
  - { kind: register, text: "Слово торжественное и юридическое: присягают в суде, в армии, при вступлении в должность. Частые сочетания: PRZYSIĄC NA HONOR «клясться честью», ZŁOŻYĆ PRZYSIĘGĘ «принести присягу», SĄD PRZYSIĘGŁYCH «суд присяжных». В бытовой речи для «клянусь» чаще говорят PRZYSIĘGAM коротко, как вставное слово, или совсем просто SŁOWO HONORU. Детское «честное слово» по-польски будет NAPRAWDĘ или SŁOWO." }
