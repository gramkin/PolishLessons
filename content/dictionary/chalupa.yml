pos: noun
pron: { cyr: "хауу́па" }
senses:
  - id: cottage
    ru: "изба, хата, хибара"
    examples:
      - pl: "Stara chałupa stała na skraju wsi."
        ru: "Старая изба стояла на краю деревни."
        source: { kind: authored }
      - pl: "Mieszkali w drewnianej chałupie."
        ru: "Они жили в деревянной избе."
        source: { kind: authored }
      - pl: "Chałupa ledwo się trzymała."
        ru: "Изба еле держалась."
        source: { kind: authored }
  - id: shack
    ru: "домишко, развалюха (пренебрежительно)"
    examples:
      - pl: "Kupili chałupę za bezcen."
        ru: "Они купили домишко за бесценок."
        source: { kind: authored }
      - pl: "To nie dom, to chałupa."
        ru: "Это не дом, а развалюха."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Сельская деревянная изба, а в разговорной речи — пренебрежительное «домишко, развалюха» о любом жилье." }
  - { kind: false-friend, text: "Русская «халупа» — то же слово и та же пренебрежительная окраска, но по-польски первое значение нейтральное: просто деревенский дом." }
  - { kind: government, text: "Женский род: ta chałupa, tej chałupy." }
  - { kind: usage, text: "Отсюда chałupnictwo «надомный труд» — работа, которую делают по домам. В корпусе слово не встречается." }
collocations:
  - { pl: "stara chałupa", ru: "старая изба" }
  - { pl: "drewniana chałupa", ru: "деревянная изба" }
etymology: "Праславянское *xalupa; русское «халупа» — то же слово, но в русском осталась только пренебрежительная окраска."
memory: "chałupa — деревенская изба, а в разговоре «развалюха». Русская «халупа» — то же слово, только у поляков первое значение нейтральное."
