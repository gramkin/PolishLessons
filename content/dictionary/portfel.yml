notes:
  - { kind: false-friend, text: "ОДИН ИЗ САМЫХ ВЕРНЫХ СПОСОБОВ ОШИБИТЬСЯ. Русский «портфель» — это сумка для бумаг; польский PORTFEL — это КОШЕЛЁК, который носят в кармане. Портфель в русском смысле по-польски teczka. Оба слова из французского portefeuille, но разошлись: поляки взяли то, что носит деньги, русские — то, что носит бумаги. Финансовое значение, portfel inwestycyjny, совпадает." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: PORT-fel. Конечное l мягкое, читается как ль: «по́ртфэль». В косвенных падежах мягкость сохраняется: portfela — «портфэ́ля», w portfelu — «в портфэ́лю»." }
  - { kind: usage, text: "Родительный множественного у этого слова мягкий, на -i: portfeli, а не «portfelów». Так склоняются существительные на мягкий согласный: hotel — hoteli, nauczyciel — nauczycieli. Переносное значение живое: uderzyć po portfelu «ударить по кошельку», gruby portfel «толстый кошелёк, богатство»." }
collocations:
  - { pl: "zgubić portfel", ru: "потерять кошелёк" }
  - { pl: "uderzyć po portfelu", ru: "ударить по карману" }
  - { pl: "portfel inwestycyjny", ru: "инвестиционный портфель" }
family:
  - { pl: "teczka", ru: "портфель, папка", relation: antonym }
  - { pl: "torebka", ru: "сумочка", relation: root, id: torebka }
  - { pl: "pieniądze", ru: "деньги", relation: root }
etymology: "Из французского portefeuille, буквально «носи-лист»: porte от porter «носить» и feuille «лист». Слово разошлось по Европе и в каждом языке осело на своём предмете: в польском на кошельке, в русском на сумке для бумаг. Финансовый смысл — портфель бумаг — вернулся позже в оба языка."
memory: "portfel — это КОШЕЛЁК, а не портфель; портфель для бумаг по-польски teczka. Оба слова из французского portefeuille «носи-лист», но польский оставил его при деньгах. Родительный множественного мягкий: portfeli."
idioms:
  - { pl: "uderzyć po portfelu", ru: "ударить по карману" }
  - { pl: "gruby portfel", ru: "толстый кошелёк, богатство" }
