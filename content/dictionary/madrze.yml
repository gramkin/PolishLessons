# review
id: madrze
format: 2
lemma: "mądrze"
rank: 5024
pos: adv
pron: { cyr: "мо́ндже" }
senses:
  - id: wisely
    ru: "умно, мудро, разумно"
    examples:
      - pl: "Trzeba mądrze gospodarować wodą."
        ru: "Воду нужно расходовать разумно."
        source: { kind: authored }
      - pl: "Mądrze wybrał zawód."
        ru: "Он мудро выбрал профессию."
        source: { kind: authored }
      - pl: "Rząd powinien działać mądrzej."
        ru: "Правительству следует действовать умнее."
        source: { kind: authored }
  - id: clever-sounding
    ru: "умно (на словах), с умным видом"
    examples:
      - pl: "Mądrze gada, ale nie ma racji."
        ru: "Говорит он умно, но неправ."
        source: { kind: authored }
      - pl: "Pisze mądrze, ale nudno."
        ru: "Пишет он умно, но скучно."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MĄDRZE — «умно», а не только высокое «мудро». MĄDRY по-польски — обычное «умный»: MĄDRE DZIECKO, «умный ребёнок». Русское «мудрый» — то же слово, но звучит торжественнее." }
  - { kind: usage, text: "Наречие со степенями: MĄDRZE, MĄDRZEJ, NAJMĄDRZEJ. Частые обороты — MĄDRZEJ BĘDZIE, «разумнее будет», и NAJMĄDRZEJ BĘDZIE, «умнее всего будет»." }
  - { kind: government, text: "Наречие ничем не управляет. После MĄDRZEJ BĘDZIE идёт инфинитив: MĄDRZEJ BĘDZIE POCZEKAĆ, «разумнее подождать»." }
  - { kind: pronunciation, text: "Читается «мо́ндже», ударение на первом слоге. Ą перед D звучит «он», DRZ — «дж», как в MĄDRY «мо́ндры» с RZ на месте R." }
collocations:
  - { pl: "mądrze wybrać", ru: "сделать разумный выбор" }
  - { pl: "mądrze wydawać pieniądze", ru: "разумно тратить деньги" }
  - { pl: "mądrzej będzie", ru: "разумнее будет" }
family:
  - { pl: "mądry", ru: "умный, мудрый", relation: root, id: madry }
  - { pl: "mądrość", ru: "мудрость", relation: root, id: madrosc }
  - { pl: "mądrala", ru: "умник (ирон.)", relation: root }
etymology: "От MĄDRY «умный», родственного русскому «мудрый»: польское Ą на месте русского «у», как RĘKA и «рука». R перед E смягчается в RZ: MĄDRY, MĄDRZE."
memory: "Mądrze — умно, мудро: mądry «умный». Читается «мо́ндже». Mądrzej będzie poczekać — разумнее подождать. Mądry Polak po szkodzie — задним умом крепок."
idioms:
  - { pl: "mądry Polak po szkodzie", ru: "задним умом крепок" }
formExamples:
  - form: "mądrze"
    pl: "Wydał pieniądze mądrze."
    ru: "Он разумно потратил деньги."
    source: { kind: authored }
  - form: "mądrze"
    pl: "Mądrze zrobiłeś, że zostałeś w domu."
    ru: "Ты умно поступил, что остался дома."
    source: { kind: authored }
  - form: "mądrze"
    pl: "Mówi mądrze, ale nic nie robi."
    ru: "Говорит он умно, а ничего не делает."
    source: { kind: authored }
  - form: "mądrzej"
    pl: "Następnym razem postąpię mądrzej."
    ru: "В следующий раз я поступлю умнее."
    source: { kind: authored }
  - form: "mądrzej"
    pl: "Mądrzej będzie poczekać do jutra."
    ru: "Разумнее будет подождать до завтра."
    source: { kind: authored }
  - form: "mądrzej"
    pl: "Z wiekiem zaczął myśleć mądrzej."
    ru: "С возрастом он стал рассуждать мудрее."
    source: { kind: authored }
  - form: "najmądrzej"
    pl: "Najmądrzej będzie nic nie mówić."
    ru: "Умнее всего будет ничего не говорить."
    source: { kind: authored }
  - form: "najmądrzej"
    pl: "Kto odpowie najmądrzej, wygra nagrodę."
    ru: "Кто ответит умнее всех, получит приз."
    source: { kind: authored }
  - form: "najmądrzej"
    pl: "W tej sytuacji najmądrzej postąpiła babcia."
    ru: "В этой ситуации мудрее всех поступила бабушка."
    source: { kind: authored }
