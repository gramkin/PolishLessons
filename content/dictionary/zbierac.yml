# review
id: zbierac
format: 2
lemma: "zbierać"
rank: 1128
pos: verb
aspect: imperf
aspectPair: zebrac
pron: { cyr: "збе́раць" }
senses:
  - id: collect
    ru: "собирать, коллекционировать"
    examples:
      - pl: "John zbiera znaczki od dziecka."
        ru: "Джон с детства собирает марки."
        source: { kind: tatoeba, id: 3610575 }
      - pl: "Jack zbiera znaczki."
        ru: "Яцек собирает марки."
        source: { kind: translated, id: 451123 }
      - pl: "Zbieram znaczki."
        ru: "Я собираю марки."
        source: { kind: translated, id: 5879348 }
  - id: gather
    ru: "собирать (деньги, грибы, орехи)"
    examples:
      - pl: "Zbierają pieniądze, by kupić dom."
        ru: "Они собирают деньги, чтобы купить дом."
        source: { kind: translated, id: 459884 }
      - pl: "Te gryzonie zbierają orzechy na zimę."
        ru: "Эти грызуны собирают орехи на зиму."
        source: { kind: tatoeba, id: 734156 }
      - pl: "Dziewczęta chciały zbierać piękne, wiosenne kwiaty."
        ru: "Девочки хотели собирать красивые весенние цветы."
        source: { kind: translated, id: 927116 }
  - id: get-going
    ru: "zbierać się — собираться уходить"
    examples:
      - pl: "Musimy się zbierać."
        ru: "Нам пора собираться."
        source: { kind: translated, id: 7868957 }
      - pl: "Czas był się zbierać."
        ru: "Пора было собираться."
        source: { kind: translated, id: 365387 }
      - pl: "Zbieramy się do drogi."
        ru: "Мы собираемся в дорогу."
        source: { kind: translated, id: 1350491 }
notes:
  - { kind: usage, text: "Возвратное zbierać się значит «собираться уходить»: Muszę się zbierać «Мне пора». Это очень частый разговорный оборот." }
  - { kind: government, text: "zbierać coś «собирать что-то» — винительный падеж. Zbierać się do czegoś «собираться что-то делать» — предлог do с родительным." }
  - { kind: usage, text: "Отглагольное существительное zbieranie «собирание» частотно в рассказе о хобби: moje hobby to zbieranie znaczków." }
  - { kind: usage, text: "Вид несовершенный; совершенный — zebrać, карточка уже есть." }
collocations:
  - { pl: "zbierać znaczki", ru: "собирать марки" }
  - { pl: "zbierać się", ru: "собираться уходить" }
  - { pl: "zbierać pieniądze", ru: "собирать деньги" }
etymology: "Приставка z- и brać «брать», из праславянского *bьrati. Русское «собирать» собрано ровно теми же частями."
memory: "zbierać — «собирать»: zbierać znaczki, zbierać pieniądze. Возвратное zbierać się значит «собираться уходить»: Muszę się zbierać «Мне пора». Совершенный вид — zebrać."
idioms:
  - { pl: "zbierać znaczki", ru: "собирать марки" }
  - { pl: "zbierać się", ru: "собираться уходить" }
  - { pl: "kto sieje wiatr, ten zbiera burzę", ru: "кто сеет ветер, пожнёт бурю" }
