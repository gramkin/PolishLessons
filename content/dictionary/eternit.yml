etymology: "Из немецкого ETERNIT — торговой марки, которую придумал австрийский промышленник Людвиг Хачек; от латинского AETERNUS «вечный»."
memory: "Eternit — «вечный» (aeternus) шифер, который оказался совсем не вечным: в нём асбест."
