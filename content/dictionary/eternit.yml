notes:
  - { kind: false-friend, text: "Русское «шифер» по-польски — ETERNIT. Польское SZYFER или ŁUPEK — природный сланец, камень, а не асбестоцементные листы." }
  - { kind: usage, text: "Мужской род, неодушевлённое: родительный ETERNITU, предложный ETERNICIE (T переходит в C). Это название материала, поэтому обычно в единственном числе; множественное (ETERNITY) говорят о листах шифера." }
  - { kind: register, text: "Слово из названия фирмы стало нарицательным. Сегодня оно почти всегда звучит в связи с асбестом и его вывозом: USUWANIE ETERNITU — снятие и утилизация шифера." }
