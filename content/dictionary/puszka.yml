notes:
  - { kind: false-friend, text: "Самая коварная пара в этом словаре: польское PUSZKA и русское «пушка» произносятся одинаково, «пу́шка», а значат совершенно разное. PUSZKA это банка, жестянка, консервная или из-под краски. Русская «пушка» по-польски ARMATA или DZIAŁO. Поэтому PUSZKA PIWA это «банка пива», и ничего артиллерийского в этом нет. Что делает пару особенно обманчивой, так это общее происхождение: оба слова идут от одного латинско-германского названия коробки, но русский пошёл по ветке «труба — орудие», а польский остался при «коробке». Значения разъехались, а звук остался общим." }
  - { kind: government, text: "Женский род. Что внутри, передаётся родительным: PUSZKA PIWA, PUSZKA FARBY, PUSZKA KONSERWOWA. В банке — предлог W с местным: W PUSZCE. Из банки — Z с родительным: Z PUSZKI. Частотные сочетания: OTWORZYĆ PUSZKĘ «открыть банку», KONSERWA W PUSZCE «консервы в банке», PUSZKA PO FARBIE «банка из-под краски» — предлог PO с местным передаёт именно «из-под», опустевшую тару. Уменьшительное PUSZECZKA употребительно. Прилагательное PUSZKOWANY значит «консервированный»." }
  - { kind: usage, text: "В склонении два хода, оба обычные для женских слов на -KA. Первый: перед окончанием -E заднее K смягчается в C, отсюда дательный и местный PUSZCE, а не PUSZKIE. Так же MATKA и MATCE, RĘKA и RĘCE, PRAKTYKA и PRAKTYCE. Второй: в родительном множественного появляется беглая гласная E, разбивая скопление согласных — PUSZEK, а не PUSZK. То же в MATEK, KSIĄŻEK, CÓREK. Русский в похожих случаях вставляет гласную по тому же принципу: «банок», «кошек». Не путайте родительный множественного PUSZEK с отдельным словом PUSZEK «пушок, лёгкий ворс», которое звучит так же." }
  - { kind: pronunciation, text: "Читается «пу́шка», два слога, ударение на первом — ровно как русская «пушка», без малейшей разницы в звучании. Сочетание SZ даёт «ш». В местном падеже PUSZCE сочетание SZC произносится «шц»: «пу́шце». В родительном множественного PUSZEK слышно «пу́шэк», где E это «э» без смягчения. Именно полное звуковое совпадение с русским словом делает ошибку такой устойчивой: ухо не подаёт никакого сигнала." }
