etymology: "Через немецкое BÜCHSE от позднелатинского BUXIS «коробочка», а то — от греческого PYXIS, сосуда из самшита, PYXOS. Из этого же источника английское BOX. Любопытно, что русская «пушка» происходит оттуда же: германское слово дало западнославянское PUŠKA, которое означало и коробку, и трубку, а от трубки — огнестрельный ствол; по этой ветке пошли чешское PUŠKA «ружьё» и русская «пушка». Польский же остался при первом значении, при коробке, и PUSZKA у него — жестянка. Так одно заимствование дало двум соседним языкам слова одинакового звучания и несовместимого смысла: по-польски в неё наливают пиво, по-русски из неё стреляют. Уменьшительный суффикс -KA в польском слове тот же, что в русских «коробка» и «банка»."
memory: "puszka и «пушка» звучат одинаково, но puszka — это банка, жестянка, а «пушка» по-польски armata или działo. Оба слова от латинского buxis «коробочка» (оттуда же английское box): русский пошёл по ветке «труба — орудие», польский остался при коробке. В дательном и местном k→c: puszce, как matka и matce. В родительном множественного вставляется беглая e: puszek, как matek и córek."
