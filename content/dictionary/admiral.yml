notes:
  - { kind: false-friend, text: "ADMIRAŁ — «адмирал», с Ł на конце, которое читается как «у»: «адми́рау». Так же GENERAŁ — «генерал». Русское Л в конце таких слов в польском часто Ł." }
  - { kind: usage, text: "Мужской род, лицо. Множественное — ADMIRAŁOWIE, торжественное окончание -OWIE, как у GENERAŁOWIE, PROFESOROWIE. Форма ADMIRAŁY — пренебрежительная. Звательный — PANIE ADMIRALE: Ł переходит в L." }
  - { kind: government, text: "Звание адмирала — STOPIEŃ ADMIRAŁA, родительный. Получить звание — ZOSTAĆ ADMIRAŁEM, творительный. Под командованием адмирала — POD DOWÓDZTWEM ADMIRAŁA." }
  - { kind: pronunciation, text: "Читается «адми́рау», ударение на предпоследнем слоге. Конечное Ł — «у», краткое. В звательном ADMIRALE — мягкое «ль»: «адмира́лэ»." }
