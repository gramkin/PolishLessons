# review
id: diagnoza
format: 2
lemma: "diagnoza"
rank: 5132
pos: noun
pron: { cyr: "дьягно́за" }
senses:
  - id: diagnosis
    ru: "диагноз"
    examples:
      - pl: "Lekarz postawił diagnozę: zapalenie płuc."
        ru: "Врач поставил диагноз: воспаление лёгких."
        source: { kind: authored }
      - pl: "Diagnoza potwierdziła nasze obawy."
        ru: "Диагноз подтвердил наши опасения."
        source: { kind: authored }
      - pl: "Czekam na diagnozę od tygodnia."
        ru: "Я уже неделю жду диагноза."
        source: { kind: authored }
      - pl: "Poprosił o drugą opinię co do diagnozy."
        ru: "Он попросил второго мнения насчёт диагноза."
        source: { kind: authored }
      - pl: "Wczesna diagnoza zwiększa szanse na wyleczenie."
        ru: "Ранний диагноз повышает шансы на выздоровление."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DIAGNOZA — «диагноз», но женского рода и с окончанием -A: TA DIAGNOZA, BŁĘDNA DIAGNOZA. Поставить диагноз — POSTAWIĆ DIAGNOZĘ. Так же говорят о диагнозе ситуации: DIAGNOZA RYNKU." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже Z перед IE смягчается: W DIAGNOZIE. Родительный множественного — DIAGNOZ. Звательный не даётся." }
  - { kind: government, text: "Поставить диагноз — POSTAWIĆ DIAGNOZĘ, винительный. Согласиться с диагнозом — ZGODZIĆ SIĘ Z DIAGNOZĄ, творительный. Ждать диагноза — CZEKAĆ NA DIAGNOZĘ, NA с винительным." }
  - { kind: pronunciation, text: "Читается «дьягно́за», ударение на предпоследнем слоге. DIA — один слог «дья»." }
collocations:
  - { pl: "postawić diagnozę", ru: "поставить диагноз" }
  - { pl: "błędna diagnoza", ru: "ошибочный диагноз" }
  - { pl: "wczesna diagnoza", ru: "ранняя диагностика" }
family:
  - { pl: "diagnozować", ru: "диагностировать", relation: derived }
  - { pl: "zdiagnozować", ru: "поставить диагноз", relation: derived }
  - { pl: "diagnostyka", ru: "диагностика", relation: root }
etymology: "Из греческого слова со значением «распознавание». Русский «диагноз» — то же слово, но мужского рода."
memory: "Diagnoza — диагноз, женского рода: ta diagnoza. Читается «дьягно́за». Postawić diagnozę — поставить диагноз."
idioms:
  - { pl: "czarno to widzę", ru: "плохо дело, не вижу ничего хорошего" }
formExamplesSkip:
  - { form: "diagnozo", reason: "звательный падеж у этого слова не употребляется" }
