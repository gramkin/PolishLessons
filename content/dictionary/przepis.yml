notes:
  - { kind: false-friend, text: "РУССКИЙ «РЕЦЕПТ» ПОКРЫВАЕТ ДВА ПОЛЬСКИХ СЛОВА. PRZEPIS — это рецепт КУЛИНАРНЫЙ: przepis na ciasto, przepis na zupę. RECEPTA — рецепт ВРАЧЕБНЫЙ: recepta na antybiotyk, lek na receptę. Перепутать их значит попросить у врача рецепт пирога. А во множественном przepisy это вообще не рецепты, а ПРАВИЛА." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: PRZE-pis. Группа prz звучит как «пш», конечное s глухое: «пше́пис». В предложном падеже s смягчается: w przepisie — «в пшепи́ще»." }
  - { kind: usage, text: "Рецепт НА что-то — na с винительным: przepis na szarlotkę, и переносно przepis na sukces «рецепт успеха». Правила же употребляются во множественном: przepisy BHP, przepisy podatkowe, zgodnie z przepisami. Слово из гнезда pisać, рядом с opisać и spisać." }
collocations:
  - { pl: "przepis na ciasto", ru: "рецепт пирога" }
  - { pl: "przepisy ruchu drogowego", ru: "правила дорожного движения" }
  - { pl: "przepis na sukces", ru: "рецепт успеха" }
family:
  - { pl: "pisać", ru: "писать", relation: root, id: pisac }
  - { pl: "przepisać", ru: "переписать; прописать", relation: derived }
  - { pl: "recepta", ru: "врачебный рецепт", relation: antonym }
etymology: "От przepisać «переписать, предписать», приставка prze- плюс pisać «писать». Исходно przepis это то, что предписано, записано как порядок действий — отсюда и правило, и кулинарный рецепт: оба суть записанная последовательность. Русское «рецепт» пришло отдельно, из латинского receptum «принятое»."
memory: "przepis — «рецепт», но только КУЛИНАРНЫЙ: врачебный это recepta. А во множественном przepisy значит «ПРАВИЛА»: przepisy ruchu drogowego. Корень pisać, как в opisać и spisać."
idioms:
  - { pl: "przepis na sukces", ru: "рецепт успеха" }
  - { pl: "zgodnie z przepisami", ru: "согласно правилам" }
formExamplesSkip:
  - { form: "przepisie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
