  - { kind: government, text: "Мужской неодушевлённый; беглое e: rumieniec, но rumieńca, rumieńce." }
  - { kind: false-friend, text: "Корень rumiany «румяный» — ср. русское «румяный», «румянец». Здесь языки совпадают." }
  - { kind: usage, text: "Переносно — nabrać rumieńców «оживиться, заиграть красками» о деле или разговоре." }
