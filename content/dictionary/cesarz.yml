notes:
  - { kind: false-friend, text: "Польское CESARZ и русское «царь» — это одно и то же слово, разошедшееся по дороге. Оба идут от имени Цезаря, но разными путями: польский получил его через германское KAISER, русский — через греческое KAISAR, откуда «цьсарь» и дальше стяжённое «царь». Значения при этом разъехались, и титулы приходится переводить осторожно. CESARZ — это император: римский, австрийский, германский, японский. Русского царя поляки называют CAR, отдельным словом. Короля называют KRÓL. Поэтому в исторических текстах три польских титула отвечают трём русским, и подставлять «царя» под CESARZ нельзя." }
  - { kind: usage, text: "Двенадцать форм, мужской род, одушевлённое лицо. Именительных множественного два: обычное CESARZE и почтительное мужское-личное CESARZOWIE, и оба употребляются, причём второе чаще в торжественном и историческом тексте. Родительных множественного тоже два: современное CESARZY и старое CESARZÓW, которое встречается в хрониках и в юридических памятниках. Местный и звательный единственного — CESARZU. Винительный единственного равен родительному, CESARZA, как у всех названий лиц. Дательный CESARZOWI стоит в известной евангельской формуле." }
  - { kind: pronunciation, text: "Читается «це́саж», два слога, ударение на первом. Начальное C даёт «ц», как в русском. Конечное RZ звучит «ж», но на конце слова оглушается в «ш», поэтому точнее будет «це́саш». В косвенных формах RZ стоит перед гласным и звучит звонко: CESARZA — «цеса́жа», CESARZEM — «цеса́жэм». Форма CESARZOWIE читается «цесажо́ве», с ударением на предпоследнем слоге. Важно не прочесть RZ как «рз»: это один звук, а не два." }
  - { kind: register, text: "Слово историческое и книжное, но вполне живое: оно нужно в разговоре о Риме, об Австро-Венгрии, о Японии. Устойчивое ODDAĆ CESARZOWI CO CESARSKIE отвечает русскому «кесарю кесарево» и употребляется так же — о разграничении обязанностей. Производные: CESARSTWO «империя», CESARSKI «императорский», CESARZOWA «императрица». Выражение CIĘCIE CESARSKIE означает кесарево сечение, и оно совершенно обиходное, медицинское. Звательная форма CESARZU живёт в исторической прозе и в переводах." }
