etymology: "От личного имени Цезаря, ставшего титулом ещё в Риме. В германские языки оно пришло рано и дало готское KAISAR и немецкое KAISER; из немецкого его взял польский и приспособил к своему строю как CESARZ, с обычным суффиксом лица -ARZ, тем же, что в PISARZ и LEKARZ. Славянский восток получил то же слово через греческий, где оно звучало KAISAR, и дало старославянское «цьсарь», затем «цесарь» и, после стяжения, «царь». Таким образом русское «царь» и польское CESARZ — родные братья, хотя на слух этого уже не слышно. Третий потомок того же имени — немецкое KAISER — в русском тоже есть, в слове «кайзер», и это редкий случай, когда язык держит сразу три отражения одного корня."
memory: "Польское cesarz и русское «царь» — одно слово: имя Цезаря, пришедшее к полякам через немецкое Kaiser, а к русским через греческое kaisar («цьсарь» → «царь»). Но титулы разошлись: cesarz это император, царя называют car, короля król. Суффикс -arz тот же, что в pisarz, lekarz. Двойные формы: cesarze и почтительное cesarzowie, cesarzy и старое cesarzów. И обиходное cięcie cesarskie — кесарево сечение."
