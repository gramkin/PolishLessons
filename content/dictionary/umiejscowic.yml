# review
id: umiejscowic
format: 2
lemma: "umiejscowić"
rank: 2035
pos: verb
aspect: perf
pron: { cyr: "умейсцо́виць" }
senses:
  - id: locate
    ru: "локализовать, определить место"
    examples:
      - pl: "Trudno umiejscowić ból."
        ru: "Трудно локализовать боль."
        source: { kind: authored }
      - pl: "Lekarz umiejscowił zmianę w płucu."
        ru: "Врач локализовал изменение в лёгком."
        source: { kind: authored }
      - pl: "Nie potrafię umiejscowić tego dźwięku."
        ru: "Я не могу определить, откуда этот звук."
        source: { kind: authored }
  - id: place
    ru: "поместить, отнести (во времени, в пространстве)"
    examples:
      - pl: "Akcję umiejscowiono w Krakowie."
        ru: "Действие поместили в Кракове."
        source: { kind: authored }
      - pl: "Autor umiejscowił powieść w dziewiętnastym wieku."
        ru: "Автор поместил роман в девятнадцатый век."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Книжное слово; несовершенный вид — umiejscawiać." }
  - { kind: government, text: "Винительный падеж плюс обстоятельство места: umiejscowić coś w czymś." }
  - { kind: false-friend, text: "Корень miejsce «место» — ср. русское «место», «поместить»." }
  - { kind: usage, text: "В корпусе не встречается совсем, поэтому все примеры составлены вручную. Близкие слова — umieścić «поместить», zlokalizować «локализовать»." }
collocations:
  - { pl: "umiejscowić ból", ru: "локализовать боль" }
etymology: "u- + miejsce «место»; ср. русское «поместить», «разместить» от «место»."
memory: "umiejscowić — «локализовать, поместить», буквально «определить место» (miejsce). Несовершенный вид — umiejscawiać."
idioms:
  - { pl: "umiejscowić ból", ru: "локализовать боль" }
