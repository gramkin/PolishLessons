# review
id: stanac
format: 2
lemma: "stanąć"
rank: 1622
pos: verb
aspect: perf
pron: { cyr: "ста́нонць" }
senses:
  - id: stand-up
    ru: "встать, стать (на ноги, в очередь)"
    examples:
      - pl: "Stanął na nogi."
        ru: "Он встал на ноги."
        source: { kind: translated, id: 13654167 }
      - pl: "Stanąłem na końcu kolejki."
        ru: "Я встал в конец очереди."
        source: { kind: translated, id: 991170 }
      - pl: "Żeby kupić bilet, musisz stanąć w kolejce."
        ru: "Чтобы купить билет, надо встать в очередь."
        source: { kind: translated, id: 903527 }
  - id: stop
    ru: "остановиться, встать (о механизме)"
    examples:
      - pl: "Silnik stanął."
        ru: "Двигатель заглох."
        source: { kind: translated, id: 352175 }
      - pl: "Samochód stanął unieruchomiony."
        ru: "Машина встала обездвиженной."
        source: { kind: translated, id: 368937 }
  - id: face
    ru: "встать перед, оказаться лицом к лицу"
    examples:
      - pl: "Stanęli twarzą w twarz."
        ru: "Они встали лицом к лицу."
        source: { kind: translated, id: 968896 }
      - pl: "Stanęli w obliczu niełatwej sytuacji."
        ru: "Они оказались в непростой ситуации."
        source: { kind: translated, id: 899544 }
      - pl: "Martino stanął po stronie Rimy i bronił jej."
        ru: "Мартино встал на сторону Римы и защищал её."
        source: { kind: tatoeba, id: 12524367 }
notes:
  - { kind: usage, text: "Безличная форма stanięto оставлена без примеров: у непереходных глаголов положения форма на -no/-to почти не живёт. Когда нужно сказать «остановились на том, что…», берут средний род: stanęło na tym, że…" }
  - { kind: false-friend, text: "Форма stanie в текстах почти всегда принадлежит другим словам: w stanie «в состоянии» (существительное stan) и stanie się «случится» (глагол stać się). К stanąć «встать» она относится редко, поэтому в примерах пропущена." }
  - { kind: usage, text: "Отличайте stać «стоять» (быть в стоячем положении) от stanąć «встать, стать» (принять это положение). Русское «стоять — встать» различается так же." }
  - { kind: usage, text: "stanąć w kolejce — «встать в очередь»; stanąć na nogi — «встать на ноги», в том числе переносно." }
  - { kind: usage, text: "Переносно: stanąć twarzą w twarz «встать лицом к лицу», stanąć po czyjejś stronie «встать на чью-то сторону», włosy staną dęba «волосы встанут дыбом»." }
collocations:
  - { pl: "stanąć w kolejce", ru: "встать в очередь" }
  - { pl: "stanąć na nogi", ru: "встать на ноги" }
  - { pl: "stanąć po czyjejś stronie", ru: "встать на чью-то сторону" }
etymology: "Приставочный совершенный вид к stawać, от праславянского *stati «встать». Русское «стать, встать» — то же слово; польское stać «стоять» и stanąć «встать» различаются так же, как русские «стоять» и «встать»."
memory: "stanąć = «встать, стать»: stanąć w kolejce «встать в очередь», stanąć na nogi «встать на ноги». Отличайте от stać «стоять». Осторожно: форма stanie в текстах чаще всего не от этого глагола, а от stan «состояние» или stać się «случиться»."
idioms:
  - { pl: "stanąć w kolejce", ru: "встать в очередь" }
  - { pl: "stanąć na nogi", ru: "встать на ноги" }
  - { pl: "włosy stanęły dęba", ru: "волосы встали дыбом" }
formExamplesSkip:
  - { form: "stanięto", reason: "безличная форма на -no/-to у непереходного глагола практически не живёт" }
  - { form: "stanie", reason: "форма почти всегда принадлежит другим словам: существительному stan (w stanie) и глаголу stać się" }
