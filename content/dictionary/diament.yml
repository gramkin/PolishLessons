# review
id: diament
format: 2
lemma: "diament"
rank: 2500
pos: noun
pron: { cyr: "дія́мэнт" }
senses:
  - id: diamond
    ru: "алмаз"
    examples:
      - pl: "Diament jest najtwardszym minerałem."
        ru: "Алмаз — самый твёрдый минерал."
        source: { kind: authored }
      - pl: "W kopalni znaleźli surowy diament."
        ru: "В шахте нашли необработанный алмаз."
        source: { kind: authored }
  - id: gem
    ru: "бриллиант, драгоценный камень"
    examples:
      - pl: "Pierścionek z diamentem kosztował majątek."
        ru: "Кольцо с бриллиантом стоило состояние."
        source: { kind: authored }
      - pl: "Handluje diamentami od lat."
        ru: "Он торгует алмазами годами."
        source: { kind: authored }
  - id: figurative
    ru: "алмаз (о человеке, таланте)"
    examples:
      - pl: "Ten chłopiec to prawdziwy diament."
        ru: "Этот мальчик — настоящий алмаз."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ДВА ЯЗЫКА ВЗЯЛИ НАЗВАНИЕ КАМНЯ ИЗ РАЗНЫХ ИСТОЧНИКОВ. Польский diament идёт от греческого adamas «несокрушимый», через латынь. Русский «алмаз» пришёл с востока, от арабского al-mās. Поэтому слова не похожи вовсе, хотя обозначают один камень." }
  - { kind: usage, text: "Зато различение огранки у обоих языков одинаковое. DIAMENT — это камень как минерал, необработанный или вообще как вещество: diament surowy. BRYLANT — камень огранённый, в украшении. Русский делит точно так же на «алмаз» и «бриллиант», так что пару запоминай сразу обе." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: dia-MENT. Di перед гласной звучит мягко, как «дія», en как «эн»: «дія́мэнт». Предложный — diamencie, с t→ci: «діямэ́нце»." }
collocations:
  - { pl: "pierścionek z diamentem", ru: "кольцо с бриллиантом" }
  - { pl: "diament surowy", ru: "необработанный алмаз" }
  - { pl: "twardy jak diament", ru: "твёрдый как алмаз" }
family:
  - { pl: "brylant", ru: "бриллиант (огранённый)", relation: root }
  - { pl: "kamień", ru: "камень", relation: root, id: kamien }
  - { pl: "złoto", ru: "золото", relation: root, id: zloto }
etymology: "Из греческого adamas «несокрушимый, неукротимый», от a- «не» и damao «покорять», через средневековое латинское diamas. Русское «алмаз» пришло другим путём — из арабского al-mās, которое само восходит к тому же греческому слову. Общий предок, но дорога разная."
memory: "diament — «алмаз», от греческого «несокрушимый», тогда как русское «алмаз» пришло из арабского. Огранённый камень по-польски brylant — ровно как русский «бриллиант». Предложный — w diamencie, с t→ci."
idioms:
  - { pl: "twardy jak diament", ru: "твёрдый как алмаз" }
  - { pl: "diament w surowym stanie", ru: "неогранённый алмаз" }
