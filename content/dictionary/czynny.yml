synonyms: ["aktywny", "otwarty", "działający"]
etymology: "От CZYN «поступок, действие» и CZYNIĆ «делать». Тот же корень в русских «чинить» и «учинить», которые изначально значили «делать, устраивать»."
memory: "CZYN — дело, CZYNNY — тот, что в деле: работающий магазин, действующий вулкан, активный человек. Не «чинный»!"
