notes:
  - { kind: false-friend, text: "CZYNNY похож на русское «чинный», но ничего общего с ним не имеет: «чинный» по-польски STATECZNY или DOSTOJNY. CZYNNY происходит от CZYN «поступок, действие» и значит «действующий, работающий». На дверях магазина CZYNNE OD 9 DO 17 значит «открыто с 9 до 17», а CZYNNY WULKAN — «действующий вулкан»." }
  - { kind: usage, text: "Где русский говорит «открыт» или «работает» об учреждении, поляк часто выбирает CZYNNY: APTEKA CZYNNA CAŁĄ DOBĘ «аптека работает круглосуточно». Это немного официальнее, чем OTWARTY. О людях CZYNNY значит «активный, деятельный»: CZYNNY ZAWODOWO «работающий, не на пенсии», BRAĆ CZYNNY UDZIAŁ «принимать активное участие». В грамматике STRONA CZYNNA — действительный залог, а его пара — STRONA BIERNA." }
  - { kind: usage, text: "Степени образуются регулярно: CZYNNIEJSZY, NAJCZYNNIEJSZY, но в живой речи сравнительную степень чаще заменяют на AKTYWNIEJSZY или BARDZIEJ AKTYWNY. Формы с CZYNNIEJ- звучат книжно и встречаются в основном в значении «активный» о людях и организациях." }
  - { kind: pronunciation, text: "Двойное NN произносится долго: «чы́нны», с ясно слышным удвоением, как в русском «ванна». CZ — твёрдое «ч», после него Y как «ы». Ударение на первом слоге." }
collocations:
  - { pl: "czynny udział", ru: "активное участие" }
  - { pl: "czynny wulkan", ru: "действующий вулкан" }
