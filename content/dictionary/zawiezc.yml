notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «везти»: wieźć это «везти», а za- отвечает русскому за-. Ближайшие соответствия — «отвезти» и «завезти», смотря по смыслу. Опереться на родной язык можно смело: zawieźć kogoś na dworzec это ровно «отвезти кого-то на вокзал»." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ Ó И O ПО ЗАКРЫТОМУ СЛОГУ. В мужском роде единственного числа прошедшего времени слог закрыт, и пишется ó: zawiózł. Как только появляется гласное окончание, слог открывается и ó уступает место o: zawiozła, zawiozło, zawiozłem, zawiozłeś. То же правило уже встречалось в rósł/rosła и głód/głodu." }
  - { kind: government, text: "Везут КОГО или ЧТО — винительный: zawieźć dzieci, meble, dokumenty. КУДА — do с родительным для мест внутри (do szpitala, do magazynu) или na с винительным для открытых мест и мероприятий (na dworzec, na lotnisko). Обе модели совпадают с русскими." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — zawozić. Четыре формы в таблице пропущены как артефакты генератора: сама по себе основа zawiozł не употребляется, а условное наклонение мужского рода сохраняет ó, потому что частица by начинается с согласного и слог остаётся закрытым." }
collocations:
  - { pl: "zawieźć na dworzec", ru: "отвезти на вокзал" }
  - { pl: "zawieźć do szpitala", ru: "отвезти в больницу" }
  - { pl: "zawieźć dokumenty", ru: "отвезти документы" }
family:
  - { pl: "wieźć", ru: "везти", relation: root }
  - { pl: "zawozić", ru: "отвозить", relation: aspect }
  - { pl: "przewieźć", ru: "перевезти", relation: derived }
  - { pl: "wóz", ru: "телега, машина", relation: derived, id: woz }
etymology: "Приставка za- плюс wieźć «везти», из праславянского *vezti — того же слова, что русское «везти». Чередование ó и o в прошедшем времени отражает старую долготу гласного. Отсюда zawozić, przewieźć «перевезти», wywieźć «вывезти», wóz «телега, машина» и przewóz."
memory: "zawieźć — «отвезти», корень тот же, что в «везти». Главное — чередование: zawiózł с ó, но zawiozła и zawiozłem с o, потому что слог открывается. А условное мужского рода ó сохраняет: zawiózłby."
idioms:
  - { pl: "zawieźć kogoś na dworzec", ru: "отвезти кого-л. на вокзал" }
  - { pl: "zawieźć do szpitala", ru: "отвезти в больницу" }
formExamplesSkip:
  - { form: "zawiozłby", reason: "Частица by начинается с согласного, поэтому слог остаётся закрытым и ó сохраняется: правильно zawiózłby, zawiózłbym, zawiózłbyś. Форма с o возникает только перед гласным окончанием, как в zawiozłem и zawiozła. Вариант с o здесь — артефакт генератора парадигм." }
  - { form: "zawiozłbym", reason: "Частица by начинается с согласного, поэтому слог остаётся закрытым и ó сохраняется: правильно zawiózłby, zawiózłbym, zawiózłbyś. Форма с o возникает только перед гласным окончанием, как в zawiozłem и zawiozła. Вариант с o здесь — артефакт генератора парадигм." }
  - { form: "zawiozłbyś", reason: "Частица by начинается с согласного, поэтому слог остаётся закрытым и ó сохраняется: правильно zawiózłby, zawiózłbym, zawiózłbyś. Форма с o возникает только перед гласным окончанием, как в zawiozłem и zawiozła. Вариант с o здесь — артефакт генератора парадигм." }
  - { form: "zawiozł", reason: "Это не самостоятельная форма, а связанная основа. Она появляется только перед окончанием, начинающимся с гласного: zawiozłem, zawiozłeś, zawiozła. Сама по себе, в третьем лице единственного числа мужского рода, форма звучит zawiózł — с ó, потому что слог закрытый. Отдельно zawiozł не употребляется." }
