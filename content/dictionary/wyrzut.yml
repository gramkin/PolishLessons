  - { pl: "wyrzutnia", ru: "пусковая установка", relation: derived }
etymology: "От WYRZUCIĆ «выбросить», из приставки WY- и RZUCIĆ «бросить», от праславянского корня, давшего русские «бросить» через иное чередование и «ринуть». Упрёк назван по жесту: его бросают в лицо. Русский от того же корня получил «выброс», но упрёк назвал иначе, а в «угрызениях совести» выбрал образ грызущего зверя. Так два языка описали одно чувство разными картинками."
memory: "Одно слово на два русских, и оба от wyrzucić «выбросить»: wyrzut это и «упрёк», который бросают в лицо, и «выброс» вещества. Образ упрёка отличается от русского: у нас совесть грызёт, а по-польски она бросает упрёки, wyrzuty sumienia. Читается «вы́жут», потому что rz даёт «ж». Управление: robić komuś wyrzuty, дательный на лицо, где русский берёт винительный."
idioms:
  - { pl: "wyrzuty sumienia", ru: "угрызения совести" }
