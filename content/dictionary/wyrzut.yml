notes:
  - { kind: false-friend, text: "Одно польское слово покрывает два русских. WYRZUT это и «упрёк», и «выброс», потому что оба идут от WYRZUCIĆ «выбросить»: упрёк это то, что бросают в лицо. Русский построил «выброс» от того же корня, а для упрёка взял другое слово. Оборот WYRZUTY SUMIENIA отвечает русским «угрызениям совести», но образ другой: у нас совесть грызёт, у поляка она бросает упрёки." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже T переходит в CI: WYRZUT, но W WYRZUCIE. В значении упрёка слово чаще стоит во множественном числе: ROBIĆ WYRZUTY «упрекать», WYRZUTY SUMIENIA. В техническом значении, наоборот, обычно в единственном: WYRZUT LAWY, WYRZUT ENERGII." }
  - { kind: government, text: "Упрекать кого-либо — ROBIĆ KOMUŚ WYRZUTY, дательный на лицо и винительный множественного на упрёки, тогда как русский говорит «упрекать кого-то», с винительным. Упрекать за что-либо — WYRZUTY O COŚ, предлог O с винительным, где русский берёт «за». С укором — Z WYRZUTEM, предлог Z с творительным, и здесь схема совпадает." }
  - { kind: pronunciation, text: "Читается «вы́жут», два слога, ударение на первом. Сочетание RZ даёт «ж», поэтому от написания остаётся мало: не «вырзут», а «выжут». Конечное T глухое. В местном падеже WYRZUCIE сочетание CIE даёт мягкое «це», и слышно «выжу́це», с ударением уже на втором слоге, потому что оно всегда на предпоследнем." }
  - { kind: register, text: "В значении упрёка слово нейтральное и бытовое: ROBIĆ WYRZUTY, TON WYRZUTU, SPOJRZEĆ Z WYRZUTEM. Оборот WYRZUTY SUMIENIA очень частый и в разговоре, и в литературе. Техническое значение принадлежит языку науки и новостей: WYRZUT LAWY, WYRZUT MASY KORONALNEJ. Спутать их невозможно, их разводит и число, и контекст." }
collocations:
  - { pl: "robić wyrzuty", ru: "упрекать" }
  - { pl: "ton wyrzutu", ru: "тон упрёка" }
