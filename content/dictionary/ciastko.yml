notes:
  - { kind: pronunciation, text: "Это слово лучше всего показывает, отчего в других словах k переходит в c. Родительный множественного здесь CIASTEK, с той же беглой e, что в kostek, kulek, szafek и setek. А вот дательный и предложный — CIASTKU, и никакого смягчения нет. Причина в роде: смягчение вызывает окончание -e, которое есть у женских, а средние берут на его месте -u. Пара kostka — kostce против ciastko — ciastku разводит эти два правила начисто." }
  - { kind: usage, text: "Уменьшительное от CIASTO «тесто», и у польского слова значений два: и тесто, и пирог. CIASTKO — это мелкая выпечка, печенье или пирожное, а русский делит её на два слова. Выбор перевода подсказывает только начинка: ciastko z kremem скорее пирожное, kruche ciastka скорее печенье." }
collocations:
  - { pl: "ciastko z kremem", ru: "пирожное с кремом" }
  - { pl: "domowe ciastka", ru: "домашнее печенье" }
  - { pl: "paczka ciastek", ru: "пачка печенья" }
family:
  - { pl: "ciasto", ru: "тесто; пирог", relation: root, id: ciasto }
  - { pl: "ciasteczko", ru: "печеньице", relation: derived }
  - { pl: "ciastkarnia", ru: "кондитерская", relation: derived }
etymology: "Уменьшительное от CIASTO, из праславянского *těsto — то же слово, что русское «тесто», с закономерным переходом t в ć перед передним гласным. Русский от «теста» выпечку не назвал и взял для неё другие слова, «печенье» от «печь» и «пирожное» от «пирога». Так что корень общий, а названия сладостей в двух языках разошлись полностью."
memory: "Родительный множественного CIASTEK с беглой e, но дательный CIASTKU без смягчения: средний род берёт -u, а не -e, и смягчать нечему."
idioms:
