etymology: "От глагола SKRÓCIĆ, то есть приставка S- и основа KRÓTKI, праславянское *kortъkъ, родственное русскому «короткому» и латинскому CURTUS «обрезанный». Соответствие звуков здесь показательное: праславянское сочетание -or- между согласными русский развернул в полногласное -оро-, а польский стянул в -ro- с удлинением гласной, которое на письме дало Ó. Отсюда весь ряд: KRÓTKI и «короткий», KROWA и «корова», GROD и «город», BRZEG и «берег», MRÓZ и «мороз». Это одно из самых полезных правил для русскоязычного: оно превращает незнакомое польское слово в знакомое русское за один шаг, и работает в обе стороны."
memory: "Корень знаком: skrót от krótki, а это «короткий» без полногласия. Правило общее и очень полезное: русское -оро- отвечает польскому -ro- с ó — krótki и короткий, krowa и корова, mróz и мороз, brzeg и берег. Значение шире русского: и сокращение в тексте, и короткая дорога. Очень частое w skrócie «вкратце» и iść na skróty «идти напрямик». Местный skrócie с меной t→c, звучит «скру́це»."
idioms:
  - { pl: "iść na skróty", ru: "идти напрямик, искать лёгких путей" }
