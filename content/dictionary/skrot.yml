notes:
  - { kind: false-friend, text: "Русского слова с таким корнем нет, зато корень знаком до мелочи: SKRÓT от SKRÓCIĆ, а то от KRÓTKI — это русское «короткий», только без полногласия. Там, где русский даёт -ОРО-, польский даёт -RÓ- или -RO-: KRÓTKI и «короткий», KROWA и «корова», GŁOWA и «голова», BRZEG и «берег». Зная это соответствие, половину польских слов можно опознать с первого взгляда. Значение же шире русского: SKRÓT это и сокращение в тексте, и аббревиатура, и короткая дорога. Русский в последнем случае скажет «срезать» или «пойти напрямик», и одного существительного у него нет." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — SKRÓCIE, где конечное T основы переходит в C перед окончанием -E: та же мена, что в PORCIE рядом и в KREDYCIE. Буква Ó сохраняется во всех формах, потому что слог остаётся закрытым. Родительный единственного — SKRÓTU. Винительный равен именительному. Очень частое наречное W SKRÓCIE значит «вкратце, короче говоря» и стоит в начале фразы. Устойчивое IŚĆ NA SKRÓTY, с винительным множественного, значит «идти напрямик» и переносно — «искать лёгких путей»." }
  - { kind: pronunciation, text: "Читается «скрут», один слог. Буква Ó даёт «у», а конечное T глухое и твёрдое, поэтому слово звучит коротко и совсем не похоже на русское «сокращение». В форме SKRÓTU слышно «скру́ту». В форме SKRÓCIE сочетание CIE даёт мягкое «це»: «скру́це». В форме SKRÓTÓW обе Ó читаются как «у», а конечное W оглушается: «скру́туф». Начальное сочетание SKR произносится слитно, без вставного гласного." }
  - { kind: register, text: "Слово нейтральное и очень частое. Устойчивые сочетания: W SKRÓCIE «вкратце», SKRÓT MYŚLOWY «мысленное сокращение, недоговорённость», SKRÓTY KLAWISZOWE «горячие клавиши», IŚĆ NA SKRÓTY. В значении дороги слово бытовое и часто звучит в разговоре о маршруте. Производные: SKRÓCIĆ, SKRÓTOWY «сжатый, краткий», SKRÓTOWIEC — термин для аббревиатуры в языкознании. Отдельно стоит отметить, что польские аббревиатуры читаются по буквам реже, чем русские, и многие произносятся как слова." }
