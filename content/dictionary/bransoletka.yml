etymology: "Из французского BRACELET через немецкое BRASSELETT, от латинского BRACCHIUM «рука». Русское «браслет» — то же слово."
memory: "Bransoletka — браслет. Złota bransoletka — золотой браслет. Na bransoletce — на браслете. Читается «брансоле́тка»."
