notes:
  - { kind: false-friend, text: "BRANSOLETKA — «браслет», с уменьшительным -KA: в польском так называют любой браслет, не только маленький. Браслет часов — PASEK, если кожаный, и BRANSOLETA, если металлический." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: NA BRANSOLETCE. Родительный множественного — BRANSOLETEK, с беглым E. Звательный BRANSOLETKO не употребляется." }
  - { kind: government, text: "Браслет из чего — BRANSOLETKA Z и родительный: Z SREBRA, Z KORALIKÓW. Надеть браслет — ZAŁOŻYĆ BRANSOLETKĘ, винительный. На браслете — NA BRANSOLETCE." }
  - { kind: pronunciation, text: "Читается «брансоле́тка»: LE — мягкое «ле», ударение на предпоследнем слоге. BRANSOLETCE — «брансоле́тце»." }
collocations:
