notes:
  - { kind: usage, text: "Устроено как POSŁAĆ из прошлой партии: один инфинитив, два глагола. Основа PRZEŚL-/PRZESŁ- значит «переслать, передать»: PRZEŚLĘ, PRZEŚLIJ, PRZESŁAŁ, PRZESŁANY. Основа PRZEŚCIEL- значит «перестелить постель»: PRZEŚCIELĘ, PRZEŚCIEL, PRZEŚCIELONY. Приставка различает и смысл внутри первого глагола: POSŁAĆ — послать кого-то с поручением, PRZESŁAĆ — переслать что-то дальше, передать по каналу. Поэтому PRZESŁAĆ почти всегда о документе, файле или сообщении, и звучит официальнее." }
  - { kind: pronunciation, text: "Читается «пше́суаць»: prz — это «пш», ł — это «у», а ударение на приставке, потому что слово двусложное. Буква ł здесь особенно коварна, потому что русское «переслать» имеет в этом месте л, и рука сама пишет «пше́слаць». Формы с ś мягкие: PRZEŚLIJ — «пше́сьлий», PRZEŚLĘ — «пше́сьлэн». У глагола постели PRZEŚCIELĘ — «пшесьце́лэн», уже с ударением на третьем слоге от конца, потому что слово удлинилось." }
  - { kind: government, text: "Глагол переходный и двухместный. Что переслали — винительный: PRZESŁAĆ DOKUMENT. Кому — дательный без предлога: PRZESŁAĆ KOMUŚ PISMO. Куда — предлоги DO или NA: PRZESŁAĆ DO SĄDU, PRZESŁAĆ NA NOWY ADRES. Чем, каким способом — творительный без предлога: PRZESŁAĆ MAILEM, POCZTĄ, KURIEREM, FAKSEM. Этот творительный способа тот же, что в SMSEM и TELEFONEM, и в русском ему отвечает предлог «по»: «переслать по почте»." }
  - { kind: false-friend, text: "Ловушка в существительном. PRZESŁANIE значит не «пересылка», а «посыл, главная мысль, идея»: PRZESŁANIE FILMU — «идея фильма», PRZESŁANIE KSIĄŻKI — «то, что книга хочет сказать». Это одно из самых частых слов в рецензиях и школьных сочинениях. Для «пересылки» в смысле отправления есть PRZESYŁKA, а в смысле действия — PRZESŁANIE тоже годится, но первым в голову полякам приходит именно «идея». Русское «послание» ближе к польскому PRZESŁANIE, чем к POSŁANIE." }
collocations:
