family:
  - { pl: "posłać", ru: "послать; постелить", relation: root, id: poslac }
  - { pl: "wysłać", ru: "выслать, отправить", relation: root, id: wyslac }
  - { pl: "przesyłka", ru: "посылка, отправление", relation: derived }
  - { pl: "przesłanie", ru: "посыл, главная мысль", relation: derived }
etymology: "Та же пара праславянских глаголов, что в POSŁAĆ: *sъlati «слать», с основой настоящего времени ŚL-, и *stьlati «стлать», с основой ŚCIEL-. Оба инфинитива слились в польское SŁAĆ, и различие ушло в основу, тогда как русский сохранил два инфинитива, «слать» и «стлать». Приставка PRZE- отвечает русскому «пере-» и несёт идею перемещения через что-то и дальше: переслать — значит отправить не просто куда-то, а дальше по цепочке. Отсюда и существительное PRZESŁANIE: то, что передано через текст читателю, — «посыл». Русское «послание» проделало ту же метафору от того же корня."
memory: "Два глагола, один инфинитив: prześl-/przesł- «переслать», prześciel- «перестелить». Пишется ł, читается «у»: «пше́суаць», не «пше́слаць». Способ пересылки — творительный: przesłać MAILEM. И przesłanie — это «идея, посыл», а не «пересылка»."
idioms:
  - { pl: "przesłać pozdrowienia", ru: "передать привет" }
  - { pl: "przesłanie filmu", ru: "идея фильма, то, что фильм хочет сказать" }
formExamplesSkip:
  - { form: "prześcieleni", reason: "Как и POŚCIELENI у POSŁAĆ: PRZEŚCIELIĆ управляет винительным падежом того, что перестилают — ŁÓŻKO, KANAPĘ, — а человек, которому перестилают, стоит в дательном: PRZEŚCIELIĆ KOMUŚ. Страдательное причастие мужско-личного множественного числа предполагает людей в роли прямого дополнения, поэтому у этого глагола оно грамматически невозможно. Формы PRZEŚCIELONY, PRZEŚCIELONA и PRZEŚCIELONE согласуются с постелью и написаны." }
