etymology: "Из латинского COLLECTIO «собирание», от COLLIGERE «собирать», которое само состоит из COM- «вместе» и LEGERE «собирать, читать». Русская «коллекция» пришла из того же латинского источника через французское и немецкое посредство, и различие в написании объясняется не происхождением, а правилами: латинское COLLECTIO имеет двойную L, русский её сохранил, польский упростил, как поступает с удвоенными согласными почти всегда. Корень LEGERE оставил в европейских языках длинный ряд: LEKCJA и «лекция», LEKTURA «чтение», INTELIGENCJA, LEGENDA — всюду исходное «собирать, выбирать, читать». Польское -CJA на месте латинского -TIO и русского -ЦИЯ это регулярное соответствие, и оно же объясняет старую форму родительного множественного KOLEKCYJ."
memory: "Одна L, в отличие от русской «коллекции»: польский не удваивает согласных там, где русский удваивает — klasa, dyskusja, adres, kaseta. Класс -cja отвечает русскому -ция без исключений. Склонение как у fantazja: kolekcji сразу на родительный, дательный и местный единственного и на родительный множественного; старая форма kolekcyj — в книгах до середины двадцатого века. Из латинского colligere «собирать», отсюда же lekcja и legenda."
