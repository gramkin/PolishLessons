notes:
  - { kind: false-friend, text: "Значение совпадает с русской «коллекцией», а написание — нет, и расхождение ровно в одной букве. По-польски KOLEKCJA с одной L, по-русски «коллекция» с двумя. Это частный случай общего правила: польский почти не удваивает согласных в заимствованиях, где русский удваивает. KLASA против «класса», DYSKUSJA против «дискуссии», ADRES против «адреса», KASETA против «кассеты». Поэтому слово легко узнать и легко написать неправильно. Вторая половина подсказки работает безотказно: польское -CJA отвечает русскому -ЦИЯ, как в STACJA и LEKCJA." }
  - { kind: government, text: "Женский род на -JA, склонение то же, что у FANTAZJA. Родительный, дательный и местный единственного совпадают в форме KOLEKCJI, и она же служит родительным множественного. Старая форма родительного множественного KOLEKCYJ встречается в текстах до середины двадцатого века. Чего коллекция — родительный без предлога: KOLEKCJA MONET, KOLEKCJA ZNACZKÓW. Пополнять — предлог DO с родительным: DOKUPIĆ DO KOLEKCJI. Заботиться — OPIEKOWAĆ SIĘ с творительным: OPIEKOWAĆ SIĘ KOLEKCJĄ." }
  - { kind: pronunciation, text: "Читается «колэ́кцья», ударение на предпоследнем слоге из трёх. Сочетание KC произносится раздельно, «кц», без выпадения, а CJ даёт «ць» с последующим «я», то есть «цья». Обе буквы L в русском слове здесь одна, и произносится она мягко: «ля» в конце. В родительном KOLEKCJI конечное -JI читается «цьи»: «колэ́кцьи». В старой форме KOLEKCYJ слышно «колэ́кцый»." }
  - { kind: usage, text: "Частотные сочетания: KOLEKCJA MONET, KOLEKCJA ZNACZKÓW «коллекция марок», KOLEKCJA PRYWATNA, KOLEKCJA WIOSENNA о линии одежды, UZUPEŁNIĆ KOLEKCJĘ «пополнить коллекцию». Собиратель — KOLEKCJONER, и слово это длиннее русского «коллекционера» ровно на ту же одну L, которой в нём нет. Глагол KOLEKCJONOWAĆ «коллекционировать» употребляется и в переносном смысле, о привычках и неудачах. В музейном языке рядом стоит ZBIÓR «собрание», более официальное слово." }
