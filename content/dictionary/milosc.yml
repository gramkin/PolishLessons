notes:
  - { kind: false-friend, text: "Слово построено как русское «милость» — miły «милый» + -ość, — но значит «любовь». Русской «милости» отвечает łaska." }
  - { kind: usage, text: "miłość do kogoś — «любовь к кому-то»; miłość od pierwszego wejrzenia — «любовь с первого взгляда»." }
  - { kind: usage, text: "Множественное miłości («любови, романы») встречается редко и звучит книжно." }
collocations:
