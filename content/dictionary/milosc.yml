  - { pl: "pierwsza miłość", ru: "первая любовь" }
etymology: "Из miły «милый» + -ość, праславянское *milostь; русское «милость» образовано точно так же, но значения разошлись."
memory: "miłość — «любовь», хотя построено как русская «милость»: miły + -ość. А русской «милости» отвечает łaska."
idioms:
