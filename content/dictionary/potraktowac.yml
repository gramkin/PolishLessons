notes:
  - { kind: false-friend, text: "Это один из самых обманчивых глаголов для русскоязычного. Польское TRAKTOWAĆ KOGOŚ значит «обращаться с кем-то, относиться к кому-то», а вовсе не «трактовать». POTRAKTOWAŁ MNIE ŹLE переводится «он плохо со мной обошёлся», и никакого истолкования тут нет. Русское «трактовать» в смысле «истолковывать» по-польски будет INTERPRETOWAĆ или TŁUMACZYĆ. Ошибка тем опаснее, что в значении «расценить как» глаголы почти сходятся: POTRAKTOWAĆ COŚ JAKO ŻART близко к «расценить как шутку», и это сходство усыпляет внимание." }
  - { kind: government, text: "С лицом работает винительный: POTRAKTOWAĆ KOGOŚ. Сравнение вводится союзом JAK с именительным падежом: POTRAKTOWAŁ MNIE JAK INTRUZA. Здесь русский расходится с польским, потому что требует предлога «с» и творительного: «обошёлся со мной как с чужаком». Второе значение строится через JAKO: POTRAKTOWAĆ COŚ JAKO ŻART «расценить что-то как шутку». Есть и техническое употребление с творительным средства: POTRAKTOWAĆ POWIERZCHNIĘ KWASEM «обработать поверхность кислотой», и вот оно русскому понятно без оговорок." }
  - { kind: usage, text: "Глагол на -OWAĆ, значит личные формы идут на -UJ-: POTRAKTOWAĆ, но POTRAKTUJĘ, POTRAKTUJESZ, POTRAKTUJĄ. Образец тот же, что в русском «рисовать» и «рисую». Несовершенный партнёр — TRAKTOWAĆ, и он описывает длящееся отношение: TRAKTUJE NAS DOBRZE «он к нам хорошо относится», тогда как POTRAKTOWAĆ говорит об одном случае. Пятьдесят три формы — подпись переходного глагола совершенного вида. Страдательное причастие мужского лица здесь вполне употребимо, POTRAKTOWANI NIESPRAWIEDLIWIE, потому что лицо стоит в винительном и свободно становится подлежащим." }
  - { kind: pronunciation, text: "Читается «потракто́вачь», четыре слога, ударение на предпоследнем. Буква R твёрдая и раскатистая, сочетание TR произносится без призвука. Конечное Ć мягкое, «чь». В личных формах ударение переходит вместе с основой: POTRAKTUJĘ это «потракту́е», а конечное носовое Ę в разговорной речи часто теряет носовость и звучит просто как «э». В причастии POTRAKTOWANY слышно «потрактова́ны»." }
  - { kind: register, text: "Слово нейтральное и очень ходовое, особенно в разговоре о справедливости и обхождении: POTRAKTOWAĆ KOGOŚ ULGOWO «отнестись к кому-то снисходительно», POTRAKTOWAĆ SPRAWĘ PRIORYTETOWO «рассмотреть дело в первую очередь», POTRAKTOWAĆ COŚ POWAŻNIE. Родственные слова почти все книжные: TRAKTAT «трактат, договор», TRAKTOWANIE «обращение», ZŁE TRAKTOWANIE «дурное обращение». Существительное TRAKT означает «тракт, большую дорогу», и это ещё один побег того же латинского корня." }
