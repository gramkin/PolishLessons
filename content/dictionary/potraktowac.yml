etymology: "Приставка PO- плюс TRAKTOWAĆ, заимствованное из латинского TRACTARE «тащить, обходиться, обсуждать», а оно — многократная форма от TRAHERE «тянуть». Корень разошёлся по Европе необычайно широко, и русскому он знаком по целому ряду слов, пришедших разными путями: «трактат», «тракт», «трактир», «трактор», «контракт», «абстрактный». Все они о тяге: трактор тянет, тракт тянется, контракт стягивает стороны. Польский взял у латыни значение «обходиться с кем-то», русский через немецкое посредство — значение «истолковывать», и расхождение двух языков в этом слове объясняется именно разными путями заимствования, а не разной историей корня."
memory: "Главная ловушка: traktować kogoś значит «обращаться с кем-то», а не «трактовать». Potraktował mnie źle — «он плохо со мной обошёлся». Для русского «трактовать» в польском есть interpretować. Сравнение идёт через jak с именительным, potraktował mnie jak intruza, где русский требует «со мной как с чужаком». Спряжение обычное для глаголов на -ować: potraktuję, potraktujesz, как «рисую» при «рисовать»."
