etymology: "От EMOCJONALNY, а то — от EMOCJA, через французский из латинского глагола со значением «волновать, потрясать». Русское «эмоция» — из того же источника."
memory: "Emocjonalnie — эмоционально. Читается «эмоцйона́льне». Emocjonujący mecz — захватывающий матч. Związany emocjonalnie z kimś — привязан к кому-то."
idioms:
  - { pl: "brać coś do siebie", ru: "принимать что-то на свой счёт" }
