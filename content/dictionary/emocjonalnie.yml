notes:
  - { kind: false-friend, text: "Само наречие переводится прямо. Ловушка рядом: EMOCJONUJĄCY значит «захватывающий», а не «эмоциональный»: EMOCJONUJĄCY MECZ — «захватывающий матч». «Эмоциональный человек» — EMOCJONALNY CZŁOWIEK." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Чаще всего при глаголах реакции и при причастиях: REAGOWAĆ EMOCJONALNIE, EMOCJONALNIE WYCZERPANY." }
  - { kind: government, text: "Наречие ничем не управляет, но в устойчивом обороте есть предлог: EMOCJONALNIE ZWIĄZANY Z KIMŚ, «эмоционально привязан к кому-то», Z с творительным там, где в русском «к» с дательным." }
  - { kind: pronunciation, text: "Читается «эмоцйона́льне», ударение на предпоследнем слоге. CJO — «цйо», L перед N мягкое: «ль»." }
