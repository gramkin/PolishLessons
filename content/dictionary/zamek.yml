# review
id: zamek
format: 2
lemma: "zamek"
rank: 1505
pos: noun
pron: { cyr: "за́мэк" }
senses:
  - id: castle
    ru: "замок (крепость)"
    examples:
      - pl: "Zamek wznosi się nad miastem."
        ru: "Замок возвышается над городом."
        source: { kind: tatoeba, id: 1772939 }
      - pl: "Zamek jest piękny."
        ru: "Замок красивый."
        source: { kind: translated, id: 10616777 }
      - pl: "Kiedy zbudowano ten zamek?"
        ru: "Когда построили этот замок?"
        source: { kind: translated, id: 1313302 }
  - id: lock
    ru: "замок (запор)"
    examples:
      - pl: "Wsunął klucz do zamka."
        ru: "Он вставил ключ в замок."
        source: { kind: translated, id: 367183 }
      - pl: "Ten klucz nie pasuje do zamka."
        ru: "Этот ключ не подходит к замку."
        source: { kind: translated, id: 357373 }
      - pl: "Zamek musi być zepsuty."
        ru: "Замок, должно быть, сломан."
        source: { kind: translated, id: 2587246 }
  - id: zipper
    ru: "молния (застёжка)"
    examples:
      - pl: "Zaciął mi się zamek."
        ru: "У меня заела молния."
        source: { kind: translated, id: 3951083 }
      - pl: "Co powiedział biznesmen po wynalezieniu zamka błyskawicznego?"
        ru: "Что сказал бизнесмен после изобретения застёжки-молнии?"
        source: { kind: translated, id: 676916 }
notes:
  - { kind: false-friend, text: "Родительный падеж различает значения: zamku — от «замка-крепости» (mury zamku «стены замка»), а zamka — от «замка-запора» и «молнии» (klucz do zamka «ключ от замка»). Редкий случай, когда падеж снимает омонимию." }
  - { kind: usage, text: "zamek błyskawiczny — «застёжка-молния», буквально «молниеносный замок»; в разговоре просто zamek." }
  - { kind: pronunciation, text: "Русские «за́мок» и «замо́к» различаются ударением, а польский zamek — нет: ударение всегда на первый слог, различает только контекст и падеж." }
  - { kind: usage, text: "budować zamki na piasku — «строить замки на песке», то же выражение, что в русском." }
collocations:
  - { pl: "zamek błyskawiczny", ru: "застёжка-молния" }
  - { pl: "klucz do zamka", ru: "ключ от замка" }
  - { pl: "mury zamku", ru: "стены замка" }
etymology: "От zamykać «закрывать» — буквально «то, что закрывает». Значение «крепость» развилось из «запертое, укреплённое место». Русские «за́мок» и «замо́к» — то же слово и та же двойственность, унаследованная из праславянского."
memory: "zamek — и «замок-крепость», и «замок-запор», и «молния» на одежде. Русский различает их ударением (за́мок / замо́к), а польский — родительным падежом: zamku у крепости, zamka у запора."
idioms:
  - { pl: "zamek błyskawiczny", ru: "застёжка-молния" }
  - { pl: "budować zamki na piasku", ru: "строить замки на песке" }
  - { pl: "zamek na lodzie", ru: "воздушный замок" }
