  - id: foe-state
    ru: "неприятель, вражеское войско"
    examples:
      - pl: "Wróg zaatakował miasto."
        ru: "Враг атаковал город."
        source: { kind: translated, id: 5823746 }
      - pl: "Wróg zaatakował nas w nocy."
        ru: "Враг атаковал нас ночью."
        source: { kind: translated, id: 3976966 }
      - pl: "Poddać się wrogowi."
        ru: "Сдаться врагу."
        source: { kind: translated, id: 415359 }
notes:
  - { kind: usage, text: "Мужской род, лично-мужской: множественное wrogowie «враги» (не *wrogi), родительный wrogów. Это тот же тип, что mężczyźni, studenci." }
  - { kind: usage, text: "Чередование в корне: wróg, но wroga, wrogowie — ó переходит в o во всех формах, кроме именительного единственного." }
  - { kind: usage, text: "Праславянское *vorgъ — то же слово, что русское «враг»; полногласие -оро- в русском отвечает польскому -ró-, как в krótki ~ короткий." }
  - { kind: usage, text: "Частые сочетания: śmiertelny wróg «смертельный враг», narobić sobie wrogów «нажить врагов», wróg publiczny «враг общества»." }
collocations:
  - { pl: "śmiertelny wróg", ru: "смертельный враг" }
  - { pl: "narobić sobie wrogów", ru: "нажить врагов" }
  - { pl: "pokonać wroga", ru: "победить врага" }
  - { pl: "wróg publiczny", ru: "враг общества" }
family:
  - { pl: "wrogi", ru: "враждебный", relation: derived }
  - { pl: "wrogość", ru: "враждебность", relation: derived }
etymology: "Праславянское *vorgъ — то же слово, что русское «враг». Русскому полногласию -оро- отвечает польское -ró-: wróg ~ враг, krótki ~ короткий, gród ~ город."
memory: "wróg — «враг», и слово узнаётся сразу: польское -ró- на месте русского -оро-, как в krótki ~ короткий. Две вещи стоит запомнить. Первая: чередование ó → o во всех косвенных формах — wróg, но wroga, wrogiem, wrogowie. Вторая: существительное лично-мужское, поэтому множественное — wrogowie «враги», а не *wrogi, и родительный — wrogów."
idioms:
  - { pl: "śmiertelny wróg", ru: "смертельный враг" }
  - { pl: "narobić sobie wrogów", ru: "нажить врагов" }
  - { pl: "wróg nie śpi", ru: "враг не дремлет" }
