id: wrog
format: 2
lemma: "wróg"
rank: 785
pos: noun
pron: { cyr: "врук" }
senses:
  - id: enemy
    ru: "враг, недруг"
    examples:
      - pl: "Zwyciężyliśmy wroga."
        ru: "Мы победили врага."
        source: { kind: tatoeba, id: 525789 }
      - pl: "Tom jest moim wrogiem."
        ru: "Том — мой враг."
