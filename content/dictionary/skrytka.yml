etymology: "От глагола SKRYĆ, от приставки S- и KRYĆ «крыть», слова праславянского и того же, что русские «крыть», «скрыть» и «крыша». Тайник это, дословно, «скрытое место». Родство здесь полное и слышно без всяких правил: SKRYTKA, SKRYTY, UKRYCIE стоят рядом с нашими «скрыть», «скрытный», «укрытие». Из того же корня и польское POKRYCIE, и наша «покрышка»."
memory: "Тайник, от skryc «скрыть» — корень наш, тот же, что в «скрыть», «скрытный» и «крыша». Читается «скры́тка», скопление skr выговаривается целиком. В дательном и местном k переходит в c: w skrytce. Два сочетания стоит заучить: skrytka pocztowa это «абонентский ящик», на конвертах skr. poczt., а skrytka bankowa — банковская ячейка."
idioms:
  - { pl: "skrytka pocztowa", ru: "абонентский ящик" }
