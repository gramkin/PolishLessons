notes:
  - { kind: false-friend, text: "Слово прозрачное и для русского лёгкое: SKRYTKA от SKRYĆ «скрыть», и корень тот же, что в наших «скрыть», «скрытный» и даже «крыша». Запомнить стоит два закреплённых сочетания. SKRYTKA POCZTOWA это «абонентский ящик», и на конвертах его сокращают до SKR. POCZT. А SKRYTKA BANKOWA — банковская ячейка. И прилагательное SKRYTY значит «скрытный» о человеке, ровно как у нас." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: SKRYTKA, но W SKRYTCE. В родительном множественного появляется беглое E: SKRYTEK. Основа не меняется больше ничем. Существительное UKRYCIE того же корня значит «укрытие», а WYJŚĆ Z UKRYCIA — «выйти из укрытия»." }
  - { kind: government, text: "В тайнике — W SKRYTCE, местный падеж с переходом K в C. Спрятать в тайнике — UKRYĆ W SKRYTCE, тоже местный, потому что речь о месте. О тайнике — O SKRYTCE, снова местный. Без тайника — BEZ SKRYTKI, родительный. Все главные обороты требуют здесь местного падежа, и форма у них одна." }
  - { kind: pronunciation, text: "Читается «скры́тка», два слога, ударение на первом. Скопление SKR произносится полностью, без всякой гласной внутри. Буква Y даёт «ы», поэтому первый слог это «скры». В форме SKRYTCE сочетание TC даёт «тц»: «скры́тце»." }
  - { kind: register, text: "Слово нейтральное и совершенно практическое. На почте это SKRYTKA POCZTOWA, в банке — SKRYTKA BANKOWA или SKRYTKA DEPOZYTOWA. В доме SKRYTKA значит тайник, и так говорят и в книгах о войне, и в объявлениях о старых домах, где при ремонте находят SKRYTKI W PODŁODZE." }
