notes:
  - { kind: false-friend, text: "ЭТО КОРЕНЬ, ИЗ КОТОРОГО РУССКИЙ ВЗЯЛ ДВА СЛОВА. Ważyć «весить» от waga «вес». От него же ważny — буквально «имеющий вес», — и русское «ВАЖНЫЙ» заимствовано именно отсюда. И odważyć się «взвесить и решиться» дало русское «ОТВАЖНЫЙ». Так что waga, ważny, odważny и ważyć — одна семья, и два её члена русский язык взял у поляков целиком." }
  - { kind: government, text: "Глагол работает в обе стороны. Без дополнения он значит «весить»: paczka waży dwa kilo, ile ważysz. С винительным — «взвешивать»: ważyć towar, ważyć jabłka. Возвратное ważyć się значит и «взвешиваться» (ważę się co rano), и «отваживаться»: ważyć się na coś, nie waż się tego robić «не смей этого делать»." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — zważyć. Поэтому есть причастие ważący и деепричастие ważąc, а формы на -wszy у него нет: она принадлежит совершенному виду и живёт в обороте zważywszy na coś «принимая во внимание». Одна форма в таблице пропущена по этой причине и объяснена в карточке." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: WA-żyć. Ż читается как твёрдое ж, y как ы: «ва́жыць». В страдательном причастии появляется o: ważony — «важо́ны», с ударением на предпоследнем слоге." }
collocations:
  - { pl: "ile ważysz?", ru: "сколько ты весишь?" }
  - { pl: "ważyć słowa", ru: "взвешивать слова" }
  - { pl: "nie waż się!", ru: "не смей!" }
family:
  - { pl: "waga", ru: "вес, весы", relation: root, id: waga }
  - { pl: "ważny", ru: "важный", relation: derived, id: wazny }
  - { pl: "odważny", ru: "отважный", relation: derived, id: odwazny }
  - { pl: "zważyć", ru: "взвесить", relation: aspect }
etymology: "От waga «вес», из средневекового немецкого wāge «весы». Глагол оброс родным гнездом: ważny «важный», odważyć się «отважиться», odważny «отважный», rozważyć «обдумать», uważać «считать, следить». Русские «важный» и «отважный» заимствованы из польского вместе с этой внутренней формой: важно то, что имеет вес."
memory: "ważyć — и «весить», и «взвешивать»: ile ważysz? против ważyć towar. Корень waga «вес» дал ważny, и русское «важный» взято отсюда же. А ważyć się значит «взвешиваться» и «отваживаться»: nie waż się! — «не смей!»."
idioms:
  - { pl: "ważyć słowa", ru: "взвешивать слова" }
  - { pl: "nie waż się tego robić", ru: "не смей этого делать" }
formExamplesSkip:
  - { form: "ważywszy", reason: "Пропуск по грамматической причине. Деепричастие на -wszy образуется в польском ТОЛЬКО от глаголов совершенного вида. Ważyć несовершенный, и его деепричастие — ważąc «взвешивая»; форма на -wszy принадлежит совершенному zważyć, откуда zważywszy — слово живое и частотное в обороте zważywszy na coś «принимая во внимание что-л.». Отдельное ważywszy от несовершенного глагола — артефакт генератора парадигм." }
