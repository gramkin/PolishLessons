# review
id: zblizac
format: 2
lemma: "zbliżać"
rank: 1132
pos: verb
aspect: imperf
pron: { cyr: "збли́жаць" }
senses:
  - id: approach
    ru: "zbliżać się — приближаться"
    examples:
      - pl: "Zbliża się zima."
        ru: "Приближается зима."
        source: { kind: translated, id: 3334702 }
      - pl: "Zbliża się Boże Narodzenie."
        ru: "Приближается Рождество."
        source: { kind: translated, id: 498243 }
      - pl: "Zbliżają się."
        ru: "Они приближаются."
        source: { kind: translated, id: 10598233 }
  - id: keep-away
    ru: "nie zbliżać się — не приближаться"
    examples:
      - pl: "Nie zbliżać się."
        ru: "Не приближаться."
        source: { kind: translated, id: 5660137 }
      - pl: "Nie zbliżaj się!"
        ru: "Не приближайся!"
        source: { kind: translated, id: 8608670 }
  - id: bring-closer
    ru: "сближать (людей)"
    examples:
      - pl: "Wspólna praca ich zbliżała."
        ru: "Общая работа их сближала."
        source: { kind: authored }
      - pl: "Muzyka zbliża ludzi."
        ru: "Музыка сближает людей."
        source: { kind: authored }
notes:
  - { kind: government, text: "zbliżać się DO czegoś — предлог do с родительным падежом. Русское «приближаться к» требует дательного, так что падеж тут другой." }
  - { kind: usage, text: "Глагол почти всегда идёт с się. Совершенный вид — zbliżyć." }
  - { kind: usage, text: "О времени и событиях: Zbliża się zima «Приближается зима», Zbliżają się egzaminy «Приближаются экзамены»." }
  - { kind: usage, text: "Отглагольное zbliżenie значит и «сближение», и «крупный план» в кино." }
collocations:
  - { pl: "zbliżać się do", ru: "приближаться к" }
  - { pl: "nie zbliżaj się", ru: "не приближайся" }
  - { pl: "zbliża się zima", ru: "приближается зима" }
family:
  - { pl: "zbliżyć", ru: "приблизить", relation: aspect }
  - { pl: "bliski", ru: "близкий", relation: root }
  - { pl: "zbliżenie", ru: "сближение; крупный план", relation: derived }
etymology: "Приставка z- плюс bliski «близкий» — буквально «делать ближе». Русское «приближать» собрано так же, от «близкий»."
memory: "zbliżać się — «приближаться», почти всегда с się. Падеж другой: zbliżać się DO czegoś, предлог do с родительным, а по-русски «приближаться к» — дательный."
idioms:
  - { pl: "zbliżać się do końca", ru: "приближаться к концу" }
  - { pl: "nie zbliżaj się", ru: "не приближайся" }
