etymology: "Из s- + kąd, где kąd — старое вопросительное «куда»; ср. русские «куда» и «откуда»."
memory: "Запомните тройку: gdzie «где», dokąd «куда», skąd «откуда». А одинокое Skąd! в ответе значит «Да ничего подобного!»."
