# review
id: rozerwac
format: 2
lemma: "rozerwać"
rank: 4791
pos: verb
pron: { cyr: "розэ́рваць" }
senses:
  - id: tear-apart
    ru: "разорвать"
    examples:
      - pl: "Rozerwał kopertę i przeczytał list."
        ru: "Он разорвал конверт и прочёл письмо."
        source: { kind: authored }
      - pl: "Pies rozerwał poduszkę."
        ru: "Пёс разорвал подушку."
        source: { kind: authored }
      - pl: "Wybuch rozerwał samochód."
        ru: "Взрыв разорвал машину."
        source: { kind: authored }
  - id: have-fun
    ru: "развлечься, отвлечься (rozerwać się)"
    examples:
      - pl: "Musisz się trochę rozerwać."
        ru: "Тебе нужно немного развлечься."
        source: { kind: authored }
      - pl: "Poszliśmy do kina, żeby się rozerwać."
        ru: "Мы пошли в кино, чтобы развеяться."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ROZERWAĆ — «разорвать»: ROZERWAĆ KOPERTĘ, ŁAŃCUCH. Неожиданное для русского — возвратное ROZERWAĆ SIĘ: это не «разорваться», а «развлечься, развеяться»: CHODŹ, ROZERWIESZ SIĘ. Отсюда ROZRYWKA — «развлечение». «Не разорваться же мне» в смысле «не успеваю» — NIE ROZDWOJĘ SIĘ." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ROZERWANY и деепричастие ROZERWAWSZY. Спряжение: ROZERWĘ, ROZERWIESZ, ROZERWĄ; повелительное ROZERWIJ. Видовой партнёр — ROZRYWAĆ." }
  - { kind: government, text: "Что — винительный: ROZERWAĆ PAPIER, SIEĆ. На что — NA с винительным: ROZERWAĆ NA STRZĘPY, NA KAWAŁKI. Возвратное ROZERWAĆ SIĘ — без дополнения: TRZEBA SIĘ ROZERWAĆ." }
  - { kind: pronunciation, text: "Читается «розэ́рваць», три слога, ударение на предпоследнем. Z перед E твёрдое — «зэ», R отчётливое. Конечное Ć — «ць». ROZERWĘ — «розэ́рвэ»." }
  - { kind: register, text: "Нейтральное слово: и о бумаге, и о взрывах в новостях. ROZERWAĆ SIĘ — разговорное и тёплое: о кино, танцах, встрече с друзьями. ROZERWAĆ NA STRZĘPY — «разорвать в клочья», и о критике тоже." }
collocations:
  - { pl: "rozerwać kopertę", ru: "разорвать конверт" }
  - { pl: "rozerwać na strzępy", ru: "разорвать в клочья" }
  - { pl: "trochę się rozerwać", ru: "немного развеяться" }
family:
  - { pl: "rozrywać", ru: "разрывать", relation: aspect }
  - { pl: "rozrywka", ru: "развлечение", relation: derived, id: rozrywka }
  - { pl: "zerwać", ru: "сорвать, порвать", relation: root, id: zerwac }
etymology: "Приставка ROZ- «раз-» плюс RWAĆ «рвать», праславянское *rъvati, то же, что русское «рвать», «разорвать». Значение «развлечься» — «оторваться от дел», тот же образ, что в русском сленговом «оторваться»."
memory: "Rozerwać — разорвать: kopertę, poduszkę. Rozerwać się — развлечься! Rozrywka — развлечение. Rozerwać na strzępy — в клочья. Читается «розэ́рваць»."
idioms:
  - { pl: "rozerwać na strzępy", ru: "разорвать в клочья" }
