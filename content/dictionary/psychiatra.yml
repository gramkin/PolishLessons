notes:
  - { kind: usage, text: "Главное на карточке — целый класс слов. PSYCHIATRA кончается на -A и в единственном числе склоняется как существительное женского рода: PSYCHIATRY, PSYCHIATRZE, PSYCHIATRĘ, PSYCHIATRĄ. Но слово мужское, и это видно по двум вещам. Прилагательные согласуются по мужскому роду: DOBRY PSYCHIATRA, а не DOBRA. А множественное число мужско-личное: PSYCHIATRZY, PSYCHIATRÓW. В этот же класс входят KIEROWCA «водитель», KOLEGA, POETA, DENTYSTA, MĘŻCZYZNA. Русский знает такой класс по словам «мужчина», «папа», «дядя», так что сама мысль знакома, а польские формы множественного числа надо выучить отдельно." }
  - { kind: pronunciation, text: "Читается «псыхя́тра», в три слога, с ударением на предпоследнем. Сочетание ch даёт «х», а ia — «я», поэтому не «психиатра» по буквам, а «псыхя́тра». Начальное ps произносится слитно, без гласной между согласными. В именительном множественного PSYCHIATRZY сочетание rz даёт «ж»: «псыхя́тжы». Это одно из тех слов, где польское написание ближе к греческому оригиналу, чем русское." }
  - { kind: government, text: "К кому — предлог DO с родительным: IŚĆ DO PSYCHIATRY, а не «к психиатру» с дательным, как по-русски. У кого быть, лечиться — предлог U с родительным: BYĆ U PSYCHIATRY, LECZYĆ SIĘ U PSYCHIATRY. Кем стать — творительный без предлога: ZOSTAĆ PSYCHIATRĄ. Эти три оборота стоит запомнить вместе, потому что русский во всех трёх ставит другой падеж или предлог." }
  - { kind: false-friend, text: "Ловушка в самом окончании. Русский «психиатр» кончается на согласный, польское PSYCHIATRA добавляет -A, и русскому слышится женский род. Это неверно: слово мужское, и говорят DOBRY PSYCHIATRA, ZNANY PSYCHIATRA. Женщину-психиатра называют тем же словом, PSYCHIATRA, как и мужчину: ONA JEST PSYCHIATRĄ. Отдельной формы на -KA здесь обычно не образуют, в отличие от NAUCZYCIELKA, и по той же причине, что у POLITYK: слово и так кончается на -A, добавлять второе некуда." }
