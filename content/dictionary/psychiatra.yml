etymology: "Из греческого: PSYCHE «душа» и IATROS «врач, целитель», то есть буквально «врач души». Слово новое, девятнадцатого века, и в оба языка пришло через латинскую и немецкую медицинскую терминологию. Польский дал ему окончание -A по образцу других названий занятий этого класса, как POETA и DENTYSTA, которые тоже пришли с греческим или латинским -ТА; русский обошёлся без окончания. Отсюда и вся разница: PSYCHIATRA против «психиатра», при полном совпадении смысла. От того же IATROS происходят PEDIATRA и GERIATRA, и все они в польском того же класса."
memory: "Мужское слово с окончанием -A: dobry psychiatra, множественное psychiatrzy. Тот же класс, что kierowca, kolega, poeta, mężczyzna. К кому — DO с родительным: iść DO psychiatry, не «к психиатру». Читается «псыхя́тра», ch — это «х»."
