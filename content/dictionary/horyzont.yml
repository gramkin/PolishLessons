notes:
  - { kind: false-friend, text: "HORYZONT — «горизонт», с H и Y. Во множественном HORYZONTY — «кругозор»: POSZERZAĆ HORYZONTY, «расширять кругозор». NA HORYZONCIE — «на горизонте», и в переносном смысле: ZMIANY NA HORYZONCIE." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — HORYZONTU. В местном T переходит в C: NA HORYZONCIE." }
