# review
id: ciemny
format: 2
lemma: "ciemny"
rank: 1403
pos: adj
pron: { cyr: "це́мны" }
senses:
  - id: unlit
    ru: "тёмный, неосвещённый"
    examples:
      - pl: "Pokój był ciemny."
        ru: "Комната была тёмной."
        source: { kind: translated, id: 7886507 }
      - pl: "Była ciemna noc."
        ru: "Была тёмная ночь."
        source: { kind: translated, id: 2212287 }
      - pl: "Niebo robi się ciemne."
        ru: "Небо темнеет."
        source: { kind: translated, id: 7610586 }
  - id: colour
    ru: "тёмный (о цвете), смуглый"
    examples:
      - pl: "Ona ma ciemną skórę."
        ru: "У неё тёмная кожа."
        source: { kind: tatoeba, id: 6154839 }
      - pl: "Japończycy mają ciemne oczy."
        ru: "У японцев тёмные глаза."
        source: { kind: tatoeba, id: 1369595 }
      - pl: "Miała na sobie ciemny sweter."
        ru: "На ней был тёмный свитер."
        source: { kind: translated, id: 416280 }
notes:
  - { kind: usage, text: "Антоним — jasny «светлый, ясный». Наречие — ciemno: Jest ciemno «Темно», Robi się ciemno «Темнеет»." }
  - { kind: usage, text: "О коже и волосах значит «смуглый, тёмный»: ciemna karnacja «смуглая кожа», ciemne włosy «тёмные волосы»." }
  - { kind: usage, text: "Степени сравнения регулярные: ciemniejszy «темнее», najciemniejszy «самый тёмный»." }
  - { kind: false-friend, text: "Переносные значения совпадают с русскими: ciemna sprawa «тёмное дело», ciemna strona «тёмная сторона», typ spod ciemnej gwiazdy «тёмная личность»." }
collocations:
  - { pl: "ciemna noc", ru: "тёмная ночь" }
  - { pl: "ciemne włosy", ru: "тёмные волосы" }
  - { pl: "ciemne okulary", ru: "тёмные очки" }
etymology: "Праславянское *tьmьnъ — то же слово, что русское «тёмный», от «тьма» (польское ciemność)."
memory: "ciemny — «тёмный», прямое соответствие русскому, включая переносные смыслы: ciemna sprawa «тёмное дело». Антоним — jasny. Наречие — ciemno: Robi się ciemno «Темнеет»."
idioms:
  - { pl: "ciemna strona", ru: "тёмная сторона" }
  - { pl: "ciemny jak tabaka w rogu", ru: "тёмный как пробка" }
  - { pl: "typ spod ciemnej gwiazdy", ru: "тёмная личность" }
