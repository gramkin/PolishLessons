# review
id: babcia
format: 2
lemma: "babcia"
rank: 816
pos: noun
pron: { cyr: "ба́пця" }
senses:
  - id: grandma
    ru: "бабушка"
    examples:
      - pl: "Moja babcia mieszka sama."
        ru: "Моя бабушка живёт одна."
        source: { kind: tatoeba, id: 598266 }
      - pl: "Babcia Toma wygląda zdrowo."
        ru: "Бабушка Тома выглядит здоровой."
        source: { kind: tatoeba, id: 2122159 }
      - pl: "Babcia upiekła pyszne ciasto."
        ru: "Бабушка испекла вкуснейший пирог."
        source: { kind: tatoeba, id: 3615642 }
  - id: to-grandma
    ru: "do babci — к бабушке"
    examples:
      - pl: "Idę do babci."
        ru: "Я иду к бабушке."
        source: { kind: tatoeba, id: 1830338 }
      - pl: "Musisz pomóc swojej babci."
        ru: "Ты должен помочь своей бабушке."
        source: { kind: translated, id: 6170513 }
      - pl: "Odwiedziłem dom mojej babci."
        ru: "Я навестил дом моей бабушки."
        source: { kind: translated, id: 591632 }
  - id: with-grandma
    ru: "z babcią — с бабушкой"
    examples:
      - pl: "Maria mieszkała ze swoją babcią."
        ru: "Мария жила со своей бабушкой."
        source: { kind: translated, id: 12888751 }
      - pl: "Ona nie jest moją babcią ale moją mamą."
        ru: "Она не моя бабушка, а моя мама."
        source: { kind: translated, id: 1550605 }
      - pl: "Byłoby lepiej gdyby Tom został z swoją babcią."
        ru: "Было бы лучше, если бы Том остался со своей бабушкой."
        source: { kind: translated, id: 8809479 }
  - id: vocative
    ru: "Babciu! — Бабушка! (звательный)"
    note: "У слов о людях звательный живой."
    examples:
      - pl: "Babciu!"
        ru: "Бабушка!"
        source: { kind: translated, id: 12359684 }
      - pl: "Babciu, opowiedz coś."
        ru: "Бабушка, расскажи что-нибудь."
        source: { kind: authored }
      - pl: "Dziękuję, babciu."
        ru: "Спасибо, бабушка."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Звательный падеж у слов о людях живой и обязательный в обращении: Babciu! «Бабушка!». Это отличает такие слова от неодушевлённых, у которых звательный не употребляется." }
  - { kind: usage, text: "babcia — уменьшительное от baba, но само по себе уже нейтрально: так и говорят о бабушке. Ещё ласковее — babunia, babcia kochana." }
  - { kind: government, text: "do babci «к бабушке» — родительный падеж; u babci «у бабушки» — родительный; z babcią «с бабушкой» — творительный." }
  - { kind: usage, text: "Родня: dziadek «дедушка», dziadkowie «бабушка с дедушкой» (общее слово), wnuk «внук», wnuczka «внучка»." }
collocations:
  - { pl: "do babci", ru: "к бабушке" }
  - { pl: "u babci", ru: "у бабушки" }
  - { pl: "z babcią", ru: "с бабушкой" }
  - { pl: "babcia i dziadek", ru: "бабушка и дедушка" }
family:
  - { pl: "dziadek", ru: "дедушка", relation: root }
  - { pl: "baba", ru: "баба", relation: root }
  - { pl: "wnuk", ru: "внук", relation: root }
  - { pl: "wnuczka", ru: "внучка", relation: root }
etymology: "Уменьшительное от baba, праславянское *baba — то же слово, что русское «баба» и «бабушка»."
memory: "babcia — «бабушка», уменьшительное от baba, но само по себе уже нейтральное. Главное, что стоит заметить, — живой звательный падеж: в обращении говорят Babciu!, и у слов о людях он обязателен, в отличие от неодушевлённых. Управление: do babci, u babci, z babcią."
idioms:
  - { pl: "do babci", ru: "к бабушке" }
  - { pl: "u babci", ru: "у бабушки" }
  - { pl: "babcia i dziadek", ru: "бабушка и дедушка" }
