notes:
  - { kind: false-friend, text: "BUDA — «конура» и вообще убогая постройка: «будка, лачуга, ларёк». Аккуратная будка — BUDKA: BUDKA TELEFONICZNA, BUDKA DLA PTAKÓW, «скворечник». В молодёжном жаргоне BUDA иногда значит «школа»." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже D переходит в DZ: W BUDZIE. Родительный множественного — BUD. Звательный не даётся." }
  - { kind: government, text: "В конуре — W BUDZIE, местный. Конура для собаки — BUDA DLA PSA, DLA с родительным. Из ларька — Z BUDY." }
  - { kind: pronunciation, text: "Читается «бу́да», ударение на первом слоге. В форме BUDZIE: «бу́дзе»." }
