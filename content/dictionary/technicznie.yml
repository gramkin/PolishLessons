etymology: "От TECHNICZNY, из греческого слова со значением «искусство, мастерство». Русское «технический» — из того же источника."
memory: "Technicznie — технически; technicznie rzecz biorąc — строго говоря. Читается «тэхни́чне». Przegląd techniczny — техосмотр."
idioms:
  - { pl: "technicznie rzecz biorąc", ru: "строго говоря" }
