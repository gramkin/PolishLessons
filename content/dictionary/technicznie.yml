# review
id: technicznie
format: 2
lemma: "technicznie"
rank: 4465
pos: adv
pron: { cyr: "тэхни́чне" }
senses:
  - id: technically
    ru: "технически"
    examples:
      - pl: "Projekt jest technicznie bardzo zaawansowany."
        ru: "Проект технически очень сложный."
        source: { kind: authored }
      - pl: "Technicznie wszystko działa, ale wygląda brzydko."
        ru: "Технически всё работает, но выглядит некрасиво."
        source: { kind: authored }
      - pl: "Gra technicznie dobrze, ale bez emocji."
        ru: "Он играет технично, но без эмоций."
        source: { kind: authored }
  - id: strictly-speaking
    ru: "формально, строго говоря"
    examples:
      - pl: "Technicznie rzecz biorąc, nie złamał prawa."
        ru: "Строго говоря, он не нарушил закон."
        source: { kind: authored }
      - pl: "Technicznie jesteśmy jeszcze małżeństwem."
        ru: "Формально мы ещё муж и жена."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TECHNICZNIE — «технически», перевод прямой. Но у слова есть второе, разговорное значение — «формально, строго говоря»: TECHNICZNIE RZECZ BIORĄC. В спорте и музыке TECHNICZNIE — «технично», о владении приёмами." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Прилагательное — TECHNICZNY: PRZEGLĄD TECHNICZNY, «техосмотр», UCZELNIA TECHNICZNA, «технический вуз»." }
  - { kind: government, text: "Наречие ничем не управляет. Чаще всего определяет прилагательное: TECHNICZNIE MOŻLIWY, TECHNICZNIE SPRAWNY, «технически исправный»." }
  - { kind: pronunciation, text: "Читается «тэхни́чне», ударение на предпоследнем слоге. TE — твёрдое «тэ», CH — «х»." }
collocations:
  - { pl: "technicznie możliwe", ru: "технически возможно" }
  - { pl: "technicznie sprawny", ru: "технически исправный" }
