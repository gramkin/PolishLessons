etymology: "Из латинского ELIMINARE «выставить за порог», сложенного из EX «из» и LIMEN «порог». Образ в основе домашний и очень наглядный: исключить значит вывести человека за дверь, через порог. Польский взял слово в общий оборот и построил на нём целое гнездо: ELIMINOWAĆ, WYELIMINOWAĆ, ELIMINACJE. Русский взял тот же латинский корень позже и оставил его в научном слое, так что «элиминировать» у нас звучит как термин, а для обычной речи есть свои слова — «исключить», «устранить». От того же LIMEN идёт редкое русское «лиминальный» в работах по антропологии, и там порог виден опять буквально."
memory: "Слово латинское: ELIMINARE от EX «из» и LIMEN «порог», то есть буквально «вывести за порог». Русский взял тот же корень, но оставил его книжным: «элиминировать» это термин, а по-польски wyeliminować совершенно обиходно, и переводить надо «исключить», «устранить» или «выбить». Управление совпадает с русским полностью: wyeliminować coś z czegoś, предлог z с родительным. И помнить eliminacje — «отборочные соревнования», а не «исключения»."
idioms:
