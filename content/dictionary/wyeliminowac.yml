notes:
  - { kind: false-friend, text: "Слово латинское, и русский его тоже взял, но куда более узко. Русское «элиминировать» звучит книжно и встречается в научном тексте, а в обычной речи никто так не скажет; по-польски WYELIMINOWAĆ совершенно обиходно и годится и для диеты, и для футбола. Поэтому подставлять знакомый корень нельзя: переводить надо «исключить», «устранить» или «выбить», смотря по делу. Отдельно стоит существительное во множественном числе: ELIMINACJE значит «отборочные соревнования», а не «исключения»." }
  - { kind: usage, text: "Глагол на -OWAĆ, и личные формы идут на -UJ-: WYELIMINOWAĆ, но WYELIMINUJĘ, WYELIMINUJESZ, WYELIMINUJĄ, как «рисовать» и «рисую». Видовой партнёр — ELIMINOWAĆ, без приставки. Пятьдесят три формы — подпись переходного глагола совершенного вида. Приставка WY- здесь не славянская по смыслу, а подхватывает латинское EX-, уже сидящее внутри корня, так что получается двойное указание на движение наружу; для польского это обычный приём при заимствованиях." }
  - { kind: government, text: "Прямое дополнение в винительном: WYELIMINOWAĆ BŁĄD, WYELIMINOWAĆ RYZYKO, WYELIMINOWAĆ KONKURENCJĘ. То, откуда исключают, идёт с предлогом Z и родительным: WYELIMINOWAĆ COŚ Z DIETY, WYELIMINOWAĆ KOGOŚ Z TURNIEJU, Z GRY. Русский здесь берёт «из» с родительным, так что предлог и падеж совпадают полностью, и это один из редких случаев, когда конструкцию можно переводить слово в слово." }
  - { kind: pronunciation, text: "Читается «выэлимино́вачь», шесть слогов, ударение на предпоследнем, то есть на NO. Первая Y звучит как «ы», а следующая E как твёрдое «э», поэтому начало слова «выэ», а не «вые». Буква L перед I мягкая, как русское «ль». Конечное Ć мягкое, «чь». В личных формах ударение переезжает вместе с основой: WYELIMINUJĘ это «выэлимину́е»." }
  - { kind: register, text: "Слово книжное и профессиональное: медицина, техника, спорт, статистика. Частые сочетания: WYELIMINOWAĆ RYZYKO «устранить риск», WYELIMINOWAĆ BŁĄD, WYELIMINOWAĆ Z DIETY, WYELIMINOWAĆ Z GRY. В спортивных репортажах оно звучит постоянно: ZOSTALI WYELIMINOWANI W ĆWIERĆFINALE. В бытовой речи вместо него скажут проще: USUNĄĆ «убрать», POZBYĆ SIĘ «избавиться». Существительное ELIMINACJE живёт только во множественном и означает отборочный этап." }
