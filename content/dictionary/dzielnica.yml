# review
id: dzielnica
format: 2
lemma: "dzielnica"
rank: 2369
pos: noun
pron: { cyr: "дзельни́ца" }
senses:
  - id: district
    ru: "район (города), квартал"
    examples:
      - pl: "Mieszka w spokojnej dzielnicy."
        ru: "Он живёт в спокойном районе."
        source: { kind: authored }
      - pl: "Ta dzielnica zmieniła się nie do poznania."
        ru: "Этот район изменился до неузнаваемости."
        source: { kind: authored }
  - id: neighbourhood
    ru: "квартал, округа"
    examples:
      - pl: "Dzielnica willowa zaczyna się za parkiem."
        ru: "Коттеджный квартал начинается за парком."
        source: { kind: authored }
      - pl: "W dzielnicach przemysłowych czynsze są niższe."
        ru: "В промышленных районах аренда ниже."
        source: { kind: authored }
  - id: historical
    ru: "удел (историч.)"
    examples:
      - pl: "Polska rozpadła się wtedy na dzielnice."
        ru: "Польша распалась тогда на уделы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «ДЕЛИТЬ», И ЭТО КЛЮЧ. Dzielnica от dzielić «делить»: это выделенная, отделённая часть. Русское «удел» сделано ровно так же — от «делить», — и историческое значение у польского слова именно такое. Но в современной речи dzielnica значит «РАЙОН ГОРОДА», и переводить её надо этим словом; «район» как административная единица вне города — то powiat или rejon." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: dziel-NI-ca. Dzi звучит как мягкое дзь, ni как нь, c как ц: «дзельни́ца». Родительный, дательный и предложный единственного совпадают: dzielnicy." }
  - { kind: usage, text: "Виды районов называют прилагательным: dzielnica mieszkaniowa «жилой район», dzielnica willowa «коттеджный», dzielnica przemysłowa «промышленный», Stare Miasto — отдельное имя собственное. Исторический термин rozbicie dzielnicowe значит «феодальная раздробленность»." }
collocations:
  - { pl: "dzielnica mieszkaniowa", ru: "жилой район" }
  - { pl: "spokojna dzielnica", ru: "спокойный район" }
  - { pl: "rozbicie dzielnicowe", ru: "феодальная раздробленность" }
family:
  - { pl: "dzielić", ru: "делить", relation: root, id: dzielic }
  - { pl: "część", ru: "часть", relation: root, id: czesc-noun }
  - { pl: "osiedle", ru: "жилой массив", relation: derived }
etymology: "От dzielić «делить», из праславянского *děliti — того же корня, что русские «делить», «доля», «удел». Dzielnica это выделенная часть: сперва удел князя, потом часть города. Русское «удел» построено из той же основы с другой приставкой. Отсюда dzielnicowy и podział «раздел»."
memory: "dzielnica — «РАЙОН ГОРОДА», от dzielić «делить», то есть буквально «выделенная часть»; исторически — «удел», слово той же конструкции. Родительный, дательный и предложный совпадают: dzielnicy."
idioms:
  - { pl: "dzielnica mieszkaniowa", ru: "жилой район" }
  - { pl: "zła dzielnica", ru: "неблагополучный район" }
