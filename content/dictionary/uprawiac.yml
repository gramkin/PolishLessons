notes:
  - { kind: false-friend, text: "ОСТОРОЖНО: uprawiać похоже на русское «управлять», но значит совсем другое. «Управлять» по-польски — zarządzać или kierować. А uprawiać значит «заниматься» (спортом, профессией) и «возделывать» (землю). Так что uprawia firmę сказать нельзя; фирмой zarządza." }
  - { kind: government, text: "Чем занимаются — ВИНИТЕЛЬНЫЙ без предлога: uprawiać sport, uprawiać jogę, uprawiać zawód, uprawiać ziemię. По-русски тут творительный с «заниматься» («заниматься спортом»), так что падеж приходится менять: uprawiać sport, а не sportem." }
  - { kind: usage, text: "Два значения расходятся далеко, но держатся вместе: и спорт, и земля — это то, чем занимаются регулярно и с усилием. Существительное uprawa значит «возделывание, культура» (uprawa zboża), а uprawianie — само занятие. Совершенная пара к земледельческому смыслу — uprawić." }
  - { kind: pronunciation, text: "Вид несовершенный, поэтому у глагола ЕСТЬ причастия настоящего времени (uprawiający, dzielący) и деепричастие на -ąc (uprawiając, dzieląc), но НЕТ формы на -wszy: она бывает только у совершенного вида. По этому признаку вид можно узнать прямо по списку форм." }
collocations:
  - { pl: "uprawiać sport", ru: "заниматься спортом" }
  - { pl: "uprawiać ziemię", ru: "обрабатывать землю" }
  - { pl: "uprawiać zawód", ru: "работать по профессии" }
family:
  - { pl: "uprawa", ru: "возделывание, культура", relation: derived }
  - { pl: "prawy", ru: "правый; праведный", relation: root, id: prawy }
  - { pl: "uprawić", ru: "возделать, обработать", relation: aspect }
etymology: "От prawy «правый, правильный», праславянское *pravъ — то же слово, что русское «правый». Буквально uprawiać значит «приводить в правильный вид», откуда земледельческое «обрабатывать землю», а затем, через «делать как положено», и «заниматься чем-либо». Отсюда же uprawa и uprawnienie «право, полномочие»."
memory: "uprawiać — «заниматься» и «возделывать», но НЕ «управлять» (это zarządzać). Корень тот же, что русское «правый»: приводить в правильный вид. И падеж другой: uprawiać sport в винительном, не «спортом»."
idioms:
  - { pl: "uprawiać sport", ru: "заниматься спортом" }
  - { pl: "uprawiać politykę", ru: "заниматься политикой" }
formExamplesSkip:
  - { form: "uprawiani", reason: "Мужско-личная форма страдательного причастия. Глагол uprawiać берёт дополнением только землю, растение, вид спорта или профессию — но никогда человека. Винительного дополнения-лица у него нет, поэтому подлежащего для мужско-личного страдательного оборота взять негде: людей не «возделывают». Та же причина, что у przerwani и głosowani." }
