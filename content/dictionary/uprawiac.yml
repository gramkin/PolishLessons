  - id: cultivate
    ru: "возделывать, обрабатывать (землю)"
    examples:
      - pl: "Dziadek uprawia pole za domem."
        ru: "Дед обрабатывает поле за домом."
        source: { kind: authored }
      - pl: "Uprawiano tu len i konopie."
        ru: "Здесь выращивали лён и коноплю."
        source: { kind: authored }
  - id: cultivation
    ru: "uprawianie — занятие; возделывание"
    examples:
      - pl: "Uprawianie sportu kosztuje czas."
        ru: "Занятие спортом требует времени."
        source: { kind: authored }
      - pl: "Sposób uprawiania ziemi zmienił się całkowicie."
        ru: "Способ обработки земли изменился полностью."
