notes:
  - { kind: false-friend, text: "За этим словом стоит правило, открывающее десятки других. WRÓG это «враг», корень общий, но польский не знает полногласия: там, где русский вставляет -ОРО- или даёт -РА-, поляк держит просто -РО-. WRÓG и «ворог», WRONA и «ворона», GROCH и «горох», BRZEG и «берег», KRÓTKI и «короткий», DROGA и «дорога». Поймав это соответствие, вы перестанете видеть в таких словах чужие и начнёте их угадывать." }
  - { kind: usage, text: "Одиннадцать форм. В существительном WRÓG стоит Ó, но во всех производных оно переходит в обычное O: WRÓG, однако WROGA, WROGI, WROGOWIE. Мужско-личная форма множественного числа WRODZY, с переходом G в DZ, и это то же чередование, что в DROGI — DRODZY «дорогие» и UBOGI — UBODZY «убогие». Степени сравнения у прилагательного описательные: BARDZIEJ WROGI, NAJBARDZIEJ WROGI." }
  - { kind: government, text: "Враждебный кому-либо — дательный падеж без предлога: WROGI KOMUŚ, WROGI NOWYM POMYSŁOM «враждебный новым замыслам». Русский строит оборот так же. Во враждебном окружении — WE WROGIM OTOCZENIU, и здесь важна мелочь: перед сочетанием W плюс согласная предлог W удлиняется до WE, иначе два согласных подряд не выговорить. То же в WE WROGIEJ ATMOSFERZE." }
  - { kind: pronunciation, text: "Читается «вро́ги», два слога, ударение на первом. Сочетание GI даёт мягкое «ги», как в русском «гибкий». В мужско-личной форме WRODZY сочетание DZ даёт слитное «дз», и слово звучит «вро́дзы», с твёрдым «ы» на конце. В самом WRÓG буква Ó читается как «у», поэтому оно звучит «врук», с оглушением конечного G до «к»." }
  - { kind: register, text: "Слово нейтральное, частое в новостях и в военных текстах: WROGIE WOJSKA «вражеские войска», WROGI OSTRZAŁ «вражеский обстрел», WROGIE NASTAWIENIE «враждебное отношение». В деловом языке закрепился термин WROGIE PRZEJĘCIE «враждебное поглощение», о покупке компании вопреки воле её правления. В обычном разговоре о неприязни чаще скажут мягче: NIEPRZYJAZNY или NIECHĘTNY." }
