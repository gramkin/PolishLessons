etymology: "От WRÓG «враг», от праславянского корня, давшего и русское «ворог», и книжное «враг», пришедшее к нам через церковнославянский. Разница в огласовке не случайна: в восточнославянских языках между согласными развилось полногласие, -ОРО-, а в западнославянских нет, поэтому поляк говорит WRÓG там, где русский «ворог». Это правило работает на всём пласте древней лексики и позволяет угадывать слова: GŁOWA и «голова», MŁODY и «молодой», BRZOZA и «берёза»."
memory: "Держитесь за правило, а не за слово: польский не знает полногласия, и там, где русский вставляет -оро-, поляк оставляет -ро-. Wróg и «ворог», wrona и «ворона», groch и «горох», brzeg и «берег». Прилагательное wrogi значит «враждебный» и «вражеский». Мужско-личная форма wrodzy, с переходом g в dz, как drogi — drodzy. Перед сочетанием согласных предлог w удлиняется: we wrogim otoczeniu."
idioms:
