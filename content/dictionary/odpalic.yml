etymology: "Приставка OD- плюс PALIĆ, от праславянского *paliti «жечь», побудительной формы к глаголу со значением «пылать, гореть». Русский сохранил корень полностью: «палить», «опалить», «запал», «пал», «спалить». Польское гнездо такое же широкое: PALIĆ, SPALIĆ, ZAPALIĆ, PALIWO, POŻAR, и последнее слово совпадает с русским «пожаром» до последней буквы. Особенность польского в том, что PALIĆ взяло на себя ещё и значение «курить», которого русский глагол не знает: курение описано через огонь, что для табака буквально верно."
memory: "Корень тот же, что в «палить», но польское palić значит и «жечь», и «курить»: nie palić на двери это «не курить». Приставка od- отвечает русской от-, однако odpalić значит «запустить»: odpalić silnik «запустить двигатель». Произношение: d перед глухим p оглушается, отсюда «отпа́личь». Из гнезда стоит запомнить paliwo «топливо», zapałka «спичка» и pożar, который совпадает с русским «пожаром» буква в букву."
idioms:
  - { pl: "odpalić komuś kasę", ru: "отстегнуть кому-то денег" }
formExamplesSkip:
  - { form: "odpaleni", reason: "Форма страдательного причастия мужского лица во множественном числе грамматически неупотребима. Предметом этого глагола бывают двигатель, заряд, фейерверк, печь или файл, то есть вещь, а не мужчина, поэтому подлежащего для формы ODPALENI не существует. Во втором значении, разговорном, лицо стоит в дательном падеже — ODPALIĆ KOMUŚ KASĘ, — и в страдательный оборот обращается не человек, а отданные деньги." }
