notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «палить», но польское PALIĆ значит сразу две вещи: «жечь» и «курить». Надпись NIE PALIĆ на каждой второй двери означает «не курить», а не «не жечь». PALĘ переводится как «я курю», и для русскоязычного это самая частая ошибка в чтении вывесок. Из гнезда нужны PALIWO «топливо», ZAPAŁKA «спичка», ZAPALNICZKA «зажигалка» и POŻAR «пожар», которое с русским совпадает буква в букву." }
  - { kind: government, text: "Прямое дополнение в винительном: ODPALIĆ SILNIK, ODPALIĆ FAJERWERKI, ODPALIĆ PIEC. Во втором значении добавляется дательный лица: ODPALIĆ KOMUŚ COŚ — ODPALIŁ NAM STÓWKĘ, «отстегнул нам сотню». Цель расхода идёт с предлогом NA и винительным: ODPALIĆ KOMUŚ NA BENZYNĘ. Возвратное ODPALIĆ SIĘ почти не употребляется; о двигателе говорят SILNIK ODPALIŁ, без частицы, и это один из тех случаев, когда польский обходится без возвратности там, где русский сказал бы «завёлся»." }
  - { kind: usage, text: "Приставка OD- отвечает русской ОТ-, но пара ODPALIĆ и «отпалить» обманчива: по-польски это «запустить», а не «отпалить». Видовой партнёр — ODPALAĆ. Пятьдесят три формы, из которых пятьдесят две написаны, а одна пропущена по грамматической причине. В технике глагол незаменим: ODPALIĆ RAKIETĘ, ODPALIĆ ŁADUNEK «взорвать заряд». В разговорной речи он же значит «запустить программу»: ODPAL TEN PLIK «открой этот файл»." }
  - { kind: pronunciation, text: "Читается «отпа́личь», три слога, ударение на предпоследнем. Буква D перед глухим P оглушается и звучит как «т», поэтому слышно «отпа», а не «одпа»; то же правило работает в ODPOWIEDŹ «отпо́вечь». Буква L перед I мягкая, как русское «ль». Конечное Ć мягкое, «чь». В страдательном причастии ODPALONY слышно «отпалё́ны», где группа IO даёт «ё»." }
  - { kind: register, text: "Первое значение нейтральное и техническое: ODPALIĆ SILNIK, ODPALIĆ RAKIETĘ, ODPALIĆ FAJERWERKI. Второе значение, «отстегнуть денег», разговорное и слегка приятельское: ODPAL MI DWADZIEŚCIA ZŁOTYCH. В письменном тексте для этого есть DAĆ или POŻYCZYĆ. Есть и третье, совсем разговорное: ODPALIĆ W ODPOWIEDZI значит «отрезать, резко ответить», и узнавать его стоит, хотя употреблять осторожно." }
