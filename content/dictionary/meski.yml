  - { pl: "żeński", ru: "женский", relation: antonym }
etymology: "От mąż «муж» с суффиксом -ski, в точности как русское «мужской» от «муж». Расхождение только в гласной: польское ą отвечает русскому «у» (mąż при «муже», wąsy при «усах»). Мужско-личная форма męscy показывает чередование k с c, обычное для этого суффикса: polski даёт polscy, wiejski даёт wiejscy."
memory: "męski — «мужской», от mąż «муж» (ą отвечает русскому «у»). И это слово, которым поляки называют свою главную развилку: męscy про мужчин, męskie про всё остальное. Запомните пару męski/męscy — k переходит в c."
idioms:
