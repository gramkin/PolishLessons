notes:
  - { kind: usage, text: "ЭТО СЛОВО НАЗЫВАЕТ ГЛАВНУЮ РАЗВИЛКУ ПОЛЬСКОЙ ГРАММАТИКИ. Поляки говорят о rodzaj męskoosobowy — «мужско-личном» роде, и это не прихоть терминологии: во множественном числе польский отделяет мужчин от всего прочего. Про мужчин будет męscy koledzy, ślepi ludzie, magiczni czarodzieje; про женщин, вещи, животных и детей — męskie koszule, ślepe konie, magiczne słowa. Отсюда же ci против te и byli против były. Выучив развилку здесь, вы узнаете её во всех прилагательных сразу." }
  - { kind: pronunciation, text: "Обратите внимание на чередование в мужско-личной форме: męski, но męscy — k переходит в c. Так же ведут себя polski/polscy и wiejski/wiejscy. И само ę читается как «эн» перед s: «мэ́нски»." }
  - { kind: false-friend, text: "Корень родной: męski от mąż «муж», как русское «мужской» от «мужа». Работает уже знакомый закон — польское ą отвечает русскому «у»: mąż при «муже», wąsy при «усах», mąka при «муке». Но беречься стоит слова mężczyzna «мужчина»: оно тоже от mąż, а не от «мужчины» впрямую." }
collocations:
