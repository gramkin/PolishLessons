  - form: "traktowani"
    pl: "Źle traktowani nielegalni robotnicy zagraniczni często wpadają w społeczne czarne dziury."
    ru: "Иностранные рабочие без документов, с которыми плохо обращаются, часто проваливаются в социальные чёрные дыры."
    source: { kind: translated, id: 367697 }
  - form: "traktowani"
    pl: "Rdzenni Amerykanie mają historycznie święte prawo do uznania, że traktowani byli przez państwo nieuczciwie."
    ru: "У коренных американцев исторически есть основания считать, что государство обходилось с ними нечестно."
    source: { kind: translated, id: 368921 }
  - form: "traktowania"
    pl: "Nie oczekuje specjalnego traktowania."
    ru: "Он не ждёт особого отношения."
