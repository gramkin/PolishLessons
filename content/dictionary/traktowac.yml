# review
id: traktowac
format: 2
lemma: "traktować"
rank: 893
pos: verb
aspect: imperf
pron: { cyr: "тракто́ваць" }
senses:
  - id: treat
    ru: "относиться, обращаться (с кем-то)"
    examples:
      - pl: "Traktuje mnie jak obcego."
        ru: "Он относится ко мне как к чужому."
        source: { kind: translated, id: 367594 }
      - pl: "Traktuj ją z szacunkiem."
        ru: "Относись к ней с уважением."
        source: { kind: translated, id: 2991682 }
      - pl: "Traktował młodszego brata jak psa."
        ru: "Он обращался с младшим братом как с собакой."
        source: { kind: translated, id: 982921 }
  - id: as
    ru: "traktować jak — обращаться как с кем-то"
    examples:
      - pl: "On traktuje mnie jak dziecko."
        ru: "Он обращается со мной как с ребёнком."
        source: { kind: translated, id: 7893905 }
      - pl: "Tom był traktowany jak król."
        ru: "С Томом обращались как с королём."
        source: { kind: tatoeba, id: 10631715 }
  - id: regard
    ru: "воспринимать, считать"
    examples:
      - pl: "Nikt nie traktował poważnie jego słów."
        ru: "Никто не относился к его словам серьёзно."
        source: { kind: translated, id: 368932 }
      - pl: "Traktuję pracę poważnie."
        ru: "Я отношусь к работе серьёзно."
        source: { kind: translated, id: 7881236 }
notes:
  - { kind: government, text: "Падеж другой, чем в русском: traktować kogoś — винительный без предлога, а русское «обращаться С кем-то» требует творительного. Traktuje mnie jak dziecko «Он обращается со мной как с ребёнком»." }
  - { kind: usage, text: "Сравнение вводится союзом jak, и следующее слово идёт в именительном: traktować kogoś jak dziecko, jak króla, jak powietrze." }
  - { kind: usage, text: "Совершенный вид — potraktować. Отглагольное traktowanie значит «обращение, отношение»: złe traktowanie «плохое обращение»." }
  - { kind: false-friend, text: "Русское «трактовать» сузилось до «толковать», а польское traktować — это прежде всего «обращаться с кем-то»." }
collocations:
  - { pl: "traktować kogoś jak", ru: "обращаться с кем-то как с" }
  - { pl: "traktować poważnie", ru: "воспринимать всерьёз" }
  - { pl: "dobrze traktować", ru: "хорошо обращаться" }
  - { pl: "złe traktowanie", ru: "плохое обращение" }
family:
  - { pl: "potraktować", ru: "отнестись, обойтись", relation: aspect }
  - { pl: "traktowanie", ru: "обращение, отношение", relation: derived }
etymology: "Через немецкое traktieren из латинского tractare «вести, обходиться». Русское «трактовать» — то же слово, но у нас оно сузилось до «толковать»."
memory: "traktować — «относиться, обращаться с кем-то», и падеж другой: traktować kogoś, винительный без предлога, а по-русски «обращаться С кем-то», творительный. Сравнение вводит союз jak: traktować kogoś jak dziecko."
idioms:
  - { pl: "traktować z góry", ru: "относиться свысока" }
  - { pl: "traktować jak powietrze", ru: "не замечать, игнорировать" }
  - { pl: "traktować poważnie", ru: "воспринимать всерьёз" }
