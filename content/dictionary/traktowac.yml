formExamples:
  - form: "traktować"
    pl: "Nie pozwolę im cię tak traktować."
    ru: "Я не позволю им так с тобой обращаться."
    source: { kind: translated, id: 6368382 }
  - form: "traktować"
    pl: "Powinieneś traktować ludzi z większym szacunkiem."
    ru: "Тебе следует относиться к людям с большим уважением."
