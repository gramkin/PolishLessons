# review
id: zgodny
format: 2
lemma: "zgodny"
rank: 4599
pos: adj
pron: { cyr: "зго́дны" }
senses:
  - id: consistent
    ru: "соответствующий, согласный (с чем-то)"
    examples:
      - pl: "To nie jest zgodne z prawem."
        ru: "Это не соответствует закону."
        source: { kind: authored }
      - pl: "Wynik jest zgodny z oczekiwaniami."
        ru: "Результат соответствует ожиданиям."
        source: { kind: authored }
      - pl: "Ta wersja jest najzgodniejsza z oryginałem."
        ru: "Эта версия точнее всех соответствует оригиналу."
        source: { kind: authored }
  - id: harmonious
    ru: "дружный, единодушный (о людях)"
    examples:
      - pl: "To bardzo zgodne małżeństwo."
        ru: "Это очень дружная пара."
        source: { kind: authored }
      - pl: "Wszyscy byli zgodni co do decyzji."
        ru: "Все были единодушны в решении."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому «согласный» по-польски соответствуют разные слова. ZGODNY Z CZYMŚ — «соответствующий чему-то»: ZGODNY Z PRAWEM, «законный», ZGODNY Z PRAWDĄ, «правдивый». ZGODNY о людях — «дружный, единодушный»: ZGODNA RODZINA. А «согласен» в ответе — ZGADZAM SIĘ, глаголом, без прилагательного." }
  - { kind: usage, text: "Полная парадигма: ZGODNY, ZGODNIEJSZY, NAJZGODNIEJSZY. Степени — в значении «дружнее»: ZGODNIEJSZE RODZEŃSTWO. Мужское-личное: ZGODNI, ZGODNIEJSI, NAJZGODNIEJSI. Особенно частое: WSZYSCY SĄ ZGODNI, «все согласны, единодушны»." }
  - { kind: government, text: "Соответствующий чему-то — ZGODNY Z + творительный: ZGODNY Z PRAWEM, Z UMOWĄ, Z PRAWDĄ. Единодушны в чём-то — ZGODNI CO DO + родительный: ZGODNI CO DO TERMINU. Наречие ZGODNIE Z — «согласно, в соответствии с»." }
  - { kind: pronunciation, text: "Читается «зго́дны», два слога, ударение на первом. ZG в начале звонкое. DN — без гласной. В ZGODNIEJSZY: «згодне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в юридических и официальных текстах: ZGODNY Z PRAWEM, ZGODNY Z PRZEPISAMI, ZGODNIE Z UMOWĄ. О семье и соседях — тёплая похвала: ZGODNI SĄSIEDZI." }
collocations:
  - { pl: "zgodny z prawem", ru: "законный, соответствующий закону" }
  - { pl: "zgodny z prawdą", ru: "правдивый" }
  - { pl: "zgodne małżeństwo", ru: "дружная пара" }
family:
  - { pl: "zgoda", ru: "согласие", relation: root, id: zgoda }
  - { pl: "zgadzać się", ru: "соглашаться", relation: root, id: zgadzac }
  - { pl: "zgodnie", ru: "согласно; дружно", relation: derived, id: zgodnie }
etymology: "От ZGODA «согласие», от GODZIĆ SIĘ «соглашаться, годиться», общеславянского корня *god-, того же, что в русском «годный», «угодный», «выгода». Согласное — то, что «сгодилось» одно к другому. Русское «сговор» и польское ZGODA — разные приставки, но смысл близкий."
memory: "Zgodny — соответствующий: zgodny z prawem, zgodny z prawdą; и дружный: zgodna rodzina, wszyscy są zgodni. Z + творительный. Zgodnie z — согласно. Читается «зго́дны»."
idioms:
  - { pl: "zgodny z prawem", ru: "законный" }
