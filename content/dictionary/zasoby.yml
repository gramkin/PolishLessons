notes:
  - { kind: false-friend, text: "ZASOBY — «ресурсы, запасы», и слово польское, а не латинское: ZASOBY NATURALNE — природные ресурсы. В библиотеке и архиве ZASOBY — «фонды». DZIAŁ ZASOBÓW LUDZKICH — «отдел кадров», калька английского. А единственное ZASÓB живёт в обороте ZASÓB SŁÓW — «словарный запас»." }
  - { kind: usage, text: "Пять форм, только множественное число в этом значении; единственное ZASÓB — отдельное слово. Ó в корне меняется на O: ZASÓB, но ZASOBY. Родительный — ZASOBÓW." }
  - { kind: government, text: "Ресурсы чего-то — ZASOBY CZEGOŚ, родительный: ZASOBY WODY. Распоряжаться ресурсами — ZARZĄDZAĆ ZASOBAMI, творительный. Не хватает ресурсов — BRAKUJE ZASOBÓW, родительный." }
  - { kind: pronunciation, text: "Читается «засо́бы», три слога, ударение на втором. Все буквы читаются как пишутся. В родительном ZASOBÓW: «засо́буф»." }
  - { kind: register, text: "Слово деловое и научное: ZASOBY LUDZKIE — человеческие ресурсы, ZASOBY FINANSOWE — финансовые ресурсы. В быту запасы еды — скорее ZAPASY." }
collocations:
  - { pl: "zasoby naturalne", ru: "природные ресурсы" }
  - { pl: "zasoby finansowe", ru: "финансовые ресурсы" }
  - { pl: "zasoby biblioteki", ru: "фонды библиотеки" }
family:
  - { pl: "zasób", ru: "запас (zasób słów — словарный запас)", relation: root }
  - { pl: "zasobny", ru: "обеспеченный, зажиточный", relation: derived }
  - { pl: "zasobnik", ru: "бункер, резервуар", relation: derived }
etymology: "От ZASÓB «запас», того же древнего корня, что SPOSÓB «способ» и OSOBA, русские «способ», «особа», «особый»: корень значил «своё, принадлежащее себе». ZASÓB — то, что припасено своего. Русскому «запас» польское слово близко по смыслу, но не по корню."
memory: "Zasoby — ресурсы, запасы, фонды. Читается «засо́бы». Zasoby naturalne — природные ресурсы. Dział zasobów ludzkich — отдел кадров. Zasób słów — словарный запас."
idioms:
  - { pl: "zasoby ludzkie", ru: "человеческие ресурсы, кадры" }
  - { pl: "zasoby naturalne", ru: "природные ресурсы" }
