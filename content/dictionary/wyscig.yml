# review
id: wyscig
format: 2
lemma: "wyścig"
rank: 1798
pos: noun
pron: { cyr: "вы́сьцик" }
senses:
  - id: race
    ru: "гонка, забег, заезд"
    examples:
      - pl: "Tom wygrał wyścig."
        ru: "Том выиграл гонку."
        source: { kind: translated, id: 4469711 }
      - pl: "Znów wygrał wyścig."
        ru: "Он снова выиграл гонку."
        source: { kind: translated, id: 1353846 }
