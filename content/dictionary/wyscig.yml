        ru: "Я занял пятое место в гонке."
        source: { kind: translated, id: 533630 }
  - id: races
    ru: "скачки, бега; гонка (соперничество)"
    examples:
      - pl: "Lubię wyścigi konne."
        ru: "Я люблю конные скачки."
        source: { kind: translated, id: 8743688 }
      - pl: "Przypuśćmy, że się wzbogacisz na wyścigach."
        ru: "Предположим, ты разбогатеешь на скачках."
        source: { kind: tatoeba, id: 359870 }
      - pl: "Tracił czas na wyścigach konnych."
        ru: "Он терял время на скачках."
        source: { kind: translated, id: 754482 }
notes:
  - { kind: government, text: "В гонке — w wyścigu (предложный падеж): zająłem piąte miejsce w wyścigu. Выиграть гонку — wygrać wyścig (винительный)." }
  - { kind: usage, text: "wyścigi konne — «конные скачки»; во множественном числе wyścigi часто значит именно скачки." }
  - { kind: usage, text: "wyścig szczurów — «крысиные бега», о карьерной гонке; wyścig zbrojeń — «гонка вооружений»." }
  - { kind: false-friend, text: "Слово от ścigać «преследовать, гнаться»: буквально «выгон, погоня». Русское «гонка» построено от «гнать» — образ тот же." }
collocations:
  - { pl: "wygrać wyścig", ru: "выиграть гонку" }
  - { pl: "wyścigi konne", ru: "конные скачки" }
  - { pl: "wyścig zbrojeń", ru: "гонка вооружений" }
family:
  - { pl: "ścigać", ru: "преследовать", relation: root }
  - { pl: "wyścigowy", ru: "гоночный", relation: root }
etymology: "От ścigać «преследовать, гнаться», приставка wy-. Русское «гонка» построено от «гнать» — тот же образ погони."
memory: "wyścig — «гонка»: wygrać wyścig «выиграть гонку», w wyścigu «в гонке». Во множественном wyścigi — часто «скачки»: wyścigi konne."
idioms:
  - { pl: "wyścig szczurów", ru: "крысиные бега" }
  - { pl: "wyścig zbrojeń", ru: "гонка вооружений" }
  - { pl: "wyścigi konne", ru: "конные скачки" }
formExamplesSkip:
