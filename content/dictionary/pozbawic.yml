etymology: "Приставка PO- и глагол ZBAWIĆ, из праславянского *baviti «задерживать, удалять», с приставкой *jьz-. Исходный смысл корня — удаление чего-то от кого-то, и из него в трёх языках выросли три разные оценки одного действия. Польский дал POZBAWIĆ «лишить», где удаляют нужное, и ZBAWIĆ «спасти», где удаляют губительное, — отсюда ZBAWICIEL. Русский дал «избавить», где удаляют тягостное, то есть тоже положительную оценку. А обиходное польское BAWIĆ «забавлять» и русская «забава» идут от того же *baviti через значение «задерживать внимание». Так одно праславянское слово покрыло лишение, спасение, избавление и забаву, и родство между ними сегодня не чувствуется ни в одном из языков."
memory: "Двойное управление, как в русском: pozbawić kogoś czegoś — винительный лица и родительный предмета, ровно «лишить кого-то чего-то». Совершенный вид; pozbawię значит «лишу». В причастии o переходит в e: pozbawiony, но pozbawieni, как spłacony и spłaceni. Родство неожиданное: pozbawić и zbawić «спасти» — одно гнездо, и русское «избавить» тоже; корень значил «удалять», а оценка зависит от того, что удаляют. Юридический термин — pozbawienie wolności."
