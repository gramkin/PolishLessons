notes:
  - { kind: government, text: "Управление двойное, и это главное в карточке: POZBAWIĆ KOGOŚ CZEGOŚ — лицо в винительном, предмет в родительном. POZBAWIŁ GO PRAWA JAZDY, POZBAWIONO JĄ WSZYSTKICH TYTUŁÓW. Русское «лишить» требует точно того же: кого-то в винительном, чего-то в родительном, так что конструкция переносится без изменений. Совершенный вид, несовершенный — POZBAWIAĆ. Поэтому POZBAWIĘ значит «лишу», а не «лишаю». Страдательное причастие даёт чередование O в E в мужском лице множественного: POZBAWIONY, но POZBAWIENI, как SPŁACONY и SPŁACENI." }
  - { kind: false-friend, text: "Прямого созвучия нет, зато есть родство, и оно сбивает с толку. POZBAWIĆ собрано из PO- и ZBAWIĆ, а ZBAWIĆ в современном польском значит «спасти», откуда ZBAWICIEL «Спаситель». Выходит, что «лишить» и «спасти» — слова одного гнезда, и это не случайность: исходное значение корня было «удалить, избавить от чего-то», и из него выросли оба смысла, в зависимости от того, что удаляют. Русский развил ту же основу в «избавить», и получилось третье решение: избавить — тоже удалить, но с положительной оценкой. Так один корень дал по-польски лишение и спасение, а по-русски избавление, и все три описывают одно действие с разных сторон." }
  - { kind: pronunciation, text: "Читается «позба́виць», ударение на предпоследнем слоге из трёх. Сочетание ZB в начале второго слога произносится звонко, оба согласных. Буква W даёт «в». Конечное -Ć мягкое, «ць». В страдательном причастии POZBAWIONY четыре слога и ударение на предпоследнем: «позбавё́ны». В форме POZBAWIENI слышно «позбаве́ни», с мягким н. В деепричастии POZBAWIWSZY сочетание WSZ оглушается в «фш»: «позбави́фшы»." }
  - { kind: usage, text: "Частотные сочетания: POZBAWIĆ KOGOŚ PRAW «лишить кого-то прав», POZBAWIENIE WOLNOŚCI «лишение свободы» — точный юридический термин, KARA POZBAWIENIA WOLNOŚCI «наказание в виде лишения свободы», POZBAWIĆ ZŁUDZEŃ «лишить иллюзий». Причастие POZBAWIONY работает как прилагательное и очень частотно: POZBAWIONY SENSU «лишённый смысла», POZBAWIONY SKRUPUŁÓW «беспринципный», POZBAWIONY GUSTU. В этом употреблении оно требует родительного без предлога, как и русское «лишённый»." }
