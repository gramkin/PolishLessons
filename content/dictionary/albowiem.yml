# review
id: albowiem
format: 2
lemma: "albowiem"
rank: 5491
pos: conj
pron: { cyr: "албо́вем" }
senses:
  - id: for
    ru: "ибо (высокое, книжное)"
    examples:
      - pl: "Albowiem korzeniem wszystkiego złego jest miłość pieniędzy, których niektórzy pragnąc, pobłądzili od wiary i poprzebijali się wieloma boleściami."
        ru: "Ибо корень всех зол есть сребролюбие, которому предавшись, некоторые уклонились от веры и сами себя подвергли многим скорбям."
        source: { kind: tatoeba, id: 2131896 }
      - pl: "Błogosławieni miłosierni, albowiem oni miłosierdzia dostąpią."
        ru: "Блаженны милостивые, ибо они помилованы будут."
        source: { kind: translated, id: 5320386 }
      - pl: "Błogosławieni łagodnego serca, albowiem, to oni posiądą ziemię."
        ru: "Блаженны кроткие, ибо они наследуют землю."
        source: { kind: translated, id: 1355958 }
  - id: because
    ru: "ибо, поскольку (в торжественной речи)"
    examples:
      - pl: "Milczmy, albowiem czas nadszedł."
        ru: "Умолкнем, ибо пришло время."
        source: { kind: authored }
      - pl: "Radujcie się, albowiem wrócił."
        ru: "Радуйтесь, ибо он вернулся."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самый высокий регистр из союзов причины. Весь корпус этого слова — библейский: Заповеди блаженств, Послание к Тимофею." }
  - { kind: usage, text: "Усиление от bowiem: ale «но» + bowiem. В отличие от bowiem, albowiem свободно открывает придаточное." }
  - { kind: false-friend, text: "Русское «ибо» — точное соответствие и по смыслу, и по книжности." }
  - { kind: government, text: "Не изменяется. В современной нейтральной речи не употребляется вовсе: скажут bo или ponieważ." }
collocations:
  - { pl: "albowiem oni", ru: "ибо они" }
etymology: "ale «но» + bowiem «ибо»; усиленная книжная форма того же союза."
memory: "albowiem — «ибо» в самом высоком регистре, слово из библейских текстов. Обычный книжный вариант — bowiem, разговорный — bo."
idioms:
  - { pl: "albowiem oni", ru: "ибо они" }
