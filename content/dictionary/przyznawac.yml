family:
  - { pl: "przyznać", ru: "признать; присудить", relation: aspect, id: przyznac }
  - { pl: "znać", ru: "знать", relation: root, id: znac }
  - { pl: "przyznanie", ru: "признание; присуждение", relation: derived }
  - { pl: "uznawać", ru: "признавать, считать", relation: derived }
etymology: "Приставка przy- плюс znawać, итератив от znać «знать». Русское «признавать» собрано ровно так же: при- плюс «-знавать». Совпадает и чередование основы: znawać даёт znaję, как старое «знавать» давало «знаю». От того же гнезда przyznać, przyznanie, uznawać «считать», wyznawać «исповедовать» и zeznawać «давать показания»."
memory: "przyznawać — «признавать», собрано слово в слово как русское. Запомнить надо две вещи: настоящее время уходит на -aj- (przyznaję, а не «przyznawam»), и признаются DO czegoś, с родительным, а не «в чём-то». Плюс второе значение, которого у русского глагола нет: przyznawać stypendium — присуждать стипендию."
idioms:
