notes:
  - { kind: usage, text: "ДВА СТЕБЛЯ В ОДНОЙ ТАБЛИЦЕ, И ЭТО КЛЮЧ КО ВСЕМ ШЕСТИДЕСЯТИ ТРЁМ ФОРМАМ. Инфинитив и прошедшее время идут на -awa-: przyznawać, przyznawał. Настоящее переходит на -aj-: przyznaję, przyznajesz, przyznaje — то же правило, что у podawać → podaję и poddawać → poddaję. По этому же шву делятся причастия: действительное и деепричастие берутся от настоящей основы (przyznający, przyznając), а страдательное и отглагольное существительное от инфинитивной (przyznawany, przyznawanie). Формы przyznawając не существует вовсе." }
  - { kind: false-friend, text: "В значении ловушек нет: przyznawać собрано ровно как «признавать» — przy- плюс корень zna-. Но покрывает оно больше: кроме «признавать» (вину, ошибку, правоту) это ещё «присуждать, предоставлять» — przyznawać nagrodę, stypendium, kredyt, odszkodowanie. Русское «признавать» так не работает, там нужны «присуждать» или «предоставлять»." }
  - { kind: government, text: "Два управления, и второе расходится с русским. Присуждают ЧТО КОМУ — винительный плюс дательный: przyznawać komuś nagrodę. А признаются В чём-то через do с РОДИТЕЛЬНЫМ: przyznawać się do winy, do błędu, do kradzieży. Русский ставит здесь предложный — «признаваться в вине», — и калькировать нельзя: только przyznawać się DO winy." }
  - { kind: pronunciation, text: "rz после p звучит как ш. Ударение всегда на предпоследнем слоге, а слогов в формах разное число, поэтому оно гуляет по слову: przyznawać — «пшызна́ваць», przyznaję — «пшызна́йэ», przyznawaliśmy — «пшызнава́лишмы»." }
collocations:
  - { pl: "przyznać rację", ru: "признать правоту" }
  - { pl: "przyznawać się do winy", ru: "признавать вину" }
