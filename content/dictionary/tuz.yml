# review
id: tuz
format: 2
lemma: "tuż"
rank: 1365
pos: adv
pron: { cyr: "туш" }
senses:
  - id: right-next
    ru: "совсем рядом, прямо (при предлогах места)"
    examples:
      - pl: "To tuż za rogiem."
        ru: "Это прямо за углом."
        source: { kind: translated, id: 440531 }
      - pl: "Mieszkam tuż za rogiem."
        ru: "Я живу прямо за углом."
        source: { kind: translated, id: 3991650 }
      - pl: "Zbudowałem dom tuż obok puszczy."
        ru: "Я построил дом прямо рядом с пущей."
        source: { kind: translated, id: 359152 }
  - id: right-after
    ru: "сразу, вот-вот (о времени и следовании)"
    examples:
      - pl: "Wybory tuż tuż."
        ru: "Выборы совсем скоро."
        source: { kind: translated, id: 13654082 }
      - pl: "Wiosna jest tuż za rogiem."
        ru: "Весна не за горами."
        source: { kind: translated, id: 968897 }
      - pl: "Pies szedł tuż za nim."
        ru: "Собака шла прямо за ним."
        source: { kind: translated, id: 923097 }
notes:
  - { kind: usage, text: "Tuż — усилитель при предлогах места: tuż obok «совсем рядом», tuż za rogiem «прямо за углом», tuż przed «прямо перед»." }
  - { kind: usage, text: "Удвоенное tuż tuż значит «вот-вот, совсем скоро»: Wybory tuż tuż." }
  - { kind: usage, text: "Tuż za rogiem буквально «прямо за углом», но часто значит «совсем близко во времени»: Wiosna jest tuż za rogiem." }
  - { kind: pronunciation, text: "Конечное ż оглушается: слово звучит «туш»." }
collocations:
  - { pl: "tuż obok", ru: "совсем рядом" }
  - { pl: "tuż za rogiem", ru: "прямо за углом" }
  - { pl: "tuż przed", ru: "прямо перед" }
etymology: "Праславянское *tu-že — усилительная форма от tu «здесь». Русское «тут же» собрано ровно так же."
memory: "tuż — усилитель при предлогах: tuż obok «совсем рядом», tuż za rogiem «прямо за углом». Удвоенное tuż tuż значит «вот-вот». Собрано как русское «тут же»."
idioms:
