# review
id: cofnac
format: 2
lemma: "cofnąć"
rank: 1336
pos: verb
aspect: perf
pron: { cyr: "цо́фнонць" }
senses:
  - id: step-back
    ru: "отойти, отступить назад"
    examples:
      - pl: "Mógłbyś się, proszę, cofnąć?"
        ru: "Ты мог бы, пожалуйста, отойти?"
        source: { kind: translated, id: 3754463 }
      - pl: "Tom cofnął się do mieszkania."
        ru: "Том вернулся назад в квартиру."
        source: { kind: translated, id: 4816960 }
      - pl: "Cofnął się w obliczu niebezpieczeństwa."
        ru: "Он отступил перед лицом опасности."
        source: { kind: translated, id: 6157190 }
  - id: take-back
    ru: "взять назад, отменить"
    examples:
      - pl: "Nie możesz cofnąć tego, co powiedziałeś."
        ru: "Ты не можешь взять назад того, что сказал."
        source: { kind: translated, id: 538688 }
      - pl: "Szkoda, że nie mogę cofnąć się w czasie."
        ru: "Жаль, что я не могу вернуться назад во времени."
        source: { kind: translated, id: 3847953 }
      - pl: "Jak daleko chcesz się cofnąć?"
        ru: "Как далеко ты хочешь отойти назад?"
        source: { kind: translated, id: 6305587 }
  - id: imperative
    ru: "cofnij się! — отойди!"
    examples:
      - pl: "Cofnij się!"
        ru: "Отойди!"
        source: { kind: translated, id: 10542029 }
      - pl: "Cofnij się."
        ru: "Отойди."
        source: { kind: translated, id: 10599757 }
      - pl: "Teraz się cofnij."
        ru: "А теперь отойди."
        source: { kind: translated, id: 3285518 }
notes:
  - { kind: government, text: "Почти всегда возвратное: cofnąć się «отойти, отступить». Без się значит «отменить, взять назад»: cofnąć decyzję «отменить решение»." }
  - { kind: usage, text: "Cofnij się! «Отойди!» — частая команда, в том числе предупреждение об опасности." }
  - { kind: usage, text: "Cofnąć się w czasie — «вернуться назад во времени», а cofnąć słowo — «взять слово назад»." }
  - { kind: usage, text: "Вид совершенный; несовершенный — cofać." }
collocations:
  - { pl: "cofnąć się", ru: "отойти назад" }
  - { pl: "cofnij się", ru: "отойди" }
  - { pl: "cofnąć decyzję", ru: "отменить решение" }
etymology: "Слово позднее и тёмного происхождения, скорее всего звукоподражательное. Прямого русского родственника у него нет."
memory: "cofnąć — «отойти, отступить», почти всегда с się: Cofnij się! «Отойди!». Без się значит «отменить, взять назад»: cofnąć decyzję. Несовершенный вид — cofać."
idioms:
  - { pl: "cofnij się", ru: "отойди" }
  - { pl: "cofnąć się w czasie", ru: "вернуться во времени" }
  - { pl: "cofnąć słowo", ru: "взять слово назад" }
