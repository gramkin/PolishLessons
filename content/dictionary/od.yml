# review
id: od
format: 2
depth: deep
lemma: "od"
rank: 47
pos: prep
pron: { cyr: "от" }
senses:
  - id: from
    ru: "от, с (начало во времени и пространстве)"
    examples:
      - pl: "To niedaleko od Paryża."
        ru: "Это недалеко от Парижа."
        source: { kind: tatoeba, id: 352503 }
      - pl: "Znam Toma od dawna."
        ru: "Я давно знаю Тома."
        source: { kind: tatoeba, id: 4716892 }
  - id: than
    ru: "чем (при сравнении)"
    examples:
      - pl: "Wolę kawę od herbaty."
        ru: "Предпочитаю чаю кофе."
        source: { kind: tatoeba, id: 415231 }
      - pl: "Jest pięć lat młodsza ode mnie."
        ru: "Она на пять лет младше меня."
        source: { kind: tatoeba, id: 3313260 }
      - pl: "On jest inteligentniejszy ode mnie."
        ru: "Он умнее меня."
        source: { kind: tatoeba, id: 529618 }
  - id: depends
    ru: "от (зависимость, специальность)"
    examples:
      - pl: "To zależy od kontekstu."
        ru: "Это зависит от контекста."
        source: { kind: tatoeba, id: 364814 }
      - pl: "Jest specjalistą od astronomii."
        ru: "Он специалист по астрономии."
        source: { kind: tatoeba, id: 3460820 }
      - pl: "Mieszkam tu od 1990 roku."
        ru: "Я живу здесь с 1990-го года."
        source: { kind: tatoeba, id: 951296 }
notes:
  - { kind: government, text: "od требует родительного падежа, как русское «от»." }
  - { kind: usage, text: "При сравнении od заменяет русское «чем»: starszy ode mnie «старше меня», lepszy od ciebie «лучше тебя»." }
  - { kind: usage, text: "Начало отсчёта во времени — od, там где по-русски «с»: od 1990 roku «с 1990 года», od dawna «давно», od rana «с утра»." }
  - { kind: usage, text: "specjalista od czegoś «специалист по чему-то» и zależeć od czegoś «зависеть от чего-то» — оба с od, хотя по-русски предлоги разные." }
collocations:
  - { pl: "od razu", ru: "сразу" }
  - { pl: "od kiedy", ru: "с каких пор" }
  - { pl: "od czasu do czasu", ru: "время от времени" }
etymology: "Праславянское *ot, в польском с XIV века — то же слово, что русское «от»."
memory: "od = «от», но есть второе применение, которого нет в русском: сравнение. Lepszy od ciebie — «лучше тебя». Перед mnie предлог удлиняется: ode mnie."
idioms:
  - { pl: "od razu", ru: "сразу" }
  - { pl: "od ręki", ru: "сразу, тут же, не сходя с места" }
  - { pl: "od stóp do głów", ru: "с ног до головы" }
