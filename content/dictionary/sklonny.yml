# review
id: sklonny
format: 2
lemma: "skłonny"
rank: 4573
pos: adj
pron: { cyr: "скуо́нны" }
senses:
  - id: willing
    ru: "склонный, готовый (что-то сделать)"
    examples:
      - pl: "Jestem skłonny się zgodzić."
        ru: "Я готов согласиться."
        source: { kind: authored }
      - pl: "Szef jest skłonny dać ci podwyżkę."
        ru: "Начальник готов дать тебе прибавку."
        source: { kind: authored }
      - pl: "Nie byli skłonni do ustępstw."
        ru: "Они не были склонны к уступкам."
        source: { kind: authored }
  - id: prone
    ru: "склонный, предрасположенный (к чему-то)"
    examples:
      - pl: "Jest skłonna do przeziębień."
        ru: "Она склонна к простудам."
        source: { kind: authored }
      - pl: "Ludzie zmęczeni są skłonni do błędów."
        ru: "Уставшие люди склонны ошибаться."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SKŁONNY почти совпадает с русским «склонный», но в польском сильнее значение «готовый, согласный»: JESTEM SKŁONNY ZAPŁACIĆ WIĘCEJ — «я готов заплатить больше». Русское «склонен думать» — JESTEM SKŁONNY SĄDZIĆ. Не путать с SKŁON, «наклон»: SKŁON DO PRZODU — «наклон вперёд» на зарядке." }
  - { kind: usage, text: "Без степеней: в карточке одиннадцать форм. Почти всегда сказуемое: JEST SKŁONNY, BYLI SKŁONNI. Форма для мужчин-людей самая частая: SĄ SKŁONNI POMÓC. Как определение — реже: OSOBA SKŁONNA DO DEPRESJI." }
  - { kind: government, text: "Два управления. С инфинитивом — готовность: SKŁONNY ZAPŁACIĆ, SKŁONNY PRZYZNAĆ. С DO и родительным — предрасположенность или готовность: SKŁONNY DO KOMPROMISU, SKŁONNY DO PRZESADY. Русское «склонен к» — тоже DO, не KU." }
  - { kind: pronunciation, text: "Читается «скуо́нны», два слога, ударение на первом. Ł звучит как короткое «у», двойное N тянется. Женский род SKŁONNA — «скуо́нна»." }
  - { kind: register, text: "Слово вежливое и немного книжное: JESTEM SKŁONNY — мягче, чем CHCĘ. В переговорах и письмах: FIRMA JEST SKŁONNA OBNIŻYĆ CENĘ. В разговоре проще: GOTÓW или CHĘTNY." }
collocations:
  - { pl: "skłonny do kompromisu", ru: "склонный к компромиссу" }
  - { pl: "skłonny do przesady", ru: "склонный к преувеличениям" }
  - { pl: "jestem skłonny sądzić", ru: "я склонен думать" }
family:
  - { pl: "skłonność", ru: "склонность", relation: derived }
  - { pl: "skłonić", ru: "склонить, побудить", relation: root }
  - { pl: "skłon", ru: "наклон", relation: root }
etymology: "От SKŁONIĆ «склонить», от корня KŁON- «клонить», того же, что в русском «склонный», «клонить», «наклон». Польское Ł на месте русского «л», как в SŁOWO и «слово»."
memory: "Skłonny — склонный, готовый. Jestem skłonny się zgodzić — готов согласиться. Skłonny do + родительный: do kompromisu. Читается «скуо́нны»."
idioms:
  - { pl: "skłonny do żartów", ru: "любитель пошутить" }
