notes:
  - { kind: false-friend, text: "Русское «бастард» книжное, а польское BĘKART звучит по-славянски, но значит то же самое: внебрачный ребёнок, особенно знатный. Как ругательство BĘKART — «ублюдок», грубее русского «бастард». Внебрачный ребёнок в нейтральной речи — DZIECKO NIEŚLUBNE." }
  - { kind: usage, text: "Мужской род, одушевлённое. Два множественных: мужское-личное BĘKARCI, когда говорят о людях как об исторических фигурах, и пренебрежительное BĘKARTY, когда ругаются. Звательный BĘKARCIE — частая форма ругани в фильмах. Женского рода нет." }
  - { kind: government, text: "Бастард короля — BĘKART KRÓLA, родительный. Ругательство — в звательном: TY BĘKARCIE! Падежных требований само существительное не имеет." }
  - { kind: pronunciation, text: "Читается «бэ́нкарт», два слога, ударение на первом. Ę перед K звучит «эн». Во множественном BĘKARCI сочетание RCI даёт «рци»: «бэнка́рци»." }
  - { kind: register, text: "В историческом значении — книжное и нейтральное в учебниках. Как ругательство — грубое, но не матерное: его слышно в исторических фильмах и в переводах «Игры престолов», где Джон Сноу — BĘKART." }
