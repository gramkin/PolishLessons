etymology: "Из средневерхненемецкого banchart, «рождённый на лавке», то есть не на брачном ложе: Bank «скамья» и суффикс -hart. Польское носовое Ę передаёт немецкое AN перед согласной. Русское «бастард» — из старофранцузского bastard, «рождённый на вьючном седле», — та же метафора о непостели."
memory: "Bękart — внебрачный ребёнок, бастард; и груб. «ублюдок»: ty bękarcie! Нейтрально — dziecko nieślubne. Читается «бэ́нкарт»."
