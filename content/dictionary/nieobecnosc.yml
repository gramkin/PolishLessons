notes:
  - { kind: false-friend, text: "Основа этого слова обманывает русский глаз. OBECNY значит «присутствующий», а не «обычный»: KTO JEST OBECNY — «кто присутствует», и на перекличке отвечают OBECNY, то есть «здесь». Отсюда и NIEOBECNY — «отсутствующий». Второе значение того же слова — «нынешний, текущий»: OBECNY RZĄD «нынешнее правительство», а наречие OBECNIE значит «в настоящее время, сейчас». Русское «обычный» по-польски будет ZWYKŁY, и спутать эти два слова в польском тексте легко, а смысл меняется полностью." }
  - { kind: government, text: "Чьё отсутствие — родительный без предлога: NIEOBECNOŚĆ ŚWIADKA «отсутствие свидетеля». Во время отсутствия — готовая формула W CZASIE NIEOBECNOŚCI или W TRAKCIE NIEOBECNOŚCI, с родительным. Оправдать отсутствие — USPRAWIEDLIWIĆ NIEOBECNOŚĆ, винительный, и это слово школьной и трудовой жизни: USPRAWIEDLIWIENIE значит «оправдательная записка». Прилагательное NIEOBECNY управляет предлогом NA с предложным: NIEOBECNY NA ZAJĘCIACH «отсутствующий на занятиях»." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, суффикс отвечает русскому -ОСТЬ. Множественное число здесь не редкость, а повседневность, потому что в школе и на работе считают пропуски: NIEOBECNOŚCI NIEUSPRAWIEDLIWIONE «неоправданные пропуски», TRZY NIEOBECNOŚCI W MIESIĄCU. Это тот случай, когда отвлечённое существительное получило счётное значение, и русский поступает так же, говоря «три отсутствия» или «три пропуска»." }
  - { kind: pronunciation, text: "Читается «необе́цносьчь», четыре слога, ударение на предпоследнем. Приставка NIE звучит «не», а сочетание CN даёт «цн», потому что польское C это всегда «ц». Отсюда середина слова «бецн», а не «бечн». Конец, -ŚĆ, это два мягких звука подряд, «сьчь». В прилагательном NIEOBECNY слышно «необе́цны», с «ы» на конце, а в наречии OBECNIE — «обе́цне»." }
  - { kind: register, text: "Слово официальное и школьное одновременно. Частые обороты: USPRAWIEDLIWIĆ NIEOBECNOŚĆ «оправдать отсутствие», NIEOBECNOŚĆ USPRAWIEDLIWIONA «оправданное отсутствие», W CZASIE NIEOBECNOŚCI «во время отсутствия», LISTA OBECNOŚCI «список присутствующих», то есть табель. Положительная пара OBECNOŚĆ значит «присутствие» и встречается не реже: OBECNOŚĆ OBOWIĄZKOWA «присутствие обязательно»." }
