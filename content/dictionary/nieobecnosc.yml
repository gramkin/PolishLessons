etymology: "Сложено из отрицания NIE и основы OBECN-, от старого OBEC «община, общество», родственного русскому «общий» и «обще-». Присутствующий в этом образе — тот, кто при обществе, в собрании, на людях. Русское «отсутствие» построено совсем иначе, от «сути», то есть от бытия: отсутствовать значит не быть. Получается, что польский назвал присутствие через общество, а русский через существование. Суффикс -OŚĆ при этом отвечает русскому -ОСТЬ. Из того же гнезда OBECNIE «сейчас» и, через то же OBEC, слово OBYWATEL «гражданин»."
memory: "Основа обманчива: obecny значит «присутствующий», а не «обычный», и на перекличке отвечают obecny, то есть «здесь». Второе значение того же слова — «нынешний», obecny rząd, а obecnie значит «сейчас». «Обычный» по-польски zwykły. Множественное число здесь обиходное, потому что считают пропуски: nieobecności nieusprawiedliwione. Корень от obec «община», то есть присутствующий это тот, кто при обществе, тогда как русское «отсутствие» от бытия. Читается «необе́цносьчь», где cn это «цн»."
