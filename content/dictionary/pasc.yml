# review
id: pasc
format: 2
lemma: "paść"
rank: 1603
pos: verb
aspect: biaspectual
pron: { cyr: "пасьць" }
senses:
  - id: fall
    ru: "упасть, пасть; сдохнуть (о технике)"
    examples:
      - pl: "Serwer padł."
        ru: "Сервер упал."
        source: { kind: translated, id: 11263106 }
      - pl: "Bateria padła."
        ru: "Батарея села."
        source: { kind: translated, id: 10606317 }
      - pl: "Padł ofiarą własnej ambicji."
        ru: "Он пал жертвой собственных амбиций."
        source: { kind: translated, id: 355742 }
  - id: drop-down
    ru: "падать, валиться (о приказе и от усталости)"
    examples:
      - pl: "Padnij!"
        ru: "Ложись!"
        source: { kind: translated, id: 8608714 }
      - pl: "Odpocznij, bo padniesz."
        ru: "Отдохни, а то свалишься."
        source: { kind: translated, id: 998879 }
      - pl: "Tak chce mi się spać, że chyba zaraz padnę."
        ru: "Мне так хочется спать, что я сейчас свалюсь."
        source: { kind: translated, id: 3657725 }
  - id: graze
    ru: "пасти(сь) — о скоте"
    examples:
      - pl: "Owce pasły się na łące."
        ru: "Овцы паслись на лугу."
        source: { kind: translated, id: 410351 }
      - pl: "Bydło pasie się na trawie."
        ru: "Скот пасётся на траве."
        source: { kind: translated, id: 10581088 }
notes:
  - { kind: usage, text: "Инфинитив только paść. Форма padnąć — разговорная, образованная задним числом от основы будущего padn- (padnę, padniesz), и в норме не употребляется, поэтому оставлена без примеров. Безличное padnięto тоже практически не встречается: у непереходных глаголов движения форма на -no/-to почти не живёт." }
  - { kind: false-friend, text: "Под одной записью сошлись два разных глагола: paść «упасть, пасть» (формы на pad-: padł, padnij, padniesz) и paść «пасти(сь)» (формы на pas-: pasie się, pasły się). Различает только основа." }
  - { kind: usage, text: "Форма pasie в корпусе чаще принадлежит существительному pas «пояс, полоса»: w pasie «в поясе», na prawym pasie «в правом ряду». Это третье слово, к глаголу отношения не имеющее." }
  - { kind: usage, text: "paść ofiarą czegoś — «пасть жертвой чего-то», творительный падеж: padł ofiarą własnej ambicji." }
  - { kind: usage, text: "Разговорно padł значит «сломался, сдох» о технике: serwer padł «сервер упал», bateria padła «батарея села»." }
collocations:
  - { pl: "paść ofiarą", ru: "пасть жертвой" }
  - { pl: "padnij!", ru: "ложись!" }
  - { pl: "paść się na łące", ru: "пастись на лугу" }
etymology: "Два праславянских глагола, сошедшихся в одной форме: *pasti «упасть» (та же основа, что в русском «пасть, падать») и *pasti «пасти» (как русское «пасти»). В русском они тоже звучат почти одинаково — «пасть» и «пасти»."
memory: "paść — это сразу два глагола: «упасть, пасть» (основа pad-: padł, padnij) и «пасти(сь)» (основа pas-: pasie się, pasły się). А форма pasie в текстах чаще всего вообще от pas «пояс, полоса»."
