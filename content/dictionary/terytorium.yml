notes:
  - { kind: usage, text: "Самое важное про это слово — что оно не склоняется в единственном числе. Одна и та же форма TERYTORIUM стоит во всех шести падежах: TERYTORIUM OBEJMUJE в именительном, NA TERYTORIUM POLSKI в родительном после предлога, Z TERYTORIUM WYSPY тоже, и так далее. Склоняется только множественное: TERYTORIA, TERYTORIÓW, TERYTORIOM, TERYTORIAMI, TERYTORIACH. Отсюда и шесть форм вместо десяти. Это целый разряд латинских слов на -UM, и он весь ведёт себя так же: MUZEUM, LICEUM, GIMNAZJUM, AKWARIUM, CENTRUM, STUDIUM." }
  - { kind: false-friend, text: "Русское «территория» женского рода и склоняется полностью, польское TERYTORIUM среднего рода и в единственном числе неизменно, так что «на территории Польши» будет NA TERYTORIUM POLSKI, без всякого окончания. Но важнее другое: в бытовой речи поляк это слово почти не употребляет. Для участка, двора, школьной земли есть слово TEREN: NA TERENIE SZKOŁY «на территории школы», NA TERENIE BUDOWY «на территории стройки». TERYTORIUM осталось за государствами и картами." }
  - { kind: government, text: "Чья территория — родительный падеж без предлога: TERYTORIUM POLSKI, TERYTORIUM PAŃSTWA. Расположение внутри — предлог NA с формой, которая для этого слова совпадает с именительным: NA TERYTORIUM, и русский говорит так же, «на территории». Выход за пределы — POZA TERYTORIUM с творительным по форме, но здесь это снова та же неизменная форма. Во множественном числе падежи работают обычно: W TERYTORIACH с местным, MIĘDZY TERYTORIAMI с творительным." }
  - { kind: pronunciation, text: "Читается «тэрыто́рьюм», четыре слога, ударение на предпоследнем. Первая E звучит как «э», а Y как «ы», поэтому начало слова «тэры», а не «тери». Окончание -IUM произносится слитно, «рьюм», одним слогом, а не «ри-ум» в два. Во множественном числе TERYTORIA слышно «тэрыто́рья», тоже слитно. Это общее правило для всего разряда: MUZEUM звучит «му́зэум», где UM уже отдельный слог, а AKWARIUM — «аква́рьюм»." }
  - { kind: register, text: "Слово официальное: международное право, география, военные сводки. Частые обороты: TERYTORIUM PAŃSTWA «территория государства», NA TERYTORIUM POLSKI, TERYTORIA ZAMORSKIE «заморские территории», TERYTORIA SPORNE «спорные территории», INTEGRALNOŚĆ TERYTORIALNA «территориальная целостность». В переносном смысле о своей области влияния скажут TO MOJE TERYTORIUM, ровно как русское «это моя территория», и это уже разговорное употребление. Прилагательное TERYTORIALNY значит «территориальный»." }
