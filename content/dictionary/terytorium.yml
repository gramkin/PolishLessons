etymology: "Из латинского TERRITORIUM, от TERRA «земля», и в русский слово пришло из того же источника, через западные языки. Родственник, который в польском встречается гораздо чаще, — TEREN, и он из того же латинского корня TERRA, только пришёл через французское TERRAIN. Получилось, что один латинский корень дал польскому два слова с разделением труда: TERYTORIUM для государств и карт, TEREN для всякого участка земли под ногами. Неизменность единственного числа у слов на -UM — это след латинского склонения, который польский сохранил, а русский полностью переработал под своё женское склонение на -ИЯ."
memory: "Главное здесь грамматика: в единственном числе слово не склоняется вовсе, одна форма terytorium на все шесть падежей, na terytorium Polski без окончания. Склоняется только множественное, terytoria, terytoriów. Так же ведёт себя весь латинский разряд на -um: muzeum, liceum, akwarium, centrum. И практическая поправка: в быту поляк скажет не terytorium, а teren, na terenie szkoły «на территории школы». Читается «тэрыто́рьюм», окончание слитно, одним слогом."
