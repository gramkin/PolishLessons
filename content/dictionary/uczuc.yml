# review
id: uczuc
format: 2
lemma: "uczuć"
rank: 2559
pos: verb
pron: { cyr: "у́чуць" }
senses:
  - id: feel
    ru: "почувствовать (боль, холод, запах)"
    examples:
      - pl: "Uczuł zapach dymu i wybiegł na korytarz."
        ru: "Он почувствовал запах дыма и выбежал в коридор."
        source: { kind: authored }
      - pl: "Uczuła chłód bijący od kamiennej posadzki."
        ru: "Она почувствовала холод, идущий от каменного пола."
        source: { kind: authored }
      - pl: "Dopiero w domu uczuliśmy, jak bardzo jesteśmy zmęczeni."
        ru: "Только дома мы почувствовали, как сильно устали."
        source: { kind: authored }
  - id: emotion
    ru: "испытать (чувство)"
    examples:
      - pl: "Uczuł do niej coś, czego sam nie rozumiał."
        ru: "Он испытал к ней что-то, чего сам не понимал."
        source: { kind: authored }
      - pl: "To uczucie trudno opisać słowami."
        ru: "Это чувство трудно описать словами."
        source: { kind: authored }
notes:
  - { kind: register, text: "САМ ГЛАГОЛ КНИЖНЫЙ И ПОЧТИ УШЁЛ, А ЕГО СУЩЕСТВИТЕЛЬНОЕ ЖИВЕЕ ВСЕХ. В нынешней речи говорят POCZUĆ: poczułem ból, poczuła chłód. UCZUĆ звучит как из романа XIX века. Зато UCZUCIE «чувство» — слово повседневное, и формально это отглагольное существительное именно от uczuć. Ровно как русские «чувство» и «чувствовать»: существительное пережило свой глагол." }
  - { kind: false-friend, text: "Не путай UCZUCIE и UCZULENIE. Первое — «чувство», второе — «аллергия» (mam uczulenie na orzechy «у меня аллергия на орехи»). Оба выросли из czuć «чувствовать»: uczulić значит «сделать чувствительным», отсюда и медицинский смысл. Разница в одном слоге, а перепутать их в аптеке неловко." }
  - { kind: usage, text: "Вид совершенный, поэтому UCZUJĘ — это «почувствую», будущее время. «Чувствую» будет CZUJĘ, от несовершенного czuć. Есть деепричастие UCZUWSZY «почувствовав» и нет форм на -ąc." }
collocations:
  - { pl: "uczuć ból", ru: "почувствовать боль" }
  - { pl: "uczuć ulgę", ru: "почувствовать облегчение" }
  - { pl: "uczuć strach", ru: "почувствовать страх" }
family:
  - { pl: "czuć", ru: "чувствовать", relation: root, id: czuc }
  - { pl: "poczuć", ru: "почувствовать", relation: root, id: poczuc }
  - { pl: "odczuć", ru: "ощутить", relation: root, id: odczuc }
etymology: "Приставка u- и czuć, из праславянского *čuti «чуять, ощущать» — того же корня, что русские «чуять», «чувствовать», «чуткий». Существительное uczucie построено ровно как русское «чувство»: от глагола восприятия образовали имя, и имя оказалось долговечнее. Польское czuć при этом сохранило и прямое «чуять» (czuć dym «чуять дым»), которое в русском отошло к собакам и охотникам."
memory: "uczuję — это «почувствую», будущее; «чувствую» будет czuję. А главное: сам глагол uczuć почти вышел из речи, его место занял poczuć, зато существительное uczucie «чувство» живо и частотно. И не спутай его с uczulenie — это «аллергия»."
idioms:
  - { pl: "żywić do kogoś uczucie", ru: "питать к кому-л. чувство" }
  - { pl: "z mieszanymi uczuciami", ru: "со смешанными чувствами" }
formExamplesSkip:
  - { form: "uczuci", reason: "Мужско-личная форма страдательного причастия требует дополнения-человека, а uczuć управляет названиями ощущений и чувств: ból, chłód, strach, ulgę. Подлежащего для этой формы быть не может." }
