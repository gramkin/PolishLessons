      - pl: "Spytano nas o cel wizyty."
        ru: "Нас спросили о цели визита."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ PYTAĆ — ЭТО «СПРАШИВАТЬ», А НЕ «ПЫТАТЬ». Слово то же самое: праславянское *pytati значило «доискиваться, выведывать». Русский увёл его в сторону допроса с мучением, и «пытать» стало страшным словом, а нейтральный смысл остался только в «испытать», «любопытный», «пытливый». Польский же сохранил исходное значение целиком. Русское «пытать» по-польски будет TORTUROWAĆ." }
  - { kind: government, text: "СПРАШИВАЮТ O COŚ — С ВИНИТЕЛЬНЫМ. Человек ставится в винительный, как и по-русски: spytać kogoś. А вот тема идёт через o с ВИНИТЕЛЬНЫМ: spytać o drogĘ, o cenĘ, o godzinĘ. Русское «спросить о дороге» требует предложного, и калька с ним будет ошибкой. Проверяй себя по окончанию: o drogę, а не «o drodze»." }
  - { kind: usage, text: "У несовершенного PYTAĆ две совершенные пары, SPYTAĆ и ZAPYTAĆ, и они почти равнозначны. Zapytać чуть официальнее и чаще в письменной речи, spytać — в разговорной. Есть ещё возвратное SPYTAĆ SIĘ с тем же смыслом: spytaj się mamy «спроси у мамы». Вид совершенный, поэтому spytam значит «спрошу», а не «спрашиваю»." }
collocations:
  - { pl: "spytać o drogę", ru: "спросить дорогу" }
  - { pl: "spytać o zdanie", ru: "спросить мнение" }
  - { pl: "spytać o radę", ru: "спросить совета" }
family:
  - { pl: "pytać", ru: "спрашивать (несов.)", relation: aspect, id: pytac }
  - { pl: "zapytać", ru: "спросить", relation: root, id: zapytac }
  - { pl: "pytanie", ru: "вопрос", relation: root, id: pytanie }
etymology: "Приставка s- и pytać, из праславянского *pytati «выведывать, доискиваться». Русский на этом корне построил «пытать» в смысле допроса и «испытать» в смысле проверки, польский же оставил простое «спрашивать». Общее у них видно в словах «любопытный» и «пытливый»: там наш корень всё ещё значит просто «желающий узнать», ровно как польское pytać."
memory: "pytać — это «спрашивать», а никакое не «пытать»; пытать по-польски torturować. И следи за падежом темы: spytać o drogę, винительный, а не «o drodze»."
idioms:
  - { pl: "spytać kogoś o zdanie", ru: "спросить чьё-л. мнение" }
  - { pl: "spytać o rękę", ru: "просить руки" }
