etymology: "От WYGODNY, от WYGODA «удобство», образованного приставкой WY- от корня *god-, который в праславянском означал «подходящий, приходящийся впору, срок». Русскому этот корень знаком широко: «год», «годный», «пригодиться», «погода», «угодить», и в польском он даёт GODZINA «час», ZGODA «согласие», POGODA «погода», GODNY «достойный». WYGODA это буквально «то, что приходится впору», откуда удобство. Русская «выгода» собрана из тех же частей, но закрепилась на другом значении, денежном, и это расхождение внутри общего корня объясняет, почему два совершенно прозрачных слова нельзя переводить друг через друга."
memory: "Удобно, а не выгодно. Выгодно — korzystnie или opłacalnie; wygoda «удобство», а не «выгода». Wygodnie mi значит «мне удобно». Три формы: wygodnie, wygodniej, najwygodniej. Корень тот же, что в русских «годный», «пригодиться», «погода»: исходно «приходящийся впору», откуда у поляков удобство, а у русских денежная выгода."
