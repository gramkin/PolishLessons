notes:
  - { kind: false-friend, text: "Один из самых чистых ложных друзей в этом словаре. WYGODNIE значит «удобно», и только это; русское «выгодно» оно не значит никогда. Выгодно по-польски KORZYSTNIE или OPŁACALNIE: TO SIĘ OPŁACA «это выгодно», KORZYSTNA OFERTA «выгодное предложение». Соответственно WYGODA это «удобство», а не «выгода», русской «выгоде» отвечает KORZYŚĆ или ZYSK. Фраза WYGODNIE MI значит «мне удобно», а не «мне выгодно», и именно её смешивают чаще всего. Проверка простая: если речь о деньгах и расчёте, WYGODNIE не подходит." }
  - { kind: government, text: "Наречие, три формы: положительная, сравнительная WYGODNIEJ и превосходная NAJWYGODNIEJ. Кому удобно — дательный без предлога: WYGODNIE MI, WYGODNIE CI TAK SIEDZIEĆ? В безличных оборотах при наречии стоит инфинитив: WYGODNIEJ BĘDZIE SPOTKAĆ SIĘ W CZWARTEK, NAJWYGODNIEJ JEST ZACZĄĆ OD KOŃCA. Сравнение строится предлогом OD с родительным или союзом NIŻ: WYGODNIEJ NIŻ W TAMTYCH BUTACH. Степени сравнения у наречий образуются от прилагательного, но без рода и падежа, поэтому форм всего три." }
  - { kind: pronunciation, text: "Читается «выго́дне», ударение на предпоследнем слоге. Буква Y даёт «ы», и этим начало слова отличается от русского «выгодно» только на слух привычно, а на письме совпадает. Конечное -NIE читается «не» с мягким н, одним слогом, а не «ние» в два слога. В сравнительной степени WYGODNIEJ ударение остаётся на предпоследнем слоге: «выго́дней». В превосходной NAJWYGODNIEJ слогов становится пять, и ударение переходит на предпоследний: «найвыго́дней»." }
  - { kind: usage, text: "Наречие описывает и телесное удобство, и удобство расположения или расписания, как и русское «удобно». Чего оно не делает — не выражает вежливой просьбы: русское «вам удобно будет прийти?» по-польски прозвучит как CZY BĘDZIE PANU WYGODNIE?, и это вопрос именно об удобстве, а не об учтивое согласии. Сравнительная форма WYGODNIEJ частотна в бытовых советах: WYGODNIEJ SIĘ DO NICH SIĘGA «до них удобнее дотягиваться». Отрицательная форма NIEWYGODNIE «неудобно» употребляется и в переносном смысле, о неловком положении." }
