notes:
  - { kind: register, text: "Слово специальное: его говорят архитекторы, плотники, экскурсоводы в скансенах и лесники. В бытовой речи о бревенчатом доме чаще скажут DOM Z BALI или DREWNIANA CHATA, а ZRĘBOWY встретится на табличке музея под открытым небом или в описании дома на продажу: DOM W KONSTRUKCJI ZRĘBOWEJ «дом срубовой конструкции»." }
  - { kind: usage, text: "Слово относительное, не сравнивается, и одиннадцать форм у него только в таблице. Мужско-личная форма ZRĘBOWI на практике не нужна: прилагательное описывает постройки, стены и участки леса, а не людей. Обратите внимание на чередование гласных: существительное ZRĄB «сруб; вырубка», а в прилагательном Ą переходит в Ę — ZRĘBOWY, как ZĄB — ZĘBY." }
  - { kind: pronunciation, text: "Читается «зрэмбо́вы»: Ę перед B звучит как «эм», ударение на предпоследнем слоге. Начальное ZR произносится слитно, без гласной между согласными. Конечное -WY — «вы», с твёрдым «ы»." }
collocations:
  - { pl: "konstrukcja zrębowa", ru: "срубовая конструкция" }
  - { pl: "dom zrębowy", ru: "срубовый дом" }
  - { pl: "pozostałości zrębowe", ru: "порубочные остатки" }
family:
  - { pl: "zrąb", ru: "сруб; лесосека", relation: root }
  - { pl: "rąbać", ru: "рубить", relation: root }
  - { pl: "zręby", ru: "основы, костяк (переносно)", relation: root }
  - { pl: "wyrąb", ru: "вырубка", relation: root }
etymology: "От ZRĄB «сруб», образованного от RĄBAĆ «рубить» с приставкой Z-; это точное соответствие русскому «сруб». Польское Ą на месте русского «у» — след праславянского носового гласного: RĄBAĆ — «рубить», ZĄB — «зуб»."
memory: "ZRĄB — «сруб», RĄBAĆ — «рубить»: польское Ą там, где у русских «у». В прилагательном Ą становится Ę: ZRĘBOWY — «срубовый». DOM ZRĘBOWY — бревенчатый дом, сложенный венцами."
idioms:
