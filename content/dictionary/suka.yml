# review
id: suka
format: 2
lemma: "suka"
rank: 1084
pos: noun
pron: { cyr: "су́ка" }
senses:
  - id: female-dog
    ru: "сука, самка собаки (нейтрально)"
    examples:
      - pl: "Jej suka ma trzy szczenięta."
        ru: "У её собаки трое щенят."
        source: { kind: translated, id: 2599348 }
      - pl: "Męski krokodyl żarł sukę."
        ru: "Самец крокодила пожирал суку."
        source: { kind: translated, id: 1258068 }
      - pl: "Suka urodziła pięć szczeniąt."
        ru: "Сука родила пять щенков."
        source: { kind: authored }
  - id: insult
    ru: "сука, стерва (грубо о женщине)"
    examples:
      - pl: "Suka."
        ru: "Сука."
        source: { kind: translated, id: 12359671 }
      - pl: "To straszna suka."
        ru: "Это жуткая стерва."
        source: { kind: translated, id: 6157674 }
      - pl: "Ona jest suką."
        ru: "Она стерва."
        source: { kind: translated, id: 5838080 }
      - pl: "Ona jest zimną suką."
        ru: "Она холодная стерва."
        source: { kind: translated, id: 5838121 }
      - pl: "Mary nazwała mnie głupią suką."
        ru: "Мэри назвала меня глупой сукой."
        source: { kind: translated, id: 12500230 }
notes:
  - { kind: register, text: "Два разных регистра в одном слове: о самке собаки — нейтрально и зоологически, о женщине — грубое оскорбление. Ровно как в русском, и различает только контекст." }
  - { kind: usage, text: "Звательный suko живёт в прямом оскорблении: Zamknij się, suko «Заткнись, сука»." }
  - { kind: usage, text: "Третье, жаргонное значение — «автозак», полицейский фургон." }
collocations:
  - { pl: "zimna suka", ru: "холодная стерва" }
  - { pl: "suka ze szczeniętami", ru: "сука со щенками" }
  - { pl: "ty suko", ru: "ты сука" }
etymology: "Праславянское *sǫka. Русское «сука» — то же самое слово, и оба языка развили из него одно и то же оскорбление."
memory: "suka — «сука»: о собаке нейтрально, о женщине грубо. Звательный suko — в прямом оскорблении."
idioms:
  - { pl: "zimna suka", ru: "холодная стерва" }
  - { pl: "ty suko", ru: "ты сука" }
  - { pl: "zbesztać jak burą sukę", ru: "отругать на чём свет стоит" }
