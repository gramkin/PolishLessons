formExamples:
  - form: "dotyka"
    pl: "Jest tak wysoki, że dotyka sufitu."
    ru: "Он такой высокий, что достаёт до потолка."
    source: { kind: translated, id: 356453 }
  - form: "dotyka"
    pl: "Poczułem, jak jej ręka mnie dotyka."
    ru: "Я почувствовал, как её рука меня касается."
    source: { kind: translated, id: 935242 }
  - form: "dotyka"
    pl: "Nie lubię jak pies dotyka mnie tym mokrym nosem!"
    ru: "Мне не нравится, когда собака тычет в меня мокрым носом."
    source: { kind: tatoeba, id: 6849536 }
  - form: "dotykać"
    pl: "Nie dotykać!"
    ru: "Не трогать!"
    source: { kind: translated, id: 11261810 }
  - form: "dotykać"
    pl: "Proszę nie dotykać."
    ru: "Пожалуйста, не трогайте."
    source: { kind: translated, id: 456959 }
  - form: "dotykać"
    pl: "Nie pozwól mu tego dotykać."
    ru: "Не разрешай ему это трогать."
    source: { kind: tatoeba, id: 411621 }
  - form: "dotykaj"
    pl: "Nie dotykaj tego."
    ru: "Не трогай это."
    source: { kind: translated, id: 531500 }
  - form: "dotykaj"
    pl: "Nie dotykaj mnie!"
    ru: "Не трогай меня!"
    source: { kind: translated, id: 3004527 }
  - form: "dotykaj"
    pl: "Niczego nie dotykaj."
    ru: "Ничего не трогай."
    source: { kind: translated, id: 8665156 }
  - form: "dotykając"
    pl: "Tamten chłopiec sparzył się w rękę, dotykając gorącego grzejnika."
    ru: "Тот мальчик обжёг руку, прикоснувшись к горячей батарее."
    source: { kind: translated, id: 2367739 }
  - form: "dotykając"
    pl: "Sprawdził temperaturę, dotykając czoła."
    ru: "Он проверил температуру, коснувшись лба."
    source: { kind: authored }
  - form: "dotykając"
    pl: "Wszedł cicho, nie dotykając drzwi."
    ru: "Он вошёл тихо, не трогая дверь."
    source: { kind: authored }
  - form: "dotykajcie"
    pl: "Nie dotykajcie pudła."
    ru: "Не трогайте коробку."
    source: { kind: translated, id: 12193930 }
  - form: "dotykajcie"
    pl: "Nie dotykajcie pudełka."
    ru: "Не трогайте коробочку."
    source: { kind: translated, id: 12193929 }
  - form: "dotykajcie"
    pl: "Nie dotykajcie eksponatów."
    ru: "Не трогайте экспонаты."
    source: { kind: authored }
  - form: "dotykał"
    pl: "Kot dotykał łapą myszy."
    ru: "Кот трогал мышь лапой."
    source: { kind: translated, id: 11387227 }
  - form: "dotykał"
    pl: "Ten wykład dotykał wielu zagadnień."
    ru: "Эта лекция затрагивала множество вопросов."
    source: { kind: translated, id: 967561 }
  - form: "dotykał"
    pl: "Lekarz nakazał mi, bym nawet nie dotykał alkoholu."
    ru: "Врач велел мне даже не притрагиваться к алкоголю."
    source: { kind: translated, id: 1352187 }
  - form: "dotykałeś"
    pl: "Dotykałeś czegoś?"
    ru: "Ты что-то трогал?"
    source: { kind: translated, id: 3649949 }
  - form: "dotykałeś"
    pl: "Dotykałeś tego wcześniej?"
    ru: "Ты это раньше трогал?"
    source: { kind: authored }
  - form: "dotykałeś"
    pl: "Nie dotykałeś klamki."
    ru: "Ты не трогал ручку."
    source: { kind: authored }
  - form: "dotykam"
    pl: "Boli, kiedy dotykam."
    ru: "Больно, когда я трогаю."
    source: { kind: translated, id: 10695754 }
  - form: "dotykam"
    pl: "Dotykam podbródka, udając, że myślę, ale nic nie przychodzi mi do głowy."
    ru: "Я трогаю подбородок, делая вид, что думаю, но в голову ничего не приходит."
    source: { kind: translated, id: 13560588 }
  - form: "dotykam"
    pl: "Nie dotykam niczego bez rękawiczek."
    ru: "Я ничего не трогаю без перчаток."
    source: { kind: authored }
