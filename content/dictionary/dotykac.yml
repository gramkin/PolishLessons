# review
id: dotykac
format: 2
lemma: "dotykać"
rank: 1124
pos: verb
aspect: imperf
pron: { cyr: "доты́каць" }
senses:
  - id: touch
    ru: "трогать, касаться"
    examples:
      - pl: "Nie dotykaj tego."
        ru: "Не трогай это."
        source: { kind: translated, id: 531500 }
      - pl: "Jest tak wysoki, że dotyka sufitu."
        ru: "Он такой высокий, что достаёт до потолка."
        source: { kind: translated, id: 356453 }
      - pl: "Poczułem, jak jej ręka mnie dotyka."
        ru: "Я почувствовал, как её рука меня касается."
        source: { kind: translated, id: 935242 }
  - id: prohibit
    ru: "nie dotykać — не трогать (запрет)"
    examples:
      - pl: "Nie dotykać!"
        ru: "Не трогать!"
        source: { kind: translated, id: 11261810 }
      - pl: "Nie pozwól mu tego dotykać."
        ru: "Не разрешай ему это трогать."
        source: { kind: tatoeba, id: 411621 }
  - id: affect
    ru: "затрагивать (тему); задевать (чувства)"
    examples:
      - pl: "Ten wykład dotykał wielu zagadnień."
        ru: "Эта лекция затрагивала множество вопросов."
        source: { kind: translated, id: 967561 }
      - pl: "Pół miliona dzieci w Nigerii nadal dotyka niedożywienie."
        ru: "Полмиллиона детей в Нигерии всё ещё страдают от недоедания."
        source: { kind: translated, id: 526622 }
notes:
  - { kind: government, text: "Главное отличие от русского — падеж: dotykać CZEGOŚ, родительный. Nie dotykaj szkła «Не трогай стекло» — по-русски здесь винительный." }
  - { kind: usage, text: "Совершенный вид — dotknąć. Nie dotykać! «Не трогать!» — стандартная табличка в музеях." }
  - { kind: usage, text: "Переносно значит «затрагивать»: dotykać tematu «затрагивать тему», а о беде — «постигать»: Kraj dotknął kryzys." }
  - { kind: usage, text: "Причастие dotknięty значит «задетый, обиженный»: Poczuł się dotknięty «Он почувствовал себя задетым»." }
collocations:
  - { pl: "nie dotykać", ru: "не трогать" }
  - { pl: "dotykać czegoś", ru: "касаться чего-то" }
  - { pl: "dotykać tematu", ru: "затрагивать тему" }
family:
  - { pl: "dotknąć", ru: "тронуть, коснуться", relation: aspect }
  - { pl: "dotyk", ru: "осязание, прикосновение", relation: root }
  - { pl: "dotykowy", ru: "сенсорный, осязательный", relation: derived }
etymology: "Приставка do- плюс tykać «трогать, тыкать», родственное русскому «тыкать». Русское «дотрагиваться» собрано похоже, но от корня «трогать»."
memory: "dotykać — «трогать, касаться», и падеж другой: dotykać CZEGOŚ, родительный. Nie dotykaj szkła «Не трогай стекло» — по-русски здесь винительный. Совершенный вид — dotknąć."
idioms:
  - { pl: "nie dotykać", ru: "не трогать" }
  - { pl: "dotknąć do żywego", ru: "задеть за живое" }
