etymology: "Из немецкого Nazi, сокращения от Nationalsozialist, «национал-социалист», по образцу Sozi, «социалист». Польский добавил суффикс -ISTA, как в KOMUNISTA и SOCJALISTA. Русское «нацист» пришло тем же путём, только через «ц»."
memory: "Nazista — нацист, через z: naziści, nazistów. Склоняется как женские на -a: nazisty, nazistę. Niemieccy naziści. Читается «нази́ста»."
