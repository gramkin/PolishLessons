notes:
  - { kind: false-friend, text: "Совпадение с русским «нацист» полное, разница в написании: польский пишет Z, а не C: NAZISTA, NAZIZM. Русский «фашист» в польском обычно не путают с нацистом: FASZYSTA — итальянский или общий ярлык, NAZISTA — немецкий. В польской исторической речи о немецких оккупантах чаще говорят просто NIEMCY или OKUPANCI." }
  - { kind: usage, text: "Мужской род, одушевлённое, мужское-личное, склоняется как женские на -A в единственном: NAZISTA, NAZISTY, NAZIŚCIE, NAZISTĘ, NAZISTĄ. Множественное NAZIŚCI с чередованием ST на ŚC. Звательный NAZISTO не употребляется. Женский род — NAZISTKA." }
  - { kind: government, text: "Бороться с нацистами — WALCZYĆ Z NAZISTAMI, Z с творительным. Жертвы нацистов — OFIARY NAZISTÓW, родительный. Под властью нацистов — POD RZĄDAMI NAZISTÓW." }
  - { kind: pronunciation, text: "Читается «нази́ста», три слога, ударение на предпоследнем. Z звонкое, «з», а не «ц». Во множественном NAZIŚCI: «нази́сьци», с мягкими «сь» и «ци»." }
  - { kind: register, text: "Историческое и политическое слово, нейтральное в учебнике, оскорбительное в споре. В Польше память о нацистской оккупации очень жива, и NAZISTA — одно из самых тяжёлых слов. Официально пишут NIEMIECCY NAZIŚCI, чтобы не размывать ответственность." }
