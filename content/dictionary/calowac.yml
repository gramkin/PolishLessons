notes:
  - { kind: false-friend, text: "Ловушки нет, зато есть красивое совпадение. Польское całować построено от cały «целый», и русское «целовать» — от «целый» точно так же. Оба языка сделали поцелуй из пожелания целости и здоровья: поцеловать значило «пожелать быть целым». Так что слова не просто похожи, они собраны по одному чертежу." }
  - { kind: usage, text: "Целуют КОГО в винительном, а куда именно — предлогом w с винительным: całować w rękę, w czoło, w policzek. Точно как по-русски «целовать в руку». Возвратное całować się значит «целоваться»." }
  - { kind: government, text: "Обычай całować w rękę (целовать руку женщине или духовному лицу) в Польше ещё жив, особенно у старшего поколения, и детей учат говорить babciu, całuję rączki. Формула całuję в конце письма отвечает русскому «целую»." }
  - { kind: pronunciation, text: "Глаголы на -ować меняют основу в настоящем времени: -ow- уступает место -uj-. Отсюда całować — całuję, całujesz, и głosować — głosuję, głosujesz. Это правило без исключений, и оно охватывает сотни польских глаголов, в том числе все заимствованные (telefonować, organizować). Вид несовершенный, поэтому есть причастия настоящего времени (całujący, głosując) и НЕТ формы на -wszy." }
