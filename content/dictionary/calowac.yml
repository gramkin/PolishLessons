etymology: "От cały «целый», праславянское *cělъ «целый, невредимый». Поцелуй был пожеланием целости: приветствуя, желали быть «цел и здоров». Русское «целовать» образовано от «целый» в точности так же, и это один из самых наглядных примеров общего словообразования в двух языках. Из того же корня польское uzdrowić и русское «целитель»."
memory: "całować — «целовать», и собрано слово так же, как русское: от cały «целый», то есть «желать быть целым». Главное помнить мену основы: całować, но całuję, całujesz."
