senses:
  - id: bar
    ru: "бар"
    examples:
      - pl: "Dla miłośników rozgrzewających napoi przewidziano bar."
        ru: "Для любителей горячительных напитков предусмотрен бар."
        source: { kind: tatoeba, id: 5907089 }
      - pl: "Gdzie jest najbliższy bar?"
        ru: "Где ближайший бар?"
        source: { kind: translated, id: 8534089 }
      - pl: "Pracuję w barze."
        ru: "Я работаю в баре."
        source: { kind: translated, id: 3865337 }
  - id: to-bar
    ru: "do baru — в бар"
    examples:
      - pl: "Policjanci wkroczyli do baru."
        ru: "Полицейские вошли в бар."
        source: { kind: translated, id: 352665 }
      - pl: "Poszedł do baru wypić kilka piw."
        ru: "Он пошёл в бар выпить пару пива."
        source: { kind: translated, id: 7053952 }
      - pl: "Dawaj skoczymy do baru na drinka."
        ru: "Давай заскочим в бар выпить."
        source: { kind: translated, id: 13335500 }
  - id: at-bar
    ru: "w barze — в баре"
    examples:
      - pl: "Są w barze."
        ru: "Они в баре."
        source: { kind: tatoeba, id: 6017170 }
      - pl: "Anglik, Belg i Holender wchodzą do pubu i siadają przy barze. Barman pyta, \"Chwila, to jakiś żart czy co?\""
        ru: "Англичанин, бельгиец и голландец заходят в паб и садятся за стойку. Бармен: \"Не понял, это что, анекдот?\""
        source: { kind: tatoeba, id: 2987385 }
      - pl: "Spotkajmy się w barze."
        ru: "Встретимся в баре."
        source: { kind: authored }
  - id: bar-mleczny
    ru: "bar mleczny — молочный бар, дешёвая столовая"
    note: "Спиртного там не подают вовсе."
    examples:
      - pl: "Zjedliśmy obiad w barze mlecznym."
        ru: "Мы пообедали в молочном баре."
        source: { kind: authored }
      - pl: "Bar mleczny to tania stołówka."
        ru: "Молочный бар — это дешёвая столовая."
        source: { kind: authored }
      - pl: "Na rogu jest bar z pierogami."
        ru: "На углу есть закусочная с варениками."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "В Польше bar — это не только питейный бар, но и дешёвая закусочная. Классический bar mleczny «молочный бар» — столовая, где спиртного не подают вовсе: там едят пироги, супы и вареники." }
  - { kind: government, text: "do baru «в бар» — родительный падеж; w barze «в баре» — предложный; przy barze «у барной стойки» — предложный." }
  - { kind: usage, text: "Ходовые: bar mleczny «молочный бар», bar szybkiej obsługi «закусочная быстрого обслуживания», barman «бармен»." }
  - { kind: usage, text: "Слово омонимично физической единице давления bar — она от греческого βαρύς «тяжёлый», и это совсем другое слово." }
collocations:
  - { pl: "bar mleczny", ru: "молочный бар" }
  - { pl: "do baru", ru: "в бар" }
  - { pl: "w barze", ru: "в баре" }
  - { pl: "przy barze", ru: "у барной стойки" }
family:
  - { pl: "barman", ru: "бармен", relation: derived }
  - { pl: "kawiarnia", ru: "кафе", relation: root }
  - { pl: "stołówka", ru: "столовая", relation: root }
etymology: "Через английское bar «стойка, перекладина» — то же заимствование, что русский «бар»."
memory: "bar — «бар», но в Польше слово шире: это и питейный бар, и дешёвая закусочная. Классический bar mleczny «молочный бар» — столовая, где спиртного не подают вовсе, там едят супы и вареники. Управление обычное: do baru, w barze, przy barze."
idioms:
