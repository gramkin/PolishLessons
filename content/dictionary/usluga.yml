etymology: "От глагола USŁUŻYĆ «услужить», из приставки U- и корня SŁUG-, того же, что в SŁUŻYĆ «служить», SŁUGA «слуга», OBSŁUGA «обслуживание». Корень праславянский, *sluga, и русские «слуга», «служить», «услуга» — его прямые родственники, собранные теми же приставками. Поэтому строение слова для русского прозрачно и догадка здесь надёжна. Разошлись языки только в распределении производных: польский развёл USŁUGA «платная работа» и PRZYSŁUGA «одолжение» по двум приставкам, U- и PRZY-, тогда как русский оставил обе в одном слове. Приставка PRZY- несёт оттенок добавления, сделанного попутно, и это объясняет, почему именно она досталась бесплатному одолжению."
memory: "Два слова там, где русский держит одно: usługa — работа за плату, przysługa — одолжение по дружбе. «Окажи мне услугу» будет zrób mi przysługę, не usługę. Читается «усуу́га», с двумя «у» подряд, потому что ł даёт «у». В дательном и местном g переходит в dz: w usłudze, как w obsłudze. Лемма — usługa, а usługi её множественное, хотя в частотности стоит выше."
