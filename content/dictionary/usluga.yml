notes:
  - { kind: false-friend, text: "Со значением всё совпадает, а вот распределение между двумя родственными словами русский угадает не сразу. USŁUGA — это услуга как работа за плату: USŁUGI REMONTOWE, USŁUGI FRYZJERSKIE, PUNKT USŁUG. А PRZYSŁUGA — это услуга в смысле одолжения, то, что делают по дружбе и бесплатно: WYRZĄDZIĆ KOMUŚ PRZYSŁUGĘ «оказать кому-то услугу», PROSIĆ O PRZYSŁUGĘ. Русское «услуга» покрывает оба, и потому фразу «окажи мне услугу» нельзя переводить через USŁUGA: нужно ZRÓB MI PRZYSŁUGĘ. Это одно из самых практичных разграничений в бытовой речи." }
  - { kind: pronunciation, text: "Читается «усуу́га», и выглядит это странно, пока не вспомнить правило: буква Ł даёт «у». Поэтому USŁUGA = у + с + у(из Ł) + у + га, то есть два «у» подряд в середине слова. Ударение на предпоследнем слоге. Это та же механика, что в SŁAWA «суа́ва» и WYSIŁEK «выси́уэк», но здесь она заметнее всего, потому что рядом с Ł стоит настоящее U. Проговорить стоит медленно, не сливая два «у» в одно." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: ZAMÓWILI USŁUGĘ. Главное в падежах — дательный и местный USŁUDZE, где G переходит в DZ: «усуу́дзе». Это то же чередование, что в OBSŁUGA и OBSŁUDZE, и родственное переходам в RUNDA и RUNDZIE. За услугу платят с предлогом ZA и винительным: ZAPŁACIĆ ZA USŁUGĘ. Отрасль употребляется во множественном с предлогом W: PRACOWAĆ W USŁUGACH «работать в сфере услуг»." }
  - { kind: usage, text: "В единственном числе слово означает отдельную работу, во множественном — и несколько работ, и целую отрасль: USŁUGI как сектор экономики, SEKTOR USŁUG, USŁUGI PUBLICZNE. Именно из-за отраслевого смысла множественное число встречается чаще единственного, и в частотных списках USŁUGI стоит выше, чем USŁUGA. Но лемма всё же USŁUGA, а USŁUGI — её множественное число, и карточка описывает оба употребления. Устойчивые сочетания: PUNKT USŁUG «пункт услуг», UMOWA O ŚWIADCZENIE USŁUG «договор об оказании услуг»." }
