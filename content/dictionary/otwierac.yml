# review
id: otwierac
format: 2
lemma: "otwierać"
rank: 1028
pos: verb
aspect: imperf
pron: { cyr: "отве́раць" }
senses:
  - id: open
    ru: "открывать"
    examples:
      - pl: "Ona otwiera okno."
        ru: "Она открывает окно."
        source: { kind: translated, id: 3125567 }
      - pl: "Czy muszę otwierać okno?"
        ru: "Мне надо открыть окно?"
        source: { kind: translated, id: 359797 }
      - pl: "Co ten klucz otwiera?"
        ru: "Что открывает этот ключ?"
        source: { kind: translated, id: 3418772 }
  - id: open-itself
    ru: "otwierać się — открываться"
    examples:
      - pl: "Drzwi nie otwierają się."
        ru: "Двери не открываются."
        source: { kind: translated, id: 2810315 }
      - pl: "Drzwi się teraz otwierają."
        ru: "Двери сейчас открываются."
        source: { kind: translated, id: 3866127 }
      - pl: "Drzwi się nie otwierają."
        ru: "Двери не открываются."
        source: { kind: translated, id: 12904760 }
  - id: opening-hours
    ru: "o której się otwiera — во сколько открывается"
    examples:
      - pl: "O której się otwiera?"
        ru: "Во сколько открывается?"
        source: { kind: translated, id: 935372 }
      - pl: "O której otwierają bank?"
        ru: "Во сколько открывают банк?"
        source: { kind: translated, id: 2707301 }
      - pl: "Banki są otwierane o dziewiątej."
        ru: "Банки открывают в девять."
        source: { kind: translated, id: 1459805 }
notes:
  - { kind: usage, text: "Совершенный вид — otworzyć, и основа меняется целиком: otwieram «открываю», но otworzę «открою». Эту пару надо запомнить вместе." }
  - { kind: usage, text: "Возвратное otwierać się значит «открываться»: Drzwi się nie otwierają «Двери не открываются»." }
  - { kind: usage, text: "О заведениях слово употребляется безлично: O której się otwiera? «Во сколько открывается?», O której otwierają bank? «Во сколько открывают банк?»." }
  - { kind: usage, text: "Otwieraj! как окрик значит «Открывай!». А nóż się w kieszeni otwiera — «с души воротит», буквально «нож в кармане открывается»." }
collocations:
  - { pl: "otwierać okno", ru: "открывать окно" }
  - { pl: "otwierać drzwi", ru: "открывать дверь" }
  - { pl: "otwierać się", ru: "открываться" }
  - { pl: "o której się otwiera", ru: "во сколько открывается" }
family:
  - { pl: "otworzyć", ru: "открыть", relation: aspect }
  - { pl: "otwarty", ru: "открытый", relation: derived }
  - { pl: "zamykać", ru: "закрывать", relation: antonym }
etymology: "Приставка ot- + wierać, от wrzeć «запирать» — тот же корень, что в русском «отворять». Otwierać и «отворять» — прямые родственники."
memory: "otwierać — «открывать», совершенный вид otworzyć, и основа меняется целиком: otwieram, но otworzę. Возвратное otwierać się значит «открываться»: Drzwi się nie otwierają."
idioms:
  - { pl: "otwierać się", ru: "открываться" }
  - { pl: "o której się otwiera", ru: "во сколько открывается" }
  - { pl: "nóż się w kieszeni otwiera", ru: "с души воротит" }
formExamplesSkip:
  - { form: "otwierani", reason: "мужско-личная форма страдательного причастия: открывают двери, окна и магазины, а не людей, поэтому форма не употребляется" }
