etymology: "Приставка WY- плюс ZDROWIEĆ, от прилагательного ZDROWY, праславянское *sъdorvъ — то же слово, что русское «здоровый». Исходно оно значило «из хорошего дерева», от *dorvo «дерево», и образ крепкого ствола стоял за идеей крепкого человека; русское «здоровый» и «дерево» действительно одного происхождения, хотя связь давно не слышна. Приставка WY- отвечает русской ВЫ- буквально, и вся конструкция совпадает поморфемно: WY-ZDROW-IEĆ и «вы-здоров-еть». Такие полные совпадения в двух языках редки и обычно означают, что слово сложилось ещё до их разделения. От того же корня идут ZDROWIE, UZDROWIĆ «исцелить», UZDROWISKO «курорт»."
memory: "Совпадение поморфемное: wy- это «вы-», zdrow- это «здоров-», и wyzdrowieć это «выздороветь». Но ударение другое: польское на предпоследнем слоге, «выздро́вечь», а русское на первом. Сорок две формы — подпись непереходного глагола совершенного вида, у которого страдательного причастия нет и быть не может. И запомнить na zdrowie, которым поляк отвечает и на чих, и на поднятый бокал."
idioms:
  - { pl: "wracać do zdrowia", ru: "идти на поправку" }
