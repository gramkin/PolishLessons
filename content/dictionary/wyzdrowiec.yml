notes:
  - { kind: usage, text: "Сорок две формы — ровно столько, сколько бывает у непереходного глагола совершенного вида, и это стоит прочесть как подпись. Страдательного причастия здесь нет вовсе: выздоравливают сами, а не кого-то, так что форм вроде WYZDROWIONY не существует и существовать не может. Нет и действительного причастия на -ĄCY, потому что оно принадлежит несовершенному виду; для него есть WYZDROWIENIE только как существительное. Сравните с переходным глаголом вроде WYCZYŚCIĆ, у которого пятьдесят три формы: разница в одиннадцать и есть страдательное причастие." }
  - { kind: false-friend, text: "Соответствие с русским почти буквальное: WY- это «вы-», ZDROWIE это «здоровье», и WYZDROWIEĆ — «выздороветь». Но одно употребление расходится заметно. Польское NA ZDROWIE говорят и когда кто-то чихнул, и поднимая бокал; русский в этих случаях говорит по-разному — «будь здоров» и «за здоровье». Ещё стоит знать короткую форму ZDRÓW, которая в точности отвечает русскому «здоров»: CAŁY I ZDRÓW значит «цел и невредим»." }
  - { kind: government, text: "Глагол непереходный и дополнения не берёт. Причина болезни или состояние, из которого выздоравливают, вводится предлогом Z с родительным: WYZDROWIEĆ Z GRYPY «выздороветь от гриппа». Русский здесь ставит «от» с родительным, так что падеж совпадает, а предлог нет, и это стоит запомнить отдельно. Срок выражается предлогом DO с родительным: WYZDROWIEJE DO SOBOTY. Безличная форма WYZDROWIANO встречается редко и звучит книжно, но образуется от непереходного глагола совершенно правильно." }
  - { kind: pronunciation, text: "Читается «выздро́вечь», три слога, ударение на предпоследнем, то есть на ZDRO. Русское «выздороветь» ставит ударение на первый слог, поэтому переносить привычку нельзя. Сочетание WIE даёт «ве» с мягким В, а не «вие». Начальная группа WYZDR требует внимания: четыре согласных подряд после Y, и произносить её надо слитно. В формах прошедшего времени Ł звучит как «у»: WYZDROWIAŁEM это «выздрове́уэм»." }
  - { kind: register, text: "Слово нейтральное и повседневное, им говорят и дома, и у врача. Самые частые обороты — SZYBKIEGO WYZDROWIENIA «скорейшего выздоровления», пожелание, которое пишут в открытках, и WRACAĆ DO ZDROWIA «идти на поправку». Несовершенного партнёра в прямом смысле у глагола нет: процесс выражают через ZDROWIEĆ или описательно, ZDROWIEJE Z DNIA NA DZIEŃ. Рядом стоят ZDROWY «здоровый», ZDROWIE «здоровье», UZDROWISKO «курорт» и SŁUŻBA ZDROWIA «здравоохранение»." }
