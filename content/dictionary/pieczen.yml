# review
id: pieczen
format: 2
lemma: "pieczeń"
rank: 5796
pos: noun
pron: { cyr: "пе́чэнь" }
senses:
  - id: roast
    ru: "жаркое, запечённое мясо"
    examples:
      - pl: "Mieliśmy bawarską pieczeń wieprzową z czerwoną kapustą."
        ru: "У нас было баварское свиное жаркое с красной капустой."
        source: { kind: translated, id: 10203189 }
      - pl: "Na weselu podano pieczeń z dzika."
        ru: "На свадьбе подали жаркое из кабана."
        source: { kind: authored }
      - pl: "Pieczeń musi odpocząć przed krojeniem."
        ru: "Жаркому нужно постоять перед нарезкой."
        source: { kind: authored }
      - pl: "Na święta zawsze robimy pieczeń wołową."
        ru: "На праздники мы всегда готовим запечённую говядину."
        source: { kind: authored }
      - pl: "Pieczeń na zimno świetnie nadaje się do kanapek."
        ru: "Холодное жаркое отлично подходит для бутербродов."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PIECZEŃ — «жаркое, запечённое мясо», а не «печень». Печень по-польски — WĄTROBA, печёнка в кулинарии — WĄTRÓBKA." }
  - { kind: usage, text: "Семь форм, женский род с мягкой основой. Форма PIECZENI покрывает родительный, дательный и предложный единственного и родительный множественного. Именительный множественного PIECZENIE совпадает с отглагольным PIECZENIE «выпекание»: PIECZENIE CHLEBA — «выпечка хлеба»." }
  - { kind: government, text: "Из чего жаркое — Z с родительным: PIECZEŃ Z DZIKA, Z INDYKA. Чаще — прилагательное: PIECZEŃ WOŁOWA, WIEPRZOWA, CIELĘCA." }
  - { kind: pronunciation, text: "Читается «пе́чэнь»: CZ твёрдое, Ń мягкое. Ударение на первом слоге." }
collocations:
  - { pl: "pieczeń wołowa", ru: "запечённая говядина" }
  - { pl: "pieczeń z dzika", ru: "жаркое из кабана" }
  - { pl: "pieczeń na zimno", ru: "холодное жаркое" }
  - { pl: "pieczeń rzymska", ru: "мясной рулет" }
family:
