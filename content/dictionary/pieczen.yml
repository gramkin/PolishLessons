  - { pl: "pieczywo", ru: "хлеб и выпечка", relation: derived }
etymology: "Праславянское *pečenь «испечённое», от *pekti «печь». Русское «печень» звучит похоже, но значит другое."
memory: "Pieczeń — жаркое из духовки, не «печень» (wątroba). Upiec dwie pieczenie przy jednym ogniu — убить двух зайцев."
idioms:
  - { pl: "upiec dwie pieczenie przy jednym ogniu", ru: "убить двух зайцев одним выстрелом" }
  - { pl: "upiec własną pieczeń przy cudzym ogniu", ru: "погреть руки на чужом деле" }
formExamplesSkip:
