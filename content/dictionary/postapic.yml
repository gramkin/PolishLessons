# review
id: postapic
format: 2
lemma: "postąpić"
rank: 2449
pos: verb
aspect: perf
pron: { cyr: "посто́мпиць" }
senses:
  - id: act
    ru: "поступить, повести себя"
    examples:
      - pl: "Mądrze postąpił."
        ru: "Он поступил мудро."
        source: { kind: tatoeba, id: 2145216 }
      - pl: "Ja bym tak nie postąpił."
        ru: "Я бы так не поступил."
        source: { kind: tatoeba, id: 6328249 }
      - pl: "Postąpił zgodnie z moim zdaniem."
        ru: "Он поступил согласно моему мнению."
        source: { kind: translated, id: 415353 }
  - id: follow-advice
    ru: "поступить по (совету), последовать"
    examples:
      - pl: "Postąpił za moją radą."
        ru: "Он поступил по моему совету."
        source: { kind: translated, id: 404470 }
      - pl: "Na twoim miejscu postąpiłbym inaczej."
        ru: "На твоём месте я бы поступил по-другому."
        source: { kind: tatoeba, id: 897799 }
notes:
  - { kind: government, text: "Поступить по совету — postąpić ZA radą, с предлогом za и творительным падежом. Русское «последовать совету» обходится дательным, так что предлог легко забыть." }
  - { kind: usage, text: "Оценка поступка идёт наречием впереди: mądrze postąpił «он поступил мудро», głupio postąpiłem «я сглупил»." }
  - { kind: false-friend, text: "Корень stąpać «ступать», как и у następować. Поступить — значит «сделать шаг»." }
  - { kind: usage, text: "Несовершенный вид — postępować, у которого есть и отдельное значение «продвигаться, прогрессировать»." }
collocations:
  - { pl: "postąpić słusznie", ru: "поступить правильно" }
  - { pl: "postąpić za radą", ru: "поступить по совету" }
etymology: "po- + stąpać «ступать»; ср. русское «поступок», «поступь». Поступить — сделать шаг."
memory: "postąpić — «поступить, повести себя». Главное в управлении: postąpić ZA radą «поступить по совету», с za и творительным. Несовершенный вид — postępować."
idioms:
  - { pl: "postąpić słusznie", ru: "поступить правильно" }
  - { pl: "postąpić za radą", ru: "поступить по совету" }
