# review
id: teatr
format: 2
lemma: "teatr"
rank: 2645
pos: noun
pron: { cyr: "тэ́атр" }
senses:
  - id: building
    ru: "театр (здание, учреждение)"
    examples:
      - pl: "Teatr stoi naprzeciwko dworca."
        ru: "Театр стоит напротив вокзала."
        source: { kind: authored }
      - pl: "Idziemy dziś do teatru."
        ru: "Мы идём сегодня в театр."
        source: { kind: authored }
      - pl: "W teatrze nie wolno rozmawiać przez telefon."
        ru: "В театре нельзя разговаривать по телефону."
        source: { kind: authored }
  - id: art
    ru: "театр как искусство"
    examples:
      - pl: "Teatr uczy patrzeć na człowieka."
        ru: "Театр учит смотреть на человека."
        source: { kind: authored }
      - pl: "Zajmuje się teatrem od studiów."
        ru: "Он занимается театром со студенческих лет."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Предложный падеж — W TEATRZE, с переходом r в rz. Это общее правило: перед окончанием -e твёрдое r смягчается именно так, отсюда rower — na rowerze, ser — w serze, dwór — na dworze. Русскому здесь подсказки нет: у нас «в театре» с обычным р, и рука сама тянется написать «w teatre»." }
  - { kind: usage, text: "Родительный — TEATRU, с окончанием -u, а не -a: idę do teatru. Так ведут себя неодушевлённые мужские с общим или отвлечённым значением, уже знакомые по sok — soku, zysk — zysku и pałac — pałacu. Окончание -a досталось бы скорее счётным предметам вроде cent — centa." }
collocations:
  - { pl: "iść do teatru", ru: "идти в театр" }
  - { pl: "teatr lalek", ru: "кукольный театр" }
  - { pl: "w teatrze", ru: "в театре" }
family:
  - { pl: "teatralny", ru: "театральный", relation: derived }
  - { pl: "teatrzyk", ru: "маленький театр", relation: derived }
  - { pl: "amfiteatr", ru: "амфитеатр", relation: root }
etymology: "Из греческого théatron «место, откуда смотрят», от theáomai «смотрю», через латинское theatrum. Русский и польский взяли слово из одного источника и оба оставили мужского рода, так что согласование совпадает. От того же корня amfiteatr, а греческое «смотрю» сидит и в слове «теория» — изначально «созерцание»."
memory: "В театре — W TEATRZE, с rz: перед -e твёрдое r всегда смягчается. И родительный на -u: do teatru."
idioms:
  - { pl: "teatr jednego aktora", ru: "театр одного актёра" }
  - { pl: "robić teatr", ru: "устраивать сцену" }
