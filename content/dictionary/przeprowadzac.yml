family:
  - { pl: "prowadzić", ru: "вести", relation: root, id: prowadzic }
  - { pl: "przeprowadzić", ru: "провести; перевести", relation: aspect, id: przeprowadzic }
  - { pl: "przeprowadzka", ru: "переезд", relation: root }
  - { pl: "tłumaczyć", ru: "переводить (с языка)", relation: root, id: tlumaczyc }
etymology: "Из приставок PRZE- и PRO- на корне *voditi «вести», том же, что русские «водить», «вести», «проводить». Приставка PRZE- отвечает русскому «пере-», и буквальное значение — «провести через», откуда и перевод через улицу, и проведение мероприятия: в обоих случаях кого-то или что-то ведут от начала до конца. Русский закрепил за этим смыслом «проводить» с одной приставкой, а польский оставил две, PRZE- и PRO-, и получил слово длиннее. Возвратное значение «переезжать» выросло из образа перевода хозяйства с места на место: человек как бы переводит себя, и отсюда PRZEPROWADZKA. Русский для этого взял «переезд», от «езды», то есть назвал способ передвижения, а не перевод. Любопытно, что значение «переводить с языка на язык» польский отдал совсем другому корню, TŁUMACZYĆ, родственному русскому «толмачу»."
memory: "Корень prowadz- = русское «вод» (prowadzić «вести»). Но przeprowadzać не «переводить»: главное значение — «проводить» (badania, kontrolę, reformę), второе буквальное — «переводить через улицу». Переводить с языка это tłumaczyć. И самое неожиданное: przeprowadzać się значит «переезжать», а przeprowadzka — «переезд». Управление: przez + винительный для «через», do + родительный для «переезжать в», где русский берёт винительный."
