notes:
  - { kind: false-friend, text: "Корень PROWADZ- отвечает русскому «вод»: PROWADZIĆ значит «вести», и это слово знакомо через «проводить», «водить». Но приставочное PRZEPROWADZAĆ русскому «переводить» не отвечает почти никогда. Главное значение — «проводить» мероприятие: PRZEPROWADZAĆ BADANIA «проводить исследования», PRZEPROWADZAĆ KONTROLĘ «проводить проверку», PRZEPROWADZAĆ REFORMĘ «проводить реформу». Второе значение буквальное, «переводить через что-то»: PRZEPROWADZIĆ DZIECKO PRZEZ ULICĘ. А «переводить» с языка на язык — это TŁUMACZYĆ, и путать нельзя. Самое неожиданное — возвратное PRZEPROWADZAĆ SIĘ, которое значит «переезжать», и существительное PRZEPROWADZKA — «переезд»." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия PRZEPROWADZAJĄCY, одиннадцать от страдательного PRZEPROWADZANY. Совершенная пара — PRZEPROWADZIĆ, и основы различаются одной гласной: PRZEPROWADZAM против PRZEPROWADZĘ. Возвратная форма с SIĘ живёт отдельной жизнью и в значении «переезжать» употребляется чаще, чем сам невозвратный глагол в быту: PRZEPROWADZAM SIĘ W SOBOTĘ. Существительные делят значения: PRZEPROWADZENIE — «проведение» мероприятия, PRZEPROWADZKA — «переезд». Смешивать их нельзя, хотя корень один." }
  - { kind: government, text: "Переходный: проводить что — винительный без предлога, PRZEPROWADZAĆ BADANIE, KONTROLĘ, REMONT. Через что — предлог PRZEZ с винительным: PRZEPROWADZAĆ PRZEZ ULICĘ, PRZEZ MOST, PRZEZ BRÓD, и русский говорит так же, «через что-то». Куда переезжать — предлог DO с родительным: PRZEPROWADZAĆ SIĘ DO KRAKOWA, DO NOWEGO MIESZKANIA, где русский берёт «в» с винительным. Откуда — Z с родительным: Z WARSZAWY. Отрицание переводит дополнение в родительный: NIE PRZEPROWADZAMY TEGO BADANIA." }
  - { kind: pronunciation, text: "Читается «пшэпрова́джаць», пять слогов, ударение на предпоследнем. Приставка PRZE- звучит «пшэ», потому что RZ после глухого P оглушается в «ш». Дальше PRO читается «про», с отчётливым О без редукции. Буквосочетание DZ даёт слитное «дж». Конечное Ć — мягкое «ць». В совершенном виде PRZEPROWADZIĆ сочетание DZI даёт мягкое «дзь»: «пшэпрова́дзиць». В существительном PRZEPROWADZKA ударение тоже предпоследнее: «пшэпрова́цка», где DZK звучит как «цк»." }
