        source: { kind: authored }
      - pl: "Dziecko porzucono pod szpitalem."
        ru: "Ребёнка оставили у больницы."
        source: { kind: authored }
  - id: abandon-thing
    ru: "бросить, оставить (дом, план, занятие)"
    examples:
      - pl: "Porzucił studia po roku."
        ru: "Он бросил учёбу через год."
        source: { kind: authored }
      - pl: "Porzucili wioskę po powodzi."
        ru: "Они покинули деревню после наводнения."
        source: { kind: authored }
  - id: abandoned
    ru: "porzucony — брошенный, заброшенный"
    examples:
      - pl: "Dom stał porzucony od lat."
        ru: "Дом стоял заброшенным годами."
        source: { kind: authored }
      - pl: "Porzucony pies czekał pod sklepem."
        ru: "Брошенный пёс ждал у магазина."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Прозрачного русского родственника у этого слова НЕТ, и выдумывать его не стоит. Польское rzucić «бросить» идёт от праславянского *rutiti, а русский на это значение взял совсем другой корень — «бросить». Так что porzucić приходится просто заучить; зато вся польская семья строится предсказуемо: rzucić «бросить», wyrzucić «выбросить», odrzucić «отвергнуть», zarzucić «набросить; упрекнуть»." }
  - { kind: government, text: "Бросают КОГО и ЧТО — винительный, как по-русски: porzucić żonę, porzucić dom, porzucić nadzieję. Никаких расхождений с русским управлением здесь нет." }
  - { kind: usage, text: "Приставка po- придаёт оттенок окончательности: porzucić сильнее, чем zostawić «оставить», и почти всегда подразумевает упрёк — бросить того, кто остался беззащитным. О вещах это значит «забросить насовсем». Несовершенная пара — porzucać." }
  - { kind: pronunciation, text: "Страдательное причастие даёт -ony почти везде, но в мужско-личном множественном o переходит в e: doświadczony — doświadczeni, porzucony — porzuceni. Та же мена у zatrudniony — zatrudnieni и podzielony — podzieleni; выучив её один раз, вы узнаете её у всех таких причастий." }
collocations:
  - { pl: "porzucić nadzieję", ru: "оставить надежду" }
  - { pl: "porzucone dziecko", ru: "брошенный ребёнок" }
  - { pl: "porzucić studia", ru: "бросить учёбу" }
family:
  - { pl: "rzucić", ru: "бросить", relation: root, id: rzucic }
  - { pl: "odrzucić", ru: "отвергнуть", relation: derived }
  - { pl: "porzucać", ru: "бросать, покидать", relation: aspect }
etymology: "Приставка po- плюс rzucić, от праславянского *rutiti «валить, бросать». Русский на это значение пошёл другим корнем («бросить»), поэтому прямого соответствия нет, и честнее сказать это прямо, чем подбирать похожее слово. Приставка po- здесь придаёт окончательность: бросить так, чтобы не вернуться."
memory: "porzucić — «бросить, покинуть». Русского родственника нет, слово надо выучить, зато семья прозрачна: rzucić «бросить», wyrzucić «выбросить», odrzucić «отвергнуть». Приставка po- значит «насовсем»."
idioms:
