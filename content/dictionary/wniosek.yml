# review
id: wniosek
format: 2
lemma: "wniosek"
rank: 1776
pos: noun
pron: { cyr: "вньо́сэк" }
senses:
  - id: conclusion
    ru: "вывод, заключение"
    examples:
      - pl: "Skąd taki wniosek?"
        ru: "Откуда такой вывод?"
        source: { kind: translated, id: 731995 }
      - pl: "Doszliśmy do wniosku, że miał rację."
        ru: "Мы пришли к выводу, что он был прав."
        source: { kind: translated, id: 363724 }
      - pl: "Nie wyciągaj pochopnych wniosków."
        ru: "Не делай поспешных выводов."
        source: { kind: translated, id: 7868937 }
  - id: motion
    ru: "заявление, ходатайство, предложение"
    examples:
      - pl: "Wypełnij wniosek."
        ru: "Заполни заявление."
        source: { kind: translated, id: 10807976 }
      - pl: "Wniosek został odrzucony."
        ru: "Заявление было отклонено."
        source: { kind: translated, id: 8482810 }
      - pl: "Przewodniczący odrzucił wniosek."
        ru: "Председатель отклонил предложение."
        source: { kind: translated, id: 9679587 }
notes:
  - { kind: usage, text: "dojść do wniosku — «прийти к выводу», предлог do с родительным: doszliśmy do wniosku, że… «мы пришли к выводу, что…»." }
  - { kind: usage, text: "wyciągać wnioski — «делать выводы»; nie wyciągaj pochopnych wniosków «не делай поспешных выводов»." }
  - { kind: usage, text: "Второе, канцелярское значение — «заявление, ходатайство»: złożyć wniosek «подать заявление», wniosek o urlop «заявление на отпуск»." }
  - { kind: usage, text: "В основе беглое e: wniosek, но wniosku, wnioskiem, wnioski." }
collocations:
  - { pl: "dojść do wniosku", ru: "прийти к выводу" }
  - { pl: "wyciągać wnioski", ru: "делать выводы" }
  - { pl: "złożyć wniosek", ru: "подать заявление" }
etymology: "От wnioskować «делать вывод», в основе wnieść «внести». Русское «вывод» построено от «вывести» — та же метафора движения мысли, только с другой приставкой."
memory: "wniosek = «вывод» и «заявление». Главный оборот — dojść do wniosku «прийти к выводу». В основе беглое e: wniosek, но wniosku, wnioskiem."
idioms:
