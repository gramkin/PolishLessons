        ru: "Они видели облако дыма издалека."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Корень этого слова русскому знаком, но прикреплён к другому предмету. CHMURA и «хмурый» восходят к одному праславянскому *xmur-: польский назвал им тучу, русский — лицо и погоду. Отсюда польские chmurny и pochmurny «пасмурный» и наше «хмуриться». Само деление облаков совпадает: тяжёлая тёмная — это CHMURA, то есть туча, а лёгкое белое — OBŁOK, облако." }
  - { kind: pronunciation, text: "Дательный и предложный — CHMURZE, с привычным уже переходом r в rz. Начальное ch читается как русское «х», без всякого придыхания: «хму́ра». Родительный множественного — CHMUR, без окончания." }
collocations:
  - { pl: "ciemne chmury", ru: "тёмные тучи" }
  - { pl: "chmura deszczowa", ru: "дождевая туча" }
  - { pl: "chmura pyłu", ru: "облако пыли" }
family:
  - { pl: "chmurny", ru: "хмурый, пасмурный", relation: derived }
  - { pl: "pochmurny", ru: "пасмурный", relation: derived }
  - { pl: "zachmurzenie", ru: "облачность", relation: derived }
etymology: "Из праславянского *xmura, того же корня, что русские «хмурый» и «хмуриться». Исходный образ — потемнение, затягивание тьмой, и каждый язык приложил его к своему: поляки к небу, русские к лицу. Связь легко проверить на производных: польское pochmurny описывает погоду ровно так же, как наше «хмурый день»."
memory: "chmura — это туча, а корень тот же, что в «хмуром». Лёгкое белое облако называется obłok."
idioms:
  - { pl: "czarne chmury nad kimś", ru: "тучи над кем-то сгущаются" }
  - { pl: "chmura burzowa", ru: "грозовая туча" }
