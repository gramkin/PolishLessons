# review
id: ulatwic
format: 2
lemma: "ułatwić"
rank: 2038
pos: verb
aspect: perf
pron: { cyr: "ууа́твиць" }
senses:
  - id: facilitate
    ru: "облегчить, сделать легче"
    examples:
      - pl: "Zawsze starała się ułatwić im życie."
        ru: "Она всегда старалась облегчить им жизнь."
        source: { kind: translated, id: 14018619 }
      - pl: "Zrobię, co mogę, żeby ci to ułatwić."
        ru: "Я сделаю что смогу, чтобы тебе это облегчить."
        source: { kind: translated, id: 9663588 }
      - pl: "Telefon komórkowy powinien ułatwić kontakt z innymi ludźmi."
        ru: "Мобильный телефон должен облегчать связь с другими людьми."
        source: { kind: translated, id: 2246530 }
  - id: simplify
    ru: "упростить (работу, задачу)"
    examples:
      - pl: "Rozwój edytorów tekstu ułatwił nam pisanie po japońsku."
        ru: "Развитие текстовых редакторов облегчило нам письмо по-японски."
        source: { kind: translated, id: 6306729 }
      - pl: "Elektroniczne sprzęty ułatwiły prace domowe."
        ru: "Электроприборы облегчили домашнюю работу."
        source: { kind: translated, id: 4834160 }
notes:
  - { kind: government, text: "Дательный плюс винительный: ułatwić komuś coś «облегчить кому-л. что-л.» — как в русском." }
  - { kind: usage, text: "Несовершенный вид — ułatwiać." }
  - { kind: false-friend, text: "Корень łatwy «лёгкий, нетрудный». Антоним — utrudnić «затруднить»." }
  - { kind: usage, text: "ułatwić sobie życie «облегчить себе жизнь» — очень частый оборот." }
collocations:
  - { pl: "ułatwić życie", ru: "облегчить жизнь" }
  - { pl: "ułatwić zadanie", ru: "облегчить задачу" }
etymology: "u- + łatwy «лёгкий»; русское «облегчить» образовано от «лёгкий» тем же способом."
memory: "ułatwić — «облегчить», от łatwy «лёгкий», как русское «облегчить» от «лёгкий». Антоним utrudnić «затруднить», несовершенный вид ułatwiać."
idioms:
  - { pl: "ułatwić sobie życie", ru: "облегчить себе жизнь" }
