notes:
  - { kind: false-friend, text: "Русская «посылка» это только пакет или ящик. Польская PRZESYŁKA покрывает любое почтовое отправление: PRZESYŁKA LISTOWA это письмо, PRZESYŁKA POLECONA — заказное письмо, PRZESYŁKA KURIERSKA — курьерская доставка. То есть на польской почте PRZESYŁKA это общее слово, а если нужна именно посылка, ящик, её называют PACZKA. Спросив о PRZESYŁKA, вы спросите обо всём сразу." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: PRZESYŁKA, но W PRZESYŁCE. В родительном множественного появляется беглое E: PRZESYŁEK. Главное сочетание — PRZESYŁKA POLECONA, и именно его спрашивают на почте, когда нужна расписка получателя." }
  - { kind: government, text: "Получить посылку — ODEBRAĆ PRZESYŁKĘ, винительный без предлога. Стоимость пересылки — KOSZT PRZESYŁKI, родительный. За пересылку — ZA PRZESYŁKĘ, предлог ZA с винительным, и так пишут в объявлениях: CENA PLUS KOSZT PRZESYŁKI. В отправлении — W PRZESYŁCE, местный с переходом K в C." }
  - { kind: pronunciation, text: "Читается «пшэсы́ука», четыре слога, ударение на предпоследнем. Сочетание PRZ даёт «пш», без всякого «р». Буква Y даёт «ы», а Ł — «у», поэтому третий слог это «сы», а четвёртый начинается с «у». В форме PRZESYŁCE сочетание ŁC даёт «уц»: «пшэсы́уце»." }
  - { kind: register, text: "Слово почтовое и торговое. На почте пишут PRZESYŁKA POLECONA и PRZESYŁKA PRIORYTETOWA, в интернет-торговле — KOSZT PRZESYŁKI, и это первое, что ищут в объявлении. Глагол того же гнезда, PRZESŁAĆ, значит «переслать» и годится и для посылки, и для письма, и для файла." }
