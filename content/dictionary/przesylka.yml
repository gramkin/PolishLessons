etymology: "От глагола PRZESŁAĆ, от приставки PRZE- и корня SŁAĆ «слать», праславянского и того же, что русские «слать» и «посылать». Русская «посылка» собрана из того же корня, только с приставкой «по-», а польская с PRZE-. Отсюда и разница в широте: наше слово закрепилось за ящиком, польское осталось при всяком пересылании, от письма до файла."
memory: "Любое почтовое отправление, а не только посылка: przesylka listowa это письмо, а ящик называется paczka. Слово собрано как наша «посылка», от того же корня slac, только с приставкой prze- вместо «по-». Читается «пшэсы́ука», где prz даёт «пш», а l со штрихом — «у». Главное сочетание — przesylka polecona, «заказное письмо»."
idioms:
  - { pl: "przesyłka polecona", ru: "заказное письмо" }
