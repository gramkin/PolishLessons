        source: { kind: translated, id: 357883 }
      - pl: "Nauczycielka zachęca dzieci do czytania."
        ru: "Учительница поощряет детей читать."
        source: { kind: authored }
  - id: invite
    ru: "приглашать, призывать (в объявлениях, рекламе, советах)"
    examples:
      - pl: "Zachęcamy do zadawania pytań."
        ru: "Приглашаем задавать вопросы."
        source: { kind: translated, id: 11573333 }
      - pl: "Organizacje zdrowotne od dawna zachęcają do ograniczenia spożycia mięsa."
        ru: "Организации здравоохранения давно призывают ограничить потребление мяса."
        source: { kind: translated, id: 960958 }
  - id: attract
    ru: "располагать, манить (о цене, погоде, обстановке)"
    examples:
      - pl: "Niska cena zachęca do zakupu."
        ru: "Низкая цена побуждает к покупке."
        source: { kind: authored }
      - pl: "Pogoda nie zachęcała do spaceru."
        ru: "Погода не располагала к прогулке."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZACHĘCAĆ похоже на русское «захотеть», но это не «захотеть». Корень CHĘĆ «охота, желание», и ZACHĘCAĆ значит «вызывать охоту у другого»: поощрять, подбадривать, приглашать. «Захотеть» по-польски ZECHCIEĆ, а «захотелось» — ZACHCIAŁO SIĘ." }
  - { kind: government, text: "Кого — винительный, к чему — DO + родительный: ZACHĘCAĆ DZIECI DO CZYTANIA «поощрять детей читать». Русское «побуждать к» берёт дательный, польское DO — родительный. Часто действие выражено отглагольным существительным: DO NAUKI, DO ZADAWANIA PYTAŃ." }
  - { kind: usage, text: "Несовершенный вид, спряжение на -AM: ZACHĘCAM, ZACHĘCASZ, ZACHĘCAJĄ; совершенный — ZACHĘCIĆ. Противоположность — ZNIECHĘCAĆ «отбивать охоту». Формула объявлений ZACHĘCAMY DO… значит «приглашаем…, предлагаем…». Причастие ZACHĘCAJĄCY стало прилагательным «обнадёживающий, привлекательный»: ZACHĘCAJĄCE WYNIKI, ZACHĘCAJĄCA CENA. Существительное — ZACHĘTA «поощрение, стимул»." }
  - { kind: pronunciation, text: "Читается «захэ́нцаць»: CH — «х», Ę перед C звучит как «эн», конечное Ć — мягкое «ць». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "zachęcać do nauki", ru: "поощрять к учёбе" }
  - { pl: "gorąco zachęcamy", ru: "горячо приглашаем" }
  - { pl: "zachęcające wyniki", ru: "обнадёживающие результаты" }
  - { pl: "zachęcająca cena", ru: "привлекательная цена" }
family:
  - { pl: "zachęcić", ru: "поощрить, побудить", relation: aspect }
  - { pl: "chęć", ru: "охота, желание", relation: root, id: chec }
  - { pl: "zachęta", ru: "поощрение, стимул", relation: derived }
  - { pl: "zniechęcać", ru: "отбивать охоту", relation: antonym, id: zniechecac }
etymology: "Приставка ZA- и корень CHĘĆ «охота, желание», от CHCIEĆ «хотеть»: буквально «вызывать охоту». Корень родственен русскому «хотеть»."
memory: "Za + chęć: zachęcać — «вызывать у кого-то охоту», поощрять. Zachęcamy do… — «приглашаем…» в любом объявлении. Противоположность — zniechęcać."
idioms:
  - { pl: "gorąco zachęcać", ru: "горячо призывать, настоятельно советовать" }
  - { pl: "zachęcać kogoś do działania", ru: "подталкивать кого-то к действию" }
