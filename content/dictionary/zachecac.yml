# review
id: zachecac
format: 2
lemma: "zachęcać"
rank: 5948
pos: verb
aspect: imperf
pron: { cyr: "захэ́нцаць" }
senses:
  - id: encourage
    ru: "поощрять, побуждать, подбадривать (kogoś do czegoś)"
    examples:
      - pl: "Ojciec zachęcał mnie do nauki gry na fortepianie."
