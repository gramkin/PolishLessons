# review
id: potrafic
format: 2
lemma: "potrafić"
rank: 353
pos: verb
aspect: imperf
pron: { cyr: "потра́фиць" }
senses:
  - id: can
    ru: "уметь, быть в состоянии"
    examples:
      - pl: "Potrafisz gwizdać?"
        ru: "Ты умеешь свистеть?"
        source: { kind: tatoeba, id: 2406022 }
      - pl: "Nie potrafię kłamać."
        ru: "Я не умею врать."
        source: { kind: tatoeba, id: 13830838 }
      - pl: "Czy Tom potrafi pływać?"
        ru: "Том умеет плавать?"
        source: { kind: tatoeba, id: 10698023 }
  - id: manage
    ru: "смочь, суметь, справиться"
    examples:
      - pl: "Nie potrafi się nawet podpisać."
        ru: "Он даже расписаться не может."
        source: { kind: tatoeba, id: 351492 }
      - pl: "Potrafią łowić ryby."
        ru: "Они умеют ловить рыбу."
        source: { kind: tatoeba, id: 12470073 }
      - pl: "Czy naprawdę potrafisz pływać?"
        ru: "Ты правда умеешь плавать?"
        source: { kind: tatoeba, id: 2145194 }
notes:
  - { kind: usage, text: "За potrafić идёт инфинитив, без всякого предлога: Potrafisz gwizdać? «Ты умеешь свистеть?»" }
  - { kind: usage, text: "umieć и potrafić оба переводятся «уметь». umieć — о выученном навыке (umiem po polsku), potrafić — о том, справитесь ли вы здесь и сейчас (nie potrafię tego wyjaśnić «я не могу это объяснить»)." }
  - { kind: usage, text: "jak potrafi — «как умеет, как может»: Biegła najszybciej jak potrafiła «Она бежала так быстро, как могла»." }
  - { kind: usage, text: "Глагол двувидовый: Nie potrafię значит «я не умею» (несов.), а Potrafił to zrobić — «он сумел это сделать» (сов.). Отдельной пары у него нет." }
collocations:
  - { pl: "nie potrafię", ru: "я не умею, я не могу" }
  - { pl: "jak potrafi", ru: "как умеет" }
  - { pl: "potrafić sobie poradzić", ru: "суметь справиться" }
etymology: "Из po- + trafić «попасть, угодить» (trafić — заимствование из немецкого treffen). Суметь — значит попасть в цель."
memory: "potrafić — «уметь, суметь», и внутри сидит trafić «попасть»: суметь значит попасть в цель. Пара к umieć: umieć о выученном навыке, potrafić о том, справитесь ли вы. За обоими идёт инфинитив."
idioms:
  - { pl: "jak potrafi", ru: "как умеет" }
  - { pl: "jak najlepiej potrafi", ru: "как только может" }
  - { pl: "nie potrafię się oprzeć", ru: "не могу устоять" }
