notes:
  - { kind: false-friend, text: "Всё зависит от слова STAN, а оно в польском значит сразу несколько вещей, и ни одна не совпадает с русским «станом». STAN это «состояние» (STAN ZDROWIA «состояние здоровья», STAN WOJENNY «военное положение»), «штат» в американском смысле (STAN NOWY JORK), а в исторических текстах — «сословие» (STANY SEJMUJĄCE). Русский «стан» означает лагерь или торс, и по-польски это OBÓZ или TALIA. Отсюда и прилагательное: STANOWY чаще всего «относящийся к штату» — PRAWO STANOWE, POLICJA STANOWA, — а в исторических работах «сословный». Отдельно запомните URZĄD STANU CYWILNEGO: это ЗАГС, и STAN CYWILNY значит «семейное положение», а не гражданское состояние в русском смысле." }
  - { kind: usage, text: "Прилагательное относительное, степеней сравнения не образует, отсюда одиннадцать форм. Мужской личный именительный множественного — STANOWI, и у этой формы есть опасный двойник: STANOWI — это ещё и третье лицо единственного числа от глагола STANOWIĆ «составлять, представлять собой». TO STANOWI PROBLEM значит «это составляет проблему», и здесь STANOWI — глагол. Различает их только построение фразы: если рядом стоит существительное во множественном числе, которое с ним согласуется, это прилагательное (URZĘDNICY STANOWI), а если есть подлежащее в единственном и дополнение, это глагол." }
  - { kind: government, text: "Согласуется с существительным в роде, числе и падеже. Частотные сочетания: PRAWO STANOWE «законы штата», SĄD STANOWY «суд штата», POLICJA STANOWA «полиция штата», GRANICA STANOWA «граница штата», WYBORY STANOWE «выборы в штате». В исторических текстах: SEJM STANOWY, PRZYWILEJE STANOWE «сословные привилегии». Для противопоставления федеральному уровню употребляется пара STANOWY и FEDERALNY, и она переводится на русский как «штата» и «федеральный», то есть по-русски первое слово передаётся родительным падежом существительного, а не прилагательным." }
  - { kind: pronunciation, text: "Читается «стано́вы», три слога, ударение на предпоследнем. Оба O произносятся полно: первый слог звучит «ста», второй «но», без редукции. Конечное -WY это «вы», с «ы», а не «и». В форме STANOWI конечное -I мягкое, и предшествующее W смягчается: «стано́ви». В форме STANOWĄ носовое Ą даёт «он»: «стано́вон». Корневое STAN звучит точно как русский «стан», и именно это сходство сбивает с толку, потому что значения разные." }
