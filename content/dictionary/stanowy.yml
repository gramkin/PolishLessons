etymology: "От STAN, из праславянского *stanъ «стояние, место стояния», от корня *stati «стать». Тот же корень дал русские «стан», «стоянка», «стать», «состояние», и исходный образ один: то, в чём или где нечто стоит. Дальше языки разошлись в выборе значений. Польский развил у слова отвлечённое «состояние» и взял его же для перевода английского STATE в политическом смысле, получив «штат», а в старом сословном строе STAN означал сословие — положение, в котором человек стоит в обществе. Русский отвлечённое значение отдал приставочному «состоянию», а за «станом» оставил лагерь и телосложение. Суффикс -OWY образует относительные прилагательные от существительных, как в SPORTOWY и PORANNY, и русскому отвечает в -ОВЫЙ, хотя в этом случае перевод чаще идёт не прилагательным, а родительным падежом."
memory: "Всё решает stan: по-польски это «состояние», «штат» и, в истории, «сословие» — а русский «стан» это obóz или talia. Поэтому stanowy это «штата» (prawo stanowe, policja stanowa) или «сословный». Запомнить: stan wojenny — «военное положение», stan cywilny — «семейное положение», urząd stanu cywilnego — ЗАГС. Форма stanowi двусмысленна: это и мужской личный множественного, и третье лицо от stanowić «составлять»."
