etymology: "Через латинское TIGRIS из греческого ΤΊΓΡΙΣ, а то, по-видимому, из иранского источника, где слово значило «быстрый, стремительный». Польский взял латинскую форму целиком, вместе с окончанием именительного падежа -S, и получил TYGRYS; русский отбросил окончание и получил «тигр», опираясь, вероятно, на немецкое TIGER. Такое расхождение у двух языков встречается постоянно в словах классического происхождения: польский склонен сохранять конечный согласный латинского именительного, русский — отбрасывать его и строить основу заново. Отсюда же, из газетного языка, переносное употребление: PAPIEROWY TYGRYS как калька английского PAPER TIGER, и AZJATYCKIE TYGRYSY о быстро растущих экономиках — оба оборота в русский пришли тем же путём и в то же время."
memory: "Оба языка взяли слово из латинского tigris, но польский сохранил окончание -s, а русский его отбросил: tygrys против «тигра». Писать «tygr» нельзя. Оба Y читаются «ы»: «ты́грыс». Животное — одушевлённое не-лицо, поэтому в единственном винительный равен родительному: widział tygrysa. Во множественном tygrysy и для именительного, и для винительного. Местный смягчает s: tygrysie."
