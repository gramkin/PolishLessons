notes:
  - { kind: false-friend, text: "Значение то же, что у русского «тигра», но форма слова другая, и разница показательна. Оба языка взяли слово из латыни, где зверь назывался TIGRIS, но польский сохранил латинское окончание -S и получил TYGRYS, а русский его отбросил и получил «тигр». Поэтому написать «tygr» по-польски нельзя, как нельзя сказать «тигрис» по-русски. То же расхождение в целом ряде слов на латинское -IS и греческое -OS: польский обычно оставляет конечный согласный там, где русский его убирает. Женская форма — TYGRYSICA «тигрица», уменьшительная — TYGRYSEK. Прилагательное TYGRYSI значит «тигровый»: TYGRYSIE PASY «тигровые полосы»." }
  - { kind: government, text: "Мужской род, одушевлённое не-лицо (m2), как и все названия животных. Поэтому винительный равен родительному: WIDZIAŁ TYGRYSA, а не «widział tygrys». Именительный множественного TYGRYSY, родительный TYGRYSÓW. Местный единственного TYGRYSIE, с мягким S перед -IE. Частотные сочетания: TYGRYS BENGALSKI «бенгальский тигр», TYGRYS SYBERYJSKI «амурский тигр» (буквально «сибирский»), PAPIEROWY TYGRYS «бумажный тигр», AZJATYCKIE TYGRYSY «азиатские тигры» об экономиках. Последние два оборота в обоих языках пришли из газетного языка двадцатого века." }
  - { kind: usage, text: "Склонение простое, без чередований в основе, и это делает слово удобным образцом для всего типа одушевлённых не-лиц. Единственное, что стоит заметить: местный падеж TYGRYSIE смягчает S, потому что окончание -IE требует мягкости, и в произношении это слышно отчётливо. Во множественном никаких беглых гласных не появляется: TYGRYSÓW, а не «tygrysek». Форма TYGRYSY покрывает и именительный, и винительный множественного, потому что для животных во множественном винительный совпадает с именительным, а не с родительным — только в единственном числе работает правило acc равно gen." }
  - { kind: pronunciation, text: "Читается «ты́грыс», два слога, ударение на первом. Оба Y дают «ы», и это важно: слово звучит «тыгрыс», а не «тигрис». Конечное S глухое и ясное. В местном падеже TYGRYSIE сочетание SIE даёт мягкое «се»: «тыгры́се», три слога, и ударение сдвигается на предпоследний. В родительном TYGRYSA слышно «тыгры́са». Ударение в польском всегда на предпоследнем слоге, поэтому оно перемещается само, по мере удлинения формы." }
