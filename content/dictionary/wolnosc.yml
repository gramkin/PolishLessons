# review
id: wolnosc
format: 2
lemma: "wolność"
rank: 1102
pos: noun
pron: { cyr: "во́лносьць" }
senses:
  - id: freedom
    ru: "свобода, воля"
    examples:
      - pl: "Za wolność się płaci."
        ru: "За свободу нужно платить."
        source: { kind: tatoeba, id: 567095 }
      - pl: "Oni walczą o wolność."
        ru: "Они борются за свободу."
        source: { kind: tatoeba, id: 3655771 }
      - pl: "Musimy szanować indywidualną wolność."
        ru: "Мы должны уважать свободу личности."
        source: { kind: tatoeba, id: 365322 }
  - id: release
    ru: "wyjść na wolność — выйти на свободу (из заключения)"
    examples:
      - pl: "Podejrzany pozostaje na wolności."
        ru: "Подозреваемый остаётся на свободе."
        source: { kind: tatoeba, id: 3677187 }
      - pl: "Wyszedł na wolność po dziesięciu latach."
        ru: "Он вышел на свободу через десять лет."
        source: { kind: authored }
  - id: right
    ru: "свобода как право: wolność słowa «свобода слова»"
    examples:
      - pl: "Każdy ma prawo do wolności osobistej."
        ru: "Каждый имеет право на личную свободу."
        source: { kind: tatoeba, id: 4453627 }
      - pl: "Wolność słowa jest zapisana w konstytucji."
        ru: "Свобода слова записана в конституции."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Женский род на -ość, как русские слова на -ость: ta wolność, tej wolności. Родительный и предложный совпадают — wolności." }
  - { kind: government, text: "walczyć o wolność «бороться за свободу» — предлог o с винительным падежом; prawo do wolności «право на свободу» — предлог do с родительным, а не «на», как в русском." }
  - { kind: false-friend, text: "wolność значит «свобода», а не «вольность». И помните про родственное wolny: у него два значения — «свободный» и «медленный»." }
  - { kind: usage, text: "wyjść na wolność «выйти на свободу» и być na wolności «быть на свободе» — устойчивые обороты о заключении." }
collocations:
  - { pl: "wolność słowa", ru: "свобода слова" }
  - { pl: "wyjść na wolność", ru: "выйти на свободу" }
  - { pl: "walczyć o wolność", ru: "бороться за свободу" }
  - { pl: "Statua Wolności", ru: "Статуя Свободы" }
family:
  - { pl: "wolny", ru: "свободный", relation: root, id: wolny }
  - { pl: "uwolnić", ru: "освободить", relation: derived }
  - { pl: "niewola", ru: "неволя, плен", relation: antonym }
etymology: "От wolny «свободный» плюс суффикс -ość, ровно как русская «вольность» от «вольного». Корень тот же, что в русских «воля» и «вольный»."
memory: "wolność — «свобода», женский род: ta wolność. Борются за неё walczyć o wolność (предлог o с винительным), а выходят на неё wyjść na wolność. Родительный и предложный — одна форма wolności."
idioms:
  - { pl: "za wolność waszą i naszą", ru: "за вашу и нашу свободу" }
  - { pl: "wyjść na wolność", ru: "выйти на свободу" }
