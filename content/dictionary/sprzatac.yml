      - pl: "Sprzątaj po sobie."
        ru: "Убирай за собой."
        source: { kind: authored }
  - id: clear-away
    ru: "убирать (со стола, уносить)"
    examples:
      - pl: "Sprzątała ze stołu po kolacji."
        ru: "Она убирала со стола после ужина."
        source: { kind: authored }
      - pl: "Sprzątanie zajęło całe popołudnie."
        ru: "Уборка заняла весь день после обеда."
        source: { kind: authored }
  - id: clean-for-pay
    ru: "работать уборщицей, убирать"
    examples:
      - pl: "Sprząta w biurze trzy razy w tygodniu."
        ru: "Она убирает в офисе три раза в неделю."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЗВУЧИТ КАК «СПРЯТАТЬ», А ЗНАЧИТ «УБИРАТЬ». И это не случайное сходство: оба слова из праславянского *prętati «прибирать, укладывать». Русский увёл его к «спрятать, скрыть», польский — к «навести порядок». Спрятать по-польски будет SCHOWAĆ или UKRYĆ, и путать эти глаголы опасно: sprzątnąć ze stołu значит убрать со стола, а не припрятать." }
  - { kind: usage, text: "Русское «опрятный» сохранило как раз польский смысл того же корня — приведённый в порядок. Запомни пару заодно с профессией: SPRZĄTACZKA — «уборщица», и это обычное нейтральное слово. Убирать со стола — sprzątać ZE STOŁU, с предлогом z и родительным." }
  - { kind: usage, text: "Вид несовершенный, и формы это показывают. Есть SPRZĄTAJĄC «убирая» и причастие SPRZĄTAJĄCY «убирающий», а деепричастия на -wszy нет вовсе. Совершенная пара — POSPRZĄTAĆ, и у неё наоборот: есть posprzątawszy, а форм на -ąc и -ący нет." }
collocations:
  - { pl: "sprzątać mieszkanie", ru: "убирать квартиру" }
  - { pl: "sprzątać ze stołu", ru: "убирать со стола" }
  - { pl: "sprzątać po sobie", ru: "убирать за собой" }
family:
  - { pl: "posprzątać", ru: "убрать (сов.)", relation: aspect }
  - { pl: "sprzątaczka", ru: "уборщица", relation: derived }
  - { pl: "brudzić", ru: "грязнить", relation: antonym }
etymology: "Приставка s- и przątać, из праславянского *prętati «прибирать, укладывать». Тот же корень дал русские «прятать» и «опрятный»: первое ушло к сокрытию, второе сохранило смысл порядка, который и остался в польском. Отсюда sprzątaczka и porządek."
memory: "sprzątać — «убирать», хотя звучит как «спрятать». Корень и правда общий, но польский оставил смысл порядка — как русское «опрятный». Спрятать будет schować. Несовершенный вид: sprzątając есть, sprzątawszy нет."
idioms:
  - { pl: "sprzątać po kimś", ru: "убирать за кем-л." }
  - { pl: "sprzątać ze stołu", ru: "убирать со стола" }
formExamplesSkip:
  - { form: "sprzątani", reason: "Мужско-личная форма страдательного причастия образуется по общему правилу, но глагол управляет названиями помещений и предметов, а не лиц: убирают комнату, двор, со стола, но не человека. Подлежащего, с которым эта форма могла бы согласоваться, в языке не возникает." }
