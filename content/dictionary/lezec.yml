# review
id: lezec
format: 2
lemma: "leżeć"
rank: 787
pos: verb
aspect: imperf
pron: { cyr: "ле́жець" }
senses:
  - id: lie
    ru: "лежать"
    examples:
      - pl: "Tom leży w łóżku."
        ru: "Том лежит в постели."
        source: { kind: tatoeba, id: 8768452 }
      - pl: "Klucz leży na stole."
        ru: "Ключ лежит на столе."
        source: { kind: tatoeba, id: 1925937 }
      - pl: "Leżę na moim łóżku."
        ru: "Я лежу на своей кровати."
        source: { kind: translated, id: 6157533 }
  - id: in-bed
    ru: "leżeć w łóżku — лежать в постели"
    examples:
      - pl: "Musiał leżeć w łóżku."
        ru: "Ему пришлось лежать в постели."
        source: { kind: translated, id: 450809 }
      - pl: "Nie możesz leżeć w łóżku."
        ru: "Тебе нельзя лежать в постели."
        source: { kind: translated, id: 744077 }
      - pl: "Leżałem w łóżku z grypą."
        ru: "Я лежал в постели с гриппом."
        source: { kind: translated, id: 933063 }
  - id: fit
    ru: "dobrze leżeć — хорошо сидеть (об одежде)"
    note: "Поляк говорит «лежит» там, где русский — «сидит»."
    examples:
      - pl: "Czy dobrze leżą?"
        ru: "Хорошо сидят?"
        source: { kind: translated, id: 1133620 }
      - pl: "Ta marynarka dobrze na tobie leży."
        ru: "Этот пиджак хорошо на тебе сидит."
        source: { kind: authored }
      - pl: "Spodnie źle leżą w pasie."
        ru: "Брюки плохо сидят в поясе."
        source: { kind: authored }
  - id: lie-on
    ru: "leżeć na stole — лежать на столе"
    examples:
      - pl: "Na stole leżało dużo pieniędzy."
        ru: "На столе лежало много денег."
        source: { kind: tatoeba, id: 8658899 }
      - pl: "Na półkach leżały bele aksamitu."
        ru: "На полках лежали кипы бархата."
        source: { kind: tatoeba, id: 6155819 }
      - pl: "Jezioro leżało tuż obok jego domu."
        ru: "Озеро лежало совсем рядом с его домом."
        source: { kind: translated, id: 533671 }
notes:
  - { kind: false-friend, text: "Об одежде поляк говорит leżeć «лежать» там, где русский говорит «сидеть»: Ta marynarka dobrze leży «Этот пиджак хорошо сидит», Czy dobrze leżą? «Хорошо сидят?» — про брюки или туфли." }
  - { kind: government, text: "leżeć NA czymś и leżeć W czymś — оба с предложным падежом: leżeć na stole, leżeć na plecach, leżeć w łóżku." }
  - { kind: usage, text: "Идиомы: leżeć do góry brzuchem «лежать кверху брюхом, бездельничать», leżeć na sercu «лежать на сердце, заботить», leżeć odłogiem «лежать без дела»." }
  - { kind: usage, text: "Не путайте leżeć «лежать» (состояние) и położyć «положить» (действие) — пара устроена как русская «лежать — положить». Родня: łóżko «кровать», łoże «ложе», leżak «шезлонг»." }
collocations:
  - { pl: "leżeć w łóżku", ru: "лежать в постели" }
  - { pl: "leżeć na stole", ru: "лежать на столе" }
  - { pl: "dobrze leżeć", ru: "хорошо сидеть" }
  - { pl: "leżeć na plecach", ru: "лежать на спине" }
family:
  - { pl: "łóżko", ru: "кровать", relation: derived }
  - { pl: "łoże", ru: "ложе", relation: derived }
  - { pl: "położyć", ru: "положить", relation: root }
  - { pl: "leżak", ru: "шезлонг", relation: derived }
etymology: "Праславянское *ležati — то же слово, что русское «лежать»; отсюда же łóżko «кровать» и łoże «ложе»."
memory: "leżeć — «лежать», слово то же самое. Главное отличие всплывает в разговоре об одежде: поляк говорит Ta marynarka dobrze leży — буквально «пиджак хорошо лежит» — там, где русский скажет «хорошо сидит». И возьмите две идиомы: leżeć do góry brzuchem «лежать кверху брюхом» и leżeć na sercu «лежать на сердце, заботить»."
idioms:
  - { pl: "dobrze leżeć", ru: "хорошо сидеть (об одежде)" }
  - { pl: "leżeć do góry brzuchem", ru: "лежать кверху брюхом" }
  - { pl: "leżeć na sercu", ru: "лежать на сердце" }
formExamplesSkip:
  - { form: "leżano", reason: "безличной формы у этого глагола нет: лежат сами, безличное «лежалось» не употребляется" }
