# review
id: oznaczac
format: 2
lemma: "oznaczać"
rank: 483
pos: verb
aspect: imperf
pron: { cyr: "озна́чаць" }
senses:
  - id: mean
    ru: "означать, значить"
    examples:
      - pl: "Co oznacza to słowo?"
        ru: "Что означает это слово?"
        source: { kind: tatoeba, id: 365282 }
      - pl: "Milczenie oznacza zgodę."
        ru: "Молчание — знак согласия."
        source: { kind: tatoeba, id: 528440 }
      - pl: "To nie oznacza nic."
        ru: "Это ничего не значит."
        source: { kind: tatoeba, id: 3416232 }
  - id: mark
    ru: "обозначать, помечать"
    examples:
      - pl: "Czerwone kółka na mapie oznaczają szkoły."
        ru: "Красными кругами на карте обозначены школы."
        source: { kind: tatoeba, id: 1176384 }
      - pl: "Czerwone linie na mapie oznaczają linie kolejowe."
        ru: "Красными линиями на карте показаны железные дороги."
        source: { kind: tatoeba, id: 415287 }
      - pl: "Manhua to chińskie słowo oznaczające komiks."
        ru: "Манхуа — китайское слово, означающее комикс."
        source: { kind: translated, id: 10547740 }
notes:
  - { kind: usage, text: "Внутри сидит znak «знак»: oznaczać построено ровно как русское «обозначать» от «знака»." }
  - { kind: usage, text: "oznaczać и znaczyć почти синонимы, но oznaczać чаще о формальном обозначении: Czerwone kółka oznaczają szkoły «Красные кружки обозначают школы»." }
  - { kind: usage, text: "Milczenie oznacza zgodę — «Молчание — знак согласия», готовая формула." }
  - { kind: usage, text: "Страдательные формы живые и нужны в быту: oznaczany «отмечаемый», а в соцсетях oznaczyć kogoś — «отметить кого-то»." }
collocations:
  - { pl: "co to oznacza?", ru: "что это значит?" }
  - { pl: "milczenie oznacza zgodę", ru: "молчание — знак согласия" }
  - { pl: "oznaczać na mapie", ru: "обозначать на карте" }
  - { pl: "to nic nie oznacza", ru: "это ничего не значит" }
etymology: "Из o- + znaczyć, от znak «знак», праславянское *znakъ. Русское «обозначать» построено по той же модели и от того же корня."
memory: "oznaczać — «означать, обозначать», и внутри него znak «знак», ровно как в русском «обозначать» от «знака». Пара к znaczyć почти синонимична, но oznaczać чаще о формальной пометке: Czerwone kółka oznaczają szkoły. Запомните готовую формулу Milczenie oznacza zgodę «Молчание — знак согласия»."
idioms:
  - { pl: "co to oznacza?", ru: "что это значит?" }
  - { pl: "milczenie oznacza zgodę", ru: "молчание — знак согласия" }
  - { pl: "to nic nie oznacza", ru: "это ничего не значит" }
