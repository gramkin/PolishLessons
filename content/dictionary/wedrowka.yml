# review
id: wedrowka
format: 2
lemma: "wędrówka"
rank: 2113
pos: noun
pron: { cyr: "вэндру́вка" }
senses:
  - id: hike
    ru: "поход, странствие, долгая ходьба"
    examples:
      - pl: "Ta wędrówka męczy mnie."
        ru: "Этот поход меня утомляет."
        source: { kind: translated, id: 2250306 }
      - pl: "Po długiej wędrówce czuję głód."
        ru: "После долгого похода я чувствую голод."
        source: { kind: translated, id: 1205155 }
      - pl: "Po godzinie wędrówki zatrzymali się, by odpocząć."
        ru: "Через час пути они остановились отдохнуть."
        source: { kind: translated, id: 1351254 }
  - id: migration
    ru: "странствие, миграция"
    examples:
      - pl: "Wędrówka ptaków zaczyna się jesienią."
        ru: "Перелёт птиц начинается осенью."
        source: { kind: authored }
      - pl: "To była długa wędrówka przez góry."
        ru: "Это было долгое странствие через горы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "И туристический поход, и странствие вообще, и миграция животных: wędrówka ptaków «перелёт птиц»." }
  - { kind: false-friend, text: "Корень wędrować «странствовать», из немецкого wandern. Русское «вандровать» встречается в западных говорах." }
  - { kind: government, text: "Женский род; чередование ó/o в корне: wędrówka, но wędrówek." }
  - { kind: usage, text: "Рядом стоят wędrowiec «странник» и wędrowny «кочевой, перелётный»." }
collocations:
  - { pl: "wędrówka ptaków", ru: "перелёт птиц" }
  - { pl: "długa wędrówka", ru: "долгий поход" }
etymology: "От wędrować «странствовать», из немецкого wandern; ср. русское диалектное «вандровать»."
memory: "wędrówka — «поход, странствие», а о птицах «перелёт». Корень немецкий: wandern. Чередование ó/o: wędrówka, но wędrówek."
