etymology: "Праславянское *bolь — то же слово, что русская «боль». Разошёлся только род: в польском оно мужское, ten ból."
memory: "ból — «боль», но мужского рода: ten ból, silny ból, z bólu. Запомните ból głowy «головная боль» с родительным и то, что чаще скажут Boli mnie głowa."
