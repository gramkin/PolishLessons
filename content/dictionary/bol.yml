notes:
  - { kind: false-friend, text: "Род не совпадает: польское ból мужского рода (ten ból, silny ból), а русское «боль» женского. Сказать «ta ból» нельзя." }
  - { kind: usage, text: "ból głowy «головная боль», ból zęba «зубная боль» — с родительным падежом, буквально «боль головы, боль зуба»." }
  - { kind: usage, text: "Два способа сказать одно: Mam ból głowy «У меня головная боль» и Boli mnie głowa «У меня болит голова». Второй в живой речи чаще." }
  - { kind: usage, text: "Множественное bóle значит «боли»: Mam silne bóle «У меня сильные боли». Родительный множественного в живой речи — bóli." }
collocations:
  - { pl: "ból głowy", ru: "головная боль" }
  - { pl: "ból zęba", ru: "зубная боль" }
  - { pl: "z bólu", ru: "от боли" }
  - { pl: "silny ból", ru: "сильная боль" }
family:
  - { pl: "boleć", ru: "болеть", relation: root, id: bolec }
