etymology: "От ASYSTENT, через немецкое ASSISTENT из латинского ASSISTENS, причастия глагола ASSISTERE «стоять рядом, присутствовать», сложенного из AD «к» и SISTERE «ставить». Буквально ассистент — «стоящий при». Женская форма образована польским суффиксом -KA, тем же, что в STUDENTKA и NAUCZYCIELKA, и восходящим к праславянскому *-ъka; русский знает его в «студентке» и «ассистентке» в той же роли. Склонение при этом чисто польское и показывает два обычных хода основ на -KA: перед окончанием -E заднее K смягчается в C, отсюда ASYSTENTCE, как MATKA даёт MATCE; а в родительном множественного появляется беглая гласная E, разбивающая скопление TK, отсюда ASYSTENTEK, как MATEK и CÓREK. Русский вставляет гласную в тех же местах: «ассистенток», «матерей» по другой схеме, но «кошек», «марок» по той же."
memory: "Польский образует женские названия профессий на -ka свободно и нейтрально: asystentka, studentka, dyrektorka — в отличие от русского, где многие такие формы звучат разговорно. Одно s: польский не удваивает согласные в заимствованиях (adres, klasa). Y читается «ы»: «асыстэ́нтка». Дательный и местный asystentce с k→c, как matka/matce; родительный множественного asystentek с беглой e, как matek."
