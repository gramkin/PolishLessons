notes:
  - { kind: usage, text: "Женские названия профессий польский образует суффиксом -KA свободно и без всякого оттенка: ASYSTENT даёт ASYSTENTKA, STUDENT — STUDENTKA, NAUCZYCIEL — NAUCZYCIELKA, DYREKTOR — DYREKTORKA. Это нормальные, нейтральные слова, и в объявлении о работе или в документе они обычны. Русский тут осторожнее: «ассистентка» и «студентка» в порядке, но многие названия в женском роде звучат разговорно или пренебрежительно, и о женщине часто говорят мужским словом — «она врач», «она директор». По-польски так сказать можно, но женская форма предпочтительнее и нисколько не снижает тона. Это различие в привычке, а не в грамматике, и учащемуся стоит знать, что польская форма на -KA безопасна." }
  - { kind: government, text: "Женский род. Чья ассистентка или чего — родительный: ASYSTENTKA DYREKTORA, ASYSTENTKA PROFESORA. Кем стала — творительный при ZOSTAĆ и BYĆ: ZOSTAŁA ASYSTENTKĄ, JEST ASYSTENTKĄ. Частотные глаголы: PRZYJĄĆ ASYSTENTKĘ «принять ассистентку», ZATRUDNIĆ ASYSTENTKĘ «нанять ассистентку», POWIERZYĆ ASYSTENTCE «доверить ассистентке» — последнее требует дательного. Мужское соответствие ASYSTENT, уменьшительных форм слово не образует." }
  - { kind: pronunciation, text: "Читается «асысте́нтка», четыре слога, ударение на предпоследнем. Оба Y дают «ы», и это слышно: не «асистентка», а «асыстэнтка». Буква E звучит «э» без смягчения предшествующего согласного. В дательном и местном ASYSTENTCE сочетание TC произносится как два согласных подряд, «тц», без вставной гласной: «асыстэ́нтце». В родительном множественного ASYSTENTEK вставная E даёт «э»: «асыстэ́нтэк»." }
  - { kind: false-friend, text: "Значение совпадает с русской «ассистенткой», но написание расходится, и расхождение регулярное. Польский пишет одно S там, где русский удваивает: ASYSTENTKA против «ассистентки», как ADRES против «адреса» и KLASA против «класса». Правило общее — польский почти не удваивает согласные в заимствованиях, — и, зная его, можно переносить слова в обе стороны, добавляя или снимая удвоение. Второе: буква Y в польском это «ы», а не «и», поэтому ASYSTENT читается «асыстэнт». Не путайте слово с ASYSTA «свита, сопровождение» и с глаголом ASYSTOWAĆ «сопровождать, присутствовать при чём-то»." }
