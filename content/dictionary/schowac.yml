      - pl: "Gdzie schowałeś moje okulary?"
        ru: "Куда ты спрятал мои очки?"
        source: { kind: authored }
  - id: put-away
    ru: "убрать, положить на место"
    examples:
      - pl: "Schowaj telefon, jesteśmy w teatrze."
        ru: "Убери телефон, мы в театре."
        source: { kind: authored }
      - pl: "Schowajcie zabawki do pudła."
        ru: "Уберите игрушки в коробку."
        source: { kind: authored }
  - id: hiding
    ru: "schowanie — укрытие, припрятывание"
    examples:
      - pl: "Schowanie takiej sumy nie jest łatwe."
        ru: "Спрятать такую сумму непросто."
        source: { kind: authored }
      - pl: "Schowanie dowodów było błędem."
        ru: "Сокрытие доказательств было ошибкой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень слову русский глаз узнаёт не сразу, но родство есть: chować отвечает украинскому «ховати» и русскому областному «ховать», праславянское *xovati, откуда и «схоронить». Внимание: простое chować в польском значит сразу три вещи — «прятать», «хранить» и «воспитывать» (chować dzieci), а также «погребать». Приставка s- оставляет только «спрятать»." }
  - { kind: government, text: "Куда прячут — предлог do с РОДИТЕЛЬНЫМ: schować do kieszeni, do szuflady, do sejfu. Где спрятано — w с предложным: schowany w szufladzie. Русский здесь расходится: по-русски «спрятать в карман» (винительный), по-польски только schować do kieszeni." }
  - { kind: usage, text: "Глагол совершенного вида, поэтому schowam, schowasz, schowa значат будущее время. Несовершенная пара — chować. Возвратное schować się значит «спрятаться» и имеет свою парадигму с się." }
collocations:
  - { pl: "schować do kieszeni", ru: "спрятать в карман" }
  - { pl: "schować głowę w piasek", ru: "спрятать голову в песок" }
  - { pl: "dobrze schowany", ru: "хорошо спрятанный" }
family:
  - { pl: "chować", ru: "прятать; хранить; воспитывать", relation: aspect }
  - { pl: "schowek", ru: "тайник; бардачок", relation: derived }
  - { pl: "przechować", ru: "сохранить, сберечь", relation: derived }
etymology: "Приставка s- плюс chować, праславянское *xovati «хранить, прятать». Ближайшие родственники — украинское «ховати» и русское областное «ховать», а также «схоронить». Любопытно, что польское chować удержало и значение «растить, воспитывать» (chować dzieci), которое в русском ушло к слову «холить»."
memory: "schować — «спрятать», от chować, то есть «ховать». Запомните управление: прячут do kieszeni (родительный с do), а не «в карман» в винительном, как по-русски."
idioms:
  - { pl: "schować głowę w piasek", ru: "спрятать голову в песок" }
  - { pl: "schować dumę do kieszeni", ru: "спрятать гордость в карман" }
