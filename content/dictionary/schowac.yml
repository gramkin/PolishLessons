senses:
  - id: hide
    ru: "спрятать (что-л., кого-л.)"
    examples:
      - pl: "Schował klucz pod wycieraczką."
        ru: "Он спрятал ключ под коврик."
        source: { kind: authored }
      - pl: "Schowani w stodole mężczyźni czekali do rana."
        ru: "Спрятанные в сарае мужчины ждали до утра."
