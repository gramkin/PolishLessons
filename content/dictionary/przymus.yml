# review
id: przymus
format: 2
lemma: "przymus"
rank: 5883
pos: noun
pron: { cyr: "пшы́мус" }
senses:
  - id: coercion
    ru: "принуждение"
    examples:
      - pl: "Zeznania złożył pod przymusem."
        ru: "Показания он дал под принуждением."
        source: { kind: authored }
      - pl: "Nikt nie powinien pracować pod przymusem."
        ru: "Никто не должен работать по принуждению."
        source: { kind: authored }
      - pl: "Rodzice nie stosowali wobec nas przymusu."
        ru: "Родители не применяли к нам принуждения."
        source: { kind: authored }
  - id: urge
    ru: "внутренняя потребность, навязчивое желание"
    note: "z przymusem — «через силу, натянуто»"
    examples:
      - pl: "Czuł wewnętrzny przymus, żeby wszystko sprawdzić."
        ru: "Он чувствовал внутреннюю потребность всё проверить."
        source: { kind: authored }
      - pl: "Uśmiechała się do gości z przymusem."
        ru: "Она натянуто улыбалась гостям."
        source: { kind: authored }
  - id: legal
    ru: "обязательность (по закону)"
    examples:
      - pl: "W Sądzie Najwyższym obowiązuje przymus adwokacki."
        ru: "В Верховном суде обязательно представительство адвоката."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Z PRZYMUSU и POD PRZYMUSEM — «по принуждению, из-под палки». Но Z PRZYMUSEM — «через силу, натянуто»: UŚMIECHAĆ SIĘ Z PRZYMUSEM — натянуто улыбаться." }
  - { kind: usage, text: "Мужской род, неодушевлённый: родительный PRZYMUSU, винительный равен именительному. Множественное PRZYMUSY — в языке психологов «навязчивости, компульсии»." }
  - { kind: usage, text: "Прилагательное PRZYMUSOWY — «принудительный, вынужденный»: PRZYMUSOWE LĄDOWANIE — вынужденная посадка, PRACA PRZYMUSOWA — принудительный труд." }
  - { kind: pronunciation, text: "PRZ читается «пш»: RZ после глухого P оглушается. «Пшы́мус», ударение на первом слоге." }
collocations:
  - { pl: "pod przymusem", ru: "под принуждением" }
  - { pl: "z przymusu", ru: "по принуждению, поневоле" }
  - { pl: "wewnętrzny przymus", ru: "внутренняя потребность" }
  - { pl: "przymus adwokacki", ru: "обязательное участие адвоката" }
family:
  - { pl: "zmusić", ru: "заставить", relation: root, id: zmusic }
  - { pl: "zmuszać", ru: "заставлять", relation: root, id: zmuszac }
  - { pl: "przymusić", ru: "принудить", relation: derived }
  - { pl: "przymusowy", ru: "принудительный", relation: derived }
  - { pl: "musieć", ru: "быть должным", relation: root }
synonyms: ["presja", "nacisk", "konieczność"]
etymology: "От глагола PRZYMUSIĆ «принудить»; корень MUS- тот же, что в MUSIEĆ «быть должным»."
memory: "Przymus — то, что ты MUSISZ: принуждение. Pod przymusem — под принуждением, z przymusem — через силу."
idioms:
  - { pl: "robić coś pod przymusem", ru: "делать что-то из-под палки" }
  - { pl: "robić coś z przymusu", ru: "делать что-то поневоле" }
formExamples:
  - { form: "przymus", pl: "Przymus nigdy nie buduje prawdziwej przyjaźni.", ru: "Принуждение никогда не создаёт настоящей дружбы.", source: { kind: authored } }
  - { form: "przymus", pl: "Praca to nie tylko przymus, to też przyjemność.", ru: "Работа — это не только принуждение, но и удовольствие.", source: { kind: translated, id: 773045 } }
  - { form: "przymus", pl: "Władza stosowała wobec chłopów przymus.", ru: "Власть применяла к крестьянам принуждение.", source: { kind: authored } }
  - { form: "przymusach", pl: "W książce pisze o przymusach i lękach.", ru: "В книге он пишет о навязчивостях и страхах.", source: { kind: authored } }
  - { form: "przymusach", pl: "Psycholog mówił o przymusach, z którymi walczą pacjenci.", ru: "Психолог говорил о навязчивостях, с которыми борются пациенты.", source: { kind: authored } }
  - { form: "przymusach", pl: "Opowiadała o swoich dziecięcych przymusach.", ru: "Она рассказывала о своих детских навязчивых привычках.", source: { kind: authored } }
