etymology: "От WSTĘP, а то от WSTĄPIĆ «вступить», из приставки W- и STĄPIĆ «ступить», от праславянского корня, давшего русские «ступить», «вступить», «ступень». Устройство совпадает с русским «вступительным» часть в часть. Носовое Ą в WSTĄPIĆ чередуется с Ę в WSTĘP и WSTĘPNY: это обычное польское чередование носовых, то же, что в ZĄB и ZĘBY. Русский потерял носовые вовсе, поэтому у нас везде «у» и «я»."
memory: "Одно польское слово на два русских: wstępny это и «вступительный» (egzamin wstępny), и «предварительный» (wyniki wstępne). Корень тот же, что в «ступить» и «вступить», и wstęp значит разом «вступление» и «вход»: табличка wstęp wolny это «вход свободный». Читается «фстэ́мпны»: w оглушается до «ф» перед s, а ę перед p даёт «эм», а не «эн». Юридическое wstępni это восходящие родственники, против zstępni."
idioms:
  - { pl: "egzamin wstępny", ru: "вступительный экзамен" }
