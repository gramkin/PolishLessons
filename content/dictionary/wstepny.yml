notes:
  - { kind: false-friend, text: "Прилагательное покрывает два русских слова разом: «вступительный» и «предварительный». EGZAMIN WSTĘPNY это вступительный экзамен, а WYNIKI WSTĘPNE это предварительные результаты, и польскому хватает одного слова на оба случая. Стоящее за ним существительное WSTĘP тоже шире русского: это и «вступление» к книге, и «вход» куда-либо. Табличка WSTĘP WOLNY значит «вход свободный», а WSTĘP WZBRONIONY — «вход воспрещён»." }
  - { kind: usage, text: "Одиннадцать форм, относительное прилагательное. Мужско-личная форма множественного числа WSTĘPNI существует и означает не людей на вступительном экзамене, а юридический термин: WSTĘPNI это восходящие родственники, то есть родители, деды и прадеды. Им противопоставлены ZSTĘPNI, нисходящие: дети, внуки. Оборот WSTĘPNI I ZSTĘPNI стоит в гражданском кодексе и в разговорах о наследстве." }
  - { kind: government, text: "До вступительного экзамена — предлог DO с родительным: DO EGZAMINU WSTĘPNEGO. На предварительном этапе — предлог W с местным падежом: W FAZIE WSTĘPNEJ, где русский предпочёл бы «на». Пройти предварительный отбор — PRZEJŚĆ SELEKCJĘ WSTĘPNĄ, винительный без предлога. В устойчивых сочетаниях прилагательное обычно стоит после существительного: WARUNEK WSTĘPNY, BADANIA WSTĘPNE." }
  - { kind: pronunciation, text: "Читается «фстэ́мпны», два слога, ударение на первом. Здесь сразу две польские перемены. Первая: W в начале перед глухим S оглушается и звучит «ф», поэтому слово начинается с «фс», а не с «вс». Вторая: носовое Ę перед губным P даёт не «эн», а «эм», так что середина звучит «тэмп». Вместе получается «фстэ́мпны», что на слух довольно далеко от написания." }
  - { kind: register, text: "Слово нейтральное, из языка учреждений, школы и медицины: EGZAMIN WSTĘPNY, WARUNEK WSTĘPNY «предварительное условие», WYNIKI WSTĘPNE «предварительные результаты», DIAGNOZA WSTĘPNA «предварительный диагноз», POROZUMIENIE WSTĘPNE «предварительное соглашение». В юридических текстах отдельно живёт WSTĘPNI как существительное, о восходящих родственниках, и спутать эти два употребления трудно: их разводит контекст." }
