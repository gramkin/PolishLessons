etymology: "Приставка ZA- плюс BRONIĆ, от праславянского *borniti «защищать, отбивать», а то — от *bornь «бой, защита». Русский развил обе стороны: «оборона» и «оборонять» сохранили защиту, а «брань» ушла сначала в значение битвы, как в «поле брани», и уже оттуда в ругань. Польский закрепил за корнем защиту и оружие: BRONIĆ «защищать», BROŃ «оружие», OBRONA «оборона», OBROŃCA «защитник». Приставочное ZABRONIĆ прошло путь от «отбить, не пустить» к «запретить», и русский знает эту же дорогу по глаголу «возбранять»: «не возбраняется» значит ровно NIE JEST ZABRONIONE."
memory: "Корень тот же, что в «обороне»: bronić «защищать», broń «оружие» — и это русская «брань» в «поле брани». Отсюда zabronić «запретить», буквально «отбить». Русский двойник этой логики — «возбраняется». Главная трудность в управлении: zabronić komuś czegoś, дательный на лицо и родительный на запрещаемое, где русский ставит винительный или инфинитив: zabronił mu palenia «запретил ему курить»."
idioms:
  - { pl: "co nie jest zabronione, jest dozwolone", ru: "что не запрещено, то разрешено" }
formExamplesSkip:
  - { form: "zabronieni", reason: "Форма страдательного причастия мужского лица во множественном числе грамматически не может быть употреблена. Глагол ставит запрещаемое в родительный падеж, а лицо в дательный, поэтому в страдательный оборот обращается только запрещаемое, то есть действие или предмет. Подлежащим при ZABRONIENI пришлось бы сделать мужчин как то, что запрещено, а такого управления у глагола нет. О запрещённых людях по-польски говорят другим словом, ZAKAZANI." }
