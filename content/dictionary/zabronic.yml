notes:
  - { kind: government, text: "Схема расходится с русской в падеже предмета. Польский требует ZABRONIĆ KOMUŚ CZEGOŚ — дательный на лицо и родительный на запрещаемое: ZABRONIŁ MU PALENIA «запретил ему курить», ZABRONIONO NAM WSTĘPU «нам запретили вход». Русский на месте родительного ставит винительный или инфинитив. Второй способ совпадает: ZABRONIĆ KOMUŚ COŚ ROBIĆ, с инфинитивом — ZABRONIŁA IM WYCHODZIĆ. Безличная форма ZABRONIONO строится с тем же родительным: ZABRONIONO PARKOWANIA. Отглагольное существительное в родительном вместо инфинитива — характерная польская черта, и привыкать к ней стоит именно на этом глаголе." }
  - { kind: false-friend, text: "Корень тот же, что в русской «обороне», и это объясняет всё остальное. Польское BRONIĆ значит «защищать, оборонять», а BROŃ — «оружие». Русское «брань» в выражении «поле брани» — то же самое слово, только у нас оно ушло в бой и в ругань, а в польском осталось при оружии. ZABRONIĆ буквально значит «отбить, отгородить», отсюда и «запретить». У русского есть точный двойник этой логики — «возбраняться»: NIE JEST ZABRONIONE и «не возбраняется» устроены совершенно одинаково." }
  - { kind: usage, text: "Несовершенный партнёр — ZABRANIAĆ, с обычным чередованием O и A в корне. Причастие ZABRONIONY давно живёт самостоятельно и встречается на табличках чаще самого глагола: PALENIE ZABRONIONE, WSTĘP ZABRONIONY. Рядом стоит близкое ZAKAZAĆ с существительным ZAKAZ «запрет», и разница между ними невелика: ZAKAZ чаще в официальных знаках, ZABRONIĆ — в живой речи. Пятьдесят две формы написаны, и одна пропущена по грамматической причине, о которой сказано ниже." }
  - { kind: pronunciation, text: "Читается «забро́ничь», три слога, ударение на предпоследнем. Буква R твёрдая и раскатистая, как в русском, и смягчению перед O не поддаётся. Конечное Ć мягкое, «чь». В повелительном наклонении основа смягчается и на письме появляется знак: ZABROŃ звучит «забронь», ZABROŃCIE — «забро́ньче». В причастии ZABRONIONY группа IO даёт «ё»: «забронё́ны»." }
  - { kind: register, text: "Слово нейтральное, но тяготеет к миру правил и объявлений. Самые частые обороты — WSTĘP ZABRONIONY «вход воспрещён», PALENIE ZABRONIONE «курить запрещено», ZABRONIONY CHWYT «запрещённый приём». В быту родители и врачи говорят так же: LEKARZ ZABRONIŁ MI SOLI «врач запретил мне соль». Юридическая поговорка CO NIE JEST ZABRONIONE, JEST DOZWOLONE звучит по-польски ровно так же, как по-русски, и её стоит запомнить целиком." }
