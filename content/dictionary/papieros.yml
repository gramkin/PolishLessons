notes:
  - { kind: government, text: "Мужской неодушевлённый, но в винительном единственного числа ведёт себя как одушевлённый: Masz papierosa? — не papieros. Это обычное для названий сигарет и напитков просторечное склонение." }
  - { kind: usage, text: "przerwa na papierosa «перекур», wypalić papierosa «выкурить сигарету»." }
  - { kind: false-friend, text: "Корень papier «бумага», из латыни; русское «папироса» — то же слово, но в русском оно значит сигарету особого типа, с гильзой." }
  - { kind: usage, text: "Обычное «курить» — palić; palić papierosy «курить сигареты»." }
collocations:
  - { pl: "przerwa na papierosa", ru: "перекур" }
  - { pl: "paczka papierosów", ru: "пачка сигарет" }
etymology: "От papier «бумага», из латинского papyrus; русское «папироса» — то же слово, но значит сигарету с гильзой."
memory: "papieros — «сигарета». Ловушка в винительном: Masz papierosa? с окончанием -a, как у одушевлённых. Запомните przerwa na papierosa «перекур»."
idioms:
  - { pl: "przerwa na papierosa", ru: "перекур" }
