# review
id: starac
format: 2
lemma: "starać"
rank: 490
pos: verb
aspect: imperf
pron: { cyr: "ста́раць" }
senses:
  - id: try
    ru: "стараться, пытаться (starać się + инфинитив)"
    examples:
      - pl: "Musisz bardzo się starać."
        ru: "Нужно очень постараться."
        source: { kind: tatoeba, id: 362868 }
      - pl: "Po prostu staram się być dobrym ojcem."
        ru: "Я просто стараюсь быть хорошим отцом."
        source: { kind: tatoeba, id: 6689527 }
      - pl: "Po prostu staram się być dobrą matką."
        ru: "Я просто стараюсь быть хорошей матерью."
        source: { kind: tatoeba, id: 6689528 }
  - id: apply
    ru: "добиваться, хлопотать о чём-то (starać się o coś)"
    examples:
      - pl: "Staram się o nową pracę."
        ru: "Я добиваюсь новой работы."
        source: { kind: authored }
      - pl: "Starają się o wizę od miesiąca."
        ru: "Они добиваются визы уже месяц."
        source: { kind: authored }
      - pl: "Kandydaci starający się o stypendium składają wniosek."
        ru: "Кандидаты, претендующие на стипендию, подают заявление."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Глагол всегда идёт с się: starać się. Формы без się не существует." }
  - { kind: false-friend, text: "Главная ловушка на письме: stara — это и «старается» (Ona się stara), и «старая» (Ona jest stara). Различает их только się." }
  - { kind: usage, text: "starać się o coś — «добиваться, хлопотать о чём-то»: starać się o pracę «претендовать на работу», starać się o wizę «оформлять визу»." }
  - { kind: usage, text: "Существительное staranie значит «старание, хлопоты», чаще во множественном: jego starania «его старания»." }
collocations:
  - { pl: "starać się o pracę", ru: "добиваться работы" }
  - { pl: "staram się", ru: "я стараюсь" }
  - { pl: "starać się z całych sił", ru: "стараться изо всех сил" }
  - { pl: "staraj się!", ru: "старайся!" }
etymology: "Праславянское *starati sę; русское «стараться» — то же самое слово. Отсюда и существительное staranie «старание, хлопоты»."
memory: "starać się — «стараться», и без się глагол не живёт. Держите в голове письменную ловушку: Ona się stara «Она старается», но Ona jest stara «Она старая» — различает их только się. И помните вторую жизнь глагола: starać się o coś «добиваться чего-то» — starać się o pracę, o wizę, o rękę."
idioms:
  - { pl: "starać się o rękę", ru: "просить руки" }
  - { pl: "starać się ze wszystkich sił", ru: "стараться изо всех сил" }
  - { pl: "kto się stara, ten ma", ru: "кто старается, тот добивается" }
