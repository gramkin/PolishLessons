# review
id: rozkaz
format: 2
lemma: "rozkaz"
rank: 746
pos: noun
pron: { cyr: "ро́скас" }
senses:
  - id: order
    ru: "приказ"
    examples:
      - pl: "Rakieta stała na kosmodromie i czekała na rozkaz z wieży, by wystartować."
        ru: "Ракета стояла на космодроме и ждала приказа диспетчера, чтобы взлететь ввысь."
        source: { kind: tatoeba, id: 2493580 }
      - pl: "To rozkaz!"
        ru: "Это приказ!"
        source: { kind: translated, id: 11586363 }
      - pl: "Moje rozkazy są ostateczne."
        ru: "Мои приказы окончательны."
        source: { kind: translated, id: 725975 }
  - id: yes-sir
    ru: "Rozkaz! — Есть! Слушаюсь!"
    note: "Уставная реплика, а не просто существительное."
    examples:
      - pl: "Rozkaz!"
        ru: "Есть!"
        source: { kind: translated, id: 8607333 }
      - pl: "Rozkaz, panie kapitanie!"
        ru: "Есть, господин капитан!"
        source: { kind: authored }
      - pl: "Tak jest, rozkaz wykonany."
        ru: "Так точно, приказ выполнен."
        source: { kind: authored }
  - id: carry-out
    ru: "wykonywać rozkazy — выполнять приказы"
    examples:
      - pl: "On tylko wykonywał rozkazy."
        ru: "Он лишь выполнял приказы."
        source: { kind: tatoeba, id: 6328156 }
      - pl: "Mam rozkazy."
        ru: "У меня приказ."
        source: { kind: translated, id: 10542378 }
      - pl: "Nie mogę ignorować rozkazów mojego dowódcy."
        ru: "Я не могу игнорировать приказы моего командира."
        source: { kind: translated, id: 4869414 }
  - id: give-orders
    ru: "wydawać rozkazy — отдавать приказы"
    examples:
      - pl: "Ty tu nie wydajesz rozkazów."
        ru: "Ты здесь не отдаёшь приказов."
        source: { kind: translated, id: 11006247 }
      - pl: "Tom nie widzi różnicy między radą a rozkazem."
        ru: "Том не знает разницы между советом и приказом."
        source: { kind: tatoeba, id: 1665935 }
      - pl: "Jego prośby równały się rozkazowi."
        ru: "Его просьбы равнялись приказу."
        source: { kind: translated, id: 418317 }
notes:
  - { kind: usage, text: "Rozkaz! — это уставный ответ, «Есть!» или «Слушаюсь!». Отдельная реплика, которую стоит запомнить целиком." }
  - { kind: government, text: "na rozkaz «по приказу» — с винительным; wydawać rozkazy «отдавать приказы» и wykonywać rozkazy «выполнять приказы» — с винительным; sprzeciwić się rozkazowi «воспротивиться приказу» — с дательным." }
  - { kind: usage, text: "Слово разбирается прозрачно: roz- + kazać «велеть». Русские «приказ» и «указ» — из того же гнезда, от «казать»." }
  - { kind: usage, text: "Отсюда же грамматический термин: tryb rozkazujący значит «повелительное наклонение»." }
collocations:
  - { pl: "wydawać rozkazy", ru: "отдавать приказы" }
  - { pl: "wykonywać rozkazy", ru: "выполнять приказы" }
  - { pl: "na rozkaz", ru: "по приказу" }
  - { pl: "tryb rozkazujący", ru: "повелительное наклонение" }
family:
  - { pl: "kazać", ru: "велеть", relation: root }
  - { pl: "rozkazywać", ru: "приказывать", relation: derived }
  - { pl: "nakaz", ru: "предписание", relation: derived }
  - { pl: "rozkazujący", ru: "повелительный", relation: derived }
etymology: "roz- + kazać «велеть», праславянское *kazati — то же гнездо, что русские «приказ», «указ» и «казать»."
memory: "rozkaz — «приказ», roz- + kazać «велеть», из того же гнезда, что русские «приказ» и «указ». Отдельно запомните реплику Rozkaz! — это уставное «Есть!». И тот же корень даёт грамматический термин: tryb rozkazujący значит «повелительное наклонение»."
idioms:
  - { pl: "Rozkaz!", ru: "Есть! Слушаюсь!" }
  - { pl: "wykonywać rozkazy", ru: "выполнять приказы" }
  - { pl: "na rozkaz", ru: "по приказу" }
formExamplesSkip:
