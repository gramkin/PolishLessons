      - pl: "Kamienicę wyburzono w latach siedemdziesiątych."
        ru: "Дом снесли в семидесятых годах."
        source: { kind: authored }
  - id: knock-down-wall
    ru: "снести, сломать (стену, перегородку при ремонте)"
    examples:
      - pl: "Wyburzyliśmy ścianę między kuchnią a salonem."
        ru: "Мы снесли стену между кухней и гостиной."
        source: { kind: authored }
      - pl: "Bez pozwolenia nie wyburzysz ściany nośnej."
        ru: "Без разрешения несущую стену не снесёшь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYBURZYĆ — «снести» здание или стену, а не «взбурлить» и не «вызвать бурю». Корень BURZYĆ значит «рушить, разрушать». Снос — WYBURZENIE: budynek przeznaczony do wyburzenia «дом, подлежащий сносу»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — WYBURZAĆ. Настоящего времени нет: WYBURZĘ, WYBURZYSZ — это будущее «снесу, снесёшь». Мужско-личное страдательное WYBURZENI в карточку не включено: сносят здания, а не людей." }
  - { kind: government, text: "Что — винительный: WYBURZYĆ DOM, WYBURZYĆ ŚCIANĘ. О сносе часто говорят безлично или в страдательном залоге: WYBURZONO KAMIENICĘ, DOM ZOSTAŁ WYBURZONY." }
  - { kind: pronunciation, text: "Читается «выбу́жыць»: RZ — «ж», после него Y — «ы». Ударение на предпоследнем слоге: WYBURZYŁ — «выбу́жыу»." }
collocations:
  - { pl: "wyburzyć budynek", ru: "снести здание" }
  - { pl: "wyburzyć ścianę", ru: "снести стену" }
  - { pl: "przeznaczony do wyburzenia", ru: "подлежащий сносу" }
family:
  - { pl: "wyburzać", ru: "сносить (здания)", relation: aspect }
  - { pl: "burzyć", ru: "рушить, разрушать", relation: root }
  - { pl: "zburzyć", ru: "разрушить", relation: root }
  - { pl: "burza", ru: "буря, гроза", relation: root, id: burza }
  - { pl: "wyburzenie", ru: "снос (здания)", relation: derived }
etymology: "Приставка WY- «вы-» плюс BURZYĆ «рушить, разрушать», того же корня, что BURZA «буря»."
memory: "Wyburzyć — как буря (burza) вынести дом до основания: wy- «вы-», burzyć «рушить»."
