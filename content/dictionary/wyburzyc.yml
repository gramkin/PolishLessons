# review
id: wyburzyc
format: 2
lemma: "wyburzyć"
rank: 5819
pos: verb
aspect: perf
pron: { cyr: "выбу́жыць" }
senses:
  - id: demolish
    ru: "снести (здание), разрушить до основания"
    examples:
      - pl: "Planujemy wyburzyć nasz dom."
        ru: "Мы планируем снести наш дом."
        source: { kind: translated, id: 3807886 }
      - pl: "Musimy wyburzyć ten dom."
        ru: "Нам нужно снести этот дом."
