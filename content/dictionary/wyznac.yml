formExamples:
  - form: "wyznał"
    pl: "Tom wyznał."
    ru: "Том признался."
    source: { kind: translated, id: 5636905 }
  - form: "wyznał"
    pl: "Wyznał grzechy kapłanowi."
    ru: "Он исповедал грехи священнику."
    source: { kind: translated, id: 970380 }
  - form: "wyznał"
    pl: "Wyznał mi, że ma romans."
    ru: "Он признался мне, что у него роман."
    source: { kind: translated, id: 12713182 }
  - form: "wyznałem"
    pl: "Wyznałem swoje grzechy."
    ru: "Я исповедал свои грехи."
    source: { kind: translated, id: 349381 }
  - form: "wyznałem"
    pl: "Wyznałem jej wszystko."
    ru: "Я признался ей во всём."
    source: { kind: authored }
  - form: "wyznałem"
    pl: "Nigdy tego nie wyznałem."
    ru: "Я никогда в этом не признавался."
    source: { kind: authored }
  - form: "wyznania"
    pl: "Kapłan słuchał jej chrześcijańskiego wyznania wiary."
    ru: "Священник слушал её христианское исповедание веры."
    source: { kind: translated, id: 730568 }
  - form: "wyznania"
    pl: "Każdy człowiek posiada wszystkie prawa i wolności zawarte w niniejszej Deklaracji bez względu na jakiekolwiek różnice rasy, koloru, płci, języka, wyznania, poglądów politycznych i innych, narodowości, pochodzenia społecznego, majątku, urodzenia lub jakiegokolwiek innego stanu."
    ru: "Каждый человек обладает всеми правами и свободами без различия вероисповедания."
    source: { kind: translated, id: 3000021 }
  - form: "wyznania"
    pl: "Wolność wyznania jest zapisana w konstytucji."
    ru: "Свобода вероисповедания записана в конституции."
    source: { kind: authored }
  - form: "wyznany"
    pl: "Wyznany grzech jest w połowie odpuszczony."
    ru: "Исповеданный грех наполовину отпущен."
    source: { kind: translated, id: 12985633 }
  - form: "wyznany"
    pl: "Wyznany błąd łatwiej naprawić."
    ru: "Признанную ошибку легче исправить."
    source: { kind: authored }
  - form: "wyznany"
    pl: "To grzech dawno wyznany."
    ru: "Это давно исповеданный грех."
    source: { kind: authored }
