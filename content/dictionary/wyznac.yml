# review
id: wyznac
format: 2
lemma: "wyznać"
rank: 2898
pos: verb
aspect: perf
pron: { cyr: "вы́знаць" }
senses:
  - id: confess
    ru: "признаться, исповедаться"
    examples:
      - pl: "Tom wyznał."
        ru: "Том признался."
        source: { kind: translated, id: 5636905 }
      - pl: "Wyznał mi, że ma romans."
        ru: "Он признался мне, что у него роман."
        source: { kind: translated, id: 12713182 }
      - pl: "Wyznałem swoje grzechy."
        ru: "Я исповедал свои грехи."
        source: { kind: translated, id: 349381 }
  - id: creed
    ru: "исповедание, вероисповедание (существительное wyznanie)"
    examples:
      - pl: "Kapłan słuchał jej chrześcijańskiego wyznania wiary."
        ru: "Священник слушал её христианское исповедание веры."
        source: { kind: translated, id: 730568 }
      - pl: "Wyznany grzech jest w połowie odpuszczony."
        ru: "Исповеданный грех наполовину отпущен."
        source: { kind: translated, id: 12985633 }
notes:
  - { kind: government, text: "Кому признаются — дательный падеж: wyznał mi «признался мне». В чём — винительный: wyznać grzechy, wyznać prawdę." }
  - { kind: usage, text: "Отглагольное существительное wyznanie значит и «признание», и «вероисповедание»: wolność wyznania «свобода вероисповедания»." }
  - { kind: false-friend, text: "Корень znać «знать» с приставкой wy-: буквально «дать знать наружу». Русское «признаться» построено на том же образе." }
  - { kind: usage, text: "Несовершенный вид — wyznawać, который значит ещё и «исповедовать» религию." }
  - { kind: government, text: "Мужско-личной формы страдательного причастия у глагола нет: признаются кому-то в дательном, а винительным бывает вина или правда. Wyznany grzech при этом обычен." }
collocations:
  - { pl: "wyznać prawdę", ru: "признаться в правде" }
  - { pl: "wolność wyznania", ru: "свобода вероисповедания" }
etymology: "wy- + znać «знать»: буквально «дать знать наружу»; ср. русское «признаться», «сознаться»."
memory: "wyznać — «признаться, исповедаться», кому в дательном. Существительное wyznanie значит и «признание», и «вероисповедание». Несовершенный вид — wyznawać."
idioms:
  - { pl: "wyznać prawdę", ru: "признаться в правде" }
  - { pl: "wolność wyznania", ru: "свобода вероисповедания" }
formExamplesSkip:
  - { form: "wyznani", reason: "человек при этом глаголе стоит в дательном падеже — wyznał mi prawdę, — а винительное дополнение это то, в чём признаются: grzechy, prawdę, miłość. Дательный участник подлежащим страдательного причастия не становится, поэтому мужско-личной формы нет, хотя wyznany grzech и prawda wyznana w porę обычны" }
