# review
id: wyobrazac
format: 2
lemma: "wyobrażać"
rank: 1447
pos: verb
aspect: imperf
aspectPair: wyobrazic
pron: { cyr: "выобра́жаць" }
senses:
  - id: imagine
    ru: "представлять себе, воображать"
    examples:
      - pl: "Dziś nikt nie wyobraża sobie życia bez telewizji."
        ru: "Теперь никто не может представить себе жизнь без телевизора."
        source: { kind: tatoeba, id: 2143082 }
      - pl: "Wyobrażasz sobie świat bez pieniędzy?"
        ru: "Можете ли вы представить мир без денег?"
        source: { kind: tatoeba, id: 362851 }
      - pl: "Nie wyobrażam sobie życia bez ciebie."
        ru: "Я не представляю себе жизни без тебя."
        source: { kind: translated, id: 367730 }
  - id: depict
    ru: "изображать, представлять собой"
    examples:
      - pl: "Ten posąg wyobraża wolność."
        ru: "Эта статуя изображает свободу."
        source: { kind: translated, id: 366785 }
  - id: suppose
    ru: "полагать, думать (в оборотах)"
    examples:
      - pl: "Tak sobie to wyobrażam."
        ru: "Так я себе это и представляю."
        source: { kind: translated, id: 596663 }
      - pl: "Nie wyobrażasz sobie, ile dla nas znaczy twoja pomoc."
        ru: "Ты не представляешь себе, что для нас значит твоя помощь."
        source: { kind: tatoeba, id: 965007 }
notes:
  - { kind: usage, text: "Почти всегда с sobie: wyobrażać sobie «представлять себе». Без sobie глагол значит «изображать, представлять собой»: Ten posąg wyobraża wolność." }
  - { kind: usage, text: "Несовершенный вид к wyobrazić. Существительное — wyobraźnia «воображение»." }
  - { kind: government, text: "wyobrażać sobie coś (винительный) или целое придаточное: Nie wyobrażam sobie życia bez ciebie." }
  - { kind: false-friend, text: "Nie wyobrażam sobie — это нейтральное «Я не представляю себе», без оттенка фантазёрства, который есть у русского «воображать»." }
collocations:
  - { pl: "wyobrażać sobie", ru: "представлять себе" }
  - { pl: "nie wyobrażam sobie", ru: "не представляю себе" }
  - { pl: "wyobraź sobie", ru: "представь себе" }
etymology: "Приставка wy- и obraz «образ, картина» (праславянское *obrazъ). Русское «воображать» собрано из тех же частей — «в-» плюс «образ»."
memory: "wyobrażać — «представлять себе», почти всегда с sobie: Nie wyobrażam sobie życia bez ciebie. Без sobie значит «изображать»: posąg wyobraża wolność. Корень — obraz «образ», как в русском «воображать»."
idioms:
