formExamples:
  - form: "wyobraża"
    pl: "Ten posąg wyobraża wolność."
    ru: "Эта статуя изображает свободу."
    source: { kind: translated, id: 366785 }
  - form: "wyobraża"
    pl: "On wyobraża sobie wszystko co tylko możliwe."
    ru: "Он воображает себе всё что только возможно."
    source: { kind: translated, id: 7893876 }
  - form: "wyobraża"
    pl: "Dziś nikt nie wyobraża sobie życia bez telewizji."
    ru: "Теперь никто не может представить себе жизнь без телевизора."
    source: { kind: tatoeba, id: 2143082 }
  - form: "wyobrażał"
    pl: "Tom nigdy nie wyobrażał sobie, że będzie mógł dostać się na Harvard."
    ru: "Том никогда не представлял себе, что сможет попасть в Гарвард."
    source: { kind: translated, id: 3838611 }
  - form: "wyobrażał"
    pl: "Wyobrażał sobie inne życie."
    ru: "Он представлял себе другую жизнь."
    source: { kind: authored }
  - form: "wyobrażał"
    pl: "Nie wyobrażał sobie porażki."
    ru: "Он не представлял себе поражения."
    source: { kind: authored }
  - form: "wyobrażałem"
    pl: "Wyobrażałem go sobie jako wysokiego wzrostu."
    ru: "Я представлял его себе высокого роста."
    source: { kind: translated, id: 1829488 }
  - form: "wyobrażałem"
    pl: "Wyobrażałem sobie, że mój pierwszy pocałunek będzie bardziej romantyczny."
    ru: "Я представлял себе, что мой первый поцелуй будет романтичнее."
    source: { kind: translated, id: 611670 }
  - form: "wyobrażałem"
    pl: "Nigdy nie wyobrażałem sobie, że my kiedyś dojdziemy do takiego końca."
    ru: "Я никогда не представлял себе, что мы когда-нибудь придём к такому концу."
    source: { kind: translated, id: 2199672 }
  - form: "wyobrażam"
    pl: "Nie wyobrażam sobie życia bez ciebie."
    ru: "Я не представляю себе жизни без тебя."
    source: { kind: translated, id: 367730 }
  - form: "wyobrażam"
    pl: "Tak sobie to wyobrażam."
    ru: "Так я себе это и представляю."
    source: { kind: translated, id: 596663 }
  - form: "wyobrażam"
    pl: "Wyobrażam sobie wiele pięknych rzeczy."
    ru: "Я представляю себе много красивых вещей."
    source: { kind: translated, id: 12004856 }
  - form: "wyobrażamy"
    pl: "Wyobrażamy sobie przyszłość inaczej."
    ru: "Мы представляем себе будущее иначе."
    source: { kind: authored }
  - form: "wyobrażamy"
    pl: "Nie wyobrażamy sobie życia bez muzyki."
    ru: "Мы не представляем себе жизни без музыки."
    source: { kind: authored }
  - form: "wyobrażamy"
    pl: "Często wyobrażamy sobie najgorsze."
    ru: "Мы часто представляем себе худшее."
    source: { kind: authored }
  - form: "wyobrażania"
    pl: "Uczy się wyobrażania sobie liczb."
    ru: "Он учится представлять себе числа."
    source: { kind: authored }
  - form: "wyobrażania"
    pl: "To kwestia wyobrażania sobie skutków."
    ru: "Это вопрос представления последствий."
    source: { kind: authored }
  - form: "wyobrażania"
    pl: "Bez wyobrażania sobie celu trudno działać."
    ru: "Не представляя себе цели, трудно действовать."
    source: { kind: authored }
  - form: "wyobrażasz"
    pl: "Wyobrażasz sobie świat bez pieniędzy?"
    ru: "Можете ли вы представить мир без денег?"
    source: { kind: tatoeba, id: 362851 }
  - form: "wyobrażasz"
    pl: "Nie wyobrażasz sobie, ile dla nas znaczy twoja pomoc."
    ru: "Ты не представляешь себе, что для нас значит твоя помощь."
    source: { kind: tatoeba, id: 965007 }
  - form: "wyobrażasz"
    pl: "Wyobrażasz to sobie?"
    ru: "Ты себе это представляешь?"
    source: { kind: translated, id: 1637747 }
