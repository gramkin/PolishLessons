# review
id: bardziej
format: 2
lemma: "bardziej"
rank: 254
pos: adv
pron: { cyr: "ба́рдзей" }
senses:
  - id: more
    ru: "больше, более (при сравнении)"
    examples:
      - pl: "Mleko lubię bardziej, niż sok."
        ru: "Я больше люблю молоко, чем сок."
        source: { kind: tatoeba, id: 554245 }
      - pl: "Kocham cię bardziej niż ty mnie."
        ru: "Я люблю тебя больше, чем ты меня."
        source: { kind: tatoeba, id: 1077712 }
      - pl: "Bardziej boję się ich niż ciebie."
        ru: "Я больше боюсь их, чем тебя."
        source: { kind: tatoeba, id: 973220 }
  - id: analytic
    ru: "более (перед длинными прилагательными и наречиями)"
    note: "bardziej interesujący — как русское «более интересный»."
    examples:
      - pl: "To znacznie bardziej interesujące."
        ru: "Это намного интереснее."
        source: { kind: tatoeba, id: 8428498 }
      - pl: "Podoba mi się coraz bardziej."
        ru: "Мне нравится это все больше и больше."
        source: { kind: tatoeba, id: 2143167 }
      - pl: "Nie jestem bardziej ostrożny niż ty."
        ru: "Я внимателен не более, чем вы."
        source: { kind: tatoeba, id: 10115303 }
notes:
  - { kind: false-friend, text: "Не путайте bardzo «очень» и bardziej «более»: bardzo interesujący «очень интересный», bardziej interesujący «более интересный»." }
  - { kind: usage, text: "Длинные прилагательные образуют сравнительную степень аналитически, как в русском: bardziej skomplikowany «более сложный». Противоположность — mniej «менее»." }
  - { kind: usage, text: "coraz bardziej значит «всё больше и больше»; tym bardziej — «тем более»." }
collocations:
  - { pl: "coraz bardziej", ru: "всё больше" }
  - { pl: "tym bardziej", ru: "тем более" }
  - { pl: "bardziej niż", ru: "больше чем" }
  - { pl: "najbardziej", ru: "больше всего" }
etymology: "Сравнительная степень от bardzo «очень», восходящего к старому bardo «сильно»."
memory: "Ступени: bardzo «очень» — bardziej «более» — najbardziej «больше всего». Для длинных прилагательных так же, как в русском: bardziej interesujący «более интересный»."
idioms:
  - { pl: "coraz bardziej", ru: "всё больше и больше" }
  - { pl: "tym bardziej", ru: "тем более" }
  - { pl: "bardziej niż kiedykolwiek", ru: "больше чем когда-либо" }
