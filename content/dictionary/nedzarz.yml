notes:
  - { kind: usage, text: "NĘDZARZ образован от NĘDZA «нищета» и сильнее, чем BIEDAK «бедняк»: это человек в крайней нужде. Женская форма — NĘDZARKA." }
  - { kind: register, text: "Слово книжное и эмоциональное, частое в литературе и проповедях. В обычной речи о бездомном скажут BEZDOMNY, о бедном — BIEDNY или BIEDAK." }
  - { kind: usage, text: "Мужско-личное существительное: во множественном NĘDZARZE, в родительном и винительном множественного NĘDZARZY и реже NĘDZARZÓW. Звательный совпадает с предложным: NĘDZARZU." }
  - { kind: pronunciation, text: "Ę перед DZ читается как «эн», конечное RZ оглушается: «не́ндзаш»." }
collocations:
  - { pl: "żyć jak nędzarz", ru: "жить как нищий" }
  - { pl: "umrzeć jako nędzarz", ru: "умереть нищим" }
  - { pl: "zrobić z kogoś nędzarza", ru: "разорить кого-то дочиста" }
family:
  - { pl: "nędza", ru: "нищета", relation: root, id: nedza }
  - { pl: "nędzny", ru: "жалкий, убогий", relation: root, id: nedzny }
  - { pl: "nędzarka", ru: "нищенка", relation: derived }
  - { pl: "bogacz", ru: "богач", relation: antonym }
synonyms: ["biedak", "żebrak"]
etymology: "От NĘDZA «нищета», родственного русскому «нужда»; суффикс -ARZ называет человека."
memory: "Nędza — это «нужда», nędzarz — тот, кто живёт в нужде: нищий. Читается «не́ндзаш»."
