senses:
  - id: pauper
    ru: "нищий, бедняк"
    examples:
      - pl: "Nędzarz prosił o kawałek chleba."
        ru: "Нищий просил кусок хлеба."
        source: { kind: authored }
      - pl: "Po wojnie został nędzarzem."
        ru: "После войны он стал нищим."
