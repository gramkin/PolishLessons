# review
id: kilka
format: 2
lemma: "kilka"
rank: 177
pos: num
pron: { cyr: "ки́лька" }
senses:
  - id: several
    ru: "несколько (+ родительный падеж)"
    examples:
      - pl: "Mam kilka piór."
        ru: "У меня есть несколько ручек."
        source: { kind: tatoeba, id: 1215300 }
      - pl: "W koszyku jest kilka jabłek."
        ru: "В корзине лежит несколько яблок."
        source: { kind: tatoeba, id: 351392 }
      - pl: "Mam kilka srebrnych monet."
        ru: "У меня есть несколько серебряных монет."
        source: { kind: tatoeba, id: 10584502 }
  - id: times
    ru: "несколько (о времени и количестве раз)"
    examples:
      - pl: "Spotkałem Toma kilka razy."
        ru: "Я встретил Тома несколько раз."
        source: { kind: tatoeba, id: 8664321 }
      - pl: "Telefon dzwonił kilka razy."
        ru: "Телефон прозвонил несколько раз."
        source: { kind: tatoeba, id: 395328 }
      - pl: "Kilka dni później umarł."
        ru: "Он умер несколькими днями позже."
        source: { kind: tatoeba, id: 13781659 }
notes:
  - { kind: government, text: "kilka требует родительного падежа: kilka książek, kilka dni — как русское «несколько»." }
  - { kind: usage, text: "О мужских лицах — kilku (kilku mężczyzn), о детях и смешанных группах — собирательное kilkoro (kilkoro dzieci)." }
  - { kind: usage, text: "В польском есть слова, которых нет в русском: kilkanaście «больше десяти, но меньше двадцати» и kilkadziesiąt «несколько десятков»." }
collocations:
  - { pl: "kilka razy", ru: "несколько раз" }
  - { pl: "kilka dni", ru: "несколько дней" }
  - { pl: "kilka słów", ru: "несколько слов" }
  - { pl: "co kilka minut", ru: "каждые несколько минут" }
etymology: "Слово образовано так же, как русские «сколько» и «столько», но точное происхождение спорно; прямого соответствия в русском нет."
memory: "kilka + родительный: kilka książek. О мужчинах — kilku, о детях — kilkoro. И запомните kilkanaście «больше десяти»: такого слова в русском просто нет."
idioms:
  - { pl: "kilka razy", ru: "несколько раз" }
  - { pl: "kilka słów", ru: "несколько слов" }
  - { pl: "co kilka minut", ru: "каждые несколько минут" }
formExamplesSkip:
  - { form: "kilko", reason: "форма из морфологического словаря; в языке её нет" }
