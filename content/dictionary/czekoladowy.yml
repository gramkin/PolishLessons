  - { pl: "czekoladziarnia", ru: "шоколадная мастерская, кафе-шоколадница", relation: derived }
etymology: "От CZEKOLADA, которое пришло через немецкое Schokolade и испанское chocolate из науатля, языка ацтеков. Русское «шоколад» шло тем же путём, но через французский, поэтому начинается с «ш». Польское CZ ближе к испанскому произношению CH. Суффикс -OWY — тот же, что в DOMOWY и OWOCOWY, и делает из любого существительного прилагательное «из чего-то»."
memory: "Czekoladowy — шоколадный. Пишется через cz и o: czekolada, не «шоколада». Tort czekoladowy, lody czekoladowe. Для людей формы нет: шоколадными бывают торты и зайцы."
