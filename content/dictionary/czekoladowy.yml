notes:
  - { kind: false-friend, text: "Ловушки в значении нет: CZEKOLADOWY — это «шоколадный», и в прямом, и в цветовом смысле. Ловушка в написании. Русское «ш» здесь польское CZ: CZEKOLADA, а не SZOKOLADA. И O после L, а не A: CZEKOLADA, хотя русский ударный слог «ла» тянет написать иначе. Шоколадная плитка — TABLICZKA CZEKOLADY, а не CZEKOLADOWA TABLICZKA." }
  - { kind: usage, text: "Относительное прилагательное: степеней сравнения у него нет, бывает только «из шоколада» или «цвета шоколада». Форма для мужчин-людей CZEKOLADOWI здесь не используется: шоколадными бывают торты, конфеты и зайцы, но не люди, поэтому в карточке десять форм. Шоколадные фигурки солдатиков — CZEKOLADOWE ŻOŁNIERZYKI, с неличной формой." }
  - { kind: government, text: "Прилагательное обычно стоит после существительного, когда называет сорт: TORT CZEKOLADOWY, LODY CZEKOLADOWE, KREM CZEKOLADOWY. Перед существительным — когда оценивает или описывает: CZEKOLADOWY ZAJĄC, CZEKOLADOWE OCZY. С шоколадом — Z CZEKOLADĄ, творительный: CIASTKO Z CZEKOLADĄ." }
  - { kind: pronunciation, text: "Читается «чэколадо́вы», пять слогов, ударение на предпоследнем. CZ даёт твёрдое «ч», за ним твёрдое «э». L обычная, перед гласной «л». Конечная Y — «ы». В форме CZEKOLADOWEGO ударение уходит вперёд: «чэколадовэ́го»." }
  - { kind: register, text: "Нейтральное повседневное слово, его видно на каждой упаковке и в каждом меню кафе. В описании внешности CZEKOLADOWE OCZY, «шоколадные глаза», звучит ласково и немного литературно, так пишут в романах и в песнях." }
