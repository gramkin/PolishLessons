# review
id: zaprzeczac
format: 2
lemma: "zaprzeczać"
rank: 3698
pos: verb
pron: { cyr: "запшэ́чаць" }
senses:
  - id: deny
    ru: "отрицать, опровергать (+ дательный)"
    examples:
      - pl: "Minister zaprzecza plotkom."
        ru: "Министр опровергает слухи."
        source: { kind: authored }
      - pl: "Nie zaprzeczam, że popełniłem błąd."
        ru: "Я не отрицаю, что совершил ошибку."
        source: { kind: authored }
      - pl: "Oskarżony zaprzecza wszystkiemu."
        ru: "Обвиняемый всё отрицает."
        source: { kind: authored }
  - id: contradict
    ru: "противоречить (фактам, себе)"
    examples:
      - pl: "Te dane zaprzeczają twojej teorii."
        ru: "Эти данные противоречат твоей теории."
        source: { kind: authored }
      - pl: "Ciągle sam sobie zaprzecza."
        ru: "Он постоянно сам себе противоречит."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZAPRZECZAĆ — «отрицать», но с ДАТЕЛЬНЫМ падежом: ZAPRZECZAĆ PLOTKOM «опровергать слухи», ZAPRZECZAĆ FAKTOM «отрицать факты». По-русски — винительный («отрицать слухи»). Отсюда и вторая ловушка: страдательного причастия у глагола нет, «слухи опровергаются» — PLOTKOM SIĘ ZAPRZECZA." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZAPRZECZYĆ. Спряжение на -AM: ZAPRZECZAM, ZAPRZECZASZ, ZAPRZECZAJĄ. Страдательные причастия в карточку не включены: при дательном управлении их не образуют." }
  - { kind: government, text: "Чему — дательный: ZAPRZECZAĆ OSKARŻENIOM, SOBIE. С придаточным — ŻE или JAKOBY: ZAPRZECZA, JAKOBY BYŁ NA MIEJSCU «отрицает, что был на месте»." }
  - { kind: pronunciation, text: "Читается «запшэ́чаць»: PRZ — «пш», CZ — «ч». Ударение на предпоследнем слоге. ZAPRZECZAM — «запшэ́чам»." }
  - { kind: register, text: "Нейтрально-официальное слово: пресса, суд, политика. В разговоре — MÓWIĆ, ŻE TO NIEPRAWDA." }
collocations:
  - { pl: "zaprzeczać plotkom", ru: "опровергать слухи" }
  - { pl: "zaprzeczać samemu sobie", ru: "противоречить самому себе" }
  - { pl: "nie zaprzeczam", ru: "не отрицаю" }
family:
  - { pl: "zaprzeczyć", ru: "опровергнуть", relation: aspect, id: zaprzeczyc }
  - { pl: "przeczyć", ru: "противоречить", relation: root, id: przeczyc }
  - { pl: "potwierdzać", ru: "подтверждать", relation: antonym, id: potwierdzac }
etymology: "Приставка ZA- плюс PRZECZYĆ «противоречить», от праславянского *perčь «поперёк», как русское «перечить», «вопреки»."
memory: "Zaprzeczać komuś/czemuś — отрицать, с дательным: zaprzecza plotkom. Русское «перечить» — тот же корень."
