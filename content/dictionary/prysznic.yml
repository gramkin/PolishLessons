# review
id: prysznic
format: 2
lemma: "prysznic"
rank: 1654
pos: noun
pron: { cyr: "пры́шниц" }
senses:
  - id: take-shower
    ru: "душ (принимать душ)"
    examples:
      - pl: "Wziąłem prysznic."
        ru: "Я принял душ."
        source: { kind: tatoeba, id: 611568 }
      - pl: "Wezmę prysznic."
        ru: "Я приму душ."
        source: { kind: translated, id: 368984 }
      - pl: "Tom chciał wziąć prysznic."
        ru: "Том хотел принять душ."
        source: { kind: tatoeba, id: 3510120 }
  - id: in-shower
    ru: "душ (место, под душем)"
    examples:
      - pl: "Tom jest pod prysznicem."
        ru: "Том в душе."
        source: { kind: translated, id: 2587239 }
      - pl: "Lubię śpiewać pod prysznicem."
        ru: "Я люблю петь в душе."
        source: { kind: translated, id: 11872142 }
      - pl: "Kiedy byłem pod prysznicem, zadzwonił telefon."
        ru: "Когда я был в душе, зазвонил телефон."
        source: { kind: translated, id: 781277 }
notes:
  - { kind: government, text: "«Принять душ» — wziąć prysznic, винительный падеж: по-русски «принять», по-польски «взять»." }
  - { kind: usage, text: "«В душе, под душем» — pod prysznicem, творительный падеж: śpiewać pod prysznicem «петь в душе»." }
  - { kind: usage, text: "zimny prysznic переносно значит «холодный душ», то есть отрезвляющее разочарование — как в русском." }
  - { kind: usage, text: "Слово немецкое по происхождению, поэтому пишется через -sz-: prysznic, а не prysnic." }
collocations:
  - { pl: "wziąć prysznic", ru: "принять душ" }
  - { pl: "pod prysznicem", ru: "под душем" }
  - { pl: "zimny prysznic", ru: "холодный душ" }
etymology: "Из немецкого Brause через диалектное prysznic; в польский слово пришло как бытовой германизм. Русский «душ» заимствован из французского douche, так что слова не родственны."
memory: "prysznic = «душ», но глагол другой: wziąć prysznic «принять душ», буквально «взять». А «под душем» — pod prysznicem, творительный падеж."
idioms:
  - { pl: "wziąć prysznic", ru: "принять душ" }
  - { pl: "pod prysznicem", ru: "под душем" }
  - { pl: "zimny prysznic", ru: "холодный душ" }
