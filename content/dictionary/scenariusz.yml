# review
id: scenariusz
format: 2
lemma: "scenariusz"
rank: 1987
pos: noun
pron: { cyr: "сцена́рюш" }
senses:
  - id: screenplay
    ru: "сценарий (фильма, спектакля)"
    examples:
      - pl: "Scenariusz filmu napisał debiutant."
        ru: "Сценарий фильма написал дебютант."
        source: { kind: authored }
      - pl: "Pracuje nad scenariuszem od roku."
        ru: "Он работает над сценарием год."
        source: { kind: authored }
      - pl: "W scenariuszu brakowało zakończenia."
        ru: "В сценарии не хватало концовки."
        source: { kind: authored }
  - id: course-of-events
    ru: "сценарий (ход событий, вариант развития)"
    examples:
      - pl: "Czarny scenariusz się nie sprawdził."
        ru: "Чёрный сценарий не оправдался."
        source: { kind: authored }
      - pl: "Rozważano trzy scenariusze."
        ru: "Рассматривали три сценария."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушек нет: слово пришло из итальянского scenario через французский, и в русский — тем же путём, поэтому scenariusz и «сценарий» совпадают и по форме, и по обоим значениям, книжному и переносному. Czarny scenariusz — это ровно русский «чёрный сценарий»." }
  - { kind: usage, text: "ОДНА ОСОБЕННОСТЬ СТОИТ ВНИМАНИЯ: родительный падеж множественного числа имеет ДВА равноправных вида — scenariuszy и scenariuszów. Оба правильны, первый чаще. Так же ведут себя другие существительные на -usz: kapelusz даёт kapeluszy и kapeluszów." }
  - { kind: stress, text: "Ударение, как обычно в польском, на предпоследнем слоге: sce-na-RIUSZ даёт «сцена́рюш». При склонении оно сдвигается вместе с окончанием: scenariusza — «сцена́рюша», scenariuszami — «сценарю́шами»." }
collocations:
  - { pl: "czarny scenariusz", ru: "чёрный сценарий" }
  - { pl: "scenariusz filmu", ru: "сценарий фильма" }
  - { pl: "według scenariusza", ru: "по сценарию" }
family:
  - { pl: "scenarzysta", ru: "сценарист", relation: derived }
  - { pl: "scena", ru: "сцена", relation: root, id: scena }
  - { pl: "scenariuszowy", ru: "сценарный", relation: derived }
etymology: "Из итальянского scenario, производного от латинского scaena «сцена», пришедшего в польский через французский. Русское «сценарий» проделало тот же путь, поэтому слова совпадают. От того же корня scena «сцена» и scenarzysta «сценарист»."
memory: "scenariusz — «сценарий», в обоих значениях сразу: и фильма, и развития событий (czarny scenariusz). Слово заимствованное, расхождений нет. Единственная тонкость: родительный множественного бывает и scenariuszy, и scenariuszów."
idioms:
  - { pl: "czarny scenariusz", ru: "худший вариант развития событий" }
  - { pl: "wszystko poszło według scenariusza", ru: "всё прошло по сценарию" }
