notes:
  - { kind: false-friend, text: "KORONER — «коронер», слово из англоязычных детективов. В Польше такой должности нет: тело исследует BIEGŁY MEDYCYNY SĄDOWEJ, «судмедэксперт», или PATOLOG. Не путайте с KORONA — «корона»." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Множественное — KORONERZY: R переходит в RZ. Местный и звательный — KORONERZE." }
