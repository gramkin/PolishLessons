# review
id: ostrzegac
format: 2
lemma: "ostrzegać"
rank: 2202
pos: verb
pron: { cyr: "остшэга́ць" }
senses:
  - id: warn
    ru: "предупреждать, предостерегать"
    examples:
      - pl: "Ostrzegam cię po raz ostatni."
        ru: "Предупреждаю тебя в последний раз."
        source: { kind: authored }
      - pl: "Synoptycy ostrzegają przed burzami."
        ru: "Синоптики предупреждают о грозах."
        source: { kind: authored }
      - pl: "Ostrzegali nas przed tą drogą."
        ru: "Нас предупреждали об этой дороге."
        source: { kind: authored }
  - id: warning-sign
    ru: "предупреждать (о знаках, надписях)"
    examples:
      - pl: "Tabliczka ostrzega przed psem."
        ru: "Табличка предупреждает о собаке."
        source: { kind: authored }
      - pl: "Znaki ostrzegają przed osuwiskiem."
        ru: "Знаки предупреждают об оползне."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «стеречь»: ostrzegać собрано из o- и strzec, а ближайшее русское слово — «остерегать», из тех же частей. Разница в употреблении: русское «остерегать» звучит книжно, обычное слово там «предупреждать». Польское ostrzegać, наоборот, совершенно обиходное — так говорят синоптики, врачи, дорожные знаки и соседи." }
  - { kind: government, text: "ВНИМАНИЕ НА ПАДЕЖ, ОН ДРУГОЙ. Предупреждают КОГО — винительный: ostrzegać kogoś. О ЧЁМ — przed с ТВОРИТЕЛЬНЫМ: ostrzegać przed burzą, przed oszustem, przed skutkami. Русский ставит здесь «о» с предложным, «предупреждать о грозе», и калька не работает: нужно przed burzą, а не «o burzy»." }
  - { kind: pronunciation, text: "rz после t звучит как ш, так что выходит «остшэга́ць», ударение на предпоследнем слоге. Настоящее время по простейшему правилу: -ać даёт -am и -asz — ostrzegam, ostrzegasz, как czytam и mam." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — ostrzec. Существительное ostrzeżenie значит «предупреждение», а przestroga — «предостережение», более книжное. Возвратное strzec się значит «беречься»: strzeż się! — это «берегись!»." }
collocations:
  - { pl: "ostrzegać przed niebezpieczeństwem", ru: "предупреждать об опасности" }
  - { pl: "ostrzegać kogoś przed kimś", ru: "предостерегать кого-л. от кого-л." }
  - { pl: "znak ostrzegawczy", ru: "предупреждающий знак" }
family:
  - { pl: "ostrzec", ru: "предупредить", relation: aspect, id: ostrzec }
  - { pl: "strzec", ru: "стеречь, беречь", relation: root, id: strzec }
  - { pl: "ostrzeżenie", ru: "предупреждение", relation: derived, id: ostrzezenie }
  - { pl: "stróż", ru: "сторож", relation: derived }
etymology: "Приставка o- плюс strzec «стеречь, беречь», от праславянского корня, давшего русские «стеречь», «сторож» и «остерегать». Русское «остерегать» собрано из тех же двух частей, только с другим гласным в корне. Отсюда ostrzec, ostrzeżenie «предупреждение», strzec się «беречься» и stróż «сторож»."
memory: "ostrzegać — «предупреждать», и корень знакомый: strzec это «стеречь», а ближайшая родня — «остерегать». Главное здесь падеж: ostrzegać kogoś PRZED czymś, с творительным, а не «о чём-то». Ostrzegam cię przed nim."
idioms:
  - { pl: "ostrzegam cię!", ru: "предупреждаю тебя!" }
  - { pl: "ostrzegać przed niebezpieczeństwem", ru: "предупреждать об опасности" }
