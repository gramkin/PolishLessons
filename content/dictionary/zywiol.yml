pron: { cyr: "жы́вёу" }
senses:
  - id: element
    ru: "стихия (огонь, вода, земля, воздух)"
    examples:
      - { pl: "Grecy wyróżniali cztery żywioły: ogień, wodę, ziemię i powietrze.", ru: "Греки выделяли четыре стихии: огонь, воду, землю и воздух.", source: { kind: authored } }
      - { pl: "Ogień to najgroźniejszy z żywiołów.", ru: "Огонь — самая опасная из стихий.", source: { kind: authored } }
  - id: force
    ru: "стихия, разгул природы, стихийное бедствие"
    examples:
      - { pl: "Powódź to żywioł, z którym trudno walczyć.", ru: "Наводнение — стихия, с которой трудно бороться.", source: { kind: authored } }
      - { pl: "Żywioł zniszczył most i drogę.", ru: "Стихия разрушила мост и дорогу.", source: { kind: authored } }
  - id: element-fig
    ru: "(своя) стихия, любимое дело"
    examples:
      - { pl: "Grając w baseball, Tom jest w swoim żywiole.", ru: "Когда Том играет в бейсбол, он в своей стихии.", source: { kind: translated, id: 3233612 } }
      - { pl: "Kuchnia to jej żywioł.", ru: "Кухня — её стихия.", source: { kind: authored } }
notes:
  - { kind: false-friend, text: "ŻYWIOŁ — «стихия», а не что-то «живое». Корень тот же, что в ŻYWY, но значения «живность, животное» у слова нет. Русское «стихия» по-польски почти всегда ŻYWIOŁ." }
  - { kind: usage, text: "Мужской род, неодушевлённое: родительный ŻYWIOŁU, предложный W ŻYWIOLE (Ł переходит в L). BYĆ W SWOIM ŻYWIOLE — быть в своей стихии." }
  - { kind: usage, text: "Прилагательное ŻYWIOŁOWY значит и «стихийный» (KLĘSKA ŻYWIOŁOWA — стихийное бедствие), и «бурный, неудержимый» (ŻYWIOŁOWE OKLASKI — бурные аплодисменты)." }
  - { kind: pronunciation, text: "Ł читается как «у», WIO — «вё»: «жы́вёу». В предложном Ł сменяется обычным L: W ŻYWIOLE — «вжывё́ле»." }
collocations:
  - { pl: "cztery żywioły", ru: "четыре стихии" }
  - { pl: "walka z żywiołem", ru: "борьба со стихией" }
  - { pl: "szalejący żywioł", ru: "бушующая стихия" }
family:
  - { pl: "żywiołowy", ru: "стихийный, бурный", relation: derived }
  - { pl: "żywiołowo", ru: "стихийно, бурно", relation: derived }
  - { pl: "żywy", ru: "живой", relation: root, id: zywy }
etymology: "Того же корня, что ŻYWY «живой» и ŻYCIE «жизнь»: стихия понималась как живая, неуправляемая сила."
memory: "Żywioł — стихия, «живая» сила природы. Być w swoim żywiole — быть в своей стихии."
idioms:
  - { pl: "być w swoim żywiole", ru: "быть в своей стихии" }
