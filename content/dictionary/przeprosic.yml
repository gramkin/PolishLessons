# review
id: przeprosic
format: 2
lemma: "przeprosić"
rank: 1561
pos: verb
aspect: perf
aspectPair: przepraszac
pron: { cyr: "пшэпро́сиць" }
senses:
  - id: apologize
    ru: "извиниться, попросить прощения"
    examples:
      - pl: "Muszę przeprosić."
        ru: "Я должен извиниться."
        source: { kind: translated, id: 8770923 }
      - pl: "Muszę pana przeprosić."
        ru: "Я должен попросить у вас прощения."
        source: { kind: tatoeba, id: 821058 }
      - pl: "Powinieneś przeprosić."
        ru: "Тебе следует извиниться."
        source: { kind: translated, id: 1717300 }
  - id: apologize-for
    ru: "извиниться за что-либо"
    examples:
      - pl: "Przeprosił za spóźnienie."
        ru: "Он извинился за опоздание."
        source: { kind: translated, id: 1626577 }
      - pl: "Przeprosił mnie za niegrzeczność."
        ru: "Он извинился передо мной за грубость."
        source: { kind: translated, id: 734335 }
      - pl: "Tom przeprosił za swoje słowa."
        ru: "Том извинился за свои слова."
        source: { kind: translated, id: 3863293 }
notes:
  - { kind: government, text: "Извиниться перед кем — przeprosić kogoś, винительный падеж и без предлога: przeprosić mamę «извиниться перед мамой». В русском здесь предлог «перед» и творительный." }
  - { kind: government, text: "За что — предлог za с винительным: przeprosić za spóźnienie «извиниться за опоздание»." }
  - { kind: usage, text: "Несовершенный вид — przepraszać, и его форма przepraszam значит «извините, простите» — самое частое вежливое слово в языке." }
  - { kind: usage, text: "Существительное przeprosiny «извинения» употребляется только во множественном числе." }
collocations:
  - { pl: "przeprosić za spóźnienie", ru: "извиниться за опоздание" }
  - { pl: "przeprosić kogoś", ru: "извиниться перед кем-то" }
  - { pl: "szczerze przeprosić", ru: "искренне извиниться" }
etymology: "Приставка prze- + prosić «просить» — буквально «выпросить прощение». Русское «просить прощения» пользуется тем же глаголом, только не сращивает его с приставкой."
memory: "przeprosić = «извиниться», но падеж другой: przeprosić mamę — винительный, а по-русски «извиниться перед мамой». За что — za spóźnienie. Несовершенный вид — przepraszać, отсюда вездесущее przepraszam «извините»."
idioms:
  - { pl: "przeprosić za spóźnienie", ru: "извиниться за опоздание" }
  - { pl: "przepraszam", ru: "извините" }
  - { pl: "za przeproszeniem", ru: "с позволения сказать" }
