# review
id: stac
format: 2
depth: deep
lemma: "stać"
rank: 75
pos: verb
aspect: biaspectual
pron: { cyr: "стаць" }
senses:
  - id: stand
    ru: "стоять"
    examples:
      - pl: "Stoję w cieniu."
        ru: "Я стою в тени."
        source: { kind: tatoeba, id: 1190330 }
      - pl: "W pokoju stoi stół."
        ru: "В комнате стоит стол."
        source: { kind: tatoeba, id: 2116628 }
      - pl: "Możesz stać?"
        ru: "Ты можешь стоять?"
        source: { kind: tatoeba, id: 2406014 }
  - id: become
    ru: "stać się — стать, случиться"
    examples:
      - pl: "Czy coś się stało?"
        ru: "Что-то случилось?"
        source: { kind: tatoeba, id: 565288 }
      - pl: "Stanie się coś okropnego."
        ru: "Случится что-то ужасное."
        source: { kind: tatoeba, id: 3603509 }
notes:
  - { kind: false-friend, text: "В одном слове сошлись два русских глагола: stać «стоять» (stoję, stoisz, stoi) и stać się «стать, случиться» (stanę, stało się)." }
  - { kind: usage, text: "Безличное nie stać mnie na to значит «мне это не по карману»." }
collocations:
  - { pl: "co się stało?", ru: "что случилось?" }
  - { pl: "stać w kolejce", ru: "стоять в очереди" }
  - { pl: "nie stać mnie na to", ru: "мне это не по карману" }
etymology: "Праславянские *stati «стать» и *stojati «стоять» слились в польском в один глагол; русские «стать» и «стоять» сохранили раздельность."
memory: "Одно польское слово покрывает два русских глагола. Настоящее время идёт от «стоять» (stoję, stoisz, stoi), будущее и прошедшее с się — от «стать»: Co się stało? «Что случилось?». И запомните nie stać mnie na to «мне это не по карману»."
idioms:
  - { pl: "co się stało, to się nie odstanie", ru: "что случилось, то случилось" }
  - { pl: "nie stać mnie na to", ru: "мне это не по карману" }
  - { pl: "stać na straży", ru: "стоять на страже" }
formExamplesSkip:
  - { form: "stano", reason: "Безличной формы на -no этот глагол не образует: в живом языке вместо неё употребляются обороты с się, например stało się." }
