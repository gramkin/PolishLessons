family:
  - { pl: "dziś", ru: "сегодня", relation: root, id: dzis }
  - { pl: "dzisiaj", ru: "сегодня", relation: root }
etymology: "От dziś «сегодня», а то из ten + dzień, буквально «этот день». Русское «сегодняшний» собрано так же, от «сего дня»."
memory: "dzisiejszy — «сегодняшний», прилагательное от dziś. Внутри обоих слов сидит одно и то же: «сей день». Запомните оборот w dzisiejszych czasach «в наше время» — он встречается на каждом шагу. О людях слово значит «нынешний»: dzisiejsi lekarze."
idioms:
