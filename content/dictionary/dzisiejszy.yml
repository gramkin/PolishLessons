  - id: nowadays
    ru: "w dzisiejszych czasach — в наше время, нынче"
    note: "Устойчивый оборот, самое частое употребление множественного числа."
    examples:
      - pl: "W dzisiejszych czasach życie bez prądu jest niewyobrażalne."
        ru: "В наше время невозможно себе представить жизнь без электричества."
        source: { kind: tatoeba, id: 5138620 }
      - pl: "Kto pisze listy w dzisiejszych czasach?"
        ru: "Кто нынче пишет письма?"
