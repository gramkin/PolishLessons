        ru: "В наше время цены стабильны."
        source: { kind: translated, id: 10770563 }
  - id: present-day
    ru: "нынешний, современный (о людях и порядках)"
    examples:
      - pl: "Dzisiejsi lekarze nie mają dobrego przygotowania."
        ru: "Сегодняшние врачи плохо подготовлены."
        source: { kind: translated, id: 960727 }
      - pl: "Dzisiejsi policjanci nie mają dobrego przygotowania."
        ru: "Сегодняшние полицейские плохо подготовлены."
        source: { kind: translated, id: 960766 }
      - pl: "Dzisiejsi lekarze nie otrzymują dobrego wykształcenia."
        ru: "Сегодняшние врачи не получают хорошего образования."
        source: { kind: translated, id: 8534214 }
notes:
  - { kind: usage, text: "Прилагательное от dziś «сегодня»: dzisiejsza gazeta «сегодняшняя газета», dzisiejszy kurs «сегодняшний курс»." }
  - { kind: usage, text: "w dzisiejszych czasach — «в наше время, нынче», очень частый оборот: W dzisiejszych czasach ceny są stabilne." }
  - { kind: usage, text: "О людях и порядках слово значит «нынешний, современный»: dzisiejsi lekarze «нынешние врачи»." }
  - { kind: usage, text: "Степеней сравнения у слова нет: оно относительное, как и русское «сегодняшний». Наречие — dziś или dzisiaj." }
collocations:
