# review
id: wyciac
format: 2
lemma: "wyciąć"
rank: 4042
pos: verb
pron: { cyr: "вы́цёнць" }
senses:
  - id: cut-out
    ru: "вырезать"
    examples:
      - pl: "Wyciął zdjęcie z gazety."
        ru: "Он вырезал фотографию из газеты."
        source: { kind: authored }
      - pl: "Wycięła serduszko z papieru."
        ru: "Она вырезала сердечко из бумаги."
        source: { kind: authored }
      - pl: "Chirurg wyciął mu wyrostek."
        ru: "Хирург вырезал ему аппендикс."
        source: { kind: authored }
  - id: fell
    ru: "вырубить (лес, деревья)"
    examples:
      - pl: "Wycięli las pod autostradę."
        ru: "Они вырубили лес под автостраду."
        source: { kind: authored }
      - pl: "Gmina wycięła stare lipy."
        ru: "Община вырубила старые липы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYCIĄĆ — «вырезать», но и «вырубить»: WYCIĄĆ LAS — «вырубить лес». Русское «вырезать» в смысле «перебить всех» — WYMORDOWAĆ или WYRŻNĄĆ. WYCIĄĆ KOMUŚ NUMER — «выкинуть номер», а не «вырезать номер»." }
  - { kind: usage, text: "Пятьдесят три формы, включая WYCIĘCI: людей «вырезают» из фильма или списка: ZOSTALI WYCIĘCI Z LISTY. Будущее на TN-: WYTNĘ, WYTNIESZ, повелительное WYTNIJ. Несовершенный вид — WYCINAĆ, отсюда WYCINANKA «бумажная вырезанка»." }
  - { kind: government, text: "Что — винительный: WYCIĄĆ ARTYKUŁ. Откуда — Z с родительным: WYCIĄĆ Z GAZETY, Z FILMU. Чем — творительный: WYCIĄĆ NOŻYCZKAMI. Кому — дательный: WYCIĄĆ KOMUŚ MIGDAŁKI." }
  - { kind: pronunciation, text: "Читается «вы́цёнць»: CIĄ — «цён», конечное Ć — «ць», ударение на первом слоге. WYTNĘ — «вы́тнэ», WYCIĘTY — «выце́нты»." }
  - { kind: register, text: "Нейтральное слово, бытовое, медицинское и монтажное. WYCIĄĆ KOMUŚ NUMER — разговорное «сыграть злую шутку». В медицине — «удалить»: WYCIĄĆ GUZ." }
collocations:
  - { pl: "wyciąć z gazety", ru: "вырезать из газеты" }
  - { pl: "wyciąć las", ru: "вырубить лес" }
  - { pl: "wyciąć scenę z filmu", ru: "вырезать сцену из фильма" }
family:
  - { pl: "ciąć", ru: "резать", relation: root, id: ciac }
  - { pl: "przeciąć", ru: "перерезать", relation: derived, id: przeciac }
  - { pl: "wycinać", ru: "вырезать (несов.)", relation: aspect }
etymology: "Приставка WY- «вы-» плюс CIĄĆ «резать, рубить», праславянское *tęti, *tьnǫ. Отсюда чередование CIĄĆ и WYTNĘ; в древнерусском был глагол «тяти» «рубить»."
memory: "Wyciąć — вырезать: wyciął zdjęcie. Wyciąć las — вырубить лес. Будущее: wytnę, wytniesz. Читается «вы́цёнць»."
idioms:
  - { pl: "wyciąć komuś numer", ru: "выкинуть номер, сыграть с кем-то злую шутку" }
