# review
id: ludzie
format: 2
lemma: "ludzie"
rank: 402
pos: noun
pron: { cyr: "лю́дзе" }
senses:
  - id: people
    ru: "люди"
    examples:
      - pl: "Ludzie to ludzie."
        ru: "Люди есть люди."
        source: { kind: tatoeba, id: 13715721 }
      - pl: "Ludzie boją się wojny."
        ru: "Люди боятся войны."
        source: { kind: tatoeba, id: 3064084 }
      - pl: "Wszyscy ludzie są równi."
        ru: "Все люди равны."
        source: { kind: tatoeba, id: 822177 }
  - id: crowd
    ru: "люди, народ, окружающие"
    examples:
      - pl: "Na ulicy było wielu ludzi."
        ru: "На улице было много людей."
        source: { kind: tatoeba, id: 3410639 }
      - pl: "Ludzie są nieprzewidywalni."
        ru: "Люди непредсказуемы."
        source: { kind: tatoeba, id: 12470157 }
      - pl: "Można zaufać tym ludziom?"
        ru: "Этим людям можно доверять?"
        source: { kind: tatoeba, id: 10696035 }
notes:
  - { kind: usage, text: "ludzie — супплетивное множественное число к człowiek «человек»: собственного единственного у него нет, ровно как у русского «люди» при «человек»." }
  - { kind: usage, text: "Творительный падеж — ludźmi, с мягким dź: Oni są dobrymi ludźmi «Они хорошие люди»." }
  - { kind: usage, text: "После числительных 2–4 идёт именительный (dwaj ludzie), после пяти и больше — родительный (pięciu ludzi), как и в русском." }
  - { kind: false-friend, text: "Не путайте ludzie «люди» с lud «народ» — это единственное число, собирательное, и от него прилагательное ludowy «народный»." }
collocations:
  - { pl: "młodzi ludzie", ru: "молодые люди" }
  - { pl: "dobrzy ludzie", ru: "хорошие люди" }
  - { pl: "wielu ludzi", ru: "много людей" }
  - { pl: "wśród ludzi", ru: "среди людей" }
etymology: "Праславянское *ljudьje; русское «люди» — то же самое слово. Единственное число — człowiek, от другого корня, и такая же супплетивная пара есть в русском."
memory: "ludzie — «люди», супплетивное множественное к człowiek, точно как русское «люди» при «человек». Запомните мягкое dź в творительном падеже: z ludźmi «с людьми»."
idioms:
  - { pl: "wypadki chodzą po ludziach", ru: "от беды никто не застрахован" }
  - { pl: "ludzie mówią", ru: "люди говорят" }
  - { pl: "wyjść do ludzi", ru: "показаться на людях" }
