  - id: fraction
    ru: "dwie trzecie — две трети"
    note: "Средний род множественного даёт дроби."
    examples:
      - pl: "Dwie trzecie roboty mamy za sobą."
        ru: "Две трети работы позади."
        source: { kind: translated, id: 1846115 }
      - pl: "Zostały nam dwie trzecie drogi."
        ru: "Нам осталось две трети пути."
        source: { kind: authored }
      - pl: "Trzy trzecie to całość."
        ru: "Три трети — это целое."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Порядковое числительное, и склоняется оно как прилагательное: trzeci, trzeciego, trzeciemu, trzecim, trzecich." }
  - { kind: usage, text: "В датах идёт родительный падеж, как и в русском: trzeciego kwietnia «третьего апреля»." }
  - { kind: usage, text: "Средний род во множественном даёт дроби: dwie trzecie «две трети», trzy czwarte «три четверти»." }
  - { kind: usage, text: "Звуковое соответствие регулярное: польское trz- отвечает русскому «тр-» — trzy «три», trzeci «третий»." }
collocations:
  - { pl: "trzecie miejsce", ru: "третье место" }
