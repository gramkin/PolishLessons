  - { pl: "jedna trzecia", ru: "одна треть", relation: derived }
etymology: "Праславянское *tretьjь — то же слово, что русское «третий». Польское trz- регулярно отвечает русскому «тр-»: trzy «три», trzeci «третий»."
memory: "trzeci — «третий», порядковое числительное, и склоняется оно как прилагательное: trzeciego, trzeciemu, trzecim. В датах идёт родительный, как и в русском: trzeciego kwietnia. А средний род во множественном даёт дроби: dwie trzecie «две трети». Звуковое соответствие тут правильное: trz- отвечает русскому «тр-»."
idioms:
