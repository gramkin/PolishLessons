# review
id: naprawiac
format: 2
lemma: "naprawiać"
rank: 4457
pos: verb
pron: { cyr: "напра́вяць" }
senses:
  - id: repair
    ru: "чинить, ремонтировать"
    examples:
      - pl: "Tata naprawia rower w garażu."
        ru: "Папа чинит велосипед в гараже."
        source: { kind: authored }
      - pl: "Ten warsztat naprawia samochody."
        ru: "Эта мастерская ремонтирует машины."
        source: { kind: authored }
      - pl: "Naprawiam zegarki od trzydziestu lat."
        ru: "Я чиню часы уже тридцать лет."
        source: { kind: authored }
  - id: make-good
    ru: "исправлять (ошибку, отношения)"
    examples:
      - pl: "Próbuje naprawiać swoje błędy."
        ru: "Он пытается исправлять свои ошибки."
        source: { kind: authored }
      - pl: "Powoli naprawiamy nasze relacje."
        ru: "Мы постепенно налаживаем наши отношения."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NAPRAWIAĆ — «чинить, ремонтировать», а не «направлять» (KIEROWAĆ, SKIEROWAĆ). Похоже на русское «поправлять», и второе значение действительно близко: NAPRAWIAĆ BŁĘDY «исправлять ошибки». Ремонт — NAPRAWA или REMONT (REMONT — о квартире, здании)." }
  - { kind: usage, text: "Несовершенный вид; совершенный — NAPRAWIĆ. Спряжение на -AM: NAPRAWIAM, NAPRAWIASZ, NAPRAWIAJĄ. Мужско-личное страдательное NAPRAWIANI в карточку не включено: чинят вещи, а не людей." }
  - { kind: government, text: "Что — винительный: NAPRAWIAĆ PRALKĘ. Кому — дательный: NAPRAWIAĆ KOMUŚ SAMOCHÓD. Чем — творительный: NAPRAWIAĆ TAŚMĄ. С отрицанием — родительный: NIE NAPRAWIA ZEGARKÓW." }
  - { kind: pronunciation, text: "Читается «напра́вяць»: WIA — «вя», ударение на предпоследнем слоге. NAPRAWIAM — «напра́вям»." }
  - { kind: register, text: "Нейтральное бытовое слово. О квартире — REMONTOWAĆ, об ошибках — POPRAWIAĆ, NAPRAWIAĆ." }
collocations:
  - { pl: "naprawiać samochody", ru: "ремонтировать машины" }
  - { pl: "naprawiać błędy", ru: "исправлять ошибки" }
  - { pl: "naprawiać relacje", ru: "налаживать отношения" }
family:
  - { pl: "naprawić", ru: "починить", relation: aspect, id: naprawic }
  - { pl: "naprawa", ru: "ремонт, починка", relation: derived, id: naprawa }
  - { pl: "psuć", ru: "портить, ломать", relation: antonym, id: psuc }
etymology: "Приставка NA- плюс PRAWIĆ, от PRAWY «правильный, правый»: «делать снова правильным». Русские «править», «поправлять» — того же корня."
memory: "Naprawiać — чинить: tata naprawia rower. Не «направлять»! Naprawiać błędy — исправлять ошибки."
idioms:
  - { pl: "naprawiać świat", ru: "исправлять мир, бороться за справедливость" }
formExamplesSkip:
  - { form: "naprawiani", reason: "мужско-личная форма: чинят вещи, а не людей" }
