etymology: "От WIARA «вера», из праславянского *věra, того же, что русская «вера». Всё гнездо читается без словаря: WIERZYĆ «верить», WIERNY «верный», WIERNOŚĆ «верность», NIEWIERNY «неверный». Польское WIE- отвечает русскому ВЕ- закономерно, как в WIEK и «век», WIECZÓR и «вечер». Разошлись языки в объёме значений прилагательного: русский развил у «верного» второй смысл «правильный», скорее всего через «верный расчёт», то есть такой, которому можно доверять, а польский этого шага не сделал и оставил слово при одной идее — соответствия и преданности. Зато польский сделал свой шаг: мужское-личное множественное WIERNI стало существительным «верующие», чего русское «верные» не умеет. Одно слово, два разных расширения."
memory: "Корень от wiara «вера», как в русском: wierzyć, wierny, wierność. Но объём значений разный, и это ловушка: польское wierny значит только «преданный» и «точно соответствующий» (wierne tłumaczenie «точный перевод»), а смысла «правильный» у него нет — «верный ответ» это prawidłowa odpowiedź. Управление дательным, как в русском: wierny żonie, wierny zasadom. Сравнительная через -ejszy, потому что основа кончается на группу согласных: wierniejszy, а не wiernszy. И wierni как существительное — «верующие, прихожане»."
