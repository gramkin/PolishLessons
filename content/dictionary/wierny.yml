notes:
  - { kind: false-friend, text: "Русское «верный» имеет два смысла: «преданный» и «правильный». Польское WIERNY покрывает только первый, а также производный от него смысл «точно соответствующий образцу»: WIERNY PRZYJACIEL «верный друг», WIERNE TŁUMACZENIE «точный перевод», WIERNA KOPIA «точная копия». Смысла «правильный» у польского слова нет вовсе, и здесь русскоязычный ошибается чаще всего: «верный ответ» по-польски PRAWIDŁOWA ODPOWIEDŹ или POPRAWNA ODPOWIEDŹ, но никогда WIERNA ODPOWIEDŹ — это прозвучит как «преданный ответ». То же с решением задачи: PRAWIDŁOWY WYNIK, а не WIERNY." }
  - { kind: usage, text: "Тридцать три формы: три степени по одиннадцати. Сравнительная WIERNIEJSZY образована через -EJSZY, а не через короткое -SZY, и это общее правило: если основа кончается на группу согласных, вставляется -EJ-. Поэтому WIERNY даёт WIERNIEJSZY, а не WIERNSZY, которое невозможно произнести. Превосходная NAJWIERNIEJSZY — приставка NAJ- от сравнительной. Отдельно стоит употребление мужского-личного множественного WIERNI как существительного: это «верующие, прихожане», KOŚCIÓŁ PEŁEN WIERNYCH «церковь, полная верующих». В русском такого перехода нет, и в церковном тексте WIERNI переводится как «верующие» или «прихожане»." }
  - { kind: government, text: "Кому верен — дательный падеж без предлога: WIERNY ŻONIE, WIERNY PRZYJACIELOWI, WIERNY ZASADOM, WIERNY IDEAŁOM. Русское управление то же, «верный кому, чему», так что ошибки здесь редки. Чему соответствует — тоже дательный: WIERNY ORYGINAŁOWI «точный к оригиналу». Степени сравнения присоединяют OD с родительным или NIŻ с именительным: WIERNIEJSZY OD PSA, WIERNIEJSZY NIŻ PIES. Наречие — WIERNIE: WIERNIE SŁUŻYĆ «верно служить», WIERNIE ODDAĆ SZCZEGÓŁY «точно передать детали». Существительное — WIERNOŚĆ «верность», и как все слова на -OŚĆ оно имеет шесть форм." }
  - { kind: pronunciation, text: "Читается «ве́рны», два слога, ударение на первом. Сочетание WIE даёт «ве»: W смягчается перед I, и буква I здесь не произносится отдельно, а только показывает мягкость. Буква R твёрдая, Y это «ы», поэтому слово кончается на «ны». В сравнительной степени WIERNIEJSZY четыре слога, ударение на предпоследнем: «верне́йшы», где NI даёт мягкое «нь», а SZ — твёрдое «ш». В превосходной NAJWIERNIEJSZY пять слогов, ударение по-прежнему на предпоследнем: «найверне́йшы»." }
