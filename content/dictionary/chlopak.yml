# review
id: chlopak
format: 2
lemma: "chłopak"
rank: 264
pos: noun
pron: { cyr: "хло́пак" }
senses:
  - id: boy
    ru: "парень, мальчик"
    examples:
      - pl: "Kim jest ten chłopak?"
        ru: "Кто этот мальчик?"
        source: { kind: tatoeba, id: 6313782 }
      - pl: "Ten chłopak bardzo szybko biega."
        ru: "Этот парень бегает очень быстро."
        source: { kind: tatoeba, id: 1348506 }
      - pl: "Nie wygląda na mądrego chłopaka."
        ru: "Он не похож на умного парня."
        source: { kind: tatoeba, id: 661285 }
  - id: boyfriend
    ru: "парень, бойфренд"
    note: "mój chłopak значит «мой парень» — о том, с кем встречаются."
    examples:
      - pl: "Nie, to nie jest mój nowy chłopak."
        ru: "Нет, это не мой новый бойфренд."
        source: { kind: tatoeba, id: 349056 }
      - pl: "Wysłuchała tego chłopaka."
        ru: "Она выслушала этого парня."
        source: { kind: tatoeba, id: 416753 }
      - pl: "Ma pan chłopaka albo dziewczynę? Gdzie się pan z nim albo z nią poznał?"
        ru: "У вас есть парень или девушка? Где вы познакомились с ним или с ней?"
        source: { kind: tatoeba, id: 12476565 }
notes:
  - { kind: usage, text: "Одно слово покрывает «мальчик», «парень» и «бойфренд»: Mój chłopak czeka na dole. Женская пара — dziewczyna «девушка, подруга»." }
  - { kind: false-friend, text: "chłop, от которого образовано chłopak, значит не «парень», а «мужик, крестьянин». Оно родственно русскому «холоп», но без уничижительного оттенка." }
  - { kind: usage, text: "Разговорное множественное chłopaki «ребята» звучит теплее, чем книжное chłopacy." }
collocations:
  - { pl: "mój chłopak", ru: "мой парень" }
  - { pl: "mały chłopak", ru: "маленький мальчик" }
  - { pl: "chłopak i dziewczyna", ru: "парень и девушка" }
  - { pl: "fajny chłopak", ru: "классный парень" }
etymology: "Уменьшительное от chłop «мужик, крестьянин», праславянское *xolpъ — то же слово, что русское «холоп», но без уничижительного оттенка."
memory: "chłopak — «парень», и заодно «бойфренд»: mój chłopak. А chłop, от которого оно образовано, значит «мужик, крестьянин» — родня русскому «холоп»."
idioms:
  - { pl: "chłopaki nie płaczą", ru: "мальчики не плачут" }
  - { pl: "chłopak do bicia", ru: "мальчик для битья" }
  - { pl: "mój chłopak", ru: "мой парень" }
