etymology: "Из немецкого WANNE «ванна, корыто», и русская «ванна» пришла оттуда же, в петровское время, поэтому слова совпадают до удвоенной согласной. Немецкое слово древнее и значило первоначально плоскую посудину, корыто для просеивания зерна, и родственно латинскому VANNUS «веялка» — отсюда же английское FAN «веер, вентилятор». То есть за домашней ванной стоит образ хозяйственного корыта, в котором отвеивали зерно, а не купались. Польский взял слово раньше русского и успел встроить его в обычное женское склонение, включая вставную гласную в родительном множественного, WANIEN, тогда как русский оставил «ванн» нетронутым."
memory: "Удвоенное n держится, в отличие от kaseta и klasa — потому что оно есть и в немецком Wanne. Но в родительном множественного появляется вставная гласная: wanien, а не «wann», как в deska и desek. Ванная комната — łazienka, а wanna только сосуд. В ванну — do wanny с родительным, в ванне — w wannie с местным."
idioms:
