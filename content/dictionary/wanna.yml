notes:
  - { kind: false-friend, text: "Со значением всё совпадает, а вот с написанием нет, и расхождение здесь обратное обычному. Как правило польский упрощает двойные согласные, которые русский сохраняет: KASETA против «кассеты», KLASA против «класса». Но WANNA — исключение: удвоенное N держится в обоих языках, потому что оно есть и в немецком источнике. Зато в родительном множественного появляется вставная гласная и удвоение исчезает: WANIEN, а не WANN. Эту форму стоит проговорить отдельно, потому что по именительному её не угадать." }
  - { kind: usage, text: "Родительный множественного WANIEN показывает вставную гласную E между N и N, и это та же механика, что в DESKA и DESEK: когда окончание исчезает, группа согласных на конце слова разбивается гласной. Русский в этом месте поступает иначе: он оставляет «ванн» с двумя N, без вставной гласной, и здесь языки расходятся. Прочие формы правильные. Самые частые сочетания: WANNA Z HYDROMASAŻEM, NAPUŚCIĆ WODY DO WANNY «набрать воды в ванну», LEŻEĆ W WANNIE." }
  - { kind: pronunciation, text: "Читается «ва́нна», ударение на первом слоге из двух, и удвоенное N произносится долго, как в русском. В местном и дательном падеже WANNIE буква N смягчается перед -IE и звучит «не»: «ва́нне». А в родительном множественного WANIEN удвоения уже нет и слово звучит «ва́нен», с ударением по-прежнему на первом слоге. Три формы стоит отработать подряд: WANNA, WANNIE, WANIEN." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: WYNIEŚLI WANNĘ. Нахождение внутри — предлог W с местным: W WANNIE «в ванне». Движение внутрь — предлог DO с родительным: DO WANNY «в ванну», и здесь польский расходится с русским, который в обоих случаях скажет «в ванну» и «в ванне» с разными падежами одного предлога. Сама комната — не WANNA, а ŁAZIENKA, и путать их нельзя: WANNA есть только сосуд." }
