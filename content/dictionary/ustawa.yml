etymology: "От глагола USTAWIĆ «установить, поставить», то есть U- плюс STAWIĆ от праславянского *staviti, родственного русскому «ставить». Отглагольное существительное означало сначала «установление», то есть то, что установлено властью. Русский построил из того же корня и тем же способом слово «устав» — но в мужском роде и с другим кругом применения, за внутренними правилами. Так два языка взяли одну основу, один способ образования и одну исходную мысль, а поделили между собой разные участки юридического поля: польская USTAWA пошла к государственному закону, русский «устав» — к правилам организации. Отсюда и ложная дружба, которую не снимает никакая догадка."
memory: "Резкая ложная дружба: польская ustawa женского рода и значит «закон», принятый сеймом, а русский «устав» мужского рода и значит свод правил — по-польски statut или regulamin. Оба слова от одного корня: u- + stawić, «то, что установлено». Общее право как понятие — prawo; ustawa всегда конкретный акт. Падеж: w ustawie «в тексте закона», zgodnie z ustawą «согласно закону». И осторожно: ustaw это и родительный множественного, и «поставь» от ustawić."
