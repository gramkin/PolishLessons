notes:
  - { kind: false-friend, text: "Самый резкий расход в этой тройке. Русский «устав» — мужского рода и означает свод внутренних правил организации: устав общества, воинский устав. Польская USTAWA — женского рода и означает закон, принятый парламентом: USTAWA O PODATKU, SEJM UCHWALIŁ USTAWĘ. Русскому «уставу» отвечают польские STATUT и REGULAMIN. Обратно: польское PRAWO — это право в целом и закон как понятие, а USTAWA — конкретный акт с названием и датой. Поэтому ZGODNIE Z USTAWĄ значит «согласно закону», а не «согласно уставу», и в юридическом тексте путаница меняет смысл целиком." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — USTAWIE: W USTAWIE, O USTAWIE, и W с этой формой значит «в тексте закона». Родительный множественного — USTAW, и здесь стоит быть внимательным: та же цепочка букв есть в повелительном наклонении глагола USTAWIĆ — USTAW KRZESŁO «поставь стул». Различает их только контекст. Управление: USTAWA O CZYM в местном — USTAWA O RUCHU DROGOWYM; принимают закон как UCHWALIĆ или PRZYJĄĆ USTAWĘ, а действует она на основании ZGODNIE Z USTAWĄ в творительном." }
  - { kind: pronunciation, text: "Читается «уста́ва», три слога, ударение на втором. Начальное U даёт «у», как в русском. Сочетание ST твёрдое, без смягчения. Буква W перед A звучит «в». В форме USTAWIE буквосочетание WIE даёт мягкое «ве»: «уста́ве». В форме USTAWĄ последнее Ą звучит «он»: «уста́вон». В форме USTAW конечное W оглушается в «ф»: «уста́ф», и потому на слух родительный множественного совпадает с повелительным USTAW от глагола." }
  - { kind: register, text: "Слово официальное и книжное, но очень частое: в новостях, в объявлениях, на любой странице о налогах и правах. Полное название закона строится по образцу USTAWA Z DNIA и дальше дата, и этот оборот стоит узнавать в документах. Разговорное сокращение USTAWA O PIT понятно каждому поляку. Производное USTAWODAWCA значит «законодатель», USTAWOWY — «законный, установленный законом». Звательная форма USTAWO встречается только в риторическом обращении у публицистов и поэтов, не в обычной речи." }
