# review
id: ubrany
format: 2
lemma: "ubrany"
rank: 2430
pos: adj
pron: { cyr: "убра́ны" }
senses:
  - id: dressed
    ru: "одетый"
    examples:
      - pl: "Pielęgniarka jest ubrana na biało."
        ru: "Медсестра одета в белое."
        source: { kind: tatoeba, id: 3653833 }
      - pl: "Jest niechlujnie ubrany."
        ru: "Он неряшливо одет."
        source: { kind: translated, id: 350096 }
      - pl: "Była ubrana jak aktorka."
        ru: "Она была одета как актриса."
        source: { kind: translated, id: 362412 }
  - id: dressed-in-colour
    ru: "одетый во что-л. (о цвете, одежде)"
    examples:
      - pl: "Była ubrana na czerwono."
        ru: "Она была одета в красное."
        source: { kind: translated, id: 593322 }
      - pl: "Wszyscy ubrani byli w mundury."
        ru: "Все были одеты в мундиры."
        source: { kind: translated, id: 1352118 }
notes:
  - { kind: government, text: "Одет ВО что-л. — ubrany W coś, с винительным падежом: ubrany w mundur. А о цвете — ubrany NA czarno, с наречием: «одет в чёрное» по-польски буквально «одет по-чёрному»." }
  - { kind: usage, text: "Оборот mieć ubrane «иметь надетым» (Co Tom miał ubrane?) очень распространён в живой речи, но языковеды его осуждают: правильнее mieć na sobie или być ubranym w coś. Знать стоит оба." }
  - { kind: false-friend, text: "Причастие от ubrać «одеть», которое уже есть в словаре, как и ubranie «одежда». Русское «убранный» — то же слово по форме, но значит совсем другое: «убранный» — это posprzątany." }
  - { kind: government, text: "Склоняется как обычное прилагательное: ubrany, ubrana, ubrani, ubranych." }
collocations:
  - { pl: "ubrany w coś", ru: "одетый во что-л." }
  - { pl: "ubrany na czarno", ru: "одетый в чёрное" }
etymology: "Причастие от ubrać «одеть»; родня ubranie «одежда». Русское «убранный» — другое значение: posprzątany."
memory: "ubrany — «одетый»: ubrany W coś с винительным, но ubrany NA czarno о цвете. Оборот mieć ubrane очень част в речи, хотя языковеды советуют mieć na sobie."
idioms:
  - { pl: "ubrany w coś", ru: "одетый во что-л." }
  - { pl: "ubrany na czarno", ru: "одетый в чёрное" }
formExamplesSkip:
