# review
id: wsiadac
format: 2
lemma: "wsiadać"
rank: 1700
pos: verb
aspect: imperf
pron: { cyr: "фся́даць" }
senses:
  - id: board
    ru: "садиться (в транспорт)"
    examples:
      - pl: "Wsiadaj."
        ru: "Садись."
        source: { kind: translated, id: 8608654 }
      - pl: "Pasażerowie powinni natychmiast wsiadać do pociągu."
        ru: "Пассажирам следует немедленно садиться в поезд."
        source: { kind: translated, id: 538971 }
      - pl: "Wsiadajmy do autobusu."
        ru: "Давайте сядем в автобус."
        source: { kind: translated, id: 733063 }
  - id: board-warning
    ru: "садиться (в предостережениях)"
    examples:
      - pl: "Nie wsiadaj do fałszywych taksówek."
        ru: "Не садись в поддельные такси."
        source: { kind: translated, id: 970728 }
      - pl: "Nie wsiadaj do samochodu z nieznajomymi!"
        ru: "Не садись в машину к незнакомцам!"
        source: { kind: translated, id: 10696022 }
notes:
  - { kind: government, text: "В машину, поезд и автобус — wsiadać do czegoś (родительный с do): wsiadam do pociągu. На корабль, велосипед и коня — wsiadać na coś (винительный с na): wsiadam na rower." }
  - { kind: false-friend, text: "Русское «садиться в автобус» переводится с предлогом do, а не w: wsiadać do autobusu." }
  - { kind: usage, text: "Совершенный вид — wsiąść. Обратное действие — wysiadać «выходить (из транспорта)»." }
  - { kind: usage, text: "Wsiadaj! — обычная команда «Садись!», а Wsiadać! на вокзале значит «По вагонам!»." }
collocations:
  - { pl: "wsiadać do pociągu", ru: "садиться в поезд" }
  - { pl: "wsiadać na rower", ru: "садиться на велосипед" }
  - { pl: "wsiadaj!", ru: "садись!" }
family:
  - { pl: "wsiąść", ru: "сесть", relation: aspect }
  - { pl: "wysiadać", ru: "выходить (из транспорта)", relation: root }
  - { pl: "siadać", ru: "садиться", relation: root }
etymology: "Приставка w- «в-» плюс siadać «садиться»: буквально «всаживаться». Корень тот же, что в русском «сидеть» и «садиться»."
memory: "wsiadać — «садиться в транспорт», совершенный вид wsiąść. В машину и поезд — do (wsiadam do pociągu), на корабль и велосипед — na (wsiadam na rower). Выходить — wysiadać."
idioms:
  - { pl: "wsiadaj!", ru: "садись!" }
  - { pl: "wsiadać do pociągu", ru: "садиться в поезд" }
  - { pl: "wsiadać na rower", ru: "садиться на велосипед" }
