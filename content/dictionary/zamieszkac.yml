# review
id: zamieszkac
format: 2
lemma: "zamieszkać"
rank: 2233
pos: verb
pron: { cyr: "замешка́ць" }
senses:
  - id: settle
    ru: "поселиться, обосноваться"
    examples:
      - pl: "Zamieszkali na wsi po ślubie."
        ru: "Они поселились в деревне после свадьбы."
        source: { kind: authored }
      - pl: "Zamieszkam u siostry na miesiąc."
        ru: "Я поселюсь у сестры на месяц."
        source: { kind: authored }
  - id: start-living-with
    ru: "начать жить (с кем-л.)"
    examples:
      - pl: "Zamieszkała z babcią po pogrzebie."
        ru: "Она стала жить с бабушкой после похорон."
        source: { kind: authored }
      - pl: "Zamieszkali razem dopiero po roku."
        ru: "Они стали жить вместе только через год."
        source: { kind: authored }
  - id: inhabited
    ru: "zamieszkany — обитаемый, заселённый"
    examples:
      - pl: "To teren zamieszkany od epoki brązu."
        ru: "Это территория, заселённая с бронзового века."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОДИН ИЗ ГЛАВНЫХ КАПКАНОВ ПОЛЬСКОГО. Mieszkać значит «ЖИТЬ, ПРОЖИВАТЬ», а вовсе не «мешать»: gdzie mieszkasz? — «где ты живёшь?». Русское «мешать» в смысле «препятствовать» будет przeszkadzać, а в смысле «размешивать» — mieszać, без k. Три похожих слова, три разных смысла: mieszkać «жить», mieszać «мешать, смешивать», przeszkadzać «мешать, препятствовать». Отсюда и mieszkanie «КВАРТИРА», а не «помеха»." }
  - { kind: government, text: "ГДЕ поселиться — w или na с предложным: zamieszkać w Krakowie, na wsi, na Mazurach. С КЕМ — z и творительный: zamieszkać z rodzicami. У кого — u с родительным: zamieszkać u siostry. Винительного дополнения у глагола нет: он непереходный, поселяются не «что-то», а «где-то»." }
  - { kind: usage, text: "ПОЧЕМУ У НЕПЕРЕХОДНОГО ГЛАГОЛА ЕСТЬ СТРАДАТЕЛЬНОЕ ПРИЧАСТИЕ. Zamieszkać непереходен, и причастия вроде zamieszkany ожидать не приходилось бы. Но оно есть и живёт самостоятельной жизнью как прилагательное «обитаемый, заселённый»: teren zamieszkany, dom zamieszkany od stu lat. Опору ему даёт родственный переходный глагол zamieszkiwać coś «населять что-л.», от которого причастие и образовано по смыслу. Вид совершенный, несовершенная пара — mieszkać и zamieszkiwać." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: za-miesz-KAĆ. Sz читается как ш, а mie — как «ме» с мягким м: «замешка́ць». В прошедшем времени ударение остаётся предпоследним: zamieszkaliśmy — «замешкали́шмы»." }
collocations:
  - { pl: "zamieszkać na wsi", ru: "поселиться в деревне" }
  - { pl: "zamieszkać razem", ru: "начать жить вместе" }
  - { pl: "teren zamieszkany", ru: "заселённая территория" }
family:
  - { pl: "mieszkać", ru: "жить, проживать", relation: aspect, id: mieszkac }
  - { pl: "mieszkanie", ru: "квартира", relation: derived }
  - { pl: "mieszkaniec", ru: "житель", relation: derived, id: mieszkaniec }
  - { pl: "wyprowadzić się", ru: "съехать, выселиться", relation: antonym, id: wyprowadzic }
etymology: "Приставка za- плюс mieszkać, из праславянского *měškati «медлить, задерживаться». Первоначальный смысл был «задержаться где-то», откуда и «проживать»: поселиться значило остаться дольше, чем на ночь. В русском тот же корень дал «мешкать» — «медлить», и это ЕДИНСТВЕННЫЙ настоящий родственник; с «мешать» слово не связано. Отсюда mieszkanie, mieszkaniec, zamieszkiwać."
memory: "zamieszkać — «поселиться», от mieszkać «жить», а не «мешать». Настоящая русская родня — «МЕШКАТЬ», медлить: поселиться значило задержаться. Отсюда и mieszkanie «квартира». «Мешать» в смысле препятствовать — это przeszkadzać."
idioms:
  - { pl: "zamieszkać razem", ru: "начать жить вместе" }
  - { pl: "teren zamieszkany", ru: "заселённая территория" }
