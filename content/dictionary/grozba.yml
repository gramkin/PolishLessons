etymology: "От GROZIĆ, из праславянского *groza «ужас, страх», того же корня, что русские «гроза», «грозить», «грозный». Исходное значение — не атмосферное явление, а именно ужас: гром назвали грозой потому, что он внушал страх, и русский закрепил за словом погоду, а польский оставил чувство. Поэтому польское GROZA значит «ужас», а русская «гроза» переводится как BURZA. Существительное GROŹBA образовано суффиксом -BA, который в польском делает из глаголов названия действий: PROSIĆ даёт PROŚBA, SŁUŻYĆ даёт SŁUŻBA, LICZYĆ даёт LICZBA. Русский знает тот же суффикс в «просьбе» и «службе», но для угрозы предпочёл приставочное образование «угроза». Так один праславянский корень дал в двух языках и разные значения, и разные способы образования имени."
memory: "groźba — «угроза», но groza — «ужас», а русская «гроза» — это burza. Исходный смысл корня был страх, и польский сохранил его, а русский перенёс на погоду. Родительный множественного — gróźb, с o→ó, как gór от góra и nóg от noga. Суффикс -ba отвечает русскому -ба: prośba и «просьба», służba и «служба»."
