notes:
  - { kind: false-friend, text: "Три слова этого гнезда разошлись в двух языках, и путаница почти неизбежна. GROŹBA это «угроза». GROZA по-польски — «ужас, жуть»: WIAŁO GROZĄ «веяло жутью». А русская «гроза» по-польски BURZA, и к польскому GROZA отношения не имеет, хотя звучит почти так же. Значит, видя GROZA, думать надо об ужасе, а не о громе. Глагол GROZIĆ «грозить, угрожать» совпадает с русским полностью, а вот существительное русский образовал иначе: «угроза» с приставкой, а польский — GROŹBA с суффиксом -BA." }
  - { kind: government, text: "Женский род. Чему или кому угрожают, передаётся родительным: GROŹBA WOJNY, GROŹBA POWODZI, GROŹBA ZWOLNIENIA. Под угрозой чего-то — POD GROŹBĄ с творительным: POD GROŹBĄ KARY, POD GROŹBĄ UTRATY PRACY. Сам глагол строится иначе, чем существительное: GROZIĆ KOMUŚ (дательный) CZYMŚ (творительный) — GROZIŁ MU SĄDEM «грозил ему судом». Частотные сочетания: SPEŁNIĆ GROŹBĘ «исполнить угрозу», ZGŁOSIĆ GROŹBĘ «сообщить об угрозе», PUSTA GROŹBA «пустая угроза»." }
  - { kind: usage, text: "Родительный множественного — GRÓŹB, и в нём меняется гласная: O переходит в Ó. Это регулярное польское чередование, которое срабатывает, когда слог становится закрытым: так же GÓR от GÓRA, SIÓSTR от SIOSTRA, NÓG от NOGA. Писать GROŹB поэтому нельзя. Второе: дательный и местный GROŹBIE смягчает B перед -IE, как и всякое польское существительное на -BA. Суффикс -BA в польском образует отглагольные существительные и прямо отвечает русскому -БА: PROŚBA и «просьба», LICZBA и счёт, SŁUŻBA и «служба». В случае угрозы русский этим суффиксом не воспользовался и взял приставочную «угрозу»." }
  - { kind: pronunciation, text: "Читается «гро́зьба», два слога, ударение на первом. Буква Ź даёт мягкое «зь», отчётливо мягче русского з: ZB звучит как «зьб». В родительном множественного GRÓŹB буква Ó читается «у», а конечное B оглушается до «п»: «грущп» слышится как «грусьп». В дательном GROŹBIE сочетание BIE даёт мягкое «бе»: «гро́зьбе», три слога. Разница между GROŹBA и GROZA слышна хорошо: в первом мягкое «зь», во втором твёрдое «з»." }
