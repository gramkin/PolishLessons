# review
id: fair
format: 2
lemma: "fair"
rank: 2693
pos: adv
pron: { cyr: "фэр" }
senses:
  - id: fair-just
    ru: "честно, справедливо (о поступке)"
    examples:
      - pl: "To nie fair, że on dostał dwa razy więcej."
        ru: "Это несправедливо, что он получил вдвое больше."
        source: { kind: authored }
      - pl: "Zagrali fair i przegrali uczciwie."
        ru: "Они сыграли честно и честно проиграли."
        source: { kind: authored }
      - pl: "Postąpiłeś fair, chociaż nikt tego nie wymagał."
        ru: "Ты поступил честно, хотя никто этого не требовал."
        source: { kind: authored }
  - id: fair-play
    ru: "в духе честной игры (о спорте, правилах)"
    examples:
      - pl: "Gra fair jest ważniejsza od wyniku."
        ru: "Честная игра важнее результата."
        source: { kind: authored }
      - pl: "Sędzia pilnował, żeby wszystko było fair."
        ru: "Судья следил, чтобы всё было по-честному."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово заимствовано из английского и не изменяется вовсе: ни родов, ни падежей, ни степеней сравнения у него нет. Поэтому оно стоит либо при глаголе как наречие, ZAGRALI FAIR, либо после связки как сказуемое, TO NIE FAIR. Вторая конструкция самая частая и самая полезная: TO NIE FAIR значит «это несправедливо», и так говорят постоянно, особенно дети. Прилагательным FAIR быть не может: нельзя сказать FAIR CZŁOWIEK, скажут UCZCIWY CZŁOWIEK." }
  - { kind: pronunciation, text: "Читается «фэр», одним слогом, по-английски, а не по буквам: не «фа-ир». Конечное r произносится отчётливо, как всякое польское r. Поскольку слово односложное, вопроса об ударении не возникает — это одно из немногих польских слов, где не нужно искать предпоследний слог. Пишется всегда латиницей и без изменений, FAIR, хотя изредка встречается ослитнённое FER." }
  - { kind: false-friend, text: "В русском этого слова в такой роли нет, и это главное. «Фэйр» по-русски не говорят, а польское TO NIE FAIR приходится переводить описательно: «это несправедливо», «это не по правилам», «так нельзя». Зато в русском есть «фейр-плей» как спортивный термин, и польское GRA FAIR отвечает ему точно. Не путайте с английским FARE и с польским FARA «приходский костёл» — слова разные, хотя на слух близкие." }
  - { kind: government, text: "Наречие ничем не управляет и ни с чем не согласуется. Отрицание ставится перед ним: TO NIE FAIR, а не TO FAIR NIE. Усиление — обычными наречиями: TO ZUPEŁNIE NIE FAIR «это совершенно несправедливо». Устойчивое сочетание GRA FAIR употребляется и как подлежащее, и как дополнение, но само FAIR в нём по-прежнему неизменяемо: GRY FAIR, O GRZE FAIR — изменяется только слово GRA." }
collocations:
  - { pl: "to nie fair", ru: "это несправедливо" }
  - { pl: "gra fair", ru: "честная игра" }
  - { pl: "zagrać fair", ru: "сыграть честно" }
family:
  - { pl: "uczciwy", ru: "честный", relation: root, id: uczciwy }
  - { pl: "sprawiedliwy", ru: "справедливый", relation: root }
  - { pl: "gra", ru: "игра", relation: root, id: gra }
etymology: "Из английского FAIR «честный, справедливый», которое само восходит к древнеанглийскому FÆGER «красивый, приятный» — та же связь красоты и правильности, что в русском «прекрасно» о поступке. В польский слово пришло в двадцатом веке вместе со спортом и спортивной этикой, прежде всего через выражение FAIR PLAY, и осталось неизменяемым, потому что в польскую систему окончаний не укладывается: у наречий окончаний нет, и слово просто заняло их место. Русский взял тот же оборот, но целиком и только как термин, не пустив его в обыденную речь."
memory: "Не изменяется и не бывает определением: to nie fair «это несправедливо», zagrali fair. Читается одним слогом, «фэр». Русского «фэйр» нет — переводите описательно."
idioms:
