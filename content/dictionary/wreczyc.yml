etymology: "Приставка W- плюс корень RĘK-, то есть RĘKA «рука», с обычным для польского чередованием K в CZ перед гласной переднего ряда. Буквально «дать в руку». Русское «вручить» собрано из тех же самых частей и в том же порядке: в + рука + ить, с тем же чередованием к в ч. Такое полное совпадение морфема за морфемой встречается нечасто, и здесь его стоит запомнить именно поэтому. Корень идёт от праславянского *rǫka, откуда и RĘKA, и «рука», и носовой гласный Ę на месте русского «у». Из того же гнезда PORĘCZYĆ «поручиться» при русском «поручиться», RĘKAW «рукав», RĘCZNIK «полотенце»."
memory: "Собрано из тех же частей, что и русское «вручить», морфема за морфемой: w это в, ręcz это руч, -yć это -ить. Управление тоже совпадает полностью: wręczyć komuś coś, дательный на лицо и винительный на предмет. Ловушка одна, но важная: wręcz это не только «вручи», но и наречие «прямо, попросту», и в обороте wręcz przeciwnie значит «как раз наоборот». Регистр торжественный: вручают награды и приговоры, а соль за столом подают, podaj sól."
idioms:
  - { pl: "wręcz przeciwnie", ru: "как раз наоборот" }
formExamplesSkip:
