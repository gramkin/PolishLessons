notes:
  - { kind: false-friend, text: "Форма WRĘCZ опасна тем, что это сразу две разные вещи. Как повелительное наклонение она значит «вручи». Но есть и самостоятельное наречие WRĘCZ со значением «прямо, попросту, напрямик», и оно живёт в очень частом обороте WRĘCZ PRZECIWNIE — «как раз наоборот». Если в тексте WRĘCZ стоит без дополнения и без обращения, это почти наверняка наречие, а не приказ что-то вручить. Ещё одно созвучие: PORĘCZYĆ значит «поручиться», и русская пара «поручиться — порука» устроена из тех же частей." }
  - { kind: government, text: "Управление переносится с русского целиком, без поправок. Тот, кому вручают, идёт в дательный, а то, что вручают, в винительный: WRĘCZYĆ KOMUŚ COŚ — «вручить кому-то что-то». WRĘCZYŁ MI PRZESYŁKĘ «вручил мне посылку». Способ выражается наречием OSOBIŚCIE «лично» или оборотом DO RĘKI «в руки», тоже как по-русски. В безличном обороте дополнение остаётся в винительном: NAGRODY WRĘCZONO PO PRZERWIE «награды вручили после перерыва»." }
  - { kind: pronunciation, text: "Читается «врэ́нчычь», два слога, ударение на первом. Буква Ę перед CZ звучит как «эн», поэтому слышно «врэнч», а не «врэ». Сочетание CZ даёт твёрдое «ч», а конечное Ć мягкое, «чь», так что в коротком слове два разных «ч» подряд через гласную. Буква Y читается как «ы»: «чычь». В страдательном причастии WRĘCZONY слышно «врэнчо́ны»." }
  - { kind: register, text: "Слово официальное и торжественное: вручают награды, дипломы, медали, письма, приговоры, уведомления об увольнении. В бытовой речи вместо него скажут DAĆ или PODAĆ: передать соль за столом это PODAJ SÓL, а не WRĘCZ. Частые обороты: WRĘCZYĆ NAGRODĘ, WRĘCZYĆ WYPOWIEDZENIE «вручить уведомление об увольнении», WRĘCZENIE DYPLOMÓW «вручение дипломов». Видовой партнёр — WRĘCZAĆ, и в объявлениях чаще стоит именно существительное WRĘCZENIE." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: есть деепричастие на -WSZY и страдательное причастие, а действительного причастия на -ĄCY нет. Одна форма из страдательных невозможна: мужско-личная WRĘCZENI означала бы «вручённые мужчины», а вручают предмет или бумагу, но не человека. Передать человека по-польски это WYDAĆ или PRZEKAZAĆ, и у них свои парадигмы. Остальные десять страдательных форм совершенно обычны: NAGRODA WRĘCZONA, DYPLOMY WRĘCZONE." }
