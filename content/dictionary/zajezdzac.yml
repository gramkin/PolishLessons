# review
id: zajezdzac
format: 2
lemma: "zajeżdżać"
rank: 5774
pos: verb
pron: { cyr: "зае́жджаць" }
senses:
  - id: drive-up
    ru: "заезжать, подъезжать (куда-л., к кому-л.)"
    examples:
      - pl: "Zajeżdżam do rodziców co tydzień."
        ru: "Я заезжаю к родителям каждую неделю."
        source: { kind: authored }
      - pl: "Autobus zajeżdża na przystanek od tyłu."
        ru: "Автобус подъезжает к остановке сзади."
        source: { kind: authored }
  - id: cut-off
    ru: "подрезать: zajeżdżać komuś drogę"
    examples:
      - pl: "Zajeżdżasz mi drogę za każdym razem."
        ru: "Ты каждый раз подрезаешь мне дорогу."
        source: { kind: authored }
      - pl: "Zajeżdżając mi drogę, nawet nie zatrąbił."
        ru: "Подрезая мне дорогу, он даже не посигналил."
        source: { kind: authored }
  - id: ride-ragged
    ru: "загонять (коня, человека работой)"
    examples:
      - pl: "Woźnice zajeżdżali konie bez litości."
        ru: "Возчики загоняли коней без жалости."
        source: { kind: authored }
      - pl: "Zajeżdżani nadgodzinami pracownicy zaczęli chorować."
        ru: "Загнанные сверхурочными работники начали болеть."
        source: { kind: authored }
notes:
  - { kind: government, text: "У трёх значений три разных управления, и это главное, что надо запомнить. «Заезжать» — без дополнения, с направлением: zajeżdżać do rodziców, pod dom, na rampę. «Подрезать» — ДАТЕЛЬНЫЙ падеж лица плюс ВИНИТЕЛЬНЫЙ drogę: zajeżdżać komuś drogę. «Загонять» — прямой ВИНИТЕЛЬНЫЙ: zajeżdżać konia. Мужсколичное причастие zajeżdżani идёт именно от третьего значения." }
  - { kind: usage, text: "Несовершенный вид; совершенный — zajechać. Из того же гнезда zajazd — «заезд» и, в старом значении, «корчма, трактир» при дороге." }
  - { kind: false-friend, text: "Корень тот же, что в русском «ехать», и zajeżdżać отвечает «заезжать» морфема в морфему. Но оборот zajeżdżać komuś drogę по-русски передаётся совсем другим глаголом — «подрезать», — так что сочетание надо заучивать целиком, а не переводить по частям." }
  - { kind: pronunciation, text: "Сочетание żdż произносится как долгое [жджь]: zajeżdżać — [зае́жджаць]. Это одно из самых трудных для произношения мест в польском, и встречается оно во всей серии глаголов на -jeżdżać." }
collocations:
  - { pl: "zajeżdżać do kogoś", ru: "заезжать к кому-л." }
  - { pl: "zajeżdżać komuś drogę", ru: "подрезать кого-л." }
  - { pl: "zajeżdżać konia", ru: "загонять коня" }
family:
  - { pl: "zajechać", ru: "заехать, подъехать", relation: aspect }
  - { pl: "jechać", ru: "ехать", relation: root, id: jechac }
  - { pl: "zajazd", ru: "заезд; придорожная корчма", relation: derived }
etymology: "Приставка za- и jeżdżać, многократная основа к jechać, от праславянского *jaxati. Русское «ехать» — прямой родственник, и «заезжать» сложено из тех же двух частей. Из того же гнезда zajazd: сперва «заезд», потом «придорожная корчма», куда заезжали на ночь."
memory: "zajeżdżać = za- + jeżdżać, буквально русское «заезжать», корень как в «ехать». Но следите за управлением: zajeżdżać DO kogoś «заезжать к кому-л.», zajeżdżać KOMUŚ DROGĘ «подрезать», zajeżdżać KONIA «загонять коня»."
idioms:
  - { pl: "zajeżdżać komuś drogę", ru: "подрезать кого-л. на дороге" }
  - { pl: "zajeżdżać konia", ru: "загонять коня, изматывать" }
