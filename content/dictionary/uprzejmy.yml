etymology: "Корень здесь тот же, что в JĄĆ «брать, принимать», от праславянского *jęti, откуда русские «взять», «принять», «понять», «приятный». Сложено из приставок U- и PRZE- с этим корнем, и первоначальный смысл был «расположенный принять, обходительный»: вежлив тот, кто принимает человека хорошо. Русское «приятный» выросло из того же гнезда и тем же способом, от «приять, принять», и по-польски ему точно отвечает PRZYJEMNY. Получилось, что одно праславянское гнездо дало в польском два слова, разошедшихся по смыслу: PRZYJEMNY о вещах и впечатлениях, UPRZEJMY о людях и обращении. А «упрямый», на которое слово похоже внешне, идёт совсем от другого корня, от «перети, упираться»."
memory: "Выглядит как «упрямый», значит «вежливый». «Упрямый» по-польски uparty, и это слово другого корня. Настоящий родственник — русское «приятный», которому отвечает польское przyjemny, так что два похожих польских слова делят работу: przyjemny о вещах, uprzejmy о людях. Знать канцелярские формулы: uprzejmie proszę «прошу вас», uprzejmie informujemy «настоящим сообщаем». Управление требует правки: bądź uprzejmy dla gości, предлог dla и родительный, где русский ставит «с» и творительный."
