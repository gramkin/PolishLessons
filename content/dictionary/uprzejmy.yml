notes:
  - { kind: false-friend, text: "Русский глаз читает здесь «упрямый», и промахивается почти в противоположную сторону: UPRZEJMY значит «вежливый, учтивый». «Упрямый» по-польски UPARTY, от UPIERAĆ SIĘ «упираться», и эти два слова по смыслу друг другу не родня. Вторая ловушка тоньше: настоящий русский родственник этого слова — не «упрямый», а «приятный», и по-польски «приятный» будет PRZYJEMNY. Два польских слова стоят рядом и различаются одной приставкой: PRZYJEMNY WIECZÓR «приятный вечер», UPRZEJMY KELNER «вежливый официант»." }
  - { kind: register, text: "Это слово официальной вежливости, и в канцелярском языке оно работает как готовая формула. UPRZEJMIE INFORMUJEMY значит «настоящим сообщаем», UPRZEJMIE PROSZĘ — «прошу вас», UPRZEJMIE DZIĘKUJĘ — «покорно благодарю». В живой речи чаще слышно BĄDŹ TAK UPRZEJMY «будь так любезен», и это вежливая просьба, а иногда и вежливое раздражение, смотря по тону. Для простого «милый, приветливый» поляк скажет MIŁY или SYMPATYCZNY, а UPRZEJMY оставит для обслуживания и переписки." }
  - { kind: usage, text: "Тридцать три формы — одиннадцать клеток в трёх степенях, и образуются они совершенно регулярно: UPRZEJMY, UPRZEJMIEJSZY, NAJUPRZEJMIEJSZY. Обратить внимание стоит на мужско-личное множественное: в положительной степени это UPRZEJMI, а в сравнительной UPRZEJMIEJSI, то есть M перед окончанием смягчается. Наречие UPRZEJMIE употребляется едва ли не чаще самого прилагательного, потому что именно оно входит в канцелярские формулы." }
  - { kind: pronunciation, text: "Читается «упше́ймы», три слога, ударение на предпоследнем. Сочетание PRZ даёт «пш», и это одно из самых частых польских сочетаний: PRZEZ «пшэз», PRZY «пшы». Дальше идёт JM, две согласные подряд, так что середина слова звучит «шейм». Конечное Y — это «ы», а не «и». В сравнительной степени добавляется слог: UPRZEJMIEJSZY, «упшеймє́йшы», где MIE даёт мягкое «ме», а SZ твёрдое «ш»." }
  - { kind: government, text: "Прилагательное падежом не управляет, но у вежливости есть свои предлоги. Тот, к кому вежливы, вводится предлогом DLA с родительным: BĄDŹ UPRZEJMY DLA GOŚCI «будь вежлив с гостями». Русский здесь ставит предлог «с» и творительный, так что падеж приходится менять. Есть и конструкция с W и предложным: UPRZEJMY W ROZMOWIE «вежливый в разговоре». В роли просьбы прилагательное часто стоит с инфинитивом: BĄDŹ UPRZEJMY ZAMKNĄĆ OKNO «будь любезен закрыть окно»." }
