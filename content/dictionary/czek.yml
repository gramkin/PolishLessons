lemma: "czek"
rank: 1959
pos: noun
pron: { cyr: "чэк" }
senses:
  - id: cheque
    ru: "чек (банковский)"
    examples:
      - pl: "Poproszę o czek."
        ru: "Мне, пожалуйста, чек."
        source: { kind: translated, id: 547700 }
      - pl: "Dostałeś czek?"
        ru: "Ты получил чек?"
        source: { kind: translated, id: 6534327 }
      - pl: "Czy mógłbym dostać czek?"
        ru: "Можно мне получить чек?"
        source: { kind: translated, id: 578056 }
      - pl: "Wysłała mi w załączeniu czek."
        ru: "Она прислала мне чек в приложении."
        source: { kind: translated, id: 561626 }
      - pl: "Przyjmujemy czeki."
        ru: "Мы принимаем чеки."
        source: { kind: translated, id: 2212581 }
      - pl: "To jest numer mojego czeku."
        ru: "Это номер моего чека."
        source: { kind: translated, id: 945793 }
  - id: pay-by-cheque
    ru: "платить чеком"
    examples:
      - pl: "Zapłacę czekiem."
        ru: "Я заплачу чеком."
        source: { kind: translated, id: 352983 }
      - pl: "Chciałbym zapłacić czekiem."
        ru: "Я хотел бы заплатить чеком."
        source: { kind: translated, id: 6324424 }
      - pl: "Zapłacę czekami podróżnymi."
        ru: "Я заплачу дорожными чеками."
        source: { kind: translated, id: 365089 }
notes:
  - { kind: false-friend, text: "Это банковский чек, а не кассовый: чек из магазина по-польски paragon. Не путайте также с формами глагола czekać «ждать» — czeka «ждёт», czekam «жду»." }
  - { kind: usage, text: "Платить чеком — płacić czekiem, с творительным падежом, как płacić gotówką «платить наличными»." }
  - { kind: usage, text: "czek podróżny — «дорожный чек», частое сочетание в текстах о путешествиях." }
collocations:
  - { pl: "zapłacić czekiem", ru: "заплатить чеком" }
  - { pl: "czek podróżny", ru: "дорожный чек" }
  - { pl: "wypisać czek", ru: "выписать чек" }
etymology: "Из английского cheque через немецкий Scheck. Русское «чек» — то же заимствование, но в русском оно покрывает и кассовый чек, а в польском для него есть отдельное слово paragon."
memory: "czek — банковский чек. Магазинный чек — это paragon. Платят чеком в творительном: zapłacę czekiem."
idioms:
  - { pl: "zapłacić czekiem", ru: "заплатить чеком" }
  - { pl: "czek podróżny", ru: "дорожный чек" }
  - { pl: "wypisać czek", ru: "выписать чек" }
