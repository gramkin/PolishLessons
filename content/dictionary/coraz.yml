# review
id: coraz
format: 2
lemma: "coraz"
rank: 1139
pos: adv
pron: { cyr: "цо́раз" }
senses:
  - id: intensify
    ru: "всё (с сравнительной степенью): всё лучше, всё быстрее"
    examples:
      - pl: "Listopad jest coraz bliżej!"
        ru: "Ноябрь всё ближе!"
        source: { kind: tatoeba, id: 2247854 }
      - pl: "Świat zmienia się coraz szybciej."
        ru: "Мир меняется всё быстрее и быстрее."
        source: { kind: tatoeba, id: 1918686 }
      - pl: "Podoba mi się coraz bardziej."
        ru: "Мне нравится это все больше и больше."
        source: { kind: tatoeba, id: 2143167 }
  - id: less-more
    ru: "coraz mniej / coraz więcej — всё меньше / всё больше"
    examples:
      - pl: "Mam coraz mniej czasu na czytanie."
        ru: "У меня всё меньше времени на чтение."
        source: { kind: tatoeba, id: 513479 }
      - pl: "Każdego dnia pije coraz więcej kawy."
        ru: "С каждым днём он пьёт всё больше кофе."
        source: { kind: tatoeba, id: 4771202 }
notes:
  - { kind: usage, text: "Слово работает только в паре со сравнительной степенью: coraz lepiej «всё лучше», coraz szybciej «всё быстрее», coraz bardziej «всё больше». Само по себе не употребляется." }
  - { kind: usage, text: "coraz bardziej «всё более» и coraz mniej «всё менее» — готовые блоки для прилагательных, которые не образуют простую сравнительную степень." }
  - { kind: usage, text: "Разбирается прозрачно: co + raz, буквально «что ни раз». Русское «всё» в этом значении — тоже застывшая форма." }
  - { kind: usage, text: "Частый оборот с глаголом stawać się: staje się coraz popularniejszy «становится всё популярнее»." }
collocations:
  - { pl: "coraz lepiej", ru: "всё лучше" }
  - { pl: "coraz bardziej", ru: "всё более" }
  - { pl: "coraz więcej", ru: "всё больше" }
  - { pl: "coraz mniej", ru: "всё меньше" }
family:
  - { pl: "raz", ru: "раз", relation: root, id: raz }
  - { pl: "co", ru: "что", relation: root, id: co }
etymology: "Из co + raz, буквально «что ни раз». Русское «всё» в обороте «всё лучше» — тоже застывшее слово, взявшее на себя ту же работу."
memory: "coraz — «всё» в смысле нарастания, и живёт только со сравнительной степенью: coraz lepiej «всё лучше», coraz bardziej «всё более». Отдельно, без сравнительной, не употребляется."
