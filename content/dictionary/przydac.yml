        ru: "Тебе пригодилось бы полотенце."
        source: { kind: translated, id: 5014618 }
notes:
  - { kind: usage, text: "Глагол почти всегда идёт с się: przydać się «пригодиться». Кому — дательный падеж: przyda mi się «мне пригодится»." }
  - { kind: usage, text: "Условные формы przydałby się, przydałaby się, przydałoby się — самые частые: они значат «пригодился бы, не помешал бы». Przydałaby mi się pomoc «Мне бы пригодилась помощь»." }
  - { kind: usage, text: "Несовершенный вид — przydawać się; от того же корня существительное przydatność «пригодность»." }
  - { kind: government, text: "Порядок слов: się и местоимение в дательном держатся вместе — przyda mi się и mi się przyda оба правильны, первый естественнее." }
collocations:
  - { pl: "przydać się", ru: "пригодиться" }
  - { pl: "przyda mi się", ru: "мне пригодится" }
  - { pl: "przydałaby się pomoc", ru: "пригодилась бы помощь" }
etymology: "Приставка przy- + dać «дать» — буквально «придать», то есть «добавить пользы». Русское «пригодиться» собрано от другого корня («годный»), но с той же приставкой при-."
memory: "przydać się = «пригодиться», буквально przy- + dać, как русское «придать». Почти всегда с się и дательным падежом: przyda mi się «мне пригодится». Чаще всего звучит в условной форме: przydałaby mi się pomoc «мне бы пригодилась помощь»."
idioms:
  - { pl: "przydać się", ru: "пригодиться" }
  - { pl: "przyda się", ru: "пригодится" }
  - { pl: "przydałoby się", ru: "не помешало бы" }
