# review
id: masc
format: 2
lemma: "maść"
rank: 6061
pos: noun
pron: { cyr: "ма́сьць" }
senses:
  - id: ointment
    ru: "мазь"
    examples:
      - pl: "Potrzebuję maść przeciw swędzeniu."
        ru: "Мне нужна мазь от зуда."
        source: { kind: translated, id: 6322227 }
      - pl: "Pielęgniarka wtarła maść w chore miejsce."
        ru: "Медсестра втёрла мазь в больное место."
        source: { kind: translated, id: 1829465 }
      - pl: "Lekarz przepisał mi maść na oparzenia."
        ru: "Врач выписал мне мазь от ожогов."
        source: { kind: authored }
  - id: coat-colour
    ru: "масть (животного)"
    examples:
      - pl: "Klacz była kasztanowatej maści."
        ru: "Кобыла была гнедой масти."
        source: { kind: authored }
      - pl: "Hodowca ma konie każdej maści."
        ru: "У заводчика есть лошади любой масти."
        source: { kind: authored }
  - id: kind
    ru: "перен., разг. пошиб, сорт: wszelkiej maści, różnej maści — «всех мастей»"
    examples:
      - pl: "Ciekawe jest to, że one są tutaj przeróżne. Po prostu różnej maści są."
        ru: "Интересно, что они здесь самые разные. Просто всех мастей."
        source: { kind: authored }
      - pl: "Na targu kręcili się oszuści wszelkiej maści."
        ru: "На рынке крутились мошенники всех мастей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Одно польское слово — два русских: MAŚĆ — и «мазь» (в аптеке), и «масть» (у лошади). Карточная масть — не MAŚĆ, а KOLOR: kolor kier, «червовая масть»." }
  - { kind: usage, text: "В значении «мазь» — с предлогом NA или PRZECIW: maść na oparzenia, maść przeciw swędzeniu, «мазь от ожогов, от зуда»; русское «от» здесь не годится. «Всех мастей» — WSZELKIEJ или RÓŻNEJ MAŚCI, родительный качества: politycy wszelkiej maści." }
  - { kind: pronunciation, text: "Один слог: «масьць». ŚĆ — два мягких звука подряд, «сь» и «ць». Множественное — MAŚCI, реже MAŚCIE." }
  - { kind: register, text: "«Мазь» — нейтральное аптечное слово. «Всех мастей» — разговорное и часто неодобрительное, как в русском: oszuści, krętacze wszelkiej maści." }
collocations:
  - { pl: "maść na oparzenia", ru: "мазь от ожогов" }
  - { pl: "smarować maścią", ru: "мазать мазью" }
  - { pl: "wszelkiej maści", ru: "всех мастей" }
  - { pl: "koń siwej maści", ru: "лошадь серой масти" }
family:
  - { pl: "maścić", ru: "мазать (устар.)", relation: root }
  - { pl: "umaszczenie", ru: "окрас, масть", relation: derived }
etymology: "Праславянское *mastь, от *mazati, «мазать»: то, чем мажут. Русский разделил одно слово на два — «мазь» и «масть», — польский сохранил одно MAŚĆ для обоих: окраску животного представляли как «намазанный» цвет."
memory: "Maść — и «мазь», и «масть»: одно слово, как будто цвет коня намазан. Maść NA oparzenia — мазь ОТ ожогов. Ludzie wszelkiej maści — люди всех мастей."
idioms:
  - { pl: "wszelkiej maści", ru: "всех мастей, всякого пошиба" }
