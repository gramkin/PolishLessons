notes:
  - { kind: usage, text: "Корень русскому знаком насквозь — KOPAĆ это «копать», — но покрывает он в польском больше. KOPAĆ значит и «копать» (kopać dół), и «пинать» (kopać piłkę «пинать мяч», kopać kogoś «пинать кого-то»). Русский разводит эти два дела по разным словам, польский держит на одном корне. Отсюда и WYKOPAĆ работает в обе стороны: выкопать яму и выбить мяч. И отсюда же разговорное «выгнать»: WYKOPALI GO Z PRACY — буквально «выпинали с работы»." }
  - { kind: usage, text: "Повелительное WYKOP совпадает по форме с существительным WYKOP, и это та же картина, что у POGRZEB из партии 270. Существительное значит «котлован, выемка», а в футболе «удар от ворот»: WYKOP Z BRAMKI. Глагольная форма выходит из третьего лица WYKOPIE отбрасыванием -ie, и поскольку основой WYKOP- польское слово закончиться может, никакого -ij не вставляется. Сравните с WALNIJ из партии 271, где основа WALN- слово закончить не может." }
  - { kind: pronunciation, text: "Губной согласный основы смягчается перед гласными переднего ряда, и это видно по всему настоящему времени: WYKOPIĘ, WYKOPIESZ, WYKOPIE, WYKOPIEMY, WYKOPIECIE, WYKOPIĄ — везде pi, то есть мягкое п. А в инфинитиве, прошедшем времени и причастии стоит твёрдое p: WYKOPAĆ, WYKOPAŁ, WYKOPANY. Та же мена, что у POGRZEBAĆ при POGRZEBIĘ из партии 270, и она касается всех губных: p, b, m, w, f." }
  - { kind: government, text: "В прямом значении переходный, винительный: WYKOPAĆ COŚ — wykopać dół, wykopać ziemniaki, wykopać studnię. В разговорном значении берёт дополнение в винительном плюс предлог: WYKOPAĆ KOGOŚ Z PRACY, ZA DRZWI. И запомните пословицу, которая в двух языках совпадает дословно: KTO POD KIM DOŁKI KOPIE, SAM W NIE WPADA — «кто другому яму копает, сам в неё попадает». Несовершенная пара — KOPAĆ, а также WYKOPYWAĆ для повторяющегося действия." }
collocations:
  - { pl: "wykopać dół", ru: "выкопать яму" }
  - { pl: "wykopać ziemniaki", ru: "выкопать картошку" }
  - { pl: "wykopać kogoś z pracy", ru: "выгнать кого-либо с работы" }
family:
  - { pl: "kopać", ru: "копать, пинать", relation: aspect, id: kopac }
  - { pl: "wykop", ru: "котлован, удар от ворот", relation: derived }
  - { pl: "kopalnia", ru: "шахта, рудник", relation: derived }
etymology: "Приставка wy- и KOPAĆ «копать», из праславянского *kopati — то же слово, что русское «копать». Значение «пинать» выросло из того же корня через «ударять, разрыхлять ногой», и в русском этой ветки нет. Из гнезда вышли WYKOP «котлован», KOPALNIA «шахта» (то есть место, где копают), KOPIEC «курган», KOPYTO «копыто» и даже OKOP «окоп». Русскому всё гнездо читается само, кроме «пинать»."
memory: "kopać — это и «копать», и «пинать», одним корнем. Поэтому wykopać z pracy значит «выгнать». А повелительное wykop совпадает с существительным wykop «котлован», как pogrzeb."
idioms:
  - { pl: "kto pod kim dołki kopie, sam w nie wpada", ru: "кто другому яму копает, сам в неё попадает" }
  - { pl: "wykopać kogoś za drzwi", ru: "выставить кого-либо за дверь" }
