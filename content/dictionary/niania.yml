  - { pl: "niańka", ru: "нянька", relation: derived }
  - { pl: "opiekunka do dziecka", ru: "няня, сиделка с ребёнком", relation: root }
etymology: "Слово из детской речи, общее для славянских языков; русская «няня» — то же слово. От него NIAŃCZYĆ — «нянчить»."
memory: "Niania — няня; opiekunka do dziecka — то же в объявлениях. Читается «ня́ня». Niańczyć — нянчить."
idioms:
  - { pl: "niańczyć kogoś", ru: "нянчиться с кем-то" }
