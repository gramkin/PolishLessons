notes:
  - { kind: false-friend, text: "NIANIA — «няня», совпадение почти полное. В объявлениях чаще пишут OPIEKUNKA DO DZIECKA, «няня, сиделка с ребёнком». Нянчить — NIAŃCZYĆ." }
  - { kind: usage, text: "Десять форм, женский род, лицо. Основа мягкая: NIANI, NIANIĘ, NIANIĄ. Родительный множественного — NIAŃ. Ласковое обращение — NIANIU!" }
  - { kind: government, text: "Няня к ребёнку — NIANIA DO DZIECKA, DO с родительным. Нанять няню — ZATRUDNIĆ NIANIĘ. Оставить ребёнка с няней — ZOSTAWIĆ DZIECKO Z NIANIĄ." }
  - { kind: pronunciation, text: "Читается «ня́ня», два слога, ударение на первом. NIA — «ня»." }
collocations:
  - { pl: "niania do dziecka", ru: "няня к ребёнку" }
  - { pl: "zatrudnić nianię", ru: "нанять няню" }
  - { pl: "dobra niania", ru: "хорошая няня" }
family:
