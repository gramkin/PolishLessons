        ru: "Посидим ещё полчаса и возвращаемся."
        source: { kind: authored }
  - id: do-time
    ru: "отсидеть (в тюрьме)"
    examples:
      - pl: "Posiedział dwa lata za oszustwo."
        ru: "Он отсидел два года за мошенничество."
        source: { kind: authored }
      - pl: "Posiedzi i wyjdzie, nic mu nie będzie."
        ru: "Отсидит и выйдет, ничего с ним не станет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Приставка po- тут значит «недолго, немного», и это самый полезный урок карточки, потому что правило переносится на целый ряд глаголов. Русский делает то же самое и той же приставкой: POSIEDZIEĆ — «посидеть», POLEŻEĆ — «полежать», POSTAĆ — «постоять», POCZEKAĆ — «подождать», POROZMAWIAĆ — «поговорить», POPRACOWAĆ — «поработать». Выучив один пример, остальные берёшь по аналогии, и притом это полноценный совершенный вид: POSIEDZIAŁEM GODZINĘ значит, что сидение кончилось." }
  - { kind: register, text: "Второе значение — обиходное, но вполне понятное: POSIEDZIAŁ DWA LATA значит «отсидел два года», о тюрьме. В официальном языке скажут ODBYŁ KARĘ POZBAWIENIA WOLNOŚCI. Разницы с русским тут нет никакой — «посидеть» и «отсидеть» в русском тоже различаются только приставкой и контекстом, — но стоит помнить, что по-польски в этом смысле идёт та же POSIEDZIEĆ, а не отдельное слово." }
  - { kind: government, text: "Сколько — винительный без предлога: POSIEDZIEĆ GODZINĘ, CHWILĘ, DWA LATA. Где — предлог NA с местным для поверхности (NA ŁAWCE, NA SCHODACH) и W с местным для помещения (W KUCHNI, W OGRODZIE). При кому — предлог PRZY с местным: POSIEDZIEĆ PRZY CHORYM, PRZY STOLE. Непереходный глагол, поэтому страдательных причастий нет, и форм всего сорок две: сорок одна основная и деепричастие POSIEDZIAWSZY." }
  - { kind: pronunciation, text: "Основа та же, что у SIEDZIEĆ, и мена -ie-/-ia- в прошедшем времени идёт по роду: POSIEDZIELI с ie для мужского лица множественного, POSIEDZIAŁY с ia для всего остального, и мужское единственное POSIEDZIAŁ тоже с ia. Так же ведут себя WIDZIEĆ и SŁYSZEĆ. Повелительное POSIEDŹ оканчивается на мягкий dź, читается «посець» с мягким ц на конце." }
collocations:
  - { pl: "posiedzieć chwilę", ru: "посидеть минутку" }
  - { pl: "posiedzieć przy chorym", ru: "посидеть у больного" }
