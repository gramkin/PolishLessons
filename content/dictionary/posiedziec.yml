family:
  - { pl: "siedzieć", ru: "сидеть", relation: root, id: siedziec }
  - { pl: "usiąść", ru: "сесть", relation: root, id: usiasc }
  - { pl: "posiedzenie", ru: "заседание", relation: derived }
etymology: "Приставка po- в ограничительном значении и SIEDZIEĆ, из праславянского *sěděti — то же слово, что русское «сидеть», с тем же корнем, что в «седло», «сесть», «осёдлый». Приставка po- в этом употреблении тоже общая: она отмеряет действию небольшой срок, и русский пользуется ею точно так же, от «посидеть» до «поработать». Любопытно, что от этого же корня польский произвёл POSIEDZENIE «заседание» — буквально «сидение вместе», — тогда как русский для того же понятия взял «сидеть» с другой приставкой."
memory: "po- значит «недолго», ровно как русское «по-»: posiedzieć «посидеть», poleżeć «полежать», poczekać «подождать», porozmawiać «поговорить». Один пример открывает весь ряд."
idioms:
