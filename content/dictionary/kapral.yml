id: kapral
format: 2
lemma: "kapral"
rank: 4219
pos: noun
pron: { cyr: "ка́праль" }
senses:
  - id: corporal
    ru: "капрал (воинское звание)"
    examples:
      - pl: "Kapral wydał rozkaz żołnierzom."
        ru: "Капрал отдал приказ солдатам."
        source: { kind: authored }
      - pl: "Awansował na kaprala."
        ru: "Его повысили до капрала."
        source: { kind: authored }
      - pl: "Kapral prowadził patrol."
        ru: "Капрал вёл патруль."
        source: { kind: authored }
  - id: martinet
    ru: "строгий командир (перен., о человеке)"
    examples:
      - pl: "Nasz trener jest jak kapral."
        ru: "Наш тренер как фельдфебель."
        source: { kind: authored }
      - pl: "Zachowuje się jak kapral w koszarach."
        ru: "Он ведёт себя как капрал в казарме."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KAPRAL — «капрал», младшее звание в польской армии, примерно «младший сержант». Сержант — SIERŻANT, рядовой — SZEREGOWY. В переносном смысле — «солдафон, муштровщик»." }
  - { kind: usage, text: "Мужской род, лицо. Множественное — KAPRALE, родительный — KAPRALI. Местный и звательный — KAPRALU: PANIE KAPRALU." }
  - { kind: government, text: "Повысить до капрала — AWANSOWAĆ NA KAPRALA, NA с винительным. Под командой капрала — POD DOWÓDZTWEM KAPRALA. Обращение — PANIE KAPRALU." }
  - { kind: pronunciation, text: "Читается «ка́праль»: конечное L мягкое. Ударение на первом слоге. KAPRALA — «капра́ля»." }
collocations:
  - { pl: "awansować na kaprala", ru: "получить звание капрала" }
  - { pl: "panie kapralu", ru: "господин капрал" }
  - { pl: "stopień kaprala", ru: "звание капрала" }
family:
  - { pl: "sierżant", ru: "сержант", relation: root, id: sierzant }
  - { pl: "żołnierz", ru: "солдат", relation: root, id: zolnierz }
  - { pl: "porucznik", ru: "лейтенант", relation: root }
etymology: "Из итальянского CAPORALE, от CAPO «голова, глава». Русское «капрал» — то же слово."
memory: "Kapral — капрал. Panie kapralu! — господин капрал! Awansować na kaprala — стать капралом. Читается «ка́праль»."
