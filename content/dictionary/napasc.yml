etymology: "Снова та же пара праславянских корней: *pad-ti «падать» и *pas-ti «пасти», слившиеся в польском -ŚĆ. Приставка NA- отвечает русскому «на-» и несёт здесь идею направленного наскока: напасть — значит упасть на кого-то сверху, и русское слово построено на том же образе. Для глагола выпаса та же приставка означает полноту действия, «накормить досыта», как в русском «напоить», «наесться». Существительное NAPAŚĆ образовано от глагола прямо, без суффикса, как PRZEPAŚĆ от PRZEPAŚĆ, и значение «клевета» выросло из «нападения словом» — метафора, которой русское «напасть» не проделало, пойдя вместо этого в сторону «беды»."
memory: "Четвёртый в семье: napadn- «напасть», napas- «напасти». Переходный, поэтому есть napadnięty и целых 53 формы. Ударение на приставке, «на́пасьць». И главное: существительное napaść — это «нападение», а не русская «напасть» в смысле беды."
