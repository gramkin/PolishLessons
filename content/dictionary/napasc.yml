notes:
  - { kind: usage, text: "Четвёртый член семьи, и самый важный по смыслу. Основа NAPADN-/NAPAD- значит «напасть»: NAPADNĘ, NAPADŁ, NAPADNIJ, NAPADNIĘTY. Основа NAPAS- значит «напасти скот досыта»: NAPASĘ, NAPASŁ, NAPAŚ, NAPASIONY. Здесь первый глагол переходный, в отличие от UPAŚĆ и WYPAŚĆ, и потому у него есть полный ряд страдательных причастий NAPADNIĘTY и отглагольное существительное NAPADNIĘCIE — отсюда 53 формы, а не 42. Это и есть различие между переходным и непереходным внутри одной семьи." }
  - { kind: pronunciation, text: "Читается «на́пасьць», ударение на приставке: слово двусложное, а польское ударение предпоследнее. Та же картина, что у «у́пасьць», «вы́пасьць», «пше́пасьць», и снова против русского «напа́сть» с ударением на корне. Повелительное наклонение различает два глагола на слух: NAPADNIJ «напади» против NAPAŚ «напаси». Причастие NAPADNIĘTY звучит «нападне́нты», с носовой ę перед t." }
  - { kind: government, text: "Глагол нападения употребляется двумя способами, и оба правильные: NAPAŚĆ NA KOGOŚ, с предлогом NA и винительным, и NAPAŚĆ KOGOŚ, прямо с винительным без предлога. Первый способ обычнее и в точности отвечает русскому «напасть на кого-то». Второй звучит чуть книжнее и чаще встречается в страдательных оборотах: ZOSTAŁ NAPADNIĘTY. Глагол выпаса тоже переходный: NAPAŚĆ BYDŁO. Прямое дополнение само по себе не различает их — различает основа." }
  - { kind: false-friend, text: "Ловушка в существительном, и она крупная. Польское NAPAŚĆ — существительное женского рода со значением «нападение» и, во втором значении, «клевета, нападки»: NAPAŚĆ SŁOWNA, PADŁ OFIARĄ NAPAŚCI. Русское «напасть» как существительное значит совсем другое — «беда, несчастье»: «что за напасть!». Пересечения нет вовсе, и перевести польское NAPAŚĆ русским «напасть» нельзя. Для «беды» в польском есть NIESZCZĘŚCIE или UTRAPIENIE. Зато NAPASTNIK — это и «нападающий» в футболе, и «нападавший» в протоколе полиции." }
