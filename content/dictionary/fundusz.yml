notes:
  - { kind: false-friend, text: "РУССКИЙ «ФОНД» ПОКРЫВАЕТ ДВА ПОЛЬСКИХ СЛОВА. FUNDUSZ — это деньги: средства, денежный или пенсионный фонд. FUNDACJA — это организация, учреждение: fundacja charytatywna. Русское «фонд» годится и там и там, поэтому при переводе на польский надо решать, о деньгах речь или об учреждении." }
  - { kind: usage, text: "Родительный множественного двойной: FUNDUSZY и FUNDUSZÓW, обе формы правильны, как symboli и symbolów. Во множественном слово часто значит просто «средства»: brakuje funduszy «не хватает средств». Предложный — w funduszu." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: FUN-dusz. Конечное sz читается как ш: «фу́ндуш». Во множественном fundusze слышно «фунду́шэ», с ударением на предпоследнем." }
collocations:
  - { pl: "fundusz emerytalny", ru: "пенсионный фонд" }
  - { pl: "brak funduszy", ru: "нехватка средств" }
  - { pl: "fundusze europejskie", ru: "европейские фонды" }
family:
  - { pl: "fundacja", ru: "фонд (организация)", relation: root }
  - { pl: "pieniądze", ru: "деньги", relation: root }
  - { pl: "budżet", ru: "бюджет", relation: root }
etymology: "Из латинского fundus «основание, земельный участок», через немецкое Fonds и французское fonds. То же слово дало русский «фонд» и польскую fundację. Корень fund- виден в fundament «фундамент» и fundować «основывать»."
memory: "fundusz — «фонд» в смысле денег, а организация будет fundacja: русское «фонд» делится надвое. Родительный множественного двойной: funduszy и funduszów. А fundusze часто значит просто «средства»."
idioms:
  - { pl: "brak funduszy", ru: "нехватка средств" }
  - { pl: "fundusz żelazny", ru: "неприкосновенный запас" }
