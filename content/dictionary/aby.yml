# review
id: aby
format: 2
lemma: "aby"
rank: 198
pos: conj
pron: { cyr: "а́бы" }
senses:
  - id: in-order-to
    ru: "чтобы (цель)"
    examples:
      - pl: "Mam mało czasu, aby czytać."
        ru: "У меня мало времени читать."
        source: { kind: tatoeba, id: 5196970 }
      - pl: "Aby zadać pytanie, należy podnieść rękę."
        ru: "Чтобы задать вопрос, необходимо поднять руку."
        source: { kind: tatoeba, id: 13785907 }
      - pl: "Dotknij zwierzę aby usłyszeć dźwięk."
        ru: "Дотронься до животного, чтобы услышать звук."
        source: { kind: tatoeba, id: 1399763 }
  - id: that
    ru: "чтобы (после глаголов желания и просьбы)"
    note: "Если подлежащее меняется, к aby добавляется личное окончание: abym, abyś, abyśmy."
    examples:
      - pl: "Nie chcę, aby o mnie zapomniano."
        ru: "Я не хочу, чтобы обо мне забыли."
        source: { kind: tatoeba, id: 13633164 }
      - pl: "Poproś go, aby przyszedł."
        ru: "Попроси его, чтобы он пришёл."
        source: { kind: authored }
      - pl: "Chcę, abyś wiedział."
        ru: "Я хочу, чтобы ты знал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "aby и żeby значат одно и то же — «чтобы»; aby немного книжнее, żeby частотнее в разговоре." }
  - { kind: usage, text: "При смене подлежащего союз принимает личные окончания: Chcę, abyś przyszedł «Хочу, чтобы ты пришёл»." }
  - { kind: usage, text: "czy aby na pewno — «а точно ли»: Czy aby na pewno to zrobił?" }
collocations:
  - { pl: "aby tylko", ru: "лишь бы" }
  - { pl: "po to, aby", ru: "для того чтобы" }
  - { pl: "czy aby na pewno", ru: "а точно ли" }
etymology: "Сложение a + by, известное с XIV века; тот же элемент by, что в bym, byś и в польском условном наклонении."
memory: "aby и żeby — одно и то же «чтобы», aby лишь чуть книжнее. При смене подлежащего появляются окончания: abym, abyś, abyśmy."
idioms:
  - { pl: "aby tylko", ru: "лишь бы" }
  - { pl: "aby zbyć", ru: "лишь бы отвязаться" }
  - { pl: "czy aby na pewno", ru: "а точно ли" }
formExamples:
  - form: "aby"
    pl: "Linda powstała aby zaśpiewać."
    ru: "Линда встала, чтобы спеть."
    source: { kind: tatoeba, id: 590551 }
  - form: "aby"
    pl: "Strata czasu, aby o tym mówić."
    ru: "Говорить об этом — пустая трата времени."
    source: { kind: tatoeba, id: 3656939 }
  - form: "aby"
    pl: "Zadzwoń, aby potwierdzić rezerwację."
    ru: "Позвони, чтобы подтвердить бронь."
    source: { kind: authored }
