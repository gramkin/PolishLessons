etymology: "В современном польском под одним написанием живут два разных слова. Первое — заимствование двадцатого века из английского STEAK, а то — из древнескандинавского STEIK «жаркое», от глагола со значением «жарить на вертеле»; русский взял то же английское слово, но передал гласную иначе и получил «стейк». Второе STEK — исконное, со значением «скопление, стечение», и связано оно с гнездом ŚCIEKAĆ, STOK, то есть с образом стекания в одно место; отсюда и сочетания вроде STEK BZDUR, где вздор как бы стёк в одну кучу. Утверждать, что русское «стечение» и польское STEK — прямое соответствие форма за формой, я не берусь, но образ в обоих языках один и тот же, и через «стечение обстоятельств» он понятен сразу. Для учащегося важно, что слова два, и различает их управление."
memory: "Два разных слова под одним написанием. Stek из английского steak — это «стейк»; русское «стек» (хлыстик) по-польски не stek. И исконное stek «куча», живое только в дурных сочетаниях: stek bzdur, stek kłamstw, stek wyzwisk — всегда с родительным падежом, и это управление и выдаёт, какое из двух слов перед вами. Читается «стэк», e даёт «э». Форма steku покрывает родительный и местный единственного."
idioms:
