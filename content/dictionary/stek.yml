notes:
  - { kind: false-friend, text: "Русское «стек» и польское STEK — не одно и то же. Польское STEK значит «стейк», кусок жареного мяса, и пришло из английского STEAK. Русский для этого мяса взял другую форму, «стейк», а слово «стек» закрепил за хлыстиком для верховой езды, который по-польски называется PALKA или BAT. Поэтому STEK WOŁOWY это «стейк из говядины», и ничего общего с хлыстом тут нет. Вторая, совсем отдельная трудность: у слова STEK есть исконное польское значение «куча, скопление», и оно живо только в сочетаниях об дурном — STEK BZDUR «куча вздора», STEK KŁAMSTW «поток лжи», STEK WYZWISK «град ругательств». Это два разных слова, совпавших по звучанию." }
  - { kind: usage, text: "Мужской род, неодушевлённое, и склонение простое, девять форм. Запомнить стоит одно: форма STEKU покрывает сразу родительный и местный единственного — BEZ STEKU и W STEKU, два падежа одной формой. Это обычно для мужских основ на -K, где местный берёт окончание -U, а не -IE: так же у ROK с ROKU, у SOK с SOKU. Винительный равен именительному, потому что слово неодушевлённое: ZAMÓWIŁ STEK. Родительный множественного — STEKÓW, именительный множественного — STEKI, безо всяких чередований в основе." }
  - { kind: government, text: "В значении «стейк» слово употребляется с прилагательными: STEK WOŁOWY «стейк из говядины», STEK Z POLĘDWICY «стейк из филея», STEK KRWISTY «стейк с кровью», STEK DOBRZE WYSMAŻONY «хорошо прожаренный». В значении «куча» требует родительного падежа того, чего куча: STEK BZDUR, STEK KŁAMSTW, STEK GŁUPOT. Это управление надо держать отдельно от первого значения, потому что оно и указывает, о каком из двух слов речь: если за STEK идёт родительный множественного с дурным смыслом, это «куча», а не мясо." }
  - { kind: pronunciation, text: "Читается «стэк», один слог, поэтому вопрос об ударении не встаёт. Буква E даёт «э» и не смягчает предшествующего согласного: звучит «стэк», а не «стек». Конечное K глухое и ясное. В форме STEKU слогов два, ударение на первом: «стэ́ку». В родительном множественного STEKÓW буква Ó читается «у», а конечное W оглушается: «стэ́куф». Английского чтения EA здесь нет и быть не может: польский пишет и читает слово по своим правилам." }
