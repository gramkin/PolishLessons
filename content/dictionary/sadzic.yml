# review
id: sadzic
format: 2
lemma: "sądzić"
rank: 206
pos: verb
aspect: imperf
pron: { cyr: "со́ндзиць" }
senses:
  - id: think
    ru: "думать, полагать, считать"
    examples:
      - pl: "Też tak sądzę."
        ru: "Я тоже так считаю."
        source: { kind: tatoeba, id: 6327929 }
      - pl: "Nie sądzę, żeby Tom zrozumiał."
        ru: "Не думаю, что Том понял."
        source: { kind: tatoeba, id: 13660043 }
      - pl: "Ona sądzi, że zawsze ma rację."
        ru: "Она думает, что всегда права."
        source: { kind: tatoeba, id: 982791 }
  - id: opinion
    ru: "sądzić o czymś — думать о чём-либо, оценивать"
    examples:
      - pl: "Co pani o tym sądzi?"
        ru: "Что вы об этом думаете?"
        source: { kind: tatoeba, id: 6327938 }
      - pl: "Co sądzisz o jego pomyśle?"
        ru: "Что ты думаешь о его идее?"
        source: { kind: tatoeba, id: 631446 }
      - pl: "Powiedz, co o tym sądzisz."
        ru: "Скажи, что ты об этом думаешь."
        source: { kind: tatoeba, id: 6328294 }
  - id: judge
    ru: "судить (в суде); судить о ком-либо"
    note: "Прямое значение того же корня: sąd «суд»."
    examples:
      - pl: "Sąd będzie go sądzić w maju."
        ru: "Суд будет судить его в мае."
        source: { kind: authored }
      - pl: "Nie sądź innych."
        ru: "Не суди других."
        source: { kind: authored }
      - pl: "Sądzono go za kradzież."
        ru: "Его судили за кражу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Nie sądzę — самый частый оборот, «не думаю». Sądzę, że… — «полагаю, что…»." }
  - { kind: usage, text: "sądzić o czymś значит «думать о чём-то, оценивать»: Co o tym sądzisz? «Что ты об этом думаешь?»." }
  - { kind: usage, text: "Деепричастие sądząc po… отвечает русскому «судя по…»: Sądząc po akcencie, jest z południa." }
collocations:
  - { pl: "nie sądzę", ru: "не думаю" }
  - { pl: "co sądzisz?", ru: "что ты думаешь?" }
  - { pl: "sądząc po", ru: "судя по" }
  - { pl: "sądzić kogoś", ru: "судить кого-то" }
etymology: "Праславянское *sǫditi от *sǫdъ «суд» — то же слово, что русское «судить». Значение «полагать» выросло из «выносить суждение»."
memory: "Один корень — два значения: sądzić «думать, полагать» (Nie sądzę «Не думаю») и «судить» в суде. И оборот sądząc po… — «судя по…»."
idioms:
  - { pl: "nie sądzę", ru: "не думаю" }
  - { pl: "sądząc po pozorach", ru: "судя по внешности" }
  - { pl: "nie sądźcie, abyście nie byli sądzeni", ru: "не судите, да не судимы будете" }
