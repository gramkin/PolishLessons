# review
id: piekielny
format: 2
lemma: "piekielny"
rank: 4568
pos: adj
pron: { cyr: "пеке́льны" }
senses:
  - id: infernal
    ru: "адский, относящийся к аду"
    examples:
      - pl: "W obrazie widać piekielny ogień."
        ru: "На картине виден адский огонь."
        source: { kind: authored }
      - pl: "Diabeł strzegł piekielnej bramy."
        ru: "Дьявол сторожил адские врата."
        source: { kind: authored }
  - id: terrible
    ru: "адский, жуткий (очень сильный, неприятный)"
    examples:
      - pl: "Na zewnątrz panował piekielny upał."
        ru: "Снаружи стояла адская жара."
        source: { kind: authored }
      - pl: "Mam piekielny ból głowy."
        ru: "У меня адская головная боль."
        source: { kind: authored }
      - pl: "Czeka nas piekielna noc."
        ru: "Нас ждёт адская ночь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PIEKIELNY от PIEKŁO, «ад», и русскому «пекло» прямо родственно: в пекле жарко, а польский ад и есть «пекло». Русское «пекельный» почти забыто, поэтому слово кажется чужим. Не путать с PIEKARNIA, «пекарня»: корень тот же, PIEC — «печь», но смысл разошёлся." }
  - { kind: usage, text: "Без степеней сравнения: PIEKIELNY уже сам предел. Наречие PIEKIELNIE — разговорное усиление, «адски, чертовски»: PIEKIELNIE ZIMNO, PIEKIELNIE DROGI. Форма для мужчин-людей: PIEKIELNI SĘDZIOWIE, «адские судьи» в сказках и мифах." }
  - { kind: government, text: "Обычно стоит перед существительным: PIEKIELNY HAŁAS, PIEKIELNA MASZYNA. После — в устойчивых сочетаниях о самом аде: OGIEŃ PIEKIELNY, MĘKI PIEKIELNE, «адские муки»." }
  - { kind: pronunciation, text: "Читается «пеке́льны», три слога, ударение на предпоследнем. IE после P и K мягкое, L перед N мягкое «ль». Наречие PIEKIELNIE — «пеке́льне»." }
  - { kind: register, text: "В прямом значении — книжное и церковное: MĘKI PIEKIELNE. Как усилитель — разговорное и эмоциональное: PIEKIELNY UPAŁ, PIEKIELNY HAŁAS. PIEKIELNA MASZYNA — устаревшее «адская машина», бомба." }
collocations:
  - { pl: "piekielny upał", ru: "адская жара" }
  - { pl: "męki piekielne", ru: "адские муки" }
  - { pl: "piekielny hałas", ru: "адский шум" }
family:
  - { pl: "piekło", ru: "ад", relation: root, id: pieklo }
  - { pl: "piekielnie", ru: "адски, чертовски", relation: derived }
  - { pl: "piec", ru: "печь", relation: root, id: piec-2 }
etymology: "От PIEKŁO «ад», буквально «место, где пекут», от PIEC «печь». Русское «пекло» — то же слово, но в русском ад назвали иначе, а «пекло» осталось о жаре."
memory: "Piekielny — адский. Piekło — ад, как русское «пекло». Piekielny upał — адская жара, piekielnie zimno — чертовски холодно. Читается «пеке́льны»."
idioms:
  - { pl: "cierpieć męki piekielne", ru: "терпеть адские муки" }
