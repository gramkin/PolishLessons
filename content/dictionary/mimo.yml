etymology: "Сращение старого mimo «мимо, минуя», от minąć «миновать» — то же слово, что русское «мимо». Значение ушло от пространственного «минуя» к уступительному «несмотря на»: то, что препятствие как бы минуют. Прежний смысл уцелел лишь в книжном mimo woli «невольно»."
memory: "mimo — ложный друг, и очень коварный: оно НЕ значит «мимо». Польское mimo — это «несмотря на», с родительным падежом: mimo deszczu, mimo trudności. Русское «мимо» будет obok или koło. Исторически слова действительно одно и то же (от minąć «миновать»), но польское ушло в уступительное значение — препятствие как бы минуют. Три оборота учите целиком: mimo to «несмотря на это», mimo wszystko «несмотря ни на что», mimo że «несмотря на то, что». Старый смысл остался только в mimo woli «невольно»."
idioms:
