notes:
  - { kind: register, text: "Gej — нейтральный современный термин, принятый и в прессе, и в обиходе. Оскорбительного оттенка он не несёт." }
  - { kind: government, text: "«Быть геем» требует творительного падежа: jestem gejem, jest gejem — как и все обозначения лиц." }
  - { kind: usage, text: "Женская пара — lesbijka. Прилагательное — gejowski, а «натурал» будет hetero." }
  - { kind: pronunciation, text: "Заимствование из английского, читается «гэй»: e звучит как «э», j как «й»." }
