        source: { kind: translated, id: 440497 }
  - id: card
    ru: "дама в картах; ферзь в шахматах"
    examples:
      - pl: "Wyłożył damę kier."
        ru: "Он выложил даму червей."
        source: { kind: authored }
      - pl: "Dama bije waleta."
        ru: "Дама бьёт валета."
        source: { kind: authored }
      - pl: "W szachach dama jest najsilniejszą figurą."
        ru: "В шахматах ферзь — самая сильная фигура."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Осторожно с формами dam и damy: гораздо чаще это будущее время от dać «дать» — Dam ci książkę «Я дам тебе книгу», Damy radę «Мы справимся». Существительное узнаётся только по контексту." }
  - { kind: usage, text: "pierwsza dama — «первая леди»; dama dworu — «фрейлина»." }
  - { kind: usage, text: "В картах dama — «дама», в шахматах — «ферзь» (синоним hetman)." }
  - { kind: usage, text: "Французское заимствование, как и русское «дама»; отсюда же damski «дамский»." }
collocations:
  - { pl: "pierwsza dama", ru: "первая леди" }
  - { pl: "dama dworu", ru: "фрейлина" }
  - { pl: "dama kier", ru: "дама червей" }
etymology: "Французское dame, от латинского domina «госпожа». Русское «дама» — то же самое заимствование."
memory: "dama — «дама», французское заимствование, как и русское слово. Главная ловушка не в значении, а в формах: dam и damy гораздо чаще оказываются будущим временем от dać «дать» — Dam ci książkę «Я дам тебе книгу», Damy radę «Мы справимся». Отличает только контекст."
idioms:
  - { pl: "pierwsza dama", ru: "первая леди" }
  - { pl: "dama dworu", ru: "фрейлина" }
