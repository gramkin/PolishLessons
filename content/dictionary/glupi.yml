# review
id: glupi
format: 2
lemma: "głupi"
rank: 342
pos: adj
pron: { cyr: "гуу́пи" }
senses:
  - id: stupid
    ru: "глупый (о человеке)"
    examples:
      - pl: "Nie bądź głupi."
        ru: "Не будь дураком."
        source: { kind: tatoeba, id: 367300 }
      - pl: "Nikt nie uważa, że jesteś głupi."
        ru: "Никто не считает тебя глупым."
        source: { kind: tatoeba, id: 3296856 }
      - pl: "Ona jest taka głupia!"
        ru: "Она такая дура!"
        source: { kind: tatoeba, id: 2143119 }
  - id: silly
    ru: "глупый, дурацкий (о вещах и поступках)"
    examples:
      - pl: "To było bardzo głupie."
        ru: "Это было очень глупо."
        source: { kind: tatoeba, id: 3743445 }
      - pl: "To jest niewiarygodnie głupie."
        ru: "Это невероятно глупо."
        source: { kind: tatoeba, id: 4716908 }
      - pl: "On wiecznie zadaje głupie pytania."
        ru: "Он вечно задаёт глупые вопросы."
        source: { kind: tatoeba, id: 773291 }
notes:
  - { kind: register, text: "Назвать человека głupi — обидно. Мягче сказать niemądry «неумный» или nierozsądny «неразумный»." }
  - { kind: usage, text: "Степени: głupi — głupszy — najgłupszy. Существительные того же корня: głupiec «глупец», głupota «глупость»." }
  - { kind: usage, text: "Nie ma głupich pytań — «Нет глупых вопросов»; głupi jak but — буквально «глуп как ботинок», то есть «глуп как пробка»." }
collocations:
  - { pl: "nie bądź głupi", ru: "не будь дураком" }
  - { pl: "głupie pytanie", ru: "глупый вопрос" }
  - { pl: "głupi jak but", ru: "глуп как пробка" }
  - { pl: "nie ma głupich", ru: "дураков нет" }
etymology: "Праславянское *glupъ — то же слово, что русское «глупый»."
memory: "głupi — «глупый», буква в букву. А сравнение głupi jak but значит «глуп как пробка» — по-польски «как ботинок»."
idioms:
  - { pl: "głupi jak but", ru: "глуп как пробка" }
  - { pl: "nie ma głupich", ru: "дураков нет" }
  - { pl: "nie ma głupich pytań", ru: "нет глупых вопросов" }
