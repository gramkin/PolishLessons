notes:
  - { kind: false-friend, text: "WYZWAĆ — не «вызвать врача» или «вызвать такси»: это WEZWAĆ — WEZWAĆ LEKARZA, POGOTOWIE, POLICJĘ. WYZWAĆ — «бросить вызов»: WYZWAĆ NA POJEDYNEK. И второе: WYZWAĆ KOGOŚ OD + родительный — «обозвать»: WYZWAĆ OD KŁAMCÓW, «обозвать лжецом». WYZWANIE — «вызов, испытание»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное WYZWANY и деепричастие WYZWAWSZY. Спряжение: WYZWĘ, WYZWIESZ, WYZWĄ; повелительное WYZWIJ. Видовой партнёр — WYZYWAĆ: WYZYWAĆ KOGOŚ — «оскорблять, обзывать»." }
  - { kind: government, text: "Кого на что — винительный и NA с винительным: WYZWAĆ KOGOŚ NA POJEDYNEK, DO WALKI — с DO и родительным. Обозвать кем — OD с родительным множественного: WYZWAĆ OD TCHÓRZY. Вызов врача — только WEZWAĆ." }
  - { kind: pronunciation, text: "Читается «вы́зваць», два слога, ударение на первом. ZW — «зв», звонкие. Конечное Ć — «ць». WYZWĘ — «вы́звэ», WYZWIJ — «вы́звий»." }
  - { kind: register, text: "«Вызвать на бой» — книжное и спортивное. «Обозвать» — разговорное. WYZWISKO — «ругательство, обзывательство». В быту «вызвать» на поединок чаще RZUCIĆ WYZWANIE." }
collocations:
  - { pl: "wyzwać na pojedynek", ru: "вызвать на дуэль" }
  - { pl: "wyzwać kogoś od idiotów", ru: "обозвать кого-то идиотом" }
  - { pl: "wyzwać do walki", ru: "вызвать на бой" }
family:
  - { pl: "wyzywać", ru: "вызывать; обзывать", relation: aspect }
  - { pl: "wyzwanie", ru: "вызов, испытание", relation: derived, id: wyzwanie }
  - { pl: "wezwać", ru: "вызвать (врача, полицию)", relation: root, id: wezwac }
etymology: "Приставка WY- «вы-» плюс ZWAĆ «звать», праславянское *zъvati, то же, что русское «звать», «вызвать». Польский развёл WYZWAĆ «бросить вызов» и WEZWAĆ «позвать на помощь»."
memory: "Wyzwać — вызвать на бой: wyzwać na pojedynek. Wyzwać od idiotów — обозвать. Вызвать врача — wezwać! Wyzwanie — вызов. Читается «вы́зваць»."
idioms:
  - { pl: "wyzwać los", ru: "бросить вызов судьбе" }
