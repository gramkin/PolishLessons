  - form: "pokazuj"
    pl: "Nie pokazuj mi więcej jej zdjęcia."
    ru: "Не показывай мне больше её фотографию."
    source: { kind: translated, id: 2977456 }
  - form: "pokazuj"
    pl: "Nie pokazuj nikomu tego listu."
    ru: "Не показывай никому это письмо."
    source: { kind: authored }
  - form: "pokazują"
    pl: "Czy w tym tygodniu pokazują jakieś dobre filmy?"
    ru: "На этой неделе показывают какие-нибудь хорошие фильмы?"
    source: { kind: translated, id: 6404053 }
  - form: "pokazują"
    pl: "Statystyki pokazują, że nasz poziom życia podniósł się."
    ru: "Статистика показывает, что наш уровень жизни вырос."
    source: { kind: translated, id: 352969 }
  - form: "pokazują"
    pl: "Statystyki pokazują, że światowa populacja zwiększa się."
    ru: "Статистика показывает, что население мира растёт."
    source: { kind: translated, id: 1452431 }
  - form: "pokazują"
    pl: "Statystyki pokazują, że coraz więcej osób cierpi na raka."
    ru: "Статистика показывает, что всё больше людей болеют раком."
    source: { kind: translated, id: 2900660 }
  - form: "pokazuje"
    pl: "On pokazuje pazury."
    ru: "Он показывает когти."
    source: { kind: translated, id: 4615319 }
  - form: "pokazuje"
    pl: "Maryja pokazuje lustro."
    ru: "Мария показывает зеркало."
    source: { kind: translated, id: 11502768 }
  - form: "pokazuje"
    pl: "Ten znak pokazuje drogę."
    ru: "Этот знак показывает дорогу."
    source: { kind: translated, id: 365394 }
  - form: "pokazuje"
    pl: "Praktyka pokazuje, że pieniądze szczęścia nie dają."
    ru: "Практика показывает, что деньги счастья не приносят."
    source: { kind: translated, id: 6404060 }
  - form: "pokazywać"
    pl: "Nieładnie jest pokazywać komuś jezyk."
    ru: "Некрасиво показывать кому-то язык."
    source: { kind: translated, id: 1348728 }
  - form: "pokazywać"
    pl: "Niegrzecznie jest pokazywać ludzi palcami."
    ru: "Невежливо показывать на людей пальцем."
    source: { kind: translated, id: 352656 }
  - form: "pokazywać"
    pl: "Nie powinieneś był pokazywać Tomowi zdjęć."
    ru: "Тебе не следовало показывать Тому фотографии."
    source: { kind: translated, id: 3743428 }
  - form: "pokazywać"
    pl: "Kiedy ta ikonka powinna się pokazywać na ekranie?"
    ru: "Когда эта иконка должна появляться на экране?"
    source: { kind: tatoeba, id: 3458678 }
  - form: "pokazywaliście"
    pl: "Pokazywaliście to zdjęcie Tomowi?"
    ru: "Вы показывали эту фотографию Тому?"
    source: { kind: translated, id: 6404024 }
  - form: "pokazywaliście"
    pl: "Pokazywaliście Tomowi swoje zdjęcia ze ślubu?"
    ru: "Вы показывали Тому свои свадебные фотографии?"
    source: { kind: translated, id: 6404031 }
  - form: "pokazywaliście"
    pl: "Pokazywaliście komuś te dokumenty?"
    ru: "Вы показывали кому-нибудь эти документы?"
    source: { kind: authored }
  - form: "pokazywaliśmy"
    pl: "Nie pokazywaliśmy tego nikomu."
    ru: "Мы никому этого не показывали."
    source: { kind: translated, id: 6404143 }
  - form: "pokazywaliśmy"
    pl: "Nie pokazywaliśmy się tam więcej."
    ru: "Больше мы там не показывались."
    source: { kind: tatoeba, id: 6404132 }
  - form: "pokazywaliśmy"
    pl: "Już mu to wcześniej pokazywaliśmy."
    ru: "Мы ему это уже раньше показывали."
    source: { kind: translated, id: 6404112 }
  - form: "pokazywaliśmy"
    pl: "Całe popołudnie pokazywaliśmy mamie nasze zdjęcia z wakacji."
    ru: "Весь день мы показывали маме наши отпускные фотографии."
    source: { kind: translated, id: 6381375 }
  - form: "pokazywał"
    pl: "Termometr pokazywał wtedy 30 stopni."
    ru: "Термометр показывал тогда тридцать градусов."
    source: { kind: translated, id: 3184814 }
  - form: "pokazywał"
    pl: "Od dawna nie pokazywał się w klubie."
    ru: "Он давно не показывался в клубе."
    source: { kind: translated, id: 6404134 }
  - form: "pokazywał"
    pl: "Jej zegarek pokazywał trzecią nad ranem."
    ru: "Её часы показывали три часа ночи."
    source: { kind: translated, id: 531852 }
  - form: "pokazywałeś"
    pl: "Pokazywałeś komuś ten list?"
    ru: "Ты кому-нибудь показывал это письмо?"
    source: { kind: translated, id: 6404035 }
  - form: "pokazywałeś"
    pl: "Pokazywałeś to zdjęcie Tomowi?"
    ru: "Ты показывал эту фотографию Тому?"
    source: { kind: translated, id: 6404025 }
  - form: "pokazywałeś"
    pl: "Pokazywałeś Tomowi swoje zdjęcia z wesela?"
    ru: "Ты показывал Тому свои свадебные фотографии?"
    source: { kind: translated, id: 6404030 }
  - form: "pokazywałeś"
    pl: "Nie pokazywałeś tego nikomu innemu, prawda?"
    ru: "Ты ведь никому больше этого не показывал?"
    source: { kind: translated, id: 6404085 }
