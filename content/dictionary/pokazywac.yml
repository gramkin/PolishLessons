# review
id: pokazywac
format: 2
lemma: "pokazywać"
rank: 1237
pos: verb
aspect: imperf
aspectPair: pokazac
pron: { cyr: "показы́ваць" }
senses:
  - id: show
    ru: "показывать"
    examples:
      - pl: "Nie pokazuj tego Tomowi."
        ru: "Не показывай этого Тому."
        source: { kind: translated, id: 6554032 }
      - pl: "Maryja pokazuje lustro."
        ru: "Мария показывает зеркало."
