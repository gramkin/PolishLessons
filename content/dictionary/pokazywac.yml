        source: { kind: translated, id: 2977456 }
  - id: indicate
    ru: "о приборах и данных: показывать, свидетельствовать"
    examples:
      - pl: "Statystyki pokazują, że nasz poziom życia podniósł się."
        ru: "Статистика показывает, что наш уровень жизни вырос."
        source: { kind: translated, id: 352969 }
      - pl: "Termometr pokazywał wtedy 30 stopni."
        ru: "Термометр показывал тогда тридцать градусов."
        source: { kind: translated, id: 3184814 }
      - pl: "Ten znak pokazuje drogę."
        ru: "Этот знак показывает дорогу."
        source: { kind: translated, id: 365394 }
  - id: point
    ru: "указывать пальцем; показываться, появляться"
    examples:
      - pl: "Niegrzecznie jest pokazywać ludzi palcami."
        ru: "Невежливо показывать на людей пальцем."
        source: { kind: translated, id: 352656 }
      - pl: "Nieładnie jest pokazywać komuś jezyk."
        ru: "Некрасиво показывать кому-то язык."
        source: { kind: translated, id: 1348728 }
      - pl: "Kiedy ta ikonka powinna się pokazywać na ekranie?"
        ru: "Когда эта иконка должна появляться на экране?"
        source: { kind: tatoeba, id: 3458678 }
notes:
  - { kind: government, text: "pokazywać komuś coś «показывать кому-то что-то» — дательный и винительный, как в русском." }
  - { kind: usage, text: "Возвратное pokazywać się значит «показываться, появляться»: Od dawna nie pokazywał się w klubie." }
  - { kind: usage, text: "О приборах и исследованиях значит «показывать, свидетельствовать»: Statystyki pokazują, że…" }
  - { kind: usage, text: "Вид несовершенный; совершенный — pokazać, карточка уже есть." }
collocations:
  - { pl: "pokazywać palcem", ru: "показывать пальцем" }
  - { pl: "statystyki pokazują", ru: "статистика показывает" }
  - { pl: "pokazywać się", ru: "показываться" }
etymology: "Приставка po- и kazać в старом значении «являть, указывать». Русское «показывать» собрано ровно теми же частями."
memory: "pokazywać — «показывать», с дательным и винительным: pokazywać komuś coś. Возвратное pokazywać się значит «показываться, появляться». Совершенный вид — pokazać."
idioms:
  - { pl: "pokazywać palcem", ru: "показывать пальцем" }
  - { pl: "statystyki pokazują", ru: "статистика показывает" }
  - { pl: "pokazywać się", ru: "показываться" }
