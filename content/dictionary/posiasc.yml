notes:
  - { kind: false-friend, text: "POSIĄŚĆ — не «посидеть» (это POSIEDZIEĆ) и не «посадить». Это «завладеть, стать обладателем» или «овладеть знанием». Обладать постоянно — POSIADAĆ: POSIĄŚĆ WIEDZĘ «овладеть знаниями», POSIADAĆ WIEDZĘ «обладать знаниями»." }
  - { kind: usage, text: "Совершенный вид, спряжение с чередованиями, как у SIĄŚĆ «сесть»: POSIĄDĘ, POSIĄDZIESZ, POSIĄDĄ; прошедшее POSIADŁ, POSIADŁA, но мужско-личное POSIEDLI (A → E). Страдательное причастие — POSIĄDNIĘTY. Мужско-личное POSIĄDNIĘCI в карточку не включено: завладевают вещами и знаниями, а не группой людей." }
  - { kind: government, text: "Что — винительный падеж: POSIĄŚĆ MAJĄTEK, POSIĄŚĆ UMIEJĘTNOŚĆ. В отрицании — родительный: NIE POSIADŁ TEJ WIEDZY." }
  - { kind: register, text: "Книжное слово. В быту говорят ZDOBYĆ, NAUCZYĆ SIĘ, OPANOWAĆ. Устаревшее значение «овладеть женщиной» встречается в старой прозе и в переводах Библии." }
collocations:
