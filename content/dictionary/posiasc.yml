etymology: "Приставка PO- плюс SIĄŚĆ «сесть»: завладеть — буквально «усесться на чём-то». Того же корня POSIADAĆ «владеть» и русское «сесть»."
memory: "Posiąść — сесть на добро и завладеть им; posiedli — они завладели, а не «посидели»."
idioms:
