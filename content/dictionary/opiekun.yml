etymology: "От OPIEKA «опека, забота», и дальше от праславянского *pekti «печься, заботиться» — того же корня, что PIEC «печь» и русское «печься о чём-то», «попечение», «беспечный». Русская «опека» и «опекун» построены из тех же частей, и это один из самых чистых случаев совпадения в этом словаре: приставка та же, корень тот же, суффикс -UN отвечает русскому -УН, как в BIEGUN и «бегуне». Любопытно, что исходное значение корня было кулинарным: заботиться значило «печься», готовить на огне, и переносный смысл вырос из домашнего труда. В русском это видно в паре «печь» и «печься о ком-то», которая в современном языке уже кажется случайным созвучием."
memory: "Прямой родственник русского «опекуна», от opieka «опека» — редкий случай полного совпадения. Но шире: opiekun grupy — «руководитель группы», opiekun klasy — «классный руководитель», opiekun pracy — «научный руководитель». Именительный множественного только opiekunowie, формы opiekuni нет — в отличие от ambasador, у которого их две. Корень тот же, что в piec «печь»: заботиться исходно значило «печься»."
