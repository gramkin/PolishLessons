notes:
  - { kind: false-friend, text: "Один из немногих случаев, где угадывать не нужно: OPIEKUN это «опекун», а OPIEKA — «опека», и корень общий, праславянский. Расхождение только в объёме: польское OPIEKUN шире русского. Кроме юридического опекуна оно означает руководителя группы, куратора работы, классного воспитателя — OPIEKUN GRUPY, OPIEKUN PRACY MAGISTERSKIEJ, OPIEKUN KLASY. По-русски в этих случаях говорят «руководитель», «куратор», «классный руководитель», а не «опекун». Так что русское слово годится для суда и не годится для школы и университета." }
  - { kind: government, text: "Мужской род, одушевлённое, лицо. Винительный равен родительному: SZUKALI OPIEKUNA. Местный OPIEKUNIE, где N смягчается перед -IE. Именительный множественного только OPIEKUNOWIE, на -OWIE, и формы OPIEKUNI не существует — в этом отличие от AMBASADOR, у которого два равноправных множественных. Чего или кого опекун — родительный без предлога: OPIEKUN DZIECKA, OPIEKUN GRUPY, OPIEKUN PRACY. Заботиться — глагол OPIEKOWAĆ SIĘ с творительным: OPIEKOWAĆ SIĘ DZIECKIEM." }
  - { kind: pronunciation, text: "Читается «опе́кун», ударение на предпоследнем слоге из трёх, как и в русском «опекуне». Сочетание PIE даёт мягкое «пе». В местном падеже OPIEKUNIE буква N смягчается и звучит «не»: «опеку́не», слогов становится четыре, и ударение переходит на предпоследний. В именительном множественного OPIEKUNOWIE пять слогов и ударение снова на предпоследнем: «опекуно́ве». Слово для русского фонетически простое." }
  - { kind: usage, text: "Частотные сочетания: OPIEKUN PRAWNY «законный опекун», OPIEKUN GRUPY, OPIEKUN KLASY «классный руководитель», OPIEKUN PRACY MAGISTERSKIEJ «научный руководитель», POD OPIEKĄ KOGOŚ «под чьей-то опекой». Женская форма OPIEKUNKA употребительна и означает в том числе няню: OPIEKUNKA DO DZIECKA. Существительное OPIEKA входит в обороты OPIEKA MEDYCZNA «медицинская помощь» и OPIEKA SPOŁECZNA «социальная защита», и в этих сочетаниях русское «опека» уже не годится." }
