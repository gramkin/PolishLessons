# review
id: zwiazek
format: 2
lemma: "związek"
rank: 500
pos: noun
pron: { cyr: "зви́онзэк" }
senses:
  - id: connection
    ru: "связь, отношение"
    examples:
      - pl: "Nie ma związku."
        ru: "Связи нет."
        source: { kind: tatoeba, id: 13785992 }
      - pl: "Jaki to ma związek z tamtym?"
        ru: "Как это с тем связано?"
        source: { kind: tatoeba, id: 2519055 }
      - pl: "To nie ma żadnego związku z tobą."
        ru: "Это не имеет к тебе никакого отношения."
        source: { kind: tatoeba, id: 929482 }
  - id: union
    ru: "союз, объединение; химическое соединение"
    examples:
      - pl: "Czy związek brał udział w demonstracji?"
        ru: "Профсоюз принимал участие в демонстрации?"
        source: { kind: tatoeba, id: 960716 }
      - pl: "Niech żyje Związek Radziecki!"
        ru: "Ура СССР!"
        source: { kind: tatoeba, id: 737371 }
      - pl: "Lipidy są związkami organicznymi."
        ru: "Липиды — органические соединения."
        source: { kind: translated, id: 12239965 }
notes:
  - { kind: usage, text: "Одно польское слово покрывает сразу русские «связь», «союз», «соединение» и «отношения». Различает их только контекст." }
  - { kind: usage, text: "Канцелярская формула w związku z czymś — «в связи с чем-то»: W związku z tym piszę do Państwa." }
  - { kind: usage, text: "Частые сочетания: związek zawodowy «профсоюз», Związek Radziecki «Советский Союз», związek małżeński «брак», być w związku «состоять в отношениях»." }
  - { kind: usage, text: "В химии związek — это «соединение»: związek chemiczny, związek organiczny." }
collocations:
  - { pl: "w związku z tym", ru: "в связи с этим" }
  - { pl: "związek zawodowy", ru: "профсоюз" }
  - { pl: "nie ma związku", ru: "связи нет" }
  - { pl: "być w związku", ru: "состоять в отношениях" }
etymology: "Из z- + wiązać «вязать», праславянское *vęzati. Русские «связь», «союз» и «вязать» — то же гнездо."
memory: "związek — от wiązać «вязать», ровно как русская «связь». Одно слово покрывает четыре русских: nie ma związku «связи нет», związek zawodowy «профсоюз», związek chemiczny «химическое соединение», być w związku «быть в отношениях». И запомните канцелярское w związku z — «в связи с»."
idioms:
  - { pl: "w związku z tym", ru: "в связи с этим" }
  - { pl: "związek zawodowy", ru: "профсоюз" }
  - { pl: "związek chemiczny", ru: "химическое соединение" }
formExamplesSkip:
  - { form: "związku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
