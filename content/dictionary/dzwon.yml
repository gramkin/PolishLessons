etymology: "От праславянского корня ZVON-, давшего и русский «звон», и «звонить», и «звук» через родственное чередование. Польское начальное DZW- на месте русского ЗВ- появилось из-за того, что в западнославянских языках перед сонорным развился призвук, и получилось слитное «дз». Значение разошлось чуть-чуть: русский «звон» это звук, а польский DZWON это предмет, который его издаёт. Для звука польский держит DŹWIĘK, родственное русскому «звуку»."
memory: "Соответствие открывает целое гнездо: польское dzw- отвечает русскому зв-, и dzwon это «звон», dzwonić «звонить», dzwonek «звонок», dźwięk «звук». Но значение сдвинуто: dzwon это сам колокол, предмет, а не звук. Сочетание dz читается одним слитным звуком, которого в русском нет. Неожиданное второе значение: spodnie dzwony это брюки клёш, по форме штанины."
