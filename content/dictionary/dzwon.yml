notes:
  - { kind: false-friend, text: "За этим словом стоит соответствие, открывающее целое гнездо. Польское DZW- отвечает русскому ЗВ-: DZWON и «звон», DZWONIĆ и «звонить», DZWONEK и «звонок», DŹWIĘK и «звук». Сочетание DZ читается слитно, одним звуком, и в этом вся разница на слух. Значение при этом сдвинуто: польский DZWON это именно колокол, предмет, а не звук; звук будет DŹWIĘK или BICIE DZWONÓW." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже основа смягчается: DZWON, но W DZWONIE. Множественное DZWONY работает в двух значениях сразу, и различает их только контекст: BIŁY DZWONY это «били колокола», а NOSIŁ DZWONY это «носил клёш». Второе значение разговорное и пришло из моды шестидесятых, когда штанина внизу расширялась, как колокол." }
  - { kind: government, text: "Бить в колокола — BIĆ W DZWONY, предлог W с винительным множественного, в точности как по-русски. Звон колоколов — BICIE DZWONÓW, родительный множественного без предлога. На колоколе — предлог NA с местным падежом: NA DZWONIE. Звонить в колокол — DZWONIĆ, глагол без дополнения, а по телефону — DZWONIĆ DO KOGOŚ, предлог DO с родительным, где русский берёт дательный." }
  - { kind: pronunciation, text: "Читается «дзвон», один слог. Сочетание DZ даёт слитное «дз», один звук, а не два: язык ставится как для «д», но выходит звонкое «з». Для русского уха это самое непривычное место, потому что в русском такого звука нет вовсе. В местном падеже DZWONIE слышно «дзво́не», с мягким «не». Во множественном DZWONY конечное Y даёт «ы»: «дзво́ны»." }
  - { kind: register, text: "Слово нейтральное, часто церковное: DZWON KOŚCIELNY, BICIE DZWONÓW, DZWONNICA «колокольня». В Кракове главный колокол Вавельского собора называется ZYGMUNT, и его звон слышат только по большим праздникам. Переносное BIĆ NA ALARM значит «бить тревогу». Разговорное DZWONY о брюках звучит слегка насмешливо и всегда во множественном числе." }
