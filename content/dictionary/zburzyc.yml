  - { pl: "wzburzyć", ru: "взволновать, возмутить", relation: root }
etymology: "Приставка Z- плюс BURZYĆ «рушить, разрушать», того же корня, что BURZA «буря»."
memory: "Burza — буря: zburzyć — снести, как бурей. Zburzyli stary dom — старый дом снесли."
idioms:
  - { pl: "zburzyć komuś spokój", ru: "нарушить чей-то покой" }
formExamplesSkip:
  - { form: "zburzeni", reason: "мужско-личная форма страдательного причастия: сносят здания и стены, а не людей" }
