# review
id: zburzyc
format: 2
lemma: "zburzyć"
rank: 5814
pos: verb
aspect: perf
pron: { cyr: "збу́жыць" }
senses:
  - id: demolish
    ru: "снести, разрушить (здание, стену)"
    examples:
      - pl: "Zburzę ten stary mur."
        ru: "Я снесу эту старую стену."
        source: { kind: translated, id: 9044307 }
      - pl: "Dom, w którym mieszkaliśmy, został zburzony."
        ru: "Дом, в котором мы жили, снесли."
        source: { kind: translated, id: 933331 }
      - pl: "Nie warto remontować tego starego budynku. Lepiej go zburzyć."
        ru: "Ремонтировать это старое здание не стоит. Лучше его снести."
        source: { kind: translated, id: 1611433 }
  - id: ruin
    ru: "разрушить, нарушить (покой, порядок, планы)"
    examples:
      - pl: "Jeden telefon zburzył cały nasz spokój."
        ru: "Один звонок нарушил весь наш покой."
        source: { kind: authored }
      - pl: "Ta wiadomość zburzyła wszystkie moje plany."
        ru: "Эта новость разрушила все мои планы."
        source: { kind: authored }
  - id: ruffle
    ru: "растрепать, взъерошить (волосы)"
    examples:
      - pl: "Wiatr zburzył jej starannie ułożone włosy."
        ru: "Ветер растрепал её аккуратно уложенные волосы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZBURZYĆ — «снести, разрушить» (дом, стену), а не «взбурлить» и не «взбудоражить». «Возмутить, взволновать» — это WZBURZYĆ: WZBURZONY TŁUM «возмущённая толпа». Одна буква в приставке меняет смысл." }
  - { kind: government, text: "Что — винительный: ZBURZYĆ DOM, ZBURZYĆ MUR. В переносном смысле — покой, порядок, планы: ZBURZYĆ KOMUŚ SPOKÓJ «нарушить чей-то покой». Страдательный оборот — ZOSTAĆ ZBURZONYM: DOM ZOSTAŁ ZBURZONY «дом снесли»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — BURZYĆ: BURZĄ STARY DOM «сносят старый дом», ZBURZYLI GO «его снесли». Спряжение на -Ę/-Y: ZBURZĘ, ZBURZYSZ, ZBURZĄ. Мужско-личное страдательное ZBURZENI в карточку не включено: сносят здания, а не людей." }
  - { kind: pronunciation, text: "Читается «збу́жыць»: RZ — «ж», Y — «ы», ударение на предпоследнем слоге. ZBURZONY — «збужо́ны»." }
collocations:
  - { pl: "zburzyć dom", ru: "снести дом" }
  - { pl: "zburzyć mur", ru: "разрушить стену" }
  - { pl: "zburzyć do fundamentów", ru: "снести до основания" }
  - { pl: "zburzyć włosy", ru: "растрепать волосы" }
family:
  - { pl: "burzyć", ru: "разрушать, сносить", relation: aspect }
  - { pl: "burza", ru: "буря, гроза", relation: root, id: burza }
