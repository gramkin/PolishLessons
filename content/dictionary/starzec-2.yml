        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STARZEĆ SIĘ — «стареть», только с SIĘ. Не путать со STARZEC «старик» (существительное) и STARAĆ SIĘ «стараться». STARZENIE SIĘ — «старение»: STARZENIE SIĘ SPOŁECZEŃSTWA «старение общества»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZESTARZEĆ SIĘ «состариться». Спряжение: STARZEJĘ SIĘ, STARZEJESZ SIĘ, STARZEJĄ SIĘ; прошедшее STARZAŁ SIĘ, STARZELI SIĘ. Повелительное и безличное STARZANO в карточку не включены. Причастие STARZEJĄCY SIĘ — «стареющий»." }
  - { kind: government, text: "Без дополнения. Как — наречие: STARZEĆ SIĘ PIĘKNIE, SZYBKO. От чего — OD или Z с родительным: OD SŁOŃCA, Z TROSKI." }
  - { kind: pronunciation, text: "Читается «ста́жэць»: RZ — «ж», ударение на первом слоге. STARZEJĘ SIĘ — «стажэ́е сен»." }
  - { kind: register, text: "Нейтральное слово. Комплимент — PIĘKNIE SIĘ STARZEJESZ «ты красиво стареешь». STARZEJĄCE SIĘ SPOŁECZEŃSTWO — частый термин в прессе." }
collocations:
  - { pl: "starzeć się z godnością", ru: "стареть с достоинством" }
  - { pl: "starzejące się społeczeństwo", ru: "стареющее общество" }
  - { pl: "pięknie się starzeć", ru: "красиво стареть" }
family:
  - { pl: "stary", ru: "старый", relation: root, id: stary }
  - { pl: "starzec", ru: "старик", relation: derived, id: starzec }
  - { pl: "zestarzeć", ru: "состариться (ZESTARZEĆ SIĘ)", relation: aspect }
etymology: "От STARY «старый», праславянское *starъ, как русское «стареть». Польское RZ — смягчённое R перед E."
memory: "Starzeć się — стареть: wszyscy się starzejemy. Starzec — старик, starać się — стараться, не путать!"
