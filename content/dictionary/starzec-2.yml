pron: { cyr: "ста́жэць" }
senses:
  - id: age
    ru: "стареть (STARZEĆ SIĘ)"
    examples:
      - pl: "Wszyscy się starzejemy."
        ru: "Мы все стареем."
        source: { kind: authored }
