notes:
  - { kind: government, text: "Доволен чем-то — zadowolony z czegoś, с предлогом z и родительным падежом: zadowolony z wyniku «доволен результатом». Русское «доволен» требует творительного — это главное расхождение." }
  - { kind: usage, text: "wyglądać na zadowolonego — «выглядеть довольным»: после wyglądać na идёт винительный падеж." }
  - { kind: usage, text: "Существительное — zadowolenie «удовлетворение»; глагол zadowolić «удовлетворить»." }
  - { kind: false-friend, text: "zadowolony значит «довольный», а не «счастливый»: счастливый — szczęśliwy, чувство сильнее." }
collocations:
  - { pl: "zadowolony z czegoś", ru: "довольный чем-либо" }
  - { pl: "wyglądać na zadowolonego", ru: "выглядеть довольным" }
  - { pl: "bardzo zadowolony", ru: "очень довольный" }
family:
  - { pl: "zadowolenie", ru: "удовлетворение", relation: root }
  - { pl: "szczęśliwy", ru: "счастливый", relation: root, id: szczesliwy }
etymology: "От zadowolić «удовлетворить», того же корня, что dosyć «достаточно» и русское «довольно». Образ один: «получивший вдоволь»."
memory: "zadowolony — «довольный», но с предлогом z и родительным падежом: zadowolony z wyniku. Русское «доволен» требует творительного, это главное расхождение."
