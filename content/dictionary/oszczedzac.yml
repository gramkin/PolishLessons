# review
id: oszczedzac
format: 2
lemma: "oszczędzać"
rank: 4492
pos: verb
pron: { cyr: "ошчэ́ндзаць" }
senses:
  - id: save
    ru: "копить, экономить"
    examples:
      - pl: "Oszczędzam na nowy samochód."
        ru: "Я коплю на новую машину."
        source: { kind: authored }
      - pl: "Trzeba oszczędzać wodę."
        ru: "Нужно экономить воду."
        source: { kind: authored }
      - pl: "Oszczędzają każdy grosz."
        ru: "Они экономят каждый грош."
        source: { kind: authored }
  - id: spare
    ru: "беречь, щадить"
    examples:
      - pl: "Oszczędzaj siły na finał."
        ru: "Береги силы для финала."
        source: { kind: authored }
      - pl: "Lekarz kazał mu oszczędzać nogę."
        ru: "Врач велел ему беречь ногу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OSZCZĘDZAĆ — «копить, экономить», а также «беречь, щадить». Русское «щадить» — родственное слово, и второе значение совпадает: OSZCZĘDZAĆ KOGOŚ «щадить кого-то». Сбережения — OSZCZĘDNOŚCI, бережливый — OSZCZĘDNY." }
  - { kind: usage, text: "Несовершенный вид; совершенный — OSZCZĘDZIĆ. Спряжение на -AM: OSZCZĘDZAM, OSZCZĘDZASZ, OSZCZĘDZAJĄ. Частое OSZCZĘDZAĆ NA COŚ «копить на что-то»." }
  - { kind: government, text: "Что экономить — винительный: OSZCZĘDZAĆ PRĄD. На что копить — NA с винительным: NA DOM, NA WAKACJE. На чём экономить — NA с предложным: OSZCZĘDZAĆ NA JEDZENIU. Кого щадить — винительный: OSZCZĘDZAĆ DZIECI." }
  - { kind: pronunciation, text: "Читается «ошчэ́ндзаць»: SZCZ — «шч», Ę перед DZ — «эн». Ударение на предпоследнем слоге. OSZCZĘDZAM — «ошчэ́ндзам»." }
  - { kind: register, text: "Нейтральное слово. В рекламе — OSZCZĘDZAJ Z NAMI «экономь с нами»." }
collocations:
  - { pl: "oszczędzać na coś", ru: "копить на что-то" }
  - { pl: "oszczędzać prąd", ru: "экономить электричество" }
  - { pl: "oszczędzać siły", ru: "беречь силы" }
family:
  - { pl: "oszczędzić", ru: "сэкономить, пощадить", relation: aspect, id: oszczedzic }
  - { pl: "oszczędności", ru: "сбережения", relation: derived, id: oszczednosci }
  - { pl: "wydawać", ru: "тратить", relation: antonym, id: wydawac }
etymology: "От праславянского *ščęditi «беречь, щадить», как русское «щадить», «пощада». Польское OSZCZĘD- с носовым Ę сохраняет древний носовой гласный, утраченный в русском."
memory: "Oszczędzać — копить, экономить: oszczędzam na samochód. Oszczędzać siły — беречь силы. Родственник русского «щадить»."
idioms:
  - { pl: "oszczędzać na czarną godzinę", ru: "копить на чёрный день" }
