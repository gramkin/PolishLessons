etymology: "От PACJENT, из латинского PATIENS «терпящий, страдающий», причастия от PATI «терпеть, страдать». То есть пациент буквально «терпящий», и тот же корень дал PASJA «страсть», через церковное значение страдания. Надёжно в латинское гнездо входят PACJENT, PASJA и PASYWNY «пассивный», то есть «претерпевающий». Русский «пациент» пришёл той же дорогой через латынь и немецкий. Польская женская форма образована своим суффиксом -KA, и в этом вся разница между языками: польский образует её обязательно, русский факультативно."
memory: "Женская форма обязательна, в отличие от русского: о женщине у врача скажут pacjentka, не pacjent. Пары строятся свободно: student и studentka, lekarz и lekarka. Pacjent всегда в отношении к врачу, а chory — просто больной. В дательном и местном t переходит в c: pacjentce. От латинского patiens «терпящий», родня слову pasja."
idioms:
  - { pl: "karta pacjentki", ru: "карта пациентки" }
  - { pl: "przyjąć pacjentkę", ru: "принять пациентку" }
