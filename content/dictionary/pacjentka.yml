notes:
  - { kind: usage, text: "Женская форма от PACJENT, образованная суффиксом -KA, и в польском такие пары строятся свободно и употребляются без всякой пометы: PACJENT и PACJENTKA, STUDENT и STUDENTKA, NAUCZYCIEL и NAUCZYCIELKA, LEKARZ и LEKARKA. Это заметно отличается от русского, где «пациентка» тоже есть, но многие профессии женской формы либо не имеют, либо имеют разговорную. В медицинской карте и в разговоре врача польская форма обязательна: о женщине скажут PACJENTKA, а не PACJENT." }
  - { kind: pronunciation, text: "Читается «пацъе́нтка», ударение на предпоследнем слоге. Сочетание CJE произносится «цъе», то есть c твёрдое, а затем «е» — не «це» с мягким c. Носовой здесь нет: буква E обычная. В дательном и местном падеже PACJENTCE согласная T переходит в C, и стечение TC произносится слитно: «пацъе́нтце». Это то же чередование, что в IDIOTKA и IDIOTCE, SEKRETARKA и SEKRETARCE." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: PRZYJĘTO PACJENTKĘ. Чем занимаются — творительный после ZAJMOWAĆ SIĘ: ZAJMOWAĆ SIĘ PACJENTKĄ. О ком речь — предлог O с местным: O PACJENTCE. Родительный множественного PACJENTEK, со вставной гласной E, как IDIOTEK и CZAPEK. При отрицании винительный уходит в родительный: NIE PRZYJĘTO PACJENTKI." }
  - { kind: false-friend, text: "Значение совпадает с русским полностью, и ловушки нет. Полезно лишь знать, что польский держит при больном иную пару слов, чем русский: PACJENT есть пациент у врача, а CHORY — больной как состояние и как существительное, то есть тот, кто болен: ODDZIAŁ DLA CHORYCH «отделение для больных». Поэтому PACJENTKA всегда в отношении к врачу или учреждению, а CHORA — просто больная женщина. Русский обоими словами тоже пользуется, но границу между ними чувствует слабее." }
