# review
id: sluszny
format: 2
lemma: "słuszny"
rank: 2715
pos: adj
pron: { cyr: "су́шны" }
senses:
  - id: valid
    ru: "справедливый, обоснованный"
    examples:
      - pl: "To słuszna uwaga."
        ru: "Это справедливое замечание."
        source: { kind: authored }
      - pl: "Decyzja okazała się słuszna."
        ru: "Решение оказалось правильным."
        source: { kind: authored }
      - pl: "Słuszne pytania zadaje się na początku."
        ru: "Правильные вопросы задают в начале."
        source: { kind: authored }
  - id: right
    ru: "правый, верный"
    examples:
      - pl: "Walczyli w słusznej sprawie."
        ru: "Они боролись за правое дело."
        source: { kind: authored }
      - pl: "Najsłuszniejszy wybór bywa najtrudniejszy."
        ru: "Самый правильный выбор бывает самым трудным."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самое ходовое, что нужно знать об этом слове, — существительное от него. SŁUSZNOŚĆ значит «правота», и по-польски говорят MASZ SŁUSZNOŚĆ там, где мы скажем «ты прав». Русский берёт прилагательное, польский существительное: mieć słuszność, przyznać komuś słuszność. Оборот с прилагательным тоже есть, но звучит книжнее." }
  - { kind: usage, text: "Корень слова связывают со SŁUCH: słuszne то, что хорошо звучит, что ложится на слух. Русский построил «правильный» от «правого», то есть от прямого и правой руки. Два языка назвали верность разными образами — через слух и через прямизну, — и это полезно заметить, потому что догадаться о значении по корню русскому не удастся." }
  - { kind: pronunciation, text: "Мужская личная форма множественного смягчается дважды по-разному: в положительной степени n переходит в мягкое ń — SŁUSZNI, а в сравнительной и превосходной смягчается sz, давая SŁUSZNIEJSI и NAJSŁUSZNIEJSI. Та же пара превращений, что у słoneczny и inteligentny. Начальное sł читается как «су»." }
collocations:
  - { pl: "mieć słuszność", ru: "быть правым" }
  - { pl: "słuszna uwaga", ru: "справедливое замечание" }
  - { pl: "słuszna sprawa", ru: "правое дело" }
family:
  - { pl: "słuszność", ru: "правота", relation: derived }
  - { pl: "słusznie", ru: "справедливо, верно", relation: derived }
  - { pl: "słuch", ru: "слух", relation: root, id: sluch }
etymology: "Корень тот же, что в SŁUCH, из праславянского *sluxъ: słuszny исходно то, что хорошо слышится, что звучит убедительно. Русское «правильный» выросло из «правого» — из прямизны и правой стороны, — так что языки выбрали для одной мысли разные опоры. Отсюда же słuszność «правота» и наречие słusznie."
memory: "«Ты прав» по-польски MASZ SŁUSZNOŚĆ, через существительное. А корень тот же, что в słuch: верно то, что хорошо звучит."
idioms:
  - { pl: "masz słuszność", ru: "ты прав" }
  - { pl: "słuszna sprawa", ru: "правое дело" }
