# review
id: narzedzie
format: 2
lemma: "narzędzie"
rank: 1566
pos: noun
pron: { cyr: "нажэ́ндзе" }
senses:
  - id: tool
    ru: "инструмент, орудие"
    examples:
      - pl: "Mamy potężne narzędzie."
        ru: "У нас мощный инструмент."
        source: { kind: translated, id: 3100407 }
      - pl: "Skończył pracę i posprzątał narzędzia."
        ru: "Он закончил работу и убрал инструменты."
        source: { kind: translated, id: 415323 }
      - pl: "Brakuje mi narzędzi."
        ru: "Мне не хватает инструментов."
        source: { kind: translated, id: 12939760 }
  - id: means
    ru: "средство, способ"
    examples:
      - pl: "Język to narzędzie porozumiewania się z ludźmi."
        ru: "Язык — инструмент общения с людьми."
        source: { kind: translated, id: 366648 }
      - pl: "Wyobraźnia jest bardzo potężnym narzędziem."
        ru: "Воображение — очень мощный инструмент."
        source: { kind: translated, id: 4436808 }
notes:
  - { kind: usage, text: "Средний род на -e: narzędzie, narzędzia, narzędziem. Родительный множественного — narzędzi." }
  - { kind: usage, text: "Ходовые сочетания: narzędzie zbrodni «орудие преступления», pasek narzędzi «панель инструментов», skrzynka z narzędziami «ящик с инструментами»." }
  - { kind: usage, text: "Переносно — «средство»: narzędzie komunikacji «средство общения»." }
  - { kind: false-friend, text: "Рядом стоит sprzęt «оборудование», которое уже есть карточкой: narzędzie — отдельный предмет в руке, sprzęt — собирательное." }
collocations:
  - { pl: "narzędzie zbrodni", ru: "орудие преступления" }
  - { pl: "pasek narzędzi", ru: "панель инструментов" }
  - { pl: "skrzynka z narzędziami", ru: "ящик с инструментами" }
etymology: "От старого rząd «снаряжение, порядок» с приставкой na-; тот же корень, что в rządzić «управлять». Русское «орудие» собрано от «орудовать», так что образ другой."
memory: "narzędzie — «инструмент, орудие». Отличайте от sprzęt: narzędzie это отдельный предмет в руке, sprzęt — собирательное «оборудование». И помните pasek narzędzi «панель инструментов»."
idioms:
  - { pl: "narzędzie zbrodni", ru: "орудие преступления" }
  - { pl: "pasek narzędzi", ru: "панель инструментов" }
  - { pl: "skrzynka z narzędziami", ru: "ящик с инструментами" }
