notes:
  - { kind: false-friend, text: "CZTERDZIEŚCI — «сорок», а не «четырдесять»: русский заменил старое «четыре десяти» особым словом «сорок», польский оставил прозрачное CZTERY + DZIEŚCI. Поэтому CZTERDZIESTY — «сороковой»." }
  - { kind: usage, text: "Косвенные падежи — CZTERDZIESTU, творительный — CZTERDZIESTOMA. CZTERDZIESTU — ещё и счёт мужчин. Собирательное CZTERDZIEŚCIORO — для детей и смешанных групп. CZTERDZIESTO- — первая часть сложных слов: CZTERDZIESTOLATEK." }
  - { kind: government, text: "Требует родительного множественного: CZTERDZIEŚCI LAT, CZTERDZIEŚCI OSÓB. Глагол в прошедшем — средний род: PRZYSZŁO CZTERDZIEŚCI OSÓB." }
  - { kind: pronunciation, text: "Читается «чтэрдзе́сьци»: CZ — «ч», DZIE — «дзе», ŚCI — «сьци». Ударение на предпоследнем слоге. Начальное CZT произносится слитно, без гласного между Ч и Т." }
  - { kind: register, text: "Нейтральное слово. CZTERDZIESTKA — разговорное «сорок лет»: STUKNĘŁA MU CZTERDZIESTKA «ему стукнуло сорок»." }
