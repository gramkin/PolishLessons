etymology: "Праславянское *četyre desęti «четыре десятка». Польский сохранил его, а древнерусский заменил на «сорок» — по самой распространённой версии, от «сорок» как связки из сорока шкурок."
memory: "Czterdzieści — «четыре десятка», а не «сорок»: czterdzieści lat. Czterdziesty — сороковой. О мужчинах — czterdziestu."
idioms:
