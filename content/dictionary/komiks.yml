  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — KOMIKSU, местный — W KOMIKSIE. Прилагательное — KOMIKSOWY: BOHATER KOMIKSOWY, «герой комиксов»." }
