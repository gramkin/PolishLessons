notes:
  - { kind: usage, text: "Неизменяемое наречие: одна форма на все случаи." }
  - { kind: usage, text: "Рядом с карточкой naprawdę: naprawdę — «правда, по-настоящему», faktycznie — «фактически, действительно», с оттенком подтверждения факта." }
  - { kind: usage, text: "Само по себе Faktycznie! работает как короткое согласие — «И правда!», «Действительно!»." }
