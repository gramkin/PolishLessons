# review
id: pierdolic
format: 2
lemma: "pierdolić"
rank: 785
pos: verb
aspect: imperf
pron: { cyr: "пердо́лиць" }
senses:
  - id: to-hell-with
    ru: "посылать, плевать на что-либо"
    examples:
      - pl: "Pierdol to."
        ru: "Да пошло оно."
        source: { kind: translated, id: 12940604 }
      - pl: "Pierdol się!"
        ru: "Пошёл ты!"
        source: { kind: translated, id: 1221630 }
      - pl: "Pierdolić to!"
        ru: "Да пошло оно всё!"
        source: { kind: translated, id: 13781290 }
      - pl: "Pierdolę, nie robię."
        ru: "Да ну его, не буду."
        source: { kind: translated, id: 13781302 }
  - id: participle
    ru: "pierdolony — гребаный (ругательное определение)"
    examples:
      - pl: "Zamknij te pierdolone drzwi!"
        ru: "Закрой эти гребаные двери!"
        source: { kind: translated, id: 6169415 }
      - pl: "O ja pierdolę!"
        ru: "Ну ты даёшь!"
        source: { kind: translated, id: 13781289 }
notes:
  - { kind: register, text: "Вульгарный глагол, один из самых грубых в польском. Прямой русский эквивалент — мат. Употреблять не стоит; карточка нужна, чтобы понимать чужую речь." }
  - { kind: usage, text: "Раздел «Будущее время» намеренно оставлен без примеров. Карточка существует для узнавания чужой речи, а не для употребления, и набор спряжённых ругательств ничему бы не научил: устойчивые обороты, которые действительно встречаются, разобраны выше." }
  - { kind: usage, text: "Pierdol się! — «Пошёл ты!», самое частое употребление. Pierdol to — «Да пошло оно»." }
  - { kind: usage, text: "O ja pierdolę! — возглас изумления, ближе к «Офигеть!», чем к прямому ругательству." }
  - { kind: usage, text: "Причастие pierdolony работает как ругательное определение: pierdolone drzwi «гребаные двери»." }
collocations:
  - { pl: "pierdol się", ru: "пошёл ты" }
  - { pl: "pierdol to", ru: "да пошло оно" }
  - { pl: "o ja pierdolę", ru: "офигеть" }
etymology: "Звукоподражательного происхождения, того же гнезда, что pierdzieć «пердеть». Русское матерное соответствие идёт от другого корня, но путь развития тот же: от физиологического глагола к универсальному ругательству."
memory: "pierdolić — вульгарный универсальный глагол. Главное: Pierdol się! «Пошёл ты!», Pierdol to «Да пошло оно», O ja pierdolę! «Офигеть!»."
