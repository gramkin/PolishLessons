  - { pl: "danie", ru: "блюдо", relation: root }
etymology: "Из немецкого Suppe, пришедшего в польский в позднем Средневековье вместе с городской кухней. Русский «суп» взял то же слово, но через французское soupe и на три века позже, уже при Петре. Отсюда и разный род: поляки приспособили слово к женскому склонению на -a, русские оставили как есть."
memory: "Главное — род: TA zupa, женский, а не «этот суп». И предложный мягкий: w zupie, как w mapie."
idioms:
