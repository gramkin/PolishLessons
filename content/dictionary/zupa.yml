notes:
  - { kind: false-friend, text: "РОД ДРУГОЙ: ПОЛЬСКАЯ ZUPA ЖЕНСКОГО РОДА. Русский «суп» мужской — «этот суп», «суп остыл». Польское слово кончается на -a и ведёт себя как женское: TA zupa, zupa BYŁA gorąca, DOBRA zupa. Ошибка здесь тихая: смысл не страдает, а согласование выдаёт иностранца сразу. Та же ловушка у analiza против нашего «анализа»." }
  - { kind: pronunciation, text: "Дательный и предложный — ZUPIE, со смягчением p в pi. То же в mapa — mapie, lampa — lampie, szafa — szafie. Родительный множественного — ZUP, с нулевым окончанием, как analiz и procedur: обычное поведение существительных на -a." }
collocations:
