  - id: float
    ru: "плавать, держаться на воде"
    examples:
      - pl: "Liście pływają po stawie."
        ru: "Листья плавают по пруду."
        source: { kind: authored }
      - pl: "Tłuszcz pływa na powierzchni zupy."
        ru: "Жир плавает на поверхности супа."
        source: { kind: authored }
  - id: sail
    ru: "плавать, ходить (о судах, моряках)"
    examples:
      - pl: "Pływał na statkach dwadzieścia lat."
        ru: "Он ходил на судах двадцать лет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПАРА PŁYWAĆ И PŁYNĄĆ УСТРОЕНА РОВНО КАК РУССКАЯ «ПЛАВАТЬ» И «ПЛЫТЬ». Pływać — о способности и о повторяющемся действии: umie pływać, pływa co rano. Płynąć — об одном движении в одну сторону прямо сейчас: płynie do brzegu. Русский делит так же, поэтому переносить можно без раздумий — редкий подарок." }
  - { kind: usage, text: "ТАКИХ ПАР В ПОЛЬСКОМ ЦЕЛЫЙ РЯД, И ВСЕ ОНИ СОВПАДАЮТ С РУССКИМИ. Chodzić и iść «ходить» и «идти», jeździć и jechać «ездить» и «ехать», latać и lecieć «летать» и «лететь», nosić и nieść «носить» и «нести». Первый глагол в каждой паре — о повторяющемся или ненаправленном движении, второй — об одном направленном." }
  - { kind: government, text: "ГДЕ плавать — w с предложным: pływać w jeziorze, w basenie. КАК — творительный или оборот: pływać żabką «плавать брассом», pływać kraulem. НА ЧЁМ — na с предложным: pływać na statku, na desce. КУДА — тут нужен уже płynąć: płynąć do brzegu." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: PŁY-wać. Ł читается как краткое у, y — как русское ы: «пуы́ваць». Вид несовершенный, поэтому формы на -wszy у глагола нет; действительное причастие pływający «плавающий» употребляется и как прилагательное." }
collocations:
  - { pl: "umieć pływać", ru: "уметь плавать" }
  - { pl: "pływać w basenie", ru: "плавать в бассейне" }
  - { pl: "pływać żabką", ru: "плавать брассом" }
family:
  - { pl: "płynąć", ru: "плыть", relation: aspect, id: plynac }
  - { pl: "pływanie", ru: "плавание", relation: derived }
  - { pl: "pływak", ru: "пловец; поплавок", relation: derived }
  - { pl: "tonąć", ru: "тонуть", relation: antonym }
etymology: "Из праславянского *plyvati, многократного глагола к *plūti «плыть» — тех же корней, что русские «плавать» и «плыть». Чередование y и y-долгого дало польскую пару pływać — płynąć ровно так же, как в русском. Отсюда pływak, pływalnia «бассейн», spływ «сплав» и przypływ «прилив»."
memory: "pływać — «плавать», и пара с płynąć «плыть» работает точно как русская: pływać о способности и привычке, płynąć об одном движении сейчас. Тот же ряд: chodzić и iść, jeździć и jechać, latać и lecieć."
idioms:
