format: 2
lemma: "pływać"
rank: 2278
pos: verb
pron: { cyr: "пуы́ваць" }
senses:
  - id: swim
    ru: "плавать (уметь, вообще)"
    examples:
      - pl: "Pływa od piątego roku życia."
