etymology: "Из немецкого TELLER, которое идёт от средневекового латинского TALEATOR «доска для нарезания», от TALEARE «резать» — отсюда же итальянское TAGLIARE и французское TAILLER. То есть исходно это была доска, на которой режут, а не посуда. Русская «тарелка» взята из того же немецкого слова, через польский или напрямую, и прошла по дороге перестановку согласных и прибавление уменьшительного -ка: TELLER дало сначала «тарель», а уже от него «тарелку». Поэтому у двух слов один источник, но разный род и разный суффикс, и польское TALERZ стоит ближе к немецкому оригиналу. Старое русское «тарель» в значении плоского блюда сохранилось в технических текстах и подтверждает эту цепочку."
memory: "То же слово, что русская «тарелка», из немецкого Teller, но мужского рода и без суффикса: ten talerz, duży talerz, и ta talerz — ошибка. Русский добавил -ка, польский оставил корень; уменьшительное здесь talerzyk. Конечное rz оглушается в «ш»: «та́леш», но в косвенных формах звучит «ж»: talerza «тале́жа». Два родительных множественного, talerzy и talerzów, оба правильные."
