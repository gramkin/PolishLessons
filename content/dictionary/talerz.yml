notes:
  - { kind: false-friend, text: "Русская «тарелка» и польский TALERZ — одно и то же слово, взятое из немецкого TELLER, но разошедшееся в двух отношениях сразу. Во-первых, род: TALERZ мужского рода, TEN TALERZ, а «тарелка» женского. Во-вторых, суффикс: русский добавил уменьшительное -ка и закрепил его как основную форму, польский оставил слово без суффикса. Поэтому DUŻY TALERZ «большая тарелка» согласуется по мужскому роду, и сказать TA TALERZ нельзя. Уменьшительное в польском тоже есть, TALERZYK «тарелочка», и означает именно маленькую тарелку, тогда как русская «тарелка» уже уменьшительна по форме, но не по смыслу." }
  - { kind: government, text: "Мужской род, неодушевлённое, с мягкой основой на -RZ. Винительный равен именительному: PODAJ TALERZ. Местный TALERZU. У слова два родительных множественного, TALERZY и TALERZÓW, и оба нормативны: формы на -Y обычнее, формы на -ÓW встречаются чаще в счётных оборотах. Так колеблются многие существительные мужского рода на -RZ и -SZ. Что на тарелке — предлог NA с местным: NA TALERZU. Чего тарелка — родительный: TALERZ ZUPY «тарелка супа»." }
  - { kind: pronunciation, text: "Читается «та́леш», ударение на предпоследнем слоге из двух. Сочетание RZ на конце слова оглушается и звучит «ш», а не «ж»: «талеш». В косвенных формах, где за RZ идёт гласная, звучит уже «ж»: TALERZA «тале́жа», TALERZU «тале́жу», TALERZE «тале́же». Это обычное для польского оглушение в конце слова, то же, что в NÓŻ «нуш» и в MĄŻ «монш». Буква L мягкая, отсюда «ля» в начале, точнее «та-ле»." }
  - { kind: usage, text: "Частотные сочетания: TALERZ ZUPY «тарелка супа», GŁĘBOKI TALERZ «глубокая тарелка», PŁASKI TALERZ «плоская тарелка», TALERZ OBIADOWY, ZMYWAĆ TALERZE «мыть посуду». Уменьшительное TALERZYK означает маленькую или десертную тарелку. Выражение MIEĆ CZEGOŚ PO TALERZU в польском не употребляется; «по тарелкам» в смысле раздачи передаётся оборотом NA TALERZE. В техническом языке TALERZ означает плоский круглый элемент: TALERZ ANTENY, TALERZ HAMULCOWY «тормозной диск»." }
