# review
id: jakiz
format: 2
lemma: "jakiż"
rank: 2367
pos: adj
pron: { cyr: "я́киш" }
senses:
  - id: what-a
    ru: "какой же! что за! (восклицательное)"
    examples:
      - pl: "Jakież cudowne zdanie!"
        ru: "Какое же чудесное предложение!"
        source: { kind: translated, id: 12608592 }
      - pl: "Jakież to porywające!"
        ru: "Как же это захватывающе!"
        source: { kind: translated, id: 8617256 }
      - pl: "Jakiż piękny dzień!"
        ru: "Какой же прекрасный день!"
        source: { kind: authored }
  - id: rhetorical
    ru: "какой же (в риторическом вопросе)"
    examples:
      - pl: "Jakież byłoby nasze życie bez elektryczności?"
        ru: "Какой же была бы наша жизнь без электричества?"
        source: { kind: translated, id: 349597 }
      - pl: "Jakiż z niego pożytek?"
        ru: "Какой же от него прок?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это jaki с усилительной частицей -ż. Она ничего не добавляет к значению, только усиливает: jaki «какой» → jakiż «какой же»." }
  - { kind: government, text: "Склоняется как jaki, частица приклеивается к концу: jakiż, jakaż, jakież, jakiegoż." }
  - { kind: false-friend, text: "Та же частица сидит в czegóż, któż, gdzież, dlaczegóż. Русское «же» работает точно так же, только пишется отдельно." }
  - { kind: usage, text: "Слово книжное и эмоциональное; в обычной речи достаточно jaki." }
collocations:
  - { pl: "jakiż piękny", ru: "какой же красивый" }
  - { pl: "jakież to", ru: "как же это" }
etymology: "jaki + усилительная частица -ż, та же, что в czegóż, któż, gdzież. Русское «же» — её прямое соответствие."
memory: "jakiż — это jaki «какой» плюс частица -ż, то есть «какой же». Та же частица в któż, gdzież, czegóż."
idioms:
