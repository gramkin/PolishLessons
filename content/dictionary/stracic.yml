# review
id: stracic
format: 2
lemma: "stracić"
rank: 289
pos: verb
aspect: perf
pron: { cyr: "стра́циць" }
senses:
  - id: lose
    ru: "потерять, утратить"
    examples:
      - pl: "Straciłem pracę."
        ru: "Я потерял работу."
        source: { kind: tatoeba, id: 8683482 }
      - pl: "Stracił przytomność."
        ru: "Он потерял сознание."
        source: { kind: tatoeba, id: 13228187 }
      - pl: "Pacjent stracił dużo krwi."
        ru: "Пациент потерял много крови."
        source: { kind: tatoeba, id: 6692580 }
  - id: execute
    ru: "казнить (в страдательных формах)"
    note: "został stracony значит «был казнён» — отдельное значение того же глагола."
    examples:
      - pl: "On stracił świadomość."
        ru: "Он потерял сознание."
        source: { kind: tatoeba, id: 611689 }
      - pl: "Nie mamy nic do stracenia."
        ru: "Нам нечего терять."
        source: { kind: tatoeba, id: 13789574 }
      - pl: "Ile krwi stracił Tom?"
        ru: "Как много крови потерял Том?"
        source: { kind: tatoeba, id: 12470554 }
notes:
  - { kind: usage, text: "Несовершенный вид — tracić: Tracę czas «Я теряю время»." }
  - { kind: usage, text: "stracić przytomność — «потерять сознание»; stracić głowę — «потерять голову»; stracić z oczu — «потерять из виду»." }
  - { kind: usage, text: "Отдельное значение — «казнить»: Tom został stracony «Том был казнён». В этом смысле глагол употребляется почти только в страдательных формах." }
  - { kind: usage, text: "nie mieć nic do stracenia — «нечего терять»." }
collocations:
  - { pl: "stracić pracę", ru: "потерять работу" }
  - { pl: "stracić przytomność", ru: "потерять сознание" }
  - { pl: "nie mieć nic do stracenia", ru: "нечего терять" }
  - { pl: "stracić czas", ru: "потерять время" }
etymology: "Из s- + tracić «терять», праславянское *tratiti; ср. русское «тратить», где значение сместилось к расходованию."
memory: "stracić — «потерять», сов. к tracić. Но в страдательных формах у него второе значение: został stracony значит «был казнён»."
idioms:
  - { pl: "stracić głowę", ru: "потерять голову" }
  - { pl: "stracić z oczu", ru: "потерять из виду" }
  - { pl: "nie mieć nic do stracenia", ru: "нечего терять" }
