        ru: "Он купил полфунта масла."
        source: { kind: authored }
      - pl: "Paczka waży pięć funtów."
        ru: "Посылка весит пять фунтов."
        source: { kind: authored }
  - id: pound-currency
    ru: "фунт (денежная единица)"
    examples:
      - pl: "Funt brytyjski znowu podrożał."
        ru: "Британский фунт снова подорожал."
        source: { kind: authored }
      - pl: "Ceny podano w funtach."
        ru: "Цены указаны в фунтах."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "И польское funt, и русское «фунт» — одно и то же латинское слово, пришедшее через немецкий, так что ловушки в самом слове нет. Но исторические величины различались: польский фунт — около 405 граммов, русский — около 410, и ни тот ни другой уже не в ходу, кроме британского." }
  - { kind: usage, text: "Предложный падеж — funcie, с чередованием t → ć, как в koncercie и kontrakcie. Денежное значение обычно уточняют: funt szterling или funt brytyjski." }
  - { kind: government, text: "Количество ставит слово в родительный: pięć funtów, pół funta. Устойчивое nie warte funta kłaków значит «не стоит и ломаного гроша» — буквально «не стоит фунта пакли»." }
collocations:
  - { pl: "funt szterling", ru: "фунт стерлингов" }
  - { pl: "pół funta", ru: "полфунта" }
  - { pl: "nie warte funta kłaków", ru: "не стоит и ломаного гроша" }
family:
  - { pl: "funtowy", ru: "фунтовый", relation: derived }
etymology: "Из средневерхненемецкого funt, а то — из латинского pondo «по весу», от pondus «вес». Русское «фунт» пришло тем же немецким путём, поэтому слова совпадают; английское pound — тот же латинский источник, только иначе переработанный."
memory: "funt — «фунт», одно заимствование в оба языка через немецкий, из латинского pondo «по весу». Предложный funcie (t → ć). И запомните идиому: nie warte funta kłaków."
idioms:
  - { pl: "nie warte funta kłaków", ru: "не стоит и ломаного гроша" }
  - { pl: "funt szterling", ru: "фунт стерлингов" }
formExamplesSkip:
  - { form: "funcie", cell: "Звательный", reason: "звательный падеж: к мере веса и к монете не обращаются, одушевлённость здесь только грамматическая" }
