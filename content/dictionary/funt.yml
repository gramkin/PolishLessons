pron: { cyr: "фунт" }
senses:
  - id: pound-weight
    ru: "фунт (мера веса)"
    examples:
      - pl: "Ta paczka waży więcej niż jeden funt."
        ru: "Этот пакет весит больше одного фунта."
        source: { kind: authored }
