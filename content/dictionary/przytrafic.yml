etymology: "Приставка PRZY- плюс TRAFIĆ, а тот — из средневерхненемецкого TREFFEN «попадать, поражать», заимствованного польским в средние века через города и ремесло. От него в польском целое гнездо: TRAF «случай», TRAFNY «меткий», TRAFIĆ «попасть, угадать», NATRAFIĆ «натолкнуться». Русский взял слово позже и уже через польское посредство, но оно не прижилось в середине языка: «потрафить» осталось просторечным со значением «угодить», а самостоятельное «трафить» почти исчезло. Приставка PRZY- здесь означает приближение вплотную, как в PRZYŁAPAĆ и PRZYJŚĆ: событие подошло и попало в человека."
memory: "Глагол живёт только с się и требует дательного: przytrafić się komuś, где подлежащее — само событие. Русский строит иначе, через предлог: «с ним случилось», и сказать przytrafiło się z nim нельзя. Корень германский, trafić из немецкого treffen «попадать», и русский знает его лишь по просторечному «потрафить». Из того же гнезда traf «случай» и trafny «меткий». Сорок две формы — непереходный совершенного вида, настоящего времени нет."
idioms:
  - { pl: "coś takiego może się przytrafić każdemu", ru: "такое может случиться с каждым" }
formExamplesSkip:
