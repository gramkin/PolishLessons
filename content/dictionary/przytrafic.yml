notes:
  - { kind: false-friend, text: "Корень знаком русскому с неожиданной стороны. TRAFIĆ значит «попасть», и слово это германское: из средневерхненемецкого TREFFEN, пришедшего в польский в средние века вместе с городским ремеслом. Русский получил тот же корень позже и через польское посредство, но оставил его на обочине: «потрафить» значит угодить и звучит просторечно, а «трафить» почти вышло из употребления. Поэтому PRZYTRAFIĆ SIĘ не переводится никаким однокоренным русским словом — только «случиться», «приключиться», «произойти». Зато TRAFNY «меткий» и TRAF «случай» из того же гнезда и запоминаются вместе." }
  - { kind: government, text: "Глагол существует только с SIĘ и требует дательного падежа лица: PRZYTRAFIĆ SIĘ KOMUŚ. Подлежащим при нём бывает событие, а не человек: PRZYTRAFIŁ MU SIĘ WYPADEK буквально «происшествие приключилось ему». Русский строит эту же мысль предлогом: «с ним произошло происшествие», то есть творительным с предлогом вместо дательного. Это расхождение даёт самую частую ошибку: сказать PRZYTRAFIŁO SIĘ Z NIM нельзя, нужен голый дательный. Близкие по смыслу глаголы управляются так же: ZDARZYĆ SIĘ KOMUŚ, PRZYDARZYĆ SIĘ KOMUŚ." }
  - { kind: usage, text: "Сорок две формы по словарю, и это подпись непереходного глагола совершенного вида: сорок одна форма плюс деепричастие прошедшего времени PRZYTRAFIWSZY, которое бывает только у совершенного вида. Настоящего времени нет: PRZYTRAFI SIĘ значит будущее. Одна форма из списка в карточке пропущена с указанием причины — безличная PRZYTRAFIONO: польский не образует безличных форм на -NO от возвратных глаголов, и у глагола, живущего только с SIĘ, такой формы быть не может. Несовершенный партнёр — PRZYTRAFIAĆ SIĘ." }
  - { kind: register, text: "Глагол нейтральный и обиходный. Устойчивые обороты: COŚ TAKIEGO MOŻE SIĘ PRZYTRAFIĆ KAŻDEMU «такое может случиться с каждым», PRZYTRAFIŁO MU SIĘ NIESZCZĘŚCIE. Говорят так чаще о мелкой неприятности, чем о беде: о настоящем горе скажут SPOTKAŁO GO NIESZCZĘŚCIE. Формы первого и второго лица редки, потому что подлежащим обычно бывает событие, а не человек; встречаются они в шутке и в сказке, где о себе говорит само несчастье или нежданный гость, и в карточке они даны в такой оправе." }
