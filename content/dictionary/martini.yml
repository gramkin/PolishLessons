  - { kind: usage, text: "Средний род, неизменяемое. Прилагательные — в среднем роде: ZIMNE MARTINI. Числительные: DWA MARTINI." }
  - { kind: government, text: "Мартини с чем — MARTINI Z и творительный: MARTINI Z OLIWKĄ. Бокал мартини — KIELISZEK MARTINI, форма та же." }
  - { kind: pronunciation, text: "Читается «марти́ни»: TI — «ти», как в иностранных словах. Ударение на предпоследнем слоге." }
