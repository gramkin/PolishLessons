etymology: "Из праславянского *sunǫti «двинуть», от которого русское «сунуть», «суну», «сунул». Приставка PO- даёт совершенный вид и значение небольшого перемещения, а суффикс -NĄĆ — однократность действия; этот суффикс точно отвечает русскому -НУТЬ, и пары видны насквозь: POSUNĄĆ и «сунуть», KRZYKNĄĆ и «крикнуть», RZUCIĆ рядом с RZUCAĆ. Значения, однако, разошлись: польский развил «передвинуть», русский — «засунуть внутрь». Из того же гнезда идут SUNĄĆ «скользить, двигаться», PRZESUNĄĆ «переместить», WSUNĄĆ «всунуть» — последнее и есть точный ответ русскому «сунуть». Отглагольное POSUNIĘCIE рано получило переносный смысл «ход в игре» и оттуда перешло в язык политики, как и русское «ход»."
memory: "Ą только в мужском единственном прошедшего: posunął — но posunęła, posunęli, posunęły. Одна форма против двенадцати; так же zaczął/zaczęła, wziął/wzięła. Перед T носовое даёт IĘ: posunięty, posunięcie, никогда posunęty. Корень — «сунуть», но польское posunąć значит «подвинуть», а русское «сунуть» — это wsunąć. Posunięcie — это «ход»; posunięty w latach — «в летах»."
