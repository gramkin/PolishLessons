notes:
  - { kind: usage, text: "Главное в этом слове — чередование Ą и Ę в прошедшем времени, и правило простое: Ą стоит только в мужском единственном, POSUNĄŁ, а во всех остальных формах Ę — POSUNĘŁA, POSUNĘŁO, POSUNĘLI, POSUNĘŁY, POSUNĘŁAM, POSUNĘLIŚMY. То есть одна форма против двенадцати. Так же ведут себя ZACZĄĆ (ZACZĄŁ, но ZACZĘŁA) и WZIĄĆ (WZIĄŁ, но WZIĘŁA), и это один из самых частых источников ошибок у говорящих по-русски, потому что в русском носовых нет и подсказки взять негде. Второе чередование: перед T носовое Ę даёт IĘ, отсюда POSUNIĘTY, а не несуществующее POSUNĘTY, и POSUNIĘCIE, POSUNIĘTO." }
  - { kind: false-friend, text: "Корень тот же, что в русском «сунуть»: праславянское *sunǫti дало польское SUNĄĆ и русское «сунуть». Но значения разошлись. Польское POSUNĄĆ значит «подвинуть, передвинуть» — предмет, срок, дело, — а русское «сунуть» значит «всунуть, засунуть», и по-польски это WSUNĄĆ или WETKNĄĆ. Так POSUNĄŁ KRZESŁO это «подвинул стул», а не «сунул стул». Отглагольное существительное POSUNIĘCIE по-русски вообще не «подвижка», а «ход»: DOBRE POSUNIĘCIE «хороший ход» — о шахматах, о политике, о любом расчётливом шаге. Сравните и суффикс: -NĄĆ отвечает русскому -НУТЬ и так же означает однократность — POSUNĄĆ и «сунуть», KRZYKNĄĆ и «крикнуть»." }
  - { kind: government, text: "Переходный, совершенного вида: POSUNĄĆ CO (винительный) — POSUNĄĆ STÓŁ, POSUNĄĆ TERMIN. Пара по виду: POSUWAĆ несовершенный, POSUNĄĆ совершенный. Возвратная форма POSUNĄĆ SIĘ значит «подвинуться», а с предлогом DO и родительным — «дойти до чего-то», обычно о недостойном поступке: POSUNĄĆ SIĘ DO KŁAMSTWA «дойти до лжи», POSUNĄĆ SIĘ DO GROŹBY. Отдельно стоит POSUNĄĆ SIĘ ZA DALEKO «зайти слишком далеко». Страдательное причастие POSUNIĘTY работает и как прилагательное, и в составе оборота POSUNIĘTY W LATACH «в летах»." }
  - { kind: pronunciation, text: "Читается «посу́нонць», три слога, ударение на предпоследнем. Носовое Ą перед Ć даёт «он»: NĄĆ это «нонць». В прошедшем времени POSUNĄŁ носовое Ą перед Ł звучит как «оу»: «посу́ноу». А вот POSUNĘŁA с Ę читается «посунэ́уа», где Ę это «э» с носовым призвуком, а Ł — «у». В причастии POSUNIĘTY сочетание IĘ перед T даёт «енть»: «посуне́нты». Так одно слово показывает оба носовых и обе их позиции." }
