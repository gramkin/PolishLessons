# review
id: ideal
format: 2
lemma: "ideał"
rank: 5299
pos: noun
pron: { cyr: "идэ́ау" }
senses:
  - id: perfection
    ru: "идеал, совершенство"
    examples:
      - pl: "Szuka ideału i dlatego jest sam."
        ru: "Он ищет идеал и потому одинок."
        source: { kind: authored }
      - pl: "Ten ogród to ideał spokoju."
        ru: "Этот сад — идеал покоя."
        source: { kind: authored }
      - pl: "Jej mąż to chodzący ideał."
        ru: "Её муж — ходячее совершенство."
        source: { kind: authored }
  - id: principle
    ru: "идеал, убеждение (чаще мн.)"
    examples:
      - pl: "Został wierny ideałom młodości."
        ru: "Он остался верен идеалам юности."
        source: { kind: authored }
      - pl: "Walczyli za swoje ideały."
        ru: "Они боролись за свои идеалы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Двенадцать форм в таблице, мужской род. В родительном две формы: IDEAŁU — о совершенстве как понятии, DĄŻYĆ DO IDEAŁU, и IDEAŁA — чаще об идеальном человеке, SZUKAĆ IDEAŁA. В местном падеже Ł переходит в L: W IDEALE. Личная форма IDEAŁOWIE почти не встречается." }
  - { kind: government, text: "Стремиться к идеалу — DĄŻYĆ DO IDEAŁU, DO с родительным. Верный идеалам — WIERNY IDEAŁOM, дательный, как у нас. Идеал красоты — IDEAŁ PIĘKNA, родительный." }
  - { kind: pronunciation, text: "Читается «идэ́ау», три слога, ударение на втором. E звучит твёрдо, «э», а конечное Ł — как короткое «у». В местном падеже IDEALE обычное L: «идэа́ле»." }
  - { kind: register, text: "Слово то же, что русское «идеал», и значения совпадают. CHODZĄCY IDEAŁ, «ходячий идеал», говорят шутливо или с иронией о человеке без недостатков, как наше «ходячее совершенство». Прилагательное IDEALNY очень частое и в быту: IDEALNIE! — «отлично, то что надо!»." }
collocations:
  - { pl: "ideał piękna", ru: "идеал красоты" }
  - { pl: "dążyć do ideału", ru: "стремиться к идеалу" }
  - { pl: "wierny ideałom", ru: "верный идеалам" }
family:
  - { pl: "idealny", ru: "идеальный", relation: derived, id: idealny }
  - { pl: "idealista", ru: "идеалист", relation: derived }
  - { pl: "idealizowac", ru: "идеализировать", relation: derived }
etymology: "Из латинского прилагательного, восходящего к греческому IDEA «образ, идея». Русский и польский взяли слово из одного источника, но польский оставил на конце Ł, а русский — мягкое «л»."
memory: "Ideał — «идеал», читается «идэ́ау». Dążyć do ideału — стремиться к идеалу. Szukać ideała — искать идеального человека. Chodzący ideał — ходячее совершенство. Idealnie! — отлично, то что надо!"
idioms:
  - { pl: "chodzący ideał", ru: "ходячее совершенство" }
formExamplesSkip:
  - { form: "ideałowie", reason: "личное множественное; практически не употребляется" }
