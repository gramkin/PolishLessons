# review
id: ten
format: 2
lemma: "ten"
rank: 3
pos: adj
pron: { cyr: "тэн" }
senses:
  - id: this
    ru: "этот, эта, это"
    examples:
      - pl: "Ten jest nowy."
        ru: "Этот новый."
        source: { kind: tatoeba, id: 10747422 }
      - pl: "Ta kobieta czyta."
        ru: "Эта женщина читает."
        source: { kind: tatoeba, id: 1134204 }
      - pl: "Kim są te dzieci?"
        ru: "Кто эти дети?"
        source: { kind: tatoeba, id: 13785278 }
  - id: that
    ru: "тот, то (при отсылке к сказанному)"
    examples:
      - pl: "To prawda."
        ru: "Это правда."
        source: { kind: tatoeba, id: 356399 }
      - pl: "Zapomnij o tym."
        ru: "Забудь про это."
        source: { kind: tatoeba, id: 2147222 }
notes:
  - { kind: usage, text: "Две формы множественного числа: ci для мужчин (ci ludzie) и te для всего остального (te książki)." }
  - { kind: usage, text: "Винительный падеж женского рода — tę, но в разговорной речи повсеместно звучит tą." }
collocations:
  - { pl: "ten sam", ru: "тот же самый" }
  - { pl: "w tym roku", ru: "в этом году" }
  - { pl: "ten i ów", ru: "тот или иной, кое-кто" }
etymology: "Праславянское *tъ, из праиндоевропейского *so — то же указательное, что русские «тот» и «этот»."
memory: "ten/ta/to = «этот/эта/это». Множественное число раздваивается: ci ludzie о мужчинах, te książki обо всём остальном. Винительный женского — tę, хотя в разговоре слышно tą."
idioms:
  - { pl: "ten sam", ru: "тот же самый" }
  - { pl: "ten i ów", ru: "тот или иной, кое-кто" }
  - { pl: "wobec tego", ru: "ввиду этого" }
