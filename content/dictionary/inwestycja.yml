# review
id: inwestycja
format: 2
lemma: "inwestycja"
rank: 4477
pos: noun
pron: { cyr: "инвэсты́цья" }
senses:
  - id: investment
    ru: "инвестиция, вложение"
    examples:
      - pl: "To była dobra inwestycja."
        ru: "Это было хорошее вложение."
        source: { kind: authored }
      - pl: "Firma planuje nowe inwestycje."
        ru: "Фирма планирует новые инвестиции."
        source: { kind: authored }
      - pl: "Mieszkanie to najlepsza inwestycja."
        ru: "Квартира — лучшее вложение денег."
        source: { kind: authored }
  - id: project
    ru: "строительный проект, объект"
    examples:
      - pl: "Na osiedlu trwa duża inwestycja."
        ru: "В районе идёт большая стройка."
        source: { kind: authored }
      - pl: "Inwestycja drogowa potrwa dwa lata."
        ru: "Дорожное строительство продлится два года."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "INWESTYCJA — «инвестиция», но в Польше это слово часто значит и сам строящийся объект: новый дом, дорогу, мост. INWESTYCJA MIESZKANIOWA — «жилой комплекс в стройке». Застройщик — DEWELOPER или INWESTOR." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — INWESTYCJI. Множественное — INWESTYCJE. Звательный и архаичное INWESTYCYJ не используем." }
  - { kind: government, text: "Вложение во что — INWESTYCJA W и винительный: INWESTYCJA W EDUKACJĘ. Отказаться от инвестиции — ZREZYGNOWAĆ Z INWESTYCJI, родительный." }
  - { kind: pronunciation, text: "Читается «инвэсты́цья»: WE — твёрдое «вэ», CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "inwestycja w przyszłość", ru: "вложение в будущее" }
  - { pl: "inwestycja mieszkaniowa", ru: "жилищное строительство" }
  - { pl: "zwrot z inwestycji", ru: "окупаемость инвестиций" }
family:
  - { pl: "inwestować", ru: "инвестировать", relation: derived }
  - { pl: "inwestor", ru: "инвестор, застройщик", relation: derived }
  - { pl: "zysk", ru: "прибыль", relation: root, id: zysk }
etymology: "Из латинского INVESTIRE «облачать»: деньги «одевают» во что-то. Через немецкое INVESTITION. Русское «инвестиция» — то же слово."
memory: "Inwestycja — инвестиция и строящийся объект. Inwestycja w przyszłość — вложение в будущее. Читается «инвэсты́цья»."
idioms:
  - { pl: "inwestycja w siebie", ru: "вложение в себя" }
formExamplesSkip:
  - { form: "inwestycjo", reason: "звательный от отвлечённого существительного не употребляется" }
  - { form: "inwestycyj", reason: "архаичный родительный множественного, в норме INWESTYCJI" }
