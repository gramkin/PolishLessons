# review
id: napis
format: 2
lemma: "napis"
rank: 854
pos: noun
pron: { cyr: "на́пис" }
senses:
  - id: inscription
    ru: "надпись"
    examples:
      - pl: "Napis INRI znaczy po łacinie: Jezus Nazarejczyk Król Żydowski."
        ru: "Надпись INRI на латыни означает \"Иисус Назарей, Царь Иудейский\"."
        source: { kind: tatoeba, id: 2737877 }
      - pl: "Napis na szyldzie wyblakł."
        ru: "Надпись на вывеске выцвела."
        source: { kind: translated, id: 525485 }
      - pl: "Uwaga na napis na ścianie."
        ru: "Обрати внимание на надпись на стене."
        source: { kind: translated, id: 908243 }
  - id: subtitles
    ru: "napisy (мн. ч.) — субтитры"
    note: "Во множественном числе слово значит «субтитры» — значения «надписи» тут уже нет."
    examples:
      - pl: "Napisy nie są włączone."
        ru: "Субтитры не включены."
        source: { kind: tatoeba, id: 13552958 }
      - pl: "Czy film ma napisy?"
        ru: "В фильме есть субтитры?"
        source: { kind: translated, id: 10572725 }
      - pl: "Wolno czytam, dlatego nie nadążam za napisami."
        ru: "Я медленно читаю, поэтому не поспеваю за субтитрами."
        source: { kind: tatoeba, id: 12470270 }
notes:
  - { kind: false-friend, text: "Во множественном числе napisy — это «субтитры», а не «надписи»: Czy film ma napisy? «В фильме есть субтитры?». Русское «надписи» так перевести нельзя." }
  - { kind: usage, text: "Единственное число — обычная «надпись»: napis na ścianie, napis na szyldzie." }
  - { kind: usage, text: "Слово разбирается прозрачно: na + pis-, от pisać «писать», ровно как русское «на-пись»." }
  - { kind: usage, text: "Глагол napisać «написать» — того же корня, но это совершенный вид от pisać, а не производное от napis." }
collocations:
  - { pl: "napis na ścianie", ru: "надпись на стене" }
  - { pl: "film z napisami", ru: "фильм с субтитрами" }
  - { pl: "włączyć napisy", ru: "включить субтитры" }
  - { pl: "napis ostrzegawczy", ru: "предупреждающая надпись" }
family:
  - { pl: "pisać", ru: "писать", relation: root }
  - { pl: "napisać", ru: "написать", relation: root }
  - { pl: "pismo", ru: "письмо, шрифт", relation: derived }
  - { pl: "podpis", ru: "подпись", relation: derived }
etymology: "Из na- + pis-, от pisać «писать» — ровно как русское «на-пись». Корень тот же, что в pismo и podpis."
memory: "napis — «надпись», разбирается как na + pisać, в точности как русское слово. Но во множественном числе napisy значит «субтитры»: Czy film ma napisy? — и это главное, что стоит запомнить."
idioms:
