notes:
  - { kind: usage, text: "Переносные значения совпадают с русскими настолько точно, что их можно не учить, а просто узнать. WYLECIEĆ Z PRACY это «вылететь с работы», WYLECIEĆ ZE STUDIÓW — «вылететь из института», а WYLECIAŁO MI TO Z GŁOWY — «это вылетело у меня из головы». Образ один и тот же: человека или мысль будто вынесло наружу. Есть и WYLECIEĆ Z WPRAWY «потерять навык», буквально «вылететь из сноровки», и вот тут русский говорит иначе. Сорок две формы — подпись непереходного глагола совершенного вида, без страдательного причастия." }
  - { kind: false-friend, text: "Беречься надо не русского слова, а соседнего польского: WYLECIEĆ и WYLECZYĆ различаются одной буквой и значат совершенно разное. WYLECIAŁ это «вылетел», а WYLECZYŁ — «вылечил». Корни разные: первый от LECIEĆ «лететь», второй от LECZYĆ «лечить». В прошедшем времени они почти сливаются на письме, поэтому стоит проверять себя по смыслу. Такая же пара уже встречалась: ZLECIŁ «поручил» против ZLECIAŁ «слетел»." }
  - { kind: government, text: "Глагол непереходный. Исходная точка вводится предлогом Z с родительным, ровно как русское «из»: WYLECIEĆ Z WARSZAWY, WYLECIEĆ Z PRACY, WYLECIEĆ Z GNIAZDA. Направление идёт через DO с родительным: WYLECIEĆ DO KRAKOWA «вылететь в Краков», и здесь русский берёт «в» с винительным, так что предлог приходится заменять. Путь наружу через отверстие выражается предлогом PRZEZ с винительным: WYLECIAŁ PRZEZ OKNO. Время вылета — предлогом O с предложным: WYLECI O SZÓSTEJ." }
  - { kind: pronunciation, text: "Читается «выле́чечь», три слога, ударение на предпоследнем. Сочетание CIE даёт мягкое «че», а конечное Ć — тоже мягкое «чь», так что конец слова звучит сдвоенно, «чечь». В формах прошедшего времени появляется A: WYLECIAŁ звучит «выле́чяу», с мягким «ч» и «у» на месте Ł. В повелительном наклонении остаётся короткое WYLEĆ — «вылечь», два слога. Приставка WY- всегда безударна, несмотря на то что в русском «вы-» ударение часто притягивает." }
  - { kind: register, text: "Прямое значение нейтральное и относится к птицам, самолётам, искрам и любым предметам, вылетающим наружу. Переносные значения разговорные и окрашены: WYLECIEĆ Z PRACY звучит резче, чем STRACIĆ PRACĘ, и предполагает, что уволили внезапно и не по-доброму. Существительное WYLOT значит «вылет» и живёт в расписаниях: GODZINA WYLOTU. Оборот NA WYLOT означает «насквозь»: ZNAM GO NA WYLOT «я знаю его насквозь»." }
