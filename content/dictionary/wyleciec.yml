etymology: "Приставка WY- плюс LECIEĆ, от праславянского *letěti — то же слово, что русское «лететь». Корень сохранился в обоих языках полностью и дал обширные гнёзда: польские LOT «полёт», LOTNISKO «аэропорт», ULOTKA «листовка», SAMOLOT «самолёт», и русские «полёт», «лётчик», «вылет», «налёт». Слово SAMOLOT и русский «самолёт» совпадают до последней морфемы, потому что оба построены по одной модели в одно и то же время, в начале двадцатого века. Приставка WY- отвечает русской ВЫ- буквально, так что WYLECIEĆ и «вылететь» разложены на части одинаково."
memory: "Разбирается на части как русское слово: wy- это «вы-», lecieć это «лететь», wylecieć это «вылететь». Переносные значения тоже совпадают: wylecieć z pracy «вылететь с работы», wyleciało mi z głowy «вылетело из головы». Беречься соседнего глагола: wyleciał «вылетел», но wyleczył «вылечил», разница в одной букве. Сорок две формы — непереходный совершенный вид, страдательного причастия нет."
