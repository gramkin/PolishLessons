# review
id: raz
format: 2
lemma: "raz"
rank: 58
pos: noun
pron: { cyr: "рас" }
senses:
  - id: once
    ru: "раз, случай"
    examples:
      - pl: "Jeszcze raz!"
        ru: "Ещё раз!"
        source: { kind: tatoeba, id: 882974 }
      - pl: "Jeden raz wystarczy."
        ru: "Одного раза хватит."
        source: { kind: tatoeba, id: 5704245 }
      - pl: "On był w Anglii dwa razy."
        ru: "Он дважды был в Англии."
        source: { kind: tatoeba, id: 745258 }
  - id: adverbial
    ru: "в устойчивых сочетаниях: od razu — сразу, na razie — пока, w razie — в случае"
    examples:
      - pl: "Od razu się zaprzyjaźniliśmy."
        ru: "Мы сразу подружились."
        source: { kind: tatoeba, id: 722090 }
      - pl: "W takim razie jak będzie poprawnie?"
        ru: "А как тогда правильно?"
        source: { kind: tatoeba, id: 13547059 }
notes:
  - { kind: usage, text: "Падежные формы застыли в наречиях: od razu «сразу», na razie «пока», w razie «в случае», razem «вместе», tym razem «на этот раз»." }
collocations:
  - { pl: "na razie", ru: "пока" }
  - { pl: "od razu", ru: "сразу" }
  - { pl: "tym razem", ru: "на этот раз" }
etymology: "Праславянское *razъ «удар, черта» — то же слово, что русское «раз»; исходное значение «удар» сохранилось в razy «удары»."
memory: "Само слово знакомо, а вот наречия на его основе надо выучить отдельно: od razu «сразу», na razie «пока (до встречи)», w razie «в случае», razem «вместе»."
idioms:
  - { pl: "na razie", ru: "пока (при прощании)" }
  - { pl: "raz na zawsze", ru: "раз и навсегда" }
  - { pl: "raz po raz", ru: "то и дело" }
