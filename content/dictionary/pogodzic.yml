  - id: come-to-terms
    ru: "pogodzić się z czymś — смириться с чем-л."
    examples:
      - pl: "Musiał pogodzić się z porażką."
        ru: "Ему пришлось смириться с поражением."
        source: { kind: authored }
      - pl: "Nie mogła pogodzić się ze stratą."
        ru: "Она не могла смириться с утратой."
        source: { kind: authored }
  - id: combine
    ru: "совместить (одно с другим)"
    examples:
      - pl: "Trudno pogodzić pracę z rodziną."
        ru: "Трудно совместить работу с семьёй."
