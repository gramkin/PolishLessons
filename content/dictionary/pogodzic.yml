notes:
  - { kind: government, text: "ТРИ КОНСТРУКЦИИ, И РУССКИЙ ПЕРЕВОДИТ КАЖДУЮ СВОИМ ГЛАГОЛОМ. POGODZIĆ KOGOŚ — «примирить»: pogodził braci. POGODZIĆ SIĘ Z CZYMŚ — «смириться»: pogodzić się z porażką. POGODZIĆ COŚ Z CZYMŚ — «совместить»: pogodzić pracę z rodziną. Последнее сбивает чаще всего: «помирить работу с семьёй» по-русски не говорят." }
  - { kind: usage, text: "ПОВЕЛИТЕЛЬНОЕ НАКЛОНЕНИЕ ИМЕЕТ ДВА ОБЛИКА: POGÓDŹ и POGODŹ, и оба стоят в таблице форм. Буква ó появляется там, где отпадение -ić закрывает слог, — тот же механизм, что в wyniósł против wyniosła и в naród против narodu. Так же ведёт себя wodzić → wódź. Словари дают прежде всего pogódź." }
  - { kind: false-friend, text: "КОРЕНЬ ЭТОГО ГЛАГОЛА — ТОТ ЖЕ, ЧТО У СЛОВА POGODA «ПОГОДА». Праславянское *god- значило «подходящее время, пригодность», отсюда и zgoda «согласие», и pogoda. В русском тот же корень дал «годиться», «угодить», «выгоду» и само «погоду». Вид совершенный: есть pogodziwszy, форм на -ąc и -ący нет, несовершенная пара — godzić." }
collocations:
  - { pl: "pogodzić się z losem", ru: "смириться с судьбой" }
  - { pl: "pogodzić pracę z rodziną", ru: "совместить работу с семьёй" }
  - { pl: "nie do pogodzenia", ru: "несовместимый" }
family:
  - { pl: "godzić", ru: "мирить (несов.)", relation: aspect }
  - { pl: "zgoda", ru: "согласие", relation: root, id: zgoda }
  - { pl: "pogoda", ru: "погода", relation: root, id: pogoda }
etymology: "Приставка po- и godzić, из праславянского *goditi «быть пригодным, попадать в срок», от *godъ «подходящее время». Тот же корень дал zgoda «согласие», pogoda «погода» и русские «годиться», «угодить», «выгода», «погода». Примирение понималось как приведение к согласию, к тому, что годится обеим сторонам."
memory: "pogodzić — «примирить», но ещё и «совместить»: pogodzić pracę z rodziną. А pogodzić się z czymś значит «смириться». Повелительное двоякое: pogódź и pogodź. И помни родство: pogoda «погода» того же корня."
idioms:
