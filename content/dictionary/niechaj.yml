# review
id: niechaj
format: 2
lemma: "niechaj"
rank: 5833
pos: part
pron: { cyr: "не́хай" }
senses:
  - id: may-it-be
    ru: "да (будет), пусть (торжественное пожелание)"
    examples:
      - pl: "Niechaj Bóg ma cię w swojej opiece."
        ru: "Да хранит тебя Бог."
        source: { kind: authored }
      - pl: "Niechaj pokój będzie z wami."
        ru: "Да будет мир с вами."
        source: { kind: authored }
      - pl: "Niechaj ta chwila trwa wiecznie."
        ru: "Пусть это мгновение длится вечно."
        source: { kind: authored }
      - pl: "Ich imiona niechaj pozostaną w naszej pamięci."
        ru: "Пусть их имена останутся в нашей памяти."
        source: { kind: authored }
  - id: let
    ru: "пусть (себе), пускай"
    examples:
      - pl: "Niechaj mówią, co chcą."
        ru: "Пусть говорят, что хотят."
        source: { kind: authored }
      - pl: "A niechaj sobie idzie, skoro musi."
        ru: "А пусть себе идёт, раз должен."
        source: { kind: authored }
notes:
  - { kind: register, text: "Старинный и торжественный вариант NIECH. Звучит в молитвах, гимнах, тостах и литературе; в обычной речи говорят NIECH: NIECH MÓWIĄ «пусть говорят»." }
  - { kind: usage, text: "Употребляется так же, как NIECH: с глаголом в 3-м лице настоящего или будущего времени — NIECHAJ ŻYJE «да здравствует», NIECHAJ BĘDZIE «да будет»." }
  - { kind: usage, text: "Самая известная строка с этим словом — у Миколая Рея: A NIECHAJ NARODOWIE WŻDY POSTRONNI ZNAJĄ, IŻ POLACY NIE GĘSI, IŻ SWÓJ JĘZYK MAJĄ «Пусть знают чужие народы, что поляки не гуси и свой язык имеют»." }
  - { kind: pronunciation, text: "Читается «не́хай» — точно как украинское «нехай» с тем же значением. Ударение на первом слоге." }
collocations:
  - { pl: "niechaj żyje", ru: "да здравствует" }
  - { pl: "niechaj będzie", ru: "да будет" }
  - { pl: "a niechaj", ru: "а пусть" }
family:
  - { pl: "niech", ru: "пусть", relation: root, id: niech }
  - { pl: "niechajże", ru: "пусть же", relation: derived }
  - { pl: "niechać", ru: "оставить, бросить (устар.)", relation: root }
synonyms: ["niech", "niechże"]
etymology: "Застывшая форма повелительного наклонения от старого глагола NIECHAĆ «оставить, позволить»: буквально «оставь, позволь». Сокращённая форма — NIECH; украинское «нехай» того же происхождения."
memory: "Niechaj — торжественное niech, как украинское «нехай». Niechaj żyje! — «Да здравствует!»"
idioms:
  - { pl: "a niechaj narodowie wżdy postronni znają, iż Polacy nie gęsi", ru: "пусть знают чужие народы, что поляки не гуси (то есть имеют свой язык)" }
  - { pl: "niechaj żyje", ru: "да здравствует" }
