notes:
  - { kind: government, text: "Глагол работает в двух схемах. Без дополнения он значит «повернуть назад» сам: ZAWRÓCIĆ Z DROGI «повернуть с дороги», ZAWRÓCIĆ DO DOMU «вернуться домой», причём откуда идёт предлогом Z с родительным, а куда — DO с родительным. С дополнением в винительном он значит «заставить вернуться»: ZAWRÓCILI NAS NA GRANICY «нас повернули назад на границе», ZAWRÓCIĆ SAMOCHÓD «развернуть машину». Именно второе значение даёт страдательные формы, и потому ZAWRÓCENI «повёрнутые назад» о людях совершенно нормально." }
  - { kind: false-friend, text: "Корень тот же, что в WRÓCIĆ «вернуться», и русское родство здесь живое, только через другие слова: «воротить», «ворот», «вращать», «обратно». Русское «заворотить» существует и значит почти то же, но звучит просторечно, а польское ZAWRÓCIĆ совершенно нейтрально. Не путать с ZAWARCIE «заключение договора» и ZAWRZEĆ «заключить, вскипеть» — там корень WR- другой, от «врать» в старом смысле «запирать», откуда и ZAWARTY «закрытый»." }
  - { kind: pronunciation, text: "Читается «завру́чичь», три слога, ударение на предпоследнем. Буква Ó звучит как «у», поэтому середина слова «вру», а не «вро». Сочетание CI даёт мягкое «чи», а конечное Ć — мягкое «чь». В повелительной форме ZAWRÓĆ слышно «завру́чь», одним слогом короче. В страдательном причастии ZAWRÓCONY уже «завруцо́ны», потому что перед O стоит твёрдое C, то есть «ц», а не «ч»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: есть деепричастие на -WSZY и полное страдательное причастие, а действительного причастия на -ĄCY нет. Видовой партнёр — ZAWRACAĆ, и у него есть собственный очень частый оборот ZAWRACAĆ GŁOWĘ «морочить голову»: NIE ZAWRACAJ MI GŁOWY значит «не морочь мне голову». У совершенного вида свой образ с головой, но другой: ZAWRÓCIĆ KOMUŚ W GŁOWIE значит «вскружить кому-то голову»." }
  - { kind: register, text: "Слово нейтральное, живёт и в разговоре за рулём, и в сводках о границе. Частые обороты: ZAWRÓCIĆ Z DROGI, ZAWRÓCIĆ DO DOMU, KAZAĆ ZAWRÓCIĆ «велеть повернуть назад», ZAWRÓCIĆ KOMUŚ W GŁOWIE. В значении «не пропустить» это слово официальных сообщений: ZAWRÓCONO NA GRANICY. Переносное значение с головой принадлежит разговорной речи и звучит слегка старомодно, но понятно всем." }
