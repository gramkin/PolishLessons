etymology: "Приставка ZA- плюс WRÓCIĆ «вернуться», от праславянского *vortiti, то есть к русскому «воротить». Русский сохранил этот корень в словах «ворот», «воротник», «вращать», «обратно», «поворот», но для обычного «вернуться» взял другой корень, от «верный». Польский же оставил старый корень в самой частой роли: WRÓCIĆ это именно «вернуться», WRACAĆ «возвращаться», POWRÓT «возвращение». Приставка ZA- добавляет поворот на обратный курс, и получается «заворотить». Русское «заворотить» живо, но просторечно, а польское слово нейтрально."
memory: "Корень тот же, что в русском «воротить»: польский оставил его там, где русский поставил «вернуться». Поэтому wrócić это «вернуться», а zawrócić «повернуть назад, заворотить». Две схемы: без дополнения сам повернул, zawrócić z drogi, с винительным заставил вернуться, zawrócili nas na granicy. Ó читается как «у»: «завру́чичь». И две разные головы: несовершенный zawracać głowę значит «морочить голову», а совершенный zawrócić komuś w głowie «вскружить голову»."
idioms:
  - { pl: "zawrócić komuś w głowie", ru: "вскружить кому-то голову" }
