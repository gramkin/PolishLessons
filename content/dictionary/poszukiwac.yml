notes:
  - { kind: register, text: "Это ОФИЦИАЛЬНЫЙ двойник глагола szukać. В разговоре скажут szukam pracy, а в объявлении напишут poszukuję pracy; polиция не szuka, а poszukuje. Причастие poszukiwany — стандартная формула розыска: poszukiwany listem gończym. А множественное poszukiwania значит «поиски» как операцию: akcja poszukiwawcza, poszukiwania trwały trzy dni." }
  - { kind: government, text: "Разыскивают ЧЕГО и КОГО — РОДИТЕЛЬНЫЙ, как и у szukać: poszukiwać pracy, poszukiwać sprawcy, poszukiwać prawdy. Винительного при этом глаголе нет, и это стоит сказать прямо, потому что дальше начинается несообразность: страдательное причастие poszukiwany всё равно образуется и употребляется постоянно (jest poszukiwany). Язык здесь непоследователен — запомните и то, и другое." }
  - { kind: false-friend, text: "Корень szukać прозрачного соответствия в литературном русском не имеет: там «искать». Родственник есть, но областной — «шукать», и украинское «шукати»; то же замечание стоит на карточке przeszukać. Приставка po- придаёт длительность и настойчивость: не просто искать, а вести поиски." }
  - { kind: pronunciation, text: "Основа настоящего времени меняется: -ywa- уступает место -uj-, то есть poszukiwać, но poszukuję, poszukujesz. Тот же образец, что у wykorzystywać — wykorzystuję и całować — całuję." }
collocations:
  - { pl: "poszukiwany listem gończym", ru: "в розыске по ордеру" }
  - { pl: "poszukiwać pracy", ru: "искать работу" }
  - { pl: "w poszukiwaniu czegoś", ru: "в поисках чего-л." }
family:
  - { pl: "szukać", ru: "искать", relation: root, id: szukac }
  - { pl: "przeszukać", ru: "обыскать", relation: derived, id: przeszukac }
  - { pl: "poszukiwania", ru: "поиски", relation: derived }
etymology: "Приставка po- плюс szukiwać, многократная форма от szukać «искать», праславянское *šukati. В литературном русском этого корня нет — там «искать», — но областное «шукать» и украинское «шукати» идут от того же слова. Приставка po- с суффиксом -iwa- дают длительность: вести поиски, а не просто взглянуть."
memory: "poszukiwać — официальное «разыскивать», тогда как szukać это обиходное «искать». Падеж родительный (poszukiwać pracy), но причастие poszukiwany всё равно есть и очень частое. И poszukiwania значит «поиски»."
idioms:
  - { pl: "poszukiwany listem gończym", ru: "разыскиваемый по ордеру" }
  - { pl: "w poszukiwaniu straconego czasu", ru: "в поисках утраченного времени" }
