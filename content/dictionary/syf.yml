# review
id: syf
format: 2
lemma: "syf"
rank: 6018
pos: noun
pron: { cyr: "сыф" }
senses:
  - id: mess
    ru: "бардак, срач, грязь (груб.)"
    examples:
      - pl: "W kuchni jest straszny syf."
        ru: "На кухне страшный срач."
        source: { kind: authored }
      - pl: "Posprzątaj wreszcie ten syf w pokoju!"
        ru: "Убери наконец этот бардак в комнате!"
        source: { kind: authored }
  - id: junk
    ru: "дрянь, гадость (о плохой вещи, еде)"
    examples:
      - pl: "Nie kupuj tego syfu, szkoda pieniędzy."
        ru: "Не покупай эту дрянь, жалко денег."
        source: { kind: authored }
  - id: syphilis
    ru: "сифилис (груб.)"
    examples:
      - pl: "Bał się, że złapał syfa."
        ru: "Он боялся, что подхватил сифилис."
        source: { kind: authored }
  - id: pimple
    ru: "прыщ (груб.)"
    examples:
      - pl: "Na nosie wyskoczył mi wielki syf."
        ru: "У меня на носу вскочил огромный прыщ."
        source: { kind: authored }
      - pl: "Nastolatki często mają syfy na czole."
        ru: "У подростков часто бывают прыщи на лбу."
        source: { kind: authored }
notes:
  - { kind: register, text: "Грубое разговорное слово: при детях и в вежливой речи говорят BAŁAGAN «беспорядок», BRUD «грязь», PRYSZCZ «прыщ»." }
  - { kind: usage, text: "Родительный зависит от значения: SYFU — «бардака, дряни» (PEŁNO SYFU), SYFA — «сифилиса, прыща», и тогда винительный тоже SYFA: ZŁAPAĆ SYFA «подхватить сифилис», WYCISNĄĆ SYFA «выдавить прыщ»." }
  - { kind: pronunciation, text: "Читается «сыф»: Y — русское «ы». Один слог." }
collocations:
  - { pl: "robić syf", ru: "устраивать бардак" }
  - { pl: "posprzątać syf", ru: "убрать бардак" }
  - { pl: "złapać syfa", ru: "подхватить сифилис" }
  - { pl: "straszny syf", ru: "страшный срач" }
family:
  - { pl: "syfilis", ru: "сифилис", relation: root }
  - { pl: "syfiasty", ru: "грязный, паршивый", relation: derived }
  - { pl: "zasyfiony", ru: "загаженный", relation: derived }
  - { pl: "porządek", ru: "порядок", relation: antonym, id: porzadek }
synonyms: ["bałagan", "bajzel", "brud"]
etymology: "В значении «сифилис» — сокращение от SYFILIS; от этого слова обычно выводят и разговорное «грязь, бардак»."
memory: "Syf — бардак, срач; в комнате syf — пора убираться. Слово грубое: при бабушке говори bałagan."
idioms:
  - { pl: "robić syf", ru: "свинячить, устраивать срач" }
  - { pl: "syf, kiła i mogiła", ru: "полный кошмар, хуже некуда" }
formExamplesSkip:
