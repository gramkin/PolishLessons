# review
id: zastepca
format: 2
lemma: "zastępca"
rank: 2503
pos: noun
pron: { cyr: "засте́мпца" }
senses:
  - id: deputy
    ru: "заместитель"
    examples:
      - pl: "Zastępca dyrektora podpisał pismo."
        ru: "Заместитель директора подписал бумагу."
        source: { kind: authored }
      - pl: "Rozmawiałem z zastępcą."
        ru: "Я говорил с заместителем."
        source: { kind: authored }
  - id: substitute
    ru: "замена, тот, кто подменяет"
    examples:
      - pl: "Na czas urlopu wyznaczono zastępcę."
        ru: "На время отпуска назначили замену."
        source: { kind: authored }
      - pl: "Zastępcy zebrali się w sali obok."
        ru: "Заместители собрались в соседнем зале."
        source: { kind: authored }
  - id: deputies
    ru: "заместители (как группа)"
    examples:
      - pl: "Nie znam wszystkich zastępców."
        ru: "Я не знаю всех заместителей."
        source: { kind: authored }
notes:
  - { kind: usage, text: "МУЖСКОЕ СУЩЕСТВИТЕЛЬНОЕ, КОТОРОЕ В ЕДИНСТВЕННОМ ЧИСЛЕ СКЛОНЯЕТСЯ КАК ЖЕНСКОЕ. Zastępca, zastępcy, zastępcę, zastępcą — окончания женские, но согласование мужское: NOWY zastępca, а не nowa. А родительный множественного берёт мужское -ów: ZASTĘPCÓW. Так же ведут себя zwycięzca, zdrajca, kolega и mężczyzna." }
  - { kind: false-friend, text: "Русский и польский назвали заместителя от разных корней. Русское «заместитель» — от «место»: тот, кто на месте другого. Польское zastępca — от zastąpić «заступить, заменить», от stąpić «ступить». Русское «заступник» построено точно так же, но значит защитника, а не заместителя." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: za-STĘP-ca. Ę звучит как «эм» перед p, c как ц: «засте́мпца». Форма zastępców читается «засте́мпцуф», с ó как у." }
collocations:
  - { pl: "zastępca dyrektora", ru: "заместитель директора" }
  - { pl: "zastępca burmistrza", ru: "заместитель мэра" }
  - { pl: "wyznaczyć zastępcę", ru: "назначить заместителя" }
family:
  - { pl: "zastąpić", ru: "заменить, заступить", relation: root, id: zastapic }
  - { pl: "zwycięzca", ru: "победитель", relation: root, id: zwyciezca }
  - { pl: "szef", ru: "начальник", relation: antonym, id: szef }
etymology: "От zastąpić «заступить, заменить», от stąpić «ступить», из праславянского *stąpiti — того же корня, что русское «ступить» и «заступить». Суффикс -ca образует названия лиц, как в zwycięzca и zdrajca, и тянет за собой женское склонение."
memory: "zastępca — «заместитель», от zastąpić «заступить». В единственном числе склоняется по женскому образцу (zastępcy, zastępcę, zastępcą), но согласование мужское и родительный множественного мужской: zastępców."
idioms:
  - { pl: "zastępca do spraw", ru: "заместитель по вопросам" }
  - { pl: "pod nieobecność zastępcy", ru: "в отсутствие заместителя" }
