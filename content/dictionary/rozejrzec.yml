# review
id: rozejrzec
format: 2
lemma: "rozejrzeć"
rank: 2297
pos: verb
pron: { cyr: "розє́йжэць" }
senses:
  - id: look-around
    ru: "осмотреться, оглядеться"
    examples:
      - pl: "Rozejrzał się po pokoju."
        ru: "Он осмотрелся в комнате."
        source: { kind: authored }
      - pl: "Rozejrzyj się, zanim przejdziesz."
        ru: "Оглядись, прежде чем переходить."
        source: { kind: authored }
  - id: look-for
    ru: "rozejrzeć się za czymś — поискать что-л."
    examples:
      - pl: "Rozejrzę się za nową pracą."
        ru: "Я поищу новую работу."
        source: { kind: authored }
      - pl: "Rozejrzeli się za tańszym mieszkaniem."
        ru: "Они поискали квартиру подешевле."
        source: { kind: authored }
  - id: get-bearings
    ru: "оглядеться, освоиться"
    examples:
      - pl: "Daj mu się rozejrzeć w nowej firmie."
        ru: "Дай ему освоиться в новой фирме."
        source: { kind: authored }
notes:
  - { kind: government, text: "ГЛАГОЛ СУЩЕСТВУЕТ ТОЛЬКО С SIĘ — БЕЗ НЕГО ЕГО НЕТ ВОВСЕ. Нельзя сказать «rozejrzeć coś»: правильно только rozejrzeć SIĘ. Отсюда и короткая таблица в сорок две формы вместо обычных пятидесяти с лишним: страдательных причастий у возвратного глагола не бывает. ГДЕ — po с предложным: rozejrzeć się po sali. ЗА ЧЕМ — za с творительным: rozejrzeć się za pracą." }
  - { kind: false-friend, text: "КОРЕНЬ -JRZEĆ ЭТО РУССКОЕ «ЗРЕТЬ». За непривычным написанием прячется знакомое гнездо: spojrzeć «взглянуть», ujrzeć «узреть», przejrzeć «просмотреть», wejrzenie «взгляд». Русские родственники — «зреть», «взор», «обозреть», «зоркий». Rozejrzeć się значит буквально «разо-зреться», обвести взглядом вокруг." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: ro-ZEJ-rzeć — точнее ro-zej-RZEĆ. Группа rz читается как ж: «розэ́йжэць». В прошедшем времени мужско-личное множественное берёт e: rozejrzeli się, а не «rozejrzali»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — rozglądać się «оглядываться». Второе значение практичнее первого: rozejrzeć się za czymś значит «присмотреть, поискать», и так говорят о работе, квартире, машине. Существительное rozejrzenie się употребляется редко, в обороте po rozejrzeniu się." }
collocations:
  - { pl: "rozejrzeć się dookoła", ru: "осмотреться вокруг" }
  - { pl: "rozejrzeć się za pracą", ru: "поискать работу" }
  - { pl: "rozejrzeć się po sali", ru: "оглядеть зал" }
family:
  - { pl: "rozglądać się", ru: "оглядываться", relation: aspect }
  - { pl: "spojrzeć", ru: "взглянуть", relation: root, id: spojrzec }
  - { pl: "ujrzeć", ru: "узреть, увидеть", relation: root, id: ujrzec }
etymology: "Приставка roz- плюс ejrzeć, от праславянского *zьrěti «смотреть, зреть» — того же корня, что русские «зреть», «взор», «зоркий», «обозреть». Начальное j появилось в польском как призвук перед старым z. Отсюда spojrzeć, ujrzeć, przejrzeć, wejrzenie и zerkać «поглядывать»."
memory: "rozejrzeć się — «осмотреться», и się тут обязательно: без него глагола нет. Корень -jrzeć это русское «ЗРЕТЬ», как в spojrzeć «взглянуть». А rozejrzeć się ZA czymś значит «поискать»: rozejrzę się za pracą."
idioms:
  - { pl: "rozejrzeć się za pracą", ru: "подыскивать работу" }
  - { pl: "rozejrzeć się dookoła", ru: "оглядеться по сторонам" }
