# review
id: internet
format: 2
lemma: "internet"
rank: 1716
pos: noun
pron: { cyr: "интэ́рнэт" }
senses:
  - id: net
    ru: "интернет"
    examples:
      - pl: "Internet zmienił wszystko."
        ru: "Интернет изменил всё."
        source: { kind: tatoeba, id: 5706487 }
      - pl: "Jak działa internet?"
        ru: "Как работает интернет?"
        source: { kind: translated, id: 3377645 }
      - pl: "Coś mi się internet zacina."
        ru: "Что-то у меня интернет тормозит."
        source: { kind: tatoeba, id: 12624986 }
  - id: in-net
    ru: "в интернете, через интернет"
    examples:
      - pl: "Sprawdziłem to w internecie."
        ru: "Я проверил это в интернете."
        source: { kind: translated, id: 7680869 }
      - pl: "Sprzedaję ubrania przez internet."
        ru: "Я продаю одежду через интернет."
        source: { kind: translated, id: 844766 }
      - pl: "Nie mam dostępu do internetu."
        ru: "У меня нет доступа к интернету."
        source: { kind: translated, id: 6602827 }
notes:
  - { kind: usage, text: "Пишут и Internet, и internet; сегодня чаще со строчной буквы, как и по-русски." }
  - { kind: government, text: "Где — w internecie (предложный падеж): znalazłem to w internecie. Через что — przez internet (винительный): sprzedaję przez internet." }
  - { kind: usage, text: "Прилагательное — internetowy: strona internetowa «сайт», sklep internetowy «интернет-магазин»." }
  - { kind: usage, text: "Разговорного сокращения вроде русского «инет» нет; говорят просто sieć «сеть»: znalazłem w sieci." }
collocations:
  - { pl: "w internecie", ru: "в интернете" }
  - { pl: "przez internet", ru: "через интернет" }
  - { pl: "dostęp do internetu", ru: "доступ к интернету" }
family:
  - { pl: "internetowy", ru: "интернетный", relation: root }
  - { pl: "sieć", ru: "сеть", relation: root }
  - { pl: "komputer", ru: "компьютер", relation: root, id: komputer }
etymology: "Английское Internet, заимствованное целиком, как и русское «интернет». Польский склоняет его как обычное существительное мужского рода."
memory: "internet склоняется как своё слово: w internecie «в интернете», przez internet «через интернет», dostęp do internetu. Сайт — strona internetowa."
idioms:
  - { pl: "strona internetowa", ru: "сайт" }
  - { pl: "sklep internetowy", ru: "интернет-магазин" }
  - { pl: "dostęp do internetu", ru: "доступ к интернету" }
