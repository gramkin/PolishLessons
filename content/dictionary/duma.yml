notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: duma — это ГОРДОСТЬ, а не дума. Мысль по-польски myśl, а Государственная дума — Duma Państwowa, с большой буквы и как название." }
  - { kind: government, text: "Женский род: ta duma, tej dumy. С гордостью — z dumą, творительный падеж." }
  - { kind: usage, text: "Być dumnym z czegoś «гордиться чем-л.» — с предлогом z и родительным падежом." }
  - { kind: usage, text: "Пословица Duma idzie przed upadkiem «Гордость предшествует падению» — библейская, есть и в русском." }
