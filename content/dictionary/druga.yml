pos: noun
pron: { cyr: "дру́га" }
senses:
  - id: two-oclock
    ru: "два часа (о времени)"
    examples:
      - pl: "Jest druga, pora na obiad."
        ru: "Два часа, пора обедать."
        source: { kind: authored }
      - pl: "Spotkamy się o drugiej."
        ru: "Встретимся в два."
        source: { kind: authored }
  - id: the-second-one
    ru: "вторая (из двух, о женщине или вещи)"
    examples:
      - pl: "Druga z sióstr mieszka w Krakowie."
        ru: "Вторая из сестёр живёт в Кракове."
        source: { kind: authored }
      - pl: "Pierwsza próba się nie udała, druga tak."
        ru: "Первая попытка не удалась, вторая да."
        source: { kind: authored }
  - id: others
    ru: "другие, остальные (о людях)"
    examples:
      - pl: "Nie oceniaj drugich zbyt szybko."
        ru: "Не суди других слишком быстро."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ПОЛЬСКИЙ НАЗЫВАЕТ ВРЕМЯ ПОРЯДКОВЫМ ЧИСЛИТЕЛЬНЫМ, А РУССКИЙ КОЛИЧЕСТВЕННЫМ. Jest druga буквально «есть вторая», то есть «два часа»: подразумевается godzina «час», женского рода, отсюда женская форма. По-русски так сказать нельзя, «вторая» о времени не говорят, поэтому фразу надо перестраивать целиком." }
  - { kind: government, text: "На вопрос «во сколько» ставится предложный падеж с o: O DRUGIEJ «в два часа», o trzeciej «в три». Начало и конец — od drugiej do trzeciej. Русское «в два» с винительным здесь не подходит: o drugą значило бы совсем другое." }
  - { kind: register, text: "Формы множественного числа — drudzy, drugich, drugim, drugimi — служат существительным со значением «другие, остальные люди»: pomagać drugim «помогать другим». Это оттенок книжный и слегка нравоучительный; в обиходе чаще говорят inni." }
collocations:
  - { pl: "o drugiej", ru: "в два часа" }
  - { pl: "wpół do drugiej", ru: "половина второго" }
  - { pl: "po drugiej", ru: "после двух" }
family:
  - { pl: "drugi", ru: "второй", relation: root, id: drugi }
  - { pl: "pierwsza", ru: "первая; час (время)", relation: root }
  - { pl: "godzina", ru: "час", relation: root, id: godzina }
etymology: "Субстантивированное женское drugi «второй», из праславянского *drugъ, то же слово, что русское «другой» и «друг». Значение «второй» развилось из «иной из двух». Женский род пришёл от опущенного godzina «час»."
memory: "druga — это «два часа», буквально «вторая», потому что подразумевается godzina. Во сколько? O DRUGIEJ, с предлогом o и предложным падежом. А множественное drugich значит «других людей»."
idioms:
  - { pl: "o drugiej w nocy", ru: "в два часа ночи" }
  - { pl: "pomagać drugim", ru: "помогать другим" }
formExamplesSkip:
  - { form: "druga", cell: "Звательный", reason: "звательный падеж: у этой формы он совпадает с именительным, и в обращении слово не употребляется" }
