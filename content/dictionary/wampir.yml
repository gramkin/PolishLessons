# review
id: wampir
format: 2
lemma: "wampir"
rank: 1647
pos: noun
pron: { cyr: "ва́мпир" }
senses:
  - id: vampire
    ru: "вампир, упырь"
    examples:
      - pl: "Ziri nienawidzi filmów o wampirach."
        ru: "Зири ненавидит фильмы о вампирах."
        source: { kind: translated, id: 12044091 }
      - pl: "Po Bałkanach krążą legendy o wampirach."
        ru: "По Балканам ходят легенды о вампирах."
        source: { kind: translated, id: 701605 }
      - pl: "Ona jest łowczynią wampirów."
        ru: "Она охотница на вампиров."
        source: { kind: translated, id: 12562274 }
  - id: figurative
    ru: "вампир (о человеке, о летучей мыши)"
    examples:
      - pl: "Wampir to nietoperz żywiący się krwią."
        ru: "Вампир — это летучая мышь, питающаяся кровью."
        source: { kind: authored }
      - pl: "Nazywano go wampirem za jego chciwość."
        ru: "Его называли вампиром за жадность."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово заимствовано и совпадает с русским по значению: и мифическое существо, и летучая мышь, и переносно «кровопийца»." }
  - { kind: usage, text: "В корпусе слово встречается только в формах множественного числа — o wampirach «о вампирах», łowczyni wampirów «охотница на вампиров»." }
  - { kind: usage, text: "Существительное мужское одушевлённое: wampir, wampira, wampirem, wampiry или wampirzy во множественном." }
  - { kind: usage, text: "Славянское по происхождению: именно из славянских языков слово разошлось по всей Европе." }
collocations:
  - { pl: "film o wampirach", ru: "фильм о вампирах" }
  - { pl: "legendy o wampirach", ru: "легенды о вампирах" }
  - { pl: "łowca wampirów", ru: "охотник на вампиров" }
etymology: "Слово славянского происхождения (праславянское *ǫpirь, ср. русское «упырь»), которое через немецкий и французский разошлось по всей Европе и вернулось в польский в этой форме."
memory: "wampir = «вампир», и слово изначально славянское: русское «упырь» — его прямой родственник. В корпусе встречается только во множественном: o wampirach, łowca wampirów."
