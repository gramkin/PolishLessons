        ru: "В ходе разговора выяснилось, что он лгал."
        source: { kind: authored }
  - id: lek
    ru: "ток (брачные игры глухарей, тетеревов)"
    examples:
      - pl: "Wiosną głuszce zbierają się na tok."
        ru: "Весной глухари собираются на ток."
        source: { kind: authored }
