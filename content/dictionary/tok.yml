notes:
  - { kind: false-friend, text: "Польский TOK — не электрический «ток»: тот по-польски PRĄD. TOK — это ход, течение: TOK MYŚLENIA — ход мысли, W TOKU ROZMOWY — в ходе разговора, SPRAWA JEST W TOKU — дело в процессе. Слово от TOCZYĆ «катить», и с ним же POTOK — горный ручей, и TOKARZ — токарь." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. В значении «ход» слово почти всегда в единственном числе: W TOKU, SWOIM TOKIEM. Множественное TOKI живёт в охотничьем значении: TOKI GŁUSZCÓW — токование глухарей." }
  - { kind: government, text: "В ходе чего-то — W TOKU CZEGOŚ, местный и родительный: W TOKU ŚLEDZTWA. Сбить с мысли — WYTRĄCIĆ Z TOKU MYŚLENIA, Z с родительным. Идти своим чередом — IŚĆ SWOIM TOKIEM, творительный." }
  - { kind: pronunciation, text: "Читается «ток», один слог, точно как русское слово, с которым его так легко спутать. В формах TOKI и TOKIEM сочетание KI смягчает «к»: «то́ки»." }
  - { kind: register, text: "W TOKU — канцелярское и газетное: SPRAWA W TOKU, PRACE W TOKU. TOK MYŚLENIA и TOK ROZUMOWANIA нейтральны. Охотничий TOK — специальное слово, но в рассказах о природе встречается часто." }
collocations:
  - { pl: "tok rozumowania", ru: "ход рассуждений" }
  - { pl: "w toku śledztwa", ru: "в ходе следствия" }
  - { pl: "tok studiów", ru: "курс обучения" }
family:
  - { pl: "toczyć", ru: "катить; вести (разговор, борьбу)", relation: root, id: toczyc }
  - { pl: "potok", ru: "ручей, поток", relation: derived }
  - { pl: "tokarz", ru: "токарь", relation: derived }
etymology: "От праславянского глагола со значением «течь, катиться», того же, что в русских «течь», «ток», «поток». Русский «ток» сохранил значение «течение» в словах «поток» и «водосток», а сам по себе стал электрическим; польский TOK остался «ходом»."
memory: "Tok — ход, течение, а не электрический ток: тот — prąd. W toku — в процессе, tok myślenia — ход мысли. От toczyć «катить»: potok — ручей, tokarz — токарь. Читается «ток»."
idioms:
  - { pl: "w toku", ru: "в процессе, в ходе" }
  - { pl: "iść swoim tokiem", ru: "идти своим чередом" }
formExamplesSkip:
  - { form: "toku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
