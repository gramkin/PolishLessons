pos: noun
pron: { cyr: "ток" }
senses:
  - id: course
    ru: "ход, течение (процесса)"
    examples:
      - pl: "Sprawa jest w toku."
        ru: "Дело ещё рассматривается."
        source: { kind: authored }
      - pl: "Nie przerywaj mi toku myślenia."
        ru: "Не сбивай меня с мысли."
        source: { kind: authored }
