etymology: "От SADZIĆ «сажать», из праславянского *saditi, того же корня, что русские «садить», «сад», «сажать», с приставкой PRZE-, отвечающей русскому «пере-». Буквальное значение прозрачно и совпадает с русским: пересадить растение с места на место. Переносное значение развилось из той же приставки, но по другой линии: PRZE- означает ещё и выход за пределы, перебор, как в русском «пересолить» или «перехвалить». Польский довёл этот ход до конца и сделал «перебор» основным значением слова, так что сегодня PRZESADZAĆ прежде всего «преувеличивать», а садоводческий смысл ощущается как второй. Русский тот же приём применил к другим корням — «перегибать», «перебарщивать», — а «пересаживать» оставил при буквальном смысле. Отсюда и ловушка: приставка и корень знакомы, а распределение значений противоположное."
memory: "Приставка prze- = «пере-», корень sadzić = «садить». Буквально przesadzać это «пересаживать» (kwiaty), и этот смысл есть. Но главный — переносный: «преувеличивать, перебарщивать», потому что prze- значит ещё и перебор, как в русском «пересолить». Nie przesadzaj — «не преувеличивай». Управление: с чем перебарщивать — z + творительный (przesadzać z solą). Существительное przesada только «преувеличение»: bez przesady. И разница основ по видам: przesadzaĆ с -dza-, przesadziĆ с -dzi-."
idioms:
  - { pl: "bez przesady", ru: "без преувеличения" }
  - { pl: "przesadzić z czymś", ru: "перебрать с чем-то" }
