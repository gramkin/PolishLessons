notes:
  - { kind: false-friend, text: "Польское PRZESADZAĆ выглядит как русское «пересаживать», и в одном значении это действительно оно: PRZESADZAĆ KWIATY значит «пересаживать цветы». Но главное, самое частое значение другое — «преувеличивать, перебарщивать»: NIE PRZESADZAJ значит «не преувеличивай», а не «не пересаживай». Фраза PRZESADZASZ Z SOLĄ переводится «ты перебарщиваешь с солью». Пересадить человека на другое место по-польски не PRZESADZAĆ, а PRZESIĄŚĆ SIĘ о себе и PRZESADZIĆ о другом, но обычно говорят PRZENIEŚĆ KOGOŚ. Существительное PRZESADA значит только «преувеличение»: BEZ PRZESADY «без преувеличения»." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия PRZESADZAJĄCY, одиннадцать от страдательного PRZESADZANY. Совершенная пара — PRZESADZIĆ, и в значении «преувеличить» она употребляется особенно часто в прошедшем времени: CHYBA PRZESADZIŁEM «кажется, я перебрал». Обратите внимание на разницу основ: несовершенный вид имеет -DZA-, совершенный -DZI-, то есть PRZESADZAĆ при PRZESADZIĆ. Прилагательное PRZESADNY значит «преувеличенный, чрезмерный», наречие PRZESADNIE — «чрезмерно». В значении «пересаживать растения» совершенный вид тот же PRZESADZIĆ." }
  - { kind: government, text: "В значении «преувеличивать» глагол чаще всего непереходный и управляет предлогом Z с творительным: PRZESADZAĆ Z CUKREM, Z SOLĄ, Z KOMPLEMENTAMI, то есть «перебарщивать с чем-то». Употребляется и вовсе без дополнения: NIE PRZESADZAJ. В значении «пересаживать» глагол переходный и берёт винительный: PRZESADZAĆ KWIATY, PRZESADZAĆ DRZEWKO, а куда — предлог DO с родительным: DO WIĘKSZEJ DONICZKI. Отрицание переводит дополнение в родительный: NIE PRZESADZAM TYCH KWIATÓW. Устойчивое BEZ PRZESADY значит «без преувеличения» и ставится как вводное." }
  - { kind: pronunciation, text: "Читается «пшэса́джаць», четыре слога, ударение на предпоследнем. Начальное PRZE звучит «пшэ»: сочетание RZ после P оглушается и даёт «ш», а не «ж». Это общее правило после глухих согласных, сравните PRZEZ «пшэз» и TRZY «тшы». Буквосочетание DZ даёт слитное «дж», поэтому середина слова звучит «джа». Конечное Ć — мягкое «ць». В совершенном виде PRZESADZIĆ сочетание DZI даёт мягкое «дзь»: «пшэса́дзиць», и этим двумя видами различаются на слух." }
collocations:
