# review
id: psychol
format: 2
lemma: "psychol"
rank: 5380
pos: noun
pron: { cyr: "псы́холь" }
senses:
  - id: psycho
    ru: "сленг псих, психопат"
    examples:
      - pl: "Ten psychol groził nam nożem."
        ru: "Этот псих угрожал нам ножом."
        source: { kind: authored }
      - pl: "Uciekaj, to jakiś psychol!"
        ru: "Беги, это какой-то псих!"
        source: { kind: authored }
      - pl: "Jej były to zwykły psychol."
        ru: "Её бывший — обычный псих."
        source: { kind: authored }
  - id: nutcase
    ru: "разг. чокнутый (шутл., о друге)"
    examples:
      - pl: "Ty psycholu, skoczyłeś z mostu?"
        ru: "Ты чокнутый, прыгнул с моста?"
        source: { kind: authored }
      - pl: "Mój kumpel to pozytywny psychol."
        ru: "Мой кореш — весёлый безумец."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому PSYCHOL похож на «психолога», но это совсем другое: PSYCHOL — сленговое «псих, психопат», а психолог — PSYCHOLOG. Ошибка в одну букву меняет вежливое на оскорбление. Нейтральное слово для больного — CHORY PSYCHICZNIE, а для опасного — PSYCHOPATA." }
  - { kind: usage, text: "Мужской род, одушевлённое. Множественное у этого слова пренебрежительное, не мужское-личное: PSYCHOLE, как у вещей, родительный PSYCHOLI или PSYCHOLÓW. Звательный PSYCHOLU — частое обращение: TY PSYCHOLU!" }
  - { kind: government, text: "Какой-то псих — JAKIŚ PSYCHOL, с местоимением. Падежных требований существительное не имеет. Обращение — в звательном: TY PSYCHOLU!" }
  - { kind: pronunciation, text: "Читается «псы́холь», два слога, ударение на первом. PSY — твёрдое «псы», CH — «х», конечная L мягкая. В PSYCHOLA: «псыхо́ля»." }
  - { kind: register, text: "Грубый сленг. О незнакомце — оскорбление, о друге в шутку — почти комплимент сумасбродству. В разговоре о людях с психическими расстройствами слово недопустимо." }
collocations:
  - { pl: "jakiś psychol", ru: "какой-то псих" }
  - { pl: "ty psycholu", ru: "ты, псих" }
  - { pl: "niebezpieczny psychol", ru: "опасный псих" }
family:
  - { pl: "psychopata", ru: "психопат", relation: root }
  - { pl: "psychiczny", ru: "психический", relation: root, id: psychiczny }
  - { pl: "wariat", ru: "сумасшедший", relation: root, id: wariat }
etymology: "Сленговое образование от PSYCHOPATA или PSYCHICZNY с экспрессивным окончанием -OL; происхождение суффикса неясно. Корень прозрачен: греческое psychḗ, «душа»."
memory: "Psychol — сленг: псих. Не путать с psycholog — психолог! Ty psycholu! — ты псих! Мн. ч. psychole. Читается «псы́холь»."
idioms:
  - { pl: "ty psycholu", ru: "ты, псих (обращение)" }
