id: lodka
format: 2
lemma: "łódka"
rank: 4376
pos: noun
pron: { cyr: "уу́тка" }
senses:
  - id: boat
    ru: "лодка"
    examples:
      - pl: "Wypożyczyliśmy łódkę na jeziorze."
        ru: "Мы взяли лодку напрокат на озере."
        source: { kind: authored }
