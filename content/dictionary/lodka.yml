notes:
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах K переходит в C: W ŁÓDCE. В родительном множественного беглое E: ŁÓDEK. Звательная форма не нужна." }
  - { kind: false-friend, text: "ŁÓDKA — уменьшительное от ŁÓDŹ, но по смыслу это обычная небольшая лодка: вёсельная, рыбацкая, прогулочная. ŁÓDŹ — побольше и солиднее: ŁÓDŹ PODWODNA — подводная лодка, ŁÓDŹ RATUNKOWA — спасательная шлюпка. А ŁODZIK, ещё одно уменьшительное, — моллюск наутилус." }
  - { kind: government, text: "Плыть на лодке — PŁYNĄĆ ŁÓDKĄ, творительный: поляк плывёт «лодкой». В лодке — W ŁÓDCE, местный. Сесть в лодку — WSIĄŚĆ DO ŁÓDKI, DO с родительным." }
  - { kind: pronunciation, text: "Читается «уу́тка», два слога, ударение на первом. Ł и Ó оба звучат как «у» и сливаются в долгое «уу», как в ŁÓŻKO «уу́шко». D перед K оглушается в «т». В форме ŁÓDCE: «уу́тце»." }
  - { kind: register, text: "PŁYNĄĆ W JEDNEJ ŁÓDCE, «плыть в одной лодке», — то же, что наше «быть в одной лодке»: делить общую беду. ZŁOŻYĆ DŁONIE W ŁÓDKĘ — «сложить ладони лодочкой»." }
collocations:
  - { pl: "łódka wiosłowa", ru: "вёсельная лодка" }
  - { pl: "pływać łódką", ru: "кататься на лодке" }
  - { pl: "wypożyczyć łódkę", ru: "взять лодку напрокат" }
family:
  - { pl: "łódź", ru: "лодка, судно", relation: root, id: lodz }
  - { pl: "łódeczka", ru: "лодочка", relation: derived }
  - { pl: "lodzik", ru: "наутилус (моллюск)", relation: derived }
etymology: "Уменьшительное от ŁÓDŹ, праславянского слова, общего с русским «ладья». Различие — след перестановки звуков: древнее сочетание «ол» перед согласным дало в русском «ла», а в польском ŁO, отсюда «ладья» и ŁÓDŹ."
memory: "Łódka — лодка: pływać łódką. Читается «уу́тка». Родня русской «ладьи». Płynąć w jednej łódce — быть в одной лодке. Łódź podwodna — подводная лодка."
idioms:
  - { pl: "płynąć w jednej łódce", ru: "быть в одной лодке" }
  - { pl: "złożyć dłonie w łódkę", ru: "сложить ладони лодочкой" }
formExamplesSkip:
