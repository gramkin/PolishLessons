# review
id: prawdopodobnie
format: 2
lemma: "prawdopodobnie"
rank: 666
pos: adv
pron: { cyr: "правдоподо́бне" }
senses:
  - id: probably
    ru: "вероятно, скорее всего"
    note: "НЕ «правдоподобно» — это wiarygodnie."
    examples:
      - pl: "Tom jest prawdopodobnie ok."
        ru: "Том, вероятно, в порядке."
        source: { kind: tatoeba, id: 11624994 }
      - pl: "Prawdopodobnie znowu robi z igły widły."
        ru: "Скорее всего, она опять делает из мухи слона."
        source: { kind: tatoeba, id: 2408652 }
      - pl: "Prawdopodobnie dadzą sobie z tym radę."
        ru: "Вероятно, они с этим справятся."
        source: { kind: translated, id: 1349366 }
  - id: most-probably
    ru: "najprawdopodobniej — вероятнее всего"
    note: "Превосходная степень очень частотна."
    examples:
      - pl: "Najprawdopodobniej śpi."
        ru: "Скорее всего, он спит."
        source: { kind: translated, id: 1353442 }
      - pl: "Najprawdopodobniej przyjdzie."
        ru: "Скорее всего, он придёт."
        source: { kind: translated, id: 3847903 }
      - pl: "Najprawdopodobniej."
        ru: "Скорее всего."
        source: { kind: translated, id: 13951065 }
notes:
  - { kind: false-friend, text: "Главная ловушка: слово собрано ровно как русское «правдоподобно» (prawdo- плюс podobnie), но значит не «похоже на правду», а «вероятно, скорее всего». Русское «правдоподобно» по-польски wiarygodnie." }
  - { kind: usage, text: "Превосходная степень najprawdopodobniej очень частотна и значит «вероятнее всего»: Najprawdopodobniej śpi." }
  - { kind: usage, text: "Прилагательное — prawdopodobny «вероятный», существительное — prawdopodobieństwo «вероятность»." }
  - { kind: usage, text: "Обиходные синонимы попроще — pewnie и chyba «наверное»." }
collocations:
