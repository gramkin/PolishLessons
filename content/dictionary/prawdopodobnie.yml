etymology: "Сложение prawdo- «правдо-» и podobnie «подобно» — калька латинского verisimilis, собранная тем же способом, что русское «правдоподобно», но со сдвигом значения."
memory: "prawdopodobnie — «вероятно, скорее всего», и это настоящая ловушка: слово собрано ровно как русское «правдоподобно», prawdo плюс podobnie, а значит другое. Русское «правдоподобно» по-польски будет wiarygodnie. Очень частотна превосходная степень najprawdopodobniej «вероятнее всего»: Najprawdopodobniej śpi. Обиходные синонимы — pewnie и chyba."
