# review
id: polnocny
format: 2
lemma: "północny"
rank: 1888
pos: adj
pron: { cyr: "пувно́цны" }
senses:
  - id: north
    ru: "северный"
    examples:
      - pl: "Wieje północny wiatr."
        ru: "Дует северный ветер."
        source: { kind: translated, id: 3470905 }
      - pl: "Północny wiatr wiał przez cały dzień."
        ru: "Северный ветер дул весь день."
        source: { kind: tatoeba, id: 3446217 }
      - pl: "Zimny, północny wiatr poczerwienił liście."
        ru: "Холодный северный ветер выкрасил листья в красный."
        source: { kind: translated, id: 612984 }
      - pl: "Mieszkam w północnej Szwecji."
        ru: "Я живу на севере Швеции."
        source: { kind: translated, id: 2995975 }
      - pl: "Kanada leży w Ameryce Północnej."
        ru: "Канада находится в Северной Америке."
        source: { kind: translated, id: 11485094 }
      - pl: "Kanada znajduje się w północnej części Ameryki."
        ru: "Канада расположена на севере Америки."
        source: { kind: tatoeba, id: 3452697 }
  - id: midnight
    ru: "полуночный, происходящий в полночь"
    examples:
      - pl: "Wsiedliśmy do północnego pociągu."
        ru: "Мы сели в полуночный поезд."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В географических названиях пишется с прописной буквы: Ameryka Północna, Korea Północna, Morze Północne. Но biegun północny «Северный полюс» — со строчной." }
  - { kind: usage, text: "Второе значение — «полуночный», потому что północ значит и «север», и «полночь»." }
  - { kind: usage, text: "Полный набор сторон света: północny «северный», południowy «южный», wschodni «восточный», zachodni «западный»." }
collocations:
  - { pl: "Ameryka Północna", ru: "Северная Америка" }
  - { pl: "biegun północny", ru: "Северный полюс" }
  - { pl: "północny wiatr", ru: "северный ветер" }
etymology: "От północ = pół + noc «полночь». Направление названо по положению солнца в полночь. Русское «полночь» устроено так же, но русское «северный» происходит от совсем другого корня."
memory: "północny — и «северный», и «полуночный», потому что północ — это и «север», и «полночь». Ameryka Północna, biegun północny."
idioms:
