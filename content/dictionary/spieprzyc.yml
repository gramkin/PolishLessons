notes:
  - { kind: register, text: "Слово грубоватое, но не брань: это так называемый эвфемизм на PIEPRZ «перец». Между друзьями и в сердцах оно звучит обычно, в письменном тексте, на работе или при незнакомых людях — неуместно. Нейтральные замены: ZEPSUĆ «испортить», SKNOCIĆ «запороть», POPSUĆ. Чем грубее обстановка, тем ближе к настоящей брани, потому что рядом стоит глагол PIEPRZYĆ, у которого значение куда резче. Начинающему это слово полезно узнавать на слух, но в своей речи лучше обходиться без него." }
  - { kind: usage, text: "Значение одно, но объект бывает двух родов. Либо это дело или работа: SPIEPRZYĆ SPRAWĘ, SPIEPRZYĆ ROBOTĘ, SPIEPRZYĆ EGZAMIN — то есть сделать так, что всё развалилось. Либо это впечатление и настроение: SPIEPRZYĆ WIECZÓR, SPIEPRZYĆ KOMUŚ HUMOR. Второе мягче первого. Отдельно существует несовершенный SPIEPRZAĆ, у которого есть собственное значение «убегать, уматывать», и повелительное SPIEPRZAJ! значит «вали отсюда» — это уже заметно грубее." }
  - { kind: pronunciation, text: "Читается «спе́пшыць», в два слога, с ударением на первом. Сочетание pie даёт мягкое «пе», как в русском «пепел». Сочетание prz — это «пш», одно из самых характерных польских сочетаний, и оно же стоит в PRZEPAŚĆ и PRZESŁAĆ. Конечное -yć звучит «ыць», с твёрдым ы. В формах с -ony, SPIEPRZONY, ударение смещается на предпоследний слог: «спепшо́ны»." }
  - { kind: government, text: "Глагол переходный: что испортили — винительный падеж без предлога, SPIEPRZYĆ SPRAWĘ, SPIEPRZYĆ ROBOTĘ. Кому испортили — дательный: SPIEPRZYĆ KOMUŚ WIECZÓR, SPIEPRZYĆ MI HUMOR. Эта пара падежей, винительный для вещи и дательный для человека, у польских глаголов порчи обычна, и в русском ей отвечает ровно то же: «испортить кому-то вечер»." }
collocations:
  - { pl: "spieprzyć sprawę", ru: "запороть дело" }
  - { pl: "spieprzyć robotę", ru: "запороть работу" }
  - { pl: "spieprzyć komuś wieczór", ru: "испортить кому-то вечер" }
family:
  - { pl: "pieprz", ru: "перец", relation: root }
  - { pl: "spieprzać", ru: "убегать, уматывать", relation: aspect }
  - { pl: "zepsuć", ru: "испортить", relation: root, id: zepsuc }
etymology: "От PIEPRZ «перец», из латинского PIPER через германское посредство, — того же происхождения, что русский «перец». Глагол PIEPRZYĆ исходно значил «перчить, сыпать перец», и отсюда пошли переносные значения: сначала «говорить вздор», как будто сыплешь словами, потом и более резкие. Приставка S- добавила завершённость и порчу: SPIEPRZYĆ — «насыпать столько перца, что есть нельзя», откуда и «испортить вконец». Такая судьба у приправ не редкость: русское «насолить» кому-то устроено по тому же образцу, из соли выросла неприятность."
memory: "От pieprz «перец»: s- плюс pieprzyć, буквально «переперчить». Значит «испортить, запороть»: spieprzyć sprawę. Грубовато, но не брань; в письменном тексте лучше zepsuć или sknocić. Вещь в винительном, человек в дательном: spieprzyć komuś wieczór."
idioms:
  - { pl: "spieprzyć sprawę", ru: "запороть дело" }
  - { pl: "spieprzaj!", ru: "вали отсюда! (грубое)" }
formExamplesSkip:
  - { form: "spieprzeni", reason: "SPIEPRZYĆ берёт прямым дополнением дело, работу или впечатление — SPRAWĘ, ROBOTĘ, WIECZÓR, — а человек при этом глаголе стоит в дательном падеже: SPIEPRZYĆ KOMUŚ WIECZÓR. Человека испортить этим глаголом нельзя, поэтому страдательное причастие мужско-личного множественного числа, которое предполагает людей в роли прямого дополнения, грамматически невозможно. Формы SPIEPRZONY, SPIEPRZONA и SPIEPRZONE согласуются с делом и работой и написаны, а SPIEPRZENI живёт только в таблице склонения." }
