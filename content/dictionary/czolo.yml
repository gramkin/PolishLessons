# review
id: czolo
format: 2
lemma: "czoło"
rank: 1594
pos: noun
pron: { cyr: "чо́уо" }
senses:
  - id: forehead
    ru: "лоб"
    examples:
      - pl: "Zmarszczyła czoło."
        ru: "Она наморщила лоб."
        source: { kind: translated, id: 410023 }
      - pl: "Pocałowała go w czoło."
        ru: "Она поцеловала его в лоб."
        source: { kind: translated, id: 3763038 }
      - pl: "Wysokie czoło znamionuje znaczną inteligencję."
        ru: "Высокий лоб указывает на немалый ум."
        source: { kind: translated, id: 359158 }
  - id: head-of
    ru: "na czele — во главе"
    examples:
      - pl: "Nie jest godny stania na czele."
        ru: "Он не достоин стоять во главе."
        source: { kind: translated, id: 12188869 }
      - pl: "Studenci stanęli na czele kampanii przeciw zanieczyszczeniu środowiska."
        ru: "Студенты встали во главе кампании против загрязнения среды."
        source: { kind: translated, id: 731914 }
  - id: face-up
    ru: "stawić czoła — дать отпор, встретить лицом"
    examples:
      - pl: "Staw czoła faktom."
        ru: "Смотри фактам в лицо."
        source: { kind: translated, id: 357411 }
      - pl: "Był gotów stawić czoła losowi."
        ru: "Он был готов встретить свою судьбу."
        source: { kind: translated, id: 365389 }
      - pl: "Chylę czoła przed jego wysiłkiem."
        ru: "Склоняю голову перед его усилием."
        source: { kind: translated, id: 368033 }
notes:
  - { kind: usage, text: "na czele значит «во главе»: stanąć na czele «встать во главе». Форма czele в корпусе встречается только в этом обороте." }
  - { kind: usage, text: "stawić czoła — «дать отпор, встретить лицом к лицу»: stawić czoła faktom «посмотреть фактам в лицо». Требует родительного падежа." }
  - { kind: usage, text: "chylić czoła przed kimś — «склонять голову перед кем-то», знак уважения." }
  - { kind: pronunciation, text: "В основе чередование o/e: czoło, но na czele. Такое же чередование в русском «чело — чела» отсутствует, поэтому форму надо запомнить." }
collocations:
  - { pl: "na czele", ru: "во главе" }
  - { pl: "stawić czoła", ru: "дать отпор" }
  - { pl: "zmarszczyć czoło", ru: "наморщить лоб" }
etymology: "Праславянское *čelo — то же слово, что русское «чело». Русский сохранил его как высокое слово, а польский сделал обычным названием лба."
memory: "czoło = «лоб», и это то же слово, что русское «чело», только нейтральное. Два оборота обязательны: na czele «во главе» и stawić czoła «дать отпор»."
