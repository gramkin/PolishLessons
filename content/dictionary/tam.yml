etymology: "Старопольское tamo из праславянского *tamo «в том направлении» — то же слово, что русское «там»."
memory: "Польский не различает «там» и «туда»: оба — tam. Пара к нему: tu / tutaj «тут». Разговорное oj tam значит «да ладно»."
