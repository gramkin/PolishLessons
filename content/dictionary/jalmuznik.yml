# review
id: jalmuznik
format: 2
lemma: "jałmużnik"
rank: 2358
pos: noun
pron: { cyr: "яуму́жник" }
senses:
  - id: almoner
    ru: "раздающий милостыню, раздатчик подаяния"
    examples:
      - pl: "Jałmużnik rozdawał chleb ubogim."
        ru: "Раздатчик милостыни раздавал хлеб бедным."
        source: { kind: authored }
      - pl: "Królewski jałmużnik zarządzał datkami."
        ru: "Королевский раздатчик милостыни распоряжался пожертвованиями."
        source: { kind: authored }
      - pl: "Jałmużnik stał przy bramie klasztoru."
        ru: "Раздатчик милостыни стоял у ворот монастыря."
        source: { kind: authored }
  - id: beggar
    ru: "нищий, просящий подаяние (устаревшее)"
    examples:
      - pl: "Dawniej jałmużnikiem zwano i proszącego."
        ru: "Прежде jałmużnik называли и просящего."
        source: { kind: authored }
      - pl: "Przy kościele siedział jałmużnik."
        ru: "У костёла сидел нищий."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово историческое. При дворах и монастырях jałmużnik — должность: тот, кто ведает раздачей подаяния." }
  - { kind: false-friend, text: "От jałmużna «милостыня», а это греческое ἐλεημοσύνη через латынь. Русская «милостыня» — калька того же понятия, но своим корнем." }
  - { kind: government, text: "Мужской ЛИЧНЫЙ род: мн. ч. jałmużnicy, родительный мн. jałmużników." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную. Современное «нищий» — żebrak." }
collocations:
  - { pl: "królewski jałmużnik", ru: "королевский раздатчик милостыни" }
etymology: "От jałmużna «милостыня», из греческого ἐλεημοσύνη через латынь."
