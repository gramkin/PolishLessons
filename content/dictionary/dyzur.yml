# review
id: dyzur
format: 2
lemma: "dyżur"
rank: 4270
pos: noun
pron: { cyr: "ды́жур" }
senses:
  - id: shift
    ru: "дежурство"
    examples:
      - pl: "Lekarz ma dziś nocny dyżur."
        ru: "У врача сегодня ночное дежурство."
        source: { kind: authored }
      - pl: "Kto ma dyżur w tym tygodniu?"
        ru: "Кто дежурит на этой неделе?"
        source: { kind: authored }
      - pl: "Po dyżurze poszła spać."
        ru: "После дежурства она пошла спать."
        source: { kind: authored }
  - id: hours
    ru: "дежурный режим; часы консультаций"
    examples:
      - pl: "Apteka pełni dyżur w niedzielę."
        ru: "В воскресенье эта аптека дежурная."
        source: { kind: authored }
      - pl: "Profesor ma dyżur we wtorki."
        ru: "У профессора консультации по вторникам."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DYŻUR — то же французское слово, что русское «дежурство». У него два польских значения, неожиданных для русского уха. OSTRY DYŻUR, «острое дежурство», — больница, которая сегодня принимает экстренных больных. А DYŻUR преподавателя — «часы консультаций»: PROFESOR MA DYŻUR WE WTORKI." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже R переходит в RZ: NA DYŻURZE. DYŻURNY — и прилагательное, и существительное «дежурный»: DYŻURNY RUCHU — дежурный по станции." }
  - { kind: government, text: "На дежурстве — NA DYŻURZE, местный. Дежурить — MIEĆ DYŻUR или PEŁNIĆ DYŻUR, винительный. После дежурства — PO DYŻURZE, местный." }
  - { kind: pronunciation, text: "Читается «ды́жур», два слога, ударение на первом. Y — «ы», Ż — «ж». В местном падеже DYŻURZE: «дыжу́жэ»." }
  - { kind: register, text: "Слово нейтральное и частое: о врачах, учителях, аптеках, полиции. DYŻURNY TEMAT, «дежурная тема», — тема, о которой говорят по привычке, как и у нас." }
collocations:
  - { pl: "nocny dyżur", ru: "ночное дежурство" }
  - { pl: "dyżur w aptece", ru: "дежурство аптеки" }
  - { pl: "mieć dyżur", ru: "дежурить" }
family:
  - { pl: "dyżurny", ru: "дежурный", relation: derived }
  - { pl: "dyżurować", ru: "дежурить", relation: derived }
  - { pl: "dyżurka", ru: "дежурка, комната дежурного", relation: derived }
etymology: "Из французского DE JOUR «на день, на сегодняшний день». Русский сделал из него «дежурный» и «дежурство», польский — DYŻUR и DYŻURNY. Французское J польский передал как Ż."
memory: "Dyżur — дежурство. Читается «ды́жур». Na dyżurze — на дежурстве. Ostry dyżur — дежурное приёмное отделение. Dyżur profesora — часы консультаций. Dyżurny — дежурный."
idioms:
  - { pl: "ostry dyżur", ru: "неотложка, приёмный покой" }
  - { pl: "pełnić dyżur", ru: "дежурить, нести дежурство" }
