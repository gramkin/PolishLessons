etymology: "От PRZYJEMNY «приятный», а то — от PRZYJĄĆ «принять»: приятное — то, что охотно принимаешь. Русское «приятный» построено точно так же, от старого «приять»."
memory: "Przyjemnie — приятно: przyjemnie ciepło. Читается «пшые́мне». «Приятно познакомиться» — miło mi. Przyjemność — удовольствие."
