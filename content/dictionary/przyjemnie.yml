notes:
  - { kind: false-friend, text: "PRZYJEMNIE — «приятно», корень общий с русским. Но «Приятно познакомиться!» по-польски — MIŁO MI или MIŁO MI PANA POZNAĆ, а не PRZYJEMNIE. PRZYJEMNIE описывает ощущения и обстановку: тепло, запах, вечер." }
  - { kind: usage, text: "Наречие со степенями: PRZYJEMNIE, PRZYJEMNIEJ, NAJPRZYJEMNIEJ. Работает и как безличное сказуемое: PRZYJEMNIE JEST + инфинитив, «приятно что-то делать»." }
  - { kind: government, text: "Тот, кому приятно, стоит в дательном падеже, как в русском: PRZYJEMNIE MI, PRZYJEMNIE NAM. С прилагательным означает «приятно»: PRZYJEMNIE CIEPŁY, «приятно тёплый»." }
  - { kind: pronunciation, text: "Читается «пшые́мне», ударение на предпоследнем слоге. PRZY — «пшы»: RZ после глухого P оглушается. JE — «е»." }
