etymology: "От глагола PRZEMIENIĆ, от приставки PRZE- и корня MIENIĆ, праславянского и того же, что русские «менять», «мена» и «обмен». Значит, PRZEMIANA MATERII и наш «обмен веществ» стоят на одном корне, только приставки разные: у поляка PRZE-, у нас «об-». А MIENIĆ SIĘ о переливах цвета — тот же корень в самом древнем своём смысле: меняться на глазах."
memory: "Превращение, преображение. Главное сочетание не переводится по частям: przemiana materii это «обмен веществ». Корень общий с нашим «менять», и из него же zmiana «смена» и mienic sie «переливаться». Читается «пшэмя́на», где mia даёт «мя». И запомните падеж: ulegac przemianie, дательный, потому что так требует глагол ulegac."
idioms:
  - { pl: "przemiana materii", ru: "обмен веществ" }
