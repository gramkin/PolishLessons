notes:
  - { kind: false-friend, text: "Главное сочетание переводится не по частям: PRZEMIANA MATERII это «обмен веществ», а вовсе не «превращение материи». Корень же общий с нашим: MIENIĆ родственно русскому «менять», и от него идут и ZMIANA «смена, изменение», и MIENIĆ SIĘ «переливаться» о цвете. Выходит, один польский корень держит и смену, и обмен, и перелив, и обмен веществ, а русский развёл это по разным словам." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный падежи единственного числа совпадают и дают PRZEMIANIE, а родительный стоит особо: PRZEMIANY. В родительном множественного окончания нет: PRZEMIAN. Рядом стоит ZMIANA «смена», слово куда более частое в обиходной речи." }
  - { kind: government, text: "Подвергаться превращению — ULEGAĆ PRZEMIANIE, дательный падеж, потому что глагол ULEGAĆ его требует: не PRZEMIANĘ, а PRZEMIANIE. Это стоит запомнить отдельно. Обмен веществ — PRZEMIANA MATERII, родительный без предлога. В ходе превращения — W TOKU PRZEMIANY, тоже родительный." }
  - { kind: pronunciation, text: "Читается «пшэмя́на», три слога, ударение на предпоследнем. Сочетание PRZ даёт «пш». Сочетание MIA даёт «мя»: буква I здесь не читается отдельно, а только смягчает M, ровно как в MIODOWY «мёдо́вы». Конечная A звучит обычным «а»." }
  - { kind: register, text: "Слово книжное и научное. В медицине это PRZEMIANA MATERII, и выражение стоит на каждой упаковке с витаминами. В истории — PRZEMIANY USTROJOWE «смена строя», и так в Польше называют перемены после восемьдесят девятого года. О человеке говорят PRZEMIANA WEWNĘTRZNA, и звучит это торжественно." }
collocations:
