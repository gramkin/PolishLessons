# review
id: poczac
format: 2
lemma: "począć"
rank: 2228
pos: verb
aspect: perf
pron: { cyr: "по́чонць" }
senses:
  - id: what-to-do
    ru: "что делать (в обороте co począć)"
    examples:
      - pl: "Co począć?"
        ru: "Что делать?"
        source: { kind: translated, id: 11261903 }
      - pl: "Co mam począć?"
        ru: "Что мне делать?"
        source: { kind: translated, id: 2786845 }
      - pl: "Cóż ja mam począć?"
        ru: "Что же мне делать?"
        source: { kind: translated, id: 4740494 }
  - id: begin
    ru: "начать (книжное); зачать"
    examples:
      - pl: "Sława Cycerona poczęła rosnąć."
        ru: "Слава Цицерона начала расти."
        source: { kind: translated, id: 969842 }
      - pl: "Liście drzew poczęły żółknąć."
        ru: "Листья деревьев начали желтеть."
        source: { kind: translated, id: 711040 }
notes:
  - { kind: usage, text: "В живой речи слово держится почти только в вопросе Co począć? «Что делать?» — остальное звучит книжно или архаично." }
  - { kind: usage, text: "Второе значение — «зачать»: począć dziecko. Отсюда poczęcie «зачатие» и niepokalane poczęcie «непорочное зачатие»." }
  - { kind: false-friend, text: "Корень тот же, что у początek «начало» и zacząć «начать», которые уже есть в словаре." }
  - { kind: government, text: "Совершенный вид; несовершенный — poczynać. Деепричастие począwszy od «начиная с» употребляется вполне обычно." }
collocations:
  - { pl: "co począć?", ru: "что делать?" }
  - { pl: "począwszy od", ru: "начиная с" }
etymology: "po- + cząć, тот же корень, что в początek «начало» и zacząć «начать»; ср. русское «почать», «начать»."
memory: "począć — книжное «начать», но живёт прежде всего в вопросе Co począć? «Что делать?». Второе значение — «зачать», отсюда poczęcie «зачатие»."
idioms:
  - { pl: "co począć?", ru: "что делать?" }
  - { pl: "począwszy od", ru: "начиная с" }
