# review
id: ej
format: 2
lemma: "ej"
rank: 1542
pos: interj
pron: { cyr: "эй" }
senses:
  - id: attention
    ru: "эй (оклик, привлечение внимания)"
    examples:
      - pl: "Ej!"
        ru: "Эй!"
        source: { kind: translated, id: 8607325 }
      - pl: "Ej, ty!"
        ru: "Эй, ты!"
        source: { kind: translated, id: 877084 }
      - pl: "Ej, zaczekaj chwilę."
        ru: "Эй, подожди минутку."
        source: { kind: translated, id: 3729522 }
  - id: reproach
    ru: "эй, ну-ка (одёргивание, упрёк)"
    examples:
      - pl: "Ej, bądź cicho!"
        ru: "Эй, замолчи!"
        source: { kind: translated, id: 8608372 }
      - pl: "Ej, uspokój się."
        ru: "Эй, успокойся."
        source: { kind: translated, id: 10581985 }
      - pl: "Ej, zwariowałeś?"
        ru: "Эй, ты с ума сошёл?"
        source: { kind: translated, id: 4287098 }
notes:
  - { kind: usage, text: "Междометие не склоняется и не меняется — одна форма на все случаи." }
  - { kind: usage, text: "Ej привлекает внимание или мягко одёргивает: Ej, zaczekaj chwilę «Эй, подожди минутку», Ej, uspokój się «Эй, успокойся»." }
  - { kind: false-friend, text: "Не путайте ej «эй» с hej: hej чаще приветствие («привет»), а ej почти всегда оклик или упрёк." }
  - { kind: usage, text: "Тон решает, оклик это или упрёк; на письме за ej обычно идёт запятая: Ej, ty!" }
collocations:
  - { pl: "ej, ty!", ru: "эй, ты!" }
  - { pl: "ej, zaczekaj", ru: "эй, подожди" }
  - { pl: "ej, spokojnie", ru: "эй, спокойно" }
etymology: "Звукоподражательное междометие, общеславянское: русское «эй», украинское «ей», чешское hej. Такие оклики почти не меняются от языка к языку."
memory: "ej = «эй»: оклик или лёгкий упрёк. Пара к нему — hej, но hej чаще значит «привет», а ej — «эй, погоди» или «эй, перестань»."
idioms:
