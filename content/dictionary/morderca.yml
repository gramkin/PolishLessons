# review
id: morderca
format: 2
lemma: "morderca"
rank: 873
pos: noun
pron: { cyr: "морде́рца" }
senses:
  - id: murderer
    ru: "убийца"
    examples:
      - pl: "Morderca!"
        ru: "Убийца!"
        source: { kind: translated, id: 11261137 }
      - pl: "Między nami jest morderca."
        ru: "Среди нас убийца."
        source: { kind: translated, id: 10770838 }
      - pl: "Morderca przyznał się do zbrodni."
        ru: "Убийца признался в преступлении."
        source: { kind: translated, id: 1002728 }
  - id: predicate
    ru: "jest mordercą — он убийца (творительный после być)"
    examples:
      - pl: "Jesteś mordercą."
        ru: "Ты убийца."
        source: { kind: translated, id: 744209 }
      - pl: "Tom jest mordercą."
        ru: "Том убийца."
        source: { kind: translated, id: 8698406 }
      - pl: "Został mordercą."
        ru: "Он стал убийцей."
        source: { kind: translated, id: 12188758 }
  - id: caught
    ru: "о поимке и розыске"
    examples:
      - pl: "Policja aresztowała mordercę."
        ru: "Полиция арестовала убийцу."
        source: { kind: translated, id: 4101671 }
      - pl: "Policjant złapał mordercę i założył mu kajdanki."
        ru: "Полицейский поймал убийцу и надел на него наручники."
        source: { kind: translated, id: 2233964 }
      - pl: "Mordercy jeszcze nie schwytano."
        ru: "Убийцу ещё не поймали."
        source: { kind: translated, id: 744019 }
notes:
  - { kind: usage, text: "Слово мужского рода, но склоняется по женскому образцу: morderca, mordercy, mordercę, mordercą — как zabójca, kolega и idiota. Во множественном числе мужское лицо: mordercy «убийцы»." }
  - { kind: usage, text: "morderca и zabójca значат почти одно и то же, но morderca подчёркивает умысел: это убийца-преступник. zabójca шире — «тот, кто убил»." }
  - { kind: government, text: "После być и zostać — творительный падеж: jesteś mordercą «ты убийца», został mordercą «он стал убийцей»." }
  - { kind: usage, text: "Однокоренные: morderstwo «убийство», mordować «убивать», mord «резня». Русское «морда» к ним отношения не имеет." }
collocations:
  - { pl: "seryjny morderca", ru: "серийный убийца" }
  - { pl: "złapać mordercę", ru: "поймать убийцу" }
  - { pl: "jest mordercą", ru: "он убийца" }
  - { pl: "morderstwo", ru: "убийство" }
family:
  - { pl: "morderstwo", ru: "убийство", relation: derived }
  - { pl: "mordować", ru: "убивать", relation: root }
  - { pl: "mord", ru: "резня", relation: root }
etymology: "От mordować «убивать», из немецкого Mord «убийство». Русское «морда» ни при чём — созвучие случайное."
memory: "morderca — «убийца», с упором на умысел; более широкое слово — zabójca. Главное тут грамматика: слово мужского рода, а склоняется по женскому образцу, как kolega и zabójca: morderca, mordercy, mordercę, mordercą. После być — творительный: jesteś mordercą."
idioms:
  - { pl: "seryjny morderca", ru: "серийный убийца" }
  - { pl: "złapać mordercę", ru: "поймать убийцу" }
  - { pl: "przyznać się do morderstwa", ru: "признаться в убийстве" }
