# review
id: witac
format: 2
lemma: "witać"
rank: 242
pos: verb
aspect: imperf
pron: { cyr: "ви́таць" }
senses:
  - id: greet
    ru: "приветствовать, встречать"
    examples:
      - pl: "Witamy w Japonii."
        ru: "Добро пожаловать в Японию."
        source: { kind: tatoeba, id: 352005 }
      - pl: "No witamy Ciebie serdecznie."
        ru: "Приветствуем тебя сердечно."
        source: { kind: tatoeba, id: 1735727 }
      - pl: "Witamy w Polsce!"
        ru: "Добро пожаловать в Польшу!"
        source: { kind: authored }
  - id: greet-each-other
    ru: "witać się — здороваться"
    note: "witać się z kimś «здороваться с кем-то»."
    examples:
      - pl: "Witaj, Tomku!"
        ru: "Привет, Томек!"
        source: { kind: authored }
      - pl: "Witam pana serdecznie."
        ru: "Сердечно приветствую вас."
        source: { kind: authored }
      - pl: "Witamy się za rękę."
        ru: "Мы здороваемся за руку."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Формы приветствия различаются по адресату: Witam! — вежливое «Здравствуйте!» (часто в письмах и по телефону), Witaj! — «Привет!» одному, Witajcie! — нескольким, Witamy! — «Добро пожаловать!» от лица хозяев." }
  - { kind: usage, text: "witać się z kimś значит «здороваться с кем-то»: Witam się z sąsiadem codziennie." }
  - { kind: usage, text: "Совершенный вид — przywitać или powitać: Przywitał gości w drzwiach." }
  - { kind: register, text: "Witam в начале письма звучит нейтрально-вежливо, но к начальству лучше Dzień dobry или Szanowny Panie." }
collocations:
  - { pl: "witać gości", ru: "встречать гостей" }
  - { pl: "witać się z kimś", ru: "здороваться с кем-то" }
  - { pl: "witaj w domu", ru: "добро пожаловать домой" }
  - { pl: "serdecznie witamy", ru: "сердечно приветствуем" }
etymology: "Праславянское *vitati «гостеприимно принимать»; тот же корень, что в русских «привет», «приветствовать»."
memory: "Witam! — «Здравствуйте!», Witaj! — «Привет!» одному, Witajcie! — нескольким, Witamy! — «Добро пожаловать!». Корень тот же, что в русском «привет»."
idioms:
  - { pl: "witaj w klubie", ru: "добро пожаловать в клуб" }
  - { pl: "witać z otwartymi ramionami", ru: "встречать с распростёртыми объятиями" }
  - { pl: "już witać się z gąską", ru: "делить шкуру неубитого медведя" }
