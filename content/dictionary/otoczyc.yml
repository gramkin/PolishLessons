# review
id: otoczyc
format: 2
lemma: "otoczyć"
rank: 2237
pos: verb
pron: { cyr: "ото́чыць" }
senses:
  - id: surround
    ru: "окружить, обступить"
    examples:
      - pl: "Policja otoczyła budynek."
        ru: "Полиция окружила здание."
        source: { kind: authored }
      - pl: "Otoczyli go ciasnym kręgiem."
        ru: "Они окружили его тесным кольцом."
        source: { kind: authored }
  - id: enclose
    ru: "обнести, обвести (оградой)"
    examples:
      - pl: "Ogród otoczono wysokim murem."
        ru: "Сад обнесли высокой стеной."
        source: { kind: authored }
      - pl: "Dom otoczony żywopłotem stoi na końcu ulicy."
        ru: "Дом, обнесённый живой изгородью, стоит в конце улицы."
        source: { kind: authored }
  - id: surround-with-care
    ru: "окружить (заботой, вниманием)"
    examples:
      - pl: "Otoczyli chorego opieką."
        ru: "Они окружили больного заботой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ НЕ «ТОЧИТЬ», А «КАТИТЬ». Otoczyć собрано из o- и toczyć, а toczyć значит «КАТИТЬ»: toczyć beczkę «катить бочку». Окружить — значит обкатить, обвести вокруг. Русское «обточить» от другого глагола, «точить», и означает совсем иное. По смыслу польскому otoczyć отвечает «окружить», построенное на «круге»." }
  - { kind: government, text: "Окружают КОГО или ЧТО — винительный без предлога: otoczyć budynek, otoczyć miasto. ЧЕМ — творительный: otoczyć murem, płotem, opieką, troską. Оборот otoczyć kogoś opieką «окружить кого-л. заботой» совпадает с русским дословно." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — otaczać. Поэтому у глагола есть деепричастие на -wszy (otoczywszy) и нет форм действительного причастия настоящего времени: они принадлежат otaczać. Отглагольное otoczenie живёт самостоятельно и значит «окружение, среда, окружающие»: w swoim otoczeniu, ochrona otoczenia." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: o-TO-czyć. Cz читается как твёрдое ч: «ото́чыць». В страдательном причастии cz переходит в cz с о: otoczony — «оточ о́ны», с ударением на предпоследнем слоге." }
collocations:
  - { pl: "otoczyć opieką", ru: "окружить заботой" }
  - { pl: "otoczyć budynek", ru: "окружить здание" }
  - { pl: "otoczony murem", ru: "обнесённый стеной" }
family:
  - { pl: "toczyć", ru: "катить", relation: root, id: toczyc }
  - { pl: "otaczać", ru: "окружать", relation: aspect, id: otaczac }
  - { pl: "otoczenie", ru: "окружение, среда", relation: derived }
etymology: "Приставка o- плюс toczyć «катить», из праславянского *točiti. Окружить значило обвести вокруг, обкатить по кругу. Русский на этом месте взял «круг» и получил «окружить», а тот же корень *točiti дал ему «точить» и «ток». Отсюда otaczać, otoczenie, roztoczyć и wytoczyć."
memory: "otoczyć — «окружить», и корень тут не «точить», а toczyć «КАТИТЬ»: обвести вокруг, обкатить. Чем окружают — творительный: otoczyć murem, otoczyć opieką. А существительное otoczenie значит «окружение, среда»."
idioms:
  - { pl: "otoczyć kogoś opieką", ru: "окружить кого-л. заботой" }
  - { pl: "otoczony murem", ru: "обнесённый стеной" }
