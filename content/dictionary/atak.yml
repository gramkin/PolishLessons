# review
id: atak
format: 2
lemma: "atak"
rank: 659
pos: noun
pron: { cyr: "а́так" }
senses:
  - id: attack
    ru: "атака, нападение"
    note: "atak NA coś — нападение на что-л. (винительный)."
    examples:
      - pl: "Do ataku!"
        ru: "В атаку!"
        source: { kind: translated, id: 12359611 }
      - pl: "Żołnierze dostali rozkaz ataku."
        ru: "Солдаты получили приказ атаковать."
        source: { kind: translated, id: 362398 }
      - pl: "Po naszym pierwszym ataku nieprzyjaciel uciekł."
        ru: "После нашей первой атаки неприятель бежал."
        source: { kind: translated, id: 771906 }
  - id: fit
    ru: "приступ (сердечный, паники, астмы)"
    note: "Значение, которого у русской «атаки» нет."
    examples:
      - pl: "Miałem atak serca."
        ru: "У меня был сердечный приступ."
        source: { kind: translated, id: 525595 }
      - pl: "Miałem atak astmy."
        ru: "У меня был приступ астмы."
        source: { kind: translated, id: 9685800 }
      - pl: "Miałam atak paniki."
        ru: "У меня была паническая атака."
        source: { kind: translated, id: 12191464 }
  - id: attacks
    ru: "ataki — приступы; нападения"
    examples:
      - pl: "Sami miała ataki paniki."
        ru: "У Сами были панические атаки."
        source: { kind: translated, id: 10574770 }
      - pl: "Moja córka często miewała ataki astmy, kiedy była dzieckiem."
        ru: "У моей дочери в детстве часто случались приступы астмы."
        source: { kind: translated, id: 3662127 }
      - pl: "Nie boją się ataków."
        ru: "Они не боятся нападений."
        source: { kind: translated, id: 3572489 }
notes:
  - { kind: false-friend, text: "Второе значение шире русского: atak serca «сердечный приступ, инфаркт», atak astmy «приступ астмы», atak paniki «паническая атака». Русская «атака» в медицине так не работает — там говорят «приступ»." }
  - { kind: usage, text: "Род не совпадает: польское atak мужского рода (ten atak), а русская «атака» — женского." }
  - { kind: government, text: "«Нападение на что-то» — atak NA coś, с винительным: atak na miasto, ataki na USA. «В атаку!» — Do ataku!, с родительным после do." }
  - { kind: usage, text: "Глагол того же гнезда — atakować «атаковать»: atakować przeciwnika." }
collocations:
  - { pl: "atak serca", ru: "сердечный приступ" }
  - { pl: "atak paniki", ru: "паническая атака" }
  - { pl: "Do ataku!", ru: "В атаку!" }
  - { pl: "atak na miasto", ru: "нападение на город" }
family:
  - { pl: "atakować", ru: "атаковать", relation: derived }
  - { pl: "napad", ru: "налёт, приступ", relation: root }
  - { pl: "atakujący", ru: "нападающий", relation: derived }
etymology: "Из французского attaque через немецкий — то же заимствование, что и русская «атака», но польское слово стало мужского рода."
memory: "atak — «атака», но держите в голове второе значение, которого у русского слова нет: atak serca «сердечный приступ», atak paniki «паническая атака», atak astmy. И род другой: польское atak мужского рода, ten atak, тогда как русская «атака» женского. Нападение на что-то — atak NA coś с винительным, а «В атаку!» будет Do ataku!, с родительным."
idioms:
  - { pl: "atak serca", ru: "сердечный приступ" }
  - { pl: "atak paniki", ru: "паническая атака" }
  - { pl: "Do ataku!", ru: "В атаку!" }
