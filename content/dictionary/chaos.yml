etymology: "Из греческого KHAOS «зияние, разверстая бездна», от корня, означавшего «зевать, раскрываться»: тот же корень дал греческое KHAINEIN и, через латынь, английское CHASM «пропасть». Так что исходно хаос — это не куча, а пустота, зев, провал. У Гесиода CHAOS есть то, что было прежде всего остального, и лишь потом из него родились земля и небо. Значение «беспорядок» наросло позже, когда латинские авторы стали понимать хаос как неразделённую смесь первоначальных веществ. Русское «хаос» пришло из того же греческого через церковную и научную традицию, поэтому слова совпадают, а польское правописание CH отражает греческую хи, которую польский передаёт двумя буквами, а русский одной."
memory: "Ch в польском всегда «х», и слово читается «ха́ос» с ударением на первом слоге — в отличие от русского, где допустимо и «хао́с». К хаосу — doprowadzić DO chaosu, с родительным, где русский берёт дательный. Исходный греческий смысл не «куча», а «зияние, бездна»: khaos, откуда и английское chasm."
