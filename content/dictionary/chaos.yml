notes:
  - { kind: pronunciation, text: "Читается «ха́ос», ударение на первом слоге из двух. Сочетание CH в польском всегда даёт «х» и ничем не отличается от простой H: CHAOS и HAK начинаются одним и тем же звуком, а разница только в правописании, унаследованном от этимологии. Слово двусложное, CHA-OS, и гласные не сливаются. В русском допускают и «ха́ос», и «хао́с», в польском же ударение жёстко на предпоследнем слоге, то есть только «ха́ос»." }
  - { kind: usage, text: "Самые частые сочетания: CHAOS ORGANIZACYJNY «организационный хаос», CHAOS INFORMACYJNY, ZAPANOWAŁ CHAOS «наступил хаос», DOPROWADZIĆ DO CHAOSU. Прилагательное — CHAOTYCZNY «хаотичный», наречие CHAOTYCZNIE. Множественное число у слова есть в таблице, но в живой речи почти не встречается: понятие неисчисляемое, и формы CHAOSY, CHAOSÓW звучат как термин из научного текста о нескольких разных системах. В физике и математике TEORIA CHAOSU — устойчивый термин." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: WYWOŁAŁ CHAOS. Родительный на -U: DOPROWADZIĆ DO CHAOSU «привести к хаосу», с предлогом DO и родительным, тогда как русский скажет «к хаосу» с дательным — это расхождение стоит запомнить. Местный на -IE: W CHAOSIE «в хаосе». При отрицании винительный уходит в родительный: NIE WYWOŁAŁ CHAOSU. Чего хаос — родительный без предлога: CHAOS POJĘĆ «путаница понятий»." }
  - { kind: false-friend, text: "Значение совпадает с русским полностью, и единственная трудность — произношение и ударение. Зато полезно знать, что исходный греческий смысл был не «беспорядок», а «зияние, пустое пространство»: KHAOS значило разверстую бездну. Беспорядок появился позже, через латинские и средневековые толкования, где хаос стал неразделённой смесью первовещества. Поэтому в мифологическом контексте CHAOS PIERWOTNY означает именно пустоту и зев, а не кучу вещей, и этот оттенок в обоих языках сохранился только в книжном употреблении." }
