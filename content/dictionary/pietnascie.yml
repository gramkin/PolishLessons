notes:
  - { kind: false-friend, text: "PIĘTNAŚCIE — «пятнадцать»: PIĘĆ + NAŚCIE, «пять на десять». Но о мужчинах — PIĘTNASTU, о детях — PIĘTNAŚCIORO. И 15 минут чаще называют KWADRANS «четверть часа»." }
  - { kind: usage, text: "Косвенные падежи — PIĘTNASTU, творительный — PIĘTNASTOMA. PIĘTNASTU — ещё и счёт мужчин. Собирательное PIĘTNAŚCIORO — для детей и смешанных групп. PIĘTNASTO- — первая часть сложных слов: PIĘTNASTOLATEK «пятнадцатилетний подросток»." }
  - { kind: government, text: "Требует родительного множественного: PIĘTNAŚCIE MINUT, PIĘTNAŚCIE OSÓB. Глагол в прошедшем — средний род: MINĘŁO PIĘTNAŚCIE LAT." }
  - { kind: pronunciation, text: "Читается «пентна́сьце»: Ę перед T — «эн», ŚCIE — «сьце». Ударение на предпоследнем слоге. PIĘTNASTU — «пентна́сту»." }
  - { kind: register, text: "Нейтральное слово. В разговоре о времени — KWADRANS: ZA KWADRANS DRUGA «без четверти два»." }
