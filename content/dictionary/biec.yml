# review
id: biec
format: 2
lemma: "biec"
rank: 1288
pos: verb
aspect: imperf
pron: { cyr: "бець" }
senses:
  - id: run
    ru: "бежать (в одну сторону)"
    examples:
      - pl: "Biegł z całych sił."
        ru: "Он бежал во всю прыть."
        source: { kind: tatoeba, id: 661292 }
      - pl: "Widziałem go, jak biegł."
        ru: "Я видел, как он бежал."
        source: { kind: tatoeba, id: 352007 }
      - pl: "Biegnie."
        ru: "Он бежит."
        source: { kind: translated, id: 6160752 }
  - id: run-imperative
    ru: "biegnij! — беги!"
    examples:
      - pl: "Biegnij."
        ru: "Беги."
        source: { kind: translated, id: 6160593 }
      - pl: "Nie biegnij tak szybko!"
        ru: "Не беги так быстро!"
        source: { kind: translated, id: 8522636 }
      - pl: "Zaczął biec."
        ru: "Он побежал."
        source: { kind: translated, id: 362369 }
  - id: route
    ru: "о дороге, путях: пролегать, идти"
    examples:
      - pl: "Droga biegnie wzdłuż morza."
        ru: "Дорога идёт вдоль моря."
        source: { kind: tatoeba, id: 11663450 }
      - pl: "Tam droga skręca i biegnie w dół."
        ru: "Там дорога поворачивает и идёт вниз."
        source: { kind: tatoeba, id: 6313310 }
      - pl: "Tory biegną równolegle do drogi."
        ru: "Пути идут параллельно дороге."
        source: { kind: translated, id: 5733253 }
notes:
  - { kind: false-friend, text: "Польское biec — однонаправленное «бежать» (сейчас, в одну сторону), а biegać — многократное «бегать». Русская пара «бежать — бегать» устроена точно так же." }
  - { kind: usage, text: "О дорогах, путях и границах значит «пролегать, идти»: Droga biegnie wzdłuż morza «Дорога идёт вдоль моря»." }
  - { kind: usage, text: "Основа чередуется резко: инфинитив biec, но biegnę, biegniesz, biegnie в настоящем и biegł, biegła в прошедшем." }
  - { kind: usage, text: "Форма biegły в текстах обычно оказывается прилагательным «сведущий, беглый», а не формой этого глагола." }
collocations:
  - { pl: "biec szybko", ru: "быстро бежать" }
  - { pl: "biegnij", ru: "беги" }
  - { pl: "droga biegnie", ru: "дорога идёт" }
etymology: "Праславянское *běgti — то же слово, что русское «бежать». Отсюда же bieg «бег» и biegacz «бегун»."
memory: "biec — «бежать» в одну сторону, а biegać — «бегать» туда-сюда: пара устроена как русская. Основа чередуется резко: biec, но biegnę, biegnie, biegł. О дороге значит «пролегать»: Droga biegnie wzdłuż morza."
idioms:
  - { pl: "biec z całych sił", ru: "бежать изо всех сил" }
  - { pl: "droga biegnie", ru: "дорога идёт" }
  - { pl: "biegnij!", ru: "беги!" }
