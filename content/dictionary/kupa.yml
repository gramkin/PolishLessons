# review
id: kupa
format: 2
lemma: "kupa"
rank: 1234
pos: noun
pron: { cyr: "ку́па" }
senses:
  - id: heap-of
    ru: "куча, масса (много чего-то)"
    examples:
      - pl: "To kupa pieniędzy!"
        ru: "Это куча денег!"
        source: { kind: translated, id: 925900 }
      - pl: "Straciliśmy kupę kasy."
        ru: "Мы потеряли кучу денег."
        source: { kind: translated, id: 7704802 }
      - pl: "Kosztowało mnie to kupę kasy."
        ru: "Это стоило мне кучу денег."
        source: { kind: translated, id: 7704805 }
  - id: hold-together
    ru: "trzymać się kupy — быть связным, держаться вместе"
    examples:
      - pl: "Twoja teoria nie trzyma się kupy."
        ru: "Твоя теория не выдерживает критики."
        source: { kind: translated, id: 717359 }
      - pl: "To zdanie nie trzyma się kupy."
        ru: "Это предложение бессвязно."
        source: { kind: translated, id: 956934 }
      - pl: "Teraz trzyma się to kupy."
        ru: "Теперь это связно."
        source: { kind: translated, id: 1614346 }
  - id: pile
    ru: "куча, груда (физическая)"
    examples:
      - pl: "Co ta kupa futra robi w salonie?"
        ru: "Что эта куча меха делает в гостиной?"
        source: { kind: translated, id: 12469788 }
      - pl: "Poskładał do kupy popękane kawałki."
        ru: "Он сложил вместе треснувшие кусочки."
        source: { kind: translated, id: 416482 }
      - pl: "Należy omijać szerokim łukiem wszelkie psie kupy na chodniku."
        ru: "Собачьи кучи на тротуаре следует обходить стороной."
        source: { kind: translated, id: 10007946 }
notes:
  - { kind: register, text: "Осторожно: первое словарное значение kupa — «кал», и в детской речи zrobić kupę значит «сходить по-большому». В переносных оборотах слово совершенно нейтрально." }
  - { kind: usage, text: "Главный оборот — trzymać się kupy: о людях «держаться вместе», о рассуждении «быть связным». Twoja teoria nie trzyma się kupy «Твоя теория не выдерживает критики»." }
  - { kind: usage, text: "Kupa kasy «куча денег» — разговорное. Нейтральное «много» — dużo или mnóstwo." }
  - { kind: false-friend, text: "Форма kup в корпусе — это почти всегда повелительное наклонение от kupić «купи», а не форма этого существительного." }
collocations:
  - { pl: "kupa pieniędzy", ru: "куча денег" }
  - { pl: "trzymać się kupy", ru: "быть связным" }
  - { pl: "do kupy", ru: "вместе, воедино" }
etymology: "Праславянское *kupa «куча, груда» — то же слово, что русская «купа» деревьев и наречие «купно» «вместе». Отсюда же польское do kupy «воедино»."
memory: "kupa — «куча»: kupa pieniędzy «куча денег». Главный оборот — trzymać się kupy «быть связным»: Twoja teoria nie trzyma się kupy. Но помните, что у слова есть и значение «кал»."
