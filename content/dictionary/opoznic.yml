etymology: "От PÓŹNO «поздно», из праславянского *pozdьno, того же, что русское «поздно», с приставкой O-, означающей здесь перевод в состояние: сделать поздним, отодвинуть во времени. Русский построил от того же корня «опоздать», но сделал его непереходным и отнёс к человеку, а для задержки предмета взял другой корень — «держать». Польский распределил работу иначе: OPÓŹNIĆ отвечает за задержку чего-то, SPÓŹNIĆ SIĘ с приставкой S- и возвратной частицей — за опоздание человека. Отсюда и главная ошибка русскоязычных, которые переносят единственный русский глагол на обе польские клетки. Буква Ó в корне пишется по исторической причине — на месте старого долгого О, — а читается как У, и это видно в сравнении с русским «поздно», где О осталось коротким."
memory: "Корень как в русском «поздно»: późny «поздний». Но польский делит на три слова там, где русский говорит «опоздать». Opóźnić — переходный: задержать что-то. Spóźnić się — опоздать самому: «я опоздал» это spóźniłem się, а не opóźniłem. Opóźnienie — задержка, и фраза для вокзала: pociąg ma opóźnienie. На сколько задержать — предлог o с винительным: o godzinę, где русский говорит «на час». Ó читается как «у»: «опу́зьниць»."
