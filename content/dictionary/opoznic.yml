notes:
  - { kind: false-friend, text: "Корень PÓŹNO — это русское «поздно», и PÓŹNY значит «поздний». Но польский развёл на этом корне три слова, которые русский сводит к одному «опоздать», и путать их нельзя. OPÓŹNIĆ — переходный: задержать что-то, отложить. SPÓŹNIĆ SIĘ — возвратный: опоздать самому, о человеке. OPÓŹNIENIE — существительное: задержка, опоздание. Поэтому «я опоздал» по-польски SPÓŹNIŁEM SIĘ, а не OPÓŹNIŁEM — последнее значило бы «я что-то задержал». А фраза, которая нужна каждому путешественнику, звучит POCIĄG MA OPÓŹNIENIE «поезд опаздывает», буквально «имеет опоздание»." }
  - { kind: usage, text: "Совершенный вид, переходный, пятьдесят три формы: сорок две от глагола, одна у деепричастия прошедшего времени OPÓŹNIWSZY и одиннадцать у страдательного причастия OPÓŹNIONY. Деепричастия на -ĄC нет, потому что у совершенного вида его не бывает. Несовершенная пара — OPÓŹNIAĆ. Причастие OPÓŹNIONY — самое употребительное слово гнезда после существительного: POCIĄG OPÓŹNIONY, LOT OPÓŹNIONY, и на вокзальных табло оно стоит именно в этой форме. Возвратное OPÓŹNIĆ SIĘ тоже существует, но относится к процессам, а не к людям: ZEGAREK SIĘ OPÓŹNIA «часы отстают»." }
  - { kind: government, text: "Переходный: задержать что — винительный без предлога, OPÓŹNIĆ START, LOT, DECYZJĘ, PŁATNOŚĆ. На сколько — предлог O с винительным: OPÓŹNIĆ O GODZINĘ, O DWA DNI, и русское «на час» отвечает польскому O GODZINĘ, что стоит запомнить отдельно: предлог другой. Отрицание переводит дополнение в родительный: NIE OPÓŹNIŁ WYPŁATY. Существительное OPÓŹNIENIE управляет предлогом W с местным: OPÓŹNIENIE W DOSTAWACH «задержка в поставках», а оборот Z OPÓŹNIENIEM значит «с опозданием»." }
  - { kind: pronunciation, text: "Читается «опу́зьниць», три слога, ударение на предпоследнем. Буква Ó читается как «у»: не «опозьниць», а «опузьниць» — это та же буква, что в CÓRKA и MÓGŁ. Буква Ź даёт мягкое «зь», одним звуком. Буква Ń — мягкое «нь». Конечное Ć — мягкое «ць», так что в конце слова идут три мягких согласных подряд. В существительном OPÓŹNIENIE четыре слога, ударение предпоследнее: «опузьне́не». В причастии OPÓŹNIONY ударение тоже предпоследнее: «опузьо́ны»." }
