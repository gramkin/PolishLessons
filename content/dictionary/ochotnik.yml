notes:
  - { kind: false-friend, text: "OCHOTNIK — «доброволец», а не «охотник»! Охотник — MYŚLIWY. Корень — OCHOTA «охота, желание»: MAM OCHOTĘ, «мне хочется». Сельская добровольная пожарная дружина — OCHOTNICZA STRAŻ POŻARNA, OSP." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: OCHOTNICY. Синоним — WOLONTARIUSZ, особенно о благотворительности." }
  - { kind: government, text: "Вызваться добровольцем — ZGŁOSIĆ SIĘ NA OCHOTNIKA, NA с винительным. Доброволец для чего — DO, и родительный: OCHOTNIK DO POMOCY." }
  - { kind: pronunciation, text: "Читается «охо́тник», ударение на предпоследнем слоге. CH — «х»." }
collocations:
  - { pl: "zgłosić się na ochotnika", ru: "вызваться добровольцем" }
  - { pl: "ochotnicza straż pożarna", ru: "добровольная пожарная дружина" }
  - { pl: "szukać ochotnika", ru: "искать добровольца" }
family:
  - { pl: "ochota", ru: "охота, желание", relation: root, id: ochota }
  - { pl: "ochotniczy", ru: "добровольный", relation: derived }
  - { pl: "ochoczo", ru: "охотно", relation: root }
etymology: "От OCHOTA «желание, охота»: доброволец — тот, у кого есть охота. Русский «охотник» от того же корня ушёл к охоте на зверя."
memory: "Ochotnik — доброволец, а не «охотник» (myśliwy). Читается «охо́тник». Mam ochotę — мне хочется. Zgłosić się na ochotnika — вызваться."
idioms:
  - { pl: "mieć ochotę na coś", ru: "хотеть чего-то" }
