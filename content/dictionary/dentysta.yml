notes:
  - { kind: false-friend, text: "DENTYSTA — обычное «зубной врач». Русское «дантист» звучит старомодно, а польское слово нейтральное. Официальное название — STOMATOLOG, и обращаются к нему PANIE DOKTORZE." }
  - { kind: usage, text: "Десять живых форм. Мужской род, но в единственном склоняется как женское на -A: DENTYSTY, DENTYSTĘ, DENTYSTĄ, а в дательном и местном ST смягчается: DENTYŚCIE. Множественное — DENTYŚCI, DENTYSTÓW. Звательный DENTYSTO не даётся." }
  - { kind: government, text: "К зубному — DO DENTYSTY, DO с родительным. У зубного — U DENTYSTY. Записаться к зубному — UMÓWIĆ SIĘ DO DENTYSTY." }
  - { kind: pronunciation, text: "Читается «дэнты́ста», ударение на предпоследнем слоге. DE — твёрдое «дэ», TY — «ты»." }
collocations:
  - { pl: "iść do dentysty", ru: "пойти к зубному" }
  - { pl: "wizyta u dentysty", ru: "визит к стоматологу" }
  - { pl: "bać się dentysty", ru: "бояться зубного врача" }
