etymology: "Из французского, от латинского слова «зуб». Русское «дантист» — из того же источника, но с французским «ан»."
memory: "Dentysta — зубной врач. Читается «дэнты́ста». Iść do dentysty — пойти к зубному. Dentyści — стоматологи. Gabinet dentystyczny — зубной кабинет."
