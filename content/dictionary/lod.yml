# review
id: lod
format: 2
lemma: "lód"
rank: 941
pos: noun
pron: { cyr: "ўут" }
senses:
  - id: ice
    ru: "лёд"
    examples:
      - pl: "Lód stopniał."
        ru: "Лёд растаял."
        source: { kind: tatoeba, id: 351922 }
      - pl: "Lód się topi."
        ru: "Лёд тает."
        source: { kind: tatoeba, id: 12680278 }
      - pl: "Lód był bardzo gruby."
        ru: "Лёд был очень толстый."
        source: { kind: tatoeba, id: 11572283 }
  - id: ice-cream
    ru: "lody (мн. ч.) — мороженое"
    note: "Во множественном числе слово значит «мороженое», а один рожок — lód или loda."
    examples:
      - pl: "Lubię lody."
        ru: "Мне нравится мороженое."
        source: { kind: tatoeba, id: 1611632 }
      - pl: "Wszyscy lubią lody."
        ru: "Все любят мороженое."
        source: { kind: tatoeba, id: 4491106 }
      - pl: "Najlepsze lody jadłam we Włoszech."
        ru: "Лучшее мороженое я ела в Италии."
        source: { kind: tatoeba, id: 13465763 }
  - id: on-ice
    ru: "na lodzie, po lodzie — на льду, по льду"
    examples:
      - pl: "Zimą na wyspę można dojść po lodzie."
        ru: "Зимой до острова можно дойти по льду."
        source: { kind: tatoeba, id: 12624972 }
      - pl: "Pośliznął się na lodzie."
        ru: "Он поскользнулся на льду."
        source: { kind: translated, id: 358792 }
      - pl: "Zbudował dom na lodzie."
        ru: "Он построил дом на льду."
        source: { kind: translated, id: 998569 }
notes:
  - { kind: false-friend, text: "Главное, что стоит запомнить: во множественном числе lody значит «мороженое», а не «льды». Lubię lody — «Я люблю мороженое». Один рожок — loda: Chcę loda «Хочу мороженого»." }
  - { kind: usage, text: "Косвенные формы теряют ó: lód, но lodu, lodem, na lodzie. То же чередование, что в łódź — łodzi." }
  - { kind: usage, text: "mieć forsy jak lodu — «денег куры не клюют», буквально «иметь денег как льда». А przełamać pierwsze lody значит «растопить лёд, преодолеть неловкость»." }
  - { kind: usage, text: "stąpać po cienkim lodzie — «ходить по тонкому льду», то есть рисковать. Совпадает с русским оборотом." }
collocations:
  - { pl: "lody", ru: "мороженое" }
  - { pl: "na lodzie", ru: "на льду" }
  - { pl: "mieć forsy jak lodu", ru: "денег куры не клюют" }
  - { pl: "przełamać lody", ru: "растопить лёд" }
family:
  - { pl: "lody", ru: "мороженое", relation: derived }
  - { pl: "lodowy", ru: "ледяной", relation: derived }
  - { pl: "lodówka", ru: "холодильник", relation: derived }
etymology: "Праславянское *ledъ. Русское «лёд» — то же слово; польское ó на месте русского ё закономерно: lód — лёд, miód — мёд."
memory: "lód — «лёд», но во множественном числе lody это «мороженое»: Lubię lody. Один рожок — loda. Косвенные формы теряют ó: lód, но lodu, na lodzie. И запомните mieć forsy jak lodu — «денег куры не клюют»."
idioms:
  - { pl: "lody", ru: "мороженое" }
  - { pl: "mieć forsy jak lodu", ru: "денег куры не клюют" }
  - { pl: "przełamać lody", ru: "растопить лёд" }
  - { pl: "stąpać po cienkim lodzie", ru: "ходить по тонкому льду" }
