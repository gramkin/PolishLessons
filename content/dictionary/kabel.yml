notes:
  - { kind: false-friend, text: "Прямое значение совпадает с русским полностью, а вот второе удивляет. В разговорной речи KABEL значит «стукач, доносчик», и слово это обидное: NIE BĄDŹ KABLEM — «не будь стукачом». Отсюда и глагол KABLOWAĆ «доносить, ябедничать»: KABLOWAŁ NA KOLEGÓW «он доносил на товарищей». Образ прозрачен: провод, по которому сведения уходят куда не надо. Русский «кабель» такого значения не имеет, так что фразу про школьного «кабеля» без этой подсказки понять нельзя." }
  - { kind: usage, text: "В этом слове работает так называемое беглое E. В именительном падеже оно есть, KABEL, а во всех остальных исчезает: KABLA, KABLOWI, KABLEM, KABLE. Русский знает то же самое по словам «ветер — ветра» и «отец — отца», так что явление знакомое, непривычно только видеть его в заимствованном слове. Тот же беглый гласный в PALEC и PALCA «палец», OJCIEC и OJCA «отец». Родительный множественного здесь KABLI, без окончания -ÓW." }
  - { kind: government, text: "Куда подключают — предлог DO с родительным: PODŁĄCZYĆ KABEL DO GNIAZDKA «подключить кабель к розетке», и русский ставит здесь «к» с дательным, так что падеж приходится менять. Откуда идёт провод — предлог OD с родительным: KABEL OD DRUKARKI «кабель от принтера». Глагол KABLOWAĆ во втором значении управляет предлогом NA с винительным: KABLOWAĆ NA KOGOŚ «доносить на кого-то», и здесь схема совпадает с русской." }
  - { kind: pronunciation, text: "Читается «ка́бэль», два слога, ударение на первом. Буква E звучит как «э», а конечное L мягкое, «ль», потому что польское L всегда мягче русского твёрдого. В косвенных падежах беглое E исчезает и слово становится короче: KABLA звучит «ка́бля», KABLEM — «ка́блэм». Не путать с перечёркнутым Ł, которого здесь нет: будь на этом месте Ł, слышалось бы «у»." }
  - { kind: register, text: "В прямом значении слово нейтральное и повседневное: KABEL ZASILAJĄCY «кабель питания», KABEL HDMI, TELEWIZJA KABLOWA «кабельное телевидение», сокращённо KABLÓWKA. Во втором значении слово школьное и дворовое, звучит резко и в глаза его говорят как упрёк. В официальной речи доносчика назовут INFORMATOR или DONOSICIEL. Производное KABLÓWKA при этом совершенно нейтрально и значит только кабельное телевидение." }
collocations:
  - { pl: "kabel zasilający", ru: "кабель питания" }
  - { pl: "telewizja kablowa", ru: "кабельное телевидение" }
