family:
  - { pl: "kablowy", ru: "кабельный", relation: derived }
  - { pl: "kablówka", ru: "кабельное телевидение", relation: derived }
  - { pl: "kablować", ru: "доносить", relation: derived }
etymology: "Из немецкого KABEL, а в немецкий через французское CÂBLE от позднелатинского CAPULUM «верёвка, аркан», от CAPERE «брать». Русское «кабель» пришло тем же путём и из того же источника, поэтому слова совпадают почти буквой в букву. Разошлись они только в разговорном слое: польский построил от этого слова глагол KABLOWAĆ «доносить» и перенёс название провода на человека, который передаёт сведения дальше. Русский для той же роли взял свои образы, «стучать» и «стукач», тоже из мира звука и передачи."
memory: "Прямое значение как в русском, а разговорное неожиданное: kabel это ещё и «стукач», отсюда kablować «доносить» и nie bądź kablem. В слове беглое e: kabel, но kabla, kablem, ровно как русское «ветер — ветра». Управление поправить: podłączyć kabel DO gniazdka, родительный вместо русского дательного. Читается «ка́бэль», с мягким «ль» на конце. И знать kablówka, это нейтральное «кабельное телевидение»."
idioms:
  - { pl: "nie bądź kablem", ru: "не будь стукачом" }
