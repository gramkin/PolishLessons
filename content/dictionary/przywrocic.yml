notes:
  - { kind: pronunciation, text: "ГЛАВНОЕ ЧЕРЕДОВАНИЕ ЗДЕСЬ — Ó ПРОТИВ A МЕЖДУ ВИДАМИ. Совершенный вид держит ó: przywrócić, przywrócił, przywrócony, przywróć. Несовершенный меняет его на a: przywracać, przywracam, przywracany. Та же пара видна в wrócić — wracać и в русском «воротить — возвращать». Ó читается как у: «пшывру́циць»." }
  - { kind: false-friend, text: "Корень знакомый, хотя и спрятанный. Wrócić «вернуться» восходит к тому же *vortiti, что русские «воротить», «возвратить», «ворота» и «вертеть». Przywrócić это «вернуть на место, восстановить». Ловушки нет, но дословного русского «привратить» не существует, так что перевод всякий раз подбирается по смыслу: восстановить, вернуть, навести." }
  - { kind: government, text: "Восстанавливают ЧТО — винительный: przywrócić porządek, prąd, spokój. КОМУ — дательный: przywrócić komuś wzrok, nadzieję, dobre imię. КУДА или К ЧЕМУ — do с родительным: przywrócić kogoś do pracy, przywrócić coś do życia. Безличное przywrócono очень частотно в официальном языке." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — przywracać. Поэтому есть деепричастие przywróciwszy и нет действительного причастия настоящего времени. Существительное przywrócenie «восстановление» живёт в канцелярском обороте przywrócenie do pracy. Мужско-личное причастие przywróceni вполне обычно: przywróceni do pracy pracownicy." }
collocations:
  - { pl: "przywrócić porządek", ru: "навести порядок" }
  - { pl: "przywrócić do pracy", ru: "восстановить на работе" }
  - { pl: "przywrócić komuś wzrok", ru: "вернуть кому-л. зрение" }
family:
  - { pl: "wrócić", ru: "вернуться", relation: root, id: wrocic }
  - { pl: "przywracać", ru: "восстанавливать", relation: aspect }
  - { pl: "powrót", ru: "возвращение", relation: derived, id: powrot }
  - { pl: "odebrać", ru: "отнять, забрать", relation: antonym, id: odebrac }
etymology: "Приставка przy- плюс wrócić, из праславянского *vortiti «поворачивать» — того же корня, что русские «воротить», «возвратить», «ворота» и «вертеть». Вернуть значило повернуть обратно. Чередование ó и a между видами (przywrócić, но przywracać) отражает древнюю долготу гласного. Отсюда powrót, wracać, nawrócić и zwrot."
memory: "przywrócić — «восстановить, вернуть», от wrócić «вернуться», корень тот же, что в «воротить». Запомнить надо чередование по видам: совершенный с ó (przywrócić), несовершенный с a (przywracać) — как wrócić и wracać."
idioms:
  - { pl: "przywrócić porządek", ru: "навести порядок" }
  - { pl: "przywrócić do życia", ru: "вернуть к жизни" }
