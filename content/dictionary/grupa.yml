notes:
  - { kind: government, text: "«В группе» — w grupie с предложным; «в группы» — w grupy с винительным: zebraliśmy się w grupę «мы собрались в группу»." }
  - { kind: usage, text: "Самое частое сочетание в живой речи — grupa krwi «группа крови»: Jaką masz grupę krwi?" }
  - { kind: usage, text: "Обратите внимание на ударение множественного: grup (родительный) — wybierzcie przedstawiciela każdej z grup." }
  - { kind: usage, text: "Прилагательное — grupowy «групповой», глагол — grupować «группировать»." }
collocations:
