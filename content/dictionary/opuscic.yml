# review
id: opuscic
format: 2
lemma: "opuścić"
rank: 488
pos: verb
aspect: perf
pron: { cyr: "опу́сьциць" }
senses:
  - id: leave
    ru: "покинуть, оставить (место, человека)"
    examples:
      - pl: "Oni opuścili miasto godzinę temu."
        ru: "Они покинули город час назад."
        source: { kind: tatoeba, id: 3660903 }
      - pl: "Załoga opuściła statek."
        ru: "Экипаж покинул судно."
        source: { kind: tatoeba, id: 2563939 }
      - pl: "Nigdy cię nie opuszczę."
        ru: "Я никогда тебя не покину."
        source: { kind: translated, id: 1449845 }
  - id: lower
    ru: "опустить (руки, голову, глаза)"
    note: "Здесь opuścić буквально «опустить вниз»: opuść ręce, z opuszczoną głową."
    examples:
      - pl: "Opuść ręce."
        ru: "Опусти руки."
        source: { kind: translated, id: 349159 }
      - pl: "Opuściłem ramiona."
        ru: "Я опустил руки."
        source: { kind: translated, id: 10236881 }
      - pl: "Tom idzie powoli z opuszczoną głową."
        ru: "Том идёт медленно, опустив голову."
        source: { kind: translated, id: 8809842 }
  - id: skip
    ru: "пропустить (урок, вопрос, строку)"
    examples:
      - pl: "Opuściła na egzaminie czwarte pytanie."
        ru: "Она пропустила на экзамене четвёртый вопрос."
        source: { kind: translated, id: 406287 }
      - pl: "Nigdy nie opuściłem lekcji."
        ru: "Я никогда не пропускал уроков."
        source: { kind: translated, id: 3679842 }
      - pl: "Czy coś opuściłem?"
        ru: "Я что-нибудь пропустил?"
        source: { kind: translated, id: 640697 }
notes:
  - { kind: usage, text: "Три значения расходятся далеко: opuścić miasto «покинуть город», opuścić ręce «опустить руки», opuścić lekcję «пропустить урок». Контекст различает их надёжно." }
  - { kind: usage, text: "Формы opuszczę, opuścisz, opuści — БУДУЩЕЕ время: глагол совершенного вида. Несовершенный — opuszczać." }
  - { kind: false-friend, text: "Причастие opuszczony значит «заброшенный, покинутый»: opuszczony dom «заброшенный дом». Русское «опущенный» ему соответствует только в прямом смысле (opuszczona głowa «опущенная голова»)." }
  - { kind: usage, text: "Обратите внимание на чередование ść → szcz по всей парадигме: opuścić, но opuszczę, opuszczony, opuszczenie." }
collocations:
  - { pl: "opuścić miasto", ru: "покинуть город" }
  - { pl: "opuścić ręce", ru: "опустить руки" }
  - { pl: "opuścić lekcję", ru: "пропустить урок" }
  - { pl: "opuszczony dom", ru: "заброшенный дом" }
family:
  - { pl: "opuszczać", ru: "покидать, опускать", relation: derived }
  - { pl: "opuszczenie", ru: "оставление, пропуск", relation: derived }
  - { pl: "opuszczony", ru: "заброшенный", relation: derived }
etymology: "Приставка o- плюс puścić «пустить», от праславянского *pustiti — то же слово, что русское «пустить». Буквально «отпустить от себя». По всей парадигме идёт чередование ść → szcz: opuścić, но opuszczę, opuszczony."
memory: "opuścić — «покинуть», но у глагола три расходящихся значения: opuścić miasto «покинуть город», opuścić ręce «опустить руки», opuścić lekcję «пропустить урок». Контекст различает их надёжно. Формы opuszczę, opuścisz — будущее время. И запомните чередование ść → szcz, оно проходит через всю парадигму: opuścić, opuszczę, opuszczony, opuszczenie. Причастие opuszczony чаще всего значит «заброшенный»: opuszczony dom."
idioms:
  - { pl: "opuścić ręce", ru: "опустить руки" }
  - { pl: "opuszczony dom", ru: "заброшенный дом" }
  - { pl: "opuścić statek", ru: "покинуть судно" }
