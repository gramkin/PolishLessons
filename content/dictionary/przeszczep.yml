notes:
  - { kind: false-friend, text: "PRZESZCZEP — «пересадка», а не «прищепка». PRZE- — это «пере-», а SZCZEP- — корень SZCZEPIĆ «прививать»: и дерево, и человека. Отсюда SZCZEPIONKA — «вакцина». Пересадка в транспорте — совсем другое слово: PRZESIADKA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — PRZESZCZEPU, местный — PRZESZCZEPIE. Глагол — PRZESZCZEPIĆ: PRZESZCZEPIONO MU SERCE, «ему пересадили сердце»." }
  - { kind: government, text: "Пересадка чего — родительный: PRZESZCZEP SERCA, PRZESZCZEP NERKI. Ждать пересадки — CZEKAĆ NA PRZESZCZEP, NA с винительным, а не родительный, как в русском." }
  - { kind: pronunciation, text: "Читается «пшэ́шчэп», два слога, ударение на первом. PRZ — «пш»: RZ после глухого P оглушается. SZCZ — «шч», конечное P глухое." }
  - { kind: register, text: "Медицинское слово, но обиходное: его слышно в новостях и разговорах. Научный синоним — TRANSPLANTACJA, донор — DAWCA, реципиент — BIORCA." }
collocations:
  - { pl: "przeszczep nerki", ru: "пересадка почки" }
  - { pl: "czekać na przeszczep", ru: "ждать пересадки" }
  - { pl: "odrzucenie przeszczepu", ru: "отторжение трансплантата" }
family:
  - { pl: "szczepić", ru: "прививать", relation: root }
  - { pl: "szczepionka", ru: "вакцина", relation: root, id: szczepionka }
  - { pl: "przeszczepić", ru: "пересадить", relation: derived }
etymology: "PRZE- «пере-» + SZCZEP «привой, черенок», от SZCZEPIĆ «прививать дерево». Корень тот же, что в русских «щепа», «щепить»: черенок вставляли в расщеплённую ветку. Из садоводства слово перешло в медицину."
memory: "Przeszczep — пересадка органа: prze- «пере-» + szczep «привой». Читается «пшэ́шчэп». Czekać na przeszczep — ждать пересадки. Szczepionka — вакцина, тот же корень."
idioms:
  - { pl: "dostać drugie życie", ru: "получить вторую жизнь" }
