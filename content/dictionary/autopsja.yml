      - pl: "Ta książka to autopsja upadłej firmy."
        ru: "Эта книга — разбор краха компании."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "AUTOPSJA — «вскрытие». В обычной речи и в медицине Польши чаще говорят SEKCJA ZWŁOK: AUTOPSJA звучит по-киношному, из детективов. Разрез при операции — NACIĘCIE, не AUTOPSJA." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — AUTOPSJI. Множественное — AUTOPSJE, AUTOPSJI. Звательный и архаичное AUTOPSYJ не используем." }
  - { kind: government, text: "Провести вскрытие — PRZEPROWADZIĆ AUTOPSJĘ, винительный. После вскрытия — PO AUTOPSJI, местный. Результаты вскрытия — WYNIKI AUTOPSJI, родительный." }
  - { kind: pronunciation, text: "Читается «ауто́псья»: AU — дифтонг, как в AUTO, PSJA — «псья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "przeprowadzić autopsję", ru: "провести вскрытие" }
  - { pl: "wyniki autopsji", ru: "результаты вскрытия" }
  - { pl: "sekcja zwłok", ru: "вскрытие (мед.)" }
family:
  - { pl: "sekcja", ru: "вскрытие; секция", relation: root, id: sekcja }
  - { pl: "zwłoki", ru: "труп, останки", relation: root, id: zwloki }
  - { pl: "koroner", ru: "коронер, судмедэксперт", relation: root }
etymology: "Из греческого AUTOPSIA «увидеть своими глазами», от AUTOS «сам» и OPSIS «зрение». Врач видит причину смерти сам."
memory: "Autopsja — вскрытие, «увидеть самому». Po autopsji — после вскрытия. В больнице говорят sekcja zwłok. Читается «ауто́псья»."
idioms:
