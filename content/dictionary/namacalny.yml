id: namacalny
format: 2
lemma: "namacalny"
rank: 5951
pos: adj
pron: { cyr: "намаца́льны" }
senses:
  - id: tangible
    ru: "ощутимый, явный, неопровержимый"
    examples:
      - pl: "To jest namacalny dowód jego winy."
        ru: "Это неопровержимое доказательство его вины."
        source: { kind: authored }
      - pl: "Program dał namacalne efekty."
        ru: "Программа дала ощутимые результаты."
        source: { kind: authored }
      - pl: "Nie widzę namacalnej poprawy."
        ru: "Я не вижу ощутимого улучшения."
        source: { kind: authored }
  - id: palpable
    ru: "осязаемый, такой, что можно потрогать"
    examples:
      - pl: "Strach w sali był niemal namacalny."
        ru: "Страх в зале был почти осязаемым."
        source: { kind: authored }
      - pl: "Mapa w namacalnej formie przydaje się niewidomym."
        ru: "Карта в осязаемом виде пригодится слепым."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще всего слово значит не буквальное «осязаемый», а «ощутимый, явный, такой, что не поспоришь»: NAMACALNY DOWÓD «неопровержимое, вещественное доказательство», NAMACALNE EFEKTY «ощутимые результаты», NAMACALNA KORZYŚĆ «реальная выгода». Буквальный смысл живёт в описаниях атмосферы: NAPIĘCIE BYŁO NIEMAL NAMACALNE «напряжение было почти осязаемым», как и по-русски." }
  - { kind: false-friend, text: "Корень MAC- русскому глазу незнаком, и слово легко принять за родственника «намазать». Основа здесь MACAĆ «щупать, ощупывать», с приставкой NA-: NAMACALNY — буквально «такой, что можно нащупать». По-русски ему соответствует «щупать»: MACAĆ OWOCE «щупать фрукты», MACAĆ PO CIEMKU «шарить в темноте»." }
  - { kind: usage, text: "Одиннадцать форм, степеней сравнения в таблице нет: усиление передают описательно, BARDZIEJ NAMACALNY, NAJBARDZIEJ NAMACALNY. Мужско-личная форма NAMACALNI встречается редко, в основном в литературе, когда о людях говорят как о чём-то реальном, «живом»: BOHATEROWIE SĄ NAMACALNI." }
  - { kind: pronunciation, text: "Читается «намаца́льны»: C — всегда «ц», L перед согласной N смягчается в «ль». Ударение на предпоследнем слоге, CA." }
collocations:
  - { pl: "namacalny dowód", ru: "вещественное, неопровержимое доказательство" }
  - { pl: "namacalne efekty", ru: "ощутимые результаты" }
  - { pl: "namacalna korzyść", ru: "реальная выгода" }
family:
  - { pl: "macać", ru: "щупать, ощупывать", relation: root }
