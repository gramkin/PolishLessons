  - { pl: "namacalność", ru: "осязаемость, наглядность", relation: derived }
synonyms: ["uchwytny", "wyczuwalny", "oczywisty", "niezbity"]
etymology: "Образовано от MACAĆ «щупать» с приставкой NA- и суффиксом -ALNY, обозначающим возможность: NAMACALNY — «то, что можно нащупать». Значение «явный, неопровержимый» развилось из этого буквального."
memory: "Macać — щупать, namacalny — такой, что можно нащупать: namacalny dowód — доказательство, которое можно потрогать руками, то есть неопровержимое."
