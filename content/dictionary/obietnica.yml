# review
id: obietnica
format: 2
lemma: "obietnica"
rank: 2028
pos: noun
pron: { cyr: "обетни́ца" }
senses:
  - id: promise
    ru: "обещание"
    examples:
      - pl: "Czy to obietnica?"
        ru: "Это обещание?"
        source: { kind: translated, id: 8547567 }
      - pl: "Obietnica to obietnica."
        ru: "Обещание есть обещание."
        source: { kind: translated, id: 2178305 }
      - pl: "Złamał swoją obietnicę."
        ru: "Он нарушил своё обещание."
        source: { kind: translated, id: 1830766 }
      - pl: "Tom dotrzymał obietnicy."
        ru: "Том сдержал обещание."
        source: { kind: tatoeba, id: 5947956 }
      - pl: "Nie wolno łamać obietnicy."
        ru: "Нельзя нарушать своё обещание."
        source: { kind: tatoeba, id: 2164576 }
      - pl: "On nigdy nie złamie danej obietnicy."
        ru: "Он никогда не нарушает данных обещаний."
        source: { kind: tatoeba, id: 416735 }
  - id: promises-plural
    ru: "обещания (во множественном)"
    examples:
      - pl: "Obietnic należy dotrzymywać."
        ru: "Обещания нужно выполнять."
        source: { kind: translated, id: 8949253 }
      - pl: "Obietnice nie wystarczą."
        ru: "Обещаний недостаточно."
        source: { kind: translated, id: 7881221 }
      - pl: "Nie wierz w obietnice polityków."
        ru: "Не верь обещаниям политиков."
        source: { kind: translated, id: 6765471 }
notes:
  - { kind: usage, text: "Ключевые глаголы: dotrzymać obietnicy «сдержать обещание» (родительный) и złamać obietnicę «нарушить обещание» (винительный). Обратите внимание на разные падежи." }
  - { kind: usage, text: "Существительное к карточкам obiecać и obiecywać «обещать»." }
  - { kind: usage, text: "Поговорка obiecanki cacanki примерно отвечает русскому «обещанного три года ждут»." }
collocations:
  - { pl: "dotrzymać obietnicy", ru: "сдержать обещание" }
  - { pl: "złamać obietnicę", ru: "нарушить обещание" }
  - { pl: "puste obietnice", ru: "пустые обещания" }
etymology: "От obiecać «обещать», ob- + wiecać, того же корня, что wiec «собрание» и русское «вече». Обещание — то, что произнесено перед людьми."
memory: "obietnica — «обещание». Запомните два падежа: dotrzymać obietnicy «сдержать обещание», но złamać obietnicę «нарушить обещание»."
idioms:
  - { pl: "dotrzymać obietnicy", ru: "сдержать обещание" }
  - { pl: "złamać obietnicę", ru: "нарушить обещание" }
  - { pl: "obiecanki cacanki", ru: "обещанного три года ждут" }
