etymology: "Через немецкий из французского MODE, а то — из латинского modus «мера, образ, способ», того же корня, что «модус», «модель» и «модерация». Русская «мода» пришла тем же путём и в то же время, так что слова совпадают полностью. Любопытно, что исходное латинское значение — «мера»: мода есть то, что отмеряет приличный вид на данный год."
memory: "Дательный и местный modzie: d даёт dzi. А родительный множественного mód с ó — слог закрылся, гласная удлинилась, как woda — wód."
