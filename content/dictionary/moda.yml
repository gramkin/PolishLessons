notes:
  - { kind: usage, text: "Дательный и местный — MODZIE: d переходит в dź, которое перед гласной пишется dzi. Это второй случай после URZĘDZIE из партии 223. Теперь ряд смягчений перед окончанием -e можно собрать целиком: t даёт ć (produkcie, komendancie, zwrocie), d даёт dź (urzędzie, modzie), s даёт ś (stresie, rasie, podpisie), r даёт rz (teatrze, zegarze), k даёт c (klinice, działce, stawce), n даёт ń (wymianie, ogonie), m даёт mi (dymie). Перед -e твёрдых согласных в польском просто не остаётся." }
  - { kind: pronunciation, text: "Родительный множественного — MÓD, и буква ó здесь появляется не случайно. Окончания нет, слог закрывается согласным, а в закрытом конечном слоге старопольский удлинял гласную, и долгое o дало ó. Тот же механизм описан в карточке URZĄD для пары ą/ę; здесь он виден на паре o/ó. Ряд широкий и предсказуемый: woda — WÓD, głowa — GŁÓW, szkoła — SZKÓŁ, noga — NÓG, moda — MÓD. У русского такого чередования нет вовсе, поэтому форму приходится проверять по правилу, а не по слуху." }
  - { kind: usage, text: "Устойчивые выражения совпадают с русскими дословно: BYĆ W MODZIE «быть в моде», WYJŚĆ Z MODY «выйти из моды», WPROWADZIĆ MODĘ NA COŚ «ввести моду на что-то». Предлог na с винительным указывает на предмет моды — moda na krótkie włosy, — ровно как русское «мода на короткие волосы». Запоминать тут нечего, кроме формы modzie, которая для русского глаза выглядит неожиданно." }
