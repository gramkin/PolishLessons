# review
id: procedura
format: 2
lemma: "procedura"
rank: 2570
pos: noun
pron: { cyr: "процэду́ра" }
senses:
  - id: procedure
    ru: "процедура, порядок действий"
    examples:
      - pl: "Procedura trwa zwykle dwa tygodnie."
        ru: "Процедура длится обычно две недели."
        source: { kind: authored }
      - pl: "Uprościli procedurę na wniosek klientów."
        ru: "Они упростили процедуру по просьбе клиентов."
        source: { kind: authored }
      - pl: "Zgodnie z procedurą zgłoszenie trafia do sekretariatu."
        ru: "Согласно процедуре заявление попадает в секретариат."
        source: { kind: authored }
  - id: medical
    ru: "процедура (медицинская)"
    examples:
      - pl: "Po procedurze pacjent wraca do domu."
        ru: "После процедуры пациент возвращается домой."
        source: { kind: authored }
      - pl: "Poddano go wszystkim wymaganym procedurom."
        ru: "Его подвергли всем требуемым процедурам."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Дательный и предложный — PROCEDURZE, с переходом r в rz. Это то же чередование, что в pasażer — pasażerze и siostra — siostrze, и встречается оно у всех основ на -r. Русское «процедуре» основу не трогает, так что мягкую форму приходится держать в памяти отдельно." }
  - { kind: usage, text: "Родительный множественного — PROCEDUR, без окончания, как analiz и kobiet. Рядом полезно помнить контраст: заимствования на -ja дают -ji (konferencja — konferencji), а на -a нулевое окончание. Разницу задаёт конец основы, а не происхождение слова." }
  - { kind: usage, text: "Слово это канцелярское и медицинское одновременно, ровно как в русском: procedura odwoławcza «апелляционная процедура» и procedura medyczna «медицинская процедура». Род, в отличие от analiza, совпадает — обе женские. Глагол от того же корня, PROCEDOWAĆ «рассматривать в установленном порядке», в русском соответствия почти не имеет." }
collocations:
  - { pl: "zgodnie z procedurą", ru: "согласно процедуре" }
  - { pl: "procedura odwoławcza", ru: "апелляционная процедура" }
  - { pl: "uprościć procedurę", ru: "упростить процедуру" }
family:
  - { pl: "procedować", ru: "рассматривать в установленном порядке", relation: root }
  - { pl: "proceduralny", ru: "процедурный", relation: derived }
  - { pl: "proces", ru: "процесс", relation: root, id: proces }
etymology: "Из латинского procedere «продвигаться вперёд», через французский канцелярский язык. Русская «процедура» пришла тем же путём и в том же роде, так что здесь расхождений нет. Из того же корня вырос и PROCES «процесс»: оба слова о движении вперёд, шаг за шагом."
memory: "Предложный падеж мягкий: o procedurze, как o pasażerze. А родительный множественного без окончания: kilka procedur. Род, в отличие от analizy, с русским совпадает."
idioms:
