# review
id: wlaczyc
format: 2
lemma: "włączyć"
rank: 1367
pos: verb
aspect: perf
pron: { cyr: "вуо́нчыць" }
senses:
  - id: turn-on
    ru: "включить (прибор, свет)"
    examples:
      - pl: "Włącz światło."
        ru: "Включи свет."
        source: { kind: tatoeba, id: 6327927 }
      - pl: "Mogę włączyć telewizor?"
        ru: "Могу ли я включить телевизор?"
        source: { kind: tatoeba, id: 826560 }
      - pl: "Telewizor jest włączony."
        ru: "Телевизор включён."
        source: { kind: translated, id: 669599 }
  - id: include
    ru: "включить в состав, подключить"
    examples:
      - pl: "Mnie też w to włączcie."
        ru: "Меня тоже в это включите."
        source: { kind: translated, id: 768840 }
      - pl: "Włączyli się do dyskusji."
        ru: "Они включились в дискуссию."
        source: { kind: translated, id: 3993085 }
notes:
  - { kind: usage, text: "Совершенный вид к włączać. Прямой антоним — wyłączyć «выключить»." }
  - { kind: government, text: "włączyć co (винительный): włączyć światło, telewizor, radio. Включить кого-то куда-то — włączyć kogoś do czegoś." }
  - { kind: usage, text: "Второе значение — «включить в состав»: włączyć się do dyskusji «включиться в дискуссию», włączyć kogoś do grupy." }
  - { kind: false-friend, text: "Разница между włączyć «включить» и wyłączyć «выключить» — только приставка w-/wy-, а смысл противоположный. Это классическая ошибка на слух." }
collocations:
  - { pl: "włączyć światło", ru: "включить свет" }
  - { pl: "włączyć telewizor", ru: "включить телевизор" }
  - { pl: "włączyć się do dyskusji", ru: "включиться в дискуссию" }
etymology: "Приставка w- «в» и łączyć «соединять» (праславянское *lǫčiti); тот же корень в русских «разлучить» и «случай». Буквально «в-соединить» — ровно как русское «в-ключить»."
memory: "włączyć — «включить», и разбирается прозрачно: w- «в» плюс łączyć «соединять». Противоположность — wyłączyć «выключить», разница только в приставке, так что вслушивайтесь. И помните второе значение: włączyć się do dyskusji «включиться в дискуссию»."
idioms:
  - { pl: "włączyć światło", ru: "включить свет" }
  - { pl: "włączyć się do dyskusji", ru: "включиться в дискуссию" }
  - { pl: "włączyć bieg", ru: "включить передачу" }
