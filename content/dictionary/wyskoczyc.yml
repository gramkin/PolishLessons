# review
id: wyskoczyc
format: 2
lemma: "wyskoczyć"
rank: 2072
pos: verb
aspect: perf
pron: { cyr: "выско́чиць" }
senses:
  - id: jump-out
    ru: "выскочить, выпрыгнуть"
    examples:
      - pl: "Z krzaków wyskoczył olbrzymi dzik."
        ru: "Из кустов выскочил огромный дикий кабан."
        source: { kind: tatoeba, id: 10202661 }
      - pl: "Wyskoczył oknem."
        ru: "Он выскочил в окно."
        source: { kind: translated, id: 350054 }
      - pl: "Wyskoczyłem z łóżka."
        ru: "Я выскочил из кровати."
        source: { kind: translated, id: 2186553 }
  - id: pop-out
    ru: "выскочить, выбежать (ненадолго)"
    examples:
      - pl: "Wyskoczył z pokoju."
        ru: "Он выскочил из комнаты."
        source: { kind: translated, id: 362920 }
      - pl: "Chyba wyskoczyli gdzieś za miasto."
        ru: "Кажется, они выехали куда-то за город."
        source: { kind: translated, id: 710418 }
notes:
  - { kind: usage, text: "Несовершенный вид — wyskakiwać." }
  - { kind: government, text: "Откуда — через z с родительным: wyskoczyć z łóżka. Через что — творительным без предлога: wyskoczyć oknem «выскочить в окно»." }
  - { kind: usage, text: "Разговорное wyskoczyć gdzieś значит «сбегать, выскочить куда-то ненадолго»: wyskoczyć na kawę." }
  - { kind: false-friend, text: "Корень skoczyć «прыгнуть» — ср. русское «скочить», «выскочить»." }
collocations:
  - { pl: "wyskoczyć z łóżka", ru: "выскочить из кровати" }
  - { pl: "wyskoczyć na chwilę", ru: "выскочить на минутку" }
etymology: "wy- + skoczyć «прыгнуть», праславянское *skočiti; ср. русское «скочить», «выскочить»."
memory: "wyskoczyć — «выскочить», от skoczyć «прыгнуть». Разговорное wyskoczyć na chwilę «выскочить на минутку». Несовершенный вид — wyskakiwać."
idioms:
  - { pl: "wyskoczyć jak filip z konopi", ru: "встрять невпопад" }
