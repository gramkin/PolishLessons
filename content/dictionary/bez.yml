# review
id: bez
format: 2
lemma: "bez"
rank: 132
pos: prep
pron: { cyr: "бэс" }
senses:
  - id: without
    ru: "без (+ родительный падеж): отсутствие чего-либо"
    note: "Падеж тот же, что в русском: bez wody «без воды», bez ciebie «без тебя»."
    examples:
      - pl: "Mogę żyć bez wody."
        ru: "Я могу жить без воды."
        source: { kind: tatoeba, id: 2650971 }
      - pl: "Nie mogę żyć bez ciebie."
        ru: "Я не могу жить без тебя."
        source: { kind: tatoeba, id: 355494 }
      - pl: "On mówi bez akcentu."
        ru: "Он говорит без акцента."
        source: { kind: tatoeba, id: 3545422 }
  - id: manner
    ru: "без (о том, как совершается действие)"
    examples:
      - pl: "Tomek działał bez zastanowienia."
        ru: "Том действовал без размышлений."
        source: { kind: tatoeba, id: 3660656 }
      - pl: "Wiek uczestników bez ograniczeń."
        ru: "Возраст участников без ограничений."
        source: { kind: tatoeba, id: 2484460 }
      - pl: "Wyobrażasz sobie świat bez pieniędzy?"
        ru: "Можете ли вы представить мир без денег?"
        source: { kind: tatoeba, id: 362851 }
notes:
  - { kind: government, text: "bez всегда требует родительного падежа — как русское «без»: bez pracy, bez pieniędzy, bez niego." }
  - { kind: usage, text: "Частые связки: bez przerwy «без перерыва», bez sensu «бессмысленно», bez względu na «независимо от», bez mała «без малого»." }
  - { kind: false-friend, text: "Существительное bez — это «сирень» (Kwitnie bez). Отсюда в словарях формы bzu, bzy, bzem: они принадлежат сирени, а не предлогу." }
collocations:
  - { pl: "bez przerwy", ru: "без перерыва" }
  - { pl: "bez sensu", ru: "бессмысленно" }
  - { pl: "bez problemu", ru: "без проблем" }
  - { pl: "bez względu na", ru: "независимо от" }
etymology: "Праславянское *bez — то же слово, что русское «без»; совпадает и по форме, и по управлению."
memory: "bez + родительный, ровно как русское «без»: bez wody, bez ciebie. Не пугайтесь форм bzu, bzy в таблицах: это другое слово — bez «сирень»."
idioms:
  - { pl: "bez ceregieli", ru: "без церемоний" }
  - { pl: "bez czci i wiary", ru: "без стыда и совести" }
  - { pl: "bez czucia", ru: "без чувств, без сознания" }
formExamples:
