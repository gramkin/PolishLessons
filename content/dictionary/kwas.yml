# review
id: kwas
format: 2
lemma: "kwas"
rank: 4205
pos: noun
pron: { cyr: "квас" }
senses:
  - id: acid
    ru: "кислота (хим.)"
    examples:
      - pl: "Kwas solny jest bardzo żrący."
        ru: "Соляная кислота очень едкая."
        source: { kind: authored }
      - pl: "Ocet zawiera kwas octowy."
        ru: "Уксус содержит уксусную кислоту."
        source: { kind: authored }
      - pl: "Kwas foliowy jest ważny w ciąży."
        ru: "Фолиевая кислота важна при беременности."
        source: { kind: authored }
  - id: bad-blood
    ru: "напряжение, ссора (разг.; мн. KWASY)"
    examples:
      - pl: "Po kłótni w biurze był kwas."
        ru: "После ссоры в офисе повисло напряжение."
        source: { kind: authored }
      - pl: "W rodzinie od lat są kwasy."
        ru: "В семье много лет натянутые отношения."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Главная ловушка: KWAS — «кислота», а не «квас». KWAS SOLNY — соляная кислота, KWAS FOLIOWY — фолиевая. Сам напиток называют KWAS CHLEBOWY, «хлебный квас», и в Польше он редкость. Прилагательное KWAŚNY — «кислый»: KWAŚNE JABŁKO, KWAŚNA MINA — «кислая мина»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже S смягчается: W KWASIE. Во множественном KWASY — виды кислот или, разговорно, «ссоры, натянутые отношения»." }
  - { kind: government, text: "Раствор кислоты — ROZTWÓR KWASU, родительный. В кислоте — W KWASIE, местный. Устраивать сцены — ROBIĆ KWASY, винительный множественного." }
  - { kind: pronunciation, text: "Читается «квас», один слог, точно как русское слово, отсюда и путаница. В форме KWASIE: «ква́се»." }
  - { kind: register, text: "В химии и медицине слово нейтральное. Разговорное KWAS — «неприятный осадок, напряжение»: ALE KWAS! — «ну и атмосфера!», ZROBIŁ SIĘ KWAS — «повисла неловкость»." }
collocations:
  - { pl: "kwas solny", ru: "соляная кислота" }
  - { pl: "kwas cytrynowy", ru: "лимонная кислота" }
  - { pl: "kwas mlekowy", ru: "молочная кислота" }
family:
  - { pl: "kwaśny", ru: "кислый", relation: derived }
  - { pl: "kwasić", ru: "квасить", relation: derived }
  - { pl: "zakwas", ru: "закваска", relation: derived }
etymology: "Слово праславянское, общее с русским «квас»: первоначально «кислое, закисшее». Русский сохранил старое значение в названии напитка, а польский перенёс слово на химическую кислоту. Глагол KWASIĆ — «квасить», как в KWASZONA KAPUSTA."
memory: "Kwas — кислота, а не квас! Квас — kwas chlebowy. Читается «квас». Kwaśny — кислый. Kwas solny — соляная кислота. Ale kwas! — ну и атмосфера!"
idioms:
  - { pl: "kwas chlebowy", ru: "хлебный квас" }
  - { pl: "robić kwasy", ru: "устраивать сцены, портить отношения" }
