notes:
  - { kind: usage, text: "Ещё один инфинитив на два глагола, но различаются они не там, где в семье PAŚĆ. Там расходилось всё; здесь расходится прошедшее время. Глагол «заключить» даёт ZAWARŁ, ZAWARLI, страдательное ZAWARTY и существительное ZAWARCIE. Глагол «вскипеть» даёт ZAWRZAŁ, ZAWRZELI и существительное ZAWRZENIE. Настоящее-будущее у них почти общее: ZAWRZESZ, ZAWRZE, ZAWRZEMY, ZAWRZECIE годятся обоим, и только первое лицо и третье множественного различают их — ZAWRĘ и ZAWRĄ у первого, ZAWRZĘ и ZAWRZĄ у второго. У первого глагола есть вдобавок устаревающий набор ZAWRE, ZAWRESZ, ZAWREMY, ZAWRECIE." }
  - { kind: pronunciation, text: "Читается «за́вжэць», в два слога, с ударением на первом. Сочетание wrz — это «вж»: w даёт «в», rz даёт «ж». В прошедшем времени ZAWARŁ звучит «за́вару», где ł на конце читается как «у», а не «л», — по тому же правилу, что в POSŁAĆ «по́суаць». Форма ZAWARTY — «зава́рты», с ударением на втором слоге, потому что слогов стало три." }
  - { kind: government, text: "С кем заключают — предлог Z с творительным: ZAWRZEĆ UMOWĘ Z FIRMĄ, ZAWRZEĆ POKÓJ Z SĄSIADEM. Что заключают — винительный без предлога: ZAWRZEĆ UMOWĘ, POKÓJ, MAŁŻEŃSTWO, SOJUSZ. Где умещают — предлог W с предложным: ZAWRZEĆ MYŚL W JEDNYM ZDANIU. Глагол кипения непереходный и дополнения не имеет вовсе, зато берёт творительный причины в переносном значении: ZAWRZEĆ GNIEWEM «вскипеть от гнева», где русский требует предлога «от», а польский обходится одним падежом." }
  - { kind: false-friend, text: "Русское «заварить» к этому слову не имеет отношения: заварить чай по-польски ZAPARZYĆ HERBATĘ, и перепутать легко, потому что второе значение польского глагола как раз про кипяток. Запомните разделение: ZAWRZEĆ — вода сама закипела, ZAPARZYĆ — человек заварил. Зато полезно родственное существительное ZAWARTOŚĆ «содержимое, содержание»: ZAWARTOŚĆ TORBY, ZAWARTOŚĆ CUKRU. Оно того же корня, что ZAWARTY, и в русском ему отвечает «содержание», построенное по той же модели от «держать»." }
