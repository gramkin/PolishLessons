etymology: "Два разных праславянских глагола дали одно польское -WRZEĆ, и отсюда вся путаница. Первый — *verti «запирать, затворять», тот же, что в русских «отворить», «затворить» и «ворота». Поэтому ZAWRZEĆ исходно значило «затворить», а «заключить договор» выросло из этого образа: соглашение закрывают, как дверь. Русский проделал ровно ту же метафору другим корнем: «заключить» — это «запереть на ключ», от «ключ». Два языка независимо назвали договор запиранием. Второй глагол — *vьrěti «кипеть, бурлить», откуда русские «вар», «варить» и устаревшее «вреть». От него ZAWRZAŁ и ZAWRZENIE. Так что совпали здесь не смыслы, а звуки: разные корни пришли к одному виду."
memory: "Два глагола, один инфинитив, и различает их прошедшее время: zawarł — «заключил», zawrzał — «вскипел». Настоящее почти общее, но zawrę/zawrą у первого, zawrzę/zawrzą у второго. Читается «за́вжэць», wrz — это «вж». И «заварить чай» — не zawrzeć, а zaparzyć."
