# review
id: brnac
format: 2
lemma: "brnąć"
rank: 6083
pos: verb
aspect: imperf
pron: { cyr: "брно́ньць" }
senses:
  - id: wade
    ru: "брести, с трудом пробираться (по снегу, грязи, воде)"
    examples:
      - pl: "Brnęliśmy przez śnieg po kolana."
        ru: "Мы брели по колено в снегу."
        source: { kind: authored }
      - pl: "Konie brnęły w błocie."
        ru: "Лошади вязли в грязи и с трудом шли."
        source: { kind: authored }
      - pl: "Brnął przez rzekę z plecakiem nad głową."
        ru: "Он брёл через реку, держа рюкзак над головой."
        source: { kind: authored }
  - id: plod
    ru: "перен. продираться, с трудом одолевать (скучную книгу, бумаги)"
    examples:
      - pl: "Brnę przez ten raport od rana."
        ru: "Я продираюсь через этот отчёт с утра."
        source: { kind: authored }
      - pl: "Brnęła przez tekst ze słownikiem."
        ru: "Она продиралась через текст со словарём."
        source: { kind: authored }
  - id: sink-deeper
    ru: "перен. всё глубже увязать (во лжи, долгах), упорно продолжать заведомо плохое"
    examples:
      - pl: "Brnie w kłamstwa coraz głębiej."
        ru: "Он всё глубже увязает во лжи."
        source: { kind: authored }
      - pl: "Po co brnąć dalej w ten absurd?"
        ru: "Зачем дальше упорствовать в этом абсурде?"
        source: { kind: authored }
notes:
  - { kind: government, text: "Где — W с предложным: BRNĄĆ W ŚNIEGU, W BŁOCIE. Через что — PRZEZ с винительным: BRNĄĆ PRZEZ ŚNIEG, PRZEZ BAGNO. Во что, всё глубже — W с винительным: BRNĄĆ W DŁUGI, W KŁAMSTWA." }
  - { kind: usage, text: "Совершенный вид делится по смыслу: PRZEBRNĄĆ (PRZEZ) — «одолеть, пробраться до конца», ZABRNĄĆ — «забрести, зайти слишком далеко» (ZABRNĄĆ W ŚLEPĄ ULICZKĘ). Спряжение: BRNĘ, BRNIESZ, BRNĄ; прошедшее BRNĄŁ, но BRNĘŁA, BRNĘLI." }
  - { kind: pronunciation, text: "Одни согласные вокруг носового: «брноньць», один слог. BR и RN произносятся слитно, без вставного гласного — не «бырнуть». Ą перед Ł — просто «о»: BRNĄŁ — «брноу»; BRNĘŁA — «брнэ́уа»." }
  - { kind: false-friend, text: "Похоже на русское «бренный», но не родня: BRNĄĆ — «брести с трудом». «Бренный» по-польски — MARNY, DOCZESNY." }
  - { kind: register, text: "Нейтральное, с оттенком книжности. Всегда подразумевает усилие и вязкую среду: просто «идти пешком» — IŚĆ, «бродить без цели» — BŁĄKAĆ SIĘ." }
collocations:
  - { pl: "brnąć przez śnieg", ru: "брести по снегу" }
  - { pl: "brnąć w błocie", ru: "вязнуть в грязи" }
  - { pl: "brnąć po kolana w wodzie", ru: "брести по колено в воде" }
  - { pl: "brnąć w długi", ru: "всё глубже влезать в долги" }
  - { pl: "brnąć dalej", ru: "упорно продолжать (вопреки здравому смыслу)" }
family:
  - { pl: "przebrnąć", ru: "одолеть, пробраться (до конца)", relation: aspect }
  - { pl: "zabrnąć", ru: "забрести, зайти слишком далеко", relation: derived }
  - { pl: "błoto", ru: "грязь", relation: root, id: bloto }
  - { pl: "śnieg", ru: "снег", relation: root, id: snieg }
synonyms: ["brodzić", "przedzierać się", "wlec się"]
etymology: "Обычно связывают с корнем BRÓD «брод» и BRODZIĆ «бродить», русское «брести»: *brъd-nǫti, где D выпало перед суффиксом -НУ-, как в русском «вянуть» из *vęd-nǫti. Значение «идти вброд» расширилось до «идти через любую вязкую среду»."
memory: "BRNĄĆ — «брести» там, где ноги вязнут: даже гласным места не осталось — Б-Р-Н. Brnęliśmy przez śnieg — мы брели по снегу."
idioms:
  - { pl: "brnąć w zaparte", ru: "упорно отпираться, стоять на своём вопреки фактам" }
  - { pl: "brnąć w ślepą uliczkę", ru: "всё глубже заходить в тупик" }
