notes:
  - { kind: false-friend, text: "ЭТО ТО ЖЕ САМОЕ СЛОВО, ЧТО РУССКАЯ «ТЁТКА», ТОЛЬКО С ПОЛЬСКИМ СМЯГЧЕНИЕМ. Праславянское *teta дало русское «тётя» и «тётка», а в польском начальное t перед гласной переднего ряда смягчилось в ci: отсюда ciotka. Так что ci- тут не приставка и не часть корня, а просто мягкое т." }
  - { kind: register, text: "Разница между CIOCIA и CIOTKA ровно та же, что между «тётей» и «тёткой». Ciocia — домашнее, тёплое, им обращаются: Ciociu! Ciotka нейтральнее и чуть отдалённее, а о посторонней женщине звучит пренебрежительно: jakaś ciotka. К родной тёте обращайся ciociu, не ciotko." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: CIOT-ka. Ci читается как мягкое ць, o открытое: «цё́тка». Дательный и предложный — ciotce, где k перешло в c: «цё́тцэ»." }
collocations:
  - { pl: "ciotka ze strony matki", ru: "тётя по матери" }
  - { pl: "u ciotki", ru: "у тёти" }
  - { pl: "ciocia i wujek", ru: "тётя и дядя" }
family:
  - { pl: "ciocia", ru: "тётя (ласк.)", relation: root, id: ciocia }
  - { pl: "wujek", ru: "дядя", relation: antonym, id: wujek }
  - { pl: "siostra", ru: "сестра", relation: root, id: siostra }
etymology: "Из праславянского *teta «тётя», слова детского языка с удвоением слога, как mama и tata. Русские «тётя» и «тётка» — то же самое; польский лишь смягчил начальное t до ci. Уменьшительный суффикс -ka здесь тот же, что в русской «тётке»."
memory: "ciotka — «тётка», и это буквально одно слово: польское ci- это мягкое т из праславянского *teta. Дательный и предложный — ciotce, с k→c, родительный множественного — ciotek, с беглым e. А к родной тёте обращайся ciociu."
idioms:
  - { pl: "u cioci na imieninach", ru: "у тёти на именинах" }
  - { pl: "ciotka z Ameryki", ru: "богатая тётушка" }
