# review
id: mistrz
format: 2
lemma: "mistrz"
rank: 819
pos: noun
pron: { cyr: "мистш" }
senses:
  - id: champion
    ru: "чемпион"
    examples:
      - pl: "Nikt nie rodzi się mistrzem."
        ru: "Чемпионами не рождаются."
        source: { kind: tatoeba, id: 7729048 }
      - pl: "Mistrz wagi muszej walczył z silnym przeciwnikiem."
        ru: "Чемпион в наилегчайшем весе бился с сильным противником."
        source: { kind: translated, id: 360124 }
      - pl: "Jest mistrzem tenisa."
        ru: "Он чемпион по теннису."
        source: { kind: translated, id: 1354214 }
  - id: master
    ru: "мастер, учитель (в ремесле, в искусстве)"
    examples:
      - pl: "Ćwiczenie czyni mistrza."
        ru: "Навык мастера ставит."
        source: { kind: translated, id: 13453506 }
      - pl: "Ona uważa go za swego mistrza."
        ru: "Она считает его своим учителем."
        source: { kind: translated, id: 362992 }
      - pl: "Grałem z mistrzem."
        ru: "Я играл с мастером."
        source: { kind: translated, id: 355441 }
notes:
  - { kind: false-friend, text: "Слово покрывает сразу два русских: «мастер» и «чемпион». mistrz świata — это «чемпион мира», а не «мастер мира». В спорте mistrz всегда «чемпион», а mistrzostwa — «чемпионат»." }
  - { kind: usage, text: "Русское «мастер» в смысле «бригадир, начальник цеха» — это majster, а не mistrz. Разные слова, хотя источник один." }
  - { kind: usage, text: "Звательный падеж mistrzu! употребляется как уважительное обращение к знатоку: Dziękuję, mistrzu!" }
  - { kind: usage, text: "Множественное число мужского лица — mistrzowie: mistrzowie olimpijscy «олимпийские чемпионы»." }
collocations:
  - { pl: "mistrz świata", ru: "чемпион мира" }
  - { pl: "mistrzostwa", ru: "чемпионат" }
  - { pl: "mistrz ceremonii", ru: "церемониймейстер" }
  - { pl: "ćwiczenie czyni mistrza", ru: "практика делает мастера" }
family:
  - { pl: "mistrzostwo", ru: "мастерство, первенство", relation: derived }
  - { pl: "mistrzowski", ru: "мастерский", relation: derived }
  - { pl: "majster", ru: "мастер, бригадир", relation: root }
etymology: "Через чешское mistr из немецкого Meister, а то — из латинского magister «наставник». Русское «мастер» пришло тем же путём, поэтому слова похожи, но разошлись в значении."
memory: "mistrz покрывает сразу два русских слова: «мастер» и «чемпион». mistrz świata — это «чемпион мира». А вот «мастер» как начальник цеха — совсем другое слово, majster. Звательный mistrzu! звучит как уважительное «маэстро»."
idioms:
