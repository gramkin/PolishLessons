etymology: "От прилагательного WIECZNY «вечный», а оно от WIEK, из праславянского *věkъ — того же слова, что русский «век». Исходное значение корня было «сила, жизненный срок», отсюда и век как отрезок жизни, и вечность как срок без конца. Русская «вечность» собрана из тех же частей и тем же суффиксом: -ОСТЬ и польское -OŚĆ восходят к одному праславянскому *-ostь, и потому весь этот класс слов переводится между языками механически. Любопытно, что польское WIEK значит и «век» как сто лет, и «возраст» человека — ILE MASZ LAT отвечает на вопрос о возрасте, но W JAKIM WIEKU спрашивает о том же, а русский для возраста слова «век» уже не употребляет."
memory: "Тип -ość, шесть форм: wieczności покрывает пять падежей сразу, как у posiadłość. Суффикс -ość отвечает русскому -ость механически, так что слово выводится из wieczny «вечный». Разговорное преувеличение совпадает с русским дословно, вместе с падежом: całą wieczność «целую вечность». Корень тот же, что в «веке», и польское wiek значит ещё и «возраст»."
