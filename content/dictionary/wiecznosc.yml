notes:
  - { kind: government, text: "Женский род на -OŚĆ, и склонение самое экономное в польском: шесть форм, потому что WIECZNOŚCI покрывает сразу пять падежей — родительный, дательный и местный единственного, а также именительный, винительный и родительный множественного. Остаются WIECZNOŚĆ в именительном и винительном единственного, WIECZNOŚCIĄ в творительном, WIECZNOŚCIOM в дательном множественного, WIECZNOŚCIAMI в творительном множественного и WIECZNOŚCIACH в местном множественного. Это в точности тот же тип, что POSIADŁOŚĆ и PRYWATNOŚĆ, и запоминать стоит свойство, а не список." }
  - { kind: false-friend, text: "Соответствие русской «вечности» полное, и суффикс помогает: польское -OŚĆ отвечает русскому -ОСТЬ один в один, как в WOLNOŚĆ и «вольность», MOŻLIWOŚĆ и «возможность», WŁASNOŚĆ и «собственность». Поэтому слово можно не учить, а вывести — достаточно знать прилагательное WIECZNY «вечный». Единственное, что стоит отметить: в разговорном преувеличении польский употребляет винительный без предлога, CAŁĄ WIECZNOŚĆ «целую вечность», и это совпадает с русским дословно, включая падеж." }
  - { kind: pronunciation, text: "Читается «ве́чносьць», ударение на предпоследнем слоге из трёх. Сочетание CZ даёт «ч». Конечное -ŚĆ это два мягких согласных подряд, «сьць», произносимых слитно без гласной между ними — самое трудное место слова для русского. В формах на -ŚCI смягчение сохраняется: WIECZNOŚCI «вечносьци». В творительном WIECZNOŚCIĄ буква Ą перед конечной позицией звучит «он»: «вечносьцён». Слогов в длинных формах становится четыре, и ударение остаётся на предпоследнем." }
  - { kind: usage, text: "Частотные сочетания: CAŁĄ WIECZNOŚĆ «целую вечность», OD WIECZNOŚCI «с незапамятных времён», NA WIECZNOŚĆ «навеки», PRZEZ CAŁĄ WIECZNOŚĆ. В религиозных текстах WIECZNOŚĆ употребляется без определения: ODEJŚĆ W WIECZNOŚĆ «отойти в вечность». Прилагательное WIECZNY значит «вечный», а WIECZNIE — «вечно», в том числе с оттенком раздражения: WIECZNIE SPÓŹNIONY «вечно опаздывающий», ровно как в русском. Множественное число WIECZNOŚCI встречается редко и почти только в философских текстах." }
