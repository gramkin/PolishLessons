id: pysk
format: 2
lemma: "pysk"
rank: 4073
pos: noun
pron: { cyr: "пыск" }
senses:
  - id: muzzle
    ru: "морда, мордочка (животного)"
    examples:
      - pl: "Pies położył pysk na moich kolanach."
        ru: "Собака положила морду мне на колени."
        source: { kind: authored }
      - pl: "Kot ma biały pysk."
        ru: "У кошки белая мордочка."
        source: { kind: authored }
      - pl: "Koń wsadził pysk do wiadra."
        ru: "Лошадь сунула морду в ведро."
        source: { kind: authored }
  - id: mouth
    ru: "пасть, рот (о человеке, грубо)"
    examples:
      - pl: "Zamknij pysk!"
        ru: "Закрой пасть!"
        source: { kind: authored }
      - pl: "Ma niewyparzony pysk."
        ru: "У него язык без костей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PYSK — «морда, мордочка» животного: у собаки, кошки, лошади. О человеке — грубо, «пасть»: STUL PYSK! — «заткнись!». Лицо — TWARZ, рот — USTA." }
  - { kind: register, text: "О животных слово нейтральное и даже ласковое: PYSZCZEK, «мордочка». О человеке — грубое. Ещё грубее MORDA и GĘBA. В вежливой речи о человеке PYSK не используют." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный и звательный — PYSKU. Родительный — PYSKA, с окончанием -A, как у частей тела." }
  - { kind: pronunciation, text: "Читается «пыск», один слог. Y — твёрдое «ы»." }
collocations:
  - { pl: "psi pysk", ru: "собачья морда" }
  - { pl: "stul pysk", ru: "заткнись (грубо)" }
  - { pl: "niewyparzony pysk", ru: "длинный язык, грубиян" }
family:
  - { pl: "pyszczek", ru: "мордочка", relation: derived }
  - { pl: "pyskować", ru: "дерзить, огрызаться", relation: derived }
  - { pl: "pyskaty", ru: "дерзкий, языкастый", relation: derived }
etymology: "Старое западнославянское слово для морды животного. От него в польском PYSKOWAĆ, «дерзить», PYSKATY, «языкастый»."
memory: "Pysk — морда, мордочка животного; о человеке — грубо, «пасть». Pyszczek — мордочка. Pyskować — дерзить. Читается «пыск»."
idioms:
  - { pl: "mieć niewyparzony pysk", ru: "не стесняться в выражениях" }
