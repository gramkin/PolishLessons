notes:
  - { kind: false-friend, text: "Со значением всё совпадает, и это редкий случай полного согласия: русское «помещение» и польское POMIESZCZENIE построены из одних частей и значат одно. Оба идут от глагола «поместить» и POMIEŚCIĆ, из приставки PO- и корня со значением «место»: буквально «то, куда помещают». Совпадает даже суффикс отглагольного существительного, русское «-ение» и польское -ENIE. Поэтому слово запоминать не нужно, достаточно услышать в нём «поместить». Ловушка только в чтении: конечное -NIE звучит «не», одним слогом, а не «ние» в два." }
  - { kind: pronunciation, text: "Читается «помещэ́не», ударение на предпоследнем слоге, то есть на -SZCZE-. Сочетание SZCZ даёт «шч», то есть ш и ч подряд; в беглой речи это звучит близко к русскому «щ», и мы передаём его как «ще». Конечное -NIE звучит «не», одним слогом с мягким n: это общее правило для всех отглагольных существительных на -ENIE, уже знакомое из ZASILANIE. Слово четырёхсложное: PO-MIE-SZCZE-NIE." }
  - { kind: government, text: "Средний род на -E, и парадигма у него экономная, как у всех отглагольных на -ENIE: родительный единственного и именительный множественного совпадают в POMIESZCZENIA, дательный и местный единственного — в POMIESZCZENIU. Отсюда восемь форм, а не десять, та же картина, что у ZASILANIE. Назначение вводится прилагательным: POMIESZCZENIE GOSPODARCZE, POMIESZCZENIA BIUROWE, POMIESZCZENIE SOCJALNE «бытовка». Нахождение внутри — W с местным: W POMIESZCZENIU." }
  - { kind: usage, text: "Слово официальное и техническое: так пишут в договорах аренды, в строительных нормах и в объявлениях. В обиходной речи о комнате в квартире скажут POKÓJ, а POMIESZCZENIE оставят для нежилых и служебных: POMIESZCZENIE GOSPODARCZE «подсобка», POMIESZCZENIE SOCJALNE «бытовое помещение для работников», POMIESZCZENIE TECHNICZNE. Поэтому если речь о жилой комнате, POMIESZCZENIE прозвучит сухо и казённо, как и русское «помещение» в том же случае." }
