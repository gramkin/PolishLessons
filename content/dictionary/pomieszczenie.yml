etymology: "От глагола POMIEŚCIĆ «поместить, вместить», собранного из приставки PO- и корня *mest-, того же, что в MIEJSCE «место» и MIASTO «город». Русское «помещение» идёт от «поместить» и того же праславянского корня *mest-, и совпадение здесь полное: приставка, корень и суффикс отглагольного существительного отвечают друг другу один в один. Такое бывает редко, и именно поэтому слово стоит запомнить как образец: когда строение совпадает целиком, можно доверять догадке. Корень *mest- дал в польском ещё MIESZKAĆ «жить, проживать» и MIESZKANIE «квартира», и всё это гнездо об одном — о занятии места."
memory: "Полное совпадение с русским «помещением», часть за частью: po- плюс корень «мест-» плюс -enie против «по-» плюс «мест-» плюс «-ение». Догадке здесь можно доверять. Жилая комната всё же pokój, а pomieszczenie — для служебных и нежилых. Восемь форм, как у zasilanie. Конечное -nie читается «не», одним слогом."
