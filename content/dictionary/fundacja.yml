lemma: "fundacja"
rank: 4330
pos: noun
pron: { cyr: "фунда́цья" }
senses:
  - id: foundation
    ru: "фонд, благотворительная организация"
    examples:
      - pl: "Fundacja pomaga chorym dzieciom."
        ru: "Фонд помогает больным детям."
        source: { kind: authored }
      - pl: "Przekazał pieniądze na fundację."
        ru: "Он перечислил деньги в фонд."
        source: { kind: authored }
      - pl: "Założyła fundację swojego imienia."
        ru: "Она основала фонд своего имени."
        source: { kind: authored }
  - id: endowment
    ru: "пожертвование, учреждение (истор.)"
    examples:
      - pl: "Kościół powstał z fundacji króla."
        ru: "Костёл построен на пожертвование короля."
        source: { kind: authored }
      - pl: "Ołtarz jest fundacją miejscowego kupca."
        ru: "Алтарь — дар местного купца."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "FUNDACJA — «фонд», а не «фундамент»: фундамент — FUNDAMENT. Денежный фонд, резерв — FUNDUSZ. Благотворительный фонд — FUNDACJA CHARYTATYWNA." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — FUNDACJI. Множественное — FUNDACJE. Звательный и архаичное FUNDACYJ не используем." }
  - { kind: government, text: "Перечислить деньги в фонд — WPŁACIĆ NA FUNDACJĘ, NA с винительным. Фонд помощи кому — FUNDACJA POMOCY и дательный. Работать в фонде — PRACOWAĆ W FUNDACJI." }
  - { kind: pronunciation, text: "Читается «фунда́цья»: CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "fundacja charytatywna", ru: "благотворительный фонд" }
  - { pl: "założyć fundację", ru: "основать фонд" }
  - { pl: "wpłacić na fundację", ru: "перечислить в фонд" }
family:
  - { pl: "fundusz", ru: "фонд (денежный)", relation: root, id: fundusz }
  - { pl: "organizacja", ru: "организация", relation: root, id: organizacja }
  - { pl: "darowizna", ru: "пожертвование", relation: root }
etymology: "Из латинского FUNDATIO «основание», от FUNDARE «основывать». Тот же корень, что в «фундамент»."
memory: "Fundacja — благотворительный фонд, а фундамент — fundament. Założyć fundację — основать фонд. Читается «фунда́цья»."
idioms:
