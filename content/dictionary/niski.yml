etymology: "Праславянское *nizъkъ, от *nizъ «низ», — то же слово, что русское «низкий», и из того же гнезда «низ», «вниз», «снизить». Сравнительная niższy отвечает русскому «ниже» вплоть до чередования согласного: в русском з → ж («низ» — «ниже»), в польском s → ż (niski — niższy)."
memory: "niski — «низкий», слово в слово, и niżej это «ниже». Вся трудность в чередованиях: niski → niższy → najniższy, а мужско-личное множественное даёт niscy, niżsi, najniżsi."
idioms:
