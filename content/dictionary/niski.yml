notes:
  - { kind: false-friend, text: "Прямое родство: niski и «низкий» — одно праславянское слово *nizъkъ, от *nizъ «низ». Совпадает и сравнительная степень: niżej отвечает русскому «ниже». Так что запоминать значение не нужно, нужно запомнить чередования." }
  - { kind: usage, text: "Сравнительная степень образуется не суффиксом -szy, а с чередованием: niski → niższy (sk выпадает, s переходит в ż). Превосходная — najniższy. Мужско-личные формы множественного дают три разных облика: niscy (sk → sc), niżsi и najniżsi. Это самая неожиданная часть парадигмы." }
  - { kind: government, text: "Сравнение строится двумя способами, как и в русском: niższy OD brata (родительный с предлогом od, как русское «ниже брата») или niższy NIŻ brat (с niż и именительным, как русское «ниже, чем брат»). Оба правильны и равноправны." }
  - { kind: pronunciation, text: "Прилагательное даёт три степени, и каждая склоняется полностью: положительная, сравнительная и превосходная с приставкой naj-. Поэтому в списке форм их втрое больше, чем кажется нужным. Превосходная строится механически: naj- + сравнительная." }
