notes:
  - { kind: false-friend, text: "ДВА ПОЛЬСКИХ ГЛАГОЛА, КОТОРЫЕ РУССКИЙ СВОДИТ К ОДНОМУ. Zaginąć значит «ПРОПАСТЬ БЕЗ ВЕСТИ», исчезнуть неизвестно куда; zginąć значит «ПОГИБНУТЬ», умереть. Отсюда zaginiony «пропавший» против zginął «погиб». Перепутать их — значит объявить живого человека мёртвым, так что пару стоит заучить сразу." }
  - { kind: usage, text: "Слово по форме причастие, по употреблению прилагательное: zaginiony turysta, zaginione dokumenty. Официальный оборот — osoba zaginiona «без вести пропавший», uznać za zaginionego «признать пропавшим без вести». Существительное zaginięcie «исчезновение»: zgłosić zaginięcie «заявить о пропаже»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: za-gi-NIO-ny. Gi мягкое, ni — как нь: «загине́ны». Мужско-личное множественное zaginieni звучит «загине́ни»." }
  - { kind: register, text: "Степеней сравнения нет: пропасть можно либо да, либо нет. Отсюда одиннадцать форм, как у wojenny и narodowy. Слово нейтральное, но в газетном и полицейском языке встречается чаще, чем в разговоре." }
collocations:
  - { pl: "osoba zaginiona", ru: "без вести пропавший" }
  - { pl: "zgłosić zaginięcie", ru: "заявить о пропаже" }
  - { pl: "zaginiony bez wieści", ru: "пропавший без вести" }
family:
  - { pl: "zaginąć", ru: "пропасть без вести", relation: root, id: zaginac }
  - { pl: "zginąć", ru: "погибнуть", relation: antonym, id: zginac }
  - { pl: "ginąć", ru: "гибнуть, пропадать", relation: root }
etymology: "Причастие от zaginąć, приставка za- плюс ginąć «гибнуть, пропадать», из праславянского *gybnǫti — того же корня, что русские «гибнуть», «сгинуть», «погибель». Приставка za- дала значение «деться неизвестно куда», тогда как z- в zginąć — «погибнуть». Одна буква разводит пропажу и смерть."
memory: "zaginiony — «пропавший без вести», от zaginąć. Не путать со zginąć «ПОГИБНУТЬ»: zaginiony жив, пока не доказано иное, а zginął значит умер. Корень тот же, что в русском «гибнуть»."
idioms:
