notes:
  - { kind: false-friend, text: "Само прилагательное переводится прямо, и ZAPAS это «запас», слово общее. Ловушка прячется во множественном числе: ZAPASY значат не только запасы, но и борьбу как вид спорта, а ZAPAŚNIK это борец. Фраза OGLĄDAĆ ZAPASY значит «смотреть борьбу», а не «осматривать запасы», и в спортивной программе она встретится именно в этом смысле. Связь между двумя значениями сегодня уже не прослеживается." }
  - { kind: usage, text: "Одиннадцать форм, относительное прилагательное, степеней сравнения нет. Мужско-личная форма множественного числа ZAPASOWI совершенно обиходна в спорте: ZAPASOWI ZAWODNICY «запасные игроки». Больше того, она свободно работает как существительное: NA ŁAWCE SIEDZIELI ZAPASOWI «на скамейке сидели запасные», ровно как по-русски. Такой переход прилагательного в существительное для польского обычен." }
  - { kind: government, text: "Через запасной выход — предлог PRZEZ с винительным: WYJŚĆ PRZEZ WYJŚCIE ZAPASOWE. Сделать резервную копию — ZROBIĆ KOPIĘ ZAPASOWĄ, винительный без предлога. В устойчивых сочетаниях прилагательное стоит после существительного: KOŁO ZAPASOWE, KLUCZ ZAPASOWY, CZĘŚCI ZAPASOWE «запчасти». Про запас по-польски NA ZAPAS, предлог NA с винительным: KUPIĆ NA ZAPAS «купить про запас»." }
  - { kind: pronunciation, text: "Читается «запасо́вы», четыре слога, ударение на предпоследнем. Буква S между гласными остаётся глухой «с» и никогда не превращается в «з»: это важно, потому что по-русски в похожих положениях бывает озвончение. Начальное ZA- звучит отчётливо, как русское «за-». Конечное Y даёт «ы». В мужско-личной форме ZAPASOWI слышно «запасо́ви»." }
  - { kind: register, text: "Слово нейтральное и очень частое в быту и в технике: WYJŚCIE ZAPASOWE «запасной выход», висящее над дверью в каждом кинотеатре, KOŁO ZAPASOWE «запасное колесо», KLUCZ ZAPASOWY, BATERIA ZAPASOWA, CZĘŚCI ZAPASOWE «запчасти». В компьютерном языке KOPIA ZAPASOWA это «резервная копия», и это единственный принятый термин, английское слово поляки тут не берут." }
