etymology: "От ZAPAS «запас», от общеславянского корня PAS-, того же, что в русских «запас» и «припасы». Слово и образ совпадают полностью, поэтому ZAPAS и «запас» понимают друг друга без перевода. Отдельная ветвь, спортивная борьба ZAPASY и ZAPAŚNIK «борец», отошла от исходного смысла так далеко, что связь уже не видна, и сегодня это два разных слова, совпавших в звучании. Прилагательное образовано обычным суффиксом -OWY."
memory: "Корень общий с русским «запасом», и переводится прямо: wyjście zapasowe «запасной выход», koło zapasowe «запасное колесо», kopia zapasowa «резервная копия». Ловушка во множественном числе существительного: zapasy это ещё и борьба как спорт, а zapaśnik это борец. Мужско-личная форма zapasowi работает и как существительное: na ławce siedzieli zapasowi. Читается «запасо́вы», и s между гласными остаётся глухой."
idioms:
  - { pl: "wyjście zapasowe", ru: "запасной выход" }
