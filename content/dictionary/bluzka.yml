id: bluzka
format: 2
lemma: "bluzka"
rank: 5169
pos: noun
pron: { cyr: "блу́ска" }
senses:
  - id: blouse
    ru: "блузка, кофточка"
    examples:
      - pl: "Założyła białą bluzkę do pracy."
        ru: "На работу она надела белую блузку."
        source: { kind: authored }
      - pl: "Ta bluzka ma krótkie rękawy."
        ru: "У этой кофточки короткие рукава."
        source: { kind: authored }
      - pl: "Kupiłam nową bluzkę na wyprzedaży."
        ru: "Я купила новую блузку на распродаже."
        source: { kind: authored }
      - pl: "Bluzka jest z jedwabiu."
        ru: "Блузка из шёлка."
        source: { kind: authored }
      - pl: "Ta bluzka pasuje do spódnicy."
        ru: "Эта блузка подходит к юбке."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BLUZKA — не только «блузка» с пуговицами, но и любой лёгкий женский верх: кофточка, топ. А BLUZA — это «толстовка», спортивная кофта: BLUZA Z KAPTUREM, «толстовка с капюшоном»." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: W BLUZCE. Родительный множественного — BLUZEK. Звательный не даётся." }
  - { kind: government, text: "Блузка с рукавом — BLUZKA Z RĘKAWEM, Z с творительным. Блузка к юбке — BLUZKA DO SPÓDNICY, DO с родительным. В блузке — W BLUZCE." }
  - { kind: pronunciation, text: "Читается «блу́ска», ударение на первом слоге. Z перед глухим K оглушается в «с»." }
collocations:
  - { pl: "bluzka z krótkim rękawem", ru: "кофточка с коротким рукавом" }
  - { pl: "jedwabna bluzka", ru: "шёлковая блузка" }
  - { pl: "biała bluzka", ru: "белая блузка" }
family:
  - { pl: "bluza", ru: "толстовка, спортивная кофта", relation: root }
  - { pl: "bluzeczka", ru: "кофточка", relation: derived }
  - { pl: "bluza z kapturem", ru: "толстовка с капюшоном", relation: root }
etymology: "Из французского слова, обозначавшего рабочую блузу. Русская «блуза», «блузка» — того же источника."
memory: "Bluzka — блузка, кофточка; bluza — толстовка. Читается «блу́ска». Bluzka z krótkim rękawem — кофточка с коротким рукавом."
idioms:
  - { pl: "ubrać się na cebulkę", ru: "одеться слоями, «капустой»" }
