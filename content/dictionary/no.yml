etymology: "Из польского ano; та же частица, что русское «ну» (и «ан» в «ан нет»)."
memory: "no — разговорное «ну», а в ответе часто заменяет «да»: — Idziesz? — No. Не путайте с английским no: отрицание в польском — nie."
