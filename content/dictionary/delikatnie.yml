notes:
  - { kind: false-friend, text: "Русское «деликатно» значит только «тактично», и это узкий, довольно книжный смысл. Польское DELIKATNIE шире и в обиходной речи означает прежде всего физическую осторожность: «осторожно, мягко, нежно, слегка». DOTKNIJ DELIKATNIE это «коснись осторожно», а не «коснись деликатно»; DELIKATNIE ZAMKNĄĆ DRZWI — «тихо закрыть дверь». Тактичность у слова тоже есть, и в этом значении оно совпадает с русским, но это не главное его употребление. Прилагательное DELIKATNY так же шире русского «деликатного»: DELIKATNA SKÓRA «чувствительная кожа», DELIKATNA TKANINA «тонкая ткань»." }
  - { kind: government, text: "Наречие, три формы: положительная DELIKATNIE, сравнительная DELIKATNIEJ, превосходная NAJDELIKATNIEJ. Образуются они от прилагательного DELIKATNY обычным способом, без исключений. Сравнение строится предлогом OD с родительным или союзом NIŻ: DELIKATNIEJ OD NIEGO, DELIKATNIEJ NIŻ ON. В безличных оборотах при наречии стоит инфинитив: NAJDELIKATNIEJ BYŁOBY NIE WSPOMINAĆ. Как и у всех наречий, рода и падежа нет, поэтому форм всего три." }
  - { kind: pronunciation, text: "Читается «делика́тне», ударение на предпоследнем слоге из четырёх. Конечное -NIE произносится «не» одним слогом с мягким н, а не «ние» в два слога, и поэтому польское слово короче русского «деликатно» по числу слогов не становится, но членится иначе. Все гласные открытые, без редукции: второе E звучит полным «э». В сравнительной DELIKATNIEJ ударение остаётся на предпоследнем слоге, в превосходной NAJDELIKATNIEJ слогов становится пять и ударение снова идёт на предпоследний." }
  - { kind: usage, text: "Частотные сочетания: DELIKATNIE MÓWIĄC «мягко говоря», DOTKNĄĆ DELIKATNIE, DELIKATNIE RZECZ UJMUJĄC «мягко выражаясь», OBCHODZIĆ SIĘ DELIKATNIE «обращаться осторожно». Первое из них очень частотно и отвечает русскому «мягко говоря» буквально. Прилагательное DELIKATNY покрывает и «нежный», и «хрупкий», и «тактичный», и «тонкий» — о ткани, о коже, о вопросе. Существительное DELIKATNOŚĆ употребляется редко и означает именно тактичность." }
