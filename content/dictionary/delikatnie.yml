etymology: "От прилагательного DELIKATNY, из латинского DELICATUS «изысканный, нежный, избалованный», от DELICIAE «наслаждение» и далее от LACERE «привлекать». Русское «деликатный» пришло из того же латинского слова, но через французское DÉLICAT, и во французском оно к тому времени уже сузилось до тактичности и утончённости. Польский взял слово раньше и напрямую из латыни, сохранив более широкий исходный смысл — нежность, хрупкость, осторожность, — а тактичность осталась лишь одним из значений. Отсюда и расхождение: не польское слово расширилось, а русское сузилось по дороге через Париж. Тот же латинский корень дал DELICJE «лакомства» и английское DELICIOUS."
memory: "Шире русского «деликатно»: прежде всего «осторожно, мягко, нежно», и только потом «тактично». Dotknij delikatnie — «коснись осторожно». Очень частотное delikatnie mówiąc отвечает русскому «мягко говоря». Три формы: delikatnie, delikatniej, najdelikatniej. Русское слово сузилось по дороге через французский, польское взято из латыни напрямую и сохранило исходную широту."
