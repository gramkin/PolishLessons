        ru: "Брак заключают в загсе."
        source: { kind: authored }
  - id: include
    ru: "включать в себя"
    examples:
      - pl: "Cena zawiera podatek."
        ru: "Цена включает налог."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОДИН ПОЛЬСКИЙ ГЛАГОЛ НА ДВА РУССКИХ. Zawierać значит и «содержать» (produkt zawiera witaminy), и «заключать» (zawierać umowę, pokój, małżeństwo, znajomość). Русский разводит эти смыслы двумя словами, так что выбирать приходится по дополнению: вещество содержат, а договор заключают." }
  - { kind: usage, text: "ОБА ЯЗЫКА ПРИШЛИ К «ЗАКЛЮЧЕНИЮ ДОГОВОРА» ЧЕРЕЗ ОБРАЗ ЗАПИРАНИЯ, НО РАЗНЫМИ ПУТЯМИ. Польское zawierać — от zawrzeć «затворить», корень тот же, что в wrota и русских «ворота», «запирать». Русское «заключать» — от «ключ». Образ один, железо разное. Готовые оборты: zawierać umowę, zawierać pokój, zawierać znajomość." }
  - { kind: usage, text: "Вид несовершенный: есть ZAWIERAJĄC и причастие ZAWIERAJĄCY, формы на -wszy нет. Совершенная пара выглядит иначе — ZAWRZEĆ, и основа в ней меняется заметно: zawieram umowę «заключаю», zawrę umowę «заключу», umowa ZAWARTA «договор заключён»." }
collocations:
  - { pl: "zawierać umowę", ru: "заключать договор" }
  - { pl: "zawierać pokój", ru: "заключать мир" }
  - { pl: "zawierać znajomość", ru: "заводить знакомство" }
family:
  - { pl: "zawrzeć", ru: "заключить (сов.)", relation: aspect }
  - { pl: "zawartość", ru: "содержимое, содержание", relation: derived }
  - { pl: "wrota", ru: "ворота", relation: root }
etymology: "Приставка za- и корень wier-, из праславянского *verti «запирать, затворять» — того же, что в wrota и русских «ворота», «отворить», «запирать». Отсюда zawrzeć «затворить» и далее «заключить договор»: договор как бы затворяют. Русское «заключать» построено на том же образе, но от «ключа»."
memory: "zawierać — и «содержать», и «заключать»: sok zawiera cukier, zawierać umowę. Корень тот же, что в «воротах»: договор «затворяют». Совершенная пара меняет основу — zawrzeć, umowa zawarta."
idioms:
  - { pl: "zawierać znajomość", ru: "заводить знакомство" }
  - { pl: "cena zawiera wszystko", ru: "цена включает всё" }
formExamplesSkip:
  - { form: "zawierani", reason: "Мужско-личная форма страдательного причастия образуется по общему правилу, но глагол управляет названиями веществ, документов и отношений: заключают договор, мир, знакомство, содержат витамины — но не человека. Подлежащего, с которым эта форма могла бы согласоваться, в языке не возникает." }
