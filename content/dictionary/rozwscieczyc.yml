        ru: "Решение взбесило жителей."
        source: { kind: authored }
  - id: become-furious
    ru: "прийти в ярость (rozwścieczyć się)"
    examples:
      - pl: "Rozwścieczył się na cały świat."
        ru: "Он пришёл в ярость на весь свет."
        source: { kind: authored }
      - pl: "Rozwścieczyła się, gdy to usłyszała."
        ru: "Она пришла в ярость, услышав это."
        source: { kind: authored }
notes:
  - { kind: government, text: "Винительный падеж: rozwścieczyć kogoś. С się значит «прийти в ярость», на кого — na с винительным." }
  - { kind: false-friend, text: "Корень wściekły «бешеный», который уже есть в словаре; wścieklizna значит «бешенство» как болезнь." }
  - { kind: usage, text: "Сильное слово, резче чем zdenerwować «рассердить» или rozzłościć «разозлить»." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "rozwścieczyć kogoś", ru: "привести кого-л. в ярость" }
etymology: "roz- + wściekły «бешеный»; ср. wścieklizna «бешенство»."
memory: "rozwścieczyć — «привести в ярость», резче чем rozzłościć. С się значит «прийти в ярость». Корень тот же, что у wściekły."
