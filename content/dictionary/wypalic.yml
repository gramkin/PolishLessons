notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «палить», но главное значение у него другое, и это одна из самых частых ошибок. Польское PALIĆ значит прежде всего «КУРИТЬ»: PALĘ PAPIEROSY, NIE PALĘ, PALENIE WZBRONIONE «курить запрещено». Второе значение — «жечь, топить»: PALIĆ W PIECU. А вот русское «палить» в смысле «стрелять» по-польски будет STRZELAĆ, и PALIĆ этого не значит никогда. Поэтому вывеска PALENIE ZABRONIONE запрещает не стрельбу, а курение." }
  - { kind: usage, text: "Приставка wy- даёт у этого корня три расходящихся смысла, и все три в ходу. Буквальный: WYPALIĆ TRAWĘ, WYPALIĆ ZNAK — выжечь. Курительный: WYPALIĆ PAPIEROSA — выкурить до конца, где wy- значит «до конца, весь». И переносный, разговорный: WYPALIĆ COŚ — выпалить, сказать резко и не подумав, ровно как русское «выпалить». Отдельно стоит WYPALENIE ZAWODOWE — «профессиональное выгорание», готовый современный термин." }
  - { kind: pronunciation, text: "Повелительное здесь WYPAL, без -ij, и это проверка правила из карточки KARMIĆ с другой стороны. Правило гласит: -IJ появляется тогда, когда остаток основы не может закрыть слово. Отбросим -i у WYPALI, останется WYPAL- — а на -L польское слово оканчиваться вполне может, так что гласная не нужна. Сравните с ZABRZMI из партии про звук: там остаётся ZABRZM-, закрыть слово таким стыком нельзя, и появляется ZABRZMIJ. Одно правило, два исхода." }
  - { kind: government, text: "Что — винительный: WYPALIĆ TRAWĘ, PAPIEROSA, ZNAK. Где или на чём — предлог NA с местным: NA SKWERZE, NA SKÓRZE. В переносном значении дополнением бывает целое высказывание, часто с союзом ŻE: WYPALIŁ, ŻE NIE ZGADZA SIĘ. Отрицание берёт родительный: NIE WYPALIŁ ANI JEDNEGO PAPIEROSA." }
