etymology: "Приставка wy- «вы-» и PALIĆ, из праславянского *paliti «жечь» — тот же корень, что русские «палить», «пал», «опалить», «запал». Исходное значение у корня огневое, и в польском оно сохранилось в PALIĆ W PIECU «топить печь» и SPALIĆ «сжечь». Курительное значение пришло позже и по понятной дороге: табак жгут, и в русском та же логика жила в слове «курить» от «кур» — дым. Русское «палить» в смысле стрельбы — тоже развитие огневого значения, через пороховой выстрел, но польский этой ветки не взял."
memory: "palić — это прежде всего «курить», а не «палить»: palenie wzbronione значит «курить запрещено». Стрелять — strzelać. И повелительное wypal без -ij, потому что на -l слово кончаться может."
