        ru: "Мерзавцы убежали от полиции."
        source: { kind: authored }
      - pl: "Zatrzymano dwóch skurwysynów."
        ru: "Задержали двух мерзавцев."
        source: { kind: authored }
notes:
  - { kind: register, text: "ВАЖНО: это одно из самых грубых слов польского языка, вульгарное в полном смысле. Оно не имеет шутливого или дружеского употребления и в приличном обществе невозможно — ни на работе, ни с незнакомыми, ни при детях. Слово приведено потому, что оно часто встречается в фильмах и разговорной речи, и его нужно понимать. Употреблять его самому не стоит." }
  - { kind: false-friend, text: "Вот где опаснее всего. Русское «сукин сын» звучит почти беззлобно, иногда даже тепло — «ах ты сукин сын!». Польское skurwysyn НЕ такое: по силе оно ближе к самой тяжёлой русской брани. Русскоязычный, опираясь на знакомое «сукин сын», систематически недооценивает это слово и может нанести настоящее оскорбление, думая, что пошутил." }
  - { kind: usage, text: "Буквально слово значит «сын шлюхи»: s- + kurwy + syn. У него, как у kuzyn, два правильных именительных множественного: skurwysyni и skurwysynowie. Звательный — skurwysynu (именно он звучит в обращении), предложный — skurwysynie." }
  - { kind: government, text: "Существительное одушевлённое мужского рода, поэтому винительный совпадает с родительным: widzę skurwysyna. Назвать кем-то — творительный: nazwać kogoś skurwysynem." }
family:
  - { pl: "kurwa", ru: "груб. шлюха; чёрт (бранное)", relation: root, id: kurwa }
  - { pl: "syn", ru: "сын", relation: root, id: syn }
etymology: "Сращение трёх слов: s(yn) k(urwy) syn, то есть «сын шлюхи», где kurwa — древнее слово праславянского происхождения (*kurva), родственное русскому областному «курва». Русское «сукин сын» построено по той же модели — «сын суки», — но в русском образ собаки, а в польском человека, и этим объясняется разница в силе."
memory: "skurwysyn буквально «сын шлюхи» (s + kurwy + syn). Выглядит как русское «сукин сын», но по силе это куда тяжелее: польское слово — настоящая вульгарная брань, а не фамильярная шутка. Понимать нужно, говорить — нет."
idioms:
  - { pl: "skurwysyn jeden", ru: "мерзавец этакий" }
  - { pl: "ostatni skurwysyn", ru: "последний мерзавец" }
