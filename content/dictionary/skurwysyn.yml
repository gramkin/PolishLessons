# review
id: skurwysyn
format: 2
lemma: "skurwysyn"
rank: 2011
pos: noun
pron: { cyr: "скурвы́сын" }
senses:
  - id: bastard
    ru: "груб. сукин сын, мерзавец (крайне грубо)"
    examples:
      - pl: "Ten skurwysyn ukradł mi samochód."
        ru: "Этот мерзавец угнал у меня машину."
        source: { kind: authored }
      - pl: "Nie chcę widzieć tego skurwysyna."
