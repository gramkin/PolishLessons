    source: { kind: translated, id: 13930531 }
  - form: "uderzaj"
    pl: "Nie uderzaj w stół."
    ru: "Не бей по столу."
    source: { kind: authored }
  - form: "uderzaj"
    pl: "Uderzaj mocniej."
    ru: "Бей сильнее."
    source: { kind: authored }
  - form: "uderzającym"
    pl: "Mówiono o uderzającym podobieństwie."
    ru: "Говорили о поразительном сходстве."
