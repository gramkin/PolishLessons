    ru: "Кончилось ударами кулаком в дверь."
    source: { kind: authored }
  - form: "uderzaniu"
    pl: "W uderzaniu w stół nie ma argumentu."
    ru: "В ударах по столу нет довода."
    source: { kind: authored }
  - form: "uderzaniu"
    pl: "O uderzaniu dzieci mówił wykładowca."
    ru: "О том, что детей бьют, говорил лектор."
    source: { kind: authored }
  - form: "uderzaniu"
    pl: "Po uderzaniu fal została wyrwa."
    ru: "После ударов волн осталась промоина."
    source: { kind: authored }
  - form: "uderzano"
    pl: "Uderzano w stół pięścią."
    ru: "По столу били кулаком."
    source: { kind: authored }
  - form: "uderzano"
    pl: "Uderzano w bęben na alarm."
    ru: "В барабан били для тревоги."
    source: { kind: authored }
  - form: "uderzano"
    pl: "Uderzano go po twarzy."
    ru: "Его били по лицу."
    source: { kind: authored }
  - form: "uderzany"
    pl: "Był uderzany przez starszych."
    ru: "Его били старшие."
    source: { kind: authored }
  - form: "uderzany"
    pl: "Bęben nie był uderzany równo."
    ru: "В барабан били неровно."
    source: { kind: authored }
  - form: "uderzany"
    pl: "Uderzany wiatrem żagiel łopotał."
    ru: "Бьющийся на ветру парус хлопал."
    source: { kind: authored }
  - form: "uderzanych"
    pl: "Nie ma tu uderzanych dzieci."
    ru: "Здесь нет детей, которых бьют."
    source: { kind: authored }
  - form: "uderzanych"
    pl: "Wśród uderzanych strun jedna fałszowała."
    ru: "Среди струн, по которым били, одна фальшивила."
    source: { kind: authored }
  - form: "uderzanych"
    pl: "Od uderzanych fal skała kruszeje."
    ru: "От бьющих волн скала крошится."
    source: { kind: authored }
  - form: "uderzanym"
    pl: "W uderzanym przez fale brzegu widać wyrwy."
    ru: "В берегу, по которому бьют волны, видны промоины."
    source: { kind: authored }
  - form: "uderzanym"
    pl: "Uderzanym dzieciom trzeba pomóc."
    ru: "Детям, которых бьют, надо помочь."
    source: { kind: authored }
  - form: "uderzanym"
    pl: "Z uderzanym co godzinę dzwonem czas płynie wolniej."
    ru: "С колоколом, в который бьют каждый час, время идёт медленнее."
    source: { kind: authored }
  - form: "uderzanymi"
    pl: "Między szarpanymi a uderzanymi strunami jest różnica."
    ru: "Между щипковыми и ударными струнами есть разница."
    source: { kind: authored }
  - form: "uderzanymi"
    pl: "Zajmuje się uderzanymi instrumentami."
    ru: "Он занимается ударными инструментами."
    source: { kind: authored }
  - form: "uderzanymi"
    pl: "Rozmawiał z uderzanymi w szkole dziećmi."
    ru: "Он говорил с детьми, которых били в школе."
    source: { kind: authored }
  - form: "uderzasz"
    pl: "Uderzasz w stół pięścią."
    ru: "Ты бьёшь кулаком по столу."
    source: { kind: authored }
  - form: "uderzasz"
    pl: "Nie uderzasz nikogo."
    ru: "Ты никого не бьёшь."
    source: { kind: authored }
  - form: "uderzasz"
