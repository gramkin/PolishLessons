    pl: "Deszcz uderzał o szyby."
    ru: "Дождь бил в стёкла."
    source: { kind: authored }
  - form: "uderzał"
    pl: "Uderzał pięścią w drzwi."
    ru: "Он бил кулаком в дверь."
