    pl: "Był człowiekiem uderzającym urodą."
    ru: "Он был человеком поразительной красоты."
    source: { kind: authored }
  - form: "uderzającym"
    pl: "W uderzającym tempie rosły ceny."
    ru: "Цены росли поразительными темпами."
    source: { kind: authored }
  - form: "uderzał"
    pl: "Chłopiec uderzał w bęben."
    ru: "Мальчик бил в барабан."
    source: { kind: translated, id: 12285674 }
