# review
id: uderzac
format: 2
lemma: "uderzać"
rank: 2428
pos: verb
aspect: imperf
aspectPair: uderzyc
pron: { cyr: "удэ́жаць" }
senses:
  - id: strike
    ru: "ударять, бить"
    examples:
      - pl: "Chłopiec uderzał w bęben."
        ru: "Мальчик бил в барабан."
        source: { kind: translated, id: 12285674 }
      - pl: "Fale uderzają o brzeg."
        ru: "Волны бьют о берег."
        source: { kind: authored }
      - pl: "Nie uderzaj w stół."
        ru: "Не бей по столу."
        source: { kind: authored }
  - id: striking
    ru: "бросающийся в глаза (причастие uderzający)"
    examples:
      - pl: "Uderzające jest jego podobieństwo do ojca."
        ru: "Бросается в глаза его сходство с отцом."
        source: { kind: authored }
      - pl: "To uderzająca różnica."
        ru: "Это разительная разница."
        source: { kind: authored }
notes:
  - { kind: government, text: "Ударять ВО что-л. — uderzać W coś, с винительным: uderzać w stół. А о волнах — uderzać O brzeg, тоже винительный, но предлог другой." }
  - { kind: false-friend, text: "От derzeć? Нет: u- + derzyć, корень тот же, что в русском «ударять», «дёрнуть». Родство прямое." }
  - { kind: usage, text: "Причастие uderzający значит «поразительный, бросающийся в глаза»: uderzające podobieństwo «поразительное сходство». Это значение встречается часто и далеко от удара." }
  - { kind: usage, text: "Совершенный вид — uderzyć, у которого уже есть карточка." }
collocations:
  - { pl: "uderzać w stół", ru: "бить по столу" }
  - { pl: "uderzające podobieństwo", ru: "поразительное сходство" }
etymology: "u- + derzyć; прямая родня русским «ударять», «дёрнуть»."
memory: "uderzać — «ударять»: uderzać W coś, но fale uderzają O brzeg. Причастие uderzający значит «поразительный». Совершенный вид — uderzyć."
