# review
id: pozostaly
format: 2
lemma: "pozostały"
rank: 1243
pos: adj
pron: { cyr: "позоста́уы" }
senses:
  - id: remaining
    ru: "остальной, оставшийся (о вещах)"
    examples:
      - pl: "Gdzie są pozostałe pliki?"
        ru: "Где остальные файлы?"
        source: { kind: translated, id: 5930839 }
      - pl: "On ma trzy córki; jedna jest mężatką, pozostałe nie."
        ru: "У него три дочери: одна замужем, остальные нет."
        source: { kind: translated, id: 610206 }
      - pl: "Chłopcy biorą pozostałe cztery róże i odchodzą z nimi."
        ru: "Мальчики берут оставшиеся четыре розы и уходят с ними."
        source: { kind: tatoeba, id: 3660664 }
  - id: the-others
    ru: "остальные (о людях) — субстантивированное"
    examples:
      - pl: "Dogoniłem pozostałych."
        ru: "Я догнал остальных."
        source: { kind: translated, id: 10601986 }
      - pl: "Pobiegła szybko, by dogonić pozostałych."
        ru: "Она быстро побежала, чтобы догнать остальных."
        source: { kind: translated, id: 742346 }
      - pl: "Chiński jest o wiele trudniejszy od pozostałych języków obcych."
        ru: "Китайский намного труднее остальных иностранных языков."
        source: { kind: translated, id: 3452362 }
notes:
  - { kind: false-friend, text: "Осторожно: формы pozostali, pozostała и pozostały почти всегда оказываются прошедшим временем глагола pozostać «остаться»: Pozostali w Tennessee «Они остались в Теннесси». Прилагательное надёжно узнаётся в формах pozostałe и pozostałych." }
  - { kind: usage, text: "Pozostały значит «остальной, оставшийся»: pozostałe pliki «остальные файлы». Существительное-синоним — reszta «остаток»." }
  - { kind: government, text: "Как и в русском, слово легко становится существительным: pozostali «остальные (люди)», pozostałe «остальные (вещи)»." }
  - { kind: usage, text: "Родственный глагол — pozostać «остаться», карточка уже есть." }
collocations:
  - { pl: "pozostałe rzeczy", ru: "остальные вещи" }
  - { pl: "wszyscy pozostali", ru: "все остальные" }
  - { pl: "pozostała część", ru: "оставшаяся часть" }
etymology: "Причастие от pozostać «остаться», от stać «стоять» с приставками po- и zo-. Русское «оставшийся» собрано тем же способом."
memory: "pozostały — «остальной, оставшийся»: pozostałe pliki «остальные файлы», dogonić pozostałych «догнать остальных». Но осторожно: pozostali и pozostała почти всегда прошедшее время глагола pozostać «остаться»."
