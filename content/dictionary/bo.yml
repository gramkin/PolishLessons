id: bo
format: 2
lemma: "bo"
rank: 89
pos: part
pron: { cyr: "бо" }
senses:
  - id: because
    ru: "потому что, так как (разговорное)"
    examples:
      - pl: "Robię to, bo chcę."
        ru: "Я делаю это, потому что хочу."
        source: { kind: tatoeba, id: 3679988 }
      - pl: "Tyję bo jem dużo słodyczy."
        ru: "Я толстею, потому что ем много сладостей."
        source: { kind: tatoeba, id: 6588997 }
      - pl: "Nie idę, bo pada."
        ru: "Я не иду, потому что дождь."
        source: { kind: authored }
  - id: or-else
    ru: "а то, иначе"
    examples:
      - pl: "Stój, bo strzelam!"
        ru: "Стой, или я буду стрелять!"
        source: { kind: tatoeba, id: 6320399 }
      - pl: "Idź, bo się spóźnisz."
        ru: "Иди, а то опоздаешь."
        source: { kind: tatoeba, id: 12105204 }
notes:
  - { kind: usage, text: "bo стоит только внутри предложения, после запятой; книжный синоним — ponieważ, который может начинать фразу." }
collocations:
  - { pl: "bo inaczej", ru: "а то" }
  - { pl: "bo co?", ru: "а что?" }
etymology: "Праславянское *bo «ведь, потому что» — то же слово, что устаревшее русское «ибо»."
memory: "Два значения, и второе неожиданное: Robię to, bo chcę «потому что», но Idź, bo się spóźnisz — «а то опоздаешь». Родственно русскому «ибо»."
idioms:
  - { pl: "bo jak nie...", ru: "а не то…" }
  - { pl: "bo co?", ru: "а что?" }
