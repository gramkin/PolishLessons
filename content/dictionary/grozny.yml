# review
id: grozny
format: 2
lemma: "groźny"
rank: 4655
pos: adj
pron: { cyr: "гро́зьны" }
senses:
  - id: dangerous
    ru: "опасный, угрожающий"
    examples:
      - pl: "To groźna choroba."
        ru: "Это опасная болезнь."
        source: { kind: authored }
      - pl: "Doszło do groźnego wypadku."
        ru: "Произошла опасная авария."
        source: { kind: authored }
      - pl: "To najgroźniejszy przestępca w kraju."
        ru: "Это самый опасный преступник в стране."
        source: { kind: authored }
  - id: menacing
    ru: "грозный, суровый (о виде, взгляде)"
    examples:
      - pl: "Rzucił mi groźne spojrzenie."
        ru: "Он бросил на меня грозный взгляд."
        source: { kind: authored }
      - pl: "Ojciec miał groźną minę, ale się uśmiechał."
        ru: "У отца было грозное лицо, но он улыбался."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «грозный» — прежде всего «внушающий страх, суровый»: «грозный царь». Польское GROŹNY чаще значит «опасный»: GROŹNA CHOROBA, GROŹNY WYPADEK, GROŹNY PRZECIWNIK, «опасный соперник». Русскому «опасный» соответствуют и NIEBEZPIECZNY, и GROŹNY; GROŹNY звучит сильнее. Иван Грозный по-польски — IWAN GROŹNY." }
  - { kind: usage, text: "Полная парадигма: GROŹNY, GROŹNIEJSZY, NAJGROŹNIEJSZY. Все степени очень частотны в новостях и спорте: NAJGROŹNIEJSZY RYWAL. Мужское-личное: GROŹNI, GROŹNIEJSI, NAJGROŹNIEJSI." }
  - { kind: government, text: "Опасный для кого-то — GROŹNY DLA KOGOŚ, DLA с родительным: GROŹNY DLA ZDROWIA. Наречие GROŹNIE — «опасно, грозно»: WYGLĄDAĆ GROŹNIE." }
  - { kind: pronunciation, text: "Читается «гро́зьны», два слога, ударение на первом. Ź — мягкое «зь». В GROŹNIEJSZY: «грозьне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в новостях, медицине и спорте. В спортивных репортажах GROŹNA SYTUACJA — «опасный момент» у ворот. В прогнозах — GROŹNE BURZE, «опасные грозы»." }
collocations:
  - { pl: "groźny wypadek", ru: "опасная авария" }
  - { pl: "groźna choroba", ru: "опасная болезнь" }
  - { pl: "groźny przeciwnik", ru: "опасный соперник" }
family:
  - { pl: "groźba", ru: "угроза", relation: root, id: grozba }
  - { pl: "grozić", ru: "угрожать", relation: root, id: grozic }
  - { pl: "niebezpieczny", ru: "опасный", relation: root, id: niebezpieczny }
etymology: "От GROZA «ужас, гроза», общеславянского *groza, того же, что русское «гроза» и «угроза». Польское GROZA значит прежде всего «ужас», а «гроза» в погоде — BURZA. Отсюда и GROŹNY — «внушающий ужас, опасный»."
memory: "Groźny — опасный; грозный: groźna choroba, groźny przeciwnik, groźne spojrzenie. Groźniejszy, najgroźniejszy. Гроза в погоде — burza! Читается «гро́зьны»."
idioms:
  - { pl: "groźna sytuacja", ru: "опасный момент (в спорте)" }
