notes:
  - { kind: usage, text: "szczerze mówiąc — «честно говоря», самый частый вводный оборот с этим словом." }
  - { kind: usage, text: "Наречие от szczery «искренний». Русское «щирый» (диалектное «искренний») — то же слово." }
  - { kind: usage, text: "Szczerze? как отдельная реплика значит «Честно?», «Серьёзно?»." }
  - { kind: usage, text: "Сравнительная степень szczerzej «искреннее» встречается редко: обычно говорят bardziej szczerze." }
collocations:
