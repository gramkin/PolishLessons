etymology: "Наречие от szczery «искренний, чистый», праславянское *ščirъ. Русское диалектное «щирый» и украинское «щирий» — то же слово."
memory: "szczerze — «искренне, откровенно», от szczery «искренний»; русское диалектное «щирый» — то же слово. Главное выражение — szczerze mówiąc «честно говоря». А Szczerze? отдельной репликой значит «Честно?»"
idioms:
  - { pl: "szczerze mówiąc", ru: "честно говоря" }
  - { pl: "szczerze powiedziawszy", ru: "откровенно говоря" }
