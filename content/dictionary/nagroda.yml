# review
id: nagroda
format: 2
lemma: "nagroda"
rank: 1067
pos: noun
pron: { cyr: "нагро́да" }
senses:
  - id: prize
    ru: "награда, приз"
    examples:
      - pl: "Helen wygrała nagrodę."
        ru: "Хелен выиграла приз."
        source: { kind: translated, id: 529747 }
      - pl: "Zdobył pierwszą nagrodę."
        ru: "Он получил первый приз."
        source: { kind: translated, id: 10054135 }
      - pl: "Czy jest nagroda?"
        ru: "Есть ли награда?"
        source: { kind: translated, id: 8770725 }
  - id: deserve
    ru: "zasługiwać na nagrodę — заслуживать награды"
    examples:
      - pl: "Zasługujesz na nagrodę."
        ru: "Ты заслуживаешь награды."
        source: { kind: translated, id: 589381 }
      - pl: "Otrzymasz nagrodę."
        ru: "Ты получишь награду."
        source: { kind: translated, id: 363771 }
      - pl: "Walczą o nagrodę."
        ru: "Они борются за приз."
        source: { kind: translated, id: 899569 }
  - id: no-reward
    ru: "nie ma nagrody bez trudu — без труда нет награды"
    examples:
      - pl: "Nie ma nagrody bez trudu."
        ru: "Без труда нет награды."
        source: { kind: translated, id: 538950 }
      - pl: "W świecie przyrody nie ma nagrody ni kary."
        ru: "В мире природы нет ни награды, ни кары."
        source: { kind: translated, id: 711154 }
      - pl: "Chwalił się zdobyciem pierwszej nagrody."
        ru: "Он хвастался тем, что получил первый приз."
        source: { kind: translated, id: 403735 }
notes:
  - { kind: government, text: "zasługiwać NA nagrodę — «заслуживать награды», предлог na с винительным. Русский обходится родительным без предлога, так что оборот надо помнить целиком." }
  - { kind: usage, text: "zdobyć nagrodę «получить награду», wygrać nagrodę «выиграть приз», pierwsza nagroda «первый приз»." }
  - { kind: usage, text: "ceremonia wręczenia nagród — «церемония вручения наград», с родительным падежом множественного числа." }
  - { kind: usage, text: "Слово от nagrodzić «наградить», общий корень с русским «награда» и «город/град» в старом значении «огороженное место, добро»." }
collocations:
  - { pl: "zdobyć nagrodę", ru: "получить награду" }
  - { pl: "pierwsza nagroda", ru: "первый приз" }
  - { pl: "zasługiwać na nagrodę", ru: "заслуживать награды" }
  - { pl: "wręczenie nagród", ru: "вручение наград" }
family:
  - { pl: "nagrodzić", ru: "наградить", relation: root }
  - { pl: "nagradzać", ru: "награждать", relation: derived }
etymology: "От nagrodzić «наградить», общий корень с русским «награда». Старое значение корня — «огороженное добро», отсюда же «город» и «град»."
memory: "nagroda — «награда, приз». Главное — управление: zasługiwać NA nagrodę, с предлогом na и винительным, тогда как русский говорит «заслуживать награды» без предлога."
idioms:
  - { pl: "zdobyć nagrodę", ru: "получить награду" }
  - { pl: "pierwsza nagroda", ru: "первый приз" }
  - { pl: "nie ma nagrody bez trudu", ru: "без труда нет награды" }
formExamplesSkip:
  - { form: "nagrodo", reason: "звательный падеж: к награде не обращаются, форма не употребляется" }
