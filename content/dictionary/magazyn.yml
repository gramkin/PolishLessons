# review
id: magazyn
format: 2
lemma: "magazyn"
rank: 1452
pos: noun
pron: { cyr: "мага́зын" }
senses:
  - id: magazine
    ru: "журнал (иллюстрированный)"
    examples:
      - pl: "Siedziała na krześle czytając magazyn."
        ru: "Она сидела на стуле и читала журнал."
        source: { kind: tatoeba, id: 393079 }
      - pl: "Ten magazyn wychodzi raz w tygodniu."
        ru: "Этот журнал выходит раз в неделю."
        source: { kind: translated, id: 362993 }
      - pl: "Przynieś mi magazyny."
        ru: "Принеси мне журналы."
        source: { kind: tatoeba, id: 527606 }
  - id: warehouse
    ru: "склад"
    examples:
      - pl: "Pracuje jako ochroniarz w magazynie."
        ru: "Он работает охранником на складе."
        source: { kind: translated, id: 709381 }
      - pl: "Do wymiany 2 świetlówki na magazynie."
        ru: "На складе нужно заменить две люминесцентные лампы."
        source: { kind: translated, id: 2219008 }
notes:
  - { kind: false-friend, text: "Главная ловушка для русского: magazyn — это НЕ «магазин». Магазин по-польски sklep. Польское magazyn значит «журнал» или «склад»." }
  - { kind: usage, text: "Два основных значения различает контекст: czytać magazyn «читать журнал», pracować w magazynie «работать на складе»." }
  - { kind: usage, text: "Третье значение — «магазин» оружия, обойма; в уменьшительной форме magazynek." }
  - { kind: usage, text: "Для журнала есть и czasopismo, для газеты — gazeta, которая уже есть карточкой." }
collocations:
  - { pl: "czytać magazyn", ru: "читать журнал" }
  - { pl: "pracować w magazynie", ru: "работать на складе" }
  - { pl: "magazyn mody", ru: "журнал мод" }
etymology: "Через французское magasin из арабского makhazin «склады». Русский «магазин» пришёл тем же путём, но значения разошлись: русский взял «лавку», польский оставил «склад» и добавил «журнал» вслед за английским."
memory: "magazyn — это НЕ «магазин»! Магазин по-польски sklep. А magazyn значит «журнал» (czytać magazyn) или «склад» (pracować w magazynie). Слово по происхождению то же самое, но значения разошлись."
idioms:
  - { pl: "czytać magazyn", ru: "читать журнал" }
  - { pl: "pracować w magazynie", ru: "работать на складе" }
  - { pl: "magazyn mody", ru: "журнал мод" }
