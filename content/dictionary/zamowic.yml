# review
id: zamowic
format: 2
lemma: "zamówić"
rank: 1320
pos: verb
aspect: perf
pron: { cyr: "заму́виць" }
senses:
  - id: order
    ru: "заказать"
    examples:
      - pl: "Chcę zamówić pizzę."
        ru: "Я хочу заказать пиццу."
        source: { kind: translated, id: 8444362 }
      - pl: "Nie wiem, co zamówić."
        ru: "Я не знаю, что заказать."
        source: { kind: translated, id: 514700 }
      - pl: "Zamówię pizzę."
        ru: "Я закажу пиццу."
        source: { kind: tatoeba, id: 12760593 }
  - id: order-noun
    ru: "zamówienie — заказ"
    examples:
      - pl: "Oto twoje zamówienie."
        ru: "Вот твой заказ."
        source: { kind: translated, id: 8474135 }
      - pl: "Możemy złożyć zamówienie?"
        ru: "Можем сделать заказ?"
        source: { kind: translated, id: 3603004 }
      - pl: "Ciągle czekam na moje zamówienie."
        ru: "Я всё ещё жду свой заказ."
        source: { kind: translated, id: 526918 }
  - id: book
    ru: "заказать такси, вызвать"
    examples:
      - pl: "Mógłbyś mi zamówić taksówkę?"
        ru: "Ты мог бы заказать мне такси?"
        source: { kind: translated, id: 5513696 }
      - pl: "Zamówił dla mnie taksówkę."
        ru: "Он заказал мне такси."
        source: { kind: translated, id: 580587 }
      - pl: "Proszę, zamów tej pani taksówkę."
        ru: "Пожалуйста, закажи этой даме такси."
        source: { kind: translated, id: 525584 }
notes:
  - { kind: government, text: "zamówić coś «заказать что-то» — винительный падеж. Złożyć zamówienie «сделать заказ» — устойчивый оборот, буквально «сложить заказ»." }
  - { kind: usage, text: "В ресторане: Chcę zamówić «Я хочу заказать», Możemy złożyć zamówienie? «Можем сделать заказ?»." }
  - { kind: usage, text: "Вид совершенный; несовершенный — zamawiać. Существительное — zamówienie «заказ»." }
  - { kind: pronunciation, text: "ó читается как «у»: заму́виць. В существительном тоже: zamówienie звучит «замуве́не»." }
collocations:
  - { pl: "zamówić pizzę", ru: "заказать пиццу" }
  - { pl: "złożyć zamówienie", ru: "сделать заказ" }
  - { pl: "zamówić taksówkę", ru: "заказать такси" }
etymology: "Приставка za- и mówić «говорить»: буквально «проговорить, оговорить». Русское «заказать» от «казать, сказать» — та же логика речи."
memory: "zamówić — «заказать»: zamówić pizzę, zamówić taksówkę. Существительное zamówienie значит «заказ»: złożyć zamówienie «сделать заказ». Несовершенный вид — zamawiać, а ó звучит как «у»."
idioms:
  - { pl: "złożyć zamówienie", ru: "сделать заказ" }
  - { pl: "zamówić taksówkę", ru: "заказать такси" }
  - { pl: "na zamówienie", ru: "на заказ" }
