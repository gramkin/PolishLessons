notes:
  - { kind: false-friend, text: "Значение совпадает с русской «вдовой» полностью, и корень общий, поэтому ловушки лежат не в смысле. Первая — ударение: по-польски оно предпоследнее, то есть на первом слоге, WDO-wa, а по-русски на последнем, вдо-ВА. Вторая — мужское соответствие: WDOWIEC «вдовец» образовано суффиксом -IEC, не -ЕЦ, и склоняется как одушевлённое лицо. Третья — прилагательное WDOWI «вдовий», живое в книжном обороте WDOWI GROSZ, то есть «лепта вдовицы». Переносных значений у слова нет ни в одном из двух языков." }
  - { kind: government, text: "Главное практическое различие — управление. По-польски вдову называют через предлог PO с местным падежом: WDOWA PO OFICERZE, WDOWA PO MOIM BRACIE, буквально «вдова после офицера». Русский ставит родительный: «вдова офицера». Перевести по-русски дословно нельзя, и обратно тоже: WDOWA OFICERA звучит неправильно. Тот же предлог идёт и с выплатами: RENTA PO MĘŻU «пенсия за мужа», SPADEK PO OJCU «наследство от отца» — это общая польская модель для всего, что осталось от умершего. Со глаголом ZOSTAĆ употребляется творительный: ZOSTAŁA WDOWĄ, как и в русском «стала вдовой»." }
  - { kind: usage, text: "Десять форм, женский род. Родительный единственного и именительный множественного — одна форма WDOWY, и различает их только контекст: RENTA WDOWY «пенсия вдовы» против WDOWY DOSTAŁY «вдовы получили». Дательный и местный единственного — WDOWIE. Родительный множественного — WDÓW, с нулевым окончанием и удлинением гласной: O переходит в Ó. Это регулярное правило польского, и по нему же построены GŁÓW от GŁOWA, KRÓW от KROWA, DÓB от DOBA. Русский в этой форме даёт «вдов» без всякого изменения гласной, поэтому букву Ó приходится запоминать отдельно." }
  - { kind: pronunciation, text: "Читается «вдо́ва», два слога, ударение на первом — и это главное отличие на слух от русского. Начальное сочетание WD произносится слитно и звонко: «вд». В форме WDOWIE буквосочетание WIE даёт мягкое «ве»: «вдо́ве». В форме WDOWĄ последнее Ą звучит «он»: «вдо́вон». Самая неожиданная форма — WDÓW: буква Ó читается как «у», а конечное W оглушается в «ф», и выходит «вдуф», совсем не похожее на русское «вдов»." }
