etymology: "Из праславянского *vьdova, и это одно из самых старых слов индоевропейской семьи: тот же корень дал латинское VIDUA, английское WIDOW, немецкое WITWE и древнеиндийское VIDHAVĀ. Исходный корень *widh- означал «отделять, лишать», так что вдова — буквально «лишённая», и родственным оказывается латинское DIVIDERE «разделять». Русское «вдова» и польское WDOWA отвечают друг другу побуквенно, потому что оба сохранили старую основу без изменений. Разошлось только ударение: польский перенёс его на предпоследний слог по общему правилу, а русский оставил на окончании. Мужское WDOWIEC — позднее образование от женского, а не наоборот: сначала язык назвал вдову, и лишь потом вдовца."
memory: "Побуквенное совпадение с русской «вдовой» — слово древнее, того же корня, что латинское vidua и английское widow, от *widh- «лишать». Но ударение польское, на первом слоге: «вдо́ва», не «вдова́». Конструкция другая: wdowa po oficerze, предлог po с местным, где русский берёт родительный; та же модель в renta po mężu, spadek po ojcu. Родительный множественного wdów с удлинением o→ó, как głów, krów, dób, и читается «вдуф»."
