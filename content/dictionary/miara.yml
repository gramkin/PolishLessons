notes:
  - { kind: false-friend, text: "Слово прямо соответствует русской «мере», и корень тот же, что в «мерить» и «измерение». Расходятся обороты. Польское W MIARĘ значит и «по мере», и, в разговоре, «более или менее»: JAK CI POSZŁO? — W MIARĘ, то есть «так себе, сносно». Русский в этом месте скажет «нормально» или «ничего». А W DUŻEJ MIERZE это «в значительной мере», и тут языки совпадают полностью." }
  - { kind: usage, text: "Десять форм, женский род. Самое заметное здесь чередование R в RZ в дательном и местном падеже единственного числа: MIARA, но W MIERZE. Это то же, что в SIOSTRA — SIOSTRZE и в русском «сестра — сестре», только польский меняет ещё и согласный. Родительный множественного MIAR, без окончания. Множественное число употребляют, когда речь о системах мер: MIARY I WAGI." }
  - { kind: government, text: "По мере, в меру — устойчивое W MIARĘ, предлог W с винительным, а не с местным, и это надо запомнить отдельно. В значительной мере — W DUŻEJ MIERZE, уже с местным падежом. Сшитый на заказ — SZYTY NA MIARĘ, предлог NA с винительным. Снять мерку — WZIĄĆ или ZDJĄĆ MIARĘ, винительный без предлога. Без меры — BEZ MIARY, предлог BEZ с родительным." }
  - { kind: pronunciation, text: "Читается «мя́ра», два слога, ударение на первом. Сочетание MIA даёт «мя», в один приём, а не «миа». В форме MIERZE происходит сразу две перемены: MIE даёт «ме», а RZ даёт «ж», так что слово звучит «ме́же» и на слух почти не связано с исходным «мя́ра». Эту пару стоит произнести вслух несколько раз, иначе в тексте она не узнаётся." }
  - { kind: register, text: "Слово нейтральное и очень частое, прежде всего в готовых оборотах: W MIARĘ MOŻLIWOŚCI «по мере возможности», W DUŻEJ MIERZE «в значительной мере», SZYTY NA MIARĘ «сшитый на заказ», ZNAĆ MIARĘ «знать меру», PRZEBRAĆ MIARĘ «перейти всякую меру». Разговорное W MIARĘ в значении «сносно» слышно постоянно и в словарях отмечается редко, а в живой речи это один из самых частых ответов." }
collocations:
  - { pl: "w miarę możliwości", ru: "по мере возможности" }
  - { pl: "znać miarę", ru: "знать меру" }
  - { pl: "brać miarę", ru: "снимать мерку" }
family:
  - { pl: "mierzyć", ru: "мерить, измерять", relation: root }
  - { pl: "miarka", ru: "мерка, мерный стакан", relation: derived }
  - { pl: "pomiar", ru: "измерение", relation: derived }
etymology: "Праславянское слово, то же, что русская «мера», от корня со значением измерения, родственного латинскому METIRI и греческому METRON. Значение за тысячу лет не сдвинулось ни в одном из языков. Чередование R и RZ в MIARA — MIERZE чисто польское: восточнославянские языки на этом месте смягчают согласный, «мера — мере», а польский меняет его на другой звук. Из того же корня идут MIERZYĆ, POMIAR и ZMIERZCH, где меряется уже не длина, а угасающий свет."
memory: "Корень общий с русской «мерой», и значение то же. Запоминать надо обороты и одно чередование. Чередование: miara, но w mierze, где r переходит в rz и слово звучит «ме́же», совсем непохоже на «мя́ра». Обороты: w miarę с винительным это «по мере», а в разговоре просто «сносно», ответ на вопрос «как дела». W dużej mierze это «в значительной мере». Szyty na miarę это «сшитый на заказ»."
idioms:
  - { pl: "szyty na miarę", ru: "сшитый на заказ, сделанный точно по мерке" }
