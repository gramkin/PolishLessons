etymology: "Слово странствующее, и путь его извилист: через средневековое латинское CAPPA «накидка с капюшоном» и далее к старофранцузскому CHAPE, итальянскому CAPPA, откуда в разные языки попали и «шапка», и английское CAP, и немецкое KAPPE. Русская «шапка» пришла, по-видимому, через романское посредство с начальным «ш», а польская CZAPKA — через иное, с «ч». Поэтому слова родственны, но начальная согласная у них разная, и это не искажение, а след двух разных дорог. Тот же латинский корень CAPPA дал польское KAPELUSZ «шляпа» и KAPLICA «часовня», последнее через значение «место, где хранят плащ святого Мартина»."
memory: "Родня русской «шапке», но начало разошлось: польское cz- против русского ш-, потому что слово шло разными дорогами от латинского cappa. Кепка — czapka z daszkiem, отдельного слова нет. В дательном и местном k переходит в c: w czapce. В родительном множественного вставная гласная: czapek."
