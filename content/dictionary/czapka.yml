notes:
  - { kind: false-friend, text: "Полное соответствие русской «шапке», и слова действительно родственны, но сходство на слух неполное, и это стоит отметить. Польское CZAPKA начинается на «ча», а русская «шапка» на «ша»: начальная согласная разошлась, потому что слово странствовало через несколько языков и вернулось в каждый по-своему. Поэтому на письме узнаётся сразу, а на слух не всегда. Отдельно запомните, что кепка с козырьком — CZAPKA Z DASZKIEM, буквально «шапка с навесиком», а не KEPKA, слова такого в польском нет." }
  - { kind: pronunciation, text: "Читается «ча́пка», ударение на первом слоге из двух. Начальное CZ даёт твёрдое «ч». В дательном и местном падеже CZAPCE согласная K переходит в C: «ча́пце». Это то же чередование, что в CZWÓRKA и CZWÓRCE, ODZNAKA и ODZNACE, BÓJKA и BÓJCE. В родительном множественного CZAPEK появляется вставная гласная E между P и K, как в DESKA и DESEK, BÓJKA и BÓJEK." }
  - { kind: usage, text: "Виды головных убора различаются определением: CZAPKA ZIMOWA «зимняя шапка», CZAPKA Z DASZKIEM «кепка», CZAPKA KĄPIELOWA «плавательная шапочка», CZAPKA KUCHARSKA «колпак повара». Отдельно стоит шляпа, KAPELUSZ, и это другое слово. Переносное употребление частое и для русского привычное: CZAPKA ŚNIEGU, CZAPKA LODOWA «ледяная шапка», CZAPKA CHMUR nad górą. Уменьшительное CZAPECZKA употребляется о детских шапочках." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: WŁÓŻ CZAPKĘ. Надеть на себя — глагол WŁOŻYĆ или ZAŁOŻYĆ с винительным, а быть в шапке — W с местным: W CZAPCE. Снять — ZDJĄĆ с винительным. Назначение вводится прилагательным, а не предлогом: CZAPKA ZIMOWA, не CZAPKA DO ZIMY. При отрицании винительный уходит в родительный: NIE WŁOŻYŁ CZAPKI." }
