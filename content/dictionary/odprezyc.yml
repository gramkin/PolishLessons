# review
id: odprezyc
format: 2
lemma: "odprężyć"
rank: 3977
pos: verb
pron: { cyr: "одпрэ́нжыць" }
senses:
  - id: unwind
    ru: "с SIĘ — расслабиться, снять напряжение"
    examples:
      - pl: "Muszę się odprężyć po pracy."
        ru: "Мне нужно расслабиться после работы."
        source: { kind: authored }
      - pl: "Odprężyła się przy muzyce."
        ru: "Она расслабилась под музыку."
        source: { kind: authored }
      - pl: "Odpręż się, wszystko będzie dobrze."
        ru: "Расслабься, всё будет хорошо."
        source: { kind: authored }
  - id: ease
    ru: "расслабить (мышцы); разрядить (обстановку)"
    examples:
      - pl: "Masaż odprężył mu plecy."
        ru: "Массаж расслабил ему спину."
        source: { kind: authored }
      - pl: "Żart odprężył atmosferę."
        ru: "Шутка разрядила обстановку."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODPRĘŻYĆ SIĘ — «расслабиться», а не «отпрячь»: отпрячь лошадь — WYPRZĄC. Синонимы — ZRELAKSOWAĆ SIĘ, ODPOCZĄĆ. ODPRĘŻENIE — «расслабление», а в политике — «разрядка»." }
  - { kind: usage, text: "Пятьдесят три формы, включая ODPRĘŻENI — «расслабленные». Чаще всего с SIĘ. Будущее: ODPRĘŻĘ, ODPRĘŻYSZ, повелительное ODPRĘŻ. Несовершенный вид — ODPRĘŻAĆ." }
  - { kind: government, text: "С SIĘ — при чём и где: PRZY MUZYCE, W WANNIE; чем — творительный: ODPRĘŻYĆ SIĘ KĄPIELĄ. Кого или что — винительный: ODPRĘŻYĆ MIĘŚNIE, ATMOSFERĘ." }
  - { kind: pronunciation, text: "Читается «одпрэ́нжыць»: Ę перед Ż — «эн», ŻY — «жы», ударение на предпоследнем слоге. ODPRĘŻĘ — «одпрэ́нжэ»." }
  - { kind: register, text: "Нейтральное слово, чуть книжнее, чем ZRELAKSOWAĆ SIĘ. ODPRĘŻYĆ ATMOSFERĘ — «разрядить обстановку»." }
collocations:
  - { pl: "odprężyć się po pracy", ru: "расслабиться после работы" }
  - { pl: "odprężyć atmosferę", ru: "разрядить обстановку" }
  - { pl: "odprężyć mięśnie", ru: "расслабить мышцы" }
family:
  - { pl: "zrelaksować", ru: "расслабить; с SIĘ — расслабиться", relation: derived, id: zrelaksowac }
  - { pl: "odprężenie", ru: "расслабление; разрядка", relation: derived }
  - { pl: "odprężać", ru: "расслаблять", relation: aspect }
etymology: "Приставка OD- «от-» плюс PRĘŻYĆ «напрягать, натягивать», праславянское *pręgъ. Буквально — «снять натяжение». Русское «пружина», «напрячь» — того же корня."
memory: "Odprężyć się — расслабиться: odprężyła się przy muzyce. Odprężyć atmosferę — разрядить обстановку. Читается «одпрэ́нжыць»."
