# review
id: apetyt
format: 2
lemma: "apetyt"
rank: 4645
pos: noun
pron: { cyr: "апэ́тыт" }
senses:
  - id: appetite
    ru: "аппетит"
    examples:
      - pl: "Dziecko nie ma dziś apetytu."
        ru: "У ребёнка сегодня нет аппетита."
        source: { kind: authored }
      - pl: "Po spacerze dopisał mi apetyt."
        ru: "После прогулки у меня разыгрался аппетит."
        source: { kind: authored }
      - pl: "Ma wilczy apetyt."
        ru: "У него волчий аппетит."
        source: { kind: authored }
  - id: hunger-for
    ru: "жажда, желание чего-то (перен.)"
    examples:
      - pl: "Firma ma apetyt na nowe rynki."
        ru: "У фирмы аппетит на новые рынки."
        source: { kind: authored }
      - pl: "Jego apetyt na władzę rósł z każdym rokiem."
        ru: "Его жажда власти росла с каждым годом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово то же, что русское «аппетит», но пишется с одним P. Разница в оборотах. «Аппетит хороший» — APETYT DOPISUJE, буквально «аппетит не подводит». «Приятного аппетита» по-польски не APETYTU, а SMACZNEGO. А APETYT NA COŚ — жадное желание чего-то: APETYT NA WŁADZĘ." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже T переходит в CI: O APETYCIE. Множественное APETYTY говорит о желаниях и амбициях: ROSNĄCE APETYTY POLITYKÓW." }
  - { kind: government, text: "Аппетит на что-то — APETYT NA COŚ, NA с винительным. Без аппетита — BEZ APETYTU, родительный. Потерять аппетит — STRACIĆ APETYT, винительный." }
  - { kind: pronunciation, text: "Читается «апэ́тыт», три слога, ударение на втором. E звучит твёрдо, «э», а Y — «ы». В местном падеже APETYCIE ударение сдвигается: «апэты́це»." }
collocations:
  - { pl: "brak apetytu", ru: "отсутствие аппетита" }
  - { pl: "stracić apetyt", ru: "потерять аппетит" }
  - { pl: "apetyt dopisuje", ru: "аппетит хороший" }
family:
  - { pl: "apetyczny", ru: "аппетитный", relation: derived }
  - { pl: "apetycznie", ru: "аппетитно", relation: derived }
  - { pl: "apetycik", ru: "аппетит (ласк.)", relation: derived }
etymology: "Из латинского слова со значением «стремление», через французский. Русский и польский взяли одно слово, но польский упростил двойное P, как обычно поступает с латинскими удвоениями."
memory: "Apetyt — «аппетит», с одним p. Apetyt dopisuje — аппетит хороший; приятного аппетита — smacznego. Apetyt rośnie w miarę jedzenia — аппетит приходит во время еды. Wilczy apetyt — волчий аппетит."
idioms:
  - { pl: "apetyt rośnie w miarę jedzenia", ru: "аппетит приходит во время еды" }
  - { pl: "wilczy apetyt", ru: "волчий аппетит" }
  - { pl: "ostrzyć sobie apetyt na coś", ru: "точить зубы на что-то" }
