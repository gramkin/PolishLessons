# review
id: skoncentrowac
format: 2
lemma: "skoncentrować"
rank: 3938
pos: verb
pron: { cyr: "сконцентро́ваць" }
senses:
  - id: focus
    ru: "сосредоточиться (skoncentrować się)"
    examples:
      - pl: "Nie mogę się skoncentrować."
        ru: "Я не могу сосредоточиться."
        source: { kind: authored }
      - pl: "Skoncentruj się na zadaniu."
        ru: "Сосредоточься на задаче."
        source: { kind: authored }
      - pl: "Skoncentrowała się na nauce."
        ru: "Она сосредоточилась на учёбе."
        source: { kind: authored }
  - id: concentrate
    ru: "сосредоточить, сконцентрировать (силы, внимание, войска)"
    examples:
      - pl: "Armia skoncentrowała wojska na granicy."
        ru: "Армия сосредоточила войска на границе."
        source: { kind: authored }
      - pl: "Firma skoncentruje działalność na eksporcie."
        ru: "Фирма сосредоточит деятельность на экспорте."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SKONCENTROWAĆ SIĘ — обычное слово для «сосредоточиться», без книжного оттенка русского «сконцентрироваться». NIE MOGĘ SIĘ SKONCENTROWAĆ — «не могу собраться». Синоним — SKUPIĆ SIĘ, ещё частотнее. Без SIĘ — «сосредоточить что-то»: SKONCENTROWAĆ UWAGĘ, SIŁY." }
  - { kind: usage, text: "Пятьдесят три формы: глагол переходный, поэтому есть страдательное SKONCENTROWANY и деепричастие SKONCENTROWAWSZY. SKONCENTROWANY — ещё и прилагательное «сосредоточенный» о человеке и «концентрированный» о соке: SOK SKONCENTROWANY. Видовой партнёр — KONCENTROWAĆ." }
  - { kind: government, text: "На чём — NA с местным: SKONCENTROWAĆ SIĘ NA PRACY, NA CELU. Русскому предложному падежу здесь отвечает польский местный: NA ZADANIU, NA EGZAMINIE. Где сосредоточить — W или NA: SKONCENTROWAĆ WOJSKA W MIEŚCIE, NA GRANICY." }
  - { kind: pronunciation, text: "Читается «сконцентро́ваць», пять слогов, ударение на предпоследнем. K перед O твёрдое, C — «ц», N перед C — «н». Будущее SKONCENTRUJĘ — «сконцентру́е»." }
  - { kind: register, text: "Нейтральный глагол школы, спорта и работы. SKUP SIĘ! и SKONCENTRUJ SIĘ! — частые окрики учителей и тренеров. В экономике и армии — книжное «сосредоточить ресурсы, войска»." }
collocations:
  - { pl: "skoncentrować się na pracy", ru: "сосредоточиться на работе" }
  - { pl: "skoncentrować uwagę", ru: "сосредоточить внимание" }
  - { pl: "sok skoncentrowany", ru: "концентрированный сок" }
family:
  - { pl: "koncentrowac", ru: "концентрировать", relation: aspect }
  - { pl: "koncentracja", ru: "концентрация, сосредоточенность", relation: root }
  - { pl: "skupić", ru: "сосредоточить, собрать", relation: root, id: skupic }
etymology: "Приставка S- плюс KONCENTROWAĆ, из латинского CON- «вместе» и CENTRUM «центр»: «собрать к центру». То же слово, что русское «концентрировать», «сконцентрироваться»."
memory: "Skoncentrować się — сосредоточиться: nie mogę się skoncentrować. Na + местный: na pracy, na zadaniu. Skoncentrowany — сосредоточенный; sok skoncentrowany. Читается «сконцентро́ваць»."
idioms:
  - { pl: "skoncentrować się na sobie", ru: "сосредоточиться на себе" }
