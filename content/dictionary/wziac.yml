# review
id: wziac
format: 2
lemma: "wziąć"
rank: 144
pos: verb
aspect: perf
pron: { cyr: "вжёнць" }
senses:
  - id: take
    ru: "взять, брать (в руки, с собой)"
    examples:
      - pl: "Ja to wezmę."
        ru: "Я возьму это."
        source: { kind: tatoeba, id: 2226158 }
      - pl: "Weź to ze sobą."
        ru: "Возьми это с собой."
        source: { kind: tatoeba, id: 5969996 }
      - pl: "Wezmę tę parasolkę."
        ru: "Я возьму этот зонтик."
        source: { kind: tatoeba, id: 560182 }
  - id: take-action
    ru: "взять, принять (участие, во внимание, душ)"
    note: "Как и в русском, глагол входит во множество устойчивых сочетаний."
    examples:
      - pl: "Wziąłem prysznic."
        ru: "Я принял душ."
        source: { kind: tatoeba, id: 611568 }
      - pl: "Weźmy taksówkę."
        ru: "Давай возьмём такси."
        source: { kind: tatoeba, id: 888195 }
      - pl: "Weź to pod uwagę."
        ru: "Прими это во внимание."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид к brać: Biorę leki codziennie «Принимаю лекарства каждый день» — Wziąłem lek «Я принял лекарство»." }
  - { kind: usage, text: "Формы настоящего-будущего образуются от другой основы: wezmę, weźmiesz, weźmie — как русское «возьму, возьмёшь»." }
  - { kind: usage, text: "wziąć ślub значит «пожениться», о паре и о каждом из супругов: Wzięli ślub w maju." }
collocations:
  - { pl: "wziąć udział", ru: "принять участие" }
  - { pl: "wziąć pod uwagę", ru: "принять во внимание" }
  - { pl: "wziąć ślub", ru: "пожениться" }
  - { pl: "wziąć prysznic", ru: "принять душ" }
etymology: "Приставка wz- + jąć (праславянское *vъzęti); тот же корень, что в русском «взять» и «возьму»."
memory: "Основы разные, как в русском: wezmę «возьму» — wziąłem «я взял». Запомните связки wziąć udział «принять участие», wziąć pod uwagę «принять во внимание» и wziąć ślub «пожениться»."
idioms:
  - { pl: "wziąć nogi za pas", ru: "дать дёру" }
  - { pl: "wziąć pod swoje skrzydła", ru: "взять под крыло" }
  - { pl: "wziąć na swoje barki", ru: "взвалить на свои плечи" }
