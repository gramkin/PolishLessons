# review
id: ile
format: 2
lemma: "ile"
rank: 209
pos: num
pron: { cyr: "и́ле" }
senses:
  - id: how-many
    ru: "сколько (+ родительный падеж)"
    examples:
      - pl: "Ile jabłek?"
        ru: "Сколько яблок?"
        source: { kind: tatoeba, id: 636663 }
      - pl: "Ile masz dzieci?"
        ru: "Сколько у тебя детей?"
        source: { kind: tatoeba, id: 6305736 }
      - pl: "Ile masz samochodów?"
        ru: "Сколько у тебя машин?"
        source: { kind: tatoeba, id: 588877 }
  - id: how-much
    ru: "сколько (о цене, весе, количестве)"
    examples:
      - pl: "Ile kosztuje pokój?"
        ru: "Сколько стоит номер?"
        source: { kind: tatoeba, id: 701578 }
      - pl: "Ile to waży?"
        ru: "Сколько это весит?"
        source: { kind: tatoeba, id: 3743745 }
      - pl: "Ile zostało kanapek?"
        ru: "Сколько осталось бутербродов?"
        source: { kind: tatoeba, id: 349153 }
notes:
  - { kind: government, text: "ile требует родительного падежа: ile jabłek, ile czasu — как русское «сколько»." }
  - { kind: usage, text: "О мужских лицах употребляется форма ilu: ilu ludzi, ilu studentów." }
  - { kind: usage, text: "o ile значит «насколько»: O ile wiem «Насколько я знаю»." }
collocations:
  - { pl: "ile kosztuje?", ru: "сколько стоит?" }
  - { pl: "ile razy", ru: "сколько раз" }
  - { pl: "o ile", ru: "насколько" }
  - { pl: "ile czasu", ru: "сколько времени" }
etymology: "Праславянское *jele; тот же ряд, что tyle «столько» и wiele «много»."
memory: "ile + родительный, как русское «сколько». О мужчинах — ilu: ilu ludzi. И запомните o ile «насколько»."
idioms:
  - { pl: "o ile", ru: "насколько" }
  - { pl: "ile razy", ru: "сколько раз" }
  - { pl: "ile wlezie", ru: "сколько влезет" }
formExamplesSkip:
  - { form: "ilo", reason: "форма из морфологического словаря; в языке употребляются ile, ilu и iloma" }
