# review
id: dalej
format: 2
lemma: "dalej"
rank: 364
pos: adv
pron: { cyr: "да́лей" }
senses:
  - id: farther
    ru: "дальше (сравнительная степень от daleko)"
    examples:
      - pl: "Szkoła jest dalej niż dworzec."
        ru: "Школа находится дальше, чем вокзал."
        source: { kind: tatoeba, id: 692628 }
      - pl: "I co dalej?"
        ru: "И что дальше?"
        source: { kind: tatoeba, id: 6320380 }
      - pl: "Nie wiem, co będzie dalej."
        ru: "Я не знаю, что будет дальше."
        source: { kind: tatoeba, id: 6320388 }
  - id: go-on
    ru: "дальше, продолжая; No dalej! — Ну же!"
    examples:
      - pl: "Tom mówił dalej."
        ru: "Том продолжал говорить."
        source: { kind: tatoeba, id: 5946763 }
      - pl: "Dalej?"
        ru: "Продолжить?"
        source: { kind: tatoeba, id: 13782811 }
      - pl: "No dalej, Tom! To proste zadanie arytmetyczne!"
        ru: "Ну же, Том! Это же простая арифметическая задача!"
        source: { kind: tatoeba, id: 13783075 }
notes:
  - { kind: usage, text: "dalej — сравнительная степень от daleko «далеко»: daleko — dalej — najdalej." }
  - { kind: usage, text: "mówić dalej — «продолжать говорить», iść dalej — «идти дальше»; i tak dalej (сокращённо itd.) — «и так далее»." }
  - { kind: usage, text: "No dalej! — подбадривание «Ну же!, Давай!», а Ani kroku dalej! — «Ни шагу дальше!»." }
collocations:
  - { pl: "i tak dalej", ru: "и так далее" }
  - { pl: "mówić dalej", ru: "продолжать говорить" }
  - { pl: "co dalej?", ru: "что дальше?" }
  - { pl: "no dalej!", ru: "ну же!" }
etymology: "Сравнительная степень от daleko «далеко», от daleki «далёкий»; ср. русское «дальше»."
memory: "dalej — «дальше», сравнительная степень от daleko. Mówić dalej значит «продолжать говорить», а No dalej! — «Ну же!»."
