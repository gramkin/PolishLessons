# review
id: leczyc
format: 2
lemma: "leczyć"
rank: 579
pos: verb
aspect: imperf
pron: { cyr: "ле́чыць" }
senses:
  - id: treat
    ru: "лечить (кого-л.)"
    note: "leczyć kogoś — винительный: lekarz leczy pacjenta."
    examples:
      - pl: "Tego pacjenta leczył doktor Bell ."
        ru: "Этого пациента лечил доктор Белл."
        source: { kind: translated, id: 1896006 }
      - pl: "Wielu ludzi wierzy, że akupunktura może leczyć choroby."
        ru: "Многие верят, что иглоукалывание может лечить болезни."
        source: { kind: translated, id: 3942979 }
      - pl: "Leczono ich odmrożenia."
        ru: "Им лечили обморожения."
        source: { kind: translated, id: 4916161 }
  - id: heal
    ru: "исцелять: Czas leczy rany «Время лечит раны»"
    examples:
      - pl: "Czas leczy rany."
        ru: "Время всё лечит."
        source: { kind: tatoeba, id: 349383 }
      - pl: "Czas leczy wszystkie rany."
        ru: "Время лечит все раны."
        source: { kind: translated, id: 3207161 }
      - pl: "Czas leczy złamane serca."
        ru: "Время лечит разбитые сердца."
        source: { kind: translated, id: 10466826 }
  - id: be-treated
    ru: "leczyć się na coś — лечиться от чего-л."
    note: "Русское «от» отвечает польскому na с винительным."
    examples:
      - pl: "Czy kiedykolwiek leczyłeś się na gruźlicę?"
        ru: "Ты когда-нибудь лечился от туберкулёза?"
        source: { kind: translated, id: 12040896 }
      - pl: "Czy kiedykolwiek leczyliście się na gruźlicę?"
        ru: "Вы когда-нибудь лечились от туберкулёза?"
        source: { kind: translated, id: 12040898 }
      - pl: "Z zaziębienia leczyłem się tydzień."
        ru: "Я неделю лечился от простуды."
        source: { kind: translated, id: 718988 }
  - id: treatment
    ru: "leczenie — лечение"
    note: "Lepiej zapobiegać niż leczyć «Лучше предупреждать, чем лечить»."
    examples:
      - pl: "Leczenie przeziębienia trwało tydzień."
        ru: "На лечение простуды ушла неделя."
        source: { kind: tatoeba, id: 1459941 }
      - pl: "Potrzebujesz leczenia."
        ru: "Тебе нужно лечение."
        source: { kind: translated, id: 2519099 }
      - pl: "Zapobieganie jest o wiele bardziej efektywne niż leczenie."
        ru: "Профилактика гораздо эффективнее лечения."
        source: { kind: translated, id: 4769027 }
notes:
  - { kind: false-friend, text: "Форма lecz — омоним, и это главная ловушка. Это и повелительное «лечи!», и очень частый союз «но, а»: Nie jestem lekarzem, lecz nauczycielem «Я не врач, а учитель». В живом тексте вам почти всегда попадётся именно союз, а не глагол." }
  - { kind: government, text: "«Лечить кого-то» — винительный: lekarz leczy pacjenta. А вот «лечиться ОТ чего-то» по-польски leczyć się NA coś, с предлогом na и винительным: leczyć się na gruźlicę «лечиться от туберкулёза». Там, где русский берёт «от», поляк ставит na." }
  - { kind: usage, text: "Совершенный вид — wyleczyć «вылечить»: wyleczył się z grypy." }
  - { kind: usage, text: "Существительное — leczenie «лечение»: potrzebujesz leczenia «тебе нужно лечение», w trakcie leczenia «в ходе лечения»." }
  - { kind: usage, text: "Пословица, которую стоит знать целиком: Lepiej zapobiegać niż leczyć «Лучше предупреждать, чем лечить»." }
collocations:
  - { pl: "leczyć się na coś", ru: "лечиться от чего-либо" }
  - { pl: "Czas leczy rany", ru: "Время лечит раны" }
  - { pl: "potrzebować leczenia", ru: "нуждаться в лечении" }
  - { pl: "wyleczyć", ru: "вылечить" }
family:
  - { pl: "lek", ru: "лекарство", relation: root }
  - { pl: "lekarz", ru: "врач", relation: derived }
  - { pl: "leczenie", ru: "лечение", relation: derived }
  - { pl: "wyleczyć", ru: "вылечить", relation: aspect }
etymology: "От lek «лекарство», праславянское *lěkъ — тот же корень, что в русских «лекарство», «лекарь» и «лечить»."
memory: "leczyć — «лечить», и корень тот же: lek «лекарство». Два места, где легко ошибиться. Первое — управление: «лечиться ОТ чего-то» по-польски будет leczyć się NA coś, с предлогом na и винительным — leczyć się na gruźlicę. Второе — омоним: форма lecz это не только «лечи!», но и очень частый союз «но, а», и в тексте вам почти всегда попадётся именно он: Nie jestem lekarzem, lecz nauczycielem «Я не врач, а учитель»."
idioms:
  - { pl: "Czas leczy rany", ru: "Время лечит раны" }
  - { pl: "Lepiej zapobiegać niż leczyć", ru: "Лучше предупреждать, чем лечить" }
  - { pl: "leczyć się na coś", ru: "лечиться от чего-либо" }
