        source: { kind: authored }
  - id: planned
    ru: "zaplanowany — запланированный, продуманный"
    examples:
      - pl: "Zaplanowana wizyta przesunęła się o tydzień."
        ru: "Запланированный визит сдвинулся на неделю."
        source: { kind: authored }
      - pl: "To była z góry zaplanowana prowokacja."
        ru: "Это была заранее спланированная провокация."
        source: { kind: authored }
  - id: planning
    ru: "zaplanowanie — планирование (как действие)"
    examples:
      - pl: "Zaplanowanie trasy zajęło cały wieczór."
        ru: "Планирование маршрута заняло весь вечер."
        source: { kind: authored }
      - pl: "Po zaplanowaniu budżetu reszta poszła łatwo."
        ru: "После планирования бюджета остальное пошло легко."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушек нет: plan, planować, zaplanować пришли в оба языка одним путём, из латыни через французский и немецкий, и совпадают по форме и смыслу. Единственное, на что стоит обратить внимание, — ударение: по-польски оно всегда на предпоследнем слоге, zapla-NO-wać, а в формах настоящего времени смещается: zapla-NU-je." }
  - { kind: pronunciation, text: "Настоящее-будущее по правилу -ować: zaplanuję, zaplanujesz, zaplanuje — тот же ряд, что pracuję, organizuję, oferuję. Это одно из самых надёжных правил польского спряжения: увидев -ować, подставляйте -uj-." }
  - { kind: government, text: "Планируют ЧТО — винительный: zaplanować wyjazd, remont, budżet. НА когда — na с винительным: zaplanować coś na sierpień, na przyszły tydzień. Обе модели совпадают с русскими, так что строить фразу можно по родному образцу." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — planować. Причастие zaplanowany живёт самостоятельно: zaplanowane dziecko «запланированный ребёнок», z góry zaplanowany «заранее спланированный». Отсюда же planowanie «планирование» и planowo «планомерно, по плану»." }
collocations:
  - { pl: "zaplanować wyjazd", ru: "запланировать поездку" }
  - { pl: "z góry zaplanowany", ru: "заранее спланированный" }
  - { pl: "zaplanować budżet", ru: "спланировать бюджет" }
family:
  - { pl: "plan", ru: "план", relation: root, id: plan }
  - { pl: "planować", ru: "планировать", relation: aspect, id: planowac }
  - { pl: "planowanie", ru: "планирование", relation: derived }
etymology: "Приставка za- плюс planować, от латинского planum через французский plan и немецкий. Русское «планировать» — то же заимствование тем же путём, поэтому слова совпадают полностью. Отсюда plan, planowanie, planowy и bezplanowo «бессистемно»."
memory: "zaplanować — «запланировать», слово общее с русским, расхождений нет. Помните только спряжение по правилу -ować: zaplanuję, zaplanujesz. И оборот z góry zaplanowany — «заранее спланированный»."
idioms:
