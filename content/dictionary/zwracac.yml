        source: { kind: authored }
  - id: attention
    ru: "обращать (внимание) — zwracać uwagę"
    examples:
      - pl: "Nikt nie zwracał na nas uwagi."
        ru: "Никто не обращал на нас внимания."
        source: { kind: authored }
      - pl: "Zwracaj uwagę na pierwsze zdanie."
        ru: "Обращай внимание на первую фразу."
        source: { kind: authored }
  - id: address
    ru: "обращаться (zwracać się do kogoś)"
    examples:
      - pl: "Zwracał się do mnie po imieniu."
        ru: "Он обращался ко мне по имени."
        source: { kind: authored }
      - pl: "Zwracają się do urzędu po pomoc."
        ru: "Они обращаются в учреждение за помощью."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ВИДЕН СКВОЗЬ ПОЛНОГЛАСИЕ. Польское wrot-/wrac- отвечает русскому «ворот-»: wrota — «ворота», wracać — «возвращаться», zwrot — «возврат, оборот». Там, где русский вставляет «оро», польский обходится «ро» — тот же закон, что в głowa/«голова» и złoto/«золото». Значит zwracać разбирается как «воз-вращать», и догадаться о смысле можно без словаря." }
  - { kind: government, text: "ДВА ОБОРОТА СОВПАДАЮТ, ТРЕТИЙ НЕТ. Возвращают ЧТО КОМУ — винительный плюс дательный: zwracać komuś pieniądze, как по-русски. Обращают внимание НА что — na с винительным: zwracać uwagę NA coś, тоже как по-русски. А вот обращаются К кому по-польски через DO с РОДИТЕЛЬНЫМ: zwracać się DO dyrektora, где русский берёт дательный «к директору». Эту третью модель и нужно запомнить отдельно." }
  - { kind: usage, text: "Вид несовершенный, совершенная пара — zwrócić: zwracał książki co tydzień «он возвращал книги каждую неделю», но zwrócił ją wczoraj «вернул её вчера». Обратите внимание: в устойчивом обороте чаще слышно совершенное zwróć uwagę «обрати внимание», а несовершенное zwracaj uwagę значит «обращай внимание постоянно»." }
  - { kind: register, text: "Zwracać się do kogoś — это и бытовое «обращаться к кому-то», и канцелярское «подавать обращение»: zwracam się z prośbą o… «обращаюсь с просьбой о…» — стандартное начало польского заявления, звучащее так же официально, как русское." }
collocations:
  - { pl: "zwracać uwagę", ru: "обращать внимание" }
  - { pl: "zwracać się do kogoś", ru: "обращаться к кому-л." }
  - { pl: "zwracać pieniądze", ru: "возвращать деньги" }
family:
  - { pl: "wracać", ru: "возвращаться", relation: root, id: wracac }
  - { pl: "zwrócić", ru: "вернуть; обратить", relation: aspect, id: zwrocic }
  - { pl: "zwrot", ru: "возврат; оборот", relation: derived }
etymology: "Приставка z- плюс wracać «возвращаться», от корня *vort-, того же, что в русских «ворота», «воротить», «возвращать», «вращать». Русский развил здесь полногласие «оро», польский оставил «ro»: wrota при «воротах», wracać при «воротить». Отсюда же zwrot «возврат, оборот» и odwrotnie «наоборот»."
memory: "zwracać — «возвращать», а с uwagę — «обращать внимание», в точности как по-русски (uwagę NA coś). Корень тот же, что в «воротах»: польское wrot- равно русскому «ворот-». Запомните одно расхождение: zwracać się DO kogoś, родительный, а не дательный."
idioms:
  - { pl: "zwracać uwagę na coś", ru: "обращать внимание на что-л." }
  - { pl: "zwracam się z prośbą", ru: "обращаюсь с просьбой" }
