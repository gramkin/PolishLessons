etymology: "От праславянского *ǫtr- «внутренность», с приставкой WN- из W плюс носовой. Тот же корень дал русские «внутри», «внутренний», «утроба», «нутро» и старое «ятро». Польский сохранил носовой в виде Ę, поэтому корень в слове узнаётся не сразу: WNĘTRZE против «внутри» — одно и то же, только носовое там, где русский даёт сочетание «ну». Суффикс -E образует среднее отглагольное или отадъективное имя места, как в POLE и MORZE. Из того же гнезда идут WEWNĄTRZ «внутри», WEWNĘTRZNY «внутренний» и WNĘTRZNOŚCI «внутренности»; последнее слово показывает, что исходное значение было вполне телесным, и лишь потом распространилось на помещения и предметы."
memory: "Под носовым ę спрятан корень русского «внутри»: wnętrze — «внутренняя часть», wewnątrz — «внутри», wewnętrzny — «внутренний». Переводить по контексту: wnętrze samochodu — «салон», architekt wnętrz — «дизайнер интерьеров». Родительный множественного нулевой: wnętrz, четыре согласных на конце. И предлог: we wnętrzu, не «w wnętrzu», как we wtorek — W становится WE перед группой согласных."
