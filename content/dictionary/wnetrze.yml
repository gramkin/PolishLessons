notes:
  - { kind: false-friend, text: "Корень тот же, что в русских «внутри», «утроба», «нутро»: праславянское *ǫtr- «внутренность». Польский построил от него WEWNĄTRZ «внутри» и WNĘTRZE «внутренняя часть», и значения прозрачны, если узнать корень под носовым Ę. Но перевод зависит от контекста: WNĘTRZE KOŚCIOŁA это «внутреннее помещение костёла», WNĘTRZE SAMOCHODU — «салон автомобиля», а ARCHITEKT WNĘTRZ — «дизайнер интерьеров». Отдельно стоит WNĘTRZNOŚCI «внутренности», слово анатомическое. Русское «внутренность» в единственном числе звучит неловко, поэтому при переводе чаще нужен «интерьер» или описание." }
  - { kind: usage, text: "Среднее на -E, и в родительном множественного окончание нулевое: WNĘTRZ. Форма выглядит трудно, потому что на конце остаётся группа из четырёх согласных, NTRZ, но произносится она слитно и без вставных гласных. Сравните с двумя соседями того же типа: OBLICZE имеет два родительных множественного, OBLICZ и OBLICZY, а OSTRZE — только OSTRZY, с окончанием -Y. Второе: предлог W перед этим словом превращается в WE, потому что слово само начинается с группы согласных — WE WNĘTRZU, а не «w wnętrzu». То же правило даёт WE WTOREK и WE FRANCJI." }
  - { kind: government, text: "Средний род. Чего внутренность — родительный: WNĘTRZE DOMU, WNĘTRZE PUDEŁKA. «Внутри» о положении — предлог WE с местным: WE WNĘTRZU. «Внутрь» о движении — DO с родительным: DO WNĘTRZA. Частотные сочетания: ARCHITEKT WNĘTRZ «дизайнер интерьеров», PROJEKT WNĘTRZA «проект интерьера», URZĄDZIĆ WNĘTRZE «обставить интерьер». Наречие того же корня — WEWNĄTRZ «внутри», и оно употребляется без существительного: ZOSTAŃ WEWNĄTRZ «останься внутри»." }
  - { kind: pronunciation, text: "Читается «внэ́нтше», два слога, ударение на первом. Начальное WN произносится слитно, без гласной между в и н. Носовое Ę перед T даёт «эн». Сочетание TRZ читается «тш», потому что RZ после глухого T оглушается. В местном падеже WNĘTRZU слышно «внэ́нтшу». В родительном множественного WNĘTRZ на конце остаётся «нтш», и слово звучит как один слог с длинным согласным хвостом." }
