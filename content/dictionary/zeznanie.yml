# review
id: zeznanie
format: 2
lemma: "zeznanie"
rank: 1906
pos: noun
pron: { cyr: "зэзна́не" }
senses:
  - id: testimony
    ru: "показание, свидетельство"
    examples:
      - pl: "Złożył policji fałszywe zeznania."
        ru: "Он дал полиции ложные показания."
        source: { kind: translated, id: 575389 }
      - pl: "Świadkowie muszą składać zeznania pod przysięgą."
        ru: "Свидетели должны давать показания под присягой."
        source: { kind: translated, id: 7334691 }
      - pl: "Nasz jedyny świadek odmawia zeznań."
        ru: "Наш единственный свидетель отказывается от показаний."
        source: { kind: translated, id: 998711 }
  - id: sign
    ru: "подписать показания"
    examples:
      - pl: "Podpisały zeznania."
        ru: "Они подписали показания."
        source: { kind: translated, id: 6534241 }
      - pl: "Podpisałaś zeznania."
        ru: "Ты подписала показания."
        source: { kind: translated, id: 4258112 }
notes:
  - { kind: usage, text: "Слово живёт почти всегда во множественном числе: składać zeznania «давать показания», podpisać zeznania «подписать показания». Базовая форма zeznanie в корпусе не встречается ни разу." }
  - { kind: usage, text: "Юридический набор: zeznawać «давать показания», świadek «свидетель», pod przysięgą «под присягой»." }
  - { kind: usage, text: "Второе значение — налоговая декларация: zeznanie podatkowe." }
  - { kind: usage, text: "Образовано от zeznać «дать показания» суффиксом -anie; корень — znać «знать»." }
collocations:
  - { pl: "składać zeznania", ru: "давать показания" }
  - { pl: "fałszywe zeznania", ru: "ложные показания" }
  - { pl: "zeznanie podatkowe", ru: "налоговая декларация" }
etymology: "От zeznać «дать показания» (ze- + znać «знать») — буквально «сообщить то, что знаешь». Русское «показание» идёт от «показать»: метафора другая, смысл тот же."
memory: "zeznanie = «показание» в суде, и живёт оно почти всегда во множественном: składać zeznania «давать показания». Корень — znać «знать». Второе значение — zeznanie podatkowe «налоговая декларация»."
idioms:
  - { pl: "składać zeznania", ru: "давать показания" }
  - { pl: "fałszywe zeznania", ru: "ложные показания" }
  - { pl: "zeznanie podatkowe", ru: "налоговая декларация" }
