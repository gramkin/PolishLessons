notes:
  - { kind: false-friend, text: "КОРЕНЬ ЗНАКОМ, НО РУССКОЕ СЛОВО ДРУГОЕ ПО ОБЪЁМУ. Tylny от tył «зад, задняя сторона» — того же корня, что русский «ТЫЛ». Но русское «тыльный» звучит специально, почти по-военному, а польское tylny совершенно обиходно: tylne siedzenie «заднее сиденье», tylne drzwi «задняя дверь», tylne koło «заднее колесо». Переводить его надо словом «задний»." }
  - { kind: usage, text: "Антоним — przedni «передний». Оба относительные, без степеней сравнения, отсюда одиннадцать форм. Существительное tył живёт в наречных оборотах: z tyłu «сзади», do tyłu «назад», tyłem «задом наперёд». Cofać się tyłem значит «пятиться»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: TYL-ny. Y читается как русское ы, l мягче русского: «ты́льны». В женском роде ударение там же: TYL-na." }
  - { kind: register, text: "Нейтрально во всех значениях. Мужско-личная форма tylni почти не встречается: задними бывают колёса, двери и лапы, а не люди. Если она всё же нужна, то в сочетаниях вроде tylni pasażerowie «пассажиры на заднем сиденье»." }
collocations:
  - { pl: "tylne siedzenie", ru: "заднее сиденье" }
  - { pl: "tylne drzwi", ru: "задняя дверь" }
  - { pl: "tylne koło", ru: "заднее колесо" }
family:
  - { pl: "tył", ru: "зад, тыл", relation: root, id: tyl }
  - { pl: "przedni", ru: "передний", relation: antonym }
  - { pl: "z tyłu", ru: "сзади", relation: derived }
etymology: "От tył «задняя сторона», из праславянского *tylъ — того же слова, что русский «тыл», родственного «затылку». Суффикс -ny образует относительные прилагательные. Отсюда tylny, tyłem, wstecz и cofać."
memory: "tylny — «задний», от tył, то есть русского «ТЫЛА». Но переводить надо обиходным «задний», а не книжным «тыльным»: tylne siedzenie это заднее сиденье. Антоним przedni «передний»."
idioms:
  - { pl: "tylne drzwi", ru: "задняя дверь, чёрный ход" }
  - { pl: "stanąć na tylnych łapach", ru: "встать на задние лапы" }
