# review
id: aresztowac
format: 2
lemma: "aresztować"
rank: 686
pos: verb
pron: { cyr: "арэшто́ваць" }
senses:
  - id: arrest
    ru: "арестовать; арестовывать"
    note: "Глагол двувидовой — одна форма на оба вида."
    examples:
      - pl: "Policja aresztowała go za kradzież."
        ru: "Полиция арестовала его за кражу."
        source: { kind: tatoeba, id: 591362 }
      - pl: "Policja aresztowała dwóch mężczyzn i dwie kobiety."
        ru: "Полиция арестовала двух мужчин и двух женщин."
        source: { kind: tatoeba, id: 3398997 }
      - pl: "Policjanci aresztowali włamywacza."
        ru: "Полицейские арестовали взломщика."
        source: { kind: translated, id: 613032 }
  - id: be-arrested
    ru: "zostać aresztowanym — быть арестованным"
    note: "Страдательные формы очень частотны."
    examples:
      - pl: "Czy jestem aresztowany?"
        ru: "Я арестован?"
        source: { kind: tatoeba, id: 957057 }
      - pl: "Tom został aresztowany w październiku."
        ru: "Том был арестован в октябре."
        source: { kind: tatoeba, id: 10602896 }
      - pl: "Tom został aresztowany w poniedziałek rano."
        ru: "Тома арестовали в понедельник утром."
        source: { kind: tatoeba, id: 8627677 }
  - id: impersonal
    ru: "aresztowano — арестовали (безлично)"
    examples:
      - pl: "Aresztowano większość podejrzanych."
        ru: "Арестовали большинство подозреваемых."
        source: { kind: translated, id: 4834145 }
      - pl: "Aresztowano około 300 osób."
        ru: "Арестовали около трёхсот человек."
        source: { kind: translated, id: 8428155 }
      - pl: "Ponad sześćdziesiąt osób zostało aresztowanych."
        ru: "Более шестидесяти человек было арестовано."
        source: { kind: tatoeba, id: 3657921 }
  - id: avoid-arrest
    ru: "uniknąć aresztowania — избежать ареста"
    examples:
      - pl: "Podejrzany chciał uniknąć aresztowania."
        ru: "Подозреваемый хотел избежать ареста."
        source: { kind: translated, id: 5223812 }
      - pl: "Tom wyjechał z miasta wczoraj późno w nocy, żeby uniknąć aresztowania."
        ru: "Том уехал из города вчера поздно ночью, чтобы избежать ареста."
        source: { kind: translated, id: 3961036 }
      - pl: "Mogli cię za to aresztować."
        ru: "Тебя могли за это арестовать."
        source: { kind: translated, id: 3649438 }
notes:
  - { kind: usage, text: "Глагол двувидовой: одна и та же форма значит и «арестовать», и «арестовывать». Aresztowali go можно понять двояко, решает контекст. В русском такого не бывает — там два разных глагола." }
  - { kind: government, text: "aresztować kogoś ZA coś — винительный плюс za с винительным: aresztowała go za kradzież «арестовала его за кражу». Совпадает с русским." }
  - { kind: usage, text: "Страдательные формы очень частотны: został aresztowany «был арестован», Czy jestem aresztowany? «Я арестован?»." }
  - { kind: usage, text: "Безличное aresztowano значит «арестовали»: aresztowano około 300 osób." }
  - { kind: usage, text: "Существительное — aresztowanie «арест»: uniknąć aresztowania «избежать ареста»." }
collocations:
  - { pl: "zostać aresztowanym", ru: "быть арестованным" }
  - { pl: "aresztować za coś", ru: "арестовать за что-либо" }
  - { pl: "uniknąć aresztowania", ru: "избежать ареста" }
  - { pl: "areszt", ru: "арест" }
family:
  - { pl: "areszt", ru: "арест", relation: derived }
  - { pl: "aresztowanie", ru: "арест", relation: derived }
  - { pl: "zatrzymać", ru: "задержать", relation: root }
etymology: "Из немецкого arrestieren, от латинского arrestare «останавливать, задерживать» — то же заимствование, что и русское «арестовать»."
memory: "aresztować — «арестовать», и слово это двувидовое: одна и та же форма покрывает и совершенный, и несовершенный вид, чего в русском не бывает — там «арестовать» и «арестовывать» разные глаголы. Aresztowali go значит и «арестовали», и «арестовывали», решает контекст. Управление совпадает: aresztować kogoś ZA coś. Страдательные формы очень частотны — został aresztowany, — как и безличное aresztowano."
idioms:
  - { pl: "zostać aresztowanym", ru: "быть арестованным" }
  - { pl: "aresztować za coś", ru: "арестовать за что-либо" }
  - { pl: "uniknąć aresztowania", ru: "избежать ареста" }
