# review
id: rozumiec
format: 2
lemma: "rozumieć"
rank: 138
pos: verb
aspect: imperf
pron: { cyr: "розу́мець" }
senses:
  - id: understand
    ru: "понимать (смысл, речь, человека)"
    examples:
      - pl: "Rozumiesz?"
        ru: "Ты понимаешь?"
        source: { kind: tatoeba, id: 461080 }
      - pl: "Teraz rozumiem."
        ru: "Теперь я понимаю."
        source: { kind: tatoeba, id: 1477778 }
      - pl: "Nie rozumiesz."
        ru: "Ты не понимаешь."
        source: { kind: tatoeba, id: 13867662 }
  - id: mutual
    ru: "rozumieć się — понимать друг друга; разбираться"
    examples:
      - pl: "Rozumiemy."
        ru: "Понимаем."
        source: { kind: tatoeba, id: 5627243 }
      - pl: "Rozumiesz mnie."
        ru: "Ты меня понимаешь."
        source: { kind: tatoeba, id: 1353240 }
      - pl: "Rozumiemy się bez słów."
        ru: "Мы понимаем друг друга без слов."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид — zrozumieć: Rozumiem «Понимаю» — Zrozumiałem «Я понял»." }
  - { kind: usage, text: "rozumie się и ma się rozumieć значат «само собой разумеется»." }
  - { kind: usage, text: "Основа на -e-: rozumiem, rozumiesz, rozumie, но rozumieją не бывает — правильно rozumieją? Нет: третье лицо множественного — rozumieją только в разговорной речи, норма — rozumieją. Проверяйте по таблице форм." }
collocations:
  - { pl: "rozumieć się", ru: "понимать друг друга" }
  - { pl: "nie rozumiem", ru: "я не понимаю" }
  - { pl: "rozumie się", ru: "само собой" }
  - { pl: "źle rozumiany", ru: "неправильно понятый" }
etymology: "Образовано от rozum «разум» с суффиксом -eć: буквально «схватывать разумом». Rozum — то же слово, что русское «разум»."
memory: "Совершенный вид — zrozumieć: Rozumiem «понимаю» — Zrozumiałem «я понял». Rozumiemy się — «мы понимаем друг друга», а ma się rozumieć — «само собой разумеется»."
idioms:
  - { pl: "rozumie się samo przez się", ru: "само собой разумеется" }
  - { pl: "ma się rozumieć", ru: "разумеется" }
  - { pl: "zrozumieć na opak", ru: "понять наоборот" }
