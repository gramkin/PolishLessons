# review
id: pic
format: 2
lemma: "pić"
rank: 457
pos: verb
aspect: imperf
pron: { cyr: "пиць" }
senses:
  - id: drink
    ru: "пить"
    examples:
      - pl: "Piję kawę."
        ru: "Я пью кофе."
        source: { kind: tatoeba, id: 1000606 }
      - pl: "Piję mleko."
        ru: "Я пью молоко."
        source: { kind: tatoeba, id: 3535913 }
      - pl: "Pijesz kawę?"
        ru: "Ты пьёшь кофе?"
        source: { kind: tatoeba, id: 568698 }
  - id: drink-alcohol
    ru: "пить (спиртное)"
    examples:
      - pl: "On nie pije."
        ru: "Он не пьёт."
        source: { kind: tatoeba, id: 1920880 }
      - pl: "Rzucił picie."
        ru: "Он бросил пить."
        source: { kind: translated, id: 402714 }
      - pl: "Nigdy wcześniej nie piliśmy wódki."
        ru: "Раньше мы никогда не пили водку."
        source: { kind: translated, id: 6406088 }
notes:
  - { kind: usage, text: "Жажду выражают безлично: Chce mi się pić «Я хочу пить», буквально «хочется мне пить». Русский ставит подлежащее «я», поляк обходится без него." }
  - { kind: usage, text: "pić значит и просто «пить», и «употреблять спиртное»: On nie pije «Он не пьёт» — то есть вообще не пьёт алкоголь." }
  - { kind: usage, text: "Существительное picie — «питьё, напиток»: coś do picia «что-нибудь попить»." }
  - { kind: usage, text: "pić czyjeś zdrowie — «пить за чьё-то здоровье», как русский тост." }
collocations:
  - { pl: "chce mi się pić", ru: "я хочу пить" }
  - { pl: "coś do picia", ru: "что-нибудь попить" }
  - { pl: "pić kawę", ru: "пить кофе" }
  - { pl: "rzucić picie", ru: "бросить пить" }
etymology: "Праславянское *piti; русское «пить» — то же самое слово, без единого изменения в корне."
memory: "pić — «пить», слово совпадает с русским. Но жажду поляк выражает безлично: Chce mi się pić «Я хочу пить». И существительное picie значит «питьё»: coś do picia."
idioms:
  - { pl: "pić jak szewc", ru: "пить как сапожник" }
  - { pl: "pić na umór", ru: "пить до беспамятства" }
  - { pl: "chce mi się pić", ru: "я хочу пить" }
