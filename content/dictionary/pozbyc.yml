# review
id: pozbyc
format: 2
lemma: "pozbyć"
rank: 778
pos: verb
aspect: perf
pron: { cyr: "по́збыць" }
senses:
  - id: get-rid
    ru: "pozbyć się czegoś — избавиться от чего-л. (родительный)"
    note: "Глагол живёт только с się и требует родительного падежа."
    examples:
      - pl: "Muszę się jej pozbyć."
        ru: "Мне надо от неё избавиться."
        source: { kind: translated, id: 13336049 }
      - pl: "Pozbądź się go."
        ru: "Избавься от него."
        source: { kind: translated, id: 7702997 }
      - pl: "Czego mogę się pozbyć?"
        ru: "От чего я могу избавиться?"
        source: { kind: translated, id: 7703004 }
  - id: habit
    ru: "избавиться от привычки, болезни"
    examples:
      - pl: "Pozbyli się nałogu."
        ru: "Они избавились от пагубной привычки."
        source: { kind: translated, id: 410100 }
      - pl: "Pozbyli się złego nawyku."
        ru: "Они избавились от дурной привычки."
        source: { kind: translated, id: 3655441 }
      - pl: "W końcu pozbyła się kataru."
        ru: "Она наконец избавилась от насморка."
        source: { kind: translated, id: 923070 }
  - id: thing
    ru: "избавиться от вещи, продать, выбросить"
    examples:
      - pl: "W końcu pozbyliśmy się naszego starego samochodu."
        ru: "В конце концов мы избавились от нашей старой машины."
        source: { kind: translated, id: 2212725 }
      - pl: "Pozbyłem się mojego ulubionego samochodu."
        ru: "Я избавился от своей любимой машины."
        source: { kind: translated, id: 882964 }
      - pl: "Jeśli weźmiesz to lekarstwo, pozbędziesz się zaziębienia."
        ru: "Если примешь это лекарство, избавишься от простуды."
        source: { kind: translated, id: 1576701 }
notes:
  - { kind: government, text: "Глагол употребляется только с się и требует родительного падежа: pozbyć się nałogu «избавиться от привычки», pozbyć się samochodu «избавиться от машины». Русское «избавиться от» требует предлога, польское — нет." }
  - { kind: usage, text: "Формы без się не употребляются: сказать pozbyć coś нельзя. Несовершенный вид — pozbywać się." }
  - { kind: usage, text: "Область применения широкая: от вещей (pozbyć się starych mebli) до привычек и болезней (pozbyć się kataru «избавиться от насморка»)." }
  - { kind: usage, text: "Корень тот же, что в być «быть»: po + z + być, буквально «перестать иметь при себе»." }
collocations:
  - { pl: "pozbyć się nałogu", ru: "избавиться от привычки" }
  - { pl: "pozbyć się problemu", ru: "избавиться от проблемы" }
  - { pl: "pozbądź się tego", ru: "избавься от этого" }
  - { pl: "pozbywać się", ru: "избавляться" }
family:
  - { pl: "pozbywać się", ru: "избавляться", relation: aspect }
  - { pl: "być", ru: "быть", relation: root, id: byc }
  - { pl: "pozbawić", ru: "лишить", relation: derived }
etymology: "Из po- + z- + być «быть» — буквально «перестать иметь при себе». Того же гнезда pozbawić «лишить»."
memory: "pozbyć się — «избавиться от чего-то», и глагол живёт только с się. Управление короче русского: pozbyć się nałogu, без всякого предлога, тогда как русский требует «от». Несовершенный вид — pozbywać się."
idioms:
  - { pl: "pozbyć się nałogu", ru: "избавиться от привычки" }
  - { pl: "pozbądź się tego", ru: "избавься от этого" }
  - { pl: "pozbyć się problemu", ru: "избавиться от проблемы" }
