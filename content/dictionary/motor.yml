notes:
  - { kind: false-friend, text: "Самая частая ошибка русскоязычного в этом слове — считать, что MOTOR это мотор. В обиходной польской речи MOTOR означает мотоцикл: JEŹDZIĆ NA MOTORZE значит «ездить на мотоцикле», а не «ездить на моторе». Двигатель машины называется SILNIK, от SIŁA «сила», и именно это слово стоит в технических текстах: SILNIK SPALINOWY «двигатель внутреннего сгорания», SILNIK ELEKTRYCZNY. Слово MOTOR сохраняется в книжном переносном значении — MOTOR NAPĘDOWY «движущая сила» — и в сложениях вроде MOTOROWER. Полное название мотоцикла, MOTOCYKL, тоже есть, но звучит официальнее." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — MOTORZE, где конечное R основы переходит в RZ перед окончанием -E: та же мена, что в SEKTORZE и KOMORZE. Родительный единственного — MOTORU, с окончанием -U, в отличие от SEKTORA: выбор между -A и -U у заимствованных слов приходится запоминать отдельно, общего правила нет. Винительный равен именительному. Предлог при езде — NA с местным: NA MOTORZE, как NA ROWERZE и NA KONIU." }
  - { kind: pronunciation, text: "Читается «мо́тор», два слога, ударение на первом — в отличие от русского «мото́р», где оно на последнем. Это главное различие на слух, и его стоит отработать отдельно, потому что слово частое. Обе гласные чистые, R раскатистое. В форме MOTORU слышно «мото́ру», и ударение переходит на второй слог. В форме MOTORZE буквосочетание RZ даёт «ж»: «мото́же». В форме MOTORÓW буква Ó читается как «у», а конечное W оглушается: «мото́руф»." }
  - { kind: register, text: "В значении мотоцикла слово разговорное и совершенно обычное: так говорят и подростки, и механики. Устойчивые сочетания: JEŹDZIĆ NA MOTORZE, KUPIĆ MOTOR, PRAWO JAZDY NA MOTOR. В переносном значении слово книжное: MOTOR NAPĘDOWY GOSPODARKI «движущая сила экономики», BYĆ MOTOREM ZMIAN. Производные: MOTOCYKL, MOTOROWER «мопед», MOTORNICZY «вагоновожатый» — последнее слово неожиданное и относится к трамваю. Название спортивных клубов MOTOR встречается по всей Польше." }
