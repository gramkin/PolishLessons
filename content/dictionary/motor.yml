etymology: "Из латинского MOTOR «приводящий в движение», от глагола MOVERE «двигать», от которого же идут «момент», «мобильный» и «эмоция». Оба языка взяли слово из латыни через технический язык девятнадцатого века, и значение было одно — двигатель. Разошлись они потом: русский оставил «мотор» при двигателе, а польский постепенно отдал это место своему SILNIK, построенному от SIŁA по образцу чешских и польских словообразовательных пуризмов того времени. Освободившееся слово MOTOR прижилось за мотоциклом — по сокращению из MOTOCYKL — и за книжной метафорой движущей силы. Так заимствование и родное слово поделили поле, а русскому досталась ровно обратная расстановка."
memory: "Ловушка частая: motor в разговоре значит «мотоцикл», а двигатель это silnik, от siła. Ездят na motorze, как na rowerze. Книжное переносное motor napędowy значит «движущая сила». Ударение на первом слоге, «мо́тор», не как в русском. Местный motorze с меной r→rz, как sektorze; родительный motoru на -u, хотя у sektora окончание -a — это приходится запоминать отдельно."
idioms:
  - { pl: "motor napędowy", ru: "движущая сила" }
