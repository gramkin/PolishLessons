# review
id: nawiazanie
format: 2
lemma: "nawiązanie"
rank: 5786
pos: noun
pron: { cyr: "навёу̃за́не" }
senses:
  - id: establishing
    ru: "установление (контакта, отношений), налаживание"
    examples:
      - pl: "Nawiązanie kontaktu z klientem zajęło tydzień."
        ru: "Установление контакта с клиентом заняло неделю."
        source: { kind: authored }
      - pl: "Telewizja poinformowała o nawiązaniu stosunków dyplomatycznych."
        ru: "Телевидение сообщило об установлении дипломатических отношений."
        source: { kind: authored }
      - pl: "Celem spotkania było nawiązanie współpracy."
        ru: "Целью встречи было налаживание сотрудничества."
        source: { kind: authored }
  - id: reference
    ru: "отсылка, перекличка (с чем-либо)"
    examples:
      - pl: "Tytuł filmu to nawiązanie do starej piosenki."
        ru: "Название фильма — отсылка к старой песне."
        source: { kind: authored }
      - pl: "W nawiązaniu do naszej rozmowy przesyłam ofertę."
        ru: "В продолжение нашего разговора высылаю предложение."
        source: { kind: authored }
      - pl: "Książka jest pełna nawiązań do Biblii."
        ru: "Книга полна отсылок к Библии."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NAWIĄZANIE — не «навязывание» (это NARZUCANIE). Слово значит «установление» (контакта, отношений) или «отсылка» к чему-то: NAWIĄZANIE DO TRADYCJI — «обращение к традиции»." }
  - { kind: government, text: "Что устанавливают — родительный: NAWIĄZANIE KONTAKTU, WSPÓŁPRACY. С кем — Z с творительным: NAWIĄZANIE KONTAKTU Z KLIENTEM. Отсылка к чему — DO с родительным: NAWIĄZANIE DO BIBLII." }
  - { kind: register, text: "Книжное и деловое. W NAWIĄZANIU DO — канцелярская формула деловых писем: «в связи с, ссылаясь на»." }
  - { kind: pronunciation, text: "Читается «навёу̃за́не»: IĄ перед Z — носовое «ёу̃», ударение на предпоследнем слоге. Восемь форм, средний род; звательный совпадает с именительным." }
collocations:
  - { pl: "nawiązanie kontaktu", ru: "установление контакта" }
  - { pl: "nawiązanie współpracy", ru: "налаживание сотрудничества" }
  - { pl: "nawiązanie do tradycji", ru: "обращение к традиции" }
family:
  - { pl: "nawiązać", ru: "установить, завязать", relation: root, id: nawiazac }
  - { pl: "nawiązywać", ru: "устанавливать, ссылаться", relation: root }
  - { pl: "wiązać", ru: "вязать, связывать", relation: root, id: wiazac }
etymology: "Отглагольное существительное от NAWIĄZAĆ (NA- + WIĄZAĆ «вязать») с суффиксом -ANIE. Польское Ą соответствует русскому «я»: WIĄZAĆ — «вязать»."
memory: "Nawiązanie kontaktu — установление контакта; nawiązanie do — отсылка к. W nawiązaniu do — «в связи с» в деловом письме."
idioms:
  - { pl: "w nawiązaniu do", ru: "в связи с, ссылаясь на" }
