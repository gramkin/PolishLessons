      - pl: "Obiecowano nam podwyżkę już w marcu."
        ru: "Нам обещали прибавку ещё в марте."
        source: { kind: authored }
  - id: look-promising
    ru: "подавать надежды, многообещающий"
    examples:
      - pl: "To obiecujący student."
        ru: "Это подающий надежды студент."
        source: { kind: authored }
      - pl: "Początek był obiecujący."
        ru: "Начало было многообещающим."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ЭТО ДВУВИДОВОЙ ГЛАГОЛ — РЕДКИЙ СЛУЧАЙ, И РУССКОМУ ОН ЗНАКОМ. Obiecować не принадлежит ни к совершенному, ни к несовершенному виду: словарь форм даёт ему сразу оба деепричастия, OBIECUJĄC «обещая» и OBIECOWAWSZY «пообещав», а страдательные причастия помечает двойным видом. Отсюда и 64 формы вместо обычных 63. Русское «обещать» устроено точно так же: «я обещаю» это и настоящее, и будущее, и рядом стоят «велеть», «женить», «ранить», «казнить»." }
  - { kind: register, text: "В живой современной речи чаще берут обычную видовую пару OBIECYWAĆ (несов.) и OBIECAĆ (сов.): obiecuję ci «я тебе обещаю», obiecałem «я пообещал». Сам глагол obiecować звучит книжно и старомодно. Зато его причастие OBIECUJĄCY совершенно живое и значит «многообещающий»: obiecujący student, obiecujące wyniki." }
  - { kind: government, text: "Управление совпадает с русским полностью: OBIECAĆ KOMUŚ COŚ — дательный падеж лица и винительный вещи, как в «обещать кому-л. что-л.». Запоминать тут нечего, зато стоит запомнить существительное: OBIETNICA «обещание», родственное нашему «обету»." }
collocations:
  - { pl: "obiecujący student", ru: "подающий надежды студент" }
  - { pl: "obiecywać gruszki na wierzbie", ru: "обещать золотые горы" }
  - { pl: "obiecać komuś pomoc", ru: "обещать кому-л. помощь" }
family:
  - { pl: "obiecywać", ru: "обещать (несов.)", relation: aspect, id: obiecywac }
  - { pl: "obiecać", ru: "пообещать (сов.)", relation: aspect, id: obiecac }
  - { pl: "obietnica", ru: "обещание", relation: root, id: obietnica }
etymology: "Приставка o- и корень *věťati «вещать, говорить», тот же, что в русских «обещать», «обет», «вещать». Польское OBIETNICA «обещание» и наш «обет» — прямая пара. Так что слово русскому родное целиком, вместе со своей необычной двувидовостью: «обещать» у нас тоже не выбирает вида."
memory: "obiecować — двувидовой глагол, как наше «обещать»: у него есть и obiecując «обещая», и obiecowawszy «пообещав». В живой речи, впрочем, берут пару obiecywać и obiecać. А obiecujący значит «многообещающий»."
idioms:
  - { pl: "obiecywać gruszki na wierzbie", ru: "обещать золотые горы" }
  - { pl: "obiecywać sobie wiele po czymś", ru: "возлагать большие надежды на что-л." }
