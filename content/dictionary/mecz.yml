    ru: "смотреть матчи"
    examples:
      - pl: "Lubię oglądać mecze baseballa."
        ru: "Я люблю смотреть бейсбольные матчи."
        source: { kind: translated, id: 364404 }
      - pl: "Lubię oglądać mecze piłkarskie."
        ru: "Я люблю смотреть футбольные матчи."
        source: { kind: translated, id: 600308 }
  - id: before
    ru: "przed meczem — перед матчем"
    examples:
      - pl: "Trener rozmawiał z drużyną przed meczem."
        ru: "Тренер говорил с командой перед матчем."
