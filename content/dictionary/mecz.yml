      - pl: "Byli podekscytowani meczem."
        ru: "Они были взволнованы матчем."
        source: { kind: translated, id: 758270 }
notes:
  - { kind: usage, text: "Мужской род неодушевлённый: ten mecz, tego meczu, przed meczem." }
  - { kind: pronunciation, text: "Английское заимствование, читается «мэч». Склоняется при этом по-польски." }
  - { kind: usage, text: "mecz piłki nożnej «футбольный матч», mecz wyjazdowy «выездной матч», mecz towarzyski «товарищеский матч»." }
  - { kind: usage, text: "Матч отменяют — mecz został odwołany, переносят — mecz został przełożony." }
