# review
id: mecz
format: 2
lemma: "mecz"
rank: 1131
pos: noun
pron: { cyr: "мэч" }
senses:
  - id: match
    ru: "матч, игра"
    examples:
      - pl: "Mecz zakończył się."
        ru: "Матч закончился."
        source: { kind: tatoeba, id: 3657952 }
      - pl: "Wygraliśmy ten mecz."
        ru: "Мы выиграли этот матч."
        source: { kind: translated, id: 756522 }
