notes:
  - { kind: usage, text: "Мужской род неодушевлённый: ten mecz, tego meczu, przed meczem." }
  - { kind: pronunciation, text: "Английское заимствование, читается «мэч». Склоняется при этом по-польски." }
  - { kind: usage, text: "mecz piłki nożnej «футбольный матч», mecz wyjazdowy «выездной матч», mecz towarzyski «товарищеский матч»." }
  - { kind: usage, text: "Матч отменяют — mecz został odwołany, переносят — mecz został przełożony." }
collocations:
  - { pl: "mecz piłki nożnej", ru: "футбольный матч" }
  - { pl: "wygrać mecz", ru: "выиграть матч" }
  - { pl: "przed meczem", ru: "перед матчем" }
  - { pl: "mecz wyjazdowy", ru: "выездной матч" }
family:
  - { pl: "meczowy", ru: "матчевый", relation: derived }
etymology: "Из английского match «состязание». Русский «матч» — то же заимствование и тем же путём."
memory: "mecz — «матч», из английского match, читается «мэч». Мужской род: ten mecz, tego meczu, przed meczem."
