# review
id: przekroczyc
format: 2
lemma: "przekroczyć"
rank: 2549
pos: verb
pron: { cyr: "пшэкро́чыць" }
senses:
  - id: cross
    ru: "пересечь, перейти (границу, черту)"
    examples:
      - pl: "Przekroczyli granicę o świcie."
        ru: "Они пересекли границу на рассвете."
        source: { kind: authored }
      - pl: "Nie wolno przekroczyć tej linii."
        ru: "Нельзя переступать эту черту."
        source: { kind: authored }
  - id: exceed
    ru: "превысить (скорость, лимит, срок)"
    examples:
      - pl: "Kierowca przekroczył prędkość o czterdzieści kilometrów."
        ru: "Водитель превысил скорость на сорок километров."
        source: { kind: authored }
      - pl: "Koszty przekroczyły plan dwukrotnie."
        ru: "Расходы превысили план вдвое."
        source: { kind: authored }
  - id: step-over
    ru: "переступить (порог)"
    examples:
      - pl: "Bał się przekroczyć próg tego domu."
        ru: "Он боялся переступить порог этого дома."
        source: { kind: authored }
notes:
  - { kind: government, text: "ГЛАВНОЕ: PRZEKROCZYĆ COŚ — ВИНИТЕЛЬНЫЙ БЕЗ ПРЕДЛОГА. Русский почти всегда вставляет «через»: «перейти ЧЕРЕЗ границу», «переступить ЧЕРЕЗ порог». Польскому предлог не нужен вовсе: przekroczyć granicę, przekroczyć próg, przekroczyć rzekę — прямое дополнение, как у «пересечь». Вставленное przez здесь будет ошибкой." }
  - { kind: usage, text: "Второе значение — «превысить»: przekroczyć prędkość, limit, budżet, termin. Отсюда существительное PRZEKROCZENIE PRĘDKOŚCI «превышение скорости» в протоколах. А PRZEKROCZONY PLAN значит не «сорванный», а «перевыполненный» — превышение плана поляки считают хорошей новостью." }
  - { kind: usage, text: "Вид совершенный: PRZEKROCZĘ — это «пересеку», будущее, а не «пересекаю». Настоящего времени нет; «пересекаю» — несовершенный PRZEKRACZAĆ. Есть деепричастие PRZEKROCZYWSZY и нет форм на -ąc. Глагол переходный, поэтому страдательное причастие PRZEKROCZONY в наличии." }
collocations:
  - { pl: "przekroczyć granicę", ru: "пересечь границу" }
  - { pl: "przekroczyć prędkość", ru: "превысить скорость" }
  - { pl: "przekroczyć termin", ru: "просрочить срок" }
family:
  - { pl: "przekraczać", ru: "пересекать, превышать (несов.)", relation: aspect }
  - { pl: "kroczyć", ru: "шагать, шествовать", relation: root }
  - { pl: "krok", ru: "шаг", relation: root, id: krok }
etymology: "Приставка prze- «пере-» и kroczyć «шагать», от праславянского *krokъ «шаг». Корень живой в польском (krok, kroczyć, wykroczenie) и в украинском «крок» «шаг», а русский его потерял, заменив словом «шаг». Так что przekroczyć — это буквально «перешагнуть», и русское «переступить» построено по той же модели, только из другого корня."
memory: "przekroczyć granicę — винительный без всякого предлога, не «przekroczyć przez granicę». Русское «через» здесь лишнее. И помни второе значение: przekroczyć prędkość «превысить скорость», а przekroczony plan — это план перевыполненный, а не сорванный."
idioms:
  - { pl: "przekroczyć granicę przyzwoitości", ru: "перейти границы приличия" }
  - { pl: "przekroczyć próg", ru: "переступить порог, войти" }
formExamplesSkip:
  - { form: "przekroczeni", reason: "Мужско-личная форма страдательного причастия требует одушевлённого дополнения-человека, а przekroczyć управляет только неодушевлёнными: granicę, próg, limit, prędkość. Подлежащего для этой формы в языке просто нет." }
