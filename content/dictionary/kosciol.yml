# review
id: kosciol
format: 2
lemma: "kościół"
rank: 985
pos: noun
pron: { cyr: "ко́сьцюу" }
senses:
  - id: church
    ru: "церковь, костёл (здание)"
    examples:
      - pl: "Ile lat ma ten kościół?"
        ru: "Сколько лет этой церкви?"
        source: { kind: translated, id: 12562313 }
      - pl: "Za moim domem jest kościół."
        ru: "За моим домом есть церковь."
        source: { kind: translated, id: 766153 }
      - pl: "Gdzie jest najbliższy kościół?"
        ru: "Где находится ближайшая церковь?"
        source: { kind: translated, id: 1350586 }
  - id: go-to-church
    ru: "chodzić do kościoła — ходить в церковь"
    examples:
      - pl: "Nie chodzę do kościoła."
        ru: "Я не хожу в церковь."
        source: { kind: translated, id: 8666098 }
      - pl: "On rzadko chodzi do kościoła."
        ru: "Он редко ходит в церковь."
        source: { kind: translated, id: 587522 }
      - pl: "Idziemy do kościoła na mszę."
        ru: "Мы идём в церковь на мессу."
        source: { kind: translated, id: 881980 }
  - id: in-church
    ru: "w kościele — в церкви"
    examples:
      - pl: "Jestem w kościele."
        ru: "Я в церкви."
        source: { kind: translated, id: 13731632 }
      - pl: "Dan poznał Lindę w kościele."
        ru: "Дэн познакомился с Линдой в церкви."
        source: { kind: translated, id: 3997727 }
      - pl: "Maria i Tom wzięli ślub w kościele niedaleko stąd."
        ru: "Мэри и Том поженились в церкви недалеко отсюда."
        source: { kind: translated, id: 3679915 }
notes:
  - { kind: false-friend, text: "Русское «костёл» — это именно католический храм, а польское kościół значит церковь вообще: есть и kościół prawosławny «православная церковь», и kościół anglikański." }
  - { kind: government, text: "Направление — do kościoła с родительным: idę do kościoła «иду в церковь». Место — w kościele с предложным: jestem w kościele «я в церкви»." }
  - { kind: usage, text: "Слово значит и здание, и институцию: Kościół katolicki «католическая церковь» как организация обычно пишут с большой буквы." }
  - { kind: usage, text: "Чередование в основе: kościół, но kościoła, kościele. Буква ó переходит в o, как в stół — stołu." }
collocations:
  - { pl: "iść do kościoła", ru: "идти в церковь" }
  - { pl: "w kościele", ru: "в церкви" }
  - { pl: "ślub w kościele", ru: "венчание в церкви" }
  - { pl: "kościół katolicki", ru: "католическая церковь" }
family:
  - { pl: "kościelny", ru: "церковный", relation: derived }
  - { pl: "ksiądz", ru: "ксёндз, священник", relation: derived }
etymology: "Через чешское kostel из латинского castellum «укрепление»: ранние церкви строили как крепости. Русское «костёл» заимствовано именно из польского."
memory: "kościół — «церковь» вообще, не только католическая: бывает и kościół prawosławny. Русское «костёл» уже сузилось до католического храма. Следите за чередованием: kościół, но do kościoła, w kościele."
idioms:
  - { pl: "iść do kościoła", ru: "ходить в церковь" }
  - { pl: "ślub w kościele", ru: "венчание в церкви" }
  - { pl: "stać pod kościołem", ru: "стоять у церкви" }
