etymology: "Из английского DEALER «торговец», от DEAL «сделка». В польский слово пришло двумя волнами и потому имеет два написания. Первая волна, деловая, принесла английскую орфографию DEALER, которая держится в автомобильной и финансовой сфере. Вторая, газетная и криминальная, полонизировала слово в DILER по звучанию, и именно это написание закрепилось за торговцем наркотиками. Русский обошёлся одним написанием «дилер» и одним нейтральным значением. Чередование R и RZ в польской парадигме не имеет отношения к заимствованию: это древний славянский переход, по которому мягкое R дало RZ, и он работает одинаково на своих и чужих словах — DILER даёт DILERZY так же, как PISARZ дал бы PISARZE."
memory: "Главное — регистр: польское diler без уточнения понимают как наркоторговца, тогда как русское «дилер» нейтрально. Для торгового представителя говорят dealer или autoryzowany diler, а дилерский центр — salon dealerski. Два написания живут по сферам. В парадигме урок: мужское-личное множественное dilerzy с переходом r→rz, как inżynier/inżynierzy, и местный dilerze. Винительный равен родительному (dilera), потому что лицо одушевлённое."
idioms:
  - { pl: "autoryzowany diler", ru: "официальный дилер" }
