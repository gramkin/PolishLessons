notes:
  - { kind: register, text: "Это главное, что нужно знать о слове. В современной польской речи DILER без определения понимается прежде всего как торговец наркотиками: DILER NARKOTYKOWY, но чаще просто DILER. Поэтому сказать о продавце автомобилей PRACUJE JAKO DILER рискованно — услышат другое. Для торгового представителя говорят DEALER или уточняют: AUTORYZOWANY DILER, DILER SAMOCHODOWY, SALON DEALERSKI. Орфография при этом двойная: польский полонизировал написание в DILER, но в фирменных названиях и в автомобильной отрасли сохраняется английское DEALER. В словарях стоят оба написания, и выбор зависит от сферы." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое лицо. Главный урок парадигмы — мужское-личное множественное DILERZY, где конечное R переходит в RZ. Это обязательное чередование для всех существительных мужского рода на -R: INŻYNIER и INŻYNIERZY, DOKTOR и DOKTORZY, MALARZ уже содержит RZ. Местный падеж единственного — DILERZE, с тем же переходом. Винительный единственного совпадает с родительным, DILERA, потому что существительное одушевлённое — то же правило, что в русском «вижу дилера». Родительный множественного — DILERÓW." }
  - { kind: false-friend, text: "Русское «дилер» нейтрально и означает прежде всего торгового посредника: автодилер, дилер ценных бумаг. Польское DILER по умолчанию наркотическое, и это расхождение в регистре, а не в значении. Второе различие в написании: русский передал английское DEALER через «дилер» и на этом остановился, а польский держит два варианта, DILER и DEALER, распределённых по сферам. Третье: русское «дилерский центр» по-польски SALON DEALERSKI, через английское написание. Поэтому при переводе технических текстов надёжнее брать DEALER, а при переводе криминальной хроники — DILER." }
  - { kind: pronunciation, text: "Читается «ди́лер», два слога, ударение на первом. Буква I после D смягчает согласный: «ди», а не «ды». Буква E звучит как «э», но после мягкого L воспринимается ближе к «е»: польское L всегда мягче русского твёрдого «л». Конечное R твёрдое и раскатистое. В форме DILERZY сочетание RZ даёт «ж»: «диле́жы», и это различие слышно сразу — в единственном числе «р», во множественном «ж». В местном падеже DILERZE то же самое: «диле́же»." }
