# review
id: naladowac
format: 2
lemma: "naładować"
rank: 5284
pos: verb
pron: { cyr: "науадо́ваць" }
senses:
  - id: charge
    ru: "зарядить (телефон, батарею, оружие)"
    examples:
      - pl: "Muszę naładować telefon."
        ru: "Мне нужно зарядить телефон."
        source: { kind: authored }
      - pl: "Naładował pistolet i schował go."
        ru: "Он зарядил пистолет и спрятал его."
        source: { kind: authored }
      - pl: "Naładuj baterie przed wyjazdem."
        ru: "Заряди батарейки перед отъездом."
        source: { kind: authored }
  - id: load
    ru: "нагрузить, навалить; набраться (сил, энергии)"
    examples:
      - pl: "Naładowali ciężarówkę meblami."
        ru: "Они нагрузили грузовик мебелью."
        source: { kind: authored }
      - pl: "Na urlopie naładowałam akumulatory."
        ru: "В отпуске я подзарядила батарейки."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NAŁADOWAĆ — не «наладить»: наладить — NAPRAWIĆ, USTAWIĆ, ZORGANIZOWAĆ. NAŁADOWAĆ — «зарядить»: NAŁADOWAĆ TELEFON, BATERIĘ, BROŃ. И «нагрузить»: NAŁADOWAĆ WÓZ. Переносное NAŁADOWAĆ AKUMULATORY — «подзарядить батарейки», то есть отдохнуть." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное NAŁADOWANY, «заряженный», и деепричастие NAŁADOWAWSZY. Спряжение на -UJĘ: NAŁADUJĘ, NAŁADUJESZ. Видовой партнёр — ŁADOWAĆ: TELEFON SIĘ ŁADUJE." }
  - { kind: government, text: "Что — винительный: NAŁADOWAĆ TELEFON. Чем — творительный: NAŁADOWAĆ WÓZ SIANEM, NAŁADOWAĆ BROŃ NABOJAMI. Куда — DO с родительным: NAŁADOWAĆ RZECZY DO BAGAŻNIKA. NAŁADOWANY EMOCJAMI — «насыщенный эмоциями»." }
  - { kind: pronunciation, text: "Читается «науадо́ваць», четыре слога, ударение на предпоследнем. Ł — короткое «у»: «на-уа». Конечное Ć — «ць». NAŁADUJĘ — «науаду́е»." }
  - { kind: register, text: "Нейтральное бытовое и техническое слово. Разговорное NAŁADOWAĆ AKUMULATORY — «отдохнуть, набраться сил». NAŁADOWANA ATMOSFERA — «наэлектризованная атмосфера», напряжённая." }
collocations:
  - { pl: "naładować telefon", ru: "зарядить телефон" }
  - { pl: "naładować akumulatory", ru: "подзарядить батарейки (отдохнуть)" }
  - { pl: "naładowana broń", ru: "заряженное оружие" }
family:
  - { pl: "ładować", ru: "заряжать; грузить", relation: aspect }
  - { pl: "załadować", ru: "загрузить", relation: root }
  - { pl: "ładowarka", ru: "зарядное устройство", relation: derived }
etymology: "Приставка NA- плюс ŁADOWAĆ «грузить, заряжать», из немецкого LADEN «грузить». Русского родственника нет; русское «ладить» — от другого корня."
memory: "Naładować — зарядить: telefon, baterię, broń. И нагрузить: wóz, bagażnik. Не «наладить»! Naładować akumulatory — подзарядиться. Ładowarka — зарядка. Читается «науадо́ваць»."
idioms:
  - { pl: "naładować akumulatory", ru: "подзарядить батарейки, отдохнуть" }
