  - id: speed-limit
    ru: "скорость (ограничение, превышение)"
    examples:
      - pl: "Nie ma ograniczenia prędkości."
        ru: "Ограничения скорости нет."
        source: { kind: translated, id: 6487250 }
      - pl: "Nie przekraczaj ograniczenia prędkości."
