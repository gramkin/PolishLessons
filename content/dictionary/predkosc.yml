notes:
  - { kind: government, text: "Со скоростью — z prędkością (творительный падеж): jedzie z prędkością 60 km/h. Ограничение скорости — ograniczenie prędkości (родительный)." }
  - { kind: usage, text: "ograniczenie prędkości — «ограничение скорости»; przekroczyć prędkość — «превысить скорость»." }
  - { kind: false-friend, text: "Рядом живёт szybkość, тоже «скорость». prędkość — слово более техническое, физическое; в быту чаще szybkość." }
  - { kind: usage, text: "Прилагательное — prędki «быстрый», наречие prędko «быстро», но в живой речи чаще szybki и szybko." }
collocations:
  - { pl: "z prędkością", ru: "со скоростью" }
  - { pl: "ograniczenie prędkości", ru: "ограничение скорости" }
  - { pl: "prędkość światła", ru: "скорость света" }
family:
  - { pl: "prędki", ru: "быстрый", relation: root }
  - { pl: "prędko", ru: "быстро", relation: root }
  - { pl: "szybki", ru: "быстрый", relation: root, id: szybki }
etymology: "От prędki «быстрый», того же корня, что русское «прядать» — двигаться рывком. Русское «скорость» построено от «скорый»."
memory: "prędkość — «скорость», слово техническое: z prędkością 60 km/h, ograniczenie prędkości. В быту то же самое чаще скажут через szybkość."
idioms:
