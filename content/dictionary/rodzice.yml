notes:
  - { kind: usage, text: "Слово существует только во множественном числе — ровно как русское «родители». Единственное rodzic «родитель» есть, но звучит по-канцелярски." }
  - { kind: usage, text: "Творительный падеж — rodzicami: Mieszkam z rodzicami «Я живу с родителями»." }
  - { kind: usage, text: "rodzice chrzestni — «крёстные родители»." }
  - { kind: usage, text: "Слово от rodzić «рождать»; русское «родители» — то же самое гнездо." }
collocations:
  - { pl: "moi rodzice", ru: "мои родители" }
  - { pl: "z rodzicami", ru: "с родителями" }
  - { pl: "rodzice chrzestni", ru: "крёстные" }
  - { pl: "dom rodziców", ru: "родительский дом" }
etymology: "Множественное от rodzic «родитель», от rodzić «рождать». Русское «родители» — то же самое слово."
memory: "rodzice — «родители», и слово живёт только во множественном числе, как и русское. Единственное rodzic существует, но звучит по-канцелярски. Творительный — z rodzicami."
idioms:
