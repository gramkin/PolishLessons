# review
id: uczen
format: 2
lemma: "uczeń"
rank: 1617
pos: noun
pron: { cyr: "у́чень" }
senses:
  - id: pupil
    ru: "ученик, школьник"
    examples:
      - pl: "Uczeń się uczy."
        ru: "Ученик учится."
        source: { kind: translated, id: 12453769 }
      - pl: "Do naszej klasy przyszedł dziś nowy uczeń."
        ru: "В наш класс сегодня пришёл новый ученик."
        source: { kind: tatoeba, id: 1348738 }
      - pl: "Tom to najpilniejszy uczeń w klasie."
        ru: "Том — самый прилежный ученик в классе."
        source: { kind: translated, id: 753755 }
  - id: be-a-pupil
    ru: "быть учеником"
    examples:
      - pl: "Nie jestem uczniem."
        ru: "Я не ученик."
        source: { kind: tatoeba, id: 2995995 }
      - pl: "Tom jest pilnym uczniem."
        ru: "Том — усердный ученик."
        source: { kind: tatoeba, id: 7114680 }
      - pl: "Jesteśmy uczniami."
        ru: "Мы ученики."
        source: { kind: translated, id: 529630 }
notes:
  - { kind: usage, text: "Родительный множественного — обычно uczniów, реже uczni. Обе формы правильные, но uczniów встречается заметно чаще; uczni звучит книжно." }
  - { kind: usage, text: "В основе чередование ń/n: uczeń, но ucznia, uczniem, uczniowie. Гласная e при этом выпадает — как в русском «отец — отца»." }
  - { kind: usage, text: "Лично-мужское множественное — uczniowie «ученики»; uczniów — родительный и винительный множественного." }
  - { kind: false-friend, text: "Различайте uczeń «школьник» и student «студент вуза»: в польском это разные слова, и uczeń про вуз не говорят." }
  - { kind: usage, text: "Образовано от uczyć się «учиться»; женская пара — uczennica «ученица»." }
collocations:
  - { pl: "dobry uczeń", ru: "хороший ученик" }
  - { pl: "uczeń liceum", ru: "ученик лицея" }
  - { pl: "nauczyciel i uczeń", ru: "учитель и ученик" }
etymology: "От uczyć «учить», праславянское *uk- — тот же корень, что в русских «учить», «наука», «ученик». Соответствие полное, включая суффикс деятеля."
memory: "uczeń = «ученик, школьник», от uczyć się. В основе чередование ń/n с выпадением e: uczeń, но ucznia, uczniowie. И не путайте с student — так говорят только о вузе."
idioms:
  - { pl: "dobry uczeń", ru: "хороший ученик" }
  - { pl: "uczeń liceum", ru: "ученик лицея" }
  - { pl: "nauczyciel i uczeń", ru: "учитель и ученик" }
