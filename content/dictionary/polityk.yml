notes:
  - { kind: false-friend, text: "Главная трудность в том, что одна форма принадлежит двум разным словам. POLITYK — мужской род, «политик»; POLITYKA — женский род, «политика». Но POLITYKA это ещё и родительный с винительным от POLITYK: ZNAM TEGO POLITYKA значит «я знаю этого политика», а POLITYKA RZĄDU — «политика правительства». Различает их только согласование и смысл: TEGO POLITYKA — мужской род, TA POLITYKA — женский. Русский такой путаницы не знает, потому что «политика» и «политика» у него не совпадают в падежах, и это место требует особого внимания." }
  - { kind: usage, text: "Существительное мужско-личное, поэтому именительный множественного — POLITYCY, с переходом k в c, а винительный множественного совпадает с родительным: ZNAM TYCH POLITYKÓW. Женская форма — POLITYK тоже, без изменений: ONA JEST POLITYKIEM, и это одно из немногих названий профессий, у которого женской формы на -KA не образуют, потому что POLITYKA уже занято. Переносное значение, «тактичный человек», живёт в оборотах BYĆ POLITYKIEM и OKAZAĆ SIĘ POLITYKIEM." }
  - { kind: pronunciation, text: "Читается «поли́тык», в три слога, с ударением на предпоседнем, то есть на LI. Буква y даёт «ы», поэтому конец слова звучит «тык», а не «тик». В именительном множественном POLITYCY — «полити́цы», где k перешло в c, и ударение осталось на том же слоге от конца. В творительном POLITYKIEM — «полити́кем»." }
  - { kind: government, text: "С кем — предлог Z с творительным: ROZMAWIAĆ Z POLITYKIEM. Кем быть — творительный без предлога: BYĆ POLITYKIEM, и это общее правило польского для сказуемого при BYĆ, тогда как русский говорит «быть политиком» тоже творительным, так что перенос прямой. Родительный множественного — POLITYKÓW. Прилагательное POLITYCZNY «политический» образовано от POLITYKA, не от POLITYK." }
