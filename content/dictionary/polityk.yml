etymology: "Из греческого POLITIKOS «относящийся к государству, гражданский», от POLIS «город-государство». В европейские языки слово вошло через латынь, и в польский — в шестнадцатом веке, сначала как прилагательное, затем как название человека, занятого государственными делами. От того же POLIS происходят POLICJA и POLITYKA, так что город оказался предком и полиции, и политики. Русские «политик» и «политика» пришли тем же путём и примерно в то же время, поэтому значения совпадают; расходится только падежная система, из-за чего в польском и возникает совпадение форм POLITYKA."
memory: "Осторожно с формой POLITYKA: это и родительный от POLITYK «политик», и именительный от POLITYKA «политика». Различать по согласованию: tego polityka против ta polityka. Множественное — POLITYCY, с k в c. Женской формы на -ka нет, говорят ona jest politykiem."
