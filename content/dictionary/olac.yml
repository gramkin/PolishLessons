# review
id: olac
format: 2
lemma: "olać"
rank: 2568
pos: verb
pron: { cyr: "о́лаць" }
senses:
  - id: douse
    ru: "облить, полить (водой)"
    examples:
      - pl: "Trzeba olać grządki przed upałem."
        ru: "Надо полить грядки перед жарой."
        source: { kind: authored }
      - pl: "Deszcz olał nas od stóp do głów."
        ru: "Дождь облил нас с головы до ног."
        source: { kind: authored }
  - id: not-care
    ru: "разг., грубоват. наплевать, забить (на что-л.)"
    examples:
      - pl: "Olej to, nie warto."
        ru: "Забей на это, не стоит."
        source: { kind: authored }
      - pl: "Olał całą sprawę i wyjechał."
        ru: "Он забил на всё дело и уехал."
        source: { kind: authored }
      - pl: "Naszą prośbę po prostu olano."
        ru: "Нашу просьбу просто проигнорировали."
        source: { kind: authored }
notes:
  - { kind: register, text: "Второе значение — разговорное и грубоватое (pospolite), хотя слышится постоянно: «olej to» значит примерно «забей, плюнь». В официальной речи и на письме так не говорят; нейтральные замены — zignorować, zlekceważyć, nie przejmować się czymś." }
  - { kind: government, text: "olać coś, kogoś — ВИНИТЕЛЬНЫЙ падеж в оба значения: olać grządki «полить грядки», olać zebranie «забить на собрание». Дополнением свободно бывает человек, поэтому мужсколичное olani работает в обоих смыслах: olani wodą «облитые водой» и czuli się olani «они чувствовали себя отвергнутыми»." }
  - { kind: usage, text: "В форме мужского лица прошедшего времени два равноправных варианта: olali и oleli. PoliMorf даёт обоим одну и ту же помету praet:pl:m1.p1, и это общее свойство корня lać — lali наряду с leli. То же колебание у nagrzać: nagrzali и nagrzeli." }
  - { kind: false-friend, text: "Повелительная форма olej совпадает по написанию с существительным olej «масло», но слова неродственные: глагол идёт от lać «лить», а существительное — из латинского oleum. «Olej to!» значит «забей на это», а не что-либо про масло." }
collocations:
  - { pl: "olać grządki", ru: "полить грядки" }
  - { pl: "olać sprawę", ru: "забить на дело (разг.)" }
  - { pl: "czuć się olanym", ru: "чувствовать себя отвергнутым" }
family:
  - { pl: "olewać", ru: "обливать; забивать (разг.)", relation: aspect }
  - { pl: "lać", ru: "лить", relation: root, id: lac }
  - { pl: "zalać", ru: "залить", relation: derived }
  - { pl: "wylać", ru: "вылить", relation: derived }
etymology: "Приставка o- «вокруг, со всех сторон» и глагол lać, от праславянского *lьjati. Русское «лить» — прямой родственник, и буквальное значение совпадает с «облить». Разговорное «наплевать» выросло из той же картины пренебрежительного обливания — сравните русское «облить презрением»."
memory: "olać = o- + lać, корень тот же, что в русском «лить»: буквально «облить». Но в живой речи чаще значит «забить, наплевать»: olej to! А olej как существительное — это «масло», слово совсем другого происхождения."
idioms:
  - { pl: "olać coś", ru: "забить на что-л., наплевать (разг.)" }
  - { pl: "olany deszczem do nitki", ru: "облитый дождём до нитки" }
