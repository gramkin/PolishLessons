notes:
  - { kind: false-friend, text: "ОБОРОТ О БОЛЕЗНИ СТРОИТСЯ ИНАЧЕ, ЧЕМ В РУССКОМ. По-русски говорят «У РЕБЁНКА температура», по-польски — dziecko MA temperaturę, то есть «ребёнок ИМЕЕТ температуру», с винительным падежом. Безличная русская конструкция тут не работает. Так же говорят mieć gorączkę «иметь жар»." }
  - { kind: pronunciation, text: "ПРЕДЛОЖНЫЙ ПАДЕЖ МЕНЯЕТ R НА RZ: W TEMPERATURZE. Седьмой случай того же правила в словаре, после aktorze, rozmiarze, spacerze, garniturze, telewizorze и emeryturze. Пять слогов, ударение на предпоследнем: tem-pe-ra-TU-ra; читается без редукции: «тэмпэрату́ра»." }
  - { kind: usage, text: "Температуру МЕРЯЮТ — mierzyć temperaturę, а градусник это termometr. Выражения: temperatura pokojowa «комнатная температура», temperatura wrzenia «температура кипения», w temperaturze dwudziestu stopni. Прилагательное temperaturowy редкое; чаще говорят cieplny «тепловой»." }
collocations:
  - { pl: "mieć temperaturę", ru: "быть с температурой" }
  - { pl: "mierzyć temperaturę", ru: "мерить температуру" }
  - { pl: "temperatura pokojowa", ru: "комнатная температура" }
family:
  - { pl: "termometr", ru: "термометр", relation: derived }
  - { pl: "gorączka", ru: "жар, лихорадка", relation: derived }
  - { pl: "ciepło", ru: "тепло", relation: root }
etymology: "Из латинского temperatura «соразмерность, умеренность», от temperare «смешивать в меру» — того же корня, что temperament и umiarkowany. Сначала слово означало правильное соотношение стихий в теле, потом степень нагрева. В русский пришло тем же путём и в то же время."
memory: "temperatura — «температура», слово в слово. Запомнить надо оборот о болезни: не «у ребёнка температура», а dziecko MA temperaturę, с винительным. И предложный смягчает r в rz: w temperaturze."
idioms:
  - { pl: "mieć temperaturę", ru: "быть с температурой" }
  - { pl: "temperatura pokojowa", ru: "комнатная температура" }
