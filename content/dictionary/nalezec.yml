# review
id: nalezec
format: 2
lemma: "należeć"
rank: 412
pos: verb
aspect: imperf
pron: { cyr: "нале́жэць" }
senses:
  - id: belong-to
    ru: "принадлежать (кому-либо)"
    examples:
      - pl: "Do kogo to należy?"
        ru: "Кому это принадлежит?"
        source: { kind: tatoeba, id: 6554255 }
      - pl: "Te buty należą do Tom'a."
        ru: "Эта обувь принадлежит Тому."
        source: { kind: tatoeba, id: 3419129 }
      - pl: "Książka należy do dziewczyny."
        ru: "Книга принадлежит девушке."
        source: { kind: tatoeba, id: 13275699 }
  - id: be-member
    ru: "принадлежать (к группе), состоять, относиться"
    examples:
      - pl: "Należeli do klasy średniej."
        ru: "Они принадлежали к среднему классу."
        source: { kind: tatoeba, id: 7886529 }
      - pl: "Islandia należała kiedyś do Danii."
        ru: "Исландия когда-то принадлежала Дании."
        source: { kind: translated, id: 361323 }
      - pl: "Do którego klubu chciałby Pan należeć?"
        ru: "В каком клубе вы хотели бы состоять?"
        source: { kind: translated, id: 4432346 }
notes:
  - { kind: usage, text: "Всегда с предлогом do и родительным падежом, а не с дательным, как в русском: To należy do mnie «Это принадлежит мне», należeć do klubu «состоять в клубе»." }
  - { kind: usage, text: "Безличное należy значит «следует, надлежит»: Należy zapłacić «Надо заплатить». Należało mu się — «Так ему и надо»." }
  - { kind: usage, text: "należałoby — «следовало бы»: Spotkanie należałoby zakończyć «Встречу следовало бы закончить»." }
  - { kind: usage, text: "Do odważnych świat należy — «Смелость города берёт», буквально «Мир принадлежит смелым»." }
collocations:
  - { pl: "należeć do kogoś", ru: "принадлежать кому-либо" }
  - { pl: "należy", ru: "следует, надлежит" }
  - { pl: "należy się", ru: "причитается" }
  - { pl: "należeć do klubu", ru: "состоять в клубе" }
etymology: "Из na + leżeć «лежать» — буквально «лежать на ком-то», то есть быть за ним закреплённым. Русское «надлежать» собрано ровно так же и сохранило именно это значение."
memory: "należeć — «принадлежать», и внутри leżeć «лежать»: na + leżeć — это русское «надлежать». Отсюда и безличное należy «надлежит, следует». Главное отличие от русского: принадлежит не «кому», а do kogo — To należy do mnie."
idioms:
  - { pl: "do odważnych świat należy", ru: "смелость города берёт" }
  - { pl: "należy się", ru: "причитается" }
  - { pl: "należało mu się", ru: "так ему и надо" }
formExamplesSkip:
  - { form: "należawszy", reason: "причастие на -wszy образуется только от глаголов совершенного вида, а należeć несовершенный" }
