# review
id: wybrac
format: 2
lemma: "wybrać"
rank: 452
pos: verb
aspect: perf
pron: { cyr: "вы́браць" }
senses:
  - id: choose
    ru: "выбрать"
    examples:
      - pl: "Możesz wybrać, co chcesz."
        ru: "Ты можешь выбрать что хочешь."
        source: { kind: tatoeba, id: 12759520 }
      - pl: "Wybierz ten, który ci się podoba."
        ru: "Выбери тот, который тебе нравится."
        source: { kind: tatoeba, id: 6554261 }
      - pl: "Który rodzaj mąki wybrać?"
        ru: "Какой вид муки выбрать?"
        source: { kind: tatoeba, id: 6155981 }
  - id: elect
    ru: "избрать (на должность)"
    examples:
      - pl: "Został wybrany na prezydenta."
        ru: "Его избрали президентом."
        source: { kind: tatoeba, id: 588115 }
      - pl: "Wybrano go burmistrzem."
        ru: "Его избрали бургомистром."
        source: { kind: translated, id: 968961 }
      - pl: "Czy wybiorą go na następne cztery lata?"
        ru: "Изберут ли его на следующие четыре года?"
        source: { kind: translated, id: 2767522 }
notes:
  - { kind: usage, text: "Будущее берёт другую основу: wybiorę, wybierzesz, wybierze — при прошедшем wybrał." }
  - { kind: usage, text: "Возвратное wybrać się значит «собраться, отправиться куда-то»: wybierzmy się na spacer «пойдём погуляем»." }
  - { kind: usage, text: "wybrać numer — «набрать номер»: Zapomniałem podnieść słuchawkę przed wybraniem numeru." }
  - { kind: usage, text: "Несовершенный вид — wybierać. Существительное wybór значит «выбор», а во множественном — «выборы»." }
collocations:
  - { pl: "wybrać numer", ru: "набрать номер" }
  - { pl: "wybrać się na spacer", ru: "пойти погулять" }
  - { pl: "wybrać mniejsze zło", ru: "выбрать меньшее зло" }
  - { pl: "został wybrany", ru: "был избран" }
etymology: "Из wy- + brać; русское «выбрать» собрано ровно из тех же частей."
memory: "wybrać — «выбрать», слово буква в букву русское. Но будущее меняет основу: wybiorę, wybierzesz. А возвратное wybrać się значит «собраться куда-то»: wybierzmy się na spacer."
idioms:
  - { pl: "wybrać numer", ru: "набрать номер" }
  - { pl: "wybrać się na spacer", ru: "пойти погулять" }
  - { pl: "wybrać mniejsze zło", ru: "выбрать меньшее зло" }
