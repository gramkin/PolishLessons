notes:
  - { kind: usage, text: "В значении «покупки, поход за покупками» это слово употребляется только во множественном числе, и именно поэтому в таблице пять форм, а не десять: именительного единственного у него в этом смысле просто нет. Единственное ZAKUP существует, но означает отдельное приобретение в деловом языке — ZAKUP NIERUCHOMOŚCI «приобретение недвижимости», — и в магазин с ним не ходят. Так что весь набор начинается со множественного: ZAKUPY, ZAKUPÓW, ZAKUPOM, ZAKUPACH, ZAKUPAMI. Подобных слов в польском немало: DRZWI «дверь», SPODNIE «брюки», WAKACJE «каникулы», и у всех них единственного числа нет вовсе." }
  - { kind: false-friend, text: "Русское «закупки» значит совсем другое: это оптовое или государственное приобретение, и по-польски оно называется ZAMÓWIENIA PUBLICZNE или ZAKUPY HURTOWE. Польские ZAKUPY — это обычный поход в магазин, то, что по-русски называется «покупками». Поэтому IŚĆ NA ZAKUPY это «идти за покупками», а не «идти на закупки». Рядом стоит ZAKUPOWY «закупочный» — слово как раз деловое, и оно относится к ZAKUP, а не к ZAKUPY. Для самого магазина нужны другие слова: SKLEP «магазин», а не «склеп», и это ещё одна известная ловушка." }
  - { kind: government, text: "Только множественное число, мужской неличный род. «За покупками» о движении — предлог NA с винительным: IŚĆ NA ZAKUPY, WYBRAĆ SIĘ NA ZAKUPY. «За покупками» о нахождении там — NA с местным: BYĆ NA ZAKUPACH. Эта пара падежей после одного предлога работает в польском всюду, где есть выбор между направлением и местом. Частотные сочетания: ROBIĆ ZAKUPY «делать покупки», LISTA ZAKUPÓW «список покупок», TORBA NA ZAKUPY «сумка для покупок», DUŻE ZAKUPY «большие покупки», то есть закупка на неделю." }
  - { kind: pronunciation, text: "Читается «заку́пы», три слога, ударение на предпоследнем. Все гласные произносятся полно, без редукции: первый слог звучит «за», а не «зə». Буква U даёт «у», Y на конце — «ы», поэтому слово кончается на «пы», а не «пи». В родительном множественного ZAKUPÓW буква Ó читается «у», а конечное W оглушается до «ф»: «заку́пуф». В местном ZAKUPACH конечное CH даёт «х»: «заку́пах»." }
