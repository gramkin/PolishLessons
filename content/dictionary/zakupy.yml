etymology: "От ZAKUPIĆ, сложенного из ZA- и KUPIĆ, из праславянского *kupiti, которое само заимствовано из готского KAUPON «торговать», а то — из латинского CAUPO «торговец». Русские «купить», «купец», «покупка» идут из того же источника, так что корень общий и прозрачный. Разошлись языки в выборе приставки и числа: русский для бытового смысла взял ПО- и получил «покупки», допускающие единственное число, польский взял ZA- и закрепил за формой множественного исключительно бытовое значение, оставив единственное ZAKUP деловому языку. Такое разделение труда между числом и регистром для польского обычно: ср. WAKACJE «каникулы», у которых единственного числа тоже нет."
memory: "Только множественное: zakupy — «покупки», единственного в этом смысле нет, отсюда всего пять форм. Единственное zakup существует, но деловое: zakup nieruchomości. Русские «закупки» — это zamówienia publiczne, а не zakupy. Iść NA zakupy с винительным о движении, być NA zakupach с местным о месте. И рядом: sklep — это «магазин», не «склеп»."
