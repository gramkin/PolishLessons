# review
id: swinka
format: 2
lemma: "świnka"
rank: 5310
pos: noun
pron: { cyr: "сьви́нка" }
senses:
  - id: piggy
    ru: "свинка, поросёнок; копилка-свинка"
    examples:
      - pl: "Dzieci karmiły małą świnkę."
        ru: "Дети кормили маленькую свинку."
        source: { kind: authored }
      - pl: "Wrzucał monety do świnki."
        ru: "Он бросал монетки в копилку-свинку."
        source: { kind: authored }
      - pl: "Córka dostała świnkę morską."
        ru: "Дочь получила морскую свинку."
        source: { kind: authored }
  - id: mumps
    ru: "свинка (болезнь)"
    examples:
      - pl: "Syn zachorował na świnkę."
        ru: "Сын заболел свинкой."
        source: { kind: authored }
      - pl: "Świnka to choroba wieku dziecięcego."
        ru: "Свинка — детская болезнь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Как и в русском, ŚWINKA — и маленькая свинья, и болезнь «свинка». Добавьте два бытовых значения. ŚWINKA MORSKA — морская свинка, частый домашний питомец. И ŚWINKA — копилка в виде поросёнка: ROZBIĆ ŚWINKĘ — «разбить копилку». А ласковое TY ŚWINKO! говорят ребёнку, который перемазался." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: ŚWINCE. В родительном множественного беглое E: ŚWINEK. О болезни — только единственное число: CHOROWAĆ NA ŚWINKĘ." }
  - { kind: government, text: "Заболеть свинкой — ZACHOROWAĆ NA ŚWINKĘ, NA с винительным: польский болеет «на» болезнь. Бросить в копилку — WRZUCIĆ DO ŚWINKI, DO с родительным. Прививка от свинки — SZCZEPIONKA NA ŚWINKĘ." }
  - { kind: pronunciation, text: "Читается «сьви́нка», два слога, ударение на первом. Ś даёт мягкое «сь», как в ŚWINIA «сьви́ня». В форме ŚWINCE: «сьви́нце»." }
collocations:
  - { pl: "różowa świnka", ru: "розовая свинка" }
  - { pl: "rozbić świnkę", ru: "разбить копилку" }
  - { pl: "szczepionka na świnkę", ru: "прививка от свинки" }
family:
  - { pl: "swinia", ru: "свинья", relation: root, id: swinia }
  - { pl: "swinski", ru: "свиной; свинский", relation: derived }
  - { pl: "swiniak", ru: "кабанчик; свинья (разг.)", relation: derived }
etymology: "Уменьшительное от ŚWINIA, праславянского слова, общего с русским «свинья». Польское Ś на месте русского «с» перед «в» — мягкость, которую русский потерял: ŚWIAT и «свет», ŚWIECA и «свеча»."
memory: "Świnka — свинка: животное, копилка и болезнь. Świnka morska — морская свинка. Zachorować na świnkę — заболеть свинкой. Rozbić świnkę — разбить копилку. Читается «сьви́нка»."
idioms:
  - { pl: "świnka morska", ru: "морская свинка" }
  - { pl: "rozbić świnkę", ru: "разбить копилку, потратить сбережения" }
