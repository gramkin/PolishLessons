notes:
  - { kind: false-friend, text: "Русское «современный» покрывает два смысла, которые польский развёл по разным словам. WSPÓŁCZESNY значит «относящийся к нашему времени»: SZTUKA WSPÓŁCZESNA, HISTORIA WSPÓŁCZESNA, CZŁOWIEK WSPÓŁCZESNY. А NOWOCZESNY значит «новейший, оснащённый по последнему слову»: NOWOCZESNA KUCHNIA, NOWOCZESNY SPRZĘT. Сказать NOWOCZESNA SZTUKA можно, но это будет уже о модном виде, а не об эпохе." }
  - { kind: usage, text: "Все одиннадцать форм живые. Форма для мужчин-людей здесь не только существует, но и работает самостоятельно: WSPÓŁCZEŚNI без существительного значит «современники», NASI WSPÓŁCZEŚNI — «наши современники». Обратите внимание на чередование в этой форме: WSPÓŁCZESNY, но WSPÓŁCZEŚNI, где S переходит в Ś перед окончанием -I." }
  - { kind: government, text: "В современном мире — WE WSPÓŁCZESNYM ŚWIECIE, местный падеж, и заметьте предлог WE, а не W: перед скоплением согласных поляк вставляет гласную. В современном искусстве — W SZTUCE WSPÓŁCZESNEJ, местный, и SZTUKA здесь даёт SZTUCE. Прилагательное стоит после существительного: SZTUKA WSPÓŁCZESNA, HISTORIA WSPÓŁCZESNA." }
  - { kind: pronunciation, text: "Читается «фспуучэ́сны», четыре слога, ударение на предпоследнем. Начало слова самое трудное во всей карточке: W перед S оглушается и даёт «ф», Ó даёт «у», Ł тоже «у», и получается «фспуу». Ровно так записаны и однокоренные WSPÓŁPRACA «фспу́упраца» и WSPÓŁCZUCIE «фспуучу́це». Дальше CZE даёт «чэ», а конечная Y — «ы»." }
  - { kind: register, text: "Слово книжное, из языка школы, музея и критики. SZTUKA WSPÓŁCZESNA написано на входе в каждый музей современного искусства, HISTORIA WSPÓŁCZESNA — название школьного курса о времени после сорок пятого года. В разговоре о технике и о быте поляки скажут NOWOCZESNY, а WSPÓŁCZESNY оставят для эпохи и для искусства." }
