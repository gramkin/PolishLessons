  - { pl: "nowoczesny", ru: "современный, новейший (о технике, о быте)", relation: root }
  - { pl: "wspolczesnie", ru: "ныне, в наше время", relation: derived }
etymology: "Сложение из WSPÓŁ- «со-, вместе» и CZAS «время», то есть «тот, что одного с нами времени». Русское «современный» собрано ровно так же, морфема в морфему: «со» плюс «время». Это тот редкий случай, когда слово можно разобрать и собрать заново без всякого словаря. А вот NOWOCZESNY, собранное из NOWY и CZAS, это польское изобретение, и в русском ему отвечает то же «современный» — отсюда и вся путаница."
memory: "Относится к нашему времени: sztuka wspolczesna, historia wspolczesna. А «современный» о технике и о быте — это nowoczesny, другое слово, и путать их нельзя: русское «современный» покрывает оба смысла. Собрано как наше слово, wspol плюс czas, то есть «со» плюс «время». Читается «фспуучэ́сны», где w даёт «ф», а o с черточкой и l со штрихом дают два «у» подряд."
