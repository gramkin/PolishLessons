# review
id: intensywny
format: 2
lemma: "intensywny"
rank: 5017
pos: adj
pron: { cyr: "интэнсы́вны" }
senses:
  - id: intense
    ru: "интенсивный, напряжённый"
    examples:
      - pl: "To był intensywny tydzień."
        ru: "Это была напряжённая неделя."
        source: { kind: authored }
      - pl: "Ma intensywny trening dwa razy w tygodniu."
        ru: "У него интенсивные тренировки дважды в неделю."
        source: { kind: authored }
