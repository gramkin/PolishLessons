        ru: "Это самый интенсивный языковой курс в городе."
        source: { kind: authored }
  - id: vivid
    ru: "яркий, насыщенный (о цвете, запахе, вкусе)"
    examples:
      - pl: "Ma intensywny niebieski kolor."
        ru: "У него насыщенный синий цвет."
        source: { kind: authored }
      - pl: "Kawa ma intensywny aromat."
        ru: "У кофе насыщенный аромат."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «интенсивный» полное в значении «напряжённый». Но польское слово чаще говорят о цвете и запахе, где русский скажет «яркий, насыщенный»: INTENSYWNY CZERWONY, INTENSYWNY ZAPACH. А INTENSYWNA TERAPIA — «реанимация», отделение интенсивной терапии, OIOM." }
  - { kind: usage, text: "Полная парадигма: INTENSYWNY, INTENSYWNIEJSZY, NAJINTENSYWNIEJSZY. Все степени живые: CORAZ INTENSYWNIEJSZY. Мужское-личное: INTENSYWNI, INTENSYWNIEJSI, NAJINTENSYWNIEJSI — об интенсивно работающих людях, редко." }
  - { kind: government, text: "Ставится перед существительным: INTENSYWNY KURS, INTENSYWNY KOLOR. В термине — после: TERAPIA INTENSYWNA, OIOM. Наречие INTENSYWNIE — «интенсивно»: INTENSYWNIE PRACOWAĆ." }
  - { kind: pronunciation, text: "Читается «интэнсы́вны», четыре слога, ударение на предпоследнем. TE — твёрдое «тэ», SY — твёрдое «сы». В INTENSYWNIEJSZY: «интэнсывне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в спорте, медицине, обучении и описаниях цвета. ODDZIAŁ INTENSYWNEJ TERAPII — официальное название реанимации." }
collocations:
  - { pl: "intensywny kurs", ru: "интенсивный курс" }
  - { pl: "intensywna terapia", ru: "реанимация, интенсивная терапия" }
  - { pl: "intensywny kolor", ru: "насыщенный цвет" }
family:
  - { pl: "intensywnie", ru: "интенсивно", relation: derived }
  - { pl: "intensywność", ru: "интенсивность", relation: derived }
  - { pl: "silny", ru: "сильный", relation: root }
etymology: "Из латинского intensus, «напряжённый», от intendere «натягивать». Интенсивное — натянутое до предела, как струна. Тот же корень в польском INTENCJA, «намерение», и в русском «интенция»."
memory: "Intensywny — интенсивный, напряжённый: intensywny kurs; и насыщенный: intensywny kolor, intensywny zapach. Intensywna terapia — реанимация. Читается «интэнсы́вны»."
idioms:
  - { pl: "oddział intensywnej terapii", ru: "реанимационное отделение" }
