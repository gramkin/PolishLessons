# review
id: zewszad
format: 2
lemma: "zewsząd"
rank: 2347
pos: adv
pron: { cyr: "зэ́фшонт" }
senses:
  - id: from-everywhere
    ru: "отовсюду, со всех сторон"
    examples:
      - pl: "Ona była świecącym przykładem dla ludzi zewsząd."
        ru: "Она была ярким примером для людей отовсюду."
        source: { kind: translated, id: 3656382 }
      - pl: "Zwiększa ono ciemności otaczające nas zewsząd."
        ru: "Это лишь сгущает темноту, окружающую нас отовсюду."
        source: { kind: authored }
      - pl: "Zewsząd dochodziły krzyki."
        ru: "Отовсюду доносились крики."
        source: { kind: authored }
  - id: surrounded
    ru: "со всех сторон (об окружении)"
    examples:
      - pl: "Otoczyli nas zewsząd."
        ru: "Они окружили нас со всех сторон."
        source: { kind: authored }
      - pl: "Zewsząd napływały wiadomości."
        ru: "Со всех сторон приходили новости."
        source: { kind: authored }
      - pl: "Ludzie zjeżdżali się zewsząd."
        ru: "Люди съезжались отовсюду."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово сложено из ze + wsząd «всюду»; русское «отовсюду» собрано по той же модели." }
  - { kind: usage, text: "Пара к нему — wszędzie «везде» и donikąd «никуда»." }
  - { kind: usage, text: "Частое сочетание: otaczać zewsząd «окружать со всех сторон»." }
  - { kind: register, text: "Книжное; в разговоре скажут ze wszystkich stron." }
collocations:
  - { pl: "otaczać zewsząd", ru: "окружать со всех сторон" }
  - { pl: "zewsząd napływać", ru: "стекаться отовсюду" }
  - { pl: "ze wszystkich stron", ru: "со всех сторон" }
etymology: "Из ze + wsząd «всюду». Русское «отовсюду» собрано по той же модели из «от» и «всюду»."
memory: "zewsząd — «отовсюду, со всех сторон», сложено из ze + wsząd «всюду», ровно как русское «отовсюду». Книжное: в разговоре скажут ze wszystkich stron. Чаще всего идёт с глаголом окружения: otaczać zewsząd."
idioms:
  - { pl: "otaczać zewsząd", ru: "окружать со всех сторон" }
  - { pl: "zewsząd napływać", ru: "стекаться отовсюду" }
