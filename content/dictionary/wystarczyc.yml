# review
id: wystarczyc
format: 2
lemma: "wystarczyć"
rank: 398
pos: verb
aspect: perf
pron: { cyr: "выста́рчыць" }
senses:
  - id: suffice
    ru: "хватить, быть достаточным"
    examples:
      - pl: "Jeden raz wystarczy."
        ru: "Одного раза хватит."
        source: { kind: tatoeba, id: 5704245 }
      - pl: "Wystarczy na dzisiaj."
        ru: "На сегодня хватит."
        source: { kind: tatoeba, id: 565545 }
      - pl: "Wystarczy."
        ru: "Хватит."
        source: { kind: translated, id: 2244459 }
  - id: sufficed
    ru: "оказаться достаточным (о прошедшем)"
    examples:
      - pl: "To wystarczyło."
        ru: "Этого хватило."
        source: { kind: translated, id: 5704241 }
      - pl: "Kawałek chleb nie wystarczył, żeby zaspokoić jego głód."
        ru: "Куска хлеба не хватило, чтобы утолить его голод."
        source: { kind: translated, id: 1274211 }
      - pl: "Obietnice nie wystarczą."
        ru: "Обещаний не хватит."
        source: { kind: translated, id: 7881221 }
notes:
  - { kind: usage, text: "Главная конструкция безличная: Wystarczy «Хватит», To wystarczy «Этого хватит». Подлежащее — то, чего хватает, а не тот, кому хватает." }
  - { kind: usage, text: "wystarczy + инфинитив значит «достаточно сделать что-то»: Wystarczy zadzwonić «Достаточно позвонить»." }
  - { kind: usage, text: "Личные формы (wystarczę, wystarczysz) грамматически возможны и значат «меня хватит, тебя хватит», но в речи почти не встречаются." }
  - { kind: usage, text: "Несовершенный вид — wystarczać. Есть и бесприставочное starczyć с тем же значением: Starczy! «Хватит!»" }
collocations:
  - { pl: "to wystarczy", ru: "этого хватит" }
  - { pl: "wystarczy zadzwonić", ru: "достаточно позвонить" }
  - { pl: "nie wystarczyć", ru: "не хватить" }
etymology: "Из wy- + starczyć «хватать». Приставка wy- вносит оттенок исчерпанности — хватить сполна, до конца. Бесприставочное starczyć живо и сегодня: Starczy! «Хватит!»"
memory: "wystarczy — «хватит», и почти всегда безлично: To wystarczy «Этого хватит», Wystarczy zadzwonić «Достаточно позвонить». Подлежащее здесь — то, чего хватает, а не тот, кому хватает."
idioms:
  - { pl: "to wystarczy", ru: "этого хватит" }
  - { pl: "wystarczy zadzwonić", ru: "достаточно позвонить" }
  - { pl: "słowa nie wystarczą", ru: "одних слов будет мало" }
