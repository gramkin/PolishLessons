pos: noun
pron: { cyr: "пшы́туп" }
senses:
  - id: stamp
    ru: "притоп (в танце), удар ногой об пол"
    examples:
      - pl: "Tancerze zakończyli taniec głośnym przytupem."
        ru: "Танцоры закончили танец громким притопом."
