      - pl: "Krakowiak słynie z energicznych przytupów."
        ru: "Краковяк славится энергичными притопами."
        source: { kind: authored }
      - pl: "Każdy przytup odbijał się echem w sali."
        ru: "Каждый притоп отдавался эхом в зале."
        source: { kind: authored }
  - id: verve
    ru: "с размахом, с огоньком (в обороте Z PRZYTUPEM)"
    examples:
      - pl: "Wesele było z przytupem."
        ru: "Свадьбу сыграли с размахом."
        source: { kind: authored }
      - pl: "Sezon zaczęliśmy z przytupem."
        ru: "Сезон мы начали с огоньком."
        source: { kind: authored }
      - pl: "Pożegnali emeryta z przytupem."
        ru: "Пенсионера проводили с размахом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Мужской род, неодушевлённое: родительный PRZYTUPU, местный PRZYTUPIE. Чаще всего слово встречается в обороте Z PRZYTUPEM — «с размахом, с огоньком, громко»: о празднике, начале сезона, выходе на рынок." }
  - { kind: false-friend, text: "PRZYTUP — один удар ногой в танце, как русский «притоп». Долгий шум шагов — TUPOT: TUPOT NÓG «топот ног»." }
  - { kind: pronunciation, text: "RZ после P оглушается: «пшы́туп». Ударение на первом слоге." }
collocations:
  - { pl: "z przytupem", ru: "с размахом, с огоньком" }
  - { pl: "głośny przytup", ru: "громкий притоп" }
  - { pl: "taniec z przytupami", ru: "танец с притопами" }
family:
  - { pl: "tupać", ru: "топать", relation: root }
  - { pl: "przytupywać", ru: "притопывать", relation: derived }
  - { pl: "tupot", ru: "топот", relation: root }
etymology: "От TUPAĆ «топать» с приставкой PRZY-, как русское «притоп» от «топать»."
memory: "Przytup — притоп: PRZY = при, TUP = топ. Z przytupem — с огоньком."
