# review
id: przyjaciolka
format: 2
lemma: "przyjaciółka"
rank: 679
pos: noun
pron: { cyr: "пшыячу́ука" }
senses:
  - id: female-friend
    ru: "подруга (приятельница)"
    note: "Не «девушка-партнёрша» — это dziewczyna."
    examples:
      - pl: "Moja przyjaciółka mieszka w Pradze."
        ru: "Моя подруга живёт в Праге."
        source: { kind: tatoeba, id: 12470134 }
      - pl: "To moja przyjaciółka."
        ru: "Это моя подруга."
        source: { kind: translated, id: 13228536 }
      - pl: "To moja przyjaciółka Mari."
        ru: "Это моя подруга Мари."
        source: { kind: translated, id: 10548504 }
  - id: best-friend
    ru: "najlepsza przyjaciółka — лучшая подруга"
    examples:
      - pl: "Tom jest zakochany w najlepszej przyjaciółce Marii."
        ru: "Том влюблён в лучшую подругу Марии."
        source: { kind: tatoeba, id: 3176869 }
      - pl: "Była moją najlepszą przyjaciółką."
        ru: "Она была моей лучшей подругой."
        source: { kind: tatoeba, id: 3460168 }
      - pl: "Zakochał się w swojej najlepszej przyjaciółce."
        ru: "Он влюбился в свою лучшую подругу."
        source: { kind: translated, id: 3530786 }
  - id: be-friends
    ru: "być przyjaciółkami — быть подругами (творительный)"
    examples:
      - pl: "Jesteśmy przyjaciółkami."
        ru: "Мы подруги."
        source: { kind: translated, id: 8652333 }
      - pl: "Magdalena i Ania są przyjaciółkami."
        ru: "Магдалена и Аня — подруги."
        source: { kind: translated, id: 919237 }
      - pl: "Jesteś moją przyjaciółką."
        ru: "Ты моя подруга."
        source: { kind: tatoeba, id: 4933432 }
notes:
  - { kind: false-friend, text: "Русское «подруга» двузначно — и приятельница, и девушка-партнёрша. Польский разводит эти смыслы: przyjaciółka это подруга-друг, а девушка в романтическом смысле — dziewczyna." }
  - { kind: usage, text: "Женская пара к przyjaciel «друг», образованная суффиксом -ka." }
  - { kind: government, text: "«Быть подругами» требует творительного: jesteśmy przyjaciółkami, została moją przyjaciółką." }
  - { kind: usage, text: "В родительном множественного появляется беглое e: przyjaciółka — przyjaciółek." }
collocations:
  - { pl: "najlepsza przyjaciółka", ru: "лучшая подруга" }
  - { pl: "być przyjaciółkami", ru: "быть подругами" }
  - { pl: "przyjaciel", ru: "друг" }
  - { pl: "dziewczyna", ru: "девушка" }
family:
  - { pl: "przyjaciel", ru: "друг", relation: root }
  - { pl: "przyjaźń", ru: "дружба", relation: derived }
  - { pl: "dziewczyna", ru: "девушка", relation: root }
etymology: "От przyjaciel «друг», а тот от przyjać «благоволить», праславянское *prijati — то же гнездо, что русские «приятель», «приязнь» и «приятный»."
memory: "przyjaciółka — «подруга», женская пара к przyjaciel. Главное — не спутать её с dziewczyna: русское «подруга» покрывает и приятельницу, и девушку-партнёршу, а польский эти смыслы разводит. «Быть подругами» требует творительного: jesteśmy przyjaciółkami. И запомните беглое e в родительном множественного — przyjaciółek."
idioms:
