# review
id: kaplan
format: 2
lemma: "kapłan"
rank: 4873
pos: noun
pron: { cyr: "ка́пуан" }
senses:
  - id: priest
    ru: "священник, жрец (книжн.)"
    examples:
      - pl: "Kapłan odprawił mszę."
        ru: "Священник отслужил мессу."
        source: { kind: authored }
      - pl: "W świątyni modlili się kapłani."
        ru: "В храме молились жрецы."
        source: { kind: authored }
      - pl: "Został kapłanem w wieku dwudziestu pięciu lat."
        ru: "Он стал священником в двадцать пять лет."
        source: { kind: authored }
  - id: devotee
    ru: "жрец, служитель (перен.)"
    examples:
      - pl: "Był kapłanem sztuki."
        ru: "Он был служителем искусства."
        source: { kind: authored }
      - pl: "Kapłani mody decydują o trendach."
        ru: "Жрецы моды определяют тренды."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KAPŁAN — «священник» в высоком стиле или «жрец» в древних религиях. В быту о католическом священнике — KSIĄDZ. Жрица — KAPŁANKA. Священство — KAPŁAŃSTWO." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Множественное — KAPŁANI. Местный и звательный — KAPŁANIE." }
  - { kind: government, text: "Стать священником — ZOSTAĆ KAPŁANEM, творительный. Рукоположить в священники — WYŚWIĘCIĆ NA KAPŁANA, NA с винительным." }
  - { kind: pronunciation, text: "Читается «ка́пуан»: Ł — «у». Ударение на первом слоге. KAPŁANI — «капуа́ни»." }
collocations:
  - { pl: "najwyższy kapłan", ru: "верховный жрец" }
  - { pl: "zostać kapłanem", ru: "стать священником" }
  - { pl: "kapłan sztuki", ru: "служитель искусства" }
family:
  - { pl: "ksiądz", ru: "ксёндз, священник", relation: root, id: ksiadz }
  - { pl: "kapłanka", ru: "жрица", relation: derived }
  - { pl: "świątynia", ru: "храм", relation: root, id: swiatynia }
etymology: "Старое заимствование, вероятно через чешский, из латинского CAPELLANUS «капеллан». Русское «капеллан» — того же происхождения."
memory: "Kapłan — священник (высок.), жрец; в быту — ksiądz. Kapłani — жрецы. Читается «ка́пуан»."
idioms:
  - { pl: "najwyższy kapłan", ru: "первосвященник, главный авторитет" }
