etymology: "От POWIETRZE «воздух», которое собрано из приставки PO- и корня *vetrъ, давшего WIATR «ветер» и русский «ветер». То есть воздух по-польски назван через ветер: «то, что вокруг ветра», движущаяся среда. Русский для того же понятия построил «воздух» из «воз-» и «дух», то есть «поднимающееся дыхание», и взял совсем другой образ. Оба слова сложные и оба прозрачные, но составлены из разных частей, так что для русскоговорящего POWIETRZE приходится учить отдельно — зато через WIATR оно запоминается сразу. Суффикс -NY даёт здесь относительное прилагательное, и это он отвечает за отсутствие степеней сравнения, хотя тот же суффикс в DOSTĘPNY дал качественное: решает значение, не суффикс."
memory: "Относительное: одиннадцать форм, степеней нет, как у sportowy и poranny. Под ним существительное другого состава: powietrze собрано из po- и wiatr «ветер», а русское «воздух» — из «воз-» и «дух»; родства нет, но запоминается через wiatr. Сочетание trz читается «тш», как в patrzyć. Poduszka powietrzna значит «подушка безопасности». «По воздуху» — drogą powietrzną."
