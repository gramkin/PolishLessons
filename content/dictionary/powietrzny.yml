notes:
  - { kind: government, text: "Прилагательное относительное: одиннадцать форм, степеней сравнения нет. POWIETRZNIEJSZY не существует, потому что нельзя быть «воздушнее» в смысле «более относящимся к воздуху». Это тот же случай, что SPORTOWY и PORANNY, и противоположный качественному DOSTĘPNY с его тридцатью тремя формами. Определение ставится после существительного в терминологических сочетаниях: TRANSPORT POWIETRZNY, SIŁY POWIETRZNE, PODUSZKA POWIETRZNA. Когда нужна степень в переносном смысле, о легкости, берут другое слово: LEKKI, ULOTNY." }
  - { kind: false-friend, text: "Значение отвечает русскому «воздушному», и расхождение не в прилагательном, а в существительном под ним. POWIETRZE «воздух» и русское «воздух» — слова разного состава, хотя оба сложные. Польское POWIETRZE собрано из PO- и корня WIATR «ветер»: буквально «то, что вокруг ветра». Русское «воздух» — из «воз-» и «дух», то есть «поднимающееся дыхание». Поэтому родства тут нет, и угадать POWIETRZE через «воздух» нельзя, зато можно через WIATR и «ветер». Полезно знать и то, что PODUSZKA POWIETRZNA значит именно «подушка безопасности» в автомобиле, а не воздушную подушку в физическом смысле." }
  - { kind: pronunciation, text: "Читается «пове́тшны», ударение на предпоследнем слоге из трёх. Сочетание TRZ даёт «тш»: R после глухого T оглушается, и три согласных идут подряд — то же явление, что в PATRZYĆ «патшыць». Конечное -Y звучит «ы». В форме мужского лица множественного POWIETRZNI слышно «пове́тшни», с мягким н. В четырёхсложных формах вроде POWIETRZNEGO ударение сдвигается вправо, на предпоследний слог: «поветшне́го»." }
  - { kind: usage, text: "Частотные сочетания целиком: SIŁY POWIETRZNE «военно-воздушные силы», TRANSPORT POWIETRZNY, PODUSZKA POWIETRZNA «подушка безопасности», LINIA POWIETRZNA «воздушная линия», ATAK POWIETRZNY, PRZESTRZEŃ POWIETRZNA «воздушное пространство». Существительное POWIETRZE входит в обороты NA ŚWIEŻYM POWIETRZU «на свежем воздухе» и WYSADZIĆ W POWIETRZE «взорвать», буквально «подбросить в воздух». Наречия от прилагательного нет; «по воздуху» передают оборотом DROGĄ POWIETRZNĄ." }
