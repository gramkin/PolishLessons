etymology: "Приставка ZA- и корень, восходящий к праславянскому *měna «мена», от которого русские «мена», «менять», «замена», «обмен». Корень один и тот же, и приставки те же, поэтому вся эта семья в двух языках совпадает почти целиком. Разница только в распределении: польский отдал ZA- обмену, а Z- перемене, и потому ZAMIANA и ZMIANA различаются одной буквой при разных смыслах. В русском приставки распределились иначе, «за-» и «с-», и потому «замена» и «смена» на слух различаются сильнее. Так что путаница тут не от чужого слова, а от того, что знакомые части сложены чуть иначе."
memory: "Одна буква меняет смысл: ZAMIANA — обмен, ZMIANA — перемена или смена. Чего на что — через NA с винительным: zamiana złotówek NA euro. Оборот w zamian za значит «взамен, в обмен на». Читается «замя́на», mia — это «мя»."
idioms:
  - { pl: "w zamian za", ru: "в обмен на, взамен" }
  - { pl: "zamiana ról", ru: "смена ролей" }
