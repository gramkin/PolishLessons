notes:
  - { kind: false-friend, text: "Ловушка в одной букве, и она разводит два частых слова. ZAMIANA — это обмен: одно отдали, другое взяли, ZAMIANA MIESZKANIA, ZAMIANA MIEJSC. ZMIANA — это перемена или смена: ZMIANA POGODY «перемена погоды», ZMIANA NOCNA «ночная смена». Различает их только a после z. Русский делит почти так же: «замена» ближе к ZAMIANA, «смена» и «изменение» — к ZMIANA. Проверять стоит по смыслу: если есть что-то взамен, это ZAMIANA; если просто стало иначе, это ZMIANA." }
  - { kind: government, text: "Чего на что — родительный плюс предлог NA с винительным: ZAMIANA ZŁOTÓWEK NA EURO, ZAMIANA MIESZKANIA NA MNIEJSZE. Отдельно стоит запомнить оборот W ZAMIAN ZA COŚ «в обмен на что-то»: здесь W ZAMIAN — застывшая форма родительного множественного, употребляемая как наречие, а после ZA идёт винительный. Русское «взамен» устроено так же, из предлога и падежной формы, и это облегчает запоминание." }
  - { kind: pronunciation, text: "Читается «замя́на», в три слога, с ударением на предпоследнем. Сочетание mia даёт «мя»: i здесь не гласная, а знак мягкости предыдущего согласного, поэтому не «за-ми-а-на», а «за-мя-на». В предложном падеже ZAMIANIE — «замя́не». Та же мягкость в ZMIANA «змя́на», и различать их на слух надо по первому слогу: «за» против «з»." }
  - { kind: usage, text: "Первое значение самое частое и всегда предполагает взаимность: обменялись, и у каждого теперь другое. Второе шире и взаимности не требует: ZAMIANA SŁOWA, ZAMIANA LICZBY NA LITERĘ — просто поставили одно вместо другого. В юридических и бытовых текстах обычны UMOWA ZAMIANY «договор обмена» и ZAMIANA MIESZKAŃ. Глагол к существительному — ZAMIENIĆ, и он тоже требует NA: ZAMIENIĆ ZŁOTÓWKI NA EURO." }
