notes:
  - { kind: usage, text: "Это слово устроено странно, и самое приятное в нём то, что по-русски оно устроено точно так же. SŁUGA — существительное мужского рода, но в единственном числе склоняется как женское: SŁUGA, SŁUGI, SŁUDZE, SŁUGĘ, SŁUGĄ, то есть по образцу слова KOBIETA. При этом согласование остаётся мужским: WIERNY SŁUGA, а не «wierna». Во множественном числе появляется мужско-личная форма SŁUDZY с чередованием G в DZ. Русская «слуга» ведёт себя одинаково: «верный слуга», но «слуги, слуге, слугу, слугой». Так что запоминать тут нечего, всё уже знакомо." }
  - { kind: pronunciation, text: "Читается «суу́га», и это выглядит страннее, чем звучит. Буква Ł даёт «у», а следующая за ней U — тоже «у», поэтому в начале слова два «у» подряд: «суу». Ударение на предпоследнем слоге, то есть на этом самом «у». Во всех падежах картина та же: SŁUGI это «суу́ги», SŁUDZY «суу́дзы». Чтение «слуга», по русскому образцу, будет ошибкой, хотя слово то же самое. Сочетание DZ в SŁUDZY звучит как слитное «дз», одним звуком." }
  - { kind: government, text: "Чей слуга — родительный падеж без предлога: SŁUGA BOŻY, SŁUGA LUDU, SŁUGA DWÓCH PANÓW. Кому служат — дательный при глаголе SŁUŻYĆ: SŁUŻYĆ KOMUŚ, ровно как русское «служить кому-то». Отдельно стоит отметить форму в предложении с отрицанием и творительным: NIE JESTEM TWOIM SŁUGĄ, где после NIE JESTEM идёт творительный, тогда как русский говорит «я тебе не слуга», с дательным. Это общая разница: польское BYĆ требует творительного там, где русский обходится именительным или дательным." }
  - { kind: register, text: "Слово историческое и книжное: усадьба, Библия, старая литература. В современном быту прислугу называют иначе — POMOC DOMOWA «домашняя помощница», а государственную службу SŁUŻBA CYWILNA. Зато в переносном смысле слово живо и сердито: NIE JESTEM TWOIM SŁUGĄ значит ровно «я тебе не слуга». Сохранилась и вежливая формула старого письма, PANA UNIŻONY SŁUGA, которой отвечает русское «ваш покорный слуга». Два родительных множественного, SŁUG и SŁUGÓW, оба правильны, но SŁUG обычнее." }
  - { kind: false-friend, text: "Спутать само слово трудно, а вот его родню легко. SŁUŻBA значит и «служба», и «прислуга» как собирательное: CAŁA SŁUŻBA ZEBRAŁA SIĘ W KUCHNI — «вся прислуга собралась на кухне». SŁUŻĄCY, в отличие от SŁUGA, это именно наёмный слуга при доме, прислуга по должности, тогда как SŁUGA звучит высоко и старомодно. А SŁUŻBOWY значит «служебный, по работе»: WYJAZD SŁUŻBOWY это «командировка», а не поездка слуги." }
