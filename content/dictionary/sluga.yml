etymology: "То же праславянское слово, что русская «слуга», и значение не сдвинулось ни на шаг. Разошлось только звучание: польское Ł, бывшее твёрдое «л», перешло в «у», и слово стало звучать «суу́га» там, где русский говорит «слуга». Корень дал оба языка целым гнездом: SŁUŻYĆ и «служить», SŁUŻBA и «служба», SŁUGA и «слуга», и даже редкое польское SŁUŻALEC отвечает русскому «прислужник». Общий у слов и грамматический курьёз: мужской род при женском склонении, который оба языка унаследовали от праславянского и сохранили до сих пор."
memory: "То же слово, что «слуга», и с тем же курьёзом: мужской род, а склонение женское, wierny sługa но sługi, słudze, sługę, sługą. Русский делает ровно то же, так что запоминать нечего. Читается «суу́га», потому что ł это «у», а за ним ещё одно u, два «у» подряд. Множественное słudzy, с чередованием g и dz. Запомнить оборот nie jestem twoim sługą, где после być идёт творительный, а не дательный, как в русском."
