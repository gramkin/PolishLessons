notes:
  - { kind: government, text: "Средний род на -O, и слово склоняется: восемь форм. Именительный и винительный BINGO, родительный BINGA, дательный и местный BINGU, творительный BINGIEM, родительный множественного BING без окончания, дальше BINGOM, BINGAMI, BINGACH. Русское «бинго» не склоняется вовсе, и это главное формальное различие. Где играют — предлог W с местным: W BINGU. Во что играют — предлог W с винительным: GRAĆ W BINGO, и здесь форма остаётся неизменной, потому что винительный равен именительному." }
  - { kind: false-friend, text: "Значение совпадает с русским «бинго» в обоих употреблениях, и в игре, и в восклицании. Расхождение только в склонении, зато оно показательно. Польский втягивает заимствования среднего рода на -O в обычное склонение: ECHO даёт ECHA и ECH, KASYNO даёт KASYNA и KASYN, BINGO даёт BINGA и BING. Русский оставляет такие слова неизменными. Но и в польском есть исключения — WIDEO не склоняется вовсе, как и RADIO в части форм, потому что -EO и -IO не укладываются ни в один тип. Поэтому правило надо помнить с оговоркой: -O склоняется, -EO и -IO нет." }
  - { kind: pronunciation, text: "Читается «би́нго», ударение на предпоследнем слоге из двух. Сочетание NG произносится как два отдельных звука, «н» и «г», а не как носовой призвук: «бин-го». В родительном BINGA слышно «би́нга». В творительном BINGIEM сочетание GIE даёт мягкое «ге»: «би́нгем». В родительном множественного BING один слог и конечное G оглушается в «к»: «бинк»." }
  - { kind: usage, text: "Частотные сочетания: GRAĆ W BINGO, WYGRAĆ W BINGU, BINGO TOWARZYSKIE «домашнее бинго». Как восклицание слово употребляется самостоятельно и неизменно: BINGO! — и отвечает русскому «бинго!» или «в точку!». Множественное число BINGA встречается редко и означает отдельные мероприятия: ORGANIZOWALI BINGA W KAŻDĄ SOBOTĘ. Рядом стоит LOTERIA «лотерея» и LOSOWANIE «розыгрыш», и путать их с BINGO не следует: бинго — игра с карточками, а не розыгрыш билетов." }
