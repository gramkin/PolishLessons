etymology: "Из английского BINGO, названия игры, появившегося в двадцатых годах двадцатого века; само слово, по-видимому, звукоподражательное восклицание радости, вроде BANG, и первым было именно восклицание, а название игры выросло из него. Польский и русский взяли слово из английского в готовом виде и в оба значения сразу, поэтому смысл совпадает целиком. Разошлись языки в обращении с формой: польский подчинил слово склонению среднего рода, как ECHO и KASYNO, а русский оставил неизменным, как «метро» и «кино». Это различие устойчиво и объясняет целую группу расхождений между двумя языками, где смысл один, а грамматика разная."
memory: "Склоняется, в отличие от русского «бинго»: binga, bingu, bingiem, родительный множественного bing. Та же группа, что echo и kasyno. Но с оговоркой: wideo не склоняется вовсе, потому что -eo и -io не укладываются ни в один тип. Играть — grać w bingo, винительный равен именительному; выиграть — wygrać w bingu, местный. Как восклицание слово неизменно."
