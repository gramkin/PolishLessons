senses:
  - id: cave
    ru: "пещера"
    examples:
      - pl: "To jest jaskinia."
        ru: "Это пещера."
        source: { kind: tatoeba, id: 2863615 }
      - pl: "Tom ukrył się w jaskini."
        ru: "Том спрятался в пещере."
        source: { kind: tatoeba, id: 12710236 }
