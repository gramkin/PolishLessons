  - id: den
    ru: "пещера, логово"
    examples:
      - pl: "Jaskinia jest pełna nietoperzy."
        ru: "Пещера полна летучих мышей."
        source: { kind: translated, id: 4837570 }
      - pl: "Badacze odkryli szkielet w jaskini."
        ru: "Исследователи обнаружили в пещере скелет."
        source: { kind: translated, id: 8537497 }
notes:
  - { kind: government, text: "Женский род: ta jaskinia, tej jaskini. Предложный и родительный совпадают — w jaskini «в пещере», z jaskini «из пещеры»." }
  - { kind: false-friend, text: "Русское «пещера» восходит к «печь» — образ свода. Польское jaskinia на этот корень не опирается, и с jaskrawy «яркий» оно тоже не связано, несмотря на созвучие." }
  - { kind: usage, text: "Пещерный человек — jaskiniowiec. Переносно jaskinia hazardu «игорный притон»." }
  - { kind: usage, text: "Множественное jaskinie «пещеры»: zwiedzać jaskinie «осматривать пещеры»." }
collocations:
  - { pl: "w jaskini", ru: "в пещере" }
  - { pl: "zwiedzać jaskinie", ru: "осматривать пещеры" }
etymology: "Праславянское слово со значением «укрытие, нора». Русское «пещера» — от «печь», другой образ."
memory: "jaskinia — «пещера», женского рода. В пещере — w jaskini. Пещерный человек — jaskiniowiec."
idioms:
  - { pl: "w jaskini", ru: "в пещере" }
formExamplesSkip:
  - { form: "jaskinio", reason: "звательная форма, а jaskinia — это пещера. Обращаться к ней некому, поэтому форма остаётся только в таблице склонения" }
