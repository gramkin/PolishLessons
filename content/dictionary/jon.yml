notes:
  - { kind: false-friend, text: "JON — «ион», а не английское имя JON и не JOT «йота». Пишется через J, потому что польский не любит сочетание IO в начале слова: JON, JONIZACJA, но русское «ион», «ионизация»." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — JONU, множественное — JONY, JONÓW. Прилагательное — JONOWY: BATERIA LITOWO-JONOWA «литий-ионная батарея»." }
  - { kind: government, text: "Чего — родительный: JON SODU, JONY WAPNIA. Какой — прилагательное: JON DODATNI «положительный ион», JON UJEMNY «отрицательный»." }
  - { kind: pronunciation, text: "Читается «йон», один слог: J — «й». JONÓW — «йо́нуф»." }
  - { kind: register, text: "Научное слово: химия, физика, реклама техники." }
collocations:
  - { pl: "jon dodatni", ru: "положительный ион" }
  - { pl: "jon ujemny", ru: "отрицательный ион" }
  - { pl: "bateria litowo-jonowa", ru: "литий-ионный аккумулятор" }
family:
  - { pl: "jonowy", ru: "ионный", relation: derived }
  - { pl: "jonizacja", ru: "ионизация", relation: derived }
  - { pl: "chemia", ru: "химия", relation: root, id: chemia }
etymology: "Из греческого ION «идущий», причастия от IENAI «идти»: слово ввёл Майкл Фарадей для частиц, которые движутся к электроду."
memory: "Jon — ион, через J: jony sodu. Jonowy — ионный: bateria litowo-jonowa."
idioms:
  - { pl: "jony ujemne", ru: "отрицательные ионы (о «свежем» воздухе в рекламе)" }
