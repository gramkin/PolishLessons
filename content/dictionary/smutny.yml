# review
id: smutny
format: 2
lemma: "smutny"
rank: 1060
pos: adj
pron: { cyr: "сму́тны" }
senses:
  - id: sad-person
    ru: "грустный, печальный (о человеке)"
    examples:
      - pl: "Czemuś taki smutny?"
        ru: "Почему ты такой грустный?"
        source: { kind: tatoeba, id: 924525 }
      - pl: "Dlaczego jesteś taki smutny?"
        ru: "Почему ты такой грустный?"
        source: { kind: tatoeba, id: 531670 }
      - pl: "Wygląda na smutną."
        ru: "Она выглядит грустной."
        source: { kind: tatoeba, id: 610625 }
  - id: sad-thing
    ru: "печальный, грустный (о новости, истории, фильме)"
    examples:
      - pl: "To smutna historia."
        ru: "Это грустная история."
        source: { kind: tatoeba, id: 4716805 }
      - pl: "Mam smutną wiadomość."
        ru: "У меня есть грустная новость."
        source: { kind: tatoeba, id: 4717724 }
      - pl: "Ta piosenka jest piękna i smutna."
        ru: "Это песня красивая и грустная."
        source: { kind: tatoeba, id: 12949393 }
notes:
  - { kind: false-friend, text: "Классический ложный друг: smutny значит «грустный», а не «смутный». Русское «смутный» будет mglisty, niewyraźny: mgliste wspomnienie «смутное воспоминание»." }
  - { kind: usage, text: "Гнездо прозрачное: smutek «грусть, печаль», smucić się «грустить», smutno «грустно». Очень частое безличное smutno mi «мне грустно» — с дательным, как в русском." }
  - { kind: usage, text: "Степени сравнения правильные: smutny → smutniejszy → najsmutniejszy." }
collocations:
  - { pl: "smutna historia", ru: "грустная история" }
  - { pl: "smutna wiadomość", ru: "печальная новость" }
  - { pl: "smutno mi", ru: "мне грустно" }
  - { pl: "smutny film", ru: "грустный фильм" }
family:
  - { pl: "smutek", ru: "грусть, печаль", relation: derived }
  - { pl: "smucić się", ru: "грустить", relation: derived }
  - { pl: "smutno", ru: "грустно", relation: derived }
etymology: "Отмечено с XV века как фонетический вариант старого smętny; в основе та же праславянская основа, что в русских «смутный» и «смута». В польском значение сузилось до «грустный», в русском ушло в сторону «неясный»."
memory: "smutny — «грустный», и это ложный друг: русское «смутный» тут ни при чём, оно будет mglisty или niewyraźny. Гнездо запоминается целиком: smutek «печаль», smucić się «грустить», smutno «грустно». Очень частая безличная конструкция smutno mi «мне грустно» — с дательным, ровно как в русском. Сравнение обычное: smutniejszy, najsmutniejszy."
idioms:
  - { pl: "smutno mi", ru: "мне грустно" }
  - { pl: "smutna prawda", ru: "печальная правда" }
  - { pl: "ze smutną miną", ru: "с грустным видом" }
