# review
id: wiara
format: 2
lemma: "wiara"
rank: 907
pos: noun
pron: { cyr: "вя́ра" }
senses:
  - id: faith
    ru: "вера"
    examples:
      - pl: "Wiara czyni cuda!"
        ru: "Вера творит чудеса!"
        source: { kind: tatoeba, id: 1430399 }
      - pl: "Wiara czyni cuda."
        ru: "Вера творит чудеса."
        source: { kind: translated, id: 13030173 }
      - pl: "Wiara przenosi góry."
        ru: "Вера двигает горы."
        source: { kind: translated, id: 13669966 }
  - id: lose-keep
    ru: "stracić wiarę, mieć wiarę — потерять веру, верить"
    examples:
      - pl: "Miej wiarę."
        ru: "Имей веру."
        source: { kind: translated, id: 10595254 }
      - pl: "Straciłem wiarę."
        ru: "Я потерял веру."
        source: { kind: translated, id: 532116 }
      - pl: "Nie trać wiary."
        ru: "Не теряй веру."
        source: { kind: tatoeba, id: 2043649 }
  - id: unbelievable
    ru: "nie do wiary — невероятно, поверить нельзя"
    note: "Готовая формула изумления."
    examples:
      - pl: "Nie do wiary!"
        ru: "Невероятно!"
        source: { kind: tatoeba, id: 980938 }
      - pl: "Nie do wiary, że fotografujesz karaluchy."
        ru: "Поверить не могу, что ты фотографируешь тараканов."
        source: { kind: tatoeba, id: 964425 }
      - pl: "Nie do wiary, jak szybko urósł."
        ru: "Поверить нельзя, как быстро он вырос."
        source: { kind: authored }
notes:
  - { kind: usage, text: "nie do wiary — «невероятно, поверить не могу», очень частая разговорная формула: Nie do wiary! «Невероятно!»." }
  - { kind: false-friend, text: "Осторожно с формой wierze. Это дательный и предложный падеж от wiara («вере, о вере»), но так же звучит и форма глагола wierzyć. Различает контекст: w wierze «в вере», но wierzę ci «я тебе верю»." }
  - { kind: usage, text: "w dobrej wierze — «добросовестно, из лучших побуждений», юридический и обиходный оборот. Противоположность — w złej wierze." }
  - { kind: usage, text: "Глагол — wierzyć «верить», прилагательное — wierzący «верующий». Всё гнездо совпадает с русским: вера, верить, верующий." }
collocations:
  - { pl: "stracić wiarę", ru: "потерять веру" }
  - { pl: "nie do wiary", ru: "невероятно" }
  - { pl: "w dobrej wierze", ru: "добросовестно" }
  - { pl: "wiara czyni cuda", ru: "вера творит чудеса" }
family:
  - { pl: "wierzyć", ru: "верить", relation: root, id: wierzyc }
  - { pl: "wierzący", ru: "верующий", relation: derived }
  - { pl: "niewiara", ru: "неверие", relation: antonym }
etymology: "Праславянское *věra. Русское «вера» — то же самое слово, и родственники есть во всех славянских: чешское víra, украинское віра."
memory: "wiara — «вера», слово общеславянское и совпадает с русским полностью, вместе со всем гнездом: wierzyć «верить», wierzący «верующий». Запомните формулу Nie do wiary! «Невероятно!» и оборот w dobrej wierze «добросовестно»."
idioms:
  - { pl: "nie do wiary", ru: "невероятно" }
  - { pl: "wiara czyni cuda", ru: "вера творит чудеса" }
  - { pl: "w dobrej wierze", ru: "добросовестно" }
