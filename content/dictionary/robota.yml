# review
id: robota
format: 2
lemma: "robota"
rank: 346
pos: noun
pron: { cyr: "робо́та" }
senses:
  - id: work
    ru: "работа, дело (разговорное)"
    note: "Официальное слово для работы — praca; robota звучит по-свойски."
    examples:
      - pl: "Wracajcie do roboty!"
        ru: "Возвращайтесь к работе!"
        source: { kind: tatoeba, id: 10747427 }
      - pl: "Robisz świetną robotę."
        ru: "Ты делаешь отличную работу."
        source: { kind: tatoeba, id: 6313089 }
      - pl: "Dobry początek to połowa roboty."
        ru: "Хорошее начало — половина дела."
        source: { kind: tatoeba, id: 442808 }
  - id: work-phrases
    ru: "работа (в оборотах)"
    examples:
      - pl: "Koniec gadania, bierzemy się do roboty."
        ru: "Кончай разговоры, давай работать."
        source: { kind: tatoeba, id: 501975 }
      - pl: "Robicie ogromną robotę."
        ru: "Вы делаете большую работу."
        source: { kind: tatoeba, id: 6313099 }
      - pl: "Chciałbym napisać setki zdań na Tatoeba, ale mam inne rzeczy do roboty."
        ru: "Я бы хотел написать сотни фраз на \"Татоэба\", но у меня дела."
        source: { kind: tatoeba, id: 357938 }
notes:
  - { kind: false-friend, text: "robota — разговорное «работа, дело»; нейтральное и официальное слово — praca. Iść do pracy «идти на работу», но Dobra robota! «Хорошая работа!»" }
  - { kind: usage, text: "brać się do roboty — «браться за работу»; nie mam nic do roboty — «мне нечего делать»." }
  - { kind: usage, text: "mokra robota — «мокрое дело», тот же криминальный жаргон, что и в русском; krecia robota — «подрывная работа»." }
  - { kind: usage, text: "От того же корня — robot «робот»: слово придумал чешский писатель Карел Чапек." }
collocations:
  - { pl: "dobra robota", ru: "хорошая работа" }
  - { pl: "do roboty", ru: "за работу" }
  - { pl: "brać się do roboty", ru: "браться за дело" }
  - { pl: "nic do roboty", ru: "нечего делать" }
etymology: "Праславянское *orbota «подневольный труд», от *orbъ «раб»; то же гнездо, что русские «работа» и «раб». Отсюда же robot — слово, придуманное Карелом Чапеком."
memory: "robota — разговорная «работа, дело», а официальное слово — praca. Dobra robota! значит «Хорошая работа!». От этого же корня — robot «робот»."
idioms:
  - { pl: "dobra robota", ru: "хорошая работа" }
  - { pl: "brać się do roboty", ru: "браться за дело" }
  - { pl: "krecia robota", ru: "подрывная работа" }
formExamplesSkip:
  - { form: "roboto", reason: "звательный падеж от этого слова в живой речи не употребляется" }
