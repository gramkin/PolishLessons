notes:
  - { kind: usage, text: "Это прилагательное неправильное, и неправильное дважды, так что форму наугад тут строить нельзя. Во-первых, сравнительная степень теряет К: от MIĘKKI получается MIĘKSZY, а не «miękkiejszy», и дальше NAJMIĘKSZY. Во-вторых, мужско-личное множественное меняет согласную по-разному в каждой степени: в положительной MIĘKCY, а в сравнительной MIĘKSI. Добавим, что положительная степень берёт окончания на -ICH и -IM, MIĘKKICH, MIĘKKIM, потому что мягкое K требует именно их, а не -YCH и -YM, как у обычных прилагательных." }
  - { kind: pronunciation, text: "Читается «ме́нкки», ударение на первом слоге. Разбирается это так: буква I после M не гласная, а знак мягкости, и Ę перед К звучит как «эн». Отсюда «менк», а дальше двойное К и окончание «ки». В мужско-личном множественном согласная меняется: MIĘKCY звучит «ме́нкцы», а сравнительное MIĘKSI — «ме́нкси». Русское «мягкий» и польское «ме́нкки» звучат непохоже, хотя это одно и то же слово: вся разница в том, что праславянский носовой гласный дал в русском «я», а в польском Ę." }
  - { kind: false-friend, text: "Ловушка не в значении, а в правописании, и она подстерегает каждого русскоязычного. Слово MIĘKKI ZNAK в польском существует и значит именно «мягкий знак», но самого знака в польском алфавите нет: буквы Ь здесь не бывает. Мягкость обозначается иначе — либо буквой I после согласной, как в MIĘKKI и NIE, либо акутом над буквой, как в Ć, Ń, Ś, Ź. Поэтому русское «мать» и польское MAĆ кончаются одним и тем же звуком, записанным двумя разными способами." }
  - { kind: register, text: "Слово нейтральное и работает во всех трёх значениях одинаково свободно. Частые обороты: MIĘKKIE SERCE «мягкое сердце», MIĘKKA WODA «мягкая вода», MIĘKKIE LĄDOWANIE «мягкая посадка», MIĘKKA SPÓŁGŁOSKA «мягкий согласный». Наречие MIĘKKO значит «мягко», а глагол ZMIĘKCZYĆ — «смягчить», в том числе в фонетике. Прямой антоним TWARDY «твёрдый» работает во всех тех же значениях, включая согласные, так что пара MIĘKKI — TWARDY переносится с русского целиком." }
