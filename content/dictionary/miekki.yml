etymology: "Это ровно то же слово, что русское «мягкий», только прошедшее через польские звуковые законы. Праславянское прилагательное содержало носовой гласный, и он разошёлся: в русском дал «я», в польском остался носовым и пишется Ę. Тот же ряд соответствий виден во множестве частых слов: MIĘSO и «мясо», MIĘTA и «мята», PIĘĆ и «пять», DZIESIĘĆ и «десять», IMIĘ и «имя». Запомнив это правило, русскоязычный узнаёт целый пласт польской лексики без словаря: там, где в русском корне стоит «я», в польском стоит Ę. Из того же гнезда MIĄŻDŻYĆ «мять», русские «мякоть» и «мякиш»."
memory: "То же слово, что «мягкий»: польское Ę отвечает русскому «я», как в mięso и «мясо», pięć и «пять». Читается «ме́нкки», и i здесь не гласная, а знак мягкости. Формы неправильные, и это главное: сравнительная теряет к, miększy и najmiększy, а мужско-личное множественное разное в разных степенях, miękcy в положительной и mięksi в сравнительной. Правописание: мягкого знака в польском алфавите нет, мягкость показывают буква i или акут, ć, ń, ś, ź."
