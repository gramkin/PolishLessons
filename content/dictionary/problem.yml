# review
id: problem
format: 2
lemma: "problem"
rank: 172
pos: noun
pron: { cyr: "про́блем" }
senses:
  - id: trouble
    ru: "проблема, затруднение"
    examples:
      - pl: "Mamy duży problem."
        ru: "У нас большая проблема."
        source: { kind: tatoeba, id: 3070704 }
      - pl: "Mam poważny problem."
        ru: "У меня большая проблема."
        source: { kind: tatoeba, id: 352273 }
      - pl: "Masz problemy."
        ru: "У тебя проблемы."
        source: { kind: tatoeba, id: 5131831 }
  - id: question
    ru: "вопрос, задача (то, что надо решить)"
    examples:
      - pl: "W czym problem?"
        ru: "В чем проблема?"
        source: { kind: tatoeba, id: 901414 }
      - pl: "Gdzie jest problem?"
        ru: "В чем проблема?"
        source: { kind: tatoeba, id: 600694 }
      - pl: "To banalny problem."
        ru: "Это тривиальная проблема."
        source: { kind: tatoeba, id: 2784714 }
notes:
  - { kind: usage, text: "Nie ma problemu! — «Нет проблем!»; W czym problem? — «В чём дело?»." }
  - { kind: usage, text: "Слово мужского рода: ten problem, tego problemu. Во множественном — problemy, problemów." }
collocations:
  - { pl: "nie ma problemu", ru: "нет проблем" }
  - { pl: "rozwiązać problem", ru: "решить проблему" }
  - { pl: "mieć problem", ru: "иметь проблему" }
  - { pl: "w czym problem?", ru: "в чём дело?" }
etymology: "Заимствование из греческого πρόβλημα через латынь и французский — как и русское «проблема», поэтому слово узнаётся сразу."
memory: "Слово мужского рода: ten problem, tego problemu. Две готовые фразы: Nie ma problemu! «Нет проблем!» и W czym problem? «В чём дело?»."
idioms:
  - { pl: "nie ma problemu", ru: "нет проблем" }
  - { pl: "w czym problem?", ru: "в чём дело?" }
  - { pl: "robić z czegoś problem", ru: "делать из чего-то проблему" }
