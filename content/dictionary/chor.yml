  - { pl: "chórek", ru: "бэк-вокал, подпевки", relation: derived }
etymology: "Из греческого слова со значением «хоровод, хор», через латынь. Русский и польский взяли одно слово, но в польском O в закрытом слоге перешло в Ó, как в DWÓR и «двор»."
memory: "Chór — «хор», но читается «хур». W chórze — в хоре. Chórem — хором. Zgodnym chórem — в один голос. Chórek — бэк-вокал."
idioms:
