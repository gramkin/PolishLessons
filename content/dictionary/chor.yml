notes:
  - { kind: usage, text: "Десять форм, мужской род. В местном падеже R переходит в RZ: W CHÓRZE. Творительный CHÓREM живёт и как наречие: ODPOWIEDZIELI CHÓREM — «ответили хором». Ó сохраняется во всех формах: CHÓRU, CHÓRY." }
  - { kind: false-friend, text: "Слово то же, что русское «хор», только пишется через Ó. Две находки в гнезде. CHÓREK — не «маленький хор», а бэк-вокал, подпевки на эстраде. А в костёле CHÓR — ещё и хоры, балкон для органа и певцов: ORGANY STOJĄ NA CHÓRZE." }
  - { kind: government, text: "Петь в хоре — ŚPIEWAĆ W CHÓRZE, местный. Записаться в хор — ZAPISAĆ SIĘ DO CHÓRU, DO с родительным. В один голос — ZGODNYM CHÓREM, творительный." }
  - { kind: pronunciation, text: "Читается «хур», один слог. CH даёт «х», а Ó звучит как «у», поэтому на слух слово дальше от русского «хор», чем на письме. В местном падеже CHÓRZE: «ху́жэ»." }
  - { kind: register, text: "ZGODNYM CHÓREM, «дружным хором», говорят о единодушии: WSZYSCY ZGODNYM CHÓREM KRYTYKUJĄ RZĄD. В переносном смысле CHÓR — множество голосов: CHÓR PROTESTÓW." }
collocations:
