notes:
  - { kind: false-friend, text: "Собрано как русское «выступить»: wy- это вы-, а stąpić отвечает «ступить» — то самое чередование ą и у, знакомое по stąpać/ступать, mąż/муж и postępować/поступать. Первые два значения совпадают. Третье русскому чуждо: wystąpiły komplikacje значит «ВОЗНИКЛИ осложнения», а вовсе не «выступили». В медицинском и канцелярском языке это значение главное." }
  - { kind: government, text: "Три модели, и две различаются только падежом после одного и того же предлога. Выступить С ЧЕМ-ТО — z с ТВОРИТЕЛЬНЫМ: wystąpić z wnioskiem, z referatem. Выйти ИЗ ЧЕГО-ТО — z с РОДИТЕЛЬНЫМ: wystąpić z partii, z klubu. Выступить против — przeciwko с дательным: wystąpić przeciwko ustawie. Предлог z один, а смысл решает падеж." }
  - { kind: usage, text: "СТРАДАТЕЛЬНОГО ПРИЧАСТИЯ НЕТ, И ОТТОГО ФОРМ ВСЕГО СОРОК ДВЕ. Глагол непереходный во всех трёх значениях: выступают сами, выходят сами, симптомы возникают сами. Винительного дополнения нет, повышать в подлежащее нечего. Безличное wystąpiono при этом совершенно нормально. Вид совершенный, несовершенная пара — występować." }
  - { kind: pronunciation, text: "ą перед p звучит как ом: wystąpić — «высто́мпиць», ударение на предпоследнем слоге. Существительное wystąpienie «выступление» встречается не реже самого глагола, особенно в официальной речи." }
collocations:
  - { pl: "wystąpić z wnioskiem", ru: "выступить с предложением" }
  - { pl: "wystąpić z partii", ru: "выйти из партии" }
  - { pl: "wystąpić przeciwko komuś", ru: "выступить против кого-л." }
family:
  - { pl: "występować", ru: "выступать", relation: aspect }
  - { pl: "wystąpienie", ru: "выступление", relation: derived }
  - { pl: "występ", ru: "выступление, концерт", relation: derived, id: wystep }
  - { pl: "stąpać", ru: "ступать", relation: root }
etymology: "Приставка wy- плюс stąpić «ступить», от общеславянского корня *stop-, давшего русские «ступить», «ступать» и «поступок». Носовой дал в польском ą, а в русском у — то же соответствие, что в mąż и «муж». Отсюда występ «выступление, концерт», występować, wystąpienie и przestępstwo «преступление»."
memory: "wystąpić — «выступить», и корень знакомый: stąpić это «ступить», по закону ą/у. Два значения совпадают, третье нет: wystąpiły komplikacje значит «возникли осложнения». И следите за падежом после z: z wnioskiem творительный, z partii родительный."
idioms:
