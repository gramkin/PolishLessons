        ru: "Она вышла из объединения без слова."
        source: { kind: authored }
  - id: occur
    ru: "возникнуть, появиться (о симптомах, проблемах)"
    examples:
      - pl: "Mogą wystąpić powikłania."
        ru: "Могут возникнуть осложнения."
