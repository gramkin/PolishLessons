# review
id: zwiac
format: 2
lemma: "zwiać"
rank: 4685
pos: verb
pron: { cyr: "звяць" }
senses:
  - id: flee
    ru: "разг. смыться, удрать"
    examples:
      - pl: "Zwiał z domu, gdy miał szesnaście lat."
        ru: "Он удрал из дома в шестнадцать лет."
        source: { kind: authored }
      - pl: "Złodziej zwiał przed policją."
        ru: "Вор удрал от полиции."
        source: { kind: authored }
      - pl: "Zwiejmy z tej nudnej lekcji."
        ru: "Давайте смоемся с этого скучного урока."
        source: { kind: authored }
  - id: blow-off
    ru: "сдуть (о ветре)"
    examples:
      - pl: "Wiatr zwiał mi kapelusz."
        ru: "Ветер сдул с меня шляпу."
        source: { kind: authored }
      - pl: "Wichura zwiała liście z drzew."
        ru: "Ураган сорвал листья с деревьев."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZWIAĆ — разговорное «смыться, удрать», а также «сдуть» о ветре: WIATR ZWIAŁ KAPELUSZ. Не путать с русским «звать» — WOŁAĆ. Нейтральный синоним «сбежать» — UCIEC." }
  - { kind: usage, text: "Пятьдесят одна форма: формы для мужчин-людей ZWIANI и безличной ZWIANO нет, вариант ZWIELI не включён. Будущее: ZWIEJĘ, ZWIEJESZ, повелительное ZWIEJ. Прошедшее: ZWIAŁ, ZWIALI. Несовершенный вид — ZWIEWAĆ." }
  - { kind: government, text: "Откуда — Z с родительным: ZWIAĆ Z DOMU, Z LEKCJI. От кого — PRZED с творительным: ZWIAĆ PRZED POLICJĄ. От кого — также дательный: ZWIAĆ POLICJI. О ветре — что: ZWIAĆ LIŚCIE; с чего — Z GŁOWY." }
  - { kind: pronunciation, text: "ZWIAĆ — один слог, «звяць». ZWIEJĘ — «зве́е», ZWIAŁ — «звяу»." }
  - { kind: register, text: "В значении «удрать» — разговорное, школьное: ZWIAĆ Z LEKCJI. О ветре — нейтральное." }
collocations:
  - { pl: "zwiać z lekcji", ru: "сбежать с урока" }
  - { pl: "zwiać z domu", ru: "удрать из дома" }
  - { pl: "wiatr zwiał kapelusz", ru: "ветер сдул шляпу" }
family:
  - { pl: "wiatr", ru: "ветер", relation: root, id: wiatr }
  - { pl: "uciec", ru: "убежать, сбежать", relation: derived, id: uciec }
  - { pl: "zwiewać", ru: "сдувать; удирать", relation: aspect }
etymology: "Приставка Z- «с-» плюс WIAĆ «дуть», праславянское *věti. Исходное значение — «сдуть»; «удрать» — образное: исчезнуть, как сдуло ветром. Русское «веять», «ветер» — то же гнездо."
memory: "Zwiać z lekcji — сбежать с урока. Wiatr zwiał kapelusz — ветер сдул шляпу. Читается «звяць»."
idioms:
  - { pl: "zwiać gdzie pieprz rośnie", ru: "удрать куда глаза глядят, на край света" }
formExamplesSkip:
  - { form: "zwiani", reason: "формы для мужчин-людей нет" }
  - { form: "zwieli", reason: "разговорный вариант ZWIALI" }
  - { form: "zwiano", reason: "безличная форма неупотребительна" }
