pron: { cyr: "ма́са" }
senses:
  - id: mass-physics
    ru: "масса (физическая величина)"
    examples:
      - pl: "Masa ciała wynosi siedemdziesiąt kilogramów."
        ru: "Масса тела — семьдесят килограммов."
        source: { kind: authored }
      - pl: "Masa lodowca topnieje."
        ru: "Масса ледника тает."
        source: { kind: authored }
      - pl: "Suma mas obu ciał jest stała."
        ru: "Сумма масс обоих тел постоянна."
        source: { kind: authored }
  - id: bulk
    ru: "масса, густая смесь"
    examples:
      - pl: "Ugniatał masę na pierogi."
        ru: "Он замешивал массу для пирогов."
        source: { kind: authored }
      - pl: "Zalał formę gorącą masą."
        ru: "Он залил форму горячей массой."
        source: { kind: authored }
  - id: crowd
    ru: "масса людей, массы"
    examples:
      - pl: "Masy wyszły na ulice."
        ru: "Массы вышли на улицы."
        source: { kind: authored }
      - pl: "Rządził masami przez radio."
        ru: "Он управлял массами через радио."
        source: { kind: authored }
  - id: lots
    ru: "разг. масса, уйма (много)"
    examples:
      - pl: "Masę czasu zmarnowałem."
        ru: "Я потерял уйму времени."
        source: { kind: authored }
      - pl: "Przyszła masa ludzi."
        ru: "Пришла масса людей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Ловушки почти нет: польское masa и русское «масса» — одно латинское слово и совпадают во всех четырёх значениях, включая разговорное «уйма»: masę czasu это в точности «масса времени». Разница одна, грамматическая: польское masa женского рода с обычным склонением на -a, а падежные формы придётся выучить." }
  - { kind: usage, text: "Дательный и предложный совпадают: masie (w masie ludzi). Множественное masy значит «массы» в общественном смысле, а в физике — «массы» нескольких тел." }
  - { kind: government, text: "Чего масса — в родительном: masa ciała, masa lodowca. Разговорное количественное masę требует родительного следом: masę czasu, masę ludzi, и само при этом не меняется по падежам." }
  - { kind: pronunciation, text: "Звательный падеж у неодушевлённых существительных формально есть, но в живой речи почти не встречается: его берегут для стихов, песен и шутливого обращения к вещи. Примеры в этом слоте именно такие — запоминать их как образец повседневной речи не нужно." }
collocations:
  - { pl: "masa ciała", ru: "масса тела" }
  - { pl: "masę czasu", ru: "уйма времени" }
  - { pl: "masy ludzkie", ru: "людские массы" }
family:
  - { pl: "masowy", ru: "массовый", relation: derived }
  - { pl: "masywny", ru: "массивный", relation: derived }
etymology: "Из латинского massa «тесто, комок», а то — из греческого μᾶζα «ячменная лепёшка», от глагола «месить». Русское «масса» пришло тем же книжным путём, поэтому слова совпадают. Исходное «тесто» хорошо видно в польском значении густой смеси: masa na pierogi."
memory: "masa — «масса», то же латинское слово и те же четыре значения: физическая величина, густая смесь, людские массы и разговорная «уйма». Исходно латинское massa значило «тесто» — отсюда masa na pierogi."
idioms:
  - { pl: "masę czasu", ru: "уйма времени" }
  - { pl: "masa upadłościowa", ru: "конкурсная масса" }
