notes:
  - { kind: usage, text: "Одиннадцать форм, мужской род, одушевлённое. Во множественном две формы по смыслу: SZCZENIAKI — щенки, SZCZENIACY — сопляки, о молодых людях. Винительный единственного — SZCZENIAKA, как у одушевлённого." }
  - { kind: false-friend, text: "Слово того же корня, что русский «щенок», но польское SZCZENIAK о человеке звучит презрительно: «сопляк, мальчишка». Нейтральное книжное слово для щенка — SZCZENIĘ. А SZCZENIĘCE LATA, «щенячьи годы», — юность, без всякой обиды: W SZCZENIĘCYCH LATACH — «в юные годы»." }
  - { kind: government, text: "Взять щенка — WZIĄĆ SZCZENIAKA, винительный, равный родительному. Вести себя как мальчишка — ZACHOWYWAĆ SIĘ JAK SZCZENIAK. Щенок какой породы — SZCZENIAK с родительным: SZCZENIAK LABRADORA." }
  - { kind: pronunciation, text: "Читается «шчэ́няк», два слога, ударение на первом. SZCZ даёт «шч», как в SZCZĘŚCIE «шчэ́ньсьце», а NIA сливается в «ня». В форме SZCZENIAKA: «шчэня́ка»." }
  - { kind: register, text: "О собаке слово нейтральное и ласковое. О человеке — грубоватое: TY SZCZENIAKU! — «ах ты сопляк!». SZCZENIACKI — «мальчишеский, незрелый»: SZCZENIACKI WYBRYK — мальчишеская выходка." }
collocations:
  - { pl: "mały szczeniak", ru: "маленький щенок" }
  - { pl: "szczeniak rasowy", ru: "породистый щенок" }
  - { pl: "wziąć szczeniaka ze schroniska", ru: "взять щенка из приюта" }
family:
  - { pl: "szczenie", ru: "щенок (книжн.)", relation: root }
  - { pl: "szczeniecy", ru: "щенячий; юношеский", relation: derived }
  - { pl: "szczeniacki", ru: "мальчишеский, незрелый", relation: derived }
etymology: "От праславянского слова со значением «детёныш собаки», того же, что русское «щенок». Польское SZCZ на месте русского «щ» — обычное соответствие: SZCZĘŚCIE и «счастье», SZCZUPAK и «щука»."
memory: "Szczeniak — щенок, а о юноше — сопляк. Читается «шчэ́няк». Szczeniaki — щенки, szczeniacy — сопляки. Szczenięce lata — юные годы. Польское szcz — русское «щ»."
idioms:
  - { pl: "zachowywać się jak szczeniak", ru: "вести себя как мальчишка" }
  - { pl: "szczenięce lata", ru: "юные годы" }
