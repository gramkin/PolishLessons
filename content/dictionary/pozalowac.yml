etymology: "Приставка PO- плюс ŻAŁOWAĆ, от ŻAL «жалость, сожаление», праславянское *žalь, как русское «жаль», «жалеть». Польское Ł на месте русского Л."
memory: "Pożałować — пожалеть о сделанном: pożałujesz tego! Чего — родительный без предлога. Nie pożałował pieniędzy — не пожалел денег."
