lemma: "pożałować"
rank: 4138
pos: verb
pron: { cyr: "пожауо́ваць" }
senses:
  - id: regret
    ru: "пожалеть (о сделанном)"
    examples:
      - pl: "Pożałujesz tego!"
        ru: "Ты об этом пожалеешь!"
        source: { kind: authored }
      - pl: "Szybko pożałował swojej decyzji."
