      - pl: "Nie pożałujesz, jeśli przyjdziesz."
        ru: "Не пожалеешь, если придёшь."
        source: { kind: authored }
  - id: spare
    ru: "пожалеть, поскупиться (чего-то для кого-то)"
    examples:
      - pl: "Nie pożałował pieniędzy na wesele córki."
        ru: "Он не пожалел денег на свадьбу дочери."
        source: { kind: authored }
      - pl: "Pożałowała mu nawet kawałka chleba."
        ru: "Она пожалела для него даже куска хлеба."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POŻAŁOWAĆ — «пожалеть», но только в двух значениях: «раскаяться» и «поскупиться». «Пожалеть кого-то» в смысле сочувствия — WSPÓŁCZUĆ KOMUŚ или ZLITOWAĆ SIĘ NAD KIMŚ. Оборот GODNY POŻAŁOWANIA — «достойный сожаления», «жалкий»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — ŻAŁOWAĆ. Спряжение на -UJĘ: POŻAŁUJĘ, POŻAŁUJESZ, POŻAŁUJĄ. Угроза POŻAŁUJESZ! — «ты пожалеешь!». Страдательное причастие, безличное, повелительное и большинство форм отглагольного существительного в карточку не включены." }
  - { kind: government, text: "О чём — родительный без предлога: POŻAŁOWAĆ DECYZJI, SŁÓW. По-русски «о» с предложным, по-польски — голый родительный. Чего для кого — родительный и дательный: POŻAŁOWAĆ KOMUŚ PIENIĘDZY. С придаточным — ŻE: POŻAŁOWAŁ, ŻE PRZYSZEDŁ." }
  - { kind: pronunciation, text: "Читается «пожауо́ваць»: Ż — «ж», Ł — «у». Ударение на предпоследнем слоге. POŻAŁUJESZ — «пожау́еш»." }
  - { kind: register, text: "Нейтральное слово. POŻAŁUJESZ! — разговорная угроза. GODNY POŻAŁOWANIA — книжное «жалкий»." }
collocations:
  - { pl: "pożałować decyzji", ru: "пожалеть о решении" }
  - { pl: "nie pożałować pieniędzy", ru: "не пожалеть денег" }
