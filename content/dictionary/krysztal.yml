notes:
  - { kind: false-friend, text: "Русский разводит «кристалл» в науке и «хрусталь» в посуде. Польский обходится одним KRYSZTAŁ: KRYSZTAŁ SOLI — «кристалл соли», KRYSZTAŁY W WITRYNIE — «хрусталь в серванте». Прилагательное KRYSZTAŁOWY тоже двойное: «кристаллический» и «хрустальный», а в переносном смысле — «кристально честный»: KRYSZTAŁOWO UCZCIWY." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный на -U: KRYSZTAŁU. В местном Ł чередуется с L: W KRYSZTALE. Множественное KRYSZTAŁY — и кристаллы, и предметы из хрусталя: BABCINE KRYSZTAŁY, «бабушкин хрусталь»." }
  - { kind: government, text: "Из хрусталя — Z KRYSZTAŁU, Z с родительным. Кристаллы чего-то — KRYSZTAŁY SOLI, LODU, родительный. Само существительное падежа не требует." }
  - { kind: pronunciation, text: "Читается «кры́штау», два слога, ударение на первом. SZ — «ш», Ł — «у». В местном W KRYSZTALE L обычная: «ф кры́шталэ»." }
  - { kind: register, text: "Нейтральное слово. Для польских семей поздней ПНР KRYSZTAŁY в серванте были знаком достатка, как и в СССР, и сейчас это слово вызывает ностальгическую улыбку. В химии и физике — точный термин." }
collocations:
  - { pl: "kryształ górski", ru: "горный хрусталь" }
  - { pl: "kryształy lodu", ru: "кристаллы льда" }
  - { pl: "wazon z kryształu", ru: "хрустальная ваза" }
family:
  - { pl: "kryształowy", ru: "хрустальный, кристаллический", relation: derived }
  - { pl: "szkło", ru: "стекло", relation: root, id: szklo }
  - { pl: "lód", ru: "лёд", relation: root, id: lod }
etymology: "Из латинского crystallus, а то из греческого krýstallos, «лёд»: древние думали, что горный хрусталь — это окаменевший лёд. Русское «хрусталь» пришло тем же путём через церковнославянский, а «кристалл» — позже, через немецкий или французский. Польский оставил одно слово на оба значения."
memory: "Kryształ — и кристалл, и хрусталь: kryształy soli, babcine kryształy. Z kryształu — хрустальный. Читается «кры́штау»."
idioms:
  - { pl: "kryształowo czysty", ru: "кристально чистый" }
formExamplesSkip:
