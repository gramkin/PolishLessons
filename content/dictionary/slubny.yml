notes:
  - { kind: false-friend, text: "Польский делит на два слова то, что русский называет одним. ŚLUB — это венчание, обряд, сама церемония, а WESELE — застолье после него, гуляние с гостями и музыкой. Русская «свадьба» покрывает и то, и другое, поэтому фразу BYLIŚMY NA ŚLUBIE, ALE NIE NA WESELU нужно переводить описательно: «мы были на венчании, но не на застолье». Соответственно BRAĆ ŚLUB значит «венчаться, вступать в брак», а WYPRAWIĆ WESELE — «устроить свадьбу». Прилагательное ŚLUBNY относится к первому: ŚLUBNA SUKNIA, ŚLUBNE OBRĄCZKI." }
  - { kind: usage, text: "Одиннадцать форм и ни одной степени сравнения — снова относительное прилагательное: оно приписывает вещь к обряду, а не оценивает её, и «более свадебным» быть нельзя. Это уже третий случай той же схемы после ZEWNĘTRZNY и SREBRNY, и в черновике он виден сразу по числу одиннадцать. Мужско-личная форма ŚLUBNI употребляется о людях при обряде: ŚLUBNI ŚWIADKOWIE «свидетели на венчании», ŚLUBNI GOŚCIE." }
  - { kind: pronunciation, text: "Читается «сьлю́бны», два слога, ударение на первом. Буква Ś даёт мягкое «сь», а не «ш»: это именно «сь», как в русском «сюда», и путать её с SZ нельзя. Дальше L перед U звучит мягко, отсюда «лю». В существительном ŚLUB конечная B оглушается, и слышно «сьлюп», а в местном падеже озвончается обратно: NA ŚLUBIE звучит «на сьлю́бе». Сочетание ŚL в начале слова русскому непривычно, но произносится слитно, без гласной между согласными." }
  - { kind: government, text: "Прилагательное только согласуется, зато у существительного ŚLUB управление своё и полезное. Вступать в брак — BRAĆ ŚLUB, буквально «брать венчание», и с кем указывается предлогом Z с творительным: WZIĄĆ ŚLUB Z KIMŚ. Место обряда идёт предлогом W с местным: ŚLUB W KOŚCIELE «венчание в церкви», ŚLUB CYWILNY «гражданский брак». Самый частый оборот с прилагательным — STANĄĆ NA ŚLUBNYM KOBIERCU, предлог NA с местным, буквально «встать на свадебный ковёр», то есть «встать под венец»." }
  - { kind: register, text: "Слово нейтральное и бытовое, живёт в разговорах о подготовке к свадьбе и в объявлениях. Частые обороты: SUKNIA ŚLUBNA «свадебное платье», OBRĄCZKA ŚLUBNA «обручальное кольцо», PODRÓŻ ŚLUBNA «свадебное путешествие», SALON SUKIEN ŚLUBNYCH. Шутливо о супруге говорят ŚLUBNA или ŚLUBNY в роли существительного, примерно как русское «моя законная». Глагол ŚLUBOWAĆ при этом торжественный и значит «давать обет, клясться», не только о браке." }
