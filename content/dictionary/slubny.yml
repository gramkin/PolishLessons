etymology: "От существительного ŚLUB, а оно от старого глагола со значением «обещать, давать обет», сложенного из приставки S- и корня LUB-, того же, что в LUBIĆ «любить». Брак здесь назван по обещанию, а обещание — по склонности и согласию. Русский тот же корень держит в словах «любить», «любой», «слюбиться», и именно «слюбиться» ближе всего к польскому образу. Польское слово ушло дальше всех: украинский и белорусский взяли его у поляков целиком, и там «шлюб» значит «брак». Русскому оно незнакомо, зато корень узнаётся сразу, стоит только услышать в ŚLUB наше «люб»."
memory: "Польский делит русскую «свадьбу» на две: ślub это венчание, обряд, а wesele застолье после. Отсюда brać ślub «вступать в брак». Корень тот же, что в lubić «любить», и ближайшее русское слово по образу — «слюбиться»; украинское и белорусское «шлюб» взято прямо из польского. Одиннадцать форм, степеней нет, как у zewnętrzny и srebrny. Читается «сьлю́бны», где ś это мягкое «сь», а не «ш». Главный оборот: stanąć na ślubnym kobiercu «встать под венец»."
idioms:
  - { pl: "stanąć na ślubnym kobiercu", ru: "встать под венец" }
