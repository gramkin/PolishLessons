# review
id: sprzed
format: 2
lemma: "sprzed"
rank: 3111
pos: prep
pron: { cyr: "спшэт" }
senses:
  - id: from-before
    ru: "из-под, с (перестать быть перед чем-то)"
    examples:
      - pl: "Zabierz Toma sprzed moich oczu."
        ru: "Убери Тома с моих глаз."
        source: { kind: translated, id: 12182485 }
      - pl: "Patrzyliśmy za nim, dopóki nam nie znikł sprzed oczu."
        ru: "Мы смотрели ему вслед, пока он не исчез с наших глаз."
        source: { kind: authored }
      - pl: "Odsuń krzesło sprzed drzwi."
        ru: "Отодвинь стул от двери."
        source: { kind: authored }
  - id: from-time
    ru: "от, времён (более ранний, чем указанное время)"
    examples:
      - pl: "Niedługo wszystko wróci do poziomu sprzed kryzysu."
        ru: "Скоро всё вернётся к докризисному уровню."
        source: { kind: translated, id: 355688 }
      - pl: "Ona ciągle wypomina mu błędy sprzed lat."
        ru: "Она постоянно припоминает ему ошибки прошлых лет."
        source: { kind: translated, id: 11741398 }
      - pl: "W porównaniu z ceną sprzed roku, teraz jest znacznie taniej."
        ru: "По сравнению с прошлогодней ценой сейчас значительно дешевле."
        source: { kind: translated, id: 359780 }
notes:
  - { kind: government, text: "Предлог требует родительного падежа: sprzed oczu, sprzed lat, sprzed wojny." }
  - { kind: usage, text: "Слово собрано из z + przed «перед», то есть «с места перед чем-то»." }
  - { kind: false-friend, text: "У русского нет одного слова-соответствия: по контексту это «с» (zniknąć sprzed oczu «исчезнуть с глаз»), «от» или «времён» (list sprzed lat «письмо многолетней давности»)." }
  - { kind: usage, text: "Временное значение очень частое: sprzed wojny «довоенный», sprzed kryzysu «докризисный», zdjęcie sprzed lat «фотография давних лет»." }
collocations:
  - { pl: "sprzed lat", ru: "многолетней давности" }
  - { pl: "sprzed wojny", ru: "довоенный" }
  - { pl: "zniknąć sprzed oczu", ru: "исчезнуть с глаз" }
etymology: "Сращение предлогов z и przed «перед»: буквально «с места перед чем-то»."
memory: "sprzed — это z + przed «перед», требует родительного падежа. Русского однословного соответствия нет: по контексту это «с» (zniknąć sprzed oczu «исчезнуть с глаз») или «времён» (list sprzed lat «письмо многолетней давности», sprzed wojny «довоенный»)."
idioms:
