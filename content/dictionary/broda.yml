senses:
  - id: beard
    ru: "борода"
    examples:
      - pl: "Moja broda szybko rośnie."
        ru: "Моя борода быстро растет."
        source: { kind: tatoeba, id: 5703733 }
      - pl: "Tom ma długą brodę."
        ru: "У Тома длинная борода."
        source: { kind: tatoeba, id: 5703736 }
      - pl: "Czy mogę dotknąć twojej brody?"
        ru: "Можно потрогать твою бороду?"
