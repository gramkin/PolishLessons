  - id: chin
    ru: "подбородок"
    examples:
      - pl: "Tom podrapał się po brodzie."
        ru: "Том почесал подбородок."
        source: { kind: translated, id: 6371474 }
      - pl: "Słuchał z brodą opartą na ręce."
        ru: "Он слушал, опершись подбородком на руку."
        source: { kind: translated, id: 969053 }
notes:
  - { kind: false-friend, text: "ГЛАВНОЕ: broda значит и «борода», и «подбородок». Русское «борода» покрывает только первое, а для второго нужен отдельный корень. Podrapał się po brodzie — «почесал подбородок», а не бороду." }
  - { kind: government, text: "Женский род: ta broda, tej brody. Отпускать бороду — zapuszczać brodę, винительный." }
  - { kind: usage, text: "Пословица Broda nie czyni filozofa «Борода не делает философом» — та же, что латинское barba non facit philosophum." }
  - { kind: usage, text: "Отдельное слово bród «брод» пишется так же во множественном родительном: przejść rzekę w bród «перейти реку вброд»." }
collocations:
  - { pl: "zapuszczać brodę", ru: "отпускать бороду" }
  - { pl: "w bród", ru: "вброд; в избытке" }
etymology: "Праславянское *borda; русская «борода» — то же слово, но польское broda значит ещё и «подбородок»."
memory: "broda — и «борода», и «подбородок». Podrapał się po brodzie значит «почесал подбородок». А w bród — «вброд» и «в избытке»."
idioms:
  - { pl: "zapuszczać brodę", ru: "отпускать бороду" }
  - { pl: "w bród", ru: "в избытке" }
formExamplesSkip:
  - { form: "brodo", reason: "звательная форма, а broda — это борода. Обращаться к ней некому, поэтому форма остаётся только в таблице склонения" }
