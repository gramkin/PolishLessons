# review
id: mechanik
format: 2
lemma: "mechanik"
rank: 4761
pos: noun
pron: { cyr: "мэха́ник" }
senses:
  - id: car-mechanic
    ru: "механик, автомеханик"
    examples:
      - pl: "Mechanik wymienił mi olej."
        ru: "Механик поменял мне масло."
        source: { kind: authored }
      - pl: "Zawiozłem samochód do mechanika."
        ru: "Я отвёз машину к механику."
        source: { kind: authored }
      - pl: "Mechanik samochodowy zarabia nieźle."
        ru: "Автомеханик зарабатывает неплохо."
        source: { kind: authored }
  - id: engineer
    ru: "механик (на заводе, судне)"
    examples:
      - pl: "Pracuje jako mechanik w fabryce."
        ru: "Он работает механиком на заводе."
        source: { kind: authored }
      - pl: "Mechanik pokładowy sprawdził silniki samolotu."
        ru: "Бортмеханик проверил двигатели самолёта."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MECHANIK — «механик», перевод прямой. В быту это прежде всего автомеханик: JECHAĆ DO MECHANIKA — «ехать в автосервис». Сам автосервис — WARSZTAT или SERWIS." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: MECHANICY. Творительный — MECHANIKIEM. Местный и звательный совпадают: MECHANIKU." }
  - { kind: government, text: "К механику, в автосервис — DO MECHANIKA, DO с родительным, хотя речь о человеке. У механика — U MECHANIKA. Стать механиком — ZOSTAĆ MECHANIKIEM." }
  - { kind: pronunciation, text: "Читается «мэха́ник», ударение на предпоследнем слоге. ME — твёрдое «мэ», CH — «х»." }
collocations:
  - { pl: "mechanik samochodowy", ru: "автомеханик" }
  - { pl: "oddać auto do mechanika", ru: "отдать машину в ремонт" }
  - { pl: "dobry mechanik", ru: "хороший механик" }
family:
  - { pl: "mechanika", ru: "механика", relation: root }
  - { pl: "mechaniczny", ru: "механический", relation: root }
  - { pl: "mechanizm", ru: "механизм", relation: root }
etymology: "Из греческого слова со значением «машина, орудие». Русское «механик» — из того же источника."
memory: "Mechanik — механик, чаще автомеханик. Читается «мэха́ник». Jechać do mechanika — ехать в автосервис. Mechanicy — механики."
idioms:
  - { pl: "złota rączka", ru: "мастер на все руки" }
