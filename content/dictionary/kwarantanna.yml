notes:
  - { kind: false-friend, text: "KWARANTANNA — «карантин», с KW и двумя N: KWARANTANNA. Это прямой итальянизм — QUARANTENA, «сорок дней». Самоизоляция — SAMOIZOLACJA, изоляция — IZOLACJA." }
  - { kind: usage, text: "Женский род. Учим единственное: KWARANTANNA, KWARANTANNY, KWARANTANNIE, KWARANTANNĘ, KWARANTANNĄ. В местном NN смягчается: NA KWARANTANNIE." }
