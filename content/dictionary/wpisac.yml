# review
id: wpisac
format: 2
lemma: "wpisać"
rank: 4309
pos: verb
pron: { cyr: "фпи́саць" }
senses:
  - id: enter
    ru: "вписать, ввести (данные, текст)"
    examples:
      - pl: "Wpisz hasło i kliknij OK."
        ru: "Введи пароль и нажми OK."
        source: { kind: authored }
      - pl: "Wpisała swoje nazwisko do formularza."
        ru: "Она вписала свою фамилию в анкету."
        source: { kind: authored }
      - pl: "Wpisałem adres do nawigacji."
        ru: "Я ввёл адрес в навигатор."
        source: { kind: authored }
  - id: enrol
    ru: "внести (в список, реестр); вписаться (wpisać się)"
    examples:
      - pl: "Zamek wpisano na listę UNESCO."
        ru: "Замок внесли в список ЮНЕСКО."
        source: { kind: authored }
      - pl: "Nowy budynek dobrze wpisał się w okolicę."
        ru: "Новое здание хорошо вписалось в окрестности."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WPISAĆ — «вписать» и «ввести»: WPISAĆ HASŁO, KOD, ADRES, где по-русски скорее «ввести, набрать». WPISAĆ NA LISTĘ — «внести в список». WPISAĆ SIĘ — «вписаться»: WPISAĆ SIĘ W KLIMAT, «вписаться в атмосферу», а ещё «расписаться» в книге: WPISAĆ SIĘ DO KSIĘGI GOŚCI." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное WPISANY и деепричастие WPISAWSZY. Чередование S → SZ: WPISAĆ, но WPISZĘ, WPISZ. Видовой партнёр — WPISYWAĆ. Существительное WPIS — «запись, пост»: NOWY WPIS NA BLOGU." }
  - { kind: government, text: "Что — винительный, куда — DO с родительным или W с винительным: WPISAĆ DO ZESZYTU, W OKIENKO. В список — NA с винительным: WPISAĆ NA LISTĘ. Вписаться во что — WPISAĆ SIĘ W с винительным: W TRADYCJĘ, W KRAJOBRAZ." }
  - { kind: pronunciation, text: "Читается «впи́саць», два слога, ударение на первом. W перед P оглушается в «ф»: «фпи́саць». Будущее WPISZĘ — «фпи́шэ»." }
  - { kind: register, text: "Нейтральное слово бланков, компьютеров и учреждений. В интернете WPIS — «пост, запись». WPISAĆ SIĘ W — книжное и журналистское: WPISUJE SIĘ W TRENDY, «вписывается в тренды»." }
collocations:
  - { pl: "wpisać hasło", ru: "ввести пароль" }
  - { pl: "wpisać na listę", ru: "внести в список" }
  - { pl: "wpisać się w krajobraz", ru: "вписаться в пейзаж" }
family:
  - { pl: "wpisywac", ru: "вписывать, вводить", relation: aspect }
  - { pl: "pisac", ru: "писать", relation: root, id: pisac }
  - { pl: "wpis", ru: "запись, пост", relation: derived }
etymology: "Приставка W- «в-» плюс PISAĆ «писать», праславянское *pьsati, то же, что русское «писать». Значение «ввести данные» пришло вместе с компьютерами: строку вписывают в окно."
memory: "Wpisać — вписать, ввести: wpisz hasło, wpisać na listę. Wpisać się w — вписаться. Wpis — пост. Wpiszę — с SZ. Читается «фпи́саць»."
idioms:
  - { pl: "wpisać się do historii", ru: "войти в историю" }
