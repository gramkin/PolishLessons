notes:
  - { kind: false-friend, text: "RDZEŃ — «сердцевина, стержень, ядро». В анатомии RDZEŃ KRĘGOWY — «спинной мозг». В технике — «ядро процессора». В грамматике — «корень» слова: RDZEŃ WYRAZU. Ржавчина — RDZA, другое слово." }
  - { kind: usage, text: "Мужской род, неодушевлённое, мягкая основа. Родительный — RDZENIA. Множественное — RDZENIE, родительный — RDZENI." }
  - { kind: government, text: "Суть чего — RDZEŃ и родительный: RDZEŃ SPRAWY. Травма спинного мозга — URAZ RDZENIA. Процессор с ядрами — PROCESOR Z RDZENIAMI." }
  - { kind: pronunciation, text: "Читается «рдзэнь», один слог: RDZ в начале слитно, Ń — мягкое «нь». RDZENIA — «рдзэ́ня»." }
