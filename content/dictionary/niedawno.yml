  - id: recently-phrase
    ru: "niedawno temu — не так давно"
    examples:
      - pl: "Niedawno temu stała tu szkoła."
        ru: "Не так давно здесь стояла школа."
        source: { kind: authored }
      - pl: "Widziałem go niedawno temu na dworcu."
        ru: "Я видел его не так давно на вокзале."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ОДНА-ЕДИНСТВЕННАЯ ФОРМА, И ЭТО СТОИТ ЗАМЕТИТЬ. Исходное dawno «давно» степени имеет: dawno, dawniej, najdawniej. А отрицательное niedawno их теряет — «более недавно» не говорят ни по-польски, ни по-русски. Сравните с widocznie, у которого форм три: польские наречия сравниваются свободно, но только когда это допускает смысл." }
  - { kind: false-friend, text: "Собрано слово в слово как русское «недавно»: nie- плюс dawno. Совпадает и всё гнездо: dawno «давно», dawniej «раньше, прежде», dawny «давний», niedawny «недавний». Ловушек здесь нет ни одной." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: nie-DAW-no, «неда́вно». ni перед гласной читается мягко, w как в." }
collocations:
  - { pl: "niedawno temu", ru: "не так давно" }
  - { pl: "jeszcze niedawno", ru: "ещё недавно" }
  - { pl: "całkiem niedawno", ru: "совсем недавно" }
family:
  - { pl: "dawno", ru: "давно", relation: root, id: dawno }
  - { pl: "dawny", ru: "давний, прежний", relation: derived, id: dawny }
  - { pl: "niedawny", ru: "недавний", relation: derived }
etymology: "Приставка nie- плюс dawno, наречие от dawny «давний», из праславянского *davьnъ — того же слова, что русское «давний». Русское «недавно» собрано из тех же двух частей и тем же способом. Отсюда dawniej «раньше», niedawny и oddawna «издавна»."
memory: "niedawno — «недавно», слово в слово. Форма всего одна: dawno степени имеет (dawniej, najdawniej), а отрицательное niedawno — нет, ровно как и в русском."
idioms:
