# review
id: wlosy
format: 2
lemma: "włosy"
rank: 905
pos: noun
pron: { cyr: "вуо́сы" }
senses:
  - id: hair
    ru: "волосы"
    note: "Слово всегда во множественном числе; один волос — włos."
    examples:
      - pl: "Masz piękne włosy."
        ru: "У тебя красивые волосы."
        source: { kind: tatoeba, id: 3656147 }
      - pl: "Mam kasztanowe włosy."
        ru: "У меня каштановые волосы."
        source: { kind: tatoeba, id: 730381 }
      - pl: "Ona ma krótkie włosy."
        ru: "У неё короткие волосы."
        source: { kind: tatoeba, id: 591383 }
  - id: wash
    ru: "myć włosy — мыть голову"
    note: "Поляк моет волосы там, где русский моет голову."
    examples:
      - pl: "Nie umyłem swoich włosów."
        ru: "Я не помыл голову."
        source: { kind: tatoeba, id: 2809339 }
      - pl: "Rano nie myję włosów."
        ru: "Утром я не мою голову."
        source: { kind: translated, id: 2120224 }
      - pl: "Myję włosy co drugi dzień."
        ru: "Я мою голову через день."
        source: { kind: authored }
  - id: with-hair
    ru: "z długimi włosami — с длинными волосами"
    examples:
      - pl: "Dziewczyna z długimi włosami to Judy."
        ru: "Девушка с длинными волосами — Джуди."
        source: { kind: translated, id: 964892 }
      - pl: "Wyglądasz ładnie z krótkimi włosami."
        ru: "Тебе идут короткие волосы."
        source: { kind: translated, id: 867450 }
      - pl: "Alice ma kwiat we włosach."
        ru: "У Алисы цветок в волосах."
        source: { kind: tatoeba, id: 756663 }
notes:
  - { kind: usage, text: "В значении «волосы на голове» слово употребляется только во множественном числе, как и русское «волосы». Один волосок — włos: Znalazłem włos w zupie «Я нашёл волос в супе»." }
  - { kind: false-friend, text: "Поляк моет волосы, а русский — голову: myć włosy значит «мыть голову». Сказать myć głowę можно, но звучит это странно, будто речь о самой голове." }
  - { kind: usage, text: "Частые сочетания: czesać włosy «причёсываться», farbować włosy «красить волосы», obciąć włosy «подстричься». Причёска — fryzura." }
  - { kind: usage, text: "Описание внешности строится через творительный с предлогом z: dziewczyna z długimi włosami «девушка с длинными волосами»." }
collocations:
  - { pl: "myć włosy", ru: "мыть голову" }
  - { pl: "długie włosy", ru: "длинные волосы" }
  - { pl: "obciąć włosy", ru: "подстричься" }
  - { pl: "czesać włosy", ru: "причёсываться" }
family:
  - { pl: "włos", ru: "волос", relation: root }
  - { pl: "włochaty", ru: "волосатый", relation: derived }
etymology: "Множественное от włos «волос», праславянское *volsъ. Русское «волос» — то же слово, только с полногласием: włos — волос, głowa — голова."
memory: "włosy — «волосы», и, как в русском, слово живёт во множественном числе: один волосок это włos. Запомните разницу в привычке: поляк myje włosy «моет волосы» там, где русский моет голову. И чередование ło — оло: włos — волос."
idioms:
  - { pl: "myć włosy", ru: "мыть голову" }
  - { pl: "obciąć włosy", ru: "подстричься" }
  - { pl: "z długimi włosami", ru: "с длинными волосами" }
