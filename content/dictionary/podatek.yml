        ru: "Местные налоги устанавливает совет гмины."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Гласная e беглая: PODATEK, но PODATKU, podatkiem, podatki. Это уже целый ряд в словаре: czwartek — czwartku, smutek — smutku, żołądek — żołądka, upadek — upadku. Форма podatku при этом служит и родительным, и предложным." }
  - { kind: usage, text: "Слово построено от DAĆ: налог есть то, что отдают. Русское «налог» собрано от «налагать» — то, что накладывают, — и это та же вещь, увиденная с другой стороны: поляки смотрят глазами плательщика, мы глазами казны. Любопытно, что прежнее русское слово держалось польской картины: «подать» — тоже от «подать», то есть отдать. От того же корня здесь PODATNIK «налогоплательщик» и прилагательное podatkowy." }
collocations:
  - { pl: "podatek dochodowy", ru: "налог на доходы" }
  - { pl: "płacić podatki", ru: "платить налоги" }
  - { pl: "podatek od nieruchomości", ru: "налог на недвижимость" }
family:
  - { pl: "dać", ru: "дать", relation: root, id: dac }
  - { pl: "podatkowy", ru: "налоговый", relation: derived }
  - { pl: "podatnik", ru: "налогоплательщик", relation: derived }
etymology: "От DAĆ, из праславянского *dati — то же слово, что русское «дать», с приставкой po- и суффиксом -ek. Налог понят как отданное, и наше устаревшее «подать» устроено точно так же. Современное «налог» выбрало другую мысль, от «налагать», и смотрит на дело со стороны того, кто налагает, а не того, кто платит."
memory: "Беглая e: podatek, но do podatku. А построено от «дать»: налог — это отданное, как в нашем старом «подать»."
idioms:
  - { pl: "podatek dochodowy", ru: "налог на доходы" }
  - { pl: "płacić podatki", ru: "платить налоги" }
