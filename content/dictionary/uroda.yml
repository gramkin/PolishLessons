notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: uroda — это КРАСОТА, а не урод. Урод по-польски potwór или brzydal. Корень тот же, что в русском «уродиться», «урожай»: хорошо уродившийся — значит пригожий." }
  - { kind: government, text: "Женский род: ta uroda, tej urody. Завидовать красоте — zazdrościć urody, с родительным падежом." }
  - { kind: usage, text: "Слово почти всегда о человеке; о вещи скажут piękno «красота»." }
  - { kind: usage, text: "Прилагательное urodziwy «пригожий»; salon urody — «салон красоты»." }
