# review
id: zrelaksowac
format: 2
lemma: "zrelaksować"
rank: 4232
pos: verb
pron: { cyr: "зрэлаксо́ваць" }
senses:
  - id: relax
    ru: "с SIĘ — расслабиться, отдохнуть"
    examples:
      - pl: "Zrelaksował się w saunie."
        ru: "Он расслабился в сауне."
        source: { kind: authored }
      - pl: "Chcę się wreszcie zrelaksować."
        ru: "Я хочу наконец расслабиться."
        source: { kind: authored }
      - pl: "Zrelaksuj się i zamknij oczy."
        ru: "Расслабься и закрой глаза."
        source: { kind: authored }
  - id: soothe
    ru: "расслабить, успокоить (кого-то, мышцы)"
    examples:
      - pl: "Kąpiel ją zrelaksowała."
        ru: "Ванна её расслабила."
        source: { kind: authored }
      - pl: "Masaż zrelaksuje napięte mięśnie."
        ru: "Массаж расслабит напряжённые мышцы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZRELAKSOWAĆ SIĘ — бытовое «расслабиться, отдохнуть», заимствованное из английского. Более польские синонимы — ODPRĘŻYĆ SIĘ и ODPOCZĄĆ. ZRELAKSOWANY — «расслабленный, отдохнувший»." }
  - { kind: usage, text: "Пятьдесят три формы, включая ZRELAKSOWANI — «расслабленные». Почти всегда с SIĘ. Спряжение на -UJĘ: ZRELAKSUJĘ SIĘ, ZRELAKSUJESZ SIĘ. Несовершенный вид — RELAKSOWAĆ SIĘ." }
  - { kind: government, text: "С SIĘ — где и при чём: ZRELAKSOWAĆ SIĘ W SPA, PRZY MUZYCE, NAD MORZEM. Кого или что — винительный: ZRELAKSOWAĆ MIĘŚNIE. Чем — творительный: ZRELAKSOWAĆ SIĘ KĄPIELĄ." }
  - { kind: pronunciation, text: "Читается «зрэлаксо́ваць»: RE — «рэ», ударение на предпоследнем слоге SO. ZRELAKSUJĘ — «зрэлаксу́е»." }
  - { kind: register, text: "Разговорное, модное слово из рекламы и глянца. В книжной речи — ODPRĘŻYĆ SIĘ. ZRELAKSOWAĆ SIĘ NA CAŁEGO — разговорное «оттянуться по полной»." }
collocations:
  - { pl: "zrelaksować się w spa", ru: "расслабиться в спа" }
  - { pl: "zrelaksować się przy muzyce", ru: "расслабиться под музыку" }
  - { pl: "zrelaksować mięśnie", ru: "расслабить мышцы" }
family:
  - { pl: "relaks", ru: "отдых, расслабление", relation: root }
  - { pl: "zrelaksowany", ru: "расслабленный, отдохнувший", relation: derived }
  - { pl: "relaksować", ru: "расслаблять", relation: aspect }
etymology: "Приставка Z- плюс RELAKSOWAĆ, от RELAKS, заимствованного из английского relax, а то — из латинского relaxare «ослаблять». Русское «релакс» — то же слово."
memory: "Zrelaksować się — расслабиться: zrelaksował się w saunie. Zrelaksowany — отдохнувший. Синоним — odprężyć się. Читается «зрэлаксо́ваць»."
idioms:
  - { pl: "zrelaksować się na całego", ru: "оттянуться по полной, как следует расслабиться" }
formExamplesSkip:
  - { form: "zrelaksowano", reason: "безличная форма неестественна" }
