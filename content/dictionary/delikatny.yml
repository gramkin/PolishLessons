      - pl: "Dotknął jej ramienia delikatnym ruchem."
        ru: "Он коснулся её плеча мягким движением."
        source: { kind: authored }
  - id: faint
    ru: "лёгкий, слабый, еле заметный (о запахе, звуке)"
    examples:
      - pl: "W kuchni unosił się delikatny zapach wanilii."
        ru: "На кухне стоял лёгкий запах ванили."
        source: { kind: authored }
      - pl: "Delikatny szmer dobiegał zza ściany."
        ru: "Лёгкий шорох доносился из-за стены."
        source: { kind: authored }
  - id: tactful
    ru: "деликатный, тактичный (о человеке, вопросе)"
    examples:
      - pl: "To delikatna sprawa, nie przy wszystkich."
        ru: "Это деликатное дело, не при всех."
        source: { kind: authored }
      - pl: "Był na tyle delikatny, że nie dopytywał."
        ru: "Он был настолько деликатен, что не расспрашивал."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ СЛОВО ЗНАЧИТЕЛЬНО ШИРЕ РУССКОГО. Русское «деликатный» сузилось почти до одного смысла — тактичный, щекотливый. Польское delikatny покрывает ещё и «НЕЖНЫЙ» (delikatna skóra «нежная кожа», delikatna tkanina «нежная ткань»), «ХРУПКИЙ» (delikatne zdrowie «слабое здоровье») и «ЛЁГКИЙ, еле уловимый» (delikatny zapach «лёгкий запах»). Переводить его одним русским словом нельзя — смотрите, о чём речь." }
  - { kind: usage, text: "Совпадают языки только в третьем значении: delikatna sprawa — это ровно «деликатное дело», а delikatny człowiek — «деликатный, тактичный человек». Во всех прочих случаях русскому нужны «нежный», «хрупкий» или «лёгкий»." }
  - { kind: pronunciation, text: "Тридцать три формы — полный набор из трёх степеней по одиннадцати: delikatny, delikatniejszy, najdelikatniejszy. Это та же схема, что у rzadki, в отличие от относительных прилагательных вроде południowy, у которых степеней нет и форм всего одиннадцать." }
  - { kind: register, text: "Наречие delikatnie значит и «нежно», и «осторожно»: delikatnie mówiąc — «мягко говоря», оборот совершенно обиходный. А delikatnie rzecz ujmując — его книжный двойник." }
collocations:
  - { pl: "delikatna sprawa", ru: "деликатное дело" }
  - { pl: "delikatna skóra", ru: "нежная кожа" }
  - { pl: "delikatnie mówiąc", ru: "мягко говоря" }
family:
  - { pl: "delikatnie", ru: "нежно, осторожно", relation: derived }
  - { pl: "delikatność", ru: "деликатность, нежность", relation: derived }
  - { pl: "subtelny", ru: "тонкий, утончённый", relation: derived }
etymology: "Из латинского delicatus «изнеженный, утончённый», пришедшего в польский через французский и немецкий. Русское «деликатный» — то же заимствование и тем же путём, но значение в русском сузилось до тактичности, тогда как польский сохранил весь веер исходных смыслов: нежный, хрупкий, еле уловимый, тактичный."
memory: "delikatny — не только «деликатный». Чаще всего это «НЕЖНЫЙ» (delikatna skóra) или «лёгкий, еле уловимый» (delikatny zapach). С русским слово совпадает лишь в обороте delikatna sprawa «деликатное дело»."
idioms:
  - { pl: "delikatnie mówiąc", ru: "мягко говоря" }
  - { pl: "delikatna sprawa", ru: "щекотливое дело" }
