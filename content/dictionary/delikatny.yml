# review
id: delikatny
format: 2
lemma: "delikatny"
rank: 2016
pos: adj
pron: { cyr: "дэлика́тны" }
senses:
  - id: gentle
    ru: "нежный, мягкий (о коже, ткани, прикосновении)"
    examples:
      - pl: "Ma bardzo delikatną skórę."
        ru: "У него очень нежная кожа."
