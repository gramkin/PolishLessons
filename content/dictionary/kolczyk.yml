etymology: "От KOLEC «шип», а то — от глагола KŁUĆ «колоть», праславянского и того же, что русское «колоть». Серёжку назвали по действию: она прокалывает ухо и держится в нём, как шип. Русское слово выбрало другой признак, и пришло оно из турецкого: «серьга», а от неё «серёжка». Из польского же гнезда идут и KOLCZASTY, и KOL, и всё это родня нашим «колючке», «колу» и «колоть»."
memory: "Серёжка, но названа не по виду, а по делу: kolczyk от kolec «шип», потому что прокалывает ухо. Наша «серёжка» идёт от турецкой «серьги» и названа по кольцу. Читается «ко́льчык», где l перед cz даёт «ль», а y — «ы». Родня в гнезде наша: kluc это «колоть», kolczasty — «колючий», как в drut kolczasty «колючая проволока». Второе значение — бирка в ухе скота."
idioms:
