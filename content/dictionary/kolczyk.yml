notes:
  - { kind: false-friend, text: "Два языка увидели в одной вещи разное. Польское KOLCZYK собрано от KOLEC «шип, колючка»: серёжка это маленький шип, названный по тому, что прокалывает. А русская «серёжка» идёт от «серьги», слова турецкого, и названа по виду, по кольцу. Шип в польском гнезде живёт и дальше: DRUT KOLCZASTY это «колючая проволока», а KŁUĆ значит «колоть», в точности как у нас." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Основа не меняется, беглых гласных нет. Второе значение вполне обиходное в деревне: KOLCZYK у коровы или овцы это бирка с номером, и ZAKOLCZYKOWAĆ значит «поставить бирку». Уменьшительных от слова не делают, оно само уже уменьшительное от KOLEC." }
  - { kind: government, text: "Серёжка в ухе — KOLCZYK W UCHU, местный падеж, и заметьте, что UCHO даёт тут UCHU. Проколоть уши — PRZEKŁUĆ USZY, винительный без предлога. Без серёжки — BEZ KOLCZYKA, родительный. Пара серёжек — PARA KOLCZYKÓW, родительный множественного." }
  - { kind: pronunciation, text: "Читается «ко́льчык», два слога, ударение на первом. Буква L перед согласной CZ звучит как «ль», поэтому первый слог это «коль». Сочетание CZ даёт «ч», а Y — «ы», отсюда «чык». Для русского уха трудность здесь одна: не поддаться и не прочесть «колчик»." }
  - { kind: register, text: "Слово нейтральное и повседневное. В ювелирном это ZŁOTE KOLCZYKI и KOLCZYKI Z PERŁĄ. Про прокол говорят PRZEKŁUTE USZY, и KOLCZYK W NOSIE или KOLCZYK W BRWI звучат так же обычно, как у нас. А в хозяйстве KOLCZYK значит бирку, и без неё корову не продашь: номер в ухе обязателен по закону." }
