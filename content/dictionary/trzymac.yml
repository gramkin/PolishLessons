# review
id: trzymac
format: 2
lemma: "trzymać"
rank: 188
pos: verb
aspect: imperf
pron: { cyr: "тшы́маць" }
senses:
  - id: hold
    ru: "держать (что-либо в руках)"
    examples:
      - pl: "Trzymam książkę."
        ru: "Я держу книгу."
        source: { kind: tatoeba, id: 2151413 }
      - pl: "Trzymasz książkę do góry nogami."
        ru: "Ты держишь книгу вверх ногами."
        source: { kind: tatoeba, id: 13204811 }
      - pl: "Zawsze trzymaj swój słownik pod ręką."
        ru: "Всегда имей словарь под рукой."
        source: { kind: tatoeba, id: 2146310 }
  - id: hold-on
    ru: "trzymać się — держаться (за что-либо, чего-либо)"
    note: "trzymać się czegoś — с родительным падежом: trzymać się zasad «держаться правил»."
    examples:
      - pl: "Trzymaj się z dala od tego durnia."
        ru: "Держись от этого дурака подальше."
        source: { kind: tatoeba, id: 13784950 }
      - pl: "Prawdziwi przyjaciele trzymają się razem na dobre i na złe."
        ru: "Настоящие друзья держатся вместе и в добре, и во зле."
        source: { kind: tatoeba, id: 2158073 }
      - pl: "Trzymaj się poręczy."
        ru: "Держись за перила."
        source: { kind: authored }
notes:
  - { kind: government, text: "trzymać coś — винительный падеж; trzymać się czegoś — родительный: Trzymam książkę, но Trzymam się zasad." }
  - { kind: usage, text: "trzymać kciuki значит «держать кулачки»: поляки держат большие пальцы, а не скрещивают указательные." }
  - { kind: usage, text: "Trzymaj się! — тёплое «Держись!» при прощании; Jak się trzymasz? — «Как держишься?»." }
collocations:
  - { pl: "trzymać kciuki", ru: "держать кулачки" }
  - { pl: "trzymać się zasad", ru: "держаться правил" }
  - { pl: "trzymaj się!", ru: "держись!" }
  - { pl: "trzymać w ręku", ru: "держать в руке" }
etymology: "Праславянское *trimati; ближайший родственник — украинское «тримати». В русском этот глагол не сохранился, его место занял «держать»."
memory: "trzymać coś — винительный, trzymać się czegoś — родительный. Два оборота на каждый день: trzymać kciuki «держать кулачки» (поляки держат большие пальцы) и Trzymaj się! «Держись!»."
idioms:
  - { pl: "trzymać kciuki", ru: "держать кулачки" }
  - { pl: "trzymać język za zębami", ru: "держать язык за зубами" }
  - { pl: "trzymać fason", ru: "держать марку" }
