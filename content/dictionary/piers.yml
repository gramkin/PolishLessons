# review
id: piers
format: 2
lemma: "pierś"
rank: 1658
pos: noun
pron: { cyr: "перьсь" }
senses:
  - id: breast
    ru: "грудь (женская)"
    examples:
      - pl: "Ona ma duże piersi."
        ru: "У неё большая грудь."
        source: { kind: tatoeba, id: 967586 }
      - pl: "Piersi mnie bolą."
        ru: "У меня болит грудь."
        source: { kind: translated, id: 568260 }
      - pl: "Ona ma raka piersi."
        ru: "У неё рак груди."
        source: { kind: translated, id: 10607708 }
  - id: chest
    ru: "грудь, грудная клетка"
    examples:
      - pl: "Kula przeszła przez jego piersi."
        ru: "Пуля прошла через его грудь."
        source: { kind: translated, id: 922453 }
      - pl: "Chłopiec przytulił pieska do piersi."
        ru: "Мальчик прижал собачку к груди."
        source: { kind: translated, id: 592711 }
      - pl: "Policjant stał jak rzeźba, z rękami skrzyżowanymi na piersiach."
        ru: "Полицейский стоял как статуя, скрестив руки на груди."
        source: { kind: translated, id: 919294 }
  - id: breastfeed
    ru: "karmić piersią — кормить грудью"
    examples:
      - pl: "Karmię dziecko piersią."
        ru: "Я кормлю ребёнка грудью."
        source: { kind: translated, id: 349353 }
      - pl: "Lekarze twierdzą, że dzieci karmione piersią zwykle są zdrowsze."
        ru: "Врачи утверждают, что дети на грудном вскармливании обычно здоровее."
        source: { kind: translated, id: 7179959 }
notes:
  - { kind: usage, text: "Существительное женского рода на мягкую основу: pierś, piersi, piersią. Базовая форма pierś в корпусе не встречается — слово живёт во множественном и в косвенных падежах." }
  - { kind: usage, text: "karmić piersią — «кормить грудью», творительный падеж без предлога." }
  - { kind: usage, text: "zapierać dech w piersiach — «захватывать дух», буквально «запирать дыхание в груди»." }
  - { kind: usage, text: "Третье значение — кулинарное: pierś z kurczaka «куриная грудка»." }
collocations:
  - { pl: "karmić piersią", ru: "кормить грудью" }
  - { pl: "rak piersi", ru: "рак груди" }
  - { pl: "zapierać dech w piersiach", ru: "захватывать дух" }
etymology: "Праславянское *pьrsi — то же слово, что русские «перси» (устар.) и родственное «перед». Современное русское «грудь» — другой корень, поэтому связь не на слуху."
memory: "pierś = «грудь», женского рода на мягкую основу: piersi, piersią. Базовая форма в корпусе не встречается — слово живёт во множественном. Запомните karmić piersią «кормить грудью»."
idioms:
