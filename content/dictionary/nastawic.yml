  - { pl: "stawiać", ru: "ставить", relation: root, id: stawiac }
  - { pl: "nastawienie", ru: "настрой, отношение", relation: derived }
etymology: "Приставка na- и STAWIĆ «ставить», от STAĆ «стоять», из праславянского *staviti — то же слово, что русское «ставить». Соответствие прямое, и приставка та же, что в русском «наставить». Разошлись значения: русское «наставить» это прежде всего «поучать» или «направить», а польское NASTAWIĆ — «поставить прибор, настроить». Из гнезда вышли NASTAWIENIE «настрой», USTAWIĆ «установить», PRZESTAWIĆ «переставить», ZASTAWIĆ «заставить, заложить», POSTAWA «осанка, позиция»."
memory: "nastaw wodę — «поставь воду», главная домашняя фраза. И сравните с narób: закрытый слог удлиняет только o, поэтому narób с ó, а nastaw с обычным a."
