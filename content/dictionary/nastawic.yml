notes:
  - { kind: pronunciation, text: "Повелительное NASTAW стоит сравнить с NARÓB из прошлой партии, потому что вместе они показывают границу правила. В обоих случаях слог закрывается: NAROBI даёт NAROB, NASTAWI даёт NASTAW. Но удлиняется только o, и потому выходит NARÓB с ó — а в NASTAW гласная a остаётся как была. Правило касается одной гласной, не всех: o переходит в ó в закрытом слоге, a не переходит никуда. Отсюда и NASTAW, NASTAWMY, NASTAWCIE без всякой мены." }
  - { kind: usage, text: "Первое значение самое частое и совершенно бытовое: NASTAWIĆ WODĘ — «поставить воду» на огонь, NASTAWIĆ BUDZIK — «поставить будильник», NASTAWIĆ RADIO — «настроить радио», NASTAWIĆ PRALKĘ — «включить стиральную машину». Русский здесь берёт то «поставить», то «настроить», то «включить», а польский обходится одним глаголом. Самое полезное — запомнить NASTAW WODĘ: в польском доме эту фразу слышно каждый день." }
  - { kind: usage, text: "Страдательное причастие живёт отдельно как прилагательное о настроении и отношении: NASTAWIONY значит «настроенный». JEST DO NAS ŹLE NASTAWIONY — «он к нам плохо настроен», POZYTYWNIE NASTAWIONY — «настроен положительно». А существительное NASTAWIENIE — «настрой, установка, отношение»: JEGO NASTAWIENIE DO PRACY — «его отношение к работе». Это слово в польском очень частое, куда частее самого глагола во втором значении." }
  - { kind: government, text: "Для приборов — предлог NA с винительным: NASTAWIĆ BUDZIK NA SZÓSTĄ, NASTAWIĆ RADIO NA INNĄ STACJĘ. Русский берёт здесь то же «на» с винительным. Для настроения против кого-то — предлог PRZECIWKO с дательным или PRZECIW с дательным: NASTAWIĆ KOGOŚ PRZECIWKO KOMUŚ, где русский берёт «против» с родительным. То есть предлог похож, а падеж другой. Отношение к чему-то идёт с DO и родительным: NASTAWIENIE DO PRACY. Несовершенная пара — NASTAWIAĆ." }
collocations:
  - { pl: "nastawić budzik", ru: "поставить будильник" }
  - { pl: "nastawić wodę", ru: "поставить воду" }
  - { pl: "być źle nastawionym", ru: "быть плохо настроенным" }
family:
