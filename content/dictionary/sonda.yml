notes:
  - { kind: false-friend, text: "SONDA — «зонд», женского рода, с S. Но в журналистике SONDA — «опрос»: SONDA ULICZNA — «опрос на улице». Социологический опрос — SONDAŻ. Зондировать почву — BADAĆ GRUNT." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном D переходит в DZ: W SONDZIE. Родительный множественного — SOND. Звательный SONDO не употребляется." }
  - { kind: government, text: "Опрос среди кого — SONDA WŚRÓD и родительный. Зонд на Марс — SONDA NA MARSA, винительный. Ввести зонд — WPROWADZIĆ SONDĘ." }
  - { kind: pronunciation, text: "Читается «со́нда», ударение на первом слоге. SONDZIE — «со́ндзе»." }
collocations:
  - { pl: "sonda kosmiczna", ru: "космический зонд" }
  - { pl: "sonda uliczna", ru: "уличный опрос" }
  - { pl: "sonda internetowa", ru: "интернет-опрос" }
