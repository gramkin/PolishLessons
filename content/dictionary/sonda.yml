etymology: "Из французского SONDE «лот, зонд», от SONDER «измерять глубину». Русское «зонд» — то же слово через немецкий, с З."
memory: "Sonda — зонд и уличный опрос. Sonda kosmiczna — космический зонд. Sondaż — соцопрос. Читается «со́нда»."
