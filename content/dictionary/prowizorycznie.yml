etymology: "Через латинское provisorius «предварительный, временный» от providere «предусматривать». Русское «провизорный» — то же заимствование, но в русском оно книжное и редкое, тогда как польское prowizorycznie совершенно повседневно."
memory: "prowizorycznie — «на время, на скорую руку». От латинского provisorius «предварительный»; русский однокоренной «провизорный» звучит книжно, а польское слово обыденно."
