notes:
  - { kind: usage, text: "Значит «временно, на скорую руку», с оттенком «пока не сделаем как надо»." }
  - { kind: usage, text: "Наречие от prowizoryczny «временный, предварительный»; разговорное существительное prowizorka — «времянка, самоделка»." }
  - { kind: government, text: "Неизменяемое наречие. Степеней практически не образует: нужную степень дают bardziej prowizorycznie и najbardziej prowizorycznie." }
  - { kind: false-friend, text: "Не о провизии и не о провизоре: слово идёт от латинского provisorius «предварительный», как книжное русское «провизорный»." }
