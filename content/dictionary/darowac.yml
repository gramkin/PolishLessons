etymology: "От DAR, праславянское *darъ, то же слово, что русский «дар», и дальше от корня *dati «дать» с суффиксом -r-. Гнездо в двух языках общее почти целиком: польские DAR, DAROWAĆ, PODARUNEK, DAROWIZNA и русские «дар», «дарить», «подарок», «дарственная». Расходится не состав, а стиль: русский развёл «дарить» для быта и «даровать» для высокого слога, а польский обошёлся одним глаголом на оба случая. Значение прощения выросло из того же образа: простить долг значит подарить его, отдать даром, и та же метафора работает в немецком SCHENKEN и в английском FORGIVE, где GIVE сидит внутри слова."
memory: "Корень общий с русским «даром», но стиль другой: польское darować обиходно и значит «подарить», тогда как русское «даровать» высокое. Второе значение русскому незнакомо: darować winę «простить вину», darować dług, darować życie «пощадить» — простить значит подарить, та же метафора в английском forgive. Очень частое daruj sobie «брось, перестань». Шестьдесят четыре формы, потому что глагол двувидовой: в списке есть и darujący, который бывает только у несовершенного, и darowawszy, который только у совершенного."
