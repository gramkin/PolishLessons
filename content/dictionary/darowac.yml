notes:
  - { kind: false-friend, text: "Русское «даровать» высокое и книжное: даруют свободу, жизнь, милость, и в быту так не говорят. Польское DAROWAĆ — слово обиходное и означает прежде всего «подарить»: DAROWAŁ WNUKOWI ZEGAREK. Обычное русское «дарить» и «подарить» отвечают ему точно, а «даровать» звучало бы торжественно и неуместно. Второе значение русскому однокоренному слову вовсе незнакомо: DAROWAĆ KOMUŚ WINĘ значит «простить вину», DAROWAĆ DŁUG — «простить долг», а DAROWAĆ KOMUŚ ŻYCIE — «пощадить». Поэтому одно польское слово покрывает и подарок, и прощение." }
  - { kind: government, text: "Два дополнения: DAROWAĆ COŚ KOMUŚ, винительный вещи и дательный лица — DAROWAŁ SYNOWI DOM. В значении прощения строится так же: DAROWAĆ KOMUŚ WINĘ, DAROWAĆ KOMUŚ DŁUG. Отдельно стоит возвратный оборот DAROWAĆ SOBIE COŚ, то есть отказаться от чего-то, не делать: DARUJ SOBIE значит «брось», «перестань», и в живой речи это одно из самых частых употреблений глагола. Юридическое существительное от него — DAROWIZNA «дарение», и договор дарения называется UMOWA DAROWIZNY." }
  - { kind: usage, text: "Шестьдесят четыре формы, и это редкий случай: глагол двувидовой, то есть служит и совершенным, и несовершенным. Доказательство лежит прямо в списке форм. Действительное причастие DARUJĄCY бывает только у несовершенного вида, а деепричастие прошедшего времени DAROWAWSZY — только у совершенного; вместе они не уживаются ни в одном обычном глаголе. Отсюда и счёт: шестьдесят три формы переходного несовершенного плюс одна форма на -WSZY. Настоящее время DARUJĘ значит по контексту и «дарю», и «подарю»." }
  - { kind: pronunciation, text: "Читается «даро́вачь», три слога, ударение на втором. Буква O в обоих слогах чистая, W звучит как «в». Конечное -Ć это мягкое «чь». В форме DARUJĘ слышно «дару́е», где конечное Ę на конце слова даёт чистое «э». В форме DARUJĄ звучит «дару́ён», с носовым Ą. В форме DAROWAWSZY слышно «дарова́фшы», где W перед SZ оглушается. В формах причастия DARUJĄCY ударение переходит на предпоследний слог: «даруё́нцы»." }
  - { kind: register, text: "Глагол нейтральный и повседневный в обоих значениях. Устойчивые сочетания: DAROWAĆ KOMUŚ ŻYCIE «пощадить», DAROWAĆ DŁUG, DARUJ SOBIE «брось, перестань», DAROWANEMU KONIOWI NIE ZAGLĄDA SIĘ W ZĘBY — пословица, совпадающая с русской о дарёном коне слово в слово. Вежливая формула DARUJ, ŻE PRZERYWAM значит «прости, что перебиваю» и звучит мягче, чем PRZEPRASZAM. Существительные того же гнезда: DAR, PODARUNEK, PREZENT, DAROWIZNA, и последнее принадлежит языку права." }
collocations:
  - { pl: "darować komuś życie", ru: "пощадить, даровать жизнь" }
  - { pl: "darować dług", ru: "простить долг" }
