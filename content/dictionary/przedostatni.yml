notes:
  - { kind: usage, text: "Слово собрано так же, как русское: PRZED «перед» + OSTATNI «последний». Склоняется оно точно как OSTATNI, по мягкому типу: окончания -IA, -IE, -IEGO, -IEJ, -IM. Форм десять, а не одиннадцать, потому что PRZEDOSTATNI совпадает в двух клетках: мужской род единственного числа (PRZEDOSTATNI ROZDZIAŁ) и мужско-личное множественное (JESTEŚMY PRZEDOSTATNI). Степеней сравнения нет." }
  - { kind: stress, text: "Это слово стоит знать хотя бы ради одного правила: в польском ударение почти всегда падает на PRZEDOSTATNIA SYLABA, предпоследний слог. Само слово ему подчиняется: «пшэдоста́тни», ударение на STAT. В косвенных падежах слогов становится больше, и ударение сдвигается: PRZEDOSTATNIEGO, «пшэдостатне́го»." }
  - { kind: pronunciation, text: "Начало PRZ читается «пш»: RZ после глухого P оглушается. Конечное NI мягкое, «ни», как в русском «тни». В форме PRZEDOSTATNIA слог NIA звучит как «ня», одним слогом." }
collocations:
  - { pl: "przedostatnia sylaba", ru: "предпоследний слог" }
  - { pl: "przedostatnie miejsce", ru: "предпоследнее место" }
  - { pl: "przedostatni raz", ru: "предпоследний раз" }
family:
  - { pl: "ostatni", ru: "последний", relation: root, id: ostatni }
  - { pl: "ostatnio", ru: "в последнее время", relation: root }
  - { pl: "ostateczny", ru: "окончательный", relation: root }
etymology: "Сложение предлога przed «перед» и прилагательного ostatni «последний», точная параллель русскому «предпоследний»."
memory: "przed + ostatni = «пред» + «последний». Главный пример — правило ударения: akcent pada na przedostatnią sylabę, и само слово тоже ударено на предпоследнем слоге."
idioms:
