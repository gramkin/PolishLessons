notes:
  - { kind: false-friend, text: "Слово и его русский двойник совпадают по корню и резко расходятся по вежливости. Русское «паскудный» звучит грубо и старомодно, почти как брань, и в обычном разговоре его не употребляют. Польское PASKUDNY — слово совершенно обиходное и умеренное: так говорят о погоде, о запахе, о характере, и ничего неприличного в нём нет. PASKUDNA POGODA есть просто «отвратительная погода», и это можно сказать в любой компании. Поэтому переводить его русским «паскудным» почти всегда неверно по регистру: нужны «мерзкий», «отвратительный», «ужасный», «скверный»." }
  - { kind: usage, text: "Степени сравнения правильные, суффиксом: PASKUDNY, PASKUDNIEJSZY, NAJPASKUDNIEJSZY. Это тот же класс, что ROZSĄDNY и POPULARNY, и противоположность коротким исконным прилагательным вроде SZEROKI, которые основу укорачивают. Наречие — PASKUDNIE, и в живой речи оно встречается не реже прилагательного: PASKUDNIE SIĘ ZACHOWAŁ «он скверно себя повёл», NA DWORZE JEST PASKUDNIE «на улице отвратительно». Существительное PASKUDA значит и мерзкую вещь, и мерзкого человека, и вот оно уже заметно грубее самого прилагательного." }
  - { kind: pronunciation, text: "Читается «паску́дны», ударение на предпоследнем слоге, то есть на -KU-. Все гласные открытые и без редукции: первое A звучит полным «а», а не «ъ», как в русской безударной позиции. Конечное Y даёт русское «ы». Мужско-личная форма множественного PASKUDNI звучит «паску́дни», с мягким n. В сравнительной степени PASKUDNIEJSZY ударение сдвигается на -NIEJ-: «паскудне́йшы»." }
  - { kind: register, text: "Прилагательное разговорное, но вполне приличное, и в прессе встречается свободно: PASKUDNA AFERA «мерзкая афера». В официальном документе его всё же заменят на NIEPRZYJEMNY «неприятный» или NAGANNY «предосудительный». Ругательством PASKUDNY не является, и ребёнку сказать его можно, в отличие от PASKUDA, которое уже обидно. Самое частое употребление — о погоде, и это стоит запомнить как готовую реплику: ALE PASKUDNA POGODA! «ну и погода!»." }
