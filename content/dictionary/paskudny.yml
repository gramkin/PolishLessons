etymology: "От существительного PASKUDA, и в начале слова стоит та же приставка PA-, что в PAZNOKIEĆ: она означает нечто производное, искажённое, уклонившееся от нормы, и видна в польском PAGÓREK и в русских «пасынок», «паводок». Корень обычно связывают с праславянским *skǫdъ «скудный, недостаточный», откуда русское «скудный» и польское SKĄPY «скупой». Путь значения тогда такой: сначала «убогий, худой», затем «негодный», и наконец «мерзкий». Русское «паскуда» и «паскудный» собраны из тех же частей и тем же способом, так что слова не заимствованы друг у друга, а унаследованы оба. Разошлись они только в приличии: польский оставил прилагательное в бытовом употреблении, русский сдвинул его в брань."
memory: "Корень общий с русским «паскудным», но вежливость разная: польское paskudny совершенно обиходно — paskudna pogoda «отвратительная погода» можно сказать где угодно. Переводить лучше «мерзкий, отвратительный». Приставка pa- та же, что в paznokieć: «уклонившееся от нормы». Степени правильные: paskudniejszy, najpaskudniejszy."
