# review
id: paczka
format: 2
lemma: "paczka"
rank: 2161
pos: noun
pron: { cyr: "па́чка" }
senses:
  - id: parcel
    ru: "посылка, бандероль"
    examples:
      - pl: "Paczka dotarła w trzy dni."
        ru: "Посылка дошла за три дня."
        source: { kind: authored }
      - pl: "Odebrał paczkę na poczcie."
        ru: "Он получил посылку на почте."
        source: { kind: authored }
  - id: pack
    ru: "пачка (сигарет, чая)"
    examples:
      - pl: "Kupił paczkę papierosów."
        ru: "Он купил пачку сигарет."
        source: { kind: authored }
      - pl: "Została ostatnia paczka herbaty."
        ru: "Осталась последняя пачка чая."
        source: { kind: authored }
  - id: group
    ru: "компания, компашка (друзей)"
    examples:
      - pl: "Cała paczka wybrała się nad jezioro."
        ru: "Вся компания отправилась на озеро."
        source: { kind: authored }
      - pl: "Trzymają się w jednej paczce od liceum."
        ru: "Они держатся одной компанией со школы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "СЛОВО ОДНО, А ГЛАВНОЕ ЗНАЧЕНИЕ РАЗНОЕ. Русская «пачка» — это пачка сигарет или денег, и такое значение у paczka тоже есть. Но чаще всего paczka значит «ПОСЫЛКА»: paczka pocztowa, odebrać paczkę, nadać paczkę. По-русски посылка «пачкой» не бывает никогда. А третье значение русскому и вовсе незнакомо: paczka przyjaciół — это «компания друзей», своя компашка." }
  - { kind: pronunciation, text: "В дательном и предложном падеже k переходит в c: paczka, но w paczce — «в па́чцэ». То же правило, что в fabryka → w fabryce и matka → matce. Русскому оно незнакомо: «в пачке» сохраняет к." }
  - { kind: usage, text: "БЕГЛОЕ E В РОДИТЕЛЬНОМ МНОЖЕСТВЕННОГО. Окончания в этом падеже нет, но между согласными вставляется e: paczka даёт paczek, matka — matek, marynarka — marynarek. Сравните с metod и głupot: там вставлять нечего, основа и так выговаривается." }
collocations:
  - { pl: "paczka pocztowa", ru: "почтовая посылка" }
  - { pl: "paczka papierosów", ru: "пачка сигарет" }
  - { pl: "paczka przyjaciół", ru: "компания друзей" }
family:
  - { pl: "paczuszka", ru: "пакетик, свёрточек", relation: derived }
  - { pl: "pakować", ru: "паковать", relation: derived }
  - { pl: "pakunek", ru: "свёрток", relation: derived }
etymology: "Из немецкого Pack через посредников, от того же корня, что «пакет» и «паковать». Русская «пачка» пришла тем же путём, поэтому слова совпадают по форме. Значение «посылка» развилось уже в польском, а «компания друзей» — ещё позже, из образа связки, пучка. Отсюда paczuszka, pakować и pakunek."
memory: "paczka — чаще всего «посылка», а не «пачка», хотя пачка сигарет тоже paczka. И третье значение: paczka przyjaciół это «компания друзей». Родительный множественного с беглым e: paczek."
idioms:
  - { pl: "paczka przyjaciół", ru: "компания друзей" }
  - { pl: "odebrać paczkę", ru: "получить посылку" }
