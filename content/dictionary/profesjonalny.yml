      - pl: "Ta drużyna gra w lidze profesjonalnej."
        ru: "Эта команда играет в профессиональной лиге."
        source: { kind: authored }
  - id: competent
    ru: "профессиональный, грамотный (о качестве работы)"
    examples:
      - pl: "Obsługa w hotelu była bardzo profesjonalna."
        ru: "Обслуживание в отеле было очень профессиональным."
        source: { kind: authored }
      - pl: "To nie było profesjonalne zachowanie."
        ru: "Это было непрофессиональное поведение."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Значения совпадают с русским «профессиональный», но у польского есть сильный конкурент: ZAWODOWY. О спортсмене или военном чаще говорят ZAWODOWY: ŻOŁNIERZ ZAWODOWY, BOKSER ZAWODOWY. PROFESJONALNY больше любит оценку качества: PROFESJONALNA OBSŁUGA, PROFESJONALNE PODEJŚCIE. Не профессиональный, а самодеятельный — AMATORSKI." }
  - { kind: usage, text: "В значении оценки слово сравнивается описательно: BARDZIEJ PROFESJONALNY, NAJBARDZIEJ PROFESJONALNY. Все одиннадцать форм живые. Форма для мужчин-людей PROFESJONALNI частая: PROFESJONALNI SPORTOWCY, PROFESJONALNI MUZYCY. Пишется с J после S: PROFESJONALNY, а не «профессиональный» с двумя S." }
  - { kind: government, text: "Может стоять и до, и после существительного: PROFESJONALNY SPRZĘT и SPRZĘT PROFESJONALNY. О человеке — чаще перед: PROFESJONALNY KUCHARZ. Работать профессионально — PRACOWAĆ PROFESJONALNIE, наречие на -NIE." }
  - { kind: pronunciation, text: "Читается «профэсьона́льны», пять слогов, ударение на предпоследнем. FE даёт твёрдое «фэ», SJO — «сьо», одно S, а не два. L перед согласной N мягкая: «ль»." }
  - { kind: register, text: "Нейтральное, но модное слово, особенно в рекламе и на собеседованиях: PROFESJONALNA FIRMA, PROFESJONALNA OBSŁUGA. В разговоре его часто сокращают до PRO: TO BYŁO PRO, «это было по-профессиональному». Старшее поколение предпочитает ZAWODOWY и FACHOWY." }
collocations:
  - { pl: "profesjonalny sprzęt", ru: "профессиональное оборудование" }
  - { pl: "profesjonalna obsługa", ru: "профессиональное обслуживание" }
  - { pl: "profesjonalne podejście", ru: "профессиональный подход" }
family:
  - { pl: "profesjonalista", ru: "профессионал", relation: root, id: profesjonalista }
  - { pl: "profesjonalnie", ru: "профессионально", relation: derived }
  - { pl: "zawodowy", ru: "профессиональный, кадровый", relation: root, id: zawodowy }
etymology: "Из латинского professio, «публичное заявление, род занятий», от profiteri «открыто заявлять». Профессией когда-то называли то, что человек открыто объявил своим делом. В польский слово пришло через французский professionnel, и польский суффикс -NY дал PROFESJONALNY. Своё, славянское, слово с тем же смыслом — ZAWODOWY, от ZAWÓD «профессия»."
memory: "Profesjonalny — профессиональный, особенно о качестве: profesjonalna obsługa, profesjonalny sprzęt. О спортсмене и военном чаще zawodowy. Одно s: профэсьона́льны."
idioms:
  - { pl: "profesjonalne podejście", ru: "профессиональный подход, деловой подход" }
