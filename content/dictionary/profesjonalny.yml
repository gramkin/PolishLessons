pron: { cyr: "профэсьона́льны" }
senses:
  - id: professional
    ru: "профессиональный (о работе за деньги, о специалисте)"
    examples:
      - pl: "Jest profesjonalnym fotografem od dwudziestu lat."
        ru: "Он профессиональный фотограф уже двадцать лет."
        source: { kind: authored }
