# review
id: odwiedziny
format: 2
lemma: "odwiedziny"
rank: 4549
pos: noun
pron: { cyr: "одведзи́ны" }
senses:
  - id: visit
    ru: "посещение, визит (в гости)"
    examples:
      - pl: "Wpadł do nas w odwiedziny."
        ru: "Он заглянул к нам в гости."
        source: { kind: authored }
      - pl: "Odwiedziny u babci to rodzinna tradycja."
        ru: "Визиты к бабушке — семейная традиция."
        source: { kind: authored }
      - pl: "Dziękujemy za odwiedziny!"
        ru: "Спасибо, что зашли!"
        source: { kind: authored }
  - id: visiting
    ru: "посещение (больного, заключённого)"
    examples:
      - pl: "Godziny odwiedzin w szpitalu są ograniczone."
        ru: "Часы посещений в больнице ограничены."
        source: { kind: authored }
      - pl: "Więzień czekał na odwiedziny żony."
        ru: "Заключённый ждал свидания с женой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODWIEDZINY — «посещение, визит», только во множественном. Корень здесь не от «видеть», а от «ведать»: ODWIEDZIĆ значит «проведать, навестить». PRZYJŚĆ W ODWIEDZINY — «прийти в гости»; в больнице и тюрьме ODWIEDZINY — «посещения, свидания»." }
  - { kind: usage, text: "Пять форм, только множественное число, как DRZWI или URODZINY. Глагол при нём тоже во множественном: ODWIEDZINY BYŁY KRÓTKIE. Родительный — ODWIEDZIN." }
  - { kind: government, text: "Прийти в гости — PRZYJŚĆ W ODWIEDZINY, W с винительным. Визит к кому-то — ODWIEDZINY U KOGOŚ, U с родительным. Часы посещений — GODZINY ODWIEDZIN, родительный." }
  - { kind: pronunciation, text: "Читается «одведзи́ны», четыре слога, ударение на третьем. WIE — «ве», DZI — «дзи», как в ODWIEDZIĆ «одве́дзиць»." }
collocations:
  - { pl: "krótkie odwiedziny", ru: "короткий визит" }
  - { pl: "odwiedziny u przyjaciół", ru: "визит к друзьям" }
  - { pl: "zaprosić w odwiedziny", ru: "пригласить в гости" }
family:
  - { pl: "odwiedzać", ru: "навещать", relation: derived, id: odwiedzac }
  - { pl: "odwiedzić", ru: "навестить", relation: derived, id: odwiedzic }
  - { pl: "nawiedzić", ru: "посетить (о беде, призраке); постигнуть", relation: derived }
etymology: "От ODWIEDZAĆ «навещать», чей корень тот же, что в WIEDZIEĆ «знать» и в русском «проведать» — «навестить, узнать, как дела». Тот же корень в NAWIEDZIĆ — «посетить» о беде или призраке."
memory: "Odwiedziny — визит, посещение, только во множественном. Читается «одведзи́ны». Przyjść w odwiedziny — прийти в гости. Godziny odwiedzin — часы посещений. Корень как в русском «проведать»."
idioms:
  - { pl: "przyjść w odwiedziny", ru: "прийти в гости" }
  - { pl: "godziny odwiedzin", ru: "часы посещений" }
