notes:
  - { kind: false-friend, text: "Значение то же, что у русского «инженера», оба слова заимствованы из французского, и расходятся они в написании и в обращении. Пишется INŻYNIER, через Ż и Y, и читается «инжынер»: русскому легко написать лишнее мягкое «не». Важнее другое — титул в обращении. Поляк говорит PANIE INŻYNIERZE так же естественно, как PANIE DOKTORZE и PANIE PROFESORZE, и обращение по званию обязательно в деловой речи. Русский в этом месте скажет по имени-отчеству, и прямое соответствие тут отсутствует: обращение «господин инженер» по-русски звучит чужеродно, а по-польски совершенно обычно." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, одушевлённое лицо. Именительных множественного два: INŻYNIEROWIE и INŻYNIERZY, и оба правильны. Первое почтительное, обычное для названий профессий с весом; второе показывает чередование R в RZ перед окончанием -Y и звучит нейтральнее. Местный и звательный единственного — INŻYNIERZE, с тем же чередованием. Именно звательная форма и дала обиходное PANIE INŻYNIERZE. Винительный единственного равен родительному, INŻYNIERA. Родительный множественного — INŻYNIERÓW." }
  - { kind: pronunciation, text: "Читается «инжы́нер», три слога, ударение на втором. Буква Ż даёт твёрдое «ж», а Y после неё — «ы», поэтому второй слог звучит «жы», а не «жи»: сочетание ŻY в польском всегда твёрдое. Конечное R раскатистое. В форме INŻYNIERZE буквосочетание RZ звучит «ж», и слово читается «инжыне́же» — два «ж» в одном слове, что для русского уха непривычно. В форме INŻYNIERÓW буква Ó даёт «у», а конечное W оглушается: «инжыне́руф»." }
  - { kind: register, text: "Слово нейтральное, но несёт оттенок звания: в Польше INŻYNIER это и профессия, и степень, которую получают после первой ступени технического образования, и она пишется перед фамилией сокращённо как INŻ. Отсюда и обращение PANIE INŻYNIERZE, которое на стройке и в проектном бюро звучит постоянно. Женская форма INŻYNIERKA в современной речи употребляется всё чаще, хотя старшее поколение скажет PANI INŻYNIER без изменения. Устойчивое INŻYNIER BUDOWY означает прораба, ответственного за площадку." }
