etymology: "Из французского INGÉNIEUR, а оно — от латинского INGENIUM «дарование, изобретательность», от которого же идут «гений» и «инженерия». Первоначально так называли того, кто строил военные машины, и смысл был ближе к «выдумщику», чем к расчётчику. Польский принял слово через французский и немецкий и записал его по своему произношению, с Ż и Y; русский получил его тем же путём и записал кириллицей, поэтому два слова звучат почти одинаково. Чередование R и RZ в формах INŻYNIERZE и INŻYNIERZY — чисто польское и очень старое: RZ в этих местах есть не что иное, как смягчённое R, и то же самое видно в парах TOWAR и TOWARZE, CZAR и CZARZE из предыдущей карточки."
memory: "То же французское слово, что русский «инженер», от латинского ingenium «дарование» — отсюда же «гений». Пишется через ż и y, читается «инжы́нер», с твёрдым «жы». Два именительных множественного: почтительное inżynierowie и нейтральное inżynierzy с чередованием r→rz. Это же чередование даёт звательную форму inżynierze, а с ней обиходное обращение panie inżynierze — по-польски обычное, по-русски чужеродное."
