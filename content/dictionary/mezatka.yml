# review
id: mezatka
format: 2
lemma: "mężatka"
rank: 4407
pos: noun
pron: { cyr: "мэнжа́тка" }
senses:
  - id: married-woman
    ru: "замужняя женщина"
    examples:
      - pl: "Mężatka z dwójką dzieci szuka pracy."
        ru: "Замужняя женщина с двумя детьми ищет работу."
        source: { kind: authored }
      - pl: "W ankiecie zaznaczyła: mężatka."
        ru: "В анкете она отметила: замужем."
        source: { kind: authored }
      - pl: "W tej grupie są same mężatki."
        ru: "В этой группе одни замужние."
        source: { kind: authored }
  - id: be-married
    ru: "быть замужем (BYĆ MĘŻATKĄ)"
    examples:
      - pl: "Czy pani jest mężatką?"
        ru: "Вы замужем?"
        source: { kind: authored }
      - pl: "Została mężatką w wieku dwudziestu lat."
        ru: "Она вышла замуж в двадцать лет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MĘŻATKA — от MĄŻ «муж», но русского существительного-пары нет: говорим «замужняя женщина» или просто «замужем». «Она замужем» — JEST MĘŻATKĄ. О мужчине говорят прилагательным: ON JEST ŻONATY, «он женат». Незамужняя — PANNA, холостяк — KAWALER." }
  - { kind: usage, text: "Десять форм, женский род, лицо. Перед E в дательном и местном падежах K переходит в C: MĘŻATCE. Родительный множественного — MĘŻATEK, с беглым E." }
  - { kind: government, text: "Быть замужем — BYĆ MĘŻATKĄ, творительный, как в русском «быть женой». Стать замужней — ZOSTAĆ MĘŻATKĄ. Выйти замуж — WYJŚĆ ZA MĄŻ: ZA с винительным, и сама форма MĄŻ здесь винительный." }
  - { kind: pronunciation, text: "Читается «мэнжа́тка», ударение на предпоследнем слоге. Ę перед Ż звучит «эн». В корне чередуются Ą и Ę: MĄŻ «монш», MĘŻA «мэ́нжа», MĘŻATKA." }
  - { kind: register, text: "Слово нейтральное, отчасти анкетное: в графе «семейное положение» пишут PANNA, MĘŻATKA, ROZWIEDZIONA, WDOWA. В разговоре чаще говорят MA MĘŻA — «у неё есть муж»." }
collocations:
  - { pl: "młoda mężatka", ru: "новобрачная, молодая жена" }
  - { pl: "świeżo upieczona mężatka", ru: "новоиспечённая жена" }
  - { pl: "szczęśliwa mężatka", ru: "счастливая в браке женщина" }
family:
  - { pl: "mąż", ru: "муж", relation: root, id: maz }
  - { pl: "zamężna", ru: "замужняя", relation: root }
  - { pl: "męski", ru: "мужской", relation: root, id: meski }
etymology: "От MĄŻ «муж» с суффиксом -ATKA. Ą в MĄŻ и Ę в MĘŻA, MĘŻATKA — один старый носовой гласный, которому в русском «муж» отвечает «у». Так же: RĘKA — «рука», ZĄB — «зуб»."
memory: "Mężatka — замужняя женщина, от mąż «муж». Jest mężatką — она замужем. On jest żonaty — он женат. Читается «мэнжа́тка»."
idioms:
  - { pl: "wyjść za mąż", ru: "выйти замуж" }
