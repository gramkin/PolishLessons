notes:
  - { kind: register, text: "Слово разговорное и молодёжное — усечение от spokojnie «спокойно». В официальной речи и на письме его не употребляют." }
  - { kind: usage, text: "Не склоняется и не изменяется: spoko koleś «классный парень», spoko sprawa «нормальное дело». В этом оно ведёт себя как русское «норм»." }
  - { kind: usage, text: "Два оттенка: как оценка — «круто, классно», как реакция — «спокойно, не парься, ничего страшного»." }
  - { kind: usage, text: "Рядом того же регистра стоит carded fajnie «классно»; spoko чуть более небрежное." }
collocations:
