# review
id: obrada
format: 2
lemma: "obrada"
rank: 6071
pos: noun
pron: { cyr: "обра́да" }
senses:
  - id: session
    ru: "мн. OBRADY: заседание, совещание (парламента, съезда, совета)"
    examples:
      - pl: "Jaki wynik przyniosły nasze obrady?"
        ru: "Каков итог нашего заседания?"
        source: { kind: translated, id: 881976 }
      - pl: "Obrady Sejmu potrwają do piątku."
        ru: "Заседание Сейма продлится до пятницы."
        source: { kind: authored }
      - pl: "W obradach wzięło udział stu delegatów."
        ru: "В заседании приняли участие сто делегатов."
        source: { kind: authored }
  - id: deliberation
    ru: "ед., книжн., устар. совет, совещание (одно)"
    examples:
      - pl: "Po długiej obradzie rada wydała wyrok."
        ru: "После долгого совещания совет вынес приговор."
        source: { kind: authored }
      - pl: "Starszyzna zebrała się na obradę."
        ru: "Старейшины собрались на совет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "К «обрадовать» отношения не имеет. OBRADA — от RADA, «совет», с приставкой OB-: «совещание», то, где держат совет. Ту же RADA русский знает по украинской «Верховной Раде» и по старому «рада», «совет»." }
  - { kind: usage, text: "Почти всегда во множественном: OBRADY, где русский ставит единственное — «заседание»: obrady Sejmu, «заседание Сейма». Глагол тоже во множественном: obrady trwają, rozpoczęły się, «заседание идёт, началось». Обычные связки: otworzyć, zamknąć, przerwać obrady — «открыть, закрыть, прервать заседание»; przewodniczyć obradom — дательный, «председательствовать на заседании»; w trakcie obrad — «во время заседания»; wnieść pod obrady — «вынести на обсуждение». Единственное OBRADA встречается в книжной и исторической прозе; в живой речи одно совещание — NARADA." }
  - { kind: pronunciation, text: "«обра́да», ударение на предпоследнем слоге. В дательном и предложном единственного D смягчается в DZ: OBRADZIE — «обра́дзье». Родительный множественного — OBRAD, с оглушением: «о́брат»." }
  - { kind: register, text: "Официальное слово протоколов, новостей и учебников истории: obrady parlamentu, obrady Okrągłego Stołu. О встрече коллег в офисе говорят ZEBRANIE или SPOTKANIE, а OBRADY звучат торжественно или иронично." }
collocations:
  - { pl: "otworzyć obrady", ru: "открыть заседание" }
  - { pl: "przewodniczyć obradom", ru: "председательствовать на заседании" }
  - { pl: "w trakcie obrad", ru: "во время заседания" }
  - { pl: "wnieść pod obrady", ru: "вынести на обсуждение" }
family:
  - { pl: "rada", ru: "совет", relation: root, id: rada }
  - { pl: "radzić", ru: "советовать", relation: root, id: radzic }
  - { pl: "obradować", ru: "заседать, совещаться", relation: derived }
  - { pl: "narada", ru: "совещание", relation: root }
etymology: "От OBRADOWAĆ, «совещаться», а тот — от RADA, «совет», с приставкой OB- «вокруг»: обсуждать дело со всех сторон. Праславянский корень *rad- тот же, что в русском «радеть» и в древнем «рада», «совет»; от него и украинская «Рада». Множественное OBRADY закрепилось, потому что заседание — это много обсуждений подряд."
memory: "Obrady — «заседание»: ob- + rada, совет держат вокруг стола. Не путать с «обрадовать». Говорят во множественном: obrady trwają. Знаменитые obrady Okrągłego Stołu — «Круглый стол» 1989 года."
idioms:
  - { pl: "obrady Okrągłego Stołu", ru: "переговоры «Круглого стола» (Польша, 1989)" }
  - { pl: "wnieść coś pod obrady", ru: "вынести что-то на обсуждение" }
formExamplesSkip:
  - { form: "obrado", reason: "звательный падеж отвлечённого существительного: к заседанию не обращаются" }
