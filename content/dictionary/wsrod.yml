# review
id: wsrod
format: 2
lemma: "wśród"
rank: 1338
pos: prep
pron: { cyr: "фсьрут" }
senses:
  - id: among
    ru: "среди, между (с родительным падежом)"
    examples:
      - pl: "Usiadłem wśród nich."
        ru: "Я сел среди них."
        source: { kind: translated, id: 711158 }
      - pl: "Wśród nas jest zdrajca."
        ru: "Среди нас предатель."
        source: { kind: translated, id: 760423 }
      - pl: "Chodziliśmy wśród drzew."
        ru: "Мы ходили среди деревьев."
        source: { kind: translated, id: 567076 }
  - id: among-people
    ru: "среди (о группе людей)"
    examples:
      - pl: "Jest popularny wśród studentów."
        ru: "Он популярен среди студентов."
        source: { kind: translated, id: 448860 }
      - pl: "Wieść szybko rozeszła się wśród uczniów."
        ru: "Новость быстро разошлась среди учеников."
        source: { kind: tatoeba, id: 3679976 }
      - pl: "Rozdzielił majątek wśród synów."
        ru: "Он разделил имущество между сыновьями."
        source: { kind: translated, id: 935869 }
notes:
  - { kind: government, text: "Предлог требует родительного падежа: wśród nas «среди нас», wśród drzew «среди деревьев», wśród studentów «среди студентов»." }
  - { kind: usage, text: "Wśród употребляют о множестве однородных предметов или людей. Для двух предметов берут między «между»." }
  - { kind: usage, text: "Popularny wśród kogoś — «популярен среди кого-то», стандартное сочетание." }
  - { kind: pronunciation, text: "Начальное w перед ś оглушается, ó звучит как «у», конечное d глухое: фсьрут." }
collocations:
  - { pl: "wśród nas", ru: "среди нас" }
  - { pl: "wśród drzew", ru: "среди деревьев" }
  - { pl: "popularny wśród", ru: "популярен среди" }
etymology: "Из w и śród «середина», того же корня, что środek «середина» и środa «среда». Русское «среди» — то же слово, от «середины»."
memory: "wśród — «среди», с родительным падежом: wśród nas, wśród drzew. Для двух предметов лучше między «между». Корень тот же, что в русских «середина» и «среда»."
