# review
id: ekspert
format: 2
lemma: "ekspert"
rank: 2273
pos: noun
pron: { cyr: "экспэ́рт" }
senses:
  - id: expert
    ru: "эксперт, специалист"
    examples:
      - pl: "Ekspert ocenił obraz na milion."
        ru: "Эксперт оценил картину в миллион."
        source: { kind: authored }
      - pl: "Zaprosili eksperta z uczelni."
        ru: "Они пригласили эксперта из университета."
        source: { kind: authored }
  - id: court-expert
    ru: "эксперт (судебный)"
    examples:
      - pl: "Sąd powołał biegłego eksperta."
        ru: "Суд назначил эксперта."
        source: { kind: authored }
      - pl: "Opinia ekspertów była jednoznaczna."
        ru: "Заключение экспертов было однозначным."
        source: { kind: authored }
  - id: pundit
    ru: "знаток, специалист (иронично)"
    examples:
      - pl: "Każdy jest ekspertem od piłki nożnej."
        ru: "Каждый эксперт по футболу."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "T СМЯГЧАЕТСЯ В CI В ДВУХ МЕСТАХ. Мужско-личное множественное даёт eksperci, а предложный и звательный — ekspercie. Так ведут себя все основы на t, обозначающие людей: student — studenci — o studencie, bandyta — bandyci. Читается ci как ць: «экспэ́рци», «экспэ́рце»." }
  - { kind: usage, text: "ОДУШЕВЛЁННОСТЬ МЕНЯЕТ ВИНИТЕЛЬНЫЙ ПАДЕЖ. У мужско-личных существительных винительный совпадает с родительным и в единственном, и во множественном: widzę eksperta, widzę ekspertów — никогда «widzę eksperty». Русский делает то же самое, так что привычка переносится без поправки." }
  - { kind: false-friend, text: "Ловушки нет: слово латинское и в оба языка пришло одинаково. Полезно знать соседа: судебный эксперт по-польски чаще biegły, а ekspert — специалист вообще. Женская форма ekspertka употребляется свободно, в отличие от многих других названий профессий." }
collocations:
  - { pl: "ekspert od czegoś", ru: "эксперт по чему-л." }
  - { pl: "opinia eksperta", ru: "заключение эксперта" }
  - { pl: "zespół ekspertów", ru: "группа экспертов" }
family:
  - { pl: "ekspertyza", ru: "экспертиза", relation: derived }
  - { pl: "specjalista", ru: "специалист", relation: root }
  - { pl: "biegły", ru: "судебный эксперт", relation: derived }
etymology: "Из латинского expertus «испытавший, опытный», причастия от experiri «испытывать» — того же корня, что experimentum и английское experience. В польский и в русский слово пришло через французский в одно и то же время. Отсюда ekspertyza, ekspercki и eksperymentować."
memory: "ekspert — «эксперт», слово насквозь международное. Запоминать надо не смысл, а два смягчения: мужско-личное множественное eksperci и предложный ekspercie, оба с t переходящим в ci — как student, studenci, o studencie."
idioms:
  - { pl: "ekspert od wszystkiego", ru: "специалист по всем вопросам" }
  - { pl: "zdaniem ekspertów", ru: "по мнению экспертов" }
