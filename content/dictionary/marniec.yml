notes:
  - { kind: usage, text: "Несовершенный непереходный глагол, совершенный — ZMARNIEĆ. Спряжение на -EJĘ, как ROZUMIEĆ: MARNIEJĘ, MARNIEJESZ, MARNIEJĄ; прошедшее с чередованием E → A: MARNIAŁ, MARNIAŁA, но во множественном мужско-личном MARNIELI." }
  - { kind: false-friend, text: "MARNIEĆ — «чахнуть, хиреть, пропадать зря», а не «марать» и не «марить». От MARNY «жалкий, никудышный». Не путать с MARNOWAĆ «тратить впустую»: MARNUJĘ CZAS — я трачу время зря, а MÓJ TALENT MARNIEJE — мой талант пропадает сам." }
  - { kind: government, text: "Без дополнения: KWIATY MARNIEJĄ. Где и от чего — W + предложный, Z + родительный: MARNIEĆ W WIĘZIENIU, MARNIEĆ Z TĘSKNOTY «чахнуть от тоски»." }
  - { kind: register, text: "Слово книжное и немного поэтическое. В быту о растениях чаще говорят USYCHAĆ, WIĘDNĄĆ, о людях — CHUDNĄĆ, SŁABNĄĆ." }
collocations:
