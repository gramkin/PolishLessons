etymology: "От прилагательного MARNY «жалкий, напрасный» с суффиксом -IEĆ «становиться каким-то», как SIWIEĆ «седеть» от SIWY. Родственное украинское «марний» значит «напрасный, тщетный»."
memory: "Marny — жалкий, marnieć — становиться жалким: kwiat bez wody marnieje w oczach."
