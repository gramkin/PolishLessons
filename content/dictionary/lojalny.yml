  - { pl: "lojalny wobec kogoś", ru: "верный кому-то" }
  - { pl: "lojalny klient", ru: "постоянный клиент" }
family:
  - { pl: "lojalność", ru: "верность, преданность", relation: derived, id: lojalnosc }
  - { pl: "wierny", ru: "верный", relation: root, id: wierny }
  - { pl: "nielojalny", ru: "неверный, нечестный", relation: derived }
etymology: "Через французское loyal из латинского legalis, «законный», от lex «закон». Изначально «лояльный» — тот, кто верен закону и присяге, отсюда «верный». В русском слово сместилось к «благонадёжный перед властью», а потом к «терпимый», а польский сохранил старый смысл верности."
memory: "Lojalny — верный, преданный: lojalny przyjaciel, lojalny wobec firmy. Не «снисходительный»! Wobec + родительный. Lojalniejszy, najlojalniejszy. Читается «лоя́льны»."
idioms:
  - { pl: "wierny jak pies", ru: "верный как пёс" }
