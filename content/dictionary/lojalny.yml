    examples:
      - pl: "To nie było lojalne zagranie."
        ru: "Это был нечестный ход."
        source: { kind: authored }
      - pl: "Lojalna konkurencja służy wszystkim."
        ru: "Честная конкуренция идёт всем на пользу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русское «лояльный» сегодня значит прежде всего «терпимый, нестрогий» или «благонадёжный к власти»: «лояльный преподаватель», «лояльная политика». Польское LOJALNY — «верный, преданный»: LOJALNY PRZYJACIEL, LOJALNY PRACOWNIK. Русского «лояльного», то есть снисходительного, учителя поляк назовёт POBŁAŻLIWY или ŁAGODNY. Это ловушка, в которую попадают постоянно." }
  - { kind: usage, text: "Полная парадигма с тремя степенями: LOJALNY, LOJALNIEJSZY, NAJLOJALNIEJSZY. Простые степени вполне употребительны, но наравне с ними живут BARDZIEJ LOJALNY и NAJBARDZIEJ LOJALNY. Форма для мужчин-людей во всех трёх степенях: LOJALNI, LOJALNIEJSI, NAJLOJALNIEJSI." }
  - { kind: government, text: "Верный кому-то — LOJALNY WOBEC KOGOŚ, WOBEC с родительным: LOJALNY WOBEC PRZYJACIÓŁ. Реже — LOJALNY W STOSUNKU DO KOGOŚ. Русское «лоялен к кому» с дательным здесь не работает. В сравнении: LOJALNIEJSZY NIŻ, LOJALNIEJSZY OD." }
  - { kind: pronunciation, text: "Читается «лоя́льны», три слога, ударение на предпоследнем. JA — «я», L перед N мягкая, «ль». В сравнительной степени LOJALNIEJSZY: «лояльне́йшы», ударение переходит на «не»." }
  - { kind: register, text: "Нейтральное слово, частое и в быту, и в деловой речи: LOJALNY KLIENT, PROGRAM LOJALNOŚCIOWY, «программа лояльности», — калька из маркетинга. В отношениях между людьми LOJALNY — высокая похвала: на такого можно положиться." }
collocations:
