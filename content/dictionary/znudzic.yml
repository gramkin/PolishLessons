# review
id: znudzic
format: 2
lemma: "znudzić"
rank: 4583
pos: verb
pron: { cyr: "зну́дзиць" }
senses:
  - id: bore
    ru: "наскучить, утомить скукой"
    examples:
      - pl: "Wykład znudził wszystkich."
        ru: "Лекция всех утомила."
        source: { kind: authored }
      - pl: "Książka mnie znudziła."
        ru: "Книга мне наскучила."
        source: { kind: authored }
      - pl: "Bał się znudzić słuchaczy."
        ru: "Он боялся наскучить слушателям."
        source: { kind: authored }
  - id: get-bored
    ru: "с SIĘ — заскучать; надоесть (безлично)"
    examples:
      - pl: "Znudziło mi się czekać."
        ru: "Мне надоело ждать."
        source: { kind: authored }
      - pl: "Dzieci znudziły się po kwadransie."
        ru: "Дети заскучали через четверть часа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZNUDZIĆ — «наскучить», а не «занудить». ZNUDZIŁO MI SIĘ — «мне надоело». Русское «нудить, ныть» — MARUDZIĆ. ZNUDZONY — «скучающий»: ZNUDZONA MINA «скучающее лицо»." }
  - { kind: usage, text: "Пятьдесят три формы, включая ZNUDZENI — «заскучавшие». Будущее: ZNUDZĘ, ZNUDZISZ, повелительное ZNUDŹ — обычно с отрицанием: NIE ZNUDŹ ICH. Несовершенный вид — NUDZIĆ." }
  - { kind: government, text: "Кого чем — винительный и творительный: ZNUDZIĆ SŁUCHACZY WYKŁADEM. С SIĘ — творительный: ZNUDZIĆ SIĘ GRĄ. Безлично — дательный: ZNUDZIŁA MU SIĘ PRACA «ему надоела работа»." }
  - { kind: pronunciation, text: "Читается «зну́дзиць»: DZI — «дзи», ударение на предпоследнем слоге NU. ZNUDZĘ — «зну́дзэ», ZNUDŹ — «знудзь»." }
  - { kind: register, text: "Нейтральное и разговорное. ZNUDZIĆ SIĘ NA ŚMIERĆ — разговорное «умереть со скуки». ZNUDZONY ŻYCIEM — ироничное «пресыщенный жизнью»." }
collocations:
  - { pl: "znudzić słuchaczy", ru: "наскучить слушателям" }
  - { pl: "znudziło mi się", ru: "мне надоело" }
  - { pl: "znudzona mina", ru: "скучающее лицо" }
family:
  - { pl: "nuda", ru: "скука", relation: root, id: nuda }
  - { pl: "nudny", ru: "скучный", relation: derived, id: nudny }
  - { pl: "nudzić", ru: "скучать; надоедать", relation: aspect }
etymology: "Приставка Z- плюс NUDZIĆ «наводить скуку», от NUDA, родственного русскому «нудный», «нужда»: праславянское *nuda — «принуждение, тягость»."
memory: "Znudzić — наскучить: wykład znudził wszystkich. Znudziło mi się — мне надоело. Znudzony — скучающий. Читается «зну́дзиць»."
idioms:
  - { pl: "znudzić się na śmierć", ru: "умереть со скуки" }
formExamplesSkip:
  - { form: "znudzono", reason: "безличная форма неестественна" }
