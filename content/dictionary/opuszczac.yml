# review
id: opuszczac
format: 2
lemma: "opuszczać"
rank: 1913
pos: verb
aspect: imperf
aspectPair: opuscic
pron: { cyr: "опу́шчаць" }
senses:
  - id: leave
    ru: "покидать, уезжать откуда-либо"
    examples:
      - pl: "Tom opuszcza miasto."
        ru: "Том покидает город."
        source: { kind: translated, id: 8547548 }
      - pl: "On jutro opuszcza Chicago."
        ru: "Завтра он покидает Чикаго."
        source: { kind: translated, id: 584649 }
      - pl: "Ten statek zaraz opuszcza port."
        ru: "Этот корабль сейчас покидает порт."
        source: { kind: translated, id: 969014 }
      - pl: "Opuszczamy ten kraj na dobre."
        ru: "Мы покидаем эту страну навсегда."
        source: { kind: translated, id: 352396 }
      - pl: "Jutro rano opuszczamy Japonię."
        ru: "Мы покидаем Японию завтра утром."
        source: { kind: tatoeba, id: 921754 }
      - pl: "Opuszczam miasto na kilka dni."
        ru: "Я уезжаю из города на несколько дней."
        source: { kind: translated, id: 1353440 }
  - id: abandon
    ru: "бросать, оставлять (кого-либо)"
    examples:
      - pl: "Nie opuszczaj mnie!"
        ru: "Не бросай меня!"
        source: { kind: translated, id: 5441250 }
      - pl: "Nie opuszczaj nas!"
        ru: "Не бросай нас!"
        source: { kind: translated, id: 8767871 }
      - pl: "Nie opuszczam cię."
        ru: "Я тебя не бросаю."
        source: { kind: translated, id: 2852907 }
  - id: skip
    ru: "пропускать (занятия, уроки)"
    examples:
      - pl: "Oni zawsze opuszczają zajęcia szkolne."
        ru: "Они всегда пропускают школьные занятия."
        source: { kind: translated, id: 560199 }
      - pl: "Nauczyciel zaczął często opuszczać zajęcia."
        ru: "Учитель начал часто пропускать занятия."
        source: { kind: translated, id: 7972355 }
      - pl: "Mojego nauczyciela fizyki nie obchodzi, czy opuszczam lekcje."
        ru: "Моему учителю физики всё равно, пропускаю ли я уроки."
        source: { kind: translated, id: 10581390 }
notes:
  - { kind: usage, text: "Несовершенный вид к opuścić: opuszczam «покидаю» — opuszczę «покину»." }
  - { kind: usage, text: "Третье значение — «пропускать»: opuszczać lekcje «пропускать уроки», opuszczanie zajęć «пропуски занятий»." }
  - { kind: usage, text: "Nie opuszczaj mnie «Не бросай меня» — самая частая форма этого глагола в корпусе, повелительное наклонение с отрицанием." }
  - { kind: usage, text: "Буквальное значение «опускать, спускать вниз» тоже есть: opuszczać głowę «опускать голову»." }
collocations:
  - { pl: "opuszczać kraj", ru: "покидать страну" }
  - { pl: "nie opuszczaj mnie", ru: "не бросай меня" }
  - { pl: "opuszczać lekcje", ru: "пропускать уроки" }
etymology: "o- + puszczać «пускать», того же корня, что русское «опускать» и «отпускать». Русское «опускать» сохранило буквальный смысл, а польское развило ещё и «покидать»."
memory: "opuszczać — несовершенный вид к opuścić. Три значения сразу: «покидать» (opuszcza miasto), «бросать» (nie opuszczaj mnie) и «пропускать» (opuszczać lekcje)."
idioms:
  - { pl: "nie opuszczaj mnie", ru: "не бросай меня" }
  - { pl: "opuszczać kraj", ru: "покидать страну" }
  - { pl: "opuszczać lekcje", ru: "пропускать уроки" }
