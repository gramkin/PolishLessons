etymology: "От WRZOS «вереск» с суффиксом -IEŃ, тем же, что в KWIECIEŃ, SIERPIEŃ и GRUDZIEŃ: месяц назван по тому, что в нём происходит в поле и в лесу. Вереск цветёт как раз в сентябре, и для пчеловода это последний взяток года. Такой способ называть месяцы по хозяйственному признаку — общеславянский и очень древний; латинские имена пришли в славянские языки позже и легли только на часть из них. Русский принял латинский ряд целиком, через греческий и церковный календарь, и оставил себе от старого только «листопад» в значении явления, а не месяца. Поэтому польские названия приходится учить заново, зато каждое из них объясняется одним словом и потому запоминается прочно."
memory: "Угадать нельзя: польские месяцы славянские, русские латинские. Wrzesień от wrzos «вереск» — месяц цветения вереска. Весь ряд такой же: kwiecień от kwiat, lipiec от lipa, sierpień от sierp, listopad буквально. Беглое e пропадает: wrzesień, но września, и ń смягчается в ni. Предлог удлиняется перед двумя согласными: we wrześniu, но w lipcu. Начало читается «вже», rz это «ж»."
