notes:
  - { kind: false-friend, text: "Опереться на русское «сентябрь» нельзя совершенно: польские названия месяцев свои, славянские, а русский взял латинские. WRZESIEŃ образован от WRZOS «вереск» — это месяц, когда вереск цветёт. Весь ряд построен так же: STYCZEŃ, LUTY, KWIECIEŃ от KWIAT «цветок», CZERWIEC, LIPIEC от LIPA, SIERPIEŃ от SIERP «серп», PAŹDZIERNIK, LISTOPAD, GRUDZIEŃ. Только MARZEC и MAJ пришли из латыни. Русский сохранил этот древний способ лишь в слове «листопад», которое стало обычным существительным, а украинский и белорусский держат славянские названия до сих пор." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. Беглое E исчезает уже в родительном: WRZESIEŃ, но WRZEŚNIA, WRZEŚNIOWI, WRZEŚNIEM, и вместе с ним конечное Ń переходит в мягкое NI. Местный единственного — WRZEŚNIU, и здесь важнейшая мелочь: предлог W перед ним принимает вид WE, потому что следом идут две согласные подряд. Говорят WE WRZEŚNIU, как WE LWOWIE и WE ŚRODĘ, но W LIPCU и W MAJU без добавки. Родительных множественного два: WRZEŚNI и более старое WRZEŚNIÓW, оба редкие, потому что месяцы редко считают во множественном." }
  - { kind: pronunciation, text: "Читается «вже́сень», два слога, ударение на первом. Буквосочетание RZ даёт «ж», поэтому начало звучит «вже», а не «вре». Сочетание SIE читается «се» с мягким S, а конечное Ń — мягкое «нь». В форме WRZEŚNIA буква Ś даёт «сь», и слово звучит «вже́сьня». В форме WRZEŚNIEM слышно «вже́сьнем». Главное — не прочесть RZ как «рз»: это один звук, и тот же, что в MORZE и RZEKA." }
  - { kind: register, text: "Слово нейтральное и обиходное. Даты пишутся родительным: PIERWSZEGO WRZEŚNIA «первого сентября», и этот день по-польски значит ровно то же, что по-русски, — начало учебного года. Прилагательное WRZEŚNIOWY «сентябрьский». В польской истории WRZESIEŃ без уточнений означает сентябрь тридцать девятого года и начало войны, поэтому оборот KAMPANIA WRZEŚNIOWA понимают однозначно. Названия месяцев пишутся со строчной буквы, в отличие от английского, но как и в русском." }
