# review
id: przejac
format: 2
lemma: "przejąć"
rank: 1358
pos: verb
aspect: perf
aspectPair: przejmowac
pron: { cyr: "пшэ́йонць" }
senses:
  - id: take-over
    ru: "принять, перенять (дело, обязанности, власть)"
    examples:
      - pl: "Przejął interes."
        ru: "Он принял дело."
        source: { kind: translated, id: 349207 }
      - pl: "Przejmę twoje obowiązki."
        ru: "Я возьму на себя твои обязанности."
        source: { kind: translated, id: 440583 }
      - pl: "Przejąć kontrolę."
        ru: "Взять контроль."
        source: { kind: translated, id: 5652095 }
  - id: intercept
    ru: "перехватить (сообщение, груз, управление)"
    examples:
      - pl: "Zostałem zawiadomiony, że znajomemu przejęto konto."
        ru: "Меня уведомили, что аккаунт знакомого перехватили."
        source: { kind: translated, id: 13561657 }
      - pl: "Przejąć dowództwo."
        ru: "Принять командование."
        source: { kind: translated, id: 5652097 }
  - id: be-moved
    ru: "przejąć się — взволноваться, принять близко к сердцу"
    examples:
      - pl: "Bardzo przejęła się chorobą męża."
        ru: "Она очень переживала из-за болезни мужа."
        source: { kind: translated, id: 914954 }
      - pl: "Zaczął nam opowiadać o przygodach w czasie pobytu w Ameryce. Słuchaliśmy z przejęciem."
        ru: "Он начал рассказывать нам о приключениях в Америке. Мы слушали с волнением."
        source: { kind: translated, id: 728629 }
notes:
  - { kind: false-friend, text: "Главная ловушка: przejąć «перенять, принять на себя» и przyjąć «принять (гостя, приглашение, подарок)» — разные глаголы. przejąć firmę «перенять фирму», но przyjąć zaproszenie «принять приглашение»." }
  - { kind: government, text: "przejąć co (винительный): przejąć firmę, kontrolę, obowiązki, władzę." }
  - { kind: usage, text: "Совершенный вид к przejmować. С się смысл меняется на «волноваться»: Nie przejmuj się! «Не переживай!» — очень частая фраза." }
  - { kind: usage, text: "Отглагольное существительное przejęcie значит и «поглощение (фирмы)», и «волнение»: słuchać z przejęciem «слушать с волнением»." }
collocations:
  - { pl: "przejąć kontrolę", ru: "взять контроль" }
  - { pl: "przejąć obowiązki", ru: "принять обязанности" }
  - { pl: "przejąć władzę", ru: "взять власть" }
etymology: "Приставка prze- «пере-» и jąć «взять» (праславянское *jęti). Русское «перенять» собрано из ровно тех же частей, и значение совпадает."
memory: "przejąć — «принять, перенять, перехватить»: przejąć firmę, przejąć kontrolę. Не путайте с przyjąć «принять гостя или приглашение» — одна буква, разные глаголы. А przejąć się czymś значит «принять близко к сердцу»: Nie przejmuj się! «Не переживай!»."
idioms:
  - { pl: "przejąć inicjatywę", ru: "взять инициативу" }
  - { pl: "przejąć władzę", ru: "взять власть" }
  - { pl: "nie przejmuj się", ru: "не переживай" }
