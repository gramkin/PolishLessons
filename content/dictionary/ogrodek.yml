  - { pl: "ogrodzenie", ru: "ограда, забор", relation: derived }
etymology: "Уменьшительное от OGRÓD, а то — от глагола OGRODZIĆ «обгородить», от корня GRÓD, который значил укреплённое, обнесённое место. От него же идут русские «город», «огород» и «ограда», и вся эта родня держится на одном образе: обнесённое место. Польский сохранил и само GRÓD в книжном значении города, и OGRÓD в значении сада. Так «город» и «сад» оказались одним словом, разошедшимся по двум языкам."
memory: "Садик, уменьшительное от ogrod «сад». Главное — не подставлять русский «огород»: польский ogrod это сад любого рода, а наше слово сузилось до грядок. Корень один, ogrodzic «обгородить», и от него же «город» и «ограда». Читается «огру́дэк», где o с черточкой даёт «у». Беглое e выпадает: ogrodka, но o с черточкой при этом остаётся."
idioms:
