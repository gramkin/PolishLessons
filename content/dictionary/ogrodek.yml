notes:
  - { kind: false-friend, text: "Ловушка здесь в большом слове. Польский OGRÓD это сад любого рода: с цветами, с деревьями, что угодно, и OGRÓD BOTANICZNY это «ботанический сад». А русский «огород», собранный из тех же частей, сузился до грядок с овощами, и общее дело у нас делает «сад». Корень же в обоих один: OGRODZIĆ, «обгородить». Сад это огороженное место, и в русском слове это слышно даже лучше, чем в польском." }
  - { kind: usage, text: "Десять форм, мужской род, уменьшительное от OGRÓD. В основе беглое E, которое выпадает в косвенных падежах: OGRÓDEK, но OGRÓDKA, OGRÓDKIEM. Обратите внимание на Ó: в самом OGRÓD оно чередуется с O, потому что слог перестаёт быть последним, и выходит OGRODU. А в уменьшительном OGRÓDEK чередования нет: Ó остаётся во всех формах, OGRÓDKA." }
  - { kind: government, text: "В садике — W OGRÓDKU, местный падеж. А «в садик», если входят, — DO OGRÓDKA, предлог DO с родительным, где русский скажет «в садик», с винительным. Перед домом — PRZED DOMEM, творительный. Садовый участок — OGRÓDEK DZIAŁKOWY, и прилагательное стоит после существительного, как во всех закреплённых названиях." }
  - { kind: pronunciation, text: "Читается «огру́дэк», три слога, ударение на предпоследнем. Буква Ó даёт «у», поэтому второй слог это «ру», а не «ро». Конечная E даёт «э». В косвенных падежах беглое E пропадает, и OGRÓDKA звучит «огру́дка», а Ó при этом никуда не исчезает." }
  - { kind: register, text: "Слово тёплое и домашнее. OGRÓDEK PRZED DOMEM — палисадник, который в Польше держат почти при каждом доме. OGRÓDEK DZIAŁKOWY это целое установление: садовые участки с домиками, часто у самых железнодорожных путей, и о них говорят с нежностью. А OGRÓDEK PIWNY это летняя терраса кафе, и открывают их с первым теплом." }
