# review
id: dostep
format: 2
lemma: "dostęp"
rank: 1308
pos: noun
pron: { cyr: "до́стэмп" }
senses:
  - id: access
    ru: "доступ к чему-то — dostęp do czegoś"
    examples:
      - pl: "Mam dostęp do tej biblioteki."
        ru: "У меня есть доступ к этой библиотеке."
        source: { kind: translated, id: 526950 }
      - pl: "Wszyscy studenci mają dostęp do biblioteki."
        ru: "У всех студентов есть доступ к библиотеке."
        source: { kind: translated, id: 1181684 }
      - pl: "Turcja zablokowała dostęp do Twittera."
        ru: "Турция заблокировала доступ к соцсети."
        source: { kind: translated, id: 3114560 }
  - id: no-access
    ru: "brak dostępu — отсутствие доступа"
    examples:
      - pl: "Nie mam dostępu do internetu."
        ru: "У меня нет доступа к интернету."
        source: { kind: translated, id: 6602827 }
      - pl: "Nie mamy dostępu do czystej wody."
        ru: "У нас нет доступа к чистой воде."
        source: { kind: translated, id: 12135520 }
      - pl: "Ten dom nie ma dostępu do prądu."
        ru: "В этом доме нет электричества."
        source: { kind: translated, id: 7825971 }
notes:
  - { kind: government, text: "dostęp do czegoś «доступ к чему-то» — предлог do с родительным падежом. Русскому «к» здесь отвечает польское do." }
  - { kind: usage, text: "При отрицании винительный меняется на родительный: mam dostęp, но nie mam dostępu." }
  - { kind: usage, text: "uzyskać dostęp «получить доступ», zablokować dostęp «заблокировать доступ»." }
  - { kind: usage, text: "Родственные слова — dostać się «добраться, попасть» и przystęp «подступ»." }
collocations:
  - { pl: "dostęp do internetu", ru: "доступ к интернету" }
  - { pl: "mieć dostęp", ru: "иметь доступ" }
  - { pl: "uzyskać dostęp", ru: "получить доступ" }
etymology: "Приставка do- и основа от stąpać «ступать»: буквально «подступ». Русский «доступ» собран ровно теми же частями, от «ступать»."
memory: "dostęp do czegoś — «доступ к чему-то», с предлогом do и родительным падежом. При отрицании винительный меняется на родительный: mam dostęp, но nie mam dostępu. Собрано как русское «до-ступ»."
idioms:
  - { pl: "dostęp do internetu", ru: "доступ к интернету" }
  - { pl: "mieć dostęp", ru: "иметь доступ" }
  - { pl: "brak dostępu", ru: "отсутствие доступа" }
