notes:
  - { kind: usage, text: "mieć koszmar — «видеть кошмар»: miałem koszmar «мне приснился кошмар». Польский говорит «иметь», русский «видеть»." }
  - { kind: government, text: "После być — творительный падеж: życie jest koszmarem «жизнь — кошмар»." }
  - { kind: usage, text: "koszmar senny — «ночной кошмар», с уточнением; без него слово одинаково значит и сон, и беду." }
  - { kind: false-friend, text: "Слово то же, что русское «кошмар», из французского cauchemar; значения совпадают полностью." }
collocations:
  - { pl: "mieć koszmar", ru: "видеть кошмар" }
  - { pl: "koszmar senny", ru: "ночной кошмар" }
  - { pl: "najgorszy koszmar", ru: "худший кошмар" }
family:
  - { pl: "koszmarny", ru: "кошмарный", relation: root }
  - { pl: "sen", ru: "сон", relation: root, id: sen }
  - { pl: "strach", ru: "страх", relation: root, id: strach }
etymology: "Из французского cauchemar через немецкий; русское «кошмар» пришло тем же путём и значит то же самое."
memory: "koszmar — «кошмар», и сон, и беда: mieć koszmar «видеть кошмар». Польский говорит «иметь кошмар» там, где русский «видеть»."
