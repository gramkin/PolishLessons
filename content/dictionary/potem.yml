# review
id: potem
format: 2
lemma: "potem"
rank: 220
pos: adv
pron: { cyr: "по́тэм" }
senses:
  - id: then
    ru: "потом, затем (следующее по порядку)"
    examples:
      - pl: "A co potem?"
        ru: "А что потом?"
        source: { kind: tatoeba, id: 6320381 }
      - pl: "A potem spalił wszystko."
        ru: "А потом он всё сжёг."
        source: { kind: tatoeba, id: 7180695 }
      - pl: "Pszczoła gryzie tylko raz, a potem umiera."
        ru: "Пчела жалит только один раз, а потом умирает."
        source: { kind: tatoeba, id: 6156496 }
  - id: afterwards
    ru: "потом, впоследствии"
    examples:
      - pl: "Głupota. Sama będziesz potem żałować."
        ru: "Ну и глупо. Сама же потом жалеть будешь."
        source: { kind: tatoeba, id: 13783097 }
      - pl: "Teraz zrobię małą przerwę, a potem będę dalej robić angielski."
        ru: "Сейчас я сделаю небольшую паузу, а потом продолжу заниматься английским."
        source: { kind: tatoeba, id: 13225522 }
      - pl: "A potem będą szukały winnych!"
        ru: "А потом будут искать виноватых!"
        source: { kind: tatoeba, id: 6320208 }
notes:
  - { kind: usage, text: "potem говорит о порядке событий: najpierw…, potem… «сначала…, потом…». А później — «позже» по времени. Русское «потом» покрывает оба." }
  - { kind: usage, text: "na potem значит «на потом»: Zostaw to na potem." }
collocations:
  - { pl: "najpierw… potem", ru: "сначала… потом" }
  - { pl: "a potem?", ru: "а потом?" }
  - { pl: "na potem", ru: "на потом" }
  - { pl: "zaraz potem", ru: "сразу потом" }
etymology: "Праславянское *potomь — то же слово, что русское «потом»."
memory: "potem — «потом» о порядке: najpierw…, potem… А później — «позже». По-русски оба будут «потом», по-польски их лучше различать."
idioms:
  - { pl: "najpierw pomyśl, potem mów", ru: "сначала подумай, потом говори" }
  - { pl: "zaraz potem", ru: "сразу после этого" }
  - { pl: "na potem", ru: "на потом" }
formExamples:
  - form: "potem"
    pl: "Najpierw obiad, potem spacer."
    ru: "Сначала обед, потом прогулка."
    source: { kind: authored }
  - form: "potem"
    pl: "Zrobię to potem."
    ru: "Я сделаю это потом."
    source: { kind: authored }
  - form: "potem"
    pl: "Co było potem?"
    ru: "Что было потом?"
    source: { kind: authored }
