# review
id: klamac
format: 2
lemma: "kłamać"
rank: 588
pos: verb
aspect: imperf
pron: { cyr: "куа́маць" }
senses:
  - id: lie
    ru: "лгать, врать"
    note: "Совершенный вид — skłamać."
    examples:
      - pl: "On kłamie."
        ru: "Он лжёт."
        source: { kind: tatoeba, id: 1244438 }
      - pl: "Wszyscy kłamią."
        ru: "Мы все врём."
        source: { kind: tatoeba, id: 1012418 }
      - pl: "Nigdy nie kłamię."
        ru: "Никакой я не врун!"
        source: { kind: tatoeba, id: 582891 }
  - id: lie-to
    ru: "kłamać komuś — лгать кому-л."
    note: "Человек в дательном, как и в русском: nie kłam mi."
    examples:
      - pl: "Nie kłam mi."
        ru: "Не лги мне."
        source: { kind: translated, id: 522769 }
      - pl: "Kłamiesz!"
        ru: "Врёте!"
        source: { kind: tatoeba, id: 6729510 }
      - pl: "Czasem kłamiemy, żeby nie zranić czyichś uczuć."
        ru: "Иногда мы лжём, чтобы не ранить чьи-то чувства."
        source: { kind: translated, id: 350021 }
  - id: lying
    ru: "kłamanie — ложь, враньё (как занятие)"
    note: "Отглагольное существительное; собственно «ложь» — kłamstwo."
    examples:
      - pl: "Kłamanie to bardzo zły zwyczaj."
        ru: "Врать — очень дурная привычка."
        source: { kind: translated, id: 905926 }
      - pl: "On ma tendencję do kłamania."
        ru: "У него склонность ко лжи."
        source: { kind: translated, id: 702919 }
      - pl: "Wyrzucono go tylko dlatego, że odmówił kłamania."
        ru: "Его уволили лишь за то, что он отказался лгать."
        source: { kind: translated, id: 841755 }
notes:
  - { kind: government, text: "kłamać komuś — «лгать кому-то», дательный падеж, ровно как в русском: nie kłam mi." }
  - { kind: usage, text: "Совершенный вид — skłamać: skłamałem «я солгал»." }
  - { kind: usage, text: "Существительные расходятся: kłamstwo — «ложь» как факт, kłamanie — «враньё» как занятие. Лжец — kłamca." }
  - { kind: usage, text: "Страдательное причастие морфология образует, но живой язык его не знает: глагол непереходный, отсюда пропуски в таблице форм." }
collocations:
  - { pl: "nie kłam mi", ru: "не лги мне" }
  - { pl: "kłamać w żywe oczy", ru: "лгать в глаза" }
  - { pl: "przestań kłamać", ru: "перестань врать" }
  - { pl: "wszyscy kłamią", ru: "все лгут" }
family:
  - { pl: "kłamstwo", ru: "ложь", relation: derived }
  - { pl: "kłamca", ru: "лжец", relation: derived }
  - { pl: "skłamać", ru: "солгать", relation: derived }
etymology: "От праславянского *klamati «обманывать». В русском этот корень не удержался — там «лгать» и «врать», — зато он жив в чешском и словацком klamat."
memory: "kłamać — «лгать», и управление то же, что в русском: kłamać KOMUŚ, дательный падеж — nie kłam mi «не лги мне». Совершенный вид — skłamać. Существительные расходятся: kłamstwo это «ложь» как факт, а kłamanie — «враньё» как занятие; лжец будет kłamca. Страдательного причастия у глагола нет: он непереходный, отсюда пропуски в таблице форм."
idioms:
  - { pl: "nie kłam mi", ru: "не лги мне" }
  - { pl: "kłamać w żywe oczy", ru: "лгать в глаза" }
  - { pl: "wszyscy kłamią", ru: "все лгут" }
