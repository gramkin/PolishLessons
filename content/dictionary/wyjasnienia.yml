notes:
  - { kind: usage, text: "Регистр держит это слово как множественное: wyjaśnienia «объяснения». Единственное wyjaśnienie «объяснение» существует, но отдельной карточки пока не имеет." }
  - { kind: government, text: "Средний род, множественное число: te wyjaśnienia, tych wyjaśnień. Родительный без окончания — wyjaśnień." }
  - { kind: false-friend, text: "От wyjaśnić «объяснить», которое уже есть в словаре; корень jasny «ясный». Буквально «прояснения» — русское «объяснение» построено от «ясного» точно так же." }
  - { kind: usage, text: "Быть должным объяснений — być winnym wyjaśnień, с родительным падежом." }
collocations:
  - { pl: "nie ma czasu na wyjaśnienia", ru: "нет времени на объяснения" }
  - { pl: "wymagać wyjaśnień", ru: "требовать объяснений" }
etymology: "От wyjaśnić «объяснить», корень jasny «ясный»; русское «объяснение» устроено так же."
memory: "wyjaśnienia — «объяснения», во множественном числе. Родительный — wyjaśnień, без окончания. Корень jasny «ясный», как в русском «объяснить»."
