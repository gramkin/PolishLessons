etymology: "От wyjaśnić «объяснить», корень jasny «ясный»; русское «объяснение» устроено так же."
memory: "wyjaśnienia — «объяснения», во множественном числе. Родительный — wyjaśnień, без окончания. Корень jasny «ясный», как в русском «объяснить»."
