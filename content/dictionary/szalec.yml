# review
id: szalec
format: 2
lemma: "szaleć"
rank: 2370
pos: verb
pron: { cyr: "ша́лець" }
senses:
  - id: rage
    ru: "бушевать, свирепствовать"
    examples:
      - pl: "Burza szalała całą noc."
        ru: "Буря бушевала всю ночь."
        source: { kind: authored }
      - pl: "Epidemia szalała w całym kraju."
        ru: "Эпидемия свирепствовала по всей стране."
        source: { kind: authored }
  - id: go-wild
    ru: "беситься, буйствовать"
    examples:
      - pl: "Dzieci szalały na podwórku do zmroku."
        ru: "Дети носились по двору до темноты."
        source: { kind: authored }
      - pl: "Kibice szaleli po ostatnim golu."
        ru: "Болельщики бесновались после последнего гола."
        source: { kind: authored }
  - id: be-crazy-about
    ru: "szaleć za kimś — сходить с ума по кому-л."
    examples:
      - pl: "Szalał za nią przez całe liceum."
        ru: "Он сходил по ней с ума все старшие классы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «ШАЛИТЬ», НО СИЛА СОВСЕМ ДРУГАЯ. Польское szaleć от szał «БЕЗУМИЕ, ЯРОСТЬ» и значит буйствовать, бесноваться, свирепствовать. Русское «шалить» ослабело до «баловаться», а прежнюю силу сохранило только в «ошалеть». Переводить szaleć словом «шалить» нельзя: burza szaleje это «буря бушует», а не «буря шалит»." }
  - { kind: usage, text: "СУЩЕСТВИТЕЛЬНОЕ SZALENIE СЛУЖИТ ЕЩЁ И УСИЛИТЕЛЕМ. Как отглагольное имя оно значит «безумство», но в разговоре szalenie работает наречием со смыслом «ужасно, страшно»: szalenie miły «ужасно милый», szalenie mi przykro «мне страшно жаль». Тот же приём уже был у okrutnie." }
  - { kind: government, text: "ПО КОМУ сходят с ума — za с творительным: szaleć za kimś, za czymś. ОТ чего буйствуют — z с родительным: szaleć z radości, z bólu, ze szczęścia. Глагол непереходный, поэтому страдательных причастий у него нет вовсе: в таблице их и не найти. Вид несовершенный, формы на -wszy тоже нет." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SZA-leć. Sz читается как ш: «ша́лець». Основа настоящего времени на -ej-: szaleję, szalejesz, szaleje. В прошедшем мужско-личное множественное берёт e: szaleli, а не «szalali»." }
collocations:
  - { pl: "szaleć za kimś", ru: "сходить с ума по кому-л." }
  - { pl: "burza szaleje", ru: "буря бушует" }
  - { pl: "szaleć z radości", ru: "беситься от радости" }
family:
  - { pl: "szał", ru: "безумие, ярость", relation: root }
  - { pl: "szalony", ru: "безумный, сумасшедший", relation: derived, id: szalony }
  - { pl: "oszaleć", ru: "сойти с ума", relation: derived, id: oszalec }
  - { pl: "spokój", ru: "покой", relation: antonym, id: spokoj }
etymology: "От szał «безумие, бешенство», из праславянского *šalъ — того же корня, что русские «шалый», «ошалеть», «шалить». Польский удержал исходную силу значения, русский её растерял: «шалить» стало детской шалостью. Отсюда szalony, oszaleć, szaleniec «безумец» и szaleństwo."
memory: "szaleć — «бушевать, беситься», от szał «безумие». Корень тот же, что в русском «шалить», но сила другая: по-польски буря szaleje, то есть бушует. А szalenie в разговоре значит «ужасно»: szalenie miły."
idioms:
  - { pl: "szaleć za kimś", ru: "сходить с ума по кому-л." }
  - { pl: "szalenie mi miło", ru: "мне ужасно приятно" }
