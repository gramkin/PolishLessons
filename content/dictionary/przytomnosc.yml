# review
id: przytomnosc
format: 2
lemma: "przytomność"
rank: 2178
pos: noun
pron: { cyr: "пшыто́мносьць" }
senses:
  - id: consciousness
    ru: "сознание"
    examples:
      - pl: "Stracił przytomność."
        ru: "Он потерял сознание."
        source: { kind: tatoeba, id: 13228187 }
      - pl: "Jeszcze nie odzyskał przytomności."
        ru: "Он ещё не пришёл в сознание."
        source: { kind: translated, id: 348927 }
      - pl: "Nagle odzyskał przytomność."
        ru: "Внезапно он пришёл в сознание."
        source: { kind: translated, id: 411608 }
  - id: presence-of-mind
    ru: "присутствие духа, соображение"
    examples:
      - pl: "Straciłem przytomność."
        ru: "Я потерял сознание."
        source: { kind: translated, id: 2944946 }
      - pl: "Jeszcze nigdy nie straciłem przytomności."
        ru: "Я ещё ни разу не терял сознания."
        source: { kind: translated, id: 11263068 }
notes:
  - { kind: government, text: "Два глагола-спутника с разными падежами: stracić przytomność «потерять сознание» — винительный, odzyskać przytomność «прийти в сознание» — тоже винительный, но nie stracić przytomności — родительный после отрицания." }
  - { kind: usage, text: "przytomność umysłu значит «присутствие духа, находчивость», а не медицинское сознание." }
  - { kind: false-friend, text: "Корень przytomny значит «находящийся при чём-то, присутствующий», отсюда и «в сознании». С русским «притомиться» связи нет." }
  - { kind: government, text: "Женский род на -ść: ta przytomność, tej przytomności." }
collocations:
  - { pl: "stracić przytomność", ru: "потерять сознание" }
  - { pl: "odzyskać przytomność", ru: "прийти в сознание" }
etymology: "От przytomny «присутствующий, находящийся при чём-л.», от tu «здесь» через старое tomny; с русским «притомиться» не связано."
memory: "przytomność — «сознание»: stracić przytomność «потерять сознание», odzyskać przytomność «прийти в себя». А przytomność umysłu — это «присутствие духа»."
idioms:
  - { pl: "stracić przytomność", ru: "потерять сознание" }
  - { pl: "przytomność umysłu", ru: "присутствие духа" }
