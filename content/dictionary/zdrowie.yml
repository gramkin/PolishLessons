# review
id: zdrowie
format: 2
lemma: "zdrowie"
rank: 993
pos: noun
pron: { cyr: "здро́ве" }
senses:
  - id: health
    ru: "здоровье"
    examples:
      - pl: "Palenie wpływa na zdrowie."
        ru: "Курение влияет на здоровье."
        source: { kind: tatoeba, id: 4731769 }
      - pl: "Palenie wpłynęło na jego zdrowie."
        ru: "Курение отразилось на его здоровье."
        source: { kind: tatoeba, id: 3743417 }
      - pl: "Bardzo dobrze, dziękuję. A jak twoje zdrowie?"
        ru: "Очень хорошо, спасибо. А как твоё здоровье?"
        source: { kind: tatoeba, id: 6018065 }
  - id: for-health
    ru: "dla zdrowia — для здоровья; szkodzi zdrowiu — вредит здоровью"
    note: "Первое требует родительного, второе — дательного."
    examples:
      - pl: "Uprawiam sport dla zdrowia."
        ru: "Я занимаюсь спортом для здоровья."
        source: { kind: tatoeba, id: 6694624 }
      - pl: "Bieganie jest dobre dla zdrowia."
        ru: "Бег полезен для здоровья."
        source: { kind: tatoeba, id: 859014 }
      - pl: "Palenie szkodzi zdrowiu."
        ru: "Курить вредно для здоровья."
        source: { kind: tatoeba, id: 598422 }
  - id: toast
    ru: "Na zdrowie! — На здоровье!, Будем здоровы!"
    note: "Тост, а также ответ на чихание."
    examples:
      - pl: "Na zdrowie!"
        ru: "Будем здоровы!"
        source: { kind: authored }
      - pl: "Kichnął, a ona powiedziała: na zdrowie."
        ru: "Он чихнул, а она сказала: будь здоров."
        source: { kind: authored }
      - pl: "Mam problemy ze zdrowiem."
        ru: "У меня проблемы со здоровьем."
        source: { kind: translated, id: 10563901 }
notes:
  - { kind: government, text: "Два разных падежа рядом: dla zdrowia «для здоровья» — родительный, но szkodzi zdrowiu «вредит здоровью» — дательный. Русский здесь совпадает." }
  - { kind: usage, text: "Na zdrowie! — и тост «Будем здоровы!», и то, что говорят чихнувшему, как русское «Будь здоров!». Одно выражение на два случая." }
  - { kind: usage, text: "służba zdrowia — «здравоохранение», ośrodek zdrowia — «поликлиника». А końskie zdrowie значит «богатырское здоровье»." }
  - { kind: usage, text: "Прилагательное — zdrowy «здоровый», и оно же значит «полезный»: zdrowe jedzenie «здоровая еда». Множественного числа у zdrowie нет." }
collocations:
  - { pl: "na zdrowie!", ru: "будем здоровы!" }
  - { pl: "dla zdrowia", ru: "для здоровья" }
  - { pl: "szkodzi zdrowiu", ru: "вредит здоровью" }
  - { pl: "służba zdrowia", ru: "здравоохранение" }
family:
