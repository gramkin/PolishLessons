  - { pl: "uzdrowić", ru: "исцелить", relation: derived }
  - { pl: "zdrowotny", ru: "оздоровительный", relation: derived }
etymology: "От zdrowy «здоровый», праславянское *sъdorvъ. Русское «здоровье» — то же слово, только польское dro на месте русского доро: zdrowie — здоровье, drogi — дорогой."
memory: "zdrowie — «здоровье», слово общеславянское. Запомните два падежа рядом: dla zdrowia «для здоровья», но szkodzi zdrowiu «вредит здоровью». И Na zdrowie! — это и тост, и то, что говорят чихнувшему."
