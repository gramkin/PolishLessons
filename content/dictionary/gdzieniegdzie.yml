# review
id: gdzieniegdzie
format: 2
lemma: "gdzieniegdzie"
rank: 6006
pos: adv
pron: { cyr: "гдзене́гдзе" }
senses:
  - id: here-and-there
    ru: "кое-где, местами"
    examples:
      - pl: "Gdzieniegdzie w stawie unosiły się opadłe liście."
        ru: "Кое-где в пруду плавали опавшие листья."
        source: { kind: translated, id: 1834205 }
      - pl: "Na polach gdzieniegdzie leżał jeszcze śnieg."
        ru: "На полях кое-где ещё лежал снег."
        source: { kind: authored }
      - pl: "Jutro gdzieniegdzie może padać deszcz."
        ru: "Завтра местами возможен дождь."
        source: { kind: authored }
      - pl: "Ściany były gdzieniegdzie popękane."
        ru: "Стены кое-где потрескались."
        source: { kind: authored }
      - pl: "W tekście gdzieniegdzie zdarzają się błędy."
        ru: "В тексте кое-где попадаются ошибки."
        source: { kind: authored }
      - pl: "Na niebie tylko gdzieniegdzie widać było gwiazdy."
        ru: "На небе лишь кое-где виднелись звёзды."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Значит «кое-где, в отдельных местах». Синонимы — MIEJSCAMI (так говорят в прогнозах погоды) и TU I ÓWDZIE «тут и там». Слово не изменяется." }
  - { kind: false-friend, text: "NIE в середине — не отрицание! Это не «нигде» (по-польски NIGDZIE), а «кое-где». Та же неопределённая приставка NIE- есть в NIEKTÓRY «некоторый» и NIECO «немного»." }
  - { kind: pronunciation, text: "Читается «гдзене́гдзе»: DZIE — мягкое «дзе», без «й». Ударение на предпоследнем слоге: gdzie-NIE-gdzie." }
collocations:
  - { pl: "gdzieniegdzie jeszcze", ru: "кое-где ещё" }
  - { pl: "tylko gdzieniegdzie", ru: "лишь кое-где" }
family:
  - { pl: "gdzie", ru: "где", relation: root, id: gdzie }
  - { pl: "gdzieś", ru: "где-то", relation: root, id: gdzies }
  - { pl: "nigdzie", ru: "нигде", relation: root }
synonyms: ["miejscami", "tu i ówdzie"]
etymology: "Сложено из GDZIE + NIE + GDZIE; NIE- здесь неопределённая частица, как в NIEKTÓRY «некоторый», а не отрицание."
memory: "Gdzieniegdzie — «где-не-где», то есть кое-где. Не путайте с nigdzie «нигде»."
idioms:
  - { pl: "tylko gdzieniegdzie", ru: "лишь кое-где, изредка" }
formExamples:
  - form: "gdzieniegdzie"
    pl: "Gdzieniegdzie w stawie unosiły się opadłe liście."
    ru: "Кое-где в пруду плавали опавшие листья."
    source: { kind: translated, id: 1834205 }
  - form: "gdzieniegdzie"
    pl: "Jutro gdzieniegdzie może padać deszcz."
    ru: "Завтра местами возможен дождь."
    source: { kind: authored }
  - form: "gdzieniegdzie"
    pl: "Ściany były gdzieniegdzie popękane."
    ru: "Стены кое-где потрескались."
    source: { kind: authored }
