# review
id: luz
format: 2
lemma: "luz"
rank: 4359
pos: noun
pron: { cyr: "люс" }
senses:
  - id: ease
    ru: "непринуждённость, расслабленность (разг.)"
    examples:
      - pl: "Po egzaminach poczułem luz."
        ru: "После экзаменов я почувствовал облегчение."
        source: { kind: authored }
      - pl: "Na tej imprezie panował pełny luz."
        ru: "На этой вечеринке царила полная непринуждённость."
        source: { kind: authored }
      - pl: "Rozmawiali na luzie, jak starzy znajomi."
        ru: "Они разговаривали непринуждённо, как старые знакомые."
        source: { kind: authored }
  - id: play
    ru: "зазор, люфт; слабина (тех.)"
    examples:
      - pl: "Kierownica ma za duży luz."
        ru: "У руля слишком большой люфт."
        source: { kind: authored }
      - pl: "Mechanik usunął luz w zawieszeniu."
        ru: "Механик устранил люфт в подвеске."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "LUZ — немецкое по происхождению слово без русского родственника. В технике это зазор или люфт: LUZ NA KIEROWNICY — люфт руля. В разговоре — свобода и непринуждённость: NA LUZIE — «расслабленно», WEŹ NA LUZ — «расслабься, не напрягайся». Прилагательное LUŹNY значит «свободный, просторный»: LUŹNA SUKIENKA, LUŹNA ROZMOWA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Творительный LUZEM живёт и как наречие: «на развес, без упаковки, врассыпную». SPRZEDAWAĆ CUKIER LUZEM — продавать сахар на развес. Местный — LUZIE: NA LUZIE." }
  - { kind: government, text: "Расслабленно — NA LUZIE, местный после NA. Расслабиться — WZIĄĆ NA LUZ, NA с винительным. Люфт чего-то — LUZ NA CZYMŚ: LUZ NA KIEROWNICY." }
  - { kind: pronunciation, text: "Читается «люс», один слог: конечное Z оглушается в «с». В местном падеже LUZIE сочетание ZI даёт мягкое «з»: «лю́зе»." }
  - { kind: register, text: "В значении «свобода, раскованность» слово разговорное и молодёжное, как и LUZAK — «человек, который ни о чём не парится». В технике это нейтральный термин. ROBIĆ COŚ NA LUZIE — делать без стресса, легко." }
collocations:
  - { pl: "na luzie", ru: "расслабленно, без напряга" }
  - { pl: "mieć luz", ru: "иметь свободу, запас" }
  - { pl: "luz w zawieszeniu", ru: "люфт в подвеске" }
family:
  - { pl: "luźny", ru: "свободный, просторный", relation: derived }
  - { pl: "luzować", ru: "ослаблять; сменять (на посту)", relation: derived }
  - { pl: "luzak", ru: "расслабленный человек", relation: derived }
etymology: "Из немецкого слова со значением «свободный, незакреплённый», через язык ремесленников и механиков. Русского родственника у LUZ нет, поэтому слово удобнее запоминать по обороту NA LUZIE."
memory: "Luz — свобода, расслабленность; в технике — люфт. Читается «люс». Na luzie — расслабленно, weź na luz — расслабься. Luzem — на развес, без упаковки. Luźny — свободный, просторный."
idioms:
  - { pl: "wziąć na luz", ru: "расслабиться, не напрягаться" }
  - { pl: "na luzie", ru: "расслабленно, непринуждённо" }
