synonyms: ["obejść się"]
etymology: "Из O- + BYĆ «быть». Исходно «пробыть, прожить какое-то время», отсюда «прожить без чего-то» — обойтись. Русское «обойтись» строится от «идти», польское — от «быть»; польский знает и путь через «идти»: OBEJŚĆ SIĘ."
memory: "OBYĆ SIĘ BEZ — «пробыть без»: obędę się bez kawy — «как-нибудь пробуду без кофе». А кто долго «пробыл» среди людей и стран, тот OBYTY — бывалый."
