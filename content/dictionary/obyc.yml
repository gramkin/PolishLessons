notes:
  - { kind: government, text: "Три конструкции, все с się. OBYĆ SIĘ BEZ + родительный — «обойтись без»: obyć się bez kawy, bez pomocy. Безлично, в среднем роде, о том, как прошло событие: obyło się bez ofiar «обошлось без жертв», nie obyło się bez kłótni «не обошлось без ссоры». OBYĆ SIĘ Z + творительный — «освоиться с чем-л.»: obyć się z bronią, z nowym miastem; это значение книжное." }
  - { kind: usage, text: "Совершенный вид, спрягается как BYĆ: będę → obędę się, bądź → obądź się, był → obył się. Несовершенный — OBYWAĆ SIĘ: obywam się bez telewizora «обхожусь без телевизора». Почти синоним — OBEJŚĆ SIĘ BEZ, буквально как русское «обойтись»: obejdę się bez kawy = obędę się bez kawy." }
  - { kind: usage, text: "Причастие OBYTY живёт как прилагательное: człowiek obyty «бывалый, светский человек», obyty w świecie «повидавший свет», obyty z czymś «привычный к чему-то». Противоположность — NIEOBYTY, «неотёсанный; непривычный». Отглагольное существительное OBYCIE — «умение держаться, светскость; привычка к чему-то»: brak obycia, obycie towarzyskie, obycie z językiem." }
  - { kind: pronunciation, text: "«о́быць», ударение на первом слоге: в двусложном слове предпоследний слог — первый. В будущем времени носовое перед d звучит как «эн»: obędę — «обэ́ндэ», obędziesz — «обэ́ньдзеш» (перед dzi — «энь»)." }
