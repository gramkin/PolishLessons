notes:
  - { kind: false-friend, text: "В русском есть слово «седно», но это ложный друг и к польскому отношения не имеет: у нас так называют потёртость на спине лошади от седла, слово областное и редкое. Польское SEDNO значит «суть, сущность», и переводить его надо словом «суть». Обратите внимание и на то, что в отличие от русской «сути» слово SEDNO среднего рода, а не женского." }
  - { kind: usage, text: "Девять форм в таблице, но живых пять, и все они единственного числа. Множественное число — SEDN, SEDNACH, SEDNAMI, SEDNOM — существует формально, по образцу всех средних на -O, но его не говорят, поэтому примеров к этим формам в карточке нет. А вот форма SEDNA, которая по виду похожа на множественное, это родительный единственного, и она как раз самая частая из всех: DO SEDNA SPRAWY." }
  - { kind: government, text: "Самое важное здесь — два разных падежа при одном и том же предлоге W. Попасть в точку — TRAFIĆ W SEDNO, винительный, потому что есть движение внутрь. А «по сути» — W SEDNIE, местный падеж, потому что движения нет. Дойти до сути — DOTRZEĆ DO SEDNA, предлог DO с родительным. Быть сутью — BYĆ SEDNEM, творительный без предлога, как и в русском «быть сутью дела»." }
  - { kind: pronunciation, text: "Читается «сэ́дно», два слога, ударение на первом. Буква S перед E остаётся твёрдой, и E даёт «э», поэтому первый слог это «сэ», а не «се». Сочетание DN произносится полностью, без выпадения: «сэ́д-но». В форме SEDNIE буква N смягчается перед I и слово звучит «сэ́дне», а в SEDNEM — «сэ́днэм», с твёрдым «нэ»." }
  - { kind: register, text: "Слово нейтральное, но чаще встречается в письменной и обдуманной речи: в статьях, в спорах, на совещаниях. Оборот TRAFIĆ W SEDNO «попасть в точку» зато вполне разговорный, его можно услышать в любой беседе. А SEDNO SPRAWY настолько привычно, что звучит почти как одно слово, и именно в таком виде его стоит запомнить." }
collocations:
  - { pl: "sedno sprawy", ru: "суть дела" }
