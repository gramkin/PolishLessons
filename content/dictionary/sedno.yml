family:
  - { pl: "siedziec", ru: "сидеть", relation: root, id: siedziec }
  - { pl: "osad", ru: "осадок, отстой", relation: root }
  - { pl: "siodlo", ru: "седло", relation: root }
etymology: "По наиболее принятому объяснению слово восходит к праславянскому корню со значением «сидеть, садиться», тому же, что дал SIEDZIEĆ, SIODŁO и OSAD. Образ таков: суть это то, что осело на дно, самое плотное и главное, когда всё лишнее сверху ушло. Полной уверенности у этимологов нет, встречается и другое объяснение, связывающее слово с «дном». Для запоминания важнее сам образ осадка: то, что осталось на дне дела."
memory: "Значит «суть», и запоминать лучше через образ: то, что осело на дно, когда всё лишнее сверху ушло. Отсюда и родство с siedziec, siodlo, osad. Читается «сэ́дно», с твёрдым «сэ». Два оборота стоит заучить целиком: sedno sprawy «суть дела» и trafic w sedno «попасть в точку». И не путайте с русским областным «седно», потёртостью от седла, это совсем другое слово."
idioms:
  - { pl: "trafić w sedno", ru: "попасть в точку" }
