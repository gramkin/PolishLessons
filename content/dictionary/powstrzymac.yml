# review
id: powstrzymac
format: 2
lemma: "powstrzymać"
rank: 654
pos: verb
aspect: perf
pron: { cyr: "повстшы́маць" }
senses:
  - id: stop-someone
    ru: "остановить, удержать (кого-л. — винительный)"
    note: "Nikt mnie nie powstrzyma «Никто меня не остановит»."
    examples:
      - pl: "Nikt mnie nie powstrzyma."
        ru: "Никто не остановит меня."
        source: { kind: tatoeba, id: 3776770 }
      - pl: "Nikt nas nie powstrzyma."
        ru: "Никто нас не остановит."
        source: { kind: translated, id: 957176 }
      - pl: "Nic jej nie powstrzyma."
        ru: "Ничто её не остановит."
        source: { kind: translated, id: 2410140 }
  - id: hold-back-from
    ru: "powstrzymać kogoś PRZED czymś — удержать от чего-л."
    note: "Предлог przed с творительным."
    examples:
      - pl: "Powstrzymaj go przed pójściem tam."
        ru: "Удержи его от того, чтобы он туда пошёл."
        source: { kind: translated, id: 3127259 }
      - pl: "Pilna sprawa powstrzymała go przed przyjściem."
        ru: "Срочное дело помешало ему прийти."
        source: { kind: translated, id: 10874299 }
      - pl: "Nie miałem pojęcia, co powstrzymało mnie przed przeprowadzką."
        ru: "Я понятия не имел, что удержало меня от переезда."
        source: { kind: translated, id: 813413 }
  - id: refrain
    ru: "powstrzymać się OD czegoś — воздержаться от чего-л."
    note: "А здесь уже od с родительным."
    examples:
      - pl: "Tom powstrzymał się od krzyku."
        ru: "Том удержался от крика."
        source: { kind: translated, id: 6391719 }
      - pl: "Powstrzymaj się od palenia tutaj, proszę cię"
        ru: "Воздержись, пожалуйста, от курения здесь."
        source: { kind: translated, id: 3001972 }
      - pl: "Prosimy o powstrzymanie się od palenia tytoniu, póki świeci się ten znak."
        ru: "Просим воздержаться от курения, пока горит этот знак."
        source: { kind: translated, id: 1622983 }
  - id: suppress
    ru: "сдержать (слёзы, смех)"
    examples:
      - pl: "Tom nie mógł powstrzymać się od płaczu."
        ru: "Том не мог сдержать слез."
        source: { kind: tatoeba, id: 3032338 }
      - pl: "W czasie imprezy był tak zabawny, że nie mogłem powstrzymać śmiechu."
        ru: "На вечеринке он был так комичен, что я не мог удержаться от смеха."
        source: { kind: tatoeba, id: 364747 }
      - pl: "Z trudem powstrzymała łzy."
        ru: "Она с трудом сдержала слёзы."
        source: { kind: translated, id: 3979082 }
notes:
  - { kind: government, text: "Главное в карточке — два предлога там, где русский обходится одним «от». Удержать кого-то ОТ чего-то — powstrzymać kogoś PRZED czymś, с przed и творительным: powstrzymaj go przed pójściem tam. А воздержаться самому — powstrzymać się OD czegoś, с od и родительным: powstrzymał się od krzyku." }
  - { kind: usage, text: "Без się и без предлога остаётся простое «остановить»: Nikt mnie nie powstrzyma." }
  - { kind: usage, text: "О чувствах значит «сдержать»: powstrzymać łzy «сдержать слёзы», nie mógł powstrzymać śmiechu «не мог сдержать смех»." }
  - { kind: usage, text: "Несовершенный вид — powstrzymywać: powstrzymywał się długo." }
  - { kind: usage, text: "Отглагольное существительное — powstrzymanie: prosimy o powstrzymanie się od palenia «просим воздержаться от курения»." }
collocations:
  - { pl: "powstrzymać się od czegoś", ru: "воздержаться от чего-либо" }
  - { pl: "powstrzymać kogoś przed czymś", ru: "удержать кого-либо от чего-либо" }
  - { pl: "powstrzymać łzy", ru: "сдержать слёзы" }
  - { pl: "Nikt mnie nie powstrzyma", ru: "Никто меня не остановит" }
family:
  - { pl: "powstrzymywać", ru: "удерживать", relation: aspect }
  - { pl: "trzymać", ru: "держать", relation: root }
  - { pl: "wstrzymać", ru: "приостановить", relation: derived }
etymology: "Приставки po- и w- плюс trzymać «держать» — то же гнездо, что русское «держать». «Удержать» собрано тем же способом."
memory: "powstrzymać — «остановить, удержать», и вся трудность в предлогах. Удержать кого-то ОТ чего-то — powstrzymać kogoś PRZED czymś, с творительным: powstrzymaj go przed pójściem tam. А воздержаться самому — powstrzymać się OD czegoś, с родительным: powstrzymał się od krzyku. Одно русское «от» разошлось на два польских предлога, и это стоит заучить парой. Без предлога остаётся простое «остановить»: Nikt mnie nie powstrzyma."
idioms:
  - { pl: "powstrzymać się od czegoś", ru: "воздержаться от чего-либо" }
  - { pl: "powstrzymać kogoś przed czymś", ru: "удержать кого-либо от чего-либо" }
  - { pl: "powstrzymać łzy", ru: "сдержать слёзы" }
