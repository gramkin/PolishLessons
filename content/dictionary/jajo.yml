notes:
  - { kind: usage, text: "В БЫТУ ГОВОРЯТ НЕ JAJO, А JAJKO. Уменьшительное вытеснило исходное слово почти полностью: jajko na twardo «яйцо вкрутую», jajka sadzone «яичница-глазунья», kupić jajka. Само jajo звучит книжно или научно: jajo ptasie, komórka jajowa. Русское «яйцо» покрывает оба случая, поэтому выбор приходится делать заново." }
  - { kind: register, text: "Множественное jaja в разговоре часто значит анатомическое и звучит грубо, а оборот robić sobie jaja «валять дурака, прикалываться» откровенно вульгарен. В приличном разговоре о еде безопаснее jajka. Это одна из причин, по которым уменьшительное стало основным словом." }
  - { kind: false-friend, text: "Слово родственно русскому «яйцу» напрямую: праславянское *aje, то же, что в русском. Ловушки в значении нет — только в регистре и в том, что повседневная форма другая. Прилагательное jajowaty значит «яйцевидный», jajeczny «яичный»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: JA-jo. Польское j читается как русское й: «я́йо». Родительный множественного — односложное jaj, без окончания: pięć jaj." }
collocations:
  - { pl: "jajo ptasie", ru: "птичье яйцо" }
  - { pl: "znieść jajo", ru: "снести яйцо" }
  - { pl: "komórka jajowa", ru: "яйцеклетка" }
family:
  - { pl: "jajko", ru: "яйцо (бытовое)", relation: derived, id: jajko }
  - { pl: "jajecznica", ru: "яичница", relation: derived }
  - { pl: "jajowaty", ru: "яйцевидный", relation: derived }
etymology: "Праславянское *aje, то же слово, что русское «яйцо», родственное латинскому ovum и немецкому Ei. Русская форма с суффиксом -цо, польская без него. Уменьшительное jajko образовано суффиксом -ko и со временем вытеснило исходное слово из повседневной речи."
memory: "jajo — «яйцо», но в быту поляки говорят JAJKO: jajko na twardo, kupić jajka. Само jajo книжное и научное, а во множественном бывает грубым. Родительный множественного короткий: pięć jaj."
idioms:
