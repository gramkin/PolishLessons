# review
id: nazwisko
format: 2
lemma: "nazwisko"
rank: 476
pos: noun
pron: { cyr: "назви́ско" }
senses:
  - id: surname
    ru: "фамилия"
    examples:
      - pl: "Czy to pana prawdziwe nazwisko?"
        ru: "Это ваша настоящая фамилия?"
        source: { kind: tatoeba, id: 11318578 }
      - pl: "To nie nazwisko, to pseudonim."
        ru: "Это не фамилия, это псевдоним."
        source: { kind: tatoeba, id: 13084412 }
      - pl: "Tom nie powiedział Mary swojego nazwiska."
        ru: "Том не сказал Мэри свою фамилию."
        source: { kind: tatoeba, id: 13547098 }
  - id: by-name
    ru: "фамилия (в устойчивых оборотах)"
    examples:
      - pl: "Znam go z nazwiska."
        ru: "Я знаю его по фамилии."
        source: { kind: translated, id: 4828126 }
      - pl: "Podróżował pod przybranym nazwiskiem."
        ru: "Он путешествовал под вымышленной фамилией."
        source: { kind: translated, id: 6534462 }
      - pl: "Mam słabą pamięć do nazwisk."
        ru: "Я постоянно забываю имена людей."
        source: { kind: tatoeba, id: 988642 }
notes:
  - { kind: false-friend, text: "nazwisko — это «фамилия», а не «название». Русскому «названию» отвечает nazwa, а имени — imię. Отчества у поляков нет вовсе." }
  - { kind: usage, text: "imię i nazwisko — стандартная пара в любой анкете: «имя и фамилия»." }
  - { kind: usage, text: "znać kogoś z nazwiska — «знать кого-то по фамилии»; pod przybranym nazwiskiem — «под вымышленной фамилией»." }
  - { kind: usage, text: "Средний род: to nazwisko, tego nazwiska, o tym nazwisku." }
collocations:
  - { pl: "imię i nazwisko", ru: "имя и фамилия" }
  - { pl: "znać z nazwiska", ru: "знать по фамилии" }
  - { pl: "panieńskie nazwisko", ru: "девичья фамилия" }
etymology: "От nazwać «назвать», из na + zwać. Русские «название» и «прозвище» того же корня, но польское слово закрепилось именно за фамилией."
memory: "nazwisko — «фамилия», а вовсе не «название»! Название вещи — nazwa, имя — imię, а отчества у поляков нет. В анкете всегда пишут imię i nazwisko."
idioms:
  - { pl: "imię i nazwisko", ru: "имя и фамилия" }
  - { pl: "znać z nazwiska", ru: "знать по фамилии" }
  - { pl: "pod przybranym nazwiskiem", ru: "под вымышленной фамилией" }
