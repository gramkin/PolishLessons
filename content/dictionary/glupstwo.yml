# review
id: glupstwo
format: 2
lemma: "głupstwo"
rank: 5696
pos: noun
pron: { cyr: "гу́упстфо" }
senses:
  - id: nonsense
    ru: "глупость, вздор"
    examples:
      - pl: "Nie opowiadaj głupstw."
        ru: "Не говори глупостей."
        source: { kind: translated, id: 410750 }
      - pl: "Po co nagadałaś takich głupstw?"
        ru: "Зачем ты наговорила таких глупостей?"
        source: { kind: translated, id: 739272 }
      - pl: "Głupstwo!"
        ru: "Глупости!"
        source: { kind: translated, id: 12450016 }
  - id: trifle
    ru: "пустяк, ерунда"
    examples:
      - pl: "Palnęłam głupstwo."
        ru: "Я сморозила глупость."
        source: { kind: translated, id: 12360110 }
      - pl: "To głupstwo, nie martw się."
        ru: "Это пустяк, не переживай."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения расходятся: «глупость» как сказанная нелепость и «пустяк» как нечто неважное. To głupstwo! значит «Ерунда!», а не «Как глупо!»." }
  - { kind: government, text: "Средний род: to głupstwo, tego głupstwa. Родительный мн. — głupstw, без окончания, с трудным стечением согласных." }
  - { kind: false-friend, text: "От głupi «глупый», которое уже есть в словаре. Суффикс -stwo тот же, что в русском -ство." }
  - { kind: usage, text: "Частые глаголы рядом: opowiadać głupstwa «говорить глупости», palnąć głupstwo «сморозить глупость»." }
collocations:
  - { pl: "opowiadać głupstwa", ru: "говорить глупости" }
  - { pl: "palnąć głupstwo", ru: "сморозить глупость" }
etymology: "От głupi «глупый» + суффикс -stwo, тот же, что в русском -ство."
memory: "głupstwo — и «глупость», и «пустяк». To głupstwo! значит «Ерунда, пустяки!». Родительный мн. — głupstw, сплошные согласные."
idioms:
  - { pl: "opowiadać głupstwa", ru: "говорить глупости" }
  - { pl: "palnąć głupstwo", ru: "сморозить глупость" }
