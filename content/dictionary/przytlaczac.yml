# review
id: przytlaczac
format: 2
lemma: "przytłaczać"
rank: 6007
pos: verb
aspect: imperf
pron: { cyr: "пшытуа́чаць" }
senses:
  - id: press
    ru: "придавливать, пригибать (тяжестью)"
    examples:
      - pl: "Ciężki plecak przytłacza małe dziecko."
        ru: "Тяжёлый рюкзак придавливает маленького ребёнка."
        source: { kind: authored }
      - pl: "Mokry śnieg przytłacza gałęzie do ziemi."
        ru: "Мокрый снег пригибает ветви к земле."
        source: { kind: authored }
  - id: overwhelm
    ru: "угнетать, подавлять, давить (на психику); заваливать (работой)"
    examples:
      - pl: "Ta cisza mnie przytłacza."
        ru: "Эта тишина меня угнетает."
        source: { kind: authored }
      - pl: "Przytłacza go nadmiar obowiązków."
        ru: "Его угнетает избыток обязанностей."
        source: { kind: authored }
      - pl: "Ogrom miasta przytłacza turystów."
        ru: "Громада города подавляет туристов."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — PRZYTŁOCZYĆ, отсюда PRZYTŁOCZONY «подавленный». Прямое значение «придавливать тяжестью» встречается редко; обычно говорят о том, что угнетает: тишина, долги, обязанности, огромные здания." }
  - { kind: government, text: "Кого — винительный, чем — творительный: PRZYTŁACZAĆ KOGOŚ OBOWIĄZKAMI «заваливать кого-то обязанностями». Предлогов нет, в отличие от русского «давить на кого-то»." }
  - { kind: usage, text: "Причастие PRZYTŁACZAJĄCY живёт как прилагательное: PRZYTŁACZAJĄCA WIĘKSZOŚĆ «подавляющее большинство», PRZYTŁACZAJĄCA CISZA «гнетущая тишина», PRZYTŁACZAJĄCE DOWODY «неопровержимые улики»." }
  - { kind: pronunciation, text: "Читается «пшытуа́чаць»: PRZ — «пш», Ł — «у», CZ — твёрдое «ч». Ударение на предпоследнем слоге: PRZYTŁACZAM — «пшытуа́чам»." }
collocations:
  - { pl: "przytłaczać obowiązkami", ru: "заваливать обязанностями" }
  - { pl: "przytłaczać ciężarem", ru: "придавливать тяжестью" }
  - { pl: "przytłaczająca cisza", ru: "гнетущая тишина" }
family:
  - { pl: "przytłoczyć", ru: "придавить, подавить", relation: aspect }
  - { pl: "przytłaczający", ru: "подавляющий, гнетущий", relation: derived }
  - { pl: "przytłoczenie", ru: "подавленность", relation: derived }
  - { pl: "tłoczyć", ru: "давить, прессовать; теснить", relation: root }
synonyms: ["przygniatać", "przygnębiać", "obciążać"]
etymology: "Приставка PRZY- и TŁACZAĆ, многократная форма от TŁOCZYĆ «давить, теснить»; того же корня TŁOK «давка, толпа»."
memory: "Przytłaczać — давить сверху, как толпа в давке (TŁOK): przytłaczająca większość — «подавляющее большинство»."
idioms:
  - { pl: "przytłaczająca większość", ru: "подавляющее большинство" }
