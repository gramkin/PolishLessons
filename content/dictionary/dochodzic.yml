formExamples:
  - form: "dochodzą"
    pl: "Obaj dochodzą do formy jeżdżąc na rowerach."
    ru: "Оба приходят в форму, катаясь на велосипедах."
    source: { kind: translated, id: 756938 }
  - form: "dochodzą"
    pl: "Głosy dochodzą z korytarza."
    ru: "Голоса доносятся из коридора."
    source: { kind: authored }
  - form: "dochodzą"
    pl: "Listy dochodzą po tygodniu."
    ru: "Письма доходят через неделю."
    source: { kind: authored }
  - form: "dochodzę"
    pl: "Gdy teraz o tym myślę, dochodzę do wniosku, że nie powinienem był tam z nią jechać."
    ru: "Думая об этом теперь, я прихожу к выводу, что мне не следовало туда с ней ехать."
    source: { kind: translated, id: 982379 }
  - form: "dochodzę"
    pl: "Dochodzę do tego samego wniosku."
    ru: "Я прихожу к тому же выводу."
    source: { kind: authored }
  - form: "dochodzę"
    pl: "Powoli dochodzę do siebie."
    ru: "Я понемногу прихожу в себя."
    source: { kind: authored }
  - form: "dochodzi"
    pl: "Dochodzi szósta."
    ru: "Скоро шесть."
    source: { kind: translated, id: 771722 }
  - form: "dochodzi"
    pl: "Dochodzi siódma."
    ru: "Скоро семь."
    source: { kind: translated, id: 3930146 }
  - form: "dochodzi"
    pl: "Dochodzi dziesiąta."
    ru: "Скоро десять."
    source: { kind: translated, id: 365673 }
  - form: "dochodzić"
    pl: "Lubię tak dochodzić."
    ru: "Мне нравится так доходить до сути."
    source: { kind: translated, id: 12191478 }
  - form: "dochodzić"
    pl: "Wygląda na to, że Tom zaczyna do czegoś dochodzić."
    ru: "Похоже, Том начинает до чего-то доходить."
    source: { kind: translated, id: 13655483 }
  - form: "dochodzić"
    pl: "Zaczyna dochodzić do siebie."
    ru: "Он начинает приходить в себя."
    source: { kind: authored }
  - form: "dochodził"
    pl: "Mój głos nie dochodził do słuchaczy, zagłuszony hałasem."
    ru: "Мой голос не доходил до слушателей, заглушённый шумом."
    source: { kind: translated, id: 931158 }
  - form: "dochodził"
    pl: "Hałas dochodził z podwórza."
    ru: "Шум доносился со двора."
    source: { kind: authored }
  - form: "dochodził"
    pl: "Nikt nie dochodził swoich praw."
    ru: "Никто не добивался своих прав."
    source: { kind: authored }
  - form: "dochodziła"
    pl: "W czasie wielkiego trzęsienia ziemi w Tohoku wysokość fal tsunami dochodziła do 37,9 metra."
    ru: "Во время великого землетрясения в Тохоку высота волн цунами доходила до 37,9 метра."
    source: { kind: translated, id: 823283 }
  - form: "dochodziła"
    pl: "Woda dochodziła nam do kolan."
    ru: "Вода доходила нам до колен."
    source: { kind: authored }
  - form: "dochodziła"
    pl: "Muzyka dochodziła zza ściany."
    ru: "Музыка доносилась из-за стены."
    source: { kind: authored }
  - form: "dochodzisz"
    pl: "Charakter zmienia się, gdy dochodzisz do władzy."
    ru: "Характер меняется, когда приходишь к власти."
    source: { kind: translated, id: 11527699 }
  - form: "dochodzisz"
    pl: "Jak dochodzisz do takich wniosków?"
    ru: "Как ты приходишь к таким выводам?"
    source: { kind: authored }
  - form: "dochodzisz"
    pl: "Dochodzisz do siebie po chorobie?"
    ru: "Ты приходишь в себя после болезни?"
    source: { kind: authored }
