# review
id: dochodzic
format: 2
lemma: "dochodzić"
rank: 1818
pos: verb
aspect: imperf
pron: { cyr: "дохо́дзиць" }
senses:
  - id: almost-time
    ru: "о времени: скоро, почти (dochodzi szósta «шестой час»)"
    examples:
      - pl: "Dochodzi szósta."
        ru: "Скоро шесть."
        source: { kind: translated, id: 771722 }
      - pl: "Dochodzi dziesiąta."
        ru: "Скоро десять."
        source: { kind: translated, id: 365673 }
      - pl: "W Bostonie dochodzi północ."
        ru: "В Бостоне скоро полночь."
        source: { kind: translated, id: 3828840 }
  - id: reach
    ru: "доходить, доноситься; приходить к выводу"
    examples:
      - pl: "Stąd też głos dochodzi."
        ru: "Голос доносится и отсюда."
        source: { kind: translated, id: 944143 }
      - pl: "Gdy teraz o tym myślę, dochodzę do wniosku, że nie powinienem był tam z nią jechać."
        ru: "Думая об этом теперь, я прихожу к выводу, что мне не следовало туда с ней ехать."
        source: { kind: translated, id: 982379 }
      - pl: "Mój głos nie dochodził do słuchaczy, zagłuszony hałasem."
        ru: "Мой голос не доходил до слушателей, заглушённый шумом."
        source: { kind: translated, id: 931158 }
notes:
  - { kind: usage, text: "О времени — самое частое употребление: dochodzi szósta значит «скоро шесть», «шестой час». Буквально «доходит до шести»." }
  - { kind: government, text: "Доходить до чего-то — dochodzić do czegoś (родительный с do): dochodzić do wniosku «приходить к выводу», dochodzić do władzy «приходить к власти»." }
  - { kind: usage, text: "Совершенный вид — dojść. Существительное dochodzenie значит «расследование» и живёт уже своей жизнью." }
  - { kind: false-friend, text: "Русское «доходить» и польское dochodzić — одно слово, но польское вдобавок обслуживает время: по-русски так не скажешь." }
  - { kind: government, text: "Все значения этой карточки непереходные, поэтому страдательного причастия глагол здесь не образует. Формы dochodzony, dochodzona принадлежат юридическому обороту dochodzić roszczeń «предъявлять требования»: roszczenia dochodzone przed sądem." }
  - { kind: usage, text: "Отглагольное существительное dochodzenie зажило своей жизнью и значит «расследование»: prowadzić dochodzenie, umorzyć dochodzenie." }
collocations:
  - { pl: "dochodzi szósta", ru: "скоро шесть" }
  - { pl: "dochodzić do wniosku", ru: "приходить к выводу" }
  - { pl: "dochodzić do władzy", ru: "приходить к власти" }
family:
  - { pl: "dojść", ru: "дойти", relation: root, id: dojsc }
  - { pl: "chodzić", ru: "ходить", relation: root, id: chodzic }
  - { pl: "dochodzenie", ru: "расследование", relation: root }
etymology: "Приставка do- плюс chodzić «ходить» — то же слово, что русское «доходить». Значение о времени развилось уже в польском."
memory: "dochodzić — «доходить», но чаще всего о времени: dochodzi szósta «скоро шесть». К выводу — dochodzić do wniosku. Совершенный вид — dojść."
idioms:
  - { pl: "dochodzi szósta", ru: "скоро шесть" }
  - { pl: "dochodzić do wniosku", ru: "приходить к выводу" }
  - { pl: "dochodzić do siebie", ru: "приходить в себя" }
