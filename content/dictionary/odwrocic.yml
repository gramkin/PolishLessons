# review
id: odwrocic
format: 2
lemma: "odwrócić"
rank: 1207
pos: verb
aspect: perf
pron: { cyr: "одвру́циць" }
senses:
  - id: turn-around
    ru: "повернуться, обернуться, отвернуться (с się)"
    examples:
      - pl: "Odwrócił się i poszedł precz."
        ru: "Он повернулся и пошёл прочь."
        source: { kind: tatoeba, id: 6313162 }
      - pl: "Tom poczerwieniał i odwrócił się."
        ru: "Том покраснел и отвернулся."
        source: { kind: tatoeba, id: 6313950 }
      - pl: "Nagle zatrzymała się i odwróciła."
        ru: "Внезапно она остановилась и обернулась."
        source: { kind: tatoeba, id: 2146658 }
  - id: turn-over
    ru: "перевернуть, отвернуть, отвести"
    examples:
      - pl: "Proszę odwrócić stronę."
        ru: "Пожалуйста, переверните страницу."
        source: { kind: translated, id: 520062 }
      - pl: "Odwrócić wzrok."
        ru: "Отвести взгляд."
        source: { kind: translated, id: 5660018 }
      - pl: "Odwróciła głowę."
        ru: "Она повернула голову."
        source: { kind: translated, id: 12076193 }
  - id: reverse
    ru: "обратить, повернуть вспять"
    examples:
      - pl: "Już zadecydowano, nie ma jak odwrócić sytuacji."
        ru: "Уже решено, ситуацию не обратить."
        source: { kind: translated, id: 13845561 }
      - pl: "To jest wybieg dla odwrócenia uwagi."
        ru: "Это уловка для отвлечения внимания."
        source: { kind: translated, id: 8715215 }
notes:
  - { kind: usage, text: "С się — «повернуться, обернуться, отвернуться»: Odwrócił się i poszedł «Он повернулся и ушёл». Без się — «перевернуть, отвернуть что-то»." }
  - { kind: usage, text: "odwrócić uwagę значит «отвлечь внимание», буквально «отвернуть внимание»." }
  - { kind: usage, text: "Несовершенный вид — odwracać (się). Причастие odwrócony — «перевёрнутый, обратный»: odwrócona kolejność «обратный порядок»." }
  - { kind: government, text: "Без się требует винительного падежа: odwrócić stronę «перевернуть страницу», odwrócić wzrok «отвести взгляд»." }
collocations:
  - { pl: "odwrócić się", ru: "повернуться" }
  - { pl: "odwrócić uwagę", ru: "отвлечь внимание" }
  - { pl: "odwrócić wzrok", ru: "отвести взгляд" }
etymology: "Приставка od- + wrócić «вернуть» (корень *vort-, тот же, что в русских «ворот», «вертеть», «воротить»). Русское «отворотить, отвернуть» — то же слово и та же приставка."
memory: "odwrócić с się = «повернуться, отвернуться», без się = «перевернуть»: odwrócić stronę «перевернуть страницу». Корень тот же, что в русском «воротить». И запомните odwrócić uwagę «отвлечь внимание»."
idioms:
  - { pl: "odwrócić się", ru: "повернуться, отвернуться" }
  - { pl: "odwrócić uwagę", ru: "отвлечь внимание" }
  - { pl: "odwrócić wzrok", ru: "отвести взгляд" }
