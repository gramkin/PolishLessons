# review
id: zgola
format: 2
lemma: "zgoła"
rank: 5442
pos: part
pron: { cyr: "зго́уа" }
senses:
  - id: entirely
    ru: "совсем, вовсе, начисто"
    examples:
      - pl: "Nie mam przeciwko wam nic zgoła, mój przyjacielu."
        ru: "Я совершенно ничего не имею против вас, друг мой."
        source: { kind: authored }
      - pl: "To zgoła co innego."
        ru: "Это совсем другое дело."
        source: { kind: authored }
      - pl: "Nie znam go zgoła."
        ru: "Я его вовсе не знаю."
        source: { kind: authored }
  - id: downright
    ru: "прямо-таки, буквально"
    examples:
      - pl: "To pomysł zgoła szalony."
        ru: "Это прямо-таки безумная идея."
        source: { kind: authored }
      - pl: "Odpowiedź była zgoła niespodziewana."
        ru: "Ответ был совершенно неожиданным."
        source: { kind: authored }
      - pl: "Zgoła nie tego się spodziewałem."
        ru: "Совсем не этого я ожидал."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово книжное и слегка архаичное; в живой речи его место занимают zupełnie и wcale." }
  - { kind: usage, text: "Чаще всего стоит при отрицании: nic zgoła «совсем ничего», zgoła nie «вовсе не»." }
  - { kind: usage, text: "Второе употребление — усилительное «прямо-таки»: zgoła szalony «прямо-таки безумный»." }
  - { kind: usage, text: "В корпусе Tatoeba примеров нет, поэтому все примеры здесь составлены вручную и ждут проверки." }
collocations:
  - { pl: "nic zgoła", ru: "совсем ничего" }
  - { pl: "zgoła inny", ru: "совсем другой" }
  - { pl: "zgoła nie", ru: "вовсе не" }
etymology: "Наречие книжного происхождения, родственное goły «голый»: исходно «начисто, подчистую», как русское «начисто» от «чистый»."
memory: "zgoła — книжное «совсем, вовсе». Чаще всего идёт с отрицанием: nic zgoła «совсем ничего», zgoła nie «вовсе не». В обычной речи на его месте скажут zupełnie или wcale, так что zgoła сразу выдаёт литературный слог."
