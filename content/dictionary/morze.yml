# review
id: morze
format: 2
lemma: "morze"
rank: 1263
pos: noun
pron: { cyr: "мо́же" }
senses:
  - id: sea
    ru: "море"
    examples:
      - pl: "Morze jest wielkie."
        ru: "Море большое."
        source: { kind: translated, id: 528985 }
      - pl: "Morze jest spokojne."
        ru: "Море спокойное."
        source: { kind: translated, id: 6305585 }
      - pl: "Irlandię i Anglię dzieli morze."
        ru: "Ирландию и Англию разделяет море."
        source: { kind: tatoeba, id: 5909140 }
  - id: by-sea
    ru: "nad morzem — на море, у моря (отдых)"
    examples:
      - pl: "Moje rodzinne miasto leży nad morzem."
        ru: "Мой родной город находится у моря."
        source: { kind: tatoeba, id: 351354 }
      - pl: "Dwa miesiące temu była nad morzem."
        ru: "Два месяца назад она была на море."
        source: { kind: tatoeba, id: 11569943 }
      - pl: "Spędziliśmy nasze wakacje nad morzem."
        ru: "Мы провели отпуск на море."
        source: { kind: translated, id: 3044904 }
  - id: in-sea
    ru: "w morzu — в море (внутри воды)"
    examples:
      - pl: "Ryby żyją w morzu."
        ru: "Рыбы живут в море."
        source: { kind: tatoeba, id: 359222 }
      - pl: "Na morzu są wyspy."
        ru: "В море есть острова."
        source: { kind: tatoeba, id: 3663252 }
      - pl: "Prywatna dobroczynność to kropla w morzu."
        ru: "Частная благотворительность - это только капля в море."
        source: { kind: tatoeba, id: 352160 }
notes:
  - { kind: government, text: "Три предлога и три падежа: nad morzem «на море, у моря» (творительный), w morzu «в море, внутри воды» (предложный), do morza «к морю» (родительный)." }
  - { kind: usage, text: "Направление против местоположения: jechać nad morze «поехать на море» — винительный, но być nad morzem «быть на море» — творительный." }
  - { kind: usage, text: "Owoce morza — «морепродукты», буквально «плоды моря»." }
  - { kind: usage, text: "Второе значение — «огромное количество»: morze ludzi «море людей», kropla w morzu «капля в море»." }
collocations:
  - { pl: "nad morzem", ru: "на море" }
  - { pl: "w morzu", ru: "в море" }
  - { pl: "owoce morza", ru: "морепродукты" }
  - { pl: "Morze Bałtyckie", ru: "Балтийское море" }
etymology: "Праславянское *morje из праиндоевропейского *móri — то же слово, что русское «море», латинское mare и немецкое Meer."
memory: "morze — «море». Главное здесь предлоги: nad morzem «на море» (отдых), w morzu «в море» (внутри), jechać nad morze «поехать на море». И owoce morza значит «морепродукты»."
idioms:
  - { pl: "owoce morza", ru: "морепродукты" }
  - { pl: "kropla w morzu", ru: "капля в море" }
  - { pl: "nad morzem", ru: "на море" }
