notes:
  - { kind: false-friend, text: "FRYZJER — «парикмахер», от FRYZURA «причёска». Русскому уху слово ничего не подсказывает, зато в польском оно повседневное. В парикмахерскую идут к мастеру: IŚĆ DO FRYZJERA, буквально «к парикмахеру», — польский называет место по человеку. Женщина — FRYZJERKA." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. В местном падеже R переходит в RZ: O FRYZJERZE, и во множественном тоже: FRYZJERZY. Винительный равен родительному: ZNAM DOBREGO FRYZJERA." }
  - { kind: government, text: "Пойти к парикмахеру — IŚĆ DO FRYZJERA, DO с родительным. У парикмахера — U FRYZJERA, U с родительным. Работать парикмахером — PRACOWAĆ JAKO FRYZJER." }
  - { kind: pronunciation, text: "Читается «фры́зьер», два слога, ударение на первом. Y — «ы», ZJE — «зье», как в FRYZURA «фрызу́ра». В форме FRYZJERZE: «фрызье́жэ»." }
  - { kind: register, text: "Слово бытовое. Салон — SALON FRYZJERSKI или просто FRYZJER: FRYZJER JEST ZAMKNIĘTY W PONIEDZIAŁKI — «парикмахерская по понедельникам закрыта»." }
collocations:
  - { pl: "salon fryzjerski", ru: "парикмахерская, салон" }
  - { pl: "wizyta u fryzjera", ru: "визит к парикмахеру" }
  - { pl: "dobry fryzjer", ru: "хороший парикмахер" }
family:
  - { pl: "fryzura", ru: "причёска", relation: root, id: fryzura }
  - { pl: "fryzjerka", ru: "парикмахерша", relation: derived }
  - { pl: "fryzjerski", ru: "парикмахерский", relation: derived }
etymology: "Из французского слова со значением «завивальщик», от глагола «завивать волосы», через немецкий. В русском для этой профессии закрепилось голландское «парикмахер», а польский оставил французское слово."
memory: "Fryzjer — парикмахер, fryzura — причёска. Читается «фры́зьер». Iść do fryzjera — пойти подстричься. U fryzjera — в парикмахерской. Fryzjerka — парикмахерша."
idioms:
  - { pl: "iść do fryzjera", ru: "пойти подстричься" }
  - { pl: "zapisać się do fryzjera", ru: "записаться к парикмахеру" }
