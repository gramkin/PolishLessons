# review
id: mozna
format: 2
lemma: "można"
rank: 247
pos: adv
pron: { cyr: "мо́жна" }
senses:
  - id: may
    ru: "можно"
    examples:
      - pl: "Można zostać jeszcze chwilę?"
        ru: "Можно остаться тут немножко подольше?"
        source: { kind: tatoeba, id: 350733 }
      - pl: "Można to powiedzieć inaczej?"
        ru: "Можно сформулировать это по-другому?"
        source: { kind: tatoeba, id: 351396 }
      - pl: "Można zaufać tym ludziom?"
        ru: "Этим людям можно доверять?"
        source: { kind: tatoeba, id: 10696035 }
  - id: cannot
    ru: "nie można — нельзя"
    examples:
      - pl: "Jemu nie można ufać."
        ru: "Ему нельзя доверять."
        source: { kind: tatoeba, id: 571139 }
      - pl: "Nie można być trochę w ciąży."
        ru: "Нельзя быть немножко беременной."
        source: { kind: tatoeba, id: 2495944 }
      - pl: "Tego nie można zrobić."
        ru: "Этого нельзя сделать."
        source: { kind: authored }
notes:
  - { kind: usage, text: "można безлично и не изменяется, после него всегда инфинитив: Można wejść? «Можно войти?»" }
  - { kind: usage, text: "Не путайте с móc: mogę значит «я могу» (лицо названо), można — «можно» (безлично). Mogę wejść? и Można wejść? различаются так же, как русские «Я могу войти?» и «Можно войти?»." }
  - { kind: usage, text: "Отрицание nie można значит «нельзя»: Nie można tu palić «Здесь нельзя курить»." }
collocations:
  - { pl: "można powiedzieć", ru: "можно сказать" }
  - { pl: "nie można", ru: "нельзя" }
  - { pl: "jak można", ru: "как можно" }
  - { pl: "można by", ru: "можно было бы" }
etymology: "Образовано от móc «мочь» (праславянское *mogti); то же гнездо, что русские «мочь», «можно», «возможно»."
memory: "można — безличное «можно», всегда с инфинитивом: Można wejść? А «я могу» — это mogę, от móc. Отрицание nie można значит «нельзя»."
idioms:
  - { pl: "można powiedzieć", ru: "можно сказать" }
  - { pl: "nie można nie", ru: "нельзя не" }
  - { pl: "jak można najszybciej", ru: "как можно быстрее" }
