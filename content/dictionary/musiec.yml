# review
id: musiec
format: 2
lemma: "musieć"
rank: 26
pos: verb
aspect: imperf
pron: { cyr: "му́щець" }
senses:
  - id: must
    ru: "быть должным, быть обязанным"
    examples:
      - pl: "Muszę już iść."
        ru: "Мне пора идти."
        source: { kind: tatoeba, id: 359794 }
      - pl: "Musisz wiedzieć."
        ru: "Тебе нужно знать."
        source: { kind: tatoeba, id: 4491112 }
      - pl: "Pan musi to zrobić."
        ru: "Вы должны это сделать."
        source: { kind: tatoeba, id: 10612893 }
  - id: probably
    ru: "должно быть (предположение)"
    examples:
      - pl: "Ona musi być martwa."
        ru: "Она, должно быть, мертва."
        source: { kind: tatoeba, id: 2814691 }
      - pl: "Musiałem o tym zapomnieć."
        ru: "Должно быть, я об этом забыл."
        source: { kind: tatoeba, id: 3421141 }
notes:
  - { kind: false-friend, text: "Отрицание nie musieć значит «не обязан», а не «нельзя»: Nie musisz iść «Ты не обязан идти». Запрет выражается через nie wolno." }
  - { kind: usage, text: "Второе значение — предположение: To musi być pomyłka «Это, должно быть, ошибка»." }
collocations:
  - { pl: "muszę iść", ru: "мне пора идти" }
  - { pl: "nie musisz", ru: "ты не обязан" }
  - { pl: "musi być", ru: "должно быть" }
etymology: "Заимствование из средневерхненемецкого müezen «быть должным» (ср. немецкое müssen): в отличие от большинства частотных слов, это не общеславянский корень."
memory: "Ловушка в отрицании: nie musisz значит «ты не обязан», а вовсе не «тебе нельзя» — запрет это nie wolno. И второе значение, как в русском «должно быть»: To musi być pomyłka."
idioms:
  - { pl: "musi to na Rusi", ru: "нужда заставит" }
  - { pl: "nie musisz", ru: "ты не обязан" }
  - { pl: "coś musi być na rzeczy", ru: "что-то тут нечисто" }
