etymology: "Корень тот же, что в KRAJAĆ «резать, кроить», праславянское *krajati, и в русском он жив в словах «кроить», «кройка», «край». Исходная мысль проста: край — это линия разреза, место, где вещь кончается, потому что её там отрезали. От этого же корня пошли и русский «край» как кромка, и русский «край» как область, и польское KRAJ, которое закрепилось за страной — то есть за землёй в её границах, отрезанной от соседней. Так один корень дал в двух языках слова разного объёма: польский отдал KRAJ государству и построил для кромки отдельное KRAWĘDŹ с суффиксом -ĘDŹ, а русский оставил оба значения одному слову и различает их только по смыслу фразы."
memory: "Главное тут соседнее слово: польское kraj значит «страна», а не «край». Кромка — krawędź, опушка и обочина — skraj, берег и край листа — brzeg, область — kraina. Корень общий с krajać «резать» и русским «кроить»: край есть линия разреза. Семь форм, из них krawędzi делает четыре падежа, а отдельный именительный множественного krawędzie, как у przyjaźń. Переносно: na krawędzi bankructwa."
