notes:
  - { kind: false-friend, text: "Опасность не в самом слове, а в его русском подобии. Польское KRAJ не значит «край»: оно значит «страна», и это одна из самых частых ошибок русскоязычных. Край в смысле кромки — это KRAWĘDŹ, SKRAJ или BRZEG, смотря что именно: KRAWĘDŹ у твёрдого предмета, SKRAJ у леса и дороги, BRZEG у реки и листа бумаги. Край в смысле области по-польски KRAINA или REGION. Поэтому выражение «на краю пропасти» становится NA KRAWĘDZI PRZEPAŚCI, и слово KRAJ в нём неуместно совершенно." }
  - { kind: usage, text: "Семь форм, женский род, мягкая основа на -DŹ. Форма KRAWĘDZI одна покрывает родительный, дательный и местный единственного и родительный множественного — четыре падежа, как GODNOŚCI. Отличие от слов на -OŚĆ в том, что у KRAWĘDŹ есть отдельный именительный множественного KRAWĘDZIE, и потому форм семь, а не шесть. Та же картина у PRZYJAŹŃ с его PRZYJAŹNIE. Творительный единственного — KRAWĘDZIĄ. Переносное NA KRAWĘDZI CZEGOŚ требует родительного: NA KRAWĘDZI BANKRUCTWA, NA KRAWĘDZI WYTRZYMAŁOŚCI." }
  - { kind: pronunciation, text: "Читается «кра́вэндзь», два слога, ударение на первом. Буква Ę перед D даёт носовое «эн», поэтому середина звучит «вэнд». Конечное DŹ — мягкое «дзь», один слитный звук, которого в русском нет; ближе всего к нему звук в слове «дзюдо», произнесённый мягко. В форме KRAWĘDZI сочетание DZI звучит «дзи»: «краве́ндзи», и ударение переезжает на второй слог. В форме KRAWĘDZIĄ последнее Ą даёт «он». Во множественном KRAWĘDZIE слышно «краве́ндзе»." }
  - { kind: register, text: "Слово нейтральное и техническое одновременно: оно стоит и в разговоре о столе, и в инструкции по обработке металла, и в геометрии, где KRAWĘDŹ значит ребро многогранника. Переносное NA KRAWĘDZI очень частое и выразительное: NA KRAWĘDZI PRZEPAŚCI, NA KRAWĘDZI ZAŁAMANIA «на грани срыва». Устойчивое OSTRE KRAWĘDZIE встречается на предупреждающих табличках. Уменьшительных слово не образует. В разговоре о листе бумаги или ткани чаще скажут BRZEG, а KRAWĘDŹ оставят твёрдым предметам." }
