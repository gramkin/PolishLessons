family:
  - { pl: "zniknąć", ru: "исчезнуть", relation: aspect, id: zniknac }
  - { pl: "zniknięcie", ru: "исчезновение", relation: derived }
  - { pl: "znikomy", ru: "ничтожный, мизерный", relation: derived }
  - { pl: "pojawiać się", ru: "появляться", relation: antonym, id: pojawiac }
etymology: "Приставка z- плюс корень *nik-, тот же, что в русских «никнуть», «поникнуть», «проникать», «возникать». Приставка здесь решает всё: воз- поднимает к появлению, z- уводит в исчезновение. В польском от того же корня wynikać «вытекать, следовать», przenikać «проникать», zanikać «затухать» и znikomy «ничтожный»."
memory: "znikać — «исчезать», и ключ к нему русское «возникать»: один корень nik-, разные приставки, противоположные смыслы. Возникать — появляться, znikać — пропадать. Настоящее время простейшее: znikam, znikasz, znika."
idioms:
  - { pl: "znikać z pola widzenia", ru: "исчезать из поля зрения" }
  - { pl: "znikać bez śladu", ru: "исчезать бесследно" }
  - { pl: "zniknąć jak kamfora", ru: "испариться, как сквозь землю провалиться" }
