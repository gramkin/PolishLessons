notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ПРИСТАВКА ПРОТИВОПОЛОЖНАЯ. Корень nik- живёт и в русском, но только под другими приставками: «никнуть», «поникнуть», «проникать» и, главное, «ВОЗникать». Вот и разгадка: воз-никать значит появляться, а z-nikać — пропадать. Один и тот же корень, две приставки, два противоположных смысла. Глагола «зникать» русский просто не построил, опереться не на что — зато есть украинское «зникати», ровно в польском значении." }
  - { kind: usage, text: "Вид несовершенный, пара — zniknąć «исчезнуть». Отсюда причастие znikający и деепричастие znikając, которых у совершенного вида не бывает. Страдательного причастия нет и быть не может: глагол непереходный, винительного дополнения у него нет, повышать в подлежащее нечего — ровно как у podróżować или współpracować." }
  - { kind: government, text: "Исчезать ОТКУДА — z с родительным: znikać z pola widzenia, z mapy, z oczu. Исчезать ГДЕ, растворяясь в чём-то, — w с предложным: znikać w tłumie, we mgle. Обе модели совпадают с русскими «исчезать из» и «исчезать в», так что строить фразу можно по родному образцу." }
  - { kind: pronunciation, text: "Настоящее время по самому простому образцу: -ać даёт -am, -asz. Znikam, znikasz, znika, znikamy, znikacie, znikają — тот же ряд, что czytam, mam, zapewniam. Ударение всегда на предпоследнем слоге, поэтому znikam звучит «зни́кам», а znikamy — «зника́мы»." }
collocations:
  - { pl: "znikać bez śladu", ru: "исчезать бесследно" }
  - { pl: "znikać z oczu", ru: "исчезать из виду" }
