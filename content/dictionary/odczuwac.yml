etymology: "Из приставки OD- и корня *čuti «чувствовать, воспринимать», того же, что русские «чуять», «чувствовать», «чуткий». Приставка OD- здесь не означает отделения, как обычно, а указывает на восприятие, идущее от предмета к человеку: ощущение приходит в ответ. Русский построил слово иначе — «ощущать» от «щупать», то есть от осязания, — и потому пара ODCZUWAĆ и «ощущать» неродственна, хотя простые CZUĆ и «чуять» родственны прямо. Внутри польского гнездо широкое и прозрачное: CZUĆ «чувствовать», CZUCIE «ощущение», UCZUCIE «чувство», CZUŁY «нежный», CZUJNY «бдительный», CZUJNIK «датчик» — последнее особенно наглядно, прибор назван по способности чувствовать. Русский в этом месте взял латинское «сенсор» или описательное «датчик», от «дать»."
memory: "Корень czu- родствен русскому «чуять», но польский оставил его широким: czuć это «чувствовать» вообще (czuję zapach, czuję się dobrze), а русское «чуять» сузилось до запаха и предчувствия. Приставочное odczuwać — «ощущать» длительно: ból, zmęczenie, brak. Гнездо: uczucie «чувство», czucie «ощущение», czujnik «датчик» (назван по чувствованию). Ловушка: czuły значит «нежный» или «чувствительный» о приборе, а «чуткий» к людям — wrażliwy. И после brak идёт родительный: odczuwać brak wody."
idioms:
  - { pl: "odczuwać brak snu", ru: "ощущать недостаток сна" }
  - { pl: "dać się odczuć", ru: "сказаться, дать себя почувствовать" }
