notes:
  - { kind: false-friend, text: "Корень CZU- тот же, что в русском «чуять» и «чувствовать», но объёмы разошлись. Польское CZUĆ покрывает всё поле чувствования: CZUJĘ ZAPACH «чувствую запах», CZUJĘ SIĘ DOBRZE «чувствую себя хорошо». Русское «чуять» сузилось до обоняния и предчувствия, а для остального взяло «чувствовать». Приставочное ODCZUWAĆ значит «ощущать» — длительно, изнутри: ODCZUWAĆ BÓL, ZMĘCZENIE, BRAK. Главная ловушка гнезда — прилагательное CZUŁY: оно значит «нежный» (CZUŁY POCAŁUNEK) или «чувствительный» о приборе (CZUŁY APARAT), но не «чуткий» в смысле внимательный к людям; это WRAŻLIWY или UWAŻNY." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия ODCZUWAJĄCY, одиннадцать от страдательного ODCZUWANY. Совершенная пара — ODCZUĆ, и основа укорачивается: ODCZUWA- против ODCZU-, сравните ODCZUWAM и ODCZUJĘ. Разница с простым CZUĆ практическая: CZUĆ — о непосредственном восприятии в данный момент (CZUJĘ DYM), ODCZUWAĆ — о длящемся внутреннем состоянии и о последствиях (ODCZUWAM ZMĘCZENIE, ODCZUWAMY SKUTKI). Существительные расходятся так же: CZUCIE — физическое ощущение, UCZUCIE — чувство к человеку." }
  - { kind: government, text: "Переходный: ощущать что — винительный без предлога, ODCZUWAĆ BÓL, ZMĘCZENIE, CHŁÓD. Но в самом частом обороте с BRAK дополнение уходит в родительный, потому что его требует само слово BRAK: ODCZUWAĆ BRAK WODY, BRAK SNU, BRAK PIENIĘDZY. Это стоит заметить, потому что по-русски конструкция та же — «ощущать нехватку воды», — и ошибиться легко только в первом шаге, выбрав винительный после BRAK. Отрицание переводит дополнение в родительный: NIE ODCZUWAM BÓLU. Устойчивое DAĆ SIĘ ODCZUĆ значит «дать себя почувствовать, сказаться»." }
  - { kind: pronunciation, text: "Читается «отчу́ваць», три слога, ударение на предпоследнем. Приставка OD перед глухим CZ оглушается и звучит «от»: не «одчуваць». Буквосочетание CZ даёт твёрдое «ч». Буква U это «у». Конечное Ć — мягкое «ць». В совершенном виде ODCZUĆ два слога, ударение на первом: «о́тчуць». В причастии ODCZUWAJĄCY пять слогов, ударение по-прежнему предпоследнее: «отчувайо́нцы». В существительном UCZUCIE три слога: «учу́це»." }
