etymology: "Из приставки WY- и корня *rjutiti «бросать», откуда польское RZUCAĆ. Русский этот корень утратил и для того же понятия взял «бросать», так что пара WYRZUCAĆ и «выбрасывать» совпадает по приставке и расходится по корню — редкий для двух языков случай, когда знакома только половина слова. Польское гнездо выросло широко и в заметной мере отвечает за абстрактную лексику: ODRZUCIĆ «отвергнуть», PORZUCIĆ «покинуть», ZARZUCIĆ «забросить» и ZARZUT «обвинение», WYRZUT «упрёк», WYRZUTY SUMIENIA «угрызения совести». Образ один и тот же — брошенное в сторону человека, — и он роднит эту карточку с OSKARŻAĆ, где обвинение строится от жалобы. Два разных корня, одна метафора осуждения как броска."
memory: "Корень rzuc- русскому не родствен: «бросать» и rzucać — разные слова, так что это гнездо учится целиком. Зато приставка WY- отвечает «вы-» буквально. Гнездо важное: rzucać «бросать», wyrzucać «выбрасывать», odrzucać «отвергать», porzucić «покинуть», zarzut «обвинение», wyrzuty sumienia «угрызения совести». Второе значение частое и резкое: wyrzucić z pracy «уволить» (нейтральное — zwolnić). И одно расхождение: wyrzucać DO kosza с родительным, где русский говорит «в корзину»."
