notes:
  - { kind: false-friend, text: "Корень RZUC- русскому не достался: «бросать» и RZUCAĆ неродственны, и опереться на знакомое слово нельзя. Зато гнездо в польском связное и очень полезное: RZUCAĆ «бросать», WYRZUCAĆ «выбрасывать», ODRZUCAĆ «отклонять, отвергать», PORZUCIĆ «покинуть, оставить», ZARZUCAĆ «забрасывать» и — внимание — ZARZUT, что значит «обвинение, упрёк». Последнее связывает эту карточку с OSKARŻAĆ: польский строит обвинение как то, что бросают в человека, а русское «упрёк» и «обвинение» идут от других корней. Приставка WY- отвечает русскому «вы-» буквально, так что WYRZUCAĆ разбирается как «вы-брасывать», только корень другой." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия WYRZUCAJĄCY, одиннадцать от страдательного WYRZUCANY. Совершенная пара — WYRZUCIĆ, и различие в одной гласной основы: WYRZUCAM против WYRZUCĘ. Второе значение, «увольнять, выгонять», в живой речи встречается не реже первого: WYRZUCIĆ Z PRACY «уволить», WYRZUCIĆ ZE SZKOŁY «выгнать из школы», и оно всегда звучит резко — нейтральное «уволить» это ZWOLNIĆ. Существительное WYRZUT значит «упрёк», а WYRZUTY SUMIENIA — «угрызения совести», буквально «выбросы совести»." }
  - { kind: government, text: "Переходный: выбрасывать что — винительный без предлога, WYRZUCAĆ ŚMIECI, GAZETY, STARE MEBLE. Откуда — предлог Z с родительным: WYRZUCAĆ Z DOMU, Z PRACY, ZE SZKOŁY, и русское «из» совпадает. Куда — предлог DO с родительным для контейнера: WYRZUCAĆ DO KOSZA «выбрасывать в корзину», где русский говорит «в» с винительным, и это единственное регулярное расхождение. Отрицание переводит дополнение в родительный: NIE WYRZUCAJ TYCH LISTÓW. Устойчивое WYRZUCAĆ KOMUŚ COŚ значит «упрекать кого-то в чём-то», с дательным лица." }
  - { kind: pronunciation, text: "Читается «выжу́цаць», три слога, ударение на предпоследнем. Буква Y это «ы», поэтому первый слог «вы». Буквосочетание RZ даёт «ж», и это правило без исключений: не «вырзуцать», а «выжуцаць». Буква U это «у». Сочетание CA звучит «ца», твёрдо. Конечное Ć — мягкое «ць». В совершенном виде WYRZUCIĆ сочетание CI даёт мягкое «ць»: «выжу́циць», и этим два вида различаются на слух." }
