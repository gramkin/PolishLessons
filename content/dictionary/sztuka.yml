# review
id: sztuka
format: 2
lemma: "sztuka"
rank: 891
pos: noun
pron: { cyr: "шту́ка" }
senses:
  - id: art
    ru: "искусство"
    examples:
      - pl: "Sztuka jest długa, życie krótkie."
        ru: "Искусство продолжительно, жизнь коротка."
        source: { kind: tatoeba, id: 3452377 }
      - pl: "Lubię sztukę."
        ru: "Мне нравится искусство."
        source: { kind: translated, id: 10572569 }
      - pl: "Nie znam się na sztuce."
        ru: "Я не разбираюсь в искусстве."
        source: { kind: translated, id: 10572574 }
  - id: play
    ru: "пьеса, спектакль"
    note: "В театральном смысле sztuka — это «пьеса»."
    examples:
      - pl: "Recenzje sztuki były przeważnie przychylne."
        ru: "Отзывы о пьесе были в целом благоприятными."
        source: { kind: tatoeba, id: 822145 }
      - pl: "Ona zagrała w tej sztuce."
        ru: "Она играла в этой пьесе."
        source: { kind: translated, id: 349208 }
      - pl: "Sztuka trwała trzy godziny."
        ru: "Спектакль длился три часа."
        source: { kind: authored }
  - id: piece
    ru: "штука (счётная единица)"
    note: "Это же слово считает предметы и голов скота."
    examples:
      - pl: "Jak dobrze pójdzie, robię 2-3 sztuki dziennie."
        ru: "Если хорошо пойдет, делаю 2-3 штуки ежедневно."
        source: { kind: tatoeba, id: 348628 }
      - pl: "Opakowanie zawiera 20 sztuk."
        ru: "В упаковке 20 штук."
        source: { kind: translated, id: 2939621 }
      - pl: "Mamy dziesięć sztuk bydła."
        ru: "У нас десять голов скота."
        source: { kind: translated, id: 3050319 }
  - id: martial
    ru: "sztuki walki — боевые искусства"
    examples:
      - pl: "Karate to sztuka walki bez broni."
        ru: "Каратэ - это искусство обороны без оружия."
        source: { kind: tatoeba, id: 1355012 }
      - pl: "Sztuka wyrobu takich drewnianych cebrów zupełnie już zanikła."
        ru: "Искусство изготовления таких деревянных вёдер уже совершенно утеряно."
        source: { kind: tatoeba, id: 744170 }
      - pl: "Trenuje wschodnie sztuki walki."
        ru: "Он занимается восточными единоборствами."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово покрывает сразу три русских: «искусство», «пьеса» и «штука». Русское «штука» — то же самое заимствование, но в польском у слова выросло высокое значение, которого в русском нет: sztuka jest długa «искусство вечно»." }
  - { kind: usage, text: "Театральное значение очень живое: Ona zagrała w tej sztuce «Она играла в этой пьесе». Спектакль как представление — также przedstawienie." }
  - { kind: usage, text: "Как счётное слово sztuka стоит после числительного в родительном множественного: dwadzieścia sztuk «двадцать штук», dziesięć sztuk bydła «десять голов скота»." }
  - { kind: usage, text: "sztuki piękne — «изящные искусства», sztuki walki — «боевые искусства», sztuka dla sztuki — «искусство ради искусства». А do trzech razy sztuka значит «бог троицу любит»." }
collocations:
  - { pl: "sztuki piękne", ru: "изящные искусства" }
  - { pl: "sztuki walki", ru: "боевые искусства" }
  - { pl: "dwadzieścia sztuk", ru: "двадцать штук" }
  - { pl: "dzieło sztuki", ru: "произведение искусства" }
family:
  - { pl: "sztuczny", ru: "искусственный", relation: derived }
  - { pl: "sztuczka", ru: "трюк, фокус", relation: derived }
  - { pl: "sztukmistrz", ru: "фокусник", relation: derived }
etymology: "Из немецкого Stück «кусок, штука». Русское «штука» — то же заимствование, но по-польски слово доросло до значения «искусство», которого в русском у него нет."
memory: "sztuka — сразу «искусство», «пьеса» и «штука». Русское «штука» пришло из того же немецкого Stück, но высокого значения не получило. Отсюда sztuki piękne «изящные искусства», sztuki walki «боевые искусства» и dwadzieścia sztuk «двадцать штук»."
idioms:
  - { pl: "sztuki piękne", ru: "изящные искусства" }
  - { pl: "sztuki walki", ru: "боевые искусства" }
  - { pl: "do trzech razy sztuka", ru: "бог троицу любит" }
  - { pl: "sztuka dla sztuki", ru: "искусство ради искусства" }
