etymology: "Приставка ZA- плюс MAWIAĆ, многократная форма от MÓWIĆ «говорить», которое восходит к праславянскому *mъlviti, то есть к русскому «молвить». Значение «заказывать» выросло из речи: заказать значит сказать вперёд, высказать желаемое заранее. Русский пришёл к тому же понятию тем же путём, но от другого глагола речи — «казать» в смысле «объявить», откуда «заказывать», «приказ», «указ». Получается красивая симметрия: два языка назвали заказ через говорение, но выбрали разные слова для говорения. Из того же польского гнезда идут NAMAWIAĆ «уговаривать», WYMAWIAĆ «выговаривать», UMOWA «договор»."
memory: "Оба языка построили «заказывать» от глагола речи, но от разных: польский от mawiać, то есть от mówić «говорить», русский от «казать». Поэтому zamawiać это буквально «высказать вперёд». Корень тот же, что в namówić. Управление переносится почти целиком: zamawiać coś u kogoś, przez internet, na piątek. Знать zamówienie «заказ» и na zamówienie «на заказ». В деревенской речи zamawiać ból значит «заговаривать боль», как и русское «заговаривать»."
idioms:
  - { pl: "robić na zamówienie", ru: "делать на заказ" }
