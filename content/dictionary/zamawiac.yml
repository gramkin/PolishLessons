notes:
  - { kind: false-friend, text: "Любопытно, что оба языка построили слово «заказывать» от глагола речи, но от разных. Польский взял MAWIAĆ, многократную форму от MÓWIĆ «говорить», и получилось ZAMAWIAĆ — буквально «заговорить, высказать вперёд». Русский взял «казать» в смысле «сказать, объявить» и получил «заказывать». Корень тот же, что в NAMÓWIĆ «уговорить», с которым карточку стоит читать рядом. Существительное ZAMÓWIENIE значит «заказ», а оборот NA ZAMÓWIENIE — «на заказ»." }
  - { kind: government, text: "Прямое дополнение в винительном: ZAMAWIAĆ PIZZĘ, BILETY, TAKSÓWKĘ. Тот, у кого заказывают, вводится предлогом U с родительным: ZAMAWIAĆ MEBLE U STOLARZA, как и по-русски «заказывать у столяра». Способ идёт предлогом PRZEZ с винительным: ZAMAWIAĆ PRZEZ INTERNET, где русский говорит «через интернет», тоже совпадая. Цель или срок — предлогом NA с винительным: ZAMAWIAĆ NA PIĄTEK, NA WYNOS «на вынос». Это один из тех глаголов, где управление переносится почти целиком." }
  - { kind: usage, text: "Шестьдесят три формы — подпись переходного глагола несовершенного вида, с действительным причастием на -ĄCY. Видовой партнёр — ZAMÓWIĆ, и в основе работает чередование MAWIA и MÓWI: ZAMAWIAĆ при ZAMÓWIĆ, ровно как NAMAWIAĆ при NAMÓWIĆ. Причастие ZAMAWIANY употребительно в торговле: TOWAR ZAMAWIANY NA MIARĘ. В народной речи у глагола есть ещё одно значение, знахарское: ZAMAWIAĆ BÓL значит заговаривать боль, и русское «заговаривать» устроено точно так же, от речи." }
  - { kind: pronunciation, text: "Читается «зама́вячь», три слога, ударение на предпоследнем. Сочетание WIA даёт «вя»: буква I здесь знак мягкости, а не отдельный гласный, поэтому слышно «вя», а не «виа». То же в ZAMAWIAM «зама́вям». Конечное Ć мягкое, «чь». В совершенном виде меняется гласная: ZAMÓWIĆ звучит «заму́вичь», потому что Ó читается как «у», ровно как в MÓWIĆ «му́вичь»." }
  - { kind: register, text: "Слово нейтральное и совершенно повседневное: в кафе, в интернете, у мастера. Частые обороты: ZAMAWIAĆ NA WYNOS «заказывать на вынос», ZAMÓWIĆ TAKSÓWKĘ, ZŁOŻYĆ ZAMÓWIENIE «сделать заказ», ROBIĆ NA ZAMÓWIENIE «делать на заказ». В ресторане официант спросит CO ZAMAWIAJĄ PAŃSTWO «что будете заказывать». Знахарское значение принадлежит деревенской речи и в городе звучит как шутка." }
