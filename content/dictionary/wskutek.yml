# review
id: wskutek
format: 2
lemma: "wskutek"
rank: 6048
pos: prep
pron: { cyr: "фску́тэк" }
senses:
  - id: due-to
    ru: "вследствие, в результате, из-за (+ род.)"
    examples:
      - pl: "Wskutek ulewy mecz został odwołany."
        ru: "Из-за ливня матч отменили."
        source: { kind: translated, id: 945823 }
      - pl: "Oślepł wskutek wypadku."
        ru: "Он ослеп в результате несчастного случая."
        source: { kind: translated, id: 853147 }
      - pl: "Pociąg spóźnił się wskutek śnieżycy."
        ru: "Поезд опоздал из-за метели."
        source: { kind: translated, id: 410417 }
  - id: as-a-result
    ru: "в итоге (чьих-то действий, решений) — книжн."
    examples:
      - pl: "Podupadł na zdrowiu wskutek nadużywania alkoholu."
        ru: "Его здоровье пошатнулось вследствие злоупотребления алкоголем."
        source: { kind: translated, id: 516448 }
      - pl: "Wskutek nadmiaru trosk szybko się postarzał."
        ru: "От множества забот он быстро постарел."
        source: { kind: translated, id: 498248 }
notes:
  - { kind: government, text: "Требует родительного, как русское «вследствие»: wskutek wypadku, wskutek burzy. Пишется слитно; раздельное NA SKUTEK значит то же самое: na skutek wypadku." }
  - { kind: usage, text: "Называет причину, обычно неприятную и не зависящую от людей: погода, авария, болезнь. Нейтральное «из-за» в разговоре — PRZEZ или Z POWODU: spóźniłem się przez korki. WSKUTEK звучит как сообщение в новостях." }
  - { kind: pronunciation, text: "«фску́тэк»: W перед S оглушается в «ф», конечное K. Ударение на предпоследнем слоге SKU." }
  - { kind: register, text: "Книжное, официальное: новости, отчёты, протоколы. В живой речи его заменяют przez, z powodu, bo." }
collocations:
  - { pl: "wskutek wypadku", ru: "в результате аварии" }
  - { pl: "wskutek złej pogody", ru: "из-за плохой погоды" }
  - { pl: "na skutek", ru: "вследствие (то же самое)" }
family:
  - { pl: "skutek", ru: "следствие, результат", relation: root, id: skutek }
  - { pl: "skuteczny", ru: "эффективный", relation: derived }
etymology: "Срастание W SKUTEK, «в следствие»: предлог W и SKUTEK, «результат, последствие», от старого SKUTKOWAĆ, «осуществлять». Русское «вследствие» построено так же: в + следствие."
memory: "Wskutek = w + skutek, «вследствие» — с родительным: wskutek burzy. То же, что na skutek. В разговоре — przez, z powodu."
idioms:
  - { pl: "na skutek czegoś", ru: "вследствие чего-то" }
formExamples:
  - form: "wskutek"
    pl: "Wskutek tajfunu rodzice wrócili dzień wcześniej z podróży."
    ru: "Из-за тайфуна родители вернулись из поездки на день раньше."
    source: { kind: translated, id: 997662 }
  - form: "wskutek"
    pl: "Wskutek burzy samolot nie mógł wystartować."
    ru: "Из-за грозы самолёт не смог взлететь."
    source: { kind: translated, id: 355571 }
  - form: "wskutek"
    pl: "Wskutek dymu zaczęliśmy łzawić."
    ru: "От дыма у нас заслезились глаза."
    source: { kind: translated, id: 705260 }
  - form: "wskutek"
    pl: "Spóźniliśmy się wskutek strasznej śnieżycy."
    ru: "Мы опоздали из-за страшной метели."
    source: { kind: translated, id: 1618186 }
  - form: "wskutek"
    pl: "Wskutek tajfunu rzeka wylała."
    ru: "Из-за тайфуна река вышла из берегов."
    source: { kind: translated, id: 722383 }
