  - id: lane-course
    ru: "трасса, дорожка"
    examples:
      - pl: "Tor wyścigowy ma pięć kilometrów."
        ru: "Гоночная трасса имеет пять километров."
        source: { kind: authored }
      - pl: "Pływał na trzecim torze."
        ru: "Он плыл на третьей дорожке."
        source: { kind: authored }
  - id: trajectory
    ru: "траектория, путь (перен.)"
    examples:
      - pl: "Rozmowa zeszła na inny tor."
        ru: "Разговор перешёл в другое русло."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "РУССКОЕ «ТОР» — ЭТО ТОЛЬКО ГЕОМЕТРИЧЕСКАЯ ФИГУРА, И БОЛЬШЕ НИЧЕГО. Польское TOR значит «путь, трасса, дорожка»: tor kolejowy «железнодорожный путь», tor wyścigowy «гоночная трасса», tor pływacki «дорожка в бассейне». Опереться на созвучие нельзя — смыслы не пересекаются вовсе." }
  - { kind: usage, text: "Предложный — w TORZE, с переходом r→rz: na torze. Множественное TORY часто значит просто «рельсы, путь»: wykoleić się z torów. А переносный оборот ZEJŚĆ NA INNY TOR отвечает русскому «перейти в другое русло»." }
  - { kind: pronunciation, text: "Один слог: тор. R раскатистое, o открытое: «тор». Предложный torze звучит «то́жэ», с ж вместо rz, и на слух сильно отличается от исходной формы." }
collocations:
  - { pl: "tor kolejowy", ru: "железнодорожный путь" }
  - { pl: "tor wyścigowy", ru: "гоночная трасса" }
  - { pl: "zejść na inny tor", ru: "перейти в другое русло" }
family:
  - { pl: "torować", ru: "прокладывать путь", relation: derived }
  - { pl: "szyna", ru: "рельс", relation: root }
  - { pl: "droga", ru: "дорога", relation: root, id: droga }
etymology: "От torować «прокладывать, пробивать путь», из праславянского *tьrti «тереть» — того же корня, что русские «тереть» и «торить». Русское «проторённый путь» сохранило именно этот смысл: путь, который протёрли ногами. Так что когнат есть, только в русском он остался в одном выражении."
memory: "tor — «путь, трасса, дорожка», а не русский «тор», который только фигура. Корень тот же, что в «проторить»: путь, который протёрли. Предложный — na torze, с r→rz."
idioms:
  - { pl: "zejść na inny tor", ru: "перейти в другое русло" }
  - { pl: "tor przeszkód", ru: "полоса препятствий" }
