notes:
  - { kind: pronunciation, text: "Носовой ę держится по всей парадигме: ZAKLĘCIE, ZAKLĘCIA, ZAKLĘCIU, ZAKLĘĆ. Произносится он перед мягким ć как «эн»: «закле́нце». Родительный множественного — ZAKLĘĆ, с нулевым окончанием и мягким ć на конце, и это самая неудобная для русского форма во всей таблице." }
  - { kind: usage, text: "Глагол, от которого слово образовано, двузначен: ZAKLĄĆ значит и «заклясть, околдовать», и «выругаться». Zaklął pod nosem — «он выругался себе под нос». От первого смысла идёт наше существительное, от второго — PRZEKLEŃSTWO «ругательство» и KLĄTWA «проклятие». Русское «заклятие» и «проклятие» разошлись так же." }
collocations:
  - { pl: "rzucić zaklęcie", ru: "наложить заклятие" }
  - { pl: "magiczne zaklęcie", ru: "магическое заклинание" }
  - { pl: "księga zaklęć", ru: "книга заклинаний" }
family:
  - { pl: "zakląć", ru: "заклясть; выругаться", relation: root }
  - { pl: "klątwa", ru: "проклятие", relation: root }
  - { pl: "przekleństwo", ru: "ругательство", relation: root }
etymology: "От zakląć, из праславянского *klęti «клясть» — того же корня, что русские «клясть», «клятва», «проклятие», «заклятие». Носовой ę в польском сохранился там, где русский его потерял: klęti дало польское kląć и наше «клясть». Поэтому zaklęcie и «заклятие» — буквально одно слово, только с разной судьбой носового."
memory: "Носовой держится везде: zaklęcie, zaklęcia, zaklęć. И помни двузначность глагола: zakląć — это и «заклясть», и «выругаться»."
idioms:
