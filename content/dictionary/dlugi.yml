# review
id: dlugi
format: 2
lemma: "długi"
rank: 283
pos: adj
pron: { cyr: "дуу́ги" }
senses:
  - id: long-thing
    ru: "длинный (о предмете)"
    examples:
      - pl: "Słoń ma długi nos."
        ru: "У слона длинный нос."
        source: { kind: tatoeba, id: 611635 }
      - pl: "Mój pies ma długi ogon."
        ru: "У моей собаки длинный хвост."
        source: { kind: tatoeba, id: 3432545 }
      - pl: "Króliki mają długie uszy."
        ru: "У кроликов длинные уши."
        source: { kind: tatoeba, id: 529144 }
  - id: long-time
    ru: "долгий (о времени); длинный (о волосах, речи)"
    examples:
      - pl: "Droga jest długa."
        ru: "Путь долог."
        source: { kind: tatoeba, id: 826566 }
      - pl: "Tom miał długie włosy."
        ru: "У Тома были длинные волосы."
        source: { kind: tatoeba, id: 12470093 }
      - pl: "Hasło jest długie."
        ru: "Пароль длинный."
        source: { kind: tatoeba, id: 3623609 }
notes:
  - { kind: false-friend, text: "Одно слово покрывает оба русских: и «длинный» (długa droga), и «долгий» (długi dzień). Различать их по-польски не нужно." }
  - { kind: usage, text: "Степени: długi — dłuższy — najdłuższy; наречие długo — dłużej — najdłużej." }
  - { kind: false-friend, text: "Осторожно с омонимом: długi — это ещё и множественное число от dług «долг». Mam długi значит «У меня долги», а не «У меня длинные»." }
collocations:
  - { pl: "długa droga", ru: "долгий путь" }
  - { pl: "długie włosy", ru: "длинные волосы" }
  - { pl: "przez długi czas", ru: "долгое время" }
  - { pl: "dłuższa chwila", ru: "довольно долго" }
etymology: "Праславянское *dьlgъ — то же слово, что русские «долгий» и «длинный»; в польском оно одно на оба значения."
memory: "długi — и «длинный», и «долгий»: długa droga, długi dzień. Осторожно: długi — ещё и «долги», множественное от dług."
idioms:
  - { pl: "mieć długi język", ru: "быть болтливым" }
  - { pl: "długa droga", ru: "долгий путь" }
  - { pl: "na dłuższą metę", ru: "в долгосрочной перспективе" }
