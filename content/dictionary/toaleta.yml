# review
id: toaleta
format: 2
lemma: "toaleta"
rank: 1781
pos: noun
pron: { cyr: "тоале́та" }
senses:
  - id: toilet
    ru: "туалет, уборная"
    examples:
      - pl: "Gdzie jest toaleta?"
        ru: "Где туалет?"
        source: { kind: translated, id: 732023 }
      - pl: "Toaleta jest tam."
        ru: "Туалет там."
        source: { kind: translated, id: 10695815 }
      - pl: "Gdzie jest damska toaleta?"
        ru: "Где женский туалет?"
        source: { kind: translated, id: 448792 }
  - id: go-toilet
    ru: "туалет (идти, пользоваться)"
    examples:
      - pl: "Idę na toaletę."
        ru: "Я иду в туалет."
        source: { kind: translated, id: 5139966 }
      - pl: "Muszę iść do toalety."
        ru: "Мне нужно в туалет."
        source: { kind: translated, id: 7610600 }
      - pl: "Uczniom nie wolno korzystać z tej toalety."
        ru: "Студенты не должны пользоваться этим туалетом."
        source: { kind: tatoeba, id: 599421 }
notes:
  - { kind: government, text: "Идти в туалет — iść do toalety (родительный с do) или iść na toaletę (винительный с na); оба варианта обычны. Быть в туалете — być w toalecie (предложный)." }
  - { kind: usage, text: "Само помещение с ванной называется łazienka; toaleta — именно уборная. В квартире они часто раздельны." }
  - { kind: usage, text: "Слово значит ещё и «туалет» в смысле наряда и утреннего туалета, но в живой речи это редкость." }
  - { kind: false-friend, text: "Русское «туалет» и польское toaleta совпадают, но унитаз по-польски muszla или sedes, а не toaleta." }
collocations:
  - { pl: "gdzie jest toaleta", ru: "где туалет" }
  - { pl: "iść do toalety", ru: "идти в туалет" }
  - { pl: "damska toaleta", ru: "женский туалет" }
family:
  - { pl: "łazienka", ru: "ванная", relation: root, id: lazienka }
  - { pl: "toaletowy", ru: "туалетный", relation: root }
etymology: "Из французского toilette через немецкий — тем же путём, что русское «туалет». Значение «уборная» развилось позже исходного «наряд»."
memory: "toaleta — «туалет, уборная»: Gdzie jest toaleta? А ванная комната — łazienka, отдельное слово. Идти — iść do toalety или na toaletę."
idioms:
  - { pl: "gdzie jest toaleta?", ru: "где туалет?" }
  - { pl: "iść do toalety", ru: "идти в туалет" }
  - { pl: "damska toaleta", ru: "женский туалет" }
