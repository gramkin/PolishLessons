# review
id: kamera
format: 2
lemma: "kamera"
rank: 796
pos: noun
pron: { cyr: "каме́ра" }
senses:
  - id: camera
    ru: "видеокамера"
    examples:
      - pl: "Telewidz widzi tylko to, co pokaże kamera."
        ru: "Телезритель видит только то, что покажет камера."
        source: { kind: translated, id: 357902 }
      - pl: "Ta nowa kamera jest bardzo łatwa w użyciu."
        ru: "Эта новая камера очень проста в использовании."
        source: { kind: translated, id: 10776823 }
      - pl: "W tej kamerze nie ma taśmy."
        ru: "В этой камере нет плёнки."
        source: { kind: translated, id: 6306804 }
  - id: cameras
    ru: "kamery — камеры (наблюдения)"
    examples:
      - pl: "W budynku są kamery."
        ru: "В здании есть камеры."
        source: { kind: tatoeba, id: 6773379 }
      - pl: "Gdzie są kamery?"
        ru: "Где камеры?"
        source: { kind: translated, id: 13788142 }
      - pl: "Nie dotykaj kamery."
        ru: "Не трогай камеру."
        source: { kind: translated, id: 12574241 }
  - id: buy
    ru: "kupić kamerę — купить камеру"
    examples:
      - pl: "Kupiłem kamerę internetową."
        ru: "Я купил веб-камеру."
        source: { kind: translated, id: 12061530 }
      - pl: "Kupiłam kamerę internetową."
        ru: "Я купила веб-камеру."
        source: { kind: translated, id: 12061533 }
      - pl: "Masz taką samą kamerę jak ja."
        ru: "У тебя такая же камера, как у меня."
        source: { kind: translated, id: 393000 }
  - id: vs-aparat
    ru: "kamera «видеокамера» ≠ aparat «фотоаппарат»"
    note: "Русское «камера» шире обоих."
    examples:
      - pl: "Co zrobiłeś z kamerą?"
        ru: "Что ты сделал с камерой?"
        source: { kind: translated, id: 1352178 }
      - pl: "Mary rozglądała się za swoją kamerą."
        ru: "Мэри искала свою камеру."
        source: { kind: translated, id: 12069037 }
      - pl: "To nie kamera, tylko aparat."
        ru: "Это не видеокамера, а фотоаппарат."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово уже русского. Польское kamera — это только видеокамера или камера наблюдения. Фотоаппарат — aparat (fotograficzny), а тюремная камера — cela. Русское «камера» покрывает всё это сразу." }
  - { kind: government, text: "nagrywać kamerą «снимать камерой» — творительный падеж; w kamerze «в камере» — предложный." }
  - { kind: usage, text: "Ходовые: kamera internetowa «веб-камера», kamera ochrony «камера наблюдения», kamera cofania «камера заднего вида»." }
  - { kind: usage, text: "Ударение, как обычно, на предпоследнем слоге: ka-ME-ra." }
collocations:
  - { pl: "kamera internetowa", ru: "веб-камера" }
  - { pl: "kamera ochrony", ru: "камера наблюдения" }
  - { pl: "nagrywać kamerą", ru: "снимать камерой" }
  - { pl: "aparat fotograficzny", ru: "фотоаппарат" }
family:
  - { pl: "aparat", ru: "фотоаппарат", relation: root }
  - { pl: "cela", ru: "тюремная камера", relation: root }
  - { pl: "nagrywać", ru: "записывать", relation: root }
etymology: "Через латинское camera «свод, комната» — то же заимствование, что русская «камера», но значение в польском сузилось."
memory: "kamera уже русского слова: по-польски это только видеокамера или камера наблюдения. Фотоаппарат — aparat, а тюремная камера — cela. Русское «камера» покрывает всё это сразу, и на этом легко ошибиться: To nie kamera, tylko aparat."
idioms:
  - { pl: "kamera internetowa", ru: "веб-камера" }
  - { pl: "kamera ochrony", ru: "камера наблюдения" }
  - { pl: "nagrywać kamerą", ru: "снимать камерой" }
formExamplesSkip:
  - { form: "kamero", reason: "звательный падеж у неодушевлённого существительного не употребляется" }
