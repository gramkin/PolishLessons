etymology: "От cały «целый», из праславянского *cělъ, того же, что русское «целый». Суффикс -owity образует прилагательные меры и степени: jadowity «ядовитый», pracowity «трудолюбивый». Отсюда и całkowicie «полностью»."
memory: "całkowity — «полный, общий», о величине и степени: całkowity koszt, całkowita cisza. А cały — «целый» о неразделённом предмете: cały chleb. В математике liczba całkowita это «целое число»."
idioms:
  - { pl: "całkowita porażka", ru: "полный провал" }
  - { pl: "w całkowitej ciszy", ru: "в полной тишине" }
formExamplesSkip:
  - { form: "całkowici", reason: "Мужско-личная форма множественного числа образуется по общему правилу, но całkowity сочетается с отвлечёнными существительными меры и степени (koszt, cisza, zakaz, porażka), а не с названиями лиц, поэтому подлежащего, с которым она могла бы согласоваться, в языке не возникает." }
