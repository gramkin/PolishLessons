notes:
  - { kind: false-friend, text: "НЕ ПУТАЙ С CAŁY. Cały значит «целый, весь» о предмете, который не разделён: cały chleb, cały dzień. Całkowity значит «полный, общий» о величине или степени: całkowity koszt, całkowita cisza. По-русски «целый хлеб», но «общая сумма», и выбор между cały и całkowity ровно такой же." }
  - { kind: usage, text: "В математике liczba całkowita — это «целое число», термин, а не описание. Наречие całkowicie значит «полностью, совершенно»: całkowicie się zgadzam. Прилагательное сочетается с отвлечёнными существительными, поэтому мужско-личных форм в живой речи почти не слышно." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: cał-ko-WI-ty. Ł читается как краткое у, так что начало звучит «цау-»: «цаукови́ты». Женская форма — «цаукови́та»." }
collocations:
  - { pl: "całkowity koszt", ru: "общая стоимость" }
  - { pl: "liczba całkowita", ru: "целое число" }
  - { pl: "całkowity zakaz", ru: "полный запрет" }
family:
  - { pl: "cały", ru: "целый, весь", relation: root, id: caly }
  - { pl: "całość", ru: "целое", relation: root, id: calosc }
