# review
id: ziac
format: 2
lemma: "ziać"
rank: 2315
pos: verb
aspect: imperf
pron: { cyr: "зяць" }
senses:
  - id: breathe-fire
    ru: "изрыгать, дышать (огнём)"
    examples:
      - pl: "Smoki mają skrzydła i zieją ogniem."
        ru: "У драконов есть крылья, и они изрыгают огонь."
        source: { kind: translated, id: 2147301 }
      - pl: "Smok zieje ogniem."
        ru: "Дракон изрыгает огонь."
        source: { kind: authored }
      - pl: "Piec ział żarem."
        ru: "Печь дышала жаром."
        source: { kind: authored }
  - id: gape
    ru: "зиять (о пустоте, дыре)"
    examples:
      - pl: "W ścianie zieje dziura."
        ru: "В стене зияет дыра."
        source: { kind: authored }
      - pl: "Przed nami ziała przepaść."
        ru: "Перед нами зияла пропасть."
        source: { kind: authored }
notes:
  - { kind: government, text: "Чем дышит — ТВОРИТЕЛЬНЫЙ падеж: ziać ogniem «изрыгать огонь», ziać nienawiścią «дышать ненавистью»." }
  - { kind: false-friend, text: "Прямая родня русскому «зиять» и «зевать»: корень тот же, значение «раскрывать пасть» сохранилось в обоих языках." }
  - { kind: usage, text: "Переносно — о сильном чувстве: ziać nienawiścią «дышать ненавистью»." }
  - { kind: usage, text: "Спряжение неочевидное: ja zieję, ty ziejesz, oni zieją — с j в основе." }
collocations:
  - { pl: "ziać ogniem", ru: "изрыгать огонь" }
  - { pl: "ziać nienawiścią", ru: "дышать ненавистью" }
etymology: "Праславянское *zijati; прямая родня русским «зиять» и «зевать»."
memory: "ziać — «изрыгать» огонь и «зиять» о дыре. Родня русскому «зиять». Чем дышит — творительный: ziać ogniem. Спряжение с j: zieję, zieją."
idioms:
  - { pl: "ziać ogniem", ru: "изрыгать огонь" }
