id: sugestia
format: 2
lemma: "sugestia"
rank: 4678
pos: noun
pron: { cyr: "сугэ́стья" }
senses:
  - id: suggestion
    ru: "предложение, совет, намёк"
    examples:
      - pl: "Dziękuję za sugestię."
        ru: "Спасибо за предложение."
        source: { kind: authored }
      - pl: "Masz jakieś sugestie?"
        ru: "Есть какие-нибудь предложения?"
        source: { kind: authored }
      - pl: "Zgodnie z sugestią lekarza zmienił dietę."
        ru: "По совету врача он изменил диету."
        source: { kind: authored }
  - id: hint
    ru: "внушение, намёк (психол.)"
    examples:
      - pl: "Uległ sugestii hipnotyzera."
        ru: "Он поддался внушению гипнотизёра."
        source: { kind: authored }
      - pl: "W jego słowach była sugestia, że kłamię."
        ru: "В его словах был намёк на то, что я лгу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SUGESTIA — «предложение, совет», а не только «внушение», как в русском. MAM SUGESTIĘ — «у меня есть предложение». Предлагать — SUGEROWAĆ: SUGERUJĘ, ŻEBYŚMY POCZEKALI." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — SUGESTII, с двумя I. Множественное — SUGESTIE. Звательный и архаичное SUGESTYJ не используем." }
  - { kind: government, text: "Предложение насчёт чего — SUGESTIA DOTYCZĄCA и родительный. По совету — ZGODNIE Z SUGESTIĄ, творительный. Поддаться внушению — ULEC SUGESTII, дательный." }
  - { kind: pronunciation, text: "Читается «сугэ́стья»: GE — твёрдое «гэ», STIA — «стья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "zgłosić sugestię", ru: "внести предложение" }
  - { pl: "zgodnie z sugestią", ru: "по совету" }
  - { pl: "uwagi i sugestie", ru: "замечания и предложения" }
family:
  - { pl: "sugerować", ru: "предлагать, намекать", relation: derived, id: sugerowac }
  - { pl: "propozycja", ru: "предложение", relation: root, id: propozycja }
  - { pl: "rada", ru: "совет", relation: root, id: rada }
etymology: "Из латинского SUGGESTIO «подсказка», от SUGGERERE «подкладывать, подсказывать». Русское «суггестия» — то же слово, но только в психологии."
memory: "Sugestia — предложение, совет; внушение — тоже. Masz jakieś sugestie? — есть предложения? Sugerować — предлагать. Читается «сугэ́стья»."
idioms:
  - { pl: "ulec sugestii", ru: "поддаться внушению" }
formExamplesSkip:
  - { form: "sugestio", reason: "звательный от отвлечённого существительного не употребляется" }
  - { form: "sugestyj", reason: "архаичный родительный множественного, в норме SUGESTII" }
