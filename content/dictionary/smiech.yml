      - pl: "Śmiechy ucichły, gdy wszedł dyrektor."
        ru: "Смех утих, когда вошёл директор."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Начало слова мягкое целиком: ś перед mi читается как «сь», и получается «сьмех», где русское «смех» звучит твёрдо. Та же мягкость во всей семье: śmiać się «смеяться», śmieszny «смешной», uśmiech «улыбка». Для русского уха это главная примета слова, потому что в остальном оно наше." }
  - { kind: false-friend, text: "Производное UŚMIECH означает «улыбка», а не «усмешка». Слово это тёплое и нейтральное: uśmiech dziecka, miły uśmiech. Русская «усмешка» несёт насмешку, и по-польски она будет UŚMIESZEK или POŚMIEWISKO в зависимости от оттенка. Ошибка тем неприятнее, что меняет оценку на противоположную." }
collocations:
  - { pl: "wybuchnąć śmiechem", ru: "расхохотаться" }
  - { pl: "pękać ze śmiechu", ru: "лопаться со смеху" }
  - { pl: "ze śmiechu", ru: "от смеха" }
family:
  - { pl: "śmiać się", ru: "смеяться", relation: root, id: smiac }
  - { pl: "śmieszny", ru: "смешной", relation: derived, id: smieszny }
  - { pl: "uśmiech", ru: "улыбка", relation: derived, id: usmiech }
etymology: "Из праславянского *směxъ — то же слово, что русский «смех», с закономерным смягчением начального s в ś и переходом ě в ie. От того же корня польские śmiać się и śmieszny, у нас «смеяться» и «смешной». Расхождение здесь чисто звуковое, значение совпадает полностью."
memory: "Звучит мягко: «сьмех», не «смех». И uśmiech — это «улыбка», а не «усмешка»."
idioms:
  - { pl: "pękać ze śmiechu", ru: "лопаться со смеху" }
  - { pl: "śmiech przez łzy", ru: "смех сквозь слёзы" }
