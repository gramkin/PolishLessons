notes:
  - { kind: usage, text: "Как и PIĘKNIE, это наречие, и потому у него три формы: ZABAWNIE, ZABAWNIEJ, NAJZABAWNIEJ. Склонения нет, сравнение есть. Схема та же самая: -IE переходит в -IEJ, превосходная степень берёт приставку NAJ-. Полезно держать эти два слова рядом именно потому, что они устроены одинаково: увидев в польском наречие на -IE, можно сразу построить все три формы, не заглядывая в таблицу. Исключения есть и они известны: DOBRZE даёт LEPIEJ, ŹLE даёт GORZEJ, DUŻO даёт WIĘCEJ — ровно как в русском «хорошо, лучше» и «много, больше»." }
  - { kind: false-friend, text: "Наречие прозрачно, а его гнездо расходится с русским, и расхождение частое. ZABAWNIE значит «забавно, смешно», от ZABAWNY «забавный», и это совпадает. Но само существительное ZABAWA значит не «забава», а «вечеринка, танцы»: ZABAWA SYLWESTROWA «новогодняя вечеринка», IŚĆ NA ZABAWĘ «идти на танцы». Русское «забава» в смысле развлечения по-польски будет ROZRYWKA. А ZABAWKA — это «игрушка», слово совсем обиходное. Так что из трёх слов одного гнезда совпадает по значению только прилагательное с наречием, а существительные разошлись." }
  - { kind: government, text: "Наречие: определяет глагол или целое предложение и ни с чем не согласуется. Сравнение через NIŻ с именительным: ZABAWNIEJ NIŻ W KSIĄŻCE. Безличные обороты обычны: BYŁO ZABAWNIE, WYSZŁO ZABAWNIE «вышло забавно». Очень частая конструкция ZABAWNIE SIĘ ZŁOŻYŁO значит «забавно вышло, так сложилось», и в ней SIĘ обязательно. Частотные сочетания: ZABAWNIE OPOWIADAĆ «забавно рассказывать», ZABAWNIE BRZMIEĆ «забавно звучать». Прилагательное ZABAWNY имеет полный набор форм, потому что качественное." }
  - { kind: pronunciation, text: "Читается «заба́вне», три слога, ударение на предпоследнем. Буква W между гласными звучит «в». Конечное -NIE даёт «не» с мягким н. В сравнительной степени ZABAWNIEJ слогов три, ударение остаётся на предпоследнем: «заба́вней». В превосходной NAJZABAWNIEJ слогов четыре, и ударение снова на предпоследнем: «найзаба́вней». Приставка NAJ- никогда не отделяется и не несёт собственного ударения." }
