etymology: "От ZABAWNY, а то — от ZABAWA, которое идёт от ZABAWIĆ, сложенного из ZA- и BAWIĆ «занимать, развлекать»; корень тот же, что в русском «бавить» в старом смысле «задерживать, проводить время», сохранившемся в «забава» и «прибавить» по другой линии. Польский развил у существительного значение общественного веселья, танцевального вечера, а русский оставил общее «развлечение», поэтому ZABAWA и «забава» — классическое расхождение в объёме. Наречие при этом значение сохранило: ZABAWNIE отвечает русскому «забавно» точно. Суффикс -IE образует наречия от прилагательных и соответствует русскому -О; степени сравнения строятся так же, как у всех наречий этого типа, с -IEJ и приставкой NAJ-."
memory: "Три формы, как у всякого наречия: zabawnie, zabawniej, najzabawniej. Наречие и прилагательное совпадают с русским, а существительные гнезда нет: zabawa — это «вечеринка, танцы», а не «забава» (та будет rozrywka), и zabawka — «игрушка». Частая конструкция zabawnie się złożyło «забавно вышло», с обязательным się. Исключения в степенях те же, что в русском: dobrze/lepiej, źle/gorzej."
idioms:
