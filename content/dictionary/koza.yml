notes:
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах Z смягчается: KOZIE, как в русском «козе». В родительном множественного O переходит в Ó: KÓZ. Козёл — KOZIOŁ, козлёнок — KOŹLĘ." }
  - { kind: false-friend, text: "Кроме животного, KOZA — маленькая железная печка, наша «буржуйка». А в обороте RAZ KOZIE ŚMIERĆ, буквально «один раз козе смерть», никакой козы нет: это «была не была», «семь бед — один ответ». PRZYSZŁA KOZA DO WOZA говорят о том, кто долго упрямился, а потом сам пришёл просить." }
  - { kind: government, text: "Козье молоко — KOZIE MLEKO, с прилагательным. Стадо коз — STADO KÓZ, родительный множественного. Доить козу — DOIĆ KOZĘ, винительный." }
  - { kind: pronunciation, text: "Читается «ко́за», два слога, ударение на первом. В форме KOZIE сочетание ZI даёт мягкое «з»: «ко́зе». Родительный множественного KÓZ звучит «кус»: Ó как «у», конечное Z оглушается." }
collocations:
  - { pl: "kozie mleko", ru: "козье молоко" }
  - { pl: "stado kóz", ru: "стадо коз" }
  - { pl: "doić kozę", ru: "доить козу" }
family:
  - { pl: "kozioł", ru: "козёл", relation: derived }
  - { pl: "koźlę", ru: "козлёнок", relation: derived }
  - { pl: "kozi", ru: "козий", relation: derived }
etymology: "Слово праславянское, общее с русским «коза». Значение «маленькая печка» польский развил сам, как русский дал печке своё прозвище, «буржуйка». Оборот RAZ KOZIE ŚMIERĆ старый и народный: «смерть бывает один раз», так что можно и рискнуть."
memory: "Koza — «коза», в родительном множественного kóz, «кус». Ещё koza — печка-буржуйка. Raz kozie śmierć — была не была. Przyszła koza do woza — сам пришёл на поклон. Козёл — kozioł, козлёнок — koźlę."
idioms:
  - { pl: "raz kozie śmierć", ru: "была не была; семь бед — один ответ" }
  - { pl: "przyszła koza do woza", ru: "сам пришёл на поклон" }
