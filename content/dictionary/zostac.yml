# review
id: zostac
format: 2
depth: deep
lemma: "zostać"
rank: 75
pos: verb
aspect: perf
pron: { cyr: "зо́стаць" }
senses:
  - id: become
    ru: "стать (кем-л.)"
    examples:
      - pl: "Chcę zostać pływaczką."
        ru: "Я хочу стать пловчихой."
        source: { kind: tatoeba, id: 2708765 }
      - pl: "Tom chce zostać pilotem."
        ru: "Том хочет стать пилотом."
        source: { kind: tatoeba, id: 529701 }
      - pl: "Została piosenkarką."
        ru: "Она стала певицей."
        source: { kind: tatoeba, id: 3460232 }
  - id: stay
    ru: "остаться"
    examples:
      - pl: "Można zostać jeszcze chwilę?"
        ru: "Можно остаться тут немножко подольше?"
        source: { kind: tatoeba, id: 350733 }
      - pl: "Ile zostało kanapek?"
        ru: "Сколько осталось бутербродов?"
        source: { kind: tatoeba, id: 349153 }
  - id: passive
    ru: "вспомогательный глагол страдательного залога"
    examples:
      - pl: "Dom został sprzedany."
        ru: "Дом был продан."
        source: { kind: authored }
      - pl: "List został wysłany wczoraj."
        ru: "Письмо было отправлено вчера."
        source: { kind: authored }
      - pl: "Zostanie to zrobione jutro."
        ru: "Это будет сделано завтра."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Значение «стать кем-то» требует творительного падежа: zostać lekarzem «стать врачом»." }
  - { kind: usage, text: "zostać + причастие образует страдательный залог: dom został sprzedany «дом был продан»." }
  - { kind: false-friend, text: "Различайте zostać и stać się: zostać lekarzem «стать врачом» — о профессии и роли, с творительным; stać się значит «случиться» или «сделаться» и с профессиями не употребляется." }
  - { kind: usage, text: "Страдательный залог с zostać описывает однократное действие (dom został sprzedany), а с być — состояние: dom jest sprzedany «дом продан»." }
collocations:
  - { pl: "zostać w domu", ru: "остаться дома" }
  - { pl: "zostać lekarzem", ru: "стать врачом" }
etymology: "Приставочное образование от stać «стоять» с приставкой zo- (из za-): исходно «застать, остаться стоять»; ср. русское «застать» и «остаться»."
memory: "Два значения расходятся по падежам: «стать кем-то» требует творительного — zostać lekarzem, а «остаться» идёт без дополнения — zostań w domu. И третья роль: zostać + причастие даёт страдательный залог, дословно «дом стал продан» — dom został sprzedany."
idioms:
  - { pl: "zostać w tyle", ru: "остаться позади" }
  - { pl: "zostać przy swoim", ru: "остаться при своём" }
  - { pl: "co zostało, to zostało", ru: "что осталось, то осталось" }
