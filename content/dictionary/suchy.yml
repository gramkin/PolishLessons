notes:
  - { kind: pronunciation, text: "МУЖСКО-ЛИЧНАЯ ФОРМА — SUSI, А НЕ «SUCHI». Перед окончанием -i заднеязычные смягчаются: ch переходит в s, и suchy даёт SUSI. По тому же правилу drogi даёт drodzy, wielki — wielcy, cichy — cisi, ubogi — ubodzy. Русское прилагательное такого чередования не знает вовсе: «сухие» годятся и для людей, и для дров. Эту форму надо выучить отдельно, догадаться по аналогии не выйдет." }
  - { kind: usage, text: "Сравнительная степень — SUCHSZY, с трудным стечением -chsz-. Произносится оно примерно «сухшы», и поляки нередко обходят его, говоря BARDZIEJ SUCHY. Превосходная строится обычно: NAJSUCHSZY. В мужско-личном множественном чередование держится и там: suchsi, najsuchsi." }
  - { kind: false-friend, text: "Прямое значение совпадает с русским полностью, но переносные расходятся. SUCHY CHLEB — это просто засохший хлеб; «чёрствый» в русском смысле будет CZERSTWY, а вот польское czerstwy о человеке значит «бодрый, крепкий». Зато идиома совпадает дословно: NIE ZOSTAWIĆ NA KIMŚ SUCHEJ NITKI — «не оставить на ком-л. сухой нитки», то есть разнести в пух и прах." }
collocations:
  - { pl: "suche drewno", ru: "сухие дрова" }
  - { pl: "suchy klimat", ru: "сухой климат" }
  - { pl: "suchy ton", ru: "сухой тон" }
family:
  - { pl: "suszyć", ru: "сушить", relation: root }
  - { pl: "susza", ru: "засуха", relation: root }
  - { pl: "mokry", ru: "мокрый", relation: antonym }
etymology: "Из праславянского *suxъ — то же слово, что русское «сухой». Корень виден в целом гнезде по обе стороны: польские suszyć, susza, wysuszyć и наши «сушить», «засуха», «высушить». Чередование ch/s в susi — не исключение, а след древнего смягчения перед -i, того же, что превратило «друг» в «друзья»."
memory: "Главное здесь одна форма: мужско-личное множественное — SUSI, не «suchi». Как drodzy от drogi и cisi от cichy. А сравнительная степень suchszy настолько неудобна, что чаще говорят bardziej suchy."
idioms:
  - { pl: "nie zostawić na kimś suchej nitki", ru: "не оставить на ком-л. сухой нитки, раскритиковать" }
  - { pl: "wyjść z czegoś suchą stopą", ru: "выйти сухим из воды" }
