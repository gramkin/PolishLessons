notes:
  - { kind: usage, text: "Степени сравнения у этого прилагательного образуются правильно, суффиксом: POPULARNY, POPULARNIEJSZY, NAJPOPULARNIEJSZY. Это стоит сопоставить с SZEROKI, у которого сравнительная степень неправильная и строится на укороченной основе, SZERSZY. Разница в том, какой класс: у слов на -NY суффикс -NIEJSZY прибавляется без изменений, у коротких исконных прилагательных вроде SZEROKI, WYSOKI, DALEKI основа усекается. Рядом с суффиксальной формой свободно живёт и описательная: BARDZIEJ POPULARNY, NAJBARDZIEJ POPULARNY, и в живой речи она даже обычнее, потому что длинное NAJPOPULARNIEJSZY выговорить труднее." }
  - { kind: pronunciation, text: "Читается «популя́рны», с ударением на предпоследнем слоге, то есть на LAR. Это класс -ALNY и -ARNY: там, где русский пишет «-ярный» с мягкостью, польский пишет -ARNY твёрдо, без мягкого знака и без й. Сравните ORYGINALNY и BRUTALNY с их «-альный». В превосходной степени NAJPOPULARNIEJSZY ударение стоит на предпоследнем слоге всего слова, «найпопулярне́йшы», и слово произносится одним куском, без паузы после NAJ." }
  - { kind: government, text: "У кого, среди кого популярен — предлог WŚRÓD с родительным или U с родительным: POPULARNY WŚRÓD MŁODZIEŻY, POPULARNY U CZYTELNIKÓW. Русский тут говорит «популярный среди молодёжи» и «популярный у читателей», так что оба оборота переносятся прямо. При сравнении — OD с родительным или NIŻ: POPULARNIEJSZY OD POPRZEDNIKA. Стать популярным — глагол STAĆ SIĘ с творительным: STAŁA SIĘ POPULARNA, где прилагательное согласуется, а не ставится в творительный." }
  - { kind: false-friend, text: "Значения совпадают в обоих смыслах, и прямой ловушки нет. Стоит лишь отметить, что второе значение, «общедоступный, для широкого читателя», в польском живее, чем в русском: WYDANIE POPULARNE, POPULARNY WYKŁAD, LITERATURA POPULARNONAUKOWA — последнее слово пишется слитно и отвечает русскому «научно-популярный», только части стоят в обратном порядке. Переставить их нельзя: POPULARNONAUKOWY, а не NAUKOWOPOPULARNY." }
