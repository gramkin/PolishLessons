etymology: "Из латинского POPULARIS «народный, принадлежащий народу», от POPULUS «народ». Отсюда же POPULACJA и английское PEOPLE. Значение «любимый многими» выросло из «народного»: то, что знает и принимает народ. Второе значение, «общедоступный», идёт от той же мысли с другой стороны: написанное так, чтобы понял всякий. Русское «популярный» заимствовано тем же путём через латынь и западные языки, поэтому оба значения совпадают. Суффикс -ARNY отвечает латинскому -ARIS и русскому «-ярный», как в REGULARNY и «регулярный»; мягкости, которую русский обозначает буквой я, в польском нет."
memory: "Степени правильные, суффиксом: popularny — popularniejszy — najpopularniejszy, в отличие от szeroki — szerszy с усечением основы. Класс -ARNY без мягкости: «популя́рны», не «популярный». Среди кого — wśród с родительным. И «научно-популярный» — popularnonaukowy, части в обратном порядке."
