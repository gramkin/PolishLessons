notes:
  - { kind: government, text: "Перпендикулярно ЧЕМУ-Л. — prostopadle DO czegoś, с родительным падежом после do. Русский берёт дательный: «перпендикулярно реке»." }
  - { kind: false-friend, text: "Из prosty «прямой» + padać «падать»: буквально «прямо падающий». Слова prosty и padać уже есть в словаре, так что разбирается оно насквозь." }
  - { kind: usage, text: "Прилагательное — prostopadły. Противоположность — równolegle «параллельно», от równy «ровный»." }
  - { kind: usage, text: "Геометрический термин; в корпусе наречие не встречается, примеры составлены вручную." }
collocations:
