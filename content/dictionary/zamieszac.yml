# review
id: zamieszac
format: 2
lemma: "zamieszać"
rank: 1683
pos: verb
pron: { cyr: "заме́шаць" }
senses:
  - id: stir
    ru: "размешать, помешать"
    examples:
      - pl: "Wlał do herbaty mleka i zamieszał."
        ru: "Он влил в чай молока и размешал."
        source: { kind: translated, id: 349142 }
      - pl: "Zamieszała czarną herbatę złotą łyżeczką."
        ru: "Она размешала чёрный чай золотой ложечкой."
        source: { kind: translated, id: 4134059 }
      - pl: "Zamieszaj tą filiżanką, by przynajmniej osad opadł."
        ru: "Размешай этой чашкой, чтобы хотя бы осадок осел."
        source: { kind: translated, id: 12935325 }
  - id: involved
    ru: "zamieszany — замешан (в чём-либо)"
    examples:
      - pl: "Ona jest chyba zamieszana w to morderstwo."
        ru: "Она, кажется, замешана в этом убийстве."
        source: { kind: translated, id: 840299 }
      - pl: "Mówi się, że był zamieszany w aferę."
        ru: "Говорят, он был замешан в афере."
        source: { kind: translated, id: 358019 }
      - pl: "Nigdy nie byłem zamieszany w ten skandal."
        ru: "Я никогда не был замешан в этом скандале."
        source: { kind: translated, id: 970508 }
  - id: commotion
    ru: "zamieszanie — суматоха, путаница"
    examples:
      - pl: "Co to za zamieszanie?"
        ru: "Что это за суматоха?"
        source: { kind: translated, id: 5211145 }
      - pl: "Nie rób zamieszania."
        ru: "Не создавай суматохи."
        source: { kind: translated, id: 8088740 }
      - pl: "Było trochę zamieszania z nazwiskami."
        ru: "Была небольшая путаница с фамилиями."
        source: { kind: translated, id: 921670 }
notes:
  - { kind: usage, text: "Сам глагол в прямом значении «размешать» в корпусе редок: почти вся частота приходится на причастие zamieszany «замешан» и на существительное zamieszanie «суматоха, путаница»." }
  - { kind: government, text: "«Замешан в чём-то» — zamieszany w coś, предлог w с винительным: zamieszany w aferę «замешан в афере»." }
  - { kind: false-friend, text: "Не путайте с zamieszkać «поселиться» — слово отличается одной буквой и значит совсем другое." }
  - { kind: usage, text: "Несовершенный вид — mieszać «мешать, размешивать»; оно же значит «смешивать» и «путать»." }
collocations:
  - { pl: "zamieszany w coś", ru: "замешан в чём-то" }
  - { pl: "robić zamieszanie", ru: "создавать суматоху" }
  - { pl: "zamieszać herbatę", ru: "размешать чай" }
etymology: "Приставка za- + mieszać «мешать», праславянское *měšati. Русское «замешать» и «замешан» — то же слово с той же приставкой, включая переносное «быть причастным»."
memory: "zamieszać = «размешать», но частотность держат не глагол, а причастие zamieszany «замешан в чём-то» (предлог w с винительным) и существительное zamieszanie «суматоха». И не путайте с zamieszkać «поселиться»."
idioms:
  - { pl: "zamieszany w coś", ru: "замешан в чём-то" }
  - { pl: "robić zamieszanie", ru: "создавать суматоху" }
  - { pl: "zamieszać herbatę", ru: "размешать чай" }
