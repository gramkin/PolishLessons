# review
id: kontynuowac
format: 2
lemma: "kontynuować"
rank: 1354
pos: verb
aspect: imperf
pron: { cyr: "контынуо́ваць" }
senses:
  - id: continue
    ru: "продолжать (начатое)"
    examples:
      - pl: "Kontynuować?"
        ru: "Продолжить?"
        source: { kind: tatoeba, id: 13782812 }
      - pl: "Proszę kontynuować."
        ru: "Продолжайте, пожалуйста."
        source: { kind: translated, id: 5659937 }
      - pl: "Kontynuował pracę pomimo zmęczenia."
        ru: "Он продолжал работу, несмотря на усталость."
        source: { kind: translated, id: 1349395 }
      - pl: "Kontynuuj!"
        ru: "Продолжай!"
        source: { kind: translated, id: 6160619 }
  - id: carry-on
    ru: "вести дальше, развивать (дело, исследование)"
    examples:
      - pl: "Kontynuował eksperyment."
        ru: "Он продолжил эксперимент."
        source: { kind: translated, id: 3377364 }
      - pl: "Armia kontynuuje swoją operację antyterrorystyczną."
        ru: "Армия продолжает свою антитеррористическую операцию."
        source: { kind: translated, id: 10115179 }
notes:
  - { kind: government, text: "kontynuować co (винительный): kontynuować pracę, naukę, rozmowę. Русское «продолжать» легко берёт инфинитив («продолжать читать»), а польский предпочитает отглагольное существительное: kontynuować czytanie." }
  - { kind: usage, text: "Глагол только несовершенного вида — пары на -ić у него нет. Совершенный смысл передают иначе: dokończyć «довести до конца», podjąć na nowo «возобновить»." }
  - { kind: usage, text: "Спряжение по образцу на -ować, с двойным u: kontynuuję, kontynuujesz, kontynuuje, kontynuujemy. Это не опечатка — сходится основа kontynuu- и окончание." }
  - { kind: false-friend, text: "Не путайте kontynuować «продолжать» с kontynent «континент»: слова созвучны, но родства между ними нет." }
collocations:
  - { pl: "kontynuować naukę", ru: "продолжать учёбу" }
  - { pl: "kontynuować pracę", ru: "продолжать работу" }
  - { pl: "kontynuować rozmowę", ru: "продолжать разговор" }
etymology: "Из латинского continuare «продолжать» (continuus «непрерывный»), заимствовано через французское continuer. В русском тот же латинский корень слышен в слове «континуум»."
memory: "kontynuować — «продолжать», из той же латыни, что «континуум». Вид только несовершенный. И помните про дополнение: по-русски «продолжать учиться», по-польски лучше kontynuować naukę — существительным."
idioms:
  - { pl: "ciąg dalszy nastąpi", ru: "продолжение следует" }
  - { pl: "kontynuować naukę", ru: "продолжать учёбу" }
  - { pl: "kontynuować dzieło", ru: "продолжать дело" }
