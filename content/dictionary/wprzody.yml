# review
id: wprzody
format: 2
lemma: "wprzódy"
rank: 5802
pos: adv
pron: { cyr: "фпшу́ды" }
senses:
  - id: first
    ru: "сперва, сначала"
    note: "книжное, устаревающее"
    examples:
      - pl: "Zanim odpowiesz, wprzódy się zastanów."
        ru: "Прежде чем ответить, сперва подумай."
        source: { kind: authored }
      - pl: "Wprzódy trzeba było zdobyć zaufanie króla."
        ru: "Сперва нужно было завоевать доверие короля."
        source: { kind: authored }
      - pl: "Musiał wprzódy uporządkować swoje sprawy."
        ru: "Ему нужно было сначала привести в порядок свои дела."
        source: { kind: authored }
  - id: before
    ru: "прежде, раньше"
    note: "книжное, устаревающее"
    examples:
      - pl: "Nigdy wprzódy nie widziałem takiego tłumu."
        ru: "Никогда прежде я не видел такой толпы."
        source: { kind: authored }
      - pl: "Był spokojniejszy niż wprzódy."
        ru: "Он был спокойнее, чем прежде."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово книжное и устаревающее, его встречают в классической литературе. В обычной речи вместо него NAJPIERW «сначала» или WCZEŚNIEJ, PRZEDTEM «раньше»." }
  - { kind: usage, text: "Как и русское «прежде», значит и «сперва», и «раньше». Обороты: NIGDY WPRZÓDY «никогда прежде», NIŻ WPRZÓDY «чем прежде». Короткий вариант — WPRZÓD." }
  - { kind: pronunciation, text: "Читается «фпшу́ды»: W перед глухим P оглушается в «ф», RZ после P — в «ш», Ó — «у». Ударение на PRZÓ-." }
collocations:
  - { pl: "nigdy wprzódy", ru: "никогда прежде" }
  - { pl: "niż wprzódy", ru: "чем прежде" }
  - { pl: "wprzódy się zastanów", ru: "сперва подумай" }
family:
  - { pl: "przód", ru: "перёд", relation: root, id: przod }
  - { pl: "przódy", ru: "прежде", relation: root, id: przody }
  - { pl: "wpierw", ru: "сперва", relation: root, id: wpierw }
  - { pl: "naprzód", ru: "вперёд", relation: root, id: naprzod }
etymology: "W + PRZÓDY «прежде», от PRZÓD «перёд»: буквально «вперёд по времени». Тот же корень, что в русских «перёд» и «прежде»."
memory: "wprzódy — «впереди по времени», то есть сперва: Wprzódy pomyśl, potem mów."
idioms:
  - { pl: "nigdy wprzódy", ru: "никогда прежде, никогда раньше" }
formExamples:
  - form: "wprzódy"
    pl: "Wprzódy obejrzyj dom, a dopiero potem go kup."
    ru: "Сперва осмотри дом, а уж потом покупай."
    source: { kind: authored }
  - form: "wprzódy"
    pl: "Goście musieli wprzódy przywitać gospodarza."
    ru: "Гостям нужно было сперва поприветствовать хозяина."
    source: { kind: authored }
  - form: "wprzódy"
    pl: "Taka bieda nie zdarzała się tu nigdy wprzódy."
    ru: "Такой нищеты здесь никогда прежде не случалось."
    source: { kind: authored }
