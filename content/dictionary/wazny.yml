# review
id: wazny
format: 2
lemma: "ważny"
rank: 250
pos: adj
pron: { cyr: "ва́жны" }
senses:
  - id: important
    ru: "важный, значительный"
    examples:
      - pl: "To jest dla mnie bardzo ważne."
        ru: "Это для меня очень важно."
        source: { kind: tatoeba, id: 6972338 }
      - pl: "Ważne jest, by jeździć ostrożnie."
        ru: "Важно водить автомобиль аккуратно."
        source: { kind: tatoeba, id: 368080 }
      - pl: "Mam do ciebie jedno ważne pytanie."
        ru: "У меня к тебе есть один важный вопрос."
        source: { kind: tatoeba, id: 13785902 }
  - id: valid
    ru: "действительный, годный (о документе)"
    note: "Это значение в русском «важный» отсутствует: bilet ważny «билет действителен»."
    examples:
      - pl: "Jak długo ważny jest ten bilet?"
        ru: "Как долго действителен этот билет?"
        source: { kind: tatoeba, id: 766090 }
      - pl: "To jest dużo ważniejsze."
        ru: "Это намного важнее."
        source: { kind: tatoeba, id: 4716902 }
      - pl: "Dla mnie tylko to jest ważne."
        ru: "Для меня только это имеет значение."
        source: { kind: tatoeba, id: 10748875 }
notes:
  - { kind: false-friend, text: "ważny значит не только «важный», но и «действительный, годный»: Bilet jest ważny do jutra «Билет действителен до завтра». Просроченный документ — nieważny." }
  - { kind: usage, text: "Корень — waga «вес»: важное то, что весит. Отсюда и ważyć «весить, взвешивать»." }
  - { kind: usage, text: "Степени сравнения: ważny — ważniejszy — najważniejszy." }
collocations:
  - { pl: "ważna sprawa", ru: "важное дело" }
  - { pl: "ważny powód", ru: "важная причина" }
  - { pl: "bilet jest ważny", ru: "билет действителен" }
  - { pl: "co najważniejsze", ru: "что самое важное" }
etymology: "От waga «вес» (через немецкое Waage); ср. русское «важный», которое тоже идёт от «вага» — веса. Важное — то, что весит."
memory: "ważny — «важный», но ещё и «действительный»: Bilet jest ważny do jutra. Просроченное — nieważny. Корень waga «вес»: важно то, что весит."
idioms:
  - { pl: "ważna sprawa", ru: "важное дело" }
  - { pl: "bilet ważny do", ru: "билет действителен до" }
  - { pl: "co najważniejsze", ru: "что самое важное" }
