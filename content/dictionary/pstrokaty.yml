synonyms: ["różnokolorowy", "kolorowy", "wielobarwny"]
etymology: "Этимологи расходятся: одни выводят слово из SROKATY «пёстрый, как сорока» (от SROKA «сорока»), другие из STROKATY. Начальное P- появилось под влиянием близкого по смыслу PSTRY «пёстрый»."
memory: "Pstrokaty — «пёстрый, как сорока»: в слове прячется sroka «сорока», а начало подсказывает pstry «пёстрый». Звучит чаще с укором: аляповатый. Нейтральное «разноцветный» — kolorowy."
idioms:
