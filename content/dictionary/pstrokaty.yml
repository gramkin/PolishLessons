notes:
  - { kind: false-friend, text: "Русское «пёстрый» нейтрально, а польское PSTROKATY чаще звучит с неодобрением: слишком много ярких красок, «аляповатый», «кричащий». PSTROKATY KRAWAT — галстук, от которого рябит в глазах. Нейтрально о разноцветном говорят KOLOROWY или WIELOBARWNY. Близкое по звуку PSTRY значит то же «пёстрый», но звучит книжно и живёт в обороте PSTRO W GŁOWIE «ветер в голове»." }
  - { kind: pronunciation, text: "Читается «пстрока́ты», ударение на предпоследнем слоге. Начальное сочетание PSTR произносится целиком, без вставного гласного: не «пестрокаты». Мужско-личное множественное число меняет T на C: PSTROKACI KLAUNI «пёстрые клоуны», читается «пстрока́ци»." }
  - { kind: usage, text: "Синтетических степеней сравнения в таблице нет, поэтому в карточке одиннадцать форм. Сравнивают описательно: BARDZIEJ PSTROKATY «более пёстрый», NAJBARDZIEJ PSTROKATY «самый пёстрый». В переносном значении слово описывает смешанный состав: PSTROKATE TOWARZYSTWO «разношёрстная компания»." }
