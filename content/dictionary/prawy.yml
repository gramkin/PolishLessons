# review
id: prawy
format: 2
lemma: "prawy"
rank: 1287
pos: adj
pron: { cyr: "пра́вы" }
senses:
  - id: right-side
    ru: "правый (сторона тела, предмета)"
    examples:
      - pl: "Podnieś prawą rękę."
        ru: "Подними правую руку."
        source: { kind: translated, id: 361721 }
      - pl: "Boli mnie prawe oko."
        ru: "У меня болит правый глаз."
        source: { kind: translated, id: 13034442 }
      - pl: "Prawy brzeg rzeki jest stromy."
        ru: "Правый берег реки крутой."
        source: { kind: translated, id: 12268699 }
  - id: on-the-right
    ru: "po prawej — справа, с правой стороны"
    examples:
      - pl: "Trzecia ulica po prawej."
        ru: "Третья улица справа."
        source: { kind: translated, id: 2246950 }
      - pl: "Most jest po prawej stronie."
        ru: "Мост справа."
        source: { kind: translated, id: 11343456 }
      - pl: "Zostań po prawej stronie."
        ru: "Держись правой стороны."
        source: { kind: translated, id: 8774009 }
  - id: right-hand
    ru: "prawa ręka — правая рука, ближайший помощник"
    examples:
      - pl: "Bądź moją prawą ręką."
        ru: "Будь моей правой рукой."
        source: { kind: tatoeba, id: 2408325 }
      - pl: "On jest moją prawą ręką."
        ru: "Он моя правая рука."
        source: { kind: tatoeba, id: 13731633 }
      - pl: "Tom je lewą ręką, ale pisze prawą."
        ru: "Том ест левой рукой, но пишет правой."
        source: { kind: tatoeba, id: 1846157 }
notes:
  - { kind: usage, text: "Форма prawsi оставлена без примеров: простой сравнительной степени у prawy нет. В значении «правый, с правой стороны» сравнение невозможно по смыслу, а в значении «честный, порядочный» говорят bardziej prawy. Живая мужско-личная форма — prawi: prawi ludzie «порядочные люди»." }
  - { kind: false-friend, text: "Главная ловушка: формы praw и prawa почти всегда принадлежат существительному prawo «право, закон» (карточка есть): przestrzegać praw «соблюдать законы», nie ma prawa «не имеет права». Прилагательное надёжно узнаётся в формах prawą, prawe, prawej, prawym." }
  - { kind: usage, text: "po prawej stronie «с правой стороны, справа» — самый частый оборот. Антоним — lewy «левый»." }
  - { kind: usage, text: "Второе значение — «честный, порядочный»: prawy człowiek «порядочный человек». Третье — политическое «правый»." }
  - { kind: usage, text: "Prawa ręka значит и «правая рука» буквально, и «ближайший помощник» — ровно как в русском." }
collocations:
  - { pl: "prawa ręka", ru: "правая рука" }
  - { pl: "po prawej stronie", ru: "справа" }
  - { pl: "prawe oko", ru: "правый глаз" }
  - { pl: "prawy człowiek", ru: "порядочный человек" }
etymology: "Праславянское *pravъ «прямой, правильный» — то же слово, что русское «правый». Отсюда же prawo «право» и prawda «правда»."
memory: "prawy — «правый». Главная ловушка: формы praw и prawa обычно принадлежат существительному prawo «закон», а не этому прилагательному. Надёжные формы — prawą, prawe, prawej, prawym. И prawa ręka значит «правая рука» в обоих смыслах."
idioms:
  - { pl: "prawa ręka", ru: "правая рука" }
  - { pl: "po prawej stronie", ru: "справа" }
  - { pl: "prawy człowiek", ru: "порядочный человек" }
