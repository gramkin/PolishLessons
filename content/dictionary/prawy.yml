formExamples:
  - form: "prawą"
    pl: "Podnieś prawą rękę."
    ru: "Подними правую руку."
    source: { kind: translated, id: 361721 }
  - form: "prawą"
    pl: "Bądź moją prawą ręką."
    ru: "Будь моей правой рукой."
    source: { kind: tatoeba, id: 2408325 }
  - form: "prawą"
    pl: "On jest moją prawą ręką."
    ru: "Он моя правая рука."
    source: { kind: tatoeba, id: 13731633 }
  - form: "prawą"
    pl: "Tom je lewą ręką, ale pisze prawą."
    ru: "Том ест левой рукой, но пишет правой."
    source: { kind: tatoeba, id: 1846157 }
  - form: "prawe"
    pl: "Boli mnie prawe oko."
    ru: "У меня болит правый глаз."
    source: { kind: translated, id: 13034442 }
  - form: "prawe"
    pl: "Boli mnie prawe ramię."
    ru: "У меня болит правое плечо."
    source: { kind: translated, id: 3376900 }
  - form: "prawe"
    pl: "Tom złamał prawe ramię."
    ru: "Том сломал правую руку."
    source: { kind: translated, id: 8948446 }
  - form: "prawe"
    pl: "Jestem ślepy na prawe oko."
    ru: "Я слеп на правый глаз."
    source: { kind: tatoeba, id: 6154830 }
  - form: "prawego"
    pl: "Brakuje jej prawego buta."
    ru: "Ей не хватает правого ботинка."
    source: { kind: translated, id: 10458869 }
  - form: "prawego"
    pl: "Człeka prawego i złoczyńcy nie poznasz po opończy."
    ru: "Порядочного человека и злодея по плащу не узнаешь."
    source: { kind: translated, id: 359261 }
  - form: "prawego"
    pl: "Nie czuję prawego ramienia."
    ru: "Я не чувствую правого плеча."
    source: { kind: authored }
  - form: "prawej"
    pl: "Trzecia ulica po prawej."
    ru: "Третья улица справа."
    source: { kind: translated, id: 2246950 }
  - form: "prawej"
    pl: "Zostań po prawej stronie."
    ru: "Держись правой стороны."
    source: { kind: translated, id: 8774009 }
  - form: "prawej"
    pl: "Most jest po prawej stronie."
    ru: "Мост справа."
    source: { kind: translated, id: 11343456 }
  - form: "prawej"
    pl: "Budynek po prawej jest szkołą."
    ru: "Здание справа — это школа."
    source: { kind: translated, id: 3125764 }
  - form: "prawemu"
    pl: "Przyjrzyj się prawemu skrzydłu budynku."
    ru: "Присмотрись к правому крылу здания."
    source: { kind: authored }
  - form: "prawemu"
    pl: "Dzięki prawemu pasowi jedziemy szybciej."
    ru: "Благодаря правой полосе мы едем быстрее."
    source: { kind: authored }
  - form: "prawemu"
    pl: "Prawemu oku nic nie dolega."
    ru: "С правым глазом всё в порядке."
    source: { kind: authored }
  - form: "prawi"
    pl: "Prawi ludzie nie kłamią."
    ru: "Порядочные люди не лгут."
    source: { kind: authored }
  - form: "prawi"
    pl: "Byli to ludzie prawi i uczciwi."
    ru: "Это были люди порядочные и честные."
    source: { kind: authored }
  - form: "prawi"
    pl: "Prawi obywatele płacą podatki."
    ru: "Порядочные граждане платят налоги."
    source: { kind: authored }
  - form: "prawy"
    pl: "Prawy brzeg rzeki jest stromy."
    ru: "Правый берег реки крутой."
    source: { kind: translated, id: 12268699 }
  - form: "prawy"
    pl: "Boli mnie górny prawy ząb mądrości."
    ru: "У меня болит верхний правый зуб мудрости."
    source: { kind: translated, id: 925747 }
  - form: "prawy"
    pl: "Prawy but jest za ciasny."
    ru: "Правый ботинок слишком тесный."
    source: { kind: authored }
  - form: "prawych"
    pl: "W prawych kieszeniach nic nie było."
    ru: "В правых карманах ничего не было."
    source: { kind: authored }
  - form: "prawych"
    pl: "Wśród prawych ludzi czuje się dobrze."
    ru: "Среди порядочных людей ему хорошо."
    source: { kind: authored }
  - form: "prawych"
    pl: "Trzymaj się prawych pasów."
    ru: "Держись правых полос."
    source: { kind: authored }
  - form: "prawym"
    pl: "Masz komara na prawym przedramieniu."
    ru: "У тебя комар на правом предплечье."
    source: { kind: translated, id: 10475301 }
  - form: "prawym"
    pl: "Tom miał wytatuowanego orła na prawym ramieniu."
    ru: "У Тома был вытатуирован орёл на правом плече."
    source: { kind: translated, id: 3671772 }
  - form: "prawym"
    pl: "Sześć miesięcy temu miałem operację zaćmy w prawym oku."
    ru: "Полгода назад мне сделали операцию по поводу катаракты на правом глазу."
    source: { kind: translated, id: 3044940 }
  - form: "prawymi"
    pl: "Poruszał prawymi palcami z trudem."
    ru: "Он с трудом шевелил пальцами правой руки."
    source: { kind: authored }
  - form: "prawymi"
    pl: "Otoczony prawymi ludźmi, czuł się bezpiecznie."
    ru: "Окружённый порядочными людьми, он чувствовал себя спокойно."
    source: { kind: authored }
  - form: "prawymi"
    pl: "Między prawymi a lewymi drzwiami jest przejście."
    ru: "Между правой и левой дверью есть проход."
    source: { kind: authored }
