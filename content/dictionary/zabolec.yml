# review
id: zabolec
format: 2
lemma: "zaboleć"
rank: 5074
pos: verb
pron: { cyr: "забо́лець" }
senses:
  - id: start-hurting
    ru: "заболеть (о части тела), начать болеть"
    examples:
      - pl: "Zabolała mnie głowa."
        ru: "У меня заболела голова."
        source: { kind: authored }
      - pl: "Po biegu zabolały mnie nogi."
        ru: "После бега у меня заболели ноги."
        source: { kind: authored }
      - pl: "Jak zjesz tyle cukierków, zaboli cię brzuch."
        ru: "Если съешь столько конфет, у тебя заболит живот."
        source: { kind: authored }
  - id: hurt-feelings
    ru: "задеть, ранить (о словах, поступках)"
    examples:
      - pl: "Jego słowa bardzo mnie zabolały."
        ru: "Его слова меня очень задели."
        source: { kind: authored }
      - pl: "Zabolało ją, że nikt nie zadzwonił."
        ru: "Её задело, что никто не позвонил."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZABOLEĆ — «заболеть» только о боли в части тела: ZABOLAŁ MNIE ZĄB «у меня заболел зуб». «Заболеть» в смысле «захворать» по-польски ZACHOROWAĆ: ZACHOROWAŁ NA GRYPĘ «он заболел гриппом». Перепутать их — типичная ошибка." }
  - { kind: usage, text: "Совершенный вид. Подлежащее — то, что болит, поэтому живые формы почти только в третьем лице: ZABOLI, ZABOLAŁ, ZABOLAŁA, ZABOLAŁO. Остальные формы в карточку не включены. Несовершенный вид — BOLEĆ." }
  - { kind: government, text: "Кого — винительный: ZABOLAŁA MNIE GŁOWA «у меня заболела голова». Русское «у меня» передаётся винительным MNIE, а не родительным. Безлично о чувствах — ZABOLAŁO MNIE, ŻE «меня задело, что»." }
  - { kind: pronunciation, text: "Читается «забо́лець»: ударение на предпоследнем слоге, конечное Ć — «ць». ZABOLAŁ — «забо́лау», ZABOLI — «забо́ли»." }
  - { kind: register, text: "Нейтральное бытовое слово. В переносном смысле — разговорное и эмоциональное: TO MNIE ZABOLAŁO «это меня задело»." }
collocations:
  - { pl: "zabolała mnie głowa", ru: "у меня заболела голова" }
  - { pl: "zabolało mnie serce", ru: "у меня сжалось сердце" }
  - { pl: "to zaboli", ru: "будет больно" }
family:
  - { pl: "boleć", ru: "болеть", relation: aspect, id: bolec }
  - { pl: "ból", ru: "боль", relation: root, id: bol }
  - { pl: "zachorować", ru: "заболеть (захворать)", relation: root }
etymology: "Приставка ZA- «начать» плюс BOLEĆ «болеть», праславянское *bolěti. Русское «заболеть» — то же слово, но польский оставил за ним только значение боли."
memory: "Zaboleć — заболеть о боли: zabolała mnie głowa. Заболеть гриппом — zachorować! У меня — mnie, винительный."
idioms:
  - { pl: "serce zabolało", ru: "сердце сжалось (от жалости, обиды)" }
