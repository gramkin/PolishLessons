  - id: fortune-smiles
    ru: "улыбаться (о судьбе, удаче)"
    examples:
      - pl: "Szczęście zaczęło się do nich uśmiechać."
        ru: "Счастье начало им улыбаться."
        source: { kind: authored }
notes:
  - { kind: government, text: "УЛЫБАЮТСЯ НЕ «КОМУ», А «К КОМУ»: DO KOGOŚ С РОДИТЕЛЬНЫМ. Русское «улыбаться матери» требует дательного, польское — предлога do: uśmiechać się DO matki, do dziecka, do nieznajomego. Дательный тут невозможен, и ошибка эта очень устойчива. ОТЧЕГО улыбаются — z с родительным: uśmiechać się z zadowolenia." }
  - { kind: false-friend, text: "РУССКОЕ «УСМЕХАТЬСЯ» СМЕСТИЛОСЬ В НАСМЕШКУ, ПОЛЬСКОЕ — НЕТ. Uśmiechać się значит просто «УЛЫБАТЬСЯ», нейтрально и доброжелательно; это обычное слово для улыбки. Русское «усмехаться» означает ухмыльнуться, улыбнуться криво. Переводить польское слово надо через «улыбаться», иначе каждая приветливая улыбка превратится в ухмылку." }
  - { kind: usage, text: "ГЛАГОЛ ЖИВЁТ ТОЛЬКО С SIĘ — ОТСЮДА И КОРОТКАЯ ТАБЛИЦА. Сказать «uśmiechać kogoś» нельзя, поэтому страдательных причастий у него нет вовсе: пятьдесят две формы вместо обычных шестидесяти трёх. Вид несовершенный, совершенная пара — uśmiechnąć się «улыбнуться». Существительное uśmiech «улыбка»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: u-śmie-CHAĆ. Ś звучит как щ, ch как х: «ущмеха́ць». Корень тот же, что в śmiech «смех» и śmiać się «смеяться», то есть улыбка по-польски — это маленький смех." }
collocations:
  - { pl: "uśmiechać się do kogoś", ru: "улыбаться кому-л." }
  - { pl: "uśmiechać się pod nosem", ru: "ухмыляться про себя" }
  - { pl: "szczęście się uśmiecha", ru: "счастье улыбается" }
family:
  - { pl: "uśmiech", ru: "улыбка", relation: derived, id: usmiech }
  - { pl: "śmiech", ru: "смех", relation: root }
  - { pl: "śmiać się", ru: "смеяться", relation: root, id: smiac }
  - { pl: "uśmiechnąć się", ru: "улыбнуться", relation: aspect }
etymology: "Приставка u- плюс śmiech «смех», из праславянского *směxъ — того же слова, что русский «смех». Улыбка названа уменьшенным смехом: u- здесь ослабляет. Русский построил «улыбку» на другом корне, от «лыбиться», а «усмехаться» оставил при насмешке. Отсюда uśmiech, uśmiechnięty «улыбающийся», śmieszny."
memory: "uśmiechać się — «УЛЫБАТЬСЯ», нейтрально, а не «усмехаться»: русское слово ушло в насмешку. Корень śmiech «смех»: улыбка это маленький смех. И предлог особый: uśmiechać się DO kogoś, с родительным, а не дательным."
idioms:
  - { pl: "uśmiechać się do kogoś", ru: "улыбаться кому-л." }
  - { pl: "szczęście się do kogoś uśmiecha", ru: "удача улыбается кому-л." }
