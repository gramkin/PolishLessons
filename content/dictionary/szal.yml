etymology: "Из праславянского *šalъ «безумный, буйный», и русские «шалый», «ошалеть», «шалеть», «шалить» — его прямые родственники. Корень был общим, и значение у него было сильное: не озорство, а потеря рассудка. Русский со временем ослабил его до «шалости» и «шалуна», оставив прежнюю силу только в «ошалеть» и в диалектном «шалый». Польский силу сохранил: SZAŁ есть именно исступление, а SZALONY — безумный. Поэтому ряд соответствий получается перекрёстный: русское «шалить» по-польски будет DOKAZYWAĆ или PSOCIĆ, а польское SZALEĆ по-русски — «буйствовать, сходить с ума». Отдельно стоит слово SZAL «шаль», которое к этому корню отношения не имеет: оно пришло из персидского через французский, как и русская «шаль»."
memory: "Не «шаль»! szał с ł — это ярость, читается «шау»; шаль — szal с обычным l, «шаль», другое слово из персидского. Русская родня у szał есть: «шалый», «ошалеть», «шалеть» — корень *šalъ, и польский сохранил полную силу значения. Wpaść w szał «впасть в ярость», w szale «в исступлении». В местном ł переходит в мягкое l: szale, как regule."
