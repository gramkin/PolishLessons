notes:
  - { kind: false-friend, text: "Две ловушки сразу, и обе на одном звуке. Первая: SZAŁ — это не «шаль». Шаль, платок на плечи, по-польски SZAL, с обычным L, и это другое слово, мужского рода; SZAŁ, с Ł, значит ярость. На письме разница в одной букве, на слух — в одном звуке: SZAL звучит «шаль», SZAŁ звучит «шау». Вторая ловушка в том, что русский родственник у SZAŁ есть, но неочевидный: это «шалый», «шалеть», «ошалеть», «шалить». Все они от того же корня, и значение «буйство, неистовство» в них сохранилось. Так что SZAŁ переводится не «шалость», а именно «ярость, исступление»." }
  - { kind: pronunciation, text: "Читается «шау», один слог. Буква Ł даёт «у», поэтому на конце не «л» и не мягкое «ль», а краткое «у»: «шау». Это важно именно здесь, потому что слово SZAL со обычным L произносится «шаль» и значит совсем другое. В местном падеже SZALE буква Ł переходит в мягкое L и звучит «шале» — то же чередование, что в REGULE и SZKLE. Поэтому W SZALE «в ярости» и SZAL «шаль» в произношении оказываются обманчиво близки, и различает их только контекст." }
  - { kind: usage, text: "Самые частые конструкции — WPAŚĆ W SZAŁ «впасть в ярость», с винительным после W, и W SZALE «в ярости, в исступлении», с местным. Во втором значении слово описывает повальное увлечение, и тут оно совершенно обиходно: SZAŁ ZAKUPÓW «покупательский бум», SZAŁ REMONTOWY. Прилагательное SZALONY значит «безумный, сумасшедший» и употребляется и всерьёз, и в похвалу: SZALONY POMYSŁ «безумная идея». Глагол SZALEĆ — «буйствовать, сходить с ума», и о погоде: BURZA SZALEJE NAD MIASTEM «гроза буйствует над городом»." }
  - { kind: register, text: "Слово выразительное, но не грубое, и годится и для разговора, и для прозы. В медицинском или юридическом тексте вместо него возьмут SZAŁ только в устойчивом SZAŁ ZABÓJCZY или напишут нейтральнее: AFEKT, SILNE WZBURZENIE. В разговоре частотнее глагол и прилагательное, чем само существительное: ON OSZALAŁ «он с ума сошёл» услышишь чаще, чем ON WPADŁ W SZAŁ. Русское «шалеть» и «ошалеть» сохраняют ту же выразительность, так что по регистру языки тут совпадают." }
