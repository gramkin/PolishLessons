# review
id: nadal
format: 2
lemma: "nadal"
rank: 276
pos: adv
pron: { cyr: "на́даль" }
senses:
  - id: still
    ru: "всё ещё, по-прежнему"
    examples:
      - pl: "Nadal szukam Toma."
        ru: "Я всё ещё ищу Тома."
        source: { kind: tatoeba, id: 3718696 }
      - pl: "Oni nadal są w środku."
        ru: "Они всё ещё внутри."
        source: { kind: tatoeba, id: 10155188 }
      - pl: "Czy twój wujek nadal jest zagranicą?"
        ru: "Твой дядя всё ещё за границей?"
        source: { kind: tatoeba, id: 3427709 }
  - id: still-statement
    ru: "всё ещё (в утверждениях о длящемся)"
    examples:
      - pl: "Na tej wyspie nadal mieszka kilka dzikich plemion."
        ru: "На этом острове всё ещё живёт несколько диких племён."
        source: { kind: tatoeba, id: 3656769 }
      - pl: "Nadal go kocham."
        ru: "Я всё ещё его люблю."
        source: { kind: authored }
      - pl: "Sklep nadal jest zamknięty."
        ru: "Магазин всё ещё закрыт."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Синонимы — wciąż и ciągle: Nadal czekam = Wciąż czekam «Я всё ещё жду»." }
  - { kind: usage, text: "nadal относится к длящемуся состоянию и ставится обычно перед сказуемым: Nadal tu mieszka." }
  - { kind: false-friend, text: "Не связано с русским «надолго»: «надолго» по-польски na długo." }
collocations:
