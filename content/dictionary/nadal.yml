  - { pl: "nadal nie wiem", ru: "я всё ещё не знаю" }
  - { pl: "nadal trwa", ru: "всё ещё продолжается" }
  - { pl: "nadal ten sam", ru: "всё тот же" }
etymology: "Из na + dal «даль» — буквально «на дальнейшее», то есть «впредь, по-прежнему»."
memory: "nadal — «всё ещё, по-прежнему»: Nadal szukam «Я всё ещё ищу». Буквально «на даль», то есть дальше, впредь. Синонимы — wciąż, ciągle."
