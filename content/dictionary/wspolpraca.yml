notes:
  - { kind: false-friend, text: "ПРИСТАВКА WSPÓŁ- РАВНА РУССКОЙ СО-, И ЭТО КЛЮЧ К ЦЕЛОМУ КЛАССУ СЛОВ. Współpraca это «со-трудничество», współautor «соавтор», współczesny «современный», współlokator «сосед по квартире», współczuć «сочувствовать». Узнав одну приставку, читаешь сразу десятки слов. Пишется ó, читается у: «фспу́у-»." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: współ-PRA-ca. Начальное w перед глухим s оглушается до ф, ó читается как у, а ł — как краткое у: «фспу́упраца». Родительный, дательный и предложный совпадают: współpracy." }
  - { kind: usage, text: "Предлог при этом слове — z с творительным: współpraca z kimś, nawiązać współpracę z firmą. Прилагательное współpracujący, глагол współpracować. Отрицательный оттенок появляется только в историческом контексте: współpraca z okupantem значит коллаборационизм." }
  - { kind: register, text: "Слово делового и официального языка: umowa o współpracy, nawiązać współpracę, zakończyć współpracę. В дружеской речи вместо него скажут проще: robimy to razem. Множественное współprace встречается редко, в отчётах о нескольких проектах." }
collocations:
  - { pl: "nawiązać współpracę", ru: "наладить сотрудничество" }
  - { pl: "we współpracy z", ru: "в сотрудничестве с" }
  - { pl: "owocna współpraca", ru: "плодотворное сотрудничество" }
family:
  - { pl: "współpracować", ru: "сотрудничать", relation: derived, id: wspolpracowac }
  - { pl: "praca", ru: "работа", relation: root, id: praca }
  - { pl: "współautor", ru: "соавтор", relation: derived }
etymology: "Приставка współ- «со-, вместе» плюс praca «работа». Współ- восходит к предлогу z и слову pół, буквально «вполовину с кем-то»; по смыслу она точно равна русской со-. А само praca живого русского соответствия не имеет: русские «работа» (от «раб») и «труд» — другие корни. Отсюда współpracować, współautor, współczesny."
memory: "współpraca — «сотрудничество», и разбирается оно по частям: współ- равно русскому со-, praca «работа». Эта приставка открывает целый ряд: współautor «соавтор», współczesny «современный», współczuć «сочувствовать»."
idioms:
  - { pl: "nawiązać współpracę", ru: "наладить сотрудничество" }
  - { pl: "we współpracy z kimś", ru: "в сотрудничестве с кем-л." }
