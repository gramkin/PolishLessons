# review
id: wielki
format: 2
lemma: "wielki"
rank: 154
pos: adj
pron: { cyr: "ве́льки" }
senses:
  - id: big
    ru: "большой, огромный"
    examples:
      - pl: "Ale wielka ciężarówka!"
        ru: "Какой большой грузовик!"
        source: { kind: tatoeba, id: 2972814 }
      - pl: "To jest wielki problem."
        ru: "Это большая проблема."
        source: { kind: tatoeba, id: 5014760 }
      - pl: "Foki mają wielkie oczy."
        ru: "У тюленей большие глаза."
        source: { kind: tatoeba, id: 3778088 }
  - id: great
    ru: "великий, выдающийся"
    examples:
      - pl: "Nie jestem wielkim podróżnikiem."
        ru: "Во мне нет тяги к путешествиям."
        source: { kind: tatoeba, id: 349060 }
      - pl: "To wielki artysta."
        ru: "Это великий художник."
        source: { kind: authored }
      - pl: "Mickiewicz był wielkim poetą."
        ru: "Мицкевич был великим поэтом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "duży и wielki оба значат «большой», но wielki добавляет оттенок значимости: wielki człowiek «великий человек», duży dom «большой дом»." }
  - { kind: usage, text: "Степень сравнения у них общая: większy, największy — и для duży, и для wielki." }
  - { kind: usage, text: "wielkie litery — «заглавные буквы»; Wielkanoc — «Пасха» (буквально «великая ночь»)." }
collocations:
  - { pl: "wielki człowiek", ru: "великий человек" }
  - { pl: "wielkie litery", ru: "заглавные буквы" }
  - { pl: "wielka szkoda", ru: "очень жаль" }
  - { pl: "w wielkim skrócie", ru: "вкратце" }
etymology: "Праславянское *velikъ — то же слово, что русское «великий»; в польском оно значит и «большой», и «великий»."
memory: "duży и wielki оба «большой», но степень сравнения у них одна: większy, największy. wielki чаще о значимости: wielki człowiek «великий человек», wielkie litery «заглавные буквы»."
idioms:
  - { pl: "od wielkiego dzwonu", ru: "по большим праздникам, очень редко" }
  - { pl: "wielkie halo", ru: "много шума из ничего" }
  - { pl: "wielki świat", ru: "высший свет" }
