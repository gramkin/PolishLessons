# review
id: zapamietac
format: 2
lemma: "zapamiętać"
rank: 1470
pos: verb
aspect: perf
pron: { cyr: "запаме́нтаць" }
senses:
  - id: memorise
    ru: "запомнить"
    examples:
      - pl: "Musisz to zapamiętać."
        ru: "Ты должен это запомнить."
        source: { kind: translated, id: 13069694 }
      - pl: "Powinieneś to zapamiętać."
        ru: "Тебе следует это запомнить."
        source: { kind: translated, id: 12062097 }
      - pl: "Zapamiętaj sobie te zasady."
        ru: "Запомните эти правила."
        source: { kind: tatoeba, id: 521491 }
      - pl: "Chciałbym zapamiętać nazwisko Toma."
        ru: "Я хотел бы запомнить фамилию Тома."
        source: { kind: translated, id: 3931542 }
      - pl: "Jeszcze nie zapamiętałem jej adresu."
        ru: "Я ещё не запомнил её адрес."
        source: { kind: translated, id: 359760 }
      - pl: "Nie wiem, czy zapamiętam tak długie hasło."
        ru: "Не знаю, запомню ли я такой длинный пароль."
        source: { kind: translated, id: 1455873 }
  - id: remember-imperative
    ru: "запомни, имей в виду"
    examples:
      - pl: "Zapamiętaj!"
        ru: "Запомни!"
        source: { kind: translated, id: 10465044 }
      - pl: "Zapamiętaj mnie."
        ru: "Запомни меня."
        source: { kind: translated, id: 11412327 }
      - pl: "Zapamiętaj to sobie."
        ru: "Запомни это себе."
        source: { kind: translated, id: 930431 }
  - id: be-remembered
    ru: "быть запомненным, остаться в памяти"
    examples:
      - pl: "Chcę być zapamiętany."
        ru: "Я хочу, чтобы меня запомнили."
        source: { kind: translated, id: 3897652 }
      - pl: "Tragedia musi zostać zapamiętana, żeby już się nie powtórzyła."
        ru: "Трагедию нужно помнить, чтобы она не повторилась."
        source: { kind: translated, id: 3866129 }
notes:
  - { kind: usage, text: "Совершенный вид: zapamiętać «запомнить» — однократное действие, в отличие от pamiętać «помнить», у которого своя карточка и которое обозначает состояние." }
  - { kind: usage, text: "Несовершенная пара — zapamiętywać. Порядок такой: zapamiętuję «запоминаю» — zapamiętam «запомню» — zapamiętałem «запомнил»." }
  - { kind: usage, text: "Оборот łatwy do zapamiętania значит «легко запоминающийся»: łatwy do zapamiętania adres." }
  - { kind: false-friend, text: "Существительное zapamiętanie значит не «запоминание», а «самозабвение, исступление»: w zapamiętaniu «самозабвенно»." }
collocations:
  - { pl: "zapamiętaj to", ru: "запомни это" }
  - { pl: "łatwy do zapamiętania", ru: "легко запоминающийся" }
  - { pl: "zapamiętam", ru: "я запомню" }
etymology: "za- + pamiętać «помнить», от pamięć «память», праславянское *pamętь. Русское «запомнить» собрано ровно теми же частями: за- плюс «помнить»."
memory: "zapamiętać — «запомнить», однократное действие, в отличие от pamiętać «помнить». Запомните ловушку: zapamiętanie — это не «запоминание», а «самозабвение»."
idioms:
  - { pl: "zapamiętaj to", ru: "запомни это" }
  - { pl: "łatwy do zapamiętania", ru: "легко запоминающийся" }
  - { pl: "w zapamiętaniu", ru: "самозабвенно" }
