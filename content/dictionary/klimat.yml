notes:
  - { kind: false-friend, text: "Кроме «климата», польский KLIMAT значит «атмосфера, настроение места»: KAWIARNIA Z KLIMATEM — кафе с атмосферой. Отсюда разговорное KLIMATYCZNY — не «климатический», а «уютный, атмосферный»: KLIMATYCZNA KNAJPKA. Кондиционер — KLIMATYZACJA, в обиходе просто KLIMA. А TO NIE MOJE KLIMATY — «это не моё»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже T переходит в CI: W KLIMACIE. Множественное KLIMATY в разговоре значит «стиль, вкусы»: LUBIĘ TAKIE KLIMATY." }
  - { kind: government, text: "В каком климате — W JAKIM KLIMACIE, местный. Изменение климата — ZMIANA KLIMATU, родительный. Атмосфера чего-то — KLIMAT CZEGOŚ: KLIMAT MIASTA." }
  - { kind: pronunciation, text: "Читается «кли́мат», два слога, ударение на первом, тогда как у нас «клима́т». В местном падеже KLIMACIE ударение на втором слоге: «клима́це»." }
collocations:
  - { pl: "ocieplenie klimatu", ru: "потепление климата" }
  - { pl: "zmiana klimatu", ru: "изменение климата" }
  - { pl: "klimat polityczny", ru: "политический климат" }
family:
  - { pl: "klimatyczny", ru: "климатический; уютный, атмосферный", relation: derived }
  - { pl: "klimatyzacja", ru: "кондиционирование; кондиционер", relation: derived }
  - { pl: "klimatyzator", ru: "кондиционер", relation: derived }
etymology: "Из греческого слова со значением «наклон»: наклон земли к солнцу определяет погоду. Через латынь слово пришло и в польский, и в русский, а значение «атмосфера места» польский развил сам."
memory: "Klimat — климат и атмосфера места: kawiarnia z klimatem. Читается «кли́мат». Klimatyczny — уютный, атмосферный. Klimatyzacja — кондиционер. To nie moje klimaty — это не моё."
idioms:
  - { pl: "nie moje klimaty", ru: "не моё, не в моём вкусе" }
  - { pl: "tworzyć klimat", ru: "создавать атмосферу" }
formExamplesSkip:
