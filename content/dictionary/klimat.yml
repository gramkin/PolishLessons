senses:
  - id: climate
    ru: "климат"
    examples:
      - pl: "Klimat w Polsce jest umiarkowany."
        ru: "Климат в Польше умеренный."
        source: { kind: authored }
      - pl: "Zmiany klimatu dotykają wszystkich."
        ru: "Изменения климата касаются всех."
        source: { kind: authored }
