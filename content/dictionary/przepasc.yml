notes:
  - { kind: usage, text: "Третий член семьи после UPAŚĆ и WYPAŚĆ, и устроен он так же: один инфинитив, два глагола. Основа PRZEPADN-/PRZEPAD- значит «пропасть»: PRZEPADNĘ, PRZEPADŁ, PRZEPADNIJ. Основа PRZEPAS-/PRZEPAŚ- значит «пасти скот какое-то время»: PRZEPASĘ, PRZEPASŁ, PRZEPAŚ, PRZEPASIONY. У глагола исчезновения три значения: вещь пропала без следа, труд пошёл прахом, предложение провалилось на голосовании. Третье значение самое частое в газетах." }
  - { kind: pronunciation, text: "Читается «пше́пасьць»: prz — это «пш», и ударение падает на приставку, потому что слово двусложное, а польское ударение предпоследнее. Снова то же, что у UPAŚĆ и WYPAŚĆ: «у́пасьць», «вы́пасьць», «пше́пасьць». Русское ударение падает на корень, «пропа́сть», так что здесь нужно сознательно переставить его влево. Повелительные формы различают два глагола: PRZEPADNIJ против PRZEPAŚ." }
  - { kind: false-friend, text: "Две ловушки, и обе крупные. Первая приятная: PRZEPAŚĆ — это ещё и существительное женского рода со значением «пропасть, бездна», ровно как русское «пропасть», которое тоже и глагол, и существительное. Совпадение полное, включая многозначность. Вторая ловушка опасная: несовершенный вид PRZEPADAĆ ZA KIMŚ значит не «пропадать за кем-то», а «обожать кого-то»: PRZEPADAM ZA CZEKOLADĄ — «я обожаю шоколад». Переводить это «пропадаю» нельзя." }
  - { kind: government, text: "Глагол исчезновения непереходный. Как пропал — наречный оборот BEZ ŚLADU: PRZEPAŚĆ BEZ ŚLADU. Где провалился — предлог W с предложным падежом: PRZEPAŚĆ W GŁOSOWANIU, PRZEPAŚĆ W WYBORACH. Глагол выпаса переходный и требует винительного: PRZEPAŚĆ OWCE. И отдельно запомните управление несовершенного вида в значении «обожать»: PRZEPADAĆ ZA плюс творительный падеж, PRZEPADAĆ ZA KIMŚ, ZA CZYMŚ." }
