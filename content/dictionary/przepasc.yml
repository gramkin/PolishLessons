etymology: "Та же пара праславянских корней, что в UPAŚĆ и WYPAŚĆ: *pad-ti «падать» и *pas-ti «пасти». Оба сочетания согласных дали польское -ŚĆ, поэтому приставочные формы слились в один инфинитив. Приставка PRZE- отвечает русским «пере-» и «про-» и несёт здесь идею прохождения насквозь и до конца: пропасть — значит провалиться куда-то целиком, а в случае выпаса — продержать скот на пастбище весь срок. Существительное PRZEPAŚĆ «бездна» образовано от того же глагола и тем же способом, что русское «пропасть» от «пропасть»: место, куда всё проваливается. Два языка проделали одну и ту же метафору независимо."
memory: "Третий в семье: przepadn- «пропасть», przepas- «пасти». Ударение на приставке, «пше́пасьць», не «пропа́сть». И главное: przepadać za kimś — это «обожать», а не «пропадать»."
idioms:
