etymology: "От Ameryka плюс суффикс -ański. Русское «американский» собрано так же, только с суффиксом -ск-."
memory: "amerykański — «американский», от Ameryka. Запомните futbol amerykański «американский футбол»: обычный футбол по-польски piłka nożna. Мужское лицо множественного — amerykańscy."
