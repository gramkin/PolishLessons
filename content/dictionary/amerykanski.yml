notes:
  - { kind: usage, text: "Прилагательное от Ameryka плюс суффикс -ański. Склоняется как обычное прилагательное: amerykański, amerykańska, amerykańskie." }
  - { kind: usage, text: "futbol amerykański — «американский футбол»; обычный футбол по-польски piłka nożna, так что путаницы не возникает." }
  - { kind: usage, text: "Мужское лицо множественного — amerykańscy: amerykańscy imperialiści. Для вещей и женщин идёт amerykańskie и amerykańskie." }
  - { kind: usage, text: "Житель США — Amerykanin, жительница — Amerykanka; сами слова пишутся с большой буквы, а прилагательное с маленькой." }
collocations:
  - { pl: "futbol amerykański", ru: "американский футбол" }
