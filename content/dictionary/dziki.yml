# review
id: dziki
format: 2
lemma: "dziki"
rank: 1748
pos: adj
pron: { cyr: "дзи́ки" }
senses:
  - id: wild-animal
    ru: "дикий (о животных, природе)"
    examples:
      - pl: "Lis jest zwierzęciem dzikim."
        ru: "Лиса - дикое животное."
        source: { kind: tatoeba, id: 865611 }
      - pl: "Hiena jest dzikim zwierzęciem."
        ru: "Гиена - дикое животное."
        source: { kind: tatoeba, id: 12682175 }
      - pl: "Boję się dzikich zwierząt."
        ru: "Я боюсь диких животных."
        source: { kind: translated, id: 1519801 }
  - id: untamed
    ru: "дикий, необузданный (о людях, племенах)"
    examples:
      - pl: "Na tej wyspie nadal mieszka kilka dzikich plemion."
        ru: "На этом острове всё ещё живёт несколько диких племён."
        source: { kind: tatoeba, id: 3656769 }
      - pl: "Pokonana Grecja pokonała dzikiego zwycięzcę."
        ru: "Побеждённая Греция победила дикого победителя."
        source: { kind: translated, id: 711442 }
notes:
  - { kind: false-friend, text: "Осторожно: dziki «дикий» и dzik «кабан» — разные слова, и формы их пересекаются. Поговорка Dzik jest dziki значит «кабан дикий», а не «кабаны дикие»." }
  - { kind: government, text: "Обычное прилагательное: dzikie zwierzę «дикое животное», dzikich plemion «диких племён»." }
  - { kind: usage, text: "Устойчивые сочетания: dzika plaża «дикий пляж», na dziko «дико, без правил», dziki lokator «самовольный жилец»." }
  - { kind: usage, text: "Корень тот же, что в русском «дикий»; здесь языки совпадают полностью." }
collocations:
  - { pl: "dzikie zwierzę", ru: "дикое животное" }
  - { pl: "dzika plaża", ru: "дикий пляж" }
etymology: "Праславянское *dikъ; русское «дикий» — то же слово."
memory: "dziki — «дикий», прилагательное. Не путайте с dzik «кабан»: поговорка Dzik jest dziki «кабан дикий» держит оба слова рядом."
idioms:
  - { pl: "dzika plaża", ru: "дикий пляж" }
  - { pl: "na dziko", ru: "дико, без правил" }
