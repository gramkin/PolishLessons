# review
id: prawdziwy
format: 2
lemma: "prawdziwy"
rank: 259
pos: adj
pron: { cyr: "правдзи́вы" }
senses:
  - id: real
    ru: "настоящий, подлинный"
    examples:
      - pl: "To prawdziwa miłość."
        ru: "Это настоящая любовь."
        source: { kind: tatoeba, id: 2145550 }
      - pl: "Mamo, mamo, tam jest prawdziwy paw!"
        ru: "Мама, мама, там настоящий павлин!"
        source: { kind: tatoeba, id: 13786180 }
      - pl: "Prawdziwa przyjaźń będzie trwać zawsze."
        ru: "Настоящая дружба будет длиться вечно."
        source: { kind: tatoeba, id: 6602721 }
  - id: "true"
    ru: "истинный, реальный"
    examples:
      - pl: "Oparto na prawdziwej historii."
        ru: "Основано на реальных событиях."
        source: { kind: tatoeba, id: 3657482 }
      - pl: "Czy to pana prawdziwe nazwisko?"
        ru: "Это ваша настоящая фамилия?"
        source: { kind: tatoeba, id: 11318578 }
      - pl: "On był prawdziwym dżentelmenem."
        ru: "Он был истинным джентльменом."
        source: { kind: tatoeba, id: 12569610 }
notes:
  - { kind: false-friend, text: "prawdziwy значит «настоящий, подлинный», а не «правдивый». Правдивый человек — prawdomówny, правдивый рассказ — zgodny z prawdą." }
  - { kind: usage, text: "z prawdziwego zdarzenia — «настоящий, всамделишный»: lekarz z prawdziwego zdarzenia." }
  - { kind: usage, text: "Сравнительная степень чаще образуется аналитически — bardziej prawdziwy; формы prawdziwszy и najprawdziwszy книжные и редкие." }
collocations:
  - { pl: "prawdziwa miłość", ru: "настоящая любовь" }
  - { pl: "prawdziwy przyjaciel", ru: "настоящий друг" }
  - { pl: "prawdziwe nazwisko", ru: "настоящая фамилия" }
  - { pl: "z prawdziwego zdarzenia", ru: "настоящий, всамделишный" }
etymology: "От prawda «правда» с суффиксом -iwy; корень тот же, что в русском «правда», «правый»."
memory: "prawdziwy — «настоящий, подлинный»: prawdziwa miłość «настоящая любовь». А «правдивый» о человеке — prawdomówny."
idioms:
