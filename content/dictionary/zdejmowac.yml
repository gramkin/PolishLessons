notes:
  - { kind: false-friend, text: "ZDEJMOWAĆ — «снимать», а не «сдаивать» и не «сдавать». Фотографию по-польски не «снимают», а делают: ROBIĆ ZDJĘCIE; само слово ZDJĘCIE «фотография» — от ZDJĄĆ «снять». Шляпу перед кем-то — ZDEJMOWAĆ KAPELUSZ." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZDJĄĆ. Спряжение на -UJĘ: ZDEJMUJĘ, ZDEJMUJESZ, ZDEJMUJĄ. Пара ZDEJMOWAĆ — ZAKŁADAĆ «снимать — надевать»." }
  - { kind: government, text: "Что — винительный: ZDEJMOWAĆ PŁASZCZ. Откуда — Z с родительным: Z PÓŁKI, ZE ŚCIANY. С кого — Z с родительным или дательный: ZDEJMOWAĆ DZIECKU BUTY «снимать с ребёнка обувь»." }
  - { kind: pronunciation, text: "Читается «здэймо́ваць»: J — «й», ударение на предпоследнем слоге. ZDEJMUJĘ — «здэйму́е»." }
  - { kind: register, text: "Нейтральное бытовое слово. ZDEJMOWAĆ ZE STANOWISKA — официальное «снимать с должности»." }
collocations:
  - { pl: "zdejmować buty", ru: "снимать обувь" }
  - { pl: "zdejmować z półki", ru: "снимать с полки" }
  - { pl: "zdejmować ze stanowiska", ru: "снимать с должности" }
family:
  - { pl: "zdjąć", ru: "снять", relation: aspect, id: zdjac }
  - { pl: "zakładać", ru: "надевать", relation: antonym, id: zakladac }
  - { pl: "zdjęcie", ru: "фотография", relation: derived, id: zdjecie }
etymology: "Приставка Z- «с» плюс JĄĆ «брать», праславянское *jęti, как в русском «снять», «взять». Польское -DEJM- — многократная основа, как русское «-нимать»."
memory: "Zdejmować — снимать: zdejmujemy buty. Zakładać — надевать. Zdjęcie — фотография, «снятое»."
