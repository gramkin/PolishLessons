notes:
  - { kind: usage, text: "РОДИТЕЛЬНЫЙ НА -A, ХОТЯ НАПИТОК НЕОДУШЕВЛЁН: SZAMPANA. Так ведут себя в польском почти все напитки и многие предметы, которые берут в руки: wypić szampana, zamówić drinka, kupić banana. Тот же случай уже был у слова plus — postawić plusa. Русский такого не делает, и форма с -a поначалу кажется ошибкой." }
  - { kind: false-friend, text: "Ловушки нет: слово то же, что русское «шампанское», и пришло тем же путём — от названия французской области Champagne. Расходится только часть речи: по-русски это прилагательное, ставшее существительным среднего рода, по-польски — обычное существительное мужского рода, szampan." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SZAM-pan. Sz читается как ш, оба a чистые: «ша́мпан». В предложном падеже n смягчается: w szampanie — «в шампа́не»." }
  - { kind: register, text: "Нейтрально. Разговорное szampik — уменьшительное, с оттенком шутки. Шампанское открывают: otworzyć szampana, а пробка стреляет: korek strzela. Игристое вино вообще называют wino musujące, и настоящий szampan, по французскому праву, бывает только из Шампани." }
collocations:
  - { pl: "otworzyć szampana", ru: "открыть шампанское" }
  - { pl: "kieliszek szampana", ru: "бокал шампанского" }
  - { pl: "wznieść toast szampanem", ru: "поднять тост шампанским" }
family:
  - { pl: "wino", ru: "вино", relation: root }
  - { pl: "toast", ru: "тост", relation: derived }
  - { pl: "sylwester", ru: "новогодняя ночь", relation: derived }
etymology: "От названия французской области Champagne, где это вино делают, — а само название от позднелатинского campania «равнина», от campus «поле». Тот же корень в слове kampania. В русский слово пришло как прилагательное «шампанское вино», откуда и средний род; польский взял его существительным мужского рода."
memory: "szampan — «шампанское», но мужского рода и с родительным на -a: otworzyć szampana. Так же ведут себя напитки и мелкие предметы: zamówić drinka, kupić banana, postawić plusa."
idioms:
  - { pl: "otworzyć szampana", ru: "открыть шампанское" }
  - { pl: "strzelają korki od szampana", ru: "хлопают пробки от шампанского" }
