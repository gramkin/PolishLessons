etymology: "От глагола ODZNACZYĆ «отметить, отличить», собранного из приставки OD- и корня ZNAK, того же, что в русском «знак», «знамя», «знать». Приставка OD- означает отделение, выделение из числа прочих, и потому ODZNAKA есть буквально «то, чем выделяют». Русское «значок» построено от того же корня, но уменьшительным суффиксом, то есть названо по размеру, а не по назначению: маленький знак. Отсюда и разница в оттенке: польское слово говорит о чести, русское о величине. Корень праславянский, *znakъ от *znati «знать», и к нему же относится польское ZNAĆ и русское «знать», так что всё гнездо учащемуся уже знакомо."
memory: "Три похожих слова, и путать их нельзя: odznaka — значок, который носят; znak — знак вообще; oznaka, без d, — признак, симптом (oznaki choroby). От odznaczyć «выделить»: то, чем выделяют, тогда как русский «значок» назван по размеру. В дательном и местном k переходит в c: odznace, как panice и sekretarce."
