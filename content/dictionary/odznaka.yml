notes:
  - { kind: false-friend, text: "Русское «значок» и польское ODZNAKA совпадают по смыслу, но собраны из разных корней, и это стоит заметить, потому что похожее польское слово значит другое. ODZNAKA — предмет, который носят: значок, нагрудный знак. А ZNAK — это знак в широком смысле: дорожный знак, знак зодиака, признак. И есть третье слово, OZNAKA, без D, которое значит «признак, симптом»: OZNAKI CHOROBY «признаки болезни». Разница между ODZNAKA и OZNAKA — одна буква, а смысл расходится совершенно: одну прикалывают к мундиру, другую замечают у больного." }
  - { kind: pronunciation, text: "Читается «одзна́ка», ударение на предпоследнем слоге. Сочетание DZ в начале слова произносится слитно, одним звуком, как русское «дз», а не «д-з» в два приёма. В дательном и местном падеже ODZNACE согласная K переходит в C: «одзна́це». Это то же чередование, что в PANIKA и PANICE, SEKRETARKA и SEKRETARCE, PIGUŁKA и PIGUŁCE, и к этой партии оно должно быть уже знакомым." }
  - { kind: usage, text: "Самое частое сочетание — ODZNAKA HONOROWA «почётный знак», и целый ряд названий строится по этому образцу: ODZNAKA ZA ZASŁUGI, ODZNAKA SŁUŻBOWA, ODZNAKA HARCERSKA «скаутский значок». Вручение описывают глаголом WRĘCZYĆ или PRZYZNAĆ с дательным: WRĘCZONO MU ODZNAKĘ. Отличать надо от ORDER «орден» и MEDAL «медаль»: ODZNAKA мельче и скромнее, её не вешают на ленте. Прилагательное — ODZNACZENIOWY, но чаще скажут просто ODZNACZENIE «награда», однокоренное существительное." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: WRĘCZONO ODZNAKĘ. За что — предлог ZA с винительным: ODZNAKA ZA ZASŁUGI «знак за заслуги», ODZNAKA ZA WZOROWĄ SŁUŻBĘ. На чём носят — предлог NA с местном: ODZNAKA NA MUNDURZE, а изображение на самом значке — тоже NA с местном: NA ODZNACE WYGRAWEROWANO DATĘ. При отрицании винительный уходит в родительный: NIE WRĘCZONO ODZNAKI." }
