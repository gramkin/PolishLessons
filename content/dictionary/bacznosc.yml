# review
id: bacznosc
format: 2
lemma: "baczność"
rank: 5333
pos: noun
pron: { cyr: "ба́чносьць" }
senses:
  - id: vigilance
    ru: "бдительность, внимание"
    examples:
      - pl: "Kierowca musi zachować baczność."
        ru: "Водитель должен сохранять бдительность."
        source: { kind: authored }
      - pl: "Miej się na baczności w tym mieście."
        ru: "Будь начеку в этом городе."
        source: { kind: authored }
      - pl: "Śledził każdy ruch z największą bacznością."
        ru: "Он следил за каждым движением с величайшим вниманием."
        source: { kind: authored }
  - id: attention
    ru: "стойка смирно; команда «смирно!» (воен.)"
    examples:
      - pl: "Baczność! — krzyknął oficer."
        ru: "Смирно! — крикнул офицер."
        source: { kind: authored }
      - pl: "Żołnierze stanęli na baczność."
        ru: "Солдаты встали смирно."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Существительное женского рода на -OŚĆ. Живых форм три: BACZNOŚĆ, BACZNOŚCI и BACZNOŚCIĄ; множественного числа у слова нет. BACZNOŚĆ! — ещё и военная команда «смирно!»." }
  - { kind: false-friend, text: "Польское BACZNOŚĆ — «бдительность, внимание». MIEĆ SIĘ NA BACZNOŚCI — «быть начеку», STANĄĆ NA BACZNOŚĆ — «встать смирно». Прилагательное BACZNY — «внимательный»: BACZNY OBSERWATOR. Корень тот же, что в украинском «бачити» — «видеть»." }
  - { kind: government, text: "Быть начеку — MIEĆ SIĘ NA BACZNOŚCI, NA с местным. Встать смирно — STANĄĆ NA BACZNOŚĆ, NA с винительным: направление. И стоять смирно — тоже STAĆ NA BACZNOŚĆ, с винительным, по старой военной традиции." }
  - { kind: pronunciation, text: "Читается «ба́чносьць», два слога, ударение на первом. CZ — «ч», конечное ŚĆ — «сьць», как в MŁODOŚĆ «муо́досьць». В форме BACZNOŚCI: «бачно́сьци»." }
collocations:
  - { pl: "stać na baczność", ru: "стоять смирно" }
  - { pl: "zachować baczność", ru: "сохранять бдительность" }
  - { pl: "komenda baczność", ru: "команда «смирно»" }
family:
  - { pl: "baczyć", ru: "смотреть, остерегаться (книжн.)", relation: root }
  - { pl: "baczny", ru: "внимательный, бдительный", relation: derived }
  - { pl: "bacznie", ru: "внимательно", relation: derived }
etymology: "От BACZNY «внимательный», а тот от старого BACZYĆ «смотреть, остерегаться». Русскому этот корень почти не знаком, зато его хранит украинский «бачити»."
memory: "Baczność — бдительность и команда «смирно!». Читается «ба́чносьць». Mieć się na baczności — быть начеку. Stanąć na baczność — встать смирно. Baczny — внимательный."
idioms:
  - { pl: "mieć się na baczności", ru: "быть начеку" }
  - { pl: "stanąć na baczność", ru: "встать смирно" }
