# review
id: przewaznie
format: 2
lemma: "przeważnie"
rank: 5144
pos: adv
pron: { cyr: "пшэва́жне" }
senses:
  - id: mostly
    ru: "обычно, по большей части, преимущественно"
    examples:
      - pl: "Przeważnie jeżdżę do pracy rowerem."
        ru: "Обычно я езжу на работу на велосипеде."
        source: { kind: authored }
      - pl: "Klienci to przeważnie studenci."
        ru: "Покупатели — в основном студенты."
        source: { kind: authored }
      - pl: "Latem jest tu przeważnie sucho."
        ru: "Летом здесь по большей части сухо."
        source: { kind: authored }
      - pl: "Przeważnie się z nim zgadzam."
        ru: "Чаще всего я с ним согласен."
        source: { kind: authored }
      - pl: "Czytam przeważnie wieczorem."
        ru: "Читаю я обычно вечером."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZEWAŻNIE — «обычно, чаще всего», а не буквальное «перевешивая». Образ тот же, что в русском «преимущественно»: то, что перевешивает остальное. В прогнозе погоды: PRZEWAŻNIE POCHMURNO — «преимущественно облачно»." }
  - { kind: usage, text: "Наречие, одна форма, без степеней. Синонимы — ZWYKLE, «обычно», и NAJCZĘŚCIEJ, «чаще всего». PRZEWAŻNIE подчёркивает бо́льшую часть случаев, а не привычку." }
  - { kind: government, text: "Наречие ничем не управляет. Стоит в начале фразы или перед словом, к которому относится: PRZEWAŻNIE W DOMU, PRZEWAŻNIE STUDENCI." }
  - { kind: pronunciation, text: "Читается «пшэва́жне», ударение на предпоследнем слоге. PRZ — «пш»: RZ после глухого P оглушается. Ż — «ж»." }
collocations:
  - { pl: "przeważnie wieczorem", ru: "обычно вечером" }
  - { pl: "przeważnie w domu", ru: "чаще всего дома" }
  - { pl: "przeważnie pochmurno", ru: "преимущественно облачно" }
family:
  - { pl: "przeważać", ru: "преобладать", relation: root }
  - { pl: "waga", ru: "вес; весы", relation: root, id: waga }
  - { pl: "przewaga", ru: "перевес, преимущество", relation: root, id: przewaga }
etymology: "От PRZEWAŻAĆ «перевешивать, преобладать», а то — от WAŻYĆ «весить» и WAGA «вес». То, что перевешивает, — это бо́льшая часть, отсюда «по большей части»."
memory: "Przeważnie — обычно, по большей части: то, что przeważa, перевешивает. Читается «пшэва́жне». Przeważnie pochmurno — преимущественно облачно."
idioms:
  - { pl: "mieć przewagę", ru: "иметь преимущество" }
formExamples:
  - form: "przeważnie"
    pl: "Przeważnie wstaję o szóstej."
    ru: "Обычно я встаю в шесть."
    source: { kind: authored }
  - form: "przeważnie"
    pl: "W weekendy jesteśmy przeważnie w domu."
    ru: "По выходным мы обычно дома."
    source: { kind: authored }
  - form: "przeważnie"
    pl: "Jutro będzie przeważnie pochmurno."
    ru: "Завтра будет преимущественно облачно."
    source: { kind: authored }
