notes:
  - { kind: usage, text: "Это слово стоит выучить не ради него самого, а ради правила, которое оно открывает. Польское окончание -YCZNY отвечает русскому -ИЧЕСКИЙ или -ИЧНЫЙ, и соответствие работает почти без исключений: KLASYCZNY и «классический», FIZYCZNY и «физический», LOGICZNY и «логический», TECHNICZNY и «технический», PSYCHICZNY и «психический», HISTORYCZNY и «исторический». Запомнив одну пару окончаний, русскоязычный получает сразу целый пласт польских прилагательных, которые до этого выглядели незнакомыми." }
  - { kind: government, text: "Падежом прилагательное не управляет, зато показывает важное правило порядка слов. В терминах и устойчивых названиях польское прилагательное стоит ПОСЛЕ существительного: MUZYKA KLASYCZNA, FILOLOGIA KLASYCZNA, JĘZYK POLSKI, DWORZEC GŁÓWNY. Русский в тех же терминах ставит прилагательное перед существительным: «классическая музыка». Если же это обычное описание, а не термин, порядок свободнее: KLASYCZNY GARNITUR и GARNITUR KLASYCZNY оба правильны, но второе звучит как название товара в каталоге." }
  - { kind: register, text: "Степени сравнения у этого слова образуются по правилам, и все формы существуют, но в живой речи поляк предпочтёт описательную конструкцию BARDZIEJ KLASYCZNY «более классический». Формы на -NIEJSZY звучат книжно и встречаются редко, почти только в превосходной степени и почти только в одном сочетании: NAJKLASYCZNIEJSZY PRZYKŁAD «самый классический пример». Это не делает остальные формы неправильными, но писать ими не стоит, если не хочется звучать нарочито." }
  - { kind: false-friend, text: "Ловушка в значении, а не в форме. KLASYCZNY PRZYPADEK по-русски лучше всего передать как «типичный случай», а не «классический»: поляк этим оборотом говорит, что случай хрестоматийный, из учебника, и ничего торжественного в нём нет. Рядом стоит существительное KLASA, у которого к обычному «классу» добавлено значение «стиль, достоинство»: MIEĆ KLASĘ значит «держать себя с достоинством», а FACET Z KLASĄ — «человек со стилем»." }
  - { kind: pronunciation, text: "Читается «класы́чны», три слога, ударение на предпоследнем. Обе буквы Y звучат как «ы», и это главное: не «класичный», а «класычны». Буква L здесь обычная, не перечёркнутая, и передаётся как «л». Сочетание CZ даёт твёрдое «ч». В сравнительной степени слогов пять, ударение снова на предпоследнем: KLASYCZNIEJSZY, «класычне́йшы», а NI даёт мягкое «не»." }
