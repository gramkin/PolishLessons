etymology: "Заимствовано из латинского CLASSICUS «образцовый, первоклассный», от CLASSIS «разряд, класс»: классическим называли то, что принадлежит к высшему разряду. Русское «классический» пришло из того же латинского источника, обычно через немецкий и французский, поэтому слова и похожи. Но пути заимствования дали разные окончания: латинское -ICUS в польском стало -YCZNY, а в русском -ИЧЕСКИЙ, и это различие регулярно, оно повторяется в сотнях слов. Из того же гнезда KLASA «класс» и в школе, и в поезде, а также KLASYK «классик» и KLASYKA «классика»."
memory: "Главное здесь правило, а не слово: польское -YCZNY это русское -ИЧЕСКИЙ, и работает оно почти всегда, fizyczny, logiczny, techniczny, historyczny. Читается «класы́чны», с двумя «ы». В терминах прилагательное идёт после существительного: muzyka klasyczna, filologia klasyczna. Сравнительная степень формально есть, но вживую говорят bardziej klasyczny. И klasyczny przypadek значит «типичный случай», из учебника, без торжественности."
idioms:
