# review
id: ojciec
format: 2
lemma: "ojciec"
rank: 134
pos: noun
pron: { cyr: "о́йчец" }
senses:
  - id: father
    ru: "отец, папа"
    examples:
      - pl: "Mój ojciec pali."
        ru: "Мой отец курит."
        source: { kind: tatoeba, id: 357332 }
      - pl: "Ojciec jest w pokoju."
        ru: "Отец в комнате."
        source: { kind: tatoeba, id: 602612 }
      - pl: "Co robi jego ojciec?"
        ru: "Чем занимается его отец?"
        source: { kind: tatoeba, id: 2677035 }
      - pl: "Jestem twoim ojcem."
        ru: "Я твой отец."
        source: { kind: tatoeba, id: 1769547 }
  - id: priest
    ru: "отец (обращение к священнику), батюшка"
    examples:
      - pl: "Przebacz mi, ojcze."
        ru: "Прости меня, отец."
        source: { kind: tatoeba, id: 13067876 }
      - pl: "Ojcze nasz, który jesteś w niebie."
        ru: "Отче наш, сущий на небесах."
        source: { kind: authored }
      - pl: "Ojciec Jan odprawia mszę."
        ru: "Отец Ян служит мессу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Беглая гласная: ojciec, но ojca, ojcu, ojcem — «ie» выпадает во всех падежах, кроме именительного." }
  - { kind: usage, text: "Звательный падеж ojcze соответствует русскому «отче»: Ojcze, przebacz mi." }
collocations:
  - { pl: "mój ojciec", ru: "мой отец" }
  - { pl: "zostać ojcem", ru: "стать отцом" }
  - { pl: "ojciec rodziny", ru: "отец семейства" }
etymology: "Праславянское *otьcь (от детского *atta); то же слово, что русское «отец». Польское ojciec развилось из более старого ociec."
memory: "Беглая гласная: ojciec, но ojca, ojcu, ojcem — «ie» выпадает. Звательный ojcze — это русское «отче», и так же обращаются к священнику."
idioms:
  - { pl: "ojciec chrzestny", ru: "крёстный отец" }
  - { pl: "wykapany ojciec", ru: "вылитый отец" }
  - { pl: "ojciec święty", ru: "святой отец, папа римский" }
