notes:
  - { kind: government, text: "Доверять кому-л. — mieć do kogoś zaufanie, буквально «иметь К кому-то доверие», с предлогом do и родительным. Русское «доверие к кому-то» ставит дательный при глаголе." }
  - { kind: false-friend, text: "Отглагольное имя от zaufać «довериться»; глаголы ufać и zaufać уже есть в словаре. Корень тот же, что в русском «уповать»." }
  - { kind: usage, text: "Godny zaufania «достойный доверия, надёжный» — устойчивое сочетание с родительным падежом." }
  - { kind: usage, text: "W zaufaniu «по секрету»: Powiem ci coś w zaufaniu «Скажу тебе кое-что по секрету»." }
collocations:
