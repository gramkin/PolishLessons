# review
id: chwalic
format: 2
lemma: "chwalić"
rank: 4520
pos: verb
pron: { cyr: "хва́лиць" }
senses:
  - id: praise
    ru: "хвалить"
    examples:
      - pl: "Nauczycielka chwali go za postępy."
        ru: "Учительница хвалит его за успехи."
        source: { kind: authored }
      - pl: "Wszyscy chwalą tę restaurację."
        ru: "Все хвалят этот ресторан."
        source: { kind: authored }
      - pl: "Nie chwal dnia przed zachodem słońca."
        ru: "Не хвали день до заката."
        source: { kind: authored }
  - id: boast
    ru: "хвастаться (CHWALIĆ SIĘ + творительный)"
    examples:
      - pl: "Chwali się nowym samochodem."
        ru: "Он хвастается новой машиной."
        source: { kind: authored }
      - pl: "Nie lubię ludzi, którzy ciągle się chwalą."
        ru: "Я не люблю людей, которые вечно хвастаются."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "CHWALIĆ — «хвалить», совпадение полное. Но CHWALIĆ SIĘ — не «хвалить себя», а «хвастаться», и с творительным падежом: CHWALIĆ SIĘ DZIEĆMI «хвастаться детьми». Русское «хвастаться» тоже с творительным, но корень другой." }
  - { kind: usage, text: "Несовершенный вид; совершенный — POCHWALIĆ. Спряжение: CHWALĘ, CHWALISZ, CHWALĄ. Повелительное — CHWAL. Пословица NIE CHWAL DNIA PRZED ZACHODEM SŁOŃCA — «цыплят по осени считают»." }
  - { kind: government, text: "Кого — винительный: CHWALIĆ UCZNIA. За что — ZA с винительным: ZA PRACĘ, ZA ODWAGĘ. Чем хвастаться — творительный: CHWALIĆ SIĘ WYNIKAMI. Перед кем — PRZED с творительным: CHWALIĆ SIĘ PRZED KOLEGAMI." }
  - { kind: pronunciation, text: "Читается «хва́лиць»: CH — «х», LI — мягкое «ли». Ударение на первом слоге. CHWALĘ — «хва́лэ»." }
  - { kind: register, text: "Нейтральное слово. Религиозное — CHWALIĆ BOGA «славить Бога». Приветствие NIECH BĘDZIE POCHWALONY JEZUS CHRYSTUS — традиционное в деревнях." }
collocations:
  - { pl: "chwalić za coś", ru: "хвалить за что-то" }
  - { pl: "chwalić się czymś", ru: "хвастаться чем-то" }
  - { pl: "nie chwal dnia przed zachodem słońca", ru: "не хвали день до заката" }
family:
  - { pl: "pochwalić", ru: "похвалить", relation: aspect }
  - { pl: "chwała", ru: "слава", relation: root, id: chwala }
  - { pl: "krytykować", ru: "критиковать", relation: antonym }
etymology: "Праславянское *chvaliti, как русское «хвалить», «хвала». Тот же корень в CHWAŁA «слава, хвала»."
memory: "Chwalić — хвалить: chwali go za postępy. Chwalić się czymś — хвастаться чем-то, с творительным."
idioms:
  - { pl: "nie chwal dnia przed zachodem słońca", ru: "цыплят по осени считают" }
