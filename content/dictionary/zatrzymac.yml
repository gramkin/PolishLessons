# review
id: zatrzymac
format: 2
lemma: "zatrzymać"
rank: 329
pos: verb
aspect: perf
pron: { cyr: "затшы́маць" }
senses:
  - id: stop
    ru: "остановить; zatrzymać się — остановиться"
    examples:
      - pl: "Nikt mnie nie zatrzyma."
        ru: "Никто не остановит меня."
        source: { kind: tatoeba, id: 10115284 }
      - pl: "Samochód zatrzymał się łagodnie."
        ru: "Машина плавно остановилась."
        source: { kind: tatoeba, id: 362053 }
      - pl: "Powiedz, kiedy mam się zatrzymać."
        ru: "Скажи, когда мне остановиться."
        source: { kind: tatoeba, id: 976167 }
  - id: detain-keep
    ru: "задержать; оставить себе; остановиться у кого-либо"
    examples:
      - pl: "Zostałam zatrzymana na lotnisku."
        ru: "Меня задержали в аэропорту."
        source: { kind: tatoeba, id: 5376725 }
      - pl: "Możesz zatrzymać się u mnie."
        ru: "Можешь остановиться у меня."
        source: { kind: tatoeba, id: 10747440 }
      - pl: "Nagle zatrzymała się i odwróciła."
        ru: "Внезапно она остановилась и обернулась."
        source: { kind: tatoeba, id: 2146658 }
notes:
  - { kind: usage, text: "Возвратное zatrzymać się значит «остановиться» — и о движении, и о ночлеге: Zatrzymam się u ciebie «Остановлюсь у тебя»." }
  - { kind: usage, text: "zatrzymać coś значит «оставить себе»: Zatrzymaj to «Оставь себе, не отдавай»." }
  - { kind: usage, text: "В языке полиции zatrzymać kogoś — «задержать»: Tom został zatrzymany «Тома задержали»." }
  - { kind: usage, text: "Несовершенный вид — zatrzymywać: Nie zatrzymuj mnie «Не задерживай меня»." }
collocations:
  - { pl: "zatrzymać się", ru: "остановиться" }
  - { pl: "zatrzymaj to", ru: "оставь себе" }
  - { pl: "nikt mnie nie zatrzyma", ru: "никто меня не остановит" }
  - { pl: "został zatrzymany", ru: "его задержали" }
etymology: "Из za- + trzymać «держать»; в русском этому корню соответствует «держать» другого происхождения, но приставка za- работает так же, как в «задержать»."
memory: "zatrzymać — «остановить», zatrzymać się — «остановиться» (и о движении, и о ночлеге). Ещё два значения: Zatrzymaj to «Оставь себе» и został zatrzymany «его задержали»."
idioms:
  - { pl: "zatrzymać się", ru: "остановиться" }
  - { pl: "zatrzymaj to dla siebie", ru: "оставь это при себе" }
  - { pl: "nie do zatrzymania", ru: "не остановить" }
