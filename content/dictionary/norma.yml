notes:
  - { kind: false-friend, text: "Ловушки нет: слово латинское, и в оба языка оно пришло одинаково. Полезно другое — оборот stać się normą «стать нормой» и разговорное to norma «это обычное дело». А вот «нормально» в ответе на «как дела?» будет не norma, а w porządku или nieźle." }
  - { kind: pronunciation, text: "ДАТЕЛЬНЫЙ И ПРЕДЛОЖНЫЙ СМЯГЧАЮТ M: NORMIE. Тот же ряд уже встречался дважды подряд: farma — na farmie, jama — w jamie. Губные перед окончанием -ie всегда смягчаются, как p в małpie и b в babie. Ударение везде на предпоследнем слоге: NOR-ma, NOR-mie." }
  - { kind: usage, text: "В техническом языке norma значит «стандарт»: norma europejska, norma jakości, zgodny z normą. В языке труда — «норма выработки»: wyrobić normę. В обиходе — «обычное дело»: to u nas norma. Прилагательное normalny значит и «нормальный», и разговорно «обыкновенный»: normalny dzień." }
  - { kind: register, text: "Звательный падеж normo принадлежит тому же книжному разряду, что farmo, jamo и polityko: у неодушевлённых существительных он живёт только в обращении — в стихах, в риторическом возгласе, в прощании. В разговоре вместо него звучит именительный." }
collocations:
  - { pl: "wyrobić normę", ru: "выполнить норму" }
  - { pl: "zgodny z normą", ru: "соответствующий норме" }
  - { pl: "stać się normą", ru: "стать нормой" }
family:
  - { pl: "normalny", ru: "нормальный", relation: derived, id: normalny }
  - { pl: "normować", ru: "нормировать", relation: derived }
  - { pl: "nienormalny", ru: "ненормальный", relation: antonym }
etymology: "Из латинского norma — сначала «угольник, наугольник», потом «правило, образец». Из ремесла слово ушло в право и в обиход: то, что выверено по угольнику, и есть правильное. В русский «норма» пришла тем же путём. Отсюда normalny, normować, unormować и anormalny."
memory: "norma — «норма» во всех смыслах: стандарт, выработка, обычное дело. Дательный и предложный смягчают m: w normie, как na farmie и w jamie. А изначально латинская norma — это угольник: правильно то, что выверено по нему."
idioms:
