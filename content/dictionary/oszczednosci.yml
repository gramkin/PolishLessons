  - { pl: "stracić oszczędności", ru: "потерять сбережения" }
family:
  - { pl: "oszczędzać", ru: "экономить, копить; щадить", relation: root }
  - { pl: "oszczędny", ru: "бережливый, экономный", relation: derived }
  - { pl: "oszczędność", ru: "экономия, бережливость", relation: derived }
etymology: "От OSZCZĘDZAĆ «беречь, экономить», того же корня, что русские «щадить» и «пощада»: польское SZCZ — русское «щ», носовое Ę — русское «а». Сбережения — это то, что «пощадили», не потратили."
memory: "Oszczędności — сбережения. Читается «ошчэндно́сьци». Oszczędności całego życia — сбережения всей жизни. Oszczędzać — экономить, копить; родня русского «щадить»."
idioms:
  - { pl: "oszczędności całego życia", ru: "сбережения всей жизни" }
  - { pl: "szukać oszczędności", ru: "искать, на чём сэкономить" }
