notes:
  - { kind: false-friend, text: "OSZCZĘDNOŚCI во множественном — «сбережения», отложенные деньги: WYDAĆ OSZCZĘDNOŚCI. Единственное OSZCZĘDNOŚĆ — «экономия, бережливость». Глагол OSZCZĘDZAĆ значит и «экономить», и «копить»: OSZCZĘDZAM NA WAKACJE — «коплю на отпуск». А OSZCZĘDZIĆ — ещё и «пощадить»: OSZCZĘDŹ MI SZCZEGÓŁÓW — «избавь меня от подробностей»." }
  - { kind: usage, text: "Четыре формы, только множественное число в этом значении; единственное OSZCZĘDNOŚĆ — отдельное слово. Именительный и родительный совпадают: OSZCZĘDNOŚCI." }
  - { kind: government, text: "Сбережения на что-то — OSZCZĘDNOŚCI NA COŚ, NA с винительным. Жить на сбережения — ŻYĆ Z OSZCZĘDNOŚCI, Z с родительным. Купить на сбережения — KUPIĆ ZA OSZCZĘDNOŚCI, ZA с винительным." }
  - { kind: pronunciation, text: "Читается «ошчэндно́сьци», четыре слога, ударение на третьем. SZCZ — «шч», Ę перед D звучит «эн», CI — мягкое «ци»." }
collocations:
  - { pl: "konto oszczędnościowe", ru: "сберегательный счёт" }
