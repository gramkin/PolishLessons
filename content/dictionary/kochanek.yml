notes:
  - { kind: false-friend, text: "ФОРМА KOCHANKA ЗНАЧИТ ДВЕ РАЗНЫЕ ВЕЩИ. Это родительный от kochanek «любовник» — nie ma kochanka — и одновременно отдельное существительное kochanka «любовница» в именительном. Различает только контекст и род: kochanek мужского, kochanka женского. Так же устроена пара wino и wina." }
  - { kind: usage, text: "Беглое e выпадает: kochanek, но KOCHANKA, kochankowi, kochankiem. Именительный множественного идёт на -owie — KOCHANKOWIE, как у ministrowie и profesorowie, то есть по образцу званий и близких отношений. Корень kochać «любить» тот же, что в украинском «кохати»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: ko-CHA-nek. Ch читается как х, e открытое: «коха́нэк». Множественное kochankowie звучит «кохан­ко́ве»." }
collocations:
  - { pl: "dawny kochanek", ru: "прежний любовник" }
  - { pl: "para kochanków", ru: "пара любовников" }
  - { pl: "potajemny kochanek", ru: "тайный любовник" }
family:
  - { pl: "kochać", ru: "любить", relation: root, id: kochac }
  - { pl: "kochanka", ru: "любовница", relation: root }
  - { pl: "miłość", ru: "любовь", relation: root, id: milosc }
etymology: "От kochać «любить», слова, у которого в русском прямого соответствия нет: литературный русский взял «любить», а тот же корень живёт в украинском «кохати» и «кохання». Суффикс -anek образует названия лиц. Отсюда kochanka, kochany «любимый» и ukochany."
memory: "kochanek — «любовник», и беглое e выпадает: kochanka, kochankiem. Множественное на -owie: kochankowie. Осторожно с формой kochanka: это и родительный от kochanek, и отдельное слово «любовница»."
idioms:
