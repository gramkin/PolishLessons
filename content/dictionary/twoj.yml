# review
id: twoj
format: 2
lemma: "twój"
rank: 30
pos: adj
pron: { cyr: "тфуй" }
senses:
  - id: your
    ru: "твой, твоя, твоё"
    examples:
      - pl: "To twój koniec."
        ru: "Тебе конец!"
        source: { kind: tatoeba, id: 12710253 }
      - pl: "Nie twoja sprawa."
        ru: "Не твоё дело."
        source: { kind: tatoeba, id: 567240 }
      - pl: "Mam twoje bilety."
        ru: "Твои билеты у меня."
        source: { kind: tatoeba, id: 5528890 }
  - id: yours
    ru: "твой (в косвенных падежах)"
    examples:
      - pl: "Potrzebuję twojej pomocy."
        ru: "Мне нужна твоя помощь."
        source: { kind: tatoeba, id: 350830 }
      - pl: "Jestem twoim ojcem."
        ru: "Я твой отец."
        source: { kind: tatoeba, id: 1769547 }
notes:
  - { kind: usage, text: "Если владелец — подлежащее, вместо twój обычно ставят swój: Kochasz swoją pracę? «Ты любишь свою работу?»." }
  - { kind: usage, text: "Краткие формы twego, twej, twemu, twych книжные и поэтические; в разговоре звучат полные." }
collocations:
  - { pl: "twoim zdaniem", ru: "по-твоему" }
  - { pl: "nie twoja sprawa", ru: "не твоё дело" }
etymology: "Праславянское *tvojь — то же слово, что русское «твой»."
memory: "Склоняется как прилагательное, но чаще всего его вытесняет swój: если действие возвращается к подлежащему, поляк скажет Kochasz swoją pracę, а не twoją. Ряд twego, twej, twemu, twych — книжный."
idioms:
  - { pl: "twoim zdaniem", ru: "по-твоему" }
  - { pl: "nie twoja sprawa", ru: "не твоё дело" }
