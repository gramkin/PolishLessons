# review
id: zalezec
format: 2
lemma: "zależeć"
rank: 577
pos: verb
aspect: imperf
pron: { cyr: "зале́жэць" }
senses:
  - id: depend
    ru: "зависеть от чего-л. (od czegoś — с родительным)"
    note: "Управление совпадает с русским: to zależy od kontekstu."
    examples:
      - pl: "To zależy od kontekstu."
        ru: "Это зависит от контекста."
        source: { kind: tatoeba, id: 364814 }
      - pl: "Od tego zależy moja przyszłość."
        ru: "От этого зависит моё будущее."
        source: { kind: tatoeba, id: 8666086 }
      - pl: "Głębokość przyjaźni nie zależy od długości znajomości."
        ru: "Глубина дружбы не зависит от продолжительности знакомства."
        source: { kind: tatoeba, id: 6156050 }
  - id: it-depends
    ru: "To zależy — смотря как, как посмотреть"
    note: "Самостоятельная реплика."
    examples:
      - pl: "To całkowicie będzie zależało od niego."
        ru: "Это будет целиком зависеть от него."
        source: { kind: tatoeba, id: 10817622 }
      - pl: "To zależy, ile masz czasu."
        ru: "Смотря сколько у тебя времени."
        source: { kind: authored }
      - pl: "Przyjdziesz? To zależy."
        ru: "Придёшь? Смотря как."
        source: { kind: authored }
  - id: matter-to
    ru: "zależy mi na czymś — мне важно что-л."
    note: "Лицо в дательном, предмет с na и предложным — оборот, которого в русском нет."
    examples:
      - pl: "Zastanawiam się, czy kiedykolwiek ci na mnie zależało."
        ru: "Интересно, было ли тебе когда-нибудь до меня дело."
        source: { kind: translated, id: 972868 }
      - pl: "Samiemu na niczym nie zależało."
        ru: "Ему самому ни до чего не было дела."
        source: { kind: translated, id: 6368386 }
      - pl: "Zależy mi na tobie."
        ru: "Ты мне дорог."
        source: { kind: authored }
notes:
  - { kind: government, text: "zależeć od czegoś — с предлогом od и родительным, ровно как русское «зависеть от»: to zależy od kontekstu." }
  - { kind: government, text: "Второй оборот русскому чужой: zależy mi na czymś «мне важно что-то» — человек стоит в дательном, а предмет идёт с na и предложным. Zależy mi na tobie значит «ты мне дорог»." }
  - { kind: usage, text: "Короткое To zależy в одиночку значит «смотря как, как посмотреть»." }
  - { kind: usage, text: "Прилагательное — zależny «зависимый», существительное — zależność «зависимость»; niezależny — «независимый»." }
collocations:
  - { pl: "to zależy", ru: "смотря как" }
  - { pl: "zależeć od kogoś", ru: "зависеть от кого-либо" }
  - { pl: "zależy mi na tym", ru: "мне это важно" }
  - { pl: "w zależności od", ru: "в зависимости от" }
family:
  - { pl: "leżeć", ru: "лежать", relation: root }
  - { pl: "zależny", ru: "зависимый", relation: derived }
  - { pl: "zależność", ru: "зависимость", relation: derived }
etymology: "Приставка za- плюс leżeć «лежать», от праславянского *ležati — буквально «лежать на чём-то, опираться». Русское «зависеть» собрано от другого корня, но образ тот же."
memory: "zależeć — «зависеть», и главный оборот совпадает с русским: zależeć od czegoś, с od и родительным — to zależy od kontekstu. А вот второй русскому чужой: zależy mi na czymś значит «мне важно что-то», где человек стоит в дательном, а предмет идёт с na и предложным — Zależy mi na tobie «Ты мне дорог». И короткое To zależy само по себе значит «смотря как». Прилагательное — zależny, отрицание — niezależny."
idioms:
  - { pl: "to zależy", ru: "смотря как" }
  - { pl: "zależy mi na tym", ru: "мне это важно" }
  - { pl: "w zależności od", ru: "в зависимости от" }
