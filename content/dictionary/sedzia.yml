# review
id: sedzia
format: 2
lemma: "sędzia"
rank: 1045
pos: noun
pron: { cyr: "сэ́ндзя" }
senses:
  - id: judge
    ru: "судья (в суде)"
    examples:
      - pl: "Sędzia wszedł na salę sądową."
        ru: "Судья вошёл в зал суда."
        source: { kind: translated, id: 13789566 }
      - pl: "Jego życie wisi na decyzji sędziego."
        ru: "Его жизнь зависит от решения судьи."
        source: { kind: translated, id: 9686880 }
      - pl: "Wszyscy oprócz sędziego opuścili salę rozpraw."
        ru: "Все, кроме судьи, покинули зал суда."
        source: { kind: translated, id: 12129510 }
  - id: referee
    ru: "судья, арбитр (в спорте)"
    examples:
      - pl: "Sędzia przerwał grę."
        ru: "Судья прервал игру."
        source: { kind: translated, id: 6534339 }
      - pl: "Sędzia zawiesił mecz."
        ru: "Судья остановил матч."
        source: { kind: translated, id: 6534343 }
      - pl: "Gracze muszą przestrzegać decyzji sędziego."
        ru: "Игроки должны подчиняться решению судьи."
        source: { kind: translated, id: 1353944 }
  - id: be-judge
    ru: "być sędzią — быть судьёй"
    examples:
      - pl: "Tom został sędzią."
        ru: "Том стал судьёй."
        source: { kind: translated, id: 11475671 }
      - pl: "Nikt nie jest sędzią we własnej sprawie."
        ru: "Никто не судья в собственном деле."
        source: { kind: translated, id: 968945 }
      - pl: "Tom był jednym z sędziów."
        ru: "Том был одним из судей."
        source: { kind: translated, id: 12359987 }
notes:
  - { kind: usage, text: "Склонение необычное: существительное мужского рода, а падежи как у прилагательного — sędzia, sędziego, sędziemu, sędzią. Так же склоняется hrabia «граф»." }
  - { kind: usage, text: "Одно слово покрывает два русских: и «судья» в суде, и «судья, арбитр» на поле. Контекст различает их сам." }
  - { kind: usage, text: "Множественное число мужско-личное: sędziowie «судьи», родительный sędziów. Decyzja sędziów «решение судей»." }
  - { kind: register, text: "Sędzia kalosz! — футбольная кричалка в адрес судьи, примерно как русское «Судью на мыло!»." }
collocations:
  - { pl: "decyzja sędziego", ru: "решение судьи" }
  - { pl: "zostać sędzią", ru: "стать судьёй" }
  - { pl: "sędzia sportowy", ru: "спортивный судья" }
  - { pl: "sala sądowa", ru: "зал суда" }
family:
  - { pl: "sąd", ru: "суд", relation: root, id: sad }
  - { pl: "sądzić", ru: "судить", relation: root, id: sadzic }
  - { pl: "sędziować", ru: "судить (матч)", relation: derived }
etymology: "От sąd «суд», праславянское *sǫdьja — то же слово, что русское «судья». Корень общий и старый, разошлось только склонение."
memory: "sędzia — «судья» и в суде, и на поле. Главная трудность не значение, а падежи: слово мужского рода, но склоняется как прилагательное — sędziego, sędziemu, sędzią."
idioms:
  - { pl: "decyzja sędziego", ru: "решение судьи" }
  - { pl: "nikt nie jest dobrym sędzią we własnej sprawie", ru: "никто не судья в собственном деле" }
  - { pl: "sędzia kalosz!", ru: "судью на мыло!" }
formExamplesSkip:
  - { form: "sędzi", reason: "вариант родительного и предложного падежа: в живой речи вытеснен формой sędziego" }
  - { form: "sędzię", reason: "устаревший винительный падеж: сейчас винительный совпадает с родительным — sędziego" }
  - { form: "sędzim", reason: "устаревший предложный падеж, в современном языке не употребляется" }
