notes:
  - { kind: false-friend, text: "Русское «бижутерия» и польское BIŻUTERIA — ложная пара, и различие практическое. По-русски «бижутерия» значит дешёвые украшения из недрагоценных материалов, в противоположность «ювелирным изделиям». Польское BIŻUTERIA — это украшения вообще, любые: и золотые, и серебряные, и стеклянные. Поэтому BIŻUTERIA ZE ZŁOTA — нормальное польское словосочетание, а по-русски «бижутерия из золота» звучит как противоречие. Если нужно подчеркнуть дешевизну, поляк скажет SZTUCZNA BIŻUTERIA или TANIA BIŻUTERIA. Ювелир по-польски JUBILER, а ювелирный магазин — SKLEP JUBILERSKI." }
  - { kind: usage, text: "Десять форм, женский род, на -IA. Собирательное: множественное BIŻUTERIE употребляется редко и означает «виды украшений» или коллекции. Обычно слово стоит в единственном числе и там, где русский берёт множественное: BIŻUTERIA LEŻAŁA W PUDEŁKU — «украшения лежали в шкатулке». Родительный единственного BIŻUTERII пишется с двойным I и совпадает с дательным и местным. Родительный множественного — архаичное BIŻUTERYJ на -YJ, как AMUNICYJ и AKADEMIJ. В современных текстах эта форма практически не встречается, но в полной парадигме стоит." }
  - { kind: pronunciation, text: "Читается «бижутэ́рья», пять слогов, ударение на предпоследнем. Главное здесь — буква Ż: она передаёт французское J в слове BIJOU, и читается как твёрдое «ж». Польская орфография сохранила французский звук и записала его своей буквой, тогда как русский в этом слове поставил «ж» без диакритики. Буква U это «у», E — «э» без смягчения: «тэ», а не «те». Сочетание IA в конце даёт «ья». В родительном BIŻUTERII двойное I читается как долгое «и»: «бижутэ́рьи»." }
  - { kind: register, text: "Слово нейтральное и бытовое, уместно в магазине, в разговоре и в описи имущества. В официальных текстах рядом с ним стоит WYROBY JUBILERSKIE «ювелирные изделия», и в таможенных документах предпочитают именно эту формулу. Уменьшительных слово не имеет. В переносном смысле BIŻUTERIA иногда употребляется иронически о чём-то избыточно украшенном: TA STRONA MA ZA DUŻO BIŻUTERII «на этой странице слишком много украшательств», но оборот разговорный и в письменной речи редкий." }
