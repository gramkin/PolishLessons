etymology: "Из французского BIJOUTERIE, от BIJOU «драгоценность», которое само пришло из бретонского BIZOU «кольцо на палец», от BIZ «палец». В польский слово попало в девятнадцатом веке вместе с модой и парижскими магазинами и сохранило французское значение — украшения как таковые. Русский взял то же слово, но в эпоху, когда во Франции уже противопоставляли BIJOUTERIE дешёвую и JOAILLERIE настоящую, и закрепил за ним именно первое, дешёвое. Отсюда расхождение: польское BIŻUTERIA нейтрально по материалу, русское «бижутерия» прямо указывает на недрагоценность. Польская орфография передала французское J своей буквой Ż, что видно и в других словах того же слоя: ŻETON от JETON, ŻARGON от JARGON."
memory: "Ложный друг: польское biżuteria — украшения любые, и biżuteria ze złota нормально; русская «бижутерия» только дешёвая. Дешёвые по-польски sztuczna biżuteria. Ювелир — jubiler. Слово собирательное: стоит в единственном там, где русский берёт множественное. Орфография и есть урок: ż передаёт французское J из bijou, как в żeton от jeton. Родительный множественного архаичный: biżuteryj, как amunicyj."
