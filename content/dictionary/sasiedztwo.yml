etymology: "От SĄSIAD «сосед»; польское Ą на месте русского «о»: SĄSIAD и «сосед» — одно праславянское слово «тот, кто сидит рядом». Суффикс -STWO, как в русском «-ство»."
memory: "Sąsiedztwo — соседство: w sąsiedztwie lasu — рядом с лесом. Sąsiad — сосед. Читается «соньсе́цтфо»."
