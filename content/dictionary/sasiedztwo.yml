notes:
  - { kind: false-friend, text: "SĄSIEDZTWO — «соседство»: и близость места, и соседи как окружение. Но район города — DZIELNICA или OKOLICA, а не SĄSIEDZTWO. W SĄSIEDZTWIE — «по соседству, рядом»." }
  - { kind: usage, text: "Средний род. Множественное число почти не встречается, поэтому учим единственное: SĄSIEDZTWO, SĄSIEDZTWA, SĄSIEDZTWU, SĄSIEDZTWEM, SĄSIEDZTWIE." }
  - { kind: government, text: "По соседству с чем — W SĄSIEDZTWIE и родительный: W SĄSIEDZTWIE RZEKI. Политика добрососедства — POLITYKA DOBREGO SĄSIEDZTWA." }
  - { kind: pronunciation, text: "Читается «соньсе́цтфо». Ą перед Ś — «онь», DZ перед T оглушается в «ц», W после T — «ф». Ударение на предпоследнем слоге." }
