etymology: "Праславянское *porxъ — то же слово, что русское «порох» и «прах». В польском оба значения остались у одного слова."
memory: "proch — и «порох», и «прах»: proch strzelniczy, prochem jesteś. Во множественном prochy — это прах покойного или, разговорно, наркотики."
