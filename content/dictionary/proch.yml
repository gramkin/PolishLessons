lemma: "proch"
rank: 1844
pos: noun
pron: { cyr: "прох" }
senses:
  - id: gunpowder
    ru: "порох"
    examples:
      - pl: "Czy wiesz, kto wynalazł proch strzelniczy?"
        ru: "Ты знаешь, кто изобрёл порох?"
        source: { kind: translated, id: 3032293 }
      - pl: "On nie wynalazł prochu."
        ru: "Он пороха не изобрёл."
        source: { kind: translated, id: 2587149 }
      - pl: "Iskra spowodowała eksplozję prochu."
        ru: "Искра вызвала взрыв пороха."
        source: { kind: translated, id: 12716127 }
  - id: ashes-dust
    ru: "прах, пыль"
    examples:
      - pl: "Tu spoczywają jego prochy."
        ru: "Здесь покоится его прах."
        source: { kind: tatoeba, id: 356996 }
      - pl: "Pamiętaj, że prochem jesteś."
        ru: "Помни, что ты прах."
        source: { kind: translated, id: 2184594 }
      - pl: "Czy Tom był na prochach?"
        ru: "Том был под наркотиками?"
        source: { kind: translated, id: 3125564 }
notes:
  - { kind: usage, text: "Prochu nie wymyśli — «пороха не выдумает», о человеке недалёком. Русское выражение то же самое." }
  - { kind: usage, text: "beczka prochu — «пороховая бочка», и в прямом смысле, и о взрывоопасной ситуации: Bliski Wschód nazywany jest beczką z prochem." }
  - { kind: usage, text: "Во множественном prochy значит «прах» покойного, а в разговорной речи — наркотики: być na prochach «быть под наркотиками»." }
  - { kind: false-friend, text: "Русские «порох» и «прах» — это одно польское слово proch. Различать помогает только контекст." }
collocations:
