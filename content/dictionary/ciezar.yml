etymology: "От CIĘŻKI «тяжёлый», из праславянского *tęgъ-kъ, и корень тот же, что в русских «тяжкий», «тяжёлый», «тягость», «тягло». Соответствие польского CIĘ- русскому ТЯ- здесь регулярное, как в CIĘŻKI и «тяжкий», CIĄGNĄĆ и «тянуть», CIĘCIWA и «тетива»: носовой Ę стоит там, где русский даёт Я. Суффикс -AR в CIĘŻAR редкий и обозначает отвлечённое свойство, превращённое в предмет, — примерно как в русском «жар» или «пар». Из того же гнезда идут CIĘŻARÓWKA «грузовик», буквально «тяжеловозка», и CIĘŻARNA «беременная», где тяжесть понята как ноша. Последнее слово для русского неожиданно и стоит отдельного запоминания."
memory: "Корень узнаётся: ciężki — «тяжкий», и польское cię- отвечает русскому тя-, как ciągnąć и «тянуть». Но одному ciężar отвечают три русских слова: «вес», «тяжесть» и «бремя», и выбирать надо по смыслу. Вес как показание прибора — скорее waga. Местный ciężarze с r→rz: «ценжа́же». Из того же гнезда ciężarówka «грузовик» и ciężarna «беременная» — второе для русского неожиданно."
