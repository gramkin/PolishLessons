notes:
  - { kind: false-friend, text: "Корень узнаваем, а слово приходится выбирать. CIĘŻAR от CIĘŻKI «тяжёлый», а это прямой родственник русского «тяжкого» и «тяжёлого»: праславянское *tęgъ, где польское CIĘ- стоит на месте русского ТЯ-. Но одному польскому слову отвечают по-русски три: «вес», когда речь о величине, «тяжесть», когда о давящей массе, и «бремя», когда о переносном. CIĘŻAR PACZKI это «вес посылки», POD CIĘŻAREM ŚNIEGU — «под тяжестью снега», CIĘŻAR ODPOWIEDZIALNOŚCI — «бремя ответственности». Собственно «вес» как показание прибора по-польски чаще WAGA, и путать эти два слова не стоит: WAGA это и весы, и вес как величина." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: PODNIEŚĆ CIĘŻAR. Родительный на -U: BEZ CIĘŻARU. Местный CIĘŻARZE, с чередованием R в RZ: W CIĘŻARZE. Под чем-то — предлог POD с творительным: POD CIĘŻAREM ŚNIEGU, и это самый частый оборот. Чего бремя — родительный без предлога: CIĘŻAR ODPOWIEDZIALNOŚCI, CIĘŻAR UTRZYMANIA. Множественное CIĘŻARY означает поднимаемые тяжести, в том числе в спорте: PODNOSZENIE CIĘŻARÓW «тяжёлая атлетика»." }
  - { kind: pronunciation, text: "Читается «це́нжар», ударение на предпоследнем слоге из двух. Начальное CIĘ даёт «це» с мягким ц и носовым призвуком перед Ż, то есть ближе к «цен». Буква Ż звучит «ж». Конечное R ясное. В местном падеже CIĘŻARZE сочетание RZ даёт «ж», и в слове оказываются два звука «ж» подряд через гласную: «ценжа́же». В родительном множественного CIĘŻARÓW буква Ó даёт «у», а конечное W оглушается: «ценжа́руф»." }
  - { kind: usage, text: "Частотные сочетания: CIĘŻAR CIAŁA «вес тела», POD CIĘŻAREM CZEGOŚ, ŚRODEK CIĘŻKOŚCI «центр тяжести» — здесь уже от CIĘŻKOŚĆ, отдельного слова, — PODNOSZENIE CIĘŻARÓW «тяжёлая атлетика», CIĘŻAR DOWODU «бремя доказывания» в юридическом языке. Прилагательное CIĘŻKI значит и «тяжёлый», и «трудный», как русское «тяжёлый»: CIĘŻKA PRACA, CIĘŻKA CHOROBA. Наречие CIĘŻKO употребляется безлично: CIĘŻKO MI «мне тяжело»." }
