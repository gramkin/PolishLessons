notes:
  - { kind: false-friend, text: "RADAR — «радар», как в русском. В разговоре так называют и полицейский измеритель скорости, и камеру: FOTORADAR. ZNIKNĄĆ Z RADARU — «пропасть с радаров», и о человеке тоже." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — RADARU. В местном R переходит в RZ: NA RADARZE." }
  - { kind: government, text: "На радаре — NA RADARZE, местный. Пропасть с радара — ZNIKNĄĆ Z RADARU, родительный. Поймать радаром — ZŁAPAĆ RADAREM, творительный." }
  - { kind: pronunciation, text: "Читается «ра́дар», ударение на первом слоге. В RADARZE — «рада́жэ»: RZ звучит как «ж»." }
collocations:
