notes:
  - { kind: false-friend, text: "Русского слова с таким корнем нет: «выправка» значит осанку, а «выправить» — исправить, и ни то ни другое к WYPRAWA отношения не имеет. Польское слово построено от WYPRAWIĆ «отправить, снарядить» и означает прежде всего экспедицию, поход, снаряжённое путешествие: WYPRAWA W GÓRY, WYPRAWA POLARNA. Второе значение, приданое, идёт от той же мысли о снаряжении: WYPRAWA ŚLUBNA это то, чем девушку снаряжали в новый дом. Третье, разговорное и шутливое: всякий выход за покупками или с детьми, когда он требует сборов." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — WYPRAWIE, со смягчением W в WI перед окончанием -E. Родительный множественного — WYPRAW, с нулевым окончанием и без вставного гласного и без удлинения: рядом с KAWIARŃ и EGZEKUCYJ в этой же партии видно, что форма с нулевым окончанием имеет сразу три облика в зависимости от основы. Управление: WYPRAWA W COŚ с винительным о направлении — WYPRAWA W GÓRY, WYPRAWA W NIEZNANE; и WYPRAWA PO COŚ с винительным о цели — WYPRAWA PO ZAKUPY." }
  - { kind: pronunciation, text: "Читается «выпра́ва», три слога, ударение на втором. Начальное WY даёт «вы», буква R раскатистая. В форме WYPRAWIE сочетание WIE читается «ве» с мягким W: «выпра́ве». В форме WYPRAWĄ последнее Ą звучит «он»: «выпра́вон». В форме WYPRAWĘ конечное Ę даёт чистое «э». В форме WYPRAW конечное W оглушается в «ф»: «вы́праф», и ударение переходит на первый слог, потому что слогов остаётся два." }
  - { kind: register, text: "Слово нейтральное, с лёгким оттенком торжественности, когда речь о настоящей экспедиции, и шутливое, когда о походе в магазин. Устойчивые сочетания: WYPRAWA WYSOKOGÓRSKA, WYPRAWA POLARNA, WYPRAWA KRZYŻOWA «крестовый поход», WYPRAWA PO ZAKUPY. В историческом языке WYPRAWA означает военный поход: WYPRAWA MOSKIEWSKA. Для обычной поездки есть PODRÓŻ, для прогулки WYCIECZKA, и разница ощутима: WYPRAWA требует сборов и предполагает трудность." }
