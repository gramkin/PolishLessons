etymology: "От глагола WYPRAWIĆ, то есть приставка WY- и основа PRAWIĆ, восходящая к праславянскому *praviti «направлять, делать правильным», от *pravъ «прямой, правильный». Корень этот русскому знаком насквозь: «править», «направить», «исправить», «справить». Исходный смысл слова — то, что снаряжено и отправлено, и отсюда расходятся все три значения: военный поход, научная экспедиция и приданое. Любопытно, что русский построил от того же корня «отправиться» и «отправление», но существительного для похода из него не сделал, взяв латинское «экспедицию» и исконный «поход» от «ходить». Та же основа дала и NAPRAWA из более ранней карточки."
memory: "Корень знакомый, хотя слово незнакомо: wyprawić от prawić, то же гнездо, что «править, направить, исправить». Значит снаряжённое путешествие: wyprawa w góry, wyprawa polarna, а исторически военный поход и крестовый поход, wyprawa krzyżowa. Отсюда же второе значение, приданое — то, чем снаряжали в новый дом. Родительный множественного wypraw с нулевым окончанием, дательный и местный wyprawie со смягчением w."
idioms:
  - { pl: "wyprawa krzyżowa", ru: "крестовый поход" }
