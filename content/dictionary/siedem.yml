# review
id: siedem
format: 2
lemma: "siedem"
rank: 1033
pos: num
pron: { cyr: "ще́дэм" }
senses:
  - id: seven
    ru: "семь"
    examples:
      - pl: "Tydzień ma siedem dni."
        ru: "В неделе семь дней."
        source: { kind: translated, id: 623122 }
      - pl: "Dwa razy siedem jest czternaście."
        ru: "Дважды семь — четырнадцать."
        source: { kind: translated, id: 969806 }
      - pl: "Czy jest was siedem?"
        ru: "Вас семеро?"
        source: { kind: translated, id: 10589314 }
  - id: virile
    ru: "siedmiu — семеро (о мужчинах и в косвенных падежах)"
    examples:
      - pl: "Jest nas siedmiu."
        ru: "Нас семеро."
        source: { kind: translated, id: 2078053 }
      - pl: "On ma siedmiu synów."
        ru: "У него семь сыновей."
        source: { kind: translated, id: 8718737 }
      - pl: "Masz siedmiu synów."
        ru: "У тебя семь сыновей."
        source: { kind: translated, id: 12562267 }
  - id: collective
    ru: "siedmioro — семеро (собирательное)"
    note: "Для детей и смешанных групп, как dziesięcioro."
    examples:
      - pl: "Masz siedmioro dzieci."
        ru: "У тебя семеро детей."
        source: { kind: translated, id: 3677219 }
      - pl: "Ona ma aż siedmioro dzieci."
        ru: "У неё целых семеро детей."
        source: { kind: translated, id: 366736 }
      - pl: "Czy jest was siedmioro?"
        ru: "Вас семеро?"
        source: { kind: translated, id: 10589312 }
notes:
  - { kind: government, text: "Числительное требует родительного падежа множественного числа: siedem dni «семь дней», siedem lat «семь лет» — как и русское «семь дней»." }
  - { kind: usage, text: "Три формы на выбор, и выбор зависит от того, о ком речь: siedem (вещи), siedmiu (мужчины), siedmioro (дети и смешанные группы). Ona ma siedmiu synów, но Ona ma siedmioro dzieci." }
  - { kind: usage, text: "Творительный — siedmioma: между siedmioma a ośmioma." }
  - { kind: usage, text: "siedem grzechów głównych — «семь смертных грехов». А brzydki jak siedem grzechów głównych значит «страшен как смертный грех»." }
collocations:
  - { pl: "siedem dni", ru: "семь дней" }
  - { pl: "siedmiu synów", ru: "семь сыновей" }
  - { pl: "siedmioro dzieci", ru: "семеро детей" }
  - { pl: "siedem grzechów", ru: "семь грехов" }
family:
  - { pl: "siódmy", ru: "седьмой", relation: derived }
  - { pl: "siedemnaście", ru: "семнадцать", relation: derived }
etymology: "Праславянское *sedmь из праиндоевропейского *septḿ̥ — то же слово, что русское «семь» и латинское septem."
memory: "siedem — «семь», с родительным падежом: siedem dni. Но форм три, и выбирает их состав группы: siedem (вещи), siedmiu (мужчины), siedmioro (дети). В русском такого различения нет."
idioms:
  - { pl: "siedem grzechów głównych", ru: "семь смертных грехов" }
  - { pl: "brzydki jak siedem grzechów", ru: "страшен как смертный грех" }
  - { pl: "od siedmiu boleści", ru: "никудышный" }
formExamplesSkip:
  - { form: "siedm", reason: "устаревшая форма: в современном языке siedem" }
  - { form: "siedmio", reason: "не самостоятельная форма, а первая часть сложных слов: siedmioletni, siedmiokrotny" }
  - { form: "siedmiorga", reason: "родительный падеж собирательного числительного в живой речи почти не встречается" }
  - { form: "siedmiorgiem", reason: "творительный падеж собирательного числительного в живой речи почти не встречается" }
  - { form: "siedmiorgu", reason: "дательный и предложный собирательного числительного в живой речи почти не встречаются" }
