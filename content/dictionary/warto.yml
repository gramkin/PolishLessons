# review
id: warto
format: 2
lemma: "warto"
rank: 1587
pos: adv
pron: { cyr: "ва́рто" }
senses:
  - id: worth
    ru: "стоит, имеет смысл (+ инфинитив)"
    examples:
      - pl: "Warto przeczytać tę opowieść."
        ru: "Этот рассказ стоит прочитать."
        source: { kind: authored }
      - pl: "Jego teorię warto rozważyć."
        ru: "Его теорию стоит рассмотреть."
        source: { kind: authored }
      - pl: "Nie warto się kłócić."
        ru: "Не стоит ссориться."
        source: { kind: authored }
      - pl: "Warto było czekać."
        ru: "Стоило подождать."
        source: { kind: authored }
      - pl: "Zawsze warto spróbować."
        ru: "Всегда стоит попробовать."
        source: { kind: authored }
notes:
  - { kind: government, text: "Слово безличное и требует ИНФИНИТИВА: warto zapytać «стоит спросить». Подлежащего у него нет вовсе, личных форм тоже: нельзя сказать «ja warto». Прошедшее и будущее образуются вспомогательным глаголом — warto było «стоило», warto będzie «стоит будет». Русское «стоит» ведёт себя точно так же, и это редкий случай полного совпадения конструкции." }
  - { kind: usage, text: "Отрицание — nie warto «не стоит». Рядом стоит opłaca się «выгодно, окупается»: warto говорит о смысле, opłaca się о выгоде. Поэтому warto przeczytać, но opłaca się kupić hurtowo." }
  - { kind: false-friend, text: "Образовано от wart «стоящий чего-л.», а само wart — старое германское заимствование (ср. немецкое Wert «ценность», английское worth). Русское «стоить» идёт от другого корня, так что совпадает только конструкция, а не слово." }
collocations:
  - { pl: "warto spróbować", ru: "стоит попробовать" }
  - { pl: "nie warto", ru: "не стоит" }
  - { pl: "warto wiedzieć", ru: "полезно знать" }
family:
  - { pl: "wart", ru: "стоящий, достойный", relation: root, id: wart }
  - { pl: "wartość", ru: "ценность, стоимость", relation: derived, id: wartosc }
etymology: "От прилагательного wart «стоящий чего-л.», которое пришло в польский из германских языков — тот же корень, что в немецком Wert «ценность» и английском worth. Отсюда же wartość «ценность, стоимость» и wartościowy «ценный». Русское «стоить» к этому корню не относится."
memory: "warto + инфинитив, как русское «стоит» + инфинитив: warto spróbować «стоит попробовать». Формы по лицам нет вообще; прошедшее — warto było. Корень тот же, что в немецком Wert."
idioms:
  - { pl: "nie warto", ru: "не стоит, не имеет смысла" }
  - { pl: "warto wiedzieć", ru: "полезно знать" }
formExamples:
  - form: "warto"
    pl: "Naprawdę warto."
    ru: "Правда стоит."
    source: { kind: authored }
  - form: "warto"
    pl: "Czy warto tam jechać?"
    ru: "Стоит ли туда ехать?"
    source: { kind: authored }
  - form: "warto"
    pl: "Warto zapytać, zanim kupisz."
    ru: "Стоит спросить, прежде чем покупать."
    source: { kind: authored }
