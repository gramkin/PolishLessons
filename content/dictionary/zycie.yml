id: zycie
format: 2
lemma: "życie"
rank: 358
pos: noun
pron: { cyr: "жы́це" }
senses:
  - id: life
    ru: "жизнь"
    examples:
      - pl: "Życie to podróż."
        ru: "Жизнь - это путешествие."
        source: { kind: tatoeba, id: 3783024 }
      - pl: "Życie jest piękne."
        ru: "Жизнь прекрасна."
        source: { kind: tatoeba, id: 350044 }
      - pl: "Miałem dobre życie."
        ru: "У меня была хорошая жизнь."
        source: { kind: tatoeba, id: 8428488 }
  - id: life-inst
    ru: "жизнь (в косвенных падежах и оборотах)"
    examples:
      - pl: "Ryzykował życiem."
        ru: "Он рисковал жизнью."
        source: { kind: translated, id: 998615 }
      - pl: "Co byście zmienili w życiach kobiet z Rumunii?"
        ru: "Что бы вы изменили в жизни румынских женщин?"
        source: { kind: translated, id: 10706672 }
      - pl: "Całe życie mieszkał w tym mieście."
        ru: "Всю жизнь он прожил в этом городе."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Существительное от żyć «жить»: życie — «жизнь». Не путайте формы: Chcę żyć «Хочу жить» (глагол), но To moje życie «Это моя жизнь» (существительное)." }
  - { kind: usage, text: "całe życie — «всю жизнь», w życiu — «в жизни», nigdy w życiu — «никогда в жизни»." }
  - { kind: usage, text: "ryzykować życiem — «рисковать жизнью»; uratować komuś życie — «спасти кому-то жизнь»." }
collocations:
  - { pl: "całe życie", ru: "всю жизнь" }
  - { pl: "w życiu", ru: "в жизни" }
  - { pl: "życie prywatne", ru: "личная жизнь" }
  - { pl: "nigdy w życiu", ru: "никогда в жизни" }
etymology: "От żyć «жить» с суффиксом -cie, праславянское *žitьje; то же строение, что у русского «житьё», а значение — «жизнь»."
memory: "życie — «жизнь», существительное от żyć «жить». Całe życie значит «всю жизнь», а nigdy w życiu — «никогда в жизни»."
idioms:
  - { pl: "nad życie", ru: "больше жизни" }
  - { pl: "jesień życia", ru: "осень жизни" }
  - { pl: "dać znak życia", ru: "подать признак жизни" }
