# review
id: zolty
format: 2
lemma: "żółty"
rank: 2530
pos: adj
pron: { cyr: "жу́уты" }
senses:
  - id: yellow
    ru: "жёлтый"
    examples:
      - pl: "Banany są żółte."
        ru: "Бананы жёлтые."
        source: { kind: tatoeba, id: 1350472 }
      - pl: "Oto żółta róża."
        ru: "Вот жёлтая роза."
        source: { kind: tatoeba, id: 610663 }
      - pl: "Kanarek to mały żółty ptak."
        ru: "Канарейка — маленькая желтая птичка."
        source: { kind: tatoeba, id: 11671417 }
  - id: yellow-things
    ru: "жёлтый (о предметах, одежде)"
    examples:
      - pl: "Miał na sobie szarą koszulę i żółty krawat."
        ru: "У него была серая рубашка и жёлтый галстук."
        source: { kind: tatoeba, id: 606080 }
      - pl: "Całe miasto pokryte było żółtym pyłem."
        ru: "Весь город был покрыт жёлтой пылью."
        source: { kind: tatoeba, id: 8666083 }
notes:
  - { kind: false-friend, text: "Русское «жёлтый» и польское żółty — одно слово. Но пишется оно с двумя разными буквами ó и ł, а читается «жу́уты»: ó даёт у, ł — тоже у." }
  - { kind: government, text: "Обычное прилагательное; наречие — żółto, существительное — żółć «жёлчь; жёлтый цвет»." }
  - { kind: usage, text: "Żółte strony — «жёлтые страницы», справочник. Ser żółty «твёрдый сыр», буквально «жёлтый сыр», в противоположность ser biały «творогу»." }
  - { kind: usage, text: "Не путайте żółty «жёлтый» с żółw «черепаха» — начало одинаковое, слова разные." }
collocations:
  - { pl: "żółte strony", ru: "жёлтые страницы" }
  - { pl: "ser żółty", ru: "твёрдый сыр" }
etymology: "Праславянское *žьltъ; русское «жёлтый» — то же слово."
memory: "żółty — «жёлтый», читается «жу́уты»: и ó, и ł дают звук у. Ser żółty — твёрдый сыр, в отличие от ser biały «творога»."
idioms:
  - { pl: "żółte strony", ru: "жёлтые страницы" }
  - { pl: "ser żółty", ru: "твёрдый сыр" }
