etymology: "Из французского CRAVATE, которое идёт от CROATE «хорват»: в семнадцатом веке хорватские кавалеристы на французской службе носили повязанный на шее платок, и французы перенесли название народа на саму вещь. Польский взял слово из французского напрямую, сохранив и форму, и значение. Русский пошёл другим путём и заимствовал немецкое HALSTUCH, из HALS «шея» и TUCH «платок», откуда «галстук» — название по назначению, а не по носителю. Поэтому родственников у польского слова надо искать не в русском, а в названии страны: KRAWAT и KROACJA восходят к одному имени, и это самая надёжная подсказка для запоминания."
memory: "Галстук, но от слова «хорват»: французское cravate из croate, по хорватским кавалеристам, носившим шейный платок. Русский «галстук» — из немецкого Halstuch «шейный платок», так что подсказки нет, кроме созвучия krawat и Kroacja. Два родительных, krawata и krawatu, оба правильные. Местный krawacie с t→c: w krawacie, как namiocie и świcie. Галстук-бабочка — не krawat, а muszka."
idioms:
