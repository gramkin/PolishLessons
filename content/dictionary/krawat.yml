notes:
  - { kind: false-friend, text: "Русский «галстук» и польский KRAWAT взяты из разных языков, и ни одно не помогает угадать другое. KRAWAT пришёл из французского CRAVATE, а оно — от слова CROATE «хорват»: в семнадцатом веке хорватские наёмники во французской службе носили на шее платок, и французы назвали эту вещь по народу. Русский же взял немецкое HALSTUCH, буквально «шейный платок», и получилось «галстук». Так два языка назвали один предмет по двум разным признакам, по носителю и по месту. Запоминать стоит через созвучие с «Хорватией»: KRAWAT и KROACJA происходят от одного имени." }
  - { kind: government, text: "Мужской род, неодушевлённое, и у него два родительных: KRAWATA и KRAWATU. Первый обычнее в живой речи, второй встречается в письменном языке, и оба нормативны — это редкий случай, когда выбирать можно свободно. Винительный равен именительному: ZAWIĄZAĆ KRAWAT. Местный KRAWACIE, с чередованием T в C перед -IE: W KRAWACIE «в галстуке». Что делают с галстуком — ZAWIĄZAĆ «завязать», ROZWIĄZAĆ «развязать», POPRAWIĆ «поправить». Родительный множественного KRAWATÓW." }
  - { kind: pronunciation, text: "Читается «кра́ват», ударение на предпоследнем слоге из двух. Начальное KR без призвука. Буква W в середине звучит «в», а конечное T — ясным «т», без оглушения. В местном падеже KRAWACIE буква T переходит в C и читается «ць»: «крава́це», и ударение сдвигается на предпоследний слог, то есть на второй. Это то же чередование, что в NAMIOT и NAMIOCIE, ŚWIT и ŚWICIE: три карточки этой партии показывают одно правило на трёх словах." }
  - { kind: usage, text: "Частотные сочетания: ZAWIĄZAĆ KRAWAT «завязать галстук», POPRAWIĆ KRAWAT, KRAWAT W PASKI «галстук в полоску», BEZ KRAWATA «без галстука», W KRAWACIE. В приглашениях пишут KRAWAT OBOWIĄZKOWY, и это соответствует русскому «форма одежды — костюм с галстуком». Галстук-бабочка называется MUSZKA, буквально «мушка», а не KRAWAT. Выражение LUŹNY KRAWAT о небрежно повязанном галстуке употребляется и переносно, о нестрогой обстановке." }
