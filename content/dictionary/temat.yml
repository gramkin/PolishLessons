# review
id: temat
format: 2
lemma: "temat"
rank: 537
pos: noun
pron: { cyr: "тэ́мат" }
senses:
  - id: topic
    ru: "тема, предмет разговора"
    note: "Управление: na temat czegoś — «на тему чего-то», с родительным."
    examples:
      - pl: "Nie chcę rozmawiać na ten temat."
        ru: "Я не хочу говорить на эту тему."
        source: { kind: tatoeba, id: 2146153 }
      - pl: "To dziwne, że nic nie wiesz na ten temat."
        ru: "Странно, что вы ничего не знаете об этом."
        source: { kind: tatoeba, id: 919912 }
      - pl: "Zmieniła temat."
        ru: "Она сменила тему."
        source: { kind: translated, id: 2998150 }
  - id: subject
    ru: "тема работы, доклада, лекции"
    note: "«Темой чего-то является…» — с творительным: Tematem wykładu jest…"
    examples:
      - pl: "Masz już temat pracy?"
        ru: "Ты уже определился с темой диплома?"
        source: { kind: tatoeba, id: 351927 }
      - pl: "Naszym tematem na ten tydzień jest globalne ocieplenie."
        ru: "Наша тема на этой неделе — глобальное потепление."
        source: { kind: translated, id: 11002989 }
      - pl: "Głównym tematem tej książki jest wojna o niepodległość USA."
        ru: "Главная тема этой книги — война за независимость США."
        source: { kind: translated, id: 2482551 }
notes:
  - { kind: government, text: "na temat czegoś — с родительным падежом: rozmawiać na temat pracy «говорить на тему работы». Указательное — na ten temat «на эту тему»." }
  - { kind: usage, text: "«Темой чего-либо является…» строится с творительным: Tematem wykładu jest globalne ocieplenie." }
  - { kind: usage, text: "Разговорное w temacie «по теме, в теме» значит то же, что книжное na temat: Nie jestem ekspertem w tym temacie." }
  - { kind: usage, text: "Частые обороты: zmienić temat «сменить тему», wrócić do tematu «вернуться к теме», odbiegać od tematu «отклоняться от темы», nie na temat «не по теме»." }
collocations:
  - { pl: "na ten temat", ru: "на эту тему" }
  - { pl: "zmienić temat", ru: "сменить тему" }
  - { pl: "temat pracy", ru: "тема работы" }
  - { pl: "wrócić do tematu", ru: "вернуться к теме" }
family:
  - { pl: "tematyka", ru: "тематика", relation: derived }
  - { pl: "tematyczny", ru: "тематический", relation: derived }
etymology: "Из греческого θέμα «положенное, поставленное» через латинское thema — то же слово, что русское «тема»."
memory: "temat — «тема», и отличие от русского в управлении: на тему чего-то будет na temat czegoś с родительным (rozmawiać na temat pracy), а указательное — na ten temat «на эту тему». Зато «темой чего-то является…» идёт с творительным: Tematem wykładu jest globalne ocieplenie. Разговорное w temacie значит то же, что na temat."
idioms:
  - { pl: "zmienić temat", ru: "сменить тему" }
  - { pl: "nie na temat", ru: "не по теме" }
  - { pl: "wrócić do tematu", ru: "вернуться к теме" }
