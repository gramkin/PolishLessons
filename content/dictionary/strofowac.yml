# review
id: strofowac
format: 2
lemma: "strofować"
rank: 6074
pos: verb
pron: { cyr: "строфо́ваць" }
senses:
  - id: reprimand
    ru: "отчитывать, бранить, делать выговор (за проступок)"
    examples:
      - pl: "Widziałem, jak matka go strofuje."
        ru: "Я видел, как мать его отчитывает."
        source: { kind: translated, id: 510043 }
      - pl: "Dana często strofuje jego mama."
        ru: "Дана часто отчитывает его мама."
        source: { kind: translated, id: 3704135 }
      - pl: "Szef strofował nas za każde spóźnienie."
        ru: "Начальник отчитывал нас за каждое опоздание."
        source: { kind: authored }
  - id: rebuke
    ru: "одёргивать, призывать к порядку замечанием"
    examples:
      - pl: "Nauczycielka co chwilę strofowała hałasujących uczniów."
        ru: "Учительница то и дело одёргивала шумящих учеников."
        source: { kind: authored }
      - pl: "Babcia strofowała mnie wzrokiem, gdy mówiłem z pełnymi ustami."
        ru: "Бабушка одёргивала меня взглядом, когда я говорил с набитым ртом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "К «строфе» отношения не имеет: стихотворная строфа по-польски STROFA, а STROFOWAĆ пришло из немецкого strafen, «наказывать». Ближайший родственник в русском — «штраф», от немецкого Strafe." }
  - { kind: government, text: "Кого — винительный, за что — ZA + винительный: strofować syna za bałagan, «отчитывать сына за беспорядок». Где и при ком — przy kimś: strofować kogoś przy innych, «отчитывать кого-то при всех»." }
  - { kind: usage, text: "Несовершенный вид. Совершенный ZESTROFOWAĆ существует, но редок; «отчитать» один раз обычно передают через SKARCIĆ, ZBESZTAĆ или разговорное OCHRZANIĆ: matka go skarciła, «мать его отчитала»." }
  - { kind: register, text: "Книжное и чуть старомодное слово: в прозе, в рассказах о родителях, учителях и священниках. В живой речи скажут besztać, ochrzaniać, а грубее opieprzać. По тону ближе к русскому «распекать», «журить», чем к «ругать»." }
  - { kind: pronunciation, text: "«строфо́ваць», ударение на предпоследнем слоге, -fo-. В настоящем времени -owa- сменяется на -uj-: strofuję, strofujesz — «строфу́е», «строфу́еш»." }
collocations:
  - { pl: "strofować kogoś za coś", ru: "отчитывать кого-то за что-то" }
  - { pl: "surowo strofować", ru: "строго отчитывать" }
  - { pl: "strofować przy wszystkich", ru: "отчитывать при всех" }
  - { pl: "strofować wzrokiem", ru: "одёргивать взглядом" }
family:
  - { pl: "zestrofować", ru: "отчитать (редк.)", relation: aspect }
  - { pl: "strofowanie", ru: "выговоры, нотации", relation: derived }
etymology: "Из немецкого strafen, «наказывать», через старопольское STROFOWAĆ, «наказывать, карать». Значение смягчилось до «отчитывать словом». Тот же немецкий корень дал русское «штраф», а к греческой «строфе» слово отношения не имеет."
memory: "Strofować — «оштрафовать словом»: немецкое strafen, как в «штраф». Не путать со «строфой». Strofuję — я отчитываю."
idioms:
  - { pl: "strofować kogoś jak małe dziecko", ru: "отчитывать кого-то как маленького" }
  - { pl: "strofować kogoś wzrokiem", ru: "укоризненно смотреть на кого-то, одёргивать взглядом" }
