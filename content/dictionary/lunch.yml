notes:
  - { kind: false-friend, text: "lunch и obiad — не одно и то же. Obiad это главная еда дня, обычно между двумя и четырьмя, а lunch — лёгкий дневной перекус, чаще рабочий." }
  - { kind: pronunciation, text: "Английское заимствование, читается «ланч». Склоняется при этом вполне по-польски: lunchu, lunchem." }
  - { kind: usage, text: "Мужской род неодушевлённый: ten lunch, tego lunchu, przed lunchem." }
  - { kind: usage, text: "przerwa na lunch «перерыв на обед» — стандартный оборот офисной речи." }
collocations:
  - { pl: "zjeść lunch", ru: "пообедать" }
