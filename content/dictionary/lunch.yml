notes:
  - { kind: false-friend, text: "lunch и obiad — не одно и то же. Obiad это главная еда дня, обычно между двумя и четырьмя, а lunch — лёгкий дневной перекус, чаще рабочий." }
  - { kind: pronunciation, text: "Английское заимствование, читается «ланч». Склоняется при этом вполне по-польски: lunchu, lunchem." }
  - { kind: usage, text: "Мужской род неодушевлённый: ten lunch, tego lunchu, przed lunchem." }
  - { kind: usage, text: "przerwa na lunch «перерыв на обед» — стандартный оборот офисной речи." }
collocations:
  - { pl: "zjeść lunch", ru: "пообедать" }
  - { pl: "pora lunchu", ru: "обеденное время" }
  - { pl: "przerwa na lunch", ru: "перерыв на обед" }
  - { pl: "lunch biznesowy", ru: "бизнес-ланч" }
etymology: "Из английского lunch, сокращения от luncheon. В польском слово закрепилось за лёгким дневным перекусом, тогда как главная еда дня осталась за своим словом obiad."
memory: "lunch читается «ланч» и значит лёгкий дневной перекус, обычно на работе. Главная еда дня — это obiad, и путать их не стоит. Склоняется по-польски: lunchu, lunchem."
idioms:
  - { pl: "pora lunchu", ru: "обеденное время" }
  - { pl: "przerwa na lunch", ru: "перерыв на обед" }
formExamplesSkip:
  - { form: "lunchu", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
