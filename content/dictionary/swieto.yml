# review
id: swieto
format: 2
lemma: "święto"
rank: 1303
pos: noun
pron: { cyr: "сьве́нто" }
senses:
  - id: holiday
    ru: "праздник, праздничный день"
    examples:
      - pl: "W to święto wszystkie szkoły są zamknięte."
        ru: "В этот праздник все школы закрыты."
        source: { kind: tatoeba, id: 817808 }
      - pl: "Jutro jest święto."
        ru: "Завтра праздник."
        source: { kind: translated, id: 350816 }
      - pl: "Pierwszy maja jest świętem."
        ru: "Первое мая — праздник."
        source: { kind: translated, id: 12259401 }
  - id: christmas
    ru: "во множественном числе Święta — Рождество, рождественские праздники"
    examples:
      - pl: "Boże Narodzenie to szczególne święto."
        ru: "Рождество Христово – особенный праздник."
        source: { kind: tatoeba, id: 587705 }
      - pl: "Idą święta."
        ru: "Приближаются праздники."
        source: { kind: translated, id: 366196 }
notes:
  - { kind: usage, text: "Средний род: święto, święta, świętu. Множественное Święta очень часто значит именно Рождество — Wesołych Świąt! это «Счастливого Рождества!»." }
  - { kind: usage, text: "Родительный множественного — świąt, с носовым ą: życzę wesołych świąt." }
  - { kind: government, text: "В именной части сказуемого нужен творительный: Pierwszy maja jest świętem «Первое мая — праздник»." }
  - { kind: false-friend, text: "Различайте три похожих слова: święto «праздник» (средний род), święta «святая» и świat «мир, свет»." }
collocations:
  - { pl: "Wesołych Świąt", ru: "счастливого Рождества" }
  - { pl: "święto narodowe", ru: "национальный праздник" }
  - { pl: "po świętach", ru: "после праздников" }
etymology: "От święty «святой», праславянское *svętъ. Русское «святой» того же корня, а значение «праздник» выросло из «священного дня» — ср. русские «святки»."
memory: "święto — «праздник», от święty «святой», ровно как русские «святки» от «святого». Главная ловушка — множественное число: Święta почти всегда значит Рождество, а Wesołych Świąt! — это «Счастливого Рождества!»."
idioms:
  - { pl: "Wesołych Świąt", ru: "счастливого Рождества" }
  - { pl: "od święta", ru: "по праздникам, изредка" }
  - { pl: "święta Bożego Narodzenia", ru: "Рождество, рождественские праздники" }
formExamplesSkip:
  - { form: "święta", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
  - { form: "święto", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
