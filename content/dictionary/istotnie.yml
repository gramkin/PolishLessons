# review
id: istotnie
format: 2
lemma: "istotnie"
rank: 2012
pos: adv
pron: { cyr: "исто́тне" }
senses:
  - id: indeed
    ru: "действительно, в самом деле"
    examples:
      - pl: "To istotnie rozsądny człowiek."
        ru: "Это действительно разумный человек."
        source: { kind: translated, id: 956837 }
      - pl: "Jak mówi przysłowie, istotnie czas to pieniądz."
        ru: "Как гласит пословица, время действительно деньги."
        source: { kind: translated, id: 360498 }
      - pl: "Istotnie, niezłym pomysłem byłoby rozpoczęcie właśnie teraz."
        ru: "В самом деле, было бы неплохо начать прямо сейчас."
        source: { kind: translated, id: 1351207 }
  - id: significantly
    ru: "существенно, значительно"
    examples:
      - pl: "Sytuacja istotnie się zmieniła."
        ru: "Ситуация существенно изменилась."
        source: { kind: authored }
      - pl: "To istotnie wpływa na wynik."
        ru: "Это существенно влияет на результат."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два значения. «Действительно» — подтверждение чужих слов, обычно в начале предложения. «Существенно» — степень, обычно перед глаголом." }
  - { kind: usage, text: "Наречие от istotny «существенный», от istota «суть, существо»." }
  - { kind: false-friend, text: "Не «истинно». Для «истинно, правдиво» есть prawdziwie; istotnie — это «действительно» или «существенно»." }
collocations:
  - { pl: "istotnie się różnić", ru: "существенно различаться" }
  - { pl: "istotnie wzrosnąć", ru: "существенно вырасти" }
etymology: "От istotny «существенный», от istota «суть, существо», от jest «есть». Русское «существо» и «существенный» построены на том же образе бытия."
memory: "istotnie — «действительно» (подтверждение) или «существенно» (степень). Корень istota «суть»: то, что касается сути дела."
idioms:
  - { pl: "istotnie rzecz biorąc", ru: "по сути дела" }
