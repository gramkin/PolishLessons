notes:
  - { kind: false-friend, text: "Это русское слово в польском языке: SOJUSZ заимствован из русского «союза» и значит ровно то же — союз государств, военный или политический блок. Исконные польские слова для той же мысли другие: PRZYMIERZE «союз, договор о союзе», более старое и торжественное, и ZWIĄZEK «союз, связь, объединение». Между ними есть разделение, которое стоит держать в голове. SOJUSZ и PRZYMIERZE — о государствах и армиях: SOJUSZ PÓŁNOCNOATLANTYCKI «Североатлантический союз». ZWIĄZEK — обо всём остальном: ZWIĄZEK ZAWODOWY «профсоюз», ZWIĄZEK MAŁŻEŃSKI «брак», ZWIĄZEK CHEMICZNY «химическое соединение». Поэтому русское «союз» переводится на польский тремя разными словами в зависимости от того, о чём речь." }
  - { kind: government, text: "Мужской род, неодушевлённое. С кем союз — предлог Z с творительным: SOJUSZ Z FRANCJĄ, W SOJUSZU Z SĄSIADEM. Какой союз — прилагательное: SOJUSZ WOJSKOWY, SOJUSZ POLITYCZNY, SOJUSZ OBRONNY. Частотные глаголы: ZAWRZEĆ SOJUSZ «заключить союз», ZERWAĆ SOJUSZ «разорвать союз», WEJŚĆ W SOJUSZ «вступить в союз», PRZYSTĄPIĆ DO SOJUSZU «присоединиться к союзу» — последнее требует родительного с предлогом DO. Участник союза — SOJUSZNIK «союзник», прилагательное SOJUSZNICZY «союзнический»." }
  - { kind: usage, text: "Основа кончается на -SZ, и это даёт то же колебание родительного множественного, что у слов на -RZ: правильны и SOJUSZY, и SOJUSZÓW. Форма на -Y звучит современнее и встречается чаще, форма на -ÓW отдаёт книжностью и историей. То же у KAPELUSZY и KAPELUSZÓW, у TOWARZYSZY и TOWARZYSZÓW, и у RYCERZY с RYCERZÓW, где конечный согласный другой, а колебание то же. Выбирать можно любую форму, но в одном тексте держаться стоит одной. Остальное склонение без неожиданностей: родительный единственного SOJUSZU, местный тоже SOJUSZU, то есть две позиции одной формой." }
  - { kind: pronunciation, text: "Читается «со́юш», два слога, ударение на первом. Сочетание OJ даёт «ой», но следующее U превращает его в «ою», так что слово звучит почти как русский «союз» — с одной важной разницей на конце. Польское SZ это «ш», и конечный согласный здесь глухой изначально, поэтому SOJUSZ произносится «союш», а не «союз». Как только добавляется гласная, SZ остаётся глухим: SOJUSZU читается «сою́шу», SOJUSZEM — «сою́шэм». Это и есть единственное, что надо поправить в русской привычке." }
