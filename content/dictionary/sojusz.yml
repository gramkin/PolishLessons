etymology: "Заимствовано из русского «союз», который сам составлен из приставки «со-» и корня «уз-», того же, что в «узах», «узле», «вязать». Польский взял слово в девятнадцатом или двадцатом веке, уже готовым, и приспособил только написание: русское «з» на конце передано как SZ, потому что в польском конечный звук здесь глухой. Поэтому SOJUSZ — один из немногих случаев, когда польский словарь прямо указывает на русский источник, и для учащегося это редкая удача: ничего запоминать не нужно. Исконные польские способы сказать то же — PRZYMIERZE, от PRZY- и MIERZYĆ в старом смысле «договариваться», и ZWIĄZEK, от ZWIĄZAĆ «связать», то есть построенный на том же образе связи, что и русский «союз», только без заимствования. Производное SOJUSZNIK «союзник» образовано уже по-польски, суффиксом -NIK."
memory: "sojusz — это русский «союз», заимствованный в польский; значение то же, менять ничего не нужно. Но русское «союз» переводится тремя словами по контексту: sojusz и przymierze — о государствах и армиях, związek — обо всём прочем (związek zawodowy «профсоюз», związek małżeński «брак»). Конечное sz глухое: «со́юш», не «союз». Два родительных множественного, sojuszy и sojuszów, как kapeluszy и kapeluszów."
