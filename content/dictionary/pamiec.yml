# review
id: pamiec
format: 2
lemma: "pamięć"
rank: 1089
pos: noun
pron: { cyr: "па́менць" }
senses:
  - id: memory
    ru: "память"
    examples:
      - pl: "Masz kiepską pamięć."
        ru: "У тебя плохая память!"
        source: { kind: translated, id: 605889 }
      - pl: "On ma fotograficzną pamięć."
        ru: "У него фотографическая память."
        source: { kind: translated, id: 5183767 }
      - pl: "Mam pamięć złotej rybki."
        ru: "У меня память как у золотой рыбки."
        source: { kind: translated, id: 8761437 }
  - id: by-heart
    ru: "na pamięć — наизусть"
    examples:
      - pl: "Znam tę piosenkę na pamięć."
        ru: "Я эту песню наизусть знаю."
        source: { kind: translated, id: 13575107 }
      - pl: "Powiedz to proszę z pamięci."
        ru: "Скажи это, пожалуйста, по памяти."
        source: { kind: translated, id: 5140011 }
      - pl: "Mam to świeżo w pamięci."
        ru: "У меня это свежо в памяти."
        source: { kind: translated, id: 766097 }
  - id: madly
    ru: "bez pamięci — без памяти, без ума"
    examples:
      - pl: "Jest w niej zakochany bez pamięci."
        ru: "Он влюблён в неё без памяти."
        source: { kind: translated, id: 440457 }
      - pl: "Zapisz te słowa w pamięci."
        ru: "Запиши эти слова в памяти."
        source: { kind: translated, id: 7679639 }
      - pl: "Ile pamięci ma to cudo?"
        ru: "Сколько памяти у этого чуда?"
        source: { kind: translated, id: 3743835 }
notes:
  - { kind: usage, text: "Женский род на -ść, как kość «кость» и radość «радость»: ta pamięć, tej pamięci, tą pamięcią." }
  - { kind: usage, text: "na pamięć — «наизусть»: znać na pamięć «знать наизусть», uczyć się na pamięć «учить наизусть». А z pamięci значит «по памяти»." }
  - { kind: usage, text: "bez pamięci — «без памяти, без ума»: zakochany bez pamięci «влюблён без памяти». Совпадает с русским дословно." }
  - { kind: usage, text: "Слово покрывает и компьютерную память: Ile pamięci ma ten komputer? «Сколько памяти у этого компьютера?»." }
collocations:
  - { pl: "na pamięć", ru: "наизусть" }
  - { pl: "z pamięci", ru: "по памяти" }
  - { pl: "bez pamięci", ru: "без памяти" }
  - { pl: "dobra pamięć", ru: "хорошая память" }
family:
  - { pl: "pamiętać", ru: "помнить", relation: root, id: pamietac }
  - { pl: "pamiątka", ru: "сувенир, памятка", relation: derived }
  - { pl: "zapamiętać", ru: "запомнить", relation: derived }
etymology: "Праславянское *pamętь — то же слово, что русская «память», и род совпадает: оба женские."
memory: "pamięć — «память», женского рода на -ść, как kość. Запомните три оборота: na pamięć «наизусть», z pamięci «по памяти» и bez pamięci «без памяти», который совпадает с русским дословно."
idioms:
  - { pl: "na pamięć", ru: "наизусть" }
  - { pl: "bez pamięci", ru: "без памяти" }
  - { pl: "pamięć złotej rybki", ru: "память как у золотой рыбки" }
  - { pl: "kurza pamięć", ru: "куриная память" }
formExamplesSkip:
