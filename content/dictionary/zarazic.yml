notes:
  - { kind: false-friend, text: "ZARAZIĆ почти совпадает с русским «заразить», но польское ZARAZA — «чума, мор», а в сленге «зараза» как ругательство: TY ZARAZO! Русская «зараза» в смысле инфекции — INFEKCJA, ZAKAŻENIE. В медицине чаще ZAKAZIĆ, ZAKAŻENIE: ZAKAŻENIE KRWI — «заражение крови»." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ZARAŻONY, «заражённый», и деепричастие ZARAZIWSZY. Чередование Z → Ż: ZARAZIĆ, но ZARAŻĘ, ZARAŻĄ, ZARAŻONY. Видовой партнёр — ZARAŻAĆ: GRYPA ŁATWO ZARAŻA." }
  - { kind: government, text: "Кого — винительный, чем — творительный без предлога: ZARAZIĆ KOGOŚ GRYPĄ, ŚMIECHEM. Возвратное ZARAZIĆ SIĘ — «заразиться»: от кого — OD с родительным: ZARAZIĆ SIĘ OD BRATA; чем — творительный: ZARAZIĆ SIĘ ODRĄ." }
  - { kind: pronunciation, text: "Читается «зара́зиць», три слога, ударение на предпоследнем. ZI — мягкое «зи», конечное Ć — «ць». ZARAŻĘ — «зара́жэ»: Ż твёрдое, как русское «ж»." }
  - { kind: register, text: "Нейтральное бытовое и медицинское слово. В переносном смысле — тёплое: ZARAZIĆ PASJĄ, MIŁOŚCIĄ DO KSIĄŻEK. ZARAŻAĆ ŚMIECHEM — «заражать смехом». В эпидемиологии — книжное ZAKAŻENIE, ZAKAŻONY." }
collocations:
  - { pl: "zarazić się grypą", ru: "заразиться гриппом" }
  - { pl: "zarazić entuzjazmem", ru: "заразить энтузиазмом" }
  - { pl: "zarazić się od kogoś", ru: "заразиться от кого-то" }
family:
  - { pl: "zarazac", ru: "заражать", relation: aspect }
  - { pl: "zaraza", ru: "чума, мор; зараза", relation: root, id: zaraza }
