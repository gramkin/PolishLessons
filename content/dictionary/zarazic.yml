etymology: "Приставка ZA- плюс корень RAZ- «удар», тот же, что в RAZ «раз» и в русском «разить», «поразить», «зараза». Заразить — буквально «поразить, ударить болезнью»."
memory: "Zarazić — заразить: grypą, entuzjazmem. Zarazić się od kogoś — заразиться от кого-то. Zaraza — чума. Zarażę, zarażony — с Ż. Читается «зара́зиць»."
idioms:
