notes:
  - { kind: false-friend, text: "BARMAN — «бармен», но с A: «ба́рман». Женщина — BARMANKA. Слово английское, но польский читает его по буквам." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Личное множественное — BARMANI, с мягким N. В местном: O BARMANIE." }
  - { kind: government, text: "Заказать у бармена — ZAMÓWIĆ U BARMANA. Работать барменом — PRACOWAĆ JAKO BARMAN или BYĆ BARMANEM, творительный." }
  - { kind: pronunciation, text: "Читается «ба́рман», ударение на первом слоге. Оба гласных — «а»." }
collocations:
  - { pl: "zamówić u barmana", ru: "заказать у бармена" }
  - { pl: "pracować jako barman", ru: "работать барменом" }
  - { pl: "barman w pubie", ru: "бармен в пабе" }
family:
  - { pl: "bar", ru: "бар", relation: root, id: bar }
  - { pl: "barmanka", ru: "барменша", relation: derived }
  - { pl: "barek", ru: "барчик; бар в шкафу", relation: derived }
etymology: "Из английского: «бар» + «человек». Русское «бармен» передаёт английское произношение, а польское BARMAN — написание."
memory: "Barman — бармен, читается «ба́рман». Barmani — бармены. Barmanka — барменша. Zamówić u barmana — заказать у бармена."
idioms:
  - { pl: "na zdrowie", ru: "будем здоровы; на здоровье" }
