family:
  - { pl: "zawierac", ru: "содержать, заключать", relation: root, id: zawierac }
  - { pl: "zawarty", ru: "заключённый, закрытый", relation: derived }
  - { pl: "zawarcie", ru: "заключение", relation: derived }
etymology: "От глагола ZAWIERAĆ, а тот от приставки ZA- и древнего корня со значением «запирать, затворять», того же, что в ZAWRZEĆ «закрыть, заключить» и ZAWARTY «закрытый». Образ прямой: содержимое — это то, что заперто внутри. Отсюда и второе значение глагола, «заключать договор»: договор тоже затворяют, доводят до закрытого вида. Русский на эти два понятия взял разные корни, «держать» для содержания и «ключ» для заключения, так что польское гнездо оказывается плотнее русского, а одно польское слово покрывает то, для чего русскому нужно четыре."
memory: "Русское «содержание» разбирается на четыре польских слова: zawartość это содержимое и содержание вещества, spis treści это оглавление, treść это смысл, utrzymanie это обеспечение. Глагол zawierać значит и «содержать», и «заключать» о договоре, zawrzeć umowę. Корень тот же, что в zawarty «закрытый»: содержимое это то, что заперто внутри. Шесть форм, суффикс -ość отвечает русскому -ость. Читается «зава́ртосьчь», без всяких носовых."
