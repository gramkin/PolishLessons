notes:
  - { kind: false-friend, text: "Русское «содержание» разошлось в польском на четыре слова, и это тот случай, когда одно русское слово приходится разбирать на части. ZAWARTOŚĆ — это содержимое, то, что внутри, и содержание вещества: ZAWARTOŚĆ TORBY, ZAWARTOŚĆ CUKRU. Содержание книги в смысле оглавления — SPIS TREŚCI. Содержание как смысл — TREŚĆ: TREŚĆ LISTU «содержание письма». А содержание как обеспечение, деньги на жизнь, — UTRZYMANIE: BYĆ NA CZYIMŚ UTRZYMANIU «быть на чьём-то содержании»." }
  - { kind: government, text: "Содержимое чего — родительный без предлога: ZAWARTOŚĆ WALIZKI, ZAWARTOŚĆ BUTELKI. Содержание чего в чём — два родительных и предлог W с местным падежом: ZAWARTOŚĆ TŁUSZCZU W MLEKU «содержание жира в молоке», ровно как по-русски. Проверить — SPRAWDZIĆ ZAWARTOŚĆ, винительный. Глагол того же корня ZAWIERAĆ управляет винительным: PACZKA ZAWIERA DWIE KSIĄŻKI «посылка содержит две книги»." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, суффикс отвечает русскому -ОСТЬ. Множественное число употребляется редко и только когда сравнивают измеренные величины: ZAWARTOŚCI OBU PRÓBEK «содержание оба образцов». Глагол ZAWIERAĆ, от которого слово образовано, работает шире русского «содержать»: он значит ещё и «заключать» о договоре, ZAWRZEĆ UMOWĘ «заключить договор», и о мире, ZAWRZEĆ POKÓJ." }
  - { kind: pronunciation, text: "Читается «зава́ртосьчь», три слога, ударение на втором. Все буквы читаются прямо: ZA как «за», WAR как «вар», и никаких носовых здесь нет. Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь», слитно. В глаголе ZAWIERAĆ слышно «заве́рачь», где IE даёт «е». А в совершенном ZAWRZEĆ появляется RZ, то есть «ж»: «за́вжечь»." }
  - { kind: register, text: "Слово нейтральное, частое на этикетках, в таможенных протоколах и в описаниях. Частые обороты: ZAWARTOŚĆ ALKOHOLU «содержание алкоголя», ZAWARTOŚĆ CUKRU «содержание сахара», SPRAWDZIĆ ZAWARTOŚĆ «проверить содержимое», ZAWARTOŚĆ OPAKOWANIA «содержимое упаковки». В компьютерном языке слово заняло ещё одно место: ZAWARTOŚĆ STRONY значит «содержимое страницы», то есть контент." }
collocations:
  - { pl: "zawartość alkoholu", ru: "содержание алкоголя" }
