# review
id: glosno
format: 2
lemma: "głośno"
rank: 1937
pos: adv
pron: { cyr: "гуо́сьно" }
senses:
  - id: loudly
    ru: "громко"
    examples:
      - pl: "Proszę mówić głośno."
        ru: "Говорите, пожалуйста, громко."
        source: { kind: translated, id: 352662 }
      - pl: "Drzwi trzasnęły głośno."
        ru: "Дверь громко хлопнула."
        source: { kind: translated, id: 351360 }
      - pl: "Mayuko krzyczała głośno."
        ru: "Маюко громко кричала."
        source: { kind: translated, id: 832557 }
      - pl: "Mój młodszy brat głośno krzyczy."
        ru: "Мой младший брат очень громко плачет."
        source: { kind: tatoeba, id: 2519059 }
      - pl: "Ten zegar tak głośno tyka, że nie mogę zasnąć."
        ru: "Эти часы так громко тикают, что я не могу заснуть."
        source: { kind: tatoeba, id: 3987888 }
      - pl: "Jest za głośno."
        ru: "Слишком громко."
        source: { kind: translated, id: 567482 }
  - id: louder
    ru: "głośniej — громче"
    examples:
      - pl: "Mów głośniej!"
        ru: "Говори громче!"
        source: { kind: translated, id: 4791070 }
      - pl: "Zrób głośniej."
        ru: "Сделай громче."
        source: { kind: translated, id: 1614907 }
      - pl: "Głośniej, proszę."
        ru: "Громче, пожалуйста."
        source: { kind: translated, id: 5627094 }
notes:
  - { kind: usage, text: "Сравнительная степень — głośniej «громче», превосходная — najgłośniej «громче всего»." }
  - { kind: usage, text: "Daj głośniej и Zrób głośniej значат «сделай погромче» — о звуке техники." }
  - { kind: usage, text: "Антоним — cicho «тихо», у него своя карточка. Существительное того же корня — głos «голос»." }
  - { kind: usage, text: "Оборот głośno myśleć значит «думать вслух»." }
collocations:
  - { pl: "mów głośniej", ru: "говори громче" }
  - { pl: "głośno krzyczeć", ru: "громко кричать" }
  - { pl: "za głośno", ru: "слишком громко" }
etymology: "От głos «голос», праславянское *golsъ. Русское «голос» и «громко» — разные корни, а в польском наречие построено прямо от «голоса»."
memory: "głośno — «громко», от głos «голос». Сравнительная степень głośniej: Mów głośniej! «Говори громче!»."
idioms:
  - { pl: "mów głośniej", ru: "говори громче" }
  - { pl: "głośno myśleć", ru: "думать вслух" }
  - { pl: "za głośno", ru: "слишком громко" }
