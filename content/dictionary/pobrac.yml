# review
id: pobrac
format: 2
lemma: "pobrać"
rank: 2001
pos: verb
pron: { cyr: "по́браць" }
senses:
  - id: collect
    ru: "взять, получить, снять (плату, деньги)"
    examples:
      - pl: "Pobrali opłatę przy wejściu."
        ru: "Они взяли плату при входе."
        source: { kind: authored }
      - pl: "Pobrałem pensję dopiero w piątek."
        ru: "Я получил зарплату только в пятницу."
        source: { kind: authored }
      - pl: "Pobrana kwota wróciła na konto."
        ru: "Снятая сумма вернулась на счёт."
        source: { kind: authored }
  - id: take-sample
    ru: "взять (пробу, кровь, материал)"
    examples:
      - pl: "Pielęgniarka pobrała krew do badania."
        ru: "Медсестра взяла кровь на анализ."
        source: { kind: authored }
      - pl: "Pobrano próbki wody z trzech studni."
        ru: "Взяли пробы воды из трёх колодцев."
        source: { kind: authored }
  - id: download
    ru: "скачать (файл, программу)"
    examples:
      - pl: "Pobierz plik z naszej strony."
        ru: "Скачай файл с нашего сайта."
        source: { kind: authored }
      - pl: "Pobrane zdjęcia leżą w osobnym folderze."
        ru: "Скачанные фото лежат в отдельной папке."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "ТО ЖЕ ЧЕРЕДОВАНИЕ, ЧТО У PRZEBRAĆ, и то же, что в русском. Неопределённая форма pobrać, но будущее pobiorę, pobierzesz, pobierze: основа bra- переходит в bior-/bierz-, как русское «брать, беру, берёшь». Выучив одну пару, вы получаете все приставочные: pobrać, przebrać, zebrać, wybrać." }
  - { kind: false-friend, text: "Разобрать слово по частям можно (po- плюс brać), но русского «побрать» в этом смысле нет, так что перевод зависит от случая: pobrać opłatę — «взять плату», pobrać krew — «взять кровь», pobrać plik — «СКАЧАТЬ файл». Последнее значение в современном языке самое частое, и русское «скачать» ему не родня по форме, только по делу." }
  - { kind: government, text: "Берут ЧТО — винительный: pobrać opłatę, krew, plik. У кого — od с родительным: pobrać próbkę OD pacjenta. Откуда — z с родительным: pobrać pieniądze Z konta, pobrać plik ZE strony. Русский в последнем случае тоже говорит «с», так что модель совпадает." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — pobierać. Запомните оборот za pobraniem: przesyłka za pobraniem значит «посылка наложенным платежом» — обиходное выражение в любом почтовом отделении. Отсюда же pobór «призыв в армию; забор воды»." }
collocations:
  - { pl: "pobrać opłatę", ru: "взять плату" }
  - { pl: "pobrać plik", ru: "скачать файл" }
  - { pl: "za pobraniem", ru: "наложенным платежом" }
family:
  - { pl: "brać", ru: "брать", relation: root, id: brac }
  - { pl: "pobierać", ru: "брать, взимать; скачивать", relation: aspect }
  - { pl: "przebrać", ru: "переодеть; перебрать", relation: derived, id: przebrac }
etymology: "Приставка po- плюс brać «брать», общеславянский корень с чередованием bra-/bior-, как в русском «брать/беру». Значения разошлись по областям: деньги, проба, файл. Отсюда pobór «призыв, забор» и pobranie «взятие», а в почтовом обороте za pobraniem — «наложенным платежом»."
memory: "pobrać — «взять, получить», а в современном смысле ещё и «СКАЧАТЬ»: pobrać plik. Основа чередуется как в русском: pobrać, но pobiorę, pobierzesz. И запомните za pobraniem — «наложенным платежом»."
idioms:
  - { pl: "przesyłka za pobraniem", ru: "посылка наложенным платежом" }
  - { pl: "pobrać próbkę", ru: "взять пробу" }
