etymology: "Из приставки PRZY- и корня *vyknǫti «привыкать, учиться», того же, что в русских «привыкнуть», «навык», «обычай», «обучать». Приставка отвечает русскому «при-» буквально, так что слово собрано по тому же чертежу, что и русское «привыкнуть». Корень дал в польском широкое гнездо: NAWYK «навык», ZWYCZAJ «обычай», ZWYKŁY «обычный», NIEZWYKŁY «необычный», PRZYZWYCZAJENIE «привычка». Исходное значение корня — «учиться», и оно сохранилось в церковнославянском «навыкнути» и в русском «навык», где привычка и умение ещё не разделены. Расходятся языки только в управлении: польский выбрал предлог DO с родительным, русский — «к» с дательным, и эта мелочь остаётся главной практической трудностью слова."
memory: "Корень wyk- как в русских «привыкнуть», «навык», «обычай»: nawyk, zwyczaj, zwykły «обычный». Приставка przy- = «при-», так что слово собрано как русское. Но падеж другой: przywyknąć DO czegoś с родительным, тогда как русский говорит «к чему-то» с дательным. Конструкции с ku не существует. Совершенный вид, 43 формы: страдательного причастия нет, деепричастие только прошедшее (przywyknąwszy). В прошедшем времени носовой исчезает: przywykł, przywykła, przywykli. И разговорнее звучит przyzwyczaić się."
