notes:
  - { kind: government, text: "Главное в карточке — падеж, потому что он расходится с русским. Польское PRZYWYKNĄĆ требует предлога DO с родительным: PRZYWYKNĄĆ DO HAŁASU, DO ZIMY, DO NOWEJ PRACY. Русское «привыкнуть» требует предлога «к» с дательным: «привыкнуть к шуму». Приставка в обоих языках одна и та же, PRZY- и «при-», а предлог и падеж разные, и это типичная ошибка: сказать PRZYWYKNĄĆ KU CZEMUŚ нельзя, такой конструкции в польском нет вовсе. Перед инфинитивом предлог не нужен: TRUDNO PRZYWYKNĄĆ MIESZKAĆ SAMEMU строится без DO, как и в русском." }
  - { kind: false-friend, text: "Корень WYK- тот же, что в русских «привыкнуть», «навык», «обычай»: польское NAWYK значит «навык, привычка», ZWYCZAJ — «обычай», PRZYZWYCZAJENIE — «привычка», NIEZWYKŁY — «необычный». Соответствие прозрачное, и всё гнездо открывается сразу. Ловушка в одном производном: ZWYKŁY значит «обычный, простой», а не «привыкший», и ZWYKLE — «обычно». Второе: рядом с PRZYWYKNĄĆ живёт более частое PRZYZWYCZAIĆ SIĘ с тем же значением «привыкнуть», и в разговорной речи оно встречается чаще, тогда как PRZYWYKNĄĆ звучит немного книжнее." }
  - { kind: usage, text: "Совершенный вид, непереходный, сорок три формы: сорок две от глагола и одна у деепричастия прошедшего времени PRZYWYKNĄWSZY, которое бывает только у совершенного вида. Страдательного причастия нет, потому что нет винительного дополнения: привыкают к чему-то, а не что-то. Деепричастия на -ĄC тоже нет — у совершенного вида его не бывает. Несовершенная пара — PRZYWYKAĆ, и она встречается реже совершенной, потому что привыкание обычно называют как достигнутый результат: PRZYWYKŁEM «я привык». Обратите внимание на прошедшее время: PRZYWYKŁ, PRZYWYKŁA, PRZYWYKLI, с Ł после K и без носового." }
  - { kind: pronunciation, text: "Читается «пшывы́кнонць», четыре слога, ударение на предпоследнем. Приставка PRZY- звучит «пшы»: RZ после глухого P оглушается в «ш», а Y это «ы». Носовое Ą перед Ć даёт «он» с лёгким носовым призвуком, поэтому конец слова звучит «нонць». В прошедшем времени носового нет вовсе: PRZYWYKŁ произносится «пшы́выку», где Ł это «у» неслоговое, а PRZYWYKŁA — «пшывы́куа». Это самое заметное различие между формами, и его стоит проговорить отдельно." }
