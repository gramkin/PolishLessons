        source: { kind: translated, id: 10587613 }
  - id: without-warning
    ru: "предупреждение (в обороте bez ostrzeżenia «без предупреждения»)"
    examples:
      - pl: "Zostałem zwolniony bez ostrzeżenia."
        ru: "Меня уволили без предупреждения."
        source: { kind: translated, id: 351364 }
      - pl: "Tom wyszedł bez ostrzeżenia."
        ru: "Том ушёл без предупреждения."
        source: { kind: translated, id: 3941182 }
notes:
  - { kind: government, text: "bez ostrzeżenia «без предупреждения» — с родительным падежом; mimo ostrzeżeń «несмотря на предупреждения» — тоже родительный." }
  - { kind: usage, text: "Отглагольное существительное от ostrzec «предупредить», которое уже есть в словаре." }
  - { kind: false-friend, text: "Корень strzec «стеречь» — та же карточка strzec. Предупредить значит «поберечь заранее»." }
  - { kind: usage, text: "Средний род: to ostrzeżenie, tego ostrzeżenia." }
collocations:
  - { pl: "bez ostrzeżenia", ru: "без предупреждения" }
  - { pl: "ostatnie ostrzeżenie", ru: "последнее предупреждение" }
etymology: "От ostrzec «предупредить», от strzec «стеречь»; ср. русское «стеречь», «предостеречь»."
memory: "ostrzeżenie — «предупреждение», от ostrzec, того же корня, что strzec «стеречь». Запомните bez ostrzeżenia «без предупреждения»."
idioms:
  - { pl: "bez ostrzeżenia", ru: "без предупреждения" }
  - { pl: "ostatnie ostrzeżenie", ru: "последнее предупреждение" }
