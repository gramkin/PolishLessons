# review
id: druzyna
format: 2
lemma: "drużyna"
rank: 774
pos: noun
pron: { cyr: "дружы́на" }
senses:
  - id: team
    ru: "команда (спортивная)"
    examples:
      - pl: "Która drużyna wygra?"
        ru: "Какая команда победит?"
        source: { kind: translated, id: 2265006 }
      - pl: "Nasza drużyna wygrywa."
        ru: "Наша команда выигрывает."
        source: { kind: translated, id: 606067 }
      - pl: "Nasza drużyna przegrała."
        ru: "Наша команда проиграла."
        source: { kind: translated, id: 415213 }
  - id: squad
    ru: "отряд, группа; отделение (военное), дружина (скаутская)"
    note: "Второе значение — организованная группа для общего дела: harcerska drużyna «скаутский отряд»."
    examples:
      - pl: "Utworzyli drużynę pływacką."
        ru: "Они создали команду по плаванию."
        source: { kind: translated, id: 7886523 }
      - pl: "Wasza trójka tworzy świetną drużynę."
        ru: "Вы втроём составляете отличную команду."
        source: { kind: translated, id: 3817526 }
      - pl: "Drużyna harcerska rozbiła obóz nad jeziorem."
        ru: "Скаутский отряд разбил лагерь у озера."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русская «дружина» — историческое слово, а польская drużyna живёт в повседневной речи и значит прежде всего «спортивная команда»: drużyna piłkarska «футбольная команда»." }
  - { kind: usage, text: "Слово женского рода: ta drużyna, nasza drużyna. Родительный множественного — drużyn без окончания: dziesięć drużyn «десять команд»." }
  - { kind: usage, text: "Частые сочетания: być w drużynie «быть в команде», kapitan drużyny «капитан команды», drużyna gospodarzy «команда хозяев поля»." }
  - { kind: usage, text: "В основе druh «друг, товарищ» — то же слово, что русское «друг». Отсюда и русская «дружина»: буквально «товарищество»." }
collocations:
  - { pl: "drużyna piłkarska", ru: "футбольная команда" }
  - { pl: "być w drużynie", ru: "быть в команде" }
  - { pl: "kapitan drużyny", ru: "капитан команды" }
  - { pl: "drużyna harcerska", ru: "скаутский отряд" }
family:
  - { pl: "druh", ru: "друг, товарищ", relation: root }
  - { pl: "drużynowy", ru: "вожатый", relation: derived }
etymology: "От druh «друг, товарищ» — то же слово, что русское «друг». Буквально «товарищество, круг товарищей»; русская «дружина» образована точно так же и от той же основы."
memory: "drużyna — прежде всего «спортивная команда»: drużyna piłkarska, nasza drużyna wygrywa. Русская «дружина» звучит почти так же и происходит от того же druh «друг», но в русском это историческое слово, а в польском — повседневное. Женский род: ta drużyna. Родительный множественного без окончания: dziesięć drużyn. Второе значение — любая организованная группа: drużyna harcerska «скаутский отряд»."
idioms:
  - { pl: "drużyna gospodarzy", ru: "команда хозяев поля" }
  - { pl: "być w drużynie", ru: "быть в команде" }
  - { pl: "grać w jednej drużynie", ru: "играть в одной команде" }
