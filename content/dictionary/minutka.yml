notes:
  - { kind: false-friend, text: "MINUTKA — «минутка», ласково-разговорное от MINUTA. Ещё и «кухонный таймер», который «считает минутки». ZA MINUTKĘ — «через минутку», NA MINUTKĘ — «на минутку»." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: W MINUTCE. Родительный множественного — MINUTEK. Звательный MINUTKO не употребляется." }
  - { kind: government, text: "Через минутку — ZA MINUTKĘ, винительный. На минутку — NA MINUTKĘ. Подождать минутку — POCZEKAĆ MINUTKĘ, винительный без предлога." }
  - { kind: pronunciation, text: "Читается «мину́тка», ударение на предпоследнем слоге. MINUTCE — «мину́тце»." }
collocations:
  - { pl: "za minutkę", ru: "через минутку" }
  - { pl: "na minutkę", ru: "на минутку" }
  - { pl: "nastawić minutkę", ru: "поставить таймер" }
