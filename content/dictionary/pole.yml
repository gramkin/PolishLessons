  - id: abstract
    ru: "pole widzenia — поле зрения; pole do popisu — простор для себя показать"
    examples:
      - pl: "Śmierć jest jedynie horyzontem. A horyzont to tylko ograniczenie naszego pola widzenia."
        ru: "Смерть — это только горизонт. А горизонт — не что иное, как ограниченность поля зрения."
        source: { kind: translated, id: 723988 }
      - pl: "Zginął na polu chwały."
        ru: "Он погиб на поле славы."
        source: { kind: translated, id: 360499 }
      - pl: "To szerokie pole do popisu."
        ru: "Это широкий простор, чтобы себя показать."
        source: { kind: authored }
notes:
  - { kind: government, text: "Место — na polu с предложным: pracować na polu «работать в поле». Русский тут берёт предлог «в», польский — na, и это надо запомнить." }
  - { kind: usage, text: "Второе значение — «поле» в анкете или на экране: wypełnij puste pola «заполните пустые поля», pole tekstowe «текстовое поле»." }
  - { kind: usage, text: "pole widzenia — «поле зрения», pole naftowe — «нефтяное месторождение», pole bitwy — «поле битвы»." }
  - { kind: usage, text: "Идиома wywieść kogoś w pole значит «обвести вокруг пальца», а pole do popisu — «простор, где можно себя показать»." }
collocations:
  - { pl: "na polu", ru: "в поле" }
  - { pl: "pole widzenia", ru: "поле зрения" }
  - { pl: "puste pola", ru: "пустые поля" }
  - { pl: "pole bitwy", ru: "поле битвы" }
family:
  - { pl: "polny", ru: "полевой", relation: derived }
  - { pl: "polana", ru: "поляна", relation: derived }
etymology: "Праславянское *polje «ровная пустая плоскость» — то же слово, что русское «поле», с тем же значением и без расхождений."
memory: "pole — «поле», и по смыслу совпадает с русским. Запомните предлог: работают na polu, а не «в поле». И второе значение — поле в анкете: wypełnij puste pola."
idioms:
  - { pl: "pole do popisu", ru: "простор, чтобы себя показать" }
  - { pl: "wywieść w pole", ru: "обвести вокруг пальца" }
  - { pl: "pole widzenia", ru: "поле зрения" }
