notes:
  - { kind: false-friend, text: "Самая резкая ловушка этой карточки: польское POPIERAĆ значит «поддерживать», а русское «попирать» — ровно противоположное, «топтать, пренебрегать». Корень у них общий, праславянский *pьrati «жать, давить, ступать», но языки развели его в разные стороны: польский пошёл к идее подпирания, поддержки снизу, а русский — к идее наступания сверху, попирания ногами. Поэтому фразу POPIERAM TWÓJ WNIOSEK нельзя слышать как «попираю твоё предложение»: это «поддерживаю». Существительное POPARCIE значит «поддержка», и оно очень частое: GŁOSY POPARCIA «голоса поддержки», BEZ POPARCIA «без поддержки»." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия POPIERAJĄCY, одиннадцать от страдательного POPIERANY. Совершенная пара — POPRZEĆ, и она выглядит совсем иначе, потому что в ней корень без вставного гласного: POPIERAĆ против POPRZEĆ, POPIERAM против POPRĘ. Эту пару стоит выучить целиком, по образцу PRZEĆ и PIERAĆ. Рядом живёт WSPIERAĆ «поддерживать» в смысле помощи и опоры, и разница практическая: POPIERAĆ — соглашаться, быть на чьей-то стороне, WSPIERAĆ — помогать делом или деньгами. Существительные тоже различаются: POPARCIE «поддержка мнением», WSPARCIE «помощь»." }
  - { kind: government, text: "Переходный: поддерживать кого или что — винительный без предлога, POPIERAĆ WNIOSEK, KANDYDATA, POMYSŁ. Русское управление то же, «поддерживать кого, что», так что здесь ошибки редки. Чем подкреплять — творительный без предлога: POPIERAĆ TEZĘ DANYMI, POPIERAĆ WNIOSEK OPINIĄ, как русское «подкреплять данными». Отрицание требует родительного: NIE POPIERAM TEGO WNIOSKU. Производное существительное управляет предлогом DLA с родительным: POPARCIE DLA KANDYDATA «поддержка кандидата», и этот оборот встречается чаще, чем сам глагол." }
  - { kind: pronunciation, text: "Читается «попе́раць», три слога, ударение на предпоследнем. Сочетание PIE звучит «пе»: буква I здесь только показывает мягкость P и сама не произносится, как в PIES и PIERWSZY. Буква R твёрдая. Конечное Ć — мягкое «ць». В совершенном виде POPRZEĆ появляется RZ, то есть «ж», и слогов становится два: «по́пжець». В существительном POPARCIE три слога, ударение предпоследнее: «попа́рце», где CIE даёт «це»." }
