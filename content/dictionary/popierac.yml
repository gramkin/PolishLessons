etymology: "От приставки PO- и корня *pьrati «жать, давить, ступать», того же, что в русских «попирать», «подпирать», «опора», «упираться». Корень один, а оценка противоположная, и это самый поучительный случай расхождения в этой карточке. Польский взял образ подпирания снизу: поддержать — значит подставить опору, и отсюда POPIERAĆ «поддерживать», POPARCIE «поддержка», OPARCIE «опора», WSPIERAĆ «поддерживать». Русский от того же корня развил образ наступания сверху: «попирать» значит топтать, а «попрать закон» — пренебречь им. Так одно праславянское движение — давление — дало в двух языках помощь и презрение. Русский, впрочем, сохранил и польскую линию: «подпирать» и «опора» ровно о том же, и через них связь восстанавливается."
memory: "Корень один с русским «попирать», но смысл противоположный: польское popierać значит «поддерживать», а не «топтать». Оба от праслав. *pьrati «давить»: поляк подпирает снизу, русский наступает сверху. Через «подпирать» и «опору» связь видна. Существительное poparcie «поддержка», управление — dla kogoś. Не путать с wspierać: popierać это соглашаться и быть на стороне, wspierać — помогать делом. Совершенный вид выглядит иначе: poprzeć, poprę."
