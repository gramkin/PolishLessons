# review
id: cisnienie
format: 2
lemma: "ciśnienie"
rank: 1804
pos: noun
pron: { cyr: "цисьне́не" }
senses:
  - id: blood
    ru: "давление (кровяное)"
    examples:
      - pl: "Mam niskie ciśnienie."
        ru: "У меня низкое давление."
        source: { kind: translated, id: 403722 }
      - pl: "Mam wysokie ciśnienie."
        ru: "У меня высокое давление."
        source: { kind: translated, id: 6309292 }
      - pl: "Mam wysokie ciśnienie krwi."
        ru: "У меня высокое кровяное давление."
        source: { kind: translated, id: 8446310 }
  - id: physical
    ru: "давление (физическое, в шинах)"
    examples:
      - pl: "Temperaturę i ciśnienie poproszę."
        ru: "Температуру и давление, пожалуйста."
        source: { kind: tatoeba, id: 1735725 }
      - pl: "Sprawdź ciśnienie w swoich oponach."
        ru: "Проверь давление в своих шинах."
        source: { kind: translated, id: 7184627 }
      - pl: "Ciśnienie wciąż rośnie."
        ru: "Давление всё растёт."
        source: { kind: translated, id: 1350431 }
notes:
  - { kind: usage, text: "Про здоровье говорят просто mam wysokie ciśnienie «у меня высокое давление», без слова krwi." }
  - { kind: government, text: "Давление в чём-то — ciśnienie w czymś, предложный падеж: ciśnienie w oponach «давление в шинах»." }
  - { kind: usage, text: "В переносном значении «нажим, прессинг» употребительнее presja и nacisk." }
  - { kind: false-friend, text: "Слово однокоренное с cisnąć «давить, жать» — и с русским «тиснуть», «тиски», хотя русское «давление» образовано от другого корня." }
collocations:
  - { pl: "ciśnienie krwi", ru: "кровяное давление" }
  - { pl: "wysokie ciśnienie", ru: "высокое давление" }
  - { pl: "ciśnienie w oponach", ru: "давление в шинах" }
family:
  - { pl: "cisnąć", ru: "давить, жать", relation: root }
  - { pl: "nacisk", ru: "нажим, давление", relation: root }
etymology: "От cisnąć «давить, жать» — того же корня, что русское «тиснуть» и «тиски». Русское «давление» построено от «давить»: образ тот же, корень другой."
memory: "ciśnienie — «давление»: и кровяное (mam wysokie ciśnienie), и в шинах (ciśnienie w oponach). В корпусе слово живёт почти только в этой одной форме."
idioms:
  - { pl: "ciśnienie krwi", ru: "кровяное давление" }
  - { pl: "wysokie ciśnienie", ru: "высокое давление" }
  - { pl: "spadek ciśnienia", ru: "падение давления" }
