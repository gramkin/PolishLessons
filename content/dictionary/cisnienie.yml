  - { pl: "wysokie ciśnienie", ru: "высокое давление" }
  - { pl: "ciśnienie w oponach", ru: "давление в шинах" }
family:
  - { pl: "cisnąć", ru: "давить, жать", relation: root }
  - { pl: "nacisk", ru: "нажим, давление", relation: root }
etymology: "От cisnąć «давить, жать» — того же корня, что русское «тиснуть» и «тиски». Русское «давление» построено от «давить»: образ тот же, корень другой."
memory: "ciśnienie — «давление»: и кровяное (mam wysokie ciśnienie), и в шинах (ciśnienie w oponach). В корпусе слово живёт почти только в этой одной форме."
