  - { pl: "przeciwny", ru: "противоположный", relation: derived, id: przeciwny }
etymology: "Сложено из приставки S- и слова PRZECIW «против», от праславянского *protivъ, откуда и русское «против». Соответствие начала слова регулярно: польское PRZE- отвечает русскому «про-» и «пере-», как в PRZECIW и «против», PRZEZ и «через», PRZEDE и «перед». Значение выросло прямо из предлога: то, что направлено против, есть возражение. Русский построил от того же корня «противиться» и «сопротивление», так что родство слышно, стоит только узнать в PRZECIW наше «против». Из того же гнезда PRZECIWNIE «наоборот», PRZECIWNIK «противник» и PRZECIWIEŃSTWO «противоположность»."
memory: "Читать это слово нужно по трём правилам сразу: prz даёт «пш», ci даёт «чи», конечная w оглушается в «ф», итого «спше́чиф». Корень тот же, что в русском «против»: przeciw. Но русское «сопротивление» делится на два польских слова: sprzeciw это несогласие и протест, а opór физическое сопротивление, opór powietrza. Управление: sprzeciw WOBEC czegoś с родительным, wnieść sprzeciw OD wyroku, bez sprzeciwu «без возражений»."
idioms:
  - { pl: "bez sprzeciwu", ru: "без возражений" }
