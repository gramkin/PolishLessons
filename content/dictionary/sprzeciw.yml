notes:
  - { kind: pronunciation, text: "В этом коротком слове сошлись сразу три правила чтения, и выучить его стоит именно поэтому. Сочетание PRZ даёт «пш», поэтому начало звучит «спше». Сочетание CI даёт мягкое «чи», значит дальше «чи». Конечная W оглушается и звучит как «ф». Вместе получается «спше́чиф», ударение на предпоследнем слоге. Чтение «спрецив» неверно во всех трёх точках. В косвенных падежах W оказывается между гласными и звучит звонко: SPRZECIWU это «спше́чиву»." }
  - { kind: false-friend, text: "Русское «сопротивление» покрывает две вещи, которые польский держит порознь. SPRZECIW — это несогласие, возражение, протест, то есть сопротивление словом и волей. Физическое сопротивление, в том числе электрическое, называется OPÓR: OPÓR POWIETRZA «сопротивление воздуха», RUCH OPORU «движение сопротивления». Поэтому STAWIAĆ OPÓR значит «оказывать сопротивление» в прямом смысле, а WYRAZIĆ SPRZECIW — «выразить протест». Корень же у SPRZECIW общий с русским: PRZECIW это «против»." }
  - { kind: government, text: "Против чего направлено возражение, вводится предлогом WOBEC с родительным: SPRZECIW WOBEC USTAWY, WOBEC ZMIAN. Есть и вариант с PRZECIW плюс дательный: SPRZECIW PRZECIW DECYZJI, но он тяжеловат и в живом языке редок. Юридическое действие оформляется глаголом WNIEŚĆ: WNIEŚĆ SPRZECIW OD WYROKU «подать возражение на приговор», где источник идёт предлогом OD с родительным. Отсутствие возражений — BEZ SPRZECIWU, родительный, ровно как русское «без возражений»." }
  - { kind: usage, text: "Существительное мужского рода неодушевлённое, десять падежных форм. Слово отглагольное: от SPRZECIWIĆ SIĘ «воспротивиться, возразить», которое управляет дательным, SPRZECIWIĆ SIĘ KOMUŚ. В единственном числе оно часто значит несогласие вообще, как настроение: SPRZECIW ROŚNIE. Множественное принадлежит делопроизводству и означает отдельные поданные бумаги: WSZYSTKIE SPRZECIWY ODRZUCONO. Местный падеж SPRZECIWIE требует предлога W, и перед двумя согласными в начале слова предлог Z становится ZE: ZE SPRZECIWEM." }
  - { kind: register, text: "Слово официальное: суд, администрация, протоколы собраний, публицистика. Частые обороты: WYRAZIĆ SPRZECIW «выразить протест», WNIEŚĆ SPRZECIW «подать возражение», SPOTKAĆ SIĘ ZE SPRZECIWEM «встретить сопротивление», BEZ SPRZECIWU «без возражений». В разговоре вместо него скажут проще: NIE ZGADZAM SIĘ «я не согласен» или JESTEM PRZECIW «я против». Последнее особенно употребительно при голосовании, и это ровно русское «я против»." }
collocations:
  - { pl: "wnieść sprzeciw", ru: "подать возражение" }
  - { pl: "wyrazić sprzeciw", ru: "выразить протест" }
