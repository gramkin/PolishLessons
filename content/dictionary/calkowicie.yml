# review
id: calkowicie
format: 2
lemma: "całkowicie"
rank: 836
pos: adv
pron: { cyr: "цаукови́це" }
senses:
  - id: completely
    ru: "полностью, целиком"
    examples:
      - pl: "To całkowicie będzie zależało od niego."
        ru: "Это будет целиком зависеть от него."
        source: { kind: tatoeba, id: 10817622 }
      - pl: "To całkowicie naturalne, że jest dumny ze swojego syna."
        ru: "Вполне естественно то, что он гордится своим сыном."
        source: { kind: tatoeba, id: 458192 }
      - pl: "Łąka, na której często graliśmy w baseballa, teraz jest całkowicie zabudowana domami."
        ru: "Луг, на котором мы часто играли в бейсбол, сейчас полностью застроен домами."
        source: { kind: tatoeba, id: 745414 }
  - id: completely-agree
    ru: "całkowicie się zgadzam — полностью согласен"
    examples:
      - pl: "Całkowicie się z tobą zgadzam."
        ru: "Я полностью с тобой согласен."
        source: { kind: authored }
      - pl: "Całkowicie to rozumiem."
        ru: "Я это полностью понимаю."
        source: { kind: authored }
      - pl: "Masz całkowicie rację."
        ru: "Ты совершенно прав."
        source: { kind: authored }
  - id: completely-different
    ru: "całkowicie inny — совершенно другой"
    examples:
      - pl: "To całkowicie inna sprawa."
        ru: "Это совершенно другое дело."
        source: { kind: authored }
      - pl: "Zmienił się całkowicie."
        ru: "Он полностью изменился."
        source: { kind: authored }
      - pl: "Jest całkowicie pewien."
        ru: "Он совершенно уверен."
        source: { kind: authored }
  - id: no-degrees
    ru: "степеней у наречия нет: «более полностью» не бывает"
    examples:
      - pl: "Całkowicie zależy to od ciebie."
        ru: "Это целиком зависит от тебя."
        source: { kind: authored }
      - pl: "Całkowicie zapomniałem."
        ru: "Я совершенно забыл."
        source: { kind: authored }
      - pl: "Sprawa jest całkowicie jasna."
        ru: "Дело совершенно ясное."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово от całkowity «полный», а то от cały «целый» — буквально «целиком». Русское «целиком» из того же корня, так что связь узнаётся сразу." }
  - { kind: usage, text: "Степеней сравнения нет: całkowiciej и najcałkowiciej не говорят — полнее полного не бывает." }
  - { kind: usage, text: "Синонимы по убыванию книжности: całkowicie, zupełnie, w pełni, zupełnie «совсем». В разговоре чаще zupełnie." }
  - { kind: usage, text: "Ходовые: całkowicie się zgadzam «полностью согласен», masz całkowicie rację «ты совершенно прав»." }
collocations:
  - { pl: "całkowicie się zgadzam", ru: "полностью согласен" }
  - { pl: "całkowicie inny", ru: "совершенно другой" }
  - { pl: "całkowicie zależy", ru: "целиком зависит" }
family:
