  - { pl: "całkowity", ru: "полный", relation: root }
  - { pl: "zupełnie", ru: "совсем", relation: root }
  - { pl: "całość", ru: "целое", relation: derived }
etymology: "От całkowity «полный», а то от cały «целый» — то же гнездо, что русские «целый» и «целиком»."
memory: "całkowicie — «полностью, целиком», от cały «целый», так что корень узнаётся сразу: русское «целиком» из того же гнезда. Степеней у наречия нет — полнее полного не бывает. В разговоре чаще возьмут zupełnie, а całkowicie звучит чуть книжнее."
idioms:
