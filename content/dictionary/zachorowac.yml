  - { pl: "chory", ru: "больной", relation: root, id: chory }
  - { pl: "choroba", ru: "болезнь", relation: root, id: choroba }
etymology: "Приставка ZA- плюс CHOROWAĆ «болеть», от CHORY «больной». Русское «хворать», «хворый» — тот же корень с другим суффиксом."
memory: "Zachorować — заболеть: zachorować na grypę (na + винительный!). Nie zachoruj! — смотри не заболей. Chory — больной, «хворый». Читается «захоро́ваць»."
idioms:
