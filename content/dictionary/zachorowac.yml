notes:
  - { kind: false-friend, text: "ZACHOROWAĆ — «заболеть», но с другим управлением: болезнью — NA с винительным, а не творительный: ZACHOROWAĆ NA GRYPĘ, NA RAKA, «заболеть гриппом, раком». «Я болен» — JESTEM CHORY. Переносное ZACHOROWAĆ NA PUNKCIE CZEGOŚ — «помешаться на чём-то»." }
  - { kind: usage, text: "Сорок одна форма: глагол совершенного вида и непереходный; страдательного причастия нет, а безличное ZACHOROWANO в карточку не включено — болезнь не выражают безличной формой. Повелительное живёт в отрицании: NIE ZACHORUJ! — «смотри не заболей!». Видовой партнёр — CHOROWAĆ." }
  - { kind: government, text: "Чем — NA с винительным: ZACHOROWAĆ NA ODRĘ, NA COVID. От чего — OD с родительным: ZACHOROWAĆ OD ZIMNEJ WODY. На что-то в переносном — NA PUNKCIE с родительным: NA PUNKCIE KOTÓW." }
  - { kind: pronunciation, text: "Читается «захоро́ваць», четыре слога, ударение на предпоследнем. CH — «х», W перед A — «в». Конечное Ć — «ць». ZACHORUJĘ — «захору́е»." }
  - { kind: register, text: "Нейтральное бытовое и медицинское слово. ZACHOROWANIE — «заболевание» в статистике: LICZBA ZACHOROWAŃ. Переносное «заболеть чем-то» — разговорное." }
collocations:
  - { pl: "zachorować na grypę", ru: "заболеть гриппом" }
  - { pl: "ciężko zachorować", ru: "тяжело заболеть" }
  - { pl: "liczba zachorowań", ru: "число заболеваний" }
family:
