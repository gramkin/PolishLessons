    ru: "оправдываться (usprawiedliwiać się)"
    examples:
      - pl: "Nie ma znaczenia jak będzie się usprawiedliwiać, nie wybaczę mu."
        ru: "Неважно, как он будет оправдываться, я не прощу."
        source: { kind: translated, id: 2006043 }
      - pl: "Przestań się usprawiedliwiać."
        ru: "Перестань оправдываться."
        source: { kind: authored }
notes:
  - { kind: government, text: "Винительный падеж: usprawiedliwiać czyny «оправдывать поступки». С się — «оправдываться» самому." }
  - { kind: usage, text: "В школе usprawiedliwienie значит «записка об отсутствии» — то, чем оправдывают пропуск." }
  - { kind: false-friend, text: "Корень sprawiedliwy «справедливый», от sprawa «дело»; ср. русское «справедливый», «оправдать»." }
  - { kind: usage, text: "Совершенный вид — usprawiedliwić." }
collocations:
  - { pl: "usprawiedliwiać się", ru: "оправдываться" }
  - { pl: "nic nie usprawiedliwia", ru: "ничто не оправдывает" }
etymology: "От sprawiedliwy «справедливый», от sprawa «дело»; ср. русское «справедливый», «оправдать»."
memory: "usprawiedliwiać — «оправдывать», с się «оправдываться». В школе usprawiedliwienie — записка, оправдывающая пропуск. Совершенный вид — usprawiedliwić."
