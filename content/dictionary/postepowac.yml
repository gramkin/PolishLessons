# review
id: postepowac
format: 2
lemma: "postępować"
rank: 2094
pos: verb
pron: { cyr: "постэмпо́ваць" }
senses:
  - id: act
    ru: "поступать, вести себя"
    examples:
      - pl: "Postępuj uczciwie, a nie pożałujesz."
        ru: "Поступай честно — не пожалеешь."
        source: { kind: authored }
      - pl: "Postępował z nimi surowo, ale sprawiedliwie."
        ru: "Он поступал с ними сурово, но справедливо."
        source: { kind: authored }
      - pl: "Nie wiedział, jak postępować w takiej sytuacji."
        ru: "Он не знал, как поступать в такой ситуации."
        source: { kind: authored }
  - id: progress
    ru: "продвигаться, прогрессировать (о болезни, работе)"
    examples:
      - pl: "Choroba postępuje wolno."
        ru: "Болезнь прогрессирует медленно."
        source: { kind: authored }
      - pl: "Prace postępowały szybciej, niż planowano."
        ru: "Работы продвигались быстрее, чем планировали."
        source: { kind: authored }
  - id: conduct
    ru: "postępowanie — поведение; юр. производство"
    examples:
      - pl: "Jego postępowanie zaskoczyło wszystkich."
        ru: "Его поведение всех удивило."
        source: { kind: authored }
      - pl: "Postępowanie sądowe trwało dwa lata."
        ru: "Судебное производство длилось два года."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово разбирается на русские части: po- плюс основа от stąpać «ступать», как «по-ступать». Корень тот же, что в stopa «стопа», и работает уже знакомый закон — польское ą отвечает русскому «у»: stąpać при «ступать», mąż при «муже», ręka при «руке». Отсюда и postęp «прогресс», буквально «продвижение вперёд»." }
  - { kind: usage, text: "ОТГЛАГОЛЬНОЕ СУЩЕСТВИТЕЛЬНОЕ РАБОТАЕТ НА ДВА ФРОНТА. Postępowanie — это и «поведение» (jego postępowanie było naganne), и юридическое «ПРОИЗВОДСТВО, процесс»: postępowanie sądowe «судебное производство», postępowanie karne «уголовное производство». В газете и в суде вам встретится именно второе." }
  - { kind: government, text: "Поступают С кем — z с ТВОРИТЕЛЬНЫМ, как по-русски: postępować z ludźmi, z dziećmi. Согласно чему — według с родительным: postępować według instrukcji. Глагол непереходный, поэтому страдательного причастия у него нет: дополнения в винительном при нём не бывает." }
  - { kind: pronunciation, text: "Настоящее время по правилу -ować: postępuję, postępujesz, как pracuję. Носовое ę перед p читается как «эм», отсюда «постэмпо́ваць». Ударение, как всегда, на предпоследнем слоге." }
collocations:
  - { pl: "postępować uczciwie", ru: "поступать честно" }
  - { pl: "postępowanie sądowe", ru: "судебное производство" }
  - { pl: "choroba postępuje", ru: "болезнь прогрессирует" }
family:
  - { pl: "postęp", ru: "прогресс, продвижение", relation: root }
  - { pl: "postępowanie", ru: "поведение; производство", relation: derived }
  - { pl: "stąpać", ru: "ступать", relation: root }
etymology: "Приставка po- плюс основа от stąpać «ступать», от корня, давшего и stopa «стопа». Русское «поступать» собрано из тех же частей. Разница только в гласной: польское ą отвечает русскому «у». Отсюда postęp «прогресс» и postępowy «прогрессивный»."
memory: "postępować — «поступать» (вести себя) и «продвигаться». Разбирается как русское «по-ступать», с законом ą/у: stąpać «ступать». И запомните двойную жизнь существительного: postępowanie — и «поведение», и судебное «производство»."
idioms:
  - { pl: "postępować według zasad", ru: "поступать по правилам" }
  - { pl: "postępowanie karne", ru: "уголовное производство" }
