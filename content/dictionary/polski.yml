notes:
  - { kind: usage, text: "Само по себе polski часто значит «польский язык»: uczę się polskiego «я учу польский», mówię po polsku «я говорю по-польски»." }
  - { kind: government, text: "Оборот «по-польски» строится особо: po polsku, с предложным падежом и без предлога w. Это касается всех языков: po rosyjsku, po angielsku." }
  - { kind: false-friend, text: "Прилагательное пишется с маленькой буквы — polski język, в отличие от названия страны Polska с большой. Русский делает так же." }
  - { kind: usage, text: "Мужской ЛИЧНЫЙ род во мн. ч.: polscy archeolodzy «польские археологи», но polskie książki «польские книги»." }
collocations:
  - { pl: "po polsku", ru: "по-польски" }
  - { pl: "język polski", ru: "польский язык" }
etymology: "От Polska «Польша», от корня pole «поле»: поляки — жители полей."
memory: "polski — «польский», и часто само по себе значит «польский язык»: uczę się polskiego. А «по-польски» — po polsku, особая форма без предлога w."
