  - { pl: "pylić", ru: "пылить", relation: derived }
  - { pl: "pylisty", ru: "пылевидный", relation: derived }
etymology: "Общеславянское слово; русская «пыль» — то же самое, но женского рода. Ł и L чередуются: PYŁ, но W PYLE, PYLIĆ."
memory: "Pył — пыль (м. р.), уличная и промышленная; kurz — домашняя пыль. Читается «пыу». W proch i pył — в прах."
idioms:
  - { pl: "obrócić w proch i pył", ru: "обратить в прах" }
