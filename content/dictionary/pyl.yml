notes:
  - { kind: false-friend, text: "PYŁ — «пыль», но мужского рода: TEN PYŁ. И домашняя пыль на мебели обычно KURZ, а PYŁ — дорожная, промышленная, вулканическая. PYŁY ZAWIESZONE — «взвешенные частицы», смог." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — PYŁU, местный — W PYLE: Ł перед E переходит в L. Множественное — о видах частиц: PYŁY." }
  - { kind: government, text: "Покрытый пылью — POKRYTY PYŁEM, творительный без предлога. Облако пыли — CHMURA PYŁU, родительный." }
  - { kind: pronunciation, text: "Читается «пыу», один слог. Y — «ы», Ł — краткое «у». В местном падеже: W PYLE — «фпы́ле», предлог сливается со словом." }
collocations:
  - { pl: "pył węglowy", ru: "угольная пыль" }
  - { pl: "pył wulkaniczny", ru: "вулканический пепел" }
  - { pl: "pyły zawieszone", ru: "взвешенные частицы" }
family:
