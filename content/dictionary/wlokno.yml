etymology: "Общеславянское слово, родственное русскому «волочь»: волокно — то, что вытягивают. Польское ŁÓ на месте русского «оло» — то же соответствие, что GŁOWA и «голова»."
memory: "Włókno — волокно: ło вместо «оло», как głowa — голова. Читается «вуу́кно». Włókno szklane — стекловолокно. Włókien — родительный множественного."
idioms:
