notes:
  - { kind: false-friend, text: "WŁÓKNO — русское «волокно», но короче: польскому ŁÓ отвечает русское полногласие «оло». Так же GŁOWA — «голова», MŁOTEK — «молоток». Пищевые волокна, «клетчатка», в быту называют BŁONNIK, а не WŁÓKNO. Нить в лампочке — тоже WŁÓKNO." }
  - { kind: usage, text: "Девять форм, средний род, без звательного. В родительном множественного появляется беглое E: WŁÓKIEN, как OKNO — OKIEN. Ó сохраняется во всех формах." }
  - { kind: government, text: "Из какого волокна — Z с родительным: Z WŁÓKNA BAMBUSOWEGO, Z WŁÓKIEN NATURALNYCH. Укреплённый волокном — творительный без предлога: WZMOCNIONY WŁÓKNAMI WĘGLOWYMI." }
  - { kind: pronunciation, text: "Читается «вуу́кно», два слога, ударение на первом. Ł и Ó оба звучат как «у» и сливаются в долгое «уу». Никакого «л» и никакого «о»." }
  - { kind: register, text: "Слово нейтральное и техническое: в текстиле, медицине, связи. Оптоволоконный кабель — ŚWIATŁOWÓD. Текстильная промышленность — PRZEMYSŁ WŁÓKIENNICZY." }
collocations:
