senses:
  - id: examine-medical
    ru: "обследовать, осмотреть (о враче)"
    examples:
      - pl: "Lekarz zbadał pacjenta w pięć minut."
        ru: "Врач обследовал пациента за пять минут."
        source: { kind: authored }
      - pl: "Lekarz musi cię zbadać."
        ru: "Врач должен тебя обследовать."
        source: { kind: authored }
      - pl: "Zbadani pacjenci wrócili do domu."
        ru: "Обследованные пациенты вернулись домой."
        source: { kind: authored }
  - id: investigate
    ru: "исследовать, изучить, расследовать"
    examples:
      - pl: "Trzeba zbadać przyczyny awarii."
        ru: "Надо исследовать причины аварии."
        source: { kind: authored }
      - pl: "Sprawę zbadano pobieżnie."
        ru: "Дело расследовали поверхностно."
        source: { kind: authored }
  - id: examination
    ru: "zbadanie — обследование, исследование"
    examples:
      - pl: "Zbadanie sprawy zajęło miesiąc."
        ru: "Исследование дела заняло месяц."
        source: { kind: authored }
      - pl: "Po zbadaniu pacjenta wypisał zwolnienie."
        ru: "Осмотрев пациента, он выписал больничный."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Прозрачного русского родственника у корня НЕТ: badać «исследовать» не связано ни с одним обиходным русским словом, и подбирать созвучие не стоит. Зато производное badanie — одно из самых нужных слов в быту: badanie krwi «анализ крови», badania okresowe «периодический осмотр», badanie USG. Если запомнить badanie, глагол запомнится вместе с ним." }
  - { kind: government, text: "Обследуют КОГО и исследуют ЧТО — в обоих случаях ВИНИТЕЛЬНЫЙ: zbadać pacjenta, zbadać sprawę, zbadać wodę. Расхождений с русским здесь нет. Несовершенная пара — badać, и в медицинском смысле она обычнее: lekarz bada pacjenta." }
  - { kind: pronunciation, text: "ТРЕТИЙ образец страдательного причастия, и теперь можно вывести правило. Глаголы на -ać дают -any, а в мужско-личном множественном -ani: zbadany — zbadani, przeszukany — przeszukani. Глаголы на -ić/-yć дают -ony и -eni (zatrudniony — zatrudnieni, odrzucony — odrzuceni). Небольшая группа даёт -ty и -ci (pobity — pobici). Класс причастия предсказуем по инфинитиву, так что заучивать его отдельно для каждого глагола не нужно." }
collocations:
  - { pl: "zbadać pacjenta", ru: "обследовать пациента" }
  - { pl: "badanie krwi", ru: "анализ крови" }
  - { pl: "zbadać przyczyny", ru: "исследовать причины" }
family:
  - { pl: "badać", ru: "исследовать, обследовать", relation: aspect, id: badac }
  - { pl: "badanie", ru: "обследование, анализ", relation: derived, id: badanie }
  - { pl: "badacz", ru: "исследователь", relation: derived }
etymology: "Приставка z- плюс badać, глагол тёмного происхождения: его связывают с праславянским корнем со значением «колоть, тыкать» — то есть «пробовать, ощупывать». Надёжного русского соответствия нет, и это тот случай, когда честнее сказать прямо, чем подыскивать похожее слово. Производные прозрачны и важнее самого корня: badanie «обследование», badacz «исследователь», badawczy «исследовательский»."
memory: "zbadać — «обследовать, исследовать». Русского родственника у корня нет, но держитесь за badanie: badanie krwi это «анализ крови». Причастие zbadany, а во множественном мужско-личном zbadani — образец -any/-ani для глаголов на -ać."
idioms:
  - { pl: "badanie krwi", ru: "анализ крови" }
  - { pl: "zbadać sprawę od podszewki", ru: "изучить дело до мелочей" }
