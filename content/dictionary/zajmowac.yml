# review
id: zajmowac
format: 2
lemma: "zajmować"
rank: 643
pos: verb
aspect: imperf
aspectPair: zajac
pron: { cyr: "займо́ваць" }
senses:
  - id: deal-with
    ru: "zajmować się czymś — заниматься чем-л. (творительный)"
    note: "Czym się zajmujesz? — обиходное «кем ты работаешь?»."
    examples:
      - pl: "Czym się zajmujesz w twoim kraju?"
        ru: "Чем ты занимаешься в своей стране?"
        source: { kind: tatoeba, id: 849080 }
      - pl: "Czym się zajmujesz?"
        ru: "Чем ты занимаешься?"
        source: { kind: translated, id: 769972 }
      - pl: "Zajmują się badaniami nad rakiem."
        ru: "Они занимаются исследованиями рака."
        source: { kind: translated, id: 758330 }
  - id: occupy-time
    ru: "занимать (время)"
    note: "Ile czasu to zajmuje? «Сколько времени это занимает?»"
    examples:
      - pl: "Ile czasu to zajmuje?"
        ru: "Сколько времени это занимает?"
        source: { kind: tatoeba, id: 6313116 }
      - pl: "Jak długo to zajmuje?"
        ru: "Сколько времени это займёт?"
        source: { kind: tatoeba, id: 6313127 }
      - pl: "Facebook zajmuje mi dużo czasu."
        ru: "Facebook отнимает у меня много времени."
        source: { kind: tatoeba, id: 2149147 }
  - id: occupy-space
    ru: "занимать (место, помещение)"
    examples:
      - pl: "Sama zajmowała ten duży pokój."
        ru: "Она одна занимала эту большую комнату."
        source: { kind: translated, id: 743197 }
      - pl: "Teraz ja zajmuję łazienkę."
        ru: "Сейчас ванную занимаю я."
        source: { kind: translated, id: 1348822 }
      - pl: "Szafa zajmuje pół pokoju."
        ru: "Шкаф занимает полкомнаты."
        source: { kind: authored }
  - id: engaging
    ru: "zajmujący — занимательный, интересный"
    note: "Сдвиг значения тот же, что у русского «занимательный»."
    examples:
      - pl: "Wystąpienie Toma było całkiem zajmujące."
        ru: "Выступление Тома было довольно занимательным."
        source: { kind: translated, id: 7899698 }
      - pl: "To zajmujący wykład."
        ru: "Это занимательная лекция."
        source: { kind: authored }
      - pl: "Film okazał się zajmujący."
        ru: "Фильм оказался занимательным."
        source: { kind: authored }
notes:
  - { kind: government, text: "Главная конструкция — zajmować się CZYMŚ, творительный падеж: Czym się zajmujesz?, zajmuje się polityką. Здесь польский и русский совпадают полностью." }
  - { kind: usage, text: "Czym się zajmujesz? — обиходный способ спросить «кем ты работаешь?», а не только «чем ты сейчас занят»." }
  - { kind: usage, text: "Без się остаётся простое «занимать»: Ile czasu to zajmuje?, zajmować miejsce «занимать место»." }
  - { kind: usage, text: "Причастие zajmujący сдвинулось в сторону «занимательный, интересный»: Wystąpienie było zajmujące." }
  - { kind: usage, text: "Совершенный вид — zająć: zajmował długo, w końcu zajął." }
collocations:
  - { pl: "zajmować się czymś", ru: "заниматься чем-либо" }
  - { pl: "Czym się zajmujesz?", ru: "Чем ты занимаешься?" }
  - { pl: "zajmować miejsce", ru: "занимать место" }
  - { pl: "zajmujący", ru: "занимательный" }
family:
  - { pl: "zająć", ru: "занять", relation: aspect }
  - { pl: "zajęcie", ru: "занятие", relation: derived }
  - { pl: "zajmujący", ru: "занимательный", relation: derived }
etymology: "Приставка za- плюс старое jmować «имать, брать» — то же гнездо, что русские «занимать», «иметь» и «взять»."
memory: "zajmować — «занимать», и главное здесь возвратное: zajmować się CZYMŚ с творительным, ровно как в русском. Czym się zajmujesz? значит не только «чем ты сейчас занят», но и обиходное «кем ты работаешь?». Без się остаётся простое «занимать»: Ile czasu to zajmuje?, zajmować miejsce. А причастие zajmujący сдвинулось в сторону «занимательный»: wystąpienie było zajmujące. Совершенный вид — zająć."
idioms:
  - { pl: "zajmować się czymś", ru: "заниматься чем-либо" }
  - { pl: "Czym się zajmujesz?", ru: "Чем ты занимаешься?" }
  - { pl: "zajmować miejsce", ru: "занимать место" }
