# review
id: odeslac
format: 2
lemma: "odesłać"
rank: 2571
pos: verb
pron: { cyr: "одэ́суаць" }
senses:
  - id: send-back
    ru: "отослать обратно, вернуть"
    examples:
      - pl: "Odesłał towar następnego dnia."
        ru: "Он отослал товар на следующий день."
        source: { kind: authored }
      - pl: "Odeślij paczkę, jeśli rozmiar nie pasuje."
        ru: "Отошли посылку обратно, если размер не подошёл."
        source: { kind: authored }
  - id: refer
    ru: "направить (к врачу, в инстанцию)"
    examples:
      - pl: "Lekarz odesłał go do specjalisty."
        ru: "Врач направил его к специалисту."
        source: { kind: authored }
      - pl: "Odesłano nas do innego okienka."
        ru: "Нас отправили к другому окошку."
        source: { kind: authored }
  - id: send-away
    ru: "отослать, отправить прочь"
    examples:
      - pl: "Odesłała dzieci do babci na wakacje."
        ru: "Она отослала детей к бабушке на каникулы."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "ОСНОВА МЕНЯЕТСЯ ВНУТРИ ПАРАДИГМЫ: SŁ В ИНФИНИТИВЕ И ПРОШЕДШЕМ, ŚL В БУДУЩЕМ И ПОВЕЛИТЕЛЬНОМ. ODESŁAĆ, ODESŁAŁ — но ODEŚLĘ, ODEŚLE, ODEŚLIJ. Это то же смягчение, что в masło — maśle и zmysł — zmyśle, только здесь оно работает не между падежами, а между временами. Русское «отослать — отошлю» тоже перестраивает основу, но иначе, так что подсказки от родного языка нет." }
  - { kind: government, text: "НАПРАВЛЯЮТ DO KOGOŚ — РОДИТЕЛЬНЫЙ, А НЕ ДАТЕЛЬНЫЙ. Odesłać kogoś DO lekarza, DO specjalisty, DO urzędu. Русское «отослать К врачу» ставит дательный, польское do знает только родительный. Та же схема, что в wsiąść do pociągu и pakować do walizki: предлог do падежа не меняет никогда." }
  - { kind: usage, text: "Три значения различает дополнение. ODESŁAĆ TOWAR — «вернуть, отослать назад»; ODESŁAĆ KOGOŚ DO LEKARZA — «направить»; ODESŁAĆ DZIECI NA WIEŚ — «отправить прочь». Отдельно стоит идиома ODESŁAĆ KOGOŚ Z KWITKIEM «отправить ни с чем, отшить»: kwitek это «квиток, бумажка», и человек уходит с одной бумажкой вместо дела." }
collocations:
  - { pl: "odesłać towar", ru: "вернуть товар" }
  - { pl: "odesłać do lekarza", ru: "направить к врачу" }
  - { pl: "odesłać list", ru: "отослать письмо обратно" }
family:
  - { pl: "odsyłać", ru: "отсылать, возвращать (несов.)", relation: aspect }
  - { pl: "słać", ru: "слать", relation: root }
  - { pl: "przesłać", ru: "переслать", relation: root }
etymology: "Приставки od- и e- при корне słać, из праславянского *sъlati — того же слова, что русское «слать». Разбор совпадает морфема в морфему: od-e-słać и «от-о-слать», даже беглый гласный на месте. Из этого же гнезда польские posłać, przesłać, wysłać и наши «послать», «переслать», «выслать»."
memory: "Основа раздваивается по временам: odesłać и odesłał с sł, но odeślę, odeśle, odeślij с мягким śl. И падеж: odesłać do lekarza — родительный, а не «к врачу» с дательным."
idioms:
  - { pl: "odesłać kogoś z kwitkiem", ru: "отправить кого-л. ни с чем" }
  - { pl: "odesłać do źródła", ru: "отослать к первоисточнику" }
