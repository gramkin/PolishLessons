# review
id: plansza
format: 2
lemma: "plansza"
rank: 5981
pos: noun
pron: { cyr: "пла́нша" }
senses:
  - id: board
    ru: "игровое поле, доска (для настольной игры)"
    examples:
      - { pl: "Rozłóż planszę na stole.", ru: "Разложи игровое поле на столе.", source: { kind: authored } }
      - { pl: "Pionki spadły z planszy.", ru: "Фишки упали с доски.", source: { kind: authored } }
  - id: chart
    ru: "плакат, наглядная таблица, стенд"
    examples:
      - { pl: "Nauczyciel powiesił planszę z układem okresowym.", ru: "Учитель повесил таблицу Менделеева.", source: { kind: authored } }
      - { pl: "Na planszy przedstawiono budowę oka.", ru: "На плакате изображено строение глаза.", source: { kind: authored } }
  - id: level
    ru: "уровень, экран (в компьютерной игре)"
    examples:
      - { pl: "Przeszedłem już trzecią planszę.", ru: "Я уже прошёл третий уровень.", source: { kind: authored } }
      - { pl: "Na ostatniej planszy czeka smok.", ru: "На последнем уровне ждёт дракон.", source: { kind: authored } }
notes:
  - { kind: false-friend, text: "PLANSZA — не «планшет» (это TABLET) и не «план» (PLAN). Это доска или лист с изображением: игровое поле, учебный плакат, стенд на выставке, а в компьютерных играх — уровень." }
  - { kind: usage, text: "Женский род на -SZA склоняется мягко: в родительном, дательном и предложном — PLANSZY, во множественном — PLANSZE, родительный множественного — PLANSZ без окончания. Звательный PLANSZO не употребляется." }
  - { kind: usage, text: "В фехтовании PLANSZA — дорожка, на которой идёт поединок. Прилагательное PLANSZOWY: GRA PLANSZOWA — настольная игра, разговорно PLANSZÓWKA." }
collocations:
  - { pl: "gra planszowa", ru: "настольная игра" }
  - { pl: "plansza do gry", ru: "игровое поле" }
  - { pl: "plansza edukacyjna", ru: "учебный плакат" }
  - { pl: "przejść planszę", ru: "пройти уровень" }
family:
  - { pl: "planszowy", ru: "настольный (об игре)", relation: derived }
  - { pl: "planszówka", ru: "настолка (разг.)", relation: derived }
synonyms: ["tablica", "poziom"]
etymology: "Из французского PLANCHE «доска». Тот же латинский корень, что в русских «планка» и «планшет»."
memory: "Plansza — доска (фр. planche): игровое поле, учебный плакат, уровень в игре. Gra planszowa — настольная игра."
idioms:
  - { pl: "gra planszowa", ru: "настольная игра" }
formExamplesSkip:
