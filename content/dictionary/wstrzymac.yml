        ru: "Она сдержала слёзы до конца разговора."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самое нужное выражение из этой карточки — парламентское и канцелярское: WSTRZYMAĆ SIĘ OD GŁOSU значит «воздержаться при голосовании». DWÓCH POSŁÓW WSTRZYMAŁO SIĘ OD GŁOSU — «двое депутатов воздержались». По-русски здесь совсем другой корень, «держать» против «воздержаться» с приставкой воз-, так что сходство частей обманчиво: польский строит это от «задержать себя от голоса». Существительное — WSTRZYMANIE SIĘ OD GŁOSU, и в протоколах оно стоит рядом с ZA и PRZECIW." }
  - { kind: false-friend, text: "Корень TRZYMAĆ «держать» русскому не родня — и это редкий случай, когда помощь приходит не из русского, а из украинского. TRZYMAĆ родственно украинскому «тримати», а русское «держать» идёт от другого корня, *derž-. Поэтому TRZYMAĆ приходится запоминать отдельно, зато всё гнездо потом открывается сразу: TRZYMAĆ «держать», WSTRZYMAĆ «приостановить», ZATRZYMAĆ «задержать», UTRZYMAĆ «удержать, содержать», POWSTRZYMAĆ «удержать, сдержать»." }
  - { kind: usage, text: "Пятьдесят три формы: совершенный переходный, с деепричастием WSTRZYMAWSZY и без действительного причастия. Основа одна на все формы, как у всех глаголов на -AĆ: WSTRZYMAM, WSTRZYMA, WSTRZYMAJĄ, WSTRZYMAŁ, WSTRZYMANY. Повелительное WSTRZYMAJ выходит из третьего лица WSTRZYMA прибавлением -j. А вот несовершенная пара устроена иначе: WSTRZYMYWAĆ даёт в настоящем времени WSTRZYMUJĘ, WSTRZYMUJE — то есть -YWA- сменяется на -UJ-. Это обычное дело для глаголов на -YWAĆ, и его стоит отметить отдельно." }
  - { kind: government, text: "Переходный, винительный: WSTRZYMAĆ COŚ — wstrzymać produkcję, wstrzymać wypłatę, wstrzymać oddech. С SIĘ и предлогом OD с родительным значит «воздержаться от чего-то»: WSTRZYMAĆ SIĘ OD GŁOSU, WSTRZYMAĆ SIĘ OD KOMENTARZA. Русский берёт здесь тот же предлог «от» с родительным — «воздержаться от комментария», — так что управление переносится без поправок, хотя корень и другой." }
collocations:
  - { pl: "wstrzymać produkcję", ru: "приостановить производство" }
  - { pl: "wstrzymać oddech", ru: "задержать дыхание" }
  - { pl: "wstrzymać się od głosu", ru: "воздержаться при голосовании" }
family:
  - { pl: "wstrzymywać", ru: "приостанавливать", relation: aspect }
  - { pl: "trzymać", ru: "держать", relation: root, id: trzymac }
  - { pl: "zatrzymać", ru: "задержать, остановить", relation: root, id: zatrzymac }
etymology: "Приставка w- со старым wz- и TRZYMAĆ «держать», из праславянского *trimati — слово, родственное украинскому «тримати», но не русскому «держать», у которого корень *derž-. Буквально «удержать на ходу, придержать». Гнездо в польском большое и прозрачное внутри себя: TRZYMAĆ, ZATRZYMAĆ «задержать», UTRZYMAĆ «содержать», POWSTRZYMAĆ «сдержать», WSTRZYMAĆ «приостановить». Русскому придётся запомнить корень один раз, зато потом всё гнездо читается само."
memory: "trzymać — это «держать», но корень не русский, а как в украинском «тримати». А wstrzymać się od głosu значит «воздержаться при голосовании»."
idioms:
  - { pl: "wstrzymać się od głosu", ru: "воздержаться при голосовании" }
  - { pl: "wstrzymać oddech", ru: "задержать дыхание" }
