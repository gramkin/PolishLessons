notes:
  - { kind: false-friend, text: "Главное про это слово: одно польское слово покрывает два русских. PROMIEŃ это и «луч», и «радиус». PROMIEŃ SŁOŃCA — «луч солнца», а PROMIEŃ OKRĘGU — «радиус окружности», и выбор перевода решает только контекст. Русский здесь обходится двумя словами: исконным «лучом» и латинским «радиусом». Польский латинского слова в этом значении почти не употребляет, хотя RADIUS в учебниках встретить можно. Отсюда же очень частое обстоятельство W PROMIENIU плюс родительный — «в радиусе»: W PROMIENIU KILKU KILOMETRÓW. Производное PROMIENIOWANIE значит «излучение», а PROMIENIOWY — «лучевой» и «радиальный» сразу, с той же двойственностью." }
  - { kind: government, text: "Мужской род, неодушевлённое, основа мягкая на -Ń. Чего луч или радиус — родительный: PROMIEŃ SŁOŃCA, PROMIEŃ LATARKI, PROMIEŃ OKRĘGU. Устойчивое W PROMIENIU плюс родительный передаёт расстояние вокруг точки: W PROMIENIU DWÓCH KILOMETRÓW «в радиусе двух километров». Частотные сочетания: PROMIENIE SŁONECZNE «солнечные лучи», PROMIENIE RENTGENOWSKIE «рентгеновские лучи», PROMIENIE ULTRAFIOLETOWE, PROMIEŃ LASERA. Во множественном слово употребляется не реже, чем в единственном, потому что лучи обычно идут пучком." }
  - { kind: usage, text: "Основа мягкая, и это задаёт всё склонение: именительный PROMIEŃ кончается на мягкое Ń, а во всех остальных формах мягкость переходит на следующий гласный и записывается через I — PROMIENIA, PROMIENIOWI, PROMIENIEM, PROMIENIU. Так же ведут себя KAMIEŃ и KAMIENIA, DZIEŃ и DNIA, OGIEŃ и OGNIA, хотя у последних двух выпадает ещё и гласная. Родительный множественного — PROMIENI, с окончанием -I, типичным для мягких основ, а не -ÓW. Именительный множественного — PROMIENIE. Так в единственном числе Ń появляется ровно один раз, в именительном, а дальше его сменяет NI." }
  - { kind: pronunciation, text: "Читается «про́мень», два слога, ударение на первом. Конечное Ń это мягкое «нь», произносимое отчётливо и без гласной после него. Как только добавляется окончание, мягкость переходит на гласный: PROMIENIA звучит «проме́ня», PROMIENIEM — «проме́нем», PROMIENIU — «проме́ню». Обратить внимание стоит на то, что ударение перемещается, потому что слогов становится три, а польское ударение всегда на предпоследнем. В родительном множественного PROMIENI слышно «проме́ни»." }
