etymology: "Слово праславянского происхождения, образованное суффиксом -EŃ, который в польском и русском делает имена предметов и явлений: KAMIEŃ и «камень», KORZEŃ и «корень», JĘCZMIEŃ и «ячмень». Русского однокоренного соответствия у PROMIEŃ нет: там, где польский говорит PROMIEŃ, русский употребляет «луч», слово другого корня, и «радиус», заимствованный из латыни. Поэтому заучивать пару по корню здесь не получится, и запоминать надо само слово вместе с его двойным значением. Зато суффикс работает одинаково в обоих языках, и склонение PROMIEŃ повторяет склонение KAMIEŃ форма за формой, что русскому заметно сразу: PROMIENIA как KAMIENIA, PROMIENIEM как KAMIENIEM. Производное PROMIENIOWANIE «излучение» построено от глагола PROMIENIOWAĆ «излучать», и в русском ему отвечает та же конструкция с суффиксом -НИЕ."
memory: "Одно польское слово на два русских: promień — это и «луч», и «радиус». Promień słońca, но promień okręgu; выбирает контекст. Очень частое w promieniu + родительный — «в радиусе». Однокоренного русского слова нет: по-русски «луч» и «радиус» — другие корни, так что учить придётся само слово. Склоняется как kamień: promienia, promieniem, promieniu; родительный множественного promieni, не promieniów."
