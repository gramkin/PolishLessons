# review
id: wstretny
format: 2
lemma: "wstrętny"
rank: 4987
pos: adj
pron: { cyr: "фстрэ́нтны" }
senses:
  - id: disgusting
    ru: "отвратительный, мерзкий"
    examples:
      - pl: "To wstrętne!"
        ru: "Это отвратительно!"
        source: { kind: translated, id: 8620996 }
      - pl: "Tom jest wstrętny."
        ru: "Том отвратителен."
        source: { kind: translated, id: 3313273 }
