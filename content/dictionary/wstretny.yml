# review
id: wstretny
format: 2
lemma: "wstrętny"
rank: 2227
pos: adj
pron: { cyr: "фстрэ́нтны" }
senses:
  - id: disgusting
    ru: "отвратительный, мерзкий"
    examples:
      - pl: "To wstrętne!"
        ru: "Это отвратительно!"
        source: { kind: translated, id: 8620996 }
      - pl: "Tom jest wstrętny."
        ru: "Том отвратителен."
        source: { kind: translated, id: 3313273 }
      - pl: "To lekarstwo ma wstrętny smak."
        ru: "У этого лекарства отвратительный вкус."
        source: { kind: translated, id: 1623024 }
  - id: repulsive
    ru: "гадкий, противный (о человеке)"
    examples:
      - pl: "Wstrętny typ."
        ru: "Мерзкий тип."
        source: { kind: translated, id: 13640112 }
      - pl: "On nigdy się do tego nie przyzna, bo jest wstrętną, ohydną pijawką."
        ru: "Он никогда в этом не признается, потому что он мерзкий, гадкий человек."
        source: { kind: translated, id: 7960568 }
notes:
  - { kind: false-friend, text: "Не «встречный»! Корень wstręt «отвращение», ср. русское «стремиться» в исходном смысле «отталкиваться». Встречный по-польски — nadjeżdżający или przeciwny." }
  - { kind: government, text: "Обычное прилагательное; сравнительная степень — wstrętniejszy." }
  - { kind: usage, text: "Сильное слово: резче, чем brzydki «некрасивый» или nieprzyjemny «неприятный»." }
  - { kind: usage, text: "Существительное wstręt «отвращение»: czuć wstręt do czegoś «чувствовать отвращение к чему-л.»." }
collocations:
  - { pl: "wstrętny typ", ru: "мерзкий тип" }
  - { pl: "wstrętny smak", ru: "отвратительный вкус" }
etymology: "От wstręt «отвращение», праславянский корень со значением отталкивания."
memory: "wstrętny — «отвратительный, мерзкий», и это не «встречный». Существительное wstręt «отвращение»: czuć wstręt do czegoś."
idioms:
