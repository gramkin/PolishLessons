# review
id: pelny
format: 2
lemma: "pełny"
rank: 389
pos: adj
pron: { cyr: "пэ́уны" }
senses:
  - id: full
    ru: "полный, наполненный"
    examples:
      - pl: "Zlew jest pełen brudnych naczyń."
        ru: "Раковина полна грязной посуды."
        source: { kind: tatoeba, id: 9532588 }
      - pl: "Świat jest pełen głupców."
        ru: "Мир полон дураков."
        source: { kind: tatoeba, id: 533534 }
      - pl: "Wszechświat jest pełen tajemnic."
        ru: "Вселенная полна тайн."
        source: { kind: tatoeba, id: 2679586 }
  - id: complete
    ru: "полный, целый (о версии, мере, объёме)"
    examples:
      - pl: "Kup pełną wersję."
        ru: "Купи полную версию."
        source: { kind: translated, id: 11581323 }
      - pl: "Chcemy pełnych zdań."
        ru: "Мы хотим полных предложений."
        source: { kind: translated, id: 2830012 }
      - pl: "Czekaliśmy pełne dwie godziny."
        ru: "Мы ждали целых два часа."
        source: { kind: authored }
notes:
  - { kind: usage, text: "У мужского рода две формы: длинная pełny и короткая pełen. В сказуемом почти всегда стоит короткая: Świat jest pełen głupców «Мир полон дураков»." }
  - { kind: usage, text: "После pełen/pełny идёт родительный падеж — ровно как после русского «полон»: pełen nadziei «полон надежды», pełna wody «полная воды»." }
  - { kind: usage, text: "О сытом человеке pełny — разговорное: Jestem pełny «Я наелся»." }
  - { kind: usage, text: "do pełna — «до краёв»; на заправке это готовая фраза: Do pełna, proszę «Полный бак, пожалуйста»." }
collocations:
  - { pl: "pełen nadziei", ru: "полон надежды" }
  - { pl: "do pełna", ru: "до полного (бака), доверху" }
  - { pl: "pełna wersja", ru: "полная версия" }
  - { pl: "na pełnym etacie", ru: "на полной ставке" }
etymology: "Праславянское *pьlnъ; русское «полный» — то же слово, польское ł стоит ровно там, где русское «ол»."
memory: "pełny — «полный», и корень виден сразу: ł на месте русского «ол». Запомните короткую форму для сказуемого: Świat jest pełen głupców. Падеж после неё родительный, как в русском «полон надежды» — pełen nadziei. А на заправке говорят Do pełna, proszę."
idioms:
  - { pl: "do pełna", ru: "до полного (бака), доверху" }
  - { pl: "pełne morze", ru: "открытое море" }
  - { pl: "koń pełnej krwi", ru: "чистокровная лошадь" }
  - { pl: "mieć pełne ręce roboty", ru: "быть по горло в делах" }
formExamplesSkip:
  - { form: "pełnego", cell: "Винительный", reason: "винительный падеж одушевлённого мужского рода от этого слова почти не употребляется" }
  - { form: "pełnych", cell: "Винительный", reason: "винительный падеж мужско-личного множественного числа от этого слова почти не употребляется" }
