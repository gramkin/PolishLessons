        ru: "Этот совет сэкономил нам час работы."
        source: { kind: authored }
notes:
  - { kind: government, text: "Женский род на мягкий согласный: podpowiedź, podpowiedzi, podpowiedzią. Родительный, дательный, предложный и всё множественное, кроме творительного, — podpowiedzi." }
  - { kind: usage, text: "И школьная подсказка, и подсказка в программе: podpowiedź w wyszukiwarce «подсказка в поисковике»." }
  - { kind: usage, text: "Частые глаголы: dać podpowiedź, rzucić podpowiedź, skorzystać z podpowiedzi." }
  - { kind: false-friend, text: "Образовано точно как русское «подсказка»: pod- это «под-», powiedzieć это «сказать». Разбор по частям здесь работает безошибочно." }
collocations:
  - { pl: "dać podpowiedź", ru: "дать подсказку" }
  - { pl: "bez podpowiedzi", ru: "без подсказки" }
  - { pl: "skorzystać z podpowiedzi", ru: "воспользоваться подсказкой" }
family:
  - { pl: "powiedzieć", ru: "сказать", relation: root, id: powiedziec }
  - { pl: "podpowiedzieć", ru: "подсказать", relation: root }
  - { pl: "wskazówka", ru: "указание, подсказка", relation: derived, id: wskazowka }
  - { pl: "rada", ru: "совет", relation: derived, id: rada }
etymology: "От podpowiedzieć «подсказать»: приставка pod- «под-» плюс powiedzieć «сказать». Русское «подсказка» построено из тех же частей в том же порядке, поэтому слово разбирается без словаря."
memory: "podpowiedź — «подсказка», часть в часть: pod- = «под-», powiedzieć = «сказать». Женский род на -ź, поэтому bez podpowiedzi."
idioms:
  - { pl: "dać podpowiedź", ru: "дать подсказку" }
