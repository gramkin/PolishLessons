rank: 5756
pos: noun
pron: { cyr: "подпо́вьедзь" }
senses:
  - id: hint
    ru: "подсказка"
    examples:
      - pl: "Podpowiedź nauczyciela uratowała go przy tablicy."
        ru: "Подсказка учителя спасла его у доски."
        source: { kind: authored }
      - pl: "Dał mi podpowiedź w ostatniej chwili."
        ru: "Он дал мне подсказку в последний момент."
        source: { kind: authored }
      - pl: "Bez podpowiedzi nie zgadłby nigdy."
        ru: "Без подсказки он никогда бы не угадал."
