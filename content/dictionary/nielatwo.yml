id: nielatwo
format: 2
lemma: "niełatwo"
rank: 2008
pos: adv
pron: { cyr: "неуа́тво" }
senses:
  - id: not-easy
    ru: "нелегко, непросто"
    examples:
      - pl: "Niełatwo rzucić palenie."
        ru: "Бросить курить нелегко."
        source: { kind: translated, id: 6689580 }
      - pl: "Niełatwo pojąć jego teorię."
        ru: "Нелегко понять его теорию."
        source: { kind: translated, id: 966863 }
      - pl: "Niełatwo jest zmanipulować koziorożca."
        ru: "Козерогом нелегко манипулировать."
        source: { kind: translated, id: 12586561 }
      - pl: "Niełatwo mi o tym mówić."
        ru: "Мне нелегко об этом говорить."
        source: { kind: authored }
      - pl: "Niełatwo było znaleźć pracę."
        ru: "Работу было найти нелегко."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Пишется слитно: niełatwo. Это отрицание наречия łatwo «легко»." }
  - { kind: usage, text: "Обычно с инфинитивом (niełatwo rzucić palenie «нелегко бросить курить») или с дательным: niełatwo mi «мне нелегко»." }
  - { kind: false-friend, text: "Русское «нелегко» тоже пишется слитно, так что здесь языки совпадают — но польское łatwo не родственно «лёгкому»: оно от łatwy, а «лёгкий» по-польски lekki." }
collocations:
  - { pl: "niełatwo powiedzieć", ru: "нелегко сказать" }
  - { pl: "niełatwo zrozumieć", ru: "нелегко понять" }
etymology: "nie + łatwo, наречие от łatwy «лёгкий, нетрудный». Русское «нелегко» устроено так же, но от другого корня."
memory: "niełatwo = «нелегко», буквально nie + łatwo. Пишется слитно, как и русское «нелегко»."
idioms:
  - { pl: "niełatwo mu dogodzić", ru: "ему трудно угодить" }
