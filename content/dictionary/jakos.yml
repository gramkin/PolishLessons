# review
id: jakos
format: 2
lemma: "jakoś"
rank: 695
pos: adv
pron: { cyr: "я́кось" }
senses:
  - id: somehow
    ru: "как-то, как-нибудь"
    note: "Damy sobie jakoś radę «Как-нибудь справимся»."
    examples:
      - pl: "Jakoś niezauważalnie przeszliśmy na \"ty\"."
        ru: "Как-то незаметно мы перешли на \"ты\"."
        source: { kind: tatoeba, id: 4719307 }
      - pl: "Damy sobie jakoś radę bez ciebie."
        ru: "Как-нибудь без тебя обойдёмся."
        source: { kind: tatoeba, id: 6995419 }
      - pl: "Jakoś to będzie."
        ru: "Как-нибудь обойдётся."
        source: { kind: authored }
  - id: somewhat
    ru: "что-то, как-то (о самочувствии, впечатлении)"
    note: "Jakoś nie czuję się dobrze «Что-то мне нездоровится»."
    examples:
      - pl: "Jakoś nie czuję się dobrze."
        ru: "Что-то я себя неважно чувствую."
        source: { kind: tatoeba, id: 10772282 }
      - pl: "Nie interesuję się tym jakoś szczególnie, ale coś kojarzę."
        ru: "Я специально этим не интересовался, но кое-что знаю."
        source: { kind: tatoeba, id: 13225507 }
      - pl: "Jakoś mi to nie pasuje."
        ru: "Что-то мне это не нравится."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два оттенка, и русский разводит их на разные слова. «Как-нибудь» о способе: Damy sobie jakoś radę. И «что-то, как-то» о смутном впечатлении: Jakoś nie czuję się dobrze." }
  - { kind: usage, text: "Устойчивое Jakoś to będzie «Как-нибудь обойдётся, всё образуется» — очень частая утешительная формула." }
  - { kind: usage, text: "Собрано как ktoś, coś, gdzieś: jak плюс частица -ś. Весь ряд неопределённых слов строится этим суффиксом." }
  - { kind: usage, text: "Не путайте с jakość «качество» — слово другое, с ć на конце." }
collocations:
  - { pl: "jakoś to będzie", ru: "как-нибудь обойдётся" }
  - { pl: "damy sobie jakoś radę", ru: "как-нибудь справимся" }
  - { pl: "jakoś nie…", ru: "что-то не…" }
  - { pl: "jakość", ru: "качество" }
family:
  - { pl: "jak", ru: "как", relation: root }
  - { pl: "ktoś", ru: "кто-то", relation: derived }
  - { pl: "jakość", ru: "качество", relation: root }
etymology: "Из jak «как» плюс частица -ś — тем же способом, что ktoś «кто-то» и coś «что-то». Русское «как-то» собрано параллельно."
memory: "jakoś — «как-то, как-нибудь», и собрано оно как весь свой ряд: jak плюс -ś, наравне с ktoś, coś, gdzieś. Держите в голове два оттенка, которые русский разводит: о способе — Damy sobie jakoś radę «Как-нибудь справимся», а о смутном впечатлении — Jakoś nie czuję się dobrze «Что-то мне нездоровится». И не спутайте с jakość «качество»: там на конце ć."
