    ru: "Город постигло землетрясение."
    source: { kind: authored }
  - form: "dotknęły"
    pl: "Skutki najbardziej dotknęły biedniejsze rodziny."
    ru: "Последствия сильнее всего ударили по более бедным семьям."
    source: { kind: translated, id: 12040920 }
