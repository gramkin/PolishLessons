# review
id: dotknac
format: 2
lemma: "dotknąć"
rank: 1333
pos: verb
aspect: perf
aspectPair: dotykac
pron: { cyr: "до́ткнонць" }
senses:
  - id: touch
    ru: "коснуться, потрогать"
    examples:
      - pl: "Czy mogę dotknąć twojej brody?"
        ru: "Можно потрогать твою бороду?"
        source: { kind: tatoeba, id: 5703743 }
      - pl: "Dotknął mojego ramienia."
        ru: "Он коснулся моего плеча."
        source: { kind: translated, id: 3011853 }
      - pl: "Dotknij tego."
        ru: "Потрогай это."
        source: { kind: translated, id: 6320385 }
  - id: affect
    ru: "затронуть, постигнуть (о беде, реформе)"
    examples:
      - pl: "Jak wiele nieszczęść dotknęło te dzieci!"
        ru: "Сколько несчастий постигло этих детей!"
        source: { kind: translated, id: 6324416 }
      - pl: "Nadchodząca reforma podatkowa nie dotknie sektora bankowego."
        ru: "Грядущая налоговая реформа не затронет банковский сектор."
        source: { kind: translated, id: 909205 }
  - id: hurt
    ru: "задеть, обидеть"
    examples:
      - pl: "Myślę, że dotknęłam nerwu."
        ru: "Кажется, я задела за живое."
        source: { kind: translated, id: 12194002 }
notes:
  - { kind: government, text: "Главное отличие от русского — падеж: dotknąć czego, родительный, а не винительный. dotknął mojego ramienia «он коснулся моего плеча», nie dotknąłeś herbaty «ты не притронулся к чаю»." }
  - { kind: usage, text: "Совершенный вид к dotykać." }
  - { kind: usage, text: "Второе значение — «затронуть, постигнуть» о беде или мере: Miasto dotknie deficyt wody «Город постигнет дефицит воды»." }
  - { kind: usage, text: "Третье — «задеть, обидеть»: Te słowa mnie dotknęły «Эти слова меня задели». Отсюда dotknąć do żywego «задеть за живое»." }
collocations:
  - { pl: "dotknąć ręką", ru: "коснуться рукой" }
  - { pl: "nie dotknąć jedzenia", ru: "не притронуться к еде" }
  - { pl: "dotknąć do żywego", ru: "задеть за живое" }
etymology: "Приставка do- и tknąć «тронуть» (праславянское *tъknǫti). Русские «ткнуть» и «тронуть» — того же гнезда."
memory: "dotknąć — «коснуться», совершенный вид к dotykać. Главное — падеж: dotknąć czego, родительный, а не винительный, как в русском «тронуть что». Dotknął mojego ramienia. И помните переносное dotknąć do żywego «задеть за живое»."
idioms:
  - { pl: "dotknąć do żywego", ru: "задеть за живое" }
  - { pl: "nie dotknąć jedzenia", ru: "не притронуться к еде" }
  - { pl: "dotknąć dna", ru: "достичь дна" }
