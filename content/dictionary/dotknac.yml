    pl: "Strach zaraża i niszczy wszystko, czego się dotknie."
    ru: "Страх заражает и уничтожает всё, чего коснётся."
    source: { kind: translated, id: 1355956 }
  - form: "dotknie"
    pl: "Nadchodząca reforma podatkowa nie dotknie sektora bankowego."
    ru: "Грядущая налоговая реформа не затронет банковский сектор."
    source: { kind: translated, id: 909205 }
  - form: "dotknie"
    pl: "Miasto dotknie ostry deficyt wody, jeśli natychmiast nie zaczną padać deszcze."
    ru: "Город постигнет острый дефицит воды, если немедленно не пойдут дожди."
    source: { kind: translated, id: 365753 }
  - form: "dotkniesz"
    pl: "Jeśli dotkniesz tego przewodu, kopnie cię prąd."
    ru: "Если ты коснёшься этого провода, тебя ударит током."
    source: { kind: translated, id: 999444 }
  - form: "dotkniesz"
    pl: "Jeśli dotkniesz tego przełącznika, załony automatycznie się odsuną."
    ru: "Если ты коснёшься этого выключателя, шторы раздвинутся автоматически."
    source: { kind: translated, id: 1348827 }
  - form: "dotkniesz"
    pl: "Nie dotkniesz tego."
    ru: "Ты этого не тронешь."
    source: { kind: authored }
  - form: "dotknięciem"
    pl: "Przed dotknięciem jedzenia umyj ręce."
    ru: "Перед тем как трогать еду, вымой руки."
    source: { kind: translated, id: 991191 }
  - form: "dotknięciem"
    pl: "Otworzył drzwi jednym dotknięciem."
    ru: "Он открыл дверь одним касанием."
    source: { kind: authored }
  - form: "dotknięciem"
    pl: "Steruje się lekkim dotknięciem."
    ru: "Управляют лёгким касанием."
    source: { kind: authored }
  - form: "dotknięte"
    pl: "Tereny dotknięte powodzią czekają na pomoc."
    ru: "Районы, затронутые наводнением, ждут помощи."
    source: { kind: authored }
  - form: "dotknięte"
    pl: "Miejsca dotknięte chorobą trzeba leczyć."
    ru: "Поражённые болезнью места нужно лечить."
    source: { kind: authored }
  - form: "dotknięte"
    pl: "Rodziny dotknięte kryzysem dostaną wsparcie."
    ru: "Семьи, затронутые кризисом, получат поддержку."
    source: { kind: authored }
  - form: "dotknij"
    pl: "Dotknij tego."
    ru: "Потрогай это."
    source: { kind: translated, id: 6320385 }
  - form: "dotknij"
    pl: "Dotknij zwierzę aby usłyszeć dźwięk."
    ru: "Дотронься до животного, чтобы услышать звук."
    source: { kind: tatoeba, id: 1399763 }
  - form: "dotknij"
    pl: "Dotknij mi czoła."
    ru: "Потрогай мне лоб."
    source: { kind: translated, id: 771907 }
