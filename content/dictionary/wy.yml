id: wy
format: 2
lemma: "wy"
rank: 83
pos: pron
pron: { cyr: "вы" }
senses:
  - id: you-pl
    ru: "вы (к нескольким лицам)"
    examples:
      - pl: "A wy?"
        ru: "А вы?"
        source: { kind: tatoeba, id: 3463022 }
      - pl: "Czy wy myślicie, że to łatwe?"
        ru: "Думаете, это легко?"
        source: { kind: tatoeba, id: 13781662 }
  - id: you-obj
    ru: "вас, вам, вами (косвенные падежи)"
    examples:
      - pl: "Nienawidzę was!"
        ru: "Я ненавижу вас!"
        source: { kind: tatoeba, id: 13785911 }
      - pl: "Dziękuję wam obojgu."
        ru: "Спасибо вам обоим."
        source: { kind: tatoeba, id: 6154782 }
      - pl: "Pokój z wami."
        ru: "Мир вам."
        source: { kind: tatoeba, id: 3460229 }
notes:
  - { kind: usage, text: "Вежливое «Вы» к одному человеку — не wy, а pan/pani с глаголом в третьем лице: Czy pan wie? «Вы знаете?»." }
collocations:
  - { pl: "u was", ru: "у вас" }
  - { pl: "z wami", ru: "с вами" }
etymology: "Праславянское *vy — то же слово, что русское «вы»."
memory: "wy = «вы» к группе людей, падежи узнаваемы: was «вас», wam «вам», wami «вами». Но вежливое обращение к одному человеку по-польски идёт через pan/pani, а не через wy — это главная разница с русским."
idioms:
