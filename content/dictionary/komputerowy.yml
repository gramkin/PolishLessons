notes:
  - { kind: false-friend, text: "Ловушка тут в написании. Польское KOMPUTER пишется через U и читается «компу́тэр», без всякого «ью»: русский взял слово по английскому звучанию и получил «компьютер», поляк записал по буквам и получил KOMPUTER. Поэтому KOMPIUTER по-польски не бывает, и в прилагательном та же основа: KOMPUTEROWY. На компьютере — NA KOMPUTERZE, с чередованием R в RZ." }
  - { kind: usage, text: "Все одиннадцать форм живые. Форма для мужчин-людей здесь есть и употребляется, потому что GRAFIK KOMPUTEROWY — это человек, а значит бывают GRAFICY KOMPUTEROWI и SPECJALIŚCI KOMPUTEROWI. Пропускать её, как у LODOWY или PODZIEMNY, здесь нельзя. Заметьте, что форма KOMPUTEROWI по виду совпадает с дательным падежом существительного KOMPUTER, но это разные слова." }
  - { kind: government, text: "На компьютере — NA KOMPUTERZE, предлог NA с местным падежом, и основа меняется: KOMPUTER, но NA KOMPUTERZE. В компьютерной игре — W GRZE KOMPUTEROWEJ, местный, и обратите внимание, что GRA даёт GRZE. Прилагательное стоит после существительного: GRA KOMPUTEROWA, PROGRAM KOMPUTEROWY, SIEĆ KOMPUTEROWA." }
  - { kind: pronunciation, text: "Читается «компутэро́вы», пять слогов, ударение на предпоследнем. Буква U даёт «у», а не «ью», поэтому второй слог это «пу». Буква E после T даёт «э», как и в самом KOMPUTER — «компу́тэр». Конечная Y даёт «ы». В женском роде KOMPUTEROWA это «компутэро́ва», в среднем KOMPUTEROWE — «компутэро́вэ»." }
  - { kind: register, text: "Слово нейтральное и повседневное. Самые частые сочетания — GRA KOMPUTEROWA «компьютерная игра», PROGRAM KOMPUTEROWY, SPRZĘT KOMPUTEROWY «компьютерная техника», SIEĆ KOMPUTEROWA. В разговорной речи есть и существительное KOMPUTEROWIEC — «компьютерщик», слово шутливое, и KOMPUTEROWO о том, что сделано на компьютере." }
