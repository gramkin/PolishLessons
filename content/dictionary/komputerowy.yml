  - { pl: "komputerowiec", ru: "компьютерщик", relation: derived }
etymology: "От KOMPUTER, взятого из английского COMPUTER, а то — от латинского COMPUTARE «считать». Оба языка взяли слово из английского, но разными путями: русский на слух, по английскому произношению, и получил «компьютер» с мягким «пью», а польский по написанию, и получил KOMPUTER с простым U. Отсюда и расхождение, которое видно на письме сразу, а на слух ещё заметнее."
memory: "Компьютерный. Запомните написание: по-польски komputer через u, и читается «компу́тэр», без «ью», потому что поляк записал английское слово по буквам, а русский на слух. Читается «компутэро́вы». Главное сочетание — gra komputerowa. На компьютере — na komputerze, с чередованием r в rz. Форма для людей живая: graficy komputerowi."
idioms:
  - { pl: "gra komputerowa", ru: "компьютерная игра" }
