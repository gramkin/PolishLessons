notes:
  - { kind: false-friend, text: "DZIEDZINA — «область, сфера», а не «наследство»: наследство — SPADEK, наследовать — DZIEDZICZYĆ. Исторически DZIEDZINA — «наследственное имение», отсюда общий корень." }
  - { kind: usage, text: "Девять форм, женский род. В местном N смягчается: W DZIEDZINIE. Родительный множественного — DZIEDZIN. Звательный DZIEDZINO не употребляется." }
