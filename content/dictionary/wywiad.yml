notes:
  - { kind: usage, text: "«Взять интервью» — przeprowadzić wywiad или zrobić wywiad; «дать интервью» — udzielić wywiadu с родительным падежом." }
  - { kind: usage, text: "Второе значение — государственная разведка: wywiad wojskowy «военная разведка», agent wywiadu «агент разведки»." }
  - { kind: false-friend, text: "Русское «интервью» по-польски именно wywiad — слово своё, а не заимствованное." }
  - { kind: usage, text: "Образовано от wywiadywać się «разузнавать, расспрашивать» — отсюда оба значения: и расспрос журналиста, и сбор сведений разведкой." }
collocations:
  - { pl: "przeprowadzić wywiad", ru: "взять интервью" }
  - { pl: "udzielić wywiadu", ru: "дать интервью" }
  - { pl: "wywiad wojskowy", ru: "военная разведка" }
etymology: "От wywiadywać się «разузнавать», от wiedzieć «знать» (корень *věd-, тот же, что в русском «ведать»). Русское «разведка» построено от того же корня — слова параллельны по способу образования."
memory: "wywiad = «интервью» и «разведка» — одно слово на оба смысла, потому что оба про добычу сведений (от wiedzieć «знать», как русское «разведка» от «ведать»). Запомните пару: przeprowadzić wywiad «взять интервью», udzielić wywiadu «дать интервью»."
idioms:
