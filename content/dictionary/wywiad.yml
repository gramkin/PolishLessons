pos: noun
pron: { cyr: "вы́вят" }
senses:
  - id: interview
    ru: "интервью"
    examples:
      - pl: "Dziękuję za wywiad!"
        ru: "Спасибо за интервью!"
        source: { kind: translated, id: 3714663 }
      - pl: "Zrobił wywiad z premierem."
        ru: "Он взял интервью у премьера."
        source: { kind: translated, id: 440598 }
