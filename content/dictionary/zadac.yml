# review
id: zadac
format: 2
lemma: "zadać"
rank: 629
pos: verb
aspect: perf
pron: { cyr: "за́даць" }
senses:
  - id: ask
    ru: "задать (вопрос)"
    note: "zadać komuś pytanie — дательный плюс винительный, как в русском."
    examples:
      - pl: "Czy mogę zadać kolejne pytanie?"
        ru: "Могу я задать следующий вопрос?"
        source: { kind: tatoeba, id: 10609197 }
      - pl: "Nauczyciel zadał mi trudne pytanie."
        ru: "Учитель задал мне сложный вопрос."
        source: { kind: tatoeba, id: 720178 }
      - pl: "Tom zadał Marii wiele pytań."
        ru: "Том задал Мэри много вопросов."
        source: { kind: tatoeba, id: 5369972 }
  - id: assign
    ru: "задать (урок); zadanie — задание, задача"
    note: "zadanie domowe «домашнее задание», zadanie matematyczne «задача»."
    examples:
      - pl: "Dzisiaj zadali mi dużo lekcji."
        ru: "Сегодня мне задали много уроков."
        source: { kind: tatoeba, id: 9803515 }
      - pl: "Zrobię zadanie domowe."
        ru: "Я сделаю домашнее задание."
        source: { kind: tatoeba, id: 1564697 }
      - pl: "Czy skończyłeś już zadanie domowe?"
        ru: "Ты уже закончил домашнее задание?"
        source: { kind: tatoeba, id: 575611 }
  - id: inflict
    ru: "причинить, нанести: zadać ból, zadać cios"
    note: "zadać ból «причинить боль», zadać ranę «нанести рану»."
    examples:
      - pl: "Przepraszam za ból, który zadałem tobie i twojej rodzinie."
        ru: "Прости за боль, которую я причинил тебе и твоей семье."
        source: { kind: tatoeba, id: 5489462 }
      - pl: "Zadał przeciwnikowi cios."
        ru: "Он нанёс противнику удар."
        source: { kind: authored }
      - pl: "Nie chciał nikomu zadać bólu."
        ru: "Он не хотел никому причинить боли."
        source: { kind: authored }
  - id: take-trouble
    ru: "zadać sobie trud — взять на себя труд"
    examples:
      - pl: "Dziękuję, że zadałeś sobie trud odprowadzenia mnie."
        ru: "Спасибо, что взял на себя труд проводить меня."
        source: { kind: translated, id: 903737 }
      - pl: "Zadała sobie trud, by wszystko sprawdzić."
        ru: "Она взяла на себя труд всё проверить."
        source: { kind: authored }
      - pl: "Nikt nie zadał sobie trudu, by zapytać."
        ru: "Никто не взял на себя труд спросить."
        source: { kind: authored }
notes:
  - { kind: government, text: "zadać komuś coś — дательный плюс винительный: zadał mi pytanie «задал мне вопрос». Здесь польский и русский совпадают полностью." }
  - { kind: usage, text: "Несовершенный вид — zadawać: zadawał pytania jedno po drugim «он задавал вопросы одно за другим»." }
  - { kind: usage, text: "Отглагольное существительное zadanie несёт оба русских значения сразу: zadanie domowe «домашнее задание» и zadanie matematyczne «задача по математике»." }
  - { kind: usage, text: "Третье значение — «причинить, нанести»: zadać ból «причинить боль», zadać cios «нанести удар», zadać ranę «нанести рану»." }
  - { kind: usage, text: "Оборот zadać sobie trud значит «взять на себя труд»: Nikt nie zadał sobie trudu, by zapytać." }
collocations:
  - { pl: "zadać pytanie", ru: "задать вопрос" }
  - { pl: "zadanie domowe", ru: "домашнее задание" }
  - { pl: "zadać ból", ru: "причинить боль" }
  - { pl: "zadać sobie trud", ru: "взять на себя труд" }
family:
  - { pl: "zadawać", ru: "задавать", relation: aspect }
  - { pl: "dać", ru: "дать", relation: root }
  - { pl: "zadanie", ru: "задание, задача", relation: derived }
etymology: "Приставка za- плюс dać «дать», праславянское *dati — то же строение, что у русского «задать»: «за-» плюс «дать»."
memory: "zadać — «задать», и слово собрано ровно как русское: za- плюс dać. Три значения держатся вместе. Вопрос: zadać pytanie, с дательным и винительным, как по-русски. Урок: zadali mi dużo lekcji, а существительное zadanie несёт сразу оба русских смысла — «задание» и «задача». И третье, которое легко упустить: «причинить, нанести» — zadać ból, zadać cios. Плюс оборот zadać sobie trud «взять на себя труд»."
idioms:
  - { pl: "zadać pytanie", ru: "задать вопрос" }
  - { pl: "zadanie domowe", ru: "домашнее задание" }
  - { pl: "zadać ból", ru: "причинить боль" }
  - { pl: "zadać sobie trud", ru: "взять на себя труд" }
