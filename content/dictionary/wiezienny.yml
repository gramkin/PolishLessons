family:
  - { pl: "więzienie", ru: "тюрьма", relation: root, id: wiezienie }
  - { pl: "więzień", ru: "заключённый, узник", relation: root, id: wiezien }
  - { pl: "wiązać", ru: "вязать, связывать", relation: root, id: wiazac }
etymology: "От WIĘZIENIE «тюрьма», которое образовано от WIĘZIĆ «держать в неволе», а оно от того же корня, что WIĄZAĆ «вязать». В русском тот же корень дал «узы», «узник», «вязать», а польское Ę на месте русского «у» — постоянное соответствие: WIĘZY и «узы». С «везением» общего нет, это совпадение звуков."
memory: "Więzienny — тюремный: cela więzienna, strażnik więzienny. Не «везение», а «узы»: więzienie — тюрьма, więzień — узник. Двойное n и «вензе́нны» в чтении."
idioms:
  - { pl: "gwara więzienna", ru: "тюремный жаргон" }
