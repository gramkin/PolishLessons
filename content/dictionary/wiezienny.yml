notes:
  - { kind: false-friend, text: "Корень обманчив: WIĘZIENIE звучит как русское «везение», но значит «тюрьма», от WIĄZAĆ, «вязать», то есть место, где держат связанными. Русскому «узник» и «узы» оно родня, а «везению» нет. Поэтому WIĘZIENNY — «тюремный», и никакой удачи в нём нет: KARA WIĘZIENNA — это «наказание лишением свободы»." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет, все одиннадцать форм живые. Форма для мужчин-людей WIĘZIENNI нужна часто: STRAŻNICY WIĘZIENNI, LEKARZE WIĘZIENNI, KAPELANI WIĘZIENNI, то есть люди, которые работают в тюрьме. Обратите внимание на двойное N во всех формах: WIĘZIENIE плюс суффикс -NY." }
  - { kind: government, text: "Обычно стоит после существительного, называя род: CELA WIĘZIENNA, STRAŻ WIĘZIENNA, KARA WIĘZIENNA. В тюрьме — W WIĘZIENIU, местный падеж существительного: прилагательное тут не нужно. Отбывать тюремный срок — ODSIADYWAĆ WYROK, а WIĘZIENNY добавляют, только если надо уточнить вид наказания." }
  - { kind: pronunciation, text: "Читается «вензе́нны», три слога, ударение на предпоследнем. Ę перед Z звучит как «эн», ZIE даёт «зе», как и в WIĘZIENIE «вензе́не». Двойное NN произносится долго, как в русском «длинный». Конечная Y — «ы»." }
  - { kind: register, text: "Слово официальное и газетное: STRAŻ WIĘZIENNA — название ведомства, SŁUŻBA WIĘZIENNA — службы. В разговоре тюрьму часто называют PAKA или CIUPA, и прилагательного к ним нет. GWARA WIĘZIENNA, тюремный жаргон, — отдельная тема польской лингвистики." }
collocations:
  - { pl: "cela więzienna", ru: "тюремная камера" }
  - { pl: "straż więzienna", ru: "тюремная охрана (ведомство)" }
