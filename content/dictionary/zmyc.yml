notes:
  - { kind: false-friend, text: "ZMYĆ совпадает с русским «смыть», включая разговорное ZMYĆ SIĘ «смыться». Но «помыть посуду» — тоже ZMYĆ или POZMYWAĆ: ZMYĆ NACZYNIA, а UMYĆ — про руки и тело: UMYĆ RĘCE. «Смыть в унитазе» — SPUŚCIĆ WODĘ." }
  - { kind: usage, text: "Пятьдесят три формы, включая ZMYCI: людей «смывает» волной с палубы. Спряжение как у MYĆ: ZMYJĘ, ZMYJESZ, повелительное ZMYJ. Несовершенный вид — ZMYWAĆ, отсюда ZMYWARKA «посудомойка»." }
  - { kind: government, text: "Что — винительный: ZMYĆ PLAMĘ. С чего — Z с родительным: ZMYĆ BRUD Z PODŁOGI. Чем — творительный: ZMYĆ WODĄ, ZMYĆ PŁYNEM. С SIĘ — откуда: Z IMPREZY, STĄD." }
  - { kind: pronunciation, text: "ZMYĆ — один слог, «змыць»: Y — «ы», конечное Ć — «ць». ZMYJĘ — «змы́е», ZMYŁ — «змыу»." }
  - { kind: register, text: "В прямом смысле — нейтральное. ZMYĆ SIĘ «смыться» — разговорное, как и в русском. ZMYĆ KOMUŚ GŁOWĘ — разговорное «устроить головомойку». ZMYĆ HAŃBĘ — книжное «смыть позор»." }
collocations:
  - { pl: "zmyć makijaż", ru: "смыть макияж" }
  - { pl: "zmyć naczynia", ru: "помыть посуду" }
  - { pl: "zmyć hańbę", ru: "смыть позор" }
family:
  - { pl: "myć", ru: "мыть", relation: root, id: myc }
  - { pl: "umyć", ru: "помыть, вымыть", relation: derived, id: umyc }
  - { pl: "zmywarka", ru: "посудомоечная машина", relation: derived }
etymology: "Приставка Z- «с-» плюс MYĆ «мыть», праславянское *myti. Русское «смыть», «смываться» — то же строение."
memory: "Zmyć — смыть: zmyła makijaż. Zmyć naczynia — помыть посуду. Zmyć się — смыться. Читается «змыць»."
idioms:
