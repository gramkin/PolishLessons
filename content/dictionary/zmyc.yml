  - id: dishes
    ru: "помыть (посуду)"
    examples:
      - pl: "Zmyję naczynia po obiedzie."
        ru: "Я помою посуду после обеда."
        source: { kind: authored }
      - pl: "Kto dziś zmyje po kolacji?"
        ru: "Кто сегодня помоет посуду после ужина?"
        source: { kind: authored }
  - id: scram
    ru: "разг. с SIĘ — смыться, улизнуть"
    examples:
      - pl: "Zmył się przed końcem imprezy."
        ru: "Он смылся до конца вечеринки."
        source: { kind: authored }
      - pl: "Zmyjmy się stąd, zanim nas zobaczą."
        ru: "Давайте смоемся отсюда, пока нас не увидели."
