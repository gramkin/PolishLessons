notes:
  - { kind: false-friend, text: "WNUCZKA — «внучка», совпадение полное. Ловушка в родительном множественного: WNUCZEK, «внучек» (от «внучки»), совпадает по форме с WNUCZEK — ласковым «внучок» о мальчике. Внуки вообще — WNUKI или WNUCZĘTA." }
  - { kind: usage, text: "Десять форм, женский род, лицо. Перед E K переходит в C: WNUCZCE. Звательный WNUCZKO употребляется в ласковом обращении, но чаще говорят WNUSIU." }
  - { kind: government, text: "Гордиться внучкой — BYĆ DUMNYM Z WNUCZKI, Z с родительным, где в русском творительный. Сидеть с внучкой — OPIEKOWAĆ SIĘ WNUCZKĄ." }
  - { kind: pronunciation, text: "Читается «вну́чка», ударение на первом слоге. WN — «вн», CZ — «ч»." }
collocations:
  - { pl: "najmłodsza wnuczka", ru: "младшая внучка" }
  - { pl: "ukochana wnuczka", ru: "любимая внучка" }
  - { pl: "babcia i wnuczka", ru: "бабушка и внучка" }
family:
  - { pl: "wnuk", ru: "внук", relation: root, id: wnuk }
  - { pl: "wnuczek", ru: "внучек", relation: derived }
  - { pl: "prawnuczka", ru: "правнучка", relation: derived }
etymology: "От WNUK «внук», общеславянского слова; русское «внучка» построено так же. K перед суффиксом -KA переходит в CZ."
memory: "Wnuczka — внучка; wnuk — внук; prawnuczka — правнучка. Читается «вну́чка». Oczko w głowie — любимица, зеница ока."
idioms:
  - { pl: "oczko w głowie", ru: "любимица, зеница ока" }
