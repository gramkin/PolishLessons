formExamples:
  - form: "nastąpi"
    pl: "Ciąg dalszy nastąpi."
    ru: "Продолжение следует."
    source: { kind: translated, id: 6308790 }
  - form: "nastąpi"
    pl: "Kiedy nastąpi koniec świata?"
    ru: "Когда наступит конец света?"
    source: { kind: tatoeba, id: 2153740 }
  - form: "nastąpi"
    pl: "Nigdy nie spodziewałem się, że to nastąpi tak szybko."
    ru: "Я никогда не ожидал, что это произойдёт так быстро."
    source: { kind: translated, id: 7330470 }
  - form: "nastąpią"
    pl: "Zmiany nastąpią od stycznia."
    ru: "Изменения наступят с января."
    source: { kind: authored }
  - form: "nastąpią"
    pl: "Po burzy nastąpią chłodne dni."
    ru: "После грозы наступят прохладные дни."
    source: { kind: authored }
  - form: "nastąpią"
    pl: "Kolejne wybuchy nastąpią lada chwila."
    ru: "Следующие взрывы произойдут с минуты на минуту."
    source: { kind: authored }
  - form: "nastąpić"
    pl: "Zmiana musi nastąpić jak najszybciej."
    ru: "Перемена должна произойти как можно скорее."
    source: { kind: authored }
  - form: "nastąpić"
    pl: "Wybuch mógł nastąpić w każdej chwili."
    ru: "Взрыв мог произойти в любой момент."
    source: { kind: authored }
  - form: "nastąpić"
    pl: "Poprawa powinna nastąpić w ciągu tygodnia."
    ru: "Улучшение должно наступить в течение недели."
    source: { kind: authored }
  - form: "nastąpił"
    pl: "Po deszczu nastąpił spadek temperatury."
    ru: "После дождя наступило похолодание."
    source: { kind: translated, id: 2385816 }
  - form: "nastąpił"
    pl: "Nastąpił nagły zwrot."
    ru: "Произошёл внезапный поворот."
    source: { kind: authored }
  - form: "nastąpił"
    pl: "Po ciszy nastąpił wybuch śmiechu."
    ru: "За тишиной последовал взрыв смеха."
    source: { kind: authored }
  - form: "nastąpiła"
    pl: "Nastąpiła cisza."
    ru: "Наступила тишина."
    source: { kind: translated, id: 10708087 }
  - form: "nastąpiła"
    pl: "Nastąpiła techniczna rewolucja."
    ru: "Произошла техническая революция."
    source: { kind: translated, id: 983822 }
  - form: "nastąpiła"
    pl: "W tym momencie nastąpiła głośna eksplozja."
    ru: "В этот момент произошёл громкий взрыв."
    source: { kind: translated, id: 368110 }
  - form: "nastąpiłaby"
    pl: "Zmiana nastąpiłaby i tak."
    ru: "Перемена наступила бы всё равно."
    source: { kind: authored }
  - form: "nastąpiłaby"
    pl: "Poprawa nie nastąpiłaby bez leczenia."
    ru: "Улучшение не наступило бы без лечения."
    source: { kind: authored }
  - form: "nastąpiłaby"
    pl: "Katastrofa nastąpiłaby o kilka minut wcześniej."
    ru: "Катастрофа наступила бы на несколько минут раньше."
    source: { kind: authored }
  - form: "nastąpiłby"
    pl: "Kryzys nastąpiłby i bez tej decyzji."
    ru: "Кризис наступил бы и без этого решения."
    source: { kind: authored }
  - form: "nastąpiłby"
    pl: "Przełom nastąpiłby prędzej czy później."
    ru: "Перелом наступил бы рано или поздно."
    source: { kind: authored }
  - form: "nastąpiłby"
    pl: "Bez reform upadek nastąpiłby szybciej."
    ru: "Без реформ упадок наступил бы быстрее."
    source: { kind: authored }
  - form: "nastąpiło"
    pl: "Pod koniec istnienia Cesarstwa Rzymskiego, co nastąpiło w 476 r., łacina rozwijała się inaczej w poszczególnych regionach Zachodu."
    ru: "В конце существования Римской империи, что произошло в 476 году, латынь развивалась дальше."
    source: { kind: translated, id: 13006764 }
  - form: "nastąpiło"
    pl: "Nastąpiło to bez ostrzeżenia."
    ru: "Это произошло без предупреждения."
    source: { kind: authored }
  - form: "nastąpiło"
    pl: "Nic takiego nie nastąpiło."
    ru: "Ничего такого не произошло."
    source: { kind: authored }
  - form: "nastąpiłoby"
    pl: "Ocieplenie nastąpiłoby dopiero w kwietniu."
    ru: "Потепление наступило бы только в апреле."
    source: { kind: authored }
  - form: "nastąpiłoby"
    pl: "Bez tej ustawy nastąpiłoby załamanie rynku."
    ru: "Без этого закона наступил бы обвал рынка."
    source: { kind: authored }
  - form: "nastąpiłoby"
    pl: "Przesilenie nastąpiłoby i bez naszej pomocy."
    ru: "Перелом наступил бы и без нашей помощи."
    source: { kind: authored }
  - form: "nastąpiły"
    pl: "Czy nastąpiły tutaj jakieś zmiany?"
    ru: "Здесь произошли какие-нибудь изменения?"
    source: { kind: translated, id: 577780 }
  - form: "nastąpiły"
    pl: "Nastąpiły poważne zmiany."
    ru: "Произошли серьёзные изменения."
    source: { kind: authored }
  - form: "nastąpiły"
    pl: "Po burzy nastąpiły powodzie."
    ru: "После грозы последовали наводнения."
    source: { kind: authored }
  - form: "nastąpiłyby"
    pl: "Zmiany nastąpiłyby i bez nacisków."
    ru: "Перемены наступили бы и без давления."
    source: { kind: authored }
  - form: "nastąpiłyby"
    pl: "Kolejne kryzysy nastąpiłyby szybko bez reform."
    ru: "Следующие кризисы наступили бы быстро без реформ."
    source: { kind: authored }
  - form: "nastąpiłyby"
    pl: "Skutki nastąpiłyby dopiero po latach."
    ru: "Последствия наступили бы только спустя годы."
    source: { kind: authored }
  - form: "nastąpiwszy"
    pl: "Nastąpiwszy tuż po wyborach, kryzys zaskoczył wszystkich."
    ru: "Наступив сразу после выборов, кризис застал всех врасплох."
    source: { kind: authored }
  - form: "nastąpiwszy"
    pl: "Nastąpiwszy nagle, cisza wydała się głośniejsza od hałasu."
    ru: "Наступив внезапно, тишина показалась громче шума."
    source: { kind: authored }
  - form: "nastąpiwszy"
    pl: "Nastąpiwszy po latach suszy, deszcz zniszczył zbiory."
    ru: "Придя после многих лет засухи, дождь погубил урожай."
    source: { kind: authored }
