# review
id: nastapic
format: 2
lemma: "nastąpić"
rank: 1909
pos: verb
aspect: perf
pron: { cyr: "насто́мпиць" }
senses:
  - id: occur
    ru: "наступить, произойти, случиться"
    examples:
      - pl: "Kiedy nastąpi koniec świata?"
        ru: "Когда наступит конец света?"
        source: { kind: tatoeba, id: 2153740 }
      - pl: "Nastąpiła cisza."
        ru: "Наступила тишина."
        source: { kind: translated, id: 10708087 }
      - pl: "Nastąpiła techniczna rewolucja."
        ru: "Произошла техническая революция."
        source: { kind: translated, id: 983822 }
  - id: follow
    ru: "последовать, наступить (после чего-либо)"
    examples:
      - pl: "Ciąg dalszy nastąpi."
        ru: "Продолжение следует."
        source: { kind: translated, id: 6308790 }
      - pl: "Po deszczu nastąpił spadek temperatury."
        ru: "После дождя наступило похолодание."
        source: { kind: translated, id: 2385816 }
      - pl: "Czy nastąpiły tutaj jakieś zmiany?"
        ru: "Здесь произошли какие-нибудь изменения?"
        source: { kind: translated, id: 577780 }
notes:
  - { kind: usage, text: "Ciąg dalszy nastąpi — «Продолжение следует», стандартная формула в конце серии или главы." }
  - { kind: usage, text: "Слово книжное и почти всегда про события, а не про людей: nastąpiła cisza «наступила тишина», nastąpiła zmiana «произошло изменение»." }
  - { kind: false-friend, text: "Словарь даёт и буквальное значение «наступить на что-то ногой», но в корпусе его нет ни разу: для этого чаще говорят nadepnąć." }
  - { kind: government, text: "Наступить после чего-то — nastąpić po czymś (предложный падеж): po deszczu nastąpił spadek temperatury." }
collocations:
  - { pl: "ciąg dalszy nastąpi", ru: "продолжение следует" }
  - { pl: "nastąpiła cisza", ru: "наступила тишина" }
  - { pl: "nastąpiła zmiana", ru: "произошло изменение" }
family:
  - { pl: "następny", ru: "следующий", relation: root, id: nastepny }
  - { pl: "następnie", ru: "затем", relation: root }
  - { pl: "nadepnąć", ru: "наступить ногой", relation: root }
etymology: "Приставка na- плюс stąpić «ступить»: буквально «наступить». Русское «наступить» построено ровно так же и тоже значит и шаг, и событие."
memory: "nastąpić — «наступить, произойти» о событиях: nastąpiła cisza. Формула Ciąg dalszy nastąpi значит «продолжение следует». Наступить ногой — обычно nadepnąć."
idioms:
  - { pl: "ciąg dalszy nastąpi", ru: "продолжение следует" }
  - { pl: "nastąpiła cisza", ru: "наступила тишина" }
  - { pl: "nastąpiła zmiana", ru: "произошло изменение" }
