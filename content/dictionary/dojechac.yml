notes:
  - { kind: government, text: "Докуда доехать — предлог DO с родительным: DOJECHAĆ DO WARSZAWY, DO DOMU, DO KOŃCA ULICY. Это в точности русское «доехать до чего-то», та же приставка и тот же предлог с тем же падежом, и ошибиться здесь трудно. Чем доехать — творительный без предлога: DOJECHAĆ AUTOBUSEM, SAMOCHODEM, POCIĄGIEM, как русское «доехать автобусом». Предлог NA с винительным указывает цель-мероприятие: DOJECHAĆ NA DWORZEC, NA LOTNISKO, NA SPOTKANIE. В разговорном значении «вымотать» глагол становится переходным и требует винительного: TA PRACA MNIE DOJECHAŁA «эта работа меня доконала»." }
  - { kind: usage, text: "Совершенный вид, пятьдесят три формы. Разбор такой: сорок две формы даёт глагол сам по себе, одну — деепричастие прошедшего времени DOJECHAWSZY, которое есть только у совершенного вида, и ещё одиннадцать — страдательное причастие DOJECHANY. Форм настоящего времени у совершенного вида нет вовсе: DOJADĘ и DOJEDZIESZ по виду похожи на настоящее, но значат будущее — «доеду», «доедешь». Деепричастия на -ĄC, то есть одновременного действия, у совершенного вида тоже нет: сказать DOJECHAJĄC нельзя. Несовершенная пара — DOJEŻDŻAĆ, и у неё своя ловушка, о которой отдельная заметка." }
  - { kind: false-friend, text: "Несовершенный напарник DOJEŻDŻAĆ значит не только «доезжать». Его главное современное значение — регулярно ездить куда-то, прежде всего на работу или учёбу: DOJEŻDŻAM DO PRACY POCIĄGIEM это «я езжу на работу поездом», а не «я доезжаю до работы». Отсюда существительное DOJAZD «проезд, подъездной путь» и DOJEŻDŻAJĄCY о людях, которые живут за городом и ездят в город каждый день, по-русски «пригородные» или просто «те, кто ездит». Русское «доезжать» в этом значении не употребляется, и именно здесь русскоязычный чаще всего понимает польскую фразу наоборот: слышит однократное приближение там, где речь о ежедневной привычке." }
  - { kind: register, text: "Одиннадцать форм страдательного причастия у глагола движения выглядят странно, и объяснение простое: в разговорной речи DOJECHAĆ KOGOŚ значит «доконать, измочалить кого-то», а DOJECHANY — «вымотанный, выжатый». Это живое разговорное употребление, не грубое, но и не нейтральное: в письменном тексте вместо DOJECHANY пишут WYCZERPANY или ZMĘCZONY. В прямом значении «доехать» страдательного причастия быть не может, потому что прямого дополнения там нет: доезжают до чего-то, а не что-то. Поэтому все одиннадцать форм причастия в карточке стоят на разговорном значении, и ровно так их и следует понимать." }
  - { kind: pronunciation, text: "Читается «дое́хаць», три слога, ударение на предпоследнем. Сочетание JE даёт «е», то есть «йэ»: DO-JE-CHAĆ. Буквосочетание CH это «х». Конечное -AĆ это «аць» с мягким Ć. В формах будущего времени основа меняется: DOJADĘ звучит «доя́дэ» с лёгким носовым на конце, DOJEDZIESZ — «дое́джеш», где DZI даёт мягкое «дж». Повелительное DOJEDŹ кончается на мягкое «дзь»: «дое́дзь». В деепричастии DOJECHAWSZY ударение на предпоследнем слоге: «доеха́фшы», и W перед S оглушается в «ф»." }
