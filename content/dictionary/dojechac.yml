etymology: "Приставка DO- и корень JECHAĆ, и разбирается слово один в один как русское «доехать»: DO- это «до», значение приставки — довести действие до предела, до нужной точки. Корень общий, праславянский *jexati, откуда и русское «ехать». Соответствие настолько прямое, что всё гнездо читается без словаря: PRZYJECHAĆ «приехать», WYJECHAĆ «выехать», ODJECHAĆ «отъехать», OBJECHAĆ «объехать», PRZEJECHAĆ «переехать, проехать». Расходятся языки в другом месте — в несовершенном виде. Польский DOJEŻDŻAĆ развил значение регулярной поездки на работу, какого у русского «доезжать» нет, и дал от него DOJAZD. Чередование CH и ŻDŻ в паре JECHAĆ-JEŻDŻAĆ отвечает русскому Х и ЗЖ в «ехать-езжать», то есть и эта неправильность у двух языков общая."
memory: "Разбирается как русское слово: do- = «до», jechać = «ехать», dojechać = «доехать», и управление то же — dojechać DO czegoś, с родительным. Всё гнездо открывается сразу: przyjechać, wyjechać, objechać. Пятьдесят три формы: сорок две плюс деепричастие dojechawszy (только у совершенного вида) плюс одиннадцать форм страдательного причастия. Главная ловушка не здесь, а в несовершенном dojeżdżać: оно значит «регулярно ездить на работу», а не «доезжать». И dojechany в разговоре — «вымотанный»."
