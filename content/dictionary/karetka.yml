        ru: "На место отправили две скорые."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОТ «КАРЕТЫ» К СКОРОЙ ПОМОЩИ. Karetka — уменьшительное от kareta «карета», и русская «каретка» того же происхождения. Но значения разошлись: польское karetka значит «СКОРАЯ ПОМОЩЬ», машина с мигалкой, а русская «каретка» — деталь механизма, каретка пишущей машинки или велосипеда. Полная форма karetka pogotowia отвечает русской «карете скорой помощи»: русский сократил её до «скорой», а поляк до karetki." }
  - { kind: pronunciation, text: "В дательном и предложном k переходит в c: karetka, но w karetce — «в карэ́тцэ». То же, что paczka → w paczce и plotka → w plotce. Родительный множественного с беглым e: karetek, как paczek, marynarek и plotek." }
  - { kind: usage, text: "В живой речи почти всегда говорят просто karetka, полную форму karetka pogotowia оставляя официальным текстам. Глагол при ней всегда один: wezwać karetkę «вызвать скорую». Ехать на скорой — jechać karetką, творительный падеж, ровно как в русском «ехать скорой»." }
collocations:
  - { pl: "wezwać karetkę", ru: "вызвать скорую" }
  - { pl: "karetka pogotowia", ru: "машина скорой помощи" }
  - { pl: "jechać karetką", ru: "ехать на скорой" }
family:
  - { pl: "kareta", ru: "карета", relation: root }
  - { pl: "kariera", ru: "карьера", relation: root, id: kariera }
etymology: "Уменьшительное от kareta «карета», из итальянского carretta и дальше от латинского carrus «повозка, телега». От того же латинского корня неожиданно происходит kariera: итальянское carriera значило «дорога для повозок», а оттуда «жизненный путь». Так что karetka, kareta и kariera — дальняя родня, и в русском «карета» с «карьерой» тоже."
memory: "karetka — это «скорая помощь», а не «каретка». Слово уменьшительное от kareta, и полная форма karetka pogotowia отвечает русской «карете скорой помощи»: русский сократил её до «скорой», поляк до karetki. Падеж знакомый: w karetce, k переходит в c."
idioms:
  - { pl: "wezwać karetkę", ru: "вызвать скорую" }
  - { pl: "karetka pogotowia", ru: "машина скорой помощи" }
