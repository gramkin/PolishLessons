  - { pl: "pędzić", ru: "гнать; мчаться", relation: root }
  - { pl: "spędzenie", ru: "проведение", relation: derived }
etymology: "Приставка s- плюс pędzić «гнать», праславянское *pǫditi — тот же корень, что в русских «принудить» и «понуждать». Значение «провести время» выросло из «прогнать»."
memory: "spędzić — «провести (время)», и управление простое: время стоит в винительном — spędzić urlop, wakacje, noc, weekend, — а место добавляется предлогом: spędził noc w więzieniu, spędziliśmy urlop na jeziorze. Запомните обиходный вопрос Jak spędziłeś wakacje? Несовершенный вид — spędzać, а причастие spędzony значит «проведённый»."
idioms:
