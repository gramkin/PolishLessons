notes:
  - { kind: government, text: "Прямое дополнение — время, в винительном: spędzić urlop, wakacje, noc, weekend. Место добавляется предлогом: w więzieniu, na jeziorze, za granicą." }
  - { kind: usage, text: "Jak spędziłeś wakacje? «Как ты провёл каникулы?» — один из самых обиходных вопросов после лета." }
  - { kind: usage, text: "Несовершенный вид — spędzać: spędzał tam każde lato." }
  - { kind: usage, text: "Причастие spędzony значит «проведённый»: chwile spędzone z tobą «минуты, проведённые с тобой»." }
collocations:
  - { pl: "spędzić urlop", ru: "провести отпуск" }
