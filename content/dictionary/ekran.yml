etymology: "Из французского ÉCRAN «заслон, щит», которое идёт от старофранцузского ESCRAN и далее от германского корня со значением «прикрывать, загораживать», родственного немецкому SCHIRM «зонт, заслон». Исходное значение, таким образом, защитное: экран это то, чем заслоняются, и первым экраном была заслонка перед камином. Значение «поверхность для изображения» наросло позже, когда появилась проекция, и оказалось настолько сильнее исходного, что сегодня воспринимается как основное. Это объясняет, почему шумозащитный щит вдоль дороги тоже EKRAN: там слово сохранило свой первоначальный смысл. Русский «экран» заимствован из того же французского источника и в том же девятнадцатом веке, поэтому значения в двух языках развивались согласно."
memory: "Как русский «экран», но поляк делит понятие на три: ekran — поверхность с изображением, monitor — само устройство, wyświetlacz — небольшое табло. Поэтому na ekranie monitora не тавтология. Родительный ekranu на -u, местный na ekranie. Из французского écran «заслон», от германского корня, родственного немецкому Schirm; отсюда и ekran akustyczny «шумозащитный экран», где слово сохранило исходный защитный смысл."
