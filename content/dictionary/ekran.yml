notes:
  - { kind: false-friend, text: "Значение совпадает с русским «экраном», и ловушка не в нём, а в соседях. Польский делит то, что русский часто зовёт экраном, на три слова: EKRAN это поверхность, на которой появляется изображение, MONITOR это устройство целиком, а WYŚWIETLACZ это небольшое табло, скажем на часах или на микроволновке. Поэтому NA EKRANIE MONITORA звучит естественно и не является тавтологией. Второе значение, защитный щит, в русском тоже есть, но менее заметно: EKRAN AKUSTYCZNY это «шумозащитный экран» вдоль дороги, и для поляка это такое же обычное употребление, как кинематографическое." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: WŁĄCZ EKRAN. Родительный на -U: OD EKRANU, BEZ EKRANU. Местный на -IE: NA EKRANIE «на экране», и это главное сочетание — то, что показано, вводится предлогом NA с местным, как и в русском. Направление взгляда — предлог DO или NA с винительным: PATRZEĆ NA EKRAN. Отрыв от чего-либо — предлог OD с родительным: ODERWAĆ OCZY OD EKRANU. При отрицании винительный уходит в родительный: NIE WIDZĘ EKRANU." }
  - { kind: pronunciation, text: "Читается «экра́н», ударение на предпоследнем слоге, то есть на втором из двух, и это совпадает с русским. Начальное E звучит как чистое «э», без призвука «й», и в польском это обычное дело для заимствований. В местном падеже EKRANIE буква N смягчается перед -IE: «экра́не», слогов становится три, и ударение по правилу переходит на предпоследний, то есть остаётся на том же A. В родительном множественного EKRANÓW буква Ó даёт «у», а конечное W оглушается: «экра́нуф»." }
  - { kind: usage, text: "Частотные сочетания: EKRAN DOTYKOWY «сенсорный экран», WIELKI EKRAN «большой экран» о кино, EKRAN POWITALNY «экран приветствия», PEŁNY EKRAN «полный экран». Выражение NA MAŁYM EKRANIE значит «на телевидении», а NA DUŻYM EKRANIE — «в кино», и это противопоставление в польском живое. Производное EKRANIZACJA «экранизация» совпадает с русским полностью. В строительном и техническом смысле EKRAN AKUSTYCZNY и EKRAN OCHRONNY относятся к защите, а не к изображению, и это второе гнездо значений." }
