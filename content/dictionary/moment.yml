# review
id: moment
format: 2
lemma: "moment"
rank: 497
pos: noun
pron: { cyr: "мо́мэнт" }
senses:
  - id: instant
    ru: "момент, миг"
    examples:
      - pl: "Moment."
        ru: "Минутку."
        source: { kind: translated, id: 7881535 }
      - pl: "W tym momencie pracuję."
        ru: "В данный момент я работаю."
        source: { kind: translated, id: 5014263 }
      - pl: "Tom polubił Mary od momentu, kiedy ją spotkał."
        ru: "Том полюбил Мэри с того момента, как её встретил."
        source: { kind: translated, id: 3997632 }
  - id: occasion
    ru: "момент, отрезок времени; случай"
    examples:
      - pl: "Były dwa momenty, w których nie było mi łatwo."
        ru: "Было два момента, когда мне было нелегко."
        source: { kind: translated, id: 3107599 }
      - pl: "Argentyna zdominowała Brazylię w końcowych momentach meczu."
        ru: "Аргентина переиграла Бразилию в concluding-моменты матча."
        source: { kind: translated, id: 984689 }
      - pl: "W trudnych momentach liczy się spokój."
        ru: "В трудные моменты важно спокойствие."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Moment! как самостоятельная реплика значит «Минутку!», «Секунду!» — так отвечают, когда просят подождать." }
  - { kind: usage, text: "w tym momencie — «в данный момент, сейчас»; синоним w tej chwili." }
  - { kind: usage, text: "od momentu, gdy... — «с того момента, как...»: Polubił ją od momentu, kiedy ją spotkał." }
  - { kind: usage, text: "Ударение всегда на предпоследнем слоге, поэтому при склонении оно сдвигается: MOment, но moMENtem, momenTAmi." }
collocations:
  - { pl: "moment!", ru: "минутку!" }
  - { pl: "w tym momencie", ru: "в данный момент" }
  - { pl: "w każdym momencie", ru: "в любой момент" }
  - { pl: "od momentu, gdy", ru: "с того момента, как" }
etymology: "Латинское momentum «движение, миг», от movere «двигать». Русское «момент» — то же заимствование, пришедшее тем же путём через западные языки."
memory: "moment — «момент», слово международное. Запомните его прежде всего как готовую реплику: Moment! значит «Минутку!» — так отвечают, когда просят подождать. И оборот od momentu, gdy... «с того момента, как...». Ударение по-польски всегда на предпоследнем слоге, поэтому оно сдвигается при склонении: MOment, но moMENtem."
idioms:
  - { pl: "moment!", ru: "минутку!" }
  - { pl: "w tym momencie", ru: "в данный момент" }
  - { pl: "od momentu, gdy", ru: "с того момента, как" }
