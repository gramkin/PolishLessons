notes:
  - { kind: false-friend, text: "Русская «язва» по-польски — WRZÓD. Зато WRZÓD родственен русскому «вред»: старое значение того слова — «рана, нарыв», а в диалектах «веред» до сих пор значит «нарыв». Переносная «язва общества» — WRZÓD NA CIELE SPOŁECZEŃSTWA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Ó в начальной форме, O в остальных: WRZÓD, WRZODU. В местном падеже D переходит в DZ: WE WRZODZIE. О болезни часто говорят во множественном: MIEĆ WRZODY." }
  - { kind: government, text: "Язва чего — родительный: WRZÓD ŻOŁĄDKA, WRZÓD DWUNASTNICY. Нажить язву — NABAWIĆ SIĘ WRZODU, родительный. Перед WRZ- предлог W становится WE: WE WRZODZIE." }
  - { kind: pronunciation, text: "Читается «вжут», один слог. WRZ — «вж», как в WRZESIEŃ «вже́сень». Ó — «у», конечное D оглушается в «т»." }
  - { kind: register, text: "Медицинское и бытовое слово. Прилагательное — WRZODOWY: CHOROBA WRZODOWA, «язвенная болезнь»." }
collocations:
  - { pl: "wrzód żołądka", ru: "язва желудка" }
  - { pl: "wrzód dwunastnicy", ru: "язва двенадцатиперстной кишки" }
  - { pl: "leczyć wrzody", ru: "лечить язву" }
family:
  - { pl: "wrzodowy", ru: "язвенный", relation: derived }
  - { pl: "owrzodzenie", ru: "изъязвление", relation: derived }
  - { pl: "wrzodziejący", ru: "язвенный (о воспалении)", relation: derived }
etymology: "Общеславянское слово, родственное русскому «вред» и диалектному «веред» — «нарыв». Польское RZÓ на месте русского «ре», «ере»: такое же соответствие, как в BRZEG — «берег»."
memory: "Wrzód — язва, нарыв; родня русскому «вред». Читается «вжут». Wrzód żołądka — язва желудка. Mieć wrzody — болеть язвой."
idioms:
  - { pl: "wrzód na ciele społeczeństwa", ru: "язва общества" }
formExamplesSkip:
