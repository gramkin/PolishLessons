notes:
  - { kind: usage, text: "У этого слова нет единственного числа, и это четвёртый случай такого рода в нашем словаре после NEGOCJACJE, KAJDANKI и DRZWI. Форм поэтому шесть, а не десять: FRYTKI, FRYTEK, FRYTKOM, FRYTKAMI, FRYTKACH. Сказать «одна frytka» о порции нельзя, хотя об одной отдельной соломке в разговоре иногда скажут. Русский здесь поступает иначе: «картошка фри» стоит в единственном, так что число приходится менять при переводе в обе стороны." }
  - { kind: false-friend, text: "Слово пришло из французского через немецкий, и русского соответствия того же корня нет: русский взял описательное «картошка фри», где FRI это то же французское слово, но оставшееся несклоняемым довеском. Не путать FRYTKI с FRYTURA: второе значит «фритюр», то есть сам жир для жарки. И отдельно: польское CHIPSY — это чипсы из пакета, а не то, что британец назвал бы chips; за горячей картошкой в Польше просят именно FRYTKI." }
  - { kind: government, text: "С чем — предлог Z с творительным: FRYTKI Z KETCHUPEM, FRYTKI Z SOSEM. Порция чего — родительный множественного без предлога: PORCJA FRYTEK, и эта форма с беглым E нужна постоянно, потому что заказывают порциями. На вынос — NA WYNOS, предлог NA с винительным, и это готовая формула для любой еды. Заказать — ZAMÓWIĆ FRYTKI, винительный, совпадающий с именительным." }
  - { kind: pronunciation, text: "Читается «фры́тки», два слога, ударение на первом. Буква Y звучит как «ы», поэтому начало слова «фры», а не «фри», и это главное отличие от русского названия. Сочетание TK произносится без вставной гласной. В родительном множественного FRYTEK появляется беглое E: «фры́тэк», и это то же явление, что в MATKA и MATEK, KSIĄŻKA и KSIĄŻEK." }
  - { kind: register, text: "Слово бытовое, из меню и из разговора у стойки. Частые обороты: FRYTKI Z KETCHUPEM, PORCJA FRYTEK «порция картошки фри», FRYTKI NA WYNOS «картошка фри на вынос», ZESTAW Z FRYTKAMI «комплект с картошкой фри». В Польше у этого слова есть и народный конкурент: в Силезии и Великопольше жареную картошку иначе называют POMMES или просто PYRY, но в меню по всей стране стоит FRYTKI." }
