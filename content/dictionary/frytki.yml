etymology: "Из французского FRITES, сокращения от POMMES DE TERRE FRITES «жареный картофель», от глагола FRIRE «жарить». В польский слово пришло через немецкий и получило польское множественное окончание -KI, так что выглядит оно теперь совершенно по-польски. Русский взял ту же французскую основу, но оставил её несклоняемой: в «картошке фри» второе слово не меняется вовсе. Отсюда и разница в числе: польское слово стало полноценным существительным во множественном, а русское осталось сочетанием с неизменяемым определением."
memory: "Слово только во множественном числе, как negocjacje и kajdanki, и форм шесть. Русская «картошка фри» стоит в единственном, так что число меняется при переводе. Читается «фры́тки», через «ы», а не «фри». Самая нужная форма — родительный множественного с беглым e: porcja frytek, потому что заказывают порциями. Чипсы из пакета называются chipsy, а frytura это фритюр, то есть жир, а не еда."
