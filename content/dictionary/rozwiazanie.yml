# review
id: rozwiazanie
format: 2
lemma: "rozwiązanie"
rank: 2095
pos: noun
pron: { cyr: "розвёнза́не" }
senses:
  - id: solution
    ru: "решение (задачи, проблемы)"
    examples:
      - pl: "To nie najlepsze rozwiązanie."
        ru: "Это не лучшее решение."
        source: { kind: tatoeba, id: 3460263 }
      - pl: "Rozwiązanie problemu wymagało niemałego wysiłku."
        ru: "Проблема требовала больших усилий, чтобы её решить."
        source: { kind: tatoeba, id: 352006 }
      - pl: "Masz pięć minut na rozwiązanie problemu."
        ru: "У тебя есть пять минут на решение проблемы."
        source: { kind: tatoeba, id: 12712045 }
  - id: option
    ru: "выход, вариант"
    examples:
      - pl: "Śmierć nie jest rozwiązaniem."
        ru: "Смерть — не выход."
        source: { kind: translated, id: 13910210 }
      - pl: "Poddawanie się nie jest rozwiązaniem."
        ru: "Сдаваться — не выход."
        source: { kind: translated, id: 960774 }
notes:
  - { kind: usage, text: "Отглагольное существительное от rozwiązać «развязать, решить». Значит «решение» задачи, проблемы, а также «вариант, выход»." }
  - { kind: false-friend, text: "Буквально «развязывание»: корень wiązać «вязать». Русское «решение» от «решить» устроено похоже — «разрешить узел»." }
  - { kind: government, text: "Средний род: to rozwiązanie, tego rozwiązania." }
  - { kind: usage, text: "Nie jest rozwiązaniem «не выход» — очень частый оборот с творительным падежом." }
collocations:
  - { pl: "znaleźć rozwiązanie", ru: "найти решение" }
  - { pl: "nie jest rozwiązaniem", ru: "не выход" }
etymology: "От rozwiązać «развязать, решить», корень wiązać «вязать»; русское «решение» тоже восходит к образу развязанного узла."
memory: "rozwiązanie — «решение» и «выход». Буквально «развязывание»: rozwiązać значит и «развязать», и «решить». Запомните nie jest rozwiązaniem «не выход»."
idioms:
  - { pl: "znaleźć rozwiązanie", ru: "найти решение" }
  - { pl: "nie jest rozwiązaniem", ru: "не выход" }
formExamplesSkip:
  - { form: "rozwiązaniom", reason: "в корпусе нет примеров для этой формы" }
