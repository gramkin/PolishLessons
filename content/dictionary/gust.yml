etymology: "Через немецкое GUSTO или прямо из итальянского GUSTO, а то — из латинского GUSTUS «вкус, проба», от GUSTARE «пробовать на вкус». Исходное значение было именно телесным, вкусовым, и лишь в новое время, вместе с итальянской и французской теорией искусства, слово получило смысл эстетического суждения; французское GOÛT и английское TASTE прошли тот же путь. Польский взял слово уже в этом втором, эстетическом значении, и поэтому оно не столкнулось с исконным SMAK, которое осталось при еде. Русский поступил иначе: он развил оба смысла у своего слова «вкус», от «вкусить», и получил одно слово там, где у польского два. Из латинского GUSTARE происходит и DEGUSTACJA «дегустация», где первоначальный смысл пробы сохранён полностью."
memory: "Русское «вкус» в польском распадается на два слова: gust — вкус как чувство прекрасного (człowiek z gustem, sprawa gustu), smak — вкус еды (smak jabłka). Производные тоже врозь: gustowny «изящный», smaczny «вкусный». Местный падеж guście: группа st смягчается в ść, как miasto/mieście и list/liście. Два именительных множественного: gusta (чаще) и gusty. Przypaść do gustu — «прийтись по вкусу»."
idioms:
