notes:
  - { kind: false-friend, text: "Русское «вкус» покрывает две разные вещи, а польский развёл их по двум словам, и путать их нельзя. GUST — это вкус как способность выбирать, чувство прекрасного: CZŁOWIEK Z GUSTEM «человек со вкусом», SPRAWA GUSTU «дело вкуса», W DAWNYM GUŚCIE «в старом вкусе». А вкус во рту, у еды, — это SMAK: SMAK JABŁKA «вкус яблока», SMACZNEGO «приятного аппетита». Сказать SMAK вместо GUST или наоборот — ошибка заметная. Отсюда и производные расходятся: GUSTOWNY значит «со вкусом сделанный, изящный», а SMACZNY — «вкусный». Очень частый оборот PRZYPAŚĆ KOMUŚ DO GUSTU значит «понравиться кому-то»." }
  - { kind: usage, text: "В местном падеже единственного числа сочетание ST переходит в ŚĆ: GUŚCIE, а не «guscie». Это третий случай одного и того же окончания -IE с разным действием на основу: APARTAMENT даёт APARTAMENCIE, где T переходит в C; AUTOSTRADA даёт AUTOSTRADZIE, где D переходит в DZ; а GUST даёт GUŚCIE, где смягчается вся группа ST. Так же ведут себя MIASTO и MIEŚCIE, LIST и LIŚCIE. Второе: у слова два именительных множественного — GUSTA и GUSTY. Форма GUSTA употребительнее и стоит в поговорке GUSTA SĄ RÓŻNE; GUSTY тоже правильна и встречается не реже в письменном языке." }
  - { kind: government, text: "Мужской род, неодушевлённое. «В чьём-то вкусе» — предлог W с местным: W GUŚCIE TEGO MALARZA. «Прийтись по вкусу» — DO с родительным: PRZYPAŚĆ DO GUSTU. «Со вкусом» — Z с творительным: Z GUSTEM. Частотные сочетания: SPRAWA GUSTU «дело вкуса», BRAK GUSTU «отсутствие вкуса», W DOBRYM GUŚCIE «в хорошем вкусе», NIE W MOIM GUŚCIE «не в моём вкусе». Родительный множественного — GUSTÓW: O GUSTACH SIĘ NIE DYSKUTUJE отвечает русскому «о вкусах не спорят» почти дословно." }
  - { kind: pronunciation, text: "Читается «густ», один слог, поэтому вопрос об ударении не встаёт. Буква U даёт «у», G всегда твёрдая. Конечное T глухое и ясное. В местном падеже GUŚCIE появляются два мягких согласных подряд: Ś это «сь», C перед IE — «ць», так что форма звучит «гу́сьце», два слога. В именительном множественного GUSTA слышно «гу́ста», а в GUSTY — «гу́сты», с «ы» на конце. Разница между этими двумя формами только в последнем звуке." }
