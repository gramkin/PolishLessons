notes:
  - { kind: false-friend, text: "Русская «пуговица» и польский GUZIK не похожи, и угадать нельзя — зато у слова есть второе, разговорное значение, которого в русском нет вовсе. GUZIK в обиходной речи значит «ничего, ни капли»: GUZIK MNIE TO INTERESUJE «мне это нисколько не интересно», GUZIK Z TEGO BĘDZIE «ничего из этого не выйдет», GUZIK PRAWDA «ничего подобного». По-русски здесь нужны совсем другие слова, и буквальный перевод через пуговицу бессмыслен. Значение это вежливо-грубоватое, вместо более резких выражений, и в живой речи встречается постоянно, так что знать его стоит." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: PRZYSZYĆ GUZIK. Родительный на -A: BEZ GUZIKA. Местный и звательный GUZIKU. Что делают с пуговицей — PRZYSZYĆ «пришить», URWAĆ «оторвать», ZAPIĄĆ «застегнуть», ROZPIĄĆ «расстегнуть». В разговорном значении слово не склоняется и стоит в именительном как частица: GUZIK MNIE TO INTERESUJE, GUZIK PRAWDA. Родительный множественного GUZIKÓW. От чего пуговица — предлог OD с родительным: GUZIK OD PŁASZCZA." }
  - { kind: pronunciation, text: "Читается «гу́зик», ударение на предпоследнем слоге из двух. Буква G твёрдая, звук «г». Буква Z даёт «з», а не «ж». Конечное K ясное. В местном падеже GUZIKU слышно «гу́зику», и ударение остаётся на предпоследнем слоге. В родительном множественного GUZIKÓW буква Ó даёт «у», конечное W оглушается: «гузи́куф», и ударение сдвигается на предпоследний слог. Слово фонетически простое." }
  - { kind: usage, text: "Частотные сочетания: PRZYSZYĆ GUZIK «пришить пуговицу», ZAPIĄĆ GUZIKI «застегнуть пуговицы», GUZIK OD KOSZULI, DZIURKA NA GUZIK «петля для пуговицы». Переносно GUZIK означает и кнопку устройства: NACISNĄĆ GUZIK «нажать кнопку», хотя в техническом языке чаще PRZYCISK. Разговорные обороты с GUZIK в значении «ничего» идут без предлогов и без изменения формы. Уменьшительное GUZICZEK употребляется о мелких пуговицах на детской одежде." }
