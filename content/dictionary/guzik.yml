etymology: "Уменьшительное от GUZ «шишка, нарост, желвак», с суффиксом -IK, и исходно это был просто небольшой выступ — застёжка в виде шишечки, продеваемой в петлю. Любопытно, что уменьшительное вытеснило основное слово в бытовой речи: GUZ сегодня означает шишку на голове или опухоль, а о застёжке говорят только GUZIK, хотя по форме это «шишечка». Русская «пуговица» идёт от другого корня, связанного с «пугать» в старом значении «вздувать, выпячивать», и образ там тот же самый — выпуклость, — только корень другой. Разговорное значение «ничего» выросло из обычного приёма: назвать нечто ничтожное мелким предметом, как в русском «ни копейки» или «ни гроша»."
memory: "Пуговица, и подсказки в русском нет: «пуговица» от другого корня. Польское слово — уменьшительное от guz «шишка», то есть «шишечка», и уменьшительное вытеснило основу: guz сегодня только шишка или опухоль. Второе значение чисто разговорное и важное: guzik значит «ничего» — guzik mnie to interesuje «мне это нисколько не интересно», guzik prawda «ничего подобного»; в нём слово не склоняется."
idioms:
  - { pl: "guzik z tego będzie", ru: "ничего из этого не выйдет" }
  - { pl: "guzik prawda", ru: "ничего подобного" }
