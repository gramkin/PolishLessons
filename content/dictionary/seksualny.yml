etymology: "Из латинского sexualis через западные языки; русское «сексуальный» пришло тем же путём, но получило дополнительное значение «привлекательный», которого у польского слова нет."
memory: "seksualny — «половой, сексуальный», слово нейтральное: życie seksualne. А «сексуальный» в смысле «привлекательный» — это seksowny, другое слово."
