notes:
  - { kind: usage, text: "Слово нейтральное и книжное: życie seksualne «половая жизнь», molestowanie seksualne «сексуальное домогательство», orientacja seksualna «сексуальная ориентация»." }
  - { kind: false-friend, text: "Русское «сексуальный» в значении «привлекательный» по-польски будет seksowny, а не seksualny. Seksualny — только про пол и половую сферу." }
  - { kind: government, text: "Согласуется как обычное прилагательное: życie seksualne, aktywność seksualna, kontakt seksualny." }
  - { kind: usage, text: "Существительное — seks; приставки hetero- и homo- присоединяются прямо: heteroseksualny, homoseksualny." }
collocations:
