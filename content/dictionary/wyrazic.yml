# review
id: wyrazic
format: 2
lemma: "wyrazić"
rank: 2041
pos: verb
aspect: perf
pron: { cyr: "выра́зиць" }
senses:
  - id: express
    ru: "выразить (мысль, чувство)"
    examples:
      - pl: "Trudno mi wyrazić myśli słowami."
        ru: "Мне сложно выразить свои мысли словами."
        source: { kind: tatoeba, id: 859018 }
      - pl: "Ilekroć chcemy wyrazić własne myśli używamy języka."
        ru: "Каждый раз, когда мы хотим выразить собственные мысли, мы используем язык."
        source: { kind: tatoeba, id: 4388687 }
      - pl: "Chciałbym wyrazić swą wdzięczność za to, co uczyniłeś dla tego miasta."
        ru: "Я хотел бы выразить свою благодарность за то, что Вы сделали для нашего города."
        source: { kind: tatoeba, id: 676685 }
  - id: state
    ru: "высказать, дать (согласие, мнение)"
    examples:
      - pl: "Wyraziła swoje zdanie na temat wojny."
        ru: "Она высказала своё мнение о войне."
        source: { kind: translated, id: 12044157 }
      - pl: "Wyraziłem zgodę."
        ru: "Я дал согласие."
        source: { kind: translated, id: 8617531 }
  - id: expression
    ru: "выражение, оборот (существительное wyrażenie)"
    examples:
      - pl: "Poszukaj tego wyrażenia w słowniku."
        ru: "Поищи это выражение в словаре."
        source: { kind: translated, id: 353196 }
notes:
  - { kind: usage, text: "Несовершенный вид — wyrażać." }
  - { kind: government, text: "Винительный падеж: wyrazić zgodę «дать согласие», wyrazić opinię «высказать мнение»." }
  - { kind: usage, text: "Отглагольное существительное wyrażenie «выражение, оборот» живёт самостоятельной жизнью и встречается очень часто." }
  - { kind: false-friend, text: "Корень raz «удар, раз»; русское «выразить» собрано из тех же частей: вы- + разить." }
collocations:
  - { pl: "wyrazić zgodę", ru: "дать согласие" }
  - { pl: "wyrazić opinię", ru: "высказать мнение" }
etymology: "wy- + razić «разить, бить», от raz «удар»; русское «выразить» собрано ровно так же."
memory: "wyrazić — «выразить», собрано как русское слово: wy- + razić. Запомните wyrazić zgodę «дать согласие» и существительное wyrażenie «выражение»."
idioms:
  - { pl: "wyrazić zgodę", ru: "дать согласие" }
  - { pl: "wyrazić się jasno", ru: "выразиться ясно" }
