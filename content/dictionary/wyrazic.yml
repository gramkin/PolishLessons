    pl: "Wyraziła to jednym słowem."
    ru: "Она выразила это одним словом."
    source: { kind: authored }
  - form: "wyraziłem"
    pl: "Wyraziłem zgodę."
    ru: "Я дал согласие."
    source: { kind: translated, id: 8617531 }
  - form: "wyraziłem"
    pl: "Źle się wyraziłem."
    ru: "Я неудачно выразился."
    source: { kind: translated, id: 11266383 }
  - form: "wyraziłem"
    pl: "Myślałem, że wyraziłem się jasno, co masz zrobić."
    ru: "Я думал, что ясно выразился, что тебе делать."
    source: { kind: translated, id: 3717922 }
  - form: "wyraź"
    pl: "Wyraź swoje myśli."
    ru: "Вырази свои мысли."
    source: { kind: translated, id: 1215585 }
  - form: "wyraź"
    pl: "Wyraź to prościej."
    ru: "Вырази это проще."
    source: { kind: authored }
  - form: "wyraź"
    pl: "Wyraź swoją opinię."
    ru: "Вырази своё мнение."
    source: { kind: authored }
  - form: "wyrażą"
    pl: "Żadne słowa nie wyrażą mojej radości."
    ru: "Никакие слова не выразят моей радости."
    source: { kind: translated, id: 521320 }
  - form: "wyrażą"
    pl: "Kocham cię tak bardzo, że słowa tego nie wyrażą."
    ru: "Я люблю тебя так сильно, что слова этого не выразят."
    source: { kind: translated, id: 924639 }
  - form: "wyrażą"
    pl: "Te słowa nic nie wyrażą."
    ru: "Эти слова ничего не выразят."
    source: { kind: authored }
  - form: "wyrażenia"
    pl: "Poszukaj tego wyrażenia w słowniku."
    ru: "Поищи это выражение в словаре."
    source: { kind: translated, id: 353196 }
  - form: "wyrażenia"
    pl: "Nie istnieją wyrażenia absolutnie poprawne."
    ru: "Абсолютно правильных выражений не существует."
    source: { kind: translated, id: 409994 }
  - form: "wyrażenia"
    pl: "W języku japońskim są wyrażenia honoryfikatywne."
    ru: "В японском языке есть вежливые выражения."
    source: { kind: translated, id: 410031 }
  - form: "wyrażenie"
    pl: "Niewłaściwe słowo lub wyrażenie."
    ru: "Неподходящее слово или выражение."
    source: { kind: translated, id: 6553735 }
  - form: "wyrażenie"
    pl: "Sprawdzę to wyrażenie w słowniku."
    ru: "Я проверю это выражение в словаре."
    source: { kind: translated, id: 8413513 }
  - form: "wyrażenie"
    pl: "Czy we francuskim istnieje podobne wyrażenie?"
    ru: "Есть ли во французском похожее выражение?"
    source: { kind: translated, id: 5882654 }
  - form: "wyrażeniem"
    pl: "Taniec jest pionowym wyrażeniem poziomego pożądania."
    ru: "Танец — это вертикальное выражение горизонтального желания."
    source: { kind: translated, id: 3050322 }
  - form: "wyrażeniem"
    pl: "Pojęcie \"technologia pomostowa\" stało się modnym wyrażeniem."
    ru: "Понятие «мостовая технология» стало модным выражением."
    source: { kind: translated, id: 1354544 }
  - form: "wyrażeniem"
    pl: "Nazwał to dziwnym wyrażeniem."
    ru: "Он назвал это странным выражением."
    source: { kind: authored }
  - form: "wyrażę"
    pl: "Pozwól, że wyrażę swoją osobistą opinię."
    ru: "Позволь мне высказать своё личное мнение."
    source: { kind: translated, id: 3486209 }
  - form: "wyrażę"
    pl: "Wyrażę to inaczej."
    ru: "Я выражу это иначе."
    source: { kind: authored }
  - form: "wyrażę"
    pl: "Nigdy tego nie wyrażę słowami."
    ru: "Я никогда не выражу этого словами."
    source: { kind: authored }
  - form: "wyrażona"
    pl: "liczba 2015 wyrażona w systemie binarnym to 11111011111."
    ru: "Число 2015, выраженное в двоичной системе, — это 11111011111."
    source: { kind: translated, id: 3748032 }
  - form: "wyrażona"
    pl: "Myśl wyrażona jasno przekonuje."
    ru: "Ясно выраженная мысль убеждает."
    source: { kind: authored }
  - form: "wyrażona"
    pl: "Zgoda wyrażona na piśmie jest ważna."
    ru: "Согласие, выраженное письменно, действительно."
    source: { kind: authored }
