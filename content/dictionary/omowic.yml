# review
id: omowic
format: 2
lemma: "omówić"
rank: 2745
pos: verb
pron: { cyr: "ому́виць" }
senses:
  - id: discuss
    ru: "обсудить"
    examples:
      - pl: "Trzeba omówić szczegóły przed podpisaniem."
        ru: "Надо обсудить детали перед подписанием."
        source: { kind: authored }
      - pl: "Omówili warunki i uścisnęli sobie ręce."
        ru: "Они обсудили условия и пожали друг другу руки."
        source: { kind: authored }
      - pl: "Sprawę omówiono na zamkniętym posiedzeniu."
        ru: "Дело обсудили на закрытом заседании."
        source: { kind: authored }
  - id: review
    ru: "разобрать, изложить"
    examples:
      - pl: "Omówienie wyników zajęło pół godziny."
        ru: "Разбор результатов занял полчаса."
        source: { kind: authored }
      - pl: "Lekarz omówi wyniki badań osobiście."
        ru: "Врач разберёт результаты анализов лично."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Буква ó стоит здесь во всех формах без исключения: OMÓW, omówi, omówię, omówienie, omówiony. Это ó корневое, из MÓWIĆ, у которого оно есть везде. Сравните pozdrowić: там POZDRÓW с ó, но pozdrowi с обычным o, потому что ó возникло от закрытия слога и исчезает, едва слог откроется. Один и тот же знак, два разных источника, и различить их можно только по однокоренным словам — если ó есть в корне, оно не уйдёт." }
  - { kind: usage, text: "Вид совершенный, пара к несовершенному OMAWIAĆ, и сама пара меняет гласную: omówić — omawiać, где ó переходит в a. Так же устроено mówić — mawiać. Это обычный для польского способ различать виды: не приставкой, а переогласовкой корня." }
  - { kind: government, text: "Глагол требует винительного падежа: OMÓWIĆ COŚ — omówić sprawę, omówić szczegóły, omówić wyniki. Русское «обсудить» управляет так же, поэтому ошибиться трудно. Но предложного оборота «o czymś» здесь нет: сказать omówić o sprawie нельзя, хотя по аналогии с rozmawiać o czymś так и тянет." }
collocations:
  - { pl: "omówić szczegóły", ru: "обсудить детали" }
  - { pl: "omówić sprawę", ru: "обсудить дело" }
  - { pl: "omówienie wyników", ru: "разбор результатов" }
family:
  - { pl: "omawiać", ru: "обсуждать", relation: aspect }
  - { pl: "omówienie", ru: "обсуждение, разбор", relation: derived }
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
etymology: "Приставка o- и глагол MÓWIĆ, из праславянского *mъlviti — то же слово, что русское «молвить». Буквально omówić значит «обговорить, обойти словом со всех сторон», и русское «обсудить» построено той же приставкой, только на другом корне, от «суда». Отсюда же omówienie «разбор» и несовершенное omawiać с переогласовкой корня."
memory: "ó здесь корневое и стоит везде: omów, omówi, omówienie — не как pozdrów/pozdrowi. А несовершенный вид меняет гласную: omawiać."
idioms:
  - { pl: "omówić szczegóły", ru: "обсудить детали" }
  - { pl: "do omówienia", ru: "на обсуждение" }
