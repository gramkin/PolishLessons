notes:
  - { kind: false-friend, text: "Это второй случай того же правила, что в REAGOWAĆ: польский суффикс -OWAĆ отвечает русскому -ИРОВАТЬ, и IGNOROWAĆ — это «игнорировать». Правило работает на сотнях слов: ORGANIZOWAĆ, KONTROLOWAĆ, PLANOWAĆ, RYZYKOWAĆ. Ошибка тоже та же и единственная: польская форма короче русской на слог, потому что в польском нет вставки -ИР-. Сказать IGNORIROWAĆ нельзя, как нельзя сказать REAGIROWAĆ. Запомнив один раз, учащийся получает весь слой латинских заимствований: достаточно взять русское слово на -ИРОВАТЬ и убрать -ИР-." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия IGNORUJĄCY, одиннадцать от страдательного IGNOROWANY. В настоящем времени основа меняется на -UJ-, как у всего класса: инфинитив IGNOROWAĆ, но IGNORUJĘ, IGNORUJESZ, IGNORUJE. Совершенная пара — ZIGNOROWAĆ, с приставкой Z-, и она в живой речи встречается чаще несовершенной, потому что пренебрежение обычно однократно: ZIGNOROWAŁ MOJE PYTANIE. Существительное IGNORANCJA значит «невежество», а не «игнорирование», и это стоит знать отдельно: IGNOROWANIE — процесс, IGNORANCJA — незнание." }
  - { kind: government, text: "Переходный: игнорировать кого или что — винительный без предлога, IGNOROWAĆ PYTANIE, ZNAK, OSTRZEŻENIE, IGNOROWAĆ KOGOŚ. Русское управление то же, винительный, так что ошибиться трудно. Отрицание переводит дополнение в родительный: NIE IGNORUJ TEGO SYGNAŁU. Предлогов глагол не требует вовсе, и это отличает его от русского «пренебрегать», которое берёт творительный: «пренебрегать правилами» будет LEKCEWAŻYĆ PRZEPISY или IGNOROWAĆ PRZEPISY, но в обоих случаях по-польски винительный." }
  - { kind: pronunciation, text: "Читается «игноро́ваць», четыре слога, ударение на предпоследнем. Начальное I это «и», и перед G оно не смягчает согласного. Буква O в обоих слогах звучит отчётливо, без редукции, которая обязательна в русском: не «игнараваць», а «игноро́ваць». Конечное -AĆ это «аць» с мягким Ć. В формах настоящего времени основа другая: IGNORUJĘ звучит «игнору́е» с лёгким носовым на конце, IGNORUJESZ — «игнору́еш»." }
