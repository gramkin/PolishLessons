etymology: "Из латинского IGNORARE «не знать», от IGNARUS «неведающий», через французский и немецкий в девятнадцатом веке. Оба языка взяли слово из одного источника и оформили его каждый по-своему: польский присоединил свой продуктивный -OWAĆ, тот же, что в PRACOWAĆ и KUPOWAĆ, а русский взял немецкое -IEREN и превратил его в -ИРОВАТЬ. Отсюда и единственное практическое следствие: польская форма на слог короче, и это верно для всего слоя заимствований. Исходное латинское значение «не знать» в польском сохранилось в существительном IGNORANCJA «невежество», тогда как глагол ушёл к значению «намеренно не замечать». Русский развёл эти два смысла так же, и потому «игнорировать» и «невежество» в обоих языках родственны, хотя связь на слух не слышна."
memory: "Второй случай правила из карточки reagowaĆ: польское -owaĆ = русское -ИРОВАТЬ, и достаточно убрать -ир-. Ignorować, organizować, kontrolować, planować. Единственная ошибка — лишний слог: ignorirować не существует. Настоящее время на -uj-: ignoruję, ignorujesz. Совершенный вид с приставкой z-: zignorować, и он частотнее. И отдельно: ignorancja значит «невежество», а не «игнорирование» — процесс это ignorowanie."
