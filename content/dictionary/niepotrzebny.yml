# review
id: niepotrzebny
format: 2
lemma: "niepotrzebny"
rank: 4030
pos: adj
pron: { cyr: "непотшэ́бны" }
senses:
  - id: unnecessary
    ru: "ненужный, лишний"
    examples:
      - pl: "Wyrzuć niepotrzebne rzeczy."
        ru: "Выброси ненужные вещи."
        source: { kind: authored }
      - pl: "To niepotrzebny wydatek."
        ru: "Это лишняя трата."
        source: { kind: authored }
      - pl: "To najniepotrzebniejszy gadżet, jaki kupiłem."
        ru: "Это самый ненужный гаджет, какой я купил."
        source: { kind: authored }
  - id: needless
    ru: "напрасный, излишний (о словах, поступке)"
    examples:
      - pl: "To była niepotrzebna kłótnia."
        ru: "Это была ненужная ссора."
        source: { kind: authored }
      - pl: "Nie rób niepotrzebnego zamieszania."
        ru: "Не поднимай лишнего шума."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Совпадение с русским «ненужный» полное: NIE- плюс POTRZEBNY, как «не» плюс «нужный». Синоним ZBĘDNY, «лишний», звучит книжнее. Наречие NIEPOTRZEBNIE значит «зря, напрасно»: NIEPOTRZEBNIE TO POWIEDZIAŁEM, «зря я это сказал»." }
  - { kind: usage, text: "Полная парадигма: NIEPOTRZEBNY, NIEPOTRZEBNIEJSZY, NAJNIEPOTRZEBNIEJSZY. Степени редки, но живут в шутливой речи: NAJNIEPOTRZEBNIEJSZY PREZENT. Мужское-личное: NIEPOTRZEBNI, NIEPOTRZEBNIEJSI, NAJNIEPOTRZEBNIEJSI — о лишних людях." }
  - { kind: government, text: "Ненужный кому-то — NIEPOTRZEBNY KOMUŚ, дательный: TO MI NIEPOTRZEBNE, «мне это не нужно». Или NIEPOTRZEBNY DLA KOGOŚ. Ненужный для чего-то — NIEPOTRZEBNY DO + родительный." }
  - { kind: pronunciation, text: "Читается «непотшэ́бны», четыре слога, ударение на предпоследнем. TRZ — «тш», ZE — твёрдое «шэ». Сравните с POTRZEBNY «потшэ́бны»." }
  - { kind: register, text: "Нейтральное повседневное слово. В разговоре часто в форме TO NIEPOTRZEBNE, «это лишнее». В бюрократии — ZBĘDNY: ZBĘDNE DOKUMENTY, «лишние документы»." }
collocations:
  - { pl: "niepotrzebne rzeczy", ru: "ненужные вещи" }
  - { pl: "niepotrzebny wydatek", ru: "лишняя трата" }
  - { pl: "niepotrzebne nerwy", ru: "лишние нервы" }
family:
  - { pl: "potrzebny", ru: "нужный", relation: root, id: potrzebny }
  - { pl: "niepotrzebnie", ru: "зря, напрасно", relation: derived, id: niepotrzebnie }
  - { pl: "potrzeba", ru: "потребность, нужда", relation: root, id: potrzeba }
etymology: "От POTRZEBNY «нужный», а то от POTRZEBA «нужда», общеславянского корня *treb-, того же, что в русском «потребность», «требовать», «треба». С отрицанием NIE- — «ненужный», как русское «не» плюс «нужный»."
memory: "Niepotrzebny — ненужный, лишний: niepotrzebne rzeczy, niepotrzebna kłótnia. To mi niepotrzebne — мне это не нужно. Niepotrzebnie — зря. Читается «непотшэ́бны»."
idioms:
  - { pl: "niepotrzebne nerwy", ru: "лишние нервы, напрасное беспокойство" }
