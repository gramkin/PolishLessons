# review
id: przedstawic
format: 2
lemma: "przedstawić"
rank: 802
pos: verb
aspect: perf
pron: { cyr: "пшэтста́виць" }
senses:
  - id: introduce-self
    ru: "przedstawić się — представиться"
    note: "Самое частое употребление — с się."
    examples:
      - pl: "Przedstaw się."
        ru: "Представься."
        source: { kind: translated, id: 12359747 }
      - pl: "Możesz się przedstawić?"
        ru: "Можешь представиться?"
        source: { kind: translated, id: 7462919 }
      - pl: "Tom przedstawił się."
        ru: "Том представился."
        source: { kind: translated, id: 10598431 }
  - id: introduce
    ru: "przedstawić kogoś komuś — представить кого-л. кому-л."
    examples:
      - pl: "Przedstawiła mi tę panią."
        ru: "Она представила мне эту даму."
        source: { kind: translated, id: 349579 }
      - pl: "Przedstawiła mnie swojemu bratu."
        ru: "Она представила меня своему брату."
        source: { kind: translated, id: 3712733 }
      - pl: "Przedstawiłem Marię rodzicom."
        ru: "Я представил Марию родителям."
        source: { kind: translated, id: 360044 }
  - id: present
    ru: "przedstawić coś — представить, изложить"
    examples:
      - pl: "Przedstawiono mu dowody."
        ru: "Ему представили доказательства."
        source: { kind: translated, id: 722170 }
      - pl: "Przedstawiono nowe argumenty."
        ru: "Были представлены новые аргументы."
        source: { kind: translated, id: 732898 }
      - pl: "Po pierwsze przedstawimy naszą petycję burmistrzowi i zbierzemy podpisy."
        ru: "Сначала мы представим нашу петицию мэру и соберём подписи."
        source: { kind: translated, id: 2516421 }
  - id: depict
    ru: "przedstawiony — изображённый"
    examples:
      - pl: "Na obrazie przedstawiony jest Zamenhof."
        ru: "На картине изображён Заменгоф."
        source: { kind: tatoeba, id: 13785897 }
      - pl: "Na herbie obwodu czelabińskiego przedstawiony jest wielbłąd."
        ru: "На гербе Челябинской области изображён верблюд."
        source: { kind: tatoeba, id: 8661257 }
      - pl: "Na rysunku przedstawiono dom."
        ru: "На рисунке изображён дом."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Чаще всего слово встречается с się: przedstawić się «представиться». Przedstaw się! — стандартная просьба назвать себя." }
  - { kind: government, text: "Кого представить — винительный, кому — дательный: przedstawić kogoś komuś. Przedstawiła mnie swojemu bratu «Она представила меня своему брату»." }
  - { kind: usage, text: "Причастие przedstawiony значит «изображённый»: Na obrazie przedstawiony jest Zamenhof «На картине изображён Заменгоф»." }
  - { kind: usage, text: "Существительное przedstawienie значит «спектакль, представление»: Kiedy zacznie się przedstawienie? Несовершенный вид — przedstawiać." }
collocations:
  - { pl: "przedstawić się", ru: "представиться" }
  - { pl: "przedstawić kogoś komuś", ru: "представить кого-либо кому-либо" }
  - { pl: "przedstawić dowody", ru: "представить доказательства" }
  - { pl: "przedstawienie", ru: "спектакль" }
family:
  - { pl: "przedstawiać", ru: "представлять", relation: aspect }
  - { pl: "przedstawienie", ru: "спектакль", relation: derived }
  - { pl: "przedstawiciel", ru: "представитель", relation: derived }
  - { pl: "stawić", ru: "поставить", relation: root }
etymology: "przed- + stawić «поставить», от stać «стоять» — буквально «поставить перед», как русское «пред-ставить»."
memory: "przedstawić собрано ровно как русское «пред-ставить»: przed- + stawić «поставить». Чаще всего встречается с się — Przedstaw się! «Представься!». Управление тоже совпадает: przedstawić kogoś komuś, винительный плюс дательный. А существительное przedstawienie значит «спектакль»: Kiedy zacznie się przedstawienie?"
idioms:
  - { pl: "przedstawić się", ru: "представиться" }
  - { pl: "przedstawić dowody", ru: "представить доказательства" }
  - { pl: "przedstawienie", ru: "спектакль" }
