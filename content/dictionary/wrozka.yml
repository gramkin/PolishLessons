etymology: "От глагола WRÓŻYĆ, праславянского и того же, что русское «ворожить». Разошлись языки только в слоге: мы сохранили полногласие, «воро-», поляк стянул его в WRÓ-, как и в GŁOWA при «голове». Второе значение, фея, пришло позже, вместе с французскими сказками: переводчики не стали брать чужое слово и отдали роль своей ворожее. Так одна WRÓŻKA стала и гадалкой, и доброй феей."
memory: "Гадалка — и фея: dobra wrozka в сказке это добрая фея, и французского слова поляку не понадобилось. Родня наша: «ворожить» и «ворожея», а разницу в виде объясняет полногласие, наше «воро-» против стянутого wro-. Читается «вру́шка», где o с черточкой даёт «у», а z с точкой перед k оглушается в «ш». Гадать на картах — wrozyc z kart, с предлогом z."
idioms:
  - { pl: "dobra wróżka", ru: "добрая фея" }
