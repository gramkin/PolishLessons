notes:
  - { kind: false-friend, text: "Родственники у слова есть, и близкие: русские «ворожить» и «ворожея». Разницу в виде объясняет полногласие — у нас «воро-», у поляков стянутое WRÓ-, ровно как «голова» против GŁOWA. А вот значение в польском шире: WRÓŻKA это и гадалка, и фея. DOBRA WRÓŻKA в каждой польской сказке — добрая фея, и своего слова на это у поляков не понадобилось. Русскому пришлось взять французскую «фею»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падежах K переходит в C: WRÓŻKA, но WRÓŻCE. В родительном множественного появляется беглое E: WRÓŻEK. Оба значения живут в одном слове и различаются только по месту: на ярмарке это гадалка, в сказке — фея. Прилагательных от корня два: WRÓŻEBNY о знаках и WIESZCZY о пророчествах." }
  - { kind: government, text: "К гадалке — DO WRÓŻKI, предлог DO с родительным. У гадалки — U WRÓŻKI, предлог U тоже с родительным, как и по-русски. Гадать на картах — WRÓŻYĆ Z KART, предлог Z с родительным, где русский скажет «на картах». Это стоит запомнить: поляк гадает «из карт», как бы вычитывая из них." }
  - { kind: pronunciation, text: "Читается «вру́шка», два слога, ударение на первом. Буква Ó даёт «у». Буква Ż перед K оглушается и звучит «ш», поэтому выходит «шка», а не «жка». В форме WRÓŻCE сочетание ŻC даёт «шц»: «вру́шце». Между В и Р никакой гласной нет: слово начинается прямо с «вру», тогда как русское «ворожея» вставляет между ними «о»." }
  - { kind: register, text: "Слово живёт в двух мирах сразу. На ярмарке и в объявлениях это гадалка: WRÓŻKA Z KART, WRÓŻKA Z KULI. В детских книгах — фея: DOBRA WRÓŻKA, ZŁA WRÓŻKA. Глагол WRÓŻYĆ при этом вполне обиходен и в переносном смысле: TO NIE WRÓŻY NIC DOBREGO значит «это не обещает ничего хорошего»." }
collocations:
  - { pl: "wróżka z kart", ru: "гадалка на картах" }
  - { pl: "pójść do wróżki", ru: "пойти к гадалке" }
