notes:
  - { kind: false-friend, text: "Русское «стукнутый» тоже бывает «пришибленный», «с приветом», так что образ совпадает: человека как будто стукнули по голове. Польское STUKNIĘTY в разговоре почти всегда значит «чокнутый», а о машине — «битый, после аварии»: AUTO PO STŁUCZCE, или просто STUKNIĘTE. Синонимы — POMYLONY, KOPNIĘTY, SZURNIĘTY, все разговорные." }
  - { kind: usage, text: "Степеней сравнения нет, хотя в разговоре говорят ZUPEŁNIE STUKNIĘTY, «совсем чокнутый». Все одиннадцать форм живые. Форма для мужчин-людей STUKNIĘCI частая: CI STUKNIĘCI TURYŚCI. По форме это причастие от STUKNĄĆ, «стукнуть», но склоняется как прилагательное." }
  - { kind: government, text: "Чокнутый на чём-то — STUKNIĘTY NA PUNKCIE CZEGOŚ, «помешанный на чём-то»: STUKNIĘTY NA PUNKCIE PIŁKI. Это устойчивая польская конструкция с родительным. Ставится чаще перед существительным: STUKNIĘTY NAUKOWIEC." }
  - { kind: pronunciation, text: "Читается «стукне́нты», три слога, ударение на предпоследнем. NIĘ даёт «нен», с носовым Ę перед T как «эн». TY — твёрдое «ты». В форме STUKNIĘCI: «стукне́нци»." }
  - { kind: register, text: "Разговорное, шутливое или пренебрежительное слово. О друге сказать STUKNIĘTY — почти ласково, о незнакомце — грубовато. В официальной речи его нет; там говорят NIEZRÓWNOWAŻONY, «неуравновешенный»." }
collocations:
