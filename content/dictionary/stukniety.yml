etymology: "Страдательное причастие от STUKNĄĆ «стукнуть», звукоподражательного, как и русское «стук». Переносный смысл «помешанный» — тот же образ, что в русском «пришибленный», «стукнутый пыльным мешком»: будто человека ударили по голове."
memory: "Stuknięty — чокнутый, с приветом: stuknięty sąsiad, stuknięty pomysł. Stuknięty na punkcie piłki — помешан на футболе. О машине — битая. Читается «стукне́нты»."
idioms:
  - { pl: "stuknięty na punkcie czegoś", ru: "помешанный на чём-то" }
