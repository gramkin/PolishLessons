# review
id: dokument
format: 2
lemma: "dokument"
rank: 1110
pos: noun
pron: { cyr: "доку́мэнт" }
senses:
  - id: paper
    ru: "документ (бумага)"
    examples:
      - pl: "Proszę podpisać ten dokument."
        ru: "Подпишите этот документ, пожалуйста."
        source: { kind: translated, id: 1864260 }
      - pl: "Odmawiam podpisania tego dokumentu."
        ru: "Я отказываюсь подписывать этот документ."
        source: { kind: translated, id: 10592493 }
      - pl: "Podpisałem dokumenty."
        ru: "Я подписал документы."
        source: { kind: translated, id: 734226 }
  - id: id
    ru: "dokumenty — документы, удостоверение личности"
    examples:
      - pl: "Czy możesz mi pomóc? Zgubiłem ważny dokument."
        ru: "Можешь мне помочь? Я потерял важный документ."
        source: { kind: translated, id: 1789024 }
      - pl: "Dlaczego nie spalił pan tych dokumentów?"
        ru: "Почему вы не сожгли эти документы?"
        source: { kind: tatoeba, id: 7180706 }
  - id: file
    ru: "документ (файл в компьютере)"
    examples:
      - pl: "Zapisz dokument przed zamknięciem."
        ru: "Сохрани документ перед закрытием."
        source: { kind: authored }
      - pl: "Otwórz nowy dokument."
        ru: "Открой новый документ."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Мужской род неодушевлённый: ten dokument, tego dokumentu." }
  - { kind: usage, text: "Множественное dokumenty значит и «бумаги», и «документы, удостоверение личности»: Proszę o dokumenty «Ваши документы»." }
  - { kind: usage, text: "Ещё одно значение — «документальный фильм»: слово получилось усечением из film dokumentalny." }
  - { kind: usage, text: "В компьютере dokument — это файл, ровно как в русском." }
collocations:
  - { pl: "podpisać dokument", ru: "подписать документ" }
  - { pl: "dokument tożsamości", ru: "удостоверение личности" }
  - { pl: "zapisać dokument", ru: "сохранить документ" }
family:
  - { pl: "dokumentacja", ru: "документация", relation: derived }
  - { pl: "dokumentalny", ru: "документальный", relation: derived }
  - { pl: "udokumentować", ru: "задокументировать", relation: derived }
etymology: "Из латинского documentum «доказательство, свидетельство», от docere «учить». Русский «документ» — то же заимствование."
memory: "dokument — «документ», мужской род. Множественное dokumenty значит и «бумаги», и «документы, удостоверение»: Proszę o dokumenty «Ваши документы». А ещё dokument — это документальный фильм."
idioms:
  - { pl: "dokument tożsamości", ru: "удостоверение личности" }
  - { pl: "podpisać dokument", ru: "подписать документ" }
