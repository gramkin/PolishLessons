# review
id: piwnica
format: 2
lemma: "piwnica"
rank: 1877
pos: noun
pron: { cyr: "пивни́ца" }
senses:
  - id: cellar
    ru: "подвал, погреб"
    examples:
      - pl: "Ta piwnica jest olbrzymia."
        ru: "Этот подвал огромный."
        source: { kind: translated, id: 3869823 }
      - pl: "Piwnica jest brudna, ciemna i śmierdzi."
        ru: "Подвал грязный, тёмный и воняет."
        source: { kind: translated, id: 404052 }
      - pl: "Piwnica w jego domu jest regularnie zalewana przez niewytłumaczalne wycieki wody."
        ru: "Подвал в его доме регулярно заливает необъяснимыми протечками."
        source: { kind: translated, id: 2981954 }
  - id: in-cellar
    ru: "подвал (в подвале, в подвал)"
    examples:
      - pl: "Byłeś w piwnicy?"
        ru: "Ты был в подвале?"
        source: { kind: translated, id: 6106090 }
      - pl: "Ktoś jest w piwnicy."
        ru: "Кто-то есть в подвале."
        source: { kind: translated, id: 3761573 }
      - pl: "Znalazłem tę świeczkę u nas w piwnicy."
        ru: "Я нашёл эти свечи у нас в подвале."
        source: { kind: tatoeba, id: 10768434 }
notes:
  - { kind: government, text: "В подвале — w piwnicy (предложный падеж); в подвал — do piwnicy (родительный с do)." }
  - { kind: usage, text: "Слово от piwo «пиво»: изначально помещение, где хранили пиво и вино. Русский «погреб» построен от «погребать»." }
  - { kind: usage, text: "piwnica значит и подвальный этаж дома, и кладовку для запасов: в польских домах у каждой квартиры своя piwnica." }
  - { kind: false-friend, text: "Не путайте с pivnica в других славянских языках: в польском это именно подвал, а не пивная." }
collocations:
  - { pl: "w piwnicy", ru: "в подвале" }
  - { pl: "do piwnicy", ru: "в подвал" }
  - { pl: "piwnica winna", ru: "винный погреб" }
family:
  - { pl: "piwo", ru: "пиво", relation: root }
  - { pl: "dom", ru: "дом", relation: root, id: dom }
  - { pl: "piętro", ru: "этаж", relation: root, id: pietro }
etymology: "От piwo «пиво»: помещение, где держали пиво и вино. Русский «подвал» построен от «вал», а «погреб» от «погребать» — образы разные."
memory: "piwnica — «подвал, погреб», от piwo «пиво». В подвале — w piwnicy, в подвал — do piwnicy."
