notes:
  - { kind: false-friend, text: "REGULARNIE — «регулярно», перевод прямой. Но в разговоре слово часто значит «постоянно, вечно» с упрёком: ON REGULARNIE SIĘ SPÓŹNIA, «он вечно опаздывает»." }
  - { kind: usage, text: "Наречие со степенями: REGULARNIE, REGULARNIEJ, NAJREGULARNIEJ. Синонимы — SYSTEMATYCZNIE, «систематически», и разговорное CIĄGLE, «всё время»." }
  - { kind: government, text: "Наречие ничем не управляет. Интервал вводится через CO с винительным: REGULARNIE CO TYDZIEŃ, «регулярно каждую неделю»." }
  - { kind: pronunciation, text: "Читается «рэгула́рне», ударение на предпоследнем слоге. RE — твёрдое «рэ», LA — «ла»." }
collocations:
  - { pl: "regularnie ćwiczyć", ru: "регулярно тренироваться" }
  - { pl: "regularnie się spóźniać", ru: "постоянно опаздывать" }
  - { pl: "regularnie płacić rachunki", ru: "регулярно оплачивать счета" }
family:
