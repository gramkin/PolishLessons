etymology: "От REGULARNY, из латыни, от слова REGULA «правило, линейка». По-польски REGUŁA до сих пор значит «правило»: Z REGUŁY, «как правило»."
memory: "Regularnie — регулярно, а в разговоре «вечно»: regularnie się spóźnia. Читается «рэгула́рне». Z reguły — как правило."
idioms:
