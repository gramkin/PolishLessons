# review
id: szpik
format: 2
lemma: "szpik"
rank: 2298
pos: noun
pron: { cyr: "шпик" }
senses:
  - id: marrow
    ru: "костный мозг"
    examples:
      - pl: "Jest Amerykaninem do szpiku kości."
        ru: "Он американец до мозга костей."
        source: { kind: tatoeba, id: 12450151 }
      - pl: "To uczony do szpiku kości."
        ru: "Это учёный до мозга костей."
        source: { kind: translated, id: 522810 }
      - pl: "Byłem zziębnięty do szpiku kości."
        ru: "Я продрог до мозга костей."
        source: { kind: translated, id: 601072 }
  - id: to-the-core
    ru: "мозг костей (в обороте do szpiku kości)"
    examples:
      - pl: "Przemarzł do szpiku kości."
        ru: "Он промёрз до мозга костей."
        source: { kind: authored }
      - pl: "Przeszczep szpiku uratował mu życie."
        ru: "Пересадка костного мозга спасла ему жизнь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В корпусе слово встречается почти только в обороте do szpiku kości «до мозга костей» — точном соответствии русского выражения, включая оба существительных." }
  - { kind: false-friend, text: "Не «шпик» в смысле сала или сыщика. Польское szpik — это медицинский костный мозг; сало по-польски słonina, а сыщик — szpicel." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — szpiku." }
  - { kind: usage, text: "Медицинский термин: przeszczep szpiku «пересадка костного мозга»." }
collocations:
  - { pl: "do szpiku kości", ru: "до мозга костей" }
  - { pl: "przeszczep szpiku", ru: "пересадка костного мозга" }
etymology: "Праславянское слово со значением «мозг в кости». В русском прямого соответствия нет: там это описывается двумя словами, «костный мозг». Русское «шпик» (сало) — отдельное заимствование из немецкого Speck и к польскому szpik отношения не имеет."
memory: "szpik — «костный мозг», и живёт в обороте do szpiku kości «до мозга костей», который совпадает с русским дословно. Не «шпик» в русском смысле."
