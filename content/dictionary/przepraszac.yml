# review
id: przepraszac
format: 2
lemma: "przepraszać"
rank: 99
pos: verb
aspect: imperf
pron: { cyr: "пшэпра́шаць" }
senses:
  - id: apologize
    ru: "извиняться, просить прощения"
    examples:
      - pl: "Przepraszam!"
        ru: "Прошу прощения!"
        source: { kind: tatoeba, id: 2425830 }
      - pl: "Dobrze. Przepraszam."
        ru: "Хорошо. Прости."
        source: { kind: tatoeba, id: 2809306 }
      - pl: "Nie ma potrzeby przepraszać; ja rozumiem."
        ru: "Нет необходимости извиняться; я понимаю."
        source: { kind: tatoeba, id: 3457077 }
  - id: excuse-me
    ru: "przepraszam — извините (обращение)"
    examples:
      - pl: "Przepraszam, która godzina?"
        ru: "Извините, который час?"
        source: { kind: authored }
      - pl: "Przepraszam, czy to miejsce jest wolne?"
        ru: "Извините, это место свободно?"
        source: { kind: authored }
notes:
  - { kind: government, text: "przepraszać kogoś za coś: Przepraszam cię za spóźnienie «Извини меня за опоздание»." }
  - { kind: usage, text: "Przepraszam — это и «извините» при обращении к незнакомому, и «прошу прощения» как извинение." }
collocations:
  - { pl: "przepraszam bardzo", ru: "прошу прощения" }
  - { pl: "przepraszam za spóźnienie", ru: "извините за опоздание" }
etymology: "Приставочное от praszać (старое «просить») с приставкой prze-: буквально «упросить, выпросить прощение»; ср. русское «упрашивать»."
memory: "Одно слово покрывает два русских: Przepraszam — это и «извините» при обращении к незнакомому, и «прошу прощения». Управление: przepraszać kogoś (винительный) za coś."
idioms:
  - { pl: "przepraszam bardzo", ru: "прошу прощения" }
  - { pl: "nie ma za co przepraszać", ru: "не за что извиняться" }
