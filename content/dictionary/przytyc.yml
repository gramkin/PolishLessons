# review
id: przytyc
format: 2
lemma: "przytyć"
rank: 2077
pos: verb
aspect: perf
pron: { cyr: "пшы́тыць" }
senses:
  - id: gain-weight
    ru: "потолстеть, набрать вес"
    examples:
      - pl: "Tom przytył."
        ru: "Том потолстел."
        source: { kind: translated, id: 2657685 }
      - pl: "Przytyłem."
        ru: "Я потолстел."
        source: { kind: translated, id: 823180 }
      - pl: "Tego lata przytyłem dwa kilo."
        ru: "Этим летом я набрал два килограмма."
        source: { kind: translated, id: 1002726 }
  - id: warning
    ru: "потолстеть (как предостережение)"
    examples:
      - pl: "Nie jedz tyle. Przytyjesz."
        ru: "Не ешь столько. Потолстеешь."
        source: { kind: translated, id: 357999 }
      - pl: "Postaraj się nie przytyć."
        ru: "Постарайся не потолстеть."
        source: { kind: translated, id: 950951 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — tyć «толстеть»." }
  - { kind: government, text: "Непереходный. Сколько именно — винительным без предлога: przytyć dwa kilo «набрать два кило»." }
  - { kind: false-friend, text: "Корень tyć «толстеть» не связан с русским «тыкать». Антоним — schudnąć «похудеть»." }
  - { kind: usage, text: "Форма przytyłeś? «ты потолстел?» звучит куда грубее русского эквивалента — по-польски это прямой упрёк." }
  - { kind: government, text: "Безличная форма przytyto возможна, потому что за ней стоят неназванные люди: w czasie świąt przytyto. Так же образуются tańczono и śpiewano." }
collocations:
  - { pl: "przytyć kilka kilo", ru: "набрать несколько килограммов" }
etymology: "przy- + tyć «толстеть», праславянское *tyti; ср. русское «тук», «тучный»."
memory: "przytyć — «потолстеть», совершенный вид к tyć. Антоним schudnąć «похудеть». Сколько именно — винительным: przytyć dwa kilo."
idioms:
  - { pl: "przytyć kilka kilo", ru: "набрать несколько килограммов" }
