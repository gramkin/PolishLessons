  - { pl: "omamy", ru: "галлюцинации", relation: derived }
etymology: "Приставка O- плюс MAMIĆ «морочить, манить обманом». От того же корня — OMAMY «галлюцинации»."
memory: "Omamić — обморочить: sprzedawca omamił ją gładką gadką. Omamy — то, что тебе померещилось."
