senses:
  - id: deceive
    ru: "одурачить, заморочить голову (обещаниями, словами)"
    examples:
      - pl: "Sprzedawca omamił ją gładką gadką."
        ru: "Продавец заморочил ей голову гладкими речами."
        source: { kind: translated, id: 735898 }
      - pl: "Politycy znów omamią wyborców obietnicami."
        ru: "Политики снова одурачат избирателей обещаниями."
        source: { kind: authored }
      - pl: "Nie daj się omamić pięknymi słowami."
        ru: "Не дай себя одурачить красивыми словами."
        source: { kind: authored }
  - id: charm
    ru: "очаровать, вскружить голову"
    examples:
      - pl: "Omamiła go swoją urodą."
        ru: "Она вскружила ему голову своей красотой."
        source: { kind: authored }
      - pl: "Syreny omamiły żeglarzy śpiewem."
        ru: "Сирены заворожили моряков пением."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "OMAMIĆ — «одурачить, обольстить, заморочить голову», а не что-то «мамино». Ближе всего русское «обморочить». Родственное OMAMY — «галлюцинации», а не «обман»: MIEĆ OMAMY «видеть то, чего нет»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — MAMIĆ «морочить, манить обманом». Будущее: OMAMIĘ, OMAMISZ, OMAMIĄ. Очень часто в обороте DAĆ SIĘ OMAMIĆ «поддаться на обман» и в причастии OMAMIONY «одурманенный, ослеплённый»." }
  - { kind: government, text: "Кого — винительный, чем — творительный без предлога: OMAMIĆ KOGOŚ OBIETNICAMI, URODĄ. В пассиве — PRZEZ + винительный: OMAMIONY PRZEZ OSZUSTA." }
  - { kind: register, text: "Слово книжное и эмоциональное, с осуждением. В быту чаще OSZUKAĆ «обмануть» или NABRAĆ «надуть»." }
collocations:
