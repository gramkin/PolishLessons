# review
id: obraz
format: 2
lemma: "obraz"
rank: 983
pos: noun
pron: { cyr: "о́брас" }
senses:
  - id: painting
    ru: "картина (написанная красками)"
    note: "Основное значение — именно картина, а не «образ»."
    examples:
      - pl: "Picasso namalował ten obraz w 1950."
        ru: "Пикассо написал эту картину в 1950 году."
        source: { kind: tatoeba, id: 527346 }
      - pl: "Zasadniczo, obraz olejny."
        ru: "В общем, картина маслом."
        source: { kind: tatoeba, id: 10849344 }
      - pl: "Pomogłem jej powiesić obraz na ścianie."
        ru: "Я помог ей повесить картину на стену."
        source: { kind: tatoeba, id: 3004484 }
  - id: in-painting
    ru: "na obrazie — на картине"
    examples:
      - pl: "Na obrazie przedstawiony jest Zamenhof."
        ru: "На картине изображён Заменгоф."
        source: { kind: tatoeba, id: 13785897 }
      - pl: "Jaki wizerunek chciałeś przedstawić na tym obrazie?"
        ru: "Какой образ ты хотел передать на этой картине?"
        source: { kind: translated, id: 991244 }
      - pl: "Oglądasz reprodukcję obrazu Picassa."
        ru: "Ты смотришь на репродукцию картины Пикассо."
        source: { kind: translated, id: 349599 }
  - id: image
    ru: "образ, картина (переносно)"
    examples:
      - pl: "Język jest obrazem naszych myśli."
        ru: "Язык — образ наших мыслей."
        source: { kind: translated, id: 3004568 }
      - pl: "Wyjaśniła swoje pomysły obrazami."
        ru: "Она объяснила свои мысли картинками."
        source: { kind: translated, id: 10604131 }
      - pl: "Nie podoba mi się żaden z tych obrazów."
        ru: "Мне не нравится ни одна из этих картин."
        source: { kind: tatoeba, id: 352529 }
notes:
  - { kind: false-friend, text: "Главное значение польского obraz — «картина», написанная красками, а не «образ». Picasso namalował ten obraz значит «Пикассо написал эту картину». Значение «образ» тоже есть, но оно второе и книжное." }
  - { kind: false-friend, text: "Осторожно с формой obrazy. Это множественное число от obraz «картины», но точно так же выглядит родительный от совсем другого слова — obraza «обида». Bez obrazy! значит «Без обид!», а не «без картин»." }
  - { kind: usage, text: "Картинка, иллюстрация — obrazek; изображение на экране — obraz или wizerunek. Прилагательное obrazowy значит «образный, наглядный»." }
  - { kind: usage, text: "obraz nędzy i rozpaczy — «картина нищеты и отчаяния», говорят о жалком виде. А gadać jak do obrazu — «говорить как со стеной»." }
collocations:
  - { pl: "namalować obraz", ru: "написать картину" }
  - { pl: "na obrazie", ru: "на картине" }
  - { pl: "obraz olejny", ru: "картина маслом" }
  - { pl: "bez obrazy", ru: "без обид" }
family:
  - { pl: "obrazek", ru: "картинка", relation: derived }
  - { pl: "obrazowy", ru: "образный", relation: derived }
  - { pl: "wyobraźnia", ru: "воображение", relation: derived }
etymology: "Из ob- + raz-, от razić «поражать, бить»: изначально «то, что вырезано, отпечатано». Русское «образ» — то же слово, но значения разошлись."
memory: "obraz — прежде всего «картина», написанная красками, и лишь потом «образ». Картинка поменьше — obrazek. И будьте внимательны с формой obrazy: так выглядит и множественное от obraz, и родительный от obraza «обида» — Bez obrazy! значит «Без обид!»."
idioms:
  - { pl: "namalować obraz", ru: "написать картину" }
  - { pl: "obraz olejny", ru: "картина маслом" }
  - { pl: "obraz nędzy i rozpaczy", ru: "жалкое зрелище" }
  - { pl: "gadać jak do obrazu", ru: "говорить как со стеной" }
