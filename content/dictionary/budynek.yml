# review
id: budynek
format: 2
lemma: "budynek"
rank: 729
pos: noun
pron: { cyr: "буды́нэк" }
senses:
  - id: building
    ru: "здание, постройка"
    examples:
      - pl: "Co to za budynek?"
        ru: "Что это за здание?"
        source: { kind: translated, id: 362818 }
      - pl: "Znalazłem ten budynek."
        ru: "Я нашёл это здание."
        source: { kind: translated, id: 361005 }
      - pl: "Opuśćmy budynek."
        ru: "Давайте покинем здание."
        source: { kind: translated, id: 6603200 }
  - id: inside
    ru: "w budynku — в здании"
    examples:
      - pl: "W budynku są kamery."
        ru: "В здании есть камеры."
        source: { kind: tatoeba, id: 6773379 }
      - pl: "Czy w tym budynku wolno fotografować?"
        ru: "В этом здании можно фотографировать?"
        source: { kind: tatoeba, id: 1083975 }
      - pl: "Widok ze szczytu tego budynku był wspaniały."
        ru: "Вид с вершины этого здания был великолепным."
        source: { kind: tatoeba, id: 1685315 }
  - id: plural
    ru: "здания, корпуса"
    examples:
      - pl: "Te budynki mają 500 lat."
        ru: "Этим зданиям пятьсот лет."
        source: { kind: translated, id: 367173 }
      - pl: "Budynki mają kilka pięter."
        ru: "В зданиях по нескольку этажей."
        source: { kind: translated, id: 5900484 }
      - pl: "W Nowym Yorku jest mnóstwo wysokich budynków."
        ru: "В Нью-Йорке множество высоких зданий."
        source: { kind: translated, id: 1366405 }
  - id: outside
    ru: "przed budynkiem — перед зданием"
    note: "После przed и za — творительный падеж."
    examples:
      - pl: "Przed budynkiem stoi samochód."
        ru: "Перед зданием стоит машина."
        source: { kind: translated, id: 789049 }
      - pl: "Tom zaparkował przed budynkiem."
        ru: "Том припарковался перед зданием."
        source: { kind: translated, id: 6473398 }
      - pl: "Zaparkował samochód za budynkiem."
        ru: "Он припарковал машину за зданием."
        source: { kind: translated, id: 959730 }
notes:
  - { kind: usage, text: "Беглое e: оно есть только в именительном budynek, а во всех остальных формах выпадает — w budynku, przed budynkiem, pięć budynków. Русское «замок — замка» устроено так же." }
  - { kind: usage, text: "budynek — постройка вообще, о доме как о жилье говорят dom. Konkretne здания имеют свои слова: dworzec «вокзал», szpital «больница»." }
  - { kind: government, text: "przed budynkiem и za budynkiem требуют творительного, w budynku — предложного." }
  - { kind: usage, text: "Родня прозрачная: budować «строить», budowa «стройка», budowla «сооружение»." }
collocations:
  - { pl: "w budynku", ru: "в здании" }
  - { pl: "przed budynkiem", ru: "перед зданием" }
  - { pl: "budynek mieszkalny", ru: "жилой дом" }
  - { pl: "opuścić budynek", ru: "покинуть здание" }
family:
  - { pl: "budować", ru: "строить", relation: root }
  - { pl: "budowa", ru: "стройка", relation: derived }
  - { pl: "budowla", ru: "сооружение", relation: derived }
etymology: "От budować «строить», а сам корень пришёл через средневерхненемецкое büding «постройка»."
memory: "budynek — «здание», от budować «строить». Главное в склонении — беглое e: оно живёт только в именительном. Budynek, но w budynku, przed budynkiem, pięć budynków — ровно как русское «замок — замка». И не путайте с dom: budynek — постройка вообще, dom — дом как жильё."
idioms:
  - { pl: "opuścić budynek", ru: "покинуть здание" }
  - { pl: "budynek mieszkalny", ru: "жилой дом" }
  - { pl: "przed budynkiem", ru: "перед зданием" }
