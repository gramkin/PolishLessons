etymology: "От праславянского *polъ «половина, сторона» — то же слово, что русское «пол-» в «полчаса» и «полночь»."
memory: "pół — «пол-, половина», и управление то же, что в русском: родительный падеж. Pół godziny «полчаса», pół mili «полмили», pół roku «полгода». Существительное «половина» — połowa. А из того же корня выросли południe «юг; полдень» и północ «север; полночь» — ровно как русские «полдень» и «полночь», где «пол-» значит «середина дня и ночи»."
