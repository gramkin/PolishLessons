# review
id: pol
format: 2
lemma: "pół"
rank: 613
pos: num
pron: { cyr: "пуу" }
senses:
  - id: half
    ru: "пол-, половина (чего-л. — с родительным)"
    note: "pół godziny «полчаса» — управление как в русском."
    examples:
      - pl: "Poczekaj, proszę, pół godziny."
        ru: "Подожди полчаса, пожалуйста."
        source: { kind: tatoeba, id: 3658050 }
      - pl: "Wrócę za pół godziny."
        ru: "Я вернусь через полчаса."
        source: { kind: tatoeba, id: 8658902 }
      - pl: "Pół mili nam zostało."
        ru: "Полмили у нас осталось."
        source: { kind: tatoeba, id: 1736708 }
  - id: half-way
    ru: "в составе оборотов: na pół, w pół drogi"
    note: "na pół «пополам», w pół drogi «на полпути»."
    examples:
      - pl: "Do szkoły idziemy pół godziny."
        ru: "До школы идти полчаса."
        source: { kind: tatoeba, id: 10073188 }
      - pl: "Przetnij jabłko na pół."
        ru: "Разрежь яблоко пополам."
        source: { kind: authored }
      - pl: "Zatrzymali się w pół drogi."
        ru: "Они остановились на полпути."
        source: { kind: authored }
notes:
  - { kind: government, text: "pół требует родительного падежа, как и русское «пол-»: pół godziny «полчаса», pół mili «полмили», pół roku «полгода»." }
  - { kind: usage, text: "Существительное «половина» — połowa: połowa drogi «половина пути». Само pół стоит перед единицей меры." }
  - { kind: usage, text: "Из pół выросли południe «юг; полдень» и północ «север; полночь» — ровно как русские «полдень» и «полночь»." }
  - { kind: usage, text: "Застывшие обороты: na pół «пополам», w pół drogi «на полпути», pół na pół «поровну»." }
collocations:
