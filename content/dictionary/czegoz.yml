# review
id: czegoz
format: 2
lemma: "czegóż"
rank: 5642
pos: adv
pron: { cyr: "чэ́гуш" }
senses:
  - id: what-emph
    ru: "чего же (усиленный родительный от co)"
    examples:
      - pl: "Do czegóż to służy?"
        ru: "Для чего же это служит?"
        source: { kind: translated, id: 670346 }
      - pl: "Z czegóż się utrzymuje?"
        ru: "На что же он живёт?"
        source: { kind: authored }
      - pl: "Czegóż więcej można chcieć?"
        ru: "Чего же ещё можно желать?"
        source: { kind: authored }
  - id: why
    ru: "чего ради, зачем же (риторический вопрос)"
    examples:
      - pl: "Czegóż się boisz?"
        ru: "Чего же ты боишься?"
        source: { kind: authored }
      - pl: "Czegóż od nas oczekują?"
        ru: "Чего же от нас ждут?"
        source: { kind: authored }
      - pl: "Czegóż tu szukać?"
        ru: "Чего тут искать?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Это родительный падеж czego от co «что» с усилительной частицей -ż. Та же семья, что gdzież, jakże, skądże." }
  - { kind: usage, text: "Управление как у czego: после отрицания и после многих глаголов — родительный падеж." }
  - { kind: register, text: "Книжное и риторическое: в обычной речи скажут просто czego." }
  - { kind: usage, text: "Вариант написания czegoż встречается реже; литературная норма — czegóż." }
collocations:
  - { pl: "czegóż więcej?", ru: "чего же ещё?" }
  - { pl: "czegóż się boisz?", ru: "чего же ты боишься?" }
  - { pl: "czego", ru: "чего" }
etymology: "Родительный czego от co «что» с усилительной частицей -ż. Та же модель, что в gdzież, jakże, skądże."
memory: "czegóż — усиленное czego «чего», из того же гнезда, что gdzież и jakże. Звучит книжно и риторически: Czegóż więcej można chcieć? «Чего же ещё можно желать?» В обычной речи хватает czego."
