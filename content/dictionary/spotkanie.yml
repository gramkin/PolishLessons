notes:
  - { kind: false-friend, text: "Самое полезное здесь — развести два польских глагола, которые русскому слышатся как один. SPOTKAĆ значит «встретить», а POTKNĄĆ SIĘ — «споткнуться». Русское «споткнуться» звучит почти как польское SPOTKAĆ, и ошибка выходит смешная: SPOTKAŁEM GO значит «я его встретил», а не «я о него споткнулся». И вот что любопытно: оба глагола действительно одного корня, связанного с идеей касания, прикосновения. Встретить — это коснуться кого-то на пути, споткнуться — коснуться препятствия ногой. Так что сходство не обманчиво по происхождению, только по смыслу." }
  - { kind: usage, text: "Отглагольное существительное от SPOTKAĆ, среднего рода, с обычным для таких слов набором форм на -NIE. Первое значение — назначенная встреча, собрание: SPOTKANIE BIZNESOWE, SPOTKANIE AUTORSKIE, SPOTKANIE W SPRAWIE BUDŻETU. Второе — случайная: PRZYPADKOWE SPOTKANIE. Для спортивного матча тоже годится SPOTKANIE, рядом с MECZ: SPOTKANIE LIGOWE. Родительный множественного — SPOTKAŃ, с ń на конце, как у всех слов этого класса: ZEBRANIE даёт ZEBRAŃ." }
  - { kind: pronunciation, text: "Читается «спотка́не», в три слога, с ударением на предпоследнем. Окончание -NIE звучит «не», с мягким n. Начальное sp произносится слитно. В родительном множественного SPOTKAŃ конечное ń мягкое, «спотка́нь», и это единственная форма, где слово кончается на согласный." }
  - { kind: government, text: "С кем — предлог Z с творительным: SPOTKANIE Z AUTOREM, SPOTKANIE Z KLIENTEM. По какому делу — предлог W SPRAWIE с родительным: SPOTKANIE W SPRAWIE UMOWY. Где происходит — предлог NA с предложным: NA SPOTKANIU, и это важно, потому что русский говорит «на встрече» точно так же. Куда идут — NA с винительным: IŚĆ NA SPOTKANIE. Отдельно стоит оборот WYJŚĆ KOMUŚ NA SPOTKANIE «выйти кому-то навстречу», где после NA винительный, а лицо в дательном." }
