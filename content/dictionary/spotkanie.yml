etymology: "От глагола SPOTKAĆ, а тот — от приставки S- и старого POTKAĆ, связанного с корнем, который дал TKNĄĆ «ткнуть, коснуться» и POTKNĄĆ SIĘ «споткнуться». Исходный образ — прикосновение: встретить кого-то значило коснуться его на пути, споткнуться — коснуться препятствия ногой. Отсюда и неожиданное родство слов, которые по смыслу разошлись далеко. Русский построил своё слово иначе: «встретить» идёт от корня, давшего «сретение», то есть движение навстречу. Два языка выбрали разные образы для одного события: польский — прикосновение, русский — движение друг к другу."
memory: "Отглагольное существительное от spotkać «встретить». Не путать с potknąć się «споткнуться» — хотя корень у них общий, от идеи прикосновения. На встрече — NA spotkaniu, как по-русски. Родительный множественного — spotkań, с ń."
idioms:
  - { pl: "wyjść komuś na spotkanie", ru: "выйти кому-то навстречу" }
  - { pl: "spotkanie autorskie", ru: "встреча с писателем, авторский вечер" }
