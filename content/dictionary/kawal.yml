notes:
  - { kind: false-friend, text: "ПРОЗРАЧНОГО РУССКОГО РОДСТВЕННИКА НЕТ, А ЗНАЧЕНИЙ СРАЗУ ТРИ. Kawał — это и «кусок» (kawał chleba), и «анекдот» (opowiedzieć kawał), и «розыгрыш» (zrobić komuś kawał). Русский здесь обходится тремя разными словами, и ни одно на kawał не похоже. Путь от куска к анекдоту угадывается: «хороший кусок» стал «хорошей штукой», а та — шуткой. Уменьшительное kawałek «кусочек» встречается даже чаще самого kawał." }
  - { kind: pronunciation, text: "ł звучит как короткое у: «ка́ваў». Но в предложном и звательном падеже ł переходит в обычное l и смягчается: o kawale — «о кава́ле». Это регулярное польское чередование, его же видно в stół → na stole и anioł → o aniele." }
  - { kind: usage, text: "Kawał часто значит просто «изрядный, большой»: kawał drogi «изрядный кусок пути», kawał chłopa «здоровенный мужик», kawał roboty «куча работы». В этом употреблении слово стоит перед существительным и само работает почти как прилагательное. Отсюда же kawalarz «шутник, балагур»." }
