etymology: "Прозрачного русского соответствия у слова нет: «кусок», «анекдот» и «розыгрыш» — три разных корня, и ни один с kawał не связан. Внутри польского смыслы связаны одной нитью: сперва «отрезанный кусок», затем «хорошая штука» и наконец «шутка». Отсюда kawałek «кусочек», kawalarz «шутник» и оборот kawał roboty «куча работы»."
memory: "kawał — сразу «кусок», «анекдот» и «розыгрыш»: один польский корень на три русских слова. Запомните чередование в предложном падеже: kawał, но o kawale — ł переходит в l, как в stół → na stole."
idioms:
