etymology: "От SŁUCHAĆ с суффиксом -AWKA, называющим предмет по его назначению: то, чем слушают. Корень праславянский, *sluchati, и русское «слушать» — то же слово; родственны ему «слух», «слава» и «слово», все от основы со значением «слышать, быть на слуху». Суффикс -AWKA в польском продуктивен и даёт названия приспособлений: ZAPALNICZKA, SUSZARKA, а в этом ряду и SŁUCHAWKA. Русский построил свои слова иначе: «трубку» назвал по форме, «наушники» — по месту, где их носят, а «стетоскоп» взял из греческого. Поэтому одно польское слово приходится раскладывать на три русских по контексту."
memory: "Разбирается насквозь: słuchać плюс суффикс предмета -awka, то есть «слушалка». Но покрывает три русских слова сразу: słuchawka это телефонная трубка, słuchawki во множественном — наушники, а słuchawka lekarska — головка стетоскопа. Число решает: единственное о трубке, множественное о наушниках. Падежи как у всей серии на -ka: słuchawce с меной k→c, słuchawek с беглым e. Звук: ł плюс u дают долгое «уу»."
