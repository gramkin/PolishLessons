notes:
  - { kind: false-friend, text: "Слово прозрачно по корню — SŁUCHAĆ «слушать», — но покрывает сразу три русских предмета, и это его главная особенность. SŁUCHAWKA это телефонная трубка: PODNIEŚĆ SŁUCHAWKĘ «снять трубку», ODŁOŻYĆ SŁUCHAWKĘ «положить трубку». Во множественном SŁUCHAWKI это наушники, и другого слова для них в польском нет. И третье: SŁUCHAWKA LEKARSKA это головка стетоскопа. Русский в каждом случае берёт своё слово, и подставлять их наугад нельзя: наушники никогда не «слухавки», а трубка никогда не «наушник»." }
  - { kind: usage, text: "Десять форм, женский род. Дательный и местный единственного — SŁUCHAWCE, с меной K в C перед окончанием -E; родительный множественного — SŁUCHAWEK, с беглым E. Различие значений держится на числе: единственное почти всегда о телефонной трубке или об одном наушнике, множественное — о наушниках как паре. Предлог при наушниках — W: SŁUCHAWKACH NA USZACH, W SŁUCHAWKACH. С телефоном работают глаголы PODNIEŚĆ, ODŁOŻYĆ и RZUCIĆ: RZUCIĆ SŁUCHAWKĄ значит бросить трубку в сердцах, и там творительный." }
  - { kind: pronunciation, text: "Читается «сууха́вка», три слога, ударение на втором. Буква Ł даёт «у» неслоговое, и вместе со следующим U получается долгое «уу» — звук, которого русский не ждёт. Буквосочетание CH это «х». В форме SŁUCHAWCE сочетание WC читается «вц»: «сууха́вце». В форме SŁUCHAWEK беглое E слышно отчётливо: «сууха́вэк». В форме SŁUCHAWKĄ последнее Ą даёт «он»." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Устойчивые сочетания: PODNIEŚĆ SŁUCHAWKĘ, ODŁOŻYĆ SŁUCHAWKĘ, RZUCIĆ SŁUCHAWKĄ, SŁUCHAWKI BEZPRZEWODOWE «беспроводные наушники», SŁUCHAWKI DOUSZNE «внутриканальные». В разговоре о телефоне слово держится даже там, где самой трубки давно нет: ODŁOŻYŁ SŁUCHAWKĘ говорят и о мобильном. Уменьшительное SŁUCHAWECZKA звучит шутливо. Производные того же гнезда: SŁUCHACZ «слушатель», SŁUCH «слух», POSŁUCHAĆ." }
