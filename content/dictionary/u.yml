# review
id: u
format: 2
lemma: "u"
rank: 183
pos: prep
pron: { cyr: "у" }
senses:
  - id: at
    ru: "у (у кого-либо, в чьём-либо доме) — с родительным падежом"
    examples:
      - pl: "Mieszkam u wuja."
        ru: "Я живу у дяди."
        source: { kind: tatoeba, id: 665855 }
      - pl: "Możesz zatrzymać się u mnie."
        ru: "Можешь остановиться у меня."
        source: { kind: tatoeba, id: 10747440 }
      - pl: "U nas właściwie nic nowego."
        ru: "У нас вроде ничего нового."
        source: { kind: tatoeba, id: 12470145 }
  - id: by
    ru: "у (возле); у кого узнать, спросить"
    examples:
      - pl: "Hannibal u bram!"
        ru: "Ганнибал у ворот!"
        source: { kind: tatoeba, id: 2905791 }
      - pl: "U kogo się strzygłeś?"
        ru: "У кого ты подстригся?"
        source: { kind: tatoeba, id: 531984 }
      - pl: "Sprawdźcie u Tomka."
        ru: "Проверьте у Тома."
        source: { kind: tatoeba, id: 3460730 }
notes:
  - { kind: government, text: "u требует родительного падежа — как русское «у»: u lekarza, u mnie, u siebie." }
  - { kind: false-friend, text: "Русское «у меня есть» не переводится через u: говорят mam samochód «у меня есть машина», а не «u mnie jest»." }
  - { kind: usage, text: "u diabła и u licha — раздражённое «какого чёрта»; być u siebie — «быть у себя дома»." }
collocations:
  - { pl: "u lekarza", ru: "у врача" }
  - { pl: "u siebie", ru: "у себя" }
  - { pl: "u nas", ru: "у нас" }
  - { pl: "u kogo?", ru: "у кого?" }
etymology: "Праславянское *u — то же слово, что русское «у»; совпадает и падеж, и значение."
memory: "u + родительный, как русское «у»: u lekarza «у врача». Но «у меня есть» — это mam, а не «u mnie jest»: главная ловушка для русскоговорящих."
idioms:
  - { pl: "u diabła", ru: "какого чёрта" }
  - { pl: "u licha", ru: "чёрт побери" }
  - { pl: "czuć się jak u siebie", ru: "чувствовать себя как дома" }
formExamples:
