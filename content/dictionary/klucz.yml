id: klucz
format: 2
lemma: "klucz"
rank: 648
pos: noun
pron: { cyr: "ключ" }
senses:
  - id: key
    ru: "ключ от замка"
    examples:
      - pl: "Zgubiłem klucz."
        ru: "Я потерял ключ."
        source: { kind: tatoeba, id: 352711 }
      - pl: "Znalazłem klucz."
        ru: "Я нашёл ключ."
        source: { kind: tatoeba, id: 6696774 }
      - pl: "Jak wszedłeś? Masz klucz?"
        ru: "Как ты вошёл? У тебя есть ключ?"
        source: { kind: tatoeba, id: 1515230 }
  - id: clue
    ru: "ключ к разгадке; шифр"
    examples:
      - pl: "Wątpić jest kluczem do wiedzy."
        ru: "Сомневаться — ключ к знанию."
        source: { kind: translated, id: 5014638 }
      - pl: "Oczywiste jest, że wysiłek jest kluczem do sukcesu."
        ru: "Очевидно, что усилие — ключ к успеху."
        source: { kind: translated, id: 765598 }
      - pl: "Zgrzyt klucza w zamku zdradził wszystko."
        ru: "Скрип ключа в замке всё выдал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Праславянское *ključь; русский «ключ» — то же слово и с тем же набором значений: от замка, к разгадке, скрипичный." }
  - { kind: usage, text: "pod kluczem — «под замком, взаперти»: trzymać coś pod kluczem." }
  - { kind: usage, text: "Есть и значение, которого в русском нет: klucz — это ещё «клин» летящих птиц, klucz żurawi «клин журавлей»." }
  - { kind: usage, text: "klucz do sukcesu — «ключ к успеху», с предлогом do и родительным падежом." }
collocations:
  - { pl: "zgubić klucz", ru: "потерять ключ" }
  - { pl: "pod kluczem", ru: "под замком" }
  - { pl: "klucz do sukcesu", ru: "ключ к успеху" }
  - { pl: "klucz żurawi", ru: "клин журавлей" }
etymology: "Праславянское *ključь; русский «ключ» — то же самое слово, и набор значений совпадает: от замка, к разгадке, скрипичный."
memory: "klucz — «ключ», то же слово, что русское, и значения совпадают: и от замка, и к разгадке. Запомните pod kluczem «под замком». А одно значение русскому незнакомо: klucz żurawi — это «клин журавлей»."
idioms:
  - { pl: "pod kluczem", ru: "под замком" }
  - { pl: "klucz do sukcesu", ru: "ключ к успеху" }
  - { pl: "klucz żurawi", ru: "клин журавлей" }
