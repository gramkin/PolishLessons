# review
id: czesc
format: 2
lemma: "cześć"
rank: 153
pos: noun
pron: { cyr: "чэсьць" }
senses:
  - id: greeting
    ru: "привет; пока (неформальное приветствие и прощание)"
    note: "Одно слово и при встрече, и при расставании — как русское «привет» и «пока» вместе."
    examples:
      - pl: "Cześć."
        ru: "Привет!"
        source: { kind: tatoeba, id: 405641 }
      - pl: "Cześć, Tom."
        ru: "Привет, Том."
        source: { kind: tatoeba, id: 350100 }
      - pl: "Cześć! Jak się masz?"
        ru: "Привет! Как дела?"
        source: { kind: tatoeba, id: 5379472 }
  - id: honour
    ru: "честь, почитание (ku czci — в честь)"
    examples:
      - pl: "Zrobili to ku czci poległych."
        ru: "Они сделали это в честь погибших."
        source: { kind: authored }
      - pl: "To sprawa czci."
        ru: "Это дело чести."
        source: { kind: authored }
      - pl: "Mówił o nim z czcią."
        ru: "Он говорил о нём с почтением."
        source: { kind: authored }
notes:
  - { kind: register, text: "cześć говорят ровесникам и знакомым. Старшему или незнакомому — dzień dobry при встрече и do widzenia при прощании." }
  - { kind: usage, text: "В значении приветствия слово не склоняется. Падежные формы (czci, czcią) принадлежат существительному cześć «честь»: ku czci «в честь»." }
  - { kind: false-friend, text: "Не путайте с русским «часть»: «часть» по-польски część (с ę), а cześć — это «привет» и «честь»." }
collocations:
  - { pl: "cześć!", ru: "привет!" }
  - { pl: "ku czci", ru: "в честь" }
  - { pl: "oddać cześć", ru: "воздать почести" }
  - { pl: "na cześć", ru: "в честь" }
etymology: "Праславянское *čьstь «почитание» — то же слово, что русское «честь». Приветствие возникло из пожелания чести собеседнику."
memory: "cześć — и «привет», и «пока», но только со своими. Незнакомому: dzień dobry и do widzenia. И осторожно с русским «часть»: это część, через ę."
idioms:
  - { pl: "cześć i chwała", ru: "честь и слава" }
  - { pl: "ku czci", ru: "в честь" }
  - { pl: "człowiek bez czci i wiary", ru: "человек без стыда и совести" }
formExamplesSkip:
