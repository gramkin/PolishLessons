notes:
  - { kind: pronunciation, text: "Читается «муо́тэк», два слога, ударение на первом. Ł звучит как короткое «у». Здесь работает полногласие: польское MŁO- отвечает русскому «моло-»: MŁOT — «молот», MŁÓCIĆ — «молотить», как GŁOWA и «голова», MŁODY и «молодой»." }
  - { kind: usage, text: "Одиннадцать форм в таблице, мужской род. Беглое E: MŁOTEK, но MŁOTKA. В винительном две формы, MŁOTEK и разговорная MŁOTKA: WZIĄĆ MŁOTKA, как ZJEŚĆ BANANA. Личная форма множественного числа MŁOTKOWIE к инструменту не относится." }
  - { kind: government, text: "Ударить молотком — UDERZYĆ MŁOTKIEM, творительный без предлога. Пойти с молотка — IŚĆ POD MŁOTEK, POD с винительным: буквально «пойти под молоток»." }
  - { kind: register, text: "Слово бытовое. IŚĆ POD MŁOTEK говорят о распродаже имущества с аукциона, как наше «пойти с молотка», только поляк идёт «под» молоток. Большой молот — MŁOT." }
collocations:
  - { pl: "uderzyć młotkiem", ru: "ударить молотком" }
  - { pl: "młotek i gwoździe", ru: "молоток и гвозди" }
  - { pl: "trzonek młotka", ru: "ручка молотка" }
family:
  - { pl: "młot", ru: "молот, кувалда", relation: root }
  - { pl: "młócić", ru: "молотить", relation: root }
  - { pl: "młockarnia", ru: "молотилка", relation: derived }
etymology: "Слово праславянское, общее с русским «молот». MŁOTEK — уменьшительное от MŁOT, как русский «молоток» от «молота». Различие только в полногласии: польский стянул «оло» в ŁO."
memory: "Młotek — «молоток»: mło- отвечает русскому «моло-», как młody и «молодой». Читается «муо́тэк». Iść pod młotek — пойти с молотка. Młot — молот, młócić — молотить."
idioms:
  - { pl: "iść pod młotek", ru: "пойти с молотка" }
