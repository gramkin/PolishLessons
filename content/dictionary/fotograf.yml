# review
id: fotograf
format: 2
lemma: "fotograf"
rank: 4295
pos: noun
pron: { cyr: "фото́граф" }
senses:
  - id: photographer
    ru: "фотограф"
    examples:
      - pl: "Fotograf ustawił światło."
        ru: "Фотограф выставил свет."
        source: { kind: authored }
      - pl: "Zatrudnili fotografa na chrzciny."
        ru: "Они наняли фотографа на крестины."
        source: { kind: authored }
      - pl: "Pracuje jako fotograf w gazecie."
        ru: "Он работает фотографом в газете."
        source: { kind: authored }
      - pl: "Ten fotograf robi piękne portrety."
        ru: "Этот фотограф делает прекрасные портреты."
        source: { kind: authored }
      - pl: "Fotografowie stali przed wejściem."
        ru: "Фотографы стояли у входа."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "FOTOGRAF — «фотограф», перевод прямой. Ловушка в формах: FOTOGRAFIE — это и местный падеж «о фотографе», и множественное от FOTOGRAFIA «фотография». Сам снимок в разговоре — ZDJĘCIE." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Личное множественное — FOTOGRAFOWIE, как PROFESOROWIE. Местный и звательный — FOTOGRAFIE: F перед IE смягчается." }
  - { kind: government, text: "Позировать фотографу — POZOWAĆ FOTOGRAFOWI, дательный. Фотосессия у фотографа — SESJA U FOTOGRAFA. Нанять фотографа — WYNAJĄĆ FOTOGRAFA." }
  - { kind: pronunciation, text: "Читается «фото́граф», ударение на предпоследнем слоге — здесь польское правило совпадает с русским. Конечное F глухое." }
collocations:
  - { pl: "fotograf ślubny", ru: "свадебный фотограф" }
  - { pl: "wynająć fotografa", ru: "нанять фотографа" }
  - { pl: "fotograf przyrody", ru: "фотограф дикой природы" }
family:
  - { pl: "fotografia", ru: "фотография", relation: root }
  - { pl: "fotografować", ru: "фотографировать", relation: derived }
  - { pl: "fotograficzny", ru: "фотографический", relation: derived }
etymology: "Из греческих слов «свет» и «писать»: тот, кто пишет светом. Русское «фотограф» — то же слово."
memory: "Fotograf — фотограф; fotografowie — фотографы. Читается «фото́граф». Fotografia — фотография, zdjęcie — снимок. O fotografie — о фотографе."
idioms:
  - { pl: "patrzeć w obiektyw", ru: "смотреть в объектив" }
