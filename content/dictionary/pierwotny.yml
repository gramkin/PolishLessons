notes:
  - { kind: false-friend, text: "PIERWOTNY не «первый»: первый — PIERWSZY. PIERWOTNY — «первоначальный»: PIERWOTNY PLAN, PIERWOTNA CENA, «первоначальная цена». О доисторическом — «первобытный»: CZŁOWIEK PIERWOTNY, PUSZCZA PIERWOTNA. Русское «первичный» в медицине и экономике тоже PIERWOTNY: PIERWOTNE OGNISKO CHOROBY, RYNEK PIERWOTNY — «первичный рынок» жилья." }
  - { kind: usage, text: "Полная парадигма с живыми степенями: PIERWOTNIEJSZY, NAJPIERWOTNIEJSZY — «более древний, самый исходный» о версии текста или о чувстве. Формы для мужчин-людей: LUDZIE PIERWOTNI, PIERWOTNI MIESZKAŃCY, «коренные жители». Наречие — PIERWOTNIE, «первоначально»: PIERWOTNIE MIAŁO BYĆ INACZEJ." }
  - { kind: government, text: "Чаще стоит перед существительным: PIERWOTNY ZAMIAR. После существительного — в устойчивых терминах: LAS PIERWOTNY, CZŁOWIEK PIERWOTNY, LUDY PIERWOTNE. Сравнение: PIERWOTNIEJSZY OD, «древнее, чем»." }
  - { kind: pronunciation, text: "Читается «перво́тны», ударение на втором слоге. IE после P — мягкое «пе», R твёрдое, W перед гласной звонкое. Наречие PIERWOTNIE — «перво́тне»." }
  - { kind: register, text: "Нейтральное слово, частое в истории, биологии, праве и рекламе недвижимости: RYNEK PIERWOTNY — новостройки, RYNEK WTÓRNY — вторичка. В быту «первоначально» чаще говорят NA POCZĄTKU или NAJPIERW." }
collocations:
