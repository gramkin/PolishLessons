etymology: "От старопольского PIERWY «первый», того же корня, что PIERWSZY и русское «первый», с суффиксом -OTNY, как в SAMOTNY «одинокий». Буквальный смысл — «относящийся к самому началу»."
memory: "Pierwotny — первоначальный, первобытный. Pierwotny plan, człowiek pierwotny, rynek pierwotny. Не путать с pierwszy — первый. Читается «перво́тны»."
