# review
id: dziwic
format: 2
lemma: "dziwić"
rank: 2399
pos: verb
pron: { cyr: "дзі́віць" }
senses:
  - id: surprise-someone
    ru: "удивлять"
    examples:
      - pl: "Dziwi mnie jego spokój."
        ru: "Меня удивляет его спокойствие."
        source: { kind: authored }
      - pl: "Taka odpowiedź nikogo nie dziwiła."
        ru: "Такой ответ никого не удивлял."
        source: { kind: authored }
  - id: be-surprised
    ru: "dziwić się — удивляться (+ дат.)"
    examples:
      - pl: "Dziwię się tobie, nie jemu."
        ru: "Я удивляюсь тебе, а не ему."
        source: { kind: authored }
      - pl: "Nie dziwili się niczemu."
        ru: "Они ничему не удивлялись."
        source: { kind: authored }
  - id: wonder
    ru: "удивление (отглаг.)"
    examples:
      - pl: "Dziwienie się wszystkiemu to cecha dzieci."
        ru: "Удивляться всему — черта детей."
        source: { kind: authored }
notes:
  - { kind: government, text: "ТУТ УПРАВЛЕНИЕ СОВПАДАЕТ С РУССКИМ, И ЭТО РЕДКОСТЬ. DZIWIĆ SIĘ требует ДАТЕЛЬНОГО: dziwię się tobie, dziwię się tej decyzji — ровно как «удивляюсь тебе, этому решению». А без się глагол переходный и берёт винительный: to mnie dziwi «это меня удивляет». Сравни с podziwiać, которое требует винительного там, где русский берёт творительный." }
  - { kind: false-friend, text: "КОРЕНЬ DZIW- РАЗОШЁЛСЯ С РУССКИМ «ДИВ-» ПО ОЦЕНКЕ. Польское DZIWNY значит «странный», часто с неодобрением, а русское «дивный» — «прекрасный». Отсюда и разница глаголов: dziwić się это «удивляться», а восхищаться — PODZIWIAĆ. Три слова одного корня, три разных смысла." }
  - { kind: usage, text: "Вид несовершенный: есть DZIWIĄC и причастие DZIWIĄCY, деепричастия на -wszy нет, совершенная пара — ZDZIWIĆ. И одна тонкость: в живой речи «удивлённый» передаётся формой ZDZIWIONY, от совершенного вида, а правильное dziwiony звучит книжно. Запомни ещё оборот nie dziw, że — «не удивительно, что»." }
collocations:
  - { pl: "dziwić się komuś", ru: "удивляться кому-л." }
  - { pl: "to mnie dziwi", ru: "это меня удивляет" }
  - { pl: "nie dziw, że", ru: "не удивительно, что" }
family:
  - { pl: "zdziwić", ru: "удивить (сов.)", relation: aspect }
  - { pl: "podziwiać", ru: "восхищаться", relation: root, id: podziwiac }
  - { pl: "dziwny", ru: "странный", relation: derived, id: dziwny }
etymology: "От dziw «диво, чудо», из праславянского *divъ, того же корня, что русские «диво», «дивиться» и «удивить». Польский вывел из него и dziwny «странный», и podziw «восхищение», так что одно гнездо дало и упрёк, и восторг. Отсюда же dziwak «чудак»."
memory: "dziwić się — «удивляться», и падеж тот же, что по-русски: дательный, dziwię się TOBIE. Без się это «удивлять» с винительным. А dziwny значит «странный», не «дивный», и восхищаться — это podziwiać."
idioms:
  - { pl: "nie dziw, że", ru: "не удивительно, что" }
  - { pl: "dziwić się własnym oczom", ru: "не верить своим глазам" }
