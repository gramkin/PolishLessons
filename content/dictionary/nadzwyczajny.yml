etymology: "От ZWYCZAJNY «обычный» с приставкой NAD- «сверх», а ZWYCZAJNY от ZWYCZAJ «обычай», от праславянского корня, давшего русские «обычай», «обычный» и «привычка». Калькирована при этом латынь: EXTRAORDINARIUS, то есть «сверх порядка», откуда и русское «чрезвычайный», и польское NADZWYCZAJNY. Из латинского же противопоставления ORDINARIUS и EXTRAORDINARIUS пришла в польские университеты та перевёрнутая на русский взгляд иерархия профессорских званий."
memory: "Разбирается на части: nad плюс zwyczajny «обычный», от zwyczaj «обычай», корень общий с русским. Значит «чрезвычайный» и «необыкновенный», переводится прямо. Но запомните перевёрнутую иерархию: profesor zwyczajny выше, чем profesor nadzwyczajny, потому что за этим стоит латинское ordinarius против extraordinarius, штатный против сверхштатного. Читается «надзвыча́йны», d и z сливаются в слитное «дз»."
idioms:
