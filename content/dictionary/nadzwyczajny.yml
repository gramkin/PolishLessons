notes:
  - { kind: false-friend, text: "Слово разбирается на части: NAD плюс ZWYCZAJNY «обычный», то есть буквально «сверхобычный». ZWYCZAJ это «обычай», корень общий с русским. Русское «чрезвычайный» собрано иначе, но по той же мысли: сверх обычного. Переводятся они друг в друга почти всегда. Коварна тут не семантика, а одна академическая деталь, о которой ниже: в польских учёных званиях приставка NAD- означает не повышение, а понижение." }
  - { kind: usage, text: "Одиннадцать форм. Мужско-личная форма множественного числа NADZWYCZAJNI живая: PROFESOROWIE NADZWYCZAJNI, NADZWYCZAJNI WYSŁANNICY. И вот обещанная ловушка: в польской academia PROFESOR ZWYCZAJNY стоит ВЫШЕ, чем PROFESOR NADZWYCZAJNY, хотя приставка подсказывает обратное. Дело в латыни: ORDINARIUS это профессор, занимающий штатную кафедру, а EXTRAORDINARIUS — сверхштатный, то есть младший." }
  - { kind: government, text: "Ввести чрезвычайное положение — WPROWADZIĆ STAN NADZWYCZAJNY, винительный без предлога. В чрезвычайном порядке — W TRYBIE NADZWYCZAJNYM, предлог W с местным падежом. Созвать чрезвычайное заседание — ZWOŁAĆ POSIEDZENIE NADZWYCZAJNE, винительный. Во втором значении прилагательное управляет родительным через существительное: CZŁOWIEK NADZWYCZAJNEJ ODWAGI «человек необыкновенной отваги»." }
  - { kind: pronunciation, text: "Читается «надзвыча́йны», четыре слога, ударение на предпоследнем. На стыке приставки и корня D и Z сливаются в слитное «дз», поэтому начало звучит «надз», а не «над-з» в два приёма. Дальше идёт «вы» с твёрдым «ы», потом CZ даёт «ч», и AJ даёт «ай». Самое трудное здесь — не разорвать «дз» и не смягчить «вы»." }
  - { kind: register, text: "Слово официальное и частое в языке права и политики: STAN NADZWYCZAJNY «чрезвычайное положение», POSIEDZENIE NADZWYCZAJNE, SESJA NADZWYCZAJNA, ŚRODKI NADZWYCZAJNE «чрезвычайные меры», KOMISJA NADZWYCZAJNA. В дипломатии закреплён полный титул AMBASADOR NADZWYCZAJNY I PEŁNOMOCNY «чрезвычайный и полномочный посол». Во втором значении, о человеке или впечатлении, слово звучит книжно и приподнято." }
