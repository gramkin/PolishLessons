notes:
  - { kind: false-friend, text: "KOKTAJL — «коктейль», но пишется с J: KOKTAJL. Очень часто так называют безалкогольный смузи или молочный коктейль: KOKTAJL OWOCOWY, KOKTAJL MLECZNY. Коктейль Молотова — KOKTAJL MOŁOTOWA." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — KOKTAJLU, родительный множественного — KOKTAJLI. Окончание -E во множественном: KOKTAJLE." }
  - { kind: government, text: "Коктейль из чего — KOKTAJL Z и родительный: KOKTAJL Z TRUSKAWEK. Коктейль с чем — KOKTAJL Z и творительный: KOKTAJL Z RUMEM." }
  - { kind: pronunciation, text: "Читается «ко́ктайль»: AJ — «ай», ударение на первом слоге." }
collocations:
