      - pl: "Babcia pochyliła się, żeby podnieść klucze."
        ru: "Бабушка нагнулась, чтобы поднять ключи."
        source: { kind: authored }
  - id: consider
    ru: "pochylić się nad czymś — вникнуть, заняться (вопросом)"
    examples:
      - pl: "Sąd pochyli się nad tą sprawą."
        ru: "Суд рассмотрит это дело."
        source: { kind: authored }
      - pl: "Posłowie pochylili się nad nową ustawą."
        ru: "Депутаты взялись за новый закон."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — POCHYLAĆ. Формы настоящего времени значат будущее: POCHYLĘ «наклоню», POCHYLI SIĘ «наклонится». Чаще всего глагол стоит с SIĘ: POCHYLIĆ SIĘ «нагнуться»." }
  - { kind: government, text: "Что — винительный: POCHYLIĆ GŁOWĘ. Над чем — NAD с творительным: POCHYLIĆ SIĘ NAD DZIECKIEM. В переносном смысле POCHYLIĆ SIĘ NAD PROBLEMEM — «вникнуть в проблему, заняться ею»; так часто говорят о властях и учреждениях." }
  - { kind: false-friend, text: "Корень тот же, что в русском диалектном «хилиться» «клониться», но русское «хилый» значит «слабый», а польское POCHYŁY — «наклонный»: POCHYŁA WIEŻA «наклонная башня»." }
  - { kind: pronunciation, text: "Читается «похы́лиць»: CH — «х», Y — «ы», L перед I мягкое. Ударение на предпоследнем слоге: POCHYLIŁ — «похы́лиу»." }
collocations:
  - { pl: "pochylić głowę", ru: "наклонить, склонить голову" }
  - { pl: "pochylić się nad kimś", ru: "склониться над кем-то" }
  - { pl: "pochylić się nad problemem", ru: "вникнуть в проблему" }
family:
  - { pl: "pochylać", ru: "наклонять", relation: aspect }
  - { pl: "chylić", ru: "клонить, склонять", relation: root }
  - { pl: "pochyły", ru: "наклонный", relation: derived }
  - { pl: "pochylenie", ru: "наклон", relation: derived }
synonyms: ["nachylić", "schylić", "zgiąć"]
etymology: "Приставка PO- и CHYLIĆ «клонить», праславянское *xyliti «наклонять»; ср. русское диалектное «хилить» «клонить»."
memory: "Pochylić — по-хилить: старик ходит pochylony, а чиновник «склоняется» над проблемой — pochyla się nad nią."
idioms:
