# review
id: pochylic
format: 2
lemma: "pochylić"
rank: 6022
pos: verb
aspect: perf
pron: { cyr: "похы́лиць" }
senses:
  - id: tilt
    ru: "наклонить, нагнуть, склонить"
    examples:
      - pl: "Pochylił głowę na znak zgody."
