notes:
  - { kind: false-friend, text: "Единственный месяц в польском календаре, чьё имя не славянское: MARZEC идёт от латинского MARTIUS, по имени Марса. Поэтому здесь поляк и русский говорят, по сути, одно слово, в отличие от KWIECIEŃ, CZERWIEC и LISTOPAD. Украинский и тут пошёл своим путём и назвал месяц «березнем», по берёзе. Обманчиво только написание: в именительном стоит RZ, а в косвенных падежах оно превращается в простое R, MARZEC, но MARCA." }
  - { kind: usage, text: "Десять форм, мужской род. Работают сразу две перемены: беглое E исчезает, как во всех месяцах этого типа, и RZ чередуется с R. MARZEC, но MARCA, MARCOWI, MARCEM, MARCU. Форма MARCE это именительный множественного числа, как CZERWCE у июня и KOŃCE у слова KONIEC, а вовсе не звательный: у неодушевлённых существительных звательного на -CZE не бывает, его имеют только одушевлённые, KUPIEC — KUPCZE." }
  - { kind: government, text: "В каком месяце — предлог W с местным падежом: W MARCU «в марте». До и от — DO и OD с родительным: DO MARCA, OD MARCA. Дата идёт родительным без предлога: ÓSMEGO MARCA «восьмого марта», день, который в Польше тоже отмечают. В конце марта — POD KONIEC MARCA, предлог POD с родительным." }
  - { kind: pronunciation, text: "Самое интересное в этом слове. В именительном RZ даёт «ж», и MARZEC звучит «ма́жец», безо всякого «р». А в косвенных падежах, где RZ превращается в R, звук возвращается: MARCA это «ма́рца», MARCU это «ма́рцу». Получается, что «р» то пропадает, то появляется, и услышав «ма́жец» и «ма́рца», легко не узнать в них одно слово. Ударение везде на первом слоге." }
  - { kind: register, text: "Слово нейтральное и ежедневное: W MARCU, POCZĄTEK MARCA, MARCOWY WIATR. Восьмого марта в Польше отмечают DZIEŃ KOBIET. Из истории сюда относится MARZEC 1968, студенческие протесты и последовавшая антисемитская кампания, после которой многие были вынуждены уехать. Поговорка W MARCU JAK W GARNCU, буквально «в марте как в горшке», описывает переменчивую мартовскую погоду." }
