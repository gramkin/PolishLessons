etymology: "Из латинского MARTIUS, месяца, посвящённого Марсу: у римлян он открывал год и начинал пору походов. Русский взял то же слово тем же путём, через греческое и церковнославянское посредство, поэтому «март» и MARZEC родственники напрямую. Это единственный случай в польском календаре, где славянского имени не сохранилось: остальные одиннадцать месяцев названы по работе или погоде. Украинское «березень», от берёзы, показывает, каким могло бы быть и польское имя."
memory: "Единственный месяц с латинским именем: marzec от Martius, по Марсу, и потому он прямой родственник русского «марта». Остальные одиннадцать названы по-славянски. Главная ловушка в звучании: rz даёт «ж», поэтому marzec это «ма́жец», но в косвенных падежах rz переходит в r, и marca звучит «ма́рца». Форма marce это множественное число, а не звательный. Поговорка: w marcu jak w garncu."
idioms:
  - { pl: "w marcu jak w garncu", ru: "в марте погода переменчива, как варево в горшке" }
