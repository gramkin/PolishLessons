# review
id: rurka
format: 2
lemma: "rurka"
rank: 5091
pos: noun
pron: { cyr: "ру́рка" }
senses:
  - id: tube
    ru: "трубочка, трубка"
    examples:
      - pl: "Pił sok przez rurkę."
        ru: "Он пил сок через трубочку."
        source: { kind: authored }
      - pl: "Rurka od odkurzacza się zatkała."
        ru: "Трубка пылесоса засорилась."
        source: { kind: authored }
      - pl: "Pacjent oddycha przez rurkę."
        ru: "Пациент дышит через трубку."
        source: { kind: authored }
  - id: pastry
    ru: "трубочка с кремом (пирожное)"
    examples:
      - pl: "Kupiłam dwie rurki z kremem."
        ru: "Я купила две трубочки с кремом."
        source: { kind: authored }
      - pl: "Rurki z bitą śmietaną to jego ulubiony deser."
        ru: "Трубочки со взбитыми сливками — его любимый десерт."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "RURKA — «трубочка», от RURA «труба», — и для напитков, и в технике, и в медицине. Отдельное лакомство — RURKA Z KREMEM, «трубочка с кремом». Музыкальная «труба» — не RURA, а TRĄBKA. А RUROCIĄG, буквально «трубовод», — трубопровод." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В дательном и местном падежах K переходит в C: W RURCE. В родительном множественного беглое E: RUREK. Звательная форма не нужна." }
  - { kind: government, text: "Пить через трубочку — PIĆ PRZEZ RURKĘ, PRZEZ с винительным. Трубочка для чего-то — RURKA DO CZEGOŚ: RURKA DO NAPOJÓW. В трубке — W RURCE, местный." }
  - { kind: pronunciation, text: "Читается «ру́рка», два слога, ударение на первом, как RURA «ру́ра». В форме RURCE: «ру́рце»." }
collocations:
  - { pl: "plastikowa rurka", ru: "пластиковая трубочка" }
  - { pl: "rurka do napojów", ru: "трубочка для напитков" }
  - { pl: "pić przez rurkę", ru: "пить через трубочку" }
family:
  - { pl: "rura", ru: "труба", relation: root, id: rura }
  - { pl: "rurociąg", ru: "трубопровод", relation: derived }
  - { pl: "rurowy", ru: "трубный", relation: derived }
etymology: "От RURA «труба», заимствованной из немецкого слова того же значения. Русскому «труба» она не родственна, поэтому запоминается через семью: RURA, RURKA, RUROCIĄG."
memory: "Rurka — трубочка: pić przez rurkę. Читается «ру́рка». Rurka z kremem — трубочка с кремом. Rura — труба, rurociąg — трубопровод. Музыкальная труба — trąbka."
idioms:
  - { pl: "rurka z kremem", ru: "трубочка с кремом" }
  - { pl: "zwinąć się w rurkę", ru: "свернуться трубочкой" }
formExamplesSkip:
