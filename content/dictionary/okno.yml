# review
id: okno
format: 2
lemma: "okno"
rank: 843
pos: noun
pron: { cyr: "о́кно" }
senses:
  - id: window
    ru: "окно"
    examples:
      - pl: "To jest okno."
        ru: "Это окно."
        source: { kind: tatoeba, id: 12824950 }
      - pl: "Tom zepsuł okno."
        ru: "Том разбил окно."
        source: { kind: tatoeba, id: 569973 }
      - pl: "Muszę otworzyć okno."
        ru: "Я должен открыть окно."
        source: { kind: tatoeba, id: 589685 }
  - id: through
    ru: "oknem — через окно, в окно (творительный пути)"
    note: "Творительный падеж без предлога обозначает путь: «через окно»."
    examples:
      - pl: "Wszedł oknem."
        ru: "Он вошёл через окно."
        source: { kind: translated, id: 412948 }
      - pl: "Wyglądał oknem."
        ru: "Он выглядывал в окно."
        source: { kind: translated, id: 856148 }
      - pl: "Wyskoczył oknem."
        ru: "Он выпрыгнул в окно."
        source: { kind: translated, id: 350054 }
  - id: at-window
    ru: "w oknie, przy oknie — в окне, у окна"
    examples:
      - pl: "Książka jest na stole, a ołówek leży na oknie."
        ru: "Книга — на столе, а карандаш лежит на окне."
        source: { kind: tatoeba, id: 1716726 }
      - pl: "Był to bardzo długi, wąski pokój o jednym oknie."
        ru: "Это была очень длинная, узкая комната с одним окном."
        source: { kind: tatoeba, id: 11318581 }
      - pl: "Przy oknie czy przejściu?"
        ru: "У окна или у прохода?"
        source: { kind: translated, id: 6067363 }
notes:
  - { kind: government, text: "Творительный падеж без предлога значит «через окно»: wejść oknem «войти через окно», wyskoczyć oknem «выпрыгнуть в окно». Русский тут требует предлога, а польский — нет." }
  - { kind: usage, text: "w oknie — «в окне» (то, что в проёме), przy oknie — «у окна» (рядом). В самолёте и поезде спрашивают: przy oknie czy przejściu?" }
  - { kind: usage, text: "Уменьшительное — okienko, и им же называют окошко в кассе или в учреждении: Podejdź do okienka." }
  - { kind: usage, text: "okno na świat — «окно в мир», устойчивый образ; wyrzucać pieniądze przez okno — «сорить деньгами»." }
collocations:
  - { pl: "otworzyć okno", ru: "открыть окно" }
  - { pl: "przy oknie", ru: "у окна" }
  - { pl: "wyjrzeć przez okno", ru: "выглянуть в окно" }
  - { pl: "okno na świat", ru: "окно в мир" }
family:
  - { pl: "oko", ru: "глаз", relation: root }
  - { pl: "okienko", ru: "окошко", relation: derived }
  - { pl: "okiennica", ru: "ставня", relation: derived }
  - { pl: "parapet", ru: "подоконник", relation: derived }
etymology: "От oko «глаз»: окно — «глаз» дома. Русское «окно» сделано ровно так же, от «око», так что слова совпадают и по форме, и по логике."
memory: "okno — «окно», и внутри него сидит oko «глаз», в точности как в русском «окно» от «око». Запомните творительный без предлога: wejść oknem «войти через окно», wyskoczyć oknem «выпрыгнуть в окно». И различайте w oknie «в окне» и przy oknie «у окна»."
idioms:
  - { pl: "okno na świat", ru: "окно в мир" }
  - { pl: "wyrzucać pieniądze przez okno", ru: "сорить деньгами" }
  - { pl: "przy oknie czy przejściu?", ru: "у окна или у прохода?" }
