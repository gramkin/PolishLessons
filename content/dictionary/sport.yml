etymology: "Из английского sport, сокращения от disport «развлечение», восходящего через старофранцузское desporter к латинскому portare «носить»: буквально «отвлечься, унестись от забот». То же слово дало русский «спорт». Корень port- виден в «транспорте» и «портале»."
memory: "sport — «спорт», но глагол другой: UPRAWIAĆ SPORT, с винительным, а не «заниматься спортом» с творительным. Родительный двойной: нормативное sportu и разговорное sporta, по одушевлённому образцу, как modela у model."
