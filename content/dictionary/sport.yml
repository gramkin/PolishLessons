notes:
  - { kind: government, text: "ГЛАГОЛ ТРЕБУЕТ ВИНИТЕЛЬНОГО, А НЕ ТВОРИТЕЛЬНОГО. По-польски UPRAWIAĆ SPORT, винительный падеж: uprawiam sport, uprawia pływanie. Русский говорит «заниматься спортом», с творительным. Дословный перевод с русского даёт ошибку в падеже, поэтому оборот надо брать целиком." }
  - { kind: usage, text: "РОДИТЕЛЬНЫЙ ЕДИНСТВЕННОГО ДВОЙНОЙ, И ЗА ЭТИМ СТОИТ ОДУШЕВЛЁННОСТЬ. Нормативная форма — SPORTU, как у неодушевлённых. Но словарь PoliMorf отмечает и SPORTA, с пометой одушевлённости, а при ней винительный совпадает с родительным. Это тот же механизм, что у model: modelu о предмете, modela о человеке. Sporta звучит разговорно, в письме держись sportu." }
  - { kind: pronunciation, text: "Один слог: спорт. Конечное rt произносится слитно и глухо: «спорт». Предложный sporcie звучит «спо́рце», с переходом t в мягкое ц." }
