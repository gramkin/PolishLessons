# review
id: ekstra
format: 2
lemma: "ekstra"
rank: 3087
pos: adj
pron: { cyr: "э́кстра" }
senses:
  - id: additional
    ru: "дополнительный, сверх обычного"
    examples:
      - pl: "Dostał ekstra premię za grudzień."
        ru: "Он получил дополнительную премию за декабрь."
        source: { kind: authored }
      - pl: "Za bagaż trzeba dopłacić ekstra."
        ru: "За багаж надо доплатить дополнительно."
        source: { kind: authored }
      - pl: "Ekstra godziny rozliczano osobno."
        ru: "Дополнительные часы считали отдельно."
        source: { kind: authored }
  - id: great
    ru: "в разговоре: отличный, классный"
    examples:
      - pl: "Film był ekstra, obejrzałbym drugi raz."
        ru: "Фильм был классный, посмотрел бы второй раз."
        source: { kind: authored }
      - pl: "Ekstra! Właśnie na to czekałem."
        ru: "Классно! Как раз этого я и ждал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово не склоняется вовсе — одна форма на все случаи, — и это для польского редкость, которую стоит отметить. Польский обычно заставляет заимствования склоняться: KINO получило полную парадигму, SEJF и DYSK тоже. EKSTRA осталось неизменяемым, потому что вошло в язык не как существительное, а как определение и наречие сразу: EKSTRA PREMIA, DOPŁACIĆ EKSTRA, GODZINY EKSTRA. Поэтому формы EKSTRY или EKSTRĄ не существуют, и искать их не нужно." }
  - { kind: register, text: "Второе значение разговорное и очень живое: EKSTRA! как отдельная реплика значит «классно, здорово», и так говорят в основном молодые. В этом значении русское «экстра» не употребляется совсем — там нужно «классно», «отлично», «супер». Русское «экстра» осталось только при сортах и качестве: «мука экстра», «водка экстра». Польское слово это значение тоже имеет, в товарной маркировке, но в живой речи оно уступило место похвале. Нейтральные замены для первого значения — DODATKOWY «дополнительный» и NADPROGRAMOWY." }
  - { kind: pronunciation, text: "Читается «э́кстра», ударение на первом слоге из двух. Начальное E даёт «э», сочетание KS произносится слитно, как в русском «экстра», и разницы в звучании между языками почти нет. Разница только в употреблении и в неизменяемости. Поскольку слово не склоняется, ударение никуда не переезжает, и это единственная польская единица в этой партии, с которой не нужно отрабатывать перемещение ударения." }
  - { kind: government, text: "Поскольку слово неизменяемо, согласования оно не требует и падежей не имеет: EKSTRA PREMIA, EKSTRA GODZINY, EKSTRA OPŁATA — определяемое слово склоняется, а EKSTRA остаётся как есть: ZA EKSTRA OPŁATĘ «за дополнительную плату». В роли наречия ставится после глагола: DOPŁACIĆ EKSTRA, ZAPŁACIĆ EKSTRA. В роли самостоятельной реплики употребляется без всякого окружения. Порядок слов при определении свободный, но чаще EKSTRA стоит перед существительным." }
