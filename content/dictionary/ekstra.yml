etymology: "Из латинского EXTRA «вне, снаружи, сверх», которое само есть застывшая форма от EXTERUS «внешний», родственного EX «из». То есть исходно это предлог и наречие, а не прилагательное, и неизменяемость польского слова прямо отсюда и происходит: оно пришло в язык уже готовым наречием и не нашло, к какому склонению пристроиться. Тот же корень дал EKSTERNISTA «экстерн», EKSTREMALNY «экстремальный» и русское «экстерьер». Разговорное значение похвалы появилось в двадцатом веке по той же дороге, по которой английское EXTRA стало значить «особенно хороший»: то, что сверх нормы, легко переосмысляется как то, что лучше нормы."
memory: "Не склоняется совсем — одна форма, и это для польского редкость: kino, sejf и dysk парадигму получили, а ekstra нет, потому что пришло готовым наречием от латинского extra «сверх». Второе значение разговорное: Ekstra! значит «классно», чего у русского «экстра» нет вовсе — там только сорт товара."
