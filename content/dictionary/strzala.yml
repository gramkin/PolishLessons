notes:
  - { kind: pronunciation, text: "В дательном и предложном ł переходит в l: STRZAŁA — STRZALE. Это общее правило для слов на -ła: szkoła — w szkole, siła — o sile, skała — na skale. Русскому тут подсказки нет, у нас «в стреле» и «в школе» звук не меняется, и рука сама тянется написать «strzałe»." }
  - { kind: pronunciation, text: "Начальное strz — это три согласных подряд, «стш», и ни одна из них не выпадает: «стша́уа». Родительный множественного — STRZAŁ, без окончания вовсе, так что от десяти форм остаётся самая короткая. Здесь ł сохраняется, потому что окончания -e за ним уже нет." }
collocations:
  - { pl: "wypuścić strzałę", ru: "выпустить стрелу" }
  - { pl: "grot strzały", ru: "наконечник стрелы" }
  - { pl: "szybki jak strzała", ru: "быстрый как стрела" }
family:
  - { pl: "strzelać", ru: "стрелять", relation: root, id: strzelac }
  - { pl: "strzałka", ru: "стрелка", relation: derived }
  - { pl: "strzelec", ru: "стрелок", relation: derived }
etymology: "Из праславянского *strěla — то же слово, что русская «стрела», без всяких расхождений. От того же корня польские strzelać «стрелять», strzelec «стрелок» и strzałka «стрелка», в точности как у нас. Совпадение здесь полное, и запоминать нужно только чередование ł и l в падежах."
memory: "Предложный — w STRZALE, с l вместо ł, как szkoła — w szkole. А родительный множественного совсем без окончания: pięć strzał."
idioms:
