notes:
  - { kind: false-friend, text: "Одно из самых опасных слов в этом словаре: SPRAWKA это не «справка». Русская справка, то есть документ, по-польски ZAŚWIADCZENIE, а SPRAWKA означает проделку, проступок, чьих-то рук дело. Прийти в учреждение и попросить SPRAWKĘ значит сказать нечто вроде «дайте мне проделку». Слова и правда родня, оба от «справить, сделать», но польское пошло к поступку, а русское к бумаге, которая его удостоверяет." }
  - { kind: usage, text: "Десять форм, женский род. Это уменьшительное от SPRAWA «дело», и уменьшительность здесь работает не на размер, а на оценку: SPRAWKA это дело мелкое и слегка предосудительное, с оттенком снисходительной усмешки. В дательном и местном падеже единственного числа K переходит в C, и получается SPRAWCE, которое совпадает с формой другого слова, SPRAWCA «виновник». Различает только род и согласование." }
  - { kind: government, text: "Чьих рук дело — притяжательное местоимение или родительный: SPRAWKA SĄSIADÓW, CZYJA TO SPRAWKA. За проделку — предлог ZA с винительным: ZA TĘ SPRAWKĘ, ровно как по-русски. Свалить на кого-то — ZRZUCIĆ NA KOGOŚ, предлог NA с винительным: ZRZUCIŁ SPRAWKĘ NA BRATA. Приписать кому-то — PRZYPISAĆ KOMUŚ, дательный без предлога." }
  - { kind: pronunciation, text: "Читается «спра́фка», два слога, ударение на первом. Главное здесь в середине: W перед глухим K оглушается и звучит как «ф», поэтому SPRAWKA это «спра́фка», а не «спра́вка». Именно это оглушение и отличает польское слово от русского на слух, хотя пишутся они почти одинаково. В форме SPRAWCE оглушения уже нет, потому что W оказывается перед звонким: слышно «спра́вце»." }
  - { kind: register, text: "Слово разговорное и почти всегда с лёгкой иронией. Говорят так о детских шалостях, о мелких пакостях, о том, что натворил кот или сосед: TO TWOJA SPRAWKA «это твоих рук дело», NIECNA SPRAWKA «гнусная проделка», DROBNA SPRAWKA «мелкая проделка». О настоящем преступлении так не скажут, для этого есть PRZESTĘPSTWO. Поэтому SPRAWKA всегда немного смягчает то, о чём говорит." }
collocations:
  - { pl: "to twoja sprawka", ru: "это твоих рук дело" }
  - { pl: "niecna sprawka", ru: "гнусная проделка" }
