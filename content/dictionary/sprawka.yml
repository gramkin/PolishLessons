  - { pl: "sprawca", ru: "виновник", relation: derived, id: sprawca }
etymology: "Уменьшительное от SPRAWA «дело», а то от SPRAWIĆ «справить, сделать», от общеславянского корня PRAW-, того же, что в русских «справить», «исправить», «право». Русская «справка» собрана из тех же частей и тем же способом, но закрепилась за бумагой, которая удостоверяет сделанное, а польская SPRAWKA осталась при самом деле, причём мелком и предосудительном. Один корень, одна модель, два разошедшихся итога, и именно поэтому ошибиться так легко."
memory: "Ложный друг, и опасный: sprawka это не «справка», а проделка, проступок, чьих-то рук дело. Справка-документ по-польски zaświadczenie. Корень общий, от sprawić «справить, сделать», но русское слово ушло к бумаге, а польское осталось при поступке. Читается «спра́фка», с оглушением w перед k, и это слышное отличие от русского слова. Уменьшительность тут про оценку, а не про размер: всегда с лёгкой иронией."
idioms:
  - { pl: "czyja to sprawka", ru: "чьих это рук дело" }
