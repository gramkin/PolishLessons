id: drobny
format: 2
lemma: "drobny"
rank: 2308
pos: adj
pron: { cyr: "дро́бны" }
senses:
  - id: minor
    ru: "мелкий, незначительный"
    examples:
      - pl: "Miałem drobny problem z komputerem."
        ru: "У меня была небольшая проблема с компьютером."
        source: { kind: tatoeba, id: 6109694 }
      - pl: "To był tylko drobny epizod w moim życiu."
        ru: "Это был лишь незначительный эпизод в моей жизни."
        source: { kind: tatoeba, id: 3745240 }
      - pl: "Mamy drobny wypadek."
        ru: "У нас мелкая авария."
        source: { kind: translated, id: 3757063 }
  - id: small-change
    ru: "мелочь, мелкие деньги (drobne)"
    examples:
      - pl: "Macie drobne?"
        ru: "У вас есть мелочь?"
        source: { kind: translated, id: 8774092 }
      - pl: "Nie mam drobnych."
        ru: "У меня нет мелочи."
        source: { kind: translated, id: 357293 }
notes:
  - { kind: usage, text: "Субстантивированное drobne значит «мелкие деньги»: Macie drobne? «У вас есть мелочь?» Это отдельная, очень частая форма." }
  - { kind: false-friend, text: "Корень drobić «дробить» — ср. русское «дробный», «мелкий». Карточка drobiazg «мелочь, пустяк» из той же семьи." }
  - { kind: government, text: "Обычное прилагательное; наречие — drobno." }
  - { kind: usage, text: "drobnymi krokami «мелкими шагами» — частый оборот и в прямом, и в переносном смысле." }
collocations:
  - { pl: "drobne", ru: "мелкие деньги" }
  - { pl: "drobnymi krokami", ru: "мелкими шагами" }
etymology: "От drobić «дробить»; ср. русское «дробный», «мелкий». Отсюда же drobiazg «мелочь»."
