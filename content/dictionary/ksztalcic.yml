notes:
  - { kind: false-friend, text: "KSZTAŁCIĆ — «обучать, давать образование», а не «формировать, придавать форму»: это KSZTAŁTOWAĆ. Оба слова от KSZTAŁT «форма», но KSZTAŁCIĆ говорят о людях и уме, KSZTAŁTOWAĆ — о форме, характере, взглядах. Образование как итог — WYKSZTAŁCENIE, процесс обучения — KSZTAŁCENIE." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYKSZTAŁCIĆ. Спряжение на -IĆ с чередованием: KSZTAŁCĘ, KSZTAŁCISZ, KSZTAŁCĄ. Глагол книжнее, чем UCZYĆ: школы и вузы KSZTAŁCĄ специалистов, а учитель UCZY детей." }
  - { kind: government, text: "Кого — винительный: KSZTAŁCIĆ LEKARZY. На кого — NA + винительный: KSZTAŁCIĆ SIĘ NA PIELĘGNIARKĘ «учиться на медсестру». В чём — W + предложный: KSZTAŁCIĆ SIĘ W ZAWODZIE." }
  - { kind: pronunciation, text: "Читается «кшта́уциць»: Ł — «у», CI — «ци», ударение на предпоследнем слоге. Повелительное KSZTAŁĆ — «кшта́уць»." }
