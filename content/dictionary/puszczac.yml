# review
id: puszczac
format: 2
lemma: "puszczać"
rank: 1815
pos: verb
pron: { cyr: "пу́шчаць" }
senses:
  - id: let-go
    ru: "отпускать, выпускать (из рук, на волю)"
    examples:
      - pl: "Nie puszczaj mojej ręki."
        ru: "Не отпускай мою руку."
        source: { kind: authored }
      - pl: "Nie puszczał jej ręki ani na chwilę."
        ru: "Он не отпускал её руку ни на минуту."
        source: { kind: authored }
      - pl: "Puszczani pojedynczo widzowie zajmowali miejsca bez tłoku."
        ru: "Впускаемые по одному зрители занимали места без давки."
        source: { kind: authored }
  - id: play-music
    ru: "включать (музыку, фильм), ставить"
    examples:
      - pl: "Puszczam muzykę, kiedy sprzątam."
        ru: "Я включаю музыку, когда убираюсь."
        source: { kind: authored }
      - pl: "W radiu puszczano tę piosenkę co godzinę."
        ru: "По радио эту песню ставили каждый час."
        source: { kind: authored }
  - id: run-leak
    ru: "запускать (воздушного змея, воду); линять (о ткани)"
    examples:
      - pl: "Puszczał latawiec na łące za wsią."
        ru: "Он запускал воздушного змея на луге за деревней."
        source: { kind: authored }
      - pl: "Ta kurtka puszcza farbę."
        ru: "Эта куртка линяет."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Самое полезное здесь — значение, до которого по-русски не доберёшься. Puszczać muzykę значит «ВКЛЮЧАТЬ музыку», puszczać film — «ставить, показывать фильм». По-русски «пускать музыку» не говорят, а поляк говорит так постоянно. Остальные смыслы предсказуемы: puszczać rękę «отпускать руку», puszczać do środka «впускать». Корень общий с русским «пускать», праславянское *pustiti, и то же гнездо, что у wpuścić." }
  - { kind: government, text: "Отпускают КОГО и ЧТО — винительный: puszczać rękę, puszczać psa. Куда впускают — DO с РОДИТЕЛЬНЫМ: puszczać do środka, do domu. Отдельно запомните puszczać farbę «линять» (о ткани) и puszczać oczko «спускать петлю» — здесь дополнение в винительном, а подлежащее сама вещь." }
  - { kind: usage, text: "Несовершенный вид; совершенная пара — puścić. Приставочное гнездо уже знакомо: wpuścić «впустить», wypuścić «выпустить», dopuścić «допустить». Разговорное puścić farbę значит ещё и «проболтаться, выдать секрет» — образ тот же, что у линяющей ткани: краска вышла наружу." }
collocations:
  - { pl: "puszczać muzykę", ru: "включать музыку" }
  - { pl: "puszczać latawiec", ru: "запускать воздушного змея" }
  - { pl: "puszczać farbę", ru: "линять" }
family:
  - { pl: "puścić", ru: "пустить, отпустить", relation: aspect, id: puscic }
  - { pl: "wpuścić", ru: "впустить", relation: derived, id: wpuscic }
  - { pl: "wypuścić", ru: "выпустить", relation: derived, id: wypuscic }
etymology: "Многократная форма от puścić, праславянское *pustiti «пустить», от *pustъ «пустой». Русское «пускать» — то же слово, и всё приставочное гнездо совпадает: wpuścić «впустить», wypuścić «выпустить», opuścić «опустить, покинуть». Значение «включать музыку» выросло из образа «дать звуку выйти», то есть пустить его в комнату."
memory: "puszczać — «отпускать» и «впускать», как русское «пускать». Но главное значение русскому в голову не придёт: puszczać muzykę это «ВКЛЮЧАТЬ музыку». И puszczać farbę значит «линять», а разговорное puścić farbę — «проболтаться»."
idioms:
  - { pl: "puścić farbę", ru: "проболтаться, выдать секрет" }
  - { pl: "puszczać coś w obieg", ru: "пускать что-л. в оборот" }
