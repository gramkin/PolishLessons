notes:
  - { kind: government, text: "Предлоги различают положение: nad kominkiem «над камином» и przed kominkiem «перед камином» — творительный падеж; przy kominku «у камина» — предложный." }
  - { kind: false-friend, text: "Уменьшительное от komin «дымоход, труба». То есть камин — это «трубочка». Русское «камин» пришло из латыни через немецкий, так что слова только похожи по звучанию." }
  - { kind: usage, text: "Мужской неодушевлённый; родительный — kominka, с выпадением e." }
  - { kind: usage, text: "Drewno do kominka «дрова для камина» — обычное сочетание." }
collocations:
  - { pl: "przy kominku", ru: "у камина" }
  - { pl: "nad kominkiem", ru: "над камином" }
etymology: "Уменьшительное от komin «дымоход, труба». Русское «камин» — из латыни через немецкий, сходство случайное."
memory: "kominek — «камин», буквально «трубочка» от komin. Следите за предлогами: nad kominkiem, przed kominkiem, но przy kominku."
idioms:
  - { pl: "przy kominku", ru: "у камина" }
  - { pl: "nad kominkiem", ru: "над камином" }
formExamplesSkip:
  - { form: "kominku", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
