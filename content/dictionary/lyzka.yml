lemma: "łyżka"
rank: 5721
pos: noun
pron: { cyr: "уы́шка" }
senses:
  - id: spoon
    ru: "ложка"
    examples:
      - pl: "Mogę dostać łyżkę?"
        ru: "Можно мне ложку?"
        source: { kind: tatoeba, id: 2809338 }
      - pl: "Tutaj jest łyżka."
        ru: "Вот ложка."
        source: { kind: translated, id: 3603025 }
      - pl: "Potrzebuję łyżki, widelca i noża. Dziękuję."
        ru: "Мне нужны ложка, вилка и нож. Спасибо."
