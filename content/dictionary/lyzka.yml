  - id: spoonful
    ru: "ложка (как мера); ложечка"
    examples:
      - pl: "Łyżka czy łyżeczka?"
        ru: "Ложка или ложечка?"
        source: { kind: translated, id: 11660767 }
      - pl: "Zwykle jemy nożem, widelcem i łyżką."
        ru: "Обычно мы едим ножом, вилкой и ложкой."
        source: { kind: translated, id: 10637919 }
notes:
  - { kind: false-friend, text: "Русская «ложка» и польское łyżka — одно слово. Но начальное ł звучит как «у»: «уы́шка», а не «лыжка». Написание обманывает глаз." }
  - { kind: government, text: "Женский род: ta łyżka, tej łyżki. Есть ложкой — jeść łyżką, творительный падеж." }
  - { kind: usage, text: "Уменьшительное łyżeczka — «чайная ложечка»: łyżeczka cukru." }
  - { kind: usage, text: "Не путайте с łyżwa «конёк» (для катания) — слова похожи, но разные." }
collocations:
  - { pl: "jeść łyżką", ru: "есть ложкой" }
  - { pl: "łyżeczka cukru", ru: "чайная ложка сахара" }
etymology: "Праславянское *lъžica; русская «ложка» — то же слово."
memory: "łyżka — «ложка», но читается «уы́шка»: начальное ł даёт звук у. Чайная ложечка — łyżeczka. Не путайте с łyżwa «конёк»."
idioms:
  - { pl: "jeść łyżką", ru: "есть ложкой" }
formExamplesSkip:
  - { form: "łyżko", reason: "звательная форма, а łyżka — это ложка. Обращаться к ней некому, поэтому форма остаётся только в таблице склонения" }
