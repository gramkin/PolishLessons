# review
id: nieuchronnie
format: 2
lemma: "nieuchronnie"
rank: 5860
pos: adv
pron: { cyr: "неухро́нне" }
senses:
  - id: inevitably
    ru: "неизбежно, неотвратимо"
    examples:
      - pl: "Zima nieuchronnie się zbliża."
        ru: "Зима неотвратимо приближается."
        source: { kind: authored }
      - pl: "Takie zachowanie nieuchronnie prowadzi do konfliktu."
        ru: "Такое поведение неизбежно ведёт к конфликту."
        source: { kind: authored }
      - pl: "Wszystko, co żyje, nieuchronnie się starzeje."
        ru: "Всё живое неизбежно стареет."
        source: { kind: authored }
      - pl: "Kłamstwo prędzej czy później nieuchronnie wychodzi na jaw."
        ru: "Ложь рано или поздно неизбежно выходит наружу."
        source: { kind: authored }
      - pl: "Ceny nieuchronnie pójdą w górę."
        ru: "Цены неизбежно пойдут вверх."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Буквально «так, что не уберечься»: от UCHRONIĆ «уберечь». Синоним — NIEUNIKNIENIE «неизбежно». Часто с глаголами движения к концу: ZBLIŻAĆ SIĘ «приближаться», PROWADZIĆ DO «вести к»." }
  - { kind: usage, text: "Степени сравнения NIEUCHRONNIEJ и NAJNIEUCHRONNIEJ редки; живое употребление — CORAZ NIEUCHRONNIEJ «всё неотвратимее»." }
  - { kind: register, text: "Слово книжное и публицистическое: в новостях, эссе, литературе. В разговоре проще сказать NA PEWNO «наверняка»." }
  - { kind: pronunciation, text: "Читается «неухро́нне»: CH — «х», двойное NN перед IE — долгое мягкое «нн». Ударение на CHRO." }
collocations:
  - { pl: "nieuchronnie się zbliżać", ru: "неотвратимо приближаться" }
  - { pl: "nieuchronnie prowadzić do", ru: "неизбежно вести к" }
  - { pl: "coraz nieuchronniej", ru: "всё неотвратимее" }
family:
  - { pl: "nieuchronny", ru: "неизбежный, неотвратимый", relation: derived }
  - { pl: "uchronić", ru: "уберечь", relation: root }
  - { pl: "chronić", ru: "охранять, беречь", relation: root, id: chronic }
  - { pl: "ochrona", ru: "охрана, защита", relation: root, id: ochrona }
etymology: "NIE- + UCHRONNY от UCHRONIĆ «уберечь»: то, от чего не уберечься. CHRONIĆ родственно русским «хоронить» в старом смысле «прятать, беречь» и «хранить»."
memory: "chronić — беречь; nieuchronnie — «не уберечься»: беда придёт неотвратимо."
idioms:
  - { pl: "nieuchronnie zbliża się koniec", ru: "неотвратимо приближается конец" }
