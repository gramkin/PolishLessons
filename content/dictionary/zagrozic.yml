# review
id: zagrozic
format: 2
lemma: "zagrozić"
rank: 1450
pos: verb
aspect: perf
pron: { cyr: "загро́зиць" }
senses:
  - id: threaten
    ru: "пригрозить, угрожать"
    examples:
      - pl: "Zagroziłem ujawnieniem jego tajemnicy."
        ru: "Я пригрозил раскрыть его тайну."
        source: { kind: translated, id: 365729 }
      - pl: "Zagroziliśmy, że odejdziemy."
        ru: "Мы пригрозили, что уйдём."
        source: { kind: translated, id: 12045094 }
  - id: endanger
    ru: "поставить под угрозу; zagrożenie — угроза"
    examples:
      - pl: "Istnieje zagrożenie wojną."
        ru: "Существует угроза войны."
        source: { kind: tatoeba, id: 1002674 }
      - pl: "To zagrozi rozwojowi miasta."
        ru: "Это поставит под угрозу развитие города."
        source: { kind: translated, id: 766565 }
      - pl: "Broń nuklearna jest zagrożeniem dla całej ludzkości."
        ru: "Ядерное оружие — угроза для всего человечества."
        source: { kind: translated, id: 750373 }
  - id: at-risk
    ru: "zagrożony — находящийся под угрозой"
    examples:
      - pl: "Moja reputacja jest zagrożona."
        ru: "Моя репутация под угрозой."
        source: { kind: tatoeba, id: 12728697 }
      - pl: "Ten ptak jest zagrożony wymarciem."
        ru: "Эта птица под угрозой вымирания."
        source: { kind: tatoeba, id: 1165171 }
notes:
  - { kind: usage, text: "Совершенный вид к grozić «угрожать»." }
  - { kind: government, text: "zagrozić komuś czymś — дательный лица и творительный того, чем грозят: Zagroziliśmy odejściem «Мы пригрозили уходом»." }
  - { kind: usage, text: "Отглагольное существительное zagrożenie «угроза, опасность» встречается заметно чаще самого глагола: zagrożenie wojną «угроза войны»." }
  - { kind: usage, text: "Причастие zagrożony значит «находящийся под угрозой»: gatunek zagrożony wymarciem «вид под угрозой вымирания»." }
collocations:
  - { pl: "zagrożenie życia", ru: "угроза жизни" }
  - { pl: "gatunek zagrożony", ru: "вид под угрозой" }
  - { pl: "zagrozić komuś", ru: "пригрозить кому-либо" }
etymology: "Приставка za- и grozić «грозить» (праславянское *groza). Русские «гроза» и «грозить» — то же самое гнездо."
memory: "zagrozić — «пригрозить, поставить под угрозу», совершенный вид к grozić. Управление: zagrozić komuś czymś — дательный лица и творительный угрозы. В речи чаще самого глагола встречаются zagrożenie «угроза» и zagrożony «под угрозой»."
idioms:
  - { pl: "zagrożenie życia", ru: "угроза жизни" }
  - { pl: "gatunek zagrożony wymarciem", ru: "вид под угрозой вымирания" }
  - { pl: "zagrozić komuś", ru: "пригрозить кому-либо" }
