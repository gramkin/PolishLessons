# review
id: obejrzec
format: 2
lemma: "obejrzeć"
rank: 1428
pos: verb
aspect: perf
aspectPair: ogladac
pron: { cyr: "обэ́йжэць" }
senses:
  - id: watch
    ru: "посмотреть (фильм, передачу) до конца"
    examples:
      - pl: "Chcę obejrzeć film."
        ru: "Я хочу посмотреть фильм."
        source: { kind: translated, id: 4913068 }
      - pl: "Obejrzeliśmy film na wideo."
        ru: "Мы посмотрели фильм на видео."
        source: { kind: translated, id: 914948 }
      - pl: "Ten film jest warty obejrzenia."
        ru: "Этот фильм стоит посмотреть."
        source: { kind: translated, id: 7868597 }
  - id: examine
    ru: "осмотреть, оглядеть"
    examples:
      - pl: "Obejrzała kilka sukienek i wybrała tę najdroższą."
        ru: "Она осмотрела несколько платьев и выбрала самое дорогое."
        source: { kind: translated, id: 3170339 }
      - pl: "Pozwól, że to obejrzę."
        ru: "Дай я это осмотрю."
        source: { kind: translated, id: 552538 }
  - id: look-back
    ru: "obejrzeć się — оглянуться"
    examples:
      - pl: "Obejrzał się za siebie."
        ru: "Он оглянулся назад."
        source: { kind: translated, id: 418314 }
      - pl: "Obejrzyj się za siebie."
        ru: "Оглянись назад."
        source: { kind: translated, id: 868556 }
notes:
  - { kind: false-friend, text: "Различайте три польских «смотреть»: patrzeć «смотреть, направлять взгляд», oglądać «смотреть фильм или передачу» (процесс) и obejrzeć «посмотреть до конца, осмотреть» (результат). Русское «смотреть» покрывает все три." }
  - { kind: usage, text: "Совершенный вид к oglądać: obejrzeć film «посмотреть фильм» против oglądać film «смотреть фильм»." }
  - { kind: government, text: "obejrzeć co, винительный: obejrzeć film, wystawę, mieszkanie." }
  - { kind: usage, text: "С się — «оглянуться»: Obejrzyj się za siebie. Отсюда оборот nim się obejrzysz «не успеешь оглянуться»." }
collocations:
  - { pl: "obejrzeć film", ru: "посмотреть фильм" }
  - { pl: "obejrzeć się za siebie", ru: "оглянуться назад" }
  - { pl: "warty obejrzenia", ru: "стоит посмотреть" }
etymology: "Приставка ob- и корень -jrzeć от źrzeć «зреть, смотреть» (праславянское *zьrěti). Русские «зреть», «обозреть» и «взор» того же гнезда."
memory: "obejrzeć — «посмотреть до конца, осмотреть», совершенный вид к oglądać. С się значит «оглянуться»: nim się obejrzysz «не успеешь оглянуться». И держите в голове тройку patrzeć, oglądać, obejrzeć — русское «смотреть» покрывает все три."
idioms:
  - { pl: "nim się obejrzysz", ru: "не успеешь оглянуться" }
  - { pl: "warty obejrzenia", ru: "стоит посмотреть" }
  - { pl: "obejrzeć się za siebie", ru: "оглянуться назад" }
