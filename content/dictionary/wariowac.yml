# review
id: wariowac
format: 2
lemma: "wariować"
rank: 4191
pos: verb
pron: { cyr: "варьо́ваць" }
senses:
  - id: go-crazy
    ru: "сходить с ума, психовать"
    examples:
      - pl: "Chyba wariuję, nic nie pamiętam."
        ru: "Кажется, я схожу с ума, ничего не помню."
        source: { kind: authored }
      - pl: "Nie wariuj, to tylko żart."
        ru: "Не психуй, это просто шутка."
        source: { kind: authored }
      - pl: "Ludzie wariują przed świętami."
        ru: "Люди сходят с ума перед праздниками."
        source: { kind: authored }
  - id: romp
    ru: "беситься, дурачиться; WARIOWAĆ NA PUNKCIE — быть без ума от"
    examples:
      - pl: "Dzieci wariują na podwórku."
        ru: "Дети носятся по двору."
        source: { kind: authored }
      - pl: "Ona wariuje na punkcie koni."
        ru: "Она без ума от лошадей."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WARIOWAĆ — «сходить с ума», «беситься», а не «варьировать» (ZMIENIAĆ, RÓŻNICOWAĆ). Корень тот же, что в WARIAT «сумасшедший»; русского родственного слова у этого значения нет." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZWARIOWAĆ «сойти с ума». Спряжение на -UJĘ: WARIUJĘ, WARIUJESZ, WARIUJĄ. Отглагольное существительное и безличное WARIOWANO почти не встречаются и в карточку не включены." }
  - { kind: government, text: "От чего — Z с родительным: WARIOWAĆ Z NUDÓW, ZE SZCZĘŚCIA. От кого быть без ума — NA PUNKCIE с родительным: WARIOWAĆ NA PUNKCIE PIŁKI. Без дополнения — «беситься, шалить»." }
  - { kind: pronunciation, text: "Читается «варьо́ваць»: RIO — «рьо», ударение на предпоследнем слоге. WARIUJĘ — «варью́е»." }
  - { kind: register, text: "Разговорное слово. NIE WARIUJ! — «не психуй!», «не сходи с ума!» — звучит дружески. В книжной речи — TRACIĆ ROZUM." }
collocations:
  - { pl: "wariować z nudów", ru: "сходить с ума от скуки" }
  - { pl: "wariować na punkcie czegoś", ru: "быть без ума от чего-то" }
  - { pl: "nie wariuj", ru: "не психуй, не сходи с ума" }
family:
  - { pl: "zwariować", ru: "сойти с ума", relation: aspect, id: zwariowac }
  - { pl: "wariat", ru: "сумасшедший, псих", relation: derived, id: wariat }
  - { pl: "szaleć", ru: "безумствовать, беситься", relation: root, id: szalec }
etymology: "От WARIAT «сумасшедший», которое обычно выводят из латинского VARIARE «меняться, колебаться»: о человеке, у которого «мысли скачут»."
memory: "Wariować — сходить с ума, беситься: nie wariuj! Wariować na punkcie — быть без ума от. Не «варьировать»!"
idioms:
  - { pl: "wariować na punkcie czegoś", ru: "быть помешанным на чём-то" }
