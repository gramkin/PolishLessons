# review
id: tlumaczenie
format: 2
lemma: "tłumaczenie"
rank: 1185
pos: noun
pron: { cyr: "тумачэ́не" }
senses:
  - id: translation
    ru: "перевод"
    examples:
      - pl: "Mogę cię nauczyć tłumaczenia."
        ru: "Я могу научить тебя переводу."
        source: { kind: translated, id: 3603546 }
      - pl: "Podoba mi się tłumaczenie dialogów."
        ru: "Мне нравится перевод диалогов."
        source: { kind: translated, id: 13785412 }
      - pl: "Zmienię to tłumaczenie."
        ru: "Я изменю этот перевод."
        source: { kind: translated, id: 3969055 }
  - id: bureau
    ru: "biuro tłumaczeń — бюро переводов"
    examples:
      - pl: "Tom planuje otwarcie profesjonalnego biura tłumaczeń."
        ru: "Том планирует открыть профессиональное бюро переводов."
        source: { kind: translated, id: 6680131 }
      - pl: "Nie potrzebuję tłumaczeń."
        ru: "Мне не нужны переводы."
        source: { kind: translated, id: 965063 }
      - pl: "Na podstawie każdego zdania stwórz dziewięć tłumaczeń."
        ru: "На основе каждого предложения создай девять переводов."
        source: { kind: translated, id: 13010848 }
  - id: excuse
    ru: "оправдание, отговорка"
    note: "Второе значение, от tłumaczyć się «оправдываться»."
    examples:
      - pl: "Nie przyjął moich tłumaczeń."
        ru: "Он не принял моих оправданий."
        source: { kind: translated, id: 716858 }
      - pl: "Dobrze mu wychodzi wymyślanie tłumaczeń."
        ru: "У него хорошо получается выдумывать отговорки."
        source: { kind: translated, id: 355727 }
      - pl: "Nie chcę słuchać twoich tłumaczeń."
        ru: "Я не хочу слушать твоих оправданий."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово покрывает два разных значения: «перевод» и «оправдание, отговорка». Второе идёт от tłumaczyć się «оправдываться»: wymyślanie tłumaczeń «выдумывание отговорок»." }
  - { kind: usage, text: "biuro tłumaczeń «бюро переводов» — с родительным падежом множественного числа. А pomoc w tłumaczeniu «помощь в переводе» — с предложным." }
  - { kind: usage, text: "Это отглагольное существительное от tłumaczyć; сам глагол со всеми его значениями разобран в отдельной карточке." }
  - { kind: usage, text: "Средний род на -enie, как zdanie «предложение» и wrażenie «впечатление»: to tłumaczenie, tego tłumaczenia." }
collocations:
  - { pl: "biuro tłumaczeń", ru: "бюро переводов" }
  - { pl: "pomoc w tłumaczeniu", ru: "помощь в переводе" }
  - { pl: "jakość tłumaczenia", ru: "качество перевода" }
  - { pl: "wymyślać tłumaczenia", ru: "выдумывать отговорки" }
family:
  - { pl: "tłumaczyć", ru: "переводить, объяснять", relation: root, id: tlumaczyc }
  - { pl: "tłumacz", ru: "переводчик", relation: derived }
etymology: "Отглагольное существительное от tłumaczyć «переводить, объяснять». Само tłumaczyć восходит к тюркскому tilmač «толмач» — оттуда же русский «толмач»."
memory: "tłumaczenie — «перевод», но и «оправдание, отговорка»: Nie przyjął moich tłumaczeń «Он не принял моих оправданий». Запомните biuro tłumaczeń с родительным множественного."
idioms:
  - { pl: "biuro tłumaczeń", ru: "бюро переводов" }
  - { pl: "pomoc w tłumaczeniu", ru: "помощь в переводе" }
  - { pl: "wymyślać tłumaczenia", ru: "выдумывать отговорки" }
