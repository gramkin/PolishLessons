# review
id: pukac
format: 2
lemma: "pukać"
rank: 4194
pos: verb
pron: { cyr: "пу́каць" }
senses:
  - id: knock
    ru: "стучать (в дверь, окно)"
    examples:
      - pl: "Ktoś puka do drzwi."
        ru: "Кто-то стучит в дверь."
        source: { kind: authored }
      - pl: "Pukam, ale nikt nie otwiera."
        ru: "Я стучу, но никто не открывает."
        source: { kind: authored }
      - pl: "Przed wejściem trzeba pukać."
        ru: "Перед тем как войти, нужно постучать."
        source: { kind: authored }
  - id: tap
    ru: "постукивать; PUKAĆ SIĘ W CZOŁO — стучать себя по лбу (жест «ты с ума сошёл»)"
    examples:
      - pl: "Puka palcami w stół."
        ru: "Он постукивает пальцами по столу."
        source: { kind: authored }
      - pl: "Puka się w czoło, kiedy słyszy takie pomysły."
        ru: "Он стучит себя по лбу, когда слышит такие идеи."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PUKAĆ — «стучать», а не русское жаргонное «пукать». Это главная ловушка для русскоговорящих: PUKAĆ DO DRZWI — нейтральное «стучать в дверь». Стучать громко, барабанить — STUKAĆ, WALIĆ. В польском сленге у слова есть грубое значение, поэтому лучше говорить PUKAĆ DO DRZWI полностью." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZAPUKAĆ «постучать», однократный — PUKNĄĆ. Спряжение на -AM: PUKAM, PUKASZ, PUKAJĄ. Глагол непереходный, поэтому страдательных причастий у него нет — они в карточку не включены. Безличное PUKANO — «стучали»." }
  - { kind: government, text: "Во что — DO с родительным: PUKAĆ DO DRZWI, DO OKNA. По чему — W с винительным: PUKAĆ W STÓŁ, W ŚCIANĘ. По-русски «в дверь» — винительный, по-польски — DO с родительным." }
  - { kind: pronunciation, text: "Читается «пу́каць»: ударение на первом слоге, Ć — «ць». PUKAM — «пу́кам»." }
  - { kind: register, text: "Нейтральное слово в сочетании PUKAĆ DO DRZWI. Без дополнения в сленге может звучать двусмысленно и грубо." }
collocations:
  - { pl: "pukać do drzwi", ru: "стучать в дверь" }
  - { pl: "pukać się w czoło", ru: "стучать себя по лбу" }
  - { pl: "pukać w niemalowane drewno", ru: "стучать по дереву (чтобы не сглазить)" }
family:
  - { pl: "zapukać", ru: "постучать", relation: aspect }
  - { pl: "drzwi", ru: "дверь", relation: root, id: drzwi }
  - { pl: "stukać", ru: "стучать, постукивать", relation: root }
etymology: "Звукоподражательный корень PUK, передающий короткий стук, как русские «тук», «стук». Однократное — PUKNĄĆ «стукнуть»."
memory: "Pukać — стучать: ktoś puka do drzwi. Не русское «пукать»! Do drzwi — с родительным."
idioms:
  - { pl: "pukać w niemalowane drewno", ru: "стучать по дереву, чтобы не сглазить" }
