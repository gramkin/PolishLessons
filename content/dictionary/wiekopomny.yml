        ru: "Историческое изобретение Гутенберга изменило Европу."
        source: { kind: authored }
  - id: ironic
    ru: "«исторический» (с иронией о пустяке)"
    examples:
      - pl: "No i nadeszła wiekopomna chwila: brat umył naczynia."
        ru: "Ну вот и настала историческая минута: брат помыл посуду."
        source: { kind: authored }
      - pl: "Po wiekopomnej przemowie prezesa wszyscy zasnęli."
        ru: "После «исторической» речи председателя все уснули."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово книжное и торжественное, как русское «достопамятный» или «незабвенный». В живой речи оно почти всегда звучит с иронией: WIEKOPOMNA CHWILA про то, что сын наконец убрал комнату, это шутка. Всерьёз его употребляют в речах, юбилейных статьях и учебниках истории: WIEKOPOMNE DZIEŁO, WIEKOPOMNE ZASŁUGI, WIEKOPOMNE ODKRYCIE." }
  - { kind: false-friend, text: "Не путать с WIEKOWY. WIEKOWY значит «вековой, очень старый»: WIEKOWY DĄB «вековой дуб», WIEKOWA BABCIA «престарелая бабушка». WIEKOPOMNY говорит не о возрасте, а о памяти: то, что будут помнить веками. Старое здание бывает WIEKOWE, а событие, которое войдёт в историю, WIEKOPOMNE. Русское «вековой» тянет к первому слову, и ошибка здесь естественна." }
  - { kind: usage, text: "Степеней сравнения нет: «более достопамятный» по-польски не говорят, поэтому таблица из одиннадцати форм. Мужско-личное множественное WIEKOPOMNI естественно с названиями людей: WIEKOPOMNI BOHATEROWIE, WIEKOPOMNI WODZOWIE. Читается «векопо́мны»: ударение на предпоследнем слоге, Y на конце звучит как «ы»." }
