etymology: "Сложное слово из WIEK «век» и старого глагола POMNIEĆ «помнить», того же корня, что PAMIĘĆ и POMNIK. Буквально «помнимый веками». Глагол POMNIEĆ из живого языка ушёл, а в этом сложении сохранился."
memory: "WIEK «век» + POMNIEĆ «помнить» = WIEKOPOMNY, «то, что будут помнить веками». Корень тот же, что в POMNIK «памятник». А «вековой, старый» это WIEKOWY."
