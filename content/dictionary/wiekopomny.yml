senses:
  - id: memorable
    ru: "исторический, достопамятный, бессмертный"
    note: "торжественно"
    examples:
      - pl: "Mickiewicz stworzył wiekopomne dzieło."
        ru: "Мицкевич создал бессмертное произведение."
        source: { kind: authored }
      - pl: "To była wiekopomna chwila dla całego narodu."
        ru: "Это была историческая минута для всего народа."
        source: { kind: authored }
