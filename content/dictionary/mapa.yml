# review
id: mapa
format: 2
lemma: "mapa"
rank: 1661
pos: noun
pron: { cyr: "ма́па" }
senses:
  - id: map
    ru: "карта (географическая)"
    examples:
      - pl: "To jest mapa."
        ru: "Это карта."
        source: { kind: translated, id: 8541142 }
      - pl: "Na ścianie jest mapa."
        ru: "На стене карта."
        source: { kind: translated, id: 363636 }
      - pl: "W jakiej skali jest ta mapa?"
        ru: "Каков масштаб этой карты?"
        source: { kind: tatoeba, id: 11268998 }
  - id: use-map
    ru: "карта (пользоваться, смотреть)"
    examples:
      - pl: "Rozłożyłem mapę na biurku."
        ru: "Я расстелил карту на столе."
        source: { kind: tatoeba, id: 368891 }
      - pl: "Spójrzmy na mapę."
        ru: "Посмотрим на карту."
        source: { kind: translated, id: 2836299 }
      - pl: "Pokaż mi na mapie gdzie znajduje się Puerto Rico."
        ru: "Покажи мне на карте, где находится Пуэрто-Рико."
        source: { kind: tatoeba, id: 6313349 }
notes:
  - { kind: false-friend, text: "mapa — только географическая карта. Игральная карта и банковская карта — это karta: karta kredytowa «кредитная карта», talia kart «колода карт»." }
  - { kind: government, text: "«На карте» — na mapie (предложный): pokaż mi na mapie «покажи мне на карте»." }
  - { kind: usage, text: "zetrzeć z mapy — «стереть с карты», то же выражение, что в русском." }
  - { kind: usage, text: "Существительное женского рода на -a; звательная форма mapo в корпусе не встречается." }
collocations:
  - { pl: "na mapie", ru: "на карте" }
  - { pl: "mapa świata", ru: "карта мира" }
  - { pl: "potrzebuję mapy", ru: "мне нужна карта" }
etymology: "Из латинского mappa «салфетка, полотнище», через mappa mundi «карта мира». Русская «карта» пришла из другого латинского слова (charta «бумага»), поэтому слова не родственны, хотя значат одно."
memory: "mapa = «карта» только географическая. Игральная и банковская карта — это karta, и в этом ловушка: karta kredytowa «кредитная карта», но mapa świata «карта мира»."
idioms:
  - { pl: "na mapie", ru: "на карте" }
  - { pl: "mapa świata", ru: "карта мира" }
  - { pl: "zetrzeć z mapy", ru: "стереть с карты" }
formExamplesSkip:
  - { form: "mapo", reason: "звательный падеж у неодушевлённых существительных в современном языке остался только в поэтическом обращении: в обычной речи вместо mapo говорят mapa" }
