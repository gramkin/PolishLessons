# review
id: uczciwie
format: 2
lemma: "uczciwie"
rank: 4868
pos: adv
pron: { cyr: "учци́ве" }
senses:
  - id: honestly
    ru: "честно"
    examples:
      - pl: "Odpowiedz uczciwie: podoba ci się?"
        ru: "Ответь честно: тебе нравится?"
        source: { kind: authored }
      - pl: "Uczciwie przyznał się do błędu."
        ru: "Он честно признал ошибку."
        source: { kind: authored }
      - pl: "Sprzedawca uczciwie oddał mi resztę."
        ru: "Продавец честно отдал мне сдачу."
        source: { kind: authored }
  - id: properly
    ru: "по-честному, как следует"
    examples:
      - pl: "Uczciwie zapracował na urlop."
        ru: "Он честно заработал свой отпуск."
        source: { kind: authored }
      - pl: "Trzeba to uczciwie przemyśleć."
        ru: "Это нужно как следует обдумать."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UCZCIWIE — «честно», а не «учтиво». «Учтиво, вежливо» по-польски — UPRZEJMIE. Корень — CZEŚĆ «честь», и то же CZEŚĆ служит приветствием: CZEŚĆ! — «привет!»." }
  - { kind: usage, text: "Наречие со степенями: UCZCIWIE, UCZCIWIEJ, NAJUCZCIWIEJ. Вводный оборот UCZCIWIE MÓWIĄC — «честно говоря», синоним SZCZERZE MÓWIĄC." }
  - { kind: government, text: "Наречие ничем не управляет. По отношению к кому — WOBEC KOGOŚ: UCZCIWIE WOBEC KLIENTÓW, «честно по отношению к клиентам»." }
  - { kind: pronunciation, text: "Читается «учци́ве», ударение на предпоследнем слоге. CZ — «ч», CI — «ци», WIE — «ве»." }
collocations:
  - { pl: "uczciwie mówiąc", ru: "честно говоря" }
  - { pl: "uczciwie zarobione pieniądze", ru: "честно заработанные деньги" }
  - { pl: "grać uczciwie", ru: "играть честно" }
family:
  - { pl: "uczciwy", ru: "честный", relation: root, id: uczciwy }
  - { pl: "uczciwość", ru: "честность", relation: root }
  - { pl: "cześć", ru: "честь; привет", relation: root, id: czesc }
etymology: "От UCZCIWY «честный», а то — от CZEŚĆ «честь» и CZCIĆ «чтить». Корень тот же, что в русских «честь», «чтить», «почёт»."
memory: "Uczciwie — честно, не «учтиво» (это uprzejmie). Читается «учци́ве». Uczciwie mówiąc — честно говоря. Cześć — честь и «привет»."
idioms:
  - { pl: "uczciwość popłaca", ru: "честность окупается" }
