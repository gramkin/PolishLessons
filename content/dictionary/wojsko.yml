# review
id: wojsko
format: 2
lemma: "wojsko"
rank: 1513
pos: noun
pron: { cyr: "во́йско" }
senses:
  - id: army
    ru: "армия, войско"
    examples:
      - pl: "Wojsko zmusiło go do dymisji."
        ru: "Армия вынудила его уйти в отставку."
        source: { kind: translated, id: 12179046 }
      - pl: "Wojsko zablokowało drogi do miasta."
        ru: "Армия заблокировала дороги в город."
        source: { kind: translated, id: 713560 }
      - pl: "Jestem w wojsku."
        ru: "Я в армии."
        source: { kind: translated, id: 12179037 }
  - id: service
    ru: "военная служба"
    examples:
      - pl: "Wstąpił do wojska."
        ru: "Он поступил на военную службу."
        source: { kind: translated, id: 404512 }
      - pl: "Zaczynam myśleć, że nie powinienem był zaciągać się do wojska."
        ru: "Я начинаю думать, что мне не стоило идти в армию."
        source: { kind: tatoeba, id: 973160 }
notes:
  - { kind: usage, text: "Средний род: wojsko, wojska, w wojsku. Предложный — w wojsku «в армии»." }
  - { kind: usage, text: "Значит и «армия» как институт, и «военная служба»: iść do wojska «пойти в армию», być w wojsku «служить»." }
  - { kind: usage, text: "Синоним armia уже есть карточкой: wojsko звучит обиходнее, armia официальнее. Человек — żołnierz «солдат»." }
  - { kind: usage, text: "Множественное wojska значит «войска»: przegląd wojsk «смотр войск»." }
collocations:
  - { pl: "iść do wojska", ru: "пойти в армию" }
  - { pl: "być w wojsku", ru: "служить в армии" }
  - { pl: "przegląd wojsk", ru: "смотр войск" }
etymology: "От wój «воин», праславянское *vojь. Русское «войско» — то же самое слово, и «воин», «война» того же гнезда."
memory: "wojsko — «армия, войско», от wój «воин», как и русское слово. Обиходнее, чем armia. Главные обороты: iść do wojska «пойти в армию», być w wojsku «служить»."
idioms:
  - { pl: "iść do wojska", ru: "пойти в армию" }
  - { pl: "służyć w wojsku", ru: "служить в армии" }
  - { pl: "przegląd wojsk", ru: "смотр войск" }
