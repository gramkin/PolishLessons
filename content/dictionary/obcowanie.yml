pos: noun
pron: { cyr: "обцова́не" }
senses:
  - id: contact
    ru: "общение, соприкосновение"
    examples:
      - pl: "Jednym ze sposobów przyswojenia sobie języka obcego jest obcowanie z rodzimymi jego użytkownikami."
        ru: "Один из способов освоить иностранный язык — это общение с носителями."
        source: { kind: translated, id: 998707 }
      - pl: "Obcowanie z naturą uspokaja."
        ru: "Общение с природой успокаивает."
        source: { kind: authored }
      - pl: "Lubię obcowanie ze sztuką."
        ru: "Я люблю соприкосновение с искусством."
        source: { kind: authored }
  - id: communion
    ru: "приобщение, общение (книжное и церковное)"
    examples:
      - pl: "Obcowanie świętych to pojęcie z katechizmu."
        ru: "Общение святых — понятие из катехизиса."
        source: { kind: authored }
      - pl: "Obcowanie z ludźmi go męczy."
        ru: "Общение с людьми его утомляет."
        source: { kind: authored }
notes:
  - { kind: government, text: "Всегда с z и творительным падежом: obcowanie z naturą «общение с природой»." }
  - { kind: usage, text: "Книжное слово. Обычное «общение» — kontakt или rozmowa; obcowanie подразумевает длительное соприкосновение." }
  - { kind: false-friend, text: "Корень obcy «чужой», то есть буквально «соприкосновение с иным». Русское «общение» происходит от «общий» — ровно противоположный образ." }
  - { kind: usage, text: "В катехизисе есть устойчивое świętych obcowanie «общение святых»." }
collocations:
