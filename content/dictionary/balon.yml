notes:
  - { kind: false-friend, text: "BALON — «воздушный шар(ик)», а не «баллон». Газовый баллон — BUTLA. Идиома ROBIĆ KOGOŚ W BALONA — «водить кого-то за нос»." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, неодушевлённое. Родительный двойной: обычный BALONU и разговорный BALONA, он же в идиоме. Местный — W BALONIE." }
  - { kind: government, text: "Лететь на воздушном шаре — LECIEĆ BALONEM, творительный без предлога. Надуть шарик — NADMUCHAĆ BALON. Водить за нос — ROBIĆ KOGOŚ W BALONA, W с винительным в форме родительного." }
  - { kind: pronunciation, text: "Читается «ба́лон», ударение на первом слоге. LO — твёрдое «ло»." }
collocations:
  - { pl: "nadmuchać balon", ru: "надуть шарик" }
  - { pl: "lot balonem", ru: "полёт на воздушном шаре" }
  - { pl: "balon na ogrzane powietrze", ru: "тепловой аэростат" }
family:
  - { pl: "balonik", ru: "шарик", relation: derived }
  - { pl: "balonowy", ru: "аэростатный; шариковый", relation: derived }
  - { pl: "balon na ogrzane powietrze", ru: "тепловой аэростат", relation: derived }
etymology: "Из итальянского слова со значением «большой мяч». Русский «баллон» — того же источника, но значит сосуд для газа."
memory: "Balon — воздушный шар(ик), не «баллон» (butla). Читается «ба́лон». Robić kogoś w balona — водить за нос."
idioms:
  - { pl: "robić kogoś w balona", ru: "водить кого-то за нос" }
