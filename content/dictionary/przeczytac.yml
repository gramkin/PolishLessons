# review
id: przeczytac
format: 2
lemma: "przeczytać"
rank: 926
pos: verb
aspect: perf
aspectPair: czytac
pron: { cyr: "пшэчы́таць" }
senses:
  - id: read-through
    ru: "прочитать (до конца)"
    examples:
      - pl: "Warto przeczytać tę opowieść."
        ru: "Этот рассказ стоит прочитать."
        source: { kind: translated, id: 364062 }
      - pl: "Już przeczytałem książkę."
        ru: "Я уже прочитал книгу."
        source: { kind: translated, id: 11750140 }
      - pl: "Weź książkę i przeczytaj ją!"
        ru: "Возьми книгу и прочитай её!"
        source: { kind: translated, id: 349042 }
  - id: read-aloud
    ru: "прочитать вслух"
    examples:
      - pl: "Przeczytała wiersz na głos."
        ru: "Она прочитала стихотворение вслух."
        source: { kind: translated, id: 701572 }
      - pl: "Przeczytaj list."
        ru: "Прочитай письмо."
        source: { kind: translated, id: 13528108 }
      - pl: "Przeczytaj dwa pierwsze zdania."
        ru: "Прочитай два первых предложения."
        source: { kind: translated, id: 5907096 }
  - id: reading
    ru: "przeczytanie — прочтение"
    note: "Отглагольное существительное: po przeczytaniu «по прочтении»."
    examples:
      - pl: "Przeczytanie tej książki to dobry pomysł."
        ru: "Прочитать эту книгу — хорошая идея."
        source: { kind: translated, id: 555406 }
      - pl: "Żadna książka nie jest warta przeczytania."
        ru: "Ни одна книга не стоит прочтения."
        source: { kind: translated, id: 2235031 }
      - pl: "Podarła list po przeczytaniu."
        ru: "Она порвала письмо после прочтения."
        source: { kind: translated, id: 1594609 }
notes:
  - { kind: usage, text: "Совершенный вид к czytać. Czytał książkę «он читал книгу» — о процессе; przeczytał książkę «он прочитал книгу» — до конца." }
  - { kind: usage, text: "warto przeczytać — «стоит прочитать». А с существительным — wart przeczytania, с родительным падежом: książka warta przeczytania." }
  - { kind: government, text: "po przeczytaniu «после прочтения» — предлог po с предложным падежом отглагольного существительного. Русское «по прочтении» устроено точно так же." }
  - { kind: usage, text: "przeczytawszy «прочитав» — книжное деепричастие совершенного вида. В разговорной речи вместо него говорят po przeczytaniu." }
collocations:
  - { pl: "warto przeczytać", ru: "стоит прочитать" }
  - { pl: "przeczytać na głos", ru: "прочитать вслух" }
  - { pl: "po przeczytaniu", ru: "после прочтения" }
  - { pl: "wart przeczytania", ru: "стоящий прочтения" }
family:
  - { pl: "czytać", ru: "читать", relation: aspect, id: czytac }
  - { pl: "czytelnik", ru: "читатель", relation: root }
  - { pl: "odczytać", ru: "прочесть, расшифровать", relation: derived }
etymology: "Приставка prze- + czytać. Приставка значит «сквозь, до конца» — ровно как русское «про-» в «прочитать». Слова совпадают буквально, морфема в морфему."
memory: "przeczytać — совершенный вид к czytać, и собрано оно как русское «прочитать»: prze- = «про-». Czytał «читал» о процессе, przeczytał «прочитал» до конца. Запомните po przeczytaniu «по прочтении» и wart przeczytania «стоящий прочтения»."
idioms:
  - { pl: "przeczytać od deski do deski", ru: "прочитать от корки до корки" }
  - { pl: "przeczytać między wierszami", ru: "прочитать между строк" }
  - { pl: "wart przeczytania", ru: "стоящий прочтения" }
formExamplesSkip:
  - { form: "przeczytani", reason: "мужско-личная форма страдательного причастия: читают тексты, а не людей, поэтому форма не употребляется" }
