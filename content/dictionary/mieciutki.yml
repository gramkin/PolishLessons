# review
id: mieciutki
format: 2
lemma: "mięciutki"
rank: 5747
pos: adj
pron: { cyr: "мьенчу́тки" }
senses:
  - id: soft
    ru: "мягонький, очень мягкий"
    examples:
      - pl: "Koc jest mięciutki i ciepły."
        ru: "Одеяло мягонькое и тёплое."
        source: { kind: authored }
      - pl: "Kupiła dziecku mięciutkiego misia."
        ru: "Она купила ребёнку мягонького мишку."
        source: { kind: authored }
      - pl: "Chleb był jeszcze mięciutki."
        ru: "Хлеб был ещё мягонький."
        source: { kind: authored }
  - id: gentle
    ru: "нежный, ласковый (о голосе, прикосновении)"
    examples:
      - pl: "Miał mięciutki głos."
        ru: "У него был мягкий голос."
        source: { kind: authored }
      - pl: "Pościel była mięciutka jak puch."
        ru: "Постель была мягонькая, как пух."
        source: { kind: authored }
notes:
  - { kind: government, text: "Обычное прилагательное: mięciutki, mięciutka, mięciutkie. Степеней сравнения не образует — суффикс -utki сам по себе усилительный." }
  - { kind: usage, text: "Ласкательно-усилительная форма от miękki «мягкий»: не просто мягкий, а «мягонький». Рядом стоят mięciuchny и mięciusieńki — ещё нежнее." }
  - { kind: usage, text: "Чаще всего о тканях, постели, хлебе, игрушках и о голосе." }
  - { kind: false-friend, text: "Русское «мягонький» — точное соответствие и по смыслу, и по суффиксу; просто «мягкий» это miękki." }
collocations:
  - { pl: "mięciutki koc", ru: "мягонькое одеяло" }
  - { pl: "mięciutki chleb", ru: "мягонький хлеб" }
  - { pl: "mięciutka pościel", ru: "мягонькая постель" }
family:
  - { pl: "miękki", ru: "мягкий", relation: root }
  - { pl: "mięciuchny", ru: "мягонький", relation: derived }
etymology: "Ласкательно-усилительное от miękki «мягкий» с суффиксом -utki, который в польском выражает нежность: так же ciepły даёт ciepluteńki. Русское «мягонький» устроено тем же способом, суффиксом «-оньк-»."
memory: "mięciutki — «мягонький»: miękki плюс ласкательное -utki. Степеней не имеет, потому что суффикс уже усиливает."
idioms:
