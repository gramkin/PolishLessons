# review
id: pytanie
format: 2
lemma: "pytanie"
rank: 553
pos: noun
pron: { cyr: "пыта́не" }
senses:
  - id: question
    ru: "вопрос"
    note: "odpowiedzieć na pytanie «ответить на вопрос» — с предлогом na и винительным."
    examples:
      - pl: "Odpowiedz na pytanie."
        ru: "Ответь на вопрос."
        source: { kind: tatoeba, id: 349045 }
      - pl: "To trudne pytanie."
        ru: "Это трудный вопрос."
        source: { kind: tatoeba, id: 4716849 }
      - pl: "Mam do ciebie pytanie."
        ru: "У меня к тебе вопрос."
        source: { kind: tatoeba, id: 2482494 }
  - id: ask
    ru: "zadawać pytania — задавать вопросы"
    note: "zadać komuś pytanie: человек в дательном."
    examples:
      - pl: "On wiecznie zadaje głupie pytania."
        ru: "Он вечно задаёт глупые вопросы."
        source: { kind: tatoeba, id: 773291 }
      - pl: "Nie bój się zadawać pytań."
        ru: "Не бойся задавать вопросы."
        source: { kind: tatoeba, id: 3801645 }
      - pl: "Tom zadał Marii wiele pytań."
        ru: "Том задал Мэри много вопросов."
        source: { kind: tatoeba, id: 5369972 }
notes:
  - { kind: government, text: "odpowiedzieć na pytanie — с предлогом na и винительным, как в русском «ответить на вопрос». А zadać komuś pytanie ставит человека в дательный." }
  - { kind: usage, text: "Устойчивые: To dobre pytanie «Хороший вопрос», bez pytania «без спроса», pytanie retoryczne «риторический вопрос»." }
  - { kind: usage, text: "Знак вопроса — znak zapytania, от того же корня." }
  - { kind: usage, text: "Отглагольное существительное от pytać «спрашивать»; отсюда же zapytanie «запрос»." }
collocations:
  - { pl: "zadać pytanie", ru: "задать вопрос" }
  - { pl: "odpowiedzieć na pytanie", ru: "ответить на вопрос" }
  - { pl: "to dobre pytanie", ru: "хороший вопрос" }
  - { pl: "znak zapytania", ru: "вопросительный знак" }
family:
  - { pl: "pytać", ru: "спрашивать", relation: root }
  - { pl: "zapytanie", ru: "запрос", relation: derived }
  - { pl: "pytajnik", ru: "вопросительный знак", relation: derived }
etymology: "Отглагольное существительное от pytać «спрашивать», праславянское *pytati — родственно русскому «пытать» в старом значении «расспрашивать» и «допытываться»."
memory: "pytanie — «вопрос», от pytać «спрашивать». Управление совпадает с русским: odpowiedzieć na pytanie «ответить на вопрос» с na и винительным, а zadać komuś pytanie ставит человека в дательный. Корень тот же, что в русском «пытать» — в старом смысле «расспрашивать», отсюда же «допытываться». Вопросительный знак по-польски — znak zapytania."
idioms:
  - { pl: "zadać pytanie", ru: "задать вопрос" }
  - { pl: "odpowiedzieć na pytanie", ru: "ответить на вопрос" }
  - { pl: "To dobre pytanie", ru: "Хороший вопрос" }
