# review
id: wynosic
format: 2
lemma: "wynosić"
rank: 868
pos: verb
aspect: imperf
pron: { cyr: "выно́сиць" }
senses:
  - id: amount
    ru: "составлять, равняться (о сумме, числе)"
    note: "Самое частое значение: подлежащее — величина, а не человек."
    examples:
      - pl: "Jego wzrost wynosi jakieś dwa i pół metra."
        ru: "У него рост метра два с половиной."
        source: { kind: tatoeba, id: 12574282 }
      - pl: "Ile wynosi opłata?"
        ru: "Сколько составляет плата?"
        source: { kind: translated, id: 909221 }
      - pl: "Widownia wynosiła blisko 1000 osób."
        ru: "Зрителей было около тысячи человек."
        source: { kind: translated, id: 1480643 }
  - id: get-out
    ru: "wynosić się — убираться, проваливать"
    note: "Резко и грубовато, но печатно."
    examples:
      - pl: "Wynoś się!"
        ru: "Убирайся!"
        source: { kind: translated, id: 547705 }
      - pl: "Wynoś się stąd!"
        ru: "Убирайся отсюда!"
        source: { kind: translated, id: 8608358 }
      - pl: "Wynosimy się stąd. Gliny nadchodzą."
        ru: "Уходим отсюда. Менты идут."
        source: { kind: translated, id: 531835 }
  - id: carry-out
    ru: "выносить (наружу)"
    examples:
      - pl: "Tom mówi, że jest twoja kolej do wynoszenia śmieci."
        ru: "Том говорит, что твоя очередь выносить мусор."
        source: { kind: translated, id: 3707470 }
      - pl: "Sprawy firmy nie powinny być wynoszone poza nią."
        ru: "Дела фирмы не должны выноситься за её пределы."
        source: { kind: translated, id: 989444 }
      - pl: "Wynosi śmieci co wieczór."
        ru: "Он выносит мусор каждый вечер."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самое частое значение — «составлять, равняться»: Ile wynosi opłata? «Сколько составляет плата?», Jego długi wynoszą 100 tysięcy «Его долги составляют сто тысяч». Подлежащее тут величина, а не человек." }
  - { kind: register, text: "Wynoś się! значит «Убирайся!» — резко и грубовато, но вполне печатно. Wynosimy się stąd «Уходим отсюда»." }
  - { kind: government, text: "В прямом значении wynosić coś «выносить что-то» — винительный падеж: wynosić śmieci «выносить мусор»." }
  - { kind: usage, text: "Совершенный вид — wynieść. На вынос (о еде) — na wynos: kawa na wynos «кофе с собой»." }
collocations:
  - { pl: "ile wynosi?", ru: "сколько составляет?" }
  - { pl: "wynoś się!", ru: "убирайся!" }
  - { pl: "wynosić śmieci", ru: "выносить мусор" }
  - { pl: "na wynos", ru: "на вынос, с собой" }
family:
  - { pl: "wynieść", ru: "вынести", relation: aspect }
  - { pl: "nosić", ru: "носить", relation: root }
  - { pl: "wynos", ru: "вынос", relation: derived }
etymology: "Из wy- + nosić «носить» — буквально «выносить». Русское «выносить» собрано ровно так же, но значение «составлять» развилось только в польском."
memory: "wynosić — прежде всего «составлять, равняться»: Ile wynosi opłata? «Сколько составляет плата?». Буквальное значение — «выносить» (wynosić śmieci), а с się выходит резкое Wynoś się! «Убирайся!». Совершенный вид — wynieść, а kawa na wynos — «кофе с собой»."
idioms:
  - { pl: "ile wynosi?", ru: "сколько составляет?" }
  - { pl: "wynoś się!", ru: "убирайся!" }
  - { pl: "na wynos", ru: "с собой, на вынос" }
formExamplesSkip:
  - { form: "wynosiwszy", reason: "деепричастия на -wszy у глаголов несовершенного вида не бывает; для wynosić это wynosząc" }
