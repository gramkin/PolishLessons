notes:
  - { kind: government, text: "Обычное прилагательное; согласуется по роду: problem społeczny, praca społeczna, zwierzę społeczne." }
  - { kind: usage, text: "Устойчивые пары: sprawiedliwość społeczna «социальная справедливость», ubezpieczenie społeczne «социальное страхование», pracownik społeczny «общественный работник»." }
  - { kind: false-friend, text: "Корень społeczeństwo «общество», от spółka «товарищество»; ср. русское «общество», «сообща»." }
  - { kind: usage, text: "О животных значит «стадный, живущий сообща»: króliki są zwierzętami społecznymi." }
collocations:
  - { pl: "problem społeczny", ru: "общественная проблема" }
  - { pl: "sprawiedliwość społeczna", ru: "социальная справедливость" }
etymology: "От społeczeństwo «общество», от spółka «товарищество», корень pół «половина, доля»; ср. русское «общество», «сообща»."
memory: "społeczny — «общественный, социальный». Запомните пары sprawiedliwość społeczna и ubezpieczenie społeczne. О животных значит «стадный»."
idioms:
