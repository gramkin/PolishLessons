  - { pl: "nagranie", ru: "запись", relation: derived, id: nagranie }
etymology: "Приставка na- и GRYWAĆ — многократная форма от GRAĆ «играть», из праславянского *grati, того же корня, что русское «играть». Буквально «наиграть», то есть наиграть звук на носитель, откуда и нынешнее «записывать». Русское «играть» родственно, а вот русское «наигрывать» этого смысла не получило: запись по-русски пошла от «писать», а по-польски — от «играть». Отсюда NAGRANIE «запись» и NAGRYWARKA «записывающее устройство»."
memory: "na- плюс grywać от grać «играть»: «наиграть на плёнку» и есть «записать». А русское «наигрывать» — это польское naigrywać się, то есть «насмехаться»."
