notes:
  - { kind: false-friend, text: "Разбор по частям даёт неожиданный результат. NAGRYWAĆ — это na- плюс GRYWAĆ, многократная форма от GRAĆ «играть», то есть буквально «наигрывать». А значит слово это по-русски «записывать», и ничего общего с русским «наигрывать» у него нет. Самое же любопытное, что польский держит для русского смысла отдельный глагол: NAIGRYWAĆ SIĘ Z KOGOŚ значит «насмехаться над кем-то». Так что похожих по виду слов тут три, и расходятся они полностью." }
  - { kind: usage, text: "Семья многократных глаголов на -GRYWAĆ в польском велика — PoliMorf насчитывает их двадцать четыре: DOGRYWAĆ, ODGRYWAĆ, PRZEGRYWAĆ, ROZGRYWAĆ, WYGRYWAĆ, ZGRYWAĆ и другие. Все они построены от GRAĆ приставкой и живут своими смыслами, часто далёкими от игры. PRZEGRYWAĆ, скажем, значит и «проигрывать матч», и «перезаписывать, копировать запись» — второй смысл тот же, что у NAGRYWAĆ. Русскому стоит запомнить общее правило: корень -gr- в польском отвечает и за игру, и за запись." }
  - { kind: usage, text: "Шестьдесят три формы, несовершенный переходный, и все до единой живые — пропусков в этой карточке нет. Это стоит сравнить с тремя предыдущими партиями: у POPEŁNIAĆ и ODMAWIAĆ мужская личная форма множественного страдательного причастия оказалась непригодной, потому что в винительном падеже у них не стоят люди. Здесь стоят: людей снимают и записывают, поэтому NAGRYWANI вполне обычно — NAGRYWANI ŚWIADKOWIE, «записываемые свидетели»." }
  - { kind: usage, text: "Основа одна на все формы: NAGRYWAM, NAGRYWA, NAGRYWAJĄ, NAGRYWAŁ, NAGRYWANY. Повелительное NAGRYWAJ выходит из третьего лица NAGRYWA прибавлением -j, и правило карточки KARMIĆ тут работает исправно: это не глагол на -AWAĆ, а на -YWAĆ, так что исключение с двумя основами его не касается. Совершенная пара NAGRAĆ, и у неё повелительное NAGRAJ, тоже по правилу. Существительное записи — NAGRANIE, а устройство — NAGRYWARKA." }
collocations:
  - { pl: "nagrywać rozmowę", ru: "записывать разговор" }
  - { pl: "nagrywać płytę", ru: "записывать диск" }
