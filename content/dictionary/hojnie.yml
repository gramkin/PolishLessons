# review
id: hojnie
format: 2
lemma: "hojnie"
rank: 6087
pos: adv
pron: { cyr: "хо́йне" }
senses:
  - id: generously
    ru: "щедро (платить, награждать, одаривать)"
    examples:
      - pl: "Szef hojnie wynagrodził zespół."
        ru: "Начальник щедро вознаградил команду."
        source: { kind: authored }
      - pl: "Turyści hojnie dawali napiwki."
        ru: "Туристы давали щедрые чаевые."
        source: { kind: authored }
      - pl: "Babcia hojnie obdarowała wnuki."
        ru: "Бабушка щедро одарила внуков."
        source: { kind: authored }
  - id: lavishly
    ru: "обильно, не скупясь (полить, посыпать, украсить)"
    examples:
      - pl: "Polej sałatkę hojnie oliwą."
        ru: "Щедро полей салат оливковым маслом."
        source: { kind: authored }
      - pl: "Książka jest hojnie ilustrowana."
        ru: "Книга богато иллюстрирована."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от HOJNY «щедрый». Степени: HOJNIEJ «щедрее», NAJHOJNIEJ «щедрее всех». Стоит обычно перед глаголом или причастием: HOJNIE ZAPŁACIĆ, HOJNIE ILUSTROWANY." }
  - { kind: government, text: "Одарить кого чем — винительный и творительный: HOJNIE OBDAROWAĆ KOGOŚ PREZENTAMI. Полить чем — творительный без предлога: HOJNIE POLAĆ SOSEM. Русское «щедро полить соусом» строится так же." }
  - { kind: pronunciation, text: "«хо́йне», два слога: H — «х», NIE — «не». HOJNIEJ — «хо́йней», NAJHOJNIEJ — «найхо́йней»." }
  - { kind: register, text: "Нейтральное слово. В кулинарных рецептах — «не жалея»: HOJNIE POSYPAĆ CUKREM. Рядом стоит SUTO — «обильно» (о еде и выпивке): SUTO ZASTAWIONY STÓŁ." }
collocations:
  - { pl: "hojnie wynagrodzić", ru: "щедро вознаградить" }
  - { pl: "hojnie obdarować", ru: "щедро одарить" }
  - { pl: "hojnie zapłacić", ru: "щедро заплатить" }
  - { pl: "hojnie ilustrowany", ru: "богато иллюстрированный" }
