  - { pl: "skąpo", ru: "скупо", relation: antonym }
synonyms: ["szczodrze", "suto", "obficie"]
etymology: "От HOJNY «щедрый» с суффиксом наречий -IE, как PIĘKNY — PIĘKNIE. Происхождение HOJNY спорно: чаще всего его связывают с общеславянским *gojь «достаток» и с глаголом GOIĆ «заживлять, питать»."
memory: "HOJNY — щедрый, HOJNIE — щедро: hojnie zapłacić — щедро заплатить. Скупо — SKĄPO."
idioms:
  - { pl: "hojnie zakrapiany", ru: "обильно сдобренный спиртным (о застолье)" }
  - { pl: "hojną ręką", ru: "щедрой рукой" }
