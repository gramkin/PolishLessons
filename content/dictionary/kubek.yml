etymology: "От старопольского KUBEK, уменьшительного к KUB, которое связано с латинским CUPA «бочка, чаша» через германское посредство; из того же латинского источника идут английское CUP, немецкое KOPF в старом значении «чаша» и русский «кубок». Так польское и русское слова оказались родственниками, разошедшимися по сферам: польский оставил за своим словом будничную посуду, русский поднял своё до награды и обрядовой чаши. Уменьшительный суффикс -EK в польском чрезвычайно продуктивен и несёт беглую гласную, которая выпадает при склонении; русскому он отвечает в -ОК и -ЕК, тоже с выпадением: «кусок» и «куска». Для торжественного значения польский взял отдельное слово PUCHAR, из средневерхненемецкого BECHER."
memory: "Ловушка: kubek — это «кружка», а русский «кубок» по-польски puchar (puchar świata). Оба слова от латинского cupa, но польское осталось бытовым. Чашка с блюдцем — filiżanka. Беглая e выпадает всюду, кроме именительного: kubek, но kubka, kubkiem, w kubku — как «кусок» и «куска». В речи b оглушается: «ку́пка». Местный на -u, потому что основа на k."
idioms:
  - { pl: "kubek herbaty", ru: "кружка чая" }
  - { pl: "puchar świata", ru: "Кубок мира — здесь нужен puchar, не kubek" }
