notes:
  - { kind: false-friend, text: "Пара обманчива почти идеально: KUBEK значит «кружка», а русский «кубок» по-польски PUCHAR. Спортивный трофей — PUCHAR ŚWIATA «Кубок мира», и сказать KUBEK ŚWIATA было бы смешно. Сходство объясняется общим корнем: польское KUBEK — уменьшительное от KUBEK? Точнее, от старого KUBA, KUBEK, связанного с латинским CUPA «бочка, кубок», откуда и русский «кубок», и английское CUP. То есть оба слова от одного источника, но польское закрепилось за бытовой посудой, а русское — за торжественной. Для чашки с ручкой и блюдцем польский скажет FILIŻANKA, а KUBEK — это именно кружка, без блюдца." }
  - { kind: usage, text: "Суффикс -EK содержит беглую гласную, которая выпадает во всех формах, кроме именительного и винительного единственного: KUBEK, но KUBKA, KUBKOWI, KUBKIEM, KUBKU, KUBKI. Это правило охватывает сотни польских слов на -EK: DOMEK и DOMKU, OGONEK и OGONKA, MOSTEK и MOSTKA. Русский знает то же явление в «кусок — куска» и «песок — песка», так что опора есть, но в польском оно гораздо регулярнее. Местный падеж здесь на -U, а не на -IE, потому что основа кончается на K: W KUBKU. Родительный множественного — KUBKÓW." }
  - { kind: government, text: "Мужской род, неодушевлённое. Чего кружка — родительный: KUBEK HERBATY «кружка чая», KUBEK MLEKA. «В кружке» — предлог W с местным: W KUBKU. Частотные сочетания: KUBEK JEDNORAZOWY «одноразовый стаканчик», KUBEK PAPIEROWY, KUBEK TERMICZNY «термокружка», NALAĆ DO KUBKA «налить в кружку» — с предлогом DO и родительным, тогда как по-русски «в кружку» с винительным. Уменьшительное от уменьшительного — KUBECZEK, и оно вполне употребительно." }
  - { kind: pronunciation, text: "Читается «ку́бэк», два слога, ударение на первом. Буква U даёт «у», E — «э» без смягчения предшествующего согласного. Конечное K глухое. В родительном KUBKA беглая гласная выпадает, и слышно «ку́бка», где B перед глухим K оглушается до «п»: фактически «ку́пка». В местном KUBKU то же оглушение: «ку́пку». Это полезно заметить, потому что на письме B остаётся, а в речи звучит «п»." }
