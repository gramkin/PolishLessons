        source: { kind: authored }
      - pl: "Stał jak niepyszny przed dyrektorem."
        ru: "Он стоял присмиревший перед директором."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово-ископаемое: живёт практически только в сравнении jak niepyszny «как побитый, несолоно хлебавши». Отдельно почти не употребляется." }
  - { kind: false-friend, text: "Буквально «негордый»: nie + pyszny, от pycha «гордыня». Осторожно, pyszny в обиходе значит «вкусный», так что niepyszny легко прочесть как «невкусный» — но в этом обороте речь о гордости, а не о еде." }
  - { kind: government, text: "Обычное прилагательное по форме, но вне оборота не встречается." }
  - { kind: usage, text: "В корпусе слово не встречается совсем, поэтому все примеры составлены вручную." }
