  - { pl: "potem", ru: "потом", relation: antonym, id: potem }
etymology: "Сращение предлога PRZED и формы TEM — древнего творительного падежа указательного местоимения TO. Буквально «перед тем». Русский то же самое сочетание сохранил раздельным: «перед тем». Поэтому слово не надо переводить по частям, его надо узнать: это русское «перед тем», слипшееся в одно наречие, и таких сращений в польском много — potem, dlatego, zatem."
memory: "Одна форма, ничего не меняется. Буквально «перед тем»: przed + tem. Пара к нему — potem."
