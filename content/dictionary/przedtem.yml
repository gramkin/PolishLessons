# review
id: przedtem
format: 2
lemma: "przedtem"
rank: 2695
pos: adv
pron: { cyr: "пшэ́тэм" }
senses:
  - id: before
    ru: "прежде, до того"
    examples:
      - pl: "Przedtem mieszkali na wsi."
        ru: "Прежде они жили в деревне."
        source: { kind: authored }
      - pl: "Nigdy przedtem go nie widziałem."
        ru: "Никогда прежде я его не видел."
        source: { kind: authored }
      - pl: "Dzień przedtem padał deszcz."
        ru: "За день до того шёл дождь."
        source: { kind: authored }
  - id: formerly
    ru: "раньше, в прежнее время"
    examples:
      - pl: "Wszystko było tak jak przedtem."
        ru: "Всё было как прежде."
        source: { kind: authored }
      - pl: "Na długo przedtem opuścił miasto."
        ru: "Задолго до того он покинул город."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Форма одна, и других у слова нет. Наречия по падежам не изменяются вовсе, а степеней сравнения у этого нет — в отличие от SŁUSZNIE и NIEZWYKLE, у которых их три. Значит выучить надо ровно одно написание, и на этом словарная статья кончается. Такие слова в польском называют неизменяемыми, и к ним же относятся JEDNOCZEŚNIE из этой же партии, а из существительных — ALIBI, MENU, TAXI." }
  - { kind: usage, text: "Слово склеено из предлога PRZED и древней формы TEM, застывшего творительного падежа от TO. То есть PRZEDTEM буквально значит «перед тем», и русское соответствие здесь не просто близкое, а то же самое выражение, только написанное раздельно: русский говорит «перед тем», польский сварил это в одно слово. Отсюда и правило: там, где по-русски «перед тем», по-польски стоит przedtem одним словом." }
  - { kind: usage, text: "Не путайте с WCZEŚNIEJ. PRZEDTEM значит «до того момента», о котором речь, и требует, чтобы этот момент был уже назван: byliśmy w kinie, a przedtem na obiedzie. WCZEŚNIEJ значит просто «раньше» и ни на какой названный момент не опирается. Естественная пара к przedtem — POTEM «потом», и вместе они размечают рассказ: przedtem, potem, na końcu." }
collocations:
  - { pl: "na długo przedtem", ru: "задолго до того" }
  - { pl: "tak jak przedtem", ru: "как прежде" }
  - { pl: "dzień przedtem", ru: "за день до того" }
family:
