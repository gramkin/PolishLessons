# review
id: wspanialy
format: 2
lemma: "wspaniały"
rank: 374
pos: adj
pron: { cyr: "фспаня́уы" }
senses:
  - id: magnificent
    ru: "великолепный, прекрасный"
    examples:
      - pl: "To była wspaniała gra."
        ru: "Это была отличная игра."
        source: { kind: tatoeba, id: 13020793 }
      - pl: "Widok ze szczytu tego budynku był wspaniały."
        ru: "Вид с вершины этого здания был великолепным."
        source: { kind: tatoeba, id: 1685315 }
      - pl: "Masz wspaniały głos."
        ru: "У тебя прекрасный голос."
        source: { kind: authored }
  - id: wonderful-person
    ru: "замечательный (о человеке)"
    examples:
      - pl: "Są wspaniali."
        ru: "Они замечательные."
        source: { kind: translated, id: 4406460 }
      - pl: "Jesteś wspaniałym dzieckiem."
        ru: "Ты замечательный ребёнок."
        source: { kind: translated, id: 735409 }
      - pl: "Są wspaniałymi rodzicami."
        ru: "Они замечательные родители."
        source: { kind: translated, id: 13785480 }
notes:
  - { kind: usage, text: "Внутри слова спрятан pan: старопольское spaniały значило «ставший паном, господином». Великолепный — то есть достойный пана." }
  - { kind: usage, text: "Wspaniale! — наречие, готовая реплика «Великолепно!». Звучит даже чаще самого прилагательного." }
  - { kind: usage, text: "Сильнее, чем dobry и świetny: świetny pomysł — «отличная идея», wspaniały widok — «великолепный вид»." }
  - { kind: usage, text: "О людях переводится как «замечательный»: Są wspaniałymi rodzicami «Они замечательные родители»." }
collocations:
  - { pl: "wspaniały widok", ru: "великолепный вид" }
  - { pl: "wspaniale!", ru: "великолепно!" }
  - { pl: "czuć się wspaniale", ru: "чувствовать себя великолепно" }
etymology: "Старопольское w + spaniały, от spaniały «ставший паном, господином». Внутри тот же pan, что и в русском «пан»: великолепный — значит достойный пана."
memory: "wspaniały — «великолепный», и если разобрать слово, внутри окажется pan: старопольское spaniały значило «ставший паном». Wspaniale! — «Великолепно!» — готовая реплика, которую слышно чаще самого прилагательного."
idioms:
  - { pl: "wspaniale!", ru: "великолепно!" }
  - { pl: "wspaniały widok", ru: "великолепный вид" }
  - { pl: "czuć się wspaniale", ru: "чувствовать себя великолепно" }
