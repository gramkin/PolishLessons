notes:
  - { kind: pronunciation, text: "Родительный множественного двойной: обычное SESJI, совпадающее с родительным единственного, и старое SESYJ. Это шестая такая пара в словаре после konferencyj, reputacyj, tradycyj, tragedyj и kopij, и шести случаев довольно, чтобы считать это свойством всего разряда на -ja, а не причудой отдельных слов. Форма на -yj книжная и живёт в старых текстах." }
  - { kind: usage, text: "Значения почти целиком совпадают с русскими: SESJA EGZAMINACYJNA — экзаменационная сессия, sesja parlamentu — сессия парламента, SESJA ZDJĘCIOWA — фотосессия, sesja giełdowa — биржевая сессия. Студенческий смысл самый частый, и оборот w czasie sesji означает именно «во время сессии», с родительным." }
collocations:
  - { pl: "sesja egzaminacyjna", ru: "экзаменационная сессия" }
  - { pl: "sesja zdjęciowa", ru: "фотосессия" }
  - { pl: "w czasie sesji", ru: "во время сессии" }
family:
  - { pl: "sesyjny", ru: "сессионный", relation: derived }
  - { pl: "siedzieć", ru: "сидеть", relation: root, id: siedziec }
  - { pl: "posiedzenie", ru: "заседание", relation: root }
etymology: "Из латинского sessio «сидение», от sedere «сидеть»: заседание есть то, на чём сидят. Латинское sedere и польское siedzieć восходят к одному индоевропейскому корню, так что слово заимствованное, а родня у него в языке своя. Русская «сессия» пришла тем же путём и тем же значением, а наше «заседание» построено от «сидеть» самостоятельно, как польское posiedzenie."
memory: "Родительный множественного двойной: sesji и книжное SESYJ — шестая такая пара после tragedyj и kopij."
