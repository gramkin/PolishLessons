notes:
  - { kind: usage, text: "Пара: córka «дочь» — syn «сын»; во множественном córki «дочери»." }
  - { kind: usage, text: "Звательный падеж живой в обращении к дочери: Córko, chodź tu! «Дочка, иди сюда!»" }
  - { kind: usage, text: "spółka córka — «дочерняя компания», калька с того же образа, что и в русском." }
collocations:
  - { pl: "moja córka", ru: "моя дочь" }
  - { pl: "starsza córka", ru: "старшая дочь" }
  - { pl: "syn i córka", ru: "сын и дочь" }
  - { pl: "jedyna córka", ru: "единственная дочь" }
etymology: "Праиндоевропейское *dhugh(ə)ter — то же слово, что русское «дочь», немецкое Tochter и литовское duktė; польское c- развилось из старого d-."
memory: "córka — «дочь», того же древнего корня, что русское «дочь» и немецкое Tochter. Звательный падеж живой: Córko!"
idioms:
  - { pl: "jaka matka, taka córka", ru: "какая мать, такая и дочь" }
  - { pl: "spółka córka", ru: "дочерняя компания" }
  - { pl: "syn i córka", ru: "сын и дочь" }
