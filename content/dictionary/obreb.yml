# review
id: obreb
format: 2
lemma: "obręb"
rank: 5813
pos: noun
pron: { cyr: "о́брэмп" }
senses:
  - id: within
    ru: "пределы, рамки (обычно W OBRĘBIE «в пределах»)"
    examples:
      - pl: "Parkowanie w obrębie rynku jest zabronione."
        ru: "Парковка в пределах рыночной площади запрещена."
        source: { kind: authored }
      - pl: "Poruszamy się tylko w obrębie miasta."
        ru: "Мы передвигаемся только в черте города."
        source: { kind: authored }
      - pl: "Poza obrębem lasu zaczynały się łąki."
        ru: "За пределами леса начинались луга."
        source: { kind: authored }
  - id: unit
    ru: "участок (кадастровый, лесной)"
    examples:
      - pl: "Każda gmina dzieli się na obręby ewidencyjne."
        ru: "Каждая гмина делится на кадастровые участки."
        source: { kind: authored }
      - pl: "Leśniczy pokazał nam granice swojego obrębu."
        ru: "Лесничий показал нам границы своего участка."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное употребление — оборот W OBRĘBIE + родительный: «в пределах, в рамках»: W OBRĘBIE MIASTA «в черте города». Противоположное — POZA OBRĘBEM «за пределами»." }
  - { kind: register, text: "Второе значение — официальный термин: OBRĘB EWIDENCYJNY «кадастровый участок», OBRĘB LEŚNY «лесной участок» в лесничестве." }
  - { kind: pronunciation, text: "Ę перед B читается «эм», конечное B оглушается: «о́брэмп». В формах с окончанием — «обрэ́мбу», «обрэ́мбе»." }
collocations:
  - { pl: "w obrębie miasta", ru: "в черте города" }
  - { pl: "poza obrębem", ru: "за пределами" }
  - { pl: "obręb ewidencyjny", ru: "кадастровый участок" }
  - { pl: "obręb leśny", ru: "лесной участок" }
family:
  - { pl: "obszar", ru: "область, территория", relation: root, id: obszar }
  - { pl: "teren", ru: "территория", relation: root, id: teren }
  - { pl: "rąbać", ru: "рубить", relation: root }
etymology: "Того же корня, что RĄBAĆ «рубить» и OBRĘBIĆ «подрубить край ткани»: отграниченное, отмеренное пространство."
memory: "W obrębie — в пределах: внутри очерченной, «обрубленной» черты."
idioms:
  - { pl: "w obrębie", ru: "в пределах, в рамках (чего-либо)" }
formExamplesSkip:
