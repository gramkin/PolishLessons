notes:
  - { kind: false-friend, text: "STRUKTURA — «структура», как в русском. Но о ткани, тесте, коже — «фактура, текстура»: STRUKTURA DREWNA, «текстура дерева». Организации и ведомства — STRUKTURY: STRUKTURY PAŃSTWA, «государственные структуры»." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном R переходит в RZ: W STRUKTURZE. Звательный STRUKTURO не употребляется." }
  - { kind: government, text: "В структуре — W STRUKTURZE, местный. Структура чего — родительный: STRUKTURA SPOŁECZEŃSTWA. Внутри структуры — W RAMACH STRUKTURY, родительный." }
  - { kind: pronunciation, text: "Читается «структу́ра», ударение на предпоследнем слоге. STRUKTURZE — «структу́жэ»." }
