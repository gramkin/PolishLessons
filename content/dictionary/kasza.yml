        ru: "Она сварила кашу на молоке."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русская «каша» и польское kasza — одно слово, но польское чаще значит именно КРУПУ как продукт: kasza gryczana «гречневая крупа», kasza manna «манка»." }
  - { kind: government, text: "Женский род: ta kasza, tej kaszy." }
  - { kind: usage, text: "Про кашу-блюдо поляк скорее скажет kaszka (детская) или owsianka (овсянка)." }
  - { kind: usage, text: "Оборот nie dać sobie w kaszę dmuchać значит «не дать себя в обиду», буквально «не дать себе дуть в кашу»." }
collocations:
  - { pl: "kasza gryczana", ru: "гречневая крупа" }
  - { pl: "nie dać sobie w kaszę dmuchać", ru: "не дать себя в обиду" }
etymology: "Праславянское *kaša; русская «каша» — то же слово."
memory: "kasza — прежде всего «крупа»: kasza gryczana, kasza manna. Овсянка — owsianka. Оборот nie dać sobie w kaszę dmuchać — «не дать себя в обиду»."
idioms:
  - { pl: "kasza gryczana", ru: "гречневая крупа" }
