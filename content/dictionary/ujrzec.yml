# review
id: ujrzec
format: 2
lemma: "ujrzeć"
rank: 2387
pos: verb
aspect: perf
pron: { cyr: "у́йжэць" }
senses:
  - id: catch-sight
    ru: "увидеть, завидеть (книжное)"
    examples:
      - pl: "Tom ujrzał krew na podłodze."
        ru: "Том увидел кровь на полу."
        source: { kind: translated, id: 4911176 }
      - pl: "Ujrzałem ląd w oddali."
        ru: "Я увидел землю вдали."
        source: { kind: translated, id: 5197507 }
      - pl: "Marynarze ujrzeli ląd."
        ru: "Моряки увидели землю."
        source: { kind: translated, id: 12281463 }
  - id: behold
    ru: "узреть, увидеть впервые"
    examples:
      - pl: "Jim pokochał Mary w chwili, kiedy ją ujrzał."
        ru: "Джим полюбил Мэри в тот миг, когда её увидел."
        source: { kind: translated, id: 998617 }
      - pl: "Przez wizjer ujrzała nieznajomą twarz."
        ru: "В глазок она увидела незнакомое лицо."
        source: { kind: translated, id: 8765474 }
notes:
  - { kind: usage, text: "Книжное и торжественное слово. В обычной речи скажут zobaczyć «увидеть»." }
  - { kind: false-friend, text: "Корень -jrzeć тот же, что в przyjrzeć się «присмотреться» и spojrzeć «взглянуть», от старого źrzeć «смотреть»; ср. русское «зреть», «узреть», «взор»." }
  - { kind: government, text: "Совершенный вид, винительный падеж. Настоящей видовой пары нет: несовершенным по смыслу служит widzieć «видеть», а не форма от того же корня." }
  - { kind: usage, text: "ujrzeć światło dzienne «увидеть свет» — о книге, факте, новости, ровно как в русском." }
collocations:
  - { pl: "ujrzeć światło dzienne", ru: "увидеть свет, стать известным" }
  - { pl: "ujrzeć na własne oczy", ru: "увидеть своими глазами" }
etymology: "u- + -jrzeć от старого źrzeć «смотреть»; ср. русское «зреть», «узреть», «взор»."
memory: "ujrzeć — книжное «увидеть, узреть». Тот же корень, что в przyjrzeć się и spojrzeć. Настоящей видовой пары нет: в обычной речи это zobaczyć."
idioms:
  - { pl: "ujrzeć światło dzienne", ru: "увидеть свет, стать известным" }
  - { pl: "ujrzeć na własne oczy", ru: "увидеть своими глазами" }
