formExamples:
  - form: "ujrzał"
    pl: "Ten fakt ujrzał światło dzienne."
    ru: "Этот факт увидел свет."
    source: { kind: translated, id: 3049235 }
  - form: "ujrzał"
    pl: "Tom ujrzał krew na podłodze."
    ru: "Том увидел кровь на полу."
    source: { kind: translated, id: 4911176 }
  - form: "ujrzał"
    pl: "Jim pokochał Mary w chwili, kiedy ją ujrzał."
    ru: "Джим полюбил Мэри в тот миг, когда её увидел."
    source: { kind: translated, id: 998617 }
  - form: "ujrzała"
    pl: "Przez wizjer ujrzała nieznajomą twarz."
    ru: "В глазок она увидела незнакомое лицо."
    source: { kind: translated, id: 8765474 }
  - form: "ujrzała"
    pl: "Gdy ujrzała krew, była bliska omdlenia."
    ru: "Увидев кровь, она едва не потеряла сознание."
    source: { kind: translated, id: 516494 }
  - form: "ujrzała"
    pl: "Miała wyraz twarzy zupełnie jakby ujrzała ducha."
    ru: "У неё было такое лицо, будто она увидела призрака."
    source: { kind: translated, id: 7058150 }
  - form: "ujrzałem"
    pl: "Ujrzałem ląd w oddali."
    ru: "Я увидел землю вдали."
    source: { kind: translated, id: 5197507 }
  - form: "ujrzałem"
    pl: "Ujrzałem księżyc ponad nieboskłonem."
    ru: "Я увидел луну над небосводом."
    source: { kind: translated, id: 12564112 }
  - form: "ujrzałem"
    pl: "Chciałem cię pocałować od momentu, gdy cię ujrzałem."
    ru: "Я хотел тебя поцеловать с того мига, как увидел."
    source: { kind: translated, id: 3085193 }
  - form: "ujrzały"
    pl: "Dzieci ujrzały morze po raz pierwszy."
    ru: "Дети впервые увидели море."
    source: { kind: authored }
  - form: "ujrzały"
    pl: "Te listy nigdy nie ujrzały światła dziennego."
    ru: "Эти письма так и не увидели свет."
    source: { kind: authored }
  - form: "ujrzały"
    pl: "Jej oczy ujrzały wreszcie dom."
    ru: "Её глаза наконец увидели дом."
    source: { kind: authored }
  - form: "ujrzą"
    pl: "Wkrótce ujrzą wynik."
    ru: "Скоро они увидят результат."
    source: { kind: authored }
  - form: "ujrzą"
    pl: "Ujrzą to na własne oczy."
    ru: "Они увидят это своими глазами."
    source: { kind: authored }
  - form: "ujrzą"
    pl: "Czytelnicy ujrzą nową wersję."
    ru: "Читатели увидят новую версию."
    source: { kind: authored }
  - form: "ujrzeli"
    pl: "Marynarze ujrzeli ląd."
    ru: "Моряки увидели землю."
    source: { kind: translated, id: 12281463 }
  - form: "ujrzeli"
    pl: "Kiedy się obudzili, ujrzeli kamień leżący obok nich."
    ru: "Проснувшись, они увидели лежащий рядом камень."
    source: { kind: translated, id: 1166352 }
  - form: "ujrzeli"
    pl: "Ujrzeli światło w oknie."
    ru: "Они увидели свет в окне."
    source: { kind: authored }
  - form: "ujrzeliśmy"
    pl: "Wyjrzeliśmy przez okno, ale nic nie ujrzeliśmy."
    ru: "Мы выглянули в окно, но ничего не увидели."
    source: { kind: translated, id: 592339 }
  - form: "ujrzeliśmy"
    pl: "Poczuliśmy ulgę, gdy ujrzeliśmy światło w oddali."
    ru: "Мы вздохнули с облегчением, когда увидели свет вдали."
    source: { kind: translated, id: 1351155 }
  - form: "ujrzeliśmy"
    pl: "Ujrzeliśmy szczyt góry."
    ru: "Мы увидели вершину горы."
    source: { kind: authored }
  - form: "ujrzysz"
    pl: "Gdziekolwiek spojrzysz, ujrzysz wiele dobra."
    ru: "Куда ни взглянешь, увидишь много доброго."
    source: { kind: translated, id: 7051871 }
  - form: "ujrzysz"
    pl: "Ujrzysz to sam."
    ru: "Ты увидишь это сам."
    source: { kind: authored }
  - form: "ujrzysz"
    pl: "Za zakrętem ujrzysz rzekę."
    ru: "За поворотом ты увидишь реку."
    source: { kind: authored }
