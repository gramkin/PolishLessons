# review
id: opieka
format: 2
lemma: "opieka"
rank: 1200
pos: noun
pron: { cyr: "опе́ка" }
senses:
  - id: care
    ru: "забота, уход"
    examples:
      - pl: "Tom potrzebuje stałej opieki."
        ru: "Тому нужен постоянный уход."
        source: { kind: translated, id: 8973450 }
      - pl: "Pomożesz mi w opiece nad dziećmi?"
        ru: "Поможешь мне с уходом за детьми?"
        source: { kind: translated, id: 959221 }
      - pl: "Moja praca polega na opiece nad dziećmi."
        ru: "Моя работа состоит в уходе за детьми."
        source: { kind: translated, id: 348941 }
  - id: custody
    ru: "опека (правовая)"
    examples:
      - pl: "To dziecko jest pod opieką wuja."
        ru: "Этот ребёнок под опекой дяди."
        source: { kind: translated, id: 357085 }
      - pl: "Dziewczynka została powierzona opiece babci."
        ru: "Девочку отдали на попечение бабушке."
        source: { kind: translated, id: 739343 }
  - id: under-care
    ru: "pod opieką — под присмотром, под наблюдением"
    examples:
      - pl: "Jestem teraz pod opieką lekarzy."
        ru: "Я сейчас под наблюдением врачей."
        source: { kind: translated, id: 732021 }
      - pl: "Zostawiła dzieci pod opieką ciotki."
        ru: "Она оставила детей под присмотром тёти."
        source: { kind: translated, id: 984685 }
notes:
  - { kind: government, text: "opieka NAD kimś — предлог nad с творительным падежом: opieka nad dziećmi «уход за детьми». Русское «уход за» тоже с творительным, но предлог другой." }
  - { kind: usage, text: "Женский род: ta opieka, tej opieki. Множественного числа в живой речи практически не образует." }
  - { kind: usage, text: "opieka zdrowotna «здравоохранение», opieka społeczna «социальное обеспечение», opieka medyczna «медицинская помощь»." }
  - { kind: usage, text: "pod opieką «под присмотром, под опекой» — самый частый оборот со словом." }
collocations:
  - { pl: "opieka nad dziećmi", ru: "уход за детьми" }
  - { pl: "opieka zdrowotna", ru: "здравоохранение" }
  - { pl: "pod opieką", ru: "под присмотром" }
  - { pl: "opieka społeczna", ru: "социальное обеспечение" }
family:
  - { pl: "opiekować się", ru: "заботиться", relation: derived }
  - { pl: "opiekun", ru: "опекун", relation: derived }
  - { pl: "opiekuńczy", ru: "заботливый, опекунский", relation: derived }
etymology: "От opiekać się «заботиться», того же корня, что piecza «попечение». Русские «опека» и «печься о ком-то» — прямая родня."
memory: "opieka — «забота, уход, опека». Управление: opieka NAD kimś, предлог nad с творительным — opieka nad dziećmi. А pod opieką значит «под присмотром»."
