# review
id: zawdzieczac
format: 2
lemma: "zawdzięczać"
rank: 2357
pos: verb
aspect: imperf
pron: { cyr: "завдзе́нчаць" }
senses:
  - id: owe-to
    ru: "быть обязанным (кому-л. чем-л.)"
    examples:
      - pl: "To, że jeszcze żyję, zawdzięczam tobie."
        ru: "Благодаря тебе я еще живой."
        source: { kind: tatoeba, id: 348650 }
      - pl: "Zawdzięczam mu życie."
        ru: "Я обязан ему жизнью."
        source: { kind: translated, id: 363542 }
      - pl: "Zawdzięczam wszystko tobie."
        ru: "Я всем обязан тебе."
        source: { kind: translated, id: 2279912 }
  - id: attribute-to
    ru: "быть обязанным (чему-л.), объяснять чем-л."
    examples:
      - pl: "Ona swój sukces zawdzięcza ciężkiej pracy."
        ru: "Своим успехом она обязана тяжёлому труду."
        source: { kind: translated, id: 882971 }
      - pl: "Nasz sukces zawdzięczamy głównie jego staraniu."
        ru: "Нашим успехом мы обязаны главным образом его стараниям."
        source: { kind: translated, id: 359350 }
notes:
  - { kind: government, text: "Два дополнения сразу: ЧТО в винительном и КОМУ в дательном — zawdzięczam ci życie «я обязан тебе жизнью». Русский ставит «жизнью» в творительный, польский — в винительный. Это главная ловушка слова." }
  - { kind: false-friend, text: "От dzięki «благодаря» и dziękować «благодарить». Буквально «воздавать благодарностью»." }
  - { kind: usage, text: "Когда обязаны не человеку, а обстоятельству, дательный всё равно нужен: zawdzięcza sukces pracy «успехом он обязан работе»." }
  - { kind: usage, text: "Совершенного вида практически нет — глагол употребляется в несовершенном." }
collocations:
  - { pl: "zawdzięczać komuś życie", ru: "быть обязанным кому-л. жизнью" }
  - { pl: "wszystko zawdzięczam tobie", ru: "всем я обязан тебе" }
etymology: "От dzięki «благодаря», dziękować «благодарить» — буквально «воздавать благодарностью»."
memory: "zawdzięczać — «быть обязанным». Запомните падежи: ЧТО в винительном, КОМУ в дательном — zawdzięczam ci życie. Русский ставит «жизнью» в творительный, польский — нет."
idioms:
  - { pl: "zawdzięczać komuś życie", ru: "быть обязанным кому-л. жизнью" }
formExamplesSkip:
  - { form: "zawdzięczani", reason: "страдательное причастие мужского лица, а zawdzięczać ставит человека в ДАТЕЛЬНЫЙ падеж, а то, чем обязаны, — в винительный: zawdzięczać komuś posadę. Подлежащим страдательного оборота становится место или успех, но не человек" }
