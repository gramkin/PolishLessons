# review
id: w
lemma: w
rank: 5
pos: prep
pron: { cyr: "в" }
senses:
  - id: where
    ru: "в (где? — с предложным падежом)"
    examples:
      - pl: "Mieszkam w mieście."
        ru: "Я живу в городе."
        source: { kind: tatoeba, id: 359195 }
      - pl: "Spaliśmy w namiocie."
        ru: "Мы спали в палатке."
        source: { kind: tatoeba, id: 1170263 }
      - pl: "Widziałem cię we śnie."
        ru: "Во сне я видел тебя."
        source: { kind: tatoeba, id: 2008942 }
  - id: into
    ru: "в (во что? — с винительным падежом)"
    examples:
      - pl: "Wierzymy w Boga."
        ru: "Мы верим в бога."
        source: { kind: tatoeba, id: 361318 }
      - pl: "Grają w szachy."
        ru: "Они играют в шахматы."
        source: { kind: tatoeba, id: 999314 }
  - id: when
    ru: "в (когда? — о годах, месяцах, днях недели)"
    examples:
      - pl: "Lincoln umarł w 1865."
        ru: "Линкольн умер в 1865."
        source: { kind: tatoeba, id: 555197 }
notes:
  - kind: government
    text: "Где? — w + предложный (miejscownik): w domu, w mieście. Во что? — w + винительный (biernik): wierzyć w coś, grać w szachy. Дни недели тоже с винительным: w piątek, we wtorek."
  - kind: pronunciation
    text: "Перед глухими согласными w оглушается и звучит как «ф»: w Polsce — «ф по́льсцэ». Перед сочетаниями, начинающимися на w/f, пишется we: we wtorek, we Francji."
collocations:
  - { pl: "w domu", ru: "дома" }
  - { pl: "w końcu", ru: "в конце концов, наконец" }
  - { pl: "w piątek", ru: "в пятницу" }
  - { pl: "w ogóle", ru: "вообще" }
