# review
id: sikac
format: 2
lemma: "sikać"
rank: 4781
pos: verb
pron: { cyr: "си́каць" }
senses:
  - id: pee
    ru: "писать, мочиться (разг.)"
    examples:
      - pl: "Pies sika na każde drzewo."
        ru: "Пёс писает на каждое дерево."
        source: { kind: authored }
      - pl: "Chce mi się sikać."
        ru: "Мне хочется в туалет."
        source: { kind: authored }
      - pl: "Dziecko jeszcze sika w pieluchę."
        ru: "Ребёнок ещё писает в подгузник."
        source: { kind: authored }
  - id: squirt
    ru: "брызгать, бить струёй"
    examples:
      - pl: "Dzieci sikały na siebie wodą z pistoletów."
        ru: "Дети брызгали друг на друга водой из пистолетов."
        source: { kind: authored }
      - pl: "Z rury sika woda."
        ru: "Из трубы хлещет вода."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SIKAĆ — разговорное «писать» (о малой нужде), а не «искать» (SZUKAĆ). Детское — ROBIĆ SIUSIU, вежливое — IŚĆ DO TOALETY, медицинское — ODDAWAĆ MOCZ. Второе значение — «брызгать струёй»: WODA SIKA Z KRANU." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYSIKAĆ SIĘ «сходить по-маленькому», однократный — SIKNĄĆ «брызнуть». Спряжение на -AM: SIKAM, SIKASZ, SIKAJĄ. Безличное SIKANO в карточку не включено. CHCE MI SIĘ SIKAĆ — «мне хочется в туалет»." }
  - { kind: government, text: "Куда — NA с винительным: SIKAĆ NA TRAWNIK; DO с родительным: DO NOCNIKA. Чем брызгать — творительный: SIKAĆ WODĄ. На кого — NA с винительным: SIKAĆ NA SIEBIE." }
  - { kind: pronunciation, text: "Читается «си́каць»: SI — мягкое «си», ударение на первом слоге. SIKA — «си́ка»." }
  - { kind: register, text: "Разговорное, чуть грубоватое слово: о детях и животных — нормально, о взрослых — фамильярно. В вежливой речи — IŚĆ DO TOALETY." }
collocations:
  - { pl: "chce mi się sikać", ru: "мне хочется в туалет" }
  - { pl: "sikać do nocnika", ru: "писать в горшок" }
  - { pl: "woda sika", ru: "вода хлещет струёй" }
family:
  - { pl: "wysikać", ru: "сходить по-маленькому (WYSIKAĆ SIĘ)", relation: aspect }
  - { pl: "toaleta", ru: "туалет", relation: root, id: toaleta }
  - { pl: "siknąć", ru: "брызнуть", relation: derived }
etymology: "Звукоподражательное слово, передающее звук тонкой струи. Отсюда же SIKAWKA — пожарный насос."
memory: "Sikać — писать (разг.): pies sika na drzewo. Chce mi się sikać — хочу в туалет. Вежливо — iść do toalety."
idioms:
  - { pl: "sikać ze śmiechu", ru: "описаться от смеха" }
formExamplesSkip:
  - { form: "sikano", reason: "безличная форма не употребляется" }
