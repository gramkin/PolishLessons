notes:
  - { kind: government, text: "Формально это наречие, но ведёт себя как предлог и требует родительного падежа: PONIŻEJ ZERA, PONIŻEJ NORMY, PONIŻEJ OCZEKIWAŃ, PONIŻEJ KOLANA. Русское «ниже» делает ровно то же — «ниже нуля», «ниже нормы», — так что конструкция переносится без изменений, и это редкий случай полного совпадения. Противоположность — POWYŻEJ, с тем же родительным: POWYŻEJ ZERA. Не путать с предлогом POD, который требует творительного при ответе на вопрос «где»: POD STOŁEM «под столом», но PONIŻEJ STOŁU «ниже стола». Разница смысловая: POD — прямо под чем-то, PONIŻEJ — ниже по уровню или по шкале." }
  - { kind: usage, text: "Два употребления разводятся по наличию дополнения. С родительным это сравнение по шкале: PONIŻEJ ZERA, PONIŻEJ ŚREDNIEJ, PONIŻEJ GODNOŚCI «ниже достоинства». Без дополнения — указание на место в тексте: PATRZ PONIŻEJ, OPISANO PONIŻEJ, JAK PONIŻEJ. Второе употребление характерно для документов, инструкций и научных текстов, и русский в этом месте говорит точно так же: «см. ниже». В устной речи о температуре и ценах слово частотно, а в разговоре о расположении предметов чаще скажут POD или NIŻEJ." }
  - { kind: pronunciation, text: "Читается «пони́жэй», ударение на предпоследнем слоге. Буква Ż даёт твёрдое «ж», а конечное -EJ звучит «эй», не «ей»: польское E никогда не смягчает предыдущую согласную. Сравните с NIŻEJ «ни́жэй» и POWYŻEJ «повы́жэй» — все три строятся одинаково. Приставка PO- здесь произносится отчётливо, без редукции, которая обязательна в русском «пониже»." }
collocations:
  - { pl: "poniżej zera", ru: "ниже нуля" }
  - { pl: "poniżej średniej", ru: "ниже среднего" }
  - { pl: "patrz poniżej", ru: "смотри ниже" }
family:
