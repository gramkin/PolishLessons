etymology: "Собрано из приставки PO- и сравнительной степени NIŻEJ «ниже», от NISKO «низко». Русское «пониже» устроено буквально так же, из «по» и «ниже», но в русском это разговорная форма со смягчающим оттенком — «сядь пониже», — тогда как польское PONIŻEJ стало нейтральным служебным словом и вытеснило простое NIŻEJ в роли сравнения по шкале. Корень общий: праславянское *nizъ дало польское NISKI и русское «низкий», и чередование Z и Ż в польском NISKO и NIŻEJ — то же самое, что в русском «низко» и «ниже». Так что всё слово разбирается на знакомые части, и запоминать нужно только управление родительным падежом."
memory: "Наречие, которое требует родительного падежа, как предлог: poniżej zera, poniżej normy — точно как русское «ниже нуля». Противоположность — powyżej. Не путать с pod: pod stołem «прямо под столом», poniżej stołu «ниже по уровню». Без дополнения значит «ниже в тексте»: patrz poniżej."
