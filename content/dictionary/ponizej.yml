pron: { cyr: "пони́жэй" }
senses:
  - id: below-gen
    ru: "ниже (чего-то), меньше (чего-то)"
    examples:
      - pl: "Poniżej zera woda zamarza."
        ru: "Ниже нуля вода замерзает."
        source: { kind: authored }
