notes:
  - { kind: false-friend, text: "Расхождение практическое и частое. Русская «локализация» значит прежде всего ограничение, сдерживание: локализовать пожар, локализация конфликта. Польская LOKALIZACJA значит место, расположение — и это первое слово в любом объявлении о продаже квартиры: DOBRA LOKALIZACJA, LOKALIZACJA W CENTRUM. Русскому в этом смысле отвечают «расположение» и «местоположение». Второе польское значение, определение места чего-то, русскому знакомо: LOKALIZACJA AWARII это «определение места аварии». А вот ограничить пожар по-польски будет OPANOWAĆ или OGRANICZYĆ, и слово LOKALIZACJA здесь не годится." }
  - { kind: usage, text: "Десять форм, женский род, основа на -CJA. Форма LOKALIZACJI покрывает родительный, дательный и местный единственного и служит обычным родительным множественного. Рядом стоит старая форма LOKALIZACYJ, с нулевым окончанием: она встречается в документах и в текстах прошлого века, как EGZEKUCYJ и AMUNICYJ. Именительный и винительный множественного — LOKALIZACJE. Этот образец покрывает сотни слов на -CJA, и выучив одно, вы получаете их все: STACJA, LEKCJA, INFORMACJA, PORCJA." }
  - { kind: pronunciation, text: "Читается «локализа́ця», пять слогов, ударение на четвёртом. Буквосочетание CJA стягивается в один слог и звучит как «ця», поэтому слово короче русского «локализация» на целый слог — это главное отличие на слух. Буква Z звонкая. В форме LOKALIZACJI слышно «локализа́ци». В форме LOKALIZACJĄ последнее Ą даёт «он». В форме LOKALIZACYJ буква Y звучит как «ы»: «локализа́цый»." }
  - { kind: register, text: "Слово нейтральное, с сильным уклоном в деловую и риелторскую речь. Устойчивые сочетания: DOBRA LOKALIZACJA, ATRAKCYJNA LOKALIZACJA, LOKALIZACJA W CENTRUM, ZMIENIĆ LOKALIZACJĘ. В разговоре о встрече слово часто заменяет собой адрес: PODAJ LOKALIZACJĘ значит «скинь, где это». В технике LOKALIZACJA означает обнаружение неисправности, в медицине — расположение изменений. Прилагательное LOKALIZACYJNY относится к документам о размещении постройки." }
