etymology: "От LOKALNY «местный», из латинского LOCALIS, от LOCUS «место» — того же корня, что в словах «локальный», «локация», «аллокация» и в польском LOKAL «помещение». Суффикс -IZACJA, через латинское -IZATIO, означает действие и его результат, и потому слово покрывает и само размещение, и получившееся место. Русский взял и основу, и суффикс в том же виде, но закрепил за словом другое значение — ограничение, — отправив идею места к исконным словам «расположение» и «местоположение». Так из одного латинского корня в двух языках вышли слова, которые нельзя подставлять друг за друга."
memory: "Ловушка практическая: польская lokalizacja значит «расположение, местоположение» — первое слово в объявлении о квартире, dobra lokalizacja, — а русская «локализация» значит ограничение, сдерживание. Второе польское значение, определение места, русскому понятно: lokalizacja awarii. Из латинского locus «место», как lokal «помещение». Падежи как у всех слов на -cja: lokalizacji делает четыре падежа, и есть архаичное lokalizacyj, как egzekucyj."
