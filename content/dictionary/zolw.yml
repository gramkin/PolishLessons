notes:
  - { kind: false-friend, text: "Названия у этого зверя в двух языках совсем разные, и причина любопытная. Поляк сохранил старое славянское слово, от которого у нас осталась только книжная «желвь». А русский назвал животное заново, по панцирю: «черепаха» от «черепа». Поэтому ŻÓŁW и «черепаха» не похожи ничем, хотя речь об одном и том же. По-польски «череп» это CZASZKA." }
  - { kind: usage, text: "Десять форм, мужской род, и слово одушевлённое, а значит винительный падеж равен родительному: WIDZIAŁEM ŻÓŁWIA, а не ŻÓŁW. В косвенных падежах основа смягчается и появляется I: ŻÓŁW, но ŻÓŁWIA, ŻÓŁWIEM, ŻÓŁWIU. Прилагательное ŻÓŁWI значит «черепаший» и живёт прежде всего в обороте ŻÓŁWIM KROKIEM." }
  - { kind: government, text: "Видеть черепаху — WIDZIEĆ ŻÓŁWIA, винительный, равный родительному, потому что слово одушевлённое. Черепашьим шагом — ŻÓŁWIM KROKIEM, творительный без предлога, как и по-русски. Панцирь черепахи — SKORUPA ŻÓŁWIA, родительный. О черепахе — O ŻÓŁWIU, местный падеж с мягким окончанием." }
  - { kind: pronunciation, text: "Читается «жууф», один слог, и поэтому знак ударения не нужен. Три правила сходятся здесь сразу: Ż даёт «ж», Ó даёт «у», Ł тоже «у», а конечная W оглушается в «ф». Получается два «у» подряд, ровно как в DŁUGI «дуу́ги». В косвенных падежах появляется второй слог: ŻÓŁWIA это «жу́ува», ŻÓŁWIEM — «жу́увем»." }
  - { kind: register, text: "Слово нейтральное, из первых, какие узнают дети. ŻÓŁW LĄDOWY это наземная черепаха, ŻÓŁW MORSKI — морская, ŻÓŁW BŁOTNY — болотная, единственная дикая в Польше и строго охраняемая. Оборот ŻÓŁWIM KROKIEM «черепашьим шагом» живой и частый, о медленной работе и о пробках на дороге." }
