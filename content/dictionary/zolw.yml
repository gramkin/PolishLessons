etymology: "Праславянское название черепахи, от которого в русском литературном языке остался только книжный след — «желвь», да ещё «желвак» в смысле шишки, по сходству с округлым панцирем. Польский это слово сохранил целиком, а русский заменил его на «черепаху», произведя новое имя от «черепа», то есть от той же округлой скорлупы. Два языка назвали зверя по одному и тому же признаку, но в разное время и разными словами."
memory: "Черепаха. Слова не похожи вовсе: поляк сохранил старое славянское название, от которого у нас осталась книжная «желвь», а русский назвал зверя заново по панцирю, от «черепа». Читается «жууф», один слог: z с точкой даёт «ж», o с черточкой и l со штрихом по «у», а конечная w оглушается в «ф». Одушевлённое, поэтому widzialem zolwia. И запомните zolwim krokiem."
idioms:
  - { pl: "żółwim krokiem", ru: "черепашьим шагом" }
