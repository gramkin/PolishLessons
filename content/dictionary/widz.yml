notes:
  - { kind: false-friend, text: "Корень прозрачен: WIDZIEĆ значит «видеть», и WIDZ — тот, кто видит, то есть зритель. Русское «зритель» построено точно так же, от «зреть», и потому слово понятно сразу. Соседние слова расходятся сильнее: WIDOK это «вид», WIDZENIE — и «зрение», и «свидание» в тюрьме, а WIDOWNIA — зрительный зал. Отдельно стоит различение с карточкой PUBLICZNOŚĆ: WIDZOWIE это отдельные люди, которых можно пересчитать, PUBLICZNOŚĆ — собирательное имя всего зала. Телезрителя называют WIDZ, радиослушателя SŁUCHACZ." }
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое лицо. Главная особенность — именительный множественного: у слова есть только мужское-личное WIDZOWIE, и обычной формы на -E, то есть WIDZE, в языке нет вовсе. Так ведут себя слова, обозначающие людей и кончающиеся на мягкий или шипящий согласный, и это стоит запомнить отдельно, потому что соседнее CYWIL даёт CYWILE, а KOWBOJ даёт KOWBOJE. Родительный множественного — WIDZÓW. Винительный единственного равен родительному, WIDZA. Местный и звательный единственного — WIDZU." }
  - { kind: pronunciation, text: "Читается «виц», один слог. Буквосочетание DZ — это один звонкий звук, русское «дз», но на конце слова оно оглушается и звучит как «ц». Поэтому именительный падеж на слух совпадает с русским «виц», а не «видз». В косвенных формах звонкость возвращается, потому что следом идёт гласный: WIDZA звучит «ви́дза», WIDZEM — «ви́дзэм», WIDZOWIE — «видзо́ве». В форме WIDZÓW буква Ó даёт «у», а конечное W оглушается: «ви́дзуф»." }
  - { kind: register, text: "Слово нейтральное, частое в телевидении, кино, театре и спорте. Устойчивые обороты: DROGI WIDZU «дорогой зритель» в обращении с экрана, WIDZOWIE I SŁUCHACZE, WIDOWNIA PEŁNA WIDZÓW. В статистике говорят LICZBA WIDZÓW и ŚREDNIA WIDOWNIA. Производные: WIDOWNIA «зрительный зал», WIDOWISKO «зрелище», WIDOWISKOWY «зрелищный». Пренебрежительного оттенка у слова нет, в отличие от GAPIE «зеваки», которым называют тех, кто смотрит на происшествие." }
