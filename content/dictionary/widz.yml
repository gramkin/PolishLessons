etymology: "От глагола WIDZIEĆ, праславянское *viděti, того же корня, что русское «видеть» и латинское VIDERE. Само существительное образовано суффиксом деятеля, а сочетание DZ на конце выросло из старого *dj: праславянское *vidjь дало польское WIDZ, тогда как русский в этом положении дал бы «ж», как в «вижу». Отсюда и соответствие: польскому DZ отвечает русское Ж в целом ряде слов — MIEDZA и «межа», SADZA и «сажа», CUDZY и «чужой». Зная это правило, можно опознать десятки слов, которые иначе выглядят чужими. Русское «зритель» построено по той же мысли, но от другого глагола, от «зреть», и потому два слова совпадают по смыслу и расходятся по корню."
memory: "Прозрачно: widzieć «видеть», widz — тот, кто видит, то есть зритель. Главное в парадигме: множественное только widzowie, формы widze не существует вовсе — а вот cywil даёт cywile и kowboj даёт kowboje. Звук: dz на конце оглушается, слово звучит «виц». И полезное правило: польскому dz часто отвечает русское ж — miedza и межа, sadza и сажа, cudzy и чужой."
