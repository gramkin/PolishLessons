# review
id: stanowisko
format: 2
lemma: "stanowisko"
rank: 1518
pos: noun
pron: { cyr: "станови́ско" }
senses:
  - id: post
    ru: "должность, пост"
    examples:
      - pl: "Jakie masz stanowisko?"
        ru: "Какая у тебя должность?"
        source: { kind: translated, id: 567142 }
      - pl: "Zrezygnował ze stanowiska ministra."
        ru: "Он ушёл с поста министра."
        source: { kind: translated, id: 899584 }
      - pl: "Prezydent mianował go na ważne stanowisko."
        ru: "Президент назначил его на важную должность."
        source: { kind: translated, id: 1603995 }
  - id: stance
    ru: "позиция, точка зрения"
    examples:
      - pl: "Bardzo dobrze rozumiem twoje stanowisko."
        ru: "Я очень хорошо понимаю твою позицию."
        source: { kind: translated, id: 600252 }
      - pl: "Nie określił jasno swego stanowiska."
        ru: "Он не определил ясно своей позиции."
        source: { kind: translated, id: 357277 }
notes:
  - { kind: usage, text: "Три значения: «должность» (stanowisko ministra), «позиция, точка зрения» (zająć stanowisko) и «рабочее место» (stanowisko pracy)." }
  - { kind: government, text: "zrezygnować ze stanowiska — «уйти с должности», с родительным." }
  - { kind: usage, text: "zająć stanowisko w jakiejś sprawie — «занять позицию по какому-то вопросу»." }
  - { kind: usage, text: "От stanowić «устанавливать», в основе stać «стоять»." }
collocations:
  - { pl: "stanowisko pracy", ru: "рабочее место" }
  - { pl: "zająć stanowisko", ru: "занять позицию" }
  - { pl: "zrezygnować ze stanowiska", ru: "уйти с должности" }
etymology: "От stanowić «устанавливать», в основе stać «стоять» (праславянское *stati). Русское «стоять» того же корня, а «должность» собрана иначе."
memory: "stanowisko — и «должность», и «позиция (мнение)», и «рабочее место». Zrezygnować ze stanowiska «уйти с должности», zająć stanowisko «занять позицию»."
idioms:
