etymology: "От stanowić «устанавливать», в основе stać «стоять» (праславянское *stati). Русское «стоять» того же корня, а «должность» собрана иначе."
memory: "stanowisko — и «должность», и «позиция (мнение)», и «рабочее место». Zrezygnować ze stanowiska «уйти с должности», zająć stanowisko «занять позицию»."
