notes:
  - { kind: usage, text: "Три значения: «должность» (stanowisko ministra), «позиция, точка зрения» (zająć stanowisko) и «рабочее место» (stanowisko pracy)." }
  - { kind: government, text: "zrezygnować ze stanowiska — «уйти с должности», с родительным." }
  - { kind: usage, text: "zająć stanowisko w jakiejś sprawie — «занять позицию по какому-то вопросу»." }
  - { kind: usage, text: "От stanowić «устанавливать», в основе stać «стоять»." }
collocations:
