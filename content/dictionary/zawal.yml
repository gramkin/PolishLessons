notes:
  - { kind: false-friend, text: "Слово выглядит как русский «завал», и это действительно одно и то же слово, но главные значения разошлись далеко. В польском ZAWAŁ прежде всего медицинский термин: инфаркт. ZAWAŁ SERCA это «инфаркт», и в девяти случаях из десяти речь именно о сердце. Русский «завал» в смысле беспорядка или горы дел по-польски будет BAŁAGAN или NATŁOK, а завал на дороге — ZATOR. Второе польское значение, горный обвал, русскому «завалу» ближе, но и оно в обычной речи встречается редко." }
  - { kind: pronunciation, text: "Читается «за́вау», два слога, ударение на первом. Конечная Ł звучит как «у», а не как «л», поэтому слово кончается на «ау», и чтение «завал» будет ошибкой. В остальных формах Ł стоит перед гласной и звучит точно так же: ZAWAŁU это «зава́уу», ZAWAŁEM «зава́уэм». Это общее правило для всех польских слов с Ł, и оно же работает в ZŁO «зуо», MAŁO «мауо», BYŁ «быу»." }
  - { kind: government, text: "Здесь две схемы, и одна из них требует правки при переводе. Получить инфаркт — DOSTAĆ ZAWAŁU, с родительным падежом, тогда как по-русски «получить инфаркт» просит винительного. Умереть от инфаркта — UMRZEĆ NA ZAWAŁ, предлог NA с винительным, а русский ставит «от» с родительным; та же польская схема в UMRZEĆ NA RAKA «умереть от рака» и CHOROWAĆ NA GRYPĘ «болеть гриппом». В местном падеже слово берёт предлог W: W ZAWALE LICZY SIĘ CZAS." }
  - { kind: usage, text: "Существительное мужского рода неодушевлённое, десять падежных форм. Полный термин — ZAWAŁ SERCA, но в речи его почти всегда сокращают до одного слова ZAWAŁ, как и русские говорят просто «инфаркт». Множественное число совершенно обычно в обоих значениях: ZAWAŁY ZDARZAJĄ SIĘ CORAZ MŁODSZYM. Местный падеж имеет вид ZAWALE, где Ł перед E смягчается в L, и это регулярное чередование: ŁO и ŁU против LE." }
  - { kind: register, text: "В прямом значении слово медицинское и серьёзное, в разговоре его употребляют с преувеличением: O MAŁO ZAWAŁU NIE DOSTAŁEM значит «меня чуть удар не хватил». Частые обороты: ZAWAŁ SERCA, PRZEJŚĆ ZAWAŁ «перенести инфаркт», UMRZEĆ NA ZAWAŁ, ZAPOBIEGAĆ ZAWAŁOWI «предотвращать инфаркт». В городском языке появилось ZAWAŁ KOMUNIKACYJNY, то есть транспортный паралич, и здесь польское слово снова сближается с русским «завалом»." }
