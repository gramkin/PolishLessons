etymology: "От глагола ZAWALIĆ «обвалить, завалить», а тот от WAŁ «вал», то же слово, что русский «вал». Исходный образ прямой: то, что обвалилось и перегородило проход. Русское «завал» выросло из того же глагола тем же способом и сохранило исходное значение, а польское слово медицина взяла как термин: при инфаркте закупоривается сосуд, то есть происходит внутренний завал. Так общее слово разошлось по областям: в русском оно осталось при беспорядке и обвале, в польском ушло в кардиологию. Из того же гнезда ZAWALIĆ SIĘ «обвалиться» и ZAWALONY «заваленный»."
memory: "То же слово, что «завал», но главное значение другое: по-польски это прежде всего инфаркт, zawał serca. Русский «завал» в смысле беспорядка будет bałagan, а на дороге zator. Читается «за́вау», потому что ł это «у». Управление требует правки дважды: dostać zawału с родительным, а umrzeć NA zawał с винительным, где русский ставит «от». Та же схема в chorować na grypę «болеть гриппом»."
idioms:
