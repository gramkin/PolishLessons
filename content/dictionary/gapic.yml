lemma: "gapić"
rank: 1818
pos: verb
pron: { cyr: "га́пиць" }
senses:
  - id: gawp
    ru: "разг. таращиться, глазеть (gapić się na coś)"
    examples:
      - pl: "Nie gap się na mnie."
        ru: "Не таращись на меня."
        source: { kind: authored }
      - pl: "Gapił się na nią przez cały wykład."
        ru: "Он таращился на неё всю лекцию."
        source: { kind: authored }
      - pl: "Gapiono się na nas jak na dziwolągi."
        ru: "На нас глазели как на диковины."
        source: { kind: authored }
  - id: gawping
    ru: "gapienie — глазение, пустое разглядывание"
    examples:
      - pl: "Gapienie się w telefon zajmuje mu pół dnia."
        ru: "Глазение в телефон занимает у него полдня."
        source: { kind: authored }
      - pl: "Od gapienia się w ekran bolą oczy."
        ru: "От глазения в экран болят глаза."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово РАЗГОВОРНОЕ и с оттенком упрёка: так говорят о праздном, бессмысленном разглядывании. Нейтрально будет patrzeć «смотреть» или przyglądać się «разглядывать». Nie gap się — обычное родительское замечание ребёнку, примерно как русское «не таращись»." }
  - { kind: government, text: "Глагол употребляется ПОЧТИ ТОЛЬКО с się: gapić się. Без się он в живой речи не встречается. Смотрят НА что — предлог NA с ВИНИТЕЛЬНЫМ: gapić się na kogoś, na wystawę, w telefon. Русское «таращиться на кого-то» строится так же." }
  - { kind: usage, text: "Объём парадигмы — 52 формы, и страдательного причастия среди них нет вовсе: глагол непереходный и возвратный, винительного дополнения у него не бывает, значит некого делать подлежащим. Формы вроде *gapiony не существует. Так же ведут себя śmierdzieć, dreptać и zasnąć." }
  - { kind: pronunciation, text: "ЗАПОМНИТЕ ПАРУ ЦЕЛИКОМ, и русский поможет. Gapić się значит «таращиться, разинув рот», а приставочное przegapić — «прозевать, пропустить». Русский построил «прозевать» от «зевать» точно тем же приёмом: ты упустил вещь, потому что стоял с открытым ртом. Один образ, два языка, одна логика — и два слова запоминаются сразу." }
collocations:
  - { pl: "gapić się na kogoś", ru: "таращиться на кого-л." }
  - { pl: "nie gap się", ru: "не таращись" }
  - { pl: "jechać na gapę", ru: "ехать зайцем" }
family:
  - { pl: "gapa", ru: "разиня, зевака", relation: root }
  - { pl: "przegapić", ru: "прозевать, пропустить", relation: derived }
  - { pl: "gapowaty", ru: "рассеянный, нерасторопный", relation: derived }
etymology: "От существительного gapa «разиня, зевака» — слова выразительного, звукоподражательного происхождения, связанного с образом разинутого рта. Прямого русского родственника у корня нет, но образ тот же, что в «разевать рот» и «зевать». Из того же гнезда идёт выражение jechać na gapę «ехать зайцем», буквально «ехать разиней»."
memory: "gapić się — разговорное «таращиться», всегда с się и с предлогом na. Русского родственника у корня нет, зато есть идиома: jechać na gapę «ехать зайцем». И страдательного причастия у глагола нет — он непереходный."
idioms:
  - { pl: "jechać na gapę", ru: "ехать зайцем" }
  - { pl: "nie gap się", ru: "не таращись" }
