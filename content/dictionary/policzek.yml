etymology: "От предлога PO и LICO «лицо», от праславянского корня, давшего и русское «лицо», и «облик», и «личину». Буквально это «то, что по лицу», то есть щека. Русское «пощёчина» собрано точно так же, только от «щеки»: сначала место, потом удар по этому месту. Переход от части тела к удару по ней случился в обоих языках независимо, и это хороший пример того, как два языка приходят к одному решению разными словами."
memory: "Разбирается на части: po плюс lico «лицо», то есть «то, что по лицу», щека. Русская «пощёчина» построена так же, только от «щеки», и в обоих языках название места стало названием удара. Поэтому policzek это и щека, и пощёчина, а различает их глагол: pocałować w policzek против wymierzyć policzek. Читается «поли́чек», и оба o произносятся отчётливо, без редукции в «а»."
idioms:
  - { pl: "dać komuś policzek", ru: "дать кому-либо пощёчину" }
