notes:
  - { kind: false-friend, text: "Слово собрано из PO и LICO «лицо», то есть буквально «то, что по лицу». Русский построил своё слово тем же способом, но от другой части тела: «пощёчина» это «по щеке». Образ один, корни разные, и оба языка пришли к тому, что название места удара стало названием самого удара. Польское LICO сегодня книжное, зато OBLICZE «облик» живо, и русский узнаёт в нём своё слово сразу." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E выпадает в косвенных падежах: POLICZEK, но POLICZKA, POLICZKIEM. Оба значения, щека и пощёчина, живут в одном слове и различаются только контекстом и глаголом: POCAŁOWAĆ W POLICZEK это «поцеловать в щёку», а WYMIERZYĆ POLICZEK это «дать пощёчину». Множественное POLICZKI почти всегда о щеках, не об ударах." }
  - { kind: government, text: "Поцеловать в щёку — предлог W с винительным: POCAŁOWAĆ W POLICZEK, и русский строит оборот так же. По щекам — предлог PO с местным падежом: PO POLICZKACH. Дать пощёчину кому-либо — DAĆ KOMUŚ POLICZEK или WYMIERZYĆ KOMUŚ POLICZEK, дательный на лицо и винительный на удар. В переносном смысле пощёчина кому-то — POLICZEK DLA KOGOŚ, предлог DLA с родительным." }
  - { kind: pronunciation, text: "Читается «поли́чек», три слога, ударение на втором. Оба O звучат отчётливо, без русской редукции в «а»: не «палычек», а «поличек». Сочетание CZ даёт «ч». В родительном POLICZKA беглое E выпадает, и слышно «поли́чка», а в творительном POLICZKIEM сочетание KIE даёт мягкое «ке», то есть «поли́чкем». Ударение во всех формах остаётся на предпоследнем слоге." }
  - { kind: register, text: "Прямое значение нейтральное и повседневное: CZERWONE POLICZKI «красные щёки», POCAŁOWAĆ W POLICZEK, DOŁECZEK W POLICZKU «ямочка на щеке». Второе значение сильное и в быту звучит редко, зато часто в газетах и в политике: TO POLICZEK DLA NAS WSZYSTKICH «это пощёчина всем нам». Там, где русский скажет «оскорбление», поляк нередко возьмёт именно POLICZEK, и звучит это резче." }
