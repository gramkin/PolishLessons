notes:
  - { kind: false-friend, text: "STUDENTKA — только «студентка вуза». Школьница — UCZENNICA. Учиться в вузе — STUDIOWAĆ, а в школе — UCZYĆ SIĘ. Студентка какого курса — STUDENTKA KTÓREGO ROKU." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: O STUDENTCE. Родительный множественного — STUDENTEK. Звательный STUDENTKO не учим." }
