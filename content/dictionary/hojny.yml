format: 2
lemma: "hojny"
rank: 4961
pos: adj
pron: { cyr: "хо́йны" }
senses:
  - id: generous
    ru: "щедрый"
    examples:
      - pl: "Dziadek był zawsze hojny dla wnuków."
        ru: "Дедушка всегда был щедр к внукам."
        source: { kind: authored }
      - pl: "Dostał hojny napiwek."
        ru: "Он получил щедрые чаевые."
        source: { kind: authored }
      - pl: "To najhojniejszy darczyńca fundacji."
        ru: "Это самый щедрый жертвователь фонда."
        source: { kind: authored }
  - id: abundant
    ru: "обильный, богатый (о награде, угощении)"
    examples:
      - pl: "Stół był zastawiony hojnym poczęstunkiem."
        ru: "Стол был уставлен обильным угощением."
        source: { kind: authored }
      - pl: "Natura była dla nich hojna."
        ru: "Природа была к ним щедра."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому HOJNY ничего не подсказывает, а слово частое: это «щедрый». Русское «щедрый» по-польски и есть HOJNY, а SZCZODRY — книжный синоним, близкий к русскому по звуку. Противоположность — SKĄPY, «скупой»." }
  - { kind: usage, text: "Полная парадигма: HOJNY, HOJNIEJSZY, NAJHOJNIEJSZY. Все степени живые. Мужское-личное: HOJNI, HOJNIEJSI, NAJHOJNIEJSI — о щедрых людях, спонсорах, дарителях." }
  - { kind: government, text: "Щедрый к кому-то — HOJNY DLA KOGOŚ, DLA с родительным, или WOBEC KOGOŚ. Щедрый на что-то — HOJNY W + местный: HOJNY W POCHWAŁACH, «щедрый на похвалу». Наречие HOJNIE — «щедро»." }
  - { kind: pronunciation, text: "Читается «хо́йны», два слога, ударение на первом. H — «х», J — «й». В HOJNIEJSZY: «хойне́йшы»." }
  - { kind: register, text: "Нейтральное слово, тёплая похвала. HOJNY DARCZYŃCA, HOJNY SPONSOR — стандарт в благодарственных письмах. HOJNY GEST — «щедрый жест»." }
collocations:
  - { pl: "hojny napiwek", ru: "щедрые чаевые" }
  - { pl: "hojny darczyńca", ru: "щедрый жертвователь" }
  - { pl: "hojny gest", ru: "щедрый жест" }
family:
  - { pl: "hojnie", ru: "щедро", relation: derived, id: hojnie }
  - { pl: "hojność", ru: "щедрость", relation: derived }
  - { pl: "skąpy", ru: "скупой", relation: root }
etymology: "Происхождение спорно. Чаще всего HOJNY связывают с общеславянским *gojь, «изобилие, достаток», и с глаголом GOIĆ, «заживлять, питать»; в русских диалектах есть «гоить». В польском слово стало главным для «щедрый»."
memory: "Hojny — щедрый: hojny dziadek, hojny napiwek. Hojniejszy, najhojniejszy. Противоположность — skąpy. Читается «хо́йны»."
idioms:
  - { pl: "hojną ręką", ru: "щедрой рукой" }
