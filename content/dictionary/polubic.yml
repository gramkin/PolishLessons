# review
id: polubic
format: 2
lemma: "polubić"
rank: 2505
pos: verb
pron: { cyr: "полю́біць" }
senses:
  - id: take-a-liking
    ru: "проникнуться симпатией, начать нравиться"
    examples:
      - pl: "Od razu go polubiłem."
        ru: "Он мне сразу понравился."
        source: { kind: authored }
      - pl: "Polubiła nowe miasto."
        ru: "Ей понравился новый город."
        source: { kind: authored }
  - id: grow-fond
    ru: "привыкнуть и полюбить"
    examples:
      - pl: "Z czasem polubili tę pracę."
        ru: "Со временем они полюбили эту работу."
        source: { kind: authored }
      - pl: "Trudno go nie polubić."
        ru: "Его трудно не полюбить."
        source: { kind: authored }
  - id: social-like
    ru: "лайкнуть (в соцсетях)"
    examples:
      - pl: "Polubienie posta nic nie kosztuje."
        ru: "Лайкнуть пост ничего не стоит."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ЭТО НЕ «ПОЛЮБИТЬ» В ЛЮБОВНОМ СМЫСЛЕ. Polubić значит «проникнуться симпатией, начать нравиться»: polubiłem go — «он мне стал симпатичен». Влюбиться — это ZAKOCHAĆ SIĘ, а «любить» всерьёз — KOCHAĆ. Русское «полюбить» покрывает и то и другое, поэтому перевод в эту сторону легко уводит не туда." }
  - { kind: usage, text: "У ЭТОГО ГЛАГОЛА ЕСТЬ СОВСЕМ НОВОЕ ЗНАЧЕНИЕ. POLUB — это надпись на кнопке «лайк», а POLUBIENIE значит «лайк» как существительное: zebrać tysiąc polubień. Старые словари его не знают, но в сети оно сегодня самое частое. Родительного множественного в этой карточке нет, потому что генератор его не дал." }
  - { kind: usage, text: "Вид совершенный, и это видно по формам. Есть POLUBIWSZY — деепричастие прошедшего, которого у несовершенных не бывает, и нет форм на -ąc и -ący. Несовершенная пара — LUBIĆ «нравиться, любить»: lubię kawę «я люблю кофе», а polubiłem kawę значит «я к кофе пристрастился»." }
collocations:
  - { pl: "polubić się", ru: "сойтись, понравиться друг другу" }
  - { pl: "polubić od pierwszego wejrzenia", ru: "проникнуться с первого взгляда" }
  - { pl: "polubić stronę", ru: "лайкнуть страницу" }
family:
  - { pl: "lubić", ru: "нравиться, любить", relation: aspect, id: lubic }
  - { pl: "kochać", ru: "любить", relation: root, id: kochac }
  - { pl: "znienawidzić", ru: "возненавидеть", relation: antonym }
etymology: "Приставка po- и lubić, из праславянского *ljubiti «любить», того же корня, что русское «любить» и «любимый». Приставка po- даёт совершенный вид со значением начала состояния, как в русском «полюбить». Отсюда и luby «милый», родственное русскому «любый»."
memory: "polubić — «проникнуться симпатией», а не «полюбить» по-настоящему: для этого есть kochać, а для влюбиться — zakochać się. И запомни новое значение: polub это кнопка «лайк», polubienie — сам лайк."
idioms:
  - { pl: "polub i podaj dalej", ru: "лайкни и поделись" }
  - { pl: "polubić się z kimś", ru: "сойтись с кем-л." }
