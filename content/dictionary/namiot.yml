notes:
  - { kind: false-friend, text: "Русская «палатка» и польский NAMIOT не похожи ничем, и угадать слово нельзя — зато можно разобрать. NAMIOT это NA- и корень MIOT-, тот же, что в MIOTAĆ «метать, бросать»: буквально «накинутое», то, что набросили сверху. Русскому этот корень знаком в «метать», «намёт», «наметать», и слово «намёт» в значении покрова или настила в русском существует, хотя и редкое. Русская «палатка» идёт от «палаты», то есть от каменного помещения, и образ там прямо противоположный: не наброшенная ткань, а постройка. Так что два языка назвали одну вещь с двух сторон." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: ROZBIĆ NAMIOT. Родительный на -U: BEZ NAMIOTU. Местный NAMIOCIE, с чередованием T в C перед -IE, и это главная форма для запоминания: W NAMIOCIE «в палатке». Поставить палатку — ROZBIĆ NAMIOT, буквально «разбить», как и в русском; снять — ZWINĄĆ NAMIOT «свернуть». Где ставят — предлог NAD с творительным, если у воды: NAMIOT NAD JEZIOREM. Родительный множественного NAMIOTÓW." }
  - { kind: pronunciation, text: "Читается «на́мёт», ударение на предпоследнем слоге из двух. Сочетание MIO даёт «мё» с мягким м. Конечное T звучит ясно, без оглушения в «д». В местном падеже NAMIOCIE буква T переходит в C и читается «ць»: «намё́це», и ударение сдвигается на предпоследний слог, который теперь второй. Это то же чередование, что в PASZPORT и PASZPORCIE, в TORT и TORCIE — общее правило перед окончанием -IE, а не особенность слова." }
  - { kind: usage, text: "Частотные сочетания: ROZBIĆ NAMIOT «разбить палатку», ZWINĄĆ NAMIOT «свернуть палатку», NAMIOT DWUOSOBOWY «двухместная палатка», NAMIOT WESELNY «свадебный шатёр», POD NAMIOTEM «в палатке, под тентом». Выражение SPAĆ POD NAMIOTEM значит «спать в палатке», и предлог там именно POD, а не W, когда речь о способе ночлега. Уменьшительное NAMIOCIK разговорное. В библейском и историческом контексте NAMIOT переводится как «шатёр», и это второе русское соответствие." }
