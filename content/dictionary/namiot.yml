etymology: "Приставка NA- и корень *met-/*mot-, давший MIOTAĆ «метать, бросать»: NAMIOT это буквально «наброшенное сверху», покров. Русскому корень знаком по «метать», «наметать», «размётанный», и слово «намёт» в значении покрова или наброшенного слоя в русском тоже есть, просто вышло из обихода. Русская «палатка» построена на совершенно другом образе: она идёт от «палаты», помещения, через уменьшительное, и подчёркивает укрытие как постройку, а не как ткань. Отсюда и невозможность догадаться: слова называют один предмет с разных сторон, и общего между ними только значение. В польском гнезде корня стоят ещё MIOTŁA «метла», ZAMIEĆ «метель», POMIOT «помёт»."
memory: "Не «палатка», а «наброшенное»: na- плюс miotać «метать», то есть покров, набросанный сверху; русский «намёт» того же корня. Русская «палатка» — от «палаты», образ противоположный. Главная форма — местный namiocie, с t→c: w namiocie, как paszport — paszporcie и tort — torcie. Разбить палатку — rozbić namiot, как в русском; но «спать в палатке» — spać pod namiotem, с предлогом pod."
idioms:
  - { pl: "rozbić namiot", ru: "разбить палатку" }
  - { pl: "spać pod namiotem", ru: "спать в палатке" }
