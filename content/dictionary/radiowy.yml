etymology: "От RADIO, взятого через западные языки из латинского RADIUS «луч»: радиоволна расходится лучами. Русское «радио» пришло тем же путём, поэтому корень общий и узнаётся сразу. Разошлись языки не в корне, а в том, как строят составные названия: русский лепит из них одно слово, польский держит два, существительное и прилагательное на -OWY."
memory: "Радио-, но с польским устройством фразы: русский склеивает «радиостанцию», поляк пишет stacja radiowa в два слова. Так же audycja radiowa «радиопередача» и fala radiowa «радиоволна». Читается «радё́вы», где dio даёт «дё», как mio в miodowy. «По радио» — w radiu, с местным падежом, а не po radiu. И radiostacja одним словом это рация, прибор."
idioms:
  - { pl: "stacja radiowa", ru: "радиостанция" }
