notes:
  - { kind: false-friend, text: "Устройство выражений здесь то же, что в TELEWIZYJNY, и запомнить его стоит раз навсегда. Русский склеивает: «радиостанция», «радиопередача», «радиоволна». Поляк пишет два слова с прилагательным: STACJA RADIOWA, AUDYCJA RADIOWA, FALA RADIOWA. Одним словом RADIOSTACJA по-польски называют прибор, рацию, а не вещательную станцию. И запомните RADIOWIEC — работник радио, одним русским словом не передать." }
  - { kind: usage, text: "Все одиннадцать форм живые. Форма для мужчин-людей здесь есть и употребляется, потому что DZIENNIKARZ RADIOWY и OPERATOR RADIOWY — это люди, а значит бывают DZIENNIKARZE RADIOWI и OPERATORZY RADIOWI. Пропускать её, как у LODOWY или BOJOWY, здесь нельзя. Прилагательное стоит после существительного: STACJA RADIOWA, PROGRAM RADIOWY." }
  - { kind: government, text: "Вот важная мелочь: «по радио» по-польски W RADIU, буквально «в радио», с местным падежом. SŁYSZAŁEM TO W RADIU значит «я слышал это по радио». Сказать PO RADIU нельзя. На радио работать — PRACOWAĆ W RADIU, тот же оборот. А в радиопередаче — W AUDYCJI RADIOWEJ, тоже местный падеж." }
  - { kind: pronunciation, text: "Читается «радё́вы», три слога, ударение на предпоследнем. Сочетание DIO даёт «дё»: буква I здесь не читается отдельно, а только смягчает D, ровно как MIO даёт «мё» в MIODOWY «мёдо́вы». Конечная Y даёт «ы». В женском роде RADIOWA это «радё́ва», в среднем RADIOWE — «радё́вэ»." }
  - { kind: register, text: "Слово нейтральное, из обиходной речи и из газет. Частые сочетания — STACJA RADIOWA, AUDYCJA RADIOWA «радиопередача», PROGRAM RADIOWY, STUDIO RADIOWE. В технике — FALA RADIOWA и NADAJNIK RADIOWY «радиопередатчик». А SŁUCHOWISKO RADIOWE это «радиоспектакль», и жанр этот в Польше жив до сих пор." }
