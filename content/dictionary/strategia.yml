notes:
  - { kind: pronunciation, text: "Читается «стратэ́гья», с ударением на предпоследнем слоге. Окончание -IA после согласной произносится как «ья», одним слогом: не «стра-те-ги-а», а «стра-тэ́-гья». Это тот же класс, что BIBLIA «би́блья» и HISTORIA «хисто́рья». Буква e даёт «э». Начальное str произносится слитно, без гласной между согласными." }
  - { kind: government, text: "Чего, какая — родительный падеж: STRATEGIA FIRMY, STRATEGIA OBRONY. Где — предлог W с предложным: W STRATEGII, с двумя i на письме. Винительный — STRATEGIĘ: PRZYJĄĆ STRATEGIĘ, ZMIENIĆ STRATEGIĘ. Родительный и предложный единственного совпадают и пишутся STRATEGII, тогда как русское «стратегии» имеет одно и: это общая черта всех польских слов на -IA, и ошибка здесь самая частая." }
  - { kind: usage, text: "Слово книжное и деловое, в разговоре встречается редко. Два значения различает область: в делах это долгосрочный план, STRATEGIA MARKETINGOWA, STRATEGIA ROZWOJU; на войне — искусство ведения кампании, в отличие от TAKTYKA, которая отвечает за отдельный бой. Это противопоставление в польском такое же, как в русском, и ошибиться трудно. В родительном множественном есть старая форма STRATEGIJ, которая в современных текстах почти не встречается." }
  - { kind: false-friend, text: "Ложной пары нет: слово значит в обоих языках одно и то же и пришло одним путём. Зато стоит запомнить производные, которые расходятся по форме. Польское STRATEG — это «стратег», без окончания, а STRATEGICZNY — «стратегический». Русское «стратегический» длиннее на слог, и при переводе с русского рука сама тянется добавить лишнее: не STRATEGICZESKI, а STRATEGICZNY. Суффикс -ICZNY регулярно отвечает русскому «-ический»: TECHNICZNY, HISTORYCZNY, LOGICZNY." }
collocations:
  - { pl: "strategia marketingowa", ru: "маркетинговая стратегия" }
  - { pl: "przyjąć strategię", ru: "принять стратегию" }
  - { pl: "strategia rozwoju", ru: "стратегия развития" }
family:
  - { pl: "strateg", ru: "стратег", relation: derived }
  - { pl: "strategiczny", ru: "стратегический", relation: derived }
  - { pl: "taktyka", ru: "тактика", relation: root }
etymology: "Из греческого STRATEGIA «должность и искусство военачальника», от STRATEGOS «военачальник», а то — сложение STRATOS «войско» и AGEIN «вести»: буквально «тот, кто ведёт войско». В европейские языки слово вошло через латынь в новое время, сначала как военный термин, и лишь в двадцатом веке перешло в язык дел и управления. Русское «стратегия» прошло тот же путь и в то же время, поэтому значения совпадают полностью. Любопытно, что греческий AGEIN «вести» родствен латинскому AGERE, от которого AGENT и AKCJA: один корень дал и стратега, и агента."
memory: "Класс слов на -IA: родительный и предложный — STRATEGII, с двумя i, в отличие от русской «стратегии». Читается «стратэ́гья», -ia как «ья». И прилагательное короче русского: strategiczny, а не «стратегический» — суффикс -ICZNY отвечает русскому «-ический»."
idioms:
