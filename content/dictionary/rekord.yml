etymology: "Из английского RECORD, а оно — из старофранцузского RECORDER «запоминать, заносить в память», от латинского RECORDARI «вспоминать», сложения RE- и COR, CORDIS «сердце»: вспомнить значило вернуть в сердце. Отсюда и два значения, которые кажутся далёкими: запись, то есть сохранённое, и рекорд, то есть лучший результат, занесённый в книгу. Польский взял слово из английского через спортивную печать в конце девятнадцатого века и позже добавил к нему техническое значение заново, уже из языка вычислительной техники. Русский прошёл тот же путь, но второе значение передал своим словом «запись», и потому общая этимология в двух языках дала разное число значений."
memory: "В спорте совпадает с русским «рекордом» во всём, включая pobić rekord. Но в информатике rekord значит «запись» в базе данных, и это второе значение русскому незнакомо. Корень общий и неожиданный: от латинского recordari «вспоминать», буквально «вернуть в сердце», от cor «сердце» — отсюда и запись, и рекорд. Звучит «рэ́корт», с оглушением d. Местный rekordzie с меной d→dzi, рядом с kredycie, где t→c."
