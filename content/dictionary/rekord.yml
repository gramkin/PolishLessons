notes:
  - { kind: false-friend, text: "В основном значении слово совпадает с русским «рекордом» полностью, и даже сочетания те же: POBIĆ REKORD «побить рекорд», REKORD ŚWIATA «мировой рекорд». Расходятся они во втором значении. В информатике польское REKORD означает запись в базе данных, то есть строку с полями, и русский в этом месте говорит «запись», а не «рекорд». Поэтому фраза BAZA LICZY MILION REKORDÓW значит «база насчитывает миллион записей», и переводить слово в лоб нельзя. Оба языка взяли его из английского, но польский сохранил и то значение, которое английское RECORD имеет в технике." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — REKORDZIE, где конечное D основы переходит в DZI перед окончанием -E: это та же мена, что в WYKŁADZIE и SĄSIEDZIE. Рядом с соседней карточкой видно обе половины правила: KREDYCIE показывает T в C, REKORDZIE показывает D в DZI, и вместе они покрывают оба зубных согласных. Родительный единственного — REKORDU. Винительный равен именительному. Управление: REKORD W CZYMŚ в местном — REKORD W SKOKU WZWYŻ, а побитие строится глаголом POBIĆ или USTANOWIĆ." }
  - { kind: pronunciation, text: "Читается «рэ́корт», два слога, ударение на первом. Буква E после R звучит как «э», а конечное D оглушается в «т», поэтому именительный падеж звучит «рэкорт», а не «рэкорд». В форме REKORDU звонкость возвращается: «рэко́рду». В форме REKORDZIE сочетание DZI даёт мягкое «дзи»: «рэко́рдзе». В форме REKORDÓW буква Ó даёт «у», а конечное W оглушается: «рэко́рдуф». Ударение во всех формах предпоследнее." }
  - { kind: register, text: "Слово нейтральное, частое в спорте и в журналистике. Устойчивые сочетания: POBIĆ REKORD, USTANOWIĆ REKORD «установить рекорд», REKORD ŚWIATA, REKORD ŻYCIOWY «личный рекорд», W REKORDOWYM TEMPIE «в рекордном темпе». Прилагательное REKORDOWY употребляется широко и о любых величинах: REKORDOWE UPAŁY, REKORDOWA FREKWENCJA «рекордная явка». В информатике слово строго терминологическое и в разговоре обычного человека не встречается. Переносного употребления о людях у слова нет." }
