# review
id: dostarczyc
format: 2
lemma: "dostarczyć"
rank: 1459
pos: verb
aspect: perf
pron: { cyr: "доста́рчыць" }
senses:
  - id: deliver
    ru: "доставить, привезти"
    examples:
      - pl: "Paczka została wczoraj dostarczona."
        ru: "Посылка была доставлена вчера."
        source: { kind: translated, id: 610224 }
      - pl: "Gazeta powinna być dostarczona do siódmej rano."
        ru: "Газету следует доставлять до семи утра."
        source: { kind: translated, id: 352237 }
      - pl: "Dostarczono nam mundury."
        ru: "Нам доставили мундиры."
        source: { kind: translated, id: 366035 }
  - id: provide
    ru: "предоставить, снабдить"
    examples:
      - pl: "Obiecał, że dostarczy informacji."
        ru: "Он обещал предоставить информацию."
        source: { kind: tatoeba, id: 359370 }
      - pl: "Musimy dostarczyć dość żywności cierpiącym."
        ru: "Мы должны доставить достаточно продовольствия страдающим."
        source: { kind: translated, id: 368139 }
notes:
  - { kind: government, text: "Два падежа: КОМУ в дательном, ЧТО в винительном — dostarczyć komuś paczkę. Но в значении «предоставить» дополнение часто в РОДИТЕЛЬНОМ: dostarczyć informacji, dostarczyć paliwa." }
  - { kind: false-friend, text: "do- + starczyć «хватать». Русское «стараться» тут ни при чём: корень тот же, что в starczy «хватит»." }
  - { kind: usage, text: "Страдательные формы очень частотны, особенно в деловой речи: zostało dostarczone «было доставлено», dostarczono «доставили»." }
  - { kind: usage, text: "Несовершенный вид — dostarczać. Существительное dostawa «доставка»." }
collocations:
  - { pl: "dostarczyć paczkę", ru: "доставить посылку" }
  - { pl: "dostarczyć informacji", ru: "предоставить сведения" }
etymology: "do- + starczyć «хватать»; тот же корень, что в starczy «хватит»."
memory: "dostarczyć — «доставить, предоставить». Кому — дательный, что — винительный, но в смысле «предоставить» часто родительный: dostarczyć informacji. Несовершенный вид — dostarczać."
idioms:
  - { pl: "dostarczyć paczkę", ru: "доставить посылку" }
formExamplesSkip:
  - { form: "dostarczeni", reason: "мужско-личной формы не бывает: доставляют посылку, товар или сведения, а не людей" }
