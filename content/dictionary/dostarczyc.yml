formExamples:
  - form: "dostarcz"
    pl: "Dostarcz swoją pracę domową do poniedziałku."
    ru: "Сдай домашнюю работу до понедельника."
    source: { kind: translated, id: 2516997 }
  - form: "dostarcz"
    pl: "Dostarcz paczkę pod ten adres."
    ru: "Доставь посылку по этому адресу."
    source: { kind: authored }
  - form: "dostarcz"
    pl: "Dostarcz mi dowody."
    ru: "Предоставь мне доказательства."
    source: { kind: authored }
  - form: "dostarczenia"
    pl: "Płatność za pobraniem oznacza płatność gotówką w chwili dostarczenia przesyłki."
    ru: "Оплата при получении означает оплату наличными в момент доставки отправления."
    source: { kind: translated, id: 4974056 }
  - form: "dostarczenia"
    pl: "Termin dostarczenia mija jutro."
    ru: "Срок доставки истекает завтра."
    source: { kind: authored }
  - form: "dostarczenia"
    pl: "Żądają dostarczenia dowodów."
    ru: "Они требуют предоставления доказательств."
