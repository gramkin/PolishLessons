    pl: "Dostarczę to najszybciej, jak tylko będę w stanie."
    ru: "Я доставлю это так быстро, как только смогу."
    source: { kind: translated, id: 973118 }
  - form: "dostarczę"
    pl: "Mam nadzieję, że dostarczę wam dobrej żywności za niską cenę."
    ru: "Надеюсь, я доставлю вам хорошую еду по низкой цене."
