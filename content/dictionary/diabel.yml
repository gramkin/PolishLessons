# review
id: diabel
format: 2
lemma: "diabeł"
rank: 464
pos: noun
pron: { cyr: "дя́бэу" }
senses:
  - id: devil
    ru: "чёрт, дьявол"
    examples:
      - pl: "Idź do diabła!"
        ru: "Идите к чёрту!"
        source: { kind: tatoeba, id: 1176378 }
      - pl: "Co tu, u diabła, robisz?"
        ru: "Какого чёрта ты здесь делаешь?"
        source: { kind: tatoeba, id: 1002588 }
      - pl: "Diabeł może nadejść."
        ru: "Чёрт может явиться."
        source: { kind: translated, id: 943597 }
  - id: curse
    ru: "чёрт (в ругательствах и восклицаниях)"
    examples:
      - pl: "Do diabła z fizyką!"
        ru: "К чёрту физику!"
        source: { kind: tatoeba, id: 1349449 }
      - pl: "Niech cię diabli!"
        ru: "Чёрт тебя побери!"
        source: { kind: translated, id: 6405984 }
      - pl: "Idź w diabły!"
        ru: "Иди к чёрту!"
        source: { kind: translated, id: 12849723 }
notes:
  - { kind: usage, text: "Беглое e в корне: diabeł, но diabła, diabłu, diabłem — ровно как pies → psa." }
  - { kind: usage, text: "Два множественных числа: diabły «черти» и diabli, которое живёт в ругательствах: Niech cię diabli! «Чёрт тебя побери!»" }
  - { kind: usage, text: "do diabła — «к чёрту», u diabła — «какого чёрта»: Co tu, u diabła, robisz?" }
  - { kind: usage, text: "Слово греческое: διάβολος «клеветник», пришло через латынь. Русское «дьявол» — то же заимствование." }
collocations:
  - { pl: "do diabła", ru: "к чёрту" }
  - { pl: "u diabła", ru: "какого чёрта" }
  - { pl: "adwokat diabła", ru: "адвокат дьявола" }
  - { pl: "niech cię diabli", ru: "чёрт тебя побери" }
etymology: "Через латинское diabolus из греческого διάβολος «клеветник». Русское «дьявол» — то же самое заимствование, только польское слово прошло через чешский и обзавелось беглым e."
memory: "diabeł — «чёрт, дьявол», и беглое e работает как в pies → psa: diabeł → diabła. Ругательства стоит узнавать сразу: do diabła «к чёрту», Niech cię diabli! «Чёрт тебя побери!»"
idioms:
  - { pl: "adwokat diabła", ru: "адвокат дьявола" }
  - { pl: "bać się jak diabeł święconej wody", ru: "бояться как чёрт ладана" }
  - { pl: "do diabła", ru: "к чёрту" }
