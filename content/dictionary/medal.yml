senses:
  - id: medal
    ru: "медаль"
    examples:
      - pl: "On wygrał medal."
        ru: "Он выиграл медаль."
        source: { kind: translated, id: 9686930 }
      - pl: "Tom zdobył złoty medal."
        ru: "Том завоевал золотую медаль."
        source: { kind: translated, id: 5437846 }
      - pl: "To pierwszy złoty medal, jaki zdobyła."
        ru: "Это первая золотая медаль, которую она завоевала."
        source: { kind: translated, id: 817197 }
  - id: medals
    ru: "медали (мн. ч.)"
    examples:
      - pl: "Słowaccy pszczelarze zdobyli sześć medali na międzynarodowej konferencji w Argentynie."
        ru: "На Международном конгрессе в Аргентине словацкие пчеловоды завоевали шесть медалей."
        source: { kind: tatoeba, id: 8679399 }
      - pl: "Tomek zdobył już wiele medali."
        ru: "Томек завоевал уже много медалей."
        source: { kind: translated, id: 11638661 }
notes:
  - { kind: false-friend, text: "ГЛАВНОЕ: русская «медаль» женского рода, а польское medal — МУЖСКОГО: ten medal, złoty medal. Русское -ль здесь обманывает." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — medalu. Завоевать медаль — zdobyć medal, винительный." }
  - { kind: usage, text: "Złoty, srebrny, brązowy medal — золотая, серебряная, бронзовая медаль. Прилагательное согласуется по мужскому роду." }
  - { kind: usage, text: "Оборот druga strona medalu «обратная сторона медали» совпадает с русским." }
collocations:
  - { pl: "złoty medal", ru: "золотая медаль" }
  - { pl: "druga strona medalu", ru: "обратная сторона медали" }
etymology: "Из итальянского medaglia через французский; в русском слово стало женского рода, в польском осталось мужского."
memory: "medal — «медаль», но МУЖСКОГО рода: ten złoty medal. Русское женское «медаль» здесь сбивает с толку."
idioms:
  - { pl: "złoty medal", ru: "золотая медаль" }
formExamplesSkip:
  - { form: "medalu", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
