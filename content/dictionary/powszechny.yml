etymology: "Образовано от старого WSZECH- «все-», того же, что в WSZECHŚWIAT «вселенная» и в русском «всё», «всех», с приставкой PO-. Буквально «распространённый на всех»."
memory: "Powszechny — «на всех»: wszech- «все-», как в wszechświat. Wybory powszechne — всеобщие выборы, spis powszechny — перепись, historia powszechna — всемирная история. Второе значение — «распространённый»: najpowszechniejsze nazwisko w Polsce to Nowak."
