notes:
  - { kind: false-friend, text: "Слово легко принять за «общий» во всех смыслах, но у польского три разных «общих». POWSZECHNY значит «касающийся всех, всеобщий»: WYBORY POWSZECHNE «всеобщие выборы», POWSZECHNA SŁUŻBA WOJSKOWA «всеобщая воинская обязанность». OGÓLNY — «общий, не подробный»: OGÓLNE WRAŻENIE «общее впечатление». WSPÓLNY — «совместный, общий для двоих или нескольких»: WSPÓLNY POKÓJ «общая комната». Отдельно стоит запомнить HISTORIA POWSZECHNA: это «всемирная история», а SPIS POWSZECHNY — «перепись населения»." }
  - { kind: usage, text: "У слова два значения, и степени сравнения есть только у второго. «Всеобщее» не бывает более или менее всеобщим, а «распространённое» бывает: TEN BŁĄD JEST POWSZECHNIEJSZY, NIŻ MYŚLISZ «эта ошибка встречается чаще, чем ты думаешь», NAJPOWSZECHNIEJSZE NAZWISKO «самая распространённая фамилия». Наречие POWSZECHNIE «повсеместно» даёт частый оборот POWSZECHNIE WIADOMO «общеизвестно»." }
  - { kind: pronunciation, text: "Читается «пофшэ́хны», ударение на предпоследнем слоге. W стоит перед глухим SZ и оглушается в «ф», CH звучит как русское «х». В сравнительной степени ударение уходит вперёд: POWSZECHNIEJSZY, «пофшэхне́йшы»." }
  - { kind: usage, text: "О людях слово говорят почти только в обороте POWSZECHNY ULUBIENIEC «всеобщий любимец»: CI KOMICY TO POWSZECHNI ULUBIEŃCY WIDZÓW. Мужско-личные формы сравнительной и превосходной степени, POWSZECHNIEJSI и NAJPOWSZECHNIEJSI, остаются в таблице без примеров." }
