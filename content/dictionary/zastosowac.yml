# review
id: zastosowac
format: 2
lemma: "zastosować"
rank: 2423
pos: verb
aspect: perf
pron: { cyr: "застосо́ваць" }
senses:
  - id: apply
    ru: "применить, употребить"
    examples:
      - pl: "Spróbuj zastosować te strategie."
        ru: "Попробуй применить эти стратегии."
        source: { kind: translated, id: 12268390 }
      - pl: "Uważasz, że możesz swój pomysł zastosować w praktyce?"
        ru: "Думаешь, ты сможешь применить свою идею на практике?"
        source: { kind: translated, id: 6484549 }
      - pl: "On zastosował swoją teorię w kilku przypadkach."
        ru: "Он применил свою теорию в нескольких случаях."
        source: { kind: translated, id: 2516354 }
  - id: comply
    ru: "последовать (совету), подчиниться (zastosować się)"
    examples:
      - pl: "Proszę zastosować się do mojej rady."
        ru: "Прошу последовать моему совету."
        source: { kind: translated, id: 11624857 }
      - pl: "Zastosował się do wskazówek lekarza."
        ru: "Он последовал указаниям врача."
        source: { kind: translated, id: 3159957 }
notes:
  - { kind: government, text: "Без się — «применить что-л.», винительный. С się — «последовать чему-л.», и тут нужен предлог DO с родительным: zastosować się do rady «последовать совету». Русское «последовать совету» обходится дательным." }
  - { kind: false-friend, text: "От stosować «применять», корень stos «куча, стопка»? Нет — от stosowny «подобающий», то есть «прилаживать». Русское «применить» от «мерить», образ другой." }
  - { kind: usage, text: "Очень частотное отглагольное существительное zastosowanie «применение»: mieć zastosowanie «быть применимым», nie ma zastosowania «неприменимо»." }
  - { kind: usage, text: "Несовершенный вид — stosować. Прилагательное stosowany: matematyka stosowana «прикладная математика»." }
collocations:
  - { pl: "zastosować się do czegoś", ru: "последовать чему-л." }
  - { pl: "mieć zastosowanie", ru: "быть применимым" }
etymology: "От stosować «применять», от stosowny «подобающий» — буквально «прилаживать»."
memory: "zastosować — «применить», а zastosować się DO czegoś — «последовать чему-л.», с родительным. Запомните mieć zastosowanie «быть применимым»."
idioms:
  - { pl: "zastosować się do czegoś", ru: "последовать чему-л." }
  - { pl: "mieć zastosowanie", ru: "быть применимым" }
