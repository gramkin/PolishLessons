  - form: "zastosowana"
    pl: "Ta reguła nie może być zastosowana w tym przypadku."
    ru: "Это правило не может быть применено в данном случае."
    source: { kind: translated, id: 2516405 }
  - form: "zastosowana"
    pl: "Metoda została zastosowana po raz pierwszy."
    ru: "Метод был применён впервые."
    source: { kind: authored }
  - form: "zastosowane"
    pl: "Niektóre trucizny, jeśli odpowiednio zastosowane, mają działanie korzystne."
    ru: "Некоторые яды, если их правильно применить, полезны."
    source: { kind: translated, id: 364139 }
  - form: "zastosowane"
    pl: "Środki zostały zastosowane natychmiast."
    ru: "Меры были применены немедленно."
    source: { kind: authored }
  - form: "zastosowane"
    pl: "Te zasady zostały zastosowane wobec wszystkich."
    ru: "Эти правила были применены ко всем."
    source: { kind: authored }
  - form: "zastosowania"
    pl: "Ta reguła w naszym przypadku nie ma zastosowania."
    ru: "Это правило в нашем случае неприменимо."
    source: { kind: translated, id: 533642 }
  - form: "zastosowania"
    pl: "Ta ustawa nie ma w tym przypadku zastosowania."
    ru: "Этот закон в данном случае неприменим."
    source: { kind: translated, id: 753900 }
  - form: "zastosowania"
    pl: "Ta zasada nie ma zastosowania do wszystkich przypadków."
    ru: "Это правило применимо не ко всем случаям."
    source: { kind: translated, id: 1611604 }
  - form: "zastosowanie"
    pl: "Ta reguła ma zastosowanie w tej sytuacji."
    ru: "Это правило применимо в данной ситуации."
    source: { kind: translated, id: 2516377 }
  - form: "zastosowanie"
    pl: "Jakie było zastosowanie?"
    ru: "Каково было применение?"
    source: { kind: translated, id: 10698008 }
  - form: "zastosowanie"
    pl: "Zastosowanie prawdziwej skóry chyba lepiej się opłaci na dłuższą metę."
    ru: "Применение настоящей кожи, пожалуй, выгоднее в долгой перспективе."
    source: { kind: translated, id: 639845 }
  - form: "zastosowaniem"
    pl: "Nieznajomość prawa nie chroni przed jego zastosowaniem."
    ru: "Незнание закона не защищает от его применения."
    source: { kind: translated, id: 369066 }
  - form: "zastosowaniem"
    pl: "Przed zastosowaniem przeczytaj ulotkę."
    ru: "Перед применением прочитай вкладыш."
    source: { kind: authored }
  - form: "zastosowaniem"
    pl: "Zajmuje się zastosowaniem tej metody."
    ru: "Он занимается применением этого метода."
    source: { kind: authored }
  - form: "zastosowano"
    pl: "W tym samolocie zastosowano nową technologię."
    ru: "В этом самолёте применили новую технологию."
    source: { kind: translated, id: 2516376 }
  - form: "zastosowano"
    pl: "Zastosowano surowe środki."
    ru: "Применили строгие меры."
    source: { kind: authored }
  - form: "zastosowano"
    pl: "Nie zastosowano żadnych sankcji."
    ru: "Никаких санкций не применили."
    source: { kind: authored }
  - form: "zastosujemy"
    pl: "A tu zastosujemy dzwignię."
    ru: "А здесь мы применим рычаг."
    source: { kind: translated, id: 3744941 }
  - form: "zastosujemy"
    pl: "Zastosujemy tę samą metodę."
    ru: "Мы применим тот же метод."
    source: { kind: authored }
  - form: "zastosujemy"
