    pl: "Zastosowałeś właściwą zasadę."
    ru: "Ты применил верное правило."
    source: { kind: authored }
  - form: "zastosowałeś"
    pl: "Gdzie zastosowałeś ten wzór?"
    ru: "Где ты применил эту формулу?"
