# review
id: zawod
format: 2
lemma: "zawód"
rank: 1724
pos: noun
pron: { cyr: "за́вут" }
senses:
  - id: profession
    ru: "профессия"
    examples:
      - pl: "Kim jesteś z zawodu?"
        ru: "Кто ты по профессии?"
        source: { kind: translated, id: 4772636 }
      - pl: "Jestem policjantem z zawodu."
        ru: "Я по профессии полицейский."
        source: { kind: tatoeba, id: 525641 }
      - pl: "Jaki jest twój zawód?"
        ru: "Какая у тебя профессия?"
        source: { kind: translated, id: 12239949 }
  - id: disappointment
    ru: "разочарование"
    examples:
      - pl: "Tom sprawił mi zawód."
        ru: "Том меня разочаровал."
        source: { kind: translated, id: 4869582 }
      - pl: "Pokryła zawód uśmiechem."
        ru: "Она скрыла разочарование улыбкой."
        source: { kind: translated, id: 933353 }
  - id: competition
    ru: "соревнования (во множественном — zawody)"
    examples:
      - pl: "To nie są zawody."
        ru: "Это не соревнование."
        source: { kind: translated, id: 3926316 }
      - pl: "Miał szczęście i wygrał zawody."
        ru: "Ему повезло, и он выиграл соревнования."
        source: { kind: translated, id: 977270 }
      - pl: "On chce wziąć udział w zawodach."
        ru: "Он хочет принять участие в соревнованиях."
        source: { kind: translated, id: 8913716 }
notes:
  - { kind: usage, text: "Три значения, и множественное число решает: в единственном zawód — «профессия» или «разочарование», а во множественном zawody — почти всегда «соревнования»." }
  - { kind: usage, text: "sprawić komuś zawód — «разочаровать кого-то»: Tom sprawił mi zawód «Том меня разочаровал»." }
  - { kind: government, text: "«По профессии» — z zawodu, родительный падеж: Jestem policjantem z zawodu «Я по профессии полицейский»." }
  - { kind: usage, text: "ó в основе чередуется с o: zawód, но zawodu, zawodzie, zawody." }
collocations:
  - { pl: "z zawodu", ru: "по профессии" }
  - { pl: "sprawić zawód", ru: "разочаровать" }
  - { pl: "wziąć udział w zawodach", ru: "принять участие в соревнованиях" }
etymology: "От zawieść «подвести, обмануть ожидания» (za- + wieść «вести»). Отсюда оба значения: «разочарование» напрямую, а «профессия» — через старое «то, к чему человек приведён, призван»."
memory: "zawód — три значения, и число подсказывает: единственное zawód — «профессия» (z zawodu «по профессии») или «разочарование» (sprawić zawód), а множественное zawody — «соревнования»."
idioms:
  - { pl: "z zawodu", ru: "по профессии" }
  - { pl: "sprawić zawód", ru: "разочаровать" }
  - { pl: "wziąć udział w zawodach", ru: "участвовать в соревнованиях" }
