# review
id: wiecej
format: 2
lemma: "więcej"
rank: 646
pos: adv
pron: { cyr: "вье́нцэй" }
senses:
  - id: more
    ru: "больше (сравнительная степень от dużo, wiele)"
    examples:
      - pl: "Chciałbym zarabiać więcej."
        ru: "Я бы хотел больше зарабатывать."
        source: { kind: tatoeba, id: 6328333 }
      - pl: "Pij więcej wody."
        ru: "Пей больше воды."
        source: { kind: tatoeba, id: 6463997 }
      - pl: "Potrzebujemy więcej danych."
        ru: "Нам нужно больше данных."
        source: { kind: tatoeba, id: 12470372 }
  - id: more-of
    ru: "ещё, побольше"
    examples:
      - pl: "Więcej herbaty?"
        ru: "Ещё чаю?"
        source: { kind: tatoeba, id: 10805930 }
      - pl: "Tomek chce więcej."
        ru: "Том хочет больше."
        source: { kind: tatoeba, id: 7105843 }
      - pl: "Jeżeli wydobędę z niego więcej faktów, oszczędzi mi to czasu."
        ru: "Если я вытяну из него больше фактов, это сэкономит мне время."
        source: { kind: authored }
notes:
  - { kind: government, text: "После więcej существительное стоит в родительном падеже: więcej wody «больше воды», więcej czasu «больше времени» — как и в русском." }
  - { kind: usage, text: "Это сравнительная степень сразу к двум словам: dużo «много» и wiele «многие». Превосходная — najwięcej «больше всего»." }
  - { kind: usage, text: "coraz więcej — «всё больше»; nic więcej — «ничего больше»; co więcej — «более того»." }
  - { kind: usage, text: "Не путайте więcej «больше по количеству» с bardziej «больше по степени»: więcej pracy, но bardziej zmęczony." }
collocations:
  - { pl: "coraz więcej", ru: "всё больше" }
  - { pl: "nic więcej", ru: "ничего больше" }
  - { pl: "co więcej", ru: "более того" }
  - { pl: "więcej niż", ru: "больше чем" }
etymology: "Сравнительная степень от wiele «много», праславянское *vęťe. Русское «вяще, вящий» — то же гнездо."
memory: "więcej — «больше», сравнительная степень сразу к dużo и wiele. После него родительный падеж: więcej wody, więcej czasu. И различайте więcej «больше по количеству» и bardziej «больше по степени»: więcej pracy, но bardziej zmęczony."
idioms:
