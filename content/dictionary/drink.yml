# review
id: drink
format: 2
lemma: "drink"
rank: 825
pos: noun
pron: { cyr: "дринк" }
senses:
  - id: cocktail
    ru: "коктейль, спиртной напиток"
    note: "Слово значит именно алкогольный напиток, а не питьё вообще."
    examples:
      - pl: "Ten drink jest na koszt firmy."
        ru: "Этот коктейль за счёт заведения."
        source: { kind: translated, id: 10575929 }
      - pl: "Nalała sobie drinka."
        ru: "Она налила себе коктейль."
        source: { kind: translated, id: 7970913 }
      - pl: "Zrobiła sobie drinka."
        ru: "Она сделала себе коктейль."
        source: { kind: translated, id: 7970912 }
  - id: buy-a-drink
    ru: "postawić drinka — угостить, поставить выпивку"
    examples:
      - pl: "Postawić ci drinka?"
        ru: "Угостить тебя коктейлем?"
        source: { kind: translated, id: 362931 }
      - pl: "Postawił nam kilka drinków."
        ru: "Он поставил нам несколько коктейлей."
        source: { kind: translated, id: 1920869 }
      - pl: "Postawiłem jej kilka drinków."
        ru: "Я поставил ей несколько коктейлей."
        source: { kind: translated, id: 3596353 }
notes:
  - { kind: false-friend, text: "Не переносите английское значение: польское drink — это только алкогольный коктейль. «Напиток» вообще — napój, а «попить» — napić się. Zamów sobie drinka значит «закажи коктейль», а не «закажи попить»." }
  - { kind: government, text: "Слово мужского рода и неодушевлённое, но винительный падеж у него как у одушевлённых: postawić ci drinka, wypić drinka. Так ведут себя в польском названия напитков и papieros «сигарета»." }
  - { kind: usage, text: "na koszt firmy — «за счёт заведения»: Drinki są na koszt firmy." }
  - { kind: pronunciation, text: "Читается как в английском, «дринк», но склоняется по-польски: drinka, drinkiem, drinków." }
collocations:
  - { pl: "postawić drinka", ru: "угостить выпивкой" }
  - { pl: "wypić drinka", ru: "выпить коктейль" }
  - { pl: "na koszt firmy", ru: "за счёт заведения" }
  - { pl: "kolorowy drink", ru: "цветной коктейль" }
etymology: "Прямое заимствование из английского drink «напиток», но в польском значение сузилось до алкогольного коктейля."
memory: "drink — это коктейль, а не «напиток вообще»: питьё — napój. И запомните грамматическую странность: слово неодушевлённое, а винительный падеж у него как у одушевлённых — postawić ci drinka, wypić drinka. Так же ведёт себя papieros."
idioms:
  - { pl: "postawić drinka", ru: "угостить выпивкой" }
  - { pl: "na koszt firmy", ru: "за счёт заведения" }
  - { pl: "wypić drinka", ru: "выпить коктейль" }
