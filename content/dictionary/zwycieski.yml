# review
id: zwycieski
format: 2
lemma: "zwycięski"
rank: 6010
pos: adj
pron: { cyr: "звыце́у̃ски" }
senses:
  - id: winning
    ru: "победивший, -победитель"
    note: "о команде, стране, кандидате, работе на конкурсе"
    examples:
      - pl: "Zwycięska drużyna wróciła do miasta w nocy."
        ru: "Команда-победительница вернулась в город ночью."
        source: { kind: authored }
      - pl: "Zwycięski kraj podyktował warunki pokoju."
        ru: "Страна-победительница продиктовала условия мира."
        source: { kind: authored }
      - pl: "Trener zwycięskiego zespołu udzielił wywiadu."
        ru: "Тренер команды-победительницы дал интервью."
        source: { kind: authored }
  - id: triumphant
    ru: "победный, торжествующий"
    examples:
      - pl: "Zwycięski uśmiech nie schodził mu z twarzy."
        ru: "Победная улыбка не сходила с его лица."
        source: { kind: authored }
      - pl: "Ze zwycięską miną wszedł do pokoju."
        ru: "С победным видом он вошёл в комнату."
        source: { kind: authored }
      - pl: "Dzieci wzniosły zwycięskie okrzyki."
        ru: "Дети издали победные крики."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Там, где русский язык говорит «команда-победительница», «страна-победительница», «победивший кандидат», польский ставит одно прилагательное: ZWYCIĘSKA DRUŻYNA, ZWYCIĘSKI KRAJ, ZWYCIĘSKI KANDYDAT. Существительное-приложение через дефис по-польски так не строится. Второе значение — «победный, торжествующий»: ZWYCIĘSKI UŚMIECH, ZWYCIĘSKA MINA. В роли сказуемого прилагательное почти не встречается: «выйти победителем» говорят наречием, WYJŚĆ ZWYCIĘSKO." }
  - { kind: pronunciation, text: "Читается «звыце́у̃ски», ударение на предпоследнем слоге. Носовое Ę стоит перед S и звучит как «эу̃», с носовым призвуком, без отчётливого «н». Мужско-личное множественное число меняет SK на SC, как POLSKI → POLSCY: ZWYCIĘSCY ŻOŁNIERZE «солдаты-победители», читается «звыце́у̃сцы»." }
  - { kind: usage, text: "Степеней сравнения у слова нет: победа либо есть, либо её нет, поэтому в карточке одиннадцать форм. Слово нейтральное и частое в спорте, политике и истории: ZWYCIĘSKI GOL «победный гол», ZWYCIĘSKA BITWA «победоносная битва», ZWYCIĘSKA PRACA «работа-победитель» на конкурсе." }
collocations:
  - { pl: "zwycięska drużyna", ru: "команда-победительница" }
  - { pl: "zwycięski gol", ru: "победный гол" }
  - { pl: "zwycięska bitwa", ru: "победоносная битва" }
  - { pl: "zwycięski uśmiech", ru: "победная улыбка" }
family:
  - { pl: "zwycięstwo", ru: "победа", relation: root, id: zwyciestwo }
  - { pl: "zwycięzca", ru: "победитель", relation: root, id: zwyciezca }
  - { pl: "zwyciężyć", ru: "победить", relation: root, id: zwyciezyc }
  - { pl: "zwycięsko", ru: "победно, победителем", relation: derived }
  - { pl: "przegrany", ru: "проигравший", relation: antonym }
synonyms: ["triumfalny"]
etymology: "Прилагательное от ZWYCIĘSTWO «победа» и ZWYCIĘZCA «победитель». Этот корень обычно возводят к тому же праславянскому слову, что и русское «витязь»: польский победитель исторически «витязь»."
memory: "Zwycięski — «победный»: от zwycięstwo «победа» и zwycięzca «победитель». Где по-русски «команда-победительница», по-польски просто zwycięska drużyna. Во множественном о людях SK меняется на SC: zwycięscy żołnierze."
idioms:
  - { pl: "zwycięski pochód", ru: "победное шествие (о том, что распространяется без помех)" }
