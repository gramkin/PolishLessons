etymology: "Из французского слова со значением «распорядитель, управляющий». Русское «режиссёр» — то же слово, но с французским «ё»."
memory: "Reżyser — режиссёр, читается «рэжы́сэр». Reżyserzy — режиссёры. W reżyserii Wajdy — в постановке Вайды. Dyrektor — директор."
