notes:
  - { kind: false-friend, text: "REŻYSER — «режиссёр», но без «ё» и с Y: «рэжы́сэр». Директор фирмы или школы — DYREKTOR, а не REŻYSER. Режиссура — REŻYSERIA: W REŻYSERII WAJDY, «в постановке Вайды»." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном R переходит в RZ: REŻYSERZY. В местном тоже: O REŻYSERZE. Женщина — REŻYSERKA." }
  - { kind: government, text: "Режиссёр чего — родительный: REŻYSER FILMU, REŻYSER SPEKTAKLU. Стать режиссёром — ZOSTAĆ REŻYSEREM, творительный." }
  - { kind: pronunciation, text: "Читается «рэжы́сэр», ударение на предпоследнем слоге. RE и SE твёрдые, ŻY — «жы»." }
collocations:
