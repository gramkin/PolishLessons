formExamples:
  - form: "zaskoczeni"
    pl: "Wszyscy byli zaskoczeni."
    ru: "Все были удивлены."
    source: { kind: translated, id: 7703657 }
  - form: "zaskoczeni"
    pl: "Byliśmy zaskoczeni wybuchem."
    ru: "Мы были поражены взрывом."
    source: { kind: translated, id: 3973727 }
  - form: "zaskoczeni"
    pl: "Byliśmy zaskoczeni jego zachowaniem."
    ru: "Мы были удивлены его поведением."
    source: { kind: translated, id: 6534460 }
  - form: "zaskoczeni"
    pl: "Gdyby śnieg spadł w maju byliby tym zaskoczeni."
    ru: "Они бы удивились, если бы в мае пошёл снег."
    source: { kind: tatoeba, id: 593955 }
  - form: "zaskoczenie"
    pl: "Zaskoczenie i zachwyt - oto pierwszy krok ku zrozumieniu."
    ru: "Изумление, удивление - это первый шаг на пути к постижению."
    source: { kind: tatoeba, id: 350103 }
  - form: "zaskoczenie"
    pl: "Tom i Mary mówią, że to dla nich żadne zaskoczenie."
    ru: "Том и Мэри говорят, что для них это не неожиданность."
    source: { kind: translated, id: 13337041 }
  - form: "zaskoczenie"
    pl: "To, że zdał egzamin, to dla nas wielkie zaskoczenie."
    ru: "То, что он сдал экзамен, для нас большая неожиданность."
    source: { kind: translated, id: 933462 }
  - form: "zaskoczeniem"
    pl: "Ich rozwód okazał się całkowitym zaskoczeniem."
    ru: "Их развод оказался полной неожиданностью."
    source: { kind: translated, id: 1169938 }
  - form: "zaskoczeniem"
    pl: "Jej nagła śmierć była wielkim zaskoczeniem dla nas"
    ru: "Её внезапная смерть была для нас большой неожиданностью."
    source: { kind: translated, id: 2832421 }
  - form: "zaskoczeniem"
    pl: "Porażka nie była zaskoczeniem. Przeciwnik był bardzo silny."
    ru: "Поражение не стало неожиданностью. Противник был очень силён."
    source: { kind: translated, id: 13324696 }
  - form: "zaskoczeniu"
    pl: "Ku mojemu zaskoczeniu, miał przepiękny głos."
    ru: "К моему удивлению, у него был прекрасный голос."
    source: { kind: translated, id: 3313301 }
  - form: "zaskoczeniu"
    pl: "Ku zaskoczeniu okazało się, że był on złodziejem."
    ru: "К удивлению оказалось, что он был вором."
    source: { kind: translated, id: 1896083 }
  - form: "zaskoczeniu"
    pl: "Ku mojemu zaskoczeniu antropolog został oskarżony o zabójstwo."
    ru: "К моему удивлению, антрополога обвинили в убийстве."
    source: { kind: translated, id: 2680537 }
  - form: "zaskoczona"
    pl: "Nie bądź zaskoczona."
    ru: "Не удивляйся."
    source: { kind: translated, id: 9686434 }
  - form: "zaskoczona"
