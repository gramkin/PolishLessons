# review
id: zaskoczyc
format: 2
lemma: "zaskoczyć"
rank: 1083
pos: verb
aspect: perf
pron: { cyr: "заско́чыць" }
senses:
  - id: surprise
    ru: "удивить, застать врасплох"
    examples:
      - pl: "Tom mnie zaskoczył."
        ru: "Том меня удивил."
        source: { kind: translated, id: 8541287 }
      - pl: "Reakcja Toma mnie zaskoczyła."
        ru: "Реакция Тома меня удивила."
        source: { kind: translated, id: 12069082 }
      - pl: "To mnie zaskoczyło."
        ru: "Это меня удивило."
        source: { kind: translated, id: 5558350 }
  - id: surprised
    ru: "zaskoczony — удивлённый (причастие)"
    examples:
      - pl: "Byłem zaskoczony."
        ru: "Я был удивлён."
        source: { kind: translated, id: 9226382 }
      - pl: "Byłem mile zaskoczony."
        ru: "Я был приятно удивлён."
        source: { kind: translated, id: 364277 }
      - pl: "Wcale nie jest zaskoczona."
        ru: "Она совсем не удивлена."
        source: { kind: translated, id: 350710 }
  - id: surprise-noun
    ru: "zaskoczenie — неожиданность, сюрприз"
    examples:
      - pl: "Zaskoczenie i zachwyt - oto pierwszy krok ku zrozumieniu."
        ru: "Изумление, удивление - это первый шаг на пути к постижению."
        source: { kind: tatoeba, id: 350103 }
      - pl: "Ich rozwód okazał się całkowitym zaskoczeniem."
        ru: "Их развод оказался полной неожиданностью."
        source: { kind: translated, id: 1169938 }
      - pl: "Ku mojemu zaskoczeniu, miał przepiękny głos."
        ru: "К моему удивлению, у него был прекрасный голос."
        source: { kind: translated, id: 3313301 }
notes:
  - { kind: government, text: "zaskoczyć kogoś «удивить кого-то» — винительный падеж. А «быть удивлённым чем-то» — być zaskoczonym czymś, творительный: Byliśmy zaskoczeni wybuchem." }
  - { kind: usage, text: "Ku mojemu zaskoczeniu «к моему удивлению» — готовый оборот: предлог ku требует дательного падежа." }
  - { kind: usage, text: "Существительное zaskoczenie значит «неожиданность, сюрприз»: wziąć z zaskoczenia «застать врасплох»." }
  - { kind: usage, text: "Вид совершенный; несовершенный — zaskakiwać." }
collocations:
  - { pl: "zaskoczyć kogoś", ru: "удивить кого-то" }
  - { pl: "być zaskoczonym", ru: "быть удивлённым" }
  - { pl: "ku mojemu zaskoczeniu", ru: "к моему удивлению" }
etymology: "Приставка za- и skoczyć «прыгнуть»: буквально «наскочить». Русское «застать врасплох» рисует ту же картинку внезапного движения."
memory: "zaskoczyć — «удивить, застать врасплох»: Tom mnie zaskoczył. Причастие zaskoczony значит «удивлённый», а существительное zaskoczenie — «неожиданность». Запомните оборот Ku mojemu zaskoczeniu «К моему удивлению»."
idioms:
  - { pl: "ku mojemu zaskoczeniu", ru: "к моему удивлению" }
  - { pl: "wziąć z zaskoczenia", ru: "застать врасплох" }
  - { pl: "mile zaskoczony", ru: "приятно удивлён" }
  - { pl: "zima zaskoczyła drogowców", ru: "зима застала дорожников врасплох" }
