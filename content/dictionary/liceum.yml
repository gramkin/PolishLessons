notes:
  - { kind: usage, text: "liceum — польская старшая школа, после gimnazjum и перед университетом; русскому «лицей» соответствует лишь отчасти, обычно это просто «старшие классы»." }
  - { kind: usage, text: "Латинское заимствование среднего рода: в единственном числе слово не склоняется (do liceum, w liceum, z liceum), а множественное — licea, liceów, liceach." }
  - { kind: usage, text: "Неизменяемость в единственном — общая черта латинских слов на -um: muzeum, centrum, gimnazjum." }
  - { kind: usage, text: "Ученик лицея — licealista; chodzić do liceum «ходить в лицей»." }
collocations:
  - { pl: "chodzić do liceum", ru: "ходить в лицей" }
  - { pl: "skończyć liceum", ru: "окончить лицей" }
  - { pl: "uczeń liceum", ru: "ученик лицея" }
etymology: "Из латинского Lyceum, а то — из греческого Λύκειον, названия рощи под Афинами, где учил Аристотель. Русский «лицей» пришёл тем же путём, так что слова прямо родственны."
memory: "liceum = «лицей», польская старшая школа. Главное для склонения: в единственном числе слово не меняется — do liceum, w liceum, z liceum, как muzeum и centrum. Множественное — licea."
