# review
id: akurat
format: 2
lemma: "akurat"
rank: 1614
pos: part
pron: { cyr: "аку́рат" }
senses:
  - id: exactly
    ru: "как раз, точно (о времени, количестве)"
    examples:
      - pl: "Byłem akurat na czas."
        ru: "Я был как раз вовремя."
        source: { kind: translated, id: 3835933 }
      - pl: "Przyszedłeś akurat na czas."
        ru: "Ты пришёл как раз вовремя."
        source: { kind: translated, id: 3665333 }
      - pl: "Akurat tyle mi potrzeba."
        ru: "Как раз столько мне и нужно."
        source: { kind: authored }
  - id: precisely-this
    ru: "именно (выделение одного из многих)"
    examples:
      - pl: "Tym razem akurat mam rację."
        ru: "На этот раз именно я прав."
        source: { kind: translated, id: 768811 }
      - pl: "Tom akurat pości."
        ru: "Том как раз постится."
        source: { kind: translated, id: 8511379 }
      - pl: "To akurat nic nowego."
        ru: "Это как раз ничего нового."
        source: { kind: translated, id: 3750216 }
  - id: ironic
    ru: "как же!, ага, конечно (ироническое возражение)"
    examples:
      - pl: "Akurat!"
        ru: "Как же!"
        source: { kind: translated, id: 11261945 }
      - pl: "Akurat! Nie wierzę w to."
        ru: "Как же! Я в это не верю."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Частица не склоняется — у неё одна форма. Стоит обычно перед выделяемым словом: akurat teraz «как раз сейчас», akurat on «именно он»." }
  - { kind: false-friend, text: "Польское akurat — это не русское «аккуратно». «Аккуратно» по-польски starannie или dokładnie, а akurat значит «как раз, именно»." }
  - { kind: usage, text: "Отдельное восклицание Akurat! значит ироническое «как же!, ага, конечно» — вежливый способ не поверить собеседнику." }
  - { kind: usage, text: "Частый оборот — akurat na czas «как раз вовремя»." }
collocations:
  - { pl: "akurat na czas", ru: "как раз вовремя" }
  - { pl: "akurat teraz", ru: "как раз сейчас" }
  - { pl: "akurat tyle", ru: "как раз столько" }
etymology: "Из латинского accuratus «тщательный, точный» через немецкое akkurat. Русское «аккуратный» — то же слово, но в польском значение ушло от «тщательно» к «точно, как раз»."
memory: "akurat = «как раз, именно», а вовсе не «аккуратно» — это главная ловушка для русского уха. Akurat na czas «как раз вовремя». А отдельное Akurat! значит ироническое «как же!»."
idioms:
