notes:
  - { kind: false-friend, text: "ŚCIŚLE — и «тесно, плотно», и «строго, точно». ŚCIŚLE TAJNE — «совершенно секретно». Прилагательное ŚCISŁY — «точный, строгий»: NAUKI ŚCISŁE, «точные науки». Корень — ŚCISNĄĆ, русское «стиснуть»." }
  - { kind: usage, text: "Наречие со степенями: ŚCIŚLE, ŚCIŚLEJ, NAJŚCIŚLEJ. Сравнительная часто в обороте ŚCIŚLEJ MÓWIĄC, «точнее говоря». Превосходная — в NAJŚCIŚLEJ STRZEŻONA TAJEMNICA, «строжайшая тайна»." }
  - { kind: government, text: "Наречие ничем не управляет. Тесно связан с чем-то — ŚCIŚLE ZWIĄZANY Z, и творительный: ŚCIŚLE ZWIĄZANY Z HISTORIĄ." }
  - { kind: pronunciation, text: "Читается «сьци́сьле», ударение на первом слоге. Ś — «сь», CI — «ци», ŚL — «сьл»." }
collocations:
  - { pl: "ściśle tajne", ru: "совершенно секретно" }
  - { pl: "ściśle mówiąc", ru: "строго говоря" }
  - { pl: "ściśle związany", ru: "тесно связанный" }
family:
  - { pl: "ścisnąć", ru: "стиснуть, сжать", relation: root }
  - { pl: "ścisły", ru: "точный, строгий; тесный", relation: root, id: scisly }
  - { pl: "ścisk", ru: "давка, теснота", relation: root }
etymology: "От ŚCISŁY, а то — от ŚCISNĄĆ «стиснуть, сжать», родственного русскому «стиснуть». Стиснутое — тесное и плотное, а отсюда и «строгое, точное»."
memory: "Ściśle — тесно и строго: ściśle tajne — совершенно секретно, ściśle mówiąc — строго говоря. Читается «сьци́сьле». Ścisnąć — стиснуть."
idioms:
