# review
id: walczyc
format: 2
lemma: "walczyć"
rank: 409
pos: verb
aspect: imperf
pron: { cyr: "ва́льчыць" }
senses:
  - id: fight-for
    ru: "бороться, сражаться (за что-либо)"
    examples:
      - pl: "Oni walczą o wolność."
        ru: "Они борются за свободу."
        source: { kind: tatoeba, id: 3655771 }
      - pl: "Firma walczy o przetrwanie."
        ru: "Компания борется за выживание."
        source: { kind: tatoeba, id: 2146656 }
      - pl: "Walczą o nagrodę."
        ru: "Они борются за награду."
        source: { kind: translated, id: 899569 }
  - id: fight-with
    ru: "бороться (с кем-либо, с чем-либо)"
    examples:
      - pl: "Kto walczy, może przegrać. Kto nie walczy - już przegrał."
        ru: "Кто борется, может проиграть. Кто не борется - уже проиграл."
        source: { kind: tatoeba, id: 2421546 }
      - pl: "Walczyłem ze snem."
        ru: "Я боролся со сном."
        source: { kind: translated, id: 2290690 }
      - pl: "Ona walczyła o prawa kobiet."
        ru: "Она боролась за права женщин."
        source: { kind: translated, id: 6935666 }
notes:
  - { kind: usage, text: "За что борются — предлог o с винительным падежом: walczyć o wolność «бороться за свободу», walczyć o przetrwanie «бороться за выживание»." }
  - { kind: usage, text: "С кем или с чем борются — предлог z с творительным: walczyć z wrogiem «бороться с врагом», walczyć ze sobą «бороться с собой»." }
  - { kind: false-friend, text: "Прямого русского двойника у слова нет. Русское «бороться» идёт от другого корня, который в польском дал bój «бой» и borykać się «маяться»." }
  - { kind: usage, text: "От существительного walka «борьба, бой»; отсюда же walka o byt «борьба за существование»." }
collocations:
  - { pl: "walczyć o wolność", ru: "бороться за свободу" }
  - { pl: "walczyć ze sobą", ru: "бороться с собой" }
  - { pl: "walczyć o swoje", ru: "бороться за своё" }
  - { pl: "walka o byt", ru: "борьба за существование" }
etymology: "От существительного walka «борьба, бой». Прямого русского родственника у слова нет: русское «бороться» идёт от другого корня, давшего в польском bój «бой» и borykać się «маяться»."
memory: "walczyć — «бороться, сражаться», и запоминать надо два предлога: walczyć o coś «бороться за что-то» (винительный) и walczyć z kimś «бороться с кем-то» (творительный). Русского двойника у корня нет, зато рядом стоит walka «борьба»."
idioms:
  - { pl: "walczyć z wiatrakami", ru: "сражаться с ветряными мельницами" }
  - { pl: "walczyć o swoje", ru: "бороться за своё" }
  - { pl: "walczyć na dwa fronty", ru: "воевать на два фронта" }
