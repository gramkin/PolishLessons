        ru: "Я хотел бы когда-нибудь работать в этой лаборатории."
        source: { kind: translated, id: 792292 }
  - id: teaching-lab
    ru: "учебная лаборатория; лаборатории"
    examples:
      - pl: "To w tym laboratorium uczymy się codziennie."
        ru: "Именно в этой лаборатории мы занимаемся каждый день."
        source: { kind: translated, id: 718949 }
      - pl: "W pierwszej kolejności porozmawiajmy o eksperymentach przeprowadzanych w laboratoriach."
        ru: "Прежде всего поговорим об экспериментах, проводимых в лабораториях."
        source: { kind: translated, id: 2679628 }
      - pl: "Jest to naturalne laboratorium z wieloma gatunkami roślin, zwierząt i owadów."
        ru: "Это естественная лаборатория со множеством видов растений, животных и насекомых."
        source: { kind: translated, id: 521416 }
notes:
  - { kind: government, text: "Слово среднего рода, и в единственном числе оно не склоняется: w laboratorium «в лаборатории», do laboratorium «в лабораторию», z laboratorium «из лаборатории» — форма одна и та же." }
  - { kind: usage, text: "Склоняется только множественное число: laboratoria «лаборатории», laboratoriów «лабораторий», w laboratoriach «в лабораториях»." }
  - { kind: usage, text: "Тот же образец у всех заимствований на -um: muzeum, gimnazjum, akwarium, centrum. Все они в единственном числе неизменяемы." }
  - { kind: pronunciation, text: "Конечное -um звучит как «-юм», а l мягкое: ляборато́рьюм." }
collocations:
  - { pl: "w laboratorium", ru: "в лаборатории" }
  - { pl: "do laboratorium", ru: "в лабораторию" }
  - { pl: "laboratorium badawcze", ru: "исследовательская лаборатория" }
etymology: "Из средневековой латыни laboratorium «место работы», от laborare «трудиться». Русская «лаборатория» — то же заимствование, но она получила русское окончание и потому склоняется."
memory: "laboratorium — «лаборатория», средний род, и в единственном числе не склоняется: w laboratorium, do laboratorium. Так же ведут себя muzeum, gimnazjum и akwarium. Склоняется только множественное: laboratoria."
