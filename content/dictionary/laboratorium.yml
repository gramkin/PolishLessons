senses:
  - id: lab
    ru: "лаборатория"
    examples:
      - pl: "Sami musi iść do laboratorium."
        ru: "Сами должен идти в лабораторию."
        source: { kind: translated, id: 7151328 }
      - pl: "Wszystko zaczęło się w tym laboratorium."
        ru: "Всё началось в этой лаборатории."
        source: { kind: translated, id: 6546484 }
