# review
id: samobojstwo
format: 2
lemma: "samobójstwo"
rank: 1544
pos: noun
pron: { cyr: "самобу́йство" }
senses:
  - id: suicide
    ru: "самоубийство"
    examples:
      - pl: "On popełnił samobójstwo."
        ru: "Он покончил с собой."
        source: { kind: translated, id: 7679632 }
      - pl: "Bohaterka tej powieści popełniła samobójstwo."
        ru: "Героиня романа покончила жизнь самоубийством."
        source: { kind: tatoeba, id: 582170 }
      - pl: "Próbowała popełnić samobójstwo."
        ru: "Она пыталась покончить с собой."
        source: { kind: translated, id: 356927 }
  - id: figurative
    ru: "самоубийство (о гибельном поступке)"
    examples:
      - pl: "To samobójstwo!"
        ru: "Это самоубийство!"
        source: { kind: translated, id: 10598384 }
      - pl: "Była na granicy samobójstwa."
        ru: "Она была на грани самоубийства."
        source: { kind: translated, id: 406203 }
notes:
  - { kind: government, text: "Устойчиво: popełnić samobójstwo «совершить самоубийство». Русское «покончить с собой» строится иначе, поэтому кальку делать нельзя." }
  - { kind: usage, text: "Слово прозрачно разбирается: samo- «само-» + bójstwo от bić «бить, убивать» — как русское «само-убийство»." }
  - { kind: usage, text: "Переносно: To samobójstwo! «Это самоубийство!» — о заведомо гибельном шаге." }
  - { kind: usage, text: "Прилагательное — samobójczy «самоубийственный», а samobójca — «самоубийца»." }
collocations:
  - { pl: "popełnić samobójstwo", ru: "совершить самоубийство" }
  - { pl: "próba samobójstwa", ru: "попытка самоубийства" }
  - { pl: "myśleć o samobójstwie", ru: "думать о самоубийстве" }
etymology: "Составное слово: samo- «само» плюс bójstwo от bić «бить, убивать». Русское «самоубийство» собрано ровно теми же частями — оба языка следуют одному образцу, вероятно через латинское suicidium."
memory: "samobójstwo = «самоубийство», и разбирается оно прозрачно: samo- + bójstwo, как в русском. Но глагол другой: popełnić samobójstwo «совершить самоубийство», а не «покончить с собой»."
idioms:
  - { pl: "popełnić samobójstwo", ru: "совершить самоубийство" }
  - { pl: "próba samobójstwa", ru: "попытка самоубийства" }
  - { pl: "to samobójstwo!", ru: "это самоубийство!" }
