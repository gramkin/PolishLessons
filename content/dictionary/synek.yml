notes:
  - { kind: pronunciation, text: "Гласная e беглая: SYNEK, но SYNKA, synkiem, synków. Это обычное устройство существительных на -ek, уже знакомое по czwartek, smutek, żołądek, upadek и podatek. Форма synku служит предложным и звательным сразу." }
  - { kind: usage, text: "Именительный множественного — SYNKOWIE, с почтительным окончанием -owie. Это стоит заметить: -owie обычно отмечает уважение, как в panowie, synowie, wujowie, profesorowie, а здесь его берёт уменьшительное, ласковое слово. Польский, в отличие от русского, не считает эти две окраски несовместимыми." }
collocations:
  - { pl: "mój synek", ru: "мой сынок" }
  - { pl: "najmłodszy synek", ru: "младший сынок" }
  - { pl: "synek sąsiadów", ru: "сынок соседей" }
family:
  - { pl: "syn", ru: "сын", relation: root, id: syn }
  - { pl: "synuś", ru: "сыночек", relation: derived }
  - { pl: "synowski", ru: "сыновний", relation: derived }
etymology: "Уменьшительное от SYN, из праславянского *synъ — то же слово, что русский «сын», с суффиксом -ek. Русский «сынок» собран точно так же и тем же способом, так что пара syn/synek отвечает нашей «сын/сынок» без остатка. Необычно здесь только множественное synkowie с почтительным окончанием."
memory: "Беглая e: synek, но synka. А множественное почтительное: SYNKOWIE, как synowie и panowie."
