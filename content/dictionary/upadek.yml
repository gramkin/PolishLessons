notes:
  - { kind: pronunciation, text: "Гласная e беглая: UPADEK, но UPADKU, upadkiem, upadki. Это уже знакомое устройство существительных на -ek, рядом с czwartek — czwartku, smutek — smutku и żołądek — żołądka. Форма upadku при этом служит сразу родительным, предложным и звательным." }
  - { kind: usage, text: "Одно польское слово покрывает два русских. UPADEK — это и падение в прямом смысле, upadek z drabiny, и упадок, крах: upadek imperium, upadek firmy, upadek moralny. Русский для второго значения берёт отдельное «упадок», хотя построено оно из тех же частей. Глагол при этом значении — chylić się ku upadkowi, «идти к упадку»." }
collocations:
  - { pl: "upadek z drabiny", ru: "падение с лестницы" }
  - { pl: "upadek imperium", ru: "падение империи" }
  - { pl: "upadek moralny", ru: "моральное падение" }
family:
  - { pl: "upaść", ru: "упасть", relation: root }
  - { pl: "padać", ru: "падать", relation: root, id: padac }
  - { pl: "spadek", ru: "падение; наследство", relation: root }
etymology: "Приставка u- и корень pad-, из праславянского *padati «падать» — то же слово, что русское «падать». Русский «упадок» собран из тех же частей и тем же способом, поэтому совпадение полное. Из этого же гнезда польские spadek, który значит и падение, и наследство, и upadłość «несостоятельность»."
memory: "Беглая e: upadek, но do upadku. И одно слово на два русских: и падение, и упадок."
idioms:
  - { pl: "chylić się ku upadkowi", ru: "идти к упадку" }
  - { pl: "upadek moralny", ru: "моральное падение" }
formExamplesSkip:
