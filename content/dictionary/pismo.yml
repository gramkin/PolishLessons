notes:
  - { kind: usage, text: "Дательный и местный у этого слова разные: PISMU в дательном, PIŚMIE в местном, с переходом s в ś. И это уточняет правило точнее, чем можно было решить по словам вроде ŚRODOWISKU и CIASTKU, где дательный с местным совпали. Дело не в роде, а в том, на что кончается основа. Если на заднеязычный — k, g, ch, — то средний и мужской род уходят от окончания -e и берут в местном -u: środowisku, ciastku, dzienniku, pliku. Если основа кончается на любой другой согласный, местный берёт -e и согласный смягчается: piśmie, ogonie, dymie, zgonie, urzędzie, produkcie, zwrocie. Женский род берёт -e в обоих падежах всегда." }
  - { kind: pronunciation, text: "Сравните написание: PISMO с твёрдым s, но PIŚMIE с ś. Звук смягчился, и запись это показала — причём именно значком ś, а не сочетанием si, потому что за согласным идёт согласный m. Это то самое правило, которое объясняет пару mięsień и mięśnia: ś пишется значком перед согласной и буквосочетанием si перед гласной. Здесь оба условия видны в одном слове." }
  - { kind: false-friend, text: "Русское «письмо» в обычном смысле — то, что кладут в конверт и отправляют знакомому, — по-польски называется LIST, а не pismo. PISMO значит официальную бумагу из учреждения: pismo z sądu, pismo urzędowe. Кроме этого оно значит письменность (pismo klinowe «клинопись», pismo łacińskie), почерк (ma ładne pismo) и периодическое издание, журнал (pismo literackie). Четыре смысла, и личного письма среди них нет." }
collocations:
  - { pl: "pismo urzędowe", ru: "официальное письмо" }
  - { pl: "na piśmie", ru: "в письменном виде" }
  - { pl: "pismo odręczne", ru: "рукописный текст" }
family:
  - { pl: "pisać", ru: "писать", relation: root, id: pisac }
  - { pl: "podpis", ru: "подпись", relation: derived, id: podpis }
  - { pl: "napis", ru: "надпись", relation: derived, id: napis }
etymology: "От PISAĆ «писать», из праславянского *pisati — того же корня, что русское «писать», в родстве с латинским pingere «изображать», откуда «пигмент». Польский отдал слову официальную бумагу, письменность, почерк и журнал, а личное письмо назвал LIST, из немецкого Liste «список, полоса». Русский же оставил «письмо» и личному письму, и письменности, но для журнала и бумаги из суда взял другие слова."
memory: "Личное письмо — это list, а не pismo. Дательный pismu, но местный piśmie: у неzаднеязычных основ местный берёт -e и смягчает."
