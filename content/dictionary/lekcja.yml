# review
id: lekcja
format: 2
lemma: "lekcja"
rank: 1276
pos: noun
pron: { cyr: "ле́кцья" }
senses:
  - id: class
    ru: "урок, занятие"
    examples:
      - pl: "To jest nasza pierwsza lekcja."
        ru: "Это наш первый урок."
        source: { kind: translated, id: 3085318 }
      - pl: "Lekcja zaczyna się dopiero o wpół do dziewiątej."
        ru: "Урок начинается только в половине девятого."
        source: { kind: translated, id: 2123335 }
      - pl: "W naszej szkole lekcje zaczynają się o ósmej."
        ru: "Занятия у нас в школе начинаются в восемь."
        source: { kind: tatoeba, id: 10747480 }
  - id: homework
    ru: "lekcje — домашнее задание: odrabiać lekcje «делать уроки»"
    examples:
      - pl: "Zrobiłem lekcje."
        ru: "Я сделал уроки."
        source: { kind: translated, id: 973166 }
      - pl: "Odrabiam lekcje."
        ru: "Я делаю уроки."
        source: { kind: translated, id: 8444389 }
      - pl: "Zrobiłeś już lekcje?"
        ru: "Ты уже сделал уроки?"
        source: { kind: translated, id: 937257 }
  - id: after-class
    ru: "po lekcjach — после уроков"
    examples:
      - pl: "Zwykle gram w baseballa po lekcjach."
        ru: "Обычно я играю в бейсбол после уроков."
        source: { kind: translated, id: 956881 }
      - pl: "Nauczyciel zostawił go po lekcjach."
        ru: "Учитель оставил его после уроков."
        source: { kind: translated, id: 969805 }
      - pl: "Nie mam czasu pomagać wam w lekcjach."
        ru: "У меня нет времени помогать вам с уроками."
        source: { kind: tatoeba, id: 10747483 }
notes:
  - { kind: false-friend, text: "Внимание: lekcje во множественном значит не только «уроки в школе», но и «домашнее задание»: odrabiać lekcje «делать уроки»." }
  - { kind: government, text: "na lekcji «на уроке», po lekcjach «после уроков», pomagać w lekcjach «помогать с уроками» — все три с предложным падежом." }
  - { kind: usage, text: "Третье значение — «урок» как жизненный опыт: To była dla mnie lekcja «Это было мне уроком»." }
  - { kind: usage, text: "Глагол для домашнего задания — odrabiać lekcje, буквально «отрабатывать уроки»." }
collocations:
  - { pl: "odrabiać lekcje", ru: "делать уроки" }
  - { pl: "na lekcji", ru: "на уроке" }
  - { pl: "po lekcjach", ru: "после уроков" }
  - { pl: "lekcja angielskiego", ru: "урок английского" }
etymology: "Из латинского lectio «чтение», от legere «читать». Русский «урок» — своё слово, зато «лекция» восходит к тому же латинскому корню."
memory: "lekcja — «урок», а во множественном lekcje ещё и «домашнее задание»: odrabiać lekcje «делать уроки». Предлоги: na lekcji «на уроке», po lekcjach «после уроков». Родственно русской «лекции»."
idioms:
  - { pl: "odrabiać lekcje", ru: "делать уроки" }
  - { pl: "dać komuś lekcję", ru: "проучить кого-то" }
  - { pl: "po lekcjach", ru: "после уроков" }
formExamplesSkip:
  - { form: "lekcjo", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
  - { form: "lekcyj", reason: "в корпусе нет примеров для этой формы" }
