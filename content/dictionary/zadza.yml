# review
id: zadza
format: 2
lemma: "żądza"
rank: 6080
pos: noun
pron: { cyr: "жо́ндза" }
senses:
  - id: craving
    ru: "żądza czegoś — жажда, неуёмное желание (власти, мести, денег, славы, знаний)"
    examples:
      - pl: "Jego żądza władzy nie zna granic."
        ru: "Его жажда власти не знает границ."
        source: { kind: translated, id: 12384989 }
      - pl: "Ma wielką żądzę sukcesu."
        ru: "У него огромная жажда успеха."
        source: { kind: translated, id: 856181 }
      - pl: "Kierowała nim żądza zemsty."
        ru: "Им двигала жажда мести."
        source: { kind: authored }
  - id: lust
    ru: "(чаще мн. ч.) страсти, плотские желания, вожделение"
    examples:
      - pl: "Był niewolnikiem własnych żądz."
        ru: "Он был рабом собственных страстей."
        source: { kind: authored }
      - pl: "Mnich walczył z pokusą i tłumił w sobie żądze."
        ru: "Монах боролся с искушением и подавлял в себе страсти."
        source: { kind: authored }
      - pl: "Poeta pisał o miłości i cielesnych żądzach."
        ru: "Поэт писал о любви и плотских желаниях."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ŻĄDZA и русское «жажда» — одно и то же праславянское слово (польское ą на месте русского «а», как в zając — «заяц»). Но польское слово только переносное: жажда власти, мести, денег. Жажда в прямом смысле, когда хочется пить, — PRAGNIENIE: Mam pragnienie, «Мне хочется пить». Сказать mam żądzę о воде нельзя." }
  - { kind: government, text: "Чего — родительный без предлога, как в русском: żądza władzy «жажда власти», żądza zemsty «жажда мести», żądza wiedzy «жажда знаний». Поддаться — ULEC ŻĄDZY (дательный); владеть собой — PANOWAĆ NAD ŻĄDZAMI." }
  - { kind: register, text: "Книжное и сильное слово, почти всегда с осуждением: żądza zysku «жажда наживы», żądza krwi «жажда крови». О нейтральном желании говорят CHĘĆ или PRAGNIENIE. Во множественном числе ŻĄDZE обычно значит «страсти, плотские желания» — в языке проповеди, морали и литературы." }
  - { kind: pronunciation, text: "«жо́ндза»: ą перед dz звучит как «он». В родительном множественного ŻĄDZ конечное dz оглушается: «жонц»." }
collocations:
  - { pl: "żądza władzy", ru: "жажда власти" }
  - { pl: "żądza zemsty", ru: "жажда мести" }
  - { pl: "żądza zysku", ru: "жажда наживы" }
  - { pl: "żądza wiedzy", ru: "жажда знаний" }
  - { pl: "ulec żądzy", ru: "поддаться страсти" }
family:
  - { pl: "żądać", ru: "требовать", relation: root, id: zadac-2 }
  - { pl: "pożądać", ru: "вожделеть, страстно желать", relation: derived }
  - { pl: "pożądanie", ru: "вожделение, страстное желание", relation: derived }
  - { pl: "pożądany", ru: "желанный, желательный", relation: derived }
  - { pl: "żądny", ru: "жаждущий чего-л. (żądny przygód)", relation: derived }
synonyms: ["pragnienie", "pożądanie"]
etymology: "Праславянское *žędja «жажда», от того же корня, что русские «жажда», «жаждать», «жадный». В польском носовой гласный сохранился: ŻĄDZA, ŻĄDNY «жаждущий», а от «жаждать» вырос глагол ŻĄDAĆ — «требовать», то есть жаждать вслух."
memory: "Ż-Ą-DZ-A — это «Ж-А-ЖД-А» с носовым: жажда власти, жажда мести — żądza władzy, żądza zemsty. Только воду так не жаждут: пить хочется — pragnienie."
idioms:
  - { pl: "żądza krwi", ru: "жажда крови, кровожадность" }
  - { pl: "dyszeć żądzą zemsty", ru: "дышать местью, жаждать мести" }
  - { pl: "żądny przygód", ru: "жадный до приключений" }
formExamplesSkip:
  - { form: "żądzo", reason: "звательный падеж: к понятию не обращаются, разве что в высокой поэзии" }
