notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ЛОВУШКА, И ОНА В СИЛЕ СЛОВА. Польское przyjaciel — родственник русского «ПРИЯТЕЛЬ», но значит оно гораздо больше: это БЛИЗКИЙ ДРУГ, человек на всю жизнь. Русский «приятель» — наоборот, знакомый, с которым не особенно близки. То, что русский зовёт приятелем, поляк назовёт kolega. Поэтому przyjaźnić się переводится «дружить», а не «приятельствовать», и сказать o kimś mój przyjaciel — это заявление, а не проходная реплика." }
  - { kind: government, text: "Дружат С кем — предлог z с ТВОРИТЕЛЬНЫМ, в точности как по-русски: przyjaźnić się z sąsiadem, z nimi, ze szkolnym kolegą. Глагол живёт только с się; переходного «дружить кого-то» нет ни в польском, ни в русском." }
  - { kind: usage, text: "У повелительного наклонения ДВА РАВНОПРАВНЫХ ряда: przyjaźnij się, przyjaźnijmy się, przyjaźnijcie się и более короткие przyjaźń się, przyjaźńmy się, przyjaźńcie się. Оба правильны, короткие звучат чуть книжнее. Потому и форм в парадигме пятьдесят пять, а не пятьдесят две." }
  - { kind: register, text: "Вид несовершенный, и пары на совершенный у глагола по сути нет: дружба — состояние, а не событие. Начало дружбы передают оборотом zaprzyjaźnić się «подружиться», и вот он уже совершенный." }
collocations:
  - { pl: "przyjaźnić się z kimś", ru: "дружить с кем-л." }
  - { pl: "przyjaźnić się od dziecka", ru: "дружить с детства" }
  - { pl: "zaprzyjaźnić się", ru: "подружиться" }
family:
  - { pl: "przyjaciel", ru: "друг (близкий)", relation: root, id: przyjaciel }
  - { pl: "przyjaźń", ru: "дружба", relation: root }
  - { pl: "kolega", ru: "приятель, товарищ", relation: derived, id: kolega }
etymology: "От przyjaźń «дружба», а та — от przyjaciel, из праславянского *prijatelь «тот, кто благоволит». Русские «приятель» и «приятный» выросли из того же корня, только русский оставил ему лёгкую окраску, а польский — тяжёлую: przyjaciel стал близким другом. Один корень, две разные меры близости."
memory: "przyjaźnić się — «дружить», с z и творительным, как по-русски. Но помните меру: przyjaciel это русскому «приятелю» родня по корню и вовсе не ровня по смыслу — это близкий ДРУГ. Русский «приятель» по-польски будет kolega."
idioms:
