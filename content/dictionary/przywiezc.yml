# review
id: przywiezc
format: 2
lemma: "przywieźć"
rank: 1461
pos: verb
aspect: perf
pron: { cyr: "пшы́весьць" }
senses:
  - id: bring-vehicle
    ru: "привезти (на транспорте)"
    examples:
      - pl: "Przywiozłem ci ryż z Chin."
        ru: "Я привёз тебе рис из Китая."
        source: { kind: translated, id: 11263060 }
      - pl: "Przywiózł kilka pamiątek."
        ru: "Он привёз несколько сувениров."
        source: { kind: translated, id: 589185 }
      - pl: "Przywiózł córce nową sukienkę."
        ru: "Он привёз дочери новое платье."
        source: { kind: translated, id: 362421 }
  - id: bring-from
    ru: "привезти откуда-либо"
    examples:
      - pl: "Przywiozłem kiełbaski z Niemiec."
        ru: "Я привёз колбаски из Германии."
        source: { kind: translated, id: 11264318 }
      - pl: "Co mi przywiozłaś z Rzymu?"
        ru: "Что ты мне привезла из Рима?"
        source: { kind: translated, id: 4287078 }
      - pl: "Przywiozłam ci ryż z Chin."
        ru: "Я привезла тебе рис из Китая."
        source: { kind: translated, id: 12085338 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — przywozić. Корень тот же, что в wieźć «везти»: przywieźć значит «доставить на чём-то»." }
  - { kind: false-friend, text: "Важное различие: przywieźć — привезти на транспорте, а przynieść — принести в руках. Русский тоже различает «привезти» и «принести»." }
  - { kind: government, text: "Привезти откуда-то — przywieźć z czegoś (родительный с z): przywiozłem kiełbaski z Niemiec." }
  - { kind: usage, text: "Прошедшее время неправильное: przywiózł, но przywiozła, przywiozłem — гласная меняется с ó на o." }
collocations:
  - { pl: "przywieźć z podróży", ru: "привезти из поездки" }
  - { pl: "przywieźć pamiątki", ru: "привезти сувениры" }
  - { pl: "co mi przywiozłeś", ru: "что ты мне привёз" }
family:
  - { pl: "przywozić", ru: "привозить", relation: root }
  - { pl: "przynieść", ru: "принести", relation: root, id: przyniesc }
  - { pl: "przyjechać", ru: "приехать", relation: root, id: przyjechac }
etymology: "Приставка przy- «при-» плюс wieźć «везти» — точно как русское «при-везти». Совпадает и состав, и значение."
memory: "przywieźć — «привезти» на транспорте; принести в руках — przynieść. Откуда — z czegoś: przywiozłem to z Niemiec. В прошедшем ó меняется на o: przywiózł, но przywiozła."
idioms:
  - { pl: "przywieźć pamiątki", ru: "привезти сувениры" }
  - { pl: "co mi przywiozłeś?", ru: "что ты мне привёз?" }
  - { pl: "przywieźć z podróży", ru: "привезти из поездки" }
formExamplesSkip:
  - { form: "przywiozł", reason: "такой формы нет: мужской род прошедшего времени — przywiózł, с ó в закрытом слоге" }
  - { form: "przywiozłby", reason: "такой формы нет: частица by не добавляет слога и не открывает закрытый слог, поэтому мужской род условного наклонения — przywiózłby, с ó, как и в przywiózł" }
  - { form: "przywiozłbym", reason: "такой формы нет: частица by не добавляет слога и не открывает закрытый слог, поэтому мужской род условного наклонения — przywiózłbym, с ó, как и в przywiózł" }
  - { form: "przywiozłbyś", reason: "такой формы нет: частица by не добавляет слога и не открывает закрытый слог, поэтому мужской род условного наклонения — przywiózłbyś, с ó, как и в przywiózł" }
