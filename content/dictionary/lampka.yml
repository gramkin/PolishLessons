# review
id: lampka
format: 2
lemma: "lampka"
rank: 2253
pos: noun
pron: { cyr: "ла́мпка" }
senses:
  - id: glass-of-wine
    ru: "бокал (вина)"
    examples:
      - pl: "Wypił lampkę czerwonego wina."
        ru: "Он выпил бокал красного вина."
        source: { kind: translated, id: 361173 }
      - pl: "Poproszę lampkę białego wina."
        ru: "Мне, пожалуйста, бокал белого вина."
        source: { kind: translated, id: 722205 }
      - pl: "Czy mogę prosić lampkę wina?"
        ru: "Можно мне бокал вина?"
        source: { kind: translated, id: 3847589 }
  - id: small-lamp
    ru: "лампочка, светильник; гирлянда"
    examples:
      - pl: "Ozdobiliśmy choinkę lampkami."
        ru: "Мы украсили ёлку гирляндами."
        source: { kind: translated, id: 1086530 }
      - pl: "Porozmawiajmy o tym przy lampce wina w ciepłych źródłach."
        ru: "Поговорим об этом за бокалом вина в горячих источниках."
        source: { kind: translated, id: 516447 }
notes:
  - { kind: false-friend, text: "Главная неожиданность: lampka wina значит «бокал вина», а не «лампа вина». Уменьшительное от lampa дало и светильник, и бокал — по форме сосуда." }
  - { kind: usage, text: "В корпусе значение «бокал» встречается чаще, чем «лампочка»: lampka czerwonego wina." }
  - { kind: government, text: "Женский род: ta lampka, tej lampki." }
  - { kind: usage, text: "Во множественном числе lampki часто значит «ёлочная гирлянда»: lampki choinkowe." }
collocations:
  - { pl: "lampka wina", ru: "бокал вина" }
  - { pl: "lampki choinkowe", ru: "ёлочные гирлянды" }
etymology: "Уменьшительное от lampa «лампа», из греческого lampas через латынь; значение «бокал» пошло от формы сосуда."
memory: "lampka — и «лампочка», и «бокал вина»: lampka wina. Второе значение встречается чаще первого. Во множественном lampki — ёлочные гирлянды."
