# review
id: pomagac
format: 2
lemma: "pomagać"
rank: 559
pos: verb
aspect: imperf
pron: { cyr: "пома́гаць" }
senses:
  - id: help
    ru: "помогать (кому-л. — дательный)"
    note: "pomagać komuś: управление совпадает с русским."
    examples:
      - pl: "On mi pomaga."
        ru: "Он мне помогает."
        source: { kind: tatoeba, id: 3754558 }
      - pl: "Czy Tom pomaga Mary?"
        ru: "Том помогает Мэри?"
        source: { kind: tatoeba, id: 4952978 }
      - pl: "Czemu jej pomagasz?"
        ru: "Почему ты ей помогаешь?"
        source: { kind: tatoeba, id: 6313578 }
  - id: help-with
    ru: "pomagać w czymś — помогать в чём-л."
    note: "С предлогом w и предложным: pomaga w nauce."
    examples:
      - pl: "Magnetofon pomaga w nauce."
        ru: "Магнитофон помогает при учёбе."
        source: { kind: tatoeba, id: 531898 }
      - pl: "Wszyscy pomagaliśmy przy zbiorach."
        ru: "Мы все помогали на уборке урожая."
        source: { kind: translated, id: 817990 }
      - pl: "Wieczorem pomagam mamie."
        ru: "Вечером я помогаю маме."
        source: { kind: translated, id: 566264 }
  - id: helping
    ru: "pomaganie — помощь как занятие"
    note: "Отглагольное существительное; собственно «помощь» — pomoc."
    examples:
      - pl: "Pomaganie jest ważne."
        ru: "Помогать важно."
        source: { kind: translated, id: 6406118 }
      - pl: "Pomaganie daje radość."
        ru: "Помогать — радость."
        source: { kind: translated, id: 6406119 }
      - pl: "Pomaganie jest proste."
        ru: "Помогать просто."
        source: { kind: translated, id: 6406127 }
notes:
  - { kind: government, text: "pomagać komuś — дательный падеж, ровно как русское «помогать кому-то»: on mi pomaga. Ловушки здесь нет." }
  - { kind: government, text: "«Помогать в чём-то» — pomagać w czymś, с предлогом w и предложным: pomaga w nauce." }
  - { kind: usage, text: "Совершенный вид — pomóc: pomógł mi «он мне помог». Существительное — pomoc «помощь»." }
  - { kind: usage, text: "Возвратное pomagać sobie значит «помогать друг другу»: pomagamy sobie nawzajem." }
collocations:
  - { pl: "pomagać komuś", ru: "помогать кому-либо" }
  - { pl: "pomagać w nauce", ru: "помогать в учёбе" }
  - { pl: "pomagamy sobie nawzajem", ru: "мы помогаем друг другу" }
  - { pl: "pomagać biednym", ru: "помогать бедным" }
family:
  - { pl: "pomoc", ru: "помощь", relation: derived }
  - { pl: "pomóc", ru: "помочь", relation: derived }
  - { pl: "pomocny", ru: "полезный", relation: derived }
etymology: "Приставка po- плюс magać «мочь, быть в силах», от праславянского *mogti — тот же корень, что в móc «мочь» и в русском «помогать»."
memory: "pomagać — «помогать», и управление здесь совпадает с русским полностью: pomagać KOMUŚ, дательный падеж — on mi pomaga. «Помогать в чём-то» будет pomagać w czymś, с w и предложным: pomaga w nauce. Совершенный вид — pomóc, существительное — pomoc «помощь». А pomagać sobie nawzajem значит «помогать друг другу»."
idioms:
  - { pl: "pomagać komuś", ru: "помогать кому-либо" }
  - { pl: "pomagać w nauce", ru: "помогать в учёбе" }
  - { pl: "pomagamy sobie nawzajem", ru: "мы помогаем друг другу" }
