# review
id: opromieniac
format: 2
lemma: "opromieniać"
rank: 2168
pos: verb
aspect: imperf
pron: { cyr: "опроме́няць" }
senses:
  - id: illuminate
    ru: "озарять, освещать"
    examples:
      - pl: "Słońce opromienia szczyty gór."
        ru: "Солнце озаряет вершины гор."
        source: { kind: authored }
      - pl: "Świeca opromieniała pokój."
        ru: "Свеча озаряла комнату."
        source: { kind: authored }
      - pl: "Blask opromienia jej twarz."
        ru: "Сияние озаряет её лицо."
        source: { kind: authored }
  - id: radiate
    ru: "озарять (переносно: славой, радостью)"
    examples:
      - pl: "Sława opromieniała jego imię."
        ru: "Слава озаряла его имя."
        source: { kind: authored }
      - pl: "Uśmiech opromienia całą salę."
        ru: "Улыбка озаряет весь зал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Книжное и поэтическое слово. В обычной речи скажут oświetlać «освещать»." }
  - { kind: government, text: "Винительный падеж: opromieniać twarz, opromieniać szczyty." }
  - { kind: false-friend, text: "Корень promień «луч» — ср. русское «пром» в «промелькнуть»? Нет: ближе всего русское «луч», а сам корень связан с prom «паром» только по звучанию." }
  - { kind: usage, text: "Несовершенный вид; совершенный — opromienić. В корпусе слово не встречается." }
collocations:
  - { pl: "opromieniać twarz", ru: "озарять лицо" }
etymology: "o- + promień «луч»; буквально «обвести лучами»."
memory: "opromieniać — «озарять», от promień «луч». Слово книжное; в обычной речи — oświetlać. Совершенный вид — opromienić."
idioms:
  - { pl: "opromieniać twarz", ru: "озарять лицо" }
