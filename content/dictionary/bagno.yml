# review
id: bagno
format: 2
lemma: "bagno"
rank: 3795
pos: noun
pron: { cyr: "ба́гно" }
senses:
  - id: marsh
    ru: "болото, топь"
    examples:
      - pl: "To bagno jest głębokie do kolan."
        ru: "Это болото по колено глубиной."
        source: { kind: translated, id: 1587749 }
      - pl: "Przebrneli przez bagna."
        ru: "Они пробрались через болота."
        source: { kind: translated, id: 1587752 }
      - pl: "Słyszałem szczekanie na bagnie."
        ru: "Я слышал лай на болоте."
        source: { kind: authored }
  - id: figurative
    ru: "болото в переносном смысле: трясина, застой"
    examples:
      - pl: "Zatopić się w szaleństwie jak w bagnie."
        ru: "Погрузиться в безумие как в болото."
        source: { kind: translated, id: 13006206 }
      - pl: "Wdepnął w bagno układów."
        ru: "Он влез в болото закулисных связей."
        source: { kind: authored }
      - pl: "Skąd pan wie, że on kryje się na bagnie?"
        ru: "Откуда вы знаете, что он прячется на болоте?"
        source: { kind: authored }
notes:
  - { kind: usage, text: "Северославянское слово, родственное чешскому bahno; русского прямого соответствия нет — «болото» это другой корень." }
  - { kind: false-friend, text: "У слова есть и ботаническое значение: bagno zwyczajne — «багульник болотный». Русское «багно» как раз и значит это растение." }
  - { kind: usage, text: "wdepnąć w bagno — «влипнуть, вляпаться», буквально «вступить в болото»." }
  - { kind: usage, text: "Синонимы: mokradło, trzęsawisko, grzęzawisko, bagnisko." }
collocations:
  - { pl: "na bagnie", ru: "на болоте" }
  - { pl: "wdepnąć w bagno", ru: "вляпаться" }
  - { pl: "bagno zwyczajne", ru: "багульник болотный" }
etymology: "Северославянское слово, ср. чешское bahno; из праславянского *bagno «топкое, грязное место». Русское «багно» сохранило ботаническое значение — «багульник»."
memory: "bagno — «болото». Русского прямого соответствия у корня нет: наше «болото» от другого слова. Зато русское «багно» существует и значит как раз второе польское значение — «багульник болотный». Запомните оборот wdepnąć w bagno «вляпаться, влипнуть»."
idioms:
  - { pl: "wdepnąć w bagno", ru: "вляпаться" }
  - { pl: "na bagnie", ru: "на болоте" }
formExamplesSkip:
  - { form: "bagna", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
