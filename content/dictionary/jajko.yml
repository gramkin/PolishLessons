pos: noun
pron: { cyr: "я́йко" }
senses:
  - id: egg
    ru: "яйцо"
    examples:
      - pl: "Mam jajko."
        ru: "У меня есть яйцо."
        source: { kind: translated, id: 6603141 }
      - pl: "Kura zniosła jajko."
        ru: "Курица снесла яйцо."
        source: { kind: translated, id: 2757121 }
      - pl: "Co było pierwsze jajko czy kura?"
        ru: "Что было первым — курица или яйцо?"
