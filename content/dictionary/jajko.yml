  - id: eggs-food
    ru: "яйца (как еда)"
    examples:
      - pl: "Czy bezpiecznie jest jeść surowe jajka?"
        ru: "Безопасно ли есть сырые яйца?"
        source: { kind: tatoeba, id: 982512 }
      - pl: "Tom zjadł trzy jajka."
        ru: "Том съел три яйца."
        source: { kind: tatoeba, id: 12069009 }
      - pl: "Nie lubię jajek."
        ru: "Я не люблю яйца."
        source: { kind: translated, id: 593304 }
notes:
  - { kind: usage, text: "jajko — уменьшительное от jajo, но именно оно стало обычным словом для куриного яйца. Само jajo звучит крупнее и биологичнее." }
  - { kind: usage, text: "jajko na miękko — «яйцо всмятку», jajko na twardo — «яйцо вкрутую», jajko sadzone — «яичница-глазунья»." }
  - { kind: government, text: "Яйца во множественном — jajka (именительный) и jajek (родительный): kupiła dwa tuziny jajek «она купила две дюжины яиц»." }
  - { kind: false-friend, text: "Русское «яйцо» и польское jajko — одно слово, но польское уменьшительное по форме: буквально «яичко». Грубого оттенка у него, в отличие от русского, нет." }
collocations:
  - { pl: "jajko na miękko", ru: "яйцо всмятку" }
  - { pl: "jajko na twardo", ru: "яйцо вкрутую" }
  - { pl: "tuzin jajek", ru: "дюжина яиц" }
family:
  - { pl: "jajo", ru: "яйцо (крупнее, биологически)", relation: root }
  - { pl: "jajecznica", ru: "яичница", relation: root }
  - { pl: "kura", ru: "курица", relation: root }
etymology: "Уменьшительное от jajo, того же корня, что русское «яйцо». Именно уменьшительная форма стала в польском обычным словом."
memory: "jajko — «яйцо», формально уменьшительное от jajo, но это обычное слово. Яйцо всмятку — jajko na miękko, вкрутую — na twardo."
idioms:
  - { pl: "jajko na miękko", ru: "яйцо всмятку" }
  - { pl: "jajko niespodzianka", ru: "киндер-сюрприз" }
  - { pl: "kura znosząca złote jajka", ru: "курица, несущая золотые яйца" }
