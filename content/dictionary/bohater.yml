# review
id: bohater
format: 2
lemma: "bohater"
rank: 951
pos: noun
pron: { cyr: "бога́тэр" }
senses:
  - id: hero
    ru: "герой (совершивший подвиг)"
    examples:
      - pl: "To bohater."
        ru: "Это герой."
        source: { kind: translated, id: 12691800 }
      - pl: "Twój syn nie umarł na próżno. Zginął jak bohater."
        ru: "Твой сын умер не напрасно. Он погиб как герой."
        source: { kind: translated, id: 7960878 }
      - pl: "Uważają go za bohatera."
        ru: "Они считают его героем."
        source: { kind: translated, id: 366713 }
  - id: character
    ru: "герой, персонаж (книги, фильма)"
    note: "То же слово называет действующее лицо произведения."
    examples:
      - pl: "Jak nazywa się główny bohater komiksu?"
        ru: "Как зовут главного героя комикса?"
        source: { kind: translated, id: 13951087 }
      - pl: "Nie lubię powieści bez bohatera."
        ru: "Я не люблю романов без героя."
        source: { kind: translated, id: 361644 }
      - pl: "Krzysztof Kolumb stał się moim ulubionym bohaterem, po tym jak przeczytałam wszystkie jego historie."
        ru: "Христофор Колумб стал моим любимым героем, после того как я прочитала все его истории."
        source: { kind: tatoeba, id: 5975482 }
  - id: predicate
    ru: "jest bohaterem — он герой (творительный)"
    examples:
      - pl: "Jestem bohaterem."
        ru: "Я герой."
        source: { kind: translated, id: 361226 }
      - pl: "On jest bohaterem."
        ru: "Он герой."
        source: { kind: translated, id: 12691799 }
      - pl: "To my jesteśmy prawdziwymi bohaterami."
        ru: "Настоящие герои — это мы."
        source: { kind: translated, id: 12565038 }
notes:
  - { kind: usage, text: "Слово покрывает и «героя» подвига, и «героя» книги: główny bohater «главный герой, главное действующее лицо». Русский различает их так же." }
  - { kind: government, text: "После być и zostać — творительный падеж: jest bohaterem «он герой». А uważać kogoś za bohatera «считать кого-то героем» — винительный после za." }
  - { kind: usage, text: "Множественное число мужского лица бывает двояким: bohaterowie и bohaterzy. Первое обычнее, второе звучит чуть торжественнее." }
  - { kind: usage, text: "Женская пара — bohaterka. Прилагательное bohaterski «героический», наречие bohatersko." }
collocations:
  - { pl: "główny bohater", ru: "главный герой" }
  - { pl: "bohater narodowy", ru: "национальный герой" }
  - { pl: "zginąć jak bohater", ru: "погибнуть как герой" }
  - { pl: "bohater dnia", ru: "герой дня" }
family:
  - { pl: "bohaterka", ru: "героиня", relation: derived }
  - { pl: "bohaterski", ru: "героический", relation: derived }
  - { pl: "bohaterstwo", ru: "героизм", relation: derived }
etymology: "Через украинское «богатырь» из тюркских языков, где baɣatur значило «храбрый воин». Русское «богатырь» — то же слово, а «герой» пришло из греческого, поэтому пара расходится."
memory: "bohater — «герой», и подвига, и книги: główny bohater значит «главный герой». Слово пришло тем же путём, что русский «богатырь», хотя значение у него нынче другое. После być — творительный: jest bohaterem. Женская пара — bohaterka."
idioms:
