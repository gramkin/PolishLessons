etymology: "От SMAK «вкус», а оно заимствовано из средневерхненемецкого SMAC «вкус, запах», родственного современному немецкому GESCHMACK и глаголу SCHMECKEN «быть на вкус». Дальше начинается любопытная цепочка: русское «смак» и «смаковать» пришли не из немецкого напрямую, а через польский, так что здесь польское слово выступает посредником, а не родственником. Собственное русское название вкуса — «вкус», от «вкушать», то есть от действия, а не от свойства. Получается, что в этой паре польское слово старше в языке и пришло с запада, а русское заимствование из польского сохранило более узкий, эмоциональный смысл: «смак» — не просто вкус, а удовольствие от него. Отсюда и расхождение прилагательных."
memory: "Главное — формула smacznego! «приятного аппетита»: это застывший родительный падеж от «желаю вкусной трапезы», и менять её нельзя. Русское «смачный» — тот же корень, но значит «сочный, со смаком», а польское smaczny просто «вкусный». Smak пришёл из немецкого Geschmack, а русский «смак» — уже из польского."
idioms:
