  - { pl: "smaczny kąsek", ru: "лакомый кусочек" }
formExamplesSkip:
  - { form: "smaczni", reason: "Форма мужско-личного рода множественного числа. Она согласуется только с существительными, обозначающими лиц мужского пола, а вкусной бывает еда: раки, грибы, пстронги относятся к неличному разряду и требуют формы SMACZNE. Сказать RAKI SĄ SMACZNI нельзя — не потому, что так не говорят, а потому, что согласование невозможно: у прилагательного нет лица, с которым согласоваться." }
  - { form: "smaczniejsi", reason: "Сравнительная степень того же мужско-личного рода, и препятствие то же: согласоваться не с чем. О еде говорят SMACZNIEJSZE, в неличной форме." }
  - { form: "najsmaczniejsi", reason: "Превосходная степень мужско-личного рода, и ограничение сохраняется: о еде — NAJSMACZNIEJSZE." }
