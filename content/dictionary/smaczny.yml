notes:
  - { kind: usage, text: "Главное практическое знание из этой карточки — формула SMACZNEGO! «приятного аппетита». Это родительный падеж прилагательного, застывший в роли пожелания, и устроен он так же, как DOBRANOC или DZIĘKI: полная фраза ŻYCZĘ SMACZNEGO POSIŁKU «желаю вкусной трапезы» со временем сократилась до одного слова в родительном. Поэтому форма неизменная, и сказать SMACZNY вместо SMACZNEGO в этом смысле нельзя. Говорят её и официант, и хозяйка, и сосед по столовой, и ответить принято DZIĘKUJĘ, WZAJEMNIE «спасибо, взаимно»." }
  - { kind: false-friend, text: "Русское «смачный» — тот же корень, но смысл другой. По-русски «смачный» значит сочный, смакующий, с оттенком удовольствия или даже нескромности: «смачный поцелуй», «смачно выругался». Польское SMACZNY ничего подобного не несёт и значит ровно «вкусный», нейтрально и буднично. Поэтому SMACZNA ZUPA — это просто «вкусный суп», без всякого смакования. Обратно: русское «смачный» лучше передавать польским SOCZYSTY «сочный» или TŁUSTY «жирный, смачный» по контексту, но не SMACZNY." }
  - { kind: pronunciation, text: "Читается «сма́чны», ударение на первом слоге из двух. Сочетание CZ даёт твёрдое «ч», а конечное Y — русское «ы». Начальное SM произносится слитно, без гласной между С и М. Мужско-личная форма множественного SMACZNI звучит «сма́чни», с мягким n. В сравнительной степени SMACZNIEJSZY ударение переходит на -NIEJ-: «смачне́йшы», а в превосходной NAJSMACZNIEJSZY — туда же, потому что приставка NAJ- ударения не берёт." }
  - { kind: government, text: "Прилагательное согласуется с существительным и ничем не управляет. Степени сравнения правильные, суффиксом: SMACZNY, SMACZNIEJSZY, NAJSMACZNIEJSZY — тот же класс, что PASKUDNY и ROZSĄDNY. При сравнении — предлог OD с родительным или союз NIŻ: SMACZNIEJSZY OD WCZORAJSZEGO, SMACZNIEJSZY NIŻ WCZORAJSZY. Наречие SMACZNIE значит «вкусно», но употребляется заметно реже русского: вместо «вкусно поесть» поляк скажет DOBRZE ZJEŚĆ или SMACZNIE ZJEŚĆ, причём первое частотнее." }
