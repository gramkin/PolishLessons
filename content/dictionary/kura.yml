etymology: "Праславянское слово звукоподражательного происхождения, то же, что русская «кура» и «курица». Корень передаёт крик птицы, и потому он похож во многих языках. Русский литературный предпочёл уменьшительную форму «курицу», а «кура» осталась в говорах; польский оставил главным короткое KURA. Из того же гнезда идут KURNIK «курятник» и KURCZAK, слово, которое русский узнаёт по «курчонку»."
memory: "То же слово, что русская «кура», и ничего в нём не обманывает, кроме одной формы. Дательный и местный падеж kurze совпадает с местным падежом слова kurz «пыль», так что w kurze это «в пыли». Чередование r в rz здесь то же, что в miara — mierze и pióro — piórze, и звучит kurze как «ку́же». Оборот kura domowa значит «домохозяйка» и звучит пренебрежительно."
idioms:
  - { pl: "kura domowa", ru: "домохозяйка, наседка" }
