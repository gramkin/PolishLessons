notes:
  - { kind: false-friend, text: "Слово то же, что русская «кура», и в говорах оно у нас звучит точно так же. Ловушка в одной форме: дательный и местный падеж KURZE совпадает с местным падежом совсем другого слова, KURZ «пыль». W KURZE значит «в пыли», а KURZE ZNIOSŁA JAJKO — «курица снесла яйцо». Различает их только смысл фразы, и по виду формы не отличить." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа R переходит в RZ: KURA, но KURZE. Это уже третье слово в словаре с этим чередованием, после MIARA — MIERZE и PIÓRO — PIÓRZE, так что правило можно считать выученным: R перед окончанием -E становится RZ. Родительный множественного KUR, без окончания." }
  - { kind: government, text: "Ложиться спать с курами — CHODZIĆ SPAĆ Z KURAMI, предлог Z с творительным множественного, и русский говорит ровно так же. Курица, несущая золотые яйца — KURA ZNOSZĄCA ZŁOTE JAJKA, причастие в именительном. Нести яйца — ZNOSIĆ JAJKA, винительный без предлога. Оборот KURA DOMOWA стоит в именительном и работает как ярлык." }
  - { kind: pronunciation, text: "Читается «ку́ра», два слога, ударение на первом, в точности как русское слово. Все звуки простые. А вот форма KURZE звучит «ку́же», потому что RZ даёт «ж»: на слух она уже совсем не похожа на исходное слово, и узнать в ней курицу с первого раза трудно. Та же перемена в MIERZE «ме́же» и PIÓRZE «пю́же»." }
  - { kind: register, text: "Прямое значение нейтральное и деревенское: KURY NIOSĄ SIĘ, KURNIK «курятник», KURCZAK «цыплёнок», которого в магазине покупают на обед. Переносное KURA DOMOWA пренебрежительно и обидно, так говорят о женщине, которая, по мнению говорящего, сидит дома и ничем больше не занята. Оборот CHODZIĆ SPAĆ Z KURAMI значит «ложиться очень рано» и звучит добродушно." }
collocations:
  - { pl: "kura domowa", ru: "домохозяйка" }
