notes:
  - { kind: usage, text: "Длинные прилагательные образуют степени сравнения не суффиксом, а словами bardziej и najbardziej: bardziej interesujący «более интересный». Это отдельные слова, а не формы bardzo." }
collocations:
  - { pl: "bardzo dziękuję", ru: "большое спасибо" }
  - { pl: "nie bardzo", ru: "не очень" }
etymology: "От старого barzo, из праславянского *bъrzo «быстро»: значение сместилось от «быстро» к «сильно, очень»."
memory: "bardzo = «очень», а nie bardzo — «не особо». Своих степеней сравнения у него нет: «более» и «наиболее» передаются отдельными словами bardziej и najbardziej."
idioms:
