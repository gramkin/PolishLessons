  - id: excellent
    ru: "превосходный, отличный"
    examples:
      - pl: "To wino jest doskonałe."
        ru: "Это вино превосходное."
        source: { kind: translated, id: 3381003 }
      - pl: "Ten autor ma doskonały styl."
        ru: "У автора красивый стиль."
        source: { kind: tatoeba, id: 351564 }
      - pl: "Co za doskonały pomysł!"
        ru: "Что за превосходная мысль!"
        source: { kind: translated, id: 3835917 }
