# review
id: doskonaly
format: 2
lemma: "doskonały"
rank: 1346
pos: adj
pron: { cyr: "доскона́уы" }
senses:
  - id: perfect
    ru: "совершенный, безупречный"
    examples:
      - pl: "Nikt nie jest doskonały."
        ru: "Никто не совершенен."
        source: { kind: translated, id: 3324361 }
      - pl: "On nie jest doskonały."
        ru: "Он не совершенен."
        source: { kind: translated, id: 10542200 }
      - pl: "Wiem, że nie jestem doskonały."
        ru: "Я знаю, что я не совершенен."
        source: { kind: translated, id: 11573543 }
  - id: excellent
    ru: "превосходный, отличный"
    examples:
      - pl: "To wino jest doskonałe."
        ru: "Это вино превосходное."
        source: { kind: translated, id: 3381003 }
      - pl: "Ten autor ma doskonały styl."
        ru: "У автора красивый стиль."
        source: { kind: tatoeba, id: 351564 }
      - pl: "Co za doskonały pomysł!"
        ru: "Что за превосходная мысль!"
        source: { kind: translated, id: 3835917 }
  - id: excellent-person
    ru: "превосходный (о человеке, мастере)"
    examples:
      - pl: "Jest doskonałym tenisistą."
        ru: "Он превосходный теннисист."
        source: { kind: translated, id: 1353983 }
      - pl: "Tom jest doskonałym krykiecistą."
        ru: "Том превосходный игрок в крикет."
        source: { kind: translated, id: 922465 }
      - pl: "Był doskonałym naukowcem, a co więcej wielkim poetą."
        ru: "Он был превосходным учёным, а сверх того великим поэтом."
        source: { kind: translated, id: 1351138 }
notes:
  - { kind: usage, text: "Nikt nie jest doskonały — «никто не совершенен», ходовая формула утешения." }
  - { kind: usage, text: "Наречие — doskonale «отлично», карточка уже есть. Существительное — doskonałość «совершенство»." }
  - { kind: false-friend, text: "Форма doskonali в текстах обычно оказывается глаголом doskonalić «совершенствовать», а не формой этого прилагательного." }
  - { kind: pronunciation, text: "Конечное ł звучит как «у»: доскона́уы. Ударение на предпоследний слог." }
collocations:
  - { pl: "nikt nie jest doskonały", ru: "никто не совершенен" }
  - { pl: "doskonały pomysł", ru: "превосходная мысль" }
  - { pl: "morderstwo doskonałe", ru: "идеальное убийство" }
etymology: "Из do- и konać «совершать, завершать»: буквально «доведённый до конца». Русское «совершенный» от «свершить» построено ровно так же."
memory: "doskonały — «совершенный, превосходный». Nikt nie jest doskonały «никто не совершенен» — ходовая формула. Наречие — doskonale «отлично». Осторожно: форма doskonali обычно глагол doskonalić."
