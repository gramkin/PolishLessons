    ru: "превосходный (о человеке, мастере)"
    examples:
      - pl: "Jest doskonałym tenisistą."
        ru: "Он превосходный теннисист."
        source: { kind: translated, id: 1353983 }
      - pl: "Tom jest doskonałym krykiecistą."
        ru: "Том превосходный игрок в крикет."
        source: { kind: translated, id: 922465 }
