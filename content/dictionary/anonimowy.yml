notes:
  - { kind: false-friend, text: "Существительное того же гнезда значит не то, что русское «аноним». Польское ANONIM — это прежде всего анонимное письмо или донос, то есть сама бумага: DOSTAŁEM ANONIM значит «я получил анонимку». Человека, не назвавшего себя, по-польски назовут ANONIMOWY AUTOR или OSOBA ANONIMOWA, а не ANONIM. Русское «анонимка» точно совпадает с польским ANONIM по смыслу, но стоит ниже по стилю, тогда как польское слово нейтрально и попадается в протоколах." }
  - { kind: usage, text: "Одиннадцать форм, степеней сравнения нет: анонимным нельзя быть в большей мере. Мужско-личная форма ANONIMOWI — самая узнаваемая форма этого слова, потому что входит в название всемирного общества: ANONIMOWI ALKOHOLICY, по-русски «Анонимные алкоголики», сокращённо AA. По её образцу названы и другие группы: ANONIMOWI HAZARDZIŚCI. Если нужна мера, берут наречие: CAŁKOWICIE ANONIMOWA ANKIETA «полностью анонимная анкета»." }
  - { kind: government, text: "Прилагательное согласуется, но в двух частых конструкциях оно переходит в творительный падеж, и это надо запомнить. После глаголов POZOSTAĆ «остаться» и BYĆ в прошедшем времени идёт творительный: AUTOR POZOSTAŁ ANONIMOWY в современном языке допустимо, но строгая норма требует POZOSTAŁ ANONIMOWYM. Русский в этом месте ставит творительный тоже, «остался анонимным», так что схема совпадает. Для кого анонимен, указывается предлогом DLA с родительным: ANONIMOWY DLA CZYTELNIKÓW." }
  - { kind: pronunciation, text: "Читается «анонимо́вы», пять слогов, ударение на предпоследнем, то есть на MO. Все гласные читаются ровно как написаны, никаких носовых здесь нет. Конечное Y — это «ы». В существительном ANONIM ударение падает на второй слог: «ано́ним», как и по-русски. А в наречии ANONIMOWO ударение снова на предпоследнем: «анонимо́во»." }
  - { kind: register, text: "Слово нейтральное и частое в официальном языке: анкеты, доносы, голосования, банковские счета. Частые обороты: ANONIMOWY DONOS «анонимный донос», ANONIMOWA ANKIETA «анонимная анкета», GŁOSOWANIE ANONIMOWE «анонимное голосование», POZOSTAĆ ANONIMOWYM «остаться анонимным», ANONIMOWI ALKOHOLICY. Существительное ANONIMOWOŚĆ значит «анонимность» и звучит книжно. В сети чаще скажут ANONIMOWO «анонимно» наречием." }
