etymology: "Из греческого ANONYMOS, сложенного из отрицательной приставки AN- «без» и ONOMA «имя», то есть буквально «безымянный». Приятная подробность: греческое ONOMA и славянское IMIĘ, то есть русское «имя», восходят к одному и тому же индоевропейскому корню, так что в слове «анонимный» скрыт дальний родственник нашего «имени». В оба языка слово пришло книжным путём, через латынь и западные языки, и прилагательные совпали почти буквой в букву. Разошлись только существительные: польское ANONIM стало названием письма, а русское «аноним» названием человека."
memory: "Прилагательное совпадает с русским, а существительное нет: польское anonim это анонимное письмо, анонимка, а не человек. Самая узнаваемая форма — мужско-личное множественное Anonimowi Alkoholicy, «Анонимные алкоголики». Степеней сравнения нет, меру дают наречием, całkowicie anonimowa ankieta. В слове спрятан дальний родственник русского «имени»: греческое onoma и слово «имя» одного корня. Читается «анонимо́вы», ударение на предпоследнем слоге."
idioms:
