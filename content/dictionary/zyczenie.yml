notes:
  - { kind: false-friend, text: "Польское ŻYCZENIE — не только «пожелание», но и «поздравление». SKŁADAĆ ŻYCZENIA — «поздравлять», буквально «складывать пожелания»: так поздравляют с днём рождения, свадьбой, праздниками. «Желание» в смысле «хотение» чаще CHĘĆ, а «мечта» — MARZENIE. И ŻYCZLIWY значит «доброжелательный», а не «желающий»." }
  - { kind: usage, text: "Восемь форм, средний род. Поздравления почти всегда во множественном числе: ŻYCZENIA URODZINOWE, ŻYCZENIA ŚWIĄTECZNE. Родительный множественного — ŻYCZEŃ, с мягким N на конце." }
  - { kind: government, text: "Поздравить кого-то — ZŁOŻYĆ KOMUŚ ŻYCZENIA, дательный лица. По желанию — NA ŻYCZENIE, NA с винительным: NA ŻYCZENIE KLIENTA. Оставлять желать лучшего — POZOSTAWIAĆ WIELE DO ŻYCZENIA, DO с родительным." }
  - { kind: pronunciation, text: "Читается «жычэ́не», три слога, ударение на втором. Ż даёт «ж», Y — «ы», CZ — «ч», а NI перед E — мягкое «н». В родительном множественного ŻYCZEŃ: «жы́чэнь»." }
  - { kind: register, text: "POBOŻNE ŻYCZENIE, «благочестивое пожелание», — о мечте, которая не сбудется. KONCERT ŻYCZEŃ, «концерт по заявкам», в разговоре значит длинный список требований: TO NIE KONCERT ŻYCZEŃ — «это тебе не концерт по заявкам»." }
collocations:
  - { pl: "składać życzenia", ru: "поздравлять" }
  - { pl: "na życzenie", ru: "по желанию, по запросу" }
  - { pl: "spełnić życzenie", ru: "исполнить желание" }
family:
  - { pl: "życzyć", ru: "желать", relation: root, id: zyczyc }
  - { pl: "życzliwy", ru: "доброжелательный", relation: derived }
  - { pl: "życzliwość", ru: "доброжелательность", relation: derived }
etymology: "От глагола ŻYCZYĆ «желать», с обычным суффиксом отглагольного существительного -ENIE, как PYTANIE от PYTAĆ. Русскому «желать» этот корень не родственен, поэтому запоминать его удобнее через формулу ŻYCZĘ CI SZCZĘŚCIA — «желаю тебе счастья»."
memory: "Życzenie — пожелание и поздравление: składać życzenia — поздравлять. Читается «жычэ́не». Na życzenie — по желанию. Pozostawiać wiele do życzenia — оставлять желать лучшего. Życzliwy — доброжелательный."
idioms:
