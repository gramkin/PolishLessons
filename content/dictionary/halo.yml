pos: interj
pron: { cyr: "ха́ло" }
senses:
  - id: hello-phone
    ru: "алло (по телефону)"
    note: "Обычное начало телефонного разговора."
    examples:
      - pl: "Halo!"
        ru: "Алло!"
        source: { kind: translated, id: 753891 }
      - pl: "Halo?"
        ru: "Алло?"
        source: { kind: translated, id: 8218795 }
      - pl: "Halo, jesteś jeszcze?"
        ru: "Алло, ты ещё здесь?"
        source: { kind: translated, id: 349022 }
  - id: hey
    ru: "эй, послушай (чтобы привлечь внимание)"
    note: "Halo, momencik! «Эй, минутку!»"
    examples:
      - pl: "Halo, momencik!"
        ru: "Алло, минутку!"
        source: { kind: translated, id: 960965 }
      - pl: "Halo, czy ktoś mnie słyszy?"
        ru: "Эй, меня кто-нибудь слышит?"
        source: { kind: authored }
      - pl: "Halo, tu nie wolno wchodzić."
        ru: "Эй, сюда нельзя входить."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Главное употребление — телефонное: Halo? «Алло?». Так начинают разговор и так переспрашивают, когда связь пропала." }
  - { kind: usage, text: "Вне телефона значит «эй, послушай» и служит для привлечения внимания: Halo, momencik!" }
  - { kind: usage, text: "У слова одна форма — оно не склоняется. В словаре оно помечено существительным, но ведёт себя как междометие, наравне с och и ejże." }
  - { kind: false-friend, text: "Не путайте с русским «гало» (оптическое явление): польское halo — это только оклик." }
collocations:
  - { pl: "Halo?", ru: "Алло?" }
  - { pl: "Halo, słucham", ru: "Алло, слушаю" }
  - { pl: "Halo, jesteś tam?", ru: "Алло, ты там?" }
  - { pl: "Halo, momencik", ru: "Эй, минутку" }
family:
  - { pl: "och", ru: "ох", relation: root }
  - { pl: "hej", ru: "эй", relation: derived }
etymology: "Из немецкого hallo, окрика перевозчикам и охотникам, разошедшегося по Европе вместе с телефоном — тем же путём, что русское «алло»."
memory: "halo — это «алло», и живёт оно прежде всего в телефоне: Halo? «Алло?». Так начинают разговор и так переспрашивают, когда связь пропала. Вне телефона значит «эй, послушай»: Halo, momencik! «Эй, минутку!». Слово не склоняется — форма одна. В частотном списке оно помечено существительным, но ведёт себя как междометие, рядом с och и hej."
