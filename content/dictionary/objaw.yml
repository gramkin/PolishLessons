notes:
  - { kind: false-friend, text: "Слово обманывает и на слух, и на вид. Русскому слышится «объявление» или «объявить», но OBJAW значит «симптом, признак». Русскому «объявлению» отвечает OGŁOSZENIE, а «объявить» — OGŁOSIĆ. Связь всё же есть, только дальняя: OBJAW идёт от глагола OBJAWIĆ «явить, обнаружить», родственного русскому «явить», и симптом — это то, что болезнь являет наружу. Так что корень общий, а значения разошлись: польский пошёл в медицину, русский в извещения." }
  - { kind: usage, text: "Чаще всего слово употребляется во множественном числе, потому что симптомы редко бывают по одному: OBJAWY GRYPY, OBJAWY ZATRUCIA, PIERWSZE OBJAWY. Второе значение шире и выходит за медицину: OBJAW ZMĘCZENIA, OBJAW DOBREJ WOLI, OBJAWY WIOSNY. В обоих значениях слово нейтральное и книжно-обиходное, одинаково годится для врачебной карты и для газетной статьи. Рядом стоит SYMPTOM, прямое заимствование, которое употребляется реже и звучит учёнее." }
  - { kind: pronunciation, text: "Читается «о́бьяф», в два слога, с ударением на первом. Разберём по частям: ob звучит «об», сочетание ja после согласной даёт «ья», а конечное w оглушается в «ф». Поэтому не «объяв» и не «обджав», а «о́бьяф». В косвенных падежах звонкость w возвращается: OBJAWU — «обья́ву», OBJAWEM — «обья́вэм», и ударение сдвигается на второй слог, потому что слогов стало три." }
  - { kind: government, text: "Чего признак — родительный падеж без предлога: OBJAW CHOROBY, OBJAWY GRYPY, OBJAW ZMĘCZENIA. Это же сочетание по-русски требует родительного, так что перенос прямой. У кого — предлог U с родительным: OBJAWY U DZIECI. Где видно — предлог W с предложным: W JEGO ZACHOWANIU WIDAĆ OBJAWY. Родительный множественного — OBJAWÓW." }
