etymology: "От глагола OBJAWIĆ «явить, обнаружить», составленного из приставки OB- и корня JAW-, того же, что в русских «явить», «явный», «наяву». Отсюда и значение: симптом есть то, что болезнь являет наружу, делает явным. Русское «объявить» собрано из тех же частей и того же корня, но пошло по линии сообщения: явить словом, известить. Поэтому OBJAW и «объявление» — дальние родственники с общим корнем JAW-, разведённые тем, что именно считалось главным в «явлении»: в польском — проступающий признак, в русском — сказанное вслух."
memory: "Не «объявление»! OBJAW — это симптом, признак; «объявление» по-польски OGŁOSZENIE. Корень тот же, что в «явить»: симптом являет болезнь наружу. Читается «о́бьяф», конечное w оглушается, но в падежах возвращается: objawu — «обья́ву»."
idioms:
