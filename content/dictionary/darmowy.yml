notes:
  - { kind: false-friend, text: "РУССКИЙ КОГНАТ ЕСТЬ, НО РАЗГОВОРНЫЙ. Польское darmowy — совершенно нейтральное «бесплатный», его пишут на афишах и в договорах. Русское «дармовой» звучит просторечно, и в официальном тексте его не поставишь. Переводить надо словом «бесплатный», а «дармовой» оставить для разговора." }
  - { kind: usage, text: "Рядом живёт более официальное BEZPŁATNY «бесплатный», дословно «безоплатный», и в законах пишут именно его. Наречие — ZA DARMO «бесплатно, даром», в два слова: dostałem to za darmo. А NA DARMO значит уже «напрасно, зря», и путать эти два оборота легко." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоседнем: dar-MO-wy. Все гласные открытые, r твёрдое: «дармо́вы». Женская форма darmowa звучит «дармо́ва»." }
collocations:
  - { pl: "za darmo", ru: "бесплатно, даром" }
  - { pl: "darmowa dostawa", ru: "бесплатная доставка" }
  - { pl: "darmowy wstęp", ru: "бесплатный вход" }
family:
  - { pl: "dar", ru: "дар", relation: root, id: dar }
  - { pl: "bezpłatny", ru: "бесплатный (офиц.)", relation: root }
  - { pl: "płatny", ru: "платный", relation: antonym }
etymology: "От darmo «даром», застывшего падежа от dar «дар», из праславянского *darъ, от *dati «дать». Русские «дар», «даром» и просторечное «дармовой» — те же слова. Корень da- виден в dać «дать» и dawać «давать»."
memory: "darmowy — «бесплатный», нейтральное слово, в отличие от просторечного русского «дармовой». Два оборота не путай: ZA darmo «бесплатно», NA darmo «напрасно»."
idioms:
  - { pl: "nie ma darmowych obiadów", ru: "бесплатных обедов не бывает" }
  - { pl: "za darmo", ru: "даром" }
