etymology: "От medycyna «медицина», из латинского medicina, от medicus «врач». Русское «медицинский» пришло тем же путём."
memory: "medyczny — «медицинский»: opieka medyczna «медицинская помощь», badania medyczne «медосмотр». Ratownik medyczny значит «фельдшер скорой помощи». y звучит как «ы»."
