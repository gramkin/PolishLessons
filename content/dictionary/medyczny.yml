        ru: "Даже червей покупают для медицинских исследований."
        source: { kind: translated, id: 904493 }
      - pl: "Poświęcił się badaniom medycznym."
        ru: "Он посвятил себя медицинским исследованиям."
        source: { kind: translated, id: 760323 }
      - pl: "Jestem ratownikiem medycznym."
        ru: "Я фельдшер скорой помощи."
        source: { kind: translated, id: 10567281 }
notes:
  - { kind: usage, text: "Opieka medyczna — «медицинская помощь», badania medyczne — «медицинские исследования» и «медосмотр»." }
  - { kind: usage, text: "Ratownik medyczny — «фельдшер скорой помощи», ходовое название профессии." }
  - { kind: usage, text: "Образовано от medycyna «медицина» с суффиксом -ny, как русское «медицинский»." }
  - { kind: pronunciation, text: "y звучит как «ы»: меды́чны. Ударение на предпоследний слог." }
