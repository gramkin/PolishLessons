notes:
  - { kind: false-friend, text: "Слово образовано от KAWA «кофе» и прозрачно, но вокруг него два расхождения. Первое: польская KAWA женского рода и склоняется — CZARNA KAWA, DWIE KAWY, — тогда как русский «кофе» мужского рода и не склоняется вовсе. Второе: русское «кафе» заимствовано из французского и тоже несклоняемо, а польский построил своё слово с суффиксом места -ARNIA, как PIEKARNIA «пекарня», KSIĘGARNIA «книжный магазин», KWIACIARNIA «цветочный». Слово KAWIARNIA поэтому склоняется полностью. Заимствованное KAFEJKA в польском тоже есть, но означает скорее маленькое заведение и звучит разговорно." }
  - { kind: usage, text: "Десять форм, женский род, мягкая основа на -NIA. Форма KAWIARNI покрывает родительный, дательный и местный единственного и служит обычным родительным множественного. Рядом с ней стоит вторая форма родительного множественного — KAWIARŃ, с нулевым окончанием и мягким Ń: она строже и чаще встречается в заголовках и в официальных текстах, как UCZELŃ рядом с UCZELNI. Именительный и винительный множественного — KAWIARNIE. Суффикс -ARNIA даёт целый ряд названий заведений, и все они склоняются одинаково." }
  - { kind: pronunciation, text: "Читается «кавя́рня», три слога, ударение на втором. Буквосочетание WIA даёт «вя» с мягким W, а RNIA — «рня» с мягким N. В форме KAWIARNIĄ последнее Ą звучит «он»: «кавя́рнён». В форме KAWIARNIĘ конечное Ę даёт чистое «э». Самая трудная форма — KAWIARŃ: она кончается на мягкое «нь» без гласного, «кавя́рнь», и такого окончания в русском не бывает; та же трудность была в UCZELŃ." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Устойчивые сочетания: KAWIARNIA LITERACKA «литературное кафе», OGRÓDEK KAWIARNIANY «веранда кафе», SIEDZIEĆ W KAWIARNII — впрочем, правильная форма местного именно KAWIARNI, и удвоения тут нет. Для заведения с едой есть RESTAURACJA, с пивом — PUB или PIWIARNIA, со сластями — CUKIERNIA. В польской городской культуре кофейня занимает особое место: обороты вроде ŻYCIE KAWIARNIANE «кофейная жизнь» отсылают к литературным кругам довоенной Варшавы и Кракова." }
