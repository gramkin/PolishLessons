etymology: "От KAWA с суффиксом -ARNIA, означающим место, где что-то делают или продают. Сама KAWA — из турецкого KAHVE и арабского QAHWA, пришедшего в Европу вместе с напитком в семнадцатом веке; по преданию, в Вене кофейни завёл Ежи Франчишек Кульчицкий после осады тысяча шестьсот восемьдесят третьего года. Суффикс -ARNIA восходит к латинскому -ARIUS через немецкое посредство, но в польском он давно свой и присоединяется к любой основе: отсюда PIEKARNIA, KSIĘGARNIA, LODZIARNIA «кафе-мороженое», PRALNIA. Русский строит такие слова суффиксом -НЯ и -АРНЯ — «пекарня», «кофейня», — то есть тем же способом, хотя для кафе он взял готовое французское слово."
memory: "Разбирается насквозь: kawa плюс суффикс места -arnia, как piekarnia, księgarnia, kwiaciarnia. Поэтому слово склоняется, в отличие от несклоняемого русского «кафе». Осторожно и с самим кофе: польская kawa женского рода и склоняется, czarna kawa, dwie kawy. Два родительных множественного: обычное kawiarni и строгое kawiarń с мягким «нь» на конце, как uczelń."
