# review
id: wstecz
format: 2
lemma: "wstecz"
rank: 4756
pos: adv
pron: { cyr: "фстэч" }
senses:
  - id: backwards
    ru: "назад (о движении)"
    examples:
      - pl: "Spojrzał wstecz przez ramię."
        ru: "Он оглянулся через плечо."
        source: { kind: authored }
      - pl: "Samochód ruszył wstecz."
        ru: "Машина поехала задним ходом."
        source: { kind: authored }
      - pl: "Nie cofaj się wstecz."
        ru: "Не отступай назад."
        source: { kind: authored }
  - id: back-in-time
    ru: "назад во времени, в прошлое"
    examples:
      - pl: "Patrząc wstecz, niczego nie żałuję."
        ru: "Оглядываясь назад, я ни о чём не жалею."
        source: { kind: authored }
      - pl: "Prawo nie działa wstecz."
        ru: "Закон не имеет обратной силы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WSTECZ — «назад», но книжнее, чем DO TYŁU. Русского соответствия по форме нет; по смыслу близко «вспять». В быту о движении говорят DO TYŁU: IDŹ DO TYŁU «отойди назад». WSTECZ — о взгляде в прошлое и в технике: BIEG WSTECZNY «задняя передача»." }
  - { kind: usage, text: "Неизменяемое наречие. Частые обороты: PATRZĄC WSTECZ «оглядываясь назад», DZIAŁAĆ WSTECZ «иметь обратную силу», KROK WSTECZ «шаг назад». Прилагательное — WSTECZNY." }
  - { kind: government, text: "Ничем не управляет. Срок ставится перед наречием: KILKA LAT WSTECZ «несколько лет назад», DWA DNI WSTECZ «два дня назад»." }
  - { kind: pronunciation, text: "Читается «фстэч», один слог: W оглушается перед S. Конечное CZ — твёрдое «ч»." }
  - { kind: register, text: "Книжно-нейтральное слово: пресса, право, техника. В разговоре чаще DO TYŁU или TEMU: DWA LATA TEMU «два года назад»." }
collocations:
  - { pl: "patrząc wstecz", ru: "оглядываясь назад" }
  - { pl: "działać wstecz", ru: "иметь обратную силу" }
  - { pl: "krok wstecz", ru: "шаг назад" }
family:
  - { pl: "wsteczny", ru: "обратный, задний", relation: derived }
  - { pl: "naprzód", ru: "вперёд", relation: antonym, id: naprzod }
  - { pl: "wstecznik", ru: "ретроград", relation: derived }
etymology: "Обычно объясняют как сращение W плюс старопольское STECZ, родственное STEGNA «тропа» и русскому «стезя»: «по своей тропе обратно». Версия не единственная."
memory: "Wstecz — назад: patrząc wstecz, «оглядываясь назад». Prawo nie działa wstecz — закон не имеет обратной силы. Бег назад в машине — bieg wsteczny."
idioms:
  - { pl: "krok wstecz", ru: "шаг назад, отступление" }
