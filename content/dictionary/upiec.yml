# review
id: upiec
format: 2
lemma: "upiec"
rank: 4776
pos: verb
pron: { cyr: "у́пец" }
senses:
  - id: bake
    ru: "испечь; запечь (мясо)"
    examples:
      - pl: "Mama upiekła sernik."
        ru: "Мама испекла сырник."
        source: { kind: authored }
      - pl: "Upiekę chleb na weekend."
        ru: "Я испеку хлеб на выходные."
        source: { kind: authored }
      - pl: "Upiekli kurczaka w piekarniku."
        ru: "Они запекли курицу в духовке."
        source: { kind: authored }
  - id: newly-made
    ru: "новоиспечённый (świeżo upieczony)"
    examples:
      - pl: "Świeżo upieczony magister szuka pracy."
        ru: "Новоиспечённый магистр ищет работу."
        source: { kind: authored }
      - pl: "Upieczeni niedawno rodzice nie śpią po nocach."
        ru: "Новоиспечённые родители не спят по ночам."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "UPIEC — «испечь», и формы с русским совпадают по чередованию: UPIEKĘ — «испеку», UPIECZESZ — «испечёшь». Русское «упечь» в тюрьму по-польски — WSADZIĆ DO WIĘZIENIA. ŚWIEŻO UPIECZONY — «новоиспечённый», как по-русски." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное UPIECZONY и деепричастие UPIEKŁSZY. Чередование K → CZ: UPIEKĘ, UPIEKĄ, но UPIECZESZ, UPIECZONY. Прошедшее без гласной: UPIEKŁ, UPIEKŁA. Видовой партнёр — PIEC." }
  - { kind: government, text: "Что — винительный, кому — дательный: UPIEC KOMUŚ TORT. В чём — W с местным: W PIEKARNIKU, W PIECU. Возвратное UPIEC SIĘ — «испечься» и разг. «изжариться на солнце»: UPIEKŁEM SIĘ NA PLAŻY." }
  - { kind: pronunciation, text: "Читается «у́пец», два слога, ударение на первом. IE после P — мягкое «пе», конечное C — твёрдое «ц», не «ць». UPIEKĘ — «упе́кэ», UPIECZONY — «упечо́ны»." }
  - { kind: register, text: "Нейтральное бытовое слово кухни. Пословица: UPIEC DWIE PIECZENIE PRZY JEDNYM OGNIU — «убить двух зайцев одним выстрелом». ŚWIEŻO UPIECZONY — шутливое «новоиспечённый»." }
collocations:
  - { pl: "upiec ciasto", ru: "испечь пирог" }
  - { pl: "świeżo upieczony", ru: "новоиспечённый" }
  - { pl: "upiec w piekarniku", ru: "запечь в духовке" }
family:
  - { pl: "piec", ru: "печь (глагол)", relation: aspect }
  - { pl: "piekarnia", ru: "пекарня", relation: derived }
  - { pl: "piekarnik", ru: "духовка", relation: derived }
etymology: "Приставка U- плюс PIEC «печь», праславянское *pekti, то же, что русское «печь», «испечь». Чередование K/CZ одинаково в обоих языках: «пеку — печёшь», PIEKĘ — PIECZESZ."
memory: "Upiec — испечь: upiec sernik, chleb. Upiekę, upieczesz — как «испеку, испечёшь». Świeżo upieczony — новоиспечённый. Upiec dwie pieczenie przy jednym ogniu — двух зайцев. Читается «у́пец»."
idioms:
  - { pl: "upiec dwie pieczenie przy jednym ogniu", ru: "убить двух зайцев одним выстрелом" }
