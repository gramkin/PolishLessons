        ru: "Оба соперника пожали друг другу руки."
        source: { kind: authored }
  - id: objector
    ru: "противник (чего-л.), оппонент"
    examples:
      - pl: "Był przeciwnikiem kary śmierci przez całe życie."
        ru: "Он всю жизнь был противником смертной казни."
        source: { kind: authored }
      - pl: "Przeciwnicy projektu zebrali tysiąc podpisów."
        ru: "Противники проекта собрали тысячу подписей."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "ИМЕНИТЕЛЬНЫЙ МНОЖЕСТВЕННОГО — PRZECIWNICY, С ЧЕРЕДОВАНИЕМ K НА C. Это то же смягчение перед -i, что превращает suchy в susi: мужско-личные формы на -k дают -cy. Так же robotnik — robotnicy, urzędnik — urzędnicy, rolnik — rolnicy. Русское «противник — противники» основу не трогает вовсе, поэтому форму приходится заучивать отдельно, а по аналогии с русским её не построить." }
  - { kind: government, text: "Слово построено на предлоге PRZECIW, а он требует дательного падежа: przeciw komuś, przeciwko ustawie. Тот же дательный всплывает у глагола występować przeciwko czemuś. Русское «против» идёт с родительным, так что всё гнездо — предлог, глагол и это существительное — держится на падеже, которого русский здесь не ждёт." }
  - { kind: usage, text: "Винительный падеж совпадает с родительным, потому что существительное одушевлённое и мужское: widzę przeciwnikA, как и в русском «вижу противникА». Звательная форма PRZECIWNIKU в живой речи почти не встречается, зато в поэзии и риторике она на месте." }
collocations:
  - { pl: "groźny przeciwnik", ru: "грозный противник" }
  - { pl: "przeciwnik polityczny", ru: "политический противник" }
  - { pl: "pokonać przeciwnika", ru: "одолеть противника" }
family:
  - { pl: "przeciw", ru: "против", relation: root, id: przeciw }
  - { pl: "sprzeciw", ru: "возражение, протест", relation: root }
  - { pl: "zwolennik", ru: "сторонник", relation: antonym }
etymology: "От предлога przeciw, из праславянского *protivъ — то же слово, что русское «против». И производное совпадает: наш «противник» собран теми же частями и тем же суффиксом деятеля. Разошлось только множественное число: польский смягчил k перед окончанием и получил przeciwnicy, русский оставил «противники»."
memory: "Запоминать тут надо одну форму: множественное число — PRZECIWNICY, с c вместо k, как susi от suchy. И помни про падеж в корне гнезда: przeciw идёт с дательным, а не с родительным, как русское «против»."
idioms:
