# review
id: uzyc
format: 2
lemma: "użyć"
rank: 422
pos: verb
aspect: perf
pron: { cyr: "у́жыць" }
senses:
  - id: use
    ru: "использовать, воспользоваться"
    examples:
      - pl: "Mogę użyć wi-fi?"
        ru: "Можно воспользоваться вайфаем?"
        source: { kind: translated, id: 12889098 }
      - pl: "Użyłem wyobraźni."
        ru: "Я воспользовался воображением."
        source: { kind: tatoeba, id: 998848 }
      - pl: "Użyj tego."
        ru: "Воспользуйся этим."
        source: { kind: translated, id: 2120086 }
  - id: apply
    ru: "применить, употребить"
    examples:
      - pl: "Wszystko, co pan powie, może być użyte przeciwko panu."
        ru: "Всё, что вы скажете, может быть использовано против вас."
        source: { kind: tatoeba, id: 1518053 }
      - pl: "Czy możesz uzasadnić użycie przemocy?"
        ru: "Можешь ли ты оправдать применение насилия?"
        source: { kind: translated, id: 1168595 }
      - pl: "Wstrząśnij przed użyciem."
        ru: "Взболтать перед употреблением."
        source: { kind: translated, id: 524776 }
notes:
  - { kind: usage, text: "Главная ловушка — падеж: użyć требует родительного там, где русский берёт творительный. Użyłem noża «Я воспользовался ножом», Użyłem wyobraźni «Я воспользовался воображением»." }
  - { kind: usage, text: "Будущее берёт другую основу: użyję, użyjesz, użyje — при прошедшем użył." }
  - { kind: usage, text: "Несовершенный вид — używać, и он тоже требует родительного падежа." }
  - { kind: usage, text: "Существительное użycie — «применение, употребление»: wstrząśnij przed użyciem «взболтать перед употреблением»." }
collocations:
  - { pl: "użyć siły", ru: "применить силу" }
  - { pl: "użyć wyobraźni", ru: "включить воображение" }
  - { pl: "przed użyciem", ru: "перед употреблением" }
  - { pl: "łatwy w użyciu", ru: "простой в использовании" }
etymology: "Из u- + żyć «жить»; исходно «извлечь пользу, попользоваться». Русские «пожива» и «нажива» выросли из того же корня."
memory: "użyć — «воспользоваться», и главное в нём падеж: użyć czegoś, родительный, там где русский берёт творительный — użyłem noża «я воспользовался ножом». Будущее меняет основу: użyję, użyjesz."
idioms:
  - { pl: "użyć siły", ru: "применить силу" }
  - { pl: "wstrząśnij przed użyciem", ru: "взболтать перед употреблением" }
  - { pl: "użyć wyobraźni", ru: "включить воображение" }
