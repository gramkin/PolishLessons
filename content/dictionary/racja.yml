# review
id: racja
format: 2
lemma: "racja"
rank: 192
pos: noun
pron: { cyr: "ра́цья" }
senses:
  - id: being-right
    ru: "правота (mieć rację — быть правым)"
    note: "Конструкция иная, чем в русском: Masz rację — буквально «имеешь правоту»."
    examples:
      - pl: "Masz rację."
        ru: "Ты прав."
        source: { kind: tatoeba, id: 349177 }
      - pl: "Tom miał rację."
        ru: "Том был прав."
        source: { kind: tatoeba, id: 3749890 }
      - pl: "Znowu masz rację."
        ru: "Ты опять прав."
        source: { kind: tatoeba, id: 12949415 }
  - id: argument
    ru: "верно!; довод, аргумент"
    examples:
      - pl: "Racja!"
        ru: "Правильно!"
        source: { kind: tatoeba, id: 8608366 }
      - pl: "Mają racje."
        ru: "Они правы."
        source: { kind: tatoeba, id: 11319361 }
      - pl: "To są mocne racje."
        ru: "Это сильные доводы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "«Ты прав» по-польски — Masz rację, а не «jesteś prawy»: правота здесь существительное в винительном падеже." }
  - { kind: usage, text: "Racja! в ответе значит «Верно!, Точно!». Отрицание — Nie masz racji «Ты не прав» (родительный падеж)." }
  - { kind: usage, text: "z racji czegoś — «в силу чего-либо»; racja stanu — «государственный интерес»." }
collocations:
  - { pl: "mieć rację", ru: "быть правым" }
  - { pl: "nie masz racji", ru: "ты не прав" }
  - { pl: "z racji", ru: "в силу" }
  - { pl: "racja stanu", ru: "государственный интерес" }
etymology: "Из латинского ratio «разум, основание»; тот же корень в русских «рациональный» и «резон»."
memory: "«Ты прав» — это Masz rację, буквально «имеешь правоту», а «ты не прав» — Nie masz racji, с родительным падежом. В ответе Racja! значит «Верно!»."
idioms:
  - { pl: "mieć rację", ru: "быть правым" }
  - { pl: "z racji czegoś", ru: "в силу чего-либо" }
  - { pl: "racja stanu", ru: "государственный интерес" }
formExamplesSkip:
  - { form: "racyj", reason: "устаревший вариант родительного множественного; в современном языке — racji" }
