notes:
  - { kind: usage, text: "Женские названия профессий польский образует свободно и употребляет без всякой натянутости: NAUCZYCIEL даёт NAUCZYCIELKĘ, LEKARZ даёт LEKARKĘ, PISARZ даёт PISARKĘ, DZIENNIKARZ даёт DZIENNIKARKĘ. Суффикс -KA здесь обычный и нейтральный. Это стоит сопоставить с POLITYK из прошлой партии, у которого женской формы нет именно потому, что POLITYKA уже занято словом «политика»: не правило запрещает, а место занято. Так что исключения в этом ряду объясняются не приличиями, а омонимией." }
  - { kind: pronunciation, text: "Читается «науўыче́лька», в пять слогов, с ударением на предпоследнем, то есть на CIEL. Самое трудное место в начале: NAU читается как «нау», двумя гласными подряд, а дальше идёт cz, то есть «ч». Сочетание cie даёт «че», а ciel на конце звучит мягко, «чель». В предложном падеже NAUCZYCIELCE — «науўыче́льце», где k переходит в c перед окончанием -E, как MATKA даёт MATCE." }
  - { kind: government, text: "Чего учит — родительный падеж без предлога: NAUCZYCIELKA FIZYKI, NAUCZYCIELKA ŚPIEWU, NAUCZYCIELKA NIEMIECKIEGO. Русский тут требует родительного только при существительном, а при языке говорит иначе, «учительница немецкого», так что совпадение почти полное. Кого учит — предлог никакой не нужен, винительный: UCZY NAS FIZYKI, где и человек в винительном, и предмет в родительном сразу. Родительный множественного — NAUCZYCIELEK, с беглым e." }
  - { kind: false-friend, text: "Ложной пары нет, слово прозрачное, зато стоит заметить разницу в строении. Русское «учительница» образовано от «учитель» суффиксом «-ница», польское NAUCZYCIELKA — от NAUCZYCIEL суффиксом -KA, и это самый обычный польский способ. Главное же отличие в корне: польский глагол NAUCZYĆ значит «научить», с приставкой NA-, и от него же NAUCZYCIEL и NAUKA «наука, учёба». Русский «учитель» обходится без приставки. Поэтому в польском названии профессии слышится «на-», и выпускать его нельзя: UCZYCIEL не существует." }
