etymology: "От NAUCZYCIEL, а то — от глагола NAUCZYĆ «научить», составленного из приставки NA- и UCZYĆ «учить», из праславянского *učiti, откуда и русское «учить». Суффикс -CIEL образует названия действующего лица, как в русском «-тель»: NAUCZYCIEL и «учитель» построены по одной модели. Женский -KA добавлен уже на польской почве. Разница только в приставке: польский назвал учителя через совершенный вид, «тот, кто научит», а русский через несовершенный, «тот, кто учит». Оттого в польском слове на два слога больше, и первое из них нельзя опустить."
memory: "Женские названия профессий в польском обычны: nauczyciel — nauczycielka, lekarz — lekarka, pisarz — pisarka. Polityk исключение только потому, что polityka занято. Приставку na- не выпускать: uczyciel не существует. Читается «науўыче́лька», в предложном — nauczycielce."
