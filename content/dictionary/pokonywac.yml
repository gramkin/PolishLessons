# review
id: pokonywac
format: 2
lemma: "pokonywać"
rank: 6059
pos: verb
aspect: imperf
pron: { cyr: "поконы́ваць" }
senses:
  - id: overcome
    ru: "преодолевать (трудности, препятствия, расстояние)"
    examples:
      - pl: "Plemniki mogą pokonywać duże odległości, aby dotrzeć do jajeczka."
        ru: "Сперматозоиды могут преодолевать большие расстояния, чтобы достичь яйцеклетки."
        source: { kind: translated, id: 13267882 }
      - pl: "Dziennie pokonuję 20 mili."
        ru: "В день я прохожу 20 миль."
        source: { kind: translated, id: 609889 }
      - pl: "Codziennie pokonuje strach przed wodą."
        ru: "Каждый день он преодолевает страх перед водой."
        source: { kind: authored }
  - id: defeat
    ru: "побеждать, одерживать верх (над кем-л.)"
    examples:
      - pl: "Tom jest najsilniejszym tenisistą w mieście. Nawet grając bez przykładania się, z łatwością pokonuje wszystkich przeciwników."
        ru: "Том — сильнейший теннисист в городе. Даже играя без особых усилий, он легко побеждает всех соперников."
        source: { kind: translated, id: 10479892 }
      - pl: "Nasza drużyna rzadko pokonuje mistrzów."
        ru: "Наша команда редко обыгрывает чемпионов."
        source: { kind: authored }
notes:
  - { kind: government, text: "Кого, что — винительный без предлога: pokonywać przeciwnika, trudności, odległość. Русский говорит «побеждать кого-то», но «одерживать победу НАД кем-то»; польское POKONYWAĆ всегда прямое: pokonuje rywala." }
  - { kind: usage, text: "Несовершенный вид, пара — POKONAĆ: pokonywali kolejne przeszkody, «преодолевали препятствие за препятствием», но pokonali mistrza, «победили чемпиона». Настоящее время — от основы POKONUJ-: pokonuję, pokonujesz, pokonują; так же причастие POKONUJĄCY. Формы от POKONYWAJ- (pokonywający) устарели." }
  - { kind: pronunciation, text: "«поконы́ваць»: Y — «ы», конечное Ć — «ць». Ударение на предпоследнем слоге NY; в настоящем — po-ko-NU-je, «поконуе»." }
  - { kind: register, text: "Нейтральное: спорт, походы, психология. О расстоянии — особенно частое: pokonujemy dziennie 30 kilometrów, «проходим в день 30 километров»." }
collocations:
  - { pl: "pokonywać trudności", ru: "преодолевать трудности" }
  - { pl: "pokonywać odległość", ru: "преодолевать расстояние" }
  - { pl: "pokonywać przeciwnika", ru: "побеждать соперника" }
  - { pl: "pokonywać strach", ru: "преодолевать страх" }
family:
  - { pl: "pokonać", ru: "победить, преодолеть", relation: aspect, id: pokonac }
  - { pl: "pokonany", ru: "побеждённый", relation: derived }
  - { pl: "niepokonany", ru: "непобедимый", relation: derived }
etymology: "От POKONAĆ, а то от старого KONAĆ, «кончать, совершать», того же корня, что KONIEC, «конец», и русское «конец», «кончина». POKONAĆ — «покончить с кем-то», одолеть; вторичный несовершенный вид — с суффиксом -YWAĆ."
memory: "Pokonywać — от koniec: «покончить» с соперником или с трудностью. Pokonuję strach, pokonujemy kilometry. Прямой винительный, без «над». Пара — pokonać."
idioms:
