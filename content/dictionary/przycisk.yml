pos: noun
pron: { cyr: "пшы́циск" }
senses:
  - id: button
    ru: "кнопка (на устройстве)"
    examples:
      - pl: "Naciśnij zielony przycisk."
        ru: "Нажми зелёную кнопку."
        source: { kind: authored }
      - pl: "Przycisk windy nie działa."
        ru: "Кнопка лифта не работает."
        source: { kind: authored }
      - pl: "Kliknij przycisk „Wyślij”."
        ru: "Нажми кнопку «Отправить»."
        source: { kind: authored }
      - pl: "Pilot ma za dużo przycisków."
        ru: "У пульта слишком много кнопок."
        source: { kind: authored }
      - pl: "Przytrzymaj przycisk przez trzy sekundy."
        ru: "Удерживай кнопку три секунды."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PRZYCISK — «кнопка» на приборе или в программе. Пуговица на одежде — GUZIK, канцелярская кнопка — PINEZKA. А GUZIK в разговоре тоже бывает «кнопкой»: GUZIK ATOMOWY, «ядерная кнопка»." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Родительный — PRZYCISKU. Творительный — PRZYCISKIEM: K перед I смягчается." }
  - { kind: government, text: "Нажать кнопку — NACISNĄĆ PRZYCISK, винительный без предлога; вариант NACISNĄĆ NA PRZYCISK, как русское «нажать на кнопку», тоже правильный." }
  - { kind: pronunciation, text: "Читается «пшы́циск», ударение на первом слоге. PRZY — «пшы», CI — «ци»." }
collocations:
  - { pl: "nacisnąć przycisk", ru: "нажать кнопку" }
  - { pl: "przycisk startowy", ru: "кнопка запуска" }
  - { pl: "przycisk wyłączania", ru: "кнопка выключения" }
family:
  - { pl: "przyciskać", ru: "прижимать", relation: derived }
  - { pl: "nacisk", ru: "нажим, давление", relation: root, id: nacisk }
  - { pl: "ścisnąć", ru: "стиснуть, сжать", relation: root }
etymology: "От PRZYCISKAĆ «прижимать», с корнем CISK-, что и в NACISK «нажим» и ŚCISNĄĆ «стиснуть». Кнопка — то, что прижимают пальцем."
memory: "Przycisk — кнопка; guzik — пуговица; pinezka — канцелярская кнопка. Читается «пшы́циск». Nacisnąć przycisk — нажать кнопку."
idioms:
  - { pl: "naciskać na kogoś", ru: "давить на кого-то" }
