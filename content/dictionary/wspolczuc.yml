# review
id: wspolczuc
format: 2
lemma: "współczuć"
rank: 2526
pos: verb
pron: { cyr: "фспу́учуць" }
senses:
  - id: sympathise
    ru: "сочувствовать (+ дат.)"
    examples:
      - pl: "Współczuję ci z całego serca."
        ru: "Я сочувствую тебе от всего сердца."
        source: { kind: authored }
      - pl: "Współczuli rodzinie zmarłego."
        ru: "Они сочувствовали семье умершего."
        source: { kind: authored }
  - id: feel-for
    ru: "жалеть, сострадать"
    examples:
      - pl: "Współczuje każdemu, kto stracił dom."
        ru: "Он сочувствует каждому, кто потерял дом."
        source: { kind: authored }
      - pl: "Trudno nie współczuć takim ludziom."
        ru: "Трудно не сочувствовать таким людям."
        source: { kind: authored }
  - id: compassion
    ru: "сочувствие, сострадание (отглаг.)"
    examples:
      - pl: "Współczucie bez pomocy niewiele znaczy."
        ru: "Сочувствие без помощи мало что значит."
        source: { kind: authored }
notes:
  - { kind: government, text: "РЕДКИЙ СЛУЧАЙ ПОЛНОГО СОВПАДЕНИЯ, И ПО СБОРКЕ, И ПО ПАДЕЖУ. Współczuć разбирается как współ- плюс czuć, то есть «со-» плюс «чувствовать», в точности как русское «сочувствовать». И падеж тот же: WSPÓŁCZUĆ KOMUŚ, дательный — współczuję ci, jak «сочувствую тебе». Тут можно переводить прямо, ничего не перестраивая." }
  - { kind: usage, text: "У этого глагола НЕТ страдательного причастия, и это не пропуск в таблице, а свойство самого слова: он непереходный, дополнение стоит в дательном, а не в винительном, поэтому форм вроде współczuty не бывает. Отсюда и 52 формы вместо обычных 63. Безличное WSPÓŁCZUTO при этом есть." }
  - { kind: usage, text: "Вид несовершенный: есть WSPÓŁCZUJĄC «сочувствуя» и причастие WSPÓŁCZUJĄCY «сочувствующий», а деепричастия на -wszy нет. Настоящей совершенной пары у глагола тоже нет — сочувствие длится, а не завершается. Существительное WSPÓŁCZUCIE значит «сочувствие»." }
collocations:
  - { pl: "współczuć komuś", ru: "сочувствовать кому-л." }
  - { pl: "wyrazić współczucie", ru: "выразить сочувствие" }
  - { pl: "szczere współczucie", ru: "искреннее сочувствие" }
family:
  - { pl: "czuć", ru: "чувствовать", relation: root, id: czuc }
  - { pl: "współczucie", ru: "сочувствие", relation: derived, id: wspolczucie }
  - { pl: "litość", ru: "жалость", relation: root, id: litosc }
etymology: "Приставка współ- «со-, вместе» и czuć «чувствовать», из праславянского *čuti — того же корня, что русское «чуять» и «чувствовать». Русское «сочувствовать» собрано из тех же двух частей и в том же порядке. Współ- отвечает русскому «со-» и видно в współpraca «сотрудничество»."
memory: "współczuć — «сочувствовать», и это один из редких глаголов, где совпадает всё: и сборка (współ- плюс czuć), и падеж (дательный). Страдательного причастия нет, потому что глагол непереходный — отсюда и 52 формы."
idioms:
  - { pl: "wyrazić współczucie", ru: "выразить сочувствие" }
  - { pl: "nie ma co współczuć", ru: "жалеть тут нечего" }
