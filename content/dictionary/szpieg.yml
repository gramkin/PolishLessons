family:
  - { pl: "szpiegować", ru: "шпионить", relation: derived }
  - { pl: "szpiegostwo", ru: "шпионаж", relation: derived }
  - { pl: "szpiegowski", ru: "шпионский", relation: derived }
etymology: "Из немецкого, в конечном счёте от spähen «высматривать, подглядывать», через средневерхненемецкое spehe. Русский «шпион» пришёл из того же гнезда, но через итальянское spione и немецкое Spion, оттого и суффикс другой. Отсюда szpiegować «шпионить», szpiegostwo и szpiegowski."
memory: "szpieg — «шпион», слово то же, только короче русского. Запомните множественное число: szpiedzy, с переходом g в dz, как pedagog даёт pedagodzy. И конечное оглушение: «шпек»."
idioms:
