notes:
  - { kind: false-friend, text: "Русское «шпион» и польское szpieg пришли из одного источника, немецкого, в конечном счёте от spähen «высматривать», — но разными дорогами и с разными окончаниями. Значение одно и то же, путаться не в чем. Зато производные совпадают до буквы: szpiegować это «шпионить», szpiegostwo — «шпионаж», szpiegowski — «шпионский»." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ В МНОЖЕСТВЕННОМ ЧИСЛЕ. Именительный множественного — szpiedzy, с переходом g в dz. Это общее правило для мужско-личных на -g: pedagog даёт pedagodzy, biolog — biolodzy. Само szpieg на конце оглушается, «шпек», а в косвенных падежах звонкость возвращается: szpiega — «шпе́га»." }
  - { kind: usage, text: "Существительное мужско-личное: винительный множественного совпадает с родительным, widzę szpiegów. Прилагательное szpiegowski живёт в устойчивых сочетаниях: powieść szpiegowska «шпионский роман», siatka szpiegowska «шпионская сеть», afera szpiegowska." }
collocations:
