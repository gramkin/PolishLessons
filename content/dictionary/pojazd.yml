notes:
  - { kind: false-friend, text: "ПОЛЬСКОЕ POJAZD И РУССКОЕ «ПОЕЗД» СОБРАНЫ ИЗ ОДНИХ ЧАСТЕЙ, НО ЗНАЧАТ РАЗНОЕ. Оба это po- плюс корень «езд». Только по-польски pojazd — любое транспортное средство: машина, автобус, трактор. А поезд по-польски POCIĄG, от ciągnąć «тянуть», буквально «то, что тянут». Сказать pojazd о поезде нельзя." }
  - { kind: usage, text: "Предложный — POJEŹDZIE, и в нём a меняется на e: pojazd, но w pojeździe. Так же ведут себя jazda → jeździe и zjazd → zjeździe. Это старое чередование корня jad-/jed-, тот же, что в jechać «ехать»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: PO-jazd. Конечное zd оглушается до «ст»: «по́яст». В форме pojeździe слышно мягкое «поє́здзе»." }
collocations:
  - { pl: "pojazd mechaniczny", ru: "механическое транспортное средство" }
  - { pl: "pojazd uprzywilejowany", ru: "машина со спецсигналом" }
  - { pl: "kierować pojazdem", ru: "управлять транспортным средством" }
family:
  - { pl: "jechać", ru: "ехать", relation: root, id: jechac }
  - { pl: "pociąg", ru: "поезд", relation: root, id: pociag }
  - { pl: "samochód", ru: "автомобиль", relation: root, id: samochod }
etymology: "Приставка po- и корень jazd-, от jechać «ехать», из праславянского *jachati. Русское «поезд» собрано из тех же двух частей, но закрепилось за железной дорогой, а польское слово осталось общим. Корень jad-/jed- чередуется, отсюда pojeździe."
memory: "pojazd — это любое транспортное средство, а не поезд. Поезд по-польски pociąg, «то, что тянут». И запомни предложный: w POJEŹDZIE, с a→e, как jazda → jeździe."
idioms:
  - { pl: "pojazd uprzywilejowany", ru: "машина со спецсигналом" }
  - { pl: "kierować pojazdem po alkoholu", ru: "вести машину в нетрезвом виде" }
formExamplesSkip:
  - { form: "pojeździe", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
