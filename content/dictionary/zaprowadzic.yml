# review
id: zaprowadzic
format: 2
lemma: "zaprowadzić"
rank: 1961
pos: verb
pron: { cyr: "запрова́дзиць" }
senses:
  - id: lead-to
    ru: "отвести, привести (кого-л. куда-л.)"
    examples:
      - pl: "Zaprowadził dziecko do szkoły."
        ru: "Он отвёл ребёнка в школу."
        source: { kind: authored }
      - pl: "Zaprowadź go do lekarza."
        ru: "Отведи его к врачу."
        source: { kind: authored }
      - pl: "Zaprowadzono nas do sali obok."
        ru: "Нас отвели в соседний зал."
        source: { kind: authored }
  - id: establish
    ru: "навести, завести (порядок, обычай)"
    examples:
      - pl: "Zaprowadził w domu porządek."
        ru: "Он навёл в доме порядок."
        source: { kind: authored }
      - pl: "Nowy dyrektor zaprowadził inne zwyczaje."
        ru: "Новый директор завёл другие порядки."
        source: { kind: authored }
  - id: lead-where
    ru: "привести к чему-л. (о последствиях)"
    examples:
      - pl: "Dokąd to nas zaprowadzi?"
        ru: "Куда это нас приведёт?"
        source: { kind: authored }
      - pl: "Taka droga zaprowadziła go do więzienia."
        ru: "Такой путь привёл его в тюрьму."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень тот же, что в русском «водить, вести»: польское prowadzić — «вести, проводить», wodzić — «водить». Приставка za- работает как русская «за-» в «завести»: zaprowadzić porządek значит «навести порядок», zaprowadzić zwyczaj — «завести обычай». Понимать слово лучше через «при-/от-/за-вести», смотря по смыслу." }
  - { kind: government, text: "Отводят КОГО КУДА — винительный лица плюс do с родительным или na с винительным: zaprowadzić dziecko DO szkoły, zaprowadzić gościa NA górę. Там, где русский говорит «к врачу» (дательный), поляк ставит do lekarza — родительный. Это то же расхождение, что у zwracać się do kogoś." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — zaprowadzać. Страдательное причастие идёт по правилу для глаголов на -ić: zaprowadzony, zaprowadzeni, как zatrudniony. Безличное zaprowadzono — обычная форма протокола: zaprowadzono go na komisariat." }
collocations:
  - { pl: "zaprowadzić porządek", ru: "навести порядок" }
  - { pl: "zaprowadzić do szkoły", ru: "отвести в школу" }
  - { pl: "dokąd to nas zaprowadzi", ru: "куда это нас приведёт" }
family:
  - { pl: "prowadzić", ru: "вести, проводить", relation: root, id: prowadzic }
  - { pl: "zaprowadzać", ru: "отводить; наводить", relation: aspect }
  - { pl: "wprowadzić", ru: "ввести", relation: derived, id: wprowadzic }
etymology: "Приставка za- плюс prowadzić «вести», от праславянского корня *vod-, того же, что в русских «водить», «вести», «проводить», «вождь». Польское -wadz- и русское -вод-/-вожд- — один корень с разной огласовкой. Отсюда же wprowadzić «ввести», przeprowadzić «провести, перевести» и przeprowadzka «переезд»."
memory: "zaprowadzić — «отвести, привести», от prowadzić «вести» (корень тот же, что в «водить»). Два оборота стоит запомнить целиком: zaprowadzić porządek «навести порядок» и zaprowadzić kogoś DO lekarza — родительный там, где русский берёт дательный."
idioms:
  - { pl: "zaprowadzić porządek", ru: "навести порядок" }
  - { pl: "dokąd to nas zaprowadzi", ru: "куда это нас приведёт" }
