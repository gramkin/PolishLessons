etymology: "От KWIAT «цветок» и KWITNĄĆ «цвести»: апрель назван месяцем, когда всё зацветает. Русский в этом месте взял латинское APRILIS, и потому родства между названиями нет вовсе, хотя слово «цвет» в русском есть. Зато есть прямой мост через соседей: украинское «квітень» и белорусское «красавік» построены по тому же принципу, от цветения, и украинское слово совпадает с польским почти буквально. Из того же гнезда KWIATEK «цветочек», KWIACIARNIA «цветочный магазин» и KWIETNIK «клумба»."
memory: "Польские месяцы славянские, русские латинские, и совпадают только marzec и maj. Kwiecień это апрель, от kwiat «цветок», месяц цветения, и украинское «квітень» устроено так же. В парадигме два чередования сразу: беглое e исчезает и ć переходит в t, kwiecień но kwietnia. По той же схеме sierpień и sierpnia, grudzień и grudnia. Читается «кве́чень». Поговорка: kwiecień plecień, о переменчивой погоде."
idioms:
  - { pl: "kwiecień plecień", ru: "апрель переменчив" }
