notes:
  - { kind: false-friend, text: "Это слово открывает самый трудный для русскоязычного участок польского словаря: названия месяцев. Русский взял их из латыни, а польский сохранил свои, славянские, и ни одно не угадывается. KWIECIEŃ — это апрель, от KWIAT «цветок», то есть месяц цветения. Остальные устроены так же: STYCZEŃ январь, LUTY февраль, MARZEC март, MAJ май, CZERWIEC июнь, LIPIEC июль, SIERPIEŃ август, WRZESIEŃ сентябрь, PAŹDZIERNIK октябрь, LISTOPAD ноябрь, GRUDZIEŃ декабрь. Совпадают только MARZEC и MAJ." }
  - { kind: usage, text: "Одиннадцать форм, мужской род. В парадигме сразу два чередования, и оба стоит заметить. Во-первых, беглое E исчезает в косвенных падежах: KWIECIEŃ, но KWIETNIA, KWIETNIEM. Во-вторых, мягкое Ć именительного переходит в твёрдое T: KWIECIEŃ при KWIETNIA. Так же устроены SIERPIEŃ и SIERPNIA, GRUDZIEŃ и GRUDNIA, WRZESIEŃ и WRZEŚNIA. Выучив одну схему, остальные месяцы на -EŃ склоняются сами." }
  - { kind: government, text: "В каком месяце — предлог W с местным падежом: W KWIETNIU «в апреле», и русский строит так же. До какого — DO с родительным: DO KWIETNIA. С какого — OD с родительным: OD KWIETNIA. Дата внутри месяца требует родительного и порядкового числительного: PIĄTEGO KWIETNIA «пятого апреля», без всякого предлога, как и по-русски. В заголовках и на документах пишут цифрой с точкой, и месяц всё равно читается в родительном." }
  - { kind: pronunciation, text: "Читается «кве́чень», два слога, ударение на первом. Сочетание KWIE даёт «кве», где I только знак мягкости. Сочетание CIE даёт мягкое «че». Конечное Ń — мягкое «нь». В косвенных падежах картина меняется вместе с чередованием: KWIETNIA звучит «кве́тня», с твёрдым «т» и без беглого E. В слове KWIAT, от которого месяц назван, слышно «квят»." }
  - { kind: register, text: "Слово нейтральное и ежедневное. Частые обороты: W KWIETNIU «в апреле», NA POCZĄTKU KWIETNIA «в начале апреля», PRIMA APRILIS «первое апреля» как день шуток, где название осталось латинским. Поговорка KWIECIEŃ PLECIEŃ, BO PRZEPLATA TROCHĘ ZIMY, TROCHĘ LATA известна каждому школьнику и описывает переменчивую погоду: PLECIEŃ здесь слово, придуманное для рифмы, от PLEŚĆ «плести»." }
