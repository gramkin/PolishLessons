  - { pl: "pampers", ru: "памперс", relation: root }
etymology: "Общеславянский корень, тот же, что в русском «пелёнка». Польское слово образовано суффиксом -UCHA."
memory: "Pielucha — подгузник, пелёнка. Zmienić pieluchę — сменить подгузник. Od pieluchy — с пелёнок. Читается «пелю́ха»."
idioms:
