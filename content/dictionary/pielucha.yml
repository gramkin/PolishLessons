notes:
  - { kind: false-friend, text: "PIELUCHA — и «подгузник», и старая «пелёнка». В быту подгузник часто называют по марке — PAMPERS. OD PIELUCHY — «с пелёнок»: ZNAMY SIĘ OD PIELUCHY." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном CH переходит в SZ: W PIELUSZE. Родительный множественного — PIELUCH. Звательный PIELUCHO не употребляется." }
  - { kind: government, text: "Поменять подгузник — ZMIENIĆ PIELUCHĘ, винительный. С пелёнок — OD PIELUCHY, родительный. В подгузнике — W PIELUSZE, местный." }
  - { kind: pronunciation, text: "Читается «пелю́ха»: PIE — мягкое «пе», LU — «лю», CH — «х». Ударение на предпоследнем слоге. PIELUSZE — «пелю́ше»." }
collocations:
  - { pl: "zmienić pieluchę", ru: "сменить подгузник" }
  - { pl: "od pieluchy", ru: "с пелёнок" }
  - { pl: "pieluchy jednorazowe", ru: "одноразовые подгузники" }
