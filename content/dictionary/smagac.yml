        source: { kind: authored }
  - id: whip
    ru: "бичевать, сечь (книжное)"
    examples:
      - pl: "Fale smagały brzeg."
        ru: "Волны хлестали берег."
        source: { kind: authored }
      - pl: "Smagano go rózgami."
        ru: "Его секли розгами."
        source: { kind: authored }
notes:
  - { kind: government, text: "Чем хлещут — ТВОРИТЕЛЬНЫЙ падеж: smagać batem «стегать кнутом»." }
  - { kind: usage, text: "Чаще всего о стихиях: wiatr smaga, deszcz smaga, fale smagają. Это книжный, образный глагол." }
  - { kind: false-friend, text: "Родственно smagły «смуглый»: обожжённый, исхлёстанный ветром и солнцем. Связь для русского уха неочевидная." }
  - { kind: usage, text: "Совершенный вид — smagnąć «хлестнуть» (однократно). В корпусе глагол не встречается, примеры составлены вручную." }
