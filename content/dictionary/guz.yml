etymology: "Праславянское *guzъ «нарост, бугор», родственное словам со значением вздутия; русскому корень знаком в «гузке» и в областном «гуз», а также через глаголы со значением «вздуваться». Исходная идея — выпуклость, и она объясняет весь разброс значений: шишка от удара, нарост на дереве, опухоль в теле, а через уменьшительное -IK — ещё и пуговица, то есть маленькая выпуклость, продеваемая в петлю. Эта последняя линия в польском оказалась сильнее основной: GUZIK вытеснил GUZ в бытовой речи, и сегодня о пуговице говорят только GUZIK, а GUZ остался при медицине и при шишках. Русская «пуговица» построена на том же образе выпуклости, но от другого корня."
memory: "Одно слово на русские «шишку» и «опухоль»: guz na czole — шишка, guz złośliwy — злокачественная опухоль; различает только контекст. Конечное z оглушается: «гус», но guza — «гу́за». Устойчивое nabić sobie guza «набить шишку» берёт форму на -a, как grać w golfa. Уменьшительное guzik «пуговица» того же корня — маленькая выпуклость — и оно вытеснило основу в быту."
