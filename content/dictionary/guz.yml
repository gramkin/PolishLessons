notes:
  - { kind: false-friend, text: "Одно польское слово покрывает два русских, и они из разных миров: GUZ это и «шишка» на голове после удара, и «опухоль» в медицинском смысле. GUZ NA CZOLE — шишка, GUZ ZŁOŚLIWY «злокачественная опухоль» — медицина. Русский держит эти понятия раздельно, и буквальный перевод через шишку в медицинском контексте будет грубой ошибкой, а через опухоль в бытовом — пугающей. Различает только обстановка. Зато гнездо помогает запомнить: от GUZ образовано GUZIK «пуговица», буквально «шишечка», и эта карточка в словаре уже есть — уменьшительное вытеснило основу в быту, и сегодня GUZ остался при шишке и опухоли." }
  - { kind: government, text: "Мужской род, неодушевлённое. Винительный равен именительному: ZBADAĆ GUZ. Но в обороте о собственной шишке употребляется форма с -A: NABIĆ SOBIE GUZA, и это тот же приём, что в GRAĆ W GOLFA — винительный по виду родительного у неодушевлённых в устойчивых выражениях. Родительный на -A: BEZ GUZA. Местный GUZIE. Где шишка — предлог NA с местным: GUZ NA CZOLE, GUZ NA GŁOWIE. Какой — прилагательное после существительного в медицинском языке: GUZ ZŁOŚLIWY, GUZ ŁAGODNY." }
  - { kind: pronunciation, text: "Читается «гус», один слог. Конечное Z оглушается в «с», и это общее польское правило для конца слова: GUZ звучит «гус», как NÓŻ звучит «нуш». В косвенных формах, где за Z идёт гласная, слышно уже «з»: GUZA «гу́за», GUZEM «гу́зэм», GUZIE «гу́зе». Поэтому именительный и родительный различаются на слух не только окончанием, но и качеством согласной, и узнавать слово надо по косвенным формам." }
  - { kind: usage, text: "Частотные сочетания: NABIĆ SOBIE GUZA «набить шишку», GUZ NA CZOLE, GUZ ZŁOŚLIWY «злокачественная опухоль», GUZ ŁAGODNY «доброкачественная опухоль», USUNĄĆ GUZ «удалить опухоль». Выражение NABIĆ SOBIE GUZA употребляется и переносно, о неудачной попытке: по-русски «набить шишек». Уменьшительное GUZIK значит «пуговица», а GUZEK — «небольшая шишка, узелок», в том числе медицинский термин. Прилагательное GUZOWATY значит «шишковатый, бугристый»." }
