# review
id: poinformowac
format: 2
lemma: "poinformować"
rank: 2314
pos: verb
pron: { cyr: "поинформо́ваць" }
senses:
  - id: inform
    ru: "сообщить, проинформировать"
    examples:
      - pl: "Poinformowali nas o zmianie terminu."
        ru: "Они сообщили нам об изменении срока."
        source: { kind: authored }
      - pl: "Poinformuj szefa o wynikach."
        ru: "Сообщи начальнику о результатах."
        source: { kind: authored }
      - pl: "Nikt mnie o tym nie poinformował."
        ru: "Никто мне об этом не сообщил."
        source: { kind: authored }
  - id: notify
    ru: "уведомить (официально)"
    examples:
      - pl: "Urząd poinformował mieszkańców listownie."
        ru: "Учреждение уведомило жителей письмом."
        source: { kind: authored }
      - pl: "Zostali poinformowani z miesięcznym wyprzedzeniem."
        ru: "Их уведомили за месяц."
        source: { kind: authored }
notes:
  - { kind: government, text: "СООБЩАЮТ КОГО-ТО, А НЕ КОМУ-ТО: POINFORMOWAĆ KOGOŚ O CZYMŚ. Человек ставится в винительный падеж, тема — в предложный с o. Русский в самом частом варианте идёт через дательный: «сообщить КОМУ-ЛИБО», — и отсюда ошибка «poinformować szefowi». Правильно только poinformować szefA. Совпадает с русским лишь книжное «проинформировать кого-л.», его и держи в голове как опору." }
  - { kind: usage, text: "Здесь спряжение впервые работает на тебя. POINFORMOWAĆ — POINFORMUJĘ, POINFORMUJESZ, и русское «информировать — информирую» ведёт себя точно так же: -ować отвечает нашему -ировать, а -uję нашему -ирую. Весь класс заимствованных глаголов на -ować устроен одинаково, так что organizować — organizuję, planować — planuję. Запомнив одну пару, получаешь сотни." }
  - { kind: register, text: "Слово официальное, из языка учреждений и объявлений: uprzejmie informujemy, zostaliście poinformowani. В живой речи то же самое скажут проще — POWIEDZIEĆ или DAĆ ZNAĆ: dam ci znać «дам тебе знать». Приставка po- тут чисто видовая, она лишь делает глагол совершенным, тогда как русский для той же работы берёт про-: «проинформировать»." }
collocations:
  - { pl: "poinformować o decyzji", ru: "сообщить о решении" }
  - { pl: "poinformować z wyprzedzeniem", ru: "уведомить заранее" }
  - { pl: "dobrze poinformowany", ru: "хорошо осведомлённый" }
family:
  - { pl: "informować", ru: "информировать (несов.)", relation: aspect }
  - { pl: "informacja", ru: "информация", relation: root, id: informacja }
  - { pl: "powiadomić", ru: "уведомить", relation: root, id: powiadomic }
etymology: "Из латинского informare «придавать форму, осведомлять», пришедшего через немецкий и французский. И польский, и русский взяли это слово целиком, но совершенный вид сделали по-своему: поляк добавил родную приставку po-, русский — про-. Отсюда poinformować против «проинформировать»: корень международный, приставка у каждого своя."
memory: "poinformować KOGOŚ — винительный, а не дательный: poinformować szefa, а не «szefowi». Зато спряжение бесплатное: -ować даёт -uję ровно как русское -ировать даёт -ирую."
idioms:
