etymology: "Приставка s- плюс kazać, из праславянского *kazati «показывать, говорить» — того же корня, что русские «сказать», «казать», «приказ», «показать». Польский увёл простой глагол в сторону приказа, а приставочный — в сторону суда. Отсюда skazaniec «осуждённый», wskazać «указать», pokazać «показать», rozkaz «приказ»."
memory: "skazać — «приговорить», от kazać, которое значит «ВЕЛЕТЬ», а не «сказать»: сказать это powiedzieć. Приговаривают НА что-то, с винительным: skazać na trzy lata. И чередование как в русском: skażę, как «скажу»."
idioms:
