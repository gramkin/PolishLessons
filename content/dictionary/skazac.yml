notes:
  - { kind: false-friend, text: "KAZAĆ НЕ ЗНАЧИТ «СКАЗАТЬ» — И ЭТО ОДНА ИЗ САМЫХ ЧАСТЫХ ОШИБОК. Польское kazać значит «ВЕЛЕТЬ, приказать»: kazał mi czekać «он велел мне ждать». Сказать по-польски — powiedzieć. Приставочное skazać пошло по судебной линии и значит «приговорить». Корень общий с русскими «сказать», «приказать», «показать», но значения разошлись далеко." }
  - { kind: government, text: "ПРИГОВАРИВАЮТ НЕ «К ЧЕМУ», А «НА ЧТО»: SKAZAĆ KOGOŚ NA COŚ, с винительным. Skazać na karę więzienia, na grzywnę, na śmierć. Русское «приговорить к» просит дательного, и подстановка его сюда — верная ошибка. Переносное значение строится так же: skazany na sukces «обречён на успех»." }
  - { kind: pronunciation, text: "ОСНОВА НАСТОЯЩЕГО ВРЕМЕНИ МЕНЯЕТ Z НА Ż — РУССКИЙ ДЕЛАЕТ ТО ЖЕ. Инфинитив skazać даёт skażę, skażesz, skaże, skażą, повелительное skaż. Русское «сказать» даёт «скажу, скажешь», меняя з на ж. Одно древнее чередование, два языка. Ż читается как твёрдое ж: «ска́жэн»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — skazywać. Отсюда деепричастие skazawszy и отсутствие причастия настоящего времени. Страдательное skazany служит и причастием, и существительным: skazany «осуждённый», как русское субстантивированное причастие. Существительное skazanie «осуждение», приговор — wyrok." }
