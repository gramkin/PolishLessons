etymology: "Через французское PROFIL из итальянского PROFILO, от PROFILARE «обводить по краю», сложенного из латинского PRO «вперёд» и FILUM «нить». Буквально профиль — это «проведённая нить», линия очерка, и из этого образа выросли все значения: сначала контур лица, потом чертёжный разрез, потом погонный строительный элемент, и наконец характеристика деятельности. Оба языка взяли слово из французского в восемнадцатом или девятнадцатом веке и сохранили его значения почти одинаково. От латинского FILUM в польском есть и другие потомки: FILET «филе», то есть «ниточка», и FILIGRAN. Разница в написании та же, что в целом ряде заимствований: польский оставил одно F, русский тоже, но там, где источник удваивал согласную, пути расходятся."
memory: "Значение как в русском, но употребление шире: profil — и вид сбоку, и специализация (profil szkoły), и строительный элемент (profile aluminiowe), и страница в сети. Одно f. Два родительных множественного: profili и profilów — то же колебание, что rycerzy/rycerzów и sojuszy/sojuszów. Родительный и местный единственного — одна форма profilu. Буквально от латинского pro + filum «нить»: профиль — это проведённая линия."
