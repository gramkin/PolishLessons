notes:
  - { kind: false-friend, text: "Значение совпадает с русским, но польское слово шире по употреблению, и это стоит учесть. PROFIL это и вид лица сбоку, и специализация — PROFIL SZKOŁY «профиль школы», PROFIL FIRMY, — и строительный погонный элемент: PROFILE ALUMINIOWE «алюминиевые профили», PROFILE STALOWE. В этом последнем смысле русский чаще скажет «профиль» тоже, так что совпадение сохраняется, но в живой речи о школе русский скорее употребит «направление» или «специализация». Писать слово надо с одним F: польский не удваивает согласные в заимствованиях. Прилагательное PROFILOWY значит «профильный», а глагол PROFILOWAĆ — «профилировать, задавать профиль»." }
  - { kind: usage, text: "Основа кончается на мягкое L, и это даёт колебание родительного множественного: правильны и PROFILI, и PROFILÓW. Форма на -I идёт от мягкой основы, форма на -ÓW — по образцу твёрдых; обе встречаются, причём PROFILI чаще в значении вида и специализации, а PROFILÓW — в строительном. Это то же колебание, что у слов на -RZ и -SZ: RYCERZY рядом с RYCERZÓW, SOJUSZY рядом с SOJUSZÓW. Второе: родительный и местный единственного совпадают в одной форме PROFILU — BEZ PROFILU и W PROFILU, два падежа одной формой, как у всех мягких мужских основ." }
  - { kind: government, text: "Мужской род, неодушевлённое. «В профиль» о повороте головы — предлог W с местным: W PROFILU, ZDJĘCIE W PROFILU «фотография в профиль». Чей или чего профиль — родительный: PROFIL TWARZY, PROFIL FIRMY, PROFIL SZKOŁY. Частотные сочетания: PROFIL ZAWODOWY «профессиональный профиль», PROFIL DZIAŁALNOŚCI «профиль деятельности», PROFILE OKIENNE «оконные профили». В интернете PROFIL значит страницу пользователя, как и по-русски: ZAŁOŻYĆ PROFIL «создать профиль», USUNĄĆ PROFIL." }
  - { kind: pronunciation, text: "Читается «про́филь», два слога, ударение на первом. Конечное L в польском звучит мягче русского твёрдого «л» и ближе всего к русскому «ль», хотя полного совпадения нет: польское L — звук средний, одинаковый во всех положениях. Буква O произносится полно, как «о». В форме PROFILU слогов три, ударение переходит на предпоследний: «профи́лю». В родительном множественного PROFILÓW буква Ó даёт «у», конечное W оглушается: «профи́люф»." }
