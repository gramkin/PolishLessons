# review
id: odrobina
format: 2
lemma: "odrobina"
rank: 1521
pos: noun
pron: { cyr: "одроби́на" }
senses:
  - id: a-little
    ru: "капелька, чуточка, самая малость"
    examples:
      - pl: "W butelce została odrobina mleka."
        ru: "В бутылке осталась капля молока."
        source: { kind: tatoeba, id: 775936 }
      - pl: "Tej zupie brakuje odrobiny soli."
        ru: "Этому супу не хватает щепотки соли."
        source: { kind: translated, id: 968902 }
      - pl: "Przy odrobinie szczęścia pogoda będzie dobra."
        ru: "Если немного повезёт, погода будет хорошая."
        source: { kind: translated, id: 9686146 }
  - id: slightly
    ru: "odrobinę — чуточку, слегка (наречно)"
    examples:
      - pl: "Jestem odrobinę głodny."
        ru: "Я чуточку голоден."
        source: { kind: translated, id: 2302818 }
      - pl: "Podejdź odrobinę bliżej."
        ru: "Подойди чуточку ближе."
        source: { kind: translated, id: 3653742 }
notes:
  - { kind: usage, text: "Винительный odrobinę работает как наречие «чуточку»: jestem odrobinę głodny «я чуточку голоден», odrobinę wolniej «чуточку медленнее». Это самое частое употребление слова." }
  - { kind: usage, text: "Женский род. Значит «капелька, самая малость»: odrobina mleka «капля молока»." }
  - { kind: usage, text: "Ряд по силе: trochę «немного», odrobina «чуточку», ani odrobiny «ни капельки»." }
  - { kind: usage, text: "przy odrobinie szczęścia — «если немного повезёт»." }
collocations:
  - { pl: "odrobina szczęścia", ru: "капля везения" }
  - { pl: "odrobinę wolniej", ru: "чуточку медленнее" }
  - { pl: "ani odrobiny", ru: "ни капельки" }
etymology: "От drobina «крупица», в основе drobny «мелкий» (праславянское *drobьnъ). Русские «дробный» и «дробить» того же корня."
memory: "odrobina — «капелька, чуточка», от drobny «мелкий», родственного русскому «дробный». Чаще всего слово встречается в винительном как наречие: odrobinę wolniej «чуточку медленнее», jestem odrobinę głodny."
idioms:
  - { pl: "odrobina szczęścia", ru: "капля везения" }
  - { pl: "ani odrobiny", ru: "ни капельки" }
  - { pl: "przy odrobinie wysiłku", ru: "при небольшом усилии" }
