etymology: "От paść «пасти»; русский «пастух» — тот же корень и тот же суффикс."
memory: "pastuch — «пастух», слово разговорное. Нейтральное и церковное — pasterz. Корень paść «пасти»."
idioms:
  - { pl: "pastuch owiec", ru: "пастух овец" }
formExamplesSkip:
