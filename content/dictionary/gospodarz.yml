notes:
  - { kind: false-friend, text: "Здесь повторяется схема, уже знакомая по OGNISKO и PIĘŚĆ: польский сохранил славянское слово, а русский взял чужое. GOSPODARZ идёт от старого GOSPODŹ «господин», то есть от того же корня, что русские «господин», «господь» и «государь». Русский же для хозяина взял тюркское заимствование, «хозяин». Поэтому слово кажется незнакомым, хотя корень знаком каждому. Отдельно: GOSPODARKA значит не «хозяйка», а «экономика», а хозяйка дома называется GOSPODYNI." }
  - { kind: usage, text: "Одиннадцать форм, мужской род личный, поэтому винительный множественного совпадает с родительным: WIDZIAŁEM GOSPODARZY. Родительных множественного два: обычное GOSPODARZY и устаревшее GOSPODARZÓW, которое попадается в старых текстах. В спортивном значении слово живёт почти только во множественном: GOSPODARZE значит «хозяева поля», DRUŻYNA GOSPODARZY, и так пишут в каждом отчёте о матче." }
  - { kind: government, text: "Хозяин чего — родительный без предлога: GOSPODARZ DOMU, GOSPODARZ SPOTKANIA. У хозяина — предлог U с родительным: MIESZKAĆ U GOSPODARZA, как и по-русски. Вести хозяйство — PROWADZIĆ GOSPODARSTWO, винительный. Глагол GOSPODAROWAĆ управляет творительным: GOSPODAROWAĆ ZIEMIĄ «хозяйствовать на земле», тогда как русский ставит предлог «на» с предложным." }
  - { kind: pronunciation, text: "Читается «госпо́даш», три слога, ударение на втором. Сочетание RZ даёт «ж», но на конце слова оно оглушается и звучит как «ш», поэтому слово кончается на «даш», а не «даж». В косвенных падежах RZ оказывается перед гласной и звучит звонко: GOSPODARZA это «госпо́дажа». Это общее правило: конечные звонкие в польском оглушаются, как в TERAZ «тэрас»." }
  - { kind: register, text: "Слово нейтральное и многозначное: хозяин дома, землевладелец, фермер, принимающая сторона. Частые обороты: GOSPODARZ DOMU «домовладелец», DOBRY GOSPODARZ «хороший хозяин», о человеке рачительном, DRUŻYNA GOSPODARZY «команда хозяев», GOSPODARZ SPOTKANIA. В деревне GOSPODARZ значит просто «крестьянин со своим хозяйством», и это слово уважительное. Женская пара, GOSPODYNI, значит и «хозяйка», и «домработница», смотря по контексту." }
