etymology: "От старого GOSPODŹ «господин, владыка», от праславянского *gospodь, то есть от того же слова, что русские «господь», «господин» и «государь». Исходно это сложение двух корней со значением «гость» и «владыка», то есть тот, кто принимает гостей и распоряжается домом, и оба нынешних значения, хозяин дома и принимающая сторона, выросли прямо отсюда. Русский это слово для хозяина утратил и взял тюркское «хозяин», оставив свой корень только в высоком слое. Румынский, напротив, заимствовал славянское слово как GOSPODAR, титул правителя."
memory: "Та же схема, что у ognisko и pięść: поляк сохранил славянское слово, русский взял чужое. Gospodarz от gospodź «господин», то есть родня «господину» и «государю», а русский «хозяин» заимствован из тюркских. Читается «госпо́даш», потому что конечное rz оглушается в «ш», но gospodarza уже «госпо́дажа». Знать спортивное значение: gospodarze это «хозяева поля». И не путать: gospodarka это «экономика», а хозяйка это gospodyni."
