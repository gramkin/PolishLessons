notes:
  - { kind: false-friend, text: "Разложить слово на части легко, а угадать значение — нет. Корень KONIEC «конец» русскому прозрачен, и WYKOŃCZYĆ выглядит как «выкончить», чего в русском нет вовсе. На деле у слова два смысла, и оба надо запомнить. Первый строительный: WYKOŃCZYĆ MIESZKANIE значит «отделать квартиру», а WYKOŃCZENIE — «отделка», и в объявлениях о жилье это слово встречается постоянно. Второй разговорный: TA PRACA MNIE WYKOŃCZY — «эта работа меня доконает». «Закончить» же в обычном смысле — это SKOŃCZYĆ, без wy-." }
  - { kind: usage, text: "Страдательное причастие живёт отдельно как прилагательное и в живой речи слышно чаще глагола: WYKOŃCZONY значит «измотанный, без сил». JESTEM KOMPLETNIE WYKOŃCZONY — «я совершенно вымотан». В строительном смысле то же слово значит «отделанный»: MIESZKANIE WYKOŃCZONE POD KLUCZ — «квартира с отделкой под ключ». Мужская личная форма множественного — WYKOŃCZENI с e при WYKOŃCZONY с o, по правилу причастий на -ony из карточки KARMIĆ." }
  - { kind: pronunciation, text: "Повелительное WYKOŃCZ — тот случай, который легко предсказать неверно. Берём третье лицо WYKOŃCZY, отбрасываем -y, остаётся WYKOŃCZ, и сочетание -ńcz выглядит слишком тяжёлым, чтобы закрыть слово. Но правило из карточки KARMIĆ спрашивает именно о том, бывает ли такой конец у польских слов, — и бывает: WYKOŃCZ, SKOŃCZ, DOKOŃCZ все законны, никакого -ij не вставляется. Сравните с WALNIJ, где основа WALN- слово закончить не может." }
  - { kind: government, text: "Переходный, винительный: WYKOŃCZYĆ COŚ — wykończyć mieszkanie, wykończyć elewację, wykończyć pracę. Чем отделывают — творительный без пределога: WYKOŃCZONO KAMIENIEM, DREWNEM, TYNKIEM, ровно как русское «отделали камнем». Во втором значении дополнением становится человек: WYKOŃCZYĆ KOGOŚ, и тогда это «доконать». Несовершенная пара — WYKAŃCZAĆ, и в ней появляется -a- с мягким ń: WYKAŃCZAM, WYKAŃCZA." }
