etymology: "Приставка wy- и KOŃCZYĆ «кончать», от KONIEC «конец», из праславянского *konьcь — то же слово, что русский «конец». Приставка wy- дала здесь «довести до полного конца», откуда и строительная отделка, и разговорное «доконать». Гнездо русскому понятно насквозь: KONIEC «конец», SKOŃCZYĆ «закончить», DOKOŃCZYĆ «докончить», ZAKOŃCZENIE «окончание», NIESKOŃCZONY «бесконечный». Только WYKOŃCZENIE «отделка» надо запомнить отдельно."
memory: "Корень тот же, что в «конце», но wykończyć — это «отделать» (о квартире) или «доконать» (о человеке). Просто «закончить» — это skończyć, без wy-."
