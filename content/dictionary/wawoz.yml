# review
id: wawoz
format: 2
lemma: "wąwóz"
rank: 5955
pos: noun
pron: { cyr: "во́у̃вус" }
senses:
  - id: ravine
    ru: "овраг, лощина"
    examples:
      - pl: "Wąwóz ciągnął się kilometrami między polami."
        ru: "Овраг тянулся на километры между полями."
        source: { kind: authored }
      - pl: "Zeszliśmy na dno wąwozu po stromej ścieżce."
        ru: "Мы спустились на дно оврага по крутой тропинке."
        source: { kind: authored }
      - pl: "Wąwozy lessowe to wizytówka Kazimierza Dolnego."
        ru: "Лёссовые овраги — визитная карточка Казимежа-Дольного."
        source: { kind: authored }
      - pl: "Szliśmy wąwozem aż do rzeki."
        ru: "Мы шли оврагом до самой реки."
        source: { kind: authored }
  - id: gorge
    ru: "ущелье"
    examples:
      - pl: "Rzeka wyżłobiła głęboki wąwóz w skale."
        ru: "Река промыла в скале глубокое ущелье."
        source: { kind: authored }
      - pl: "Droga biegnie wąskim wąwozem między skałami."
        ru: "Дорога идёт узким ущельем между скалами."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Читается «во́у̃вус»: носовая Ą перед W звучит как «оу̃», Ó — «у», конечное Z оглушается в «с». Ударение на первом слоге." }
  - { kind: usage, text: "Мужской род, неодушевлённый. Ó в основе меняется на O во всех падежах, кроме именительного и винительного единственного: WĄWÓZ, но WĄWOZU, W WĄWOZIE, WĄWOZY — как SAMOCHÓD → SAMOCHODU. В предложном Z смягчается: W WĄWOZIE." }
  - { kind: usage, text: "Одно польское слово покрывает два русских: сухой «овраг» среди полей и узкое скальное «ущелье». Широкая долина с рекой — DOLINA, глубокий узкий овраг — также JAR." }
collocations:
  - { pl: "wąwóz lessowy", ru: "лёссовый овраг" }
  - { pl: "dno wąwozu", ru: "дно оврага" }
  - { pl: "głęboki wąwóz", ru: "глубокое ущелье" }
family:
  - { pl: "wąwozik", ru: "небольшой овраг", relation: derived }
synonyms:
  - "jar"
  - "parów"
etymology: "Происхождение неясно. Созвучие с WĄSKI «узкий» и WÓZ «повозка» удобно для запоминания, но этимологией не подтверждено."
memory: "Wąwóz — представь «wąski wóz»: телега едва проходит между двумя склонами. W wąwozie — в овраге."
idioms:
  - { pl: "wąwóz lessowy", ru: "лёссовый овраг (типичный пейзаж под Люблином)" }
