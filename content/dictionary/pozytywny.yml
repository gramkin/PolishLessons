etymology: "Из латинского POSITIVUS «установленный, положенный», от PONERE «класть, ставить». Русский обошёлся с этим словом дважды и получил два разных: один раз заимствовал прямо, и вышло «позитивный», а другой раз перевёл по частям, взяв свой корень «положить», и вышло «положительный». Польский заимствовал только один раз, поэтому у него на оба случая одно слово POZYTYWNY. Если держать в голове, что «положительный» это буквальный перевод латинского «положенного», соответствие перестаёт выглядеть случайным. Из того же латинского гнезда POZYCJA «позиция» и DEPOZYT «депозит»."
memory: "Одно польское слово на два русских: pozytywny это и «положительный» в справке или заключении, и «позитивный» о характере. Русское «положительный» это буквальный перевод латинского positivus от ponere «класть», а «позитивный» то же слово, взятое прямо; польский взял только один раз. Правило окончаний: -YWNY это -ИВНЫЙ, отсюда negatywny, aktywny, efektywny. Читается «позыты́вны», с двумя «ы». Управление наречия: pozytywnie nastawiony DO czegoś, предлог do и родительный."
