notes:
  - { kind: false-friend, text: "Одно польское слово покрывает два русских, и выбирать между ними не нужно — нужно знать, что выбора нет. Русский в официальном контексте говорит «положительный»: положительный результат, положительное заключение, положительный отзыв. А «позитивный» оставляет для настроя и характера: позитивный человек, позитивное мышление. Польский во всех этих случаях скажет POZYTYWNY. Поэтому WYNIK POZYTYWNY это «положительный результат», а не «позитивный», и POZYTYWNA OPINIA — «положительный отзыв». Обратно это важнее: русское «положительный» не стоит переводить словом DODATNI, у которого своя область — математика и физика, DODATNIA TEMPERATURA «плюсовая температура»." }
  - { kind: usage, text: "Здесь работает второе полезное правило окончаний: польское -YWNY отвечает русскому -ИВНЫЙ. POZYTYWNY и «позитивный», NEGATYWNY и «негативный», AKTYWNY и «активный», EFEKTYWNY и «эффективный», INTENSYWNY и «интенсивный». Прямой антоним NEGATYWNY устроен так же и работает во всех тех же значениях. Тридцать три формы образуются регулярно, N перед окончанием смягчается: POZYTYWNIEJSZY. Наречие POZYTYWNIE значит и «положительно», и «позитивно», смотря по контексту." }
  - { kind: government, text: "Само прилагательное падежом не управляет, но у производного наречия есть управление, которое стоит запомнить. POZYTYWNIE NASTAWIONY DO CZEGOŚ значит «положительно настроенный к чему-то», и предлог здесь DO с родительным, тогда как русский ставит «к» с дательным. Та же схема в отрицательном варианте: NEGATYWNIE NASTAWIONY DO ZMIAN. Ещё одна частая конструкция — ROZPATRZYĆ WNIOSEK POZYTYWNIE, буквально «рассмотреть заявление положительно», то есть удовлетворить его." }
  - { kind: pronunciation, text: "Читается «позыты́вны», четыре слога, ударение на предпоследнем. Обе буквы Y звучат как «ы», и это даёт слову совсем не русский вид: не «позитивный», а «позытывны». Буква Z здесь звонкая, «з», а не «ц». Конечное Y — снова «ы». В наречии POZYTYWNIE слышно «позыты́вне». В сравнительной степени слогов шесть, ударение на предпоследнем: «позытывне́йшы»." }
  - { kind: register, text: "Слово нейтральное и равно уместно в медицинской справке, в банковском решении и в разговоре о характере. Частые обороты: WYNIK POZYTYWNY «положительный результат», POZYTYWNA OPINIA «положительный отзыв», POZYTYWNE MYŚLENIE «позитивное мышление», MYŚLEĆ POZYTYWNIE «думать позитивно». В канцелярском языке живёт формула DECYZJA POZYTYWNA «положительное решение». В разговоре о человеке вместо него часто скажут проще: POGODNY «светлый, жизнерадостный»." }
