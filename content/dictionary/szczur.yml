        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово мужского рода, в отличие от русской «крысы»: ten szczur, wielki szczur." }
  - { kind: usage, text: "wyścig szczurów — «крысиные бега», о погоне за карьерой. szczur lądowy — «сухопутная крыса», о моряцком прозвище." }
  - { kind: pronunciation, text: "Начало слова — три шипящих подряд: szcz читается как «щч», szczur ≈ «щчур»." }
collocations:
  - { pl: "wyścig szczurów", ru: "крысиные бега" }
  - { pl: "bać się szczurów", ru: "бояться крыс" }
  - { pl: "trutka na szczury", ru: "крысиный яд" }
etymology: "Праславянское *ščurъ. Русская «крыса» — слово другого корня, так что здесь родство не помогает и форму нужно запомнить отдельно."
memory: "szczur — «крыса», но мужского рода: ten szczur. Начало слова трудное: szcz ≈ «щч». Помните wyścig szczurów «крысиные бега»."
idioms:
  - { pl: "wyścig szczurów", ru: "крысиные бега" }
  - { pl: "szczury uciekają z tonącego okrętu", ru: "крысы бегут с тонущего корабля" }
  - { pl: "trutka na szczury", ru: "крысиный яд" }
