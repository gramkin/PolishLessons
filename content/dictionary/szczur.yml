        ru: "Крысы быстро размножаются."
        source: { kind: translated, id: 911481 }
      - pl: "Tom boi się szczurów."
        ru: "Том боится крыс."
        source: { kind: translated, id: 10604144 }
  - id: rat-idiom
    ru: "в устойчивых выражениях"
    examples:
      - pl: "Szczury uciekają z tonącego okrętu."
        ru: "Крысы бегут с тонущего корабля."
        source: { kind: translated, id: 365385 }
