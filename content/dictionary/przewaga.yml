# review
id: przewaga
format: 2
lemma: "przewaga"
rank: 2429
pos: noun
pron: { cyr: "пшэва́га" }
senses:
  - id: advantage
    ru: "преимущество, превосходство"
    examples:
      - pl: "Zdobyli przewagę w drugiej połowie."
        ru: "Они добились преимущества во второй половине."
        source: { kind: authored }
      - pl: "Daje to przewagę nad konkurencją."
        ru: "Это даёт преимущество над конкурентами."
        source: { kind: authored }
  - id: lead
    ru: "перевес, разница в счёте"
    examples:
      - pl: "Wygrali przewagą dwóch punktów."
        ru: "Они выиграли с перевесом в два очка."
        source: { kind: authored }
      - pl: "Przewaga jednego punktu wystarczyła."
        ru: "Перевеса в одно очко хватило."
        source: { kind: authored }
  - id: majority
    ru: "численное превосходство, большинство"
    examples:
      - pl: "Mówiono o przewadze liczebnej."
        ru: "Говорили о численном превосходстве."
        source: { kind: authored }
notes:
  - { kind: usage, text: "ОЧЕРЕДНОЕ СМЯГЧЕНИЕ В ДАТЕЛЬНОМ И ПРЕДЛОЖНОМ, НА ЭТОТ РАЗ g→dz. Форма — PRZEWADZE, а не przewage: dzięki przewadze, o przewadze. Так же ведут себя droga → drodze, noga → nodze, waga → wadze. Рядом с k→c (polityce) и ł→l (chwale) это третий тип, который надо просто узнавать." }
  - { kind: government, text: "Преимущество НАД кем-то — przewaga NAD kimś, с творительным падежом, ровно как по-русски: przewaga nad rywalem. А вот «преимущество в чём-то» будет przewaga W czymś с предложным: przewaga w szybkości. Глагол — mieć przewagę или zdobyć przewagę." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: prze-WA-ga. Prze читается как «пшэ», потому что rz после глухого p оглушается: «пшэва́га». В форме przewadze слышно «пшэва́дзэ»." }
collocations:
  - { pl: "mieć przewagę", ru: "иметь преимущество" }
  - { pl: "przewaga liczebna", ru: "численное превосходство" }
  - { pl: "zdobyć przewagę", ru: "получить преимущество" }
family:
  - { pl: "waga", ru: "вес; весы", relation: root, id: waga }
  - { pl: "przeważać", ru: "преобладать", relation: derived }
  - { pl: "słabość", ru: "слабость", relation: antonym }
etymology: "Приставка prze- «пере-» плюс waga «вес», то есть буквально «перевес». Русское «перевес» собрано из тех же двух частей и в том же порядке — это точная калька. Само waga пришло из немецкого Waage «весы», родственного wiegen «взвешивать»."
memory: "przewaga — «преимущество», а по частям буквально «перевес»: prze- «пере-» плюс waga «вес». Дательный и предложный — PRZEWADZE, с g→dz, как droga → drodze. Преимущество над кем-то — nad kimś, с творительным."
idioms:
  - { pl: "przewaga nad rywalem", ru: "преимущество над соперником" }
  - { pl: "zyskać przewagę", ru: "получить перевес" }
