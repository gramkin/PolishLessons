# review
id: nauka
format: 2
lemma: "nauka"
rank: 1208
pos: noun
pron: { cyr: "нау́ка" }
senses:
  - id: science
    ru: "наука"
    examples:
      - pl: "Matematyka to królowa nauk."
        ru: "Математика - царица наук."
        source: { kind: tatoeba, id: 13472028 }
      - pl: "Fizyka jest dziedziną nauki."
        ru: "Физика — область науки."
        source: { kind: translated, id: 12225687 }
      - pl: "Matematyka jest nauką."
        ru: "Математика — это наука."
        source: { kind: translated, id: 12199541 }
  - id: learning
    ru: "учёба, изучение: nauka angielskiego «изучение английского»"
    examples:
      - pl: "Nigdy nie jest późno na naukę."
        ru: "Учиться никогда не поздно."
        source: { kind: tatoeba, id: 352978 }
      - pl: "Rozpoczęłeś już naukę angielskiego?"
        ru: "Ты начал изучать английский?"
        source: { kind: tatoeba, id: 603301 }
      - pl: "Jak ci idzie nauka?"
        ru: "Как у тебя идёт учёба?"
        source: { kind: translated, id: 730495 }
  - id: lesson
    ru: "урок, поучение — то, из чего делают выводы"
    examples:
      - pl: "To będzie dla ciebie nauka."
        ru: "Это будет тебе уроком."
        source: { kind: authored }
      - pl: "Wyciągnął z tego naukę."
        ru: "Он извлёк из этого урок."
        source: { kind: authored }
      - pl: "Niech to będzie nauka na przyszłość."
        ru: "Пусть это будет уроком на будущее."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Одно слово на два русских: «наука» (nauki humanistyczne «гуманитарные науки») и «учёба, изучение» (nauka angielskiego «изучение английского»). Контекст различает их безошибочно." }
  - { kind: government, text: "nauka czegoś «изучение чего-то» требует родительного: nauka języka, nauka pływania. А сам глагол «учиться» — uczyć się, тоже с родительным: uczę się polskiego." }
  - { kind: usage, text: "Третье значение — «урок, поучение»: Niech to będzie nauka na przyszłość «Пусть это будет уроком на будущее»." }
  - { kind: pronunciation, text: "Сочетание au читается в два звука, «на-у», и ударение падает как раз на u: нау́ка." }
collocations:
  - { pl: "nauka języka", ru: "изучение языка" }
  - { pl: "nauki humanistyczne", ru: "гуманитарные науки" }
  - { pl: "dziedzina nauki", ru: "область науки" }
  - { pl: "królowa nauk", ru: "царица наук" }
etymology: "От uczyć «учить» с приставкой na-, из праславянского *na-uka. Русское «наука» собрано ровно из тех же частей."
memory: "nauka — и «наука», и «учёба»: nauki humanistyczne «гуманитарные науки», но nauka angielskiego «изучение английского». Управление родительным: nauka języka. Есть и третье значение, «урок, поучение»."
idioms:
  - { pl: "nauki humanistyczne", ru: "гуманитарные науки" }
  - { pl: "królowa nauk", ru: "царица наук" }
  - { pl: "nauka języka", ru: "изучение языка" }
formExamplesSkip:
  - { form: "nauko", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
