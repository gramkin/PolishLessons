notes:
  - { kind: usage, text: "Женский род на -ość, как wolność и rzeczywistość. Родительный, дательный и предложный совпадают — sprawiedliwości." }
  - { kind: false-friend, text: "Одно слово на два русских: и «справедливость», и «правосудие». Отдельного слова для второго в польском нет: Ministerstwo Sprawiedliwości — это «Министерство юстиции»." }
  - { kind: usage, text: "wymierzyć sprawiedliwość — «вершить правосудие», oddać komuś sprawiedliwość — «отдать кому-то должное»." }
  - { kind: usage, text: "От sprawiedliwy «справедливый», в основе sprawa «дело»." }
collocations:
  - { pl: "sprawiedliwość społeczna", ru: "социальная справедливость" }
  - { pl: "poczucie sprawiedliwości", ru: "чувство справедливости" }
  - { pl: "wymierzyć sprawiedliwość", ru: "вершить правосудие" }
etymology: "От sprawiedliwy «справедливый», в основе sprawa «дело» и корень *pravъ «правый». Русская «справедливость» собрана из тех же частей — «с-» плюс «правда»."
memory: "sprawiedliwość — и «справедливость», и «правосудие»: отдельного слова для второго в польском нет. Женский род на -ość: bez sprawiedliwości. Ministerstwo Sprawiedliwości — это «Министерство юстиции»."
idioms:
