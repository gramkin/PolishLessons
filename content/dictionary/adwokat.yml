# review
id: adwokat
format: 2
lemma: "adwokat"
rank: 1453
pos: noun
pron: { cyr: "адво́кат" }
senses:
  - id: lawyer
    ru: "адвокат, защитник в суде"
    examples:
      - pl: "Jego syn chce zostać adwokatem."
        ru: "Его сын хочет быть адвокатом."
        source: { kind: tatoeba, id: 3621790 }
      - pl: "Tom to mój adwokat."
        ru: "Том — мой адвокат."
        source: { kind: translated, id: 3996295 }
      - pl: "Chcę adwokata."
        ru: "Я хочу адвоката."
        source: { kind: translated, id: 2685134 }
  - id: advocate
    ru: "защитник, сторонник (чьего-либо дела)"
    examples:
      - pl: "Jim nie jest adwokatem, ale lekarzem."
        ru: "Йим не адвокат, а врач."
        source: { kind: tatoeba, id: 356867 }
      - pl: "Był adwokatem tej sprawy."
        ru: "Он был защитником этого дела."
        source: { kind: authored }
notes:
  - { kind: government, text: "В именной части сказуемого творительный: Jestem adwokatem «Я адвокат», zostać adwokatem «стать адвокатом»." }
  - { kind: usage, text: "Мужской одушевлённый, поэтому винительный совпадает с родительным: chcę adwokata." }
  - { kind: usage, text: "Синоним prawnik «юрист» шире: adwokat — именно тот, кто ведёт дела в суде." }
  - { kind: false-friend, text: "Ещё одно значение слова — яичный ликёр (как нидерландский advocaat): в магазине likier adwokat стоит среди напитков, а не среди юристов." }
collocations:
  - { pl: "wynająć adwokata", ru: "нанять адвоката" }
  - { pl: "zostać adwokatem", ru: "стать адвокатом" }
  - { pl: "adwokat diabła", ru: "адвокат дьявола" }
etymology: "Из латинского advocatus «призванный на помощь» через немецкий. Русское «адвокат» пришло тем же путём, поэтому слова совпадают полностью."
memory: "adwokat — «адвокат», слово то же самое. Творительный после być и zostać: Jestem adwokatem, chcę zostać adwokatem. И любопытная мелочь: adwokat в магазине — это яичный ликёр."
idioms:
  - { pl: "adwokat diabła", ru: "адвокат дьявола" }
  - { pl: "wynająć adwokata", ru: "нанять адвоката" }
  - { pl: "zostać adwokatem", ru: "стать адвокатом" }
formExamplesSkip:
  - { form: "adwokacie", reason: "звательная форма и предложный падеж, в корпусе примеров нет" }
