# review
id: wsadzic
format: 2
lemma: "wsadzić"
rank: 1833
pos: verb
aspect: perf
pron: { cyr: "фса́дзиць" }
senses:
  - id: put-in
    ru: "сунуть, положить, засунуть"
    examples:
      - pl: "Wsadziła klucz do kieszeni."
        ru: "Она сунула ключ в карман."
        source: { kind: translated, id: 366056 }
      - pl: "Wsadził słomkę w mrowisko."
        ru: "Он сунул соломинку в муравейник."
        source: { kind: translated, id: 4020176 }
      - pl: "Tom wsadził swój pistolet pod poduszkę."
        ru: "Том сунул свой пистолет под подушку."
        source: { kind: translated, id: 6391727 }
  - id: put-in-prison
    ru: "посадить (в тюрьму)"
    examples:
      - pl: "Powinno się go wsadzić do więzienia."
        ru: "Его следовало бы посадить в тюрьму."
        source: { kind: translated, id: 8108697 }
      - pl: "Mówi, że jest niewinny, ale wsadzili go do więzienia."
        ru: "Он говорит, что невиновен, но его посадили в тюрьму."
        source: { kind: translated, id: 6321726 }
      - pl: "Policja wsadzi cię za kraty."
        ru: "Полиция посадит тебя за решётку."
        source: { kind: translated, id: 919869 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — wsadzać. Слово разговорное: нейтральнее сказать włożyć «вложить, положить»." }
  - { kind: government, text: "Сунуть во что-то — wsadzić coś do czegoś (родительный с do): wsadziła klucz do kieszeni." }
  - { kind: usage, text: "wsadzić do więzienia — «посадить в тюрьму»; wsadzić za kratki — «посадить за решётку»." }
  - { kind: register, text: "Оборот Wsadź to sobie! грубый и означает примерно «засунь это себе» — в вежливой речи его не употребляют." }
collocations:
  - { pl: "wsadzić do kieszeni", ru: "сунуть в карман" }
  - { pl: "wsadzić do więzienia", ru: "посадить в тюрьму" }
  - { pl: "wsadzić za kratki", ru: "посадить за решётку" }
family:
  - { pl: "wsadzać", ru: "засовывать", relation: root }
  - { pl: "włożyć", ru: "вложить, надеть", relation: root, id: wlozyc }
  - { pl: "więzienie", ru: "тюрьма", relation: root, id: wiezienie }
etymology: "Приставка w- «в-» плюс sadzić «сажать», того же корня, что siedzieć «сидеть». Русское «всадить» — то же слово, но значение разошлось."
memory: "wsadzić — разговорное «сунуть, засунуть»: wsadziła klucz do kieszeni. И «посадить в тюрьму»: wsadzić do więzienia. Нейтральнее — włożyć."
