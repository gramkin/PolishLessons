# review
id: wojna
format: 2
lemma: "wojna"
rank: 420
pos: noun
pron: { cyr: "во́йна" }
senses:
  - id: war
    ru: "война"
    examples:
      - pl: "Wojna trwała cztery lata."
        ru: "Война продолжалась четыре года."
        source: { kind: tatoeba, id: 3373931 }
      - pl: "Wojna nie jest nieunikniona."
        ru: "Война не является неизбежностью."
        source: { kind: tatoeba, id: 365105 }
      - pl: "Wojna weszła w końcową fazę."
        ru: "Война вступила в завершающую стадию."
        source: { kind: tatoeba, id: 364910 }
  - id: war-suffering
    ru: "война как бедствие"
    examples:
      - pl: "Ludzie boją się wojny."
        ru: "Люди боятся войны."
        source: { kind: tatoeba, id: 3064084 }
      - pl: "Nasz syn zginął na wojnie."
        ru: "Наш сын погиб на войне."
        source: { kind: tatoeba, id: 364730 }
      - pl: "Wiele ludzi zginęło na wojnie."
        ru: "Много людей погибло на войне."
        source: { kind: tatoeba, id: 12564176 }
notes:
  - { kind: usage, text: "na wojnie — «на войне», na wojnę — «на войну»: Zginął na wojnie «Погиб на войне»." }
  - { kind: usage, text: "wojna domowa — «гражданская война», zimna wojna — «холодная война», wojna nerwów — «война нервов»." }
  - { kind: usage, text: "Родительный падеж множественного числа — wojen, с беглым e: wojna → wojen, ровно как «война → войн»." }
  - { kind: false-friend, text: "Не путайте wojna «война» с wojsko «войско, армия» и wojak «вояка» — слова одного гнезда, но не взаимозаменяемы." }
collocations:
  - { pl: "wojna domowa", ru: "гражданская война" }
  - { pl: "zimna wojna", ru: "холодная война" }
  - { pl: "na wojnie", ru: "на войне" }
  - { pl: "wypowiedzieć wojnę", ru: "объявить войну" }
etymology: "Праславянское *vojьna от *vojь «воин»; русское «война» — то же самое слово."
memory: "wojna — «война», слово буква в букву русское. Запомните беглое e в родительном множественного: wojna → wojen. И два готовых оборота: wojna domowa «гражданская война», zimna wojna «холодная война»."
idioms:
  - { pl: "wojna domowa", ru: "гражданская война" }
  - { pl: "zimna wojna", ru: "холодная война" }
  - { pl: "wojna nerwów", ru: "война нервов" }
