# review
id: spiewac
format: 2
lemma: "śpiewać"
rank: 1158
pos: verb
aspect: imperf
pron: { cyr: "сьпе́ваць" }
senses:
  - id: sing
    ru: "петь"
    examples:
      - pl: "Lubisz śpiewać?"
        ru: "Тебе нравится петь?"
        source: { kind: tatoeba, id: 531870 }
      - pl: "Czy chcesz śpiewać?"
        ru: "Ты хочешь петь?"
        source: { kind: tatoeba, id: 4735562 }
      - pl: "Tom śpiewa."
        ru: "Том поёт."
        source: { kind: translated, id: 8745354 }
  - id: birds
    ru: "петь (о птицах, цикадах)"
    examples:
      - pl: "Ptaki śpiewają."
        ru: "Птицы поют."
        source: { kind: tatoeba, id: 547698 }
      - pl: "Śpiewają cykady."
        ru: "Поют цикады."
        source: { kind: tatoeba, id: 6313637 }
  - id: imperative
    ru: "śpiewaj — пой"
    examples:
      - pl: "Śpiewaj."
        ru: "Пой."
        source: { kind: tatoeba, id: 13782640 }
      - pl: "Śpiewaj z nami."
        ru: "Пой с нами."
        source: { kind: tatoeba, id: 9671452 }
notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — zaśpiewać «спеть». Глагол обычный, без się." }
  - { kind: government, text: "śpiewać coś — винительный: śpiewać piosenkę «петь песню». О языке — с предлогом po: śpiewać po polsku «петь по-польски»." }
  - { kind: usage, text: "О птицах и насекомых глагол тот же, что о людях: Ptaki śpiewają «Птицы поют», Cykady śpiewają «Цикады поют»." }
  - { kind: usage, text: "В разговорной речи śpiewać значит ещё «выдавать сообщников на допросе» — как русское «петь, расколоться»." }
collocations:
  - { pl: "śpiewać piosenkę", ru: "петь песню" }
  - { pl: "śpiewać po polsku", ru: "петь по-польски" }
  - { pl: "ładnie śpiewać", ru: "красиво петь" }
family:
  - { pl: "zaśpiewać", ru: "спеть", relation: aspect }
  - { pl: "śpiew", ru: "пение", relation: root }
  - { pl: "piosenka", ru: "песня", relation: derived }
etymology: "Праславянское *pěvati, от *pěti «петь» — то же слово, что русское «петь» и «певать». Польская приставочная форма ś- здесь часть корня, а не приставка."
memory: "śpiewać — «петь», несовершенный вид; совершенный — zaśpiewać. О птицах говорят тем же словом: Ptaki śpiewają. А в разговоре śpiewać значит ещё «расколоться на допросе»."
idioms:
  - { pl: "śpiewać piosenkę", ru: "петь песню" }
  - { pl: "śpiewać po polsku", ru: "петь по-польски" }
formExamplesSkip:
  - { form: "śpiewani", reason: "мужско-личной страдательной формы у этого глагола не бывает: поют песню, гимн, колядку — вещь, а не человека. Остальные формы причастия в карточке есть с примерами: kolędy śpiewane po polsku, hymn śpiewany przed meczem. О человеке, которого воспевают, говорят другим словом — opiewany" }
