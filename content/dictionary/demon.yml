# review
id: demon
format: 2
lemma: "demon"
rank: 1481
pos: noun
pron: { cyr: "дэ́мон" }
senses:
  - id: demon
    ru: "демон, злой дух"
    examples:
      - pl: "Wygląda na to, że opętał ją zły demon."
        ru: "Похоже, ею овладел злой демон."
        source: { kind: translated, id: 1002990 }
      - pl: "Demony wyległy w poszukiwaniu ofiary."
        ru: "Демоны высыпали в поисках жертвы."
        source: { kind: translated, id: 2493641 }
      - pl: "Walczył z demonem."
        ru: "Он сражался с демоном."
        source: { kind: authored }
  - id: figurative
    ru: "демон в переносном смысле, разрушительная сила"
    examples:
      - pl: "Ten demon zniszczył Hiroszimę i Nagasaki."
        ru: "Этот демон уничтожил Хиросиму и Нагасаки."
        source: { kind: translated, id: 712466 }
      - pl: "Walczy z własnymi demonami."
        ru: "Он борется с собственными демонами."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Мужской одушевлённый: винительный совпадает с родительным — widzę demona." }
  - { kind: usage, text: "Рядом стоят anioł «ангел» и diabeł «чёрт», обе карточки уже есть: demon книжнее и шире, diabeł ближе к народной речи." }
  - { kind: usage, text: "Переносно — о разрушительной силе: demony wojny «демоны войны», walczyć z własnymi demonami «бороться с собственными демонами»." }
  - { kind: usage, text: "В информатике demon значит «служба, фоновая программа», как английское daemon." }
collocations:
  - { pl: "zły demon", ru: "злой демон" }
  - { pl: "demony przeszłości", ru: "демоны прошлого" }
  - { pl: "walczyć z demonami", ru: "бороться с демонами" }
etymology: "Через латинское daemon из греческого δαίμων «божество, дух». Русский «демон» пришёл тем же путём, поэтому слова совпадают."
memory: "demon — «демон», слово международное. Одушевлённое: widzę demona. Рядом стоят anioł «ангел» и diabeł «чёрт»: demon книжнее, diabeł ближе к разговорной речи."
idioms:
  - { pl: "walczyć z własnymi demonami", ru: "бороться с собственными демонами" }
  - { pl: "demony przeszłości", ru: "демоны прошлого" }
  - { pl: "zły demon", ru: "злой демон" }
