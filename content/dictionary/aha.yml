pos: part
pron: { cyr: "аха́" }
senses:
  - id: understanding
    ru: "ага, понятно"
    examples:
      - pl: "Aha, teraz rozumiem."
        ru: "Ага, теперь понимаю."
        source: { kind: authored }
      - pl: "Aha, to dlatego się spóźniłeś."
        ru: "Ага, так вот почему ты опоздал."
        source: { kind: authored }
  - id: recall
    ru: "а, вспомнил"
    examples:
      - pl: "Aha, miałem ci coś powiedzieć."
        ru: "А, я ведь хотел тебе кое-что сказать."
        source: { kind: authored }
      - pl: "Aha, i nie zapomnij o kluczach."
        ru: "Ах да, и не забудь про ключи."
