  - { pl: "tak", ru: "да", relation: root, id: tak }
etymology: "Естественное восклицание, какие возникают в языках независимо друг от друга: тот же звук стоит за английским aha, немецким aha и русским «ага». Этимологии в обычном смысле у него нет — это не унаследованное слово, а закреплённый на письме вздох понимания."
memory: "aha — «ага», совпадает с русским полностью: и по смыслу, и по трём употреблениям, и по тому, что отвечать им вместо tak «да» невежливо. Не изменяется, стоит отдельно."
idioms:
