notes:
  - { kind: false-friend, text: "РЕДКИЙ СЛУЧАЙ ПОЛНОГО СОВПАДЕНИЯ — И ТОТ ЖЕ ПОДВОХ В РЕГИСТРЕ. Польское aha значит ровно то же, что русское «ага», и употребляется так же: понимание, внезапное воспоминание, торжество. И так же, как в русском, отвечать им вместо tak «да» невежливо: на вопрос начальника или незнакомого человека aha звучит небрежно." }
  - { kind: usage, text: "Три употребления различает только интонация. Понимание — ровное, протяжное: aha, rozumiem. Воспоминание — короткое, с подъёмом, часто с i: aha, i jeszcze jedno. Торжество — резкое: aha! Słowo не изменяется и в предложение не входит, отделяется запятой." }
  - { kind: register, text: "Разговорное. В письме встречается только в диалогах и в переписке между своими. Вежливое согласие — tak, oczywiście, w porządku. Ещё мягче прозвучит ach так или no tak." }
  - { kind: pronunciation, text: "Два слога, ударение на втором: a-HA. Польское h здесь произносится ясно, с лёгким придыханием: «аха́». В значении торжества первый слог растягивают: «а-а-ха́»." }
collocations:
  - { pl: "aha, rozumiem", ru: "ага, понимаю" }
  - { pl: "aha, właśnie", ru: "ага, вот именно" }
  - { pl: "aha, i jeszcze jedno", ru: "ах да, и ещё одно" }
family:
