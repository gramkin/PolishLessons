# review
id: skoro
format: 2
lemma: "skoro"
rank: 409
pos: adv
pron: { cyr: "ско́ро" }
senses:
  - id: since
    ru: "раз, раз уж, поскольку"
    examples:
      - pl: "Skoro tak mówisz..."
        ru: "Раз ты так говоришь..."
        source: { kind: translated, id: 357977 }
      - pl: "Skoro już tu jesteś, pomóż."
        ru: "Раз уж ты здесь, помоги."
        source: { kind: authored }
      - pl: "Skoro nie chcesz, nie musisz."
        ru: "Раз не хочешь, не надо."
        source: { kind: authored }
  - id: as-soon-as
    ru: "как только (в застывших оборотах)"
    examples:
      - pl: "Skoro świt ruszyli w drogę."
        ru: "Чуть свет они двинулись в путь."
        source: { kind: authored }
      - pl: "Wstał skoro świt."
        ru: "Он встал чуть свет."
        source: { kind: authored }
      - pl: "Skoro tylko wrócisz, zadzwoń."
        ru: "Как только вернёшься, позвони."
        source: { kind: authored }
notes:
  - { kind: usage, text: "skoro вводит причину, уже известную обоим собеседникам: «раз уж, коль скоро». Skoro tak mówisz «Раз ты так говоришь»." }
  - { kind: usage, text: "Отличие от ponieważ «потому что»: ponieważ сообщает новую причину, skoro опирается на то, что уже сказано." }
  - { kind: false-friend, text: "Выглядит как русское «скоро», но значит другое. Общий предок — skory «скорый»; значение ушло от «быстро» к «раз уж»." }
  - { kind: false-friend, text: "Формы skorzej и najskorzej принадлежат не этому союзу, а отдельному прилагательному skory «скорый, охочий»: skory do pomocy «охотно помогающий»." }
collocations:
  - { pl: "skoro tak", ru: "раз так" }
  - { pl: "skoro świt", ru: "чуть свет" }
  - { pl: "skoro już", ru: "раз уж" }
etymology: "От skory «скорый», праславянское *skorъ — то же слово, что русское «скоро». Значение ушло от «быстро» к «раз уж», а старое сохранилось только в обороте skoro świt."
memory: "skoro выглядит как русское «скоро», но значит «раз уж, поскольку» — это классическая ловушка. Старое значение осталось в застывшем skoro świt «чуть свет»."
idioms:
  - { pl: "skoro świt", ru: "чуть свет" }
  - { pl: "skoro tak", ru: "раз так" }
  - { pl: "skoro już o tym mowa", ru: "раз уж об этом зашла речь" }
formExamplesSkip:
