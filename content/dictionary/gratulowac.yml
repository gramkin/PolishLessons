# review
id: gratulowac
format: 2
lemma: "gratulować"
rank: 2175
pos: verb
pron: { cyr: "гратуло́ваць" }
senses:
  - id: congratulate
    ru: "поздравлять"
    examples:
      - pl: "Gratuluję ci zwycięstwa!"
        ru: "Поздравляю тебя с победой!"
        source: { kind: authored }
      - pl: "Wszyscy gratulowali jej awansu."
        ru: "Все поздравляли её с повышением."
        source: { kind: authored }
      - pl: "Przyszli gratulować młodej parze."
        ru: "Они пришли поздравить молодожёнов."
        source: { kind: authored }
  - id: formula
    ru: "формула поздравления"
    examples:
      - pl: "Gratuluję, świetna robota!"
        ru: "Поздравляю, отличная работа!"
        source: { kind: authored }
      - pl: "Nie gratuluj przed czasem."
        ru: "Не поздравляй раньше времени."
        source: { kind: authored }
notes:
  - { kind: government, text: "ГЛАВНОЕ НА ЭТОЙ КАРТОЧКЕ — ПАДЕЖИ, И ОНИ СОВСЕМ ДРУГИЕ. Поздравляют КОМУ, дательный, а не винительный: gratuluję CI, gratulujemy WAM, но никак не «gratuluję ciebie». И с чем — родительный БЕЗ ПРЕДЛОГА: gratuluję ci ZWYCIĘSTWA, gratuluję wam NOWEGO DOMU. Русская модель «поздравляю тебя С победой», винительный плюс предлог с творительным, не работает ни в одной своей части. Запоминать надо формулу целиком: gratulować komuś czegoś." }
  - { kind: usage, text: "СТРАДАТЕЛЬНОГО ПРИЧАСТИЯ НЕТ, И ЭТО ЗАКОНОМЕРНО. Винительного дополнения у глагола нет вовсе — он управляет дательным и родительным, — а в подлежащее можно повысить только винительный. Поэтому формы gratulowany не существует, хотя действительное gratulujący есть. То же правило уже встречалось у podróżować и znikać, только там дополнение пряталось в предлоге, а здесь стоит в дательном." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: gra-tu-LO-wać, «гратуло́ваць». Настоящее время по знакомому правилу -ować: gratuluję, gratulujesz — тот же ряд, что pracuję и zaakceptuję." }
  - { kind: false-friend, text: "Прозрачного русского родственника нет: «поздравлять» построено от «здравия», совсем другой корень. Польское слово пришло из латыни, от gratulari «изъявлять радость», и роднится с «грацией» и английским congratulations. Существительное gratulacje «поздравления» отзывается в русском разве что устаревшими «гратуляциями»." }
collocations:
  - { pl: "gratulować sukcesu", ru: "поздравлять с успехом" }
  - { pl: "gratulować zwycięstwa", ru: "поздравлять с победой" }
  - { pl: "składać gratulacje", ru: "приносить поздравления" }
family:
  - { pl: "gratulacje", ru: "поздравления", relation: derived, id: gratulacje }
  - { pl: "gratulacyjny", ru: "поздравительный", relation: derived }
etymology: "Из латинского gratulari «изъявлять радость, поздравлять», от gratus «приятный, угодный» — того же корня, что «грация» и «грант». Русское «поздравлять» построено совершенно иначе, от «здравия», так что опереться на родство нельзя. Отсюда gratulacje «поздравления» и gratulacyjny."
memory: "gratulować — «поздравлять», и учить надо не значение, а падежи: gratulować KOMUŚ CZEGOŚ, дательный плюс родительный без предлога. Gratuluję ci zwycięstwa, а не «поздравляю тебя с победой». Страдательного причастия у глагола нет: винительного дополнения просто неоткуда взять."
idioms:
  - { pl: "gratulacje!", ru: "поздравляю!" }
  - { pl: "gratulować komuś sukcesu", ru: "поздравлять кого-л. с успехом" }
