notes:
  - { kind: false-friend, text: "ДВА ЯЗЫКА СОБРАЛИ СЛОВО ОТ РАЗНЫХ ГЛАГОЛОВ. Польская wymówka — от wymówić «выговорить, высказать», то есть то, что произносят в своё оправдание. Русская «отговорка» — от «отговорить», то есть то, чем отговариваются. Поэтому похожее русское «вымолвить» значит просто «произнести» и к отговоркам отношения не имеет." }
  - { kind: usage, text: "Второе значение — «упрёк», и оно живёт в обороте ROBIĆ KOMUŚ WYMÓWKI «попрекать кого-то». Не путай с WYMÓWIENIE: это уведомление об увольнении, dać komuś wymówienie — «дать расчёт». Дательный и предложный — WYMÓWCE, с k→c, а родительный множественного — WYMÓWEK, с беглым e." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: wy-MÓW-ka. Ó читается как у, а w перед глухим k оглушается до ф: «вымуфка». Форма wymówce звучит «вымуфцэ»." }
collocations:
  - { pl: "szukać wymówek", ru: "искать отговорки" }
  - { pl: "robić wymówki", ru: "попрекать" }
  - { pl: "zgrabna wymówka", ru: "ловкая отговорка" }
family:
  - { pl: "wymówić", ru: "выговорить, произнести", relation: root }
  - { pl: "mówić", ru: "говорить", relation: root, id: mowic }
  - { pl: "powód", ru: "причина", relation: root, id: powod }
etymology: "От wymówić «выговорить, высказать», от mówić «говорить». Русское «отговорка» построено от другого глагола — «отговорить», — потому слова и не совпали. Корень mów- тот же, что в русском «молвить» и «вымолвить», только значение там осталось при произнесении."
memory: "wymówka — «отговорка», от wymówić «выговорить»: то, что говорят в своё оправдание. Второе значение — «упрёк»: robić komuś wymówki. Формы с чередованиями: wymówce и wymówek."
idioms:
  - { pl: "szukać wymówek", ru: "искать отговорки" }
  - { pl: "robić komuś wymówki", ru: "попрекать кого-л." }
