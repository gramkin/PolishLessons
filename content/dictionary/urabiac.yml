# review
id: urabiac
format: 2
lemma: "urabiać"
rank: 2129
pos: verb
aspect: imperf
pron: { cyr: "ура́бяць" }
senses:
  - id: mould
    ru: "формовать, разминать (глину, тесто)"
    examples:
      - pl: "Urabia glinę na kole garncarskim."
        ru: "Он формует глину на гончарном круге."
        source: { kind: authored }
      - pl: "Urabiamy ciasto rękami."
        ru: "Мы разминаем тесто руками."
        source: { kind: authored }
      - pl: "Trzeba urabiać masę powoli."
        ru: "Массу нужно разминать медленно."
        source: { kind: authored }
  - id: shape-opinion
    ru: "обрабатывать, формировать (мнение)"
    examples:
      - pl: "Urabiam się po łokcie, by ci nic nie brakowało, niewdzięczny bachorze."
        ru: "Я вкалываю по локоть, чтобы тебе ничего не не хватало, неблагодарный."
        source: { kind: translated, id: 13781643 }
      - pl: "Prasa urabia opinię publiczną."
        ru: "Пресса формирует общественное мнение."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Буквально — мять и формовать материал. Переносно — «обрабатывать» человека или общественное мнение." }
  - { kind: government, text: "Винительный падеж: urabiać glinę, urabiać opinię." }
  - { kind: usage, text: "Оборот urabiać sobie ręce po łokcie «вкалывать до изнеможения» (буквально «стирать руки по локти») в корпусе встречается именно в этом виде." }
  - { kind: false-friend, text: "Корень robić «делать» — ср. русское «работать», «урабатываться». Совершенный вид — urobić." }
collocations:
  - { pl: "urabiać glinę", ru: "формовать глину" }
  - { pl: "urabiać opinię", ru: "формировать мнение" }
etymology: "u- + robić «делать»; ср. русское «работать», «урабатываться»."
memory: "urabiać — «формовать, разминать», а переносно «обрабатывать мнение». Корень robić «делать». Совершенный вид — urobić."
idioms:
  - { pl: "urabiać opinię", ru: "формировать мнение" }
  - { pl: "urabiać sobie ręce po łokcie", ru: "вкалывать до изнеможения" }
