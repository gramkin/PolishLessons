notes:
  - { kind: false-friend, text: "РУССКОЕ «ПОРАЖЕНИЕ» ПОКРЫВАЕТ ДВА ПОЛЬСКИХ СЛОВА. PORAŻKA это поражение в состязании и вообще неудача: porażka wyborcza, porażka życiowa. PORAŻENIE — это поражение в медицинском смысле: porażenie prądem «поражение током», porażenie mózgowe «церебральный паралич». Перепутать их значит сказать врачу о проигранном матче." }
  - { kind: pronunciation, text: "ДВА ЧЕРЕДОВАНИЯ, УЖЕ ЗНАКОМЫЕ ПО PACZKA. Дательный и предложный меняют k на c: po porażce. Родительный множественного вставляет беглое e: porażek. Так же ведут себя walizka — walizce — walizek и koszulka — koszulce — koszulek. Ż перед k оглушается: «пора́шка»." }
  - { kind: usage, text: "Поражение ПОТЕРПЕТЬ — ponieść porażkę, а не «dostać». Антоним — zwycięstwo «победа», от того же гнезда, что zwycięzca. В спорте счёт поражений ведут словом porażka, в политике говорят porażka wyborcza, а о замысле — fiasko или klapa, оба разговорнее." }
collocations:
  - { pl: "ponieść porażkę", ru: "потерпеть поражение" }
  - { pl: "porażka wyborcza", ru: "поражение на выборах" }
  - { pl: "uczyć się na porażkach", ru: "учиться на поражениях" }
family:
  - { pl: "porazić", ru: "поразить", relation: root }
  - { pl: "porażenie", ru: "поражение (мед.)", relation: derived }
  - { pl: "zwycięstwo", ru: "победа", relation: antonym, id: zwyciestwo }
etymology: "От porazić «поразить», от razić — того же корня, что русские «разить», «поразить», «поражение». Польский развёл два потомка одного глагола: porażka осталась при состязании, porażenie ушло в медицину. Русское «поражение» удержало оба смысла в одном слове."
memory: "porażka — «поражение, неудача», но только не медицинское: удар током это porażenie prądem. Потерпеть поражение — ponieść porażkę. Склонение как у paczka: po porażce, bez porażek."
idioms:
  - { pl: "ponieść porażkę", ru: "потерпеть поражение" }
  - { pl: "porażka wyborcza", ru: "поражение на выборах" }
