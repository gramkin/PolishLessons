# review
id: zawolac
format: 2
lemma: "zawołać"
rank: 2386
pos: verb
aspect: perf
pron: { cyr: "заво́уаць" }
senses:
  - id: call-someone
    ru: "позвать, кликнуть"
    examples:
      - pl: "Możesz zawołać Toma?"
        ru: "Ты можешь позвать Тома?"
        source: { kind: tatoeba, id: 2405999 }
      - pl: "Przyjdzie jeśli go zawołasz."
        ru: "Он придёт, если ты его позовёшь."
        source: { kind: tatoeba, id: 3000040 }
      - pl: "Zawołaj go, proszę."
        ru: "Позови его, пожалуйста."
        source: { kind: translated, id: 2244489 }
  - id: exclaim
    ru: "воскликнуть, крикнуть"
    examples:
      - pl: "Zawołał głośno o pomoc."
        ru: "Он громко позвал на помощь."
        source: { kind: translated, id: 921623 }
      - pl: "Usłyszałem, jak ktoś zawołał mnie po imieniu."
        ru: "Я услышал, как кто-то позвал меня по имени."
        source: { kind: translated, id: 1148061 }
notes:
  - { kind: government, text: "Винительный падеж: zawołać Toma. Позвать на помощь — zawołać o pomoc, с предлогом o и винительным — не «на», как в русском." }
  - { kind: false-friend, text: "za- + wołać «звать», корень тот же, что в русском «волать», «воззвать». Современное русское «звать» — другого корня, поэтому родство не на слуху." }
  - { kind: usage, text: "В повествовании zawołał значит «воскликнул»: — Hej! — zawołał gospodarz." }
  - { kind: usage, text: "Несовершенный вид — wołać. Не путайте с zawołany «заправский, завзятый»: zawołany myśliwy «заядлый охотник»." }
collocations:
  - { pl: "zawołać kogoś", ru: "позвать кого-л." }
  - { pl: "zawołać o pomoc", ru: "позвать на помощь" }
etymology: "za- + wołać «звать»; корень тот же, что в русском «воззвать», «волать»."
memory: "zawołać — «позвать» и «воскликнуть». Позвать на помощь — zawołać O pomoc, с предлогом o. Несовершенный вид — wołać."
idioms:
  - { pl: "zawołać kogoś", ru: "позвать кого-л." }
  - { pl: "zawołać o pomoc", ru: "позвать на помощь" }
