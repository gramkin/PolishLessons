# review
id: dostrzec
format: 2
lemma: "dostrzec"
rank: 2019
pos: verb
aspect: perf
pron: { cyr: "до́стшэц" }
senses:
  - id: notice
    ru: "заметить, разглядеть"
    examples:
      - pl: "Gołym okiem można dostrzec około 5 tysięcy gwiazd."
        ru: "Невооружённым глазом можно разглядеть около пяти тысяч звёзд."
        source: { kind: translated, id: 982928 }
      - pl: "Mężczyzna, którego potajemnie kochałem, nawet mnie nie dostrzegł."
        ru: "Мужчина, которого я тайно любила, меня даже не заметил."
        source: { kind: translated, id: 11267752 }
      - pl: "Nie dostrzegłem jego podstępu."
        ru: "Я не заметил его хитрости."
        source: { kind: translated, id: 365310 }
  - id: discern
    ru: "различить, подметить"
    examples:
      - pl: "Możemy jasno dostrzec cykl pór roku w Kanadzie."
        ru: "Мы можем ясно различить смену времён года в Канаде."
        source: { kind: translated, id: 3887801 }
      - pl: "Z łatwością dostrzeżesz różnicę."
        ru: "Ты с лёгкостью заметишь разницу."
        source: { kind: translated, id: 2680404 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — dostrzegać." }
  - { kind: usage, text: "Сильнее, чем zobaczyć «увидеть»: подразумевает усилие или внимательность — «разглядеть, подметить»." }
  - { kind: government, text: "Прямое дополнение в винительном падеже: dostrzec różnicę «заметить разницу»." }
  - { kind: false-friend, text: "Корень strzec «стеречь, оберегать» — то же, что русское «стеречь», «настороже»." }
collocations:
  - { pl: "dostrzec różnicę", ru: "заметить разницу" }
  - { pl: "dostrzec szansę", ru: "увидеть шанс" }
etymology: "do- + strzec «стеречь, смотреть»; ср. русское «стеречь», «настороже», «острог»."
memory: "dostrzec — «заметить, разглядеть», сильнее чем zobaczyć: нужно усилие или внимательность. Несовершенный вид — dostrzegać."
idioms:
  - { pl: "dostrzec różnicę", ru: "заметить разницу" }
