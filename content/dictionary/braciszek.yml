notes:
  - { kind: usage, text: "Именительный множественного у этого слова — BRACISZKOWIE, с окончанием -OWIE, а не «braciszki». Окончание -OWIE польский даёт названиям родства и лицам, к которым относятся с уважением: OJCOWIE «отцы», WUJOWIE «дяди», PROFESOROWIE, AMBASADOROWIE. Для русского это неожиданно, потому что в русском такого отдельного окончания нет. Второе: суффикс -EK несёт беглую гласную, которая выпадает во всех формах, кроме именительного и винительного единственного: BRACISZEK, но BRACISZKA, BRACISZKOWI, BRACISZKIEM. Третье: в основе T исходного BRAT смягчается в CI, отсюда BRACISZEK, а не «bratiszek»." }
  - { kind: false-friend, text: "Соответствие с русским «братишкой» полное и по смыслу, и по способу образования: уменьшительный суффикс плюс корень. Но в основе происходит чередование, которого в русском нет: BRAT при уменьшении даёт BRACISZEK, с переходом T в CI, и то же видно в BRACIA «братья» — именно так, не «braty». Множественное BRACIA, кстати, тоже особенное: оно женского рода по форме и согласуется как единственное собирательное. Второе значение, монашеское, в обоих языках одинаково: BRACISZEK ZAKONNY это «брат-монах», и обращение BRACISZKU отвечает русскому «брат» или «братец»." }
  - { kind: government, text: "Мужской род, одушевлённое, лицо. Винительный равен родительному: WIDZIAŁ BRACISZKA. Звательный BRACISZKU употребляется и в семье, и в монастыре. Чей братишка — родительный или притяжательное: BRACISZEK SĄSIADKI, MÓJ BRACISZEK. Частотные сочетания: MŁODSZY BRACISZEK «младший братишка», BRACISZEK ZAKONNY «брат-монах», OPIEKOWAĆ SIĘ BRACISZKIEM «заботиться о братишке» — требует творительного, тогда как по-русски нужен предлог «о» с предложным." }
  - { kind: pronunciation, text: "Читается «браци́шэк», три слога, ударение на предпоследнем. Сочетание CI даёт мягкий согласный, близкий к русскому «ць», а следующий за ним гласный слышится как «и». Сочетание SZ это «ш», E даёт «э». В родительном BRACISZKA беглая гласная выпадает: «браци́шка». В именительном множественного BRACISZKOWIE слогов четыре, ударение на предпоследнем: «брацишко́ве»." }
