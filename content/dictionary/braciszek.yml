etymology: "Двойное уменьшительное от BRAT, из праславянского *bratrъ, того же слова, что русский «брат». Образовано оно в два приема: сначала BRACISZ с мягким окончанием, затем -EK, и потому ласкательность в нём сильнее, чем в простом BRATEK, которое к тому же занято — BRATEK по-польски значит «фиалка трёхцветная», садовое растение. Смягчение T в CI перед передним гласным — древнее славянское чередование, то же, что в BRACIA «братья» и в русском «братия», где оно тоже есть. Окончание -OWIE в именительном множественного восходит к старому двойственному числу и сохранилось в польском именно у названий родства и уважаемых лиц; русский этот след утратил, выровняв все такие слова по общему типу."
memory: "Именительный множественного — braciszkowie, на -owie: это окончание польский даёт родству и уважаемым лицам (ojcowie, wujowie, profesorowie), а в русском такого нет. Беглая e выпадает: braciszek, но braciszka, braciszkiem. В основе t смягчается в ci: braciszek, как bracia «братья». И осторожно: bratek — это не братец, а фиалка трёхцветная."
idioms:
