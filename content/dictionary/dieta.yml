notes:
  - { kind: false-friend, text: "DIETA — не только «диета», но и «суточные» в командировке: DIETA ZA DELEGACJĘ. DIETA POSELSKA — выплата депутату на расходы. По контексту понятно, о питании речь или о деньгах." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже T переходит в C: NA DIECIE. Родительный множественного — DIET. Звательный не даётся." }
  - { kind: government, text: "Сидеть на диете — BYĆ NA DIECIE, NA с местным. Сесть на диету — PRZEJŚĆ NA DIETĘ, NA с винительным. Диета без соли — DIETA BEZ SOLI." }
  - { kind: pronunciation, text: "Читается «дье́та», ударение на первом слоге: DIE — один слог «дье»." }
collocations:
  - { pl: "być na diecie", ru: "сидеть на диете" }
  - { pl: "zdrowa dieta", ru: "здоровое питание" }
  - { pl: "dieta poselska", ru: "депутатское содержание" }
family:
  - { pl: "dietetyk", ru: "диетолог", relation: derived }
  - { pl: "dietetyczny", ru: "диетический", relation: derived }
  - { pl: "dietetyka", ru: "диетология", relation: derived }
etymology: "Из греческого слова со значением «образ жизни». Значение «суточные» пришло через латынь, где тем же словом называли дневное содержание."
memory: "Dieta — диета и суточные. Читается «дье́та». Być na diecie — сидеть на диете. Dieta za delegację — командировочные."
idioms:
