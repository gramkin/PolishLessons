notes:
  - { kind: usage, text: "Самое важное: видовая пара здесь СУППЛЕТИВНАЯ — несовершенный kłaść, но совершенный położyć, от другого корня. Русский устроен точно так же: «класть», но «положить». Это тот редкий случай, когда польская и русская неправильность совпадают до буквы, и запомнить её можно одним движением." }
  - { kind: government, text: "kłaść coś gdzieś — ВИНИТЕЛЬНЫЙ падеж плюс обстоятельство места: kłaść klucze na stole. Дополнением бывает и человек, когда его укладывают: kłaść dziecko do łóżka. Поэтому мужсколичное причастие kładzeni работает: ranni byli kładzeni na noszach." }
  - { kind: pronunciation, text: "Начальное kł произносится слитно: [куасьць]. В настоящем времени появляется dz — kładę, но kładziesz, kładzie, kładziemy; в повелительном наклонении мягкое ź: kładź, kładźmy, kładźcie." }
  - { kind: false-friend, text: "kłaść — прямой родственник русского «класть», и основное значение совпадает. Но возвратное kłaść się значит «ложиться» (kładę się spać «я ложусь спать»), тогда как русского «класться» не существует: там другой глагол, «ложиться»." }
collocations:
  - { pl: "kłaść nacisk na coś", ru: "делать упор на что-л." }
  - { pl: "kłaść dziecko spać", ru: "укладывать ребёнка спать" }
  - { pl: "kłaść płytki", ru: "класть плитку" }
family:
  - { pl: "położyć", ru: "положить", relation: aspect, id: polozyc }
  - { pl: "układać", ru: "укладывать", relation: derived }
  - { pl: "kłaść się", ru: "ложиться", relation: derived }
etymology: "Праславянское *klasti, от более раннего *kladti. Русское «класть» — прямой родственник, и так же, как в русском, совершенный вид берётся от другого корня: położyć, то есть «положить». Из того же гнезда układ «устройство, система» и pokład «палуба, пласт»."
memory: "kłaść — «класть», и пара к нему такая же неправильная, как в русском: kłaść / położyć, ровно как «класть» / «положить». В настоящем времени появляется dz: kładę, но kładziesz. А kłaść się значит «ложиться»."
idioms:
  - { pl: "kłaść nacisk na coś", ru: "делать упор на что-л." }
  - { pl: "kłaść się spać", ru: "ложиться спать" }
