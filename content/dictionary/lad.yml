notes:
  - { kind: false-friend, text: "Русскому уху LĄD ничего не подсказывает: связи с «ладом» или «ладонью» нет. Это «суша», противоположность морю: NA LĄDZIE I NA MORZU — «на суше и на море». А материк по отношению к острову называется STAŁY LĄD, буквально «постоянная суша». Слово «земля» в смысле «Земля!» с мачты по-польски тоже LĄD: ZIEMIA тут прозвучала бы как почва или планета." }
  - { kind: usage, text: "Мужской род, неодушевлённое, все десять форм живые. Множественное LĄDY значит «материки, континенты», чаще в книжной речи: STARE I NOWE LĄDY. В местном падеже D перед E смягчается в DZ: NA LĄDZIE. Родительный на -U: LĄDU, как у большинства неодушевлённых." }
  - { kind: government, text: "На суше — NA LĄDZIE, NA с местным. На сушу — NA LĄD, NA с винительным: ZEJŚĆ NA LĄD, «сойти на берег». С суши — Z LĄDU, Z с родительным. Над сушей — NAD LĄDEM, творительный." }
  - { kind: pronunciation, text: "Читается «лонт», один слог: Ą перед D звучит как «он», а конечная D оглушается в «т». В косвенных формах звонкость возвращается: LĄDU «ло́нду», LĄDEM «ло́ндэм», LĄDZIE «ло́ндзье». Ł тут нет, L обычная и перед гласной даёт «л»." }
  - { kind: register, text: "Нейтральное слово, но с морским и книжным оттенком: его слышно в географии, в новостях о шторме, в рассказах моряков. В быту поляк на пляже скажет скорее BRZEG, «берег»: WYJŚĆ NA BRZEG. Зато глагол LĄDOWAĆ, «приземляться», от того же корня, вполне повседневный." }
collocations:
  - { pl: "stały ląd", ru: "материк (в отличие от острова)" }
  - { pl: "na lądzie i na morzu", ru: "на суше и на море" }
  - { pl: "zejść na ląd", ru: "сойти на берег" }
family:
  - { pl: "lądować", ru: "приземляться, высаживаться", relation: derived, id: ladowac }
  - { pl: "lądowanie", ru: "посадка, приземление", relation: derived }
  - { pl: "lądowy", ru: "сухопутный, наземный", relation: derived }
etymology: "Праславянское *lędъ значило «необработанная, пустая земля», «целина». В русском это слово не сохранилось, но близкий корень есть в старом «ляда» — заросшая расчистка в лесу. Польский язык сузил смысл до «суши вообще», а потом произвёл от него LĄDOWAĆ, и слово, начинавшееся с пустоши, теперь звучит в каждом аэропорту."
memory: "Ląd — суша, земля, материк. Читается «лонт». Na lądzie — на суше, stały ląd — материк. Глагол lądować — приземляться: самолёт опускается на ląd."
idioms:
  - { pl: "stały ląd", ru: "материк, большая земля" }
  - { pl: "na lądzie, na morzu i w powietrzu", ru: "на суше, на море и в воздухе, то есть везде" }
formExamplesSkip:
