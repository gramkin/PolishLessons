etymology: "Из греческого RHYTHMOS «размеренное движение, течение», от RHEIN «течь», через латинское RHYTHMUS. Исходный образ — течение воды, размеренное и повторяющееся, и от него пошли и музыкальный ритм, и ритм стиха, и ритм сердца. Оба языка взяли слово из латыни учёных книг. Разошлось написание: греческое Y, то есть ипсилон, польский передаёт буквой Y, а русский буквой И, и это общее правило для всего греческого слоя — RYTM и «ритм», SYSTEM и «система», SYMBOL и «символ», TYP и «тип». В польском у этого правила есть и фонетическая причина: R в польском твёрдое, и сочетание RI в нём попросту не произносится."
memory: "Значение как у русского «ритма», а написание по правилу, которое открывает целый слой: польское r всегда твёрдое, сочетания ri не бывает, и потому там, где латынь дала ri, польский пишет ry — rytm, rytuał, ryzyko, rygor, rywal, rym против русских «ритм, ритуал, риск, ригор, риваль, рифма». Греческий ипсилон тоже даёт y: system, symbol, typ. Местный rytmie со смягчением m. Конец слова произносится слитно: «рытм», не «ритем»."
idioms:
  - { pl: "wpaść w rytm", ru: "войти в ритм" }
