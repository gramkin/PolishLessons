notes:
  - { kind: false-friend, text: "Значение совпадает с русским «ритмом» полностью, и расходится только написание — зато по правилу, которое стоит целого урока. Польское R всегда твёрдое, мягкого «рь» в языке нет вовсе, и потому сочетание RI невозможно: там, где латынь и греческий дали RI, польский пишет RY. Отсюда RYTM, RYTUAŁ, RYZYKO, RYGOR, RYWAL, RYM — а русский в этих же словах держит «ри»: «ритм», «ритуал», «риск», «ригор», «риваль», «рифма». Запомнив это, можно читать половину заимствований без словаря и, что важнее, не ошибаться в их написании." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — RYTMIE, со смягчением M в MI перед окончанием -E. Родительный единственного — RYTMU. Винительный равен именительному. Управление: RYTM CZEGO в родительном — RYTM SERCA, RYTM DNIA, RYTM WIERSZA. Устойчивое W RYTMIE CZEGOŚ с местным описывает движение под музыку: W RYTMIE WALCA. Отличать от TEMPO: RYTM это рисунок, чередование, а TEMPO — скорость, и в польском различие так же строго, как в русском." }
  - { kind: pronunciation, text: "Читается «рытм», один слог. Буква Y даёт «ы», и первый звук твёрдый — никакого «ри» здесь нет. Конечное сочетание TM произносится слитно, без вставного гласного; русскоязычному хочется сказать «ритем», и этого нужно избегать. В форме RYTMU слышно «ры́тму». В форме RYTMIE сочетание MIE даёт мягкое «ме»: «ры́тме». В форме RYTMÓW буква Ó читается как «у», а конечное W оглушается: «ры́тмуф»." }
  - { kind: register, text: "Слово нейтральное, одинаково уместное в музыке, в медицине и в разговоре о распорядке дня. Устойчивые сочетания: RYTM SERCA, RYTM DNIA, WPAŚĆ W RYTM «войти в ритм», WYBIJAĆ RYTM «отбивать ритм», ZABURZENIA RYTMU «нарушения ритма». Прилагательное RYTMICZNY значит «ритмичный»: GIMNASTYKA RYTMICZNA. В литературоведении RYTM противопоставлен METRUM, и школьный курс требует их различать, как и в русском." }
