id: gdy
format: 2
lemma: "gdy"
rank: 82
pos: adv
pron: { cyr: "гды" }
senses:
  - id: when
    ru: "когда (союз)"
    examples:
      - pl: "Lubię, gdy pada śnieg."
        ru: "Я люблю, когда идёт снег."
        source: { kind: tatoeba, id: 3452688 }
      - pl: "Gdy dorosnę, chcę uczyć historii."
        ru: "Когда я вырасту, хочу преподавать историю."
        source: { kind: tatoeba, id: 1352140 }
      - pl: "Zawsze gdy pada, dach przecieka."
        ru: "Каждый раз в дождь крыша течёт."
        source: { kind: tatoeba, id: 980216 }
  - id: whenever
    ru: "всякий раз когда"
    examples:
      - pl: "Poczuł ulgę, gdy jego matka zmarła."
        ru: "Он испытал облегчение, когда умерла его мать."
        source: { kind: tatoeba, id: 12333867 }
      - pl: "Gdy wrócisz, zadzwoń."
        ru: "Когда вернёшься, позвони."
        source: { kind: authored }
notes:
  - { kind: usage, text: "gdy — книжный вариант kiedy и в вопросе не употребляется: вопрос только Kiedy?" }
collocations:
  - { pl: "podczas gdy", ru: "в то время как" }
  - { pl: "gdy tylko", ru: "как только" }
etymology: "Старопольское kdy из k + dy; тот же корень, что в русском «когда» и польском kiedy."
memory: "gdy = «когда», но только в придаточном: вопрос задаётся через kiedy. Оборот podczas gdy значит «в то время как», а gdy tylko — «как только»."
idioms:
  - { pl: "gdy tylko", ru: "как только" }
  - { pl: "podczas gdy", ru: "в то время как" }
