# review
id: latwo
format: 2
lemma: "łatwo"
rank: 1113
pos: adv
pron: { cyr: "уа́тво" }
senses:
  - id: easily
    ru: "легко"
    examples:
      - pl: "Nie było łatwo."
        ru: "Было нелегко."
        source: { kind: translated, id: 2246933 }
      - pl: "Mleko łatwo kwaśnieje."
        ru: "Молоко легко прокисает."
        source: { kind: translated, id: 3033715 }
      - pl: "Łatwo jest się przeziębić."
        ru: "Простудиться легко."
        source: { kind: translated, id: 776366 }
  - id: easier
    ru: "łatwiej — легче"
    examples:
      - pl: "Łatwiej powiedzieć niż zrobić."
        ru: "Легче сказать, чем сделать."
        source: { kind: translated, id: 366710 }
      - pl: "Jest łatwiej niż myślałem."
        ru: "Это легче, чем я думал."
        source: { kind: translated, id: 859056 }
      - pl: "Bogatym łatwiej jest się wzbogacić."
        ru: "Богатым легче разбогатеть."
        source: { kind: translated, id: 6488476 }
  - id: easiest
    ru: "najłatwiej — легче всего"
    examples:
      - pl: "Drewniane domy najłatwiej płoną."
        ru: "Деревянные дома горят легче всего."
        source: { kind: translated, id: 1205276 }
      - pl: "Najłatwiej zacząć od początku."
        ru: "Легче всего начать с начала."
        source: { kind: authored }
      - pl: "Tak będzie najłatwiej."
        ru: "Так будет легче всего."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от łatwy «лёгкий». Все три ступени в ходу: łatwo, łatwiej, najłatwiej — в отличие от многих наречий, где степени не употребляются." }
  - { kind: usage, text: "Łatwiej powiedzieć niż zrobić — «легче сказать, чем сделать», полное соответствие русской поговорке." }
  - { kind: usage, text: "Безличная конструкция: łatwo jest się przeziębić «простудиться легко», łatwo mi to zrozumieć «мне это легко понять»." }
  - { kind: usage, text: "Начальное ł произносится как русское «у»: łatwo звучит примерно как «уа́тво»." }
collocations:
  - { pl: "łatwo powiedzieć", ru: "легко сказать" }
  - { pl: "nie było łatwo", ru: "было нелегко" }
  - { pl: "łatwiej niż", ru: "легче чем" }
  - { pl: "najłatwiej", ru: "легче всего" }
family:
  - { pl: "łatwy", ru: "лёгкий", relation: root, id: latwy }
  - { pl: "łatwość", ru: "лёгкость", relation: derived }
etymology: "Наречие от łatwy «лёгкий», праславянское *latvъ. Русское «лёгкий» идёт от другого корня, так что прямого родства здесь нет."
memory: "łatwo — «легко», и все три ступени в ходу: łatwo, łatwiej, najłatwiej. Запомните Łatwiej powiedzieć niż zrobić — «легче сказать, чем сделать». Начальное ł звучит как «у»."
idioms:
  - { pl: "łatwo powiedzieć", ru: "легко сказать" }
  - { pl: "łatwiej powiedzieć niż zrobić", ru: "легче сказать, чем сделать" }
  - { pl: "łatwo przyszło, łatwo poszło", ru: "легко пришло, легко ушло" }
