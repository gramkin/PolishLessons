# review
id: nosic
format: 2
lemma: "nosić"
rank: 616
pos: verb
aspect: imperf
pron: { cyr: "но́сиць" }
senses:
  - id: wear
    ru: "носить (одежду, очки) — постоянно, вообще"
    note: "О том, что надето сейчас, говорят mieć na sobie."
    examples:
      - pl: "On nosi okulary."
        ru: "Он носит очки."
        source: { kind: tatoeba, id: 351350 }
      - pl: "On nosi wełniany sweter."
        ru: "Он носит шерстяной свитер."
        source: { kind: tatoeba, id: 7969903 }
      - pl: "Nie noszę już okularów."
        ru: "Я больше не ношу очки."
        source: { kind: tatoeba, id: 351914 }
  - id: carry
    ru: "носить (многократно, в разные стороны)"
    note: "Парный к nieść «нести» — ровно как русская пара «носить / нести»."
    examples:
      - pl: "Najbezpieczniej jest nosić szelki."
        ru: "Безопаснее всего носить подтяжки."
        source: { kind: translated, id: 1366409 }
      - pl: "Zimą noś ciepłe ubrania."
        ru: "Зимой носи тёплую одежду."
        source: { kind: translated, id: 827728 }
      - pl: "Jesteśmy przyzwyczajeni do noszenia butów."
        ru: "Мы привыкли носить обувь."
        source: { kind: translated, id: 13342306 }
  - id: bear-name
    ru: "nosić imię, nazwisko — носить имя, фамилию"
    note: "Ulica nosi imię poety «Улица носит имя поэта»."
    examples:
      - pl: "Most nosi imię króla."
        ru: "Мост носит имя короля."
        source: { kind: authored }
      - pl: "Wnuczka nosi imię babki."
        ru: "Внучка носит имя бабушки."
        source: { kind: authored }
      - pl: "Miasto nosiło wtedy inną nazwę."
        ru: "Город носил тогда другое название."
        source: { kind: authored }
notes:
  - { kind: usage, text: "nosić — многократный глагол, парный к nieść «нести», и различаются они ровно как в русском: niosę książkę «несу книгу» (сейчас, в одну сторону), noszę okulary «ношу очки» (вообще, постоянно)." }
  - { kind: government, text: "Прямое дополнение в винительном: nosi okulary, nosi garnitur. При отрицании — родительный: nie noszę okularów «я не ношу очков»." }
  - { kind: false-friend, text: "On nosi okulary значит «он носит очки вообще». Если очки на нём прямо сейчас, поляк скажет ma na sobie или po prostu ma okulary — nosić для одного момента не годится." }
  - { kind: usage, text: "Причастия живые и частотные: noszący okulary «носящий очки», sukienka noszona w Bawarii «платье, которое носят в Баварии», noszone ubrania «ношеная одежда»." }
  - { kind: usage, text: "Отглагольное существительное — noszenie: przyzwyczajony do noszenia butów «привыкший носить обувь»." }
collocations:
  - { pl: "nosić okulary", ru: "носить очки" }
  - { pl: "nosić mundurek", ru: "носить школьную форму" }
  - { pl: "nosić imię", ru: "носить имя" }
  - { pl: "nosić na rękach", ru: "носить на руках" }
family:
  - { pl: "nieść", ru: "нести", relation: root }
  - { pl: "noszenie", ru: "ношение", relation: derived }
  - { pl: "nosiciel", ru: "носитель", relation: derived }
  - { pl: "przynosić", ru: "приносить", relation: derived }
etymology: "Праславянское *nositi — то же слово, что русское «носить». Пара nosić / nieść в точности повторяет русскую пару «носить / нести»."
memory: "nosić — «носить», и пара у него та же, что в русском: nosić относится к nieść ровно как «носить» к «нести». Niosę książkę — несу прямо сейчас, в одну сторону; noszę okulary — ношу вообще, постоянно. Об одежде держите в голове ещё одну границу: On nosi okulary значит «носит вообще», а про то, что на нём в эту минуту, поляк скажет ma na sobie. И отрицание тянет родительный: nie noszę okularów."
idioms:
  - { pl: "nosić okulary", ru: "носить очки" }
  - { pl: "nosić na rękach", ru: "носить на руках" }
  - { pl: "nosić imię", ru: "носить имя" }
