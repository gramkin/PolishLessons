notes:
  - { kind: false-friend, text: "KILOGRAM — «килограмм», с одним M. В разговоре — KILO, несклоняемое: DWA KILO, PÓŁ KILO. В письме сокращают KG. Грамм — GRAM, тоже с одним M." }
