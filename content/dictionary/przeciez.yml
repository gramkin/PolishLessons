# review
id: przeciez
format: 2
lemma: "przecież"
rank: 381
pos: part
pron: { cyr: "пшэ́чеш" }
senses:
  - id: after-all
    ru: "же, ведь"
    examples:
      - pl: "Przecież cię prosiłem, żebyś tego nie robił."
        ru: "Я же просил тебя не делать этого."
        source: { kind: tatoeba, id: 13225513 }
      - pl: "Przecież wiesz."
        ru: "Ты же знаешь."
        source: { kind: authored }
      - pl: "Przecież to oczywiste."
        ru: "Это же очевидно."
        source: { kind: authored }
  - id: objection
    ru: "но ведь, однако же (в возражении)"
    examples:
      - pl: "Przecież mówiłem wam, żebyście nie przychodzili!"
        ru: "Я же сказал вам не приходить!"
        source: { kind: tatoeba, id: 13547159 }
      - pl: "Przecież nic się nie stało."
        ru: "Но ведь ничего не случилось."
        source: { kind: authored }
      - pl: "Przecież obiecałeś."
        ru: "Ты же обещал."
        source: { kind: authored }
notes:
  - { kind: usage, text: "przecież — это русское «же» и «ведь»: напоминание о том, что собеседник и так знает. Przecież wiesz «Ты же знаешь»." }
  - { kind: usage, text: "Главное отличие от русского «же»: przecież не встаёт после первого слова, а обычно открывает предложение целиком." }
  - { kind: usage, text: "Очень часто звучит в упрёке: Przecież cię prosiłem «Я же тебя просил»." }
  - { kind: false-friend, text: "Не путайте przecież «же, ведь» с przeciw «против» и с przecie — устаревшим вариантом того же слова." }
collocations:
  - { pl: "przecież wiem", ru: "я же знаю" }
  - { pl: "no przecież", ru: "ну конечно же" }
  - { pl: "przecież mówiłem", ru: "я же говорил" }
etymology: "Из prze- и старой частицы -cie; родственно przeciw «против» — исходно «наперекор сказанному», отсюда и значение возражения."
memory: "przecież — «же, ведь». Русский вставляет «же» после первого слова, поляк ставит przecież в начало фразы: Przecież wiesz — «Ты же знаешь»."
idioms:
  - { pl: "no przecież", ru: "ну конечно же" }
  - { pl: "przecież mówiłem", ru: "я же говорил" }
  - { pl: "przecież nie", ru: "да нет же" }
