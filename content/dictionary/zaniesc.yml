# review
id: zaniesc
format: 2
lemma: "zanieść"
rank: 2348
pos: verb
aspect: perf
pron: { cyr: "за́несьць" }
senses:
  - id: carry-to
    ru: "отнести, занести (куда-л.)"
    examples:
      - pl: "Zanieś ręczniki do łazienki."
        ru: "Занеси полотенца в ванную."
        source: { kind: tatoeba, id: 6154846 }
      - pl: "Proszę zanieść te torby na górę."
        ru: "Отнесите, пожалуйста, эти сумки наверх."
        source: { kind: translated, id: 364271 }
      - pl: "Mogę ci zanieść te walizki."
        ru: "Я могу отнести тебе эти чемоданы."
        source: { kind: translated, id: 964912 }
  - id: deliver
    ru: "доставить, снести"
    examples:
      - pl: "Rannego zaniesiono do szpitala."
        ru: "Раненого отнесли в больницу."
        source: { kind: translated, id: 704096 }
      - pl: "Ukradł matce telefon i zaniósł go do lombardu."
        ru: "Он украл у матери телефон и снёс его в ломбард."
        source: { kind: translated, id: 12948586 }
notes:
  - { kind: government, text: "Куда — do + родительный (zanieść do pokoju) или na + винительный (zanieść na górę). Кому — дательный: zaniosłem mu kawę." }
  - { kind: false-friend, text: "za- + nieść «нести», которое уже есть в словаре (nosić). Полное соответствие русскому «занести», включая приставку." }
  - { kind: usage, text: "Безличное zaniesiono «отнесли» — обычный газетный и протокольный оборот: Rannego zaniesiono do szpitala." }
  - { kind: usage, text: "Несовершенный вид — zanosić. Отглагольное zaniesienie «доставка» встречается в вежливых просьбах." }
collocations:
  - { pl: "zanieść do domu", ru: "отнести домой" }
  - { pl: "zanieść na górę", ru: "отнести наверх" }
etymology: "za- + nieść «нести»; полное соответствие русскому «занести»."
memory: "zanieść — «отнести, занести». Куда: do + родительный или na + винительный; кому — дательный. Несовершенный вид — zanosić."
idioms:
  - { pl: "zanieść do domu", ru: "отнести домой" }
