id: zemsta
format: 2
lemma: "zemsta"
rank: 1659
pos: noun
pron: { cyr: "зэ́мста" }
senses:
  - id: revenge
    ru: "месть"
    examples:
      - pl: "Słodka zemsta."
        ru: "Сладкая месть."
        source: { kind: translated, id: 10999946 }
      - pl: "Tom pragnął zemsty."
        ru: "Том жаждал мести."
        source: { kind: translated, id: 9679371 }
      - pl: "Dyszała żądzą zemsty."
        ru: "Она дышала жаждой мести."
        source: { kind: translated, id: 757265 }
  - id: out-of-revenge
    ru: "из мести, ради мести"
    examples:
      - pl: "Oni z zemsty podpalili dom sąsiada."
        ru: "Они из мести подожгли дом соседа."
        source: { kind: translated, id: 1358351 }
      - pl: "Tom nie chce sprawiedliwości. On chce zemsty."
        ru: "Том не хочет справедливости. Он хочет мести."
        source: { kind: translated, id: 10999947 }
notes:
  - { kind: government, text: "«Жаждать мести» — pragnąć zemsty, родительный падеж; «из мести» — z zemsty." }
  - { kind: usage, text: "Глагол — zemścić się «отомстить»: zemścić się na kimś «отомстить кому-то», предлог na с предложным." }
  - { kind: usage, text: "zemsta faraona — шуточное «месть фараона», о расстройстве желудка в поездке." }
  - { kind: usage, text: "Существительное женского рода на -a; звательная форма zemsto в корпусе не встречается." }
collocations:
  - { pl: "pragnąć zemsty", ru: "жаждать мести" }
  - { pl: "z zemsty", ru: "из мести" }
  - { pl: "słodka zemsta", ru: "сладкая месть" }
etymology: "От zemścić się «отомстить», в основе mścić «мстить», праславянское *mьstь. Русская «месть» — то же слово, только без приставки: соответствие корня полное."
memory: "zemsta = «месть», от zemścić się «отомстить». Управление: pragnąć zemsty «жаждать мести» (родительный), z zemsty «из мести». Отомстить кому-то — zemścić się na kimś."
idioms:
  - { pl: "pragnąć zemsty", ru: "жаждать мести" }
  - { pl: "z zemsty", ru: "из мести" }
  - { pl: "słodka zemsta", ru: "сладкая месть" }
formExamplesSkip:
  - { form: "zemsto", reason: "звательный падеж у неодушевлённых существительных в современном языке остался только в поэтическом обращении: в обычной речи вместо zemsto говорят zemsta" }
