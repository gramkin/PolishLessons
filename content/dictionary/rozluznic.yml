  - id: relax
    ru: "расслабить; расслабиться (rozluźnić się)"
    examples:
      - pl: "Rozluźnij mięśnie i oddychaj spokojnie."
        ru: "Расслабь мышцы и дыши спокойно."
        source: { kind: authored }
