notes:
  - { kind: false-friend, text: "ROZLUŹNIĆ — от LUŹNY, «свободный, нетугой»,. Значения: «ослабить» узел или ремень и «расслабить» мышцы: ROZLUŹNIJ SIĘ, «расслабься». В переносном — «смягчить»: ROZLUŹNIĆ ZASADY, ATMOSFERĘ. Синоним в быту — ODPRĘŻYĆ SIĘ." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное ROZLUŹNIONY, «расслабленный», и деепричастие ROZLUŹNIWSZY. Повелительное ROZLUŹNIJ — с -IJ после двух согласных. Видовой партнёр — ROZLUŹNIAĆ." }
  - { kind: government, text: "Что — винительный: ROZLUŹNIĆ UCHWYT, WĘZEŁ, MIĘŚNIE. Чем — творительный: ROZLUŹNIĆ ATMOSFERĘ ŻARTEM. Возвратное ROZLUŹNIĆ SIĘ — без дополнения: UCZNIOWIE SIĘ ROZLUŹNILI." }
  - { kind: pronunciation, text: "Читается «розлу́зьниць», три слога, ударение на предпоследнем. L перед U — «лу», ŹN — мягкие «зьн». Конечное Ć — «ць». ROZLUŹNIJ — «розлу́зьний»." }
  - { kind: register, text: "Нейтральное слово врачей, тренеров и журналистов. ROZLUŹNIĆ ATMOSFERĘ — «разрядить обстановку». ROZLUŹNIONY — и «расслабленный», и разг. «раскованный»: ROZLUŹNIONY STYL." }
collocations:
  - { pl: "rozluźnić krawat", ru: "ослабить галстук" }
  - { pl: "rozluźnić mięśnie", ru: "расслабить мышцы" }
  - { pl: "rozluźnić atmosferę", ru: "разрядить обстановку" }
family:
  - { pl: "rozluźniać", ru: "ослаблять, расслаблять", relation: aspect }
  - { pl: "luźny", ru: "свободный, нетугой", relation: root }
  - { pl: "luz", ru: "зазор; непринуждённость", relation: root, id: luz }
etymology: "Приставка ROZ- плюс LUŹNIĆ, от LUŹNY «свободный», из немецкого LOSE «свободный, незакреплённый». Польское LUZ — «люфт, зазор» и разг. «спокойствие»: LUZ! — «спокойно!»."
memory: "Rozluźnić — ослабить: krawat, pasek; расслабить: mięśnie. Rozluźnij się — расслабься. Rozluźnić atmosferę — разрядить обстановку. От luźny — свободный. Читается «розлу́зьниць»."
idioms:
  - { pl: "rozluźnić atmosferę", ru: "разрядить обстановку" }
