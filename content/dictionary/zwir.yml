  - { pl: "tona żwiru", ru: "тонна гравия" }
etymology: "Праславянское *žvirъ; родственно литовскому žvyras «гравий»."
memory: "żwir — «гравий», и это ложный друг: «жир» по-польски tłuszcz, а żwir лежит на дороге."
