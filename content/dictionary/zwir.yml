notes:
  - { kind: false-friend, text: "Главная ловушка: żwir — это не «жир». Жир по-польски tłuszcz." }
  - { kind: usage, text: "Обиходное и строительное слово: żwirowa droga «гравийная дорога», żwirownia «гравийный карьер»." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — żwiru." }
  - { kind: usage, text: "Прилагательное — żwirowy «гравийный»." }
  - { kind: usage, text: "Множественное число żwiry — язык специалистов: сорта и фракции гравия, żwiry rzeczne, żwiry budowlane. В обычной речи слово остаётся в единственном числе." }
collocations:
