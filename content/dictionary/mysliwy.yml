# review
id: mysliwy
format: 2
lemma: "myśliwy"
rank: 5388
pos: adj
pron: { cyr: "мысьли́вы" }
senses:
  - id: hunter
    ru: "охотник (как существительное)"
    examples:
      - pl: "Myśliwy wrócił z lasu z zającem."
        ru: "Охотник вернулся из леса с зайцем."
        source: { kind: authored }
      - pl: "Mój dziadek był myśliwym."
        ru: "Мой дед был охотником."
        source: { kind: authored }
      - pl: "Myśliwi spotkali się o świcie."
        ru: "Охотники встретились на рассвете."
        source: { kind: authored }
  - id: huntsman
    ru: "ловчий, егерь (в сказках и истории)"
    examples:
      - pl: "Królewscy myśliwi prowadzili polowanie."
        ru: "Королевские ловчие вели охоту."
        source: { kind: authored }
      - pl: "W bajce myśliwy uratował Czerwonego Kapturka."
        ru: "В сказке охотник спас Красную Шапочку."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MYŚLIWY похож на «мыслящий» или «мысль»: корень MYŚL- тот же, но значение — «охотник». Мыслящий — MYŚLĄCY. Охотничий как прилагательное — MYŚLIWSKI: PIES MYŚLIWSKI, SEZON MYŚLIWSKI. Охота — POLOWANIE, охотиться — POLOWAĆ." }
  - { kind: usage, text: "Склоняется как прилагательное, но служит существительным мужского рода: MYŚLIWY, MYŚLIWEGO, MYŚLIWI. Женские и средние формы MYŚLIWA, MYŚLIWE в карточку не включены: прилагательное «охотничий» сегодня — MYŚLIWSKI. После BYĆ — творительный: BYŁ MYŚLIWYM." }
  - { kind: government, text: "Профессия или занятие после BYĆ — творительный: JEST MYŚLIWYM. Охотиться на кого — POLOWAĆ NA с винительным: POLOWAĆ NA DZIKI, «охотиться на кабанов»." }
  - { kind: pronunciation, text: "Читается «мысьли́вы», три слога, ударение на предпоследнем. Y после M — «ы», Ś мягкое «сь», L перед I мягкое." }
  - { kind: register, text: "Нейтральное слово, частое в сказках, литературе и в речи о природе. Член охотничьего клуба — MYŚLIWY, а браконьер — KŁUSOWNIK." }
collocations:
  - { pl: "koło myśliwych", ru: "охотничий клуб" }
  - { pl: "zapalony myśliwy", ru: "заядлый охотник" }
  - { pl: "myśliwy i zwierzyna", ru: "охотник и дичь" }
family:
