  - { pl: "polować", ru: "охотиться", relation: root, id: polowac }
etymology: "От старопольского MYŚLIWIEC, «охотник», от MYŚL «мысль, замысел». Охотник — тот, кто выслеживает и замышляет хитрость против зверя."
memory: "Myśliwy — охотник. Był myśliwym — был охотником. Охотничий — myśliwski. Мыслящий — myślący. Читается «мысьли́вы»."
idioms:
