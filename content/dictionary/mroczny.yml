notes:
  - { kind: usage, text: "Слово показывает третий исход для согласного k, и это стоит собрать в одно место. Прилагательное сделано от MROK «мрак», и перед суффиксом -ny заднеязычный k переходит не в c, а в CZ: mrok — MROCZNY. Так же устроены rok — ROCZNY «годовой», ręka — RĘCZNY «ручной», mleko — MLECZNY «молочный», noc… а вот перед окончанием -e тот же k даёт c: klinika — KLINICE, и перед мужским личным -i тоже c: włoski — WŁOSCY, technik — TECHNICY. Один согласный, три разных исхода, и выбирает между ними то, что стоит справа." }
  - { kind: usage, text: "Степени синтетические и строятся суффиксом -ejsz-: MROCZNIEJSZY, NAJMROCZNIEJSZY. Мужская личная форма множественного при этом меняется по степеням: MROCZNI в положительной, MROCZNIEJSI в сравнительной, NAJMROCZNIEJSI в превосходной — суффикс -ejsz- смягчается в -ejś- перед окончанием -i. Это четвёртый случай после typowsi, kompletniejsi и różowsi, и правило можно считать твёрдым: написания на -szi в польском не бывает вовсе." }
  - { kind: usage, text: "Смысл и корень совпадают с русским полностью: MROCZNY — «мрачный», от MROK — «мрак», и оба языка употребляют слово и буквально о темноте, и переносно о настроении, временах, истории. Запоминать нечего, и это полезно отметить отдельно: среди слов этой партии pech не угадать никак, ochroniarz угадывается через «охрану», а mroczny просто совпадает. Три степени прозрачности в одной партии." }
