etymology: "От MROK «мрак», из праславянского *morkъ — того же слова, что русский «мрак» и «сумрак», в родстве с «меркнуть» и литовским mirkti. Прилагательное образовано суффиксом -ny, и на стыке k перешло в cz, как в roczny от rok и ręczny от ręka. Русское «мрачный» собрано ровно так же и из того же корня, с тем же переходом к в ч, так что пара mroczny — «мрачный» совпадает и по составу, и по чередованию."
memory: "mrok → mroczny: k даёт cz перед -ny, как rok → roczny, ręka → ręczny. А перед -e тот же k даёт c: klinice. Полное совпадение с русским «мрак — мрачный»."
