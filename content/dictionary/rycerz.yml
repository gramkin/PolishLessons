notes:
  - { kind: false-friend, text: "Редкий случай, когда слово пришло в русский из польского, а не наоборот. Немецкое RITTER «всадник, рыцарь» дало чешское RYTÍŘ, оттуда польское RYCERZ, а из польского в семнадцатом веке — русское «рыцарь». Поэтому совпадение полное и безопасное: RYCERZ это «рыцарь», RYCERSKI «рыцарский», RYCERSTWO «рыцарство». Запомнить стоит разве что написание: в польском одно R в начале и CERZ в конце, без мягкого знака, который русский поставил на месте польского Z. Переносное употребление тоже совпадает: о человеке безупречного поведения оба языка скажут «рыцарь», а BŁĘDNY RYCERZ это «странствующий рыцарь», тот самый донкихотовский." }
  - { kind: government, text: "Мужской род, одушевлённое, лицо (m1). Винительный равен родительному: WIDZIAŁ RYCERZA. Звательный RYCERZU употребляется в обращении, в том числе литературном. Кем стал — творительный при ZOSTAĆ и BYĆ: ZOSTAŁ RYCERZEM, BYŁ RYCERZEM. Частотные сочетания: ZAKON RYCERSKI «рыцарский орден», TURNIEJ RYCERSKI «рыцарский турнир», BŁĘDNY RYCERZ «странствующий рыцарь», RYCERZ BEZ SKAZY «рыцарь без изъяна». Женского соответствия у слова нет: о женщине скажут DAMA или не употребят слова вовсе." }
  - { kind: usage, text: "В родительном множественного у этого слова две формы, и обе правильные: RYCERZY и RYCERZÓW. Так ведут себя все польские существительные на -RZ — TALERZY и TALERZÓW, KOMENTARZY и KOMENTARZÓW, LEKARZY и LEKARZÓW, — причём форма на -Y звучит современнее и встречается чаще, а на -ÓW отдаёт стариной и держится в исторических текстах. Выбирать можно любую, но в одном тексте стоит держаться одной. Остальное склонение обычное для мужского лица: именительный множественного RYCERZE, дательный RYCERZOM, местный RYCERZACH, творительный RYCERZAMI." }
  - { kind: pronunciation, text: "Читается «ры́цэш», два слога, ударение на первом. Буква Y это «ы». Сочетание CE даёт «цэ», с твёрдым ц и без смягчения. Конечное RZ в обычных условиях читается «ж», но на конце слова оглушается до «ш», поэтому RYCERZ звучит «рыцэш», а не «рыцэж». Как только за RZ появляется гласная, звонкость возвращается: RYCERZA это «рыце́жа», RYCERZE — «рыце́же». Так одно слово показывает и правило оглушения, и его отмену." }
