etymology: "Из средневерхненемецкого RITTER «всадник», от RITEN «ехать верхом», через чешское RYTÍŘ. Польский переработал чешскую форму в RYCERZ, заменив суффикс на свой -ERZ, продуктивный в названиях людей: как MALARZ, LEKARZ, PISARZ. Дальше слово пошло на восток: русское «рыцарь» заимствовано именно из польского, в семнадцатом веке, и это стоит отметить особо, потому что направление здесь обратное обычному — чаще польский получал слова через русский или вместе с ним, а тут он выступил посредником между немецким и русским. Суффикс -RZ в польском тянет за собой известное колебание родительного множественного между -Y и -ÓW, и RYCERZY рядом с RYCERZÓW — тот же случай, что TALERZY и TALERZÓW."
memory: "Слово пришло в русский ИЗ польского: немецкое Ritter дало чешское rytíř, оттуда польское rycerz, а из польского — русское «рыцарь». Направление обратное обычному. Совпадение полное и безопасное. Два родительных множественного: rycerzy и rycerzów, как talerzy и talerzów — все существительные на -rz так себя ведут, форма на -y современнее. Конечное rz оглушается: «ры́цэш», но rycerza уже «рыце́жа»."
