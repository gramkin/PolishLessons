# review
id: majestatyczny
format: 2
lemma: "majestatyczny"
rank: 6055
pos: adj
pron: { cyr: "маестаты́чны" }
senses:
  - id: majestic
    ru: "величественный, величавый"
    examples:
      - pl: "Po podwórku przechadzał się majestatyczny kogut."
        ru: "По двору величаво расхаживал петух."
        source: { kind: translated, id: 5959971 }
      - pl: "W tej majestatycznej świątyni odbyła się ceremonia sakralna."
        ru: "В этом величественном храме прошла священная церемония."
        source: { kind: translated, id: 840219 }
      - pl: "Nad doliną wznosiły się majestatyczne szczyty."
        ru: "Над долиной высились величественные вершины."
        source: { kind: authored }
  - id: dignified
    ru: "исполненный достоинства, важный (о человеке, движении)"
    examples:
      - pl: "Królowa szła majestatycznym krokiem."
        ru: "Королева шла величавой поступью."
        source: { kind: authored }
      - pl: "Stary profesor miał majestatyczny wygląd."
        ru: "У старого профессора был величественный вид."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Слово знакомое по корню — «величество», MAJESTAT, — но русского «маестатичный» нет: по-русски «величественный», «величавый». Обращение «Ваше величество» — WASZA KRÓLEWSKA MOŚĆ, а не majestat." }
  - { kind: usage, text: "О природе и архитектуре (majestatyczne góry, majestatyczny lodowiec, majestatyczna katedra), о людях и движениях — «величавый, с достоинством». Наречие — MAJESTATYCZNIE: płynąć majestatycznie." }
  - { kind: pronunciation, text: "«маестаты́чны»: J между гласными почти не слышно, получается «маэ-». CZ — твёрдое «ч», Y — «ы». Ударение на предпоследнем слоге TY." }
  - { kind: register, text: "Книжное и торжественное; в путеводителях и репортажах. Иронически — о важничающем человеке: majestatyczny jak paw, «важный, как павлин»." }
collocations:
  - { pl: "majestatyczne góry", ru: "величественные горы" }
  - { pl: "majestatyczny krok", ru: "величавая поступь" }
  - { pl: "majestatyczny widok", ru: "величественный вид" }
family:
  - { pl: "majestat", ru: "величие; величество", relation: root }
  - { pl: "majestatycznie", ru: "величественно", relation: derived }
etymology: "От MAJESTAT, «величие, величество», из латинского MAIESTAS, от MAIOR, «больший». Прилагательное построено по книжной модели -YCZNY, как dramatyczny, tragiczny; русское «величественный» передаёт ту же мысль славянским корнем."
memory: "Majestatyczny — величественный, от majestat, «величие» (латинское maiestas, «бо́льшесть»). Majestatyczne góry — величественные горы. Наречие — majestatycznie."
idioms:
  - { pl: "z majestatycznym spokojem", ru: "с величавым спокойствием" }
