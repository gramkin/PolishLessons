# review
id: rozpowszechniac
format: 2
lemma: "rozpowszechniać"
rank: 5907
pos: verb
aspect: imperf
pron: { cyr: "роспофше́хняць" }
senses:
  - id: spread
    ru: "распространять (сведения, слухи, знания)"
    examples:
      - pl: "Internet szybko rozpowszechnia każdą plotkę."
        ru: "Интернет быстро распространяет любую сплетню."
        source: { kind: authored }
      - pl: "Sąsiedzi rozpowszechniali o nas plotki."
        ru: "Соседи распускали о нас сплетни."
        source: { kind: authored }
      - pl: "Nie wolno rozpowszechniać cudzych zdjęć bez zgody."
        ru: "Нельзя распространять чужие фотографии без согласия."
        source: { kind: authored }
  - id: distribute
    ru: "распространять, распределять (товары, фильмы, печатные материалы)"
    examples:
      - pl: "Chcielibyśmy rozpowszechniać ten produkt w Japonii."
        ru: "Мы хотели бы распространять этот продукт в Японии."
        source: { kind: translated, id: 1357233 }
      - pl: "Wolontariusze rozpowszechniają ulotki o zbiórce."
        ru: "Волонтёры распространяют листовки о сборе средств."
        source: { kind: authored }
  - id: spread-itself
    ru: "rozpowszechniać się — распространяться"
    examples:
      - pl: "Plotki rozpowszechniały się błyskawicznie."
        ru: "Сплетни распространялись молниеносно."
        source: { kind: authored }
      - pl: "Wirus rozpowszechnia się przez kontakt."
        ru: "Вирус распространяется через контакт."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид; совершенный — ROZPOWSZECHNIĆ «распространить». Спряжение на -AM: ROZPOWSZECHNIAM, ROZPOWSZECHNIASZ, ROZPOWSZECHNIAJĄ. С SIĘ — «распространяться»: PLOTKI SZYBKO SIĘ ROZPOWSZECHNIAJĄ. Мужско-личное страдательное ROZPOWSZECHNIANI в карточку не включено: распространяют сведения и вещи, а не людей." }
  - { kind: government, text: "Что — винительный: ROZPOWSZECHNIAĆ PLOTKI, ULOTKI, FILM. Среди кого — WŚRÓD + родительный: WŚRÓD MŁODZIEŻY. Где — W + предложный: W SIECI, W SZKOŁACH." }
  - { kind: pronunciation, text: "Читается «роспофше́хняць»: Z перед P оглушается («рос-»), W после P — тоже («пф»), CHNI — «хнь». Ударение на WSZECH." }
  - { kind: register, text: "Слово книжное и официальное: законы, СМИ, авторское право. В разговоре о сплетнях чаще говорят ROZNOSIĆ PLOTKI или ROZPUSZCZAĆ PLOTKI; о болезнях — ROZPRZESTRZENIAĆ SIĘ." }
collocations:
  - { pl: "rozpowszechniać plotki", ru: "распространять сплетни" }
  - { pl: "rozpowszechniać informacje", ru: "распространять информацию" }
  - { pl: "rozpowszechniać ulotki", ru: "распространять листовки" }
  - { pl: "rozpowszechniać wiedzę", ru: "распространять знания" }
family:
  - { pl: "rozpowszechnić", ru: "распространить", relation: aspect }
  - { pl: "powszechny", ru: "всеобщий, общий", relation: root }
  - { pl: "powszechnie", ru: "повсеместно, всеми", relation: root, id: powszechnie }
  - { pl: "rozpowszechniony", ru: "распространённый", relation: derived }
etymology: "Образовано от POWSZECHNY «всеобщий», где WSZECH- того же корня, что русское «весь, всех». Буквально — «делать всеобщим, общим для всех»."
memory: "Rozpowszechniać — сделать powszechnym, «всеобщим»: внутри слышно «всех» — WSZECH."
idioms:
  - { pl: "kopiowanie i rozpowszechnianie zabronione", ru: "копирование и распространение запрещено" }
formExamplesSkip:
  - { form: "rozpowszechniani", reason: "мужско-личная форма страдательного причастия: распространяют сведения и вещи, а не людей" }
