  - id: place-of-worship
    ru: "храм (любой религии)"
    examples:
      - pl: "W tej świątyni modlą się buddyści."
        ru: "В этом храме молятся буддисты."
        source: { kind: authored }
      - pl: "Budowa świątyni trwała dwieście lat."
        ru: "Строительство храма длилось двести лет."
        source: { kind: authored }
  - id: figurative
    ru: "храм (перен.: средоточие чего-л.)"
    examples:
      - pl: "Ta biblioteka to świątynia ciszy."
        ru: "Эта библиотека — храм тишины."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОГНАТ ЕСТЬ, НО ОБОЗНАЧАЕТ ОН РАЗНОЕ. Польская ŚWIĄTYNIA — это здание, храм. Русская «святыня» — не здание, а святой предмет или нечто почитаемое: «семейная святыня». Здание по-русски будет «храм», а христианское — «церковь», по-польски kościół. Корень общий: święty «святой»." }
  - { kind: usage, text: "Существительное класса на -nia, поэтому форма ŚWIĄTYNI обслуживает сразу родительный, дательный и предложный единственного: do świątyni, w świątyni. Родительный множественного звучит иначе — ŚWIĄTYŃ, с мягким нь. Так же устроена powierzchnia." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: świą-TY-nia. Św читается как «щф», ą как «он» перед t: «щфёнты́ня». Конечное nia мягкое." }
collocations:
  - { pl: "w świątyni", ru: "в храме" }
  - { pl: "budowa świątyni", ru: "строительство храма" }
  - { pl: "świątynia ciszy", ru: "храм тишины" }
family:
  - { pl: "święty", ru: "святой", relation: root, id: swiety }
  - { pl: "kościół", ru: "костёл, церковь", relation: root, id: kosciol }
  - { pl: "ołtarz", ru: "алтарь", relation: root }
etymology: "От święty «святой», из праславянского *svętъ — того же, что русское «святой» и «святыня». Суффикс -ynia образует названия мест, как в pustynia «пустыня». Русская «святыня» пошла по пути предмета почитания, польская świątynia — по пути здания."
memory: "świątynia — это «храм», здание, а не русская «святыня», которая означает почитаемую вещь. Корень один: święty «святой». Форма świątyni служит трём падежам сразу, а родительный множественного — świątyń."
idioms:
  - { pl: "świątynia dumania", ru: "место уединённых раздумий" }
  - { pl: "cisza jak w świątyni", ru: "тишина как в храме" }
