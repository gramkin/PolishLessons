# review
id: zabraknac
format: 2
lemma: "zabraknąć"
rank: 4029
pos: verb
pron: { cyr: "забра́кнонць" }
senses:
  - id: run-short
    ru: "не хватить, кончиться"
    examples:
      - pl: "Zabrakło nam chleba."
        ru: "У нас кончился хлеб."
        source: { kind: authored }
      - pl: "Jeśli zabraknie pieniędzy, wrócimy wcześniej."
        ru: "Если не хватит денег, мы вернёмся раньше."
        source: { kind: authored }
      - pl: "Zabrakło mi słów."
        ru: "У меня не нашлось слов."
        source: { kind: authored }
  - id: be-gone
    ru: "не стать (о человеке, книжно)"
    examples:
      - pl: "Kiedy zabraknie rodziców, zostaniemy sami."
        ru: "Когда не станет родителей, мы останемся одни."
        source: { kind: authored }
      - pl: "Zabrakło go wśród nas dwa lata temu."
        ru: "Его не стало среди нас два года назад."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZABRAKNĄĆ — «не хватить», а не «забраковать» (ODRZUCIĆ, ZDYSKWALIFIKOWAĆ). Корень тот же, что в BRAK «нехватка» и BRAKOWAĆ «не хватать»; русское «брак» в смысле «дефект» к этому значению не относится." }
  - { kind: usage, text: "Безличный глагол, всего четыре формы: ZABRAKNĄĆ, ZABRAKNIE, ZABRAKŁO, ZABRAKŁOBY. Подлежащего нет: то, чего не хватает, стоит в родительном. Несовершенный вид — BRAKOWAĆ: BRAKUJE MI CZASU «мне не хватает времени»." }
  - { kind: government, text: "Чего — родительный: ZABRAKŁO WODY. Кому — дательный: ZABRAKŁO MI CZASU. Где — W с предложным: W SKLEPIE ZABRAKŁO MLEKA. Русское «у меня» передаётся дательным: ZABRAKŁO MI SIŁ «у меня не хватило сил»." }
  - { kind: pronunciation, text: "Читается «забра́кнонць»: ударение на предпоследнем слоге, ĄĆ — «онць». ZABRAKŁO — «забра́куо», ZABRAKNIE — «забра́кне»." }
  - { kind: register, text: "Нейтральное, частое слово. О смерти близкого — мягкий книжный эвфемизм: KIEDY MNIE ZABRAKNIE «когда меня не станет»." }
collocations:
  - { pl: "zabrakło mi słów", ru: "у меня не нашлось слов" }
  - { pl: "zabraknąć czasu", ru: "не хватить времени" }
  - { pl: "niczego nie zabraknie", ru: "всего будет вдоволь" }
family:
  - { pl: "brakować", ru: "не хватать", relation: aspect, id: brakowac }
  - { pl: "brak", ru: "нехватка, отсутствие", relation: root, id: brak }
  - { pl: "wystarczyć", ru: "хватить", relation: antonym, id: wystarczyc }
etymology: "Приставка ZA- плюс корень BRAK «нехватка», который польский, скорее всего, взял из немецкого: средненижненемецкое BRAK «изъян». Русское «брак» в смысле «дефект» — то же немецкое слово, но значения разошлись."
memory: "Zabraknąć — не хватить: zabrakło mi słów. Чего — родительный, кому — дательный. Brak — нехватка, а не русский «брак»."
idioms:
  - { pl: "niczego mu nie zabraknie", ru: "у него всего будет вдоволь" }
