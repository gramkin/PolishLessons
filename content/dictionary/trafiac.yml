etymology: "Из немецкого TREFFEN «попадать, встречать», через средневерхненемецкий, в польский язык заимствование пришло вместе с городской и военной лексикой — тем же путём, что RATUSZ, BURMISTRZ, HANDEL. Русскому этот корень не достался, и потому TRAFIAĆ приходится учить без опоры на родственное слово. Внутри польского оно обросло собственным гнездом: TRAF «случай», TRAFEM «случайно», TRAFNY «меткий», TRAFNIE «метко», TRAFIENIE «попадание», NIETRAFIONY «неудачный». Любопытно, что исходное немецкое значение «встречать» в польском сохранилось в оборотах TRAFIĆ NA KOGOŚ «натолкнуться на кого-то» и TRAFIĆ NA DOBRY DZIEŃ «попасть на удачный день», то есть оттенок случайной встречи остался живым, тогда как в значении точного удара слово ушло к «попаданию в цель»."
memory: "Заимствование из немецкого treffen, русского родственника нет — учится без опоры на корень. Значения почти как у «попадать»: trafić w cel, trafić do szpitala, trafić na kogoś. Но третье значение своё: trafić do domu это «найти дорогу домой», и вопрос trafisz? значит «дорогу найдёшь?». Управление расходится в одном месте: w cel с винительным как в русском, но do szpitala с родительным, тогда как русский говорит «в больницу». Гнездо: traf «случай», trafem «случайно», trafny «меткий», trafiony prezent «удачный подарок»."
