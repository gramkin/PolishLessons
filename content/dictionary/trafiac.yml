notes:
  - { kind: false-friend, text: "Слово заимствовано из немецкого TREFFEN «попадать, встречать» и русскому родственного соответствия не имеет, так что опереться на знакомый корень нельзя. Зато значения распределены почти как у русского «попадать»: TRAFIĆ W CEL «попасть в цель», TRAFIĆ DO SZPITALA «попасть в больницу», TRAFIĆ NA KOGOŚ «натолкнуться на кого-то». Третье значение русскому не отвечает: TRAFIĆ DO DOMU значит «найти дорогу домой», и по-русски здесь нужен другой глагол — «добраться», «дойти». Поэтому в разговоре TRAFISZ означает «дорогу найдёшь», а не «попадёшь» — и это единственное значение, которого русский глагол не имеет. Прилагательное TRAFNY значит «меткий, верный»: TRAFNA UWAGA «меткое замечание»." }
  - { kind: usage, text: "Несовершенный вид, шестьдесят три формы: сорок две от глагола, десять от действительного причастия TRAFIAJĄCY, одиннадцать от страдательного TRAFIANY. Совершенная пара — TRAFIĆ, и она в живой речи встречается чаще несовершенной, потому что попадание обычно однократно: TRAFIŁEM «я попал». Основы различаются одной гласной: TRAFIA- против TRAFI-, сравните TRAFIAM и TRAFIĘ. Причастие TRAFIONY значит «попавший под удар» и в переносном смысле «удачный»: TRAFIONY PREZENT «удачный подарок». Наречие TRAFNIE — «метко», существительное TRAFIENIE — «попадание», а TRAF — «случай», откуда TRAFEM «случайно»." }
  - { kind: government, text: "Куда попадать в цель — предлог W с винительным: TRAFIAĆ W TARCZĘ, W SZYBĘ, W SAM ŚRODEK, и русский здесь требует того же, «попадать в цель». Куда оказываться — предлог DO с родительным: TRAFIAĆ DO SZPITALA, DO SĄDU, DO WIĘZIENIA, тогда как русский говорит «попасть В больницу» с винительным, и это расхождение надо запомнить. На кого натолкнуться — предлог NA с винительным: TRAFIĆ NA DOBREGO LEKARZA «попасть к хорошему врачу». В значении «находить дорогу» глагол употребляется и без дополнения вовсе: NIE TRAFIĘ «я не найду дороги»." }
  - { kind: pronunciation, text: "Читается «трафя́ць», три слога, ударение на предпоследнем. Сочетание TR произносится слитно и твёрдо. Буквосочетание FI перед гласным даёт мягкое «фь», поэтому середина слова звучит «фя», а не «фи-а». Конечное Ć — мягкое «ць». В совершенном виде TRAFIĆ два слога, ударение на первом: «тра́фиць». В причастии TRAFIAJĄCY пять слогов, ударение предпоследнее: «трафяйо́нцы». В существительном TRAF один слог, конечное F глухое: «траф»." }
