notes:
  - { kind: usage, text: "Самое ценное в этой карточке — оборот W RAMACH с родительным падежом: «в рамках чего-то». W RAMACH PROJEKTU, W RAMACH UMOWY, W RAMACH OBOWIĄZKÓW — в официальном польском это одна из самых частых конструкций вообще, и русское «в рамках» устроено точно так же, с родительным, так что перенос полный и бесплатный. Кроме этого оборота множественное число RAMY значит «пределы, границы»: WYJŚĆ Z RAM «выйти за рамки», TRZYMAĆ SIĘ W RAMACH. В единственном числе слово остаётся предметным: рама окна, картины, велосипеда." }
  - { kind: pronunciation, text: "Читается «ра́ма», ударение на первом слоге из двух. В дательном и местном падеже RAMIE звучит «ра́ме», с мягким m перед i. И здесь нужна осторожность: RAMIĘ, с носовой ę на конце, — совсем другое слово, оно значит «плечо», и его местный падеж будет RAMIENIU. То есть W RAMIE означает «в раме», а W RAMIENIU — «в плече». Разница на письме в одной букве, на слух — в носовом призвуке, и перепутать их легко." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: OPRAWILI W RAMĘ. Вставить во что-то — предлог W с винительным: OPRAWIĆ W RAMĘ «вставить в раму», а находиться в чём-то — W с местным: W RAMIE. Назначение вводится предлогом DO с родительным: RAMA DO ZDJĘĆ «рамка для фотографий», RAMA DO OBRAZU. При отрицании винительный уходит в родительный: NIE oprawili RAMY. В обороте W RAMACH падеж после предлога — всегда родительный." }
  - { kind: false-friend, text: "Со значением «рама» всё совпадает, и это редкий случай полного согласия. Ловушка лежит рядом: польское RAMIĘ «плечо» похоже на RAMA настолько, что начинающие строят несуществующие формы. Запомнить помогает то, что у RAMIĘ носовая на конце и склонение среднего рода с наращением: RAMIĘ, RAMIENIA, RAMIENIU, RAMIONA. У RAMA ничего подобного нет, она женского рода и совершенно правильная. Исторически оба слова не родственны: RAMA пришла из немецкого, RAMIĘ — праславянское, родня русскому «рамо», старому названию плеча." }
collocations:
  - { pl: "w ramach", ru: "в рамках (чего-то)" }
  - { pl: "rama okienna", ru: "оконная рама" }
  - { pl: "oprawić w ramę", ru: "вставить в раму" }
family:
  - { pl: "ramka", ru: "рамка", relation: derived }
  - { pl: "ramię", ru: "плечо", relation: root, id: ramie }
  - { pl: "okno", ru: "окно", relation: root, id: okno }
etymology: "Из средневерхненемецкого RAM, RAME «рама, станина», откуда и современное немецкое RAHMEN. Русская «рама» пришла тем же путём и примерно в то же время, через ремесленную лексику, поэтому слова совпадают до буквы. Переносное значение «пределы» развилось в обоих языках независимо и одинаково: рама ограничивает картину, и отсюда рамки ограничивают действие. Важно не спутать слово с праславянским RAMIĘ «плечо», родственным русскому «рамо» и «раменам», которое к немецкой раме отношения не имеет: сходство звучания здесь случайно, и именно поэтому оно опасно."
memory: "Главное — оборот w ramach с родительным: w ramach projektu, в точности как русское «в рамках». Множественное ramy значит «пределы»: wyjść z ram. И не путать с ramię «плечо»: w ramie «в раме», но w ramieniu «в плече»; rama из немецкого, ramię праславянское, родня русскому «рамо»."
idioms:
  - { pl: "w ramach", ru: "в рамках (чего-то)" }
  - { pl: "wyjść z ram", ru: "выйти за рамки" }
