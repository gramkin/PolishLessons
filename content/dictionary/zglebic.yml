  - { form: "zgłębijmy", reason: "форма образована генератором по ошибке. Повелительное наклонение у zgłębić строится усечением основы — zgłęb, zgłębcie, zgłębmy, как mówić даёт mów, а robić даёт rób. Окончание -ij бывает у глаголов со стечением согласных в основе, как zamknijmy, а у zgłębić основа кончается мягким губным, поэтому такой формы нет" }
