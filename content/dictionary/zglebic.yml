# review
id: zglebic
format: 2
lemma: "zgłębić"
rank: 2111
pos: verb
aspect: perf
pron: { cyr: "згуэ́мбиць" }
senses:
  - id: fathom
    ru: "постичь, вникнуть, изучить досконально"
    examples:
      - pl: "Trudno zgłębić jego zamiary."
        ru: "Трудно постичь его замыслы."
        source: { kind: authored }
      - pl: "Chcę zgłębić tę teorię."
        ru: "Я хочу досконально изучить эту теорию."
        source: { kind: authored }
      - pl: "Nikt nie zgłębił tej tajemnicy."
        ru: "Никто не постиг этой тайны."
        source: { kind: authored }
  - id: study-deeply
    ru: "углубиться в (предмет, тему)"
    examples:
      - pl: "Zgłębił temat przez lata pracy."
        ru: "Он углубился в тему за годы работы."
        source: { kind: authored }
      - pl: "Warto zgłębić gramatykę."
        ru: "Стоит углубиться в грамматику."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Книжное слово. Значит не просто «изучить», а «дойти до глубины, постичь»." }
  - { kind: government, text: "Винительный падеж: zgłębić temat «углубиться в тему», zgłębić tajemnicę «постичь тайну»." }
  - { kind: false-friend, text: "Корень głąb/głębia «глубина» — тот же, что в карточке głąb и в русском «глубь», «углубить»." }
  - { kind: usage, text: "Несовершенный вид — zgłębiać. В корпусе нет примеров, поэтому все они составлены вручную." }
collocations:
  - { pl: "zgłębić temat", ru: "углубиться в тему" }
  - { pl: "zgłębić tajemnicę", ru: "постичь тайну" }
etymology: "z- + głębia «глубина», праславянское *glǫbь; ср. русское «глубь», «углубить»."
memory: "zgłębić — «постичь, дойти до глубины». Корень тот же, что у głąb «глубина» и русского «глубь». Несовершенный вид — zgłębiać."
idioms:
  - { pl: "zgłębić temat", ru: "углубиться в тему" }
