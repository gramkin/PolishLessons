# review
id: roznica
format: 2
lemma: "różnica"
rank: 1002
pos: noun
pron: { cyr: "ру́жница" }
senses:
  - id: difference
    ru: "разница, различие"
    examples:
      - pl: "Jaka jest różnica?"
        ru: "В чём разница?"
        source: { kind: translated, id: 7783274 }
      - pl: "To jest zasadnicza różnica."
        ru: "Это принципиальная разница."
        source: { kind: translated, id: 13084350 }
      - pl: "Jaka jest różnica między stołem a krzesłem?"
        ru: "В чём разница между столом и стулом?"
        source: { kind: translated, id: 12137894 }
  - id: matter
    ru: "robić różnicę — иметь значение"
    note: "To nie robi różnicy буквально «это не делает разницы» — по-русски «это неважно»."
    examples:
      - pl: "To nie robi różnicy."
        ru: "Это не имеет значения."
        source: { kind: translated, id: 7783275 }
      - pl: "To nie robi żadnej różnicy."
        ru: "Это не имеет никакого значения."
        source: { kind: translated, id: 1148076 }
      - pl: "Nie widzę żadnej różnicy."
        ru: "Я не вижу никакой разницы."
        source: { kind: translated, id: 7783277 }
  - id: with-difference
    ru: "z tą różnicą, że — с той разницей, что"
    examples:
      - pl: "Matematycy są poetami, z tą różnicą, że muszą udowodnić to, co tworzy ich wyobraźnia."
        ru: "Математики — поэты, с той разницей, что им приходится доказывать то, что создаёт их воображение."
        source: { kind: translated, id: 692387 }
      - pl: "Między naszymi poglądami są fundamentalne różnice."
        ru: "Между нашими взглядами есть принципиальные различия."
        source: { kind: translated, id: 356890 }
      - pl: "Duński, norweski i szwedzki to języki, które mają o wiele więcej podobieństw, niż różnic."
        ru: "Датский, норвежский и шведский — языки, у которых куда больше сходств, чем различий."
        source: { kind: translated, id: 3520308 }
notes:
  - { kind: government, text: "różnica MIĘDZY czymś A czymś — «разница между чем-то и чем-то». Обратите внимание на a, а не i: różnica między stołem a krzesłem." }
  - { kind: usage, text: "to nie robi różnicy — «это не имеет значения», буквально «не делает разницы». А robić różnicę значит «иметь значение, менять дело»." }
  - { kind: usage, text: "bez różnicy — «без разницы», совпадает с русским дословно." }
  - { kind: usage, text: "Слово образовано от różny «разный»: праславянское *rǫzьnъ дало и русское «разный», так что пара строится одинаково." }
collocations:
  - { pl: "jaka jest różnica?", ru: "в чём разница?" }
  - { pl: "bez różnicy", ru: "без разницы" }
  - { pl: "robić różnicę", ru: "иметь значение" }
  - { pl: "różnica między", ru: "разница между" }
family:
  - { pl: "różny", ru: "разный", relation: root, id: rozny }
  - { pl: "różnić się", ru: "отличаться", relation: derived }
  - { pl: "różnorodny", ru: "разнообразный", relation: derived }
etymology: "От różny «разный», праславянское *rǫzьnъ — то же слово, что русское «разный». «Разница» и różnica собраны от прилагательного одинаково."
memory: "różnica — «разница». Запомните два оборота: różnica MIĘDZY czymś A czymś (между… a…, а не «и») и to nie robi różnicy «это не имеет значения»."
idioms:
