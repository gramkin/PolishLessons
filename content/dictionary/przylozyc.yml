notes:
  - { kind: false-friend, text: "PRZYŁOŻYĆ почти совпадает с русским «приложить», но в разговоре есть и неожиданное значение — «врезать»: PRZYŁOŻYĆ KOMUŚ. PRZYŁOŻYĆ SIĘ DO CZEGOŚ — «налечь, постараться», а PRZYŁOŻONY UCZEŃ — «старательный ученик». Русское «приложение» к письму — ZAŁĄCZNIK, а приложение в телефоне — APLIKACJA." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное PRZYŁOŻONY и деепричастие PRZYŁOŻYWSZY. Повелительное с чередованием O → Ó: PRZYŁÓŻ, PRZYŁÓŻMY. Видовой партнёр — PRZYKŁADAĆ: PRZYKŁADAĆ WAGĘ DO CZEGOŚ, «придавать значение»." }
  - { kind: government, text: "Что к чему — винительный и DO с родительным: PRZYŁOŻYĆ KOMPRES DO RANY. Возвратное PRZYŁOŻYĆ SIĘ DO — «налечь на»: PRZYŁOŻYĆ SIĘ DO PRACY. Кому врезать — дательный: PRZYŁOŻYĆ KOMUŚ. Приложить руку — PRZYŁOŻYĆ RĘKĘ DO CZEGOŚ." }
  - { kind: pronunciation, text: "Читается «пшыуо́жыць», четыре слога, ударение на предпоследнем. PRZY — «пшы», Ł — короткое «у», Ż твёрдое — «жы». Повелительное PRZYŁÓŻ — «пшы́ууш», с глухим «ш» на конце." }
  - { kind: register, text: "«Приложить» — нейтрально. PRZYŁOŻYĆ SIĘ — разговорное и школьное: PRZYŁÓŻ SIĘ! «постарайся!». «Врезать» — грубоватое разговорное. В спорте PRZYŁOŻYĆ — «сильно пробить»: PRZYŁOŻYŁ Z DYSTANSU." }
collocations:
  - { pl: "przyłożyć lód", ru: "приложить лёд" }
  - { pl: "przyłożyć się do nauki", ru: "налечь на учёбу" }
  - { pl: "przyłożyć rękę do czegoś", ru: "приложить руку к чему-то" }
family:
  - { pl: "przykładać", ru: "прикладывать", relation: aspect }
  - { pl: "położyć", ru: "положить", relation: root, id: polozyc }
  - { pl: "przykład", ru: "пример", relation: root, id: przyklad }
etymology: "Приставка PRZY- «при-» плюс ŁOŻYĆ «класть», праславянское *ložiti, то же, что русское «ложить», «приложить». Польское Ł на месте русского «л», как в ŁOŻE — «ложе»."
memory: "Przyłożyć — приложить: lód do czoła. Przyłożyć się — постараться: przyłóż się do nauki! В разговоре — врезать. Przyłóż — с Ó. Читается «пшыуо́жыць»."
idioms:
  - { pl: "przyłożyć rękę do czegoś", ru: "приложить руку к чему-то" }
