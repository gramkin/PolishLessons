notes:
  - { kind: false-friend, text: "ШКОЛЬНЫЕ ОЦЕНКИ В ПОЛЬШЕ ИДУТ ОТ ЕДИНИЦЫ ДО ШЕСТЁРКИ, И ЭТО ЛОВУШКА. Высшая оценка — 6, celujący «отличный», затем 5 bardzo dobry, 4 dobry, 3 dostateczny, 2 dopuszczający и 1 niedostateczny, то есть двойка. Русская пятибалльная шкала с ней не совпадает: польская пятёрка это «хорошо с плюсом», а не высший балл." }
  - { kind: usage, text: "Предложный — OCENIE, с мягким ni. Оборот W OCENIE kogoś значит «по мнению, по оценке кого-л.»: w ocenie rządu. Глаголы — oceniać несовершенного вида и ocenić совершенного, «выставить оценку» — wystawić ocenę." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: o-CE-na. Польское c читается как ц, e открытое: «оцэ́на». В форме ocenie слышно мягкое «оцэ́не»." }
collocations:
  - { pl: "wystawić ocenę", ru: "выставить оценку" }
  - { pl: "w ocenie ekspertów", ru: "по оценке экспертов" }
  - { pl: "ocena celująca", ru: "отличная оценка" }
family:
  - { pl: "oceniać", ru: "оценивать", relation: derived }
  - { pl: "cena", ru: "цена", relation: root, id: cena }
  - { pl: "stopień", ru: "отметка; степень", relation: root, id: stopien }
etymology: "От o- и cena «цена», из праславянского *cěna, того же, что русское «цена». Русская «оценка» собрана ровно из тех же частей: приставка плюс «цена». Корень дальше родствен литовскому kaina «цена» и греческому poine «кара, выкуп»."
memory: "ocena — «оценка», от cena «цена», как и по-русски. Но школьная шкала другая: высший балл 6, а не 5. Предложный ocenie, и оборот w ocenie kogoś значит «по мнению кого-л.»."
idioms:
  - { pl: "w ocenie ekspertów", ru: "по оценке экспертов" }
  - { pl: "poprawić ocenę", ru: "исправить оценку" }
