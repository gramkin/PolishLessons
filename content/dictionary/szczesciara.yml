notes:
  - { kind: false-friend, text: "SZCZĘŚCIARA — «счастливица, везунчик» о женщине; о мужчине — SZCZĘŚCIARZ. Счастливый человек вообще — SZCZĘŚLIWY. Везунчик в разговоре — FARCIARZ." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном R переходит в RZ: SZCZĘŚCIARZE. Звательный — SZCZĘŚCIARO: TY SZCZĘŚCIARO!" }
  - { kind: government, text: "Быть счастливицей — BYĆ SZCZĘŚCIARĄ, творительный. Повезло — SZCZĘŚCIARA Z NIEJ, «вот она везучая»." }
  - { kind: pronunciation, text: "Читается «шчэньсьця́ра»: SZCZ — «шч», ĘŚ — «эньсь», CIA — «ця». Ударение на предпоследнем слоге." }
collocations:
