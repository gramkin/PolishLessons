# review
id: okropny
format: 2
lemma: "okropny"
rank: 901
pos: adj
pron: { cyr: "окро́пны" }
senses:
  - id: awful
    ru: "ужасный, отвратительный"
    examples:
      - pl: "Wiem, że to okropne."
        ru: "Я знаю, что это ужасно."
        source: { kind: tatoeba, id: 3461125 }
      - pl: "Okropna pogoda!"
        ru: "Ужасная погода!"
        source: { kind: translated, id: 8608764 }
      - pl: "Jesteś okropny."
        ru: "Ты ужасный."
        source: { kind: translated, id: 5664903 }
  - id: about-things
    ru: "об обстоятельствах и вещах"
    examples:
      - pl: "Złapałem okropne przeziębienie."
        ru: "Я схватил ужасную простуду."
        source: { kind: tatoeba, id: 624775 }
      - pl: "Rak jest okropną chorobą."
        ru: "Рак — ужасная болезнь."
        source: { kind: translated, id: 5956214 }
      - pl: "Miałem okropną noc."
        ru: "У меня была ужасная ночь."
        source: { kind: translated, id: 6159639 }
  - id: something-awful
    ru: "coś okropnego — что-то ужасное"
    examples:
      - pl: "Stanie się coś okropnego."
        ru: "Случится что-то ужасное."
        source: { kind: tatoeba, id: 3603509 }
      - pl: "Stało się coś okropnego."
        ru: "Случилось что-то ужасное."
        source: { kind: translated, id: 6306776 }
      - pl: "Jestem okropnym tancerzem."
        ru: "Я ужасный танцор."
        source: { kind: tatoeba, id: 2287442 }
notes:
  - { kind: usage, text: "Близкий синоним — straszny «страшный, ужасный». Разница тонкая: straszny чаще о том, что пугает, okropny — о том, что отвратительно или невыносимо. Okropna pogoda «отвратительная погода», но straszny sen «страшный сон»." }
  - { kind: usage, text: "Наречие — okropnie «ужасно», и, как strasznie, оно работает усилителем: okropnie zmęczony «ужасно усталый»." }
  - { kind: usage, text: "Существительное okropność значит «ужас, мерзость», чаще во множественном: okropności wojny «ужасы войны»." }
  - { kind: usage, text: "Степень сравнения образуется аналитически: bardziej okropny. Формы okropniejszy в живой речи почти не встречаются." }
collocations:
  - { pl: "okropna pogoda", ru: "отвратительная погода" }
  - { pl: "coś okropnego", ru: "что-то ужасное" }
  - { pl: "okropnie zmęczony", ru: "ужасно усталый" }
  - { pl: "okropności wojny", ru: "ужасы войны" }
family:
  - { pl: "okropnie", ru: "ужасно", relation: derived }
  - { pl: "okropność", ru: "ужас, мерзость", relation: derived }
  - { pl: "straszny", ru: "страшный", relation: root, id: straszny }
etymology: "Старое польское слово; прямого родственника в русском у него нет, так что okropny приходится запоминать отдельно."
memory: "okropny — «ужасный, отвратительный». Рядом живёт straszny «страшный»: straszny чаще о том, что пугает, okropny — о том, что невыносимо. Наречие okropnie работает усилителем, как и strasznie: okropnie zmęczony «ужасно усталый»."
