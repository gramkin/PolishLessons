notes:
  - { kind: false-friend, text: "ОДНО ПОЛЬСКОЕ СЛОВО НА ДВА РУССКИХ ГЛАГОЛА. Przejechać значит и «ПРОЕХАТЬ» (przejechać sto kilometrów, przejechać przystanek), и «ПЕРЕЕХАТЬ» в страшном смысле — сбить машиной: samochód przejechał psa. Русский разводит это по приставкам «про-» и «пере-», польский обходится одной. Понять, о чём речь, помогает дополнение: расстояние или живое существо." }
  - { kind: pronunciation, text: "КРАЯ ПАРАДИГМЫ СНОВА ВЕДУТ СЕБЯ ОСОБО. Первое лицо единственного и третье множественного берут основу jad-: przejadę, przejadą. Все клетки между ними берут jedzi-: przejedziesz, przejedzie, przejedziemy, przejedziecie. То же у самого jechać: jadę, jadą, но jedziesz. Русский делает похожее в «еду — едешь»." }
  - { kind: government, text: "Проезжают ЧТО — винительный без предлога, когда речь о расстоянии или пропущенной остановке: przejechać sto kilometrów, przejechać przystanek. ЧЕРЕЗ что — przez с винительным: przejechać przez most, przez miasto. Сбивают КОГО — тоже винительный: przejechać psa, przejechać pieszego." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — przejeżdżać. Страдательное причастие przejechany употребляется прежде всего во втором значении: przejechany pies, przejechany rowerzysta. Возвратное przejechać się значит «прокатиться»: przejechać się rowerem, а в переносном смысле przejechać się na kimś — «обжечься на ком-то»." }
collocations:
  - { pl: "przejechać przystanek", ru: "проехать остановку" }
  - { pl: "przejechać przez most", ru: "проехать через мост" }
  - { pl: "przejechać się rowerem", ru: "прокатиться на велосипеде" }
family:
  - { pl: "jechać", ru: "ехать", relation: root, id: jechac }
  - { pl: "przejazd", ru: "проезд, переезд", relation: derived }
  - { pl: "przejeżdżać", ru: "проезжать", relation: aspect }
etymology: "Приставка prze- плюс jechać «ехать», общеславянский корень, тот же, что в русском «ехать». Польская приставка prze- отвечает и русскому «про-», и «пере-», отчего один глагол и покрывает оба смысла. Отсюда przejazd «проезд, переезд» и przejażdżka «поездка, прогулка»."
memory: "przejechać — и «проехать» (przejechać przystanek), и «переехать, сбить» (samochód przejechał psa): польская приставка prze- отвечает сразу двум русским. Формы по краям парадигмы: przejadę, przejadą, но przejedziesz."
idioms:
  - { pl: "przejechać przystanek", ru: "проехать свою остановку" }
  - { pl: "przejechać się na kimś", ru: "обжечься на ком-л." }
