# review
id: nawilzac
format: 2
lemma: "nawilżać"
rank: 6050
pos: verb
aspect: imperf
pron: { cyr: "навильжа́ць" }
senses:
  - id: moisturise
    ru: "увлажнять (кожу, воздух, почву)"
    examples:
      - pl: "Ten krem dobrze nawilża skórę."
        ru: "Этот крем хорошо увлажняет кожу."
        source: { kind: authored }
      - pl: "Zimą nawilżam powietrze w sypialni."
        ru: "Зимой я увлажняю воздух в спальне."
        source: { kind: authored }
      - pl: "Mgła nawilża glebę lepiej niż krótki deszcz."
        ru: "Туман увлажняет почву лучше, чем короткий дождь."
        source: { kind: authored }
  - id: dampen
    ru: "смачивать, слегка мочить"
    examples:
      - pl: "Przed prasowaniem nawilżała bieliznę wodą."
        ru: "Перед глажкой она сбрызгивала бельё водой."
        source: { kind: authored }
      - pl: "Nawilżaj gąbkę, zanim zaczniesz myć."
        ru: "Смачивай губку, прежде чем начнёшь мыть."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид, пара — NAWILŻYĆ. Главное употребление — косметика и быт: krem nawilżający, «увлажняющий крем», nawilżacz powietrza, «увлажнитель воздуха», CHUSTECZKI NAWILŻANE — «влажные салфетки» (буквально «увлажнённые»)." }
  - { kind: false-friend, text: "Корень WILG- тот же, что в русском «влага», «влажный», только звуки в нём стоят в другом порядке: WILGOTNY, «влажный», WILGOĆ, «сырость». Узнать «влагу» в NAWILŻAĆ помогает именно эта перестановка." }
  - { kind: pronunciation, text: "«навильжа́ць»: L перед Ż — мягкое «ль», Ż — «ж», конечное Ć — «ць». Ударение на предпоследнем слоге ŻA." }
  - { kind: register, text: "Нейтральное: реклама косметики, инструкции, медицина. В быту чаще ZWILŻAĆ, «смачивать», о губке, губах, пальце." }
collocations:
  - { pl: "krem nawilżający", ru: "увлажняющий крем" }
  - { pl: "chusteczki nawilżane", ru: "влажные салфетки" }
  - { pl: "nawilżać powietrze", ru: "увлажнять воздух" }
  - { pl: "nawilżać skórę", ru: "увлажнять кожу" }
family:
  - { pl: "nawilżyć", ru: "увлажнить", relation: aspect }
  - { pl: "wilgotny", ru: "влажный", relation: root }
  - { pl: "nawilżacz", ru: "увлажнитель", relation: derived }
etymology: "От NA- и WILŻYĆ, «увлажнять», от WILGA-, «влага»: праславянское *vьlga, то же, что русское «влага» (с перестановкой) и польское WILGOĆ, «сырость». NAWILŻAĆ — «наводить влагу на что-то»."
memory: "Nawilżać — увлажнять, корень wilg- = «влага»: wilgotny — влажный. Krem nawilżający — увлажняющий крем, chusteczki nawilżane — влажные салфетки. Пара — nawilżyć."
idioms:
  - { pl: "chusteczki nawilżane", ru: "влажные салфетки" }
formExamplesSkip:
  - { form: "nawilżani", reason: "мужско-личная форма страдательного причастия: увлажняют кожу, воздух, ткань, а не людей" }
