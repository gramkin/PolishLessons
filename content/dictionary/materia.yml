# review
id: materia
format: 2
lemma: "materia"
rank: 4601
pos: noun
pron: { cyr: "матэ́рья" }
senses:
  - id: matter-cloth
    ru: "материя (вещество); ткань"
    examples:
      - pl: "Fizyka bada materię i energię."
        ru: "Физика изучает материю и энергию."
        source: { kind: authored }
      - pl: "Suknia była uszyta z drogiej materii."
        ru: "Платье было сшито из дорогой ткани."
        source: { kind: authored }
      - pl: "Materia składa się z atomów."
        ru: "Материя состоит из атомов."
        source: { kind: authored }
  - id: subject
    ru: "вопрос, предмет, тема (книжн.)"
    examples:
      - pl: "W tej materii nie mam nic do powiedzenia."
        ru: "В этом вопросе мне нечего сказать."
        source: { kind: authored }
      - pl: "To delikatna materia."
        ru: "Это деликатная тема."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MATERIA — и «материя» философов и физиков, и просто ткань: KAWAŁEK MATERII — кусок ткани. В книжной речи это ещё «вопрос, предмет»: W TEJ MATERII — «в этом вопросе», DELIKATNA MATERIA — «деликатная тема». В быту ткань чаще называют MATERIAŁ." }
  - { kind: usage, text: "Десять форм в таблице, женский род. Родительный, дательный и местный единственного и родительный множественного совпадают: MATERII. Множественное MATERIE значит «ткани» или «вопросы»: W TYCH MATERIACH. Старинная форма MATERYJ и звательная MATERIO не нужны." }
  - { kind: government, text: "В этом вопросе — W TEJ MATERII, местный. Из какой ткани — Z JAKIEJ MATERII, родительный. Знаток в каком-то вопросе — ZNAWCA W TEJ MATERII." }
  - { kind: pronunciation, text: "Читается «матэ́рья», три слога, ударение на втором: RIA в конце звучит одним слогом, «рья», как в MATERIAŁ «матэрья́у». E после T твёрдое, «э»." }
  - { kind: register, text: "TAK KRAWIEC KRAJE, JAK MU MATERII STAJE, «как портной кроит, так ему ткани хватит», — старая пословица о том, что жить надо по средствам: наше «по одёжке протягивай ножки». W TEJ MATERII — книжный, слегка официальный оборот." }
collocations:
  - { pl: "materia nieożywiona", ru: "неживая материя" }
  - { pl: "delikatna materia", ru: "деликатный вопрос" }
  - { pl: "kawałek materii", ru: "кусок ткани" }
family:
  - { pl: "materiał", ru: "материал; ткань", relation: derived, id: material }
  - { pl: "materialny", ru: "материальный", relation: derived }
  - { pl: "materializm", ru: "материализм", relation: derived }
etymology: "Из латинского MATERIA «вещество, строительный материал», от слова MATER «мать». Русский и польский взяли одно слово; значение «ткань» в польском живее, а значение «вопрос, тема» пришло из языка учёных."
memory: "Materia — материя и ткань: kawałek materii. Читается «матэ́рья». W tej materii — в этом вопросе. Tak krawiec kraje, jak mu materii staje — по одёжке протягивай ножки."
idioms:
  - { pl: "tak krawiec kraje, jak mu materii staje", ru: "по одёжке протягивай ножки" }
  - { pl: "w tej materii", ru: "в этом вопросе" }
formExamplesSkip:
  - { form: "materyj", reason: "архаичная форма родительного множественного; сейчас MATERII" }
  - { form: "materio", reason: "звательная форма; на практике не употребляется" }
