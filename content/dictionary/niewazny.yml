# review
id: niewazny
format: 2
lemma: "nieważny"
rank: 674
pos: adj
pron: { cyr: "нева́жны" }
senses:
  - id: unimportant
    ru: "неважный, несущественный"
    note: "Среднее nieważne работает самостоятельно: To nieważne."
    examples:
      - pl: "To nieważne."
        ru: "Это не важно."
        source: { kind: tatoeba, id: 364536 }
      - pl: "Nieważne czy przyjdzie czy nie."
        ru: "Неважно, придёт он или нет."
        source: { kind: tatoeba, id: 393056 }
      - pl: "Nieważne."
        ru: "Неважно."
        source: { kind: translated, id: 348671 }
  - id: invalid
    ru: "недействительный (о документе)"
    note: "Значения, которого у русского «неважный» нет."
    examples:
      - pl: "Mój paszport jest już nieważny."
        ru: "Мой паспорт уже недействителен."
        source: { kind: translated, id: 6099854 }
      - pl: "Umowa jest nieważna, jeżeli podpis został wymuszony."
        ru: "Договор недействителен, если подпись была вынуждена."
        source: { kind: translated, id: 352706 }
      - pl: "Ta obligacja jest kompletnie nieważna."
        ru: "Эта облигация совершенно недействительна."
        source: { kind: translated, id: 837086 }
notes:
  - { kind: false-friend, text: "Главное здесь второе значение, незнакомое русскому «неважный»: nieważny paszport — это «недействительный паспорт», nieważna umowa — «недействительный договор»." }
  - { kind: usage, text: "Причина в положительной форме: ważny значит сразу «важный» и «действительный» — от waga «вес», то есть «имеющий силу». Bilet ważny do jutra «билет действителен до завтра»." }
  - { kind: usage, text: "Средний род nieważne работает самостоятельно как «неважно»: To nieważne, Nieważne, czy przyjdzie." }
  - { kind: usage, text: "Разговорное Nieważne! закрывает тему: «Неважно, проехали»." }
collocations:
  - { pl: "To nieważne", ru: "Это неважно" }
  - { pl: "Nieważne!", ru: "Неважно, проехали!" }
  - { pl: "nieważny paszport", ru: "недействительный паспорт" }
  - { pl: "ważny", ru: "важный; действительный" }
family:
  - { pl: "ważny", ru: "важный; действительный", relation: root }
  - { pl: "waga", ru: "вес", relation: root }
  - { pl: "ważność", ru: "срок действия", relation: derived }
etymology: "Приставка nie- плюс ważny «важный», от waga «вес» — то же гнездо, что русские «важный» и «вага». Значение «действительный» выросло из «имеющий вес, силу»."
memory: "nieważny — «неважный», но главное здесь второе значение, которого у русского слова нет: «недействительный». Mój paszport jest już nieważny, umowa nieważna. Причина в том, что и ważny значит сразу «важный» и «действительный» — от waga «вес», то есть «имеющий силу». А разговорное Nieważne! просто закрывает тему: «Неважно, проехали»."
idioms:
  - { pl: "To nieważne", ru: "Это неважно" }
  - { pl: "Nieważne!", ru: "Неважно, проехали!" }
  - { pl: "nieważny paszport", ru: "недействительный паспорт" }
formExamplesSkip:
