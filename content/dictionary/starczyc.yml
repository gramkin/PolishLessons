# review
id: starczyc
format: 2
lemma: "starczyć"
rank: 5031
pos: verb
pron: { cyr: "ста́рчыць" }
senses:
  - id: suffice
    ru: "хватить, быть достаточным"
    examples:
      - pl: "Starczy nam jedzenia na tydzień."
        ru: "Нам хватит еды на неделю."
        source: { kind: authored }
      - pl: "Pieniędzy starczyło tylko na bilet."
        ru: "Денег хватило только на билет."
        source: { kind: authored }
      - pl: "Nie starczyło czasu na obiad."
        ru: "Времени на обед не хватило."
        source: { kind: authored }
  - id: enough
    ru: "STARCZY! — хватит!, довольно!"
    examples:
      - pl: "Starczy już tego gadania!"
        ru: "Хватит уже этой болтовни!"
        source: { kind: authored }
      - pl: "Starczy, nie chcę więcej słuchać."
        ru: "Довольно, я больше не хочу слушать."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STARCZYĆ — «хватить», а не «стареть» (STARZEĆ SIĘ) и не «старик» (STARZEC). Близкий синоним — WYSTARCZYĆ; STARCZYĆ чуть разговорнее. Отдельное восклицание STARCZY! — «хватит!»." }
  - { kind: usage, text: "Совершенный вид. Употребляется почти только в третьем лице: STARCZY, STARCZĄ, STARCZYŁO. Формы первого и второго лица, повелительное, причастие и отглагольное существительное в живой речи не встречаются и в карточку не включены. Несовершенный вид — STARCZAĆ." }
  - { kind: government, text: "Чего — родительный: STARCZY PIENIĘDZY. Кому — дательный: STARCZY MI. На что — NA с винительным: STARCZY NA CZYNSZ. Можно и с подлежащим: TEN CHLEB STARCZY NA DWA DNI." }
  - { kind: pronunciation, text: "Читается «ста́рчыць»: RCZ — «рч», без «ж», потому что R и CZ здесь разные звуки. Ударение на предпоследнем слоге. STARCZY — «ста́рчы»." }
  - { kind: register, text: "Разговорно-нейтральное слово. В письменной речи чаще WYSTARCZYĆ. Восклицание STARCZY! — бытовое и резковатое." }
collocations:
  - { pl: "starczy na życie", ru: "хватает на жизнь" }
  - { pl: "starczy czasu", ru: "хватит времени" }
  - { pl: "starczy tego", ru: "хватит этого" }
family:
  - { pl: "wystarczyć", ru: "хватить, быть достаточным", relation: derived, id: wystarczyc }
  - { pl: "starczać", ru: "хватать", relation: aspect }
  - { pl: "zabraknąć", ru: "не хватить", relation: antonym, id: zabraknac }
etymology: "Происхождение спорно. Тот же корень в DOSTARCZYĆ «доставить, снабдить» и WYSTARCZYĆ «хватить». Связь со STARY «старый» иногда предполагают, но она не доказана."
memory: "Starczyć — хватить: starczy nam na tydzień. Starczy! — хватит! Не путать со starzeć się «стареть»."
idioms:
  - { pl: "starczy za dwóch", ru: "хватит на двоих, стоит двоих" }
