etymology: "От PODEJRZEĆ, из приставки POD- и корня -JRZEĆ, восходящего к праславянскому *zьrěti «смотреть, зреть» — тому же, что в UJRZEĆ, SPOJRZEĆ, WEJRZENIE и в русских «зреть», «взор», «зрение». Буквальный смысл сложения — «посмотреть снизу», то есть исподтишка, искоса, и из этого взгляда выросло подозрение. Русское «подозрение» построено точно так же, из «подо-» и «зреть», и образ в двух языках один. Это один из самых чистых случаев параллельной сборки в словаре: не заимствование и не калька, а одинаковое решение одной задачи из общего материала. Суффикс -ENIE отвечает русскому -ЕНИЕ, только читается одним слогом, отчего польское слово короче."
memory: "Собрано как русское «подозрение»: pod- плюс корень -jrzeć «зреть», то есть «посмотреть снизу» — ровно «подо-» плюс «зреть». Не заимствование, а одинаковое решение из общего материала. Управление расходится: podejrzenie zapalenia płuc, родительный, где русский берёт предлог «на». Восемь форм, родительный множественного podejrzeń. Конечное -nie читается одним слогом, поэтому слово короче русского."
