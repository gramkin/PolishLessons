notes:
  - { kind: false-friend, text: "Значение совпадает с русским «подозрением», и совпадает не случайно: слова собраны из одинаковых частей. PODEJRZENIE идёт от PODEJRZEĆ, из приставки POD- и корня -JRZEĆ, того же, что в UJRZEĆ «увидеть» и в SPOJRZEĆ «взглянуть». Буквально это «посмотреть снизу, исподтишка». Русское «подозрение» собрано из «подо-» и «зреть» — того же корня «зрения», и образ там тот же самый: взгляд снизу. Так что два языка независимо назвали подозрение подглядыванием. Разница только в управлении: PODEJRZENIE CZEGOŚ в родительном, PODEJRZENIE ZAPALENIA PŁUC, тогда как русский говорит «подозрение на воспаление», с предлогом." }
  - { kind: government, text: "Средний род на -NIE, восемь форм. Именительный и винительный PODEJRZENIE, родительный PODEJRZENIA, дательный и местный PODEJRZENIU, творительный PODEJRZENIEM, родительный множественного PODEJRZEŃ без окончания и с мягким Ń, дальше PODEJRZENIOM, PODEJRZENIAMI, PODEJRZENIACH. На кого падает — предлог NA с винительным: PODEJRZENIE PADŁO NA NIEGO. Чего подозрение — родительный без предлога: PODEJRZENIE OSZUSTWA, PODEJRZENIE ZAPALENIA. Быть под подозрением — предлог POD с творительным: BYĆ POD PODEJRZENIEM." }
  - { kind: pronunciation, text: "Читается «подэйже́не», ударение на предпоследнем слоге из четырёх. Сочетание RZ даёт «ж», а предшествующее J читается как «й», поэтому середина слова звучит «дэйже». Конечное -NIE произносится «не» одним слогом, с мягким н, а не «ние» в два слога — поэтому польское слово на слог короче русского «подозрения». В родительном множественного PODEJRZEŃ три слога и конечное Ń мягкое: «подэйжень»." }
  - { kind: usage, text: "Частотные сочетания: PODEJRZENIE PADŁO NA KOGOŚ, BYĆ POD PODEJRZENIEM «быть под подозрением», MIEĆ PODEJRZENIA «иметь подозрения», PODEJRZENIE O KRADZIEŻ — здесь уже с предлогом O и винительным, и это второй способ управления. В медицинском языке стоит родительный: PODEJRZENIE ZŁAMANIA «подозрение на перелом». Прилагательное PODEJRZANY значит «подозрительный» и употребляется как существительное в значении «подозреваемый»: ZATRZYMANO PODEJRZANEGO. Глагол PODEJRZEWAĆ «подозревать» требует винительного лица и предлога O: PODEJRZEWAĆ KOGOŚ O COŚ." }
