# review
id: stan
format: 2
lemma: "stan"
rank: 406
pos: noun
pron: { cyr: "стан" }
senses:
  - id: condition
    ru: "состояние"
    examples:
      - pl: "Ten miecz jest w dobrym stanie."
        ru: "Этот меч в хорошем состоянии."
        source: { kind: tatoeba, id: 2202234 }
      - pl: "Byłem zaniepokojony stanem twojego zdrowia."
        ru: "Я был обеспокоен состоянием твоего здоровья."
        source: { kind: translated, id: 603041 }
      - pl: "Jego stan się poprawił."
        ru: "Его состояние улучшилось."
        source: { kind: authored }
  - id: able
    ru: "состояние в обороте być w stanie «быть в состоянии, мочь»"
    examples:
      - pl: "Nie jestem w stanie tego zrozumieć."
        ru: "Я не в состоянии это понять."
        source: { kind: tatoeba, id: 948172 }
      - pl: "Wiem, że będziemy w stanie to zrobić."
        ru: "Я знаю, что мы сможем это сделать."
        source: { kind: tatoeba, id: 6603368 }
      - pl: "Nie jestem w stanie zapłacić za czynsz."
        ru: "Я не в состоянии платить мою арендную плату."
        source: { kind: tatoeba, id: 3656758 }
notes:
  - { kind: false-friend, text: "Форма stanie чаще всего вообще не это существительное, а глагол stać się: Stanie się coś okropnego «Случится что-то ужасное». Существительное в этой форме значит «в состоянии»: w dobrym stanie." }
  - { kind: false-friend, text: "Формы Stany, Stanów, Stanach в живой речи почти всегда означают Stany Zjednoczone «США»: Jadę do Stanów «Еду в Штаты»." }
  - { kind: usage, text: "być w stanie coś zrobić — «быть в состоянии что-то сделать», самый частый оборот со словом: Nie jestem w stanie «Я не в состоянии»." }
  - { kind: usage, text: "stan wojenny — «военное положение», stan cywilny — «семейное положение»." }
collocations:
  - { pl: "być w stanie", ru: "быть в состоянии" }
  - { pl: "w dobrym stanie", ru: "в хорошем состоянии" }
  - { pl: "stan wojenny", ru: "военное положение" }
  - { pl: "stan zdrowia", ru: "состояние здоровья" }
etymology: "От stać «стоять», праславянское *stanъ. Русское «стан» — то же слово, и значения отчасти сошлись: и там, и там это «положение»."
memory: "stan — «состояние», от stać «стоять», родня русскому «стан». Главный оборот — być w stanie «быть в состоянии»: Nie jestem w stanie. И две ловушки: stanie обычно глагол «случится», а Stany — это Штаты."
idioms:
  - { pl: "być w stanie", ru: "быть в состоянии" }
  - { pl: "stan wojenny", ru: "военное положение" }
  - { pl: "stan cywilny", ru: "семейное положение" }
