  - id: sport
    ru: "прыжок (вид спорта)"
    examples:
      - pl: "Skok w dal wygrał Polak."
        ru: "Прыжок в длину выиграл поляк."
        source: { kind: authored }
      - pl: "Skoki narciarskie są tu sportem narodowym."
        ru: "Прыжки с трамплина здесь национальный спорт."
        source: { kind: authored }
  - id: surge
    ru: "скачок (цен, температуры)"
    examples:
      - pl: "Nastąpił skok cen paliwa."
        ru: "Произошёл скачок цен на топливо."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "КОРЕНЬ ТОТ ЖЕ, ЧТО В РУССКОМ «СКОК» И «СКАКАТЬ», НО ПОЛЬСКОЕ СЛОВО ОБЫЧНОЕ, А РУССКОЕ НЕТ. Русский «скок» звучит устарело или просторечно, обычное слово — «прыжок» и «скачок». Польское skok нейтрально и покрывает оба: skok w dal «прыжок в длину» и skok cen «скачок цен»." }
  - { kind: usage, text: "Зимний спорт, которым Польша живёт, называется SKOKI NARCIARSKIE — «прыжки на лыжах с трамплина», во множественном. Прыжок с шестом — skok o tyczce, с предлогом o. А в криминальном жаргоне skok na bank значит «налёт на банк», как русское «взять банк»." }
  - { kind: pronunciation, text: "Один слог: скок. Читается в точности как русское слово, с твёрдым к на конце. Предложный skoku звучит «ско́ку», с ударением на первом слоге." }
collocations:
  - { pl: "skok w dal", ru: "прыжок в длину" }
  - { pl: "skoki narciarskie", ru: "прыжки с трамплина" }
  - { pl: "skok cen", ru: "скачок цен" }
family:
  - { pl: "skakać", ru: "скакать, прыгать", relation: root, id: skakac }
  - { pl: "skoczyć", ru: "прыгнуть", relation: aspect, id: skoczyc }
  - { pl: "upadek", ru: "падение", relation: antonym }
etymology: "От skakać «прыгать», из праславянского *skokъ и *skakati. Русские «скок», «скакать», «скачок» — те же слова. Чередование o/a в корне то же, что в польском skoczyć и skakać, то есть вид различается огласовкой."
memory: "skok — «прыжок» и «скачок» разом, от skakać «скакать». Русский «скок» устарел, а польское слово самое обычное. Запомни skoki narciarskie — прыжки с трамплина, польский национальный спорт."
idioms:
  - { pl: "skok na bank", ru: "налёт на банк" }
  - { pl: "jednym skokiem", ru: "одним прыжком" }
