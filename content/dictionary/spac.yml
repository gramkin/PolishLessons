# review
id: spac
format: 2
lemma: "spać"
rank: 302
pos: verb
aspect: imperf
pron: { cyr: "спаць" }
senses:
  - id: sleep
    ru: "спать"
    note: "Настоящее время меняет основу: śpię, śpisz, śpi, śpimy, śpicie, śpią."
    examples:
      - pl: "Śpi."
        ru: "Он спит."
        source: { kind: tatoeba, id: 5315937 }
      - pl: "Śpię."
        ru: "Я сплю."
        source: { kind: tatoeba, id: 5013630 }
      - pl: "On śpi."
        ru: "Он спит."
        source: { kind: tatoeba, id: 5013633 }
  - id: slept
    ru: "спать (о прошедшем, в вопросах)"
    examples:
      - pl: "Spałam."
        ru: "Я спала."
        source: { kind: tatoeba, id: 5013632 }
      - pl: "Spałem."
        ru: "Я спал."
        source: { kind: tatoeba, id: 2795698 }
      - pl: "Śpisz?"
        ru: "Спите?"
        source: { kind: tatoeba, id: 3664687 }
notes:
  - { kind: usage, text: "Настоящее время неправильное и его надо выучить: śpię, śpisz, śpi, śpimy, śpicie, śpią. Прошедшее правильное: spałem, spałam, spał, spali." }
  - { kind: usage, text: "iść spać — «идти спать»; Śpij dobrze! — «Спи спокойно!»; nie spać — «не спать, бодрствовать»." }
  - { kind: usage, text: "Причастие śpiący значит «сонный» и «спящий»: Jestem śpiąca «Я сонная», śpiące dziecko «спящий ребёнок»." }
  - { kind: usage, text: "Существительное spanie — «сон, спанье»: Przygotuj się do spania «Готовься ко сну»." }
collocations:
  - { pl: "iść spać", ru: "идти спать" }
  - { pl: "śpij dobrze", ru: "спи спокойно" }
  - { pl: "spać jak kamień", ru: "спать как убитый" }
  - { pl: "nie spać", ru: "не спать" }
etymology: "Праславянское *sъpati — то же слово, что русское «спать»; отсюда же sen «сон»."
memory: "spać — «спать», но настоящее время меняет основу: śpię, śpisz, śpi, śpią. Прошедшее правильное: spałem, spałam. А śpiący значит «сонный»."
idioms:
  - { pl: "spać jak kamień", ru: "спать как убитый" }
  - { pl: "spać jak suseł", ru: "спать без задних ног" }
  - { pl: "iść spać", ru: "идти спать" }
