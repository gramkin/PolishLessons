  - form: "grubymi"
    pl: "Napisał chiński wiersz grubymi kreskami."
    ru: "Он написал китайское стихотворение толстыми линиями."
    source: { kind: translated, id: 10774155 }
  - form: "grubymi"
    pl: "Pluton składa się z dużego skalistego jądra otoczonego grubymi warstwami lodu."
