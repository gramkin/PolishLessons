    pl: "Jesteś grubszy ode mnie"
    ru: "Ты толще меня."
    source: { kind: translated, id: 8427001 }
  - form: "grubszy"
    pl: "Tom jest o wiele grubszy od Marii."
    ru: "Том гораздо толще Марии."
    source: { kind: translated, id: 3452656 }
  - form: "grubszy"
    pl: "Jest grubszy, niż gdy widziałem go ostatnim razem."
    ru: "Он толще, чем когда я видел его в последний раз."
    source: { kind: translated, id: 1076194 }
