  - form: "grube"
    pl: "Wielu amerykańskich polityków zależy od pieniędzy wpłacanych przez grube ryby na ich kampanie wyborcze."
    ru: "Многие американские политики зависят от денег, которые вносят на их кампании большие шишки."
    source: { kind: translated, id: 364773 }
