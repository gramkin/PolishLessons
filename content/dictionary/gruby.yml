    pl: "Siedziałam obok jakiegoś grubego faceta, który zajmował półtora siedzenia, i było mi bardzo niewygodnie."
    ru: "Я сидела рядом с каким-то толстым мужчиной, который занимал полтора сиденья."
    source: { kind: translated, id: 6156387 }
