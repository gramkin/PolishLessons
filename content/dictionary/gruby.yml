# review
id: gruby
format: 2
lemma: "gruby"
rank: 1423
pos: adj
pron: { cyr: "гру́бы" }
senses:
  - id: fat
    ru: "толстый (о человеке)"
    examples:
      - pl: "Jestem gruby."
        ru: "Я толстый."
        source: { kind: tatoeba, id: 2587075 }
      - pl: "Byłam gruba."
        ru: "Я была толстой."
        source: { kind: tatoeba, id: 10570431 }
      - pl: "Nie jestem gruby!"
        ru: "Я не толстый."
        source: { kind: tatoeba, id: 4438862 }
  - id: thick
    ru: "толстый (о предмете), плотный"
    examples:
      - pl: "Ta książka jest bardzo gruba."
        ru: "Эта книга очень толстая."
        source: { kind: tatoeba, id: 8446433 }
      - pl: "Jaka gruba książka!"
        ru: "Какая толстая книга!"
        source: { kind: tatoeba, id: 3479808 }
      - pl: "Lubię grube flanelowe koszule."
        ru: "Я люблю толстые фланелевые рубашки."
        source: { kind: translated, id: 3745255 }
notes:
  - { kind: register, text: "О человеке слово прямое и обидное, как русское «толстый». Вежливее сказать puszysty «пышный» или przy kości «в теле»." }
  - { kind: usage, text: "О предметах слово совершенно нейтрально: gruba książka «толстая книга», gruby sweter «толстый свитер»." }
  - { kind: usage, text: "gruba ryba — «большая шишка», важный человек; grube pieniądze и grubsza gotówka — «большие деньги»." }
  - { kind: usage, text: "Оборот z grubsza значит «в общих чертах, приблизительно»: z grubsza rozumiem «в общих чертах понимаю»." }
collocations:
  - { pl: "gruba książka", ru: "толстая книга" }
  - { pl: "gruba ryba", ru: "большая шишка" }
  - { pl: "z grubsza", ru: "в общих чертах" }
family:
  - { pl: "grubość", ru: "толщина", relation: root }
  - { pl: "grubas", ru: "толстяк", relation: root }
  - { pl: "chudy", ru: "худой", relation: root }
etymology: "Праславянское *grubъ «грубый, толстый» — то же слово, что русское «грубый». В польском значение сместилось к толщине, в русском к манерам."
memory: "gruby — «толстый»: о предмете нейтрально (gruba książka), о человеке прямо и обидно. Вежливее — puszysty. И z grubsza значит «в общих чертах»."
idioms:
  - { pl: "gruba ryba", ru: "большая шишка" }
  - { pl: "grube pieniądze", ru: "большие деньги" }
  - { pl: "z grubsza", ru: "в общих чертах" }
