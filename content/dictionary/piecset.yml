notes:
  - { kind: government, text: "В именительном и винительном требует родительного множественного: pięćset osób «пятьсот человек». В остальных падежах форма одна — pięciuset." }
  - { kind: usage, text: "Пишется слитно, как русское «пятьсот»." }
  - { kind: false-friend, text: "Строение прозрачно и совпадает с русским: pięć «пять» + set «сот»." }
  - { kind: usage, text: "В одном ряду: sześćset, siedemset, osiemset, dziewięćset." }
  - { kind: government, text: "Творительный и дательный падежи дают pięciomaset, как paromaset у paręset. В родительном и предложном — pięciuset." }
collocations:
  - { pl: "pięćset złotych", ru: "пятьсот злотых" }
  - { pl: "pięćset lat", ru: "пятьсот лет" }
etymology: "pięć «пять» + set, родительный множественного от sto «сто»; русское «пятьсот» собрано ровно так же."
memory: "pięćset = «пятьсот»: pięć + set «сот». Главное — помнить вторую форму: во всех косвенных падежах pięciuset."
idioms:
