# review
id: wepchac
format: 2
lemma: "wepchać"
rank: 2199
pos: verb
aspect: perf
pron: { cyr: "вэ́пхаць" }
senses:
  - id: shove-in
    ru: "впихнуть, затолкать"
    examples:
      - pl: "Wepchał wszystko do plecaka."
        ru: "Он впихнул всё в рюкзак."
        source: { kind: authored }
      - pl: "Nie da się tego wepchać do szuflady."
        ru: "Это не впихнуть в ящик."
        source: { kind: authored }
      - pl: "Wepchali walizki do bagażnika."
        ru: "Они затолкали чемоданы в багажник."
        source: { kind: authored }
  - id: push-into
    ru: "втолкнуть (кого-л. куда-л.)"
    examples:
      - pl: "Wepchali go do tłumu."
        ru: "Они втолкнули его в толпу."
        source: { kind: authored }
      - pl: "Ktoś wepchał mnie do wagonu."
        ru: "Кто-то втолкнул меня в вагон."
        source: { kind: authored }
notes:
  - { kind: government, text: "Куда — do с родительным: wepchać do plecaka «впихнуть в рюкзак»." }
  - { kind: usage, text: "Рядом живёт более частый wepchnąć — однократный совершенный вид от pchnąć. wepchać подразумевает, что пихали долго и много." }
  - { kind: false-friend, text: "Корень pchać «пихать, толкать» — ср. русское «пхать», «впихнуть»." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "wepchać do plecaka", ru: "впихнуть в рюкзак" }
etymology: "w- + pchać «пихать, толкать»; ср. русское «пхать», «впихнуть»."
memory: "wepchać — «впихнуть, затолкать», от pchać «пихать». Рядом стоит wepchnąć — однократное «втолкнуть»; wepchać значит, что пихали долго."
idioms:
  - { pl: "wepchać do plecaka", ru: "впихнуть в рюкзак" }
