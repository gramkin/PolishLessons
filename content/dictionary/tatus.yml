# review
id: tatus
format: 2
lemma: "tatuś"
rank: 902
pos: noun
pron: { cyr: "та́тусь" }
senses:
  - id: daddy
    ru: "папа, папочка (ласково)"
    examples:
      - pl: "Tatuś to człowiek, który ciężko pracuje."
        ru: "Папа — это человек, который тяжело работает."
        source: { kind: translated, id: 610012 }
      - pl: "Tatuś wrócił z pracy."
        ru: "Папа вернулся с работы."
        source: { kind: authored }
      - pl: "Mój tatuś jest najlepszy."
        ru: "Мой папа самый лучший."
        source: { kind: authored }
  - id: vocative
    ru: "tatusiu! — обращение: папочка!"
    note: "Звательный падеж, которого в русском нет."
    examples:
      - pl: "Tatusiu, chodź tu!"
        ru: "Папочка, иди сюда!"
        source: { kind: authored }
      - pl: "Dziękuję, tatusiu."
        ru: "Спасибо, папочка."
        source: { kind: authored }
      - pl: "Tatusiu, a kiedy pojedziemy?"
        ru: "Папочка, а когда мы поедем?"
        source: { kind: authored }
  - id: childs
    ru: "о ребёнке и отце"
    examples:
      - pl: "Jestem twoją lalką, a nie żoną, tak jak w domu byłam laleczką tatusia."
        ru: "Я твоя кукла, а не жена, как дома была папиной куколкой."
        source: { kind: translated, id: 364346 }
      - pl: "Córeczka tatusia."
        ru: "Папина дочка."
        source: { kind: authored }
      - pl: "Czeka na tatusia przy oknie."
        ru: "Он ждёт папу у окна."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Ласкательная форма от tata «папа». Ступени такие: ojciec «отец» — нейтрально и чуть официально, tata «папа» — обычное слово, tatuś «папочка» — ласково, по-детски." }
  - { kind: usage, text: "Звательный падеж tatusiu! звучит на каждом шагу в разговоре с детьми: Tatusiu, chodź tu! В русском звательной формы нет, и её легко забыть." }
  - { kind: usage, text: "córeczka tatusia — «папина дочка», устойчивое сочетание. Женская пара — mamusia «мамочка»." }
  - { kind: usage, text: "Слово редко попадает в письменные тексты: в корпусе примеров почти нет, хотя в живой речи оно очень частое. Большинство примеров на карточке составлены специально." }
collocations:
  - { pl: "tatusiu!", ru: "папочка!" }
  - { pl: "córeczka tatusia", ru: "папина дочка" }
  - { pl: "mój tatuś", ru: "мой папа" }
  - { pl: "mamusia", ru: "мамочка" }
family:
  - { pl: "tata", ru: "папа", relation: root, id: tata }
  - { pl: "tatko", ru: "папочка", relation: derived }
  - { pl: "ojciec", ru: "отец", relation: root }
etymology: "Ласкательное от tata «папа» с суффиксом -uś, тем же, что в mamusia «мамочка» и babcia. Русское «папа» — то же детское слово."
memory: "tatuś — «папочка», ласковая форма от tata. Ступени такие: ojciec «отец», tata «папа», tatuś «папочка». Запомните звательный падеж tatusiu! — в русском такой формы нет. Женская пара — mamusia."
idioms:
  - { pl: "tatusiu!", ru: "папочка!" }
  - { pl: "córeczka tatusia", ru: "папина дочка" }
  - { pl: "mamusia i tatuś", ru: "мамочка и папочка" }
