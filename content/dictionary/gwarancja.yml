# review
id: gwarancja
format: 2
lemma: "gwarancja"
rank: 4571
pos: noun
pron: { cyr: "гвара́нцья" }
senses:
  - id: warranty
    ru: "гарантия (на товар)"
    examples:
      - pl: "Telewizor ma dwa lata gwarancji."
        ru: "На телевизор гарантия два года."
        source: { kind: authored }
      - pl: "Naprawa jest na gwarancji."
        ru: "Ремонт по гарантии."
        source: { kind: authored }
      - pl: "Gwarancja skończyła się w zeszłym miesiącu."
        ru: "Гарантия закончилась в прошлом месяце."
        source: { kind: authored }
  - id: guarantee
    ru: "гарантия, залог, уверенность"
    examples:
      - pl: "Nie ma gwarancji, że się uda."
        ru: "Нет гарантии, что получится."
        source: { kind: authored }
      - pl: "Dyplom nie jest gwarancją sukcesu."
        ru: "Диплом — не гарантия успеха."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "GWARANCJA — «гарантия», с GW на месте русского Г. Так же GWARANTOWAĆ — «гарантировать». NA GWARANCJI — «по гарантии»: ODDAĆ NA GWARANCJĘ, «сдать по гарантии»." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — GWARANCJI. Множественное — GWARANCJE. Звательный и архаичное GWARANCYJ не используем." }
  - { kind: government, text: "Гарантия на что — GWARANCJA NA и винительный: GWARANCJA NA ROWER. Гарантия чего — родительный: GWARANCJA BEZPIECZEŃSTWA. По гарантии — W RAMACH GWARANCJI." }
  - { kind: pronunciation, text: "Читается «гвара́нцья»: GW — слитно «гв», CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "na gwarancji", ru: "на гарантии" }
  - { pl: "karta gwarancyjna", ru: "гарантийный талон" }
  - { pl: "dać gwarancję", ru: "дать гарантию" }
family:
  - { pl: "gwarantować", ru: "гарантировать", relation: derived, id: gwarantowac }
  - { pl: "pewność", ru: "уверенность", relation: root, id: pewnosc }
  - { pl: "reklamacja", ru: "рекламация, претензия", relation: root }
etymology: "Из французского GARANTIE, а оно — из франкского. Польское GW на месте русского Г — след германского W в начале слова."
memory: "Gwarancja — гарантия, с gw. Na gwarancji — по гарантии. Nie ma gwarancji — нет гарантии. Читается «гвара́нцья»."
idioms:
  - { pl: "bez gwarancji", ru: "без гарантий, на свой страх и риск" }
formExamplesSkip:
