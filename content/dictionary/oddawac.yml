# review
id: oddawac
format: 2
lemma: "oddawać"
rank: 1990
pos: verb
aspect: imperf
aspectPair: oddac
pron: { cyr: "одда́вачь" }
senses:
  - id: give-back
    ru: "отдавать, возвращать"
    examples:
      - pl: "Oddawaj."
        ru: "Отдавай."
        source: { kind: translated, id: 8182273 }
      - pl: "Oddawaj to!"
        ru: "Отдавай это!"
        source: { kind: translated, id: 6328349 }
      - pl: "Oddawaj mi torbę."
        ru: "Отдавай мне сумку."
        source: { kind: translated, id: 5903097 }
      - pl: "Proszę oddawać arkusze odpowiedzi."
        ru: "Сдавайте, пожалуйста, листы с ответами."
        source: { kind: translated, id: 924643 }
      - pl: "Pamiętam, jak oddawałem książkę do biblioteki."
        ru: "Я помню, как сдавал книгу в библиотеку."
        source: { kind: translated, id: 3695490 }
      - pl: "Ona mu każe oddawać sobie całą wypłatę, a on to robi."
        ru: "Она велит ему отдавать ей всю зарплату, и он это делает."
        source: { kind: translated, id: 6328346 }
  - id: convey
    ru: "передавать, отражать (смысл)"
    examples:
      - pl: "Dosłowne tłumaczenie nie zawsze oddaje prawdziwe znaczenie frazy lub wyrażenia."
        ru: "Дословный перевод не всегда передаёт истинный смысл фразы или выражения."
        source: { kind: translated, id: 13026670 }
      - pl: "Tom stara się regularnie oddawać krew."
        ru: "Том старается регулярно сдавать кровь."
        source: { kind: translated, id: 13562123 }
notes:
  - { kind: usage, text: "Несовершенный вид к oddać, у которого своя карточка: oddaję «отдаю» — oddam «отдам»." }
  - { kind: usage, text: "Частое значение — «сдавать»: oddawać krew «сдавать кровь», oddawać prace «сдавать работы», oddawać książkę do biblioteki «сдавать книгу в библиотеку»." }
  - { kind: usage, text: "Второе значение — «передавать, отражать»: tłumaczenie nie oddaje sensu «перевод не передаёт смысла»." }
  - { kind: usage, text: "Повелительное Oddawaj! звучит требовательно — «Отдавай!», в отличие от нейтрального Oddaj." }
collocations:
  - { pl: "oddawać krew", ru: "сдавать кровь" }
  - { pl: "oddawać książkę", ru: "сдавать книгу" }
  - { pl: "nie oddaje sensu", ru: "не передаёт смысла" }
etymology: "od- + dawać «давать», того же корня, что русское «отдавать». Слово собрано ровно так же и значит то же самое."
memory: "oddawać — несовершенный вид к oddać: «отдавать, возвращать, сдавать». Oddawać krew «сдавать кровь», oddawać książkę «сдавать книгу»."
idioms:
  - { pl: "oddawać krew", ru: "сдавать кровь" }
  - { pl: "oddawać książkę do biblioteki", ru: "сдавать книгу в библиотеку" }
  - { pl: "nie oddaje sensu", ru: "не передаёт смысла" }
