formExamples:
  - form: "oddaje"
    pl: "Dosłowne tłumaczenie nie zawsze oddaje prawdziwe znaczenie frazy lub wyrażenia."
    ru: "Дословный перевод не всегда передаёт истинный смысл фразы или выражения."
    source: { kind: translated, id: 13026670 }
  - form: "oddaje"
    pl: "Ten obraz nie oddaje jej urody."
    ru: "Эта картина не передаёт её красоты."
    source: { kind: authored }
  - form: "oddaje"
    pl: "Zawsze oddaje pożyczone rzeczy."
    ru: "Он всегда возвращает одолженные вещи."
    source: { kind: authored }
  - form: "oddawać"
    pl: "Proszę oddawać arkusze odpowiedzi."
    ru: "Сдавайте, пожалуйста, листы с ответами."
    source: { kind: translated, id: 924643 }
  - form: "oddawać"
    pl: "Tom stara się regularnie oddawać krew."
    ru: "Том старается регулярно сдавать кровь."
    source: { kind: translated, id: 13562123 }
  - form: "oddawać"
    pl: "Ona mu każe oddawać sobie całą wypłatę, a on to robi."
    ru: "Она велит ему отдавать ей всю зарплату, и он это делает."
    source: { kind: translated, id: 6328346 }
  - form: "oddawaj"
    pl: "Oddawaj."
