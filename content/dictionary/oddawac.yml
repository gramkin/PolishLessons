    pl: "Zawsze oddawałem książki na czas."
    ru: "Я всегда сдавал книги вовремя."
    source: { kind: authored }
  - form: "oddawałem"
    pl: "Nie oddawałem mu pieniędzy."
    ru: "Я не возвращал ему деньги."
