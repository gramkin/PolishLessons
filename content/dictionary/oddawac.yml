  - form: "oddawanie"
    pl: "Oddawanie długów zajęło mu lata."
    ru: "Выплата долгов заняла у него годы."
    source: { kind: authored }
  - form: "oddawaniem"
    pl: "Ma problem z oddawaniem pożyczek."
    ru: "У него трудности с возвратом займов."
