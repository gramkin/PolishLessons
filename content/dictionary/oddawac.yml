  - form: "oddawania"
    pl: "Nie lubię oddawania rzeczy."
    ru: "Я не люблю отдавать вещи."
    source: { kind: authored }
  - form: "oddawania"
    pl: "Zasady oddawania krwi są proste."
    ru: "Правила сдачи крови просты."
    source: { kind: authored }
  - form: "oddawaniem"
    pl: "Ma problem z oddawaniem pożyczek."
    ru: "У него трудности с возвратом займов."
    source: { kind: authored }
  - form: "oddawaniem"
    pl: "Zajął się oddawaniem książek."
    ru: "Он занялся сдачей книг."
    source: { kind: authored }
  - form: "oddawaniem"
    pl: "Przed oddawaniem pracy sprawdź ją."
    ru: "Перед сдачей работы проверь её."
