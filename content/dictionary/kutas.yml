# review
id: kutas
format: 2
lemma: "kutas"
rank: 1927
pos: noun
pron: { cyr: "ку́тас" }
senses:
  - id: insult
    ru: "мудак, придурок (грубое оскорбление мужчины)"
    examples:
      - pl: "Ten kutas znowu mnie oszukał."
        ru: "Этот мудак опять меня обманул."
        source: { kind: authored }
      - pl: "Co za kutas!"
        ru: "Вот мудак!"
        source: { kind: authored }
      - pl: "Nie bądź kutasem."
        ru: "Не будь мудаком."
        source: { kind: authored }
  - id: tassel
    ru: "кисточка, помпон (устаревшее исходное значение)"
    examples:
      - pl: "Dawniej kutas oznaczał frędzel przy pasie."
        ru: "Раньше kutas означало кисточку на поясе."
        source: { kind: authored }
      - pl: "Słowo kutas ma dwa bardzo różne znaczenia."
        ru: "Слово kutas имеет два очень разных значения."
        source: { kind: authored }
      - pl: "W dawnych tekstach kutas to ozdoba, a nie obelga."
        ru: "В старых текстах kutas — украшение, а не оскорбление."
        source: { kind: authored }
notes:
  - { kind: register, text: "Очень грубое слово. Современное употребление — вульгарное название мужского органа и грубое оскорбление мужчины, примерно русское «мудак». В вежливой речи невозможно." }
  - { kind: usage, text: "Исходное, ныне устаревшее значение — «кисточка, помпон, бахрома»: kutasy при знамени или на поясе. Оно сохранилось в исторических текстах и в поговорке czas nie kutas, nie stoi «время не ждёт»." }
  - { kind: usage, text: "Примеры из корпуса относятся почти исключительно к анатомическому значению и слишком откровенны для учебной карточки, поэтому здесь приведены собственные." }
collocations:
  - { pl: "co za kutas", ru: "вот мудак" }
  - { pl: "nie bądź kutasem", ru: "не будь мудаком" }
  - { pl: "czas nie kutas, nie stoi", ru: "время не ждёт" }
etymology: "Из турецкого kutas «кисть из конского волоса», пришедшего через военную лексику. Исходное значение — «кисточка, помпон»; анатомическое развилось позже по внешнему сходству. С русскими словами того же значения родства нет."
memory: "kutas сегодня — грубое ругательство. Но исходно это «кисточка, помпон» — отсюда старая поговорка czas nie kutas, nie stoi «время не ждёт»."
