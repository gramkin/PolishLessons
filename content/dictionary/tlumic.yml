# review
id: tlumic
format: 2
lemma: "tłumić"
rank: 2279
pos: verb
aspect: imperf
pron: { cyr: "ту́миць" }
senses:
  - id: suppress
    ru: "подавлять, заглушать"
    examples:
      - pl: "Tłumił śmiech ręką."
        ru: "Он заглушал смех рукой."
        source: { kind: authored }
      - pl: "Dywan tłumi kroki."
        ru: "Ковёр заглушает шаги."
        source: { kind: authored }
      - pl: "Nie tłum w sobie złości."
        ru: "Не подавляй в себе злость."
        source: { kind: authored }
  - id: stifle
    ru: "гасить, сдерживать (чувство, звук)"
    examples:
      - pl: "Ściany tłumią hałas z ulicy."
        ru: "Стены глушат шум с улицы."
        source: { kind: authored }
      - pl: "Tłumiła łzy przez całą drogę."
        ru: "Она сдерживала слёзы всю дорогу."
        source: { kind: authored }
notes:
  - { kind: government, text: "Винительный падеж: tłumić hałas «заглушать шум», tłumić uczucia «подавлять чувства»." }
  - { kind: false-friend, text: "Осторожно: tłum значит «толпа» и к этому глаголу отношения не имеет, хотя выглядит как его форма. В корпусе все совпадения — именно существительное." }
  - { kind: usage, text: "Отсюда tłumik «глушитель» — и у автомобиля, и у оружия." }
  - { kind: usage, text: "Совершенный вид — stłumić: stłumić bunt «подавить мятеж»." }
collocations:
  - { pl: "tłumić hałas", ru: "заглушать шум" }
  - { pl: "tłumić uczucia", ru: "подавлять чувства" }
etymology: "От tłuc «бить, толочь» в переносном развитии «придавливать»; ср. русское «толочь», «глушить»."
memory: "tłumić — «подавлять, заглушать»: tłumić hałas, tłumić uczucia. Отсюда tłumik «глушитель». Не путайте с tłum «толпа». Совершенный вид — stłumić."
idioms:
  - { pl: "tłumić hałas", ru: "заглушать шум" }
