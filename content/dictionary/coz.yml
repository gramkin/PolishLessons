# review
id: coz
format: 2
lemma: "cóż"
rank: 186
pos: pron
pron: { cyr: "цуш" }
senses:
  - id: well
    ru: "что же; ну что ж (риторическое)"
    examples:
      - pl: "Cóż, to niezupełnie tak."
        ru: "Хм, это не совсем правда."
        source: { kind: tatoeba, id: 6313107 }
      - pl: "Cóż, to nie całkiem tak."
        ru: "Хм, это не совсем правда."
        source: { kind: tatoeba, id: 6313104 }
      - pl: "\"Cóż to za muzyka?\" - \"To Rachmaninow.\""
        ru: "\"Что это за музыка?\" - \"Это Рахманинов\"."
        source: { kind: tatoeba, id: 4719242 }
  - id: what-a
    ru: "cóż za… — что за…, какой… (восклицание)"
    examples:
      - pl: "Cóż za piękny ogród!"
        ru: "Какой прекрасный сад!"
        source: { kind: tatoeba, id: 404435 }
      - pl: "Cóż za miła niespodzianka!"
        ru: "Какой приятный сюрприз!"
        source: { kind: tatoeba, id: 1605602 }
      - pl: "On nawet piwa nie pije, a cóż dopiero whisky."
        ru: "Он даже пива не пьёт, что уж говорить о виски."
        source: { kind: tatoeba, id: 1133676 }
notes:
  - { kind: usage, text: "cóż — это co с усилительной частицей -ż, как русское «что же». Так же образованы czegóż, czemuż, czymże." }
  - { kind: usage, text: "Cóż za + существительное отвечает русскому «что за, какой»: Cóż za dzień! «Что за день!»." }
  - { kind: register, text: "В начале реплики Cóż… звучит как русское «Ну что ж…» — слегка книжно и с оттенком смирения." }
collocations:
  - { pl: "cóż za", ru: "что за" }
  - { pl: "cóż dopiero", ru: "что уж говорить" }
  - { pl: "a cóż to?", ru: "а это что такое?" }
etymology: "Из co «что» и усилительной частицы -ż(e) — как русское «что же». Тем же способом образованы czegóż, czemuż и czymże."
memory: "cóż = co + -ż, то есть «что же». Cóż za piękny dzień! — «Что за прекрасный день!», а в начале реплики Cóż… значит «Ну что ж…»."
idioms:
  - { pl: "cóż dopiero", ru: "что уж говорить" }
  - { pl: "cóż za", ru: "что за" }
  - { pl: "cóż stąd", ru: "ну и что с того" }
