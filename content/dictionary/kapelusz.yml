  - { pl: "kapelusik", ru: "шляпка, маленькая шляпа", relation: derived }
  - { pl: "czapka", ru: "шапка", relation: root }
etymology: "Через чешский из итальянского cappello, от латинского cappa «плащ с капюшоном». От того же корня французское capuchon и русский «капюшон», а также «капелла» и «капеллан». Русская «шляпа» пришла совсем другим путём, из немецкого Schlappe, поэтому слова не похожи."
memory: "kapelusz — «шляпа», родня не «шляпе», а «капюшону»: оба от латинского cappa. Запомнить помогает Безумный Шляпник из «Алисы» — по-польски Szalony Kapelusznik. И второе значение: kapelusz grzyba — это шляпка гриба."
idioms:
  - { pl: "kapelusz z głowy", ru: "снимаю шляпу" }
  - { pl: "wyciągnąć coś z kapelusza", ru: "вытащить что-л. из шляпы, достать как фокусник" }
formExamplesSkip:
