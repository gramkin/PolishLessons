notes:
  - { kind: false-friend, text: "Прозрачного русского родственника у слова нет: «шляпа» пришла из немецкого Schlappe и с kapelusz не связана. Зато латинский предок узнаваем в другом месте: cappa дала и французское capuchon, то есть русский «капюшон», и слово «капелла». Так что kapelusz роднится с «капюшоном», а не со «шляпой»." }
  - { kind: usage, text: "Шляпка гриба по-польски — тот же kapelusz, без уменьшительного суффикса: kapelusz borowika «шляпка белого». Русский здесь обязательно скажет «шляпка», польский обходится основным словом; уменьшительное kapelusik значит только маленькую шляпу." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: ka-PE-lusz, «капэ́луш». Конечное sz звучит как ш, а e не смягчает предыдущий согласный — «капэ», не «капе»." }
collocations:
