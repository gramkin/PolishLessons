notes:
  - { kind: false-friend, text: "REJON — «район» как зона, участок или окрестность: W REJONIE DWORCA, «возле вокзала». Но городской административный район — DZIELNICA, а не REJON. Регион страны — REGION." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — REJONU, местный — W REJONIE." }
  - { kind: government, text: "В районе чего — W REJONIE, и родительный: W REJONIE SKRZYŻOWANIA. Обслуживать участок — OBSŁUGIWAĆ REJON." }
  - { kind: pronunciation, text: "Читается «рэ́йон», два слога, ударение на первом. RE — твёрдое «рэ», J — «й»." }
collocations:
  - { pl: "w rejonie", ru: "в районе, поблизости" }
  - { pl: "rejon działania", ru: "зона действия" }
  - { pl: "cały rejon", ru: "весь район" }
family:
  - { pl: "rejonowy", ru: "районный, участковый", relation: derived }
  - { pl: "dzielnica", ru: "район города", relation: root, id: dzielnica }
  - { pl: "region", ru: "регион", relation: root }
etymology: "Из французского слова со значением «область, край», от латинского «регион». Русский «район» — то же слово."
memory: "Rejon — район, участок, окрестность: w rejonie dworca. Dzielnica — район города. Читается «рэ́йон»."
idioms:
  - { pl: "w okolicy", ru: "поблизости, в окрестностях" }
