# review
id: formularz
format: 2
lemma: "formularz"
rank: 3974
pos: noun
pron: { cyr: "формула́ш" }
senses:
  - id: form
    ru: "бланк, анкета, форма"
    examples:
      - pl: "Wypełnij ten formularz, proszę."
        ru: "Заполни, пожалуйста, этот бланк."
        source: { kind: authored }
      - pl: "Formularz zgłoszeniowy przyjmujemy do piątku."
        ru: "Заявки принимаем до пятницы."
        source: { kind: authored }
      - pl: "Na stronie jest formularz kontaktowy."
        ru: "На сайте есть форма обратной связи."
        source: { kind: authored }
      - pl: "Podpisz formularz na dole."
        ru: "Подпиши бланк внизу."
        source: { kind: authored }
      - pl: "Potrzebuję nowego formularza, ten jest zniszczony."
        ru: "Мне нужен новый бланк, этот испорчен."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "FORMULARZ — «бланк, анкета», а не русский «формуляр» в библиотеке. Заполнить бланк — WYPEŁNIĆ FORMULARZ. На сайте FORMULARZ KONTAKTOWY — «форма обратной связи»." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, неодушевлённое. Родительный на -A: FORMULARZA. Во множественном — FORMULARZE, в родительном множественного две формы: FORMULARZY и FORMULARZÓW." }
  - { kind: government, text: "Заполнить бланк — WYPEŁNIĆ FORMULARZ, винительный. В бланке — W FORMULARZU, местный. Приложить к бланку — DOŁĄCZYĆ DO FORMULARZA, DO с родительным." }
  - { kind: pronunciation, text: "Читается «формула́ш», ударение на предпоследнем слоге. LA — «ла», конечное RZ оглушается в «ш»." }
collocations:
  - { pl: "wypełnić formularz", ru: "заполнить бланк" }
  - { pl: "formularz zgłoszeniowy", ru: "заявка, регистрационная форма" }
  - { pl: "formularz kontaktowy", ru: "форма обратной связи" }
family:
  - { pl: "forma", ru: "форма", relation: root, id: forma }
  - { pl: "formalny", ru: "формальный", relation: root }
  - { pl: "formalność", ru: "формальность", relation: root }
etymology: "Из латинского слова со значением «форма, образец», уменьшительного от слова «форма». Суффикс -ARZ, как в KALENDARZ «календарь»."
memory: "Formularz — бланк, анкета. Читается «формула́ш». Wypełnić formularz — заполнить бланк. Formularze — бланки."
idioms:
  - { pl: "z urzędu", ru: "по долгу службы, официально" }
