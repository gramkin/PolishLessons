etymology: "От греческого ΨΥΧΗ «душа, дыхание», через латинский PSYCHICUS и немецкий PSYCHISCH, которым оба языка воспользовались в девятнадцатом веке вместе со всей медицинской терминологией. Польский присоединил свой -ICZNY, русский — -ИЧЕСКИЙ, и соответствие этих суффиксов стало регулярным для целого слоя слов греческого происхождения: PSYCHICZNY и «психический», TECHNICZNY и «технический», FIZYCZNY и «физический». Начальное греческое сочетание ΨΥ- польский сохранил полностью как PSY-, произнося оба согласных, тогда как русский сделал то же самое в «психике», но в беглой речи часто упрощает. Любопытно, что польское PSYCHICZNY взяло на себя часть работы русского «психологического»: там, где русский различает состояние и науку двумя словами, польскому хватает одного, а PSYCHOLOGICZNY остаётся за наукой."
memory: "Суффикс -ICZNY = русское -ИЧЕСКИЙ/-ИЧНЫЙ: psychiczny, techniczny, logiczny, klasyczny. Важно про объём: польское psychiczny покрывает и «психический», и «психологический» в смысле нагрузки — presja psychiczna это «психологическое давление». Psychologiczny остаётся за наукой. Существительное psychika, наречие psychicznie. И правило вежливости: словом называют состояние (choroba psychiczna), а не человека — иначе звучит оскорбительно."
