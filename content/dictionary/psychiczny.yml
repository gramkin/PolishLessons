notes:
  - { kind: false-friend, text: "Суффикс -ICZNY отвечает русскому -ИЧЕСКИЙ или -ИЧНЫЙ, и в этом слое совпадений много: PSYCHICZNY и «психический», TECHNICZNY и «технический», LOGICZNY и «логический», KLASYCZNY и «классический», ENERGICZNY и «энергичный». Ловушка в объёме значения: польское PSYCHICZNY покрывает и русское «психический», и русское «психологический» там, где речь о нагрузке и давлении — PRESJA PSYCHICZNA это «психологическое давление», а не «психическое». Отдельное слово PSYCHOLOGICZNY в польском есть, но относится к психологии как науке: BADANIA PSYCHOLOGICZNE. Выбирая между ними, стоит спросить, идёт ли речь о состоянии человека, и тогда это PSYCHICZNY." }
  - { kind: usage, text: "Одиннадцать форм, степеней сравнения в наборе нет: прилагательное относительное, и «более психический» бессмысленно. Если нужна степень — говорят о силе признака другими словами: SILNE OBCIĄŻENIE PSYCHICZNE. Наречие — PSYCHICZNIE: PSYCHICZNIE CHORY «психически больной», PSYCHICZNIE WYCZERPANY «психически истощённый». Существительное — PSYCHIKA «психика», и оно употребляется чаще, чем русское: MOCNA PSYCHIKA это «крепкая психика». Устойчивое CHOROBA PSYCHICZNA — нейтральный медицинский термин, в отличие от разговорного PSYCHICZNY в значении «сумасшедший», которого в карточке нет и которое обидно." }
  - { kind: register, text: "В разговорной речи прилагательное иногда используют как существительное о человеке, и тогда оно звучит оскорбительно, примерно как русское «психический» в грубом употреблении. Нейтральные способы сказать то же самое другие: OSOBA CHORA PSYCHICZNIE «человек с психическим заболеванием», OSOBA Z ZABURZENIAMI PSYCHICZNYMI «человек с психическими расстройствами». В медицинском и официальном языке прилагательное совершенно нейтрально — CHOROBA PSYCHICZNA, ZDROWIE PSYCHICZNE, ODDZIAŁ PSYCHIATRYCZNY, — и ровно эти сочетания стоит употреблять. Разница здесь не в слове, а в том, называют им состояние или человека." }
  - { kind: pronunciation, text: "Читается «псыхи́чны», три слога, ударение на предпоследнем. Начальное PS произносится полностью, оба согласных, без гласного между ними: «псы», а не «пси». Буква Y это «ы», поэтому первый слог «псы». Сочетание CH даёт «х». Сочетание CZ это твёрдое «ч», как в русском «что» при беглом произношении, и мягким оно не бывает. Конечное -NY это «ны». В форме PSYCHICZNĄ последнее Ą даёт «он»: «псыхи́чнон»." }
