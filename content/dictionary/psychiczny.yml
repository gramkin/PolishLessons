  - { pl: "przemoc psychiczna", ru: "психологическое насилие" }
formExamplesSkip:
  - { form: "psychiczni", reason: "Мужское-личное множественное. В нейтральной речи признак состояния при лицах выражается наречием: CHORZY PSYCHICZNIE «психически больные», WYCZERPANI PSYCHICZNIE «психически истощённые». Согласованная форма PSYCHICZNI в этой позиции вытеснена наречной конструкцией и держится только в разговорном употреблении о человеке, которое звучит обидно и которому карточка не учит." }
