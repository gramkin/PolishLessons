notes:
  - { kind: false-friend, text: "Корень здесь RZĄD, и за ним стоит целое гнездо, которое для русского непрозрачно. RZĄD значит и «правительство», и «ряд»; URZĄD — «учреждение, ведомство»; URZĄDZIĆ — «устроить, обустроить»; URZĄDZENIE — «устройство» и как прибор, и как действие по обустройству. Русский в этом гнезде опирается на «ряд» и «наряд», но «правительства» и «учреждения» от него не образует, поэтому угадать связь нельзя. Запомнить полезно пару: URZĄD SKARBOWY «налоговая инспекция» и URZĄDZENIE POMIAROWE «измерительный прибор» — одно гнездо, два совершенно разных предмета. Не путайте с ZARZĄD «правление» и ROZKAZ, у которого корень другой." }
  - { kind: usage, text: "Среднее существительное на -IE, и родительный множественного у него усекается: URZĄDZEŃ, а не «urządzeniów». Конечное -IE отбрасывается, а предшествующий согласный смягчается в Ń. Так же ведут себя все слова этого типа: ZDJĘCIE даёт ZDJĘĆ, ZEBRANIE — ZEBRAŃ, POGOTOWIE — POGOTOWI. Форма URZĄDZENIA покрывает родительный единственного вместе с именительным и винительным множественного. Дательный и местный единственного совпадают: URZĄDZENIU. Итого восемь форм, и запомнить надо, по сути, усечённый родительный множественного." }
  - { kind: government, text: "Средний род. Какое устройство — прилагательное: URZĄDZENIE POMIAROWE «измерительный прибор», URZĄDZENIE ELEKTRYCZNE, URZĄDZENIE MOBILNE «мобильное устройство». Чего обустройство — родительный: URZĄDZENIE MIESZKANIA, URZĄDZENIE OGRODU. Частотные глаголы: OBSŁUGIWAĆ URZĄDZENIE «обслуживать устройство», PODŁĄCZYĆ URZĄDZENIE «подключить устройство», WYŁĄCZYĆ URZĄDZENIE. В технических текстах стоит формула INSTRUKCJA OBSŁUGI URZĄDZENIA «инструкция по эксплуатации устройства», с родительным, тогда как по-русски нужен предлог." }
  - { kind: pronunciation, text: "Читается «ужондзе́не», четыре слога, ударение на предпоследнем. Сочетание RZ после гласной даёт «ж», поэтому начало звучит «уж», а не «урж». Носовое Ą перед DZ читается «он». Сочетание DZ произносится слитно, как одно «дз». Конечное -NIE даёт «не» с мягким н. В родительном множественного URZĄDZEŃ конечное Ń это мягкое «нь»: «ужо́ндзень», три слога, и ударение переходит на предпоследний." }
