etymology: "От URZĄDZIĆ «устроить», которое сложено из U- и RZĄDZIĆ «править, управлять», а то — от RZĄD, из праславянского *rędъ «порядок, ряд». Русское «ряд» — то же слово, и «наряд», «обряд», «порядок» принадлежат тому же гнезду; но русский не стал образовывать от него названия власти, тогда как польский построил RZĄD «правительство» и URZĄD «учреждение» прямо на идее порядка. Поэтому в польском «правительство» буквально значит «порядок», а «устройство» — «то, что приведено в порядок». Суффикс -ENIE образует отглагольные существительные и отвечает русскому -ЕНИЕ точно: URZĄDZENIE и «устроение», ZEBRANIE и «собрание». Двойственность значения — прибор и обустройство — обычна для этого суффикса в обоих языках: ср. русское «устройство»."
memory: "Корень rząd «порядок, ряд» — отсюда и rząd «правительство», и urząd «учреждение», и urządzić «устроить», и urządzenie «устройство». Русский на том же корне построил только «ряд», «обряд», «порядок», так что связь не угадать. Родительный множественного усекается: urządzeń, как zdjęć и zebrań. Дательный и местный совпадают: urządzeniu. Rz после гласной читается «ж»: «ужондзе́не»."
