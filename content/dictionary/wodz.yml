# review
id: wodz
format: 2
lemma: "wódz"
rank: 4035
pos: noun
pron: { cyr: "вуц" }
senses:
  - id: chief
    ru: "вождь (племени)"
    examples:
      - pl: "Wódz plemienia zwołał naradę."
        ru: "Вождь племени созвал совет."
        source: { kind: authored }
      - pl: "Indianie wybrali nowego wodza."
        ru: "Индейцы выбрали нового вождя."
        source: { kind: authored }
      - pl: "Słowa wodza były prawem."
        ru: "Слова вождя были законом."
        source: { kind: authored }
  - id: commander
    ru: "полководец, вождь, лидер"
    examples:
      - pl: "Napoleon był wielkim wodzem."
        ru: "Наполеон был великим полководцем."
        source: { kind: authored }
      - pl: "Naczelny wódz wydał rozkaz ataku."
        ru: "Верховный главнокомандующий отдал приказ к атаке."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WÓDZ — «вождь», но и «полководец»: NACZELNY WÓDZ — «верховный главнокомандующий». Командир части — DOWÓDCA, лидер группы — PRZYWÓDCA; оба от того же корня WODZIĆ, «водить»." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Ó чередуется с O: WÓDZ, но WODZA, WODZOWIE. Множественное — WODZOWIE, с торжественным окончанием -OWIE." }
  - { kind: government, text: "Под предводительством — POD WODZĄ, устойчивый оборот: POD WODZĄ KRÓLA, «под предводительством короля». Стать вождём — ZOSTAĆ WODZEM, творительный. Слушаться вождя — SŁUCHAĆ WODZA, родительный." }
  - { kind: pronunciation, text: "Читается «вуц», один слог: Ó — «у», конечное DZ оглушается в «ц». В остальных формах O: WODZA — «во́дза»." }
collocations:
  - { pl: "wódz plemienia", ru: "вождь племени" }
  - { pl: "naczelny wódz", ru: "верховный главнокомандующий" }
  - { pl: "wielki wódz", ru: "великий полководец" }
family:
  - { pl: "wodzić", ru: "водить", relation: root, id: wodzic }
  - { pl: "przywódca", ru: "лидер, руководитель", relation: derived, id: przywodca }
  - { pl: "dowódca", ru: "командир", relation: derived, id: dowodca }
etymology: "От глагола WODZIĆ «водить»: вождь — тот, кто ведёт. Русское «вождь» — то же слово, с церковнославянским ЖД на месте польского DZ."
memory: "Wódz — вождь, читается «вуц». Wodzowie — вожди. Naczelny wódz — главнокомандующий. От wodzić — водить: кто ведёт, тот и wódz."
idioms:
  - { pl: "wódz naczelny", ru: "главнокомандующий" }
