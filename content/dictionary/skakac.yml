notes:
  - { kind: usage, text: "ВИДОВАЯ ПАРА К SKOCZYĆ, и различаются они ровно так же, как русские «прыгать» и «прыгнуть». Skakał przez kałuże значит, что прыгал не раз, всю дорогу; skoczył przez kałużę — прыгнул однажды. Выбор между ними делается точно по русскому образцу." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ В НАСТОЯЩЕМ ВРЕМЕНИ: k переходит в cz. Неопределённая форма skakać, но skaczę, skaczesz, skacze. Так же устроены płakać — płaczę «плакать — плачу» и pisać — piszę «писать — пишу». Русский в «плакать/плачу» делает то же самое, так что образец знаком." }
  - { kind: false-friend, text: "Корень общий с русским «скакать», и переносные значения совпадают: skakać z radości — «прыгать от радости», ceny skaczą — «цены скачут». Отсюда skok «прыжок», skakanka «скакалка» и skoczek «прыгун». Глагол непереходный, поэтому страдательного причастия у него нет." }
  - { kind: government, text: "Прыгают ЧЕРЕЗ что — przez с винительным: skakać przez kałuże, przez skakankę. ПО чему — po с предложным: skakać po łóżku. С чего на что — z плюс родительный и na плюс винительный: skakać z tematu na temat. Все три модели совпадают с русскими." }
collocations:
  - { pl: "skakać z radości", ru: "прыгать от радости" }
  - { pl: "skakać przez skakankę", ru: "прыгать через скакалку" }
  - { pl: "skakać z tematu na temat", ru: "перескакивать с темы на тему" }
family:
  - { pl: "skoczyć", ru: "прыгнуть", relation: aspect, id: skoczyc }
  - { pl: "skok", ru: "прыжок", relation: root }
  - { pl: "skakanka", ru: "скакалка", relation: derived }
etymology: "Общеславянский корень *skok-, тот же, что в русских «скакать», «скок», «вскочить». Польский держит простой глагол в обоих видах: skakać и skoczyć, как русские «скакать» и «скочить» (последнее живёт только с приставками). Отсюда skakanka «скакалка» и skocznia «трамплин»."
memory: "skakać — «скакать, прыгать», несовершенный вид к skoczyć, и выбирают их как русские «прыгать/прыгнуть». Главное в формах: k переходит в cz, поэтому skaczę, skaczesz — как русское «плакать/плачу»."
idioms:
