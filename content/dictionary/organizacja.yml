id: organizacja
format: 2
lemma: "organizacja"
rank: 2091
pos: noun
pron: { cyr: "организа́цья" }
senses:
  - id: body
    ru: "организация (объединение)"
    examples:
      - pl: "Organizacja pozarządowa pomaga uchodźcom."
        ru: "Неправительственная организация помогает беженцам."
        source: { kind: authored }
      - pl: "Nie należę do żadnej organizacji."
        ru: "Я не состою ни в какой организации."
        source: { kind: authored }
      - pl: "Organizacje humanitarne apelują o pomoc."
        ru: "Гуманитарные организации призывают помочь."
        source: { kind: authored }
  - id: arranging
    ru: "организация (устройство, подготовка)"
    examples:
      - pl: "Organizacja konferencji zajęła pół roku."
        ru: "Организация конференции заняла полгода."
        source: { kind: authored }
      - pl: "Zajmuje się organizacją wesela."
        ru: "Она занимается организацией свадьбы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Самая загруженная форма — organizacji: она покрывает сразу родительный, дательный и предложный единственного И родительный множественного. Какой из падежей имеется в виду, подсказывает предлог или глагол: do organizacji (родительный), przekazał organizacji (дательный), w organizacji (предложный), kilka organizacji (родительный множественного)." }
  - { kind: false-friend, text: "Ловушки нет: organizacja и «организация» — одно латинское слово, и оба значения, объединение и процесс устройства, у них общие. Отличается только склонение, типичное для польских слов на -cja: именительный множественного organizacje, а не «организации»." }
  - { kind: government, text: "Вступать и выходить — предлог do с родительным: należeć do organizacji, wstąpić do organizacji. Чего организация — тоже родительный: organizacja konferencji, organizacja pracy." }
collocations:
  - { pl: "organizacja pozarządowa", ru: "неправительственная организация" }
  - { pl: "organizacja przestępcza", ru: "преступная организация" }
  - { pl: "organizacja pracy", ru: "организация труда" }
family:
  - { pl: "organizować", ru: "организовывать", relation: root }
  - { pl: "organizacyjny", ru: "организационный", relation: derived }
etymology: "Через латинское organizare от organum, а то — из греческого ὄργανον «орудие, инструмент», от ἔργον «работа» (того же корня, что «энергия»). Русское «организация» пришло тем же путём, поэтому слова совпадают; польский лишь передал латинское -tio своим обычным -cja, как в informacja и sytuacja."
memory: "organizacja — «организация», то же латинское слово; -cja отвечает русскому -ция. Главное — помнить, что форма organizacji работает за четыре падежа сразу, а именительный множественного будет organizacje."
idioms:
  - { pl: "organizacja pozarządowa", ru: "неправительственная организация" }
  - { pl: "organizacja przestępcza", ru: "преступная организация" }
formExamplesSkip:
  - { form: "organizacyj", reason: "Устаревший родительный множественного, вышедший из нормы с орфографической реформой 1936 года; современная форма — organizacji. Пример в современном польском дать нельзя, не вводя учащегося в заблуждение." }
