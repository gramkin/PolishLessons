# review
id: do-widzenia
format: 2
lemma: "do widzenia"
rank: 2480
pos: interj
pron: { cyr: "до видзэ́нья" }
senses:
  - id: farewell
    ru: "до свидания (нейтральное прощание)"
    examples:
      - pl: "Do widzenia, panie doktorze."
        ru: "До свидания, господин доктор."
        source: { kind: authored }
      - pl: "Do widzenia, do jutra!"
        ru: "До свидания, до завтра!"
        source: { kind: authored }
      - pl: "Powiedział do widzenia i wyszedł."
        ru: "Он сказал «до свидания» и вышел."
        source: { kind: authored }
      - pl: "Nie powiedziała nawet do widzenia."
        ru: "Она даже не попрощалась."
        source: { kind: authored }
      - pl: "Do widzenia i dziękuję za wszystko."
        ru: "До свидания и спасибо за всё."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Нейтральное прощание, уместное и на «вы», и на «ты». Вечером ему отвечает dobranoc «доброй ночи», а днём приветствие dzień dobry." }
  - { kind: usage, text: "Буквально «до увидения»: widzenia — родительный падеж от widzenie «видение, свидание»." }
  - { kind: government, text: "Предлог do требует родительного падежа, но в самом обороте падеж уже застыл: менять его нельзя." }
  - { kind: false-friend, text: "Разговорное cześć значит и «привет», и «пока». Do widzenia — только прощание, и звучит вежливее." }
collocations:
  - { pl: "do widzenia", ru: "до свидания" }
  - { pl: "do widzenia panu", ru: "до свидания (вежливо, мужчине)" }
family:
  - { pl: "widzieć", ru: "видеть", relation: root }
  - { pl: "widzenie", ru: "видение, свидание", relation: derived }
etymology: "Предлог do «до» плюс родительный падеж от widzenie «видение, свидание». Русское «до свидания» построено ровно так же — предлог «до» и отглагольное существительное в родительном, — поэтому оборот запоминается сразу."
memory: "do widzenia — буквально «до увидения», то есть «до свидания». Конструкция та же, что в русском: «до» плюс родительный падеж."
idioms:
