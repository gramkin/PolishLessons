# review
id: glupek
format: 2
lemma: "głupek"
rank: 1851
pos: noun
pron: { cyr: "глу́пэк" }
senses:
  - id: fool
    ru: "дурак, дурачок"
    examples:
      - pl: "Bill to zwykły głupek."
        ru: "Билл просто дурак."
        source: { kind: translated, id: 451124 }
      - pl: "Czemu Borka to taki głupek?"
        ru: "Почему Борька такой дурак?"
        source: { kind: tatoeba, id: 538711 }
      - pl: "Czułem się jak wielki głupek."
        ru: "Я почувствовал себя большим дураком."
        source: { kind: translated, id: 3038351 }
  - id: look-a-fool
    ru: "wyjść na głupka — выставить себя дураком"
    examples:
      - pl: "Wyszedłem na głupka."
        ru: "Я выставил себя дураком."
        source: { kind: translated, id: 13655320 }
      - pl: "Przestań udawać głupka!"
        ru: "Перестань валять дурака!"
        source: { kind: tatoeba, id: 3463016 }
      - pl: "Nie rób ze mnie głupka."
        ru: "Не делай из меня дурака."
        source: { kind: translated, id: 2726997 }
notes:
  - { kind: register, text: "Слово разговорное и обидное, но не бранное: примерно как русское «дурак, дурачок». В лицо человеку его лучше не говорить." }
  - { kind: usage, text: "Самый частый оборот — wyjść na głupka «выставить себя дураком», буквально «выйти дураком». Так чаще говорят о себе, чем о других." }
  - { kind: usage, text: "robić z kogoś głupka — «делать из кого-то дурака»; udawać głupka — «валять дурака, прикидываться»." }
  - { kind: usage, text: "Звательная форма głupku! употребляется как прямое оскорбление: Powiedz jej, głupku!" }
collocations:
  - { pl: "wyjść na głupka", ru: "выставить себя дураком" }
  - { pl: "udawać głupka", ru: "валять дурака" }
  - { pl: "robić z kogoś głupka", ru: "делать из кого-то дурака" }
family:
  - { pl: "głupi", ru: "глупый", relation: root, id: glupi }
  - { pl: "głupota", ru: "глупость", relation: root }
  - { pl: "idiota", ru: "идиот", relation: root, id: idiota }
etymology: "От głupi «глупый» с суффиксом -ek, как русское «дурачок» от «дурак». Суффикс смягчает, но слово всё равно обидное."
memory: "głupek — «дурак, дурачок», разговорное и обидное. Главный оборот — wyjść na głupka «выставить себя дураком», чаще о себе, чем о других."
