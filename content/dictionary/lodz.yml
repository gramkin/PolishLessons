# review
id: lodz
format: 2
lemma: "łódź"
rank: 961
pos: noun
pron: { cyr: "ўуць" }
senses:
  - id: boat
    ru: "лодка, судно"
    examples:
      - pl: "Mamy łódź."
        ru: "У нас есть лодка."
        source: { kind: translated, id: 3812987 }
      - pl: "Tom ma łódź."
        ru: "У Тома есть лодка."
        source: { kind: translated, id: 3680184 }
      - pl: "Łódź jest pełna."
        ru: "Лодка полна."
        source: { kind: translated, id: 11581343 }
  - id: on-boat
    ru: "w łodzi, na łodzi — в лодке, на лодке"
    examples:
      - pl: "Usiądź w łodzi."
        ru: "Сядь в лодку."
        source: { kind: translated, id: 7905700 }
      - pl: "Spałem na łodzi."
        ru: "Я спал на лодке."
        source: { kind: translated, id: 9676489 }
      - pl: "Jemy obiad na łodzi."
        ru: "Мы обедаем на лодке."
        source: { kind: translated, id: 11841004 }
  - id: submarine
    ru: "łódź podwodna — подводная лодка"
    examples:
      - pl: "Nasz dom jest żółtą łodzią podwodną."
        ru: "Наш дом — жёлтая подводная лодка."
        source: { kind: translated, id: 12988156 }
      - pl: "Przewiózł mnie na wyspę swoją łodzią."
        ru: "Он перевёз меня на остров на своей лодке."
        source: { kind: translated, id: 713558 }
      - pl: "Widzę łodzie rybackie na horyzoncie."
        ru: "Я вижу рыбачьи лодки на горизонте."
        source: { kind: tatoeba, id: 2122134 }
notes:
  - { kind: usage, text: "łódź podwodna — «подводная лодка», устойчивое сочетание. Обычная лодка поменьше — łódka, а лодочник — przewoźnik." }
  - { kind: usage, text: "Косвенные формы теряют ó: łódź, но łodzi, łodzią, łodzie. Чередование ó — o обычное для польского: stół — stołu, wóz — wozu." }
  - { kind: false-friend, text: "Так же пишется название города Łódź, но с прописной буквы. Различает только заглавная: w Łodzi «в Лодзи», w łodzi «в лодке». В корпусе примеров с городом не встретилось ни одного." }
  - { kind: pronunciation, text: "Читается «ўуць»: ł как у, ó как у, dź мягко. Название города звучит так же." }
collocations:
  - { pl: "łódź podwodna", ru: "подводная лодка" }
  - { pl: "łódź ratunkowa", ru: "спасательная шлюпка" }
  - { pl: "płynąć łodzią", ru: "плыть на лодке" }
  - { pl: "łódka", ru: "лодочка" }
family:
  - { pl: "łódka", ru: "лодочка", relation: derived }
  - { pl: "łodzik", ru: "наутилус", relation: derived }
etymology: "Праславянское *oldьji «долблёнка, челн». Русское «ладья» — то же слово, а «лодка» его уменьшительное; польское łódź сохранило исходное значение."
memory: "łódź — «лодка», и русский родственник у него есть: «ладья». Запомните чередование ó — o в косвенных падежах: łódź, но w łodzi. Город Łódź пишется так же, только с прописной. И łódź podwodna — «подводная лодка»."
idioms:
  - { pl: "łódź podwodna", ru: "подводная лодка" }
  - { pl: "łódź ratunkowa", ru: "спасательная шлюпка" }
  - { pl: "płynąć łodzią", ru: "плыть на лодке" }
