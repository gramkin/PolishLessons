# review
id: szereg
format: 2
lemma: "szereg"
rank: 2314
pos: noun
pron: { cyr: "ше́рэк" }
senses:
  - id: series
    ru: "ряд, некоторое количество"
    examples:
      - pl: "Ten wypadek miał szereg przyczyn."
        ru: "У этого происшествия был ряд причин."
        source: { kind: translated, id: 362892 }
      - pl: "Pacjentka miała szereg ograniczeń związanych z dietą."
        ru: "У пациентки был ряд ограничений, связанных с диетой."
        source: { kind: translated, id: 730611 }
      - pl: "Ten przepis można interpretować na szereg sposobów."
        ru: "Это правило можно толковать рядом способов."
        source: { kind: translated, id: 770281 }
  - id: rank
    ru: "шеренга, строй"
    examples:
      - pl: "Wszyscy żołnierze stali w szeregu."
        ru: "Все солдаты стояли в шеренге."
        source: { kind: translated, id: 460957 }
      - pl: "Ustawcie się w dwóch szeregach."
        ru: "Постройтесь в две шеренги."
        source: { kind: translated, id: 12240083 }
notes:
  - { kind: usage, text: "Самое частое употребление — szereg czegoś «ряд чего-л.» в значении «несколько, некоторое количество»: szereg przyczyn «ряд причин». Дополнение в родительном падеже." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — szeregu, предложный w szeregu." }
  - { kind: false-friend, text: "Не путайте с русским «шеренга»: оно как раз заимствовано из польского szereg, но в русском сузилось до строя, а в польском значит ещё и «ряд, серия»." }
  - { kind: usage, text: "Математический термин: szereg liczbowy «числовой ряд». Военное — stanąć w szeregu «встать в строй»." }
collocations:
  - { pl: "szereg przyczyn", ru: "ряд причин" }
  - { pl: "stanąć w szeregu", ru: "встать в строй" }
etymology: "Праславянское *šeregъ; русское «шеренга» — заимствование как раз из польского."
memory: "szereg — и «ряд, некоторое количество» (szereg przyczyn, с родительным), и «шеренга». Русское «шеренга» пришло из этого слова, но сузилось до строя."
idioms:
