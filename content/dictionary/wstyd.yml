notes:
  - { kind: government, text: "«Мне стыдно» — wstyd mi, безличная конструкция с дательным падежом: wstyd mi za syna «мне стыдно за сына»." }
  - { kind: usage, text: "«Покраснеть от стыда» — poczerwienieć ze wstydu, предлог z с родительным." }
  - { kind: usage, text: "Глагол — wstydzić się «стыдиться»: wstydzę się «мне стыдно, я стыжусь»." }
  - { kind: usage, text: "spalić się ze wstydu — «сгореть со стыда», то же выражение, что в русском." }
collocations:
  - { pl: "wstyd mi", ru: "мне стыдно" }
  - { pl: "ze wstydu", ru: "от стыда" }
  - { pl: "co za wstyd", ru: "какой стыд" }
etymology: "Праславянское *studъ «стыд, холод» с приставкой w-. Русское «стыд» — то же слово без приставки, и связь со «студить, стужа» видна в обоих языках."
memory: "wstyd = «стыд», и конструкция безличная: wstyd mi «мне стыдно», дательный падеж. «От стыда» — ze wstydu. Глагол — wstydzić się «стыдиться»."
