# review
id: wstyd
format: 2
lemma: "wstyd"
rank: 1755
pos: noun
pron: { cyr: "встыт" }
senses:
  - id: shame
    ru: "стыд, позор"
    examples:
      - pl: "Wstyd!"
        ru: "Стыд!"
        source: { kind: translated, id: 8746792 }
      - pl: "Co za wstyd!"
        ru: "Какой стыд!"
        source: { kind: translated, id: 973086 }
      - pl: "Wstyd mi za lenistwo mojego syna."
        ru: "Мне стыдно, что мой сын такой лентяй."
        source: { kind: tatoeba, id: 899440 }
  - id: ashamed
    ru: "wstyd mi — мне стыдно"
    examples:
      - pl: "Wstyd mi."
        ru: "Мне стыдно."
        source: { kind: translated, id: 1844985 }
      - pl: "Wstyd mi za siebie."
        ru: "Мне стыдно за себя."
        source: { kind: translated, id: 349493 }
      - pl: "Było jej wstyd, kiedy jej dziecko bardzo źle zachowało się publicznie."
        ru: "Ей было стыдно, когда её ребенок вел себя плохо на публике."
        source: { kind: tatoeba, id: 1473125 }
notes:
  - { kind: usage, text: "Обычно слово употребляется в единственном числе. Множественное wstydy встречается редко и звучит книжно — о череде постыдных случаев; примеры даны именно в этом ключе." }
  - { kind: government, text: "«Мне стыдно» — wstyd mi, безличная конструкция с дательным падежом: wstyd mi za syna «мне стыдно за сына»." }
  - { kind: usage, text: "«Покраснеть от стыда» — poczerwienieć ze wstydu, предлог z с родительным." }
  - { kind: usage, text: "Глагол — wstydzić się «стыдиться»: wstydzę się «мне стыдно, я стыжусь»." }
  - { kind: usage, text: "spalić się ze wstydu — «сгореть со стыда», то же выражение, что в русском." }
collocations:
  - { pl: "wstyd mi", ru: "мне стыдно" }
  - { pl: "ze wstydu", ru: "от стыда" }
  - { pl: "co za wstyd", ru: "какой стыд" }
etymology: "Праславянское *studъ «стыд, холод» с приставкой w-. Русское «стыд» — то же слово без приставки, и связь со «студить, стужа» видна в обоих языках."
memory: "wstyd = «стыд», и конструкция безличная: wstyd mi «мне стыдно», дательный падеж. «От стыда» — ze wstydu. Глагол — wstydzić się «стыдиться»."
idioms:
  - { pl: "wstyd mi", ru: "мне стыдно" }
  - { pl: "ze wstydu", ru: "от стыда" }
  - { pl: "spalić się ze wstydu", ru: "сгореть со стыда" }
