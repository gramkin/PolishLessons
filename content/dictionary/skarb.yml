pos: noun
pron: { cyr: "скарп" }
senses:
  - id: treasure
    ru: "сокровище, клад"
    examples:
      - pl: "Przypadkiem odnalazł skarb."
        ru: "Он случайно нашёл клад."
        source: { kind: translated, id: 629940 }
      - pl: "Dzieci będą szukały skarbu."
        ru: "Дети будут искать клад."
        source: { kind: translated, id: 6320209 }
      - pl: "Mądrość jest skarbem dla dziesiątek pokoleń."
        ru: "Мудрость — сокровище для десятков поколений."
        source: { kind: translated, id: 2809477 }
  - id: darling
    ru: "дорогой, милый (ласковое обращение)"
    examples:
      - pl: "Kocham cię, skarbie."
        ru: "Я люблю тебя, милая."
        source: { kind: translated, id: 1680459 }
      - pl: "Jak się masz, skarbie?"
        ru: "Как дела, дорогой?"
        source: { kind: translated, id: 10236809 }
      - pl: "Skarbie, chodź tutaj."
        ru: "Солнышко, иди сюда."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Этимология неожиданная: корень тот же, что в русской «скорби» — праславянское *skъrběti «заботиться, тревожиться». То, о чём тревожатся и заботятся, и становится сокровищем." }
  - { kind: usage, text: "В обращении skarbie значит «дорогой, милый, солнышко» — ровно как русское «сокровище моё»." }
  - { kind: usage, text: "za żadne skarby — «ни за какие сокровища», то есть просто «ни за что»: Nie mogę za żadne skarby zapamiętać jej adresu." }
  - { kind: usage, text: "В официальном языке skarb — это «казна»: skarb państwa «государственная казна», Ministerstwo Skarbu «Министерство финансов»." }
collocations:
  - { pl: "za żadne skarby", ru: "ни за что на свете" }
  - { pl: "skarb państwa", ru: "государственная казна" }
  - { pl: "szukać skarbu", ru: "искать клад" }
  - { pl: "mój skarbie", ru: "сокровище моё" }
etymology: "Праславянское *skъrbъ от *skъrběti «заботиться, тревожиться». Русская «скорбь» — то же гнездо: то, о чём тревожатся и пекутся, и становится «сокровищем»."
memory: "skarb — «сокровище, клад», но родня у него неожиданная: тот же корень, что в русской «скорби», от «заботиться, тревожиться». О чём заботятся, то и становится сокровищем. В обращении skarbie значит «дорогой, милый» — ровно как русское «сокровище моё». И запомните za żadne skarby «ни за какие сокровища», то есть «ни за что»."
idioms:
  - { pl: "za żadne skarby", ru: "ни за что на свете" }
  - { pl: "skarb państwa", ru: "государственная казна" }
  - { pl: "mój skarbie", ru: "сокровище моё" }
