# review
id: krwawy
format: 2
lemma: "krwawy"
rank: 2353
pos: adj
pron: { cyr: "крва́вы" }
senses:
  - id: bloody
    ru: "кровавый, кровопролитный"
    examples:
      - pl: "Głupia i krwawa wojna dobiega końca."
        ru: "Глупая и кровавая война подходит к концу."
        source: { kind: translated, id: 12942657 }
      - pl: "To była krwawa bitwa."
        ru: "Это было кровавое сражение."
        source: { kind: authored }
      - pl: "Rok zapisał się jako krwawy."
        ru: "Год запомнился как кровавый."
        source: { kind: authored }
  - id: blood-stained
    ru: "окровавленный, с кровью"
    examples:
      - pl: "Mam krwawe stolce."
        ru: "У меня кровавый стул."
        source: { kind: translated, id: 10667422 }
      - pl: "Tom lubi Krwawą Mary."
        ru: "Том любит «Кровавую Мэри»."
        source: { kind: translated, id: 1611396 }
notes:
  - { kind: government, text: "Обычное прилагательное; наречие — krwawo, сравнительная степень — krwawszy." }
  - { kind: false-friend, text: "От krew «кровь», которое уже есть в словаре. Русское «кровавый» — то же слово, только в польском корень выглядит как krw- без гласной: krew, krwi, krwawy." }
  - { kind: usage, text: "Не путайте прилагательное krwawy с глаголом krwawić «кровоточить»: Tom krwawi значит «Том истекает кровью», а не «Том кровавый»." }
  - { kind: usage, text: "Устойчивое Krwawa Mary «Кровавая Мэри» — коктейль, пишется с большой буквы." }
collocations:
  - { pl: "krwawa bitwa", ru: "кровавое сражение" }
  - { pl: "Krwawa Mary", ru: "Кровавая Мэри" }
etymology: "От krew «кровь»; русское «кровавый» — то же слово, но польский корень теряет гласную: krew, krwi, krwawy."
memory: "krwawy — «кровавый», от krew «кровь». Следите за корнем без гласной: krew, но krwi, krwawy. И не путайте с глаголом krwawić «кровоточить»."
idioms:
  - { pl: "krwawa bitwa", ru: "кровавое сражение" }
formExamplesSkip:
  - { form: "krwawi", reason: "это форма глагола krwawić «кровоточить», а не прилагательного" }
  - { form: "krwawsi", reason: "мужско-личная форма, а krwawy описывает войну, битву, год или след: krwawa bitwa, krwawy rok. Карточка не называет так людей, поэтому формы нет. Сама сравнительная степень krwawszy при этом обычна" }
  - { form: "najkrwawsi", reason: "превосходная степень; в корпусе примеров нет" }
