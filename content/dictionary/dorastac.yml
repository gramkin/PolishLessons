# review
id: dorastac
format: 2
lemma: "dorastać"
rank: 1888
pos: verb
pron: { cyr: "дора́стаць" }
senses:
  - id: grow-up
    ru: "подрастать, взрослеть"
    examples:
      - pl: "Dorastał w małym miasteczku."
        ru: "Он взрослел в маленьком городке."
        source: { kind: authored }
      - pl: "Dzieci dorastają szybciej, niż myślimy."
        ru: "Дети взрослеют быстрее, чем мы думаем."
        source: { kind: authored }
      - pl: "Dorastające dzieci potrzebują przestrzeni."
        ru: "Подрастающим детям нужно пространство."
        source: { kind: authored }
  - id: measure-up
    ru: "дотягивать, быть вровень (dorastać do czegoś)"
    examples:
      - pl: "Nie dorasta mu do pięt."
        ru: "Он ему в подмётки не годится."
        source: { kind: authored }
      - pl: "Żaden z nich nie dorasta do tej roli."
        ru: "Ни один из них не дотягивает до этой роли."
        source: { kind: authored }
  - id: adolescence
    ru: "dorastanie — взросление, отрочество"
    examples:
      - pl: "Dorastanie bywa bolesne."
        ru: "Взросление бывает болезненным."
        source: { kind: authored }
      - pl: "O dorastaniu napisał całą książkę."
        ru: "О взрослении он написал целую книгу."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид к dorosnąć: dorastał przez całe lata «он взрослел годами», но dorósł w jedno lato «он вырос за одно лето». Суффикс -ać здесь делает ровно то же, что русское «подрастать» рядом с «дорасти». Страдательного причастия нет: глагол непереходный." }
  - { kind: government, text: "Дотягивают ДО чего — предлог do с родительным: dorastać do roli, do zadania, do pięt. В переносном значении почти всегда с отрицанием: nie dorasta do pięt." }
  - { kind: false-friend, text: "Отрицательный оборот совпадает с русским до мелочей. Nie dorastać komuś DO PIĘT значит буквально «не дорастать кому-то до пяток» — то же самое, что русское «в подмётки не годится»: обе идиомы меряют человека снизу, от обуви. Даже падеж лица совпадает — дательный." }
  - { kind: register, text: "Dorastający — обычное слово для подростка в речи учителей и врачей: dorastająca młodzież «подрастающая молодёжь», okres dorastania «переходный возраст». Звучит нейтрально, в отличие от разговорного nastolatek." }
collocations:
  - { pl: "okres dorastania", ru: "переходный возраст" }
  - { pl: "nie dorastać do pięt", ru: "в подмётки не годиться" }
  - { pl: "dorastająca młodzież", ru: "подрастающая молодёжь" }
family:
  - { pl: "dorosnąć", ru: "вырасти, повзрослеть", relation: aspect }
  - { pl: "rosnąć", ru: "расти", relation: root }
  - { pl: "dorastanie", ru: "взросление", relation: derived }
etymology: "Приставка do- плюс частотная основа -rastać от того же корня, что rosnąć «расти» и русское «расти». Пара dorastać/dorosnąć устроена как русская «подрастать/дорасти»: несовершенный вид растягивает действие, совершенный ставит ему предел."
memory: "dorastać — «подрастать, взрослеть», несовершенный вид к dorosnąć. Запоминайте через идиому, которая совпадает с русской буква в букву: nie dorastać komuś do pięt — «в подмётки не годиться»."
idioms:
  - { pl: "nie dorastać komuś do pięt", ru: "в подмётки не годиться" }
  - { pl: "okres dorastania", ru: "переходный возраст" }
