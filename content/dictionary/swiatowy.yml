notes:
  - { kind: false-friend, text: "ŚWIATOWY ЭТО «МИРОВОЙ», А НЕ «СВЕТОВОЙ». Ловушка в том, что по-польски świat значит «МИР», а światło — «свет»: два похожих слова с разными значениями. Прилагательное образовано от первого, поэтому światowy это мировой, всемирный. «Световой» будет świetlny: rok świetlny «световой год»." }
  - { kind: usage, text: "Самое частое сочетание — wojna światowa «мировая война», и в Польше его слышно постоянно. Рядом живут światowej sławy «мировой известности» и na skalę światową «в мировом масштабе». Третье значение, «светский», старомодно и применяется к людям: człowiek światowy, czyli bywały." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: świa-TO-wy. Группа św звучит как «щв», ia — как «я»: «щвято́вы». В существительном świat конечное t глухое: «щвят»." }
  - { kind: register, text: "Степеней сравнения нет: прилагательное относительное, как wojenny и narodowy, отсюда одиннадцать форм. Мужско-личная форма światowi встречается в сочетаниях вроде światowi liderzy «мировые лидеры»." }
collocations:
  - { pl: "wojna światowa", ru: "мировая война" }
  - { pl: "rekord światowy", ru: "мировой рекорд" }
  - { pl: "światowej sławy", ru: "с мировым именем, всемирно известный" }
family:
  - { pl: "świat", ru: "мир", relation: root, id: swiat }
  - { pl: "światło", ru: "свет", relation: antonym, id: swiatlo }
  - { pl: "wszechświat", ru: "вселенная", relation: derived, id: wszechswiat }
etymology: "От świat «мир», из праславянского *světъ — того же слова, что русский «свет». Любопытно, что праславянское *světъ значило и «свет», и «мир»: русский сохранил оба значения в одном слове, а польский развёл их по двум — świat «мир» и światło «свет». Поэтому русское «белый свет» и польское świat — это буквально одно слово."
memory: "światowy — «МИРОВОЙ», от świat «мир». А «световой» — świetlny, от światło «свет». Польский развёл по двум словам то, что русский держит в одном: «свет» это и światło, и świat."
idioms:
