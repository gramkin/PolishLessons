notes:
  - { kind: false-friend, text: "Слово прозрачно по корню — UCZYĆ «учить» — и потому обманывает объёмом значения. UCZELNIA это всегда высшее учебное заведение: университет, политехнический институт, академия. Русское «училище» означает ровно противоположный конец системы, среднее профессиональное заведение, и по-польски ему отвечают TECHNIKUM и SZKOŁA ZAWODOWA. Полный официальный синоним UCZELNIA — SZKOŁA WYŻSZA, буквально «высшая школа», и оба слова равноправны. Отдельно стоит запомнить управление с предлогом NA: учатся NA UCZELNI, а не W UCZELNI, как учатся NA UNIWERSYTECIE." }
  - { kind: usage, text: "Десять форм, женский род, мягкая основа на -NIA. Форма UCZELNI покрывает родительный, дательный и местный единственного и служит обычным родительным множественного. Рядом с ней в парадигме стоит вторая форма родительного множественного — UCZELŃ, с нулевым окончанием и мягким Ń на конце. Обе правильны, но UCZELŃ звучит строже и чаще встречается в официальных текстах и заголовках: RANKING UCZELŃ, REKTORZY UCZELŃ. Такая двойственность обычна для слов на -NIA: рядом с CZYTELNI стоит CZYTELŃ, рядом с KSIĘGARNI — KSIĘGARŃ." }
  - { kind: pronunciation, text: "Читается «уче́льня», три слога, ударение на втором. Буквосочетание CZ даёт твёрдое «ч». Сочетание LNIA звучит «льня», с мягким L и мягким N подряд — для русского уха это одна слитная мягкая группа. В форме UCZELNIĄ последнее Ą даёт «он»: «уче́льнён». В форме UCZELNIĘ конечное Ę читается как чистое «э». Самая трудная форма — UCZELŃ: она кончается на мягкое «нь» без гласного, «уче́льнь», и такого конца в русском не бывает." }
  - { kind: register, text: "Слово нейтральное и официальное одновременно: оно стоит и в законе о высшем образовании, и в обычном разговоре студентов. Устойчивые сочетания: WYŻSZA UCZELNIA «вуз», UCZELNIA PUBLICZNA «государственный вуз», UCZELNIA PRYWATNA, MURY UCZELNI «стены вуза» в торжественной речи. Студент говорит IDĘ NA UCZELNIĘ так же буднично, как по-русски «иду в институт». Звательная форма UCZELNIO встречается только в гимнах и юбилейных речах, где обращение к учебному заведению — обычная фигура." }
