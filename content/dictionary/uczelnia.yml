etymology: "От глагола UCZYĆ «учить» с суффиксом -ELNIA, который в польском называет место действия: PRALNIA «прачечная» от PRAĆ, CZYTELNIA «читальня» от CZYTAĆ, JADALNIA «столовая» от JEŚĆ, SYPIALNIA «спальня» от SPAĆ. Русский знает ровно тот же суффикс в форме -ЛЬНЯ: «читальня», «спальня», «купальня», и строит слова по тому же правилу. Поэтому UCZELNIA — это буквально «учильня», место, где учат, и русскоязычный разбирает слово насквозь, стоит показать ему ряд. Само слово при этом позднее: в старом языке высшую школу называли AKADEMIA или SZKOŁA GŁÓWNA, а UCZELNIA вошла в обиход в двадцатом веке как родное соответствие латинскому термину."
memory: "Разбирается насквозь через суффикс: uczyć + -elnia, то есть «учильня», и ряд тот же, что в русском — pralnia «прачечная», czytelnia «читальня», sypialnia «спальня». Но значение узкое: только высшее заведение, тогда как русское «училище» — наоборот, среднее профессиональное (по-польски technikum). Учатся na uczelni, с предлогом na. Десять форм, и два родительных множественного: обычное uczelni и строгое uczelń."
