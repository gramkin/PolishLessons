etymology: "От прилагательного FANTASTYCZNY, а то — из греческого PHANTASTIKOS «относящийся к воображению», от PHANTAZEIN «показывать, являть» и далее от PHAINESTHAI «казаться, являться». Тот же корень дал «фантазию» и «фантом». Слово «фанатик» к этой семье не относится: оно идёт от латинского FANUM «храм». Зато рядом стоит греческое PHOS «свет», от которого «фотография»: исходный образ один и тот же — то, что является взгляду, показывается. Русское «фантастически» пришло тем же греко-латинским путём, через учёную латынь, и значение у слов было одинаковым; разошлись они уже в двадцатом веке, когда польское стало обиходной похвалой, а русское осталось книжным."
memory: "Не переводить как «фантастически»! В польском это обычная похвала, вроде «отлично, замечательно»: zagrali fantastycznie, czuję się fantastycznie, и как реплика Fantastycznie! «здорово!». Степени по окончанию: fantastyczniej, najfantastyczniej, как niesamowiciej. Ударение на -ty-: «фантасты́чне»."
