notes:
  - { kind: register, text: "Главное отличие от русского — не значение, а частота и регистр. Русское «фантастически» книжно и означает прежде всего «неправдоподобно»: «фантастически дорого». Польское FANTASTYCZNIE стало обычным словом похвалы, вроде русского «отлично» или «замечательно»: ZAGRALI FANTASTYCZNIE, CZUJĘ SIĘ FANTASTYCZNIE, и как самостоятельная реплика FANTASTYCZNIE! значит просто «здорово!». Поэтому переводить его русским «фантастически» чаще всего неверно по стилю: нужны «замечательно», «великолепно», «отлично». Синонимы того же круга — ŚWIETNIE, WSPANIALE, DOSKONALE." }
  - { kind: usage, text: "Наречие образовано от прилагательного FANTASTYCZNY заменой окончания на -IE, и это общее правило для прилагательных на -NY: SPOKOJNY даёт SPOKOJNIE, DOKŁADNY даёт DOKŁADNIE. Степени сравнения строятся прибавлением -EJ и приставки NAJ-: FANTASTYCZNIE, FANTASTYCZNIEJ, NAJFANTASTYCZNIEJ. Правило здесь то же, что у NIESAMOWICIE и NIESAMOWICIEJ: наречие градуируется по окончанию, а не словом «более». Впрочем, в живой речи сравнительная степень у этого наречия встречается редко — слишком оно эмоционально, чтобы его сравнивать." }
  - { kind: pronunciation, text: "Читается «фантасты́чне», ударение на предпоследнем слоге, то есть на -TYCZ-. Сочетание CZ даёт твёрдое «ч», а гласная Y — русское «ы». Конечное -NIE звучит «не», одним слогом с мягким n. Обратите внимание, что в русском слове ударение падает на другой слог: «фантасти́чески», и при переходе на польское слово его приходится переносить вперёд." }
  - { kind: government, text: "Наречие, поэтому падежами не управляет и согласования не требует. Усиливает прилагательное или другое наречие, стоя перед ним: FANTASTYCZNIE SZYBKO «фантастически быстро», FANTASTYCZNIE TANI «фантастически дешёвый». Как самостоятельная реплика употребляется без всякого окружения. С глаголом стоит после него: ZAGRALI FANTASTYCZNIE. В конструкции с ŻE вводит оценку всего предложения: FANTASTYCZNIE, ŻE PRZYSZLIŚCIE «замечательно, что вы пришли»." }
