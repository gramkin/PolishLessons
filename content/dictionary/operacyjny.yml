notes:
  - { kind: pronunciation, text: "Читается «операцы́йны», с ударением на предпоследнем слоге, то есть на CYJ. Это третий суффикс в череде, и правило снова переводится напрямую: там, где русский пишет «-ционный», польский пишет -CYJNY. OPERACJA даёт OPERACYJNY, STACJA даёт STACYJNY, SYTUACJA даёт SYTUACYJNY, PORCJA даёт PORCYJNY. Сравните -ALNY в ORYGINALNY и -YJNY в SERYJNY: один латинский источник, три польских исхода, и каждый отвечает своему русскому суффиксу." }
  - { kind: false-friend, text: "Ловушки в значении нет, оба языка употребляют слово одинаково широко, но стоит заметить, что польское OPERACYJNY покрывает сразу хирургию и технику, как и русское «операционный»: SALA OPERACYJNA — «операционная», SYSTEM OPERACYJNY — «операционная система». Расходится соседнее слово: польское OPERACJA значит и «операция» хирургическая, и «операция» военная или банковская, но для театральной оперы нужно OPERA, а прилагательное от неё — OPEROWY, не OPERACYJNY. Путать эти два прилагательных нельзя." }
  - { kind: usage, text: "Прилагательное относительное, поэтому степеней сравнения у него нет: нельзя сказать ни BARDZIEJ OPERACYJNY, ни NAJOPERACYJNIEJSZY. Одиннадцать форм — это полная картина, как у MIĘDZYNARODOWY. Сочетания стоит заучивать целиком, потому что они терминологические: SALA OPERACYJNA, BLOK OPERACYJNY, SYSTEM OPERACYJNY, KOSZTY OPERACYJNE, DZIAŁALNOŚĆ OPERACYJNA. В последних двух речь о текущей, основной деятельности предприятия." }
  - { kind: government, text: "Прилагательное согласуется с существительным и своего управления не имеет. Порядок слов в терминах устойчив и чаще всего прилагательное идёт после существительного: SALA OPERACYJNA, BLOK OPERACYJNY, SYSTEM OPERACYJNY. В финансовых оборотах бывает и наоборот, KOSZTY OPERACYJNE, но и там определение стоит после. Мужско-личная форма множественного числа OPERACYJNI почти не употребляется, потому что слово редко говорится о людях." }
