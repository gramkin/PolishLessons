etymology: "От OPERACJA, из латинского OPERATIO «работа, действие», от OPERARI «работать», которое само от OPUS «труд, произведение». Отсюда же OPERA — буквально «труды, произведения», множественное от OPUS, — так что опера и операция оказываются дальними родственниками через понятие работы. Суффикс -CYJNY образуется от существительных на -CJA правилом без исключений: берём OPERACJA, меняем -CJA на -CYJNY. Русский поступает так же, меняя «-ция» на «-ционный», поэтому соответствие полное и его достаточно выучить один раз."
memory: "Суффиксное правило: русское «-ционный» — польское -CYJNY. Operacja , затем  operacyjny, stacja , затем  stacyjny. Степеней сравнения нет, 11 форм — это всё. И не путать с operowy «оперный»: sala operacyjna — операционная, не оперный зал."
