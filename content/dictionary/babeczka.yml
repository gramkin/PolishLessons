notes:
  - { kind: false-friend, text: "BABECZKA — прежде всего «кекс, маффин» или песочная корзиночка с кремом. В разговоре — ласково о женщине, как «девчонка». Это уменьшительное от BABKA, а не от BABCIA: к бабушке отношения не имеет." }
  - { kind: register, text: "О женщине — разговорное, с одобрением или добродушно: FAJNA BABECZKA. В официальной речи не используется. Кекс в магазине иногда называют MUFFINKA." }
  - { kind: usage, text: "Девять форм, женский род. В дательном и местном K переходит в C: W BABECZCE. Родительный множественного — BABECZEK, с беглым E. Звательный BABECZKO не учим." }
  - { kind: pronunciation, text: "Читается «бабе́чка»: CZ — «ч», ударение на предпоследнем слоге." }
collocations:
  - { pl: "babeczka z kremem", ru: "корзиночка с кремом" }
  - { pl: "babeczki czekoladowe", ru: "шоколадные маффины" }
  - { pl: "upiec babeczki", ru: "испечь кексы" }
family:
  - { pl: "babka", ru: "баба (выпечка); тётка", relation: root, id: babka }
  - { pl: "ciastko", ru: "пирожное, печенье", relation: root, id: ciastko }
  - { pl: "muffinka", ru: "маффин", relation: root }
etymology: "Уменьшительное от BABKA «кекс-баба» с суффиксом -ECZKA. Значение «девушка» — от BABKA в разговорном смысле «женщина»."
memory: "Babeczka — кекс, маффин, корзиночка; в разговоре — девчонка. Upiec babeczki — испечь кексы. Читается «бабе́чка»."
idioms:
  - { pl: "fajna babeczka", ru: "классная девчонка" }
