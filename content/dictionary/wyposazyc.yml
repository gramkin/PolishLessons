notes:
  - { kind: false-friend, text: "WYPOSAŻYĆ — «оснастить, оборудовать». Корень тот же, что в POSAG, «приданое»: снабдить невесту всем нужным. Главное — управление: чем — W с винительным, а не творительный: WYPOSAŻYĆ SALĘ W PROJEKTOR. WYPOSAŻENIE — «оборудование, обстановка»: WYPOSAŻENIE MIESZKANIA." }
  - { kind: usage, text: "Пятьдесят три формы — подпись переходного глагола совершенного вида: страдательное WYPOSAŻONY и деепричастие WYPOSAŻYWSZY. Повелительное WYPOSAŻ. Видовой партнёр — WYPOSAŻAĆ. WYPOSAŻONY W — «оснащённый чем-то»: AUTO WYPOSAŻONE W NAWIGACJĘ." }
  - { kind: government, text: "Кого или что — винительный, чем — W с винительным: WYPOSAŻYĆ ŻOŁNIERZY W BROŃ, WYPOSAŻYĆ BIURO W MEBLE. Типичная ошибка русскоговорящих — творительный: не WYPOSAŻYĆ MEBLAMI, а W MEBLE." }
  - { kind: pronunciation, text: "Читается «выпоса́жыць», четыре слога, ударение на предпоследнем. Ż твёрдое, поэтому «жы», а не «жи». Конечное Ć — «ць». WYPOSAŻĘ — «выпоса́жэ»." }
  - { kind: register, text: "Деловое и официальное слово: объявления о квартирах, техника, армия. W PEŁNI WYPOSAŻONE MIESZKANIE — «полностью меблированная квартира». В быту проще: KUPIĆ, ZAŁATWIĆ SPRZĘT." }
collocations:
  - { pl: "wyposażyć w sprzęt", ru: "оснастить техникой" }
  - { pl: "w pełni wyposażony", ru: "полностью оснащённый" }
  - { pl: "wyposażenie mieszkania", ru: "обстановка квартиры" }
family:
  - { pl: "wyposażać", ru: "оснащать", relation: aspect }
  - { pl: "wyposażenie", ru: "оборудование, обстановка", relation: derived }
  - { pl: "posag", ru: "приданое", relation: root }
etymology: "От POSAG «приданое», то есть то, что дают с собой. Приставка WY- — «снабдить полностью». Изначально — «дать невесте приданое», затем «снабдить всем нужным»."
memory: "Wyposażyć — оснастить: wyposażyć w sprzęt (w + винительный, не творительный!). W pełni wyposażone mieszkanie — полностью меблированное. От posag — приданое. Читается «выпоса́жыць»."
idioms:
