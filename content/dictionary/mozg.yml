etymology: "Праславянское *mozgъ — то же слово, что русское «мозг». Польское ó стоит на месте русского «о»: mózg — «мозг», bóg — «бог»."
memory: "mózg — «мозг», слово то же самое, и польское ó стоит там, где русский держит «о», как в bóg — «бог». Главное — произношение: в именительном конечное g оглушается, и слово звучит «муск», а в косвенных падежах звук возвращается — mózgu. Идиома совпадает с русской буквально: pranie mózgu «промывание мозгов»."
