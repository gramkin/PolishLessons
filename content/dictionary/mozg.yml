notes:
  - { kind: pronunciation, text: "В именительном конечное g оглушается: mózg читается «муск». В косвенных падежах звук возвращается — mózgu «му́згу», mózgiem «му́згем»." }
  - { kind: usage, text: "Польское ó стоит там, где русский держит «о»: mózg — «мозг», как bóg — «бог», sól — «соль»." }
  - { kind: usage, text: "Идиома совпадает с русской: pranie mózgu «промывание мозгов», wyprać komuś mózg «промыть кому-то мозги»." }
  - { kind: usage, text: "Разговорное Padło ci na mózg? значит «У тебя крыша поехала?»." }
