# review
id: czekac
format: 2
lemma: "czekać"
rank: 141
pos: verb
aspect: imperf
pron: { cyr: "чэ́каць" }
senses:
  - id: wait
    ru: "ждать, ожидать (czekać na kogoś, na coś)"
    note: "Всегда с предлогом na и винительным падежом — в отличие от русского «ждать кого-то»."
    examples:
      - pl: "Czekam na pociąg."
        ru: "Я жду поезд."
        source: { kind: tatoeba, id: 705304 }
      - pl: "Czekam na odpowiedź."
        ru: "Я жду ответа."
        source: { kind: tatoeba, id: 8428283 }
      - pl: "Czekam na trolejbus."
        ru: "Я жду троллейбус."
        source: { kind: tatoeba, id: 10138264 }
  - id: await
    ru: "ждать, предстоять (о том, что впереди)"
    examples:
      - pl: "Czekam godzinami."
        ru: "Я жду уже несколько часов."
        source: { kind: tatoeba, id: 348798 }
      - pl: "Często musimy czekać."
        ru: "Нам часто приходится ждать."
        source: { kind: tatoeba, id: 6015323 }
      - pl: "Czeka nas długa droga."
        ru: "Нам предстоит долгая дорога."
        source: { kind: authored }
notes:
  - { kind: government, text: "czekać na kogoś / na coś — с предлогом na и винительным: Czekam na ciebie «Жду тебя». Без na фраза звучит неправильно." }
  - { kind: usage, text: "Без предлога глагол значит «предстоять»: Czeka nas egzamin «Нам предстоит экзамен»." }
  - { kind: usage, text: "Совершенный вид — poczekać или zaczekać: Poczekaj chwilę «Подожди минутку»." }
collocations:
  - { pl: "czekać na kogoś", ru: "ждать кого-то" }
  - { pl: "czekać w kolejce", ru: "стоять в очереди" }
  - { pl: "nie mogę się doczekać", ru: "не могу дождаться" }
  - { pl: "czekaj!", ru: "подожди!" }
etymology: "Праславянское *čekati; то же слово, что русское «чаять» и украинское «чекати». В русском корень сохранился в «нечаянно»."
memory: "Главное отличие от русского — предлог: czekać na kogoś «ждать кого-то», czekam na ciebie «жду тебя». Без na глагол значит «предстоять»: Czeka nas egzamin."
idioms:
  - { pl: "czekać na Godota", ru: "ждать у моря погоды" }
  - { pl: "czekaj tatka latka", ru: "жди у моря погоды" }
  - { pl: "nie mogę się doczekać", ru: "не могу дождаться" }
