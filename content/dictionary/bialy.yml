      - pl: "Papier jest biały."
        ru: "Бумага белая."
        source: { kind: tatoeba, id: 611731 }
      - pl: "Mój kot ma duży, biały, puszysty ogon."
        ru: "У моего кота большой, белый, пушистый хвост."
        source: { kind: tatoeba, id: 3012855 }
  - id: white-thing
    ru: "белый (о предметах, одежде, вине)"
    note: "białe wino «белое вино», biała koszula «белая рубашка»."
    examples:
      - pl: "Przyniosę butelkę białego wina."
        ru: "Я принесу бутылку белого вина."
        source: { kind: tatoeba, id: 880234 }
      - pl: "Ma białe zęby."
        ru: "У неё белые зубы."
        source: { kind: tatoeba, id: 4113125 }
      - pl: "Brzozy mają białą korę."
        ru: "У берёз белая кора."
        source: { kind: translated, id: 3869837 }
  - id: whiter
    ru: "bielszy — белее"
    note: "Сравнительная степень со смягчением ł → l."
    examples:
      - pl: "Papier jest biały, ale śnieg jest jeszcze bielszy."
        ru: "Бумага белая, но снег ещё белее."
        source: { kind: translated, id: 1203513 }
      - pl: "Ten obrus jest bielszy od tamtego."
        ru: "Эта скатерть белее той."
        source: { kind: authored }
      - pl: "Po praniu firanki są bielsze."
        ru: "После стирки занавески белее."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Степени меняют основу: biały — bielszy — najbielszy, где ł смягчается в l. Мужское личное во множественном: biali, bielsi, najbielsi." }
  - { kind: usage, text: "Устойчивые обороты: w biały dzień «средь бела дня», czarno na białym «чёрным по белому», biały jak śnieg «белый как снег»." }
  - { kind: usage, text: "biała plama значит «белое пятно» и в прямом, и в переносном смысле — о неизученном месте." }
  - { kind: usage, text: "Глагол — bieleć «белеть», существительное — biel «белизна», а bielizna — «бельё»." }
collocations:
  - { pl: "białe wino", ru: "белое вино" }
  - { pl: "w biały dzień", ru: "средь бела дня" }
  - { pl: "czarno na białym", ru: "чёрным по белому" }
  - { pl: "biały jak śnieg", ru: "белый как снег" }
family:
  - { pl: "biel", ru: "белизна", relation: derived }
  - { pl: "bieleć", ru: "белеть", relation: derived }
  - { pl: "bielizna", ru: "бельё", relation: derived }
etymology: "От праславянского *bělъ — то же слово, что русское «белый»; отсюда же biel «белизна» и bielizna «бельё»."
memory: "biały — «белый», и степени меняют основу: biały — bielszy — najbielszy, где ł смягчается в l. Мужское личное во множественном — biali, bielsi, najbielsi. Три оборота стоит запомнить целиком: w biały dzień «средь бела дня», czarno na białym «чёрным по белому» и biały jak śnieg. А bielizna, похожая на «белизну», значит на самом деле «бельё» — белизна будет biel."
idioms:
  - { pl: "w biały dzień", ru: "средь бела дня" }
  - { pl: "czarno na białym", ru: "чёрным по белому" }
  - { pl: "biały jak śnieg", ru: "белый как снег" }
