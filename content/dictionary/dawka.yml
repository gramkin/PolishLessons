etymology: "От DAWAĆ, из праславянского *davati, того же корня, что русские «давать», «дать», «дань», «подать». Суффикс -KA образует здесь имя отмеренного количества, как в GARŚĆ рядом с WSKAZÓWKA или PORCJA; буквально DAWKA — «то, что дано за один раз». Любопытно сравнить с русским: для того же понятия русский язык взял греческое ΔΌΣΙΣ через латинское DOSIS, то есть заимствовал, тогда как польский обошёлся своим глаголом. При этом греческое DOSIS само значит ровно то же — «даяние», от δίδωμι «даю», — так что два языка пришли к одной метафоре, один своим корнем, другой чужим. Из польского гнезда идут также DAWCA «даритель, донор» и PRZEDAWKOWANIE «передозировка», где приставка PRZE- отвечает русской «пере-»."
memory: "Польский построил «дозу» от своего глагола: dawka от dać, dawać — «то, что даётся за раз». Русский взял греческое «доза», которое значит буквально то же самое. Отсюда же dawca «донор» и przedawkowanie «передозировка». Читается «да́фка»: w перед глухим k оглушается в «ф», как ławka — «уафка». В дательном и местном k→c: dawce. В родительном множественного вставная e: dawek — а у oznaka она не нужна, oznak."
