notes:
  - { kind: false-friend, text: "Русский взял для этого понятия греческое слово, польский построил своё: DAWKA образована от DAĆ и DAWAĆ «дать, давать», и значит буквально «то, что даётся за раз». Поэтому DAWKA это «доза», и никакого греческого корня в ней нет. Слово DOZA в польском тоже есть, но оно книжное и чаще переносное, а обычное, аптечное и бытовое слово — DAWKA. Из того же гнезда идёт DAWCA «донор, даритель» (DAWCA KRWI «донор крови», DAWCA ORGANÓW), и PRZEDAWKOWANIE «передозировка» — слово, собранное целиком из польских частей: PRZE- плюс DAWKA." }
  - { kind: government, text: "Женский род. Чего доза — родительный: DAWKA LEKU, DAWKA HUMORU, DAWKA KRYTYKI. Частотные глаголы: ZWIĘKSZYĆ DAWKĘ «увеличить дозу», ZMNIEJSZYĆ DAWKĘ, PRZYJĄĆ DAWKĘ «принять дозу», PRZEKROCZYĆ DAWKĘ «превысить дозу». Устойчивое обстоятельство — W MAŁYCH DAWKACH «в малых дозах», с местным множественного. Прилагательные: DAWKA DZIENNA «суточная доза», DAWKA JEDNORAZOWA «однократная доза», DAWKA PRZYPOMINAJĄCA «напоминающая доза» — то, что по-русски называют ревакцинацией." }
  - { kind: usage, text: "Склонение показывает оба хода, типичных для основ на -KA. Перед окончанием -E заднее K смягчается в C: дательный и местный DAWCE, а не DAWKIE — как MATKA и MATCE, PUSZKA и PUSZCE. А в родительном множественного появляется беглая гласная E, разбивающая скопление WK: DAWEK, а не DAWK. Русский вставляет гласную в тех же местах и по той же причине: «банок», «кошек», «марок». Любопытно сравнить с OZNAKA, где вставная гласная не нужна и родительный множественного — OZNAK: решает не окончание, а то, какие согласные стоят перед ним." }
  - { kind: pronunciation, text: "Читается «да́фка», два слога, ударение на первом. Главное здесь — оглушение: буква W перед глухим K звучит как «ф», поэтому DAWKA это «дафка», а не «давка». Это регулярное польское правило, и работает оно всюду: ŁAWKA даёт «уафка», TRAWKA даёт «трафка». В формах, где после W стоит гласная, озвончение возвращается: DAWEK читается «да́вэк», DAWCE — «да́фце», потому что C тоже глухое. Так одно слово показывает правило и его границу." }
