# review
id: kariera
format: 2
lemma: "kariera"
rank: 1350
pos: noun
pron: { cyr: "карье́ра" }
senses:
  - id: career
    ru: "карьера, профессиональный путь"
    examples:
      - pl: "Kariera aktora trwała trzydzieści lat."
        ru: "Карьера актёра длилась тридцать лет."
        source: { kind: translated, id: 7886474 }
      - pl: "Jego kariera zawodowa legła w gruzach."
        ru: "Его профессиональная карьера рухнула."
        source: { kind: translated, id: 761305 }
      - pl: "Kariera Toma trwała od 1993 do 2013 roku."
        ru: "Карьера Тома длилась с 1993 по 2013 год."
        source: { kind: translated, id: 7679537 }
  - id: make-career
    ru: "robić karierę — делать карьеру"
    examples:
      - pl: "Robił karierę w pracy kosztem rodziny."
        ru: "Он делал карьеру на работе ценой семьи."
        source: { kind: translated, id: 356905 }
      - pl: "Aby zrobić karierę, trzeba być człowiekiem energicznym."
        ru: "Чтобы сделать карьеру, нужно быть энергичным человеком."
        source: { kind: translated, id: 596638 }
      - pl: "Kiedy Justin Bieber rozpoczął karierę muzyczną, miał zaledwie 14 lat."
        ru: "Когда Джастин Бибер начал свою музыкальную карьеру, ему было четырнадцать лет."
        source: { kind: tatoeba, id: 478288 }
  - id: choose
    ru: "выбрать карьеру, мечтать о карьере"
    examples:
      - pl: "Wybrał karierę prawniczą."
        ru: "Он выбрал карьеру юриста."
        source: { kind: translated, id: 1605604 }
      - pl: "Kiedyś marzyłem o karierze modela."
        ru: "Когда-то я мечтал о карьере модели."
        source: { kind: translated, id: 969903 }
      - pl: "Wielu zazdrości mu z powodu jego błyskotliwej kariery."
        ru: "Многие завидуют ему из-за его блестящей карьеры."
        source: { kind: translated, id: 2826247 }
notes:
  - { kind: usage, text: "Robić karierę «делать карьеру» — самый частый оборот, ровно как в русском." }
  - { kind: government, text: "marzyć o karierze «мечтать о карьере» — предлог o с предложным падежом." }
  - { kind: usage, text: "Kariera zawodowa — «профессиональная карьера». Само слово нейтральное, без оттенка карьеризма." }
  - { kind: pronunciation, text: "Сочетание -rie- звучит как «-рье-»: карье́ра. Ударение на предпоследний слог." }
collocations:
  - { pl: "robić karierę", ru: "делать карьеру" }
  - { pl: "kariera zawodowa", ru: "профессиональная карьера" }
  - { pl: "marzyć o karierze", ru: "мечтать о карьере" }
etymology: "Из французского carrière «поприще», от латинского carrus «повозка» — изначально «дорога для повозок». Русская «карьера» пришла тем же путём."
memory: "kariera — «карьера». Главный оборот robić karierę «делать карьеру». Мечтают о ней с предлогом o: marzyć o karierze. Слово нейтральное, без осуждения."
idioms:
  - { pl: "robić karierę", ru: "делать карьеру" }
  - { pl: "kariera zawodowa", ru: "профессиональная карьера" }
  - { pl: "błyskotliwa kariera", ru: "блестящая карьера" }
formExamplesSkip:
