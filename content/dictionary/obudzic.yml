# review
id: obudzic
format: 2
lemma: "obudzić"
rank: 641
pos: verb
aspect: perf
pron: { cyr: "обу́дзиць" }
senses:
  - id: wake-someone
    ru: "разбудить (кого-л. — винительный)"
    note: "Obudź mnie o ósmej «Разбуди меня в восемь»."
    examples:
      - pl: "Obudź mnie o ósmej."
        ru: "Разбуди меня в восемь."
        source: { kind: tatoeba, id: 906080 }
      - pl: "On obudził mnie wcześnie rano."
        ru: "Он разбудил меня рано утром."
        source: { kind: tatoeba, id: 6030196 }
      - pl: "Obudziła go."
        ru: "Она его разбудила."
        source: { kind: translated, id: 1859809 }
  - id: wake-up
    ru: "obudzić się — проснуться"
    note: "Русский берёт здесь второй глагол, поляк обходится частицей się."
    examples:
      - pl: "Obudziłem się o siódmej rano."
        ru: "Я проснулся в семь утра."
        source: { kind: tatoeba, id: 3443030 }
      - pl: "Tom obudził się z bólem głowy."
        ru: "Том проснулся с головной болью."
        source: { kind: tatoeba, id: 2395758 }
      - pl: "W końcu się obudziłem."
        ru: "Я наконец проснулся."
        source: { kind: tatoeba, id: 12478540 }
  - id: wake-call
    ru: "Obudź się! — Проснись!; опомнись!"
    note: "Переносное значение то же, что у русского «проснись»."
    examples:
      - pl: "Obudź się!"
        ru: "Проснись!"
        source: { kind: translated, id: 355509 }
      - pl: "Musisz się obudzić."
        ru: "Тебе надо проснуться."
        source: { kind: translated, id: 12229232 }
      - pl: "Dzieci, obudźcie się!"
        ru: "Дети, просыпайтесь!"
        source: { kind: translated, id: 10592754 }
  - id: woken
    ru: "obudzony — разбуженный"
    examples:
      - pl: "Byłem gwałtownie obudzony przez głośny dźwięk."
        ru: "Меня резко разбудил громкий звук."
        source: { kind: translated, id: 3781640 }
      - pl: "Obudzono mnie nagle przed świtem."
        ru: "Меня внезапно разбудили перед рассветом."
        source: { kind: translated, id: 712467 }
      - pl: "Znacznie lepiej jest być obudzonym przez ptaszki niż przez budzik."
        ru: "Гораздо лучше, когда тебя будят птицы, а не будильник."
        source: { kind: translated, id: 1895360 }
notes:
  - { kind: government, text: "obudzić kogoś — винительный: obudź mnie, obudził nas. А «проснуться» — то же слово с się: obudziłem się o siódmej. Русский здесь берёт два разных глагола, «разбудить» и «проснуться», поляку хватает одного." }
  - { kind: usage, text: "Несовершенный вид — budzić; от него же budzik «будильник»." }
  - { kind: usage, text: "Повелительное Obudź się! значит и «проснись», и переносное «опомнись», ровно как в русском." }
  - { kind: usage, text: "Страдательные формы обычны: byłem obudzony przez głośny dźwięk «меня разбудил громкий звук»." }
collocations:
  - { pl: "obudzić się", ru: "проснуться" }
  - { pl: "obudź mnie o...", ru: "разбуди меня в..." }
  - { pl: "budzik", ru: "будильник" }
  - { pl: "obudzić dziecko", ru: "разбудить ребёнка" }
family:
  - { pl: "budzić", ru: "будить", relation: aspect }
  - { pl: "budzik", ru: "будильник", relation: derived }
  - { pl: "przebudzenie", ru: "пробуждение", relation: derived }
etymology: "Приставка o- плюс budzić, праславянское *buditi — то же слово, что русское «будить». Из того же гнезда польское bdeć и русское «бдеть»."
memory: "obudzić — «разбудить», и главное отличие от русского вот в чём: поляк обходится одним глаголом там, где русский берёт два. Obudzić kogoś значит «разбудить кого-то», а obudzić się — уже «проснуться»: obudziłem się o siódmej. Несовершенный вид — budzić, отсюда же budzik «будильник». И запомните Obudź się! — это и «проснись», и «опомнись», ровно как в русском."
idioms:
  - { pl: "obudzić się", ru: "проснуться" }
  - { pl: "obudź mnie o…", ru: "разбуди меня в…" }
  - { pl: "budzik", ru: "будильник" }
