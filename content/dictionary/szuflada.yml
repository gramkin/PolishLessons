notes:
  - { kind: false-friend, text: "SZUFLADA — «выдвижной ящик» в столе или комоде. Просто «ящик», коробка — PUDŁO, SKRZYNKA. Писать «в стол», без надежды на публикацию, по-польски — PISAĆ DO SZUFLADY." }
  - { kind: usage, text: "Девять живых форм, женский род. В местном падеже D переходит в DZ: W SZUFLADZIE. Родительный множественного — SZUFLAD. Звательный не даётся." }
  - { kind: government, text: "В ящике — W SZUFLADZIE, в ящик — DO SZUFLADY, из ящика — Z SZUFLADY. Ящик стола — SZUFLADA BIURKA, родительный." }
  - { kind: pronunciation, text: "Читается «шуфла́да», ударение на предпоследнем слоге. SZ — «ш», LA — «ла»." }
collocations:
  - { pl: "górna szuflada", ru: "верхний ящик" }
  - { pl: "otworzyć szufladę", ru: "открыть ящик" }
  - { pl: "szuflada biurka", ru: "ящик письменного стола" }
family:
  - { pl: "szufladka", ru: "ящичек", relation: derived }
  - { pl: "szufladkować", ru: "раскладывать по полочкам, навешивать ярлыки", relation: derived }
  - { pl: "zaszufladkować", ru: "навесить ярлык", relation: derived }
etymology: "Из немецкого слова, сложенного из «двигать» и «ящик»: ящик, который выдвигают. Глагол ZASZUFLADKOWAĆ — «засунуть в ящичек», то есть навесить ярлык."
memory: "Szuflada — выдвижной ящик. Читается «шуфла́да». W szufladzie — в ящике. Pisać do szuflady — писать в стол. Zaszufladkować — навесить ярлык."
idioms:
  - { pl: "pisać do szuflady", ru: "писать в стол" }
formExamplesSkip:
