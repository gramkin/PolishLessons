# review
id: przyzwoity
format: 2
lemma: "przyzwoity"
rank: 4346
pos: adj
pron: { cyr: "пшызвои́ты" }
senses:
  - id: decent
    ru: "порядочный, приличный (о человеке, поведении)"
    examples:
      - pl: "To przyzwoity człowiek, można mu ufać."
        ru: "Это порядочный человек, ему можно доверять."
        source: { kind: authored }
      - pl: "Zachowuj się przyzwoicie, przyzwoity chłopak tak nie robi."
        ru: "Веди себя прилично: порядочный парень так не поступает."
        source: { kind: authored }
      - pl: "Był najprzyzwoitszym politykiem w rządzie."
        ru: "Он был самым порядочным политиком в правительстве."
        source: { kind: authored }
  - id: reasonable
    ru: "приличный, сносный (о сумме, качестве)"
    examples:
      - pl: "Dostał przyzwoitą pensję."
        ru: "Он получил приличную зарплату."
        source: { kind: authored }
      - pl: "Hotel był przyzwoity i niedrogi."
        ru: "Отель был приличным и недорогим."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому PRZYZWOITY ничего не подсказывает, а слово частое. Оно значит «порядочный, приличный»: и о человеке, и о деньгах или качестве. PRZYZWOITA PENSJA — «приличная зарплата», PRZYZWOITY CZŁOWIEK — «порядочный человек». Синоним о человеке — PORZĄDNY." }
  - { kind: usage, text: "Полная парадигма: PRZYZWOITY, PRZYZWOITSZY, NAJPRZYZWOITSZY. Мужское-личное с чередованием T на C: PRZYZWOICI; в степенях — PRZYZWOITSI, NAJPRZYZWOITSI. Наречие PRZYZWOICIE — «прилично, порядочно»." }
  - { kind: government, text: "Ставится и до, и после существительного: PRZYZWOITY CZŁOWIEK, CENA PRZYZWOITA. Прилично себя вести — ZACHOWYWAĆ SIĘ PRZYZWOICIE, наречием. В сравнении — NIŻ или OD с родительным." }
  - { kind: pronunciation, text: "Читается «пшызвои́ты», четыре слога, ударение на предпоследнем: «пшы-зво-и́-ты». PRZY — «пшы». O и I произносятся раздельно." }
  - { kind: register, text: "Нейтральное слово с оттенком одобрения. О деньгах и качестве — сдержанная похвала: «неплохо, сносно». В разговоре синонимы — NIEZŁY, PORZĄDNY, SPOKO." }
collocations:
  - { pl: "przyzwoity człowiek", ru: "порядочный человек" }
  - { pl: "przyzwoita pensja", ru: "приличная зарплата" }
  - { pl: "przyzwoite warunki", ru: "приличные условия" }
family:
  - { pl: "przyzwoicie", ru: "прилично", relation: derived, id: przyzwoicie }
  - { pl: "przyzwoitość", ru: "порядочность", relation: derived }
  - { pl: "porządny", ru: "порядочный, добротный", relation: root, id: porzadny }
etymology: "По-видимому, от старопольского PRZYZWOIĆ, «соглашаться, допускать», того же корня, что POZWOLIĆ, «позволить», и русское «воля», «изволить». Приличное — то, что можно допустить, с чем все согласны."
memory: "Przyzwoity — порядочный; и приличный: przyzwoity człowiek, przyzwoita pensja. Przyzwoitszy, najprzyzwoitszy; мн. ч. przyzwoici. Читается «пшызвои́ты»."
idioms:
  - { pl: "w granicach przyzwoitości", ru: "в рамках приличия" }
