notes:
  - { kind: usage, text: "WYBLAKŁY — бывшее причастие прошедшего времени от глагола WYBLAKNĄĆ «выцвести», то есть буквально «выцветший». Поэтому оно описывает результат: ткань, фото или краска уже потеряли цвет. Степеней сравнения в простой форме у него нет; если нужно, говорят BARDZIEJ WYBLAKŁY. Женская форма WYBLAKŁA совпадает с прошедшим временем глагола (FARBA WYBLAKŁA «краска выцвела»), и различает их только контекст." }
  - { kind: government, text: "Причину выцветания поляк вводит предлогом OD с родительным: WYBLAKŁY OD SŁOŃCA, OD PRANIA, OD DESZCZU. По-русски здесь обычно «на солнце» или «от стирки», и дословное «на» в польском будет ошибкой: говорят ZASŁONY WYBLAKŁE OD SŁOŃCA, а не «na słońcu»." }
  - { kind: pronunciation, text: "Буква Ł читается как неслоговое «у», поэтому WYBLAKŁY звучит «выбла́куы», а не «выблаклый». Ударение на предпоследнем слоге, на A. В мужско-личной форме множественного числа Ł переходит в обычное L: WYBLAKLI, «выбла́кли»." }
collocations:
  - { pl: "wyblakłe zdjęcie", ru: "выцветшая фотография" }
  - { pl: "wyblakły od słońca", ru: "выгоревший на солнце" }
  - { pl: "wyblakłe wspomnienia", ru: "поблёкшие воспоминания" }
family:
  - { pl: "wyblaknąć", ru: "выцвести", relation: root }
  - { pl: "blaknąć", ru: "блёкнуть, выцветать", relation: root }
  - { pl: "wyblakłość", ru: "блёклость", relation: derived }
  - { pl: "jaskrawy", ru: "яркий", relation: antonym }
synonyms: ["blady", "spłowiały", "wypłowiały"]
etymology: "Причастие от WYBLAKNĄĆ, где приставка WY- обозначает доведённое до конца действие, а BLAKNĄĆ — тот же корень, что в русских «блёклый» и «блекнуть»."
memory: "WYBLAKŁY — это «вы-блёклый»: вещь, из которой блеск и цвет вышли до конца. Выцветшая фотография по-польски wyblakłe zdjęcie."
idioms:
