# review
id: doprowadzic
format: 2
lemma: "doprowadzić"
rank: 1503
pos: verb
aspect: perf
pron: { cyr: "допрова́дзиць" }
senses:
  - id: lead-to
    ru: "привести к чему-либо"
    examples:
      - pl: "Ta droga doprowadzi cię tam."
        ru: "Эта дорога приведёт тебя туда."
        source: { kind: translated, id: 3005231 }
      - pl: "Takie zachowanie może doprowadzić do wypadku."
        ru: "Такое поведение может привести к аварии."
        source: { kind: translated, id: 600481 }
      - pl: "Co cię tutaj doprowadziło?"
        ru: "Что тебя сюда привело?"
        source: { kind: translated, id: 4816732 }
  - id: drive-to
    ru: "довести (до состояния)"
    examples:
      - pl: "Brat prawie doprowadził mnie do szaleństwa."
        ru: "Брат чуть с ума меня не свёл."
        source: { kind: tatoeba, id: 8664477 }
      - pl: "Twoje słowa doprowadziły Toma do płaczu."
        ru: "Твои слова заставили Тома заплакать."
        source: { kind: tatoeba, id: 12655226 }
      - pl: "Hazard doprowadził go do ruiny."
        ru: "Азартные игры довели его до разорения."
        source: { kind: translated, id: 364675 }
  - id: bring-to-end
    ru: "довести до конца, привести в порядок"
    examples:
      - pl: "Musisz doprowadzić swój plan do końca."
        ru: "Ты должен довести свой план до конца."
        source: { kind: translated, id: 6547539 }
      - pl: "Doprowadź rower do ładu."
        ru: "Приведи велосипед в порядок."
        source: { kind: translated, id: 925814 }
notes:
  - { kind: usage, text: "Совершенный вид к doprowadzać. Приставка do- означает «до конца, до предела»: prowadzić «вести» дало doprowadzić «довести»." }
  - { kind: government, text: "doprowadzić do czegoś — «привести к чему-то», с do и родительным: doprowadzić do wypadku, doprowadzić do łez." }
  - { kind: usage, text: "Ходовые обороты: doprowadzić kogoś do szału «довести до бешенства», doprowadzić do końca «довести до конца», doprowadzić do ładu «привести в порядок»." }
  - { kind: usage, text: "Рядом стоит przyprowadzić «привести (человека)», которое уже есть карточкой: przy- о приходе, do- о доведении до состояния." }
collocations:
  - { pl: "doprowadzić do końca", ru: "довести до конца" }
  - { pl: "doprowadzić do szału", ru: "довести до бешенства" }
  - { pl: "doprowadzić do łez", ru: "довести до слёз" }
etymology: "Приставка do- и prowadzić «вести» (праславянское *voditi). Русское «довести» собрано из тех же частей, и значения совпадают почти полностью."
memory: "doprowadzić — «довести, привести», do- плюс prowadzić, как русское «до-» плюс «вести». Управление: doprowadzić do czegoś. Запомните doprowadzić do szału «довести до бешенства» и doprowadzić do ładu «привести в порядок»."
idioms:
