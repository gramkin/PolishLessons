notes:
  - { kind: false-friend, text: "PSYCHOLOG — «психолог», но с Y: «псыхо́лок». Психиатр — PSYCHIATRA, а разговорное PSYCHOL — грубое «псих». Сходить к психологу — IŚĆ DO PSYCHOLOGA." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Во множественном две равноправные формы: PSYCHOLOGOWIE и PSYCHOLODZY, где G переходит в DZ. Творительный — PSYCHOLOGIEM. Женщину-психолога тоже называют PSYCHOLOG: PANI PSYCHOLOG." }
  - { kind: government, text: "К психологу — DO PSYCHOLOGA, у психолога — U PSYCHOLOGA, родительный. По мнению психологов — WEDŁUG PSYCHOLOGÓW." }
  - { kind: pronunciation, text: "Читается «псыхо́лок», ударение на предпоследнем слоге. PSY — «псы», CH — «х», конечное G оглушается в «к»." }
collocations:
