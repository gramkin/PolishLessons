# review
id: sprawiac
format: 2
lemma: "sprawiać"
rank: 989
pos: verb
aspect: imperf
aspectPair: sprawic
pron: { cyr: "спра́вяць" }
senses:
  - id: cause
    ru: "sprawiać, że… — делать так, что…"
    note: "Главный польский способ передать «заставлять, делать так, чтобы»; единого русского соответствия нет."
    examples:
      - pl: "Co sprawia, że tak myślisz?"
        ru: "Почему ты так думаешь?"
        source: { kind: translated, id: 6441454 }
      - pl: "Tom sprawia, że jestem lepszy."
        ru: "Том делает меня лучше."
        source: { kind: translated, id: 12097163 }
      - pl: "Kwiaty sprawiają, że jest szczęśliwa."
        ru: "Цветы делают её счастливой."
        source: { kind: translated, id: 4917224 }
  - id: give
    ru: "sprawiać radość, ból, kłopot — доставлять радость, боль, хлопоты"
    examples:
      - pl: "To sprawia mi radość."
        ru: "Это доставляет мне радость."
        source: { kind: translated, id: 3410008 }
      - pl: "Sprawiało mi to przyjemność."
        ru: "Это доставляло мне удовольствие."
        source: { kind: translated, id: 12454039 }
      - pl: "Nie chcieliśmy sprawiać bólu."
        ru: "Мы не хотели причинять боль."
        source: { kind: translated, id: 2684363 }
  - id: impression
    ru: "sprawiać wrażenie — производить впечатление"
    examples:
      - pl: "Tom sprawiał wrażenie bogatego."
        ru: "Том производил впечатление богатого."
        source: { kind: translated, id: 12045078 }
      - pl: "Sprawiała wrażenie, że to lubi."
        ru: "Она производила впечатление, что ей это нравится."
        source: { kind: translated, id: 7663699 }
      - pl: "Sprawiacie wrażenie że to dla was trudne."
        ru: "Вы производите впечатление, что вам это трудно."
        source: { kind: translated, id: 4885148 }
notes:
  - { kind: government, text: "sprawiać, ŻE… — «делать так, что…». Co sprawia, że tak myślisz? буквально «Что делает так, что ты так думаешь?», то есть «Почему ты так думаешь?». В русском единого соответствия нет, конструкцию надо запоминать целиком." }
  - { kind: government, text: "sprawiać KOMUŚ radość, ból, kłopot — дательный падеж: sprawiasz mi radość «ты доставляешь мне радость», Przepraszam, że sprawiam ci kłopot." }
  - { kind: usage, text: "sprawiać wrażenie «производить впечатление» — то же управление, что у существительного wrażenie: sprawiać wrażenie kogoś значит «производить впечатление кого-то»." }
  - { kind: usage, text: "Совершенный вид — sprawić. Отдельно запомните sprawić sobie coś «купить себе, обзавестись»: sprawił sobie nowy rower." }
collocations:
  - { pl: "sprawiać radość", ru: "доставлять радость" }
  - { pl: "sprawiać kłopot", ru: "доставлять хлопоты" }
  - { pl: "sprawiać wrażenie", ru: "производить впечатление" }
  - { pl: "sprawiać, że", ru: "делать так, что" }
family:
  - { pl: "sprawić", ru: "сделать, доставить", relation: aspect, id: sprawic }
  - { pl: "sprawa", ru: "дело", relation: root, id: sprawa }
  - { pl: "sprawca", ru: "виновник", relation: derived }
etymology: "От sprawa «дело», праславянское *prav- — тот же корень, что в русских «справить», «справиться» и «правый». Значение «делать так, что» развилось из «улаживать дело»."
memory: "sprawiać — «доставлять, причинять»: sprawiać komuś radość, ból, kłopot, с дательным. И главное — оборот sprawiać, ŻE…: Co sprawia, że tak myślisz? Это польский способ сказать «отчего так выходит, что…», единого русского соответствия нет."
idioms:
  - { pl: "sprawiać wrażenie", ru: "производить впечатление" }
  - { pl: "sprawiać kłopot", ru: "доставлять хлопоты" }
  - { pl: "sprawić sobie coś", ru: "купить себе, обзавестись" }
formExamplesSkip:
  - { form: "sprawiani", reason: "мужско-личная форма страдательного причастия: глагол управляет только отвлечёнными дополнениями (radość, kłopot, wrażenie), людей «доставлять» нельзя" }
