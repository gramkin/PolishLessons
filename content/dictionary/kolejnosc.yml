etymology: "От KOLEJ, а оно от KOŁO «колесо, круг», от праславянского *kolo, то есть от того же слова, что русское «колесо» и «коло». Исходный образ — поворот колеса: чья очередь, тот и на ходу. Из этого образа выросли оба значения KOLEJ: очередь, то есть поворот по кругу, и железная дорога, то есть путь для колёс. Русская «колея» того же корня, но закрепилась только за вещественным следом колеса. А для очереди русский взял совсем другой образ, «очередь» от «чередить», то есть от смены и череды."
memory: "За словом стоит kolej с двумя значениями: «очередь» и «железная дорога», и оба из образа колеса, kolo. Русская «колея» того же корня, но только о пути. Шесть форм, суффикс -ość отвечает русскому -ость. Самое полезное производное — kolejny «следующий, очередной», kolejny raz, и переводить его как «колейный» нельзя. Поправить управление: według kolejności zgłoszeń с родительным, где русский ставит «по» с дательным. Читается «коле́йносьчь»."
