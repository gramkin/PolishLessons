notes:
  - { kind: false-friend, text: "За этим словом стоит KOLEJ, у которого два значения, и оба русскому знакомы по разным словам. KOLEJ значит «очередь»: TERAZ MOJA KOLEJ — «теперь моя очередь». И то же слово значит «железная дорога»: JECHAĆ KOLEJĄ — «ехать поездом», KOLEJ WARSZAWSKA. Русское «колея» того же корня, но сохранило только второй, вещественный смысл, рельсовый путь. Так что увидев KOLEJ, надо смотреть на контекст: это либо очередь, либо железная дорога." }
  - { kind: usage, text: "Шесть форм, разряд женских существительных на -OŚĆ, где суффикс отвечает русскому -ОСТЬ. Множественное число употребляется редко, потому что слово обозначает отвлечённый порядок, а не отдельные предметы. Важнее другое производное того же корня: KOLEJNY значит «следующий, очередной», и это одно из самых частых польских прилагательных: KOLEJNY RAZ «очередной раз», KOLEJNA PRÓBA «следующая попытка». Переводить его как «колейный» нельзя ни в каком случае." }
  - { kind: government, text: "В каком порядке — предлог W с предложным: W KOLEJNOŚCI ALFABETYCZNEJ «в алфавитном порядке», W ODWROTNEJ KOLEJNOŚCI «в обратном порядке», как и по-русски. По порядку чего — предлог WEDŁUG с родительным: WEDŁUG KOLEJNOŚCI ZGŁOSZEŃ «по порядку заявок», тогда как русский обходится предлогом «по» с дательным. Изменить порядок — ZMIENIĆ KOLEJNOŚĆ, винительный без предлога." }
  - { kind: pronunciation, text: "Читается «коле́йносьчь», три слога, ударение на втором, то есть на предпоследнем. Сочетание EJ звучит как «эй», поэтому середина слова «лей». Буква O в начале читается как «о», без всякого носового оттенка. Конец слова, -ŚĆ, это два мягких звука подряд, «сьчь», слитно и без гласной между ними. В слове KOLEJ слышно «ко́лей», с ударением на первом слоге." }
  - { kind: register, text: "Слово нейтральное, частое в объявлениях, регламентах и очередях. Частые обороты: W KOLEJNOŚCI ALFABETYCZNEJ, WEDŁUG KOLEJNOŚCI ZGŁOSZEŃ «по порядку заявок», W ODWROTNEJ KOLEJNOŚCI «в обратном порядке», ZMIENIĆ KOLEJNOŚĆ. В живой очереди скажут проще, через KOLEJ: CZYJA KOLEJ «чья очередь», STAĆ W KOLEJCE «стоять в очереди», где KOLEJKA — уменьшительное и означает именно очередь людей." }
