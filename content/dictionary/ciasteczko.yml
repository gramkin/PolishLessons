notes:
  - { kind: usage, text: "Это уменьшительное второй ступени: CIASTO — CIASTKO — CIASTECZKO. И первое звено русскому уже непривычно: польское CIASTO значит и «тесто», и «пирог, торт», а CIASTKO — «пирожное». Так что ciasteczko — это маленькое печенье, и цепочка уменьшительных длиннее нашей. Склоняется оно в точности как miasteczko: восемь форм, и родительный множественного CIASTECZEK с беглым e." }
  - { kind: false-friend, text: "Второе значение пришло из английского: CIASTECZKA — это браузерные куки, калька с cookies. Русский взял само английское слово, поляк перевёл его своим. Поэтому фраза zgoda na ciasteczka на сайте не имеет отношения к выпечке, и это первое, на чём спотыкается читающий по-польски интернет." }
collocations:
  - { pl: "domowe ciasteczka", ru: "домашнее печенье" }
  - { pl: "zgoda na ciasteczka", ru: "согласие на куки" }
  - { pl: "blacha ciasteczek", ru: "противень печенья" }
family:
  - { pl: "ciastko", ru: "пирожное", relation: root }
  - { pl: "ciasto", ru: "тесто; пирог", relation: root, id: ciasto }
  - { pl: "piec", ru: "печь", relation: root }
etymology: "Двойное уменьшительное от CIASTO, из праславянского *těsto — того же слова, что русское «тесто». Суффиксы -k- и -eczk- нанизаны один на другой, как в miasto — miasteczko. Русский на этом месте сменил корень: от «теста» мы уменьшительных для выпечки не строим, а говорим «печенье» от «печь»."
memory: "Склоняется как miasteczko, включая беглое e: kilka ciasteczek. И помни второе значение: ciasteczka на сайте — это куки, а не выпечка."
idioms:
  - { pl: "zgoda na ciasteczka", ru: "согласие на использование куки" }
  - { pl: "domowe ciasteczka", ru: "домашнее печенье" }
