# review
id: wycofac
format: 2
lemma: "wycofać"
rank: 1931
pos: verb
aspect: perf
pron: { cyr: "выцо́фаць" }
senses:
  - id: withdraw-self
    ru: "отступить, пойти на попятную, выйти из дела"
    examples:
      - pl: "Nie chcę się wycofać."
        ru: "Я не хочу идти на попятную."
        source: { kind: translated, id: 12832597 }
      - pl: "Nie możesz się wycofać."
        ru: "Ты не можешь пойти на попятную."
        source: { kind: translated, id: 7881528 }
      - pl: "Jest już za późno, żeby się wycofać."
        ru: "Уже слишком поздно отступать."
        source: { kind: translated, id: 4769685 }
      - pl: "Tom się wycofał."
        ru: "Том пошёл на попятную."
        source: { kind: translated, id: 12360228 }
      - pl: "Dlaczego się wycofałeś?"
        ru: "Почему ты отступил?"
        source: { kind: translated, id: 9547074 }
      - pl: "Kiedy się wycofał, interes przejął syn."
        ru: "Когда он отошёл от дел, дело перенял сын."
        source: { kind: translated, id: 361902 }
  - id: withdraw-thing
    ru: "отозвать, вывести, изъять"
    examples:
      - pl: "Możemy tylko mieć nadzieję, że rząd wycofa swoje wojsko."
        ru: "Нам остаётся только надеяться, что правительство выведет свои войска."
        source: { kind: translated, id: 6159905 }
      - pl: "Wycofaj swoje uwagi!"
        ru: "Возьми назад свои замечания!"
        source: { kind: translated, id: 7493654 }
      - pl: "Zagraniczni inwestorzy wycofali swoje pieniądze z USA."
        ru: "Иностранные инвесторы вывели свои деньги из США."
        source: { kind: translated, id: 7051746 }
notes:
  - { kind: usage, text: "Чаще всего встречается возвратная форма wycofać się «отступить, пойти на попятную»: Nie możesz się wycofać." }
  - { kind: usage, text: "Без się значит «вывести, отозвать, изъять»: wycofać wojsko «вывести войска», wycofać produkt «изъять товар»." }
  - { kind: usage, text: "Рядом с карточкой cofnąć «отодвинуть, взять назад»: wycofać — это cofnąć с приставкой wy-, с оттенком «вывести наружу, изъять»." }
collocations:
  - { pl: "wycofać się", ru: "отступить, пойти на попятную" }
  - { pl: "wycofać wojsko", ru: "вывести войска" }
  - { pl: "wycofać swoje słowa", ru: "взять свои слова назад" }
etymology: "wy- + cofać «отодвигать», от cofnąć. Приставка wy- добавляет значение «наружу, прочь», отсюда «вывести, изъять» и возвратное «отступить»."
memory: "wycofać się — «отступить, пойти на попятную», самая частая форма. Без się это «вывести, изъять»: wycofać wojsko, wycofać produkt."
idioms:
  - { pl: "wycofać się", ru: "отступить, пойти на попятную" }
  - { pl: "wycofać wojsko", ru: "вывести войска" }
  - { pl: "wycofać swoje słowa", ru: "взять свои слова назад" }
