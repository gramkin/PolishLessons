# review
id: zanotowac
format: 2
lemma: "zanotować"
rank: 2344
pos: verb
aspect: perf
pron: { cyr: "заното́ваць" }
senses:
  - id: note-down
    ru: "записать, отметить"
    examples:
      - pl: "Zanotuj to proszę."
        ru: "Запиши это, пожалуйста."
        source: { kind: translated, id: 457343 }
      - pl: "Czy mógłbyś to uprzejmie zanotować?"
        ru: "Не мог бы ты любезно это записать?"
        source: { kind: translated, id: 8287881 }
      - pl: "Sekretarka zanotowała to, co jej szef powiedział."
        ru: "Секретарша записала то, что сказал её начальник."
        source: { kind: translated, id: 393338 }
  - id: take-order
    ru: "принять (заказ), зафиксировать"
    examples:
      - pl: "Czy mogę zanotować twoje zamówienie?"
        ru: "Могу я записать ваш заказ?"
        source: { kind: translated, id: 11899493 }
      - pl: "Dlaczego nie zanotowałeś ważnych punktów?"
        ru: "Почему ты не записал важные пункты?"
        source: { kind: translated, id: 351362 }
notes:
  - { kind: government, text: "Винительный падеж: zanotować adres, zanotować zamówienie." }
  - { kind: false-friend, text: "za- + notować «записывать», из латинского nota. Русское «нотация» и «нота» — та же семья, но значения разошлись." }
  - { kind: usage, text: "Приставка za- даёт завершённость: notować «записывать» → zanotować «записать»." }
  - { kind: usage, text: "В официальной речи zanotowano значит «зафиксировано»: zanotowano wzrost cen «зафиксирован рост цен»." }
collocations:
  - { pl: "zanotować adres", ru: "записать адрес" }
  - { pl: "zanotować zamówienie", ru: "принять заказ" }
etymology: "za- + notować «записывать», из латинского nota «пометка»."
memory: "zanotować — «записать». Приставка za- даёт завершённость: notować «записывать» → zanotować «записать». Официальное zanotowano — «зафиксировано»."
idioms:
  - { pl: "zanotować adres", ru: "записать адрес" }
