# review
id: kibicowac
format: 2
lemma: "kibicować"
rank: 2551
pos: verb
pron: { cyr: "кибицова́ць" }
senses:
  - id: support-team
    ru: "болеть за (кого-л.), поддерживать (кого-л.) — с ДАТЕЛЬНЫМ падежом"
    examples:
      - pl: "Kibicuję Legii od dziecka."
        ru: "Я болею за «Легию» с детства."
        source: { kind: authored }
      - pl: "Komu kibicujesz w tym meczu?"
        ru: "За кого ты болеешь в этом матче?"
        source: { kind: authored }
      - pl: "Cała rodzina kibicuje Lechowi."
        ru: "Вся семья болеет за «Лех»."
        source: { kind: authored }
  - id: root-for
    ru: "желать успеха, поддерживать (не только в спорте)"
    examples:
      - pl: "Kibicujemy wam z całego serca."
        ru: "Мы болеем за вас всем сердцем."
        source: { kind: authored }
      - pl: "Rodzice kibicują córce na zawodach."
        ru: "Родители болеют за дочь на соревнованиях."
        source: { kind: authored }
      - pl: "Kibicowałem ci w duchu."
        ru: "Я болел за тебя в душе."
        source: { kind: authored }
notes:
  - { kind: government, text: "kibicować требует ДАТЕЛЬНОГО падежа: kibicuję Legii, kibicuję ci, kibicują drużynie. Русское «болеть» строится иначе — «за» + винительный: болею за «Легию», болею за тебя. Это одна из самых частых ошибок русскоговорящих: сказать «kibicuję za Legię» нельзя." }
  - { kind: government, text: "У глагола нет страдательного причастия. Дополнение стоит в дательном падеже, а дательный участник в подлежащее не повышается, поэтому формы «kibicowany» просто не существует — в парадигме есть только действительное kibicujący." }
  - { kind: false-friend, text: "Русское «болеть» — одно слово для двух разных смыслов, польский их разводит: chorować «быть больным» и kibicować «поддерживать команду». «Болею за „Легию“» — kibicuję Legii, а «я болею» (простудился) — jestem chory, choruję." }
  - { kind: usage, text: "Несовершенный вид; совершенный — pokibicować «поболеть (некоторое время)». Отглагольное существительное kibicowanie «поддержка, болеение за команду»; исполнитель — kibic." }
collocations:
  - { pl: "kibicować drużynie", ru: "болеть за команду" }
  - { pl: "kibicować komuś z trybun", ru: "болеть за кого-л. с трибун" }
  - { pl: "głośno kibicować", ru: "громко болеть" }
family:
  - { pl: "kibic", ru: "болельщик, фанат", relation: root }
  - { pl: "kibicowanie", ru: "поддержка, болеение за команду", relation: derived }
  - { pl: "pokibicować", ru: "поболеть (некоторое время)", relation: aspect }
etymology: "Образовано от существительного kibic «болельщик», а оно заимствовано из немецкого Kiebitz. По-немецки Kiebitz — «чибис»; в карточном жаргоне так стали называть того, кто стоит рядом и смотрит игрокам в карты, то есть наблюдателя без права голоса. Через идиш тот же немецкий корень дал английское kibitzer. В русском этого заимствования нет — там говорят «болельщик»."
memory: "kibicować + ДАТЕЛЬНЫЙ: kibicuję Legii = «болею за „Легию“». Русский ставит «за» и винительный, польский — просто дательный, без предлога. И не путай с chorować «быть больным»: русское «болеть» в польском распадается на два глагола."
idioms:
  - { pl: "kibicować do końca", ru: "болеть до конца, не бросать своих" }
  - { pl: "kibicować z kanapy", ru: "болеть с дивана, не ходя на стадион" }
