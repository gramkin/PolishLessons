senses:
  - id: gesture
    ru: "жест"
    examples:
      - pl: "Zrobił niecierpliwy gest."
        ru: "Он сделал нетерпеливый жест."
        source: { kind: translated, id: 8397011 }
      - pl: "Przywołałem go gestem."
        ru: "Я подозвал его жестом."
