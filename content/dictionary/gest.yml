        source: { kind: translated, id: 352960 }
  - id: gesture-fig
    ru: "жест (поступок, знак внимания)"
    examples:
      - pl: "Doceniam ten gest."
        ru: "Я ценю этот жест."
        source: { kind: translated, id: 10482328 }
      - pl: "Nie mam pojęcia, co znaczą jej gesty."
        ru: "Я понятия не имею, что значат её жесты."
        source: { kind: translated, id: 440699 }
notes:
  - { kind: government, text: "Мужской неодушевлённый; родительный — gestu. Жестом — gestem, творительный падеж без предлога." }
  - { kind: false-friend, text: "Из латинского gestus, как и русский «жест». Значения совпадают, включая переносное «красивый поступок»: piękny gest." }
  - { kind: usage, text: "Язык жестов — język migowy, а не «gestów»: это устойчивый термин с другим корнем." }
  - { kind: usage, text: "Оборот zrobić gest значит «сделать широкий жест», проявить щедрость." }
collocations:
  - { pl: "piękny gest", ru: "красивый жест" }
  - { pl: "gestem", ru: "жестом" }
etymology: "Из латинского gestus «движение тела», как и русское «жест»."
memory: "gest — «жест», мужского рода. Жестом — gestem, творительный без предлога. Но язык жестов — język migowy, другой корень."
idioms:
  - { pl: "piękny gest", ru: "красивый жест" }
