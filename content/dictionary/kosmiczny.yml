notes:
  - { kind: usage, text: "ПОЧЕМУ ФОРМ ВСЕГО ОДИННАДЦАТЬ. Прилагательное относительное, степеней сравнения у него нет: нельзя быть «более космическим». Поэтому парадигма короткая — одиннадцать форм против тридцати трёх у градуируемых вроде równy или tani, где две трети таблицы занимают сравнительная и превосходная степень. Разговорное значение «запредельный» степени иногда допускает в речи, но на письме их избегают." }
  - { kind: false-friend, text: "Ловушек нет: kosmos, kosmiczny, kosmonauta пришли в оба языка из греческого одним путём и совпадают полностью. Одно расхождение всё же есть — kosmita «инопланетянин». Слово построено от того же корня, а в русском такого нет вовсе: там говорят «инопланетянин», от совсем другой основы." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: kos-MICZ-ny, «косми́чны». cz читается как ч, конечное -y как ы. В женском роде ударение остаётся там же: kosmiczna — «косми́чна»." }
collocations:
  - { pl: "statek kosmiczny", ru: "космический корабль" }
  - { pl: "przestrzeń kosmiczna", ru: "космическое пространство" }
  - { pl: "promieniowanie kosmiczne", ru: "космическое излучение" }
family:
  - { pl: "kosmos", ru: "космос", relation: root }
  - { pl: "kosmita", ru: "инопланетянин", relation: derived }
  - { pl: "kosmonauta", ru: "космонавт", relation: derived }
etymology: "От kosmos, из греческого kosmos «порядок, строй, мироздание». В русский слово пришло тем же путём и в ту же эпоху, поэтому «космос» и «космический» совпадают с польскими. Любопытная родня: «косметика» — от того же греческого корня, это буквально «приведение в порядок». Отсюда же kosmita и kosmonauta."
memory: "kosmiczny — «космический», слово общее, учить нечего. Запомните две мелочи: форм всего одиннадцать, потому что относительные прилагательные не сравниваются; и «косметика» с «космосом» — родственники, оба от греческого «порядок»."
idioms:
  - { pl: "kosmiczne ceny", ru: "космические цены" }
  - { pl: "kosmiczny bałagan", ru: "страшный беспорядок" }
