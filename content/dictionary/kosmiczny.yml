      - pl: "Polska ma własną agencję kosmiczną."
        ru: "У Польши есть собственное космическое агентство."
        source: { kind: authored }
  - id: huge
    ru: "разг. невероятный, запредельный"
    examples:
      - pl: "Ceny biletów są kosmiczne."
        ru: "Цены на билеты космические."
        source: { kind: authored }
      - pl: "Zrobił kosmiczny bałagan w kuchni."
        ru: "Он устроил космический бардак на кухне."
