        ru: "Лучше износиться, чем заржаветь."
        source: { kind: translated, id: 914729 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — RDZEWIEĆ «ржаветь». Настоящего времени нет: ZARDZEWIEJE — это будущее «заржавеет». Спряжение на -EJĘ: ZARDZEWIEJĘ, ZARDZEWIEJESZ, ZARDZEWIEJĄ; в прошедшем E переходит в A: ZARDZEWIAŁ, но ZARDZEWIELI." }
  - { kind: false-friend, text: "Корень RDZ — это русская «ржа», «ржавчина»: RDZA «ржавчина». Не путайте с RDZEŃ «стержень, ядро». Ржавое железо — ZARDZEWIAŁE ŻELAZO; нержавеющая сталь — STAL NIERDZEWNA." }
  - { kind: pronunciation, text: "DZ — один звук «дз»: ZARDZEWIEĆ — «зардзэ́вець», а не «зард-зе-…». Ударение на предпоследнем слоге: ZARDZEWIAŁ — «зардзэ́вяу»." }
  - { kind: usage, text: "Глагол непереходный: ржавеет сам предмет. Форма ZARDZEWIAŁY служит и прилагательным «ржавый»: ZARDZEWIAŁY GWÓŹDŹ. Переносно о навыках и о людях: ZARDZEWIAŁEM «я заржавел, растерял форму»." }
collocations:
  - { pl: "zardzewiały gwóźdź", ru: "ржавый гвоздь" }
  - { pl: "całkiem zardzewieć", ru: "совсем заржаветь" }
  - { pl: "zardzewieć od wilgoci", ru: "заржаветь от сырости" }
family:
  - { pl: "rdzewieć", ru: "ржаветь", relation: aspect }
  - { pl: "rdza", ru: "ржавчина", relation: root }
  - { pl: "nierdzewny", ru: "нержавеющий", relation: derived }
  - { pl: "zardzewiały", ru: "ржавый, заржавевший", relation: derived }
etymology: "Приставка ZA- плюс RDZEWIEĆ, от RDZA «ржавчина», которой соответствует русское «ржа»."
memory: "Rdza — это «ржа»: zardzewieć — «заржаветь». Rower zostawiony na deszczu zardzewieje."
idioms:
  - { pl: "lepiej się zużyć, niż zardzewieć", ru: "лучше износиться, чем заржаветь (о пользе дела)" }
formExamplesSkip:
