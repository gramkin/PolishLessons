      - pl: "Gwoździe w płocie dawno zardzewiały."
        ru: "Гвозди в заборе давно заржавели."
        source: { kind: authored }
  - id: lose-skill
    ru: "перен. заржаветь, утратить навык от бездействия"
    examples:
      - pl: "Mój niemiecki trochę zardzewiał po studiach."
        ru: "Мой немецкий немного заржавел после университета."
