# review
id: wykazac
format: 2
lemma: "wykazać"
rank: 3054
pos: verb
pron: { cyr: "выка́заць" }
senses:
  - id: demonstrate
    ru: "показать, выявить, обнаружить"
    examples:
      - pl: "Kontrola wykazała braki w dokumentacji."
        ru: "Проверка выявила недостатки в документации."
        source: { kind: authored }
      - pl: "Badanie wykazało podwyższony cukier."
