  - id: show-quality
    ru: "проявить (качество, инициативу)"
    examples:
      - pl: "Wykazał dużo cierpliwości przy dzieciach."
        ru: "Он проявил много терпения с детьми."
        source: { kind: authored }
      - pl: "Wykazała inicjatywę i dostała awans."
        ru: "Она проявила инициативу и получила повышение."
        source: { kind: authored }
  - id: prove
    ru: "доказать, обосновать"
    examples:
      - pl: "Adwokat wykazał niewinność klienta."
        ru: "Адвокат доказал невиновность клиента."
        source: { kind: authored }
      - pl: "Nie wykazali żadnego związku między tymi faktami."
        ru: "Они не доказали никакой связи между этими фактами."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Корень тот же, что в WSKAZAĆ из партии про указание, и предупреждение то же: KAZAĆ значит «велеть», SKAZAĆ — «приговорить», и к «сказать» ни то ни другое отношения не имеет. WYKAZAĆ же близко к русскому «выказать», но употребляется гораздо шире и нейтральнее: русское «выказать» звучит книжно, а польское WYKAZAĆ — обиходное слово проверок, анализов и отчётов. Русский переводит его то «показать», то «выявить», то «проявить», то «доказать», смотря по дополнению." }
  - { kind: usage, text: "Подлежащее у этого глагола чаще не человек, а документ или исследование: KONTROLA WYKAZAŁA, BADANIE WYKAZAŁO, RACHUNEK WYKAZAŁ. Это язык отчётов, и в нём же живёт существительное WYKAZ — «список, перечень»: WYKAZ OBECNOŚCI, WYKAZ OCEN. Русского слова с таким корнем нет, так что WYKAZ надо выучить отдельно. Возвратное WYKAZAĆ SIĘ значит «показать себя, отличиться»: WYKAZAŁ SIĘ ODWAGĄ — и требует творительного падежа." }
  - { kind: government, text: "Что — винительный: WYKAZAĆ BŁĄD, BRAKI, CIERPLIWOŚĆ, NIEWINNOŚĆ. Отрицание берёт родительный: NIE WYKAZALI ŻADNEGO ZWIĄZKU. А возвратное WYKAZAĆ SIĘ идёт с творительным, и это стоит заметить отдельно: WYKAZAĆ SIĘ ODWAGĄ, WIEDZĄ, DOŚWIADCZENIEM — «проявить себя смелостью, знаниями». Так что один глагол требует двух разных падежей в зависимости от того, есть ли при нём SIĘ." }
  - { kind: pronunciation, text: "Мена z на ż в личных формах, как у WSKAZAĆ: WYKAZAĆ даёт WYKAŻĘ, WYKAŻESZ, WYKAŻE, WYKAŻĄ. Повелительное WYKAŻ оканчивается на ż и читается с оглушением, «выкаш». Всё слово звучит «выка́заць», с ударением на предпоследнем слоге, а в формах на -byśmy ударение уходит на третий слог от конца." }
collocations:
  - { pl: "kontrola wykazała", ru: "проверка выявила" }
  - { pl: "wykazać się odwagą", ru: "проявить смелость" }
  - { pl: "wykaz obecności", ru: "список присутствующих" }
family:
  - { pl: "wykazywać", ru: "показывать, выявлять", relation: aspect }
  - { pl: "wskazać", ru: "указать", relation: root, id: wskazac }
  - { pl: "wykaz", ru: "список, перечень", relation: derived }
etymology: "Приставка wy- «вы-» и KAZAĆ, из праславянского *kazati «показывать, являть» — того же корня, что русские «казать», «показать», «указать». Приставка wy- вынимает скрытое на свет, отсюда и значения: проверка выявила недостатки, анализ показал отклонение, адвокат доказал невиновность. Русское «выказать» построено точно так же, но осталось книжным и сузилось до чувств, тогда как польское WYKAZAĆ стало рабочим словом отчётов и экспертиз. От него же WYKAZ «перечень» — то, где всё выложено на вид."
memory: "wykazać — это «показать, выявить, проявить», слово отчётов и проверок: kontrola wykazała. А с się требует творительного: wykazać się odwagą «проявить смелость»."
idioms:
  - { pl: "wykazać się", ru: "показать себя, отличиться" }
  - { pl: "kontrola wykazała", ru: "проверка выявила" }
