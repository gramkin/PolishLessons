# review
id: samochod
format: 2
lemma: "samochód"
rank: 230
pos: noun
pron: { cyr: "само́хут" }
senses:
  - id: car
    ru: "автомобиль, машина"
    examples:
      - pl: "Mam samochód."
        ru: "У меня есть автомобиль."
        source: { kind: tatoeba, id: 1640772 }
      - pl: "Myje samochód."
        ru: "Он моет машину."
        source: { kind: tatoeba, id: 12700134 }
      - pl: "Piękny samochód."
        ru: "Красивая машина."
        source: { kind: tatoeba, id: 10768436 }
  - id: car-daily
    ru: "машина (в повседневной речи)"
    examples:
      - pl: "To mój samochód."
        ru: "Это мой автомобиль."
        source: { kind: tatoeba, id: 3005126 }
      - pl: "Czy masz samochód?"
        ru: "У тебя есть машина?"
        source: { kind: tatoeba, id: 577435 }
      - pl: "Ile masz samochodów?"
        ru: "Сколько у тебя машин?"
        source: { kind: tatoeba, id: 588877 }
notes:
  - { kind: usage, text: "«На машине» — samochodem, творительный падеж: Jadę samochodem do pracy. Предлог не нужен." }
  - { kind: usage, text: "В разговорной речи чаще говорят auto или wóz; samochód — нейтральное слово." }
  - { kind: usage, text: "prowadzić samochód значит «водить машину»; «водитель» — kierowca." }
collocations:
  - { pl: "jechać samochodem", ru: "ехать на машине" }
  - { pl: "prowadzić samochód", ru: "водить машину" }
  - { pl: "samochód osobowy", ru: "легковой автомобиль" }
  - { pl: "wsiąść do samochodu", ru: "сесть в машину" }
etymology: "Польский неологизм 1912 года: sam «сам» + chód «ход», то есть «самоход»; слово выбрали на конкурсе журнала «Lotnik i Automobilista»."
memory: "samochód — это «самоход»: sam «сам» + chód «ход». «На машине» — одним словом в творительном: samochodem."
idioms:
  - { pl: "samochód osobowy", ru: "легковой автомобиль" }
  - { pl: "jechać samochodem", ru: "ехать на машине" }
  - { pl: "prowadzić samochód", ru: "водить машину" }
formExamplesSkip:
  - { form: "samochodzie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
