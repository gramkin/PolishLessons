# review
id: szczep
format: 2
lemma: "szczep"
rank: 2145
pos: noun
pron: { cyr: "шчэп" }
senses:
  - id: tribe
    ru: "племя, род"
    examples:
      - pl: "Szczep zamieszkiwał te ziemie od wieków."
        ru: "Племя населяло эти земли веками."
        source: { kind: authored }
      - pl: "To starożytny szczep."
        ru: "Это древнее племя."
        source: { kind: authored }
      - pl: "Wodzowie szczepu zebrali się."
        ru: "Вожди племени собрались."
        source: { kind: authored }
  - id: strain
    ru: "штамм (микроорганизма); привой"
    examples:
      - pl: "Nowy szczep wirusa jest groźny."
        ru: "Новый штамм вируса опасен."
        source: { kind: authored }
      - pl: "Odkryto szczep odporny na leki."
        ru: "Обнаружен штамм, устойчивый к лекарствам."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Три далёких значения в одном слове: «племя», «штамм» микроорганизма и садовый «привой»." }
  - { kind: false-friend, text: "Не «щепка» — та будет drzazga. Корень szczepić «прививать, расщеплять», отсюда и прививка szczepienie." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — szczepu." }
  - { kind: usage, text: "В скаутском обиходе szczep значит отряд. В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "szczep wirusa", ru: "штамм вируса" }
  - { pl: "szczep harcerski", ru: "скаутский отряд" }
etymology: "От szczepić «прививать, расщеплять», праславянское *ščepiti; ср. русское «щепить», «щепа»."
memory: "szczep — «племя», «штамм» и «привой» сразу. Корень szczepić «прививать». Щепка — это drzazga, не szczep."
