notes:
  - { kind: usage, text: "Два значения: дерево (миндаль как растение) и выпечка — миндальный пирог." }
  - { kind: false-friend, text: "Сам орех — migdał, а migdałowiec это дерево или пирог. Русское «миндаль» покрывает и орех, и дерево, польский их различает." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — migdałowca." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "kwitnący migdałowiec", ru: "цветущее миндальное дерево" }
etymology: "От migdał «миндаль», через латинское amygdala из греческого; русское «миндаль» пришло тем же путём."
memory: "migdałowiec — миндальное дерево или миндальный пирог. Сам орех — migdał. Польский различает орех и дерево, русский — нет."
idioms:
  - { pl: "kwitnący migdałowiec", ru: "цветущее миндальное дерево" }
