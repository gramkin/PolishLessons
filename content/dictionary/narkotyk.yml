etymology: "Через французское narcotique из греческого νάρκη «оцепенение». Русское «наркотик» — то же заимствование, поэтому слова совпадают."
memory: "narkotyk — «наркотик», слово международное. В живой речи почти всегда во множественном: narkotyki. Запомните сочетание с глаголом brać: brać narkotyki «принимать наркотики». Наркоман — narkoman, наркоз — narkoza."
