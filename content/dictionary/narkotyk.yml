        ru: "Наркотики — рак современного общества."
        source: { kind: translated, id: 983408 }
  - id: take
    ru: "brać narkotyki — принимать наркотики"
    note: "Устойчивое сочетание: «принимать» здесь brać, а не przyjmować."
    examples:
      - pl: "Sami brał narkotyki."
        ru: "Он принимал наркотики."
        source: { kind: translated, id: 9679208 }
      - pl: "Myślę, że Tom nie bierze narkotyków."
        ru: "Думаю, Том не принимает наркотики."
        source: { kind: translated, id: 3038618 }
      - pl: "Sprzedaje narkotyki na koncertach."
        ru: "Он продаёт наркотики на концертах."
        source: { kind: translated, id: 13335692 }
  - id: say-no
    ru: "о борьбе с наркотиками"
    examples:
      - pl: "Powiedz narkotykom nie."
        ru: "Скажи наркотикам нет."
        source: { kind: translated, id: 4755998 }
      - pl: "Powiedz nie narkotykom."
        ru: "Скажи нет наркотикам."
        source: { kind: translated, id: 7904536 }
      - pl: "Walka z narkotykami trwa od lat."
        ru: "Борьба с наркотиками идёт много лет."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В живой речи слово почти всегда во множественном числе: narkotyki «наркотики». Единственное narkotyk встречается редко, обычно в специальных текстах." }
  - { kind: usage, text: "brać narkotyki — «принимать наркотики», устойчивое сочетание с глаголом brać «брать». Торговец — diler или handlarz narkotyków." }
  - { kind: false-friend, text: "Не путайте с narkoza «наркоз»: это разные слова, хотя корень один. Обезболивающее вообще — środek przeciwbólowy." }
  - { kind: pronunciation, text: "Ударение на предпоследнем слоге: nar-KO-tyk, тогда как по-русски «наркОтик» — тоже на втором. Совпадает." }
collocations:
