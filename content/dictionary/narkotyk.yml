# review
id: narkotyk
format: 2
lemma: "narkotyk"
rank: 927
pos: noun
pron: { cyr: "нарко́тык" }
senses:
  - id: drug
    ru: "наркотик"
    examples:
      - pl: "Policyjne psy szukały narkotyków na lotnisku."
        ru: "Полицейские собаки искали наркотики в аэропорту."
        source: { kind: tatoeba, id: 6207831 }
      - pl: "Tu nie ma żadnych narkotyków."
        ru: "Здесь нет никаких наркотиков."
        source: { kind: translated, id: 9401312 }
