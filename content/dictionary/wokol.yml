# review
id: wokol
format: 2
lemma: "wokół"
rank: 1214
pos: adv
pron: { cyr: "во́куу" }
senses:
  - id: around
    ru: "вокруг, кругом"
    examples:
      - pl: "Ziemia krąży wokół Słońca."
        ru: "Земной шар вращается вокруг Солнца."
        source: { kind: tatoeba, id: 709318 }
      - pl: "Wokół jeziora rosną wysokie sosny."
        ru: "Вокруг озера растут высокие сосны."
        source: { kind: tatoeba, id: 2225094 }
      - pl: "Wszystko wokół niego było szare."
        ru: "Вокруг него всё было серым."
        source: { kind: tatoeba, id: 413002 }
  - id: look
    ru: "rozejrzeć się wokół — оглядеться вокруг"
    examples:
      - pl: "Tom rozejrzał się wokół, ale nie zobaczył nikogo."
        ru: "Том огляделся вокруг, но никого не увидел."
        source: { kind: tatoeba, id: 13560643 }
      - pl: "Usiedliśmy wokół ogniska."
        ru: "Мы сели вокруг костра."
        source: { kind: translated, id: 968922 }
notes:
  - { kind: government, text: "Как предлог wokół требует родительного падежа: wokół domu «вокруг дома», wokół stołu «вокруг стола». Как наречие идёт без дополнения: Wokół było cicho «Вокруг было тихо»." }
  - { kind: usage, text: "Рядом живёт dookoła с тем же значением; wokół чуть нейтральнее и чаще встречается в письменной речи." }
  - { kind: usage, text: "Переносно — «вокруг темы»: dyskusja wokół ustawy «дискуссия вокруг закона», krążyć wokół tematu «ходить вокруг да около»." }
  - { kind: pronunciation, text: "ó читается как у, ł как у: wokół звучит «вокуу»." }
collocations:
  - { pl: "wokół domu", ru: "вокруг дома" }
  - { pl: "rozejrzeć się wokół", ru: "оглядеться вокруг" }
  - { pl: "wokół stołu", ru: "вокруг стола" }
family:
  - { pl: "koło", ru: "круг; около", relation: root, id: kolo }
  - { pl: "dookoła", ru: "кругом, вокруг", relation: derived }
etymology: "Из w + okół, от koło «круг» — буквально «в круг». Русское «вокруг» собрано точно так же: «в» плюс «круг»."
memory: "wokół — «вокруг», и работает и как предлог с родительным (wokół domu), и как наречие (Wokół było cicho). Синоним — dookoła. Читается «вокуу»: и ó, и ł дают у."
idioms:
  - { pl: "rozejrzeć się wokół", ru: "оглядеться вокруг" }
  - { pl: "owinąć wokół palca", ru: "обвести вокруг пальца" }
