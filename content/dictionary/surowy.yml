etymology: "Из праславянского *syrovъ «сырой, свежий, необработанный», и русские «сырой» и «суровый» — оба его потомки, разошедшиеся по смыслу. «Сырой» сохранил исходное значение необработанности и влажности, «суровый» развил переносное: необработанный, грубый, а затем строгий и жёсткий. Польский не стал делить слово и оставил оба значения за одной формой SUROWY, так что для русского оно выглядит как два слова в одном. В гнездо надёжно входят SUROWY, SUROWIEC «сырьё» и SUROWOŚĆ «суровость, строгость». Для памяти достаточно одного: там, где русский выбирает между «сырым» и «суровым», польский говорит SUROWY."
memory: "Одно слово на два русских: surowe mięso «сырое мясо» и surowy nauczyciel «суровый учитель». Оба русских слова — родня польскому, от *syrovъ. Решает существительное рядом. Степени без -niejszy: surowszy, najsurowszy, как młodszy и starszy. Наречие surowo «строго»: surowo zabronione."
idioms:
