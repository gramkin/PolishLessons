notes:
  - { kind: false-friend, text: "Одно польское слово покрывает то, что русский развёл по двум, и оба русских слова — его же родственники. SUROWY значит, во-первых, «сырой, необработанный»: SUROWE MIĘSO «сырое мясо», SUROWA MARCHEWKA, SUROWIEC «сырьё». Во-вторых, «суровый, строгий»: SUROWY NAUCZYCIEL, SUROWA KARA «суровое наказание», SUROWY KLIMAT. Русский в первом случае скажет «сырой», во втором «суровый», и оба слова восходят к одному праславянскому корню, разошедшись по значениям. Поэтому угадывать перевод нельзя: решает существительное рядом. Мясо бывает сырым, учитель суровым, а климат по-польски SUROWY в обоих смыслах сразу." }
  - { kind: usage, text: "Степени сравнения образуются без суффикса -NIEJSZY: SUROWY, SUROWSZY, NAJSUROWSZY. Это разряд коротких исконных прилагательных, которые наращивают только -SZY, как MŁODY и MŁODSZY, STARY и STARSZY, и противоположность длинным на -NY, где нужен полный суффикс: ROZSĄDNY и ROZSĄDNIEJSZY. Отличать их приходится по длине и происхождению основы, и SUROWY — хороший образец первого разряда. Наречие — SUROWO, и оно значит «строго»: SUROWO ZABRONIONE «строго запрещено», надпись, которую стоит узнавать с первого взгляда." }
  - { kind: pronunciation, text: "Читается «суро́вы», ударение на предпоследнем слоге, то есть на -RO-. Все гласные открытые, без редукции, и первое U звучит полным «у». Конечное Y даёт «ы». Мужско-личная форма множественного SUROWI звучит «суро́ви», с мягким w перед i. В сравнительной степени SUROWSZY стечение WSZ произносится «фш», с оглушением: «суро́фшы». Русское «суровый» звучит почти так же, и это помогает: перестраивать нужно только окончание." }
  - { kind: government, text: "Прилагательное согласуется с существительным и ничем не управляет. При сравнении — предлог OD с родительным или союз NIŻ: SUROWSZY OD POPRZEDNIEGO, SUROWSZY NIŻ POPRZEDNI. В значении «строгий» слово часто стоит при отглагольных существительных: SUROWY ZAKAZ «строгий запрет», SUROWA OCENA «строгая оценка», SUROWE KARY. В значении «сырой» оно сочетается с продуктами и материалами: SUROWE JAJO, SUROWA SKÓRA, SUROWY TYNK «необработанная штукатурка», и последнее в строительстве значит «черновая отделка»." }
