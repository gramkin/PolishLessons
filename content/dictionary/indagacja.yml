# review
id: indagacja
format: 2
lemma: "indagacja"
rank: 5635
pos: noun
pron: { cyr: "индага́цья" }
senses:
  - id: questioning
    ru: "расспросы, допытывание"
    examples:
      - pl: "Nie znosił takiej indagacji."
        ru: "Он не выносил таких расспросов."
        source: { kind: authored }
      - pl: "Poddano go długiej indagacji."
        ru: "Его подвергли долгим расспросам."
        source: { kind: authored }
      - pl: "Indagacja trwała godzinę."
        ru: "Расспросы длились час."
        source: { kind: authored }
  - id: interrogation
    ru: "дознание, допрос (книжное)"
    examples:
      - pl: "Po indagacji zwolniono go do domu."
        ru: "После допроса его отпустили домой."
        source: { kind: authored }
      - pl: "Unikał indagacji dziennikarzy."
        ru: "Он избегал расспросов журналистов."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово книжное и слегка ироническое: о назойливых расспросах, а не о официальном допросе. Юридический допрос — przesłuchanie." }
  - { kind: false-friend, text: "Латинское заимствование (indagatio «розыск»), как и русское «индагация», которого в живом языке нет. Опираться на русский здесь не на что." }
  - { kind: government, text: "Женский род: ta indagacja, tej indagacji." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную. Глагол — indagować kogoś «допытываться у кого-л.»." }
collocations:
  - { pl: "poddać indagacji", ru: "подвергнуть расспросам" }
etymology: "Из латинского indagatio «розыск, расследование»."
memory: "indagacja — книжное «расспросы, допытывание», с оттенком назойливости. Официальный допрос — przesłuchanie."
idioms:
  - { pl: "poddać indagacji", ru: "подвергнуть расспросам" }
formExamplesSkip:
  - { form: "indagacjo", reason: "звательная форма, а indagacja — это допрос, расспросы. Обращаться к ним некому, поэтому форма остаётся только в таблице склонения" }
  - { form: "indagacyj", reason: "устаревшее окончание родительного множественного. Современная форма — indagacji; на -yj это писали в XIX веке, как bestyj вместо bestii" }
