        ru: "Он избегал расспросов журналистов."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово книжное и слегка ироническое: о назойливых расспросах, а не о официальном допросе. Юридический допрос — przesłuchanie." }
  - { kind: false-friend, text: "Латинское заимствование (indagatio «розыск»), как и русское «индагация», которого в живом языке нет. Опираться на русский здесь не на что." }
  - { kind: government, text: "Женский род: ta indagacja, tej indagacji." }
  - { kind: usage, text: "В корпусе слово не встречается, поэтому все примеры составлены вручную. Глагол — indagować kogoś «допытываться у кого-л.»." }
