# review
id: sklecic
format: 2
lemma: "sklecić"
rank: 6030
pos: verb
aspect: perf
pron: { cyr: "скле́циць" }
senses:
  - id: knock-together
    ru: "сколотить на скорую руку, смастерить кое-как"
    examples:
      - pl: "Chłopcy sklecili w lesie szałas z gałęzi."
        ru: "Мальчики сколотили в лесу шалаш из веток."
        source: { kind: authored }
      - pl: "Dziadek sklecił dla psa małą budę."
        ru: "Дедушка смастерил для собаки маленькую будку."
        source: { kind: authored }
      - pl: "Z kilku desek sklecimy prowizoryczny stół."
        ru: "Из нескольких досок мы сколотим временный стол."
        source: { kind: authored }
  - id: cobble-text
    ru: "кое-как составить, слепить (текст, фразу)"
    examples:
      - pl: "Z trudem skleciłem kilka zdań po polsku."
        ru: "Я с трудом слепил несколько фраз по-польски."
        source: { kind: authored }
      - pl: "Skleciła naprędce wierszyk na urodziny babci."
        ru: "Она наспех сочинила стишок на бабушкин день рождения."
        source: { kind: authored }
      - pl: "Rząd sklecił ustawę w jedną noc."
        ru: "Правительство состряпало закон за одну ночь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SKLECIĆ — не «склеить». Склеить — SKLEIĆ (без C). SKLECIĆ значит «сколотить, смастерить на скорую руку» из того, что было под рукой, или «кое-как составить» текст: SKLECIĆ SZAŁAS, SKLECIĆ KILKA ZDAŃ. В слове всегда есть оттенок: сделано наспех и не слишком хорошо." }
  - { kind: usage, text: "Совершенный вид; несовершенный — KLECIĆ. Спряжение на -I: SKLECĘ, SKLECISZ, SKLECĄ; перед окончанием -Ę, -Ą и в причастии C остаётся: SKLECONY. Повелительное — SKLEĆ. Мужско-личное страдательное SKLECENI в карточку не включено: сколачивают вещи и тексты, а не людей." }
  - { kind: government, text: "Что — винительный падеж: SKLECIĆ BUDĘ. Из чего — Z с родительным: Z DESEK, Z GAŁĘZI. Для кого — DLA с родительным." }
  - { kind: register, text: "Разговорное, слегка ироничное слово. Нейтральные замены — ZBUDOWAĆ, NAPISAĆ; близкие по оттенку — ZMAJSTROWAĆ, SKLEPAĆ." }
collocations:
  - { pl: "sklecić szałas", ru: "сколотить шалаш" }
  - { pl: "sklecić kilka zdań", ru: "слепить несколько фраз" }
  - { pl: "naprędce sklecić", ru: "наспех смастерить" }
  - { pl: "sklecić wierszyk", ru: "сочинить стишок" }
family:
  - { pl: "klecić", ru: "мастерить кое-как (несов.)", relation: aspect }
  - { pl: "kleć", ru: "лачуга, мазанка (устар.)", relation: root }
  - { pl: "sklecenie", ru: "сколачивание, составление наспех", relation: derived }
synonyms:
  - "zmajstrować"
  - "sklepać"
  - "zmontować"
etymology: "Приставка S- плюс KLECIĆ «плести, кое-как строить»; глагол родствен старопольскому KLEĆ «хижина, плетёная лачуга» и русскому «клеть»."
memory: "Sklecić — сколотить из чего попало, как клеть из жердей; склеить — это skleić, без C."
idioms:
  - { pl: "sklecić coś na kolanie", ru: "сляпать что-то на коленке" }
formExamplesSkip:
  - { form: "skleceni", reason: "мужско-личная форма: сколачивают вещи и тексты, а не людей" }
