        ru: "Фермеры борются с вредителями природными методами."
        source: { kind: authored }
  - id: overcome
    ru: "преодолевать, подавлять (страх, желание)"
    examples:
      - pl: "Codziennie zwalczam w sobie lenistwo."
        ru: "Каждый день я преодолеваю в себе лень."
