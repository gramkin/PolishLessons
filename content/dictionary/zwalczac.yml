  - id: fight-each-other
    ru: "враждовать, бороться друг с другом (zwalczać się)"
    examples:
      - pl: "Dwie partie ciągle się zwalczają."
        ru: "Две партии постоянно враждуют друг с другом."
        source: { kind: authored }
notes:
  - { kind: government, text: "ZWALCZAĆ — переходный глагол с ВИНИТЕЛЬНЫМ без предлога: ZWALCZAĆ KORUPCJĘ, ZWALCZAĆ GRYPĘ. По-русски «бороться С коррупцией». С предлогом Z — это уже WALCZYĆ Z KORUPCJĄ; не смешивайте: ZWALCZAĆ Z… — ошибка." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZWALCZYĆ «побороть, искоренить». Спряжение на -AM: ZWALCZAM, ZWALCZASZ, ZWALCZAJĄ. В отличие от WALCZYĆ, ZWALCZAĆ нацелен на уничтожение противника: ZWALCZAĆ CHOROBĘ — «добиваться, чтобы болезни не было»." }
  - { kind: register, text: "Типичен для официальной и научной речи: ZWALCZANIE PRZESTĘPCZOŚCI, ŚRODKI DO ZWALCZANIA SZKODNIKÓW. В быту чаще WALCZYĆ Z…" }
  - { kind: pronunciation, text: "Ł читается как «у»: «зва́учаць». Ударение на предпоследнем слоге: ZWALCZAM — «зва́учам»." }
collocations:
  - { pl: "zwalczać przestępczość", ru: "бороться с преступностью" }
  - { pl: "zwalczać korupcję", ru: "бороться с коррупцией" }
  - { pl: "zwalczać szkodniki", ru: "уничтожать вредителей" }
  - { pl: "zwalczać objawy", ru: "снимать симптомы" }
family:
  - { pl: "zwalczyć", ru: "побороть, искоренить", relation: aspect }
  - { pl: "walczyć", ru: "бороться", relation: root, id: walczyc }
  - { pl: "walka", ru: "борьба", relation: root, id: walka }
  - { pl: "zwalczanie", ru: "борьба (с чем-л.), искоренение", relation: derived }
etymology: "Приставка Z- и WALCZYĆ «бороться, сражаться», от WALKA «борьба». Приставка Z- придаёт значение доведения до конца: бороться, пока противника не останется."
memory: "Zwalczać — «з-бороть»: не просто бороться (walczyć z…), а бороть врага до конца. Zwalczać korupcję — винительный, без «z»."
idioms:
