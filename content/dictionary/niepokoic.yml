    ru: "niepokoić się — беспокоиться, тревожиться"
    examples:
      - pl: "Niepokoję się o dzieci."
        ru: "Я беспокоюсь о детях."
        source: { kind: authored }
      - pl: "Nie ma się czym niepokoić."
        ru: "Беспокоиться не о чем."
        source: { kind: authored }
  - id: worrying
    ru: "niepokojący — тревожный, настораживающий"
    examples:
      - pl: "Przyszły niepokojące wieści."
        ru: "Пришли тревожные вести."
        source: { kind: authored }
      - pl: "To niepokojący objaw."
