        source: { kind: authored }
notes:
  - { kind: false-friend, text: "СЛОВО СОБРАНО КАК РУССКОЕ, ТОЛЬКО С ДРУГОЙ ПРИСТАВКОЙ. Корень тот же: pokój — «покой», niepokój — «беспокойство». Но поляк отрицает через nie-, а русский через «бес-»: niepokój при «беспокойстве», niespokojny при «беспокойном». И помните, что pokój в польском значит ещё и «КОМНАТА», и «мир» (как противоположность войне)." }
  - { kind: government, text: "Беспокоят КОГО — винительный, как по-русски: niepokoić matkę, sąsiadów. А вот беспокоятся О ком — через o с ВИНИТЕЛЬНЫМ: niepokoić się O dzieci, O zdrowie. Русский здесь ставит предложный («о детях»), и это единственное расхождение, но оно встречается постоянно." }
  - { kind: pronunciation, text: "ЧЕРЕДОВАНИЕ ć и j, обычное для глаголов на -oić. Неопределённая форма niepokoić, но niepokoję, niepokoją — перед гласной выходит j. То же в причастиях и существительном: niepokojony, niepokojący, niepokojenie. Так же ведёт себя stać/stoję в своём ряду." }
  - { kind: usage, text: "Вид несовершенный; совершенная пара — zaniepokoić. Причастие niepokojący «тревожный» живёт самостоятельно и встречается постоянно: niepokojące objawy, niepokojąca cisza. Существительное niepokój — «беспокойство, тревога»: bez powodu do niepokoju." }
collocations:
  - { pl: "niepokoić się o kogoś", ru: "беспокоиться о ком-л." }
  - { pl: "niepokojące wieści", ru: "тревожные вести" }
  - { pl: "nie ma powodu do niepokoju", ru: "нет повода для беспокойства" }
family:
  - { pl: "pokój", ru: "покой; комната; мир", relation: root, id: pokoj }
  - { pl: "niepokój", ru: "беспокойство, тревога", relation: root }
  - { pl: "spokój", ru: "спокойствие", relation: derived, id: spokoj }
etymology: "Отрицание nie- плюс pokój «покой» — та же мысль, что в русском «беспокоить», только приставка другая: поляк берёт nie-, русский «бес-». Корень общеславянский, тот же, что в «покое» и «спокойствии». Отсюда niepokój «тревога», niespokojny «беспокойный» и zaniepokoić «встревожить»."
memory: "niepokoić — «беспокоить», от pokój «покой»: поляк отрицает через nie-, русский через «бес-». Падеж помните отдельно: niepokoić się O dzieci — винительный, а не предложный, как в русском «о детях»."
idioms:
  - { pl: "nie ma się czym niepokoić", ru: "беспокоиться не о чем" }
  - { pl: "niepokojące objawy", ru: "тревожные симптомы" }
