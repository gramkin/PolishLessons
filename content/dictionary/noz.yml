  - id: need
    ru: "potrzebuję noża — мне нужен нож"
    examples:
      - pl: "Potrzebuję noża."
        ru: "Мне нужен нож."
        source: { kind: translated, id: 3049827 }
      - pl: "Nie mogę znaleźć noża."
        ru: "Я не могу найти нож."
        source: { kind: translated, id: 529562 }
      - pl: "Ostrze noża jest tępe."
        ru: "Лезвие ножа тупое."
        source: { kind: translated, id: 2238947 }
notes:
  - { kind: usage, text: "Гласная чередуется: в именительном nóż, но в остальных формах o — noża, nożem, noże, noży. Та же пара, что stół — stołu." }
  - { kind: usage, text: "Конечное ż оглушается: nóż звучит как «нуш», а noża — уже со звонким «ж»." }
  - { kind: usage, text: "iść pod nóż — «лечь под нож», то есть на операцию. А być z kimś na noże значит «быть на ножах с кем-то», как и в русском." }
  - { kind: usage, text: "Ostrze noża «лезвие ножа», tępy nóż «тупой нож», ostry nóż «острый нож»." }
collocations:
  - { pl: "ostry nóż", ru: "острый нож" }
  - { pl: "tępy nóż", ru: "тупой нож" }
  - { pl: "pokroić nożem", ru: "нарезать ножом" }
  - { pl: "być na noże", ru: "быть на ножах" }
family:
  - { pl: "nożyczki", ru: "ножницы", relation: derived }
  - { pl: "nożyk", ru: "ножик", relation: derived }
etymology: "Праславянское *nožь — то же слово, что русский «нож». Польское ó здесь отвечает историческому долгому o."
memory: "nóż — «нож», но гласная чередуется: nóż, а дальше noża, nożem, noże. И конечное ż оглушается: слово звучит как «нуш», хотя noża — уже со звонким «ж»."
idioms:
  - { pl: "być z kimś na noże", ru: "быть на ножах с кем-то" }
  - { pl: "iść pod nóż", ru: "лечь под нож" }
  - { pl: "jak nożem uciął", ru: "как отрезало" }
formExamplesSkip:
  - { form: "nożach", reason: "предложный падеж множественного числа встречается в основном в обороте być na noże" }
