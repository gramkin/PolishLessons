  - id: online
    ru: "интернетовый, интернет-, сетевой"
    examples:
      - pl: "Zamówiłem książkę w księgarni internetowej."
        ru: "Я заказал книгу в интернет-магазине."
        source: { kind: authored }
      - pl: "Strona internetowa szkoły nie działa od rana."
        ru: "Сайт школы не работает с утра."
        source: { kind: authored }
