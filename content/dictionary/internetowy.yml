        ru: "Эта сетевая шутка облетела весь мир."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русский чаще всего строит такие слова приставкой «интернет-» через дефис: «интернет-магазин», «интернет-банк». Польский вместо этого берёт прилагательное и ставит его после существительного: SKLEP INTERNETOWY, BANKOWOŚĆ INTERNETOWA. Слово «сайт» по-польски почти всегда STRONA INTERNETOWA, буквально «интернет-страница», или просто STRONA." }
  - { kind: usage, text: "Относительное прилагательное, степеней сравнения нет, все одиннадцать форм живые. Форма для мужчин-людей INTERNETOWI в ходу: INTERNETOWI TWÓRCY, INTERNETOWI ZNAJOMI, INTERNETOWI HEJTERZY — люди, которых знают или встречают только в сети. Само слово INTERNET пишется со строчной буквы, если не начинает фразу." }
  - { kind: government, text: "Название вида ставится после существительного: SKLEP INTERNETOWY, STRONA INTERNETOWA, PORTAL INTERNETOWY. В интернете — W INTERNECIE, местный с чередованием T на C, или W SIECI. Прилагательное тогда не нужно: KUPIŁEM TO W INTERNECIE." }
  - { kind: pronunciation, text: "Читается «интэрнэто́вы», пять слогов, ударение на предпоследнем. Оба E после согласных твёрдые, «тэ» и «нэ», как в INTERNET «интэ́рнэт». Конечная Y — «ы»." }
  - { kind: register, text: "Нейтральное повседневное слово. В разговоре его часто сокращают или заменяют: ONLINE — ZAKUPY ONLINE, «покупки онлайн», а вместо STRONA INTERNETOWA говорят просто STRONA или STRONKA. В официальных текстах держится полная форма." }
collocations:
  - { pl: "strona internetowa", ru: "сайт, интернет-страница" }
  - { pl: "sklep internetowy", ru: "интернет-магазин" }
  - { pl: "portal internetowy", ru: "интернет-портал" }
family:
  - { pl: "internet", ru: "интернет", relation: root, id: internet }
  - { pl: "internauta", ru: "интернет-пользователь", relation: derived }
  - { pl: "sieć", ru: "сеть", relation: root, id: siec }
etymology: "От INTERNET, из английского, где inter- «между» и net «сеть», то есть «межсеть». К заимствованию польский прицепил свой обычный суффикс -OWY, тот же, что в DOMOWY и KOLOROWY, и получилось прилагательное, которого в русском нет: там вместо него приставка «интернет-»."
memory: "Internetowy — интернет-: sklep internetowy — интернет-магазин, strona internetowa — сайт. Польский ставит прилагательное после слова, а не дефис. Читается «интэрнэто́вы»."
idioms:
  - { pl: "hejt internetowy", ru: "травля в интернете" }
