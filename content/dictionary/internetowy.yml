        ru: "Банк запустил новое приложение для интернет-банкинга."
        source: { kind: authored }
  - id: web-based
    ru: "существующий только в сети (о людях, явлениях)"
    examples:
      - pl: "Został internetowym celebrytą w tydzień."
        ru: "Он стал интернет-знаменитостью за неделю."
        source: { kind: authored }
