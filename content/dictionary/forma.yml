# review
id: forma
format: 2
lemma: "forma"
rank: 1484
pos: noun
pron: { cyr: "фо́рма" }
senses:
  - id: shape
    ru: "форма, вид, разновидность"
    examples:
      - pl: "Ciepło to forma energii."
        ru: "Тепло — это форма энергии."
        source: { kind: translated, id: 364059 }
      - pl: "Demokracja jest formą rządów."
        ru: "Демократия — это форма правления."
        source: { kind: tatoeba, id: 363747 }
      - pl: "Sztuka przybiera różne formy."
        ru: "Искусство принимает разные формы."
        source: { kind: translated, id: 12334680 }
  - id: fitness
    ru: "физическая форма, состояние"
    examples:
      - pl: "Jestem nie w formie."
        ru: "Я не в форме."
        source: { kind: tatoeba, id: 12334697 }
      - pl: "Ćwiczę, żeby utrzymać formę."
        ru: "Я тренируюсь, чтобы поддерживать форму."
        source: { kind: translated, id: 4439007 }
  - id: grammatical
    ru: "грамматическая форма слова"
    examples:
      - pl: "Proszę wpisać poprawną formę czasownika."
        ru: "Впишите, пожалуйста, правильную форму глагола."
        source: { kind: translated, id: 2427660 }
      - pl: "Obie formy są tak samo poprawne."
        ru: "Обе формы одинаково правильны."
        source: { kind: translated, id: 13929895 }
notes:
  - { kind: usage, text: "Женский род, как и русское слово. Предложный — w formie." }
  - { kind: usage, text: "w formie значит и «в виде чего-либо», и «в хорошей физической форме»: Jestem w formie «Я в форме», Nie jestem w formie «Я не в форме»." }
  - { kind: false-friend, text: "forma — это не «бланк». Бланк или анкета по-польски formularz. Под влиянием английского form иногда говорят wypełnić formę, но правильно wypełnić formularz." }
  - { kind: usage, text: "Ещё одно бытовое значение — «форма для выпечки»: forma do ciasta." }
collocations:
  - { pl: "w formie", ru: "в форме" }
  - { pl: "forma rządów", ru: "форма правления" }
  - { pl: "forma do ciasta", ru: "форма для выпечки" }
etymology: "Из латинского forma «внешний вид, образ» через европейские языки. В русский «форма» пришла тем же путём, поэтому слова совпадают почти полностью."
memory: "forma — «форма», слово международное, но с двумя ловушками. Первая: w formie значит ещё и «в хорошей физической форме». Вторая: «бланк» — это formularz, а не forma, хотя под влиянием английского так иногда говорят."
idioms:
  - { pl: "w formie", ru: "в форме" }
  - { pl: "pro forma", ru: "для проформы" }
  - { pl: "forma do ciasta", ru: "форма для выпечки" }
