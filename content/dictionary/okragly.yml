notes:
  - { kind: false-friend, text: "Совпадение с русским «круглый» полное, а корень знаком по «окружности»: OKRĄG — «окружность, округ». Польское носовое Ą на месте русского «у»: OKRĄGŁY — «округлый». Переносные значения те же: OKRĄGŁA SUMA, OKRĄGŁA DATA, OKRĄGŁY STÓŁ. А OKRĄGŁY STÓŁ с большой буквы — переговоры 1989 года, положившие конец ПНР." }
  - { kind: usage, text: "Полная парадигма: OKRĄGŁY, OKRĄGLEJSZY, NAJOKRĄGLEJSZY, с Ł, которое чередуется с L в степенях. Мужское-личное: OKRĄGLI, OKRĄGLEJSI, NAJOKRĄGLEJSI — о пухлых людях, в шутку. Обратите внимание: в форме OKRĄGŁY пишется Ą, а не Ę." }
  - { kind: government, text: "Круглый как что-то — OKRĄGŁY JAK PIŁKA, JAK KSIĘŻYC, JAK с именительным. Круглые сутки — CAŁĄ DOBĘ или PRZEZ OKRĄGŁĄ DOBĘ. Круглый год — OKRĄGŁY ROK, CAŁY ROK." }
  - { kind: pronunciation, text: "Читается «окро́нгуы», три слога, ударение на предпоследнем. Ą перед G звучит «он», Ł — «у». В OKRĄGLEJSZY Ł становится L: «окронгле́йшы»." }
  - { kind: register, text: "Нейтральное повседневное слово. OKRĄGŁY STÓŁ в истории Польши — символ мирного перехода к демократии. Об округлой фигуре — мягкий эвфемизм полноты: OKRĄGŁA BUZIA, «круглое личико»." }
