etymology: "От OKRĄG «окружность», общеславянского *okrǫgъ, родственного русскому «округ», «окружность», «круг». Польское Ą на месте русского «у» — постоянное соответствие: KRĄG — «круг», RĘKA — «рука». Русское «круглый» потеряло приставку, польское её сохранило."
memory: "Okrągły — круглый: okrągły stół, okrągła suma, okrągła rocznica. От okrąg — окружность, с ą на месте «у». Okrąglejszy — ł→l. Читается «окро́нгуы»."
idioms:
