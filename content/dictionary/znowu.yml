# review
id: znowu
format: 2
lemma: "znowu"
rank: 318
pos: adv
pron: { cyr: "зно́ву" }
senses:
  - id: again
    ru: "снова, опять"
    examples:
      - pl: "Znowu zniknął."
        ru: "Он снова исчез."
        source: { kind: tatoeba, id: 3739673 }
      - pl: "Tom znowu usiadł."
        ru: "Том снова сел."
        source: { kind: tatoeba, id: 3743821 }
      - pl: "Znowu pada śnieg."
        ru: "Опять идёт снег."
        source: { kind: tatoeba, id: 10748841 }
  - id: again-annoyed
    ru: "опять (с оттенком досады)"
    examples:
      - pl: "Znowu masz rację."
        ru: "Ты опять прав."
        source: { kind: tatoeba, id: 12949415 }
      - pl: "Znowu się spóźniłeś."
        ru: "Ты опять опоздал."
        source: { kind: tatoeba, id: 10596956 }
      - pl: "Telefon znowu zadzwonił."
        ru: "Телефон снова зазвонил."
        source: { kind: tatoeba, id: 4148617 }
  # review
  - id: contrast
    ru: "а, зато, в свою очередь (противопоставление)"
    note: "не «снова»: сопоставляет вторую часть с первой, как zaś и natomiast"
    examples:
      - pl: "Ja lubię kawę, on znowu woli herbatę."
        ru: "Я люблю кофе, а он, наоборот, предпочитает чай."
        source: { kind: authored }
      - pl: "Tam jest drogo, tu znowu za daleko."
        ru: "Там дорого, а здесь, опять же, слишком далеко."
        source: { kind: authored }
      - pl: "Starszy syn jest spokojny, młodszy znowu bardzo żywy."
        ru: "Старший сын спокойный, а младший, наоборот, очень бойкий."
        source: { kind: authored }
      - pl: "Raz mówi jedno, raz znowu coś zupełnie innego."
        ru: "То он говорит одно, то совсем другое."
        source: { kind: authored }
notes:
  - { kind: usage, text: "znowu и znów — одно и то же слово; znów короче и чаще на письме." }
  - { kind: usage, text: "Очень часто несёт оттенок досады, как русское «опять»: Znowu się spóźniłeś! «Ты опять опоздал!»" }
  - { kind: usage, text: "Оборот nie tak znowu значит «не так уж»: Nie jest znowu tak zimno «Не так уж и холодно»." }
  - { kind: usage, text: "Противительное znowu (znów) значит не «снова», а «а, зато, в свою очередь» — как zaś и natomiast. Оно стоит после первого слова той части, которую противопоставляют: Ja lubię kawę, on znowu woli herbatę «Я люблю кофе, а он, наоборот, чай». Так же в книжной речи: Nieraz znowu całe tygodnie poświęcał sprawom ludzi biednych «А нередко, наоборот, он целыми неделями занимался делами бедняков». По-русски ближе всего разговорное «опять же» («тут дорого, там опять же далеко») или просто «а», «зато»." }
collocations:
  - { pl: "znowu to samo", ru: "опять то же самое" }
  - { pl: "znowu się spóźnił", ru: "он опять опоздал" }
  - { pl: "już znowu", ru: "уже снова" }
  - { pl: "nie znowu tak", ru: "не так уж" }
etymology: "Из z + nowu, от nowy «новый» — буквально «с нова»; русское «снова» построено точно так же."
memory: "znowu — «снова, опять», буквально «с нова», как и русское «снова». Короткий вариант — znów, и оба часто звучат с досадой. Но после первого слова второй части — «а, зато»: on znowu woli herbatę."
idioms:
  - { pl: "znowu to samo", ru: "опять то же самое" }
  - { pl: "znowu się zaczyna", ru: "опять начинается" }
  - { pl: "nie znowu tak źle", ru: "не так уж и плохо" }
formExamples:
