etymology: "Происхождение слова спорно, и честнее сказать об этом прямо, чем выбрать одну версию. Общеславянское название червя было *čьrvь, откуда русское «червь» и польское CZERW, и это слово в польском осталось, но отошло к пчеловодству, где CZERW значит пчелиную детву. На место общего названия пришло ROBAK, засвидетельствованное с позднего средневековья, и его обычно связывают с корнем *rob- со значением «копать, долбить, рыть» — тем же, что в польском ROBIĆ в старом смысле «обрабатывать землю». Надёжнее держаться польского материала: ROBIĆ, ROBOTA, и образ червя как существа, которое роет и точит. Этот же образ и делает понятной идиому ZALEWAĆ ROBAKA."
memory: "Русского родственника нет — учить как новое. Русский «червь» этимологически отвечает польскому czerw, но czerw в польском сузился до пчелиной детвы, а обиходный червь — robak. Множественное robaki, без перехода согласной: robacy невозможно, нужен мужско-личный разряд, то есть лицо. Идиома zalewać robaka — «заливать тоску», внутри сидит червь и точит."
idioms:
