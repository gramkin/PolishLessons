notes:
  - { kind: false-friend, text: "Русского однокоренного слова у ROBAK нет, и это главное, что о нём стоит знать: угадать его невозможно, надо учить. Русский «червь» соответствует польскому CZERW — слову, которое в польском сохранилось, но сузилось и значит теперь личинку в пчелином улье, а не червя вообще. Обиходное же название червя в польском — ROBAK, слово иного корня. Поэтому цепочка выходит перекрёстная: русское «червь» есть польский CZERW по происхождению, но польский ROBAK по употреблению, и переводить «червя» надо как ROBAK." }
  - { kind: usage, text: "Слово бытовое и широкое: им называют и земляного червя, и личинку в яблоке, и вообще всякое мелкое ползающее. Уменьшительное ROBACZEK употребляется и ласково о ребёнке. В садовом и рыболовном деле это основной термин: ROBAKI NA RYBY «червяки для рыбалки», ZAROBACZONY «червивый». Идиома ZALEWAĆ ROBAKA значит заливать тоску спиртным, и образ в ней буквальный: внутри сидит червь, который точит, и его пробуют утопить. Русский в этом месте скажет «заливать горе»." }
  - { kind: pronunciation, text: "Читается «ро́бак», ударение на первом слоге из двух. Все гласные открытые, без редукции: второе A звучит полным «а», а не «ъ», как было бы в русском безударном слоге. В местном и звательном падеже ROBAKU ударение остаётся на первом слоге: «ро́баку». Во множественном ROBAKI сочетание KI смягчается: «ро́баки», и буква I здесь работает знаком мягкости, а не отдельной гласной." }
  - { kind: government, text: "Мужской род одушевлённый, но не мужско-личный, поэтому винительный единственного равен родительному — WIDZĘ ROBAKA, — а именительный множественного оканчивается на -I без всякого перехода согласной: ROBAKI. Форма ROBACY для червей невозможна, потому что мужско-личный разряд требует лица. Назначение вводится предлогом NA с винительным: ROBAKI NA RYBY «червяки на рыбу». Отрицание переводит винительный в родительный, и форма совпадает: NIE WIDZĘ ROBAKA." }
collocations:
