# review
id: zaklepac
format: 2
lemma: "zaklepać"
rank: 5775
pos: verb
pron: { cyr: "закле́паць" }
senses:
  - id: rivet
    ru: "заклепать, расплющить ударами (заклёпку, гвоздь)"
    examples:
      - pl: "Blacharz musi zaklepać ten nit."
        ru: "Жестянщик должен заклепать эту заклёпку."
        source: { kind: authored }
      - pl: "Majster zaklepał nity jeden po drugim."
        ru: "Мастер заклепал заклёпки одну за другой."
        source: { kind: authored }
  - id: bag-it
    ru: "разг. застолбить, забить (место, вещь) за собой"
    examples:
      - pl: "Zaklepię sobie miejsce przy oknie."
        ru: "Я застолблю себе место у окна."
        source: { kind: authored }
      - pl: "Zaklepał sobie najlepsze miejsce."
        ru: "Он застолбил себе лучшее место."
        source: { kind: authored }
  - id: settle
    ru: "разг. утрясти, закрепить (договорённость, срок)"
    examples:
      - pl: "Trzeba zaklepać termin jak najszybciej."
        ru: "Надо забить время как можно скорее."
        source: { kind: authored }
      - pl: "Sprawa została zaklepana wczoraj."
        ru: "Дело утрясли вчера."
        source: { kind: authored }
notes:
  - { kind: government, text: "zaklepać coś — ВИНИТЕЛЬНЫЙ падеж: zaklepać nit, miejsce, termin. В разговорном значении дополнением бывает и человек, когда его «забирают» в команду или на проект, поэтому мужсколичное zaklepani работает: zaklepani do drużyny gracze." }
  - { kind: register, text: "Второе и третье значения — живая разговорная речь, особенно школьная и офисная: zaklepuję! значит примерно «чур моё!». В официальном письме так не напишут; нейтральные замены — zarezerwować miejsce, ustalić termin." }
  - { kind: pronunciation, text: "В будущем времени появляется мягкое pi: zaklepię, zaklepiesz, zaklepie, zaklepią — а не «zaklepam». Повелительное наклонение короткое: zaklep, zaklepmy, zaklepcie." }
  - { kind: false-friend, text: "Корень klepać — родственник русского «клепать», и техническое zaklepać отвечает русскому «заклепать». Но дальше языки расходятся: польское klepać значит ещё «похлопывать» и «болтать», а klepać biedę — «бедствовать». Разговорное «застолбить место» по-русски через корень «клепать» не передаётся." }
collocations:
  - { pl: "zaklepać nit", ru: "заклепать заклёпку" }
  - { pl: "zaklepać sobie miejsce", ru: "застолбить себе место" }
  - { pl: "sprawa zaklepana", ru: "дело решённое" }
family:
  - { pl: "zaklepywać", ru: "заклёпывать", relation: aspect }
  - { pl: "klepać", ru: "хлопать; клепать; болтать", relation: root }
  - { pl: "klepnąć", ru: "хлопнуть", relation: derived }
etymology: "Приставка za- и глагол klepać, от праславянского *klepati «ударять, стучать». Русское «клепать» — прямой родственник, и техническое значение совпадает: заклепать заклёпку значит расплющить её ударами. Разговорное «застолбить» выросло из той же картины: прибить к себе, закрепить за собой, чтобы уже не отобрали."
memory: "zaklepać — от klepać «стучать», родственного русскому «клепать». Буквально заклепать заклёпку, а в разговоре — застолбить за собой: zaklepałem sobie miejsce «я забил себе место»."
idioms:
  - { pl: "zaklepać sobie coś", ru: "застолбить себе что-л., забить за собой (разг.)" }
  - { pl: "sprawa zaklepana", ru: "дело решённое, вопрос закрыт (разг.)" }
