# review
id: strzec
format: 2
lemma: "strzec"
rank: 2044
pos: verb
aspect: imperf
pron: { cyr: "стшэц" }
senses:
  - id: guard
    ru: "стеречь, охранять, беречь"
    examples:
      - pl: "Łabędzie zaciekle strzegą swoich piskląt."
        ru: "Лебеди яростно охраняют своих птенцов."
        source: { kind: translated, id: 12470597 }
      - pl: "Strzeżonego pan Bóg strzeże."
        ru: "Бережёного Бог бережёт."
        source: { kind: translated, id: 760349 }
      - pl: "To świetnie strzeżony grobowiec."
        ru: "Это прекрасно охраняемая гробница."
        source: { kind: translated, id: 4799836 }
  - id: beware
    ru: "остерегаться (strzec się)"
    examples:
      - pl: "Strzeż się psa!"
        ru: "Берегись собаки!"
        source: { kind: translated, id: 2164696 }
      - pl: "Strzeż się id marcowych!"
        ru: "Берегись мартовских ид!"
        source: { kind: translated, id: 5890570 }
notes:
  - { kind: government, text: "Главная ловушка — падеж: strzec czegoś требует РОДИТЕЛЬНОГО, тогда как русское «стеречь что» — винительного. strzec tajemnicy «хранить тайну»." }
  - { kind: usage, text: "Возвратное strzec się czegoś значит «остерегаться чего-л.»: strzeż się! «берегись!»" }
  - { kind: false-friend, text: "Корень тот же, что в русском «стеречь», «сторож», «осторожный». Родственно и dostrzec «заметить»." }
  - { kind: usage, text: "Пословица Strzeżonego Pan Bóg strzeże — дословное соответствие русской «Бережёного Бог бережёт»." }
  - { kind: government, text: "Хотя дополнение стоит в родительном падеже, страдательное причастие у глагола совершенно обычно и очень частотно: parking strzeżony «охраняемая парковка», plaża strzeżona, pilnie strzeżona tajemnica." }
collocations:
  - { pl: "strzec tajemnicy", ru: "хранить тайну" }
  - { pl: "strzec się", ru: "остерегаться" }
etymology: "Праславянское *stergti; ср. русское «стеречь», «сторож», «осторожный»."
memory: "strzec — «стеречь», но с РОДИТЕЛЬНЫМ падежом: strzec tajemnicy «хранить тайну». Пословица Strzeżonego Pan Bóg strzeże — это ровно «Бережёного Бог бережёт»."
idioms:
  - { pl: "Strzeżonego Pan Bóg strzeże", ru: "бережёного Бог бережёт" }
  - { pl: "strzec się kogoś", ru: "остерегаться кого-л." }
