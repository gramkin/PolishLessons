    ru: "Никто не стережёт этот вход."
    source: { kind: authored }
  - form: "strzeżoną"
    pl: "Najlepiej strzeżoną tajemnicą jest ta, której nikt nie ujawnia."
    ru: "Лучше всего хранимая тайна — та, которую никто не раскрывает."
    source: { kind: translated, id: 12286185 }
  - form: "strzeżoną"
    pl: "Mamy dobrze strzeżoną granicę."
    ru: "У нас хорошо охраняемая граница."
    source: { kind: authored }
  - form: "strzeżoną"
    pl: "Widzę strzeżoną bramę."
    ru: "Я вижу охраняемые ворота."
    source: { kind: authored }
  - form: "strzeżonego"
    pl: "Strzeżonego pan Bóg strzeże."
    ru: "Бережёного Бог бережёт."
    source: { kind: translated, id: 760349 }
  - form: "strzeżonego"
    pl: "Nie ma tu strzeżonego parkingu."
    ru: "Здесь нет охраняемой парковки."
    source: { kind: authored }
  - form: "strzeżonego"
    pl: "Szukam strzeżonego miejsca."
    ru: "Я ищу охраняемое место."
    source: { kind: authored }
  - form: "strzeżonej"
    pl: "Prawdę mówiąc, chciałabym być księżniczką i żyć w wierzy, strzeżonej przez siedem smoków, i żeby książę na białym koniu odciął smokom głowy, żeby mnie uwolnić."
    ru: "На самом деле, я хотела быть принцессой и жить в башне, охраняемой семью драконами, и чтобы принц на белом коне отрубил драконам головы и освободил меня."
    source: { kind: tatoeba, id: 12586577 }
  - form: "strzeżonej"
    pl: "Mieszka w strzeżonej dzielnicy."
    ru: "Он живёт в охраняемом районе."
    source: { kind: authored }
  - form: "strzeżonej"
    pl: "Byliśmy na strzeżonej plaży."
    ru: "Мы были на охраняемом пляже."
    source: { kind: authored }
  - form: "strzeżony"
