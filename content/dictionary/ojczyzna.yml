notes:
  - { kind: false-friend, text: "Слово собрано от OJCIEC «отец» точно так же, как русская «отчизна». Но регистры разошлись, и это главное. По-русски «отчизна» звучит торжественно, почти поэтически, а обычное слово — «родина». По-польски наоборот: OJCZYZNA и есть нейтральное, ежедневное слово, другого запаса у него нет. Поэтому WRÓCIŁ DO OJCZYZNY переводится «вернулся на родину», и переводить это «в отчизну» значит добавить пафоса, которого в оригинале нет." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа ZN переходит в ŹNI: OJCZYZNA, но W OJCZYŹNIE. Звательный OJCZYZNO живёт прежде всего в поэзии, и самая известная строка польской литературы начинается именно с него: LITWO, OJCZYZNO MOJA. Множественное число употребляют, когда речь о нескольких родинах одного человека или о малых родинах." }
  - { kind: government, text: "Вернуться на родину — WRÓCIĆ DO OJCZYZNY, предлог DO с родительным, тогда как русский говорит «на родину», с винительным. Служить отечеству — SŁUŻYĆ OJCZYŹNIE, дательный без предлога, ровно как по-русски. Защита отечества — OBRONA OJCZYZNY, родительный без предлога. На родине — W OJCZYŹNIE, предлог W с местным падежом, где русский берёт «на»." }
  - { kind: pronunciation, text: "Читается «ойчы́зна», три слога, ударение на втором. Начальное OJ даёт «ой», сочетание CZ даёт «ч», а Y сразу за ним даёт «ы», поэтому середина звучит «чы», а не «чи». В местном падеже OJCZYŹNIE буква Ź даёт мягкое «зь», и слышно «ойчы́зьне». В слове OJCIEC сочетание CIE даёт мягкое «че»: «о́йчец»." }
  - { kind: register, text: "Слово нейтральное и частое, без всякой торжественности: WRÓCIĆ DO OJCZYZNY, TĘSKNIĆ ZA OJCZYZNĄ «тосковать по родине». Оборот MAŁA OJCZYZNA, то есть родная округа, деревня или городок, вошёл в обиход в девяностые годы и сегодня звучит в школьных программах и в краеведении. Торжественный регистр берёт на себя другое слово, OJCZYSTY KRAJ, и поэтические обращения вроде OJCZYZNO MOJA." }
