etymology: "От OJCIEC «отец», от праславянского слова, давшего и русского «отца». Польское OJ- на месте русского ОТ- появилось из-за упрощения: древнее «отьць» дало сперва OCIEC, затем OJCIEC. Русская «отчизна» собрана от того же корня и тем же суффиксом, так что слова тождественны по строению. Разошлись они только в употреблении: русское ушло в высокий стиль, польское осталось обычным."
memory: "Собрано от ojciec «отец», как русская «отчизна», и слова эти тождественны по строению. Но регистр перевёрнут: по-русски «отчизна» торжественна, а обычное слово «родина»; по-польски же ojczyzna и есть обычное слово. Переводить его надо «родиной». Управление расходится: wrócić do ojczyzny, родительный, где русский говорит «на родину». В местном падеже w ojczyźnie. Читается «ойчы́зна»."
