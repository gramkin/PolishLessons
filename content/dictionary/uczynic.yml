formExamples:
  - form: "uczyni"
    pl: "Niech Wszechmogący Bóg uczyni cię bardzo szczęśliwym."
    ru: "Пусть Всемогущий Бог сделает тебя очень счастливым."
    source: { kind: translated, id: 7962579 }
  - form: "uczyni"
    pl: "Nic go nie uczyni szczęśliwym."
    ru: "Ничто не сделает его счастливым."
    source: { kind: authored }
  - form: "uczyni"
    pl: "To uczyni nasze życie łatwiejszym."
    ru: "Это сделает нашу жизнь легче."
    source: { kind: authored }
  - form: "uczynić"
    pl: "Chcę uczynić cię szczęśliwą."
    ru: "Я хочу сделать тебя счастливой."
    source: { kind: translated, id: 3499931 }
  - form: "uczynić"
    pl: "On wie, jak uczynić swoją żonę szczęśliwą."
    ru: "Он знает, как сделать свою жену счастливой."
    source: { kind: translated, id: 13429238 }
  - form: "uczynić"
    pl: "By uczynić życie szczęśliwym, musisz kochać codzienne błahostki."
    ru: "Чтобы сделать жизнь счастливой, нужно любить повседневные мелочи."
    source: { kind: translated, id: 3430629 }
  - form: "uczynieniu"
    pl: "Po uczynieniu tego kroku nie było już odwrotu."
    ru: "После совершения этого шага пути назад уже не было."
    source: { kind: translated, id: 1350332 }
  - form: "uczynieniu"
    pl: "Mówimy o uczynieniu tego kroku."
    ru: "Мы говорим о совершении этого шага."
    source: { kind: authored }
  - form: "uczynieniu"
    pl: "Po uczynieniu obietnicy trzeba jej dotrzymać."
    ru: "Дав обещание, нужно его сдержать."
