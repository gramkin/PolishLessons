# review
id: uczynic
format: 2
lemma: "uczynić"
rank: 1662
pos: verb
aspect: perf
pron: { cyr: "учы́ниць" }
senses:
  - id: make-happy
    ru: "сделать (кого-л. каким-л.)"
    examples:
      - pl: "Chcę uczynić cię szczęśliwą."
        ru: "Я хочу сделать тебя счастливой."
        source: { kind: translated, id: 3499931 }
      - pl: "On wie, jak uczynić swoją żonę szczęśliwą."
        ru: "Он знает, как сделать свою жену счастливой."
        source: { kind: translated, id: 13429238 }
      - pl: "Uczyniłaś mnie najszczęśliwszym mężczyzną na świecie."
        ru: "Ты сделала меня счастливейшим мужчиной на свете."
        source: { kind: tatoeba, id: 10160025 }
  - id: make-do
    ru: "сделать, совершить (книжное)"
    examples:
      - pl: "Uczynił to z uprzejmości."
        ru: "Он сделал это из вежливости."
        source: { kind: translated, id: 600959 }
      - pl: "Ojciec uczynił ze mnie tego kim jestem."
        ru: "Отец сделал меня тем, кто я есть."
        source: { kind: translated, id: 600408 }
      - pl: "Ani pieniądze, ani sława nie uczyniły go szczęśliwym."
        ru: "Ни деньги, ни слава не сделали его счастливым."
        source: { kind: tatoeba, id: 12016329 }
notes:
  - { kind: register, text: "Слово книжное и торжественное. В обычной речи скажут zrobić: zrobić kogoś szczęśliwym звучит нейтрально, uczynić — возвышенно." }
  - { kind: government, text: "Конструкция двойная: uczynić kogoś kimś — винительный плюс творительный: uczynił mnie szczęśliwym «он сделал меня счастливым»." }
  - { kind: usage, text: "Почти все примеры в корпусе — одна рамка uczynić kogoś szczęśliwym «сделать кого-то счастливым»; вне её слово встречается редко." }
  - { kind: usage, text: "Несовершенный вид — czynić. Русское «учинить» — то же слово, но в русском оно приобрело оттенок «устроить что-то дурное»." }
collocations:
  - { pl: "uczynić szczęśliwym", ru: "сделать счастливым" }
  - { pl: "uczynić coś", ru: "совершить что-то" }
  - { pl: "uczynić zadość", ru: "удовлетворить" }
etymology: "Приставка u- + czynić «делать», праславянское *činiti. Русское «учинить» — то же слово, но в русском оно сузилось до «устроить что-то дурное», а в польском осталось нейтрально-книжным «сделать»."
memory: "uczynić = «сделать», но книжно: в обычной речи говорят zrobić. Конструкция двойная — uczynić kogoś szczęśliwym «сделать кого-то счастливым», винительный плюс творительный. Русское «учинить» — то же слово с испортившимся значением."
idioms:
  - { pl: "uczynić szczęśliwym", ru: "сделать счастливым" }
  - { pl: "uczynić zadość", ru: "удовлетворить" }
  - { pl: "uczynić krok", ru: "сделать шаг" }
