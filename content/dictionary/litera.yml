notes:
  - { kind: false-friend, text: "Опасность тут двойная. Во-первых, LITERA значит «буква», а письмо, которое отправляют по почте, — LIST, и это слово в польском тоже есть, но значит совсем другое, чем русский «лист». Во-вторых, русская «литера» существует, но значит либо типографскую литеру, либо условное обозначение, и в обиходной речи почти не встречается. Поэтому фраза NAPISZ TO WIELKĄ LITERĄ значит «напиши это с большой буквы», а не что-либо о литерах. Запоминать стоит тройкой: LITERA буква, LIST письмо, LIŚĆ лист на дереве." }
  - { kind: pronunciation, text: "Читается «лите́ра», ударение на предпоследнем слоге, как и в русском слове. Буква L мягкая, как всегда в польском, поэтому первый слог звучит «ли». Главное в карточке — дательный и местный падеж LITERZE: там R переходит в RZ и звучит «ж», то есть «лите́же». Это то же чередование, что в RURA и RURZE, SIOSTRA и SIOSTRZE, GÓRA и GÓRZE, и для русского оно остаётся самым неожиданным из всех, потому что русский в этих словах ничего не меняет." }
  - { kind: usage, text: "Устойчивые сочетания стоит выучить блоком: WIELKA LITERA «большая буква», MAŁA LITERA «строчная», DUŻĄ LITERĄ «с большой буквы», LITERA PRAWA «буква закона», CO DO LITERY «буквально, до буквы». Прилагательное LITEROWY значит «буквенный», а наречие DOSŁOWNIE «буквально» образовано от другого корня, от SŁOWO, и это стоит заметить: по-польски буквальность выражают через слово, а не через букву, в отличие от русского «буквально»." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: NAPISAŁ LITERĘ. Чем написано — творительный без предлога: WIELKĄ LITERĄ «большой буквой, с большой буквы», и это конструкция, которую русский передаёт предлогом «с»: разницу надо запомнить. Родительный множественного LITER без окончания: BRAKOWAŁO DWÓCH LITER. При отрицании винительный уходит в родительный: NIE NAPISAŁ LITERY. Выражение CO DO LITERY требует родительного после DO." }
