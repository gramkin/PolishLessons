etymology: "Из латинского LITTERA «буква», а во множественном LITTERAE — «письмо, словесность, литература». Русская «литера» пришла оттуда же, но осталась специальным словом типографов, тогда как для обиходного понятия русский взял своё слово «буква», от имени готской рунической буквы и, по одной из версий, от названия бука как дерева, на котором резали знаки. Поэтому польское слово латинское, а русское германское по происхождению, и совпадения ждать не нужно. Зато от того же LITTERA идут LITERATURA и LITERAT, знакомые русскому, и через них слово легко запомнить: там, где русский видит литературу, поляк видит букву."
memory: "Буква, а не «литера» и не письмо: письмо — list, лист на дереве — liść. С большой буквы — wielką literą, творительный без предлога, где русский берёт «с». В дательном и местном r переходит в rz: literze «лите́же», как rura и rurze. От латинского littera, откуда и literatura, тогда как русская «буква» германская."
