family:
  - { pl: "postawic", ru: "поставить", relation: root, id: postawic }
  - { pl: "stac", ru: "стоять", relation: root, id: stac }
  - { pl: "postawny", ru: "статный, видный", relation: derived }
etymology: "От POSTAWIĆ «поставить», от общеславянского корня STAW-, того же, что в русских «ставить», «поставить», «става». Образ прямой: постава это то, как человек поставлен, как он себя держит. Из этого телесного смысла вырос переносный, о взглядах, и польский сохранил оба в одном слове. Русский пошёл врозь: для спины взял «осанку» от «осанить», для взглядов латинскую «позицию», а само слово «постава» осталось только в говорах и в ремесленном языке."
memory: "Одно слово там, где русскому нужны два: postawa это и осанка, и позиция, отношение. Образ общий и прозрачен от postawić «поставить»: то, как человек себя ставит. Главная конструкция строится не так, как русская: postawa wobec pracy, предлог wobec с родительным, а русский говорит «отношение к работе», с дательным. Читается «поста́ва», а родительный множественного postaw звучит «по́стаф», с оглушением конечного w."
idioms:
  - { pl: "postawa zasadnicza", ru: "стойка смирно" }
