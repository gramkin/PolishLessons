notes:
  - { kind: false-friend, text: "Одно польское слово покрывает то, для чего русскому нужны два разных. POSTAWA это и осанка, положение тела, и позиция, отношение к чему-либо. Русский здесь выбирает: «осанка» про спину, «позиция» или «отношение» про взгляды. Поляк же видит в обоих одно: то, как человек себя ставит. Поэтому WYPROSTOWANA POSTAWA это «прямая осанка», а POSTAWA WOBEC PRACY это «отношение к работе», и слово в обоих случаях одно и то же." }
  - { kind: usage, text: "Десять форм, женский род, склонение как у KOBIETA. В дательном и местном падеже единственного числа W переходит в WI: POSTAWA, но W POSTAWIE. Множественное POSTAWY работает прежде всего во втором значении, о взглядах: BADANIE POSTAW SPOŁECZNYCH «исследование общественных установок». Родительный множественного POSTAW, без окончания." }
  - { kind: government, text: "Отношение к чему-либо — предлог WOBEC с родительным: POSTAWA WOBEC PRACY. Это ключевая конструкция, и русский строит её иначе, через дательный: «отношение к работе». Принять позу или позицию — PRZYJĄĆ POSTAWĘ, винительный без предлога. В такой-то позе — предлог W с местным падежом: W POSTAWIE STOJĄCEJ «в положении стоя»." }
  - { kind: pronunciation, text: "Читается «поста́ва», три слога, ударение на втором. Все звуки простые, ловушек нет, и слово звучит почти по-русски. В форме POSTAWIE сочетание WIE даёт мягкое «ве», и слышно «поста́ве». В родительном множественного POSTAW конечное W оглушается до «ф», поэтому произносится «по́стаф», а не «постав»: это общее польское правило для конечных звонких согласных." }
  - { kind: register, text: "Слово нейтральное, но в разных значениях живёт в разных кругах. Об осанке говорят врачи и учителя физкультуры: WADA POSTAWY «нарушение осанки». О позиции говорят в газетах и на работе: POSTAWA ŻYCIOWA «жизненная позиция», POSTAWA OBYWATELSKA «гражданская позиция». Военное POSTAWA ZASADNICZA это «стойка смирно», команда из устава, и в обычном разговоре её употребляют в шутку." }
collocations:
  - { pl: "wyprostowana postawa", ru: "прямая осанка" }
  - { pl: "postawa życiowa", ru: "жизненная позиция" }
