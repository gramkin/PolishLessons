notes:
  - { kind: false-friend, text: "RĄCZKA — уменьшительное от RĘKA, детская или ласковая «ручка». Но это и ручка предмета: RĄCZKA OD GARNKA, RĄCZKA WALIZKI. Ручка двери — не RĄCZKA, а KLAMKA, а ручка для письма — DŁUGOPIS. ZŁOTA RĄCZKA, «золотая ручка», — мастер на все руки, тот, кого зовут починить кран." }
  - { kind: usage, text: "Десять форм в таблице, женский род. В корне Ę меняется на Ą: RĘKA, но RĄCZKA. В дательном и местном падежах K переходит в C: RĄCZCE. В родительном множественного беглое E: RĄCZEK. Звательная форма RĄCZKO на практике не нужна." }
  - { kind: government, text: "Водить за ручку — PROWADZIĆ ZA RĄCZKĘ, ZA с винительным. Ручка от чего-то — RĄCZKA OD CZEGOŚ, OD с родительным. Из рук в руки — Z RĄCZKI DO RĄCZKI, шутливо." }
  - { kind: pronunciation, text: "Читается «ро́нчка», два слога, ударение на первом. Ą перед CZ звучит как «он», так же как Ę в RĘCZNIK «рэ́нчник». В форме RĄCZCE: «ро́нчце»." }
  - { kind: register, text: "CAŁUJĘ RĄCZKI, «целую ручки», — старомодно-галантное мужское приветствие даме, сегодня скорее шутливое. WYDAĆ LEKKĄ RĄCZKĄ — потратить, не задумываясь, «лёгкой рукой». В разговоре с детьми RĄCZKI звучит естественно: UMYJ RĄCZKI." }
