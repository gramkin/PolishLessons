etymology: "От RĘKA «рука» с уменьшительным суффиксом -KA. Польские Ę и Ą на месте русского «у» — одно соответствие: RĘKA и «рука», RĄCZKA и «ручка». Внутри польского они чередуются по слогу: в открытом слоге Ę, RĘ-KA, в закрытом Ą, RĄCZ-KA."
memory: "Rączka — ручка: детская и у предмета, rączka od garnka. Читается «ро́нчка». Ę в ręka становится ą в rączka. Złota rączka — мастер на все руки. Ручка двери — klamka. Wydać lekką rączką — потратить не задумываясь."
idioms:
  - { pl: "złota rączka", ru: "мастер на все руки" }
  - { pl: "wydać lekką rączką", ru: "потратить не задумываясь" }
  - { pl: "całuję rączki", ru: "целую ручки (старинное приветствие)" }
formExamplesSkip:
