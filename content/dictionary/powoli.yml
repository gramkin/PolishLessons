notes:
  - { kind: usage, text: "Powoli — «медленно». Как отдельная реплика Powoli! значит «Потише!», «Не спеши!»." }
  - { kind: usage, text: "Синоним — wolno «медленно», но powoli чаще о постепенности: powoli się przyzwyczaiłem «я постепенно привык»." }
  - { kind: usage, text: "Śpiesz się powoli — «торопись медленно», польская версия латинского festina lente." }
  - { kind: pronunciation, text: "Ударение на предпоследний слог: пово́ли. Все o читаются как «о»." }
collocations:
  - { pl: "jedź powoli", ru: "езжай медленно" }
  - { pl: "powoli i spokojnie", ru: "медленно и спокойно" }
  - { pl: "śpiesz się powoli", ru: "торопись медленно" }
etymology: "Из po и wola «воля»: буквально «по воле, не спеша». Русское «поневоле» собрано из тех же частей, но пошло в другую сторону."
memory: "powoli — «медленно». Отдельной репликой Powoli! значит «Потише!». Синоним wolno, но powoli чаще подчёркивает постепенность. И запомните Śpiesz się powoli «торопись медленно»."
