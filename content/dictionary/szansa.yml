# review
id: szansa
format: 2
lemma: "szansa"
rank: 317
pos: noun
pron: { cyr: "ша́нса" }
senses:
  - id: chance
    ru: "шанс, возможность"
    examples:
      - pl: "Daj mi szansę."
        ru: "Дай мне шанс!"
        source: { kind: tatoeba, id: 3377680 }
      - pl: "Myślisz, że mamy szansę?"
        ru: "Думаешь, у нас есть шанс?"
        source: { kind: tatoeba, id: 6327945 }
      - pl: "Dostaniemy kolejną szansę."
        ru: "Мы получим еще один шанс."
        source: { kind: tatoeba, id: 3313321 }
  - id: no-chance
    ru: "шанс (в отрицании): nie ma szans — нет шансов"
    examples:
      - pl: "Nie miały szans."
        ru: "У них не было шансов."
        source: { kind: tatoeba, id: 6406062 }
      - pl: "Nie ma szans że wyzdrowieje."
        ru: "Шансов, что он поправится, нет."
        source: { kind: tatoeba, id: 2138888 }
      - pl: "Nie miała najmniejszych szans."
        ru: "У неё не было ни малейшего шанса."
        source: { kind: tatoeba, id: 6406061 }
notes:
  - { kind: usage, text: "dać komuś szansę — «дать кому-то шанс», mieć szansę — «иметь шанс», wykorzystać szansę — «использовать шанс»." }
  - { kind: usage, text: "Отрицание почти всегда во множественном: nie ma szans «нет шансов», bez szans «без шансов»." }
  - { kind: usage, text: "ostatnia szansa — «последний шанс»; szansa na coś — «шанс на что-то»." }
collocations:
  - { pl: "dać szansę", ru: "дать шанс" }
  - { pl: "nie ma szans", ru: "нет шансов" }
  - { pl: "ostatnia szansa", ru: "последний шанс" }
  - { pl: "mieć szansę", ru: "иметь шанс" }
etymology: "Из французского chance «удача, случай»; в русский «шанс» пришёл тем же путём."
memory: "szansa — «шанс», из французского chance. Запомните dać komuś szansę «дать кому-то шанс» и nie ma szans «нет шансов»."
idioms:
  - { pl: "ostatnia szansa", ru: "последний шанс" }
  - { pl: "dać szansę", ru: "дать шанс" }
  - { pl: "nie ma szans", ru: "нет шансов" }
formExamplesSkip:
