# review
id: pohanbic
format: 2
lemma: "pohańbić"
rank: 5791
pos: verb
aspect: perf
pron: { cyr: "поха́ньбиць" }
senses:
  - id: disgrace
    ru: "опозорить, покрыть позором (имя, семью, мундир)"
    examples:
      - pl: "Pohańbił swoje nazwisko zdradą."
        ru: "Он опозорил своё имя предательством."
        source: { kind: authored }
      - pl: "Ten skandal pohańbi całą rodzinę."
        ru: "Этот скандал опозорит всю семью."
        source: { kind: authored }
      - pl: "Przysięgam, że nie pohańbię tego munduru."
        ru: "Клянусь, что не опозорю этот мундир."
        source: { kind: authored }
  - id: desecrate
    ru: "осквернить (святыню, могилу, памятник)"
    examples:
      - pl: "Wandale pohańbili stary cmentarz."
        ru: "Вандалы осквернили старое кладбище."
        source: { kind: authored }
      - pl: "Groby zostały pohańbione przez wandali."
        ru: "Могилы были осквернены вандалами."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово высокое, книжное: о чести, знамени, памяти предков, святынях. В быту говорят OŚMIESZYĆ «выставить на посмешище» или ZROBIĆ WSTYD «опозорить». В старой литературе POHAŃBIĆ KOBIETĘ — «обесчестить»." }
  - { kind: usage, text: "Совершенный вид; несовершенный — HAŃBIĆ, есть и синоним ZHAŃBIĆ. Будущее: POHAŃBIĘ, POHAŃBISZ, POHAŃBIĄ. У повелительного две формы: POHAŃB и POHAŃBIJ; почти всегда с отрицанием — NIE POHAŃB NASZEGO NAZWISKA «не опозорь нашу фамилию»." }
  - { kind: government, text: "Кого или что — винительный: POHAŃBIĆ RODZINĘ, SZTANDAR. Чем — творительный: POHAŃBIĆ IMIĘ ZDRADĄ. В пассиве — PRZEZ: POHAŃBIONY PRZEZ WROGA." }
  - { kind: pronunciation, text: "Читается «поха́ньбиць»: Ń — мягкое «нь», ударение на предпоследнем слоге. Повелительное POHAŃB — «по́ханьп», конечное B оглушается." }
collocations:
  - { pl: "pohańbić imię", ru: "опозорить имя" }
  - { pl: "pohańbić sztandar", ru: "опозорить знамя" }
  - { pl: "pohańbić grób", ru: "осквернить могилу" }
family:
  - { pl: "hańba", ru: "позор, бесчестье", relation: root, id: hanba }
  - { pl: "hańbić", ru: "позорить", relation: aspect }
  - { pl: "zhańbić", ru: "опозорить", relation: root }
  - { pl: "pohańbienie", ru: "позор, осквернение", relation: derived }
etymology: "Приставка PO- плюс HAŃBIĆ «позорить», от HAŃBA «позор, бесчестье»; ср. чешское hanba «стыд, позор»."
memory: "Pohańbić — покрыть hańbą «позором»: pohańbił swoje nazwisko. Hańba — позор, pohańbić — опозорить."
