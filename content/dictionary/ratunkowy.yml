notes:
  - { kind: false-friend, text: "Корень слова — RATOWAĆ «спасать», и вот это настоящая ловушка. Русское «ратовать» выглядит точно так же, но значит «выступать за что-то» и происходит от «рати», от войска. Польское RATOWAĆ никакого отношения к войне не имеет: оно взято из немецкого RETTEN «спасать». Поэтому RATUNKOWY это всегда «спасательный», а не «ратующий», и RATOWNIK это спасатель, а не воин." }
  - { kind: usage, text: "В таблице одиннадцать форм, но живых десять. Одиннадцатая — RATUNKOWI, именительный множественного для мужчин-людей, и у этого прилагательного её не употребляют: слово относительное, оно обозначает назначение предмета, а не свойство человека. Спасателей называют RATOWNICY, существительным, а не RATUNKOWI. Поэтому примеров к этой форме в карточке нет. Суффикс -OWY отвечает русскому «-ный» в словах такого же устройства." }
  - { kind: government, text: "Запомните порядок слов: в устойчивых названиях прилагательное стоит после существительного — KAMIZELKA RATUNKOWA, KOŁO RATUNKOWE, ŁÓDŹ RATUNKOWA, ODDZIAŁ RATUNKOWY. Переставить нельзя, это уже закреплённые сочетания. В отделение неотложной помощи — NA ODDZIAŁ RATUNKOWY, предлог NA с винительным, где русский скажет «в отделение». В спасательной операции — W AKCJI RATUNKOWEJ, местный падеж." }
  - { kind: pronunciation, text: "Читается «ратунко́вы», четыре слога, ударение на предпоследнем. Конечная Y даёт «ы», поэтому слово кончается на «вы», а не на «вый». В женском роде RATUNKOWA это «ратунко́ва», в среднем RATUNKOWE — «ратунко́вэ», с «э» на конце. В форме RATUNKOWĄ носовой на конце звучит «он»: «ратунко́вон»." }
  - { kind: register, text: "Слово официальное и техническое, из языка служб и инструкций. В больнице это ODDZIAŁ RATUNKOWY, по-польски сокращённо SOR, и каждый поляк знает это сокращение. На воде это KAMIZELKA RATUNKOWA и ŁÓDŹ RATUNKOWA. В переносном смысле живёт только KOŁO RATUNKOWE: RZUCIĆ KOMUŚ KOŁO RATUNKOWE значит выручить человека в трудную минуту, совсем как русское «бросить спасательный круг»." }
