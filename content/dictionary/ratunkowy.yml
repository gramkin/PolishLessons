etymology: "От существительного RATUNEK «спасение», а то — от глагола RATOWAĆ, взятого из средневерхненемецкого RETTEN «спасать». Суффикс -UNEK, которым собрано RATUNEK, тоже немецкий по происхождению, из -UNG, и он дал целый ряд польских слов: RACHUNEK «счёт», PODARUNEK «подарок», MELDUNEK «донесение». Узнав -UNEK, вы узнаёте сразу десяток слов."
memory: "Спасательный, от ratunek «спасение» и ratowac «спасать». Главная ловушка: русское «ратовать» выглядит так же, но идёт от «рати», от войска, а польское ratowac взято из немецкого retten. Запоминайте через сочетания с прилагательным после существительного: kamizelka ratunkowa, kolo ratunkowe, oddzial ratunkowy. Суффикс -unek из немецкого -ung выдаёт родню: rachunek, podarunek, meldunek."
idioms:
  - { pl: "koło ratunkowe", ru: "спасательный круг" }
formExamplesSkip:
