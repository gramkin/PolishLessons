# review
id: wrecz
format: 2
lemma: "wręcz"
rank: 2238
pos: adv
pron: { cyr: "врэнч" }
senses:
  - id: outright
    ru: "прямо-таки, попросту"
    examples:
      - pl: "Nazwał cię wręcz hipokrytą."
        ru: "Он прямо-таки назвал тебя лицемером."
        source: { kind: translated, id: 551590 }
      - pl: "To było wręcz niewiarygodne."
        ru: "Это было прямо-таки невероятно."
        source: { kind: translated, id: 6156263 }
      - pl: "To wręcz genialne."
        ru: "Это прямо-таки гениально."
        source: { kind: authored }
  - id: on-contrary
    ru: "наоборот (в обороте wręcz przeciwnie)"
    examples:
      - pl: "Wszystko wskazuje wręcz przeciwnie."
        ru: "Всё указывает как раз на обратное."
        source: { kind: translated, id: 3610586 }
      - pl: "Nie jestem zmęczony, wręcz przeciwnie."
        ru: "Я не устал, как раз наоборот."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Усилитель перед прилагательным или наречием: wręcz niewiarygodne «прямо-таки невероятно»." }
  - { kind: usage, text: "wręcz przeciwnie «как раз наоборот» — отдельный устойчивый оборот, очень частый в споре." }
  - { kind: false-friend, text: "Буквально «в руку»: w + ręka. Отсюда и walka wręcz «рукопашный бой», где исходный смысл виден прямо." }
  - { kind: government, text: "Не изменяется." }
collocations:
  - { pl: "wręcz przeciwnie", ru: "как раз наоборот" }
  - { pl: "walka wręcz", ru: "рукопашный бой" }
etymology: "w + ręka «рука»: буквально «в руку», откуда walka wręcz «рукопашный бой»."
memory: "wręcz — усилительное «прямо-таки», и отдельно оборот wręcz przeciwnie «как раз наоборот». Буквально «в руку», как в walka wręcz."
