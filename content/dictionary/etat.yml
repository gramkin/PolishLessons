# review
id: etat
format: 2
lemma: "etat"
rank: 5054
pos: noun
pron: { cyr: "э́тат" }
senses:
  - id: post
    ru: "штатная должность, ставка"
    examples:
      - pl: "Pracuje na pełen etat."
        ru: "Он работает на полную ставку."
        source: { kind: authored }
      - pl: "Dostała etat w szkole."
        ru: "Она получила штатную должность в школе."
        source: { kind: authored }
      - pl: "Szukam pracy na pół etatu."
        ru: "Я ищу работу на полставки."
        source: { kind: authored }
  - id: staff-slot
    ru: "штатная единица, вакансия"
    examples:
      - pl: "W firmie zlikwidowano trzy etaty."
        ru: "В фирме сократили три ставки."
        source: { kind: authored }
      - pl: "Na ten etat zgłosiło się pięćdziesiąt osób."
        ru: "На эту вакансию откликнулись пятьдесят человек."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ETAT — не «этаж» (тот — PIĘTRO) и не весь «штат» сотрудников. ETAT — одна штатная единица, «ставка»: PRACOWAĆ NA PEŁEN ETAT — работать на полную ставку, NA PÓŁ ETATU — на полставки. Отсюда ETATOWY — «штатный»: ETATOWY PRACOWNIK, а «внештатный» — POZAETATOWY." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже T переходит в CI: NA ETACIE. Множественное ETATY — «ставки, штатные единицы»: ZLIKWIDOWAĆ ETATY — сократить ставки." }
  - { kind: government, text: "Работать на ставке — PRACOWAĆ NA ETACIE, местный. На полставки — NA PÓŁ ETATU, родительный после PÓŁ. Получить должность — DOSTAĆ ETAT, винительный." }
  - { kind: pronunciation, text: "Читается «э́тат», два слога, ударение на первом. Начальное E звучит как «э». В форме ETACIE: «эта́це»." }
  - { kind: register, text: "Слово деловое и обиходное: MIEĆ ETAT — «иметь постоянную работу по найму», в отличие от работы по договору подряда. О стабильной работе в госсекторе говорят ETAT W BUDŻETÓWCE." }
collocations:
  - { pl: "stały etat", ru: "постоянная ставка" }
  - { pl: "etat nauczyciela", ru: "должность учителя" }
  - { pl: "zwolnić etat", ru: "освободить ставку" }
family:
  - { pl: "etatowy", ru: "штатный", relation: derived }
  - { pl: "pozaetatowy", ru: "внештатный", relation: derived }
  - { pl: "nadetatowy", ru: "сверхштатный", relation: derived }
etymology: "Из французского ÉTAT «состояние; ведомость, штат». Русский взял тот же латинский корень через немецкий как «штат», а польский — прямо из французского, отсюда ETAT."
memory: "Etat — ставка, штатная должность. Читается «э́тат». Na pełen etat — на полную ставку, na pół etatu — на полставки. Etatowy — штатный. Этаж — piętro."
idioms:
  - { pl: "na pełen etat", ru: "на полную ставку" }
  - { pl: "na pół etatu", ru: "на полставки" }
