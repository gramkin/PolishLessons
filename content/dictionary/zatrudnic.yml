notes:
  - { kind: false-friend, text: "САМАЯ опасная пара в этом разделе. Польское zatrudnić значит «НАНЯТЬ, взять на работу». Оно НЕ значит «затруднить», хотя выглядит именно так. «Затруднить» по-польски — utrudnić, и у него своя отдельная карточка. Так что zatrudnił mnie — это «он меня нанял», а вовсе не «он меня затруднил»." }
  - { kind: usage, text: "Корень общий с русским «труд»: za- + trud. Логика польского слова — «приставить к труду», отсюда «нанять». Отглагольное существительное zatrudnienie значит и «трудоустройство», и «занятость» как показатель экономики." }
  - { kind: government, text: "Нанимают КОГО — винительный: zatrudnić kogoś. Куда и на что — предлогами: zatrudnić NA stanowisku (предложный), W firmie, NA pół etatu, JAKO tłumacza. Выражение zatrudnić na czarno значит «нанять нелегально, без оформления»." }
  - { kind: pronunciation, text: "Страдательное причастие даёт -ony в большинстве форм, но в мужско-личном множественном о переходит в e: zatrudniony — zatrudnieni, podzielony — podzieleni. Это общее правило для таких причастий, и именно эта форма обычно застаёт врасплох." }
collocations:
  - { pl: "zatrudnić na czarno", ru: "нанять нелегально" }
  - { pl: "pełne zatrudnienie", ru: "полная занятость" }
  - { pl: "zatrudniony na pół etatu", ru: "работающий на полставки" }
family:
  - { pl: "trud", ru: "труд, усилие", relation: root, id: trud }
  - { pl: "utrudnić", ru: "затруднить", relation: derived, id: utrudnic }
  - { pl: "zatrudniać", ru: "нанимать", relation: aspect }
etymology: "Приставка za- плюс trudnić, от trud «труд», праславянское *trudъ — то же слово, что русский «труд». Польский построил на нём «приставить к труду», то есть «нанять», а русский от того же корня сделал «затруднить», то есть «создать трудность». Один корень, два расошедшихся смысла — отсюда и ловушка."
memory: "zatrudnić — «НАНЯТЬ», а не «затруднить». Корень тот же, что русский «труд», но польский пошёл от «приставить к труду». «Затруднить» — это utrudnić. И помните форму zatrudnieni (о людях), где -ony переходит в -eni."
idioms:
