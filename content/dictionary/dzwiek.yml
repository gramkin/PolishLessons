notes:
  - { kind: false-friend, text: "Различайте dźwięk «звук (физический)», głos «голос» и hałas «шум». Русское «звук» шире и покрывает часть того, что поляк назовёт głos." }
  - { kind: usage, text: "Мужской неодушевлённый: dźwięk, dźwięku, dźwiękiem." }
  - { kind: usage, text: "Устойчивые термины: prędkość dźwięku «скорость звука», bariera dźwięku «звуковой барьер»." }
  - { kind: pronunciation, text: "Начальное dź — мягкое «дзь», а ę перед k звучит как «эн»: дзьвенк." }
collocations:
