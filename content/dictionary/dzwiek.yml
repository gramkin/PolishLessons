  - { pl: "dziwne dźwięki", ru: "странные звуки" }
  - { pl: "bez dźwięku", ru: "беззвучно" }
etymology: "Праславянское *zvękъ — то же слово, что русский «звук», с польским переходом zv- в dźw-. Та же пара видна в dzwon и «звон»."
memory: "dźwięk — «звук», и родство видно через пару dzwon и «звон»: праславянское zv- дало польское dźw-. Различайте dźwięk «звук», głos «голос» и hałas «шум»."
