# review
id: nawiazac
format: 2
lemma: "nawiązać"
rank: 4141
pos: verb
pron: { cyr: "навё́нзаць" }
senses:
  - id: establish
    ru: "установить, завязать (контакт, разговор, отношения)"
    examples:
      - pl: "Nawiązał kontakt z wydawcą."
        ru: "Он установил контакт с издателем."
        source: { kind: authored }
      - pl: "Próbował nawiązać rozmowę z sąsiadką."
        ru: "Он пытался завязать разговор с соседкой."
        source: { kind: authored }
      - pl: "Oba kraje nawiązały współpracę."
        ru: "Обе страны установили сотрудничество."
        source: { kind: authored }
  - id: refer
    ru: "сослаться (на), перекликаться (с) — NAWIĄZAĆ DO"
    examples:
      - pl: "Nawiązał do słów prezydenta."
        ru: "Он сослался на слова президента."
        source: { kind: authored }
      - pl: "Autorka nawiązała do mitologii."
        ru: "Автор обратилась к мифологии."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "NAWIĄZAĆ — «завязать, установить» (контакт, разговор), а не «навязать». Русское «навязать» — NARZUCIĆ: NARZUCIĆ KOMUŚ SWOJE ZDANIE. NAWIĄZAĆ DO — «сослаться на, перекликаться с»." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное NAWIĄZANY — о контактах и отношениях; форма для мужчин-людей NAWIĄZANI в карточку не включена. Будущее с Ż: NAWIĄŻĘ, NAWIĄŻESZ, повелительное NAWIĄŻ. Несовершенный вид — NAWIĄZYWAĆ." }
  - { kind: government, text: "Что — винительный: NAWIĄZAĆ KONTAKT, WSPÓŁPRACĘ. С кем — Z с творительным: NAWIĄZAĆ ROZMOWĘ Z SĄSIADEM. К чему — DO с родительным: NAWIĄZAĆ DO TRADYCJI." }
  - { kind: pronunciation, text: "Читается «навё́нзаць»: IĄ перед Z — «ён», ударение на предпоследнем слоге. NAWIĄŻĘ — «навё́нжэ»." }
  - { kind: register, text: "Книжное и деловое. В разговоре — ZŁAPAĆ KONTAKT, ZAGADAĆ DO KOGOŚ. W NAWIĄZANIU DO — канцелярская формула деловых писем." }
collocations:
  - { pl: "nawiązać kontakt", ru: "установить контакт" }
  - { pl: "nawiązać współpracę", ru: "наладить сотрудничество" }
  - { pl: "nawiązać do tradycji", ru: "обратиться к традиции" }
family:
  - { pl: "wiązać", ru: "вязать, связывать", relation: root, id: wiazac }
  - { pl: "związać", ru: "связать", relation: derived, id: zwiazac }
  - { pl: "nawiązywać", ru: "завязывать, налаживать", relation: aspect }
etymology: "Приставка NA- плюс WIĄZAĆ «вязать», праславянское *vęzati. Польское Ą соответствует русскому «я»: WIĄZAĆ — «вязать». По строению NAWIĄZAĆ — «навязать», но значение польское: «завязать связь»."
memory: "Nawiązać kontakt — установить контакт. Nawiązać do — сослаться на. «Навязать» — narzucić. Читается «навё́нзаць»."
idioms:
  - { pl: "w nawiązaniu do", ru: "в связи с, ссылаясь на" }
formExamplesSkip:
  - { form: "nawiązani", reason: "людей не «завязывают»: формы для мужчин-людей нет" }
