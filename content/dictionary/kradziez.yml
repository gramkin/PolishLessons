notes:
  - { kind: government, text: "«Обвинить в краже» — oskarżyć o kradzież (винительный с o); «виновен в краже» — winny kradzieży (родительный)." }
  - { kind: usage, text: "Глагол — ukraść «украсть», деятель — złodziej «вор». Все три слова стоит учить вместе." }
  - { kind: usage, text: "Существительное женского рода на -ż: kradzież, kradzieży, kradzieżą." }
  - { kind: usage, text: "kradzież tożsamości — «кража личности», современный устойчивый термин." }
collocations:
