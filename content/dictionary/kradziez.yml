  - { pl: "winny kradzieży", ru: "виновен в краже" }
  - { pl: "kradzież tożsamości", ru: "кража личности" }
etymology: "От kraść «красть», праславянское *kradti. Русское «кража» — то же слово с тем же суффиксом, соответствие полное."
memory: "kradzież = «кража», от kraść «красть». Учите тройкой: kraść «красть» — kradzież «кража» — złodziej «вор». Падежи: oskarżyć o kradzież, но winny kradzieży."
idioms:
