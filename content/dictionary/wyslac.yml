# review
id: wyslac
format: 2
lemma: "wysłać"
rank: 369
pos: verb
aspect: perf
pron: { cyr: "вы́суаць" }
senses:
  - id: send
    ru: "отправить, послать"
    examples:
      - pl: "Nie zapomnij wysłać tego listu."
        ru: "Не забудь отправить это письмо."
        source: { kind: tatoeba, id: 359854 }
      - pl: "Wyślę Tomkowi pocztówkę."
        ru: "Я пошлю Тому открытку."
        source: { kind: tatoeba, id: 13785280 }
      - pl: "Potrzebuję twojego adresu, żeby wysłać ci prezent."
        ru: "Мне нужен твой адрес, чтобы отправить тебе подарок."
        source: { kind: tatoeba, id: 5948372 }
  - id: send-someone
    ru: "послать (кого-либо, что-либо кому-либо)"
    examples:
      - pl: "Tom wysłał Marii bukiet kwiatów."
        ru: "Том прислал Марии букет цветов."
        source: { kind: tatoeba, id: 11111466 }
      - pl: "Samiego wysłano do tamtego domu."
        ru: "Сами отправили в тот дом."
        source: { kind: translated, id: 10768421 }
      - pl: "Czy wyślesz to pocztą?"
        ru: "Ты пошлёшь это почтой?"
        source: { kind: tatoeba, id: 356343 }
notes:
  - { kind: false-friend, text: "Формы на wyściel- (wyścielę, wyścielony) принадлежат не этому глаголу, а wyścielić «выстлать, обить». Словарь форм склеил два разных слова, совпавших в неопределённой форме." }
  - { kind: usage, text: "Будущее берёт другую основу, с мягким ś: wyślę, wyślesz, wyśle — при прошедшем wysłał." }
  - { kind: usage, text: "Кому отправляют — дательный падеж: wysłał Marii bukiet kwiatów «послал Марии букет цветов»." }
  - { kind: usage, text: "Несовершенный вид — wysyłać: Wysyłam listy co tydzień «Я отправляю письма каждую неделю»." }
collocations:
  - { pl: "wysłać list", ru: "отправить письмо" }
  - { pl: "wysłać wiadomość", ru: "отправить сообщение" }
  - { pl: "wysłać pocztą", ru: "отправить почтой" }
etymology: "Из wy- + słać «слать»; русское «выслать» собрано ровно так же, и корень тот же, что в «посылать»."
memory: "wysłać — «выслать, отправить», слово буква в букву русское. Но будущее меняет корень: wyślę, wyślesz — с мягким ś, при прошедшем wysłał. Кому отправляют — дательный: wysłał Marii bukiet."
idioms:
  - { pl: "wysłać pocztą", ru: "отправить почтой" }
  - { pl: "wysłać wiadomość", ru: "отправить сообщение" }
  - { pl: "wysłać kogoś do diabła", ru: "послать кого-то к чёрту" }
