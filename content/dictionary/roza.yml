notes:
  - { kind: false-friend, text: "Польское RÓŻA покрывает сразу два русских слова, и второе неожиданно. Первое значение — «роза», цветок, тут всё просто. Второе — «рожа», но не в грубом смысле «лицо», а в медицинском: острое воспаление кожи, по-латыни erysipelas. То есть RÓŻA — это и роза, и рожа-болезнь, и различает их только контекст. А вот русское «рожа» о лице по-польски будет MORDA или GĘBA, и этого значения у RÓŻA нет вовсе. Связь между цветком и болезнью простая: воспалённая кожа краснеет, отсюда и название, в обоих языках независимо." }
  - { kind: pronunciation, text: "Читается «ру́жа», в два слога, с ударением на первом. Буква ó всегда даёт «у», поэтому не «ро́жа», а «ру́жа», и это главное отличие на слух от русского слова. Буква ż даёт «ж». Родительный множественного — RÓŻ, где на конце ż оглушается в «ш»: «руш». Сравните RÓŻOWY «розовый» — «ружо́вы», где ó остаётся «у» и в производном слове." }
  - { kind: government, text: "Существительное женского рода на -a, склоняется обычно. Предложный и дательный единственного — RÓŻY, родительный множественного — RÓŻ без окончания. Важный оборот с предлогом: CHOROWAĆ NA RÓŻĘ «болеть рожей», с NA и винительным, как во всех польских названиях болезней: CHOROWAĆ NA GRYPĘ, NA ANGINĘ. Русский тут требует творительного без предлога, «болеть гриппом», так что конструкцию нужно перестраивать целиком." }
  - { kind: usage, text: "В значении цветка слово нейтральное и частое, в значении болезни — медицинское, но вполне обиходное: о роже говорят и врачи, и больные. Различает их обычно сказуемое: RÓŻA KWITNIE, PACHNIE, USCHŁA — это цветок; RÓŻA WYWIĄZAŁA SIĘ, ROZPOZNANO RÓŻĘ, CHORUJE NA RÓŻĘ — это болезнь. Родственное RÓŻANIEC «чётки» идёт от того же слова: это «венок из роз», и русские «чётки» с ним никак не связаны." }
collocations:
  - { pl: "czerwona róża", ru: "красная роза" }
  - { pl: "chorować na różę", ru: "болеть рожей" }
