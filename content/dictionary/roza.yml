etymology: "Из латинского ROSA, пришедшего в польский очень рано, ещё до того как язык перестал менять заимствования: отсюда и ó на месте o, и ż на месте s, — по славянским звуковым законам, как в слове RÓŻANIEC. Русское «роза» заимствовано много позже и прямо, поэтому сохранило латинский вид почти без изменений. Получилась любопытная пара: одно и то же латинское слово, взятое дважды в разное время, дало «роза» и RÓŻA, которые на слух едва узнают друг друга. Медицинское значение в обоих языках развилось независимо, от красноты воспалённой кожи."
memory: "RÓŻA — это и «роза», и «рожа» как болезнь кожи. Русской «рожи» о лице тут нет, для этого morda или gęba. Читается «ру́жа»: ó всегда даёт «у». Болезни по-польски берут NA с винительным: chorować NA różę."
idioms:
