notes:
  - { kind: false-friend, text: "Русского слова «опона» нет, зато есть «попона» — покрывало для коня, — и это как раз ближайшая родня польской OPONA. Оба слова от одного образа: нечто натянутое вокруг. Поэтому значение «шина» в польском не метафора, а прямое продолжение смысла: шина — то, что натянуто на колесо. Русский в этом месте взял либо «шину», из немецкого, либо «покрышку», от «покрывать», и получилась разная мотивировка при одинаковом предмете. Запомнить легко через «попону»: то, что натягивают на коня, и то, что натягивают на колесо, названы в двух языках одним корнем." }
  - { kind: pronunciation, text: "Читается «опо́на», ударение на предпоследнем слоге, как и во всех польских словах. Все три гласные открытые и чистые, без редукции: первое O звучит полноценным «о», а не «а», как было бы в русской безударной позиции. Это общее правило польского и частая ошибка русскоязычных: в польском безударные гласные не ослабляются. В местном и дательном падеже OPONIE буква N смягчается перед -IE: «опо́не»." }
  - { kind: government, text: "Женский род на -A, склонение правильное. Винительный на -Ę: WYMIENIŁ OPONĘ. Сезон вводится прилагательным, а не предлогом: OPONY ZIMOWE, OPONY LETNIE, OPONY WIELOSEZONOWE. Установка — глагол ZAŁOŻYĆ с винительным: ZAŁOŻYĆ OPONY «поставить шины», а снятие — ZDJĄĆ. Повреждение описывают безлично: ZŁAPAŁ GUMĘ «поймал прокол», буквально «схватил резину», и это выражение в разговоре частее, чем любое упоминание самой OPONA." }
  - { kind: usage, text: "Слово бытовое и техническое, без переносных значений, и почти всегда появляется во множественном числе, потому что шины меняют комплектом: OPONY ZIMOWE, CZTERY OPONY. Родственное GUMA значит и резину как материал, и в разговоре прокол. Магазин и мастерская называются WULKANIZACJA — слово, которого в русском в этом значении нет, а по-русски это «шиномонтаж». Для учащегося это полезная пара: вывеску WULKANIZACJA надо узнавать, потому что по корню догадаться трудно." }
