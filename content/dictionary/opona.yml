etymology: "От глагола OPIĄĆ «обтянуть, натянуть вокруг», из приставки O- и корня *pьn-, того же, что в PIĄĆ SIĘ «тянуться вверх» и в русском «пну», «напяливать», «запинать». Праславянское *opьna означало натянутое полотнище, занавес, покрывало, и в этом смысле слово дошло до русского как «попона», конское покрывало. Старопольское OPONA тоже значило занавес или гобелен, и лишь в двадцатом веке, с появлением автомобиля, перешло на резиновую покрышку — по тому же признаку, что натянута вокруг. Так что слово не заимствовано, а переосмыслено, и исходный образ в нём сохранился полностью: OPONA есть то, что натянуто на обод."
memory: "От opiąć «натянуть вокруг»: шина — то, что натянуто на колесо. Русская родня — «попона», конское покрывало, от того же *opьna; «шина» и «покрышка» названы иначе. Почти всегда во множественном: opony zimowe. Шиномонтаж — wulkanizacja, по корню не угадать. Безударные гласные не редуцируются: «опо́на», а не «апона»."
