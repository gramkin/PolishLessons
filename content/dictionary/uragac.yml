# review
id: uragac
format: 2
lemma: "urągać"
rank: 6088
pos: verb
aspect: imperf
pron: { cyr: "уро́нгаць" }
senses:
  - id: defy
    ru: "urągać czemuś — вопиюще противоречить, быть насмешкой над (здравым смыслом, приличием, правилами)"
    examples:
      - pl: "Ta decyzja urąga zdrowemu rozsądkowi."
        ru: "Это решение противоречит здравому смыслу."
        source: { kind: authored }
      - pl: "Warunki w obozie urągały ludzkiej godności."
        ru: "Условия в лагере унижали человеческое достоинство."
        source: { kind: authored }
      - pl: "Pensja urągała jego kwalifikacjom."
        ru: "Зарплата была насмешкой над его квалификацией."
        source: { kind: authored }
  - id: revile
    ru: "книжн. urągać komuś — поносить, оскорблять, глумиться над кем-л."
    examples:
      - pl: "Pijak urągał wszystkim dookoła."
        ru: "Пьяница поносил всех вокруг."
        source: { kind: authored }
      - pl: "Żołnierze urągali jeńcom."
        ru: "Солдаты глумились над пленными."
        source: { kind: authored }
notes:
  - { kind: government, text: "Только дательный: URĄGAĆ KOMUŚ, CZEMUŚ — URĄGAĆ SĘDZIEMU, URĄGAĆ ZDROWEMU ROZSĄDKOWI. Не винительный, как в русском «ругать кого»: не URĄGAĆ SĘDZIEGO. Поэтому и страдательного причастия у глагола нет." }
  - { kind: false-friend, text: "Родственно русскому «ругать», но значит не «бранить, отчитывать» (это KRZYCZEĆ NA KOGOŚ, BESZTAĆ), а «глумиться, поносить» — ближе к русскому «надругаться», «поругание». Ругаться матом — PRZEKLINAĆ." }
  - { kind: usage, text: "Сегодня чаще всего о вещах, а не о людях: URĄGAĆ ZDROWEMU ROZSĄDKOWI, LOGICE, PRZYZWOITOŚCI, LUDZKIEJ GODNOŚCI. Причастие URĄGAJĄCY — постоянное книжное определение: WARUNKI URĄGAJĄCE LUDZKIEJ GODNOŚCI «бесчеловечные условия»." }
  - { kind: pronunciation, text: "Ą перед G — «он»: «уро́нгаць». URĄGA — «уро́нга», URĄGAJĄ — «уронга́йоу̃»." }
  - { kind: register, text: "Книжное слово: публицистика, суд, официальные жалобы. В разговоре вместо него — OBRAŻAĆ, WYZYWAĆ (о людях) или IŚĆ WBREW (о здравом смысле)." }
collocations:
  - { pl: "urągać zdrowemu rozsądkowi", ru: "противоречить здравому смыслу" }
  - { pl: "urągać ludzkiej godności", ru: "унижать человеческое достоинство" }
  - { pl: "urągać przyzwoitości", ru: "попирать приличия" }
  - { pl: "urągać wszelkim zasadom", ru: "попирать все правила" }
  - { pl: "warunki urągające godności", ru: "унизительные условия" }
family:
  - { pl: "urąganie", ru: "глумление, поношение", relation: derived }
  - { pl: "urągliwy", ru: "глумливый, издевательский", relation: derived }
synonyms: ["szydzić", "drwić", "obrażać", "przeczyć"]
etymology: "Праславянское *rǫgati «насмехаться», тот же корень, что русское «ругать», «поругание», «надругаться»: праславянское носовое *ǫ дало польское Ą и русское «у». Польский добавил приставку U- и сохранил старое значение «глумиться», а русское «ругать» ослабло до «бранить»."
memory: "URĄGAĆ — это русское «поругание», а не «ругань»: urąga zdrowemu rozsądkowi — надругается над здравым смыслом."
idioms:
  - { pl: "urągać zdrowemu rozsądkowi", ru: "идти против здравого смысла, не лезть ни в какие ворота" }
  - { pl: "urągać ludzkiej godności", ru: "быть унизительным для человека, бесчеловечным" }
