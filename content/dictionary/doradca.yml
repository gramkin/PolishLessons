notes:
  - { kind: usage, text: "Слово склоняется так же, как WŁADCA из этой же партии: единственное число по женскому образцу — DORADCY, DORADCĘ, DORADCĄ, DORADCO, — множественное по мужскому личному: DORADCÓW, DORADCOM, DORADCAMI, DORADCACH. Форма DORADCY покрывает пять падежных мест, уничижительная DORADCE стоит отдельно. Запоминать два слова вместе удобно: образец один, и к нему же относятся KIEROWCA, SPRZEDAWCA, WYKONAWCA, ŁOWCA." }
  - { kind: usage, text: "Корень слова для русского поучителен. DORADCA построено от DORADZAĆ «советовать», а то от RADA, и RADA по-польски значит и «совет» как наставление, и «совет» как учреждение: RADA MINISTRÓW «совет министров», RADA MIASTA «городской совет». Русский знает это слово как заимствованную «раду». Отсюда и нужное выражение: DAĆ RADĘ значит не «дать совет», а «справиться, осилить» — poradzę sobie, dam radę." }
  - { kind: usage, text: "В обиходе слово деловое и встречается всюду: DORADCA PODATKOWY «налоговый консультант», DORADCA FINANSOWY, DORADCA KLIENTA «менеджер по работе с клиентами», DORADCA PREZYDENTA. Русское «советник» покрывает только часть этого поля, потому что для торговли и услуг русский берёт «консультанта» и «менеджера». Выбирая перевод, смотрите на сферу: государство даёт «советника», фирма — «консультанта»." }
collocations:
  - { pl: "doradca podatkowy", ru: "налоговый консультант" }
  - { pl: "doradca finansowy", ru: "финансовый консультант" }
  - { pl: "doradca prezydenta", ru: "советник президента" }
family:
  - { pl: "rada", ru: "совет", relation: root, id: rada }
  - { pl: "doradzać", ru: "советовать", relation: root }
etymology: "От DORADZAĆ «советовать», приставочного к RADZIĆ, а то от RADA «совет», слова, пришедшего из немецкого Rat. Суффикс -ca дал название действующего лица, как в władca и kierowca. Русский взял тот же немецкий корень как «раду» — в названиях учреждений вроде Верховной Рады, — а советника назвал от своего «совета», так что родство слов есть, но лежит оно в стороне от обоих переводов."
memory: "Склонение как у władca: женское в единственном, мужское во множественном. Корень — rada «совет», и dać radę значит «справиться», а не «дать совет»."
idioms:
