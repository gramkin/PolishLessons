# review
id: klan
format: 2
lemma: "klan"
rank: 4142
pos: noun
pron: { cyr: "клан" }
senses:
  - id: clan
    ru: "клан, род"
    examples:
      - pl: "Szkockie klany mają własne barwy."
        ru: "У шотландских кланов свои цвета."
        source: { kind: authored }
      - pl: "Klan mafijny kontrolował port."
        ru: "Мафиозный клан контролировал порт."
        source: { kind: authored }
      - pl: "Należy do potężnego klanu."
        ru: "Он принадлежит к могущественному клану."
        source: { kind: authored }
  - id: family-colloq
    ru: "вся родня, семейство (разг.)"
    examples:
      - pl: "Na święta przyjechał cały klan."
        ru: "На праздники приехала вся родня."
        source: { kind: authored }
      - pl: "Ich klan zajmuje trzy domy przy jednej ulicy."
        ru: "Их семейство занимает три дома на одной улице."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KLAN — «клан», и в шутку — «вся семья, родня»: CAŁY KLAN PRZYJECHAŁ. Нейтральное «семья» — RODZINA." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — KLANU, местный — W KLANIE." }
  - { kind: government, text: "Принадлежать к клану — NALEŻEĆ DO KLANU, DO с родительным. Глава клана — GŁOWA KLANU или PRZYWÓDCA KLANU." }
  - { kind: pronunciation, text: "Читается «клан», один слог, как русское." }
collocations:
  - { pl: "cały klan", ru: "вся родня" }
  - { pl: "klan mafijny", ru: "мафиозный клан" }
  - { pl: "głowa klanu", ru: "глава клана" }
family:
  - { pl: "klanowy", ru: "клановый", relation: derived }
  - { pl: "cały klan", ru: "вся родня", relation: derived }
  - { pl: "klan rodzinny", ru: "семейный клан", relation: derived }
etymology: "Из гэльского слова со значением «потомство, дети», через английский. Русский «клан» — то же слово."
memory: "Klan — клан и, в шутку, вся родня: cały klan przyjechał. Należeć do klanu — принадлежать к клану."
idioms:
  - { pl: "trzymać się razem", ru: "держаться вместе" }
