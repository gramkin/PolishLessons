# review
id: splukac
format: 2
lemma: "spłukać"
rank: 4633
pos: verb
pron: { cyr: "спу́укаць" }
senses:
  - id: rinse
    ru: "смыть, сполоснуть; смыть воду (в туалете)"
    examples:
      - pl: "Spłukała szampon z włosów."
        ru: "Она смыла шампунь с волос."
        source: { kind: authored }
      - pl: "Spłucz wodę, proszę."
        ru: "Смой за собой, пожалуйста."
        source: { kind: authored }
      - pl: "Ulewa spłukała kurz z ulic."
        ru: "Ливень смыл пыль с улиц."
        source: { kind: authored }
  - id: go-broke
    ru: "разг. с SIĘ — промотаться, остаться без денег"
    examples:
      - pl: "Spłukał się w kasynie do zera."
        ru: "Он проигрался в казино в пух и прах."
        source: { kind: authored }
      - pl: "Spłukali się na wakacjach."
        ru: "Они потратили все деньги на отпуске."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SPŁUKAĆ — «смыть, сполоснуть». Не путать с «спугнуть» — SPŁOSZYĆ. SPŁUKAĆ WODĘ — «смыть (в туалете)». SPŁUKANY — разговорное «на мели, без денег»: JESTEM SPŁUKANY." }
  - { kind: usage, text: "Пятьдесят три формы, включая SPŁUKANI — «оставшиеся без денег»: JESTEŚMY SPŁUKANI. Будущее с чередованием K/CZ: SPŁUCZĘ, SPŁUCZESZ, повелительное SPŁUCZ. Несовершенный вид — SPŁUKIWAĆ." }
  - { kind: government, text: "Что — винительный: SPŁUKAĆ PIANĘ. С чего — Z с родительным: SPŁUKAĆ SZAMPON Z WŁOSÓW. Чем — творительный: SPŁUKAĆ ZIMNĄ WODĄ. С SIĘ — где: W KASYNIE, NA ZAKUPACH." }
  - { kind: pronunciation, text: "Читается «спу́укаць»: Ł — «у», получается двойное «уу», ударение на предпоследнем слоге. SPŁUCZĘ — «спу́учэ»." }
  - { kind: register, text: "В прямом смысле — нейтральное. SPŁUKAĆ SIĘ и SPŁUKANY — разговорные: «на мели», «без гроша»." }
collocations:
  - { pl: "spłukać szampon", ru: "смыть шампунь" }
  - { pl: "spłukać wodę", ru: "смыть воду в туалете" }
  - { pl: "spłukać się w kasynie", ru: "проиграться в казино" }
family:
  - { pl: "płukać", ru: "полоскать", relation: root }
  - { pl: "wypłukać", ru: "выполоскать, вымыть", relation: derived }
  - { pl: "spłukiwać", ru: "смывать", relation: aspect }
etymology: "Приставка S- «с-» плюс PŁUKAĆ «полоскать», праславянское *polkati. Польское ŁU соответствует русскому «оло»: PŁUKAĆ — «полоскать»."
memory: "Spłukać — смыть: spłukała szampon. Spłucz wodę! — смой за собой! Spłukany — на мели. Читается «спу́укаць»."
idioms:
  - { pl: "być spłukanym do zera", ru: "остаться без гроша, быть на мели" }
