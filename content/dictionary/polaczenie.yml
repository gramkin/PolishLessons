etymology: "Отглагольное существительное от POŁĄCZYĆ, от ŁĄCZYĆ «соединять», из праславянского корня со значением «сгибать, связывать». Русские родственники у этого корня есть, но смысл у них противоположный: «разлука» и «разлучить», то есть разъединение, а также «случай» и «получить», где сохранилась идея сведения вместе. Так один корень дал в русском и соединение, и разъединение, смотря по приставке. Польский оставил ŁĄCZYĆ главным словом для соединения, и от него пошло целое гнездо: WŁĄCZYĆ «включить», WYŁĄCZYĆ «выключить», ŁĄCZNOŚĆ «связь»."
memory: "Одно слово на четыре русских: połączenie это соединение в технике, связь по телефону, сообщение на транспорте и рейс в расписании. Корень łączyć стоит запомнить: от него włączyć «включить» и wyłączyć «выключить», и поэтому wyłączyć не родня wykluczyć «исключить». Русская родня корня неожиданная и с обратным смыслом: «разлука», «разлучить», а также «случай». Готовый оборот w połączeniu z значит «в сочетании с». Читается «поуончэ́не»."
idioms:
  - { pl: "w połączeniu z", ru: "в сочетании с" }
