notes:
  - { kind: false-friend, text: "Одно польское слово покрывает сразу четыре русских, и выбирать приходится по контексту. POŁĄCZENIE — это и «соединение» в технике, POŁĄCZENIE RUR, и «связь» в разговоре по телефону, BRAK POŁĄCZENIA, и «сообщение» о транспорте, POŁĄCZENIE KOLEJOWE, и «рейс», POŁĄCZENIE DO GDAŃSKA. Русскому приходится каждый раз выбирать слово заново, а поляку нет. Отдельно: ŁĄCZNOŚĆ значит «связь» как служба или как отрасль, ŁĄCZNOŚĆ RADIOWA." }
  - { kind: government, text: "Соединение с чем — предлог Z с творительным: POŁĄCZENIE Z SERWEREM, POŁĄCZENIE Z MIASTEM, и русский строит так же. Рейс куда — предлог DO с родительным: POŁĄCZENIE DO WARSZAWY. Отдельно стоит запомнить готовый оборот W POŁĄCZENIU Z, то есть «в сочетании с», с творительным: LEK W POŁĄCZENIU Z ALKOHOLEM «лекарство в сочетании с алкоголем». Глагол POŁĄCZYĆ управляет винительным и предлогом Z: POŁĄCZ MNIE Z DYREKTOREM «соедините меня с директором»." }
  - { kind: usage, text: "Восемь форм, средний род, родительный множественного POŁĄCZEŃ. Это отглагольное существительное от POŁĄCZYĆ «соединить», а тот от ŁĄCZYĆ «соединять». Корень стоит запомнить отдельно, потому что от него же идут WŁĄCZYĆ «включить» и WYŁĄCZYĆ «выключить», и именно поэтому WYŁĄCZYĆ не имеет ничего общего с WYKLUCZYĆ «исключить», хотя на вид они похожи: у первого корень ŁĄCZYĆ, у второго KLUCZ." }
  - { kind: pronunciation, text: "Читается «поуончэ́не», четыре слога, ударение на третьем, то есть на предпоследнем. Разбирается так: Ł даёт «у», поэтому начало «поу»; носовая Ą перед CZ звучит как «он»; CZ даёт твёрдое «ч»; конечное NIE — мягкое «не». Чтение «полончение» будет ошибкой в двух местах сразу. В глаголе POŁĄCZYĆ слышно «поуо́нчычь»." }
  - { kind: register, text: "Слово нейтральное и очень частое, особенно в расписаниях и в разговорах о технике. Частые обороты: POŁĄCZENIE TELEFONICZNE «телефонная связь», BRAK POŁĄCZENIA «нет связи», POŁĄCZENIE KOLEJOWE «железнодорожное сообщение», W POŁĄCZENIU Z «в сочетании с». На вокзале и в приложении рейс обозначают просто POŁĄCZENIE, и фраза NIE MA POŁĄCZENIA W NIEDZIELĘ значит «в воскресенье рейса нет»." }
