notes:
  - { kind: usage, text: "chłopiec — «мальчик», chłopak — «парень»: chłopiec младше. Женская пара — dziewczynka «девочка»." }
  - { kind: usage, text: "Звательный падеж chłopcze живой и частый: Chłopcze, uważaj! «Парень, осторожно!»" }
  - { kind: usage, text: "Множественное — chłopcy: Chłopcy poszli do szkoły." }
collocations:
  - { pl: "mały chłopiec", ru: "маленький мальчик" }
  - { pl: "chłopcy i dziewczynki", ru: "мальчики и девочки" }
  - { pl: "grzeczny chłopiec", ru: "послушный мальчик" }
  - { pl: "chłopiec na posyłki", ru: "мальчик на побегушках" }
etymology: "Праславянское *cholpьcь — уменьшительное от chłop «мужик»; тот же корень, что в русском «холоп», но без уничижительного оттенка."
memory: "chłopiec — «мальчик», chłopak — «парень», а chłop — «мужик». Звательный падеж живой: Chłopcze! Множественное — chłopcy."
idioms:
