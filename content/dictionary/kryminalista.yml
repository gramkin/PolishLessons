etymology: "От латинского CRIMEN «преступление», через KRYMINALNY «уголовный», с суффиксом -ISTA. Русский «криминалист» образован так же, но значит другое."
memory: "Kryminalista — уголовник, не криминалист! Kryminał — детектив. Kryminaliści — уголовники. Читается «крыминали́ста»."
