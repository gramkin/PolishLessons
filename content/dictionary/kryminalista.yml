  - id: crook
    ru: "жулик, тип (пренебр.)"
    examples:
      - pl: "Ten kryminalista znowu kogoś oszukał."
        ru: "Этот жулик опять кого-то обманул."
        source: { kind: authored }
      - pl: "Nie zadawaj się z kryminalistami."
        ru: "Не водись с уголовниками."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KRYMINALISTA — «уголовник», а не «криминалист»! Криминалист, эксперт — KRYMINOLOG или TECHNIK KRYMINALISTYCZNY. Детектив, криминальный роман — KRYMINAŁ." }
  - { kind: usage, text: "Мужской род, лицо, склоняется как существительные на -A: KRYMINALISTA, KRYMINALISTY, KRYMINALIŚCIE. Множественное — KRYMINALIŚCI. Звательный KRYMINALISTO не учим." }
  - { kind: government, text: "Поймать уголовника — ZŁAPAĆ KRYMINALISTĘ, винительный. Водиться с уголовниками — ZADAWAĆ SIĘ Z KRYMINALISTAMI, творительный." }
  - { kind: pronunciation, text: "Читается «крыминали́ста»: KRY — «кры», ударение на предпоследнем слоге. KRYMINALIŚCI — «крыминали́сьци»." }
collocations:
  - { pl: "groźny kryminalista", ru: "опасный преступник" }
  - { pl: "notoryczny kryminalista", ru: "рецидивист" }
  - { pl: "zadawać się z kryminalistami", ru: "водиться с уголовниками" }
family:
