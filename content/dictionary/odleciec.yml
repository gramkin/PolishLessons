# review
id: odleciec
format: 2
lemma: "odlecieć"
rank: 3937
pos: verb
pron: { cyr: "одле́цець" }
senses:
  - id: fly-away
    ru: "улететь, отлететь"
    examples:
      - pl: "Ptaki odleciały na południe."
        ru: "Птицы улетели на юг."
        source: { kind: authored }
      - pl: "Samolot odleciał z dwugodzinnym opóźnieniem."
        ru: "Самолёт улетел с двухчасовым опозданием."
        source: { kind: authored }
      - pl: "Balon odleciał dziecku z ręki."
        ru: "Шарик улетел у ребёнка из руки."
        source: { kind: authored }
  - id: come-off
    ru: "отлететь, отскочить (о детали); отключиться (разг.)"
    examples:
      - pl: "Od uderzenia odleciał guzik."
        ru: "От удара отлетела пуговица."
        source: { kind: authored }
      - pl: "Po dwóch piwach całkiem odleciał."
        ru: "После двух кружек пива он совсем улетел."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ODLECIEĆ шире русского «отлететь»: это и «улететь» — PTAKI ODLECIAŁY, «птицы улетели», и «вылететь» о рейсе — SAMOLOT ODLECIAŁ O PIĄTEJ. Русское «улететь» почти всегда ODLECIEĆ. В разговоре ODLECIEĆ — «отключиться, улететь» от сна, усталости или вещества, и от восторга: ODLECIAŁEM PRZY TEJ MUZYCE." }
  - { kind: usage, text: "Сорок две формы: глагол совершенного вида и непереходный, страдательного причастия нет, есть деепричастие ODLECIAWSZY. Безличное ODLECIANO встречается редко. Видовой партнёр — ODLATYWAĆ: SAMOLOT ODLATUJE Z TERMINALU DRUGIEGO. Чередование: ODLECĘ, ODLECISZ, но ODLECIAŁ — E переходит в A перед Ł." }
  - { kind: government, text: "Откуда — Z или OD с родительным: ODLECIEĆ Z WARSZAWY, ODLECIEĆ OD ŚCIANY. Куда — DO с родительным для города, NA для направления: ODLECIEĆ DO RZYMU, NA POŁUDNIE. У кого улетело — дательный: KAPELUSZ ODLECIAŁ MU Z GŁOWY." }
  - { kind: pronunciation, text: "Читается «одле́цець», три слога, ударение на предпоследнем. CIE — мягкое «це», конечное Ć — «ць». В прошедшем ODLECIAŁ — «одле́цяу», IA после C — «ця»." }
  - { kind: register, text: "В прямом смысле — нейтральное слово аэропортов и природы. В переносном — молодёжный сленг: ODLECIEĆ — «улететь, отключиться», ODLOT — «кайф, отпад»: TO BYŁ ODLOT!" }
collocations:
  - { pl: "odlecieć na południe", ru: "улететь на юг" }
  - { pl: "samolot odleciał", ru: "самолёт вылетел" }
  - { pl: "odlecieć z wrażenia", ru: "улететь от впечатлений" }
family:
  - { pl: "odlatywać", ru: "улетать, вылетать", relation: aspect }
  - { pl: "lecieć", ru: "лететь", relation: root, id: leciec }
  - { pl: "odlot", ru: "вылет; кайф (сленг)", relation: derived }
etymology: "Приставка OD- «от-» плюс LECIEĆ «лететь», от праславянского *letěti, того же, что русское «лететь». Польское CIE на месте русского «те» — обычное смягчение T перед старым Ě."
memory: "Odlecieć — улететь: ptaki odleciały na południe, samolot odleciał. Guzik odleciał — отлетела пуговица. Odlot — вылет, а в сленге «кайф». Читается «одле́цець»."
idioms:
  - { pl: "odlecieć z wrażenia", ru: "улететь от впечатлений" }
