# review
id: myslec
format: 2
lemma: "myśleć"
rank: 42
pos: verb
aspect: imperf
pron: { cyr: "мы́сьлець" }
senses:
  - id: think
    ru: "думать, мыслить"
    examples:
      - pl: "Myślę o tobie."
        ru: "Я думаю о тебе."
        source: { kind: tatoeba, id: 355505 }
      - pl: "Myślisz, że to prawda?"
        ru: "Думаешь, это правда?"
        source: { kind: tatoeba, id: 12567444 }
      - pl: "Co pan o tym myśli?"
        ru: "Что вы об этом думаете?"
        source: { kind: tatoeba, id: 6327939 }
  - id: believe
    ru: "думать, полагать (что-л.)"
    examples:
      - pl: "Myślałem, że mi się uda."
        ru: "Я думал, что у меня получится."
        source: { kind: tatoeba, id: 728417 }
      - pl: "Ja też tak myślę."
        ru: "Я тоже так думаю."
        source: { kind: tatoeba, id: 3446258 }
notes:
  - { kind: government, text: "myśleć o czymś «думать о чём-то» — с предлогом o и предложным падежом, как в русском." }
  - { kind: false-friend, text: "Форма myśl — это и повелительное «думай!», и существительное myśl «мысль»; различайте по контексту." }
collocations:
  - { pl: "myśleć o czymś", ru: "думать о чём-то" }
  - { pl: "tak myślę", ru: "я так думаю" }
  - { pl: "niewiele myśląc", ru: "недолго думая" }
etymology: "Праславянское *mysliti от *myslь «мысль» — то же слово, что русское «мыслить»."
memory: "Управление то же, что в русском: myślę o tobie «думаю о тебе». Осторожно с формой myśl: это и «думай!», и существительное «мысль» — как русские «мысль» и «мысли»."
idioms:
  - { pl: "niewiele myśląc", ru: "недолго думая" }
  - { pl: "myślałby kto", ru: "подумаешь" }
  - { pl: "myśleć trzeźwo", ru: "мыслить трезво" }
