etymology: "Приставка ZA- и основа HACZYĆ от HAK «крюк» (уменьшительное HACZYK), слова германского происхождения, родственного немецкому Haken. Буквально — «зацепить крюком»."
memory: "Zahaczyć — «за-крючить»: hak — крюк, haczyk — крючок. Зацепиться за гвоздь, а по пути «зацепить» магазин: zahaczę o sklep."
idioms:
  - { pl: "zahaczyć o kogoś", ru: "разг. заглянуть к кому-л. по пути" }
