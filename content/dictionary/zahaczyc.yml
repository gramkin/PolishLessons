# review
id: zahaczyc
format: 2
lemma: "zahaczyć"
rank: 5875
pos: verb
aspect: perf
pron: { cyr: "заха́чыць" }
senses:
  - id: snag
    ru: "зацепиться, задеть (zahaczyć o coś)"
    examples:
      - pl: "Zahaczyłem rękawem o gwóźdź."
        ru: "Я зацепился рукавом за гвоздь."
