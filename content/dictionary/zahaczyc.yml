  - id: hook
    ru: "зацепить, подцепить (крюком, крючком)"
    examples:
      - pl: "Zahacz linę o ten hak."
        ru: "Зацепи верёвку за этот крюк."
        source: { kind: authored }
      - pl: "Wędkarz zahaczył buta zamiast ryby."
        ru: "Рыбак подцепил ботинок вместо рыбы."
        source: { kind: authored }
  - id: drop-by
    ru: "разг. заскочить, заехать по пути (zahaczyć o coś)"
    examples:
      - pl: "W drodze do domu zahaczę o sklep."
        ru: "По дороге домой я заскочу в магазин."
        source: { kind: authored }
      - pl: "Jadąc nad morze, zahaczyliśmy o Gdańsk."
        ru: "Едучи на море, мы заехали в Гданьск."
        source: { kind: authored }
  - id: touch-on
    ru: "затронуть (тему, вопрос)"
    examples:
      - pl: "W wykładzie zahaczył o historię Polski."
        ru: "В лекции он затронул историю Польши."
        source: { kind: authored }
notes:
  - { kind: government, text: "ZAHACZYĆ O + ВИНИТЕЛЬНЫЙ: ZAHACZYĆ O GWÓŹDŹ «зацепиться ЗА гвоздь», ZAHACZYĆ O SKLEP «заскочить В магазин», ZAHACZYĆ O TEMAT «затронуть тему». Русские «за», «в» и прямое дополнение — всё это по-польски O." }
  - { kind: usage, text: "Совершенный вид; несовершенный — ZAHACZAĆ. Спряжение на -Ę/-YSZ: ZAHACZĘ, ZAHACZYSZ, ZAHACZĄ — это будущее время. Повелительное — ZAHACZ, ZAHACZMY, ZAHACZCIE." }
  - { kind: register, text: "Значение «заскочить по пути» — разговорное: ZAHACZĘ O APTEKĘ. В официальной речи — WSTĄPIĆ, ODWIEDZIĆ." }
  - { kind: pronunciation, text: "CH читается как «х», CZ — как «ч»: «заха́чыць». Ударение на предпоследнем слоге: ZAHACZĘ — «заха́чэ»." }
collocations:
  - { pl: "zahaczyć o gwóźdź", ru: "зацепиться за гвоздь" }
  - { pl: "zahaczyć o sklep", ru: "заскочить в магазин" }
  - { pl: "zahaczyć o temat", ru: "затронуть тему" }
family:
  - { pl: "zahaczać", ru: "цеплять, задевать", relation: aspect }
  - { pl: "hak", ru: "крюк", relation: root, id: hak }
  - { pl: "haczyk", ru: "крючок; подвох", relation: root }
