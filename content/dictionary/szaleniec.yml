etymology: "От SZALONY «безумный» с суффиксом -ENIEC, обозначающим лицо по состоянию. Корень праславянский, *šalъ, и русскому он знаком по «шальному», «шалить», «шалость» — но с ослабленным значением: у русского это баловство и беспорядочность, у польского настоящее безумие. SZALEĆ значит «безумствовать» и о человеке, и о стихии: WIATR SZALEJE «ветер бушует». Суффикс -ENIEC виден в целой группе названий лиц, и во всех беглая гласная E выпадает перед падежным окончанием: MŁODZIENIEC и MŁODZIEŃCA, WYGNANIEC и WYGNAŃCA, SKAZANIEC и SKAZAŃCA. Одновременное выпадение гласной и смягчение N — свойство всей группы, а не отдельного слова."
memory: "Две перемены в основе сразу: гласная e выпадает и n смягчается в ń — szaleniec, но szaleńca, szaleńcy. Запоминать парой форм. Звательный особый: szaleńcze, с c→cz. Корень тот же, что в русском «шальном», но сильнее: szalony — «безумный», а не «взбалмошный». Суффикс -eniec даёт ряд названий лиц, и все ведут себя так же: młodzieniec — młodzieńca."
