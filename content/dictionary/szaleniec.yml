notes:
  - { kind: government, text: "Мужской род, одушевлённое, лицо. Склонение показывает сразу два изменения в основе, и оба происходят одновременно при переходе от именительного к остальным падежам: беглая гласная E выпадает, а N смягчается в Ń. SZALENIEC, но SZALEŃCA, SZALEŃCOWI, SZALEŃCEM, SZALEŃCY. Запоминать поэтому стоит пару форм, а не одну: именительный и родительный. Звательный у слова особый, SZALEŃCZE, с окончанием -E и чередованием C в CZ. Винительный равен родительному, как у всех одушевлённых: WIDZIAŁ SZALEŃCA. Родительный множественного SZALEŃCÓW." }
  - { kind: false-friend, text: "Прямого русского родственника у слова нет, зато есть у его корня. SZALENIEC идёт от SZALONY «безумный, сумасшедший», а это прямой родственник русского «шального»: праславянское *šalъ. Но значения разошлись по силе. Русское «шальной» — это взбалмошный, случайный, беспорядочный: «шальная пуля», «шальные деньги». Польское SZALONY гораздо сильнее и значит именно «безумный»: SZALONY POMYSŁ «безумная идея», SZALEŃSTWO «безумие». Поэтому переводить SZALENIEC как «шальной человек» нельзя, нужны «безумец» или «сорвиголова» по контексту." }
  - { kind: pronunciation, text: "Читается «шале́нец», ударение на предпоследнем слоге из трёх. Сочетание SZ даёт «ш». Конечное C звучит «ц». В родительном SZALEŃCA гласная E выпадает, а Ń читается мягко: «шале́ньца», и слогов остаётся три. В именительном множественного SZALEŃCY слышно «шале́ньцы». В звательном SZALEŃCZE сочетание CZ даёт «ч»: «шале́ньче». Так три формы одного слова звучат заметно по-разному, и узнавать их на слух надо порознь." }
  - { kind: usage, text: "Частотные сочетания: TYLKO SZALENIEC «только безумец», SZALENIEC ZA KÓŁKIEM «лихач за рулём», ZACHOWYWAĆ SIĘ JAK SZALENIEC. Суффикс -ENIEC обозначает лицо по свойству или состоянию и даёт целый ряд: MŁODZIENIEC «юноша», WYGNANIEC «изгнанник», SKAZANIEC «осуждённый», PRZYBYSZ по другой модели. Во всех словах этого типа беглая гласная выпадает так же: MŁODZIENIEC, но MŁODZIEŃCA. Женская форма у SZALENIEC не образуется; о женщине скажут SZALONA KOBIETA или OBŁĄKANA." }
