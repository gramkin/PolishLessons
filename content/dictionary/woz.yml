# review
id: woz
format: 2
lemma: "wóz"
rank: 1081
pos: noun
pron: { cyr: "вус" }
senses:
  - id: cart
    ru: "телега, повозка"
    examples:
      - pl: "Koń ciągnie duży, ciężki wóz."
        ru: "Лошадь тянет большую тяжёлую телегу."
        source: { kind: translated, id: 2379953 }
      - pl: "Nie stawiać wozu przed koniem."
        ru: "Не ставить телегу впереди лошади."
        source: { kind: translated, id: 943621 }
  - id: vehicle
    ru: "машина, автомобиль (разговорное)"
    examples:
      - pl: "Czy to twój wóz?"
        ru: "Это твоя машина?"
        source: { kind: translated, id: 2186164 }
      - pl: "Wypadek uszkodził przednie koła jej wozu."
        ru: "Авария повредила передние колёса её машины."
        source: { kind: translated, id: 4917260 }
  - id: service
    ru: "wóz strażacki — пожарная машина; специальный автомобиль"
    examples:
      - pl: "Dom spłonął zanim przyjechał wóz strażacki."
        ru: "Дом сгорел прежде, чем приехала пожарная машина."
        source: { kind: translated, id: 11148919 }
      - pl: "Wozy strażackie mają pierwszeństwo przed innymi pojazdami."
        ru: "Пожарные машины имеют преимущество перед другими машинами."
        source: { kind: translated, id: 10592909 }
notes:
  - { kind: usage, text: "Чередование ó/o: именительный wóz с ó, а дальше везде o — wozu, wozem, wozie, wozy." }
  - { kind: false-friend, text: "Русский «воз» — это только груз на телеге. Польское wóz значит и «телега», и разговорное «машина»: Czy to twój wóz? «Это твоя тачка?»." }
  - { kind: usage, text: "Нейтральное слово для автомобиля — samochód. Wóz в этом значении разговорное, примерно как русское «тачка»." }
  - { kind: usage, text: "Служебные машины называются через wóz: wóz strażacki «пожарная машина», wóz policyjny, wóz transmisyjny «передвижная телестудия»." }
collocations:
  - { pl: "wóz strażacki", ru: "пожарная машина" }
  - { pl: "piąte koło u wozu", ru: "пятое колесо в телеге" }
  - { pl: "wóz albo przewóz", ru: "пан или пропал" }
family:
  - { pl: "wozić", ru: "возить", relation: derived }
  - { pl: "wieźć", ru: "везти", relation: root }
  - { pl: "wózek", ru: "тележка, коляска", relation: derived }
etymology: "Праславянское *vozъ от *vezti «везти» — ровно как русский «воз» от «везти». Значение «автомобиль» появилось позже, по той же логике, что и английское car."
memory: "wóz — и «телега», и разговорное «машина»: Czy to twój wóz? Следите за чередованием: wóz с ó, но wozu, wozem. Нейтральное слово для машины — samochód."
idioms:
  - { pl: "piąte koło u wozu", ru: "пятое колесо в телеге" }
  - { pl: "raz na wozie, raz pod wozem", ru: "то взлёт, то падение" }
  - { pl: "wóz albo przewóz", ru: "пан или пропал" }
