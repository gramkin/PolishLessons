etymology: "Из латинского DEPRESSIO «придавливание, понижение», от DEPRIMERE — из DE- «вниз» и PREMERE «давить, жать». Исходный смысл чисто физический: вдавленное, пониженное место, отсюда географическая депрессия как впадина. Психиатрическое значение наросло в девятнадцатом веке, экономическое в двадцатом, и оба языка взяли слово со всеми тремя смыслами из западноевропейского обихода. Корень PREMERE знаком по словам PRESJA и «пресс», KOMPRES и «компресс», IMPRESJA и «импрессия», и во всех видно давление. Польское -SJA на месте латинского -SSIO и русского -ССИЯ это регулярное соответствие класса, и оно же объясняет старую форму родительного множественного DEPRESYJ."
memory: "Одна S, в отличие от русской «депрессии»: польский не удваивает согласных в заимствованиях, как в kolekcja и dyskusja. Все три смысла совпадают с русским — болезнь, экономический спад, понижение местности. Склонение класса -cja: depresji сразу на родительный, дательный и местный единственного и на родительный множественного; старая форма depresyj — в книгах до середины двадцатого века. Cierpieć na depresję — винительный, а не творительный, как в русском."
