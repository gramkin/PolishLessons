notes:
  - { kind: false-friend, text: "Значение совпадает с русской «депрессией» во всех трёх смыслах, и это само по себе стоит отметить: болезненное состояние, экономический спад и географическое понижение местности покрываются одним словом в обоих языках. Расхождение в написании, и оно системное: по-польски одна S, по-русски две — DEPRESJA против «депрессии». Польский почти не удваивает согласных в заимствованиях, и этот же случай был в KOLEKCJA против «коллекции», DYSKUSJA против «дискуссии», KLASA против «класса». Так что слово легко узнать и легко написать по русскому образцу неправильно." }
  - { kind: government, text: "Женский род на -JA, и класс этот ведёт себя единообразно. Родительный, дательный и местный единственного совпадают в форме DEPRESJI, и она же служит родительным множественного. Рядом существует старая форма родительного множественного на -YJ: DEPRESYJ, которая до середины двадцатого века была основной, а сегодня встречается в стилизации и в старых изданиях. Винительный на -Ę: LECZYĆ DEPRESJĘ. Творительный на -Ą: Z DEPRESJĄ. От чего страдают — предлог NA с местным: CIERPIEĆ NA DEPRESJĘ употребляется с винительным, а ZMAGAĆ SIĘ Z DEPRESJĄ — с творительным." }
  - { kind: pronunciation, text: "Читается «депре́сья», ударение на предпоследнем слоге из трёх. Сочетание SJ даёт «сь» с последующим «я», то есть звучит как русское «сья», а не «ся»: буква J здесь полноценный согласный. Одна S произносится коротко, без удвоения, и в этом слышна разница с русским словом. В родительном DEPRESJI конечное -JI читается «сьи» одним слогом: «депре́сьи». В старой форме DEPRESYJ слышно «депре́сый»." }
  - { kind: usage, text: "Частотные сочетания: CIERPIEĆ NA DEPRESJĘ «страдать депрессией», WPAŚĆ W DEPRESJĘ «впасть в депрессию», LECZYĆ DEPRESJĘ, DEPRESJA SEZONOWA, DEPRESJA POPORODOWA «послеродовая депрессия», DEPRESJA GOSPODARCZA. Прилагательное DEPRESYJNY значит «депрессивный» о состоянии и «депрессионный» о местности. Обратите внимание на предлоги: по-польски WPAŚĆ W DEPRESJĘ с винительным, как и русское «впасть в депрессию», но CIERPIEĆ NA DEPRESJĘ тоже с винительным, тогда как русский говорит «страдать депрессией», творительным." }
