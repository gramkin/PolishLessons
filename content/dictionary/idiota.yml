# review
id: idiota
format: 2
lemma: "idiota"
rank: 823
pos: noun
pron: { cyr: "идьо́та" }
senses:
  - id: idiot
    ru: "идиот, дурак"
    examples:
      - pl: "Idiota!"
        ru: "Идиот!"
        source: { kind: tatoeba, id: 5067784 }
      - pl: "Co za idiota!"
        ru: "Что за идиот!"
        source: { kind: translated, id: 8500309 }
      - pl: "Idiota."
        ru: "Идиот."
        source: { kind: translated, id: 12201976 }
  - id: predicate
    ru: "jesteś idiotą — «ты идиот» (творительный после być)"
    note: "После być имя сказуемого стоит в творительном падеже, как в русском «быть идиотом»."
    examples:
      - pl: "Dlaczego mój przyjaciel jest idiotą?"
        ru: "Почему мой друг идиот?"
        source: { kind: tatoeba, id: 3634369 }
      - pl: "Jesteś idiotą!"
        ru: "Ты идиот!"
        source: { kind: translated, id: 691891 }
      - pl: "Okazał się idiotą."
        ru: "Он оказался идиотом."
        source: { kind: authored }
  - id: vocative
    ru: "idioto! — звательная форма, «идиот!»"
    examples:
      - pl: "Ty idioto!"
        ru: "Ты, идиот!"
        source: { kind: translated, id: 699941 }
      - pl: "Tom, ty idioto!"
        ru: "Том, ты идиот!"
        source: { kind: translated, id: 6309151 }
      - pl: "Nie rób tego, idioto."
        ru: "Не делай этого, идиот."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово мужского рода, но склоняется по женскому образцу: idiota, idioty, idiocie, idiotę, idiotą — как kolega или zabójca. Во множественном числе мужское лицо: ci idioci." }
  - { kind: register, text: "Обычная разговорная брань, не грубее русского «идиот». В приличной речи её избегают, но печатать можно." }
  - { kind: government, text: "После być творительный падеж: jesteś idiotą «ты идиот», uważam go za idiotę «я считаю его идиотом» — тут винительный после za." }
  - { kind: usage, text: "Звательный падеж idioto! употребляется живо: Ty idioto! «Ты идиот!». В русском звательной формы нет, поэтому её легко забыть." }
collocations:
  - { pl: "ty idioto", ru: "ты идиот" }
  - { pl: "jesteś idiotą", ru: "ты идиот" }
  - { pl: "uważać za idiotę", ru: "считать идиотом" }
  - { pl: "robić z siebie idiotę", ru: "строить из себя идиота" }
family:
  - { pl: "idiotyczny", ru: "идиотский", relation: derived }
  - { pl: "idiotyzm", ru: "идиотизм", relation: derived }
etymology: "Через латинское idiota из греческого ἰδιώτης «частное лицо, неспециалист». Русское «идиот» пришло тем же путём, так что слова совпадают."
memory: "idiota — «идиот», значение то же, что в русском. Главное тут грамматика: слово мужского рода, а склоняется по женскому образцу — idiota, idioty, idiotę, idiotą, как kolega. И не забывайте звательный падеж: Ty idioto!"
idioms:
  - { pl: "ty idioto", ru: "ты идиот" }
  - { pl: "robić z siebie idiotę", ru: "строить из себя идиота" }
  - { pl: "pożyteczny idiota", ru: "полезный идиот" }
