        source: { kind: authored }
notes:
  - { kind: government, text: "ИЗБЕГАЮТ ЧЕГО — РОДИТЕЛЬНЫЙ, И РУССКИЙ УСТРОЕН ТАК ЖЕ. Uniknąć kary, uniknąć wypadku, uniknąć odpowiedzi — винительного у глагола нет вовсе. Русское «избежать наказания» просит того же падежа, так что переносится без поправки. Оборот nie do uniknięcia значит «неизбежный»." }
  - { kind: pronunciation, text: "ГЛАВНОЕ ЧЕРЕДОВАНИЕ ГЛАГОЛОВ НА -NĄĆ: Ą В МУЖСКОМ РОДЕ, Ę ВО ВСЕХ ОСТАЛЬНЫХ. Uniknął с ą, но uniknęła, uniknęło, uniknęli, uniknęły — с ę. Носовые читаются по-разному: ą перед ł звучит как «он», ę перед ł — как «э». Так же ведут себя zacząć, utknąć, krzyknąć." }
  - { kind: false-friend, text: "Корень -nik- тот же, что в zniknąć «исчезнуть» и niknąć «меркнуть, пропадать», а в русском он уцелел в «возникнуть», «проникнуть», «поникнуть». Глагола «уникнуть» в русском нет — там «избежать», — поэтому слово приходится запоминать, опираясь на родню: uniknąć это как бы «у-никнуть», уйти в сторону, пропасть из-под удара." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — unikać. Отсюда разделение труда: людей обычно unika się (unika mnie od tygodnia), а событий udaje się uniknąć. Существительное uniknięcie живёт почти только в обороте nie do uniknięcia. Одна форма причастия пропущена по грамматической причине и объяснена в карточке." }
collocations:
  - { pl: "uniknąć kary", ru: "избежать наказания" }
  - { pl: "nie do uniknięcia", ru: "неизбежный" }
  - { pl: "uniknąć odpowiedzi", ru: "уклониться от ответа" }
family:
  - { pl: "unikać", ru: "избегать", relation: aspect, id: unikac }
  - { pl: "zniknąć", ru: "исчезнуть", relation: root, id: zniknac }
  - { pl: "niknąć", ru: "меркнуть, пропадать", relation: root }
etymology: "Приставка u- плюс niknąć «исчезать, пропадать», из праславянского *niknǫti — того же корня, что русские «возникнуть», «проникнуть», «поникнуть» и «ник». Избежать значило исчезнуть из-под удара, уйти вниз и в сторону. Отсюда unikać, zniknąć, zanikać и unik «уклонение, финт»."
memory: "uniknąć — «избежать», и падеж тот же, что в русском: родительный, uniknąć kary. Корень -nik- как в zniknąć «исчезнуть» и в русских «возникнуть», «поникнуть». Чередование обязательное: uniknął с ą, но uniknęła с ę."
idioms:
  - { pl: "nie do uniknięcia", ru: "неизбежный" }
  - { pl: "uniknąć odpowiedzi", ru: "уклониться от ответа" }
formExamplesSkip:
  - { form: "uniknięci", reason: "Пропуск по грамматической причине. Uniknąć — глагол совершенного вида, и его родительное дополнение почти всегда называет СОБЫТИЕ: uniknąć kary, wypadku, śmierci, błędu. Страдательное причастие поэтому описывает предотвращённое событие — uniknięte straty, uniknięty wypadek, — а мужско-личная форма множественного числа означала бы «люди, которых удалось избежать». Людей избегают глаголом несовершенного вида unikać (unika mnie), и причастия от совершенного здесь не образуют. Немужско-личное uniknięte при этом совершенно обычно, особенно в технических текстах." }
