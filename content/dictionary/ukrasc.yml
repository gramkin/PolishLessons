        ru: "Кто-то, должно быть, украл твои часы."
        source: { kind: translated, id: 6305698 }
  - id: steal-from
    ru: "ukraść KOMUŚ coś — украсть у кого-л. (дательный!)"
    note: "Пострадавший идёт в дательный падеж без предлога."
    examples:
      - pl: "Ukradli mi zegarek."
        ru: "У меня украли часы."
        source: { kind: translated, id: 901310 }
      - pl: "Ukradli mu portfel."
        ru: "У него украли кошелёк."
        source: { kind: translated, id: 937245 }
      - pl: "Ukradziono mi zegarek."
        ru: "Мои часы были украдены."
        source: { kind: tatoeba, id: 351391 }
  - id: stolen
    ru: "ukradziony — украденный"
    examples:
      - pl: "Moja torba została ukradziona."
        ru: "Мою сумку украли."
        source: { kind: translated, id: 552185 }
      - pl: "Znaleźliśmy ukradzioną torebkę w tych krzakach."
        ru: "Мы нашли украденную сумку в этих кустах."
        source: { kind: tatoeba, id: 366091 }
      - pl: "Mój bagaż został ukradziony."
        ru: "Мой багаж украли."
        source: { kind: translated, id: 3757119 }
  - id: excuse
    ru: "Nie ukradłem, tylko pożyczyłem"
    examples:
      - pl: "Nie ukradłem tego, tylko pożyczyłem."
        ru: "Я это не украл, а одолжил."
        source: { kind: translated, id: 4438815 }
      - pl: "Nie ukradłam tego, tylko pożyczyłam."
        ru: "Я это не украла, а одолжила."
        source: { kind: translated, id: 4438817 }
      - pl: "Nie ukradłem tego. Po prostu pożyczyłem na stałe."
        ru: "Я это не украл. Просто одолжил навсегда."
        source: { kind: translated, id: 10776107 }
notes:
  - { kind: government, text: "Главное отличие от русского: пострадавший ставится в дательный падеж и без предлога. Ukradli MI zegarek значит «У меня украли часы», Ukradli MU portfel — «У него украли кошелёк». Русское «у меня» с родительным здесь не работает." }
  - { kind: usage, text: "Основы у прошедшего и будущего разные: прошедшее ukradł, ukradła, ukradli, а будущее — ukradnę, ukradniesz, ukradnie, ukradną." }
  - { kind: usage, text: "Страдательное причастие — ukradziony «украденный». Формы на ukradnięt- попадаются в небрежной речи, но нормой не являются." }
  - { kind: usage, text: "Существительное — kradzież «кража», а не отглагольное ukradzenie, которое практически не употребляется. Несовершенный вид — kraść." }
collocations:
  - { pl: "ukraść komuś coś", ru: "украсть у кого-либо что-либо" }
  - { pl: "zostać ukradzionym", ru: "быть украденным" }
  - { pl: "kradzież", ru: "кража" }
  - { pl: "złodziej", ru: "вор" }
family:
  - { pl: "kraść", ru: "красть", relation: aspect }
  - { pl: "kradzież", ru: "кража", relation: derived }
  - { pl: "złodziej", ru: "вор", relation: root }
  - { pl: "okraść", ru: "обокрасть", relation: root }
etymology: "u- + kraść, праславянское *krasti — то же слово, что русские «красть» и «кража»."
memory: "ukraść — «украсть», слово то же самое, но управление другое: пострадавший идёт в дательный падеж без предлога. Ukradli mi zegarek значит «У меня украли часы». И следите за основами: прошедшее ukradł, ukradła, ukradli, а будущее от другой — ukradnę, ukradniesz, ukradną. Существительное — kradzież «кража»."
