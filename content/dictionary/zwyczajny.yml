notes:
  - { kind: false-friend, text: "Русскому «обычный» по-польски отвечают ZWYKŁY и ZWYCZAJNY, и разница тонкая. ZWYKŁY — самое частое слово: ZWYKŁY DZIEŃ, ZWYKŁY CZŁOWIEK. ZWYCZAJNY чуть подчёркивает «ничем не примечательный» и звучит немного книжнее. В устойчивых сочетаниях выбор фиксирован: PROFESOR ZWYCZAJNY — «ординарный профессор», высшее звание." }
  - { kind: usage, text: "Полная парадигма: ZWYCZAJNY, ZWYCZAJNIEJSZY, NAJZWYCZAJNIEJSZY. Сравнительная степень редка, а превосходная частотна как усилитель: NAJZWYCZAJNIEJSZY W ŚWIECIE, «самый что ни на есть обыкновенный». Форма для мужчин-людей во всех трёх: ZWYCZAJNI, ZWYCZAJNIEJSI, NAJZWYCZAJNIEJSI." }
  - { kind: government, text: "Ставится перед существительным: ZWYCZAJNY DZIEŃ, ZWYCZAJNA RODZINA. После — в званиях и терминах: PROFESOR ZWYCZAJNY, CZŁONEK ZWYCZAJNY. Наречие ZWYCZAJNIE, «просто, обыкновенно», служит и усилителем: ZWYCZAJNIE ZAPOMNIAŁEM, «я просто забыл»." }
  - { kind: pronunciation, text: "Читается «звыча́йны», три слога, ударение на предпоследнем. ZW в начале звонкое, CZAJ — «чай». В ZWYCZAJNIEJSZY: «звычайне́йшы»." }
  - { kind: register, text: "Нейтральное слово, чуть книжнее, чем ZWYKŁY. В разговоре его часто используют как усилитель с оттенком «просто-напросто»: TO ZWYCZAJNY OSZUST, «это обыкновенный мошенник»." }
collocations:
  - { pl: "zwyczajny dzień", ru: "обычный день" }
  - { pl: "profesor zwyczajny", ru: "ординарный профессор" }
  - { pl: "zwyczajny człowiek", ru: "обычный человек" }
family:
  - { pl: "zwyczaj", ru: "обычай, привычка", relation: root, id: zwyczaj }
  - { pl: "zwykły", ru: "обычный", relation: root, id: zwykly }
  - { pl: "zwyczajnie", ru: "обыкновенно, просто", relation: derived, id: zwyczajnie }
etymology: "От ZWYCZAJ «обычай, привычка», а то от старого WYKNĄĆ «привыкнуть». Обычное — то, к чему привыкли. Русское «обычай» и «обычный» — из того же корня, только с приставкой «о-», а польский взял приставку Z-."
memory: "Zwyczajny — обычный, обыкновенный: zwyczajny dzień, zwyczajny człowiek. Najzwyczajniejszy — самый обыкновенный. Чаще говорят zwykły. Читается «звыча́йны»."
idioms:
