# review
id: gazeta
format: 2
lemma: "gazeta"
rank: 1077
pos: noun
pron: { cyr: "газэ́та" }
senses:
  - id: newspaper
    ru: "газета"
    examples:
      - pl: "Gdzie jest nasza gazeta?"
        ru: "Где наша газета?"
        source: { kind: tatoeba, id: 5974897 }
      - pl: "Czytam gazetę."
        ru: "Я читаю газету."
        source: { kind: tatoeba, id: 10584443 }
      - pl: "On czyta gazetę."
        ru: "Он читает газету."
        source: { kind: tatoeba, id: 3294990 }
  - id: press
    ru: "газета как источник новостей: w gazecie «в газете»"
    examples:
      - pl: "Przeczytałem o tym w gazecie."
        ru: "Я прочёл об этом в газете."
        source: { kind: tatoeba, id: 360084 }
      - pl: "Nie należy wierzyć we wszystko, co jest napisane w gazecie."
        ru: "Нельзя верить всему, что написано в газете."
        source: { kind: tatoeba, id: 4716818 }
  - id: buy
    ru: "покупать, выписывать газету"
    examples:
      - pl: "Prenumeruję dwie gazety."
        ru: "Я выписываю две газеты."
        source: { kind: translated, id: 3611728 }
      - pl: "Gazety sprzedawane są w kiosku."
        ru: "Газеты продаются в киоске."
        source: { kind: tatoeba, id: 2122242 }
notes:
  - { kind: usage, text: "Женский род, склоняется как kobieta: gazeta, gazety, gazecie, gazetę." }
  - { kind: usage, text: "w gazecie «в газете» — предложный падеж, ровно как в русском: Przeczytałem o tym w gazecie." }
  - { kind: false-friend, text: "Журнал — это не gazeta, а czasopismo или magazyn. А dziennik — ежедневная газета, и заодно «дневник»." }
  - { kind: usage, text: "prenumerować gazetę значит «выписывать газету» — слово из латыни, а не из русского «подписываться»." }
collocations:
  - { pl: "czytać gazetę", ru: "читать газету" }
  - { pl: "w gazecie", ru: "в газете" }
  - { pl: "dzisiejsza gazeta", ru: "сегодняшняя газета" }
  - { pl: "prenumerować gazetę", ru: "выписывать газету" }
family:
  - { pl: "gazetowy", ru: "газетный", relation: derived }
  - { pl: "gazetka", ru: "газетка, листовка", relation: derived }
  - { pl: "gazeciarz", ru: "газетчик, разносчик газет", relation: derived }
etymology: "Через французское gazette из венецианского gazeta — названия мелкой монеты, за которую в XVI веке в Венеции продавали листок новостей. Русская «газета» — то же слово."
memory: "gazeta — «газета», женский род, и предлог тот же, что в русском: w gazecie. А вот журнал — это не gazeta, а czasopismo; dziennik же значит и «ежедневная газета», и «дневник»."
idioms:
  - { pl: "pisać w gazecie", ru: "писать в газете" }
  - { pl: "dzisiejsza gazeta", ru: "сегодняшняя газета" }
formExamplesSkip:
  - { form: "gazeto", reason: "звательный падеж у этого слова в живой речи не употребляется" }
