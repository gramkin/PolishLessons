notes:
  - { kind: usage, text: "Дательный и местный — LIDZE, с переходом g в dz. Этим слово закрывает таблицу заднеязычных перед окончанием -e, которую словарь собирал по частям. Их три, и у каждого свой исход: k даёт c (klinika — KLINICE, działka — DZIAŁCE, stawka — STAWCE), g даёт dz (liga — LIDZE, noga — NODZE), ch даёт sz (mucha — MUSZE). Ни один заднеязычный перед -e не выживает, но и не превращается в то же самое, что сосед, так что помнить надо все три пары." }
  - { kind: usage, text: "Родительный множественного — LIG, голая основа без окончания, и гласная при этом не меняется. Сравните MÓD от MODA: там в такой же позиции o удлинилось и дало ó. Здесь удлинялось i, а долгое i следа в польском письме не оставило, как не оставили его долгие a и e. Поэтому у moda чередование видно, а у liga и wymiana нет — не потому, что правило другое, а потому, что от трёх долгих гласных из пяти в современной орфографии не осталось ничего." }
  - { kind: usage, text: "Переносное значение совпадает с русским полностью: TO INNA LIGA значит «это другая лига», то есть другой уровень, несравнимый класс. Говорят так и о людях, и о вещах, и о командах, причём без всякой связи со спортом. Отсюда и TO NIE MOJA LIGA — «это не мой уровень»." }
collocations:
  - { pl: "pierwsza liga", ru: "первая лига" }
  - { pl: "Liga Mistrzów", ru: "Лига чемпионов" }
  - { pl: "awansować do ligi", ru: "выйти в лигу" }
family:
