etymology: "Из латинского LIGA «связь», от ligare «связывать» — того же корня, что «лигатура» и «облигация». Сначала слово значило союз, объединение по договору, и в этом смысле пришло и в русский: Лига Наций. Спортивное значение выросло из того же союза — несколько клубов, связанных общими правилами. Русское «лига» заимствовано из того же источника, так что слова совпадают целиком."
memory: "Дательный и местный lidze: g даёт dz. Третий заднеязычный в ряду — k даёт c (klinice), g даёт dz (lidze), ch даёт sz (musze)."
idioms:
  - { pl: "to inna liga", ru: "это другой уровень" }
  - { pl: "Liga Mistrzów", ru: "Лига чемпионов" }
