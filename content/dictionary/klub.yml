# review
id: klub
format: 2
lemma: "klub"
rank: 769
pos: noun
pron: { cyr: "клуп" }
senses:
  - id: club
    ru: "клуб (организация, секция)"
    examples:
      - pl: "Założyli klub pływacki."
        ru: "Они основали клуб плавания."
        source: { kind: translated, id: 3257466 }
      - pl: "Wstąpił do klubu baseballowego."
        ru: "Он вступил в бейсбольный клуб."
        source: { kind: tatoeba, id: 997679 }
      - pl: "I on, i ja jesteśmy członkami tego klubu."
        ru: "И он, и я являемся членами этого клуба."
        source: { kind: tatoeba, id: 10768424 }
  - id: nightclub
    ru: "klub nocny — ночной клуб"
    examples:
      - pl: "Kiedy otwiera się klub?"
        ru: "Когда открывается клуб?"
        source: { kind: translated, id: 935373 }
      - pl: "Po swoim uwolnieniu, zaczął pracę w nocnych klubach."
        ru: "После освобождения он начал работать в ночных клубах."
        source: { kind: translated, id: 2250608 }
      - pl: "Ziri chodziła do klubów."
        ru: "Зири ходила по клубам."
        source: { kind: translated, id: 12068977 }
  - id: member
    ru: "należeć do klubu — состоять в клубе"
    examples:
      - pl: "Nie miałem pojęcia, że należysz do tego klubu."
        ru: "Я понятия не имел, что ты состоишь в этом клубе."
        source: { kind: tatoeba, id: 8658893 }
      - pl: "Widuję go czasami w klubie."
        ru: "Я иногда вижу его в клубе."
        source: { kind: tatoeba, id: 3764631 }
      - pl: "Należy do klubu szachowego."
        ru: "Он состоит в шахматном клубе."
        source: { kind: authored }
  - id: welcome
    ru: "Witaj w klubie! — Добро пожаловать в клуб!"
    note: "Ответ на чужую жалобу: я в том же положении."
    examples:
      - pl: "Witaj w klubie."
        ru: "Добро пожаловать в клуб."
        source: { kind: translated, id: 13654146 }
      - pl: "Też nie zdałeś? Witaj w klubie."
        ru: "Тоже не сдал? Добро пожаловать в клуб."
        source: { kind: authored }
      - pl: "Witaj w klubie, u mnie tak samo."
        ru: "Добро пожаловать в клуб, у меня так же."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "Конечное b оглушается, поэтому слово звучит «клуп», а не «клуб»." }
  - { kind: usage, text: "Значение шире русского: klub — это и спортивный клуб (klub piłkarski), и ночной (klub nocny), и кружок по интересам (klub szachowy), и парламентская фракция — klub poselski." }
  - { kind: government, text: "do klubu «в клуб» и należeć do klubu «состоять в клубе» — родительный падеж; w klubie «в клубе» — предложный." }
  - { kind: usage, text: "Witaj w klubie! значит «Добро пожаловать в клуб» в смысле «я в том же положении» — отвечают на чужую жалобу." }
collocations:
  - { pl: "klub nocny", ru: "ночной клуб" }
  - { pl: "klub piłkarski", ru: "футбольный клуб" }
  - { pl: "należeć do klubu", ru: "состоять в клубе" }
  - { pl: "klub poselski", ru: "парламентская фракция" }
family:
  - { pl: "klubowy", ru: "клубный", relation: derived }
  - { pl: "klubowicz", ru: "член клуба", relation: derived }
  - { pl: "stowarzyszenie", ru: "общество, объединение", relation: root }
etymology: "Из английского club — то же заимствование, что русский «клуб»."
memory: "klub — слово международное, но следите за произношением: конечное b оглушается, и слово звучит «клуп». Значение шире русского: это и спортивный клуб, и ночной, и кружок по интересам, и парламентская фракция — klub poselski. А Witaj w klubie! значит «Добро пожаловать в клуб» в смысле «я в том же положении»."
idioms:
