      - pl: "Nie trzeba być genialnym, żeby to zrozumieć."
        ru: "Не надо быть гениальным, чтобы это понять."
        source: { kind: authored }
  - id: brilliant-idea
    ru: "гениальный, блестящий (об идее)"
    examples:
      - pl: "To genialny pomysł."
        ru: "Это гениальная идея."
        source: { kind: authored }
      - pl: "Rozwiązanie genialne w swojej prostocie."
        ru: "Решение, гениальное в своей простоте."
        source: { kind: authored }
  - id: colloquial
    ru: "разг. отличный, классный"
    examples:
      - pl: "Genialna impreza, dawno się tak nie bawiłem."
        ru: "Отличная вечеринка, давно так не веселился."
        source: { kind: authored }
notes:
  - { kind: usage, text: "СУФФИКС -ALNY, И ОН ОТВЕЧАЕТ РУССКОМУ -АЛЬНЫЙ. Genialny, lokalny, normalny, realny, globalny — целый ряд латинских заимствований, где польское -alny соответствует русскому -альный один к одному. Выучив соответствие, вы получаете десятки слов разом. Следите только за ударением: в польском оно всегда на предпоследнем слоге, ge-NIAL-ny, lo-KAL-ny." }
  - { kind: false-friend, text: "Со значением всё просто: genialny это «гениальный», и путать нечего. Как и в русском, слово часто звучит с преувеличением — genialny pomysł, genialne! можно сказать и о неплохой выдумке. Существительное при нём geniusz «гений», мужского рода, склоняется как обычное мужское." }
  - { kind: pronunciation, text: "g перед e остаётся твёрдым, «гэ», а не «ге». Сочетание ni перед гласной читается мягко. Выходит «гэня́льны», ударение на предпоследнем слоге. В сравнительной степени оно уезжает дальше: ge-nial-NIEJ-szy, «гэняльне́йшы»." }
  - { kind: register, text: "Разговорное употребление очень широкое: genialne! говорят о чём угодно удачном, от шутки до погоды. В серьёзном тексте слово держат при настоящих достижениях, иначе оно обесценивается — ровно как русское «гениально!»." }
collocations:
  - { pl: "genialny pomysł", ru: "гениальная идея" }
  - { pl: "genialny w swojej prostocie", ru: "гениальный в своей простоте" }
  - { pl: "genialne rozwiązanie", ru: "гениальное решение" }
family:
  - { pl: "geniusz", ru: "гений", relation: root, id: geniusz }
  - { pl: "genialnie", ru: "гениально", relation: derived }
  - { pl: "genialność", ru: "гениальность", relation: derived }
etymology: "От geniusz, из латинского genius «дух-покровитель, врождённый дар», от gignere «рождать». В русский «гениальный» пришло тем же путём, через латынь и французский, поэтому слова совпадают полностью. Отсюда geniusz «гений», genialnie «гениально» и genialność."
memory: "genialny — «гениальный», учить тут нечего. Зато суффикс стоит запомнить навсегда: польское -alny это русское -альный, и из правила сразу выходят lokalny, normalny, realny, globalny. Ударение всегда на предпоследнем слоге: гэня́льны."
idioms:
