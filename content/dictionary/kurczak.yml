lemma: "kurczak"
rank: 1591
pos: noun
pron: { cyr: "ку́рчак" }
senses:
  - id: chicken-animal
    ru: "цыплёнок, курица (птица)"
    examples:
      - pl: "Kurczak był martwy."
        ru: "Цыплёнок был мёртв."
        source: { kind: translated, id: 8887554 }
      - pl: "Tom ma kurczaki."
        ru: "У Тома есть куры."
        source: { kind: translated, id: 4144981 }
      - pl: "Mój kurczak jest tutaj."
        ru: "Мой цыплёнок здесь."
        source: { kind: translated, id: 1348819 }
  - id: chicken-meat
    ru: "курица, курятина (мясо, блюдо)"
    examples:
      - pl: "Jem kurczaka."
        ru: "Я ем курицу."
        source: { kind: translated, id: 8756179 }
      - pl: "Poproszę kurczaka."
        ru: "Мне, пожалуйста, курицу."
        source: { kind: translated, id: 365119 }
      - pl: "Chciałbym rosół z kurczaka."
        ru: "Я хотел бы куриный бульон."
        source: { kind: translated, id: 959589 }
notes:
  - { kind: usage, text: "Одно слово и для птицы, и для мяса — как русское «курица»: Jem kurczaka «Я ем курицу», но Kurczak był martwy «Цыплёнок был мёртв»." }
  - { kind: government, text: "В винительном падеже одушевлённая форма: jem kurczaka, а не jem kurczak — мясо по-польски склоняется как живое существо." }
  - { kind: usage, text: "rosół z kurczaka — «куриный бульон», kanapka z kurczakiem — «бутерброд с курицей»." }
  - { kind: usage, text: "Взрослая птица — kura «курица», птенец — kurczę; kurczak между ними и покрывает оба." }
collocations:
  - { pl: "rosół z kurczaka", ru: "куриный бульон" }
  - { pl: "jeść kurczaka", ru: "есть курицу" }
  - { pl: "kanapka z kurczakiem", ru: "бутерброд с курицей" }
etymology: "От kura «курица» с уменьшительным суффиксом -czak. Русская «курица» и «кура» — то же праславянское гнездо, так что корень узнаётся сразу."
memory: "kurczak = и «цыплёнок» (птица), и «курица» (мясо), как в русском. Ловушка в падеже: jem kurczaka — винительный по одушевлённому типу, хотя речь о еде."
