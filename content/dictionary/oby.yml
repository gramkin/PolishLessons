# review
id: oby
format: 2
lemma: "oby"
rank: 1942
pos: part
pron: { cyr: "о́бы" }
senses:
  - id: wish
    ru: "пусть бы, хоть бы, дай бог (выражение надежды)"
    examples:
      - pl: "Oby tak było!"
        ru: "Хоть бы так и было!"
        source: { kind: translated, id: 8676545 }
      - pl: "Oby nie było wojny!"
        ru: "Лишь бы не было войны!"
        source: { kind: translated, id: 362827 }
      - pl: "Oby ci się udało!"
        ru: "Пусть у тебя получится!"
        source: { kind: translated, id: 12259376 }
      - pl: "Oby to nie była prawda."
        ru: "Хоть бы это не было правдой."
        source: { kind: translated, id: 12058197 }
      - pl: "Oby szczęście ci sprzyjało."
        ru: "Пусть тебе сопутствует счастье."
        source: { kind: translated, id: 2707367 }
      - pl: "Oby wróciła do kraju szczęśliwie."
        ru: "Пусть бы она благополучно вернулась на родину."
        source: { kind: translated, id: 516406 }
notes:
  - { kind: usage, text: "Частица выражает надежду или пожелание и требует прошедшей формы глагола: Oby nie było wojny «Лишь бы не было войны», буквально «пусть бы не было»." }
  - { kind: usage, text: "Устойчивое Oby tak dalej! значит «Так держать!», а Oby tak było! — «Хоть бы так и было!»." }
  - { kind: usage, text: "Рядом с карточками niech и żeby: niech вводит побуждение к третьему лицу (niech wejdzie «пусть войдёт»), żeby — придаточную цель, а oby — именно надежду говорящего." }
  - { kind: usage, text: "Слово неизменяемое: одна форма на все случаи." }
collocations:
  - { pl: "oby tak było", ru: "хоть бы так и было" }
  - { pl: "oby tak dalej", ru: "так держать" }
  - { pl: "oby nie", ru: "лишь бы нет" }
etymology: "Из o + by, той же условной частицы by, что в chciałbym и gdyby. Русское «дай бог» и «хоть бы» передают ту же мысль, но собраны из другого материала."
memory: "oby — «хоть бы, пусть бы», выражение надежды. После него глагол стоит в форме прошедшего времени: Oby nie było wojny. И запомните Oby tak dalej! «Так держать!»."
idioms:
  - { pl: "oby tak było", ru: "хоть бы так и было" }
  - { pl: "oby tak dalej", ru: "так держать" }
  - { pl: "oby ci się udało", ru: "пусть у тебя получится" }
