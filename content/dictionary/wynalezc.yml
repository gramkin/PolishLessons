# review
id: wynalezc
format: 2
lemma: "wynaleźć"
rank: 5222
pos: verb
pron: { cyr: "вына́лезьць" }
senses:
  - id: invent
    ru: "изобрести"
    examples:
      - pl: "Kto wynalazł telefon?"
        ru: "Кто изобрёл телефон?"
        source: { kind: authored }
      - pl: "Chińczycy wynaleźli papier."
        ru: "Китайцы изобрели бумагу."
        source: { kind: authored }
      - pl: "Chciałbym wynaleźć coś pożytecznego."
        ru: "Я хотел бы изобрести что-нибудь полезное."
        source: { kind: authored }
  - id: devise
    ru: "придумать, отыскать (способ, предлог)"
    examples:
      - pl: "Zawsze wynajdzie jakąś wymówkę."
        ru: "Он всегда найдёт какую-нибудь отговорку."
        source: { kind: authored }
      - pl: "Wynalazła sposób na oszczędzanie prądu."
        ru: "Она придумала способ экономить электричество."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "WYNALEŹĆ — «изобрести», а не просто «найти» (ZNALEŹĆ). Русское «выискать» близко лишь во втором значении: WYNALEŹĆ WYMÓWKĘ — «найти отговорку». Изобретение — WYNALAZEK, изобретатель — WYNALAZCA." }
  - { kind: usage, text: "Пятьдесят две формы. Будущее строится от основы WYNAJD-: WYNAJDĘ, WYNAJDZIESZ, WYNAJDĄ. Прошедшее — от WYNALAZ-/WYNALEŹ-: WYNALAZŁ, WYNALAZŁA, но WYNALEŹLI. Повелительное — WYNAJDŹ; редкие варианты WYNALEŹ в карточку не включены. Несовершенный вид — WYNAJDOWAĆ или WYNAJDYWAĆ." }
  - { kind: government, text: "Что — винительный: WYNALEŹĆ MASZYNĘ. В отрицании — родительный: NIKT NIE WYNALAZŁ LEKARSTWA. Способ для чего — SPOSÓB NA с винительным: SPOSÓB NA NUDĘ." }
  - { kind: pronunciation, text: "Читается «вына́лезьць»: ŹĆ — «зьць», ударение на предпоследнем слоге. В будущем — WYNAJDĘ «вына́йдэ», WYNAJDZIESZ «вына́йджеш»." }
  - { kind: register, text: "Нейтральное слово. Об изобретениях говорят в школе, прессе и науке; во втором значении («отыскать предлог») слово разговорное и чуть ироничное." }
collocations:
  - { pl: "wynaleźć lekarstwo na coś", ru: "изобрести лекарство от чего-то" }
  - { pl: "wynaleźć sposób", ru: "придумать способ" }
  - { pl: "wynaleźć wymówkę", ru: "найти отговорку" }
family:
  - { pl: "znaleźć", ru: "найти", relation: root, id: znalezc }
  - { pl: "wynalazek", ru: "изобретение", relation: derived }
  - { pl: "wynajdywać", ru: "изобретать, отыскивать", relation: aspect }
etymology: "Приставка WY- «вы-» плюс NALEŹĆ «найти», от того же корня, что ZNALEŹĆ и русское «найти». Буквально «вынайти» — найти то, чего ещё не было."
memory: "Wynaleźć — «вынайти» то, чего не было: изобрести. Wynalazek — изобретение, wynalazca — изобретатель. Будущее — wynajdę."
idioms:
  - { pl: "wynaleźć koło na nowo", ru: "изобретать велосипед (букв. «заново изобрести колесо»)" }
formExamplesSkip:
  - { form: "wynaleź", reason: "редкий вариант повелительного; основной — WYNAJDŹ" }
  - { form: "wynaleźmy", reason: "редкий вариант повелительного; основной — WYNAJDŹMY" }
  - { form: "wynaleźcie", reason: "редкий вариант повелительного; основной — WYNAJDŹCIE" }
  - { form: "wynalezieni", reason: "мужско-личная форма: изобретают вещи, а не людей" }
