# review
id: dobranoc
format: 2
lemma: "dobranoc"
rank: 651
pos: interj
pron: { cyr: "добра́ноц" }
senses:
  - id: goodnight
    ru: "спокойной ночи, доброй ночи (прощание перед сном)"
    note: "Только на прощание; вечером здороваются dobry wieczór."
    examples:
      - pl: "Dobranoc!"
        ru: "Доброй ночи!"
        source: { kind: tatoeba, id: 2277686 }
      - pl: "Dobranoc, mamo."
        ru: "Спокойной ночи, мама."
        source: { kind: tatoeba, id: 351928 }
      - pl: "Dobranoc, śpij dobrze."
        ru: "Спокойной ночи, спи хорошо."
        source: { kind: authored }
  - id: bedtime
    ru: "na dobranoc — на ночь"
    note: "bajka na dobranoc «сказка на ночь»."
    examples:
      - pl: "Babcia opowiadała mu bajki na dobranoc."
        ru: "Бабушка рассказывала ему сказки на ночь."
        source: { kind: tatoeba, id: 6156328 }
      - pl: "Dał jej całusa na dobranoc."
        ru: "Он поцеловал её на ночь."
        source: { kind: authored }
      - pl: "Czytam dzieciom bajkę na dobranoc."
        ru: "Я читаю детям сказку на ночь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Сращение из dobra noc «доброй ночи», застывшее в одно слово и пишущееся слитно." }
  - { kind: false-friend, text: "Время употребления не совпадает с русским. Dobranoc говорят только на прощание, перед сном. Встречая кого-то вечером, здороваются dobry wieczór — сказать при встрече dobranoc значит попрощаться." }
  - { kind: usage, text: "Устойчивый оборот na dobranoc «на ночь»: bajka na dobranoc «сказка на ночь», pocałunek na dobranoc «поцелуй на ночь»." }
  - { kind: usage, text: "Склоняемых форм у слова в живой речи нет: оно застыло как формула, хотя таблица и строит их механически." }
collocations:
  - { pl: "Dobranoc!", ru: "Спокойной ночи!" }
  - { pl: "bajka na dobranoc", ru: "сказка на ночь" }
  - { pl: "pocałunek na dobranoc", ru: "поцелуй на ночь" }
  - { pl: "dobry wieczór", ru: "добрый вечер" }
family:
  - { pl: "dobry", ru: "хороший", relation: root }
  - { pl: "noc", ru: "ночь", relation: root }
  - { pl: "dobry wieczór", ru: "добрый вечер", relation: derived }
etymology: "Сращение dobra + noc «добрая ночь» — ровно то же, что русское «доброй ночи», только поляки срастили оба слова в одно и пишут слитно."
memory: "dobranoc — «спокойной ночи», и это сросшееся dobra noc. Главное не перепутать время: dobranoc говорят на прощание, перед сном, а здороваются вечером словами dobry wieczór. Сказать dobranoc при встрече — значит попрощаться. И запомните оборот na dobranoc «на ночь»: bajka na dobranoc."
