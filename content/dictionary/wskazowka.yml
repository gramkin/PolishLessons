# review
id: wskazowka
format: 2
lemma: "wskazówka"
rank: 1921
pos: noun
pron: { cyr: "фсказу́фка" }
senses:
  - id: hint
    ru: "указание, подсказка, совет"
    examples:
      - pl: "Dał mi wskazówkę."
        ru: "Он дал мне подсказку."
        source: { kind: translated, id: 3191415 }
      - pl: "Szukać wskazówek."
        ru: "Искать подсказки."
        source: { kind: translated, id: 5900600 }
      - pl: "Studenci zignorowali te wskazówki."
        ru: "Студенты проигнорировали эти указания."
        source: { kind: translated, id: 734389 }
      - pl: "Wskazówki mojego nauczyciela zawsze mają sens."
        ru: "Указания моего преподавателя всегда разумны."
        source: { kind: translated, id: 951231 }
      - pl: "Policjant dał mi wskazówki, jak dotrzeć na stację."
        ru: "Полицейский объяснил мне, как добраться до вокзала."
        source: { kind: translated, id: 12455201 }
      - pl: "Zastosował się do wskazówek lekarza."
        ru: "Он следовал указаниям врача."
        source: { kind: translated, id: 3159957 }
  - id: clock-hand
    ru: "стрелка (часов, прибора)"
    examples:
      - pl: "Wskazówka zegara zatrzymała się."
        ru: "Стрелка часов остановилась."
        source: { kind: authored }
      - pl: "Mała wskazówka pokazuje godziny."
        ru: "Маленькая стрелка показывает часы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В корпусе это слово почти всегда значит «указание, подсказка», а не «стрелка»: dać wskazówkę «дать подсказку», stosować się do wskazówek «следовать указаниям»." }
  - { kind: usage, text: "Значение «стрелка часов» тоже живое и даёт оборот zgodnie z ruchem wskazówek zegara «по часовой стрелке»." }
  - { kind: usage, text: "Рядом с карточкой rada: rada — совет как мнение, wskazówka — конкретное указание, как поступить." }
collocations:
  - { pl: "dać wskazówkę", ru: "дать подсказку" }
  - { pl: "stosować się do wskazówek", ru: "следовать указаниям" }
  - { pl: "wskazówka zegara", ru: "стрелка часов" }
etymology: "От wskazać «указать», ws- + kazać. Русское «указание» построено от того же глагола «казать» с другой приставкой, поэтому родство слышно сразу."
memory: "wskazówka — чаще всего «подсказка, указание»: dać wskazówkę. И только во вторую очередь «стрелка часов» — отсюда zgodnie z ruchem wskazówek zegara «по часовой стрелке»."
idioms:
  - { pl: "dać wskazówkę", ru: "дать подсказку" }
  - { pl: "stosować się do wskazówek", ru: "следовать указаниям" }
  - { pl: "zgodnie z ruchem wskazówek zegara", ru: "по часовой стрелке" }
