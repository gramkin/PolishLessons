      - pl: "Klej trzyma nietrwale, lepiej użyj śrub."
        ru: "Клей держит непрочно, лучше используй шурупы."
        source: { kind: authored }
      - pl: "Ta farba nietrwale trzyma się metalu."
        ru: "Эта краска непрочно держится на металле."
        source: { kind: authored }
  - id: briefly
    ru: "недолго, недолговечно"
    note: "о действии, состоянии"
    examples:
      - pl: "Ten lek działa tylko nietrwale."
        ru: "Это лекарство действует лишь недолго."
        source: { kind: authored }
      - pl: "Pokój między sąsiadami utrzymał się nietrwale."
        ru: "Мир между соседями продержался недолго."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от NIETRWAŁY «непрочный, недолговечный». Противоположное — TRWALE «прочно, надолго». Корень тот же, что в TRWAĆ «длиться»: TRWAŁY — то, что долго держится." }
  - { kind: usage, text: "Степеней сравнения в словаре нет: вместо них говорят MNIEJ TRWALE «менее прочно»." }
  - { kind: pronunciation, text: "Читается «нетрва́ле»: W после звонкого R не оглушается, L перед гласной — «л». Ударение на TRWA." }
collocations:
