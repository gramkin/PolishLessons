id: nietrwale
format: 2
lemma: "nietrwale"
rank: 5858
pos: adv
pron: { cyr: "нетрва́ле" }
senses:
  - id: flimsily
    ru: "непрочно, ненадёжно"
    note: "о ремонте, соединении, краске"
    examples:
      - pl: "Dziury w asfalcie załatano tanio i nietrwale."
        ru: "Ямы в асфальте залатали дёшево и непрочно."
