# review
id: wyjawic
format: 2
lemma: "wyjawić"
rank: 2264
pos: verb
aspect: perf
pron: { cyr: "выя́виць" }
senses:
  - id: reveal
    ru: "раскрыть, выдать (тайну)"
    examples:
      - pl: "Nie wyjawił tajemnicy."
        ru: "Он не выдал тайны."
        source: { kind: translated, id: 520046 }
      - pl: "Wyjawiła mi tajemnicę."
        ru: "Она раскрыла мне тайну."
        source: { kind: translated, id: 1133596 }
      - pl: "Wyjawisz mi tę tajemnicę?"
        ru: "Ты раскроешь мне эту тайну?"
        source: { kind: translated, id: 352486 }
  - id: disclose
    ru: "открыть, сообщить (правду)"
    examples:
      - pl: "Kobieta, która wyjawiła mi prawdę została znaleziona martwa w swoim mieszkaniu."
        ru: "Женщину, открывшую мне правду, нашли мёртвой."
        source: { kind: translated, id: 3111313 }
      - pl: "Ona nie chciała wyjawić gdzie tak naprawdę to znalazła."
        ru: "Она не хотела открывать, где на самом деле это нашла."
        source: { kind: translated, id: 5169808 }
notes:
  - { kind: government, text: "Кому раскрывают — дательный падеж, что — винительный: wyjawić komuś tajemnicę." }
  - { kind: false-friend, text: "Корень jawny «явный», jawa «явь»; ср. русское «явный», «объявить». Буквально «сделать явным»." }
  - { kind: usage, text: "Почти всегда о тайне или секрете: wyjawić tajemnicę, wyjawić sekret." }
  - { kind: usage, text: "Несовершенный вид — wyjawiać." }
collocations:
  - { pl: "wyjawić tajemnicę", ru: "раскрыть тайну" }
  - { pl: "wyjawić sekret", ru: "выдать секрет" }
etymology: "wy- + jawny «явный», jawa «явь»; ср. русское «явный», «объявить», «наяву»."
memory: "wyjawić — «раскрыть тайну», буквально «сделать явным». Кому — дательный, что — винительный: wyjawić komuś tajemnicę. Несовершенный вид — wyjawiać."
idioms:
  - { pl: "wyjawić tajemnicę", ru: "раскрыть тайну" }
