notes:
  - { kind: pronunciation, text: "Главная трудность этого слова — в первом слоге. Польское AU читается как два гласных подряд, «ау», и слово звучит «аутостра́да», в четыре слога. Русское «автострада» произносится с «ав», то есть с согласным В, и привычка подставить его здесь очень сильна. То же правило работает во всех словах с AU: AUTOBUS это «аутобус», AUTOR — «а́утор», AUGUST — «а́угуст». Ударение, как всегда в польском, на предпоследнем слоге, то есть на STRA. В местном падеже AUTOSTRADZIE сочетание DZI даёт мягкое «дзи»: «аутостра́дзе»." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа D переходит в DZ: AUTOSTRADZIE, а не «autostradie». Это чередование работает у всех женских основ на D — WODA даёт WODZIE, PRAWDA даёт PRAWDZIE, ZAGRODA даёт ZAGRODZIE, — и стоит рядом с двумя другими того же рода: K переходит в C (MATKA и MATCE), G переходит в DZ (FLAGA и FLADZE). Иначе говоря, в DZ сходятся и D, и G, что для русского уха неожиданно. Родительный множественного — AUTOSTRAD, с нулевым окончанием. Форма AUTOSTRADY покрывает родительный единственного и именительный с винительным множественного." }
  - { kind: government, text: "Женский род. «На автостраде» — предлог NA с местным: NA AUTOSTRADZIE. «По автостраде» о движении — творительный без предлога: AUTOSTRADĄ DOJEDZIESZ, и это для русского непривычно, потому что по-русски нужен предлог «по». «Съехать с автострады» — Z с родительным: ZJECHAĆ Z AUTOSTRADY. Частотные сочетания: AUTOSTRADA PŁATNA «платная автострада», BRAMKI NA AUTOSTRADZIE «пункты оплаты». В польской классификации дорог AUTOSTRADA и DROGA EKSPRESOWA — две разные категории, и путать их не следует." }
  - { kind: false-friend, text: "Слово в обоих языках одно и то же, итальянское AUTOSTRADA, и оба языка сделали его женским, так что согласование совпадает: AUTOSTRADA PŁATNA и «платная автострада». Расходится употребительность. В польском AUTOSTRADA — основной официальный термин, он стоит в законах и на знаках. В русском «автострада» звучит несколько книжно, а в живой речи чаще скажут «трасса», «шоссе» или «автомагистраль». Поэтому при переводе с польского слово лучше передавать по контексту, а при переводе на польский помнить, что AUTOSTRADA означает именно дорогу высшей категории с разделёнными полосами, а не всякое шоссе." }
