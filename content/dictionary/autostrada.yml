etymology: "Из итальянского AUTOSTRADA, сложенного из AUTO «автомобиль» и STRADA «дорога», а STRADA — от латинского STRATA VIA «выстланный путь», от STERNERE «стелить». От того же латинского слова английское STREET и немецкое STRASSE, так что «автострада» буквально означает «автомобильная мостовая». Первая часть, AUTO, сокращена от греческого ΑΥΤΌΣ «сам» через AUTOMOBILE «самодвижущийся». Оба языка взяли слово в двадцатом веке, когда появились сами дороги такого типа, и оба сделали его женским по образцу своих слов на -A. Разница только в чтении начального AU: польский читает его двумя гласными, «ау», русский превратил в «ав». Это общее правило для всех заимствований с AU, и польский в нём последователен: AUTOBUS, AUTOR, AUDYCJA читаются через «ау»."
memory: "Читается «аутостра́да»: польское au — это «ау», два гласных, а не русское «ав». Так же autobus, autor, audycja. В дательном и местном d→dz: na autostradzie, как woda/wodzie и prawda/prawdzie; в dz сходятся и d, и g (flaga/fladze). Движение по автостраде передаётся творительным без предлога: autostradą dojedziesz. В польской классификации autostrada и droga ekspresowa — разные категории."
