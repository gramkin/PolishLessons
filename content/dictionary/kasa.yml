# review
id: kasa
format: 2
lemma: "kasa"
rank: 699
pos: noun
pron: { cyr: "ка́са" }
senses:
  - id: till
    ru: "касса (в магазине, театре)"
    note: "Нейтральное значение."
    examples:
      - pl: "Gdzie jest kasa?"
        ru: "Где касса?"
        source: { kind: translated, id: 8474123 }
      - pl: "Zapłać przy kasie."
        ru: "Заплати на кассе."
        source: { kind: translated, id: 6999282 }
      - pl: "Wszystkie pieniądze z kasy zostały ukradzione."
        ru: "Все деньги из кассы были украдены."
        source: { kind: translated, id: 1349073 }
  - id: money-slang
    ru: "деньги, бабки (разговорное)"
    note: "В нейтральной речи деньги — pieniądze."
    examples:
      - pl: "Serio, nie jestem aż taka głupia, żeby mu pożyczać kasę."
        ru: "Я не такая дура, чтобы одалживать ему деньги."
        source: { kind: tatoeba, id: 13785284 }
      - pl: "Masz kasę?"
        ru: "Деньги есть?"
        source: { kind: translated, id: 6309191 }
      - pl: "Straciliśmy kupę kasy."
        ru: "Мы потеряли кучу денег."
        source: { kind: translated, id: 7704802 }
notes:
  - { kind: register, text: "Второе значение разговорное: kasa значит «деньги, бабки». Masz kasę? «Бабки есть?», kupa kasy «куча денег». В нейтральной речи деньги — pieniądze, так что kasa в этом смысле стоит узнавать, но не обязательно употреблять." }
  - { kind: usage, text: "Первое значение вполне нейтральное: kasa «касса» в магазине или театре, zapłacić przy kasie «заплатить на кассе»." }
  - { kind: usage, text: "Чередование в дательном и предложном: kasa, но w kasie, przy kasie — s переходит в si." }
  - { kind: usage, text: "Родня: kasjer «кассир», kasować «компостировать, аннулировать», kasa fiskalna «кассовый аппарат»." }
collocations:
  - { pl: "przy kasie", ru: "на кассе" }
  - { pl: "kupa kasy", ru: "куча денег" }
  - { pl: "Masz kasę?", ru: "Деньги есть?" }
  - { pl: "kasjer", ru: "кассир" }
family:
  - { pl: "kasjer", ru: "кассир", relation: derived }
  - { pl: "kasować", ru: "аннулировать", relation: derived }
  - { pl: "pieniądze", ru: "деньги", relation: root }
etymology: "Из итальянского cassa «ящик, касса» через немецкий — то же заимствование, что и русская «касса». Разговорное значение «деньги» развилось уже на польской почве."
memory: "kasa работает на двух уровнях. Нейтрально это «касса»: Gdzie jest kasa?, zapłacić przy kasie. А в разговоре то же слово значит «деньги, бабки»: Masz kasę?, kupa kasy «куча денег». В нейтральной речи деньги — pieniądze, так что второе значение стоит узнавать, но не обязательно употреблять самому. И следите за чередованием: kasa, но przy kasie."
idioms:
  - { pl: "przy kasie", ru: "на кассе" }
  - { pl: "kupa kasy", ru: "куча денег" }
  - { pl: "Masz kasę?", ru: "Деньги есть?" }
formExamplesSkip:
  - { form: "kaso", reason: "звательный падеж неодушевлённого существительного: к кассе по-польски не обращаются, форма остаётся только в таблице" }
