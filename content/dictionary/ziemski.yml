notes:
  - { kind: false-friend, text: "От одного существительного ZIEMIA польский произвёл два прилагательных, и путать их легко. ZIEMSKI это «земной»: о планете Земля и о мирском, бренном. ZIEMNY это «земляной»: сделанный из земли или находящийся в ней. Отсюда ROBOTY ZIEMNE «земляные работы» и ORZESZKI ZIEMNE «арахис», буквально «земляные орешки». Русский различает их так же, «земной» и «земляной», поэтому соответствие точное, но на слух пара почти неразличима." }
  - { kind: usage, text: "Одиннадцать форм, основа на -SKI. Мужско-личная форма множественного числа ZIEMSCY, с переходом K в C, и она не пустая: ZIEMSCY WŁADCY «земные владыки», ZIEMSCY PANOWIE «земные господа» — обычные обороты в церковном и историческом языке. Степеней сравнения у слова нет: оно относительное. Прилагательные на -SKI в польском образуются от существительных так же свободно, как русские на -СКИЙ." }
  - { kind: government, text: "Прилагательное согласуется с существительным и в устойчивых сочетаниях обычно стоит после него: KULA ZIEMSKA «земной шар», RAJ ZIEMSKI «земной рай», ŻYWOT ZIEMSKI «земная жизнь». На земном шаре — предлог NA с местным падежом: NA KULI ZIEMSKIEJ. Отречься от чего-либо — WYRZEC SIĘ с родительным: WYRZEC SIĘ DÓBR ZIEMSKICH, и русский строит оборот точно так же." }
  - { kind: pronunciation, text: "Читается «зе́мски», три слога, ударение на первом. Сочетание ZIE даёт мягкое «зе», а не «зье» и не «же»: звук тот же, что в русском «земля». Конечное -SKI звучит «ски». В мужско-личной форме ZIEMSCY происходит смягчение и слышно «зе́мсцы», с «ц» вместо «к». В творительном единственного ZIEMSKĄ конечное Ą даёт «он»: «зе́мскон»." }
  - { kind: register, text: "Слово книжное и слегка торжественное. В научном языке оно о планете: KULA ZIEMSKA, ATMOSFERA ZIEMSKA, SKORUPA ZIEMSKA «земная кора». В церковном и литературном — о бренном: DOBRA ZIEMSKIE «земные блага», ŻYCIE ZIEMSKIE «земная жизнь», WŁADZA ZIEMSKA «земная власть» в противопоставлении духовной. В обычном разговоре его почти не услышишь, там говорят просто о ZIEMIA или о ŚWIAT." }
