etymology: "От ZIEMIA, от праславянского корня, давшего и русскую «землю». Слово общеславянское и очень старое, родственное латинскому HUMUS и греческому названию земли. Из того же гнезда вышло неожиданное ZIEMNIAK «картофель», буквально «земляк», то есть то, что растёт в земле: поляки назвали новый овощ по месту, где он прячется, а русский взял немецкое посредничество и получил «картофель». ZIEMIANIN же означает землевладельца, помещика, а не жителя планеты."
memory: "Одно слово ziemia, два прилагательных: ziemski «земной», о планете и о мирском, и ziemny «земляной», о том, что из земли или в земле. Отсюда orzeszki ziemne «арахис», буквально «земляные орешки». Мужско-личная форма ziemscy настоящая и живая: ziemscy władcy «земные владыки». Читается «зе́мски», zie даёт мягкое «зе», как в русской «земле», а ziemscy звучит «зе́мсцы»."
