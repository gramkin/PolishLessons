# review
id: szczegolnie
format: 2
lemma: "szczególnie"
rank: 1573
pos: adv
pron: { cyr: "шчегу́льне" }
senses:
  - id: especially
    ru: "особенно, в особенности"
    examples:
      - pl: "On szczególnie lubi pływanie."
        ru: "Он особенно любит плавание."
        source: { kind: translated, id: 742339 }
      - pl: "Lubię spacery, szczególnie rano."
        ru: "Я люблю прогулки, особенно утром."
        source: { kind: translated, id: 6030155 }
      - pl: "Wieczorem było szczególnie zimno."
        ru: "Вечером было особенно холодно."
        source: { kind: translated, id: 4730661 }
  - id: not-particularly
    ru: "особенно (в отрицании — «не особенно»)"
    examples:
      - pl: "On nie jest szczególnie skrupulatny."
        ru: "Он не особенно скрупулёзен."
        source: { kind: translated, id: 364915 }
      - pl: "Nie interesuję się tym jakoś szczególnie, ale coś kojarzę."
        ru: "Я специально этим не интересовался, но кое-что знаю."
        source: { kind: tatoeba, id: 13225507 }
      - pl: "Tom jest szczególnie ostrożny."
        ru: "Том особенно осторожен."
        source: { kind: translated, id: 6627170 }
notes:
  - { kind: usage, text: "Наречие от szczególny «особый». Синоним — zwłaszcza; szczególnie чаще усиливает признак, zwłaszcza выделяет из ряда." }
  - { kind: usage, text: "В отрицании nie szczególnie значит «не особенно, так себе»: Nie jest szczególnie skrupulatny «Он не особенно скрупулёзен»." }
  - { kind: usage, text: "Степени сравнения szczególniej и najszczególniej есть в парадигме, но в корпусе не встречаются — наречие почти не градуируется." }
  - { kind: usage, text: "Родственное существительное — szczegół «деталь, подробность»." }
collocations:
  - { pl: "szczególnie ważny", ru: "особенно важный" }
  - { pl: "nie szczególnie", ru: "не особенно" }
  - { pl: "nic szczególnego", ru: "ничего особенного" }
etymology: "От szczególny «особый», от szczegół «деталь» (корень тот же, что в część «часть»). Русское «особенно» построено от «особый», то есть «отдельный» — та же логика выделения из ряда."
memory: "szczególnie = «особенно». Пара к нему — zwłaszcza «в особенности». В отрицании nie szczególnie значит «не особенно, так себе». Родственное существительное — szczegół «деталь»."
idioms:
  - { pl: "szczególnie ważny", ru: "особенно важный" }
  - { pl: "nie szczególnie", ru: "не особенно" }
  - { pl: "nic szczególnego", ru: "ничего особенного" }
formExamplesSkip:
