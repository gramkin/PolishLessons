# review
id: dziwny
format: 2
lemma: "dziwny"
rank: 344
pos: adj
pron: { cyr: "дзи́вны" }
senses:
  - id: strange
    ru: "странный"
    examples:
      - pl: "Co za dziwna pogoda!"
        ru: "Какая странная погода!"
        source: { kind: tatoeba, id: 6309076 }
      - pl: "Czujesz jakiś dziwny zapach?"
        ru: "Чувствуешь какой-то странный запах?"
        source: { kind: tatoeba, id: 4717708 }
      - pl: "Ostatniej nocy miałam dziwny sen."
        ru: "Прошлой ночью мне приснился странный сон."
        source: { kind: tatoeba, id: 5920934 }
  - id: odd-things
    ru: "странно; странные вещи"
    examples:
      - pl: "Dziwne."
        ru: "Странно."
        source: { kind: tatoeba, id: 6160545 }
      - pl: "Działy się tam dziwne rzeczy."
        ru: "Там происходили странные вещи."
        source: { kind: tatoeba, id: 709413 }
      - pl: "Wszystko wydaje się takie dziwne."
        ru: "Всё кажется таким странным."
        source: { kind: tatoeba, id: 8664047 }
notes:
  - { kind: false-friend, text: "dziwny — «странный», хотя это то же слово, что русское «дивный». Русскому «дивный» отвечает wspaniały или cudowny." }
  - { kind: usage, text: "Dziwne. — частая односложная реакция «Странно.»; Nic dziwnego! — «Ничего удивительного!»" }
  - { kind: usage, text: "Степени: dziwny — dziwniejszy — najdziwniejszy. Глагол того же корня — dziwić się «удивляться»." }
collocations:
  - { pl: "dziwna sprawa", ru: "странное дело" }
  - { pl: "nic dziwnego", ru: "ничего удивительного" }
  - { pl: "dziwny sen", ru: "странный сон" }
  - { pl: "dziwne rzeczy", ru: "странные вещи" }
etymology: "Праславянское *divьnъ — то же слово, что русское «дивный»; в польском значение сместилось от «удивительный» к «странный»."
memory: "dziwny — «странный», хотя это то же слово, что русское «дивный». А Nic dziwnego! значит «Ничего удивительного!»."
idioms:
  - { pl: "nic dziwnego", ru: "ничего удивительного" }
  - { pl: "dziwna sprawa", ru: "странное дело" }
  - { pl: "prawda jest dziwniejsza od fikcji", ru: "правда страннее вымысла" }
