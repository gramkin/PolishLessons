notes:
  - { kind: usage, text: "Родительный единственного — ZYSKU, с окончанием -u, и та же форма служит предложным: w zysku. Дательный отдельный — ZYSKOWI. Это ровно та модель, что у soku: отвлечённые и несчитаемые понятия склоняются к -u, в отличие от centa и randa." }
  - { kind: false-friend, text: "Ближайший родственник в русском не «прибыль», а «сыск». Польское ZYSK и наши «иск», «сыск», «отыскать» выросли из одного праславянского *jьskati «искать»: то, что сыскано, у поляков стало прибылью, а у нас — розыском. Поэтому догадаться о значении по звучанию нельзя, зато разбор помогает запомнить." }
  - { kind: usage, text: "Глагол того же гнезда — ZYSKAĆ «приобрести, выиграть»: zyskać na czasie «выиграть время», zyskać przyjaciół «приобрести друзей». Он живее самого существительного и часто встречается там, где русский скажет «получить» или «обрести». Прилагательное ZYSKOWNY значит «прибыльный»." }
collocations:
  - { pl: "czysty zysk", ru: "чистая прибыль" }
  - { pl: "sprzedać z zyskiem", ru: "продать с прибылью" }
  - { pl: "zysk netto", ru: "чистая прибыль" }
family:
  - { pl: "zyskać", ru: "приобрести, выиграть", relation: root }
  - { pl: "zyskowny", ru: "прибыльный", relation: derived }
  - { pl: "strata", ru: "убыток, потеря", relation: antonym, id: strata }
etymology: "Из праславянского *zyskъ, производного от *jьskati «искать» — того же корня, что русские «искать», «иск», «сыск», «отыскать». Исходно это было «то, что отыскано, добыто», и польский увёл слово к денежной прибыли, а русский к поиску и судебному требованию. Отсюда и глагол zyskać «приобрести»."
memory: "zysk — «прибыль», и родня ему в русском не «прибыль», а «сыск»: оба от «искать». Родительный с -u: bez zysku, та же форма и в предложном."
idioms:
  - { pl: "z zyskiem", ru: "с прибылью, с выгодой" }
  - { pl: "zysk netto", ru: "чистая прибыль" }
