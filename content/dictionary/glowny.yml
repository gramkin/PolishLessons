# review
id: glowny
format: 2
lemma: "główny"
rank: 737
pos: adj
pron: { cyr: "гу́увны" }
senses:
  - id: main
    ru: "главный, основной"
    examples:
      - pl: "Kukurydza to główny składnik tej sałatki."
        ru: "Кукуруза — это главный ингредиент этого салата."
        source: { kind: tatoeba, id: 10828533 }
      - pl: "To twój główny problem."
        ru: "Это твоя главная проблема."
        source: { kind: translated, id: 626598 }
      - pl: "To jest nasz główny cel."
        ru: "Это наша главная цель."
        source: { kind: translated, id: 1006968 }
  - id: entrance
    ru: "główne drzwi, główna ulica — главный вход, главная улица"
    examples:
      - pl: "Tomek wszedł do domu przez główne drzwi."
        ru: "Том вошёл в дом через главный вход."
        source: { kind: translated, id: 3479810 }
      - pl: "To jest główna ulica miasta."
        ru: "Это главная улица города."
        source: { kind: translated, id: 8913747 }
      - pl: "Samochód podjechał pod główną bramę."
        ru: "Машина подъехала к главным воротам."
        source: { kind: translated, id: 909155 }
  - id: role
    ru: "główna rola, główna nagroda — главная роль, главный приз"
    examples:
      - pl: "Moja siostra zagrała główną rolę."
        ru: "Моя сестра сыграла главную роль."
        source: { kind: translated, id: 921387 }
      - pl: "Wygrała główną nagrodę w wyścigu."
        ru: "Она выиграла главный приз в гонке."
        source: { kind: translated, id: 525368 }
      - pl: "Mamy dzisiaj rybę jako główne danie."
        ru: "Сегодня у нас рыба на основное блюдо."
        source: { kind: translated, id: 640424 }
  - id: fixed
    ru: "в устойчивых сочетаниях: strona główna, płyta główna"
    note: "Эти сочетания учат целиком."
    examples:
      - pl: "Wróć do strony głównej."
        ru: "Вернись на главную страницу."
        source: { kind: translated, id: 1348464 }
      - pl: "Przyszła moja płyta główna."
        ru: "Пришла моя материнская плата."
        source: { kind: translated, id: 12715659 }
      - pl: "Dworzec Główny jest w centrum miasta."
        ru: "Главный вокзал в центре города."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Степеней сравнения нет: główniejszy или najgłówniejszy не говорят. Что-то либо главное, либо нет — это относительное прилагательное, как русское «главный»." }
  - { kind: usage, text: "Сочетания, которые стоит выучить целиком: Dworzec Główny «Главный вокзал», strona główna «главная страница», płyta główna «материнская плата», danie główne «основное блюдо», główna rola «главная роль»." }
  - { kind: usage, text: "w głównej mierze — «главным образом, по большей части»." }
  - { kind: usage, text: "Слово от głowa «голова», то есть буквально «головной». Русское «главный» от «глава» собрано точно так же." }
collocations:
  - { pl: "strona główna", ru: "главная страница" }
  - { pl: "Dworzec Główny", ru: "Главный вокзал" }
  - { pl: "danie główne", ru: "основное блюдо" }
  - { pl: "w głównej mierze", ru: "главным образом" }
family:
  - { pl: "głowa", ru: "голова", relation: root }
  - { pl: "głównie", ru: "главным образом", relation: derived }
  - { pl: "naczelny", ru: "верховный, главный", relation: root }
etymology: "От głowa «голова» — буквально «головной, стоящий во главе». Русское «главный» от «глава» собрано ровно так же."
memory: "główny от głowa «голова», как русское «главный» от «глава». Степеней сравнения у него нет: główniejszy сказать нельзя — главное не бывает «более главным». Запоминать проще готовыми сочетаниями: Dworzec Główny, strona główna, płyta główna «материнская плата», danie główne «основное блюдо»."
idioms:
  - { pl: "siedem grzechów głównych", ru: "семь смертных грехов" }
  - { pl: "strona główna", ru: "главная страница" }
  - { pl: "w głównej mierze", ru: "главным образом" }
