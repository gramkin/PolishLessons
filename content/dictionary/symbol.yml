# review
id: symbol
format: 2
lemma: "symbol"
rank: 2531
pos: noun
pron: { cyr: "сы́мболь" }
senses:
  - id: symbol
    ru: "символ, знак"
    examples:
      - pl: "Orzeł jest symbolem Polski."
        ru: "Орёл — символ Польши."
        source: { kind: authored }
      - pl: "Ten znak to symbol pokoju."
        ru: "Этот знак — символ мира."
        source: { kind: authored }
  - id: character
    ru: "символ (знак в тексте, формуле)"
    examples:
      - pl: "Hasło musi mieć osiem symboli."
        ru: "Пароль должен иметь восемь символов."
        source: { kind: authored }
      - pl: "W tabeli użyto dziwnych symboli."
        ru: "В таблице использовали странные символы."
        source: { kind: authored }
  - id: emblem
    ru: "символ (образ, воплощение)"
    examples:
      - pl: "Stał się symbolem oporu."
        ru: "Он стал символом сопротивления."
        source: { kind: authored }
notes:
  - { kind: usage, text: "РОДИТЕЛЬНЫЙ МНОЖЕСТВЕННОГО ДВОЙНОЙ: SYMBOLI и SYMBOLÓW, обе формы правильны. Так же ведут себя płaszcz (płaszczy и płaszczów), model (modeli и modelów) и garaż (garaży и garażów). Это общее свойство основ на мягкий или шипящий согласный, и выбирать можно свободно." }
  - { kind: false-friend, text: "Слово совпадает с русским «символом» в обоих смыслах — и знак, и воплощение, — но есть одна разница. По-польски symbol значит ещё и знак в наборе текста: hasło na osiem symboli «пароль из восьми символов». Русский в этом случае скажет «символов» тоже, так что совпадение полное; подвоха тут нет, только двойной родительный." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SYM-bol. Y читается как русское ы, конечное l мягкое: «сы́мболь». Предложный symbolu звучит «сы́мболю»." }
collocations:
  - { pl: "symbol pokoju", ru: "символ мира" }
  - { pl: "stać się symbolem", ru: "стать символом" }
  - { pl: "symbol narodowy", ru: "национальный символ" }
family:
  - { pl: "symboliczny", ru: "символический", relation: derived }
  - { pl: "znak", ru: "знак", relation: root, id: znak }
  - { pl: "godło", ru: "герб", relation: root }
etymology: "Из греческого symbolon «опознавательный знак», от syn- «вместе» и ballein «бросать»: знак, по которому сходятся две половины. То же слово дало русский «символ». Корень ballein виден в «баллистике» и «проблеме»."
memory: "symbol — «символ», и значения совпадают с русскими. Главное запомнить двойной родительный множественного: symboli и symbolów, обе формы верны, как у modeli и modelów."
idioms:
  - { pl: "symbol narodowy", ru: "национальный символ" }
  - { pl: "stać się symbolem epoki", ru: "стать символом эпохи" }
