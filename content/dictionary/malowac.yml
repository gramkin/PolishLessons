etymology: "Из немецкого MALEN «красить, писать картину», от средневерхненемецкого mālen, связанного с mal «пятно, знак». Слово пришло вместе с ремеслом и дало по-польски целое гнездо: malarz «художник», malarstwo «живопись», malowanie «покраска». Русский в этом значении немецкого слова не взял и обошёлся своими — «красить», «писать», «рисовать», — но знает его в просторечном «малевать», которое попало через польский и сохранило пренебрежительный оттенок."
memory: "Шестьдесят три формы — полный набор: несовершенный и переходный, оба причастия плюс malując. Основа меняется: malować, но maluję, maluj — как pracować, pracuję."
