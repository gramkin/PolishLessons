notes:
  - { kind: usage, text: "Шестьдесят три формы — это полный набор, какой польский глагол вообще может иметь, и он достаётся несовершенным переходным. К общему ядру из сорока одной формы прибавляются сразу три вещи: страдательное причастие (MALOWANY, одиннадцать форм), действительное причастие (MALUJĄCY, десять форм) и деепричастие MALUJĄC. Этим слово занимает последнюю клетку таблицы, разобранной в карточке PRZYŁĄCZYĆ: сорок две формы у совершенного непереходного, пятьдесят две у несовершенного непереходного, пятьдесят три у совершенного переходного и шестьдесят три здесь." }
  - { kind: usage, text: "Разница в один между причастиями видна прямо в списке форм. У страдательного мужская личная форма множественного своя — MALOWANI, — поэтому форм одиннадцать. У действительного той же формой служит MALUJĄCY, который одновременно и именительный единственного мужского, так что отдельной формы нет и остаётся десять. Это не особенность слова, а устройство двух причастий, и считать по нему можно любой глагол." }
  - { kind: pronunciation, text: "Основа инфинитива и основа настоящего времени у этого глагола разные, и мена предсказуемая: -OWA- переходит в -UJ-. MALOWAĆ даёт MALUJĘ, MALUJESZ, MALUJE и повелительное MALUJ. Так ведут себя все глаголы на -ować, а их в языке сотни: PRACOWAĆ даёт pracuję, KUPOWAĆ — kupuję, DZIĘKOWAĆ — dziękuję, BUDOWAĆ — buduję. Русскому это знакомо: «рисовать» даёт «рисую», «требовать» — «требую», то есть -овать переходит в -ую точно так же." }
  - { kind: usage, text: "Русский делит это поле на три глагола, польский обходится одним с добавкой. MALOWAĆ значит и «красить» (malować ściany, malować płot), и «писать красками» (malować obraz, malować portrety), и «красить» в смысле косметики (malować usta, malować paznokcie). А вот рисование карандашом — это уже другое слово, RYSOWAĆ. Запоминать стоит границу: всё, что делается краской, — malować, всё, что грифелем или ручкой, — rysować." }
collocations:
