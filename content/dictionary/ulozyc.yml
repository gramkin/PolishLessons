# review
id: ulozyc
format: 2
lemma: "ułożyć"
rank: 2256
pos: verb
aspect: perf
pron: { cyr: "уу́жыць" }
senses:
  - id: arrange
    ru: "уложить, разложить, составить"
    examples:
      - pl: "Ułóż krzyż z dwóch kijków."
        ru: "Сложи крест из двух палок."
        source: { kind: translated, id: 760325 }
      - pl: "Pokrój pomidory w plasterki i ułóż je ładnie na talerzu."
        ru: "Нарежь помидоры ломтиками и красиво разложи их на тарелке."
        source: { kind: translated, id: 4768659 }
      - pl: "Tom potrafi ułożyć kostkę Rubika w mniej niż 30 sekund."
        ru: "Том умеет собрать кубик Рубика меньше чем за тридцать секунд."
        source: { kind: translated, id: 12922057 }
  - id: work-out
    ru: "сложиться, наладиться (ułożyć się)"
    examples:
      - pl: "Wkrótce się ułoży."
        ru: "Скоро всё наладится."
        source: { kind: translated, id: 1611378 }
      - pl: "Samo się ułoży."
        ru: "Само наладится."
        source: { kind: translated, id: 13575980 }
notes:
  - { kind: government, text: "Винительный падеж: ułożyć włosy «уложить волосы», ułożyć plan «составить план»." }
  - { kind: usage, text: "С się значит «сложиться, наладиться» о делах: wszystko się ułoży «всё наладится» — очень частая утешительная формула." }
  - { kind: false-friend, text: "Корень łożyć/leżeć «класть, лежать»; ср. русское «уложить», «положить»." }
  - { kind: usage, text: "Несовершенный вид — układać. Отсюда układ «расположение, система, договор»." }
collocations:
  - { pl: "ułożyć włosy", ru: "уложить волосы" }
  - { pl: "wszystko się ułoży", ru: "всё наладится" }
etymology: "u- + łożyć «класть», от leżeć «лежать»; ср. русское «уложить», «положить»."
memory: "ułożyć — «уложить, составить», а с się «сложиться, наладиться». Запомните утешительное wszystko się ułoży «всё наладится». Несовершенный вид — układać."
idioms:
  - { pl: "ułożyć włosy", ru: "уложить волосы" }
  - { pl: "wszystko się ułoży", ru: "всё наладится" }
