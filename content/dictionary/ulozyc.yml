formExamples:
  - form: "ułożenia"
    pl: "Z ułożenia ran na ciele, policja wywnioskowała, że napastnik był leworęczny."
    ru: "По расположению ран на теле полиция заключила, что нападавший был левшой."
    source: { kind: translated, id: 10599145 }
  - form: "ułożenia"
    pl: "Zależy to od ułożenia kamieni."
    ru: "Это зависит от расположения камней."
    source: { kind: authored }
  - form: "ułożenia"
    pl: "Nie znam ułożenia tych mebli."
    ru: "Я не знаю расположения этой мебели."
    source: { kind: authored }
  - form: "ułoży"
    pl: "Wkrótce się ułoży."
    ru: "Скоро всё наладится."
    source: { kind: translated, id: 1611378 }
  - form: "ułoży"
    pl: "Samo się ułoży."
    ru: "Само наладится."
    source: { kind: translated, id: 13575980 }
  - form: "ułoży"
    pl: "A jeśli nam się nie ułoży?"
    ru: "А если у нас не сложится?"
    source: { kind: translated, id: 6773412 }
  - form: "ułożyć"
    pl: "Muszę ułożyć włosy."
    ru: "Мне нужно уложить волосы."
    source: { kind: translated, id: 6402909 }
  - form: "ułożyć"
    pl: "Layla nie ma czasu ułożyć włosów."
    ru: "У Лейлы нет времени уложить волосы."
    source: { kind: translated, id: 12360000 }
  - form: "ułożyć"
    pl: "Tom potrafi ułożyć kostkę Rubika w mniej niż 30 sekund."
    ru: "Том умеет собрать кубик Рубика меньше чем за тридцать секунд."
    source: { kind: translated, id: 12922057 }
  - form: "ułożył"
    pl: "Mały kociak ułożył się do snu na jej kolanach."
    ru: "Котёнок улёгся спать у неё на коленях."
    source: { kind: translated, id: 12886429 }
  - form: "ułożył"
    pl: "Ułożył książki na półce."
    ru: "Он разложил книги на полке."
    source: { kind: authored }
  - form: "ułożył"
    pl: "Ułożył plan na cały tydzień."
    ru: "Он составил план на всю неделю."
    source: { kind: authored }
  - form: "ułożyła"
    pl: "Ułożyła sobie włosy na imprezę."
    ru: "Она уложила волосы к вечеринке."
    source: { kind: translated, id: 521296 }
  - form: "ułożyła"
    pl: "Ułożyła dziecko do snu."
    ru: "Она уложила ребёнка спать."
    source: { kind: authored }
  - form: "ułożyła"
    pl: "Ułożyła kwiaty w wazonie."
    ru: "Она уложила цветы в вазу."
    source: { kind: authored }
  - form: "ułożyło"
    pl: "Wszystko ułożyło się pomyślnie i zdała egzamin."
    ru: "Всё сложилось удачно, и она сдала экзамен."
    source: { kind: translated, id: 639838 }
  - form: "ułożyło"
    pl: "Wszystko ułożyło się samo."
    ru: "Всё сложилось само."
    source: { kind: authored }
  - form: "ułożyło"
    pl: "Nic się nie ułożyło po naszej myśli."
    ru: "Ничего не сложилось по-нашему."
    source: { kind: authored }
  - form: "ułóż"
    pl: "Ułóż krzyż z dwóch kijków."
    ru: "Сложи крест из двух палок."
    source: { kind: translated, id: 760325 }
  - form: "ułóż"
    pl: "Ułóż narty w kształcie odwróconego \"V\"."
    ru: "Сложи лыжи в форме перевёрнутой буквы «V»."
    source: { kind: translated, id: 2246778 }
  - form: "ułóż"
    pl: "Pokrój pomidory w plasterki i ułóż je ładnie na talerzu."
    ru: "Нарежь помидоры ломтиками и красиво разложи их на тарелке."
    source: { kind: translated, id: 4768659 }
