# review
id: tysiac
format: 2
lemma: "tysiąc"
rank: 640
pos: noun
pron: { cyr: "ты́сёнц" }
senses:
  - id: thousand
    ru: "тысяча"
    note: "После tysiąc — родительный множественного: tysiąc złotych."
    examples:
      - pl: "Daj mi tysiąc pocałunków."
        ru: "Дай мне тысячу поцелуев."
        source: { kind: tatoeba, id: 12748825 }
      - pl: "Razem tysiąc pięćset czterdzieści dwa juany. Przelicz."
        ru: "Итого тысяча пятьсот сорок два юаня. Пересчитай."
        source: { kind: translated, id: 659686 }
      - pl: "Tysiąc Jenów wystarczy?"
        ru: "Тысячи иен хватит?"
        source: { kind: translated, id: 1829540 }
  - id: thousands
    ru: "tysiące — тысячи"
    note: "Родительный множественного — tysięcy."
    examples:
      - pl: "Tysiące ludzi ucieka przed wojną."
        ru: "Тысячи людей бегут от войны."
        source: { kind: tatoeba, id: 13264472 }
      - pl: "Ma dwa tysiące książek."
        ru: "У неё есть две тысячи книг."
        source: { kind: tatoeba, id: 3479798 }
      - pl: "Zapłaciłem za ten samochód szesnaście tysięcy złotych."
        ru: "Я заплатил за эту машину шестнадцать тысяч злотых."
        source: { kind: tatoeba, id: 6119529 }
  - id: in-dates
    ru: "в датах: w tysiąc dziewięćset... roku"
    note: "Поляк проговаривает дату полностью, как и русский."
    examples:
      - pl: "Pojawił się na świecie w tysiąc dziewięćset sześćdziesiątym roku."
        ru: "Он появился на свет в одна тысяча девятьсот шестидесятом году."
        source: { kind: tatoeba, id: 6018074 }
      - pl: "Gdzie wy byliście w dwa tysiące trzecim roku?"
        ru: "Где вы были в две тысячи третьем году?"
        source: { kind: tatoeba, id: 3457079 }
      - pl: "Urodził się w tysiąc dziewięćset osiemdziesiątym roku."
        ru: "Он родился в тысяча девятьсот восьмидесятом году."
        source: { kind: authored }
notes:
  - { kind: government, text: "После tysiąc существительное стоит в родительном множественного: tysiąc złotych, tysiąc ludzi — как русское «тысяча злотых»." }
  - { kind: usage, text: "В отличие от русского, польское слово ведёт себя как обычное существительное мужского рода и склоняется полностью: tysiąca, tysiącowi, tysiącem, tysiącu." }
  - { kind: usage, text: "В датах проговаривается целиком: w tysiąc dziewięćset sześćdziesiątym roku «в тысяча девятьсот шестидесятом году»." }
  - { kind: usage, text: "Множественное tysiące тянет родительный tysięcy: kilka tysięcy złotych «несколько тысяч злотых»." }
collocations:
  - { pl: "tysiąc złotych", ru: "тысяча злотых" }
  - { pl: "tysiące ludzi", ru: "тысячи людей" }
  - { pl: "kilka tysięcy", ru: "несколько тысяч" }
  - { pl: "tysiąc razy", ru: "тысячу раз" }
family:
  - { pl: "tysięczny", ru: "тысячный", relation: derived }
  - { pl: "tysiąclecie", ru: "тысячелетие", relation: derived }
  - { pl: "setka", ru: "сотня", relation: root }
etymology: "Праславянское *tysǫtja — то же слово, что русское «тысяча». Польское ą стоит там, где русский носовой дал «я»."
memory: "tysiąc — «тысяча», и управление то же: tysiąc złotych, родительный множественного. Разница в том, что польское слово — обычное существительное мужского рода и склоняется полностью: tysiąca, tysiącem, tysiącu, тогда как русское «тысяча» женского рода. Во множественном родительный — tysięcy: kilka tysięcy złotych. А даты поляк проговаривает целиком: w tysiąc dziewięćset sześćdziesiątym roku."
idioms:
  - { pl: "tysiąc złotych", ru: "тысяча злотых" }
  - { pl: "tysiące ludzi", ru: "тысячи людей" }
  - { pl: "tysiąc razy", ru: "тысячу раз" }
