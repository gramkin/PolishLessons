# review
id: kumpel
format: 2
lemma: "kumpel"
rank: 815
pos: noun
pron: { cyr: "ку́мпэль" }
senses:
  - id: mate
    ru: "приятель, друг (разговорное)"
    examples:
      - pl: "Mój kumpel przeprawił swoją legitymację tak, żeby wyglądał na niej na osiemnastolatka."
        ru: "Мой приятель подделал удостоверение, чтобы на нём выглядеть восемнадцатилетним."
        source: { kind: translated, id: 1474268 }
      - pl: "Idąc wzdłuż ulicy spotkałem starego kumpla."
        ru: "Идя по улице, я встретил старого приятеля."
        source: { kind: translated, id: 9678546 }
      - pl: "Widziałam tam mego kumpla, pijącego wino."
        ru: "Я видела там моего приятеля, пившего вино."
        source: { kind: translated, id: 6320331 }
  - id: with-mate
    ru: "z kumplem — с приятелем (творительный)"
    examples:
      - pl: "Spotkałem się z twoim kumplem."
        ru: "Я встретился с твоим приятелем."
        source: { kind: translated, id: 13561612 }
      - pl: "Właśnie rozmawiam z kumplem przez telefon."
        ru: "Я как раз говорю с приятелем по телефону."
        source: { kind: translated, id: 8178420 }
      - pl: "Chodźmy się zobaczyć z kilkoma moimi kumplami."
        ru: "Пойдём повидаемся с парой моих приятелей."
        source: { kind: translated, id: 12476402 }
  - id: mates
    ru: "kumple — приятели"
    examples:
      - pl: "Rozmawiali ze sobą jak starzy kumple."
        ru: "Они разговаривали между собой как старые приятели."
        source: { kind: translated, id: 12317358 }
      - pl: "Sami i Layla nie są już kumplami."
        ru: "Сами и Лейла больше не приятели."
        source: { kind: translated, id: 13341687 }
      - pl: "Moi kumple czekają na dole."
        ru: "Мои приятели ждут внизу."
        source: { kind: authored }
  - id: register
    ru: "разговорное, но не грубое"
    note: "Нейтральный вариант — kolega."
    examples:
      - pl: "To mój kumpel z pracy."
        ru: "Это мой приятель с работы."
        source: { kind: authored }
      - pl: "Jesteśmy kumplami od dziecka."
        ru: "Мы приятели с детства."
        source: { kind: authored }
      - pl: "Zadzwonię do kumpla."
        ru: "Я позвоню приятелю."
        source: { kind: authored }
notes:
  - { kind: register, text: "Слово разговорное, но вполне приличное: kumpel — это «приятель, кореш» без всякой грубости. Нейтральный вариант — kolega, а przyjaciel значит «друг» в сильном смысле, куда ближе, чем kumpel." }
  - { kind: usage, text: "Пришло из немецкого Kumpel «шахтёр, напарник в забое» — отсюда оттенок товарищества по общему делу." }
  - { kind: government, text: "z kumplem «с приятелем» — творительный падеж; do kumpla «к приятелю» — родительный; быть приятелями — być kumplami, творительный." }
  - { kind: usage, text: "Беглое e работает как в budynek, palec и wujek: kumpel, но kumpla, kumplem, kumpli." }
collocations:
  - { pl: "mój kumpel", ru: "мой приятель" }
  - { pl: "z kumplem", ru: "с приятелем" }
  - { pl: "być kumplami", ru: "быть приятелями" }
  - { pl: "kumpel z pracy", ru: "приятель с работы" }
family:
  - { pl: "kolega", ru: "товарищ, коллега", relation: root }
  - { pl: "przyjaciel", ru: "друг", relation: root }
  - { pl: "znajomy", ru: "знакомый", relation: root }
etymology: "Из немецкого Kumpel «шахтёр, напарник в забое» — отсюда оттенок товарищества по общему делу."
memory: "kumpel — «приятель, кореш»: слово разговорное, но вполне приличное, без грубости. Держите шкалу в голове: znajomy «знакомый», kolega «товарищ», kumpel «приятель», przyjaciel «друг» — последнее куда сильнее. И беглое e работает как в budynek и wujek: kumpel, но kumpla, kumplem."
idioms:
  - { pl: "mój kumpel", ru: "мой приятель" }
  - { pl: "być kumplami", ru: "быть приятелями" }
  - { pl: "kumpel z pracy", ru: "приятель с работы" }
