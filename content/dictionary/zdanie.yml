# review
id: zdanie
format: 2
lemma: "zdanie"
rank: 2162
pos: noun
pron: { cyr: "зда́не" }
senses:
  - id: sentence
    ru: "предложение (грамматическое)"
    examples:
      - pl: "Kocham to zdanie."
        ru: "Я люблю это предложение."
        source: { kind: tatoeba, id: 3600297 }
      - pl: "To nie jest zdanie."
        ru: "Это не предложение."
        source: { kind: tatoeba, id: 822147 }
      - pl: "Na końcu zdania brakuje kropki."
        ru: "В конце предложения не хватает точки."
        source: { kind: tatoeba, id: 2847041 }
  - id: opinion
    ru: "мнение"
    examples:
      - pl: "Niestety, mam odmienne zdanie."
        ru: "К сожалению, у меня другое мнение."
        source: { kind: tatoeba, id: 7180709 }
      - pl: "Jestem tego samego zdania, co Tom."
        ru: "Я того же мнения, что и Том."
        source: { kind: tatoeba, id: 3701835 }
      - pl: "Moim zdaniem, macie rację."
        ru: "По-моему, вы правы."
        source: { kind: translated, id: 3703891 }
  - id: moim-zdaniem
    ru: "moim zdaniem — по моему мнению"
    examples:
      - pl: "Moim zdaniem masz gorączkę."
        ru: "По-моему, у тебя температура."
        source: { kind: translated, id: 6460690 }
      - pl: "Moim zdaniem oni się spóźnią."
        ru: "По-моему, они опоздают."
        source: { kind: translated, id: 3109640 }
notes:
  - { kind: usage, text: "Два значения надо держать врозь: zdanie «предложение» (грамматика) и zdanie «мнение». Различает контекст." }
  - { kind: government, text: "moim zdaniem — «по моему мнению»: творительный падеж без предлога. Русское «по-моему» строится совсем иначе." }
  - { kind: usage, text: "Третье значение — отглагольное существительное от zdać: zdanie egzaminu «сдача экзамена»." }
  - { kind: usage, text: "Устойчиво: bez dwóch zdań «без сомнения», zmienić zdanie «передумать», obstawać przy swoim zdaniu «стоять на своём»." }
collocations:
  - { pl: "moim zdaniem", ru: "по моему мнению" }
  - { pl: "zmienić zdanie", ru: "передумать" }
  - { pl: "bez dwóch zdań", ru: "без сомнения" }
etymology: "Отглагольное существительное от zdać «сдать, изложить» (z- + dać «дать») — буквально «то, что изложено». Отсюда и «предложение» (изложенная мысль), и «мнение» (изложенный взгляд)."
memory: "zdanie — и «предложение» (грамматическое), и «мнение». Главная формула — moim zdaniem «по моему мнению», творительный без предлога. А zmienić zdanie значит «передумать»."
idioms:
  - { pl: "moim zdaniem", ru: "по моему мнению" }
  - { pl: "zmienić zdanie", ru: "передумать" }
  - { pl: "bez dwóch zdań", ru: "без сомнения" }
