# review
id: dorosnac
format: 2
lemma: "dorosnąć"
rank: 1952
pos: verb
pron: { cyr: "доро́снонць" }
senses:
  - id: grow-up
    ru: "вырасти, стать взрослым"
    examples:
      - pl: "Dorósł i wyjechał z domu."
        ru: "Он вырос и уехал из дома."
        source: { kind: authored }
      - pl: "Córka dorosła i wyprowadziła się."
        ru: "Дочь выросла и съехала."
        source: { kind: authored }
      - pl: "Dorośniesz, to zrozumiesz."
        ru: "Вырастешь — поймёшь."
        source: { kind: authored }
  - id: measure-up
    ru: "дорасти до чего-л., оказаться на высоте"
    examples:
      - pl: "Nie dorósł do tego zadania."
        ru: "Он не дорос до этой задачи."
        source: { kind: authored }
      - pl: "Dorośli do odpowiedzialności dopiero po latach."
        ru: "Они доросли до ответственности только через годы."
        source: { kind: authored }
  - id: grown
    ru: "dorośnięty — выросший, уже взрослый"
    examples:
      - pl: "Dorośnięty syn mieszka osobno."
        ru: "Выросший сын живёт отдельно."
        source: { kind: authored }
      - pl: "Dorośnięci synowie rzadko piszą."
        ru: "Выросшие сыновья редко пишут."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "ТРЕТИЙ КЛАСС СТРАДАТЕЛЬНЫХ ПРИЧАСТИЙ, и теперь правило полное. Глаголы на -ać дают -any (zbadany, zbadani). Глаголы на -ić и -yć дают -ony (zatrudniony, zatrudnieni). А глаголы на -nąć дают -nięty: dorosnąć — dorośnięty, dorośnięci, как zamknąć — zamknięty. Класс причастия узнаётся прямо по окончанию неопределённой формы." }
  - { kind: usage, text: "Совершенный вид к dorastać. Причастие dorośnięty существует, но в живой речи о человеке скорее скажут прилагательным dorosły «взрослый»: dorosły syn звучит обычнее, чем dorośnięty syn. Зато о растениях и животных dorośnięty вполне употребимо." }
  - { kind: government, text: "Дорастают ДО чего — предлог do с родительным: dorosnąć do zadania, do odpowiedzialności, do roli. Русское «дорасти до» устроено так же, расхождений нет." }
  - { kind: false-friend, text: "Приставка do- означает «довести до предела», и в русском ей отвечает ровно та же «до-»: dorosnąć — «дорасти», dojechać — «доехать», dokończyć — «докончить». Это одна из самых надёжных приставок для русскоговорящего: она почти всегда переводится буквально." }
collocations:
  - { pl: "dorosnąć do zadania", ru: "дорасти до задачи" }
  - { pl: "jak dorośniesz", ru: "когда вырастешь" }
  - { pl: "dorosnąć do roli", ru: "дорасти до роли" }
family:
  - { pl: "dorastać", ru: "подрастать, взрослеть", relation: aspect }
  - { pl: "rosnąć", ru: "расти", relation: root }
  - { pl: "dorosły", ru: "взрослый", relation: derived, id: dorosly }
etymology: "Приставка do- «до предела» плюс rosnąć «расти», в точности как русское «дорасти» из «до» и «расти». Корень тот же, что в русском «расти», с уже знакомым соответствием ro-/ра-. Отсюда же прилагательное dorosły «взрослый», буквально «доросший»."
memory: "dorosnąć — «дорасти, вырасти», do- плюс rosnąć, слово в слово как русское «до-расти». Управление тоже совпадает: dorosnąć DO czegoś. А причастие dorośnięty показывает третий класс: глаголы на -nąć дают -nięty."
idioms:
  - { pl: "dorosnąć do zadania", ru: "дорасти до задачи, оказаться на высоте" }
  - { pl: "jeszcze do tego nie dorósł", ru: "он до этого ещё не дорос" }
formExamplesSkip:
  - { form: "dorosł", reason: "Такой формы нет: мужская форма прошедшего времени — dorósł, с чертой, потому что слог закрыт. Простое o возвращается там, где следующий слог открывает предыдущий: dorosła, dorosło, dorosłem." }
  - { form: "dorosłby", reason: "Правильно dorósłby: частица by не открывает слога, поэтому черта над o остаётся, как в самостоятельном dorósł." }
  - { form: "dorosłbym", reason: "Правильно dorósłbym, по той же причине, что и dorósłby: слог перед by закрыт и черта сохраняется." }
  - { form: "dorosłbyś", reason: "Правильно dorósłbyś: слог остаётся закрытым, значит пишется ó, как в dorósł." }
