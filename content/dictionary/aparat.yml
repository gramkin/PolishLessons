notes:
  - { kind: false-friend, text: "Главная ловушка слова. По-польски APARAT без всяких уточнений — это фотоаппарат: KUP NOWY APARAT значит «купи новый фотоаппарат», а не «прибор». Русское «аппарат» так никогда не употребляется, фотоаппарат им не назовёшь. В остальных значениях слова совпадают: APARAT SŁUCHOWY «слуховой аппарат», APARAT TLENOWY «кислородный аппарат», APARAT PAŃSTWOWY «государственный аппарат». И запомните написание: по-польски APARAT с одним p, по-русски «аппарат» с двумя." }
  - { kind: usage, text: "Четыре значения, и различает их обычно определение. Без определения — фотоаппарат. С определением — прибор: SŁUCHOWY, TLENOWY, POMIAROWY. APARAT NA ZĘBY или APARAT ORTODONTYCZNY — брекеты, и по-польски это самое обычное слово для них. APARAT PAŃSTWOWY, APARAT BEZPIECZEŃSTWA — государственный аппарат, собирательно о чиновниках. Пятого значения, русского «аппарат» в смысле «самогонный», у польского слова нет." }
  - { kind: pronunciation, text: "Читается «апа́рат», с ударением на предпоследнем слоге — не на том же месте, что в русском «аппара́т»: по-русски ударение падает на последний слог, по-польски на предпоследний, то есть на A во втором слоге. Это обычное расхождение: польское ударение почти всегда предпоследнее, и у заимствованных слов оно сдвигается влево относительно русского. Оба a в начале слова произносятся полно, без редукции." }
  - { kind: government, text: "Существительное мужского рода неодушевлённое. Родительный падеж единственного числа имеет два варианта: литературный APARATU и разговорный, областной APARATA. В письменной речи пишите APARATU. Чем снимают или измеряют — творительный без предлога: ZROBIŁ ZDJĘCIE APARATEM. Для брекетов употребляется оборот APARAT NA ZĘBY, буквально «аппарат на зубы», с винительным после NA." }
