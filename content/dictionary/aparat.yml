etymology: "Из латинского APPARATUS «снаряжение, приготовление», от APPARARE «приготовлять» — PARARE «готовить» с приставкой AD-. Отсюда же русское «аппарат», французское APPAREIL и английское APPARATUS. В польский слово пришло через немецкий APPARAT в девятнадцатом веке и по дороге потеряло двойное p, которое русский сохранил, потому что брал слово прямо из латинского написания. Значение «фотоаппарат» — сокращение от APARAT FOTOGRAFICZNY, и сокращение это настолько прижилось, что полное словосочетание в живой речи почти не нужно."
memory: "Без определения APARAT — это фотоаппарат, а не «прибор»: kup nowy aparat. Пишется с одним p, в отличие от русского «аппарат». Родительный падеж — aparatu (aparata разговорное)."
idioms:
  - { pl: "aparat na zęby", ru: "брекеты" }
  - { pl: "aparat państwowy", ru: "государственный аппарат" }
formExamplesSkip:
  - { form: "aparaci", reason: "APARAT — существительное неодушевлённое мужского рода (m3), а APARACI — мужско-личная форма именительного множественного (m1), которая предполагает, что речь о людях. Для прибора такое согласование невозможно: множественное число APARAT образует как APARATY. Форма живёт только в таблице склонения, а не в языке." }
  - { form: "aparatowie", reason: "То же препятствие, что и у APARACI: -OWIE — мужско-личное окончание именительного множественного (m1), употребляемое с названиями людей, вроде PROFESOROWIE. APARAT неодушевлённый, поэтому его множественное число — APARATY, и форма APARATOWIE грамматически невозможна." }
