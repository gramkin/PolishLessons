# review
id: jakby
format: 2
lemma: "jakby"
rank: 363
pos: conj
pron: { cyr: "я́кбы" }
senses:
  - id: as-if
    ru: "как будто, словно"
    note: "Как и gdyby, требует прошедшего времени."
    examples:
      - pl: "Tom wyglądał jakby nie spał całą noc."
        ru: "Том выглядел так, будто всю ночь не спал."
        source: { kind: tatoeba, id: 3610596 }
      - pl: "Nie mów o mnie tak, jakby mnie tu nie było."
        ru: "Не говори обо мне так, будто меня здесь нет."
        source: { kind: tatoeba, id: 12567533 }
      - pl: "Nie możemy po prostu zachowywać się tak jakby nic się nie stało."
        ru: "Мы просто не можем вести себя так, как будто ничего не случилось."
        source: { kind: tatoeba, id: 10115293 }
  - id: comparison
    ru: "как будто (в сравнениях)"
    examples:
      - pl: "Wyglądała tak, jakby od wielu dni niczego nie jadła."
        ru: "Она выглядит так, как будто несколько дней ничего не ела."
        source: { kind: tatoeba, id: 3683845 }
      - pl: "Tom wyglądał jakby był na nogach całą noc."
        ru: "Том выглядел так, будто всю ночь провёл на ногах."
        source: { kind: tatoeba, id: 3610598 }
      - pl: "Mówi tak, jakby wszystko wiedział."
        ru: "Он говорит так, будто всё знает."
        source: { kind: authored }
notes:
  - { kind: usage, text: "jakby устроено как gdyby: jak + by, и так же требует прошедшего времени. Wyglądał, jakby nie spał «Он выглядел так, будто не спал»." }
  - { kind: usage, text: "jakby nigdy nic — «как ни в чём не бывало»." }
  - { kind: register, text: "В разговорной речи jakby часто работает словом-паразитом, вроде русского «типа»: To było jakby dziwne." }
collocations:
  - { pl: "jakby nigdy nic", ru: "как ни в чём не бывало" }
  - { pl: "wyglądać, jakby", ru: "выглядеть так, будто" }
  - { pl: "tak jakby", ru: "как будто" }
  - { pl: "jakby co", ru: "если что" }
etymology: "Из jak «как» и частицы -by, показателя сослагательного наклонения; русское «как бы» устроено так же."
memory: "jakby — «как будто», и, как gdyby, требует прошедшего времени: wyglądał, jakby nie spał. А jakby nigdy nic значит «как ни в чём не бывало»."
