# review
id: gorowac
format: 2
lemma: "górować"
rank: 6058
pos: verb
aspect: imperf
pron: { cyr: "гуро́ваць" }
senses:
  - id: tower-over
    ru: "возвышаться (над чем-л.)"
    examples:
      - pl: "Był tu też i nadal znajduje się najdalej na północ wysunięty pomnik Lenina górujący nad placem centralnym."
        ru: "Здесь был и до сих пор стоит самый северный памятник Ленину, возвышающийся над центральной площадью."
        source: { kind: authored }
      - pl: "Nad miastem góruje stary zamek."
        ru: "Над городом возвышается старый замок."
        source: { kind: authored }
      - pl: "Katedra góruje nad dachami starówki."
        ru: "Собор возвышается над крышами старого города."
        source: { kind: authored }
  - id: surpass
    ru: "превосходить, брать верх (nad kimś czymś — кого-л. чем-л.)"
    examples:
      - pl: "Góruje nad kolegami inteligencją."
        ru: "Он превосходит товарищей умом."
        source: { kind: authored }
      - pl: "W tej dyskusji rozsądek górował nad emocjami."
        ru: "В этом споре разум брал верх над эмоциями."
        source: { kind: authored }
notes:
  - { kind: government, text: "Над чем — NAD + творительный, как в русском: górować nad miastem, nad placem. Превосходить чем — творительный без предлога: górować nad kimś wzrostem, doświadczeniem, «превосходить кого-то ростом, опытом». Прямого дополнения нет: глагол непереходный." }
  - { kind: false-friend, text: "Корень GÓRA, «гора», и русскому слышится «горевать», «гореть» — но это не они. GÓROWAĆ — «быть как гора над чем-то»: возвышаться и превосходить. Русское «горевать» по-польски — SMUCIĆ SIĘ." }
  - { kind: pronunciation, text: "«гуро́ваць»: Ó — «у», конечное Ć — «ць». Ударение на предпоследнем слоге RO; в настоящем — GÓ-ru-je, «гу́руе»." }
  - { kind: register, text: "Книжное и описательное: путеводители, репортажи, спортивные обзоры. В разговоре о превосходстве говорят BYĆ LEPSZYM, MIEĆ PRZEWAGĘ." }
collocations:
  - { pl: "górować nad miastem", ru: "возвышаться над городом" }
  - { pl: "górować nad kimś wzrostem", ru: "быть выше кого-то ростом" }
  - { pl: "górować doświadczeniem", ru: "превосходить опытом" }
family:
  - { pl: "góra", ru: "гора; верх", relation: root, id: gora }
  - { pl: "górujący", ru: "возвышающийся, господствующий", relation: derived }
  - { pl: "przewaga", ru: "преимущество", relation: root }
etymology: "От GÓRA, «гора; верх», праславянского *gora, с глагольным суффиксом -OWAĆ: «быть горой, стоять наверху». Русскому соответствует «возвышаться» — та же картина, но без горы в корне."
memory: "Górować — быть горой над чем-то: возвышаться (zamek góruje nad miastem) и превосходить (góruje nad nami wiedzą). NAD + творительный. Не «горевать»!"
idioms:
