notes:
  - { kind: false-friend, text: "Русскому ZBĘDNY ничего не подсказывает, хотя смысл простой: «лишний, излишний». Синоним NIEPOTRZEBNY — бытовой, ZBĘDNY — чуть книжнее и строже: ZBĘDNE FORMALNOŚCI, «лишние формальности», BEZ ZBĘDNYCH SŁÓW, «без лишних слов». Противоположность — NIEZBĘDNY, «необходимый»." }
  - { kind: usage, text: "Полная парадигма: ZBĘDNY, ZBĘDNIEJSZY, NAJZBĘDNIEJSZY. Степени редки, чаще в шутку. Мужское-личное: ZBĘDNI, ZBĘDNIEJSI, NAJZBĘDNIEJSI — о лишних людях, сокращённых работниках." }
  - { kind: government, text: "Лишний для кого-то — ZBĘDNY DLA KOGOŚ, DLA с родительным. Не нужен кому-то — ZBĘDNY KOMUŚ, дательный. Устойчивое: BEZ ZBĘDNEJ ZWŁOKI, «без лишнего промедления»." }
  - { kind: pronunciation, text: "Читается «збэ́ндны», два слога, ударение на первом. ZB в начале звонкое, Ę перед D — «эн». В ZBĘDNIEJSZY: «збэндне́йшы»." }
  - { kind: register, text: "Книжное и деловое слово, частое в официальных письмах: BEZ ZBĘDNEJ ZWŁOKI, ZBĘDNE DOKUMENTY. В разговоре проще NIEPOTRZEBNY или NIEPOTRZEBNE GRATY, «ненужное барахло»." }
collocations:
  - { pl: "zbędne rzeczy", ru: "лишние вещи" }
  - { pl: "bez zbędnych słów", ru: "без лишних слов" }
  - { pl: "bez zbędnej zwłoki", ru: "без лишнего промедления" }
family:
  - { pl: "niezbędny", ru: "необходимый", relation: derived }
  - { pl: "niepotrzebny", ru: "ненужный", relation: root, id: niepotrzebny }
  - { pl: "zbędnie", ru: "излишне", relation: derived }
etymology: "От старопольского ZBYĆ «отделаться, избавиться», того же корня, что BYĆ «быть», и русское «сбыть», «избыток». Лишнее — то, от чего можно избавиться, «сбыть». Противоположное NIEZBĘDNY — «то, без чего не обойтись»."
memory: "Zbędny — лишний, излишний: zbędne rzeczy, bez zbędnych słów. Противоположность — niezbędny, необходимый. Zbędniejszy, najzbędniejszy. Читается «збэ́ндны»."
idioms:
  - { pl: "bez zbędnych słów", ru: "без лишних слов" }
