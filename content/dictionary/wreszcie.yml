pron: { cyr: "врэ́шче" }
senses:
  - id: at-last
    ru: "наконец, наконец-то"
    examples:
      - pl: "Powiedzmy wreszcie całą prawdę."
        ru: "Давайте наконец скажем всю правду."
        source: { kind: tatoeba, id: 6327718 }
      - pl: "Wreszcie skończyłem robotę."
        ru: "Я наконец закончил работу."
        source: { kind: translated, id: 349605 }
      - pl: "Wreszcie zaczęło padać."
        ru: "Наконец пошёл дождь."
        source: { kind: translated, id: 1294691 }
  - id: finally
    ru: "наконец (последний пункт перечисления)"
    examples:
      - pl: "Wreszcie usnęliśmy obaj na krzesłach."
        ru: "Наконец мы оба уснули на стульях."
        source: { kind: authored }
      - pl: "Wreszcie, zdyszani, usiedliśmy na skale."
        ru: "Наконец, запыхавшись, мы сели на скалу."
        source: { kind: authored }
      - pl: "Po pierwsze czas, po drugie pieniądze, a wreszcie chęci."
        ru: "Во-первых время, во-вторых деньги, и наконец желание."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово буквально значит «в остатке»: w + reszta «остаток». Русское «в конце концов» построено по схожему образу." }
  - { kind: usage, text: "No, wreszcie! — готовая реплика «Ну наконец-то!» с оттенком облегчения или нетерпения." }
  - { kind: usage, text: "Синонимы nareszcie и w końcu. nareszcie подчёркивает облегчение, w końcu — итог." }
  - { kind: usage, text: "В перечислении wreszcie вводит последний пункт: po pierwsze…, po drugie…, a wreszcie…" }
collocations:
  - { pl: "no, wreszcie!", ru: "ну наконец-то!" }
  - { pl: "wreszcie przyszedł", ru: "наконец пришёл" }
  - { pl: "nareszcie", ru: "наконец" }
etymology: "Сращение предлога w и слова reszta «остаток», то есть буквально «в остатке». Русское «в конце концов» построено по схожему образу."
memory: "wreszcie — «наконец», буквально «в остатке»: w + reszta. Запомните реплику No, wreszcie! «Ну наконец-то!» Рядом живут nareszcie (с оттенком облегчения) и w końcu (подводит итог), а в перечислении wreszcie вводит последний пункт."
idioms:
