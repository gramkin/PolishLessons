# review
id: sufit
format: 2
lemma: "sufit"
rank: 4308
pos: noun
pron: { cyr: "су́фит" }
senses:
  - id: ceiling
    ru: "потолок"
    examples:
      - pl: "Leżał i patrzył w sufit."
        ru: "Он лежал и смотрел в потолок."
        source: { kind: authored }
      - pl: "Mamy w domu bardzo niskie sufity."
        ru: "У нас в доме очень низкие потолки."
        source: { kind: authored }
      - pl: "Z sufitu zwisała lampa."
        ru: "С потолка свисала лампа."
        source: { kind: authored }
  - id: limit
    ru: "потолок, предел (перен.)"
    examples:
      - pl: "Kobiety wciąż napotykają szklany sufit."
        ru: "Женщины всё ещё упираются в стеклянный потолок."
        source: { kind: authored }
      - pl: "Ceny osiągnęły już sufit."
        ru: "Цены уже достигли потолка."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SUFIT — «потолок». На русский «софит», театральный прожектор, не указывает, хотя слова родственные. Высшая планка, предел — чаще PUŁAP, но и SUFIT: SZKLANY SUFIT, «стеклянный потолок»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — SUFITU, в местном T переходит в C: NA SUFICIE." }
  - { kind: government, text: "На потолке — NA SUFICIE, NA с местным. С потолка — Z SUFITU. Под потолком — POD SUFITEM, творительный. Смотреть в потолок — PATRZEĆ W SUFIT, W с винительным." }
  - { kind: pronunciation, text: "Читается «су́фит», ударение на первом слоге. FI — «фи», конечное T глухое." }
collocations:
  - { pl: "wysoki sufit", ru: "высокий потолок" }
  - { pl: "na suficie", ru: "на потолке" }
  - { pl: "szklany sufit", ru: "стеклянный потолок" }
family:
  - { pl: "sufitowy", ru: "потолочный", relation: derived }
  - { pl: "podsufitka", ru: "подшивка карниза", relation: derived }
  - { pl: "sufit podwieszany", ru: "подвесной потолок", relation: derived }
etymology: "Из латыни, через итальянский, где это слово значит «потолок». Русское «софит» — того же происхождения: в архитектуре так называли нижнюю поверхность перекрытия."
memory: "Sufit — потолок. Читается «су́фит». Na suficie — на потолке. Wziąć coś z sufitu — взять с потолка. Szklany sufit — стеклянный потолок."
idioms:
  - { pl: "wziąć coś z sufitu", ru: "взять что-то с потолка" }
