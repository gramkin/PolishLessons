notes:
  - { kind: false-friend, text: "Корень SAM — это русское «сам», но у польского слова есть второе значение, которого русский корень не имеет: SAM значит ещё и «один, в одиночку». SAM W DOMU это «один дома», а не «сам дома», и JESTEM SAM — «я один». Отсюда прилагательное SAMOTNY «одинокий» и наречие SAMOTNIE «одиноко», где русский корень «сам» не помогает: «самотно» по-русски не говорят. Запомнить помогает цепочка SAM «один» — SAMOTNY «одинокий» — SAMOTNOŚĆ «одиночество» — SAMOTNIE «одиноко». Отдельно стоит SAMO «само», среднего рода, и путать его с SAM нельзя." }
  - { kind: usage, text: "Три формы — это наречие со степенями сравнения: SAMOTNIE, SAMOTNIEJ, NAJSAMOTNIEJ. Сравнительная образована суффиксом -EJ, превосходная приставкой NAJ- к сравнительной, и это общее правило польских наречий: SZYBKO, SZYBCIEJ, NAJSZYBCIEJ. Степени сравнения у этого наречия употребляются редко, потому что одиночество плохо поддаётся измерению, но в парадигме они есть и в живой речи встречаются: ŻYŁO MU SIĘ SAMOTNIEJ. Наречие отвечает на вопрос «как» и не изменяется по родам и числам, в отличие от прилагательного SAMOTNY, у которого полная парадигма." }
  - { kind: government, text: "Наречие падежа не требует и стоит при глаголе: MIESZKAĆ SAMOTNIE, PODRÓŻOWAĆ SAMOTNIE, UMRZEĆ SAMOTNIE. Важный оборот — SAMOTNIE WYCHOWYWAĆ DZIECI «воспитывать детей одному», и от него образовано существительное SAMOTNA MATKA, OJCIEC SAMOTNIE WYCHOWUJĄCY «одинокий родитель», которое стоит в официальных документах и в законе. При степенях сравнения появляется союз NIŻ или предлог OD: SAMOTNIEJ NIŻ PRZEDTEM, SAMOTNIEJ OD NIEGO, и обе конструкции равноправны, как у прилагательных." }
  - { kind: pronunciation, text: "Читается «само́тне», три слога, ударение на предпоследнем. Оба A звучат отчётливо: «са-мо», без редукции. Сочетание NIE в конце даёт «не» с мягким N: «нье», произносимое одним движением, и это не «ние» в два слога. В сравнительной степени SAMOTNIEJ четыре слога, ударение по-прежнему предпоследнее: «самотне́й». В превосходной NAJSAMOTNIEJ пять слогов, ударение на четвёртом: «найсамотне́й», и приставка NAJ- звучит «най», с полным Й." }
