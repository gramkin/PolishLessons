etymology: "От прилагательного SAMOTNY, а то от SAM, из праславянского *samъ, того же, что русское «сам». Польский развил у этого местоимения значение «один», которого русский не имеет: уже в старопольском SAM значило и «сам», и «одинокий», и от второго смысла был образован SAMOTNY суффиксом -OTNY, редким и книжным. Русский для той же идеи взял «одинокий», от «одного», и потому цепочка SAM — SAMOTNY — SAMOTNIE русскоязычному не видна: корень знаком, а вывод из него чужой. Наречие SAMOTNIE образовано от прилагательного суффиксом -E, как ŁADNY и ŁADNIE, и этот способ отвечает русскому -О в «ладно» и «одиноко»: польский берёт -E там, где русский берёт -О."
memory: "Корень sam = русское «сам», но польское sam значит ещё и «один»: sam w domu — «один дома». От этого второго смысла и построено гнездо: samotny «одинокий», samotność «одиночество», samotnie «одиноко». По-русски «самотно» не говорят, так что вывод из знакомого корня приходится запомнить. Три формы — наречие со степенями: samotnie, samotniej, najsamotniej, как szybko/szybciej/najszybciej. Наречие от прилагательного — суффикс -e, где русский берёт -о."
