notes:
  - { kind: false-friend, text: "Слово отвечает русскому «благословению» и построено из тех же частей, но вторая часть другая. Польское BŁOGOSŁAWIEŃSTWO это BŁOGO «благо» плюс SŁAWIĆ «славить»: благо-славить. Русское «благословение» — «благо» плюс «слово»: благо-словить. Оба слова калькируют греческое EULOGIA, то есть «добрословие», и оба угадали по-своему: один язык выбрал славу, другой слово. Первая часть расходится по звуку закономерно: польское BŁOGO против русского «благо», и русская форма здесь церковнославянская, южная, а исконно русская сохранилась только в названии города Бологое." }
  - { kind: usage, text: "Девять форм, средний род. Именительный, винительный и звательный единственного совпадают — BŁOGOSŁAWIEŃSTWO, — а родительный единственного и именительный с винительным множественного дают одну форму BŁOGOSŁAWIEŃSTWA: такое совмещение обычно для среднего рода и экономит сразу три клетки. Местный единственного — BŁOGOSŁAWIEŃSTWIE, со смягчением W. Родительный множественного — BŁOGOSŁAWIEŃSTW, с нулевым окончанием и четырьмя согласными на конце, что для польского совершенно обычно. Суффикс -STWO отвечает русскому -СТВО." }
  - { kind: pronunciation, text: "Читается «буогосуаве́ньстфо», пять слогов, ударение на четвёртом. Обе буквы Ł дают «у» неслоговое, поэтому начало звучит «буо», а середина «суа» — на слух слово совсем не похоже на русское. Буквосочетание IE после W даёт «ве», а Ń — мягкое «нь». Конечное сочетание STWO произносится «стфо», потому что W после глухого S оглушается. Это одно из самых длинных обиходных слов польского языка, и проговаривать его стоит по слогам." }
  - { kind: register, text: "Слово высокое и церковное, но в переносном значении совершенно обиходное. Устойчивые сочетания: BŁOGOSŁAWIEŃSTWO RODZICÓW, UDZIELIĆ BŁOGOSŁAWIEŃSTWA «дать благословение», ZA BŁOGOSŁAWIEŃSTWEM KOGOŚ «с чьего-то благословения». В переносном смысле слово часто стоит в паре с PRZEKLEŃSTWO «проклятие», и эта пара — готовая формула для рассуждения о двойственности чего-либо. Производные: BŁOGOSŁAWIĆ «благословлять», BŁOGOSŁAWIONY «благословенный», а прилагательное BŁOGI значит «блаженный, безмятежный»." }
