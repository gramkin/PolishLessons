etymology: "Калька греческого EULOGIA «доброе слово, благословение», сложенная из BŁOGO и SŁAWIĆ. Первая часть, праславянское *bolgo, означала благо и довольство; русское «благо» пришло из церковнославянского, то есть с юга, а исконно восточнославянская форма была «болого» и дожила только в названии города Бологое. Польское BŁOGO — закономерное развитие той же основы на западной почве. Вторая часть у двух языков разная: польский взял SŁAWIĆ, русский «словить», и обе передают греческое -LOGIA одинаково удачно, ведь корень *slov- и *slav- в праславянском были одним гнездом. Прилагательное BŁOGI сохранило древнейшее значение: блаженный, покойный."
memory: "Калька греческого eulogia «доброе слово», но собранная иначе: польское błogo + sławić «благо-славить», русское «благо» + «слово». Первая часть расходится закономерно: błogo против «блага», причём русская форма церковнославянская, а исконная дожила в названии Бологое. Пять слогов, оба ł читаются как «у»: «буогосуаве́ньстфо». Девять форм: средний род совмещает именительный с винительным, а родительный единственного с именительным множественного."
idioms:
