notes:
  - { kind: false-friend, text: "Форма почти совпадает с русским «ткнуть», а сила действия совсем другая. Польское TKNĄĆ значит «тронуть, притронуться», и чаще всего встречается с отрицанием: NIE TKNĄŁ OBIADU «он не притронулся к обеду», NIE TKNĘLI NICZEGO «они ничего не трогали». Русское «ткнуть» описывает резкий тычок, и для него в польском есть другие слова — DŹGNĄĆ и SZTURCHNĄĆ. Поэтому переводить TKNĄĆ как «ткнуть» почти всегда неверно: получится грубость там, где по-польски сказано совсем мягко." }
  - { kind: government, text: "Прямое дополнение в винительном, без предлога: NIE TKNĄĆ JEDZENIA, NIE TKNĄĆ CUDZYCH RZECZY. Здесь падежи расходятся с русскими: «притронуться» требует предлога «к» с дательным — «не притронулся к еде», — а польский обходится одним винительным. Часть тела, за которую трогают, вводится предлогом W с винительным: TKNĄĆ KOGOŚ W RAMIĘ «тронуть кого-то за плечо», и предлог тут тоже не совпадает с русским «за». В значении предчувствия глагол безличен и ставит лицо в винительный: COŚ MNIE TKNĘŁO." }
  - { kind: usage, text: "Несовершенный партнёр — TYKAĆ, и чередование корня TKN- и TYK- здесь закономерно, как в DOTKNĄĆ и DOTYKAĆ. Приставочных родственников много: DOTKNĄĆ «коснуться», ZATKNĄĆ «воткнуть», NIETKNIĘTY «нетронутый». Последнее слово очень ходовое: OBIAD STAŁ NIETKNIĘTY «обед стоял нетронутым». Пятьдесят три формы — подпись переходного глагола совершенного вида, с деепричастием TKNĄWSZY и полным страдательным причастием TKNIĘTY." }
  - { kind: pronunciation, text: "Читается «ткнончь», в один слог, и начинать с трёх согласных подряд русскому непривычно, хотя сочетание ТКН само по себе знакомо по «ткнуть». Носовое Ą перед Ć звучит как «он». В формах прошедшего времени Ę перед Ł теряет носовость и читается просто как «э»: TKNĘŁA это «ткне́уа», TKNĘŁO — «ткне́уо», а Ł в них даёт «у». В причастии TKNIĘTY носовое Ę сохраняется: «ткне́нты»." }
  - { kind: register, text: "Слово нейтральное, но из-за частого отрицания окрашено особым оттенком: NIE TKNĄĆ значит не просто «не трогать», а «вовсе не притронуться», с лёгким упрёком или тревогой. Устойчивые обороты: PALCEM KOGOŚ NIE TKNĄĆ «пальцем не тронуть», NIE TKNĄĆ ALKOHOLU «не притрагиваться к спиртному». Отдельно живёт безличное COŚ MNIE TKNĘŁO — внезапное предчувствие, «меня словно кольнуло»; по-русски ближе всего «меня как будто что-то толкнуло»." }
collocations:
  - { pl: "nie tknąć jedzenia", ru: "не притронуться к еде" }
  - { pl: "palcem nie tknąć", ru: "пальцем не тронуть" }
