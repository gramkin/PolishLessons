etymology: "Праславянское *tъknǫti «ткнуть, коснуться», от корня *tyk-, который в обоих языках дал обширное гнездо. Русский развил сторону резкого движения: «ткнуть», «тыкать», «натыкаться», «тычок». Польский пошёл в сторону лёгкого прикосновения: TKNĄĆ «тронуть», TYKAĆ «трогать», DOTKNĄĆ «коснуться», DOTYK «осязание». Чередование TKN- и TYK- — след древнего беглого гласного, который выпал в одних формах и прояснился в других, и точно так же оно работает в русском «ткнуть» рядом с «тыкать». Прилагательное NIETKNIĘTY «нетронутый» сохраняет исходное значение полнее всего."
memory: "Форма та же, что у русского «ткнуть», а сила другая: tknąć значит «тронуть, притронуться», и живёт в основном с отрицанием — nie tknął obiadu. Резкий тычок это dźgnąć или szturchnąć. Падеж расходится: польский берёт винительный без предлога там, где русский просит «к» с дательным. И стоит запомнить безличное coś mnie tknęło — внезапное предчувствие."
