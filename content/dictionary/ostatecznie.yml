notes:
  - { kind: false-friend, text: "Два значения этого наречия русский переводит двумя разными словами, и спутать их легко. Первое значение — «в конечном счёте, окончательно»: OSTATECZNIE ZDECYDOWALI «в конечном счёте решили». Второе — «в крайнем случае, на худой конец»: OSTATECZNIE MOŻEMY POJECHAĆ POCIĄGIEM «в крайнем случае можем поехать поездом». По-русски это совсем разные выражения, по-польски одно слово, и различает их только смысл фразы: если речь об итоге — первое, если о запасном варианте — второе. Ошибка в выборе меняет смысл на противоположный по тону: итог звучит твёрдо, а запасной вариант — уступчиво." }
  - { kind: usage, text: "Наречие образовано от OSTATECZNY «окончательный, крайний», а то от OSTATNI «последний». Родственные слова стоит держать рядом, потому что они частотны: OSTATECZNY TERMIN «крайний срок», OSTATECZNA DECYZJA «окончательное решение», W OSTATECZNOŚCI «в крайнем случае» — последнее почти синоним второго значения самого наречия. Степеней сравнения у наречия нет: окончательность не бывает большей или меньшей. В официальном стиле первое значение передают оборотом W KOŃCOWYM EFEKCIE, но само OSTATECZNIE уместно и там." }
  - { kind: pronunciation, text: "Читается «остатэ́чне», ударение на предпоследнем слоге, то есть на -TE-. Сочетание CZ даёт твёрдое «ч», а конечное -NIE звучит «не», одним слогом с мягким n. Все E произносятся как «э» и предыдущую согласную не смягчают: «остатэ́чне», а не «остатечне». Русское «окончательно» и близко не похоже, так что слово запоминается только через родственное OSTATNI «последний», которое учащемуся обычно уже знакомо." }
  - { kind: government, text: "Наречие, падежами не управляет. Место в предложении свободное, но смысл слегка зависит от позиции: в начале фразы OSTATECZNIE читается скорее как «в конечном счёте» и охватывает всё высказывание, а перед глаголом — как «окончательно» и уточняет действие. Во втором значении слово почти всегда стоит в начале: OSTATECZNIE MOŻEMY POJECHAĆ POCIĄGIEM. Союзов не требует, но часто соседствует с ALE и JEŚLI: ALE OSTATECZNIE NIKT NIE PROTESTOWAŁ." }
