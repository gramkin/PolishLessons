etymology: "От OSTATECZNY, а то от OSTATNI «последний», которое идёт от праславянского *ostati «остаться»: последний есть тот, кто остался, когда прочие ушли. Тот же корень в русских «остаться», «остаток», «остальной», и русское «последний» построено на другом образе — «идущий по следу», от «след». Так что польское и русское слова для одного понятия собраны из разных картин: польский смотрит на того, кто остался, русский — на того, кто идёт следом. Суффикс -ECZNY в OSTATECZNY относительный и книжный, он же в SKUTECZNY «действенный» и KONIECZNY «необходимый», а наречие от него получается заменой окончания на -IE, как у всех прилагательных этого типа."
memory: "Два значения, по-русски разные слова: «в конечном счёте, окончательно» и «в крайнем случае, на худой конец». Различает только смысл фразы. От ostatni «последний», а то от «остаться»: последний — тот, кто остался, тогда как русское «последний» идёт по следу. Степеней нет. Читается «остатэ́чне»."
