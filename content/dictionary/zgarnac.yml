# review
id: zgarnac
format: 2
lemma: "zgarnąć"
rank: 2605
pos: verb
pron: { cyr: "зга́рнонць" }
senses:
  - id: sweep-together
    ru: "сгрести, смести (листья, снег, крошки)"
    examples:
      - pl: "Zgarnij liście na kupkę."
        ru: "Сгреби листья в кучку."
        source: { kind: authored }
      - pl: "Zgarnął okruchy ze stołu."
        ru: "Он смёл крошки со стола."
        source: { kind: authored }
  - id: scoop-up
    ru: "сгрести, забрать (деньги, выигрыш, награду)"
    examples:
      - pl: "Zwycięzca zgarnie całą nagrodę."
        ru: "Победитель заберёт весь приз."
        source: { kind: authored }
      - pl: "Udało mu się zgarnąć główną nagrodę."
        ru: "Ему удалось забрать главный приз."
        source: { kind: authored }
  - id: nab
    ru: "разг. забрать, замести (о полиции)"
    examples:
      - pl: "Policjanci zgarnęli ich nad ranem."
        ru: "Полицейские забрали их под утро."
        source: { kind: authored }
      - pl: "Podczas obławy zgarnięto kilkanaście osób."
        ru: "Во время облавы задержали больше десяти человек."
        source: { kind: authored }
notes:
  - { kind: government, text: "zgarnąć coś, kogoś — ВИНИТЕЛЬНЫЙ падеж. В разговорном значении «замести» дополнением бывает человек, поэтому мужсколичное причастие zgarnięci вполне обычно: zgarnięci przez policję «задержанные полицией»." }
  - { kind: register, text: "Второе и третье значения разговорные. zgarnąć nagrodę «забрать награду» звучит бойко, по-газетному; zgarnąć kogoś «замести» — почти жаргон полицейской хроники. Нейтральные замены: zdobyć nagrodę, zatrzymać kogoś." }
  - { kind: usage, text: "Совершенный вид; несовершенный — zgarniać. Чередование ą/ę в прошедшем обязательно: zgarnął, но zgarnęła, zgarnęli, zgarnęły." }
  - { kind: false-friend, text: "Приставка z- здесь значит «вместе, в одну кучу», как русское с- в «сгрести». Сам корень — тот же, что в garść «горсть», родственной русскому «горсть». Но русского глагола «згорнуть» нет, и zgarnąć приходится запоминать целиком." }
collocations:
  - { pl: "zgarnąć liście", ru: "сгрести листья" }
  - { pl: "zgarnąć nagrodę", ru: "забрать награду" }
  - { pl: "zgarnąć włosy do tyłu", ru: "убрать волосы назад" }
family:
  - { pl: "zgarniać", ru: "сгребать", relation: aspect }
  - { pl: "garnąć", ru: "сгребать, притягивать к себе", relation: root }
  - { pl: "garść", ru: "горсть", relation: root }
  - { pl: "ogarnąć", ru: "охватить", relation: derived, id: ogarnac }
etymology: "Приставка z- «вместе, в одно место» и глагол garnąć. Праславянский корень *gъrn-/*gъr-, тот же, что в garść «горсть» — и это прямой родственник русского «горсть». Исходный образ — сгребание руками, захват в пригоршню; отсюда garnąć «сгребать, притягивать к себе» и целое гнездо приставочных: ogarnąć, zgarnąć, zagarnąć, przygarnąć. zgarnąć — «сгрести в одну кучу», и отсюда же переносное «забрать всё себе»: zgarnąć całą pulę."
memory: "zgarnąć — «сгрести в кучу»: z- «вместе» + garnąć, корень как в garść «горсть». Переносно — «забрать всё»: zgarnąć nagrodę. А в полицейской хронике zgarnąć kogoś значит «замести»."
idioms:
  - { pl: "zgarnąć całą pulę", ru: "забрать весь банк, сорвать куш" }
  - { pl: "zgarnąć kogoś", ru: "замести, задержать кого-л. (разг.)" }
