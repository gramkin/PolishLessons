  - id: forceful
    ru: "напористый, агрессивный (о рекламе, стратегии, лечении)"
    examples:
      - pl: "Firma prowadzi agresywną kampanię reklamową."
        ru: "Фирма ведёт агрессивную рекламную кампанию."
