  - { pl: "agresor", ru: "агрессор", relation: derived }
  - { pl: "nerwowy", ru: "нервный", relation: root }
etymology: "Через французское agressif из латинского aggredi, «нападать»: ad- «к» и gradi «шагать». Агрессивный — тот, кто «шагает на» другого. Тот же корень gradi в польском PROGRES и в русском «прогресс»."
memory: "Agresywny — агрессивный: agresywny pies, agresywna kampania. Wobec + родительный. Одно s, твёрдое «рэ»: агрэсы́вны."
idioms:
