notes:
  - { kind: false-friend, text: "Совпадение с русским «агрессивный» полное, и в обоих значениях: о драчливом человеке и о напористой стратегии. Разница в написании и чтении: польское одно S и твёрдое «рэ»: AGRESYWNY, «агрэсы́вны», а не «агрессивный» с двумя С." }
  - { kind: usage, text: "Полная парадигма: AGRESYWNY, AGRESYWNIEJSZY, NAJAGRESYWNIEJSZY. Простые степени живые, хотя BARDZIEJ AGRESYWNY тоже частотно. Форма для мужчин-людей во всех трёх: AGRESYWNI, AGRESYWNIEJSI, NAJAGRESYWNIEJSI." }
  - { kind: government, text: "Агрессивный по отношению к кому-то — AGRESYWNY WOBEC KOGOŚ, WOBEC с родительным, или W STOSUNKU DO KOGOŚ. Русское «агрессивен к кому» с дательным здесь не работает." }
  - { kind: pronunciation, text: "Читается «агрэсы́вны», четыре слога, ударение на предпоследнем. GRE — твёрдое «грэ», SY — твёрдое «сы», без русского «си». В AGRESYWNIEJSZY: «агрэсывне́йшы»." }
  - { kind: register, text: "Нейтральное слово, частое в новостях, медицине, спорте и бизнесе. AGRESYWNA JAZDA, «агрессивная езда», — термин полицейских сводок. В разговоре о человеке ещё говорят NERWOWY или PORYWCZY, «вспыльчивый»." }
collocations:
  - { pl: "agresywny pies", ru: "агрессивная собака" }
  - { pl: "agresywna jazda", ru: "агрессивная езда" }
  - { pl: "agresywny wobec kogoś", ru: "агрессивный по отношению к кому-то" }
family:
