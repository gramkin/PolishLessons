etymology: "Приставка s- плюс przedawać, от dawać «давать». Русское «продавать» собрано из тех же частей: «про-» плюс «давать»."
memory: "sprzedawać — «продавать», несовершенный вид к sprzedać. С się значит «продаваться»: Książka dobrze się sprzedaje. Продавец — sprzedawca, продажа — sprzedaż."
