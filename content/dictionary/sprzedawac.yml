  - id: sell-well
    ru: "sprzedawać się — продаваться (о товаре)"
    examples:
      - pl: "Parasole dobrze się sprzedają."
        ru: "Зонты хорошо продаются."
        source: { kind: translated, id: 10597680 }
      - pl: "Ta książka dobrze się sprzedawała w Japonii."
        ru: "Эта книга хорошо продавалась в Японии."
        source: { kind: tatoeba, id: 351946 }
notes:
  - { kind: government, text: "sprzedawać coś komuś — винительный товара плюс дательный покупателя, ровно как в русском." }
  - { kind: usage, text: "Несовершенный вид к sprzedać. Обратите внимание на основы: sprzedaję, sprzedajesz, но совершенное sprzedam, sprzedasz." }
  - { kind: usage, text: "С się глагол значит «продаваться»: Książka dobrze się sprzedaje «Книга хорошо продаётся»." }
  - { kind: usage, text: "Продавец — sprzedawca, продажа — sprzedaż; оба от этого же корня." }
collocations:
  - { pl: "sprzedawać owoce", ru: "продавать фрукты" }
  - { pl: "dobrze się sprzedawać", ru: "хорошо продаваться" }
  - { pl: "sprzedawać przez internet", ru: "продавать через интернет" }
family:
  - { pl: "sprzedać", ru: "продать", relation: aspect, id: sprzedac }
  - { pl: "sprzedawca", ru: "продавец", relation: derived }
  - { pl: "sprzedaż", ru: "продажа", relation: derived }
etymology: "Приставка s- плюс przedawać, от dawać «давать». Русское «продавать» собрано из тех же частей: «про-» плюс «давать»."
memory: "sprzedawać — «продавать», несовершенный вид к sprzedać. С się значит «продаваться»: Książka dobrze się sprzedaje. Продавец — sprzedawca, продажа — sprzedaż."
idioms:
  - { pl: "dobrze się sprzedawać", ru: "хорошо продаваться" }
  - { pl: "sprzedawać przez internet", ru: "продавать через интернет" }
