# review
id: postarac
format: 2
lemma: "postarać"
rank: 1354
pos: verb
aspect: perf
aspectPair: starac
pron: { cyr: "поста́раць" }
senses:
  - id: try
    ru: "постараться, приложить усилия"
    examples:
      - pl: "Postaraj się nie spóźnić na kolację."
        ru: "Постарайся не опоздать к ужину."
        source: { kind: tatoeba, id: 3195709 }
      - pl: "Postaram się."
        ru: "Я постараюсь."
        source: { kind: translated, id: 8676096 }
      - pl: "Musisz się postarać."
        ru: "Ты должен постараться."
        source: { kind: translated, id: 6324399 }
  - id: manage
    ru: "добиться, справиться (если постараться)"
    examples:
      - pl: "Da radę, jeśli się postara."
        ru: "Справится, если постарается."
        source: { kind: translated, id: 362375 }
      - pl: "Jak się postarasz, to zdasz egzamin."
        ru: "Если постараешься, сдашь экзамен."
        source: { kind: translated, id: 898702 }
notes:
  - { kind: usage, text: "Почти всегда с się: postarać się «постараться». Совершенный вид к starać się." }
  - { kind: government, text: "postarać się плюс инфинитив: Postaraj się nie spóźnić «Постарайся не опоздать». А postarać się o coś значит «раздобыть, позаботиться о чём-то»." }
  - { kind: usage, text: "Postaram się — стандартный вежливый ответ на просьбу, ровно как русское «Постараюсь»." }
  - { kind: false-friend, text: "Не путайте starać się «стараться» со starzeć się «стареть»: разница в одной букве, а смысл совсем разный." }
collocations:
  - { pl: "postarać się", ru: "постараться" }
  - { pl: "postaram się", ru: "постараюсь" }
  - { pl: "postarać się o coś", ru: "раздобыть что-либо" }
etymology: "Приставка po- и starać się «стараться» (праславянское *starati). Русское «стараться» — то же самое слово, так что пара starać się и postarać się читается насквозь."
memory: "postarać się — «постараться», совершенный вид к starać się, и почти всегда с się. Postaram się — вежливый ответ на просьбу, как русское «Постараюсь». И не путайте starać się со starzeć się «стареть»."
idioms:
  - { pl: "postarać się o coś", ru: "раздобыть что-либо" }
  - { pl: "postarać się bardziej", ru: "постараться получше" }
  - { pl: "nie postarać się nawet", ru: "даже не попытаться" }
