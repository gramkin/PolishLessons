# review
id: popatrzec
format: 2
lemma: "popatrzeć"
rank: 657
pos: verb
aspect: perf
aspectPair: patrzec
pron: { cyr: "попа́тшэць" }
senses:
  - id: look
    ru: "посмотреть, поглядеть"
    note: "Popatrz! — одно из самых частых слов в разговоре."
    examples:
      - pl: "Popatrz!"
        ru: "Посмотри!"
        source: { kind: translated, id: 6308696 }
      - pl: "Popatrz, wiewiórka!"
        ru: "Смотри, белка!"
        source: { kind: translated, id: 5398136 }
      - pl: "Popatrz tutaj."
        ru: "Посмотри сюда."
        source: { kind: translated, id: 5660010 }
  - id: look-at
    ru: "popatrzeć NA coś — посмотреть на что-л. (винительный)"
    note: "Управление совпадает с русским."
    examples:
      - pl: "Popatrzcie na tablicę."
        ru: "Посмотрите на доску."
        source: { kind: translated, id: 6154854 }
      - pl: "Popatrzcie na dziewczyny."
        ru: "Посмотрите на девушек."
        source: { kind: translated, id: 12042126 }
      - pl: "Chodźmy na zewnątrz i popatrzmy w gwiazdy."
        ru: "Выйдем на улицу и поглядим на звёзды."
        source: { kind: translated, id: 3034056 }
  - id: have-a-look
    ru: "Nie zaszkodzi popatrzeć — посмотреть не повредит"
    examples:
      - pl: "Nie zaszkodzi popatrzeć."
        ru: "Посмотреть не повредит."
        source: { kind: translated, id: 4716915 }
      - pl: "Popatrzcie jeszcze, proszę. Może coś jeszcze zostało?"
        ru: "Посмотрите, пожалуйста: может быть, что-нибудь осталось?"
        source: { kind: tatoeba, id: 12476632 }
      - pl: "Powiedziała, że na to popatrzy."
        ru: "Она сказала, что на это посмотрит."
        source: { kind: translated, id: 13338515 }
notes:
  - { kind: government, text: "Смотреть НА что-то — popatrzeć NA coś, с винительным: popatrzcie na tablicę «посмотрите на доску», popatrz na mnie. Здесь польский и русский совпадают." }
  - { kind: usage, text: "Совершенный вид к patrzeć, и приставка po- даёт тот же оттенок краткости, что русское «по-»: popatrz значит «взгляни», а не «смотри»." }
  - { kind: usage, text: "Прошедшее время у глагола двоякое: popatrzał и popatrzył. Современная норма предпочитает popatrzył, но форма на -ał тоже жива, и таблица построена на ней — как и карточка patrzeć." }
  - { kind: usage, text: "Отглагольное существительное popatrzenie редкое; «взгляд» обычно spojrzenie." }
collocations:
  - { pl: "Popatrz!", ru: "Смотри!" }
  - { pl: "popatrzeć na coś", ru: "посмотреть на что-либо" }
  - { pl: "Nie zaszkodzi popatrzeć", ru: "Посмотреть не повредит" }
  - { pl: "spojrzenie", ru: "взгляд" }
family:
  - { pl: "patrzeć", ru: "смотреть", relation: aspect }
  - { pl: "spojrzeć", ru: "взглянуть", relation: root }
  - { pl: "spojrzenie", ru: "взгляд", relation: derived }
etymology: "Приставка po- плюс patrzeć «смотреть» — русское «посмотреть» собрано тем же способом, из «по-» и «смотреть»."
memory: "popatrzeć — «посмотреть, поглядеть», совершенный вид к patrzeć, и приставка po- даёт тот же оттенок краткости, что русское «по-»: popatrz значит «взгляни», а не «смотри». Управление совпадает: popatrzeć NA coś с винительным — popatrzcie na tablicę. Самое частое слово карточки — повелительное Popatrz! «Смотри! Гляди!». Прошедшее время двоякое: popatrzał и popatrzył, причём норма сегодня предпочитает второе."
idioms:
  - { pl: "Popatrz!", ru: "Смотри!" }
  - { pl: "popatrzeć na coś", ru: "посмотреть на что-либо" }
  - { pl: "Nie zaszkodzi popatrzeć", ru: "Посмотреть не повредит" }
