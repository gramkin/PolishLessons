notes:
  - { kind: usage, text: "oto — указательное «вот»: Oto nasza szkoła «Вот наша школа», Oto moja wizytówka «Вот моя визитка»." }
  - { kind: usage, text: "Слово чуть торжественнее русского «вот». В обиходе поляк скорее скажет tu jest или proszę." }
  - { kind: usage, text: "oto i cały... — «вот и весь...»: Oto i cały mój ekwipunek «Вот и всё моё снаряжение»." }
  - { kind: usage, text: "Слово застыло из частицы o и местоимения to «это» — буквально «о, это». Русское «вот» из «во» + «то» устроено похоже." }
collocations:
  - { pl: "oto i cały", ru: "вот и весь" }
  - { pl: "oto co", ru: "вот что" }
  - { pl: "oto jest pytanie", ru: "вот в чём вопрос" }
etymology: "Застывшее сочетание частицы o и местоимения to «это» — буквально «о, это». Русское «вот» собрано похожим образом из «во» и «то»."
memory: "oto — «вот», указательное слово: Oto nasza szkoła. Оно чуть торжественнее русского «вот»; в быту поляк скорее скажет tu jest."
idioms:
