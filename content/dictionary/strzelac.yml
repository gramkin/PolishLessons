# review
id: strzelac
format: 2
lemma: "strzelać"
rank: 656
pos: verb
aspect: imperf
pron: { cyr: "стшэ́ляць" }
senses:
  - id: shoot
    ru: "стрелять"
    note: "Nie strzelaj! «Не стреляй!»"
    examples:
      - pl: "Stój, bo strzelam!"
        ru: "Стой, или я буду стрелять!"
        source: { kind: tatoeba, id: 6320399 }
      - pl: "Nie strzelaj!"
        ru: "Не стреляй!"
        source: { kind: translated, id: 8621013 }
      - pl: "Nie strzelać!"
        ru: "Не стрелять!"
        source: { kind: translated, id: 6329000 }
  - id: shoot-at
    ru: "strzelać DO kogoś — стрелять в кого-л. (do с родительным)"
    note: "Русское «в» с винительным здесь не работает."
    examples:
      - pl: "Tom strzelał z procy do szczurów."
        ru: "Том стрелял из рогатки по крысам."
        source: { kind: translated, id: 10604151 }
      - pl: "Strzelali do ptaków."
        ru: "Они стреляли по птицам."
        source: { kind: authored }
      - pl: "Nie strzelaj do niego!"
        ru: "Не стреляй в него!"
        source: { kind: authored }
  - id: shoot-from
    ru: "strzelać Z czegoś — стрелять из чего-л."
    note: "Здесь польский и русский совпадают."
    examples:
      - pl: "Strzelanie z łuku jest męczące."
        ru: "Стрельба из лука утомительна."
        source: { kind: translated, id: 1362184 }
      - pl: "Dźwięk strzelania z karabinu przełamał poranną ciszę."
        ru: "Звук выстрела из карабина нарушил утреннюю тишину."
        source: { kind: translated, id: 8763015 }
      - pl: "Uczył się strzelać z łuku."
        ru: "Он учился стрелять из лука."
        source: { kind: authored }
  - id: score
    ru: "strzelać gola — забивать гол"
    examples:
      - pl: "On świetnie strzela."
        ru: "Он отлично бьёт по воротам."
        source: { kind: translated, id: 837092 }
      - pl: "Strzelał gole w każdym meczu."
        ru: "Он забивал голы в каждом матче."
        source: { kind: authored }
      - pl: "Nasza drużyna nie strzela goli."
        ru: "Наша команда не забивает голов."
        source: { kind: authored }
notes:
  - { kind: government, text: "Два предлога, и один расходится с русским. «Стрелять ИЗ чего-то» — strzelać Z czegoś с родительным, как в русском: z łuku, z karabinu. А «стрелять В кого-то» — strzelać DO kogoś, тоже с родительным: strzelał do szczurów. Русское «в» с винительным здесь не годится." }
  - { kind: usage, text: "Обе конструкции видно разом: Tom strzelał z procy do szczurów «Том стрелял из рогатки по крысам»." }
  - { kind: usage, text: "В футболе strzelać gola значит «забивать гол»: strzelał gole w każdym meczu." }
  - { kind: usage, text: "Обиходные формулы: Nie strzelaj! «Не стреляй!», Stój, bo strzelam! «Стой, стрелять буду!»." }
  - { kind: usage, text: "Совершенный вид — strzelić или wystrzelić; отглагольное существительное — strzelanie." }
collocations:
  - { pl: "Nie strzelaj!", ru: "Не стреляй!" }
  - { pl: "strzelać do kogoś", ru: "стрелять в кого-либо" }
  - { pl: "strzelać z łuku", ru: "стрелять из лука" }
  - { pl: "strzelać gola", ru: "забивать гол" }
family:
  - { pl: "strzała", ru: "стрела", relation: root }
  - { pl: "strzelba", ru: "ружьё", relation: derived }
  - { pl: "wystrzelić", ru: "выстрелить", relation: aspect }
  - { pl: "strzelec", ru: "стрелок", relation: derived }
etymology: "От strzała «стрела», праславянское *strěla — то же слово, что русское «стрела». «Стрелять» собрано тем же способом."
memory: "strzelać — «стрелять», и корень тот же: strzała «стрела». Запомнить надо предлоги. «Стрелять ИЗ чего-то» совпадает с русским: strzelać z łuku, z karabinu. А вот «стрелять В кого-то» по-польски strzelać DO kogoś — снова do с родительным, а не «в» с винительным. Обе конструкции видны разом в Tom strzelał z procy do szczurów. И держите в уме футбольное strzelać gola «забивать гол»."
idioms:
  - { pl: "Nie strzelaj!", ru: "Не стреляй!" }
  - { pl: "strzelać gola", ru: "забивать гол" }
  - { pl: "Człowiek strzela, Pan Bóg kule nosi", ru: "Человек предполагает, а Бог располагает" }
