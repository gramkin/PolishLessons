        source: { kind: tatoeba, id: 5015611 }
notes:
  - { kind: government, text: "Мужской неодушевлённый; родительный — chleba. Обратите внимание: «нет хлеба» — nie ma chleba, родительный, как и в русском." }
  - { kind: false-friend, text: "Прямая родня русскому «хлеб», праславянское *хlěbъ. Одно из немногих слов, где можно довериться слуху полностью." }
  - { kind: usage, text: "Kromka chleba «ломоть хлеба», bochenek chleba «буханка хлеба» — оба счётных слова есть в словаре." }
  - { kind: usage, text: "Пословица Nie samym chlebem żyje człowiek «Не хлебом единым жив человек» совпадает с русской дословно." }
collocations:
  - { pl: "kromka chleba", ru: "ломоть хлеба" }
  - { pl: "bochenek chleba", ru: "буханка хлеба" }
etymology: "Праславянское *хlěbъ; русское «хлеб» — то же слово."
memory: "chleb — «хлеб», прямая родня русскому. Счётные слова: kromka chleba «ломоть», bochenek chleba «буханка». Пословица Nie samym chlebem żyje człowiek совпадает с русской."
