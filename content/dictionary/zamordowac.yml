# review
id: zamordowac
format: 2
lemma: "zamordować"
rank: 1319
pos: verb
aspect: perf
pron: { cyr: "замордо́ваць" }
senses:
  - id: murder
    ru: "убить умышленно, умертвить"
    examples:
      - pl: "Czy pan zamordował Toma?"
        ru: "Это вы убили Тома?"
        source: { kind: translated, id: 8766193 }
      - pl: "Tom przyznał się, że zamordował Mary."
        ru: "Том признался, что убил Мэри."
        source: { kind: translated, id: 2176459 }
      - pl: "Policja już nie uważa, że Tom zamordował Mary."
        ru: "Полиция больше не считает, что Том убил Мэри."
        source: { kind: translated, id: 13765601 }
  - id: was-murdered
    ru: "zostać zamordowanym — быть убитым"
    examples:
      - pl: "Został zamordowany."
        ru: "Он был убит."
        source: { kind: translated, id: 6441366 }
      - pl: "Tom został zamordowany."
        ru: "Том был убит."
        source: { kind: translated, id: 8762718 }
      - pl: "Lincoln został zamordowany w 1865 roku."
        ru: "Линкольн был убит в 1865 году."
        source: { kind: translated, id: 1484286 }
  - id: murdered-fem
    ru: "zamordowana — убитая"
    examples:
      - pl: "Tom wierzy, że Mary została zamordowana."
        ru: "Том считает, что Мэри была убита."
        source: { kind: translated, id: 3838662 }
      - pl: "Jej młodsza siostra została zamordowana przez prześladowcę."
        ru: "Её младшая сестра была убита преследователем."
        source: { kind: translated, id: 7298678 }
      - pl: "Czytałem w gazecie, że ją zamordowano."
        ru: "Я читал в газете, что её убили."
        source: { kind: translated, id: 352748 }
notes:
  - { kind: government, text: "zamordować kogoś «убить кого-то» — винительный падеж. Страдательный оборот строится с przez: zostać zamordowanym przez kogoś." }
  - { kind: usage, text: "Страдательное причастие zamordowany гораздо частотнее личных форм — это язык новостей и криминальной хроники." }
  - { kind: usage, text: "Вид совершенный; несовершенный — mordować. Существительные — morderstwo «убийство» и morderca «убийца»." }
  - { kind: false-friend, text: "Zabić значит просто «убить», а zamordować — «умертвить умышленно», то есть «совершить убийство»." }
collocations:
  - { pl: "zostać zamordowanym", ru: "быть убитым" }
  - { pl: "zamordować kogoś", ru: "убить кого-то" }
  - { pl: "brutalnie zamordowany", ru: "зверски убитый" }
etymology: "Приставка za- и mordować, из немецкого Mord «убийство». Русское «умертвить» передаёт тот же смысл другим корнем."
memory: "zamordować — «убить умышленно», сильнее нейтрального zabić. Чаще всего встречается в страдательном обороте: został zamordowany «он был убит». Несовершенный вид — mordować, существительное — morderstwo."
