  - { kind: false-friend, text: "Русское «турист» кончается на согласную и склоняется по-мужски, так что польская форма на -a выглядит непривычно." }
  - { kind: usage, text: "Jestem turystą «я турист» — творительный падеж после być, как и во всех подобных конструкциях." }
