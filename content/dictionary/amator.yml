# review
id: amator
format: 2
lemma: "amator"
rank: 5274
pos: noun
pron: { cyr: "ама́тор" }
senses:
  - id: amateur
    ru: "любитель (не профессионал)"
    examples:
      - pl: "Mój tata jest fotografem amatorem."
        ru: "Мой папа — фотограф-любитель."
        source: { kind: authored }
      - pl: "Grał w piłkę jako amator."
        ru: "Он играл в футбол как любитель."
        source: { kind: authored }
      - pl: "Te zdjęcia zrobił amator, a nie zawodowiec."
        ru: "Эти снимки сделал любитель, а не профессионал."
        source: { kind: authored }
  - id: fancier
    ru: "любитель, охотник до чего-то; желающий"
    examples:
      - pl: "Jest wielkim amatorem dobrej kuchni."
        ru: "Он большой любитель хорошей кухни."
        source: { kind: authored }
      - pl: "Na takie stare auto nie znajdzie się amator."
        ru: "На такую старую машину не найдётся охотника."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Польский AMATOR — это наш «любитель» в обоих смыслах. Во-первых, не профессионал: FOTOGRAF AMATOR — фотограф-любитель. Во-вторых, охотник до чего-то: AMATOR DOBREJ KUCHNI. Отсюда обиходное NIE MA AMATORÓW — «нет желающих», буквально «нет любителей»." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Множественное — AMATORZY. В местном падеже R переходит в RZ: O AMATORZE. Винительный равен родительному: ZNALEŹĆ AMATORA. О женщине — AMATORKA." }
  - { kind: government, text: "Любитель чего-то — AMATOR CZEGOŚ, родительный: AMATOR SPORTU. Желающий получить что-то — AMATOR NA COŚ, NA с винительным: NA TEN DOM NIE MA AMATORÓW." }
  - { kind: pronunciation, text: "Читается «ама́тор», три слога, ударение на втором. В местном падеже AMATORZE сочетание RZ даёт «ж»: «амато́жэ»." }
  - { kind: register, text: "AMATOR KWAŚNYCH JABŁEK, «любитель кислых яблок», говорят иронически о том, на что желающих не найдётся: «а кто охотник на такое?» Прилагательное AMATORSKI бывает и пренебрежительным: AMATORSKA ROBOTA — «работа дилетанта»." }
collocations:
  - { pl: "fotograf amator", ru: "фотограф-любитель" }
  - { pl: "amator sportu", ru: "любитель спорта" }
  - { pl: "nie ma amatorów", ru: "нет желающих" }
family:
  - { pl: "amatorski", ru: "любительский", relation: derived }
  - { pl: "amatorstwo", ru: "любительство, дилетантство", relation: derived }
  - { pl: "amatorka", ru: "любительница", relation: derived }
etymology: "Из латинского AMATOR «любящий», от глагола «любить». Русский взял это слово через французский как «аматёр», и оно устарело, а польский сохранил латинскую форму в живом употреблении."
memory: "Amator — любитель: fotograf amator, amator sportu. Читается «ама́тор». Nie ma amatorów — нет желающих. Amator kwaśnych jabłek — охотник на сомнительное дело. Amatorska robota — работа дилетанта."
idioms:
  - { pl: "amator kwaśnych jabłek", ru: "охотник на сомнительное дело" }
