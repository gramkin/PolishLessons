# review
id: przyznac
format: 2
lemma: "przyznać"
rank: 649
pos: verb
aspect: perf
pron: { cyr: "пшы́знаць" }
senses:
  - id: admit
    ru: "признать (что-л.)"
    note: "przyznać, że... — признать факт."
    examples:
      - pl: "Musisz przyznać, że się myliłeś."
        ru: "Ты должен признать, что ошибался."
        source: { kind: tatoeba, id: 750526 }
      - pl: "Przyznał, że skłamał."
        ru: "Он признал, что солгал."
        source: { kind: translated, id: 365534 }
      - pl: "Przyznała, że nie miała racji."
        ru: "Она признала, что была неправа."
        source: { kind: translated, id: 1465640 }
  - id: confess
    ru: "przyznać się DO czegoś — признаться в чём-л."
    note: "Предлог do с родительным, а не «в» с предложным."
    examples:
      - pl: "Muszę się przyznać, że się myliłem."
        ru: "Должен признать, что я ошибался."
        source: { kind: tatoeba, id: 1284533 }
      - pl: "Przyznaj się!"
        ru: "Признайся!"
        source: { kind: translated, id: 12359625 }
      - pl: "Przyznała się do błędu."
        ru: "Она признала ошибку."
        source: { kind: translated, id: 2679759 }
  - id: guilt
    ru: "przyznać się do winy — признать вину"
    examples:
      - pl: "Podpisali przyznanie się do winy."
        ru: "Они подписали признание вины."
        source: { kind: translated, id: 6534239 }
      - pl: "Przyznanie się do winy to połowa drogi do jej wybaczenia."
        ru: "Признание вины — полпути к её прощению."
        source: { kind: translated, id: 349080 }
      - pl: "Wyrzuty sumienia zmusiły go do przyznania się do winy."
        ru: "Угрызения совести заставили его признать вину."
        source: { kind: translated, id: 1354988 }
  - id: award
    ru: "przyznać coś komuś — присудить, назначить"
    note: "Третье значение, далёкое от «признать»."
    examples:
      - pl: "Przyznano mi zapomogę naukową."
        ru: "Мне назначили научное пособие."
        source: { kind: translated, id: 367008 }
      - pl: "Ziemia została przyznana najstarszemu synowi."
        ru: "Земля была присуждена старшему сыну."
        source: { kind: translated, id: 814605 }
      - pl: "Przyznano jej nagrodę główną."
        ru: "Ей присудили главную премию."
        source: { kind: authored }
notes:
  - { kind: government, text: "Два управления, и их надо развести. Признать факт — przyznać, że...: Przyznał, że skłamał. Признаться в чём-то — przyznać się DO czegoś, с предлогом do и родительным: przyznać się do winy, przyznała się do błędu." }
  - { kind: false-friend, text: "Русское «признаться В чём-то» здесь подводит: по-польски только do с родительным. Не «w winie», а do winy." }
  - { kind: usage, text: "Третье значение — «присудить, назначить, предоставить»: przyznano mi stypendium «мне назначили стипендию», ziemię przyznano synowi." }
  - { kind: usage, text: "Несовершенный вид — przyznawać: przyznawał się powoli, w końcu się przyznał." }
  - { kind: usage, text: "Отглагольное существительное — przyznanie: przyznanie się do winy «признание вины»." }
collocations:
  - { pl: "przyznać się do winy", ru: "признать вину" }
  - { pl: "Przyznaj się!", ru: "Признайся!" }
  - { pl: "trzeba przyznać", ru: "надо признать" }
  - { pl: "przyznać nagrodę", ru: "присудить награду" }
family:
  - { pl: "przyznawać", ru: "признавать", relation: aspect }
  - { pl: "znać", ru: "знать", relation: root }
  - { pl: "przyznanie", ru: "признание", relation: derived }
etymology: "Приставка przy- плюс znać «знать», праславянское *znati — то же слово, что русское «знать». «Признать» собрано тем же способом: «при-» плюс «знать»."
memory: "przyznać — «признать», и собрано оно как русское: przy- плюс znać. Развести надо два управления. Признать факт — przyznać, że...: Przyznał, że skłamał. А признаться в чём-то — przyznać się DO czegoś, с предлогом do и родительным: przyznać się do winy. Русское «признаться В чём-то» здесь подводит. И держите в уме третье значение, далёкое от первых двух: przyznano mi stypendium «мне назначили стипендию»."
idioms:
  - { pl: "przyznać się do winy", ru: "признать вину" }
  - { pl: "Przyznaj się!", ru: "Признайся!" }
  - { pl: "trzeba przyznać", ru: "надо признать" }
