# review
id: dziecko
format: 2
lemma: "dziecko"
rank: 109
pos: noun
pron: { cyr: "дзье́цко" }
senses:
  - id: child
    ru: "ребёнок, дитя"
    examples:
      - pl: "To moje dziecko."
        ru: "Это мой ребёнок."
        source: { kind: tatoeba, id: 2399296 }
      - pl: "Tom miał dziecko."
        ru: "У Тома был ребёнок."
        source: { kind: tatoeba, id: 12470092 }
      - pl: "Jakie ładne dziecko!"
        ru: "Какой красивый ребёнок!"
        source: { kind: tatoeba, id: 3461138 }
  - id: kids
    ru: "дети (о детях вообще)"
    examples:
      - pl: "Lubię dzieci."
        ru: "Я люблю детей."
        source: { kind: tatoeba, id: 6392764 }
      - pl: "Nie jesteś już dzieckiem."
        ru: "Ты уже не просто ребёнок."
        source: { kind: tatoeba, id: 410066 }
notes:
  - { kind: usage, text: "Множественное число нерегулярное: dziecko → dzieci, творительный dziećmi — ровно как русское «дитя → дети, детьми»." }
  - { kind: usage, text: "Оборот od dziecka значит «с детства»." }
collocations:
  - { pl: "mieć dzieci", ru: "иметь детей" }
  - { pl: "od dziecka", ru: "с детства" }
  - { pl: "plac zabaw dla dzieci", ru: "детская площадка" }
etymology: "Праславянское *dětь «дитя» с суффиксом -ьsko; тот же корень, что в русских «дитя» и «детский»."
memory: "Единственное число похоже на русское «дитятко», а множественное — нерегулярное и тоже знакомое: dzieci «дети», dziećmi «детьми». Запомните оборот od dziecka «с детства»."
idioms:
  - { pl: "cudowne dziecko", ru: "вундеркинд" }
  - { pl: "dom dziecka", ru: "детский дом" }
  - { pl: "bawić się z kimś jak z dzieckiem", ru: "нянчиться с кем-то" }
