# review
id: odwaga
format: 2
lemma: "odwaga"
rank: 1591
pos: noun
pron: { cyr: "одва́га" }
senses:
  - id: courage
    ru: "отвага, смелость, мужество"
    examples:
      - pl: "Odwaga to wspaniała cecha."
        ru: "Отвага — прекрасное качество."
        source: { kind: translated, id: 592709 }
      - pl: "Zadziwiła mnie jego odwaga."
        ru: "Меня поразила его отвага."
        source: { kind: translated, id: 659100 }
      - pl: "Jego odwaga graniczyła z szaleństwem."
        ru: "Его отвага граничила с безумием."
        source: { kind: tatoeba, id: 6155924 }
  - id: lack-courage
    ru: "смелость (в оборотах «хватает / не хватает»)"
    examples:
      - pl: "Brak mu odwagi."
        ru: "Ему не хватает смелости."
        source: { kind: translated, id: 754533 }
      - pl: "Nie trać odwagi."
        ru: "Не теряй мужества."
        source: { kind: translated, id: 919793 }
      - pl: "Temu mężczyźnie brakuje odwagi."
        ru: "Этому мужчине не хватает храбрости."
        source: { kind: tatoeba, id: 525640 }
notes:
  - { kind: government, text: "«Не хватает смелости» — brak mu odwagi или brakuje mu odwagi, родительный падеж. «Терять мужество» — tracić odwagę, винительный." }
  - { kind: usage, text: "Odwagi! — самостоятельное подбадривание «Смелей!, Мужайся!»; Miej odwagę — «Имей смелость»." }
  - { kind: usage, text: "Прилагательное — odważny «отважный», наречие odważnie — «отважно»." }
  - { kind: usage, text: "Существительное женского рода на -a; звательная форма odwago в корпусе не встречается." }
collocations:
  - { pl: "brak odwagi", ru: "нехватка смелости" }
  - { pl: "mieć odwagę", ru: "иметь смелость" }
  - { pl: "tracić odwagę", ru: "терять мужество" }
etymology: "От odważyć się «осмелиться», от waga «вес» — буквально «решиться, взвесив». Русское «отвага» — то же праславянское гнездо, заимствованное из польского в русский в XVII веке."
memory: "odwaga = «отвага, смелость». Управление: brak mu odwagi «ему не хватает смелости» (родительный), но tracić odwagę «терять мужество» (винительный). Отдельное Odwagi! значит «Смелей!»."
idioms:
  - { pl: "brak odwagi", ru: "нехватка смелости" }
  - { pl: "Odwagi!", ru: "смелей!" }
  - { pl: "tracić odwagę", ru: "терять мужество" }
formExamplesSkip:
  - { form: "odwago", reason: "звательный падеж у неодушевлённых существительных в современном языке остался только в поэтическом обращении: в обычной речи вместо odwago говорят odwaga" }
