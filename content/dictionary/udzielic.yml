# review
id: udzielic
format: 2
lemma: "udzielić"
rank: 2405
pos: verb
aspect: perf
pron: { cyr: "удзе́лиць" }
senses:
  - id: give-grant
    ru: "оказать, предоставить (помощь, ответ, совет)"
    examples:
      - pl: "Jak udzielić pierwszej pomocy osobie tonącej?"
        ru: "Как оказать первую помощь утопающему?"
        source: { kind: tatoeba, id: 6155990 }
      - pl: "Udzielił pozytywnej odpowiedzi."
        ru: "Он дал положительный ответ."
        source: { kind: translated, id: 1112998 }
      - pl: "Udzieliła mi przyjacielskiej rady."
        ru: "Она дала мне дружеский совет."
        source: { kind: translated, id: 364340 }
  - id: grant-permission
    ru: "дать, выдать (разрешение, слово)"
    examples:
      - pl: "Nie mam uprawnień, by udzielić ci pozwolenia."
        ru: "У меня нет полномочий дать тебе разрешение."
        source: { kind: translated, id: 925731 }
      - pl: "Dziękuję za udzielenie mi głosu."
        ru: "Спасибо, что дали мне слово."
        source: { kind: translated, id: 5377706 }
notes:
  - { kind: government, text: "ГЛАВНОЕ: КОМУ в дательном, ЧТО в РОДИТЕЛЬНОМ — udzielić komuś pomocy, udzielić odpowiedzi. Русское «оказать помощь» берёт винительный, так что падеж дополнения расходится." }
  - { kind: false-friend, text: "От dzielić «делить», которое уже есть в словаре: буквально «уделить». Русское «уделить» — тот же состав и тот же корень." }
  - { kind: usage, text: "Частые сочетания: udzielić pomocy «оказать помощь», udzielić odpowiedzi «дать ответ», udzielić wywiadu «дать интервью», udzielić głosu «дать слово»." }
  - { kind: usage, text: "Несовершенный вид — udzielać. С się значит «передаваться»: śmiech się udziela «смех заразителен»." }
collocations:
  - { pl: "udzielić pomocy", ru: "оказать помощь" }
  - { pl: "udzielić odpowiedzi", ru: "дать ответ" }
  - { pl: "udzielić wywiadu", ru: "дать интервью" }
etymology: "u- + dzielić «делить»; русское «уделить» — тот же состав и корень."
memory: "udzielić — «оказать, дать». Падежи: КОМУ в дательном, ЧТО в РОДИТЕЛЬНОМ — udzielić komuś pomocy. Несовершенный вид — udzielać."
idioms:
  - { pl: "udzielić pomocy", ru: "оказать помощь" }
  - { pl: "udzielić wywiadu", ru: "дать интервью" }
formExamplesSkip:
  - { form: "udzieleni", reason: "страдательное причастие мужского лица, а udzielić ставит человека в ДАТЕЛЬНЫЙ падеж, а даваемое — в винительный: udzielić komuś rady, udzielić komuś pomocy. Подлежащим страдательного оборота становится совет или помощь, но не человек" }
