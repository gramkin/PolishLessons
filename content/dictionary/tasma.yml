# review
id: tasma
format: 2
lemma: "taśma"
rank: 1680
pos: noun
pron: { cyr: "та́сьма" }
senses:
  - id: tape
    ru: "лента, тесьма"
    examples:
      - pl: "Policja odgrodziła teren żółtą taśmą."
        ru: "Полиция огородила территорию жёлтой лентой."
        source: { kind: translated, id: 11750126 }
      - pl: "Przyklej to taśmą klejącą."
        ru: "Приклей это скотчем."
        source: { kind: authored }
      - pl: "Kupiłem rolkę taśmy."
        ru: "Я купил рулон ленты."
        source: { kind: authored }
  - id: film-tape
    ru: "плёнка, кассетная лента"
    examples:
      - pl: "Wyślę ci mój głos na taśmie."
        ru: "Я пришлю тебе свой голос на плёнке."
        source: { kind: translated, id: 358768 }
      - pl: "W tej kamerze nie ma taśmy."
        ru: "В этой камере нет плёнки."
        source: { kind: translated, id: 6306804 }
      - pl: "Po ponownym odtworzeniu taśmy sędzia przyznał, że piłka przekroczyła linię."
        ru: "После повторного просмотра записи судья признал, что мяч пересёк линию."
        source: { kind: translated, id: 10477264 }
notes:
  - { kind: usage, text: "taśma klejąca — «скотч», клейкая лента; taśma izolacyjna — «изолента»." }
  - { kind: usage, text: "В технике taśma — «конвейер»: praca przy taśmie «работа на конвейере», produkcja taśmowa «конвейерное производство»." }
  - { kind: government, text: "На плёнке — na taśmie (предложный падеж); лентой — taśmą (творительный)." }
  - { kind: false-friend, text: "Русская «тесьма» — то же самое слово, но по-польски taśma гораздо шире: это и скотч, и плёнка, и конвейер." }
collocations:
  - { pl: "taśma klejąca", ru: "скотч" }
  - { pl: "nagrać na taśmę", ru: "записать на плёнку" }
  - { pl: "praca przy taśmie", ru: "работа на конвейере" }
family:
  - { pl: "taśmowy", ru: "ленточный, конвейерный", relation: root }
etymology: "Из немецкого через чешский; русское «тесьма» пришло из тюркских языков, поэтому слова похожи лишь внешне."
memory: "taśma — «лента» в самом широком смысле: taśma klejąca «скотч», nagrać na taśmę «записать на плёнку», praca przy taśmie «работа на конвейере»."
idioms:
  - { pl: "taśma klejąca", ru: "скотч" }
  - { pl: "nagrać na taśmę", ru: "записать на плёнку" }
  - { pl: "produkcja taśmowa", ru: "конвейерное производство" }
