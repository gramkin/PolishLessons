# review
id: odrzynac
format: 2
lemma: "odrzynać"
rank: 2465
pos: verb
aspect: imperf
pron: { cyr: "оджы́наць" }
senses:
  - id: cut-off
    ru: "отрезать, отпиливать"
    examples:
      - pl: "Odrzynał deskę piłą."
        ru: "Он отпиливал доску пилой."
        source: { kind: authored }
      - pl: "Nie odrzynaj za dużo."
        ru: "Не отрезай слишком много."
        source: { kind: authored }
      - pl: "Odrzynali gałęzie jedną po drugiej."
        ru: "Они отпиливали ветки одну за другой."
        source: { kind: authored }
  - id: sever
    ru: "отсекать, отделять"
    examples:
      - pl: "Maszyna odrzyna kawałki blachy."
        ru: "Машина отрезает куски жести."
        source: { kind: authored }
      - pl: "Odrzynano zbędne części."
        ru: "Лишние части отрезали."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Речь именно о медленном резании пилой или ножом — отсюда оттенок «отпиливать». Обычное «отрезать» — odciąć." }
  - { kind: government, text: "Винительный падеж: odrzynać deskę. Чем — творительный: piłą, nożem." }
  - { kind: false-friend, text: "Корень rznąć «резать», ср. русское «резать». Не путайте с rzec «сказать»: odrzec значит «ответить», совсем другое слово." }
  - { kind: usage, text: "Совершенный вид — odrznąć или oderznąć. В корпусе глагол не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "odrzynać piłą", ru: "отпиливать пилой" }
etymology: "od- + rznąć «резать»; ср. русское «резать», «отрезать»."
memory: "odrzynać — «отпиливать, отрезать» медленно, пилой. Обычное «отрезать» — odciąć. И не путайте с odrzec «ответить»: корни разные."
idioms:
  - { pl: "odrzynać piłą", ru: "отпиливать пилой" }
