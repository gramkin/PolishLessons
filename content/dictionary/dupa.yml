# review
id: dupa
format: 2
lemma: "dupa"
rank: 695
pos: noun
pron: { cyr: "ду́па" }
senses:
  - id: butt
    ru: "задница, жопа"
    examples:
      - pl: "Podoba mi się twoja dupa."
        ru: "Мне нравится твоя жопа."
        source: { kind: tatoeba, id: 11692208 }
      - pl: "Niezła dupa!"
        ru: "Отличная задница!"
        source: { kind: translated, id: 10547331 }
      - pl: "Dupa mnie boli od tego siedzenia."
        ru: "У меня задница болит от этого сидения."
        source: { kind: translated, id: 10902206 }
      - pl: "Rusz dupę!"
        ru: "Шевели задницей!"
        source: { kind: translated, id: 9714667 }
      - pl: "Pocałuj mnie w dupę."
        ru: "Поцелуй меня в задницу."
        source: { kind: translated, id: 1353565 }
      - pl: "Uratowałeś mi dupę."
        ru: "Ты спас мою задницу."
        source: { kind: translated, id: 1110271 }
  - id: idiomatic
    ru: "в оборотах: mieć w dupie, do dupy"
    examples:
      - pl: "Mam to w dupie."
        ru: "Мне на это плевать."
        source: { kind: translated, id: 1353730 }
      - pl: "Miłość jest do dupy."
        ru: "Любовь — дерьмо."
        source: { kind: translated, id: 9714658 }
      - pl: "Przedstawienie było do dupy."
        ru: "Представление было никудышное."
        source: { kind: translated, id: 7184803 }
notes:
  - { kind: register, text: "Грубое, вульгарное слово, прямой эквивалент русского «жопа». Нейтральные замены — pośladki (анатомически) и tyłek (разговорно, но мягко)." }
  - { kind: usage, text: "mieć coś w dupie — «класть на что-то», буквально «иметь в жопе»: Mam to w dupie «Мне на это плевать»." }
  - { kind: usage, text: "do dupy — «никудышный, хреновый»: film do dupy «фильм — дрянь». Оборот ставится после существительного." }
  - { kind: usage, text: "Ruszyć dupę «шевелить задницей» — грубоватая подгонялка, как и по-русски." }
collocations:
  - { pl: "mieć coś w dupie", ru: "плевать на что-то" }
  - { pl: "do dupy", ru: "отстой, хреново (букв. «до задницы»)" }
  - { pl: "rusz dupę", ru: "шевели задницей" }
etymology: "Праславянское *dupa «дыра, углубление». Русское «дупло» — того же корня, а значение «зад» развилось уже в польском."
memory: "dupa — «жопа», грубо. Два оборота обязательны: mam to w dupie «мне на это плевать» и do dupy «никудышный»."
idioms:
  - { pl: "mieć coś w dupie", ru: "плевать на что-то" }
  - { pl: "do dupy", ru: "отстой, хреново (букв. «до задницы»)" }
  - { pl: "rusz dupę", ru: "шевели задницей" }
