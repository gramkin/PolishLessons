# review
id: bliski
format: 2
lemma: "bliski"
rank: 539
pos: adj
pron: { cyr: "бли́ски" }
senses:
  - id: close
    ru: "близкий (о расстоянии, времени, сходстве)"
    note: "bliski czegoś — с родительным: bliski płaczu «близок к слезам»."
    examples:
      - pl: "Twój koniec jest bliski."
        ru: "Твой конец близок."
        source: { kind: tatoeba, id: 8664051 }
      - pl: "Byłem bliski płaczu."
        ru: "Я был близок к слезам."
        source: { kind: translated, id: 3718059 }
      - pl: "Gdy ujrzała krew, była bliska omdlenia."
        ru: "Увидев кровь, она была близка к обмороку."
        source: { kind: translated, id: 516494 }
  - id: close-person
    ru: "близкий (о людях); bliscy — близкие, родные"
    note: "bliski przyjaciel «близкий друг», moi bliscy «мои близкие»."
    examples:
      - pl: "Tom to mój bardzo bliski przyjaciel."
        ru: "Том — мой очень близкий друг."
        source: { kind: tatoeba, id: 5909089 }
      - pl: "Tomek i Maria to bliscy krewni."
        ru: "Том и Мэри близкие родственники."
        source: { kind: tatoeba, id: 3460834 }
      - pl: "Bob jest moim bliskim przyjacielem."
        ru: "Боб — мой близкий друг."
        source: { kind: tatoeba, id: 5510825 }
  - id: nearest
    ru: "najbliższy — ближайший"
    note: "Самая нужная формула в дороге: Gdzie jest najbliższa…?"
    examples:
      - pl: "Gdzie jest najbliższa apteka?"
        ru: "Где ближайшая аптека?"
        source: { kind: tatoeba, id: 555388 }
      - pl: "Gdzie jest najbliższy kościół?"
        ru: "Где находится ближайшая церковь?"
        source: { kind: tatoeba, id: 1350586 }
      - pl: "Gdzie jest najbliższe centrum handlowe?"
        ru: "Где ближайший торговый центр?"
        source: { kind: tatoeba, id: 357288 }
notes:
  - { kind: government, text: "bliski czegoś строится с родительным падежом там, где русский требует предлога: bliski płaczu «близок к слезам», bliska omdlenia «близка к обмороку»." }
  - { kind: usage, text: "Возможен и дательный: jego świadectwo jest bliskie prawdzie «его показания близки к правде». Оба варианта живые." }
  - { kind: usage, text: "Степени правильные: bliski — bliższy — najbliższy. Мужской личный во множественном: bliscy, bliżsi, najbliżsi." }
  - { kind: usage, text: "Существительное bliscy значит «близкие, родные», а застывшее z bliska — «вблизи»: obserwować z bliska." }
collocations:
  - { pl: "bliski przyjaciel", ru: "близкий друг" }
  - { pl: "najbliższa apteka", ru: "ближайшая аптека" }
  - { pl: "w najbliższym czasie", ru: "в ближайшее время" }
  - { pl: "z bliska", ru: "вблизи" }
family:
  - { pl: "blisko", ru: "близко", relation: root }
  - { pl: "bliskość", ru: "близость", relation: derived }
  - { pl: "zbliżyć się", ru: "приблизиться", relation: derived }
etymology: "От праславянского *blizъ «близкий» — то же слово, что русское «близкий»; отсюда же blisko «близко» и zbliżyć się «приблизиться»."
memory: "bliski — «близкий», и отличие в управлении: bliski czegoś идёт с родительным там, где русский ставит предлог «к» — bliski płaczu «близок к слезам», bliska omdlenia «близка к обмороку» (дательный тоже возможен: bliskie prawdzie). Степени правильные: bliski — bliższy — najbliższy, мужской личный во множественном — bliscy, bliżsi, najbliżsi. И запомните дорожную формулу: Gdzie jest najbliższa apteka? «Где ближайшая аптека?»"
idioms:
  - { pl: "bliski przyjaciel", ru: "близкий друг" }
  - { pl: "z bliska", ru: "вблизи" }
  - { pl: "Bliższa ciału koszula niż sukmana", ru: "Своя рубашка ближе к телу" }
