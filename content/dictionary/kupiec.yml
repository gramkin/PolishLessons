      - pl: "Na ten obraz nie ma kupca."
        ru: "На эту картину нет покупателя."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KUPIEC — и историческое «купец», и современный «покупатель» крупной вещи: KUPIEC NA DOM, NA SAMOCHÓD. Покупатель в магазине — KLIENT." }
  - { kind: usage, text: "Одиннадцать форм, мужской род, лицо. Беглое E: KUPIEC, но KUPCA, KUPCY. Звательный KUPCZE — книжный и сказочный, обычный — KUPCU." }
  - { kind: government, text: "Покупатель на что — KUPIEC NA, и винительный: KUPIEC NA DZIAŁKĘ. Найти покупателя — ZNALEŹĆ KUPCA, винительный в форме родительного." }
  - { kind: pronunciation, text: "Читается «ку́пец», ударение на первом слоге. PIE — «пе»." }
collocations:
  - { pl: "znaleźć kupca", ru: "найти покупателя" }
  - { pl: "bogaty kupiec", ru: "богатый купец" }
  - { pl: "kupiec na dom", ru: "покупатель на дом" }
family:
  - { pl: "kupić", ru: "купить", relation: root, id: kupic }
  - { pl: "kupno", ru: "покупка", relation: root }
  - { pl: "kupiecki", ru: "купеческий", relation: derived }
etymology: "От KUPIĆ «купить» с суффиксом деятеля -IEC. Русское «купец» построено так же."
memory: "Kupiec — купец и покупатель: kupiec na mieszkanie. Читается «ку́пец». Kupcy — купцы. Kupić kota w worku — купить кота в мешке."
idioms:
  - { pl: "kupić kota w worku", ru: "купить кота в мешке" }
