        ru: "Отец был купцом, а сын стал поэтом."
        source: { kind: authored }
  - id: buyer
    ru: "покупатель (на дом, машину)"
    examples:
      - pl: "Znaleźliśmy kupca na mieszkanie."
        ru: "Мы нашли покупателя на квартиру."
