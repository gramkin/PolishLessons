# review
id: pilot
format: 2
lemma: "pilot"
rank: 1485
pos: noun
pron: { cyr: "пи́лот" }
senses:
  - id: pilot
    ru: "пилот, лётчик"
    examples:
      - pl: "Tom chce zostać pilotem."
        ru: "Том хочет стать пилотом."
        source: { kind: tatoeba, id: 529701 }
      - pl: "Pilot żartuje ze stewardesą."
        ru: "Пилот шутит со стюардессой."
        source: { kind: translated, id: 12035312 }
      - pl: "Oni są pilotami."
        ru: "Они пилоты."
        source: { kind: tatoeba, id: 831843 }
  - id: remote
    ru: "пульт дистанционного управления"
    examples:
      - pl: "Pilot nie działa."
        ru: "Пульт не работает."
        source: { kind: translated, id: 11111523 }
      - pl: "Oddaj mi pilota!"
        ru: "Отдай мне пульт!"
        source: { kind: translated, id: 4465781 }
      - pl: "Jest pilot do telewizora pod kanapą."
        ru: "Пульт от телевизора под диваном."
        source: { kind: translated, id: 387120 }
notes:
  - { kind: false-friend, text: "Главная неожиданность для русского: pilot значит не только «пилот», но и «пульт дистанционного управления». Pilot nie działa — это «Пульт не работает», а вовсе не про лётчика." }
  - { kind: usage, text: "Любопытная мелочь: о пульте говорят как об одушевлённом — Oddaj mi pilota!, винительный совпадает с родительным, хотя речь о вещи." }
  - { kind: usage, text: "Третье значение — «сопровождающий группы»: pilot wycieczki «руководитель экскурсии»." }
  - { kind: government, text: "В именной части сказуемого творительный: Jestem pilotem, chcę zostać pilotem." }
collocations:
  - { pl: "pilot do telewizora", ru: "пульт от телевизора" }
  - { pl: "zostać pilotem", ru: "стать пилотом" }
  - { pl: "pilot wycieczki", ru: "руководитель экскурсии" }
etymology: "Из французского pilote, изначально «лоцман». Русский «пилот» пришёл тем же путём, но значение «пульт» развилось только в польском."
memory: "pilot — и «пилот», и «пульт от телевизора». Pilot nie działa значит «Пульт не работает» — это главная неожиданность. А pilot wycieczki это «руководитель экскурсии»."
idioms:
  - { pl: "pilot do telewizora", ru: "пульт от телевизора" }
  - { pl: "pilot automatyczny", ru: "автопилот" }
  - { pl: "pilot wycieczki", ru: "руководитель экскурсии" }
