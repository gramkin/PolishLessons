notes:
  - { kind: false-friend, text: "ПОЛЬСКИЙ И РУССКИЙ ВЗЯЛИ ОДНО НЕМЕЦКОЕ СЛОВО И РАЗОШЛИСЬ В РОДЕ. Польская SZAFA женского рода: ta szafa, duża szafa. Русский «шкаф» мужского, и звучит иначе, потому что пришёл через нижненемецкое schap. Поэтому сказать ten szafa нельзя, а прилагательное всегда женское." }
  - { kind: usage, text: "Предложный — w SZAFIE, с мягким fi. Уменьшительное szafka значит «шкафчик» и употребляется очень часто: szafka kuchenna, szafka nocna «ночной столик». Отдельно запомни szafa grająca — «музыкальный автомат», буквально «играющий шкаф»." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: SZA-fa. Sz читается как ш: «ша́фа». Родительный множественного — szaf, с нулевым окончанием и глухим ф на конце." }
collocations:
  - { pl: "szafa grająca", ru: "музыкальный автомат" }
  - { pl: "w szafie", ru: "в шкафу" }
  - { pl: "szafa pancerna", ru: "сейф" }
family:
  - { pl: "szafka", ru: "шкафчик", relation: derived }
  - { pl: "komoda", ru: "комод", relation: root }
  - { pl: "półka", ru: "полка", relation: root }
etymology: "Из средневерхненемецкого schaf «шкаф, полка», родственного schaffen «устраивать». Русский «шкаф» — то же германское слово, но через нижненемецкое schap, отсюда и другой вид, и другой род. Польский сделал его женским по окончанию -a."
memory: "szafa — «шкаф», но женского рода: ta szafa, duża szafa. Предложный — w szafie. И запомни szafa grająca, буквально «играющий шкаф» — музыкальный автомат."
idioms:
  - { pl: "szafa grająca", ru: "музыкальный автомат" }
  - { pl: "trup w szafie", ru: "скелет в шкафу" }
