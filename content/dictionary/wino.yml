notes:
  - { kind: false-friend, text: "ФОРМА WINA ЗНАЧИТ ДВЕ СОВЕРШЕННО РАЗНЫЕ ВЕЩИ. Это родительный от wino «вино» (kieliszek wina) и одновременно именительный от wina «вина, провинность» (to moja wina). Различает только контекст и род: wino среднего рода, wina женского. Предложный у них тоже совпадает: w winie." }
  - { kind: usage, text: "Среднего рода, поэтому dobre wino, czerwone wino, а не dobry. Именительный множественного — WINA, то есть совпадает с родительным единственного: dwa wina «два вина». Прилагательное от напитка — winny «винный», но winny значит ещё и «виновный», от той самой wina." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: WI-no. Польское wi звучит мягко, как «ві»: «ві́но». Предложный winie читается «ві́не», а не «вине»." }
collocations:
  - { pl: "czerwone wino", ru: "красное вино" }
  - { pl: "białe wino", ru: "белое вино" }
  - { pl: "kieliszek wina", ru: "рюмка вина" }
family:
  - { pl: "winnica", ru: "виноградник", relation: derived }
  - { pl: "wina", ru: "вина, провинность", relation: root, id: wina }
  - { pl: "piwo", ru: "пиво", relation: root, id: piwo }
etymology: "Из латинского vinum, пришедшего к славянам вместе с виноделием; то же слово дало русское «вино», немецкое Wein и английское wine. Латинское vinum, вероятно, само заимствовано из какого-то средиземноморского языка. С wina «вина» родства нет — это случайное совпадение."
memory: "wino — «вино», среднего рода: dobre wino. Главная ловушка в форме wina: это и «вина» родительный от wino, и «вина, провинность» в именительном. Множественное тоже wina: dwa wina."
idioms:
  - { pl: "w winie prawda", ru: "истина в вине" }
  - { pl: "lać jak wino", ru: "литься как вино" }
