notes:
  - { kind: false-friend, text: "STOWARZYSZENIE — «общество, объединение» в смысле организации, от TOWARZYSZ «товарищ»: союз товарищей. Это не коммерческое «товарищество»: фирма — SPÓŁKA. А «общество» как всё население — SPOŁECZEŃSTWO." }
  - { kind: usage, text: "Восемь форм, средний род на -ENIE. Родительный множественного — STOWARZYSZEŃ, без окончания и с Ń. Ударение всегда на предпоследнем слоге: STOWARZYSZENIA «стоважышэ́ня»." }
  - { kind: government, text: "Общество кого — родительный: STOWARZYSZENIE MIŁOŚNIKÓW KOTÓW, «общество любителей кошек». Вступить в общество — ZAPISAĆ SIĘ DO STOWARZYSZENIA, состоять в нём — NALEŻEĆ DO STOWARZYSZENIA: DO с родительным." }
  - { kind: pronunciation, text: "Читается «стоважышэ́не», ударение на предпоследнем слоге. RZ — «ж», SZ — «ш», как в TOWARZYSZ «това́жыш». NIE — «не»." }
  - { kind: register, text: "Слово официальное: так называется юридическая форма некоммерческой организации. В разговоре говорят и короче: KLUB, ZWIĄZEK, FUNDACJA — у каждого свой правовой статус." }
