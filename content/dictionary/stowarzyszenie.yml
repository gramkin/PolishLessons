etymology: "От STOWARZYSZYĆ SIĘ «объединиться в товарищество», от TOWARZYSZ «товарищ». Польское RZ на месте русского «р», SZ — на месте «щ»: TOWARZYSZ — «товарищ»."
memory: "Stowarzyszenie — общество, объединение: союз товарищей, towarzyszy. Читается «стоважышэ́не». Należeć do stowarzyszenia — состоять в обществе."
