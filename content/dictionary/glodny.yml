# review
id: glodny
format: 2
lemma: "głodny"
rank: 978
pos: adj
pron: { cyr: "гуо́дны" }
senses:
  - id: hungry
    ru: "голодный"
    examples:
      - pl: "Jestem głodny."
        ru: "Я хочу есть."
        source: { kind: translated, id: 356518 }
      - pl: "Jestem głodna."
        ru: "Я голодная."
        source: { kind: translated, id: 1354335 }
      - pl: "Jesteśmy głodni."
        ru: "Мы голодные."
        source: { kind: translated, id: 980956 }
  - id: be-hungry
    ru: "jestem głodny — я голоден, я хочу есть"
    note: "Русское «я хочу есть» по-польски передаётся прилагательным, а не глаголом."
    examples:
      - pl: "Jesteś głodny?"
        ru: "Ты голодный?"
        source: { kind: translated, id: 716033 }
      - pl: "Moje dziecko jest głodne."
        ru: "Мой ребёнок голоден."
        source: { kind: translated, id: 10695803 }
      - pl: "Pies musi być głodny."
        ru: "Должно быть, собака голодна."
        source: { kind: translated, id: 1896057 }
  - id: craving
    ru: "głodny czegoś — жаждущий чего-то"
    examples:
      - pl: "Jest głodny sukcesu."
        ru: "Он жаждет успеха."
        source: { kind: authored }
      - pl: "Głodny wiedzy student czyta wszystko."
        ru: "Жаждущий знаний студент читает всё."
        source: { kind: authored }
      - pl: "Są głodni zwycięstwa."
        ru: "Они жаждут победы."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Jestem głodny — «я голоден, я хочу есть». Там, где русский берёт глагол «хочу есть», польский обходится прилагательным." }
  - { kind: usage, text: "Род обязателен и слышен сразу: мужчина говорит jestem głodny, женщина — jestem głodna. Перепутать нельзя." }
  - { kind: government, text: "głodny czegoś — «жаждущий чего-то», с родительным падежом: głodny sukcesu «жаждущий успеха», głodny wiedzy «жаждущий знаний»." }
  - { kind: usage, text: "Степени сравнения в живой речи почти не встречаются: вместо głodniejszy обычно говорят bardziej głodny." }
collocations:
  - { pl: "jestem głodny", ru: "я голоден" }
  - { pl: "głodny jak wilk", ru: "голодный как волк" }
  - { pl: "głodne dziecko", ru: "голодный ребёнок" }
  - { pl: "głodny czegoś", ru: "жаждущий чего-то" }
family:
  - { pl: "głód", ru: "голод", relation: root }
  - { pl: "głodować", ru: "голодать", relation: derived }
  - { pl: "syty", ru: "сытый", relation: antonym }
etymology: "От głód «голод», праславянское *goldъ — то же слово, что русское «голод». Разница только в полногласии: русское «голод» против польского głód."
memory: "głodny — «голодный», и это ещё способ сказать «я хочу есть»: jestem głodny. Род обязателен — мужчина говорит głodny, женщина głodna. А głodny czegoś значит «жаждущий чего-то», с родительным падежом."
idioms:
