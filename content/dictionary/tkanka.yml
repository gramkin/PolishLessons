notes:
  - { kind: false-friend, text: "Русское «ткань» покрывает и материал, и биологическую ткань, а польский развёл их по двум словам, и путать нельзя. TKANKA — только биологическая: TKANKA MIĘŚNIOWA «мышечная ткань», TKANKA KOSTNA, TKANKA ŁĄCZNA «соединительная ткань». Материал, из которого шьют, называется TKANINA: TKANINA BAWEŁNIANA «хлопчатобумажная ткань», SKLEP Z TKANINAMI «магазин тканей». Сказать TKANKA о материале — ошибка заметная, как по-русски назвать мышцу мануфактурой. Переносное употребление у TKANKA есть и совпадает с русским: TKANKA MIEJSKA «городская ткань», TKANKA SPOŁECZNA." }
  - { kind: usage, text: "В дательном и местном падеже единственного числа K переходит в C: TKANCE, как MATKA даёт MATCE и PUSZKA даёт PUSZCE. В родительном множественного появляется беглая гласная E, разбивающая скопление NK: TKANEK, а не «tkank». Оба хода стандартны для основ на -KA, и тот же набор виден в WÓDKA с WÓDCE и WÓDEK. Сравните с третьим словом карточки: у ROZPRAWA основа кончается на губной W, и он перед -IE просто смягчается, без всякого чередования — ROZPRAWIE." }
  - { kind: government, text: "Женский род. Какая ткань — прилагательное: TKANKA MIĘŚNIOWA, TKANKA NERWOWA «нервная ткань», TKANKA TŁUSZCZOWA «жировая ткань». Чего ткань — родительный: TKANKA PŁUCA. Частотные глаголы: POBRAĆ TKANKĘ «взять ткань на анализ», BADAĆ TKANKĘ, PRZESZCZEPIĆ TKANKĘ «пересадить ткань». В медицинских текстах обычно во множественном: BADANIE TKANEK. Прилагательное TKANKOWY значит «тканевый», а глагол того же корня — TKAĆ «ткать»." }
  - { kind: pronunciation, text: "Читается «тка́нка», два слога, ударение на первом. Начальное TK выговаривается слитно, без гласной между т и к. Группа NK произносится с задним н, как в русском «банка». В дательном и местном TKANCE сочетание NC даёт «нц»: «тка́нце». В родительном множественного TKANEK вставная E читается «э»: «тка́нэк». Все три формы различаются на слух ясно, и спутать их трудно." }
