etymology: "От TKAĆ «ткать», из праславянского *tъkati, того же корня, что русские «ткать», «ткань», «уток». Суффикс -KA образует здесь название вещества по способу его устройства: ткань тела названа так же, как ткань на станке, по переплетению волокон. Русский обошёлся одним словом «ткань» для обоих случаев, а польский построил два: TKANINA с суффиксом -INA для материала и TKANKA с суффиксом -KA для биологической ткани. Разделение произошло в девятнадцатом веке, когда складывалась медицинская терминология, и оказалось удобным настолько, что держится без исключений. Из того же гнезда идут TKACZ «ткач», TKACTWO «ткачество» и WĄTEK «уток, сюжетная линия», где исходное переплетение видно в переносном смысле."
memory: "Русская «ткань» в польском распадается на два слова: tkanka — только биологическая (tkanka mięśniowa, kostna, łączna), tkanina — материал для шитья (sklep z tkaninami). Путать значит ошибаться заметно. Дательный и местный tkance, с k→c; родительный множественного tkanek, с беглой e — как wódce и wódek. У rozprawa тот же -ie, но w только смягчается."
