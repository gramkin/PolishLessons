  - id: character
    ru: "натура, характер, склад"
    examples:
      - pl: "Jest łagodny z natury."
        ru: "Он мягкий по натуре."
        source: { kind: translated, id: 366062 }
      - pl: "Pomaganie innym nie leżało w jego naturze."
        ru: "Помогать другим было не в его натуре."
        source: { kind: translated, id: 6406081 }
notes:
  - { kind: usage, text: "Женский род, как и русское слово. Предложный — w naturze." }
  - { kind: usage, text: "Два значения ровно как в русском: «природа» и «натура, характер». z natury — «по натуре, от природы»: Jest łagodny z natury." }
  - { kind: usage, text: "Исконный синоним для природы — przyroda. Natura чаще о природе как силе и о характере человека, przyroda — о живой природе, растениях и животных." }
  - { kind: usage, text: "martwa natura — «натюрморт», буквально «мёртвая натура», калька с французского nature morte." }
collocations:
  - { pl: "z natury", ru: "по натуре" }
  - { pl: "martwa natura", ru: "натюрморт" }
  - { pl: "prawa natury", ru: "законы природы" }
etymology: "Из латинского natura «природа, рождение» (от nasci «рождаться») через европейские языки. В русский слово пришло дважды: как заимствование «натура» и как калька «природа»."
memory: "natura — и «природа», и «натура, характер», ровно как в русском. z natury значит «по натуре, от природы». Для живой природы чаще говорят przyroda, а martwa natura — это «натюрморт»."
