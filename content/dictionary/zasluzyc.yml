notes:
  - { kind: government, text: "zasłużyć NA coś — с предлогом na и винительным, а не прямым винительным: zasłużyć na nagrodę, zasłużyć na szacunek. Русский говорит «заслужить награду» без предлога, и это частая ошибка." }
  - { kind: usage, text: "Совершенный вид к zasługiwać, которое уже есть карточкой." }
  - { kind: usage, text: "Часто с sobie: Czym sobie na to zasłużyłem? «Чем я это заслужил?»." }
  - { kind: usage, text: "Причастие zasłużony значит «заслуженный»: zasłużony pracownik. Существительное — zasługa «заслуга»." }
collocations:
  - { pl: "zasłużyć na szacunek", ru: "заслужить уважение" }
  - { pl: "zasłużyć na karę", ru: "заслужить наказание" }
  - { pl: "dobrze sobie zasłużyć", ru: "вполне заслужить" }
etymology: "Приставка za- и służyć «служить» (праславянское *sluga). Русское «заслужить» собрано из тех же частей."
memory: "zasłużyć — «заслужить», но предлог другой: zasłużyć NA coś, а по-русски просто «заслужить что-то». Zasłużyć na szacunek «заслужить уважение». Часто с sobie: Czym sobie na to zasłużyłem?"
idioms:
  - { pl: "zasłużyć na szacunek", ru: "заслужить уважение" }
