# review
id: przesadzic
format: 2
lemma: "przesadzić"
rank: 4332
pos: verb
aspect: perf
pron: { cyr: "пшэса́дзиць" }
senses:
  - id: overdo
    ru: "преувеличить, перегнуть палку, переборщить"
    examples:
      - pl: "Tom przesadził."
        ru: "Том перегнул палку."
        source: { kind: translated, id: 5221771 }
      - pl: "Przesadziłem."
        ru: "Я перегнул палку."
        source: { kind: translated, id: 516460 }
      - pl: "Tym razem przesadziłaś."
        ru: "На этот раз ты перегнула палку."
        source: { kind: translated, id: 4305808 }
  - id: transplant
    ru: "пересадить (растение)"
    examples:
      - pl: "Przesadziłem kwiaty do większej doniczki."
        ru: "Я пересадил цветы в горшок побольше."
        source: { kind: authored }
      - pl: "Przesadziłem roślinę na balkon."
        ru: "Я пересадил растение на балкон."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — przesadzać." }
  - { kind: usage, text: "Два значения: «преувеличить, перегнуть палку» (самое частое) и буквальное «пересадить растение»." }
  - { kind: government, text: "В значении «переборщить» — с предлогом z и творительным: przesadzić z solą «переборщить с солью»." }
  - { kind: false-friend, text: "Не «посадить в тюрьму». Корень sadzić «сажать»: prze- «пере-» + sadzić, как русское «пересадить»." }
collocations:
  - { pl: "przesadzić z czymś", ru: "переборщить с чем-л." }
  - { pl: "nie przesadzajmy", ru: "не будем преувеличивать" }
etymology: "prze- + sadzić «сажать» — ровно как русское «пересадить». Значение «преувеличить» выросло из образа «пересадить за пределы меры»."
memory: "przesadzić — и «пересадить» (растение), и «перегнуть палку». Второе значение встречается чаще: przesadziłem «я перегнул палку». Несовершенный вид — przesadzać."
idioms:
  - { pl: "nie przesadzajmy", ru: "не будем преувеличивать" }
  - { pl: "przesadzić z czymś", ru: "переборщить с чем-л." }
formExamplesSkip:
  - { form: "przesadzeni", reason: "значения этой карточки — «переборщить» и «пересадить растение», и ни одно не берёт человека дополнением. Форма принадлежит другому употреблению — przesadzić kogoś do innej ławki «пересадить кого-то за другую парту», которого карточка не описывает" }
