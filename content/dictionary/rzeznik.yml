rank: 5197
pos: noun
pron: { cyr: "жэ́зьник" }
senses:
  - id: butcher
    ru: "мясник"
    examples:
      - pl: "Rzeźnik naostrzył nóż."
        ru: "Мясник наточил нож."
        source: { kind: authored }
      - pl: "U rzeźnika kupiłam kiełbasę."
        ru: "У мясника я купила колбасу."
        source: { kind: authored }
      - pl: "Rzeźnicy pracują w chłodni."
