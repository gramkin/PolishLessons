  - id: brute
    ru: "живодёр, мясник (о жестоком или неумелом человеке)"
    examples:
      - pl: "Gazety nazwały dyktatora rzeźnikiem."
        ru: "Газеты назвали диктатора мясником."
        source: { kind: authored }
      - pl: "Ten dentysta to rzeźnik!"
        ru: "Этот стоматолог — настоящий живодёр!"
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "RZEŹNIK — «мясник», от старого RZEZAĆ «резать». Это и продавец мяса, и человек, разделывающий туши. Скотобойня — RZEŹNIA, а RZEŹ — «резня, бойня»: RZEŹ NIEWINIĄTEK — «избиение младенцев». В переносном смысле RZEŹNIK — жестокий человек или неумелый хирург." }
  - { kind: usage, text: "Десять форм, мужской род, лицо. Во множественном K переходит в C: RZEŹNICY. Винительный равен родительному: ZNAM TEGO RZEŹNIKA." }
  - { kind: government, text: "Купить у мясника — KUPIĆ U RZEŹNIKA, U с родительным. Пойти к мяснику — IŚĆ DO RZEŹNIKA, DO с родительным. Быть мясником — BYĆ RZEŹNIKIEM, творительный." }
  - { kind: pronunciation, text: "Читается «жэ́зьник», два слога, ударение на первом. RZ — «ж», Ź перед N — мягкое «зь». Во множественном RZEŹNICY: «жэзьни́цы»." }
  - { kind: register, text: "Слово нейтральное, бытовое. Мясную лавку чаще называют SKLEP MIĘSNY. Переносное значение — грубое и разговорное." }
collocations:
  - { pl: "sklep rzeźnika", ru: "мясная лавка" }
  - { pl: "nóż rzeźnika", ru: "нож мясника" }
  - { pl: "dobry rzeźnik", ru: "хороший мясник" }
family:
  - { pl: "rzezać", ru: "резать (стар.)", relation: root }
  - { pl: "rzez", ru: "резня, бойня", relation: derived }
  - { pl: "rzeźnia", ru: "скотобойня", relation: derived }
etymology: "От старого RZEZAĆ «резать», праславянского глагола, общего с русским «резать». Польское RZ на месте русского «р» перед «е» — обычное соответствие, как RZEKA и «река»."
memory: "Rzeźnik — мясник, от rzezać «резать». Читается «жэ́зьник». Kupić u rzeźnika — купить у мясника. Rzeźnia — бойня, rzeź — резня. Iść jak owca na rzeź — идти как на заклание."
idioms:
  - { pl: "iść jak owca na rzeź", ru: "идти как овца на заклание" }
  - { pl: "kupić u rzeźnika", ru: "купить у мясника" }
