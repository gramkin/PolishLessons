etymology: "Из праславянского *minati, многократной формы к *minǫti, и это те же два слова, что русские «миновать» и «минуть». Чередование основ MIJ- и MIN- в польской паре MIJAĆ-MINĄĆ повторяет русское «миновать-минуть», так что здесь языки устроены одинаково. Дальше корень родственен латинскому MEARE «идти» и, через идею прохождения, слову MIMO. Вот в MIMO и лежит расхождение: русский закрепил «мимо» за пространством, а польский развил у того же слова уступительное значение «несмотря на», видимо через оборот вроде «пройдя мимо этого», то есть «оставив это в стороне». Пространственную работу в польском взяли на себя OBOK и KOŁO. Один корень, два разных распределения, и именно поэтому знакомое на вид MIMO в польском тексте чаще всего значит не то, что подсказывает русский."
memory: "Корень как в русском «миновать», и пара основ совпадает: mijać-minąć, «миновать-минуть». Но два капкана. Первый — падеж: mijać переходный и берёт винительный без предлога, mijam dom, тогда как русский требует «мимо дома». Второй — слово mimo: в современном польском оно значит «несмотря на» (mimo to, mimo deszczu), а «мимо» передаётся через obok и koło. И полезный оборот: mijać się z prawdą — «расходиться с истиной», то есть лгать."
