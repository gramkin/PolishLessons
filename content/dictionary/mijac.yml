notes:
  - { kind: government, text: "Главная ошибка русскоязычных в этом слове — не значение, а падеж. Польское MIJAĆ переходное и требует винительного без всякого предлога: MIJAM DOM, MIJAM SZKOŁĘ, MIJAM GO NA SCHODACH. Русский же строит это с предлогом и родительным: «прохожу мимо дома». Поэтому фразу «я прохожу мимо дома» нельзя переводить как MIJAM MIMO DOMU — такой конструкции нет, и слово MIMO тут вообще не нужно. Отрицание переводит дополнение в родительный, как у всех переходных глаголов: NIE MIJAM TEGO DOMU. Возвратное MIJAĆ SIĘ значит «разъезжаться, проходить навстречу друг другу»: SAMOCHODY MIJAJĄ SIĘ NA WĄSKIEJ DRODZE." }
  - { kind: false-friend, text: "Слово MIMO, однокоренное с MIJAĆ, в современном польском значит прежде всего «несмотря на», а не «мимо»: MIMO TO «несмотря на это», MIMO WSZYSTKO «несмотря на всё», MIMO DESZCZU «несмотря на дождь». Пространственное значение «мимо» у него осталось только в книжных оборотах вроде PRZEJŚĆ MIMO, а в обычной речи «мимо» передаётся словами OBOK и KOŁO: PRZESZEDŁ OBOK DOMU. Для русскоязычного это ловушка в обе стороны: MIMO DESZCZU можно понять как «мимо дождя», а нужное «мимо дома» построить через MIMO, которого там быть не должно. Корень в обоих языках один, но польский увёл его в уступительное значение." }
  - { kind: usage, text: "Несовершенный вид, переходный, шестьдесят три формы: сорок две от глагола, десять от действительного причастия MIJAJĄCY, одиннадцать от страдательного MIJANY. Совершенная пара — MINĄĆ, и в ней другая основа: MIJ- в несовершенном, MIN- в совершенном. Русский делает то же самое в паре «миновать» и «минуть», так что чередование знакомо. Приставочное PRZEMIJAĆ значит «проходить, быть мимолётным» и употребляется о чувствах и славе: WSZYSTKO PRZEMIJA. Существительное MIJANKA — это разъезд на узкой дороге или однопутной железной дороге, место, где можно разъехаться." }
  - { kind: pronunciation, text: "Читается «ми́яць», два слога, ударение на первом. Буква J даёт «й», и сочетание JA звучит как «я»: MI-JAĆ, «ми-яць». Конечное Ć — мягкое «ць». В формах настоящего времени J сохраняется: MIJAM это «ми́ям», MIJAJĄ — «мия́йон» с носовым на конце. В деепричастии MIJAJĄC три слога, ударение на предпоследнем: «мия́йонц». В причастии MIJAJĄCY четыре слога, ударение на предпоследнем: «мияйо́нцы». Нигде в парадигме J не исчезает, и в этом MIJAĆ проще, чем выглядит." }
