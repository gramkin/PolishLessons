notes:
  - { kind: usage, text: "Слово совпадает с русским «пожар» и по значению, и по звучанию — редкий случай полного совпадения." }
  - { kind: usage, text: "straż pożarna «пожарная охрана» и strażak «пожарный» — прилагательное от pożar." }
  - { kind: usage, text: "w razie pożaru «в случае пожара» — стандартная формула на табличках." }
collocations:
  - { pl: "w razie pożaru", ru: "в случае пожара" }
  - { pl: "przyczyna pożaru", ru: "причина пожара" }
  - { pl: "zginąć w pożarze", ru: "погибнуть в пожаре" }
etymology: "Из po- + żar «жар», того же праславянского корня, что русские «жар» и «пожар». Слово собрано ровно так же, как русское, и значит то же самое."
memory: "pożar — «пожар», слово-близнец русского. Запомните табличку w razie pożaru «в случае пожара» и straż pożarna «пожарная охрана»."
idioms:
