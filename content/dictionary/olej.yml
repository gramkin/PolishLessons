notes:
  - { kind: false-friend, text: "Русское «масло» покрывает сразу всё, а польский делит это поле на три слова, и выбрать нужно верно. OLEJ — масло растительное и техническое: OLEJ SŁONECZNIKOWY, OLEJ SILNIKOWY. MASŁO — только сливочное, из молока: MASŁO NA CHLEB. OLIWA — оливковое масло, и для него есть своё слово, хотя OLIWA Z OLIWEK тоже говорят. Поэтому попросить MASŁO для сковороды значит попросить сливочное, а это не то же самое. Русское «елей», церковное масло, родственно польскому OLEJ напрямую: оба в конечном счёте от греческого названия оливкового масла." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — OLEJU, с окончанием -U, как у всех основ на -J. Родительных множественного два: OLEJÓW и более короткое OLEI, и оба правильны; OLEI чаще встречается в технических текстах и в описи товара. Именительный и винительный множественного — OLEJE, и множественное употребляется, когда речь о сортах и видах масла или о картинах, написанных маслом. Винительный единственного равен именительному. Материал выражается предлогом Z: PLACKI Z OLEJU не говорят, зато SMAŻYĆ NA OLEJU с предлогом NA." }
  - { kind: pronunciation, text: "Читается «о́лей», два слога, ударение на первом. Польское L мягче русского твёрдого «л», а конечное J даёт «й», как в русском «олей». В форме OLEJU слышно «оле́ю», в форме OLEJEM — «оле́ем». Во множественном OLEJE звучит «оле́е». Короткий родительный OLEI читается «оле́и», и его легко спутать на слух с именительным множественного; на письме разница в последней букве. В форме OLEJÓW буква Ó даёт «у», а конечное W оглушается: «оле́юф»." }
  - { kind: register, text: "Слово нейтральное и бытовое, с тремя отдельными областями употребления: кухня, техника и живопись. Устойчивые сочетания: OLEJ RZEPAKOWY «рапсовое масло», самое обычное в польской кухне, OLEJ NAPĘDOWY «дизельное топливо», WYMIANA OLEJU «замена масла», MALOWAĆ OLEJEM «писать маслом». Разговорное MIEĆ OLEJ W GŁOWIE значит «иметь голову на плечах», о человеке рассудительном, и употребляется часто и одобрительно. Отрицание тоже живое: BRAK MU OLEJU W GŁOWIE." }
