etymology: "Из латинского OLEUM «масло», а оно — из греческого ELAION, названия оливкового масла, от ELAIA «олива». Слово разошлось по всей Европе вместе с самим продуктом: немецкое ÖL, английское OIL, чешское OLEJ, и польский получил его через чешское и немецкое посредство. Русский знает тот же корень в слове «елей», пришедшем прямо из греческого через церковнославянский и сохранившем церковное значение, а для обиходного масла оставил исконное «масло» — от глагола «мазать», с суффиксом -сло, как «весло» от «везти». Поэтому у поляка одно слово для растительного масла заимствованное, а у русского своё, и общая у них только «олива»."
memory: "Русское «масло» покрывает всё, польский делит: olej растительное и техническое, masło только сливочное, oliwa оливковое. Слово от латинского oleum и греческого elaion «оливковое масло» — тот же корень, что в русском «елее», тогда как «масло» своё, от «мазать». Местный oleju на -u, как у всех основ на j; два родительных множественного, olejów и olei. И очень живое: mieć olej w głowie значит «иметь голову на плечах»."
idioms:
  - { pl: "mieć olej w głowie", ru: "иметь голову на плечах" }
