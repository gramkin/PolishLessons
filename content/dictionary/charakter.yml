# review
id: charakter
format: 2
lemma: "charakter"
rank: 2188
pos: noun
pron: { cyr: "хара́ктэр" }
senses:
  - id: character
    ru: "характер, нрав"
    examples:
      - pl: "On ma sympatyczny charakter."
        ru: "У него приятный характер."
        source: { kind: translated, id: 359906 }
      - pl: "Mam raczej ponury charakter."
        ru: "У меня скорее мрачный характер."
        source: { kind: translated, id: 409929 }
      - pl: "Jest kobietą o silnym charakterze."
        ru: "Это женщина с сильным характером."
        source: { kind: translated, id: 1615060 }
  - id: nature
    ru: "характер, свойство (дела, проблемы)"
    examples:
      - pl: "Wiele problemów ekologicznych nabrało dzisiaj międzynarodowego charakteru i dla ich rozwiązania niezbędne są wspólne wysiłki wielu państw."
        ru: "Многие экологические проблемы сегодня приобрели международный характер, и для их решения необходимы совместные усилия многих стран."
        source: { kind: tatoeba, id: 8670299 }
      - pl: "Przyjechał do Japonii w charakterze prezydenta."
        ru: "Он приехал в Японию в качестве президента."
        source: { kind: translated, id: 645041 }
notes:
  - { kind: false-friend, text: "Третье значение русскому уху чуждо: w charakterze kogoś значит «в качестве кого-л.», а не «в характере». Przyjechał w charakterze prezydenta — «приехал в качестве президента»." }
  - { kind: government, text: "O silnym charakterze «с сильным характером» — предлог o с предложным, а не «с» с творительным, как в русском." }
  - { kind: usage, text: "nabrać charakteru «приобрести характер, свойство» — о деле, вопросе, проблеме." }
  - { kind: usage, text: "Мужской неодушевлённый; родительный — charakteru. Значение «почерк» тоже есть: charakter pisma." }
collocations:
  - { pl: "silny charakter", ru: "сильный характер" }
  - { pl: "w charakterze", ru: "в качестве" }
  - { pl: "charakter pisma", ru: "почерк" }
etymology: "Из греческого charaktēr «отпечаток, клеймо» через латынь; русское «характер» — то же слово и тот же путь."
memory: "charakter — «характер», но держите в голове оборот w charakterze kogoś «в качестве кого-л.», которого у русского слова нет. И charakter pisma значит «почерк»."
idioms:
