# review
id: dopiac
format: 2
lemma: "dopiąć"
rank: 5618
pos: verb
aspect: perf
pron: { cyr: "до́пьонць" }
senses:
  - id: button-up
    ru: "застегнуть (до конца)"
    examples:
      - pl: "Nie była w stanie dopiąć zamka na spódnicy."
        ru: "Она не могла застегнуть молнию на юбке."
        source: { kind: translated, id: 931107 }
      - pl: "Dopnij płaszcz, jest zimno."
        ru: "Застегни пальто, холодно."
        source: { kind: authored }
      - pl: "Nie mogę dopiąć guzika."
        ru: "Я не могу застегнуть пуговицу."
        source: { kind: authored }
  - id: achieve
    ru: "добиться, довести до конца"
    examples:
      - pl: "Firmowi prawnicy pracują na okrągło, żeby dopiąć fuzję."
        ru: "Юристы фирмы работают круглые сутки, чтобы довести слияние до конца."
        source: { kind: translated, id: 363793 }
      - pl: "Gdyby jeszcze trochę wytrzymała, dopięłaby swego."
        ru: "Продержись она ещё немного, добилась бы своего."
        source: { kind: translated, id: 837056 }
notes:
  - { kind: usage, text: "Запомните идиому dopiąć swego «добиться своего» — с родительным падежом swego, а не винительным. Она встречается чаще прямого значения." }
  - { kind: false-friend, text: "Корень piąć «взбираться, натягивать»; отсюда же spiąć «скрепить» и zapiąć «застегнуть». Русское «допинать» тут ни при чём." }
  - { kind: government, text: "Винительный падеж: dopiąć płaszcz, dopiąć guzik." }
  - { kind: usage, text: "Несовершенный вид — dopinać. Ещё один оборот: dopiąć czegoś na ostatni guzik «довести до полной готовности», буквально «застегнуть на последнюю пуговицу»." }
  - { kind: government, text: "Объект — вещь или дело, но не человек: dopiąć płaszcz, dopiąć fuzję. Поэтому страдательного причастия мужского лица dopięci нет, хотя действительное dopięli «они добились» обычно." }
collocations:
  - { pl: "dopiąć swego", ru: "добиться своего" }
  - { pl: "dopiąć na ostatni guzik", ru: "довести до полной готовности" }
etymology: "do- + piąć «натягивать, взбираться»; родня — zapiąć «застегнуть», spiąć «скрепить»."
memory: "dopiąć — «застегнуть» и «добиться». Главное здесь идиома dopiąć swego «добиться своего», с родительным падежом. Несовершенный вид — dopinać."
idioms:
  - { pl: "dopiąć swego", ru: "добиться своего" }
formExamplesSkip:
  - { form: "dopięci", reason: "страдательное причастие мужского лица, а застёгивают вещи: примечание к карточке даёт dopiąć płaszcz, dopiąć guzik, во втором значении объект — дело (dopiąć fuzję, dopiąć swego). Людей не застёгивают, поэтому формы нет. Действительное dopięli «они добились» существует и записано отдельно" }
