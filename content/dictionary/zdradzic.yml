# review
id: zdradzic
format: 2
lemma: "zdradzić"
rank: 1376
pos: verb
aspect: perf
pron: { cyr: "здра́дзиць" }
senses:
  - id: betray
    ru: "предать, изменить"
    examples:
      - pl: "Zdradziłeś swój kraj."
        ru: "Ты предал свою страну."
        source: { kind: tatoeba, id: 6694862 }
      - pl: "Tom nas zdradził."
        ru: "Том нас предал."
        source: { kind: translated, id: 10542202 }
      - pl: "Zdradził swoją ojczyznę."
        ru: "Он предал свою родину."
        source: { kind: translated, id: 357208 }
  - id: reveal
    ru: "открыть, раскрыть (тайну, секрет)"
    examples:
      - pl: "Zdradzę ci pewną tajemnicę."
        ru: "Я открою тебе одну тайну."
        source: { kind: translated, id: 991217 }
      - pl: "Mary zdradziła Johnowi tajemnicę."
        ru: "Мэри открыла Джону тайну."
        source: { kind: translated, id: 351442 }
  - id: give-away
    ru: "выдать (невольно — о взгляде, акценте, поведении)"
    examples:
      - pl: "Co mnie zdradziło?"
        ru: "Что меня выдало?"
        source: { kind: translated, id: 8770930 }
notes:
  - { kind: usage, text: "Совершенный вид к zdradzać." }
  - { kind: usage, text: "Смысл задаёт дополнение: zdradzić kogoś — «предать, изменить кому-то», zdradzić coś — «раскрыть, выдать». Zdradzę ci tajemnicę значит «Открою тебе тайну», а вовсе не «предам»." }
  - { kind: government, text: "zdradzić kogo/co, винительный: zdradzić przyjaciela, zdradzić ojczyznę, zdradzić sekret." }
  - { kind: false-friend, text: "Русские «предать» и «изменить (супругу)» по-польски оба zdradzić: zdradzić męża «изменить мужу». А «предать огласке» — это ujawnić." }
collocations:
  - { pl: "zdradzić tajemnicę", ru: "выдать тайну" }
  - { pl: "zdradzić przyjaciela", ru: "предать друга" }
  - { pl: "zdradzić męża", ru: "изменить мужу" }
etymology: "От zdrada «измена, предательство». Прямого русского родственника у корня нет, поэтому пару zdrada — zdradzić проще запоминать вместе."
memory: "zdradzić — и «предать», и «раскрыть тайну». Разницу задаёт дополнение: zdradzić przyjaciela «предать друга», но zdradzić tajemnicę «открыть тайну». Zdradzę ci sekret — это дружеское «расскажу тебе по секрету», без всякого предательства."
idioms:
  - { pl: "zdradzić tajemnicę", ru: "выдать тайну" }
  - { pl: "zdradzić ojczyznę", ru: "предать родину" }
  - { pl: "zdradzić się z czymś", ru: "выдать себя чем-то" }
