pos: adj
pron: { cyr: "спра́вны" }
senses:
  - id: efficient
    ru: "ловкий, умелый, расторопный; слаженный"
    examples:
      - pl: "To sprawny kierowca."
        ru: "Это умелый водитель."
        source: { kind: authored }
      - pl: "Akcja ratunkowa była sprawna."
