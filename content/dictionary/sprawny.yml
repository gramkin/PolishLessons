      - pl: "To najsprawniejszy urząd w mieście."
        ru: "Это самое расторопное учреждение в городе."
        source: { kind: authored }
  - id: working
    ru: "исправный (о технике); здоровый, бодрый (о теле)"
    examples:
      - pl: "Samochód jest sprawny technicznie."
        ru: "Машина технически исправна."
        source: { kind: authored }
      - pl: "Mimo wieku jest sprawny fizycznie."
        ru: "Несмотря на возраст, он в хорошей физической форме."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русскому «исправный» польское SPRAWNY родня, и в значении «работающий» они совпадают: SPRAWNY SAMOCHÓD. Но польское шире: о людях — «ловкий, умелый», о процессах — «слаженный, быстрый»: SPRAWNA OBSŁUGA. Человек с инвалидностью — OSOBA NIEPEŁNOSPRAWNA, буквально «не вполне исправный», это официальное и вежливое слово." }
  - { kind: usage, text: "Полная парадигма: SPRAWNY, SPRAWNIEJSZY, NAJSPRAWNIEJSZY. Все степени живые: SPRAWNIEJSZA ADMINISTRACJA. Мужское-личное: SPRAWNI, SPRAWNIEJSI, NAJSPRAWNIEJSI." }
  - { kind: government, text: "Умелый в чём-то — SPRAWNY W + местный: SPRAWNY W OBSŁUDZE KOMPUTERA. Исправен технически — SPRAWNY TECHNICZNIE, наречием. Наречие SPRAWNIE — «быстро и ловко»: WSZYSTKO POSZŁO SPRAWNIE." }
  - { kind: pronunciation, text: "Читается «спра́вны», два слога, ударение на первом. W перед N звонкое. В SPRAWNIEJSZY: «справне́йшы»." }
  - { kind: register, text: "Нейтральное слово. В официальном языке — SPRAWNOŚĆ, «эффективность», и NIEPEŁNOSPRAWNY, «с инвалидностью». В разговоре SPRAWNIE — похвала: «быстро, без проволочек»." }
collocations:
  - { pl: "sprawny technicznie", ru: "технически исправный" }
  - { pl: "sprawny fizycznie", ru: "в хорошей физической форме" }
  - { pl: "sprawna obsługa", ru: "расторопное обслуживание" }
family:
  - { pl: "sprawnie", ru: "ловко, быстро", relation: derived }
  - { pl: "niepełnosprawny", ru: "человек с инвалидностью", relation: derived }
  - { pl: "sprawność", ru: "ловкость; исправность; эффективность", relation: derived }
etymology: "От SPRAWA «дело», от PRAWY «правый, правильный», того же корня, что русское «исправный», «справиться». Ловкий — тот, кто справляется с делом. Польский развил значение «умелый», русский — «исправный»."
memory: "Sprawny — ловкий, умелый; исправный: sprawny kierowca, samochód sprawny technicznie. Niepełnosprawny — с инвалидностью. Sprawniejszy, najsprawniejszy. Читается «спра́вны»."
idioms:
  - { pl: "poszło sprawnie", ru: "прошло гладко, без проволочек" }
