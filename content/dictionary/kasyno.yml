notes:
  - { kind: false-friend, text: "В значении игорного дома слово совпадает с русским «казино» полностью, зато у него есть второе значение, которого русский одним словом не передаёт. KASYNO OFICERSKIE это офицерская столовая и собрание в одном: место, где офицеры едят и проводят свободное время. По-русски приходится выбирать между «офицерской столовой», «офицерским собранием» и «кают-компанией» в зависимости от рода войск. Это значение в польском старше игорного и в текстах о войне встречается чаще. Главное формальное отличие от русского: польское KASYNO склоняется — W KASYNIE, DO KASYNA, — тогда как русское «казино» неизменяемо." }
  - { kind: government, text: "Средний род на -O. Именительный и винительный совпадают: OTWORZYLI KASYNO. Родительный на -A: DO KASYNA. Местный на -IE, с чередованием N перед окончанием: W KASYNIE. Родительный множественного KASYN, без окончания. Куда идут — предлог DO с родительным: IŚĆ DO KASYNA. Где находятся — предлог W с местным: W KASYNIE. Что делают — GRAĆ W KASYNIE «играть в казино», где польский берёт предлог W с местным, а русский — с винительным." }
  - { kind: pronunciation, text: "Читается «касы́но», ударение на предпоследнем слоге из трёх. Буква Y звучит «ы», и это главное отличие на слух от русского «казино» с его «и». Буква S даёт «с», а не «з»: польское слово начинается «ка-сы», тогда как русское — «ка-зи». В местном падеже KASYNIE буква N смягчается перед -IE: «касы́не». В родительном множественного KASYN два слога: «ка́сын», и ударение остаётся на предпоследнем, то есть на первом." }
  - { kind: usage, text: "Частотные сочетания: KASYNO GRY «игорный дом» в официальном языке, GRAĆ W KASYNIE, KASYNO OFICERSKIE, KASYNO INTERNETOWE. Слово KASA с ним не связано, хотя выглядит похоже: KASA это касса и разговорно деньги. Прилагательное от KASYNO не употребляется, вместо него берут родительный: GRY KASYNA. В военных текстах встречается и форма KASYNO PODOFICERSKIE, для младшего командного состава, и это ещё одно значение, которому в русском отвечает описательный оборот." }
