etymology: "Из итальянского CASINO, уменьшительного от CASA «дом», то есть буквально «домик». Так в Италии называли сначала загородный флигель для приёмов и развлечений, а затем помещение для общества и игры, и в этом втором смысле слово разошлось по Европе. Военное значение, офицерская столовая и собрание, пришло в польский через немецкое KASINO в девятнадцатом веке и закрепилось раньше игорного. Русское «казино» взято из французского CASINO и осталось при одном значении и без склонения, как и большинство русских заимствований на -О. Польский же подчинил слово склонению среднего рода, и это та же разница в обращении с заимствованиями, что в паре ECHO и «эхо»."
memory: "Казино, но склоняется: w kasynie, do kasyna, родительный множественного kasyn — русское «казино» неизменяемо, как и «эхо», а польский склоняет оба. Y читается «ы», и S как «с»: «касы́но», а не «казино». Второе значение, которого в русском нет одним словом: kasyno oficerskie — офицерская столовая и собрание сразу, и в текстах о войне это значение старше игорного. Из итальянского casino, уменьшительного от casa «дом»."
