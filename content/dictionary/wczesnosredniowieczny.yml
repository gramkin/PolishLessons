id: wczesnosredniowieczny
format: 2
lemma: "wczesnośredniowieczny"
rank: 5849
pos: adj
pron: { cyr: "фчэсносьрэдньовье́чны" }
senses:
  - id: early-medieval
    ru: "раннесредневековый"
    examples:
      - pl: "Wczesnośredniowieczny gród stał na wyspie."
        ru: "Раннесредневековое городище стояло на острове."
        source: { kind: authored }
      - pl: "Archeolodzy odkopali wczesnośredniowieczną łódź."
        ru: "Археологи откопали раннесредневековую лодку."
        source: { kind: authored }
      - pl: "Napisała książkę o wczesnośredniowiecznej Europie."
        ru: "Она написала книгу о раннесредневековой Европе."
        source: { kind: authored }
      - pl: "W muzeum są wczesnośredniowieczne monety."
        ru: "В музее есть раннесредневековые монеты."
        source: { kind: authored }
