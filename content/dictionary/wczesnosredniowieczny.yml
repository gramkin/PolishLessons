notes:
  - { kind: register, text: "Слово книжное и научное: его встречаешь в учебниках истории, музейных табличках и путеводителях, а не в разговоре. Оно относительное, степеней сравнения не имеет, поэтому форм одиннадцать. Ближайший русский эквивалент «раннесредневековый» устроен точно так же и звучит так же официально." }
  - { kind: usage, text: "Пишется слитно, одним словом: WCZESNO- + ŚREDNIOWIECZNY. Существительное же пишется раздельно: WCZESNE ŚREDNIOWIECZE «раннее Средневековье». По той же схеме строятся PÓŹNOŚREDNIOWIECZNY «позднесредневековый» и WCZESNOCHRZEŚCIJAŃSKI «раннехристианский». Слово ŚREDNIOWIECZE буквально «средний век», как немецкое Mittelalter." }
  - { kind: pronunciation, text: "Начальное W перед глухим CZ оглушается в «ф»: «фчэсно…». Дальше идёт мягкое ŚR, «сьр», затем NIO, читаемое как «ньо», и ударение на предпоследнем слоге WIECZ: «фчэсносьрэдньовье́чны». В длинном слове держится одно главное ударение, без побочных." }
collocations:
  - { pl: "wczesnośredniowieczny gród", ru: "раннесредневековое городище" }
  - { pl: "sztuka wczesnośredniowieczna", ru: "раннесредневековое искусство" }
  - { pl: "państwo wczesnośredniowieczne", ru: "раннесредневековое государство" }
family:
  - { pl: "wczesny", ru: "ранний", relation: root, id: wczesny }
  - { pl: "średniowieczny", ru: "средневековый", relation: root }
  - { pl: "średniowiecze", ru: "Средневековье", relation: root }
etymology: "Сложение wczesno- (от wczesny «ранний») и średniowieczny «средневековый», которое образовано от średniowiecze, буквально «средний век». Русское «раннесредневековый» собрано из тех же частей."
memory: "Разбирается по кусочкам, как русское слово: wczesno «рано» + średnio «средне» + wieczny «вековой». Пишется слитно, а wczesne średniowiecze — раздельно."
idioms:
  - { pl: "grodzisko wczesnośredniowieczne", ru: "раннесредневековое городище (археологический термин)" }
