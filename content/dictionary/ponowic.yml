# review
id: ponowic
format: 2
lemma: "ponowić"
rank: 2251
pos: verb
aspect: perf
pron: { cyr: "поно́виць" }
senses:
  - id: repeat
    ru: "повторить, возобновить"
    examples:
      - pl: "Ponowił prośbę po tygodniu."
        ru: "Он повторил просьбу через неделю."
        source: { kind: authored }
      - pl: "Trzeba ponowić próbę."
        ru: "Нужно повторить попытку."
        source: { kind: authored }
      - pl: "Ponowię pytanie."
        ru: "Я повторю вопрос."
        source: { kind: authored }
  - id: renew
    ru: "возобновить (договор, подписку)"
    examples:
      - pl: "Ponowili umowę na rok."
        ru: "Они возобновили договор на год."
        source: { kind: authored }
      - pl: "Czy mogę ponowić zamówienie?"
        ru: "Могу я повторить заказ?"
        source: { kind: authored }
notes:
  - { kind: government, text: "Винительный падеж: ponowić prośbę, ponowić próbę, ponowić zamówienie." }
  - { kind: usage, text: "Официальное слово: в обычной речи скажут powtórzyć «повторить»." }
  - { kind: false-friend, text: "Корень nowy «новый»: буквально «сделать заново». Русское «возобновить» от «новый» устроено так же." }
  - { kind: usage, text: "Несовершенный вид — ponawiać. В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "ponowić próbę", ru: "повторить попытку" }
  - { pl: "ponowić prośbę", ru: "повторить просьбу" }
etymology: "po- + nowy «новый»: сделать заново; ср. русское «возобновить», «обновить»."
memory: "ponowić — «повторить, возобновить», слово официальное: ponowić próbę, ponowić umowę. В обиходе — powtórzyć. Несовершенный вид — ponawiać."
