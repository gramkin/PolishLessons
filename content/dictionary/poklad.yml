# review
id: poklad
format: 2
lemma: "pokład"
rank: 1275
pos: noun
pron: { cyr: "по́куат" }
senses:
  - id: deck
    ru: "палуба; борт судна или самолёта"
    examples:
      - pl: "Wejdź na pokład."
        ru: "Поднимайся на борт."
        source: { kind: translated, id: 8539906 }
      - pl: "Oni weszli na pokład statku."
        ru: "Они поднялись на борт корабля."
        source: { kind: translated, id: 529056 }
      - pl: "Dowódco, pokład gotowy do lądowania."
        ru: "Командир, борт готов к посадке."
        source: { kind: tatoeba, id: 1736704 }
  - id: on-board
    ru: "na pokładzie — на борту"
    examples:
      - pl: "Witaj na pokładzie."
        ru: "Добро пожаловать на борт."
        source: { kind: translated, id: 10597378 }
      - pl: "Czy jest lekarz na pokładzie statku?"
        ru: "На борту корабля есть врач?"
        source: { kind: tatoeba, id: 11264098 }
      - pl: "Na pokładzie samolotu było 50 pasażerów."
        ru: "На борту самолёта было пятьдесят пассажиров."
        source: { kind: translated, id: 665858 }
  - id: layer
    ru: "пласт, залежь (полезного ископаемого)"
    examples:
      - pl: "Statek miał trzy pokłady."
        ru: "У корабля было три палубы."
        source: { kind: translated, id: 8454383 }
      - pl: "Odkryto nowe pokłady węgla."
        ru: "Обнаружены новые залежи угля."
        source: { kind: authored }
      - pl: "Pod ziemią są bogate pokłady soli."
        ru: "Под землёй богатые залежи соли."
        source: { kind: authored }
notes:
  - { kind: government, text: "na pokładzie «на борту» — предлог na с предложным падежом, а wejść na pokład «подняться на борт» — с винительным." }
  - { kind: usage, text: "Witamy na pokładzie! «Добро пожаловать на борт!» — стандартное объявление в самолёте и на судне." }
  - { kind: usage, text: "Второе значение — геологическое: pokłady węgla «залежи угля». Переносно — pokłady energii «запасы энергии»." }
  - { kind: pronunciation, text: "Конечное d оглушается, а ł звучит как «у»: по́куат." }
collocations:
  - { pl: "na pokładzie", ru: "на борту" }
  - { pl: "wejść na pokład", ru: "подняться на борт" }
  - { pl: "pokłady węgla", ru: "залежи угля" }
etymology: "От pokładać «укладывать», из po- и kłaść «класть»: палуба — то, что уложено поперёк корпуса. Русское «покласть» и «пласт» — из того же гнезда."
memory: "pokład — «палуба» и «борт»: na pokładzie «на борту», wejść na pokład «подняться на борт». Второе значение геологическое: pokłady węgla «залежи угля». Конечное d оглушается: по́куат."
idioms:
