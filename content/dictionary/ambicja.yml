# review
id: ambicja
format: 2
lemma: "ambicja"
rank: 4983
pos: noun
pron: { cyr: "амби́цья" }
senses:
  - id: ambition
    ru: "амбиция, честолюбие, стремление"
    examples:
      - pl: "Ambicja pchała go do przodu."
        ru: "Честолюбие толкало его вперёд."
        source: { kind: authored }
      - pl: "Brakuje mu ambicji."
        ru: "Ему не хватает целеустремлённости."
        source: { kind: authored }
      - pl: "Ma wielkie ambicje."
        ru: "У него большие амбиции."
        source: { kind: authored }
  - id: pride
    ru: "самолюбие, гордость"
    examples:
      - pl: "Ta uwaga uraziła jego ambicję."
        ru: "Это замечание задело его самолюбие."
        source: { kind: authored }
      - pl: "Zrobił to z ambicji, nie dla pieniędzy."
        ru: "Он сделал это из самолюбия, а не ради денег."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Польская AMBICJA — не только «амбиция», но и «самолюбие, гордость»: URAZIĆ CZYJĄŚ AMBICJĘ — «задеть чьё-то самолюбие». Слово скорее одобрительное: AMBITNY — «целеустремлённый», это похвала. Более того, AMBITNY фильм или книга — «серьёзный, высокого уровня»: AMBITNE KINO — авторское кино, а не «амбициозное»." }
  - { kind: usage, text: "Десять форм в таблице, женский род. Родительный, дательный и местный единственного совпадают: AMBICJI. Множественное AMBICJE — «амбиции, планы»: MIEĆ WIELKIE AMBICJE. Старинная форма AMBICYJ и звательная AMBICJO сегодня не нужны." }
  - { kind: government, text: "Из самолюбия — Z AMBICJI, родительный. Задеть самолюбие — URAZIĆ AMBICJĘ, винительный. Стремление что-то сделать — AMBICJA с придаточным после ŻEBY: MA AMBICJĘ, ŻEBY WYGRAĆ." }
  - { kind: pronunciation, text: "Читается «амби́цья», три слога, ударение на втором: CJA в конце звучит одним слогом, «цья», как в LEKCJA «ле́кцья»." }
  - { kind: register, text: "NIE MIEĆ AMBICJI — «не иметь самолюбия», о том, кто терпит унижение или не стремится к большему: CZY TY NIE MASZ AMBICJI? — «у тебя совсем гордости нет?». URAŻONA AMBICJA — «уязвлённое самолюбие»." }
collocations:
  - { pl: "wielkie ambicje", ru: "большие амбиции" }
  - { pl: "ambicje polityczne", ru: "политические амбиции" }
  - { pl: "urazić czyjąś ambicję", ru: "задеть чьё-то самолюбие" }
family:
  - { pl: "ambitny", ru: "целеустремлённый; серьёзный, высокого уровня", relation: derived }
  - { pl: "ambicjonalny", ru: "связанный с самолюбием", relation: derived }
  - { pl: "ambitnie", ru: "целеустремлённо; с размахом", relation: derived }
etymology: "Из латинского AMBITIO, буквально «хождение вокруг»: так в Риме кандидат обходил избирателей. Русский и польский взяли одно слово; польский оставил окончание -CJA, а русский переделал его в «-ция»."
memory: "Ambicja — амбиция и самолюбие: urazić ambicję — задеть самолюбие. Читается «амби́цья». Ambitny — целеустремлённый, ambitne kino — авторское кино. Czy ty nie masz ambicji? — у тебя совсем гордости нет?"
idioms:
  - { pl: "nie mieć ambicji", ru: "не иметь самолюбия, ни к чему не стремиться" }
  - { pl: "urażona ambicja", ru: "уязвлённое самолюбие" }
formExamplesSkip:
  - { form: "ambicyj", reason: "архаичная форма родительного множественного; сейчас AMBICJI" }
  - { form: "ambicjo", reason: "звательная форма; на практике не употребляется" }
