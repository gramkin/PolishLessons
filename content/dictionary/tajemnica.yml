# review
id: tajemnica
format: 2
lemma: "tajemnica"
rank: 829
pos: noun
pron: { cyr: "таемни́ца" }
senses:
  - id: secret
    ru: "тайна, секрет"
    examples:
      - pl: "Chcesz poznać tajemnicę?"
        ru: "Хочешь узнать секрет?"
        source: { kind: tatoeba, id: 3457078 }
      - pl: "Ujawniła tajemnicę."
        ru: "Она выдала тайну."
        source: { kind: tatoeba, id: 1603792 }
      - pl: "Nie powinno być pomiędzy nami żadnych tajemnic."
        ru: "Между нами не должно быть никаких секретов."
        source: { kind: tatoeba, id: 4740497 }
  - id: mystery
    ru: "тайна, загадка, необъяснимое"
    examples:
      - pl: "Wszechświat jest pełen tajemnic."
        ru: "Вселенная полна тайн."
        source: { kind: tatoeba, id: 2679586 }
      - pl: "Tajemnica pozostaje nierozwiązana."
        ru: "Тайна остаётся неразгаданной."
        source: { kind: translated, id: 5441184 }
      - pl: "Daję panu słowo honoru, że to cudza tajemnica."
        ru: "Даю вам слово чести, что это чужая тайна."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово образовано от tajemny «тайный» с суффиксом -ica; корень тот же, что в русском «тайна» и «таить»." }
  - { kind: usage, text: "dochować tajemnicy — «сохранить тайну», с родительным падежом. Так же wyjawić tajemnicę «раскрыть тайну», но уже с винительным." }
  - { kind: usage, text: "publiczna tajemnica — «секрет Полишинеля», то, что все знают, но вслух не говорят." }
  - { kind: usage, text: "В канцелярском языке: tajemnica handlowa «коммерческая тайна», tajemnica lekarska «врачебная тайна»." }
collocations:
  - { pl: "dochować tajemnicy", ru: "сохранить тайну" }
  - { pl: "wyjawić tajemnicę", ru: "раскрыть тайну" }
  - { pl: "publiczna tajemnica", ru: "секрет Полишинеля" }
  - { pl: "w tajemnicy", ru: "втайне" }
etymology: "От прилагательного tajemny «тайный» с суффиксом -ica; корень тот же, что в русских «тайна» и «таить»."
memory: "tajemnica — «тайна, секрет», от tajemny «тайный»; корень общий с русским «таить». Запомните разное управление: dochować tajemnicy «сохранить тайну» требует родительного, а wyjawić tajemnicę «раскрыть тайну» — винительного. А publiczna tajemnica — это «секрет Полишинеля»."
idioms:
  - { pl: "dochować tajemnicy", ru: "сохранить тайну" }
  - { pl: "publiczna tajemnica", ru: "секрет Полишинеля" }
  - { pl: "w tajemnicy przed kimś", ru: "втайне от кого-то" }
