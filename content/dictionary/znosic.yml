# review
id: znosic
format: 2
lemma: "znosić"
rank: 1799
pos: verb
aspect: imperf
pron: { cyr: "зно́сиць" }
senses:
  - id: cannot-stand
    ru: "nie znosić — терпеть не мочь, ненавидеть"
    examples:
      - pl: "Nie znoszę go."
        ru: "Я его терпеть не могу."
        source: { kind: translated, id: 3452326 }
      - pl: "Nie znoszę tłumu."
        ru: "Я не люблю толпу."
        source: { kind: tatoeba, id: 351508 }
      - pl: "Nie znoszę poniedziałków."
        ru: "Я терпеть не могу понедельники."
        source: { kind: translated, id: 5223241 }
  - id: lay-eggs
    ru: "нести (яйца)"
    examples:
      - pl: "Kogut nie znosi jajek."
        ru: "Петух не несёт яиц."
        source: { kind: tatoeba, id: 6160051 }
      - pl: "Ptaki znoszą jajka."
        ru: "Птицы несут яйца."
        source: { kind: translated, id: 539867 }
      - pl: "Dziobak to ssak, który znosi jaja."
        ru: "Утконос — это млекопитающее, которое несёт яйца."
        source: { kind: tatoeba, id: 10808591 }
notes:
  - { kind: usage, text: "Самое частое употребление — отрицательное nie znoszę «терпеть не могу»: nie znoszę tłumu. Без отрицания в этом значении слово почти не встречается." }
  - { kind: usage, text: "Второе живое значение — «нести яйца»: kura znosi jajka. Отсюда и поговорка о курице, несущей золотые яйца." }
  - { kind: government, text: "Терпеть что-то — znosić coś (винительный падеж): nie muszę znosić tego hałasu." }
  - { kind: false-friend, text: "Русское «сносить» и польское znosić — одно слово, но значения разошлись: польское прежде всего «терпеть» и «нести яйца», а «сносить дом» будет rozbierać." }
collocations:
  - { pl: "nie znoszę", ru: "терпеть не могу" }
  - { pl: "znosić ból", ru: "терпеть боль" }
  - { pl: "kura znosi jajka", ru: "курица несёт яйца" }
family:
  - { pl: "znieść", ru: "вынести, отменить", relation: root }
  - { pl: "nosić", ru: "носить", relation: root, id: nosic }
  - { pl: "wytrzymać", ru: "выдержать", relation: root, id: wytrzymac }
etymology: "Приставка z- плюс nosić «носить» — то же слово, что русское «сносить». Значения разошлись: польское живёт как «терпеть» и «нести яйца»."
memory: "znosić — прежде всего «терпеть не мочь» в отрицании: nie znoszę tłumu «терпеть не могу толпу». Второе значение — «нести яйца»: kura znosi jajka."
idioms:
