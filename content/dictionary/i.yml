id: i
format: 2
lemma: "i"
rank: 12
pos: conj
pron: { cyr: "и" }
senses:
  - id: and
    ru: "и (соединительный союз)"
    examples:
      - pl: "Mamy kota i psa."
        ru: "У нас есть кошка и собака."
