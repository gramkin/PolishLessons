    source: { kind: authored }
  - form: "polegał"
    pl: "Zawsze polegał na bracie."
    ru: "Он всегда полагался на брата."
    source: { kind: authored }
  - form: "polegała"
    pl: "Jego praca polegała na nadzorowaniu pracowników w miejscu pracy."
    ru: "Его работа заключалась в надзоре за работниками на рабочем месте."
    source: { kind: translated, id: 735801 }
  - form: "polegała"
    pl: "Jej strategia polegała na osłabieniu, a potem wytrąceniu z równowagi przeciwnika."
    ru: "Её стратегия заключалась в том, чтобы ослабить, а потом вывести противника из равновесия."
    source: { kind: translated, id: 6406135 }
  - form: "polegała"
    pl: "Jej praca polegała na tłumaczeniu."
    ru: "Её работа заключалась в переводе."
    source: { kind: authored }
  - form: "polegałem"
