# review
id: polegac
format: 2
lemma: "polegać"
rank: 1720
pos: verb
aspect: imperf
pron: { cyr: "поле́гаць" }
senses:
  - id: rely
    ru: "полагаться на кого-либо, что-либо"
    examples:
      - pl: "Polegam na nim."
        ru: "Я на него полагаюсь."
        source: { kind: tatoeba, id: 8675043 }
      - pl: "Można na nim polegać."
        ru: "На него можно положиться."
        source: { kind: translated, id: 1822336 }
      - pl: "Nie polegaj na nim."
        ru: "Не полагайся на него."
        source: { kind: translated, id: 6729794 }
  - id: consist
    ru: "заключаться в чём-либо (polegać na tym, że)"
    examples:
      - pl: "Problem polega na tym, który wybrać."
        ru: "Проблема заключается в том, какой выбрать."
        source: { kind: translated, id: 403176 }
      - pl: "Jej praca polega na myciu naczyń."
        ru: "Её работа заключается в мытье посуды."
        source: { kind: translated, id: 956959 }
      - pl: "Przyjaźń polega na wzajemnym zrozumieniu."
        ru: "Дружба заключается во взаимопонимании."
        source: { kind: translated, id: 766100 }
notes:
  - { kind: government, text: "Всегда с na и предложным падежом: polegam na tobie «я полагаюсь на тебя». Русское «полагаться на» требует винительного — это главное расхождение." }
  - { kind: false-friend, text: "Второе значение русскому уху неожиданно: Na czym to polega? значит не «на чём это держится», а «в чём это заключается»." }
  - { kind: usage, text: "Можно на него положиться — można na nim polegać; нельзя — nie można na nim polegać." }
  - { kind: usage, text: "Близкое по смыслу ufać komuś «доверять кому-то» требует дательного падежа, а не предлога na." }
collocations:
  - { pl: "polegać na kimś", ru: "полагаться на кого-либо" }
  - { pl: "na czym to polega", ru: "в чём это заключается" }
  - { pl: "można na nim polegać", ru: "на него можно положиться" }
family:
  - { pl: "ufać", ru: "доверять", relation: root, id: ufac }
  - { pl: "niezawodny", ru: "надёжный", relation: root }
etymology: "Приставка po- плюс legać «лежать»: буквально «прилечь на что-то», то есть опереться. Русское «полагаться» построено от «класть» — образ очень близкий."
memory: "polegać — «полагаться», но всегда с na и предложным падежом: polegam na tobie. Второе значение ловушка: Na czym to polega? — «в чём это заключается?»"
idioms:
  - { pl: "można na nim polegać", ru: "на него можно положиться" }
  - { pl: "na czym to polega?", ru: "в чём это заключается?" }
  - { pl: "polegać jak na Zawiszy", ru: "положиться как на каменную стену" }
