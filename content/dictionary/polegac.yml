    ru: "Я полагался на Тома."
    source: { kind: translated, id: 11573491 }
  - form: "polegałem"
    pl: "Dotąd zawsze na tobie polegałem. To już koniec tego."
    ru: "До сих пор я всегда на тебя полагался. С этим покончено."
    source: { kind: translated, id: 13563634 }
  - form: "polegałem"
