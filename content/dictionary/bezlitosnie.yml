# review
id: bezlitosnie
format: 2
lemma: "bezlitośnie"
rank: 6073
pos: adv
pron: { cyr: "безлито́сьнье" }
senses:
  - id: mercilessly
    ru: "безжалостно, беспощадно — о том, кто не щадит"
    examples:
      - pl: "Osy zaatakowały nas bezlitośnie."
        ru: "Осы безжалостно напали на нас."
        source: { kind: translated, id: 822159 }
      - pl: "Krytycy bezlitośnie wyśmiali jego debiut."
        ru: "Критики беспощадно высмеяли его дебют."
        source: { kind: authored }
      - pl: "Wierzyciele bezlitośnie egzekwowali długi."
        ru: "Кредиторы безжалостно взыскивали долги."
        source: { kind: authored }
  - id: relentlessly
    ru: "нещадно, неумолимо — о солнце, времени, фактах"
    examples:
      - pl: "Słońce bezlitośnie prażyło nam karki."
        ru: "Солнце нещадно пекло нам шеи."
        source: { kind: authored }
      - pl: "Czas płynie bezlitośnie."
        ru: "Время неумолимо бежит."
        source: { kind: authored }
      - pl: "Lustro bezlitośnie pokazało każdą zmarszczkę."
        ru: "Зеркало безжалостно показало каждую морщину."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от BEZLITOSNY, «безжалостный»: BEZ + LITOŚĆ, «без жалости», — построено так же, как русское «без-жалост-но». Значит то же, что «безжалостно», «беспощадно», а о солнце, времени и правде — «нещадно», «неумолимо»: słońce bezlitośnie praży, «солнце нещадно печёт»." }
  - { kind: usage, text: "Рядом стоят OKRUTNIE и BEZWZGLĘDNIE. OKRUTNIE — «жестоко», с упором на причиняемую боль, и вдобавок разговорный усилитель (okrutnie zimno, «страшно холодно»); BEZLITOŚNIE усилителем не бывает. BEZWZGLĘDNIE — «беспощадно, не считаясь ни с чем», но также «безусловно»: bezwzględnie konieczne, «совершенно необходимо»." }
  - { kind: pronunciation, text: "«безлито́сьнье», ударение на предпоследнем слоге, -toś-. Ś перед N звучит мягко, «сь», и N тоже мягкое: -śnie — «сьнье». В превосходной степени ударение не сдвигается: najbezlitośniej — «найбезлито́сьньей»." }
  - { kind: government, text: "Неизменяемое наречие; степени — BEZLITOŚNIEJ, «безжалостнее», и NAJBEZLITOŚNIEJ, «безжалостнее всего». Обычно стоит рядом с глаголом, до или после него: bezlitośnie wyśmiać или wyśmiać bezlitośnie. С кем-то — через Z: obejść się z kimś bezlitośnie, «безжалостно обойтись с кем-то»." }
collocations:
  - { pl: "bezlitośnie wyśmiać", ru: "беспощадно высмеять" }
  - { pl: "bezlitośnie skrytykować", ru: "разнести в пух и прах" }
  - { pl: "słońce bezlitośnie praży", ru: "солнце нещадно печёт" }
  - { pl: "obejść się z kimś bezlitośnie", ru: "безжалостно обойтись с кем-то" }
family:
  - { pl: "litość", ru: "жалость, милосердие", relation: root, id: litosc }
  - { pl: "bezlitosny", ru: "безжалостный", relation: root }
  - { pl: "bezlitosność", ru: "безжалостность", relation: derived }
etymology: "От BEZLITOSNY, «безжалостный», из BEZ, «без», и LITOŚĆ, «жалость». LITOŚĆ — из старопольского LUTOŚĆ, от LUTOWAĆ, «жалеть»; праславянский корень *ljut- тот же, что в русском «лютый». Польский сдвинул его от «лютости» к «жалости», а русский сохранил значение «свирепый»."
memory: "Bez litości — «без жалости»: bezlitośnie = «безжалостно», слово собрано из тех же частей. Litość — дальний родственник русского «лютый», но значит обратное — «жалость»."
idioms:
  - { pl: "czas płynie bezlitośnie", ru: "время неумолимо бежит" }
  - { pl: "obejść się z kimś bezlitośnie", ru: "безжалостно обойтись с кем-то" }
