# review
id: prozno
format: 2
lemma: "próżno"
rank: 5681
pos: adv
pron: { cyr: "пру́жно" }
senses:
  - id: in-vain
    ru: "напрасно, тщетно"
    examples:
      - pl: "Nie zginął na próżno."
        ru: "Он погиб не напрасно."
        source: { kind: translated, id: 359357 }
      - pl: "Na próżno próbowałem ją przekonywać."
        ru: "Напрасно я пытался её убедить."
        source: { kind: translated, id: 856462 }
      - pl: "Na próżno próbowali przekupić świadka."
        ru: "Напрасно они пытались подкупить свидетеля."
        source: { kind: translated, id: 3653740 }
  - id: no-avail
    ru: "в обороте na próżno — впустую"
    examples:
      - pl: "Szukałem innych kartek, ale na próżno."
        ru: "Я искал другие листки, но напрасно."
        source: { kind: authored }
      - pl: "Czekaliśmy na próżno."
        ru: "Мы ждали напрасно."
        source: { kind: authored }
      - pl: "Na próżno prosił o pomoc."
        ru: "Напрасно он просил о помощи."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от próżny «пустой, тщетный». Русское «порожний» — то же самое слово, только сохранило исходный смысл «пустой»." }
  - { kind: usage, text: "Самый частый вид — оборот na próżno «напрасно, впустую»: Czekaliśmy na próżno." }
  - { kind: usage, text: "Синонимы: nadaremnie, na darmo, bezskutecznie." }
  - { kind: usage, text: "У próżny есть и второе значение — «тщеславный»: próżna kobieta «тщеславная женщина»." }
collocations:
  - { pl: "na próżno", ru: "напрасно" }
  - { pl: "próżny wysiłek", ru: "напрасное усилие" }
  - { pl: "nadaremnie", ru: "тщетно" }
etymology: "Наречие от próżny «пустой, тщетный», праславянское *porzdьnъ. Русское «порожний» — то же слово, сохранившее исходный смысл «пустой»."
memory: "próżno — «напрасно, тщетно», от próżny «пустой». Русский родственник узнаётся не сразу: это «порожний», сохранившее старое значение «пустой». Живёт слово прежде всего в обороте na próżno «напрасно, впустую»."
idioms:
