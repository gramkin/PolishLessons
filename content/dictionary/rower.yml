notes:
  - { kind: government, text: "Ездить на велосипеде — jeździć na rowerze, предложный падеж. Но «поехать на велосипеде» как средством — jechać rowerem, творительный без предлога. Русский в обоих случаях говорит «на велосипеде»." }
  - { kind: false-friend, text: "Слово от английской марки Rover: первые велосипеды в Польше были этой фирмы, и название стало нарицательным. Русское «велосипед» пришло из французского — общего корня нет." }
  - { kind: usage, text: "jazda na rowerze «езда на велосипеде», rowerzysta «велосипедист», ścieżka rowerowa «велодорожка»." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — roweru." }
collocations:
  - { pl: "jeździć na rowerze", ru: "ездить на велосипеде" }
  - { pl: "jechać rowerem", ru: "ехать на велосипеде" }
etymology: "От английской марки Rover: первые велосипеды в Польше были этой фирмы, и имя стало нарицательным. Русское «велосипед» — из французского, родства нет."
memory: "rower — «велосипед», от марки Rover. Главная ловушка — падеж: jeździć na rowerze (предложный), но jechać rowerem (творительный). Русский в обоих случаях скажет «на велосипеде»."
idioms:
  - { pl: "jeździć na rowerze", ru: "ездить на велосипеде" }
  - { pl: "jechać rowerem", ru: "ехать на велосипеде" }
formExamplesSkip:
  - { form: "rowerze", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
