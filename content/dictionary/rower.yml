senses:
  - id: bicycle
    ru: "велосипед"
    examples:
      - pl: "Czy to twój rower?"
        ru: "Это твой велосипед?"
        source: { kind: tatoeba, id: 552647 }
      - pl: "On ukradł rower."
        ru: "Он украл велосипед."
        source: { kind: tatoeba, id: 12960016 }
