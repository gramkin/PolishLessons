  - id: by-bike
    ru: "велосипед (в оборотах езды)"
    examples:
      - pl: "Ona nie umie jeździć na rowerze."
        ru: "Она не умеет ездить на велосипеде."
        source: { kind: tatoeba, id: 415334 }
      - pl: "Nie wolno jechać rowerem po chodniku."
        ru: "По тротуару нельзя ездить на велосипеде."
