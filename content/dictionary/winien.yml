  - { pl: "wina", ru: "вина", relation: root, id: wina }
etymology: "От WINA «вина», из праславянского *vina — того же слова, что русская «вина». Связь смыслов прямая: должник есть тот, на ком вина, обязательство понято как долг перед кем-то. Русский развёл эти значения по разным словам — «вина» и «должен», — а польский оставил их на одном корне, откуда и winien «должен», и winny «виновный», и powinien «следует»."
memory: "Пять форм и ни одной больше; время берётся у być: jestem winien. О долге — обычно, об обязанности — книжно, в разговоре powinien. И все пять форм совпадают с winny «виновный»."
idioms:
  - { pl: "nie jestem ci nic winien", ru: "я тебе ничего не должен" }
  - { pl: "winien jestem przeprosiny", ru: "я должен извиниться" }
