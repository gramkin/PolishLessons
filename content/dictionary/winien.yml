# review
id: winien
format: 2
lemma: "winien"
rank: 2839
pos: verb
pron: { cyr: "ви́нен" }
senses:
  - id: owing
    ru: "должен (о долге)"
    examples:
      - pl: "Jest mi winien sto złotych."
        ru: "Он мне должен сто злотых."
        source: { kind: authored }
      - pl: "Nie jestem ci nic winien."
        ru: "Я тебе ничего не должен."
        source: { kind: authored }
      - pl: "Jest mi winna przysługę."
        ru: "Она мне должна услугу."
        source: { kind: authored }
  - id: obliged
    ru: "должен (об обязанности)"
    examples:
      - pl: "Strony winny zawiadomić sąd."
        ru: "Стороны должны известить суд."
        source: { kind: authored }
      - pl: "To winno być gotowe do piątku."
        ru: "Это должно быть готово к пятнице."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Форм всего пять, и больше у слова нет: ни инфинитива, ни прошедшего, ни будущего собственного. Оно изменяется только по роду и числу — WINIEN, WINNA, WINNO, WINNI, WINNY, — а время берёт у глагола BYĆ: jestem winien, byłem winien, będę winien. Словарь выделяет эту пятёрку в особый разряд, и в тот же разряд попадает POWINIEN с формами powinna, powinno, powinni, powinny. То есть winien и powinien — пара, устроенная совершенно одинаково." }
  - { kind: usage, text: "Двум смыслам польского слова русский отвечает одним, и это облегчение. WINIEN значит «должен» и о деньгах (jest mi winien sto złotych), и об обязанности (strony winny zawiadomić sąd) — ровно как русское «должен». Разница в употреблении: о долге winien звучит совершенно обычно, а об обязанности оно книжно и живёт в законах и договорах; в разговоре вместо него берут POWINIEN — on powinien zadzwonić «он должен позвонить»." }
  - { kind: usage, text: "Все пять форм совпадают с формами слова WINNY, и это стоит держать в голове. WINNY — прилагательное «виновный», причём со степенями: winniejszy, najwinniejszy. Оно же бывает существительным: WINNY «виновный человек», WINNI «виновные». А сама форма WINIEN служит ещё и краткой формой того же прилагательного — из того разряда, куда входят świadom, zdrów, gotów. Поэтому WINNI означает и «они должны», и «виновные», и различает их только строй фразы." }
collocations:
  - { pl: "jest mi winien", ru: "он мне должен" }
  - { pl: "nie jestem ci nic winien", ru: "я тебе ничего не должен" }
