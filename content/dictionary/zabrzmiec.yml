  - { pl: "dźwięk", ru: "звук", relation: root, id: dzwiek }
etymology: "Приставка za- в значении начала действия и BRZMIEĆ, из праславянского *brьněti «звенеть, гудеть» — корень звукоподражательный, из тех, что подражают низкому гулу. Русских родственников у него практически нет: ближе всего «бряцать» и «бренчать», но и они только по звуку, не по происхождению. Приставка za- зато полностью своя, та же, что в русских «зазвучать», «заговорить», «запеть»: она отмечает самый момент начала. Поэтому BRZMIEĆ — «звучать», а ZABRZMIEĆ — «зазвучать», и разница между ними ровно та же, что между русской парой."
memory: "Корень придётся выучить: brzmieć «звучать», читается «бжмець» без вставной гласной. А приставка своя: za- начинает действие, как в «зазвучать». И brzmi dobrze — «звучит хорошо»."
idioms:
  - { pl: "brzmi dobrze", ru: "звучит хорошо, звучит заманчиво" }
  - { pl: "zabrzmieć fałszywie", ru: "прозвучать фальшиво, показаться неискренним" }
