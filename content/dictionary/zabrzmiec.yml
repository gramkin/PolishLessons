notes:
  - { kind: pronunciation, text: "Группа BRZM выглядит непроизносимой, но в ней всего три звука: b, ж, м. ZABRZMIEĆ читается «забжмець», BRZMI — «бжми». Русскому помогает, что и у него бывают такие стыки: «взбрело», «вздрогнул». Читать надо подряд, без вставной гласной между b и rz — именно вставное «э» выдаёт иностранца резче всего. Ударение на предпоследнем слоге: zaBRZMIEĆ, zaBRZMIAło." }
  - { kind: usage, text: "Повелительное ZABRZMIJ стоит проверить по правилу из карточки KARMIĆ. Правило там гласит, что -IJ появляется не из-за окончания -IE, а из-за того, что остаётся от основы, если отбросить -I. Здесь остаётся ZABRZM-, и такой стык польское слово закрыть не может: нужна гласная, отсюда ZABRZMIJ. Сравните WCIĄGNIE — WCIĄGNIJ, UJMIE — UJMIJ, то есть всё те же стыки на -GN- и -JM-. А вот у ZABRZMI есть и обычная форма третьего лица, и её с повелительным не спутаешь: ZABRZMI «зазвучит», ZABRZMIJ «зазвучи»." }
  - { kind: false-friend, text: "Опереться на русский тут не на что: корень BRZM- звукоподражательный и русского двойника не имеет. «Звучать» — это BRZMIEĆ, «звук» — DŹWIĘK, «звонок» — DZWONEK, и ни одно из трёх не похоже на русское слово того же смысла. Зато выражение BRZMI DOBRZE — «звучит хорошо» — устроено как русское, и JAK TO BRZMI значит «как это звучит». Заучивать приходится сам корень, а не его поведение." }
  - { kind: government, text: "Чаще всего без дополнения: подлежащее — звук, музыка, голос, слово. Как именно прозвучало — наречием или союзом JAK с именительным: ZABRZMIAŁO DZIWNIE, ZABRZMIAŁO JAK GROŹBA. Где — предлог W с местным: W SALI, W SŁUCHAWCE. Непереходный глагол, поэтому страдательных причастий у него нет вовсе, и всех форм сорок две: сорок одна основная и деепричастие ZABRZMIAWSZY." }
collocations:
  - { pl: "brzmi dobrze", ru: "звучит хорошо" }
  - { pl: "zabrzmieć jak groźba", ru: "прозвучать как угроза" }
  - { pl: "zabrzmiał dzwonek", ru: "раздался звонок" }
