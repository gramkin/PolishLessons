# review
id: horror
format: 2
lemma: "horror"
rank: 5083
pos: noun
pron: { cyr: "хо́рор" }
senses:
  - id: film
    ru: "фильм ужасов, хоррор"
    examples:
      - pl: "Nie lubię oglądać horrorów."
        ru: "Я не люблю смотреть фильмы ужасов."
        source: { kind: authored }
      - pl: "W kinie grają nowy horror."
        ru: "В кино идёт новый фильм ужасов."
        source: { kind: authored }
      - pl: "Stephen King pisze horrory."
        ru: "Стивен Кинг пишет романы ужасов."
        source: { kind: authored }
  - id: nightmare
    ru: "кошмар, ужас (о ситуации)"
    examples:
      - pl: "Podróż z trójką dzieci to był horror."
        ru: "Поездка с тремя детьми была кошмаром."
        source: { kind: authored }
      - pl: "Przeżyła prawdziwy horror w szpitalu."
        ru: "Она пережила настоящий ужас в больнице."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "HORROR — прежде всего «фильм ужасов» или жанр. В разговоре — «кошмар»: TO BYŁ HORROR! Русское «ужас» как чувство — GROZA, STRACH, PRZERAŻENIE, а не HORROR." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — HORRORU. В местном R переходит в RZ: W HORRORZE." }
  - { kind: government, text: "Смотреть фильм ужасов — OGLĄDAĆ HORROR, винительный. В фильме ужасов — W HORRORZE, местный. Фанат хорроров — FAN HORRORÓW." }
  - { kind: pronunciation, text: "Читается «хо́рор»: H — «х», двойное RR звучит как одно раскатистое R. Ударение на первом слоге. HORRORZE — «хоро́жэ»." }
collocations:
  - { pl: "mistrz horroru", ru: "мастер ужасов" }
  - { pl: "oglądać horrory", ru: "смотреть ужастики" }
  - { pl: "prawdziwy horror", ru: "настоящий кошмар" }
family:
  - { pl: "strach", ru: "страх", relation: root, id: strach }
  - { pl: "koszmar", ru: "кошмар", relation: root, id: koszmar }
  - { pl: "groza", ru: "ужас, жуть", relation: root }
etymology: "Из английского HORROR, от латинского HORROR «дрожь, ужас». Как жанр слово пришло в польский вместе с американским кино."
memory: "Horror — фильм ужасов и «кошмар». To był horror! — это был кошмар! W horrorze — в фильме ужасов. Читается «хо́рор»."
idioms:
  - { pl: "istny horror", ru: "сущий кошмар" }
