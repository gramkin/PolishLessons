# review
id: pies
format: 2
lemma: "pies"
rank: 428
pos: noun
pron: { cyr: "пес" }
senses:
  - id: dog
    ru: "собака, пёс"
    examples:
      - pl: "Pies je."
        ru: "Собака ест."
        source: { kind: tatoeba, id: 5974885 }
      - pl: "To mój pies."
        ru: "Это моя собака."
        source: { kind: tatoeba, id: 3051206 }
      - pl: "Mam psa."
        ru: "У меня есть собака."
        source: { kind: tatoeba, id: 2826489 }
  - id: dogs
    ru: "собаки (во множественном числе)"
    examples:
      - pl: "Lubię psy."
        ru: "Я люблю собак."
        source: { kind: tatoeba, id: 352922 }
      - pl: "Boję się psów."
        ru: "Я боюсь собак."
        source: { kind: tatoeba, id: 591364 }
      - pl: "Psy szczekają całą noc."
        ru: "Собаки лают всю ночь."
        source: { kind: authored }
notes:
  - { kind: usage, text: "В корне беглое e: pies, но psa, psu, psem — ровно как русское «пёс → пса»." }
  - { kind: false-friend, text: "Форма psie чаще всего не падеж существительного, а прилагательное psi «собачий»: psie gówno «собачье дерьмо». Различает только контекст." }
  - { kind: usage, text: "Форма psowie — мужско-личное множественное; к собакам её применяют разве что в шутку, ведь животные лицами не считаются. Обычное множественное — psy." }
  - { kind: usage, text: "Поговорка żyć jak pies z kotem расставляет животных в обратном порядке по сравнению с русским «жить как кошка с собакой»." }
collocations:
  - { pl: "mieć psa", ru: "иметь собаку" }
  - { pl: "wyprowadzić psa", ru: "выгулять собаку" }
  - { pl: "pogoda pod psem", ru: "погода никудышная" }
  - { pl: "psie życie", ru: "собачья жизнь" }
etymology: "Праславянское *pьsъ; русское «пёс» — то же самое слово, и беглый гласный ведёт себя одинаково: pies — psa, «пёс» — «пса»."
memory: "pies — «пёс, собака», и беглое e работает точно как в русском: pies → psa, как «пёс → пса». Осторожно с формой psie: чаще это прилагательное «собачий», а не падеж существительного."
idioms:
  - { pl: "pogoda pod psem", ru: "погода никудышная" }
  - { pl: "czuć się jak zbity pies", ru: "чувствовать себя как побитая собака" }
  - { pl: "żyć jak pies z kotem", ru: "жить как кошка с собакой" }
