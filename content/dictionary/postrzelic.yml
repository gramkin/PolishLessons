      - pl: "Postrzelono dwóch policjantów."
        ru: "Подстрелили двух полицейских."
        source: { kind: authored }
      - pl: "Postrzelił go w ramię."
        ru: "Он подстрелил его в плечо."
        source: { kind: authored }
  - id: wounded
    ru: "postrzelony — раненный выстрелом"
    examples:
      - pl: "Postrzelonego mężczyznę zabrało pogotowie."
        ru: "Раненного выстрелом мужчину забрала скорая."
        source: { kind: authored }
      - pl: "Postrzeleni żołnierze trafili do szpitala."
        ru: "Раненные выстрелами солдаты попали в госпиталь."
        source: { kind: authored }
  - id: crazy
    ru: "разг. postrzelony — чокнутый, взбалмошный"
    examples:
      - pl: "Ma postrzelony pomysł na wakacje."
        ru: "У него взбалмошная идея насчёт каникул."
        source: { kind: authored }
      - pl: "Trochę postrzelona, ale miła."
        ru: "Немного чокнутая, но милая."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Приставки НЕ совпадают, хотя смысл тот же. Русское «подстрелить» собрано из «под», польское postrzelić — из po. Не переносите po как «под»: здесь po значит «частично, не до конца» — ранить, но не убить. Если выстрел убил, говорят zastrzelić «застрелить»." }
  - { kind: government, text: "Подстреливают КОГО — винительный: postrzelić sarnę, policjanta. Место раны через w с ВИНИТЕЛЬНЫМ: postrzelić kogoś w ramię, w nogę. Русский здесь строит так же: «в плечо», «в ногу»." }
  - { kind: register, text: "Второе значение чисто разговорное: postrzelony о человеке — «чокнутый, с приветом, взбалмошный», без всякой связи с оружием. Trochę postrzelony значит примерно «малость того». Образ понятен: будто его слегка задело." }
  - { kind: pronunciation, text: "ЗВУКОВОЙ ЗАКОН, который окупается многократно: польское rz отвечает русскому мягкому «р». Strzała — «стрела», trzy — «три», brzeg — «берег», drzewo — «дерево», rzeka — «река». Увидев rz, подставьте «ре/ри» — и слово часто узнаётся само." }
collocations:
  - { pl: "postrzelić w ramię", ru: "ранить в плечо" }
  - { pl: "zostać postrzelonym", ru: "быть раненным выстрелом" }
  - { pl: "trochę postrzelony", ru: "малость чокнутый" }
family:
  - { pl: "strzelić", ru: "выстрелить", relation: root, id: strzelic }
  - { pl: "strzał", ru: "выстрел", relation: root, id: strzal }
  - { pl: "zastrzelić", ru: "застрелить, убить выстрелом", relation: derived, id: zastrzelic }
etymology: "Приставка po- плюс strzelić «выстрелить», а корень тот же, что в strzała «стрела» — русское «стрела», «стрелять». Разница только в звуке: польское rz отвечает русскому мягкому «р», отсюда strzała при «стреле». Приставка po- означает неполноту действия, потому postrzelić — ранить, а не убить."
memory: "postrzelić — «подстрелить, ранить выстрелом». Корень тот же, что в русской «стреле»: strzała, и rz отвечает мягкому «р». Приставка po- значит «не до конца»: убить будет zastrzelić. А разговорное postrzelony о человеке — «чокнутый»."
idioms:
  - { pl: "trochę postrzelony", ru: "малость чокнутый, с приветом" }
  - { pl: "postrzelony pomysł", ru: "взбалмошная затея" }
