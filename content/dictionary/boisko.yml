notes:
  - { kind: usage, text: "Слово значит именно площадку с разметкой, где играют или соревнуются: BOISKO PIŁKARSKIE «футбольное поле», BOISKO SZKOLNE «школьная площадка», BOISKO DO KOSZYKÓWKI «баскетбольная площадка». Поле в смысле пашни — это POLE, и путать их нельзя: русское «поле» покрывает и то, и другое, а польский держит раздельно. Стадион с трибунами — STADION, а BOISKO есть сама игровая площадь внутри. Выход на площадку описывают предлогом NA с винительным: WYBIEGLI NA BOISKO, а нахождение — NA с местным: NA BOISKU." }
  - { kind: government, text: "Средний род на -O, и парадигма у него экономная, та же, что у KINO и SZKŁO: именительный, винительный и звательный единственного совпадают в BOISKO, а родительный единственного и именительный множественного — в BOISKA. Поэтому в таблице восемь форм, а не десять. Назначение вводится предлогом DO с родительным: BOISKO DO KOSZYKÓWKI. Принадлежность — родительным без предлога: BOISKO SZKOŁY или прилагательным: BOISKO SZKOLNE, причём второе частотнее." }
  - { kind: pronunciation, text: "Читается «бои́ско», ударение на предпоследнем слоге, то есть на И. Сочетание OI произносится в два слога, BO-I-SKO, а не одним звуком: слово трёхсложное. Это важно, потому что русское ухо склонно сливать такие гласные. В местном падеже BOISKU ударение остаётся на том же слоге: «бои́ску». Группа SK на конце основы произносится слитно и глухо." }
  - { kind: false-friend, text: "Родственник у слова неожиданный, и он помогает его запомнить. BOISKO происходит от BÓJ «бой, схватка» и далее от BIĆ «бить», то есть буквально «место боя». Русский родственник здесь — «бой» и «бойня», а вот значение «игровая площадка» русскому не передаётся ни одним однокоренным словом: мы скажем «поле» или «площадка». Старое польское BOISKO значило и ток, место молотьбы, где били цепами зерно, и это второе значение держалось в деревне до двадцатого века. Так что одно слово успело назвать и место драки, и место обмолота, и место игры." }
