etymology: "От BÓJ «бой», из праславянского *bojь, от *biti «бить» — того же корня, что русские «бой», «бить», «боец», «бойня». Исходное значение польского слова было «место, где бьют»: сначала место схватки, затем ток, где молотили цепами зерно, и уже в новое время, с появлением организованного спорта, площадка для игры. Переход понятен: на всех трёх местах землю бьют и утаптывают. Суффикс -ISKO в польском как раз и образует названия мест по действию или предмету: ŁOWISKO «место ловли», LOTNISKO «аэродром», OGNISKO «костёр, очаг» от OGIEŃ. Поэтому незнакомое слово на -ISKO почти всегда можно прочесть как название места."
memory: "От bój «бой» и bić «бить»: буквально «место, где бьют» — сначала схватки, потом ток для обмолота, теперь игровая площадка. Пашня — pole, стадион с трибунами — stadion, а boisko сама площадка. Восемь форм, как у kino: boiska служит родительному единственного и именительному множественного. Суффикс -isko даёт названия мест: łowisko, lotnisko."
