# review
id: odwiedzic
format: 2
lemma: "odwiedzić"
rank: 1620
pos: verb
aspect: perf
pron: { cyr: "одве́дзиць" }
senses:
  - id: visit-person
    ru: "навестить, посетить (кого-л.)"
    examples:
      - pl: "Odwiedziłem go."
        ru: "Я его навестил."
        source: { kind: tatoeba, id: 8675038 }
      - pl: "Przyszedł mnie odwiedzić."
        ru: "Он пришёл меня навестить."
        source: { kind: tatoeba, id: 2146145 }
      - pl: "Odwiedzę cię jutro."
        ru: "Я навещу тебя завтра."
        source: { kind: translated, id: 565982 }
  - id: visit-place
    ru: "посетить (место)"
    examples:
      - pl: "Warto odwiedzić Kioto."
        ru: "Киото стоит посетить."
        source: { kind: translated, id: 352683 }
      - pl: "Zawsze chciałem odwiedzić inną planetę."
        ru: "Я всегда хотел побывать на другой планете."
        source: { kind: tatoeba, id: 13785269 }
      - pl: "Prezydent Francji odwiedzi Japonię w przyszłym miesiącu."
        ru: "Президент Франции посетит Японию в следующем месяце."
        source: { kind: tatoeba, id: 1100601 }
notes:
  - { kind: government, text: "Требует винительного падежа без предлога: odwiedzić babcię «навестить бабушку», odwiedzić muzeum «посетить музей». В русском «прийти к кому-то» требует предлога — здесь его нет." }
  - { kind: usage, text: "Несовершенный вид — odwiedzać. Существительное odwiedziny значит «посещение» и употребляется во множественном." }
  - { kind: usage, text: "warto odwiedzić — «стоит посетить»: Rzym jest miastem wartym odwiedzenia «Рим — город, который стоит посетить»." }
  - { kind: usage, text: "Третье значение современное: odwiedzić stronę «посетить сайт»." }
collocations:
  - { pl: "odwiedzić kogoś", ru: "навестить кого-то" }
  - { pl: "warto odwiedzić", ru: "стоит посетить" }
  - { pl: "odwiedzić muzeum", ru: "посетить музей" }
etymology: "Приставка od- + wiedzić, от старого wiedzieć в значении «направляться, идти» (ср. odwiedziny «посещение»). Русское «навестить» построено от того же корня «вед-/вест-», что и «весть»: обе метафоры о том, чтобы дать о себе знать."
memory: "odwiedzić = «навестить, посетить», и падеж проще, чем в русском: odwiedzić babcię — прямой винительный, без предлога. Несовершенный вид — odwiedzać, существительное odwiedziny «посещение»."
idioms:
  - { pl: "odwiedzić kogoś", ru: "навестить кого-то" }
  - { pl: "warto odwiedzić", ru: "стоит посетить" }
  - { pl: "odwiedzić stronę", ru: "посетить сайт" }
