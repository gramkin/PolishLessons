# review
id: aniol
format: 2
lemma: "anioł"
rank: 1414
pos: noun
pron: { cyr: "а́ньоу" }
senses:
  - id: angel
    ru: "ангел"
    examples:
      - pl: "Śpiewasz jak anioł."
        ru: "Ты поёшь как ангел."
        source: { kind: translated, id: 3520322 }
      - pl: "Anioł stróż Toma czuwa nad nim."
        ru: "Ангел-хранитель Тома бережёт его."
        source: { kind: translated, id: 8175348 }
      - pl: "Czy wierzysz w anioły?"
        ru: "Ты веришь в ангелов?"
        source: { kind: translated, id: 3579150 }
  - id: kind-person
    ru: "ангел (о добром человеке)"
    examples:
      - pl: "Jesteś aniołem!"
        ru: "Ты ангел!"
        source: { kind: translated, id: 351344 }
      - pl: "Tom nie jest aniołem."
        ru: "Том не ангел."
        source: { kind: translated, id: 11597942 }
notes:
  - { kind: usage, text: "У слова два множественных числа: aniołowie — лично-мужская форма, о существах, и anioły — обычная. Оба правильны, aniołowie звучит торжественнее." }
  - { kind: usage, text: "Звательная форма — aniele: Kocham cię, mój aniele «Я люблю тебя, мой ангел»." }
  - { kind: usage, text: "Переносное значение полностью совпадает с русским: Jesteś aniołem! «Ты ангел!»." }
  - { kind: usage, text: "anioł stróż — «ангел-хранитель», устойчивое сочетание." }
collocations:
  - { pl: "anioł stróż", ru: "ангел-хранитель" }
  - { pl: "jak anioł", ru: "как ангел" }
  - { pl: "być aniołem", ru: "быть ангелом" }
etymology: "Через латинское angelus из греческого ἄγγελος «вестник». Русский «ангел» пришёл тем же путём, но напрямую через греческий."
memory: "anioł — «ангел». Запомните две формы множественного: aniołowie о существах и anioły вообще. Звательная — aniele. Переносное значение совпадает с русским: Jesteś aniołem!"
idioms:
