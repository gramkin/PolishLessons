notes:
  - { kind: usage, text: "Десять форм, мужской род, одушевлённое лицо. Главный урок — мужское-личное множественное WNUKOWIE на -OWIE, то же окончание, что в SYNOWIE и WUJOWIE: польский закрепил его за словами родства, и для внуков оно обязательно. Форма WNUKI существует, но означает внуков и внучек вместе как потомство и звучит книжно. Рядом стоит отдельная форма WNUKU — это местный и звательный единственного: O WNUKU «о внуке», WNUKU! как обращение. Винительный единственного равен родительному, WNUKA, потому что лицо одушевлённое. Внучка — WNUCZKA, отдельное слово, а не форма этого." }
  - { kind: false-friend, text: "Слово прямо отвечает русскому «внуку», и корень общий, праславянский. Расхождение одно, зато заметное в речи: по-польски внучка это WNUCZKA, с суффиксом -KA и чередованием K в CZ, а не «внука». Второе: собирательное «внуки» в русском покрывает и мальчиков, и девочек, а польское WNUKOWIE — только мужское-личное, хотя на практике так говорят и о смешанной группе. Третье: WNUK не употребляется в переносном значении «потомок» в высоком стиле — для этого POTOMEK, тогда как русское «внуки» в поэзии значит и «потомки»." }
  - { kind: pronunciation, text: "Читается «внук», один слог, совпадая с русским почти полностью. Сочетание WN в начале произносится слитно, без вставного гласного: W здесь звучит как «в», потому что следующий звук звонкий. Конечное K твёрдое. В косвенных падежах появляются новые слоги и ударение становится предпоследним: WNUKA — «вну́ка», WNUKIEM — «вну́кем», WNUKOWIE — «внуко́ве», WNUKÓW — «вну́куф», где Ó читается как «у», а конечное W оглушается в «ф»." }
  - { kind: register, text: "Слово нейтральное и бытовое. Уменьшительные образуются свободно и очень употребительны в речи стариков: WNUCZEK, WNUSIO, WNUSIEK — все ласковые, и русскому отвечают «внучек, внучок». Обращение WNUKU! звучит тепло, но слегка старомодно; чаще зовут по имени. В официальных документах и в завещаниях стоит WNUK без уменьшительных, рядом с WNUCZKA и WNUKOWIE. Переносного или иронического употребления у слова нет вовсе, в отличие от DOKTOREK или DŻENTELMEN из предыдущей партии." }
