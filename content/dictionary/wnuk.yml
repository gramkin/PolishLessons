etymology: "Из праславянского *vъnukъ, того же слова, что русский «внук». Корень очень старый и, вероятно, связан с детским словом для деда; та же основа дала литовское ANUKAS. Соответствие звуков прямое: польское WN- отвечает русскому ВН-, и это редкий случай, когда слово совпадает почти побуквенно. Расхождение только в женском: польский образовал WNUCZKA с чередованием K в CZ перед суффиксом -KA, по тому же правилу, что RĘKA и RĄCZKA; русский взял «внучку» с тем же чередованием, но от другой ступени. Окончание -OWIE в WNUKOWIE — остаток древнего склонения имён лиц, сохранившийся в польском у слов родства, тогда как русский обобщил на эти слова обычное -И."
memory: "Почти побуквенное совпадение с русским «внуком»: wn- отвечает вн-. Главное в парадигме — мужское-личное множественное wnukowie на -owie, как synowie и wujowie: у слов родства польский держит это древнее окончание. Отдельно стоит wnuku — местный и звательный. Внучка это отдельное слово wnuczka, с чередованием k→cz. Ласковые формы очень живые: wnuczek, wnusio. Винительный равен родительному: widzę wnuka."
