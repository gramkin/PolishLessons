# review
id: doleciec
format: 2
lemma: "dolecieć"
rank: 2209
pos: verb
aspect: perf
pron: { cyr: "доле́цець" }
senses:
  - id: fly-to
    ru: "долететь, долетать"
    examples:
      - pl: "Samolot doleci do Gdańska o piątej."
        ru: "Самолёт долетит до Гданьска в пять."
        source: { kind: authored }
      - pl: "Nie doleciał do celu."
        ru: "Он не долетел до цели."
        source: { kind: authored }
      - pl: "Ptaki doleciały nad jezioro."
        ru: "Птицы долетели до озера."
        source: { kind: authored }
  - id: reach-ear
    ru: "донестись (о звуке, запахе)"
    examples:
      - pl: "Z kuchni doleciał zapach ciasta."
        ru: "Из кухни донёсся запах пирога."
        source: { kind: authored }
      - pl: "Doleciały nas krzyki z ulicy."
        ru: "До нас донеслись крики с улицы."
        source: { kind: authored }
notes:
  - { kind: government, text: "Долететь куда — do с родительным: dolecieć do Gdańska. Донестись до кого — винительный без предлога: doleciały nas krzyki." }
  - { kind: usage, text: "Второе значение — о звуках и запахах — в живой речи не реже первого, и русское «донестись» работает точно так же." }
  - { kind: false-friend, text: "Корень lecieć «лететь» — ср. русское «лететь», «долететь». Приставка do- та же, что русская «до-»." }
  - { kind: usage, text: "Несовершенный вид — dolatywać. В корпусе слово не встречается, поэтому все примеры составлены вручную." }
collocations:
  - { pl: "dolecieć do celu", ru: "долететь до цели" }
etymology: "do- + lecieć «лететь»; ср. русское «долететь», приставка та же."
memory: "dolecieć — «долететь», а также «донестись» о звуке или запахе: z kuchni doleciał zapach. Несовершенный вид — dolatywać."
idioms:
  - { pl: "dolecieć do celu", ru: "долететь до цели" }
