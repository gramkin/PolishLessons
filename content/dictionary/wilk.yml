# review
id: wilk
format: 2
lemma: "wilk"
rank: 1905
pos: noun
pron: { cyr: "вильк" }
senses:
  - id: animal
    ru: "волк"
    examples:
      - pl: "Wilk zabił jagnię."
        ru: "Волк убил ягнёнка."
        source: { kind: translated, id: 745391 }
      - pl: "Wilk mieszka w lesie."
        ru: "Волк живёт в лесу."
        source: { kind: translated, id: 11383362 }
      - pl: "Wilk jest drapieżnikiem."
        ru: "Волк — хищник."
        source: { kind: translated, id: 6156369 }
      - pl: "Wilki polują w stadzie."
        ru: "Волки охотятся стаей."
        source: { kind: translated, id: 8524126 }
      - pl: "Wilki zazwyczaj nie atakują ludzi."
        ru: "Обычно волки не нападают на людей."
        source: { kind: tatoeba, id: 1987751 }
      - pl: "Wilki nie jedzą sałatki."
        ru: "Волки не едят салат."
        source: { kind: translated, id: 3376541 }
  - id: figurative
    ru: "волк — о человеке, в устойчивых сравнениях"
    examples:
      - pl: "Człowiek człowiekowi wilkiem."
        ru: "Человек человеку волк."
        source: { kind: tatoeba, id: 2186414 }
      - pl: "Jest wilkiem w owczej skórze."
        ru: "Он волк в овечьей шкуре."
        source: { kind: translated, id: 11014279 }
      - pl: "Jestem trochę samotnym wilkiem."
        ru: "Я немного одинокий волк."
        source: { kind: translated, id: 13669946 }
notes:
  - { kind: usage, text: "O wilku mowa — точный эквивалент русского «лёгок на помине», буквально «о волке речь»." }
  - { kind: usage, text: "Сравнение głodny jak wilk «голоден как волк» совпадает с русским слово в слово." }
  - { kind: pronunciation, text: "Сочетание -lk звучит мягко: wilk — это «вильк», а не «вилк»." }
  - { kind: usage, text: "В технике wilk значит ещё и «мясорубка» (wilk do mięsa), но это узкоспециальное употребление." }
collocations:
  - { pl: "głodny jak wilk", ru: "голоден как волк" }
  - { pl: "stado wilków", ru: "стая волков" }
  - { pl: "wycie wilków", ru: "вой волков" }
etymology: "Праславянское *vьlkъ. Русское «волк» и польское wilk различаются только судьбой слабого гласного: в русском он дал «о», а в польском «i»."
memory: "wilk — «волк», почти как по-русски, только с «и». Главное выражение: O wilku mowa «Лёгок на помине»."
idioms:
  - { pl: "o wilku mowa", ru: "лёгок на помине" }
  - { pl: "wilk w owczej skórze", ru: "волк в овечьей шкуре" }
  - { pl: "głodny jak wilk", ru: "голоден как волк" }
  - { pl: "wilk syty i owca cała", ru: "и волки сыты, и овцы целы" }
  - { pl: "nie wywołuj wilka z lasu", ru: "не буди лихо, пока оно тихо" }
