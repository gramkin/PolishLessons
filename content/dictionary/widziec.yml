# review
id: widziec
format: 2
lemma: "widzieć"
rank: 55
pos: verb
aspect: imperf
aspectPair: zobaczyc
pron: { cyr: "ви́дзець" }
senses:
  - id: see
    ru: "видеть"
    examples:
      - pl: "Widzę lwa."
        ru: "Я вижу льва."
        source: { kind: tatoeba, id: 597831 }
      - pl: "Widzisz gwiazdę?"
        ru: "Видишь звезду?"
        source: { kind: tatoeba, id: 2183708 }
      - pl: "Widziałem UFO."
        ru: "Я видел НЛО."
        source: { kind: tatoeba, id: 967061 }
  - id: meet
    ru: "видеться, встречаться"
    examples:
      - pl: "Długo się nie widzieliśmy."
        ru: "Давно мы не виделись."
        source: { kind: tatoeba, id: 6106118 }
      - pl: "On jest ostatnią osobą, jaką chcę teraz widzieć."
        ru: "Он последний, кого я хочу сейчас видеть."
        source: { kind: tatoeba, id: 3661317 }
notes:
  - { kind: usage, text: "Видовая пара: widzieć «видеть» — zobaczyć «увидеть»." }
  - { kind: usage, text: "Повелительного наклонения нет: вместо него patrz «смотри» и zobacz «посмотри». Отсюда и формула прощания do widzenia «до свидания»." }
collocations:
  - { pl: "do widzenia", ru: "до свидания" }
  - { pl: "punkt widzenia", ru: "точка зрения" }
  - { pl: "mile widziany", ru: "желанный, приветствуется" }
etymology: "Праславянское *viděti — то же слово, что русское «видеть»; тот же корень, что в «ведать» и «вид»."
memory: "Видовая пара знакомая: widzieć «видеть» — zobaczyć «увидеть». Повелительного наклонения у глагола нет: вместо «виждь» говорят patrz или zobacz. Отсюда же do widzenia «до свидания» и punkt widzenia «точка зрения»."
idioms:
  - { pl: "do widzenia", ru: "до свидания" }
  - { pl: "mile widziany", ru: "желанный гость" }
  - { pl: "punkt widzenia", ru: "точка зрения" }
  - { pl: "jak cię widzą, tak cię piszą", ru: "встречают по одёжке" }
formExamplesSkip:
  - { form: "widź", reason: "Повелительного наклонения у widzieć нет: приказать «видеть» нельзя, вместо этого говорят patrz «смотри» или zobacz «посмотри»." }
  - { form: "widźcie", reason: "Повелительного наклонения у widzieć нет: приказать «видеть» нельзя, вместо этого говорят patrz «смотри» или zobacz «посмотри»." }
  - { form: "widźmy", reason: "Повелительного наклонения у widzieć нет: приказать «видеть» нельзя, вместо этого говорят patrz «смотри» или zobacz «посмотри»." }
