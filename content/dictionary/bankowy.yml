etymology: "От BANK, взятого через немецкий из итальянского BANCA «стол, лавка»: за лавкой на площади менялы раскладывали монеты, и от этой лавки пошло название всего дела. Русское «банк» пришло тем же путём, поэтому корень общий. Любопытно, что оттуда же идёт и «банкрот»: по-итальянски BANCA ROTTA значит «сломанная лавка», её ломали разорившемуся меняле, и по-польски это BANKRUT."
memory: "Банковский, от bank, а то — из итальянского banca «лавка», за которой менялы раскладывали монеты. Оттуда же и bankrut: banca rotta это «сломанная лавка». Читается «банко́вы». Запомните, что здесь, в отличие от многих относительных прилагательных, форма для мужчин-людей живая: pracownicy bankowi. И прихватите разговорное bankowo «точно, наверняка» — надёжно, как в банке."
