notes:
  - { kind: false-friend, text: "Прилагательное отвечает русскому «банковский» без оговорок, а вот два существительных рядом надо различать. KONTO BANKOWE и RACHUNEK BANKOWY оба значат «банковский счёт», но RACHUNEK значит ещё и счёт в ресторане, то есть наш «чек»: PROSZĘ O RACHUNEK значит «счёт, пожалуйста». А KONTO только банковское." }
  - { kind: usage, text: "Все одиннадцать форм живые. Форма для мужчин-людей здесь есть и употребляется, потому что PRACOWNIK BANKOWY — это человек, банковский работник, а значит бывают и PRACOWNICY BANKOWI, и URZĘDNICY BANKOWI. Так что пропускать её, как у PODZIEMNY или LODOWY, здесь нельзя. Суффикс -OWY отвечает русскому «-ский» в словах такого устройства." }
  - { kind: government, text: "На банковский счёт — NA KONTO BANKOWE, предлог NA с винительным, и перевести деньги — PRZELAĆ NA KONTO. На счету — NA KONCIE BANKOWYM, тот же предлог, но местный падеж, потому что движения нет. Без банковского счёта — BEZ KONTA BANKOWEGO, родительный. Прилагательное стоит после существительного: KONTO BANKOWE, PRZELEW BANKOWY." }
  - { kind: pronunciation, text: "Читается «банко́вы», три слога, ударение на предпоследнем. Звук N перед K произносится как обычное «н», без призвука. Конечная Y даёт «ы», поэтому слово кончается на «вы», а не на «вый». В женском роде BANKOWA это «банко́ва», в среднем BANKOWE — «банко́вэ», а в форме для мужчин-людей BANKOWI — «банко́ви»." }
  - { kind: register, text: "Слово конторское и денежное, из языка банка и договоров. Но у него есть и разговорная родня, которую стоит знать: наречие BANKOWO значит «точно, наверняка», и BANKOWO PRZYJDZIE значит «он точно придёт». Образ понятен — надёжно, как в банке. В речи молодёжи это слово слышно постоянно, а в документах, разумеется, нет." }
