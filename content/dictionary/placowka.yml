etymology: "От PLAC «площадь, место»: исходно — укреплённое место, военный пост. Отсюда значения «застава» и «учреждение, отделение»."
memory: "Placówka — учреждение, отделение, застава; plac — площадь. Читается «плацу́фка». Placówka medyczna — медучреждение."
idioms:
  - { pl: "na pierwszej linii", ru: "на передовой" }
