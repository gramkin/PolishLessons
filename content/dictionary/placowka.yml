# review
id: placowka
format: 2
lemma: "placówka"
rank: 3983
pos: noun
pron: { cyr: "плацу́фка" }
senses:
  - id: institution
    ru: "учреждение (школа, больница, офис)"
    examples:
      - pl: "Szkoła to placówka oświatowa."
        ru: "Школа — учебное заведение."
        source: { kind: authored }
      - pl: "W mieście otwarto nową placówkę medyczną."
        ru: "В городе открыли новое медучреждение."
        source: { kind: authored }
      - pl: "Bank zamknął kilka placówek."
        ru: "Банк закрыл несколько отделений."
        source: { kind: authored }
  - id: outpost
    ru: "застава, пост; представительство"
    examples:
      - pl: "Ambasada to placówka dyplomatyczna."
        ru: "Посольство — дипломатическое представительство."
        source: { kind: authored }
      - pl: "Żołnierze bronili placówki na granicy."
        ru: "Солдаты защищали заставу на границе."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PLACÓWKA — «учреждение» или «отделение» (банка, почты), а не «площадка». Площадка — PLAC, PLACYK. PLACÓWKA DYPLOMATYCZNA — «дипломатическое представительство»." }
  - { kind: usage, text: "Девять живых форм, женский род. Перед E K переходит в C: W PLACÓWCE. Родительный множественного — PLACÓWEK. Звательный не даётся." }
  - { kind: government, text: "Работать в учреждении — PRACOWAĆ W PLACÓWCE, местный. Какое учреждение — прилагательным: PLACÓWKA MEDYCZNA, OŚWIATOWA, POCZTOWA." }
  - { kind: pronunciation, text: "Читается «плацу́фка», ударение на предпоследнем слоге. Ó — «у», W перед K оглушается в «ф»." }
collocations:
  - { pl: "placówka medyczna", ru: "медицинское учреждение" }
  - { pl: "placówka dyplomatyczna", ru: "дипломатическое представительство" }
  - { pl: "placówka bankowa", ru: "отделение банка" }
family:
  - { pl: "plac", ru: "площадь, площадка", relation: root, id: plac }
  - { pl: "placyk", ru: "площадка, скверик", relation: derived }
