# review
id: sprzeciwic
format: 2
lemma: "sprzeciwić"
rank: 4394
pos: verb
pron: { cyr: "спшэци́виць" }
senses:
  - id: oppose
    ru: "с SIĘ — воспротивиться, выступить против"
    examples:
      - pl: "Mieszkańcy sprzeciwili się budowie autostrady."
        ru: "Жители воспротивились строительству автострады."
        source: { kind: authored }
      - pl: "Sprzeciwił się decyzji zarządu."
        ru: "Он выступил против решения правления."
        source: { kind: authored }
      - pl: "Nikt nie sprzeciwi się temu planowi."
        ru: "Никто не выступит против этого плана."
        source: { kind: authored }
  - id: defy
    ru: "с SIĘ — пойти против воли (кого-то), ослушаться"
    examples:
      - pl: "Sprzeciwiła się rodzicom i wyjechała."
        ru: "Она пошла против воли родителей и уехала."
        source: { kind: authored }
      - pl: "Nie odważył się sprzeciwić ojcu."
        ru: "Он не осмелился перечить отцу."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "SPRZECIWIĆ SIĘ — «воспротивиться, возразить», с дательным: SPRZECIWIĆ SIĘ DECYZJI. Не путать с PRZECIWNIK — «противник». SPRZECIW — «возражение, протест»; в суде — «протест», в праве — «возражение»." }
  - { kind: usage, text: "Сорок две формы; почти всегда с SIĘ. Будущее: SPRZECIWIĘ SIĘ, SPRZECIWISZ SIĘ; повелительное SPRZECIW SIĘ совпадает по форме с существительным SPRZECIW. Несовершенный вид — SPRZECIWIAĆ SIĘ." }
  - { kind: government, text: "Кому или чему — дательный: SPRZECIWIĆ SIĘ SZEFOWI, PLANOM, BUDOWIE. Письменно — NA PIŚMIE. Публично — PUBLICZNIE." }
  - { kind: pronunciation, text: "Читается «спшэци́виць»: SPRZ — «спш», CI — «ци», ударение на предпоследнем слоге. SPRZECIWIĘ — «спшэци́вье»." }
  - { kind: register, text: "Нейтральное и официальное слово, частое в новостях. В разговоре — BYĆ PRZECIW, NIE ZGODZIĆ SIĘ. ZGŁOSIĆ SPRZECIW — канцелярское «заявить возражение»." }
collocations:
  - { pl: "sprzeciwić się decyzji", ru: "выступить против решения" }
  - { pl: "sprzeciwić się woli rodziców", ru: "пойти против воли родителей" }
  - { pl: "zgłosić sprzeciw", ru: "заявить возражение" }
family:
  - { pl: "przeciw", ru: "против", relation: root, id: przeciw }
  - { pl: "sprzeciw", ru: "возражение, протест", relation: derived, id: sprzeciw }
  - { pl: "sprzeciwiać", ru: "противиться", relation: aspect }
etymology: "Приставка S- плюс PRZECIWIĆ, от PRZECIW «против», праславянское *protivъ. Польское PRZE- соответствует русскому «про-»: PRZECIW — «против»."
memory: "Sprzeciwić się decyzji — выступить против решения, с дательным. Sprzeciw — возражение. Читается «спшэци́виць»."
idioms:
