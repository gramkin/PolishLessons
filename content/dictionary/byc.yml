# review
id: byc
format: 2
depth: deep
lemma: "być"
rank: 2
pos: verb
aspect: imperf
pron: { cyr: "быць" }
senses:
  - id: be
    ru: "быть, являться (связка)"
    examples:
      - pl: "Jestem lekarzem."
        ru: "Я врач."
        source: { kind: tatoeba, id: 361231 }
      - pl: "Jest stary."
        ru: "Он старый."
        source: { kind: tatoeba, id: 364555 }
      - pl: "Był wieczór."
        ru: "Был вечер."
        source: { kind: tatoeba, id: 822160 }
  - id: future
    ru: "будущее время: będę, będziesz — буду, будешь"
    examples:
      - pl: "Jutro będzie gorąco."
        ru: "Завтра будет жарко."
        source: { kind: tatoeba, id: 528077 }
      - pl: "Będę strzelać."
        ru: "Я буду стрелять."
        source: { kind: tatoeba, id: 5662070 }
  - id: exist
    ru: "быть, иметься, находиться (о наличии)"
    examples:
      - pl: "Jest tu ktoś?"
        ru: "Здесь кто-нибудь есть?"
        source: { kind: authored }
      - pl: "Nie było go w domu."
        ru: "Его не было дома."
        source: { kind: authored }
      - pl: "Wczoraj nie było deszczu."
        ru: "Вчера дождя не было."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Настоящее время нерегулярно: jestem, jesteś, jest, jesteśmy, jesteście, są." }
  - { kind: usage, text: "В отличие от русского, связку опускать нельзя: Jestem studentem «Я студент», On jest wysoki «Он высокий»." }
  - { kind: usage, text: "Простое будущее: będę + инфинитив или форма на -ł: będę czytać = będę czytał." }
  - { kind: government, text: "Отрицание наличия — не nie jest, а nie ma с родительным падежом, и глагол при этом не меняется по лицам: Nie ma go «Его нет», Nie było czasu «Не было времени», Nie będzie problemu «Проблемы не будет»." }
collocations:
  - { pl: "być może", ru: "может быть" }
  - { pl: "co będzie, to będzie", ru: "будь что будет" }
  - { pl: "jak było?", ru: "как было?" }
etymology: "Праславянское *byti из праиндоевропейского *bʰuH- «расти, становиться» — то же слово, что русское «быть». Формы настоящего времени (jestem, jest) идут от другого корня *es-, как русское «есть»."
memory: "В глаголе сошлись два корня, как и в русском: настоящее от es- (jest), прошедшее и будущее от by- (był, będzie). Но есть отличие, о котором забывают: связку нельзя опускать — Jestem studentem, а не «Ja student»."
idioms:
  - { pl: "być może", ru: "может быть" }
  - { pl: "co będzie, to będzie", ru: "будь что будет" }
  - { pl: "być na czasie", ru: "быть в курсе, быть в тренде" }
  - { pl: "niech będzie", ru: "пусть будет" }
