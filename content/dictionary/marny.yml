notes:
  - { kind: false-friend, text: "Русский глаз читает в этом слове «мирный» или «мерный», и ошибается дважды. MARNY значит «жалкий, ничтожный, скверный», ничего общего с покоем и мерой. «Мирный» по-польски POKOJOWY, «мерный» MIAROWY. Ловушку усиливает то, что слово частое и попадается в простых контекстах: MARNE SZANSE это «ничтожные шансы», а не «мирные». Родня у него другая: MARNOWAĆ «тратить зря», ZMARNOWAĆ, MARNOTRAWNY «расточительный», откуда и SYN MARNOTRAWNY, русский «блудный сын»." }
  - { kind: usage, text: "Тридцать три формы — это одиннадцать форм, повторённых в трёх степенях: MARNY, MARNIEJSZY, NAJMARNIEJSZY. Степени образуются совершенно регулярно, через -SZY и приставку NAJ-, и неполных клеток в этой схеме нет. Одна форма живёт отдельной жизнью: средняя MARNE вошла в застывший оборот NA MARNE «впустую», и POSZŁO NA MARNE значит «пошло прахом». В этом обороте слово уже не согласуется ни с чем и работает как наречие." }
  - { kind: government, text: "Само прилагательное падежом не управляет, но у него есть своя излюбленная конструкция, которую стоит узнавать: MARNY Z + родительный + существительное в именительном. MARNY Z NIEGO POCIESZYCIEL значит «утешитель из него скверный», MARNI Z NAS NEGOCJATORZY «переговорщики из нас скверные». Русский строит это точно так же, через «из» и родительный, только порядок слов обычно другой. В остальном прилагательное ведёт себя как любое другое и согласуется с существительным в роде, числе и падеже." }
  - { kind: pronunciation, text: "Основная форма читается «ма́рны», два слога, ударение на первом. Буква Y на конце звучит как «ы», а не как «и», и это важно: «марны», не «марни». Буква R твёрдая и раскатистая. В сравнительной степени появляется мягкость: MARNIEJSZY звучит «марне́йшы», где NI даёт мягкое «не», а SZ твёрдое «ш». В превосходной степени добавляется приставка и ударение остаётся на том же слоге: NAJMARNIEJSZY, «наймарне́йшы»." }
  - { kind: register, text: "Слово нейтральное, но с отчётливо пренебрежительным оттенком, и в лицо человеку его говорят редко. Частые обороты: MARNE SZANSE «ничтожные шансы», ZA MARNE PIENIĄDZE «за гроши», MARNY LOS «жалкая участь», MARNY KONIEC «плохой конец», NA MARNE «впустую». Рядом стоит наречие MARNIE: WYGLĄDASZ MARNIE значит «ты скверно выглядишь», и это самый частый способ сказать по-польски, что человек болен или устал." }
