etymology: "Восходит к праславянскому корню с идеей исчезновения и напрасной траты, к которому принадлежат русские «мор», «морить», «обморок», «марево». В русском этот корень ушёл в сторону смерти и наваждения, а в польском остался на значении пустоты и ничтожности: MARNY это то, что ни на что не годно, что пропадает даром. Отсюда MARNOWAĆ «тратить зря» и MARNIEĆ «чахнуть». Украинский сохранил ровно польское значение в слове «марний» — «напрасный, тщетный», и тому, кто его знает, польское слово понятно сразу. Русскому же ближе всего по смыслу «напрасный» и «тщетный», но они от других корней."
memory: "Выглядит как «мирный», значит «жалкий, ничтожный, скверный». Польское «мирный» это pokojowy, так что совпадение здесь чисто внешнее. Родня по смыслу: marnować «тратить зря», marnie «скверно». Тридцать три формы это одиннадцать клеток в трёх степенях, marny, marniejszy, najmarniejszy, всё совершенно регулярно. Запомнить два готовых оборота: marne szanse «ничтожные шансы» и na marne «впустую», poszło na marne «пошло прахом». И wyglądasz marnie значит «ты скверно выглядишь»."
idioms:
  - { pl: "pójść na marne", ru: "пойти прахом" }
