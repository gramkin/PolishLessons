notes:
  - { kind: false-friend, text: "Ловушка: польское RUDY звучит как русское «рудый» и похоже на «руду», но значит «рыжий». А русское «рыжий» по-польски никак не похоже: RUDY. Красный — CZERWONY, рыжий — RUDY, и путать их нельзя: CZERWONE WŁOSY — это крашеные в красный, а RUDE WŁOSY — природный рыжий. Слово RUDA, «руда», — существительное и с прилагательным не связано по значению." }
  - { kind: usage, text: "Степеней сравнения обычно нет, хотя в разговоре встречается BARDZIEJ RUDY. Все одиннадцать форм живые. Форма для мужчин-людей RUDZI нужна часто: RUDZI CHŁOPCY, RUDZI MĘŻCZYŹNI. Чередование D на DZ перед I: RUDY, но RUDZI. Как существительное RUDY или RUDA — прозвище: «Рыжий», «Рыжая»." }
  - { kind: government, text: "Ставится перед существительным: RUDE WŁOSY, RUDY KOT, RUDA WIEWIÓRKA. В значении «рыжий от чего-то» — RUDY OD + родительный: RUDY OD RDZY, «рыжий от ржавчины». Падежных требований само прилагательное не имеет." }
  - { kind: pronunciation, text: "Читается «ру́ды», два слога, ударение на первом. DY даёт твёрдое «ды», без смягчения. В форме RUDZI: «ру́дзи», D перед I превращается в мягкое «дзь»." }
  - { kind: register, text: "Нейтральное слово. Как прозвище RUDY, RUDA, RUDZIELEC — дружеское и ласковое, иногда дразнилка. Знаменитый RUDY 102 — танк из сериала «Четыре танкиста и собака», и любой поляк старшего поколения эту отсылку узнает." }
