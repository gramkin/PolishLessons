etymology: "Общеславянское *rudъ «красноватый, рыжий», от индоевропейского *reudh- «красный». Отсюда же русская «руда» — красноватая железная руда, и «рдеть», «ржавый». По-польски RDZA, «ржавчина», — из того же корня. Русский потерял прилагательное «рудый» в литературном языке, а в польском оно осталось главным словом для рыжего цвета."
memory: "Rudy — рыжий: rude włosy, rudy kot, rudy lis. Не «рудый» и не «красный» (czerwony). Тот же корень, что «руда» и «ржавчина», rdza. Мн. ч. для мужчин — rudzi."
idioms:
  - { pl: "rudy jak marchewka", ru: "рыжий как морковка" }
