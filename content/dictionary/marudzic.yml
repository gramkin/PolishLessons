# review
id: marudzic
format: 2
lemma: "marudzić"
rank: 5739
pos: verb
aspect: imperf
pron: { cyr: "мару́дзиць" }
senses:
  - id: whine
    ru: "ныть, капризничать, канючить"
    examples:
      - pl: "Przestań marudzić."
        ru: "Перестань ныть."
        source: { kind: translated, id: 6328147 }
      - pl: "Nie mogę już znieść twojego marudzenia!"
        ru: "Я больше не могу выносить твоё нытьё!"
