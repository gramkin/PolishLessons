  - { pl: "marudzenie", ru: "нытьё, занудство", relation: derived }
  - { pl: "marudny", ru: "капризный, нудный", relation: derived }
  - { pl: "pomarudzić", ru: "поныть немного", relation: aspect }
  - { pl: "zamarudzić", ru: "замешкаться", relation: aspect }
synonyms: ["narzekać", "grymasić", "kaprysić", "zrzędzić", "guzdrać się", "ociągać się"]
antonyms: ["śpieszyć się"]
etymology: "Связано с существительным maruda «нытик, копуша». В славянских поверьях marudą звали ночного демона, который мучает младенца и доводит его до плача, — отсюда образ назойливого, выматывающего нытья. Прямого родственника в русском у слова нет."
memory: "marudzić — это и «ныть, канючить», и «копаться». Два образа в одном слове: человек одновременно досаждает и тянет время. Родственное maruda — тоже и «нытик», и «копуша». Поныть немного — pomarudzić."
idioms:
  - { pl: "przestań marudzić", ru: "перестань ныть" }
  - { pl: "nie marudź!", ru: "не ной!, не копайся!" }
  - { pl: "marudzić pod nosem", ru: "ворчать себе под нос" }
