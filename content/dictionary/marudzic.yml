      - pl: "Chciałbym, żeby jadła, co jej dam, bez marudzenia."
        ru: "Я хотел бы, чтобы она ела то, что я ей дам, без капризов."
        source: { kind: translated, id: 970975 }
  - id: drone-on
    ru: "нудить, занудствовать, бубнить"
    examples:
      - pl: "Ty chyba nigdy nie przestaniesz narzekać i marudzić.."
        ru: "Ты, наверное, никогда не перестанешь жаловаться и нудить.."
        source: { kind: translated, id: 2178464 }
      - pl: "Mamy po dziurki w nosie twojego marudzenia."
        ru: "Нам осточертело твоё занудство."
        source: { kind: translated, id: 11111528 }
      - pl: "Marudzi godzinami o tej samej sprawie."
        ru: "Он часами нудит об одном и том же."
        source: { kind: authored }
  - id: dawdle
    ru: "копаться, мешкать, возиться"
    examples:
      - pl: "Nie marudź. Musisz iść."
        ru: "Не копайся. Тебе надо идти."
        source: { kind: translated, id: 576117 }
      - pl: "Marudzi przy śniadaniu i zawsze się spóźnia."
        ru: "Он копается за завтраком и вечно опаздывает."
        source: { kind: authored }
      - pl: "Nie marudźmy, bo spóźnimy się na pociąg."
        ru: "Не будем копаться, а то опоздаем на поезд."
        source: { kind: authored }
notes:
  - { kind: register, text: "Разговорное слово. В нейтральном тексте на его месте будет narzekać «жаловаться» или ociągać się «мешкать»." }
  - { kind: usage, text: "Три оттенка одного образа: капризно ныть (dziecko marudzi), нудно бубнить одно и то же (marudzi godzinami) и копаться, тянуть время (nie marudź, ubieraj się). Общее — человек и досаждает, и задерживает." }
  - { kind: government, text: "Непереходный: прямого дополнения не бывает, чаще всего стоит один — Przestań marudzić! Предмет жалоб вводится предлогом na с винительным: marudzić na pogodę «ворчать на погоду»." }
  - { kind: false-friend, text: "Не «мародёрствовать». Созвучное maruder по-польски прежде всего «отставший, плетущийся в хвосте», а marudzić — «ныть» или «копаться»; грабёж тут ни при чём." }
  - { kind: usage, text: "Совершенный вид с оттенком «немного» — pomarudzić «поныть»; zamarudzić — «замешкаться». Отглагольное существительное marudzenie «нытьё», деятель — maruda «нытик, копуша»." }
collocations:
  - { pl: "przestań marudzić", ru: "перестань ныть" }
  - { pl: "marudzić przy jedzeniu", ru: "капризничать за едой" }
  - { pl: "marudzić na pogodę", ru: "ворчать на погоду" }
  - { pl: "marudzić pod nosem", ru: "бурчать себе под нос" }
family:
