# review
id: zaleta
format: 2
lemma: "zaleta"
rank: 4328
pos: noun
pron: { cyr: "зале́та" }
senses:
  - id: advantage
    ru: "достоинство, преимущество"
    examples:
      - pl: "Największą zaletą tego domu jest ogród."
        ru: "Самое большое достоинство этого дома сад."
        source: { kind: authored }
      - pl: "Ma wiele zalet i jedną wadę."
        ru: "У него много достоинств и один недостаток."
