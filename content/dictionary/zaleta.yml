  - id: pros
    ru: "плюс, сильная сторона"
    examples:
      - pl: "Rozważyli wszystkie wady i zalety."
        ru: "Они взвесили все достоинства и недостатки."
        source: { kind: authored }
      - pl: "Każde rozwiązanie ma swoje zalety."
        ru: "У каждого решения есть свои плюсы."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русского родственника у слова нет, зато есть у его глагола, и он обманывает. ZALECAĆ значит не «залечивать», а «рекомендовать, предписывать»: LEKARZ ZALECIŁ ODPOCZYNEK это «врач рекомендовал отдых». Русское «залечить» по-польски ZALECZYĆ или WYLECZYĆ, через другой корень. ZALETA же буквально то, что рекомендует вещь, её сильная сторона, и переводится «достоинством» или «плюсом»." }
  - { kind: usage, text: "Десять форм, женский род. В дательном и местном падеже единственного числа T переходит в C: ZALETA, но W ZALECIE. Это то же чередование, что в KOBIETA — KOBIECIE и META — MECIE. Слово почти всегда ходит в паре со своим антонимом: WADY I ZALETY, именно в таком порядке, тогда как русский говорит «достоинства и недостатки», начиная с хорошего." }
  - { kind: government, text: "Достоинство чего-либо — ZALETA CZEGOŚ, родительный без предлога: ZALETA TEGO ROZWIĄZANIA. Считать достоинством — UZNAĆ ZA ZALETĘ, предлог ZA с винительным, где русский берёт творительный, «счесть достоинством». Иметь свои плюсы — MIEĆ SWOJE ZALETY, винительный без предлога. В достоинстве — W ZALECIE, предлог W с местным падежом." }
  - { kind: pronunciation, text: "Читается «зале́та», три слога, ударение на втором. Все звуки простые, носовых нет. Буква L перед гласной звучит мягче русского твёрдого «л». В дательном и местном падеже ZALECIE сочетание CIE даёт мягкое «це», и слышно «зале́це». В глаголе ZALECAĆ ударение падает на предпоследний слог: «зале́цаць»." }
  - { kind: register, text: "Слово нейтральное и частое в оценках и описаниях: GŁÓWNA ZALETA «главное достоинство», NIEWĄTPLIWA ZALETA «несомненное достоинство», WADY I ZALETY. В объявлениях о работе и о жилье оно стоит в каждом втором тексте. Пара WADY I ZALETY настолько устойчива, что порядок слов в ней не меняют, и начинают именно с недостатков." }
collocations:
  - { pl: "główna zaleta", ru: "главное достоинство" }
  - { pl: "wady i zalety", ru: "достоинства и недостатки" }
  - { pl: "mieć swoje zalety", ru: "иметь свои плюсы" }
family:
  - { pl: "zalecać", ru: "рекомендовать, предписывать", relation: root }
  - { pl: "zalecenie", ru: "рекомендация, предписание", relation: derived }
  - { pl: "wada", ru: "недостаток, изъян", relation: antonym, id: wada }
etymology: "От ZALECAĆ «рекомендовать», то есть буквально то, что говорит в пользу вещи, её рекомендующая сторона. Глагол собран из приставки ZA- и корня LEC-, родственного русскому «речь» и «изрекать» через чередование. Русский для этого понятия взял «достоинство», от «достойного», и «преимущество», от «иметь перед», так что образы совсем разные: поляк видит рекомендацию, русский — ценность и первенство."
memory: "Русского родственника нет, и запоминать надо через глагол: zalecać значит «рекомендовать», а не «залечивать», и zaleta это то, что вещь рекомендует, её плюс. Врачебное zalecenie это «предписание». Слово ходит парой с антонимом, wady i zalety, причём поляк начинает с недостатков, а русский с достоинств. В дательном и местном t переходит в c: w zalecie."
idioms:
  - { pl: "wady i zalety", ru: "достоинства и недостатки" }
