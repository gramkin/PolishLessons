        ru: "Клиент не пришёл."
        source: { kind: translated, id: 532942 }
  - id: customers
    ru: "klienci — клиенты, покупатели"
    note: "stali klienci «постоянные клиенты», nowi klienci «новые клиенты»."
    examples:
      - pl: "To czasowa promocja, tylko dla nowych klientów."
        ru: "Это временная акция только для новых клиентов."
        source: { kind: tatoeba, id: 933484 }
      - pl: "Kupiłam tę książkę po zniżce dla stałych klientów."
        ru: "Я купила эту книгу по скидке для постоянных клиентов."
        source: { kind: tatoeba, id: 6319716 }
      - pl: "Klienci stali w kolejce."
        ru: "Клиенты стояли в очереди."
        source: { kind: translated, id: 7184806 }
  - id: with-client
    ru: "z klientem — с клиентом"
    note: "Творительный: spotkanie z klientem «встреча с клиентом»."
    examples:
      - pl: "Jestem tylko klientem."
        ru: "Я всего лишь клиент."
        source: { kind: tatoeba, id: 3018119 }
      - pl: "Tom zaspał i przegapił ważne spotkanie z klientem."
        ru: "Том проспал и пропустил важную встречу с клиентом."
        source: { kind: tatoeba, id: 11262010 }
      - pl: "Jestem z klientem."
        ru: "Я с клиентом."
        source: { kind: translated, id: 3759833 }
notes:
  - { kind: usage, text: "Личное мужское множественное — klienci: klienci stali w kolejce. Форма klienty к людям не применяется." }
  - { kind: usage, text: "Частые сочетания: stały klient «постоянный клиент», nowy klient «новый клиент», obsługa klienta «обслуживание клиентов»." }
  - { kind: usage, text: "Поговорка Klient ma zawsze rację — «Клиент всегда прав», ровно как в русском." }
  - { kind: usage, text: "Женский род — klientka; отвлечённое — klientela «клиентура»." }
collocations:
  - { pl: "stały klient", ru: "постоянный клиент" }
  - { pl: "obsługa klienta", ru: "обслуживание клиентов" }
  - { pl: "spotkanie z klientem", ru: "встреча с клиентом" }
  - { pl: "Klient ma zawsze rację", ru: "Клиент всегда прав" }
family:
  - { pl: "klientka", ru: "клиентка", relation: derived }
  - { pl: "klientela", ru: "клиентура", relation: derived }
etymology: "Из латинского cliens «подопечный, зависимый» через немецкое Klient — то же слово, что русский «клиент»."
memory: "klient — «клиент», и слово совпадает с русским почти во всём. Запомнить стоит личное множественное: о людях говорят klienci (klienci stali w kolejce), а форма klienty к людям не применяется — она осталась для неодушевлённого, вроде почтовых клиентов. Поговорка та же, что у нас: Klient ma zawsze rację. Женский род — klientka, кафе клиентуры — klientela."
idioms:
  - { pl: "stały klient", ru: "постоянный клиент" }
  - { pl: "Klient ma zawsze rację", ru: "Клиент всегда прав" }
  - { pl: "obsługa klienta", ru: "обслуживание клиентов" }
