senses:
  - id: customer
    ru: "клиент, покупатель"
    note: "Klient ma zawsze rację «Клиент всегда прав»."
    examples:
      - pl: "Klient ma zawsze rację."
        ru: "Клиент всегда прав."
        source: { kind: tatoeba, id: 3031615 }
      - pl: "Klient chce kupić mojego psa."
        ru: "Клиент хочет купить мою собаку."
