# review
id: ani
format: 2
lemma: "ani"
rank: 284
pos: part
pron: { cyr: "а́ни" }
senses:
  - id: not-a
    ru: "ни (усиление отрицания)"
    examples:
      - pl: "Ani słowa!"
        ru: "Ничего не говорите!"
        source: { kind: tatoeba, id: 2766729 }
      - pl: "Nie znam ani słowa po francusku."
        ru: "Я ни слова не знаю по-французски."
        source: { kind: tatoeba, id: 3604823 }
      - pl: "Nie było ani jednej żywej duszy."
        ru: "Там не было ни одной живой души."
        source: { kind: tatoeba, id: 527732 }
  - id: neither-nor
    ru: "ani… ani… — ни… ни…"
    examples:
      - pl: "Nie umie ani czytać ani pisać."
        ru: "Он не умеет ни читать, ни писать."
        source: { kind: tatoeba, id: 3460788 }
      - pl: "Nie potrafi ani czytać, ani pisać."
        ru: "Он не может ни читать, ни писать."
        source: { kind: tatoeba, id: 525231 }
      - pl: "Na ulicy nie było ani jednej osoby."
        ru: "На улице не было ни одного человека."
        source: { kind: tatoeba, id: 10700691 }
notes:
  - { kind: usage, text: "ani усиливает отрицание и почти всегда идёт вместе с nie: Nie znam ani słowa «Я ни слова не знаю»." }
  - { kind: usage, text: "Парный союз ani… ani… отвечает русскому «ни… ни…»: Nie umie ani czytać, ani pisać." }
  - { kind: usage, text: "ani jeden — «ни один»; ani razu — «ни разу»; ani trochę — «ничуть»." }
collocations:
  - { pl: "ani jeden", ru: "ни один" }
  - { pl: "ani razu", ru: "ни разу" }
  - { pl: "ani trochę", ru: "ничуть" }
  - { pl: "ani słowa", ru: "ни слова" }
etymology: "Праславянское *a + *ni — то же самое, что русское «ни»."
memory: "ani — «ни», и всегда при отрицании: Nie ma ani jednej osoby. Парное ani… ani… отвечает русскому «ни… ни…»."
idioms:
  - { pl: "ani chybi", ru: "непременно" }
  - { pl: "ani mru-mru", ru: "ни гугу" }
  - { pl: "ani be, ani me", ru: "ни бе ни ме" }
formExamples:
  - form: "ani"
    pl: "Ani słowa!"
    ru: "Ничего не говорите!"
    source: { kind: tatoeba, id: 2766729 }
  - form: "ani"
    pl: "Ani kroku dalej!"
    ru: "Ни шагу дальше!"
    source: { kind: tatoeba, id: 6320402 }
  - form: "ani"
    pl: "Nie umie ani czytać ani pisać."
    ru: "Он не умеет ни читать, ни писать."
    source: { kind: tatoeba, id: 3460788 }
