# review
id: przesrac
format: 2
lemma: "przesrać"
rank: 6072
pos: verb
aspect: perf
pron: { cyr: "пшэ́сраць" }
senses:
  - id: squander
    ru: "вульг. просрать: бездарно потерять, упустить (деньги, шанс, матч)"
    examples:
      - pl: "Przesrał wszystkie oszczędności na zakłady."
        ru: "Он просрал все сбережения на ставках."
        source: { kind: authored }
      - pl: "Drużyna przesrała prowadzenie dwa do zera."
        ru: "Команда просрала преимущество два — ноль."
        source: { kind: authored }
      - pl: "Chyba przesrałam swoją szansę."
        ru: "Кажется, я просрала свой шанс."
        source: { kind: authored }
  - id: in-trouble
    ru: "вульг. MIEĆ PRZESRANE — влипнуть, быть в полной заднице; MIEĆ PRZESRANE U KOGOŚ — быть у кого-то на очень плохом счету"
    examples:
      - pl: "Mamy przesrane?"
        ru: "Нам крышка?"
        source: { kind: translated, id: 7679555 }
      - pl: "Jak się dowie, to mamy przesrane."
        ru: "Если он узнает, нам конец."
        source: { kind: authored }
      - pl: "Masz przesrane u szefa."
        ru: "У шефа ты теперь в полной заднице."
        source: { kind: authored }
  - id: lousy
    ru: "вульг. PRZESRANY — хреновый, паршивый"
    examples:
      - pl: "Miałem dziś przesrany dzień."
        ru: "У меня сегодня был хреновый день."
        source: { kind: authored }
      - pl: "Sytuacja jest naprawdę przesrana."
        ru: "Ситуация реально хреновая."
        source: { kind: authored }
notes:
  - { kind: register, text: "Вульгарное слово от SRAĆ, «срать», — точный аналог русского «просрать». В приличной речи вместо него: ZMARNOWAĆ, STRACIĆ, ZAWALIĆ, «упустить, потерять, завалить». Вместо MIEĆ PRZESRANE — смягчённые MIEĆ PRZECHLAPANE и MIEĆ PRZERĄBANE (разговорные, но не грубые) или нейтральное MIEĆ KŁOPOTY, «иметь неприятности»." }
  - { kind: usage, text: "MIEĆ PRZESRANE — безличный оборот, PRZESRANE в нём не меняется: mam, masz, mamy przesrane. Тот, перед кем провинились, — с U и родительным: mieć przesrane u szefa, u teściowej. Без MIEĆ то же слово — сказуемое: Jest przesrane, «полная засада»." }
  - { kind: usage, text: "Причастие PRZESRANY живёт как обычное прилагательное, «хреновый»: przesrany dzień, przesrana sytuacja, przesrane życie. Мужско-личной формы PRZESRANI в речи нет — о людях так не говорят. Примеры даны для причастия, прошедшего времени, инфинитива и PRZESRA; остальные спрягаемые формы оставлены без примеров, как в карточке PIERDOLIĆ." }
  - { kind: pronunciation, text: "«пшэ́сраць»: RZ после P оглушается в «ш», ударение на PRZE-. Причастие — «пшэсра́ны»." }
collocations:
  - { pl: "mieć przesrane", ru: "влипнуть, быть в заднице" }
  - { pl: "mieć przesrane u kogoś", ru: "быть у кого-то на плохом счету" }
  - { pl: "przesrać szansę", ru: "просрать шанс" }
  - { pl: "przesrany dzień", ru: "хреновый день" }
family:
  - { pl: "srać", ru: "срать", relation: root }
etymology: "Приставка PRZE- в значении «потратить впустую, пропустить», как в PRZEGRAĆ, «проиграть», PRZESPAĆ, «проспать», плюс SRAĆ. Русский построил слово так же: «про-» + «срать». Безличное MIEĆ PRZESRANE устроено как MIEĆ PRZECHLAPANE и MIEĆ PRZERĄBANE: причастие среднего рода при MIEĆ, «иметь» дело испорченным."
memory: "Przesrać = про-срать, буквально так же. Mieć przesrane — «нам кранты», przesrany dzień — «хреновый день». Вслух при старших — mieć przechlapane."
idioms:
  - { pl: "mieć przesrane", ru: "влипнуть по полной, «нам конец»" }
  - { pl: "mieć przesrane u kogoś", ru: "быть у кого-то в немилости" }
