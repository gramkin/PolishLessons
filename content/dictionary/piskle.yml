  - { pl: "wypaść z gniazda", ru: "выпасть из гнезда" }
family:
  - { pl: "pisk", ru: "писк", relation: root }
  - { pl: "piszczeć", ru: "пищать", relation: root }
  - { pl: "pisklak", ru: "птенец, птенчик", relation: derived }
  - { pl: "pisklęcy", ru: "птенцовый, птенчиковый", relation: derived }
etymology: "От PISK, «писк», и глагола PISZCZEĆ, звукоподражательного корня, общего со славянским *piskъ и русским «пищать». Суффикс -Ę — праславянский суффикс детёнышей *-ę, *-ęte, тот же, что в CIELĘ, «телёнок», ŹREBIĘ, «жеребёнок», и в русском «-ёнок», «-ята»: «телята», «котята». Отсюда и польское -ĘTA во множественном. Русский назвал детёныша птицы по родителю, «птенец», польский — по голосу."
memory: "Pisklę — тот, кто пищит: pisk, piszczeć. Как русское «-ёнок» с «-ята»: pisklę — pisklęta, как котёнок — котята. В косвенных -ęci-: pisklęcia, pisklęciu; в родительном мн. — piskląt. Читается «пи́скле»."
idioms:
  - { pl: "pisklę orła będzie orłem, pisklę wrony – wroną", ru: "яблоко от яблони недалеко падает" }
  - { pl: "pisklę w obcym gnieździe nie wychowa się", ru: "чужое гнездо птенца не вырастит" }
