notes:
  - { kind: false-friend, text: "Русское «птенец» — от «птица», а польское PISKLĘ — от PISK, «писк», и PISZCZEĆ, «пищать»: птенец назван по звуку, который издаёт. Русскому слышится «пискля», «пискун», но польское слово нейтральное, без насмешки." }
  - { kind: usage, text: "Средний род, особый тип склонения на -Ę, как ZWIERZĘ, KURCZĘ, DZIECKO во множественном: в косвенных падежах единственного -ĘCI-: PISKLĘCIA, PISKLĘCIU, PISKLĘCIEM; во множественном -ĘT-: PISKLĘTA, PISKLĘTOM, а в родительном -ĄT: PISKLĄT. С числами обычно берут собирательные: DWOJE, PIĘCIORO PISKLĄT. Птенец конкретного вида — прилагательным: ŁABĘDZIE PISKLĘ, «лебедёнок», ORLE PISKLĘ, «орлёнок»; польский не образует отдельного слова, где русский говорит «-ёнок»." }
  - { kind: pronunciation, text: "Читается «пи́скле», два слога, ударение на первом. Конечное Ę звучит как «е», без носового призвука. В косвенных падежах носовой возвращается: PISKLĘCIA — «пискле́ньця», с «энь» перед Ć; PISKLĄT — «пи́склонт», с «он» перед T." }
  - { kind: register, text: "В прямом значении нейтральное, книжное и научное: так пишут орнитологи и учебники биологии. В разговоре о маленьком птенце часто говорят PISKLAK или PISKLACZEK. О ребёнке — ласковое, о новичке — снисходительное, как русское «желторотик»." }
collocations:
  - { pl: "pisklę się wykluwa", ru: "птенец вылупляется" }
  - { pl: "karmić pisklęta", ru: "кормить птенцов" }
