etymology: "Из латинского acta «совершённое, деяния», множественного от actum, от agere «делать, вести». То же слово дало русские «акт» и «акты». Польский закрепил множественное за судебной и архивной папкой, оставив единственное akt при других значениях."
memory: "akta — «материалы дела», только во множественном числе, пять форм. И следи за родительным: akt значит «дел», но akt в единственном — это уже другое слово, «акт»."
idioms:
