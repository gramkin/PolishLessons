notes:
  - { kind: usage, text: "ЭТО СЛОВО ЖИВЁТ ТОЛЬКО ВО МНОЖЕСТВЕННОМ ЧИСЛЕ, И ФОРМ У НЕГО ПЯТЬ. Akta, akt, aktom, aktami, aktach — единственного числа в этом значении нет. Так же ведут себя ciuchy, przeprosiny, odwiedziny, finanse и drzwi. Русское «дело» в смысле папки документов тоже чаще во множественном: «материалы дела»." }
  - { kind: false-friend, text: "РОДИТЕЛЬНЫЙ МНОЖЕСТВЕННОГО СОВПАДАЕТ С ДРУГИМ СЛОВОМ. Форма AKT значит и «дел» (nie ma tu akt), и отдельное существительное akt — «акт», то есть документ, действие в пьесе или обнажённая натура в живописи. Это два разных слова, и различает их только контекст: brak akt против jeden akt." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: AK-ta. Оба a открытые, kt произносится слитно: «а́кта». Родительный akt звучит коротко и глухо: «акт»." }
