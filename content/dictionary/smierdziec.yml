  - id: fishy
    ru: "перен. дело нечисто, пахнет дурно"
    examples:
      - pl: "Coś mi tu śmierdzi."
        ru: "Что-то мне здесь не нравится."
        source: { kind: authored }
      - pl: "Ta sprawa zaczyna śmierdzieć."
        ru: "Это дело начинает пахнуть дурно."
        source: { kind: authored }
  - id: stinking
    ru: "śmierdzący — вонючий, дурно пахнущий"
    examples:
      - pl: "Śmierdzący ser smakuje lepiej, niż pachnie."
        ru: "Вонючий сыр на вкус лучше, чем на запах."
        source: { kind: authored }
      - pl: "Śmierdzące śmieci stały na klatce."
        ru: "Вонючий мусор стоял в подъезде."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Родство точное, а употребление — нет, и это главное. Польское śmierdzieć и русское «смердеть» — одно праславянское слово *smьrděti, а польское smród отвечает русскому «смраду». НО: по-польски śmierdzieć — обычное, повседневное слово, которым говорят о любом дурном запахе, то есть соответствует русскому «ВОНЯТЬ». Русское «смердеть» книжно и почти вышло из обихода, поэтому переводить śmierdzi как «смердит» — значит поднять стиль там, где поляк говорит просто." }
  - { kind: government, text: "Чем воняет — ТВОРИТЕЛЬНЫЙ без предлога: śmierdzieć rybą, dymem, potem. Точно как по-русски «воняет рыбой». Безличный оборот тоже совпадает: tu śmierdzi — «здесь воняет»." }
  - { kind: register, text: "Слово прямое и не из вежливых: в присутствии хозяев о еде так не скажут. Нейтрально будет nieprzyjemnie pachnieć «неприятно пахнуть», а pachnieć само по себе значит «пахнуть» (обычно хорошо). Повелительные формы (śmierdź, śmierdźcie) в прямом приказе почти не встречаются — только в отмахивании: Nie śmierdź mi tu dymem, Śmierdźcie sobie na balkonie." }
  - { kind: usage, text: "Объём парадигмы — 52 формы, и страдательного причастия среди них нет вовсе: глагол НЕПЕРЕХОДНЫЙ, винительного дополнения у него не бывает, значит и подлежащего для страдательного оборота взять негде. Форм вроде *śmierdziany не существует. Это не пропуск, а свойство глагола, как у wylądować, powrócić и dreptać. Зато вид несовершенный, поэтому есть причастия настоящего времени: śmierdzący, śmierdząc." }
collocations:
  - { pl: "śmierdzieć rybą", ru: "вонять рыбой" }
  - { pl: "coś tu śmierdzi", ru: "тут дело нечисто" }
