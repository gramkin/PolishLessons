  - { pl: "śmierdzący", ru: "вонючий", relation: derived }
  - { pl: "pachnieć", ru: "пахнуть (обычно хорошо)", relation: antonym }
etymology: "Праславянское *smьrděti — то же слово, что русское «смердеть», и из того же гнезда польское smród при русском «смраде». Корень тот же, что в «смердить» и, через значение «гниль», в целом ряде слов о порче. Расхождение не в происхождении, а в стиле: польский оставил слово в быту, русский поднял его в книжный слой и заменил в обиходе на «вонять»."
memory: "śmierdzieć — «ВОНЯТЬ», хотя дословно это русское «смердеть». Помните стилевую разницу: по-польски это обычное слово, по-русски — книжное. Воняют чем-то в творительном: śmierdzi rybą. И страдательного причастия у глагола нет — он непереходный."
idioms:
  - { pl: "coś tu śmierdzi", ru: "тут дело нечисто" }
  - { pl: "śmierdzieć na kilometr", ru: "вонять за километр" }
