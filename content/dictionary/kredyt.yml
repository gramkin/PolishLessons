etymology: "Из латинского CREDITUM «данное взаймы», от глагола CREDERE «верить, доверять», через итальянское банковское дело и немецкий язык. Исходная мысль прямая: кредит есть доверие, и потому переносное KREDYT ZAUFANIA не метафора, а возвращение к первоначальному смыслу. От того же корня идут CREDO «верую», и русское «кредо», и слово «кредитор». Русский получил слово тем же путём, через немецкий, в петровское время. Похожее на вид KREDA происходит от совсем другого латинского слова, CRETA, которым называли белую глину с острова Крит, и родственно оно скорее названию острова, чем доверию; производное KREDKA «цветной карандаш» идёт от мела, а не от займа."
memory: "То же слово, что русский «кредит», от латинского credere «верить» — отсюда и kredyt zaufania, который не метафора, а исходный смысл. Звучит иначе: «крэ́дыт», с «э» и «ы», ударение на первом слоге. Не путать с соседями по виду: kreda это мел, от латинского creta, а kredka — цветной карандаш. Покупают na kredyt, с предлогом na. Местный kredycie с меной t→c, как akcencie и wypłacie."
idioms:
