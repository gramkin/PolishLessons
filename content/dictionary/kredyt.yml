notes:
  - { kind: false-friend, text: "Значение то же, что у русского «кредита», и оба слова заимствованы из одного источника. Ловушка не в нём, а в соседях по виду. KREDA значит «мел», а не кредит, и KREDKA — цветной карандаш, от того же мела. Корни при этом разные: KREDYT идёт от латинского CREDERE «верить», а KREDA от латинского CRETA «мел», и сходство трёх слов в польском чисто внешнее. Второе различие — в обороте: по-русски покупают «в кредит», по-польски NA KREDYT, с предлогом NA. Третье: KREDYT HIPOTECZNY это ипотека, и слова IPOTEKA в обиходе нет." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Местный единственного — KREDYCIE, где конечное T основы переходит в C перед окончанием -E: это та же обязательная мена, что в AKCENCIE, KONFLIKCIE и WYPŁACIE, и здесь она попадает в частую форму — O KREDYCIE, PRZY KREDYCIE. Родительный единственного — KREDYTU. Винительный равен именительному. Управление: KREDYT NA COŚ в винительном — KREDYT NA MIESZKANIE, KREDYT NA SAMOCHÓD; а берут и погашают его глаголами WZIĄĆ KREDYT и SPŁACIĆ KREDYT." }
  - { kind: pronunciation, text: "Читается «крэ́дыт», два слога, ударение на первом. Буква E после R звучит как «э», а Y — как «ы», поэтому слово не похоже на русское «креди́т» ни ударением, ни гласными. Конечное T твёрдое и глухое. В форме KREDYTU слышно «крэды́ту», с ударением на втором слоге. В форме KREDYCIE сочетание CIE даёт мягкое «це»: «крэды́це». В форме KREDYTÓW буква Ó даёт «у», а конечное W оглушается: «крэды́туф»." }
  - { kind: register, text: "Слово нейтральное и обиходное — в Польше о кредитах говорят постоянно. Устойчивые сочетания: KREDYT HIPOTECZNY «ипотечный кредит», KREDYT GOTÓWKOWY «потребительский кредит», ZDOLNOŚĆ KREDYTOWA «кредитоспособность», RATA KREDYTU «платёж по кредиту», WZIĄĆ KREDYT, SPŁACAĆ KREDYT. Переносное KREDYT ZAUFANIA отвечает русскому «кредиту доверия» и встречается в политических текстах. Разговорное KUPIĆ NA KREDYT значит «купить в долг» и звучит буднично, без всякого осуждения." }
