# review
id: zroznicowac
format: 2
lemma: "zróżnicować"
rank: 5831
pos: verb
aspect: perf
pron: { cyr: "зружницо́ваць" }
senses:
  - id: diversify
    ru: "разнообразить, сделать разнообразнее"
    examples:
      - pl: "Musisz zróżnicować swoją dietę."
        ru: "Тебе нужно разнообразить свой рацион."
        source: { kind: authored }
      - pl: "Firma zróżnicowała ofertę dla klientów."
        ru: "Фирма сделала предложение для клиентов разнообразнее."
        source: { kind: authored }
      - pl: "Chciałbym mieć więcej zróżnicowania w pracy."
        ru: "Я бы хотел больше разнообразия в работе."
        source: { kind: translated, id: 734270 }
  - id: differentiate
    ru: "дифференцировать, разделить по различиям"
    examples:
      - pl: "Nauczyciel zróżnicował zadania według poziomu."
        ru: "Учитель распределил задания по уровню."
        source: { kind: authored }
      - pl: "Rząd zróżnicuje podatki dla małych firm."
        ru: "Правительство дифференцирует налоги для малых фирм."
        source: { kind: authored }
  - id: diverse
    ru: "zróżnicowany — разнообразный, неоднородный"
    note: "Причастие часто работает как прилагательное."
    examples:
      - pl: "Klimat w Polsce jest dość zróżnicowany."
        ru: "Климат в Польше довольно разнообразный."
        source: { kind: authored }
      - pl: "Ceny w sklepach są bardzo zróżnicowane."
        ru: "Цены в магазинах очень разные."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — RÓŻNICOWAĆ. Спряжение на -UJĘ: ZRÓŻNICUJĘ, ZRÓŻNICUJESZ, ZRÓŻNICUJĄ — это будущее время: ZRÓŻNICUJEMY OFERTĘ «мы разнообразим предложение»." }
  - { kind: usage, text: "Чаще всего встречается не сам глагол, а причастие ZRÓŻNICOWANY «разнообразный, неоднородный» и существительное ZRÓŻNICOWANIE «разнообразие, различие»: ZRÓŻNICOWANY TEREN, DUŻE ZRÓŻNICOWANIE CEN." }
  - { kind: government, text: "Что — винительный: ZRÓŻNICOWAĆ DIETĘ. По какому признаку — POD WZGLĘDEM чего или WEDŁUG чего: ZRÓŻNICOWAĆ ZADANIA WEDŁUG POZIOMU." }
  - { kind: register, text: "Слово книжное, из языка экономики, науки, школы. В быту скажут UROZMAICIĆ «разнообразить»: UROZMAICIĆ DIETĘ." }
collocations:
  - { pl: "zróżnicować dietę", ru: "разнообразить рацион" }
  - { pl: "zróżnicować ofertę", ru: "расширить ассортимент" }
  - { pl: "zróżnicowany teren", ru: "пересечённая местность" }
  - { pl: "zróżnicowany pod względem wieku", ru: "разного возраста" }
family:
  - { pl: "różnicować", ru: "дифференцировать, различать", relation: aspect }
  - { pl: "różny", ru: "разный", relation: root, id: rozny }
  - { pl: "różnica", ru: "разница", relation: root, id: roznica }
  - { pl: "zróżnicowanie", ru: "разнообразие, различие", relation: derived }
etymology: "Приставка Z- плюс RÓŻNICOWAĆ, от RÓŻNICA «разница», а та от RÓŻNY «разный»; это тот же корень, что русское «рознь», «розный»."
memory: "Zróżnicować — «сделать разным»: внутри RÓŻNY, русское «рознь». Zróżnicowany — разнообразный."
idioms:
  - { pl: "zróżnicowanie społeczne", ru: "социальное расслоение" }
