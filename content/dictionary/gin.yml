notes:
  - { kind: false-friend, text: "GIN — «джин», пишется по-английски, а читается «джин»: G перед I звучит как «дж», а не как «г». Не путайте с формами глагола GINĄĆ, «гибнуть»: GINIE — и «в джине», и «гибнет»." }
  - { kind: usage, text: "Мужской род, неисчисляемое. Учим единственное: GIN, GINU, GINOWI, GINEM, GINIE. Родительный — GINU: BUTELKA GINU." }
