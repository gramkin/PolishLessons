etymology: "Из французского armée, от латинского armata «вооружённая» — тем же путём, что и русская «армия». Значение совпадает полностью."
memory: "armia — «армия», без подвохов. Запомните предлоги: wstąpić DO armii «вступить в армию» с родительным, но służyć W armii «служить в армии» с предложным."
idioms:
