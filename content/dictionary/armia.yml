notes:
  - { kind: government, text: "wstąpić DO armii «вступить в армию» — предлог do с родительным. Служат же W armii, с предложным: służył w armii." }
  - { kind: usage, text: "Значение совпадает с русским полностью: слово пришло из французского armée, как и русская «армия»." }
  - { kind: usage, text: "Переносно — о большом количестве: armia turystów «армия туристов»." }
  - { kind: usage, text: "Множественное число в живой речи почти не встречается: об армиях говорят редко, обычно о конкретной армии." }
collocations:
  - { pl: "wstąpić do armii", ru: "вступить в армию" }
