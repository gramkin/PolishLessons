etymology: "Из латинского DISCUSSIO «рассмотрение, разбор», от DISCUTERE, которое буквально значило «разбивать на части, расшибать»: из DIS- «врозь» и QUATERE «трясти, бить». То есть исходный образ — не беседа, а разламывание вопроса на куски, чтобы рассмотреть каждый. Русская «дискуссия» пришла тем же путём и в то же время, через латинские учёные тексты, и смысл у слов полностью совпадает. Любопытно, что тот же глагол QUATERE дал французское CASSER «ломать» и, через него, слово «кассация» — отмена судебного решения, то есть его «разбивание». Так что DYSKUSJA и KASACJA — дальние родственники, и оба про разбор по частям."
memory: "Две ошибки подряд, если писать по-русски: одна s, как в kaseta, и y вместо «и», как в dysk. Читается «дыску́сья». Родительный, дательный и местный совпадают: dyskusji, старая форма родительного множественного — dyskusyj. Из латинского discutere «разбивать на части»: вопрос разламывают, чтобы рассмотреть."
