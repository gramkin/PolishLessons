notes:
  - { kind: false-friend, text: "Написание расходится с русским дважды, и оба расхождения подчиняются правилам, уже знакомым из других карточек. Во-первых, одна S там, где русский пишет две: DYSKUSJA против «дискуссии», как KASETA против «кассеты» и KLASA против «класса». Во-вторых, Y там, где русский пишет «и» после твёрдой согласной: DYSKUSJA, как DYSK против «диска» и SYSTEM против «системы». Итого слово читается «дыску́сья», с твёрдым Д, гласной «ы» и одним коротким С. Из двух ошибок складывается почти неузнаваемое слово, поэтому стоит проговорить его вслух." }
  - { kind: usage, text: "Класс на -SJA ведёт себя как класс на -IA: в родительном, дательном и местном падеже единственного числа буква I удваивается не на письме, а по сути — выходит форма DYSKUSJI, и она же служит всем трём падежам. BEZ DYSKUSJI, W DYSKUSJI, DYSKUSJI в дательном — одна форма. Родительный множественного тоже DYSKUSJI, а старая книжная форма DYSKUSYJ встречается в текстах до войны, как PRODUKCYJ и RELIGIJ. Два оборота стоит выучить целиком: BEZ DYSKUSJI «без разговоров», как приказ, и NIE PODLEGA DYSKUSJI «не подлежит обсуждению»." }
  - { kind: pronunciation, text: "Читается «дыску́сья», ударение на предпоследнем слоге. Сочетание SJA даёт «сья», в один слог, а не «сия» в два: слово трёхсложное: DY-SKU-SJA. Гласная Y звучит как русское «ы» и оставляет предыдущую согласную твёрдой. Одно S произносится коротко, без удвоения, которое русский делает машинально. В форме DYSKUSJI окончание звучит «сьи»." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: ROZPOCZĘLI DYSKUSJĘ. Участие вводится предлогом W с местным: BRAĆ UDZIAŁ W DYSKUSJI «участвовать в дискуссии», и русский строит это так же. Предмет обсуждения — предлог O с местном: DYSKUSJA O REFORMIE «дискуссия о реформе», а также NAD с творительным в более официальном стиле: DYSKUSJA NAD PROJEKTEM. При отрицании винительный уходит в родительный: NIE ROZPOCZĘLI DYSKUSJI." }
