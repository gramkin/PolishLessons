notes:
  - { kind: usage, text: "Практически всегда в связке a nuż «а вдруг». Отдельно частица не употребляется." }
  - { kind: false-friend, text: "Осторожно: nóż «нож» звучит точно так же — оба читаются «нуш». На письме их различают ó и u, а в латинской записи различие исчезает вовсе." }
  - { kind: government, text: "Не изменяется; вводит допущение, часто с оттенком надежды." }
  - { kind: usage, text: "Русское «а вдруг» — точное соответствие и по смыслу, и по интонации." }
collocations:
  - { pl: "a nuż", ru: "а вдруг" }
  - { pl: "a nuż się uda", ru: "а вдруг получится" }
etymology: "Частица, родственная no и -ż; ср. русское «ну-ка», «а ну»."
memory: "nuż живёт в обороте a nuż «а вдруг». Осторожно с омофоном: nóż «нож» читается точно так же, «нуш», и различается только буквой."
