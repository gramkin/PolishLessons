notes:
  - { kind: false-friend, text: "Это один из самых показательных примеров правила -dł- / -л-. Польский сохранил праславянское сочетание dl, а восточнославянские его упростили: skrzydło отвечает русскому «крыло», mydło — «мыло», szydło — «шило», radło — «рало». Узнав это соответствие один раз, можно угадывать десятки слов в обе стороны." }
  - { kind: usage, text: "Склонение с чередованием: родительный множественного skrzydeł (с беглой гласной), предложный единственного skrzydle, дательный skrzydłu. Форма skrzydła — это и родительный единственного, и именительный множественного." }
  - { kind: government, text: "Переносные обороты совпадают с русскими почти дословно: rozwinąć skrzydła «расправить крылья», dodać komuś skrzydeł «придать кому-л. крыльев» (с родительным), pod skrzydłami kogoś «под чьим-л. крылом»." }
collocations:
  - { pl: "rozpostrzeć skrzydła", ru: "расправить крылья" }
  - { pl: "pod skrzydłami", ru: "под крылом" }
  - { pl: "lewe skrzydło", ru: "левое крыло" }
family:
  - { pl: "skrzydlaty", ru: "крылатый", relation: derived }
  - { pl: "skrzydełko", ru: "крылышко", relation: derived }
etymology: "Праславянское *krydlo. Польский сохранил сочетание dl и добавил начальное s-, восточнославянские языки сочетание упростили — отсюда русское «крыло». То же соответствие видно в парах mydło/«мыло», szydło/«шило», radło/«рало»: там, где в польском dł, в русском стоит одно л."
memory: "skrzydło — русское «крыло», и различие регулярное: польское dł отвечает русскому л, как в mydło/«мыло» и szydło/«шило». Обороты те же: rozwinąć skrzydła, pod skrzydłami."
idioms:
  - { pl: "rozwinąć skrzydła", ru: "расправить крылья" }
  - { pl: "dodać komuś skrzydeł", ru: "придать кому-л. крыльев" }
