notes:
  - { kind: usage, text: "Состояние выражается оборотом: być w ciąży «быть беременной», а не отдельным прилагательным. Jestem w ciąży «Я беременна»." }
  - { kind: government, text: "zajść W ciążę «забеременеть» — предлог w и винительный падеж. Это самый обычный способ сказать о наступлении беременности." }
  - { kind: usage, text: "Слово от ciążyć «тяготеть, быть в тягость», того же корня, что ciężki «тяжёлый». Русское «беременность» образовано от «бремя» — та же мысль о ноше." }
  - { kind: usage, text: "Прилагательное ciężarna «беременная» тоже есть, но в живой речи чаще говорят w ciąży." }
collocations:
  - { pl: "być w ciąży", ru: "быть беременной" }
  - { pl: "zajść w ciążę", ru: "забеременеть" }
  - { pl: "ciąża mnoga", ru: "многоплодная беременность" }
  - { pl: "ciężarna", ru: "беременная" }
family:
  - { pl: "ciążyć", ru: "тяготеть", relation: root }
  - { pl: "ciężki", ru: "тяжёлый", relation: root }
  - { pl: "ciężarna", ru: "беременная", relation: derived }
etymology: "От ciążyć «тяготеть, быть в тягость», того же корня, что ciężki «тяжёлый». Русское «беременность» собрано от «бремя» — мысль о ноше та же самая."
memory: "ciąża — «беременность», и состояние передаётся оборотом: być w ciąży «быть беременной», zajść w ciążę «забеременеть». Отдельного прилагательного в обиходе почти нет, хотя слово ciężarna существует. Корень тот же, что в ciężki «тяжёлый»."
idioms:
  - { pl: "być w ciąży", ru: "быть беременной" }
  - { pl: "zajść w ciążę", ru: "забеременеть" }
  - { pl: "ciąża mnoga", ru: "многоплодная беременность" }
