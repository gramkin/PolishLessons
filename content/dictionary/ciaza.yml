etymology: "От ciążyć «тяготеть, быть в тягость», того же корня, что ciężki «тяжёлый». Русское «беременность» собрано от «бремя» — мысль о ноше та же самая."
memory: "ciąża — «беременность», и состояние передаётся оборотом: być w ciąży «быть беременной», zajść w ciążę «забеременеть». Отдельного прилагательного в обиходе почти нет, хотя слово ciężarna существует. Корень тот же, что в ciężki «тяжёлый»."
