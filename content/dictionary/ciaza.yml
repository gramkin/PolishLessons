  - id: about
    ru: "о течении беременности"
    examples:
      - pl: "Ciąża przebiega prawidłowo."
        ru: "Беременность протекает нормально."
        source: { kind: authored }
      - pl: "To jej druga ciąża."
        ru: "Это её вторая беременность."
        source: { kind: authored }
      - pl: "Ciąża trwa dziewięć miesięcy."
        ru: "Беременность длится девять месяцев."
