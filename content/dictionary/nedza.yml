notes:
  - { kind: false-friend, text: "Слово то же, что русская «нужда»: тут работает правило носовых, где у поляка Ę, у нас У. Но смыслы развелись по силе. Польская NĘDZA это нищета, крайняя бедность, а наша «нужда» — скорее надобность, потребность, и «нуждаться» значит просто «иметь потребность». Так что NĘDZA переводится «нищетой». А в гнезде сидит настоящая неожиданность: NĘDZARZ это нищий, зато NĘDZNIK — негодяй, подлец." }
  - { kind: usage, text: "Десять форм, женский род. Родительный, дательный и местный единственного числа совпадают: все три дают NĘDZY. В родительном множественного окончания нет: NĘDZ. Множественное NĘDZE употребляется редко и только книжно, о бедствиях разных времён. Прилагательное NĘDZNY значит «убогий, жалкий» и о жилье, и о попытке." }
  - { kind: government, text: "В нищете — W NĘDZY, местный падеж. А «впасть в нищету» — POPAŚĆ W NĘDZĘ, тот же предлог, но винительный, потому что есть движение. Это та же пара, что в TRAFIĆ W SEDNO против W SEDNIE. Бедствовать — KLEPAĆ NĘDZĘ, винительный без предлога, буквально «колотить нищету», и оборот этот вполне разговорный." }
  - { kind: pronunciation, text: "Читается «не́ндза», два слога, ударение на первом. Носовой Ę перед DZ даёт «эн», поэтому первый слог это «нен». Сочетание DZ произносится как один слитный звук «дз», а не как «д» и «з» по отдельности. В форме NĘDZY конечное Y даёт «ы»: «не́ндзы»." }
  - { kind: register, text: "Слово сильное и невесёлое, из книг и из разговора о тяжёлых временах: SKRAJNA NĘDZA, ŻYĆ W NĘDZY, POPAŚĆ W NĘDZĘ. Оборот KLEPAĆ NĘDZĘ разговорный и чуть насмешливый, о том, кто еле сводит концы. А NĘDZNY в быту значит просто «жалкий»: NĘDZNA WYMÓWKA — «жалкая отговорка»." }
collocations:
  - { pl: "żyć w nędzy", ru: "жить в нищете" }
  - { pl: "skrajna nędza", ru: "крайняя нищета" }
