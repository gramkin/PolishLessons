  - { pl: "nędzarz", ru: "нищий", relation: derived }
  - { pl: "nędznik", ru: "негодяй, подлец", relation: derived }
etymology: "Праславянское слово с носовым гласным, давшее и русскую «нужду». Правило носовых здесь видно как на ладони: где поляк пишет Ę, у нас стоит У, как в WĘGIEL при «угле» и PIĘĆ при «пяти». Разошлись языки в силе значения: поляк оставил слово за крайней бедностью, русский ослабил его до всякой надобности. А польское NĘDZNIK показывает, куда может уйти смысл: от бедняка до подлеца."
memory: "Нищета, крайняя бедность. Слово то же, что наша «нужда» — правило носовых, где у поляка e с хвостиком, у нас у — но наше ослабло до «надобности», а польское осталось сильным. Читается «не́ндза», где dz один слитный звук. В нищете — w nedzy, местный; впасть в нищету — popasc w nedze, винительный. И запомните родню: nedzarz это нищий, а nedznik — негодяй."
idioms:
  - { pl: "klepać nędzę", ru: "бедствовать, еле сводить концы" }
