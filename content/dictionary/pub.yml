notes:
  - { kind: false-friend, text: "PUB — «паб», читается «паб», как по-английски. Ближайшее родное слово — KNAJPA или BAR; PUB — именно пивной бар в британском стиле. PIWIARNIA — «пивная»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Родительный — PUBU. В местном B смягчается: W PUBIE." }
