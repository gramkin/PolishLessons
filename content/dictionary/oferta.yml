# review
id: oferta
format: 2
lemma: "oferta"
rank: 1460
pos: noun
pron: { cyr: "офэ́рта" }
senses:
  - id: offer
    ru: "предложение (деловое)"
    examples:
      - pl: "To moja ostateczna oferta."
        ru: "Это моё окончательное предложение."
        source: { kind: translated, id: 3600385 }
      - pl: "Przyjmuję ofertę."
        ru: "Я принимаю предложение."
        source: { kind: translated, id: 3049239 }
      - pl: "Odrzucił moją ofertę."
        ru: "Он отклонил моё предложение."
        source: { kind: translated, id: 579178 }
  - id: range
    ru: "ассортимент, набор предлагаемого"
    examples:
      - pl: "W ofercie naszego sklepu można znaleźć sukienki z dzianiny na każdą okazję."
        ru: "В ассортименте нашего магазина можно найти трикотажные платья на любой случай."
        source: { kind: translated, id: 3744813 }
      - pl: "To jest jedna z najtańszych ofert, jaką znalazłem."
        ru: "Это одно из самых дешёвых предложений, какие я нашёл."
        source: { kind: translated, id: 6154925 }
notes:
  - { kind: false-friend, text: "oferta — это деловое «предложение» товара, цены или работы. Предложение руки и сердца — oświadczyny, а грамматическое предложение — zdanie. Русское слово покрывает все три, польское только первое." }
  - { kind: usage, text: "Ходовые глаголы: przyjąć ofertę «принять предложение», odrzucić ofertę «отклонить», złożyć ofertę «подать»." }
  - { kind: usage, text: "w ofercie — «в ассортименте»: W ofercie naszego sklepu… — обычная рекламная формула." }
  - { kind: usage, text: "oferta pracy «вакансия», oferta specjalna «специальное предложение»." }
collocations:
  - { pl: "przyjąć ofertę", ru: "принять предложение" }
  - { pl: "odrzucić ofertę", ru: "отклонить предложение" }
  - { pl: "oferta pracy", ru: "предложение работы" }
etymology: "Из латинского offerre «предлагать» через европейские языки. В русском «оферта» осталась юридическим термином, а в быту говорят «предложение»."
memory: "oferta — деловое «предложение»: przyjąć ofertę, odrzucić ofertę. Но осторожно: предложение руки и сердца это oświadczyny, а грамматическое предложение — zdanie. Русское слово покрывает все три, польское только первое."
idioms:
  - { pl: "oferta pracy", ru: "предложение работы" }
  - { pl: "oferta specjalna", ru: "специальное предложение" }
  - { pl: "przyjąć ofertę", ru: "принять предложение" }
formExamplesSkip:
  - { form: "oferty", cell: "Звательный", reason: "звательный падеж: к предмету или понятию не обращаются" }
