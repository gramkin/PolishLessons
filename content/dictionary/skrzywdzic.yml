# review
id: skrzywdzic
format: 2
lemma: "skrzywdzić"
rank: 1096
pos: verb
aspect: perf
pron: { cyr: "скшы́вдзиць" }
senses:
  - id: hurt
    ru: "обидеть, причинить вред (совершенный вид)"
    examples:
      - pl: "Nie chciałem cię skrzywdzić."
        ru: "Я не хотел тебя обидеть."
        source: { kind: translated, id: 2683451 }
      - pl: "Tom nas nie skrzywdzi."
        ru: "Том нас не обидит."
        source: { kind: tatoeba, id: 6441742 }
      - pl: "Jak Tomek Cię skrzywdził?"
        ru: "Чем Томек тебя обидел?"
        source: { kind: translated, id: 12454025 }
  - id: reassure
    ru: "не обидеть, не тронуть (в заверениях)"
    examples:
      - pl: "Nigdy Cię nie skrzywdzę."
        ru: "Я никогда тебя не обижу."
        source: { kind: translated, id: 2077390 }
      - pl: "Nie skrzywdziłby muchy."
        ru: "Он и мухи не обидит."
        source: { kind: translated, id: 6328171 }
  - id: wronged
    ru: "skrzywdzony — обиженный, пострадавший"
    examples:
      - pl: "Nie chcę już więcej być przez nikogo skrzywdzona."
        ru: "Я больше не хочу, чтобы меня кто-то обижал."
        source: { kind: translated, id: 3479584 }
      - pl: "Czuła się skrzywdzona."
        ru: "Она чувствовала себя обиженной."
        source: { kind: authored }
notes:
  - { kind: government, text: "skrzywdzić kogoś — винительный падеж без предлога, ровно как русское «обидеть кого-то»." }
  - { kind: false-friend, text: "Слово сильнее русского «обидеть»: это скорее «причинить вред, сделать больно». Просто задеть словом — obrazić." }
  - { kind: usage, text: "Несовершенный вид — krzywdzić. Корень — krzywda «обида, вред», от krzywy «кривой»." }
  - { kind: usage, text: "nie skrzywdziłby muchy «и мухи не обидит» — оборот совпадает с русским слово в слово." }
collocations:
  - { pl: "skrzywdzić kogoś", ru: "обидеть кого-то" }
  - { pl: "nie skrzywdzić muchy", ru: "мухи не обидеть" }
  - { pl: "czuć się skrzywdzonym", ru: "чувствовать себя обиженным" }
family:
  - { pl: "krzywdzić", ru: "обижать (несовершенный вид)", relation: aspect }
  - { pl: "krzywda", ru: "обида, вред", relation: root }
  - { pl: "krzywy", ru: "кривой", relation: root }
etymology: "Приставка s- плюс krzywda «обида, вред», от krzywy «кривой» — буквально «поступить криво» с кем-то. Русская «кривда» — то же слово, только у нас оно значит «неправда»."
memory: "skrzywdzić — «обидеть, причинить вред», и это сильнее русского «обидеть»: задеть словом будет obrazić. Управление простое: skrzywdzić kogoś, винительный. Оборот тот же: nie skrzywdziłby muchy «и мухи не обидит»."
idioms:
  - { pl: "nie skrzywdziłby muchy", ru: "и мухи не обидит" }
  - { pl: "skrzywdzić kogoś", ru: "обидеть кого-то" }
