notes:
  - { kind: false-friend, text: "Русскому NATYCHMIASTOWY не подсказывает ничего, а слово частое. Оно от наречия NATYCHMIAST, «немедленно», которое собрано из NA TYCH MIASTACH, буквально «на этих местах», то есть «прямо тут, не сходя с места». Русское «на месте» в смысле «сразу» устроено так же. Растворимый кофе по-польски тоже KAWA ROZPUSZCZALNA, а NATYCHMIASTOWA — реже, калька английского instant." }
  - { kind: usage, text: "Степеней сравнения нет. Формы для мужчин-людей NATYCHMIASTOWI в карточке нет: немедленными бывают реакции и решения, а не люди. Остальные десять форм живые. Самое частое употребление — в родительном после глаголов требования: WYMAGA NATYCHMIASTOWEJ, DOMAGA SIĘ NATYCHMIASTOWEGO." }
  - { kind: government, text: "Ставится перед существительным: NATYCHMIASTOWA POMOC, NATYCHMIASTOWE DZIAŁANIE. С существительными-терминами — после: SKUTEK NATYCHMIASTOWY, «немедленное действие». Падежных требований нет; Z NATYCHMIASTOWYM SKUTKIEM — «с немедленным вступлением в силу»." }
  - { kind: pronunciation, text: "Читается «натыхмясто́вы», пять слогов, ударение на предпоследнем. TY — твёрдое «ты», CH — «х», MIA — «мя». Начало как в NATYCHMIAST «наты́хмяст», но ударение в прилагательном уходит к концу." }
  - { kind: register, text: "Слово официальное и газетное: ZWOLNIENIE ZE SKUTKIEM NATYCHMIASTOWYM, «увольнение с немедленным вступлением в силу», NATYCHMIASTOWA DYMISJA. В разговоре чаще наречие: NATYCHMIAST!, «немедленно!» или OD RAZU, «сразу»." }
collocations:
  - { pl: "natychmiastowa reakcja", ru: "немедленная реакция" }
  - { pl: "ze skutkiem natychmiastowym", ru: "с немедленным вступлением в силу" }
  - { pl: "natychmiastowa pomoc", ru: "немедленная помощь" }
family:
  - { pl: "natychmiast", ru: "немедленно", relation: root, id: natychmiast }
  - { pl: "od razu", ru: "сразу", relation: root }
  - { pl: "miejsce", ru: "место", relation: root, id: miejsce }
etymology: "Из старопольского NA TYCH MIASTACH, «на этих местах», где MIASTO когда-то значило «место». Потом сочетание срослось в одно наречие NATYCHMIAST, а от него польский образовал прилагательное. MIASTO сейчас значит «город», а старое значение «место» живёт только в этом слове и в ZAMIAST, «вместо»."
memory: "Natychmiastowy — немедленный: natychmiastowa reakcja, ze skutkiem natychmiastowym. Из na tych miastach — «на этих местах», то есть «не сходя с места». Читается «натыхмясто́вы»."
idioms:
