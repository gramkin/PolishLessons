etymology: "Праславянское *golsъ; русское «голос» — то же самое слово. Разница закономерная: польскому gło- отвечает русское голо-, как в głowa — голова, złoto — золото."
memory: "głos — «голос», и это лучший случай запомнить полногласие: польскому gło-/zło- отвечает русское голо-/золо-. głos — голос, głowa — голова, złoto — золото, krowa — корова. Второе значение то же, что в русском: głos на выборах — «голос», а głosować — «голосовать»."
