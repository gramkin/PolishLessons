# review
id: buta
format: 2
lemma: "buta"
rank: 3845
pos: noun
pron: { cyr: "бу́та" }
senses:
  - id: arrogance
    ru: "спесь, заносчивость, высокомерие"
    examples:
      - pl: "Jego buta wszystkich zraziła."
        ru: "Его спесь всех оттолкнула."
        source: { kind: authored }
      - pl: "Mówił z butą o swoich sukcesach."
        ru: "Он с высокомерием говорил о своих успехах."
        source: { kind: authored }
      - pl: "W jej głosie było pełno buty."
        ru: "В её голосе было полно заносчивости."
        source: { kind: authored }
  - id: defiance
    ru: "дерзость, вызывающая гордость"
    examples:
      - pl: "Z butą odrzucił propozycję."
        ru: "Он дерзко отверг предложение."
        source: { kind: authored }
      - pl: "Ta młodzieńcza buta szybko minęła."
        ru: "Эта юношеская дерзость быстро прошла."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "BUTA — «спесь», а не «бутса» и не «ботинок»: ботинок — BUT, ботинки — BUTY. Совпадение форм опасно: PEŁEN BUTY значит «полный спеси», а не «полный ботинок». Русского «бута» нет." }
  - { kind: usage, text: "Женский род, употребляется только в единственном числе. Родительный — BUTY: Z POCZUCIEM BUTY. Дательный и предложный — BUCIE: T чередуется с C. Множественное и звательная форма в карточку не включены." }
  - { kind: government, text: "С чем — Z с творительным: Z BUTĄ «надменно». Чья — родительный: BUTA WŁADZY «спесь власти». Кого/что задела — винительный: JEGO BUTA MNIE ZŁOŚCI." }
  - { kind: pronunciation, text: "Читается «бу́та»: ударение на первом слоге. BUCIE — «бу́це», BUTĄ — «бу́том»." }
  - { kind: register, text: "Книжное, оценочное слово, часто о власти и политиках. В разговоре чаще ZAROZUMIAŁOŚĆ или AROGANCJA." }
collocations:
  - { pl: "z butą", ru: "надменно, с высокомерием" }
  - { pl: "buta władzy", ru: "спесь власти" }
  - { pl: "pełen buty", ru: "полный спеси" }
family:
  - { pl: "butny", ru: "спесивый, надменный", relation: derived }
  - { pl: "butnie", ru: "надменно", relation: derived }
  - { pl: "pycha", ru: "гордыня", relation: root }
etymology: "Старопольское слово неясного происхождения; его связывают с праславянским *buti «надуваться, кичиться». Отсюда BUTNY «спесивый»."
memory: "Buta — спесь: mówił z butą. Не ботинок! Ботинок — but, а pełen buty — полный спеси."
idioms:
