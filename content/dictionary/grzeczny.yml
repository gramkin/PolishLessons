        ru: "Она получила вежливый, но твёрдый ответ."
        source: { kind: authored }
  - id: well-behaved
    ru: "послушный, хороший (о ребёнке)"
    examples:
      - pl: "Bądź grzeczny, mama zaraz wróci."
        ru: "Веди себя хорошо, мама сейчас вернётся."
        source: { kind: authored }
      - pl: "Grzeczne dzieci dostają prezenty."
        ru: "Послушные дети получают подарки."
        source: { kind: authored }
  - id: merely-polite
    ru: "formальный, из одной вежливости"
    examples:
      - pl: "To była grzeczna odmowa."
        ru: "Это был вежливый отказ."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ПОВТОРИМ ЛОВУШКУ, НО С ДРУГОЙ СТОРОНЫ. Русское ухо слышит в grzeczny корень «грех» — и ошибается: «грешный» по-польски GRZESZNY, через sz. Grzeczny значит «ВЕЖЛИВЫЙ». Пару grzeczny / grzeszny стоит заучить вдвоём, потому что различает их одна буква, а смыслы расходятся полностью." }
  - { kind: usage, text: "САМОЕ ЧАСТОЕ УПОТРЕБЛЕНИЕ — ДЕТСКОЕ, И РУССКИЙ ПЕРЕВОДИТ ЕГО ИНАЧЕ. Bądź grzeczny! говорят ребёнку по сто раз на дню, и значит это не «будь вежлив», а «веди себя хорошо, слушайся». Czy byłeś grzeczny? — «ты хорошо себя вёл?». О взрослом то же слово значит именно «вежливый»." }
  - { kind: register, text: "Третье значение — холодноватое: grzeczna odmowa, grzeczne zainteresowanie — это вежливость без тепла, как русское «из одной вежливости». Существительное grzeczność значит и «вежливость», и «любезность»: wyświadczyć komuś grzeczność «оказать любезность», z grzeczności «из вежливости»." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: GRZECZ-ny. Rz после глухого g оглушается и звучит как ш: «гжэ́чны», ближе к «гшэ́чны». В сравнительной степени ударение сдвигается: grzeczniejszy — «гжэчне́йшы»." }
collocations:
  - { pl: "bądź grzeczny", ru: "веди себя хорошо" }
  - { pl: "grzeczna odmowa", ru: "вежливый отказ" }
  - { pl: "zwrot grzecznościowy", ru: "формула вежливости" }
family:
  - { pl: "niegrzeczny", ru: "невежливый, непослушный", relation: antonym, id: niegrzeczny }
  - { pl: "grzeczność", ru: "вежливость, любезность", relation: derived }
  - { pl: "rzecz", ru: "вещь, дело", relation: root, id: rzecz }
etymology: "Сращение оборота «k rzeczy» — буквально «к делу, по делу». Сказанное по делу было уместным, уместное — приличным, приличное — вежливым. Корень rzecz «вещь, дело» тот же, что русская «речь». С «грехом» слово не связано ничем: «грешный» по-польски grzeszny."
memory: "grzeczny — «вежливый», а ребёнку это значит «послушный»: bądź grzeczny! Корень не «грех», а rzecz: из оборота «k rzeczy», то есть «по делу». «Грешный» это grzeszny, через sz."
idioms:
  - { pl: "bądź grzeczny!", ru: "веди себя хорошо!" }
  - { pl: "z grzeczności", ru: "из вежливости" }
