        ru: "Тебе нужно напрячь ум."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Сочетается с коротким списком дополнений: wzrok «зрение», słuch «слух», umysł «ум», siły «силы». За его пределами почти не встречается." }
  - { kind: government, text: "Винительный падеж: wytężyć wzrok." }
  - { kind: false-friend, text: "Корень tęgi «крепкий, тугой» — ср. русское «тугой», «натужиться». Образ натяжения общий." }
