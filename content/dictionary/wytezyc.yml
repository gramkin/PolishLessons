collocations:
  - { pl: "wytężyć wzrok", ru: "напрячь зрение" }
  - { pl: "wytężyć słuch", ru: "напрячь слух" }
etymology: "От tęgi «крепкий, тугой»; ср. русское «тугой», «натужиться»."
memory: "wytężyć — «напрячь», и дополнений у него немного: wzrok, słuch, umysł, siły. Корень tęgi «тугой», как в русском «натужиться»."
