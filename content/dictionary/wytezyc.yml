# review
id: wytezyc
format: 2
lemma: "wytężyć"
rank: 2320
pos: verb
aspect: perf
pron: { cyr: "вытэ́нжыць" }
senses:
  - id: strain
    ru: "напрячь (зрение, слух, ум)"
    examples:
      - pl: "Wytęż wzrok!"
        ru: "Напряги зрение!"
        source: { kind: translated, id: 6849499 }
      - pl: "Wytężył wzrok, ale nic nie zobaczył."
        ru: "Он напряг зрение, но ничего не увидел."
        source: { kind: authored }
      - pl: "Wytęż słuch."
        ru: "Напряги слух."
        source: { kind: authored }
  - id: exert
    ru: "напрячь силы, поднатужиться"
    examples:
      - pl: "Wytężyli wszystkie siły."
        ru: "Они напрягли все силы."
        source: { kind: authored }
      - pl: "Musisz wytężyć umysł."
        ru: "Тебе нужно напрячь ум."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Сочетается с коротким списком дополнений: wzrok «зрение», słuch «слух», umysł «ум», siły «силы». За его пределами почти не встречается." }
  - { kind: government, text: "Винительный падеж: wytężyć wzrok." }
  - { kind: false-friend, text: "Корень tęgi «крепкий, тугой» — ср. русское «тугой», «натужиться». Образ натяжения общий." }
  - { kind: usage, text: "Несовершенный вид — wytężać. Родственное wytężony «напряжённый»: wytężona praca «напряжённая работа»." }
collocations:
  - { pl: "wytężyć wzrok", ru: "напрячь зрение" }
  - { pl: "wytężyć słuch", ru: "напрячь слух" }
etymology: "От tęgi «крепкий, тугой»; ср. русское «тугой», «натужиться»."
memory: "wytężyć — «напрячь», и дополнений у него немного: wzrok, słuch, umysł, siły. Корень tęgi «тугой», как в русском «натужиться»."
