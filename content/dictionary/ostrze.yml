notes:
  - { kind: false-friend, text: "Прямой родственник русского «остриё»: OSTRZE образовано от OSTRY «острый», и оба языка построили слово одинаково, суффиксом среднего рода. Но объём значения разный. Русский различает «остриё» — кончик, точку — и «лезвие» — режущую кромку, а польское OSTRZE покрывает и то, и другое: OSTRZE NOŻA это «лезвие ножа», OSTRZE IGŁY — «остриё иглы». Значит, при переводе с польского выбирать приходится по предмету. Отдельно существует BRZESZCZOT — клинок как целая полоса металла, слово специальное. Глагол того же корня — OSTRZYĆ «точить», с приставкой NAOSTRZYĆ «наточить», и в русском ему отвечает та же пара «точить» и «наточить»." }
  - { kind: usage, text: "Среднее на -E с мягкой основой, и родительный множественного у него на -Y: OSTRZY. Это третий вариант в одном типе: WNĘTRZE даёт WNĘTRZ с нулевым окончанием, OBLICZE имеет оба — OBLICZ и OBLICZY, а OSTRZE только OSTRZY. По виду именительного падежа угадать нельзя, и поэтому родительный множественного у средних на -E надёжнее запоминать вместе со словом. Форма OSTRZA покрывает родительный единственного и именительный с винительным множественного. Местный единственного — OSTRZU." }
  - { kind: government, text: "Средний род. Чего лезвие — родительный: OSTRZE NOŻA, OSTRZE SIEKIERY, OSTRZE IGŁY. «На лезвии» — предлог NA с местным: NA OSTRZU. Частотные сочетания: TĘPE OSTRZE «тупое лезвие», OSTRE OSTRZE звучит тавтологично и его избегают, говоря NAOSTRZONE OSTRZE. Переносное NA OSTRZU NOŻA значит «на острие ножа», то есть в крайне опасном положении, и совпадает с русским оборотом. Выражение OSTRZE KRYTYKI «острие критики» тоже переносится без изменений." }
  - { kind: pronunciation, text: "Читается «о́стше», два слога, ударение на первом. Сочетание STRZ — три согласных подряд, и RZ после глухого T оглушается, поэтому слышно «стш», а не «стж». Начальное O произносится полно. Конечное -E это «е». В родительном множественного OSTRZY конечное -Y даёт «ы»: «о́стшы». В местном OSTRZU слышно «о́стшу». Группа STRZ для русского уха трудна, и проговаривать её стоит медленно: с-т-ш." }
