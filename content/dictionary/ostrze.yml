etymology: "От OSTRY, из праславянского *ostrъ, того же корня, что русские «острый», «остриё», «острог». Суффикс среднего рода -E образует здесь название части предмета по её свойству, и русское «остриё» построено точно так же, от того же прилагательного, тем же способом. Это один из самых чистых случаев полного соответствия в словообразовании между двумя языками. Разошлись они только в объёме значения: русский развёл кончик и кромку по двум словам, «остриё» и «лезвие», а польский оставил одно на оба случая. Из того же гнезда идут OSTRZYĆ «точить», OSTROŻNY «осторожный» — буквально «тот, кто остерегается острого» — и OSTROŚĆ «резкость», в том числе у объектива."
memory: "ostrze от ostry — то же словообразование, что русское «остриё» от «острого», случай полного соответствия. Но объём шире: польское ostrze — и «остриё», и «лезвие», которые русский развёл по двум словам. Родительный множественного ostrzy на -y: в этом типе три варианта — wnętrz нулевое, ostrzy на -y, oblicz и obliczy оба. Группа strz читается «стш», с оглушением rz после t."
