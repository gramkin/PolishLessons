# review
id: organizowac
format: 2
lemma: "organizować"
rank: 4426
pos: verb
pron: { cyr: "организо́ваць" }
senses:
  - id: organize
    ru: "организовывать, устраивать"
    examples:
      - pl: "Organizujemy przyjęcie urodzinowe."
        ru: "Мы устраиваем день рождения."
        source: { kind: authored }
      - pl: "Szkoła organizuje wycieczkę do Krakowa."
        ru: "Школа организует экскурсию в Краков."
        source: { kind: authored }
      - pl: "Kto organizuje konferencję?"
        ru: "Кто организует конференцию?"
        source: { kind: authored }
  - id: arrange
    ru: "доставать, раздобывать (разг.); упорядочивать"
    examples:
      - pl: "Organizuje bilety na koncert."
        ru: "Он достаёт билеты на концерт."
        source: { kind: authored }
      - pl: "Musimy lepiej organizować czas."
        ru: "Нам нужно лучше распределять время."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ORGANIZOWAĆ — «организовывать», совпадение полное. Разговорное ORGANIZOWAĆ COŚ — «доставать, раздобывать»: ZORGANIZUJĘ CI BILET «я тебе раздобуду билет». Организация — ORGANIZACJA, организатор — ORGANIZATOR." }
  - { kind: usage, text: "Несовершенный вид; совершенный — ZORGANIZOWAĆ. Спряжение на -UJĘ: ORGANIZUJĘ, ORGANIZUJESZ, ORGANIZUJĄ. ORGANIZOWAĆ SIĘ — «организовываться, собираться с мыслями»." }
  - { kind: government, text: "Что — винительный: ORGANIZOWAĆ WYCIECZKĘ, PRACĘ. Для кого — DLA с родительным: DLA DZIECI. Кому что достать — дательный: ORGANIZOWAĆ KOMUŚ TRANSPORT." }
  - { kind: pronunciation, text: "Читается «организо́ваць»: ударение на предпоследнем слоге. ORGANIZUJĘ — «организу́е»." }
  - { kind: register, text: "Нейтральное слово. Разговорное «доставать» — ORGANIZOWAĆ, чуть шутливое." }
collocations:
  - { pl: "organizować wycieczkę", ru: "организовывать экскурсию" }
  - { pl: "organizować przyjęcie", ru: "устраивать приём" }
  - { pl: "organizować czas", ru: "распределять время" }
family:
  - { pl: "zorganizować", ru: "организовать", relation: aspect, id: zorganizowac }
  - { pl: "organizacja", ru: "организация", relation: derived, id: organizacja }
  - { pl: "planować", ru: "планировать", relation: root, id: planowac }
etymology: "Из французского ORGANISER, от ORGANE «орган»: «устраивать как живой организм». Русское «организовывать» — тот же корень."
memory: "Organizować — организовывать: organizujemy przyjęcie. Разговорное — доставать: organizuje bilety."
idioms:
  - { pl: "organizować coś na ostatnią chwilę", ru: "устраивать что-то в последний момент" }
