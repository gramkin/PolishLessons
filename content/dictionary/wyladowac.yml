notes:
  - { kind: government, text: "Два предлога на два значения. Куда садятся — NA с ПРЕДЛОЖНЫМ: wylądować na lotnisku, na Księżycu, na pasie. Где оказываются в переносном смысле — W с ПРЕДЛОЖНЫМ: wylądować w szpitalu, w więzieniu, w rowie. Русский во втором случае строит фразу иначе — «оказаться в больнице», — так что глагол приходится менять, а не переводить дословно." }
  - { kind: false-friend, text: "Корень слова русскому ничего не подсказывает: ląd значит «суша, земля», и это заимствование из немецкого Land. Прямого родственника в русском нет; общий след виден только в книжном «ландшафт», пришедшем из того же немецкого источника. Поэтому слово надо просто выучить — зато второе, разговорное значение запоминается само: «куда тебя занесло»." }
  - { kind: usage, text: "Несовершенная пара — lądować, и она употребляется о самом процессе: samolot ląduje «самолёт идёт на посадку». Разговорное значение «оказаться» очень частое и совершенно обиходное, не грубое: wylądowałem w kolejce, wylądowała w łóżku z gorączką." }
  - { kind: pronunciation, text: "Обратите внимание на объём парадигмы: у этого глагола 42 формы, а не 53, как у большинства совершенных. Причина грамматическая — глагол НЕПЕРЕХОДНЫЙ, дополнения в винительном у него нет, а значит некого делать подлежащим страдательного оборота. Поэтому страдательного причастия (вроде *wylądowany, *powrócony) не существует вовсе — это не пропуск в словаре, а свойство самого глагола. Так же ведут себя dreptać и другие непереходные." }
collocations:
