  - { pl: "lądować", ru: "садиться, приземляться", relation: aspect }
  - { pl: "lądowanie", ru: "посадка, приземление", relation: derived }
etymology: "От ląd «суша», заимствованного из немецкого Land «земля». Приставка wy- даёт значение выхода, завершения: буквально «выйти на землю». Русского родственника у корня нет — на эти смыслы русский взял «земля» и «садиться», — а единственный общий след с немецким словом виден в книжном «ландшафт»."
memory: "wylądować — «приземлиться», от ląd «суша» (из немецкого Land, как в «ландшафте»). Второе значение разговорное и очень частое: wylądować w szpitalu — «оказаться в больнице». Садятся NA lotnisku, а оказываются W szpitalu."
idioms:
