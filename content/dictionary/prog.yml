etymology: "Общеславянское *porgъ; русское «порог» — то же слово с полногласием, польское — с Ó. Так же GŁOWA — «голова», BRZEG — «берег»."
memory: "Próg — порог, читается «прук». Na progu — на пороге. Próg zwalniający — лежачий полицейский. Próg wyborczy — избирательный барьер."
idioms:
