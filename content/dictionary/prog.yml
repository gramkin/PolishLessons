notes:
  - { kind: false-friend, text: "PRÓG — «порог», с Ó вместо русского полногласия «оро». PRÓG ZWALNIAJĄCY — «лежачий полицейский». PRÓG WYBORCZY — «избирательный барьер», барьер для прохождения в парламент." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Ó чередуется с O: PRÓG, но PROGU, PROGI. Множественное — PROGI." }
  - { kind: government, text: "На пороге — NA PROGU, местный, и в переносном смысле: NA PROGU DOROSŁOŚCI, «на пороге взрослой жизни». Переступить порог — PRZEKROCZYĆ PRÓG, винительный." }
  - { kind: pronunciation, text: "Читается «прук», один слог: Ó — «у», конечное G оглушается в «к». PROGU — «про́гу»." }
collocations:
  - { pl: "próg zwalniający", ru: "лежачий полицейский" }
  - { pl: "próg wyborczy", ru: "избирательный барьер" }
