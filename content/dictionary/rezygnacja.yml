# review
id: rezygnacja
format: 2
lemma: "rezygnacja"
rank: 4909
pos: noun
pron: { cyr: "рэзыгна́цья" }
senses:
  - id: resignation
    ru: "отказ, отставка, уход"
    examples:
      - pl: "Złożył rezygnację z funkcji prezesa."
        ru: "Он подал в отставку с поста председателя."
        source: { kind: authored }
      - pl: "Rezygnacja z abonamentu jest bezpłatna."
        ru: "Отказ от подписки бесплатный."
        source: { kind: authored }
      - pl: "Jej rezygnacja zaskoczyła wszystkich."
        ru: "Её уход всех удивил."
        source: { kind: authored }
  - id: resignedness
    ru: "смирение, покорность судьбе"
    examples:
      - pl: "W jego głosie słychać było rezygnację."
        ru: "В его голосе слышалась обречённость."
        source: { kind: authored }
      - pl: "Przyjęła wyrok z rezygnacją."
        ru: "Она приняла приговор со смирением."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "REZYGNACJA — «отказ, уход», а не только «резиньяция». REZYGNACJA Z PRACY — «увольнение по собственному желанию», REZYGNACJA Z USŁUGI — «отказ от услуги». Отказываться — REZYGNOWAĆ Z и родительный." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — REZYGNACJI. Множественное — REZYGNACJE. Звательный и архаичное REZYGNACYJ не используем." }
  - { kind: government, text: "Отказ от чего — REZYGNACJA Z и родительный: REZYGNACJA Z MANDATU. Подать заявление об уходе — ZŁOŻYĆ REZYGNACJĘ, винительный. Со смирением — Z REZYGNACJĄ, творительный." }
  - { kind: pronunciation, text: "Читается «рэзыгна́цья»: RE — твёрдое «рэ», ZY — «зы», CJA — «цья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "złożyć rezygnację", ru: "подать в отставку, заявление об уходе" }
  - { pl: "rezygnacja z pracy", ru: "уход с работы" }
  - { pl: "z rezygnacją", ru: "обречённо, со смирением" }
family:
  - { pl: "rezygnować", ru: "отказываться", relation: derived }
  - { pl: "zrezygnować", ru: "отказаться", relation: derived, id: zrezygnowac }
  - { pl: "dymisja", ru: "отставка", relation: root }
etymology: "Из латинского RESIGNATIO «отказ», от RESIGNARE «распечатывать, отказываться». Русское «резиньяция» — книжное слово того же корня."
memory: "Rezygnacja — отказ, уход и смирение. Złożyć rezygnację — подать в отставку. Rezygnować z — отказываться от. Читается «рэзыгна́цья»."
idioms:
  - { pl: "machnąć ręką z rezygnacją", ru: "обречённо махнуть рукой" }
formExamplesSkip:
  - { form: "rezygnacjo", reason: "звательный от отвлечённого существительного не употребляется" }
  - { form: "rezygnacyj", reason: "архаичный родительный множественного, в норме REZYGNACJI" }
