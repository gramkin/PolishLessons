# review
id: slad
format: 2
lemma: "ślad"
rank: 605
pos: noun
pron: { cyr: "сьлят" }
senses:
  - id: trace
    ru: "след"
    note: "ślady na śniegu «следы на снегу»."
    examples:
      - pl: "Na piasku były ślady pingwinów."
        ru: "На песке были следы пингвинов."
        source: { kind: tatoeba, id: 4103833 }
      - pl: "Na śniegu są czyjeś ślady."
        ru: "На снегу чьи-то следы."
        source: { kind: tatoeba, id: 10768417 }
      - pl: "Jest ślad stopy."
        ru: "Вот след ноги."
        source: { kind: translated, id: 3867588 }
  - id: without-trace
    ru: "bez śladu — бесследно"
    note: "zniknąć bez śladu «исчезнуть бесследно»."
    examples:
      - pl: "Znikł bez śladu."
        ru: "Он исчез бесследно."
        source: { kind: translated, id: 349174 }
      - pl: "Tom zniknął bez śladu."
        ru: "Том исчез бесследно."
        source: { kind: translated, id: 3656767 }
      - pl: "Ani śladu wroga w naszej okolicy."
        ru: "Ни следа врага в нашей округе."
        source: { kind: translated, id: 6683320 }
  - id: follow
    ru: "iść w ślady kogoś — идти по чьим-л. стопам"
    note: "Устойчивый оборот с винительным."
    examples:
      - pl: "Poszedł w ślady ojca."
        ru: "Он пошёл по стопам отца."
        source: { kind: translated, id: 359367 }
      - pl: "Szedł w ślad za nią."
        ru: "Он шёл следом за ней."
        source: { kind: translated, id: 6534264 }
      - pl: "Ślady prowadziły do rzeki."
        ru: "Следы вели к реке."
        source: { kind: translated, id: 945885 }
notes:
  - { kind: government, text: "bez śladu «бесследно» — с родительным; iść w ślady kogoś «идти по чьим-то стопам» — с винительным." }
  - { kind: usage, text: "Оборот ani śladu czegoś значит «ни следа чего-либо»: ani śladu wroga." }
  - { kind: usage, text: "Русское «по следам» передаётся как po śladach с предложным: szli po śladach." }
  - { kind: usage, text: "Глагол — śledzić «следить», существительное — śledztwo «следствие»." }
collocations:
  - { pl: "bez śladu", ru: "бесследно" }
  - { pl: "ślady na śniegu", ru: "следы на снегу" }
  - { pl: "iść w ślady", ru: "идти по стопам" }
  - { pl: "ani śladu", ru: "ни следа" }
family:
  - { pl: "śledzić", ru: "следить", relation: derived }
  - { pl: "śledztwo", ru: "следствие", relation: derived }
  - { pl: "naśladować", ru: "подражать", relation: derived }
etymology: "От праславянского *slědъ — то же слово, что русское «след»; отсюда же śledzić «следить» и śledztwo «следствие»."
memory: "ślad — «след», и слово то же, что русское. Запомнить стоит два оборота: bez śladu «бесследно», с родительным — zniknął bez śladu, — и iść w ślady kogoś «идти по чьим-то стопам», с винительным: poszedł w ślady ojca. Ещё один готовый: ani śladu czegoś «ни следа чего-либо». Глагол — śledzić, следствие — śledztwo."
idioms:
  - { pl: "bez śladu", ru: "бесследно" }
  - { pl: "iść w ślady", ru: "идти по стопам" }
  - { pl: "ani śladu", ru: "ни следа" }
