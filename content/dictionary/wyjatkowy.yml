senses:
  - id: exceptional
    ru: "исключительный, необыкновенный, особенный"
    examples:
      - pl: "Każdy jest wyjątkowy."
        ru: "Каждый особенный."
        source: { kind: translated, id: 8789603 }
      - pl: "To naprawdę wyjątkowa osoba."
        ru: "Это действительно необыкновенный человек."
        source: { kind: translated, id: 951287 }
      - pl: "Cytryna ma wyjątkowy smak."
        ru: "У лимона особенный вкус."
        source: { kind: translated, id: 2806120 }
  - id: extraordinary
    ru: "исключительный, чрезвычайный (являющийся исключением)"
    note: "Здесь слово ближе к прямому смыслу «являющийся исключением»: stan wyjątkowy, sytuacja wyjątkowa."
    examples:
      - pl: "To wyjątkowy przypadek."
        ru: "Это исключительный случай."
        source: { kind: translated, id: 717342 }
      - pl: "To wyjątkowa sytuacja."
        ru: "Это исключительная ситуация."
        source: { kind: translated, id: 6328240 }
      - pl: "W kraju wprowadzono stan wyjątkowy."
        ru: "В стране ввели чрезвычайное положение."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Слово прозрачно выводится из wyjątek «исключение»: wyjątkowy — «вынутый из общего ряда». Отсюда и «необыкновенный», и «чрезвычайный»." }
  - { kind: false-friend, text: "stan wyjątkowy — это «чрезвычайное положение», а не «исключительное состояние». Оборот юридический и очень частый в новостях." }
  - { kind: usage, text: "Наречие wyjątkowo работает в две стороны: wyjątkowo zimny dzień «исключительно холодный день» (усиление) и dziś wyjątkowo zamknięte «сегодня, в виде исключения, закрыто»." }
  - { kind: usage, text: "Степени сравнения книжные и редкие; обычно говорят bardziej wyjątkowy или усиливают наречием." }
collocations:
  - { pl: "wyjątkowa osoba", ru: "исключительный человек" }
  - { pl: "stan wyjątkowy", ru: "чрезвычайное положение" }
  - { pl: "wyjątkowy przypadek", ru: "исключительный случай" }
  - { pl: "wyjątkowo trudny", ru: "исключительно трудный" }
family:
  - { pl: "wyjątek", ru: "исключение", relation: derived }
  - { pl: "wyjątkowo", ru: "исключительно", relation: derived }
  - { pl: "wyjąć", ru: "вынуть, изъять", relation: derived }
etymology: "От wyjątek «исключение», которое само образовано от wyjąć «вынуть, изъять» (wy- + jąć «взять»). Русское «изъять» сложено так же, и «исключительный» — калька той же идеи: вынутый из общего ряда."
memory: "wyjątkowy — от wyjątek «исключение», буквально «вынутый из общего ряда». Отсюда два смысла: «необыкновенный» (wyjątkowa osoba) и «чрезвычайный» (stan wyjątkowy «чрезвычайное положение» — не «исключительное состояние»). Наречие wyjątkowo тоже двойное: wyjątkowo zimny «исключительно холодный», но dziś wyjątkowo zamknięte «сегодня, в виде исключения, закрыто»."
idioms:
  - { pl: "stan wyjątkowy", ru: "чрезвычайное положение" }
  - { pl: "w wyjątkowych przypadkach", ru: "в исключительных случаях" }
  - { pl: "nic wyjątkowego", ru: "ничего особенного" }
