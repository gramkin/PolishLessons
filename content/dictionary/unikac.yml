# review
id: unikac
format: 2
lemma: "unikać"
rank: 2592
pos: verb
pron: { cyr: "уника́ць" }
senses:
  - id: avoid
    ru: "избегать (кого/чего-л.)"
    examples:
      - pl: "Unikam tłumów."
        ru: "Я избегаю толпы."
        source: { kind: authored }
      - pl: "Kot unika obcych."
        ru: "Кот избегает чужих."
        source: { kind: authored }
      - pl: "Unikał mnie przez cały tydzień."
        ru: "Он избегал меня всю неделю."
        source: { kind: authored }
  - id: evade
    ru: "уклоняться (от ответа, от темы)"
    examples:
      - pl: "Unikasz odpowiedzi od tygodnia."
        ru: "Ты избегаешь ответа уже неделю."
        source: { kind: authored }
      - pl: "Unikano tego tematu przez lata."
        ru: "Этой темы избегали годами."
        source: { kind: authored }
notes:
  - { kind: government, text: "unikać требует РОДИТЕЛЬНОГО падежа: unikać tłumów, unikać odpowiedzi, unikać ludzi. Русское «избегать» управляет точно так же — родительным, — и это редкий случай, когда ничего переучивать не надо. Винительного этот глагол не берёт." }
  - { kind: government, text: "Хотя дополнение стоит в родительном, страдательные причастия образуются свободно, и мужсколичное unikani вполне обычно: людей действительно избегают. Byli unikani przez sąsiadów «их избегали соседи»." }
  - { kind: usage, text: "Несовершенный вид; совершенный — uniknąć (uniknąć kary «избежать наказания»). Отглагольное существительное unikanie значит «избегание, уклонение»: unikanie podatków «уклонение от налогов»." }
  - { kind: false-friend, text: "Корень тот же, что в znikać «исчезать» и niknąć «никнуть, пропадать», и он родствен русскому «никнуть», «поникнуть». Исходная мысль — «ускользать, пропадать из виду»; отсюда и «избегать». Но русское «избегать» образовано от другого корня, так что сходства на поверхности нет." }
collocations:
  - { pl: "unikać tłumów", ru: "избегать толпы" }
  - { pl: "unikać odpowiedzi", ru: "избегать ответа" }
  - { pl: "unikanie podatków", ru: "уклонение от налогов" }
family:
  - { pl: "uniknąć", ru: "избежать", relation: aspect }
  - { pl: "znikać", ru: "исчезать", relation: root }
  - { pl: "unikanie", ru: "избегание, уклонение", relation: derived }
etymology: "Приставка u- и корень *nik-, тот же, что в niknąć «пропадать» и znikać «исчезать». Праславянское *nikati означало «склоняться, скрываться из виду», и русское «никнуть», «поникнуть» идёт оттуда же. Польский развил из этого «ускользать от чего-л.», то есть избегать."
memory: "unikać + РОДИТЕЛЬНЫЙ, как русское «избегать»: unikam tłumów — «избегаю толпы». Падеж тот же, переучивать нечего. Совершенный вид — uniknąć, а корень тот же, что в znikać «исчезать»."
idioms:
  - { pl: "unikać jak ognia", ru: "избегать как огня" }
  - { pl: "unikać odpowiedzi", ru: "уходить от ответа" }
