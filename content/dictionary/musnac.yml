# review
id: musnac
format: 2
lemma: "musnąć"
rank: 5953
pos: verb
aspect: perf
pron: { cyr: "му́сноньць" }
senses:
  - id: brush
    ru: "слегка коснуться, едва задеть"
    examples:
      - pl: "Musnęła ustami jego policzek."
        ru: "Она коснулась губами его щеки."
        source: { kind: authored }
      - pl: "Wiatr musnął jej włosy."
        ru: "Ветер тронул её волосы."
        source: { kind: authored }
      - pl: "Piłka tylko musnęła poprzeczkę."
        ru: "Мяч лишь задел перекладину."
        source: { kind: authored }
  - id: touch-on
    ru: "вскользь коснуться (взглядом, темы)"
    examples:
      - pl: "Musnął wzrokiem tłum i odszedł."
        ru: "Он скользнул взглядом по толпе и ушёл."
        source: { kind: authored }
      - pl: "Wykładowca ledwo musnął ten temat."
        ru: "Лектор лишь вскользь коснулся этой темы."
        source: { kind: authored }
notes:
  - { kind: government, text: "Что — винительный, чем — творительный: MUSNĄĆ POLICZEK USTAMI «коснуться губами щеки». Русское «коснуться чего» требует родительного, польское MUSNĄĆ — прямое дополнение: MUSNĄŁ JEJ RĘKĘ." }
  - { kind: usage, text: "Совершенный вид, несовершенный — MUSKAĆ «касаться, гладить». Слово про лёгкое, мимолётное касание; обычное «коснуться» — DOTKNĄĆ. Причастие MUŚNIĘTY часто значит «чуть тронутый»: MUŚNIĘTY SŁOŃCEM «слегка загорелый»." }
  - { kind: pronunciation, text: "Читается «му́сноньць»: Ą перед Ć — «онь». В будущем времени S смягчается: MUSNĘ — «му́снэ», но MUŚNIESZ — «му́сьнеш», MUŚNIE — «му́сьне», повелительное MUŚNIJ — «му́сьний»." }
collocations:
  - { pl: "musnąć ustami", ru: "коснуться губами" }
  - { pl: "musnąć wzrokiem", ru: "скользнуть взглядом" }
  - { pl: "musnąć temat", ru: "вскользь коснуться темы" }
family:
  - { pl: "muskać", ru: "касаться, слегка гладить", relation: aspect }
  - { pl: "muśnięcie", ru: "лёгкое касание", relation: derived }
  - { pl: "dotknąć", ru: "коснуться, тронуть", relation: root, id: dotknac }
etymology: "Однократный совершенный вид к MUSKAĆ «легко касаться, гладить» с суффиксом -NĄĆ, как DOTKNĄĆ к DOTYKAĆ; прямого русского родственника у корня нет."
memory: "Musnąć — едва коснуться: «мус» — как лёгкий муссовый крем, который тронешь пальцем и почти не почувствуешь."
idioms:
  - { pl: "muśnięty słońcem", ru: "слегка загорелый, тронутый солнцем" }
  - { pl: "ledwo musnąć temat", ru: "лишь вскользь коснуться темы" }
