notes:
  - { kind: government, text: "Слово работает двояко. Без дополнения это наречие «вокруг, кругом»: dookoła było cicho. С дополнением — предлог, и тогда требует РОДИТЕЛЬНОГО: dookoła domu, dookoła stołu. Русское «вокруг» ведёт себя точно так же, так что падеж угадывается верно." }
  - { kind: usage, text: "Рядом живут три почти одинаковых слова: DOOKOŁA, WOKÓŁ и OKOŁO. Первые два значат «вокруг» и взаимозаменяемы, причём wokół чуть книжнее. А OKOŁO значит «около, приблизительно» о количестве: około stu osób. Спутать последнее с первыми двумя — обычная ошибка." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: do-o-KO-ła. Двойное o произносится раздельно, без стяжения, а ł как краткое у: «доокоўа». Сравни okoła в составе слова — тот же корень, что в koło «круг, колесо»." }
collocations:
  - { pl: "dookoła świata", ru: "вокруг света" }
  - { pl: "dookoła domu", ru: "вокруг дома" }
  - { pl: "rozejrzeć się dookoła", ru: "оглядеться вокруг" }
family:
  - { pl: "koło", ru: "круг; колесо", relation: root, id: kolo }
  - { pl: "wokół", ru: "вокруг", relation: root, id: wokol }
  - { pl: "okrągły", ru: "круглый", relation: derived }
etymology: "Сращение do i okoła, где około — застывший падеж от koło «круг, колесо», из праславянского *kolo. Тот же корень в русском «около», «кольцо», «колесо». Буквально «до круга», то есть по кругу."
memory: "dookoła — «вокруг»: без дополнения наречие, с дополнением предлог с родительным. Корень тот же, что в русском «около» и «колесо» — koło «круг». Но польское OKOŁO значит «приблизительно», не путай."
idioms:
