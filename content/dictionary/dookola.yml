pron: { cyr: "доокоўа" }
senses:
  - id: all-around
    ru: "вокруг, кругом"
    examples:
      - pl: "Dookoła było cicho."
        ru: "Вокруг было тихо."
        source: { kind: authored }
      - pl: "Rozejrzał się dookoła."
