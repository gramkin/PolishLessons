notes:
  - { kind: false-friend, text: "Слово совпадает с русским «сериалом» полностью — и по форме, и по значению, — но путь у них разный. Польский взял его из английского serial, русский тоже, только позже. Зато не путай с SERIA «серия, партия»: seria to один odcinek? Нет: SERIA значит «серия» как ряд или партия товара, а отдельная часть сериала — ODCINEK." }
  - { kind: usage, text: "Часть сериала называется ODCINEK — «серия, эпизод», а не seria. Сезон — SEZON. Родительный множественного — SERIALI, с мягким i. Звательного падежа генератор не дал, и это обычное дело у неодушевлённых заимствований." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: se-RIAL. Ri звучит мягко, как «рья», конечное l мягкое: «сэ́рьяль». В предложном serialu слышно «сэрья́лю»." }
collocations:
  - { pl: "serial telewizyjny", ru: "телесериал" }
  - { pl: "odcinek serialu", ru: "серия сериала" }
  - { pl: "obejrzeć serial", ru: "посмотреть сериал" }
family:
  - { pl: "odcinek", ru: "серия, эпизод", relation: root, id: odcinek }
  - { pl: "film", ru: "фильм", relation: root, id: film }
  - { pl: "sezon", ru: "сезон", relation: root, id: sezon }
etymology: "Из английского serial «выходящий частями», от латинского series «ряд», от serere «соединять». То же слово дало русский «сериал». Корень ser- виден в «серии» и в польском seria."
memory: "serial — «сериал», слово совпадает полностью. Но отдельная часть называется ODCINEK, а не seria: seria значит «серия» как ряд или партия. Родительный множественного — seriali."
idioms:
  - { pl: "serial telewizyjny", ru: "телесериал" }
  - { pl: "jak w kiepskim serialu", ru: "как в плохом сериале" }
