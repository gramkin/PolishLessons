# review
id: zdobyc
format: 2
lemma: "zdobyć"
rank: 527
pos: verb
aspect: perf
pron: { cyr: "здо́быць" }
senses:
  - id: obtain
    ru: "добыть, раздобыть, достать"
    note: "zdobyć bilety «достать билеты», zdobyć pracę «найти работу»."
    examples:
      - pl: "Chcę zdobyć papierosy."
        ru: "Я хочу раздобыть сигарет."
        source: { kind: translated, id: 1349043 }
      - pl: "W końcu zdobyłem tę książkę."
        ru: "Я наконец раздобыл эту книгу."
        source: { kind: translated, id: 728418 }
      - pl: "Gdzie to zdobyłeś?"
        ru: "Где ты это достал?"
        source: { kind: translated, id: 2246974 }
  - id: win
    ru: "завоевать, получить (награду, медаль, голоса)"
    note: "zdobyć nagrodę «получить награду», zdobyć medal «завоевать медаль»."
    examples:
      - pl: "Zdołałem zdobyć pierwszą nagrodę."
        ru: "Мне удалось получить первый приз."
        source: { kind: translated, id: 410000 }
      - pl: "Słowaccy pszczelarze zdobyli sześć medali na międzynarodowej konferencji w Argentynie."
        ru: "На Международном конгрессе в Аргентине словацкие пчеловоды завоевали шесть медалей."
        source: { kind: tatoeba, id: 8679399 }
      - pl: "To pierwszy złoty medal, jaki zdobyła."
        ru: "Это первая золотая медаль, которую она завоевала."
        source: { kind: translated, id: 817197 }
  - id: conquer
    ru: "покорить, взять (вершину, крепость)"
    note: "zdobyć szczyt «покорить вершину»."
    examples:
      - pl: "Już kiedyś zdobyłem Górę Fudżi."
        ru: "Я однажды покорил гору Фудзи."
        source: { kind: translated, id: 1086555 }
      - pl: "Michiko gada tak, jakby sama zdobyła biegun północny."
        ru: "Митико говорит так, будто сама покорила Северный полюс."
        source: { kind: translated, id: 527440 }
      - pl: "Zdobyli zamek po tygodniu."
        ru: "Они взяли замок через неделю."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Несовершенный вид — zdobywać: zdobywa «добывает», zdobył «добыл»." }
  - { kind: usage, text: "Значение зависит от дополнения: zdobyć bilety «достать билеты», zdobyć nagrodę «получить награду», zdobyć szczyt «покорить вершину»." }
  - { kind: usage, text: "Причастие zdobyty значит «добытый, завоёванный»: pieniądze zdobyte nieuczciwie «деньги, добытые нечестно»." }
  - { kind: usage, text: "Отглагольное существительное zdobycie: zdobycie pracy «получение работы», zdobycie mistrzostwa «завоевание первенства»." }
collocations:
  - { pl: "zdobyć nagrodę", ru: "получить награду" }
  - { pl: "zdobyć pracę", ru: "найти работу" }
  - { pl: "zdobyć szczyt", ru: "покорить вершину" }
  - { pl: "zdobyć zaufanie", ru: "завоевать доверие" }
family:
  - { pl: "zdobywać", ru: "добывать", relation: root }
  - { pl: "zdobycz", ru: "добыча", relation: derived }
  - { pl: "zdobywca", ru: "завоеватель", relation: derived }
etymology: "Приставка z- плюс dobyć «добыть», от праславянского *byti — то же слово, что русское «добыть»; отсюда zdobycz «добыча»."
memory: "zdobyć — «добыть», и значение задаёт дополнение: zdobyć bilety «достать билеты», zdobyć nagrodę «получить награду», zdobyć szczyt «покорить вершину», zdobyć zaufanie «завоевать доверие». Несовершенный вид — zdobywać. Причастие zdobyty значит «добытый, завоёванный»: pieniądze zdobyte nieuczciwie. Существительное zdobycz — «добыча», ровно как в русском."
idioms:
  - { pl: "zdobyć nagrodę", ru: "получить награду" }
  - { pl: "zdobyć szczyt", ru: "покорить вершину" }
  - { pl: "zdobyć zaufanie", ru: "завоевать доверие" }
