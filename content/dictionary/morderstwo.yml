pos: noun
pron: { cyr: "мордэ́рстфо" }
senses:
  - id: murder
    ru: "убийство"
    note: "popełnić morderstwo «совершить убийство»."
    examples:
      - pl: "Mężczyzna popełnił morderstwo."
        ru: "Мужчина совершил убийство."
        source: { kind: translated, id: 7679634 }
      - pl: "Morderstwo pozostało zagadką."
        ru: "Убийство осталось загадкой."
        source: { kind: translated, id: 12193827 }
      - pl: "Pamiętasz to tajemnicze morderstwo?"
        ru: "Помнишь то загадочное убийство?"
        source: { kind: translated, id: 367690 }
  - id: murder-case
    ru: "убийство как дело, расследование"
    note: "świadek morderstwa «свидетель убийства», winny morderstwa «виновен в убийстве»."
    examples:
      - pl: "On był świadkiem morderstwa."
        ru: "Он был свидетелем убийства."
        source: { kind: translated, id: 569984 }
      - pl: "Został uznany winnym morderstwa."
        ru: "Его признали виновным в убийстве."
        source: { kind: translated, id: 1635581 }
      - pl: "Motyw morderstwa jest jeszcze nieznany."
        ru: "Мотив убийства пока неизвестен."
        source: { kind: translated, id: 603031 }
notes:
  - { kind: government, text: "winny morderstwa «виновен в убийстве» — с родительным, там где русский ставит «в» с предложным." }
  - { kind: usage, text: "Глагол — popełnić morderstwo «совершить убийство»; деятель — morderca «убийца»." }
  - { kind: usage, text: "Рядом стоит zabójstwo — тоже «убийство», но более нейтральное, юридическое; morderstwo подчёркивает умысел." }
  - { kind: usage, text: "Прилагательное — morderczy «убийственный»: mordercze tempo «убийственный темп»." }
collocations:
  - { pl: "popełnić morderstwo", ru: "совершить убийство" }
  - { pl: "świadek morderstwa", ru: "свидетель убийства" }
  - { pl: "winny morderstwa", ru: "виновен в убийстве" }
  - { pl: "sprawa morderstwa", ru: "дело об убийстве" }
family:
  - { pl: "morderca", ru: "убийца", relation: derived }
  - { pl: "mordować", ru: "убивать", relation: root }
  - { pl: "morderczy", ru: "убийственный", relation: derived }
etymology: "От mordować «убивать», заимствованного из немецкого Mord «убийство» — то же индоевропейское гнездо, что латинское mors «смерть» и русские «мор», «морить»."
memory: "morderstwo — «убийство», и совершают его глаголом popełnić: popełnić morderstwo. «Виновен в убийстве» строится родительным — winny morderstwa, — там где русский ставит предлог «в». Рядом живёт zabójstwo: оно нейтральнее и юридичнее, а morderstwo подчёркивает умысел. Убийца — morderca, прилагательное morderczy значит «убийственный»."
idioms:
