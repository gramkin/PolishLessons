# review
id: ostatni
format: 2
lemma: "ostatni"
rank: 148
pos: adj
pron: { cyr: "оста́тни" }
senses:
  - id: last
    ru: "последний (по порядку или по времени)"
    examples:
      - pl: "Spóźnili się na ostatni pociąg."
        ru: "Они опоздали на последний поезд."
        source: { kind: tatoeba, id: 3457091 }
      - pl: "To moje ostatnie ostrzeżenie!"
        ru: "Это моё последнее предупреждение!"
        source: { kind: tatoeba, id: 8658883 }
      - pl: "Daję ci ostatnią szansę."
        ru: "Я даю тебе последний шанс."
        source: { kind: tatoeba, id: 3602128 }
  - id: final
    ru: "последний из оставшихся, крайний"
    examples:
      - pl: "To ostatni?"
        ru: "Это последний?"
        source: { kind: tatoeba, id: 13084374 }
      - pl: "Tom był ostatnią nadzieją Mary."
        ru: "Том был последней надеждой Мэри."
        source: { kind: tatoeba, id: 7112938 }
      - pl: "To ostatnia?"
        ru: "Это последняя?"
        source: { kind: tatoeba, id: 13084376 }
notes:
  - { kind: usage, text: "ostatnio значит «в последнее время, недавно»: Ostatnio dużo pracuję." }
  - { kind: usage, text: "«На прошлой неделе» — w zeszłym (ubiegłym) tygodniu, а не w ostatnim: ostatni говорит о порядке, zeszły — о прошедшем отрезке времени." }
  - { kind: usage, text: "w ostatniej chwili — «в последний момент»; po raz ostatni — «в последний раз»." }
collocations:
  - { pl: "ostatni raz", ru: "последний раз" }
  - { pl: "w ostatniej chwili", ru: "в последний момент" }
  - { pl: "ostatnio", ru: "в последнее время" }
  - { pl: "ostatni dzwonek", ru: "последний звонок" }
etymology: "Праславянское *ob-statьnъ от stać «стоять» — буквально «тот, что остался»; ср. русские «остаток» и «остаться»."
memory: "ostatni — «последний» по порядку. «В последнее время» — ostatnio, а «на прошлой неделе» — w zeszłym tygodniu, не w ostatnim."
idioms:
  - { pl: "ostatnia deska ratunku", ru: "последняя соломинка" }
  - { pl: "do ostatniej kropli krwi", ru: "до последней капли крови" }
  - { pl: "na ostatnich nogach", ru: "на последнем издыхании" }
