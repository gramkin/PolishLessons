notes:
  - { kind: false-friend, text: "MALEŃSTWO — ласковое «малыш, кроха», а не абстрактная «малость». Слово среднего рода, даже когда речь о мальчике: NASZE MALEŃSTWO ŚPI, MALEŃSTWO PŁAKAŁO. По-русски тут был бы мужской род: «наш малыш спит»." }
  - { kind: usage, text: "Девять форм, средний род на -STWO. Именительный и звательный совпадают: MALEŃSTWO, CHODŹ TU! Родительный множественного — MALEŃSTW: KOTKA URODZIŁA PIĘĆ MALEŃSTW." }
  - { kind: government, text: "Ждать ребёнка — SPODZIEWAĆ SIĘ MALEŃSTWA, родительный. Заботиться о малыше — OPIEKOWAĆ SIĘ MALEŃSTWEM, творительный без предлога, где в русском «о» с предложным." }
  - { kind: pronunciation, text: "Читается «мале́ньстфо», ударение на предпоследнем слоге. Ń перед S — «нь», W после T оглушается в «ф»." }
  - { kind: register, text: "Ласковое разговорное слово: в семье, у врача-педиатра, в разговоре о детёнышах животных. В документах — NIEMOWLĘ, «младенец»." }
collocations:
  - { pl: "nasze maleństwo", ru: "наш малыш" }
  - { pl: "spodziewać się maleństwa", ru: "ждать ребёнка" }
  - { pl: "nowo narodzone maleństwo", ru: "новорождённый малыш" }
family:
  - { pl: "mały", ru: "маленький", relation: root, id: maly }
  - { pl: "maleńki", ru: "крошечный", relation: root }
  - { pl: "maluch", ru: "малыш", relation: root }
etymology: "От MALEŃKI «крошечный», уменьшительного от MAŁY «маленький», с суффиксом -STWO, как в DZIECIŃSTWO «детство». Слово называет не качество, а живое существо."
memory: "Maleństwo — малыш, кроха, среднего рода: nasze maleństwo śpi. Читается «мале́ньстфо». Spodziewać się maleństwa — ждать ребёнка."
idioms:
  - { pl: "od maleńkości", ru: "с малых лет, с пелёнок" }
