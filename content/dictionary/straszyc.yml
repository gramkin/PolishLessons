        ru: "Гроза пугает собак."
        source: { kind: authored }
  - id: haunt
    ru: "STRASZY — водятся привидения (безлично)"
    examples:
      - pl: "W tym zamku straszy."
        ru: "В этом замке водятся привидения."
        source: { kind: authored }
      - pl: "Podobno w starym młynie straszy nocą."
        ru: "Говорят, в старой мельнице по ночам нечисто."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "STRASZYĆ — «пугать», а не «страшить» в поэтическом смысле. Важное безличное: W TYM DOMU STRASZY — «в этом доме водятся привидения». STRASZYĆ KOGOŚ CZYMŚ — «грозить кому-то чем-то»: STRASZYĆ SĄDEM «грозить судом». Пугало — STRACH NA WRÓBLE." }
  - { kind: usage, text: "Несовершенный вид; совершенный — WYSTRASZYĆ или PRZESTRASZYĆ. Спряжение: STRASZĘ, STRASZYSZ, STRASZĄ. Повелительное — STRASZ. Отглагольное STRASZENIE — «запугивание»." }
  - { kind: government, text: "Кого — винительный: STRASZYĆ DZIECI. Чем — творительный: STRASZYĆ KARĄ, POLICJĄ. Безличное STRASZY с W и предложным: W PIWNICY STRASZY." }
  - { kind: pronunciation, text: "Читается «стра́шыць»: SZ — «ш», Y — «ы». Ударение на первом слоге. STRASZĘ — «стра́шэ»." }
  - { kind: register, text: "Нейтральное слово. Безличное STRASZY — разговорное, из фольклора и детских историй." }
collocations:
  - { pl: "straszyć kogoś czymś", ru: "грозить кому-то чем-то" }
  - { pl: "w tym domu straszy", ru: "в этом доме водятся привидения" }
  - { pl: "straszyć dzieci", ru: "пугать детей" }
