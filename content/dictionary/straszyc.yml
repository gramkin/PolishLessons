pos: verb
pron: { cyr: "стра́шыць" }
senses:
  - id: frighten
    ru: "пугать; грозить (чем-то)"
    examples:
      - pl: "Nie strasz dziecka!"
        ru: "Не пугай ребёнка!"
        source: { kind: authored }
      - pl: "Straszy nas zwolnieniami."
        ru: "Он грозит нам увольнениями."
        source: { kind: authored }
