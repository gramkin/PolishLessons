# review
id: kiepski
format: 2
lemma: "kiepski"
rank: 1325
pos: adj
pron: { cyr: "ке́пски" }
senses:
  - id: bad-at
    ru: "kiepski w czymś — слабый в чём-то"
    examples:
      - pl: "Jestem kiepski w tenisa."
        ru: "Я слаб в теннисе."
        source: { kind: translated, id: 1354219 }
      - pl: "Jestem kiepski w angielskim."
        ru: "Я слаб в английском."
        source: { kind: translated, id: 2975237 }
      - pl: "Mój angielski jest bardzo kiepski."
        ru: "Мой английский очень плох."
        source: { kind: tatoeba, id: 10747470 }
  - id: poor-quality
    ru: "плохой, скверный (о погоде, памяти, качестве)"
    examples:
      - pl: "Na północy pogoda jest kiepska."
        ru: "На севере погода скверная."
        source: { kind: translated, id: 660519 }
      - pl: "Wczorajsza pogoda była bardzo kiepska."
        ru: "Вчерашняя погода была очень скверной."
        source: { kind: translated, id: 601349 }
      - pl: "Masz kiepską pamięć."
        ru: "У тебя плохая память!"
        source: { kind: tatoeba, id: 605889 }
  - id: poor-jokes
    ru: "жалкий, дурацкий (о шутках, отговорках)"
    examples:
      - pl: "Mam dość twoich kiepskich żartów."
        ru: "Мне надоели твои дурацкие шутки."
        source: { kind: translated, id: 13782191 }
      - pl: "Nie chcę słyszeć twoich kiepskich wymówek."
        ru: "Я не хочу слышать твоих жалких отговорок."
        source: { kind: translated, id: 12269458 }
      - pl: "Tom jest kiepskim golfistą."
        ru: "Том слабый игрок в гольф."
        source: { kind: translated, id: 2809377 }
notes:
  - { kind: government, text: "kiepski w czymś «слабый в чём-то» — предлог w с предложным падежом: kiepski w angielskim. Но с названием игры идёт винительный: kiepski w tenisa." }
  - { kind: register, text: "Kiepski — обиходное слово, мягче чем zły «плохой». Примерно как русское «так себе, слабоватый»." }
  - { kind: usage, text: "Сочетается с погодой, памятью, шутками и качеством: kiepska pogoda, kiepska pamięć, kiepski żart." }
  - { kind: pronunciation, text: "Ударение на первый слог, а kie- звучит как «ке-»: ке́пски." }
collocations:
  - { pl: "kiepski w czymś", ru: "слабый в чём-то" }
  - { pl: "kiepska pogoda", ru: "скверная погода" }
  - { pl: "kiepski żart", ru: "дурацкая шутка" }
etymology: "От старого грубого слова kiep. Сегодня связь не ощущается, и kiepski звучит вполне обиходно."
memory: "kiepski — «слабый, неважный», мягче чем zły. Управление двойное: kiepski w angielskim (предложный), но kiepski w tenisa (винительный). О погоде, памяти и шутках — kiepska pogoda, kiepski żart."
idioms:
  - { pl: "kiepski w czymś", ru: "слабый в чём-то" }
  - { pl: "kiepska pogoda", ru: "скверная погода" }
  - { pl: "kiepskie wymówki", ru: "жалкие отговорки" }
