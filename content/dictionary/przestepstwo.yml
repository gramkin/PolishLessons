# review
id: przestepstwo
format: 2
lemma: "przestępstwo"
rank: 1573
pos: noun
pron: { cyr: "пшэстэ́мпстфо" }
senses:
  - id: crime
    ru: "преступление"
    examples:
      - pl: "Jakie przestępstwo popełniłeś?"
        ru: "Какое преступление ты совершил?"
        source: { kind: tatoeba, id: 3867597 }
      - pl: "Popełniła przestępstwo."
        ru: "Она совершила преступление."
        source: { kind: translated, id: 7679635 }
      - pl: "Była świadkiem przestępstwa."
        ru: "Она была свидетельницей преступления."
        source: { kind: translated, id: 731986 }
  - id: offence
    ru: "правонарушение, наказуемое деяние"
    examples:
      - pl: "Pedofilia jest przestępstwem."
        ru: "Педофилия — преступление."
        source: { kind: translated, id: 3401388 }
      - pl: "W Singapurze plucie na ulicę jest przestępstwem."
        ru: "В Сингапуре плевать на улице — преступление."
        source: { kind: translated, id: 733043 }
notes:
  - { kind: usage, text: "Средний род на -stwo, как państwo и towarzystwo." }
  - { kind: usage, text: "popełnić przestępstwo — «совершить преступление», miejsce przestępstwa — «место преступления»." }
  - { kind: false-friend, text: "Рядом стоит zbrodnia «злодеяние, тяжкое преступление», которое уже есть карточкой: przestępstwo — юридический термин вообще, zbrodnia — особо тяжкое." }
  - { kind: usage, text: "Собрано прозрачно: prze- плюс корень stąp- «ступать», буквально «переступление». Русское «преступление» устроено точно так же." }
collocations:
  - { pl: "popełnić przestępstwo", ru: "совершить преступление" }
  - { pl: "miejsce przestępstwa", ru: "место преступления" }
  - { pl: "poważne przestępstwo", ru: "тяжкое преступление" }
etymology: "Приставка prze- «пере-» и корень stąp- «ступать»: буквально «переступление закона». Русское «преступление» собрано из тех же частей, так что слово читается насквозь."
memory: "przestępstwo — «преступление», и разбирается насквозь: prze- плюс stąpić «ступить», как русское «пре-» плюс «ступить». popełnić przestępstwo «совершить преступление»."
idioms:
  - { pl: "popełnić przestępstwo", ru: "совершить преступление" }
  - { pl: "miejsce przestępstwa", ru: "место преступления" }
  - { pl: "przestępstwo gospodarcze", ru: "экономическое преступление" }
