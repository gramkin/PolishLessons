# review
id: taki
format: 2
lemma: "taki"
rank: 48
pos: adj
pron: { cyr: "та́ки" }
senses:
  - id: such
    ru: "такой"
    examples:
      - pl: "Taki miałem plan."
        ru: "Это был мой план."
        source: { kind: tatoeba, id: 3460836 }
      - pl: "Jestem taka gruba."
        ru: "Я такая толстая."
        source: { kind: tatoeba, id: 1348370 }
      - pl: "Takie są zasady."
        ru: "Таковы правила."
        source: { kind: tatoeba, id: 3764986 }
  - id: so
    ru: "такой, настолько (усиление)"
    examples:
      - pl: "Tom jest taki stary."
        ru: "Том такой старый."
        source: { kind: tatoeba, id: 6553635 }
      - pl: "Jesteś taka piękna!"
        ru: "Какая ты красивая!"
        source: { kind: tatoeba, id: 12562237 }
notes:
  - { kind: usage, text: "Склоняется как прилагательное: taki, taka, takie, takiego…" }
  - { kind: usage, text: "Сочетание taki sam значит «такой же», а w takim razie — «в таком случае»." }
collocations:
  - { pl: "taki sam", ru: "такой же" }
  - { pl: "coś takiego", ru: "нечто подобное" }
  - { pl: "w takim razie", ru: "в таком случае" }
etymology: "От указательного tak с адъективным суффиксом -ki; ср. русское «такой», собранное точно так же («так» + «-ой»)."
memory: "taki = «такой» и склоняется как прилагательное. Два оборота стоит запомнить целиком: taki sam «такой же» и w takim razie «в таком случае»."
idioms:
  - { pl: "w takim razie", ru: "в таком случае" }
  - { pl: "coś takiego!", ru: "надо же!" }
  - { pl: "taki sam", ru: "такой же" }
