  - id: geometric-side
    ru: "сторона фигуры"
    examples:
      - pl: "Kwadrat to figura geometryczna, która ma cztery kąty proste i cztery boki równe."
        ru: "Квадрат — это геометрическая фигура, имеющая четыре прямых угла и четыре равные стороны."
        source: { kind: tatoeba, id: 5493640 }
      - pl: "Kwadrat ma 4 boki o równych długościach."
        ru: "У квадрата четыре стороны равной длины."
        source: { kind: translated, id: 13752550 }
notes:
  - { kind: usage, text: "Очень много наречных оборотов: na bok «в сторону», z boku «сбоку, в сторонке», na boku «на стороне, подработкой», pod bokiem «под боком, рядом», u boku «подле»." }
  - { kind: false-friend, text: "В геометрии bok — «сторона» фигуры: boki trójkąta «стороны треугольника». Русское «сторона» в других смыслах — это strona, а не bok." }
  - { kind: usage, text: "Żarty na bok — «шутки в сторону», оборот совпадает с русским буквально." }
  - { kind: usage, text: "Мужской неодушевлённый: bok, boku. Предложный — w boku «в боку»." }
collocations:
  - { pl: "na bok", ru: "в сторону" }
  - { pl: "z boku", ru: "сбоку" }
  - { pl: "pod bokiem", ru: "под боком" }
etymology: "Праславянское *bokъ — то же самое слово, что русское «бок». Совпадение полное."
memory: "bok — «бок», слово то же самое. Главное — наречные обороты: na bok «в сторону», z boku «сбоку», na boku «на стороне» о приработке, pod bokiem «под боком». А в геометрии bok — это «сторона» фигуры."
