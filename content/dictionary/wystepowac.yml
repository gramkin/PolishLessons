  - id: occur
    ru: "встречаться, иметься (о явлении)"
    examples:
      - pl: "W tym regionie występują niedźwiedzie."
        ru: "В этом регионе водятся медведи."
        source: { kind: authored }
      - pl: "Objaw ten występuje rzadko."
        ru: "Этот симптом встречается редко."
        source: { kind: authored }
  - id: oppose
    ru: "выступать (против, в защиту)"
    examples:
      - pl: "Występował przeciwko tej ustawie od początku."
        ru: "Он выступал против этого закона с самого начала."
        source: { kind: authored }
notes:
  - { kind: government, text: "WYSTĘPOWAĆ PRZECIWKO KOMUŚ — ДАТЕЛЬНЫЙ, А НЕ РОДИТЕЛЬНЫЙ. Русское «против» требует родительного: «против него, против закона». Польское przeciwko берёт дательный: przeciwko niemU, przeciwko ustawIE. Это общее свойство предлога, не только этого глагола, но здесь оно встречается чаще всего. Рядом стоит WYSTĘPOWAĆ W OBRONIE KOGOŚ «выступать в защиту кого-л.» — тут уже родительный, как у нас." }
  - { kind: false-friend, text: "ВТОРОЕ ЗНАЧЕНИЕ РУССКОМУ «ВЫСТУПАТЬ» НЕДОСТУПНО. WYSTĘPOWAĆ значит ещё «встречаться, водиться, иметься»: w tym regionie występują niedźwiedzie «в этом краю водятся медведи», objaw występuje rzadko «симптом встречается редко». Это обычное слово научных и справочных текстов. Перевести его как «выступает» нельзя ни в одном таком предложении." }
  - { kind: usage, text: "Страдательного причастия нет: глагол непереходный, дополнение всегда идёт через предлог. Отсюда 52 формы вместо 63 — так же устроены współczuć, zajrzeć, wpadać и patrzeć. Безличное WYSTĘPOWANO при этом есть. Совершенная пара — WYSTĄPIĆ, и от неё существительное WYSTĄPIENIE «выступление»." }
collocations:
  - { pl: "występować na scenie", ru: "выступать на сцене" }
  - { pl: "występować przeciwko komuś", ru: "выступать против кого-л." }
  - { pl: "występować w obronie kogoś", ru: "выступать в защиту кого-л." }
family:
  - { pl: "wystąpić", ru: "выступить (сов.)", relation: aspect, id: wystapic }
  - { pl: "stąpać", ru: "ступать", relation: root }
  - { pl: "postępować", ru: "поступать", relation: root, id: postepowac }
etymology: "Приставка wy- и stępować от stąpić «ступить», из праславянского *stǫpiti. Русское «выступать» собрано ровно из тех же частей, морфема в морфему, и первое значение у них общее. Разошлось второе: поляк тем же словом говорит о том, что где-то водится или встречается, а русский на это место ставит совсем другие глаголы. Из того же гнезда postępować «поступать» и występek «проступок»."
memory: "Два значения, из которых второе неожиданное: występować на сцене — «выступать», но w tym regionie występują niedźwiedzie — «водятся». И предлог: przeciwko требует дательного, przeciwko ustawie, а не «ustawy»."
idioms:
  - { pl: "występować w czyjejś obronie", ru: "выступать в чью-л. защиту" }
  - { pl: "występować z wnioskiem", ru: "выступать с предложением" }
