  - id: stand-on-end
    ru: "дыбом (в обороте stanąć dęba)"
    examples:
      - pl: "Koń staje dęba."
        ru: "Конь встаёт на дыбы."
        source: { kind: translated, id: 12438401 }
      - pl: "Włosy stanęły mu dęba."
        ru: "У него волосы встали дыбом."
        source: { kind: translated, id: 6547712 }
notes:
  - { kind: false-friend, text: "Русский «дуб» и польское dąb — одно слово: носовое ą отвечает русскому у. Тот же ряд: ząb/зуб, gołąb/голубь." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — dębu, с чередованием ą/ę: dąb, ale dębu, dęby." }
  - { kind: usage, text: "Оборот stanąć dęba значит «встать на дыбы» о коне и «встать дыбом» о волосах — как и в русском." }
  - { kind: usage, text: "Прилагательное dębowy «дубовый»; жёлудь — żołądź." }
collocations:
  - { pl: "stanąć dęba", ru: "встать на дыбы" }
  - { pl: "dębowy stół", ru: "дубовый стол" }
etymology: "Праславянское *dǫbъ; русский «дуб» — то же слово, носовое ą отвечает русскому у."
memory: "dąb — «дуб», читается «домп». Чередование ą/ę: dąb, но dębu, dęby. Оборот stanąć dęba — «встать на дыбы, встать дыбом»."
idioms:
  - { pl: "stanąć dęba", ru: "встать на дыбы" }
