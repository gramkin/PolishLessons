etymology: "Сложено из отрицания NIE и прилагательного WIDZIALNY, которое от WIDZIEĆ «видеть», от праславянского *viděti, то есть от того же корня, что русские «видеть», «вид», «видимый». Суффикс -ALNY здесь означает возможность, как латинский -BILIS, и отвечает русскому -ИМЫЙ в том же значении: то, что может быть увидено. Русский построил «невидимый» из тех же частей, не плюс вид плюс имый, так что слова совпадают по устройству полностью, различаясь только суффиксом возможности. Рядом в том же гнезде NIEWIDOMY «слепой», где суффикс другой и значение сместилось с предмета на человека."
memory: "Правило суффикса стоит дороже слова: -alny отвечает русскому -альный в латинских корнях, naturalny и «натуральный», но русскому -имый в славянских, widzialny и «видимый», słyszalny и «слышимый». Отсюда niewidzialny это «невидимый». Держать отдельно две пары: niewidzialny невидим по природе, niewidoczny не виден отсюда, заслонён; и niewidomy, которое значит «слепой». Читается «невидзя́льны», где dzi даёт мягкое «дзь»."
