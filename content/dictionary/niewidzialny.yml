notes:
  - { kind: false-friend, text: "Полезно уточнить правило о суффиксе -ALNY. Обычно он отвечает русскому -АЛЬНЫЙ: NATURALNY и «натуральный», NORMALNY и «нормальный». Но в словах со славянским корнем тот же суффикс отвечает русскому -ИМЫЙ: WIDZIALNY и «видимый», SŁYSZALNY и «слышимый», CZYTELNY и «читаемый». Поэтому NIEWIDZIALNY это «невидимый», а не «невизуальный». Признак простой: если корень свой, славянский, перевод будет на -ИМЫЙ, а если латинский, то на -АЛЬНЫЙ." }
  - { kind: usage, text: "Одиннадцать форм, степеней сравнения нет: невидимым нельзя быть в большей мере, признак либо есть, либо нет. Рядом стоит NIEWIDOCZNY, и разница между ними существенная. NIEWIDZIALNY — невидимый в принципе, по природе: NIEWIDZIALNY ATRAMENT. NIEWIDOCZNY — не видный отсюда, заслонённый или слишком мелкий: ZNAK BYŁ NIEWIDOCZNY ZZA DRZEWA «знак был не виден из-за дерева». Русский в обоих случаях часто говорит «невидимый», и выбор приходится делать заново." }
  - { kind: pronunciation, text: "Читается «невидзя́льны», четыре слога, ударение на предпоследнем. Сочетание DZI даёт слитное мягкое «дзь», и перед A это «дзя»: не «дзиа», а «дзя». Приставка NIE звучит «не». Буква L здесь обычная, не перечёркнутая, поэтому «ль», а не «у». Конечное Y — это «ы». В глаголе WIDZIEĆ слышно «ви́дзечь», и то же DZI работает там же." }
  - { kind: government, text: "Прилагательное только согласуется. Для кого невидим, указывается предлогом DLA с родительным: NIEWIDZIALNY DLA PRZECHODNIÓW «невидимый для прохожих», NIEWIDZIALNY DLA KAMER. Русский строит это так же, через «для», так что переносить ничего не нужно. Глагол того же гнезда WIDZIEĆ управляет винительным прямо: WIDZĘ GO «я его вижу», а при отрицании винительный меняется на родительный: NIE WIDZĘ GO, и это общее польское правило отрицания." }
  - { kind: register, text: "Слово нейтральное и часто переносное. Частые обороты: NIEWIDZIALNA RĘKA RYNKU «невидимая рука рынка», NIEWIDZIALNY ATRAMENT «невидимые чернила», NIEWIDZIALNE BARIERY «невидимые барьеры», CZŁOWIEK NIEWIDZIALNY как название романа. В разговоре о людях, которых не замечают, оборот работает и по-русски: CZUŁEM SIĘ NIEWIDZIALNY значит «я чувствовал себя невидимым». Отдельно стоит слово NIEWIDOMY, которое значит «слепой», и путать его с NIEWIDZIALNY нельзя." }
