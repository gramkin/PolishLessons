etymology: "Сложение dwa «два» и dzieścia — старой формы слова «десять» в двойственном числе, то есть буквально «два десятка». Русское «двадцать» собрано точно так же: «два» плюс «дцать» из «десяти». Оба языка сохранили один и тот же древний способ счёта, только стёрли его по-разному."
memory: "dwadzieścia — «двадцать», и собрано как русское слово: два плюс десять. Форм три: dwadzieścia с обычными существительными, dwudziestu с мужчинами, dwadzieścioro с детьми — последней у русского нет, там просто «двадцать детей»."
idioms:
  - { pl: "dwadzieścia lat temu", ru: "двадцать лет назад" }
  - { pl: "dwadzieścia cztery godziny na dobę", ru: "двадцать четыре часа в сутки" }
formExamplesSkip:
  - { form: "dwudziesto", reason: "Это не самостоятельное слово, а связанная основа для сложных прилагательных и числительных. Она пишется слитно с продолжением и отдельно не встречается: dwudziestoletni «двадцатилетний», dwudziestowieczny «двадцатого века», dwudziestopięcioletni «двадцатипятилетний», dwudziestoosobowy «на двадцать человек». Сказать или написать dwudziesto само по себе нельзя — так же как нельзя сказать по-русски «двадцати» вне сложного слова «двадцатилетний»." }
