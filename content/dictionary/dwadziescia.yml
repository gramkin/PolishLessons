notes:
  - { kind: usage, text: "У ПОЛЬСКИХ ЧИСЛИТЕЛЬНЫХ ЕСТЬ ОСОБАЯ СОБИРАТЕЛЬНАЯ ФОРМА, КОТОРОЙ РУССКИЙ ЗДЕСЬ НЕ ИМЕЕТ. Dwadzieścioro употребляют с существительными вроде dzieci, niemowlęta, kurczęta и со смешанными по полу группами: dwadzieścioro dzieci, dwadzieścioro ludzi. Русский собирательный ряд обрывается рано — «двое, трое, четверо» и до десятка, — а «двадцатеро» уже не говорят; по-русски будет просто «двадцать детей»." }
  - { kind: government, text: "ТРИ ФОРМЫ НА ТРИ СЛУЧАЯ, И ОТ НИХ ЗАВИСИТ ГЛАГОЛ. Dwadzieścia с родительным множественного: dwadzieścia lat, dwadzieścia osób — и сказуемое в среднем роде единственного числа: przyszło dwadzieścia osób. Dwudziestu с мужско-личными: dwudziestu mężczyzn przyszło. Dwudziestoma — творительный: z dwudziestoma kolegami." }
  - { kind: pronunciation, text: "Четыре слога, ударение на предпоследнем: dwa-DZIE-ścia. Dzi читается как мягкое дзь, ści — как щч: «двадзе́щча». В косвенных формах ударение остаётся предпоследним: dwudziestu — «двудзе́сту»." }
  - { kind: register, text: "Нейтрально. Одна форма в таблице пропущена по грамматической причине и объяснена в карточке: это основа для сложных слов, а не отдельное числительное." }
