notes:
  - { kind: false-friend, text: "Русский «край» и польский KRAJ совпадают, а KRAINA это уже другое слово и другого объёма. KRAJ значит «страна, государство»: NASZ KRAJ «наша страна», ZA GRANICĄ KRAJU. KRAINA значит «край» в географическом и поэтическом смысле — область с общим характером: KRAINA JEZIOR «край озёр», KRAINA WIECZNEGO LODU. Поэтому русское «край» в значении страны переводится как KRAJ, а в значении области — как KRAINA, и выбирать надо каждый раз заново. Третье слово, OKOLICA, означает окрестности. В сказочном употреблении KRAINA отвечает русскому «стране»: KRAINA CZARÓW «Страна чудес»." }
  - { kind: government, text: "Женский род на -A. Винительный на -Ę: OPISAĆ KRAINĘ. Родительный на -Y: BEZ KRAINY. Дательный и местный совпадают в форме KRAINIE, где N смягчается перед окончанием: W KRAINIE. Родительный множественного KRAIN, без окончания. Чего край — родительный без предлога: KRAINA JEZIOR, KRAINA WIECZNEGO LODU. Где — предлог W с местным: W KRAINIE. Суффикс -INA здесь тот же, что в ROŚLINA, и образует он название единичного целого из общего понятия." }
  - { kind: pronunciation, text: "Читается «краи́на», ударение на предпоследнем слоге из трёх. Сочетание AI не стягивается в один звук: гласные A и I произносятся раздельно, «кра-и-на», и это важно, потому что русскоговорящий склонен проглотить I. Буква R твёрдая. В дательном и местном KRAINIE буква N смягчается и звучит «не»: «краи́не», слогов становится четыре, и ударение переходит на предпоследний. В родительном множественного KRAIN два слога: «кра́ин»." }
  - { kind: usage, text: "Частотные сочетания: KRAINA JEZIOR, KRAINA CZARÓW «Страна чудес», KRAINA WIECZNEGO LODU, KRAINA DZIECIŃSTWA «край детства» переносно. Слово книжное и географическое: в документах и в разговоре о государстве говорят KRAJ, а KRAINA остаётся для описаний природы, сказок и воспоминаний. В исторической географии KRAINA означает историческую область: KRAINA WARMIŃSKA. Прилагательное от слова не образуется, вместо него берут родительный или прилагательное от KRAJ: KRAJOWY значит «отечественный», а не «краевой»." }
