etymology: "От KRAJ «страна, край» с суффиксом -INA, и корень общий с русским «краем»: праславянское *krajь, исходно «обрезанный край, граница», от *krojiti «кроить, резать». Отсюда и русское «кроить», и польское KROIĆ, и смысловой ход понятен — край это то, где отрезано, граница. Польский развёл два слова по обязанностям: KRAJ взял государство, KRAINA — область с общим характером, и суффикс -INA здесь работает так же, как в ROŚLINA, выделяя единичное целое из общего понятия. Русский оставил один «край» на оба смысла и добавил «страну» из другого корня, от «сторона». Поэтому пара KRAJ и KRAINA требует от русскоговорящего выбора там, где в русском выбора нет."
memory: "Не то же, что kraj: kraj — «страна, государство», kraina — «край, область» в географическом и сказочном смысле. Kraina jezior «край озёр», Kraina Czarów «Страна чудес». Русское «край» отвечает то одному, то другому, и выбирать надо по смыслу. Суффикс -ina тот же, что в roślina. Читать с раздельными гласными: кра-и-на, не «крайна». Дательный и местный совпадают: krainie."
