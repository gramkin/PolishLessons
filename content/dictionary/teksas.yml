notes:
  - { kind: false-friend, text: "Польский назвал эту ткань по американскому штату: TEKSAS значит «джинсовая ткань», а TEKSASY во множественном — «джинсы». Русский же взял название самой одежды, «джинсы», из английского JEANS, которое идёт от итальянского города Генуи. Так два языка назвали одну вещь по двум разным географическим именам: польский по Техасу, русский через Генуу. Поэтому TEKSASY нельзя переводить как «техасы», и русскоязычное «техасы» в этом значении не существует. В современном польском рядом стоит DŻINSY, заимствованное из английского, и оно постепенно вытеснило TEKSASY, которые теперь звучат как слово старшего поколения." }
  - { kind: government, text: "Мужской род, неодушевлённое. В значении ткани употребляется в единственном числе: TEKSAS NA METRY, KOSZULA Z TEKSASU. В значении одежды — только во множественном, как и русские «джинсы»: TEKSASY, W TEKSASACH, BEZ TEKSASÓW. Родительный единственного на -U: Z TEKSASU. Местный TEKSASIE, где S смягчается перед -IE. Из чего сделано — предлог Z с родительным: SPODNIE Z TEKSASU. Родительный множественного TEKSASÓW." }
  - { kind: pronunciation, text: "Читается «тэ́ксас», ударение на предпоследнем слоге из двух. Буква E звучит «э», без смягчения предшествующего согласного. Сочетание KS произносится раздельно, оба согласных. Конечное S ясное, без озвончения. В местном падеже TEKSASIE сочетание SIE даёт мягкое «се»: «тэкса́се», три слога, ударение переходит на предпоследний. Во множественном TEKSASY слышно «тэкса́сы»." }
  - { kind: register, text: "Слово принадлежит языку второй половины двадцатого века: в семидесятые и восьмидесятые годы TEKSASY были единственным названием джинсов в Польше, а сам TEKSAS — названием ткани, которую трудно было достать. Сегодня нейтральное слово DŻINSY, а TEKSASY звучат либо исторически, либо шутливо. Частотные сочетания: SPODNIE Z TEKSASU, KURTKA TEKSASOWA «джинсовая куртка», NOSIĆ TEKSASY. Прилагательное TEKSASOWY относится к ткани и встречается в описаниях одежды того времени." }
