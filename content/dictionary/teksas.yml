etymology: "От названия американского штата Техас, по которому в Польше стали называть плотную хлопковую ткань, а затем и сшитые из неё брюки. Путь этот типичен для названий тканей: кашемир по Кашмиру, джерси по острову Джерси, деним по французскому городу Ниму, через выражение DE NÎMES. Русский в этом случае пошёл по другому имени: «джинсы» идут от английского JEANS, а то — от средневекового названия Генуи, GENES, откуда привозили похожую ткань. Так одна вещь получила в двух языках имена двух разных мест, и ни одно из них не переводится в другое. В самом польском название ткани по месту тоже не единственное: DENIM в современных каталогах соседствует с TEKSAS."
memory: "Польша назвала джинсовую ткань по Техасу: teksas — деним, teksasy — джинсы. Русское «джинсы» идёт от английского jeans, а то — от Генуи; одна вещь, два географических имени, и «техасы» по-русски не говорят. Ткань в единственном, одежда только во множественном, как и «джинсы». Сегодня нейтральное слово dżinsy, а teksasy звучат как слово старшего поколения."
