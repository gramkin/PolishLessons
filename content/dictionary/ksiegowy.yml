        ru: "Позвони бухгалтеру насчёт счёта."
        source: { kind: authored }
  - id: bookkeeping
    ru: "бухгалтерский, балансовый"
    examples:
      - pl: "Prowadzi biuro księgowe."
        ru: "Он руководит бухгалтерской конторой."
        source: { kind: authored }
      - pl: "Wartość księgowa firmy spadła."
        ru: "Балансовая стоимость фирмы упала."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KSIĘGOWY похож на «книжный», и корень тот же: KSIĘGA — «книга», большая и учётная. Но книжный — KSIĄŻKOWY, а KSIĘGOWY — «бухгалтер», тот, кто ведёт книги учёта. Слово BUCHALTER в польском есть, но устарело. Бухгалтерия — KSIĘGOWOŚĆ." }
  - { kind: usage, text: "Склоняется как прилагательное, но чаще служит существительным: KSIĘGOWY — бухгалтер, KSIĘGOWA — бухгалтерша, KSIĘGOWI — бухгалтеры. Поэтому творительный при BYĆ: JEST KSIĘGOWYM, JEST KSIĘGOWĄ. Как прилагательное: DOWÓD KSIĘGOWY, «бухгалтерский документ», BIURO KSIĘGOWE." }
  - { kind: government, text: "Профессия после BYĆ — творительный: ON JEST KSIĘGOWYM, не KSIĘGOWY. По какому делу — W SPRAWIE с родительным: ROZMOWA Z KSIĘGOWĄ W SPRAWIE PODATKÓW. Как прилагательное ставится после существительного." }
  - { kind: pronunciation, text: "Читается «ксьенго́вы», три слога, ударение на предпоследнем. KSI — «ксь», Ę перед G звучит «эн», W перед Y — «в»." }
  - { kind: register, text: "Нейтральное слово, обычное в работе и быту: каждый поляк с фирмой «имеет своего бухгалтера» — MAM SWOJĄ KSIĘGOWĄ." }
collocations:
  - { pl: "biuro księgowe", ru: "бухгалтерская контора" }
  - { pl: "wartość księgowa", ru: "балансовая стоимость" }
  - { pl: "główny księgowy", ru: "главный бухгалтер" }
family:
  - { pl: "księga", ru: "книга (большая, учётная)", relation: root, id: ksiega }
  - { pl: "księgowość", ru: "бухгалтерия", relation: derived }
  - { pl: "książka", ru: "книга", relation: root, id: ksiazka }
etymology: "От KSIĘGA «книга, учётная книга», того же корня, что KSIĄŻKA, «книга». Бухгалтер — тот, кто ведёт KSIĘGI RACHUNKOWE, «учётные книги»."
memory: "Księgowy — бухгалтер, księgowa — бухгалтерша. Jest księgowym — он бухгалтер. Biuro księgowe — бухгалтерская контора. От księga — книга учёта. Читается «ксьенго́вы»."
idioms:
  - { pl: "kreatywna księgowość", ru: "творческая бухгалтерия (подделка отчётности)" }
