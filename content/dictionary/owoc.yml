        ru: "Люблю морепродукты."
        source: { kind: tatoeba, id: 11532994 }
notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: owoc — это ФРУКТ, а не овощ. Овощ по-польски warzywo. Слова созвучны и оба о еде, поэтому ошибка почти неизбежна." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — owocu, мн. owoce. Питаться фруктами — żywić się owocami, творительный." }
  - { kind: usage, text: "Owoce morza значит «морепродукты», буквально «плоды моря» — как французское fruits de mer." }
  - { kind: usage, text: "Переносно owoc — «плод, результат»: zakazany owoc «запретный плод». Прилагательное owocowy уже есть в словаре." }
collocations:
  - { pl: "owoce morza", ru: "морепродукты" }
  - { pl: "zakazany owoc", ru: "запретный плод" }
etymology: "Праславянское *ovotje «плод»; русское «овощ» — то же слово, но значение сузилось до огородных культур."
memory: "owoc — это ФРУКТ, а не овощ: овощ по-польски warzywo. Owoce morza — «морепродукты». Переносно — «плод, результат»."
