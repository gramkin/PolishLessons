senses:
  - id: offend
    ru: "обидеть, оскорбить"
    examples:
      - pl: "Nie chciałem cię obrazić."
        ru: "Я не хотел тебя обидеть."
        source: { kind: authored }
      - pl: "Obraził gospodarza jednym zdaniem."
        ru: "Он обидел хозяина одной фразой."
        source: { kind: authored }
      - pl: "Obrażono ją publicznie."
        ru: "Её оскорбили публично."
        source: { kind: authored }
  - id: take-offence
    ru: "обидеться (с SIĘ)"
    examples:
      - pl: "Obraziła się i wyszła bez słowa."
        ru: "Она обиделась и вышла без слова."
        source: { kind: authored }
      - pl: "Obrazili się o drobiazg."
        ru: "Они обиделись из-за мелочи."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Самая полезная пара в карточке — два существительных из одного корня, различающиеся только родом и одной буквой. OBRAZ, мужской род, значит «картина, образ»: OBRAZ NA ŚCIANIE — «картина на стене». OBRAZA, женский род, значит «обида, оскорбление»: TO OBRAZA DLA CAŁEJ RODZINY. Русское «образ» отвечает первому, русская «обида» — второму, и спутать их в речи легко, потому что звучат они почти одинаково. Сам глагол OBRAZIĆ при этом значит только «обидеть», и к «образу» отношения не имеет." }
  - { kind: pronunciation, text: "Основа та же, что в карточке PRZERAZIĆ, и ведёт себя точно так же. Мягкий з пишется тремя способами: ź на конце слова и перед согласным — OBRAŹ, OBRAŹMY, OBRAŹCIE; zi перед гласной — OBRAZI, OBRAZISZ, OBRAZIŁ; и ż там, где он твердеет перед -ę и -ą — OBRAŻĘ, OBRAŻĄ. Страдательное причастие идёт от твёрдой основы: OBRAŻONY, а мужская личная форма множественного — OBRAŻENI с e, по правилу причастий на -ony из карточки KARMIĆ." }
  - { kind: usage, text: "Отглагольное существительное OBRAŻENIE живёт в двух смыслах, и второй к обиде не относится вовсе. В единственном числе это «оскорбление», а во множественном OBRAŻENIA — это «телесные повреждения, травмы»: DOZNAŁ CIĘŻKICH OBRAŻEŃ — «он получил тяжёлые травмы», OBRAŻENIA CIAŁA в протоколе значит ровно то же, что русское «телесные повреждения». Связь через корень RAZIĆ «ударить» видна сразу, но запоминать эти два смысла надо отдельно." }
  - { kind: government, text: "Переходный, винительный: OBRAZIĆ KOGOŚ — obraził mnie, obraziła gospodarza. С SIĘ становится возвратным и берёт предлог O с винительным для причины: OBRAZIĆ SIĘ O COŚ, OBRAZILI SIĘ O DROBIAZG «они обиделись из-за мелочи». Русский берёт здесь «из-за» с родительным или «на» с винительным — «обиделся на меня», — и это OBRAZIĆ SIĘ NA KOGOŚ. То есть предлог зависит от того, обида на человека или из-за дела. Несовершенная пара — OBRAŻAĆ." }
collocations:
  - { pl: "obrazić kogoś", ru: "обидеть кого-либо" }
  - { pl: "obrazić się o drobiazg", ru: "обидеться из-за мелочи" }
  - { pl: "obrażenia ciała", ru: "телесные повреждения" }
family:
  - { pl: "obrażać", ru: "обижать, оскорблять", relation: aspect }
  - { pl: "razić", ru: "резать (о свете), поражать", relation: root }
  - { pl: "obraza", ru: "обида, оскорбление", relation: derived }
etymology: "Приставка ob- и RAZIĆ «ударить», из праславянского *raziti — тот же корень, что в русских «разить», «поразить», «заразить». Буквально «ударить, задеть», откуда «обидеть». Из того же корня в польском PRZERAZIĆ «напугать», PORAZIĆ «поразить током», OBRAZA «обида», OBRAŻENIA «травмы», а также OBRAZ «картина, образ» — последний через значение «вырезанное, отпечатанное», как и русский «образ» от «образить, обрезать»."
memory: "Корень тот же, что в przerazić: ob- плюс razić «ударить» даёт «обидеть». И помните пару obraz «картина» против obraza «обида» — различаются родом и одной буквой."
idioms:
  - { pl: "obrażenia ciała", ru: "телесные повреждения" }
  - { pl: "bez obrazy", ru: "без обид" }
