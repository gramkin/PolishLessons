# review
id: powiesc-noun
format: 2
lemma: "powieść"
rank: 2514
pos: noun
pron: { cyr: "по́вьесьць" }
senses:
  - id: novel
    ru: "роман (книга)"
    examples:
      - pl: "Lubię czytać amerykańskie powieści."
        ru: "Я люблю читать американские романы."
        source: { kind: tatoeba, id: 627767 }
      - pl: "O ile mi wiadomo, ta powieść nie jest przetłumaczona na japoński."
        ru: "Насколько я знаю, роман не переведён на японский."
        source: { kind: tatoeba, id: 2482495 }
      - pl: "Bohaterka tej powieści popełniła samobójstwo."
        ru: "Героиня романа покончила жизнь самоубийством."
        source: { kind: tatoeba, id: 582170 }
  - id: novels
    ru: "романы, проза"
    examples:
      - pl: "Tom często spędza wolny czas na czytaniu powieści."
        ru: "Том часто проводит свободное время за чтением романов."
        source: { kind: tatoeba, id: 10475274 }
      - pl: "Zaczął pisać powieść."
        ru: "Он начал писать роман."
        source: { kind: translated, id: 2120093 }
notes:
  - { kind: false-friend, text: "ГЛАВНАЯ ловушка: powieść — это РОМАН, а не повесть. Повесть по-польски opowieść или nowela, а короткий рассказ — opowiadanie." }
  - { kind: government, text: "Женский род на мягкую согласную: ta powieść, tej powieści." }
  - { kind: usage, text: "Идентификатор карточки — powiesc-noun, потому что powiesc уже занято глаголом powieść «повести», как czesc и czesc-noun." }
  - { kind: usage, text: "Powieść kryminalna «детективный роман», powieść historyczna «исторический роман»." }
collocations:
  - { pl: "powieść kryminalna", ru: "детективный роман" }
  - { pl: "napisać powieść", ru: "написать роман" }
etymology: "От powieść «повести, рассказать»; русское «повесть» — то же слово, но польское значит роман."
memory: "powieść — это РОМАН, а не повесть: повесть по-польски opowieść. Идентификатор карточки — powiesc-noun, потому что powiesc занято глаголом."
idioms:
  - { pl: "powieść kryminalna", ru: "детективный роман" }
