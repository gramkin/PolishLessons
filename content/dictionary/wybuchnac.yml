notes:
  - { kind: pronunciation, text: "ДВА ПОЛНЫХ РЯДА ПРОШЕДШЕГО ВРЕМЕНИ, И ОБА ПРАВИЛЬНЫ. Говорят и wybuchł, wybuchła, wybuchli, и wybuchnął, wybuchnęła, wybuchnęli. Короткий ряд в современной речи частотнее, особенно о войне и пожаре: wybuchła wojna. Отсюда и необычный объём парадигмы — сорок восемь форм вместо обычных сорока с небольшим. Два деепричастия тоже сосуществуют: wybuchłszy и wybuchnąwszy." }
  - { kind: government, text: "Разражаются ЧЕМ — ТВОРИТЕЛЬНЫЙ без предлога, точно как по-русски: wybuchnąć śmiechem, płaczem, gniewem. Эта модель переносится из родного языка целиком. В прямом значении глагол непереходный и дополнения не требует: bomba wybuchła." }
  - { kind: false-friend, text: "Приставка wy- отвечает русской «вы-», а корень buch- звукоподражательный, того же происхождения, что русское «бухать» — но значения разошлись: польское buchnąć значит «хлынуть, полыхнуть», а не «стучать». Опираться на русский глагол тут не стоит; надёжнее запомнить существительное wybuch «взрыв» и прилагательное wybuchowy — «взрывной» и о человеке «вспыльчивый»." }
  - { kind: usage, text: "Вид совершенный, несовершенная пара — wybuchać. Глагол непереходный, поэтому страдательного причастия нет: есть только отглагольное существительное wybuchnięcie и безличное wybuchnięto." }
collocations:
  - { pl: "wybuchła wojna", ru: "разразилась война" }
  - { pl: "wybuchnąć śmiechem", ru: "разразиться смехом" }
  - { pl: "wybuchowy charakter", ru: "вспыльчивый характер" }
family:
  - { pl: "wybuch", ru: "взрыв", relation: root, id: wybuch }
  - { pl: "wybuchać", ru: "взрываться", relation: aspect }
  - { pl: "wybuchowy", ru: "взрывной; вспыльчивый", relation: derived }
etymology: "Приставка wy- «вы-» плюс buchnąć — звукоподражательный корень со значением «хлынуть, полыхнуть», родственный русскому «бухать», но разошедшийся с ним по смыслу. Отсюда wybuch «взрыв», wybuchowy «взрывчатый, вспыльчивый» и buchać «валить» (о дыме, паре)."
memory: "wybuchnąć — «взорваться, разразиться»: wybuchła wojna, wybuchł pożar, wybuchnął śmiechem. Управление родное: творительный без предлога. И запомните, что прошедшее время тут двойное — wybuchł и wybuchnął, оба верны."
idioms:
  - { pl: "wybuchnąć śmiechem", ru: "разразиться смехом" }
  - { pl: "wybuchła awantura", ru: "разразился скандал" }
