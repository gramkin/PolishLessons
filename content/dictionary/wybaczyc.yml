# review
id: wybaczyc
format: 2
lemma: "wybaczyć"
rank: 331
pos: verb
aspect: perf
pron: { cyr: "выба́чыць" }
senses:
  - id: forgive
    ru: "простить, извинить"
    examples:
      - pl: "Wybacz, proszę."
        ru: "Прости меня, пожалуйста."
        source: { kind: tatoeba, id: 351546 }
      - pl: "Wybacz mi, proszę."
        ru: "Прости меня, пожалуйста!"
        source: { kind: tatoeba, id: 6015329 }
      - pl: "Wybacz, popsułem wszystko."
        ru: "Извини, я всё испортил."
        source: { kind: tatoeba, id: 4719315 }
  - id: forgive-smth
    ru: "простить кому-либо что-либо"
    note: "wybaczyć komuś coś — дательный и винительный, как в русском."
    examples:
      - pl: "Wszystko ci wybaczę."
        ru: "Я тебе всё прощу."
        source: { kind: tatoeba, id: 13784952 }
      - pl: "Nigdy sobie tego nie wybaczę."
        ru: "Никогда себе этого не прощу."
        source: { kind: tatoeba, id: 8664193 }
      - pl: "Proszę mu wybaczyć, on nie jest niczemu winien!"
        ru: "Отпустите его, он же ни в чём не виноват!"
        source: { kind: tatoeba, id: 12689767 }
notes:
  - { kind: usage, text: "Управление совпадает с русским: wybaczyć komuś coś — Wybaczyłem mu jego błąd «Я простил ему его ошибку»." }
  - { kind: usage, text: "Wybacz! и Wybaczcie! — повседневные «Извини!» и «Извините!», мягче, чем Przepraszam." }
  - { kind: usage, text: "Несовершенный вид — wybaczać; существительное wybaczenie «прощение»: prosić o wybaczenie «просить прощения»." }
collocations:
  - { pl: "wybacz mi", ru: "прости меня" }
  - { pl: "wybaczyć komuś", ru: "простить кому-то" }
  - { pl: "prosić o wybaczenie", ru: "просить прощения" }
  - { pl: "nie wybaczę", ru: "не прощу" }
etymology: "Из wy- + baczyć «смотреть, замечать»; ср. украинское «бачити» и диалектное русское «бачить» — «видеть». Простить значит «не заметить, не поставить в счёт»."
memory: "wybaczyć — «простить», и управление как в русском: wybaczyć komuś coś. А Wybacz! — повседневное «Извини!», мягче, чем Przepraszam."
idioms:
  - { pl: "wybacz mi", ru: "прости меня" }
  - { pl: "prosić o wybaczenie", ru: "просить прощения" }
  - { pl: "nie do wybaczenia", ru: "непростительно" }
