# review
id: brzeg
format: 2
lemma: "brzeg"
rank: 2579
pos: noun
pron: { cyr: "бжэк" }
senses:
  - id: shore
    ru: "берег"
    examples:
      - pl: "Jak daleko od brzegu jesteśmy?"
        ru: "Как далеко мы от берега?"
        source: { kind: tatoeba, id: 12259439 }
      - pl: "Odpłynęliśmy daleko od brzegu i wyłączyliśmy silnik."
        ru: "Мы отплыли подальше от берега и заглушили мотор."
        source: { kind: tatoeba, id: 13785941 }
      - pl: "Usiadł na brzegu rzeki."
        ru: "Он сел на берегу реки."
        source: { kind: translated, id: 734373 }
  - id: edge
    ru: "край, кромка"
    examples:
      - pl: "Z wypełnionej po brzegi wanny zaczęła wylewać się woda."
        ru: "Из заполненной до краёв ванны начала выливаться вода."
        source: { kind: tatoeba, id: 10472071 }
      - pl: "Aula była wypełniona po brzegi."
        ru: "Зал был заполнен до краёв."
        source: { kind: translated, id: 364779 }
notes:
  - { kind: false-friend, text: "Русский «берег» и польское brzeg — одно слово. Но польское значит ещё и «край» чего угодно: brzeg szklanki «край стакана», po brzegi «до краёв»." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — brzegu. На берег — na brzeg, винительный; на берегу — na brzegu, предложный." }
  - { kind: usage, text: "Wypełniony po brzegi «заполненный до краёв» — устойчивый оборот, в том числе о зале с людьми." }
  - { kind: usage, text: "Пословица Cicha woda brzegi rwie «В тихом омуте черти водятся», буквально «тихая вода берега рвёт»." }
collocations:
  - { pl: "na brzegu", ru: "на берегу" }
  - { pl: "po brzegi", ru: "до краёв" }
etymology: "Праславянское *bergъ; русский «берег» — то же слово."
memory: "brzeg — «берег», но ещё и «край»: brzeg szklanki, wypełniony po brzegi «до краёв». Пословица Cicha woda brzegi rwie отвечает русскому «в тихом омуте черти водятся»."
idioms:
  - { pl: "na brzegu", ru: "на берегу" }
  - { pl: "po brzegi", ru: "до краёв" }
