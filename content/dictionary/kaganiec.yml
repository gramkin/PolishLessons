      - pl: "To kaganiec dla wolności słowa."
        ru: "Это намордник для свободы слова."
        source: { kind: authored }
notes:
  - { kind: government, text: "Мужской неодушевлённый; родительный — kagańca, с чередованием ie/ń. Надеть намордник — założyć kaganiec, винительный." }
  - { kind: false-friend, text: "Омоним: kaganiec значит ещё и «светильник, плошка» — от kaganek «лампадка». Отсюда книжное kaganiec oświaty «светоч просвещения», где о собаках речи нет." }
  - { kind: usage, text: "Переносно — о цензуре: ustawa kagańcowa «закон-намордник». Оттенок резко неодобрительный." }
  - { kind: usage, text: "В корпусе слово встречается один раз, поэтому большинство примеров составлено вручную." }
collocations:
  - { pl: "założyć kaganiec", ru: "надеть намордник" }
  - { pl: "kaganiec oświaty", ru: "светоч просвещения" }
etymology: "От kaganek «лампадка» в одном значении и от корня «намордник» в другом — слова совпали по форме."
memory: "kaganiec — «намордник», и переносно о цензуре: ustawa kagańcowa. Но kaganiec oświaty значит «светоч просвещения» — это омоним, от kaganek «лампадка»."
idioms:
  - { pl: "założyć kaganiec", ru: "надеть намордник" }
