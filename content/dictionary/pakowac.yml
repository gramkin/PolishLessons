# review
id: pakowac
format: 2
lemma: "pakować"
rank: 2169
pos: verb
pron: { cyr: "пако́ваць" }
senses:
  - id: pack
    ru: "паковать, упаковывать"
    examples:
      - pl: "Pakuje prezenty w kolorowy papier."
        ru: "Он упаковывает подарки в цветную бумагу."
        source: { kind: authored }
      - pl: "Pakowali książki do kartonów przez cały dzień."
        ru: "Они весь день укладывали книги в коробки."
        source: { kind: authored }
  - id: pack-up
    ru: "собирать вещи (się)"
    examples:
      - pl: "Pakuję się, pociąg mam o szóstej."
        ru: "Я собираюсь, поезд у меня в шесть."
        source: { kind: authored }
      - pl: "Pakowała się w pośpiechu i o wszystkim zapomniała."
        ru: "Она собиралась в спешке и обо всём забыла."
        source: { kind: authored }
  - id: cram
    ru: "запихивать, пихать"
    examples:
      - pl: "Nie pakuj tylu rzeczy do jednej torby."
        ru: "Не пихай столько вещей в одну сумку."
        source: { kind: authored }
notes:
  - { kind: government, text: "КЛАДУТ DO CZEGOŚ — С РОДИТЕЛЬНЫМ. Pakować rzeczy DO walizki, DO kartonu, DO torby. Русское «в чемодан» ставит винительный, польское do — только родительный, та же схема, что в wsiąść do pociągu. Зато «во что» в смысле обёртки идёт через W с винительным: pakować prezent W papier «заворачивать подарок в бумагу». Два предлога делят между собой то, что русский покрывает одним «в»." }
  - { kind: usage, text: "PAKOWAĆ SIĘ значит «собираться в дорогу», а не «паковаться». Pakuję się na jutro — «собираю вещи на завтра». Русский тут глагол меняет: мы собираемся, а не пакуемся. Отсюда же разговорное PAKOWAĆ SIĘ W KŁOPOTY «влипать в неприятности» — рядом с wpaść w kłopoty из того же ряда образов." }
  - { kind: false-friend, text: "Существительное от этого корня расходится с русским. Польская PACZKA — это прежде всего «посылка»: odebrać paczkę na poczcie «получить посылку на почте». Русская «пачка» будет по-польски PACZKA только в смысле «пачка сигарет», а в смысле стопки бумаг — PLIK или STOS. Слово OPAKOWANIE значит «упаковка»." }
  - { kind: usage, text: "Спряжение даётся даром: инфинитив на -ować, настоящее на -uję, и русское «паковать — пакую» ведёт себя точно так же, потому что оба языка взяли слово из немецкого packen. Совершенная пара — SPAKOWAĆ: spakowałem walizkę «я упаковал чемодан»." }
collocations:
  - { pl: "pakować walizkę", ru: "паковать чемодан" }
  - { pl: "pakować się do wyjazdu", ru: "собираться в поездку" }
  - { pl: "pakować prezenty", ru: "упаковывать подарки" }
family:
  - { pl: "spakować", ru: "упаковать, собрать (сов.)", relation: aspect }
  - { pl: "paczka", ru: "посылка; пачка", relation: root, id: paczka }
  - { pl: "opakowanie", ru: "упаковка", relation: root }
etymology: "Из немецкого packen «паковать», через ту же торговую дорогу, по которой слово пришло и в русский: «паковать», «пакет», «пачка» — всё оттуда же. Поэтому польское pakuję и русское «пакую» совпадают до буквы. Разошлись производные: польская paczka стала прежде всего «посылкой», а наша «пачка» осталась стопкой или коробочкой."
memory: "Вещи кладут DO walizki — родительный падеж, как в wsiąść do pociągu. А вот заворачивают W papier, с винительным. И помни: pakuję się значит «собираюсь в дорогу», а не «пакуюсь»."
idioms:
  - { pl: "pakować się w kłopoty", ru: "влипать в неприятности" }
  - { pl: "pakować manatki", ru: "собирать манатки, убираться" }
