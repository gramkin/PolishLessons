pos: noun
pron: { cyr: "зйяст" }
senses:
  - id: congress
    ru: "съезд; встреча (выпускников)"
    examples:
      - pl: "Zjazd partii odbędzie się w maju."
        ru: "Съезд партии состоится в мае."
        source: { kind: authored }
      - pl: "Na zjazd absolwentów przyjechało sto osób."
        ru: "На встречу выпускников приехали сто человек."
