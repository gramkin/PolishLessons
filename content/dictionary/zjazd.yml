        source: { kind: authored }
  - id: descent
    ru: "спуск; съезд (с дороги)"
    examples:
      - pl: "Zjazd na nartach z tej góry jest trudny."
        ru: "Спуск на лыжах с этой горы трудный."
        source: { kind: authored }
      - pl: "Przegapiliśmy zjazd z autostrady."
        ru: "Мы проскочили съезд с автострады."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ZJAZD — «съезд» делегатов и «встреча»: ZJAZD ABSOLWENTÓW, ZJAZD RODZINNY. Но и «спуск» на лыжах, и «съезд» с дороги: ZJAZD Z AUTOSTRADY. По контексту понятно, о людях речь или о движении вниз." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. В местном падеже A переходит в E, ZD — в ŹDZ: NA ZJEŹDZIE. Родительный — ZJAZDU." }
  - { kind: government, text: "На съезде — NA ZJEŹDZIE, местный. Съезд с чего — ZJAZD Z, и родительный: ZJAZD Z GÓRY, Z AUTOSTRADY." }
  - { kind: pronunciation, text: "Читается «зйяст», один слог. Z и J произносятся раздельно, как в ZJEŚĆ «зйесьць»; конечное ZD оглушается в «ст»." }
collocations:
  - { pl: "zjazd absolwentów", ru: "встреча выпускников" }
  - { pl: "zjazd z autostrady", ru: "съезд с автострады" }
  - { pl: "zjazd narciarski", ru: "лыжный спуск" }
family:
  - { pl: "zjechać", ru: "съехать", relation: root }
  - { pl: "jazda", ru: "езда", relation: root, id: jazda }
  - { pl: "zjeżdżalnia", ru: "горка (детская)", relation: derived }
etymology: "Z- «с-» и корень JAZD- от JECHAĆ «ехать». Русское «съезд» построено так же: и собрание, на которое «съезжаются», и спуск, по которому «съезжают»."
memory: "Zjazd — съезд, встреча и спуск. Читается «зйяст». Zjazd absolwentów — встреча выпускников. Zjazd z autostrady — съезд с трассы."
idioms:
  - { pl: "zjechać kogoś z góry na dół", ru: "разнести кого-то в пух и прах" }
formExamplesSkip:
  - { form: "zjeździe", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
