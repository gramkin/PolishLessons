# review
id: uraz
format: 2
lemma: "uraz"
rank: 2236
pos: noun
pron: { cyr: "у́рас" }
senses:
  - id: injury
    ru: "травма, повреждение"
    examples:
      - pl: "Doznał urazu kolana na treningu."
        ru: "Он получил травму колена на тренировке."
        source: { kind: authored }
      - pl: "Uraz głowy wymaga obserwacji."
        ru: "Травма головы требует наблюдения."
        source: { kind: authored }
  - id: trauma
    ru: "психологическая травма"
    examples:
      - pl: "Został mu po tym uraz na całe życie."
        ru: "После этого у него осталась травма на всю жизнь."
        source: { kind: authored }
      - pl: "Uraz psychiczny leczy się latami."
        ru: "Психическая травма лечится годами."
        source: { kind: authored }
  - id: aversion
    ru: "отвращение, предубеждение (после пережитого)"
    examples:
      - pl: "Ma uraz do latania samolotem."
        ru: "У него отвращение к полётам на самолёте."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "ОСТОРОЖНО: URAZ И URAZA — РАЗНЫЕ СЛОВА. Мужское uraz значит «ТРАВМА», физическая или душевная. Женское uraza значит «ОБИДА»: mieć do kogoś urazę «держать на кого-то обиду». Корень у них общий, но путать нельзя: uraz лечит врач, urazę прощают." }
  - { kind: pronunciation, text: "Два слога, ударение на первом: U-raz. Конечное z оглушается до с: «у́рас». В косвенных падежах звонкость возвращается: urazu — «ура́зу». В предложном z смягчается: urazie — «ура́зе»." }
  - { kind: usage, text: "Медицинский термин и обиходное слово разом: uraz kręgosłupa, uraz czaszki, oddział urazowy «травматологическое отделение». В переносном смысле строится с do: mieć uraz do czegoś «иметь неприязнь к чему-л., бояться чего-л. после пережитого»." }
  - { kind: government, text: "ЧЕГО травма — родительный без предлога: uraz kolana, uraz głowy, uraz kręgosłupa. Получают травму глаголом doznać с родительным: doznał urazu. А неприязнь строится с предлогом do и родительным: uraz do wody, uraz do szpitali." }
collocations:
  - { pl: "doznać urazu", ru: "получить травму" }
  - { pl: "uraz głowy", ru: "травма головы" }
  - { pl: "mieć uraz do czegoś", ru: "иметь неприязнь к чему-л." }
family:
  - { pl: "razić", ru: "поражать, слепить", relation: root }
  - { pl: "uraza", ru: "обида", relation: derived }
  - { pl: "urazowy", ru: "травматический", relation: derived }
  - { pl: "obrazić", ru: "обидеть", relation: derived }
etymology: "Приставка u- плюс корень raz-, тот же, что в razić «поражать» и в русских «разить», «поразить», «сразить». Исходно uraz — это удар, нанесённый по чему-то, откуда и телесное повреждение, и душевное. Женское uraza пошло по душевной линии и закрепилось за обидой. Отсюда urazowy, obrazić, zrazić się."
memory: "uraz — «ТРАВМА», от того же корня, что «разить»: травма это нанесённый удар. Не путать с uraza — это «обида». Мужской род лечат, женский прощают. Получают травму оборотом doznać urazu, с родительным."
idioms:
  - { pl: "doznać urazu", ru: "получить травму" }
  - { pl: "mieć uraz do czegoś", ru: "иметь неприязнь к чему-л. после пережитого" }
