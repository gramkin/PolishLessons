# review
id: dotyk
format: 2
lemma: "dotyk"
rank: 4956
pos: noun
pron: { cyr: "до́тык" }
senses:
  - id: touch
    ru: "прикосновение"
    examples:
      - pl: "Poczuła dotyk jego dłoni."
        ru: "Она почувствовала прикосновение его руки."
        source: { kind: authored }
      - pl: "Ekran reaguje na dotyk."
        ru: "Экран реагирует на прикосновение."
        source: { kind: authored }
      - pl: "Kot uciekał przed każdym dotykiem."
        ru: "Кот убегал от каждого прикосновения."
        source: { kind: authored }
  - id: sense-of-touch
    ru: "осязание; ощупь"
    examples:
      - pl: "Dotyk to jeden z pięciu zmysłów."
        ru: "Осязание — одно из пяти чувств."
        source: { kind: authored }
      - pl: "Ta tkanina jest miękka w dotyku."
        ru: "Эта ткань мягкая на ощупь."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DOTYK — «прикосновение» и «осязание», от DOTYKAĆ «трогать». Корень русскому знаком по словам «тыкать», «дотронуться». Обиходное прилагательное — DOTYKOWY: EKRAN DOTYKOWY — сенсорный экран. А W DOTYKU — «на ощупь»: ZIMNY W DOTYKU." }
  - { kind: usage, text: "Девять форм, мужской род, неодушевлённое. Родительный и местный — DOTYKU. Во множественном DOTYKI — «прикосновения», чаще в книжной речи: CZUŁE DOTYKI." }
  - { kind: government, text: "На ощупь — W DOTYKU, местный: MIĘKKI W DOTYKU. Реагировать на прикосновение — REAGOWAĆ NA DOTYK, NA с винительным. От прикосновения — OD DOTYKU, родительный." }
  - { kind: pronunciation, text: "Читается «до́тык», два слога, ударение на первом. Y — «ы». В форме DOTYKU ударение сдвигается: «доты́ку»." }
collocations:
  - { pl: "delikatny dotyk", ru: "нежное прикосновение" }
  - { pl: "ekran dotykowy", ru: "сенсорный экран" }
  - { pl: "reagować na dotyk", ru: "реагировать на прикосновение" }
family:
  - { pl: "dotykać", ru: "касаться, трогать", relation: root, id: dotykac }
  - { pl: "dotknąć", ru: "коснуться", relation: derived, id: dotknac }
  - { pl: "dotykowy", ru: "сенсорный, осязательный", relation: derived }
etymology: "От DOTYKAĆ «касаться», а тот — от древнего звукоподражательного корня, того же, что русское «тыкать»: приставка DO- значит «до», то есть «дотыкать», дотронуться. Тот же корень в DOTKNĄĆ «коснуться»."
memory: "Dotyk — прикосновение и осязание. Читается «до́тык». Ekran dotykowy — сенсорный экран. Miękki w dotyku — мягкий на ощупь. От dotykać — трогать, как русское «тыкать»."
idioms:
  - { pl: "miękki w dotyku", ru: "мягкий на ощупь" }
  - { pl: "zmysł dotyku", ru: "осязание" }
