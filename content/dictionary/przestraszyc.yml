# review
id: przestraszyc
format: 2
lemma: "przestraszyć"
rank: 1821
pos: verb
aspect: perf
pron: { cyr: "пшэстра́шыць" }
senses:
  - id: frighten
    ru: "испугать, напугать"
    examples:
      - pl: "Nie chciałem cię przestraszyć."
        ru: "Я не хотел тебя пугать."
        source: { kind: tatoeba, id: 3416027 }
      - pl: "Kot mnie przestraszył."
        ru: "Кот меня напугал."
        source: { kind: translated, id: 6602614 }
      - pl: "Przestraszyłeś mnie!"
        ru: "Ты меня напугал!"
        source: { kind: translated, id: 3416018 }
  - id: get-scared
    ru: "przestraszyć się — испугаться"
    examples:
      - pl: "Przestraszył się pająka."
        ru: "Он испугался паука."
        source: { kind: tatoeba, id: 6156009 }
      - pl: "Przestraszyłem się."
        ru: "Я испугался."
        source: { kind: translated, id: 7886553 }
      - pl: "Przestraszyła się na widok trupa."
        ru: "Она испугалась при виде трупа."
        source: { kind: translated, id: 12182486 }
notes:
  - { kind: usage, text: "Совершенный вид; несовершенный — straszyć «пугать». Возвратное przestraszyć się значит «испугаться»." }
  - { kind: government, text: "Испугаться чего-то — przestraszyć się czegoś (родительный падеж): przestraszył się pająka «он испугался паука»." }
  - { kind: usage, text: "Причастие przestraszony значит «испуганный»: byłem bardzo przestraszony «я был очень напуган»." }
  - { kind: usage, text: "Przestraszyłeś mnie na śmierć — «ты напугал меня до смерти», выражение совпадает с русским." }
collocations:
  - { pl: "przestraszyć się czegoś", ru: "испугаться чего-либо" }
  - { pl: "przestraszyć kogoś", ru: "напугать кого-либо" }
  - { pl: "na śmierć przestraszony", ru: "напуганный до смерти" }
family:
  - { pl: "straszyć", ru: "пугать", relation: root }
  - { pl: "strach", ru: "страх", relation: root, id: strach }
  - { pl: "bać się", ru: "бояться", relation: root, id: bac }
etymology: "Приставка prze- плюс straszyć «пугать», от strach «страх» — то же слово, что русское «страх». Совпадает и корень, и значение."
memory: "przestraszyć — «напугать»; возвратное przestraszyć się — «испугаться», с родительным падежом: przestraszył się pająka. Причастие przestraszony «испуганный»."
idioms:
  - { pl: "przestraszyć się czegoś", ru: "испугаться чего-либо" }
  - { pl: "przestraszyć na śmierć", ru: "напугать до смерти" }
  - { pl: "byłem przestraszony", ru: "я был напуган" }
formExamplesSkip:
  - { form: "przestraszenia", reason: "формы отглагольного существительного przestraszenie «испуг», в статье глагола примеры не приводятся" }
