formExamples:
  - form: "przestraszeni"
    pl: "Są przestraszeni."
    ru: "Они испуганы."
    source: { kind: translated, id: 3125565 }
  - form: "przestraszeni"
    pl: "Wszyscy byli przestraszeni."
    ru: "Все были испуганы."
    source: { kind: translated, id: 7891426 }
  - form: "przestraszeni"
    pl: "Jesteśmy tylko przestraszeni."
    ru: "Мы просто испуганы."
    source: { kind: translated, id: 3038414 }
  - form: "przestraszona"
    pl: "Ona powiedziała wszystkim, że była przestraszona."
    ru: "Она сказала всем, что была напугана."
    source: { kind: translated, id: 13627000 }
  - form: "przestraszona"
    pl: "Kyoko, przestraszona hukiem gromu, przywarła do mnie."
    ru: "Кёко, напуганная раскатом грома, прижалась ко мне."
    source: { kind: translated, id: 358914 }
  - form: "przestraszona"
    pl: "Początkowo zdawała się być przestraszona, ale tylko przez chwilę."
    ru: "Сначала она казалась напуганной, но лишь на мгновение."
    source: { kind: translated, id: 3718066 }
  - form: "przestraszonego"
    pl: "Nikt nie wygląda na przestraszonego."
    ru: "Никто не выглядит испуганным."
    source: { kind: translated, id: 10168042 }
  - form: "przestraszonego"
    pl: "Nigdy nie widziałem cię tak przestraszonego."
    ru: "Я никогда не видел тебя таким испуганным."
    source: { kind: translated, id: 13337050 }
