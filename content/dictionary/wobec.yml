# review
id: wobec
format: 2
lemma: "wobec"
rank: 1385
pos: prep
pron: { cyr: "во́бэц" }
senses:
  - id: towards
    ru: "по отношению к, с (о поведении с людьми)"
    examples:
      - pl: "Jest wobec mnie bardzo chłodna."
        ru: "Она ко мне весьма холодна."
        source: { kind: tatoeba, id: 364290 }
      - pl: "Bądź grzeczny wobec starszych."
        ru: "Будь вежлив со старшими."
        source: { kind: translated, id: 760266 }
      - pl: "Nasz nauczyciel nie zawsze jest wobec nas przyjazny."
        ru: "Наш учитель не всегда дружелюбен к нам."
        source: { kind: tatoeba, id: 1002574 }
  - id: facing
    ru: "перед, в обличье (закона, трудностей)"
    examples:
      - pl: "Jesteśmy równi wobec prawa."
        ru: "Мы равны перед законом."
        source: { kind: translated, id: 982439 }
      - pl: "Stanęliśmy wobec trudnej sytuacji."
        ru: "Мы оказались перед трудной ситуацией."
        source: { kind: translated, id: 728640 }
      - pl: "Był wobec mnie nadzwyczaj uprzejmy."
        ru: "Он был со мной чрезвычайно любезен."
        source: { kind: translated, id: 357647 }
notes:
  - { kind: government, text: "Предлог требует родительного падежа: wobec prawa «перед законом», wobec mnie «по отношению ко мне»." }
  - { kind: usage, text: "Главное значение — отношение к человеку: być grzecznym wobec kogoś «быть вежливым с кем-то». Русский тут ставит «с» или «по отношению к»." }
  - { kind: usage, text: "Второе значение — «перед лицом»: stanąć wobec trudnej sytuacji «оказаться перед трудной ситуацией», równi wobec prawa «равны перед законом»." }
  - { kind: usage, text: "Wobec tego значит «в связи с этим, поэтому» — готовый связующий оборот." }
collocations:
  - { pl: "wobec prawa", ru: "перед законом" }
  - { pl: "wobec mnie", ru: "по отношению ко мне" }
  - { pl: "wobec tego", ru: "поэтому" }
etymology: "Из w и obec «общность», ср. чешское obec «община»: буквально «в виду всех». Русское «вообще» — от того же корня «общий»."
memory: "wobec — «по отношению к» и «перед»: być grzecznym wobec starszych «быть вежливым со старшими», równi wobec prawa «равны перед законом». Требует родительного падежа. И wobec tego значит «поэтому»."
idioms:
  - { pl: "wobec prawa", ru: "перед законом" }
  - { pl: "wobec tego", ru: "поэтому" }
  - { pl: "wobec wszystkich", ru: "при всех" }
