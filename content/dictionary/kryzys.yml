family:
  - { pl: "kryzysowy", ru: "кризисный", relation: derived }
  - { pl: "krytyczny", ru: "критический", relation: root }
  - { pl: "krytyka", ru: "критика", relation: root }
etymology: "Из греческого krísis «перелом, решение», от krínō «различаю, сужу», через латынь и немецкий. Русское «кризис» пришло тем же путём, но сохранило латинское -ис, а польский переделал окончание на своё -ys. От того же греческого корня выросли «критика», «критерий» и «критический» — все они про умение различать и судить."
memory: "Два y, а не два и: KRYZYS, «кры́зыс». Родительный на -u: wyjść z kryzysu."
idioms:
