notes:
  - { kind: pronunciation, text: "Пишется с двумя y — KRYZYS, а не «kryzis», и обе буквы читаются как русское «ы»: «кры́зыс». Русское «кризис» с двумя и подталкивает к ошибке в обоих слогах сразу. В предложном появляется мягкость: w KRYZYSIE, где si звучит как «сь»." }
  - { kind: usage, text: "Родительный — KRYZYSU, с окончанием -u: przyczyny kryzysu, wyjść z kryzysu. Это уже знакомый выбор неодушевлённых мужских с отвлечённым значением, рядом с zysk — zysku и teatr — teatru. Счётное -a здесь было бы ошибкой." }
