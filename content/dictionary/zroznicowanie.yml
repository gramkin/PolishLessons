  - { kind: government, text: "То, что различается, стоит в родительном: ZRÓŻNICOWANIE CEN «разброс цен», ZRÓŻNICOWANIE PŁAC «неравенство зарплат». Признак — через POD WZGLĘDEM: ZRÓŻNICOWANIE POD WZGLĘDEM WIEKU «различия по возрасту»." }
  - { kind: usage, text: "Средний род на -ANIE. Форма ZRÓŻNICOWANIA — родительный единственного; множественное встречается только в научных текстах и здесь не учится." }
