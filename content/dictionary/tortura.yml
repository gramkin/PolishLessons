# review
id: tortura
format: 2
lemma: "tortura"
rank: 3754
pos: noun
pron: { cyr: "торту́ра" }
senses:
  - id: torture
    ru: "пытка (чаще мн.: TORTURY)"
    examples:
      - pl: "Więźniów poddawano torturom."
        ru: "Заключённых подвергали пыткам."
        source: { kind: authored }
      - pl: "Zeznanie wymuszono torturami."
        ru: "Признание выбили пытками."
        source: { kind: authored }
      - pl: "Konwencja zakazuje tortur."
        ru: "Конвенция запрещает пытки."
        source: { kind: authored }
  - id: ordeal
    ru: "мучение, пытка (перен.)"
    examples:
      - pl: "Ten film to prawdziwa tortura."
        ru: "Этот фильм — настоящая пытка."
        source: { kind: authored }
      - pl: "Czekanie na wyniki było torturą."
        ru: "Ожидание результатов было мучением."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "TORTURA — «пытка»; с тортом, TORT, слово не связано. Обычно во множественном: TORTURY, как русское «пытки». Пытать — TORTUROWAĆ. В переносном смысле — «мучение»: TO BYŁA TORTURA." }
  - { kind: usage, text: "Женский род. Множественное TORTURY — основная форма: STOSOWAĆ TORTURY, «применять пытки». Единственное чаще в переносном смысле. Звательный TORTURO не употребляется." }
  - { kind: government, text: "Подвергать пыткам — PODDAWAĆ TORTUROM, дательный. Под пытками — POD TORTURAMI, творительный: PRZYZNAŁ SIĘ POD TORTURAMI." }
  - { kind: pronunciation, text: "Читается «торту́ра», ударение на предпоследнем слоге. U — «у», два R раскатистые." }
collocations:
  - { pl: "stosować tortury", ru: "применять пытки" }
  - { pl: "pod torturami", ru: "под пытками" }
  - { pl: "zakaz tortur", ru: "запрет пыток" }
family:
  - { pl: "torturować", ru: "пытать", relation: derived }
  - { pl: "męczyć", ru: "мучить", relation: root, id: meczyc }
  - { pl: "narzędzia tortur", ru: "орудия пыток", relation: derived }
etymology: "Из латинского TORTURA «скручивание, мука», от TORQUERE «крутить». Тот же корень в слове «торсион» и английском TORTURE."
memory: "Tortura — пытка; обычно tortury — пытки. Pod torturami — под пытками. Torturować — пытать. Читается «торту́ра»."
idioms:
  - { pl: "to istna tortura", ru: "это сущая пытка" }
formExamplesSkip:
  - { form: "torturo", reason: "звательный от названия действия не употребляется" }
