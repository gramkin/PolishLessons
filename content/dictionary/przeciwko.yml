# review
id: przeciwko
format: 2
lemma: "przeciwko"
rank: 538
pos: prep
pron: { cyr: "пшэци́фко" }
senses:
  - id: against
    ru: "против (кого-чего)"
    examples:
      - pl: "Ludność zbuntowała się przeciwko królowi."
        ru: "Народ восстал против короля."
        source: { kind: tatoeba, id: 365564 }
      - pl: "Jeżeli Bóg z nami, któż przeciwko nam?"
        ru: "Если Бог с нами, кто против нас?"
        source: { kind: tatoeba, id: 2244550 }
      - pl: "Wszystko, co pan powie, może być użyte przeciwko panu."
        ru: "Всё, что вы скажете, может быть использовано против вас."
        source: { kind: tatoeba, id: 1518053 }
  - id: no-objection
    ru: "в обороте nie mieć nic przeciwko — «не иметь ничего против»"
    examples:
      - pl: "Nie mam nic przeciwko wstawaniu o szóstej."
        ru: "Я не против того, чтобы вставать в шесть."
        source: { kind: tatoeba, id: 526053 }
      - pl: "Nie ma pan nic przeciwko, jeśli pójdę?"
        ru: "Вы не против, если я пойду?"
        source: { kind: tatoeba, id: 12470563 }
      - pl: "Nie mam przeciwko wam nic zgoła, mój przyjacielu."
        ru: "Я совершенно ничего не имею против вас, друг мой."
        source: { kind: authored }
notes:
  - { kind: government, text: "Главная ловушка — падеж: польское przeciwko требует дательного, а русское «против» — родительного. przeciwko wam «против вас», przeciwko królowi «против короля»." }
  - { kind: usage, text: "Nie mam nic przeciwko — готовая формула вежливого согласия: «Я не против»." }
  - { kind: usage, text: "przeciw и przeciwko — варианты одного предлога; в живой речи чаще przeciwko, в книжной и юридической — przeciw." }
  - { kind: usage, text: "В юридическом языке: sprawa przeciwko komuś «дело против кого-то»." }
collocations:
  - { pl: "nie mam nic przeciwko", ru: "я не против" }
  - { pl: "przeciwko komuś", ru: "против кого-то" }
  - { pl: "wystąpić przeciwko", ru: "выступить против" }
etymology: "Из przeciw с суффиксом -ko, праславянское *protivъ. Русское «против» — то же самое слово."
memory: "przeciwko — «против», то же слово, что русское «против». Но падеж другой: польский предлог требует дательного — przeciwko wam «против вас», przeciwko królowi «против короля», тогда как русское «против» требует родительного. И запомните формулу Nie mam nic przeciwko «Я не против»."
idioms:
  - { pl: "nie mam nic przeciwko", ru: "я не против" }
  - { pl: "wystąpić przeciwko komuś", ru: "выступить против кого-то" }
  - { pl: "kto nie z nami, ten przeciwko nam", ru: "кто не с нами, тот против нас" }
