# review
id: telewizja
format: 2
lemma: "telewizja"
rank: 1287
pos: noun
pron: { cyr: "телеви́зья" }
senses:
  - id: watch-tv
    ru: "oglądać telewizję — смотреть телевизор"
    examples:
      - pl: "Oglądam telewizję."
        ru: "Я смотрю телевизор."
        source: { kind: tatoeba, id: 548231 }
      - pl: "On ogląda telewizję."
        ru: "Он смотрит телевизор."
        source: { kind: tatoeba, id: 529674 }
      - pl: "Cały dzień oglądał telewizję."
        ru: "Он целый день смотрел телевизор."
        source: { kind: tatoeba, id: 356043 }
  - id: medium
    ru: "телевидение как средство"
    examples:
      - pl: "Telewizja osłabia kreatywność."
        ru: "Телевидение ослабляет творческие способности."
        source: { kind: translated, id: 367752 }
      - pl: "Telewizja ma wielki wpływ na społeczeństwo."
        ru: "Телевидение сильно влияет на общество."
        source: { kind: translated, id: 352465 }
      - pl: "Wynalazek telewizji poważnie zmienił nasze życie codzienne."
        ru: "Изобретение телевидения значительно изменило нашу повседневную жизнь."
        source: { kind: tatoeba, id: 361903 }
  - id: channel
    ru: "телекомпания, телеканал"
    examples:
      - pl: "Gazety i telewizje na całym świecie mówiły o Koko i jej kotku."
        ru: "Газеты и телекомпании всего мира говорили о Коко и её котёнке."
        source: { kind: translated, id: 731984 }
      - pl: "Prywatna telewizja nadała ten program."
        ru: "Частный телеканал показал эту передачу."
        source: { kind: authored }
      - pl: "Pracuje w telewizji publicznej."
        ru: "Он работает на общественном телевидении."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Форма telewizyj — устаревший родительный множественного; современная норма telewizji, поэтому telewizyj оставлена без примеров. То же чередование у слов на -ja: stacja — stacji, реже stacyj." }
  - { kind: false-friend, text: "Важное различие: telewizja — «телевидение», а телевизор как прибор — telewizor. Oglądam telewizję значит «смотрю телевизор» в смысле «смотрю телепередачи»." }
  - { kind: government, text: "oglądać telewizję — винительный падеж. Но «по телевизору» будет w telewizji, предложный: Widziałem to w telewizji «Я видел это по телевизору»." }
  - { kind: usage, text: "Глагол для просмотра — oglądać, а не patrzeć: oglądać telewizję, oglądać film." }
  - { kind: pronunciation, text: "Конечное -ja звучит как «-ья»: телеви́зья. Ударение на предпоследний слог." }
collocations:
  - { pl: "oglądać telewizję", ru: "смотреть телевизор" }
  - { pl: "w telewizji", ru: "по телевизору" }
  - { pl: "telewizja publiczna", ru: "общественное телевидение" }
etymology: "Греческое τῆλε «далеко» и латинское visio «видение» — слово собрано из тех же двух частей, что и русское «телевидение», только вторая часть осталась непереведённой."
memory: "telewizja — «телевидение», а прибор — telewizor: не перепутайте. Смотрят его глаголом oglądać: Oglądam telewizję. А «по телевизору» будет w telewizji: Widziałem to w telewizji."
idioms:
  - { pl: "oglądać telewizję", ru: "смотреть телевизор" }
  - { pl: "w telewizji", ru: "по телевизору" }
  - { pl: "telewizja publiczna", ru: "общественное телевидение" }
formExamplesSkip:
  - { form: "telewizyj", reason: "устаревший родительный падеж множественного числа; современная норма — telewizji" }
  - { form: "telewizjo", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
