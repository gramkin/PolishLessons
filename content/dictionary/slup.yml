id: slup
format: 2
lemma: "słup"
rank: 5451
pos: noun
pron: { cyr: "суп" }
senses:
  - id: pole
    ru: "столб, опора"
    examples:
      - pl: "Motor uderzył w słup telefoniczny."
        ru: "Мотоцикл врезался в телефонный столб."
        source: { kind: translated, id: 351534 }
      - pl: "Przez nieuwagę uderzyłem w słup telegraficzny."
        ru: "По невнимательности я врезался в телеграфный столб."
        source: { kind: translated, id: 904028 }
      - pl: "Potężny słup psuje mi widok na jezioro."
        ru: "Огромный столб портит мне вид на озеро."
        source: { kind: translated, id: 365101 }
  - id: column
    ru: "столб (дыма, воды), колонна"
    examples:
      - pl: "Nad domem uniósł się słup dymu."
        ru: "Над домом поднялся столб дыма."
        source: { kind: authored }
      - pl: "Stał jak słup soli."
        ru: "Он стоял как соляной столб."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Осторожно с произношением: słup звучит как «суп», потому что ł читается как у. Но к супу отношения нет — суп по-польски zupa." }
  - { kind: government, text: "Мужской неодушевлённый; родительный — słupa." }
  - { kind: usage, text: "И столб как предмет (słup telefoniczny), и столб как форма: słup dymu «столб дыма», słup wody «столб воды»." }
  - { kind: usage, text: "Родственное słupek значит «столбик», в том числе в таблицах и в футболе — «штанга»." }
collocations:
  - { pl: "słup telefoniczny", ru: "телефонный столб" }
  - { pl: "słup dymu", ru: "столб дыма" }
etymology: "Праславянское *stъlpъ; ср. русское «столб», «столп»."
memory: "słup — «столб», и читается как «суп» (ł = у), хотя суп по-польски zupa. Отсюда słup dymu «столб дыма» и słupek «столбик»."
idioms:
  - { pl: "słup dymu", ru: "столб дыма" }
  - { pl: "stać jak słup soli", ru: "стоять как соляной столб" }
