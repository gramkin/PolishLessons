etymology: "От wojna, из праславянского *vojьna — того же слова, что русская «война», от корня *voj- «воин, борьба». Тот же корень дал wojsko «войско», wojownik «воин» и wojak. Суффикс -enny образует относительные прилагательные, как в codzienny «ежедневный» и promienny «лучистый»."
memory: "wojenny — «военный», но только о ВОЙНЕ: stan wojenny, jeniec wojenny. Если речь об АРМИИ, нужно другое слово: mundur wojskowy, służba wojskowa. Русский обходится одним прилагательным, польский требует выбрать."
