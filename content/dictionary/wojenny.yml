notes:
  - { kind: false-friend, text: "ОДНО РУССКОЕ «ВОЕННЫЙ» — ДВА ПОЛЬСКИХ СЛОВА. Wojenny относится к ВОЙНЕ: czas wojenny, stan wojenny, jeniec wojenny, zniszczenia wojenne. Wojskowy относится к АРМИИ: służba wojskowa, mundur wojskowy, lekarz wojskowy, akademia wojskowa. Русский не различает их вовсе, поэтому ошибка почти неизбежна: «военная форма» это mundur WOJSKOWY, а не wojenny." }
  - { kind: usage, text: "Stan wojenny в Польше — не просто термин: так называют период, начавшийся тринадцатого декабря тысяча девятьсот восемьдесят первого года. Произнесённое без пояснений, это сочетание значит именно его. Соседнее stan wyjątkowy — «чрезвычайное положение», вещь другая и более слабая." }
  - { kind: pronunciation, text: "Три слога, ударение на предпоследнем: wo-JEN-ny. Польское je звучит как русское «е» после гласного, а двойное nn произносится долго: «воє́нны» с протяжным н. В женском роде ударение там же: wo-JEN-na." }
  - { kind: register, text: "Степеней сравнения у слова нет: оно относительное, как szkolny или kosmiczny, — война либо имеет к делу отношение, либо нет. Отсюда и всего одиннадцать форм вместо тридцати трёх, как у odważny." }
