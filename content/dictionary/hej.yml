# review
id: hej
format: 2
lemma: "hej"
rank: 126
pos: interj
pron: { cyr: "хэй" }
senses:
  - id: greeting
    ru: "привет (неформальное приветствие)"
    examples:
      - pl: "Hej!"
        ru: "Привет!"
        source: { kind: translated, id: 8607326 }
      - pl: "Hej, jak się masz?"
        ru: "Привет, как дела?"
        source: { kind: authored }
      - pl: "Hej, dawno się nie widzieliśmy!"
        ru: "Привет, давно не виделись!"
        source: { kind: authored }
  - id: hailing
    ru: "эй (оклик, привлечение внимания)"
    examples:
      - pl: "Hej, poczekaj na mnie!"
        ru: "Эй, подожди меня!"
        source: { kind: authored }
      - pl: "Hej, ty tam!"
        ru: "Эй, ты там!"
        source: { kind: authored }
      - pl: "Hej, uważaj!"
        ru: "Эй, осторожно!"
        source: { kind: authored }
notes:
  - { kind: register, text: "hej — приветствие между ровесниками и друзьями. Старшему или незнакомому говорят dzień dobry; hej прозвучит панибратски." }
  - { kind: usage, text: "То же слово служит окликом «эй»: Hej, poczekaj! Различает только интонация и ситуация." }
collocations:
  - { pl: "hej, ludzie!", ru: "эй, народ!" }
  - { pl: "hej, ty!", ru: "эй, ты!" }
  - { pl: "no hej", ru: "ну привет" }
etymology: "Междометие звукоподражательного происхождения, как русское «эй»; в польском известно с древнейших текстов и встречается в народных песнях (hej, ho!)."
memory: "hej — неформальное «привет» между ровесниками; старшим и незнакомым говорят dzień dobry. Второе применение — оклик «эй»: Hej, poczekaj!"
idioms:
  - { pl: "hej, ho!", ru: "эге-гей!" }
  - { pl: "hej, ty tam!", ru: "эй, ты там!" }
  - { pl: "no to hej!", ru: "ну, пока!" }
formExamples:
