    pl: "Żelazo jest najpowszechniej używanym metalem."
    ru: "Железо — самый широко используемый металл."
    source: { kind: translated, id: 6098613 }
  - form: "najpowszechniej"
    pl: "To najpowszechniej stosowana metoda."
    ru: "Это наиболее широко применяемый метод."
    source: { kind: authored }
  - form: "najpowszechniej"
    pl: "Najpowszechniej spotyka się ten typ."
    ru: "Чаще всего встречается именно этот тип."
    source: { kind: authored }
  - form: "powszechnie"
    pl: "To powszechnie szanowany uczony."
    ru: "Он ученый, которого все уважают."
    source: { kind: tatoeba, id: 351390 }
  - form: "powszechnie"
    pl: "Ona jest powszechnie szanowana."
    ru: "Она пользуется всеобщим уважением."
    source: { kind: translated, id: 440343 }
  - form: "powszechnie"
    pl: "On jest powszechnie lubiany."
    ru: "Его все любят."
    source: { kind: translated, id: 12960007 }
  - form: "powszechniej"
    pl: "Ten zwyczaj przyjmuje się coraz powszechniej."
    ru: "Этот обычай принимается всё шире."
    source: { kind: authored }
  - form: "powszechniej"
    pl: "Nowe słowo brzmi powszechniej niż dawne."
    ru: "Новое слово звучит чаще прежнего."
