# review
id: powszechnie
format: 2
lemma: "powszechnie"
rank: 5407
pos: adv
pron: { cyr: "повшэ́хне" }
senses:
  - id: commonly
    ru: "повсеместно, всеми, широко"
    examples:
      - pl: "To powszechnie szanowany uczony."
        ru: "Он ученый, которого все уважают."
        source: { kind: tatoeba, id: 351390 }
      - pl: "Ona jest powszechnie szanowana."
        ru: "Она пользуется всеобщим уважением."
        source: { kind: translated, id: 440343 }
      - pl: "On jest powszechnie lubiany."
        ru: "Его все любят."
        source: { kind: translated, id: 12960007 }
  - id: generally
    ru: "общепринято, принято (в безличном обороте)"
    examples:
      - pl: "Ten zwyczaj jest powszechnie znany."
        ru: "Этот обычай широко известен."
        source: { kind: authored }
      - pl: "Powszechnie uważa się, że to prawda."
        ru: "Принято считать, что это правда."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Наречие от powszechny «всеобщий, повсеместный»." }
  - { kind: usage, text: "Очень частый безличный оборот: powszechnie się uważa / powszechnie uważa się, że… «принято считать, что…»." }
  - { kind: false-friend, text: "Не «поверхностно» и не «повседневно». Корень wszech- — это «все-», как в powszechny «всеобщий»." }
collocations:
  - { pl: "powszechnie znany", ru: "общеизвестный" }
  - { pl: "powszechnie uważa się", ru: "принято считать" }
etymology: "От powszechny «всеобщий», из po + wszech- «все-» (ср. wszystko «всё»). Русское «всеобщий» собрано из тех же частей."
memory: "powszechnie = «повсеместно, всеми». Корень wszech- = русское «все-»: powszechnie znany «общеизвестный», powszechnie uważa się «принято считать»."
idioms:
  - { pl: "powszechnie znany", ru: "общеизвестный" }
  - { pl: "powszechnie uważa się", ru: "принято считать" }
formExamples:
