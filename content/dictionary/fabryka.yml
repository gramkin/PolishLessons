# review
id: fabryka
format: 2
lemma: "fabryka"
rank: 2124
pos: noun
pron: { cyr: "фабры́ка" }
senses:
  - id: factory
    ru: "фабрика, завод"
    examples:
      - pl: "Fabryka produkuje części do samochodów."
        ru: "Завод производит автомобильные детали."
        source: { kind: authored }
      - pl: "Pracował w fabryce całe życie."
        ru: "Он проработал на заводе всю жизнь."
        source: { kind: authored }
      - pl: "Zamknięcie fabryki zostawiło miasto bez pracy."
        ru: "Закрытие завода оставило город без работы."
        source: { kind: authored }
  - id: figurative
    ru: "фабрика в переносном смысле"
    examples:
      - pl: "Hollywood nazywają fabryką snów."
        ru: "Голливуд называют фабрикой грёз."
        source: { kind: authored }
      - pl: "Ta uczelnia to fabryka dyplomów."
        ru: "Этот вуз — фабрика дипломов."
        source: { kind: authored }
notes:
  - { kind: pronunciation, text: "ГЛАВНАЯ ТРУДНОСТЬ ЗДЕСЬ — ПРЕДЛОЖНЫЙ ПАДЕЖ. k переходит в c: fabryka, но w fabryce, «в фабры́цэ». Это общее польское правило для заднеязычных: ręka даёт w ręce, matka — matce, Polska — w Polsce. В русском ничего подобного нет, там «на фабрике» с тем же к, поэтому форму fabryce приходится запоминать отдельно." }
  - { kind: false-friend, text: "Слово общее и значение совпадает — расходится только разметка. Русский делит предприятия на «завод» и «фабрику» по тяжести производства, а польский обходится одним fabryka и для того, и для другого: fabryka samochodów это автозавод, fabryka mebli — мебельная фабрика. Для отдельных случаев есть zakład «предприятие, цех» и huta «металлургический завод»." }
  - { kind: usage, text: "Родительный множественного — голая основа fabryk, без окончания, как reklam и wież. Прилагательное fabryczny покрывает и «фабричный», и «заводской»: hala fabryczna, osiedle fabryczne. А глагол fabrykować, как и русское «фабриковать», чаще всего значит «подделывать»: fabrykować dowody." }
collocations:
  - { pl: "pracować w fabryce", ru: "работать на заводе" }
  - { pl: "fabryka samochodów", ru: "автомобильный завод" }
  - { pl: "zamknąć fabrykę", ru: "закрыть завод" }
family:
  - { pl: "fabryczny", ru: "фабричный, заводской", relation: derived }
  - { pl: "fabrykant", ru: "фабрикант", relation: derived }
  - { pl: "fabrykować", ru: "фабриковать, подделывать", relation: derived }
etymology: "Из латинского fabrica «мастерская», от faber «мастер, кузнец». В русский слово пришло тем же путём и в ту же эпоху, через немецкий и польский, поэтому «фабрика» и fabryka совпадают полностью. Отсюда fabryczny, fabrykant и fabrykować."
memory: "fabryka — это и «фабрика», и «завод»: польский их не различает. Учить надо не значение, а предложный падеж: w fabryce, с переходом k в c — ровно как ręka даёт w ręce, а Polska даёт w Polsce."
idioms:
  - { pl: "fabryka snów", ru: "фабрика грёз" }
  - { pl: "prosto z fabryki", ru: "прямо с завода, совсем новое" }
