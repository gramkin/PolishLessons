etymology: "Из латинского PASTOR «пастух», от PASCERE «пасти, кормить» — того же корня, что PASZA «корм» и русское «пасти», «пастбище». Церковное значение выросло из евангельского образа пастыря и стада, и в протестантских церквах оно закрепилось как название должности. Самое интересное здесь — двойное заимствование: то же латинское слово дало польскому PASTERZ «пастух», но через народную латынь и с обычным развитием согласной, а PASTOR пришёл позже и книжным путём, сохранив латинский вид. Русский получил из этого гнезда три слова: «пастух» своё, «пастырь» из церковнославянского и «пастор» из западных языков, и все три восходят к одному корню. Такое расслоение одного слова по путям заимствования встречается часто, но редко так наглядно."
memory: "Протестантский духовный; католический священник — ksiądz. Два именительных множественного, и оба правильные: pastorowie уважительнее, pastorzy обычнее, как ambasadorowie и ambasadorzy. Местный pastorze с r→rz. Pastor и pasterz «пастух» — одно латинское pastor, пришедшее дважды, книжным и бытовым путём; в русском этому отвечают «пастор», «пастырь» и «пастух»."
