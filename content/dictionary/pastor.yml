notes:
  - { kind: government, text: "Мужской род, одушевлённое, лицо. Винительный равен родительному: WIDZIELI PASTORA. Местный и звательный совпадают в форме PASTORZE, с чередованием R в RZ. Именительных множественного два, и оба нормативны: PASTOROWIE на -OWIE, более уважительная форма церковного языка, и PASTORZY с чередованием R в RZ, обычная в газетной речи. Это тот же выбор, что у AMBASADOROWIE и AMBASADORZY, и вообще у названий должностей на -OR. Чьим пастором — родительный без предлога: PASTOR TEJ PARAFII. Стать кем-то — ZOSTAĆ с творительным: ZOSTAŁ PASTOREM." }
  - { kind: false-friend, text: "Значение совпадает с русским «пастором» точно: это протестантский духовный, и католического священника так не называют — по-польски KSIĄDZ. Любопытнее родство. Латинское PASTOR значит «пастух», от PASCERE «пасти, кормить», и от этого же слова польский получил PASTERZ «пастух» — но другим путём, через народную латынь и с обычным славянским развитием. Поэтому PASTOR и PASTERZ в польском это одно латинское слово, пришедшее дважды: учёным путём в церковном значении и бытовым в значении пастуха. Русский проделал то же с «пастором», «пастырем» и «пастухом», и связь между ними такая же." }
  - { kind: pronunciation, text: "Читается «па́стор», ударение на предпоследнем слоге из двух. Сочетание ST твёрдое. Конечное R звучит ясно, без оглушения. В местном и звательном PASTORZE сочетание RZ даёт «ж»: «пасто́же», и ударение переходит на предпоследний слог, который теперь второй. В именительном множественного PASTORZY слышно «пасто́жы», а в PASTOROWIE — «пасторо́ве», четыре слога, ударение снова на предпоследнем." }
  - { kind: usage, text: "Частотные сочетания: PASTOR PARAFII, PASTOR LUTERAŃSKI, ŻONA PASTORA «жена пастора», ZOSTAĆ PASTOREM, PASTOR WYGŁOSIŁ KAZANIE. Женская форма PASTORKA существует и означает женщину-пастора в тех церквах, где это возможно; в старых текстах PASTORKA значило «жена пастора», и это различие стоит знать при чтении. Прилагательное PASTORSKI означает «пасторский». Не путать с PASTERSKI «пастушеский» и с LIST PASTERSKI «пастырское послание», где в польском стоит именно PASTERSKI, от PASTERZ." }
