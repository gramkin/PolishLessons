# review
id: przekasic
format: 2
lemma: "przekąsić"
rank: 5956
pos: verb
aspect: perf
pron: { cyr: "пшэко́у̃сиць" }
senses:
  - id: snack
    ru: "перекусить, наскоро поесть"
    examples:
      - pl: "Chcę tylko coś przekąsić."
        ru: "Я хочу только чего-нибудь перекусить."
        source: { kind: translated, id: 5585060 }
      - pl: "Przekąsiliśmy kanapki w pociągu."
        ru: "Мы перекусили бутербродами в поезде."
        source: { kind: authored }
      - pl: "Przekąś coś przed wyjściem."
        ru: "Перекуси чем-нибудь перед выходом."
        source: { kind: authored }
      - pl: "Masz coś do przekąszenia?"
        ru: "У тебя есть что-нибудь перекусить?"
        source: { kind: authored }
      - pl: "W przerwie przekąszę jabłko."
        ru: "В перерыве я съем яблоко."
        source: { kind: authored }
notes:
  - { kind: government, text: "Что съесть — винительный падеж: PRZEKĄSIĆ KANAPKĘ, PRZEKĄSIĆ COŚ. По-русски «перекусить чем» — творительный, по-польски творительного здесь нет: «перекусить бутербродом» — PRZEKĄSIĆ KANAPKĘ." }
  - { kind: false-friend, text: "Русское «перекусить» значит ещё и «перегрызть, перерезать зубами» (перекусить нитку). Польское PRZEKĄSIĆ — только «наскоро поесть». Перекусить нитку — PRZEGRYŹĆ NITKĘ." }
  - { kind: usage, text: "Совершенный вид; несовершенный PRZEKĄSZAĆ встречается редко. Очень частый оборот COŚ DO PRZEKĄSZENIA «что-нибудь перекусить». Закуска, снек — PRZEKĄSKA. Мужско-личное страдательное PRZEKĄSZENI в карточку не включено: перекусывают едой, а не людьми." }
  - { kind: pronunciation, text: "Читается «пшэко́у̃сиць»: PRZ — «пш», Ą перед S — носовое «оу̃». В будущем S переходит в SZ: PRZEKĄSZĘ — «пшэко́у̃шэ», PRZEKĄSZĄ — «пшэко́у̃шоу̃»; повелительное PRZEKĄŚ — «пшэ́коу̃сь»." }
collocations:
  - { pl: "przekąsić coś", ru: "перекусить чем-нибудь" }
  - { pl: "coś do przekąszenia", ru: "что-нибудь перекусить" }
  - { pl: "przekąsić w biegu", ru: "перекусить на ходу" }
family:
  - { pl: "przekąska", ru: "закуска, снек", relation: derived, id: przekaska }
  - { pl: "kęs", ru: "кусок (откушенный)", relation: root }
  - { pl: "kąsać", ru: "кусать (о животных, насекомых)", relation: root }
  - { pl: "przekąs", ru: "насмешка; z przekąsem — с издёвкой", relation: derived }
etymology: "Приставка PRZE- плюс KĄSIĆ, от того же праславянского корня, что польское KĘS и русские «кус», «кусать»."
memory: "Przekąsić — перекусить: кĄс = «кус». Coś do przekąszenia — что-нибудь перекусить."
idioms:
  - { pl: "coś do przekąszenia", ru: "что-нибудь перекусить, лёгкая закуска" }
formExamplesSkip:
  - { form: "przekąszeni", reason: "мужско-личная форма страдательного причастия: перекусывают едой, а не людьми" }
