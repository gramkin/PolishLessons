# review
id: linia
format: 2
lemma: "linia"
rank: 807
pos: noun
pron: { cyr: "ли́ня" }
senses:
  - id: line
    ru: "линия (геометрическая)"
    examples:
      - pl: "Narysuj linię prostą."
        ru: "Нарисуй прямую линию."
        source: { kind: tatoeba, id: 591798 }
      - pl: "Zróbcie prostą linię!"
        ru: "Сделайте прямую линию!"
        source: { kind: translated, id: 12240072 }
      - pl: "Proszę pisać co drugą linię."
        ru: "Пишите через строчку."
        source: { kind: translated, id: 943631 }
  - id: phone-line
    ru: "Linia jest zajęta — линия занята"
    examples:
      - pl: "Linia jest znowu zajęta."
        ru: "Линия снова занята."
        source: { kind: translated, id: 10874309 }
      - pl: "Linia jest wciąż zajęta."
        ru: "Линия всё ещё занята."
        source: { kind: translated, id: 10874310 }
      - pl: "On dzwoni na drugiej linii."
        ru: "Он звонит по второй линии."
        source: { kind: translated, id: 646799 }
  - id: railway
    ru: "linia kolejowa — железнодорожная линия"
    examples:
      - pl: "Czerwone linie na mapie oznaczają linie kolejowe."
        ru: "Красными линиями на карте показаны железные дороги."
        source: { kind: tatoeba, id: 415287 }
      - pl: "Planują połączyć miasta linią kolejową."
        ru: "Они планируют соединить города железнодорожной линией."
        source: { kind: translated, id: 921571 }
      - pl: "Ta sztuczna góra otoczona jest linią kolejową."
        ru: "Эта искусственная гора окружена железнодорожной линией."
        source: { kind: translated, id: 2250756 }
  - id: figure
    ru: "dbać o linię — следить за фигурой"
    note: "Значения «фигура» у русской «линии» нет."
    examples:
      - pl: "Próbowali przedrzeć się przez linie wroga."
        ru: "Они попытались прорваться через линию фронта."
        source: { kind: tatoeba, id: 914829 }
      - pl: "Poniosłam porażkę na całej linii."
        ru: "Я потерпела поражение по всей линии."
        source: { kind: translated, id: 6534011 }
      - pl: "Dba o linię od lat."
        ru: "Она годами следит за фигурой."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Одно значение не совпадает с русским: dbać o linię значит «следить за фигурой». У русской «линии» такого смысла нет." }
  - { kind: usage, text: "iść po linii najmniejszego oporu — «идти по линии наименьшего сопротивления», переносится дословно. А na całej linii значит «по всей линии», то есть «полностью»: przegrać na całej linii." }
  - { kind: government, text: "w linii prostej «по прямой»; na linii «на линии»; między liniami «между строк»." }
  - { kind: usage, text: "Форма linij — устаревший родительный множественного; сегодня говорят linii." }
collocations:
  - { pl: "linia kolejowa", ru: "железнодорожная линия" }
  - { pl: "na całej linii", ru: "по всей линии" }
  - { pl: "dbać o linię", ru: "следить за фигурой" }
  - { pl: "linia jest zajęta", ru: "линия занята" }
family:
  - { pl: "liniowy", ru: "линейный", relation: derived }
  - { pl: "podkreślić", ru: "подчеркнуть", relation: root }
  - { pl: "kreska", ru: "чёрточка", relation: root }
etymology: "Через немецкое Linie из латинского linea «льняная нить», от linum «лён» — то же заимствование, что русская «линия»."
memory: "linia — «линия», и почти всё совпадает: геометрическая, телефонная (Linia jest zajęta), железнодорожная, линия фронта. Одно значение не совпадает: dbać o linię значит «следить за фигурой». И запомните na całej linii «по всей линии, полностью» — przegrać na całej linii."
idioms:
  - { pl: "na całej linii", ru: "по всей линии" }
  - { pl: "iść po linii najmniejszego oporu", ru: "идти по линии наименьшего сопротивления" }
  - { pl: "dbać o linię", ru: "следить за фигурой" }
formExamplesSkip:
  - { form: "linio", reason: "звательный падеж у неодушевлённого существительного не употребляется" }
  - { form: "linij", reason: "устаревший вариант родительного множественного; современная форма — linii" }
