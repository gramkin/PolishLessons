# review
id: setki
format: 2
lemma: "setki"
rank: 2722
pos: noun
pron: { cyr: "сэ́тки" }
senses:
  - id: hundreds
    ru: "сотни (о множестве)"
    examples:
      - pl: "Ona ma setki książek."
        ru: "У неё сотни книг."
        source: { kind: translated, id: 536528 }
      - pl: "Setki ludzi pracują w tej fabryce."
        ru: "Сотни людей работают на этой фабрике."
        source: { kind: translated, id: 715997 }
      - pl: "Setki cywili były ranne."
        ru: "Сотни гражданских были ранены."
        source: { kind: translated, id: 10599143 }
  - id: hundreds-of
    ru: "сотни (раз, штук, лет)"
    examples:
      - pl: "Widziałem to już setki razy."
        ru: "Я видел это уже сотни раз."
        source: { kind: translated, id: 737290 }
      - pl: "Chciałbym napisać setki zdań na Tatoeba, ale mam inne rzeczy do roboty."
        ru: "Я бы хотел написать сотни фраз на Татоэбе, но у меня есть другие дела."
        source: { kind: translated, id: 357938 }
      - pl: "Przeczytałem już około setki książek."
        ru: "Я прочитал уже около сотни книг."
        source: { kind: translated, id: 1614844 }
notes:
  - { kind: usage, text: "В словаре заглавная форма — единственное число setka «сотня». В частотный список слово попало во множественном числе setki, потому что именно оно живёт в речи как «сотни», и карточка описывает эту форму." }
  - { kind: government, text: "После setki существительное стоит в родительном падеже множественного числа: setki książek «сотни книг», setki ludzi «сотни людей» — точно как в русском." }
  - { kind: usage, text: "Единственное setka значит «сотня», а разговорно ещё и сто граммов водки или скорость сто километров в час." }
  - { kind: false-friend, text: "Не путайте setki «сотни» и setny «сотый»: setki ludzi czekały «сотни людей ждали», но po raz setny «в сотый раз»." }
collocations:
  - { pl: "setki ludzi", ru: "сотни людей" }
  - { pl: "setki razy", ru: "сотни раз" }
  - { pl: "setki lat", ru: "сотни лет" }
family:
  - { pl: "setka", ru: "сотня", relation: root }
  - { pl: "sto", ru: "сто", relation: root, id: sto }
  - { pl: "setny", ru: "сотый", relation: root }
etymology: "От sto «сто» с суффиксом -ka, как русское «сотня» от «сто». Множественное setki отвечает русскому «сотни»."
memory: "setki — «сотни», и управляет так же, как русское: setki ludzi «сотни людей», родительный падеж множественного числа. Единственное число — setka «сотня»."
idioms:
