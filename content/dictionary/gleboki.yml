pron: { cyr: "гуэмбо́ки" }
senses:
  - id: deep
    ru: "глубокий (о воде, яме, ране)"
    examples:
      - pl: "Borsuki wykopują głębokie dziury."
        ru: "Барсуки вырывают глубокие норы."
        source: { kind: tatoeba, id: 5947057 }
      - pl: "To jezioro nie jest głębokie. Jest płytkie."
        ru: "Это озеро не глубокое. Оно мелкое."
        source: { kind: tatoeba, id: 12678784 }
      - pl: "Rzeka jest tu bardzo głęboka."
        ru: "Река здесь очень глубокая."
        source: { kind: authored }
  - id: profound
    ru: "глубокий (о сне, смысле, чувстве)"
    note: "Переносное значение совпадает с русским полностью: głęboki sen, głęboki sens, głęboki szacunek."
    examples:
      - pl: "Zapadł w głęboki sen."
        ru: "Он погрузился в глубокий сон."
        source: { kind: authored }
      - pl: "To ma głębszy sens."
        ru: "В этом есть более глубокий смысл."
        source: { kind: authored }
      - pl: "Czuł do niej głęboki szacunek."
        ru: "Он испытывал к ней глубокое уважение."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Соответствие звуков надёжное: польское ę на месте русского у — głęboki ~ глубокий, dąb ~ дуб, ząb ~ зуб. Узнав его, вы разберёте десятки слов." }
  - { kind: usage, text: "Сравнение отбрасывает -oki и меняет основу: głęboki → głębszy → najgłębszy. Наречие — głęboko, существительное — głębia «глубь, глубина»." }
  - { kind: false-friend, text: "mieć coś w głębokim poważaniu — вовсе не «глубоко уважать», а грубоватое «плевать на что-то». Буквальный разбор здесь обманывает." }
  - { kind: usage, text: "Разговорное głębszy как существительное значит «рюмка водки»: wypić głębszego, kilka głębszych." }
collocations:
  - { pl: "głęboka woda", ru: "глубокая вода" }
  - { pl: "głęboki sen", ru: "глубокий сон" }
  - { pl: "głęboki sens", ru: "глубокий смысл" }
  - { pl: "do głębi", ru: "до глубины души" }
family:
  - { pl: "głębia", ru: "глубь, глубина", relation: derived }
  - { pl: "głęboko", ru: "глубоко", relation: derived }
  - { pl: "pogłębić", ru: "углубить", relation: derived }
etymology: "Праславянское *glǫbokъ — то же слово, что русское «глубокий». Носовой звук дал в польском ę (głęb-), а в русском у (глуб-): та же пара, что dąb ~ дуб и ząb ~ зуб."
memory: "głęboki — «глубокий» и буквально, и переносно: głęboka woda, głęboki sen, głęboki sens. Звуковое соответствие надёжное: польское ę там, где русское у — głęboki ~ глубокий, dąb ~ дуб, ząb ~ зуб. Сравнение теряет -oki: głębszy, najgłębszy. Две ловушки: разговорное głębszy — это «рюмка водки» (wypić głębszego), а mieć coś w głębokim poważaniu значит не «глубоко уважать», а «плевать на это»."
idioms:
  - { pl: "mieć coś w głębokim poważaniu", ru: "плевать на что-то" }
  - { pl: "kilka głębszych", ru: "несколько рюмок" }
  - { pl: "do głębi", ru: "до глубины души" }
formExamplesSkip:
