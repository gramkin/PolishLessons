lemma: "inwazja"
rank: 5050
pos: noun
pron: { cyr: "инва́зья" }
senses:
  - id: invasion
    ru: "вторжение, нашествие"
    examples:
      - pl: "Inwazja wojsk zaczęła się o świcie."
        ru: "Вторжение войск началось на рассвете."
