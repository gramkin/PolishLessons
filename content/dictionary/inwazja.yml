        source: { kind: authored }
  - id: influx
    ru: "нашествие (туристов, насекомых, перен.)"
    examples:
      - pl: "Latem jest inwazja turystów."
        ru: "Летом нашествие туристов."
        source: { kind: authored }
      - pl: "W ogrodzie mamy inwazję ślimaków."
        ru: "В саду у нас нашествие улиток."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "INWAZJA — «вторжение»; русская «инвазия» — только медицинский термин. Шутливо — «нашествие»: INWAZJA TURYSTÓW, INWAZJA KOMARÓW. Захватчик — NAJEŹDŹCA." }
  - { kind: usage, text: "Женский род. Родительный, дательный и местный — INWAZJI. Множественное — INWAZJE. Звательный и архаичное INWAZYJ не используем." }
  - { kind: government, text: "Вторжение во что — INWAZJA NA и винительный: INWAZJA NA POLSKĘ. Нашествие кого — родительный: INWAZJA TURYSTÓW. После вторжения — PO INWAZJI." }
  - { kind: pronunciation, text: "Читается «инва́зья»: W — «в», ZJA — «зья». Ударение на предпоследнем слоге." }
collocations:
  - { pl: "inwazja wojskowa", ru: "военное вторжение" }
  - { pl: "inwazja na kraj", ru: "вторжение в страну" }
  - { pl: "inwazja turystów", ru: "нашествие туристов" }
family:
  - { pl: "atak", ru: "нападение", relation: root, id: atak }
  - { pl: "najazd", ru: "набег, нашествие", relation: root }
  - { pl: "okupacja", ru: "оккупация", relation: root }
etymology: "Из латинского INVASIO «нападение», от INVADERE «вторгаться». Русское «инвазия» — медицинский термин того же корня."
memory: "Inwazja — вторжение и нашествие. Inwazja na Polskę — вторжение в Польшу. Inwazja turystów — нашествие туристов. Читается «инва́зья»."
idioms:
  - { pl: "inwazja z kosmosu", ru: "нашествие инопланетян" }
