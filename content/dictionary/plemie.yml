notes:
  - { kind: usage, text: "Средний род на -ę, как imię «имя» и zwierzę «зверь»: в косвенных падежах вставляется -eni-, plemienia, plemieniem, plemieniu. Множественное — plemiona." }
  - { kind: usage, text: "Русское «племя» склоняется точно так же, со вставкой -ен-: «племени, племенем». Совпадение полное." }
  - { kind: usage, text: "Ходовые сочетания: wódz plemienia «вождь племени», dzikie plemię «дикое племя»." }
  - { kind: usage, text: "Второе значение — «род, потомство», книжное и устаревающее." }
collocations:
  - { pl: "wódz plemienia", ru: "вождь племени" }
  - { pl: "dzikie plemię", ru: "дикое племя" }
  - { pl: "członek plemienia", ru: "член племени" }
etymology: "Праславянское *plemę — то же самое слово, что русское «племя», включая тип склонения со вставкой -en- в косвенных падежах."
memory: "plemię — «племя», и склоняется ровно как русское, со вставкой: plemienia, plemieniem — «племени, племенем». Средний род на -ę, как imię «имя» и zwierzę «зверь»."
