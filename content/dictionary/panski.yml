# review
id: panski
format: 2
lemma: "pański"
rank: 444
pos: adj
pron: { cyr: "па́ньски" }
senses:
  - id: your-formal
    ru: "Ваш (вежливое обращение к мужчине)"
    examples:
      - pl: "Lubię pański komputer."
        ru: "Мне нравится Ваш компьютер."
        source: { kind: tatoeba, id: 5932990 }
      - pl: "Miło mi słyszeć pański głos."
        ru: "Рад слышать Ваш голос."
        source: { kind: tatoeba, id: 5907098 }
      - pl: "Czekam na pańską odpowiedź."
        ru: "Я жду вашего ответа."
        source: { kind: tatoeba, id: 4104368 }
  - id: lordly
    ru: "господский, барский"
    examples:
      - pl: "To dawny pański dwór."
        ru: "Это старая господская усадьба."
        source: { kind: authored }
      - pl: "Mieli pańskie zwyczaje."
        ru: "У них были барские замашки."
        source: { kind: authored }
      - pl: "Pańskie oko konia tuczy."
        ru: "Хозяйский глаз коня кормит."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Русский обходится одним «Ваш», польскому нужны два разных слова: к мужчине — pański adres, к женщине — pani adres (здесь pani не склоняется)." }
  - { kind: usage, text: "Вежливость в польском строится в третьем лице: Czy mógłby pan podać pański adres? «Не могли бы Вы дать Ваш адрес?»" }
  - { kind: usage, text: "Старое значение — «господский, барский»: pański dwór «господская усадьба», łaska pańska «барская милость»." }
  - { kind: usage, text: "С заглавной буквы Pański значит «Господень»: krzyż Pański «крест Господень»." }
collocations:
  - { pl: "pański adres", ru: "Ваш адрес" }
  - { pl: "pańska odpowiedź", ru: "Ваш ответ" }
  - { pl: "pańskie zdrowie", ru: "Ваше здоровье" }
  - { pl: "łaska pańska", ru: "барская милость" }
etymology: "Образовано от pan с суффиксом -ski, то есть «принадлежащий господину». Русские «пан» и «панский» заимствованы из польского."
memory: "pański — это «Ваш» при вежливом обращении к мужчине: pański adres «Ваш адрес». К женщине так не говорят: там pani adres, причём pani не склоняется. Русскому хватает одного «Ваш», польскому нужны два разных слова. А в старом значении pański — «господский»: pańskie oko konia tuczy «хозяйский глаз коня кормит»."
idioms:
  - { pl: "pańskie oko konia tuczy", ru: "хозяйский глаз коня кормит" }
  - { pl: "łaska pańska na pstrym koniu jeździ", ru: "барская милость непостоянна" }
  - { pl: "krzyż pański", ru: "крест господень, тяжкое бремя" }
