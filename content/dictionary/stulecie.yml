# review
id: stulecie
format: 2
lemma: "stulecie"
rank: 5350
pos: noun
pron: { cyr: "стуле́це" }
senses:
  - id: century
    ru: "столетие, век"
    examples:
      - pl: "Ten kościół stoi tu od pięciu stuleci."
        ru: "Эта церковь стоит здесь пять веков."
        source: { kind: authored }
      - pl: "Dwudzieste stulecie przyniosło dwie wojny światowe."
        ru: "Двадцатое столетие принесло две мировые войны."
        source: { kind: authored }
      - pl: "Na przełomie stuleci miasto szybko rosło."
        ru: "На рубеже веков город быстро рос."
        source: { kind: authored }
  - id: centenary
    ru: "столетие, столетний юбилей"
    examples:
      - pl: "W tym roku szkoła obchodzi stulecie."
        ru: "В этом году школа отмечает столетие."
        source: { kind: authored }
      - pl: "Z okazji stulecia klubu wydano album."
        ru: "К столетию клуба выпустили альбом."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Польское WIEK значит и «век», и «возраст»: W JAKIM WIEKU? — «в каком возрасте?». STULECIE — только «столетие»: и сто лет, и сотый юбилей. В датах поляки говорят WIEK: W XIX WIEKU, а STULECIE звучит торжественнее." }
  - { kind: usage, text: "Восемь форм, средний род на -IE, склоняется как ŻYCIE: STULECIA, STULECIU, STULECIEM. Родительный множественного — STULECI: KILKA STULECI." }
  - { kind: government, text: "Сто лет назад — PRZED STULECIEM, творительный. Веками — STULECIAMI, творительный без предлога. К столетию — Z OKAZJI STULECIA, родительный. В прошлом веке — W UBIEGŁYM STULECIU, местный." }
  - { kind: pronunciation, text: "Читается «стуле́це», ударение на предпоследнем слоге. CIE — «це» с мягким Ц, как в ŻYCIE «жы́це». L перед гласным — твёрдое «л»." }
  - { kind: register, text: "Слово книжнее, чем WIEK. Оно уместно в истории, юбилеях и газетных заголовках: AFERA STULECIA — «афера века»." }
collocations:
  - { pl: "w ubiegłym stuleciu", ru: "в прошлом столетии" }
  - { pl: "przełom stuleci", ru: "рубеж веков" }
  - { pl: "obchody stulecia", ru: "празднование столетия" }
family:
  - { pl: "sto", ru: "сто", relation: root, id: sto }
  - { pl: "lato", ru: "лето; (мн.) годы", relation: root, id: lato }
  - { pl: "tysiąclecie", ru: "тысячелетие", relation: root }
etymology: "STO «сто» + -LECIE от LATO в старом значении «год», как в русских «лета́», «летопись». STULECIE — «сто лет». По той же модели: DZIESIĘCIOLECIE «десятилетие», TYSIĄCLECIE «тысячелетие»."
memory: "Stulecie — столетие: sto + lato «год». Читается «стуле́це». W ubiegłym stuleciu — в прошлом веке. Wiek — и век, и возраст."
idioms:
  - { pl: "ślub stulecia", ru: "свадьба века" }
