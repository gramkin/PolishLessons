lemma: "płatek"
rank: 3889
pos: noun
pron: { cyr: "пуа́тэк" }
senses:
  - id: petal
    ru: "лепесток"
    examples:
      - pl: "Róża zgubiła ostatni płatek."
        ru: "Роза потеряла последний лепесток."
        source: { kind: authored }
      - pl: "Panna młoda szła po płatkach róż."
        ru: "Невеста шла по лепесткам роз."
