  - id: flake
    ru: "хлопья; снежинка"
    examples:
      - pl: "Na śniadanie jem płatki z mlekiem."
        ru: "На завтрак я ем хлопья с молоком."
        source: { kind: authored }
      - pl: "Płatek śniegu spadł mi na nos."
        ru: "Снежинка упала мне на нос."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "PŁATEK — не «платок», а «лепесток», «хлопья» и «снежинка»: PŁATEK RÓŻY, PŁATKI OWSIANE, PŁATEK ŚNIEGU. Платок — CHUSTKA. Хотя корень общий: PŁAT «лоскут» — родня русскому «плат»." }
  - { kind: usage, text: "Десять форм, мужской род, неодушевлённое. Беглое E: PŁATEK, но PŁATKA, PŁATKI. Хлопья к завтраку — всегда во множественном: PŁATKI ŚNIADANIOWE." }
  - { kind: government, text: "Хлопья с молоком — PŁATKI Z MLEKIEM, Z с творительным. Лепесток розы — PŁATEK RÓŻY, родительный." }
  - { kind: pronunciation, text: "Читается «пуа́тэк», ударение на первом слоге. Ł — краткое «у», TE — твёрдое «тэ»." }
collocations:
  - { pl: "płatki owsiane", ru: "овсяные хлопья" }
  - { pl: "płatek śniegu", ru: "снежинка" }
  - { pl: "płatki róż", ru: "лепестки роз" }
family:
  - { pl: "płat", ru: "лоскут, пласт", relation: root }
  - { pl: "płatki śniadaniowe", ru: "хлопья для завтрака", relation: derived }
  - { pl: "płatki owsiane", ru: "овсяные хлопья", relation: derived }
etymology: "Уменьшительное от PŁAT «лоскут, кусок плоского». Корень тот же, что в русском «плат», «платок», но польское слово ушло к лепесткам и хлопьям."
memory: "Płatek — лепесток, хлопья, снежинка, а не «платок» (chustka). Читается «пуа́тэк». Pójść jak z płatka — пойти как по маслу."
idioms:
  - { pl: "pójść jak z płatka", ru: "пойти как по маслу" }
formExamplesSkip:
