notes:
  - { kind: false-friend, text: "ЭТО РУССКОЕ СЛОВО, ВЕРНУВШЕЕСЯ ЧУЖИМ. Польский взял «балаган» из русского в XIX веке, но оставил от него только шум и неразбериху — и получилось обычное, стилистически нейтральное слово для беспорядка. Мать скажет ребёнку Posprzątaj ten bałagan, и это ровно «убери беспорядок». По-русски так не скажешь: «балаган» — это ярмарочный театр или фарс, а про грязь на столе звучит с усмешкой. Обычный русский здесь — «беспорядок» или «бардак»." }
  - { kind: register, text: "Слово нейтральное сверху донизу: его говорят дома, на работе и пишут в газете. Это важное отличие от русского, где «балаган» всегда с оттенком насмешки. Производные тоже обиходные: bałaganić «сорить, устраивать беспорядок», bałaganiarz «неряха», bałaganiarstwo «разгильдяйство»." }
  - { kind: pronunciation, text: "ł читается как короткое у: «баўа́ган». Ударение на предпоследнем слоге, то есть на ła, — совсем как в русском «балага́н», только звук другой." }
