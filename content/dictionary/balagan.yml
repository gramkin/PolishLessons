etymology: "Из русского «балаган», а туда — из персидского bālāḫāna «надстройка, верхняя комната» через тюркские языки. В русском слово осело на ярмарочном театре и оттуда получило смысл фарса; польский взял его позже и сохранил только шум и неразбериху, которые тот балаган с собой нёс. Направление заимствования здесь редкое: обычно слова идут из польского в русский, а не наоборот."
memory: "bałagan — «беспорядок», и это русский «балаган», уехавший в Польшу и сменивший работу. Там, где по-русски слышится ярмарка и фарс, по-польски просто грязная комната. Посмотрите на ł: «баўа́ган»."
