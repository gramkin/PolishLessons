pos: noun
pron: { cyr: "акт" }
senses:
  - id: deed
    ru: "акт, действие, поступок"
    examples:
      - pl: "Samobójstwo to akt rozpaczy."
        ru: "Самоубийство — акт отчаяния."
        source: { kind: translated, id: 352655 }
      - pl: "To był akt odwagi."
        ru: "Это был акт мужества."
        source: { kind: authored }
      - pl: "Statua znowu stoi, naprawiona po akcie wandalizmu."
        ru: "Статуя снова стоит, восстановленная после акта вандализма."
        source: { kind: translated, id: 6207851 }
  - id: document
    ru: "акт, официальный документ"
    examples:
      - pl: "Widziałem akt urodzenia Toma."
        ru: "Я видел свидетельство о рождении Тома."
        source: { kind: translated, id: 10600688 }
      - pl: "Nie ma tu aktu urodzenia."
        ru: "Свидетельства о рождении здесь нет."
        source: { kind: authored }
  - id: play
    ru: "акт (часть спектакля)"
    examples:
      - pl: "Ta opera ma pięć aktów."
        ru: "Эта опера состоит из пяти актов."
        source: { kind: tatoeba, id: 768778 }
      - pl: "Ta sztuka ma trzy akty."
        ru: "В этой пьесе три акта."
        source: { kind: translated, id: 1405241 }
notes:
  - { kind: false-friend, text: "Осторожно с множественным: akty — это «акты» (действия, документы), а akta — отдельное слово со значением «дело, досье»: akta sprawy «материалы дела», szafka na akta «шкаф для дел»." }
  - { kind: usage, text: "Официальные документы: akt urodzenia «свидетельство о рождении», akt zgonu «свидетельство о смерти», akt małżeństwa «свидетельство о браке», akt oskarżenia «обвинительное заключение»." }
  - { kind: usage, text: "В театре akt — часть пьесы, как и в русском: sztuka w trzech aktach «пьеса в трёх актах»." }
  - { kind: usage, text: "В живописи akt значит «ню» — изображение обнажённой натуры. Русское «акт» такого значения не имеет." }
collocations:
  - { pl: "akt urodzenia", ru: "свидетельство о рождении" }
  - { pl: "akt oskarżenia", ru: "обвинительное заключение" }
  - { pl: "akta sprawy", ru: "материалы дела" }
  - { pl: "sztuka w trzech aktach", ru: "пьеса в трёх актах" }
family:
  - { pl: "aktowy", ru: "актовый", relation: derived }
  - { pl: "akcja", ru: "действие, акция", relation: root }
etymology: "Из латинского actum «сделанное, документ», от agere «делать, вести». Русский «акт» — то же заимствование."
memory: "akt — «акт» и как поступок, и как документ: akt urodzenia «свидетельство о рождении». Но множественное раздваивается: akty это «акты», а akta — «дело, досье»."
idioms:
