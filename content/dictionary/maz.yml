senses:
  - id: husband
    ru: "муж, супруг"
    examples:
      - pl: "To mój mąż."
        ru: "Это мой муж."
        source: { kind: tatoeba, id: 10695765 }
      - pl: "Maria nie ma męża."
        ru: "У Мэри нет мужа."
        source: { kind: tatoeba, id: 13633153 }
      - pl: "Mój mąż jest dobrym człowiekiem."
        ru: "Мой муж — хороший человек."
        source: { kind: tatoeba, id: 3741247 }
  - id: marry
    ru: "муж в обороте wyjść za mąż «выйти замуж»"
    note: "В za mąż застыл старый винительный падеж — буквально «за муж»."
    examples:
      - pl: "Wychodzę za mąż w październiku."
        ru: "Я выхожу замуж в октябре."
        source: { kind: tatoeba, id: 3686946 }
      - pl: "Wkrótce wyszła ponownie za mąż."
        ru: "Вскоре она вновь вышла замуж."
        source: { kind: tatoeba, id: 988617 }
      - pl: "Rozwiodła się z mężem."
        ru: "Она развелась с мужем."
        source: { kind: tatoeba, id: 529949 }
notes:
  - { kind: false-friend, text: "mąż — «муж», а «мужчина» — mężczyzna. Это разные слова, хотя корень общий." }
  - { kind: usage, text: "wyjść za mąż говорят о женщине, ożenić się — о мужчине; общее «пожениться» — pobrać się." }
  - { kind: usage, text: "mąż zaufania — «доверенное лицо»; jak jeden mąż — «как один человек»." }
collocations:
  - { pl: "mój mąż", ru: "мой муж" }
  - { pl: "wyjść za mąż", ru: "выйти замуж" }
  - { pl: "mąż i żona", ru: "муж и жена" }
  - { pl: "były mąż", ru: "бывший муж" }
etymology: "Праславянское *mǫžь — то же слово, что русское «муж»; от него же образовано mężczyzna «мужчина»."
memory: "mąż — «муж», а «мужчина» — mężczyzna. В обороте wyjść za mąż «выйти замуж» застыл старый винительный падеж: буквально «за муж»."
idioms:
  - { pl: "wychodzić za mąż", ru: "выходить замуж" }
  - { pl: "jak jeden mąż", ru: "как один человек" }
  - { pl: "mąż zaufania", ru: "доверенное лицо" }
