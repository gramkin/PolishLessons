  - id: institution
    ru: "больница как учреждение"
    examples:
      - pl: "Szpitale są przepełnione."
        ru: "Больницы переполнены."
        source: { kind: tatoeba, id: 12470137 }
      - pl: "Szpitale są bardzo drogie."
        ru: "Больницы очень дорогие."
        source: { kind: tatoeba, id: 579887 }
      - pl: "Nienawidzę szpitali."
        ru: "Я ненавижу больницы."
        source: { kind: translated, id: 8542719 }
notes:
  - { kind: usage, text: "w szpitalu — «в больнице», do szpitala — «в больницу»: Tata jest w szpitalu «Папа в больнице»." }
  - { kind: false-friend, text: "Русское «госпиталь» — то же слово, но в русском оно военное, а польское szpital это любая больница, включая обычную городскую." }
  - { kind: usage, text: "Слово латинское: hospitale от hospes «гость». Тот же корень дал польские gość, gospoda, gospodarz, а в других языках — hotel и hostel." }
  - { kind: usage, text: "Мужской род: ten szpital, tego szpitala, w tym szpitalu." }
collocations:
  - { pl: "w szpitalu", ru: "в больнице" }
  - { pl: "do szpitala", ru: "в больницу" }
  - { pl: "trafić do szpitala", ru: "попасть в больницу" }
  - { pl: "szpital polowy", ru: "полевой госпиталь" }
etymology: "Через немецкое Spital из латинского hospitale, от hospes «гость». Тот же праиндоевропейский корень дал польские gość и gospoda, а в других языках — hotel и hostel."
memory: "szpital — «больница», любая, а не только военная. Слово идёт от латинского hospitale «дом для гостей», и родня ему gość, gospoda, hotel. Русское «госпиталь» — то же слово, но у нас оно сузилось до военного."
idioms:
  - { pl: "trafić do szpitala", ru: "попасть в больницу" }
  - { pl: "wylądować w szpitalu", ru: "угодить в больницу" }
  - { pl: "szpital polowy", ru: "полевой госпиталь" }
formExamplesSkip:
  - { form: "szpitalu", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
