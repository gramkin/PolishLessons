# review
id: grono
format: 2
lemma: "grono"
rank: 5839
pos: noun
pron: { cyr: "гро́но" }
senses:
  - id: circle
    ru: "круг (людей), коллектив"
    examples:
      - pl: "Szkoła ma znakomite grono pedagogiczne."
        ru: "В школе прекрасный педагогический коллектив."
        source: { kind: translated, id: 4425749 }
      - pl: "Święta spędzamy w gronie rodziny."
        ru: "Праздники мы проводим в кругу семьи."
        source: { kind: authored }
      - pl: "Do grona laureatów dołączyła młoda pisarka."
        ru: "К числу лауреатов присоединилась молодая писательница."
        source: { kind: authored }
  - id: bunch
    ru: "гроздь, кисть (винограда, ягод)"
    examples:
      - pl: "Zerwała z krzaka grono czerwonych porzeczek."
        ru: "Она сорвала с куста гроздь красной смородины."
        source: { kind: authored }
      - pl: "Winorośl uginała się pod ciężarem gron."
        ru: "Лоза гнулась под тяжестью гроздьев."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "GRONO — не «гром» и не «грозно»: это «гроздь», а чаще всего «круг людей». Русское «в кругу семьи» по-польски W GRONIE RODZINY, «в узком кругу» — W WĄSKIM GRONIE. Слово KRĄG «круг» в этом значении тоже возможно, но звучит книжно." }
  - { kind: usage, text: "GRONO PEDAGOGICZNE — «педагогический коллектив», все учителя школы. NALEŻEĆ DO GRONA + родительный — «входить в число»: NALEŻY DO GRONA NAJLEPSZYCH «он в числе лучших». Виноград как ягода — WINOGRONO, а гроздь винограда — GRONO WINOGRON или KIŚĆ WINOGRON." }
  - { kind: pronunciation, text: "Читается «гро́но», ударение на первом слоге. Средний род, склоняется как MIASTO: W GRONIE, родительный множественного GRON без окончания." }
collocations:
  - { pl: "w gronie rodziny", ru: "в кругу семьи" }
  - { pl: "w wąskim gronie", ru: "в узком кругу" }
  - { pl: "grono pedagogiczne", ru: "педагогический коллектив" }
  - { pl: "grono winogron", ru: "гроздь винограда" }
family:
  - { pl: "winogrono", ru: "виноградина, виноград", relation: derived }
  - { pl: "gronowy", ru: "гроздевой", relation: derived }
  - { pl: "krąg", ru: "круг", relation: root, id: krag }
etymology: "Исконно славянское слово с исходным значением «гроздь, кисть ягод». Значение «круг людей» — переносное: люди держатся вместе, как ягоды на одной кисти."
memory: "Grono — гроздь; люди, собравшиеся вместе, тоже гроздь: w gronie rodziny — в кругу семьи. Виноградина — wino-grono."
idioms:
  - { pl: "w gronie rodziny", ru: "в кругу семьи" }
  - { pl: "zaliczać się do grona", ru: "входить в число (лучших, избранных)" }
