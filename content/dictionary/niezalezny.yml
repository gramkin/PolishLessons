# review
id: niezalezny
format: 2
lemma: "niezależny"
rank: 4100
pos: adj
pron: { cyr: "незале́жны" }
senses:
  - id: independent
    ru: "независимый, самостоятельный"
    examples:
      - pl: "Od osiemnastego roku życia jest niezależna finansowo."
        ru: "С восемнадцати лет она финансово независима."
        source: { kind: authored }
      - pl: "Sądy w demokracji muszą być niezależne."
        ru: "Суды в демократии должны быть независимыми."
        source: { kind: authored }
      - pl: "To niezależny ekspert, nikt mu nie płaci."
        ru: "Это независимый эксперт, ему никто не платит."
        source: { kind: authored }
  - id: regardless
    ru: "не связанный с чем-то, вне зависимости"
    examples:
      - pl: "Z przyczyn od nas niezależnych koncert odwołano."
        ru: "По не зависящим от нас причинам концерт отменили."
        source: { kind: authored }
      - pl: "To dwa niezależne od siebie zdarzenia."
        ru: "Это два не связанных друг с другом события."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Значение совпадает с русским «независимый», но о государстве поляк скажет иначе: NIEPODLEGŁY, а не NIEZALEŻNY. Польский праздник 11 ноября — ŚWIĘTO NIEPODLEGŁOŚCI, «День независимости». NIEZALEŻNY — о человеке, суде, СМИ, эксперте; NIEPODLEGŁY — о стране и её суверенитете. Русский одним словом покрывает оба." }
  - { kind: usage, text: "Слово сравнивается: BARDZIEJ NIEZALEŻNY, хотя есть и простое NIEZALEŻNIEJSZY, редкое. Все одиннадцать форм живые. Форма для мужчин-людей NIEZALEŻNI частая: NIEZALEŻNI DZIENNIKARZE, NIEZALEŻNI KANDYDACI, NIEZALEŻNI EKSPERCI. Отрицательное NIE пишется слитно, это одно слово, а не «не зависимый»." }
  - { kind: government, text: "Независимый от чего-то — NIEZALEŻNY OD CZEGOŚ, OD с родительным, как и в русском: NIEZALEŻNY OD RODZICÓW. Наречие NIEZALEŻNIE OD значит «независимо от, вне зависимости»: NIEZALEŻNIE OD POGODY, «независимо от погоды»." }
  - { kind: pronunciation, text: "Читается «незале́жны», четыре слога, ударение на предпоследнем. NIE даёт «не», Ż — твёрдое «ж», Y — «ы». Сравните с ZALEŻEĆ «зале́жэць»: там после Ż стоит E, и оно тоже твёрдое, «жэ»." }
  - { kind: register, text: "Нейтральное слово, частое в политике и журналистике: NIEZALEŻNE MEDIA, NIEZALEŻNY KANDYDAT. О человеке NIEZALEŻNY звучит как комплимент: самостоятельный, ни от кого не зависящий. Устойчивая формула Z PRZYCZYN OD NAS NIEZALEŻNYCH — из официальных объявлений об отменах и задержках." }
collocations:
  - { pl: "niezależne media", ru: "независимые СМИ" }
  - { pl: "niezależny ekspert", ru: "независимый эксперт" }
  - { pl: "z przyczyn od nas niezależnych", ru: "по не зависящим от нас причинам" }
family:
  - { pl: "zależeć", ru: "зависеть", relation: root, id: zalezec }
  - { pl: "niezależność", ru: "независимость", relation: derived }
  - { pl: "niezależnie", ru: "независимо", relation: derived, id: niezaleznie }
etymology: "От ZALEŻEĆ «зависеть», а то от LEŻEĆ «лежать», то есть буквально «лежать за чем-то, на чём-то». Русское «зависеть» построено так же, только от «висеть»: русский зависимый висит, польский лежит. Приставка NIE- даёт отрицание, как и русское «не-»."
memory: "Niezależny — независимый: niezależny ekspert, niezależne media. От zależeć, где русский «висит», а поляк «лежит». О стране — niepodległy. Z przyczyn od nas niezależnych — по не зависящим от нас причинам."
idioms:
  - { pl: "z przyczyn od nas niezależnych", ru: "по не зависящим от нас причинам" }
