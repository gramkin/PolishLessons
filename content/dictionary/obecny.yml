# review
id: obecny
format: 2
lemma: "obecny"
rank: 1690
pos: adj
pron: { cyr: "обэ́цны" }
senses:
  - id: present-there
    ru: "присутствующий, находящийся (где-либо)"
    examples:
      - pl: "Będę obecny."
        ru: "Я буду присутствовать."
        source: { kind: translated, id: 547711 }
      - pl: "Wszyscy byli obecni."
        ru: "Все присутствовали."
        source: { kind: translated, id: 10606313 }
      - pl: "Nie wszyscy studenci byli obecni."
        ru: "Не все студенты присутствовали."
        source: { kind: translated, id: 352103 }
  - id: current
    ru: "нынешний, теперешний, текущий"
    examples:
      - pl: "Obecna sytuacja polityczna nie jest zbyt stabilna."
        ru: "Нынешняя политическая ситуация не очень стабильна."
        source: { kind: translated, id: 735788 }
      - pl: "Odpowiada mi moje obecne życie."
        ru: "Меня устраивает моя нынешняя жизнь."
        source: { kind: translated, id: 12077907 }
      - pl: "Jest zadowolony z obecnego stanu rzeczy."
        ru: "Он доволен нынешним положением дел."
        source: { kind: translated, id: 771799 }
notes:
  - { kind: false-friend, text: "Одно слово — два разных значения: obecny na spotkaniu «присутствующий на встрече» и obecna sytuacja «нынешняя ситуация». В русском это два разных слова." }
  - { kind: government, text: "Присутствовать на чём-либо — być obecnym na czymś: był obecny na zebraniu «он присутствовал на собрании». Предлог na требует предложного падежа." }
  - { kind: usage, text: "Наречие obecnie значит «сейчас, в настоящее время»: obecnie mieszkam w Krakowie." }
  - { kind: usage, text: "Существительное obecność — «присутствие»: sprawdzić obecność «проверить посещаемость». Противоположность — nieobecny «отсутствующий»." }
collocations:
  - { pl: "obecna sytuacja", ru: "нынешняя ситуация" }
  - { pl: "być obecnym", ru: "присутствовать" }
  - { pl: "w obecnych czasach", ru: "в нынешние времена" }
family:
  - { pl: "obecność", ru: "присутствие", relation: root, id: obecnosc }
  - { pl: "obecnie", ru: "сейчас, в настоящее время", relation: root }
  - { pl: "nieobecny", ru: "отсутствующий", relation: root }
etymology: "Старое слово со значением «находящийся при чём-либо»; однокоренного соответствия в русском нет, поэтому оба значения — «присутствующий» и «нынешний» — приходится запоминать вместе с самим словом."
memory: "obecny — это и «присутствующий» (obecny na lekcji), и «нынешний» (obecna sytuacja). Подсказка: и то и другое про то, что есть прямо сейчас. Наречие obecnie — «в настоящее время»."
idioms:
