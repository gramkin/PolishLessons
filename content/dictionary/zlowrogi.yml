etymology: "zło «зло» + wróg «враг»: буквально «злобно-враждебный». Русское «зловещий» вторую часть берёт от «вещать»."
memory: "złowrogi — «зловещий», из zło + wróg. Русское слово собрано иначе: «зло» + «вещать». Есть и прямой аналог — złowieszczy."
