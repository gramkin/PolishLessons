# review
id: zlowrogi
format: 2
lemma: "złowrogi"
rank: 5586
pos: adj
pron: { cyr: "зуовро́ги" }
senses:
  - id: sinister
    ru: "зловещий, недобрый"
    examples:
      - pl: "Rzucił mi złowrogie spojrzenie."
        ru: "Он бросил на меня зловещий взгляд."
        source: { kind: translated, id: 3761628 }
      - pl: "Tom obrzucił Mary złowrogim spojrzeniem."
        ru: "Том смерил Мэри зловещим взглядом."
        source: { kind: translated, id: 4874786 }
      - pl: "Nad miastem wisiała złowroga cisza."
        ru: "Над городом висела зловещая тишина."
        source: { kind: authored }
  - id: ominous
    ru: "грозный, предвещающий беду"
    examples:
      - pl: "To złowrogi znak."
        ru: "Это зловещий знак."
        source: { kind: authored }
      - pl: "Złowrogie chmury nadciągały z zachodu."
        ru: "Зловещие тучи надвигались с запада."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "Собрано из zło «зло» и wróg «враг»: буквально «злобно-враждебный». Русское «зловещий» второй частью иное — от «вещать», то есть предсказывать." }
  - { kind: usage, text: "Чаще всего о взгляде, тишине, знаке и тучах — о том, что предвещает беду." }
  - { kind: government, text: "Обычное прилагательное; наречие — złowrogo." }
  - { kind: usage, text: "Рядом стоит złowieszczy «зловещий», которое как раз буквально совпадает с русским." }
collocations:
  - { pl: "złowrogie spojrzenie", ru: "зловещий взгляд" }
  - { pl: "złowrogi znak", ru: "зловещий знак" }
etymology: "zło «зло» + wróg «враг»: буквально «злобно-враждебный». Русское «зловещий» вторую часть берёт от «вещать»."
memory: "złowrogi — «зловещий», из zło + wróg. Русское слово собрано иначе: «зло» + «вещать». Есть и прямой аналог — złowieszczy."
idioms:
  - { pl: "złowrogie spojrzenie", ru: "зловещий взгляд" }
