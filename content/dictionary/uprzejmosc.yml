  - { pl: "nieuprzejmy", ru: "невежливый", relation: derived }
etymology: "От UPRZEJMY «любезный», исконно польского слова без прямого русского родственника. Суффикс -OŚĆ делает из прилагательного название качества, как MIŁOŚĆ из MIŁY и RADOŚĆ из RADY."
memory: "Uprzejmość — любезность, вежливость. Читается «упше́ймосьць». Dziękuję za uprzejmość — спасибо за любезность. Z uprzejmości — из вежливости. Wymieniać uprzejmości — обмениваться любезностями."
idioms:
