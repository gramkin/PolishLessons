notes:
  - { kind: false-friend, text: "UPRZEJMOŚĆ — «любезность, вежливость», и слово очень употребительно в вежливых формулах: UPRZEJMIE PROSZĘ — «покорнейше прошу», DZIĘKUJĘ ZA UPRZEJMOŚĆ — «спасибо за любезность». DZIĘKI UPRZEJMOŚCI — формула в подписях к фотографиям: «любезно предоставлено». Синоним попроще — GRZECZNOŚĆ." }
  - { kind: usage, text: "Шесть форм, женский род на -OŚĆ. Родительный, дательный и местный единственного совпадают с именительным множественного: UPRZEJMOŚCI. Множественное число живёт в обороте WYMIENIAĆ UPRZEJMOŚCI — «обмениваться любезностями»." }
  - { kind: government, text: "Из вежливости — Z UPRZEJMOŚCI, родительный. Оказать любезность — WYŚWIADCZYĆ UPRZEJMOŚĆ, винительный. Благодаря любезности — DZIĘKI UPRZEJMOŚCI, дательный." }
  - { kind: pronunciation, text: "Читается «упше́ймосьць», три слога, ударение на втором. PRZ — «пш», конечное ŚĆ — «сьць». В форме UPRZEJMOŚCI ударение сдвигается: «упшеймо́сьци»." }
  - { kind: register, text: "Слово книжное и вежливое, его любят в письмах и объявлениях: UPRZEJMIE INFORMUJEMY — «уведомляем вас». В обиходе чаще говорят GRZECZNOŚĆ." }
collocations:
  - { pl: "wyświadczyć uprzejmość", ru: "оказать любезность" }
  - { pl: "chłodna uprzejmość", ru: "холодная вежливость" }
  - { pl: "dzięki uprzejmości", ru: "благодаря любезности" }
family:
