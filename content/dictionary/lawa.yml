notes:
  - { kind: pronunciation, text: "Это слово — лучший в языке повод разобраться с буквой Ł, потому что рядом с ним стоит почти его двойник. ŁAWA значит «скамья», а LAWA — «лава», и различаются они одной буквой: ł против l. Склоняются оба одинаково и во всём: ławie и lawie, ław и law, ławą и lawą. Но это не варианты написания одного звука. Ł читается как английское w или как у в русском «аудитория», а l — как обычное л. Поэтому ława звучит «уа́ва», а lawa — «ла́ва». Русский, прочитавший ł как л, скажет «лава», думая, что говорит о скамье." }
  - { kind: usage, text: "Русскому эту букву взять не из чего: в русском языке звука ł нет вовсе, и подставить на его место привычное л — самая частая ошибка начинающих. Помогает такой приём: везде, где стоит ł, читайте у, не трогая остальных букв. ŁAWA даёт «уа́ва», MAŁY даёт «ма́уы», BYŁ даёт «быу», SŁOWO даёт «суо́во». Звучит поначалу странно, но это и есть польское произношение, а не приближение к нему." }
  - { kind: usage, text: "Корни у двойников тоже разные, и это закрепляет разницу. ŁAWA идёт из праславянского и родственна русской «лавке» — та же скамья, тот же корень. LAWA пришла из итальянского lava и родственна русской «лаве», той, что течёт из вулкана. Два слова, две пары с русским, и между парами никакого родства. Самые нужные выражения с ława — судебные: ŁAWA PRZYSIĘGŁYCH «суд присяжных» и ŁAWA OSKARŻONYCH «скамья подсудимых», оба калькируют русские дословно." }
