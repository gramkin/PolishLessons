etymology: "Из праславянского *lava «скамья, настил» — того же корня, что русская «лавка» и «лава» в значении «настил, помост» в говорах. Польское слово сохранило исходный смысл скамьи целиком. Совпадающее по виду LAWA «вулканическая лава» никакого отношения к нему не имеет: оно пришло из итальянского lava, от латинского labes «обвал», и в русский попало тем же путём. Две истории, сошедшиеся в одном написании с точностью до одной буквы."
memory: "ł читается как у: ława — «уа́ва». А lawa через обычное l — это «лава» из вулкана. Одна буква, два слова. И ława przysięgłych — суд присяжных."
