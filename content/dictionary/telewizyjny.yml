etymology: "Из греческого TELE- «далеко» и латинского VISIO «видение». Любопытно, что здесь языки поменялись ролями по сравнению с PIŁKA NOŻNA. На этот раз переводил по частям русский и получил «телевидение», а поляк взял слово целиком, как оно пришло с запада, и получил TELEWIZJA. Поэтому наше «телевидение» и польское TELEWIZJA не похожи, хотя означают одно. Зато TELEWIDZ собран как наш «телезритель», от WIDZ «зритель»."
memory: "Телевизионный. Главное — не слово, а устройство выражений: русский склеивает «телепрограмму», поляк пишет два слова, program telewizyjny. Так же stacja telewizyjna «телеканал» и serial telewizyjny «телесериал». Читается «телевизы́йны», и tele- здесь мягкое, как в telefon «теле́фон». Различайте telewizja «телевидение» и telewizor «телевизор». Форма для людей живая: dziennikarze telewizyjni."
idioms:
  - { pl: "serial telewizyjny", ru: "телесериал" }
