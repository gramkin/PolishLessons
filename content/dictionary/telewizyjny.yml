notes:
  - { kind: false-friend, text: "Главное здесь не слово, а устройство выражений. Там, где русский склеивает всё в одно — «телепрограмма», «телеканал», «телестудия», — поляк пишет два слова с прилагательным: PROGRAM TELEWIZYJNY, STACJA TELEWIZYJNA, STUDIO TELEWIZYJNE. Склейки вроде TELEPROGRAM по-польски не бывает. И различайте TELEWIZJA «телевидение» и TELEWIZOR «телевизор»: первое это дело, второе — ящик." }
  - { kind: usage, text: "Все одиннадцать форм живые. Форма для мужчин-людей здесь есть и употребляется, потому что DZIENNIKARZ TELEWIZYJNY и OPERATOR TELEWIZYJNY — это люди, а значит бывают DZIENNIKARZE TELEWIZYJNI и OPERATORZY TELEWIZYJNI. Пропускать её, как у LODOWY или BOJOWY, здесь нельзя. Зрителей при этом называют TELEWIDZOWIE, существительным." }
  - { kind: government, text: "По телевизору — W TELEWIZJI, местный падеж, буквально «в телевидении»: WIDZIAŁEM GO W TELEWIZJI значит «я видел его по телевизору». На телевидении работать — PRACOWAĆ W TELEWIZJI, тот же оборот. Прилагательное стоит после существительного и порядок закреплён: PROGRAM TELEWIZYJNY, SERIAL TELEWIZYJNY, REKLAMA TELEWIZYJNA." }
  - { kind: pronunciation, text: "Читается «телевизы́йны», пять слогов, ударение на предпоследнем. Обратите внимание на начало: обычно польская E после согласной даёт «э», но в словах на TELE- словарь держит мягкое чтение, как в TELEFON «теле́фон» и TELEWIZJA «телеви́зья». Буква Y даёт «ы», а сочетание YJ — «ый», поэтому середина слова звучит «зы́й»." }
  - { kind: register, text: "Слово нейтральное, из обиходной речи и из газет. Самые частые сочетания — PROGRAM TELEWIZYJNY «телепрограмма», STACJA TELEWIZYJNA «телеканал», SERIAL TELEWIZYJNY «телесериал», REKLAMA TELEWIZYJNA. В разговоре поляки часто говорят просто TELEWIZJA обо всём сразу, и даже о самом ящике: WŁĄCZ TELEWIZJĘ значит «включи телевизор»." }
collocations:
  - { pl: "program telewizyjny", ru: "телепрограмма" }
