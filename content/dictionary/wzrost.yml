notes:
  - { kind: false-friend, text: "Оба значения совпадают с русским «ростом» — и телесный, и количественный. Полезно другое: по-русски «он ростом метр восемьдесят», по-польски — ma metr osiemdziesiąt WZROSTU, с родительным падежом. Конструкция с «иметь» тут обязательна." }
  - { kind: pronunciation, text: "ПРЕДЛОЖНЫЙ ПАДЕЖ СМЯГЧАЕТ ST В ŚCI: WE WZROŚCIE. Так ведут себя все основы на -st: most — na moście, list — w liście, miasto — w mieście. Один слог в именительном, конечное t глухое: «взрост»." }
  - { kind: usage, text: "Телесный рост меряют родительным: metr siedemdziesiąt wzrostu. Экономический идёт с прилагательным: wzrost gospodarczy, wzrost cen, wzrost bezrobocia. Глагол — rosnąć «расти», совершенный wzrosnąć «вырасти, возрасти». Антоним: spadek «падение, спад»." }
collocations:
  - { pl: "wzrost cen", ru: "рост цен" }
  - { pl: "wzrost gospodarczy", ru: "экономический рост" }
  - { pl: "metr osiemdziesiąt wzrostu", ru: "метр восемьдесят роста" }
family:
  - { pl: "rosnąć", ru: "расти", relation: root, id: rosnac }
  - { pl: "wzrosnąć", ru: "возрасти", relation: derived }
  - { pl: "spadek", ru: "падение, спад", relation: antonym }
etymology: "От wzrosnąć, приставка wz- плюс rosnąć «расти», из праславянского *orsti — того же корня, что русские «расти», «рост», «возраст». Приставка wz- отвечает русской «воз-»: wzrost это буквально «возрастание». Отсюда wzrastać, przyrost и dorosły «взрослый»."
memory: "wzrost — «рост» в обоих смыслах, как в русском: и у человека, и у цен. Но рост человека называют родительным: ma metr osiemdziesiąt wzrostu. Предложный смягчает st: we wzroście, как w mieście."
idioms:
  - { pl: "wzrost gospodarczy", ru: "экономический рост" }
  - { pl: "wysokiego wzrostu", ru: "высокого роста" }
