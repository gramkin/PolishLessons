# review
id: polecac
format: 2
lemma: "polecać"
rank: 4323
pos: verb
pron: { cyr: "поле́цаць" }
senses:
  - id: recommend
    ru: "рекомендовать, советовать"
    examples:
      - pl: "Polecam tę książkę!"
        ru: "Рекомендую эту книгу!"
        source: { kind: authored }
      - pl: "Co pan poleca na deser?"
        ru: "Что вы посоветуете на десерт?"
        source: { kind: authored }
      - pl: "Lekarze polecają ruch na świeżym powietrzu."
        ru: "Врачи советуют движение на свежем воздухе."
        source: { kind: authored }
  - id: instruct
    ru: "поручать, велеть (книжно)"
    examples:
      - pl: "Szef poleca mi przygotować raport."
        ru: "Начальник поручает мне подготовить отчёт."
        source: { kind: authored }
      - pl: "Polecano nam czekać w holu."
        ru: "Нам велели ждать в холле."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "POLECAĆ — «рекомендовать», а не «полетать» (POLATAĆ) и не «лечить» (LECZYĆ). Самое частое — POLECAM! «рекомендую!» в отзывах и в ресторане. Второе значение — «поручать»: POLECIĆ KOMUŚ ZADANIE. POLECONY — «заказное» о письме: LIST POLECONY." }
  - { kind: usage, text: "Несовершенный вид; совершенный — POLECIĆ. Спряжение на -AM: POLECAM, POLECASZ, POLECAJĄ. Вежливый вопрос официанту — CO PAN POLECA? «что вы посоветуете?»." }
  - { kind: government, text: "Что — винительный, кому — дательный: POLECAĆ KOMUŚ RESTAURACJĘ. Что сделать — инфинитив: POLECAĆ ODPOCZĄĆ. Как кого — JAKO: POLECAĆ KOGOŚ JAKO TŁUMACZA." }
  - { kind: pronunciation, text: "Читается «поле́цаць»: C — «ц», ударение на предпоследнем слоге. POLECAM — «поле́цам»." }
  - { kind: register, text: "Нейтральное слово. POLECAM — разговорное «рекомендую», в отзывах в интернете — очень частое. В значении «поручать» — книжно-официальное." }
collocations:
  - { pl: "polecam!", ru: "рекомендую!" }
  - { pl: "polecać komuś książkę", ru: "советовать кому-то книгу" }
  - { pl: "godny polecenia", ru: "достойный рекомендации" }
family:
  - { pl: "polecić", ru: "порекомендовать, поручить", relation: aspect, id: polecic }
  - { pl: "rada", ru: "совет", relation: root, id: rada }
  - { pl: "polecenie", ru: "поручение, рекомендация", relation: derived }
etymology: "Происхождение не вполне ясно; глагол обычно связывают со старопольским LECIĆ «вверять, поручать». В современном языке связь с корнем не ощущается."
memory: "Polecać — рекомендовать: polecam tę książkę! Co pan poleca? — что вы посоветуете? List polecony — заказное письмо."
idioms:
  - { pl: "godny polecenia", ru: "достойный рекомендации" }
