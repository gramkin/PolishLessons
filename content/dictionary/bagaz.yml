etymology: "Из французского BAGAGE «поклажа», от старофранцузского bague «узел, тюк». Русский взял слово из того же французского и в ту же эпоху, так что «багаж» и bagaż совпадают и по звучанию, и по смыслу. Разошлись они только в числе: польское слово спокойно считается по местам — dwa bagaże, — а русское осталось собирательным."
memory: "bagażu — и родительный, и местный сразу. Родительный множественного имеет дублет: обычное bagaży, вариант bagażów. И bagaże во множественном — «места багажа»."
