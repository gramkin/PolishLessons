notes:
  - { kind: usage, text: "Форма BAGAŻU служит и родительным, и местным падежом сразу. У мягких мужских основ на -ż, -sz, -cz и -rz окончание -u в родительном — выбор обычный, почти правило, и потому совпадение с местным у них системное. Сравните PLIK из партии 223: там тоже pliku в обоих падежах, но основа твёрдая, и выбор -u был лексической прихотью, которую пришлось просто запомнить. То есть одна и та же картина возникает у этих двух слов по разным причинам." }
  - { kind: usage, text: "Родительный множественного имеет дублет: BAGAŻY и BAGAŻÓW. Обычная форма — на -y, её и следует употреблять; на -ów встречается в текстах постарше. Это второй такой дублет после OCHRONIARZY и OCHRONIARZÓW из партии 227, и вместе они показывают, что колебание -y/-ów свойственно мягким мужским основам как классу, а не отдельным словам." }
  - { kind: usage, text: "Множественное число у польского слова живое: BAGAŻE означает отдельные места багажа, чемоданы и сумки по счёту. Русский «багаж» остаётся собирательным и в множественном не употребляется, поэтому bagaże приходится переводить как «вещи» или «места багажа». Переносный смысл при этом совпадает полностью: BAGAŻ DOŚWIADCZEŃ — «багаж опыта», и образ в обоих языках один." }
