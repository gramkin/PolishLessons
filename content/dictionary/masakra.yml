# review
id: masakra
format: 2
lemma: "masakra"
rank: 5166
pos: noun
pron: { cyr: "маса́кра" }
senses:
  - id: massacre
    ru: "бойня, резня"
    examples:
      - pl: "Masakra cywilów wstrząsnęła światem."
        ru: "Резня мирных жителей потрясла мир."
        source: { kind: authored }
      - pl: "Świadkowie opisali masakrę w wiosce."
        ru: "Свидетели описали бойню в деревне."
        source: { kind: authored }
      - pl: "Po masakrze ogłoszono żałobę narodową."
        ru: "После резни объявили национальный траур."
        source: { kind: authored }
  - id: disaster
    ru: "кошмар, ужас (разг.)"
    examples:
      - pl: "Korki dzisiaj to masakra!"
        ru: "Пробки сегодня — это кошмар!"
        source: { kind: authored }
      - pl: "Egzamin był masakrą."
        ru: "Экзамен был сущим кошмаром."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "MASAKRA — «резня, бойня», но в молодёжном разговоре — «кошмар, жесть»: MASAKRA! — «жесть!». Не путайте с MASAŻ — «массаж». Учтите тон: о реальной трагедии говорят серьёзно, о пробках — с иронией." }
  - { kind: register, text: "В значении «кошмар» — очень разговорное и эмоциональное: TO BYŁA MASAKRA. В новостях — только «резня». В официальной речи о трагедиях чаще RZEŹ или ZBRODNIA." }
  - { kind: usage, text: "Девять форм, женский род. В местном R переходит в RZ: PO MASAKRZE. Звательный MASAKRO не употребляется." }
  - { kind: pronunciation, text: "Читается «маса́кра», ударение на предпоследнем слоге. MASAKRZE — «маса́кшэ»." }
collocations:
  - { pl: "krwawa masakra", ru: "кровавая бойня" }
  - { pl: "to masakra", ru: "это кошмар" }
  - { pl: "ofiary masakry", ru: "жертвы резни" }
family:
  - { pl: "rzeź", ru: "резня", relation: root }
  - { pl: "zbrodnia", ru: "преступление", relation: root, id: zbrodnia }
  - { pl: "koszmar", ru: "кошмар", relation: root, id: koszmar }
etymology: "Из французского MASSACRE «бойня»."
memory: "Masakra — резня и разговорное «кошмар, жесть». Korki to masakra — пробки — это кошмар. Читается «маса́кра»."
idioms:
  - { pl: "totalna masakra", ru: "полная жесть" }
formExamplesSkip:
  - { form: "masakro", reason: "звательный от названия события не употребляется" }
