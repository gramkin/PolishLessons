# review
id: chociaz
format: 2
lemma: "chociaż"
rank: 639
pos: part
pron: { cyr: "хо́чяж" }
senses:
  - id: although
    ru: "хотя, несмотря на то что (союз)"
    note: "Chociaż jest zimno, idziemy «Хотя холодно, мы идём»."
    examples:
      - pl: "Chociaż Gogol urodził się na Ukrainie, pisał tylko po rosyjsku."
        ru: "Несмотря на то что Гоголь родился на Украине, писал он только по-русски."
        source: { kind: tatoeba, id: 11516396 }
      - pl: "Tom czyta już teksty po koreańsku, chociaż jeszcze nie może rozmawiać."
        ru: "Том уже читает тексты на корейском, хоть пока и не может говорить."
        source: { kind: tatoeba, id: 10743275 }
      - pl: "Chociaż było późno, nie spał."
        ru: "Хотя было поздно, он не спал."
        source: { kind: authored }
  - id: at-least
    ru: "хотя бы (усилитель)"
    note: "Mógłbyś chociaż podziękować «Мог бы хотя бы поблагодарить»."
    examples:
      - pl: "Cały rok pracowałem - czy mógłbym chociaż latem odpocząć?"
        ru: "Я весь год работал - могу я хотя бы летом отдохнуть?"
        source: { kind: tatoeba, id: 12574283 }
      - pl: "Mógłbyś chociaż podziękować."
        ru: "Мог бы хотя бы поблагодарить."
        source: { kind: translated, id: 943593 }
      - pl: "Zadzwoń chociaż raz."
        ru: "Позвони хотя бы раз."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два употребления: союз «хотя» (Chociaż Gogol urodził się na Ukrainie, pisał po rosyjsku) и усилитель «хотя бы» (Mógłbyś chociaż podziękować)." }
  - { kind: usage, text: "Равноправный короткий вариант — choć; в разговоре он даже частотнее: choć raz «хотя бы раз»." }
  - { kind: usage, text: "Рядом стоит mimo że «несмотря на то что» — оно книжнее и сильнее подчёркивает противопоставление." }
  - { kind: usage, text: "Если придаточное с chociaż стоит первым, после него ставится запятая." }
collocations:
  - { pl: "chociaż raz", ru: "хотя бы раз" }
  - { pl: "chociaż trochę", ru: "хотя бы немного" }
  - { pl: "chociaż na chwilę", ru: "хотя бы на минуту" }
  - { pl: "choć", ru: "хоть" }
family:
  - { pl: "choć", ru: "хоть", relation: root }
  - { pl: "chcieć", ru: "хотеть", relation: root }
  - { pl: "mimo", ru: "несмотря на", relation: derived }
etymology: "Из chocia, старого деепричастия от chcieć «хотеть», плюс że — буквально «хоть и». Русское «хотя» собрано ровно так же, от «хотеть»."
memory: "chociaż — «хотя», и устроено оно как русское: от глагола «хотеть». Работает двояко. Как союз: Chociaż Gogol urodził się na Ukrainie, pisał tylko po rosyjsku. И как усилитель «хотя бы»: Mógłbyś chociaż podziękować, zadzwoń chociaż raz. Короткий вариант — choć, в разговоре он даже чаще."
idioms:
