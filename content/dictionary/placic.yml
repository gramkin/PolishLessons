# review
id: placic
format: 2
lemma: "płacić"
rank: 740
pos: verb
aspect: imperf
aspectPair: zaplacic
pron: { cyr: "пуа́циць" }
senses:
  - id: pay
    ru: "платить"
    examples:
      - pl: "Właśnie za to mi płacą."
        ru: "За это они мне и платят."
        source: { kind: tatoeba, id: 12567520 }
      - pl: "Płacę gotówką."
        ru: "Я плачу наличными."
        source: { kind: tatoeba, id: 8763722 }
      - pl: "Kto płaci?"
        ru: "Кто платит?"
        source: { kind: translated, id: 952207 }
  - id: pay-for
    ru: "płacić ZA coś — платить за что-л. (винительный)"
    examples:
      - pl: "Kto będzie za to wszystko płacić?"
        ru: "Кто будет за всё это платить?"
        source: { kind: tatoeba, id: 5909104 }
      - pl: "To absurd, by płacić takie pieniądze za takie głupoty."
        ru: "Это абсурдно - платить такие огромные деньги за такие глупости."
        source: { kind: tatoeba, id: 709334 }
      - pl: "Za wolność się płaci."
        ru: "За свободу нужно платить."
        source: { kind: tatoeba, id: 567095 }
  - id: pay-with
    ru: "płacić gotówką, kartą — платить наличными, картой (творительный)"
    examples:
      - pl: "Płacę kartą."
        ru: "Я плачу картой."
        source: { kind: authored }
      - pl: "Płacimy przelewem."
        ru: "Мы платим переводом."
        source: { kind: authored }
      - pl: "Czy można płacić gotówką?"
        ru: "Можно платить наличными?"
        source: { kind: authored }
  - id: imperfective
    ru: "płacić — процесс и привычка; zapłacić — один платёж"
    examples:
      - pl: "W naszej firmie kiepsko płacą."
        ru: "В нашей фирме плохо платят."
        source: { kind: translated, id: 745320 }
      - pl: "Tom nic mi nie płacił."
        ru: "Том мне ничего не платил."
        source: { kind: translated, id: 4179291 }
      - pl: "Kto płacił za lunch?"
        ru: "Кто платил за обед?"
        source: { kind: translated, id: 6441670 }
notes:
  - { kind: government, text: "Три падежа при одном глаголе. За что — винительный: płacić ZA bilet. Кому — дательный: płacić KOMUŚ. Чем — творительный: płacić GOTÓWKĄ, płacić KARTĄ." }
  - { kind: usage, text: "Несовершенный płacić — это процесс или привычка, совершенный zapłacić — один законченный платёж: Zawsze płacę kartą «Я всегда плачу картой», но Zapłaciłem kartą «Я заплатил картой»." }
  - { kind: usage, text: "Родня по деньгам: płaca «зарплата», opłata «плата, сбор», zapłata «оплата», płatność «платёж». Отглагольное płacenie — оплата как процесс." }
  - { kind: usage, text: "słono za coś płacić — «дорого за что-то заплатить», буквально «солоно платить»." }
collocations:
  - { pl: "płacić za bilet", ru: "платить за билет" }
  - { pl: "płacić gotówką", ru: "платить наличными" }
  - { pl: "płacić kartą", ru: "платить картой" }
  - { pl: "płacić rachunki", ru: "оплачивать счета" }
family:
  - { pl: "zapłacić", ru: "заплатить", relation: aspect }
  - { pl: "płaca", ru: "зарплата", relation: derived }
  - { pl: "opłata", ru: "плата, сбор", relation: derived }
  - { pl: "płatność", ru: "платёж", relation: derived }
etymology: "Праславянское *platiti, от *platъ «кусок полотна»: у древних славян отрезы полотна служили деньгами. Русские «платить» и «плата» — из того же гнезда."
memory: "płacić — «платить», и этимология тут яркая: слово идёт от platъ «кусок полотна», потому что полотно у древних славян служило деньгами — отсюда же русские «платить» и «плата». Управление тройное: płacić ZA bilet (винительный), płacić KOMUŚ (дательный), płacić KARTĄ (творительный). Совершенный вид — zapłacić: Zawsze płacę kartą, но Zapłaciłem kartą."
idioms:
  - { pl: "płacić gotówką", ru: "платить наличными" }
  - { pl: "słono za coś płacić", ru: "дорого за что-то заплатить" }
  - { pl: "płacić z góry", ru: "платить вперёд" }
