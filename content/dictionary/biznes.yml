# review
id: biznes
format: 2
lemma: "biznes"
rank: 1436
pos: noun
pron: { cyr: "би́знэс" }
senses:
  - id: business
    ru: "бизнес, дело, предприятие"
    examples:
      - pl: "jak idzie biznes?"
        ru: "Как идет бизнес?"
        source: { kind: tatoeba, id: 4748315 }
      - pl: "Uruchomił nowy biznes."
        ru: "Он запустил новый бизнес."
        source: { kind: translated, id: 1618174 }
      - pl: "Udało mu się w biznesie."
        ru: "Ему повезло в бизнесе."
        source: { kind: translated, id: 935200 }
  - id: business-world
    ru: "деловой мир, предпринимательство"
    examples:
      - pl: "Nie umiem sobie radzić w świecie biznesu."
        ru: "Я не умею справляться в мире бизнеса."
        source: { kind: translated, id: 1657591 }
      - pl: "Przemysł filmowy stał się potężnym biznesem."
        ru: "Киноиндустрия стала мощным бизнесом."
        source: { kind: translated, id: 952115 }
notes:
  - { kind: usage, text: "Недавнее заимствование из английского. Мужской неодушевлённый: biznes, biznesu, w biznesie." }
  - { kind: usage, text: "Исконный синоним — interes «дело, выгода, бизнес». В бытовой речи interes звучит естественнее: Zrobił dobry interes «Он провернул хорошее дело»." }
  - { kind: false-friend, text: "To nie twój biznes «Это не твоё дело» — калька с английского. По-польски лучше To nie twoja sprawa." }
  - { kind: usage, text: "Прилагательное — biznesowy: spotkanie biznesowe «деловая встреча»." }
collocations:
  - { pl: "świat biznesu", ru: "мир бизнеса" }
  - { pl: "robić biznes", ru: "делать бизнес" }
  - { pl: "spotkanie biznesowe", ru: "деловая встреча" }
etymology: "Из английского business — недавнее заимствование. В русский «бизнес» пришёл тем же путём и примерно в то же время, поэтому слова совпадают полностью."
memory: "biznes — «бизнес», свежее английское заимствование в обоих языках. Помните исконную альтернативу interes «дело»: в быту она звучит естественнее. И осторожнее с калькой To nie twój biznes — по-польски лучше To nie twoja sprawa."
idioms:
  - { pl: "biznes to biznes", ru: "бизнес есть бизнес" }
  - { pl: "świat biznesu", ru: "мир бизнеса" }
  - { pl: "zrobić dobry interes", ru: "провернуть хорошее дело" }
formExamplesSkip:
  - { form: "biznesie", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
