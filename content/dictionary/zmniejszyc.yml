notes:
  - { kind: false-friend, text: "ZMNIEJSZYĆ — «уменьшить», от MNIEJSZY, «меньший». Русское «меньше» и польское MNIEJ — одно слово. Противоположность — ZWIĘKSZYĆ, «увеличить». «Уменьшить скорость» — ZWOLNIĆ, хотя ZMNIEJSZYĆ PRĘDKOŚĆ тоже правильно." }
  - { kind: usage, text: "Пятьдесят две формы: страдательное ZMNIEJSZONY — о величинах, «уменьшенный»; форма для мужчин-людей ZMNIEJSZENI в карточку не включена: людей не «уменьшают». Деепричастие ZMNIEJSZYWSZY. Видовой партнёр — ZMNIEJSZAĆ." }
  - { kind: government, text: "Что — винительный: ZMNIEJSZYĆ RYZYKO, DAWKĘ. На сколько — O с винительным: ZMNIEJSZYĆ O POŁOWĘ, O DZIESIĘĆ PROCENT. До скольких — DO с родительным: ZMNIEJSZYĆ DO MINIMUM." }
  - { kind: pronunciation, text: "Читается «змне́йшыць», три слога, ударение на предпоследнем. ZM — «зм», NIE — «не», J — «й», SZ — твёрдое «ш». Конечное Ć — «ць»." }
  - { kind: register, text: "Нейтральное слово экономики, медицины, техники. В быту: ZMNIEJSZ OGIEŃ, «убавь огонь», ZMNIEJSZ ZDJĘCIE, «уменьши фото». Книжнее — OGRANICZYĆ, «ограничить»." }
collocations:
  - { pl: "zmniejszyć koszty", ru: "сократить расходы" }
  - { pl: "zmniejszyć ryzyko", ru: "снизить риск" }
  - { pl: "zmniejszyć o połowę", ru: "уменьшить вдвое" }
family:
  - { pl: "zmniejszać", ru: "уменьшать", relation: aspect }
  - { pl: "mniejszy", ru: "меньший", relation: root }
  - { pl: "zwiększyć", ru: "увеличить", relation: antonym, id: zwiekszyc }
etymology: "От MNIEJSZY «меньший», сравнительной степени к MAŁY. Корень MIEŃ-/MNIEJ- тот же, что в русском «меньше», «менее», «уменьшить»."
memory: "Zmniejszyć — уменьшить: zmniejszyć koszty, głośność, o połowę. Zmniejszyć się — уменьшиться. Противоположность — zwiększyć. Читается «змне́йшыць»."
idioms:
  - { pl: "zmniejszyć do minimum", ru: "свести к минимуму" }
formExamplesSkip:
  - { form: "zmniejszeni", reason: "людей не «уменьшают»: формы для мужчин-людей нет" }
