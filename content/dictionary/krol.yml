# review
id: krol
format: 2
lemma: "król"
rank: 545
pos: noun
pron: { cyr: "круль" }
senses:
  - id: king
    ru: "король"
    note: "«Стать королём» требует творительного: zostać królem."
    examples:
      - pl: "Niech żyje król!"
        ru: "Да здравствует король!"
        source: { kind: tatoeba, id: 730604 }
      - pl: "Król jest chory."
        ru: "Король болен."
        source: { kind: tatoeba, id: 6484538 }
      - pl: "Król nadał mu tytuł szlachecki."
        ru: "Король присвоил ему дворянский титул."
        source: { kind: tatoeba, id: 6155811 }
  - id: king-fig
    ru: "король, царь (переносно)"
    note: "Lew jest królem zwierząt «Лев — царь зверей»."
    examples:
      - pl: "Lew jest królem zwierząt."
        ru: "Лев — царь зверей."
        source: { kind: tatoeba, id: 735867 }
      - pl: "Orzeł jest królem ptaków."
        ru: "Орёл - царь птиц."
        source: { kind: tatoeba, id: 2244772 }
      - pl: "Tom żyje jak król."
        ru: "Том живёт как король."
        source: { kind: tatoeba, id: 10631709 }
  - id: king-piece
    ru: "король (в картах и шахматах)"
    note: "В этом значении множественное — króle, а не królowie."
    examples:
      - pl: "Mam króla pik."
        ru: "У меня пиковый король."
        source: { kind: tatoeba, id: 10631716 }
      - pl: "Mam króla kier."
        ru: "У меня король червей."
        source: { kind: translated, id: 13630877 }
      - pl: "Króle leżały obok dam."
        ru: "Короли лежали рядом с дамами."
        source: { kind: authored }
notes:
  - { kind: usage, text: "Два множественных числа: królowie — о людях («короли»), króle — о фигурах в картах и шахматах." }
  - { kind: government, text: "«Стать королём» строится с творительным, как в русском: zostać królem, być dobrym królem." }
  - { kind: usage, text: "Женский род — królowa «королева», прилагательное — królewski «королевский», государство — królestwo «королевство»." }
  - { kind: usage, text: "Звательный падеж królu живёт в обращении: Panie królu!" }
collocations:
  - { pl: "niech żyje król", ru: "да здравствует король" }
  - { pl: "zostać królem", ru: "стать королём" }
  - { pl: "król Polski", ru: "король Польши" }
  - { pl: "żyć jak król", ru: "жить как король" }
family:
  - { pl: "królowa", ru: "королева", relation: derived }
  - { pl: "królestwo", ru: "королевство", relation: derived }
  - { pl: "królewski", ru: "королевский", relation: derived }
etymology: "Через праславянское *korlʹь от имени Карла Великого (Carolus) — ровно тем же путём, что и русское «король»."
memory: "król — «король», и слово то же, что русское: оба пошли от имени Карла Великого. Запомнить стоит два множественных числа: królowie — о людях, króle — о фигурах в картах и шахматах. Женский род — królowa, прилагательное — królewski, страна — królestwo. А «стать королём» требует творительного: zostać królem."
idioms:
  - { pl: "Niech żyje król!", ru: "Да здравствует король!" }
  - { pl: "żyć jak król", ru: "жить как король" }
  - { pl: "Umarł król, niech żyje król!", ru: "Король умер, да здравствует король!" }
