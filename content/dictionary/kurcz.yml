id: kurcz
format: 2
lemma: "kurcz"
rank: 4032
pos: noun
pron: { cyr: "курч" }
senses:
  - id: cramp
    ru: "судорога"
    examples:
      - pl: "Złapał mnie kurcz w łydce."
        ru: "У меня свело икру."
        source: { kind: authored }
      - pl: "Pływak dostał kurczu."
        ru: "У пловца началась судорога."
        source: { kind: authored }
      - pl: "Kurcz minął po kilku minutach."
        ru: "Судорога прошла через несколько минут."
        source: { kind: authored }
  - id: spasm
    ru: "спазм, сжатие (перен.)"
    examples:
      - pl: "Poczuł kurcz w żołądku ze strachu."
        ru: "От страха у него свело живот."
        source: { kind: authored }
      - pl: "Kurcz serca nie pozwalał mu mówić."
        ru: "Сжатие в сердце не давало ему говорить."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "KURCZ — «судорога», а не «курица»: курица — KURA, цыплёнок — KURCZAK. Чаще говорят SKURCZ: SKURCZ MIĘŚNIA. Восклицание KURCZĘ! — «блин!», совсем другое слово." }
  - { kind: usage, text: "Мужской род, неодушевлённое. Родительный — KURCZU. Множественное — KURCZE, родительный — KURCZÓW; вариант KURCZY не учим." }
  - { kind: government, text: "У меня судорога — ŁAPIE MNIE KURCZ, винительный. Получить судорогу — DOSTAĆ KURCZU, родительный. Судорога в ноге — KURCZ W NODZE, местный." }
  - { kind: pronunciation, text: "Читается «курч», один слог. RCZ на конце — «рч»." }
collocations:
  - { pl: "kurcz łydki", ru: "судорога в икре" }
  - { pl: "złapał mnie kurcz", ru: "у меня свело мышцу" }
  - { pl: "nocne kurcze", ru: "ночные судороги" }
family:
  - { pl: "skurcz", ru: "судорога, сокращение", relation: root, id: skurcz }
  - { pl: "mięsień", ru: "мышца", relation: root, id: miesien }
  - { pl: "ból", ru: "боль", relation: root, id: bol }
etymology: "От глагола KURCZYĆ «сжимать, корчить». Русское «корчиться», «корча» — того же корня."
memory: "Kurcz — судорога; курица — kura. Złapał mnie kurcz — меня свело. Kurczę! — блин! Читается «курч»."
idioms:
  - { pl: "łapie mnie kurcz", ru: "меня сводит судорога" }
formExamplesSkip:
  - { form: "kurczy", reason: "вариант родительного множественного, учим KURCZÓW" }
  - { form: "kurczu", cell: "Звательный", reason: "звательный падеж: для неодушевлённого существительного он практически не употребляется" }
