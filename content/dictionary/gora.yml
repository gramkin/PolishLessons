# review
id: gora
format: 2
lemma: "góra"
rank: 319
pos: noun
pron: { cyr: "гу́ра" }
senses:
  - id: mountain
    ru: "гора"
    examples:
      - pl: "Jaka wysoka góra!"
        ru: "Какая высокая гора!"
        source: { kind: tatoeba, id: 5369920 }
      - pl: "Góra jest pokryta śniegiem."
        ru: "Гора укрыта снегом."
        source: { kind: tatoeba, id: 353863 }
      - pl: "Jedni wolą morze, inni góry."
        ru: "Одни предпочитают море, другие — горы."
        source: { kind: tatoeba, id: 733096 }
  - id: top
    ru: "верх, наверх (в оборотах)"
    note: "z góry «сверху, заранее», do góry «вверх», na górę «наверх»."
    examples:
      - pl: "Z góry spadł kamień."
        ru: "Сверху упал камень."
        source: { kind: tatoeba, id: 956869 }
      - pl: "Nie patrz na innych z góry."
        ru: "Не смотри на других свысока."
        source: { kind: tatoeba, id: 577497 }
      - pl: "Wszystko jest do góry nogami."
        ru: "Всё вверх ногами."
        source: { kind: tatoeba, id: 383644 }
notes:
  - { kind: false-friend, text: "góra значит не только «гора», но и «верх»: na górę «наверх», na górze «наверху», do góry nogami «вверх ногами»." }
  - { kind: usage, text: "z góry значит «заранее»: z góry dziękuję «заранее спасибо»; patrzeć z góry — «смотреть свысока»." }
  - { kind: usage, text: "Направление и место различаются падежом: jadę w góry «еду в горы», jestem w górach «я в горах»." }
collocations:
  - { pl: "w góry", ru: "в горы" }
  - { pl: "na górze", ru: "наверху" }
  - { pl: "z góry dziękuję", ru: "заранее спасибо" }
  - { pl: "do góry nogami", ru: "вверх ногами" }
etymology: "Праславянское *gora — то же слово, что русское «гора»; значение «верх» сохранилось в обоих языках, ср. «в гору»."
memory: "góra — и «гора», и «верх»: idę na górę «иду наверх», z góry dziękuję «заранее спасибо», do góry nogami «вверх ногами»."
idioms:
  - { pl: "brać górę", ru: "брать верх" }
  - { pl: "głowa do góry", ru: "выше нос!" }
  - { pl: "do góry nogami", ru: "вверх ногами" }
formExamplesSkip:
  - { form: "góro", reason: "звательный падеж от этого слова в живой речи не употребляется" }
