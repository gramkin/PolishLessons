# review
id: pokonac
format: 2
lemma: "pokonać"
rank: 1120
pos: verb
aspect: perf
pron: { cyr: "поко́наць" }
senses:
  - id: defeat
    ru: "победить, одолеть"
    examples:
      - pl: "Pokonał go z łatwością."
        ru: "Он легко его победил."
        source: { kind: translated, id: 914658 }
      - pl: "Pokonaliśmy nieprzyjaciela."
        ru: "Мы победили противника."
        source: { kind: translated, id: 999206 }
      - pl: "Pokonałem go w szachach."
        ru: "Я обыграл его в шахматы."
        source: { kind: translated, id: 369264 }
  - id: overcome
    ru: "преодолеть (трудности, страх, расстояние)"
    examples:
      - pl: "Będzie musiał jeszcze pokonać wiele trudności."
        ru: "Ему ещё предстоит преодолеть огромные трудности."
        source: { kind: tatoeba, id: 365411 }
      - pl: "Mogą pokonać swój strach."
        ru: "Они могут побороть свой страх."
        source: { kind: translated, id: 2587151 }
      - pl: "Ludzkość pokonała liczne trudności."
        ru: "Человечество преодолело множество трудностей."
        source: { kind: translated, id: 852965 }
  - id: defeated
    ru: "pokonany — побеждённый, разбитый"
    examples:
      - pl: "Francuzi zostali pokonani pod Waterloo."
        ru: "Французы были разбиты под Ватерлоо."
        source: { kind: translated, id: 629877 }
      - pl: "Pokonana armia wycofała się z tego kraju."
        ru: "Разбитая армия ушла из этой страны."
        source: { kind: translated, id: 639819 }
notes:
  - { kind: government, text: "pokonać kogoś — винительный падеж без предлога, ровно как русское «победить кого-то»." }
  - { kind: usage, text: "Второе значение шире русского «победить»: pokonać trudności «преодолеть трудности», pokonać strach «побороть страх», pokonać dystans «преодолеть расстояние»." }
  - { kind: usage, text: "Несовершенный вид — pokonywać. Производное niepokonany значит «непобедимый»." }
  - { kind: usage, text: "Причастие pokonany работает как существительное во множественном: pokonani «побеждённые»." }
collocations:
  - { pl: "pokonać wroga", ru: "победить врага" }
  - { pl: "pokonać trudności", ru: "преодолеть трудности" }
  - { pl: "pokonać strach", ru: "побороть страх" }
  - { pl: "zostać pokonanym", ru: "быть побеждённым" }
family:
  - { pl: "pokonywać", ru: "побеждать (несовершенный вид)", relation: aspect }
  - { pl: "niepokonany", ru: "непобедимый", relation: derived }
etymology: "Приставка po- плюс konać «кончать, довершать» — буквально «докончить, одолеть». Родственно русским «кончить» и «конец»."
memory: "pokonać — «победить» и «преодолеть» сразу: pokonać wroga «победить врага», но и pokonać strach «побороть страх», pokonać dystans «преодолеть расстояние». Дополнение в винительном, без предлога."
idioms:
  - { pl: "pokonać trudności", ru: "преодолеть трудности" }
  - { pl: "nie dać się pokonać", ru: "не дать себя победить" }
formExamplesSkip:
  - { form: "pokonawszy", reason: "книжное деепричастие прошедшего времени; в живой речи не употребляется" }
