# review
id: dodzwonic
format: 2
lemma: "dodzwonić"
rank: 4047
pos: verb
pron: { cyr: "додзво́ниць" }
senses:
  - id: get-through
    ru: "с SIĘ — дозвониться"
    examples:
      - pl: "Nie mogę się dodzwonić do mamy."
        ru: "Я не могу дозвониться до мамы."
        source: { kind: authored }
      - pl: "Dodzwoniła się do lekarza dopiero po godzinie."
        ru: "Она дозвонилась до врача только через час."
        source: { kind: authored }
      - pl: "Dodzwoń się do urzędu i zapytaj."
        ru: "Дозвонись в учреждение и спроси."
        source: { kind: authored }
  - id: call-in
    ru: "с SIĘ — дозвониться в эфир, на горячую линию"
    examples:
      - pl: "Słuchacz dodzwonił się do studia."
        ru: "Слушатель дозвонился в студию."
        source: { kind: authored }
      - pl: "Pierwsza osoba, która się dodzwoni, wygra bilety."
        ru: "Первый, кто дозвонится, выиграет билеты."
        source: { kind: authored }
notes:
  - { kind: false-friend, text: "DODZWONIĆ SIĘ — «дозвониться», как в русском, и почти всегда с SIĘ. Просто «позвонить» — ZADZWONIĆ. NIE MOGĘ SIĘ DODZWONIĆ — «не могу дозвониться»." }
  - { kind: usage, text: "Сорок одна форма: безличная DODZWONIONO не употребляется. Будущее: DODZWONIĘ SIĘ, DODZWONISZ SIĘ, повелительное DODZWOŃ SIĘ. Несовершенный вид — DODZWANIAĆ SIĘ, редкий." }
  - { kind: government, text: "К кому или куда — DO с родительным: DO MAMY, DO URZĘDU, DO STUDIA. По какому номеру — POD с винительным: DODZWONIĆ SIĘ POD TEN NUMER." }
  - { kind: pronunciation, text: "Читается «додзво́ниць»: DZ — «дз», ударение на предпоследнем слоге. DODZWONIĘ — «додзво́нье», DODZWOŃ — «до́дзвонь»." }
  - { kind: register, text: "Нейтральное бытовое слово. DODZWONIĆ SIĘ DO URZĘDU GRANICZY Z CUDEM — шутливая жалоба на вечно занятые телефоны." }
collocations:
  - { pl: "dodzwonić się do kogoś", ru: "дозвониться до кого-то" }
  - { pl: "nie mogę się dodzwonić", ru: "не могу дозвониться" }
  - { pl: "dodzwonić się do studia", ru: "дозвониться в студию" }
family:
  - { pl: "dzwonić", ru: "звонить", relation: root, id: dzwonic }
  - { pl: "zadzwonić", ru: "позвонить", relation: derived, id: zadzwonic }
  - { pl: "dzwonek", ru: "звонок", relation: derived, id: dzwonek }
etymology: "Приставка DO- «до-» плюс DZWONIĆ «звонить», праславянское *zvoniti. Русское «дозвониться» — то же слово; польское DZ на месте русского «з»."
memory: "Dodzwonić się — дозвониться: nie mogę się dodzwonić do mamy. Zadzwonić — позвонить. Читается «додзво́ниць»."
idioms:
  - { pl: "dodzwonić się graniczy z cudem", ru: "дозвониться — это просто чудо" }
formExamplesSkip:
  - { form: "dodzwoniono", reason: "безличная форма неупотребительна" }
