# review
id: obiad
format: 2
lemma: "obiad"
rank: 910
pos: noun
pron: { cyr: "о́бят" }
senses:
  - id: dinner
    ru: "обед — главная еда дня (обычно с 13 до 17 часов)"
    note: "По времени и сытности ближе к русскому «обеду», но едят его позже."
    examples:
      - pl: "Obiad gotów."
        ru: "Обед готов."
        source: { kind: tatoeba, id: 356494 }
      - pl: "Zrobiłaś obiad?"
        ru: "Ты обед приготовила?"
        source: { kind: tatoeba, id: 12470517 }
      - pl: "Co chcesz na obiad?"
        ru: "Что ты хочешь на обед?"
        source: { kind: tatoeba, id: 356427 }
  - id: before-after
    ru: "przed obiadem, po obiedzie — до обеда, после обеда"
    examples:
      - pl: "Myję ręce przed obiadem."
        ru: "Я мою руки перед ланчем."
        source: { kind: tatoeba, id: 792330 }
      - pl: "Po obiedzie zmorzył mnie sen."
        ru: "Меня разморило после обеда."
        source: { kind: tatoeba, id: 12760640 }
      - pl: "Wychodzę po obiedzie."
        ru: "Я ухожу после обеда."
        source: { kind: translated, id: 361879 }
  - id: meals
    ru: "об обедах как о еде вообще"
    examples:
      - pl: "Czy macie w szkole obiady?"
        ru: "У вас в школе есть обеды?"
        source: { kind: translated, id: 2774718 }
      - pl: "Czy obiady są wliczone w cenę wycieczki?"
        ru: "Обеды входят в стоимость поездки?"
        source: { kind: translated, id: 533641 }
      - pl: "Ona robi zdrowe obiady dla całej rodziny."
        ru: "Она готовит здоровые обеды для всей семьи."
        source: { kind: translated, id: 612974 }
notes:
  - { kind: false-friend, text: "Слово то же, что русское «обед», но время другое: поляки едят obiad позже, обычно между часом и пятью, и это главная, самая сытная еда дня. Поэтому его нередко переводят на английский как dinner, а не lunch." }
  - { kind: usage, text: "Полный порядок приёмов пищи: śniadanie «завтрак» — obiad «обед» — kolacja «ужин». Иногда между завтраком и обедом вставляют drugie śniadanie «второй завтрак»." }
  - { kind: government, text: "na obiad «на обед» — винительный: Co chcesz na obiad?; przed obiadem «до обеда» и po obiedzie «после обеда» — творительный и предложный." }
  - { kind: usage, text: "Идиома musztarda po obiedzie — буквально «горчица после обеда», то есть «дорога ложка к обеду»: помощь пришла слишком поздно." }
collocations:
  - { pl: "na obiad", ru: "на обед" }
  - { pl: "zrobić obiad", ru: "приготовить обед" }
  - { pl: "po obiedzie", ru: "после обеда" }
  - { pl: "musztarda po obiedzie", ru: "дорога ложка к обеду" }
family:
  - { pl: "jeść", ru: "есть", relation: root, id: jesc }
  - { pl: "obiadowy", ru: "обеденный", relation: derived }
etymology: "Праславянское *obědъ, от *ob- + *ěsti «есть». Русское «обед» — то же самое слово, и родственники есть во всех славянских: чешское oběd, украинское обід."
memory: "obiad — «обед», слово общеславянское и родное. Но время другое: поляки едят obiad между часом и пятью, и это главная еда дня. Порядок такой: śniadanie — obiad — kolacja. И запомните musztarda po obiedzie — «дорога ложка к обеду»."
idioms:
  - { pl: "na obiad", ru: "на обед" }
  - { pl: "po obiedzie", ru: "после обеда" }
  - { pl: "musztarda po obiedzie", ru: "дорога ложка к обеду" }
