# review
id: naukowiec
format: 2
lemma: "naukowiec"
rank: 1940
pos: noun
pron: { cyr: "науко́вец" }
senses:
  - id: scientist
    ru: "учёный"
    examples:
      - pl: "Naukowiec gloryfikował swój kraj."
        ru: "Учёный прославлял свою страну."
        source: { kind: translated, id: 2309443 }
      - pl: "Naukowiec próbował odkryć prawa natury."
        ru: "Учёный пытался открыть законы природы."
        source: { kind: translated, id: 393340 }
      - pl: "Jest wszystkim znany jako świetny naukowiec."
        ru: "Он всем известен как прекрасный учёный."
        source: { kind: translated, id: 3035926 }
  - id: be-scientist
    ru: "учёный (быть, стать; о людях науки)"
    examples:
      - pl: "Myślałam, że jesteś naukowcem."
        ru: "Я думала, что ты учёный."
        source: { kind: tatoeba, id: 13783053 }
      - pl: "Powiedział, że chciałby zostać naukowcem."
        ru: "Он сказал, что хотел бы стать учёным."
        source: { kind: tatoeba, id: 415297 }
      - pl: "Naukowcy znaleźli wodę na Marsie."
        ru: "Учёные нашли воду на Марсе."
        source: { kind: tatoeba, id: 5406452 }
notes:
  - { kind: government, text: "После być и zostać — творительный падеж: jest naukowcem «он учёный», chce zostać naukowcem «хочет стать учёным»." }
  - { kind: usage, text: "Слово образовано от nauka «наука» с суффиксом -owiec, как sportowiec «спортсмен» и budowlaniec «строитель»." }
  - { kind: false-friend, text: "Русское «учёный» по форме прилагательное, а польское naukowiec — обычное существительное мужского рода. Старое uczony в польском тоже есть, но звучит книжно." }
  - { kind: usage, text: "Женский вариант обычно передают словом pani naukowiec или просто naukowiec: Mary jest genialną panią naukowiec." }
collocations:
  - { pl: "zostać naukowcem", ru: "стать учёным" }
  - { pl: "wielki naukowiec", ru: "великий учёный" }
  - { pl: "naukowcy twierdzą", ru: "учёные утверждают" }
family:
  - { pl: "nauka", ru: "наука", relation: root, id: nauka }
  - { pl: "naukowy", ru: "научный", relation: root }
  - { pl: "uczony", ru: "учёный (книжн.)", relation: root }
etymology: "От nauka «наука» с суффиксом -owiec, как sportowiec «спортсмен». Русское «учёный» — прилагательное по форме, польское слово обычное существительное."
memory: "naukowiec — «учёный». После zostać — творительный: chce zostać naukowcem. Образовано от nauka, как sportowiec от sport."
idioms:
  - { pl: "zostać naukowcem", ru: "стать учёным" }
  - { pl: "wielki naukowiec", ru: "великий учёный" }
  - { pl: "naukowcy twierdzą", ru: "учёные утверждают" }
