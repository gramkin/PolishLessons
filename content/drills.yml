# Тренажёры: предложения из словаря с пропущенной формой.
# Ячейки — заголовки таблиц из content/forms (table совпадает по началу строки).
# require проверяется на тексте до пропуска.
# Лекции подключают тренажёр компонентом ::drill{id="..."}.
drills:
  - id: verb-present
    title: Настоящее время
    instruction: Поставьте глагол в нужную форму настоящего времени.
    pos: verb
    cells: [{ table: Настоящее время }]
    # Генератор иногда подписывает будущее совершенных глаголов как настоящее (zginąć).
    aspect: imperf
    hint: person

  - id: noun-acc-sg
    title: Винительный падеж
    instruction: Поставьте существительное в винительный падеж.
    pos: noun
    cells: [{ table: Склонение, row: Винительный, column: Ед. ч. }]

  - id: noun-gen
    title: Родительный падеж
    instruction: Поставьте существительное в родительный падеж.
    pos: noun
    cells: [{ table: Склонение, row: Родительный, column: Ед. ч. }]

  - id: noun-gen-negation
    title: Родительный после отрицания
    instruction: Поставьте существительное в нужный падеж. Во всех предложениях есть nie.
    pos: noun
    cells: [{ table: Склонение, row: Родительный, column: Ед. ч. }]
    # Отрицание стоит до пропуска.
    require: "(?<!\\p{L})nie(?!\\p{L})"

  - id: noun-gen-verbs
    title: Глаголы и предлоги с родительным
    instruction: Поставьте существительное в нужный падеж после глагола или предлога.
    pos: noun
    cells: [{ table: Склонение, row: Родительный, column: Ед. ч. }]
    require: "(?<!\\p{L})(?:słucha|szuka|potrzebuj|używa|boj|boi|bał|uczy|uczę|obok|oprócz|według|bez|dla)"

  - id: noun-inst
    title: Творительный падеж
    instruction: Поставьте существительное в творительный падеж.
    pos: noun
    cells: [{ table: Склонение, row: Творительный, column: Ед. ч. }]

  - id: noun-loc
    title: Предложный падеж
    instruction: Поставьте существительное в предложный падеж.
    pos: noun
    cells: [{ table: Склонение, row: Предложный, column: Ед. ч. }]

  - id: noun-dat
    title: Дательный падеж
    instruction: Поставьте существительное в дательный падеж.
    pos: noun
    cells: [{ table: Склонение, row: Дательный, column: Ед. ч. }]

  - id: noun-voc
    title: Звательный падеж
    instruction: Поставьте существительное в звательный падеж — форму обращения.
    pos: noun
    cells: [{ table: Склонение, row: Звательный, column: Ед. ч. }]
    # Только люди: у неодушевлённых слов звательный звучит как олицетворение.
    cards: [mama, tata, pan, corka, siostra, kolega, kolezanka, przyjaciolka, babcia, chlopiec, dziewczyna, mamusia, panna, panienka, mezczyzna, kobieta, sasiadka, kierowca, nauczycielka, studentka, ciocia, krolowa, ksiadz, ojciec, matka, zona]
    maxRank: 5400

  - id: noun-prepositions
    title: Предлоги и падежи
    instruction: Поставьте существительное в падеж, которого требует предлог и смысл — «где», «куда», «откуда» или «с кем».
    pos: noun
    cells:
      - { table: Склонение, row: Винительный, column: Ед. ч. }
      - { table: Склонение, row: Предложный, column: Ед. ч. }
      - { table: Склонение, row: Творительный, column: Ед. ч. }
      - { table: Склонение, row: Родительный, column: Ед. ч. }
    # Предлог прямо перед пропуском или через одно слово (na tym stole).
    require: "(?:^|\\s)(?:w|we|na|z|ze|pod|nad|przed|za|do|po|o)\\s+(?:\\p{L}+\\s+)?$"

  - id: verb-past
    title: Прошедшее время
    instruction: Поставьте глагол в прошедшее время — для того лица, что указано в скобках.
    pos: verb
    cells: [{ table: Прошедшее время }]
    hint: person

  - id: verb-past-plural
    title: «-li» или «-ły»
    instruction: Поставьте глагол в прошедшее время множественного числа. В скобках сказано, есть ли в группе мужчины.
    pos: verb
    cells: [{ table: Прошедшее время (мн. ч.) }]
    hint: person

  - id: verb-past-irregular
    title: Неправильное прошедшее время
    instruction: Поставьте глагол в прошедшее время. У всех этих глаголов основа меняется.
    pos: verb
    cells: [{ table: Прошедшее время }]
    cards: [isc, pojsc, przyjsc, wyjsc, wejsc, dojsc, odejsc, moc, jesc, zjesc, zaczac, wiedziec, wziac]
    maxRank: 5400
    hint: person

  - id: verb-future-simple
    title: Простое будущее время
    instruction: Поставьте совершенный глагол в будущее время.
    pos: verb
    cells: [{ table: Простое будущее время }]
    aspect: perf
    hint: person

  - id: adj-comparative
    title: Сравнительная степень
    instruction: Поставьте прилагательное в сравнительную или превосходную степень.
    pos: adj
    cells:
      - { table: Степени сравнения, row: Сравнительная }
      - { table: Степени сравнения, row: Превосходная }
    # Таблицы степеней сгенерированы по правилу и ошибаются на исключениях (pusty → «puściejszy»
    # вместо pustszy), поэтому берём только предложения из Tatoeba: их формы взяты из живого текста.
    sourcedOnly: true

  - id: adj-irregular
    title: Неправильные степени сравнения
    instruction: Поставьте прилагательное в сравнительную или превосходную степень.
    pos: adj
    cells:
      - { table: Степени сравнения, row: Сравнительная }
      - { table: Степени сравнения, row: Превосходная }
    cards: [dobry, zly, duzy, maly, wysoki]
    maxRank: 5400

  # Фаза 1 (главы 6–18). Отобраны по размеру пула и проверены на образцах; не вошли
  # именительный мн. ч., прилагательные мн. ч., притяжательные, swój и który: почти все их
  # формы занимают несколько клеток парадигмы, и надёжных предложений не набирается.
  - id: verb-present-sie
    title: Возвратные глаголы
    instruction: Поставьте возвратный глагол в нужную форму настоящего времени.
    pos: verb
    cells: [{ table: Настоящее время }]
    aspect: imperf
    hint: person
    require: "(?<!\\p{L})się(?!\\p{L})"
    cards: [bac, smiac, uczyc, podobac, spotykac, myc, ubierac, cieszyc, nazywac, spozniac, spieszyc, zaczynac, otwierac]
    maxRank: 5400

  - id: noun-gen-pl
    title: Родительный падеж множественного числа
    instruction: Поставьте существительное в родительный падеж множественного числа.
    pos: noun
    cells: [{ table: Склонение, row: Родительный, column: Мн. ч. }]

  - id: noun-oblique-pl
    title: Дательный, творительный и предложный во множественном
    instruction: Поставьте существительное в нужный падеж множественного числа — -om, -ami или -ach.
    pos: noun
    cells:
      - { table: Склонение, row: Дательный, column: Мн. ч. }
      - { table: Склонение, row: Творительный, column: Мн. ч. }
      - { table: Склонение, row: Предложный, column: Мн. ч. }

  - id: num-gen-pl
    title: Пять и больше
    instruction: После числительного от пяти — родительный падеж множественного числа.
    pos: noun
    cells: [{ table: Склонение, row: Родительный, column: Мн. ч. }]
    require: "(?<!\\p{L})(?:pięć|sześć|siedem|osiem|dziewięć|dziesięć|\\p{L}+naście|\\p{L}+dziesiąt|sto|ile)\\s+$"

  - id: verb-motion-present
    title: Глаголы движения
    instruction: Поставьте глагол движения в нужную форму настоящего времени.
    pos: verb
    cells: [{ table: Настоящее время }]
    aspect: imperf
    hint: person
    cards: [isc, chodzic, jechac, jezdzic, niesc, nosic, leciec, latac, biec, biegac, plynac, plywac]
    maxRank: 5400

  - id: verb-motion-prefixed
    title: Приставочные глаголы движения
    instruction: Поставьте глагол в прошедшее время — для того лица, что указано в скобках.
    pos: verb
    cells: [{ table: Прошедшее время }]
    hint: person
    cards: [przyjsc, wyjsc, wejsc, dojsc, odejsc, przejsc, zejsc, przyjechac, wyjechac, przychodzic, wychodzic, wchodzic]
    maxRank: 5400

  - id: verb-imperative
    title: Повелительное наклонение
    instruction: Поставьте глагол в повелительное наклонение — для того, к кому обращаются.
    pos: verb
    cells:
      - { table: Повелительное наклонение, row: "2-е л. ед. ч." }
      - { table: Повелительное наклонение, row: "1-е л. мн. ч." }
      - { table: Повелительное наклонение, row: "2-е л. мн. ч." }
    hint: person

  - id: verb-imperative-negation
    title: Запрет — nie и несовершенный вид
    instruction: После nie поставьте несовершенный глагол в повелительное наклонение.
    pos: verb
    cells: [{ table: Повелительное наклонение, row: "2-е л. ед. ч." }]
    aspect: imperf
    hint: person
    require: "(?<!\\p{L})nie\\s+$"

  - id: verb-conditional
    title: Условное наклонение
    instruction: Поставьте глагол в условное наклонение — для того лица, что указано в скобках.
    pos: verb
    cells: [{ table: Условное наклонение }]
    hint: person


  # Фаза 4 (углубление старых уроков).
  - id: noun-gender
    title: Род существительных
    instruction: Поставьте перед словом ten, ta или to.
    pos: noun
    cells: [{ table: Склонение }]
    kind: gender
    maxRank: 1500

  - id: adj-agreement
    title: Согласование прилагательных
    instruction: Согласуйте прилагательное с существительным в роде, числе и падеже.
    pos: adj
    # Окончания прилагательных общие для нескольких клеток (nową — винительный и творительный),
    # поэтому берём форму целиком из склонения, а решает соседнее существительное.
    # Только единственное число: во множественном (duzi / duże) и в «Jestem ___» род
    # из предложения не виден. После пропуска должно идти слово, с которым прилагательное
    # согласуется, а не предлог или союз.
    cells:
      - { table: Склонение, column: м. р. (личн./одуш.) }
      - { table: Склонение, column: м. р. (неодуш.) }
      - { table: Склонение, column: ж. р. }
      - { table: Склонение, column: ср. р. }
    syncretic: true
    requireAfter: "^\\s+(?!(?:dla|bez|przez|przy|nad|pod|przed|jak|niż|od|do|na|po|za|we?|ze?|i|a|że|to|jest|są|się|nie)(?!\\p{L}))\\p{L}{3,}"

  - id: verb-aspect-past
    title: Вид в прошедшем времени
    instruction: Выберите вид глагола и поставьте его в прошедшее время.
    pos: verb
    cells: [{ table: Прошедшее время }]
    hint: aspect

  # Фаза 6 (B1). Только предложения из Tatoeba: в авторских примерах карточек деепричастия
  # и причастия часто переведены другим видом («Dostając» → «Получив»), а генератор форм
  # даёт несуществующие формы (kupiący). У -wszy таких предложений всего 16.
  - id: participle-active
    title: Причастие на -ący
    instruction: Поставьте глагол в форму действительного причастия на -ący.
    pos: verb
    cells: [{ table: Причастия, row: Действительное }]
    sourcedOnly: true
    # Действительное причастие бывает только у несовершенного вида; генератор форм даёт его
    # и совершенным глаголам (kupiący).
    aspect: imperf

  - id: participle-passive
    title: Страдательное причастие
    instruction: Поставьте глагол в форму страдательного причастия (-ny, -ony, -ty).
    pos: verb
    cells: [{ table: Причастия, row: Страдательное }]
    sourcedOnly: true
    aspect: perf

  - id: adverbial-present
    title: Деепричастие на -ąc
    instruction: Поставьте глагол в форму деепричастия на -ąc («читая»).
    pos: verb
    cells: [{ table: Деепричастия, row: Одновременное }]
    sourcedOnly: true
    aspect: imperf

  - id: adverbial-anterior
    title: Деепричастие на -wszy
    instruction: Поставьте глагол в форму деепричастия на -wszy («сделав»).
    pos: verb
    cells: [{ table: Деепричастия, row: Предшествующее }]
    sourcedOnly: true
    aspect: perf

  - id: verb-impersonal
    title: Безличная форма на -no/-to
    instruction: Поставьте глагол в безличную форму прошедшего времени (zrobiono, zamknięto).
    pos: verb
    cells: [{ table: Безличная форма }]
    sourcedOnly: true

  - id: verbal-noun
    title: Отглагольное существительное
    instruction: Образуйте от глагола существительное на -anie, -enie или -cie.
    pos: verb
    cells: [{ table: Отглагольное существительное }]
    sourcedOnly: true

  # Фаза 8 (B2). Dative and instrumental only: the genitive and locative -u forms also fill the
  # masculine-personal nominative cell, so they never fill exactly one case. Explicit columns
  # leave out the collectives (dwojgiem); `cards` keeps out ordinals and rows like
  # «między siedmioma a dziewiątym». A noun must follow the gap.
  - id: num-oblique
    title: Числительные в дательном и творительном
    instruction: Поставьте числительное в дательный или творительный падеж — смотрите на предлог, глагол и род существительного.
    pos: num
    cells:
      - { table: Склонение, row: Дательный, column: мужско-личный }
      - { table: Склонение, row: Дательный, column: м. и ср. р. }
      - { table: Склонение, row: Дательный, column: ж. р. }
      - { table: Склонение, row: Творительный, column: мужско-личный }
      - { table: Склонение, row: Творительный, column: м. и ср. р. }
      - { table: Склонение, row: Творительный, column: ж. р. }
    syncretic: true
    requireAfter: "^\\s+(?!a(?!\\p{L}))\\p{L}"
    cards: [dwa, trzy, cztery, piec, szesc, siedem, osiem, dziewiec, dziesiec, dwanascie, pietnascie, dwadziescia, trzydziesci, czterdziesci, piecdziesiat, sto, oba, kilka, ile]
    maxRank: 6000
