paragraphs:
  - clean: "Jak daleko sięgałem wzrokiem, cały świat ukazywał to samo bujne bogactwo co dolina Tamizy. Z każdego wzgórza, na które się wspiąłem, widziałem tę samą obfitość wspaniałych budowli, nieskończenie różnorodnych pod względem materiału i stylu, te same skupiska wiecznie zielonych zarośli, te same obsypane kwieciem drzewa i paprocie drzewiaste. Tu i ówdzie lśniła jak srebro woda, a dalej ziemia wznosiła się w błękitne, faliste wzgórza i rozpływała się w pogodzie nieba. Szczególną cechą, która wkrótce przyciągnęła moją uwagę, była obecność pewnych okrągłych studni, z których kilka, jak mi się zdawało, było bardzo głębokich."
    en: "“So far as I could see, all the world displayed the same exuberant richness as the Thames valley. From every hill I climbed I saw the same abundance of splendid buildings, endlessly varied in material and style, the same clustering thickets of evergreens, the same blossom-laden trees and tree ferns. Here and there water shone like silver, and beyond, the land rose into blue undulating hills, and so faded into the serenity of the sky. A peculiar feature, which presently attracted my attention, was the presence of certain circular wells, several, as it seemed to me, of a very great depth."
    draft: true
    chunks:
      - pl: "Jak daleko sięgałem wzrokiem, cały świat ukazywał to samo bujne bogactwo co dolina Tamizy."
        ru: "Насколько хватало глаз, весь мир являл то же пышное богатство, что и долина Темзы."
        note: "bujny — пышный, буйный"
      - pl: " Z każdego wzgórza, na które się wspiąłem, widziałem tę samą obfitość wspaniałych budowli, nieskończenie różnorodnych pod względem materiału i stylu,"
        ru: "С каждого холма, на который я поднимался, я видел то же изобилие великолепных зданий, бесконечно разнообразных по материалу и стилю,"
        note: "różnorodny — разнообразный"
      - pl: " te same skupiska wiecznie zielonych zarośli, te same obsypane kwieciem drzewa i paprocie drzewiaste."
        ru: "те же скопления вечнозелёных зарослей, те же усыпанные цветами деревья и древовидные папоротники."
        note: "paproć — папоротник; zarośla — заросли"
      - pl: " Tu i ówdzie lśniła jak srebro woda, a dalej ziemia wznosiła się w błękitne, faliste wzgórza i rozpływała się w pogodzie nieba."
        ru: "Кое-где серебром блестела вода, а дальше земля поднималась голубыми волнистыми холмами и растворялась в ясности неба."
        note: "falisty — волнистый; rozpływać się — растворяться"
      - pl: " Szczególną cechą, która wkrótce przyciągnęła moją uwagę, była obecność pewnych okrągłych studni, z których kilka, jak mi się zdawało, było bardzo głębokich."
        ru: "Особенностью, которая вскоре привлекла моё внимание, было наличие неких круглых колодцев, и некоторые из них, как мне показалось, были очень глубоки."
        note: "cecha — черта, особенность"
    words: { "bogactwo": bogactwo, "wspiąłem": wspiac, "srebro": srebro, "wznosiła": wznosic, "okrągłych": okragly, "studni": studnia }
  - clean: "Jedna leżała przy ścieżce pod górę, którą szedłem podczas pierwszego spaceru. Jak inne, miała obrzeże z brązu, osobliwie kute, i była osłonięta przed deszczem małą kopułą. Siedząc przy tych studniach i zaglądając w ciemność szybu, nie widziałem żadnego połysku wody ani nie mogłem wywołać odbicia zapaloną zapałką. Ale we wszystkich słyszałem pewien dźwięk: łup — łup — łup, jak bicie jakiejś wielkiej maszyny; i odkryłem po płomieniu zapałek, że szybami w dół płynie równy prąd powietrza."
    en: "One lay by the path up the hill which I had followed during my first walk. Like the others, it was rimmed with bronze, curiously wrought, and protected by a little cupola from the rain. Sitting by the side of these wells, and peering down into the shafted darkness, I could see no gleam of water, nor could I start any reflection with a lighted match. But in all of them I heard a certain sound: a thud—thud—thud, like the beating of some big engine; and I discovered, from the flaring of my matches, that a steady current of air set down the shafts."
    draft: true
    chunks:
      - pl: "Jedna leżała przy ścieżce pod górę, którą szedłem podczas pierwszego spaceru."
        ru: "Один из них находился у тропы в гору, по которой я шёл во время первой прогулки."
      - pl: " Jak inne, miała obrzeże z brązu, osobliwie kute, i była osłonięta przed deszczem małą kopułą."
        ru: "Как и другие, он был окаймлён бронзой причудливой ковки и защищён от дождя маленьким куполом."
        note: "obrzeże — край, кромка; kuty — кованый"
      - pl: " Siedząc przy tych studniach i zaglądając w ciemność szybu, nie widziałem żadnego połysku wody ani nie mogłem wywołać odbicia zapaloną zapałką."
        ru: "Сидя у этих колодцев и заглядывая в темноту шахты, я не видел никакого блеска воды и не мог вызвать отражения зажжённой спичкой."
        note: "szyb — шахта; odbicie — отражение"
      - pl: " Ale we wszystkich słyszałem pewien dźwięk: łup — łup — łup, jak bicie jakiejś wielkiej maszyny;"
        ru: "Но во всех я слышал некий звук: бух — бух — бух, будто стучала какая-то большая машина;"
      - pl: " i odkryłem po płomieniu zapałek, że szybami w dół płynie równy prąd powietrza."
        ru: "и по пламени спичек я обнаружил, что в шахты вниз идёт ровный поток воздуха."
    words: { "spaceru": spacer, "studniach": studnia, "wywołać": wywolac, "płomieniu": plomien, "prąd": prad }
  - clean: "Co więcej, wrzuciłem skrawek papieru w gardziel jednej z nich, i zamiast powoli opadać, trzepocząc, został natychmiast szybko wessany i zniknął mi z oczu."
    en: "Further, I threw a scrap of paper into the throat of one, and, instead of fluttering slowly down, it was at once sucked swiftly out of sight."
    draft: true
    chunks:
      - pl: "Co więcej, wrzuciłem skrawek papieru w gardziel jednej z nich, i zamiast powoli opadać, trzepocząc, został natychmiast szybko wessany i zniknął mi z oczu."
        ru: "Более того, я бросил клочок бумаги в жерло одного из них, и вместо того чтобы медленно опускаться, порхая, он тут же был стремительно втянут и исчез из виду."
        note: "gardziel — горловина, жерло; wessać — всосать"
    words: { "wrzuciłem": wrzucic, "papieru": papier, "powoli": powoli, "natychmiast": natychmiast, "zniknął": zniknac, "oczu": oko }
  - clean: "Po pewnym czasie zacząłem też łączyć te studnie z wysokimi wieżami, stojącymi tu i ówdzie na zboczach; nad nimi bowiem często drgało powietrze, tak jak widzi się to w upalny dzień nad spieczoną słońcem plażą. Zestawiając fakty, doszedłem do silnego przypuszczenia, że istnieje rozległy system podziemnej wentylacji, którego prawdziwe przeznaczenie trudno było sobie wyobrazić. Z początku skłonny byłem wiązać go z urządzeniami sanitarnymi tych ludzi. Był to oczywisty wniosek, ale zupełnie błędny."
    en: "“After a time, too, I came to connect these wells with tall towers standing here and there upon the slopes; for above them there was often just such a flicker in the air as one sees on a hot day above a sun-scorched beach. Putting things together, I reached a strong suggestion of an extensive system of subterranean ventilation, whose true import it was difficult to imagine. I was at first inclined to associate it with the sanitary apparatus of these people. It was an obvious conclusion, but it was absolutely wrong."
    draft: true
    chunks:
      - pl: "Po pewnym czasie zacząłem też łączyć te studnie z wysokimi wieżami, stojącymi tu i ówdzie na zboczach;"
        ru: "Через некоторое время я стал связывать эти колодцы с высокими башнями, стоявшими тут и там на склонах;"
      - pl: " nad nimi bowiem często drgało powietrze, tak jak widzi się to w upalny dzień nad spieczoną słońcem plażą."
        ru: "ведь над ними часто дрожал воздух, как это бывает в жаркий день над раскалённым солнцем пляжем."
        note: "spieczony — опалённый, иссушенный"
      - pl: " Zestawiając fakty, doszedłem do silnego przypuszczenia, że istnieje rozległy system podziemnej wentylacji, którego prawdziwe przeznaczenie trudno było sobie wyobrazić."
        ru: "Сопоставляя факты, я пришёл к сильному предположению, что существует обширная система подземной вентиляции, истинное назначение которой трудно было вообразить."
        note: "zestawiać — сопоставлять; rozległy — обширный"
      - pl: " Z początku skłonny byłem wiązać go z urządzeniami sanitarnymi tych ludzi."
        ru: "Сначала я был склонен связать её с санитарными устройствами этих людей."
      - pl: " Był to oczywisty wniosek, ale zupełnie błędny."
        ru: "Это был очевидный вывод, но совершенно ошибочный."
        note: "wniosek — вывод"
    words: { "studnie": studnia, "podziemnej": podziemny, "trudno": trudno, "skłonny": sklonny, "wiązać": wiazac, "urządzeniami": urzadzenie }
  - clean: "I tu muszę przyznać, że przez cały mój pobyt w tej prawdziwej przyszłości dowiedziałem się bardzo niewiele o kanałach, dzwonkach, środkach transportu i podobnych wygodach. W niektórych wizjach utopii i przyszłych czasów, które czytałem, jest ogromnie dużo szczegółów o budownictwie, urządzeniach społecznych i tak dalej. Ale choć takie szczegóły łatwo zdobyć, gdy cały świat mieści się we własnej wyobraźni, są one zupełnie niedostępne prawdziwemu podróżnikowi pośród takiej rzeczywistości, jaką tu zastałem."
    en: "“And here I must admit that I learnt very little of drains and bells and modes of conveyance, and the like conveniences, during my time in this real future. In some of these visions of Utopias and coming times which I have read, there is a vast amount of detail about building, and social arrangements, and so forth. But while such details are easy enough to obtain when the whole world is contained in one’s imagination, they are altogether inaccessible to a real traveller amid such realities as I found here."
    draft: true
    chunks:
      - pl: "I tu muszę przyznać, że przez cały mój pobyt w tej prawdziwej przyszłości dowiedziałem się bardzo niewiele o kanałach, dzwonkach, środkach transportu i podobnych wygodach."
        ru: "И тут я должен признать, что за всё время пребывания в этом настоящем будущем я очень мало узнал о канализации, звонках, способах передвижения и тому подобных удобствах."
      - pl: " W niektórych wizjach utopii i przyszłych czasów, które czytałem, jest ogromnie dużo szczegółów o budownictwie, urządzeniach społecznych i tak dalej."
        ru: "В некоторых видениях утопий и грядущих времён, которые я читал, есть огромное количество подробностей о строительстве, общественном устройстве и прочем."
        note: "budownictwo — строительство"
      - pl: " Ale choć takie szczegóły łatwo zdobyć, gdy cały świat mieści się we własnej wyobraźni,"
        ru: "Но хотя такие подробности легко раздобыть, когда весь мир умещается в собственном воображении,"
      - pl: " są one zupełnie niedostępne prawdziwemu podróżnikowi pośród takiej rzeczywistości, jaką tu zastałem."
        ru: "они совершенно недоступны настоящему путешественнику среди такой действительности, какую я здесь застал."
    words: { "pobyt": pobyt, "dzwonkach": dzwonek, "transportu": transport, "urządzeniach": urzadzenie, "mieści": miescic, "wyobraźni": wyobraznia }
  - clean: "Wyobraźcie sobie opowieść o Londynie, jaką przybysz prosto z Afryki Środkowej zaniósłby swemu plemieniu! Co wiedziałby o towarzystwach kolejowych, o ruchach społecznych, o drutach telefonicznych i telegraficznych, o Spółce Doręczania Paczek, o przekazach pocztowych i tym podobnych? A przecież my przynajmniej chętnie byśmy mu to wszystko wyjaśnili! A nawet z tego, co wiedział, ile zdołałby sprawić, by jego niepodróżujący przyjaciel to pojął albo w to uwierzył? A teraz pomyślcie, jak wąska jest przepaść między nim a Europejczykiem naszych czasów i jak szeroka odległość między mną a tymi ludźmi Złotego Wieku!"
    en: "Conceive the tale of London which a negro, fresh from Central Africa, would take back to his tribe! What would he know of railway companies, of social movements, of telephone and telegraph wires, of the Parcels Delivery Company, and postal orders and the like? Yet we, at least, should be willing enough to explain these things to him! And even of what he knew, how much could he make his untravelled friend either apprehend or believe? Then, think how narrow the gap between a negro and a white man of our own times, and how wide the interval between myself and these of the Golden Age!"
    draft: true
    chunks:
      - pl: "Wyobraźcie sobie opowieść o Londynie, jaką przybysz prosto z Afryki Środkowej zaniósłby swemu plemieniu!"
        ru: "Представьте себе рассказ о Лондоне, который пришелец прямо из Центральной Африки принёс бы своему племени!"
        note: "plemię — племя; у Уэллса здесь слово своего времени, отражающее взгляды 1895 года"
      - pl: " Co wiedziałby o towarzystwach kolejowych, o ruchach społecznych, o drutach telefonicznych i telegraficznych, o Spółce Doręczania Paczek, o przekazach pocztowych i tym podobnych?"
        ru: "Что бы он знал о железнодорожных компаниях, об общественных движениях, о телефонных и телеграфных проводах, о Компании по доставке посылок, о почтовых переводах и тому подобном?"
        note: "przekaz pocztowy — почтовый перевод"
      - pl: " A przecież my przynajmniej chętnie byśmy mu to wszystko wyjaśnili!"
        ru: "А ведь мы-то, по крайней мере, охотно объяснили бы ему всё это!"
      - pl: " A nawet z tego, co wiedział, ile zdołałby sprawić, by jego niepodróżujący przyjaciel to pojął albo w to uwierzył?"
        ru: "И даже из того, что он знал, сколько он смог бы заставить своего не путешествовавшего друга понять или в это поверить?"
      - pl: " A teraz pomyślcie, jak wąska jest przepaść między nim a Europejczykiem naszych czasów i jak szeroka odległość między mną a tymi ludźmi Złotego Wieku!"
        ru: "А теперь подумайте, как узка пропасть между ним и европейцем нашего времени и как широк разрыв между мной и этими людьми Золотого века!"
        note: "przepaść — пропасть (сущ.)"
    words: { "Środkowej": srodkowy, "drutach": drut, "telefonicznych": telefoniczny, "Spółce": spolka, "przekazach": przekaz, "szeroka": szeroki }
  - clean: "Czułem, że wiele jest rzeczy niewidocznych, które przyczyniały się do mojej wygody; ale poza ogólnym wrażeniem samoczynnej organizacji obawiam się, że niewiele potrafię wam przekazać z tej różnicy."
    en: "I was sensible of much which was unseen, and which contributed to my comfort; but save for a general impression of automatic organisation, I fear I can convey very little of the difference to your mind."
    draft: true
    chunks:
      - pl: "Czułem, że wiele jest rzeczy niewidocznych, które przyczyniały się do mojej wygody;"
        ru: "Я ощущал, что многое скрыто от глаз и служит моему удобству;"
        note: "przyczyniać się — способствовать"
      - pl: " ale poza ogólnym wrażeniem samoczynnej organizacji obawiam się, że niewiele potrafię wam przekazać z tej różnicy."
        ru: "но, кроме общего впечатления самодействующей организации, боюсь, мало что смогу передать вам об этой разнице."
        note: "samoczynny — автоматический"
    words: { "ogólnym": ogolny, "wrażeniem": wrazenie, "organizacji": organizacja, "obawiam": obawiac, "przekazać": przekazac, "różnicy": roznica }
  - clean: "Na przykład w sprawie pochówku nie widziałem śladów krematoriów ani niczego, co przypominałoby groby. Przyszło mi jednak do głowy, że może gdzieś poza zasięgiem moich poszukiwań są cmentarze (albo krematoria). Znów był to problem, który świadomie sobie postawiłem, i z początku moja ciekawość poniosła w tej sprawie zupełną klęskę. Ta rzecz mnie zastanawiała, i doprowadziła do dalszego spostrzeżenia, które zastanowiło mnie jeszcze bardziej: że wśród tego ludu nie było starych ani niedołężnych."
    en: "“In the matter of sepulture, for instance, I could see no signs of crematoria nor anything suggestive of tombs. But it occurred to me that, possibly, there might be cemeteries (or crematoria) somewhere beyond the range of my explorings. This, again, was a question I deliberately put to myself, and my curiosity was at first entirely defeated upon the point. The thing puzzled me, and I was led to make a further remark, which puzzled me still more: that aged and infirm among this people there were none."
    draft: true
    chunks:
      - pl: "Na przykład w sprawie pochówku nie widziałem śladów krematoriów ani niczego, co przypominałoby groby."
        ru: "Например, что касается погребения, я не видел следов крематориев или чего-либо похожего на могилы."
        note: "pochówek — погребение"
      - pl: " Przyszło mi jednak do głowy, że może gdzieś poza zasięgiem moich poszukiwań są cmentarze (albo krematoria)."
        ru: "Однако мне пришло в голову, что, может быть, где-то за пределами моих поисков есть кладбища (или крематории)."
        note: "cmentarz — кладбище"
      - pl: " Znów był to problem, który świadomie sobie postawiłem, i z początku moja ciekawość poniosła w tej sprawie zupełną klęskę."
        ru: "Это опять-таки был вопрос, который я сознательно себе поставил, и поначалу моё любопытство в этом пункте потерпело полное поражение."
        note: "ponieść klęskę — потерпеть поражение"
      - pl: " Ta rzecz mnie zastanawiała, i doprowadziła do dalszego spostrzeżenia, które zastanowiło mnie jeszcze bardziej:"
        ru: "Эта вещь озадачивала меня и привела к дальнейшему наблюдению, которое озадачило меня ещё больше:"
        note: "spostrzeżenie — наблюдение"
      - pl: " że wśród tego ludu nie było starych ani niedołężnych."
        ru: "что среди этого народа не было ни стариков, ни немощных."
        note: "niedołężny — немощный, дряхлый"
    words: { "poszukiwań": poszukiwanie, "cmentarze": cmentarz, "ciekawość": ciekawosc, "poniosła": poniesc, "ludu": lud }
  - clean: "Muszę wyznać, że moje zadowolenie z pierwszych teorii o samoczynnej cywilizacji i zdegenerowanej ludzkości nie trwało długo. A jednak nie potrafiłem wymyślić żadnej innej. Pozwólcie, że przedstawię swoje trudności. Kilka wielkich pałaców, które zbadałem, było tylko miejscami mieszkalnymi, wielkimi jadalniami i sypialniami. Nie znalazłem żadnych maszyn, żadnych urządzeń jakiegokolwiek rodzaju. A przecież ci ludzie nosili przyjemne tkaniny, które od czasu do czasu musiały wymagać odnowienia, a ich sandały, choć bez ozdób, były dość skomplikowanymi wyrobami z metalu."
    en: "“I must confess that my satisfaction with my first theories of an automatic civilisation and a decadent humanity did not long endure. Yet I could think of no other. Let me put my difficulties. The several big palaces I had explored were mere living places, great dining-halls and sleeping apartments. I could find no machinery, no appliances of any kind. Yet these people were clothed in pleasant fabrics that must at times need renewal, and their sandals, though undecorated, were fairly complex specimens of metalwork."
    draft: true
    chunks:
      - pl: "Muszę wyznać, że moje zadowolenie z pierwszych teorii o samoczynnej cywilizacji i zdegenerowanej ludzkości nie trwało długo."
