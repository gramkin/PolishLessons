  - clean: "Chyba już mówiłem, o ile goręcej było w tym Złotym Wieku niż u nas. Nie potrafię tego wyjaśnić. Może słońce było gorętsze albo ziemia bliżej słońca. Zwykle zakłada się, że w przyszłości słońce będzie stale stygło. Ale ludzie nieobeznani z takimi rozważaniami jak rozważania młodszego Darwina zapominają, że planety muszą w końcu jedna po drugiej spaść z powrotem na ciało macierzyste. Gdy dochodzi do takich katastrof, słońce rozpala się z nową energią; i być może jakąś wewnętrzną planetę spotkał ten los. Jakakolwiek była przyczyna, faktem jest, że słońce było o wiele gorętsze niż to, które znamy."
    en: "“I think I have said how much hotter than our own was the weather of this Golden Age. I cannot account for it. It may be that the sun was hotter, or the earth nearer the sun. It is usual to assume that the sun will go on cooling steadily in the future. But people, unfamiliar with such speculations as those of the younger Darwin, forget that the planets must ultimately fall back one by one into the parent body. As these catastrophes occur, the sun will blaze with renewed energy; and it may be that some inner planet had suffered this fate. Whatever the reason, the fact remains that the sun was very much hotter than we know it."
