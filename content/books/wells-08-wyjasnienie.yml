  - clean: "Zbyt doskonałe bezpieczeństwo mieszkańców Górnego Świata doprowadziło ich do powolnej degeneracji, do ogólnego zmniejszenia wzrostu, siły i inteligencji. To widziałem już dość wyraźnie. Co stało się z mieszkańcami Podziemia, jeszcze się nie domyślałem; ale z tego, co widziałem z Morloków — tak, nawiasem mówiąc, nazywano te stworzenia — mogłem sobie wyobrazić, że zmiana typu ludzkiego była tam jeszcze o wiele głębsza niż wśród Elojów, pięknej rasy, którą już znałem."
    en: "The too-perfect security of the Overworlders had led them to a slow movement of degeneration, to a general dwindling in size, strength, and intelligence. That I could see clearly enough already. What had happened to the Undergrounders I did not yet suspect; but, from what I had seen of the Morlocks—that, by the bye, was the name by which these creatures were called—I could imagine that the modification of the human type was even far more profound than among the ‘Eloi,’ the beautiful race that I already knew."
