  - clean: "Ogarnął mnie dawny, instynktowny lęk przed dzikimi zwierzętami. Zacisnąłem pięści i patrzyłem nieustępliwie w błyszczące gałki oczne. Bałem się odwrócić. Wtedy przyszła mi na myśl zupełne bezpieczeństwo, w jakim zdawała się żyć ludzkość. A potem przypomniałem sobie ten dziwny lęk przed ciemnością. Przezwyciężywszy w pewnej mierze strach, postąpiłem krok naprzód i przemówiłem. Przyznaję, że głos miałem szorstki i nie całkiem nad nim panowałem."
