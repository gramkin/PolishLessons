  - clean: "Pod moimi stopami ziemia musiała więc być ogromnie podziurawiona tunelami, a te tunele były siedliskiem Nowej Rasy. Obecność szybów wentylacyjnych i studni na zboczach wzgórz — właściwie wszędzie z wyjątkiem doliny rzeki — pokazywała, jak powszechne były jej rozgałęzienia. Cóż więc bardziej naturalnego niż przypuszczenie, że w tym sztucznym Podziemnym Świecie wykonywano pracę niezbędną dla wygody rasy dziennej? Myśl była tak wiarygodna, że od razu ją przyjąłem i zacząłem przypuszczać, jak doszło do tego rozszczepienia gatunku ludzkiego. Śmiem twierdzić, że odgadniecie kształt mojej teorii; choć sam bardzo szybko poczułem, że daleko jej do prawdy."
