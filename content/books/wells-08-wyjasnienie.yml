  - clean: "Potem przyszły kłopotliwe wątpliwości. Dlaczego Morlokowie zabrali mój Wehikuł Czasu? Byłem bowiem pewien, że to oni go zabrali. I dlaczego, jeśli Elojowie byli panami, nie mogli mi zwrócić maszyny? I dlaczego tak strasznie bali się ciemności? Zacząłem, jak mówiłem, wypytywać Weenę o ten Podziemny Świat, ale tu znów spotkał mnie zawód. Z początku nie chciała rozumieć moich pytań, a wkrótce odmówiła odpowiedzi."
    en: "“Then came troublesome doubts. Why had the Morlocks taken my Time Machine? For I felt sure it was they who had taken it. Why, too, if the Eloi were masters, could they not restore the machine to me? And why were they so terribly afraid of the dark? I proceeded, as I have said, to question Weena about this Underworld, but here again I was disappointed. At first she would not understand my questions, and presently she refused to answer them."
