        ru: "Должен вас предупредить, что такова была тогда моя теория."
      - pl: " Nie miałem wygodnego przewodnika na wzór książek utopijnych."
        ru: "У меня не было удобного проводника по образцу утопических книг."
        note: "na wzór — по образцу"
      - pl: " Moje wyjaśnienie może być zupełnie błędne."
        ru: "Моё объяснение может быть совершенно ошибочным."
      - pl: " Nadal uważam je za najbardziej prawdopodobne."
        ru: "Я по-прежнему считаю его самым правдоподобным."
      - pl: " Ale nawet przy tym założeniu zrównoważona cywilizacja, którą w końcu osiągnięto, musiała już dawno minąć swój zenit i popaść w głęboki upadek."
        ru: "Но даже при этом допущении уравновешенная цивилизация, которая была наконец достигнута, должно быть, давно миновала свой зенит и пришла в глубокий упадок."
