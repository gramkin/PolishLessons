  - clean: "Tak więc w końcu na górze musieliby być Posiadający, goniący za przyjemnością, wygodą i pięknem, a pod ziemią Nieposiadający, Robotnicy, coraz bardziej przystosowani do warunków swojej pracy. Gdy już się tam znaleźli, musieliby bez wątpienia płacić czynsz, i to niemały, za wentylację swoich pieczar; a gdyby odmówili, umarliby z głodu albo zostaliby uduszeni za zaległości. Ci z nich, którzy byli tak usposobieni, że czuli się nieszczęśliwi i buntowali się, ginęliby; a w końcu, gdy równowaga stałaby się trwała, ci, którzy przeżyli, byliby tak samo przystosowani do warunków podziemnego życia i na swój sposób tak samo szczęśliwi, jak ludzie z Górnego Świata do swoich. Jak mi się wydawało, wyrafinowane piękno i chorobliwa bladość wynikały z tego dość naturalnie."
    en: "So, in the end, above ground you must have the Haves, pursuing pleasure and comfort and beauty, and below ground the Have-nots, the Workers getting continually adapted to the conditions of their labour. Once they were there, they would no doubt have to pay rent, and not a little of it, for the ventilation of their caverns; and if they refused, they would starve or be suffocated for arrears. Such of them as were so constituted as to be miserable and rebellious would die; and, in the end, the balance being permanent, the survivors would become as well adapted to the conditions of underground life, and as happy in their way, as the Overworld people were to theirs. As it seemed to me, the refined beauty and the etiolated pallor followed naturally enough."
    draft: true
