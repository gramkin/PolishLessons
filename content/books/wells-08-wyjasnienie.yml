  - clean: "Wielki triumf Ludzkości, o którym marzyłem, przybrał w moim umyśle inny kształt. Nie był to triumf wychowania moralnego i powszechnej współpracy, jak sobie wyobrażałem. Zamiast tego ujrzałem prawdziwą arystokrację, uzbrojoną w udoskonaloną naukę i doprowadzającą do logicznego końca dzisiejszy system przemysłowy. Jej triumf nie był po prostu triumfem nad Naturą, lecz triumfem nad Naturą i nad bliźnim. Muszę was ostrzec, że była to wtedy moja teoria. Nie miałem wygodnego przewodnika na wzór książek utopijnych. Moje wyjaśnienie może być zupełnie błędne. Nadal uważam je za najbardziej prawdopodobne. Ale nawet przy tym założeniu zrównoważona cywilizacja, którą w końcu osiągnięto, musiała już dawno minąć swój zenit i popaść w głęboki upadek."
    en: "“The great triumph of Humanity I had dreamed of took a different shape in my mind. It had been no such triumph of moral education and general co-operation as I had imagined. Instead, I saw a real aristocracy, armed with a perfected science and working to a logical conclusion the industrial system of today. Its triumph had not been simply a triumph over Nature, but a triumph over Nature and the fellow-man. This, I must warn you, was my theory at the time. I had no convenient cicerone in the pattern of the Utopian books. My explanation may be absolutely wrong. I still think it is the most plausible one. But even on this supposition the balanced civilisation that was at last attained must have long since passed its zenith, and was now far fallen into decay."
    draft: true
    chunks:
      - pl: "Wielki triumf Ludzkości, o którym marzyłem, przybrał w moim umyśle inny kształt."
        ru: "Великое торжество Человечества, о котором я мечтал, приняло в моём уме иную форму."
      - pl: " Nie był to triumf wychowania moralnego i powszechnej współpracy, jak sobie wyobrażałem."
        ru: "Это не было торжеством нравственного воспитания и всеобщего сотрудничества, как я воображал."
      - pl: " Zamiast tego ujrzałem prawdziwą arystokrację, uzbrojoną w udoskonaloną naukę i doprowadzającą do logicznego końca dzisiejszy system przemysłowy."
        ru: "Вместо этого я увидел подлинную аристократию, вооружённую усовершенствованной наукой и доводящую до логического конца нынешнюю промышленную систему."
      - pl: " Jej triumf nie był po prostu triumfem nad Naturą, lecz triumfem nad Naturą i nad bliźnim."
        ru: "Её торжество было не просто торжеством над Природой, но торжеством над Природой и над ближним."
        note: "bliźni — ближний"
