  - clean: "Oto nowy pogląd. Ten drugi gatunek Człowieka żył oczywiście pod ziemią. Szczególnie trzy okoliczności kazały mi sądzić, że jego rzadkie wychodzenie na powierzchnię było skutkiem długotrwałego podziemnego trybu życia. Po pierwsze, wyblakły wygląd, wspólny większości zwierząt żyjących głównie w ciemności — na przykład białe ryby z jaskiń Kentucky. Dalej, te duże oczy, zdolne odbijać światło, są wspólną cechą stworzeń nocnych, czego dowodem są sowa i kot. I wreszcie to wyraźne zagubienie w słońcu, ta pospieszna, a zarazem niezdarna ucieczka ku ciemnemu cieniowi i to osobliwe trzymanie głowy w świetle — wszystko to wzmacniało teorię o skrajnej wrażliwości siatkówki."
    en: "“Here was the new view. Plainly, this second species of Man was subterranean. There were three circumstances in particular which made me think that its rare emergence above ground was the outcome of a long-continued underground habit. In the first place, there was the bleached look common in most animals that live largely in the dark—the white fish of the Kentucky caves, for instance. Then, those large eyes, with that capacity for reflecting light, are common features of nocturnal things—witness the owl and the cat. And last of all, that evident confusion in the sunshine, that hasty yet fumbling awkward flight towards dark shadow, and that peculiar carriage of the head while in the light—all reinforced the theory of an extreme sensitiveness of the retina."
