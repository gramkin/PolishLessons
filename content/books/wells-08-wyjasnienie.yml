  - clean: "Dalej, skłonność bogatszych ludzi do odgradzania się — wynikająca bez wątpienia z coraz większego wyrafinowania ich wykształcenia i z pogłębiającej się przepaści między nimi a prostacką przemocą biednych — już teraz prowadzi do zamykania, w ich interesie, znacznych części powierzchni kraju. Wokół Londynu, na przykład, może połowa ładniejszych okolic jest zamknięta przed intruzami. A ta sama pogłębiająca się przepaść — wynikająca z długości i kosztów wyższego wykształcenia oraz z coraz większych możliwości i pokus wyrafinowanego życia po stronie bogatych — sprawi, że wymiana między klasami i awans przez małżeństwa mieszane, które dziś opóźniają rozszczepienie naszego gatunku wzdłuż linii warstw społecznych, będą coraz rzadsze."
    en: "“Again, the exclusive tendency of richer people—due, no doubt, to the increasing refinement of their education, and the widening gulf between them and the rude violence of the poor—is already leading to the closing, in their interest, of considerable portions of the surface of the land. About London, for instance, perhaps half the prettier country is shut in against intrusion. And this same widening gulf—which is due to the length and expense of the higher educational process and the increased facilities for and temptations towards refined habits on the part of the rich—will make that exchange between class and class, that promotion by intermarriage which at present retards the splitting of our species along lines of social stratification, less and less frequent."
