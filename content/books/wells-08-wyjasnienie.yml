  - clean: "Nie wiem, jak długo siedziałem, wpatrując się w głąb tej studni. Minęło sporo czasu, zanim zdołałem przekonać samego siebie, że to, co widziałem, było człowiekiem. Ale stopniowo zaświtała mi prawda: że Człowiek nie pozostał jednym gatunkiem, lecz rozdzielił się na dwa odrębne zwierzęta; że moje pełne wdzięku dzieci z Górnego Świata nie były jedynymi potomkami naszego pokolenia, lecz że to wyblakłe, wstrętne, nocne Stworzenie, które mignęło mi przed oczami, też było dziedzicem wszystkich wieków."
