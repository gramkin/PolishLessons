  - clean: "Drżała, jakby ten temat był nie do zniesienia. A gdy nalegałem, może trochę zbyt szorstko, wybuchnęła płaczem. Były to jedyne łzy, poza moimi, jakie kiedykolwiek widziałem w tym Złotym Wieku. Gdy je zobaczyłem, natychmiast przestałem zajmować się Morlokami i dbałem już tylko o to, by przegnać z oczu Weeny te ślady jej ludzkiego dziedzictwa. I bardzo szybko uśmiechała się i klaskała w dłonie, a ja uroczyście zapalałem zapałkę."
