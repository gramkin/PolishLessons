  - clean: "Otóż pewnego bardzo gorącego ranka — czwartego, jak sądzę — gdy szukałem schronienia przed upałem i blaskiem w kolosalnej ruinie koło wielkiego domu, w którym spałem i jadłem, zdarzyła się ta dziwna rzecz. Wspinając się po tych stertach murów, znalazłem wąską galerię, której koniec i boczne okna były zawalone zwałami kamieni. W porównaniu z blaskiem na zewnątrz wydała mi się z początku czarna jak smoła. Wszedłem do niej po omacku, bo przejście ze światła w czerń sprawiło, że przed oczami pływały mi kolorowe plamy. Nagle zatrzymałem się jak urzeczony. Para oczu, świecących odbitym światłem dnia z zewnątrz, obserwowała mnie z ciemności."
