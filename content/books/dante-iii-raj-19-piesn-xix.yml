paragraphs:
  - clean: "Na Jowiszu. Orzeł przemawia. O błogosławieństwie dla niechrześcijan. O sądzie bożym. O ówczesnych monarchach."
    chunks:
      - pl: "Na Jowiszu. Orzeł przemawia. O błogosławieństwie dla niechrześcijan. O sądzie bożym. O ówczesnych monarchach."
        ru: "На Юпитере. Орёл говорит. О блаженстве для нехристиан. О Божьем суде. О тогдашних монархах."
    words: { "Orzeł": orzel, "przemawia": przemawiac, "błogosławieństwie": blogoslawienstwo, "sądzie": sad, "bożym": bozy, "ówczesnych": owczesny }
  - clean: "Z rozpostartymi przede mną skrzydłami\nPiękny ten obraz przedstawił się cały,\nKtóry świętego zachwytu czuciami\nW nim zgromadzone rozweselał dusze.\nKażda się zdała jako rubin mały,\nW którym słoneczko tak jasne świeciło,\nŻe w moich oczach swój promień odbiło."
    verse: true
    chunks:
      - pl: "Z rozpostartymi przede mną skrzydłami"
        ru: "С распростёртыми передо мной крыльями"
      - pl: "\nPiękny ten obraz przedstawił się cały,"
        ru: "весь этот прекрасный образ явился,"
      - pl: "\nKtóry świętego zachwytu czuciami"
        ru: "который чувствами святого восторга"
      - pl: "\nW nim zgromadzone rozweselał dusze."
        ru: "веселил собранные в нём души."
      - pl: "\nKażda się zdała jako rubin mały,"
        ru: "Каждая казалась маленьким рубином,"
      - pl: "\nW którym słoneczko tak jasne świeciło,"
        ru: "в котором солнышко светило так ярко,"
      - pl: "\nŻe w moich oczach swój promień odbiło."
        ru: "что отразило свой луч в моих глазах."
    words: { "skrzydłami": skrzydlo, "przedstawił": przedstawic, "zachwytu": zachwyt, "świeciło": swiecic, "promień": promien, "odbiło": odbic }
  - clean: "Co tu słowami opowiedzieć muszę,\nTego nikt jeszcze nie śpiewał, nie pisał,\nNikt wyobraźni tak nie rozkołysał,\nBy mógł to pojąć, co tu pióro skreśli:\nBo wzrok mój widział i uszy słyszały\nDziób, który mówił głosem słowa żywym:\n*Ja* i *Mój*, kiedy *My* i *Nasz* miał w myśli."
    verse: true
    chunks:
      - pl: "Co tu słowami opowiedzieć muszę,"
        ru: "То, что я должен здесь рассказать словами,"
      - pl: "\nTego nikt jeszcze nie śpiewał, nie pisał,"
        ru: "этого ещё никто не пел, не писал,"
      - pl: "\nNikt wyobraźni tak nie rozkołysał,"
        ru: "никто так не раскачал воображения,"
      - pl: "\nBy mógł to pojąć, co tu pióro skreśli:"
        ru: "чтобы мог постичь то, что здесь опишет перо:"
      - pl: "\nBo wzrok mój widział i uszy słyszały"
        ru: "ибо мой взгляд видел и уши слышали"
      - pl: "\nDziób, który mówił głosem słowa żywym:"
        ru: "клюв, что говорил голосом живое слово:"
      - pl: "\n*Ja* i *Mój*, kiedy *My* i *Nasz* miał w myśli."
        ru: "«Я» и «Моё», когда имел в мысли «Мы» и «Наше»."
    words: { "śpiewał": spiewac, "wyobraźni": wyobraznia, "pojąć": pojac, "pióro": pioro, "wzrok": wzrok, "uszy": ucho }
  - clean: "Potem rzekł: — «Za to żem był sprawiedliwym,\nŻem strzegł pobożnie przykazania boże,\nWzniesiony jestem tu do takiej chwały,\nCo być zwalczoną przez żądzę nie może.\nCień mój na ziemi przemknął nie bez śladu,\nLecz źli nie idą w ślad mego przykładu»."
    verse: true
    chunks:
      - pl: "Potem rzekł: — «Za to żem był sprawiedliwym,"
        ru: "Потом сказал: — «За то, что я был справедлив,"
      - pl: "\nŻem strzegł pobożnie przykazania boże,"
        ru: "что благочестиво соблюдал Божьи заповеди,"
      - pl: "\nWzniesiony jestem tu do takiej chwały,"
        ru: "я вознесён сюда к такой славе,"
      - pl: "\nCo być zwalczoną przez żądzę nie może."
        ru: "которую не может одолеть желание."
      - pl: "\nCień mój na ziemi przemknął nie bez śladu,"
        ru: "Моя тень промелькнула на земле не без следа,"
      - pl: "\nLecz źli nie idą w ślad mego przykładu»."
        ru: "но злые не идут по следу моего примера»."
    words: { "rzekł": rzec, "sprawiedliwym": sprawiedliwy, "strzegł": strzec, "Wzniesiony": wzniesc, "chwały": chwala, "Cień": cien }
  - clean: "Jak z wielu żarów wybucha od razu\nJedno gorąco, tak z miłości wiela\nWychodził jeden głos z tego obrazu.\n«O kwiaty» rzekłem «wiecznego wesela,\nGdy, jako jedną woń w kwiatu koronie,\nCzuję zarazem wszystkie wasze wonie,\nNasyćcie, dysząc woniami lubemi,\nWielki post, jakim już wyschłem i zbladłem,\nBo nie znalazłem pokarmu na ziemi."
    verse: true
    chunks:
      - pl: "Jak z wielu żarów wybucha od razu"
        ru: "Как от многих углей вырывается разом"
      - pl: "\nJedno gorąco, tak z miłości wiela"
        ru: "одно тепло, так из многой любви"
      - pl: "\nWychodził jeden głos z tego obrazu."
        ru: "выходил один голос из этого образа."
      - pl: "\n«O kwiaty» rzekłem «wiecznego wesela,"
        ru: "«О цветы, — сказал я, — вечной радости,"
      - pl: "\nGdy, jako jedną woń w kwiatu koronie,"
        ru: "когда, как один аромат в венчике цветка,"
      - pl: "\nCzuję zarazem wszystkie wasze wonie,"
        ru: "я чувствую разом все ваши ароматы,"
      - pl: "\nNasyćcie, dysząc woniami lubemi,"
        ru: "насытьте, дыша милыми благоуханиями,"
      - pl: "\nWielki post, jakim już wyschłem i zbladłem,"
        ru: "великий пост, от которого я уже иссох и побледнел,"
      - pl: "\nBo nie znalazłem pokarmu na ziemi."
        ru: "ибо не нашёл пищи на земле."
    words: { "głos": glos, "obrazu": obraz, "kwiaty": kwiat, "wiecznego": wieczny, "koronie": korona, "wonie": won }
  - clean: "Gdy sprawiedliwość boża jest zwierciadłem\nDla każdej sfery, snadź wam sfera wasza\nZasłoną jego szyby nie przygasza.\nWiecie, gdy mówi, jak mi słuchać miło,\nZnacie wątpienie, co mnie ogłodziło».\nJak sokół, gdy mu zdejmą kaptur z głowy,\nZatacza szyją do lotu gotowy\nNastrzępia pióra, żądz ukryć nie umie,\nTrzepotem skrzydeł daje poklask sobie;\nTaki ruch w orła widziałem osobie,\nZbudowanego z pochwał bożej łaski,\nZ piesień tych pochwał, który ten zrozumie,\nCzyj się duch w wieczne rozpromienił blaski."
    verse: true
    chunks:
      - pl: "Gdy sprawiedliwość boża jest zwierciadłem"
        ru: "Если Божья справедливость — зеркало"
      - pl: "\nDla każdej sfery, snadź wam sfera wasza"
        ru: "для каждой сферы, видно, ваша сфера"
      - pl: "\nZasłoną jego szyby nie przygasza."
        ru: "не затеняет вам покровом её стекла."
      - pl: "\nWiecie, gdy mówi, jak mi słuchać miło,"
        ru: "Вы знаете, как мне мило слушать, когда она говорит,"
      - pl: "\nZnacie wątpienie, co mnie ogłodziło»."
        ru: "вы знаете сомнение, что меня изголодало»."
        note: "ogłodzić — изголодать"
      - pl: "\nJak sokół, gdy mu zdejmą kaptur z głowy,"
        ru: "Как сокол, когда с его головы снимут колпак,"
      - pl: "\nZatacza szyją do lotu gotowy"
        ru: "поводит шеей, готовый к полёту,"
      - pl: "\nNastrzępia pióra, żądz ukryć nie umie,"
        ru: "взъерошивает перья, не умеет скрыть желаний,"
      - pl: "\nTrzepotem skrzydeł daje poklask sobie;"
        ru: "трепетом крыльев рукоплещет себе;"
        note: "poklask — рукоплескание"
      - pl: "\nTaki ruch w orła widziałem osobie,"
        ru: "такое движение я видел в особе орла,"
      - pl: "\nZbudowanego z pochwał bożej łaski,"
        ru: "построенного из хвал Божьей милости,"
      - pl: "\nZ piesień tych pochwał, który ten zrozumie,"
