  - clean: "Cała rodzina patrzyła na nią w niemym zdumieniu, ale ona była zupełnie poważna i skupiona; odwróciła się i poprowadziła ich przez otwór w boazerii wąskim tajnym korytarzem, a Waszyngton szedł za nimi z zapaloną świecą, którą chwycił ze stołu. W końcu doszli do wielkich dębowych drzwi nabijanych zardzewiałymi gwoździami. Kiedy Virginia ich dotknęła, otworzyły się na ciężkich zawiasach, i znaleźli się w małym, niskim pokoiku o sklepionym suficie i jednym malutkim zakratowanym okienkiem. W ścianę wmurowany był ogromny żelazny pierścień, a przykuty do niego był wychudły szkielet, wyciągnięty jak długi na kamiennej posadzce, który zdawał się próbować pochwycić długimi, pozbawionymi ciała palcami staroświecki drewniany talerz i dzban, postawione tak, że nie mógł ich dosięgnąć."
