  - clean: "W holu zastali gromadkę wystraszonych służących, a w bibliotece na sofie leżała biedna pani Otis, niemal oszalała ze strachu i niepokoju, a stara gospodyni zwilżała jej czoło wodą kolońską. Pan Otis natychmiast nalegał, żeby coś zjadła, i kazał podać kolację dla wszystkich. Był to smutny posiłek, bo prawie nikt się nie odzywał, a nawet bliźniacy byli przejęci i przycichli, bo bardzo kochali siostrę. Kiedy skończyli, pan Otis, mimo próśb małego księcia, kazał wszystkim iść spać, mówiąc, że tej nocy nic więcej nie da się zrobić i że rano zatelegrafuje do Scotland Yardu, żeby natychmiast przysłano kilku detektywów. Właśnie gdy wychodzili z jadalni, z wieży zegarowej zaczęła dudnić północ, a gdy wybrzmiało ostatnie uderzenie, usłyszeli trzask i nagły przenikliwy krzyk; straszliwy grzmot wstrząsnął domem, w powietrzu popłynęła nieziemska muzyka, płyta boazerii na szczycie schodów odskoczyła z hukiem i na podest wyszła Virginia, bardzo blada, z małą szkatułką w ręku. W jednej chwili wszyscy rzucili się ku niej. Pani Otis namiętnie przytuliła ją do siebie, książę obsypał ją gorącymi pocałunkami, a bliźniacy odtańczyli wokół nich dziki taniec wojenny."
    en: "In the hall they found a group of frightened servants, and lying on a sofa in the library was poor Mrs. Otis, almost out of her mind with terror and anxiety, and having her forehead bathed with eau de cologne by the old housekeeper. Mr. Otis at once insisted on her having something to eat, and ordered up supper for the whole party. It was a melancholy meal, as hardly any one spoke, and even the twins were awestruck and subdued, as they were very fond of their sister. When they had finished, Mr. Otis, in spite of the entreaties of the little Duke, ordered them all to bed, saying that nothing more could be done that night, and that he would telegraph in the morning to Scotland Yard for some detectives to be sent down immediately. Just as they were passing out of the dining-room, midnight began to boom from the clock tower, and when the last stroke sounded they heard a crash and a sudden shrill cry; a dreadful peal of thunder shook the house, a strain of unearthly music floated through the air, a panel at the top of the staircase flew back with a loud noise, and out on the landing, looking very pale and white, with a little casket in her hand, stepped Virginia. In a moment they had all rushed up to her. Mrs. Otis clasped her passionately in her arms, the Duke smothered her with violent kisses, and the twins executed a wild war-dance round the group."
