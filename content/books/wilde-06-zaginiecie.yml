  - clean: "Ledwie jednak ujechał parę mil, usłyszał, że ktoś galopuje za nim, a obejrzawszy się, ujrzał małego księcia, który nadjeżdżał na kucyku, z mocno zarumienioną twarzą i bez kapelusza. — Strasznie przepraszam, panie Otis — wysapał chłopiec — ale nie mogę jeść obiadu, dopóki Virginia się nie znajdzie. Proszę się na mnie nie gniewać; gdyby pan pozwolił nam się zaręczyć w zeszłym roku, nie byłoby teraz całego tego kłopotu. Nie odeśle mnie pan z powrotem, prawda? Nie mogę wrócić! Nie wrócę!"
    en: "He had hardly, however, gone a couple of miles, when he heard somebody galloping after him, and, looking round, saw the little Duke coming up on his pony, with his face very flushed, and no hat. \"I'm awfully sorry, Mr. Otis,\" gasped out the boy, \"but I can't eat any dinner as long as Virginia is lost. Please don't be angry with me; if you had let us be engaged last year, there would never have been all this trouble. You won't send me back, will you? I can't go! I won't go!\""
    draft: true
