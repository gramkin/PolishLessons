  - clean: "— Och, do licha z kapeluszem! Mnie chodzi o Virginię! — zawołał ze śmiechem mały książę i pogalopowali dalej na stację kolejową. Tam pan Otis zapytał zawiadowcę stacji, czy nie widziano na peronie nikogo, kto odpowiadałby rysopisowi Virginii, ale nie mógł się niczego o niej dowiedzieć. Zawiadowca rozesłał jednak telegramy w obie strony linii i zapewnił go, że będą jej pilnie wypatrywać, a pan Otis, kupiwszy małemu księciu kapelusz u kupca bławatnego, który właśnie zamykał okiennice, pojechał do Bexley, wsi oddalonej o jakieś cztery mile, o której mu powiedziano, że jest znanym miejscem postoju Cyganów, bo tuż obok niej leżało rozległe błonie. Obudzili tam wiejskiego policjanta, ale niczego się od niego nie dowiedzieli, i objechawszy całe błonie, zawrócili konie do domu i dotarli do posiadłości około jedenastej, śmiertelnie zmęczeni i niemal zrozpaczeni."
    en: "\"Oh, bother my hat! I want Virginia!\" cried the little Duke, laughing, and they galloped on to the railway station. There Mr. Otis inquired of the station-master if any one answering to the description of Virginia had been seen on the platform, but could get no news of her. The station-master, however, wired up and down the line, and assured him that a strict watch would be kept for her, and, after having bought a hat for the little Duke from a linen-draper, who was just putting up his shutters, Mr. Otis rode off to Bexley, a village about four miles away, which he was told was a well-known haunt of the gipsies, as there was a large common next to it. Here they roused up the rural policeman, but could get no information from him, and, after riding all over the common, they turned their horses' heads homewards, and reached the Chase about eleven o'clock, dead-tired and almost heart-broken."
