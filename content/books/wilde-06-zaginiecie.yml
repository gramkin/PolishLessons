  - clean: "Przy bramie czekali na nich z latarniami Waszyngton i bliźniacy, bo aleja była bardzo ciemna. Nie odkryto najmniejszego śladu Virginii. Cyganów złapano na łąkach Brockley, ale jej z nimi nie było, a nagły wyjazd wytłumaczyli tym, że pomylili datę jarmarku w Chorton i odjechali w pośpiechu z obawy, że się spóźnią. Bardzo ich zresztą zmartwiła wiadomość o zniknięciu Virginii, bo byli bardzo wdzięczni panu Otisowi, że pozwolił im obozować w swoim parku, i czterech z nich zostało, żeby pomóc w poszukiwaniach. Przeszukano bosakami staw z karpiami i dokładnie przetrząśnięto całą posiadłość, ale bez żadnego skutku. Było jasne, że przynajmniej tej nocy Virginia jest dla nich stracona; i w najgłębszym przygnębieniu pan Otis i chłopcy ruszyli w stronę domu, a za nimi masztalerz prowadził dwa konie i kucyka."
    en: "They found Washington and the twins waiting for them at the gate-house with lanterns, as the avenue was very dark. Not the slightest trace of Virginia had been discovered. The gipsies had been caught on Brockley meadows, but she was not with them, and they had explained their sudden departure by saying that they had mistaken the date of Chorton Fair, and had gone off in a hurry for fear they should be late. Indeed, they had been quite distressed at hearing of Virginia's disappearance, as they were very grateful to Mr. Otis for having allowed them to camp in his park, and four of their number had stayed behind to help in the search. The carp-pond had been dragged, and the whole Chase thoroughly gone over, but without any result. It was evident that, for that night at any rate, Virginia was lost to them; and it was in a state of the deepest depression that Mr. Otis and the boys walked up to the house, the groom following behind with the two horses and the pony."
