  - clean: "Natychmiast więc wyruszył do Blackfell Hollow, gdzie, jak wiedział, przebywali, w towarzystwie najstarszego syna i dwóch parobków. Mały książę Cheshire, który szalał z niepokoju, usilnie prosił, żeby pozwolono mu pojechać z nimi, ale pan Otis się nie zgodził, bo obawiał się, że może dojść do bójki. Na miejscu jednak przekonał się, że Cyganie odjechali, i było jasne, że wyjechali dość nagle, bo ognisko jeszcze się paliło, a na trawie leżało kilka talerzy. Wysławszy Waszyngtona i dwóch ludzi, by przeczesali okolicę, pobiegł do domu i rozesłał telegramy do wszystkich inspektorów policji w hrabstwie, prosząc, by wypatrywali małej dziewczynki porwanej przez włóczęgów albo Cyganów. Potem kazał przyprowadzić konia i nalegając, żeby żona i trzej chłopcy zasiedli do obiadu, odjechał z masztalerzem drogą do Ascot."
    en: "He accordingly at once set off for Blackfell Hollow, where he knew they were, accompanied by his eldest son and two of the farm-servants. The little Duke of Cheshire, who was perfectly frantic with anxiety, begged hard to be allowed to go too, but Mr. Otis would not allow him, as he was afraid there might be a scuffle. On arriving at the spot, however, he found that the gipsies had gone, and it was evident that their departure had been rather sudden, as the fire was still burning, and some plates were lying on the grass. Having sent off Washington and the two men to scour the district, he ran home, and despatched telegrams to all the police inspectors in the county, telling them to look out for a little girl who had been kidnapped by tramps or gipsies. He then ordered his horse to be brought round, and, after insisting on his wife and the three boys sitting down to dinner, rode off down the Ascot road with a groom."
    draft: true
