  - clean: "Na ziemiach włączonych do Rzeszy Niemcy chcieli całkowicie usunąć polskość. Setki tysięcy Polaków wysiedlono do Generalnego Gubernatorstwa, często w ciągu kilku godzin, z małym bagażem. W ich domach i gospodarstwach osiedlano Niemców, sprowadzanych z krajów bałtyckich i z Wołynia. Polakom nie wolno było mówić po polsku w urzędach, a w tramwajach, parkach i kawiarniach pojawiły się napisy „Tylko dla Niemców”. Zamykano kościoły, a setki księży trafiły do obozu w Dachau."
