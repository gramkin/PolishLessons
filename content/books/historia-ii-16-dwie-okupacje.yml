  - clean: "W Generalnym Gubernatorstwie życie stało się walką o przetrwanie. Polskie dzieci mogły chodzić tylko do szkół podstawowych i zawodowych, gdzie nie uczono historii ani literatury polskiej. Żywność wydawano na kartki, a przydziały dla Polaków były tak małe, że nie wystarczały do przeżycia. Ludzie handlowali więc na czarnym rynku, a chłopi przemycali do miast mięso i mąkę, choć groziła za to kara śmierci. Wieczorem obowiązywała godzina policyjna, po której nie wolno było wychodzić na ulicę."
