        ru: "На землях, включённых в рейх, немцы хотели полностью искоренить польскость."
      - pl: " Setki tysięcy Polaków wysiedlono do Generalnego Gubernatorstwa, często w ciągu kilku godzin, z małym bagażem."
        ru: "Сотни тысяч поляков выселили в Генерал-губернаторство, часто за несколько часов, с небольшим багажом."
        note: "wysiedlić — выселить"
      - pl: " W ich domach i gospodarstwach osiedlano Niemców, sprowadzanych z krajów bałtyckich i z Wołynia."
        ru: "В их домах и хозяйствах селили немцев, привезённых из Прибалтики и с Волыни."
      - pl: " Polakom nie wolno było mówić po polsku w urzędach, a w tramwajach, parkach i kawiarniach pojawiły się napisy „Tylko dla Niemców”."
        ru: "Полякам запрещалось говорить по-польски в учреждениях, а в трамваях, парках и кафе появились надписи «Только для немцев»."
      - pl: " Zamykano kościoły, a setki księży trafiły do obozu w Dachau."
        ru: "Закрывали костёлы, а сотни священников попали в лагерь Дахау."
