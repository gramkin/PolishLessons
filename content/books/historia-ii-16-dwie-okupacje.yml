  - clean: "Najbardziej bano się łapanek. Niemcy otaczali ulicę, tramwaj albo kościół i zabierali wszystkich, których złapali. Jedni trafiali do obozów koncentracyjnych, inni na roboty przymusowe do Niemiec. W czasie wojny na roboty do Rzeszy wywieziono prawie trzy miliony obywateli polskich. Musieli nosić na ubraniu literę P i pracowali w fabrykach i u niemieckich gospodarzy, często w bardzo ciężkich warunkach. Na murach wisiały plakaty z nazwiskami rozstrzelanych zakładników, a za zabicie jednego Niemca Niemcy rozstrzeliwali dziesiątki, a nawet setki Polaków. Mimo terroru ludzie próbowali żyć normalnie: zakochiwali się, brali śluby, chodzili do kościoła i opowiadali sobie dowcipy o Hitlerze."
