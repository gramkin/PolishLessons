      - pl: " Zamiast wykładu aresztowano ponad sto osiemdziesiąt osób i wywieziono je do obozu koncentracyjnego Sachsenhausen."
        ru: "Вместо лекции арестовали больше ста восьмидесяти человек и вывезли их в концлагерь Заксенхаузен."
      - pl: " Kilkunastu starszych profesorów zmarło tam z zimna i wyczerpania."
        ru: "Больше десяти пожилых профессоров умерли там от холода и истощения."
      - pl: " Pozostałych zwolniono po kilku miesiącach dzięki protestom z całego świata."
        ru: "Остальных освободили через несколько месяцев благодаря протестам со всего мира."
      - pl: " Pod Warszawą, w lesie koło Palmir, Niemcy rozstrzelali w ciągu dwóch lat ponad tysiąc siedemset osób, wśród nich polityków, sportowców i artystów."
        ru: "Под Варшавой, в лесу у Пальмир, немцы за два года расстреляли больше тысячи семисот человек, среди них политиков, спортсменов и артистов."
      - pl: " Zamknięto wszystkie wyższe uczelnie, szkoły średnie, teatry, muzea i biblioteki, a z kościołów i muzeów wywożono do Niemiec dzieła sztuki."
        ru: "Закрыли все высшие учебные заведения, средние школы, театры, музеи и библиотеки, а из костёлов и музеев вывозили в Германию произведения искусства."
