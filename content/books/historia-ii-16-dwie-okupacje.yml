  - clean: "Część mieszkańców, zwłaszcza na Śląsku i Pomorzu, wpisano na niemiecką listę narodowościową. Na Śląsku i Pomorzu wpisanie na listę było często przymusowe i chroniło przed wysiedleniem. Mężczyzn z listy powoływano jednak do armii niemieckiej. Wielu Ślązaków i Kaszubów walczyło w mundurach Wehrmachtu, a część z nich przeszła później na stronę aliantów i wstąpiła do armii polskiej na Zachodzie. Po wojnie sprawa listy narodowościowej długo dzieliła rodziny i sąsiadów."
