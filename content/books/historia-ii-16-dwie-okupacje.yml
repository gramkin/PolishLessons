  - clean: "Na wschodzie władza radziecka wprowadzała swój system. Upaństwowiono fabryki, banki, sklepy i majątki ziemskie, a złotego zastąpił rubel. Polskie szkoły zamieniono na radzieckie, z językiem ukraińskim, białoruskim lub rosyjskim, a dzieci uczyły się, że Stalin jest ich ojcem. Zamykano kościoły i klasztory, a księży aresztowano. NKWD aresztowało polityków, urzędników, policjantów, oficerów, ziemian i działaczy społecznych, a także ludzi, których po prostu ktoś oskarżył."
