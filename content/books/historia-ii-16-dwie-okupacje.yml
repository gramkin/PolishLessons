  - clean: "Niemcy uważali Polaków za naród niższej kategorii, który miał służyć Rzeszy jako tania siła robocza. Heinrich Himmler pisał, że Polakom wystarczy umiejętność liczenia do pięciuset i podpisywania się nazwiskiem. Dlatego postanowili zniszczyć polską inteligencję: nauczycieli, księży, lekarzy, prawników i oficerów. Już jesienią 1939 roku na Pomorzu i w Wielkopolsce rozstrzelano dziesiątki tysięcy ludzi, często w lasach, jak w Piaśnicy koło Wejherowa."
    draft: true
    chunks:
      - pl: "Niemcy uważali Polaków za naród niższej kategorii, który miał służyć Rzeszy jako tania siła robocza."
        ru: "Немцы считали поляков народом низшего сорта, который должен был служить рейху дешёвой рабочей силой."
        note: "siła robocza — рабочая сила"
      - pl: " Heinrich Himmler pisał, że Polakom wystarczy umiejętność liczenia do pięciuset i podpisywania się nazwiskiem."
        ru: "Генрих Гиммлер писал, что полякам достаточно уметь считать до пятисот и расписываться."
      - pl: " Dlatego postanowili zniszczyć polską inteligencję: nauczycieli, księży, lekarzy, prawników i oficerów."
        ru: "Поэтому они решили уничтожить польскую интеллигенцию: учителей, священников, врачей, юристов и офицеров."
      - pl: " Już jesienią 1939 roku na Pomorzu i w Wielkopolsce rozstrzelano dziesiątki tysięcy ludzi, często w lasach, jak w Piaśnicy koło Wejherowa."
        ru: "Уже осенью 1939 года в Поморье и Великой Польше расстреляли десятки тысяч людей, часто в лесах, как в Пяснице под Вейхеровом."
    words: { "naród": narod, "niższej": niski, "kategorii": kategoria, "tania": tani, "umiejętność": umiejetnosc, "pięciuset": piecset, "polską": polski, "inteligencję": inteligencja, "księży": ksiadz, "jesienią": jesien, "dziesiątki": dziesiatka }
  - clean: "6 listopada 1939 roku Niemcy zaprosili profesorów Uniwersytetu Jagiellońskiego na wykład o stosunku Rzeszy do nauki. Zamiast wykładu aresztowano ponad sto osiemdziesiąt osób i wywieziono je do obozu koncentracyjnego Sachsenhausen. Kilkunastu starszych profesorów zmarło tam z zimna i wyczerpania. Pozostałych zwolniono po kilku miesiącach dzięki protestom z całego świata. Pod Warszawą, w lesie koło Palmir, Niemcy rozstrzelali w ciągu dwóch lat ponad tysiąc siedemset osób, wśród nich polityków, sportowców i artystów. Zamknięto wszystkie wyższe uczelnie, szkoły średnie, teatry, muzea i biblioteki, a z kościołów i muzeów wywożono do Niemiec dzieła sztuki."
