paragraphs:
  - clean: "Jesienią 1939 roku ziemie polskie znalazły się pod dwiema okupacjami. Niemcy włączyli do Rzeszy zachodnią część kraju: Pomorze, Wielkopolskę, Śląsk i okolice Łodzi, którą przemianowali na Litzmannstadt. Z centralnej Polski utworzyli Generalne Gubernatorstwo ze stolicą w Krakowie, którym rządził Hans Frank. Frank zamieszkał na Wawelu, w dawnym zamku królów polskich, co miało pokazać, że Polska przestała istnieć na zawsze."
    draft: true
    chunks:
      - pl: "Jesienią 1939 roku ziemie polskie znalazły się pod dwiema okupacjami."
        ru: "Осенью 1939 года польские земли оказались под двумя оккупациями."
      - pl: " Niemcy włączyli do Rzeszy zachodnią część kraju: Pomorze, Wielkopolskę, Śląsk i okolice Łodzi, którą przemianowali na Litzmannstadt."
        ru: "Германия включила в рейх западную часть страны: Поморье, Великую Польшу, Силезию и окрестности Лодзи, которую переименовали в Лицманштадт."
        note: "przemianować — переименовать"
      - pl: " Z centralnej Polski utworzyli Generalne Gubernatorstwo ze stolicą w Krakowie, którym rządził Hans Frank."
        ru: "Из центральной Польши они образовали Генерал-губернаторство со столицей в Кракове, которым правил Ганс Франк."
      - pl: " Frank zamieszkał na Wawelu, w dawnym zamku królów polskich, co miało pokazać, że Polska przestała istnieć na zawsze."
        ru: "Франк поселился на Вавеле, в бывшем замке польских королей, что должно было показать, что Польша перестала существовать навсегда."
    words: { "Jesienią": jesien, "polskie": polski, "zachodnią": zachodni, "centralnej": centralny, "stolicą": stolica, "rządził": rzadzic, "zamieszkał": zamieszkac, "zamku": zamek, "polskich": polski }
  - clean: "Związek Radziecki zajął wschodnią połowę kraju. W październiku 1939 roku przeprowadzono tam wybory do zgromadzeń, które pod lufami karabinów poprosiły o przyłączenie do radzieckiej Ukrainy i Białorusi. Na każdy okręg wyborczy był tylko jeden kandydat, a ludzi zmuszano do głosowania. Wilno Związek Radziecki przekazał Litwie, która jednak rok później sama została zajęta przez Armię Czerwoną. Obaj okupanci mieli ten sam cel: zniszczyć państwo polskie i jego elity, a społeczeństwo zamienić w posłuszną masę. Różnili się metodami, ale skutki ich rządów okazały się podobnie straszne."
    draft: true
    chunks:
      - pl: "Związek Radziecki zajął wschodnią połowę kraju."
        ru: "Советский Союз занял восточную половину страны."
      - pl: " W październiku 1939 roku przeprowadzono tam wybory do zgromadzeń, które pod lufami karabinów poprosiły o przyłączenie do radzieckiej Ukrainy i Białorusi."
        ru: "В октябре 1939 года там провели выборы в собрания, которые под дулами винтовок попросили о присоединении к Советской Украине и Белоруссии."
        note: "lufa — дуло, ствол"
      - pl: " Na każdy okręg wyborczy był tylko jeden kandydat, a ludzi zmuszano do głosowania."
        ru: "На каждый избирательный округ был только один кандидат, а людей заставляли голосовать."
      - pl: " Wilno Związek Radziecki przekazał Litwie, która jednak rok później sama została zajęta przez Armię Czerwoną."
        ru: "Вильно Советский Союз передал Литве, которая, однако, год спустя сама была занята Красной армией."
      - pl: " Obaj okupanci mieli ten sam cel: zniszczyć państwo polskie i jego elity, a społeczeństwo zamienić w posłuszną masę."
        ru: "У обоих оккупантов была одна цель: уничтожить польское государство и его элиту, а общество превратить в послушную массу."
      - pl: " Różnili się metodami, ale skutki ich rządów okazały się podobnie straszne."
        ru: "Они различались методами, но последствия их правления оказались одинаково страшными."
