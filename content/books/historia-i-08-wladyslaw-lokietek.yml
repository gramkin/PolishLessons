  - clean: "Mimo porażek Łokietek krok po kroku jednoczył kraj. W 1314 roku opanował Wielkopolskę. Miał w swoim ręku dwie najważniejsze dzielnice: Małopolskę z Krakowem i Wielkopolskę z Gnieznem i Poznaniem. Śląsk, Mazowsze i Pomorze pozostawały poza jego władzą, ale nikt nie mógł zaprzeczyć, że jest najsilniejszym z Piastów. Przyszedł czas, żeby sięgnąć po koronę."
    draft: true
    chunks:
      - pl: "Mimo porażek Łokietek krok po kroku jednoczył kraj."
        ru: "Несмотря на поражения, Локоток шаг за шагом объединял страну."
        note: "porażka — поражение; krok po kroku — шаг за шагом"
      - pl: " W 1314 roku opanował Wielkopolskę."
        ru: "В 1314 году он овладел Великой Польшей."
