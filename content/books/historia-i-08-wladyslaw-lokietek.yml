  - clean: "Łokietek budował też sojusze. Swoją córkę Elżbietę wydał za mąż za króla Węgier Karola Roberta, co zapewniło Polsce silnego przyjaciela na południu. Elżbieta okazała się kobietą niezwykle silną. W 1330 roku na zamku w Wyszehradzie węgierski rycerz Felicjan Zach rzucił się z mieczem na rodzinę królewską przy stole. Królowa, broniąc dzieci, straciła cztery palce prawej ręki, a napastnik zginął z rąk dworzan. Żyła jeszcze ponad pięćdziesiąt lat i odegrała ważną rolę w polityce obu krajów, a jej syn Ludwik został później także królem Polski. Syna Kazimierza ożenił z Aldoną, córką wielkiego księcia litewskiego Giedymina. Litwa była wtedy ostatnim pogańskim państwem Europy, potężnym i stale atakowanym przez Krzyżaków. Wspólny wróg zbliżał Polaków i Litwinów. Ślub Kazimierza z litewską księżniczką odbył się w 1325 roku w Krakowie. Aldona przyjęła chrzest i imię Anna i przywiozła ze sobą jako posag kilka tysięcy polskich jeńców, których jej ojciec zwolnił z niewoli. Długosz pisze, że młoda królowa kochała muzykę i taniec tak bardzo, że wszędzie, gdzie się pojawiała, towarzyszyli jej grajkowie z cymbałami i bębnami. Litewski sojusz miał też inny ważny skutek. W tym samym czasie tron Rusi Halicko-Włodzimierskiej objął Bolesław, książę mazowiecki z rodu Piastów, którego matka była ruską księżniczką. Przyjął prawosławie i imię Jerzy i ożenił się z córką Giedymina. Na wschodzie powstała w ten sposób sieć związków rodzinnych, która miała później ułatwić Polsce opanowanie Rusi Halickiej."
