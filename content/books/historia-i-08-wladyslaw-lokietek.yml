  - clean: "Władysław Łokietek zmarł 2 marca 1333 roku. Jako pierwszy król został pochowany w katedrze na Wawelu, gdzie później spoczęła większość polskich władców. Jego grób z białego kamienia można oglądać do dziś. To właśnie Łokietek rozpoczął w 1320 roku budowę nowej, gotyckiej katedry na Wawelu, która stoi do dziś i jest miejscem koronacji i pochówku polskich królów. Zostawił synowi kraj mniejszy niż za Chrobrego, okaleczony i zagrożony z kilku stron. Ale zostawił też coś, czego nie miał żaden z jego poprzedników od dwustu lat: zjednoczone królestwo z koroną, która miała już nigdy nie zostać rozbita na dzielnice. Jego żona, królowa Jadwiga, przeżyła go o kilka lat i ostatnie lata spędziła jako zakonnica w klasztorze klarysek w Starym Sączu. Przez całe życie była dla męża oparciem w czasach wygnania, klęsk i zwycięstw. Mały wzrostem król okazał się wielkim budowniczym państwa. Jego dzieło miał dokończyć syn, Kazimierz, który był pod wieloma względami jego przeciwieństwem. Dlatego w polskiej tradycji Łokietek jest przede wszystkim królem, który po dwustu latach rozbicia znów połączył kraj w jedno królestwo."
