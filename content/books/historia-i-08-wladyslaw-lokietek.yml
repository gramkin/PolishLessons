  - clean: "20 stycznia 1320 roku w katedrze na Wawelu arcybiskup gnieźnieński Janisław włożył na głowę Łokietka koronę. Była to pierwsza koronacja w Krakowie, a nie w Gnieźnie, i od tej pory prawie wszyscy królowie Polski koronowali się na Wawelu. Według tradycji po raz pierwszy użyto wtedy miecza Szczerbca jako miecza koronacyjnego. Na koronację przygotowano też nową złotą koronę, którą później nazywano koroną Chrobrego, bo wierzono, że należała do pierwszego króla. Koronowano nią polskich królów aż do XVIII wieku. Po rozbiorach zrabowali ją Prusacy, a na początku XIX wieku przetopili na złoto i monety. Zachowały się tylko jej opisy i rysunki, na podstawie których wykonano w naszych czasach jej kopię. Łokietek miał wtedy około sześćdziesięciu lat. Odrodzone państwo nazywano Królestwem Polskim, a z czasem zaczęto mówić o Koronie Królestwa Polskiego. Ta druga nazwa podkreślała, że królestwo to coś więcej niż osoba króla: to wspólnota wszystkich ziem, które kiedyś do niego należały, także tych, które były jeszcze w obcych rękach."
