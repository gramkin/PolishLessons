  - clean: "Groźnym przeciwnikiem Łokietka był król czeski Jan Luksemburski, rycerz wędrowny i awanturnik, który walczył w całej Europie. W 1327 roku poprowadził wojsko aż pod Kraków, ale wycofał się, kiedy na pomoc Polsce przyszli Węgrzy. Po drodze przyjął hołd od kilku książąt śląskich, którzy woleli silnego króla czeskiego od słabego polskiego. Tylko nieliczni, jak książę świdnicki, pozostali niezależni. Jan Luksemburski stracił później wzrok, a mimo to walczył dalej. W 1346 roku, już jako ślepy starzec, kazał się przywiązać do koni swoich rycerzy i rzucił się w wir bitwy pod Crécy we Francji, gdzie zginął. Jego herb z trzema strusimi piórami przejął podobno zwycięski książę angielski i do dziś jest on znakiem następców tronu brytyjskiego."
