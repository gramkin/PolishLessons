        ru: "Но он оставил и то, чего ни у одного из его предшественников не было двести лет: единое королевство с короной, которой больше никогда не суждено было распасться на уделы."
      - pl: " Mały wzrostem król okazał się wielkim budowniczym państwa."
        ru: "Маленький ростом король оказался великим строителем государства."
        note: "budowniczy — строитель"
      - pl: " Jego dzieło miał dokończyć syn, Kazimierz, który był pod wieloma względami jego przeciwieństwem."
        ru: "Его дело предстояло завершить сыну, Казимиру, который во многом был его противоположностью."
