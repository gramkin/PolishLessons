chapter: 8
chapterTitle: "Władysław Łokietek"
chapterTitleRu: "Владислав Локоток"
level: B2
paragraphs:
  - clean: "Władysław, syn księcia kujawskiego, urodził się około 1260 roku i odziedziczył po ojcu tylko niewielki skrawek ziemi wokół Brześcia Kujawskiego. Był bardzo niskiego wzrostu, dlatego nazywano go Łokietkiem. Łokieć był dawną miarą długości, odpowiadającą mniej więcej odległości od łokcia do końca palców. Przezwisko brzmiało trochę jak żart, ale nikt, kto znał tego człowieka, nie lekceważył go. Łokietek był uparty, odważny i niezwykle wytrwały. Przez całe życie przegrywał bitwy, tracił ziemie i musiał uciekać, ale zawsze wracał."
    draft: true
    chunks:
      - pl: "Władysław, syn księcia kujawskiego, urodził się około 1260 roku i odziedziczył po ojcu tylko niewielki skrawek ziemi wokół Brześcia Kujawskiego."
        ru: "Владислав, сын куявского князя, родился около 1260 года и унаследовал от отца лишь небольшой клочок земли вокруг Бжесця-Куявского."
        note: "skrawek — клочок, лоскут"
      - pl: " Był bardzo niskiego wzrostu, dlatego nazywano go Łokietkiem."
        ru: "Он был очень маленького роста, поэтому его прозвали Локотком."
        note: "wzrost — рост"
      - pl: " Łokieć był dawną miarą długości, odpowiadającą mniej więcej odległości od łokcia do końca palców."
        ru: "Локоть был старинной мерой длины, соответствующей примерно расстоянию от локтя до кончиков пальцев."
        note: "miara — мера; odległość — расстояние"
      - pl: " Przezwisko brzmiało trochę jak żart, ale nikt, kto znał tego człowieka, nie lekceważył go."
        ru: "Прозвище звучало немного как шутка, но никто из тех, кто знал этого человека, его не недооценивал."
        note: "przezwisko — прозвище; lekceważyć — пренебрегать, недооценивать"
      - pl: " Łokietek był uparty, odważny i niezwykle wytrwały."
        ru: "Локоток был упрям, смел и необычайно стоек."
        note: "wytrwały — стойкий, упорный"
      - pl: " Przez całe życie przegrywał bitwy, tracił ziemie i musiał uciekać, ale zawsze wracał."
        ru: "Всю жизнь он проигрывал битвы, терял земли и вынужден был бежать, но всегда возвращался."
    words: { "niewielki": niewielki, "niskiego": niski, "wzrostu": wzrost, "miarą": miara, "długości": dlugosc, "odległości": odleglosc, "uparty": uparty, "odważny": odwazny, "niezwykle": niezwykle, "przegrywał": przegrywac, "bitwy": bitwa }
  - clean: "Po zamordowaniu Przemysła II w 1296 roku Łokietek opanował Wielkopolskę. Nie umiał jednak zdobyć sobie przychylności tamtejszych możnych i duchowieństwa. Skarżyli się, że jego ludzie łupią kraj i że książę nie potrafi zapewnić porządku. Kiedy w 1300 roku do Polski wkroczył czeski król Wacław II, możni bez żalu go poparli. Łokietek stracił wszystko i musiał uchodzić z kraju."
    draft: true
    chunks:
      - pl: "Po zamordowaniu Przemysła II w 1296 roku Łokietek opanował Wielkopolskę."
        ru: "После убийства Пшемыслава II в 1296 году Локоток овладел Великой Польшей."
      - pl: " Nie umiał jednak zdobyć sobie przychylności tamtejszych możnych i duchowieństwa."
        ru: "Однако он не сумел завоевать расположение местной знати и духовенства."
        note: "przychylność — расположение, благосклонность; duchowieństwo — духовенство"
      - pl: " Skarżyli się, że jego ludzie łupią kraj i że książę nie potrafi zapewnić porządku."
        ru: "Они жаловались, что его люди грабят страну и что князь не умеет обеспечить порядок."
        note: "zapewnić — обеспечить"
      - pl: " Kiedy w 1300 roku do Polski wkroczył czeski król Wacław II, możni bez żalu go poparli."
        ru: "Когда в 1300 году в Польшу вступил чешский король Вацлав II, знать без сожаления его поддержала."
        note: "żal — сожаление"
      - pl: " Łokietek stracił wszystko i musiał uchodzić z kraju."
        ru: "Локоток потерял всё и был вынужден бежать из страны."
        note: "uchodzić — уходить, бежать"
    words: { "opanował": opanowac, "zapewnić": zapewnic, "wkroczył": wkroczyc, "żalu": zal, "poparli": poprzec, "uchodzić": uchodzic }
  - clean: "O jego wygnaniu krąży wiele legend. Najbardziej znana mówi, że ścigany przez czeskich żołnierzy ukrył się w jaskini w dolinie Prądnika koło Ojcowa. Gdy tylko wszedł do środka, pająk zasnuł wejście pajęczyną. Żołnierze, widząc nienaruszoną pajęczynę, uznali, że nikogo tam nie ma, i pojechali dalej. Jaskinię nazywa się dziś Grotą Łokietka i można ją zwiedzać. Legendy legendami, ale wiadomo na pewno, że Łokietek był w tym czasie w Rzymie, gdzie w roku jubileuszowym 1300 przybyły tysiące pielgrzymów. Szukał tam poparcia papieża."
    draft: true
    chunks:
      - pl: "O jego wygnaniu krąży wiele legend."
        ru: "О его изгнании ходит много легенд."
        note: "krążyć — ходить, распространяться (о слухах)"
      - pl: " Najbardziej znana mówi, że ścigany przez czeskich żołnierzy ukrył się w jaskini w dolinie Prądnika koło Ojcowa."
        ru: "Самая известная гласит, что, преследуемый чешскими воинами, он укрылся в пещере в долине Прондника под Ойцувом."
        note: "ścigać — преследовать; dolina — долина"
      - pl: " Gdy tylko wszedł do środka, pająk zasnuł wejście pajęczyną."
        ru: "Как только он вошёл внутрь, паук затянул вход паутиной."
        note: "pająk — паук; zasnuć — затянуть; pajęczyna — паутина"
      - pl: " Żołnierze, widząc nienaruszoną pajęczynę, uznali, że nikogo tam nie ma, i pojechali dalej."
        ru: "Воины, видя нетронутую паутину, решили, что там никого нет, и поехали дальше."
        note: "nienaruszony — нетронутый"
      - pl: " Jaskinię nazywa się dziś Grotą Łokietka i można ją zwiedzać."
        ru: "Пещеру сегодня называют Гротом Локотка, и её можно посетить."
      - pl: " Legendy legendami, ale wiadomo na pewno, że Łokietek był w tym czasie w Rzymie, gdzie w roku jubileuszowym 1300 przybyły tysiące pielgrzymów."
        ru: "Легенды легендами, но точно известно, что Локоток был в это время в Риме, куда в юбилейный 1300 год прибыли тысячи паломников."
        note: "rok jubileuszowy — юбилейный (святой) год"
      - pl: " Szukał tam poparcia papieża."
        ru: "Он искал там поддержки папы."
        note: "poparcie — поддержка"
    words: { "krąży": krazyc, "legend": legenda, "ścigany": scigac, "jaskini": jaskinia, "dolinie": dolina, "pająk": pajak, "nienaruszoną": naruszyc, "Jaskinię": jaskinia, "Legendy": legenda, "legendami": legenda, "pewno": pewno, "papieża": papiez }
  - clean: "Szukał też sojuszników na Węgrzech, gdzie znalazł pomoc i ludzi. W 1304 roku wrócił do kraju z niewielkim oddziałem i zaczął odbijać z rąk czeskich gród po grodzie: Wiślicę, Sandomierz, Lelów. W 1305 roku zmarł Wacław II, a rok później jego syn Wacław III, młody i lekkomyślny, został zamordowany w Ołomuńcu. Czeska dynastia Przemyślidów wymarła. Łokietek wykorzystał okazję i w 1306 roku wjechał do Krakowa. Wkrótce opanował też Pomorze Gdańskie. Wydawało się, że droga do zjednoczenia stoi otworem."
    draft: true
    chunks:
      - pl: "Szukał też sojuszników na Węgrzech, gdzie znalazł pomoc i ludzi."
        ru: "Искал он союзников и в Венгрии, где нашёл помощь и людей."
      - pl: " W 1304 roku wrócił do kraju z niewielkim oddziałem i zaczął odbijać z rąk czeskich gród po grodzie: Wiślicę, Sandomierz, Lelów."
        ru: "В 1304 году он вернулся в страну с небольшим отрядом и начал отбивать у чехов град за градом: Вислицу, Сандомир, Лелув."
        note: "odbijać — отбивать"
      - pl: " W 1305 roku zmarł Wacław II, a rok później jego syn Wacław III, młody i lekkomyślny, został zamordowany w Ołomuńcu."
        ru: "В 1305 году умер Вацлав II, а год спустя его сын Вацлав III, молодой и легкомысленный, был убит в Оломоуце."
        note: "lekkomyślny — легкомысленный"
      - pl: " Czeska dynastia Przemyślidów wymarła."
        ru: "Чешская династия Пржемысловичей пресеклась."
        note: "wymrzeć — вымереть, пресечься"
      - pl: " Łokietek wykorzystał okazję i w 1306 roku wjechał do Krakowa."
        ru: "Локоток воспользовался случаем и в 1306 году въехал в Краков."
      - pl: " Wkrótce opanował też Pomorze Gdańskie."
        ru: "Вскоре он овладел и Гданьским Поморьем."
      - pl: " Wydawało się, że droga do zjednoczenia stoi otworem."
        ru: "Казалось, что путь к объединению открыт."
        note: "stać otworem — быть открытым"
    words: { "opanował": opanowac, "sojuszników": sojusznik, "niewielkim": niewielki, "odbijać": odbijac, "otworem": otwor }
  - clean: "Wtedy przyszedł cios, którego skutki Polska odczuwała przez półtora wieku. W 1308 roku na Pomorze Gdańskie najechali margrabiowie brandenburscy i oblegli Gdańsk. Łokietek nie miał dość sił, żeby przyjść z odsieczą, więc za radą swoich ludzi zwrócił się o pomoc do Krzyżaków. Rycerze zakonni rzeczywiście przybyli i przepędzili Brandenburczyków. Potem jednak zażądali od Łokietka ogromnej zapłaty za pomoc, a gdy nie mógł zapłacić, zajęli Gdańsk dla siebie. W nocy z 13 na 14 listopada 1308 roku wkroczyli do miasta i wymordowali wielu jego obrońców i mieszkańców. Wydarzenie to przeszło do historii jako rzeź Gdańska. Liczba ofiar jest sporna: w późniejszym procesie przed sądem papieskim mówiono o dziesięciu tysiącach zabitych, ale historycy uważają, że było ich znacznie mniej. W ciągu następnego roku Krzyżacy zajęli całe Pomorze Gdańskie, a prawa Brandenburgii do tej ziemi po prostu od niej kupili. W 1309 roku wielki mistrz zakonu przeniósł swoją siedzibę z Wenecji do Malborka. Polska straciła dostęp do morza."
    draft: true
    chunks:
      - pl: "Wtedy przyszedł cios, którego skutki Polska odczuwała przez półtora wieku."
        ru: "Тогда последовал удар, последствия которого Польша ощущала полтора века."
        note: "cios — удар; odczuwać — ощущать"
      - pl: " W 1308 roku na Pomorze Gdańskie najechali margrabiowie brandenburscy i oblegli Gdańsk."
        ru: "В 1308 году на Гданьское Поморье напали бранденбургские маркграфы и осадили Гданьск."
      - pl: " Łokietek nie miał dość sił, żeby przyjść z odsieczą, więc za radą swoich ludzi zwrócił się o pomoc do Krzyżaków."
        ru: "У Локотка не хватало сил, чтобы прийти на выручку, поэтому по совету своих людей он обратился за помощью к крестоносцам."
        note: "odsiecz — выручка, помощь осаждённым"
      - pl: " Rycerze zakonni rzeczywiście przybyli i przepędzili Brandenburczyków."
        ru: "Рыцари-монахи действительно прибыли и прогнали бранденбуржцев."
      - pl: " Potem jednak zażądali od Łokietka ogromnej zapłaty za pomoc, a gdy nie mógł zapłacić, zajęli Gdańsk dla siebie."
        ru: "Но затем они потребовали от Локотка огромной платы за помощь, а когда он не смог заплатить, захватили Гданьск для себя."
        note: "zażądać — потребовать"
      - pl: " W nocy z 13 na 14 listopada 1308 roku wkroczyli do miasta i wymordowali wielu jego obrońców i mieszkańców."
        ru: "В ночь с 13 на 14 ноября 1308 года они вошли в город и перебили многих его защитников и жителей."
      - pl: " Wydarzenie to przeszło do historii jako rzeź Gdańska."
        ru: "Это событие вошло в историю как Гданьская резня."
        note: "rzeź — резня"
      - pl: " Liczba ofiar jest sporna: w późniejszym procesie przed sądem papieskim mówiono o dziesięciu tysiącach zabitych, ale historycy uważają, że było ich znacznie mniej."
        ru: "Число жертв спорно: в позднейшем процессе перед папским судом говорили о десяти тысячах убитых, но историки считают, что их было значительно меньше."
        note: "sporny — спорный"
      - pl: " W ciągu następnego roku Krzyżacy zajęli całe Pomorze Gdańskie, a prawa Brandenburgii do tej ziemi po prostu od niej kupili."
        ru: "В течение следующего года крестоносцы захватили всё Гданьское Поморье, а права Бранденбурга на эту землю попросту у него купили."
      - pl: " W 1309 roku wielki mistrz zakonu przeniósł swoją siedzibę z Wenecji do Malborka."
        ru: "В 1309 году великий магистр ордена перенёс свою резиденцию из Венеции в Мальборк."
        note: "wielki mistrz — великий магистр"
      - pl: " Polska straciła dostęp do morza."
        ru: "Польша лишилась выхода к морю."
        note: "dostęp — доступ"
    words: { "cios": cios, "skutki": skutek, "odczuwała": odczuwac, "półtora": poltora, "Rycerze": rycerz, "rzeczywiście": rzeczywiscie, "zapłaty": zaplata, "listopada": listopad, "wkroczyli": wkroczyc, "obrońców": obronca, "mieszkańców": mieszkaniec, "późniejszym": pozny, "znacznie": znacznie, "siedzibę": siedziba }
  - clean: "Kłopoty Łokietka nie skończyły się na tym. W 1311 roku przeciwko niemu zbuntowało się bogate mieszczaństwo Krakowa pod wodzą wójta Alberta. Mieszczanie, w większości pochodzenia niemieckiego, liczyli, że pod rządami czeskiego króla Jana Luksemburskiego, który rościł sobie prawa do polskiej korony, będą mieli więcej swobody i lepsze warunki do handlu. Przez prawie rok Kraków był w rękach buntowników. Kiedy Łokietek odzyskał miasto, ukarał winnych bardzo surowo. Kronika podaje ciekawy szczegół: aby odróżnić Niemców od Polaków, kazano podejrzanym wymówić słowa „soczewica, koło, miele, młyn”. Kto nie potrafił ich poprawnie powiedzieć, tracił majątek, a czasem i życie. Wójt Albert uciekł, a miasto straciło część przywilejów. Odtąd władcy pilnowali, żeby mieszczanie nie mieli zbyt wielkiego wpływu na politykę."
    draft: true
    chunks:
      - pl: "Kłopoty Łokietka nie skończyły się na tym."
        ru: "Беды Локотка на этом не кончились."
        note: "kłopot — беда, хлопоты"
      - pl: " W 1311 roku przeciwko niemu zbuntowało się bogate mieszczaństwo Krakowa pod wodzą wójta Alberta."
        ru: "В 1311 году против него восстали богатые горожане Кракова во главе с войтом Альбертом."
        note: "mieszczaństwo — горожане, мещанство; pod wodzą — под предводительством"
      - pl: " Mieszczanie, w większości pochodzenia niemieckiego, liczyli, że pod rządami czeskiego króla Jana Luksemburskiego, który rościł sobie prawa do polskiej korony, będą mieli więcej swobody i lepsze warunki do handlu."
        ru: "Горожане, в большинстве немецкого происхождения, рассчитывали, что под властью чешского короля Иоанна Люксембургского, притязавшего на польскую корону, у них будет больше свободы и лучшие условия для торговли."
        note: "rościć sobie prawa — притязать; liczyć — здесь «рассчитывать»"
      - pl: " Przez prawie rok Kraków był w rękach buntowników."
        ru: "Почти год Краков был в руках мятежников."
        note: "buntownik — мятежник"
      - pl: " Kiedy Łokietek odzyskał miasto, ukarał winnych bardzo surowo."
        ru: "Когда Локоток вернул себе город, он покарал виновных очень сурово."
        note: "winny — виновный"
      - pl: " Kronika podaje ciekawy szczegół: aby odróżnić Niemców od Polaków, kazano podejrzanym wymówić słowa „soczewica, koło, miele, młyn”."
        ru: "Хроника сообщает любопытную подробность: чтобы отличить немцев от поляков, подозреваемым велели произнести слова «soczewica, koło, miele, młyn»."
        note: "odróżnić — отличить; wymówić — произнести; soczewica — чечевица"
      - pl: " Kto nie potrafił ich poprawnie powiedzieć, tracił majątek, a czasem i życie."
        ru: "Кто не мог правильно их выговорить, лишался имущества, а иногда и жизни."
        note: "majątek — имущество"
      - pl: " Wójt Albert uciekł, a miasto straciło część przywilejów."
        ru: "Войт Альберт бежал, а город лишился части привилегий."
      - pl: " Odtąd władcy pilnowali, żeby mieszczanie nie mieli zbyt wielkiego wpływu na politykę."
        ru: "С тех пор правители следили за тем, чтобы горожане не имели слишком большого влияния на политику."
        note: "wpływ — влияние"
