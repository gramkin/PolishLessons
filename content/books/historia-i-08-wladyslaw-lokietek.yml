  - clean: "27 września 1331 roku pod Płowcami na Kujawach wojska Łokietka zaatakowały jedną z krzyżackich armii. Bitwa była zacięta i trwała prawie cały dzień. W pierwszej fazie Polacy rozbili przeciwnika i wzięli do niewoli wielu rycerzy, ale potem nadciągnęła druga armia zakonna i trzeba było się wycofać. Militarnie bitwa nie została rozstrzygnięta, ale miała ogromne znaczenie moralne. Pokazała, że Krzyżaków można pokonać w otwartym polu. Legenda mówi, że po bitwie król przechodził przez pole i zobaczył ciężko rannego rycerza Floriana Szarego, który trzymał w rękach własne wnętrzności. „Ach, ile ja tu cierpię!” — powiedział rycerz. „Mniej cierpisz, niż ja cierpię, widząc taką hańbę” — odpowiedział król, myśląc o spustoszonym kraju. Rycerz wyzdrowiał, a jego potomkowie dostali podobno herb z trzema włóczniami, które przebiły jego ciało."
