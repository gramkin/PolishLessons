# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 33
chapterTitle: "Pieśń XXXIII"
chapterTitleRu: "Песнь XXXIII. Эвноя"
level: B2
paragraphs:
  - clean: "(Beatrycze i inne niewiasty powstają, Beatrycze prorokuje ocalenie Kościoła i przywrócenie ładu bożego. Eunoe i zanurzenie się w niej. Zakończenie.)"
    chunks:
      - pl: "(Beatrycze i inne niewiasty powstają, Beatrycze prorokuje ocalenie Kościoła i przywrócenie ładu bożego. Eunoe i zanurzenie się w niej. Zakończenie.)"
        ru: "(Беатриче и другие жёны поднимаются, Беатриче пророчествует спасение Церкви и восстановление Божьего порядка. Эвноя и погружение в неё. Окончание.)"
        note: "ocalenie — спасение; ład — порядок"
    words: { "inne": inny, "niewiasty": niewiasta, "Kościoła": kosciol, "przywrócenie": przywrocic, "bożego": bozy, "zanurzenie": zanurzyc }
  - clean: "Deus, venerunt gentes: na przemianę,\nZmieniając w kolej chór swój z każdą zwrotką,\nTo trzy, to cztery głosy nimf dobrane,\nPłacząc, poczęły psalmodyję słodką.\nA Beatrycze, wzdychając, jej słucha,\nWspółczuciem łez ich zmieniona i drżąca;\nRzekłbyś, Maryja pod krzyżem stojąca,\nNiewiele więcej była od niej blada."
    verse: true
    chunks:
      - pl: "Deus, venerunt gentes: na przemianę,"
        ru: "«Deus, venerunt gentes» — попеременно,"
        note: "«Боже, пришли язычники», псалом 78"
      - pl: "\nZmieniając w kolej chór swój z każdą zwrotką,"
        ru: "по очереди меняя свой хор с каждым куплетом,"
      - pl: "\nTo trzy, to cztery głosy nimf dobrane,"
        ru: "то три, то четыре подобранных голоса нимф,"
      - pl: "\nPłacząc, poczęły psalmodyję słodką."
        ru: "плача, начали сладкое псалмопение."
        note: "psalmodyja — псалмопение"
      - pl: "\nA Beatrycze, wzdychając, jej słucha,"
        ru: "А Беатриче, вздыхая, слушает её,"
      - pl: "\nWspółczuciem łez ich zmieniona i drżąca;"
        ru: "изменившаяся и дрожащая от сочувствия к их слезам;"
      - pl: "\nRzekłbyś, Maryja pod krzyżem stojąca,"
        ru: "сказал бы ты: Мария, стоящая под крестом,"
      - pl: "\nNiewiele więcej była od niej blada."
        ru: "была ненамного бледнее её."
    words: { "chór": chor, "dobrane": dobrac, "poczęły": poczac, "Rzekłbyś": rzec, "krzyżem": krzyz, "blada": blady }
  - clean: "Lecz gdy spostrzegła, że mówić wypada,\nPowstała prosta, z żarliwości ducha\nZaczerwieniona jak ogień, mówiła:\n«Siostry, maluczko już mnie tu widzicie,\nMaluczko zasię, a znów mnie ujrzycie».\nWszystkie sióstr siedm przed się postawiła,\nDamę, mnie, mędrca, który został z nami,\nZa sobą, tylko znak dając gestami."
    verse: true
    chunks:
      - pl: "Lecz gdy spostrzegła, że mówić wypada,"
        ru: "Но когда она заметила, что подобает говорить,"
      - pl: "\nPowstała prosta, z żarliwości ducha"
        ru: "встала прямо и, раскрасневшись, как огонь,"
      - pl: "\nZaczerwieniona jak ogień, mówiła:"
        ru: "от пыла духа, сказала:"
      - pl: "\n«Siostry, maluczko już mnie tu widzicie,"
        ru: "«Сёстры, вскоре вы меня уже не увидите,"
        note: "maluczko — вскоре, немного"
      - pl: "\nMaluczko zasię, a znów mnie ujrzycie»."
        ru: "и вскоре же снова увидите меня»."
        note: "слова Христа"
      - pl: "\nWszystkie sióstr siedm przed się postawiła,"
        ru: "Всех семь сестёр она поставила перед собой,"
      - pl: "\nDamę, mnie, mędrca, który został z nami,"
        ru: "даму, меня, мудреца, что остался с нами, —"
        note: "Стаций"
      - pl: "\nZa sobą, tylko znak dając gestami."
        ru: "за собой, давая знак лишь жестами."
    words: { "spostrzegła": spostrzec, "wypada": wypadac, "Powstała": powstac, "ujrzycie": ujrzec, "Damę": dama, "gestami": gest }
  - clean: "Tak szła i prawie za dziesiątym krokiem,\nGdy oczy moje przebiła swym okiem,\nRzekła spokojna: «Chodź sam bliżej, śmiało,\nA stań tak do mnie zwrócony w połowie,\nAbyś mógł słyszeć, gdy do cię przemówię».\nGdym stanął przy niej, jak mi stać przystało,\n«Bracie,» mówiła, «tak idąc, dlaczego\nNie śmiesz mi zadać pytania jakiego?»"
    verse: true
    chunks:
      - pl: "Tak szła i prawie za dziesiątym krokiem,"
        ru: "Так она шла и почти на десятом шаге,"
      - pl: "\nGdy oczy moje przebiła swym okiem,"
        ru: "когда пронзила мои глаза своим взором,"
      - pl: "\nRzekła spokojna: «Chodź sam bliżej, śmiało,"
        ru: "сказала спокойно: «Подойди-ка ближе, смело,"
      - pl: "\nA stań tak do mnie zwrócony w połowie,"
        ru: "и встань так, вполоборота ко мне,"
      - pl: "\nAbyś mógł słyszeć, gdy do cię przemówię»."
        ru: "чтобы ты мог слышать, когда я заговорю с тобой»."
      - pl: "\nGdym stanął przy niej, jak mi stać przystało,"
        ru: "Когда я встал рядом с ней, как мне подобало стоять,"
      - pl: "\n«Bracie,» mówiła, «tak idąc, dlaczego"
        ru: "«Брат, — сказала она, — почему, так идя,"
      - pl: "\nNie śmiesz mi zadać pytania jakiego?»"
        ru: "ты не смеешь задать мне какой-нибудь вопрос?»"
    words: { "krokiem": krok, "przebiła": przebic, "spokojna": spokojny, "zwrócony": zwrocic, "przemówię": przemowic, "stanął": stanac }
  - clean: "Jak ten, co nie śmie wyjść z pewnych obrębów\nPrzyzwoitości przed swoim zwierzchnikiem,\nMówiąc, nie może przez pokory zbytek,\nŻywego słowa wyrwać spoza zębów,\nPocząłem jąkać nieśmiałym językiem;\n«Pani, znasz lepiej sama mój pożytek»."
    verse: true
    chunks:
      - pl: "Jak ten, co nie śmie wyjść z pewnych obrębów"
        ru: "Как тот, кто не смеет выйти из известных пределов"
      - pl: "\nPrzyzwoitości przed swoim zwierzchnikiem,"
        ru: "приличия перед своим начальником,"
        note: "zwierzchnik — начальник"
      - pl: "\nMówiąc, nie może przez pokory zbytek,"
        ru: "говоря, не может от избытка смирения"
      - pl: "\nŻywego słowa wyrwać spoza zębów,"
        ru: "вырвать живого слова из-за зубов,"
      - pl: "\nPocząłem jąkać nieśmiałym językiem;"
        ru: "я начал запинаться робким языком:"
      - pl: "\n«Pani, znasz lepiej sama mój pożytek»."
        ru: "«Госпожа, ты лучше сама знаешь мою нужду»."
        note: "pożytek — польза, нужда"
    words: { "obrębów": obreb, "Żywego": zywy, "wyrwać": wyrwac, "zębów": zab, "nieśmiałym": niesmialy, "językiem": jezyk }
  - clean: "A ona: «Wstydem nie czerwień twej twarzy,\nAbyś nie mówił jak człowiek, gdy marzy.\nWiedz, że spód wozu strzaskany przez smoka\nI był, i nie jest zarazem dla oka,\nLecz żeby grzesznik nie roił, jak roi,\nŻe bożą zemstę potrawą ukoi."
    verse: true
    chunks:
      - pl: "A ona: «Wstydem nie czerwień twej twarzy,"
        ru: "А она: «Не красней от стыда,"
      - pl: "\nAbyś nie mówił jak człowiek, gdy marzy."
        ru: "чтобы не говорить, как человек, когда грезит."
      - pl: "\nWiedz, że spód wozu strzaskany przez smoka"
        ru: "Знай, что днище колесницы, разбитое драконом,"
        note: "spód — днище"
      - pl: "\nI był, i nie jest zarazem dla oka,"
        ru: "и было, и нет его разом для глаза,"
      - pl: "\nLecz żeby grzesznik nie roił, jak roi,"
        ru: "но чтобы грешник не воображал, как воображает,"
      - pl: "\nŻe bożą zemstę potrawą ukoi."
        ru: "что умилостивит Божью месть кушаньем."
        note: "суеверие: съесть суп на могиле убитого"
    words: { "Wstydem": wstyd, "twarzy": twarz, "marzy": marzyc, "wozu": woz, "smoka": smok, "zemstę": zemsta }
  - clean: "Orzeł, co tyle ronił piór, nie będzie\nZawsze bezdzietny! Choć wóz w ślepym błędzie\nZłudzony piór tych ozdobą zwodniczą,\nStał się potworą, a potem zdobyczą.\nBo widzę jasno przyszłość tajemniczą,\nPomimo przeszkód, co się nagromadzą,\nJuż idą gwiazdy, które czas sprowadzą,\nGdy wszetecznicę i jej spółgrzesznika\nLiczba, co pięćset, pięć, dziesięć zamyka,\nZesłana z nieba, jak proch marny zniszczy."
    verse: true
    chunks:
      - pl: "Orzeł, co tyle ronił piór, nie będzie"
        ru: "Орёл, что ронял столько перьев, не будет"
      - pl: "\nZawsze bezdzietny! Choć wóz w ślepym błędzie"
        ru: "всегда бездетным! Хоть колесница в слепом заблуждении,"
      - pl: "\nZłudzony piór tych ozdobą zwodniczą,"
        ru: "обманутая обманчивым украшением этих перьев,"
      - pl: "\nStał się potworą, a potem zdobyczą."
        ru: "стала чудовищем, а потом добычей."
      - pl: "\nBo widzę jasno przyszłość tajemniczą,"
        ru: "Ибо я ясно вижу таинственное будущее:"
      - pl: "\nPomimo przeszkód, co się nagromadzą,"
        ru: "несмотря на препятствия, что накопятся,"
      - pl: "\nJuż idą gwiazdy, które czas sprowadzą,"
        ru: "уже идут звёзды, что приведут время,"
      - pl: "\nGdy wszetecznicę i jej spółgrzesznika"
        ru: "когда блудницу и её сообщника"
      - pl: "\nLiczba, co pięćset, pięć, dziesięć zamyka,"
        ru: "число, что заключает пятьсот, пять, десять,"
        note: "DXV, «Пёс», вождь-избавитель"
      - pl: "\nZesłana z nieba, jak proch marny zniszczy."
        ru: "посланное с неба, уничтожит, как жалкий прах."
    words: { "Orzeł": orzel, "ozdobą": ozdoba, "tajemniczą": tajemniczy, "przeszkód": przeszkoda, "proch": proch, "marny": marny }
  - clean: "Może ta wróżba jak Sfinks lub Temida,\nNiezrozumiałą i ciemną się wyda,\nBo miesza rozum światłem, co zbyt błyszczy:\nLecz wam rozwiążą węzeł tej zagadki\nNajady, które wcielą się w wypadki,\nPlaga ich trzody ocali i zboża."
    verse: true
    chunks:
      - pl: "Może ta wróżba jak Sfinks lub Temida,"
        ru: "Может быть, это пророчество, как Сфинкс или Фемида,"
      - pl: "\nNiezrozumiałą i ciemną się wyda,"
        ru: "покажется непонятным и тёмным,"
      - pl: "\nBo miesza rozum światłem, co zbyt błyszczy:"
        ru: "ибо смущает разум светом, что слишком блестит:"
      - pl: "\nLecz wam rozwiążą węzeł tej zagadki"
        ru: "но вам развяжут узел этой загадки"
      - pl: "\nNajady, które wcielą się w wypadki,"
        ru: "наяды, что воплотятся в события,"
        note: "наяды — у Данте по ошибочному чтению Овидия, где загадки разгадал Эдип"
      - pl: "\nPlaga ich trzody ocali i zboża."
        ru: "бедствие спасёт их стада и хлеба."
    words: { "rozum": rozum, "błyszczy": blyszczec, "węzeł": wezel, "zagadki": zagadka, "trzody": trzoda, "zboża": zboze }
  - clean: "Zapisz i odnieś żyjącym te słowa,\nKtórych dni kresem jest deska grobowa:\nPrzeze mnie bowiem mówi prawda boża.\nPomnij, spisując wiernie te wyrazy,\nNie zakryć drzewa, które wobec ciebie\nJuż znieważonym było po dwa razy."
    verse: true
    chunks:
      - pl: "Zapisz i odnieś żyjącym te słowa,"
        ru: "Запиши и отнеси эти слова живым,"
      - pl: "\nKtórych dni kresem jest deska grobowa:"
        ru: "чей предел дней — гробовая доска:"
      - pl: "\nPrzeze mnie bowiem mówi prawda boża."
        ru: "ибо через меня говорит Божья правда."
      - pl: "\nPomnij, spisując wiernie te wyrazy,"
        ru: "Помни, записывая верно эти слова,"
      - pl: "\nNie zakryć drzewa, które wobec ciebie"
        ru: "не скрыть дерева, что на твоих глазах"
      - pl: "\nJuż znieważonym było po dwa razy."
        ru: "уже было дважды осквернено."
    words: { "Zapisz": zapisac, "odnieś": odniesc, "kresem": kres, "deska": deska, "wyrazy": wyraz, "drzewa": drzewo }
  - clean: "Kto bądź je łamie, a z liści obnaża,\nBluźnierstwem czynu ten Boga obraża,\nBo On to drzewo stworzył świętym w niebie\nNa swój użytek. Przeto pierwsza dusza\nZa grzech, co z niego zjeść owoc pokusza,\nW mękach i żądzy przez lat pięć tysięcy\nOczekiwała Tego najgoręcej,\nKtóry ukarał jej płoche łaknienie\nNa sobie samym przez śmierć i cierpienie."
    verse: true
    chunks:
      - pl: "Kto bądź je łamie, a z liści obnaża,"
        ru: "Кто бы его ни ломал и ни обнажал от листьев,"
      - pl: "\nBluźnierstwem czynu ten Boga obraża,"
        ru: "тот кощунством дела оскорбляет Бога,"
        note: "bluźnierstwo — кощунство"
      - pl: "\nBo On to drzewo stworzył świętym w niebie"
        ru: "ибо Он создал это дерево святым на небе"
      - pl: "\nNa swój użytek. Przeto pierwsza dusza"
        ru: "для своего употребления. Поэтому первая душа"
      - pl: "\nZa grzech, co z niego zjeść owoc pokusza,"
        ru: "за грех, что соблазнил съесть его плод,"
      - pl: "\nW mękach i żądzy przez lat pięć tysięcy"
        ru: "в муках и желании пять тысяч лет"
      - pl: "\nOczekiwała Tego najgoręcej,"
        ru: "ждала всего горячее Того,"
      - pl: "\nKtóry ukarał jej płoche łaknienie"
        ru: "кто покарал её легкомысленную жажду"
      - pl: "\nNa sobie samym przez śmierć i cierpienie."
        ru: "на себе самом смертью и страданием."
    words: { "łamie": lamac, "czynu": czyn, "niebie": niebo, "grzech": grzech, "owoc": owoc, "ukarał": ukarac }
  - clean: "Duch twój śpi, jeśli zrozumieć niezdolny,\nŻe dla przyczyny to drzewo szczególnej\nTak jest wyniosłe, a wierzch swój zieloną,\nCoraz to szerszą rozwija koroną.\nJeżeli duch twój jak w Elsy strumieniu\nNie okamieniał w daremnym myśleniu:\nJeśliś nie splamił szperaniem twej głowy\nDucha, jak Pyram krwią owoc morwowy,\nWtenczas zrozumiesz z pożytkiem dla siebie\nMyśl rządów Boga na ziemi i w niebie\nW zakazie, jakim to drzewo otoczył."
    verse: true
    chunks:
      - pl: "Duch twój śpi, jeśli zrozumieć niezdolny,"
        ru: "Твой дух спит, если не способен понять,"
      - pl: "\nŻe dla przyczyny to drzewo szczególnej"
        ru: "что по особой причине это дерево"
      - pl: "\nTak jest wyniosłe, a wierzch swój zieloną,"
        ru: "так высоко, а вершину свою"
      - pl: "\nCoraz to szerszą rozwija koroną."
        ru: "разворачивает всё более широкой зелёной кроной."
      - pl: "\nJeżeli duch twój jak w Elsy strumieniu"
        ru: "Если твой дух, как в ручье Эльсы,"
        note: "воды Эльсы покрывают предметы известью"
      - pl: "\nNie okamieniał w daremnym myśleniu:"
        ru: "не окаменел в напрасном размышлении:"
      - pl: "\nJeśliś nie splamił szperaniem twej głowy"
        ru: "если ты не запятнал копанием своей головы"
        note: "szperanie — копание, рыскание"
      - pl: "\nDucha, jak Pyram krwią owoc morwowy,"
        ru: "духа, как Пирам кровью плод шелковицы,"
      - pl: "\nWtenczas zrozumiesz z pożytkiem dla siebie"
        ru: "тогда ты поймёшь с пользой для себя"
      - pl: "\nMyśl rządów Boga na ziemi i w niebie"
        ru: "мысль правления Бога на земле и на небе"
      - pl: "\nW zakazie, jakim to drzewo otoczył."
        ru: "в запрете, которым он окружил это дерево."
    words: { "szczególnej": szczegolny, "szerszą": szeroki, "koroną": korona, "strumieniu": strumien, "zakazie": zakaz, "otoczył": otoczyc }
  - clean: "Lecz gdy grzech rozum do tyla zamroczył,\nŻe ciebie razi słów mych światłość nowa;\nChcę, abyś w sercu wszystkie moje słowa\nJeśli nie spisał, to choć odmalował:\nJak pielgrzym kij swój, z którym pielgrzymował,\nUbrany w palmy na pamiątkę chowa»."
    verse: true
    chunks:
      - pl: "Lecz gdy grzech rozum do tyla zamroczył,"
        ru: "Но если грех так помрачил разум,"
      - pl: "\nŻe ciebie razi słów mych światłość nowa;"
        ru: "что тебя слепит новый свет моих слов;"
      - pl: "\nChcę, abyś w sercu wszystkie moje słowa"
        ru: "я хочу, чтобы ты все мои слова в сердце"
      - pl: "\nJeśli nie spisał, to choć odmalował:"
        ru: "если не записал, то хоть изобразил:"
      - pl: "\nJak pielgrzym kij swój, z którym pielgrzymował,"
        ru: "как паломник свой посох, с которым странствовал,"
      - pl: "\nUbrany w palmy na pamiątkę chowa»."
        ru: "украшенный пальмами, хранит на память»."
    words: { "sercu": serce, "wszystkie": wszystek, "spisał": spisac, "którym": ktory, "pamiątkę": pamiatka, "chowa": chowac }
  - clean: "A ja: «Jak odcisk na wosku pieczęci,\nPieczęć twa w mojej zostanie pamięci:\nLecz za co wznosisz lot słów tak wysoko,\nŻe najbystrzejsze nie dojrzy ich oko?»\n—«Abyś» mówiła «poznał, w jakiej szkole\nStyrałeś myśli po próżnym mozole,\nI abyś jasno widział w świetle nowem,\nIle nauka jej zgodna z mym słowem,\nI że od bożych dróg droga człowieka\nJest tak jak ziemia od nieba daleka»."
    verse: true
    chunks:
      - pl: "A ja: «Jak odcisk na wosku pieczęci,"
        ru: "А я: «Как оттиск печати на воске,"
