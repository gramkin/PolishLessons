# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 5
chapterTitle: "Pieśń V"
chapterTitleRu: "Песнь V. Франческа да Римини"
level: B2
paragraphs:
  - clean: "(Krąg II. Minos. Grzesznicy z miłości. Franczeska z Rimini.)"
    chunks:
      - pl: "(Krąg II. Minos. Grzesznicy z miłości. Franczeska z Rimini.)"
        ru: "(Круг II. Минос. Грешившие любовью. Франческа да Римини.)"
        note: "grzesznik — грешник; Franczeska — старое написание Franceska"
    words: { "Krąg": krag, "miłości": milosc }
  - clean: "Wszedłem w krąg drugi, ciaśniejszy, gdzie krzyki\nI jęki boleść zaostrza w ton dziki.\nTam straszny Minos z czołem nasrożonym\nPatrząc ponuro i zgrzytając wściekle,\nBada i sądzi wchodzące grzeszniki,\nWyroków swoich znak dając ogonem."
    verse: true
    chunks:
      - pl: "Wszedłem w krąg drugi, ciaśniejszy, gdzie krzyki"
        ru: "Я вошёл во второй круг, более тесный, где крики"
        note: "ciaśniejszy — сравн. от ciasny"
      - pl: "\nI jęki boleść zaostrza w ton dziki."
        ru: "и стоны боль обостряет до дикого тона."
        note: "zaostrzać — обострять"
      - pl: "\nTam straszny Minos z czołem nasrożonym"
        ru: "Там страшный Минос с нахмуренным челом,"
        note: "nasrożony — устар. «нахмуренный, свирепый»"
      - pl: "\nPatrząc ponuro i zgrzytając wściekle,"
        ru: "глядя мрачно и яростно скрежеща,"
        note: "ponuro — мрачно; wściekle — яростно"
      - pl: "\nBada i sądzi wchodzące grzeszniki,"
        ru: "исследует и судит входящих грешников,"
        note: "grzeszniki — старая форма вин. мн., ныне grzeszników"
      - pl: "\nWyroków swoich znak dając ogonem."
        ru: "давая знак своих приговоров хвостом."
        note: "wyrok — приговор; ogon — хвост"
    words: { "ciaśniejszy": ciasny, "straszny": straszny, "Bada": badac, "Wyroków": wyrok, "znak": znak, "ogonem": ogon }
  - clean: "Dusza, na której cięży grzechu plama,\nGdy przed nim staje, spowiada się sama.\nA on, głęboki znawca wagi grzechów,\nWidząc, gdzie miejsce zasłużyła w piekle,\nIle się razy ogonem obwinie,\nO tyle szczebli wśród szatańskich śmiechów\nDusza w dół spada w piekielne głębinie."
    verse: true
    chunks:
      - pl: "Dusza, na której cięży grzechu plama,"
        ru: "Душа, на которой тяготеет пятно греха,"
        note: "cięży — старое написание ciąży: «тяготеет»; plama — пятно"
      - pl: "\nGdy przed nim staje, spowiada się sama."
        ru: "когда предстаёт перед ним, исповедуется сама."
        note: "spowiadać się — исповедоваться"
      - pl: "\nA on, głęboki znawca wagi grzechów,"
        ru: "А он, глубокий знаток тяжести грехов,"
        note: "znawca — знаток; waga — вес, тяжесть"
      - pl: "\nWidząc, gdzie miejsce zasłużyła w piekle,"
        ru: "видя, какое место в аду она заслужила,"
      - pl: "\nIle się razy ogonem obwinie,"
        ru: "сколько раз хвостом обовьётся,"
        note: "obwinąć się — обвиться"
      - pl: "\nO tyle szczebli wśród szatańskich śmiechów"
        ru: "на столько ступеней среди сатанинского смеха"
        note: "szczebel — ступень"
      - pl: "\nDusza w dół spada w piekielne głębinie."
        ru: "душа падает вниз, в адские глубины."
        note: "głębinie — старая форма, ныне głębiny"
    words: { "grzechu": grzech, "plama": plama, "wagi": waga, "zasłużyła": zasluzyc, "śmiechów": smiech, "piekielne": piekielny }
  - clean: "Wciąż przed nim stoi wielka dusz gromada,\nJedna po drugiej na wyrok pośpiesza,\nMówi i słucha — i wnet w głąb zapada.\nMinos, postrzegłszy, że z mym mistrzem wchodzę,\nNa chwilę straszne swe sądy zawiesza\nI krzyknie ku mnie: «Zuchwały, nim wejdziesz,\nObacz, gdzie wchodzisz, zważ, na kogo liczysz,\nWchód tu szeroki, lecz wstecz nie odejdziesz»."
    verse: true
    chunks:
      - pl: "Wciąż przed nim stoi wielka dusz gromada,"
        ru: "Перед ним всё время стоит большая толпа душ,"
      - pl: "\nJedna po drugiej na wyrok pośpiesza,"
        ru: "одна за другой спешит на приговор,"
        note: "pośpieszać — спешить"
      - pl: "\nMówi i słucha — i wnet w głąb zapada."
        ru: "говорит и слушает — и тотчас низвергается в глубину."
        note: "zapadać — проваливаться"
      - pl: "\nMinos, postrzegłszy, że z mym mistrzem wchodzę,"
        ru: "Минос, заметив, что я вхожу с моим учителем,"
        note: "postrzegłszy — «заметив»"
      - pl: "\nNa chwilę straszne swe sądy zawiesza"
        ru: "на миг свои страшные суды приостанавливает"
        note: "zawieszać — приостанавливать"
      - pl: "\nI krzyknie ku mnie: «Zuchwały, nim wejdziesz,"
        ru: "и крикнет мне: «Дерзкий, прежде чем войдёшь,"
      - pl: "\nObacz, gdzie wchodzisz, zważ, na kogo liczysz,"
        ru: "посмотри, куда входишь, взвесь, на кого рассчитываешь,"
        note: "obaczyć — устар. «увидеть, посмотреть»; zważyć — взвесить"
      - pl: "\nWchód tu szeroki, lecz wstecz nie odejdziesz»."
        ru: "вход сюда широк, но назад ты не уйдёшь»."
        note: "wchód — устар. «вход»"
    words: { "głąb": glab, "mistrzem": mistrz, "sądy": sad, "liczysz": liczyc, "szeroki": szeroki, "wstecz": wstecz }
  - clean: "A mistrz ofuknął wzajem: «Co tak krzyczysz?\nNie tobie naszej sprzeciwić się drodze;\nTen mu ją wskazał, który wszystko może,\nCo chce. — Dość na tym! Nie wstrzymuj nas dłużej».\nWtem usłyszałem łkania i jęczenia\nI wszedłem w miejsce, gdzie mrok nieprzejrzany,\nNoc bez żadnego światła i promienia,\nA w głębi jego ryczy jakby morze,\nKiedy nim wiatry przeciwne śród burzy\nSzamocą, tłuką, aż do białej piany."
    verse: true
    chunks:
      - pl: "A mistrz ofuknął wzajem: «Co tak krzyczysz?"
        ru: "А учитель в ответ прикрикнул: «Что ты так кричишь?"
        note: "ofuknąć — прикрикнуть; wzajem — в ответ"
      - pl: "\nNie tobie naszej sprzeciwić się drodze;"
        ru: "Не тебе противиться нашему пути;"
        note: "sprzeciwić się czemuś — противиться чему-л. (дат. п.)"
      - pl: "\nTen mu ją wskazał, który wszystko może,"
        ru: "его указал Тот, кто может всё,"
      - pl: "\nCo chce. — Dość na tym! Nie wstrzymuj nas dłużej»."
        ru: "что хочет. — Довольно! Не задерживай нас дольше»."
        note: "dość na tym — довольно; wstrzymywać — задерживать"
      - pl: "\nWtem usłyszałem łkania i jęczenia"
        ru: "Тут я услышал рыдания и стенания"
        note: "łkanie — рыдание, всхлип"
      - pl: "\nI wszedłem w miejsce, gdzie mrok nieprzejrzany,"
        ru: "и вошёл в место, где мрак непроглядный,"
        note: "nieprzejrzany — непроглядный"
      - pl: "\nNoc bez żadnego światła i promienia,"
        ru: "ночь без всякого света и луча,"
      - pl: "\nA w głębi jego ryczy jakby morze,"
        ru: "а в глубине его ревёт словно море,"
        note: "ryczeć — реветь"
      - pl: "\nKiedy nim wiatry przeciwne śród burzy"
        ru: "когда его противные ветры среди бури"
        note: "śród — устар. «среди»"
      - pl: "\nSzamocą, tłuką, aż do białej piany."
        ru: "треплют, бьют до белой пены."
        note: "szamotać — трепать; tłuc — бить; piana — пена"
    words: { "sprzeciwić": sprzeciwic, "wskazał": wskazac, "mrok": mrok, "promienia": promien, "przeciwne": przeciwny, "burzy": burza }
  - clean: "Wicher piekielny ciągle się tam sroży,\nPorywa duchy, unosi i ciska\nO potrzaskanej skały rumowiska,\nGdzie jęcząc, płacząc, bluźnią mocy bożej.\nGrzesznicy owi te cierpią katusze,\nCo swe zmysłami ścieleśnili dusze."
    verse: true
    chunks:
      - pl: "Wicher piekielny ciągle się tam sroży,"
        ru: "Адский вихрь непрестанно там свирепствует,"
        note: "srożyć się — свирепствовать"
      - pl: "\nPorywa duchy, unosi i ciska"
        ru: "хватает духов, уносит и швыряет"
        note: "ciskać — швырять"
      - pl: "\nO potrzaskanej skały rumowiska,"
        ru: "о развалины расколотой скалы,"
        note: "potrzaskany — расколотый; rumowisko — развалины, осыпь"
      - pl: "\nGdzie jęcząc, płacząc, bluźnią mocy bożej."
        ru: "где, стеная, плача, они хулят Божью силу."
        note: "bluźnić czemuś — хулить"
      - pl: "\nGrzesznicy owi te cierpią katusze,"
        ru: "Эти грешники терпят такие муки,"
        note: "owi — те (книжн.); katusze — муки, пытки"
      - pl: "\nCo swe zmysłami ścieleśnili dusze."
        ru: "что свои души сделали плотью через чувства."
        note: "ścieleśnić — устар. «овеществить, сделать плотским»; zmysły — чувства"
    words: { "duchy": duch, "skały": skala, "płacząc": plakac, "bożej": bozy, "cierpią": cierpiec, "zmysłami": zmysl }
  - clean: "A jako w jesień, w czas odlotu ptaków,\nGęstymi pułki lecą stada szpaków,\nTak owe duchy wiatr prądem zawiei\nGnał tu i owdzie: i znać z ich wejrzenia,\nŻe już na wieki pozbyły nadziei\nNie tylko kresu, lecz ulgi cierpienia."
    verse: true
    chunks:
      - pl: "A jako w jesień, w czas odlotu ptaków,"
        ru: "И как осенью, в пору отлёта птиц,"
        note: "odlot — отлёт"
      - pl: "\nGęstymi pułki lecą stada szpaków,"
        ru: "густыми полками летят стаи скворцов,"
        note: "pułki — устар. твор. мн. «полками»; szpak — скворец"
      - pl: "\nTak owe duchy wiatr prądem zawiei"
        ru: "так этих духов ветер потоком вьюги"
        note: "zawieja — вьюга, метель"
      - pl: "\nGnał tu i owdzie: i znać z ich wejrzenia,"
        ru: "гнал туда и сюда; и видно по их взгляду,"
        note: "tu i owdzie — тут и там; znać — видно"
      - pl: "\nŻe już na wieki pozbyły nadziei"
        ru: "что они навеки лишились надежды"
        note: "pozbyć się czegoś — лишиться"
      - pl: "\nNie tylko kresu, lecz ulgi cierpienia."
        ru: "не только на конец, но и на облегчение страдания."
        note: "kres — конец, предел; ulga — облегчение"
    words: { "jesień": jesien, "stada": stado, "wiatr": wiatr, "prądem": prad, "kresu": kres, "ulgi": ulga }
  - clean: "I jak żurawie w powietrznej przestrzeni\nLecą i nucą żałośnie: tak ku mnie,\nJęcząc, gromady nieszczęśliwych cieni\nPędzone wiatrem zbliżały się tłumnie.\n«O! Mistrzu!» rzekłem, «I któż są te dusze,\nTak udręczone w ciągłej zawierusze?»"
    verse: true
    chunks:
      - pl: "I jak żurawie w powietrznej przestrzeni"
        ru: "И как журавли в воздушном пространстве"
        note: "żuraw — журавль"
      - pl: "\nLecą i nucą żałośnie: tak ku mnie,"
        ru: "летят и печально поют — так ко мне,"
        note: "nucić — напевать; żałośnie — жалобно"
      - pl: "\nJęcząc, gromady nieszczęśliwych cieni"
        ru: "стеная, толпы несчастных теней,"
      - pl: "\nPędzone wiatrem zbliżały się tłumnie."
        ru: "гонимые ветром, приближались скопом."
        note: "tłumnie — толпой"
      - pl: "\n«O! Mistrzu!» rzekłem, «I któż są te dusze,"
        ru: "«О учитель! — сказал я. — И кто же эти души,"
        note: "któż — кто же"
      - pl: "\nTak udręczone w ciągłej zawierusze?»"
        ru: "так измученные в непрестанной вьюге?»"
        note: "udręczony — измученный; zawierucha — вьюга, смута"
    words: { "powietrznej": powietrzny, "przestrzeni": przestrzen, "nieszczęśliwych": nieszczesliwy, "Pędzone": pedzic, "rzekłem": rzec, "ciągłej": ciagly }
  - clean: "A mistrz: — «Ta pierwsza, co widzisz, po przedzie\nRej chóru duchów na powietrzu wiedzie,\nPrzed wieki była wielu ziem królową\nI wielu ludów różnych krwią i mową,\nLecz oszalała krewkością namiętną,\nPrawem zatarła kazirodztwa piętno,\nBy hańbą w dziejach nie ciężyło na niej."
    verse: true
    chunks:
      - pl: "A mistrz: — «Ta pierwsza, co widzisz, po przedzie"
        ru: "А учитель: «Та первая, которую видишь впереди,"
        note: "po przedzie — впереди"
      - pl: "\nRej chóru duchów na powietrzu wiedzie,"
        ru: "что верховодит хором духов в воздухе,"
        note: "wodzić rej — верховодить"
      - pl: "\nPrzed wieki była wielu ziem królową"
        ru: "в давние века была царицей многих земель"
        note: "przed wieki — устар. «в давние века»"
      - pl: "\nI wielu ludów różnych krwią i mową,"
        ru: "и многих народов, различных кровью и речью,"
        note: "mowa — язык, речь"
      - pl: "\nLecz oszalała krewkością namiętną,"
        ru: "но, обезумев от страстной пылкости,"
        note: "krewkość — горячность, пылкость"
      - pl: "\nPrawem zatarła kazirodztwa piętno,"
        ru: "законом стёрла клеймо кровосмешения,"
        note: "zatrzeć — стереть; kazirodztwo — кровосмешение; piętno — клеймо"
      - pl: "\nBy hańbą w dziejach nie ciężyło na niej."
        ru: "чтобы позором в истории не лежало на ней."
        note: "dzieje — история"
    words: { "przedzie": przod, "chóru": chor, "królową": krolowa, "ludów": lud, "oszalała": oszalec, "hańbą": hanba }
  - clean: "To Semiramis, dziedziczka i pani\nKrajów azyjskich, gdzie dziś Turczyn broi.\nTa druga z sercem miłością zranionem,\nDni swe przecięła dobrowolnym zgonem,\nŁamiąc przysięgę cieniom Sycheusza.\nTo Kleopatra na chuć rozpasana."
    verse: true
    chunks:
      - pl: "To Semiramis, dziedziczka i pani"
        ru: "Это Семирамида, наследница и владычица"
        note: "dziedziczka — наследница"
      - pl: "\nKrajów azyjskich, gdzie dziś Turczyn broi."
        ru: "азиатских стран, где ныне бесчинствует турок."
        note: "azyjski — старое написание azjatycki; broić — проказничать, бесчинствовать"
      - pl: "\nTa druga z sercem miłością zranionem,"
        ru: "Вторая, с сердцем, раненным любовью,"
        note: "zranionem — ныне zranionym"
      - pl: "\nDni swe przecięła dobrowolnym zgonem,"
        ru: "пресекла свои дни добровольной смертью,"
        note: "przeciąć — пресечь; zgon — смерть, кончина"
      - pl: "\nŁamiąc przysięgę cieniom Sycheusza."
        ru: "нарушив клятву, [данную] праху Сихея."
        note: "Дидона; przysięga — клятва; Sycheusz — Сихей, её покойный муж"
      - pl: "\nTo Kleopatra na chuć rozpasana."
        ru: "Это Клеопатра, разнузданная в похоти."
        note: "chuć — похоть; rozpasany — разнузданный"
    words: { "Krajów": kraj, "sercem": serce, "przecięła": przeciac, "zgonem": zgon, "Łamiąc": lamac, "przysięgę": przysiega }
  - clean: "Helena, Parys, sprawcy nieszczęść Troi;\nAchilles, można, ale krewka dusza,\nObok błędnego rycerza Tristana».\nI tłum dusz innych wskazał mi Wirgili,\nCo żądz gorączką życie przetrawili;\nA ja, gdym słyszał zwane po imieniu\nStarego świata niewiasty i męże,\nLitość, myślałem, zmysły mi rozprzęże,\nI jak wpół martwy stałem w osłupieniu."
    verse: true
    chunks:
      - pl: "Helena, Parys, sprawcy nieszczęść Troi;"
        ru: "Елена, Парис, виновники бедствий Трои;"
        note: "sprawca — виновник"
      - pl: "\nAchilles, można, ale krewka dusza,"
        ru: "Ахилл, могучая, но горячая душа,"
        note: "można — краткая форма: «могучая»; krewki — горячий, вспыльчивый"
      - pl: "\nObok błędnego rycerza Tristana»."
        ru: "рядом со странствующим рыцарем Тристаном»."
        note: "błędny rycerz — странствующий рыцарь"
      - pl: "\nI tłum dusz innych wskazał mi Wirgili,"
        ru: "И толпу других душ указал мне Вергилий,"
        note: "Wirgili — у Korsaka и Wirgiliusz, и Wirgili"
      - pl: "\nCo żądz gorączką życie przetrawili;"
        ru: "что жизнь сожгли в лихорадке вожделений;"
        note: "gorączka — лихорадка; przetrawić — растратить, переварить"
      - pl: "\nA ja, gdym słyszał zwane po imieniu"
        ru: "а я, когда услышал, как называют по имени"
        note: "zwane — называемые"
      - pl: "\nStarego świata niewiasty i męże,"
        ru: "жён и мужей древнего мира,"
        note: "męże — старое мн., ныне mężowie"
      - pl: "\nLitość, myślałem, zmysły mi rozprzęże,"
        ru: "думал, что жалость расстроит мои чувства,"
        note: "rozprząc — расстроить, расшатать"
      - pl: "\nI jak wpół martwy stałem w osłupieniu."
        ru: "и, как полумёртвый, стоял в оцепенении."
        note: "wpół — наполовину; osłupienie — оцепенение"
    words: { "sprawcy": sprawca, "nieszczęść": nieszczescie, "rycerza": rycerz, "gorączką": goraczka, "niewiasty": niewiasta, "Litość": litosc }
  - clean: "I mówię: «Mistrzu! kto są te dwa duchy,\nKtóre wiatr lekko unosi jak puchy?\nChcę mówić z nimi». — «Czekaj», mistrz powiada\n«Aż je tu ku nam wiatr przywieje bliżej\nZaklnij na miłość, która nimi włada,\nA zlecą ku nam». — Gdy lecieli niżej,\nRzekłem — «Pomówcie z nami, nieszczęśliwi!"
    verse: true
    chunks:
