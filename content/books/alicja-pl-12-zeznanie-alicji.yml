  - clean: "„Och, bardzo przepraszam!”, wykrzyknęła tonem wielkiego przerażenia i zaczęła podnosić ich z powrotem tak szybko, jak tylko mogła, bo wciąż chodził jej po głowie wypadek ze złotymi rybkami i miała mgliste wrażenie, że trzeba ich natychmiast pozbierać i włożyć z powrotem do ławy przysięgłych, bo inaczej pozdychają."
    en: "“Oh, I _beg_ your pardon!” she exclaimed in a tone of great dismay, and began picking them up again as quickly as she could, for the accident of the goldfish kept running in her head, and she had a vague sort of idea that they must be collected at once and put back into the jury-box, or they would die."
    draft: true
    chunks:
      - pl: "„Och, bardzo przepraszam!”, wykrzyknęła tonem wielkiego przerażenia i zaczęła podnosić ich z powrotem tak szybko, jak tylko mogła,"
        ru: "«Ох, простите, пожалуйста!» — воскликнула она тоном великого ужаса и принялась поднимать их обратно так быстро, как только могла,"
        note: "przepraszam — прошу прощения, извините"
      - pl: " bo wciąż chodził jej po głowie wypadek ze złotymi rybkami i miała mgliste wrażenie, że trzeba ich natychmiast pozbierać i włożyć z powrotem do ławy przysięgłych, bo inaczej pozdychają."
        ru: "потому что случай с золотыми рыбками всё не выходил у неё из головы, и у неё было смутное чувство, что их надо немедленно собрать и положить обратно на скамью присяжных, а иначе они передохнут."
        note: "chodzić komuś po głowie — не выходить у кого-л. из головы"
    words: { "tonem": ton, "powrotem": powrot, "szybko": szybko, "wciąż": wciaz, "wypadek": wypadek, "wrażenie": wrazenie, "trzeba": trzeba, "natychmiast": natychmiast, "włożyć": wlozyc }
  - clean: "„Rozprawa nie może się toczyć dalej”, powiedział Król bardzo poważnym głosem, „dopóki wszyscy przysięgli nie wrócą na swoje właściwe miejsca — wszyscy”, powtórzył z wielkim naciskiem, patrząc przy tym surowo na Alicję."
    en: "“The trial cannot proceed,” said the King in a very grave voice, “until all the jurymen are back in their proper places—_all_,” he repeated with great emphasis, looking hard at Alice as he said so."
    draft: true
    chunks:
      - pl: "„Rozprawa nie może się toczyć dalej”, powiedział Król bardzo poważnym głosem, „dopóki wszyscy przysięgli nie wrócą na swoje właściwe miejsca — wszyscy”,"
        ru: "«Суд не может идти дальше», — сказал Король очень серьёзным голосом, — «пока все присяжные не вернутся на свои надлежащие места — все»,"
        note: "toczyć się — идти, вестись (о процессе)"
      - pl: " powtórzył z wielkim naciskiem, patrząc przy tym surowo na Alicję."
        ru: "повторил он с большим нажимом, сурово глядя при этом на Алису."
        note: "z naciskiem — с нажимом, настойчиво"
    words: { "toczyć": toczyc, "dalej": dalej, "Król": krol, "poważnym": powazny, "głosem": glos, "właściwe": wlasciwy, "powtórzył": powtorzyc, "patrząc": patrzec }
  - clean: "Alicja spojrzała na ławę przysięgłych i zobaczyła, że w pośpiechu włożyła Jaszczurkę głową w dół, a biedactwo machało melancholijnie ogonem, zupełnie nie mogąc się poruszyć. Wkrótce wyjęła je i ustawiła właściwie; „nie żeby to miało wielkie znaczenie”, powiedziała sobie; „sądzę, że w tej rozprawie będzie z niej dokładnie tyle samo pożytku tak czy owak.”"
    en: "Alice looked at the jury-box, and saw that, in her haste, she had put the Lizard in head downwards, and the poor little thing was waving its tail about in a melancholy way, being quite unable to move. She soon got it out again, and put it right; “not that it signifies much,” she said to herself; “I should think it would be _quite_ as much use in the trial one way up as the other.”"
    draft: true
    chunks:
      - pl: "Alicja spojrzała na ławę przysięgłych i zobaczyła, że w pośpiechu włożyła Jaszczurkę głową w dół,"
        ru: "Алиса посмотрела на скамью присяжных и увидела, что в спешке сунула Ящерку головой вниз,"
        note: "w pośpiechu — в спешке"
      - pl: " a biedactwo machało melancholijnie ogonem, zupełnie nie mogąc się poruszyć."
        ru: "а бедняжка меланхолично махала хвостом, совершенно не в силах пошевелиться."
        note: "machać czymś — махать чем-л.: творительный падеж"
      - pl: " Wkrótce wyjęła je i ustawiła właściwie;"
        ru: "Вскоре она вынула её и поставила как надо;"
        note: "wyjąć — вынуть, достать"
      - pl: " „nie żeby to miało wielkie znaczenie”, powiedziała sobie; „sądzę, że w tej rozprawie będzie z niej dokładnie tyle samo pożytku tak czy owak.”"
        ru: "«не то чтобы это имело большое значение», — сказала она себе; «полагаю, в этом суде от неё будет ровно столько же пользы так или этак.»"
        note: "tak czy owak — так или иначе"
    words: { "spojrzała": spojrzec, "poruszyć": poruszyc, "Wkrótce": wkrotce, "ustawiła": ustawic, "właściwie": wlasciwie, "sądzę": sadzic, "dokładnie": dokladnie, "tyle": tyl }
  - clean: "Gdy tylko przysięgli trochę ochłonęli po wstrząsie związanym z przewróceniem, a ich tabliczki i rysiki zostały odnalezione i oddane, zabrali się bardzo pilnie do spisywania dziejów wypadku — wszyscy prócz Jaszczurki, która zdawała się zbyt wstrząśnięta, żeby robić cokolwiek poza siedzeniem z otwartym pyskiem i wpatrywaniem się w sufit sali sądowej."
    en: "As soon as the jury had a little recovered from the shock of being upset, and their slates and pencils had been found and handed back to them, they set to work very diligently to write out a history of the accident, all except the Lizard, who seemed too much overcome to do anything but sit with its mouth open, gazing up into the roof of the court."
    draft: true
    chunks:
      - pl: "Gdy tylko przysięgli trochę ochłonęli po wstrząsie związanym z przewróceniem, a ich tabliczki i rysiki zostały odnalezione i oddane,"
