      - pl: " wszyscy prócz Jaszczurki, która zdawała się zbyt wstrząśnięta, żeby robić cokolwiek poza siedzeniem z otwartym pyskiem i wpatrywaniem się w sufit sali sądowej."
        ru: "все кроме Ящерки, которая казалась слишком потрясённой, чтобы делать что-либо, кроме как сидеть с открытым ртом и глядеть в потолок зала суда."
        note: "wstrząśnięty — потрясённый"
    words: { "związanym": zwiazac, "odnalezione": odnalezc, "oddane": oddac, "dziejów": dzieje, "zdawała": zdawac, "zbyt": zbyt, "wstrząśnięta": wstrzasnac, "siedzeniem": siedziec, "otwartym": otworzyc, "sali": sala }
