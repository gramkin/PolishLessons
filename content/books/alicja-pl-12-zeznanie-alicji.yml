paragraphs:
  - clean: "„Tutaj!”, zawołała Alicja, zapominając zupełnie w zamieszaniu chwili, jak bardzo urosła przez ostatnie kilka minut, i zerwała się tak gwałtownie, że brzegiem sukienki przewróciła ławę przysięgłych, strącając wszystkich przysięgłych na głowy tłumu w dole; i leżeli tam rozciągnięci, przypominając jej bardzo kuliste akwarium ze złotymi rybkami, które przypadkiem przewróciła tydzień wcześniej."
    en: "“Here!” cried Alice, quite forgetting in the flurry of the moment how large she had grown in the last few minutes, and she jumped up in such a hurry that she tipped over the jury-box with the edge of her skirt, upsetting all the jurymen on to the heads of the crowd below, and there they lay sprawling about, reminding her very much of a globe of goldfish she had accidentally upset the week before."
    draft: true
    chunks:
      - pl: "„Tutaj!”, zawołała Alicja, zapominając zupełnie w zamieszaniu chwili, jak bardzo urosła przez ostatnie kilka minut,"
        ru: "«Здесь!» — закричала Алиса, совсем забыв в суматохе минуты, как сильно она выросла за последние несколько минут,"
        note: "zapominając — забыв: деепричастие несовершенного вида"
      - pl: " i zerwała się tak gwałtownie, że brzegiem sukienki przewróciła ławę przysięgłych,"
        ru: "и вскочила так резко, что краем платья опрокинула скамью присяжных,"
        note: "zerwać się — вскочить, сорваться с места"
      - pl: " strącając wszystkich przysięgłych na głowy tłumu w dole;"
        ru: "сбросив всех присяжных на головы толпы внизу;"
        note: "strącać — сбрасывать, сшибать"
      - pl: " i leżeli tam rozciągnięci, przypominając jej bardzo kuliste akwarium ze złotymi rybkami, które przypadkiem przewróciła tydzień wcześniej."
        ru: "и они лежали там, растянувшись, очень напоминая ей круглый аквариум с золотыми рыбками, который она случайно опрокинула неделей раньше."
        note: "przypominać komuś coś — напоминать кому-л. что-л.: дательный падеж"
