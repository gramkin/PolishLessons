  - clean: "Księżyc przebiegał tor słonecznej jazdy\nW chwili, gdy widział Rzym już zachodzące\nMiędzy Sardynią a Korsyką słońce.\nTen, przez którego gródek Pietoli,\nWięcej od miasta Mantuanów słynny,\nCiężar z mych myśli zdjął mistrz dobroczynny."
    verse: true
    chunks:
      - pl: "Księżyc przebiegał tor słonecznej jazdy"
        ru: "Луна пробегала путь солнечной колесницы"
      - pl: "\nW chwili, gdy widział Rzym już zachodzące"
        ru: "в тот миг, когда Рим видит заходящее"
      - pl: "\nMiędzy Sardynią a Korsyką słońce."
        ru: "между Сардинией и Корсикой солнце."
      - pl: "\nTen, przez którego gródek Pietoli,"
        ru: "Тот, благодаря кому городок Пьетоле"
        note: "родина Вергилия"
      - pl: "\nWięcej od miasta Mantuanów słynny,"
