paragraphs:
  - clean: "(O miłości. Cienie. Opat Albert.)"
    chunks:
      - pl: "(O miłości. Cienie. Opat Albert.)"
        ru: "(О любви. Тени. Аббат Альберто.)"
        note: "opat — аббат"
    words: { "miłości": milosc }
  - clean: "Rozumowanie skończył mistrz uczony,\nI bystro na mnie patrzał, czy rad byłem;\nJa nowym jeszcze pragnieniem drażniony,\nMilczałem zewnątrz, a wewnątrz mówiłem:\n«Może go zbytkiem zapytań morduję».\nLecz ten prawdziwy ojciec, gdy chęć całą\nOdkrył, co serce z bojaźni skrywało,\nMówiąc sam, skłonił przemówić doń śmiało."
    verse: true
    chunks:
      - pl: "Rozumowanie skończył mistrz uczony,"
        ru: "Учёный учитель окончил рассуждение"
        note: "rozumowanie — рассуждение"
      - pl: "\nI bystro na mnie patrzał, czy rad byłem;"
        ru: "и зорко смотрел на меня, доволен ли я;"
      - pl: "\nJa nowym jeszcze pragnieniem drażniony,"
        ru: "я же, раздразнённый ещё новой жаждой,"
      - pl: "\nMilczałem zewnątrz, a wewnątrz mówiłem:"
        ru: "молчал снаружи, а внутри говорил:"
      - pl: "\n«Może go zbytkiem zapytań morduję»."
        ru: "«Может, я его утомляю избытком вопросов»."
        note: "mordować — мучить, утомлять"
      - pl: "\nLecz ten prawdziwy ojciec, gdy chęć całą"
        ru: "Но этот истинный отец, когда всё желание,"
      - pl: "\nOdkrył, co serce z bojaźni skrywało,"
        ru: "что сердце скрывало от боязни, открыл,"
      - pl: "\nMówiąc sam, skłonił przemówić doń śmiało."
        ru: "сам заговорив, склонил меня смело заговорить с ним."
    words: { "mistrz": mistrz, "pragnieniem": pragnienie, "Milczałem": milczec, "chęć": chec, "Odkrył": odkryc, "przemówić": przemowic }
  - clean: "«Mistrzu, twym światłem do tyla się krzepi\nWzrok mój, że jasno myśl twych słów pojmuję,\nProszę, mój ojcze, w jaśniejszej przeźroczy\nPokaż tę miłość, do której przyczyny\nOdnosisz wszelkie dobre i złe czyny».\n«Zwróć ku mnie» mówił «przenikliwe oczy."
    verse: true
    chunks:
      - pl: "«Mistrzu, twym światłem do tyla się krzepi"
        ru: "«Учитель, твоим светом так укрепляется"
      - pl: "\nWzrok mój, że jasno myśl twych słów pojmuję,"
        ru: "мой взгляд, что я ясно понимаю мысль твоих слов,"
      - pl: "\nProszę, mój ojcze, w jaśniejszej przeźroczy"
        ru: "прошу, мой отец, в более ясной прозрачности"
      - pl: "\nPokaż tę miłość, do której przyczyny"
        ru: "покажи эту любовь, к причине которой"
      - pl: "\nOdnosisz wszelkie dobre i złe czyny»."
        ru: "ты относишь все добрые и злые дела»."
      - pl: "\n«Zwróć ku mnie» mówił «przenikliwe oczy."
        ru: "«Обрати ко мне, — сказал он, — проницательные очи"
    words: { "światłem": swiatlo, "Wzrok": wzrok, "przyczyny": przyczyna, "czyny": czyn, "wszelkie": wszelki, "Zwróć": zwrocic }
  - clean: "Twego rozumu, a ujrzysz błąd lepiej\nTych, co chcą drugich prowadzić, choć ślepi.\nSerce, stworzone z skłonnością kochania,\nW czym upodoba, za tym się ugania\nW chwili, gdy czuje pociąg podobania.\nPojęcie wasze, co w lot wszystko łowi,\nSchwycony przedmiot przedstawia duchowi:\nW nim takim blaskiem ten przedmiot pozłaca,\nŻe wprost ku niemu dusza się obraca:\nI gdy się wznosi doń z żywą skłonnością,\nJest przyrodzoną ta skłonność miłością,\nKtóra przez rozkosz z wami się tak splata."
    verse: true
    chunks:
      - pl: "Twego rozumu, a ujrzysz błąd lepiej"
        ru: "своего разума, и ты лучше увидишь заблуждение"
      - pl: "\nTych, co chcą drugich prowadzić, choć ślepi."
        ru: "тех, кто хочет вести других, хоть сами слепы."
      - pl: "\nSerce, stworzone z skłonnością kochania,"
        ru: "Сердце, созданное со склонностью любить,"
      - pl: "\nW czym upodoba, za tym się ugania"
        ru: "за тем, что ему понравится, и гонится"
      - pl: "\nW chwili, gdy czuje pociąg podobania."
        ru: "в тот миг, когда чувствует влечение к приятному."
      - pl: "\nPojęcie wasze, co w lot wszystko łowi,"
        ru: "Ваше восприятие, что на лету всё ловит,"
        note: "pojęcie — здесь «восприятие»"
      - pl: "\nSchwycony przedmiot przedstawia duchowi:"
        ru: "представляет духу схваченный предмет:"
      - pl: "\nW nim takim blaskiem ten przedmiot pozłaca,"
        ru: "в нём оно таким блеском позлащает этот предмет,"
      - pl: "\nŻe wprost ku niemu dusza się obraca:"
        ru: "что душа прямо к нему обращается:"
      - pl: "\nI gdy się wznosi doń z żywą skłonnością,"
        ru: "и когда она возносится к нему с живой склонностью,"
      - pl: "\nJest przyrodzoną ta skłonność miłością,"
        ru: "эта склонность есть природная любовь,"
      - pl: "\nKtóra przez rozkosz z wami się tak splata."
        ru: "что через наслаждение так сплетается с вами."
    words: { "rozumu": rozum, "ujrzysz": ujrzec, "przedmiot": przedmiot, "przedstawia": przedstawiac, "blaskiem": blask, "wznosi": wznosic }
  - clean: "I jako płomię, co w powietrze wzlata,\nSpełniając ślepą swej natury wolę,\nGdzie się przepala dłużej w swym żywiole,\nTak nakłoniona poddaje się dusza\nŻądzy, ten bodziec duchowy porusza\nSerce człowieka nieustannym biciem,\nNim rzecz kochana stanie się użyciem."
    verse: true
    chunks:
      - pl: "I jako płomię, co w powietrze wzlata,"
        ru: "И как пламя, что взлетает в воздух,"
      - pl: "\nSpełniając ślepą swej natury wolę,"
        ru: "исполняя слепую волю своей природы,"
      - pl: "\nGdzie się przepala dłużej w swym żywiole,"
        ru: "туда, где дольше горит в своей стихии,"
        note: "żywioł — стихия"
      - pl: "\nTak nakłoniona poddaje się dusza"
        ru: "так склонённая душа покоряется"
      - pl: "\nŻądzy, ten bodziec duchowy porusza"
        ru: "желанию; этот духовный стимул движет"
      - pl: "\nSerce człowieka nieustannym biciem,"
        ru: "сердце человека непрестанным биением,"
      - pl: "\nNim rzecz kochana stanie się użyciem."
        ru: "пока любимая вещь не станет обладанием."
        note: "użycie — обладание"
    words: { "powietrze": powietrze, "natury": natura, "żywiole": zywiol, "poddaje": poddawac, "duchowy": duchowy, "porusza": poruszac }
  - clean: "Widzisz, jak prawdzie błąd kłamstwo zadaje,\nTwierdząc, co dłużej zbijać niepotrzebna,\nŻe każda miłość jest w sobie chwalebna.\nTreść jej, być może, dobrą mu się zdaje;\nŻe wosk jest dobry, czyś przyznać gotowy,\nŻe dobrym każdy jest odcisk woskowy?»"
    verse: true
    chunks:
      - pl: "Widzisz, jak prawdzie błąd kłamstwo zadaje,"
        ru: "Видишь, как ложь заблуждения наносит рану правде,"
      - pl: "\nTwierdząc, co dłużej zbijać niepotrzebna,"
        ru: "утверждая — что дольше опровергать не нужно, —"
        note: "zbijać — опровергать"
      - pl: "\nŻe każda miłość jest w sobie chwalebna."
        ru: "что каждая любовь сама по себе похвальна."
      - pl: "\nTreść jej, być może, dobrą mu się zdaje;"
        ru: "Её материя, может быть, кажется ему доброй;"
      - pl: "\nŻe wosk jest dobry, czyś przyznać gotowy,"
        ru: "но если воск хорош, готов ли ты признать,"
      - pl: "\nŻe dobrym każdy jest odcisk woskowy?»"
        ru: "что хорош и каждый восковой оттиск?»"
        note: "odcisk — оттиск"
    words: { "kłamstwo": klamstwo, "zadaje": zadawac, "Twierdząc": twierdzic, "niepotrzebna": niepotrzebny, "zdaje": zdawac, "odcisk": odcisk }
  - clean: "«Jasno mi rozum przy świetle twej mowy»,\nOdpowiedziałem «wytłumaczył miłość,\nLecz sam uwięznął w zwątpienia zawiłość.\nBo jeśli miłość w nas ostrzem swych grotów\nUgadza z łuku zewnętrznych przedmiotów,\nŻadnej zasługi dusza mieć nie może,\nCzy idzie prosto, czy schodzi w rozdroże»."
    verse: true
    chunks:
      - pl: "«Jasno mi rozum przy świetle twej mowy»,"
        ru: "«Ясно мне разум при свете твоей речи, —"
      - pl: "\nOdpowiedziałem «wytłumaczył miłość,"
        ru: "ответил я, — объяснил любовь,"
      - pl: "\nLecz sam uwięznął w zwątpienia zawiłość."
        ru: "но сам застрял в запутанности сомнения."
        note: "zawiłość — запутанность"
      - pl: "\nBo jeśli miłość w nas ostrzem swych grotów"
        ru: "Ибо если любовь в нас остриём своих стрел"
      - pl: "\nUgadza z łuku zewnętrznych przedmiotów,"
        ru: "поражает с лука внешних предметов,"
      - pl: "\nŻadnej zasługi dusza mieć nie może,"
        ru: "никакой заслуги душа иметь не может,"
      - pl: "\nCzy idzie prosto, czy schodzi w rozdroże»."
        ru: "идёт ли она прямо или сходит на распутье»."
    words: { "wytłumaczył": wytlumaczyc, "ostrzem": ostrze, "łuku": luk, "zewnętrznych": zewnetrzny, "zasługi": zasluga, "schodzi": schodzic }
  - clean: "Mistrz: «Ile zdolna rozumu potęga,\nPunkt ten objaśnię, dalej on nie sięga,\nCzekaj, aż dojdziesz sam do Beatrycy,\nBo wiara klucz ma od tej tajemnicy.\nKażdy duch z treści swojej niewcielony,\nRóżny od ciała, jednak z nim złączony,\nZamknięty w sobie ma własność szczególną,\nKtórej nam uczuć i dowieść nie wolno:\nLecz się objawia przez skutki i czyny\nJak przez zielony liść życie rośliny."
    verse: true
    chunks:
      - pl: "Mistrz: «Ile zdolna rozumu potęga,"
        ru: "Учитель: «Насколько способна сила разума,"
      - pl: "\nPunkt ten objaśnię, dalej on nie sięga,"
        ru: "эту точку я объясню, дальше он не достаёт,"
      - pl: "\nCzekaj, aż dojdziesz sam do Beatrycy,"
        ru: "жди, пока сам не дойдёшь до Беатриче,"
      - pl: "\nBo wiara klucz ma od tej tajemnicy."
        ru: "ибо у веры ключ от этой тайны."
      - pl: "\nKażdy duch z treści swojej niewcielony,"
        ru: "Каждый дух, по своей сути невоплощённый,"
        note: "niewcielony — невоплощённый"
      - pl: "\nRóżny od ciała, jednak z nim złączony,"
        ru: "отличный от тела, однако с ним соединённый,"
      - pl: "\nZamknięty w sobie ma własność szczególną,"
        ru: "имеет, замкнутый в себе, особое свойство,"
      - pl: "\nKtórej nam uczuć i dowieść nie wolno:"
        ru: "которое нам нельзя ощутить и доказать:"
      - pl: "\nLecz się objawia przez skutki i czyny"
        ru: "но оно проявляется через следствия и дела,"
      - pl: "\nJak przez zielony liść życie rośliny."
        ru: "как жизнь растения — через зелёный лист."
    words: { "potęga": potega, "sięga": siegac, "szczególną": szczegolny, "dowieść": dowiesc, "skutki": skutek, "rośliny": roslina }
  - clean: "Człowiek nic nie wie, skąd się w nim lgnie miłość,\nJaka pociągów pierwszych jest pochyłość,\nKtóre podobnie są w nas jako w pszczole,\nDla miodobrania latającej w pole.\nTa pierwsza wola, co skłonność prowadzi,\nNi do pochwały jest, ni do zganienia."
    verse: true
    chunks:
      - pl: "Człowiek nic nie wie, skąd się w nim lgnie miłość,"
        ru: "Человек не знает, откуда в нём льнёт любовь,"
      - pl: "\nJaka pociągów pierwszych jest pochyłość,"
        ru: "какова склонность первых влечений,"
      - pl: "\nKtóre podobnie są w nas jako w pszczole,"
        ru: "которые в нас подобны тем, что в пчеле,"
      - pl: "\nDla miodobrania latającej w pole."
        ru: "летящей в поле за сбором мёда."
        note: "miodobranie — сбор мёда"
      - pl: "\nTa pierwsza wola, co skłonność prowadzi,"
        ru: "Эта первая воля, что ведёт склонность,"
      - pl: "\nNi do pochwały jest, ni do zganienia."
        ru: "не заслуживает ни похвалы, ни порицания."
        note: "zganienie — порицание"
    words: { "Człowiek": czlowiek, "pociągów": pociag, "podobnie": podobnie, "pszczole": pszczola, "latającej": latac, "prowadzi": prowadzic }
  - clean: "Więc gdyby wszystko zlać w tę arcywolę,\nMacie wrodzony przymiot, który radzi,\nKtóry stać winien w progu przyzwolenia.\nRozum jest gruntem, skąd dla was wypływa\nPowód zasługi, zasługa prawdziwa,\nPodług jak waszej panując krewkości,\nUprawnia dobre albo złe skłonności."
    verse: true
    chunks:
      - pl: "Więc gdyby wszystko zlać w tę arcywolę,"
        ru: "Итак, чтобы всё слить с этой высшей волей,"
      - pl: "\nMacie wrodzony przymiot, który radzi,"
        ru: "у вас есть врождённое свойство, которое советует,"
        note: "przymiot — свойство"
      - pl: "\nKtóry stać winien w progu przyzwolenia."
        ru: "которое должно стоять на пороге согласия."
        note: "przyzwolenie — согласие"
      - pl: "\nRozum jest gruntem, skąd dla was wypływa"
        ru: "Разум — основание, откуда для вас проистекает"
      - pl: "\nPowód zasługi, zasługa prawdziwa,"
        ru: "причина заслуги, истинная заслуга,"
      - pl: "\nPodług jak waszej panując krewkości,"
        ru: "смотря по тому, как, властвуя над вашей горячностью,"
      - pl: "\nUprawnia dobre albo złe skłonności."
        ru: "он даёт ход добрым или злым склонностям."
        note: "uprawniać — узаконивать"
    words: { "progu": prog, "gruntem": grunt, "Powód": powod, "prawdziwa": prawdziwy, "waszej": wasz, "panując": panowac }
  - clean: "Mędrcy zgłębiając treść rzeczy aż do dna,\nPrzyznali, że jest ta wolność przyrodna,\nI jako owoc swoich myśli kwiatu,\nKsięgę morału zostawili światu.\nPrzypuśćmy, miłość, co iskrą z was błyska,\nŻe z konieczności wynika ogniska,\nLecz w was jest władza, co ją, gdzie chce, kłoni."
    verse: true
    chunks:
      - pl: "Mędrcy zgłębiając treść rzeczy aż do dna,"
        ru: "Мудрецы, постигая суть вещей до дна,"
      - pl: "\nPrzyznali, że jest ta wolność przyrodna,"
        ru: "признали, что эта свобода природна,"
      - pl: "\nI jako owoc swoich myśli kwiatu,"
        ru: "и как плод цветка своих мыслей"
      - pl: "\nKsięgę morału zostawili światu."
        ru: "оставили миру книгу о нравственности."
        note: "«Этика» Аристотеля"
      - pl: "\nPrzypuśćmy, miłość, co iskrą z was błyska,"
        ru: "Допустим, что любовь, что искрой вспыхивает в вас,"
        note: "przypuśćmy — допустим"
      - pl: "\nŻe z konieczności wynika ogniska,"
        ru: "по необходимости вытекает из очага,"
      - pl: "\nLecz w was jest władza, co ją, gdzie chce, kłoni."
        ru: "но в вас есть власть, что склоняет её, куда хочет."
    words: { "owoc": owoc, "Księgę": ksiega, "Przypuśćmy": przypuscic, "konieczności": koniecznosc, "wynika": wynikac, "ogniska": ognisko }
  - clean: "Szlachetny przymiot, który Beatryce\nZwie wolną wolą; jej ci tajemnicę\nOna rozwiąże, z tobą mówiąc o niej».\nKsiężyc jak w północ, wznosząc się powoli,\nCoraz nam rzadsze pokazywał gwiazdy,\nIdąc przez obłok to ciemny, to biały,\nJak pieczęć w ogniu czerwienił się cały."
