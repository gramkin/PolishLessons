        note: "kładka — пешеходный мостик"
      - pl: " Pod kładką jeździły tramwaje z Polakami, a nad nią przechodzili Żydzi, którym nie wolno było postawić stopy na aryjskiej ulicy."
        ru: "Под мостиком ходили трамваи с поляками, а по нему проходили евреи, которым нельзя было ступить на «арийскую» улицу."
      - pl: " Dziś w tym miejscu stoją dwa słupy połączone stalowymi linami, które wieczorem świecą, przypominając o kładce."
        ru: "Сегодня на этом месте стоят два столба, соединённые стальными тросами, которые вечером светятся, напоминая о мостике."
        note: "lina — трос"
    words: { "wolno": wolno, "podzielone": podzielic, "słupy": slup, "linami": lina }
  - clean: "Mimo głodu i strachu w getcie toczyło się życie. Działały tajne szkoły, szpitale, kuchnie dla ubogich, teatry i orkiestry. Prezesem warszawskiego Judenratu był inżynier Adam Czerniaków, który codziennie negocjował z Niemcami i zapisywał wszystko w swoim dzienniku. Historyk Emanuel Ringelblum zebrał grupę ludzi, którzy pod nazwą Oneg Szabat dokumentowali życie i śmierć getta. Gromadzili dzienniki, listy, rysunki, ogłoszenia, a nawet bilety tramwajowe i opakowania po cukierkach."
    draft: true
    chunks:
