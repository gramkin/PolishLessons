chapter: 17
chapterTitle: "Zagłada"
chapterTitleRu: "Катастрофа (Холокост)"
level: B2
paragraphs:
  - clean: "Zagłada, nazywana też Holokaustem albo po hebrajsku Szoa, była zaplanowanym wymordowaniem Żydów europejskich przez Niemcy hitlerowskie. Zginęło w niej około sześciu milionów ludzi, z których mniej więcej połowa była obywatelami Polski. Polska, gdzie Żydzi żyli od prawie tysiąca lat, stała się miejscem, w którym Niemcy zbudowali największe obozy zagłady. Wybrali ją dlatego, że mieszkało tu najwięcej Żydów w Europie, a okupowany kraj nie miał własnych władz, które mogłyby się temu sprzeciwić."
    draft: true
    chunks:
      - pl: "Zagłada, nazywana też Holokaustem albo po hebrajsku Szoa, była zaplanowanym wymordowaniem Żydów europejskich przez Niemcy hitlerowskie."
        ru: "Катастрофа, которую также называют Холокостом или, на иврите, Шоа, была спланированным истреблением европейских евреев гитлеровской Германией."
      - pl: " Zginęło w niej około sześciu milionów ludzi, z których mniej więcej połowa była obywatelami Polski."
        ru: "В ней погибли около шести миллионов человек, примерно половина из которых были гражданами Польши."
      - pl: " Polska, gdzie Żydzi żyli od prawie tysiąca lat, stała się miejscem, w którym Niemcy zbudowali największe obozy zagłady."
        ru: "Польша, где евреи жили почти тысячу лет, стала местом, где немцы построили крупнейшие лагеря смерти."
      - pl: " Wybrali ją dlatego, że mieszkało tu najwięcej Żydów w Europie, a okupowany kraj nie miał własnych władz, które mogłyby się temu sprzeciwić."
        ru: "Они выбрали её потому, что здесь жило больше всего евреев в Европе, а у оккупированной страны не было собственной власти, которая могла бы этому воспротивиться."
        note: "sprzeciwić się — воспротивиться"
    words: { "Zagłada": zaglada, "zaplanowanym": zaplanowac, "obywatelami": obywatel, "zagłady": zaglada, "sprzeciwić": sprzeciwic }
  - clean: "W pierwszej części tej książki opowiadaliśmy, jak Żydzi przybywali do Polski w średniowieczu, uciekając przed prześladowaniami na Zachodzie. Przez stulecia tworzyli tu swoją kulturę, swoje szkoły religijne i swoje miasteczka, nazywane w jidysz sztetlami. W 1939 roku w Polsce mieszkało ponad trzy miliony Żydów. Byli wśród nich pobożni chasydzi w czarnych chałatach i świeccy socjaliści, kupcy i rzemieślnicy, lekarze i adwokaci, biedacy i bogacze. Po wojnie z tego świata nie zostało prawie nic. Ten rozdział opowiada o tym, jak do tego doszło."
    draft: true
    chunks:
      - pl: "W pierwszej części tej książki opowiadaliśmy, jak Żydzi przybywali do Polski w średniowieczu, uciekając przed prześladowaniami na Zachodzie."
        ru: "В первой части этой книги мы рассказывали, как евреи приезжали в Польшу в Средние века, спасаясь от преследований на Западе."
      - pl: " Przez stulecia tworzyli tu swoją kulturę, swoje szkoły religijne i swoje miasteczka, nazywane w jidysz sztetlami."
        ru: "На протяжении столетий они создавали здесь свою культуру, свои религиозные школы и свои местечки, которые на идише называли штетлами."
        note: "sztetl — штетл, еврейское местечко"
      - pl: " W 1939 roku w Polsce mieszkało ponad trzy miliony Żydów."
        ru: "В 1939 году в Польше жили больше трёх миллионов евреев."
      - pl: " Byli wśród nich pobożni chasydzi w czarnych chałatach i świeccy socjaliści, kupcy i rzemieślnicy, lekarze i adwokaci, biedacy i bogacze."
        ru: "Среди них были набожные хасиды в чёрных лапсердаках и светские социалисты, торговцы и ремесленники, врачи и адвокаты, бедняки и богачи."
        note: "chałat — лапсердак, длинный кафтан"
      - pl: " Po wojnie z tego świata nie zostało prawie nic."
        ru: "После войны от этого мира почти ничего не осталось."
      - pl: " Ten rozdział opowiada o tym, jak do tego doszło."
        ru: "Эта глава рассказывает о том, как это произошло."
    words: { "przybywali": przybywac, "stulecia": stulecie, "kulturę": kultura, "religijne": religijny, "miasteczka": miasteczko, "kupcy": kupiec, "biedacy": biedak, "rozdział": rozdzial }
  - clean: "Prześladowania zaczęły się od pierwszych dni okupacji. Niemieccy żołnierze obcinali starym Żydom brody, bili ich na ulicach i zmuszali do upokarzających prac, a wielu rozstrzelano. Od grudnia 1939 roku wszyscy Żydzi w Generalnym Gubernatorstwie od dziesiątego roku życia musieli nosić na ramieniu białą opaskę z niebieską gwiazdą Dawida. Zabierano im sklepy, warsztaty i mieszkania, a pieniądze w bankach zablokowano. Dzieciom żydowskim nie wolno było chodzić do szkoły, a dorosłych zmuszano do pracy przymusowej."
    draft: true
    chunks:
      - pl: "Prześladowania zaczęły się od pierwszych dni okupacji."
        ru: "Преследования начались с первых дней оккупации."
      - pl: " Niemieccy żołnierze obcinali starym Żydom brody, bili ich na ulicach i zmuszali do upokarzających prac, a wielu rozstrzelano."
        ru: "Немецкие солдаты отрезали старым евреям бороды, избивали их на улицах и принуждали к унизительным работам, а многих расстреляли."
      - pl: " Od grudnia 1939 roku wszyscy Żydzi w Generalnym Gubernatorstwie od dziesiątego roku życia musieli nosić na ramieniu białą opaskę z niebieską gwiazdą Dawida."
        ru: "С декабря 1939 года все евреи в Генерал-губернаторстве начиная с десяти лет должны были носить на рукаве белую повязку с голубой звездой Давида."
        note: "opaska — повязка"
      - pl: " Zabierano im sklepy, warsztaty i mieszkania, a pieniądze w bankach zablokowano."
        ru: "У них отбирали лавки, мастерские и квартиры, а деньги в банках заблокировали."
      - pl: " Dzieciom żydowskim nie wolno było chodzić do szkoły, a dorosłych zmuszano do pracy przymusowej."
        ru: "Еврейским детям запрещалось ходить в школу, а взрослых принуждали к принудительному труду."
    words: { "Niemieccy": niemiecki, "brody": broda, "zmuszali": zmuszac, "grudnia": grudzien, "warsztaty": warsztat, "zablokowano": zablokowac, "żydowskim": zydowski, "wolno": wolno, "dorosłych": dorosly, "zmuszano": zmuszac }
  - clean: "W każdej gminie żydowskiej Niemcy utworzyli radę, nazywaną Judenratem, która miała wykonywać ich rozkazy. Członkowie rad stanęli przed tragicznym wyborem. Jedni wierzyli, że posłuszeństwo pozwoli uratować przynajmniej część ludzi, inni próbowali opóźniać wykonanie rozkazów. Nikt nie mógł wtedy przypuszczać, że Niemcy planują zabić wszystkich. Wielu Żydów pamiętało Niemców z czasów pierwszej wojny światowej jako ludzi kulturalnych i trudno im było uwierzyć w to, co się działo."
    draft: true
    chunks:
      - pl: "W każdej gminie żydowskiej Niemcy utworzyli radę, nazywaną Judenratem, która miała wykonywać ich rozkazy."
        ru: "В каждой еврейской общине немцы создали совет, называемый юденратом, который должен был исполнять их приказы."
      - pl: " Członkowie rad stanęli przed tragicznym wyborem."
        ru: "Члены советов оказались перед трагическим выбором."
      - pl: " Jedni wierzyli, że posłuszeństwo pozwoli uratować przynajmniej część ludzi, inni próbowali opóźniać wykonanie rozkazów."
        ru: "Одни верили, что послушание позволит спасти хотя бы часть людей, другие пытались затягивать исполнение приказов."
        note: "opóźniać — затягивать"
      - pl: " Nikt nie mógł wtedy przypuszczać, że Niemcy planują zabić wszystkich."
        ru: "Никто тогда не мог предположить, что немцы планируют убить всех."
      - pl: " Wielu Żydów pamiętało Niemców z czasów pierwszej wojny światowej jako ludzi kulturalnych i trudno im było uwierzyć w to, co się działo."
        ru: "Многие евреи помнили немцев времён Первой мировой войны как культурных людей, и им трудно было поверить в происходящее."
    words: { "żydowskiej": zydowski, "tragicznym": tragiczny, "przypuszczać": przypuszczac, "światowej": swiatowy, "trudno": trudno }
  - clean: "W latach 1940–1941 Niemcy zamknęli Żydów w gettach, czyli wydzielonych dzielnicach miast, otoczonych murem lub drutem kolczastym. Pierwsze duże getto powstało w Łodzi, a największe w Warszawie, gdzie w listopadzie 1940 roku zamknięto bramy. Na kilku procentach powierzchni miasta stłoczono ponad czterysta tysięcy ludzi, także Żydów przywiezionych z innych miejscowości. W jednym pokoju mieszkało często kilka rodzin. Polakom, którzy mieszkali w tej dzielnicy, kazano się wyprowadzić, a Żydom z innych części miasta przenieść się do getta, zostawiając większość majątku."
    draft: true
    chunks:
