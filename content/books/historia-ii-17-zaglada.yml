      - pl: " Gromadzili dzienniki, listy, rysunki, ogłoszenia, a nawet bilety tramwajowe i opakowania po cukierkach."
        ru: "Они собирали дневники, письма, рисунки, объявления и даже трамвайные билеты и обёртки от конфет."
