        ru: "Только в Варшавском гетто ещё до депортаций умерли от голода и болезней почти сто тысяч человек."
      - pl: " Przeżyć pomagał przemyt żywności, w którym brały udział także dzieci przeciskające się przez dziury w murze."
        ru: "Выжить помогала контрабанда продовольствия, в которой участвовали и дети, пролезавшие через дыры в стене."
