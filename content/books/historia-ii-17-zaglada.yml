  - clean: "Kiedy zaczęły się deportacje, ukryli archiwum w metalowych skrzynkach i bańkach na mleko i zakopali je w piwnicach. Po wojnie odnaleziono dwie części archiwum, a trzecia nie została odnaleziona do dziś. Dzięki temu wiemy, jak wyglądało życie w getcie, z relacji samych jego mieszkańców. Jeden z członków grupy napisał w testamencie, że chciałby, żeby świat dowiedział się o tym, co się tu działo. Ringelblum ukrywał się później po aryjskiej stronie, ale w 1944 roku Niemcy go odnaleźli i zamordowali razem z rodziną i Polakami, którzy go ukrywali. Archiwum Ringelbluma zostało wpisane na listę UNESCO Pamięć Świata."
    draft: true
    chunks:
      - pl: "Kiedy zaczęły się deportacje, ukryli archiwum w metalowych skrzynkach i bańkach na mleko i zakopali je w piwnicach."
        ru: "Когда начались депортации, они спрятали архив в металлических ящиках и бидонах для молока и закопали их в подвалах."
        note: "bańka na mleko — бидон для молока"
      - pl: " Po wojnie odnaleziono dwie części archiwum, a trzecia nie została odnaleziona do dziś."
        ru: "После войны нашли две части архива, а третья не найдена до сих пор."
      - pl: " Dzięki temu wiemy, jak wyglądało życie w getcie, z relacji samych jego mieszkańców."
        ru: "Благодаря этому мы знаем, какой была жизнь в гетто, из рассказов самих его жителей."
        note: "relacja — свидетельство, рассказ"
      - pl: " Jeden z członków grupy napisał w testamencie, że chciałby, żeby świat dowiedział się o tym, co się tu działo."
