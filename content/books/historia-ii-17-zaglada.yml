      - pl: " Prezesem warszawskiego Judenratu był inżynier Adam Czerniaków, który codziennie negocjował z Niemcami i zapisywał wszystko w swoim dzienniku."
        ru: "Председателем варшавского юденрата был инженер Адам Черняков, который ежедневно вёл переговоры с немцами и записывал всё в своём дневнике."
        note: "negocjować — вести переговоры"
      - pl: " Historyk Emanuel Ringelblum zebrał grupę ludzi, którzy pod nazwą Oneg Szabat dokumentowali życie i śmierć getta."
