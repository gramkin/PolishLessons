  - clean: "Getto warszawskie było podzielone na dwie części, małe i duże getto, które łączyła drewniana kładka nad ulicą Chłodną. Pod kładką jeździły tramwaje z Polakami, a nad nią przechodzili Żydzi, którym nie wolno było postawić stopy na aryjskiej ulicy. Dziś w tym miejscu stoją dwa słupy połączone stalowymi linami, które wieczorem świecą, przypominając o kładce."
    draft: true
    chunks:
      - pl: "Getto warszawskie było podzielone na dwie części, małe i duże getto, które łączyła drewniana kładka nad ulicą Chłodną."
