        note: "drut kolczasty — колючая проволока"
      - pl: " Pierwsze duże getto powstało w Łodzi, a największe w Warszawie, gdzie w listopadzie 1940 roku zamknięto bramy."
        ru: "Первое большое гетто возникло в Лодзи, а самое большое — в Варшаве, где в ноябре 1940 года закрыли ворота."
      - pl: " Na kilku procentach powierzchni miasta stłoczono ponad czterysta tysięcy ludzi, także Żydów przywiezionych z innych miejscowości."
        ru: "На нескольких процентах площади города согнали больше четырёхсот тысяч человек, в том числе евреев, привезённых из других мест."
        note: "stłoczyć — согнать, скучить"
      - pl: " W jednym pokoju mieszkało często kilka rodzin."
        ru: "В одной комнате часто жили несколько семей."
      - pl: " Polakom, którzy mieszkali w tej dzielnicy, kazano się wyprowadzić, a Żydom z innych części miasta przenieść się do getta, zostawiając większość majątku."
        ru: "Полякам, жившим в этом районе, велели выехать, а евреям из других частей города — переселиться в гетто, оставив большую часть имущества."
    words: { "dzielnicach": dzielnica, "otoczonych": otoczyc, "murem": mur, "drutem": drut, "powstało": powstac, "listopadzie": listopad, "bramy": brama, "procentach": procent, "powierzchni": powierzchnia, "dzielnicy": dzielnica, "wyprowadzić": wyprowadzic, "majątku": majatek }
  - clean: "Przydziały żywności dla getta były kilka razy mniejsze niż dla Polaków, a te z kolei mniejsze niż dla Niemców. Ludzie umierali z głodu na ulicach, a ciała przykrywano gazetami, zanim zabrał je wóz. W przepełnionych mieszkaniach szerzył się tyfus. W samym getcie warszawskim jeszcze przed deportacjami zmarło z głodu i chorób prawie sto tysięcy osób. Przeżyć pomagał przemyt żywności, w którym brały udział także dzieci przeciskające się przez dziury w murze. Za wyjście z getta bez pozwolenia groziła kara śmierci, zarówno dla Żydów, jak i dla Polaków, którzy by im pomagali."
    draft: true
