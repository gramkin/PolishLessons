        ru: "хотя неизбежный процесс разложения, на время приостановленный,"
      - pl: " i który wskutek wymarcia bakterii i grzybów stracił dziewięćdziesiąt dziewięć setnych swojej siły,"
        ru: "и из-за вымирания бактерий и грибов утративший девяносто девять сотых своей силы,"
      - pl: " znów, z niezwykłą pewnością, choć i z niezwykłą powolnością, pracował nad wszystkimi tymi skarbami."
        ru: "вновь, с крайней верностью, хоть и с крайней медлительностью, принялся за все эти сокровища."
