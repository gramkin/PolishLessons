      - pl: " Dla mnie, przynajmniej w moim obecnym położeniu, byłyby one o wiele ciekawsze niż ten widok rozpadającej się dawnej geologii."
        ru: "Для меня, по крайней мере в моём теперешнем положении, они были бы куда интереснее, чем это зрелище разрушающейся старинной геологии."
      - pl: " Badając, znalazłem drugą, krótką galerię, biegnącą w poprzek pierwszej."
