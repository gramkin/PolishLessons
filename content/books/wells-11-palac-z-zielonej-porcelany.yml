  - clean: "Sądząc po wielkości tego miejsca, Pałac z Zielonej Porcelany mieścił o wiele więcej niż Galerię Paleontologii; może galerie historyczne; może nawet bibliotekę! Dla mnie, przynajmniej w moim obecnym położeniu, byłyby one o wiele ciekawsze niż ten widok rozpadającej się dawnej geologii. Badając, znalazłem drugą, krótką galerię, biegnącą w poprzek pierwszej. Zdawała się poświęcona minerałom, a widok bryły siarki skierował moje myśli ku prochowi strzelniczemu. Ale nie znalazłem saletry; właściwie żadnych azotanów."
    en: "“To judge from the size of the place, this Palace of Green Porcelain had a great deal more in it than a Gallery of Palæontology; possibly historical galleries; it might be, even a library! To me, at least in my present circumstances, these would be vastly more interesting than this spectacle of old-time geology in decay. Exploring, I found another short gallery running transversely to the first. This appeared to be devoted to minerals, and the sight of a block of sulphur set my mind running on gunpowder. But I could find no saltpetre; indeed, no nitrates of any kind."
    draft: true
    chunks:
