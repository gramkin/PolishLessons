  - clean: "A gabloty w niektórych miejscach wyniesiono w całości — jak sądziłem, Morlokowie. Było tam bardzo cicho. Gruby kurz tłumił nasze kroki. Weena, która toczyła jeżowca morskiego po pochyłym szkle gabloty, wkrótce podeszła, gdy się rozglądałem, i bardzo cicho ujęła mnie za rękę i stanęła obok."
    en: "And the cases had in some instances been bodily removed—by the Morlocks, as I judged. The place was very silent. The thick dust deadened our footsteps. Weena, who had been rolling a sea urchin down the sloping glass of a case, presently came, as I stared about me, and very quietly took my hand and stood beside me."
    draft: true
    chunks:
      - pl: "A gabloty w niektórych miejscach wyniesiono w całości — jak sądziłem, Morlokowie."
