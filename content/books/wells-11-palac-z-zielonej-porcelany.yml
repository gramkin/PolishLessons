paragraphs:
  - clean: "Gdy około południa zbliżyliśmy się do Pałacu z Zielonej Porcelany, zastałem go opuszczonego i popadającego w ruinę. W oknach zostały tylko poszarpane resztki szkła, a wielkie płaty zielonej okładziny odpadły od przeżartej rdzą metalowej konstrukcji. Stał bardzo wysoko na porośniętym trawą wzgórzu, a spojrzawszy przed wejściem na północny wschód, ze zdziwieniem ujrzałem rozległe ujście rzeki, a nawet zatokę tam, gdzie, jak sądziłem, musiały kiedyś być Wandsworth i Battersea. Pomyślałem wtedy — choć nigdy nie podjąłem tej myśli — co mogło się stać, albo co się działo, z żywymi istotami w morzu."
    en: "“I found the Palace of Green Porcelain, when we approached it about noon, deserted and falling into ruin. Only ragged vestiges of glass remained in its windows, and great sheets of the green facing had fallen away from the corroded metallic framework. It lay very high upon a turfy down, and looking north-eastward before I entered it, I was surprised to see a large estuary, or even creek, where I judged Wandsworth and Battersea must once have been. I thought then—though I never followed up the thought—of what might have happened, or might be happening, to the living things in the sea."
    draft: true
    chunks:
      - pl: "Gdy około południa zbliżyliśmy się do Pałacu z Zielonej Porcelany, zastałem go opuszczonego i popadającego w ruinę."
        ru: "Когда около полудня мы подошли к Дворцу из Зелёного Фарфора, я нашёл его заброшенным и разрушающимся."
        note: "popadać w ruinę — приходить в упадок"
      - pl: " W oknach zostały tylko poszarpane resztki szkła, a wielkie płaty zielonej okładziny odpadły od przeżartej rdzą metalowej konstrukcji."
        ru: "В окнах остались лишь рваные остатки стекла, а большие пласты зелёной облицовки отвалились от изъеденного ржавчиной металлического каркаса."
        note: "płat — пласт, лоскут; okładzina — облицовка"
      - pl: " Stał bardzo wysoko na porośniętym trawą wzgórzu, a spojrzawszy przed wejściem na północny wschód,"
        ru: "Он стоял очень высоко на поросшем травой холме, и, взглянув перед входом на северо-восток,"
      - pl: " ze zdziwieniem ujrzałem rozległe ujście rzeki, a nawet zatokę tam, gdzie, jak sądziłem, musiały kiedyś być Wandsworth i Battersea."
        ru: "я с удивлением увидел обширное устье реки или даже залив там, где, по моим расчётам, когда-то должны были быть Уондсуорт и Баттерси."
        note: "ujście — устье; zatoka — залив"
      - pl: " Pomyślałem wtedy — choć nigdy nie podjąłem tej myśli — co mogło się stać, albo co się działo, z żywymi istotami w morzu."
        ru: "Я подумал тогда — хотя так и не развил эту мысль, — что могло случиться или происходило с живыми существами в море."
    words: { "resztki": resztki, "szkła": szklo, "metalowej": metalowy, "trawą": trawa, "zatokę": zatoka }
  - clean: "Materiał Pałacu okazał się po zbadaniu rzeczywiście porcelaną, a na jego fasadzie zobaczyłem napis w jakimś nieznanym piśmie. Pomyślałem, dość głupio, że Weena mogłaby mi pomóc go odczytać, ale dowiedziałem się tylko, że sama myśl o piśmie nigdy nie postała jej w głowie. Zawsze wydawała mi się, jak sądzę, bardziej ludzka, niż była, może dlatego, że jej przywiązanie było tak ludzkie."
    en: "“The material of the Palace proved on examination to be indeed porcelain, and along the face of it I saw an inscription in some unknown character. I thought, rather foolishly, that Weena might help me to interpret this, but I only learnt that the bare idea of writing had never entered her head. She always seemed to me, I fancy, more human than she was, perhaps because her affection was so human."
    draft: true
    chunks:
      - pl: "Materiał Pałacu okazał się po zbadaniu rzeczywiście porcelaną, a na jego fasadzie zobaczyłem napis w jakimś nieznanym piśmie."
        ru: "Материал Дворца при осмотре действительно оказался фарфором, а на его фасаде я увидел надпись какими-то неизвестными письменами."
        note: "pismo — письмо, письменность"
      - pl: " Pomyślałem, dość głupio, że Weena mogłaby mi pomóc go odczytać, ale dowiedziałem się tylko, że sama myśl o piśmie nigdy nie postała jej w głowie."
        ru: "Я подумал, довольно глупо, что Уина могла бы помочь мне её прочесть, но узнал лишь, что сама мысль о письменности никогда не приходила ей в голову."
        note: "nie postać w głowie — не прийти в голову"
      - pl: " Zawsze wydawała mi się, jak sądzę, bardziej ludzka, niż była, może dlatego, że jej przywiązanie było tak ludzkie."
        ru: "Она всегда казалась мне, думаю, человечнее, чем была, — может быть, потому, что её привязанность была так человечна."
    words: { "Pałacu": palac, "rzeczywiście": rzeczywiscie, "piśmie": pismo, "odczytać": odczytac }
  - clean: "Za wielkimi skrzydłami drzwi — otwartymi i rozbitymi — znaleźliśmy zamiast zwykłej sali długą galerię oświetloną wieloma bocznymi oknami. Na pierwszy rzut oka przypomniała mi muzeum. Wyłożoną płytkami podłogę pokrywała gruba warstwa kurzu, a niezwykły zbiór rozmaitych przedmiotów okrywała ta sama szara powłoka. Potem dostrzegłem, sterczącą pośrodku sali, dziwną i kościstą, najwyraźniej dolną część ogromnego szkieletu. Po ukośnych stopach poznałem, że to jakieś wymarłe stworzenie w rodzaju megaterium."
    en: "“Within the big valves of the door—which were open and broken—we found, instead of the customary hall, a long gallery lit by many side windows. At the first glance I was reminded of a museum. The tiled floor was thick with dust, and a remarkable array of miscellaneous objects was shrouded in the same grey covering. Then I perceived, standing strange and gaunt in the centre of the hall, what was clearly the lower part of a huge skeleton. I recognised by the oblique feet that it was some extinct creature after the fashion of the Megatherium."
    draft: true
    chunks:
      - pl: "Za wielkimi skrzydłami drzwi — otwartymi i rozbitymi — znaleźliśmy zamiast zwykłej sali długą galerię oświetloną wieloma bocznymi oknami."
        ru: "За большими створками двери — открытыми и разбитыми — мы нашли вместо обычного зала длинную галерею, освещённую множеством боковых окон."
        note: "skrzydło drzwi — створка"
      - pl: " Na pierwszy rzut oka przypomniała mi muzeum."
        ru: "С первого взгляда она напомнила мне музей."
        note: "na pierwszy rzut oka — с первого взгляда"
      - pl: " Wyłożoną płytkami podłogę pokrywała gruba warstwa kurzu, a niezwykły zbiór rozmaitych przedmiotów okrywała ta sama szara powłoka."
        ru: "Выложенный плиткой пол покрывал толстый слой пыли, а замечательное собрание разнообразных предметов окутывал тот же серый покров."
        note: "powłoka — покров, оболочка"
      - pl: " Potem dostrzegłem, sterczącą pośrodku sali, dziwną i kościstą, najwyraźniej dolną część ogromnego szkieletu."
        ru: "Потом я заметил странно и тощо торчавшую посреди зала нижнюю часть огромного скелета."
        note: "sterczeć — торчать; szkielet — скелет"
      - pl: " Po ukośnych stopach poznałem, że to jakieś wymarłe stworzenie w rodzaju megaterium."
        ru: "По косо поставленным ступням я узнал, что это какое-то вымершее создание вроде мегатерия."
        note: "ukośny — косой; wymarły — вымерший"
    words: { "galerię": galeria, "rzut": rzut, "warstwa": warstwa, "kurzu": kurz, "szara": szary, "dolną": dolny }
  - clean: "Czaszka i górne kości leżały obok w grubym kurzu, a w jednym miejscu, gdzie przez dziurę w dachu kapała deszczówka, sam szkielet był starty. Dalej w galerii był ogromny beczkowaty szkielet brontozaura. Moja hipoteza o muzeum się potwierdziła. Idąc w bok, znalazłem coś, co wyglądało na pochyłe półki, a zmiótłszy gruby kurz, odkryłem stare, znajome gabloty z naszych czasów. Musiały jednak być hermetyczne, sądząc po dobrym stanie niektórych eksponatów."
    en: "The skull and the upper bones lay beside it in the thick dust, and in one place, where rain-water had dropped through a leak in the roof, the thing itself had been worn away. Further in the gallery was the huge skeleton barrel of a Brontosaurus. My museum hypothesis was confirmed. Going towards the side I found what appeared to be sloping shelves, and clearing away the thick dust, I found the old familiar glass cases of our own time. But they must have been air-tight to judge from the fair preservation of some of their contents."
    draft: true
    chunks:
      - pl: "Czaszka i górne kości leżały obok w grubym kurzu, a w jednym miejscu, gdzie przez dziurę w dachu kapała deszczówka, sam szkielet był starty."
        ru: "Череп и верхние кости лежали рядом в толстой пыли, а в одном месте, где сквозь прореху в крыше капала дождевая вода, сам скелет был стёрт."
        note: "czaszka — череп; deszczówka — дождевая вода"
      - pl: " Dalej w galerii był ogromny beczkowaty szkielet brontozaura."
        ru: "Дальше в галерее был огромный бочкообразный скелет бронтозавра."
        note: "beczkowaty — бочкообразный"
      - pl: " Moja hipoteza o muzeum się potwierdziła."
        ru: "Моя гипотеза о музее подтвердилась."
      - pl: " Idąc w bok, znalazłem coś, co wyglądało na pochyłe półki, a zmiótłszy gruby kurz, odkryłem stare, znajome gabloty z naszych czasów."
        ru: "Пройдя в сторону, я нашёл что-то вроде наклонных полок, а смахнув толстую пыль, обнаружил старые знакомые витрины нашего времени."
        note: "gablota — витрина"
      - pl: " Musiały jednak być hermetyczne, sądząc po dobrym stanie niektórych eksponatów."
        ru: "Однако они, должно быть, были герметичны, судя по хорошей сохранности некоторых экспонатов."
