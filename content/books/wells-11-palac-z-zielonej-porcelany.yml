  - clean: "Najwyraźniej staliśmy wśród ruin jakiegoś późniejszego South Kensington! Tu był chyba Dział Paleontologiczny, i musiał to być bardzo wspaniały zbiór skamieniałości, choć nieuchronny proces rozkładu, który na pewien czas powstrzymano i który wskutek wymarcia bakterii i grzybów stracił dziewięćdziesiąt dziewięć setnych swojej siły, znów, z niezwykłą pewnością, choć i z niezwykłą powolnością, pracował nad wszystkimi tymi skarbami. Tu i ówdzie znajdowałem ślady małych ludzi w postaci rzadkich skamieniałości potłuczonych na kawałki albo nawleczonych na trzciny jak korale."
    en: "“Clearly we stood among the ruins of some latter-day South Kensington! Here, apparently, was the Palæontological Section, and a very splendid array of fossils it must have been, though the inevitable process of decay that had been staved off for a time, and had, through the extinction of bacteria and fungi, lost ninety-nine hundredths of its force, was nevertheless, with extreme sureness if with extreme slowness at work again upon all its treasures. Here and there I found traces of the little people in the shape of rare fossils broken to pieces or threaded in strings upon reeds."
    draft: true
    chunks:
      - pl: "Najwyraźniej staliśmy wśród ruin jakiegoś późniejszego South Kensington!"
        ru: "Очевидно, мы стояли среди руин какого-то позднейшего Южного Кенсингтона!"
        note: "South Kensington — лондонский район музеев"
      - pl: " Tu był chyba Dział Paleontologiczny, i musiał to być bardzo wspaniały zbiór skamieniałości,"
