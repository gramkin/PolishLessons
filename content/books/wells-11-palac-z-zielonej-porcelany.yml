  - clean: "Przypomniało mi to obraz w sepii, który widziałem kiedyś, namalowany atramentem kopalnego belemnita, który musiał zginąć i skamienieć przed milionami lat. Już miałem ją wyrzucić, ale przypomniałem sobie, że jest łatwopalna i pali się dobrym jasnym płomieniem — jest w istocie świetną świecą — i schowałem ją do kieszeni. Nie znalazłem jednak materiałów wybuchowych ani żadnego sposobu na wyłamanie brązowych drzwi. Jak dotąd mój żelazny łom był najużyteczniejszą rzeczą, na jaką trafiłem. Mimo to opuściłem tę galerię w doskonałym nastroju."
