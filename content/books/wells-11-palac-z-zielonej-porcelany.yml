  - clean: "Teraz bowiem miałem prawdziwą broń przeciw okropnym stworzeniom, których się baliśmy. I tak, w tym opuszczonym muzeum, na grubym miękkim dywanie z kurzu, ku ogromnej radości Weeny, uroczyście wykonałem coś w rodzaju tańca mieszanego, gwiżdżąc „The Land of the Leal” tak wesoło, jak tylko umiałem. Po części był to skromny kankan, po części stepowanie, po części taniec z suknią (o ile pozwalał na to mój frak), a po części oryginalny. Jestem bowiem z natury pomysłowy, jak wiecie."
