  - clean: "Gdy zbliżał się wieczór, moje zainteresowanie słabło. Przechodziłem galerię za galerią, zakurzone, ciche, często zrujnowane; eksponaty bywały tylko kupami rdzy i węgla brunatnego, czasem lepiej zachowane. W jednym miejscu nagle znalazłem się koło modelu kopalni cyny, a potem przez czysty przypadek odkryłem w hermetycznej gablocie dwie laski dynamitu! Krzyknąłem „Eureka!” i z radości rozbiłem gablotę. Potem przyszła wątpliwość. Zawahałem się. Potem, wybrawszy małą boczną galerię, przeprowadziłem próbę."
