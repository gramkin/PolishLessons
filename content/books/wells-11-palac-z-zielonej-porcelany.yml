  - clean: "Z początku byłem tak zaskoczony tym starożytnym pomnikiem epoki rozumu, że nie myślałem o możliwościach, jakie mi dawał. Nawet troska o Wehikuł Czasu zeszła trochę na dalszy plan."
    en: "“And at first I was so much surprised by this ancient monument of an intellectual age that I gave no thought to the possibilities it presented. Even my preoccupation about the Time Machine receded a little from my mind."
