  - clean: "Potem, wszedłszy po szerokich schodach, doszliśmy do czegoś, co mogło kiedyś być galerią chemii technicznej. I tu miałem niemałą nadzieję na pożyteczne odkrycia. Poza jednym końcem, gdzie zawalił się dach, galeria była dobrze zachowana. Gorliwie podchodziłem do każdej nierozbitej gabloty. I w końcu, w jednej z naprawdę hermetycznych gablot, znalazłem pudełko zapałek. Bardzo gorączkowo je wypróbowałem. Były zupełnie dobre. Nie były nawet wilgotne. Odwróciłem się do Weeny. „Tańcz!” — zawołałem do niej w jej własnym języku."
