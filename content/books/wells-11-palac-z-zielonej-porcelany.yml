  - clean: "Bez wątpienia rozpłynęły się przed wiekami. A jednak siarka utkwiła mi w głowie i uruchomiła ciąg myśli. Co do reszty zawartości tej galerii, choć ogólnie była najlepiej zachowana ze wszystkiego, co widziałem, niewiele mnie interesowała. Nie jestem specjalistą od mineralogii, i poszedłem dalej bardzo zrujnowaną nawą, biegnącą równolegle do pierwszej sali, do której wszedłem. Najwyraźniej ten dział był poświęcony historii naturalnej, ale wszystko dawno stało się nie do rozpoznania. Kilka zeschniętych i sczerniałych szczątków tego, co kiedyś było wypchanymi zwierzętami, wyschnięte mumie w słojach, w których kiedyś był spirytus, brązowy pył dawnych roślin: oto wszystko!"
    en: "Doubtless they had deliquesced ages ago. Yet the sulphur hung in my mind, and set up a train of thinking. As for the rest of the contents of that gallery, though on the whole they were the best preserved of all I saw, I had little interest. I am no specialist in mineralogy, and I went on down a very ruinous aisle running parallel to the first hall I had entered. Apparently this section had been devoted to natural history, but everything had long since passed out of recognition. A few shrivelled and blackened vestiges of what had once been stuffed animals, desiccated mummies in jars that had once held spirit, a brown dust of departed plants: that was all!"
    draft: true
    chunks:
