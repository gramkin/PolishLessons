      - pl: "\nTwarz przewoźnika wnet się wypogadza,"
        ru: "лицо перевозчика тотчас проясняется,"
        note: "przewoźnik — перевозчик; wnet — тотчас; wypogadzać się — проясняться"
      - pl: "\nTylko oczyma wybuch gniewu zdradza,"
        ru: "только глазами вспышку гнева выдаёт,"
        note: "wybuch — вспышка; zdradzać — выдавать"
      - pl: "\nKtóre płomienną obrączką obwodzi."
        ru: "которые огненное кольцо обводит."
        note: "obrączka — кольцо, ободок"
    words: { "Przewodnik": przewodnik, "Gęsto": gesto, "włosem": wlos, "wybuch": wybuch, "zdradza": zdradzac, "obrączką": obraczka }
  - clean: "Lecz duchy nagie, stojące na stronie,\nTak okropnymi wylękłe słowami,\nZbladły i dziko zgrzytały zębami;\nBluźniły Bogu i klęły poczęty\nSwój żywot, miejsce i czas urodzenia,\nKlęły nasienie swojego nasienia;\nPotem szlochając, szły na brzeg przeklęty,\nKtóry każdego w progu swej ostoi\nCzeka, kto tylko Boga się nie boi!"
