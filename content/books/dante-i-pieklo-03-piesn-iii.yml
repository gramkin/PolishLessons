# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 3
chapterTitle: "Pieśń III"
chapterTitleRu: "Песнь III. Врата ада"
level: B2
paragraphs:
  - clean: "(Brama piekielna. Przedpiekle. Tchórze. Celestyn V. Charon.)"
    chunks:
      - pl: "(Brama piekielna. Przedpiekle. Tchórze. Celestyn V. Charon.)"
        ru: "(Врата ада. Преддверие ада. Трусы. Целестин V. Харон.)"
        note: "przedpiekle — преддверие ада; tchórz — трус"
    words: { "Brama": brama, "piekielna": piekielny, "Tchórze": tchorz }
  - clean: "«Przeze mnie droga w gród łez niezliczonych.\nPrzeze mnie droga w boleść wiekuistą,\nPrzeze mnie droga w naród zatraconych.\nMój budowniczy był wzniosłym artystą,\nSprawiedliwości dna grunt mój dosięga.\nMnie zbudowała wszechmocna potęga,\nMądrość najwyższa, miłość samodzielna."
    verse: true
    chunks:
      - pl: "«Przeze mnie droga w gród łez niezliczonych."
        ru: "«Через меня путь в град бесчисленных слёз."
        note: "przeze mnie — через меня; gród — град"
      - pl: "\nPrzeze mnie droga w boleść wiekuistą,"
        ru: "Через меня путь в вечную скорбь,"
        note: "boleść — книжн. «скорбь, боль»; wiekuisty — вечный"
      - pl: "\nPrzeze mnie droga w naród zatraconych."
        ru: "через меня путь к погибшему народу."
        note: "zatracony — погибший, пропащий"
      - pl: "\nMój budowniczy był wzniosłym artystą,"
        ru: "Мой строитель был возвышенным художником,"
        note: "budowniczy — строитель; wzniosły — возвышенный"
      - pl: "\nSprawiedliwości dna grunt mój dosięga."
        ru: "моё основание достигает дна правосудия."
        note: "grunt — основание, почва; dosięgać — достигать"
      - pl: "\nMnie zbudowała wszechmocna potęga,"
        ru: "Меня создала всемогущая сила,"
        note: "wszechmocny — всемогущий; potęga — мощь"
      - pl: "\nMądrość najwyższa, miłość samodzielna."
        ru: "высшая мудрость, первая любовь."
        note: "samodzielny — самостоятельный; у Данте primo amore"
    words: { "naród": narod, "artystą": artysta, "Sprawiedliwości": sprawiedliwosc, "grunt": grunt, "potęga": potega, "Mądrość": madrosc }
  - clean: "Przede mną rzeczy nie było stworzonych\nPrócz nieśmiertelnych — i jam nieśmiertelna!\nWchodzący we mnie, zostawcie nadzieję!»\nW tych słowach napis na bramie czernieje.\n«Dla mnie, o mistrzu, straszna treść jej godła».\nMistrz mówił, jakby świadomy tej strony:\n«Tutaj lękliwość wszelka, słabość podła,\nNiech zamrą w tobie, tu zbyć je przystoi."
    verse: true
    chunks:
      - pl: "Przede mną rzeczy nie było stworzonych"
        ru: "До меня не было сотворённых вещей,"
      - pl: "\nPrócz nieśmiertelnych — i jam nieśmiertelna!"
        ru: "кроме вечных, — и я вечна!"
        note: "prócz — кроме; jam = ja + -m (ja jestem)"
      - pl: "\nWchodzący we mnie, zostawcie nadzieję!»"
        ru: "Входящие в меня, оставьте надежду!»"
        note: "wchodzący — входящие (причастие как обращение)"
      - pl: "\nW tych słowach napis na bramie czernieje."
        ru: "Такими словами чернеет надпись на вратах."
        note: "czernieć — чернеть; napis — надпись"
      - pl: "\n«Dla mnie, o mistrzu, straszna treść jej godła»."
        ru: "«Для меня, о учитель, страшен смысл её знака»."
        note: "treść — содержание, смысл; godło — эмблема, знак"
      - pl: "\nMistrz mówił, jakby świadomy tej strony:"
        ru: "Учитель сказал, словно сознавая эту сторону:"
        note: "świadomy czegoś — сознающий что-л."
      - pl: "\n«Tutaj lękliwość wszelka, słabość podła,"
        ru: "«Здесь всякая боязливость, подлая слабость"
        note: "lękliwość — боязливость"
      - pl: "\nNiech zamrą w tobie, tu zbyć je przystoi."
        ru: "пусть умрут в тебе, здесь подобает их избыть."
        note: "zamrzeć — замереть, умереть; zbyć — избавиться; przystoi — подобает"
    words: { "napis": napis, "mistrzu": mistrz, "świadomy": swiadomy, "wszelka": wszelki, "słabość": slabosc, "podła": podly }
  - clean: "Przyszliśmy w miejsce, gdzie oglądać mamy\nLud nędzny, światła prawdy pozbawiony».\nRzekł i z wesołą twarzą w dłoni mojej\nDłoń swoją złożył, czym ja pocieszony,\nWstąpiłem w progi tajemniczej bramy.\nStamtąd wzdychania, żale i okrzyki\nBrzmiały pod niebem bez gwiazd osamiałem;\nSłysząc jęk ludzki, zrazu zapłakałem."
    verse: true
    chunks:
      - pl: "Przyszliśmy w miejsce, gdzie oglądać mamy"
        ru: "Мы пришли в место, где нам предстоит увидеть"
        note: "mamy oglądać — «нам предстоит видеть»"
      - pl: "\nLud nędzny, światła prawdy pozbawiony»."
        ru: "жалкий народ, лишённый света истины»."
        note: "nędzny — жалкий; pozbawiony czegoś — лишённый (род. п.)"
      - pl: "\nRzekł i z wesołą twarzą w dłoni mojej"
        ru: "Сказал и с весёлым лицом в мою руку"
        note: "dłoń — ладонь, рука"
      - pl: "\nDłoń swoją złożył, czym ja pocieszony,"
        ru: "вложил свою руку, отчего я, утешенный,"
        note: "złożyć — положить, вложить; pocieszony — утешенный"
      - pl: "\nWstąpiłem w progi tajemniczej bramy."
        ru: "вступил в порог таинственных врат."
        note: "progi — мн. ч. «порог», книжн. «обитель»"
      - pl: "\nStamtąd wzdychania, żale i okrzyki"
        ru: "Оттуда вздохи, жалобы и крики"
        note: "wzdychanie — вздыхание; żal — жалоба, сожаление"
      - pl: "\nBrzmiały pod niebem bez gwiazd osamiałem;"
        ru: "звучали под небом без звёзд, осиротелым;"
        note: "osamiały — устар. «осиротелый, одинокий»"
      - pl: "\nSłysząc jęk ludzki, zrazu zapłakałem."
        ru: "слыша стон людской, я сперва заплакал."
        note: "zrazu — устар. «сначала»; jęk — стон"
    words: { "nędzny": nedzny, "pozbawiony": pozbawic, "Rzekł": rzec, "pocieszony": pocieszyc, "Wstąpiłem": wstapic, "progi": prog }
  - clean: "Okropne mowy, zmieszane języki\nBólu i gniewu, klask dłoń w dłonie dziki,\nGłosy na przemian ostre, to chrypiące\nTworzyły hałas starciem się wzajemnym,\nKtóry złamany na wrzasków tysiące\nWił się w powietrzu nieśmiertelnie ciemnym,\nJak tuman piasku, gdy nim wicher dysze."
    verse: true
    chunks:
      - pl: "Okropne mowy, zmieszane języki"
        ru: "Страшные речи, смешанные языки,"
      - pl: "\nBólu i gniewu, klask dłoń w dłonie dziki,"
        ru: "боли и гнева, дикий плеск ладони о ладонь,"
        note: "klask — хлопок; dłoń w dłonie — ладонь о ладони"
      - pl: "\nGłosy na przemian ostre, to chrypiące"
        ru: "голоса то резкие, то хриплые"
        note: "na przemian — попеременно; chrypiący — хрипящий"
      - pl: "\nTworzyły hałas starciem się wzajemnym,"
        ru: "создавали шум своим взаимным столкновением,"
        note: "starcie — столкновение"
      - pl: "\nKtóry złamany na wrzasków tysiące"
        ru: "который, раздробленный на тысячи воплей,"
        note: "wrzask — вопль"
      - pl: "\nWił się w powietrzu nieśmiertelnie ciemnym,"
        ru: "вился в воздухе, вечно тёмном,"
        note: "wić się — виться"
      - pl: "\nJak tuman piasku, gdy nim wicher dysze."
        ru: "как туча песка, когда на неё дышит вихрь."
        note: "tuman — туча (пыли); wicher — вихрь; dyszeć — дышать"
    words: { "zmieszane": zmieszac, "gniewu": gniew, "Tworzyły": tworzyc, "hałas": halas, "ciemnym": ciemny, "piasku": piasek }
  - clean: "Ja, mając zgrozą opasaną głowę,\nMówiłem: «Mistrzu, ach, co ja tu słyszę?\nCo za lud cierpi męki tak surowe?»\nA Mistrz: «Los nędzny widzisz tych, co cały\nŻywot przeżyli bez hańby i chwały.\nNi źli, ni dobrzy, zmieszani wespoły,\nZ obojętnymi wśród buntu anioły,\nGdy Bóg zuchwałych strącił w przepaść zguby;\nNi wierni, zdrajcy, tylko samoluby."
    verse: true
    chunks:
      - pl: "Ja, mając zgrozą opasaną głowę,"
        ru: "Я же, с головой, опоясанной ужасом,"
        note: "opasany — опоясанный"
      - pl: "\nMówiłem: «Mistrzu, ach, co ja tu słyszę?"
        ru: "говорил: «Учитель, ах, что я здесь слышу?"
      - pl: "\nCo za lud cierpi męki tak surowe?»"
        ru: "Что за народ терпит муки столь суровые?»"
      - pl: "\nA Mistrz: «Los nędzny widzisz tych, co cały"
        ru: "А Учитель: «Жалкий удел видишь ты тех, кто всю"
        note: "los — удел, судьба"
      - pl: "\nŻywot przeżyli bez hańby i chwały."
        ru: "жизнь прожил без позора и славы."
        note: "żywot — книжн. «жизнь»; hańba — позор"
      - pl: "\nNi źli, ni dobrzy, zmieszani wespoły,"
        ru: "Ни злые, ни добрые, смешанные вместе"
        note: "wespoły — устар. «вместе»"
      - pl: "\nZ obojętnymi wśród buntu anioły,"
        ru: "с ангелами, безучастными во время мятежа,"
        note: "obojętny — безразличный; bunt — мятеж; anioły — старое твор. мн. «ангелами»"
      - pl: "\nGdy Bóg zuchwałych strącił w przepaść zguby;"
        ru: "когда Бог низверг дерзких в бездну гибели;"
        note: "zuchwały — дерзкий; przepaść — пропасть; zguba — гибель"
      - pl: "\nNi wierni, zdrajcy, tylko samoluby."
        ru: "ни верные, ни предатели, только себялюбцы."
        note: "zdrajca — предатель; samolub — себялюбец"
    words: { "surowe": surowy, "hańby": hanba, "obojętnymi": obojetny, "buntu": bunt, "zguby": zguba, "wierni": wierny }
  - clean: "Żeby mniej pięknym nie być, tych nędzników\nJako zakały niebo się wyrzekło;\nIch i głębokie nie przyjmuje piekło,\nBy przez nich dumy nie podnieść grzeszników».\nA ja: «Mój mistrzu, powiedz, niech się dowiem,\nJakiej boleści robak ich tak wierci?»"
    verse: true
    chunks:
      - pl: "Żeby mniej pięknym nie być, tych nędzników"
        ru: "Чтобы не стать менее прекрасным, этих ничтожеств"
        note: "nędznik — ничтожество, негодяй"
      - pl: "\nJako zakały niebo się wyrzekło;"
        ru: "как позора небо отреклось;"
        note: "zakała — позор, паршивая овца; wyrzec się — отречься"
      - pl: "\nIch i głębokie nie przyjmuje piekło,"
        ru: "и глубокий ад не принимает их,"
      - pl: "\nBy przez nich dumy nie podnieść grzeszników»."
        ru: "чтобы грешники не возгордились из-за них»."
        note: "podnieść dumy — возгордиться"
      - pl: "\nA ja: «Mój mistrzu, powiedz, niech się dowiem,"
        ru: "А я: «Мой учитель, скажи, дай мне узнать,"
        note: "niech się dowiem — пусть я узнаю"
      - pl: "\nJakiej boleści robak ich tak wierci?»"
        ru: "какой боли червь так их точит?»"
        note: "robak — червь; wiercić — сверлить, точить"
    words: { "niebo": niebo, "przyjmuje": przyjmowac, "dumy": duma, "podnieść": podniesc, "dowiem": dowiedziec, "robak": robak }
  - clean: "Mistrz mówił: «Krótko na to ci odpowiem:\nDla nich nadziei nie ma drugiej śmierci,\nŻycie ich ślepe z treści jest tak gminnej,\nŻe tu zazdroszczą każdej doli innej.\nŚwiat ich zapomniał, gdy zeszli ze świata,\nPrawo i łaska takimi pomiata;\nSłów o nich szkoda, idź, patrz mimochodem»."
    verse: true
    chunks:
      - pl: "Mistrz mówił: «Krótko na to ci odpowiem:"
        ru: "Учитель сказал: «Коротко тебе на это отвечу:"
      - pl: "\nDla nich nadziei nie ma drugiej śmierci,"
        ru: "для них нет надежды на вторую смерть,"
        note: "druga śmierć — окончательное уничтожение"
      - pl: "\nŻycie ich ślepe z treści jest tak gminnej,"
        ru: "жизнь их слепая столь низкого содержания,"
        note: "gminny — устар. «простонародный, низкий»"
      - pl: "\nŻe tu zazdroszczą każdej doli innej."
        ru: "что здесь они завидуют любой иной доле."
        note: "zazdrościć czegoś — завидовать чему-л. (род. п.)"
      - pl: "\nŚwiat ich zapomniał, gdy zeszli ze świata,"
        ru: "Мир их забыл, когда они ушли из мира,"
      - pl: "\nPrawo i łaska takimi pomiata;"
        ru: "правосудие и милость таких презирают;"
        note: "pomiatać kimś — помыкать, презирать"
      - pl: "\nSłów o nich szkoda, idź, patrz mimochodem»."
        ru: "жаль о них слов, иди, гляди мимоходом»."
        note: "szkoda czegoś — жаль чего-л."
    words: { "odpowiem": odpowiedziec, "nadziei": nadzieja, "śmierci": smierc, "zazdroszczą": zazdroscic, "zapomniał": zapomniec, "szkoda": szkoda }
  - clean: "Patrzę: chorągiew wciąż kręci się młynkiem,\nSnadź, że niegodna odetchnąć spoczynkiem;\nLud za nią długim ciągnie korowodem,\nIżby śmierć mogła, nigdy bym nie sądził,\nZebrać zarazem tylu nieboszczyków:\nPoznałem wielu i ów cień, co zbłądził\nWielkim ustępstwem. Pojąłem w tej chwili\nObrzydłych niebu i piekłu grzeszników."
    verse: true
    chunks:
      - pl: "Patrzę: chorągiew wciąż kręci się młynkiem,"
        ru: "Смотрю: знамя всё кружится вертушкой,"
        note: "chorągiew — знамя; kręcić się młynkiem — вертеться волчком"
      - pl: "\nSnadź, że niegodna odetchnąć spoczynkiem;"
        ru: "видно, недостойное перевести дух в покое;"
        note: "snadź — устар. «видно, очевидно»; odetchnąć — перевести дух"
      - pl: "\nLud za nią długim ciągnie korowodem,"
        ru: "народ за ним тянется долгой вереницей,"
        note: "korowód — шествие, вереница"
      - pl: "\nIżby śmierć mogła, nigdy bym nie sądził,"
        ru: "так что смерть могла — никогда б я не подумал —"
        note: "iżby — устар. «так что, чтобы»"
      - pl: "\nZebrać zarazem tylu nieboszczyków:"
        ru: "собрать разом столько покойников:"
        note: "nieboszczyk — покойник"
      - pl: "\nPoznałem wielu i ów cień, co zbłądził"
        ru: "я узнал многих и ту тень, что погрешила"
        note: "ów — тот (книжн.)"
      - pl: "\nWielkim ustępstwem. Pojąłem w tej chwili"
        ru: "великим отречением. Я понял в этот миг,"
        note: "ustępstwo — уступка; здесь — отречение Целестина V от папского престола"
      - pl: "\nObrzydłych niebu i piekłu grzeszników."
        ru: "[что это] грешники, мерзкие и небу, и аду."
        note: "obrzydły — омерзительный; дат. п. niebu i piekłu"
    words: { "kręci": krecic, "ciągnie": ciagnac, "Zebrać": zebrac, "cień": cien, "Pojąłem": pojac, "piekłu": pieklo }
  - clean: "Ci nieszczęśliwi, co żyjąc, nie żyli,\nSzli nadzy, szpetnie obnażone ciało\nBez przerwy mnóstwo much i os kąsało.\nKrew z ich policzków tryskała kroplami;\nKrew spadającą, zmieszaną ze łzami,\nU stóp ich głodne robactwo chwytało."
    verse: true
    chunks:
      - pl: "Ci nieszczęśliwi, co żyjąc, nie żyli,"
        ru: "Эти несчастные, что, живя, не жили,"
      - pl: "\nSzli nadzy, szpetnie obnażone ciało"
        ru: "шли нагие, безобразно обнажённое тело"
        note: "szpetnie — безобразно; obnażony — обнажённый"
      - pl: "\nBez przerwy mnóstwo much i os kąsało."
        ru: "без перерыва кусало множество мух и ос."
        note: "mnóstwo — множество; kąsać — кусать"
      - pl: "\nKrew z ich policzków tryskała kroplami;"
        ru: "Кровь с их щёк брызгала каплями;"
        note: "policzek — щека; tryskać — брызгать"
      - pl: "\nKrew spadającą, zmieszaną ze łzami,"
        ru: "кровь, стекающую, смешанную со слезами,"
      - pl: "\nU stóp ich głodne robactwo chwytało."
        ru: "у их ног хватали голодные черви."
        note: "robactwo — черви, гады (собир.)"
    words: { "nieszczęśliwi": nieszczesliwy, "nadzy": nagi, "przerwy": przerwa, "much": mucha, "policzków": policzek, "łzami": lza }
  - clean: "Patrzałem dalej: przybyły lud świeży,\nNad wielką rzeką snuł się wzdłuż wybrzeży.\nWięc rzekłem: «Mistrzu, zapytać cię muszę,\nRacz mnie oświecić, jakie to są dusze?\nI jakie prawo, ile dojrzeć mogę,\nNagli je w dalszą przez tę rzekę drogę?"
    verse: true
    chunks:
      - pl: "Patrzałem dalej: przybyły lud świeży,"
        ru: "Я смотрел дальше: прибывший свежий народ"
        note: "patrzałem — старая форма от patrzeć: «смотрел»"
      - pl: "\nNad wielką rzeką snuł się wzdłuż wybrzeży."
        ru: "над великой рекой тянулся вдоль берегов."
        note: "snuć się — тянуться, бродить"
      - pl: "\nWięc rzekłem: «Mistrzu, zapytać cię muszę,"
        ru: "И я сказал: «Учитель, я должен спросить тебя,"
      - pl: "\nRacz mnie oświecić, jakie to są dusze?"
        ru: "изволь меня просветить, что это за души?"
        note: "racz — повел. от raczyć: «изволь»; oświecić — просветить"
      - pl: "\nI jakie prawo, ile dojrzeć mogę,"
        ru: "И какой закон, насколько я могу видеть,"
        note: "ile — насколько; dojrzeć — разглядеть"
      - pl: "\nNagli je w dalszą przez tę rzekę drogę?"
