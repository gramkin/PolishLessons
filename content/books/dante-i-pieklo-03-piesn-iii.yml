        note: "niewczesny — несвоевременный; przygana — упрёк"
      - pl: "\nSzedłem, spuściwszy oczy zasromane,"
        ru: "я шёл, опустив пристыженные глаза,"
        note: "spuściwszy — «опустив»; zasromany — устар. «пристыженный»"
      - pl: "\nZ silną milczenia wolą aż do brzegu."
        ru: "с твёрдым намерением молчать, до самого берега."
