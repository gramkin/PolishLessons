  - clean: "A ty, żyjący, co tu zrobisz z nimi?\nTobie nie płynąć między umarłymi».\nWidząc, że stoję, rzekł słowy groźnymi:\n«W innej przystani idź szukać przewozu,\nDo której wcale nie dojdziesz tą drogą.\nAby cię przewieźć, trzeba lżejszej łodzi»."
    verse: true
    chunks:
      - pl: "A ty, żyjący, co tu zrobisz z nimi?"
        ru: "А ты, живой, что ты здесь делаешь с ними?"
        note: "żyjący — живущий, живой"
      - pl: "\nTobie nie płynąć między umarłymi»."
        ru: "Не тебе плыть среди мёртвых»."
        note: "tobie nie płynąć — «не тебе плыть» (инфинитив с дат. п.)"
      - pl: "\nWidząc, że stoję, rzekł słowy groźnymi:"
        ru: "Видя, что я стою, сказал грозными словами:"
        note: "słowy — старое твор. мн. «словами»"
      - pl: "\n«W innej przystani idź szukać przewozu,"
        ru: "«В другой пристани ищи переправы,"
        note: "przystań — пристань; przewóz — переправа"
      - pl: "\nDo której wcale nie dojdziesz tą drogą."
        ru: "к которой ты вовсе не дойдёшь этой дорогой."
      - pl: "\nAby cię przewieźć, trzeba lżejszej łodzi»."
        ru: "Чтобы тебя перевезти, нужна более лёгкая лодка»."
        note: "lżejszy — сравн. от lekki"
    words: { "płynąć": plynac, "groźnymi": grozny, "wcale": wcale, "dojdziesz": dojsc, "lżejszej": lekki, "łodzi": lodz }
  - clean: "Przewodnik mój rzekł: «Hamuj gniew, Charonie,\nBo tam chcą tego, gdzie, czego chcą, mogą;\nNie pytaj więcej». Na te krótkie słowa,\nGęsto zarosła włosem i surowa\nTwarz przewoźnika wnet się wypogadza,\nTylko oczyma wybuch gniewu zdradza,\nKtóre płomienną obrączką obwodzi."
    verse: true
    chunks:
      - pl: "Przewodnik mój rzekł: «Hamuj gniew, Charonie,"
        ru: "Мой проводник сказал: «Сдержи гнев, Харон,"
        note: "hamować — сдерживать, тормозить"
      - pl: "\nBo tam chcą tego, gdzie, czego chcą, mogą;"
        ru: "ибо так хотят там, где могут, чего хотят;"
        note: "то есть на небе, где воля равна власти"
      - pl: "\nNie pytaj więcej». Na te krótkie słowa,"
        ru: "не спрашивай больше». При этих коротких словах"
      - pl: "\nGęsto zarosła włosem i surowa"
        ru: "густо заросшее волосом и суровое"
