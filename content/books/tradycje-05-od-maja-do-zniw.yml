  - clean: "Każdy z tych dni ma jednak swoją historię. Pierwszy maja to Święto Pracy, obchodzone w wielu krajach świata. W czasach Polski Ludowej był jednym z najważniejszych świąt państwowych, z wielkimi pochodami, na które zakłady pracy i szkoły musiały wysyłać swoich ludzi z transparentami i czerwonymi flagami. Dziś dla większości ludzi to po prostu dzień wolny, choć związki zawodowe i partie lewicowe wciąż organizują tego dnia manifestacje. Drugi maja to Dzień Flagi, ustanowiony w 2004 roku, kiedy na balkonach i domach wiesza się biało-czerwone flagi, a także Dzień Polonii i Polaków za Granicą."
    draft: true
    chunks:
      - pl: "Każdy z tych dni ma jednak swoją historię."
        ru: "Однако у каждого из этих дней своя история."
      - pl: " Pierwszy maja to Święto Pracy, obchodzone w wielu krajach świata."
        ru: "Первое мая — Праздник труда, который отмечают во многих странах мира."
      - pl: " W czasach Polski Ludowej był jednym z najważniejszych świąt państwowych, z wielkimi pochodami, na które zakłady pracy i szkoły musiały wysyłać swoich ludzi z transparentami i czerwonymi flagami."
        ru: "Во времена Народной Польши он был одним из важнейших государственных праздников, с большими демонстрациями, на которые предприятия и школы должны были отправлять своих людей с транспарантами и красными флагами."
        note: "pochód — шествие, демонстрация"
      - pl: " Dziś dla większości ludzi to po prostu dzień wolny, choć związki zawodowe i partie lewicowe wciąż organizują tego dnia manifestacje."
        ru: "Сегодня для большинства людей это просто выходной, хотя профсоюзы и левые партии по-прежнему устраивают в этот день манифестации."
        note: "związek zawodowy — профсоюз"
      - pl: " Drugi maja to Dzień Flagi, ustanowiony w 2004 roku, kiedy na balkonach i domach wiesza się biało-czerwone flagi, a także Dzień Polonii i Polaków za Granicą."
        ru: "Второе мая — День флага, учреждённый в 2004 году, когда на балконах и домах вывешивают бело-красные флаги, а также День Полонии и поляков за рубежом."
    words: { "obchodzone": obchodzic, "krajach": kraj, "świąt": swieto, "zakłady": zaklad, "wysyłać": wysylac, "czerwonymi": czerwony, "flagami": flaga, "większości": wiekszosc, "związki": zwiazek, "zawodowe": zawodowy, "partie": partia, "organizują": organizowac, "czerwone": czerwony, "flagi": flaga, "także": takze }
  - clean: "Trzeci maja jest świętem narodowym, upamiętniającym Konstytucję uchwaloną w 1791 roku, jedną z pierwszych nowoczesnych konstytucji na świecie. Zaborcy zakazywali świętowania tej rocznicy, a po drugiej wojnie światowej władze komunistyczne najpierw ją ograniczyły, a potem całkiem zniosły, bo przypominała o tradycjach, które chciały wymazać. Mimo to ludzie w niektórych miastach co roku wychodzili tego dnia na ulice, co nieraz kończyło się starciami z milicją. Od 1990 roku trzeci maja znów jest dniem wolnym, z uroczystościami państwowymi, defiladami i mszami za ojczyznę."
    draft: true
    chunks:
      - pl: "Trzeci maja jest świętem narodowym, upamiętniającym Konstytucję uchwaloną w 1791 roku, jedną z pierwszych nowoczesnych konstytucji na świecie."
        ru: "Третье мая — национальный праздник в память о Конституции, принятой в 1791 году, одной из первых современных конституций в мире."
        note: "uchwalić — принять (закон)"
      - pl: " Zaborcy zakazywali świętowania tej rocznicy, a po drugiej wojnie światowej władze komunistyczne najpierw ją ograniczyły, a potem całkiem zniosły, bo przypominała o tradycjach, które chciały wymazać."
        ru: "Захватчики запрещали отмечать эту годовщину, а после Второй мировой войны коммунистические власти сначала её ограничили, а затем вовсе упразднили, потому что она напоминала о традициях, которые они хотели стереть."
        note: "znieść — упразднить; wymazać — стереть"
      - pl: " Mimo to ludzie w niektórych miastach co roku wychodzili tego dnia na ulice, co nieraz kończyło się starciami z milicją."
        ru: "Несмотря на это, в некоторых городах люди каждый год выходили в этот день на улицы, что не раз заканчивалось столкновениями с милицией."
        note: "starcie — столкновение"
      - pl: " Od 1990 roku trzeci maja znów jest dniem wolnym, z uroczystościami państwowymi, defiladami i mszami za ojczyznę."
        ru: "С 1990 года третье мая снова выходной, с государственными торжествами, парадами и мессами за родину."
    words: { "świętem": swieto, "nowoczesnych": nowoczesny, "rocznicy": rocznica, "wojnie": wojna, "światowej": swiatowy, "władze": wladza, "najpierw": najpierw, "ograniczyły": ograniczyc, "całkiem": calkiem, "zniosły": zniesc, "przypominała": przypominac, "tradycjach": tradycja, "niektórych": niektory, "ulice": ulica, "kończyło": konczyc, "trzeci": trzeci, "znów": znow, "uroczystościami": uroczystosc, "ojczyznę": ojczyzna }
  - clean: "Maj jest w Kościele katolickim miesiącem Maryi. Codziennie wieczorem w kościołach, ale także przy kapliczkach i krzyżach przydrożnych, odprawia się nabożeństwa majowe, które ludzie także nazywają majówkami. Sąsiedzi zbierają się przy kapliczce ozdobionej kwiatami i wstążkami i śpiewają litanię do Matki Bożej oraz pieśni maryjne, z których najbardziej znana zaczyna się od słów: Chwalcie łąki umajone. Kapliczek jest w Polsce dziesiątki tysięcy i dla wielu wsi i osiedli to one, a nie kościół, są miejscem, gdzie zbiera się wspólnota. Na majówki przychodzą głównie starsze kobiety i dzieci, ale w ciepłe wieczory zdarza się, że śpiewa cała ulica."
    draft: true
    chunks:
      - pl: "Maj jest w Kościele katolickim miesiącem Maryi."
        ru: "Май в католической церкви — месяц Девы Марии."
      - pl: " Codziennie wieczorem w kościołach, ale także przy kapliczkach i krzyżach przydrożnych, odprawia się nabożeństwa majowe, które ludzie także nazywają majówkami."
        ru: "Каждый вечер в костёлах, а также у часовенок и придорожных крестов, проходят майские богослужения, которые люди тоже называют «майувками»."
      - pl: " Sąsiedzi zbierają się przy kapliczce ozdobionej kwiatami i wstążkami i śpiewają litanię do Matki Bożej oraz pieśni maryjne, z których najbardziej znana zaczyna się od słów: Chwalcie łąki umajone."
        ru: "Соседи собираются у часовенки, украшенной цветами и лентами, и поют литанию Богоматери и песнопения Деве Марии, самое известное из которых начинается словами: «Хвалите, луга, убранные майской зеленью»."
        note: "umajony — убранный зеленью"
      - pl: " Kapliczek jest w Polsce dziesiątki tysięcy i dla wielu wsi i osiedli to one, a nie kościół, są miejscem, gdzie zbiera się wspólnota."
        ru: "Часовенок в Польше десятки тысяч, и для многих деревень и микрорайонов именно они, а не костёл, являются местом, где собирается община."
      - pl: " Na majówki przychodzą głównie starsze kobiety i dzieci, ale w ciepłe wieczory zdarza się, że śpiewa cała ulica."
        ru: "На майские богослужения приходят в основном пожилые женщины и дети, но тёплыми вечерами бывает, что поёт вся улица."
    words: { "kościołach": kosciol, "krzyżach": krzyz, "zbierają": zbierac, "ozdobionej": ozdobic, "kwiatami": kwiat, "śpiewają": spiewac, "oraz": oraz, "pieśni": piesn, "najbardziej": najbardziej, "dziesiątki": dziesiatka, "tysięcy": tysiac, "kościół": kosciol, "zbiera": zbierac, "wspólnota": wspolnota, "przychodzą": przychodzic, "głównie": glownie, "ciepłe": cieply, "zdarza": zdarzac, "śpiewa": spiewac, "ulica": ulica }
  - clean: "Maj to także czas pierwszej komunii. Przystępują do niej dzieci w wieku około dziewięciu lat, po roku przygotowań w szkole i w parafii. Chłopcy i dziewczynki ubierają się zwykle w jednakowe białe stroje, czyli alby, choć jeszcze niedawno dziewczynki nosiły białe sukienki, a chłopcy granatowe garnitury. Po mszy rodzina urządza przyjęcie w domu albo w restauracji, a dziecko dostaje prezenty od rodziców chrzestnych, dziadków i ciotek. Dawniej był to zegarek albo rower, dziś coraz częściej telefon, tablet albo pieniądze, i co roku w mediach wraca dyskusja o tym, czy komunia nie stała się przede wszystkim okazją do konsumpcji."
    draft: true
    chunks:
      - pl: "Maj to także czas pierwszej komunii."
        ru: "Май — это и время первого причастия."
      - pl: " Przystępują do niej dzieci w wieku około dziewięciu lat, po roku przygotowań w szkole i w parafii."
        ru: "К нему приступают дети в возрасте около девяти лет, после года подготовки в школе и в приходе."
      - pl: " Chłopcy i dziewczynki ubierają się zwykle w jednakowe białe stroje, czyli alby, choć jeszcze niedawno dziewczynki nosiły białe sukienki, a chłopcy granatowe garnitury."
        ru: "Мальчики и девочки одеваются обычно в одинаковые белые облачения, то есть альбы, хотя ещё недавно девочки носили белые платья, а мальчики — тёмно-синие костюмы."
        note: "alba — альба, белое облачение"
      - pl: " Po mszy rodzina urządza przyjęcie w domu albo w restauracji, a dziecko dostaje prezenty od rodziców chrzestnych, dziadków i ciotek."
        ru: "После мессы семья устраивает приём дома или в ресторане, а ребёнок получает подарки от крёстных, бабушек и дедушек и тёток."
        note: "rodzice chrzestni — крёстные"
      - pl: " Dawniej był to zegarek albo rower, dziś coraz częściej telefon, tablet albo pieniądze, i co roku w mediach wraca dyskusja o tym, czy komunia nie stała się przede wszystkim okazją do konsumpcji."
        ru: "Раньше это были часы или велосипед, сегодня всё чаще телефон, планшет или деньги, и каждый год в СМИ возвращается дискуссия о том, не стало ли причастие прежде всего поводом для потребления."
    words: { "wieku": wiek, "około": okolo, "dziewięciu": dziewiec, "dziewczynki": dziewczynka, "ubierają": ubierac, "zwykle": zwykle, "białe": bialy, "stroje": stroj, "czyli": czyli, "niedawno": niedawno, "nosiły": nosic, "sukienki": sukienka, "garnitury": garnitur, "restauracji": restauracja, "dostaje": dostawac, "prezenty": prezent, "rodziców": rodzice, "dziadków": dziadek, "ciotek": ciotka, "zegarek": zegarek, "rower": rower, "coraz": coraz, "częściej": czesto, "mediach": medium, "dyskusja": dyskusja, "okazją": okazja }
  - clean: "Wiosna i początek lata to również czas świąt rodzinnych, których nie ma w kalendarzu kościelnym. Dwudziestego szóstego maja obchodzi się Dzień Matki, a dzieci w przedszkolach i szkołach przygotowują dla mam laurki, czyli własnoręcznie zrobione kartki z rysunkiem i wierszykiem, oraz występy z piosenkami. Pierwszego czerwca jest Dzień Dziecka, kiedy dzieci dostają drobne prezenty, a w szkołach zamiast lekcji organizuje się zabawy i wycieczki. Najmniej uwagi poświęca się zwykle Dniu Ojca, dwudziestego trzeciego czerwca, choć i on z roku na rok staje się popularniejszy, przynajmniej w sklepach z krawatami i narzędziami."
    draft: true
    chunks:
      - pl: "Wiosna i początek lata to również czas świąt rodzinnych, których nie ma w kalendarzu kościelnym."
        ru: "Весна и начало лета — это также время семейных праздников, которых нет в церковном календаре."
      - pl: " Dwudziestego szóstego maja obchodzi się Dzień Matki, a dzieci w przedszkolach i szkołach przygotowują dla mam laurki, czyli własnoręcznie zrobione kartki z rysunkiem i wierszykiem, oraz występy z piosenkami."
        ru: "Двадцать шестого мая отмечают День матери, а дети в детских садах и школах готовят для мам лаурки, то есть самодельные открытки с рисунком и стишком, а также выступления с песнями."
        note: "laurka — самодельная поздравительная открытка"
      - pl: " Pierwszego czerwca jest Dzień Dziecka, kiedy dzieci dostają drobne prezenty, a w szkołach zamiast lekcji organizuje się zabawy i wycieczki."
        ru: "Первого июня — День защиты детей, когда дети получают небольшие подарки, а в школах вместо уроков устраивают игры и экскурсии."
      - pl: " Najmniej uwagi poświęca się zwykle Dniu Ojca, dwudziestego trzeciego czerwca, choć i on z roku na rok staje się popularniejszy, przynajmniej w sklepach z krawatami i narzędziami."
        ru: "Меньше всего внимания обычно уделяют Дню отца, двадцать третьего июня, хотя и он с каждым годом становится популярнее — по крайней мере, в магазинах галстуков и инструментов."
        note: "krawat — галстук"
