  - clean: "W Krakowie z Bożym Ciałem wiąże się jeszcze jedna, zupełnie świecka tradycja. W czwartek po oktawie Bożego Ciała, czyli tydzień później, ulicami miasta przechodzi Lajkonik. To jeździec przebrany za Tatara, w spiczastej czapce i bogatym stroju, który siedzi na drewnianym koniku przywiązanym do pasa, tak że wygląda, jakby naprawdę jechał konno. Lajkonik tańczy, skacze i uderza przechodniów buławą, a uderzenie ma przynieść szczęście przez cały rok. Według legendy zwyczaj przypomina zwycięstwo flisaków z podkrakowskiego Zwierzyńca nad oddziałem Tatarów, który w trzynastym wieku napadł na miasto. Flisacy mieli przebrać się w stroje pokonanych wrogów i wjechać do miasta triumfalnie, a mieszczanie przyjęli ich z radością. Pochód kończy się na Rynku, gdzie burmistrz miasta częstuje Lajkonika winem, a jeździec dostaje od władz miasta symboliczną zapłatę."
