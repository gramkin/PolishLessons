chapter: 5
chapterTitle: "Od maja do żniw"
chapterTitleRu: "От мая до жатвы"
level: B2
paragraphs:
  - clean: "Maj zaczyna się w Polsce od majówki. Tak nazywa się kilka wolnych dni na początku miesiąca, między pierwszym a trzecim maja, które przy odrobinie szczęścia i kilku dniach urlopu można zamienić w cały tydzień wakacji. Polacy wyjeżdżają wtedy masowo nad jeziora, w góry albo na działki, a w całym kraju unosi się zapach grilla. Grillowanie kiełbasy, karkówki i kaszanki stało się w ostatnich trzydziestu latach prawdziwym narodowym rytuałem, a pierwszy majowy grill otwiera sezon na życie pod gołym niebem. Pogoda bywa jednak kapryśna i majówka w kurtkach i przy deszczu jest w Polsce równie częsta jak majówka w słońcu."
    draft: true
    chunks:
      - pl: "Maj zaczyna się w Polsce od majówki."
        ru: "Май в Польше начинается с майских праздников."
        note: "majówka — майские праздники, пикник"
      - pl: " Tak nazywa się kilka wolnych dni na początku miesiąca, między pierwszym a trzecim maja, które przy odrobinie szczęścia i kilku dniach urlopu można zamienić w cały tydzień wakacji."
        ru: "Так называют несколько выходных дней в начале месяца, между первым и третьим мая, которые при небольшом везении и нескольких днях отпуска можно превратить в целую неделю каникул."
      - pl: " Polacy wyjeżdżają wtedy masowo nad jeziora, w góry albo na działki, a w całym kraju unosi się zapach grilla."
        ru: "Поляки массово уезжают тогда на озёра, в горы или на дачи, а по всей стране разносится запах гриля."
        note: "działka — дачный участок"
      - pl: " Grillowanie kiełbasy, karkówki i kaszanki stało się w ostatnich trzydziestu latach prawdziwym narodowym rytuałem, a pierwszy majowy grill otwiera sezon na życie pod gołym niebem."
        ru: "Жарить на гриле колбасу, свиную шею и кровянку стало за последние тридцать лет настоящим национальным ритуалом, а первый майский гриль открывает сезон жизни под открытым небом."
        note: "karkówka — свиная шея; kaszanka — кровяная колбаса с крупой"
      - pl: " Pogoda bywa jednak kapryśna i majówka w kurtkach i przy deszczu jest w Polsce równie częsta jak majówka w słońcu."
        ru: "Однако погода бывает капризной, и майские в куртках и под дождём в Польше так же часты, как майские на солнце."
        note: "kapryśny — капризный"
