  - clean: "Pięćdziesiąt dni po Wielkanocy przypada Zesłanie Ducha Świętego, nazywane w Polsce Zielonymi Świątkami. Nazwa pochodzi od zwyczaju majenia, czyli ozdabiania domów, obór i bram zielonymi gałęziami brzozy, lipy albo klonu, które miały chronić przed złem i zapewnić urodzaj. Podłogi w izbach wysypywano tatarakiem, rośliną o mocnym, świeżym zapachu, która rośnie nad wodą. W tym czasie pasterze po raz pierwszy wypędzali bydło na wiosenne pastwiska, a krowę, która pierwsza wyszła z obory, przystrajano kwiatami. Dziś Zielone Świątki są mniej widoczne niż inne święta, ale w wielu wsiach na drzwiach i płotach wciąż można zobaczyć brzozowe gałązki."
    draft: true
    chunks:
      - pl: "Pięćdziesiąt dni po Wielkanocy przypada Zesłanie Ducha Świętego, nazywane w Polsce Zielonymi Świątkami."
        ru: "Через пятьдесят дней после Пасхи приходится Сошествие Святого Духа, называемое в Польше Зелёными Святками."
        note: "Zesłanie Ducha Świętego — Троица, Пятидесятница"
      - pl: " Nazwa pochodzi od zwyczaju majenia, czyli ozdabiania domów, obór i bram zielonymi gałęziami brzozy, lipy albo klonu, które miały chronić przed złem i zapewnić urodzaj."
        ru: "Название происходит от обычая «маения», то есть украшения домов, хлевов и ворот зелёными ветками берёзы, липы или клёна, которые должны были защищать от зла и обеспечить урожай."
        note: "brzoza — берёза; lipa — липа"
      - pl: " Podłogi w izbach wysypywano tatarakiem, rośliną o mocnym, świeżym zapachu, która rośnie nad wodą."
        ru: "Полы в избах посыпали аиром, растением с сильным свежим запахом, которое растёт у воды."
