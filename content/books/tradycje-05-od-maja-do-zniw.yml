    chunks:
      - pl: "W tym samym czasie na polach trwają żniwa."
        ru: "В то же время на полях идёт жатва."
      - pl: " Dawniej zboże kosiło się ręcznie, kosą i sierpem, a do pracy wychodziła cała wieś, od świtu do zmierzchu."
        ru: "Раньше хлеб косили вручную, косой и серпом, и на работу выходила вся деревня, от рассвета до заката."
        note: "sierp — серп; zmierzch — сумерки"
      - pl: " Dziś robią to kombajny, które w kilka godzin kończą pracę, która kiedyś trwała tygodniami, ale żniwa wciąż są najważniejszym momentem w rolniczym roku."
        ru: "Сегодня это делают комбайны, которые за несколько часов заканчивают работу, длившуюся когда-то неделями, но жатва по-прежнему остаётся главным моментом сельскохозяйственного года."
      - pl: " Kiedy z pól zniknie ostatni kłos, przyjdzie czas na święto, które zamyka letni kalendarz i otwiera jesień."
        ru: "Когда с полей исчезнет последний колос, наступит время праздника, который закрывает летний календарь и открывает осень."
    words: { "polach": pole, "zboże": zboze, "ręcznie": recznie, "kończą": konczyc, "momentem": moment, "zamyka": zamykac, "letni": letni, "kalendarz": kalendarz, "jesień": jesien }
