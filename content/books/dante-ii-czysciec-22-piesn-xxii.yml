translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 22
chapterTitle: "Pieśń XXII"
chapterTitleRu: "Песнь XXII. Обращение Стация"
level: B2
paragraphs:
  - clean: "(Stacjusz i Wirgiliusza Ekloga 4. Krąg VI. Żarłocy, głodni, leżący pod drzewem życia. Piąte P znikło.)"
    chunks:
      - pl: "(Stacjusz i Wirgiliusza Ekloga 4. Krąg VI. Żarłocy, głodni, leżący pod drzewem życia. Piąte P znikło.)"
        ru: "(Стаций и четвёртая эклога Вергилия. Круг VI. Чревоугодники, голодные, у древа жизни. Пятое «P» исчезло.)"
        note: "ekloga — эклога"
    words: { "Krąg": krag, "głodni": glodny, "leżący": lezec, "drzewem": drzewo, "znikło": zniknac }
  - clean: "Wprowadzający nas w krąg szósty góry,\nZnak z mego czoła zmazawszy skrzydłami,\nJuż był odleciał anioł białopióry.\nW sprawiedliwości zatopionych cieni,\nZwróconych do niej wszystkimi żądzami\nCały chór mówił nam: «Błogosławieni»\nI na tym słowie «łaknący» głos słodki\nZamilkł, i reszty nie domówił zwrotki."
    verse: true
    chunks:
      - pl: "Wprowadzający nas w krąg szósty góry,"
        ru: "Вводивший нас в шестой круг горы,"
      - pl: "\nZnak z mego czoła zmazawszy skrzydłami,"
        ru: "стерев крыльями знак с моего чела,"
      - pl: "\nJuż był odleciał anioł białopióry."
        ru: "уже улетел белопёрый ангел."
      - pl: "\nW sprawiedliwości zatopionych cieni,"
        ru: "Погружённых в справедливость теней,"
      - pl: "\nZwróconych do niej wszystkimi żądzami"
        ru: "обращённых к ней всеми желаниями,"
      - pl: "\nCały chór mówił nam: «Błogosławieni»"
        ru: "весь хор говорил нам: «Блаженны»,"
      - pl: "\nI na tym słowie «łaknący» głos słodki"
        ru: "и на слове «жаждущие» сладкий голос"
        note: "łaknący — жаждущий"
      - pl: "\nZamilkł, i reszty nie domówił zwrotki."
        ru: "умолк и не договорил остаток стиха."
    words: { "Wprowadzający": wprowadzac, "czoła": czolo, "skrzydłami": skrzydlo, "odleciał": odleciec, "chór": chor, "Błogosławieni": blogoslawic }
  - clean: "Po schodach, czując większą lekkość ruchów,\nBez trudu szedłem śladem lekkich duchów.\nWirgili zaczął: «Miłość w głębi ducha\nZatlona cnotą, gdy na zewnątrz bucha,\nW lot drugą miłość swą iskrą zapala.\nOdtąd gdy do nas zszedł cień Juwenala\nW przedsień piekielną i skłonność twą dla mnie,\nW słowach strzelistych objawił niekłamnie,\nTakie spółczucie poczułem ku tobie,\nJakiegoś nie czuł ku obcej osobie,\nŻe z tobą spieszno iść mi po tej skale."
    verse: true
    chunks:
      - pl: "Po schodach, czując większą lekkość ruchów,"
        ru: "По ступеням, чувствуя большую лёгкость движений,"
      - pl: "\nBez trudu szedłem śladem lekkich duchów."
        ru: "я без труда шёл по следу лёгких духов."
      - pl: "\nWirgili zaczął: «Miłość w głębi ducha"
        ru: "Вергилий начал: «Любовь, в глубине духа"
      - pl: "\nZatlona cnotą, gdy na zewnątrz bucha,"
        ru: "зажжённая добродетелью, когда вырывается наружу,"
        note: "zatlony — зажжённый"
      - pl: "\nW lot drugą miłość swą iskrą zapala."
        ru: "на лету зажигает своей искрой другую любовь."
      - pl: "\nOdtąd gdy do nas zszedł cień Juwenala"
        ru: "С тех пор как к нам сошла тень Ювенала"
      - pl: "\nW przedsień piekielną i skłonność twą dla mnie,"
        ru: "в адские сени и твою склонность ко мне"
      - pl: "\nW słowach strzelistych objawił niekłamnie,"
        ru: "искренне открыла в пылких словах,"
        note: "niekłamnie — искренне"
      - pl: "\nTakie spółczucie poczułem ku tobie,"
        ru: "я почувствовал к тебе такое сочувствие,"
      - pl: "\nJakiegoś nie czuł ku obcej osobie,"
        ru: "какого ты не чувствовал к чужому человеку,"
      - pl: "\nŻe z tobą spieszno iść mi po tej skale."
        ru: "что мне не терпится идти с тобой по этой скале."
        note: "spieszno — не терпится"
    words: { "schodach": schody, "trudu": trud, "głębi": glab, "Odtąd": odtad, "cień": cien, "piekielną": piekielny }
  - clean: "Jeślim mój język rozwiązał za wiele,\nPrzebacz mi, odtąd jako przyjaciele\nNawzajem z sobą mówmy poufale.\nMogłali zgrzeszyć łakomstwem twa dusza,\nKtórą zmysł piękna zachwyca i wzrusza\nTak ukształcony przez ciebie?» Te słowa\nWzbudziły lekki uśmiech Stacyjusza."
    verse: true
    chunks:
      - pl: "Jeślim mój język rozwiązał za wiele,"
        ru: "Если я слишком развязал свой язык,"
      - pl: "\nPrzebacz mi, odtąd jako przyjaciele"
        ru: "прости меня; отныне, как друзья,"
      - pl: "\nNawzajem z sobą mówmy poufale."
        ru: "будем говорить друг с другом доверительно."
      - pl: "\nMogłali zgrzeszyć łakomstwem twa dusza,"
        ru: "Могла ли согрешить жадностью твоя душа,"
      - pl: "\nKtórą zmysł piękna zachwyca i wzrusza"
        ru: "которую чувство прекрасного восхищает и трогает,"
      - pl: "\nTak ukształcony przez ciebie?» Te słowa"
        ru: "столь развитое тобою?» Эти слова"
        note: "ukształcony — развитый, образованный"
      - pl: "\nWzbudziły lekki uśmiech Stacyjusza."
        ru: "вызвали лёгкую улыбку Стация."
    words: { "język": jezyk, "Przebacz": przebaczyc, "Nawzajem": nawzajem, "zmysł": zmysl, "lekki": lekki, "uśmiech": usmiech }
  - clean: "Wtem odpowiedział: «Szczerość mię nie drażni,\nWidzę w niej drogi znak twojej przyjaźni.\nZaiste, pozór rzeczy mylny bywa,\nBo nam zakryta przyczyna prawdziwa:\nZaiste, mniemasz, co zdradza twa mowa,\nŻem był do ziemi łakomstwem przykuty,\nMoże z powodu miejsca mej pokuty?"
    verse: true
    chunks:
      - pl: "Wtem odpowiedział: «Szczerość mię nie drażni,"
        ru: "Тут он ответил: «Искренность меня не раздражает,"
      - pl: "\nWidzę w niej drogi znak twojej przyjaźni."
        ru: "я вижу в ней дорогой знак твоей дружбы."
      - pl: "\nZaiste, pozór rzeczy mylny bywa,"
        ru: "Воистину, видимость вещей бывает обманчива,"
      - pl: "\nBo nam zakryta przyczyna prawdziwa:"
        ru: "ибо от нас скрыта истинная причина:"
      - pl: "\nZaiste, mniemasz, co zdradza twa mowa,"
        ru: "воистину, ты полагаешь, что выдаёт твоя речь,"
      - pl: "\nŻem był do ziemi łakomstwem przykuty,"
        ru: "что я был прикован к земле жадностью,"
      - pl: "\nMoże z powodu miejsca mej pokuty?"
        ru: "может быть, из-за места моего покаяния?"
    words: { "Szczerość": szczerosc, "znak": znak, "pozór": pozor, "bywa": bywac, "przyczyna": przyczyna, "zdradza": zdradzac }
  - clean: "Jam się łakomstwem brzydził za żywota,\nCzasu tysiąca księżyców za mało,\nBy zmyć pokutą jego plamę całą.\nI gdyby żądz mi nie hamował z góry\nWiersz twój gromiący brud ludzkiej natury:\n»Czegóż nie zbroi chciwość głodna złota?«\nMusiałbym toczyć głazy wpół schylony,\nZ potępieńcami biegając w przegony."
    verse: true
    chunks:
      - pl: "Jam się łakomstwem brzydził za żywota,"
        ru: "Я гнушался жадностью при жизни,"
      - pl: "\nCzasu tysiąca księżyców za mało,"
        ru: "времени тысячи лун мало,"
      - pl: "\nBy zmyć pokutą jego plamę całą."
        ru: "чтобы смыть покаянием всё её пятно."
        note: "то есть пятно противоположного греха"
      - pl: "\nI gdyby żądz mi nie hamował z góry"
        ru: "И если бы мне свыше не сдержал желаний"
      - pl: "\nWiersz twój gromiący brud ludzkiej natury:"
        ru: "твой стих, громящий грязь человеческой природы:"
      - pl: "\n»Czegóż nie zbroi chciwość głodna złota?«"
        ru: "„На что не толкает голодная до золота алчность?“"
        note: "из «Энеиды»"
      - pl: "\nMusiałbym toczyć głazy wpół schylony,"
        ru: "я должен был бы катать камни, полусогнувшись,"
      - pl: "\nZ potępieńcami biegając w przegony."
        ru: "бегая наперегонки с осуждёнными."
        note: "w przegony — наперегонки; в аду скупцов"
    words: { "zmyć": zmyc, "plamę": plama, "Wiersz": wiersz, "brud": brud, "toczyć": toczyc, "biegając": biegac }
  - clean: "Wtenczas postrzegłem, że rozrzutnym szałem\nCzęsto zanadto dłoń mą otwierałem:\nI żalem, skruchą, w modlitwach przyczynnych,\nGrzech ten zgładziłem jak i wiele innych.\nIleż głów łysych z grobów się podniesie\nW straszny dzień Sądu tych, co zapomnieli,\nŻe grzech ten skruchą z swej by duszy zdjęli,\nBądź w ciągu życia, bądź przy jego kresie."
    verse: true
    chunks:
      - pl: "Wtenczas postrzegłem, że rozrzutnym szałem"
        ru: "Тогда я заметил, что в расточительном безумии"
        note: "rozrzutny — расточительный"
      - pl: "\nCzęsto zanadto dłoń mą otwierałem:"
        ru: "часто слишком открывал свою ладонь:"
      - pl: "\nI żalem, skruchą, w modlitwach przyczynnych,"
        ru: "и сожалением, раскаянием, в заступнических молитвах"
      - pl: "\nGrzech ten zgładziłem jak i wiele innych."
        ru: "я смыл этот грех, как и многие другие."
      - pl: "\nIleż głów łysych z grobów się podniesie"
        ru: "Сколько же лысых голов поднимется из могил"
      - pl: "\nW straszny dzień Sądu tych, co zapomnieli,"
        ru: "в страшный день Суда — тех, кто забыл,"
      - pl: "\nŻe grzech ten skruchą z swej by duszy zdjęli,"
        ru: "что этот грех раскаянием сняли бы со своей души"
      - pl: "\nBądź w ciągu życia, bądź przy jego kresie."
        ru: "то ли в течение жизни, то ли у её предела."
    words: { "szałem": szal, "żalem": zal, "modlitwach": modlitwa, "Grzech": grzech, "grobów": grob, "kresie": kres }
  - clean: "Wiedz, te dwa grzechy, których względna sprzeczność\nŁączy je z sobą przez ich ostateczność,\nTu jad swój tracą już na całą wieczność.\nWięc jeśli w jednym kręgu z łakomcami,\nDuch się mój czyścił pokutą i łzami,\nTo się trafiło przez grzech mój przeciwny»."
    verse: true
    chunks:
      - pl: "Wiedz, te dwa grzechy, których względna sprzeczność"
        ru: "Знай: эти два греха, чья относительная противоположность"
        note: "sprzeczność — противоположность"
      - pl: "\nŁączy je z sobą przez ich ostateczność,"
        ru: "связывает их друг с другом через их крайность,"
      - pl: "\nTu jad swój tracą już na całą wieczność."
        ru: "здесь теряют свой яд уже на всю вечность."
      - pl: "\nWięc jeśli w jednym kręgu z łakomcami,"
        ru: "Итак, если в одном кругу со скупцами"
      - pl: "\nDuch się mój czyścił pokutą i łzami,"
        ru: "мой дух очищался покаянием и слезами,"
      - pl: "\nTo się trafiło przez grzech mój przeciwny»."
        ru: "это случилось из-за моего противоположного греха»."
    words: { "sprzeczność": sprzecznosc, "Łączy": laczyc, "wieczność": wiecznosc, "czyścił": czyscic, "łzami": lza, "przeciwny": przeciwny }
  - clean: "A sielskich wierszy rzekł śpiewak przedziwny:\n«Gdyś bratnich wojen piał śpiew uroczysty,\nA w nim Jokasty żal, smutek dwoisty,\nZ dźwięków, jakimi przez twe usta brzmiała\nPoważna Klio, ani mogłem wnosić,\nŻe ci wśród wiernych Wiara miejsce dała,\nBez której dobrze czynić to nie dosyć."
    verse: true
    chunks:
      - pl: "A sielskich wierszy rzekł śpiewak przedziwny:"
        ru: "А дивный певец сельских стихов сказал:"
        note: "sielski — сельский, буколический"
      - pl: "\n«Gdyś bratnich wojen piał śpiew uroczysty,"
        ru: "«Когда ты пел торжественную песнь братских войн,"
      - pl: "\nA w nim Jokasty żal, smutek dwoisty,"
        ru: "а в ней двойную скорбь, печаль Иокасты,"
      - pl: "\nZ dźwięków, jakimi przez twe usta brzmiała"
        ru: "по звукам, какими через твои уста звучала"
      - pl: "\nPoważna Klio, ani mogłem wnosić,"
        ru: "важная Клио, я никак не мог заключить,"
      - pl: "\nŻe ci wśród wiernych Wiara miejsce dała,"
        ru: "что Вера дала тебе место среди верных,"
      - pl: "\nBez której dobrze czynić to nie dosyć."
        ru: "без которой делать добро недостаточно."
    words: { "rzekł": rzec, "smutek": smutek, "dźwięków": dzwiek, "usta": usta, "wiernych": wierny, "czynić": czynic }
  - clean: "Gdy prawdę mówisz, powiedz, światłość jaka\nTak rozproszyła twe dawne ciemności,\nŻe swoją łódkę z morskich nawałności\nRad skierowałeś do łodzi rybaka?»\nA on: — «Tyś pierwszy we mnie zapał wzniecił\nChodzić w twe ślady drogą ścieżek nowych\nI pić ze źródeł jak ty parnasowych;\nPierwszyś w miłości bożej mię oświecił."
    verse: true
    chunks:
      - pl: "Gdy prawdę mówisz, powiedz, światłość jaka"
        ru: "Если ты говоришь правду, скажи, какой свет"
      - pl: "\nTak rozproszyła twe dawne ciemności,"
        ru: "так рассеял твою прежнюю тьму,"
      - pl: "\nŻe swoją łódkę z morskich nawałności"
        ru: "что свою лодку от морских бурь"
        note: "nawałność — буря"
      - pl: "\nRad skierowałeś do łodzi rybaka?»"
        ru: "ты охотно направил к лодке рыбака?»"
        note: "к Петру"
      - pl: "\nA on: — «Tyś pierwszy we mnie zapał wzniecił"
        ru: "А он: — «Ты первый зажёг во мне пыл"
      - pl: "\nChodzić w twe ślady drogą ścieżek nowych"
        ru: "ходить по твоим следам дорогой новых троп"
      - pl: "\nI pić ze źródeł jak ty parnasowych;"
        ru: "и пить, как ты, из парнасских источников;"
        note: "parnasowy — парнасский"
      - pl: "\nPierwszyś w miłości bożej mię oświecił."
        ru: "ты первый просветил меня в любви Божьей."
    words: { "łódkę": lodka, "morskich": morski, "skierowałeś": skierowac, "ścieżek": sciezka, "źródeł": zrodlo, "bożej": bozy }
  - clean: "Ty jak ów byłeś, co latarkę w nocy\nNiesie za sobą, sam żadnej pomocy\nNie ma z jej światła, lecz za nim idącym\nOświeca drogę blaskiem migającym.\nOdkąd wyrzekłeś: »Świat się nasz odmładza,\nZ nieba wiek złoty, nowe ludzi plemię\nZ sprawiedliwością zstępują na ziemię«."
    verse: true
    chunks:
      - pl: "Ty jak ów byłeś, co latarkę w nocy"
        ru: "Ты был как тот, что ночью фонарь"
      - pl: "\nNiesie za sobą, sam żadnej pomocy"
        ru: "несёт за собой, сам никакой помощи"
      - pl: "\nNie ma z jej światła, lecz za nim idącym"
        ru: "не имея от его света, но идущим за ним"
      - pl: "\nOświeca drogę blaskiem migającym."
        ru: "освещает дорогу мерцающим блеском."
      - pl: "\nOdkąd wyrzekłeś: »Świat się nasz odmładza,"
        ru: "С тех пор как ты изрёк: „Мир наш молодеет,"
        note: "odmładzać się — молодеть"
      - pl: "\nZ nieba wiek złoty, nowe ludzi plemię"
        ru: "с неба золотой век, новое племя людей"
      - pl: "\nZ sprawiedliwością zstępują na ziemię«."
        ru: "со справедливостью сходят на землю“."
        note: "IV эклога Вергилия"
    words: { "latarkę": latarka, "Niesie": niesc, "blaskiem": blask, "złoty": zloty, "plemię": plemie, "sprawiedliwością": sprawiedliwosc }
  - clean: "Przez ciebie, gdy mnie duch twój wieszczy krzepi,\nByłem poetą i chrześcijaninem.\nLecz mój rysunek gdybyś widział lepiej,\nPędzel ten zarys farbą naprowadza.\nJuż ziarno wiary słowami i czynem,\nPo całej ziemi, aż po świata krańce\nSieli wiecznego królestwa posłańce."
    verse: true
    chunks:
      - pl: "Przez ciebie, gdy mnie duch twój wieszczy krzepi,"
        ru: "Через тебя, когда меня укрепляет твой вещий дух,"
      - pl: "\nByłem poetą i chrześcijaninem."
        ru: "я был поэтом и христианином."
      - pl: "\nLecz mój rysunek gdybyś widział lepiej,"
        ru: "Но чтобы ты лучше видел мой рисунок,"
      - pl: "\nPędzel ten zarys farbą naprowadza."
        ru: "кисть наведёт краской этот набросок."
        note: "zarys — набросок"
      - pl: "\nJuż ziarno wiary słowami i czynem,"
        ru: "Уже семя веры словом и делом"
      - pl: "\nPo całej ziemi, aż po świata krańce"
        ru: "по всей земле, до краёв света"
      - pl: "\nSieli wiecznego królestwa posłańce."
        ru: "сеяли посланцы вечного царства."
        note: "posłaniec — посланец"
    words: { "poetą": poeta, "chrześcijaninem": chrzescijanin, "rysunek": rysunek, "farbą": farba, "ziarno": ziarno, "wiecznego": wieczny }
  - clean: "Jak w twojej wieszczbie, widząc, że duch wieje,\nW tym, co kazali nowi kaznodzieje,\nStałem się pilnym ich słowa słuchaczem;\nPrzed ich świętością padłem na kolana.\nA gdy je ścinał miecz Domicyjana,\nŁzy moje z krwią ich mieszałem i płaczem."
    verse: true
    chunks:
      - pl: "Jak w twojej wieszczbie, widząc, że duch wieje,"
