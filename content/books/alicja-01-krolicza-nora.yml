# review
title: Alicja w Krainie Czarów
titleRu: Алиса в Стране чудес
author: Lewis Carroll
translator: Jarek Westermark
source:
  name: Wolne Lektury
  url: https://wolnelektury.pl/katalog/lektura/carroll-alicja-w-krainie-czarow/
