chapter: 1
chapterTitle: W głąb króliczej nory
chapterTitleRu: Вниз по кроличьей норе
level: B1
paragraphs:
  - clean: "Alicja była już bardzo zmęczona bezczynnym siedzeniem z siostrą nad brzegiem rzeki: kilka razy zerknęła do książki siostry, ale nie było tam ani obrazków, ani rozmów. „A po co komu — pomyślała Alicja — taka książka bez obrazków i rozmów?”."
    chunks:
      - pl: "Alicja była już bardzo zmęczona"
        ru: "Алиса уже очень устала"
        note: "zmęczony czymś — устать ОТ чего-либо: после zmęczony творительный падеж"
      - pl: " bezczynnym siedzeniem z siostrą"
        ru: "от праздного сидения с сестрой"
      - pl: " nad brzegiem rzeki:"
        ru: "на берегу реки:"
        note: "nad + творительный — у, над: nad brzegiem, nad morzem"
      - pl: " kilka razy zerknęła do książki siostry,"
        ru: "несколько раз она заглянула в книжку сестры,"
      - pl: " ale nie było tam ani obrazków, ani rozmów."
        ru: "но там не было ни картинок, ни разговоров."
        note: "ani… ani… — ни… ни…"
      - pl: " „A po co komu"
        ru: "«А кому нужна"
        note: "po co komu — разговорное зачем кому-то"
      - pl: " — pomyślała Alicja —"
        ru: "— подумала Алиса —"
      - pl: " taka książka bez obrazków i rozmów?”."
        ru: "такая книжка без картинок и разговоров?»."
    words: { "była": byly, "zmęczona": zmeczony, "siedzeniem": siedziec, "siostrą": siostra, "brzegiem": brzeg, "rzeki": rzeka, "książki": ksiazka, "rozmów": rozmowa, "pomyślała": pomyslec }
  - clean: "Rozważała właśnie (choć tego upalnego dnia czuła się senna i otępiała), czy warto wstać i pozbierać stokrotki, żeby potem upleść z nich wianek, gdy nagle tuż obok niej przebiegł biały królik z różowymi oczami."
    chunks:
      - pl: "Rozważała właśnie"
        ru: "Она как раз раздумывала"
      - pl: " (choć tego upalnego dnia czuła się senna i otępiała),"
        ru: "(хотя в тот знойный день её клонило в сон и мысли путались),"
        note: "czuć się + наречие — чувствовать себя каким-л.: czuję się dobrze мне хорошо"
      - pl: " czy warto wstać i pozbierać stokrotki,"
        ru: "стоит ли вставать и собирать маргаритки,"
        note: "czy warto + инфинитив — стоит ли"
      - pl: " żeby potem upleść z nich wianek,"
        ru: "чтобы потом сплести из них венок,"
      - pl: " gdy nagle tuż obok niej przebiegł"
        ru: "как вдруг совсем рядом пробежал"
        note: "tuż obok — совсем рядом; tuż усиливает близость"
      - pl: " biały królik z różowymi oczami."
        ru: "белый кролик с розовыми глазами."
    words: { "wstać": wstac, "potem": potem, "nagle": nagle, "tuż": tuz, "biały": bialy }
  - clean: "Nie było w tym nic przesadnie niezwykłego, a Alicja wcale nie zdziwiła się też, gdy usłyszała, jak Królik mamrocze pod nosem: „Ojej! Ojej! Na pewno się spóźnię!” (Potem uznała, że może powinno ją to było zastanowić, ale w tamtej chwili wydawało się całkowicie naturalne). Kiedy jednak Królik wyciągnął z kieszeni kamizelki zegarek na łańcuszku, sprawdził godzinę i zaraz pognał dalej, Alicja skoczyła na równe nogi, bo pomyślała, że przecież nigdy jeszcze nie widziała królika w kamizelce, ani królika noszącego w kieszeni zegarek. Ogromnie zaciekawiona, pobiegła za nim przez pole i akurat zdążyła zobaczyć, jak wskakuje do dużej nory pod żywopłotem."
    chunks:
      - pl: "Nie było w tym nic przesadnie niezwykłego,"
        ru: "В этом не было ничего особенно необычного,"
      - pl: " a Alicja wcale nie zdziwiła się też,"
        ru: "и Алиса вовсе не удивилась,"
      - pl: " gdy usłyszała, jak Królik mamrocze pod nosem:"
        ru: "когда услышала, как Кролик бормочет себе под нос:"
        note: "mamrotać pod nosem — устойчивое бормотать себе под нос"
      - pl: " „Ojej! Ojej! Na pewno się spóźnię!”"
        ru: "«Ой-ой! Я непременно опоздаю!»"
        note: "na pewno — наверняка, точно. Ложный друг: русское наверное — это chyba, raczej"
      - pl: " (Potem uznała, że może powinno ją to było zastanowić,"
        ru: "(Потом она решила, что это, пожалуй, должно было её насторожить,"
      - pl: " ale w tamtej chwili wydawało się całkowicie naturalne)."
        ru: "но в ту минуту всё казалось совершенно естественным)."
      - pl: " Kiedy jednak Królik wyciągnął z kieszeni kamizelki"
        ru: "Но когда Кролик вытащил из кармана жилетки"
      - pl: " zegarek na łańcuszku, sprawdził godzinę"
        ru: "часы на цепочке, посмотрел на время"
      - pl: " i zaraz pognał dalej,"
        ru: "и тут же помчался дальше,"
      - pl: " Alicja skoczyła na równe nogi,"
        ru: "Алиса вскочила на ноги,"
        note: "skoczyć na równe nogi — идиома вскочить на ноги"
      - pl: " bo pomyślała, że przecież nigdy jeszcze"
        ru: "потому что подумала, что ведь никогда ещё"
      - pl: " nie widziała królika w kamizelce,"
        ru: "не видела кролика в жилетке,"
      - pl: " ani królika noszącego w kieszeni zegarek."
        ru: "ни кролика, который носит в кармане часы."
      - pl: " Ogromnie zaciekawiona, pobiegła za nim przez pole"
        ru: "Страшно заинтригованная, она побежала за ним через поле"
      - pl: " i akurat zdążyła zobaczyć,"
        ru: "и как раз успела увидеть,"
        note: "zdążyć + инфинитив — успеть сделать"
      - pl: " jak wskakuje do dużej nory pod żywopłotem."
        ru: "как он ныряет в большую нору под изгородью."
    words: { "niezwykłego": niezwykly, "wcale": wcale, "usłyszała": uslyszec, "nosem": nos, "spóźnię": spoznic, "uznała": uznac, "tamtej": tamten, "wydawało": wydawac, "całkowicie": calkowicie, "wyciągnął": wyciagnac, "kieszeni": kieszen, "zegarek": zegarek, "sprawdził": sprawdzic, "godzinę": godzina, "dalej": dalej, "nogi": noga, "noszącego": nosic, "pole": pole, "zdążyła": zdazyc }
  - clean: "Natychmiast skoczyła w jego ślady, nie zastanowiwszy się wcale, jak później wróci na powierzchnię."
    chunks:
      - pl: "Natychmiast skoczyła w jego ślady,"
        ru: "Она тут же прыгнула следом,"
        note: "pójść w czyjeś ślady — последовать за кем-то, буквально по его следам"
      - pl: " nie zastanowiwszy się wcale,"
        ru: "ничуть не задумавшись,"
        note: "zastanowić się nad czymś — задуматься о чём-л.: nad + творительный"
      - pl: " jak później wróci na powierzchnię."
        ru: "как потом выберется обратно наверх."
    words: { "Natychmiast": natychmiast, "ślady": slad, "później": pozno }
  - clean: "Królicza nora przypominała tunel, który przez dłuższy czas prowadził prosto, ale kończył się rozpadliną tak niespodziewanie, że zanim Alicja zdążyła choćby pomyśleć o tym, że mogłaby przystanąć, już leciała w głąb jak gdyby głębokiej studni."
    chunks:
      - pl: "Królicza nora przypominała tunel,"
        ru: "Кроличья нора напоминала туннель,"
        note: "przypominać coś — напоминать что-л.: винительный, без предлога"
      - pl: " który przez dłuższy czas prowadził prosto,"
        ru: "который довольно долго шёл прямо,"
      - pl: " ale kończył się rozpadliną tak niespodziewanie,"
        ru: "но обрывался расщелиной так внезапно,"
      - pl: " że zanim Alicja zdążyła choćby pomyśleć o tym,"
        ru: "что прежде чем Алиса успела хотя бы подумать о том,"
      - pl: " że mogłaby przystanąć,"
        ru: "что можно было бы остановиться,"
      - pl: " już leciała w głąb jak gdyby głębokiej studni."
        ru: "она уже летела вниз, словно в глубокий колодец."
        note: "w głąb — вглубь; jak gdyby — словно, как будто"
    words: { "przypominała": przypominac, "tunel": tunel, "dłuższy": dlugi, "prowadził": prowadzic, "kończył": konczyc, "niespodziewanie": spodziewac, "leciała": leciec, "głąb": glab, "głębokiej": gleboki }
  - clean: "Albo ta studnia była naprawdę bardzo głęboka, albo Alicja leciała wyjątkowo powoli, miała bowiem mnóstwo czasu, żeby spojrzeć wokół i pomyśleć, co też wydarzy się dalej. Najpierw wytężyła wzrok, żeby zobaczyć, co czeka na nią w dole, panowały tam jednak zbyt gęste ciemności. Potem popatrzyła na ściany i zauważyła, że są wyłożone szafami i półkami na książki; widziała również mapy i obrazy zawieszone na gwoździach. Sięgnęła do jednej z mijanych półek i zdjęła z niej słoik z napisem „Dżem z pomarańczy”. Przeżyła wielkie rozczarowanie, kiedy okazał się pusty, nie chciała go jednak wyrzucić, żeby nie spadł i nie zabił kogoś stojącego poniżej, odłożyła go więc do kolejnej szafy, kiedy akurat przelatywała obok."
    chunks:
      - pl: "Albo ta studnia była naprawdę bardzo głęboka,"
        ru: "Или колодец был и вправду очень глубок,"
      - pl: " albo Alicja leciała wyjątkowo powoli,"
        ru: "или Алиса летела необыкновенно медленно,"
      - pl: " miała bowiem mnóstwo czasu,"
        ru: "ведь времени у неё было предостаточно,"
        note: "bowiem — книжное ведь, ибо; стоит не в начале предложения"
      - pl: " żeby spojrzeć wokół i pomyśleć,"
        ru: "чтобы оглядеться и подумать,"
      - pl: " co też wydarzy się dalej."
        ru: "что же будет дальше."
      - pl: " Najpierw wytężyła wzrok,"
        ru: "Сначала она вгляделась,"
        note: "wytężyć wzrok — напрячь зрение, вглядеться"
      - pl: " żeby zobaczyć, co czeka na nią w dole,"
        ru: "чтобы разглядеть, что ждёт её внизу,"
      - pl: " panowały tam jednak zbyt gęste ciemności."
        ru: "но там царила слишком густая тьма."
      - pl: " Potem popatrzyła na ściany i zauważyła,"
        ru: "Потом она посмотрела на стены и заметила,"
      - pl: " że są wyłożone szafami i półkami na książki;"
        ru: "что они уставлены шкафами и книжными полками;"
      - pl: " widziała również mapy i obrazy zawieszone na gwoździach."
        ru: "видела она и карты, и картины, висящие на гвоздях."
      - pl: " Sięgnęła do jednej z mijanych półek"
        ru: "Она потянулась к одной из проплывавших мимо полок"
        note: "sięgnąć do czegoś — потянуться за чем-л."
      - pl: " i zdjęła z niej słoik z napisem „Dżem z pomarańczy”."
        ru: "и сняла с неё банку с надписью «Апельсиновый джем»."
      - pl: " Przeżyła wielkie rozczarowanie, kiedy okazał się pusty,"
        ru: "Её постигло большое разочарование, когда банка оказалась пустой,"
      - pl: " nie chciała go jednak wyrzucić,"
        ru: "но выбросить её она всё же не захотела,"
      - pl: " żeby nie spadł i nie zabił kogoś stojącego poniżej,"
        ru: "чтобы та не упала и не убила кого-нибудь внизу,"
      - pl: " odłożyła go więc do kolejnej szafy,"
        ru: "поэтому она поставила её в следующий шкаф,"
      - pl: " kiedy akurat przelatywała obok."
        ru: "когда как раз пролетала мимо."
    words: { "powoli": powoli, "mnóstwo": mnostwo, "spojrzeć": spojrzec, "wokół": wokol, "wydarzy": wydarzyc, "Najpierw": najpierw, "wytężyła": wytezyc, "wzrok": wzrok, "dole": dol, "zbyt": zbyt, "ciemności": ciemnosc, "ściany": sciana, "zauważyła": zauwazyc, "mapy": mapa, "obrazy": obraz, "zdjęła": zdjac, "słoik": sloik, "napisem": napis, "Przeżyła": przezyc, "okazał": okazac, "pusty": pusty, "wyrzucić": wyrzucic, "spadł": spasc, "odłożyła": odlozyc, "kolejnej": kolejny }
  - clean: "„Jedno jest pewne!”, pomyślała Alicja. „Po takim locie żaden upadek ze schodów nie zrobi już na mnie wrażenia! W domu wszyscy uznają mnie za niezwykle dzielną! Nawet gdybym spadła z samego czubka dachu, nie pisnę ani słowa!” (Tu akurat miała chyba całkowitą rację)."
    chunks:
      - pl: "„Jedno jest pewne!”, pomyślała Alicja."
        ru: "«Одно несомненно!» — подумала Алиса."
      - pl: " „Po takim locie żaden upadek ze schodów"
        ru: "«После такого полёта никакое падение с лестницы"
      - pl: " nie zrobi już na mnie wrażenia!"
        ru: "уже меня не впечатлит!"
        note: "zrobić wrażenie na kimś — произвести впечатление на кого-л."
      - pl: " W domu wszyscy uznają mnie za niezwykle dzielną!"
        ru: "Дома все сочтут меня необыкновенно храброй!"
        note: "uznać kogoś za coś — счесть кого-л. кем-л.: za + винительный"
      - pl: " Nawet gdybym spadła z samego czubka dachu,"
        ru: "Даже если бы я свалилась с самой крыши,"
      - pl: " nie pisnę ani słowa!”"
        ru: "я бы и не пискнула!»"
      - pl: " (Tu akurat miała chyba całkowitą rację)."
        ru: "(Вот тут она, пожалуй, была совершенно права)."
        note: "mieć rację — быть правым, буквально иметь правоту"
    words: { "pewne": pewien, "locie": lot, "schodów": schody, "wrażenia": wrazenie, "wszyscy": wszyscy, "dachu": dach, "słowa": slowo }
  - clean: "W dół, w dół, w dół. Czy miała tak spadać już zawsze?"
    chunks:
      - pl: "W dół, w dół, w dół."
        ru: "Вниз, вниз, вниз."
        note: "w dół — вниз; троекратный повтор передаёт длительность падения"
      - pl: " Czy miała tak spadać już zawsze?"
        ru: "Неужели она будет падать так всегда?"
    words: { "spadać": spadac }
  - clean: "— Ile kilometrów przeleciałam? — spytała na głos. — Muszę być blisko środka Ziemi. Niech pomyślę… to by oznaczało chyba jakieś sześć i pół tysiąca kilometrów…"
