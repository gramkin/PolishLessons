  - clean: "„Jedno jest pewne!”, pomyślała Alicja. „Po takim locie żaden upadek ze schodów nie zrobi już na mnie wrażenia! W domu wszyscy uznają mnie za niezwykle dzielną! Nawet gdybym spadła z samego czubka dachu, nie pisnę ani słowa!” (Tu akurat miała chyba całkowitą rację)."
    chunks:
      - pl: "„Jedno jest pewne!”, pomyślała Alicja."
        ru: "«Одно несомненно!» — подумала Алиса."
      - pl: "„Po takim locie żaden upadek ze schodów"
        ru: "«После такого полёта никакое падение с лестницы"
      - pl: "nie zrobi już na mnie wrażenia!"
        ru: "уже меня не впечатлит!"
