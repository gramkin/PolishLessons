  - clean: "— Tak, dystans się zgadza… ale ciekawa jestem, na jaką trafiłam długość i szerokość geograficzną. (Alicja nie miała pojęcia, czym jest długość geograficzna, ani też szerokość, lubiła jednak wymawiać te przyjemnie wymyślne słowa)."
    chunks:
      - pl: "— Tak, dystans się zgadza…"
        ru: "— Да, расстояние сходится…"
        note: "zgadzać się — сходиться, совпадать"
      - pl: " ale ciekawa jestem, na jaką trafiłam długość i szerokość geograficzną."
        ru: "но интересно, на какую я попала долготу и широту."
      - pl: " (Alicja nie miała pojęcia, czym jest długość geograficzna, ani też szerokość,"
        ru: "(Алиса понятия не имела, что такое географическая долгота, как и широта,"
        note: "nie mieć pojęcia — не иметь понятия"
      - pl: " lubiła jednak wymawiać te przyjemnie wymyślne słowa)."
        ru: "но ей нравилось произносить эти приятно мудрёные слова)."
    words: { "zgadza": zgadzac, "ciekawa": ciekawy, "trafiłam": trafic, "pojęcia": pojac }
  - clean: "Mówiła dalej:"
    chunks:
      - pl: "Mówiła dalej:"
        ru: "Она продолжала:"
        note: "mówić dalej — продолжать говорить"
  - clean: "— Ciekawe, czy przelecę prosto przez centrum Ziemi! Zabawnie będzie wypaść wśród ludzi chodzących do góry nogami, czyli, zdaje się, Antypatydów… (tym razem ucieszyła się, że nikt jej nie słyszy, bo słowo zabrzmiało jakoś niewłaściwie). — Cóż, będę musiała zapytać ich, jak nazywają swój kraj. „Przepraszam panią bardzo, czy tu jest Nowa Zelandia, czy Australia?” (I spróbowała dygnąć na próbę. Wyobrażacie sobie? Dygnąć podczas spadania! Myślicie, że wam by się udało?) Albo nie! Po takim pytaniu rozmówczyni na pewno uznałaby mnie za durną! To wykluczone! Może wypatrzę gdzieś napis z nazwą kraju."
    chunks:
      - pl: "— Ciekawe, czy przelecę prosto przez centrum Ziemi!"
