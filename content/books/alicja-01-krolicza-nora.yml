  - clean: "Królicza nora przypominała tunel, który przez dłuższy czas prowadził prosto, ale kończył się rozpadliną tak niespodziewanie, że zanim Alicja zdążyła choćby pomyśleć o tym, że mogłaby przystanąć, już leciała w głąb jak gdyby głębokiej studni."
    chunks:
      - pl: "Królicza nora przypominała tunel,"
        ru: "Кроличья нора напоминала туннель,"
      - pl: "który przez dłuższy czas prowadził prosto,"
        ru: "который довольно долго шёл прямо,"
      - pl: "ale kończył się rozpadliną tak niespodziewanie,"
        ru: "но обрывался расщелиной так внезапно,"
      - pl: "że zanim Alicja zdążyła choćby pomyśleć o tym,"
        ru: "что прежде чем Алиса успела хотя бы подумать о том,"
      - pl: "że mogłaby przystanąć,"
        ru: "что можно было бы остановиться,"
      - pl: "już leciała w głąb jak gdyby głębokiej studni."
        ru: "она уже летела вниз, словно в глубокий колодец."
    words: { "przypominała": przypominac, "tunel": tunel, "dłuższy": dlugi, "prowadził": prowadzic, "kończył": konczyc, "niespodziewanie": spodziewac, "leciała": leciec, "głąb": glab, "głębokiej": gleboki }
  - clean: "Albo ta studnia była naprawdę bardzo głęboka, albo Alicja leciała wyjątkowo powoli, miała bowiem mnóstwo czasu, żeby spojrzeć wokół i pomyśleć, co też wydarzy się dalej. Najpierw wytężyła wzrok, żeby zobaczyć, co czeka na nią w dole, panowały tam jednak zbyt gęste ciemności. Potem popatrzyła na ściany i zauważyła, że są wyłożone szafami i półkami na książki; widziała również mapy i obrazy zawieszone na gwoździach. Sięgnęła do jednej z mijanych półek i zdjęła z niej słoik z napisem „Dżem z pomarańczy”. Przeżyła wielkie rozczarowanie, kiedy okazał się pusty, nie chciała go jednak wyrzucić, żeby nie spadł i nie zabił kogoś stojącego poniżej, odłożyła go więc do kolejnej szafy, kiedy akurat przelatywała obok."
    chunks:
      - pl: "Albo ta studnia była naprawdę bardzo głęboka,"
        ru: "Или колодец был и вправду очень глубок,"
      - pl: "albo Alicja leciała wyjątkowo powoli,"
        ru: "или Алиса летела необыкновенно медленно,"
      - pl: "miała bowiem mnóstwo czasu,"
        ru: "ведь времени у неё было предостаточно,"
      - pl: "żeby spojrzeć wokół i pomyśleć,"
        ru: "чтобы оглядеться и подумать,"
      - pl: "co też wydarzy się dalej."
        ru: "что же будет дальше."
      - pl: "Najpierw wytężyła wzrok,"
        ru: "Сначала она вгляделась,"
      - pl: "żeby zobaczyć, co czeka na nią w dole,"
        ru: "чтобы разглядеть, что ждёт её внизу,"
      - pl: "panowały tam jednak zbyt gęste ciemności."
        ru: "но там царила слишком густая тьма."
      - pl: "Potem popatrzyła na ściany i zauważyła,"
        ru: "Потом она посмотрела на стены и заметила,"
      - pl: "że są wyłożone szafami i półkami na książki;"
        ru: "что они уставлены шкафами и книжными полками;"
      - pl: "widziała również mapy i obrazy zawieszone na gwoździach."
        ru: "видела она и карты, и картины, висящие на гвоздях."
      - pl: "Sięgnęła do jednej z mijanych półek"
        ru: "Она потянулась к одной из проплывавших мимо полок"
      - pl: "i zdjęła z niej słoik z napisem „Dżem z pomarańczy”."
        ru: "и сняла с неё банку с надписью «Апельсиновый джем»."
      - pl: "Przeżyła wielkie rozczarowanie, kiedy okazał się pusty,"
        ru: "Её постигло большое разочарование, когда банка оказалась пустой,"
      - pl: "nie chciała go jednak wyrzucić,"
        ru: "но выбросить её она всё же не захотела,"
      - pl: "żeby nie spadł i nie zabił kogoś stojącego poniżej,"
        ru: "чтобы та не упала и не убила кого-нибудь внизу,"
      - pl: "odłożyła go więc do kolejnej szafy,"
