      - pl: "— Ile kilometrów przeleciałam?"
        ru: "— Сколько километров я пролетела?"
      - pl: " — spytała na głos."
        ru: "— спросила она вслух."
        note: "na głos — вслух"
      - pl: " — Muszę być blisko środka Ziemi."
        ru: "— Должно быть, я уже близко к центру Земли."
      - pl: " Niech pomyślę…"
        ru: "Дайте подумать…"
        note: "niech pomyślę — дай-ка подумаю: niech с 1-м лицом"
      - pl: " to by oznaczało chyba jakieś sześć i pół tysiąca kilometrów…"
        ru: "это, пожалуй, тысяч шесть с половиной километров…"
    words: { "kilometrów": kilometr, "głos": glos, "blisko": blisko, "środka": srodek, "Ziemi": ziemia, "oznaczało": oznaczac, "tysiąca": tysiac }
  - clean: "Trzeba wam wiedzieć, że Alicja poznała w szkole wiele podobnych ciekawostek, a choć nie był to najlepszy moment, by popisywać się wiedzą (nikt jej przecież nie słyszał), i tak uznała, że warto powtórzyć poznany materiał."
