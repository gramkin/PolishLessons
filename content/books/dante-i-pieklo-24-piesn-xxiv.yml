chapter: 24
chapterTitle: "Pieśń XXIV"
chapterTitleRu: "Песнь XXIV. Воры и змеи"
level: B2
paragraphs:
  - clean: "(Kręg VIII. Tłumok I. Złodzieje. Fuccio.)"
    chunks:
      - pl: "(Kręg VIII. Tłumok I. Złodzieje. Fuccio.)"
        ru: "(Круг VIII. Ров I. Воры. Фуччи.)"
        note: "у Korsaka опечатка: это седьмой ров; Kręg — опечатка вместо Krąg"
    words: { "Złodzieje": zlodziej }
  - clean: "Gdy słońce w porze młodocianej roku\nPromiennym włosem po Wodniku brodzi\nA noc już dniowi nie narzuca zmroku;\nJeśli ubieli ziemię zamróz ostry,\nUdając barwy swojej białej siostry,\nLecz trwa niedługo i chłód swój łagodzi:\nWieśniak, któremu braknie suchej paszy,\nWidząc wokoło bielące się błonie,\nWraca do domu, załamuje dłonie,\nJak nieszczęśliwy, co widmem się straszy;"
    verse: true
    chunks:
      - pl: "Gdy słońce w porze młodocianej roku"
        ru: "Когда солнце в юную пору года"
        note: "młodociany — юный"
      - pl: "\nPromiennym włosem po Wodniku brodzi"
        ru: "лучистым волосом бродит по Водолею,"
        note: "Wodnik — Водолей; brodzić — бродить"
      - pl: "\nA noc już dniowi nie narzuca zmroku;"
        ru: "а ночь уже не навязывает дню мрака;"
        note: "narzucać — навязывать"
      - pl: "\nJeśli ubieli ziemię zamróz ostry,"
        ru: "если землю побелит острый заморозок,"
        note: "zamróz — устар. «заморозок»"
      - pl: "\nUdając barwy swojej białej siostry,"
        ru: "подражая цвету своей белой сестры,"
        note: "снега"
      - pl: "\nLecz trwa niedługo i chłód swój łagodzi:"
        ru: "но длится недолго и смягчает свой холод:"
      - pl: "\nWieśniak, któremu braknie suchej paszy,"
        ru: "крестьянин, у которого не хватает сухого корма,"
        note: "wieśniak — крестьянин; pasza — корм"
      - pl: "\nWidząc wokoło bielące się błonie,"
        ru: "видя кругом белеющую равнину,"
      - pl: "\nWraca do domu, załamuje dłonie,"
        ru: "возвращается домой, ломает руки,"
        note: "załamywać dłonie — ломать руки"
      - pl: "\nJak nieszczęśliwy, co widmem się straszy;"
        ru: "как несчастный, что пугается призрака;"
    words: { "narzuca": narzucac, "zmroku": zmrok, "suchej": suchy, "nieszczęśliwy": nieszczesliwy, "widmem": widmo, "straszy": straszyc }
  - clean: "Potem wychodzi i pełen nadziei,\nWidząc weselszy świat po śnieżnej wiei,\nPochwyca laskę i na łąk zielenie\nZ obór wesołe swoje trzody żenie —\nPodobnie mistrz mnie przeląkł po niewoli,\nGdym widział jego zachmurzone czoło,\nPodobnie maść on przyłożył, gdzie boli."
    verse: true
    chunks:
      - pl: "Potem wychodzi i pełen nadziei,"
        ru: "потом выходит и, полный надежды,"
      - pl: "\nWidząc weselszy świat po śnieżnej wiei,"
        ru: "видя мир повеселевшим после снежной вьюги,"
        note: "wieja — вьюга"
      - pl: "\nPochwyca laskę i na łąk zielenie"
        ru: "хватает посох и на зелень лугов"
      - pl: "\nZ obór wesołe swoje trzody żenie —"
        ru: "гонит из хлевов свои весёлые стада —"
        note: "obora — хлев; żenie — устар. «гонит»"
      - pl: "\nPodobnie mistrz mnie przeląkł po niewoli,"
        ru: "так и учитель напугал меня поневоле,"
        note: "przeląc — испугать; po niewoli — поневоле"
      - pl: "\nGdym widział jego zachmurzone czoło,"
        ru: "когда я видел его нахмуренное чело,"
      - pl: "\nPodobnie maść on przyłożył, gdzie boli."
        ru: "так же он приложил мазь туда, где болит."
        note: "maść — мазь"
    words: { "weselszy": wesoly, "trzody": trzoda, "Podobnie": podobnie, "czoło": czolo, "maść": masc, "przyłożył": przylozyc }
  - clean: "Gdy nad strzaskaną przyszliśmy arkadę,\nOn patrzał na mnie słodko i wesoło\nJak u stóp góry; sam z sobą wszedł w radę\ni opatrzywszy skałę z każdej strony,\nMnie otwartymi pochwycił ramiony.\nJak ten, co pracę poczyna z baczeniem,\nWpierw, co ma zrobić, rozważa myśleniem,\nTak on, podnosząc mnie na wierzch opoki,\nWskazywał palcem drugi głaz wysoki\nI mówił: Trzymaj dłonie w pogotowiu,\nObejmij głaz ten, lecz wprzódy oczyma\nRozpatruj pilno, czy twój ciężar strzyma»."
    verse: true
    chunks:
      - pl: "Gdy nad strzaskaną przyszliśmy arkadę,"
        ru: "Когда мы пришли к разбитой арке,"
      - pl: "\nOn patrzał na mnie słodko i wesoło"
        ru: "он смотрел на меня ласково и весело,"
      - pl: "\nJak u stóp góry; sam z sobą wszedł w radę"
        ru: "как у подножия горы; сам с собой посоветовался"
        note: "wejść w radę — посоветоваться"
      - pl: "\ni opatrzywszy skałę z każdej strony,"
        ru: "и, осмотрев скалу со всех сторон,"
        note: "opatrzyć — осмотреть"
      - pl: "\nMnie otwartymi pochwycił ramiony."
        ru: "подхватил меня раскрытыми руками."
      - pl: "\nJak ten, co pracę poczyna z baczeniem,"
        ru: "Как тот, кто начинает работу осмотрительно,"
      - pl: "\nWpierw, co ma zrobić, rozważa myśleniem,"
        ru: "сперва обдумывает, что ему делать,"
      - pl: "\nTak on, podnosząc mnie na wierzch opoki,"
        ru: "так он, поднимая меня на вершину скалы,"
      - pl: "\nWskazywał palcem drugi głaz wysoki"
        ru: "указывал пальцем на другой высокий камень"
      - pl: "\nI mówił: Trzymaj dłonie w pogotowiu,"
        ru: "и говорил: «Держи руки наготове,"
        note: "w pogotowiu — наготове"
      - pl: "\nObejmij głaz ten, lecz wprzódy oczyma"
        ru: "обхвати этот камень, но прежде глазами"
      - pl: "\nRozpatruj pilno, czy twój ciężar strzyma»."
        ru: "рассмотри пристально, выдержит ли он твою тяжесть»."
        note: "strzyma — устар. «выдержит»"
    words: { "Wpierw": wpierw, "pogotowiu": pogotowie, "Obejmij": objac, "wprzódy": wprzody, "pilno": pilno, "ciężar": ciezar }
  - clean: "Jak się wpatrzyłem, nie była to droga\nDla tych, co noszą kapice z ołowiu;\nBo ja i wódz mój, tak lekki Wirgili,\nLedwośmy z głazów na głazy kroczyli;\nGdyby nie krótsza ścieżka między skałą,\nSam nie wiem, co by z mym wodzem się stało,\nMnie by pokonał trud, a w końcu trwoga."
    verse: true
    chunks:
      - pl: "Jak się wpatrzyłem, nie była to droga"
        ru: "Как я вгляделся, это была не дорога"
      - pl: "\nDla tych, co noszą kapice z ołowiu;"
        ru: "для тех, кто носит плащи из свинца;"
      - pl: "\nBo ja i wódz mój, tak lekki Wirgili,"
        ru: "ибо я и мой вождь, столь лёгкий Вергилий,"
      - pl: "\nLedwośmy z głazów na głazy kroczyli;"
        ru: "едва шагали с камня на камень;"
      - pl: "\nGdyby nie krótsza ścieżka między skałą,"
        ru: "если бы не более короткая тропа среди скал,"
      - pl: "\nSam nie wiem, co by z mym wodzem się stało,"
        ru: "сам не знаю, что сталось бы с моим вождём,"
      - pl: "\nMnie by pokonał trud, a w końcu trwoga."
        ru: "меня одолел бы труд, а в конце — страх."
    words: { "wódz": wodz, "lekki": lekki, "krótsza": krotki, "ścieżka": sciezka, "skałą": skala, "trud": trud }
  - clean: "Lecz jako skały zwane Złe Tłumoki\nPochyło schodzą w zrąb studni głębokiej,\nKażda dolina, którą się przebiega,\nTu ma wyniosłość, tam spadzistość brzega.\nW końcuśmy doszli do progu opoki,\nGdzie głaz ostatni czołem prostopadłem\nW dół się powalił i w otchłań się rzuca:\nJuż mi zabrakło oddechu na płuca,\nJuż iść nie mogłem dalej i usiadłem."
    verse: true
    chunks:
      - pl: "Lecz jako skały zwane Złe Tłumoki"
        ru: "Но так как скалы, зовомые Злыми Щелями,"
      - pl: "\nPochyło schodzą w zrąb studni głębokiej,"
        ru: "покато спускаются к краю глубокого колодца,"
      - pl: "\nKażda dolina, którą się przebiega,"
        ru: "каждая долина, которую пробегаешь,"
        note: "przebiegać — пробегать"
      - pl: "\nTu ma wyniosłość, tam spadzistość brzega."
        ru: "здесь имеет возвышение, там — крутизну берега."
        note: "wyniosłość — возвышение; spadzistość — крутизна"
      - pl: "\nW końcuśmy doszli do progu opoki,"
        ru: "Наконец мы дошли до порога скалы,"
      - pl: "\nGdzie głaz ostatni czołem prostopadłem"
        ru: "где последний камень отвесным челом"
      - pl: "\nW dół się powalił i w otchłań się rzuca:"
        ru: "обрушился вниз и бросается в бездну:"
      - pl: "\nJuż mi zabrakło oddechu na płuca,"
        ru: "мне уже не хватало дыхания в лёгких,"
        note: "płuca — лёгкие"
      - pl: "\nJuż iść nie mogłem dalej i usiadłem."
        ru: "я уже не мог идти дальше и сел."
    words: { "schodzą": schodzic, "studni": studnia, "dolina": dolina, "progu": prog, "zabrakło": zabraknac, "płuca": pluco }
  - clean: "«Z wady lenistwa wyzuj się w tej dobie!»\nMistrz mówił, «w puchu lub w pierzu kto lega,\nTemu do sławy za daleka droga;\nA kto na ziemi po krótkim przechodzie\nBez wieńca sławy położy się w grobie,\nTen tyle śladu zostawi po sobie,\nCo dym w powietrzu, co bańka na wodzie."
    verse: true
    chunks:
      - pl: "«Z wady lenistwa wyzuj się w tej dobie!»"
        ru: "«Сбрось с себя порок лени в эту пору! —"
        note: "wyzuć się — сбросить, освободиться; doba — пора"
      - pl: "\nMistrz mówił, «w puchu lub w pierzu kto lega,"
        ru: "сказал учитель, — кто ложится в пух или в перья,"
      - pl: "\nTemu do sławy za daleka droga;"
        ru: "тому до славы слишком далёкая дорога;"
      - pl: "\nA kto na ziemi po krótkim przechodzie"
        ru: "а кто на земле после краткого перехода"
      - pl: "\nBez wieńca sławy położy się w grobie,"
        ru: "без венка славы ляжет в могилу,"
      - pl: "\nTen tyle śladu zostawi po sobie,"
        ru: "тот столько следа оставит после себя,"
      - pl: "\nCo dym w powietrzu, co bańka na wodzie."
        ru: "сколько дым в воздухе, сколько пузырь на воде."
    words: { "wady": wada, "dobie": doba, "Mistrz": mistrz, "sławy": slawa, "grobie": grob, "powietrzu": powietrze }
  - clean: "Wstań, wolą ducha trud pokonasz snadnie,\nDuch w każdej walce tryumfator wroga,\nGdy pod ciężarem ciała nie upadnie.\nMamy do przejścia jeszcze dłuższe wschody,\nNie dosyć przebyć skał tych wysep nagi,\nNiech ta uwaga doda ci odwagi»."
    verse: true
    chunks:
      - pl: "Wstań, wolą ducha trud pokonasz snadnie,"
        ru: "Встань: волей духа ты легко одолеешь труд,"
      - pl: "\nDuch w każdej walce tryumfator wroga,"
        ru: "дух в каждой битве — победитель врага,"
        note: "tryumfator — триумфатор"
      - pl: "\nGdy pod ciężarem ciała nie upadnie."
        ru: "если не падёт под тяжестью тела."
      - pl: "\nMamy do przejścia jeszcze dłuższe wschody,"
        ru: "Нам предстоит пройти ещё более длинную лестницу,"
        note: "wschody — устар. «лестница»"
      - pl: "\nNie dosyć przebyć skał tych wysep nagi,"
        ru: "недостаточно преодолеть эти голые острова скал,"
        note: "то есть мало уйти отсюда"
      - pl: "\nNiech ta uwaga doda ci odwagi»."
        ru: "пусть это замечание прибавит тебе отваги»."
    words: { "Wstań": wstac, "upadnie": upasc, "przebyć": przebyc, "nagi": nagi, "doda": dodac, "odwagi": odwaga }
  - clean: "Wstałem z uczuciem rzeźwiącej ochłody,\nA piersi moje swobodniej dyszały,\nMówiąc: «Idź dalej, jam krzepki i śmiały!»\nSzliśmy, a głazy przed nami, pod nami,\nCoraz wyższymi sterczały garbami,\nSzedłem bez przerwy gwarząc to i owo,\nMocując wolę z słabymi siłami,\nGdy z drugiej fosy głos przemówił słowo."
    verse: true
    chunks:
      - pl: "Wstałem z uczuciem rzeźwiącej ochłody,"
        ru: "Я встал с чувством освежающей прохлады,"
        note: "ochłoda — прохлада"
      - pl: "\nA piersi moje swobodniej dyszały,"
        ru: "и грудь моя дышала свободнее,"
      - pl: "\nMówiąc: «Idź dalej, jam krzepki i śmiały!»"
        ru: "говоря: «Иди дальше, я крепок и смел!»"
      - pl: "\nSzliśmy, a głazy przed nami, pod nami,"
        ru: "Мы шли, а камни перед нами, под нами"
      - pl: "\nCoraz wyższymi sterczały garbami,"
        ru: "торчали всё более высокими горбами,"
      - pl: "\nSzedłem bez przerwy gwarząc to i owo,"
        ru: "я шёл без перерыва, болтая о том о сём,"
        note: "to i owo — то да сё"
      - pl: "\nMocując wolę z słabymi siłami,"
        ru: "борясь волей со слабыми силами,"
        note: "mocować — бороться, мериться"
      - pl: "\nGdy z drugiej fosy głos przemówił słowo."
        ru: "когда из следующего рва голос произнёс слово."
    words: { "piersi": piers, "swobodniej": swobodnie, "Coraz": coraz, "przerwy": przerwa, "głos": glos, "przemówił": przemowic }
  - clean: "Co mówił, nie wiem, choć byłem na szczycie\nArkady mostu, co w poprzek otchłani\nSklepiać swe łuki zawisła tam na niej.\nGłos mówiącego zdradzał gniew nieskrycie,\nJam wzrok w dół spuścił, ale żywe oko\nDna nie dościgło przez ciemność głęboką."
    verse: true
    chunks:
      - pl: "Co mówił, nie wiem, choć byłem na szczycie"
        ru: "Что он говорил, не знаю, хоть я был на вершине"
      - pl: "\nArkady mostu, co w poprzek otchłani"
        ru: "арки моста, что поперёк бездны"
      - pl: "\nSklepiać swe łuki zawisła tam na niej."
        ru: "повисла там над ней, выгибая свои своды."
        note: "sklepiać — сводить, выгибать сводом"
      - pl: "\nGłos mówiącego zdradzał gniew nieskrycie,"
        ru: "Голос говорящего неприкрыто выдавал гнев,"
      - pl: "\nJam wzrok w dół spuścił, ale żywe oko"
        ru: "я опустил взгляд вниз, но живой глаз"
      - pl: "\nDna nie dościgło przez ciemność głęboką."
        ru: "не достал дна сквозь глубокую тьму."
        note: "doścignąć — достичь"
    words: { "łuki": luk, "zdradzał": zdradzac, "gniew": gniew, "wzrok": wzrok, "spuścił": spuscic, "ciemność": ciemnosc }
  - clean: "«Mistrzu!» tak rzekłem po chwili niedługiej,\n«Przechodźmy most ten, zstępujmy w krąg drugi.\nBo stąd ja słyszę, a nic nie rozumiem,\nWidzę, nic jednak rozpoznać nie umiem».\nA mistrz: «Zadosyć słusznemu życzeniu,\nJako przystoi, odpowiem w milczeniu»."
    verse: true
    chunks:
      - pl: "«Mistrzu!» tak rzekłem po chwili niedługiej,"
        ru: "«Учитель! — так сказал я после недолгой минуты, —"
      - pl: "\n«Przechodźmy most ten, zstępujmy w krąg drugi."
        ru: "пройдём этот мост, спустимся в следующий круг,"
      - pl: "\nBo stąd ja słyszę, a nic nie rozumiem,"
        ru: "ибо отсюда я слышу, а ничего не понимаю,"
      - pl: "\nWidzę, nic jednak rozpoznać nie umiem»."
        ru: "вижу, однако ничего различить не умею»."
      - pl: "\nA mistrz: «Zadosyć słusznemu życzeniu,"
        ru: "А учитель: «Справедливому желанию — удовлетворение,"
        note: "zadosyć — удовлетворение"
      - pl: "\nJako przystoi, odpowiem w milczeniu»."
        ru: "как подобает, я отвечу молча»."
    words: { "rzekłem": rzec, "Przechodźmy": przechodzic, "most": most, "krąg": krag, "rozpoznać": rozpoznac, "słusznemu": sluszny }
  - clean: "I wnet przeszliśmy łuk mostu ten samy,\nKtóry przytyka aż do ósmej tamy;\nWtenczas ujrzałem cały otwór jamy\nDno jej zapełnia żmija, wąż, gadzina,\nGdy wspomnę, jeszcze krew się we mnie ścina!\nLibijskie piaski nad brzegiem swych stoków\nNie rodzą tyle płazów, hyder, smoków,\nKraj ponad Morzem Czerwonym nie roni\nTyle zabójczych pomorów i jadów."
    verse: true
    chunks:
      - pl: "I wnet przeszliśmy łuk mostu ten samy,"
        ru: "И тотчас мы прошли ту же арку моста,"
      - pl: "\nKtóry przytyka aż do ósmej tamy;"
        ru: "что примыкает к самой восьмой плотине;"
        note: "przytykać — примыкать"
      - pl: "\nWtenczas ujrzałem cały otwór jamy"
        ru: "тогда я увидел весь проём ямы:"
      - pl: "\nDno jej zapełnia żmija, wąż, gadzina,"
        ru: "дно её наполняет гадюка, змей, гадина,"
      - pl: "\nGdy wspomnę, jeszcze krew się we mnie ścina!"
        ru: "когда вспомню, ещё кровь во мне стынет!"
        note: "ścinać się — стынуть, свёртываться"
      - pl: "\nLibijskie piaski nad brzegiem swych stoków"
        ru: "Ливийские пески у подножия своих склонов"
      - pl: "\nNie rodzą tyle płazów, hyder, smoków,"
        ru: "не родят столько гадов, гидр, драконов,"
        note: "płaz — гад, пресмыкающееся"
      - pl: "\nKraj ponad Morzem Czerwonym nie roni"
        ru: "земля над Красным морем не роняет"
        note: "ronić — ронить"
      - pl: "\nTyle zabójczych pomorów i jadów."
