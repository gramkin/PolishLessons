# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 26
chapterTitle: "Pieśń XXVI"
chapterTitleRu: "Песнь XXVI. Гвиницелли и Арнаут"
level: B2
paragraphs:
  - clean: "(Krąg VII. Wieczór. Poeci prowansalscy.)"
    chunks:
      - pl: "(Krąg VII. Wieczór. Poeci prowansalscy.)"
        ru: "(Круг VII. Вечер. Провансальские поэты.)"
    words: { "Krąg": krag, "Wieczór": wieczor, "Poeci": poeta }
  - clean: "Jeden za drugim gdy szliśmy w krąg skały,\nMistrz dobry mówił często na pół z trwogą:\n«Strzeż się, ostrożnym bądź moją przestrogą».\nSłońce padało mi na prawe ramię,\nOpromieniony słońcem zachód cały\nBłękit swój zmienił w jeden obłok biały."
    verse: true
    chunks:
      - pl: "Jeden za drugim gdy szliśmy w krąg skały,"
        ru: "Когда мы шли один за другим по кругу скалы,"
      - pl: "\nMistrz dobry mówił często na pół z trwogą:"
        ru: "добрый учитель часто говорил полуиспуганно:"
      - pl: "\n«Strzeż się, ostrożnym bądź moją przestrogą»."
        ru: "«Берегись, будь осторожен по моему предостережению»."
      - pl: "\nSłońce padało mi na prawe ramię,"
        ru: "Солнце падало мне на правое плечо,"
      - pl: "\nOpromieniony słońcem zachód cały"
        ru: "весь запад, озарённый солнцем,"
        note: "opromieniony — озарённый"
      - pl: "\nBłękit swój zmienił w jeden obłok biały."
        ru: "сменил свою синеву на одно белое облако."
    words: { "skały": skala, "Strzeż": strzec, "ostrożnym": ostrozny, "padało": padac, "ramię": ramie, "zachód": zachod }
  - clean: "Tłum dusz idących widząc, że się łamie\nOd mego cienia blask więcej czerwony,\nNa to zjawisko poglądał zdziwiony.\nI o mnie z tego powodu mówiły.\nW kolej duch ducha pytał na przemianę:\n«Ten cień ma, zda się, ciało nieudane?»"
    verse: true
    chunks:
      - pl: "Tłum dusz idących widząc, że się łamie"
        ru: "Толпа идущих душ, видя, что от моей тени"
      - pl: "\nOd mego cienia blask więcej czerwony,"
        ru: "блеск преломляется более красным,"
        note: "пламя краснее там, где тень"
      - pl: "\nNa to zjawisko poglądał zdziwiony."
        ru: "смотрела на это явление удивлённо."
      - pl: "\nI o mnie z tego powodu mówiły."
        ru: "И из-за этого говорили обо мне."
      - pl: "\nW kolej duch ducha pytał na przemianę:"
        ru: "По очереди дух спрашивал духа:"
      - pl: "\n«Ten cień ma, zda się, ciało nieudane?»"
        ru: "«У этой тени, кажется, не призрачное тело?»"
        note: "nieudany — здесь «не мнимый»"
    words: { "łamie": lamac, "cienia": cien, "blask": blask, "czerwony": czerwony, "kolej": kolej, "duch": duch }
  - clean: "Sprawdziwszy domysł, do mnie się zbliżyły,\nStrzegąc się jednak, by nie zejść tak w stronę,\nGdzie by nie mogły być ogniem palone.\n«O ty za dwoma idący na końcu,\nNie przez lenistwo, może przez pokorę,\nMów, bo pragnieniem i ogniem ja gorę."
    verse: true
    chunks:
      - pl: "Sprawdziwszy domysł, do mnie się zbliżyły,"
        ru: "Проверив догадку, они приблизились ко мне,"
      - pl: "\nStrzegąc się jednak, by nie zejść tak w stronę,"
        ru: "остерегаясь, однако, сойти в ту сторону,"
      - pl: "\nGdzie by nie mogły być ogniem palone."
        ru: "где их не мог бы жечь огонь."
      - pl: "\n«O ty za dwoma idący na końcu,"
        ru: "«О ты, идущий за двумя последним,"
      - pl: "\nNie przez lenistwo, może przez pokorę,"
        ru: "не от лени, может быть, от смирения,"
      - pl: "\nMów, bo pragnieniem i ogniem ja gorę."
        ru: "скажи, ибо я горю жаждой и огнём."
    words: { "Sprawdziwszy": sprawdzic, "zbliżyły": zblizyc, "zejść": zejsc, "ogniem": ogien, "palone": palic, "pragnieniem": pragnienie }
  - clean: "Twych słów pragniemy całą naszą trzodą,\nArab nie tęskni tak za chłodną wodą.\nMów, jak twym ciałem robisz mur ku słońcu,\nŻe promień jego skroś ciebie nie wierci,\nJak gdybyś jeszcze nie wstąpił w sieć śmierci?»\nJeden duch do mnie tak przemówić raczył."
    verse: true
    chunks:
      - pl: "Twych słów pragniemy całą naszą trzodą,"
        ru: "Твоих слов жаждем мы всем нашим стадом,"
      - pl: "\nArab nie tęskni tak za chłodną wodą."
        ru: "араб так не тоскует по холодной воде."
      - pl: "\nMów, jak twym ciałem robisz mur ku słońcu,"
        ru: "Скажи, как ты делаешь своим телом стену солнцу,"
      - pl: "\nŻe promień jego skroś ciebie nie wierci,"
        ru: "что его луч не сверлит тебя насквозь,"
      - pl: "\nJak gdybyś jeszcze nie wstąpił w sieć śmierci?»"
        ru: "будто ты ещё не вступил в сеть смерти?»"
      - pl: "\nJeden duch do mnie tak przemówić raczył."
        ru: "Так соизволил заговорить со мной один дух."
    words: { "trzodą": trzoda, "chłodną": chlodny, "promień": promien, "wstąpił": wstapic, "sieć": siec, "przemówić": przemowic }
  - clean: "Ja bym się przed nim jasno wytłumaczył,\nGdyby mię nowy przedmiot nie zahaczył.\nŚrodkiem zajętej drogi przez płomienie\nSzły drugie, pierwsze wymijając, cienie,\nCo mię wtrąciło w podziw i zwątpienie.\nI ci, i owi gdy się spotykali,\nPrzechodząc mimo wzajem się ściskali,\nUweseleni z krótkiego uścisku."
    verse: true
    chunks:
      - pl: "Ja bym się przed nim jasno wytłumaczył,"
        ru: "Я бы ясно объяснился перед ним,"
      - pl: "\nGdyby mię nowy przedmiot nie zahaczył."
        ru: "если бы меня не зацепил новый предмет."
      - pl: "\nŚrodkiem zajętej drogi przez płomienie"
        ru: "Посреди дороги, занятой пламенем,"
      - pl: "\nSzły drugie, pierwsze wymijając, cienie,"
        ru: "шли другие тени, минуя первых,"
        note: "wymijać — обходить"
      - pl: "\nCo mię wtrąciło w podziw i zwątpienie."
        ru: "что повергло меня в изумление и сомнение."
      - pl: "\nI ci, i owi gdy się spotykali,"
        ru: "И те, и эти, когда встречались,"
      - pl: "\nPrzechodząc mimo wzajem się ściskali,"
        ru: "проходя мимо, обнимали друг друга,"
      - pl: "\nUweseleni z krótkiego uścisku."
        ru: "развеселённые коротким объятием."
    words: { "wytłumaczył": wytlumaczyc, "przedmiot": przedmiot, "zahaczył": zahaczyc, "płomienie": plomien, "wtrąciło": wtracic, "uścisku": uscisk }
  - clean: "Tak mrówek czarne roty na mrowisku\nGdy się spotkają, stykając nos z nosem,\nSnadź sobie wzajem zadają pytania,\nO swoich łupach, drogach między wrzosem.\nCienie te kończąc czułe powitania,\nKażdy nim odszedł i biegł, ile zdołał,\nKażdy na przemian wniebogłosy wołał:\nJeden: «Sodoma, Gomora!» wykrzyka,\nA drugi woła: «Pazyfae w skórę\nWstąpiła ciołki i jak bydlę gore\nLubieżną żądzą, drażniąc upał byka."
    verse: true
    chunks:
      - pl: "Tak mrówek czarne roty na mrowisku"
        ru: "Так чёрные отряды муравьёв на муравейнике,"
        note: "mrowisko — муравейник"
      - pl: "\nGdy się spotkają, stykając nos z nosem,"
        ru: "когда встретятся, касаясь носом носа,"
      - pl: "\nSnadź sobie wzajem zadają pytania,"
        ru: "видно, задают друг другу вопросы"
      - pl: "\nO swoich łupach, drogach między wrzosem."
        ru: "о своей добыче, о дорогах среди вереска."
        note: "wrzos — вереск"
      - pl: "\nCienie te kończąc czułe powitania,"
        ru: "Эти тени, окончив нежные приветствия,"
      - pl: "\nKażdy nim odszedł i biegł, ile zdołał,"
        ru: "каждый, прежде чем уйти и бежать, сколько мог,"
      - pl: "\nKażdy na przemian wniebogłosy wołał:"
        ru: "каждый попеременно кричал во весь голос:"
        note: "wniebogłosy — во весь голос"
      - pl: "\nJeden: «Sodoma, Gomora!» wykrzyka,"
        ru: "одни: «Содом, Гоморра!» — восклицают,"
      - pl: "\nA drugi woła: «Pazyfae w skórę"
        ru: "а другие кричат: «Пасифая в шкуру"
      - pl: "\nWstąpiła ciołki i jak bydlę gore"
        ru: "вошла тёлки и, как скотина, горит"
        note: "ciołka — тёлка"
      - pl: "\nLubieżną żądzą, drażniąc upał byka."
        ru: "похотливым желанием, дразня жар быка»."
        note: "lubieżny — похотливый"
    words: { "zadają": zadawac, "biegł": biec, "zdołał": zdolac, "wołał": wolac, "skórę": skora, "byka": byk }
  - clean: "A jak lecące naprzeciw żurawie,\nJedne w kraj piasków, drugie w góry lodu,\nJedne z bojaźni słońca, drugie chłodu,\nMijają siebie w nadpowietrznej wrzawie;\nPodobnie w ogniu obie duchów trzody,\nSzły, odchodziły ciągłymi przechody,\nA każda płacząc, swoją piosnkę śpiewa\nZnów pierwsze duchy słuchać mię gotowe,\nPodeszły do mnie zawiązać rozmowę."
    verse: true
    chunks:
      - pl: "A jak lecące naprzeciw żurawie,"
        ru: "И как журавли, летящие навстречу друг другу,"
        note: "żuraw — журавль"
      - pl: "\nJedne w kraj piasków, drugie w góry lodu,"
        ru: "одни — в страну песков, другие — в ледяные горы,"
      - pl: "\nJedne z bojaźni słońca, drugie chłodu,"
        ru: "одни — боясь солнца, другие — холода,"
      - pl: "\nMijają siebie w nadpowietrznej wrzawie;"
        ru: "минуют друг друга в поднебесном шуме;"
      - pl: "\nPodobnie w ogniu obie duchów trzody,"
        ru: "так в огне обе стаи духов"
      - pl: "\nSzły, odchodziły ciągłymi przechody,"
        ru: "шли, уходили непрестанными переходами,"
      - pl: "\nA każda płacząc, swoją piosnkę śpiewa"
        ru: "и каждая, плача, поёт свою песенку."
      - pl: "\nZnów pierwsze duchy słuchać mię gotowe,"
        ru: "Снова первые духи, готовые меня слушать,"
      - pl: "\nPodeszły do mnie zawiązać rozmowę."
        ru: "подошли ко мне завязать разговор."
    words: { "piasków": piasek, "Mijają": mijac, "Podobnie": podobnie, "odchodziły": odchodzic, "ciągłymi": ciagly, "śpiewa": spiewac }
  - clean: "Widząc, jak pragną słów moich napoju,\nMówiłem: «Duchy, z których się spodziewa\nKażdy dojść kiedyś do źródła pokoju,\nAni zielone, ni jeszcze przejrzałe,\nJako widzicie, członki moje całe\nTu noszę z sobą, z krwią i kością całą."
    verse: true
    chunks:
      - pl: "Widząc, jak pragną słów moich napoju,"
        ru: "Видя, как они жаждут питья моих слов,"
      - pl: "\nMówiłem: «Duchy, z których się spodziewa"
        ru: "я сказал: «Духи, из которых каждый надеется"
      - pl: "\nKażdy dojść kiedyś do źródła pokoju,"
        ru: "когда-нибудь дойти до источника мира,"
      - pl: "\nAni zielone, ni jeszcze przejrzałe,"
        ru: "ни зелёными, ни ещё перезрелыми,"
        note: "przejrzały — перезрелый"
      - pl: "\nJako widzicie, członki moje całe"
        ru: "как видите, все мои члены"
      - pl: "\nTu noszę z sobą, z krwią i kością całą."
        ru: "я ношу здесь с собой, с кровью и всеми костями."
    words: { "pragną": pragnac, "napoju": napoj, "spodziewa": spodziewac, "dojść": dojsc, "źródła": zrodlo, "kością": kosc }
  - clean: "Idę tam wyżej, by przestać być ślepym;\nTam czeka na mnie łaskawa niewiasta,\nŁaską jej idę do bożego miasta.\nOto dlatego w świecie waszym śmiało\nWlokę na sobie to śmiertelne ciało.\nNajwiększą z żądz swych ukójcie w radości,\nOby was niebo pod swym wielkim sklepem,\nBez dna i brzegów, a pełne miłości,\nRaczyło przyjąć za swych wiecznych gości!"
    verse: true
    chunks:
      - pl: "Idę tam wyżej, by przestać być ślepym;"
        ru: "Я иду туда, выше, чтобы перестать быть слепым;"
      - pl: "\nTam czeka na mnie łaskawa niewiasta,"
        ru: "там ждёт меня милостивая жена,"
      - pl: "\nŁaską jej idę do bożego miasta."
        ru: "по её милости я иду к граду Божьему."
      - pl: "\nOto dlatego w świecie waszym śmiało"
        ru: "Вот почему в вашем мире я смело"
      - pl: "\nWlokę na sobie to śmiertelne ciało."
        ru: "волочу на себе это смертное тело."
      - pl: "\nNajwiększą z żądz swych ukójcie w radości,"
        ru: "Утолите в радости величайшее из своих желаний,"
      - pl: "\nOby was niebo pod swym wielkim sklepem,"
        ru: "о, если бы небо под своим великим сводом,"
        note: "sklep — свод"
      - pl: "\nBez dna i brzegów, a pełne miłości,"
        ru: "без дна и берегов и полное любви,"
      - pl: "\nRaczyło przyjąć za swych wiecznych gości!"
        ru: "соизволило принять вас как своих вечных гостей!"
    words: { "niewiasta": niewiasta, "bożego": bozy, "śmiertelne": smiertelny, "radości": radosc, "brzegów": brzeg, "wiecznych": wieczny }
  - clean: "Lecz mi powiedzcie sami, kto jesteście,\nI ci, co idą za wami w płomieniu,\nBym was mógł jeszcze spisać po imieniu».\nGóral raz pierwszy będąc w wielkim mieście,\nBłądzi jak zwierzę wypłoszone z boru;\nNie tak się wielkim zdziwieniem zapala\nNa widok miasta dziki wzrok górala,\nJako te duchy, sądząc z ich pozoru."
    verse: true
    chunks:
      - pl: "Lecz mi powiedzcie sami, kto jesteście,"
        ru: "Но скажите мне сами, кто вы"
      - pl: "\nI ci, co idą za wami w płomieniu,"
        ru: "и те, что идут за вами в пламени,"
      - pl: "\nBym was mógł jeszcze spisać po imieniu»."
        ru: "чтобы я мог ещё записать вас по имени»."
      - pl: "\nGóral raz pierwszy będąc w wielkim mieście,"
        ru: "Горец, впервые оказавшись в большом городе,"
        note: "góral — горец"
      - pl: "\nBłądzi jak zwierzę wypłoszone z boru;"
        ru: "блуждает, как зверь, вспугнутый из бора;"
      - pl: "\nNie tak się wielkim zdziwieniem zapala"
        ru: "не так великим изумлением загорается"
      - pl: "\nNa widok miasta dziki wzrok górala,"
        ru: "при виде города дикий взгляд горца,"
      - pl: "\nJako te duchy, sądząc z ich pozoru."
        ru: "как эти духи, судя по их виду."
    words: { "spisać": spisac, "mieście": miasto, "zwierzę": zwierze, "widok": widok, "wzrok": wzrok, "pozoru": pozor }
  - clean: "Lecz kiedy z trwogi ochłonęły swojej,\nKtóra się szybko w wyższych sercach koi,\nTak odpowiedział znajomy głos cienia:\n«Błogo ci, jeśli na korzyść sumienia\nPrzychodzisz do nas szukać doświadczenia.\nDuchy, co przeszły w naglonym pośpiechu,\nCzyszczą w tym ogniu skazę tego grzechu,\nZa który Cezar szydną Gallów mową\nWśród swych tryumfów zwany był: *Królową*."
    verse: true
    chunks:
      - pl: "Lecz kiedy z trwogi ochłonęły swojej,"
        ru: "Но когда они опомнились от своего страха,"
      - pl: "\nKtóra się szybko w wyższych sercach koi,"
        ru: "что быстро утихает в возвышенных сердцах,"
      - pl: "\nTak odpowiedział znajomy głos cienia:"
        ru: "так ответил знакомый голос тени:"
      - pl: "\n«Błogo ci, jeśli na korzyść sumienia"
        ru: "«Благо тебе, если на пользу совести"
      - pl: "\nPrzychodzisz do nas szukać doświadczenia."
        ru: "ты приходишь к нам за опытом."
      - pl: "\nDuchy, co przeszły w naglonym pośpiechu,"
        ru: "Духи, что прошли в торопливой спешке,"
        note: "naglony — торопимый"
      - pl: "\nCzyszczą w tym ogniu skazę tego grzechu,"
        ru: "очищают в этом огне пятно того греха,"
      - pl: "\nZa który Cezar szydną Gallów mową"
        ru: "за который Цезаря насмешливой речью галлов"
      - pl: "\nWśród swych tryumfów zwany był: *Królową*."
        ru: "среди его триумфов звали «Царицей»."
    words: { "korzyść": korzysc, "sumienia": sumienie, "pośpiechu": pospiech, "Czyszczą": czyscic, "grzechu": grzech, "tryumfów": tryumf }
  - clean: "Krzycząc: »Sodoma!« czerwienią swe lica,\nA ich wstyd siłę płomienia podsyca.\nNasz grzech podwójny był przeciw naturze;\nLecz żeśmy wstydu potargawszy pęta,\nSzli za krewkością żądzy jak zwierzęta,\nNa hańbę naszą, kiedy się tu znidą\nNasze dwie trzody, tej imię wzywamy,\nCo się bydlęciem stała w jego skórze."
    verse: true
    chunks:
      - pl: "Krzycząc: »Sodoma!« czerwienią swe lica,"
        ru: "Крича: „Содом!“ — они краснеют лицом,"
      - pl: "\nA ich wstyd siłę płomienia podsyca."
        ru: "а их стыд подпитывает силу пламени."
        note: "podsycać — подпитывать"
      - pl: "\nNasz grzech podwójny był przeciw naturze;"
        ru: "Наш грех был двуполым, против природы;"
        note: "podwójny — здесь «двуполый»"
      - pl: "\nLecz żeśmy wstydu potargawszy pęta,"
        ru: "но так как мы, разорвав путы стыда,"
      - pl: "\nSzli za krewkością żądzy jak zwierzęta,"
        ru: "шли за пылом желания, как звери,"
      - pl: "\nNa hańbę naszą, kiedy się tu znidą"
        ru: "к нашему позору, когда здесь сходятся"
      - pl: "\nNasze dwie trzody, tej imię wzywamy,"
        ru: "наши два стада, мы призываем имя той,"
      - pl: "\nCo się bydlęciem stała w jego skórze."
        ru: "что стала скотиной в его шкуре."
