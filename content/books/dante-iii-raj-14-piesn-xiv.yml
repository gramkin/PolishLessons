    words: { "przemianie": przemiana, "Kręgi": krag, "Święci": swiety, "boży": bozy, "tworzą": tworzyc, "krzyż": krzyz }
  - clean: "Ze środka na wierzch jak jest krągła czasza,\nTo z wierzchu w środek woda się unosi,\nPodług nacisku, jaki w czaszy spotka,\nOd swej powierzchni lub ze swego środka,\nCo mówię, czułem to w duchu najściślej\nW chwili, gdy dusza zamilkła Tomasza,\nPrzez podobieństwo jasne jak z krynicy\nWynikłe z jego słów i Beatrycy,\nGdy po Tomaszu tak mówić raczyła:\n«On potrzebuje, choć w głosie i w myśli\nJeszcze się jego żądza nie zdradziła,\nTreść drugiej prawdy zbadać aż do rdzeni."
    verse: true
    chunks:
      - pl: "Ze środka na wierzch jak jest krągła czasza,"
        ru: "Как в круглой чаше вода колеблется"
      - pl: "\nTo z wierzchu w środek woda się unosi,"
        ru: "то от середины к краю, то от края к середине,"
      - pl: "\nPodług nacisku, jaki w czaszy spotka,"
        ru: "смотря по толчку, какой она встретит в чаше,"
      - pl: "\nOd swej powierzchni lub ze swego środka,"
        ru: "от своей поверхности или из своей середины,"
      - pl: "\nCo mówię, czułem to w duchu najściślej"
        ru: "то, что говорю, я ощутил в духе как нельзя ясней"
      - pl: "\nW chwili, gdy dusza zamilkła Tomasza,"
        ru: "в тот миг, когда умолкла душа Фомы,"
      - pl: "\nPrzez podobieństwo jasne jak z krynicy"
        ru: "по сходству, ясному, как из родника,"
      - pl: "\nWynikłe z jego słów i Beatrycy,"
        ru: "проистекающему из его слов и слов Беатриче,"
      - pl: "\nGdy po Tomaszu tak mówić raczyła:"
        ru: "когда после Фомы она соизволила так сказать:"
      - pl: "\n«On potrzebuje, choć w głosie i w myśli"
        ru: "«Ему нужно, хоть ни голосом, ни мыслью"
      - pl: "\nJeszcze się jego żądza nie zdradziła,"
        ru: "его желание ещё себя не выдало,"
      - pl: "\nTreść drugiej prawdy zbadać aż do rdzeni."
        ru: "исследовать суть другой истины до самой сердцевины."
    words: { "nacisku": nacisk, "najściślej": scisle, "podobieństwo": podobienstwo, "zdradziła": zdradzic, "zbadać": zbadac, "rdzeni": rdzen }
  - clean: "Mów doń, czy światło, co jest twą ozdobą,\nBędzie jak teraz wiekuiście z tobą?\nJeśli tak być ma, powiedz, gdy się stanie\nWidzialnym duszy waszej pomieszkanie,\nCzy wzrok wasz zniesie blask waszych promieni?»\nJak czasem w tańcu panny i młodzieńce\nSzał swej radości, unosząc się kołem,\nZdradzają głosem, spojrzeniem wesołem,\nTak na tę prośbę czułą i wymowną\nOdpowiedziały święte duchów wieńce\nNową radością i pieśnią cudowną."
    verse: true
    chunks:
      - pl: "Mów doń, czy światło, co jest twą ozdobą,"
        ru: "Скажи ему: свет, что тебя украшает,"
      - pl: "\nBędzie jak teraz wiekuiście z tobą?"
        ru: "будет ли вечно с тобой, как теперь?"
      - pl: "\nJeśli tak być ma, powiedz, gdy się stanie"
        ru: "Если это должно быть так, скажи: когда станет"
      - pl: "\nWidzialnym duszy waszej pomieszkanie,"
        ru: "видимым жилище вашей души,"
        note: "то есть тело после воскресения"
      - pl: "\nCzy wzrok wasz zniesie blask waszych promieni?»"
        ru: "вынесет ли ваш взор блеск ваших лучей?»"
      - pl: "\nJak czasem w tańcu panny i młodzieńce"
        ru: "Как иногда в пляске девушки и юноши"
      - pl: "\nSzał swej radości, unosząc się kołem,"
        ru: "безумие своей радости, кружась кругом,"
      - pl: "\nZdradzają głosem, spojrzeniem wesołem,"
        ru: "выдают голосом, весёлым взглядом,"
      - pl: "\nTak na tę prośbę czułą i wymowną"
        ru: "так на эту нежную и красноречивую просьбу"
      - pl: "\nOdpowiedziały święte duchów wieńce"
        ru: "ответили святые венцы духов"
      - pl: "\nNową radością i pieśnią cudowną."
        ru: "новой радостью и чудесной песнью."
    words: { "ozdobą": ozdoba, "blask": blask, "promieni": promien, "Szał": szal, "Zdradzają": zdradzac, "pieśnią": piesn }
  - clean: "«Kto skarży na to, że przez śmierć na ziemi\nDuchem żyć wiecznie wzlatuje w niebiosa,\nTaki nie poczuł czuciami naszemi,\nJak bosko rzeźwi wiekuista rosa.\nW Dwóch i Trzech Jedność królująca wiecznie,\nW Trzech i Dwóch Jedność żyjąca społecznie,\nObejmująca świat, a nieobjęta»."
    verse: true
    chunks:
      - pl: "«Kto skarży na to, że przez śmierć na ziemi"
        ru: "«Кто жалуется на то, что через смерть на земле"
      - pl: "\nDuchem żyć wiecznie wzlatuje w niebiosa,"
        ru: "взлетает в небеса, чтобы вечно жить духом,"
      - pl: "\nTaki nie poczuł czuciami naszemi,"
        ru: "тот не почувствовал нашими чувствами,"
      - pl: "\nJak bosko rzeźwi wiekuista rosa."
        ru: "как божественно освежает вечная роса."
      - pl: "\nW Dwóch i Trzech Jedność królująca wiecznie,"
        ru: "Единство, вечно царствующее в Двух и Трёх,"
      - pl: "\nW Trzech i Dwóch Jedność żyjąca społecznie,"
        ru: "Единство, живущее сообща в Трёх и Двух,"
      - pl: "\nObejmująca świat, a nieobjęta»."
        ru: "объемлющее мир, а само необъятное»."
    words: { "Duchem": duch, "wiecznie": wiecznie, "niebiosa": niebiosa, "poczuł": poczuc, "rosa": rosa, "Jedność": jednosc }
  - clean: "Tak po trzy razy brzmiała pieśń ich święta,\nPieśń tak urocza, że kto raz ją słucha,\nDość ma nagrody na zasługę ducha.\nGłos skromny wyszedł z najmniejszego koła,\nJak do Maryi był głos jej anioła,\nI mówił: «Póki czas nam słodko bieży\nNa ucztach raju, póty miłość nasza\nBez przerwy będzie wkoło tej odzieży\nZ ogniska swego rozpromieniać blaski."
    verse: true
    chunks:
      - pl: "Tak po trzy razy brzmiała pieśń ich święta,"
        ru: "Так трижды звучала их святая песнь,"
      - pl: "\nPieśń tak urocza, że kto raz ją słucha,"
        ru: "песнь столь прелестная, что кто раз её услышит,"
      - pl: "\nDość ma nagrody na zasługę ducha."
        ru: "имеет довольно награды за заслугу духа."
      - pl: "\nGłos skromny wyszedł z najmniejszego koła,"
        ru: "Скромный голос вышел из самого малого круга,"
        note: "Соломон, «малейший» — ближайший внутренний"
      - pl: "\nJak do Maryi był głos jej anioła,"
        ru: "как был к Марии голос её ангела,"
      - pl: "\nI mówił: «Póki czas nam słodko bieży"
        ru: "и сказал: «Пока время сладко бежит у нас"
      - pl: "\nNa ucztach raju, póty miłość nasza"
        ru: "на пирах рая, до тех пор наша любовь"
      - pl: "\nBez przerwy będzie wkoło tej odzieży"
        ru: "без перерыва будет вокруг этой одежды"
      - pl: "\nZ ogniska swego rozpromieniać blaski."
        ru: "излучать блески из своего очага."
    words: { "nagrody": nagroda, "zasługę": zasluga, "skromny": skromny, "raju": raj, "przerwy": przerwa, "ogniska": ognisko }
  - clean: "Zapał miłości, co nasz blask podnasza,\nOd naszych widzeń niebieskich zależy,\nKtóre o tyle wyiskrzą się jasno,\nO ile dusza nad zasługę własną\nMieć będzie prawa do udziału łaski.\nWtenczas my w święte obleczem się ciała,\nWtenczas i nasza osoba zapała\nŻywszą wdzięcznością, bo już będzie cała!"
    verse: true
    chunks:
      - pl: "Zapał miłości, co nasz blask podnasza,"
        ru: "Пыл любви, что поднимает наш блеск,"
        note: "podnaszać — поднимать"
      - pl: "\nOd naszych widzeń niebieskich zależy,"
        ru: "зависит от наших небесных видений,"
      - pl: "\nKtóre o tyle wyiskrzą się jasno,"
        ru: "которые будут выискриваться тем ярче,"
      - pl: "\nO ile dusza nad zasługę własną"
        ru: "чем больше душа сверх своей заслуги"
      - pl: "\nMieć będzie prawa do udziału łaski."
        ru: "будет иметь права на долю милости."
      - pl: "\nWtenczas my w święte obleczem się ciała,"
        ru: "Тогда мы облечёмся в святые тела,"
      - pl: "\nWtenczas i nasza osoba zapała"
        ru: "тогда и наша особа запылает"
      - pl: "\nŻywszą wdzięcznością, bo już będzie cała!"
        ru: "более живой благодарностью, ибо уже будет целой!"
    words: { "niebieskich": niebieski, "zależy": zalezec, "dusza": dusza, "udziału": udzial, "Żywszą": zywy, "wdzięcznością": wdziecznosc }
  - clean: "Żywiej nas zatli niż teraz zapala\nŚwiatłość, co na się nam patrzeć pozwala:\nWtedy się ducha wytęży spojrzenie,\nBez końca święte róść będzie widzenie,\nZapał, co odeń zachwyca płomyka,\nI promień, który z zapału wynika."
    verse: true
    chunks:
      - pl: "Żywiej nas zatli niż teraz zapala"
        ru: "Живее, чем теперь зажигает, нас зажжёт"
      - pl: "\nŚwiatłość, co na się nam patrzeć pozwala:"
        ru: "свет, что позволяет нам смотреть на него:"
      - pl: "\nWtedy się ducha wytęży spojrzenie,"
        ru: "тогда напряжётся взгляд духа,"
      - pl: "\nBez końca święte róść będzie widzenie,"
        ru: "без конца будет расти святое видение,"
      - pl: "\nZapał, co odeń zachwyca płomyka,"
        ru: "пыл, что от него восхищает огонёк,"
      - pl: "\nI promień, który z zapału wynika."
        ru: "и луч, что проистекает из пыла."
    words: { "Żywiej": zywo, "patrzeć": patrzec, "pozwala": pozwalac, "wytęży": wytezyc, "róść": rosnac, "wynika": wynikac }
  - clean: "Jako żar płomień dający przez płomie\nŻywą białością prześwieca widomie,\nBlask, co otacza nas, zwyciężon będzie\nBlaskiem ciał naszych, gdy na rozkaz boży\nZiemia zamknięte mogiły otworzy.\nNiezmrużonymi nań spojrzym oczyma,\nBo zmartwychwstałych ciał silne narzędzie\nWrażenie wszelkiej rozkoszy wytrzyma»."
    verse: true
    chunks:
      - pl: "Jako żar płomień dający przez płomie"
        ru: "Как уголь, дающий пламя, сквозь пламя"
      - pl: "\nŻywą białością prześwieca widomie,"
        ru: "явно просвечивает живой белизной,"
      - pl: "\nBlask, co otacza nas, zwyciężon będzie"
        ru: "блеск, что нас окружает, будет побеждён"
      - pl: "\nBlaskiem ciał naszych, gdy na rozkaz boży"
        ru: "блеском наших тел, когда по Божьему велению"
      - pl: "\nZiemia zamknięte mogiły otworzy."
        ru: "земля откроет закрытые могилы."
      - pl: "\nNiezmrużonymi nań spojrzym oczyma,"
        ru: "Мы взглянем на него незажмуренными глазами,"
      - pl: "\nBo zmartwychwstałych ciał silne narzędzie"
        ru: "ибо сильное орудие воскресших тел"
      - pl: "\nWrażenie wszelkiej rozkoszy wytrzyma»."
        ru: "выдержит впечатление всякого наслаждения»."
    words: { "płomień": plomien, "otacza": otaczac, "narzędzie": narzedzie, "Wrażenie": wrazenie, "wszelkiej": wszelki, "wytrzyma": wytrzymac }
  - clean: "Wtem oba chóry z tak wielkim zapałem,\nTak jednozgodnie «Amen» wymówiły,\nJakby pragnęły tej chwili z mogiły\nWskrzeszonym, żywym przyoblec się ciałem,\nMoże nie dla się, lecz dla swoich matek,\nDla swoich ojców, drogich żon i dziatek,\nDla wielu innych drogich im na ziemi,\nWprzód nim się stały światłami wiecznemi."
    verse: true
    chunks:
      - pl: "Wtem oba chóry z tak wielkim zapałem,"
        ru: "Тут оба хора с таким великим пылом,"
      - pl: "\nTak jednozgodnie «Amen» wymówiły,"
        ru: "так единодушно произнесли «Аминь»,"
      - pl: "\nJakby pragnęły tej chwili z mogiły"
        ru: "будто желали в этот миг из могилы"
      - pl: "\nWskrzeszonym, żywym przyoblec się ciałem,"
        ru: "облечься в воскрешённое, живое тело,"
      - pl: "\nMoże nie dla się, lecz dla swoich matek,"
        ru: "может быть, не для себя, а для своих матерей,"
      - pl: "\nDla swoich ojców, drogich żon i dziatek,"
        ru: "для своих отцов, дорогих жён и деток,"
      - pl: "\nDla wielu innych drogich im na ziemi,"
        ru: "для многих других, дорогих им на земле,"
      - pl: "\nWprzód nim się stały światłami wiecznemi."
        ru: "прежде чем они стали вечными светилами."
    words: { "chóry": chor, "Amen": amen, "pragnęły": pragnac, "ciałem": cialo, "matek": matka, "ziemi": ziemia }
  - clean: "I oto światła widziane okola\nBlask nowych świateł jakby aureola\nSłońca, gdy wschodzi na widnokrąg czysty.\nJak na początku wieczornego zmroku\nNowe nam światła rzęśnieją z obłoku,\nCo być i nie być wydają się oku;\nZdało się, że nowe widziałem istoty,\nTworzące jakby obwód światła złoty,\nOpasujący te dwa kołowroty;\nŚwiętego ducha odblask rzeczywisty!"
    verse: true
    chunks:
      - pl: "I oto światła widziane okola"
        ru: "И вот видимые светила окружает"
      - pl: "\nBlask nowych świateł jakby aureola"
        ru: "блеск новых светил, словно ореол"
      - pl: "\nSłońca, gdy wschodzi na widnokrąg czysty."
        ru: "солнца, когда оно восходит на чистый горизонт."
      - pl: "\nJak na początku wieczornego zmroku"
        ru: "Как в начале вечернего сумрака"
      - pl: "\nNowe nam światła rzęśnieją z obłoku,"
        ru: "новые светила мерцают нам из облака,"
      - pl: "\nCo być i nie być wydają się oku;"
        ru: "что глазу кажутся то есть, то нет;"
      - pl: "\nZdało się, że nowe widziałem istoty,"
        ru: "мне показалось, что я видел новые существа,"
      - pl: "\nTworzące jakby obwód światła złoty,"
        ru: "образующие как бы золотой обод света,"
      - pl: "\nOpasujący te dwa kołowroty;"
        ru: "опоясывающий эти два вращающихся круга;"
      - pl: "\nŚwiętego ducha odblask rzeczywisty!"
        ru: "действительный отблеск Святого Духа!"
    words: { "Słońca": slonce, "czysty": czysty, "zmroku": zmrok, "istoty": istota, "obwód": obwod, "złoty": zloty }
  - clean: "Którego blaski tak się razem wzmogły,\nŻe ich me oczy wytrzymać nie mogły.\nLecz Beatrycze, kiedym spojrzał na nią,\nTak miała uśmiech piękny i uroczy,\nŻe to widzenie musi być wbrew chęci\nW liczbie tych, które znikły z mej pamięci."
    verse: true
    chunks:
      - pl: "Którego blaski tak się razem wzmogły,"
        ru: "чьи блески так разом усилились,"
      - pl: "\nŻe ich me oczy wytrzymać nie mogły."
        ru: "что мои глаза не могли их вынести."
      - pl: "\nLecz Beatrycze, kiedym spojrzał na nią,"
        ru: "Но Беатриче, когда я взглянул на неё,"
      - pl: "\nTak miała uśmiech piękny i uroczy,"
        ru: "имела такую прекрасную и прелестную улыбку,"
      - pl: "\nŻe to widzenie musi być wbrew chęci"
        ru: "что это видение против желания должно быть"
      - pl: "\nW liczbie tych, które znikły z mej pamięci."
        ru: "в числе тех, что исчезли из моей памяти."
    words: { "uśmiech": usmiech, "piękny": piekny, "chęci": chec, "liczbie": liczba, "znikły": zniknac, "pamięci": pamiec }
  - clean: "Ale wzmocnione, gdy podniosłem oczy,\nW końcu spostrzegłem, że sam z moją panią\nWzniosłem się w sferę wyższego zbawienia.\nPostrzegłem wyższy polot naszej jazdy\nPo nowym świetle, po uśmiechu gwiazdy,\nCo się czerwieńszym blaskiem zarumienia;\nModlitwą, wspólną wszystkim sercom mową,\nBogu za łaskę dziękowałem nową."
    verse: true
    chunks:
      - pl: "Ale wzmocnione, gdy podniosłem oczy,"
        ru: "Но, окрепнув, когда я поднял глаза,"
      - pl: "\nW końcu spostrzegłem, że sam z moją panią"
        ru: "я наконец заметил, что сам с моей госпожой"
      - pl: "\nWzniosłem się w sferę wyższego zbawienia."
        ru: "вознёсся в сферу высшего спасения."
      - pl: "\nPostrzegłem wyższy polot naszej jazdy"
        ru: "Я заметил более высокий взлёт нашей езды"
      - pl: "\nPo nowym świetle, po uśmiechu gwiazdy,"
        ru: "по новому свету, по улыбке звезды,"
      - pl: "\nCo się czerwieńszym blaskiem zarumienia;"
        ru: "что зарумянилась более красным блеском;"
      - pl: "\nModlitwą, wspólną wszystkim sercom mową,"
        ru: "молитвой, общей речью всех сердец,"
      - pl: "\nBogu za łaskę dziękowałem nową."
