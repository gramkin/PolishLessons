level: B2
paragraphs:
  - clean: "(Zakończenie. O przemianie ciał. Kręgi 5–7: Święci chrześcijańskiego życia. 5.) Mars. Bojownicy boży (męczennicy, wojacy i inni) tworzą krzyż.)"
    chunks:
      - pl: "(Zakończenie. O przemianie ciał. Kręgi 5–7: Święci chrześcijańskiego życia. 5.) Mars. Bojownicy boży (męczennicy, wojacy i inni) tworzą krzyż.)"
        ru: "(Окончание. О преображении тел. Круги 5–7: святые христианской жизни. 5.) Марс. Воины Божьи (мученики, воины и другие) образуют крест.)"
