chapter: 3
chapterTitle: "Karnawał i Wielki Post"
chapterTitleRu: "Карнавал и Великий пост"
level: B2
paragraphs:
  - clean: "Karnawał zaczyna się w święto Trzech Króli i trwa aż do Środy Popielcowej, kiedy rozpoczyna się Wielki Post. Jego długość zmienia się co roku, bo zależy od daty Wielkanocy, która jest świętem ruchomym. Czasem karnawał jest krótki i kończy się na początku lutego, a czasem trwa prawie do połowy marca. Dawniej nazywano go zapustami albo mięsopustem, bo był to ostatni czas przed długim postem, kiedy można było jeść mięso, tłuste potrawy i słodycze bez ograniczeń. Słowo karnawał przyszło z Włoch i według najpopularniejszego wyjaśnienia pochodzi od łacińskich słów carne vale, czyli mięso, żegnaj."
    draft: true
    chunks:
      - pl: "Karnawał zaczyna się w święto Trzech Króli i trwa aż do Środy Popielcowej, kiedy rozpoczyna się Wielki Post."
        ru: "Карнавал начинается в праздник Трёх королей и длится до Пепельной среды, когда начинается Великий пост."
      - pl: " Jego długość zmienia się co roku, bo zależy od daty Wielkanocy, która jest świętem ruchomym."
        ru: "Его продолжительность меняется каждый год, потому что зависит от даты Пасхи, которая является переходящим праздником."
        note: "ruchomy — подвижный, переходящий"
      - pl: " Czasem karnawał jest krótki i kończy się na początku lutego, a czasem trwa prawie do połowy marca."
        ru: "Иногда карнавал короткий и заканчивается в начале февраля, а иногда длится почти до середины марта."
      - pl: " Dawniej nazywano go zapustami albo mięsopustem, bo był to ostatni czas przed długim postem, kiedy można było jeść mięso, tłuste potrawy i słodycze bez ograniczeń."
        ru: "Раньше его называли запустами или мясопустом, потому что это было последнее время перед долгим постом, когда можно было есть мясо, жирную пищу и сладости без ограничений."
        note: "zapusty — масленица, мясопуст"
      - pl: " Słowo karnawał przyszło z Włoch i według najpopularniejszego wyjaśnienia pochodzi od łacińskich słów carne vale, czyli mięso, żegnaj."
        ru: "Слово «карнавал» пришло из Италии и, по самому популярному объяснению, происходит от латинских слов carne vale, то есть «мясо, прощай»."
        note: "żegnaj — прощай"
    words: { "święto": swieto, "trwa": trwac, "rozpoczyna": rozpoczynac, "długość": dlugosc, "zależy": zalezec, "daty": data, "świętem": swieto, "krótki": krotki, "kończy": konczyc, "początku": poczatek, "lutego": luty, "połowy": polowa, "marca": marzec, "mięso": mieso, "tłuste": tlusty, "słodycze": slodycz, "według": wedlug, "najpopularniejszego": popularny, "pochodzi": pochodzic, "czyli": czyli, "żegnaj": zegnac }
  - clean: "Był to czas balów, maskarad i hucznych zabaw. W szlacheckich dworach tańczono poloneza, mazura i kontredansa, a na balach w miastach pojawiali się goście w maskach, których nikt nie potrafił rozpoznać, co dawało okazję do flirtu i żartów. Wiejska młodzież spotykała się w karczmie, gdzie do rana grała kapela, a starsi przyglądali się tańcom, siedząc pod ścianami. Karnawał był też najlepszym czasem na swaty i wesela, bo po jego zakończeniu aż do Wielkanocy nie wolno było się bawić. Dziś bale karnawałowe organizują szkoły, firmy, urzędy i stowarzyszenia, a dla dzieci przygotowuje się bale przebierańców, na których roi się od księżniczek, piratów, superbohaterów i dinozaurów."
    draft: true
    chunks:
      - pl: "Był to czas balów, maskarad i hucznych zabaw."
        ru: "Это было время балов, маскарадов и шумных гуляний."
      - pl: " W szlacheckich dworach tańczono poloneza, mazura i kontredansa, a na balach w miastach pojawiali się goście w maskach, których nikt nie potrafił rozpoznać, co dawało okazję do flirtu i żartów."
        ru: "В шляхетских усадьбах танцевали полонез, мазурку и контрданс, а на городских балах появлялись гости в масках, которых никто не мог узнать, что давало повод для флирта и шуток."
      - pl: " Wiejska młodzież spotykała się w karczmie, gdzie do rana grała kapela, a starsi przyglądali się tańcom, siedząc pod ścianami."
        ru: "Деревенская молодёжь собиралась в корчме, где до утра играла капелла, а старшие наблюдали за танцами, сидя у стен."
        note: "karczma — корчма"
      - pl: " Karnawał był też najlepszym czasem na swaty i wesela, bo po jego zakończeniu aż do Wielkanocy nie wolno było się bawić."
        ru: "Карнавал был и лучшим временем для сватовства и свадеб, потому что после его окончания до самой Пасхи веселиться было нельзя."
        note: "swaty — сватовство"
      - pl: " Dziś bale karnawałowe organizują szkoły, firmy, urzędy i stowarzyszenia, a dla dzieci przygotowuje się bale przebierańców, na których roi się od księżniczek, piratów, superbohaterów i dinozaurów."
        ru: "Сегодня карнавальные балы устраивают школы, фирмы, учреждения и общества, а для детей готовят костюмированные балы, на которых полно принцесс, пиратов, супергероев и динозавров."
        note: "przebieraniec — ряженый; roić się — кишеть"
    words: { "balów": bal, "dworach": dwor, "tańczono": tanczyc, "balach": bal, "pojawiali": pojawiac, "maskach": maska, "rozpoznać": rozpoznac, "okazję": okazja, "żartów": zart, "młodzież": mlodziez, "spotykała": spotykac, "przyglądali": przygladac, "tańcom": taniec, "ścianami": sciana, "wesela": wesele, "wolno": wolno, "bawić": bawic, "bale": bal, "organizują": organizowac, "firmy": firma, "urzędy": urzad, "stowarzyszenia": stowarzyszenie, "przygotowuje": przygotowywac, "księżniczek": ksiezniczka, "piratów": pirat, "dinozaurów": dinozaur }
  - clean: "Najważniejszym balem w życiu młodego Polaka jest studniówka. Odbywa się mniej więcej sto dni przed maturą, czyli egzaminem na zakończenie szkoły średniej, i od tej liczby wzięła swoją nazwę. Uczniowie przychodzą w garniturach i długich sukniach, a bal otwiera polonez, który wszyscy ćwiczą wcześniej przez kilka tygodni pod okiem nauczyciela wychowania fizycznego. Polonez jest dostojnym, powolnym tańcem w parach, i to właśnie on od wieków otwiera w Polsce uroczyste bale. Wśród uczniów krąży przesąd, że na studniówkę trzeba założyć czerwoną bieliznę, bo przynosi ona szczęście na maturze. Niewiele osób przyznaje się, że w to wierzy, ale czerwona bielizna w styczniu sprzedaje się wyjątkowo dobrze."
    draft: true
    chunks:
      - pl: "Najważniejszym balem w życiu młodego Polaka jest studniówka."
        ru: "Самый важный бал в жизни молодого поляка — студнювка."
      - pl: " Odbywa się mniej więcej sto dni przed maturą, czyli egzaminem na zakończenie szkoły średniej, i od tej liczby wzięła swoją nazwę."
        ru: "Он проходит примерно за сто дней до матуры, то есть экзамена по окончании средней школы, и от этого числа получил своё название."
        note: "matura — выпускной экзамен (аттестат зрелости)"
      - pl: " Uczniowie przychodzą w garniturach i długich sukniach, a bal otwiera polonez, który wszyscy ćwiczą wcześniej przez kilka tygodni pod okiem nauczyciela wychowania fizycznego."
        ru: "Ученики приходят в костюмах и длинных платьях, а бал открывает полонез, который все заранее несколько недель разучивают под присмотром учителя физкультуры."
      - pl: " Polonez jest dostojnym, powolnym tańcem w parach, i to właśnie on od wieków otwiera w Polsce uroczyste bale."
        ru: "Полонез — величественный, медленный парный танец, и именно он веками открывает в Польше торжественные балы."
        note: "dostojny — величавый"
      - pl: " Wśród uczniów krąży przesąd, że na studniówkę trzeba założyć czerwoną bieliznę, bo przynosi ona szczęście na maturze."
        ru: "Среди учеников ходит поверье, что на студнювку нужно надеть красное бельё, потому что оно приносит удачу на матуре."
        note: "przesąd — суеверие"
      - pl: " Niewiele osób przyznaje się, że w to wierzy, ale czerwona bielizna w styczniu sprzedaje się wyjątkowo dobrze."
        ru: "Мало кто признаётся, что в это верит, но красное бельё в январе продаётся на удивление хорошо."
    words: { "balem": bal, "mniej": malo, "maturą": matura, "egzaminem": egzamin, "średniej": sredni, "liczby": liczba, "przychodzą": przychodzic, "garniturach": garnitur, "sukniach": suknia, "otwiera": otwierac, "ćwiczą": cwiczyc, "nauczyciela": nauczyciel, "fizycznego": fizyczny, "tańcem": taniec, "parach": para, "wieków": wiek, "uczniów": uczen, "krąży": krazyc, "założyć": zalozyc, "czerwoną": czerwony, "bieliznę": bielizna, "przynosi": przynosic, "szczęście": szczescie, "maturze": matura, "przyznaje": przyznawac, "czerwona": czerwony, "bielizna": bielizna, "styczniu": styczen, "sprzedaje": sprzedawac }
  - clean: "Prawdziwą zimową przygodą jest kulig. Tak nazywa się przejażdżka saniami zaprzężonymi w konie, często kilkoma saniami jedna za drugą. W dawnej Polsce kulig był wielką zabawą szlachty. Orszak sań, oświetlony pochodniami, jechał nocą od dworu do dworu, a w każdym z nich gospodarze musieli przyjąć gości jedzeniem, piciem i tańcami. Taki kulig mógł trwać kilka dni i nocy, a jego uczestnicy wracali do domu zmęczeni, ale szczęśliwi. Opis wielkiego kuligu można znaleźć w wielu polskich powieściach historycznych, bo dla pisarzy był to obraz dawnej, wesołej i beztroskiej Polski. Dziś kuligi organizuje się przede wszystkim w górach i na Mazurach, a na końcu przejażdżki czeka zwykle ognisko, pieczona kiełbasa i gorąca herbata, czasem z czymś mocniejszym."
    draft: true
    chunks:
      - pl: "Prawdziwą zimową przygodą jest kulig."
        ru: "Настоящее зимнее приключение — кулиг."
      - pl: " Tak nazywa się przejażdżka saniami zaprzężonymi w konie, często kilkoma saniami jedna za drugą."
        ru: "Так называется катание на санях, запряжённых лошадьми, часто на нескольких санях одни за другими."
        note: "zaprzężony — запряжённый"
      - pl: " W dawnej Polsce kulig był wielką zabawą szlachty."
        ru: "В старой Польше кулиг был большой забавой шляхты."
      - pl: " Orszak sań, oświetlony pochodniami, jechał nocą od dworu do dworu, a w każdym z nich gospodarze musieli przyjąć gości jedzeniem, piciem i tańcami."
        ru: "Вереница саней, освещённая факелами, ехала ночью от усадьбы к усадьбе, и в каждой хозяева должны были принять гостей едой, питьём и танцами."
        note: "pochodnia — факел"
      - pl: " Taki kulig mógł trwać kilka dni i nocy, a jego uczestnicy wracali do domu zmęczeni, ale szczęśliwi."
        ru: "Такой кулиг мог длиться несколько дней и ночей, а его участники возвращались домой уставшими, но счастливыми."
      - pl: " Opis wielkiego kuligu można znaleźć w wielu polskich powieściach historycznych, bo dla pisarzy był to obraz dawnej, wesołej i beztroskiej Polski."
        ru: "Описание большого кулига можно найти во многих польских исторических романах, потому что для писателей это был образ старой, весёлой и беззаботной Польши."
        note: "beztroski — беззаботный"
      - pl: " Dziś kuligi organizuje się przede wszystkim w górach i na Mazurach, a na końcu przejażdżki czeka zwykle ognisko, pieczona kiełbasa i gorąca herbata, czasem z czymś mocniejszym."
        ru: "Сегодня кулиги устраивают прежде всего в горах и на Мазурах, а в конце катания обычно ждут костёр, жареная колбаса и горячий чай, иногда с чем-нибудь покрепче."
        note: "ognisko — костёр"
    words: { "przygodą": przygoda, "przejażdżka": przejazdzka, "konie": kon, "często": czesto, "dawnej": dawny, "zabawą": zabawa, "pochodniami": pochodnia, "dworu": dwor, "gospodarze": gospodarz, "tańcami": taniec, "trwać": trwac, "szczęśliwi": szczesliwy, "polskich": polski, "powieściach": powiesc-noun, "historycznych": historyczny, "pisarzy": pisarz, "wesołej": wesoly, "organizuje": organizowac, "przejażdżki": przejazdzka, "zwykle": zwykle, "ognisko": ognisko, "pieczona": piec-2, "gorąca": goracy, "herbata": herbata, "mocniejszym": mocny }
  - clean: "Na Podhalu karnawał ma własny, góralski charakter. W Bukowinie Tatrzańskiej od kilkudziesięciu lat odbywa się w lutym Góralski Karnawał, na który zjeżdżają zespoły i kapele z całych gór. Największe emocje budzą kumoterki, czyli wyścigi małych sań zaprzężonych w jednego konia, w których siedzi dwóch górali w odświętnych strojach. Sanie pędzą po zaśnieżonej łące, często się przewracają, a widzowie głośno dopingują swoich faworytów. Wieczorem cała wieś bawi się na zabawach w remizach i karczmach, a muzyka góralska gra do rana."
    draft: true
    chunks:
      - pl: "Na Podhalu karnawał ma własny, góralski charakter."
        ru: "На Подгалье у карнавала свой, горский характер."
      - pl: " W Bukowinie Tatrzańskiej od kilkudziesięciu lat odbywa się w lutym Góralski Karnawał, na który zjeżdżają zespoły i kapele z całych gór."
        ru: "В Буковине-Татшаньской уже несколько десятилетий в феврале проходит Горский карнавал, на который съезжаются ансамбли и капеллы со всех гор."
      - pl: " Największe emocje budzą kumoterki, czyli wyścigi małych sań zaprzężonych w jednego konia, w których siedzi dwóch górali w odświętnych strojach."
        ru: "Больше всего страстей вызывают кумотерки, то есть гонки маленьких саней, запряжённых одной лошадью, в которых сидят двое горцев в праздничных костюмах."
        note: "odświętny — праздничный"
      - pl: " Sanie pędzą po zaśnieżonej łące, często się przewracają, a widzowie głośno dopingują swoich faworytów."
        ru: "Сани несутся по заснеженному лугу, часто переворачиваются, а зрители громко болеют за своих фаворитов."
        note: "dopingować — болеть (за кого-то)"
      - pl: " Wieczorem cała wieś bawi się na zabawach w remizach i karczmach, a muzyka góralska gra do rana."
        ru: "Вечером вся деревня веселится на танцах в пожарных депо и корчмах, а горская музыка играет до утра."
        note: "remiza — пожарное депо (часто место сельских танцев)"
    words: { "charakter": charakter, "lutym": luty, "zespoły": zespol, "emocje": emocje, "budzą": budzic, "wyścigi": wyscig, "konia": kon, "strojach": stroj, "pędzą": pedzic, "przewracają": przewracac, "widzowie": widz, "głośno": glosno, "wieś": wies, "bawi": bawic, "zabawach": zabawa }
  - clean: "Słodkim szczytem karnawału jest tłusty czwartek, ostatni czwartek przed Wielkim Postem. Tego dnia wypada zjeść przynajmniej jednego pączka, bo jak mówi przesąd, kto tego nie zrobi, temu nie będzie się wiodło w życiu. Przed cukierniami ustawiają się od rana długie kolejki, a w biurach na biurkach pojawiają się pudełka pełne pączków, które przynoszą szefowie albo koledzy. Według szacunków Polacy zjadają tego jednego dnia dziesiątki milionów pączków. Klasyczny polski pączek jest okrągły, smażony w głębokim tłuszczu, nadziewany konfiturą z płatków róży i posypany cukrem pudrem albo polany lukrem ze skórką pomarańczową. Dawniej pączki robiono z ciasta chlebowego i nadziewano słoniną albo mięsem, a słodkie stały się dopiero w szlacheckiej kuchni. Obok pączków je się faworki, nazywane w różnych regionach chrustem albo chruścikami, cienkie, kruche paski ciasta smażone na złoto i posypane cukrem. Kto liczy kalorie, ma tego dnia wyjątkowo trudne zadanie, ale niewielu się tym przejmuje."
    draft: true
    chunks:
      - pl: "Słodkim szczytem karnawału jest tłusty czwartek, ostatni czwartek przed Wielkim Postem."
        ru: "Сладкая вершина карнавала — жирный четверг, последний четверг перед Великим постом."
      - pl: " Tego dnia wypada zjeść przynajmniej jednego pączka, bo jak mówi przesąd, kto tego nie zrobi, temu nie będzie się wiodło w życiu."
        ru: "В этот день полагается съесть хотя бы один пончик, потому что, как гласит поверье, у того, кто этого не сделает, не будет удачи в жизни."
        note: "wieść się — удаваться, везти"
      - pl: " Przed cukierniami ustawiają się od rana długie kolejki, a w biurach na biurkach pojawiają się pudełka pełne pączków, które przynoszą szefowie albo koledzy."
        ru: "Перед кондитерскими с утра выстраиваются длинные очереди, а в офисах на столах появляются коробки, полные пончиков, которые приносят начальники или коллеги."
        note: "cukiernia — кондитерская"
      - pl: " Według szacunków Polacy zjadają tego jednego dnia dziesiątki milionów pączków."
        ru: "По оценкам, поляки съедают за этот один день десятки миллионов пончиков."
      - pl: " Klasyczny polski pączek jest okrągły, smażony w głębokim tłuszczu, nadziewany konfiturą z płatków róży i posypany cukrem pudrem albo polany lukrem ze skórką pomarańczową."
        ru: "Классический польский пончик круглый, жаренный во фритюре, начинённый вареньем из лепестков розы и посыпанный сахарной пудрой или политый глазурью с апельсиновой цедрой."
        note: "płatek — лепесток; nadziewany — с начинкой"
      - pl: " Dawniej pączki robiono z ciasta chlebowego i nadziewano słoniną albo mięsem, a słodkie stały się dopiero w szlacheckiej kuchni."
        ru: "Раньше пончики делали из хлебного теста и начиняли салом или мясом, а сладкими они стали только в шляхетской кухне."
