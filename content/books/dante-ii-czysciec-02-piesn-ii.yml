# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 2
chapterTitle: "Pieśń II"
chapterTitleRu: "Песнь II. Каселла"
level: B2
paragraphs:
  - clean: "(Oddział I. Przedczyściec. Przewoźnicy. Kassela.)"
    chunks:
      - pl: "(Oddział I. Przedczyściec. Przewoźnicy. Kassela.)"
        ru: "(Отдел I. Предчистилище. Перевозчики. Каселла.)"
        note: "przedczyściec — предчистилище; Kassela — Каселла, певец, друг Данте"
    words: { "Oddział": oddzial }
  - clean: "Słońce w pół drogi do swojego kresu,\nJuż na sam zenit weszło południka,\nPod którym święta Jeruzalem leży.\nPrzeciwległymi noc idąca tory,\nTrzymając Wagę wychodzi z Gangesu,\nLecz ta ku słońcu z jej rąk się wymyka:\nPrzeto gdzie byłem, gdzie dzień błysnął biały,\nZe zbytku wieku pięknej Aurory\nBiało-różowe jagody zżółkniały."
    verse: true
    chunks:
      - pl: "Słońce w pół drogi do swojego kresu,"
        ru: "Солнце на полпути к своему пределу"
      - pl: "\nJuż na sam zenit weszło południka,"
        ru: "уже взошло на самый зенит меридиана,"
        note: "południk — меридиан"
      - pl: "\nPod którym święta Jeruzalem leży."
        ru: "под которым лежит святой Иерусалим."
      - pl: "\nPrzeciwległymi noc idąca tory,"
        ru: "По противоположным путям идущая ночь,"
      - pl: "\nTrzymając Wagę wychodzi z Gangesu,"
        ru: "держа Весы, выходит из Ганга,"
        note: "Waga — созвездие Весов"
      - pl: "\nLecz ta ku słońcu z jej rąk się wymyka:"
        ru: "но они от неё к солнцу ускользают из рук:"
      - pl: "\nPrzeto gdzie byłem, gdzie dzień błysnął biały,"
        ru: "поэтому там, где я был, где блеснул белый день,"
      - pl: "\nZe zbytku wieku pięknej Aurory"
        ru: "от избытка лет прекрасной Авроры"
        note: "zbytek — избыток"
      - pl: "\nBiało-różowe jagody zżółkniały."
        ru: "бело-розовые щёки пожелтели."
        note: "zżółknąć — пожелтеть"
    words: { "Słońce": slonce, "kresu": kres, "tory": tor, "Wagę": waga, "biały": bialy, "różowe": rozowy }
  - clean: "Jeszcześmy stali wśród morskich wybrzeży,\nJak ten, co myśląc o podróży swojej,\nMyślą już idzie, ciałem w miejscu stoi.\nOto, jak ranna przybliża się zorza,\nMars sczerwieniały zapada do morza\nOwiany mgłami, tak przez mgłę rozwisłą\nBłysnęło światło: — oby jeszcze błysło!"
    verse: true
    chunks:
      - pl: "Jeszcześmy stali wśród morskich wybrzeży,"
        ru: "Мы ещё стояли среди морских берегов,"
      - pl: "\nJak ten, co myśląc o podróży swojej,"
        ru: "как тот, кто, думая о своём путешествии,"
      - pl: "\nMyślą już idzie, ciałem w miejscu stoi."
        ru: "мыслью уже идёт, а телом стоит на месте."
      - pl: "\nOto, jak ranna przybliża się zorza,"
        ru: "Вот, как приближается утренняя заря,"
      - pl: "\nMars sczerwieniały zapada do morza"
        ru: "покрасневший Марс опускается в море,"
        note: "sczerwieniały — покрасневший"
      - pl: "\nOwiany mgłami, tak przez mgłę rozwisłą"
        ru: "овеянный туманами, так сквозь висящий туман"
        note: "rozwisły — нависший"
      - pl: "\nBłysnęło światło: — oby jeszcze błysło!"
        ru: "блеснул свет: — о, если бы он ещё блеснул!"
    words: { "morskich": morski, "wybrzeży": wybrzeze, "podróży": podroz, "morza": morze, "mgłami": mgla, "światło": swiatlo }
  - clean: "Nigdy tak szybko cień się nie prześliźnie\nOd skrzydeł ptaka po wodnej płaszczyźnie.\nI nim zwróciłem oczy pytające\nNa mego mistrza, to światło wschodzące\nPonad wodami rosło coraz wyżej;\nNaprzód zbielały oba światła końce,\nSkąd potem inna białość błysła niżej."
    verse: true
    chunks:
      - pl: "Nigdy tak szybko cień się nie prześliźnie"
        ru: "Никогда так быстро не проскользнёт тень"
      - pl: "\nOd skrzydeł ptaka po wodnej płaszczyźnie."
        ru: "от крыльев птицы по водной глади."
      - pl: "\nI nim zwróciłem oczy pytające"
        ru: "И прежде чем я обратил вопрошающие глаза"
      - pl: "\nNa mego mistrza, to światło wschodzące"
        ru: "на моего учителя, этот восходящий свет"
      - pl: "\nPonad wodami rosło coraz wyżej;"
        ru: "поднимался над водами всё выше;"
      - pl: "\nNaprzód zbielały oba światła końce,"
        ru: "сперва побелели оба края света,"
      - pl: "\nSkąd potem inna białość błysła niżej."
        ru: "откуда потом другая белизна блеснула ниже."
    words: { "cień": cien, "skrzydeł": skrzydlo, "wodnej": wodny, "rosło": rosnac, "Naprzód": naprzod, "niżej": nisko }
  - clean: "Mistrz stał w milczeniu z pochylonym czołem:\nZ pierwszej białości gdy skrzydła wybłysły,\nZ drugiej gdy szata mignęła rozwiana,\nPoznał żeglarza po białej sukience\nI woła: «Klękaj, padaj na kolana,\nPatrz, boży anioł! składaj obie ręce,\nOdtąd z niejednym spotkasz się aniołem."
    verse: true
    chunks:
      - pl: "Mistrz stał w milczeniu z pochylonym czołem:"
        ru: "Учитель стоял молча с опущенным челом:"
      - pl: "\nZ pierwszej białości gdy skrzydła wybłysły,"
        ru: "когда из первой белизны засверкали крылья,"
      - pl: "\nZ drugiej gdy szata mignęła rozwiana,"
        ru: "когда из второй мелькнула развевающаяся одежда,"
      - pl: "\nPoznał żeglarza po białej sukience"
        ru: "он узнал кормчего по белому платью"
      - pl: "\nI woła: «Klękaj, padaj na kolana,"
        ru: "и кричит: «Становись на колени, падай ниц,"
      - pl: "\nPatrz, boży anioł! składaj obie ręce,"
        ru: "смотри: ангел Божий! складывай обе руки,"
      - pl: "\nOdtąd z niejednym spotkasz się aniołem."
        ru: "отныне ты встретишься не с одним ангелом."
    words: { "pochylonym": pochylic, "sukience": sukienka, "woła": wolac, "padaj": padac, "składaj": skladac, "Odtąd": odtad }
  - clean: "Patrz, jak ludzkimi on gardzi przemysły,\nBez żaglu, wiosła, tylko skrzydeł dwoje,\nA do tych brzegów płynie z tak daleka!\nProsto ku niebu wzniósł skrzydeł oboje,\nPatrz, jakim piórem świeci przeźroczystym,\nKrając powietrze pierzem wiekuistym,\nCo się nie zmienia jako włos człowieka»."
    verse: true
    chunks:
      - pl: "Patrz, jak ludzkimi on gardzi przemysły,"
        ru: "Смотри, как он презирает человеческие ухищрения,"
        note: "przemysły — ухищрения"
      - pl: "\nBez żaglu, wiosła, tylko skrzydeł dwoje,"
        ru: "без паруса, весла, лишь пара крыльев,"
      - pl: "\nA do tych brzegów płynie z tak daleka!"
        ru: "а к этим берегам плывёт издалека!"
      - pl: "\nProsto ku niebu wzniósł skrzydeł oboje,"
        ru: "Прямо к небу поднял он оба крыла,"
      - pl: "\nPatrz, jakim piórem świeci przeźroczystym,"
        ru: "смотри, каким прозрачным пером он сияет,"
        note: "przeźroczysty — прозрачный"
      - pl: "\nKrając powietrze pierzem wiekuistym,"
        ru: "рассекая воздух вечным оперением,"
        note: "krajać — резать"
      - pl: "\nCo się nie zmienia jako włos człowieka»."
        ru: "что не меняется, как волос человека»."
    words: { "ludzkimi": ludzki, "brzegów": brzeg, "wzniósł": wzniesc, "piórem": pioro, "powietrze": powietrze, "włos": wlos }
  - clean: "Już ptak niebieski, widzę, skrzydłem błyska,\nMigoce ku nam piórami jasnemi,\nAż moje oczy, znieść nie mogąc z bliska\nTakiego blasku, opadły ku ziemi.\nOn lekką łódką, co zdało się, chodzi\nPo fal wierzchołkach, do brzegu się zbliża:\nNiebieski sternik stał pełen wesela,\nNa twarzy jego była wypisana\nZdaje się cała szczęśliwość niebiana!"
    verse: true
    chunks:
      - pl: "Już ptak niebieski, widzę, skrzydłem błyska,"
        ru: "Уже небесная птица, вижу, сверкает крылом,"
      - pl: "\nMigoce ku nam piórami jasnemi,"
        ru: "мерцает к нам светлыми перьями,"
        note: "jasnemi — ныне jasnymi"
      - pl: "\nAż moje oczy, znieść nie mogąc z bliska"
        ru: "пока мои глаза, не в силах вынести вблизи"
      - pl: "\nTakiego blasku, opadły ku ziemi."
        ru: "такого блеска, не опустились к земле."
      - pl: "\nOn lekką łódką, co zdało się, chodzi"
        ru: "Он на лёгкой лодке, что, казалось, ходит"
      - pl: "\nPo fal wierzchołkach, do brzegu się zbliża:"
        ru: "по вершинам волн, приближается к берегу:"
      - pl: "\nNiebieski sternik stał pełen wesela,"
        ru: "небесный кормчий стоял, полный радости,"
      - pl: "\nNa twarzy jego była wypisana"
        ru: "на лице его было написано,"
      - pl: "\nZdaje się cała szczęśliwość niebiana!"
        ru: "казалось, всё небесное блаженство!"
        note: "niebiany — небесный"
    words: { "ptak": ptak, "znieść": zniesc, "blasku": blask, "lekką": lekki, "łódką": lodka, "wypisana": wypisac }
  - clean: "Więcej sta duchów siedziało w tej łodzi.\n*Kiedy z Egiptu szedł lud Izraela*:\nWszyscy społecznie, z zachwytu wyrazem\nTen psalm tak wzniosły śpiewali zarazem.\nAnioł ich żegnał świętym znakiem krzyża,\nKażdy co żywo do brzegu się kinął,\nOn jak przypłynął, tak, lekki, odpłynął:\nTłum wysadzony na brzeg przez anioła,\nW przerwach ciekawie poglądał dokoła,\nJak ten, co widzi rzecz obcą wzrokowi."
    verse: true
    chunks:
      - pl: "Więcej sta duchów siedziało w tej łodzi."
        ru: "Больше сотни духов сидело в этой лодке."
        note: "sta — род. п. от sto"
      - pl: "\n*Kiedy z Egiptu szedł lud Izraela*:"
        ru: "«Когда из Египта шёл народ Израиля»:"
        note: "псалом 113 (In exitu Israel)"
      - pl: "\nWszyscy społecznie, z zachwytu wyrazem"
        ru: "все вместе, с выражением восторга,"
      - pl: "\nTen psalm tak wzniosły śpiewali zarazem."
        ru: "этот столь возвышенный псалом пели разом."
      - pl: "\nAnioł ich żegnał świętym znakiem krzyża,"
        ru: "Ангел благословил их святым знамением креста,"
      - pl: "\nKażdy co żywo do brzegu się kinął,"
        ru: "каждый живо бросился к берегу,"
        note: "kinąć się — устар. «кинуться»"
      - pl: "\nOn jak przypłynął, tak, lekki, odpłynął:"
        ru: "он как приплыл, так, лёгкий, и отплыл:"
      - pl: "\nTłum wysadzony na brzeg przez anioła,"
        ru: "толпа, высаженная ангелом на берег,"
      - pl: "\nW przerwach ciekawie poglądał dokoła,"
        ru: "в перерывах с любопытством озиралась кругом,"
        note: "poglądać — поглядывать"
      - pl: "\nJak ten, co widzi rzecz obcą wzrokowi."
        ru: "как тот, кто видит вещь, чужую взгляду."
    words: { "zachwytu": zachwyt, "wyrazem": wyraz, "krzyża": krzyz, "wysadzony": wysadzic, "ciekawie": ciekawie, "dokoła": dokola }
  - clean: "Już słońce siało dzień po bożym świecie,\nSłoneczna strzała trafnie celująca\nZe środka nieba Koziorożca strąca.\nZ przybyłych duchów nas i ci, i owi\nPodnosząc czoła zagadli rozmową:\n«Drogę do góry wskażcie nam, gdy wiecie»."
    verse: true
    chunks:
      - pl: "Już słońce siało dzień po bożym świecie,"
        ru: "Уже солнце сеяло день по Божьему миру,"
      - pl: "\nSłoneczna strzała trafnie celująca"
        ru: "солнечная стрела, метко целящая,"
        note: "trafnie — метко"
      - pl: "\nZe środka nieba Koziorożca strąca."
        ru: "сбивает Козерога с середины неба."
        note: "Koziorożec — Козерог"
      - pl: "\nZ przybyłych duchów nas i ci, i owi"
        ru: "Из прибывших духов и те, и другие,"
      - pl: "\nPodnosząc czoła zagadli rozmową:"
        ru: "подняв головы, заговорили с нами:"
        note: "zagadnąć — заговорить"
      - pl: "\n«Drogę do góry wskażcie nam, gdy wiecie»."
        ru: "«Укажите нам дорогу в гору, если знаете»."
    words: { "Słoneczna": sloneczny, "strzała": strzala, "celująca": celowac, "strąca": stracac, "Podnosząc": podnosic, "wskażcie": wskazac }
  - clean: "I odpowiedział Wirgili w te słowo:\n«Może myślicie, że to miejsce znamy\nJak wy, my obcy tutaj przybywamy,\nNa chwil niewiele przyszliśmy przed wami,\nTak nużącymi i złymi drogami,\nŻe tędy lubo znużeni bezdrożem,\nJakby igraszką dojść pod górę możem»."
    verse: true
    chunks:
      - pl: "I odpowiedział Wirgili w te słowo:"
        ru: "И ответил Вергилий такими словами:"
      - pl: "\n«Może myślicie, że to miejsce znamy"
        ru: "«Может быть, вы думаете, что мы знаем это место,"
      - pl: "\nJak wy, my obcy tutaj przybywamy,"
        ru: "как вы, мы прибываем сюда чужими,"
      - pl: "\nNa chwil niewiele przyszliśmy przed wami,"
        ru: "мы пришли лишь немногими мгновениями прежде вас,"
      - pl: "\nTak nużącymi i złymi drogami,"
        ru: "такими утомительными и дурными дорогами,"
      - pl: "\nŻe tędy lubo znużeni bezdrożem,"
        ru: "что здесь, хоть и измученные бездорожьем,"
        note: "lubo — устар. «хоть»"
      - pl: "\nJakby igraszką dojść pod górę możem»."
        ru: "словно шутя мы можем дойти до горы»."
        note: "igraszka — забава, шутка"
    words: { "odpowiedział": odpowiedziec, "obcy": obcy, "przybywamy": przybywac, "tędy": tedy, "dojść": dojsc, "górę": gora }
  - clean: "Duchy spostrzegłszy po moim oddechu,\nŻe jak żyjący oddycham piersiami,\nZbladły zarazem, widząc rzecz tak dziwną!\nJak posła, gałąź gdy niesie oliwną,\nCiekawe tłumy jak wałem otoczą,\nOn co tchu śpieszy, lecz zamiast pospiechu\nW nacisku zgrai nieraz krok zatrzyma;\nTak ciekawymi mierząc mnie oczyma,\nDuchy wkoło mnie cisną się i tłoczą,\nZapominając drogi oczyszczenia."
    verse: true
    chunks:
      - pl: "Duchy spostrzegłszy po moim oddechu,"
        ru: "Духи, заметив по моему дыханию,"
      - pl: "\nŻe jak żyjący oddycham piersiami,"
        ru: "что я, как живой, дышу грудью,"
      - pl: "\nZbladły zarazem, widząc rzecz tak dziwną!"
        ru: "побледнели разом, видя вещь столь странную!"
      - pl: "\nJak posła, gałąź gdy niesie oliwną,"
        ru: "Как гонца, когда он несёт оливковую ветвь,"
        note: "oliwny — оливковый"
      - pl: "\nCiekawe tłumy jak wałem otoczą,"
        ru: "любопытные толпы окружают, как валом,"
      - pl: "\nOn co tchu śpieszy, lecz zamiast pospiechu"
        ru: "он со всех ног спешит, но вместо спешки"
      - pl: "\nW nacisku zgrai nieraz krok zatrzyma;"
        ru: "в давке толпы не раз останавливает шаг;"
      - pl: "\nTak ciekawymi mierząc mnie oczyma,"
        ru: "так, измеряя меня любопытными глазами,"
      - pl: "\nDuchy wkoło mnie cisną się i tłoczą,"
        ru: "духи вокруг меня теснятся и толпятся,"
      - pl: "\nZapominając drogi oczyszczenia."
        ru: "забывая путь очищения."
        note: "oczyszczenie — очищение"
    words: { "spostrzegłszy": spostrzec, "niesie": niesc, "tchu": dech, "śpieszy": spieszyc, "nacisku": nacisk, "mierząc": mierzyc }
  - clean: "Wystąpił jeden i ku mnie uprzejmie\nWyciąga ręce, zda się, że obejmie,\nChcę z nim zamienić moje uściśnienia.\nO cienie! kształt wasz to mara znikoma,\nTrzy razy chciałem go objąć rękoma,\nTrzy razy próżne opadły na piersi."
    verse: true
    chunks:
      - pl: "Wystąpił jeden i ku mnie uprzejmie"
        ru: "Выступил один и ко мне учтиво"
      - pl: "\nWyciąga ręce, zda się, że obejmie,"
        ru: "протягивает руки, кажется, обнимет,"
      - pl: "\nChcę z nim zamienić moje uściśnienia."
        ru: "я хочу обменяться с ним объятиями."
        note: "uściśnienie — объятие"
      - pl: "\nO cienie! kształt wasz to mara znikoma,"
        ru: "О тени! облик ваш — мимолётный призрак,"
        note: "znikomy — мимолётный"
      - pl: "\nTrzy razy chciałem go objąć rękoma,"
        ru: "три раза я хотел обнять его руками,"
      - pl: "\nTrzy razy próżne opadły na piersi."
        ru: "три раза они пустыми упали на грудь."
    words: { "Wystąpił": wystapic, "Wyciąga": wyciagac, "obejmie": objac, "zamienić": zamienic, "kształt": ksztalt, "piersi": piers }
  - clean: "Podziw snadź w mojej twarzy się malował,\nBo się uśmiechnął cień i cofnął kroku;\nWidząc, że jeszcze jam za nim szlakował,\nAbym stał w miejscu, ze słodyczą w oku\nRzekł do mnie — wtenczas, kto on był, poznałem,\nBy ze mną mówił, prosiłem z zapałem\nI odpowiedział: «Gdzież są od nas szczersi?"
    verse: true
    chunks:
      - pl: "Podziw snadź w mojej twarzy się malował,"
        ru: "Изумление, видно, отражалось на моём лице,"
      - pl: "\nBo się uśmiechnął cień i cofnął kroku;"
        ru: "ибо тень улыбнулась и отступила;"
      - pl: "\nWidząc, że jeszcze jam za nim szlakował,"
        ru: "видя, что я ещё шёл за ним следом,"
        note: "szlakować — устар. «идти следом»"
