      - pl: "\nCzy twoje myśli, wirem tego szału"
        ru: "Неужели твои мысли, вихрем этого безумия"
        note: "wir — вихрь, водоворот"
      - pl: "\nZ tych miejsc porwane, gdzie indziej się kręcą?"
