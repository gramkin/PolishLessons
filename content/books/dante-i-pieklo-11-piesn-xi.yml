        note: "księga morału — «Этика» Аристотеля"
      - pl: "\nktóra trzy krewkie skłonności rozważa:"
        ru: "что рассматривает три пылких склонности:"
        note: "krewki — горячий; skłonność — склонность"
      - pl: "\nNiepowściągliwość, gniew i złość zwierzęcą."
        ru: "невоздержность, гнев и звериную злобу."
