# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 11
chapterTitle: "Pieśń XI"
chapterTitleRu: "Песнь XI. Устройство ада"
level: B2
paragraphs:
  - clean: "(Papież Anastazy. Podział dalszych kręgów.)"
    chunks:
      - pl: "(Papież Anastazy. Podział dalszych kręgów.)"
        ru: "(Папа Анастасий. Деление дальнейших кругов.)"
        note: "podział — деление"
    words: { "Papież": papiez, "dalszych": daleki, "kręgów": krag }
  - clean: "Przyszliśmy jakby nad stromy brzeg lądu,\nCo skał gruzami wokół się najeża,\nNad przepaść dzikszej męczarni i chłosty.\nTam chcąc uniknąć straszliwego swądu,\nJaki z otchłani głębokiej wynika,\nWespół z mym wodzem stanąłem ukryty\nPod jedną ścianą wielkiego pomnika,\nGdzie taki napis w kamieniu był ryty:\n«Anastazego strzegą proch papieża,\nKtórego Fotyn ściągnął z drogi prostej». —\nTutaj na chwilę krok zwolnić wypada,\nBy zmysł do swądu pierwszego wrażenia\nPrzywyknął trochę. Tak mistrz mój powiada:"
    verse: true
    chunks:
      - pl: "Przyszliśmy jakby nad stromy brzeg lądu,"
        ru: "Мы пришли словно к крутому краю земли,"
        note: "ląd — суша"
      - pl: "\nCo skał gruzami wokół się najeża,"
        ru: "что обломками скал щетинится вокруг,"
        note: "gruzy — обломки; najeżać się — щетиниться"
      - pl: "\nNad przepaść dzikszej męczarni i chłosty."
        ru: "над пропастью более дикой муки и бичевания."
        note: "chłosta — порка, бичевание"
      - pl: "\nTam chcąc uniknąć straszliwego swądu,"
        ru: "Там, желая избежать страшного смрада,"
        note: "swąd — чад, смрад"
      - pl: "\nJaki z otchłani głębokiej wynika,"
        ru: "что исходит из глубокой бездны,"
        note: "wynikać — исходить"
      - pl: "\nWespół z mym wodzem stanąłem ukryty"
        ru: "вместе с моим вождём я встал, укрывшись,"
        note: "wespół — вместе"
      - pl: "\nPod jedną ścianą wielkiego pomnika,"
        ru: "у одной стены большого надгробия,"
        note: "pomnik — памятник, надгробие"
      - pl: "\nGdzie taki napis w kamieniu był ryty:"
        ru: "где такая надпись была высечена в камне:"
        note: "ryty — высеченный, вырезанный"
      - pl: "\n«Anastazego strzegą proch papieża,"
        ru: "«[Здесь] стерегут прах папы Анастасия,"
        note: "strzec — стеречь; Anastazy — папа Анастасий II"
      - pl: "\nKtórego Fotyn ściągnął z drogi prostej». —"
        ru: "которого Фотин совлёк с прямого пути»."
        note: "Fotyn — Фотин, еретик; ściągnąć — стащить, совлечь"
      - pl: "\nTutaj na chwilę krok zwolnić wypada,"
        ru: "Здесь на минуту следует замедлить шаг,"
        note: "zwolnić — замедлить; wypada — следует"
      - pl: "\nBy zmysł do swądu pierwszego wrażenia"
        ru: "чтобы чувство к смраду первого впечатления"
      - pl: "\nPrzywyknął trochę. Tak mistrz mój powiada:"
        ru: "немного привыкло. Так говорит мой учитель:"
        note: "przywyknąć — привыкнуть"
    words: { "lądu": lad, "wynika": wynikac, "wodzem": wodz, "pomnika": pomnik, "strzegą": strzec, "wypada": wypadac }
  - clean: "«Potem nie będziem nań dawać baczenia». —\nJam rzekł: «Znajdź sposób i rozważ go ściśle,\nŻeby zwłóczony czas nie szedł daremnie».\nA on: «Ty widzisz, że ja o tym myślę.\nSą w środku skał tych» — mówił mistrz rad ze mnie,\n«Trzy kręgi, co się zwężają stopniami\nJako te, cośmy rzucili za nami."
    verse: true
    chunks:
      - pl: "«Potem nie będziem nań dawać baczenia». —"
        ru: "«Потом мы не будем обращать на него внимания»."
        note: "dawać baczenie — обращать внимание; nań = na niego"
      - pl: "\nJam rzekł: «Znajdź sposób i rozważ go ściśle,"
        ru: "Я сказал: «Найди средство и обдумай его тщательно,"
        note: "rozważyć — обдумать; ściśle — точно"
      - pl: "\nŻeby zwłóczony czas nie szedł daremnie»."
        ru: "чтобы промедленное время не шло напрасно»."
        note: "zwłóczony — устар. «промедленный»"
      - pl: "\nA on: «Ty widzisz, że ja o tym myślę."
        ru: "А он: «Ты видишь, что я об этом думаю."
      - pl: "\nSą w środku skał tych» — mówił mistrz rad ze mnie,"
        ru: "Внутри этих скал, — говорил учитель, довольный мной, —"
        note: "rad z kogoś — довольный кем-л."
      - pl: "\n«Trzy kręgi, co się zwężają stopniami"
        ru: "три круга, что сужаются ступенями,"
        note: "zwężać się — сужаться; stopień — ступень"
      - pl: "\nJako te, cośmy rzucili za nami."
        ru: "как те, что мы оставили позади."
        note: "cośmy = co + -śmy"
    words: { "rzekł": rzec, "rozważ": rozwazyc, "ściśle": scisle, "skał": skala, "mistrz": mistrz, "stopniami": stopien }
  - clean: "Mnóstwo tam duchów, a wszystkie ladaco.\nWprzód nim je poznasz, wiedzieć tobie trzeba,\nJak są w tych kręgach zamknięci i za co.\nWszelkie zło, które pobudza gniew nieba,\nMa swój kres w krzywdzie, bo grzechu każdego\nCelem jest działać na krzywdę drugiego."
    verse: true
    chunks:
      - pl: "Mnóstwo tam duchów, a wszystkie ladaco."
        ru: "Множество там духов, и все никчёмные."
        note: "ladaco — никчёмный"
      - pl: "\nWprzód nim je poznasz, wiedzieć tobie trzeba,"
        ru: "Прежде чем ты их узнаешь, тебе нужно знать,"
      - pl: "\nJak są w tych kręgach zamknięci i za co."
        ru: "как они заключены в этих кругах и за что."
      - pl: "\nWszelkie zło, które pobudza gniew nieba,"
        ru: "Всякое зло, что вызывает гнев неба,"
      - pl: "\nMa swój kres w krzywdzie, bo grzechu każdego"
        ru: "имеет свою цель в обиде, ибо каждого греха"
        note: "krzywda — обида, вред; kres — предел, цель"
      - pl: "\nCelem jest działać na krzywdę drugiego."
        ru: "цель — действовать во вред другому."
        note: "na krzywdę — во вред"
    words: { "Mnóstwo": mnostwo, "Wszelkie": wszelki, "gniew": gniew, "kres": kres, "krzywdzie": krzywda, "grzechu": grzech }
  - clean: "Fałsz jako swojski grzech w człeka nałogu\nOd gwałtu więcej obrzydły jest Bogu;\nPrzeto szalbierze w głębszej siedzą jamie,\nA duch ich z większą boleścią się łamie.\nDla gwałtowników jest pierwszy krąg cały,\nTak zbudowany, że ma trzy oddziały,\nBo trzem osobom szkodzi gwałt zuchwały:\nBogu, bliźniemu i samemu sobie,\nKtóry czynimy bądź wprost na osobie,\nBądź na jej dobru; a co moja mowa\nObjaśni tobie przez następne słowa."
    verse: true
    chunks:
      - pl: "Fałsz jako swojski grzech w człeka nałogu"
        ru: "Обман, как свойственный человеку грех по привычке,"
        note: "swojski — свойственный, родной; człek — устар. «человек»"
      - pl: "\nOd gwałtu więcej obrzydły jest Bogu;"
        ru: "более насилия мерзок Богу;"
        note: "od gwałtu więcej — устар. «больше, чем насилие»"
      - pl: "\nPrzeto szalbierze w głębszej siedzą jamie,"
        ru: "потому мошенники сидят в более глубокой яме,"
        note: "przeto — потому; szalbierz — мошенник"
      - pl: "\nA duch ich z większą boleścią się łamie."
        ru: "а дух их ломается с большей болью."
      - pl: "\nDla gwałtowników jest pierwszy krąg cały,"
        ru: "Для насильников весь первый круг,"
        note: "gwałtownik — насильник"
      - pl: "\nTak zbudowany, że ma trzy oddziały,"
        ru: "так построенный, что имеет три отдела,"
        note: "oddział — отдел"
      - pl: "\nBo trzem osobom szkodzi gwałt zuchwały:"
        ru: "ибо трём лицам вредит дерзкое насилие:"
      - pl: "\nBogu, bliźniemu i samemu sobie,"
        ru: "Богу, ближнему и самому себе,"
        note: "bliźni — ближний"
      - pl: "\nKtóry czynimy bądź wprost na osobie,"
        ru: "которое мы совершаем либо прямо над лицом,"
        note: "bądź… bądź… — либо… либо…"
      - pl: "\nBądź na jej dobru; a co moja mowa"
        ru: "либо над его добром; а это моя речь"
        note: "dobro — здесь «имущество»"
      - pl: "\nObjaśni tobie przez następne słowa."
        ru: "объяснит тебе следующими словами."
    words: { "głębszej": gleboki, "jamie": jama, "łamie": lamac, "zbudowany": zbudowac, "oddziały": oddzial, "szkodzi": szkodzic }
  - clean: "Gwałt się dopełnia naprzeciw bliźniemu,\nGdy śmierć lub rany zadaje się jemu,\nAlbo przez kradzież, łupież, podpalenie\nGwałtownie jego rujnuje się mienie.\nWięc mężobójce, co śmierć zadawali,\nCo podpalali, łupili, kradali,\nW pierwszy są oddział strąceni w płomienie."
    verse: true
    chunks:
      - pl: "Gwałt się dopełnia naprzeciw bliźniemu,"
        ru: "Насилие свершается против ближнего,"
        note: "dopełniać się — свершаться; naprzeciw — против"
      - pl: "\nGdy śmierć lub rany zadaje się jemu,"
        ru: "когда ему наносят смерть или раны,"
        note: "zadawać — наносить"
      - pl: "\nAlbo przez kradzież, łupież, podpalenie"
        ru: "или через кражу, грабёж, поджог"
        note: "łupież — грабёж; podpalenie — поджог"
      - pl: "\nGwałtownie jego rujnuje się mienie."
        ru: "насильственно разоряется его имущество."
        note: "rujnować — разорять"
      - pl: "\nWięc mężobójce, co śmierć zadawali,"
        ru: "Итак, человекоубийцы, что предавали смерти,"
        note: "mężobójca — убийца (устар.)"
      - pl: "\nCo podpalali, łupili, kradali,"
        ru: "что поджигали, грабили, крали,"
        note: "łupić — грабить; kradać — устар. «красть»"
      - pl: "\nW pierwszy są oddział strąceni w płomienie."
        ru: "низвергнуты в пламя в первом отделе."
    words: { "śmierć": smierc, "zadaje": zadawac, "kradzież": kradziez, "podpalenie": podpalic, "pierwszy": pierwszy, "płomienie": plomien }
  - clean: "Ten, co na siebie lub na własne mienie\nPodnosi rękę, za takie szaleństwo\nIdzie w dział drugi na wieczne męczeństwo.\nA tak tam cierpi duch, co z tego świata\nZostał wygnańcem dobrowolną wolą,\nKto na grze trawi swe mienie i lata\nI ten, co zamiast cieszyć się swą dolą,\nPłacze i skarży na wszystko z nałogu."
    verse: true
    chunks:
      - pl: "Ten, co na siebie lub na własne mienie"
        ru: "Тот, кто на себя или на собственное имущество"
      - pl: "\nPodnosi rękę, za takie szaleństwo"
        ru: "поднимает руку, за такое безумие"
      - pl: "\nIdzie w dział drugi na wieczne męczeństwo."
        ru: "идёт во второй отдел на вечное мучение."
      - pl: "\nA tak tam cierpi duch, co z tego świata"
        ru: "И так там страдает дух, что из этого мира"
      - pl: "\nZostał wygnańcem dobrowolną wolą,"
        ru: "стал изгнанником по доброй воле,"
        note: "wygnaniec — изгнанник; самоубийца"
      - pl: "\nKto na grze trawi swe mienie i lata"
        ru: "кто на игру тратит своё имущество и годы,"
        note: "trawić — тратить, губить"
      - pl: "\nI ten, co zamiast cieszyć się swą dolą,"
        ru: "и тот, кто вместо того, чтобы радоваться своей доле,"
      - pl: "\nPłacze i skarży na wszystko z nałogu."
        ru: "плачет и жалуется на всё по привычке."
    words: { "Podnosi": podnosic, "szaleństwo": szalenstwo, "wieczne": wieczny, "cierpi": cierpiec, "duch": duch, "grze": gra }
  - clean: "Gwałt jeszcze można czynić przeciw Bogu,\nPrzecząc go w sercu, miłując bluźnierstwa\nI klnąc przyrodę i jej dobrodziejstwa.\nA przeto oddział pomieszcza najmniejszy\nNacechowanych pieczęcią Sodomy,\nPiętnem Kahorsu i ten tam zamknięty,\nCo sercem, słowy, przeciw Bogu grzeszy."
    verse: true
    chunks:
      - pl: "Gwałt jeszcze można czynić przeciw Bogu,"
        ru: "Насилие можно ещё совершать против Бога,"
      - pl: "\nPrzecząc go w sercu, miłując bluźnierstwa"
        ru: "отрицая его в сердце, любя богохульство"
        note: "przeczyć — отрицать; miłować — любить; bluźnierstwo — богохульство"
      - pl: "\nI klnąc przyrodę i jej dobrodziejstwa."
        ru: "и проклиная природу и её благодеяния."
        note: "przyroda — природа; dobrodziejstwo — благодеяние"
      - pl: "\nA przeto oddział pomieszcza najmniejszy"
        ru: "А потому самый малый отдел вмещает"
        note: "pomieszczać — вмещать"
      - pl: "\nNacechowanych pieczęcią Sodomy,"
        ru: "отмеченных печатью Содома,"
        note: "nacechowany — отмеченный; pieczęć — печать"
      - pl: "\nPiętnem Kahorsu i ten tam zamknięty,"
        ru: "клеймом Каора, и там заключён тот,"
        note: "Kahors — Каор, город ростовщиков"
      - pl: "\nCo sercem, słowy, przeciw Bogu grzeszy."
        ru: "кто сердцем, словами грешит против Бога."
    words: { "można": mozna, "czynić": czynic, "Przecząc": przeczyc, "sercu": serce, "najmniejszy": maly, "Nacechowanych": nacechowac }
  - clean: "Fałsz, ten sumienia prześladowca wieczny,\nCzłowiek go może użyć przeciw temu,\nKto mu nie ufa i kto ufa jemu.\nDrugi ten rodzaj fałszu niebezpieczny,\nRozrywa węzeł miłości społecznej;\nDlatego w drugim oddziale zamknięto\nGraczów, świętoszków, pochlebców z kolei,\nSymonijaków, fałszerzy, złodziei\nI wszystkich brudem skalanych podobnym!"
    verse: true
    chunks:
      - pl: "Fałsz, ten sumienia prześladowca wieczny,"
        ru: "Обман, этот вечный гонитель совести,"
        note: "prześladowca — гонитель"
      - pl: "\nCzłowiek go może użyć przeciw temu,"
        ru: "человек может обратить против того,"
      - pl: "\nKto mu nie ufa i kto ufa jemu."
        ru: "кто ему не доверяет и кто доверяет ему."
      - pl: "\nDrugi ten rodzaj fałszu niebezpieczny,"
        ru: "Этот второй род обмана опасен,"
      - pl: "\nRozrywa węzeł miłości społecznej;"
        ru: "разрывает узел общественной любви;"
        note: "społeczny — общественный"
      - pl: "\nDlatego w drugim oddziale zamknięto"
        ru: "потому во втором отделе заключили"
      - pl: "\nGraczów, świętoszków, pochlebców z kolei,"
        ru: "игроков, лицемеров, льстецов по порядку,"
        note: "gracz — игрок; świętoszek — ханжа; pochlebca — льстец"
      - pl: "\nSymonijaków, fałszerzy, złodziei"
        ru: "симонистов, фальшивомонетчиков, воров"
        note: "symonijak — симонист (торговец церковными должностями); fałszerz — фальсификатор"
      - pl: "\nI wszystkich brudem skalanych podobnym!"
        ru: "и всех запятнанных подобной грязью!"
        note: "skalany — запятнанный"
    words: { "sumienia": sumienie, "węzeł": wezel, "społecznej": spoleczny, "Graczów": gracz, "złodziei": zlodziej, "brudem": brud }
  - clean: "Pierwszy fałsz zasię niszczy miłość świętą,\nWszczepioną w serca pociągiem osobnym;\nNiszczy uczucie jej pokrewne, wiarę,\nA z której ufność wzajemna wynika.\nDlatego w kręgu najmniejszym za karę,\nW tym środku światów, którego dno ciasno\nRazem jest gruntem pod miasto ogniste,\nKto zdradził, cierpi męki wiekuiste»."
    verse: true
    chunks:
      - pl: "Pierwszy fałsz zasię niszczy miłość świętą,"
        ru: "Первый же обман уничтожает святую любовь,"
        note: "zasię — устар. «же, однако»"
      - pl: "\nWszczepioną w serca pociągiem osobnym;"
        ru: "привитую в сердца особым влечением;"
        note: "wszczepić — привить; pociąg — влечение"
      - pl: "\nNiszczy uczucie jej pokrewne, wiarę,"
        ru: "уничтожает родственное ей чувство, веру,"
      - pl: "\nA z której ufność wzajemna wynika."
        ru: "из которой рождается взаимное доверие."
        note: "ufność — доверие"
      - pl: "\nDlatego w kręgu najmniejszym za karę,"
        ru: "Потому в самом малом круге, в наказание,"
        note: "za karę — в наказание"
      - pl: "\nW tym środku światów, którego dno ciasno"
        ru: "в этом средоточии миров, чьё тесное дно"
      - pl: "\nRazem jest gruntem pod miasto ogniste,"
        ru: "вместе служит основанием огненному городу,"
      - pl: "\nKto zdradził, cierpi męki wiekuiste»."
        ru: "кто предал — терпит вечные муки»."
        note: "zdradzić — предать"
    words: { "niszczy": niszczyc, "pociągiem": pociag, "osobnym": osobny, "karę": kara, "gruntem": grunt, "zdradził": zdradzic }
  - clean: "A ja: «Twe słowa, mistrzu, są dość jasne.\nStaje mi w oczach cała otchłań dzika,\nJej lud, mieszkanie każdego grzesznika.\nLecz powiedz, ci, co wtrąceni do błota,\nKtórych deszcz chłoszcze, ci, których wiatr miota,\nI ci łający i wzajem łajani,\nDlaczego w mieście ognia niekarani,\nJeśli jak drudzy są u Boga w gniewie?»"
    verse: true
    chunks:
      - pl: "A ja: «Twe słowa, mistrzu, są dość jasne."
        ru: "А я: «Твои слова, учитель, достаточно ясны."
      - pl: "\nStaje mi w oczach cała otchłań dzika,"
        ru: "Встаёт перед моими глазами вся дикая бездна,"
      - pl: "\nJej lud, mieszkanie każdego grzesznika."
        ru: "её народ, жилище каждого грешника."
      - pl: "\nLecz powiedz, ci, co wtrąceni do błota,"
        ru: "Но скажи: те, что низвергнуты в грязь,"
        note: "wtrącony — низвергнутый"
      - pl: "\nKtórych deszcz chłoszcze, ci, których wiatr miota,"
        ru: "которых сечёт дождь, те, которых мечет ветер,"
        note: "chłostać — хлестать"
      - pl: "\nI ci łający i wzajem łajani,"
        ru: "и те, что бранятся и взаимно бранимы,"
        note: "łajać — бранить"
      - pl: "\nDlaczego w mieście ognia niekarani,"
        ru: "почему в городе огня они не наказаны,"
        note: "niekarany — ненаказанный"
      - pl: "\nJeśli jak drudzy są u Boga w gniewie?»"
