    words: { "szał": szal, "porwane": porwac, "indziej": indziej, "kręcą": krecic, "Przypomnij": przypomniec, "księgę": ksiega }
  - clean: "Pierwsza z nich, jako mniej Boga obraża,\nLżejsze od drugich ponosi karanie.\nJeśli przypomnisz, zważywszy to zdanie,\nJakie tam dusze, choć grzechem zatrute,\nPoza obrębem tym czynią pokutę;\nZrozumiesz lepiej, dlaczego ich grono\nOd tych niewiernych w piekle oddzielono\nI Bóg dlaczego w słusznym kar wymiarze\nMniej obrażony, łagodniej ich karze»."
    verse: true
    chunks:
      - pl: "Pierwsza z nich, jako mniej Boga obraża,"
        ru: "Первая из них, как менее оскорбляющая Бога,"
      - pl: "\nLżejsze od drugich ponosi karanie."
        ru: "несёт более лёгкое наказание, чем другие."
        note: "karanie — наказание"
      - pl: "\nJeśli przypomnisz, zważywszy to zdanie,"
        ru: "Если вспомнишь, взвесив это мнение,"
        note: "zważywszy — «взвесив»"
      - pl: "\nJakie tam dusze, choć grzechem zatrute,"
        ru: "какие там души, хоть и отравленные грехом,"
        note: "zatruty — отравленный"
      - pl: "\nPoza obrębem tym czynią pokutę;"
        ru: "вне этой ограды несут покаяние,"
        note: "obręb — пределы, ограда; pokuta — покаяние"
      - pl: "\nZrozumiesz lepiej, dlaczego ich grono"
        ru: "ты лучше поймёшь, почему их круг"
      - pl: "\nOd tych niewiernych w piekle oddzielono"
        ru: "от этих неверных в аду отделили"
      - pl: "\nI Bóg dlaczego w słusznym kar wymiarze"
        ru: "и почему Бог в справедливой мере кар,"
        note: "wymiar — мера"
      - pl: "\nMniej obrażony, łagodniej ich karze»."
        ru: "менее оскорблённый, мягче их карает»."
        note: "łagodniej — мягче"
    words: { "zatrute": zatruc, "obrębem": obreb, "grono": grono, "słusznym": sluszny, "wymiarze": wymiar, "obrażony": obrazic }
  - clean: "«O, słońce!» rzekłem, «co leczysz wzrok chory,\nWracając rzeczom właściwe kolory,\nGdy myśl wyłuszczasz z jasnością i siłą,\nRównie mi wątpić jak i wiedzieć miło!\nJeszcze raz powtórz i węzeł ostatni\nRozetnij! Powiedz: czym lichwa znieważa\nDobroć Najwyższą?» Mistrz mi odpowiada:\n«Filozofija uczy najdostatniej,\nKto tylko zgłębia tajnie tej nauki,\nŻe byt natura na początku wzięła\nZ mądrości bożej i jej arcysztuki;"
    verse: true
    chunks:
      - pl: "«O, słońce!» rzekłem, «co leczysz wzrok chory,"
        ru: "«О солнце, — сказал я, — что лечишь больной взор,"
      - pl: "\nWracając rzeczom właściwe kolory,"
        ru: "возвращая вещам их собственные цвета,"
      - pl: "\nGdy myśl wyłuszczasz z jasnością i siłą,"
        ru: "когда ты излагаешь мысль с ясностью и силой,"
        note: "wyłuszczać — излагать, растолковывать"
      - pl: "\nRównie mi wątpić jak i wiedzieć miło!"
        ru: "мне одинаково мило и сомневаться, и знать!"
        note: "wątpić — сомневаться"
      - pl: "\nJeszcze raz powtórz i węzeł ostatni"
        ru: "Ещё раз повтори и последний узел"
      - pl: "\nRozetnij! Powiedz: czym lichwa znieważa"
        ru: "разрежь! Скажи: чем ростовщичество оскорбляет"
        note: "rozciąć — разрезать; lichwa — ростовщичество; znieważać — оскорблять"
      - pl: "\nDobroć Najwyższą?» Mistrz mi odpowiada:"
        ru: "Высшую Благость?» Учитель отвечает мне:"
      - pl: "\n«Filozofija uczy najdostatniej,"
        ru: "«Философия учит обильнее всего"
        note: "najdostatniej — обильнее всего"
      - pl: "\nKto tylko zgłębia tajnie tej nauki,"
        ru: "всякого, кто проникает в тайны этой науки,"
        note: "zgłębiać — постигать; tajnie — тайны"
      - pl: "\nŻe byt natura na początku wzięła"
        ru: "что бытие природа в начале взяла"
        note: "byt — бытие"
      - pl: "\nZ mądrości bożej i jej arcysztuki;"
        ru: "из мудрости Божьей и её высшего искусства;"
        note: "arcysztuka — высшее искусство"
    words: { "wzrok": wzrok, "jasnością": jasnosc, "Równie": rownie, "znieważa": zniewazac, "Dobroć": dobroc, "mądrości": madrosc }
  - clean: "Twoja fizyka toż samo powiada.\nNie przewracając długo kart jej dzieła,\nZnajdziesz, że sztuka dąży, ile zdoła\nW ślad za naturą, jak za mistrzem szkoła,\nŻe sztuka ludzka jest jak boża wnuka!\nGdy z tych dwóch zasad: natura i sztuka,\nStanie ci w myśli Genezis zasada,\nUznasz, że daje nam natura życie,\nA sztuka pomoc i życia użycie."
    verse: true
    chunks:
      - pl: "Twoja fizyka toż samo powiada."
        ru: "твоя «Физика» говорит то же самое."
        note: "toż samo — то же самое; «Физика» Аристотеля"
      - pl: "\nNie przewracając długo kart jej dzieła,"
        ru: "Не переворачивая долго страниц её труда,"
        note: "karta — страница"
      - pl: "\nZnajdziesz, że sztuka dąży, ile zdoła"
        ru: "найдёшь, что искусство стремится, сколько может,"
        note: "dążyć — стремиться; zdołać — смочь"
      - pl: "\nW ślad za naturą, jak za mistrzem szkoła,"
        ru: "вслед за природой, как школа за учителем,"
      - pl: "\nŻe sztuka ludzka jest jak boża wnuka!"
        ru: "что искусство человеческое — как Божья внучка!"
      - pl: "\nGdy z tych dwóch zasad: natura i sztuka,"
        ru: "Когда из этих двух начал — природы и искусства —"
        note: "zasada — основание, начало"
      - pl: "\nStanie ci w myśli Genezis zasada,"
        ru: "встанет у тебя в мысли начало Книги Бытия,"
        note: "Genezis — Книга Бытия"
      - pl: "\nUznasz, że daje nam natura życie,"
        ru: "признаешь, что природа даёт нам жизнь,"
      - pl: "\nA sztuka pomoc i życia użycie."
        ru: "а искусство — помощь и пользование жизнью."
        note: "użycie — пользование"
    words: { "fizyka": fizyka, "przewracając": przewracac, "dzieła": dzielo, "dąży": dazyc, "zdoła": zdolac, "naturą": natura }
