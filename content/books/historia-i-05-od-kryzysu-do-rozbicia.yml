  - clean: "Co ciekawe, sam tekst testamentu się nie zachował. Jego treść znamy tylko z relacji późniejszych kronikarzy, przede wszystkim Wincentego Kadłubka, i z tego, jak postępowali synowie księcia. Historycy do dziś spierają się o szczegóły: na przykład o to, jakie dokładnie ziemie dostał każdy z synów i czy najmłodszy, Kazimierz, został w ogóle uwzględniony. Bolesław Krzywousty zmarł w 1138 roku. Jego plan wyglądał rozsądnie, bo podobne zasady stosowano wtedy także na Rusi. Szybko się jednak okazało, że młodsi bracia nie zamierzają słuchać starszego. Już po kilku latach wybuchła między nimi wojna. Zaczął się okres, który w polskiej historii nazywamy rozbiciem dzielnicowym. Miał on trwać prawie dwieście lat. Polska nie przestała istnieć: wciąż był jeden Kościół z arcybiskupem w Gnieźnie, jeden język i świadomość wspólnego pochodzenia. Ale zamiast jednego państwa było ich kilka, a z czasem kilkanaście."
    draft: true
