chapter: 5
chapterTitle: "Od kryzysu do rozbicia"
chapterTitleRu: "От кризиса к раздроблённости"
level: B2
paragraphs:
  - clean: "Mieszko II, syn Bolesława Chrobrego, był w wielu sprawach przeciwieństwem ojca. Był człowiekiem wykształconym, co w tamtych czasach zdarzało się wśród władców rzadko. Niemiecka księżna Matylda w liście do niego chwaliła go za to, że modli się do Boga nie tylko w swoim języku, ale także po łacinie i po grecku. Razem z listem przysłała mu bogato zdobioną księgę liturgiczną. Był też, jak ojciec, koronowanym królem. Brakowało mu jednak tego, co miał Bolesław: szczęścia i sojuszników."
    draft: true
    chunks:
      - pl: "Mieszko II, syn Bolesława Chrobrego, był w wielu sprawach przeciwieństwem ojca."
        ru: "Мешко II, сын Болеслава Храброго, во многом был противоположностью отца."
        note: "przeciwieństwo — противоположность"
      - pl: " Był człowiekiem wykształconym, co w tamtych czasach zdarzało się wśród władców rzadko."
        ru: "Он был образованным человеком, что в те времена среди правителей встречалось редко."
        note: "wykształcony — образованный; zdarzać się — случаться, встречаться"
      - pl: " Niemiecka księżna Matylda w liście do niego chwaliła go za to, że modli się do Boga nie tylko w swoim języku, ale także po łacinie i po grecku."
        ru: "Немецкая княгиня Матильда в письме к нему хвалила его за то, что он молится Богу не только на своём языке, но и по-латыни и по-гречески."
        note: "modlić się — молиться"
      - pl: " Razem z listem przysłała mu bogato zdobioną księgę liturgiczną."
        ru: "Вместе с письмом она прислала ему богато украшенную богослужебную книгу."
        note: "zdobiony — украшенный; księga — книга (старинная, большая)"
      - pl: " Był też, jak ojciec, koronowanym królem."
        ru: "Как и отец, он был коронованным королём."
      - pl: " Brakowało mu jednak tego, co miał Bolesław: szczęścia i sojuszników."
        ru: "Но ему не хватало того, что было у Болеслава: удачи и союзников."
    words: { "przeciwieństwem": przeciwienstwo, "wykształconym": wyksztalcic, "władców": wladca, "rzadko": rzadko, "Niemiecka": niemiecki, "chwaliła": chwalic, "księgę": ksiega, "sojuszników": sojusznik }
  - clean: "Sąsiedzi Polski tylko czekali na śmierć Chrobrego. Mieszko miał dwóch starszych przyrodnich braci, Bezpryma i Ottona, którzy uważali, że korona należy się im. W 1031 roku państwo zostało zaatakowane z dwóch stron naraz. Od zachodu wkroczył cesarz Konrad II, od wschodu Jarosław Mądry, który chciał odzyskać Grody Czerwieńskie. Razem z Jarosławem szedł Bezprym. Mieszko nie zdołał się obronić i uciekł do Czech."
    draft: true
    chunks:
      - pl: "Sąsiedzi Polski tylko czekali na śmierć Chrobrego."
        ru: "Соседи Польши только и ждали смерти Храброго."
      - pl: " Mieszko miał dwóch starszych przyrodnich braci, Bezpryma i Ottona, którzy uważali, że korona należy się im."
        ru: "У Мешко было двое старших единокровных братьев, Бесприм и Оттон, которые считали, что корона полагается им."
        note: "należeć się — полагаться, причитаться"
      - pl: " W 1031 roku państwo zostało zaatakowane z dwóch stron naraz."
        ru: "В 1031 году на государство напали с двух сторон одновременно."
        note: "naraz — одновременно, сразу"
      - pl: " Od zachodu wkroczył cesarz Konrad II, od wschodu Jarosław Mądry, który chciał odzyskać Grody Czerwieńskie."
        ru: "С запада вторгся император Конрад II, с востока — Ярослав Мудрый, хотевший вернуть Червенские города."
        note: "odzyskać — вернуть себе"
      - pl: " Razem z Jarosławem szedł Bezprym."
        ru: "Вместе с Ярославом шёл Бесприм."
      - pl: " Mieszko nie zdołał się obronić i uciekł do Czech."
        ru: "Мешко не смог защититься и бежал в Чехию."
    words: { "korona": korona, "zachodu": zachod, "wkroczył": wkroczyc, "cesarz": cesarz, "wschodu": wschod, "zdołał": zdolac, "obronić": obronic }
  - clean: "Czeski książę, wróg jego ojca, uwięził go, a według Galla także okaleczył. Tymczasem w Polsce władzę przejął Bezprym. Na znak uległości odesłał cesarzowi polską koronę i insygnia królewskie. Rządził tak okrutnie, że po roku zamordowali go jego właśni ludzie. Mieszko wrócił do kraju, ale musiał uznać zwierzchnictwo cesarza i zrezygnować z tytułu króla. Utracił Łużyce, Milsko i Grody Czerwieńskie, czyli prawie wszystko, co zdobył jego ojciec. Zmarł w 1034 roku, prawdopodobnie zamordowany."
    draft: true
    chunks:
      - pl: "Czeski książę, wróg jego ojca, uwięził go, a według Galla także okaleczył."
        ru: "Чешский князь, враг его отца, заточил его в темницу, а по словам Галла, ещё и изувечил."
        note: "uwięzić — заточить; okaleczyć — изувечить"
      - pl: " Tymczasem w Polsce władzę przejął Bezprym."
        ru: "Тем временем в Польше власть захватил Бесприм."
        note: "tymczasem — тем временем"
      - pl: " Na znak uległości odesłał cesarzowi polską koronę i insygnia królewskie."
        ru: "В знак покорности он отослал императору польскую корону и королевские регалии."
        note: "uległość — покорность; insygnia — регалии, знаки власти"
      - pl: " Rządził tak okrutnie, że po roku zamordowali go jego właśni ludzie."
        ru: "Он правил так жестоко, что через год его убили собственные люди."
        note: "zamordować — убить (злодейски)"
      - pl: " Mieszko wrócił do kraju, ale musiał uznać zwierzchnictwo cesarza i zrezygnować z tytułu króla."
        ru: "Мешко вернулся в страну, но был вынужден признать верховную власть императора и отказаться от королевского титула."
        note: "zwierzchnictwo — верховная власть; zrezygnować z czegoś — отказаться от чего-л."
      - pl: " Utracił Łużyce, Milsko i Grody Czerwieńskie, czyli prawie wszystko, co zdobył jego ojciec."
        ru: "Он потерял Лужицу, Мильско и Червенские города, то есть почти всё, что завоевал его отец."
        note: "utracić — утратить"
      - pl: " Zmarł w 1034 roku, prawdopodobnie zamordowany."
        ru: "Он умер в 1034 году, вероятно убитый."
    words: { "uwięził": uwiezic, "Tymczasem": tymczasem, "odesłał": odeslac, "cesarzowi": cesarz, "polską": polski, "koronę": korona, "królewskie": krolewski, "Rządził": rzadzic, "okrutnie": okrutnie, "cesarza": cesarz, "zrezygnować": zrezygnowac, "tytułu": tytul }
  - clean: "To, co nastąpiło potem, było najcięższym kryzysem w dziejach młodego państwa. Syn Mieszka, Kazimierz, musiał uciekać z kraju. Możni walczyli między sobą o władzę, a w wielu miejscach wybuchło powstanie ludowe. Gall pisze, że „niewolnicy powstali przeciwko panom, a wyzwoleńcy przeciwko szlachetnie urodzonym”. Powstańcy zabijali biskupów i księży, burzyli kościoły i wracali do dawnych bogów. Historycy nazywają te wydarzenia reakcją pogańską. Chrześcijaństwo przyjęte zaledwie siedemdziesiąt lat wcześniej było jeszcze bardzo kruche."
    draft: true
    chunks:
      - pl: "To, co nastąpiło potem, było najcięższym kryzysem w dziejach młodego państwa."
        ru: "То, что последовало затем, стало тяжелейшим кризисом в истории молодого государства."
        note: "nastąpić — последовать; dzieje — история (книжное)"
      - pl: " Syn Mieszka, Kazimierz, musiał uciekać z kraju."
        ru: "Сыну Мешко, Казимиру, пришлось бежать из страны."
      - pl: " Możni walczyli między sobą o władzę, a w wielu miejscach wybuchło powstanie ludowe."
        ru: "Знать боролась между собой за власть, а во многих местах вспыхнуло народное восстание."
        note: "wybuchnąć — вспыхнуть, разразиться; powstanie — восстание"
      - pl: " Gall pisze, że „niewolnicy powstali przeciwko panom, a wyzwoleńcy przeciwko szlachetnie urodzonym”."
        ru: "Галл пишет, что «рабы восстали против господ, а вольноотпущенники — против знатных»."
        note: "wyzwoleniec — вольноотпущенник; szlachetnie urodzony — знатный по рождению"
      - pl: " Powstańcy zabijali biskupów i księży, burzyli kościoły i wracali do dawnych bogów."
        ru: "Восставшие убивали епископов и священников, разрушали церкви и возвращались к прежним богам."
        note: "burzyć — разрушать"
      - pl: " Historycy nazywają te wydarzenia reakcją pogańską."
        ru: "Историки называют эти события языческой реакцией."
      - pl: " Chrześcijaństwo przyjęte zaledwie siedemdziesiąt lat wcześniej było jeszcze bardzo kruche."
        ru: "Христианство, принятое всего за семьдесят лет до этого, было ещё очень непрочным."
        note: "kruchy — хрупкий"
    words: { "nastąpiło": nastapic, "kryzysem": kryzys, "wybuchło": wybuchnac, "niewolnicy": niewolnik, "powstali": powstac, "księży": ksiadz, "reakcją": reakcja, "zaledwie": zaledwie }
  - clean: "Wtedy na osłabiony kraj napadł czeski książę Brzetysław. Jego wojska spustoszyły Wielkopolskę i zdobyły Gniezno. Czesi zabrali ze sobą największy skarb Polski: relikwie świętego Wojciecha. Zajęli też Śląsk. Kronikarz pisze, że w zniszczonych katedrach w Gnieźnie i Poznaniu dzikie zwierzęta urządziły sobie legowiska. Nawet jeśli to przesada, archeolodzy rzeczywiście znajdują w wielu grodach Wielkopolski ślady pożarów z tamtych lat. Państwo Piastów przez kilka lat praktycznie nie istniało."
    draft: true
    chunks:
      - pl: "Wtedy na osłabiony kraj napadł czeski książę Brzetysław."
        ru: "Тогда на ослабленную страну напал чешский князь Бржетислав."
        note: "osłabiony — ослабленный"
      - pl: " Jego wojska spustoszyły Wielkopolskę i zdobyły Gniezno."
        ru: "Его войска опустошили Великую Польшу и взяли Гнезно."
        note: "spustoszyć — опустошить"
      - pl: " Czesi zabrali ze sobą największy skarb Polski: relikwie świętego Wojciecha."
        ru: "Чехи увезли с собой величайшее сокровище Польши: мощи святого Войцеха."
        note: "relikwie — мощи, реликвии"
      - pl: " Zajęli też Śląsk."
        ru: "Они захватили и Силезию."
      - pl: " Kronikarz pisze, że w zniszczonych katedrach w Gnieźnie i Poznaniu dzikie zwierzęta urządziły sobie legowiska."
        ru: "Летописец пишет, что в разрушенных соборах в Гнезно и Познани дикие звери устроили себе логова."
        note: "legowisko — логово, лёжка"
      - pl: " Nawet jeśli to przesada, archeolodzy rzeczywiście znajdują w wielu grodach Wielkopolski ślady pożarów z tamtych lat."
        ru: "Даже если это преувеличение, археологи действительно находят во многих градах Великой Польши следы пожаров тех лет."
        note: "pożar — пожар"
      - pl: " Państwo Piastów przez kilka lat praktycznie nie istniało."
        ru: "Государство Пястов несколько лет практически не существовало."
    words: { "napadł": napasc, "wojska": wojsko, "urządziły": urzadzic, "przesada": przesada, "rzeczywiście": rzeczywiscie, "pożarów": pozar, "praktycznie": praktycznie }
  - clean: "Odbudowa przyszła z zewnątrz. Kazimierz, który schronił się w Niemczech, wrócił około 1039 roku z pomocą cesarza i z oddziałem kilkuset rycerzy. Późniejsza legenda mówi, że w czasie wygnania był mnichem we francuskim klasztorze Cluny i że papież musiał go zwolnić ze ślubów zakonnych. Historycy w to nie wierzą, ale legenda dobrze oddaje, jak trudny był jego powrót. Kraj był zrujnowany, a Gniezno leżało w gruzach."
    draft: true
    chunks:
      - pl: "Odbudowa przyszła z zewnątrz."
        ru: "Восстановление пришло извне."
        note: "odbudowa — восстановление; z zewnątrz — извне"
      - pl: " Kazimierz, który schronił się w Niemczech, wrócił około 1039 roku z pomocą cesarza i z oddziałem kilkuset rycerzy."
        ru: "Казимир, укрывшийся в Германии, вернулся около 1039 года с помощью императора и с отрядом в несколько сотен рыцарей."
        note: "schronić się — укрыться; oddział — отряд"
      - pl: " Późniejsza legenda mówi, że w czasie wygnania był mnichem we francuskim klasztorze Cluny i że papież musiał go zwolnić ze ślubów zakonnych."
        ru: "Поздняя легенда гласит, что в изгнании он был монахом во французском монастыре Клюни и что папе пришлось освободить его от монашеских обетов."
        note: "wygnanie — изгнание; ślub zakonny — монашеский обет"
      - pl: " Historycy w to nie wierzą, ale legenda dobrze oddaje, jak trudny był jego powrót."
        ru: "Историки в это не верят, но легенда хорошо передаёт, насколько трудным было его возвращение."
        note: "oddawać — здесь «передавать, отражать»"
      - pl: " Kraj był zrujnowany, a Gniezno leżało w gruzach."
        ru: "Страна была разорена, а Гнезно лежало в руинах."
        note: "zrujnowany — разорённый; w gruzach — в развалинах"
    words: { "cesarza": cesarz, "rycerzy": rycerz, "Późniejsza": pozny, "legenda": legenda, "mnichem": mnich, "francuskim": francuski, "klasztorze": klasztor, "papież": papiez, "oddaje": oddawac, "zrujnowany": zrujnowac }
  - clean: "Kazimierz przeniósł więc swoją siedzibę do Krakowa, który mniej ucierpiał. Od tej pory przez ponad pięćset lat Kraków był najważniejszym miastem Polski. Kazimierz szukał też sojuszników na wschodzie. Ożenił się z Dobroniegą, siostrą Jarosława Mądrego. Gall pisze, że razem z wianem Jarosław oddał mu ośmiuset polskich jeńców, wziętych do niewoli kilka lat wcześniej. Ruska pomoc okazała się bezcenna."
    draft: true
    chunks:
      - pl: "Kazimierz przeniósł więc swoją siedzibę do Krakowa, który mniej ucierpiał."
        ru: "Поэтому Казимир перенёс свою резиденцию в Краков, который пострадал меньше."
        note: "siedziba — резиденция; ucierpieć — пострадать"
      - pl: " Od tej pory przez ponad pięćset lat Kraków był najważniejszym miastem Polski."
        ru: "С тех пор больше пятисот лет Краков был главным городом Польши."
      - pl: " Kazimierz szukał też sojuszników na wschodzie."
        ru: "Казимир искал союзников и на востоке."
      - pl: " Ożenił się z Dobroniegą, siostrą Jarosława Mądrego."
        ru: "Он женился на Добронеге, сестре Ярослава Мудрого."
      - pl: " Gall pisze, że razem z wianem Jarosław oddał mu ośmiuset polskich jeńców, wziętych do niewoli kilka lat wcześniej."
        ru: "Галл пишет, что вместе с приданым Ярослав вернул ему восемьсот польских пленников, захваченных несколькими годами ранее."
        note: "wiano — приданое; wziąć do niewoli — взять в плен"
      - pl: " Ruska pomoc okazała się bezcenna."
        ru: "Помощь Руси оказалась бесценной."
        note: "bezcenny — бесценный"
    words: { "sojuszników": sojusznik, "siedzibę": siedziba, "ucierpiał": ucierpiec, "pięćset": piecset, "wschodzie": wschod, "Ożenił": ozenic, "polskich": polski, "jeńców": jeniec }
  - clean: "Najgroźniejszym przeciwnikiem Kazimierza był Masław, który zbudował na Mazowszu własne państwo. Mazowsze nie ucierpiało w czasie najazdu czeskiego, a wielu ludzi uciekło tam przed wojną i głodem. Masław sprzymierzył się z pogańskimi Prusami i Jaćwingami. Dopiero w 1047 roku Kazimierz z pomocą ruskich wojsk pokonał go w wielkiej bitwie. Kilka lat później odzyskał Śląsk, choć musiał za niego płacić Czechom coroczną daninę. Odbudował biskupstwa, sprowadził zakonników i przywrócił porządek w kraju. Nie bez powodu potomni nazwali go Odnowicielem."
    draft: true
    chunks:
      - pl: "Najgroźniejszym przeciwnikiem Kazimierza był Masław, który zbudował na Mazowszu własne państwo."
        ru: "Самым опасным противником Казимира был Маслав, создавший в Мазовии собственное государство."
        note: "Mazowsze — Мазовия"
      - pl: " Mazowsze nie ucierpiało w czasie najazdu czeskiego, a wielu ludzi uciekło tam przed wojną i głodem."
        ru: "Мазовия не пострадала во время чешского набега, и многие люди бежали туда от войны и голода."
        note: "najazd — набег, нашествие"
      - pl: " Masław sprzymierzył się z pogańskimi Prusami i Jaćwingami."
        ru: "Маслав вступил в союз с языческими пруссами и ятвягами."
        note: "Jaćwingowie — ятвяги"
      - pl: " Dopiero w 1047 roku Kazimierz z pomocą ruskich wojsk pokonał go w wielkiej bitwie."
        ru: "Лишь в 1047 году Казимир с помощью русских войск разбил его в большой битве."
      - pl: " Kilka lat później odzyskał Śląsk, choć musiał za niego płacić Czechom coroczną daninę."
        ru: "Несколько лет спустя он вернул Силезию, хотя ему пришлось платить за неё чехам ежегодную дань."
        note: "coroczny — ежегодный"
      - pl: " Odbudował biskupstwa, sprowadził zakonników i przywrócił porządek w kraju."
        ru: "Он восстановил епископства, пригласил монахов и навёл порядок в стране."
        note: "sprowadzić — пригласить, привезти; przywrócić — восстановить"
      - pl: " Nie bez powodu potomni nazwali go Odnowicielem."
        ru: "Не без причины потомки назвали его Восстановителем."
