  - clean: "Góra ta drżeniem wtenczas się porusza,\nGdy oczyszczona ze zmaz wstaje dusza\nI wzlata wyżej, głośno, potem ciszej,\nJej wniebowzięciu ten krzyk towarzyszy.\nWola jest tylko próbą oczyszczenia,\nDusza gdy siebie ze swych zmaz wyzwoli,\nWola ją bodzie, że swój pobyt zmienia;\nTak duch używa sprawiedliwej woli."
    verse: true
    chunks:
      - pl: "Góra ta drżeniem wtenczas się porusza,"
        ru: "Эта гора движется дрожью тогда,"
      - pl: "\nGdy oczyszczona ze zmaz wstaje dusza"
        ru: "когда очищенная от пятен встаёт душа"
      - pl: "\nI wzlata wyżej, głośno, potem ciszej,"
        ru: "и взлетает выше; громко, потом тише"
      - pl: "\nJej wniebowzięciu ten krzyk towarzyszy."
        ru: "её вознесению сопутствует этот крик."
      - pl: "\nWola jest tylko próbą oczyszczenia,"
        ru: "Воля — единственное испытание очищения:"
      - pl: "\nDusza gdy siebie ze swych zmaz wyzwoli,"
        ru: "когда душа освободит себя от своих пятен,"
      - pl: "\nWola ją bodzie, że swój pobyt zmienia;"
        ru: "воля колет её, чтобы она сменила своё пребывание;"
      - pl: "\nTak duch używa sprawiedliwej woli."
        ru: "так дух пользуется справедливой волей."
    words: { "porusza": poruszac, "oczyszczona": oczyscic, "głośno": glosno, "ciszej": cicho, "krzyk": krzyk, "pobyt": pobyt }
  - clean: "Duch rad by zbliżyć chwilę wyzwolenia,\nLecz żądza skruchy na to nie przyzwoli;\nBo sprawiedliwość, jaką się tu rządzą,\nChce po grzeszniku, aby z równą żądzą,\nJak lgnął do grzechu, tęsknił do pokuty.\nJa, com lat pięćset i więcej przykuty\nW mękach przeleżał, gdyście tu wkroczyli,\nOto, zaiste, poczułem w tej chwili\nTę wolną wolę lepszego pobytu."
    verse: true
    chunks:
      - pl: "Duch rad by zbliżyć chwilę wyzwolenia,"
        ru: "Дух рад бы приблизить миг освобождения,"
      - pl: "\nLecz żądza skruchy na to nie przyzwoli;"
        ru: "но жажда покаяния на это не согласится;"
      - pl: "\nBo sprawiedliwość, jaką się tu rządzą,"
        ru: "ибо справедливость, которой здесь правятся,"
      - pl: "\nChce po grzeszniku, aby z równą żądzą,"
        ru: "требует от грешника, чтобы он с равным желанием,"
      - pl: "\nJak lgnął do grzechu, tęsknił do pokuty."
        ru: "с каким льнул к греху, тосковал по покаянию."
      - pl: "\nJa, com lat pięćset i więcej przykuty"
        ru: "Я, что пятьсот лет и больше, прикованный,"
      - pl: "\nW mękach przeleżał, gdyście tu wkroczyli,"
        ru: "пролежал в муках, когда вы сюда вступили,"
      - pl: "\nOto, zaiste, poczułem w tej chwili"
        ru: "вот, воистину, почувствовал в этот миг"
      - pl: "\nTę wolną wolę lepszego pobytu."
        ru: "эту свободную волю к лучшему пребыванию."
    words: { "Duch": duch, "zbliżyć": zblizyc, "sprawiedliwość": sprawiedliwosc, "równą": rowny, "tęsknił": tesknic, "wkroczyli": wkroczyc }
  - clean: "Dlategoś słyszał od góry tej szczytu\nDo jej podnóża takie drżenie skały,\nKrzyk, z jakim duchy cześć Panu śpiewały,\nAby je prędzej wziął do swojej chwały».\nTak mówił: a jak milsze ochłodzenie\nCzujem w napoju, im większe pragnienie,\nCzułem, to mówiąc, jak rzeźwił me chcenie."
