        ru: "как из них освобождает себя тот, кто в них попадёт;"
      - pl: "\nWidzę, dlaczego drży ta góra święta"
        ru: "вижу, почему дрожит эта святая гора"
      - pl: "\nI przez co wasza radość jest poczęta."
        ru: "и чем зачата ваша радость."
      - pl: "\nLecz mów, kim byłeś? Na tej skały bryle"
        ru: "Но скажи, кем ты был? На глыбе этой скалы"
      - pl: "\nDlaczego wieków przeleżałeś tyle?»"
        ru: "почему ты пролежал столько веков?»"
    words: { "wódz": wodz, "sieci": siec, "wasza": wasz, "radość": radosc, "poczęta": poczac, "wieków": wiek }
  - clean: "— «Gdy dobry Tytus był z nieba wybrany,\nBy w Jeruzalem wśród dymiących zgliszczy,\nKrwi przez Judasza zemścił się przelanej,»\nDuch odpowiedział «żyłem w one lata,\nŚwiecąc tytułem, który wobec świata\nI trwa najdłużej, i najwięcej błyszczy."
