  - clean: "Pragnienie, co się nigdy nie ugasza,\nChyba tą wodą, o którą stroskana\nSamarytanka błagała u Pana,\nBodło mię; ledwo krok sunąłem nogą.\nPolitowaniem wzruszał obraz żywy\nZa grzechy nasze zemsty sprawiedliwej."
    verse: true
    chunks:
      - pl: "Pragnienie, co się nigdy nie ugasza,"
        ru: "Жажда, что никогда не утоляется,"
      - pl: "\nChyba tą wodą, o którą stroskana"
        ru: "разве что той водой, о которой, озабоченная,"
      - pl: "\nSamarytanka błagała u Pana,"
        ru: "самарянка молила Господа,"
      - pl: "\nBodło mię; ledwo krok sunąłem nogą."
        ru: "колола меня; я едва передвигал ногу."
      - pl: "\nPolitowaniem wzruszał obraz żywy"
        ru: "Жалостью трогал живой образ"
      - pl: "\nZa grzechy nasze zemsty sprawiedliwej."
        ru: "справедливой мести за наши грехи."
    words: { "Pragnienie": pragnienie, "błagała": blagac, "ledwo": ledwo, "grzechy": grzech, "zemsty": zemsta, "sprawiedliwej": sprawiedliwy }
  - clean: "I oto, pióro co pisze Łukasza,\nJak niespodzianie dwom idącym drogą\nJawił się Chrystus z grobu zmartwychwstały,\nCień się pokazał i szedł poza nami.\nPatrząc na stopy leżących wzdłuż skały;\nNiepostrzeżony, nim tymi słowami\nPrzemówił: «Bracia moi, pokój z wami!»"
    verse: true
    chunks:
      - pl: "I oto, pióro co pisze Łukasza,"
        ru: "И вот, как пишет перо Луки,"
      - pl: "\nJak niespodzianie dwom idącym drogą"
        ru: "как нечаянно двоим, идущим по дороге,"
      - pl: "\nJawił się Chrystus z grobu zmartwychwstały,"
        ru: "явился Христос, воскресший из гроба,"
      - pl: "\nCień się pokazał i szedł poza nami."
        ru: "показалась тень и шла позади нас,"
      - pl: "\nPatrząc na stopy leżących wzdłuż skały;"
        ru: "глядя на ноги лежащих вдоль скалы;"
      - pl: "\nNiepostrzeżony, nim tymi słowami"
        ru: "незамеченная, пока такими словами"
      - pl: "\nPrzemówił: «Bracia moi, pokój z wami!»"
        ru: "не заговорила: «Братья мои, мир вам!»"
    words: { "pióro": pioro, "grobu": grob, "Cień": cien, "leżących": lezec, "skały": skala, "Przemówił": przemowic }
  - clean: "Nagleśmy oczy za się obrócili,\nGestem go wzajem pozdrowił Wirgili,\nI mówił: «Witaj pozdrowieniem twojem,\nObyś w królestwo prawdy wszedł z pokojem,\nCo mnie na wieczne wygnanie skazało».\n«Jak to?» duch mówił, «Cóż wasz pośpiech znaczy,\nGdy was tam wyżej Bóg przyjąć nie raczy."
    verse: true
    chunks:
      - pl: "Nagleśmy oczy za się obrócili,"
        ru: "Вдруг мы обернули глаза назад,"
      - pl: "\nGestem go wzajem pozdrowił Wirgili,"
        ru: "Вергилий ответно приветствовал его жестом"
      - pl: "\nI mówił: «Witaj pozdrowieniem twojem,"
        ru: "и сказал: «Привет тебе твоим же приветствием,"
      - pl: "\nObyś w królestwo prawdy wszedł z pokojem,"
        ru: "о, если бы ты вошёл с миром в царство истины,"
      - pl: "\nCo mnie na wieczne wygnanie skazało»."
        ru: "что осудило меня на вечное изгнание»."
      - pl: "\n«Jak to?» duch mówił, «Cóż wasz pośpiech znaczy,"
        ru: "«Как так? — сказал дух, — что значит ваша спешка,"
      - pl: "\nGdy was tam wyżej Bóg przyjąć nie raczy."
        ru: "если вас там, наверху, Бог не изволит принять?"
    words: { "obrócili": obrocic, "Gestem": gest, "pozdrowił": pozdrowic, "wieczne": wieczny, "skazało": skazac, "pośpiech": pospiech }
  - clean: "Kto was prowadził tak wysoką skałą?»\nA mój mistrz: «Znaków gdy ujrzysz niemało,\nJakimi Anioł znaczył go na czole,\nPrzyznasz mu prawo być w wybranych kole,\nŻe przed nim niebios rozemknie się brama.\nLecz gdy mu życia nić niedoprzędzioną\nPrządka nie zwiła jeszcze na wrzeciono,\nWięc jego dusza, wspólna siostra nasza,\nWejść by nie mogła tak wysoko sama,\nBo jej piór lot nasz jeszcze nie podnasza."
    verse: true
    chunks:
      - pl: "Kto was prowadził tak wysoką skałą?»"
        ru: "Кто вёл вас по столь высокой скале?»"
      - pl: "\nA mój mistrz: «Znaków gdy ujrzysz niemało,"
        ru: "А мой учитель: «Когда увидишь немало знаков,"
      - pl: "\nJakimi Anioł znaczył go na czole,"
        ru: "которыми ангел отметил его на челе,"
      - pl: "\nPrzyznasz mu prawo być w wybranych kole,"
        ru: "признаешь за ним право быть в кругу избранных,"
      - pl: "\nŻe przed nim niebios rozemknie się brama."
        ru: "что перед ним откроются врата небес."
        note: "rozemknąć się — раскрыться"
      - pl: "\nLecz gdy mu życia nić niedoprzędzioną"
        ru: "Но так как нить его жизни, недопрядённую,"
        note: "niedoprzędziony — недопрядённый"
      - pl: "\nPrządka nie zwiła jeszcze na wrzeciono,"
        ru: "пряха ещё не свила на веретено,"
        note: "prządka — пряха; Лахесис"
      - pl: "\nWięc jego dusza, wspólna siostra nasza,"
        ru: "то его душа, наша общая сестра,"
      - pl: "\nWejść by nie mogła tak wysoko sama,"
        ru: "не могла бы сама взойти так высоко,"
      - pl: "\nBo jej piór lot nasz jeszcze nie podnasza."
        ru: "ибо её перьев ещё не поднимает наш полёт."
        note: "podnaszać — поднимать"
    words: { "ujrzysz": ujrzec, "Anioł": aniol, "czole": czolo, "kole": kolo, "niebios": niebiosa, "brama": brama }
  - clean: "Przeto wyszedłem z piekielnej otchłani,\nZa wyższą wolą wskazywać mu drogę.\nI wskażę, ile znam i znać ją mogę.\nLecz, proszę, powiedz, dlaczego w tej chwili\nTrzęsła się góra i dlaczego na niej,\nZ wierzchu do stóp jej, które płucze morze,\nKrzyknęły duchy w jednym wielkim chorze»."
    verse: true
    chunks:
      - pl: "Przeto wyszedłem z piekielnej otchłani,"
        ru: "Поэтому я вышел из адской бездны,"
      - pl: "\nZa wyższą wolą wskazywać mu drogę."
        ru: "по высшей воле указывать ему дорогу."
      - pl: "\nI wskażę, ile znam i znać ją mogę."
        ru: "И укажу, сколько знаю и могу её знать."
      - pl: "\nLecz, proszę, powiedz, dlaczego w tej chwili"
        ru: "Но, прошу, скажи, почему в этот миг"
      - pl: "\nTrzęsła się góra i dlaczego na niej,"
        ru: "тряслась гора и почему на ней,"
      - pl: "\nZ wierzchu do stóp jej, które płucze morze,"
        ru: "от вершины до её подножия, что омывает море,"
      - pl: "\nKrzyknęły duchy w jednym wielkim chorze»."
        ru: "закричали духи одним великим хором»."
    words: { "piekielnej": piekielny, "wskazywać": wskazywac, "wskażę": wskazac, "Trzęsła": trzasc, "stóp": stopa, "morze": morze }
  - clean: "To mówiąc, spotkał jak w igle Wirgili\nUcho mej żądzy; czułem, jak koleją\nGłód mi pragnienia łagodził nadzieją.\nDuch rzekł: «Ta góra od świata początku\nRządzi się prawem wiecznego porządku,\nWolna od wszelkich zaburzeń natury."
    verse: true
    chunks:
      - pl: "To mówiąc, spotkał jak w igle Wirgili"
        ru: "Говоря это, Вергилий, как нитью в иглу, попал"
      - pl: "\nUcho mej żądzy; czułem, jak koleją"
        ru: "в самое ушко моего желания; я чувствовал, как постепенно"
        note: "koleją — постепенно"
      - pl: "\nGłód mi pragnienia łagodził nadzieją."
        ru: "голод жажды смягчался у меня надеждой."
      - pl: "\nDuch rzekł: «Ta góra od świata początku"
        ru: "Дух сказал: «Эта гора от начала мира"
      - pl: "\nRządzi się prawem wiecznego porządku,"
        ru: "управляется законом вечного порядка,"
      - pl: "\nWolna od wszelkich zaburzeń natury."
        ru: "свободная от всяких возмущений природы."
        note: "zaburzenie — возмущение"
    words: { "igle": igla, "koleją": kolej, "Głód": glod, "rzekł": rzec, "Rządzi": rzadzic, "natury": natura }
  - clean: "Hałasu tego powód był jedyny,\nŻe duszę niebo przyjęło z tej góry.\nTu nie ma żadnej przygodnej przyczyny.\nDeszczowe, śnieżne i gradowe chmury,\nSzrony, co rosę na powietrzu mrożą,\nZa trzystopniowym progiem się nie tworzą."
    verse: true
    chunks:
      - pl: "Hałasu tego powód był jedyny,"
        ru: "Единственная причина этого шума была та,"
      - pl: "\nŻe duszę niebo przyjęło z tej góry."
        ru: "что небо приняло душу с этой горы."
      - pl: "\nTu nie ma żadnej przygodnej przyczyny."
        ru: "Здесь нет никакой случайной причины."
        note: "przygodny — случайный"
      - pl: "\nDeszczowe, śnieżne i gradowe chmury,"
        ru: "Дождевые, снежные и градовые тучи,"
      - pl: "\nSzrony, co rosę na powietrzu mrożą,"
        ru: "иней, что замораживает росу в воздухе,"
        note: "szron — иней"
      - pl: "\nZa trzystopniowym progiem się nie tworzą."
        ru: "за трёхступенчатым порогом не образуются."
    words: { "Hałasu": halas, "przyczyny": przyczyna, "chmury": chmura, "rosę": rosa, "progiem": prog, "tworzą": tworzyc }
  - clean: "Tu chmur nie widzim, błyskawic i tęczy,\nCo zmienia u was barwę swych obręczy,\nTu suchy wyziew za próg nie przenika\nZajęty stopą bożego klucznika.\nByć może, niżej zrąb tej góry świętej\nMniej więcej wstrząsa przyczyna podziemna;\nCzemu jej wyżyn wiatr w ziemi zamknięty\nNie zachwiał nigdy, to zagadka ciemna."
    verse: true
    chunks:
      - pl: "Tu chmur nie widzim, błyskawic i tęczy,"
        ru: "Здесь мы не видим туч, молний и радуги,"
        note: "tęcza — радуга"
      - pl: "\nCo zmienia u was barwę swych obręczy,"
        ru: "что меняет у вас цвет своих дуг,"
      - pl: "\nTu suchy wyziew za próg nie przenika"
        ru: "здесь сухой пар не проникает за порог,"
      - pl: "\nZajęty stopą bożego klucznika."
        ru: "занятый ногой Божьего ключаря."
      - pl: "\nByć może, niżej zrąb tej góry świętej"
        ru: "Может быть, ниже основание этой святой горы"
      - pl: "\nMniej więcej wstrząsa przyczyna podziemna;"
        ru: "сотрясает более или менее подземная причина;"
      - pl: "\nCzemu jej wyżyn wiatr w ziemi zamknięty"
