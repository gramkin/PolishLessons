    chunks:
      - pl: "— «Gdy dobry Tytus był z nieba wybrany,"
        ru: "— «Когда добрый Тит был избран небом,"
      - pl: "\nBy w Jeruzalem wśród dymiących zgliszczy,"
        ru: "чтобы в Иерусалиме среди дымящихся пепелищ"
        note: "zgliszcza — пепелище"
      - pl: "\nKrwi przez Judasza zemścił się przelanej,»"
