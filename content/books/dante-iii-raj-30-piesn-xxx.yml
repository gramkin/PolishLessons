        ru: "что тонут в воде и всходят над водой,"
      - pl: "\nKwiaty ziejące wonie tak przyjemne,"
        ru: "цветы, источающие столь приятный аромат,"
        note: "ziać — дышать, источать"
      - pl: "\nSą to zwiastunki prawdy, jej obrazy."
        ru: "это предвестники истины, её образы."
