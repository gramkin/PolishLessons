    words: { "słońce": slonce, "Dodając": dodawac, "Kwiaty": kwiat, "ziejące": ziac, "przyjemne": przyjemny, "ciemne": ciemny }
  - clean: "Lecz błąd jest w tobie, który mimo całej\nŻądzy widzenia nie patrzy dość śmiało».\nDziecko nie prędzej na mleczną jagodę\nMatczynej piersi z chciwością się rzuca,\nJeśli za późno ze snu się ocuca,\nJak się schyliłem do wód z pełną cześcią,\nCo duch rzeźwiącą umacniają treścią,\nChcąc lepsze zrobić z mych oczu zwierciadła,\nLedwo je rzęsą musnęła powieka,\nZ długiej okrągłą wydała się rzeka:"
    verse: true
    chunks:
      - pl: "Lecz błąd jest w tobie, który mimo całej"
        ru: "но изъян в тебе, ибо ты, при всём"
      - pl: "\nŻądzy widzenia nie patrzy dość śmiało»."
        ru: "желании видеть, смотришь недостаточно смело»."
      - pl: "\nDziecko nie prędzej na mleczną jagodę"
        ru: "Дитя не быстрее бросается с жадностью"
      - pl: "\nMatczynej piersi z chciwością się rzuca,"
        ru: "к молочному соску материнской груди,"
