level: B2
paragraphs:
  - clean: "Oddział trzeci. 10) Empireum, właściwe niebo, siedziba błogosławionych i Boga samego. Aniołowie dziewiątej sfery znikają. Światło Beatrycze. Okrągły prąd światła; róża niebiańska; miejsce Henryka VII; upadek Klemensa V."
    chunks:
      - pl: "Oddział trzeci. 10) Empireum, właściwe niebo, siedziba błogosławionych i Boga samego. Aniołowie dziewiątej sfery znikają. Światło Beatrycze. Okrągły prąd światła; róża niebiańska; miejsce Henryka VII; upadek Klemensa V."
        ru: "Третий отдел. 10) Эмпирей, собственно небо, обитель блаженных и самого Бога. Ангелы девятой сферы исчезают. Свет Беатриче. Круговой поток света; небесная роза; место Генриха VII; падение Климента V."
    words: { "siedziba": siedziba, "błogosławionych": blogoslawic, "Okrągły": okragly, "prąd": prad, "róża": roza, "upadek": upadek }
  - clean: "Stąd w domniemanej przez myśl odległości\nNa sześć tysięcy mil szósta godzina\nPłonęła w ogniu, a cień padał prościej\nNa tamtej sferze, prawie prostopadły:\nGdy środek niebios nad nami widniejszy\nStaje się takim, że gwiazd promień zbladły\nW ich głębokościach już tonąć zaczyna;\nA niebo z przyjściem słońca służebnicy\nZagasza gwiazdy aż do najpiękniejszej;\nPodobnie z wolna gasł ten triumf święty\nGrać i kołować bez przerwy nawykły\nW krąg punktu, który pełen tajemnicy,\nW ten, co zamyka, zda się, był zamknięty."
    verse: true
    chunks:
      - pl: "Stąd w domniemanej przez myśl odległości"
        ru: "Отсюда, на мыслимом расстоянии"
      - pl: "\nNa sześć tysięcy mil szósta godzina"
        ru: "шести тысяч миль, шестой час"
        note: "полдень на востоке; у нас рассвет"
      - pl: "\nPłonęła w ogniu, a cień padał prościej"
        ru: "пылал в огне, и тень падала прямее,"
      - pl: "\nNa tamtej sferze, prawie prostopadły:"
        ru: "почти отвесно, на той сфере:"
      - pl: "\nGdy środek niebios nad nami widniejszy"
        ru: "когда середина небес над нами, становясь виднее,"
      - pl: "\nStaje się takim, że gwiazd promień zbladły"
        ru: "делается такой, что бледнеющий луч звёзд"
      - pl: "\nW ich głębokościach już tonąć zaczyna;"
        ru: "начинает уже тонуть в их глубинах;"
      - pl: "\nA niebo z przyjściem słońca służebnicy"
        ru: "а небо с приходом служанки солнца"
        note: "Авроры"
      - pl: "\nZagasza gwiazdy aż do najpiękniejszej;"
        ru: "гасит звёзды вплоть до самой прекрасной;"
      - pl: "\nPodobnie z wolna gasł ten triumf święty"
        ru: "так же медленно угасало святое торжество,"
      - pl: "\nGrać i kołować bez przerwy nawykły"
        ru: "привыкшее без перерыва играть и кружить"
      - pl: "\nW krąg punktu, który pełen tajemnicy,"
        ru: "вокруг точки, что, полная тайны,"
      - pl: "\nW ten, co zamyka, zda się, był zamknięty."
        ru: "казалась заключённой в том, что сама заключает."
    words: { "domniemanej": domniemany, "odległości": odleglosc, "Płonęła": plonac, "niebios": niebiosa, "promień": promien, "krąg": krag }
  - clean: "Przeto żal świateł, co zarazem znikły,\nI miłość moja mnie zwrócić zmusiły\nStęsknione oczy znów do Beatrycy.\nGdyby tu wszystkie (gdzież taka wymowa!),\nJakie mówiłem dotąd o niej słowa,\nW jedną pochwałę razem się złączyły,\nNa ten raz jeszcze byłaby za małą."
    verse: true
    chunks:
      - pl: "Przeto żal świateł, co zarazem znikły,"
        ru: "Поэтому сожаление о светах, что разом исчезли,"
      - pl: "\nI miłość moja mnie zwrócić zmusiły"
        ru: "и моя любовь заставили меня обратить"
      - pl: "\nStęsknione oczy znów do Beatrycy."
        ru: "стосковавшиеся глаза снова к Беатриче."
      - pl: "\nGdyby tu wszystkie (gdzież taka wymowa!),"
        ru: "Если бы здесь все слова (где взять такое красноречие!),"
      - pl: "\nJakie mówiłem dotąd o niej słowa,"
        ru: "что я говорил о ней до сих пор,"
      - pl: "\nW jedną pochwałę razem się złączyły,"
        ru: "соединились разом в одну хвалу,"
      - pl: "\nNa ten raz jeszcze byłaby za małą."
        ru: "на этот раз её было бы ещё мало."
    words: { "znikły": zniknac, "miłość": milosc, "zwrócić": zwrocic, "zmusiły": zmusic, "gdzież": gdziez, "dotąd": dotad }
  - clean: "Widziałem piękność jej tak doskonałą,\nŻe tylko może ten, co piękność daje,\nJeden jej Stwórca pojmować ją całą.\nTu słabość nuty mej pieśni wyznaję,\nJak dramatyczny pisarz wśród polotu\nMyśli nierównej z wzniosłością przedmiotu."
    verse: true
    chunks:
      - pl: "Widziałem piękność jej tak doskonałą,"
        ru: "Я видел её красоту столь совершенной,"
      - pl: "\nŻe tylko może ten, co piękność daje,"
        ru: "что лишь тот, кто даёт красоту,"
      - pl: "\nJeden jej Stwórca pojmować ją całą."
        ru: "один её Творец может постичь её всю."
      - pl: "\nTu słabość nuty mej pieśni wyznaję,"
        ru: "Здесь я признаю слабость голоса моей песни,"
      - pl: "\nJak dramatyczny pisarz wśród polotu"
        ru: "как драматический писатель среди полёта"
      - pl: "\nMyśli nierównej z wzniosłością przedmiotu."
        ru: "мысли, неравной высоте предмета."
    words: { "piękność": pieknosc, "doskonałą": doskonaly, "słabość": slabosc, "pieśni": piesn, "pisarz": pisarz, "przedmiotu": przedmiot }
  - clean: "A jak powiekę, im więcej jest drżąca,\nMorduje słońce, tak samo wspomnienie\nSłodkich uśmiechów duch mój w letarg wtrąca.\nOdkąd ją naprzód ujrzałem wśród nieba,\nPo to ostatnie tak wzniosłe widzenie,\nPieśń nieurwana brzmiała ciągłą nutą,\nTu piękność mojej Pani śpiewająca\nCzuje, że stanąć w pół akordu trzeba;\nTak sztukmistrz rzuca pędzel albo dłuto,\nCzując ostatnie sztuki wysilenie."
    verse: true
    chunks:
      - pl: "A jak powiekę, im więcej jest drżąca,"
        ru: "И как слабейшее веко, тем больше дрожащее,"
        note: "mordować — мучить"
      - pl: "\nMorduje słońce, tak samo wspomnienie"
        ru: "мучит солнце, так и воспоминание"
      - pl: "\nSłodkich uśmiechów duch mój w letarg wtrąca."
        ru: "о сладких улыбках ввергает мой дух в оцепенение."
        note: "letarg — летаргия"
      - pl: "\nOdkąd ją naprzód ujrzałem wśród nieba,"
        ru: "С тех пор как я впервые увидел её среди неба"
      - pl: "\nPo to ostatnie tak wzniosłe widzenie,"
        ru: "и до этого последнего, столь высокого видения,"
      - pl: "\nPieśń nieurwana brzmiała ciągłą nutą,"
        ru: "непрерывная песнь звучала непрерывной мелодией;"
      - pl: "\nTu piękność mojej Pani śpiewająca"
        ru: "здесь, воспевая красоту моей Госпожи,"
      - pl: "\nCzuje, że stanąć w pół akordu trzeba;"
        ru: "она чувствует, что нужно остановиться на полуаккорде;"
      - pl: "\nTak sztukmistrz rzuca pędzel albo dłuto,"
        ru: "так художник бросает кисть или резец,"
      - pl: "\nCzując ostatnie sztuki wysilenie."
        ru: "почувствовав последнее усилие искусства."
    words: { "uśmiechów": usmiech, "wtrąca": wtracac, "naprzód": naprzod, "ujrzałem": ujrzec, "nieurwana": urwac, "ciągłą": ciagly }
  - clean: "I taka, jak ją zostawiam opiewać\nLutni większego ode mnie poety,\nGdy z moją, jako podróżny do mety,\nŚpieszę co prędzej pieśń trudną dośpiewać,\nZ powagą do mnie rzekła uroczystą:\n«Jużeśmy weszli, cześć Bogu i chwała,\nOd ciał niebieskich z największego ciała\nDo nieba, które jest światłością czystą:\nŚwiatło miłości pełne i duchowe,\nMiłość, co prawdy rozświeca oblicze,\nRadość, co wszelkie przechodzi słodycze."
    verse: true
    chunks:
      - pl: "I taka, jak ją zostawiam opiewać"
        ru: "И такая, какой я её оставляю воспевать"
      - pl: "\nLutni większego ode mnie poety,"
        ru: "лютне поэта больше меня,"
      - pl: "\nGdy z moją, jako podróżny do mety,"
        ru: "пока я со своей, как путник к цели,"
        note: "meta — цель"
      - pl: "\nŚpieszę co prędzej pieśń trudną dośpiewać,"
        ru: "спешу поскорее допеть трудную песнь,"
      - pl: "\nZ powagą do mnie rzekła uroczystą:"
        ru: "она с торжественной важностью сказала мне:"
      - pl: "\n«Jużeśmy weszli, cześć Bogu i chwała,"
        ru: "«Мы уже вошли, честь и хвала Богу,"
      - pl: "\nOd ciał niebieskich z największego ciała"
        ru: "от величайшего тела среди небесных тел"
        note: "Перводвигатель"
      - pl: "\nDo nieba, które jest światłością czystą:"
        ru: "в небо, которое есть чистый свет:"
      - pl: "\nŚwiatło miłości pełne i duchowe,"
        ru: "свет любви, полный и духовный,"
      - pl: "\nMiłość, co prawdy rozświeca oblicze,"
        ru: "любовь, что озаряет лицо истины,"
      - pl: "\nRadość, co wszelkie przechodzi słodycze."
        ru: "радость, что превосходит всякие сладости."
    words: { "poety": poeta, "mety": meta, "powagą": powaga, "rzekła": rzec, "duchowe": duchowy, "oblicze": oblicze }
  - clean: "Tu ujrzysz raju dwa pułki bojowe;\nJednego błyśnie w twoich oczach szata,\nW jakiej go ujrzysz sam na sądzie świata».\nJak błyskawica nagła wzrok rozrywa,\nWładzę sądzenia odejmując oku\nBliskich przedmiotów, jak o nocnym zmroku,\nTak mnie objęła wkoło światłość żywa,\nTak w swego blasku zasłonę spowiła,\nŻe mi widzenie wszech rzeczy zakryła."
    verse: true
    chunks:
      - pl: "Tu ujrzysz raju dwa pułki bojowe;"
        ru: "Здесь ты увидишь два боевых полка рая;"
        note: "ангелов и блаженных"
      - pl: "\nJednego błyśnie w twoich oczach szata,"
        ru: "одного в твоих глазах блеснёт одеяние,"
      - pl: "\nW jakiej go ujrzysz sam na sądzie świata»."
        ru: "в каком ты сам увидишь его на суде мира»."
      - pl: "\nJak błyskawica nagła wzrok rozrywa,"
        ru: "Как внезапная молния разрывает взгляд,"
      - pl: "\nWładzę sądzenia odejmując oku"
        ru: "отнимая у глаза способность различать"
      - pl: "\nBliskich przedmiotów, jak o nocnym zmroku,"
        ru: "близкие предметы, как в ночном сумраке,"
      - pl: "\nTak mnie objęła wkoło światłość żywa,"
        ru: "так меня объял кругом живой свет,"
      - pl: "\nTak w swego blasku zasłonę spowiła,"
        ru: "так окутал в завесу своего блеска,"
      - pl: "\nŻe mi widzenie wszech rzeczy zakryła."
        ru: "что скрыл от меня вид всех вещей."
    words: { "bojowe": bojowy, "zmroku": zmrok, "objęła": objac, "blasku": blask, "zasłonę": zaslona, "spowiła": spowic }
  - clean: "«Miłość w tym niebie każdego przychodnia\nWesoło wita, gdy wchodzi z gotowym\nSercem zapłonąć zbawieniem duchowym,\nJak zdolna przyjąć swój płomień pochodnia».\nTo Beatrycze krótkie przemówienie\nNad moje siły mój zapał podniosło,\nCzułem, jak we mnie sił poczucie rosło\nI we mnie taki zatliło wzrok nowy,\nŻem mógł światłości wytrzymać promienie."
    verse: true
    chunks:
      - pl: "«Miłość w tym niebie każdego przychodnia"
        ru: "«Любовь в этом небе каждого пришельца"
        note: "przychodzień — пришелец"
      - pl: "\nWesoło wita, gdy wchodzi z gotowym"
        ru: "весело встречает, когда он входит с сердцем,"
      - pl: "\nSercem zapłonąć zbawieniem duchowym,"
        ru: "готовым запылать духовным спасением,"
      - pl: "\nJak zdolna przyjąć swój płomień pochodnia»."
        ru: "как факел, способный принять своё пламя»."
      - pl: "\nTo Beatrycze krótkie przemówienie"
        ru: "Эта краткая речь Беатриче"
      - pl: "\nNad moje siły mój zapał podniosło,"
        ru: "подняла мой пыл выше моих сил,"
      - pl: "\nCzułem, jak we mnie sił poczucie rosło"
        ru: "я чувствовал, как во мне росло ощущение сил"
      - pl: "\nI we mnie taki zatliło wzrok nowy,"
        ru: "и как во мне затеплилось такое новое зрение,"
        note: "zatlić — затеплить"
      - pl: "\nŻem mógł światłości wytrzymać promienie."
        ru: "что я мог выдержать лучи света."
    words: { "zdolna": zdolny, "płomień": plomien, "pochodnia": pochodnia, "rosło": rosnac, "wzrok": wzrok, "wytrzymać": wytrzymac }
  - clean: "I światłość w kształcie rzeki kryształowej\nPłynęła, błyszcząc pomiędzy brzegami\nOdzierzganymi pierwiosnków kwiatami;\nZ tej rzeki światła tryskając iskrami,\nZ żywym na kwiaty spadały migotem,\nJako rubiny oprawując złotem."
    verse: true
    chunks:
      - pl: "I światłość w kształcie rzeki kryształowej"
        ru: "И свет в образе хрустальной реки"
      - pl: "\nPłynęła, błyszcząc pomiędzy brzegami"
        ru: "тёк, сверкая между берегами,"
      - pl: "\nOdzierzganymi pierwiosnków kwiatami;"
        ru: "окаймлёнными цветами первоцветов;"
        note: "odzierzgać — окаймлять; pierwiosnek — первоцвет"
      - pl: "\nZ tej rzeki światła tryskając iskrami,"
        ru: "из этой реки света, брызжа искрами,"
      - pl: "\nZ żywym na kwiaty spadały migotem,"
        ru: "они с живым мерцанием падали на цветы,"
      - pl: "\nJako rubiny oprawując złotem."
        ru: "как рубины, оправленные в золото."
    words: { "kształcie": ksztalt, "rzeki": rzeka, "Płynęła": plynac, "błyszcząc": blyszczec, "brzegami": brzeg, "złotem": zloto }
  - clean: "Światła tych kwiatów upojone wonią,\nTonęły potem pod cudowną tonią,\nNa przemian tonąc, to wschodząc spod fali.\n«Wysoka żądza, co teraz cię pali,\nAby, co widzisz z dala, poznać bliżej,\nTym milsza dla mnie, im cię wznosi wyżej,\nLecz wpierw pragnienie zgaś w tych fal przeźroczu»."
    verse: true
    chunks:
      - pl: "Światła tych kwiatów upojone wonią,"
        ru: "Светила, опьянённые ароматом этих цветов,"
      - pl: "\nTonęły potem pod cudowną tonią,"
        ru: "тонули потом в чудесной глубине,"
      - pl: "\nNa przemian tonąc, to wschodząc spod fali."
        ru: "попеременно то погружаясь, то всходя из-под волны."
      - pl: "\n«Wysoka żądza, co teraz cię pali,"
        ru: "«Высокое желание, что теперь тебя жжёт, —"
      - pl: "\nAby, co widzisz z dala, poznać bliżej,"
        ru: "то, что видишь издали, узнать ближе, —"
      - pl: "\nTym milsza dla mnie, im cię wznosi wyżej,"
        ru: "тем милее мне, чем выше тебя возносит;"
      - pl: "\nLecz wpierw pragnienie zgaś w tych fal przeźroczu»."
        ru: "но прежде утоли жажду в прозрачности этих волн»."
    words: { "wonią": won, "fali": fala, "wznosi": wznosic, "wpierw": wpierw, "pragnienie": pragnienie, "zgaś": zgasic }
  - clean: "Tak mi mówiło słońce moich oczu,\nDodając jeszcze: «Rzeka i topazy,\nCo toną w wodzie i wschodzą nad wodę,\nKwiaty ziejące wonie tak przyjemne,\nSą to zwiastunki prawdy, jej obrazy.\nRzeczy te same w sobie nie są ciemne."
