paragraphs:
  - clean: "Tak więc wróciłem. Przez długi czas musiałem leżeć nieprzytomny na maszynie. Migotliwe następstwo dni i nocy wróciło, słońce znów stało się złote, niebo błękitne. Oddychałem swobodniej. Falujące zarysy lądu przypływały i odpływały. Wskazówki kręciły się na tarczach wstecz. W końcu znów zobaczyłem niewyraźne cienie domów, ślady upadającej ludzkości."
    en: "“So I came back. For a long time I must have been insensible upon the machine. The blinking succession of the days and nights was resumed, the sun got golden again, the sky blue. I breathed with greater freedom. The fluctuating contours of the land ebbed and flowed. The hands spun backward upon the dials. At last I saw again the dim shadows of houses, the evidences of decadent humanity."
    draft: true
    chunks:
      - pl: "Tak więc wróciłem."
        ru: "Так я вернулся."
      - pl: " Przez długi czas musiałem leżeć nieprzytomny na maszynie."
        ru: "Долгое время я, должно быть, пролежал на машине без чувств."
        note: "nieprzytomny — без сознания"
      - pl: " Migotliwe następstwo dni i nocy wróciło, słońce znów stało się złote, niebo błękitne."
        ru: "Мерцающее чередование дней и ночей возобновилось, солнце снова стало золотым, небо — голубым."
      - pl: " Oddychałem swobodniej."
        ru: "Я задышал свободнее."
      - pl: " Falujące zarysy lądu przypływały i odpływały."
        ru: "Колеблющиеся очертания суши то наплывали, то отступали."
        note: "ląd — суша"
      - pl: " Wskazówki kręciły się na tarczach wstecz."
        ru: "Стрелки на циферблатах крутились назад."
      - pl: " W końcu znów zobaczyłem niewyraźne cienie domów, ślady upadającej ludzkości."
        ru: "Наконец я снова увидел смутные тени домов, следы приходящего в упадок человечества."
    words: { "nieprzytomny": nieprzytomny, "swobodniej": swobodnie, "lądu": lad, "tarczach": tarcza, "wstecz": wstecz, "ludzkości": ludzkosc }
  - clean: "One też się zmieniały i przemijały, a przychodziły inne. Wkrótce, gdy tarcza milionów stanęła na zerze, zwolniłem. Zacząłem rozpoznawać naszą własną ładną i znajomą architekturę, wskazówka tysięcy cofnęła się do punktu wyjścia, noc i dzień migały coraz wolniej. Potem otoczyły mnie stare ściany laboratorium. Teraz bardzo łagodnie zwolniłem mechanizm."
    en: "These, too, changed and passed, and others came. Presently, when the million dial was at zero, I slackened speed. I began to recognise our own pretty and familiar architecture, the thousands hand ran back to the starting-point, the night and day flapped slower and slower. Then the old walls of the laboratory came round me. Very gently, now, I slowed the mechanism down."
    draft: true
    chunks:
      - pl: "One też się zmieniały i przemijały, a przychodziły inne."
        ru: "Они тоже менялись и проходили, и появлялись другие."
      - pl: " Wkrótce, gdy tarcza milionów stanęła na zerze, zwolniłem."
        ru: "Вскоре, когда циферблат миллионов встал на ноль, я сбавил скорость."
      - pl: " Zacząłem rozpoznawać naszą własną ładną i znajomą architekturę, wskazówka tysięcy cofnęła się do punktu wyjścia, noc i dzień migały coraz wolniej."
        ru: "Я начал узнавать нашу собственную милую знакомую архитектуру, стрелка тысяч вернулась к исходной точке, ночь и день мелькали всё медленнее."
      - pl: " Potem otoczyły mnie stare ściany laboratorium."
        ru: "Потом меня обступили старые стены лаборатории."
      - pl: " Teraz bardzo łagodnie zwolniłem mechanizm."
        ru: "Теперь я очень плавно замедлил механизм."
    words: { "tarcza": tarcza, "zerze": zero, "rozpoznawać": rozpoznawac, "wskazówka": wskazowka, "wolniej": wolno, "otoczyły": otoczyc }
  - clean: "Zobaczyłem jedną drobną rzecz, która wydała mi się dziwna. Chyba wam mówiłem, że gdy wyruszałem, zanim moja prędkość stała się bardzo duża, pani Watchett przeszła przez pokój, poruszając się, jak mi się zdawało, niczym rakieta. Wracając, przeszedłem znów przez tę minutę, gdy przechodziła przez laboratorium. Ale teraz każdy jej ruch wydawał się dokładnym odwróceniem poprzednich. Drzwi w dolnym końcu się otworzyły, a ona cicho przesunęła się przez laboratorium tyłem do przodu i zniknęła za drzwiami, którymi przedtem weszła. Tuż przedtem wydało mi się, że przez chwilę widzę Hillyera; ale przemknął jak błyskawica."
    en: "“I saw one little thing that seemed odd to me. I think I have told you that when I set out, before my velocity became very high, Mrs. Watchett had walked across the room, travelling, as it seemed to me, like a rocket. As I returned, I passed again across that minute when she traversed the laboratory. But now her every motion appeared to be the exact inversion of her previous ones. The door at the lower end opened, and she glided quietly up the laboratory, back foremost, and disappeared behind the door by which she had previously entered. Just before that I seemed to see Hillyer for a moment; but he passed like a flash."
    draft: true
    chunks:
      - pl: "Zobaczyłem jedną drobną rzecz, która wydała mi się dziwna."
        ru: "Я заметил одну мелочь, показавшуюся мне странной."
      - pl: " Chyba wam mówiłem, że gdy wyruszałem, zanim moja prędkość stała się bardzo duża, pani Watchett przeszła przez pokój, poruszając się, jak mi się zdawało, niczym rakieta."
        ru: "Кажется, я вам говорил, что, когда я отправлялся, прежде чем скорость моя стала очень большой, миссис Уотчет прошла через комнату, двигаясь, как мне показалось, словно ракета."
      - pl: " Wracając, przeszedłem znów przez tę minutę, gdy przechodziła przez laboratorium."
        ru: "Возвращаясь, я снова прошёл через ту минуту, когда она пересекала лабораторию."
      - pl: " Ale teraz każdy jej ruch wydawał się dokładnym odwróceniem poprzednich."
        ru: "Но теперь каждое её движение казалось точным обращением прежних."
      - pl: " Drzwi w dolnym końcu się otworzyły, a ona cicho przesunęła się przez laboratorium tyłem do przodu"
        ru: "Дверь в дальнем конце открылась, и она тихо проскользнула через лабораторию задом наперёд"
        note: "tyłem do przodu — задом наперёд"
      - pl: " i zniknęła za drzwiami, którymi przedtem weszła."
        ru: "и исчезла за дверью, через которую прежде вошла."
      - pl: " Tuż przedtem wydało mi się, że przez chwilę widzę Hillyera; ale przemknął jak błyskawica."
        ru: "Перед этим мне показалось, что на миг я вижу Хильера; но он промелькнул, как молния."
        note: "błyskawica — молния"
    words: { "poruszając": poruszac, "rakieta": rakieta, "dokładnym": dokladny, "dolnym": dolny, "przesunęła": przesunac, "przedtem": przedtem }
  - clean: "Potem zatrzymałem maszynę i znów zobaczyłem wokół stare znajome laboratorium, moje narzędzia, moje przyrządy dokładnie tak, jak je zostawiłem. Zszedłem z maszyny, bardzo się chwiejąc, i usiadłem na ławie. Przez kilka minut gwałtownie drżałem. Potem się uspokoiłem. Wokół mnie znów był mój stary warsztat, dokładnie taki jak przedtem. Mogło się zdawać, że tu zasnąłem i że wszystko to było snem."
    en: "“Then I stopped the machine, and saw about me again the old familiar laboratory, my tools, my appliances just as I had left them. I got off the thing very shakily, and sat down upon my bench. For several minutes I trembled violently. Then I became calmer. Around me was my old workshop again, exactly as it had been. I might have slept there, and the whole thing have been a dream."
    draft: true
    chunks:
      - pl: "Potem zatrzymałem maszynę i znów zobaczyłem wokół stare znajome laboratorium, moje narzędzia, moje przyrządy dokładnie tak, jak je zostawiłem."
        ru: "Потом я остановил машину и снова увидел вокруг старую знакомую лабораторию, мои инструменты, мои приборы точно такими, какими я их оставил."
        note: "przyrząd — прибор"
      - pl: " Zszedłem z maszyny, bardzo się chwiejąc, i usiadłem na ławie."
        ru: "Я слез с машины, сильно шатаясь, и сел на скамью."
      - pl: " Przez kilka minut gwałtownie drżałem."
        ru: "Несколько минут я сильно дрожал."
      - pl: " Potem się uspokoiłem."
        ru: "Потом успокоился."
      - pl: " Wokół mnie znów był mój stary warsztat, dokładnie taki jak przedtem."
        ru: "Вокруг меня снова была моя старая мастерская, в точности такая, как прежде."
      - pl: " Mogło się zdawać, że tu zasnąłem i że wszystko to było snem."
        ru: "Можно было подумать, что я тут уснул и всё это было сном."
    words: { "laboratorium": laboratorium, "narzędzia": narzedzie, "ławie": lawa, "warsztat": warsztat, "przedtem": przedtem, "zasnąłem": zasnac }
  - clean: "A jednak niezupełnie! Maszyna wyruszyła z południowo-wschodniego rogu laboratorium. Zatrzymała się znów w północno-zachodnim, przy ścianie, pod którą ją widzieliście. To daje wam dokładną odległość od mojego małego trawnika do cokołu Białego Sfinksa, do którego Morlokowie zanieśli moją maszynę."
    en: "“And yet, not exactly! The thing had started from the south-east corner of the laboratory. It had come to rest again in the north-west, against the wall where you saw it. That gives you the exact distance from my little lawn to the pedestal of the White Sphinx, into which the Morlocks had carried my machine."
    draft: true
    chunks:
      - pl: "A jednak niezupełnie!"
        ru: "И всё же не совсем!"
      - pl: " Maszyna wyruszyła z południowo-wschodniego rogu laboratorium."
        ru: "Машина отправилась из юго-восточного угла лаборатории."
      - pl: " Zatrzymała się znów w północno-zachodnim, przy ścianie, pod którą ją widzieliście."
        ru: "Остановилась она снова в северо-западном, у стены, где вы её видели."
      - pl: " To daje wam dokładną odległość od mojego małego trawnika do cokołu Białego Sfinksa, do którego Morlokowie zanieśli moją maszynę."
        ru: "Это и даёт вам точное расстояние от моей маленькой лужайки до пьедестала Белого Сфинкса, куда морлоки унесли мою машину."
