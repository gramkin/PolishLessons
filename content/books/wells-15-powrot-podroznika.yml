  - clean: "Przez jakiś czas mój mózg stał w miejscu. Potem wstałem i przyszedłem tu korytarzem, kulejąc, bo pięta wciąż mnie bolała, i czując się okropnie brudny. Zobaczyłem „Pall Mall Gazette” na stole przy drzwiach. Stwierdziłem, że data jest rzeczywiście dzisiejsza, a spojrzawszy na zegar, zobaczyłem, że jest prawie ósma. Usłyszałem wasze głosy i brzęk talerzy. Zawahałem się — czułem się tak chory i słaby. Potem poczułem zapach dobrego, zdrowego mięsa i otworzyłem drzwi do was. Resztę znacie. Umyłem się, zjadłem obiad, a teraz opowiadam wam tę historię."
    en: "“For a time my brain went stagnant. Presently I got up and came through the passage here, limping, because my heel was still painful, and feeling sorely begrimed. I saw the Pall Mall Gazette on the table by the door. I found the date was indeed today, and looking at the timepiece, saw the hour was almost eight o’clock. I heard your voices and the clatter of plates. I hesitated—I felt so sick and weak. Then I sniffed good wholesome meat, and opened the door on you. You know the rest. I washed, and dined, and now I am telling you the story."
    draft: true
    chunks:
