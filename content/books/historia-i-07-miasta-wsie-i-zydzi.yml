  - clean: "Książęta nie kierowali się wyłącznie dobrocią serca. Żydzi byli dla nich cennymi poddanymi: zajmowali się handlem i finansami, płacili wysokie podatki i podlegali bezpośrednio władcy. Mimo to Polska na wiele stuleci stała się dla Żydów miejscem względnego bezpieczeństwa. Żydowska legenda opowiada, że kiedy uciekinierzy z zachodu dotarli do polskich lasów, usłyszeli z nieba słowa „po lin”, co po hebrajsku znaczy „tu odpocznij”. Stąd hebrajska nazwa Polski: Polin. W XVIII wieku na ziemiach Rzeczypospolitej mieszkała największa społeczność żydowska na świecie. O ich życiu, kulturze i tragicznym końcu będziemy jeszcze wielokrotnie opowiadać."
