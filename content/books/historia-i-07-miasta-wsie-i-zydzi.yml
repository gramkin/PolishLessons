  - clean: "Wiele polskich miast należało do Hanzy, wielkiego związku miast kupieckich, który panował nad handlem na Morzu Bałtyckim i Północnym. Członkami Hanzy były Gdańsk, Toruń, Elbląg, Wrocław, a przez pewien czas nawet Kraków. Kupcy hanzeatyccy mieli swoje przedstawicielstwa w Londynie, Brugii, Bergen i w Nowogrodzie Wielkim, gdzie kupowali futra i wosk. Z Polski wywożono zboże, drewno, sól, ołów i miedź, a sprowadzano sukno, wino, śledzie i przyprawy. Śledzie były szczególnie ważne, bo w czasie licznych postów nie wolno było jeść mięsa. Kupcy jeździli z karawanami wozów, często z uzbrojoną eskortą, a drogi były niebezpieczne i pełne komór celnych. Z tego handlu wyrosło bogactwo miast, którego śladem są do dziś wspaniałe ratusze, kościoły i kamienice Gdańska, Torunia czy Krakowa."
