  - clean: "Książęta nie kierowali się wyłącznie dobrocią serca. Żydzi byli dla nich cennymi poddanymi: zajmowali się handlem i finansami, płacili wysokie podatki i podlegali bezpośrednio władcy. Mimo to Polska na wiele stuleci stała się dla Żydów miejscem względnego bezpieczeństwa. Żydowska legenda opowiada, że kiedy uciekinierzy z zachodu dotarli do polskich lasów, usłyszeli z nieba słowa „po lin”, co po hebrajsku znaczy „tu odpocznij”. Stąd hebrajska nazwa Polski: Polin. W XVIII wieku na ziemiach Rzeczypospolitej mieszkała największa społeczność żydowska na świecie. O ich życiu, kulturze i tragicznym końcu będziemy jeszcze wielokrotnie opowiadać."
    draft: true
    chunks:
      - pl: "Książęta nie kierowali się wyłącznie dobrocią serca."
        ru: "Князья руководствовались не одной лишь добротой сердца."
        note: "kierować się czymś — руководствоваться чем-л."
      - pl: " Żydzi byli dla nich cennymi poddanymi: zajmowali się handlem i finansami, płacili wysokie podatki i podlegali bezpośrednio władcy."
        ru: "Евреи были для них ценными подданными: они занимались торговлей и финансами, платили высокие налоги и подчинялись непосредственно правителю."
        note: "podatek — налог"
      - pl: " Mimo to Polska na wiele stuleci stała się dla Żydów miejscem względnego bezpieczeństwa."
        ru: "Тем не менее Польша на много веков стала для евреев местом относительной безопасности."
        note: "względny — относительный"
      - pl: " Żydowska legenda opowiada, że kiedy uciekinierzy z zachodu dotarli do polskich lasów, usłyszeli z nieba słowa „po lin”, co po hebrajsku znaczy „tu odpocznij”."
