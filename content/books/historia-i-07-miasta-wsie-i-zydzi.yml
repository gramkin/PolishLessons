chapter: 7
chapterTitle: "Miasta, wsie i Żydzi"
chapterTitleRu: "Города, деревни и евреи"
level: B2
paragraphs:
  - clean: "Gdyby podróżnik z czasów Bolesława Chrobrego odwiedził Polskę trzysta lat później, nie poznałby jej. W miejscu lasów zobaczyłby pola, w miejscu małych osad wsie ciągnące się wzdłuż dróg, a obok grodów murowane miasta z rynkami, ratuszami i kościołami. Ta wielka przemiana dokonała się głównie w XIII wieku, w czasach rozbicia dzielnicowego. Historycy nazywają ją kolonizacją na prawie niemieckim. Choć słowo „kolonizacja” brzmi dziś groźnie, chodziło o coś zupełnie innego: o zakładanie nowych wsi i miast według nowych, lepszych zasad."
    draft: true
    chunks:
      - pl: "Gdyby podróżnik z czasów Bolesława Chrobrego odwiedził Polskę trzysta lat później, nie poznałby jej."
        ru: "Если бы путешественник времён Болеслава Храброго посетил Польшу через триста лет, он бы её не узнал."
        note: "poznać — здесь «узнать»"
      - pl: " W miejscu lasów zobaczyłby pola, w miejscu małych osad wsie ciągnące się wzdłuż dróg, a obok grodów murowane miasta z rynkami, ratuszami i kościołami."
        ru: "На месте лесов он увидел бы поля, на месте маленьких поселений — деревни, тянущиеся вдоль дорог, а рядом с градами — каменные города с рыночными площадями, ратушами и костёлами."
        note: "murowany — каменный, кирпичный; rynek — рыночная площадь; ratusz — ратуша"
      - pl: " Ta wielka przemiana dokonała się głównie w XIII wieku, w czasach rozbicia dzielnicowego."
        ru: "Это великое преобразование произошло главным образом в XIII веке, во времена удельной раздробленности."
        note: "przemiana — преобразование; dokonać się — совершиться"
      - pl: " Historycy nazywają ją kolonizacją na prawie niemieckim."
        ru: "Историки называют его колонизацией на немецком праве."
      - pl: " Choć słowo „kolonizacja” brzmi dziś groźnie, chodziło o coś zupełnie innego: o zakładanie nowych wsi i miast według nowych, lepszych zasad."
        ru: "Хотя слово «колонизация» звучит сегодня грозно, речь шла совсем о другом: об основании новых деревень и городов по новым, лучшим правилам."
        note: "brzmieć — звучать"
    words: { "wsie": wies, "ciągnące": ciagnac, "wzdłuż": wzdluz, "rynkami": rynek, "przemiana": przemiana, "głównie": glownie, "niemieckim": niemiecki, "wsi": wies }
  - clean: "Aby to zrozumieć, trzeba najpierw zobaczyć, jak żyła wieś w dawnych czasach. Chłop w państwie pierwszych Piastów nie był niewolnikiem, ale miał mnóstwo obowiązków. Musiał oddawać księciu daniny w naturze, budować i naprawiać grody, mosty i drogi, dawać podwody, czyli konie i wozy dla książęcych urzędników, i karmić książęcych łowców z ich psami. Obowiązków tych było kilkadziesiąt, a każdy z nich miał swoją nazwę. Nikt nie wiedział dokładnie, ile ma zapłacić w danym roku, bo wszystko zależało od potrzeb księcia i od uczciwości jego urzędników. Taki system był nieprzejrzysty i mało wydajny."
    draft: true
    chunks:
      - pl: "Aby to zrozumieć, trzeba najpierw zobaczyć, jak żyła wieś w dawnych czasach."
        ru: "Чтобы это понять, надо сначала увидеть, как жила деревня в прежние времена."
      - pl: " Chłop w państwie pierwszych Piastów nie był niewolnikiem, ale miał mnóstwo obowiązków."
        ru: "Крестьянин в государстве первых Пястов не был рабом, но у него было множество обязанностей."
        note: "obowiązek — обязанность; mnóstwo — множество"
      - pl: " Musiał oddawać księciu daniny w naturze, budować i naprawiać grody, mosty i drogi, dawać podwody, czyli konie i wozy dla książęcych urzędników, i karmić książęcych łowców z ich psami."
        ru: "Он должен был отдавать князю дань натурой, строить и чинить грады, мосты и дороги, давать подводы, то есть лошадей и повозки для княжеских чиновников, и кормить княжеских охотников с их собаками."
        note: "w naturze — натурой; podwoda — подвода; urzędnik — чиновник; łowca — охотник"
      - pl: " Obowiązków tych było kilkadziesiąt, a każdy z nich miał swoją nazwę."
        ru: "Таких повинностей было несколько десятков, и каждая имела своё название."
      - pl: " Nikt nie wiedział dokładnie, ile ma zapłacić w danym roku, bo wszystko zależało od potrzeb księcia i od uczciwości jego urzędników."
        ru: "Никто точно не знал, сколько придётся заплатить в данном году, потому что всё зависело от нужд князя и от честности его чиновников."
        note: "uczciwość — честность"
      - pl: " Taki system był nieprzejrzysty i mało wydajny."
        ru: "Такая система была непрозрачной и малоэффективной."
        note: "nieprzejrzysty — непрозрачный; wydajny — производительный, эффективный"
    words: { "wieś": wies, "Chłop": chlop, "niewolnikiem": niewolnik, "oddawać": oddawac, "naturze": natura, "budować": budowac, "naprawiać": naprawiac, "mosty": most, "urzędników": urzednik, "karmić": karmic, "łowców": lowca }
  - clean: "Na zachodzie Europy, zwłaszcza w Niemczech i we Flandrii, od dawna działało coś innego. Chłop dostawał na własne gospodarstwo określoną ilość ziemi, zwaną łanem, i płacił za nią stały czynsz w pieniądzu lub w zbożu. Wiedział dokładnie, ile jest winien, a reszta plonów należała do niego. Miał więc powód, żeby pracować więcej i lepiej. Wieś miała też własny samorząd i własny sąd. To właśnie nazywano prawem niemieckim. Nazwa mówi tylko, skąd przyszły te zasady, a nie, kto według nich żył."
    draft: true
    chunks:
      - pl: "Na zachodzie Europy, zwłaszcza w Niemczech i we Flandrii, od dawna działało coś innego."
        ru: "На западе Европы, особенно в Германии и во Фландрии, давно действовало нечто иное."
      - pl: " Chłop dostawał na własne gospodarstwo określoną ilość ziemi, zwaną łanem, i płacił za nią stały czynsz w pieniądzu lub w zbożu."
        ru: "Крестьянин получал в собственное хозяйство определённое количество земли, называемое ланом, и платил за неё постоянный чинш деньгами или зерном."
        note: "łan — лан, мера земли; czynsz — чинш, оброк; gospodarstwo — хозяйство"
      - pl: " Wiedział dokładnie, ile jest winien, a reszta plonów należała do niego."
        ru: "Он точно знал, сколько должен, а остальной урожай принадлежал ему."
        note: "być winnym — быть должным; plon — урожай"
      - pl: " Miał więc powód, żeby pracować więcej i lepiej."
        ru: "Значит, у него была причина работать больше и лучше."
      - pl: " Wieś miała też własny samorząd i własny sąd."
        ru: "У деревни было и собственное самоуправление, и собственный суд."
        note: "samorząd — самоуправление"
      - pl: " To właśnie nazywano prawem niemieckim."
        ru: "Именно это и называли немецким правом."
      - pl: " Nazwa mówi tylko, skąd przyszły te zasady, a nie, kto według nich żył."
        ru: "Название говорит лишь о том, откуда пришли эти правила, а не о том, кто по ним жил."
    words: { "niemieckim": niemiecki, "Chłop": chlop, "zachodzie": zachod, "określoną": okreslic, "ilość": ilosc, "zwaną": zwac, "czynsz": czynsz, "zbożu": zboze, "Nazwa": nazwa }
  - clean: "Polscy książęta szybko zauważyli, że takie wsie przynoszą im znacznie więcej korzyści. Czynsz płacony w pieniądzu można było przeznaczyć na wojsko, dwór czy budowę zamków. Zaczęli więc zapraszać osadników z Niemiec, a jednocześnie przenosić na nowe prawo istniejące polskie wsie. Szczególnie dużo przybyszów osiedliło się na Śląsku i na Pomorzu. W innych dzielnicach większość nowych wsi zakładali sami Polacy. Rycerze i klasztory, którzy mieli własne ziemie, robili to samo co książęta."
    draft: true
    chunks:
      - pl: "Polscy książęta szybko zauważyli, że takie wsie przynoszą im znacznie więcej korzyści."
        ru: "Польские князья быстро заметили, что такие деревни приносят им значительно больше выгоды."
        note: "korzyść — выгода"
      - pl: " Czynsz płacony w pieniądzu można było przeznaczyć na wojsko, dwór czy budowę zamków."
        ru: "Чинш, уплачиваемый деньгами, можно было направить на войско, двор или постройку замков."
        note: "przeznaczyć — предназначить, направить"
      - pl: " Zaczęli więc zapraszać osadników z Niemiec, a jednocześnie przenosić na nowe prawo istniejące polskie wsie."
        ru: "Поэтому они начали приглашать поселенцев из Германии и одновременно переводить на новое право уже существующие польские деревни."
        note: "jednocześnie — одновременно"
      - pl: " Szczególnie dużo przybyszów osiedliło się na Śląsku i na Pomorzu."
        ru: "Особенно много пришельцев поселилось в Силезии и в Поморье."
      - pl: " W innych dzielnicach większość nowych wsi zakładali sami Polacy."
        ru: "В других уделах большинство новых деревень основывали сами поляки."
      - pl: " Rycerze i klasztory, którzy mieli własne ziemie, robili to samo co książęta."
        ru: "Рыцари и монастыри, владевшие собственными землями, делали то же, что и князья."
    words: { "wsie": wies, "wsi": wies, "Polscy": polski, "przynoszą": przynosic, "znacznie": znacznie, "korzyści": korzysc, "przeznaczyć": przeznaczyc, "wojsko": wojsko, "dwór": dwor, "budowę": budowa, "zamków": zamek, "zapraszać": zapraszac, "jednocześnie": jednoczesnie, "przenosić": przenosic, "polskie": polski, "Szczególnie": szczegolnie, "dzielnicach": dzielnica, "Rycerze": rycerz, "klasztory": klasztor }
  - clean: "Jak zakładano nową wieś? Właściciel ziemi, na przykład książę albo klasztor, umawiał się z przedsiębiorczym człowiekiem, którego nazywano zasadźcą. Zasadźca dostawał dokument, czyli przywilej lokacyjny, w którym zapisano wszystkie warunki. Jego zadaniem było znaleźć osadników, wymierzyć łany i zorganizować życie we wsi. W nagrodę otrzymywał kilka łanów ziemi wolnych od czynszu, prawo do prowadzenia karczmy i młyna, a także część opłat sądowych. Łan nie miał wszędzie tej samej wielkości: łan frankoński liczył około dwudziestu czterech hektarów, a łan chełmiński około siedemnastu. Gospodarstwo chłopskie obejmowało zwykle jeden łan albo pół łanu, co wystarczało do wyżywienia rodziny i zapłacenia czynszu. Zostawał też dziedzicznym sołtysem, czyli przełożonym wsi. Słowo „sołtys” przetrwało w Polsce do dziś, choć dziś wybierają go mieszkańcy."
    draft: true
    chunks:
      - pl: "Jak zakładano nową wieś?"
        ru: "Как основывали новую деревню?"
      - pl: " Właściciel ziemi, na przykład książę albo klasztor, umawiał się z przedsiębiorczym człowiekiem, którego nazywano zasadźcą."
        ru: "Владелец земли, например князь или монастырь, договаривался с предприимчивым человеком, которого называли засадцем, или локатором."
        note: "przedsiębiorczy — предприимчивый; zasadźca — локатор, устроитель поселения"
      - pl: " Zasadźca dostawał dokument, czyli przywilej lokacyjny, w którym zapisano wszystkie warunki."
        ru: "Локатор получал документ, то есть локационную привилегию, в которой были записаны все условия."
        note: "lokacja — основание поселения на новом праве"
      - pl: " Jego zadaniem było znaleźć osadników, wymierzyć łany i zorganizować życie we wsi."
        ru: "Его задачей было найти поселенцев, отмерить ланы и наладить жизнь в деревне."
        note: "wymierzyć — отмерить"
      - pl: " W nagrodę otrzymywał kilka łanów ziemi wolnych od czynszu, prawo do prowadzenia karczmy i młyna, a także część opłat sądowych."
        ru: "В награду он получал несколько ланов земли, свободных от чинша, право держать корчму и мельницу, а также часть судебных сборов."
        note: "młyn — мельница; opłata — плата, сбор"
      - pl: " Łan nie miał wszędzie tej samej wielkości: łan frankoński liczył około dwudziestu czterech hektarów, a łan chełmiński około siedemnastu."
        ru: "Лан не везде был одного размера: франконский лан составлял около двадцати четырёх гектаров, а хелминский — около семнадцати."
        note: "hektar — гектар"
      - pl: " Gospodarstwo chłopskie obejmowało zwykle jeden łan albo pół łanu, co wystarczało do wyżywienia rodziny i zapłacenia czynszu."
        ru: "Крестьянское хозяйство обычно включало один лан или пол-лана, чего хватало, чтобы прокормить семью и заплатить чинш."
        note: "wystarczać — хватать"
      - pl: " Zostawał też dziedzicznym sołtysem, czyli przełożonym wsi."
        ru: "Он становился также наследственным солтысом, то есть старостой деревни."
        note: "sołtys — солтыс, сельский староста; przełożony — начальник"
      - pl: " Słowo „sołtys” przetrwało w Polsce do dziś, choć dziś wybierają go mieszkańcy."
        ru: "Слово «солтыс» сохранилось в Польше до сих пор, хотя теперь его выбирают жители."
    words: { "wsi": wies, "wieś": wies, "klasztor": klasztor, "umawiał": umawiac, "przywilej": przywilej, "zapisano": zapisac, "zorganizować": zorganizowac, "otrzymywał": otrzymywac, "czynszu": czynsz, "opłat": oplata, "sądowych": sadowy, "wielkości": wielkosc, "dwudziestu": dwadziescia, "chłopskie": chlopski, "wystarczało": wystarczac, "mieszkańcy": mieszkaniec }
  - clean: "Nowi osadnicy dostawali na początek kilka, a nawet kilkanaście lat wolnizny, czyli zwolnienia od czynszu. Był to czas na wykarczowanie lasu, osuszenie bagien i zbudowanie domów. Niektóre nazwy miejscowości przypominają do dziś o tamtym wysiłku. Wsie o nazwach Wola albo Wólka powstały tam, gdzie osadnicy korzystali z takiej wolności, a nazwy takie jak Łazy czy Żary mówią o wycinaniu i wypalaniu lasu. Na mapie Polski jest dziś kilkaset miejscowości o nazwie Wola."
    draft: true
    chunks:
      - pl: "Nowi osadnicy dostawali na początek kilka, a nawet kilkanaście lat wolnizny, czyli zwolnienia od czynszu."
        ru: "Новые поселенцы получали для начала несколько, а то и полтора десятка лет вольницы, то есть освобождения от чинша."
        note: "wolnizna — льготные годы без платежей; zwolnienie — освобождение"
      - pl: " Był to czas na wykarczowanie lasu, osuszenie bagien i zbudowanie domów."
        ru: "Это было время на то, чтобы выкорчевать лес, осушить болота и построить дома."
        note: "wykarczować — выкорчевать; osuszyć — осушить"
      - pl: " Niektóre nazwy miejscowości przypominają do dziś o tamtym wysiłku."
        ru: "Некоторые названия населённых пунктов до сих пор напоминают о тех усилиях."
        note: "wysiłek — усилие"
      - pl: " Wsie o nazwach Wola albo Wólka powstały tam, gdzie osadnicy korzystali z takiej wolności, a nazwy takie jak Łazy czy Żary mówią o wycinaniu i wypalaniu lasu."
        ru: "Деревни с названиями Воля или Вулька возникли там, где поселенцы пользовались такой льготой, а названия вроде Лазы или Жары говорят о вырубке и выжигании леса."
        note: "wycinać — вырубать"
      - pl: " Na mapie Polski jest dziś kilkaset miejscowości o nazwie Wola."
        ru: "На карте Польши сегодня несколько сотен населённых пунктов с названием Воля."
    words: { "czynszu": czynsz, "kilkanaście": kilkanascie, "bagien": bagno, "nazwy": nazwa, "wysiłku": wysilek, "nazwach": nazwa, "powstały": powstac, "korzystali": korzystac, "mapie": mapa }
  - clean: "Nowe wsie wyglądały inaczej niż stare. Domy stały zwykle w jednym albo dwóch rzędach wzdłuż drogi lub strumienia, a za każdym domem ciągnął się długi pas pola. Na mapach i zdjęciach lotniczych taki układ widać do dziś w wielu regionach Polski. Upowszechniła się też trójpolówka. Pole dzielono na trzy części: jedną obsiewano zbożem ozimym, drugą jarym, a trzecia odpoczywała jako ugór. Co roku części się zmieniały. Zamiast prostego drewnianego radła coraz częściej używano ciężkiego pługa z żelaznym lemieszem, który odwracał skibę ziemi."
    draft: true
    chunks:
      - pl: "Nowe wsie wyglądały inaczej niż stare."
        ru: "Новые деревни выглядели иначе, чем старые."
      - pl: " Domy stały zwykle w jednym albo dwóch rzędach wzdłuż drogi lub strumienia, a za każdym domem ciągnął się długi pas pola."
        ru: "Дома стояли обычно в один или два ряда вдоль дороги или ручья, а за каждым домом тянулась длинная полоса поля."
        note: "strumień — ручей; pas — полоса"
      - pl: " Na mapach i zdjęciach lotniczych taki układ widać do dziś w wielu regionach Polski."
        ru: "На картах и аэрофотоснимках такая планировка видна до сих пор во многих районах Польши."
        note: "układ — планировка, расположение; zdjęcie lotnicze — аэрофотоснимок"
      - pl: " Upowszechniła się też trójpolówka."
        ru: "Распространилось и трёхполье."
        note: "upowszechnić się — распространиться"
      - pl: " Pole dzielono na trzy części: jedną obsiewano zbożem ozimym, drugą jarym, a trzecia odpoczywała jako ugór."
        ru: "Поле делили на три части: одну засевали озимыми, другую яровыми, а третья отдыхала под паром."
        note: "obsiewać — засевать; ozimy — озимый; jary — яровой; ugór — пар, залежь"
