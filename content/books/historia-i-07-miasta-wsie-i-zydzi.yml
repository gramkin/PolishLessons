  - clean: "Żydzi nie byli jedyną mniejszością w średniowiecznej Polsce i Litwie. Najstarszym zachowanym nagrobkiem żydowskim na ziemiach polskich jest macewa z Wrocławia z 1203 roku, postawiona na grobie niejakiego Dawida. We Lwowie i innych miastach Rusi osiedlali się Ormianie, kupcy i rzemieślnicy, którzy zachowali własny Kościół i własne sądy. Katedra ormiańska we Lwowie, zbudowana w XIV wieku, stoi do dziś. Wielki książę Witold sprowadził na Litwę z Krymu Karaimów, niewielki lud wyznający własną odmianę judaizmu, i Tatarów, którzy osiedlili się jako żołnierze. Karaimi żyją w Trokach koło Wilna do dziś, a potomkowie litewskich Tatarów, wyznający islam, mieszkają w Polsce na Podlasiu i mają tam swoje drewniane meczety. W Karpatach osiedlali się wołoscy pasterze, którzy przywędrowali z Bałkanów wzdłuż grzbietów górskich ze swoimi stadami owiec. Od nich pochodzi wiele słów związanych z pasterstwem, a także część tradycji górali, Łemków i Bojków. Dawna Rzeczpospolita była więc mozaiką ludów i religii na długo przed tym, zanim takie słowa stały się modne. Wiele z tych wspólnot przetrwało w swojej odrębności aż do XX wieku, a niektóre istnieją do dziś."
    draft: true
    chunks:
      - pl: "Żydzi nie byli jedyną mniejszością w średniowiecznej Polsce i Litwie."
        ru: "Евреи были не единственным меньшинством в средневековой Польше и Литве."
      - pl: " Najstarszym zachowanym nagrobkiem żydowskim na ziemiach polskich jest macewa z Wrocławia z 1203 roku, postawiona na grobie niejakiego Dawida."
        ru: "Древнейшим сохранившимся еврейским надгробием на польских землях является маццева из Вроцлава 1203 года, поставленная на могиле некоего Давида."
        note: "macewa — маццева, еврейское надгробие"
      - pl: " We Lwowie i innych miastach Rusi osiedlali się Ormianie, kupcy i rzemieślnicy, którzy zachowali własny Kościół i własne sądy."
        ru: "Во Львове и других городах Руси селились армяне, купцы и ремесленники, сохранившие собственную церковь и собственные суды."
      - pl: " Katedra ormiańska we Lwowie, zbudowana w XIV wieku, stoi do dziś."
        ru: "Армянский собор во Львове, построенный в XIV веке, стоит до сих пор."
      - pl: " Wielki książę Witold sprowadził na Litwę z Krymu Karaimów, niewielki lud wyznający własną odmianę judaizmu, i Tatarów, którzy osiedlili się jako żołnierze."
        ru: "Великий князь Витовт переселил в Литву из Крыма караимов — небольшой народ, исповедующий собственную разновидность иудаизма, — и татар, поселившихся как воины."
        note: "Karaim — караим; odmiana — разновидность"
      - pl: " Karaimi żyją w Trokach koło Wilna do dziś, a potomkowie litewskich Tatarów, wyznający islam, mieszkają w Polsce na Podlasiu i mają tam swoje drewniane meczety."
        ru: "Караимы до сих пор живут в Тракае под Вильнюсом, а потомки литовских татар, исповедующие ислам, живут в Польше в Подляшье и имеют там свои деревянные мечети."
      - pl: " W Karpatach osiedlali się wołoscy pasterze, którzy przywędrowali z Bałkanów wzdłuż grzbietów górskich ze swoimi stadami owiec."
        ru: "В Карпатах селились валашские пастухи, пришедшие с Балкан вдоль горных хребтов со своими стадами овец."
        note: "wołoski — валашский; grzbiet — хребет; stado — стадо"
      - pl: " Od nich pochodzi wiele słów związanych z pasterstwem, a także część tradycji górali, Łemków i Bojków."
        ru: "От них происходит много слов, связанных с пастушеством, а также часть традиций горцев, лемков и бойков."
        note: "pasterstwo — пастушество"
      - pl: " Dawna Rzeczpospolita była więc mozaiką ludów i religii na długo przed tym, zanim takie słowa stały się modne."
        ru: "Таким образом, старая Речь Посполитая была мозаикой народов и религий задолго до того, как такие слова вошли в моду."
        note: "mozaika — мозаика"
      - pl: " Wiele z tych wspólnot przetrwało w swojej odrębności aż do XX wieku, a niektóre istnieją do dziś."
        ru: "Многие из этих общин сохраняли свою обособленность вплоть до XX века, а некоторые существуют до сих пор."
        note: "odrębność — обособленность"
