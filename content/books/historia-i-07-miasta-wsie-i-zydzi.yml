  - clean: "Wraz z miastami rozwijała się obecność jeszcze jednej grupy, która miała odegrać w historii Polski ogromną rolę. Żydzi przybywali na ziemie polskie już w X i XI wieku jako kupcy. Pierwszym, który opisał państwo Mieszka, był przecież żydowski podróżnik Ibrahim ibn Jakub. W XII wieku żydowscy mincerze bili dla polskich książąt monety, na których obok łacińskich znajdowały się napisy hebrajskie. W Krakowie Żydzi mieszkali przez długi czas w pobliżu uniwersytetu, przy ulicy, którą dziś nazywa się ulicą świętej Anny, a wcześniej nazywano ją po prostu Żydowską. Mieli tam swoją synagogę, łaźnię i szkołę, a ich sąsiadami byli profesorowie i studenci. Stosunki między sąsiadami nie zawsze układały się dobrze i w XV wieku dochodziło do zamieszek, po których Żydów przeniesiono do Kazimierza. Najwięcej Żydów przybyło jednak w XIII i XIV wieku z Niemiec i z Czech, gdzie spotykały ich coraz częstsze prześladowania."
