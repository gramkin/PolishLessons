  - clean: "W 1264 roku książę wielkopolski Bolesław Pobożny wydał w Kaliszu przywilej dla Żydów, nazywany statutem kaliskim. Gwarantował on Żydom bezpieczeństwo osobiste i majątkowe, swobodę handlu i podróżowania, a także własne sądy w sprawach między Żydami. Za zniszczenie synagogi albo cmentarza żydowskiego groziła surowa kara. Jeden z punktów zakazywał oskarżania Żydów o mord rytualny, czyli o używanie krwi chrześcijańskich dzieci. W tamtych czasach podobne oskarżenia wywoływały w Europie krwawe pogromy, więc ten przepis miał wielkie znaczenie. Kazimierz Wielki rozszerzył później statut na całe królestwo."
