# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 7
chapterTitle: "Pieśń VII"
chapterTitleRu: "Песнь VII. Скупцы и расточители"
level: B2
paragraphs:
  - clean: "(Plutus. Krąg IV. Skąpcy i marnotrawcy. Krąg V. Popędliwi.)"
    chunks:
      - pl: "(Plutus. Krąg IV. Skąpcy i marnotrawcy. Krąg V. Popędliwi.)"
        ru: "(Плутос. Круг IV. Скупцы и расточители. Круг V. Гневные.)"
        note: "skąpiec — скупец; marnotrawca — расточитель; popędliwy — вспыльчивый"
    words: { "Krąg": krag }
  - clean: "«Ojcze szatanie! Patrz no, jakie dziwy!»\nTak Plutus krzyczał głosem ochrypiałym.\nMądry przewodnik rzekł do mnie: «Bądź śmiałym,\nPokrzepmy w sobie umysł bojaźliwy;\nJaką bądź władzę mieć może ten potwór,\nNie wzbroni wejść nam w tych skał ciemny otwór»."
    verse: true
    chunks:
      - pl: "«Ojcze szatanie! Patrz no, jakie dziwy!»"
        ru: "«Отец сатана! Смотри-ка, какие чудеса!»"
        note: "dziwy — диковины, чудеса; у Данте загадочное Pape Satàn, pape Satàn aleppe!"
      - pl: "\nTak Plutus krzyczał głosem ochrypiałym."
        ru: "Так кричал Плутос хриплым голосом."
        note: "ochrypiały — охрипший"
      - pl: "\nMądry przewodnik rzekł do mnie: «Bądź śmiałym,"
        ru: "Мудрый проводник сказал мне: «Будь смелым,"
        note: "bądź śmiałym — твор. п. при być"
      - pl: "\nPokrzepmy w sobie umysł bojaźliwy;"
        ru: "укрепим в себе боязливый ум;"
        note: "pokrzepić — подкрепить; bojaźliwy — боязливый"
      - pl: "\nJaką bądź władzę mieć może ten potwór,"
        ru: "какую бы власть ни имело это чудовище,"
        note: "jaką bądź — какую бы ни; potwór — чудовище"
      - pl: "\nNie wzbroni wejść nam w tych skał ciemny otwór»."
        ru: "оно не запретит нам войти в тёмное отверстие этих скал»."
        note: "wzbronić — запретить; otwór — отверстие"
    words: { "szatanie": szatan, "przewodnik": przewodnik, "rzekł": rzec, "otwór": otwor, "skał": skala, "ciemny": ciemny }
  - clean: "Potem w potwora policzek nadęty\nSpojrzał i mówił: «Milcz, wilku przeklęty!\nNiechaj cię strawi własny wybuch gniewu.\nPodróży naszej nie wstrzyma zawada:\nTam, tam chcą tego, gdzie hardy łeb smoka\nMichał Archanioł zdeptał w mgnieniu oka»."
    verse: true
    chunks:
      - pl: "Potem w potwora policzek nadęty"
        ru: "Потом на надутую щёку чудовища"
        note: "nadęty — надутый"
      - pl: "\nSpojrzał i mówił: «Milcz, wilku przeklęty!"
        ru: "взглянул и сказал: «Молчи, проклятый волк!"
        note: "milcz — молчи"
      - pl: "\nNiechaj cię strawi własny wybuch gniewu."
        ru: "Пусть тебя сожрёт собственная вспышка гнева."
        note: "strawić — переварить, поглотить"
      - pl: "\nPodróży naszej nie wstrzyma zawada:"
        ru: "Нашего странствия не остановит преграда:"
        note: "zawada — помеха, преграда"
      - pl: "\nTam, tam chcą tego, gdzie hardy łeb smoka"
        ru: "так хотят там, там, где надменную голову дракона"
        note: "łeb — голова (животного); smok — дракон"
      - pl: "\nMichał Archanioł zdeptał w mgnieniu oka»."
        ru: "Михаил Архангел попрал в мгновение ока»."
        note: "zdeptać — растоптать; w mgnieniu oka — в мгновение ока"
    words: { "policzek": policzek, "przeklęty": przeklety, "wybuch": wybuch, "gniewu": gniew, "wstrzyma": wstrzymac, "smoka": smok }
  - clean: "Jak żagiel wzdęty od wiatrów powiewu,\nGdy maszt się łamie, zwija się, upada,\nRównie jak długi legł potwór zażarty,\nMy schodziliśmy powoli w krąg czwarty ,\nBliżej zważając to miejsce boleści,\nKędy złe świata całego się mieści."
    verse: true
    chunks:
      - pl: "Jak żagiel wzdęty od wiatrów powiewu,"
        ru: "Как парус, вздутый от дуновения ветров,"
        note: "żagiel — парус; wzdęty — вздутый; powiew — дуновение"
      - pl: "\nGdy maszt się łamie, zwija się, upada,"
        ru: "когда мачта ломается, свёртывается, падает,"
        note: "maszt — мачта; zwijać się — свёртываться"
      - pl: "\nRównie jak długi legł potwór zażarty,"
        ru: "так во весь рост рухнуло свирепое чудовище,"
        note: "jak długi — во весь рост; legnąć — лечь; zażarty — ожесточённый"
      - pl: "\nMy schodziliśmy powoli w krąg czwarty ,"
        ru: "мы же спускались медленно в четвёртый круг,"
      - pl: "\nBliżej zważając to miejsce boleści,"
        ru: "ближе рассматривая это место скорби,"
        note: "zważać — устар. «рассматривать»"
      - pl: "\nKędy złe świata całego się mieści."
        ru: "где помещается зло всего света."
        note: "kędy — где; mieścić się — помещаться"
    words: { "wiatrów": wiatr, "łamie": lamac, "Równie": rownie, "schodziliśmy": schodzic, "powoli": powoli, "mieści": miescic }
  - clean: "Sprawiedliwości boża! Kto ogarnie\nNowe, com widział, kary i męczarnie,\nNagotowane tam przez twoje rządy?\nDlaczego błędy nasze tak nas toczą?\nJak gdy Charybdy dwa przeciwne prądy\nZetrą się z sobą, od siebie odskoczą,\nTak się ścierają tam duchy z duchami\nA potępieńcy, widziałem, bez liku,\nJako dwa wojska szły w bojowym szyku,\nTocząc ogromne ciężary piersiami."
    verse: true
    chunks:
      - pl: "Sprawiedliwości boża! Kto ogarnie"
        ru: "Правосудие Божье! Кто охватит [умом]"
        note: "ogarnąć — охватить, постичь"
      - pl: "\nNowe, com widział, kary i męczarnie,"
        ru: "новые, что я видел, кары и муки,"
        note: "com = co + -m"
      - pl: "\nNagotowane tam przez twoje rządy?"
        ru: "уготованные там твоим правлением?"
        note: "nagotowany — приготовленный; rządy — правление"
      - pl: "\nDlaczego błędy nasze tak nas toczą?"
        ru: "Почему наши грехи так нас точат?"
        note: "toczyć — точить, подтачивать"
      - pl: "\nJak gdy Charybdy dwa przeciwne prądy"
        ru: "Как когда два встречных течения Харибды"
        note: "Charybda — Харибда, водоворот в Мессинском проливе"
      - pl: "\nZetrą się z sobą, od siebie odskoczą,"
        ru: "столкнутся друг с другом и отскочат одно от другого,"
        note: "zetrzeć się — столкнуться, сшибиться"
      - pl: "\nTak się ścierają tam duchy z duchami"
        ru: "так сшибаются там духи с духами;"
      - pl: "\nA potępieńcy, widziałem, bez liku,"
        ru: "а осуждённые, видел я, без счёта,"
        note: "bez liku — без счёта"
      - pl: "\nJako dwa wojska szły w bojowym szyku,"
        ru: "как два войска, шли в боевом строю,"
        note: "szyk — строй"
      - pl: "\nTocząc ogromne ciężary piersiami."
        ru: "катя огромные тяжести грудью."
        note: "toczyć — катить; ciężar — тяжесть"
    words: { "ogarnie": ogarnac, "toczą": toczyc, "przeciwne": przeciwny, "prądy": prad, "bojowym": bojowy, "ciężary": ciezar }
  - clean: "W pierwszym natarciu zwarli się, a potem\nNagle bezładnym pierzchnęli odwrotem,\nKrzycząc: Precz, skąpcy! Precz, marnotrawniki! —\nTak z obu krańców po tym kręgu czarnym\nLud bieżąc tłumem niezgodnym i gwarnym,\nMiotał bez przerwy obelgi i krzyki:\nKażdy od kręgu swojego połowy\nPowracał, turniej rozpoczynać nowy."
    verse: true
    chunks:
      - pl: "W pierwszym natarciu zwarli się, a potem"
        ru: "В первом натиске они сшиблись, а потом"
        note: "natarcie — натиск; zewrzeć się — сцепиться"
      - pl: "\nNagle bezładnym pierzchnęli odwrotem,"
        ru: "вдруг беспорядочно бросились в отступление,"
        note: "bezładny — беспорядочный; pierzchnąć — броситься врассыпную; odwrót — отступление"
      - pl: "\nKrzycząc: Precz, skąpcy! Precz, marnotrawniki! —"
        ru: "крича: «Прочь, скупцы! Прочь, расточители!» —"
        note: "marnotrawniki — старая форма, ныне marnotrawcy"
      - pl: "\nTak z obu krańców po tym kręgu czarnym"
        ru: "так с обоих концов по этому чёрному кругу"
        note: "kraniec — край, конец"
      - pl: "\nLud bieżąc tłumem niezgodnym i gwarnym,"
        ru: "народ, бегущий толпой нестройной и шумной,"
        note: "bieżąc — устар. «бегущий»; gwarny — шумный"
      - pl: "\nMiotał bez przerwy obelgi i krzyki:"
        ru: "метал без перерыва оскорбления и крики:"
        note: "obelga — оскорбление"
      - pl: "\nKażdy od kręgu swojego połowy"
        ru: "каждый от половины своего круга"
      - pl: "\nPowracał, turniej rozpoczynać nowy."
        ru: "возвращался начинать новый поединок."
        note: "turniej — турнир, поединок"
    words: { "odwrotem": odwrot, "tłumem": tlum, "przerwy": przerwa, "obelgi": obelga, "turniej": turniej, "rozpoczynać": rozpoczynac }
  - clean: "Patrzając na nich z żalem nad ich biedą,\nRzekłem: «Mów, mistrzu, co to za gmin lichy?\nCi postrzyżeni, co na lewo idą,\nCzy byli świeccy za życia, czy mnichy?»\nA mistrz: «Ci wszyscy, co na siebie godzą,\nMiary pojęciem nie dostrzegli płytkiem."
    verse: true
    chunks:
      - pl: "Patrzając na nich z żalem nad ich biedą,"
        ru: "Глядя на них с жалостью к их беде,"
        note: "patrzając — старая форма, ныне patrząc"
      - pl: "\nRzekłem: «Mów, mistrzu, co to za gmin lichy?"
        ru: "я сказал: «Скажи, учитель, что это за жалкий люд?"
        note: "gmin — простонародье; lichy — жалкий"
      - pl: "\nCi postrzyżeni, co na lewo idą,"
        ru: "Эти остриженные, что идут налево,"
        note: "postrzyżony — остриженный; тонзура — знак клирика"
      - pl: "\nCzy byli świeccy za życia, czy mnichy?»"
        ru: "были при жизни мирянами или монахами?»"
        note: "świecki — светский, мирянин; mnichy — устар. мн., ныне mnisi"
      - pl: "\nA mistrz: «Ci wszyscy, co na siebie godzą,"
        ru: "А учитель: «Все эти, что бьют друг на друга,"
        note: "godzić na coś — покушаться, нападать"
      - pl: "\nMiary pojęciem nie dostrzegli płytkiem."
        ru: "мелким разумением не разглядели меры."
        note: "pojęcie — понятие, разумение; płytkiem — ныне płytkim"
    words: { "żalem": zal, "mistrzu": mistrz, "Miary": miara, "dostrzegli": dostrzec }
  - clean: "Jedni zgrzeszyli skąpstwem, drudzy zbytkiem.\nGłos ich wyraźnie brzmi w dwoistym echu,\nGdy się z dwóch krańców tego kręgu schodzą\nGdzie ich rozdziela przeciwieństwo grzechu.\nCi, co bez włosów nagą czaszką świecą,\nSą to łakomcy, mnich, papież, kardynał,\nCo ducha w jarzmo łakomstwa uginał»."
    verse: true
    chunks:
      - pl: "Jedni zgrzeszyli skąpstwem, drudzy zbytkiem."
        ru: "Одни согрешили скупостью, другие — излишеством."
        note: "skąpstwo — скупость; zbytek — излишество, роскошь"
      - pl: "\nGłos ich wyraźnie brzmi w dwoistym echu,"
        ru: "Их голос ясно звучит двойным эхом,"
        note: "dwoisty — двойной"
      - pl: "\nGdy się z dwóch krańców tego kręgu schodzą"
        ru: "когда они сходятся с двух концов этого круга,"
      - pl: "\nGdzie ich rozdziela przeciwieństwo grzechu."
        ru: "где их разделяет противоположность греха."
        note: "przeciwieństwo — противоположность"
      - pl: "\nCi, co bez włosów nagą czaszką świecą,"
        ru: "Те, что безволосыми голыми черепами блестят,"
        note: "czaszka — череп"
      - pl: "\nSą to łakomcy, mnich, papież, kardynał,"
        ru: "— это жадные, монах, папа, кардинал,"
        note: "łakomiec — жадина"
      - pl: "\nCo ducha w jarzmo łakomstwa uginał»."
        ru: "что дух сгибал под ярмо алчности»."
        note: "uginać — сгибать"
    words: { "echu": echo, "przeciwieństwo": przeciwienstwo, "czaszką": czaszka, "mnich": mnich, "papież": papiez, "jarzmo": jarzmo }
  - clean: "«Mistrzu», mówiłem, «jakoś mi się roi,\nŻe wśród tej ciżby, którą brudy szpecą,\nBrudy tych piekieł, są znajomi moi».\nA mistrz mi na to: «Tak, proszę, nie myślij,\nOni już tutaj z brudem życia przyszli.\nTu wiecznie będą tłuc się jak obecnie,\nTak skąpcy, jak ci, co tracili mienie;\nCi wstaną na sąd z głową pozbawioną\nWłosów, a tamci z pięścią zacieśnioną."
    verse: true
    chunks:
      - pl: "«Mistrzu», mówiłem, «jakoś mi się roi,"
        ru: "«Учитель, — говорил я, — что-то мне чудится,"
        note: "roić się — мерещиться"
      - pl: "\nŻe wśród tej ciżby, którą brudy szpecą,"
        ru: "что в этой толпе, которую грязь уродует,"
        note: "ciżba — толпа, давка"
      - pl: "\nBrudy tych piekieł, są znajomi moi»."
        ru: "грязь этих преисподних, есть мои знакомые»."
        note: "brudy — нечистоты"
      - pl: "\nA mistrz mi na to: «Tak, proszę, nie myślij,"
        ru: "А учитель мне на это: «Так, прошу, не думай,"
        note: "myślij — старое повел., ныне myśl"
      - pl: "\nOni już tutaj z brudem życia przyszli."
        ru: "они уже сюда пришли с грязью жизни."
      - pl: "\nTu wiecznie będą tłuc się jak obecnie,"
        ru: "Здесь вечно они будут биться, как теперь,"
        note: "obecnie — теперь"
      - pl: "\nTak skąpcy, jak ci, co tracili mienie;"
        ru: "как скупцы, так и те, что растратили имущество;"
        note: "mienie — имущество"
      - pl: "\nCi wstaną na sąd z głową pozbawioną"
        ru: "одни встанут на Суд с головой, лишённой"
      - pl: "\nWłosów, a tamci z pięścią zacieśnioną."
        ru: "волос, а другие — со сжатым кулаком."
        note: "pięść — кулак; zacieśniony — сжатый"
    words: { "brudy": brud, "piekieł": pieklo, "wiecznie": wiecznie, "obecnie": obecnie, "pozbawioną": pozbawic, "pięścią": piesc }
  - clean: "Ci, co skąpili, i ci, co trwonili,\nZa grzech ten piękny świat nieba stracili;\nPatrz na ich karę, ta więcej ci powie,\nNiżbym w wymownym wypowiedział słowie.\nTeraz, mój synu, możesz widzieć jasno,\nJak szybko bańki pękają i gasną\nDóbr powierzonych Fortunie, a człowiek\nGoni za nimi do zawarcia powiek!"
    verse: true
    chunks:
      - pl: "Ci, co skąpili, i ci, co trwonili,"
        ru: "Те, что скупились, и те, что расточали,"
        note: "skąpić — скупиться; trwonić — расточать"
      - pl: "\nZa grzech ten piękny świat nieba stracili;"
        ru: "за этот грех потеряли прекрасный мир неба;"
      - pl: "\nPatrz na ich karę, ta więcej ci powie,"
        ru: "посмотри на их кару, она скажет тебе больше,"
      - pl: "\nNiżbym w wymownym wypowiedział słowie."
        ru: "чем выразил бы я красноречивым словом."
        note: "niżbym = niż + bym; wymowny — красноречивый"
      - pl: "\nTeraz, mój synu, możesz widzieć jasno,"
        ru: "Теперь, сын мой, ты можешь ясно видеть,"
      - pl: "\nJak szybko bańki pękają i gasną"
        ru: "как быстро лопаются и гаснут пузыри"
        note: "bańka — пузырь; pękać — лопаться"
      - pl: "\nDóbr powierzonych Fortunie, a człowiek"
        ru: "благ, вверенных Фортуне, а человек"
        note: "dobra — блага; powierzony — вверенный"
      - pl: "\nGoni za nimi do zawarcia powiek!"
        ru: "гонится за ними до смыкания век!"
        note: "zawarcie — смыкание"
    words: { "grzech": grzech, "karę": kara, "wypowiedział": wypowiedziec, "Fortunie": fortuna, "Goni": gonic, "zawarcia": zawrzec }
  - clean: "Ile jest w ziemi, ile było złota,\nŻaden z tych duchów znużonych widocznie,\nGdyby je posiadł, na chwilę nie spocznie».\n«Mistrzu, mów, kto jest dóbr ziemskich królowa\nKto ta Fortuna, o której tu mowa?\nKto ona, co tak wszechmocnie bogata,\nW swych szponach trzyma wszystkie dobra świata?»"
    verse: true
    chunks:
      - pl: "Ile jest w ziemi, ile było złota,"
        ru: "Сколько есть в земле, сколько было золота, —"
      - pl: "\nŻaden z tych duchów znużonych widocznie,"
        ru: "ни один из этих явно утомлённых духов,"
        note: "znużony — утомлённый"
      - pl: "\nGdyby je posiadł, na chwilę nie spocznie»."
        ru: "если бы им завладел, не отдохнёт и на миг»."
        note: "posiąść — завладеть; spocząć — отдохнуть"
      - pl: "\n«Mistrzu, mów, kto jest dóbr ziemskich królowa"
        ru: "«Учитель, скажи, кто эта царица земных благ,"
      - pl: "\nKto ta Fortuna, o której tu mowa?"
        ru: "кто эта Фортуна, о которой здесь речь?"
        note: "o której mowa — о которой речь"
      - pl: "\nKto ona, co tak wszechmocnie bogata,"
        ru: "Кто она, что так всемогуще богата,"
      - pl: "\nW swych szponach trzyma wszystkie dobra świata?»"
        ru: "в своих когтях держит все блага мира?»"
        note: "szpon — коготь"
    words: { "widocznie": widocznie, "posiadł": posiasc, "spocznie": spoczac, "ziemskich": ziemski, "królowa": krolowa, "bogata": bogaty }
