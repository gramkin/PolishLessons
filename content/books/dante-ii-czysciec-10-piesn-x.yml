# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 10
chapterTitle: "Pieśń X"
chapterTitleRu: "Песнь X. Гордецы"
level: B2
paragraphs:
  - clean: "(Oddział II. Krąg I. Dumni.)"
    chunks:
      - pl: "(Oddział II. Krąg I. Dumni.)"
        ru: "(Отдел II. Круг I. Гордые.)"
        note: "dumny — гордый"
    words: { "Oddział": oddzial, "Krąg": krag, "Dumni": dumny }
  - clean: "Kiedyśmy za próg już przeszli drzwi święte,\nKtórych tak rzadko próg otworem stoi,\nZ powodu ludzi złej woli, co roi,\nŻe najprostszymi widzi drogi kręte,\nW ich dźwięku czułem, że były zamknięte.\nGdybym tam do nich obrócił me oczy,\nGdzież jest wymówka takiej winy godna?"
    verse: true
    chunks:
      - pl: "Kiedyśmy za próg już przeszli drzwi święte,"
        ru: "Когда мы уже прошли за порог святых дверей,"
      - pl: "\nKtórych tak rzadko próg otworem stoi,"
        ru: "чей порог так редко стоит открытым"
      - pl: "\nZ powodu ludzi złej woli, co roi,"
        ru: "из-за людей злой воли, которым мнится,"
      - pl: "\nŻe najprostszymi widzi drogi kręte,"
        ru: "что кривые дороги они видят самыми прямыми,"
      - pl: "\nW ich dźwięku czułem, że były zamknięte."
        ru: "по их звуку я почувствовал, что они закрылись."
      - pl: "\nGdybym tam do nich obrócił me oczy,"
        ru: "Если бы я там обратил к ним свои глаза,"
      - pl: "\nGdzież jest wymówka takiej winy godna?"
        ru: "где оправдание, достойное такой вины?"
        note: "wymówka — оправдание"
    words: { "próg": prog, "otworem": otwor, "obrócił": obrocic, "Gdzież": gdziez, "wymówka": wymowka, "godna": godny }
  - clean: "I szliśmy środkiem rozkłutej opoki,\nCo nam z obu stron zwężała swe boki,\nTo roztaczała jako fala wodna,\nGdy o brzeg trąci, a potem odskoczy.\n«Tu» wódz rzekł «trzeba nieco użyć sztuki,\nTam i sam szersze stopą kreśląc łuki,\nIdźmy, gdzie głębsze ma skała wydroże»."
    verse: true
    chunks:
      - pl: "I szliśmy środkiem rozkłutej opoki,"
        ru: "И мы шли посередине расколотой скалы,"
      - pl: "\nCo nam z obu stron zwężała swe boki,"
        ru: "что с обеих сторон то сужала нам свои бока,"
      - pl: "\nTo roztaczała jako fala wodna,"
        ru: "то раздвигала их, как водная волна,"
      - pl: "\nGdy o brzeg trąci, a potem odskoczy."
        ru: "когда толкнётся о берег, а потом отскочит."
      - pl: "\n«Tu» wódz rzekł «trzeba nieco użyć sztuki,"
        ru: "«Здесь, — сказал вождь, — нужно немного искусства:"
      - pl: "\nTam i sam szersze stopą kreśląc łuki,"
        ru: "то здесь, то там очерчивая ногой более широкие дуги,"
      - pl: "\nIdźmy, gdzie głębsze ma skała wydroże»."
        ru: "пойдём там, где у скалы более глубокая выемка»."
    words: { "wodna": wodny, "brzeg": brzeg, "wódz": wodz, "rzekł": rzec, "szersze": szeroki, "łuki": luk }
  - clean: "Ta troska nasze tak spóźniła kroki,\nŻe zachodzący księżyc o tej porze\nJuż do snu głowę skłonił na swe łoże,\nWprzód nim wyszliśmy z wąskiej rozpadliny.\nLecz gdyśmy przyszli na plac otworzysty,\nTam, gdzie ma góra bok więcej spłaszczony,\nOba niepewni drogi, ja znużony,\nStaliśmy chwilę na jej płaskim sklepie,\nPustym i dzikim jak droga na stepie."
    verse: true
    chunks:
      - pl: "Ta troska nasze tak spóźniła kroki,"
        ru: "Эта забота так замедлила наши шаги,"
      - pl: "\nŻe zachodzący księżyc o tej porze"
        ru: "что заходящий месяц к этой поре"
      - pl: "\nJuż do snu głowę skłonił na swe łoże,"
        ru: "уже склонил голову ко сну на своё ложе,"
      - pl: "\nWprzód nim wyszliśmy z wąskiej rozpadliny."
        ru: "прежде чем мы вышли из узкой расщелины."
      - pl: "\nLecz gdyśmy przyszli na plac otworzysty,"
        ru: "Но когда мы пришли на открытую площадку,"
        note: "otworzysty — открытый"
      - pl: "\nTam, gdzie ma góra bok więcej spłaszczony,"
        ru: "там, где у горы бок более сплющен,"
      - pl: "\nOba niepewni drogi, ja znużony,"
        ru: "оба неуверенные в дороге, я усталый,"
      - pl: "\nStaliśmy chwilę na jej płaskim sklepie,"
        ru: "мы постояли минуту на её плоском уступе,"
        note: "sklep — здесь «уступ, свод»"
      - pl: "\nPustym i dzikim jak droga na stepie."
        ru: "пустом и диком, как дорога в степи."
    words: { "spóźniła": spoznic, "księżyc": ksiezyc, "głowę": glowa, "plac": plac, "góra": gora, "dzikim": dziki }
  - clean: "Z brzegu otchłani do wyższej drożyny,\nKtóra po skałach pięła się wysoko,\nBył plac jak na wzrost człowieka troisty;\nW lewo, na prawo, ile mogło oko\nSięgać, widziałem, płaski głazu kawał\nRównoodlegle od skały wystawał."
    verse: true
    chunks:
      - pl: "Z brzegu otchłani do wyższej drożyny,"
        ru: "От края бездны до более высокой тропинки,"
      - pl: "\nKtóra po skałach pięła się wysoko,"
        ru: "что карабкалась по скалам высоко,"
      - pl: "\nBył plac jak na wzrost człowieka troisty;"
        ru: "была площадка шириной в три человеческих роста;"
        note: "troisty — тройной"
      - pl: "\nW lewo, na prawo, ile mogło oko"
        ru: "налево, направо, сколько мог глаз"
      - pl: "\nSięgać, widziałem, płaski głazu kawał"
        ru: "достать, я видел, плоский кусок камня"
      - pl: "\nRównoodlegle od skały wystawał."
        ru: "равномерно выступал от скалы."
        note: "równoodlegle — на равном расстоянии"
    words: { "wyższej": wysoki, "skałach": skala, "pięła": piac, "wzrost": wzrost, "Sięgać": siegac, "kawał": kawal }
  - clean: "Wnętrzna z białego marmuru jej ściana\nProsta, pod samo jej ostrze ściosana,\nPłaskorzeźbami wciąż była rzezana,\nNa wstyd arcydzieł natury i dłuta.\nAnioł, co zstąpił na ziemskie padoły\nZ wieścią pokoju, którego wespoły\nŚwiat we łzach wzywał przez tak długie lata,\nA który niebo otworzył dla świata;\nTam postać tego anioła wykuta\nTaką dyszała prawdą i naturą,\nŻe się nie zdawał być niemą figurą,\nKażdy by przysiągł, że on mówił: Ave."
    verse: true
    chunks:
      - pl: "Wnętrzna z białego marmuru jej ściana"
        ru: "Внутренняя её стена из белого мрамора,"
      - pl: "\nProsta, pod samo jej ostrze ściosana,"
        ru: "прямая, обтёсанная до самого края,"
        note: "ściosany — обтёсанный"
      - pl: "\nPłaskorzeźbami wciąż była rzezana,"
        ru: "была вся изваяна барельефами,"
        note: "płaskorzeźba — барельеф; rzezać — резать"
      - pl: "\nNa wstyd arcydzieł natury i dłuta."
        ru: "к стыду шедевров природы и резца."
        note: "arcydzieło — шедевр; dłuto — резец"
      - pl: "\nAnioł, co zstąpił na ziemskie padoły"
        ru: "Ангел, что сошёл в земные долы"
        note: "padół — дол, юдоль"
      - pl: "\nZ wieścią pokoju, którego wespoły"
        ru: "с вестью мира, который вместе"
      - pl: "\nŚwiat we łzach wzywał przez tak długie lata,"
        ru: "мир в слезах призывал столько долгих лет"
      - pl: "\nA który niebo otworzył dla świata;"
        ru: "и который открыл небо для мира;"
      - pl: "\nTam postać tego anioła wykuta"
        ru: "там изваянный облик этого ангела"
      - pl: "\nTaką dyszała prawdą i naturą,"
        ru: "дышал такой правдой и естественностью,"
      - pl: "\nŻe się nie zdawał być niemą figurą,"
        ru: "что не казался немой фигурой,"
      - pl: "\nKażdy by przysiągł, że on mówił: Ave."
        ru: "всякий поклялся бы, что он говорил: «Ave»."
        note: "«Радуйся» — Благовещение"
    words: { "ostrze": ostrze, "wstyd": wstyd, "ziemskie": ziemski, "łzach": lza, "wzywał": wzywac, "przysiągł": przysiegnac }
  - clean: "Bo i Tej snycerz tam wyrył postawę,\nCo wymodliła klucze, aby niemi\nWszechmocną miłość otworzyć na ziemi,\nTam wyraziły jej postać, jej lica,\nOdpowiedź: *Otom Pańska służebnica!*\nWiernie jak pieczęć woskowa tablica."
    verse: true
    chunks:
      - pl: "Bo i Tej snycerz tam wyrył postawę,"
        ru: "Ибо и Той ваятель там высек облик,"
        note: "snycerz — резчик, ваятель"
      - pl: "\nCo wymodliła klucze, aby niemi"
        ru: "что вымолила ключи, чтобы ими"
      - pl: "\nWszechmocną miłość otworzyć na ziemi,"
        ru: "всемогущую любовь открыть на земле;"
      - pl: "\nTam wyraziły jej postać, jej lica,"
        ru: "там её облик, её лицо выразили"
      - pl: "\nOdpowiedź: *Otom Pańska służebnica!*"
        ru: "ответ: «Се, раба Господня!»"
        note: "służebnica — раба, служанка"
      - pl: "\nWiernie jak pieczęć woskowa tablica."
        ru: "верно, как печать — восковую дощечку."
        note: "tablica — дощечка"
    words: { "postawę": postawa, "wyraziły": wyrazic, "postać": postac, "Odpowiedź": odpowiedz, "Pańska": panski, "tablica": tablica }
  - clean: "«Niech w jednym punkcie twoja myśl nie tonie,»\nSłodki mistrz mówił, mając mię na stronie,\nTuż blisko siebie, gdzie nam serce bije.\nPodszedłem patrzeć, widziałem Maryję;\nPotem zachodząc z drugiej mistrza strony\nWidziałem w rzeźbie drugą historyję,\nZ bliska w niej topiąc wzrok mój zachwycony."
    verse: true
    chunks:
      - pl: "«Niech w jednym punkcie twoja myśl nie tonie,»"
        ru: "«Пусть твоя мысль не тонет в одной точке», —"
      - pl: "\nSłodki mistrz mówił, mając mię na stronie,"
        ru: "сказал сладкий учитель, держа меня сбоку,"
      - pl: "\nTuż blisko siebie, gdzie nam serce bije."
        ru: "совсем близко к себе, где у нас бьётся сердце."
      - pl: "\nPodszedłem patrzeć, widziałem Maryję;"
        ru: "Я подошёл посмотреть, я видел Марию;"
      - pl: "\nPotem zachodząc z drugiej mistrza strony"
        ru: "потом, заходя с другой стороны учителя,"
      - pl: "\nWidziałem w rzeźbie drugą historyję,"
        ru: "я увидел в скульптуре другую историю,"
      - pl: "\nZ bliska w niej topiąc wzrok mój zachwycony."
        ru: "вблизи погружая в неё свой восхищённый взгляд."
    words: { "mistrz": mistrz, "bije": bic, "Podszedłem": podejsc, "rzeźbie": rzezba, "wzrok": wzrok, "zachwycony": zachwycic }
  - clean: "Tam rydwan byków sprzężajem ciągniony\nWiózł arkę świętą; śmierć tego uderza,\nKomu jej straży sam Bóg nie powierza.\nLud bieżał tłumem przed arką przymierza,\nSiedmiu chórami dwa mi zmysły kłóci,\nMiędzy *Tak*, nuci, i *Nie*, on nie nuci."
    verse: true
    chunks:
      - pl: "Tam rydwan byków sprzężajem ciągniony"
        ru: "Там колесница, влекомая упряжкой быков,"
        note: "sprzężaj — упряжка"
      - pl: "\nWiózł arkę świętą; śmierć tego uderza,"
        ru: "везла святой ковчег; смерть поражает того,"
        note: "arka — ковчег; Оза"
      - pl: "\nKomu jej straży sam Bóg nie powierza."
        ru: "кому сам Бог не вверяет его стражи."
      - pl: "\nLud bieżał tłumem przed arką przymierza,"
        ru: "Народ бежал толпой перед ковчегом завета,"
      - pl: "\nSiedmiu chórami dwa mi zmysły kłóci,"
        ru: "семью хорами два моих чувства спорили,"
        note: "kłócić — спорить, смущать"
      - pl: "\nMiędzy *Tak*, nuci, i *Nie*, on nie nuci."
        ru: "между «Да, поёт» и «Нет, не поёт»."
        note: "слух и зрение"
    words: { "byków": byk, "uderza": uderzac, "straży": straz, "tłumem": tlum, "chórami": chor, "zmysły": zmysl }
  - clean: "I dym kadzideł w podobne złudzenie\nWtrącił dwa zmysły, wzrok i powonienie,\nTaka w nim prawda była rzeczywista!\nOd długiej sukni z połą zachyloną,\nWodząc rej tańca pokorny Psalmista\nPrzed ową urną biegł błogosławioną,\nA był tam wyższym i niższym od kroli."
    verse: true
    chunks:
      - pl: "I dym kadzideł w podobne złudzenie"
        ru: "И дым кадильниц в подобное заблуждение"
        note: "kadzidło — курение"
      - pl: "\nWtrącił dwa zmysły, wzrok i powonienie,"
        ru: "вверг два чувства, зрение и обоняние,"
        note: "powonienie — обоняние"
      - pl: "\nTaka w nim prawda była rzeczywista!"
        ru: "такая в нём была живая правда!"
      - pl: "\nOd długiej sukni z połą zachyloną,"
        ru: "В длинной одежде, с подоткнутой полой,"
        note: "zachylony — подоткнутый"
      - pl: "\nWodząc rej tańca pokorny Psalmista"
        ru: "ведя пляску, смиренный Псалмопевец"
        note: "wodzić rej — верховодить; Давид"
      - pl: "\nPrzed ową urną biegł błogosławioną,"
        ru: "бежал перед тем благословенным ковчегом,"
      - pl: "\nA był tam wyższym i niższym od kroli."
        ru: "и был там и выше, и ниже царей."
        note: "kroli — устар."
    words: { "Wtrącił": wtracic, "sukni": suknia, "Wodząc": wodzic, "tańca": taniec, "błogosławioną": blogoslawic, "niższym": niski }
  - clean: "Z okien pałacu szydna twarz Micholi\nNań poglądała wzdłuż ulicy miasta,\nJak pełna wzgardy i smutku niewiasta.\nZ miejsca, gdzie stałem, stopy oderwałem,\nBy bliżej widzieć historyję nową,\nW której utkwiłem me oczy z zapałem."
    verse: true
    chunks:
      - pl: "Z okien pałacu szydna twarz Micholi"
        ru: "Из окон дворца насмешливое лицо Мелхолы"
        note: "szydny — насмешливый"
      - pl: "\nNań poglądała wzdłuż ulicy miasta,"
        ru: "смотрело на него вдоль улицы города,"
      - pl: "\nJak pełna wzgardy i smutku niewiasta."
        ru: "как женщина, полная презрения и печали."
      - pl: "\nZ miejsca, gdzie stałem, stopy oderwałem,"
        ru: "С места, где я стоял, я оторвал ноги,"
      - pl: "\nBy bliżej widzieć historyję nową,"
        ru: "чтобы ближе увидеть новую историю,"
      - pl: "\nW której utkwiłem me oczy z zapałem."
        ru: "в которую я с жаром вперил глаза."
    words: { "okien": okno, "pałacu": palac, "ulicy": ulica, "smutku": smutek, "niewiasta": niewiasta, "bliżej": blisko }
  - clean: "Tam uwieczniony rzeźbą marmurową\nBył ten, którego cnotami ujęty,\nZ piekła wymodlił duszę Grzegorz święty\nImperatora rzymskiego Trajana.\nPrzy tręzlu jego rumaka w żałobie\nStała tam wdowa łzami upłakana;\nCezar tłum wielki jeźdźców miał przy sobie,\nA złote orły nad cezara głową\nGrały z wiatrami. Wdowa nieszczęśliwa\nWśród tłumu zda się w te słowa odzywa:"
    verse: true
    chunks:
      - pl: "Tam uwieczniony rzeźbą marmurową"
        ru: "Там увековечен мраморной скульптурой"
        note: "uwieczniony — увековеченный"
      - pl: "\nBył ten, którego cnotami ujęty,"
        ru: "был тот, чьими добродетелями пленённый"
      - pl: "\nZ piekła wymodlił duszę Grzegorz święty"
        ru: "святой Григорий вымолил из ада душу —"
      - pl: "\nImperatora rzymskiego Trajana."
        ru: "римского императора Траяна."
      - pl: "\nPrzy tręzlu jego rumaka w żałobie"
        ru: "У узды его коня в трауре"
        note: "tręzla — узда; rumak — конь"
      - pl: "\nStała tam wdowa łzami upłakana;"
        ru: "стояла там вдова, заплаканная слезами;"
      - pl: "\nCezar tłum wielki jeźdźców miał przy sobie,"
        ru: "у цезаря при себе была великая толпа всадников,"
      - pl: "\nA złote orły nad cezara głową"
        ru: "а золотые орлы над головой цезаря"
      - pl: "\nGrały z wiatrami. Wdowa nieszczęśliwa"
        ru: "играли с ветрами. Несчастная вдова"
      - pl: "\nWśród tłumu zda się w te słowa odzywa:"
        ru: "среди толпы, кажется, так говорит:"
    words: { "ujęty": ujac, "żałobie": zaloba, "wdowa": wdowa, "jeźdźców": jezdziec, "orły": orzel, "nieszczęśliwa": nieszczesliwy }
  - clean: "— «Zemścij się, panie, syna mi zabito,\nSerce mi pęka». A cezar: «Kobieto,\nCzekaj, nim z wojny powrócę». A ona,\nJak ten, którego bodzie boleść żywa,\n— «Jeśli nie wrócisz? umrę niezemszczona».\nA on: «Namiestnik mój w imię cezara\nUkoić twoją zemstę się postara»."
    verse: true
    chunks:
      - pl: "— «Zemścij się, panie, syna mi zabito,"
        ru: "— «Отомсти, господин, мне убили сына,"
        note: "zemścić się — отомстить"
      - pl: "\nSerce mi pęka». A cezar: «Kobieto,"
        ru: "сердце у меня разрывается». А цезарь: «Женщина,"
      - pl: "\nCzekaj, nim z wojny powrócę». A ona,"
        ru: "подожди, пока я вернусь с войны». А она,"
      - pl: "\nJak ten, którego bodzie boleść żywa,"
        ru: "как тот, кого колет живая боль:"
      - pl: "\n— «Jeśli nie wrócisz? umrę niezemszczona»."
        ru: "— «А если не вернёшься? я умру неотомщённой»."
      - pl: "\nA on: «Namiestnik mój w imię cezara"
        ru: "А он: «Мой наместник во имя цезаря"
      - pl: "\nUkoić twoją zemstę się postara»."
        ru: "постарается утолить твою месть»."
