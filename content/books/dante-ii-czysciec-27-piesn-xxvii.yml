  - clean: "I jako pasterz w noc u drzwi zagrody,\nCzuwa, by zwierz mu nie rozegnał trzody;\nJa byłem kozą, oni pasterzami,\nSkały zagrody naszej ostrokołem.\nPrzez błękit widny pomiędzy skałami\nWidziałem gwiazdy jaśniejsze daleko\nOd tych, co widzim śmiertelną powieką."
    verse: true
    chunks:
      - pl: "I jako pasterz w noc u drzwi zagrody,"
        ru: "и как пастух ночью у дверей загона"
      - pl: "\nCzuwa, by zwierz mu nie rozegnał trzody;"
        ru: "бодрствует, чтобы зверь не разогнал ему стада;"
      - pl: "\nJa byłem kozą, oni pasterzami,"
        ru: "я был козой, они — пастухами,"
      - pl: "\nSkały zagrody naszej ostrokołem."
        ru: "скалы — частоколом нашего загона."
        note: "ostrokół — частокол"
      - pl: "\nPrzez błękit widny pomiędzy skałami"
        ru: "Сквозь синеву, видную между скалами,"
      - pl: "\nWidziałem gwiazdy jaśniejsze daleko"
