      - pl: "\n«Zniża się słońce!» mówił, «blisko zmroku,"
        ru: "«Солнце садится! — сказал он, — близко сумерки,"
      - pl: "\nNie zatrzymujcie, lecz przyśpieszcie kroku,"
        ru: "не задерживайтесь, но ускорьте шаг,"
      - pl: "\nNim jeszcze zachód nie jest zaczerniony»."
