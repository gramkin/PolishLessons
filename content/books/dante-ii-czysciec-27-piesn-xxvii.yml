      - pl: "\nSpokojnie żują, albo w groty cieniu:"
        ru: "спокойно жуют или в тени грота:"
      - pl: "\nA pasterz, stojąc na swej lasce wsparty,"
        ru: "а пастух, стоя, опершись на свой посох,"
