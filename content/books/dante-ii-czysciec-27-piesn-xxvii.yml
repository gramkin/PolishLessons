  - clean: "Punkt, skąd promienie pierwsze słońce miota\nNa Jeruzalem, na krwawe Golgota,\n(Kiedy nad Ebro stoi Waga złota\nW samym zenicie, a Gangesu fale\nGrzeją się, płynąc w południm upale,)\nPunkt ten był wtenczas zajęty przez słońce;\nWięc dla nas nikło dnia światło gasnące,\nW chwili, gdy anioł zjawił się wesoły."
    verse: true
    chunks:
      - pl: "Punkt, skąd promienie pierwsze słońce miota"
        ru: "Точку, откуда солнце мечет первые лучи"
      - pl: "\nNa Jeruzalem, na krwawe Golgota,"
        ru: "на Иерусалим, на кровавую Голгофу,"
      - pl: "\n(Kiedy nad Ebro stoi Waga złota"
        ru: "(когда над Эбро стоят золотые Весы"
      - pl: "\nW samym zenicie, a Gangesu fale"
        ru: "в самом зените, а волны Ганга"
      - pl: "\nGrzeją się, płynąc w południm upale,)"
        ru: "греются, текя в полуденном зное,)"
        note: "południm — устар. «полуденном»"
      - pl: "\nPunkt ten był wtenczas zajęty przez słońce;"
        ru: "эту точку тогда занимало солнце;"
        note: "то есть был закат"
      - pl: "\nWięc dla nas nikło dnia światło gasnące,"
        ru: "итак, для нас меркнул гаснущий свет дня,"
      - pl: "\nW chwili, gdy anioł zjawił się wesoły."
        ru: "в тот миг, когда явился весёлый ангел."
    words: { "promienie": promien, "krwawe": krwawy, "Waga": waga, "Grzeją": grzac, "płynąc": plynac, "zjawił": zjawic }
  - clean: "Na zewnątrz ognia wystając na poły,\nStał i: Beati mundo corde śpiewał,\nA z piersi głosu strumienie wylewał.\nPotem: «Iść wyżej nie wolno wam, duchy,\nPóki was płomień nie ugryzie zrazu;\nIdźcie w płomienie, biada, kto jest głuchy\nNa pieśń, co śpiewa z bożego rozkazu»."
    verse: true
    chunks:
      - pl: "Na zewnątrz ognia wystając na poły,"
        ru: "Наполовину выступая из огня,"
      - pl: "\nStał i: Beati mundo corde śpiewał,"
        ru: "он стоял и пел: «Beati mundo corde»,"
        note: "«Блаженны чистые сердцем»"
      - pl: "\nA z piersi głosu strumienie wylewał."
        ru: "а из груди изливал потоки голоса."
      - pl: "\nPotem: «Iść wyżej nie wolno wam, duchy,"
        ru: "Потом: «Идти выше вам нельзя, духи,"
      - pl: "\nPóki was płomień nie ugryzie zrazu;"
        ru: "пока вас сперва не укусит пламя;"
      - pl: "\nIdźcie w płomienie, biada, kto jest głuchy"
        ru: "идите в пламя, горе тому, кто глух"
      - pl: "\nNa pieśń, co śpiewa z bożego rozkazu»."
        ru: "к песне, что поёт по Божьему велению»."
    words: { "piersi": piers, "strumienie": strumien, "płomień": plomien, "ugryzie": ugryzc, "głuchy": gluchy, "pieśń": piesn }
  - clean: "Tak mówił anioł: stojąc blisko niego,\nTakem się uląkł głosu potężnego,\nJakby kto grzebał mnie za życia w grobie.\nPatrząc na ogień wzniosłem ręce obie,\nMyśl wystraszona wciąż wyobrażała\nW ogniu, com widział, gorejące ciała."
    verse: true
    chunks:
      - pl: "Tak mówił anioł: stojąc blisko niego,"
        ru: "Так говорил ангел: стоя близко от него,"
      - pl: "\nTakem się uląkł głosu potężnego,"
        ru: "я так испугался могучего голоса,"
      - pl: "\nJakby kto grzebał mnie za życia w grobie."
        ru: "будто кто-то хоронил меня заживо в могиле."
        note: "grzebać — хоронить"
      - pl: "\nPatrząc na ogień wzniosłem ręce obie,"
        ru: "Глядя на огонь, я поднял обе руки,"
      - pl: "\nMyśl wystraszona wciąż wyobrażała"
        ru: "испуганная мысль всё представляла"
      - pl: "\nW ogniu, com widział, gorejące ciała."
        ru: "горящие в огне тела, что я видел."
    words: { "anioł": aniol, "potężnego": potezny, "grobie": grob, "wzniosłem": wzniesc, "wystraszona": wystraszyc, "wyobrażała": wyobrazac }
  - clean: "Wtem do mnie oba wodze się zwrócili:\n«Synu, tu nie ma śmierci!» rzekł Wirgili,\n«Tylko jest męka czasem określona.\nJeśli, przypomnij, nie zdjęła mię trwoga,\nGdym cię na barki wsadził Geryjona,\nCzegóż się lękać będąc bliżej Boga?"
    verse: true
    chunks:
      - pl: "Wtem do mnie oba wodze się zwrócili:"
        ru: "Тут ко мне обернулись оба вождя:"
      - pl: "\n«Synu, tu nie ma śmierci!» rzekł Wirgili,"
        ru: "«Сын, здесь нет смерти! — сказал Вергилий, —"
      - pl: "\n«Tylko jest męka czasem określona."
        ru: "лишь мука, ограниченная временем."
      - pl: "\nJeśli, przypomnij, nie zdjęła mię trwoga,"
        ru: "Вспомни, если меня не охватил страх,"
      - pl: "\nGdym cię na barki wsadził Geryjona,"
        ru: "когда я посадил тебя на плечи Гериону,"
      - pl: "\nCzegóż się lękać będąc bliżej Boga?"
        ru: "чего же бояться, будучи ближе к Богу?"
    words: { "zwrócili": zwrocic, "rzekł": rzec, "określona": okreslic, "przypomnij": przypomniec, "wsadził": wsadzic, "bliżej": blisko }
  - clean: "Gdybyś lat tysiąc stał wśród tych płomieni,\nJednego włosa żar ci nie wyleni.\nSprawdź to, co mówię, próbą doświadczenia,\nPołę twej sukni przytknij do płomienia.\nŚmiało, przez ogień bezpieczna twa droga».\nLecz ja pomimo przekonania w duchu,\nStałem jak wryty w ziemię głaz, bez ruchu."
    verse: true
    chunks:
      - pl: "Gdybyś lat tysiąc stał wśród tych płomieni,"
        ru: "Если бы ты тысячу лет стоял среди этого пламени,"
      - pl: "\nJednego włosa żar ci nie wyleni."
        ru: "жар не опалил бы тебе ни одного волоса."
        note: "wylenić — опалить, свести шерсть"
      - pl: "\nSprawdź to, co mówię, próbą doświadczenia,"
        ru: "Проверь то, что я говорю, опытом,"
      - pl: "\nPołę twej sukni przytknij do płomienia."
        ru: "приложи полу своей одежды к пламени."
      - pl: "\nŚmiało, przez ogień bezpieczna twa droga»."
        ru: "Смело, через огонь твой путь безопасен»."
      - pl: "\nLecz ja pomimo przekonania w duchu,"
        ru: "Но я, вопреки убеждению в душе,"
