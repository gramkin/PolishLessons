        ru: "идти дальше не хватало сил, не охоты."
      - pl: "\nJak głodne kozy, wesołe i śmiałe,"
        ru: "Как голодные козы, весёлые и смелые,"
      - pl: "\nRwąc trawę skaczą ze skały na skałę,"
        ru: "срывая траву, скачут со скалы на скалу,"
      - pl: "\nA w żar południ leżąc przy strumieniu,"
