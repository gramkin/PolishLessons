      - pl: "\nA Stacyjusza, który nas rozdzielał"
        ru: "а Стация, что разделял нас"
      - pl: "\nW tej drodze, prosił, aby mię ośmielał"
        ru: "на этой дороге, попросил ободрять меня,"
        note: "ośmielać — ободрять"
      - pl: "\nIdąc w krok za mną i robił zasłonę."
        ru: "идя за мной шаг в шаг, и прикрывать меня."
    words: { "bramy": brama, "uśmiechnął": usmiechnac, "jabłkiem": jablko, "wszedł": wejsc, "krok": krok, "zasłonę": zaslona }
  - clean: "W tym ogniu usta tak czułem spalone,\nŻe chętnie piłbym szkło warem stopione,\nTakim upałem płomień mię dogrzewał.\nA mistrz mnie ciesząc wesół i ochoczy,\nO Beatrycze wciąż rozmowę toczy,\nI mówił: «Zda się, już widzę jej oczy!»"
