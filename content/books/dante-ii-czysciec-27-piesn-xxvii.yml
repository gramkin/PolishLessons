    words: { "tysiąc": tysiac, "włosa": wlos, "próbą": proba, "sukni": suknia, "duchu": duch, "ruchu": ruch }
  - clean: "Upór mój z mojej czytając źrenicy,\nWirgili do mnie rzekł trochę zmieszany:\n«Jeden mur tylko, wierzaj, mój kochany,\nPrzedziela ciebie tu od Beatrycy».\nJak na głos: «Tisbe!» Pyram konający\nOtworzył oczy i obraz jej mżący\nWidział pod morwą, która odtąd nowe\nJęła owoce rodzić rubinowe;\nGłos mego wodza, czułem, jak mi kruszy\nKamienny upór wspomnieniem imienia,\nCo zawsze iskrą wybłyska z mej duszy."
    verse: true
    chunks:
      - pl: "Upór mój z mojej czytając źrenicy,"
        ru: "Прочитав моё упрямство по моему зрачку,"
      - pl: "\nWirgili do mnie rzekł trochę zmieszany:"
        ru: "Вергилий сказал мне, немного смущённый:"
      - pl: "\n«Jeden mur tylko, wierzaj, mój kochany,"
        ru: "«Лишь одна стена, поверь, мой дорогой,"
      - pl: "\nPrzedziela ciebie tu od Beatrycy»."
        ru: "отделяет тебя здесь от Беатриче»."
      - pl: "\nJak na głos: «Tisbe!» Pyram konający"
        ru: "Как на голос: «Фисба!» умирающий Пирам"
      - pl: "\nOtworzył oczy i obraz jej mżący"
        ru: "открыл глаза и её туманный образ"
      - pl: "\nWidział pod morwą, która odtąd nowe"
        ru: "видел под шелковицей, что с тех пор новые"
        note: "morwa — шелковица"
      - pl: "\nJęła owoce rodzić rubinowe;"
        ru: "начала рожать рубиновые плоды;"
      - pl: "\nGłos mego wodza, czułem, jak mi kruszy"
        ru: "голос моего вождя, я чувствовал, как дробит мне"
      - pl: "\nKamienny upór wspomnieniem imienia,"
        ru: "каменное упрямство воспоминанием имени,"
      - pl: "\nCo zawsze iskrą wybłyska z mej duszy."
        ru: "что всегда искрой вспыхивает в моей душе."
    words: { "zmieszany": zmieszac, "odtąd": odtad, "owoce": owoc, "wodza": wodz, "kruszy": kruszyc, "duszy": dusza }
  - clean: "Wódz potrząsł głową, mówiąc: «Czyliż mamy\nStać tu, tak blisko będąc raju bramy?»\nWtem się uśmiechnął jak matka troskliwa,\nCo dziecka upór jabłkiem pokonywa.\nI wszedł przede mną w pośrodek płomienia,\nA Stacyjusza, który nas rozdzielał\nW tej drodze, prosił, aby mię ośmielał\nIdąc w krok za mną i robił zasłonę."
    verse: true
    chunks:
      - pl: "Wódz potrząsł głową, mówiąc: «Czyliż mamy"
