        note: "zaczerniony — почерневший"
    words: { "śpiewał": spiewac, "schody": schody, "Wzrok": wzrok, "zmroku": zmrok, "zatrzymujcie": zatrzymywac, "zachód": zachod }
  - clean: "Ścieżka przez skałę szła od wschodu strony,\nWięc przerywałem przed sobą w tę stronę\nPromienie słońca niskie i zniżone.\nJeszcześmy szczebli przebiegli niewiele,\nZgadłem po moim cieniu, jak się ściele,\nŻe już za nami zagasał blask słońca."
    verse: true
    chunks:
      - pl: "Ścieżka przez skałę szła od wschodu strony,"
        ru: "Тропа шла через скалу с восточной стороны,"
