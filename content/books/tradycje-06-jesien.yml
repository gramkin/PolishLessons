        ru: "Во второй мы оставим календарь и заглянем в жизнь обычных людей: в их крестины, свадьбы и похороны, в то, как они празднуют именины, как принимают гостей и что готовят, а в конце — в то, насколько сильно отличаются друг от друга польские регионы."
