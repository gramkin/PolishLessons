paragraphs:
  - clean: "Kiedy zboże zostanie zebrane z pól, przychodzi czas na dożynki, czyli święto plonów. Ich nazwa pochodzi od słowa dożąć, czyli skończyć żniwa. Dawniej obchodzono je na dworze, gdzie żniwiarze przychodzili do dziedzica, właściciela ziemi, na którego polach pracowali przez całe lato. Na końcu żniw na polu zostawiano niewielką kępkę nieściętego zboża, nazywaną przepiórką albo brodą, którą przystrajano wstążkami i wokół której tańczono. Wierzono, że w ostatnich kłosach ukrywa się siła urodzaju i nie wolno jej zniszczyć, bo przyszłoroczne plony będą słabe."
    draft: true
    chunks:
      - pl: "Kiedy zboże zostanie zebrane z pól, przychodzi czas na dożynki, czyli święto plonów."
        ru: "Когда хлеб убран с полей, наступает время дожинок, то есть праздника урожая."
        note: "dożynki — дожинки, праздник урожая"
      - pl: " Ich nazwa pochodzi od słowa dożąć, czyli skończyć żniwa."
        ru: "Их название происходит от слова «дожать», то есть закончить жатву."
      - pl: " Dawniej obchodzono je na dworze, gdzie żniwiarze przychodzili do dziedzica, właściciela ziemi, na którego polach pracowali przez całe lato."
        ru: "Раньше их отмечали в усадьбе, куда жнецы приходили к помещику, владельцу земли, на полях которого трудились всё лето."
        note: "żniwiarz — жнец; dziedzic — помещик"
      - pl: " Na końcu żniw na polu zostawiano niewielką kępkę nieściętego zboża, nazywaną przepiórką albo brodą, którą przystrajano wstążkami i wokół której tańczono."
        ru: "В конце жатвы на поле оставляли небольшой пучок несжатого хлеба, называемый перепёлкой или бородой, который украшали лентами и вокруг которого танцевали."
        note: "przepiórka — перепёлка; kępka — пучок"
      - pl: " Wierzono, że w ostatnich kłosach ukrywa się siła urodzaju i nie wolno jej zniszczyć, bo przyszłoroczne plony będą słabe."
        ru: "Верили, что в последних колосьях скрывается сила урожая и её нельзя уничтожить, иначе урожай следующего года будет плохим."
