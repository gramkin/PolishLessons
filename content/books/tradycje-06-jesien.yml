  - clean: "Grzybobranie ma w polskiej kulturze długą tradycję. Adam Mickiewicz opisał je w „Panu Tadeuszu”, gdzie cała szlachecka okolica wybiera się do lasu, a każdy gatunek grzyba ma swój charakter, jak postać w komedii. Grzyby suszy się na nitkach nad kuchnią, marynuje w occie albo mrozi, a ich zapach wraca potem na wigilijnym stole w zupie i w uszkach. Grzybobranie bywa jednak niebezpieczne. Co roku zdarzają się zatrucia, a najgroźniejszy jest muchomor sromotnikowy, który można pomylić z kanią albo gąską i który nawet w małej ilości może zabić. Dlatego w czasie sezonu w wielu miastach działają punkty, w których specjaliści za darmo sprawdzają zebrane grzyby."
    draft: true
    chunks:
      - pl: "Grzybobranie ma w polskiej kulturze długą tradycję."
        ru: "Сбор грибов имеет в польской культуре давнюю традицию."
      - pl: " Adam Mickiewicz opisał je w „Panu Tadeuszu”, gdzie cała szlachecka okolica wybiera się do lasu, a każdy gatunek grzyba ma swój charakter, jak postać w komedii."
        ru: "Адам Мицкевич описал его в «Пане Тадеуше», где вся шляхетская округа отправляется в лес, а у каждого вида грибов свой характер, как у персонажа комедии."
      - pl: " Grzyby suszy się na nitkach nad kuchnią, marynuje w occie albo mrozi, a ich zapach wraca potem na wigilijnym stole w zupie i w uszkach."
        ru: "Грибы сушат на нитках над плитой, маринуют в уксусе или замораживают, а их запах потом возвращается на сочельниковый стол в супе и в ушках."
        note: "marynować — мариновать"
      - pl: " Grzybobranie bywa jednak niebezpieczne."
        ru: "Однако сбор грибов бывает опасным."
      - pl: " Co roku zdarzają się zatrucia, a najgroźniejszy jest muchomor sromotnikowy, który można pomylić z kanią albo gąską i który nawet w małej ilości może zabić."
        ru: "Каждый год случаются отравления, а опаснее всего бледная поганка, которую можно спутать с грибом-зонтиком или рядовкой и которая даже в небольшом количестве может убить."
        note: "muchomor sromotnikowy — бледная поганка; zatrucie — отравление"
      - pl: " Dlatego w czasie sezonu w wielu miastach działają punkty, w których specjaliści za darmo sprawdzają zebrane grzyby."
        ru: "Поэтому во время сезона во многих городах работают пункты, где специалисты бесплатно проверяют собранные грибы."
    words: { "polskiej": polski, "kulturze": kultura, "tradycję": tradycja, "opisał": opisac, "okolica": okolica, "wybiera": wybierac, "gatunek": gatunek, "grzyba": grzyb, "charakter": charakter, "postać": postac, "kuchnią": kuchnia, "zapach": zapach, "stole": stol, "zupie": zupa, "bywa": bywac, "niebezpieczne": niebezpieczny, "zdarzają": zdarzac, "najgroźniejszy": grozny, "pomylić": pomylic, "ilości": ilosc, "sezonu": sezon, "punkty": punkt, "specjaliści": specjalista, "darmo": darmo, "sprawdzają": sprawdzac }
  - clean: "Pierwszego listopada przypada Wszystkich Świętych, jedno z najważniejszych świąt w polskim kalendarzu. W kalendarzu kościelnym jest to dzień wszystkich zbawionych, ale w praktyce Polacy poświęcają go pamięci swoich zmarłych. W ciągu kilku dni miliony ludzi wyruszają w drogę, żeby odwiedzić groby bliskich, często na drugim końcu kraju, w rodzinnych miejscowościach rodziców i dziadków. Na drogach tworzą się korki, a policja prowadzi specjalną akcję, nazywaną Znicz."
