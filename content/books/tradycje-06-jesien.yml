  - clean: "Najważniejszym symbolem dożynek jest wieniec. Plotą go kobiety z ostatnich kłosów żyta, pszenicy, owsa i jęczmienia, dodając do nich jabłka, orzechy, kwiaty i wstążki. Wieniec może mieć kształt korony, kopuły albo nawet kościoła, a w niektórych wsiach mierzy ponad dwa metry. Kiedyś najlepsza żniwiarka niosła go na głowie do dworu, śpiewając pieśni dożynkowe, a gospodarz dziękował wszystkim za pracę, częstował ich jedzeniem i piwem, a potem do rana trwała zabawa. Ziarno z wieńca przechowywano do wiosny, a potem dodawano je do pierwszego siewu, żeby siła starego urodzaju przeszła na nowy."
    draft: true
    chunks:
      - pl: "Najważniejszym symbolem dożynek jest wieniec."
        ru: "Главный символ дожинок — венок."
      - pl: " Plotą go kobiety z ostatnich kłosów żyta, pszenicy, owsa i jęczmienia, dodając do nich jabłka, orzechy, kwiaty i wstążki."
        ru: "Его плетут женщины из последних колосьев ржи, пшеницы, овса и ячменя, добавляя к ним яблоки, орехи, цветы и ленты."
        note: "jęczmień — ячмень"
      - pl: " Wieniec może mieć kształt korony, kopuły albo nawet kościoła, a w niektórych wsiach mierzy ponad dwa metry."
        ru: "Венок может иметь форму короны, купола или даже костёла, а в некоторых деревнях достигает больше двух метров."
      - pl: " Kiedyś najlepsza żniwiarka niosła go na głowie do dworu, śpiewając pieśni dożynkowe, a gospodarz dziękował wszystkim za pracę, częstował ich jedzeniem i piwem, a potem do rana trwała zabawa."
        ru: "Когда-то лучшая жница несла его на голове в усадьбу, распевая дожиночные песни, а хозяин благодарил всех за труд, угощал едой и пивом, и потом до утра продолжалось веселье."
      - pl: " Ziarno z wieńca przechowywano do wiosny, a potem dodawano je do pierwszego siewu, żeby siła starego urodzaju przeszła na nowy."
        ru: "Зерно из венка хранили до весны, а потом добавляли к первому севу, чтобы сила старого урожая перешла на новый."
        note: "siew — сев"
    words: { "symbolem": symbol, "dodając": dodawac, "jabłka": jablko, "orzechy": orzech, "kwiaty": kwiat, "kształt": ksztalt, "korony": korona, "kościoła": kosciol, "niektórych": niektory, "wsiach": wies, "mierzy": mierzyc, "ponad": ponad, "metry": metr, "niosła": niesc, "dworu": dwor, "śpiewając": spiewac, "pieśni": piesn, "gospodarz": gospodarz, "piwem": piwo, "zabawa": zabawa, "wiosny": wiosna, "dodawano": dodawac }
  - clean: "Dziś dożynki organizują gminy, parafie i powiaty, a ich gospodarzami są wójtowie i starostowie, a nie dziedzice. Rozpoczyna je msza dziękczynna, na którą rolnicy przynoszą wieńce i bochny chleba upieczonego z nowej mąki. Potem są konkursy na najpiękniejszy wieniec, występy zespołów ludowych, stoiska z miejscowymi wyrobami i zabawa taneczna, często w remizie strażackiej. Od lat odbywają się też dożynki ogólnopolskie, na które przyjeżdżają delegacje ze wszystkich regionów, a wieniec wręcza się prezydentowi kraju. Choć na wsi pracuje dziś mniej ludzi niż kiedykolwiek, dożynki pozostały ważnym świętem, które przypomina mieszkańcom miast, skąd się bierze chleb."
    draft: true
    chunks:
      - pl: "Dziś dożynki organizują gminy, parafie i powiaty, a ich gospodarzami są wójtowie i starostowie, a nie dziedzice."
        ru: "Сегодня дожинки устраивают гмины, приходы и повяты, а их хозяевами являются войты и старосты, а не помещики."
        note: "gmina — гмина (община); wójt — войт"
      - pl: " Rozpoczyna je msza dziękczynna, na którą rolnicy przynoszą wieńce i bochny chleba upieczonego z nowej mąki."
        ru: "Начинаются они благодарственной мессой, на которую земледельцы приносят венки и караваи хлеба, испечённого из новой муки."
        note: "dziękczynny — благодарственный"
      - pl: " Potem są konkursy na najpiękniejszy wieniec, występy zespołów ludowych, stoiska z miejscowymi wyrobami i zabawa taneczna, często w remizie strażackiej."
        ru: "Потом проходят конкурсы на самый красивый венок, выступления народных ансамблей, прилавки с местными изделиями и танцы, часто в пожарном депо."
      - pl: " Od lat odbywają się też dożynki ogólnopolskie, na które przyjeżdżają delegacje ze wszystkich regionów, a wieniec wręcza się prezydentowi kraju."
        ru: "Уже много лет проходят и общепольские дожинки, на которые приезжают делегации из всех регионов, а венок вручают президенту страны."
        note: "wręczać — вручать"
      - pl: " Choć na wsi pracuje dziś mniej ludzi niż kiedykolwiek, dożynki pozostały ważnym świętem, które przypomina mieszkańcom miast, skąd się bierze chleb."
        ru: "Хотя в деревне сегодня работает меньше людей, чем когда-либо, дожинки остались важным праздником, который напоминает горожанам, откуда берётся хлеб."
    words: { "organizują": organizowac, "gospodarzami": gospodarz, "dziedzice": dziedzic, "przynoszą": przynosic, "chleba": chleb, "upieczonego": upiec, "mąki": maka, "konkursy": konkurs, "występy": wystep, "zespołów": zespol, "miejscowymi": miejscowy, "wyrobami": wyrob, "często": czesto, "przyjeżdżają": przyjezdzac, "prezydentowi": prezydent, "kraju": kraj, "mniej": malo, "kiedykolwiek": kiedykolwiek, "świętem": swieto, "przypomina": przypominac, "mieszkańcom": mieszkaniec, "chleb": chleb }
  - clean: "Pierwszego września rozpoczyna się rok szkolny. Uczniowie w odświętnych strojach, białych bluzkach i koszulach, idą na uroczysty apel, a pierwszoklasiści, trzymając rodziców za ręce, po raz pierwszy przekraczają próg szkoły. Ten dzień ma w Polsce także inny wymiar, bo pierwszego września 1939 roku Niemcy napadły na Polskę i zaczęła się druga wojna światowa. Co roku o świcie na Westerplatte w Gdańsku odbywają się uroczystości, a w wielu szkołach apel zaczyna się od minuty ciszy."
    draft: true
    chunks:
      - pl: "Pierwszego września rozpoczyna się rok szkolny."
        ru: "Первого сентября начинается учебный год."
      - pl: " Uczniowie w odświętnych strojach, białych bluzkach i koszulach, idą na uroczysty apel, a pierwszoklasiści, trzymając rodziców za ręce, po raz pierwszy przekraczają próg szkoły."
        ru: "Ученики в праздничной одежде, белых блузках и рубашках, идут на торжественную линейку, а первоклассники, держа родителей за руки, впервые переступают порог школы."
        note: "apel — линейка, сбор"
      - pl: " Ten dzień ma w Polsce także inny wymiar, bo pierwszego września 1939 roku Niemcy napadły na Polskę i zaczęła się druga wojna światowa."
        ru: "Этот день в Польше имеет и другое измерение, потому что первого сентября 1939 года Германия напала на Польшу и началась Вторая мировая война."
        note: "wymiar — измерение"
      - pl: " Co roku o świcie na Westerplatte w Gdańsku odbywają się uroczystości, a w wielu szkołach apel zaczyna się od minuty ciszy."
        ru: "Каждый год на рассвете на Вестерплатте в Гданьске проходят торжества, а во многих школах линейка начинается с минуты молчания."
    words: { "września": wrzesien, "rozpoczyna": rozpoczynac, "szkolny": szkolny, "strojach": stroj, "białych": bialy, "bluzkach": bluzka, "koszulach": koszula, "rodziców": rodzice, "przekraczają": przekraczac, "próg": prog, "także": takze, "wymiar": wymiar, "napadły": napasc, "wojna": wojna, "światowa": swiatowy, "świcie": swit, "uroczystości": uroczystosc, "ciszy": cisza }
  - clean: "Jesień to w Polsce przede wszystkim czas grzybobrania. Kiedy po deszczowych dniach w lasach pojawiają się grzyby, w sobotę rano parkingi przy lasach są pełne samochodów, a w lesie roi się od ludzi z koszykami i nożykami. Polacy są wielkimi znawcami grzybów i odróżniają dziesiątki gatunków: borowiki, podgrzybki, kurki, maślaki, kanie, rydze i koźlarze. Najwyżej cenią borowika, nazywanego też prawdziwkiem, który jest królem polskiego lasu. Grzybiarze strzegą tajemnicy swoich ulubionych miejsc tak samo pilnie jak wędkarze, a dobre miejsce przekazuje się w rodzinie z pokolenia na pokolenie."
    draft: true
    chunks:
      - pl: "Jesień to w Polsce przede wszystkim czas grzybobrania."
        ru: "Осень в Польше — это прежде всего время сбора грибов."
        note: "grzybobranie — сбор грибов"
      - pl: " Kiedy po deszczowych dniach w lasach pojawiają się grzyby, w sobotę rano parkingi przy lasach są pełne samochodów, a w lesie roi się od ludzi z koszykami i nożykami."
        ru: "Когда после дождливых дней в лесах появляются грибы, в субботу утром стоянки у лесов полны машин, а в лесу полно людей с корзинками и ножиками."
      - pl: " Polacy są wielkimi znawcami grzybów i odróżniają dziesiątki gatunków: borowiki, podgrzybki, kurki, maślaki, kanie, rydze i koźlarze."
        ru: "Поляки — большие знатоки грибов и различают десятки видов: белые, польские грибы, лисички, маслята, грибы-зонтики, рыжики и подберёзовики."
        note: "znawca — знаток"
      - pl: " Najwyżej cenią borowika, nazywanego też prawdziwkiem, który jest królem polskiego lasu."
        ru: "Выше всего ценят боровик, называемый также «настоящим», который считается королём польского леса."
      - pl: " Grzybiarze strzegą tajemnicy swoich ulubionych miejsc tak samo pilnie jak wędkarze, a dobre miejsce przekazuje się w rodzinie z pokolenia na pokolenie."
        ru: "Грибники хранят тайну своих любимых мест так же ревностно, как рыбаки, а хорошее место передаётся в семье из поколения в поколение."
        note: "grzybiarz — грибник; wędkarz — рыбак-удильщик"
