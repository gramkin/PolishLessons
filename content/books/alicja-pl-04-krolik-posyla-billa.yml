  - clean: "Wkrótce Królik zauważył Alicję, która szukała dookoła, i zawołał do niej gniewnym tonem: „Hej, Mary Ann, co ty tu robisz? Biegnij natychmiast do domu i przynieś mi parę rękawiczek i wachlarz! Już, prędko!” A Alicja tak się przestraszyła, że od razu pobiegła w kierunku, który wskazał, nawet nie próbując wyjaśnić jego pomyłki."
    en: "Very soon the Rabbit noticed Alice, as she went hunting about, and called out to her in an angry tone, “Why, Mary Ann, what _are_ you doing out here? Run home this moment, and fetch me a pair of gloves and a fan! Quick, now!” And Alice was so much frightened that she ran off at once in the direction it pointed to, without trying to explain the mistake it had made."
