  - clean: "Tymczasem trafiła do schludnego pokoiku ze stolikiem przy oknie, a na nim (jak miała nadzieję) leżał wachlarz i dwie czy trzy pary maleńkich białych rękawiczek. Wzięła wachlarz i jedną parę rękawiczek i już miała wyjść z pokoju, gdy jej wzrok padł na małą butelkę stojącą przy lustrze. Tym razem nie było na niej etykietki z napisem „WYPIJ MNIE”, mimo to jednak odkorkowała ją i przytknęła do ust. „Wiem, że coś ciekawego na pewno się stanie”, powiedziała sobie, „ilekroć coś zjem albo wypiję; zobaczę więc, co zrobi ta butelka. Bardzo bym chciała, żeby znów mnie powiększyła, bo doprawdy mam już dość bycia takim maleństwem!”"
    en: "By this time she had found her way into a tidy little room with a table in the window, and on it (as she had hoped) a fan and two or three pairs of tiny white kid gloves: she took up the fan and a pair of the gloves, and was just going to leave the room, when her eye fell upon a little bottle that stood near the looking-glass. There was no label this time with the words “DRINK ME,” but nevertheless she uncorked it and put it to her lips. “I know _something_ interesting is sure to happen,” she said to herself, “whenever I eat or drink anything; so I’ll just see what this bottle does. I do hope it’ll make me grow large again, for really I’m quite tired of being such a tiny little thing!”"
