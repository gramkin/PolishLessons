  - clean: "„Wziął mnie za swoją pokojówkę”, powiedziała sobie, biegnąc. „Ale się zdziwi, kiedy odkryje, kim jestem! Ale lepiej zaniosę mu wachlarz i rękawiczki — to znaczy, jeśli je znajdę.” Mówiąc to, natknęła się na schludny domek, na którego drzwiach była błyszcząca mosiężna tabliczka z wyrytym napisem „W. KRÓLIK”. Weszła bez pukania i pospieszyła na górę, bardzo się bojąc, że spotka prawdziwą Mary Ann i zostanie wyrzucona z domu, zanim znajdzie wachlarz i rękawiczki."
    en: "“He took me for his housemaid,” she said to herself as she ran. “How surprised he’ll be when he finds out who I am! But I’d better take him his fan and gloves—that is, if I can find them.” As she said this, she came upon a neat little house, on the door of which was a bright brass plate with the name “W. RABBIT,” engraved upon it. She went in without knocking, and hurried upstairs, in great fear lest she should meet the real Mary Ann, and be turned out of the house before she had found the fan and gloves."
