  - clean: "„Jakie to dziwne”, powiedziała sobie Alicja, „biegać na posyłki dla królika! Pewnie niedługo Dina zacznie mnie wysyłać z poleceniami!” I zaczęła sobie wyobrażać, jak by to wyglądało: „«Panno Alicjo! Chodź tu zaraz i szykuj się na spacer!» «Już idę, nianiu! Ale muszę pilnować, żeby mysz nie uciekła.» Tylko nie sądzę”, ciągnęła Alicja, „żeby pozwolili Dinie zostać w domu, gdyby zaczęła tak ludziom rozkazywać!”"
    en: "“How queer it seems,” Alice said to herself, “to be going messages for a rabbit! I suppose Dinah’ll be sending me on messages next!” And she began fancying the sort of thing that would happen: “‘Miss Alice! Come here directly, and get ready for your walk!’ ‘Coming in a minute, nurse! But I’ve got to see that the mouse doesn’t get out.’ Only I don’t think,” Alice went on, “that they’d let Dinah stop in the house if it began ordering people about like that!”"
