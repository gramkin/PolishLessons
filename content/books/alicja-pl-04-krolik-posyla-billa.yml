paragraphs:
  - clean: "To był Biały Królik, który wracał powoli truchtem, rozglądając się niespokojnie, jakby czegoś zgubił; usłyszała, jak mruczy do siebie: „Księżna! Księżna! Och, moje biedne łapki! Och, moje futro i wąsy! Każe mnie stracić, jak amen w pacierzu! Gdzież ja mogłem je upuścić?” Alicja od razu domyśliła się, że szuka wachlarza i pary białych rękawiczek, i bardzo uczynnie zaczęła ich szukać, ale nigdzie ich nie było — wszystko zdawało się zmienione od czasu jej pływania w jeziorze, a wielka sala ze szklanym stolikiem i drzwiczkami znikła zupełnie."
    en: "It was the White Rabbit, trotting slowly back again, and looking anxiously about as it went, as if it had lost something; and she heard it muttering to itself “The Duchess! The Duchess! Oh my dear paws! Oh my fur and whiskers! She’ll get me executed, as sure as ferrets are ferrets! Where _can_ I have dropped them, I wonder?” Alice guessed in a moment that it was looking for the fan and the pair of white kid gloves, and she very good-naturedly began hunting about for them, but they were nowhere to be seen—everything seemed to have changed since her swim in the pool, and the great hall, with the glass table and the little door, had vanished completely."
