  - clean: "I rzeczywiście tak się stało, i to o wiele szybciej, niż się spodziewała: zanim wypiła pół butelki, poczuła, że głowa napiera na sufit, i musiała się pochylić, żeby nie złamać karku. Pospiesznie odstawiła butelkę, mówiąc sobie: „To zupełnie wystarczy… mam nadzieję, że już nie urosnę… I tak nie mogę wyjść przez drzwi… Żałuję, że wypiłam aż tyle!”"
    en: "It did so indeed, and much sooner than she had expected: before she had drunk half the bottle, she found her head pressing against the ceiling, and had to stoop to save her neck from being broken. She hastily put down the bottle, saying to herself “That’s quite enough—I hope I shan’t grow any more—As it is, I can’t get out at the door—I do wish I hadn’t drunk quite so much!”"
