# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 4
chapterTitle: "Pieśń IV"
chapterTitleRu: "Песнь IV. Белаква"
level: B2
paragraphs:
  - clean: "(Tacy, co dopiero na łożu śmiertelnym pokutę czynili. Belakwa.)"
    chunks:
      - pl: "(Tacy, co dopiero na łożu śmiertelnym pokutę czynili. Belakwa.)"
        ru: "(Те, кто покаялся лишь на смертном одре. Белаква.)"
        note: "łoże śmiertelne — смертный одр; Belakwa — Белаква"
    words: { "śmiertelnym": smiertelny, "czynili": czynic }
  - clean: "Kiedy rozkoszy skutkiem czy boleści\nJedna z władz naszych żywo się porusza,\nW tej władzy cała zatapia się dusza,\nNa inne zda się nie zwraca uwagi:\nStan ten wewnętrzny wykrywa błąd nagi,\nCo w nas dusz tyle, ile władz jest, mieści."
    verse: true
    chunks:
      - pl: "Kiedy rozkoszy skutkiem czy boleści"
        ru: "Когда вследствие наслаждения или боли"
        note: "skutkiem — вследствие"
      - pl: "\nJedna z władz naszych żywo się porusza,"
        ru: "одна из наших способностей живо приходит в движение,"
        note: "władza — здесь «способность души»"
      - pl: "\nW tej władzy cała zatapia się dusza,"
        ru: "вся душа погружается в эту способность,"
      - pl: "\nNa inne zda się nie zwraca uwagi:"
        ru: "на другие, кажется, не обращает внимания:"
      - pl: "\nStan ten wewnętrzny wykrywa błąd nagi,"
        ru: "это внутреннее состояние обнаруживает голую ошибку,"
        note: "wykrywać — обнаруживать"
      - pl: "\nCo w nas dusz tyle, ile władz jest, mieści."
        ru: "будто в нас столько душ, сколько способностей."
    words: { "skutkiem": skutek, "porusza": poruszac, "zwraca": zwracac, "wewnętrzny": wewnetrzny, "nagi": nagi, "mieści": miescic }
  - clean: "Gdy wzrok lub ucho łechcące przedmioty\nPochłoną całą treść naszej istoty,\nDla tej przyczyny czas, co nam ucieka,\nNiepostrzeżony mija dla człowieka.\nBo z nich jest jedna władzą, która słucha,\nA druga trzyma całego nam ducha;\nPierwsza jest jakby związana, ta wolna."
    verse: true
    chunks:
      - pl: "Gdy wzrok lub ucho łechcące przedmioty"
        ru: "Когда предметы, щекочущие взор или слух,"
      - pl: "\nPochłoną całą treść naszej istoty,"
        ru: "поглотят всю суть нашего существа,"
      - pl: "\nDla tej przyczyny czas, co nam ucieka,"
        ru: "по этой причине время, что от нас убегает,"
      - pl: "\nNiepostrzeżony mija dla człowieka."
        ru: "проходит для человека незамеченным."
        note: "niepostrzeżony — незамеченный"
      - pl: "\nBo z nich jest jedna władzą, która słucha,"
        ru: "Ибо одна из них — способность, что слушает,"
      - pl: "\nA druga trzyma całego nam ducha;"
        ru: "а другая держит всего нашего духа;"
      - pl: "\nPierwsza jest jakby związana, ta wolna."
        ru: "первая как бы связана, та свободна."
    words: { "wzrok": wzrok, "łechcące": lechtac, "przedmioty": przedmiot, "istoty": istota, "przyczyny": przyczyna, "mija": mijac }
  - clean: "Co rad sprawdziłem własnym doświadczeniem,\nSłuchając rozmów duchów z zachwyceniem.\nJuż słońce stopni pięćdziesiąt ubiegło,\nA moje oko tego nie postrzegło,\nAż gdy doszliśmy punktu, idąc z wolna,\nGdzie duchy gronem całej swojej trzody\nDo nas wołały: «Oto wasze schody!»"
    verse: true
    chunks:
      - pl: "Co rad sprawdziłem własnym doświadczeniem,"
        ru: "Что я охотно проверил собственным опытом,"
      - pl: "\nSłuchając rozmów duchów z zachwyceniem."
        ru: "с восторгом слушая разговоры духов."
      - pl: "\nJuż słońce stopni pięćdziesiąt ubiegło,"
        ru: "Уже солнце пробежало пятьдесят градусов,"
        note: "stopień — градус"
      - pl: "\nA moje oko tego nie postrzegło,"
        ru: "а мой глаз этого не заметил,"
      - pl: "\nAż gdy doszliśmy punktu, idąc z wolna,"
        ru: "пока мы, идя медленно, не дошли до места,"
      - pl: "\nGdzie duchy gronem całej swojej trzody"
        ru: "где духи всей толпой своего стада"
      - pl: "\nDo nas wołały: «Oto wasze schody!»"
        ru: "кричали нам: «Вот ваша лестница!»"
    words: { "zachwyceniem": zachwycic, "stopni": stopien, "gronem": grono, "trzody": trzoda, "wołały": wolac, "schody": schody }
  - clean: "Wieśniak, gdy winne grona ściemni lato,\nCzęsto nie szersze, ciernią rosochatą\nPrzejście zamyka, jak między skałami\nŚcieżka, po której z mistrzem szliśmy sami,\nGdy duchy w tyle zostały za nami.\nSkałę pod Noli, górę Bismantowa,\nPrzejść dla podróżnych pieszo rzecz nienowa\nAle tam lecieć trzeba było górą,\nMieć wielkiej żądzy i skrzydło, i pióro,\nBy zdążyć za tym, co kojąc mą trwogę,\nBudził nadzieję, torował mi drogę."
    verse: true
    chunks:
      - pl: "Wieśniak, gdy winne grona ściemni lato,"
        ru: "Крестьянин, когда лето затемнит виноградные гроздья,"
        note: "grono — гроздь"
      - pl: "\nCzęsto nie szersze, ciernią rosochatą"
        ru: "часто не более широкий, ветвистым терновником"
        note: "rosochaty — ветвистый"
      - pl: "\nPrzejście zamyka, jak między skałami"
        ru: "закрывает проход, чем между скалами"
      - pl: "\nŚcieżka, po której z mistrzem szliśmy sami,"
        ru: "тропа, по которой мы с учителем шли одни,"
      - pl: "\nGdy duchy w tyle zostały za nami."
        ru: "когда духи остались позади нас."
      - pl: "\nSkałę pod Noli, górę Bismantowa,"
        ru: "Скалу под Нолой, гору Бисмантову"
      - pl: "\nPrzejść dla podróżnych pieszo rzecz nienowa"
        ru: "пройти пешком путникам — дело не новое,"
      - pl: "\nAle tam lecieć trzeba było górą,"
        ru: "но там надо было лететь вверх,"
      - pl: "\nMieć wielkiej żądzy i skrzydło, i pióro,"
        ru: "иметь крылья и перья великого желания,"
      - pl: "\nBy zdążyć za tym, co kojąc mą trwogę,"
        ru: "чтобы поспеть за тем, кто, успокаивая мой страх,"
      - pl: "\nBudził nadzieję, torował mi drogę."
        ru: "будил надежду, прокладывал мне дорогу."
    words: { "szersze": szeroki, "skałami": skala, "Ścieżka": sciezka, "skrzydło": skrzydlo, "pióro": pioro, "Budził": budzic }
  - clean: "Wiódł nas jar wąski w skali rozszczepany,\nNas z każdej strony ściskały jej ściany.\nŚcieżka dla stopy zbyt śliska i stroma\nRadziła nogom pomagać rękoma.\nGdyśmy już byli na błoniu odkrytem,\n«Mistrzu mój,» rzekłem, «gdzie jest twoja droga?»"
    verse: true
    chunks:
      - pl: "Wiódł nas jar wąski w skali rozszczepany,"
        ru: "Вёл нас узкий овраг, расщеплённый в скале,"
        note: "rozszczepany — расщеплённый"
      - pl: "\nNas z każdej strony ściskały jej ściany."
        ru: "нас с каждой стороны сжимали её стены."
      - pl: "\nŚcieżka dla stopy zbyt śliska i stroma"
        ru: "Тропа, слишком скользкая и крутая для ступни,"
      - pl: "\nRadziła nogom pomagać rękoma."
        ru: "советовала помогать ногам руками."
      - pl: "\nGdyśmy już byli na błoniu odkrytem,"
        ru: "Когда мы были уже на открытой площадке,"
      - pl: "\n«Mistrzu mój,» rzekłem, «gdzie jest twoja droga?»"
        ru: "«Учитель мой, — сказал я, — где твоя дорога?»"
    words: { "ściany": sciana, "Radziła": radzic, "nogom": noga, "pomagać": pomagac, "Mistrzu": mistrz, "rzekłem": rzec }
  - clean: "A on: «Niech kroku nie cofa twa noga;\nIdź ciągle za mną, pod tej skały szczytem\nJak iść i kędy, dostaniem języka».\nA tam szczyt skały obłoków dotyka,\nWierzchu jej oko nie doścignie, zda się:\nBok jej był prostszy niż narysowana\nOd pół do środka linia na kompasie."
    verse: true
    chunks:
      - pl: "A on: «Niech kroku nie cofa twa noga;"
        ru: "А он: «Пусть твоя нога не отступает ни на шаг;"
      - pl: "\nIdź ciągle za mną, pod tej skały szczytem"
        ru: "иди всё время за мной, под вершиной этой скалы"
      - pl: "\nJak iść i kędy, dostaniem języka»."
        ru: "мы разузнаем, как и куда идти»."
        note: "dostać języka — разузнать"
      - pl: "\nA tam szczyt skały obłoków dotyka,"
        ru: "А там вершина скалы касается облаков,"
      - pl: "\nWierzchu jej oko nie doścignie, zda się:"
        ru: "её верха, кажется, глаз не достигнет:"
      - pl: "\nBok jej był prostszy niż narysowana"
        ru: "бок её был круче, чем проведённая"
        note: "prostszy — здесь «отвеснее»"
      - pl: "\nOd pół do środka linia na kompasie."
        ru: "от полукруга к центру линия на компасе."
    words: { "kroku": krok, "cofa": cofac, "szczytem": szczyt, "języka": jezyk, "dotyka": dotykac, "narysowana": narysowac }
  - clean: "Mdlejąc od trudu krzyknąłem w zapale:\n«Zwróć się, mój ojcze! patrz, drżą mi kolana!\nJeden zostanę, gdy nie wstrzymasz kroku».\n— «Gdy iść nie możesz, czołgaj się po skale!»\nRzekł, głaz wskazując sterczący z jej boku.\nMistrz tak mię słowa połechtał ostrogą,\nŻe śladem za nim pod głaz przypełznąłem,\nGłaz, co tę górę opasywał kołem."
    verse: true
    chunks:
      - pl: "Mdlejąc od trudu krzyknąłem w zapale:"
        ru: "Изнемогая от труда, я крикнул в пылу:"
      - pl: "\n«Zwróć się, mój ojcze! patrz, drżą mi kolana!"
        ru: "«Обернись, мой отец! смотри, дрожат у меня колени!"
      - pl: "\nJeden zostanę, gdy nie wstrzymasz kroku»."
        ru: "Я останусь один, если ты не задержишь шаг»."
      - pl: "\n— «Gdy iść nie możesz, czołgaj się po skale!»"
        ru: "— «Если идти не можешь, ползи по скале!» —"
      - pl: "\nRzekł, głaz wskazując sterczący z jej boku."
        ru: "сказал он, указывая на камень, торчащий из её бока."
      - pl: "\nMistrz tak mię słowa połechtał ostrogą,"
        ru: "Учитель так пришпорил меня словами,"
      - pl: "\nŻe śladem za nim pod głaz przypełznąłem,"
        ru: "что я следом за ним подполз под камень,"
        note: "przypełznąć — подползти"
      - pl: "\nGłaz, co tę górę opasywał kołem."
        ru: "камень, что опоясывал эту гору кругом."
    words: { "trudu": trud, "Zwróć": zwrocic, "kolana": kolano, "wstrzymasz": wstrzymac, "wskazując": wskazywac, "boku": bok }
  - clean: "Tam razem oba siedliśmy znużeni,\nSkąd najpierw szliśmy na wschód obróceni,\nBo szlak przebyty mierzyć okiem błogo!\nNaprzód w dół, potem spojrzałem na słońce,\nBlask z lewej strony na nas rzucające.\nWirgili widząc, żem się mocno zdziwił,\nŻe wóz słoneczny od nas tor swój skrzywił,\nSchylony więcej pod biegun północy,\nRzekł: «Gdyby Kastor i Polluks był bliżej\nI gdyby oba szli razem w orszaku\nTego zwierciadła wiekuistej mocy,\nCo rzuca blask swój i wyżej, i niżej;"
    verse: true
    chunks:
      - pl: "Tam razem oba siedliśmy znużeni,"
        ru: "Там мы оба уселись, усталые,"
      - pl: "\nSkąd najpierw szliśmy na wschód obróceni,"
        ru: "откуда сперва шли, обратившись на восток,"
      - pl: "\nBo szlak przebyty mierzyć okiem błogo!"
        ru: "ибо отрадно мерить глазом пройденный путь!"
      - pl: "\nNaprzód w dół, potem spojrzałem na słońce,"
        ru: "Сперва вниз, потом я посмотрел на солнце,"
      - pl: "\nBlask z lewej strony na nas rzucające."
        ru: "бросающее на нас блеск с левой стороны."
      - pl: "\nWirgili widząc, żem się mocno zdziwił,"
        ru: "Вергилий, видя, что я сильно удивился,"
      - pl: "\nŻe wóz słoneczny od nas tor swój skrzywił,"
        ru: "что солнечная колесница отклонила от нас свой путь,"
      - pl: "\nSchylony więcej pod biegun północy,"
        ru: "склонённая больше к северному полюсу,"
        note: "biegun — полюс"
      - pl: "\nRzekł: «Gdyby Kastor i Polluks był bliżej"
        ru: "сказал: «Если бы Кастор и Поллукс были ближе"
        note: "Близнецы"
      - pl: "\nI gdyby oba szli razem w orszaku"
        ru: "и если бы оба шли вместе в свите"
      - pl: "\nTego zwierciadła wiekuistej mocy,"
        ru: "этого зеркала вечной мощи,"
        note: "солнца"
      - pl: "\nCo rzuca blask swój i wyżej, i niżej;"
        ru: "что бросает свой блеск и выше, и ниже,"
    words: { "szlak": szlak, "przebyty": przebyc, "mierzyć": mierzyc, "Blask": blask, "zdziwił": zdziwic, "niżej": nisko }
  - clean: "Widziałbyś cały okrąg zodyjaku\nZarumieniony blisko Niedźwiedzicy,\nGdyby nie zbaczał z swojej starej drogi.\nWyobraź sobie, chcąc pojąć te słowa,\nŻe święty Syjon i góra czyśćcowa,\nGraniczą wspólną widnokręgu miedzą,\nChoć na półkulach różnych obie siedzą."
    verse: true
    chunks:
      - pl: "Widziałbyś cały okrąg zodyjaku"
        ru: "ты видел бы весь круг зодиака"
      - pl: "\nZarumieniony blisko Niedźwiedzicy,"
        ru: "раскрасневшимся близ Медведицы,"
      - pl: "\nGdyby nie zbaczał z swojej starej drogi."
        ru: "если бы оно не уклонялось со своей старой дороги."
      - pl: "\nWyobraź sobie, chcąc pojąć te słowa,"
        ru: "Представь себе, желая понять эти слова,"
      - pl: "\nŻe święty Syjon i góra czyśćcowa,"
        ru: "что святой Сион и гора Чистилища"
      - pl: "\nGraniczą wspólną widnokręgu miedzą,"
        ru: "граничат общей межой горизонта,"
        note: "miedza — межа"
      - pl: "\nChoć na półkulach różnych obie siedzą."
        ru: "хотя обе сидят на разных полушариях."
    words: { "Wyobraź": wyobrazic, "pojąć": pojac, "święty": swiety, "wspólną": wspolny, "miedzą": miedza, "różnych": rozny }
  - clean: "Tor Faetona, jak przez nieb rozłogi\nBłądził wóz jego, mógłbyś w okolicy\nWidzieć zarazem tej i drugiej góry,\nGdyby go oczom nie zakryły chmury,\nJeśli rzecz zgłębisz rozwagą nieciasną».\n— «Mistrzu, twój wykład jasności jest wzorem,\nCzegom nie widział, widzę teraz jasno,\nŻe ten wyższego ruchu krąg środkowy,\nPrzez astronomów zwany ekwatorem,\nPomiędzy zimą wciąż krąży a słońcem."
    verse: true
    chunks:
      - pl: "Tor Faetona, jak przez nieb rozłogi"
        ru: "Путь Фаэтона, как по просторам небес"
        note: "rozłogi — просторы"
      - pl: "\nBłądził wóz jego, mógłbyś w okolicy"
        ru: "блуждала его колесница, ты мог бы в окрестности"
      - pl: "\nWidzieć zarazem tej i drugiej góry,"
        ru: "видеть разом и этой, и другой горы,"
      - pl: "\nGdyby go oczom nie zakryły chmury,"
        ru: "если бы его не закрыли от глаз тучи,"
      - pl: "\nJeśli rzecz zgłębisz rozwagą nieciasną»."
        ru: "если вникнешь в дело нетесным рассуждением»."
        note: "rozwaga — рассуждение"
      - pl: "\n— «Mistrzu, twój wykład jasności jest wzorem,"
        ru: "— «Учитель, твоё изложение — образец ясности,"
        note: "wykład — изложение"
      - pl: "\nCzegom nie widział, widzę teraz jasno,"
        ru: "чего я не видел, вижу теперь ясно:"
      - pl: "\nŻe ten wyższego ruchu krąg środkowy,"
        ru: "что этот средний круг высшего движения,"
      - pl: "\nPrzez astronomów zwany ekwatorem,"
        ru: "называемый астрономами экватором,"
      - pl: "\nPomiędzy zimą wciąż krąży a słońcem."
        ru: "всегда кружит между зимой и солнцем."
    words: { "zgłębisz": zglebic, "wykład": wyklad, "jasności": jasnosc, "krąg": krag, "środkowy": srodkowy, "krąży": krazyc }
  - clean: "I z tej przyczyny, co wiem z twojej mowy,\nKrąży na północ od góry czyśćcowej,\nGdy od Hebreów ten krąg jest widziany\nW stronie południa, co zieje gorącem.\nLecz jeśli łaska, wodzu mój kochany,\nMów, droga nasza jak idzie wysoko?"
    verse: true
    chunks:
      - pl: "I z tej przyczyny, co wiem z twojej mowy,"
        ru: "И по этой причине, что я знаю из твоей речи,"
      - pl: "\nKrąży na północ od góry czyśćcowej,"
        ru: "он проходит к северу от горы Чистилища,"
      - pl: "\nGdy od Hebreów ten krąg jest widziany"
        ru: "тогда как евреями этот круг видим"
      - pl: "\nW stronie południa, co zieje gorącem."
        ru: "в стороне юга, что пышет жаром."
      - pl: "\nLecz jeśli łaska, wodzu mój kochany,"
        ru: "Но, если будет милость, мой дорогой вождь,"
      - pl: "\nMów, droga nasza jak idzie wysoko?"
        ru: "скажи, как высоко идёт наша дорога?"
