  - clean: "Wziął się do pracy z zapałem i dawał z siebie wszystko, choć wszystko było nowe i obce. François był surowy, żądał natychmiastowego posłuszeństwa i dzięki batowi je otrzymywał; a Dave, doświadczony pies dyszlowy, szczypał Bucka w zad za każdym razem, gdy ten popełnił błąd. Spitz był przewodnikiem, równie doświadczonym, i choć nie zawsze mógł dosięgnąć Bucka, to od czasu do czasu warczał na niego z ostrą przyganą albo chytrze napierał całym ciężarem na szleje, żeby szarpnięciem skierować Bucka tam, gdzie powinien iść."
    en: "He buckled down with a will and did his best, though it was all new and strange. François was stern, demanding instant obedience, and by virtue of his whip receiving instant obedience; while Dave, who was an experienced wheeler, nipped Buck’s hind quarters whenever he was in error. Spitz was the leader, likewise experienced, and while he could not always get at Buck, he growled sharp reproof now and again, or cunningly threw his weight in the traces to jerk Buck into the way he should go."
    draft: true
    chunks:
      - pl: "Wziął się do pracy z zapałem i dawał z siebie wszystko, choć wszystko było nowe i obce."
