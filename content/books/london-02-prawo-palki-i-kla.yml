    en: "Day after day, for days unending, Buck toiled in the traces. Always, they broke camp in the dark, and the first gray of dawn found them hitting the trail with fresh miles reeled off behind them. And always they pitched camp after dark, eating their bit of fish, and crawling to sleep into the snow. Buck was ravenous. The pound and a half of sun-dried salmon, which was his ration for each day, seemed to go nowhere. He never had enough, and suffered from perpetual hunger pangs. Yet the other dogs, because they weighed less and were born to the life, received a pound only of the fish and managed to keep in good condition."
