  - clean: "Nie żeby Buck to sobie wyrozumował. Po prostu był przystosowany i nieświadomie dopasował się do nowego sposobu życia. Przez wszystkie dni swojego życia, bez względu na przewagę przeciwnika, nigdy nie uciekał od walki. Ale pałka mężczyzny w czerwonym swetrze wbiła mu do głowy kodeks bardziej podstawowy i pierwotny. Jako pies cywilizowany mógłby zginąć za sprawę moralną, powiedzmy w obronie szpicruty sędziego Millera; ale o tym, jak całkowicie się odcywilizował, świadczyła teraz jego zdolność do ucieczki od obrony zasad i ratowania własnej skóry."
