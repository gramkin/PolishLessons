  - clean: "Jego rozwój (albo uwstecznienie) przebiegał szybko. Mięśnie stały się twarde jak żelazo, a on sam stał się nieczuły na wszelki zwykły ból. Osiągnął oszczędność zarówno wewnętrzną, jak i zewnętrzną. Mógł zjeść wszystko, choćby najobrzydliwsze i najbardziej niestrawne; a gdy już zjadł, soki żołądkowe wydobywały z tego ostatnią, najdrobniejszą cząstkę pożywienia, krew zaś roznosiła ją do najdalszych zakątków ciała i budowała z niej najtwardsze i najmocniejsze tkanki. Wzrok i węch stały się niezwykle bystre, a słuch wyostrzył się tak, że przez sen słyszał najcichszy dźwięk i wiedział, czy zwiastuje on spokój, czy niebezpieczeństwo."
