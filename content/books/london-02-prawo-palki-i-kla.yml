        ru: "Не было никакого предупреждения — только молниеносный прыжок, металлический лязг зубов, такой же быстрый отскок, — и морда Кёрли была разорвана от глаза до челюсти."
    words: { "cudze": cudzy, "wielkości": wielkosc, "wilka": wilk, "skok": skok, "pysk": pysk, "szczęki": szczeka }
  - clean: "Taki był wilczy sposób walki: uderzyć i odskoczyć; ale kryło się w tym coś więcej. Trzydzieści czy czterdzieści psów husky przybiegło na miejsce i otoczyło walczących uważnym, milczącym kręgiem. Buck nie rozumiał tej milczącej uwagi ani tego, z jaką łapczywością oblizywały się. Curly rzuciła się na przeciwnika, a on znów uderzył i odskoczył w bok. Następny jej atak przyjął piersią, w szczególny sposób, który zbił ją z nóg. Już się nie podniosła. Na to właśnie czekały przyglądające się psy. Zwarły się nad nią, warcząc i skowycząc, a ona, krzycząc z bólu, zniknęła pod zjeżoną masą ciał."
    en: "It was the wolf manner of fighting, to strike and leap away; but there was more to it than this. Thirty or forty huskies ran to the spot and surrounded the combatants in an intent and silent circle. Buck did not comprehend that silent intentness, nor the eager way with which they were licking their chops. Curly rushed her antagonist, who struck again and leaped aside. He met her next rush with his chest, in a peculiar fashion that tumbled her off her feet. She never regained them. This was what the onlooking huskies had waited for. They closed in upon her, snarling and yelping, and she was buried, screaming with agony, beneath the bristling mass of bodies."
    draft: true
    chunks:
      - pl: "Taki był wilczy sposób walki: uderzyć i odskoczyć; ale kryło się w tym coś więcej."
        ru: "Таков был волчий способ драки: ударить и отскочить; но в этом было и нечто большее."
