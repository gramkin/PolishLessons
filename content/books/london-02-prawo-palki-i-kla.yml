  - clean: "Zanim otrząsnął się po wstrząsie, jakim była tragiczna śmierć Curly, przeżył kolejny wstrząs. François założył mu jakąś konstrukcję z rzemieni i sprzączek. Była to uprząż, taka, jaką stajenni zakładali w domu koniom. I tak jak widział pracujące konie, tak i jego zaprzęgnięto do pracy: ciągnął François na saniach do lasu, który okalał dolinę, i wracał z ładunkiem drewna na opał. Choć jego godność bardzo ucierpiała, gdy zrobiono z niego zwierzę pociągowe, był zbyt mądry, żeby się buntować."
    en: "Before he had recovered from the shock caused by the tragic passing of Curly, he received another shock. François fastened upon him an arrangement of straps and buckles. It was a harness, such as he had seen the grooms put on the horses at home. And as he had seen horses work, so he was set to work, hauling François on a sled to the forest that fringed the valley, and returning with a load of firewood. Though his dignity was sorely hurt by thus being made a draught animal, he was too wise to rebel."
    draft: true
    chunks:
      - pl: "Zanim otrząsnął się po wstrząsie, jakim była tragiczna śmierć Curly, przeżył kolejny wstrząs."
        ru: "Не успел он оправиться от потрясения, вызванного трагической гибелью Кёрли, как испытал новое."
