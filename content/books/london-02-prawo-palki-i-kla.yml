  - clean: "Stało się to tak nagle i tak nieoczekiwanie, że Buck osłupiał. Zobaczył, jak Spitz wywiesza szkarłatny język, jak to miał w zwyczaju, gdy się śmiał; i zobaczył, jak François, wymachując siekierą, wskakuje w kłębowisko psów. Trzech mężczyzn z pałkami pomagało mu je rozpędzić. Nie trwało to długo. W dwie minuty od chwili, gdy Curly padła, odpędzono pałkami ostatnich napastników. Ale ona leżała bezwładna i martwa na zakrwawionym, zdeptanym śniegu, niemal dosłownie rozszarpana na strzępy, a śniady Metys stał nad nią i straszliwie klął."
    en: "So sudden was it, and so unexpected, that Buck was taken aback. He saw Spitz run out his scarlet tongue in a way he had of laughing; and he saw François, swinging an axe, spring into the mess of dogs. Three men with clubs were helping him to scatter them. It did not take long. Two minutes from the time Curly went down, the last of her assailants were clubbed off. But she lay there limp and lifeless in the bloody, trampled snow, almost literally torn to pieces, the swart half-breed standing over her and cursing horribly."
    draft: true
    chunks:
      - pl: "Stało się to tak nagle i tak nieoczekiwanie, że Buck osłupiał."
        ru: "Это случилось так внезапно и неожиданно, что Бэк опешил."
