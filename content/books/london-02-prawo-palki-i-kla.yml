  - clean: "I nie tylko uczył się z doświadczenia — ożywały w nim instynkty dawno umarłe. Opadały z niego pokolenia udomowienia. Mgliście przypominał sobie młodość rasy, czasy, gdy dzikie psy przemierzały w sforach pierwotną puszczę i zabijały zdobycz, gdy ją dopadły w pogoni. Nie musiał się wysilać, żeby nauczyć się walczyć cięciem i szarpnięciem i szybkim wilczym kłapnięciem. Tak walczyli zapomniani przodkowie. To oni ożywiali w nim dawne życie, a dawne sztuczki, które odcisnęli w dziedzictwie rasy, były jego sztuczkami."
