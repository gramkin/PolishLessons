  - clean: "Po południu Perrault, który spieszył się, żeby wyruszyć na szlak ze swoimi przesyłkami, wrócił z dwoma kolejnymi psami. Nazwał je Billee i Joe; byli to bracia i obaj prawdziwe psy husky. Choć byli synami jednej matki, różnili się jak dzień i noc. Jedyną wadą Billee była nadmierna dobroduszność, a Joe był jego całkowitym przeciwieństwem: kwaśny i zamknięty w sobie, z wiecznym warczeniem i złym spojrzeniem. Buck przyjął ich po koleżeńsku, Dave nie zwrócił na nich uwagi, a Spitz zabrał się do lania najpierw jednego, a potem drugiego. Billee pojednawczo merdał ogonem, a gdy zobaczył, że to nic nie daje, rzucił się do ucieczki i skomlał (wciąż pojednawczo), kiedy ostre zęby Spitza rozorały mu bok."
