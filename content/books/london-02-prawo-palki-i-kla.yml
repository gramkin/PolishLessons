  - clean: "Nigdy nie widział, żeby psy walczyły tak, jak walczyły te wilcze stworzenia, a pierwsze doświadczenie dało mu niezapomnianą lekcję. Prawda, było to doświadczenie cudze, inaczej nie przeżyłby, by z niego skorzystać. Ofiarą była Curly. Obozowali w pobliżu sklepu z bali, gdzie ona, na swój przyjacielski sposób, zaczęła się zalecać do psa husky wielkości dorosłego wilka, choć nie o połowę tak dużego jak ona. Nie było żadnego ostrzeżenia, tylko błyskawiczny skok, metaliczne kłapnięcie zębów, równie szybki odskok — i pysk Curly był rozdarty od oka do szczęki."
    en: "He had never seen dogs fight as these wolfish creatures fought, and his first experience taught him an unforgetable lesson. It is true, it was a vicarious experience, else he would not have lived to profit by it. Curly was the victim. They were camped near the log store, where she, in her friendly way, made advances to a husky dog the size of a full-grown wolf, though not half so large as she. There was no warning, only a leap in like a flash, a metallic clip of teeth, a leap out equally swift, and Curly’s face was ripped open from eye to jaw."
    draft: true
    chunks:
      - pl: "Nigdy nie widział, żeby psy walczyły tak, jak walczyły te wilcze stworzenia, a pierwsze doświadczenie dało mu niezapomnianą lekcję."
        ru: "Он никогда не видел, чтобы собаки дрались так, как дрались эти волчьи создания, и первый же опыт преподал ему незабываемый урок."
        note: "wilczy — волчий"
      - pl: " Prawda, było to doświadczenie cudze, inaczej nie przeżyłby, by z niego skorzystać."
        ru: "Правда, это был чужой опыт, иначе он не выжил бы, чтобы извлечь из него пользу."
      - pl: " Ofiarą była Curly."
        ru: "Жертвой стала Кёрли."
      - pl: " Obozowali w pobliżu sklepu z bali, gdzie ona, na swój przyjacielski sposób, zaczęła się zalecać do psa husky wielkości dorosłego wilka, choć nie o połowę tak dużego jak ona."
        ru: "Они стояли лагерем у бревенчатой лавки, где она по-дружески стала заигрывать с лайкой величиной со взрослого волка, хотя вдвое меньше её."
        note: "bal — бревно; zalecać się — заигрывать, ухаживать; husky — ездовая лайка"
