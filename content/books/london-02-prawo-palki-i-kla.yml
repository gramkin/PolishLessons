        note: "dopilnować — проследить, позаботиться"
      - pl: " Spitz znów wywiesił język i się roześmiał, i od tej chwili Buck nienawidził go zaciekłą i nieśmiertelną nienawiścią."
        ru: "Шпиц снова высунул язык и засмеялся, и с этой минуты Бэк возненавидел его жгучей, неумирающей ненавистью."
