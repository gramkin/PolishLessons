  - clean: "Ta pierwsza kradzież dowodziła, że Buck nadaje się do przetrwania we wrogim otoczeniu Północy. Dowodziła jego zdolności przystosowania się, umiejętności dopasowania do zmieniających się warunków, której brak oznaczałby szybką i straszną śmierć. Dowodziła ponadto rozkładu, rozpadu jego natury moralnej, rzeczy próżnej i będącej obciążeniem w bezlitosnej walce o byt. Na Południu, pod prawem miłości i braterstwa, można było szanować cudzą własność i cudze uczucia; ale na Północy, pod prawem pałki i kła, kto brał takie rzeczy pod uwagę, był głupcem, i o ile się ich trzymał, nie mógł się dobrze mieć."
    en: "This first theft marked Buck as fit to survive in the hostile Northland environment. It marked his adaptability, his capacity to adjust himself to changing conditions, the lack of which would have meant swift and terrible death. It marked, further, the decay or going to pieces of his moral nature, a vain thing and a handicap in the ruthless struggle for existence. It was all well enough in the Southland, under the law of love and fellowship, to respect private property and personal feelings; but in the Northland, under the law of club and fang, whoso took such things into account was a fool, and in so far as he observed them he would fail to prosper."
