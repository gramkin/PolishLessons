paragraphs:
  - clean: "Pierwszy dzień Bucka na plaży w Dyea był jak koszmar. Każda godzina przynosiła wstrząsy i niespodzianki. Wyrwano go nagle z serca cywilizacji i rzucono w samo serce świata pierwotnego. Nie było to leniwe, słoneczne życie, w którym nie ma nic do roboty prócz próżnowania i nudy. Nie było tu ani spokoju, ani odpoczynku, ani chwili bezpieczeństwa. Wszystko było zamętem i ruchem, a w każdej chwili życie i zdrowie wisiały na włosku. Trzeba było stale mieć się na baczności, bo te psy i ci ludzie nie byli psami i ludźmi z miasta. Wszyscy byli dzikusami, którzy nie znali innego prawa niż prawo pałki i kła."
    en: "Buck’s first day on the Dyea beach was like a nightmare. Every hour was filled with shock and surprise. He had been suddenly jerked from the heart of civilization and flung into the heart of things primordial. No lazy, sun-kissed life was this, with nothing to do but loaf and be bored. Here was neither peace, nor rest, nor a moment’s safety. All was confusion and action, and every moment life and limb were in peril. There was imperative need to be constantly alert; for these dogs and men were not town dogs and men. They were savages, all of them, who knew no law but the law of club and fang."
    draft: true
    chunks:
      - pl: "Pierwszy dzień Bucka na plaży w Dyea był jak koszmar."
