      - pl: " A więc tak to wyglądało."
        ru: "Так вот как оно было."
      - pl: " Żadnej uczciwej gry."
        ru: "Никакой честной игры."
      - pl: " Kto raz upadł, ten był skończony."
        ru: "Кто раз упал, тому конец."
      - pl: " Cóż, on dopilnuje, żeby nigdy nie upaść."
