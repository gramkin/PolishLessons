  - clean: "Ta scena często wracała do Bucka i niepokoiła go we śnie. A więc tak to wyglądało. Żadnej uczciwej gry. Kto raz upadł, ten był skończony. Cóż, on dopilnuje, żeby nigdy nie upaść. Spitz znów wywiesił język i się roześmiał, i od tej chwili Buck nienawidził go zaciekłą i nieśmiertelną nienawiścią."
    en: "The scene often came back to Buck to trouble him in his sleep. So that was the way. No fair play. Once down, that was the end of you. Well, he would see to it that he never went down. Spitz ran out his tongue and laughed again, and from that moment Buck hated him with a bitter and deathless hatred."
    draft: true
    chunks:
      - pl: "Ta scena często wracała do Bucka i niepokoiła go we śnie."
