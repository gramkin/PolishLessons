  - clean: "Pierwszy spróbował książę wrocławski Henryk Probus, który opanował Kraków i starał się u papieża o koronę. Zmarł jednak nagle w 1290 roku, prawdopodobnie otruty. Henryk Probus był człowiekiem niezwykłym jak na księcia piastowskiego. Wychowany na dworze czeskim i wiedeńskim, mówił i pisał po niemiecku i układał wiersze miłosne w stylu niemieckich minnesingerów. W słynnym Kodeksie Manesse, średniowiecznym zbiorze pieśni z Zurychu, jest jego portret: książę siedzi na koniu w czasie turnieju, a damy wręczają mu wieniec zwycięzcy. Zachowały się też dwie jego pieśni. Udało się dopiero księciu wielkopolskiemu Przemysłowi II. W 1294 roku odziedziczył Pomorze Gdańskie po ostatnim księciu z miejscowej dynastii, a w 1295 roku arcybiskup koronował go w Gnieźnie na króla Polski. Koronował go arcybiskup gnieźnieński Jakub Świnka, gorący zwolennik zjednoczenia kraju. Świnka nie lubił Niemców, którzy w jego czasach napływali do polskich miast i klasztorów, i podobno nazywał ich psimi głowami. Walczył o to, by w kościołach mówiono kazania po polsku, a w szkołach katedralnych uczyli polscy nauczyciele. Była to pierwsza koronacja od ponad dwustu lat. Przemysł przyjął jako herb białego orła z koroną na głowie, który od tego czasu stał się znakiem całego królestwa. Na pieczęci króla widniał napis: „Przywrócił Wszechmogący Polakom znaki zwycięstwa”."
    draft: true
