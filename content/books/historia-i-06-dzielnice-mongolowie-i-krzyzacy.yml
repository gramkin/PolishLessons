  - clean: "Druga połowa XIII wieku była czasem odbudowy po najazdach. W Krakowie rządził wtedy Bolesław Wstydliwy, a jego żoną była węgierska królewna Kinga. Ze świętą Kingą wiąże się jedna z najpiękniejszych polskich legend. Przed ślubem poprosiła ojca, by dał jej w posagu sól, której w Polsce bardzo brakowało. Wrzuciła swój pierścień do kopalni soli na Węgrzech, a po przyjeździe do Polski kazała kopać w ziemi w pobliżu Krakowa. Górnicy natrafili na sól, a w pierwszej bryle znaleźli jej pierścień. Tak, według legendy, powstały kopalnie soli w Bochni i w Wieliczce. Naprawdę sól wydobywano tam już wcześniej, ale kopalnie rzeczywiście rozwinęły się w tym czasie i przez stulecia przynosiła władcom ogromne dochody."
