paragraphs:
  - clean: "System, który wymyślił Krzywousty, zaczął się sypać już po kilku latach. Najstarszy syn, senior Władysław, uważał, że młodsi bracia powinni mu się podporządkować. Bracia mieli inne zdanie, a za nimi stali możni, którym słaba władza centralna bardzo odpowiadała. W 1146 roku Władysław przegrał wojnę i musiał uciekać do Niemiec. Historia nazywa go Wygnańcem. Nigdy już nie wrócił, ale jego synowie po latach odzyskali Śląsk. Od nich wywodzą się Piastowie śląscy, którzy rządzili tą krainą jeszcze przez pięćset lat."
    draft: true
    chunks:
      - pl: "System, który wymyślił Krzywousty, zaczął się sypać już po kilku latach."
        ru: "Система, придуманная Кривоустым, начала рушиться уже через несколько лет."
        note: "sypać się — сыпаться, разваливаться"
      - pl: " Najstarszy syn, senior Władysław, uważał, że młodsi bracia powinni mu się podporządkować."
        ru: "Старший сын, сеньор Владислав, считал, что младшие братья должны ему подчиниться."
        note: "podporządkować się — подчиниться"
      - pl: " Bracia mieli inne zdanie, a za nimi stali możni, którym słaba władza centralna bardzo odpowiadała."
        ru: "Братья были другого мнения, а за ними стояла знать, которую слабая центральная власть очень устраивала."
        note: "odpowiadać komuś — устраивать кого-л."
      - pl: " W 1146 roku Władysław przegrał wojnę i musiał uciekać do Niemiec."
        ru: "В 1146 году Владислав проиграл войну и был вынужден бежать в Германию."
      - pl: " Historia nazywa go Wygnańcem."
        ru: "История называет его Изгнанником."
        note: "wygnaniec — изгнанник"
      - pl: " Nigdy już nie wrócił, ale jego synowie po latach odzyskali Śląsk."
        ru: "Он так и не вернулся, но его сыновья годы спустя вернули себе Силезию."
      - pl: " Od nich wywodzą się Piastowie śląscy, którzy rządzili tą krainą jeszcze przez pięćset lat."
        ru: "От них ведут начало силезские Пясты, правившие этим краем ещё пятьсот лет."
        note: "wywodzić się — происходить, вести начало"
    words: { "centralna": centralny, "rządzili": rzadzic, "krainą": kraina, "pięćset": piecset }
  - clean: "Krakowski tron senioralny przechodził z rąk do rąk. Po Bolesławie Kędzierzawym rządził Mieszko Stary, ale krakowscy możni szybko go obalili, bo rządził zbyt twardą ręką. Na jego miejsce wybrali najmłodszego syna Krzywoustego, Kazimierza, którego nazwano Sprawiedliwym. W 1180 roku na zjeździe w Łęczycy Kazimierz nadał Kościołowi szerokie przywileje, a w zamian uzyskał zgodę na to, by Kraków dziedziczyli jego synowie. Zasada senioratu, czyli władzy najstarszego, praktycznie przestała obowiązywać. Na dworze Kazimierza pisał swoją kronikę Wincenty Kadłubek, ten sam, który wymyślił polskie zwycięstwa nad Aleksandrem Wielkim. Kadłubek był człowiekiem wybitnym, choć jako historyk mało wiarygodnym. Studiował prawdopodobnie w Paryżu albo w Bolonii, był biskupem krakowskim, a pod koniec życia zrzekł się urzędu i wstąpił do klasztoru cystersów w Jędrzejowie. Jego kronika jest pierwszą próbą opowiedzenia dziejów Polski jako dziejów jednej wspólnoty, a nie tylko rodu panującego. Kadłubek często używał łacińskiego słowa „res publica”, czyli „rzecz wspólna”, mówiąc o państwie, które nie jest własnością księcia. Ta myśl miała po wiekach dać nazwę całej Rzeczypospolitej. Kościół ogłosił go błogosławionym, a jego kronikę czytano w szkołach przez kilkaset lat."
    draft: true
    chunks:
      - pl: "Krakowski tron senioralny przechodził z rąk do rąk."
        ru: "Краковский сеньориальный престол переходил из рук в руки."
      - pl: " Po Bolesławie Kędzierzawym rządził Mieszko Stary, ale krakowscy możni szybko go obalili, bo rządził zbyt twardą ręką."
        ru: "После Болеслава Кудрявого правил Мешко Старый, но краковская знать быстро его свергла, потому что он правил слишком жёсткой рукой."
        note: "obalić — свергнуть; kędzierzawy — кудрявый"
      - pl: " Na jego miejsce wybrali najmłodszego syna Krzywoustego, Kazimierza, którego nazwano Sprawiedliwym."
        ru: "На его место выбрали младшего сына Кривоустого, Казимира, которого прозвали Справедливым."
      - pl: " W 1180 roku na zjeździe w Łęczycy Kazimierz nadał Kościołowi szerokie przywileje, a w zamian uzyskał zgodę na to, by Kraków dziedziczyli jego synowie."
        ru: "В 1180 году на съезде в Ленчице Казимир даровал Церкви широкие привилегии, а взамен получил согласие на то, чтобы Краков наследовали его сыновья."
        note: "przywilej — привилегия; dziedziczyć — наследовать"
      - pl: " Zasada senioratu, czyli władzy najstarszego, praktycznie przestała obowiązywać."
        ru: "Принцип сеньората, то есть власти старшего, практически перестал действовать."
        note: "obowiązywać — действовать, иметь силу"
      - pl: " Na dworze Kazimierza pisał swoją kronikę Wincenty Kadłubek, ten sam, który wymyślił polskie zwycięstwa nad Aleksandrem Wielkim."
        ru: "При дворе Казимира писал свою хронику Винцентий Кадлубек — тот самый, что выдумал польские победы над Александром Македонским."
      - pl: " Kadłubek był człowiekiem wybitnym, choć jako historyk mało wiarygodnym."
        ru: "Кадлубек был человеком выдающимся, хотя как историк малодостоверным."
        note: "wiarygodny — достоверный"
      - pl: " Studiował prawdopodobnie w Paryżu albo w Bolonii, był biskupem krakowskim, a pod koniec życia zrzekł się urzędu i wstąpił do klasztoru cystersów w Jędrzejowie."
        ru: "Он учился, вероятно, в Париже или Болонье, был краковским епископом, а в конце жизни отказался от сана и ушёл в цистерцианский монастырь в Енджеюве."
      - pl: " Jego kronika jest pierwszą próbą opowiedzenia dziejów Polski jako dziejów jednej wspólnoty, a nie tylko rodu panującego."
        ru: "Его хроника — первая попытка рассказать историю Польши как историю одного сообщества, а не только правящего рода."
      - pl: " Kadłubek często używał łacińskiego słowa „res publica”, czyli „rzecz wspólna”, mówiąc o państwie, które nie jest własnością księcia."
        ru: "Кадлубек часто употреблял латинское слово res publica, то есть «общее дело», говоря о государстве, которое не является собственностью князя."
      - pl: " Ta myśl miała po wiekach dać nazwę całej Rzeczypospolitej."
        ru: "Этой мысли спустя века предстояло дать название всей Речи Посполитой."
      - pl: " Kościół ogłosił go błogosławionym, a jego kronikę czytano w szkołach przez kilkaset lat."
        ru: "Церковь причислила его к блаженным, а его хронику читали в школах несколько сотен лет."
        note: "błogosławiony — блаженный"
    words: { "tron": tron, "rządził": rzadzic, "zjeździe": zjazd, "nadał": nadac, "szerokie": szeroki, "przywileje": przywilej, "uzyskał": uzyskac, "praktycznie": praktycznie, "dworze": dwor, "polskie": polski, "zwycięstwa": zwyciestwo, "wybitnym": wybitny, "wiarygodnym": wiarygodny, "Studiował": studiowac, "urzędu": urzad, "wstąpił": wstapic, "klasztoru": klasztor, "wspólnoty": wspolnota, "rodu": rod-2, "panującego": panowac, "własnością": wlasnosc, "ogłosił": oglosic, "błogosławionym": blogoslawic }
  - clean: "Kraków był stale łakomym kąskiem. Kto nim władał, ten miał największy prestiż wśród książąt piastowskich i mógł marzyć o zjednoczeniu kraju. Dlatego walki o niego toczyły się prawie bez przerwy. Syn Kazimierza, Leszek Biały, zginął w 1227 roku w Gąsawie, napadnięty przez innych książąt w czasie zjazdu. Legenda mówi, że zaskoczono go w łaźni i że próbował uciekać na koniu, zupełnie nagi. Takich krwawych epizodów było w tamtym stuleciu wiele."
    draft: true
    chunks:
      - pl: "Kraków był stale łakomym kąskiem."
        ru: "Краков постоянно был лакомым куском."
        note: "łakomy kąsek — лакомый кусок"
      - pl: " Kto nim władał, ten miał największy prestiż wśród książąt piastowskich i mógł marzyć o zjednoczeniu kraju."
        ru: "Кто им владел, тот обладал наибольшим престижем среди пястовских князей и мог мечтать об объединении страны."
        note: "książęta — князья (мн. ч. от książę)"
      - pl: " Dlatego walki o niego toczyły się prawie bez przerwy."
        ru: "Поэтому борьба за него шла почти непрерывно."
        note: "toczyć się — идти, происходить (о борьбе)"
      - pl: " Syn Kazimierza, Leszek Biały, zginął w 1227 roku w Gąsawie, napadnięty przez innych książąt w czasie zjazdu."
        ru: "Сын Казимира, Лешек Белый, погиб в 1227 году в Гонсаве, когда на него во время съезда напали другие князья."
        note: "napadnięty — подвергшийся нападению"
      - pl: " Legenda mówi, że zaskoczono go w łaźni i że próbował uciekać na koniu, zupełnie nagi."
        ru: "Легенда гласит, что его застали врасплох в бане и что он пытался бежать на коне совершенно голым."
        note: "łaźnia — баня; nagi — голый"
      - pl: " Takich krwawych epizodów było w tamtym stuleciu wiele."
        ru: "Таких кровавых эпизодов в том столетии было много."
        note: "stulecie — столетие"
    words: { "toczyły": toczyc, "napadnięty": napasc, "zjazdu": zjazd, "Legenda": legenda, "nagi": nagi, "krwawych": krwawy, "stuleciu": stulecie }
  - clean: "Z biegiem lat dzielnice dzieliły się na coraz mniejsze księstwa, bo każdy książę miał kilku synów. Pod koniec XIII wieku na ziemiach polskich było kilkanaście księstw, a sam Śląsk dzielił się na kilka. Książęta prowadzili własną politykę, zawierali sojusze z Niemcami, Czechami, Węgrami czy Rusią, a czasem walczyli przeciwko sobie z pomocą obcych wojsk. Rosła za to siła możnych i Kościoła, którzy otrzymywali od książąt kolejne nadania ziemi i przywileje. Rozbicie dzielnicowe nie było jednak czasem wyłącznie upadku. W małych księstwach władca był bliżej poddanych, a rywalizacja między książętami sprzyjała zakładaniu nowych miast, klasztorów i wsi. Gospodarczo był to czas szybkiego rozwoju, o czym opowiemy w następnym rozdziale."
    draft: true
    chunks:
      - pl: "Z biegiem lat dzielnice dzieliły się na coraz mniejsze księstwa, bo każdy książę miał kilku synów."
        ru: "С годами уделы дробились на всё более мелкие княжества, ведь у каждого князя было по нескольку сыновей."
        note: "z biegiem lat — с годами; księstwo — княжество"
      - pl: " Pod koniec XIII wieku na ziemiach polskich było kilkanaście księstw, a sam Śląsk dzielił się na kilka."
        ru: "К концу XIII века на польских землях было больше десятка княжеств, а одна только Силезия делилась на несколько."
      - pl: " Książęta prowadzili własną politykę, zawierali sojusze z Niemcami, Czechami, Węgrami czy Rusią, a czasem walczyli przeciwko sobie z pomocą obcych wojsk."
        ru: "Князья вели собственную политику, заключали союзы с немцами, чехами, венграми или Русью, а иногда воевали друг против друга с помощью чужих войск."
      - pl: " Rosła za to siła możnych i Kościoła, którzy otrzymywali od książąt kolejne nadania ziemi i przywileje."
        ru: "Зато росла сила знати и Церкви, получавших от князей всё новые земельные пожалования и привилегии."
        note: "nadanie — пожалование"
      - pl: " Rozbicie dzielnicowe nie było jednak czasem wyłącznie upadku."
        ru: "Однако удельная раздробленность не была временем одного лишь упадка."
        note: "wyłącznie — исключительно"
      - pl: " W małych księstwach władca był bliżej poddanych, a rywalizacja między książętami sprzyjała zakładaniu nowych miast, klasztorów i wsi."
        ru: "В маленьких княжествах правитель был ближе к подданным, а соперничество между князьями способствовало основанию новых городов, монастырей и деревень."
        note: "sprzyjać — способствовать; rywalizacja — соперничество"
      - pl: " Gospodarczo był to czas szybkiego rozwoju, o czym opowiemy w następnym rozdziale."
        ru: "В хозяйственном отношении это было время быстрого развития, о чём мы расскажем в следующей главе."
        note: "gospodarczo — в хозяйственном отношении"
    words: { "przywileje": przywilej, "biegiem": bieg, "dzielnice": dzielnica, "dzieliły": dzielic, "polskich": polski, "kilkanaście": kilkanascie, "dzielił": dzielic, "politykę": polityka, "zawierali": zawierac, "sojusze": sojusz, "wojsk": wojsko, "Rosła": rosnac, "otrzymywali": otrzymywac, "wyłącznie": wylacznie, "upadku": upadek, "władca": wladca, "klasztorów": klasztor, "wsi": wies, "rozwoju": rozwoj, "rozdziale": rozdzial }
  - clean: "Z tego okresu pochodzi też najstarsze zapisane zdanie w języku polskim. Znajdziemy je w Księdze henrykowskiej, kronice cysterskiego klasztoru w Henrykowie na Śląsku, spisanej około 1270 roku. Mnich opowiada o pewnym Czechu, osadniku Boguchwale, który widząc, jak żona męczy się przy żarnach, powiedział do niej: „Daj, ać ja pobruszę, a ty poczywaj”, czyli „Daj, niech ja pomielę, a ty odpocznij”. To proste zdanie, pełne czułości, zapisane łacińskimi literami w łacińskiej kronice, jest dziś wpisane na listę Pamięć Świata UNESCO."
    draft: true
    chunks:
      - pl: "Z tego okresu pochodzi też najstarsze zapisane zdanie w języku polskim."
        ru: "К этому периоду относится и древнейшая записанная фраза на польском языке."
      - pl: " Znajdziemy je w Księdze henrykowskiej, kronice cysterskiego klasztoru w Henrykowie na Śląsku, spisanej około 1270 roku."
        ru: "Мы найдём её в Генриковской книге, хронике цистерцианского монастыря в Генрикове в Силезии, составленной около 1270 года."
        note: "cysterski — цистерцианский"
      - pl: " Mnich opowiada o pewnym Czechu, osadniku Boguchwale, który widząc, jak żona męczy się przy żarnach, powiedział do niej:"
        ru: "Монах рассказывает о некоем чехе, поселенце Богухвале, который, видя, как жена мучается у жерновов, сказал ей:"
        note: "osadnik — поселенец; żarna — ручные жернова"
      - pl: " „Daj, ać ja pobruszę, a ty poczywaj”, czyli „Daj, niech ja pomielę, a ty odpocznij”."
        ru: "«Дай, я помелю, а ты отдохни»."
        note: "ać — пусть (старопольское); poczywać — отдыхать"
      - pl: " To proste zdanie, pełne czułości, zapisane łacińskimi literami w łacińskiej kronice, jest dziś wpisane na listę Pamięć Świata UNESCO."
        ru: "Эта простая фраза, полная нежности, записанная латинскими буквами в латинской хронике, сегодня внесена в список «Память мира» ЮНЕСКО."
        note: "czułość — нежность"
    words: { "klasztoru": klasztor, "okresu": okres, "zapisane": zapisac, "polskim": polski, "spisanej": spisac, "Mnich": mnich, "męczy": meczyc, "odpocznij": odpoczac, "literami": litera, "wpisane": wpisac }
  - clean: "Najsilniejszymi władcami pierwszej połowy XIII wieku byli książęta śląscy. Henryk Brodaty, wnuk Władysława Wygnańca, zjednoczył pod swoją władzą Śląsk, ziemię krakowską i część Wielkopolski. Historycy mówią czasem o „monarchii Henryków śląskich” i zastanawiają się, czy to oni nie zjednoczyliby Polski, gdyby nie katastrofa, która miała wkrótce nadejść. Żoną Henryka była Jadwiga, niemiecka księżniczka, która słynęła z pobożności i z pomocy ubogim. Chodziła boso nawet zimą, a buty nosiła w ręku, kiedy mąż kazał jej je włożyć. Po śmierci ogłoszono ją świętą i do dziś jest patronką Śląska."
    draft: true
    chunks:
      - pl: "Najsilniejszymi władcami pierwszej połowy XIII wieku byli książęta śląscy."
        ru: "Сильнейшими правителями первой половины XIII века были силезские князья."
      - pl: " Henryk Brodaty, wnuk Władysława Wygnańca, zjednoczył pod swoją władzą Śląsk, ziemię krakowską i część Wielkopolski."
        ru: "Генрих Бородатый, внук Владислава Изгнанника, объединил под своей властью Силезию, Краковскую землю и часть Великой Польши."
        note: "brodaty — бородатый"
      - pl: " Historycy mówią czasem o „monarchii Henryków śląskich” i zastanawiają się, czy to oni nie zjednoczyliby Polski, gdyby nie katastrofa, która miała wkrótce nadejść."
        ru: "Историки говорят иногда о «монархии силезских Генрихов» и задаются вопросом, не они ли объединили бы Польшу, если бы не катастрофа, которая вскоре должна была разразиться."
        note: "nadejść — наступить, прийти"
      - pl: " Żoną Henryka była Jadwiga, niemiecka księżniczka, która słynęła z pobożności i z pomocy ubogim."
        ru: "Женой Генриха была Ядвига, немецкая княжна, прославившаяся набожностью и помощью бедным."
        note: "słynąć z czegoś — славиться чем-л."
      - pl: " Chodziła boso nawet zimą, a buty nosiła w ręku, kiedy mąż kazał jej je włożyć."
        ru: "Она ходила босиком даже зимой, а башмаки носила в руках, когда муж велел ей их надеть."
