        ru: "Удалось это лишь великопольскому князю Пшемыславу II."
      - pl: " W 1294 roku odziedziczył Pomorze Gdańskie po ostatnim księciu z miejscowej dynastii, a w 1295 roku arcybiskup koronował go w Gnieźnie na króla Polski."
        ru: "В 1294 году он унаследовал Гданьское Поморье от последнего князя местной династии, а в 1295 году архиепископ короновал его в Гнезно королём Польши."
      - pl: " Koronował go arcybiskup gnieźnieński Jakub Świnka, gorący zwolennik zjednoczenia kraju."
        ru: "Его короновал гнезненский архиепископ Якуб Свинка, горячий сторонник объединения страны."
      - pl: " Świnka nie lubił Niemców, którzy w jego czasach napływali do polskich miast i klasztorów, i podobno nazywał ich psimi głowami."
