  - clean: "Własną drogą szło w tym czasie Pomorze Gdańskie. Rządzili nim miejscowi książęta, którzy wywodzili się z dawnych namiestników piastowskich, ale w XIII wieku uniezależnili się od Krakowa. Najpotężniejszym z nich był Świętopełk, nazywany Wielkim. Przypisywano mu udział w zabójstwie Leszka Białego w Gąsawie, bo dzięki tej zbrodni przestał być lennikiem Krakowa. Później przez wiele lat walczył z Krzyżakami i wspierał przeciw nim zbuntowanych Prusów. Za jego panowania rozwijał się Gdańsk, który otrzymał prawa miejskie i stał się ważnym portem. Ostatni książę z tej dynastii, Mściwój II, nie miał synów. Zawarł więc układ z księciem wielkopolskim Przemysłem, w którym zapisał mu po swojej śmierci całe Pomorze. Ten układ miał wkrótce ogromne znaczenie dla losów całego kraju."
