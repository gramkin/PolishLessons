      - pl: " Według Jana Długosza, który pisał dwieście lat później, Tatarzy odcięli mu głowę, zatknęli ją na włócznię i obnosili pod murami Legnicy."
        ru: "По словам Яна Длугоша, писавшего двести лет спустя, татары отрубили ему голову, насадили её на копьё и носили под стенами Легницы."
