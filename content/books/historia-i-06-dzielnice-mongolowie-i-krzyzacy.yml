      - pl: " Według Długosza ciała księcia, pozbawionego głowy, nie można było rozpoznać wśród poległych."
        ru: "По словам Длугоша, обезглавленное тело князя невозможно было опознать среди павших."
      - pl: " Rozpoznała je dopiero jego matka, święta Jadwiga, po tym, że miał sześć palców u lewej stopy."
        ru: "Опознала его лишь его мать, святая Ядвига, — по тому, что у него было шесть пальцев на левой ноге."
