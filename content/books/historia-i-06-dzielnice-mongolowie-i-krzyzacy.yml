        ru: "В знаменитом Манесском кодексе, средневековом сборнике песен из Цюриха, есть его портрет: князь сидит на коне во время турнира, а дамы вручают ему венок победителя."
        note: "kodeks — кодекс, рукопись"
      - pl: " Zachowały się też dwie jego pieśni."
