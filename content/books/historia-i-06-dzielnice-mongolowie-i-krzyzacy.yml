      - pl: " Walczył o to, by w kościołach mówiono kazania po polsku, a w szkołach katedralnych uczyli polscy nauczyciele."
        ru: "Он добивался того, чтобы в храмах читали проповеди по-польски, а в соборных школах преподавали польские учителя."
