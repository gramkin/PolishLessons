# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 24
chapterTitle: "Pieśń XXIV"
chapterTitleRu: "Песнь XXIV. Испытание в вере"
level: B2
paragraphs:
  - clean: "Ciąg dalszy. Św. Piotr poucza poetę o wierze. Wyznanie wiary poety."
    chunks:
      - pl: "Ciąg dalszy. Św. Piotr poucza poetę o wierze. Wyznanie wiary poety."
        ru: "Продолжение. Святой Пётр наставляет поэта о вере. Исповедание веры поэта."
    words: { "Ciąg": ciag, "dalszy": daleki, "poetę": poeta, "wierze": wiara, "Wyznanie": wyznac }
  - clean: "«Pańskiej wieczerzy wybrana gromado,\nKtórą baranek ugaszcza biesiadą,\nW sposób, że zawsze macie sytą wolę,\nJeśli przez łaskę Boga on pożywa\nTo, co z waszego stołu jemu spada,\nJako przechodzeń na ziemskim padole;\nRozważ, jak jego zapał jest bezmierny,\nOchłodź go trochę, ty, co z tej cysterny,\nBez dna i brzegów zawsze pijesz rada,\nSkąd, co on myśli, zaiste wypływa»."
    verse: true
    chunks:
      - pl: "«Pańskiej wieczerzy wybrana gromado,"
        ru: "«Избранный сонм Господней вечери,"
      - pl: "\nKtórą baranek ugaszcza biesiadą,"
        ru: "которых Агнец угощает пиршеством"
        note: "biesiada — пир"
      - pl: "\nW sposób, że zawsze macie sytą wolę,"
        ru: "так, что ваша воля всегда насыщена,"
      - pl: "\nJeśli przez łaskę Boga on pożywa"
        ru: "если по милости Божьей он вкушает"
        note: "pożywać — вкушать"
      - pl: "\nTo, co z waszego stołu jemu spada,"
        ru: "то, что падает ему с вашего стола,"
      - pl: "\nJako przechodzeń na ziemskim padole;"
        ru: "как прохожему в земной юдоли;"
        note: "przechodzeń — прохожий"
      - pl: "\nRozważ, jak jego zapał jest bezmierny,"
        ru: "взвесь, как безмерен его пыл,"
      - pl: "\nOchłodź go trochę, ty, co z tej cysterny,"
        ru: "охлади его немного, ты, что из этой цистерны,"
        note: "апостол Пётр"
      - pl: "\nBez dna i brzegów zawsze pijesz rada,"
        ru: "без дна и берегов, всегда охотно пьёшь,"
      - pl: "\nSkąd, co on myśli, zaiste wypływa»."
        ru: "откуда, воистину, вытекает то, что он думает»."
    words: { "łaskę": laska-2, "stołu": stol, "spada": spadac, "ziemskim": ziemski, "Rozważ": rozwazyc, "brzegów": brzeg }
  - clean: "Tak Beatrycze: a wesołe duchy,\nNa stałych osiach kołowymi ruchy\nWirując szybko, stały się sferami,\nNa obraz komet rzęśniejąc ogniami.\nI jako koła w budowie zegarów\nZdają się krążyć wedle swych rozmiarów,\nGdy pierwsze stoi, ostatnie już leci,\nSfer tych obrotu szybkość lub leniwość\nKazały sądzić, jaka ich szczęśliwość!"
    verse: true
    chunks:
      - pl: "Tak Beatrycze: a wesołe duchy,"
        ru: "Так Беатриче; и весёлые духи,"
      - pl: "\nNa stałych osiach kołowymi ruchy"
        ru: "вращаясь быстро круговыми движениями"
      - pl: "\nWirując szybko, stały się sferami,"
        ru: "на неподвижных осях, стали сферами,"
      - pl: "\nNa obraz komet rzęśniejąc ogniami."
        ru: "сверкая огнями наподобие комет."
      - pl: "\nI jako koła w budowie zegarów"
        ru: "И как колёса в устройстве часов"
      - pl: "\nZdają się krążyć wedle swych rozmiarów,"
        ru: "кажутся кружащими по своим размерам:"
      - pl: "\nGdy pierwsze stoi, ostatnie już leci,"
        ru: "когда первое стоит, последнее уже летит, —"
      - pl: "\nSfer tych obrotu szybkość lub leniwość"
        ru: "так быстрота или медлительность вращения этих сфер"
      - pl: "\nKazały sądzić, jaka ich szczęśliwość!"
        ru: "позволяли судить, каково их блаженство!"
    words: { "wesołe": wesoly, "zegarów": zegar, "krążyć": krazyc, "rozmiarów": rozmiar, "obrotu": obrot, "szybkość": szybkosc }
  - clean: "Oto ze sfery, co najpiękniej świeci,\nWidziałem, wyszło tak szczęśliwe płomie,\nŻe wszystkie inne pobladły widomie:\nPłomie obeszło wkoło Beatrycy\nTrzy razy, jakby wieńcem błyskawicy,\nZ pieśnią tak boską, że jako niemowa\nW mej wyobraźni na to nie mam słowa;\nDlatego pióro wysileniem dysze\nI skacze tylko, lecz o niej nie pisze;\nBo wyobraźni naszej słabe skrzydło,\nMdłą jest słów barwa na to malowidło."
    verse: true
    chunks:
      - pl: "Oto ze sfery, co najpiękniej świeci,"
        ru: "И вот из сферы, что светит прекраснее всех,"
      - pl: "\nWidziałem, wyszło tak szczęśliwe płomie,"
        ru: "я видел, вышло столь счастливое пламя,"
      - pl: "\nŻe wszystkie inne pobladły widomie:"
        ru: "что все остальные явно побледнели:"
        note: "widomie — явно"
      - pl: "\nPłomie obeszło wkoło Beatrycy"
        ru: "пламя обошло вокруг Беатриче"
      - pl: "\nTrzy razy, jakby wieńcem błyskawicy,"
        ru: "трижды, словно венцом молнии,"
      - pl: "\nZ pieśnią tak boską, że jako niemowa"
        ru: "с песней столь божественной, что, как немой,"
      - pl: "\nW mej wyobraźni na to nie mam słowa;"
        ru: "в своём воображении я не нахожу для неё слова;"
      - pl: "\nDlatego pióro wysileniem dysze"
        ru: "поэтому перо задыхается от усилия"
      - pl: "\nI skacze tylko, lecz o niej nie pisze;"
        ru: "и лишь перескакивает, но о ней не пишет;"
      - pl: "\nBo wyobraźni naszej słabe skrzydło,"
        ru: "ибо у нашего воображения слабое крыло,"
      - pl: "\nMdłą jest słów barwa na to malowidło."
        ru: "бледна краска слов для этой картины."
        note: "malowidło — картина"
    words: { "najpiękniej": pieknie, "obeszło": obejsc, "pieśnią": piesn, "wyobraźni": wyobraznia, "pióro": pioro, "skrzydło": skrzydlo }
  - clean: "«O święta siostro! Głos twej prośby szczery\nDuch mój odrywa od tej pięknej sfery».\nTak święty płomień z środka swego koła\nObrócił oddech wprost do pani mojej,\nI tchnął te słowa, jako wyżej stoi.\nA ona: — «Światło wieczne apostoła,\nKtóremu nasz Pan złożył kluczów brzemię\nOd tej radości, jaką zniósł na ziemię,\nBadaj go ściśle, on zdać sprawę gotów,\nJak zechcesz, z lekkich czy ważnych przedmiotów\nWzględnych do wiary, której moc i siła\nCiebie po wodach wzburzonych wodziła."
    verse: true
    chunks:
      - pl: "«O święta siostro! Głos twej prośby szczery"
        ru: "«О святая сестра! Искренний голос твоей просьбы"
      - pl: "\nDuch mój odrywa od tej pięknej sfery»."
        ru: "отрывает мой дух от этой прекрасной сферы»."
      - pl: "\nTak święty płomień z środka swego koła"
        ru: "Так святое пламя из середины своего круга"
      - pl: "\nObrócił oddech wprost do pani mojej,"
        ru: "обратило дыхание прямо к моей госпоже"
      - pl: "\nI tchnął te słowa, jako wyżej stoi."
        ru: "и выдохнуло эти слова, как написано выше."
      - pl: "\nA ona: — «Światło wieczne apostoła,"
        ru: "А она: — «Вечный свет апостола,"
      - pl: "\nKtóremu nasz Pan złożył kluczów brzemię"
        ru: "которому наш Господь вручил бремя ключей"
      - pl: "\nOd tej radości, jaką zniósł na ziemię,"
        ru: "от той радости, что принёс на землю,"
      - pl: "\nBadaj go ściśle, on zdać sprawę gotów,"
        ru: "испытай его строго, он готов дать отчёт,"
      - pl: "\nJak zechcesz, z lekkich czy ważnych przedmiotów"
        ru: "как захочешь, о лёгких или важных предметах,"
      - pl: "\nWzględnych do wiary, której moc i siła"
        ru: "касающихся веры, чья мощь и сила"
      - pl: "\nCiebie po wodach wzburzonych wodziła."
        ru: "водила тебя по взволнованным водам."
    words: { "płomień": plomien, "Obrócił": obrocic, "wieczne": wieczny, "ściśle": scisle, "przedmiotów": przedmiot, "wodziła": wodzic }
  - clean: "Jak wierzy, kocha, spodziewa się szczerze,\nTy wiesz, bo wzrok twój w tym zwierciadle czyta,\nGdzie się maluje rzecz każda odbita;\nLecz w tym królestwie gdy w zaszczyt ubiera\nObywatelstwa tylko wiara szczera,\nDobrze żeś przyszedł mówić mu o wierze."
    verse: true
    chunks:
      - pl: "Jak wierzy, kocha, spodziewa się szczerze,"
        ru: "Как искренне он верит, любит, надеется,"
      - pl: "\nTy wiesz, bo wzrok twój w tym zwierciadle czyta,"
        ru: "ты знаешь, ибо твой взгляд читает в том зеркале,"
      - pl: "\nGdzie się maluje rzecz każda odbita;"
        ru: "где отражённой отображается каждая вещь;"
      - pl: "\nLecz w tym królestwie gdy w zaszczyt ubiera"
        ru: "но поскольку в этом царстве в честь гражданства"
      - pl: "\nObywatelstwa tylko wiara szczera,"
        ru: "облекает лишь искренняя вера,"
      - pl: "\nDobrze żeś przyszedł mówić mu o wierze."
        ru: "хорошо, что ты пришёл говорить с ним о вере»."
    words: { "wzrok": wzrok, "maluje": malowac, "odbita": odbic, "królestwie": krolestwo, "zaszczyt": zaszczyt, "ubiera": ubierac }
  - clean: "A jak bakałarz przez cześć ku mistrzowi\nMilczy, gdy mistrz mu zadaje pytanie,\nNie wyrokuje, lecz przyzwala na nie;\nTak się zbroiłem w dowody i słowa,\nAby już była odpowiedź gotowa,\nKiedy spowiednik taki: «Mów!» przemówi."
    verse: true
    chunks:
      - pl: "A jak bakałarz przez cześć ku mistrzowi"
        ru: "И как бакалавр из почтения к учителю"
        note: "bakałarz — бакалавр"
      - pl: "\nMilczy, gdy mistrz mu zadaje pytanie,"
        ru: "молчит, когда учитель задаёт ему вопрос,"
      - pl: "\nNie wyrokuje, lecz przyzwala na nie;"
        ru: "не решает, но лишь соглашается на него,"
        note: "у Данте: готовится доказывать, а не решать"
      - pl: "\nTak się zbroiłem w dowody i słowa,"
        ru: "так я вооружался доводами и словами,"
      - pl: "\nAby już była odpowiedź gotowa,"
        ru: "чтобы ответ был уже готов,"
      - pl: "\nKiedy spowiednik taki: «Mów!» przemówi."
        ru: "когда такой исповедник скажет: «Говори!»"
        note: "spowiednik — исповедник"
    words: { "mistrzowi": mistrz, "Milczy": milczec, "zadaje": zadawac, "dowody": dowod, "odpowiedź": odpowiedz, "przemówi": przemowic }
  - clean: "«Mów, co jest wiara? Mów, chrześcijaninie!»\nWtenczas podniosłem moje czoło śmiało\nKu światłu, skąd mi to słowo powiało:\nPotem spojrzałem w oczy Beatrycy,\nOna znak dała skinieniem źrenicy,\nAbym co prędzej w to święte naczynie\nLał wodę z mojej wewnętrznej krynicy."
    verse: true
    chunks:
      - pl: "«Mów, co jest wiara? Mów, chrześcijaninie!»"
        ru: "«Скажи, что есть вера? Скажи, христианин!»"
      - pl: "\nWtenczas podniosłem moje czoło śmiało"
        ru: "Тогда я смело поднял лоб"
      - pl: "\nKu światłu, skąd mi to słowo powiało:"
        ru: "к свету, откуда повеяло мне это слово;"
      - pl: "\nPotem spojrzałem w oczy Beatrycy,"
        ru: "потом посмотрел в глаза Беатриче,"
      - pl: "\nOna znak dała skinieniem źrenicy,"
        ru: "она подала знак кивком зрачка,"
      - pl: "\nAbym co prędzej w to święte naczynie"
        ru: "чтобы я поскорее в этот святой сосуд"
      - pl: "\nLał wodę z mojej wewnętrznej krynicy."
        ru: "лил воду из своего внутреннего источника."
        note: "krynica — источник"
    words: { "chrześcijaninie": chrzescijanin, "podniosłem": podniesc, "czoło": czolo, "prędzej": predko, "naczynie": naczynie, "wewnętrznej": wewnetrzny }
  - clean: "«Niech mi da łaska, przez którą przychodzę»\nRzekłem «tu mówić z wielkim Naczelnikiem,\nMyśl mą wysłowić treściwym językiem,\nJakim nam pióro twego brata pisze,\nCo z tobą złączył Rzym na dobrej drodze:\nWiara jest treścią rzeczy spodziewanych,\nA zaś wywodem rzeczy niewidzianych."
    verse: true
    chunks:
      - pl: "«Niech mi da łaska, przez którą przychodzę»"
        ru: "«Пусть милость, по которой я прихожу, —"
      - pl: "\nRzekłem «tu mówić z wielkim Naczelnikiem,"
        ru: "сказал я, — говорить здесь с великим Первоапостолом,"
        note: "naczelnik — глава"
      - pl: "\nMyśl mą wysłowić treściwym językiem,"
        ru: "даст мне выразить мысль сжатым языком,"
      - pl: "\nJakim nam pióro twego brata pisze,"
        ru: "каким нам пишет перо твоего брата,"
        note: "апостол Павел"
      - pl: "\nCo z tobą złączył Rzym na dobrej drodze:"
        ru: "что вместе с тобой привёл Рим на добрый путь:"
      - pl: "\nWiara jest treścią rzeczy spodziewanych,"
        ru: "вера есть сущность ожидаемого"
      - pl: "\nA zaś wywodem rzeczy niewidzianych."
        ru: "и обличение невидимого."
        note: "Евр. 11:1"
    words: { "przychodzę": przychodzic, "Rzekłem": rzec, "Naczelnikiem": naczelnik, "językiem": jezyk, "brata": brat, "spodziewanych": spodziewac }
  - clean: "To jej istota». Wtem głos posłyszałem:\n«Twój sens dość prosty, bo z tego, co słyszę,\nWidzę, pojmujesz, dlaczego on w treści\nNajpierw, a potem w wywodzie ją mieści».\nNie myśląc długo, tak odpowiedziałem:\n«Rzeczy głębokie tu widne na oko,\nTam są zakryte tak wielką pomroką,\nŻe ich byt stoi na jednym wierzeniu,\nNa tym nadziei węgielnym kamieniu;\nStąd miejsce treści wiara zastępuje."
    verse: true
    chunks:
      - pl: "To jej istota». Wtem głos posłyszałem:"
        ru: "Такова её природа». Тут я услышал голос:"
      - pl: "\n«Twój sens dość prosty, bo z tego, co słyszę,"
        ru: "«Твоё понимание верно, если, как я слышу,"
      - pl: "\nWidzę, pojmujesz, dlaczego on w treści"
        ru: "ты понимаешь, почему он помещает её сперва"
      - pl: "\nNajpierw, a potem w wywodzie ją mieści»."
        ru: "в сущность, а потом в обличение»."
        note: "wywód — довод, обличение"
      - pl: "\nNie myśląc długo, tak odpowiedziałem:"
        ru: "Не думая долго, я так ответил:"
      - pl: "\n«Rzeczy głębokie tu widne na oko,"
        ru: "«Глубокие вещи, здесь видимые глазу,"
      - pl: "\nTam są zakryte tak wielką pomroką,"
        ru: "там скрыты таким великим мраком,"
        note: "pomroka — мрак"
      - pl: "\nŻe ich byt stoi na jednym wierzeniu,"
        ru: "что их бытие стоит на одной вере,"
      - pl: "\nNa tym nadziei węgielnym kamieniu;"
        ru: "на этом краеугольном камне надежды;"
      - pl: "\nStąd miejsce treści wiara zastępuje."
        ru: "поэтому вера заступает место сущности."
    words: { "istota": istota, "głos": glos, "sens": sens, "mieści": miescic, "odpowiedziałem": odpowiedziec, "kamieniu": kamien }
  - clean: "Innego światła nie mając stworzenie,\nRozumowaniem objaśnia wierzenie;\nStąd wywód w imię wiary rozumuje.»\nWtem usłyszałem: — «Gdyby mądrość wasza,\nCo się nauką z ksiąg i ust ogłasza,\nByła tak dobrze pojętą, tak czystą,\nRozum wasz nigdy nie byłby sofistą»."
    verse: true
    chunks:
      - pl: "Innego światła nie mając stworzenie,"
        ru: "Творение, не имея другого света,"
      - pl: "\nRozumowaniem objaśnia wierzenie;"
        ru: "рассуждением объясняет веру;"
      - pl: "\nStąd wywód w imię wiary rozumuje.»"
        ru: "поэтому вера есть довод, через который рассуждают»."
      - pl: "\nWtem usłyszałem: — «Gdyby mądrość wasza,"
        ru: "Тут я услышал: — «Если бы ваша мудрость,"
      - pl: "\nCo się nauką z ksiąg i ust ogłasza,"
        ru: "что возвещается учением из книг и уст,"
      - pl: "\nByła tak dobrze pojętą, tak czystą,"
        ru: "была так хорошо понята, так чиста,"
      - pl: "\nRozum wasz nigdy nie byłby sofistą»."
        ru: "ваш разум никогда не был бы софистом»."
    words: { "Rozum": rozum, "usłyszałem": uslyszec, "mądrość": madrosc, "nauką": nauka, "ksiąg": ksiega, "pojętą": pojac }
  - clean: "Duch tchnął te słowa z miłością strzelistą.\nA potem dodał: «Próbę doskonałą\nWagi i ceny dałeś tej monety,\nLecz powiedz szczerze, czy masz ją w swej kiesie?»\nJa na to: — «Mam ją tak świeżą i całą,\nŻe podejrzewać jej stępla nie chce się»."
    verse: true
    chunks:
      - pl: "Duch tchnął te słowa z miłością strzelistą."
        ru: "Дух выдохнул эти слова с устремлённой любовью."
      - pl: "\nA potem dodał: «Próbę doskonałą"
        ru: "А потом добавил: «Ты дал совершенную пробу"
      - pl: "\nWagi i ceny dałeś tej monety,"
        ru: "веса и цены этой монеты,"
      - pl: "\nLecz powiedz szczerze, czy masz ją w swej kiesie?»"
        ru: "но скажи искренне, есть ли она у тебя в кошельке?»"
        note: "kiesa — кошель"
      - pl: "\nJa na to: — «Mam ją tak świeżą i całą,"
        ru: "Я на это: — «Она у меня такая свежая и цельная,"
      - pl: "\nŻe podejrzewać jej stępla nie chce się»."
        ru: "что не возникает сомнения в её чекане»."
