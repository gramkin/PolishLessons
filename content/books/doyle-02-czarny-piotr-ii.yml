  - clean: "Wysiedliśmy na małej stacyjce i pojechaliśmy końmi parę kilometrów przez duży las, szczątki ogromnej puszczy, która długo trzymała w szachu saksońskich najezdników, przez ów niegdyś nieprzenikniony Weald, będący przez sześćdziesiąt lat z górą murem obronnym Brytanii. Olbrzymie przestrzenie tego boru padły pod siekierą, tu bowiem powstały pierwsze w kraju huty żelaza i drzewo posłużyło na opał, aby topić kruszec. Obecnie bogatsze złoża na północy przejęły ten przemysł i nic prócz tych spustoszonych zagajników oraz wielkich ran w ziemi nie świadczy o pracy minionych czasów."
