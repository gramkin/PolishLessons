# review
title: Czarny Piotr
titleRu: Чёрный Питер
author: Arthur Conan Doyle
translator: "tłumacz nieznany"
source:
  name: "Wolne Lektury (Arthur Conan Doyle, «Tajemnica oblubienicy i inne nowele», Gebethner i Wolf 1905); сверено с оригиналом (Project Gutenberg)"
  url: https://wolnelektury.pl/katalog/lektura/doyle-czarny-piotr/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 2
chapterTitle: "Chata w Woodman’s Lee"
chapterTitleRu: "Хижина в Вудменс-Ли"
level: B2
paragraphs:
  - clean: "Hopkins wyciągnął z kieszeni notatkę oprawną w szare okładki. Zewnętrzna strona była bardzo zniszczona przez używanie. Na pierwszej stronie widniały inicjały „J. H. N.” i data „1883”."
    chunks:
      - pl: "Hopkins wyciągnął z kieszeni notatkę oprawną w szare okładki."
        ru: "Хопкинс вытащил из кармана записную книжку в серой обложке."
        note: "notatka — здесь «записная книжка», сегодня «заметка»; oprawny w coś — переплетённый во что-л."
      - pl: " Zewnętrzna strona była bardzo zniszczona przez używanie."
        ru: "Снаружи она была сильно потрёпана от употребления."
        note: "zniszczony — истрёпанный, испорченный"
      - pl: " Na pierwszej stronie widniały inicjały „J. H. N.” i data „1883”."
        ru: "На первой странице виднелись инициалы «J. H. N.» и дата «1883»."
    words: { "kieszeni": kieszen, "notatkę": notatka, "szare": szary, "okładki": okladka, "Zewnętrzna": zewnetrzny, "data": data }
  - clean: "Holmes położył notes przed sobą na stole i zbadał go ze zwykłą drobiazgowością. Hopkins i ja przypatrywaliśmy się tej pracy zza pleców Sherlocka."
    chunks:
      - pl: "Holmes położył notes przed sobą na stole"
        ru: "Холмс положил книжку перед собой на стол"
        note: "notes — записная книжка, блокнот"
      - pl: " i zbadał go ze zwykłą drobiazgowością."
        ru: "и осмотрел её с обычной своей дотошностью."
        note: "drobiazgowość — дотошность, мелочность"
      - pl: " Hopkins i ja przypatrywaliśmy się tej pracy"
        ru: "Мы с Хопкинсом наблюдали за этой работой"
        note: "Hopkins i ja — «мы с Хопкинсом»: польский называет обоих"
      - pl: " zza pleców Sherlocka."
        ru: "из-за спины Шерлока."
        note: "zza — из-за (откуда): zza pleców"
    words: { "położył": polozyc, "stole": stol, "zbadał": zbadac, "zwykłą": zwykly, "pracy": praca, "pleców": plecy }
  - clean: "Na drugiej stronie były drukowane litery „C. P. R.”, a kilka następnych kartek zapełniono cyframi. Dalej kartka z napisem „Argentine”, dalej „Costa Rica”, trzecia „Sao Paulo”. Po każdej szły kartki z cyframi i znakami."
    chunks:
      - pl: "Na drugiej stronie były drukowane litery „C. P. R.”,"
        ru: "На второй странице были печатные буквы «C. P. R.»,"
      - pl: " a kilka następnych kartek zapełniono cyframi."
        ru: "а несколько следующих листков были заполнены цифрами."
        note: "zapełniono — безличная форма; cyfra — цифра"
      - pl: " Dalej kartka z napisem „Argentine”,"
        ru: "Дальше листок с надписью «Argentine»,"
      - pl: " dalej „Costa Rica”, trzecia „Sao Paulo”."
        ru: "потом «Costa Rica», третий — «Sao Paulo»."
      - pl: " Po każdej szły kartki z cyframi i znakami."
        ru: "За каждым шли листки с цифрами и значками."
        note: "po + местный — после"
    words: { "litery": litera, "następnych": nastepny, "kartek": kartka, "napisem": napis, "znakami": znak }
  - clean: "Holmes skończył oglądać i zwrócił się ku nam."
    chunks:
      - pl: "Holmes skończył oglądać i zwrócił się ku nam."
        ru: "Холмс закончил осмотр и повернулся к нам."
        note: "zwrócić się ku komuś — повернуться к кому-л.; ku — книжное «к»"
    words: { "skończył": skonczyc, "oglądać": ogladac, "zwrócił": zwrocic }
  - clean: "— Jak pan sądzi, co to jest? — spytał Hopkinsa, mierząc go bystrym spojrzeniem."
    chunks:
      - pl: "— Jak pan sądzi, co to jest? —"
        ru: "— Как вы думаете, что это такое? —"
        note: "sądzić — думать, полагать (и «судить»)"
      - pl: " spytał Hopkinsa, mierząc go bystrym spojrzeniem."
        ru: "спросил он Хопкинса, смерив его зорким взглядом."
        note: "mierzyć kogoś spojrzeniem — мерить взглядом; bystry — зоркий, проницательный"
    words: { "sądzi": sadzic, "jest": byc, "mierząc": mierzyc, "bystrym": bystry }
  - clean: "— Zdaje się, że to spis papierów giełdowych. Przypuszczam, że „J. H. N.” są inicjałami ajenta, zaś „C. P. R.” to był zapewne jego klient."
    chunks:
      - pl: "— Zdaje się, że to spis papierów giełdowych."
        ru: "— Кажется, это список биржевых бумаг."
        note: "spis — список; giełda — биржа"
      - pl: " Przypuszczam, że „J. H. N.” są inicjałami ajenta,"
        ru: "Предполагаю, что «J. H. N.» — это инициалы маклера,"
        note: "ajent — старое написание слова agent; здесь «биржевой маклер»"
      - pl: " zaś „C. P. R.” to był zapewne jego klient."
        ru: "а «C. P. R.» был, вероятно, его клиент."
        note: "zapewne — вероятно"
    words: { "Zdaje": zdawac, "papierów": papier, "Przypuszczam": przypuszczac, "klient": klient }
  - clean: "— Niech pan spróbuje podłożyć pod to słowo „Canadian Pacific Railway” — rzekł Holmes."
    chunks:
      - pl: "— Niech pan spróbuje podłożyć pod to słowo „Canadian Pacific Railway” —"
        ru: "— Попробуйте подставить сюда слова «Canadian Pacific Railway», —"
        note: "podłożyć coś pod coś — подставить, подложить"
      - pl: " rzekł Holmes."
        ru: "сказал Холмс."
    words: { "spróbuje": sprobowac, "podłożyć": podlozyc, "słowo": slowo, "rzekł": rzec }
  - clean: "Hopkins zaklął po cichu i trzasnął się kułakiem po udzie."
    chunks:
      - pl: "Hopkins zaklął po cichu"
        ru: "Хопкинс тихо выругался"
        note: "zakląć — выругаться"
      - pl: " i trzasnął się kułakiem po udzie."
        ru: "и хлопнул себя кулаком по бедру."
        note: "kułak — старое «кулак», сегодня pięść; udo — бедро"
    words: { "udzie": udo }
  - clean: "— Ach, cóż to za osioł był ze mnie! Naturalnie, że to tak, jak pan mówi! Ależ w takim razie pozostaje nam tylko odcyfrować inicjały „J. H. N.”. Kazałem już sobie przynieść stare rejestry giełdowe i badałem je całą noc, lecz w roku 1883 nie mogłem odkryć ajenta giełdowego o nazwisku takim, aby inicjały zgodziły się z nim. A jednak czuję dobrze, jak ważne byłoby to odkrycie. Przyzna pan, panie Holmes, że inicjały te oznaczają w każdym razie nazwisko tego drugiego człowieka, czyli, innymi słowy, dadzą nam nazwisko zbrodniarza. A jeszcze trzeba zwrócić uwagę, że odkrycie dokumentu, który odnosi się do takiej masy papierów wartościowych, może nam dać ważne wskazówki co do pobudek mordu."
    chunks:
      - pl: "— Ach, cóż to za osioł był ze mnie!"
        ru: "— Ах, какой же я осёл!"
        note: "być osłem — быть ослом; cóż to za — что за"
      - pl: " Naturalnie, że to tak, jak pan mówi!"
        ru: "Разумеется, так оно и есть, как вы говорите!"
      - pl: " Ależ w takim razie"
        ru: "Но в таком случае"
        note: "w takim razie — в таком случае"
      - pl: " pozostaje nam tylko odcyfrować inicjały „J. H. N.”."
        ru: "нам остаётся только разгадать инициалы «J. H. N.»."
        note: "odcyfrować — расшифровать"
      - pl: " Kazałem już sobie przynieść stare rejestry giełdowe"
        ru: "Я уже велел принести мне старые биржевые реестры"
        note: "kazać — велеть; kazać sobie przynieść — велеть принести себе"
      - pl: " i badałem je całą noc,"
        ru: "и изучал их всю ночь,"
        note: "całą noc — всю ночь: винительный времени"
      - pl: " lecz w roku 1883 nie mogłem odkryć ajenta giełdowego"
        ru: "но за 1883 год не смог найти биржевого маклера"
        note: "odkryć — открыть, обнаружить"
      - pl: " o nazwisku takim, aby inicjały zgodziły się z nim."
        ru: "с такой фамилией, с которой совпали бы инициалы."
        note: "zgodzić się z czymś — совпасть, согласоваться"
      - pl: " A jednak czuję dobrze, jak ważne byłoby to odkrycie."
        ru: "И всё же я хорошо понимаю, как важно было бы это открытие."
      - pl: " Przyzna pan, panie Holmes,"
        ru: "Согласитесь, мистер Холмс,"
        note: "przyznać — признать"
      - pl: " że inicjały te oznaczają w każdym razie"
        ru: "что эти инициалы во всяком случае означают"
        note: "w każdym razie — во всяком случае"
      - pl: " nazwisko tego drugiego człowieka,"
        ru: "фамилию того, второго человека,"
      - pl: " czyli, innymi słowy, dadzą nam nazwisko zbrodniarza."
        ru: "то есть, другими словами, дадут нам фамилию преступника."
        note: "czyli — то есть; innymi słowy — другими словами"
      - pl: " A jeszcze trzeba zwrócić uwagę,"
        ru: "А ещё надо обратить внимание,"
      - pl: " że odkrycie dokumentu,"
        ru: "что находка документа,"
      - pl: " który odnosi się do takiej masy papierów wartościowych,"
        ru: "который относится к такой массе ценных бумаг,"
        note: "odnosić się do czegoś — относиться к чему-л.; papiery wartościowe — ценные бумаги"
      - pl: " może nam dać ważne wskazówki co do pobudek mordu."
        ru: "может дать нам важные указания насчёт мотивов убийства."
        note: "pobudka — здесь «побуждение, мотив»; сегодня обычно «подъём, побудка»; mord — убийство"
    words: { "osioł": osiol, "Naturalnie": naturalnie, "pozostaje": pozostawac, "rejestry": rejestr, "wartościowych": wartosciowy }
  - clean: "— Muszę się zgodzić z panem w obu punktach — rzekł Sherlock Holmes. — Przyznaję, że ten notatnik, który wydawał mi się nieznaczącym punktem zaczepienia, dopóki znałem go tylko z opisu w protokole, obecnie przedstawia się zupełnie inaczej i bardzo zmodyfikował teorię, jaką sobie wyrobiłem o morderstwie. Nie ma mowy, aby sprawa mogła mieć taką podstawę, jak myślałem. Czy nie starał się pan dojść, jakie tutaj zanotowano papiery? Przynajmniej niektóre?"
    chunks:
      - pl: "— Muszę się zgodzić z panem w obu punktach —"
        ru: "— Должен согласиться с вами в обоих пунктах, —"
        note: "zgodzić się z kimś — согласиться с кем-л."
      - pl: " rzekł Sherlock Holmes. —"
        ru: "сказал Шерлок Холмс. —"
      - pl: " Przyznaję, że ten notatnik,"
        ru: "Признаю, что эта записная книжка,"
        note: "notatnik — записная книжка"
      - pl: " który wydawał mi się nieznaczącym punktem zaczepienia,"
        ru: "которая казалась мне незначительной зацепкой,"
        note: "punkt zaczepienia — зацепка, отправная точка"
      - pl: " dopóki znałem go tylko z opisu w protokole,"
        ru: "пока я знал её только по описанию в протоколе,"
      - pl: " obecnie przedstawia się zupełnie inaczej"
        ru: "теперь предстаёт совсем в другом свете"
        note: "przedstawiać się — представляться, выглядеть"
      - pl: " i bardzo zmodyfikował teorię,"
        ru: "и сильно изменила теорию,"
      - pl: " jaką sobie wyrobiłem o morderstwie."
        ru: "которую я составил себе об убийстве."
        note: "wyrobić sobie zdanie/teorię — составить себе мнение"
      - pl: " Nie ma mowy, aby sprawa mogła mieć taką podstawę,"
        ru: "Не может быть и речи, чтобы дело имело такую основу,"
        note: "nie ma mowy — не может быть и речи"
      - pl: " jak myślałem."
        ru: "как я думал."
      - pl: " Czy nie starał się pan dojść,"
        ru: "Не пытались ли вы выяснить,"
        note: "dojść — здесь «доискаться, выяснить»"
      - pl: " jakie tutaj zanotowano papiery?"
        ru: "какие здесь записаны бумаги?"
      - pl: " Przynajmniej niektóre?"
        ru: "Хотя бы некоторые?"
    words: { "rzekł": rzec, "Przyznaję": przyznawac, "opisu": opis, "protokole": protokol, "przedstawia": przedstawiac, "zanotowano": zanotowac }
  - clean: "— Zarządziłem poszukiwania w bankach, ale zdaje mi się teraz, że to będzie spis akcjonariuszy tej kolei i że minie parę tygodni, nim będziemy mogli pójść tym śladem. Nim przyjdą wiadomości z Ameryki…"
    chunks:
      - pl: "— Zarządziłem poszukiwania w bankach,"
        ru: "— Я распорядился навести справки в банках,"
        note: "zarządzić — распорядиться"
      - pl: " ale zdaje mi się teraz,"
        ru: "но теперь мне кажется,"
      - pl: " że to będzie spis akcjonariuszy tej kolei"
        ru: "что это, должно быть, список акционеров этой железной дороги"
        note: "kolej — железная дорога; będzie — здесь «должно быть»"
      - pl: " i że minie parę tygodni,"
        ru: "и что пройдёт несколько недель,"
      - pl: " nim będziemy mogli pójść tym śladem."
        ru: "прежде чем мы сможем пойти по этому следу."
        note: "iść śladem — идти по следу: творительный"
      - pl: " Nim przyjdą wiadomości z Ameryki…"
        ru: "Пока придут известия из Америки…"
    words: { "bankach": bank, "zdaje": zdawac, "kolei": kolej, "śladem": slad, "wiadomości": wiadomosc, "Ameryki": ameryka }
  - clean: "Holmes wydobył lupę i zaczął nią badać okładkę notesu."
    chunks:
      - pl: "Holmes wydobył lupę"
        ru: "Холмс достал лупу"
        note: "wydobyć — достать, извлечь"
      - pl: " i zaczął nią badać okładkę notesu."
        ru: "и стал изучать ею обложку книжки."
    words: { "wydobył": wydobyc, "zaczął": zaczac, "badać": badac, "okładkę": okladka }
  - clean: "— Tutaj coś jest. Okładka ma dziwny kolor. Co to?"
    chunks:
      - pl: "— Tutaj coś jest."
        ru: "— Здесь что-то есть."
      - pl: " Okładka ma dziwny kolor."
        ru: "У обложки странный цвет."
      - pl: " Co to?"
        ru: "Что это?"
    words: { "Tutaj": tutaj, "jest": byc, "Okładka": okladka, "dziwny": dziwny, "kolor": kolor }
  - clean: "— To krew. Zapomniałem panu powiedzieć, że podniosłem ten zeszyt z ziemi."
    chunks:
      - pl: "— To krew."
        ru: "— Это кровь."
      - pl: " Zapomniałem panu powiedzieć,"
        ru: "Я забыл вам сказать,"
      - pl: " że podniosłem ten zeszyt z ziemi."
        ru: "что поднял эту книжку с земли."
        note: "zeszyt — тетрадь"
    words: { "krew": krew, "Zapomniałem": zapomniec, "panu": pan, "powiedzieć": powiedziec, "podniosłem": podniesc, "ziemi": ziemia }
  - clean: "— Po której stronie była plama?"
    chunks:
      - pl: "— Po której stronie była plama?"
        ru: "— С какой стороны было пятно?"
        note: "po której stronie — с какой стороны"
    words: { "której": ktory, "stronie": strona, "plama": plama }
  - clean: "— Po tej, którą notes upadł na ziemię."
    chunks:
      - pl: "— Po tej, którą notes upadł na ziemię."
        ru: "— С той, которой книжка упала на землю."
    words: { "którą": ktory, "upadł": upasc, "ziemię": ziemia }
  - clean: "— Zatem wynikałoby stąd, że notes upadł na ziemię już po dokonaniu morderstwa."
    chunks:
      - pl: "— Zatem wynikałoby stąd,"
        ru: "— Значит, из этого следовало бы,"
      - pl: " że notes upadł na ziemię już po dokonaniu morderstwa."
        ru: "что книжка упала на землю уже после того, как было совершено убийство."
        note: "po dokonaniu — после совершения: отглагольное существительное"
    words: { "wynikałoby": wynikac, "stąd": stad, "upadł": upasc, "ziemię": ziemia, "morderstwa": morderstwo }
  - clean: "— Zapewne. Brałem to w rachubę i przypuszczałem, że wypadł mordercy podczas szybkiej ucieczki. Leżał zaraz przy drzwiach."
    chunks:
      - pl: "— Zapewne."
        ru: "— Вероятно."
      - pl: " Brałem to w rachubę"
        ru: "Я принимал это в расчёт"
        note: "brać w rachubę — принимать в расчёт"
      - pl: " i przypuszczałem, że wypadł mordercy podczas szybkiej ucieczki."
        ru: "и предполагал, что она выпала у убийцы во время поспешного бегства."
        note: "wypaść komuś — выпасть у кого-л.: дательный (mordercy)"
      - pl: " Leżał zaraz przy drzwiach."
        ru: "Она лежала у самой двери."
        note: "leżał — notes мужского рода"
    words: { "przypuszczałem": przypuszczac, "wypadł": wypasc, "mordercy": morderca, "szybkiej": szybki, "ucieczki": ucieczka, "Leżał": lezec }
  - clean: "— Przy zmarłym i w chałupie nie znaleziono żadnych papierów wartościowych?"
    chunks:
      - pl: "— Przy zmarłym i w chałupie"
        ru: "— При покойном и в хижине"
        note: "zmarły — покойный, умерший"
      - pl: " nie znaleziono żadnych papierów wartościowych?"
        ru: "не нашли никаких ценных бумаг?"
    words: { "zmarłym": zmarly, "chałupie": chalupa, "znaleziono": znalezc, "żadnych": zaden, "papierów": papier, "wartościowych": wartosciowy }
  - clean: "— Nie."
    chunks:
      - pl: "— Nie."
        ru: "— Нет."
  - clean: "— A u niego w domu nie ma nic?"
    chunks:
      - pl: "— A u niego w domu nie ma nic?"
        ru: "— А у него дома ничего нет?"
    words: { "domu": dom }
  - clean: "— O ile wiem, nic."
    chunks:
      - pl: "— O ile wiem, nic."
        ru: "— Насколько я знаю, ничего."
    words: { "wiem": wiedziec }
  - clean: "— Czy ma pan jakieś podstawy do przypuszczania, że mamy tu do czynienia z morderstwem dla rabunku?"
    chunks:
      - pl: "— Czy ma pan jakieś podstawy do przypuszczania,"
        ru: "— Есть ли у вас какие-нибудь основания предполагать,"
        note: "podstawa do czegoś — основание для чего-л."
      - pl: " że mamy tu do czynienia z morderstwem dla rabunku?"
        ru: "что мы имеем здесь дело с убийством с целью грабежа?"
