paragraphs:
  - clean: "Hopkins wyciągnął z kieszeni notatnik oprawny w szare okładki. Zewnętrzna strona była bardzo zniszczona przez używanie. Na pierwszej stronie widniały inicjały „J. H. N.” i data „1883”."
    en: "Stanley Hopkins drew from his pocket a drab-covered notebook. The outside was rough and worn, the leaves discoloured. On the first page were written the initials “J.H.N.” and the date “1883.”"
    draft: true
    chunks:
      - pl: "Hopkins wyciągnął z kieszeni notatnik oprawny w szare okładki."
        ru: "Хопкинс вытащил из кармана записную книжку в серой обложке."
        note: "notatnik — записная книжка; oprawny w coś — переплетённый во что-л."
      - pl: " Zewnętrzna strona była bardzo zniszczona przez używanie."
        ru: "Снаружи она была сильно потрёпана от употребления."
        note: "zniszczony — истрёпанный, испорченный"
      - pl: " Na pierwszej stronie widniały inicjały „J. H. N.” i data „1883”."
        ru: "На первой странице виднелись инициалы «J. H. N.» и дата «1883»."
    words: { "wyciągnął": wyciagnac, "kieszeni": kieszen, "szare": szary, "okładki": okladka, "Zewnętrzna": zewnetrzny, "data": data }
  - clean: "Holmes położył notes przed sobą na stole i zbadał go ze zwykłą drobiazgowością. Hopkins i ja przypatrywaliśmy się tej pracy zza pleców Sherlocka."
    en: "Holmes laid it on the table and examined it in his minute way, while Hopkins and I gazed over each shoulder."
    chunks:
      - pl: "Holmes położył notes przed sobą na stole"
        ru: "Холмс положил книжку перед собой на стол"
        note: "notes — записная книжка, блокнот"
      - pl: " i zbadał go ze zwykłą drobiazgowością."
        ru: "и осмотрел её с обычной своей дотошностью."
        note: "drobiazgowość — дотошность, мелочность"
      - pl: " Hopkins i ja przypatrywaliśmy się tej pracy"
        ru: "Мы с Хопкинсом наблюдали за этой работой"
        note: "Hopkins i ja — «мы с Хопкинсом»: польский называет обоих"
      - pl: " zza pleców Sherlocka."
        ru: "из-за спины Шерлока."
        note: "zza — из-за (откуда): zza pleców"
    words: { "położył": polozyc, "stole": stol, "zbadał": zbadac, "zwykłą": zwykly, "pracy": praca, "pleców": plecy }
  - clean: "Na drugiej stronie były drukowane litery „C. P. R.”, a kilka następnych kartek zapełniono cyframi. Dalej kartka z napisem „Argentine”, dalej „Costa Rica”, trzecia „Sao Paulo”. Po każdej szły kartki z cyframi i znakami."
    en: "On the second page were the printed letters “C.P.R.,” and then came several sheets of numbers. Another heading was “Argentine,” another “Costa Rica,” and another “San Paulo,” each with pages of signs and figures after it."
    chunks:
      - pl: "Na drugiej stronie były drukowane litery „C. P. R.”,"
        ru: "На второй странице были печатные буквы «C. P. R.»,"
      - pl: " a kilka następnych kartek zapełniono cyframi."
        ru: "а несколько следующих листков были заполнены цифрами."
        note: "zapełniono — безличная форма; cyfra — цифра"
      - pl: " Dalej kartka z napisem „Argentine”,"
        ru: "Дальше листок с надписью «Argentine»,"
      - pl: " dalej „Costa Rica”, trzecia „Sao Paulo”."
        ru: "потом «Costa Rica», третий — «Sao Paulo»."
      - pl: " Po każdej szły kartki z cyframi i znakami."
        ru: "За каждым шли листки с цифрами и значками."
        note: "po + местный — после"
    words: { "litery": litera, "następnych": nastepny, "kartek": kartka, "napisem": napis, "znakami": znak }
  - clean: "Holmes skończył oglądać i zwrócił się ku nam."
    chunks:
      - pl: "Holmes skończył oglądać i zwrócił się ku nam."
        ru: "Холмс закончил осмотр и повернулся к нам."
        note: "zwrócić się ku komuś — повернуться к кому-л.; ku — книжное «к»"
    words: { "skończył": skonczyc, "oglądać": ogladac, "zwrócił": zwrocic }
  - clean: "— Jak pan sądzi, co to jest? — spytał Hopkinsa, mierząc go bystrym spojrzeniem."
    en: "“What do you make of these?” asked Holmes."
    chunks:
      - pl: "— Jak pan sądzi, co to jest? —"
        ru: "— Как вы думаете, что это такое? —"
        note: "sądzić — думать, полагать (и «судить»)"
      - pl: " spytał Hopkinsa, mierząc go bystrym spojrzeniem."
        ru: "спросил он Хопкинса, смерив его зорким взглядом."
        note: "mierzyć kogoś spojrzeniem — мерить взглядом; bystry — зоркий, проницательный"
    words: { "sądzi": sadzic, "jest": byc, "mierząc": mierzyc, "bystrym": bystry }
  - clean: "— Zdaje się, że to spis papierów giełdowych. Przypuszczam, że „J. H. N.” są inicjałami ajenta, zaś „C. P. R.” to był zapewne jego klient."
    en: "“They appear to be lists of Stock Exchange securities. I thought that ‘J.H.N.’ were the initials of a broker, and that ‘C.P.R.’ may have been his client.”"
    chunks:
      - pl: "— Zdaje się, że to spis papierów giełdowych."
        ru: "— Кажется, это список биржевых бумаг."
        note: "spis — список; giełda — биржа"
      - pl: " Przypuszczam, że „J. H. N.” są inicjałami ajenta,"
        ru: "Предполагаю, что «J. H. N.» — это инициалы маклера,"
        note: "ajent — старое написание слова agent; здесь «биржевой маклер»"
      - pl: " zaś „C. P. R.” to był zapewne jego klient."
        ru: "а «C. P. R.» был, вероятно, его клиент."
        note: "zapewne — вероятно"
    words: { "Zdaje": zdawac, "papierów": papier, "Przypuszczam": przypuszczac, "klient": klient }
  - clean: "— Niech pan spróbuje podłożyć pod to słowo „Canadian Pacific Railway” — rzekł Holmes."
    en: "“Try Canadian Pacific Railway,” said Holmes."
    chunks:
      - pl: "— Niech pan spróbuje podłożyć pod to słowo „Canadian Pacific Railway” —"
        ru: "— Попробуйте подставить сюда слова «Canadian Pacific Railway», —"
        note: "podłożyć coś pod coś — подставить, подложить"
      - pl: " rzekł Holmes."
        ru: "сказал Холмс."
    words: { "spróbuje": sprobowac, "podłożyć": podlozyc, "słowo": slowo, "rzekł": rzec }
  - clean: "Hopkins zaklął po cichu i trzasnął się kułakiem po udzie."
    en: "Stanley Hopkins swore between his teeth, and struck his thigh with his clenched hand."
    chunks:
      - pl: "Hopkins zaklął po cichu"
        ru: "Хопкинс тихо выругался"
        note: "zakląć — выругаться"
      - pl: " i trzasnął się kułakiem po udzie."
        ru: "и хлопнул себя кулаком по бедру."
        note: "kułak — старое «кулак», сегодня pięść; udo — бедро"
    words: { "udzie": udo }
  - clean: "— Ach, cóż to za osioł był ze mnie! Naturalnie, że to tak, jak pan mówi! Ależ w takim razie pozostaje nam tylko odcyfrować inicjały „J. H. N.”. Kazałem już sobie przynieść stare rejestry giełdowe i badałem je całą noc, lecz w roku 1883 nie mogłem odkryć ajenta giełdowego o nazwisku takim, aby inicjały zgodziły się z nim. A jednak czuję dobrze, jak ważne byłoby to odkrycie. Przyzna pan, panie Holmes, że inicjały te mogą oznaczać nazwisko tego drugiego człowieka, czyli, innymi słowy, mogą nam dać nazwisko zbrodniarza. A jeszcze trzeba zwrócić uwagę, że odkrycie dokumentu, który odnosi się do takiej masy papierów wartościowych, może nam dać ważne wskazówki co do pobudek mordu."
    en: "“What a fool I have been!” he cried. “Of course, it is as you say. Then ‘J.H.N.’ are the only initials we have to solve. I have already examined the old Stock Exchange lists, and I can find no one in 1883, either in the house or among the outside brokers, whose initials correspond with these. Yet I feel that the clue is the most important one that I hold. You will admit, Mr. Holmes, that there is a possibility that these initials are those of the second person who was present—in other words, of the murderer. I would also urge that the introduction into the case of a document relating to large masses of valuable securities gives us for the first time some indication of a motive for the crime.”"
    draft: true
    chunks:
      - pl: "— Ach, cóż to za osioł był ze mnie!"
        ru: "— Ах, какой же я осёл!"
        note: "być osłem — быть ослом; cóż to za — что за"
      - pl: " Naturalnie, że to tak, jak pan mówi!"
        ru: "Разумеется, так оно и есть, как вы говорите!"
      - pl: " Ależ w takim razie"
        ru: "Но в таком случае"
        note: "w takim razie — в таком случае"
      - pl: " pozostaje nam tylko odcyfrować inicjały „J. H. N.”."
        ru: "нам остаётся только разгадать инициалы «J. H. N.»."
        note: "odcyfrować — расшифровать"
      - pl: " Kazałem już sobie przynieść stare rejestry giełdowe"
        ru: "Я уже велел принести мне старые биржевые реестры"
        note: "kazać — велеть; kazać sobie przynieść — велеть принести себе"
      - pl: " i badałem je całą noc,"
        ru: "и изучал их всю ночь,"
        note: "całą noc — всю ночь: винительный времени"
      - pl: " lecz w roku 1883 nie mogłem odkryć ajenta giełdowego"
        ru: "но за 1883 год не смог найти биржевого маклера"
        note: "odkryć — открыть, обнаружить"
      - pl: " o nazwisku takim, aby inicjały zgodziły się z nim."
        ru: "с такой фамилией, с которой совпали бы инициалы."
        note: "zgodzić się z czymś — совпасть, согласоваться"
      - pl: " A jednak czuję dobrze, jak ważne byłoby to odkrycie."
        ru: "И всё же я хорошо понимаю, как важно было бы это открытие."
      - pl: " Przyzna pan, panie Holmes,"
        ru: "Согласитесь, мистер Холмс,"
        note: "przyznać — признать"
      - pl: " że inicjały te mogą oznaczać"
        ru: "что эти инициалы могут означать"
      - pl: " nazwisko tego drugiego człowieka,"
        ru: "фамилию того, второго человека,"
      - pl: " czyli, innymi słowy, mogą nam dać nazwisko zbrodniarza."
        ru: "то есть, другими словами, могут дать нам фамилию преступника."
        note: "czyli — то есть; innymi słowy — другими словами"
      - pl: " A jeszcze trzeba zwrócić uwagę,"
        ru: "А ещё надо обратить внимание,"
      - pl: " że odkrycie dokumentu,"
        ru: "что находка документа,"
      - pl: " który odnosi się do takiej masy papierów wartościowych,"
        ru: "который относится к такой массе ценных бумаг,"
        note: "odnosić się do czegoś — относиться к чему-л.; papiery wartościowe — ценные бумаги"
      - pl: " może nam dać ważne wskazówki co do pobudek mordu."
        ru: "может дать нам важные указания насчёт мотивов убийства."
        note: "pobudka — здесь «побуждение, мотив»; сегодня обычно «подъём, побудка»; mord — убийство"
    words: { "osioł": osiol, "Naturalnie": naturalnie, "pozostaje": pozostawac, "rejestry": rejestr, "wartościowych": wartosciowy }
  - clean: "— Muszę się zgodzić z panem w obu punktach — rzekł Sherlock Holmes. — Przyznaję, że ten notatnik, o którym nie było mowy w protokole, przedstawia sprawę zupełnie inaczej i bardzo zmodyfikował teorię, jaką sobie wyrobiłem o morderstwie. W tej teorii nie ma dla niego miejsca. Czy nie starał się pan dojść, jakie tutaj zanotowano papiery? Przynajmniej niektóre?"
    en: "Sherlock Holmes’s face showed that he was thoroughly taken aback by this new development. “I must admit both your points,” said he. “I confess that this notebook, which did not appear at the inquest, modifies any views which I may have formed. I had come to a theory of the crime in which I can find no place for this. Have you endeavoured to trace any of the securities here mentioned?”"
    draft: true
    chunks:
      - pl: "— Muszę się zgodzić z panem w obu punktach —"
        ru: "— Должен согласиться с вами в обоих пунктах, —"
        note: "zgodzić się z kimś — согласиться с кем-л."
      - pl: " rzekł Sherlock Holmes. —"
        ru: "сказал Шерлок Холмс. —"
      - pl: " Przyznaję, że ten notatnik,"
        ru: "Признаю, что эта записная книжка,"
        note: "notatnik — записная книжка"
      - pl: " o którym nie było mowy w protokole,"
        ru: "о которой в протоколе не было речи,"
        note: "mowa o czymś — речь о чём-л.: o + местный"
      - pl: " przedstawia sprawę zupełnie inaczej"
        ru: "представляет дело совсем в другом свете"
        note: "przedstawiać — представлять, изображать"
      - pl: " i bardzo zmodyfikował teorię,"
        ru: "и сильно изменила теорию,"
      - pl: " jaką sobie wyrobiłem o morderstwie."
        ru: "которую я составил себе об убийстве."
        note: "wyrobić sobie zdanie/teorię — составить себе мнение"
      - pl: " W tej teorii nie ma dla niego miejsca."
        ru: "В этой теории для неё нет места."
        note: "nie ma miejsca dla kogoś — нет места для кого-л.: родительный"
      - pl: " Czy nie starał się pan dojść,"
        ru: "Не пытались ли вы выяснить,"
        note: "dojść — здесь «доискаться, выяснить»"
      - pl: " jakie tutaj zanotowano papiery?"
        ru: "какие здесь записаны бумаги?"
      - pl: " Przynajmniej niektóre?"
        ru: "Хотя бы некоторые?"
    words: { "rzekł": rzec, "Przyznaję": przyznawac, "protokole": protokol, "przedstawia": przedstawiac, "teorię": teoria, "zanotowano": zanotowac }
  - clean: "— Zarządziłem poszukiwania w bankach, ale obawiam się, że pełny spis akcjonariuszy tych południowoamerykańskich przedsiębiorstw znajduje się w Ameryce Południowej i że minie parę tygodni, nim będziemy mogli pójść tym śladem. Nim przyjdą wiadomości z Ameryki…"
    en: "“Inquiries are now being made at the offices, but I fear that the complete register of the stockholders of these South American concerns is in South America, and that some weeks must elapse before we can trace the shares.”"
    draft: true
    chunks:
      - pl: "— Zarządziłem poszukiwania w bankach,"
        ru: "— Я распорядился навести справки в банках,"
        note: "zarządzić — распорядиться"
      - pl: " ale obawiam się,"
        ru: "но боюсь,"
        note: "obawiać się — бояться, опасаться"
      - pl: " że pełny spis akcjonariuszy tych południowoamerykańskich przedsiębiorstw"
        ru: "что полный список акционеров этих южноамериканских компаний"
        note: "akcjonariusz — акционер; przedsiębiorstwo — предприятие"
      - pl: " znajduje się w Ameryce Południowej"
        ru: "находится в Южной Америке"
      - pl: " i że minie parę tygodni,"
        ru: "и что пройдёт несколько недель,"
      - pl: " nim będziemy mogli pójść tym śladem."
        ru: "прежде чем мы сможем пойти по этому следу."
        note: "iść śladem — идти по следу: творительный"
      - pl: " Nim przyjdą wiadomości z Ameryki…"
        ru: "Пока придут известия из Америки…"
    words: { "bankach": bank, "obawiam": obawiac, "znajduje": znajdowac, "Ameryce": ameryka, "Południowej": poludniowy, "śladem": slad }
  - clean: "Holmes wydobył lupę i zaczął nią badać okładkę notesu."
    en: "Holmes had been examining the cover of the notebook with his magnifying lens."
    chunks:
      - pl: "Holmes wydobył lupę"
