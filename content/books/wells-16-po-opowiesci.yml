  - clean: "Podróżnik w Czasie przyłożył rękę do głowy. Mówił jak ktoś, kto próbuje uchwycić umykającą mu myśl. — Włożyła mi je do kieszeni Weena, kiedy podróżowałem w Czasie. Rozejrzał się po pokoju. — Niech mnie diabli, jeśli to wszystko nie ucieka. Ten pokój i wy, i atmosfera codzienności to za wiele dla mojej pamięci. Czy naprawdę zrobiłem kiedyś Wehikuł Czasu albo model Wehikułu Czasu? A może to wszystko tylko sen? Mówią, że życie jest snem, czasem bardzo nędznym snem — ale nie zniosę kolejnego, który do niczego nie pasuje. To szaleństwo. A skąd ten sen się wziął?… Muszę spojrzeć na tę maszynę. Jeśli w ogóle istnieje!"
    en: "The Time Traveller put his hand to his head. He spoke like one who was trying to keep hold of an idea that eluded him. “They were put into my pocket by Weena, when I travelled into Time.” He stared round the room. “I’m damned if it isn’t all going. This room and you and the atmosphere of every day is too much for my memory. Did I ever make a Time Machine, or a model of a Time Machine? Or is it all only a dream? They say life is a dream, a precious poor dream at times—but I can’t stand another that won’t fit. It’s madness. And where did the dream come from? … I must look at that machine. If there is one!”"
    draft: true
    chunks:
      - pl: "Podróżnik w Czasie przyłożył rękę do głowy."
        ru: "Путешественник во Времени поднёс руку к голове."
      - pl: " Mówił jak ktoś, kto próbuje uchwycić umykającą mu myśl."
