      - pl: " Czy naprawdę zrobiłem kiedyś Wehikuł Czasu albo model Wehikułu Czasu?"
        ru: "Неужели я и вправду сделал когда-то Машину Времени или модель Машины Времени?"
      - pl: " A może to wszystko tylko sen?"
        ru: "Или всё это только сон?"
      - pl: " Mówią, że życie jest snem, czasem bardzo nędznym snem — ale nie zniosę kolejnego, który do niczego nie pasuje."
        ru: "Говорят, жизнь — сон, порой довольно жалкий сон, — но я не вынесу ещё одного, который ни к чему не подходит."
