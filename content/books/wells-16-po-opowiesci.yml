      - pl: " — Włożyła mi je do kieszeni Weena, kiedy podróżowałem w Czasie."
        ru: "— Мне положила их в карман Уина, когда я путешествовал во Времени."
      - pl: " Rozejrzał się po pokoju."
        ru: "Он оглядел комнату."
      - pl: " — Niech mnie diabli, jeśli to wszystko nie ucieka."
        ru: "— Будь я проклят, если всё это не ускользает."
      - pl: " Ten pokój i wy, i atmosfera codzienności to za wiele dla mojej pamięci."
