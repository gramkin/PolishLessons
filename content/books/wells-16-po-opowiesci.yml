  - clean: "Podróżnik w Czasie zwrócił się do nas. — Gdzie są zapałki? — zapytał. Zapalił jedną i mówił, pykając fajkę: — Prawdę mówiąc… sam ledwie w to wierzę… A jednak…"
    en: "The Time Traveller turned to us. “Where are the matches?” he said. He lit one and spoke over his pipe, puffing. “To tell you the truth... I hardly believe it myself..... And yet...”"
    draft: true
    chunks:
