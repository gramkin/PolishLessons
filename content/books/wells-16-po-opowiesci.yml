  - clean: "Jego wzrok padł z niemym pytaniem na zwiędłe białe kwiaty na stoliku. Potem odwrócił rękę, w której trzymał fajkę, i zobaczyłem, że patrzy na na wpół zagojone blizny na knykciach."
    en: "His eye fell with a mute inquiry upon the withered white flowers upon the little table. Then he turned over the hand holding his pipe, and I saw he was looking at some half-healed scars on his knuckles."
    draft: true
    chunks:
