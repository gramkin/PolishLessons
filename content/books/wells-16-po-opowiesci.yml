  - clean: "Szybko chwycił lampę i poniósł ją, płonącą czerwono, przez drzwi na korytarz. Poszliśmy za nim. Tam, w migotliwym świetle lampy, stała rzeczywiście maszyna, przysadzista, brzydka i krzywa, rzecz z mosiądzu, hebanu, kości słoniowej i przezroczystego, migocącego kwarcu. Solidna w dotyku — bo wyciągnąłem rękę i dotknąłem jej poręczy — z brązowymi plamami i smugami na kości słoniowej, z kawałkami trawy i mchu na dolnych częściach i z jedną poręczą wygiętą krzywo."
    en: "He caught up the lamp swiftly, and carried it, flaring red, through the door into the corridor. We followed him. There in the flickering light of the lamp was the machine sure enough, squat, ugly, and askew, a thing of brass, ebony, ivory, and translucent glimmering quartz. Solid to the touch—for I put out my hand and felt the rail of it—and with brown spots and smears upon the ivory, and bits of grass and moss upon the lower parts, and one rail bent awry."
    draft: true
    chunks:
      - pl: "Szybko chwycił lampę i poniósł ją, płonącą czerwono, przez drzwi na korytarz."
        ru: "Он быстро схватил лампу и понёс её, пылающую красным, через дверь в коридор."
      - pl: " Poszliśmy za nim."
        ru: "Мы пошли за ним."
      - pl: " Tam, w migotliwym świetle lampy, stała rzeczywiście maszyna, przysadzista, brzydka i krzywa,"
        ru: "Там, в мерцающем свете лампы, действительно стояла машина, приземистая, некрасивая и кривая,"
        note: "przysadzisty — приземистый"
      - pl: " rzecz z mosiądzu, hebanu, kości słoniowej i przezroczystego, migocącego kwarcu."
        ru: "вещь из латуни, чёрного дерева, слоновой кости и прозрачного мерцающего кварца."
        note: "heban — чёрное дерево"
      - pl: " Solidna w dotyku — bo wyciągnąłem rękę i dotknąłem jej poręczy —"
        ru: "Твёрдая на ощупь — я протянул руку и потрогал её поручень, —"
      - pl: " z brązowymi plamami i smugami na kości słoniowej, z kawałkami trawy i mchu na dolnych częściach i z jedną poręczą wygiętą krzywo."
