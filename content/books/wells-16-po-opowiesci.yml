  - clean: "Redaktor wstał z westchnieniem. — Jaka szkoda, że nie jesteś pisarzem! — powiedział, kładąc rękę na ramieniu Podróżnika w Czasie."
    en: "The Editor stood up with a sigh. “What a pity it is you’re not a writer of stories!” he said, putting his hand on the Time Traveller’s shoulder."
    draft: true
    chunks:
