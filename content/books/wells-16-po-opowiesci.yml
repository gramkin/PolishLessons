paragraphs:
  - clean: "— Wiem — powiedział po chwili — że wszystko to będzie dla was zupełnie niewiarygodne, ale dla mnie jedyną niewiarygodną rzeczą jest to, że jestem tu dziś wieczorem, w tym starym znajomym pokoju, patrzę w wasze przyjazne twarze i opowiadam wam te dziwne przygody. Spojrzał na Lekarza. — Nie. Nie mogę oczekiwać, że w to uwierzycie. Weźcie to za kłamstwo — albo za proroctwo. Powiedzcie, że mi się to przyśniło w warsztacie. Uznajcie, że rozmyślałem nad losami naszej rasy, aż wylęgłem tę fikcję. Traktujcie moje zapewnienie o jej prawdziwości jako zwykły chwyt artystyczny, mający uczynić ją ciekawszą. A biorąc to jako opowieść, co o niej sądzicie?"
    en: "“I know,” he said, after a pause, “that all this will be absolutely incredible to you, but to me the one incredible thing is that I am here tonight in this old familiar room looking into your friendly faces and telling you these strange adventures.” He looked at the Medical Man. “No. I cannot expect you to believe it. Take it as a lie—or a prophecy. Say I dreamed it in the workshop. Consider I have been speculating upon the destinies of our race, until I have hatched this fiction. Treat my assertion of its truth as a mere stroke of art to enhance its interest. And taking it as a story, what do you think of it?”"
    draft: true
    chunks:
      - pl: "— Wiem — powiedział po chwili — że wszystko to będzie dla was zupełnie niewiarygodne,"
        ru: "— Я знаю, — сказал он после паузы, — что всё это покажется вам совершенно невероятным,"
      - pl: " ale dla mnie jedyną niewiarygodną rzeczą jest to, że jestem tu dziś wieczorem, w tym starym znajomym pokoju, patrzę w wasze przyjazne twarze i opowiadam wam te dziwne przygody."
        ru: "но для меня единственное невероятное — то, что я сегодня вечером здесь, в этой старой знакомой комнате, смотрю в ваши дружеские лица и рассказываю вам эти странные приключения."
      - pl: " Spojrzał na Lekarza."
        ru: "Он взглянул на Врача."
      - pl: " — Nie. Nie mogę oczekiwać, że w to uwierzycie. Weźcie to za kłamstwo — albo za proroctwo."
        ru: "— Нет. Я не могу ожидать, что вы поверите. Примите это за ложь — или за пророчество."
        note: "proroctwo — пророчество"
      - pl: " Powiedzcie, że mi się to przyśniło w warsztacie."
        ru: "Скажите, что мне это приснилось в мастерской."
        note: "przyśnić się — присниться"
      - pl: " Uznajcie, że rozmyślałem nad losami naszej rasy, aż wylęgłem tę fikcję."
        ru: "Считайте, что я размышлял о судьбах нашего рода, пока не высидел этот вымысел."
        note: "wylęgnąć — высидеть, вывести"
      - pl: " Traktujcie moje zapewnienie o jej prawdziwości jako zwykły chwyt artystyczny, mający uczynić ją ciekawszą."
        ru: "Считайте мои уверения в его правдивости простым художественным приёмом для пущей занимательности."
        note: "chwyt — приём"
      - pl: " A biorąc to jako opowieść, co o niej sądzicie?"
        ru: "А если принять это как рассказ — что вы о нём думаете?"
    words: { "niewiarygodne": niewiarygodny, "przyjazne": przyjazny, "przygody": przygoda, "warsztacie": warsztat, "rasy": rasa, "opowieść": opowiesc }
  - clean: "Wziął fajkę i zaczął, w swój dawny, zwykły sposób, nerwowo stukać nią o pręty kraty kominka. Zapadła chwilowa cisza. Potem krzesła zaczęły skrzypieć, a buty szurać po dywanie. Oderwałem wzrok od twarzy Podróżnika w Czasie i rozejrzałem się po jego słuchaczach. Siedzieli w ciemności, a przed oczami pływały im małe kolorowe plamki. Lekarz zdawał się pochłonięty kontemplowaniem naszego gospodarza. Redaktor wpatrywał się uporczywie w koniec swojego cygara — szóstego. Dziennikarz szukał po omacku zegarka. Pozostali, o ile pamiętam, siedzieli bez ruchu."
    en: "He took up his pipe, and began, in his old accustomed manner, to tap with it nervously upon the bars of the grate. There was a momentary stillness. Then chairs began to creak and shoes to scrape upon the carpet. I took my eyes off the Time Traveller’s face, and looked round at his audience. They were in the dark, and little spots of colour swam before them. The Medical Man seemed absorbed in the contemplation of our host. The Editor was looking hard at the end of his cigar—the sixth. The Journalist fumbled for his watch. The others, as far as I remember, were motionless."
    draft: true
    chunks:
      - pl: "Wziął fajkę i zaczął, w swój dawny, zwykły sposób, nerwowo stukać nią o pręty kraty kominka."
        ru: "Он взял трубку и принялся по старой своей привычке нервно постукивать ею по прутьям каминной решётки."
        note: "krata — решётка"
      - pl: " Zapadła chwilowa cisza."
        ru: "Наступила мгновенная тишина."
      - pl: " Potem krzesła zaczęły skrzypieć, a buty szurać po dywanie."
        ru: "Потом заскрипели стулья, зашаркали по ковру башмаки."
        note: "skrzypieć — скрипеть"
      - pl: " Oderwałem wzrok od twarzy Podróżnika w Czasie i rozejrzałem się po jego słuchaczach."
        ru: "Я оторвал взгляд от лица Путешественника во Времени и оглядел его слушателей."
      - pl: " Siedzieli w ciemności, a przed oczami pływały im małe kolorowe plamki."
        ru: "Они сидели в темноте, и перед глазами у них плавали маленькие цветные пятна."
      - pl: " Lekarz zdawał się pochłonięty kontemplowaniem naszego gospodarza."
        ru: "Врач, казалось, был поглощён созерцанием нашего хозяина."
      - pl: " Redaktor wpatrywał się uporczywie w koniec swojego cygara — szóstego."
