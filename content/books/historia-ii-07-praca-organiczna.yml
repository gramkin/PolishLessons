  - clean: "W 1887 roku w Warszawie ukazała się niewielka książeczka podpisana pseudonimem Doktor Esperanto, czyli „mający nadzieję”. Jej autorem był młody okulista Ludwik Zamenhof, Żyd urodzony w Białymstoku. Pierwsze wydanie podręcznika ukazało się po rosyjsku, a wkrótce potem także po polsku, po niemiecku i po francusku. Zamenhof dorastał w mieście, w którym mieszkali Polacy, Żydzi, Rosjanie, Niemcy i Białorusini, i widział, jak różnice językowe rodzą nieufność i wrogość. Postanowił stworzyć prosty, neutralny język, którego każdy mógłby łatwo się nauczyć i który pomógłby ludziom się porozumieć. Język ten nazwano od jego pseudonimu esperanto. Szybko zdobył zwolenników na całym świecie, także w Rosji, gdzie popierał go między innymi Lew Tołstoj. Dziś esperanto mówi kilkaset tysięcy ludzi, a ulice imienia Zamenhofa można znaleźć w wielu miastach świata. Historia Zamenhofa pokazuje, że w wielonarodowym świecie ziem polskich rodziły się nie tylko konflikty, ale też marzenia o porozumieniu."
