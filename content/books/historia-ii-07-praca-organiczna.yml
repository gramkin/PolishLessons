paragraphs:
  - clean: "Po upadku powstania styczniowego w Warszawie dorastało nowe pokolenie, które spojrzało na świat inaczej niż ich ojcowie. Młodzi publicyści, pisarze i naukowcy uznali, że romantyczne marzenia o zbrojnym zrywie przyniosły narodowi tylko klęski. Zamiast umierać za ojczyznę, trzeba dla niej pracować. Zamiast poezji potrzebna jest nauka, zamiast szabli wiedza, a zamiast marzeń praca. Inspirowali się filozofią pozytywizmu, której twórcą był Francuz Auguste Comte, i myślą angielskich liberałów. Dlatego nazwano ich pozytywistami warszawskimi."
    draft: true
    chunks:
      - pl: "Po upadku powstania styczniowego w Warszawie dorastało nowe pokolenie, które spojrzało na świat inaczej niż ich ojcowie."
        ru: "После падения Январского восстания в Варшаве подрастало новое поколение, которое взглянуло на мир иначе, чем их отцы."
      - pl: " Młodzi publicyści, pisarze i naukowcy uznali, że romantyczne marzenia o zbrojnym zrywie przyniosły narodowi tylko klęski."
        ru: "Молодые публицисты, писатели и учёные решили, что романтические мечты о вооружённом восстании принесли народу лишь поражения."
      - pl: " Zamiast umierać za ojczyznę, trzeba dla niej pracować."
        ru: "Вместо того чтобы умирать за родину, нужно для неё трудиться."
      - pl: " Zamiast poezji potrzebna jest nauka, zamiast szabli wiedza, a zamiast marzeń praca."
        ru: "Вместо поэзии нужна наука, вместо сабли — знание, а вместо мечтаний — работа."
      - pl: " Inspirowali się filozofią pozytywizmu, której twórcą był Francuz Auguste Comte, i myślą angielskich liberałów."
        ru: "Они вдохновлялись философией позитивизма, основателем которой был француз Огюст Конт, и мыслью английских либералов."
      - pl: " Dlatego nazwano ich pozytywistami warszawskimi."
        ru: "Поэтому их назвали варшавскими позитивистами."
