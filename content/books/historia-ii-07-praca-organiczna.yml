  - clean: "Pozytywiści głosili hasło pracy organicznej. Społeczeństwo porównywali do żywego organizmu, w którym wszystkie części muszą działać razem, żeby całość była zdrowa i silna. Trzeba więc rozwijać przemysł, handel i rolnictwo, budować szkoły i szpitale, kształcić inżynierów, lekarzy i nauczycieli. Drugim hasłem była praca u podstaw, czyli oświata ludu: uczenie chłopów i robotników czytania, pisania, higieny i nowoczesnego rolnictwa. Pozytywiści walczyli też o równouprawnienie kobiet i Żydów, uważając, że naród jest silny tylko wtedy, gdy wszyscy jego członkowie mają szansę się rozwijać."
    draft: true
    chunks:
      - pl: "Pozytywiści głosili hasło pracy organicznej."
        ru: "Позитивисты провозглашали лозунг органической работы."
      - pl: " Społeczeństwo porównywali do żywego organizmu, w którym wszystkie części muszą działać razem, żeby całość była zdrowa i silna."
        ru: "Общество они сравнивали с живым организмом, в котором все части должны работать вместе, чтобы целое было здоровым и сильным."
      - pl: " Trzeba więc rozwijać przemysł, handel i rolnictwo, budować szkoły i szpitale, kształcić inżynierów, lekarzy i nauczycieli."
        ru: "Значит, нужно развивать промышленность, торговлю и сельское хозяйство, строить школы и больницы, готовить инженеров, врачей и учителей."
      - pl: " Drugim hasłem była praca u podstaw, czyli oświata ludu: uczenie chłopów i robotników czytania, pisania, higieny i nowoczesnego rolnictwa."
        ru: "Вторым лозунгом была «работа у основ», то есть просвещение народа: обучение крестьян и рабочих чтению, письму, гигиене и современному земледелию."
        note: "higiena — гигиена"
      - pl: " Pozytywiści walczyli też o równouprawnienie kobiet i Żydów, uważając, że naród jest silny tylko wtedy, gdy wszyscy jego członkowie mają szansę się rozwijać."
        ru: "Позитивисты боролись и за равноправие женщин и евреев, считая, что народ силён лишь тогда, когда у всех его членов есть возможность развиваться."
        note: "równouprawnienie — равноправие"
    words: { "hasło": haslo, "Społeczeństwo": spoleczenstwo, "organizmu": organizm, "całość": calosc, "przemysł": przemysl, "handel": handel, "budować": budowac, "kształcić": ksztalcic, "inżynierów": inzynier, "hasłem": haslo, "ludu": lud, "chłopów": chlop, "robotników": robotnik, "nowoczesnego": nowoczesny, "naród": narod }
  - clean: "Najbardziej wojowniczym z pozytywistów był publicysta Aleksander Świętochowski. W 1871 roku opublikował artykuł „My i wy”, w którym w imieniu młodego pokolenia ostro zaatakował starszych, romantycznych i konserwatywnych publicystów. Zarzucał im, że żyją przeszłością, nie rozumieją nowoczesnego świata i boją się nauki. Starsi odpowiadali, że młodzi są bezduszni, materialistyczni i gotowi zapomnieć o narodowych ideałach. Spór toczył się na łamach gazet i czasopism, z których najważniejszy był „Przegląd Tygodniowy”. Pozytywiści szybko zdobyli przewagę, bo ich program odpowiadał potrzebom czasu."
    draft: true
    chunks:
      - pl: "Najbardziej wojowniczym z pozytywistów był publicysta Aleksander Świętochowski."
        ru: "Самым воинственным из позитивистов был публицист Александр Свентоховский."
        note: "wojowniczy — воинственный"
      - pl: " W 1871 roku opublikował artykuł „My i wy”, w którym w imieniu młodego pokolenia ostro zaatakował starszych, romantycznych i konserwatywnych publicystów."
        ru: "В 1871 году он опубликовал статью «Мы и вы», в которой от имени молодого поколения резко напал на старших, романтических и консервативных публицистов."
      - pl: " Zarzucał im, że żyją przeszłością, nie rozumieją nowoczesnego świata i boją się nauki."
        ru: "Он упрекал их в том, что они живут прошлым, не понимают современного мира и боятся науки."
      - pl: " Starsi odpowiadali, że młodzi są bezduszni, materialistyczni i gotowi zapomnieć o narodowych ideałach."
        ru: "Старшие отвечали, что молодые бездушны, материалистичны и готовы забыть о национальных идеалах."
        note: "bezduszny — бездушный"
      - pl: " Spór toczył się na łamach gazet i czasopism, z których najważniejszy był „Przegląd Tygodniowy”."
        ru: "Спор шёл на страницах газет и журналов, важнейшим из которых был «Пшеглёнд Тыгодневы»."
        note: "łamy — страницы (газеты)"
      - pl: " Pozytywiści szybko zdobyli przewagę, bo ich program odpowiadał potrzebom czasu."
        ru: "Позитивисты быстро взяли верх, потому что их программа отвечала потребностям времени."
    words: { "nowoczesnego": nowoczesny, "artykuł": artykul, "pokolenia": pokolenie, "romantycznych": romantyczny, "narodowych": narodowy, "ideałach": ideal, "toczył": toczyc, "przewagę": przewaga }
  - clean: "Pozytywiści nie mówili otwarcie o niepodległości, bo cenzura by na to nie pozwoliła, a oni sami uważali ją za sprawę odległej przyszłości. Wierzyli jednak, że silny, wykształcony i bogaty naród przetrwa każdą niewolę, a kiedyś odzyska wolność. Krytycy zarzucali im, że ich program prowadzi do ugody z zaborcą. Rzeczywiście, część konserwatystów, zwłaszcza bogatych ziemian i przemysłowców, głosiła lojalizm wobec cara w zamian za spokój i możliwość robienia interesów. Granica między pracą organiczną a uległością była czasem bardzo cienka."
    draft: true
    chunks:
      - pl: "Pozytywiści nie mówili otwarcie o niepodległości, bo cenzura by na to nie pozwoliła, a oni sami uważali ją za sprawę odległej przyszłości."
        ru: "Позитивисты не говорили открыто о независимости, потому что цензура бы этого не позволила, а сами они считали её делом далёкого будущего."
        note: "odległy — далёкий"
      - pl: " Wierzyli jednak, że silny, wykształcony i bogaty naród przetrwa każdą niewolę, a kiedyś odzyska wolność."
        ru: "Но они верили, что сильный, образованный и богатый народ переживёт любую неволю и когда-нибудь вернёт себе свободу."
      - pl: " Krytycy zarzucali im, że ich program prowadzi do ugody z zaborcą."
        ru: "Критики упрекали их в том, что их программа ведёт к соглашательству с захватчиком."
        note: "ugoda — соглашение, здесь «соглашательство»"
      - pl: " Rzeczywiście, część konserwatystów, zwłaszcza bogatych ziemian i przemysłowców, głosiła lojalizm wobec cara w zamian za spokój i możliwość robienia interesów."
        ru: "Действительно, часть консерваторов, особенно богатых землевладельцев и промышленников, проповедовала лояльность царю в обмен на спокойствие и возможность вести дела."
        note: "lojalizm — лоялизм"
      - pl: " Granica między pracą organiczną a uległością była czasem bardzo cienka."
        ru: "Граница между органической работой и покорностью порой была очень тонкой."
        note: "cienki — тонкий"
    words: { "naród": narod, "odległej": odlegly, "wykształcony": wyksztalcic, "ugody": ugoda, "Rzeczywiście": rzeczywiscie, "cara": car, "cienka": cienki }
  - clean: "Największym pisarzem tej epoki był Bolesław Prus, którego prawdziwe nazwisko brzmiało Aleksander Głowacki. Jako szesnastoletni chłopiec walczył w powstaniu styczniowym, został ciężko ranny i trafił do więzienia. Potem studiował matematykę i fizykę, ale musiał przerwać studia z braku pieniędzy. Przez czterdzieści lat pisał do warszawskich gazet felietony, nazywane kronikami, w których opisywał życie miasta, jego problemy i ludzi. Był przekonanym pozytywistą, ale nie fanatykiem, i miał ogromne poczucie humoru. Pisał też krótkie opowiadania, nowele, o biednych ludziach, dzieciach, starcach i zwierzętach, pełne współczucia i ciepła. Kilka z nich czytelnik znajdzie w bibliotece tej strony."
    draft: true
    chunks:
      - pl: "Największym pisarzem tej epoki był Bolesław Prus, którego prawdziwe nazwisko brzmiało Aleksander Głowacki."
        ru: "Величайшим писателем этой эпохи был Болеслав Прус, настоящее имя которого — Александр Гловацкий."
      - pl: " Jako szesnastoletni chłopiec walczył w powstaniu styczniowym, został ciężko ranny i trafił do więzienia."
        ru: "Шестнадцатилетним юношей он сражался в Январском восстании, был тяжело ранен и попал в тюрьму."
      - pl: " Potem studiował matematykę i fizykę, ale musiał przerwać studia z braku pieniędzy."
        ru: "Потом он изучал математику и физику, но был вынужден бросить учёбу из-за нехватки денег."
      - pl: " Przez czterdzieści lat pisał do warszawskich gazet felietony, nazywane kronikami, w których opisywał życie miasta, jego problemy i ludzi."
        ru: "Сорок лет он писал для варшавских газет фельетоны, называемые хрониками, в которых описывал жизнь города, его проблемы и людей."
        note: "felieton — фельетон"
      - pl: " Był przekonanym pozytywistą, ale nie fanatykiem, i miał ogromne poczucie humoru."
        ru: "Он был убеждённым позитивистом, но не фанатиком, и обладал огромным чувством юмора."
      - pl: " Pisał też krótkie opowiadania, nowele, o biednych ludziach, dzieciach, starcach i zwierzętach, pełne współczucia i ciepła."
        ru: "Он писал и короткие рассказы, новеллы, о бедных людях, детях, стариках и животных, полные сочувствия и тепла."
      - pl: " Kilka z nich czytelnik znajdzie w bibliotece tej strony."
        ru: "Несколько из них читатель найдёт в библиотеке этого сайта."
    words: { "pisarzem": pisarz, "ciężko": ciezko, "studiował": studiowac, "matematykę": matematyka, "fizykę": fizyka, "czterdzieści": czterdziesci, "humoru": humor, "starcach": starzec, "bibliotece": biblioteka }
  - clean: "Najwybitniejszą powieścią Prusa jest „Lalka”, wydana w 1890 roku. Jej bohater, Stanisław Wokulski, jest kupcem, który dorobił się majątku na dostawach dla armii rosyjskiej w czasie wojny z Turcją. Zakochuje się w pięknej arystokratce, Izabeli Łęckiej, która gardzi nim, bo nie jest szlachcicem. Wokulski jest człowiekiem nowoczesnym, przedsiębiorczym i ciekawym nauki, ale jednocześnie romantykiem, który szuka wielkiej miłości i wielkiego celu. Powieść jest wspaniałą panoramą Warszawy lat siedemdziesiątych XIX wieku, z jej arystokracją, mieszczaństwem, kupcami żydowskimi, studentami i biedotą. Do dziś można spacerować po Warszawie śladami bohaterów „Lalki”, a na Krakowskim Przedmieściu jedna z kamienic ma tablicę, która przypomina, że tam mieszkał Wokulski."
    draft: true
    chunks:
      - pl: "Najwybitniejszą powieścią Prusa jest „Lalka”, wydana w 1890 roku."
        ru: "Самый выдающийся роман Пруса — «Кукла», изданная в 1890 году."
      - pl: " Jej bohater, Stanisław Wokulski, jest kupcem, który dorobił się majątku na dostawach dla armii rosyjskiej w czasie wojny z Turcją."
        ru: "Её герой, Станислав Вокульский, — купец, разбогатевший на поставках для русской армии во время войны с Турцией."
        note: "dorobić się — разбогатеть; dostawa — поставка"
      - pl: " Zakochuje się w pięknej arystokratce, Izabeli Łęckiej, która gardzi nim, bo nie jest szlachcicem."
        ru: "Он влюбляется в красивую аристократку, Изабеллу Ленцкую, которая презирает его, потому что он не шляхтич."
        note: "gardzić — презирать"
      - pl: " Wokulski jest człowiekiem nowoczesnym, przedsiębiorczym i ciekawym nauki, ale jednocześnie romantykiem, który szuka wielkiej miłości i wielkiego celu."
        ru: "Вокульский — человек современный, предприимчивый и интересующийся наукой, но одновременно романтик, ищущий большой любви и большой цели."
      - pl: " Powieść jest wspaniałą panoramą Warszawy lat siedemdziesiątych XIX wieku, z jej arystokracją, mieszczaństwem, kupcami żydowskimi, studentami i biedotą."
        ru: "Роман — великолепная панорама Варшавы семидесятых годов XIX века, с её аристократией, мещанством, еврейскими купцами, студентами и беднотой."
        note: "biedota — беднота"
      - pl: " Do dziś można spacerować po Warszawie śladami bohaterów „Lalki”, a na Krakowskim Przedmieściu jedna z kamienic ma tablicę, która przypomina, że tam mieszkał Wokulski."
        ru: "До сих пор можно гулять по Варшаве по следам героев «Куклы», а на Краковском Предместье на одном из домов висит табличка, напоминающая, что там жил Вокульский."
    words: { "Najwybitniejszą": wybitny, "powieścią": powiesc-noun, "kupcem": kupiec, "majątku": majatek, "dostawach": dostawa, "rosyjskiej": rosyjski, "nowoczesnym": nowoczesny, "jednocześnie": jednoczesnie, "kupcami": kupiec, "żydowskimi": zydowski, "studentami": student, "tablicę": tablica }
  - clean: "Drugą wielką pisarką epoki była Eliza Orzeszkowa, która mieszkała w Grodnie na Litwie. Pochodziła z zamożnej rodziny ziemiańskiej, ale po powstaniu jej majątek skonfiskowano, a mąż został zesłany na Syberię. Orzeszkowa musiała sama zarabiać na życie i dlatego dobrze rozumiała sytuację kobiet, które nie miały wykształcenia ani zawodu. W powieści „Marta” opisała losy wdowy, która po śmierci męża nie potrafi znaleźć pracy i umiera w nędzy. Pisała też o Żydach, z sympatią i znajomością ich życia, a w powieści „Meir Ezofowicz” przedstawiła młodego Żyda, który buntuje się przeciwko fanatyzmowi swojej społeczności."
