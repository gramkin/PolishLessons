        ru: "Она происходила из зажиточной помещичьей семьи, но после восстания её имение конфисковали, а мужа сослали в Сибирь."
      - pl: " Orzeszkowa musiała sama zarabiać na życie i dlatego dobrze rozumiała sytuację kobiet, które nie miały wykształcenia ani zawodu."
        ru: "Ожешко пришлось самой зарабатывать на жизнь, и поэтому она хорошо понимала положение женщин, у которых не было ни образования, ни профессии."
      - pl: " W powieści „Marta” opisała losy wdowy, która po śmierci męża nie potrafi znaleźć pracy i umiera w nędzy."
        ru: "В романе «Марта» она описала судьбу вдовы, которая после смерти мужа не может найти работу и умирает в нищете."
