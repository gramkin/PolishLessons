paragraphs:
  - clean: "(Pochód staje. Beatrycze, jeszcze zasłoniona, mówi o Dantego miłości ku niej i sprzeniewierzeniu się jej: główna myśl Boskiej komedii, analogicznie do pieśni II Piekła.)"
    chunks:
      - pl: "(Pochód staje. Beatrycze, jeszcze zasłoniona, mówi o Dantego miłości ku niej i sprzeniewierzeniu się jej: główna myśl Boskiej komedii, analogicznie do pieśni II Piekła.)"
        ru: "(Шествие останавливается. Беатриче, ещё под покрывалом, говорит о любви Данте к ней и о его измене ей: главная мысль «Божественной комедии», подобно II песни «Ада».)"
        note: "sprzeniewierzyć się — изменить"
    words: { "mówi": mowic, "miłości": milosc, "główna": glowny, "Boskiej": boski, "pieśni": piesn }
  - clean: "Kiedy pierwszego ten siedmiogwiazd nieba,\n(Który nie wschodzi, nigdy nie zachodzi\nI nie znał innej chmury prócz zasłony\nPrzez grzech na jego światłość narzuconej,\nKtóry świat uczył, jak żyć i strzec trzeba\nSwych powinności, jak *nasz* sterem łodzi\nZręcznie obraca, że łódź w port swój wchodzi),\nWstrzymał swój pochód; ci, co pierwej przyszli\nPrzed gryfem, oczy zwrócili i myśli\nDo wozu jako do swego pokoju."
    verse: true
    chunks:
      - pl: "Kiedy pierwszego ten siedmiogwiazd nieba,"
        ru: "Когда это семизвездие первого неба,"
        note: "семь светильников"
      - pl: "\n(Który nie wschodzi, nigdy nie zachodzi"
        ru: "(что не восходит, никогда не заходит"
      - pl: "\nI nie znał innej chmury prócz zasłony"
        ru: "и не знало иной тучи, кроме покрова,"
      - pl: "\nPrzez grzech na jego światłość narzuconej,"
        ru: "наброшенного грехом на его свет,"
      - pl: "\nKtóry świat uczył, jak żyć i strzec trzeba"
        ru: "что учило мир, как жить и блюсти"
      - pl: "\nSwych powinności, jak *nasz* sterem łodzi"
        ru: "свои обязанности, как „наш“ рулём лодки"
      - pl: "\nZręcznie obraca, że łódź w port swój wchodzi),"
        ru: "ловко поворачивает, чтобы лодка вошла в свой порт),"
        note: "«наш» — земной Ковш, Большая Медведица"
      - pl: "\nWstrzymał swój pochód; ci, co pierwej przyszli"
        ru: "остановило своё шествие, те, что пришли прежде"
      - pl: "\nPrzed gryfem, oczy zwrócili i myśli"
        ru: "грифона, обратили глаза и мысли"
      - pl: "\nDo wozu jako do swego pokoju."
        ru: "к колеснице, как к своему миру."
    words: { "chmury": chmura, "zasłony": zaslona, "strzec": strzec, "sterem": ster, "port": port, "Wstrzymał": wstrzymac }
  - clean: "Jeden z tych starców jak niebieski goniec\nPotężnym śpiewem wykrzyknął na koniec,\nTrzy razy wtórząc: — «Przyjdź w godowym stroju,\nOblubienico! rzuć cedry libańskie!»\nI wszyscy po nim koleją nucili.\nJak szybko w sądny dzień błogosławieni\nPowstaną z grobów, nucąc alleluja\nOdzyskanymi na koniec głosami;\nTak na śpiew starców z wozu tejże chwili\nZe stu posłańców wieczności powstało:"
    verse: true
    chunks:
      - pl: "Jeden z tych starców jak niebieski goniec"
        ru: "Один из этих старцев, как небесный гонец,"
      - pl: "\nPotężnym śpiewem wykrzyknął na koniec,"
        ru: "могучим пением наконец воскликнул,"
      - pl: "\nTrzy razy wtórząc: — «Przyjdź w godowym stroju,"
        ru: "трижды повторяя: — «Приди в брачном наряде,"
        note: "godowy — брачный"
      - pl: "\nOblubienico! rzuć cedry libańskie!»"
        ru: "невеста! оставь кедры ливанские!»"
        note: "«Песнь песней»"
      - pl: "\nI wszyscy po nim koleją nucili."
        ru: "И все после него по очереди напевали."
      - pl: "\nJak szybko w sądny dzień błogosławieni"
        ru: "Как быстро в судный день блаженные"
      - pl: "\nPowstaną z grobów, nucąc alleluja"
        ru: "восстанут из могил, напевая «аллилуйя»"
      - pl: "\nOdzyskanymi na koniec głosami;"
        ru: "обретёнными наконец голосами;"
      - pl: "\nTak na śpiew starców z wozu tejże chwili"
        ru: "так на пение старцев с колесницы в тот же миг"
      - pl: "\nZe stu posłańców wieczności powstało:"
        ru: "поднялось сто посланцев вечности:"
    words: { "starców": starzec, "stroju": stroj, "błogosławieni": blogoslawic, "grobów": grob, "posłańców": poslaniec, "wieczności": wiecznosc }
  - clean: "«Błogosławiony! który w imię Pańskie\nPrzychodzisz», wszyscy rzekli zachwyceni.\nGdy krzyk ten wzleciał i w powietrzu buja,\nPotem wzwyż wkoło rzucając kwiatami:\n«Sypcie lilije pełnymi garściami».\nWidziałem przedświt, jak wschodnią część całą\nNiebo rumieni, a ile wzrok sięga,\nStroi pogodą resztę widnokręga."
    verse: true
    chunks:
      - pl: "«Błogosławiony! który w imię Pańskie"
        ru: "«Благословен Грядущий во имя Господне!» —"
      - pl: "\nPrzychodzisz», wszyscy rzekli zachwyceni."
        ru: "сказали все в восхищении."
      - pl: "\nGdy krzyk ten wzleciał i w powietrzu buja,"
        ru: "Когда этот крик взлетел и парит в воздухе,"
      - pl: "\nPotem wzwyż wkoło rzucając kwiatami:"
        ru: "потом, бросая цветы ввысь и кругом:"
      - pl: "\n«Sypcie lilije pełnymi garściami»."
        ru: "«Сыпьте лилии полными пригоршнями»."
      - pl: "\nWidziałem przedświt, jak wschodnią część całą"
        ru: "Я видел предрассветье, как всю восточную часть"
      - pl: "\nNiebo rumieni, a ile wzrok sięga,"
        ru: "небо румянит, а сколько достаёт взгляд,"
      - pl: "\nStroi pogodą resztę widnokręga."
        ru: "украшает ясностью остальной горизонт."
    words: { "rzekli": rzec, "zachwyceni": zachwycic, "krzyk": krzyk, "garściami": garsc, "wschodnią": wschodni, "sięga": siegac }
  - clean: "Widziałem, z cieniów jak wybłyska słońce,\nRannymi mgłami blask swój łagodzące\nW sposób, że mogłem na to świata oko\nPoglądać długo; tak w nim zatopiony\nPrzez obłok kwiatów, dziw nad wszystkie dziwy!\nCo z rąk anielskich wznosił się wysoko,\nA potem spadał na wóz i wokoło,\nŚwiętą niewiastę postrzegłem szczęśliwy."
    verse: true
    chunks:
      - pl: "Widziałem, z cieniów jak wybłyska słońce,"
        ru: "Я видел, как из теней вспыхивает солнце,"
      - pl: "\nRannymi mgłami blask swój łagodzące"
        ru: "смягчающее свой блеск утренними туманами"
      - pl: "\nW sposób, że mogłem na to świata oko"
        ru: "так, что я мог смотреть на это око мира"
      - pl: "\nPoglądać długo; tak w nim zatopiony"
        ru: "долго; так, погружённый в него,"
      - pl: "\nPrzez obłok kwiatów, dziw nad wszystkie dziwy!"
        ru: "сквозь облако цветов, чудо из чудес!"
      - pl: "\nCo z rąk anielskich wznosił się wysoko,"
        ru: "что из ангельских рук поднималось высоко,"
      - pl: "\nA potem spadał na wóz i wokoło,"
        ru: "а потом падало на колесницу и вокруг,"
      - pl: "\nŚwiętą niewiastę postrzegłem szczęśliwy."
        ru: "я, счастливый, заметил святую жену."
    words: { "cieniów": cien, "mgłami": mgla, "blask": blask, "kwiatów": kwiat, "wznosił": wznosic, "niewiastę": niewiasta }
  - clean: "Twarz jej świeciła spod białej zasłony,\nOliwny wieniec oplatał jej czoło,\nPłaszcz wiał z jej ramion jak szmaragd zielony,\nSuknia czerwona jako płomień żywy.\nDuch mój, co z dawna i długo odwykał\nPodziwem, trwogą drżeć w jej obecności,\nPoznał ją łatwo bez pomocy oka\nI poczuł dawnej potęgę miłości\nPrzez skryty pociąg, jaki z niej wynikał."
    verse: true
    chunks:
      - pl: "Twarz jej świeciła spod białej zasłony,"
        ru: "Лицо её сияло из-под белого покрывала,"
      - pl: "\nOliwny wieniec oplatał jej czoło,"
        ru: "оливковый венок обвивал её чело,"
      - pl: "\nPłaszcz wiał z jej ramion jak szmaragd zielony,"
        ru: "плащ веял с её плеч, зелёный, как изумруд,"
      - pl: "\nSuknia czerwona jako płomień żywy."
        ru: "платье красное, как живое пламя."
      - pl: "\nDuch mój, co z dawna i długo odwykał"
        ru: "Мой дух, что издавна и долго отвыкал"
      - pl: "\nPodziwem, trwogą drżeć w jej obecności,"
        ru: "дрожать от изумления, страха в её присутствии,"
      - pl: "\nPoznał ją łatwo bez pomocy oka"
        ru: "легко узнал её без помощи глаза"
      - pl: "\nI poczuł dawnej potęgę miłości"
        ru: "и почувствовал мощь давней любви"
      - pl: "\nPrzez skryty pociąg, jaki z niej wynikał."
        ru: "через тайное влечение, что исходило от неё."
    words: { "świeciła": swiecic, "Płaszcz": plaszcz, "Suknia": suknia, "płomień": plomien, "potęgę": potega, "wynikał": wynikac }
  - clean: "Ledwo przez oczy tajemniczy skutek\nPoczułem siły, co jak błysk z wysoka\nJeszcze zraniła mię w dzieciństwie mojem;\nW lewą zwróciłem oczy z niepokojem,\nJak małe dziecko, co bieży i łowi\nMatkę za rękę, czując strach lub smutek,\nAby te słowa rzec Wirgiliuszowi:\n«Każda krwi kropla drży we mnie i pali,\nPoznaję ślady dawnego płomienia»."
    verse: true
    chunks:
      - pl: "Ledwo przez oczy tajemniczy skutek"
        ru: "Едва через глаза я почувствовал таинственное действие"
      - pl: "\nPoczułem siły, co jak błysk z wysoka"
        ru: "силы, что, как молния с высоты,"
      - pl: "\nJeszcze zraniła mię w dzieciństwie mojem;"
        ru: "ранила меня ещё в моём детстве;"
      - pl: "\nW lewą zwróciłem oczy z niepokojem,"
        ru: "я обратил с беспокойством глаза налево,"
      - pl: "\nJak małe dziecko, co bieży i łowi"
        ru: "как маленькое дитя, что бежит и ловит"
      - pl: "\nMatkę za rękę, czując strach lub smutek,"
        ru: "мать за руку, чувствуя страх или печаль,"
      - pl: "\nAby te słowa rzec Wirgiliuszowi:"
        ru: "чтобы сказать Вергилию такие слова:"
      - pl: "\n«Każda krwi kropla drży we mnie i pali,"
        ru: "«Каждая капля крови во мне дрожит и пылает,"
      - pl: "\nPoznaję ślady dawnego płomienia»."
        ru: "узнаю следы давнего пламени»."
        note: "цитата из «Энеиды»"
    words: { "tajemniczy": tajemniczy, "skutek": skutek, "dzieciństwie": dziecinstwo, "smutek": smutek, "kropla": kropla, "Poznaję": poznawac }
  - clean: "Lecz już Wirgili znikł i był w oddali,\nWirgili, wódz mój i ojciec zarazem,\nKtóry skłoniony jej słodkim rozkazem,\nAż tu mię przywiódł dla mego zbawienia.\nNawet raj ziemski po takim rozstaniu\nNie zmniejszył smutku; w łez moich wezbraniu\nTwarz chociaż rosą omyta czyśćcową,\nZ goryczy płaczu sczerniała na nowo."
    verse: true
    chunks:
      - pl: "Lecz już Wirgili znikł i był w oddali,"
        ru: "Но уже Вергилий исчез и был далеко,"
      - pl: "\nWirgili, wódz mój i ojciec zarazem,"
        ru: "Вергилий, мой вождь и отец одновременно,"
      - pl: "\nKtóry skłoniony jej słodkim rozkazem,"
        ru: "который, склонённый её сладким велением,"
      - pl: "\nAż tu mię przywiódł dla mego zbawienia."
        ru: "довёл меня сюда для моего спасения."
      - pl: "\nNawet raj ziemski po takim rozstaniu"
        ru: "Даже земной рай после такого расставания"
      - pl: "\nNie zmniejszył smutku; w łez moich wezbraniu"
        ru: "не уменьшил печали; в половодье моих слёз"
        note: "wezbranie — половодье"
      - pl: "\nTwarz chociaż rosą omyta czyśćcową,"
        ru: "лицо, хоть и омытое росой Чистилища,"
      - pl: "\nZ goryczy płaczu sczerniała na nowo."
        ru: "снова почернело от горечи плача."
    words: { "wódz": wodz, "ziemski": ziemski, "zmniejszył": zmniejszyc, "rosą": rosa, "goryczy": gorycz, "płaczu": placz }
  - clean: "— «Dante! że ciebie porzucił Wirgili,\nCzegóż masz płakać? płacz hamuj tej chwili,\nŁzy twe zachowaj na ból innej rany».\nA jak admirał dbały o cześć flagi\nSam robi przegląd swej floty zebranej,\nNowotnym majtkom dodając odwagi,\nPatrzy, jak wiążą kotew do powrozu;\nTak, gdy na brzmienie mojego imienia\nJam się odwrócił, a które tu wzmienia\nPieśń przez konieczność; z lewej strony wozu,\nJuż z uprzedniego znajoma widzenia,\nPośród aniołów godowego koła\nStała niewiasta i ku mnie bez przerwy\nZ tej strony rzeki swe oczy zwracała,\nChociaż zasłona, spadając z jej czoła,\nGęsto dzierzgana liściami Minerwy"
    verse: true
    chunks:
      - pl: "— «Dante! że ciebie porzucił Wirgili,"
        ru: "— «Данте! что тебя покинул Вергилий,"
      - pl: "\nCzegóż masz płakać? płacz hamuj tej chwili,"
        ru: "о чём тебе плакать? сдержи плач в этот миг,"
      - pl: "\nŁzy twe zachowaj na ból innej rany»."
        ru: "сбереги свои слёзы для боли иной раны»."
      - pl: "\nA jak admirał dbały o cześć flagi"
        ru: "И как адмирал, заботливый о чести флага,"
      - pl: "\nSam robi przegląd swej floty zebranej,"
        ru: "сам делает смотр своему собранному флоту,"
      - pl: "\nNowotnym majtkom dodając odwagi,"
        ru: "прибавляя отваги новым матросам,"
        note: "nowotny — новый, новобранец"
      - pl: "\nPatrzy, jak wiążą kotew do powrozu;"
        ru: "смотрит, как вяжут якорь к канату;"
        note: "powróz — канат"
      - pl: "\nTak, gdy na brzmienie mojego imienia"
        ru: "так, когда при звуке моего имени"
      - pl: "\nJam się odwrócił, a które tu wzmienia"
        ru: "я обернулся, — а его здесь упоминает"
        note: "wzmieniać — упоминать"
      - pl: "\nPieśń przez konieczność; z lewej strony wozu,"
        ru: "песнь по необходимости, — с левой стороны колесницы,"
      - pl: "\nJuż z uprzedniego znajoma widzenia,"
        ru: "уже знакомая по прежнему видению,"
      - pl: "\nPośród aniołów godowego koła"
        ru: "среди брачного круга ангелов"
      - pl: "\nStała niewiasta i ku mnie bez przerwy"
        ru: "стояла жена и ко мне без перерыва"
      - pl: "\nZ tej strony rzeki swe oczy zwracała,"
        ru: "с той стороны реки обращала свои глаза,"
      - pl: "\nChociaż zasłona, spadając z jej czoła,"
        ru: "хоть покрывало, спадая с её чела,"
      - pl: "\nGęsto dzierzgana liściami Minerwy"
        ru: "густо расшитое листьями Минервы,"
        note: "масличные листья"
    words: { "admirał": admiral, "flagi": flaga, "dodając": dodawac, "wiążą": wiazac, "konieczność": koniecznosc, "Gęsto": gesto }
  - clean: "Większą część rysów jej twarzy skrywała;\nZ gestem pogardy jak gniewna królowa,\nMówiła dalej, jak mówca, co chowa\nNa koniec mowy najgorętsze słowa:\n— «Patrz, a mnie poznasz, jam jest Beatryce!\nJak śmiałeś wstąpić na tę górę żywy,\nTu, kędy mieszka tylko duch szczęśliwy?»"
    verse: true
    chunks:
      - pl: "Większą część rysów jej twarzy skrywała;"
        ru: "скрывало большую часть черт её лица;"
      - pl: "\nZ gestem pogardy jak gniewna królowa,"
        ru: "с жестом презрения, как гневная царица,"
      - pl: "\nMówiła dalej, jak mówca, co chowa"
        ru: "она говорила дальше, как оратор, что бережёт"
      - pl: "\nNa koniec mowy najgorętsze słowa:"
        ru: "на конец речи самые горячие слова:"
      - pl: "\n— «Patrz, a mnie poznasz, jam jest Beatryce!"
        ru: "— «Смотри, и ты узнаешь меня, я Беатриче!"
      - pl: "\nJak śmiałeś wstąpić na tę górę żywy,"
        ru: "Как ты посмел взойти на эту гору живым,"
      - pl: "\nTu, kędy mieszka tylko duch szczęśliwy?»"
        ru: "сюда, где живёт лишь счастливый дух?»"
    words: { "gestem": gest, "królowa": krolowa, "chowa": chowac, "najgorętsze": goracy, "wstąpić": wstapic, "żywy": zywy }
  - clean: "Na jasne wody spuściłem źrenice,\nLecz je po chwili podniosłem od wody,\nPatrząc w nią, wstyd mi czerwienił jagody.\nJak matka dziecku, tak ona surową\nWydała mi się, choć pełna słodyczy,\nCzułem w pieszczocie jej słów jad goryczy."
    verse: true
    chunks:
      - pl: "Na jasne wody spuściłem źrenice,"
        ru: "Я опустил зрачки на ясные воды,"
      - pl: "\nLecz je po chwili podniosłem od wody,"
        ru: "но через миг поднял их от воды,"
      - pl: "\nPatrząc w nią, wstyd mi czerwienił jagody."
        ru: "глядя на неё, стыд румянил мне щёки."
      - pl: "\nJak matka dziecku, tak ona surową"
        ru: "Как мать дитяти, так она мне показалась"
      - pl: "\nWydała mi się, choć pełna słodyczy,"
        ru: "суровой, хоть была полна сладости,"
      - pl: "\nCzułem w pieszczocie jej słów jad goryczy."
