# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 2
chapterTitle: "Pieśń II"
chapterTitleRu: "Песнь II. Беатриче"
level: B2
paragraphs:
  - clean: "(Dalszy ciąg wstępu: Beatrycze. Łucja.)"
    chunks:
      - pl: "(Dalszy ciąg wstępu: Beatrycze. Łucja.)"
        ru: "(Продолжение вступления: Беатриче. Лючия.)"
        note: "dalszy ciąg — продолжение; Łucja — святая Лючия"
    words: { "Dalszy": daleki, "ciąg": ciag, "wstępu": wstep }
  - clean: "Dzień gasnął, wszystko, co żyje na ziemi,\nUkołysane trudy i niewczasy\nW czarniawe nocy topiło wezgłowie;\nJam się uzbrajał jeden iść w zapasy\nZ drogą, z rzeczami litości godnymi,\nCo pamięć moja bez błędu opowie."
    verse: true
    chunks:
      - pl: "Dzień gasnął, wszystko, co żyje na ziemi,"
        ru: "День угасал, всё, что живёт на земле,"
        note: "gasnąć — гаснуть, угасать"
      - pl: "\nUkołysane trudy i niewczasy"
        ru: "убаюкав труды и невзгоды,"
        note: "ukołysać — убаюкать; niewczas — устар. «невзгода, лишение»"
      - pl: "\nW czarniawe nocy topiło wezgłowie;"
        ru: "в черноватое изголовье ночи погружало;"
        note: "czarniawy — черноватый; wezgłowie — изголовье; topić — топить, погружать"
      - pl: "\nJam się uzbrajał jeden iść w zapasy"
        ru: "я один готовился вступить в борьбу"
        note: "uzbrajać się — вооружаться, готовиться; iść w zapasy — вступить в схватку"
      - pl: "\nZ drogą, z rzeczami litości godnymi,"
        ru: "с дорогой, с вещами, достойными жалости,"
        note: "godny czegoś — достойный (род. п.)"
      - pl: "\nCo pamięć moja bez błędu opowie."
        ru: "которые моя память без ошибки расскажет."
    words: { "ziemi": ziemia, "trudy": trud, "litości": litosc, "pamięć": pamiec, "błędu": blad, "opowie": opowiedziec }
  - clean: "O genijuszu, bądź po mojej chęci!\nTy, co pisałeś, com widział, pamięci!\nTu się pokaże twoje uszlachcenie.\n«Poeto!» rzekłem, «wprzód osądź, czy mogę\nO własnej sile iść w tak wielką drogę?\nTy opowiadasz, jak pomiędzy cienie\nZ ciałem, co czułe, mdłe i skazitelne,\nZstąpił Eneasz w państwo nieśmiertelne."
    verse: true
    chunks:
      - pl: "O genijuszu, bądź po mojej chęci!"
        ru: "О гений, будь по моему желанию!"
        note: "genijusz — старое написание geniusz; Данте взывает к Музам и к своему гению"
      - pl: "\nTy, co pisałeś, com widział, pamięci!"
        ru: "Ты, что записала то, что я видел, память!"
        note: "com = co + -m (co widziałem)"
      - pl: "\nTu się pokaże twoje uszlachcenie."
        ru: "Здесь покажется твоё благородство."
        note: "uszlachcenie — облагораживание, благородство"
      - pl: "\n«Poeto!» rzekłem, «wprzód osądź, czy mogę"
        ru: "«Поэт! — сказал я, — сперва рассуди, могу ли я"
        note: "wprzód — устар. «сперва»; osądzić — рассудить"
      - pl: "\nO własnej sile iść w tak wielką drogę?"
        ru: "собственными силами идти в такой великий путь?"
        note: "o własnej sile — своими силами"
      - pl: "\nTy opowiadasz, jak pomiędzy cienie"
        ru: "Ты рассказываешь, как к теням"
        note: "cień — тень (душа умершего)"
      - pl: "\nZ ciałem, co czułe, mdłe i skazitelne,"
        ru: "с телом, что чувствительно, слабо и тленно,"
        note: "mdły — здесь «слабый»; skazitelny — устар. «тленный»"
      - pl: "\nZstąpił Eneasz w państwo nieśmiertelne."
        ru: "сошёл Эней в бессмертное царство."
        note: "zstąpić — сойти, спуститься"
    words: { "chęci": chec, "Poeto": poeta, "rzekłem": rzec, "osądź": osadzic, "opowiadasz": opowiadac, "państwo": panstwo }
  - clean: "Jeśli wróg złego był nań tak łaskawy,\nMyśląc o wielkich skutkach, jakiej sławy\nKrew jego będzie w bohatery płodna;\nRzecz ta uwagi wszystkich mędrców godna,\nBo był wybrany w empirejskim niebie\nNa ojca Romy i państwa dla siebie."
    verse: true
    chunks:
      - pl: "Jeśli wróg złego był nań tak łaskawy,"
        ru: "Если враг зла был к нему столь милостив,"
        note: "wróg złego — Бог; nań = na niego"
      - pl: "\nMyśląc o wielkich skutkach, jakiej sławy"
        ru: "думая о великих следствиях, о том, какой славы"
        note: "skutek — следствие, результат"
      - pl: "\nKrew jego będzie w bohatery płodna;"
        ru: "его кровь будет плодовита героями,"
        note: "płodny w coś — плодовитый чем-л."
      - pl: "\nRzecz ta uwagi wszystkich mędrców godna,"
        ru: "— вещь эта достойна внимания всех мудрецов,"
        note: "uwaga — внимание"
      - pl: "\nBo był wybrany w empirejskim niebie"
        ru: "ибо он был избран в эмпирейском небе"
        note: "empirejskie niebo — Эмпирей, высшее небо"
      - pl: "\nNa ojca Romy i państwa dla siebie."
        ru: "отцом Рима и державы для себя."
        note: "Roma — Рим (лат. форма); wybrany na ojca — избран отцом"
    words: { "wróg": wrog, "skutkach": skutek, "sławy": slawa, "uwagi": uwaga, "godna": godny, "niebie": niebo }
  - clean: "Wprawdzie zrąb jednej i drugiej budowy\nMiastu świętemu za fundament służy,\nGdzie w kolej siedzi następca Piotrowy.\nW sławnej przez ciebie tej jego podróży\nJuż przepowiednie wróżyły prorocze,\nŻe on zwycięży i płaszcz papieżowy."
    verse: true
    chunks:
      - pl: "Wprawdzie zrąb jednej i drugiej budowy"
        ru: "Правда, основа одного и другого строения"
        note: "zrąb — сруб, основа; budowa — постройка"
      - pl: "\nMiastu świętemu za fundament służy,"
        ru: "служит фундаментом святому городу,"
        note: "służyć za coś — служить чем-л."
      - pl: "\nGdzie w kolej siedzi następca Piotrowy."
        ru: "где по очереди сидит преемник Петров."
        note: "w kolej — устар. «по очереди»; następca — преемник"
      - pl: "\nW sławnej przez ciebie tej jego podróży"
        ru: "В этом его прославленном тобой путешествии"
      - pl: "\nJuż przepowiednie wróżyły prorocze,"
        ru: "уже пророческие предсказания возвещали,"
        note: "wróżyć — предвещать; proroczy — пророческий"
      - pl: "\nŻe on zwycięży i płaszcz papieżowy."
        ru: "что он победит — и [оттуда] папская мантия."
        note: "płaszcz papieżowy — папская мантия; у Данте путь Энея подготовил и Империю, и папство"
    words: { "budowy": budowa, "kolej": kolej, "następca": nastepca, "sławnej": slawny, "zwycięży": zwyciezyc, "płaszcz": plaszcz }
  - clean: "Na koniec Paweł, ta urna wyboru,\nBył w zachwyceniu ducha wniebowzięty,\nGdzie duch swój ogniem wiary zapłomienia,\nKtóra zasadą jest drogi zbawienia.\nLecz ja dlaczego i po co tu kroczę?\nJam nie Eneasz, jam nie Paweł święty,\nNie jestem godzien takiego honoru,\nStraszy mnie zamiar nieroztropnej drogi."
    verse: true
    chunks:
      - pl: "Na koniec Paweł, ta urna wyboru,"
        ru: "Наконец, Павел, этот сосуд избрания,"
        note: "urna wyboru — «сосуд избранный» (Деян. 9:15)"
      - pl: "\nBył w zachwyceniu ducha wniebowzięty,"
        ru: "был в восхищении духа вознесён на небо,"
        note: "zachwycenie — восхищение, экстаз; wniebowzięty — взятый на небо"
      - pl: "\nGdzie duch swój ogniem wiary zapłomienia,"
        ru: "где дух свой огнём веры воспламеняет,"
        note: "zapłomieniać — воспламенять"
      - pl: "\nKtóra zasadą jest drogi zbawienia."
        ru: "которая есть основа пути спасения."
        note: "zasada — здесь «основание»; zbawienie — спасение"
      - pl: "\nLecz ja dlaczego i po co tu kroczę?"
        ru: "Но я — зачем и для чего здесь шагаю?"
        note: "kroczyć — шагать, ступать"
      - pl: "\nJam nie Eneasz, jam nie Paweł święty,"
        ru: "Я не Эней, я не святой Павел,"
        note: "jam = ja + -m: «я (есмь)»"
      - pl: "\nNie jestem godzien takiego honoru,"
        ru: "я не достоин такой чести,"
        note: "godzien — краткая форма: «достоин»"
      - pl: "\nStraszy mnie zamiar nieroztropnej drogi."
        ru: "пугает меня замысел безрассудного пути."
        note: "nieroztropny — безрассудный, неблагоразумный"
    words: { "zachwyceniu": zachwycic, "wiary": wiara, "święty": swiety, "honoru": honor, "Straszy": straszyc, "zamiar": zamiar }
  - clean: "Ty jako mędrzec przyczynę mej trwogi\nLepiej pojmujesz, niż się ja wysłowię».\nJak ten, co w niechęć odpada ze chcenia,\nDla nowej myśli nagle zdanie zmienia\nI rzuca zamysł dojrzały w połowie,\nWażąc się w myślach, nagle ostudzałem\nZamiar poczęty z tak wielkim zapałem."
    verse: true
    chunks:
      - pl: "Ty jako mędrzec przyczynę mej trwogi"
        ru: "Ты, как мудрец, причину моего страха"
      - pl: "\nLepiej pojmujesz, niż się ja wysłowię»."
        ru: "лучше понимаешь, чем я выскажу»."
        note: "pojmować — постигать; wysłowić się — выразить себя словами"
      - pl: "\nJak ten, co w niechęć odpada ze chcenia,"
        ru: "Как тот, кто от желания впадает в нежелание,"
        note: "niechęć — нежелание; chcenie — хотение"
      - pl: "\nDla nowej myśli nagle zdanie zmienia"
        ru: "из-за новой мысли вдруг меняет мнение"
        note: "zdanie — мнение"
      - pl: "\nI rzuca zamysł dojrzały w połowie,"
        ru: "и бросает замысел, созревший наполовину,"
        note: "zamysł — замысел"
      - pl: "\nWażąc się w myślach, nagle ostudzałem"
        ru: "колеблясь в мыслях, я вдруг остужал"
        note: "ważyć się — здесь «колебаться»"
      - pl: "\nZamiar poczęty z tak wielkim zapałem."
        ru: "намерение, начатое с таким великим пылом."
        note: "poczęty — начатый, зачатый; zapał — пыл"
    words: { "przyczynę": przyczyna, "odpada": odpadac, "rzuca": rzucac, "Ważąc": wazyc, "myślach": mysl, "poczęty": poczac }
  - clean: "A cień szlachetny: «Zgaduję z twej mowy,\nŻe ciebie przestrach opanował nowy.\nCzęsto gdy trwoga ogarnie człowieka,\nCzłowiek od czynu wielkiego ucieka.\nJak zwierzę cofa cień widma kłamany.\nAby ci koniec położyć tej trwodze,\nPowiem, com słyszał, dlaczego przychodzę,\nCo moją litość wzbudziło dla ciebie."
    verse: true
    chunks:
      - pl: "A cień szlachetny: «Zgaduję z twej mowy,"
        ru: "А благородная тень: «Угадываю по твоей речи,"
      - pl: "\nŻe ciebie przestrach opanował nowy."
        ru: "что тобой овладел новый страх."
        note: "opanować — овладеть"
      - pl: "\nCzęsto gdy trwoga ogarnie człowieka,"
        ru: "Часто, когда страх охватит человека,"
        note: "ogarnąć — охватить"
      - pl: "\nCzłowiek od czynu wielkiego ucieka."
        ru: "человек бежит от великого дела."
        note: "czyn — деяние, дело"
      - pl: "\nJak zwierzę cofa cień widma kłamany."
        ru: "Как зверь пятится от обманчивой тени призрака."
        note: "cofać — пятиться; widmo — призрак; kłamany — устар. «обманчивый»"
      - pl: "\nAby ci koniec położyć tej trwodze,"
        ru: "Чтобы положить конец этому твоему страху,"
      - pl: "\nPowiem, com słyszał, dlaczego przychodzę,"
        ru: "скажу, что я слышал, зачем прихожу,"
        note: "com = co + -m (co słyszałem)"
      - pl: "\nCo moją litość wzbudziło dla ciebie."
        ru: "что пробудило мою жалость к тебе."
        note: "wzbudzić — пробудить, вызвать"
    words: { "szlachetny": szlachetny, "opanował": opanowac, "ogarnie": ogarnac, "czynu": czyn, "cofa": cofac, "widma": widmo }
  - clean: "Wśród tych, co nie są ni w piekle, ni w niebie,\nByłem rozkazem niewiasty wezwany,\nA ona była tak piękna i święta,\nŻe ją sam o jej prosiłem rozkazy.\nWięcej jak gwiazdy błyszczały jej oczy,\nZ ust jej szły pełne słodyczy wyrazy,\nGłos jej anielski, dźwięk mowy uroczy:\n»Duszo na chlubę Mantui poczęta,\nO! której sława przez tak długie lata\nTrwa i trwać będzie aż do końca świata!"
    verse: true
    chunks:
      - pl: "Wśród tych, co nie są ni w piekle, ni w niebie,"
        ru: "Среди тех, кто ни в аду, ни на небе,"
        note: "ni… ni… — ни… ни…; Вергилий пребывает в Лимбе"
      - pl: "\nByłem rozkazem niewiasty wezwany,"
        ru: "я был призван велением жены,"
        note: "rozkaz — приказ, веление; niewiasta — книжн. «жена, женщина»"
      - pl: "\nA ona była tak piękna i święta,"
        ru: "а она была так прекрасна и свята,"
      - pl: "\nŻe ją sam o jej prosiłem rozkazy."
        ru: "что я сам просил её о её повелениях."
        note: "prosić o coś — просить о чём-л."
      - pl: "\nWięcej jak gwiazdy błyszczały jej oczy,"
        ru: "Ярче звёзд сияли её глаза,"
        note: "więcej jak — устар. «больше, чем»"
      - pl: "\nZ ust jej szły pełne słodyczy wyrazy,"
        ru: "из её уст шли полные сладости слова,"
        note: "wyraz — здесь «слово»"
      - pl: "\nGłos jej anielski, dźwięk mowy uroczy:"
        ru: "голос её ангельский, звук речи прелестный:"
        note: "uroczy — прелестный, очаровательный"
      - pl: "\n»Duszo na chlubę Mantui poczęta,"
        ru: "„Душа, зачатая во славу Мантуи,"
        note: "chluba — гордость, слава; речь внутри речи Korsak берёт в »…«"
      - pl: "\nO! której sława przez tak długie lata"
        ru: "о, чья слава столько долгих лет"
      - pl: "\nTrwa i trwać będzie aż do końca świata!"
        ru: "длится и будет длиться до конца света!"
    words: { "piekle": pieklo, "niewiasty": niewiasta, "błyszczały": blyszczec, "wyrazy": wyraz, "dźwięk": dzwiek, "Trwa": trwac }
  - clean: "Wiedz, mój przyjaciel zabłąkał się nocą,\nW strachu z pół drogi cofa kroki swoje;\nZ wieści powziętych w niebie, ja się boję,\nBy za daleko nie zbłądził w pustkowie,\nAbym za późno nie przyszła z pomocą.\nIdź, śpiesz i twojej wymowy ozdobą,\nCzym tylko możesz zbawić, całym sobą,\nDopomóż jemu, uspokój mnie w trwodze;\nJam Beatrycze, która, byś szedł, mówię."
    verse: true
    chunks:
      - pl: "Wiedz, mój przyjaciel zabłąkał się nocą,"
        ru: "Знай: мой друг заблудился ночью,"
        note: "zabłąkać się — заблудиться"
      - pl: "\nW strachu z pół drogi cofa kroki swoje;"
        ru: "в страхе с полпути отступает назад;"
        note: "cofać kroki — отступать"
      - pl: "\nZ wieści powziętych w niebie, ja się boję,"
        ru: "по вестям, полученным на небе, я боюсь,"
        note: "wieść — весть; powziąć — получить, принять"
      - pl: "\nBy za daleko nie zbłądził w pustkowie,"
        ru: "как бы он не забрёл слишком далеко в пустошь,"
        note: "zbłądzić — заблудиться, сбиться"
      - pl: "\nAbym za późno nie przyszła z pomocą."
        ru: "как бы мне не прийти слишком поздно на помощь."
      - pl: "\nIdź, śpiesz i twojej wymowy ozdobą,"
        ru: "Иди, спеши и украшением своего красноречия,"
        note: "wymowa — красноречие; ozdoba — украшение"
      - pl: "\nCzym tylko możesz zbawić, całym sobą,"
        ru: "всем, чем только можешь спасти, всем собой,"
      - pl: "\nDopomóż jemu, uspokój mnie w trwodze;"
        ru: "помоги ему, успокой меня в тревоге;"
        note: "dopomóc — помочь"
      - pl: "\nJam Beatrycze, która, byś szedł, mówię."
        ru: "я — Беатриче, что говорю тебе: иди."
        note: "byś szedł — «чтобы ты шёл»"
    words: { "strachu": strach, "wieści": wiesc, "śpiesz": spieszyc, "ozdobą": ozdoba, "Dopomóż": dopomoc, "uspokój": uspokoic }
  - clean: "Z miejsca, gdzie żądam powrócić, przychodzę,\nMiłość aż tutaj przywiodła mnie rada,\nMiłość te słowa w moje usta wkłada.\nPrzed moim Panem gdy stanę na niebie,\nNieraz mi przyjdzie chwalić za to ciebie«.\nOna umilkła, jam począł na nowo:\n»Przez ciebie, pani i wszech cnót królowo,\nWyżej w godności człowieczeństwo sięga\nOd wszystkich istot w kole niebokręga;\nTwój rozkaz taką ma moc, że w tej chwili\nSłuchać i spełnić będzie mi najmilej,\nWięcej twej chęci otwierać nie trzeba."
    verse: true
    chunks:
      - pl: "Z miejsca, gdzie żądam powrócić, przychodzę,"
        ru: "Прихожу из места, куда жажду вернуться,"
        note: "żądać — здесь «жаждать»"
      - pl: "\nMiłość aż tutaj przywiodła mnie rada,"
        ru: "любовь привела меня сюда, радостную,"
        note: "rad, rada — рад, рада"
      - pl: "\nMiłość te słowa w moje usta wkłada."
        ru: "любовь вкладывает эти слова в мои уста."
      - pl: "\nPrzed moim Panem gdy stanę na niebie,"
        ru: "Когда я предстану перед моим Господом на небе,"
        note: "stanąć przed kimś — предстать"
      - pl: "\nNieraz mi przyjdzie chwalić za to ciebie«."
        ru: "не раз мне придётся хвалить тебя за это“."
