paragraphs:
  - clean: "Trzydzieści dni po wyjeździe z Dawson poczta do wybrzeża, z Buckiem i jego towarzyszami na przedzie, przybyła do Skagway. Były w opłakanym stanie, wyczerpane i wycieńczone. Sześćdziesiąt trzy kilogramy Bucka stopniały do pięćdziesięciu dwóch. Reszta towarzyszy, choć były to lżejsze psy, straciła względnie więcej wagi niż on. Pike, symulant, który przez całe swoje oszukańcze życie często z powodzeniem udawał chorą łapę, teraz kulał naprawdę. Sol-leks kulał, a Dub cierpiał z powodu zwichniętej łopatki."
    en: "Thirty days from the time it left Dawson, the Salt Water Mail, with Buck and his mates at the fore, arrived at Skaguay. They were in a wretched state, worn out and worn down. Buck’s one hundred and forty pounds had dwindled to one hundred and fifteen. The rest of his mates, though lighter dogs, had relatively lost more weight than he. Pike, the malingerer, who, in his lifetime of deceit, had often successfully feigned a hurt leg, was now limping in earnest. Sol-leks was limping, and Dub was suffering from a wrenched shoulder-blade."
    draft: true
    chunks:
      - pl: "Trzydzieści dni po wyjeździe z Dawson poczta do wybrzeża, z Buckiem i jego towarzyszami na przedzie, przybyła do Skagway."
        ru: "Через тридцать дней после выхода из Доусона почтовая упряжка, шедшая к побережью, с Бэком и его товарищами во главе, прибыла в Скагуэй."
        note: "poczta do wybrzeża — почта, идущая к побережью (у Лондона Salt Water Mail); na przedzie — впереди, во главе"
      - pl: " Były w opłakanym stanie, wyczerpane i wycieńczone."
        ru: "Они были в плачевном состоянии, измученные и истощённые."
      - pl: " Sześćdziesiąt trzy kilogramy Bucka stopniały do pięćdziesięciu dwóch."
        ru: "Шестьдесят три килограмма Бэка растаяли до пятидесяти двух."
        note: "stopnieć — растаять; у Лондона со 140 до 115 фунтов"
      - pl: " Reszta towarzyszy, choć były to lżejsze psy, straciła względnie więcej wagi niż on."
        ru: "Остальные товарищи, хоть и были собаками полегче, потеряли сравнительно больше веса, чем он."
        note: "względnie — сравнительно"
      - pl: " Pike, symulant, który przez całe swoje oszukańcze życie często z powodzeniem udawał chorą łapę, teraz kulał naprawdę."
        ru: "Пайк-симулянт, который за свою обманную жизнь часто и успешно притворялся, что у него болит лапа, теперь хромал всерьёз."
        note: "oszukańczy — обманный; udawać — притворяться"
      - pl: " Sol-leks kulał, a Dub cierpiał z powodu zwichniętej łopatki."
        ru: "Сол-лекс хромал, а Даб страдал от вывихнутой лопатки."
        note: "zwichnięty — вывихнутый; łopatka — лопатка"
    words: { "wyjeździe": wyjazd, "poczta": poczta, "towarzyszami": towarzysz, "kilogramy": kilogram, "wagi": waga, "łapę": lapa }
  - clean: "Wszystkie miały strasznie poranione łapy. Nie zostało w nich ani sprężystości, ani odbicia. Łapy ciężko opadały na szlak, wstrząsając ciałem i podwajając zmęczenie dziennej drogi. Nic im nie dolegało poza tym, że były śmiertelnie zmęczone. Nie było to śmiertelne zmęczenie, które przychodzi po krótkim i nadmiernym wysiłku i z którego wraca się do siebie w ciągu kilku godzin; było to śmiertelne zmęczenie, które przychodzi przez powolne i długotrwałe wysysanie sił przez miesiące trudu. Nie została im żadna zdolność do regeneracji, żadne zapasy sił, po które można by sięgnąć."
    en: "They were all terribly footsore. No spring or rebound was left in them. Their feet fell heavily on the trail, jarring their bodies and doubling the fatigue of a day’s travel. There was nothing the matter with them except that they were dead tired. It was not the dead-tiredness that comes through brief and excessive effort, from which recovery is a matter of hours; but it was the dead-tiredness that comes through the slow and prolonged strength drainage of months of toil. There was no power of recuperation left, no reserve strength to call upon."
    draft: true
    chunks:
      - pl: "Wszystkie miały strasznie poranione łapy."
        ru: "У всех были страшно сбиты лапы."
      - pl: " Nie zostało w nich ani sprężystości, ani odbicia."
        ru: "В них не осталось ни упругости, ни пружинистости."
      - pl: " Łapy ciężko opadały na szlak, wstrząsając ciałem i podwajając zmęczenie dziennej drogi."
        ru: "Лапы тяжело падали на тропу, сотрясая тело и удваивая усталость дневного пути."
      - pl: " Nic im nie dolegało poza tym, że były śmiertelnie zmęczone."
        ru: "Ничем они не болели — просто смертельно устали."
        note: "dolegać — беспокоить, болеть"
      - pl: " Nie było to śmiertelne zmęczenie, które przychodzi po krótkim i nadmiernym wysiłku i z którego wraca się do siebie w ciągu kilku godzin;"
        ru: "Это была не смертельная усталость, которая приходит после короткого и чрезмерного усилия и от которой оправляются за несколько часов;"
      - pl: " było to śmiertelne zmęczenie, które przychodzi przez powolne i długotrwałe wysysanie sił przez miesiące trudu."
        ru: "это была смертельная усталость, что приходит, когда месяцы труда медленно и долго высасывают силы."
        note: "wysysać — высасывать"
      - pl: " Nie została im żadna zdolność do regeneracji, żadne zapasy sił, po które można by sięgnąć."
        ru: "У них не осталось никакой способности восстанавливаться, никаких запасов сил, к которым можно было бы прибегнуть."
    words: { "szlak": szlak, "dziennej": dzienny, "śmiertelnie": smiertelnie, "wysiłku": wysilek, "trudu": trud, "sięgnąć": siegnac }
  - clean: "Zużyto wszystko, do ostatniej, najmniejszej odrobiny. Każdy mięsień, każde włókno, każda komórka były zmęczone, śmiertelnie zmęczone. I był ku temu powód. W niespełna pięć miesięcy przebyły cztery tysiące kilometrów, a podczas ostatnich trzech tysięcy miały tylko pięć dni odpoczynku. Kiedy przybyły do Skagway, wyglądały, jakby ledwie trzymały się na nogach. Z trudem utrzymywały napięte szleje, a na zjazdach ledwie zdążały schodzić z drogi saniom."
    en: "It had been all used, the last least bit of it. Every muscle, every fibre, every cell, was tired, dead tired. And there was reason for it. In less than five months they had travelled twenty-five hundred miles, during the last eighteen hundred of which they had had but five days’ rest. When they arrived at Skaguay they were apparently on their last legs. They could barely keep the traces taut, and on the down grades just managed to keep out of the way of the sled."
    draft: true
    chunks:
      - pl: "Zużyto wszystko, do ostatniej, najmniejszej odrobiny."
        ru: "Всё было израсходовано, до последней, малейшей крохи."
      - pl: " Każdy mięsień, każde włókno, każda komórka były zmęczone, śmiertelnie zmęczone."
        ru: "Каждая мышца, каждое волокно, каждая клетка устали, смертельно устали."
        note: "włókno — волокно; komórka — клетка"
      - pl: " I był ku temu powód."
        ru: "И на то была причина."
      - pl: " W niespełna pięć miesięcy przebyły cztery tysiące kilometrów, a podczas ostatnich trzech tysięcy miały tylko pięć dni odpoczynku."
        ru: "Меньше чем за пять месяцев они прошли четыре тысячи километров, а за последние три тысячи у них было лишь пять дней отдыха."
        note: "у Лондона 2500 и 1800 миль"
      - pl: " Kiedy przybyły do Skagway, wyglądały, jakby ledwie trzymały się na nogach."
        ru: "Когда они прибыли в Скагуэй, они выглядели так, будто едва держатся на ногах."
      - pl: " Z trudem utrzymywały napięte szleje, a na zjazdach ledwie zdążały schodzić z drogi saniom."
        ru: "Они с трудом держали постромки натянутыми, а на спусках едва успевали увернуться от саней."
        note: "zjazd — спуск"
    words: { "włókno": wlokno, "śmiertelnie": smiertelnie, "przebyły": przebyc, "odpoczynku": odpoczynek, "trudem": trud, "zjazdach": zjazd }
  - clean: "— Naprzód, biedne obolałe łapki — zachęcał je poganiacz, gdy zataczały się główną ulicą Skagway. — To już ostatni raz. Potem my mieć jeden długi odpoczynek. Hę? Na pewno. Jeden byczy długi odpoczynek."
    en: "“Mush on, poor sore feets,” the driver encouraged them as they tottered down the main street of Skaguay. “Dis is de las’. Den we get one long res’. Eh? For sure. One bully long res’.”"
    draft: true
    chunks:
      - pl: "— Naprzód, biedne obolałe łapki — zachęcał je poganiacz, gdy zataczały się główną ulicą Skagway."
        ru: "— Вперёд, бедные больные лапки, — подбадривал их погонщик, когда они плелись по главной улице Скагуэя."
        note: "obolały — больной, ноющий"
      - pl: " — To już ostatni raz. Potem my mieć jeden długi odpoczynek. Hę? Na pewno. Jeden byczy długi odpoczynek."
        ru: "— Это последний раз. Потом мы иметь один долгий отдых. А? Точно. Один отличный долгий отдых."
    words: { "Naprzód": naprzod, "biedne": biedny, "zachęcał": zachecac, "główną": glowny, "odpoczynek": odpoczynek, "pewno": pewno }
  - clean: "Poganiacze z ufnością spodziewali się długiego postoju. Sami przebyli dwa tysiące kilometrów z dwoma dniami odpoczynku i zgodnie z rozsądkiem i zwykłą sprawiedliwością należała im się przerwa na próżnowanie. Ale tylu ludzi rzuciło się na Klondike i tyle narzeczonych, żon i krewnych się nie rzuciło, że zalegająca poczta urosła do alpejskich rozmiarów; były też rozkazy urzędowe. Świeże partie psów z Zatoki Hudsona miały zająć miejsce tych, które nie nadawały się już na szlak. Tych bezużytecznych należało się pozbyć, a ponieważ psy niewiele znaczą wobec dolarów, miały zostać sprzedane."
    en: "The drivers confidently expected a long stopover. Themselves, they had covered twelve hundred miles with two days’ rest, and in the nature of reason and common justice they deserved an interval of loafing. But so many were the men who had rushed into the Klondike, and so many were the sweethearts, wives, and kin that had not rushed in, that the congested mail was taking on Alpine proportions; also, there were official orders. Fresh batches of Hudson Bay dogs were to take the places of those worthless for the trail. The worthless ones were to be got rid of, and, since dogs count for little against dollars, they were to be sold."
    draft: true
    chunks:
      - pl: "Poganiacze z ufnością spodziewali się długiego postoju."
        ru: "Погонщики уверенно рассчитывали на долгую стоянку."
        note: "ufność — доверие, уверенность"
      - pl: " Sami przebyli dwa tysiące kilometrów z dwoma dniami odpoczynku i zgodnie z rozsądkiem i zwykłą sprawiedliwością należała im się przerwa na próżnowanie."
        ru: "Сами они прошли две тысячи километров с двумя днями отдыха, и по здравому смыслу и простой справедливости им полагался перерыв для безделья."
      - pl: " Ale tylu ludzi rzuciło się na Klondike i tyle narzeczonych, żon i krewnych się nie rzuciło,"
        ru: "Но столько людей ринулось на Клондайк, и столько невест, жён и родни не ринулось,"
      - pl: " że zalegająca poczta urosła do alpejskich rozmiarów; były też rozkazy urzędowe."
        ru: "что скопившаяся почта выросла до альпийских размеров; были и служебные приказы."
        note: "zalegający — залежавшийся"
      - pl: " Świeże partie psów z Zatoki Hudsona miały zająć miejsce tych, które nie nadawały się już na szlak."
        ru: "Свежие партии собак с Гудзонова залива должны были заменить тех, что больше не годились для тропы."
        note: "partia — партия"
