  - clean: "Ze względu na naturę podróży arktycznej był powód, dla którego czternaście psów nie powinno ciągnąć jednych sań: jedne sanie nie mogły unieść jedzenia dla czternastu psów. Ale Charles i Hal o tym nie wiedzieli. Rozpisali podróż ołówkiem: tyle na psa, tyle psów, tyle dni, co było do udowodnienia. Mercedes zaglądała im przez ramię i kiwała ze zrozumieniem głową — wszystko było takie proste."
