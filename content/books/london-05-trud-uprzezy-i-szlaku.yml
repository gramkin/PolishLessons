  - clean: "Minęły trzy dni i wtedy Buck i jego towarzysze przekonali się, jak naprawdę są zmęczeni i słabi. Potem, rankiem czwartego dnia, przyszło dwóch mężczyzn ze Stanów i kupiło je razem z uprzężą za bezcen. Mężczyźni zwracali się do siebie „Hal” i „Charles”. Charles był mężczyzną w średnim wieku, o jasnej cerze, ze słabymi, łzawiącymi oczami i z wąsem, który zakręcał się zawadiacko i energicznie ku górze, zadając kłam bezwładnie opadającej wardze, którą ukrywał."
    en: "Three days passed, by which time Buck and his mates found how really tired and weak they were. Then, on the morning of the fourth day, two men from the States came along and bought them, harness and all, for a song. The men addressed each other as “Hal” and “Charles.” Charles was a middle-aged, lightish-colored man, with weak and watery eyes and a mustache that twisted fiercely and vigorously up, giving the lie to the limply drooping lip it concealed."
    draft: true
    chunks:
      - pl: "Minęły trzy dni i wtedy Buck i jego towarzysze przekonali się, jak naprawdę są zmęczeni i słabi."
        ru: "Прошло три дня, и тут Бэк и его товарищи поняли, как они на самом деле устали и ослабли."
      - pl: " Potem, rankiem czwartego dnia, przyszło dwóch mężczyzn ze Stanów i kupiło je razem z uprzężą za bezcen."
        ru: "Потом, утром четвёртого дня, пришли двое мужчин из Штатов и купили их вместе с упряжью за бесценок."
        note: "za bezcen — за бесценок"
      - pl: " Mężczyźni zwracali się do siebie „Hal” i „Charles”."
        ru: "Мужчины называли друг друга «Хэл» и «Чарльз»."
      - pl: " Charles był mężczyzną w średnim wieku, o jasnej cerze, ze słabymi, łzawiącymi oczami"
        ru: "Чарльз был мужчиной средних лет, светлокожим, со слабыми слезящимися глазами"
        note: "łzawiący — слезящийся"
      - pl: " i z wąsem, który zakręcał się zawadiacko i energicznie ku górze, zadając kłam bezwładnie opadającej wardze, którą ukrywał."
        ru: "и с усами, которые лихо и энергично закручивались вверх, опровергая вяло отвисшую губу, которую они прятали."
        note: "zadać kłam — опровергнуть; zawadiacko — лихо"
    words: { "towarzysze": towarzysz, "rankiem": ranek, "zwracali": zwracac, "średnim": sredni, "wąsem": was, "wardze": warga }
  - clean: "Hal był młodzikiem dziewiętnastu czy dwudziestu lat, z wielkim rewolwerem colt i nożem myśliwskim przypiętymi do pasa, który aż najeżony był nabojami. Ten pas był w nim najbardziej rzucającą się w oczy rzeczą. Ogłaszał jego żółtodziobość — żółtodziobość czystą i niewypowiedzianą. Obaj mężczyźni byli wyraźnie nie na swoim miejscu, a to, dlaczego tacy jak oni ruszają na Północ, należy do tajemnic świata, które przekraczają ludzkie zrozumienie."
    en: "Hal was a youngster of nineteen or twenty, with a big Colt’s revolver and a hunting-knife strapped about him on a belt that fairly bristled with cartridges. This belt was the most salient thing about him. It advertised his callowness—a callowness sheer and unutterable. Both men were manifestly out of place, and why such as they should adventure the North is part of the mystery of things that passes understanding."
    draft: true
    chunks:
      - pl: "Hal był młodzikiem dziewiętnastu czy dwudziestu lat, z wielkim rewolwerem colt i nożem myśliwskim przypiętymi do pasa, który aż najeżony był nabojami."
        ru: "Хэл был юнцом лет девятнадцати-двадцати, с большим кольтом и охотничьим ножом, пристёгнутыми к поясу, который прямо-таки щетинился патронами."
        note: "młodzik — юнец; nabój — патрон"
      - pl: " Ten pas był w nim najbardziej rzucającą się w oczy rzeczą."
        ru: "Этот пояс бросался в глаза больше всего остального."
      - pl: " Ogłaszał jego żółtodziobość — żółtodziobość czystą i niewypowiedzianą."
        ru: "Он выдавал в нём желторотого новичка — желторотого совершенно и безнадёжно."
        note: "żółtodziób — желторотый новичок"
      - pl: " Obaj mężczyźni byli wyraźnie nie na swoim miejscu, a to, dlaczego tacy jak oni ruszają na Północ, należy do tajemnic świata, które przekraczają ludzkie zrozumienie."
        ru: "Оба мужчины явно были не на своём месте, а почему такие, как они, пускаются на Север, — одна из тех тайн мира, что выше человеческого понимания."
    words: { "pasa": pas, "nabojami": naboj, "rzucającą": rzucac, "Północ": polnoc, "przekraczają": przekraczac }
  - clean: "Buck słyszał targowanie się, widział, jak pieniądze przechodzą między mężczyzną a agentem rządowym, i wiedział, że szkocki Metys i poganiacze karawany pocztowej odchodzą z jego życia śladem Perraulta, Françoisa i innych, którzy odeszli wcześniej. Kiedy przypędzono go z towarzyszami do obozu nowych właścicieli, Buck zobaczył niedbały i niechlujny bałagan: namiot rozbity do połowy, niepozmywane naczynia, wszystko w nieładzie; zobaczył też kobietę. Mężczyźni nazywali ją „Mercedes”. Była żoną Charlesa i siostrą Hala — miłe rodzinne towarzystwo."
    en: "Buck heard the chaffering, saw the money pass between the man and the Government agent, and knew that the Scotch half-breed and the mail-train drivers were passing out of his life on the heels of Perrault and François and the others who had gone before. When driven with his mates to the new owners’ camp, Buck saw a slipshod and slovenly affair, tent half stretched, dishes unwashed, everything in disorder; also, he saw a woman. “Mercedes” the men called her. She was Charles’s wife and Hal’s sister—a nice family party."
    draft: true
    chunks:
      - pl: "Buck słyszał targowanie się, widział, jak pieniądze przechodzą między mężczyzną a agentem rządowym,"
        ru: "Бэк слышал торг, видел, как деньги перешли от мужчины к правительственному агенту,"
        note: "targować się — торговаться"
      - pl: " i wiedział, że szkocki Metys i poganiacze karawany pocztowej odchodzą z jego życia śladem Perraulta, Françoisa i innych, którzy odeszli wcześniej."
        ru: "и знал, что шотландский метис и погонщики почтового обоза уходят из его жизни вслед за Перро, Франсуа и другими, ушедшими раньше."
      - pl: " Kiedy przypędzono go z towarzyszami do obozu nowych właścicieli, Buck zobaczył niedbały i niechlujny bałagan:"
        ru: "Когда его с товарищами пригнали в лагерь новых хозяев, Бэк увидел небрежный и неряшливый беспорядок:"
        note: "niedbały — небрежный; bałagan — беспорядок"
      - pl: " namiot rozbity do połowy, niepozmywane naczynia, wszystko w nieładzie; zobaczył też kobietę."
        ru: "палатка натянута наполовину, посуда не вымыта, всё в беспорядке; увидел он и женщину."
        note: "nieład — беспорядок"
