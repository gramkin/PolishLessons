  - clean: "Była piękna wiosenna pogoda, ale ani psy, ani ludzie tego nie zauważali. Każdego dnia słońce wschodziło wcześniej i zachodziło później. O trzeciej rano był już świt, a zmierzch trwał do dziewiątej wieczorem. Cały długi dzień był jednym blaskiem słońca. Upiorna zimowa cisza ustąpiła wielkiemu wiosennemu szmerowi budzącego się życia. Ten szmer podnosił się z całej ziemi, przepełniony radością życia. Dochodził od rzeczy, które znów żyły i się poruszały, rzeczy, które były jak martwe i nie ruszały się przez długie miesiące mrozu."
