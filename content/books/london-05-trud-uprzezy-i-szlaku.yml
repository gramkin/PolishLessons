  - clean: "I tak to szło: nieubłagane usuwanie tego, co zbędne. Mercedes płakała, kiedy jej worki z ubraniami wysypano na ziemię i wyrzucano rzecz po rzeczy. Płakała w ogóle i płakała w szczególności nad każdą wyrzuconą rzeczą. Objęła rękami kolana i kołysała się w przód i w tył, zrozpaczona. Zapewniała, że nie ruszy się ani na krok, nawet dla tuzina Charlesów. Odwoływała się do wszystkich i do wszystkiego, aż w końcu otarła oczy i zaczęła wyrzucać nawet części garderoby, które były absolutnie niezbędne. A w swoim zapale, kiedy skończyła ze swoimi, zabrała się do rzeczy swoich mężczyzn i przeszła przez nie jak tornado."
