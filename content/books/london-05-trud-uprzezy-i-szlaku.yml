  - clean: "A przez to wszystko Buck brnął na czele zaprzęgu jak w koszmarze. Ciągnął, kiedy mógł; kiedy już nie mógł ciągnąć, padał i leżał, dopóki razy bata albo pałki nie podnosiły go znów na nogi. Z jego pięknego futra zniknęła cała sztywność i połysk. Sierść zwisała, bezwładna i skołtuniona, albo zlepiona zaschniętą krwią tam, gdzie pałka Hala go posiniaczyła."
