  - clean: "Przyszedł dzień, kiedy dobroduszny Billee upadł i nie mógł się podnieść. Hal wymienił już swój rewolwer, więc wziął siekierę i uderzył Billee'ego w łeb, gdy ten leżał w uprzęży, a potem wyciął ciało z uprzęży i odciągnął je na bok. Buck to widział i jego towarzysze to widzieli, i wiedzieli, że to coś jest bardzo blisko nich. Następnego dnia odeszła Koona i zostało ich tylko pięcioro: Joe, zbyt wycieńczony, żeby być złośliwym; Pike, okaleczony i kulejący, ledwie przytomny i już nie dość przytomny, żeby symulować; jednooki Sol-leks, wciąż wierny trudowi uprzęży i szlaku i smutny, że ma tak mało sił do ciągnięcia; Teek, który nie przebył tej zimy tak długiej drogi i którego teraz bito bardziej niż innych, bo był świeższy; i Buck, wciąż na czele zaprzęgu, ale już nie egzekwujący dyscypliny i nawet nie próbujący jej egzekwować, przez połowę czasu ślepy ze słabości, trzymający się szlaku po jego zarysie i mglistym czuciu łap."
