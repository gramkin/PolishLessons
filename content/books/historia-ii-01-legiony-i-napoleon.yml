        ru: "Их остатки позже вошли в состав Вислинского легиона, сражавшегося в Испании и в России, а ветераны легионов стали костяком армии Варшавского герцогства."
        note: "trzon — костяк"
      - pl: " Generał Dąbrowski dożył końca epoki napoleońskiej i zmarł w 1818 roku w swoim majątku w Wielkopolsce."
        ru: "Генерал Домбровский дожил до конца наполеоновской эпохи и умер в 1818 году в своём имении в Великой Польше."
