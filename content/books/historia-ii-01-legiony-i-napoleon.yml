  - clean: "Do legionów zgłaszali się emigranci, dawni żołnierze powstania, a przede wszystkim polscy jeńcy z armii austriackiej, w której służyli jako poddani cesarza. Wielu z nich było chłopami z Galicji, którzy po raz pierwszy w życiu usłyszeli, że walczą o wolną ojczyznę. W ciągu kilku miesięcy legiony liczyły kilka tysięcy żołnierzy. Wierzyli, że walcząc we Włoszech, torują sobie drogę do domu. Mieli nadzieję, że Francuzi, pokonawszy Austrię, pomogą im przejść przez Alpy i Węgry na ziemie polskie."
    draft: true
    chunks:
      - pl: "Do legionów zgłaszali się emigranci, dawni żołnierze powstania, a przede wszystkim polscy jeńcy z armii austriackiej, w której służyli jako poddani cesarza."
        ru: "В легионы записывались эмигранты, бывшие солдаты восстания, а прежде всего польские пленные из австрийской армии, в которой они служили как подданные императора."
      - pl: " Wielu z nich było chłopami z Galicji, którzy po raz pierwszy w życiu usłyszeli, że walczą o wolną ojczyznę."
        ru: "Многие из них были крестьянами из Галиции, которые впервые в жизни услышали, что сражаются за свободную родину."
      - pl: " W ciągu kilku miesięcy legiony liczyły kilka tysięcy żołnierzy."
        ru: "За несколько месяцев в легионах насчитывалось несколько тысяч солдат."
      - pl: " Wierzyli, że walcząc we Włoszech, torują sobie drogę do domu."
        ru: "Они верили, что, воюя в Италии, прокладывают себе дорогу домой."
        note: "torować drogę — прокладывать дорогу"
      - pl: " Mieli nadzieję, że Francuzi, pokonawszy Austrię, pomogą im przejść przez Alpy i Węgry na ziemie polskie."
        ru: "Они надеялись, что французы, разбив Австрию, помогут им пройти через Альпы и Венгрию на польские земли."
    words: { "polskie": polski, "polscy": polski, "jeńcy": jeniec, "cesarza": cesarz, "chłopami": chlop, "ojczyznę": ojczyzna }
  - clean: "W lipcu 1797 roku w miasteczku Reggio we Włoszech przyjaciel Dąbrowskiego, Józef Wybicki, napisał dla legionistów pieśń. Nazywała się „Pieśń Legionów Polskich we Włoszech”, a zaczynała się od słów: „Jeszcze Polska nie umarła, kiedy my żyjemy”. Refren wzywał: „Marsz, marsz, Dąbrowski, z ziemi włoskiej do Polski”. Pieśń śpiewano na melodię ludowego mazurka, dlatego nazwano ją Mazurkiem Dąbrowskiego. Szybko rozeszła się po całym kraju, a jej słowa „nie umarła” zmieniono później na „nie zginęła”. Od 1927 roku jest oficjalnym hymnem Polski. Jest to jeden z niewielu hymnów narodowych na świecie, w których wymienia się nazwisko konkretnego człowieka, a nawet dwóch, bo pada w nim również imię Napoleona."
    draft: true
    chunks:
      - pl: "W lipcu 1797 roku w miasteczku Reggio we Włoszech przyjaciel Dąbrowskiego, Józef Wybicki, napisał dla legionistów pieśń."
        ru: "В июле 1797 года в городке Реджо в Италии друг Домбровского, Юзеф Выбицкий, написал для легионеров песню."
      - pl: " Nazywała się „Pieśń Legionów Polskich we Włoszech”, a zaczynała się od słów: „Jeszcze Polska nie umarła, kiedy my żyjemy”."
        ru: "Она называлась «Песнь польских легионов в Италии» и начиналась словами: «Ещё Польша не умерла, пока мы живы»."
      - pl: " Refren wzywał: „Marsz, marsz, Dąbrowski, z ziemi włoskiej do Polski”."
        ru: "Припев призывал: «Марш, марш, Домбровский, из итальянской земли в Польшу»."
        note: "refren — припев"
      - pl: " Pieśń śpiewano na melodię ludowego mazurka, dlatego nazwano ją Mazurkiem Dąbrowskiego."
        ru: "Песню пели на мотив народной мазурки, поэтому её назвали Мазуркой Домбровского."
      - pl: " Szybko rozeszła się po całym kraju, a jej słowa „nie umarła” zmieniono później na „nie zginęła”."
        ru: "Она быстро разошлась по всей стране, а её слова «не умерла» позже изменили на «не погибла»."
      - pl: " Od 1927 roku jest oficjalnym hymnem Polski."
        ru: "С 1927 года это официальный гимн Польши."
      - pl: " Jest to jeden z niewielu hymnów narodowych na świecie, w których wymienia się nazwisko konkretnego człowieka, a nawet dwóch, bo pada w nim również imię Napoleona."
        ru: "Это один из немногих национальных гимнов в мире, в которых упоминается имя конкретного человека, и даже двоих, ведь в нём звучит и имя Наполеона."
    words: { "lipcu": lipiec, "miasteczku": miasteczko, "pieśń": piesn, "wzywał": wzywac, "marsz": marsz, "włoskiej": wloski, "melodię": melodia, "rozeszła": rozejsc, "oficjalnym": oficjalny, "narodowych": narodowy, "konkretnego": konkretny, "pada": padac }
  - clean: "Losy legionów okazały się tragiczne. Legioniści walczyli dzielnie we Włoszech, wkroczyli do Rzymu, ale w 1799 roku ponieśli ogromne straty w bitwach z wojskami austriackimi i rosyjskimi. W Mantui, którą Francuzi oddali Austriakom, kapitulujący legioniści zostali wydani jako dezerterzy z armii cesarskiej. Napoleon, który w 1799 roku zdobył władzę we Francji, zawierał pokój z zaborcami, kiedy było mu to wygodne. O sprawie polskiej w traktatach nie wspominano."
    draft: true
    chunks:
      - pl: "Losy legionów okazały się tragiczne."
        ru: "Судьба легионов оказалась трагической."
      - pl: " Legioniści walczyli dzielnie we Włoszech, wkroczyli do Rzymu, ale w 1799 roku ponieśli ogromne straty w bitwach z wojskami austriackimi i rosyjskimi."
        ru: "Легионеры храбро сражались в Италии, вступили в Рим, но в 1799 году понесли огромные потери в битвах с австрийскими и русскими войсками."
      - pl: " W Mantui, którą Francuzi oddali Austriakom, kapitulujący legioniści zostali wydani jako dezerterzy z armii cesarskiej."
        ru: "В Мантуе, которую французы сдали австрийцам, капитулировавших легионеров выдали как дезертиров из императорской армии."
        note: "dezerter — дезертир"
      - pl: " Napoleon, który w 1799 roku zdobył władzę we Francji, zawierał pokój z zaborcami, kiedy było mu to wygodne."
        ru: "Наполеон, захвативший в 1799 году власть во Франции, заключал мир с державами-участницами разделов, когда ему это было удобно."
      - pl: " O sprawie polskiej w traktatach nie wspominano."
        ru: "О польском вопросе в договорах не упоминали."
