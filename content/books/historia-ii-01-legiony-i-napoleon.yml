      - pl: " Na wyspie trwało powstanie czarnych niewolników, którzy walczyli o wolność, a Napoleon chciał przywrócić tam niewolnictwo."
        ru: "На острове шло восстание чёрных рабов, боровшихся за свободу, а Наполеон хотел восстановить там рабство."
        note: "niewolnictwo — рабство"
      - pl: " Polacy, którzy przyszli walczyć o wolność własnej ojczyzny, mieli teraz tłumić walkę o wolność innego narodu."
        ru: "Поляки, пришедшие сражаться за свободу собственной родины, теперь должны были подавлять борьбу за свободу другого народа."
      - pl: " Większość z nich zmarła na żółtą febrę albo zginęła w walkach."
        ru: "Большинство из них умерли от жёлтой лихорадки или погибли в боях."
        note: "febra — лихорадка"
      - pl: " Niektórzy przeszli jednak na stronę powstańców."
        ru: "Однако некоторые перешли на сторону повстанцев."
      - pl: " Po ogłoszeniu niepodległości Haiti nowa konstytucja zabraniała białym posiadania ziemi, ale robiła wyjątek dla Polaków i Niemców, którzy pozostali na wyspie."
        ru: "После провозглашения независимости Гаити новая конституция запрещала белым владеть землёй, но делала исключение для поляков и немцев, оставшихся на острове."
      - pl: " Potomkowie polskich żołnierzy żyją tam do dziś, a w wiosce Cazale niektórzy mieszkańcy mają jasne oczy i pamiętają o swoim pochodzeniu."
        ru: "Потомки польских солдат живут там до сих пор, а в деревне Казаль некоторые жители светлоглазы и помнят о своём происхождении."
