  - clean: "Najbardziej gorzki był los żołnierzy wysłanych w 1802 roku na Haiti, francuską kolonię na Karaibach. Na wyspie trwało powstanie czarnych niewolników, którzy walczyli o wolność, a Napoleon chciał przywrócić tam niewolnictwo. Polacy, którzy przyszli walczyć o wolność własnej ojczyzny, mieli teraz tłumić walkę o wolność innego narodu. Większość z nich zmarła na żółtą febrę albo zginęła w walkach. Niektórzy przeszli jednak na stronę powstańców. Po ogłoszeniu niepodległości Haiti nowa konstytucja zabraniała białym posiadania ziemi, ale robiła wyjątek dla Polaków i Niemców, którzy pozostali na wyspie. Potomkowie polskich żołnierzy żyją tam do dziś, a w wiosce Cazale niektórzy mieszkańcy mają jasne oczy i pamiętają o swoim pochodzeniu."
    draft: true
    chunks:
