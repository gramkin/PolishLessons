  - clean: "W 1812 roku Napoleon postanowił rozprawić się z Rosją. Nazwał tę wyprawę drugą wojną polską i obiecywał odbudowę Polski. W Warszawie sejm ogłosił konfederację generalną i przywrócenie Królestwa Polskiego. Do Wielkiej Armii, liczącej ponad sześćset tysięcy żołnierzy, Księstwo Warszawskie wystawiło prawie sto tysięcy ludzi, najwięcej spośród wszystkich sojuszników Francji. W czerwcu 1812 roku armia przekroczyła Niemen, a kilka dni później Napoleon wjechał do Wilna, gdzie spędził prawie trzy tygodnie. Utworzono tam tymczasowy rząd Wielkiego Księstwa Litewskiego, a litewska szlachta wystawiła kilka nowych pułków. Przez kilka miesięcy wydawało się, że dawna unia polsko-litewska odrodzi się pod opieką Francji. Cesarz nie spieszył się jednak z decyzjami, bo wciąż liczył na pokój z carem. Polacy walczyli pod Smoleńskiem i pod Borodino i wkroczyli do Moskwy. Wielu z nich wierzyło, że idą odzyskać dawne ziemie Rzeczypospolitej, a dla rosyjskich żołnierzy byli najeźdźcami, takimi samymi jak Francuzi."
