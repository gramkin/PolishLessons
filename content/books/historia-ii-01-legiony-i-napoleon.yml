paragraphs:
  - clean: "Po trzecim rozbiorze wielu Polaków uważało, że wszystko jest stracone. Państwo zniknęło, armię rozwiązano, a wielu patriotów siedziało w więzieniach albo uciekło za granicę. Szlachta w zaborze pruskim, austriackim i rosyjskim musiała złożyć przysięgę wierności nowym monarchom. Większość ją złożyła, bo inaczej straciłaby majątki. Ale część emigrantów nie zamierzała się poddać. Zbierali się w Paryżu i w Wenecji, spierali się o to, co robić dalej, i szukali sojusznika, który pomógłby im odbudować Polskę."
    draft: true
    chunks:
      - pl: "Po trzecim rozbiorze wielu Polaków uważało, że wszystko jest stracone."
        ru: "После третьего раздела многие поляки считали, что всё потеряно."
      - pl: " Państwo zniknęło, armię rozwiązano, a wielu patriotów siedziało w więzieniach albo uciekło za granicę."
        ru: "Государство исчезло, армию распустили, а многие патриоты сидели в тюрьмах или бежали за границу."
      - pl: " Szlachta w zaborze pruskim, austriackim i rosyjskim musiała złożyć przysięgę wierności nowym monarchom."
        ru: "Шляхта в прусской, австрийской и российской частях должна была присягнуть на верность новым монархам."
      - pl: " Większość ją złożyła, bo inaczej straciłaby majątki."
        ru: "Большинство присягнуло, иначе потеряли бы имения."
      - pl: " Ale część emigrantów nie zamierzała się poddać."
        ru: "Но часть эмигрантов не собиралась сдаваться."
      - pl: " Zbierali się w Paryżu i w Wenecji, spierali się o to, co robić dalej, i szukali sojusznika, który pomógłby im odbudować Polskę."
        ru: "Они собирались в Париже и в Венеции, спорили о том, что делать дальше, и искали союзника, который помог бы им восстановить Польшу."
    words: { "rosyjskim": rosyjski, "przysięgę": przysiega, "majątki": majatek, "sojusznika": sojusznik }
  - clean: "Jedynym państwem, które walczyło wtedy ze wszystkimi trzema zaborcami, była rewolucyjna Francja. Generał Jan Henryk Dąbrowski, uczestnik powstania kościuszkowskiego, wpadł na pomysł, żeby u boku Francuzów utworzyć polskie wojsko. Przedstawił plan młodemu generałowi, który właśnie odnosił wielkie zwycięstwa w północnych Włoszech: Napoleonowi Bonaparte. Francja nie mogła oficjalnie przyjmować obcokrajowców do swojej armii, więc legiony utworzono przy Republice Lombardzkiej, francuskim sojuszniku. W styczniu 1797 roku w Mediolanie podpisano umowę o utworzeniu Legionów Polskich. Żołnierze nosili polskie mundury, mieli polskich oficerów i polskie komendy, ale na naramiennikach nosili napis „Ludzie wolni są braćmi”."
    draft: true
    chunks:
      - pl: "Jedynym państwem, które walczyło wtedy ze wszystkimi trzema zaborcami, była rewolucyjna Francja."
        ru: "Единственным государством, которое воевало тогда со всеми тремя державами-участницами разделов, была революционная Франция."
      - pl: " Generał Jan Henryk Dąbrowski, uczestnik powstania kościuszkowskiego, wpadł na pomysł, żeby u boku Francuzów utworzyć polskie wojsko."
        ru: "Генерал Ян Генрик Домбровский, участник восстания Костюшко, придумал создать польское войско рядом с французами."
        note: "wpaść na pomysł — придумать"
      - pl: " Przedstawił plan młodemu generałowi, który właśnie odnosił wielkie zwycięstwa w północnych Włoszech: Napoleonowi Bonaparte."
        ru: "Он представил план молодому генералу, который как раз одерживал большие победы в Северной Италии, — Наполеону Бонапарту."
      - pl: " Francja nie mogła oficjalnie przyjmować obcokrajowców do swojej armii, więc legiony utworzono przy Republice Lombardzkiej, francuskim sojuszniku."
        ru: "Франция не могла официально принимать иностранцев в свою армию, поэтому легионы были созданы при Ломбардской республике, союзнице Франции."
        note: "obcokrajowiec — иностранец"
      - pl: " W styczniu 1797 roku w Mediolanie podpisano umowę o utworzeniu Legionów Polskich."
        ru: "В январе 1797 года в Милане было подписано соглашение о создании Польских легионов."
      - pl: " Żołnierze nosili polskie mundury, mieli polskich oficerów i polskie komendy, ale na naramiennikach nosili napis „Ludzie wolni są braćmi”."
        ru: "Солдаты носили польские мундиры, у них были польские офицеры и польские команды, а на эполетах — надпись «Свободные люди — братья»."
        note: "naramiennik — эполет"
