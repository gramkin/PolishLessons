  - clean: "Mimo klęsk legiony nie zniknęły. Ich resztki weszły później w skład Legii Nadwiślańskiej, która walczyła w Hiszpanii i w Rosji, a weterani legionów stali się trzonem armii Księstwa Warszawskiego. Generał Dąbrowski dożył końca epoki napoleońskiej i zmarł w 1818 roku w swoim majątku w Wielkopolsce."
    draft: true
    chunks:
