  - clean: "Tymczasem w kraju życie toczyło się dalej. Warszawa znalazła się pod władzą pruską i stała się prowincjonalnym miastem, z którego wyjechał dwór, sejm i wielu mieszkańców. Polacy szukali innych dróg. Niektórzy liczyli na Rosję. Młody książę Adam Jerzy Czartoryski, syn jednej z najpotężniejszych rodzin dawnej Rzeczypospolitej, został przyjacielem cara Aleksandra I. W latach 1804–1806 był nawet ministrem spraw zagranicznych Rosji i próbował przekonać cara, by odbudował Polskę pod swoim berłem. Jako kurator wileńskiego okręgu naukowego zrobił z Uniwersytetu Wileńskiego jedną z najlepszych uczelni w Europie Wschodniej, z wykładami po polsku. W Wilnie studiowało wkrótce pokolenie, z którego wyszedł Adam Mickiewicz."
    draft: true
    chunks:
      - pl: "Tymczasem w kraju życie toczyło się dalej."
        ru: "Тем временем на родине жизнь шла своим чередом."
      - pl: " Warszawa znalazła się pod władzą pruską i stała się prowincjonalnym miastem, z którego wyjechał dwór, sejm i wielu mieszkańców."
        ru: "Варшава оказалась под прусской властью и стала провинциальным городом, откуда уехали двор, сейм и многие жители."
      - pl: " Polacy szukali innych dróg."
        ru: "Поляки искали иные пути."
      - pl: " Niektórzy liczyli na Rosję."
        ru: "Некоторые рассчитывали на Россию."
      - pl: " Młody książę Adam Jerzy Czartoryski, syn jednej z najpotężniejszych rodzin dawnej Rzeczypospolitej, został przyjacielem cara Aleksandra I."
        ru: "Молодой князь Адам Ежи Чарторыйский, сын одной из самых могущественных семей старой Речи Посполитой, стал другом царя Александра I."
      - pl: " W latach 1804–1806 był nawet ministrem spraw zagranicznych Rosji i próbował przekonać cara, by odbudował Polskę pod swoim berłem."
        ru: "В 1804–1806 годах он был даже министром иностранных дел России и пытался убедить царя восстановить Польшу под своим скипетром."
      - pl: " Jako kurator wileńskiego okręgu naukowego zrobił z Uniwersytetu Wileńskiego jedną z najlepszych uczelni w Europie Wschodniej, z wykładami po polsku."
        ru: "Как попечитель Виленского учебного округа он сделал Виленский университет одним из лучших в Восточной Европе, с лекциями на польском языке."
        note: "kurator — попечитель"
