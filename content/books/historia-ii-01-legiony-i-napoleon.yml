  - clean: "Józef Poniatowski nie przyjął propozycji przejścia na stronę cara. Uważał, że dał słowo Napoleonowi, i z resztkami wojska polskiego poszedł z nim dalej na zachód. W październiku 1813 roku pod Lipskiem rozegrała się największa bitwa epoki napoleońskiej, nazywana bitwą narodów, bo walczyli w niej żołnierze prawie całej Europy. W czasie bitwy cesarz mianował Poniatowskiego marszałkiem Francji, jedynym cudzoziemcem, który otrzymał ten stopień. Trzy dni później, osłaniając odwrót armii francuskiej, ranny książę próbował przepłynąć konno wezbraną rzekę Elsterę i utonął. Przypisywano mu słowa: „Bóg mi powierzył honor Polaków, Bogu go tylko oddam”. Jego ciało przewieziono później do Krakowa i pochowano na Wawelu. W Warszawie przed Pałacem Prezydenckim stoi jego pomnik konny, który w czasie II wojny światowej Niemcy zniszczyli, a po wojnie odtworzono. Część polskich żołnierzy pozostała przy Napoleonie aż do końca. Kiedy w 1814 roku cesarz został zesłany na wyspę Elbę, towarzyszył mu szwadron polskich szwoleżerów. Polscy ułani byli z nim także w czasie stu dni i walczyli pod Waterloo. Wierność, z którą Polacy służyli cesarzowi, budziła podziw nawet jego wrogów."
