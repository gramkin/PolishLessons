chapter: 11
chapterTitle: "Walka o granice"
chapterTitleRu: "Борьба за границы"
level: B2
paragraphs:
  - clean: "Polska odzyskała niepodległość, ale nikt nie wiedział jeszcze, gdzie będą jej granice. Dawna Rzeczpospolita sięgała od Bałtyku prawie do Morza Czarnego, ale od jej upadku minęło ponad sto lat. Na tych samych ziemiach obudziły się w tym czasie inne narody: Litwini, Ukraińcy i Białorusini, które także chciały mieć własne państwa. Na zachodzie granicę trzeba było wywalczyć z Niemcami, którzy nie chcieli oddać Wielkopolski, Pomorza i Śląska. Przez kilka lat Polska walczyła prawie jednocześnie na wszystkich swoich granicach."
    draft: true
    chunks:
      - pl: "Polska odzyskała niepodległość, ale nikt nie wiedział jeszcze, gdzie będą jej granice."
        ru: "Польша обрела независимость, но никто ещё не знал, где пройдут её границы."
      - pl: " Dawna Rzeczpospolita sięgała od Bałtyku prawie do Morza Czarnego, ale od jej upadku minęło ponad sto lat."
        ru: "Бывшая Речь Посполитая простиралась от Балтики почти до Чёрного моря, но с её падения прошло больше ста лет."
      - pl: " Na tych samych ziemiach obudziły się w tym czasie inne narody: Litwini, Ukraińcy i Białorusini, które także chciały mieć własne państwa."
        ru: "На тех же землях за это время пробудились другие народы — литовцы, украинцы и белорусы, — которые тоже хотели иметь собственные государства."
      - pl: " Na zachodzie granicę trzeba było wywalczyć z Niemcami, którzy nie chcieli oddać Wielkopolski, Pomorza i Śląska."
        ru: "На западе границу нужно было отвоевать у немцев, которые не хотели отдавать Великую Польшу, Поморье и Силезию."
        note: "wywalczyć — отвоевать, добиться борьбой"
      - pl: " Przez kilka lat Polska walczyła prawie jednocześnie na wszystkich swoich granicach."
        ru: "Несколько лет Польша воевала почти одновременно на всех своих границах."
    words: { "sięgała": siegac, "upadku": upadek, "narody": narod, "zachodzie": zachod, "jednocześnie": jednoczesnie }
  - clean: "Polscy politycy mieli dwie różne wizje przyszłego państwa. Dmowski chciał przyłączyć do Polski te ziemie, na których Polacy stanowili większość lub mogli ją w przyszłości stworzyć, a mniejszości narodowe miały się z czasem spolonizować. Piłsudski marzył o federacji wolnych narodów, które dawniej tworzyły Rzeczpospolitą, połączonych sojuszem przeciwko Rosji. Żadna z tych wizji nie została w pełni zrealizowana. Ostateczne granice wyznaczyły wojny, powstania, plebiscyty i decyzje wielkich mocarstw."
    draft: true
    chunks:
      - pl: "Polscy politycy mieli dwie różne wizje przyszłego państwa."
        ru: "У польских политиков были два разных видения будущего государства."
      - pl: " Dmowski chciał przyłączyć do Polski te ziemie, na których Polacy stanowili większość lub mogli ją w przyszłości stworzyć, a mniejszości narodowe miały się z czasem spolonizować."
        ru: "Дмовский хотел присоединить к Польше те земли, где поляки составляли большинство или могли создать его в будущем, а национальные меньшинства должны были со временем ополячиться."
        note: "spolonizować się — ополячиться"
      - pl: " Piłsudski marzył o federacji wolnych narodów, które dawniej tworzyły Rzeczpospolitą, połączonych sojuszem przeciwko Rosji."
        ru: "Пилсудский мечтал о федерации свободных народов, которые прежде составляли Речь Посполитую, объединённых союзом против России."
      - pl: " Żadna z tych wizji nie została w pełni zrealizowana."
        ru: "Ни одно из этих видений не было осуществлено полностью."
      - pl: " Ostateczne granice wyznaczyły wojny, powstania, plebiscyty i decyzje wielkich mocarstw."
        ru: "Окончательные границы определили войны, восстания, плебисциты и решения великих держав."
        note: "plebiscyt — плебисцит"
