  - clean: "Dla Ukraińców była to bolesna klęska. Ukraińska ludność Galicji nigdy nie pogodziła się z polskim panowaniem, a spór o te ziemie zatruwał stosunki obu narodów przez całe dwudziestolecie. Mocarstwa długo wahały się, czy przyznać wschodnią Galicję Polsce. Ostatecznie zrobiły to dopiero w 1923 roku, gdy Polska obiecała ukraińskiej ludności autonomię, której jednak nigdy nie wprowadzono."
    draft: true
    chunks:
      - pl: "Dla Ukraińców była to bolesna klęska."
        ru: "Для украинцев это было болезненное поражение."
      - pl: " Ukraińska ludność Galicji nigdy nie pogodziła się z polskim panowaniem, a spór o te ziemie zatruwał stosunki obu narodów przez całe dwudziestolecie."
        ru: "Украинское население Галиции так и не смирилось с польским владычеством, и спор об этих землях отравлял отношения двух народов все двадцать межвоенных лет."
        note: "zatruwać — отравлять"
      - pl: " Mocarstwa długo wahały się, czy przyznać wschodnią Galicję Polsce."
        ru: "Великие державы долго колебались, отдать ли Восточную Галицию Польше."
        note: "wahać się — колебаться"
      - pl: " Ostatecznie zrobiły to dopiero w 1923 roku, gdy Polska obiecała ukraińskiej ludności autonomię, której jednak nigdy nie wprowadzono."
        ru: "В конце концов они сделали это только в 1923 году, когда Польша пообещала украинскому населению автономию, которую, однако, так и не ввели."
    words: { "narodów": narod, "wschodnią": wschodni, "bolesna": bolesny, "pogodziła": pogodzic, "polskim": polski, "stosunki": stosunek, "wahały": wahac, "Ostatecznie": ostatecznie }
  - clean: "Na zachodzie najważniejsza była Wielkopolska, gdzie Polacy przez cały wiek prowadzili pracę organiczną i byli dobrze zorganizowani. Po upadku cesarstwa niemieckiego Polacy w Poznaniu utworzyli Naczelną Radę Ludową, która czekała na decyzję konferencji pokojowej. 26 grudnia 1918 roku do Poznania przyjechał Paderewski, a mieszkańcy powitali go wielką manifestacją z polskimi i alianckimi flagami. Następnego dnia doszło do strzelaniny z Niemcami, z której wybuchło powstanie."
    draft: true
    chunks:
