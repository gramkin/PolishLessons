  - clean: "Powstańcy w ciągu kilku dni opanowali Poznań, a w ciągu kilku tygodni prawie całą prowincję. Walczyli w nich byli żołnierze armii niemieckiej, którzy dobrze znali wojskowe rzemiosło, a pomagała im cała ludność. W lutym 1919 roku alianci zmusili Niemcy do zawieszenia broni, które objęło także front wielkopolski. Powstanie wielkopolskie było jednym z niewielu zwycięskich powstań w historii Polski. Armia wielkopolska, licząca kilkadziesiąt tysięcy żołnierzy, połączyła się później z wojskiem polskim i walczyła na innych frontach. Przez długi czas pamiętano o nim mniej niż o przegranych powstaniach, które bardziej pasowały do romantycznej tradycji."
    draft: true
    chunks:
      - pl: "Powstańcy w ciągu kilku dni opanowali Poznań, a w ciągu kilku tygodni prawie całą prowincję."
        ru: "Повстанцы за несколько дней овладели Познанью, а за несколько недель — почти всей провинцией."
      - pl: " Walczyli w nich byli żołnierze armii niemieckiej, którzy dobrze znali wojskowe rzemiosło, a pomagała im cała ludność."
        ru: "В их рядах сражались бывшие солдаты германской армии, хорошо знавшие военное ремесло, и им помогало всё население."
        note: "rzemiosło — ремесло"
      - pl: " W lutym 1919 roku alianci zmusili Niemcy do zawieszenia broni, które objęło także front wielkopolski."
        ru: "В феврале 1919 года союзники заставили Германию заключить перемирие, распространившееся и на великопольский фронт."
        note: "zawieszenie broni — прекращение огня"
      - pl: " Powstanie wielkopolskie było jednym z niewielu zwycięskich powstań w historii Polski."
        ru: "Великопольское восстание было одним из немногих победоносных восстаний в истории Польши."
      - pl: " Armia wielkopolska, licząca kilkadziesiąt tysięcy żołnierzy, połączyła się później z wojskiem polskim i walczyła na innych frontach."
        ru: "Великопольская армия численностью в несколько десятков тысяч солдат позже влилась в польское войско и воевала на других фронтах."
      - pl: " Przez długi czas pamiętano o nim mniej niż o przegranych powstaniach, które bardziej pasowały do romantycznej tradycji."
