      - pl: " Po upadku cesarstwa niemieckiego Polacy w Poznaniu utworzyli Naczelną Radę Ludową, która czekała na decyzję konferencji pokojowej."
        ru: "После падения Германской империи поляки в Познани создали Верховный народный совет, который ждал решения мирной конференции."
      - pl: " 26 grudnia 1918 roku do Poznania przyjechał Paderewski, a mieszkańcy powitali go wielką manifestacją z polskimi i alianckimi flagami."
        ru: "26 декабря 1918 года в Познань приехал Падеревский, и жители встретили его большой демонстрацией с польскими и союзническими флагами."
        note: "aliancki — союзнический (Антанты)"
      - pl: " Następnego dnia doszło do strzelaniny z Niemcami, z której wybuchło powstanie."
