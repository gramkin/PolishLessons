  - clean: "Pierwsze walki wybuchły we Lwowie, jeszcze zanim Piłsudski wrócił do Warszawy. Miasto było w większości polskie i żydowskie, ale otaczały je wsie ukraińskie, a Ukraińcy uważali Lwów za stolicę swojego narodu. 1 listopada 1918 roku oddziały ukraińskie zajęły najważniejsze budynki w mieście i ogłosiły powstanie Zachodnioukraińskiej Republiki Ludowej. Polacy we Lwowie nie mieli prawie żadnych wojsk, ale bronić się zaczęli sami mieszkańcy. Wśród obrońców było wielu uczniów, studentów, a nawet dzieci, które nazwano później Orlętami Lwowskimi. Najmłodszy z poległych, Antoś Petrykiewicz, miał zaledwie trzynaście lat."
    draft: true
    chunks:
      - pl: "Pierwsze walki wybuchły we Lwowie, jeszcze zanim Piłsudski wrócił do Warszawy."
        ru: "Первые бои вспыхнули во Львове ещё до того, как Пилсудский вернулся в Варшаву."
      - pl: " Miasto było w większości polskie i żydowskie, ale otaczały je wsie ukraińskie, a Ukraińcy uważali Lwów za stolicę swojego narodu."
        ru: "Город был в большинстве польским и еврейским, но его окружали украинские сёла, и украинцы считали Львов столицей своего народа."
      - pl: " 1 listopada 1918 roku oddziały ukraińskie zajęły najważniejsze budynki w mieście i ogłosiły powstanie Zachodnioukraińskiej Republiki Ludowej."
        ru: "1 ноября 1918 года украинские отряды заняли важнейшие здания города и провозгласили создание Западно-Украинской народной республики."
      - pl: " Polacy we Lwowie nie mieli prawie żadnych wojsk, ale bronić się zaczęli sami mieszkańcy."
        ru: "У поляков во Львове почти не было войск, но защищаться начали сами жители."
      - pl: " Wśród obrońców było wielu uczniów, studentów, a nawet dzieci, które nazwano później Orlętami Lwowskimi."
        ru: "Среди защитников было много школьников, студентов и даже детей, которых позже назвали «Львовскими орлятами»."
        note: "orlę — орлёнок"
      - pl: " Najmłodszy z poległych, Antoś Petrykiewicz, miał zaledwie trzynaście lat."
        ru: "Самому юному из павших, Антосю Петрикевичу, было всего тринадцать лет."
    words: { "wybuchły": wybuchnac, "polskie": polski, "żydowskie": zydowski, "otaczały": otaczac, "wsie": wies, "stolicę": stolica, "narodu": narod, "listopada": listopad, "ogłosiły": oglosic, "wojsk": wojsko, "mieszkańcy": mieszkaniec, "obrońców": obronca, "uczniów": uczen, "studentów": student, "zaledwie": zaledwie }
  - clean: "Po trzech tygodniach walk do miasta dotarła odsiecz z Przemyśla i Ukraińcy wycofali się ze Lwowa. Zaraz potem w żydowskiej dzielnicy miasta doszło do pogromu. Żołnierze, cywile i przestępcy przez dwa dni rabowali sklepy i domy i zabili kilkudziesięciu, a według niektórych źródeł ponad stu Żydów. Wiadomość o pogromie obiegła cały świat i bardzo zaszkodziła opinii o nowym państwie. Obrona Lwowa stała się jedną z najważniejszych legend Polski międzywojennej, a cmentarz Orląt, na którym pochowano młodych obrońców, był miejscem narodowej pamięci."
    draft: true
    chunks:
      - pl: "Po trzech tygodniach walk do miasta dotarła odsiecz z Przemyśla i Ukraińcy wycofali się ze Lwowa."
        ru: "После трёх недель боёв к городу подошла подмога из Перемышля, и украинцы отступили из Львова."
        note: "odsiecz — подмога, выручка (осаждённым)"
      - pl: " Zaraz potem w żydowskiej dzielnicy miasta doszło do pogromu."
        ru: "Сразу после этого в еврейском квартале города произошёл погром."
      - pl: " Żołnierze, cywile i przestępcy przez dwa dni rabowali sklepy i domy i zabili kilkudziesięciu, a według niektórych źródeł ponad stu Żydów."
        ru: "Солдаты, гражданские и преступники два дня грабили лавки и дома и убили несколько десятков, а по некоторым источникам больше ста евреев."
        note: "rabować — грабить"
      - pl: " Wiadomość o pogromie obiegła cały świat i bardzo zaszkodziła opinii o nowym państwie."
        ru: "Весть о погроме облетела весь мир и очень повредила репутации нового государства."
      - pl: " Obrona Lwowa stała się jedną z najważniejszych legend Polski międzywojennej, a cmentarz Orląt, na którym pochowano młodych obrońców, był miejscem narodowej pamięci."
        ru: "Оборона Львова стала одной из важнейших легенд межвоенной Польши, а кладбище Орлят, где похоронили юных защитников, было местом национальной памяти."
    words: { "obrońców": obronca, "żydowskiej": zydowski, "dzielnicy": dzielnica, "cywile": cywil, "przestępcy": przestepca, "zaszkodziła": zaszkodzic, "opinii": opinia, "legend": legenda, "cmentarz": cmentarz, "pochowano": pochowac, "narodowej": narodowy }
  - clean: "Walki o Lwów były tylko początkiem wojny polsko-ukraińskiej, która objęła całą wschodnią Galicję. Przez wiele miesięcy Lwów był otoczony przez wojska ukraińskie, które ostrzeliwały miasto i przerywały połączenie z resztą kraju. Ukraińska Armia Halicka była dobrze zorganizowana, bo wielu jej żołnierzy służyło wcześniej w armii austriackiej. Wiosną 1919 roku do Polski przybyła z Francji Błękitna Armia generała Hallera, dobrze uzbrojona i wyszkolona. Alianci chcieli, żeby walczyła z bolszewikami, ale polskie dowództwo wysłało ją także przeciwko Ukraińcom. W lipcu 1919 roku wojska polskie zajęły całą wschodnią Galicję aż po rzekę Zbrucz."
    draft: true
    chunks:
      - pl: "Walki o Lwów były tylko początkiem wojny polsko-ukraińskiej, która objęła całą wschodnią Galicję."
        ru: "Бои за Львов были лишь началом польско-украинской войны, охватившей всю Восточную Галицию."
      - pl: " Przez wiele miesięcy Lwów był otoczony przez wojska ukraińskie, które ostrzeliwały miasto i przerywały połączenie z resztą kraju."
        ru: "Много месяцев Львов был окружён украинскими войсками, которые обстреливали город и перерывали сообщение с остальной страной."
        note: "ostrzeliwać — обстреливать"
      - pl: " Ukraińska Armia Halicka była dobrze zorganizowana, bo wielu jej żołnierzy służyło wcześniej w armii austriackiej."
        ru: "Украинская галицкая армия была хорошо организована, потому что многие её солдаты прежде служили в австрийской армии."
      - pl: " Wiosną 1919 roku do Polski przybyła z Francji Błękitna Armia generała Hallera, dobrze uzbrojona i wyszkolona."
        ru: "Весной 1919 года из Франции в Польшу прибыла Голубая армия генерала Галлера, хорошо вооружённая и обученная."
      - pl: " Alianci chcieli, żeby walczyła z bolszewikami, ale polskie dowództwo wysłało ją także przeciwko Ukraińcom."
        ru: "Союзники хотели, чтобы она воевала с большевиками, но польское командование отправило её и против украинцев."
      - pl: " W lipcu 1919 roku wojska polskie zajęły całą wschodnią Galicję aż po rzekę Zbrucz."
        ru: "В июле 1919 года польские войска заняли всю Восточную Галицию до реки Збруч."
