# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 25
chapterTitle: "Pieśń XXV"
chapterTitleRu: "Песнь XXV. Превращения"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok VII. Ciąg dalszy: Przemiana.)"
    chunks:
      - pl: "(Krąg VIII. Tłumok VII. Ciąg dalszy: Przemiana.)"
        ru: "(Круг VIII. Ров VII. Продолжение: превращение.)"
        note: "przemiana — превращение"
    words: { "Krąg": krag, "Ciąg": ciag, "dalszy": daleki, "Przemiana": przemiana }
  - clean: "To rzekłszy, złodziej podniósł pięści obie,\nW każdej sterczała figa jak gwint w śrubie,\nA krzyczał bluźniąc: «Boże, przyjm to sobie!»\nWtem wąż, i za to odtąd wężów lubię,\nŚcisnął za szyję bluźniercę, oszusta,\nJakby rzekł: «Więcej nie zbluźnią twe usta»."
    verse: true
    chunks:
      - pl: "To rzekłszy, złodziej podniósł pięści obie,"
        ru: "Сказав это, вор поднял оба кулака,"
      - pl: "\nW każdej sterczała figa jak gwint w śrubie,"
        ru: "в каждом торчал кукиш, как винт в шурупе,"
        note: "figa — кукиш; gwint — резьба; śruba — винт"
      - pl: "\nA krzyczał bluźniąc: «Boże, przyjm to sobie!»"
        ru: "и кричал, богохульствуя: «Боже, прими это себе!»"
      - pl: "\nWtem wąż, i za to odtąd wężów lubię,"
        ru: "Тут змей — и за это с тех пор я змей люблю —"
        note: "wężów — устар. вин. мн., ныне węże"
      - pl: "\nŚcisnął za szyję bluźniercę, oszusta,"
        ru: "сжал за шею богохульника, обманщика,"
      - pl: "\nJakby rzekł: «Więcej nie zbluźnią twe usta»."
        ru: "будто сказал: «Больше не будут хулить твои уста»."
        note: "zbluźnić — хулить"
    words: { "rzekłszy": rzec, "pięści": piesc, "odtąd": odtad, "wężów": waz, "szyję": szyja, "oszusta": oszust }
  - clean: "Drugi ramiona w węzły i pierścienie\nTak jemu związał i gryzł jego ręce,\nŻe stał, jak gdyby skamieniały w męce.\nPistojo! Zatlij żagwie w oka mgnieniu,\nSpal sama siebie i zniknij w płomieniu,\nGdy w złym tak lubi płużyć twe nasienie."
    verse: true
    chunks:
      - pl: "Drugi ramiona w węzły i pierścienie"
        ru: "Другой ему руки в узлы и кольца"
        note: "pierścień — кольцо"
      - pl: "\nTak jemu związał i gryzł jego ręce,"
        ru: "так связал и кусал ему руки,"
      - pl: "\nŻe stał, jak gdyby skamieniały w męce."
        ru: "что он стоял, как будто окаменевший в муке."
        note: "skamieniały — окаменевший"
      - pl: "\nPistojo! Zatlij żagwie w oka mgnieniu,"
        ru: "Пистойя! Зажги головни в мгновение ока,"
        note: "zatlić — зажечь"
      - pl: "\nSpal sama siebie i zniknij w płomieniu,"
        ru: "сожги сама себя и исчезни в пламени,"
      - pl: "\nGdy w złym tak lubi płużyć twe nasienie."
        ru: "раз твоё семя так любит процветать во зле."
        note: "płużyć — процветать"
    words: { "węzły": wezel, "pierścienie": pierscien, "związał": zwiazac, "Spal": spalic, "płomieniu": plomien, "nasienie": nasienie }
  - clean: "Pomiędzy piekła czarnymi kręgami\nDuch takiej pychy nie był wobec Boga,\nNawet bluźnierca, co legł pod Tebami.\nZłodziej zmykając, nie przemówił słowa.\nBiegł za złodziejem Centaur, pogoń nowa,\nKrzycząc: «Gdzie pyszny? Krótka jego droga!»"
    verse: true
    chunks:
      - pl: "Pomiędzy piekła czarnymi kręgami"
        ru: "Среди всех чёрных кругов ада"
      - pl: "\nDuch takiej pychy nie był wobec Boga,"
        ru: "ни один дух не был столь горд перед Богом,"
      - pl: "\nNawet bluźnierca, co legł pod Tebami."
        ru: "даже богохульник, что пал под Фивами."
        note: "Капаней"
      - pl: "\nZłodziej zmykając, nie przemówił słowa."
        ru: "Вор, удирая, не сказал ни слова."
        note: "zmykać — удирать"
      - pl: "\nBiegł za złodziejem Centaur, pogoń nowa,"
        ru: "За вором бежал кентавр, новая погоня,"
      - pl: "\nKrzycząc: «Gdzie pyszny? Krótka jego droga!»"
        ru: "крича: «Где гордец? Короток его путь!»"
    words: { "Złodziej": zlodziej, "przemówił": przemowic, "Biegł": biec, "Krzycząc": krzyczec, "pyszny": pyszny, "Krótka": krotki }
  - clean: "Wątpię, czy tyle jest gadów w Maremmie,\nIle tam wężów krzyż dźwigał Centaura,\nSkąd się poczyna człowiecza figura.\nNa jego barkach z rozpiętymi skrzydły,\nBuchając ogniem, siedział smok obrzydły,\nKto się doń zbliżał, trząsł żary na ziemię."
    verse: true
    chunks:
      - pl: "Wątpię, czy tyle jest gadów w Maremmie,"
        ru: "Сомневаюсь, что в Маремме столько гадов,"
      - pl: "\nIle tam wężów krzyż dźwigał Centaura,"
        ru: "сколько там змей нёс хребет кентавра,"
        note: "dźwigać — нести"
      - pl: "\nSkąd się poczyna człowiecza figura."
        ru: "до места, где начинается человеческий облик."
      - pl: "\nNa jego barkach z rozpiętymi skrzydły,"
        ru: "На его плечах, с распростёртыми крыльями,"
        note: "skrzydły — старое твор. мн."
      - pl: "\nBuchając ogniem, siedział smok obrzydły,"
        ru: "изрыгая огонь, сидел мерзкий дракон,"
      - pl: "\nKto się doń zbliżał, trząsł żary na ziemię."
        ru: "кто к нему приближался, тряс угли на землю."
    words: { "Wątpię": watpic, "krzyż": krzyz, "ogniem": ogien, "smok": smok, "zbliżał": zblizac, "trząsł": trzasc }
  - clean: "Mistrz rzekł: «To Kakus w Centaura postaci,\nZ jego przyczyny awentyńskie skały\nCzęsto się krwawą posoką zbrukały;\nOn się oddzielił od reszty swej braci,\nBo jak wilk chytrze pasterzy napadał,\nSąsiednie trzody rad po nocach kradał,\nLecz dożył końca, złe broił niedługo."
    verse: true
    chunks:
      - pl: "Mistrz rzekł: «To Kakus w Centaura postaci,"
        ru: "Учитель сказал: «Это Как в облике кентавра,"
        note: "Kakus — Как, сын Вулкана"
      - pl: "\nZ jego przyczyny awentyńskie skały"
        ru: "по его вине Авентинские скалы"
        note: "awentyński — авентинский"
      - pl: "\nCzęsto się krwawą posoką zbrukały;"
        ru: "часто пятнались кровью;"
        note: "posoka — кровь"
      - pl: "\nOn się oddzielił od reszty swej braci,"
        ru: "он отделился от прочих своих братьев,"
      - pl: "\nBo jak wilk chytrze pasterzy napadał,"
        ru: "ибо, как волк, хитро нападал на пастухов,"
      - pl: "\nSąsiednie trzody rad po nocach kradał,"
        ru: "соседние стада охотно по ночам крал,"
      - pl: "\nLecz dożył końca, złe broił niedługo."
        ru: "но дожил до конца, недолго творил зло."
        note: "broić złe — творить зло"
    words: { "postaci": postac, "przyczyny": przyczyna, "skały": skala, "krwawą": krwawy, "wilk": wilk, "trzody": trzoda }
  - clean: "Sto razy ciął go Herkules maczugą,\nChoć tych cięć nie czuł i dziesiątej części».\nJuż Centaur zniknął, gdy mistrz ciągnął mowę.\nWtenczas pod nami jakieś duchy nowe\nBiegły samotrzeć, a każdy był nagi;\nWodza i mojej uszliby uwagi,\nGdy krzyk ich dziko w uszach nam zachrzęści:\n«Kto wy jesteście?» Mistrz z zapałem żywym\nMówiący, mowę przerwał w oka mgnieniu."
    verse: true
    chunks:
      - pl: "Sto razy ciął go Herkules maczugą,"
        ru: "Сто раз ударил его Геракл палицей,"
        note: "maczuga — палица"
      - pl: "\nChoć tych cięć nie czuł i dziesiątej części»."
        ru: "хоть он не почувствовал и десятой части этих ударов»."
        note: "у Данте Как умер уже от десятого"
      - pl: "\nJuż Centaur zniknął, gdy mistrz ciągnął mowę."
        ru: "Уже кентавр исчез, когда учитель продолжал речь."
      - pl: "\nWtenczas pod nami jakieś duchy nowe"
        ru: "Тогда под нами какие-то новые духи"
      - pl: "\nBiegły samotrzeć, a każdy był nagi;"
        ru: "бежали втроём, и каждый был наг;"
        note: "samotrzeć — втроём"
      - pl: "\nWodza i mojej uszliby uwagi,"
        ru: "они ускользнули бы от внимания вождя и моего,"
        note: "ujść uwagi — ускользнуть от внимания"
      - pl: "\nGdy krzyk ich dziko w uszach nam zachrzęści:"
        ru: "если бы их крик дико не хрустнул нам в уши:"
        note: "zachrzęścić — хрустнуть"
      - pl: "\n«Kto wy jesteście?» Mistrz z zapałem żywym"
        ru: "«Кто вы такие?» Учитель, говоривший с живым жаром,"
      - pl: "\nMówiący, mowę przerwał w oka mgnieniu."
        ru: "прервал речь в мгновение ока."
    words: { "ciął": ciac, "cięć": ciecie, "ciągnął": ciagnac, "Wodza": wodz, "uszliby": ujsc, "krzyk": krzyk }
  - clean: "Ja ich nie znałem, lecz trafem szczęśliwym\nJeden drugiego nazwał po imieniu,\nGdy rzekł: «Cianfa, gdzieżeś? Ja tu jestem».\nUwagę mistrza chcąc zaostrzyć gestem,\nPod nos od brody przytknąłem mój palec.\nJeśli z pół wiarą będziesz, czytelniku,\nSłuchał, co powiem, tych dziwów bez liku,\nNic w tym dziwnego, bo wyznam ci szczerze,\nJa, com to widział, sam zaledwo wierzę."
    verse: true
    chunks:
      - pl: "Ja ich nie znałem, lecz trafem szczęśliwym"
        ru: "Я их не знал, но счастливым случаем"
        note: "traf — случай"
      - pl: "\nJeden drugiego nazwał po imieniu,"
        ru: "один назвал другого по имени,"
      - pl: "\nGdy rzekł: «Cianfa, gdzieżeś? Ja tu jestem»."
        ru: "когда сказал: «Чанфа, где ты? Я здесь»."
        note: "gdzieżeś — где же ты"
      - pl: "\nUwagę mistrza chcąc zaostrzyć gestem,"
        ru: "Желая жестом обострить внимание учителя,"
      - pl: "\nPod nos od brody przytknąłem mój palec."
        ru: "я приложил палец от подбородка к носу."
        note: "przytknąć — приложить; знак «молчи»"
      - pl: "\nJeśli z pół wiarą będziesz, czytelniku,"
        ru: "Если с неполной верой ты будешь, читатель,"
      - pl: "\nSłuchał, co powiem, tych dziwów bez liku,"
        ru: "слушать то, что я скажу, — этих чудес без счёта,"
      - pl: "\nNic w tym dziwnego, bo wyznam ci szczerze,"
        ru: "в этом нет ничего странного, ибо признаюсь тебе откровенно:"
      - pl: "\nJa, com to widział, sam zaledwo wierzę."
        ru: "я, видевший это, сам едва верю."
    words: { "mistrza": mistrz, "gestem": gest, "palec": palec, "wiarą": wiara, "wyznam": wyznac, "szczerze": szczerze }
  - clean: "Gdym na te duchy oczy me obrócił,\nWąż sześcionożny, potworny padalec,\nZ przodu jednemu aż na piersi wskoczył\nI na nim cały sam sobą zawisnął.\nWnet mu średnimi łapami brzuch ścisnął,\nPrzednie jak uścisk na barki zarzucił,\nGryzł mu policzki i we krwi pysk broczył."
    verse: true
    chunks:
      - pl: "Gdym na te duchy oczy me obrócił,"
        ru: "Когда я обратил глаза на этих духов,"
      - pl: "\nWąż sześcionożny, potworny padalec,"
        ru: "шестиногий змей, чудовищная гадина,"
        note: "padalec — веретеница, здесь «гадина»"
      - pl: "\nZ przodu jednemu aż na piersi wskoczył"
        ru: "спереди вскочил одному прямо на грудь"
      - pl: "\nI na nim cały sam sobą zawisnął."
        ru: "и весь на нём повис."
      - pl: "\nWnet mu średnimi łapami brzuch ścisnął,"
        ru: "Тотчас средними лапами сжал ему живот,"
      - pl: "\nPrzednie jak uścisk na barki zarzucił,"
        ru: "передние, как объятие, закинул на плечи,"
      - pl: "\nGryzł mu policzki i we krwi pysk broczył."
        ru: "грыз ему щёки и пастью обливал кровью."
        note: "broczyć — обливать кровью"
    words: { "obrócił": obrocic, "wskoczył": wskoczyc, "Przednie": przedni, "uścisk": uscisk, "policzki": policzek, "pysk": pysk }
  - clean: "Potem, gdy tylne łapy uda gniotły,\nPomiędzy nogi wśliznął się ogonem,\nKtórym wzdłuż krzyża wodził przez pacierze;\nNigdy bluszcz silniej ramieniem zielonem\nNie splótł się z drzewem, jak z nim ten gad-zwierze.\nDwie te istoty tak razem się splotły,\nTak się stopiły z sobą dwa stworzenia,\nJak wosk przygrzany gorącem płomienia,\nI barwy swoje pospołu zmieszały:\nTak papier, upał gdy czuje pożarny,\nSkręca się w zwoje, jeszcze nie jest czarny,\nWięcej brunatny, ale już nie biały."
    verse: true
    chunks:
      - pl: "Potem, gdy tylne łapy uda gniotły,"
        ru: "Потом, когда задние лапы давили бёдра,"
        note: "gnieść — давить"
      - pl: "\nPomiędzy nogi wśliznął się ogonem,"
        ru: "просунул хвост между ног,"
        note: "wśliznąć się — проскользнуть"
      - pl: "\nKtórym wzdłuż krzyża wodził przez pacierze;"
        ru: "которым водил вдоль крестца по хребту;"
        note: "krzyż — крестец; pacierze — позвонки"
      - pl: "\nNigdy bluszcz silniej ramieniem zielonem"
        ru: "никогда плющ сильнее зелёной ветвью"
        note: "bluszcz — плющ"
      - pl: "\nNie splótł się z drzewem, jak z nim ten gad-zwierze."
        ru: "не сплетался с деревом, как с ним этот гад-зверь."
      - pl: "\nDwie te istoty tak razem się splotły,"
        ru: "Эти два существа так сплелись вместе,"
      - pl: "\nTak się stopiły z sobą dwa stworzenia,"
        ru: "так сплавились друг с другом два создания,"
        note: "stopić się — сплавиться"
      - pl: "\nJak wosk przygrzany gorącem płomienia,"
        ru: "как воск, разогретый жаром пламени,"
        note: "wosk — воск"
      - pl: "\nI barwy swoje pospołu zmieszały:"
        ru: "и цвета свои вместе смешали:"
      - pl: "\nTak papier, upał gdy czuje pożarny,"
        ru: "так бумага, когда чувствует жгучий жар,"
        note: "pożarny — пожарный, жгучий"
      - pl: "\nSkręca się w zwoje, jeszcze nie jest czarny,"
        ru: "скручивается в свитки, она ещё не чёрная,"
        note: "zwój — свиток"
      - pl: "\nWięcej brunatny, ale już nie biały."
        ru: "скорее бурая, но уже не белая."
        note: "brunatny — бурый"
    words: { "tylne": tylny, "ogonem": ogon, "wodził": wodzic, "zwierze": zwierz, "zmieszały": zmieszac, "zwoje": zwoj }
  - clean: "Dwaj drudzy patrząc, z podziwu krzyknęli:\n«Jak ty zmieniony, spojrzyj, o Agneli!\nNi w dwóch, ni jeden!» Już ich obie głowy\nStały się jedną, patrzącym się zdało,\nŻe gad i człowiek tworzył jedno ciało:\nZe czterech ramion dwa tylko zostało;\nBrzuch, tułów cały, lędźwie i golenie,\nTworzyły widok cudacki i nowy,\nTakie potworne było przemienienie!"
    verse: true
    chunks:
      - pl: "Dwaj drudzy patrząc, z podziwu krzyknęli:"
        ru: "Двое других, глядя, закричали от изумления:"
        note: "podziw — изумление"
      - pl: "\n«Jak ty zmieniony, spojrzyj, o Agneli!"
        ru: "«Как ты изменился, взгляни, о Аньело!"
      - pl: "\nNi w dwóch, ni jeden!» Już ich obie głowy"
        ru: "Ни двое, ни один!» Уже обе их головы"
      - pl: "\nStały się jedną, patrzącym się zdało,"
        ru: "стали одной, смотрящим показалось,"
      - pl: "\nŻe gad i człowiek tworzył jedno ciało:"
        ru: "что гад и человек составляли одно тело:"
      - pl: "\nZe czterech ramion dwa tylko zostało;"
        ru: "из четырёх рук осталось только две;"
      - pl: "\nBrzuch, tułów cały, lędźwie i golenie,"
        ru: "живот, всё туловище, чресла и голени"
        note: "tułów — туловище; lędźwie — чресла; goleń — голень"
      - pl: "\nTworzyły widok cudacki i nowy,"
        ru: "создавали вид диковинный и новый,"
        note: "cudacki — диковинный"
      - pl: "\nTakie potworne było przemienienie!"
        ru: "такое чудовищное было превращение!"
    words: { "zdało": zdac, "tworzył": tworzyc, "ciało": cialo, "ramion": ramie, "Brzuch": brzuch, "widok": widok }
  - clean: "I kształt przyrodny tak przeobrażony,\nChwiejąc się krokiem w te i owe strony,\nOdszedł leniwo, niestety, po czasie!\nA jak jaszczurka, w skwarny dzień lipcowy\nGdy krzak przemienia, pełna zwinnych ruchów,\nSkacząc przez drogę błyskawicą zda się;\nTak mała żmija jednemu z dwóch duchów,\nNa brzuch skoczyła, świecąc na pół czarną,\nPół modrą skórą, jakby pieprzu ziarno."
    verse: true
    chunks:
      - pl: "I kształt przyrodny tak przeobrażony,"
        ru: "И природный образ, так преображённый,"
        note: "kształt przyrodny — природный облик"
      - pl: "\nChwiejąc się krokiem w te i owe strony,"
        ru: "шатаясь, шагая туда и сюда,"
      - pl: "\nOdszedł leniwo, niestety, po czasie!"
        ru: "ушёл медленно, увы, слишком поздно!"
        note: "po czasie — с опозданием"
      - pl: "\nA jak jaszczurka, w skwarny dzień lipcowy"
        ru: "А как ящерица в знойный июльский день,"
        note: "jaszczurka — ящерица; skwarny — знойный"
      - pl: "\nGdy krzak przemienia, pełna zwinnych ruchów,"
        ru: "когда меняет куст, полная ловких движений,"
      - pl: "\nSkacząc przez drogę błyskawicą zda się;"
        ru: "прыгая через дорогу, кажется молнией;"
      - pl: "\nTak mała żmija jednemu z dwóch duchów,"
