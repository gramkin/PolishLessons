# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 20
chapterTitle: "Pieśń XX"
chapterTitleRu: "Песнь XX. Гуго Капет"
level: B2
paragraphs:
  - clean: "(Hugo Kapet. O godności papieża.)"
    chunks:
      - pl: "(Hugo Kapet. O godności papieża.)"
        ru: "(Гуго Капет. О достоинстве папы.)"
    words: { "godności": godnosc, "papieża": papiez }
  - clean: "Naprzeciw lepszej woli nie bez szkody\nWola bój toczy; przeto dając ucha,\nKosztem mej chęci, zgodnie z chęcią ducha,\nWpół suchą gąbkę wydobyłem z wody.\nI szliśmy z wodzem miejscem w skale wolnym,\nJak gzymsowaniem wąskim i okolnym;\nBo duchy łzami, co z ich ócz spadały,\nMiękcząc zło, które owładło świat cały,\nNa dłuż zajęły brzeg drugi tej skały."
    verse: true
    chunks:
      - pl: "Naprzeciw lepszej woli nie bez szkody"
        ru: "Против лучшей воли не без вреда"
      - pl: "\nWola bój toczy; przeto dając ucha,"
        ru: "воля ведёт борьбу; поэтому, внимая,"
        note: "то есть желание Адриана сильнее моего"
      - pl: "\nKosztem mej chęci, zgodnie z chęcią ducha,"
        ru: "в ущерб своему желанию, в согласии с желанием духа,"
      - pl: "\nWpół suchą gąbkę wydobyłem z wody."
        ru: "я вынул из воды полусухую губку."
        note: "gąbka — губка; не насытил любопытства"
      - pl: "\nI szliśmy z wodzem miejscem w skale wolnym,"
        ru: "И мы шли с вождём по свободному месту в скале,"
      - pl: "\nJak gzymsowaniem wąskim i okolnym;"
        ru: "как по узкому и окружному карнизу;"
        note: "gzymsowanie — карниз"
      - pl: "\nBo duchy łzami, co z ich ócz spadały,"
        ru: "ибо духи слезами, что падали из их глаз,"
      - pl: "\nMiękcząc zło, które owładło świat cały,"
        ru: "смягчая зло, что овладело всем миром,"
      - pl: "\nNa dłuż zajęły brzeg drugi tej skały."
        ru: "заняли в длину другой край этой скалы."
    words: { "toczy": toczyc, "suchą": suchy, "wydobyłem": wydobyc, "wodzem": wodz, "brzeg": brzeg, "skały": skala }
  - clean: "Bądź, starożytna wilczyco, przeklęta,\nChciwsza w twym głodzie nad wszystkie zwierzęta.\nO niebo! które swym ruchem, jak zda się,\nWszystko, co ziemskie, odmieniasz nam w czasie.\nMów, pożądany, o, kiedyż się zjawi,\nCo tę wilczycę spłoszy lub zadławi?"
    verse: true
    chunks:
      - pl: "Bądź, starożytna wilczyco, przeklęta,"
        ru: "Будь проклята, древняя волчица,"
        note: "жадность"
      - pl: "\nChciwsza w twym głodzie nad wszystkie zwierzęta."
        ru: "более алчная в своём голоде, чем все звери."
      - pl: "\nO niebo! które swym ruchem, jak zda się,"
        ru: "О небо! что своим движением, как кажется,"
      - pl: "\nWszystko, co ziemskie, odmieniasz nam w czasie."
        ru: "меняешь нам во времени всё земное."
      - pl: "\nMów, pożądany, o, kiedyż się zjawi,"
        ru: "Скажи, о желанный, когда же явится тот,"
      - pl: "\nCo tę wilczycę spłoszy lub zadławi?"
        ru: "кто эту волчицу спугнёт или задушит?"
        note: "zadławić — задушить"
    words: { "starożytna": starozytny, "przeklęta": przeklety, "głodzie": glod, "ziemskie": ziemski, "zjawi": zjawic, "spłoszy": sploszyc }
  - clean: "A szliśmy wolnym i mierzonym krokiem,\nNa cienie bacznym poglądałem okiem,\nBolejąc nad ich płaczem i żalami.\n«Słodka Maryjo!» głos jęknął przed nami,\nJakby rodzącej niewiasty jękami.\nGłos dalej mówił: «Ty byłaś ubogą,\nIle ze żłobu ludzie sądzić mogą,\nW którym złożyłaś twój ciężar tak święty!»"
    verse: true
    chunks:
      - pl: "A szliśmy wolnym i mierzonym krokiem,"
        ru: "А мы шли медленным и размеренным шагом,"
      - pl: "\nNa cienie bacznym poglądałem okiem,"
        ru: "внимательным взглядом я поглядывал на тени,"
      - pl: "\nBolejąc nad ich płaczem i żalami."
        ru: "скорбя над их плачем и жалобами."
      - pl: "\n«Słodka Maryjo!» głos jęknął przed nami,"
        ru: "«Сладкая Мария!» — простонал голос перед нами,"
      - pl: "\nJakby rodzącej niewiasty jękami."
        ru: "словно стонами рожающей женщины."
      - pl: "\nGłos dalej mówił: «Ty byłaś ubogą,"
        ru: "Голос продолжал: «Ты была бедной,"
      - pl: "\nIle ze żłobu ludzie sądzić mogą,"
        ru: "насколько люди могут судить по яслям,"
        note: "żłób — ясли"
      - pl: "\nW którym złożyłaś twój ciężar tak święty!»"
        ru: "в которые ты положила свою столь святую ношу!»"
    words: { "mierzonym": mierzyc, "płaczem": placz, "żalami": zal, "niewiasty": niewiasta, "ubogą": ubogi, "ciężar": ciezar }
  - clean: "Głos potem dodał: «Fabrycjusz nad złoto\nPrzeniósł ubóstwo ożenione z cnotą».\nW tych słowach czułem urok niepojęty.\nWięc krok mój naprzód pomknęła chęć nowa,\nBy poznać ducha, co mówił te słowa.\nDuch się unosił jeszcze nad szczodrotą\nBiskupa z Miry, co ubogie panny\nWspierał, by wiodły żywot nienaganny."
    verse: true
    chunks:
      - pl: "Głos potem dodał: «Fabrycjusz nad złoto"
        ru: "Голос потом добавил: «Фабриций выше золота"
      - pl: "\nPrzeniósł ubóstwo ożenione z cnotą»."
        ru: "поставил бедность, обручённую с добродетелью»."
      - pl: "\nW tych słowach czułem urok niepojęty."
        ru: "В этих словах я чувствовал непостижимое очарование."
      - pl: "\nWięc krok mój naprzód pomknęła chęć nowa,"
        ru: "И новое желание двинуло мой шаг вперёд,"
      - pl: "\nBy poznać ducha, co mówił te słowa."
        ru: "чтобы узнать духа, что говорил эти слова."
      - pl: "\nDuch się unosił jeszcze nad szczodrotą"
        ru: "Дух ещё восхищался щедростью"
      - pl: "\nBiskupa z Miry, co ubogie panny"
        ru: "епископа из Миры, что бедных девушек"
        note: "святой Николай"
      - pl: "\nWspierał, by wiodły żywot nienaganny."
        ru: "поддерживал, чтобы они вели безупречную жизнь."
        note: "nienaganny — безупречный"
    words: { "dodał": dodac, "ożenione": ozenic, "urok": urok, "naprzód": naprzod, "chęć": chec, "Wspierał": wspierac }
  - clean: "«Duchu, co mówisz tak dobrze!» do niego\nRzekłem, «kim byłeś, powiedz, i dlaczego\nTu jesteś jeden, co w pamięć bogaty,\nTak zasłużone odnawiasz pochwały?\nNie będą słowa twoje bez zapłaty,\nJeśli powrócę kończyć krótkie życie,\nKtóre do kresu swojego tak leci!»"
    verse: true
    chunks:
      - pl: "«Duchu, co mówisz tak dobrze!» do niego"
        ru: "«Дух, что говоришь так хорошо! — сказал я ему, —"
      - pl: "\nRzekłem, «kim byłeś, powiedz, i dlaczego"
        ru: "кем ты был, скажи, и почему"
      - pl: "\nTu jesteś jeden, co w pamięć bogaty,"
        ru: "ты здесь один, богатый памятью,"
      - pl: "\nTak zasłużone odnawiasz pochwały?"
        ru: "обновляешь столь заслуженные похвалы?"
      - pl: "\nNie będą słowa twoje bez zapłaty,"
        ru: "Не будут твои слова без награды,"
      - pl: "\nJeśli powrócę kończyć krótkie życie,"
        ru: "если я вернусь окончить короткую жизнь,"
      - pl: "\nKtóre do kresu swojego tak leci!»"
        ru: "что так летит к своему пределу!»"
    words: { "Rzekłem": rzec, "bogaty": bogaty, "zasłużone": zasluzyc, "zapłaty": zaplata, "powrócę": powrocic, "kresu": kres }
  - clean: "— «Odpowiem tobie», duch mówił w zachwycie;\n«Nie dla pomocy, darmo jej życzycie,\nLecz że tak rzadka łaska w tobie świeci\nPrzed śmiercią jeszcze, gdy w ciele twa dusza.\nByłem ja ziarnem drzewa, które cały\nŚwiat chrześcijański swym cieniem zagłusza,\nŻe rzadko owoc tam znajdziesz wystały."
    verse: true
    chunks:
      - pl: "— «Odpowiem tobie», duch mówił w zachwycie;"
        ru: "— «Отвечу тебе, — сказал дух в восхищении, —"
      - pl: "\n«Nie dla pomocy, darmo jej życzycie,"
        ru: "не ради помощи, напрасно вы её желаете,"
        note: "то есть молитв живых"
      - pl: "\nLecz że tak rzadka łaska w tobie świeci"
        ru: "а потому, что такая редкая милость светит в тебе"
      - pl: "\nPrzed śmiercią jeszcze, gdy w ciele twa dusza."
        ru: "ещё до смерти, пока твоя душа в теле."
      - pl: "\nByłem ja ziarnem drzewa, które cały"
        ru: "Я был зерном дерева, что весь"
      - pl: "\nŚwiat chrześcijański swym cieniem zagłusza,"
        ru: "христианский мир заглушает своей тенью,"
        note: "династия Капетингов"
      - pl: "\nŻe rzadko owoc tam znajdziesz wystały."
        ru: "так что там редко найдёшь вызревший плод."
    words: { "zachwycie": zachwyt, "darmo": darmo, "rzadka": rzadki, "ziarnem": ziarno, "cieniem": cien, "owoc": owoc }
  - clean: "Gdyby poczuli swą moc Flandryjczycy,\nPiorun ich zemsty ujrzałbym niedługo.\nCo oby zdarzył Ten, co wszystkich sądzi!\nNazwisko moje było Kapet Hugo,\nZrodzeni ze mnie Filipy, Ludwicy,\nRód mój bez przerwy ziemią Franków rządzi."
    verse: true
    chunks:
      - pl: "Gdyby poczuli swą moc Flandryjczycy,"
        ru: "Если бы фламандцы почувствовали свою силу,"
      - pl: "\nPiorun ich zemsty ujrzałbym niedługo."
        ru: "я вскоре увидел бы молнию их мести."
      - pl: "\nCo oby zdarzył Ten, co wszystkich sądzi!"
        ru: "О, если бы это даровал Тот, кто всех судит!"
      - pl: "\nNazwisko moje było Kapet Hugo,"
        ru: "Имя моё было Гуго Капет,"
      - pl: "\nZrodzeni ze mnie Filipy, Ludwicy,"
        ru: "от меня рождённые Филиппы, Людовики,"
      - pl: "\nRód mój bez przerwy ziemią Franków rządzi."
        ru: "мой род без перерыва правит землёй франков."
    words: { "Piorun": piorun, "zemsty": zemsta, "ujrzałbym": ujrzec, "zdarzył": zdarzyc, "przerwy": przerwa, "rządzi": rzadzic }
  - clean: "Syn ubogiego w Paryżu rzeźnika,\nGdy dawnych króli szczep usychał stary,\nPrócz latorośli jedynej, Ludwika,\nKtóry na pośmiech chodził w sukni szarej,\nOdważnie rządu pochwyciłem wodze.\nTłum mnie przyjaciół wiódł po nowej drodze\nI syna na tron wprowadziłem wdowi,\nZ krwi jego wyszli pomazańce nowi."
    verse: true
    chunks:
      - pl: "Syn ubogiego w Paryżu rzeźnika,"
        ru: "Сын бедного мясника в Париже,"
        note: "rzeźnik — мясник"
      - pl: "\nGdy dawnych króli szczep usychał stary,"
        ru: "когда старый ствол прежних королей засыхал,"
      - pl: "\nPrócz latorośli jedynej, Ludwika,"
        ru: "кроме единственного отпрыска, Людовика,"
        note: "у Данте — последний Каролинг, ушедший в монахи"
      - pl: "\nKtóry na pośmiech chodził w sukni szarej,"
        ru: "что на посмешище ходил в сером платье,"
        note: "pośmiech — посмешище"
      - pl: "\nOdważnie rządu pochwyciłem wodze."
        ru: "я смело схватил бразды правления."
      - pl: "\nTłum mnie przyjaciół wiódł po nowej drodze"
        ru: "Толпа друзей вела меня по новой дороге,"
      - pl: "\nI syna na tron wprowadziłem wdowi,"
        ru: "и я возвёл на вдовий трон сына,"
      - pl: "\nZ krwi jego wyszli pomazańce nowi."
        ru: "из его крови вышли новые помазанники."
        note: "pomazaniec — помазанник"
    words: { "Paryżu": paryz, "rzeźnika": rzeznik, "szczep": szczep, "sukni": suknia, "szarej": szary, "tron": tron }
  - clean: "Póki prowanckie wiano w moim domu,\nZ krwi mej nie zdjęło przyrodnego sromu,\nZła, znacząc mało, nie robił nikomu.\nPotem gdy w moc swej potęgi uwierzył,\nKłamstwem i gwałtem na przemian grabieżył;\nW chwili, gdy skruchą sumienie swe koił,\nZiemie Normandów, Gaskonów przyswoił."
    verse: true
    chunks:
      - pl: "Póki prowanckie wiano w moim domu,"
        ru: "Пока провансальское приданое в моём доме"
        note: "wiano — приданое"
      - pl: "\nZ krwi mej nie zdjęło przyrodnego sromu,"
        ru: "не сняло с моей крови природного стыда,"
      - pl: "\nZła, znacząc mało, nie robił nikomu."
        ru: "он, мало значащий, не делал зла никому."
      - pl: "\nPotem gdy w moc swej potęgi uwierzył,"
        ru: "Потом, когда он уверовал в силу своей мощи,"
      - pl: "\nKłamstwem i gwałtem na przemian grabieżył;"
        ru: "то ложью, то насилием грабил;"
        note: "grabieżyć — грабить"
      - pl: "\nW chwili, gdy skruchą sumienie swe koił,"
        ru: "в тот миг, когда раскаянием утешал свою совесть,"
      - pl: "\nZiemie Normandów, Gaskonów przyswoił."
        ru: "присвоил земли нормандцев, гасконцев."
        note: "przyswoić — присвоить"
    words: { "krwi": krew, "zdjęło": zdjac, "potęgi": potega, "uwierzył": uwierzyc, "Kłamstwem": klamstwo, "sumienie": sumienie }
  - clean: "Karol wszedł do Włoch, a w żalu i skrusze\nŚciął Konradyna i Tomasza duszę\nPosłał do nieba w pokucie i skrusze.\nPrzyjdzie czas wkrótce, co na włoskie pola\nOd Franków wpędzi drugiego Karola.\nPozna go lepiej włoska ziemia wasza:\nBez broni, tylko sam włócznią Judasza\nZręcznie szermując przy waszej niezgodzie,\nPierś Florencyji na wylot przebodzie."
    verse: true
    chunks:
      - pl: "Karol wszedł do Włoch, a w żalu i skrusze"
        ru: "Карл вошёл в Италию и в скорби и раскаянии"
        note: "ирония"
      - pl: "\nŚciął Konradyna i Tomasza duszę"
        ru: "обезглавил Конрадина, а душу Фомы"
        note: "Фома Аквинский, якобы отравленный"
      - pl: "\nPosłał do nieba w pokucie i skrusze."
        ru: "отправил на небо в покаянии и раскаянии."
      - pl: "\nPrzyjdzie czas wkrótce, co na włoskie pola"
        ru: "Вскоре придёт время, что на итальянские поля"
      - pl: "\nOd Franków wpędzi drugiego Karola."
        ru: "от франков загонит другого Карла."
        note: "Карл Валуа"
      - pl: "\nPozna go lepiej włoska ziemia wasza:"
        ru: "Ваша итальянская земля лучше узнает его:"
      - pl: "\nBez broni, tylko sam włócznią Judasza"
        ru: "без оружия, лишь одним копьём Иуды"
      - pl: "\nZręcznie szermując przy waszej niezgodzie,"
        ru: "ловко фехтуя среди вашего раздора,"
      - pl: "\nPierś Florencyji na wylot przebodzie."
        ru: "он пронзит насквозь грудь Флоренции."
    words: { "Posłał": poslac, "nieba": niebo, "wkrótce": wkrotce, "włoskie": wloski, "ziemia": ziemia, "Pierś": piers }
  - clean: "Ale tam zamiast cudzych ziem zaboru,\nNa grzech zarobi i stratę honoru,\nGrzech, co mu zgoła ciężaru nie zmniejszy,\nŻe na sumieniu wyda się mu lżejszy.\nTrzeci, co wyszedł jak więzień z okrętu,\nWidzę, jak córkę przedaje bez wstrętu,\nJako kupczący korsarz niewolnice."
    verse: true
    chunks:
      - pl: "Ale tam zamiast cudzych ziem zaboru,"
        ru: "Но там вместо захвата чужих земель"
      - pl: "\nNa grzech zarobi i stratę honoru,"
        ru: "заработает он грех и потерю чести,"
      - pl: "\nGrzech, co mu zgoła ciężaru nie zmniejszy,"
        ru: "грех, что вовсе не уменьшит ему тяжести,"
      - pl: "\nŻe na sumieniu wyda się mu lżejszy."
        ru: "хоть на совести покажется ему легче."
      - pl: "\nTrzeci, co wyszedł jak więzień z okrętu,"
        ru: "Третьего, что вышел, как узник, из корабля,"
        note: "Карл II Анжуйский"
      - pl: "\nWidzę, jak córkę przedaje bez wstrętu,"
        ru: "я вижу продающим дочь без отвращения,"
      - pl: "\nJako kupczący korsarz niewolnice."
        ru: "как торгующий корсар — невольниц."
    words: { "cudzych": cudzy, "grzech": grzech, "honoru": honor, "zmniejszy": zmniejszyc, "lżejszy": lekki, "okrętu": okret }
  - clean: "Łakomstwo! gdzież są twej chuci granice?\nJeśliś do tyla w mojej krwi zawrzało,\nŻe targ śmie robić o swe własne ciało.\nLecz gdyby przyszłe, przeszłe i dzisiejsze\nZło w twoich oczach wydało się mniejsze,\nWidzę w Anagni, jak w bojowym szyku\nFranków sztandary wieją lilijami,\nWięźnia Chrystusa w jego namiestniku."
    verse: true
    chunks:
      - pl: "Łakomstwo! gdzież są twej chuci granice?"
        ru: "Жадность! где же границы твоей похоти?"
      - pl: "\nJeśliś do tyla w mojej krwi zawrzało,"
        ru: "Если ты в моей крови до такой степени вскипела,"
      - pl: "\nŻe targ śmie robić o swe własne ciało."
        ru: "что она смеет торговать собственной плотью."
      - pl: "\nLecz gdyby przyszłe, przeszłe i dzisiejsze"
        ru: "Но чтобы будущее, прошедшее и нынешнее"
      - pl: "\nZło w twoich oczach wydało się mniejsze,"
        ru: "зло показалось в твоих глазах меньшим,"
      - pl: "\nWidzę w Anagni, jak w bojowym szyku"
        ru: "я вижу в Ананьи, как в боевом строю"
