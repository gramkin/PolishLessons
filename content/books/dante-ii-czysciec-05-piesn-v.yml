# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 5
chapterTitle: "Pieśń V"
chapterTitleRu: "Песнь V. Буонконте и Пия"
level: B2
paragraphs:
  - clean: "(Tacy, co w ostatniej chwili pragnęli łaski bożej, za późno. Kassero. Buonkonte.)"
    chunks:
      - pl: "(Tacy, co w ostatniej chwili pragnęli łaski bożej, za późno. Kassero. Buonkonte.)"
        ru: "(Те, кто в последний миг возжелал Божьей милости — слишком поздно. Кассеро. Буонконте.)"
        note: "Kassero — Якопо дель Кассеро"
    words: { "ostatniej": ostatni, "chwili": chwila, "pragnęli": pragnac, "bożej": bozy, "późno": pozno }
  - clean: "«Śpiesząc za wodzem rzuciłem te cienie,\nGdy oto jeden palcem mnie wytyka,\nWołając za mną, tak przerwał milczenie.\n«Patrzcie, na lewo od tego grzesznika\nSłońce się łamie i cień przed nim ściele,\nJakby tu chodził jeszcze w żywym ciele»."
    verse: true
    chunks:
      - pl: "«Śpiesząc za wodzem rzuciłem te cienie,"
        ru: "«Спеша за вождём, я оставил эти тени,"
        note: "у Korsaka здесь лишняя открывающая кавычка"
      - pl: "\nGdy oto jeden palcem mnie wytyka,"
        ru: "как вот одна указывает на меня пальцем,"
        note: "wytykać palcem — показывать пальцем"
      - pl: "\nWołając za mną, tak przerwał milczenie."
        ru: "крича мне вслед, так прервала молчание."
      - pl: "\n«Patrzcie, na lewo od tego grzesznika"
        ru: "«Смотрите: слева от этого грешника"
      - pl: "\nSłońce się łamie i cień przed nim ściele,"
        ru: "солнце преломляется, и тень стелется перед ним,"
        note: "ścielić się — стелиться"
      - pl: "\nJakby tu chodził jeszcze w żywym ciele»."
        ru: "будто он ходит здесь ещё в живом теле»."
    words: { "Śpiesząc": spieszyc, "wodzem": wodz, "Wołając": wolac, "przerwał": przerwac, "łamie": lamac, "cień": cien }
  - clean: "Na głos ten zwracam oczy i widziałem,\nJak wszyscy na mnie patrzali w tej chwili\nI na złamane światło moim ciałem.\n«Co tak się troskasz?» rzekł do mnie Wirgili,\n«Czy tyle szepty ich u ciebie ważą?\nIdź prędzej za mną, zostaw ich, niech gwarzą."
    verse: true
    chunks:
      - pl: "Na głos ten zwracam oczy i widziałem,"
        ru: "На этот голос я обращаю глаза и видел,"
      - pl: "\nJak wszyscy na mnie patrzali w tej chwili"
        ru: "как все смотрели на меня в этот миг"
      - pl: "\nI na złamane światło moim ciałem."
        ru: "и на свет, преломлённый моим телом."
      - pl: "\n«Co tak się troskasz?» rzekł do mnie Wirgili,"
        ru: "«Что ты так тревожишься? — сказал мне Вергилий, —"
      - pl: "\n«Czy tyle szepty ich u ciebie ważą?"
        ru: "неужели их шёпот столько весит для тебя?"
        note: "szept — шёпот"
      - pl: "\nIdź prędzej za mną, zostaw ich, niech gwarzą."
        ru: "Иди скорее за мной, оставь их, пусть болтают."
    words: { "głos": glos, "zwracam": zwracac, "światło": swiatlo, "rzekł": rzec, "ważą": wazyc, "prędzej": predko }
  - clean: "Bądź jak ta wieża, którą nie zachwieje\nWiatr, co wciąż po niej ślizgając się wieje:\nBliski ujęcia cel wymyka z dłoni,\nGdy w nas bezładnie myśl za myślą goni,\nGwałtowność jednej osłabia myśl drugą».\n«Idę!» odrzekłem, nie myśląc zbyt długo,\nTwarz mi rumieniec lekki zapłomienia,\nCo robi wstyd nasz godnym przebaczenia."
    verse: true
    chunks:
      - pl: "Bądź jak ta wieża, którą nie zachwieje"
        ru: "Будь как та башня, которую не пошатнёт"
      - pl: "\nWiatr, co wciąż po niej ślizgając się wieje:"
        ru: "ветер, что всё дует, скользя по ней:"
      - pl: "\nBliski ujęcia cel wymyka z dłoni,"
        ru: "цель, близкая к достижению, ускользает из рук,"
        note: "ujęcie — достижение, захват"
      - pl: "\nGdy w nas bezładnie myśl za myślą goni,"
        ru: "когда в нас беспорядочно мысль гонит мысль,"
      - pl: "\nGwałtowność jednej osłabia myśl drugą»."
        ru: "сила одной ослабляет другую мысль»."
        note: "gwałtowność — сила, порывистость"
      - pl: "\n«Idę!» odrzekłem, nie myśląc zbyt długo,"
        ru: "«Иду!» — ответил я, не раздумывая слишком долго,"
      - pl: "\nTwarz mi rumieniec lekki zapłomienia,"
        ru: "лицо мне зажигает лёгкий румянец,"
        note: "rumieniec — румянец; zapłomieniać — зажигать"
      - pl: "\nCo robi wstyd nasz godnym przebaczenia."
        ru: "что делает наш стыд достойным прощения."
    words: { "wieża": wieza, "Wiatr": wiatr, "goni": gonic, "rumieniec": rumieniec, "lekki": lekki, "wstyd": wstyd }
  - clean: "Wtem pochyłością góry nowe duchy\nSunąc się rzędem, leniwymi ruchy,\nWiersz w wiersz śpiewały idąc Miserere.\nLecz gdy postrzegły żywą twarzy cerę,\nPromień o moje łamiący się ciało,\nNie psalm, lecz jedno przeciągłe *O* brzmiało."
    verse: true
    chunks:
      - pl: "Wtem pochyłością góry nowe duchy"
        ru: "Вдруг по склону горы новые духи,"
      - pl: "\nSunąc się rzędem, leniwymi ruchy,"
        ru: "двигаясь рядом медленными движениями,"
      - pl: "\nWiersz w wiersz śpiewały idąc Miserere."
        ru: "стих за стихом пели на ходу «Miserere»."
        note: "псалом 50 «Помилуй мя»"
      - pl: "\nLecz gdy postrzegły żywą twarzy cerę,"
        ru: "Но когда они заметили живой цвет лица,"
        note: "cera — цвет лица"
      - pl: "\nPromień o moje łamiący się ciało,"
        ru: "луч, преломляющийся о моё тело,"
      - pl: "\nNie psalm, lecz jedno przeciągłe *O* brzmiało."
        ru: "звучал уже не псалом, а одно протяжное «О»."
    words: { "rzędem": rzad, "leniwymi": leniwy, "Wiersz": wiersz, "śpiewały": spiewac, "żywą": zywy, "Promień": promien }
  - clean: "Od nich jak posły dwaj ku nam bieżeli,\nZ dala wołając: «Mówcie, kto jesteście?»\nA mistrz: «Tym, co was posłali, odnieście,\nŻe ciało jego jest prawdziwym ciałem.\nJeśli, by jego cień widzieć, stanęli,\nJa myślę, na to już odpowiedziałem."
    verse: true
    chunks:
      - pl: "Od nich jak posły dwaj ku nam bieżeli,"
        ru: "От них, как послы, двое побежали к нам,"
        note: "bieżeć — бежать"
      - pl: "\nZ dala wołając: «Mówcie, kto jesteście?»"
        ru: "издали крича: «Скажите, кто вы?»"
      - pl: "\nA mistrz: «Tym, co was posłali, odnieście,"
        ru: "А учитель: «Тем, кто вас послал, отнесите,"
      - pl: "\nŻe ciało jego jest prawdziwym ciałem."
        ru: "что тело его — настоящее тело."
      - pl: "\nJeśli, by jego cień widzieć, stanęli,"
        ru: "Если они остановились, чтобы увидеть его тень,"
      - pl: "\nJa myślę, na to już odpowiedziałem."
        ru: "я думаю, на это я уже ответил."
    words: { "mistrz": mistrz, "posłali": poslac, "odnieście": odniesc, "ciało": cialo, "stanęli": stanac, "odpowiedziałem": odpowiedziec }
  - clean: "Lepiej niech cześć mu oddadzą w pokorze,\nBo on dość drogim dla nich stać się może».\nNigdy tak szybko w sierpniową noc jasną\nZ chmur meteory spadają i gasną,\nJak te dwa duchy do swoich wrócili\nI do nas z swoją gromadą gonili,\nJak jeźdźców rota, gdy naciera cwałem."
    verse: true
    chunks:
      - pl: "Lepiej niech cześć mu oddadzą w pokorze,"
        ru: "Пусть лучше окажут ему честь в смирении,"
      - pl: "\nBo on dość drogim dla nich stać się może»."
        ru: "ибо он может стать им довольно дорогим»."
        note: "то есть молиться за них на земле"
      - pl: "\nNigdy tak szybko w sierpniową noc jasną"
        ru: "Никогда так быстро в ясную августовскую ночь"
      - pl: "\nZ chmur meteory spadają i gasną,"
        ru: "метеоры не падают с туч и не гаснут,"
      - pl: "\nJak te dwa duchy do swoich wrócili"
        ru: "как эти два духа вернулись к своим"
      - pl: "\nI do nas z swoją gromadą gonili,"
        ru: "и с толпой своей погнали к нам,"
      - pl: "\nJak jeźdźców rota, gdy naciera cwałem."
        ru: "как отряд всадников, когда атакует галопом."
        note: "jeździec — всадник; nacierać — атаковать"
    words: { "oddadzą": oddac, "jasną": jasny, "chmur": chmura, "spadają": spadac, "duchy": duch, "jeźdźców": jezdziec }
  - clean: "Wirgili mówił: «Duchy całą rzeszą\nSnadź z jakąś prośbą do ciebie tak spieszą.\nTy idź, a na głos mówiącego ducha\nPrzechodząc tylko nadstawuj mu ucha.\n— «O! wstępujący na górę zbawienia,\nZ ciałem tym samym, coś wziął z urodzenia!»"
    verse: true
    chunks:
      - pl: "Wirgili mówił: «Duchy całą rzeszą"
        ru: "Вергилий сказал: «Духи всей толпой,"
        note: "rzesza — толпа"
      - pl: "\nSnadź z jakąś prośbą do ciebie tak spieszą."
        ru: "видно, с какой-то просьбой так спешат к тебе."
      - pl: "\nTy idź, a na głos mówiącego ducha"
        ru: "Ты иди, а на голос говорящего духа"
      - pl: "\nPrzechodząc tylko nadstawuj mu ucha."
        ru: "лишь, проходя, подставляй ему ухо»."
        note: "nadstawiać ucha — прислушиваться"
      - pl: "\n— «O! wstępujący na górę zbawienia,"
        ru: "— «О восходящий на гору спасения"
      - pl: "\nZ ciałem tym samym, coś wziął z urodzenia!»"
        ru: "с тем же телом, что ты взял от рождения! —"
    words: { "prośbą": prosba, "Przechodząc": przechodzic, "górę": gora, "samym": sam, "wziął": wziac, "urodzenia": urodzic }
  - clean: "Wołali idąc, «zahamuj tu kroku,\nMoże znajomych znajdziesz w tym natłoku,\nOd nich żyjącym chciej zanieść nowiny.\nGdzie to? o postój, nasz gościu jedyny!\nWszyscyśmy śmiercią gwałtowną pomarli,\nPrzy śmierci padła na grzeszników trwoga\nI w blasku wiary oczyśmy zawarli."
    verse: true
    chunks:
      - pl: "Wołali idąc, «zahamuj tu kroku,"
        ru: "кричали они, идя, — задержи здесь шаг,"
      - pl: "\nMoże znajomych znajdziesz w tym natłoku,"
        ru: "может, найдёшь знакомых в этой толпе,"
      - pl: "\nOd nich żyjącym chciej zanieść nowiny."
        ru: "изволь от них отнести вести живым."
      - pl: "\nGdzie to? o postój, nasz gościu jedyny!"
        ru: "Куда же? о, постой, наш единственный гость!"
      - pl: "\nWszyscyśmy śmiercią gwałtowną pomarli,"
        ru: "Все мы умерли насильственной смертью,"
      - pl: "\nPrzy śmierci padła na grzeszników trwoga"
        ru: "при смерти на грешников пал страх,"
      - pl: "\nI w blasku wiary oczyśmy zawarli."
        ru: "и в блеске веры мы закрыли глаза."
        note: "oczyśmy = oczy + -śmy"
    words: { "kroku": krok, "zanieść": zaniesc, "jedyny": jedyny, "blasku": blask, "wiary": wiara, "zawarli": zawrzec }
  - clean: "I żałujący w przebaczeniu błogiem,\nWyszliśmy z życia już w pokoju z Bogiem,\nI płoniem żądzą oglądania Boga!\n— «Nie przypominam» rzekłem «was w tej dobie,\nSzlachetne duchy! ale w waszym gronie\nKto chce, niech prosi, co mogę, ja zrobię."
    verse: true
    chunks:
      - pl: "I żałujący w przebaczeniu błogiem,"
        ru: "И, раскаиваясь, в блаженном прощении"
      - pl: "\nWyszliśmy z życia już w pokoju z Bogiem,"
        ru: "мы вышли из жизни уже в мире с Богом,"
      - pl: "\nI płoniem żądzą oglądania Boga!"
        ru: "и пылаем жаждой видеть Бога!»"
        note: "płoniem — устар. «пылаем»"
      - pl: "\n— «Nie przypominam» rzekłem «was w tej dobie,"
        ru: "— «Не припоминаю, — сказал я, — вас в эту пору,"
      - pl: "\nSzlachetne duchy! ale w waszym gronie"
        ru: "благородные духи! но в вашем кругу"
      - pl: "\nKto chce, niech prosi, co mogę, ja zrobię."
        ru: "кто хочет, пусть просит, что могу, я сделаю."
    words: { "żałujący": zalowac, "oglądania": ogladac, "przypominam": przypominac, "dobie": doba, "Szlachetne": szlachetny, "gronie": grono }
  - clean: "W imię pokoju, co i mnie grzesznika\nCiągnie iść śladem tego przewodnika,\nZa tym pokojem z świata w świat ja gonię!\n— «O! bez zaklęcia my ufamy tobie» —\nMówił z nich jeden, «jeśli ci pozwoli\nMożność wykonać czyn twej dobrej woli."
    verse: true
    chunks:
      - pl: "W imię pokoju, co i mnie grzesznika"
        ru: "Во имя мира, что и меня, грешника,"
      - pl: "\nCiągnie iść śladem tego przewodnika,"
        ru: "влечёт идти по следу этого проводника,"
      - pl: "\nZa tym pokojem z świata w świat ja gonię!"
        ru: "за этим миром я гонюсь из мира в мир!»"
      - pl: "\n— «O! bez zaklęcia my ufamy tobie» —"
        ru: "— «О! без заклятия мы доверяем тебе, —"
      - pl: "\nMówił z nich jeden, «jeśli ci pozwoli"
        ru: "сказал один из них, — если тебе позволит"
      - pl: "\nMożność wykonać czyn twej dobrej woli."
        ru: "возможность исполнить дело твоей доброй воли."
        note: "możność — возможность"
    words: { "Ciągnie": ciagnac, "przewodnika": przewodnik, "zaklęcia": zaklecie, "ufamy": ufac, "wykonać": wykonac, "czyn": czyn }
  - clean: "Gdy kiedy zwiedzisz me rodzinne strony,\nKraj położony w pobliżu Ankony,\nZechciej tam za mnie pomodlić się w Fano,\nAbym zmył duszę grzechami zmazaną.\nJam się urodził w tym mieście, lecz rana,\nZ której krew, co mnie żywiła, wylana,\nW Antenorydzie była mi zadana."
    verse: true
    chunks:
      - pl: "Gdy kiedy zwiedzisz me rodzinne strony,"
        ru: "Если когда-нибудь посетишь мои родные края,"
      - pl: "\nKraj położony w pobliżu Ankony,"
        ru: "землю, расположенную близ Анконы,"
      - pl: "\nZechciej tam za mnie pomodlić się w Fano,"
        ru: "изволь там за меня помолиться в Фано,"
      - pl: "\nAbym zmył duszę grzechami zmazaną."
        ru: "чтобы я омыл душу, запятнанную грехами."
        note: "zmazany — запятнанный"
      - pl: "\nJam się urodził w tym mieście, lecz rana,"
        ru: "Я родился в этом городе, но рана,"
      - pl: "\nZ której krew, co mnie żywiła, wylana,"
        ru: "из которой пролилась кровь, что меня питала,"
      - pl: "\nW Antenorydzie była mi zadana."
        ru: "была нанесена мне в земле Антеноридов."
        note: "Падуя"
    words: { "rodzinne": rodzinny, "pobliżu": poblize, "zmył": zmyc, "grzechami": grzech, "żywiła": zywic, "wylana": wylac }
  - clean: "Tam Este, w którym złość przeciw mnie wrzała\nWięcej niżeli sprawiedliwość chciała,\nW skok w pogoń za mną płatne wysłał zbiry.\nO, gdybym uciekł w okolice Miry,\nByłbym tam jeszcze, gdzie pierś dysze sporo.\nPrzy Oryjako zagrzęziony w bagno\nPadłem i z żył mych trysło krwi jezioro»."
    verse: true
    chunks:
      - pl: "Tam Este, w którym złość przeciw mnie wrzała"
        ru: "Там д’Эсте, в котором злоба против меня кипела"
      - pl: "\nWięcej niżeli sprawiedliwość chciała,"
        ru: "больше, чем того хотело правосудие,"
      - pl: "\nW skok w pogoń za mną płatne wysłał zbiry."
        ru: "вскачь послал за мной в погоню наёмных головорезов."
        note: "zbir — головорез"
      - pl: "\nO, gdybym uciekł w okolice Miry,"
        ru: "О, если бы я бежал в окрестности Миры,"
      - pl: "\nByłbym tam jeszcze, gdzie pierś dysze sporo."
        ru: "я был бы ещё там, где грудь дышит вволю."
        note: "то есть среди живых"
      - pl: "\nPrzy Oryjako zagrzęziony w bagno"
        ru: "У Ориаго, увязнув в болоте,"
      - pl: "\nPadłem i z żył mych trysło krwi jezioro»."
        ru: "я упал, и из моих жил брызнуло озеро крови»."
    words: { "sprawiedliwość": sprawiedliwosc, "skok": skok, "okolice": okolica, "pierś": piers, "bagno": bagno, "jezioro": jezioro }
  - clean: "Drugi duch mówił: «Jak twe chęci pragną\nDojść co najprędzej na szczyt tej opoki,\nTak skróć modlitwą mój ucisk głęboki.\nJam Buonkonte, starszy syn Gwidona.\nLecz w Montefeltro ni Joanna żona,\nNikt się nie modli tam za mnie na ziemi,\nDlatego dotąd przebywam tu z niemi»."
    verse: true
    chunks:
      - pl: "Drugi duch mówił: «Jak twe chęci pragną"
        ru: "Другой дух сказал: «Как твои желания жаждут"
      - pl: "\nDojść co najprędzej na szczyt tej opoki,"
        ru: "дойти как можно скорее до вершины этой скалы,"
      - pl: "\nTak skróć modlitwą mój ucisk głęboki."
        ru: "так сократи молитвой мою глубокую тяготу."
        note: "ucisk — гнёт, тягота"
      - pl: "\nJam Buonkonte, starszy syn Gwidona."
        ru: "Я Буонконте, старший сын Гвидо."
        note: "Буонконте да Монтефельтро"
      - pl: "\nLecz w Montefeltro ni Joanna żona,"
        ru: "Но в Монтефельтро ни жена Джованна,"
      - pl: "\nNikt się nie modli tam za mnie na ziemi,"
        ru: "никто не молится там за меня на земле,"
