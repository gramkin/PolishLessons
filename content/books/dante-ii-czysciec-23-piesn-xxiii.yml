# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 23
chapterTitle: "Pieśń XXIII"
chapterTitleRu: "Песнь XXIII. Форезе Донати"
level: B2
paragraphs:
  - clean: "(Cienie. Foreze Donati mówi o rozpuście niewiast florenckich.)"
    chunks:
      - pl: "(Cienie. Foreze Donati mówi o rozpuście niewiast florenckich.)"
        ru: "(Тени. Форезе Донати говорит о распущенности флорентийских женщин.)"
        note: "rozpusta — распущенность"
    words: { "mówi": mowic, "niewiast": niewiasta }
  - clean: "Gdy między gęste i zielone liście\nWciskałem oczy, podobny chłopcowi\nCo z próżnowania w lesie ptaszki łowi,\nWódz mój jak ojciec zbliżył się i mówi:\n«Idź, synu, daru chwili źle nadużyć,\nTu trzeba czasu użyteczniej użyć»."
    verse: true
    chunks:
      - pl: "Gdy między gęste i zielone liście"
        ru: "Когда меж густые и зелёные листья"
      - pl: "\nWciskałem oczy, podobny chłopcowi"
        ru: "я вперял глаза, подобный мальчику,"
        note: "wciskać oczy — вперять глаза"
      - pl: "\nCo z próżnowania w lesie ptaszki łowi,"
        ru: "что от безделья ловит птичек в лесу,"
        note: "próżnowanie — безделье"
      - pl: "\nWódz mój jak ojciec zbliżył się i mówi:"
        ru: "мой вождь, как отец, приблизился и говорит:"
      - pl: "\n«Idź, synu, daru chwili źle nadużyć,"
        ru: "«Идём, сын: плохо злоупотреблять даром мгновения,"
        note: "nadużyć — злоупотребить"
      - pl: "\nTu trzeba czasu użyteczniej użyć»."
        ru: "здесь нужно использовать время полезнее»."
        note: "użytecznie — полезно"
    words: { "podobny": podobny, "lesie": las, "ptaszki": ptaszek, "Wódz": wodz, "zbliżył": zblizyc, "daru": dar }
  - clean: "Zważywszy radę mądrą rzeczywiście,\nKu mędrcom krok mój zwróciłem i oczy,\nIdąc ich śladem lekki i ochoczy.\nOto słyszałem i płacz, i śpiewanie:\nPsalm «Usta moje otwórz mi, o Panie!»\nPobudzał we mnie radość i cierpienie."
    verse: true
    chunks:
      - pl: "Zważywszy radę mądrą rzeczywiście,"
        ru: "Взвесив поистине мудрый совет,"
      - pl: "\nKu mędrcom krok mój zwróciłem i oczy,"
        ru: "я обратил к мудрецам шаг и глаза,"
      - pl: "\nIdąc ich śladem lekki i ochoczy."
        ru: "идя по их следу, лёгкий и охочий."
      - pl: "\nOto słyszałem i płacz, i śpiewanie:"
        ru: "И вот я слышал и плач, и пение:"
      - pl: "\nPsalm «Usta moje otwórz mi, o Panie!»"
        ru: "псалом «Уста мои отверзи, Господи!»"
      - pl: "\nPobudzał we mnie radość i cierpienie."
        ru: "пробуждал во мне радость и страдание."
    words: { "mądrą": madry, "rzeczywiście": rzeczywiscie, "zwróciłem": zwrocic, "lekki": lekki, "śpiewanie": spiewac, "radość": radosc }
  - clean: "«Co za głos» rzekłem: «Brzmi w żałosnym echu?»\nA mistrz: «Być może, nowe idą cienie,\nTu rozwiązywać węzeł swego grzechu».\nZamyślonego obyczaj pielgrzyma,\nGdy nieznajomych spotyka podróżnych,\nZwraca się do nich, lecz się nie zatrzyma;\nTak orszak cieniów niemych i pobożnych,\nSzybkim za nami postępując krokiem,\nSzedł, a przechodząc rzucał na nas okiem."
    verse: true
    chunks:
      - pl: "«Co za głos» rzekłem: «Brzmi w żałosnym echu?»"
        ru: "«Что за голос, — сказал я, — звучит жалобным эхом?»"
      - pl: "\nA mistrz: «Być może, nowe idą cienie,"
        ru: "А учитель: «Быть может, идут новые тени,"
      - pl: "\nTu rozwiązywać węzeł swego grzechu»."
        ru: "чтобы развязать здесь узел своего греха»."
      - pl: "\nZamyślonego obyczaj pielgrzyma,"
        ru: "Как задумчивый паломник по обычаю,"
      - pl: "\nGdy nieznajomych spotyka podróżnych,"
        ru: "встречая незнакомых путников,"
      - pl: "\nZwraca się do nich, lecz się nie zatrzyma;"
        ru: "оборачивается к ним, но не останавливается;"
      - pl: "\nTak orszak cieniów niemych i pobożnych,"
        ru: "так свита теней, немых и благочестивых,"
      - pl: "\nSzybkim za nami postępując krokiem,"
        ru: "быстрым шагом продвигаясь за нами,"
      - pl: "\nSzedł, a przechodząc rzucał na nas okiem."
        ru: "шла и, проходя, бросала на нас взгляд."
    words: { "rzekłem": rzec, "echu": echo, "węzeł": wezel, "nieznajomych": nieznajomy, "Zwraca": zwracac, "postępując": postepowac }
  - clean: "A cienie były straszliwej chudości,\nŹrenica ciemna, w twarz głęboko wpadła,\nPod skórą widne zarysy ich kości.\nNie sądzę, aby na swojej osobie\nMiał więcej suchą Erizychton skórę,\nGdy wewnątrz głodu upaleniem gore."
    verse: true
    chunks:
      - pl: "A cienie były straszliwej chudości,"
        ru: "А тени были страшной худобы,"
        note: "chudość — худоба"
      - pl: "\nŹrenica ciemna, w twarz głęboko wpadła,"
        ru: "зрачок тёмный, глубоко запавший в лицо,"
      - pl: "\nPod skórą widne zarysy ich kości."
        ru: "под кожей видны очертания их костей."
      - pl: "\nNie sądzę, aby na swojej osobie"
        ru: "Не думаю, чтобы на своей особе"
      - pl: "\nMiał więcej suchą Erizychton skórę,"
        ru: "Эрисихтон имел более сухую кожу,"
        note: "Эрисихтон, наказанный вечным голодом"
      - pl: "\nGdy wewnątrz głodu upaleniem gore."
        ru: "когда внутри горит жаром голода."
    words: { "twarz": twarz, "wpadła": wpasc, "skórą": skora, "osobie": osoba, "suchą": suchy, "głodu": glod }
  - clean: "Oto był takim, pomyśliłem w sobie,\nLud, gdy wychodził przez zgliszcza i dymy,\nTracąc zburzonej gród Jerozolimy,\nGdzie matka z głodu własne dziecko zjadła.\nOczy ich były jak wklęsłe pierścienie,\nZ których wyjęto błyszczące kamienie."
    verse: true
    chunks:
      - pl: "Oto był takim, pomyśliłem w sobie,"
        ru: "Вот таким, подумал я про себя, был"
      - pl: "\nLud, gdy wychodził przez zgliszcza i dymy,"
        ru: "народ, когда выходил сквозь пепелища и дымы,"
      - pl: "\nTracąc zburzonej gród Jerozolimy,"
        ru: "теряя разрушенный град Иерусалим,"
      - pl: "\nGdzie matka z głodu własne dziecko zjadła."
        ru: "где мать с голоду съела собственное дитя."
      - pl: "\nOczy ich były jak wklęsłe pierścienie,"
        ru: "Глаза их были, как впалые кольца,"
        note: "wklęsły — впалый"
      - pl: "\nZ których wyjęto błyszczące kamienie."
        ru: "из которых вынули сверкающие камни."
    words: { "dymy": dym, "zburzonej": zburzyc, "pierścienie": pierscien, "wyjęto": wyjac, "błyszczące": blyszczec, "kamienie": kamien }
  - clean: "Kto w twarzach ludzkich przywykł czytać OMO\nZłożyłby z lic ich głoskę M widomą.\nKtóż by uwierzył, jeśliby sam wprzódy\nNie wiedział skutku owoców i wody\nDrażniących żądze cierpieniem tak żywym?\nNie mogąc znaleźć sam przyczyny na to,\nNa twarze kryte łuską trędowatą,\nNa taką chudość patrzałem z podziwem."
    verse: true
    chunks:
      - pl: "Kto w twarzach ludzkich przywykł czytać OMO"
        ru: "Кто привык читать в лицах людей «OMO»,"
        note: "омо — человек (лат. homo), начертанный в чертах лица"
      - pl: "\nZłożyłby z lic ich głoskę M widomą."
        ru: "различил бы на их лицах ясную букву М."
        note: "głoska — буква"
      - pl: "\nKtóż by uwierzył, jeśliby sam wprzódy"
        ru: "Кто бы поверил, если бы сам прежде"
      - pl: "\nNie wiedział skutku owoców i wody"
        ru: "не знал действия плодов и воды,"
      - pl: "\nDrażniących żądze cierpieniem tak żywym?"
        ru: "дразнящих желания столь живым страданием?"
      - pl: "\nNie mogąc znaleźć sam przyczyny na to,"
        ru: "Не в силах сам найти причины этому,"
      - pl: "\nNa twarze kryte łuską trędowatą,"
        ru: "на лица, покрытые прокажённой чешуёй,"
      - pl: "\nNa taką chudość patrzałem z podziwem."
        ru: "на такую худобу я смотрел с изумлением."
    words: { "przywykł": przywyknac, "wprzódy": wprzody, "skutku": skutek, "owoców": owoc, "przyczyny": przyczyna, "kryte": kryc }
  - clean: "Cień jeden oczy z jam czaszki wywrócił\nI spojrzał na mnie; potem z ust wyrzucił\nTe słowa: «Jakąż łaską Bóg mię darzy!»\nNie mógłbym nigdy jego poznać z twarzy,\nWyschły jak trzaska, poznałem po głosie;\nIskra przeze mnie przebiegła, zdało się,\nI przy jej świetle zdołałem wydostać\nZ dna mej pamięci Forezego postać."
    verse: true
    chunks:
      - pl: "Cień jeden oczy z jam czaszki wywrócił"
        ru: "Одна тень повела глазами из ям черепа"
      - pl: "\nI spojrzał na mnie; potem z ust wyrzucił"
        ru: "и взглянула на меня; потом выбросила из уст"
      - pl: "\nTe słowa: «Jakąż łaską Bóg mię darzy!»"
        ru: "эти слова: «Какой же милостью Бог меня дарит!»"
      - pl: "\nNie mógłbym nigdy jego poznać z twarzy,"
        ru: "Я никогда не узнал бы его по лицу,"
      - pl: "\nWyschły jak trzaska, poznałem po głosie;"
        ru: "иссохшему, как щепка, я узнал по голосу;"
        note: "trzaska — щепка"
      - pl: "\nIskra przeze mnie przebiegła, zdało się,"
        ru: "искра, казалось, пробежала сквозь меня,"
      - pl: "\nI przy jej świetle zdołałem wydostać"
        ru: "и при её свете я сумел извлечь"
      - pl: "\nZ dna mej pamięci Forezego postać."
        ru: "со дна своей памяти облик Форезе."
    words: { "Cień": cien, "czaszki": czaszka, "Jakąż": jakiz, "zdołałem": zdolac, "wydostać": wydostac, "postać": postac }
  - clean: "— «Nie zważaj» błagał «na ten trąd tak suchy.\nNa brak wyraźny ciała w mej osobie,\nLecz nie odmawiaj, mów, kto jest przy tobie?\nJakie dwa ciebie prowadzą tu duchy?»\n— «Kiedy nad tobą umarłym płakałem,\nNie mniej bolesne łzy» odpowiedziałem\n«Leję nad twoim tak zmienionym ciałem."
    verse: true
    chunks:
      - pl: "— «Nie zważaj» błagał «na ten trąd tak suchy."
        ru: "— «Не обращай внимания, — умолял он, — на эту сухую проказу,"
        note: "trąd — проказа"
      - pl: "\nNa brak wyraźny ciała w mej osobie,"
        ru: "на явный недостаток плоти в моей особе,"
      - pl: "\nLecz nie odmawiaj, mów, kto jest przy tobie?"
        ru: "но не отказывай, скажи, кто с тобой?"
      - pl: "\nJakie dwa ciebie prowadzą tu duchy?»"
        ru: "Какие два духа ведут тебя сюда?»"
      - pl: "\n— «Kiedy nad tobą umarłym płakałem,"
        ru: "— «Когда я плакал над тобой, умершим,"
      - pl: "\nNie mniej bolesne łzy» odpowiedziałem"
        ru: "не менее горькие слёзы, — ответил я, —"
      - pl: "\n«Leję nad twoim tak zmienionym ciałem."
        ru: "лью над твоим столь изменившимся телом."
    words: { "błagał": blagac, "odmawiaj": odmawiac, "płakałem": plakac, "bolesne": bolesny, "odpowiedziałem": odpowiedziec, "Leję": lac }
  - clean: "Powiedz, dla Boga, co się z tobą stało,\nCo tak cię nagle z ciała rozebrało?\nPóki z podziwu myśli nie wyzwolę,\nMilczę; źle mówi, kto ma inną wolę».\nA duch: «Tajemna siła z wiecznej rady\nSchodzi w tę wodę i w rdzeń tego drzewa,\nKtóre za nami oto stoi z dala;\nPrzez nią ja jestem tak chudy i blady."
    verse: true
    chunks:
      - pl: "Powiedz, dla Boga, co się z tobą stało,"
        ru: "Скажи, ради Бога, что с тобой случилось,"
      - pl: "\nCo tak cię nagle z ciała rozebrało?"
        ru: "что так вдруг совлекло с тебя плоть?"
      - pl: "\nPóki z podziwu myśli nie wyzwolę,"
        ru: "Пока я не освобожу мысли от изумления,"
      - pl: "\nMilczę; źle mówi, kto ma inną wolę»."
        ru: "я молчу; плохо говорит тот, у кого иная воля»."
      - pl: "\nA duch: «Tajemna siła z wiecznej rady"
        ru: "А дух: «Тайная сила из вечного совета"
      - pl: "\nSchodzi w tę wodę i w rdzeń tego drzewa,"
        ru: "сходит в эту воду и в сердцевину этого дерева,"
      - pl: "\nKtóre za nami oto stoi z dala;"
        ru: "что вот стоит позади нас вдали;"
      - pl: "\nPrzez nią ja jestem tak chudy i blady."
        ru: "через неё я так худ и бледен."
    words: { "rozebrało": rozebrac, "wiecznej": wieczny, "Schodzi": schodzic, "rdzeń": rdzen, "chudy": chudy, "blady": blady }
  - clean: "Ten lud szkieletów, który płacząc, śpiewa,\nBędąc bez miary posłusznym swej gębie,\nTu się uświęca przez głód i pragnienie.\nWoń, co z owoców i wody wynika,\nRozwiana wiatrem wzdłuż tego trawnika,\nJadła, napoju w nas żądzę zapala."
    verse: true
    chunks:
      - pl: "Ten lud szkieletów, który płacząc, śpiewa,"
        ru: "Этот народ скелетов, что, плача, поёт,"
        note: "szkielet — скелет"
      - pl: "\nBędąc bez miary posłusznym swej gębie,"
        ru: "будучи без меры послушным своему рту,"
        note: "gęba — рот, пасть"
      - pl: "\nTu się uświęca przez głód i pragnienie."
        ru: "здесь освящается голодом и жаждой."
        note: "uświęcać się — освящаться"
      - pl: "\nWoń, co z owoców i wody wynika,"
        ru: "Запах, что исходит от плодов и воды,"
      - pl: "\nRozwiana wiatrem wzdłuż tego trawnika,"
        ru: "развеянный ветром вдоль этого луга,"
        note: "trawnik — лужайка"
      - pl: "\nJadła, napoju w nas żądzę zapala."
        ru: "разжигает в нас желание еды, питья."
    words: { "miary": miara, "gębie": geba, "pragnienie": pragnienie, "wynika": wynikac, "wiatrem": wiatr, "napoju": napoj }
  - clean: "Chodząc tu w kółko po skały tej zrębie\nNieraz poczujem mękę, mękę mówię,\nGdy powinienem był rzec: pocieszenie.\nBo wola, która iść przez to pustkowie\nDo tego drzewa bodzie nasze siły,\nJest tą, co bodła Chrystusa rzec: »Eli!«,\nGdy nas wyzwalał krwią ze swojej żyły»."
    verse: true
    chunks:
      - pl: "Chodząc tu w kółko po skały tej zrębie"
        ru: "Кружа здесь по краю этой скалы,"
      - pl: "\nNieraz poczujem mękę, mękę mówię,"
        ru: "не раз мы почувствуем муку — муку, говорю, —"
      - pl: "\nGdy powinienem był rzec: pocieszenie."
        ru: "тогда как я должен был сказать: утешение."
      - pl: "\nBo wola, która iść przez to pustkowie"
        ru: "Ибо воля, что гонит наши силы"
      - pl: "\nDo tego drzewa bodzie nasze siły,"
        ru: "через эту пустошь к этому дереву,"
      - pl: "\nJest tą, co bodła Chrystusa rzec: »Eli!«,"
        ru: "есть та, что заставила Христа сказать: „Или!“,"
        note: "«Боже мой» на кресте"
      - pl: "\nGdy nas wyzwalał krwią ze swojej żyły»."
        ru: "когда он освобождал нас кровью из своей жилы»."
    words: { "Chodząc": chodzic, "kółko": kolko, "skały": skala, "pocieszenie": pocieszyc, "drzewa": drzewo, "krwią": krew }
  - clean: "A ja: «Foreze, od dnia, gdy z pościeli\nŚmiertelnej w lepsze tu życie wstąpiłeś,\nPięciu lat spełna jeszcze nie przeżyłeś.\nJeśli się w tobie kończy grzechu władza\nWprzód, zanim w ciebie wsiąknęła głęboko\nBoleść zbawienna, co nas jedna z Bogiem:\nJak tu zaszedłeś jeszcze tak wysoko?"
    verse: true
    chunks:
      - pl: "A ja: «Foreze, od dnia, gdy z pościeli"
        ru: "А я: «Форезе, со дня, как ты с постели"
      - pl: "\nŚmiertelnej w lepsze tu życie wstąpiłeś,"
        ru: "смертной вступил сюда, в лучшую жизнь,"
      - pl: "\nPięciu lat spełna jeszcze nie przeżyłeś."
        ru: "ещё не прошло полных пяти лет."
      - pl: "\nJeśli się w tobie kończy grzechu władza"
        ru: "Если в тебе власть греха кончилась"
      - pl: "\nWprzód, zanim w ciebie wsiąknęła głęboko"
        ru: "прежде, чем в тебя глубоко впиталась"
        note: "wsiąknąć — впитаться"
      - pl: "\nBoleść zbawienna, co nas jedna z Bogiem:"
        ru: "спасительная скорбь, что соединяет нас с Богом:"
        note: "zbawienny — спасительный"
      - pl: "\nJak tu zaszedłeś jeszcze tak wysoko?"
        ru: "как ты зашёл ещё так высоко?"
    words: { "Śmiertelnej": smiertelny, "wstąpiłeś": wstapic, "przeżyłeś": przezyc, "grzechu": grzech, "władza": wladza, "zaszedłeś": zajsc }
  - clean: "Myśliłem spotkać cię za czyśćca progiem,\nTam niżej, gdzie czas czasem się nagradza.\nA on: «Winienem czułej Nelli mojej,\nŻe słodki piołun boleści mię poi;\nJej łzy, westchnienia i pobożne modły\nZ miejsc, gdzie duch czeka, prędzej mię wywiodły."
    verse: true
    chunks:
      - pl: "Myśliłem spotkać cię za czyśćca progiem,"
        ru: "Я думал встретить тебя за порогом Чистилища,"
      - pl: "\nTam niżej, gdzie czas czasem się nagradza."
        ru: "там, ниже, где время возмещается временем»."
