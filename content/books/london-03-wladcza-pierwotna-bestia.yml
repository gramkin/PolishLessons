  - clean: "Joe kłapał zębami jak demon. Raz jego zęby zacisnęły się na przedniej łapie jednego z husky i przegryzł ją aż przez kość. Pike, symulant, skoczył na okaleczone zwierzę i skręcił mu kark błyskawicznym chwytem zębów i szarpnięciem. Buck chwycił za gardło pieniącego się przeciwnika i oblała go krew, gdy jego zęby przebiły tętnicę szyjną. Ciepły smak krwi w pysku podsycił jego zaciekłość. Rzucił się na następnego i w tej samej chwili poczuł zęby wbijające się w jego własne gardło. To był Spitz, który zdradziecko zaatakował z boku."
    en: "Joe was snapping like a demon. Once, his teeth closed on the fore leg of a husky, and he crunched down through the bone. Pike, the malingerer, leaped upon the crippled animal, breaking its neck with a quick flash of teeth and a jerk, Buck got a frothing adversary by the throat, and was sprayed with blood when his teeth sank through the jugular. The warm taste of it in his mouth goaded him to greater fierceness. He flung himself upon another, and at the same time felt teeth sink into his own throat. It was Spitz, treacherously attacking from the side."
