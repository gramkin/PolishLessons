  - clean: "François również się zdziwił, kiedy wypadli splątani z rozwalonego legowiska, i odgadł przyczynę awantury. — A-a-ach! — zawołał do Bucka. — Daj mu, na Boga! Daj mu, temu brudnemu złodziejowi!"
    en: "François was surprised, too, when they shot out in a tangle from the disrupted nest and he divined the cause of the trouble. “A-a-ah!” he cried to Buck. “Gif it to heem, by Gar! Gif it to heem, the dirty t’eef!”"
    draft: true
