  - clean: "Spitz był nietknięty, a Buck ociekał krwią i ciężko dyszał. Walka stawała się rozpaczliwa. A przez cały czas milczący, wilczy krąg czekał, żeby dobić tego psa, który upadnie. Kiedy Buckowi zaczęło brakować tchu, Spitz zaczął nacierać i nie dawał mu złapać równowagi. Raz Buck się przewrócił i cały krąg sześćdziesięciu psów poderwał się; ale on się pozbierał, niemal w powietrzu, i krąg znów przysiadł i czekał."
    en: "Spitz was untouched, while Buck was streaming with blood and panting hard. The fight was growing desperate. And all the while the silent and wolfish circle waited to finish off whichever dog went down. As Buck grew winded, Spitz took to rushing, and he kept him staggering for footing. Once Buck went over, and the whole circle of sixty dogs started up; but he recovered himself, almost in mid air, and the circle sank down again and waited."
