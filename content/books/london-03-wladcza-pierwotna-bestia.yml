  - clean: "Rzeka Thirty Mile wcale nie zamarzła. Jej dzikie wody urągały mrozowi i tylko w wirach i w spokojnych miejscach lód w ogóle się trzymał. Potrzeba było sześciu dni wyczerpującego trudu, żeby przebyć te pięćdziesiąt strasznych kilometrów. A strasznych naprawdę, bo każdy ich metr pokonywano z narażeniem życia psów i ludzi. Dwanaście razy Perrault, który szedł przodem, szukając drogi, załamywał się na lodowych mostach, a ratował go długi drąg, który niósł i trzymał tak, że za każdym razem padał w poprzek dziury zrobionej przez jego ciało."
