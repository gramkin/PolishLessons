  - clean: "Z kolei Spitz, może dlatego, że przeczuwał w Bucku groźnego rywala, nie przepuszczał żadnej okazji, żeby pokazać mu zęby. Wręcz zadawał sobie trud, żeby dokuczać Buckowi, i bezustannie starał się wywołać walkę, która mogła się skończyć tylko śmiercią jednego z nich. Mogło do niej dojść już na początku podróży, gdyby nie niezwykły wypadek. Pod koniec tego dnia rozbili ponury i nędzny obóz na brzegu jeziora Le Barge. Zawierucha śnieżna, wiatr, który ciął jak rozżarzony do białości nóż, i ciemność zmusiły ich do szukania miejsca na obóz po omacku."
    en: "On the other hand, possibly because he divined in Buck a dangerous rival, Spitz never lost an opportunity of showing his teeth. He even went out of his way to bully Buck, striving constantly to start the fight which could end only in the death of one or the other. Early in the trip this might have taken place had it not been for an unwonted accident. At the end of this day they made a bleak and miserable camp on the shore of Lake Le Barge. Driving snow, a wind that cut like a white-hot knife, and darkness had forced them to grope for a camping place."
    draft: true
    chunks:
      - pl: "Z kolei Spitz, może dlatego, że przeczuwał w Bucku groźnego rywala, nie przepuszczał żadnej okazji, żeby pokazać mu zęby."
        ru: "Шпиц же, может быть потому, что чуял в Бэке опасного соперника, не упускал ни одного случая показать ему зубы."
        note: "przeczuwać — предчувствовать; przepuścić okazję — упустить случай"
