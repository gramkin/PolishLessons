  - clean: "Zapach jedzenia doprowadził je do szaleństwa. Perrault znalazł jednego z łbem w skrzyni z żywnością. Jego pałka spadła ciężko na wystające żebra, a skrzynia przewróciła się na ziemię. W jednej chwili ze dwadzieścia wygłodniałych bestii rzuciło się, przepychając się, na chleb i boczek. Pałki spadały na nie, a one na to nie zważały. Skowyczały i wyły pod gradem ciosów, ale mimo to walczyły zażarcie, aż pożarły ostatni okruch."
    en: "They were crazed by the smell of the food. Perrault found one with head buried in the grub-box. His club landed heavily on the gaunt ribs, and the grub-box was capsized on the ground. On the instant a score of the famished brutes were scrambling for the bread and bacon. The clubs fell upon them unheeded. They yelped and howled under the rain of blows, but struggled none the less madly till the last crumb had been devoured."
    draft: true
    chunks:
      - pl: "Zapach jedzenia doprowadził je do szaleństwa."
        ru: "Запах еды свёл их с ума."
      - pl: " Perrault znalazł jednego z łbem w skrzyni z żywnością."
