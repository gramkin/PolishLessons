  - clean: "Spitz był równie chętny. Skowyczał z czystej wściekłości i zapału, krążąc tam i z powrotem w oczekiwaniu na okazję do skoku. Buck był nie mniej chętny i nie mniej ostrożny, gdy tak samo krążył tam i z powrotem, szukając przewagi. Ale wtedy właśnie stało się coś nieoczekiwanego, coś, co odsunęło ich walkę o władzę daleko w przyszłość, poza wiele męczących kilometrów szlaku i trudu."
    en: "Spitz was equally willing. He was crying with sheer rage and eagerness as he circled back and forth for a chance to spring in. Buck was no less eager, and no less cautious, as he likewise circled back and forth for the advantage. But it was then that the unexpected happened, the thing which projected their struggle for supremacy far into the future, past many a weary mile of trail and toil."
    draft: true
    chunks:
      - pl: "Spitz był równie chętny."
        ru: "Шпиц был не менее готов."
      - pl: " Skowyczał z czystej wściekłości i zapału, krążąc tam i z powrotem w oczekiwaniu na okazję do skoku."
        ru: "Он визжал от чистой ярости и азарта, кружа взад и вперёд в ожидании случая для прыжка."
      - pl: " Buck był nie mniej chętny i nie mniej ostrożny, gdy tak samo krążył tam i z powrotem, szukając przewagi."
        ru: "Бэк был не менее азартен и не менее осторожен, так же кружа взад и вперёд в поисках преимущества."
      - pl: " Ale wtedy właśnie stało się coś nieoczekiwanego, coś, co odsunęło ich walkę o władzę daleko w przyszłość,"
        ru: "Но именно тогда случилось неожиданное, то, что отодвинуло их борьбу за первенство далеко в будущее,"
        note: "odsunąć — отодвинуть"
      - pl: " poza wiele męczących kilometrów szlaku i trudu."
        ru: "за много утомительных километров тропы и труда."
    words: { "chętny": chetny, "krążąc": krazyc, "skoku": skok, "przewagi": przewaga, "szlaku": szlak, "trudu": trud }
  - clean: "Przekleństwo Perrault, głuchy odgłos pałki uderzającej o kościste ciało i przenikliwy skowyt bólu zapowiedziały wybuch piekielnego zamętu. Nagle okazało się, że obóz roi się od przyczajonych futrzastych postaci — wygłodzonych psów husky, osiemdziesięciu czy stu, które zwęszyły obóz z jakiejś indiańskiej wioski. Wkradły się, gdy Buck i Spitz walczyli, a kiedy obaj mężczyźni skoczyli między nie z grubymi pałkami, pokazały zęby i zaczęły się bronić."
    en: "An oath from Perrault, the resounding impact of a club upon a bony frame, and a shrill yelp of pain, heralded the breaking forth of pandemonium. The camp was suddenly discovered to be alive with skulking furry forms,—starving huskies, four or five score of them, who had scented the camp from some Indian village. They had crept in while Buck and Spitz were fighting, and when the two men sprang among them with stout clubs they showed their teeth and fought back."
    draft: true
    chunks:
      - pl: "Przekleństwo Perrault, głuchy odgłos pałki uderzającej o kościste ciało i przenikliwy skowyt bólu zapowiedziały wybuch piekielnego zamętu."
        ru: "Проклятие Перро, гулкий удар дубинки по костлявому телу и пронзительный визг боли возвестили начало адской кутерьмы."
        note: "kościsty — костлявый; skowyt — визг, вой"
      - pl: " Nagle okazało się, że obóz roi się od przyczajonych futrzastych postaci —"
        ru: "Вдруг оказалось, что лагерь кишит крадущимися мохнатыми фигурами, —"
        note: "roić się — кишеть; przyczajony — притаившийся"
      - pl: " wygłodzonych psów husky, osiemdziesięciu czy stu, które zwęszyły obóz z jakiejś indiańskiej wioski."
        ru: "изголодавшимися лайками, сотней или около того, которые учуяли лагерь из какой-то индейской деревни."
        note: "zwęszyć — учуять"
      - pl: " Wkradły się, gdy Buck i Spitz walczyli, a kiedy obaj mężczyźni skoczyli między nie z grubymi pałkami, pokazały zęby i zaczęły się bronić."
        ru: "Они прокрались, пока Бэк и Шпиц дрались, а когда двое мужчин бросились на них с толстыми дубинками, они оскалили зубы и стали отбиваться."
