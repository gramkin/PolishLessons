  - clean: "Kurier z powątpiewaniem pokręcił głową. Mając jeszcze sześćset pięćdziesiąt kilometrów szlaku do Dawson, nie mógł sobie pozwolić, żeby wśród psów wybuchła wścieklizna. Dwie godziny przekleństw i wysiłku doprowadziły uprząż do porządku, i zesztywniały od ran zaprzęg ruszył w drogę, mozolnie przedzierając się przez najtrudniejszy odcinek szlaku, jaki dotąd napotkali, i zresztą najtrudniejszy aż do samego Dawson."
