  - clean: "Ale Spitz, zimny i wyrachowany nawet w chwilach największego uniesienia, opuścił sforę i przeciął wąski przesmyk lądu tam, gdzie strumień zataczał długi łuk. Buck o tym nie wiedział, a gdy wybiegł zza zakrętu, z mroźną zjawą zająca wciąż mignącą przed nim, zobaczył, jak inna, większa mroźna zjawa skacze z nawisłego brzegu prosto na drogę zająca. Był to Spitz. Zając nie mógł zawrócić, a kiedy białe zęby złamały mu kręgosłup w powietrzu, krzyknął tak głośno, jak może krzyczeć śmiertelnie ranny człowiek. Na ten dźwięk — krzyk Życia strąconego z wierzchołka Życia w uścisk Śmierci — cała sfora za plecami Bucka podniosła piekielny chór radości."
    en: "But Spitz, cold and calculating even in his supreme moods, left the pack and cut across a narrow neck of land where the creek made a long bend around. Buck did not know of this, and as he rounded the bend, the frost wraith of a rabbit still flitting before him, he saw another and larger frost wraith leap from the overhanging bank into the immediate path of the rabbit. It was Spitz. The rabbit could not turn, and as the white teeth broke its back in mid air it shrieked as loudly as a stricken man may shriek. At sound of this, the cry of Life plunging down from Life’s apex in the grip of Death, the full pack at Buck’s heels raised a hell’s chorus of delight."
