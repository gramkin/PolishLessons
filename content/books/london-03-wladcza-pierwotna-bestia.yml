        ru: "Он даже нарочно старался задирать Бэка и постоянно пытался вызвать драку, которая могла закончиться только смертью одного из них."
        note: "bezustannie — беспрестанно"
      - pl: " Mogło do niej dojść już na początku podróży, gdyby nie niezwykły wypadek."
        ru: "Она могла бы произойти уже в начале пути, если бы не необычный случай."
      - pl: " Pod koniec tego dnia rozbili ponury i nędzny obóz na brzegu jeziora Le Barge."
        ru: "В конце этого дня они разбили унылый и жалкий лагерь на берегу озера Ле-Барж."
        note: "nędzny — жалкий"
      - pl: " Zawierucha śnieżna, wiatr, który ciął jak rozżarzony do białości nóż, i ciemność zmusiły ich do szukania miejsca na obóz po omacku."
        ru: "Метель, ветер, резавший, как раскалённый добела нож, и темнота вынудили их искать место для лагеря ощупью."
        note: "zawierucha — метель, вьюга; rozżarzony — раскалённый"
    words: { "groźnego": grozny, "trud": trud, "nędzny": nedzny, "brzegu": brzeg, "ciął": ciac, "omacku": omacek }
  - clean: "Trudno o gorsze położenie. Za ich plecami wznosiła się pionowa ściana skalna, a Perrault i François musieli rozpalić ogień i rozłożyć futra do spania na samym lodzie jeziora. Namiot porzucili w Dyea, żeby podróżować bez obciążenia. Kilka kawałków drewna wyrzuconego przez wodę dało im ogień, który przetopił lód i zapadł się, zostawiając ich do jedzenia kolacji w ciemności."
    en: "They could hardly have fared worse. At their backs rose a perpendicular wall of rock, and Perrault and François were compelled to make their fire and spread their sleeping robes on the ice of the lake itself. The tent they had discarded at Dyea in order to travel light. A few sticks of driftwood furnished them with a fire that thawed down through the ice and left them to eat supper in the dark."
    draft: true
    chunks:
      - pl: "Trudno o gorsze położenie."
        ru: "Хуже положения трудно было придумать."
      - pl: " Za ich plecami wznosiła się pionowa ściana skalna, a Perrault i François musieli rozpalić ogień i rozłożyć futra do spania na samym lodzie jeziora."
        ru: "За их спинами поднималась отвесная скальная стена, и Перро и Франсуа пришлось развести огонь и расстелить спальные меха прямо на льду озера."
        note: "pionowy — вертикальный, отвесный"
      - pl: " Namiot porzucili w Dyea, żeby podróżować bez obciążenia."
        ru: "Палатку они бросили в Дайе, чтобы идти налегке."
      - pl: " Kilka kawałków drewna wyrzuconego przez wodę dało im ogień, który przetopił lód i zapadł się, zostawiając ich do jedzenia kolacji w ciemności."
        ru: "Несколько обломков плавника дали им огонь, который протопил лёд и провалился, оставив их ужинать в темноте."
        note: "drewno wyrzucone przez wodę — плавник"
    words: { "Trudno": trudno, "wznosiła": wznosic, "pionowa": pionowy, "Namiot": namiot, "podróżować": podrozowac, "drewna": drewno }
  - clean: "Tuż pod osłaniającą skałą Buck urządził sobie legowisko. Było tak przytulne i ciepłe, że nie chciało mu się go opuszczać, gdy François rozdawał rybę, którą najpierw rozmroził nad ogniem. Ale kiedy Buck skończył swoją porcję i wrócił, zastał legowisko zajęte. Ostrzegawcze warknięcie powiedziało mu, że intruzem jest Spitz. Dotąd Buck unikał kłopotów ze swoim wrogiem, ale tego było już za wiele. Bestia w nim zaryczała. Skoczył na Spitza z furią, która zaskoczyła ich obu, a zwłaszcza Spitza, bo całe jego doświadczenie z Buckiem uczyło go, że jego rywal jest wyjątkowo bojaźliwym psem, który utrzymuje się na swojej pozycji tylko dzięki wielkiej wadze i rozmiarom."
    en: "Close in under the sheltering rock Buck made his nest. So snug and warm was it, that he was loath to leave it when François distributed the fish which he had first thawed over the fire. But when Buck finished his ration and returned, he found his nest occupied. A warning snarl told him that the trespasser was Spitz. Till now Buck had avoided trouble with his enemy, but this was too much. The beast in him roared. He sprang upon Spitz with a fury which surprised them both, and Spitz particularly, for his whole experience with Buck had gone to teach him that his rival was an unusually timid dog, who managed to hold his own only because of his great weight and size."
    draft: true
    chunks:
      - pl: "Tuż pod osłaniającą skałą Buck urządził sobie legowisko."
        ru: "Под самой прикрывавшей их скалой Бэк устроил себе логово."
      - pl: " Było tak przytulne i ciepłe, że nie chciało mu się go opuszczać, gdy François rozdawał rybę, którą najpierw rozmroził nad ogniem."
