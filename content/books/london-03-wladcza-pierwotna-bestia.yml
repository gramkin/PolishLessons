  - clean: "Ale Buck miał cechę, która prowadzi do wielkości — wyobraźnię. Walczył instynktem, ale umiał walczyć także głową. Natarł, jakby znów próbował dawnej sztuczki z barkiem, ale w ostatniej chwili przywarł nisko do śniegu i wpadł od dołu. Jego zęby zacisnęły się na lewej przedniej łapie Spitza. Rozległ się chrzęst łamanej kości i biały pies stanął przed nim na trzech łapach. Trzy razy Buck próbował go przewrócić, a potem powtórzył sztuczkę i złamał mu prawą przednią łapę."
    en: "But Buck possessed a quality that made for greatness—imagination. He fought by instinct, but he could fight by head as well. He rushed, as though attempting the old shoulder trick, but at the last instant swept low to the snow and in. His teeth closed on Spitz’s left fore leg. There was a crunch of breaking bone, and the white dog faced him on three legs. Thrice he tried to knock him over, then repeated the trick and broke the right fore leg."
