chapter: 3
chapterTitle: "Władcza pierwotna bestia"
chapterTitleRu: "Господствующий первобытный зверь"
level: B2
paragraphs:
  - clean: "Władcza pierwotna bestia była w Bucku silna, a w surowych warunkach życia na szlaku rosła i rosła. Był to jednak wzrost ukryty. Nowo narodzony spryt dawał mu opanowanie i panowanie nad sobą. Był zbyt zajęty przystosowywaniem się do nowego życia, żeby czuć się swobodnie, i nie tylko nie wszczynał bójek, ale unikał ich, kiedy tylko mógł. Jego postawę cechowała pewna rozwaga. Nie był skłonny do pochopności i porywczych czynów; a w zaciekłej nienawiści między nim a Spitzem nie okazywał niecierpliwości i unikał wszelkich zaczepek."
    en: "The dominant primordial beast was strong in Buck, and under the fierce conditions of trail life it grew and grew. Yet it was a secret growth. His newborn cunning gave him poise and control. He was too busy adjusting himself to the new life to feel at ease, and not only did he not pick fights, but he avoided them whenever possible. A certain deliberateness characterized his attitude. He was not prone to rashness and precipitate action; and in the bitter hatred between him and Spitz he betrayed no impatience, shunned all offensive acts."
    draft: true
    chunks:
