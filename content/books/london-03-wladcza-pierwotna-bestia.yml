  - clean: "Mimo bólu i bezradności Spitz walczył jak szalony, żeby utrzymać się na nogach. Widział milczący krąg, z lśniącymi oczami, wywieszonymi językami i srebrzystymi oddechami unoszącymi się w górę, jak zacieśnia się wokół niego, tak jak widywał podobne kręgi zacieśniające się w przeszłości wokół pokonanych przeciwników. Tylko że tym razem to on był pokonany."
    en: "Despite the pain and helplessness, Spitz struggled madly to keep up. He saw the silent circle, with gleaming eyes, lolling tongues, and silvery breaths drifting upward, closing in upon him as he had seen similar circles close in upon beaten antagonists in the past. Only this time he was the one who was beaten."
