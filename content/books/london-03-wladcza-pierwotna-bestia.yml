  - clean: "Wtedy Buck skoczył i odskoczył; ale w chwili skoku bark wreszcie trafił prosto w bark. Ciemny krąg zmienił się w punkt na zalanym księżycowym światłem śniegu, gdy Spitz zniknął z oczu. Buck stał i patrzył — zwycięski mistrz, władcza pierwotna bestia, która dokonała zabójstwa i uznała, że było dobre."
