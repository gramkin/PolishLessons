  - clean: "Starcie o przywództwo było nieuniknione. Buck go chciał. Chciał go, bo taka była jego natura, bo owładnęła nim ta bezimienna, niepojęta duma szlaku i uprzęży — duma, która trzyma psy przy pracy do ostatniego tchu, która każe im z radością umierać w uprzęży i łamie im serca, gdy się je z uprzęży wyprzęga. Była to duma Dave'a jako psa dyszlowego i Sol-leksa, gdy ciągnął ze wszystkich sił; duma, która ogarniała ich, kiedy zwijano obóz, i przemieniała z kwaśnych, posępnych bestii w napięte, gorliwe, ambitne stworzenia; duma, która popędzała ich przez cały dzień i opuszczała wieczorem przy rozbiciu obozu, pozwalając im znów popaść w ponury niepokój i niezadowolenie."
    en: "It was inevitable that the clash for leadership should come. Buck wanted it. He wanted it because it was his nature, because he had been gripped tight by that nameless, incomprehensible pride of the trail and trace—that pride which holds dogs in the toil to the last gasp, which lures them to die joyfully in the harness, and breaks their hearts if they are cut out of the harness. This was the pride of Dave as wheel-dog, of Sol-leks as he pulled with all his strength; the pride that laid hold of them at break of camp, transforming them from sour and sullen brutes into straining, eager, ambitious creatures; the pride that spurred them on all day and dropped them at pitch of camp at night, letting them fall back into gloomy unrest and uncontent."
