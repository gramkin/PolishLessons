  - clean: "Istnieje upojenie, które wyznacza szczyt życia i ponad które życie wznieść się nie może. I taki jest paradoks życia, że to upojenie przychodzi wtedy, gdy człowiek żyje najpełniej, a przychodzi jako całkowite zapomnienie o tym, że się żyje. To upojenie, to zapomnienie o życiu, przychodzi do artysty, porwanego i wyniesionego poza siebie w płomieniu natchnienia; przychodzi do żołnierza, który w szale wojny na pobojowisku odmawia pardonu; i przyszło do Bucka, gdy prowadził sforę, wydając dawny wilczy zew i goniąc pokarm, który był żywy i uciekał szybko przed nim w świetle księżyca."
