  - clean: "Buck nie krzyknął. Nie zatrzymał się, tylko natarł na Spitza bark w bark, tak mocno, że chybił gardła. Potoczyli się, przewracając się raz po raz w sypkim śniegu. Spitz stanął na nogi niemal tak, jakby wcale go nie przewrócono, ciął Bucka przez bark i odskoczył. Dwa razy jego zęby kłapnęły jak stalowe szczęki pułapki, gdy cofał się, szukając lepszego oparcia, z chudymi, uniesionymi wargami, które wykrzywiały się w warczeniu."
