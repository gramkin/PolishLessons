  - clean: "Tymczasem zdumione psy z zaprzęgu wyskoczyły ze swoich legowisk tylko po to, by rzucili się na nie dzicy najeźdźcy. Buck nigdy nie widział takich psów. Wyglądało, jakby kości miały im się przebić przez skórę. Były to istne szkielety, luźno okryte zabłoconymi skórami, z płonącymi oczami i zaślinionymi kłami. Ale szaleństwo głodu czyniło je przerażającymi i nie do odparcia. Nie było jak się im przeciwstawić. Przy pierwszym natarciu psy z zaprzęgu zostały zepchnięte pod skałę. Na Bucka napadły trzy psy husky i w mgnieniu oka miał rozszarpany i pocięty łeb i barki. Zgiełk był straszliwy. Billee jak zwykle skomlał. Dave i Sol-leks, ociekający krwią z dwudziestu ran, walczyli dzielnie ramię w ramię."
