    en: "Seven days from the time they pulled into Dawson, they dropped down the steep bank by the Barracks to the Yukon Trail, and pulled for Dyea and Salt Water. Perrault was carrying despatches if anything more urgent than those he had brought in; also, the travel pride had gripped him, and he purposed to make the record trip of the year. Several things favored him in this. The week’s rest had recuperated the dogs and put them in thorough trim. The trail they had broken into the country was packed hard by later journeyers. And further, the police had arranged in two or three places deposits of grub for dog and man, and he was travelling light."
