  - clean: "W jednej chwili Buck to zrozumiał. Nadszedł czas. Walka miała być na śmierć. Gdy krążyli wokół siebie, warcząc, z uszami położonymi po sobie, bacznie czyhając na przewagę, scena wydała się Buckowi znajoma. Zdawało mu się, że pamięta to wszystko — białe lasy i ziemię, i światło księżyca, i dreszcz walki. Nad bielą i ciszą zalegał upiorny spokój. Nie było najlżejszego powiewu — nic się nie poruszało, nie drgnął ani jeden liść, a widoczne oddechy psów unosiły się powoli i zawisały w mroźnym powietrzu."
