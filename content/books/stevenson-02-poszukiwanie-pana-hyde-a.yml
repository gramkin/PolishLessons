  - clean: "Poważny kamerdyner znał go i przywitał; nie kazano mu ani chwili czekać, lecz poprowadzono wprost od drzwi do jadalni, gdzie doktor Lanyon siedział samotnie przy winie. Był to serdeczny, zdrowy, elegancki dżentelmen o czerwonej twarzy, z czupryną przedwcześnie posiwiałych włosów i hałaśliwym, stanowczym sposobem bycia. Na widok pana Uttersona zerwał się z krzesła i powitał go obiema rękami. Ta serdeczność, jak to u niego, wyglądała nieco teatralnie; ale opierała się na prawdziwym uczuciu. Byli bowiem starymi przyjaciółmi, kolegami ze szkoły i z uczelni, obaj pełni szacunku dla siebie samych i dla siebie nawzajem, a także — co nie zawsze idzie w parze — ludźmi, którzy szczerze lubili swoje towarzystwo."
    en: "The solemn butler knew and welcomed him; he was subjected to no stage of delay, but ushered direct from the door to the dining-room where Dr. Lanyon sat alone over his wine. This was a hearty, healthy, dapper, red-faced gentleman, with a shock of hair prematurely white, and a boisterous and decided manner. At sight of Mr. Utterson, he sprang up from his chair and welcomed him with both hands. The geniality, as was the way of the man, was somewhat theatrical to the eye; but it reposed on genuine feeling. For these two were old friends, old mates both at school and college, both thorough respecters of themselves and of each other, and what does not always follow, men who thoroughly enjoyed each other’s company."
    draft: true
    chunks:
