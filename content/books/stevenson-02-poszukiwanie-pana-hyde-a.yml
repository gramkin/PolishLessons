  - clean: "Z tymi słowy zdmuchnął świecę, włożył płaszcz i wyruszył w stronę Cavendish Square, tej cytadeli medycyny, gdzie jego przyjaciel, wielki doktor Lanyon, miał dom i przyjmował tłumy pacjentów. „Jeśli ktoś wie, to Lanyon” — pomyślał."
    en: "With that he blew out his candle, put on a greatcoat, and set forth in the direction of Cavendish Square, that citadel of medicine, where his friend, the great Dr. Lanyon, had his house and received his crowding patients. “If anyone knows, it will be Lanyon,” he had thought."
