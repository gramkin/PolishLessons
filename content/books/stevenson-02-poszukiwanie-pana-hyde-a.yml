  - clean: "Jego przeszłość była dość nienaganna; niewielu ludzi mogłoby przeglądać zwoje swego życia z mniejszą obawą; a jednak czuł się upokorzony do prochu przez wiele złych rzeczy, które zrobił, i znów podniesiony do trzeźwej i lękliwej wdzięczności przez wiele tych, które był tak bliski popełnienia, a jednak ich uniknął. A potem, powracając do poprzedniego tematu, poczuł iskrę nadziei. „Ten panicz Hyde, gdyby mu się przyjrzeć — pomyślał — musi mieć własne sekrety; czarne sekrety, sądząc z wyglądu; sekrety, przy których najgorsze sprawki biednego Jekylla byłyby jak światło słoneczne. Tak dalej być nie może."
