  - clean: "Tam otworzył sejf, wyjął z najbardziej ukrytej przegródki dokument, na którego kopercie widniał napis „Testament doktora Jekylla”, i z zachmurzonym czołem usiadł, żeby przestudiować jego treść. Testament był pisany własnoręcznie, bo pan Utterson, choć przyjął go na przechowanie, kiedy już powstał, odmówił najmniejszej pomocy przy jego sporządzaniu; stanowił on nie tylko, że w razie śmierci Henry'ego Jekylla, doktora medycyny, doktora prawa cywilnego, doktora praw, członka Towarzystwa Królewskiego itd., cały jego majątek ma przejść w ręce jego „przyjaciela i dobroczyńcy Edwarda Hyde'a”, ale też, że w razie „zniknięcia doktora Jekylla lub jego niewyjaśnionej nieobecności przez okres przekraczający trzy miesiące kalendarzowe” wspomniany Edward Hyde ma bez dalszej zwłoki zająć miejsce wspomnianego Henry'ego Jekylla, wolny od wszelkich ciężarów i zobowiązań poza wypłatą kilku drobnych sum domownikom doktora."
    en: "There he opened his safe, took from the most private part of it a document endorsed on the envelope as Dr. Jekyll’s Will and sat down with a clouded brow to study its contents. The will was holograph, for Mr. Utterson though he took charge of it now that it was made, had refused to lend the least assistance in the making of it; it provided not only that, in case of the decease of Henry Jekyll, M.D., D.C.L., L.L.D., F.R.S., etc., all his possessions were to pass into the hands of his “friend and benefactor Edward Hyde,” but that in case of Dr. Jekyll’s “disappearance or unexplained absence for any period exceeding three calendar months,” the said Edward Hyde should step into the said Henry Jekyll’s shoes without further delay and free from any burthen or obligation beyond the payment of a few small sums to the members of the doctor’s household."
    draft: true
    chunks:
      - pl: "Tam otworzył sejf, wyjął z najbardziej ukrytej przegródki dokument,"
        ru: "Там он открыл сейф, достал из самого потайного отделения документ,"
        note: "przegródka — отделение"
