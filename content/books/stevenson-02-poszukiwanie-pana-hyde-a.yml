  - clean: "Dokument ten od dawna był dla adwokata solą w oku. Raził go zarówno jako prawnika, jak i jako miłośnika rozsądnych i zwyczajnych stron życia, dla którego wszystko, co fantastyczne, było nieprzyzwoite. Dotąd jego oburzenie podsycała nieznajomość pana Hyde'a; teraz, przez nagły zwrot, podsycała je wiedza. Było już dość źle, gdy nazwisko było tylko nazwiskiem, o którym nie mógł się niczego dowiedzieć. Gorzej było, gdy zaczęło się przyoblekać w odrażające cechy; i z ruchomych, nieuchwytnych mgieł, które tak długo zwodziły jego wzrok, wyskoczył nagły, wyraźny obraz diabła."
    en: "This document had long been the lawyer’s eyesore. It offended him both as a lawyer and as a lover of the sane and customary sides of life, to whom the fanciful was the immodest. And hitherto it was his ignorance of Mr. Hyde that had swelled his indignation; now, by a sudden turn, it was his knowledge. It was already bad enough when the name was but a name of which he could learn no more. It was worse when it began to be clothed upon with detestable attributes; and out of the shifting, insubstantial mists that had so long baffled his eye, there leaped up the sudden, definite presentment of a fiend."
    draft: true
    chunks:
      - pl: "Dokument ten od dawna był dla adwokata solą w oku."
        ru: "Этот документ давно был для адвоката бельмом на глазу."
        note: "sól w oku — бельмо на глазу"
      - pl: " Raził go zarówno jako prawnika,"
        ru: "Он коробил его и как юриста,"
        note: "razić — коробить, оскорблять"
      - pl: " jak i jako miłośnika rozsądnych i zwyczajnych stron życia, dla którego wszystko, co fantastyczne, było nieprzyzwoite."
        ru: "и как любителя здравых и привычных сторон жизни, для которого всё причудливое было непристойным."
      - pl: " Dotąd jego oburzenie podsycała nieznajomość pana Hyde'a;"
        ru: "До сих пор его негодование подогревало незнание мистера Хайда;"
        note: "podsycać — разжигать, подогревать; oburzenie — негодование"
      - pl: " teraz, przez nagły zwrot, podsycała je wiedza."
        ru: "теперь, по внезапному повороту, его подогревало знание."
      - pl: " Było już dość źle, gdy nazwisko było tylko nazwiskiem, o którym nie mógł się niczego dowiedzieć."
        ru: "Было уже достаточно плохо, когда имя было только именем, о котором он ничего не мог узнать."
      - pl: " Gorzej było, gdy zaczęło się przyoblekać w odrażające cechy;"
        ru: "Хуже стало, когда оно начало облекаться в отвратительные черты;"
        note: "przyoblekać się — облекаться"
      - pl: " i z ruchomych, nieuchwytnych mgieł, które tak długo zwodziły jego wzrok,"
        ru: "и из зыбких, бесплотных туманов, так долго обманывавших его взор,"
        note: "nieuchwytny — неуловимый; zwodzić — обманывать"
