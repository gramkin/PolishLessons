        note: "stanowić — устанавливать, гласить"
      - pl: " cały jego majątek ma przejść w ręce jego „przyjaciela i dobroczyńcy Edwarda Hyde'a”,"
        ru: "всё его имущество должно перейти в руки его «друга и благодетеля Эдварда Хайда»,"
        note: "dobroczyńca — благодетель"
      - pl: " ale też, że w razie „zniknięcia doktora Jekylla lub jego niewyjaśnionej nieobecności przez okres przekraczający trzy miesiące kalendarzowe”"
        ru: "но и что в случае «исчезновения доктора Джекила или его необъяснимого отсутствия в течение срока, превышающего три календарных месяца»,"
        note: "przekraczać — превышать"
      - pl: " wspomniany Edward Hyde ma bez dalszej zwłoki zająć miejsce wspomnianego Henry'ego Jekylla,"
        ru: "упомянутый Эдвард Хайд должен без дальнейшего промедления занять место упомянутого Генри Джекила,"
        note: "zwłoka — промедление"
      - pl: " wolny od wszelkich ciężarów i zobowiązań poza wypłatą kilku drobnych sum domownikom doktora."
        ru: "свободный от всяких обременений и обязательств, кроме выплаты нескольких небольших сумм домочадцам доктора."
        note: "domownik — домочадец"
