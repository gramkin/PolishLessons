  - clean: "— Musi być coś jeszcze — rzekł zakłopotany dżentelmen. — Coś więcej tam jest, gdybym tylko umiał to nazwać. Boże drogi, ten człowiek wydaje się ledwie ludzki! Coś jaskiniowego, powiedzmy? A może to stara historia o doktorze Fellu? Czy też tylko blask plugawej duszy, który tak przeziera przez swe gliniane naczynie i je przeobraża? To ostatnie, jak sądzę; bo, o mój biedny stary Harry Jekyllu, jeśli kiedykolwiek wyczytałem na twarzy podpis szatana, to na twarzy twego nowego przyjaciela."
