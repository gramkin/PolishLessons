paragraphs:
  - clean: "Tego wieczoru pan Utterson wrócił do swego kawalerskiego domu w posępnym nastroju i usiadł do obiadu bez apetytu. W niedziele miał zwyczaj, gdy posiłek dobiegł końca, siadać tuż przy kominku z tomem jakiejś suchej teologii na pulpicie, aż zegar sąsiedniego kościoła wybije dwunastą; wtedy szedł statecznie i z wdzięcznością do łóżka. Tej nocy jednak, gdy tylko sprzątnięto obrus, wziął świecę i poszedł do swego gabinetu."
    en: "That evening Mr. Utterson came home to his bachelor house in sombre spirits and sat down to dinner without relish. It was his custom of a Sunday, when this meal was over, to sit close by the fire, a volume of some dry divinity on his reading desk, until the clock of the neighbouring church rang out the hour of twelve, when he would go soberly and gratefully to bed. On this night however, as soon as the cloth was taken away, he took up a candle and went into his business room."
    draft: true
