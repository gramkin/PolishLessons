chapter: 19
chapterTitle: "Pieśń XIX"
chapterTitleRu: "Песнь XIX. Сирена и папа Адриан"
level: B2
paragraphs:
  - clean: "(Widzenie rozkoszy doczesnych i łaski. Krąg V. Skąpcy i marnotrawcy. Piąty poranek drogi. Czwarte P znika. Papież Hadrian V.)"
    chunks:
      - pl: "(Widzenie rozkoszy doczesnych i łaski. Krąg V. Skąpcy i marnotrawcy. Piąty poranek drogi. Czwarte P znika. Papież Hadrian V.)"
        ru: "(Видение земных утех и благодати. Круг V. Скупцы и расточители. Пятое утро пути. Четвёртое «P» исчезает. Папа Адриан V.)"
        note: "doczesny — земной, временный"
    words: { "Widzenie": widziec, "Krąg": krag, "poranek": poranek, "znika": znikac, "Papież": papiez }
  - clean: "W godzinie, kiedy gasnące dnia żary,\nWystygłe zimnem ziemi lub Saturna,\nKsiężycowego już nie grzeją chłodu:\nGdy geomanta swoje szczęście czyta\nW gwieździe, co jemu wybłyska od Wschodu\nW chwili przedświtu, nim zorza bezchmurna\nRozwidni wkrótce gościniec nieb szary;\nPrzyśniła mi się zajękła kobieta,\nZ odciętą ręką, wzrok jej zezem pada,\nKrzywa, a twarz jej jak tynk muru blada."
    verse: true
    chunks:
      - pl: "W godzinie, kiedy gasnące dnia żary,"
        ru: "В час, когда угасающий жар дня,"
      - pl: "\nWystygłe zimnem ziemi lub Saturna,"
        ru: "остывший от холода земли или Сатурна,"
      - pl: "\nKsiężycowego już nie grzeją chłodu:"
        ru: "уже не согревает лунного холода:"
      - pl: "\nGdy geomanta swoje szczęście czyta"
        ru: "когда геомант читает своё счастье"
        note: "geomanta — гадатель по точкам на земле"
      - pl: "\nW gwieździe, co jemu wybłyska od Wschodu"
        ru: "в звезде, что блещет ему с востока"
      - pl: "\nW chwili przedświtu, nim zorza bezchmurna"
        ru: "в миг перед рассветом, прежде чем безоблачная заря"
      - pl: "\nRozwidni wkrótce gościniec nieb szary;"
        ru: "вскоре осветит серый путь небес;"
        note: "gościniec — большая дорога"
      - pl: "\nPrzyśniła mi się zajękła kobieta,"
        ru: "мне приснилась заикающаяся женщина,"
        note: "zajękły — заикающийся"
      - pl: "\nZ odciętą ręką, wzrok jej zezem pada,"
        ru: "с отрубленной рукой, взгляд её косит,"
        note: "у Данте — с искалеченными руками"
      - pl: "\nKrzywa, a twarz jej jak tynk muru blada."
        ru: "кривая, а лицо её бледное, как штукатурка стены."
        note: "tynk — штукатурка"
    words: { "zimnem": zimno, "Księżycowego": ksiezycowy, "grzeją": grzac, "gościniec": gosciniec, "szary": szary, "blada": blady }
  - clean: "Patrzałem na nią, a jak słońce ciepłe\nOżywia członki nocnym chłodem skrzepłe,\nWzrok mój jej język rozwiązał, jej ciało\nZ wolna zagrzewał, prostował ją całą\nI zarumieniał trupio blade lica,\nJak gdy miłości wzrok czuje dziewica."
    verse: true
    chunks:
      - pl: "Patrzałem na nią, a jak słońce ciepłe"
        ru: "Я смотрел на неё, и как тёплое солнце"
      - pl: "\nOżywia członki nocnym chłodem skrzepłe,"
        ru: "оживляет члены, окоченевшие от ночного холода,"
      - pl: "\nWzrok mój jej język rozwiązał, jej ciało"
        ru: "мой взгляд развязал ей язык, её тело"
      - pl: "\nZ wolna zagrzewał, prostował ją całą"
        ru: "медленно согревал, выпрямлял её всю"
      - pl: "\nI zarumieniał trupio blade lica,"
        ru: "и румянил мертвенно-бледные щёки,"
      - pl: "\nJak gdy miłości wzrok czuje dziewica."
        ru: "как когда дева чувствует взгляд любви."
    words: { "słońce": slonce, "ciepłe": cieply, "nocnym": nocny, "Wzrok": wzrok, "język": jezyk, "dziewica": dziewica }
  - clean: "Tak rozwiązany język dźwięcznie nucił,\nDziś bym ją słuchać z trudnością porzucił.\n«Jestem» śpiewała: «ta syrena słodka,\nKtórą gdy żeglarz wędrujący spotka,\nStaje wśród morza i nadstawia ucha,\nZ taką rozkoszą mojej pieśni słucha!"
    verse: true
    chunks:
      - pl: "Tak rozwiązany język dźwięcznie nucił,"
        ru: "Так развязанный язык звонко напевал,"
      - pl: "\nDziś bym ją słuchać z trudnością porzucił."
        ru: "сегодня я с трудом перестал бы её слушать."
      - pl: "\n«Jestem» śpiewała: «ta syrena słodka,"
        ru: "«Я, — пела она, — та сладкая сирена,"
      - pl: "\nKtórą gdy żeglarz wędrujący spotka,"
        ru: "которую, когда странствующий мореход встретит,"
      - pl: "\nStaje wśród morza i nadstawia ucha,"
        ru: "останавливается посреди моря и подставляет ухо,"
      - pl: "\nZ taką rozkoszą mojej pieśni słucha!"
        ru: "с таким наслаждением он слушает мою песнь!"
    words: { "rozwiązany": rozwiazac, "porzucił": porzucic, "śpiewała": spiewac, "syrena": syrena, "morza": morze, "pieśni": piesn }
  - clean: "Śpiew mój z pół drogi Ulissesa zwrócił,\nRzadki odchodzi, kto wszedł w progi moje,\nRzadki się trzeźwi, kogo ja upoję».\nJeszcze syrena ust swych nie zamknęła,\nGdy przy mnie święta niewiasta stanęła,\nA pragnąc pierwszą zmieszać swą pogardą,\n«Kto ta kobieta?» zapytała hardo."
    verse: true
    chunks:
      - pl: "Śpiew mój z pół drogi Ulissesa zwrócił,"
        ru: "Моё пение повернуло Улисса с полпути,"
      - pl: "\nRzadki odchodzi, kto wszedł w progi moje,"
        ru: "редко уходит тот, кто вошёл в мои пороги,"
      - pl: "\nRzadki się trzeźwi, kogo ja upoję»."
        ru: "редко трезвеет тот, кого я опою»."
        note: "upoić — опоить"
      - pl: "\nJeszcze syrena ust swych nie zamknęła,"
        ru: "Ещё сирена не сомкнула своих уст,"
      - pl: "\nGdy przy mnie święta niewiasta stanęła,"
        ru: "когда возле меня встала святая жена"
      - pl: "\nA pragnąc pierwszą zmieszać swą pogardą,"
        ru: "и, желая смутить первую своим презрением,"
      - pl: "\n«Kto ta kobieta?» zapytała hardo."
        ru: "«Кто эта женщина?» — спросила надменно."
    words: { "zwrócił": zwrocic, "Rzadki": rzadki, "progi": prog, "niewiasta": niewiasta, "stanęła": stanac, "zmieszać": zmieszac }
  - clean: "Wirgili z cześcią w swym sercu poczętą\nPodszedł i patrzał na niewiastę świętą.\nA ta, gdy pierwszą za piersi schwyciła,\nDarła jej szatę, jej brzuch mi odkryła,\nSkąd do mnie buchnął taki swąd w tej chwili,\nAż się zbudziłem; a dobry Wirgili\nMówił z słodyczą nad wszelkie wyrazy:\n«Już cię wołałem najmniej ze trzy razy,\nWstań, idźmy szukać w tych skałach przechodu»."
    verse: true
    chunks:
      - pl: "Wirgili z cześcią w swym sercu poczętą"
        ru: "Вергилий с почтением, зачатым в своём сердце,"
      - pl: "\nPodszedł i patrzał na niewiastę świętą."
        ru: "подошёл и смотрел на святую жену."
      - pl: "\nA ta, gdy pierwszą za piersi schwyciła,"
        ru: "А та, схватив первую за грудь,"
      - pl: "\nDarła jej szatę, jej brzuch mi odkryła,"
        ru: "разорвала ей одежду, обнажила мне её живот,"
      - pl: "\nSkąd do mnie buchnął taki swąd w tej chwili,"
        ru: "откуда на меня пахнуло таким смрадом в этот миг,"
      - pl: "\nAż się zbudziłem; a dobry Wirgili"
        ru: "что я проснулся; а добрый Вергилий"
      - pl: "\nMówił z słodyczą nad wszelkie wyrazy:"
        ru: "говорил со сладостью превыше всяких слов:"
      - pl: "\n«Już cię wołałem najmniej ze trzy razy,"
        ru: "«Я звал тебя уже по крайней мере три раза,"
      - pl: "\nWstań, idźmy szukać w tych skałach przechodu»."
        ru: "встань, пойдём искать прохода в этих скалах»."
    words: { "poczętą": poczac, "brzuch": brzuch, "słodyczą": slodycz, "wyrazy": wyraz, "wołałem": wolac, "skałach": skala }
  - clean: "Wstałem, już kręgi pozłacał blask wschodu\nTej świętej góry; dzień świtał wesoło,\nGdy szedłem, słońce miałem poza sobą.\nIdąc za wodzem schyliłem me czoło,\nPodobny temu, co dźwiga na głowie\nMyśli tysiące, a swoją osobą\nUdaje ścięty łuk mostu w połowie."
    verse: true
    chunks:
      - pl: "Wstałem, już kręgi pozłacał blask wschodu"
        ru: "Я встал, уже блеск восхода позлащал круги"
      - pl: "\nTej świętej góry; dzień świtał wesoło,"
        ru: "этой святой горы; день весело занимался,"
      - pl: "\nGdy szedłem, słońce miałem poza sobą."
        ru: "когда я шёл, солнце у меня было позади."
      - pl: "\nIdąc za wodzem schyliłem me czoło,"
        ru: "Идя за вождём, я склонил чело,"
      - pl: "\nPodobny temu, co dźwiga na głowie"
        ru: "подобный тому, кто несёт на голове"
      - pl: "\nMyśli tysiące, a swoją osobą"
        ru: "тысячи мыслей, а своей особой"
      - pl: "\nUdaje ścięty łuk mostu w połowie."
        ru: "изображает срезанную пополам арку моста."
    words: { "Wstałem": wstac, "blask": blask, "wschodu": wschod, "wodzem": wodz, "czoło": czolo, "mostu": most }
  - clean: "Kiedym posłyszał: «Idźcie, tu iść trzeba!»\nSłowa te wiały melodyją z nieba;\nTen, który mówił, jak łabędzia białe\nOtworzył skrzydła i prowadził w skałę.\nZ obu stron twarda ścisnęła nas góra.\nMusnął mi czoło wstrząsając swe pióra,\n«Ci, którzy płaczą» rzekł, «błogosławieni,\nŁzy ich pociecha w wesele zamieni»."
    verse: true
    chunks:
      - pl: "Kiedym posłyszał: «Idźcie, tu iść trzeba!»"
        ru: "Когда я услышал: «Идите, здесь надо идти!» —"
      - pl: "\nSłowa te wiały melodyją z nieba;"
        ru: "эти слова веяли мелодией с неба;"
      - pl: "\nTen, który mówił, jak łabędzia białe"
        ru: "тот, кто говорил, раскрыл, как у лебедя, белые"
        note: "łabędź — лебедь"
      - pl: "\nOtworzył skrzydła i prowadził w skałę."
        ru: "крылья и повёл в скалу."
      - pl: "\nZ obu stron twarda ścisnęła nas góra."
        ru: "С обеих сторон нас сжала твёрдая гора."
      - pl: "\nMusnął mi czoło wstrząsając swe pióra,"
        ru: "Он коснулся моего лба, встряхнув перьями:"
        note: "musnąć — коснуться"
      - pl: "\n«Ci, którzy płaczą» rzekł, «błogosławieni,"
        ru: "«Блаженны, — сказал, — плачущие,"
      - pl: "\nŁzy ich pociecha w wesele zamieni»."
        ru: "утешение превратит их слёзы в радость»."
    words: { "łabędzia": labedz, "skrzydła": skrzydlo, "Musnął": musnac, "rzekł": rzec, "błogosławieni": blogoslawic, "zamieni": zamienic }
  - clean: "— «Po co tak w ziemię spuszczasz twe spojrzenie?»\nPrzemówił wódz mój, gdy anioł skrzydłami\nCicho w powietrzu wznosił się nad nami.\nA ja: — «Tak ściga mię nowe widzenie,\nWtrąca w niepokój, zachodzi mi drogę,\nŻe odeń myśli oderwać nie mogę»."
    verse: true
    chunks:
      - pl: "— «Po co tak w ziemię spuszczasz twe spojrzenie?»"
        ru: "— «Зачем ты так опускаешь взгляд в землю?» —"
      - pl: "\nPrzemówił wódz mój, gdy anioł skrzydłami"
        ru: "заговорил мой вождь, когда ангел крыльями"
      - pl: "\nCicho w powietrzu wznosił się nad nami."
        ru: "тихо поднимался в воздухе над нами."
      - pl: "\nA ja: — «Tak ściga mię nowe widzenie,"
        ru: "А я: — «Так меня преследует новое видение,"
      - pl: "\nWtrąca w niepokój, zachodzi mi drogę,"
        ru: "ввергает в тревогу, заступает мне дорогу,"
      - pl: "\nŻe odeń myśli oderwać nie mogę»."
        ru: "что я не могу оторвать от него мысли»."
        note: "odeń = od niego"
    words: { "ziemię": ziemia, "Przemówił": przemowic, "anioł": aniol, "powietrzu": powietrze, "wznosił": wznosic, "Wtrąca": wtracac }
  - clean: "— «Starą guślarkę» rzekł «widziałeś z bliska,\nCo w niższych kręgach tyle łez wyciska.\nWidziałeś, człowiek przez jakie pochopy\nI środki od niej oderwać się może.\nDość o tym: w ziemię zarywszy twe stopy,\nSpojrzyj w niebiosa, na te cuda boże,\nJakimi wzrok twój przynęca król wieczny,\nTocząc tak wielki po nich krąg słoneczny»."
    verse: true
    chunks:
      - pl: "— «Starą guślarkę» rzekł «widziałeś z bliska,"
        ru: "— «Старую колдунью, — сказал он, — ты видел вблизи,"
        note: "guślarka — колдунья"
      - pl: "\nCo w niższych kręgach tyle łez wyciska."
        ru: "что в низших кругах выжимает столько слёз."
        note: "у Данте — в трёх верхних кругах"
      - pl: "\nWidziałeś, człowiek przez jakie pochopy"
        ru: "Ты видел, какими побуждениями и средствами"
        note: "pochop — побуждение"
      - pl: "\nI środki od niej oderwać się może."
        ru: "человек может от неё оторваться."
      - pl: "\nDość o tym: w ziemię zarywszy twe stopy,"
        ru: "Довольно об этом: упершись ногами в землю,"
        note: "zaryć — упереться"
      - pl: "\nSpojrzyj w niebiosa, na te cuda boże,"
        ru: "взгляни на небеса, на эти чудеса Божьи,"
      - pl: "\nJakimi wzrok twój przynęca król wieczny,"
        ru: "которыми приманивает твой взгляд вечный царь,"
        note: "przynęcać — приманивать"
      - pl: "\nTocząc tak wielki po nich krąg słoneczny»."
        ru: "катя по ним столь великий солнечный круг»."
    words: { "niższych": niski, "niebiosa": niebiosa, "cuda": cud, "wieczny": wieczny, "Tocząc": toczyc, "słoneczny": sloneczny }
  - clean: "Jak sokół naprzód nogom się przygląda,\nNim na głos łowca podniesie swe oczy,\nA potem skrzydła do lotu roztoczy,\nPolować zdobycz, której tak pożąda:\nTak ja, o ile rozszczepia się skała\nDla stopy, aby po niej wzwyż stąpała,\nSzedłem bez przerwy długą szyją lochu,\nAż do piątego kręgu; tam widziałem\nLeżące duchy twarzami do ziemi,\nPłacząc, mówiły, zda się, słowy temi:"
    verse: true
    chunks:
      - pl: "Jak sokół naprzód nogom się przygląda,"
        ru: "Как сокол сперва разглядывает свои лапы,"
      - pl: "\nNim na głos łowca podniesie swe oczy,"
        ru: "прежде чем на голос охотника поднимет глаза,"
      - pl: "\nA potem skrzydła do lotu roztoczy,"
        ru: "а потом расправит крылья для полёта,"
      - pl: "\nPolować zdobycz, której tak pożąda:"
        ru: "чтобы ловить добычу, которой так жаждет:"
      - pl: "\nTak ja, o ile rozszczepia się skała"
        ru: "так я, насколько расщепляется скала"
      - pl: "\nDla stopy, aby po niej wzwyż stąpała,"
        ru: "для ноги, чтобы она поднималась по ней ввысь,"
      - pl: "\nSzedłem bez przerwy długą szyją lochu,"
        ru: "шёл без перерыва по длинной горловине прохода,"
      - pl: "\nAż do piątego kręgu; tam widziałem"
        ru: "до самого пятого круга; там я видел"
      - pl: "\nLeżące duchy twarzami do ziemi,"
        ru: "духов, лежащих лицами к земле;"
      - pl: "\nPłacząc, mówiły, zda się, słowy temi:"
        ru: "плача, они говорили, кажется, такими словами:"
    words: { "naprzód": naprzod, "przygląda": przygladac, "łowca": lowca, "Polować": polowac, "przerwy": przerwa, "szyją": szyja }
  - clean: "«Ach! dusza moja przylgnęła do prochu».\nI tak wzdychały piersiami całemi,\nŻe ledwo uchem kilka słów schwytałem.\n— «Wybrani Pańscy! w których sprawiedliwość\nZ nadzieją słodzi waszych mąk dotkliwość,\nWskażcie, jak dalej iść na wyższe stopnie»."
    verse: true
    chunks:
      - pl: "«Ach! dusza moja przylgnęła do prochu»."
        ru: "«Ах! прилипла душа моя к праху»."
        note: "псалом 118"
      - pl: "\nI tak wzdychały piersiami całemi,"
        ru: "И так вздыхали всей грудью,"
      - pl: "\nŻe ledwo uchem kilka słów schwytałem."
        ru: "что я едва уловил ухом несколько слов."
      - pl: "\n— «Wybrani Pańscy! w których sprawiedliwość"
        ru: "— «Избранники Господни! у которых справедливость"
      - pl: "\nZ nadzieją słodzi waszych mąk dotkliwość,"
        ru: "с надеждой смягчает мучительность ваших мук,"
        note: "dotkliwość — мучительность"
      - pl: "\nWskażcie, jak dalej iść na wyższe stopnie»."
        ru: "укажите, как идти дальше на высшие ступени»."
    words: { "prochu": proch, "piersiami": piers, "ledwo": ledwo, "schwytałem": schwytac, "sprawiedliwość": sprawiedliwosc, "Wskażcie": wskazac }
  - clean: "— «Gdy przychodzicie nie leżeć tu z nami,\nLecz pielgrzymując tej góry kręgami\nTylko szukacie drogi; więc roztropnie,\nIdąc półkolem jak krąg zatoczony,\nOd brzegu prawej trzymajcie się strony».\nPoeta pytał, a duch odpowiedział;\nZ tych słów poznałem, że duch i połowy\nWieści, skąd idę i dokąd, nie wiedział."
    verse: true
    chunks:
      - pl: "— «Gdy przychodzicie nie leżeć tu z nami,"
