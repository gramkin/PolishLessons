  - clean: "Dlaczego chrzest był tak ważny? Po pierwsze, Polska stała się częścią chrześcijańskiej Europy i Niemcy stracili pretekst do wojny. Po drugie, do kraju przybyli duchowni, którzy umieli czytać i pisać po łacinie. Pomagali księciu rządzić, pisali listy i dokumenty, prowadzili rozmowy z obcymi dworami. Po trzecie, Kościół przyniósł nową sztukę, kamienne budownictwo i szkoły. Dlatego to właśnie rok 966 uważa się za początek państwa polskiego. Od 2019 roku 14 kwietnia jest w Polsce świętem państwowym."
    draft: true
    chunks:
      - pl: "Dlaczego chrzest był tak ważny?"
        ru: "Почему крещение было так важно?"
      - pl: " Po pierwsze, Polska stała się częścią chrześcijańskiej Europy i Niemcy stracili pretekst do wojny."
        ru: "Во-первых, Польша стала частью христианской Европы, и немцы лишились предлога для войны."
