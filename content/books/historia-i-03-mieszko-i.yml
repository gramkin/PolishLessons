  - clean: "W 966 roku Mieszko przyjął chrzest razem ze swoją drużyną. Nie wiemy dokładnie, gdzie i kiedy to się stało. Najczęściej wymienia się Wielką Sobotę, 14 kwietnia 966 roku, a jako miejsce Gniezno, Poznań albo Ostrów Lednicki. W Poznaniu i na Ostrowie Lednickim archeolodzy odkryli resztki kamiennych budowli i baseny chrzcielne z tamtych czasów. Zwykli ludzie przyjmowali nową wiarę powoli, przez wiele pokoleń. Jeszcze długo czcili starych bogów i obchodzili dawne święta."
    draft: true
    chunks:
      - pl: "W 966 roku Mieszko przyjął chrzest razem ze swoją drużyną."
        ru: "В 966 году Мешко принял крещение вместе со своей дружиной."
      - pl: " Nie wiemy dokładnie, gdzie i kiedy to się stało."
        ru: "Мы точно не знаем, где и когда это произошло."
      - pl: " Najczęściej wymienia się Wielką Sobotę, 14 kwietnia 966 roku, a jako miejsce Gniezno, Poznań albo Ostrów Lednicki."
        ru: "Чаще всего называют Великую субботу, 14 апреля 966 года, а местом — Гнезно, Познань или Остров-Ледницкий."
        note: "Wielka Sobota — Великая (Страстная) суббота, канун Пасхи"
      - pl: " W Poznaniu i na Ostrowie Lednickim archeolodzy odkryli resztki kamiennych budowli i baseny chrzcielne z tamtych czasów."
        ru: "В Познани и на Острове-Ледницком археологи нашли остатки каменных построек и крестильные купели тех времён."
        note: "basen chrzcielny — купель для крещения; resztki — остатки"
      - pl: " Zwykli ludzie przyjmowali nową wiarę powoli, przez wiele pokoleń."
        ru: "Простые люди принимали новую веру медленно, на протяжении многих поколений."
        note: "pokolenie — поколение"
      - pl: " Jeszcze długo czcili starych bogów i obchodzili dawne święta."
