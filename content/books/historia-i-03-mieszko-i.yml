        ru: "В 965 году он женился на Добраве, дочери чешского князя Болеслава I."
        note: "Dobrawa, później zwana Dąbrówką — Добрава, позднее Домбровка"
      - pl: " Gall Anonim pisze, że wcześniej Mieszko miał według pogańskiego zwyczaju siedem żon."
        ru: "Галл Аноним пишет, что прежде Мешко по языческому обычаю имел семь жён."
      - pl: " Dobrawa zgodziła się wyjść za niego tylko pod warunkiem, że porzuci on pogaństwo."
        ru: "Добрава согласилась выйти за него только при условии, что он откажется от язычества."
        note: "pod warunkiem — при условии; porzucić — бросить, оставить"
      - pl: " Niemiecki biskup Thietmar opowiada o niej ciekawą historię."
        ru: "Немецкий епископ Титмар рассказывает о ней любопытную историю."
      - pl: " W czasie pierwszego postu po ślubie Dobrawa jadła mięso, żeby mąż widział, że nowa wiara nie jest dla niego zbyt surowa."
        ru: "Во время первого поста после свадьбы Добрава ела мясо, чтобы муж видел, что новая вера не слишком для него сурова."
        note: "post — пост; surowy — суровый, строгий"
      - pl: " Thietmar, który był bardzo pobożny, nie pochwalał tego, ale przyznawał, że cel był dobry."
