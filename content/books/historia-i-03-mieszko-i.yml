paragraphs:
  - clean: "W 963 roku saski mnich Widukind zapisał w swojej kronice wiadomość o wojnie na wschodnich granicach Niemiec. Pisał, że niemiecki wojownik Wichman dwa razy pokonał króla Mieszka, który rządził słowiańskim ludem. To pierwsza wzmianka o władcy Polan w źródłach pisanych. Widukind nazywa go Misaca. Od tej chwili historia Polski przestaje być legendą."
    draft: true
    chunks:
      - pl: "W 963 roku saski mnich Widukind zapisał w swojej kronice wiadomość o wojnie na wschodnich granicach Niemiec."
        ru: "В 963 году саксонский монах Видукинд записал в своей хронике известие о войне на восточных границах Германии."
        note: "w 963 roku — w dziewięćset sześćdziesiątym trzecim roku; saski — саксонский"
      - pl: " Pisał, że niemiecki wojownik Wichman dwa razy pokonał króla Mieszka, który rządził słowiańskim ludem."
        ru: "Он писал, что немецкий воин Вихман дважды разбил короля Мешко, который правил славянским народом."
        note: "pokonać — победить, разбить"
      - pl: " To pierwsza wzmianka o władcy Polan w źródłach pisanych."
        ru: "Это первое упоминание о правителе полян в письменных источниках."
        note: "wzmianka — упоминание"
      - pl: " Widukind nazywa go Misaca."
        ru: "Видукинд называет его Misaca."
      - pl: " Od tej chwili historia Polski przestaje być legendą."
        ru: "С этого момента история Польши перестаёт быть легендой."
        note: "przestawać — переставать"
    words: { "mnich": mnich, "zapisał": zapisac, "wschodnich": wschodni, "niemiecki": niemiecki, "wojownik": wojownik, "rządził": rzadzic, "ludem": lud, "władcy": wladca, "przestaje": przestawac, "legendą": legenda }
  - clean: "Nie wiemy, kiedy Mieszko się urodził ani kiedy objął władzę. Gall Anonim opowiada, że przez pierwsze siedem lat życia był niewidomy. Na uczcie z okazji jego postrzyżyn ojciec dowiedział się, że chłopiec nagle przejrzał. Gall widział w tym znak: tak jak Mieszko odzyskał wzrok, tak cała Polska miała wkrótce przejrzeć, czyli poznać prawdziwego Boga. Historycy traktują tę opowieść jako symbol, a nie jako fakt."
    draft: true
    chunks:
      - pl: "Nie wiemy, kiedy Mieszko się urodził ani kiedy objął władzę."
        ru: "Мы не знаем, когда Мешко родился и когда пришёл к власти."
        note: "objąć władzę — прийти к власти"
      - pl: " Gall Anonim opowiada, że przez pierwsze siedem lat życia był niewidomy."
        ru: "Галл Аноним рассказывает, что первые семь лет жизни он был слепым."
        note: "niewidomy — слепой, незрячий"
      - pl: " Na uczcie z okazji jego postrzyżyn ojciec dowiedział się, że chłopiec nagle przejrzał."
        ru: "На пиру по случаю его постригов отец узнал, что мальчик вдруг прозрел."
        note: "przejrzeć — прозреть"
      - pl: " Gall widział w tym znak: tak jak Mieszko odzyskał wzrok, tak cała Polska miała wkrótce przejrzeć, czyli poznać prawdziwego Boga."
        ru: "Галл видел в этом знак: как Мешко обрёл зрение, так и вся Польша вскоре должна была прозреть, то есть познать истинного Бога."
        note: "odzyskać — вернуть, обрести вновь; wzrok — зрение"
      - pl: " Historycy traktują tę opowieść jako symbol, a nie jako fakt."
        ru: "Историки считают этот рассказ символом, а не фактом."
        note: "traktować jako — рассматривать как"
    words: { "objął": objac, "przejrzał": przejrzec, "wzrok": wzrok, "przejrzeć": przejrzec, "opowieść": opowiesc, "symbol": symbol }
  - clean: "Mieszko odziedziczył po przodkach silne państwo. Jego centrum leżało w Wielkopolsce, a najważniejszymi grodami były Gniezno, Poznań, Giecz i Ostrów Lednicki. Grody te łączyły drogi i rzeki, a w każdym z nich stała załoga wojska. Ludność płaciła daniny w zbożu, miodzie, skórach i bydle, a także pracowała przy budowie grodów i mostów. Dzięki temu książę mógł utrzymywać liczną drużynę."
    draft: true
    chunks:
      - pl: "Mieszko odziedziczył po przodkach silne państwo."
        ru: "Мешко унаследовал от предков сильное государство."
        note: "odziedziczyć — унаследовать"
      - pl: " Jego centrum leżało w Wielkopolsce, a najważniejszymi grodami były Gniezno, Poznań, Giecz i Ostrów Lednicki."
        ru: "Его центр лежал в Великой Польше, а главными градами были Гнезно, Познань, Гече и Остров-Ледницкий."
      - pl: " Grody te łączyły drogi i rzeki, a w każdym z nich stała załoga wojska."
        ru: "Эти грады соединялись дорогами и реками, и в каждом стоял гарнизон."
        note: "załoga — гарнизон, экипаж"
      - pl: " Ludność płaciła daniny w zbożu, miodzie, skórach i bydle, a także pracowała przy budowie grodów i mostów."
        ru: "Население платило дань зерном, мёдом, шкурами и скотом, а также работало на постройке градов и мостов."
        note: "danina — дань, подать; ludność — население"
      - pl: " Dzięki temu książę mógł utrzymywać liczną drużynę."
        ru: "Благодаря этому князь мог содержать многочисленную дружину."
        note: "utrzymywać — содержать"
    words: { "przodkach": przodek, "załoga": zaloga, "wojska": wojsko, "zbożu": zboze, "miodzie": miod, "bydle": bydlo, "budowie": budowa, "mostów": most, "utrzymywać": utrzymywac }
  - clean: "Najciekawszy opis tego państwa zostawił nam podróżnik Ibrahim ibn Jakub. Był to żydowski kupiec albo dyplomata z Hiszpanii, który około 965 roku podróżował po Europie Środkowej. Pisał po arabsku i nazywał Mieszka „królem północy”. Według Ibrahima kraj Mieszka był największy ze słowiańskich krajów i obfitował w żywność, mięso, miód i ryby."
    draft: true
    chunks:
      - pl: "Najciekawszy opis tego państwa zostawił nam podróżnik Ibrahim ibn Jakub."
        ru: "Самое интересное описание этого государства оставил нам путешественник Ибрагим ибн Якуб."
        note: "podróżnik — путешественник"
      - pl: " Był to żydowski kupiec albo dyplomata z Hiszpanii, który około 965 roku podróżował po Europie Środkowej."
        ru: "Это был еврейский купец или дипломат из Испании, который около 965 года путешествовал по Центральной Европе."
      - pl: " Pisał po arabsku i nazywał Mieszka „królem północy”."
        ru: "Он писал по-арабски и называл Мешко «королём севера»."
      - pl: " Według Ibrahima kraj Mieszka był największy ze słowiańskich krajów i obfitował w żywność, mięso, miód i ryby."
        ru: "По словам Ибрагима, страна Мешко была самой большой из славянских стран и изобиловала едой, мясом, мёдом и рыбой."
        note: "obfitować w coś — изобиловать чем-л."
    words: { "opis": opis, "żydowski": zydowski, "kupiec": kupiec, "podróżował": podrozowac, "żywność": zywnosc, "mięso": mieso, "miód": miod }
  - clean: "Najbardziej zdumiała go drużyna księcia. Mieszko miał trzy tysiące wojowników w pancerzach, a, jak pisał Ibrahim, setka z nich była warta tyle, co dziesięć setek innych. Książę dawał im ubrania, konie, broń i wszystko, czego potrzebowali. Kiedy któremuś z nich urodziło się dziecko, książę od razu zaczynał płacić na jego utrzymanie. Ibrahim zauważył też, że w kraju Mieszka za żonę trzeba było zapłacić, i to dużo. Ojciec, który miał kilka córek, był więc bogaczem."
    draft: true
    chunks:
      - pl: "Najbardziej zdumiała go drużyna księcia."
        ru: "Больше всего его поразила дружина князя."
        note: "zdumieć — изумить, поразить"
      - pl: " Mieszko miał trzy tysiące wojowników w pancerzach, a, jak pisał Ibrahim, setka z nich była warta tyle, co dziesięć setek innych."
        ru: "У Мешко было три тысячи воинов в доспехах, и, как писал Ибрагим, сотня из них стоила тысячи других."
        note: "pancerz — панцирь, доспех; być wartym — стоить"
      - pl: " Książę dawał im ubrania, konie, broń i wszystko, czego potrzebowali."
        ru: "Князь давал им одежду, коней, оружие и всё, в чём они нуждались."
        note: "potrzebować czegoś — нуждаться в чём-л.: родительный"
      - pl: " Kiedy któremuś z nich urodziło się dziecko, książę od razu zaczynał płacić na jego utrzymanie."
        ru: "Когда у кого-то из них рождался ребёнок, князь сразу начинал платить на его содержание."
        note: "utrzymanie — содержание"
      - pl: " Ibrahim zauważył też, że w kraju Mieszka za żonę trzeba było zapłacić, i to dużo."
        ru: "Ибрагим заметил также, что в стране Мешко за жену нужно было заплатить, и немало."
        note: "i to — причём"
      - pl: " Ojciec, który miał kilka córek, był więc bogaczem."
        ru: "Отец, у которого было несколько дочерей, был поэтому богачом."
        note: "bogacz — богач"
    words: { "wojowników": wojownik, "setka": setka }
  - clean: "Państwo Mieszka miało jednak groźnych sąsiadów. Na zachodzie leżało potężne Cesarstwo, którym rządził Otton I. Niemieccy margrabiowie podbijali kolejne plemiona Słowian połabskich, mieszkających między Łabą a Odrą. Na północy, przy ujściu Odry, leżał bogaty Wolin, który nie chciał słuchać Mieszka. Na południu rządzili czescy Przemyślidzi, do których należały wtedy Śląsk i Kraków."
    draft: true
    chunks:
      - pl: "Państwo Mieszka miało jednak groźnych sąsiadów."
        ru: "Однако у государства Мешко были грозные соседи."
        note: "groźny — грозный, опасный"
      - pl: " Na zachodzie leżało potężne Cesarstwo, którym rządził Otton I."
        ru: "На западе лежала могущественная империя, которой правил Оттон I."
        note: "Cesarstwo — здесь Священная Римская империя; rządzić czymś — править чем-л.: творительный"
      - pl: " Niemieccy margrabiowie podbijali kolejne plemiona Słowian połabskich, mieszkających między Łabą a Odrą."
        ru: "Немецкие маркграфы покоряли одно за другим племена полабских славян, живших между Эльбой и Одрой."
        note: "margrabia — маркграф; Łaba — Эльба; połabski — полабский, «по Лабе»"
      - pl: " Na północy, przy ujściu Odry, leżał bogaty Wolin, który nie chciał słuchać Mieszka."
        ru: "На севере, в устье Одры, лежал богатый Волин, который не желал подчиняться Мешко."
        note: "ujście — устье; słuchać — здесь «слушаться»"
      - pl: " Na południu rządzili czescy Przemyślidzi, do których należały wtedy Śląsk i Kraków."
        ru: "На юге правили чешские Пржемысловичи, которым тогда принадлежали Силезия и Краков."
        note: "należeć do kogoś — принадлежать кому-л."
    words: { "rządził": rzadzic, "groźnych": grozny, "zachodzie": zachod, "potężne": potezny, "Niemieccy": niemiecki, "rządzili": rzadzic }
  - clean: "Pogańskie państwo było w tej sytuacji bardzo słabe. Niemcy mogli w każdej chwili zaatakować je pod hasłem nawracania pogan. Tak stało się z wieloma plemionami połabskimi, które straciły wolność, a później także język. Mieszko był na tyle mądry, że wyciągnął z tego wnioski. Postanowił przyjąć chrzest, ale nie od Niemców, tylko od Czechów."
    draft: true
    chunks:
      - pl: "Pogańskie państwo było w tej sytuacji bardzo słabe."
        ru: "В этой ситуации языческое государство было очень уязвимо."
      - pl: " Niemcy mogli w każdej chwili zaatakować je pod hasłem nawracania pogan."
        ru: "Немцы в любой момент могли напасть на него под лозунгом обращения язычников."
        note: "pod hasłem — под лозунгом; nawracać — обращать (в веру)"
      - pl: " Tak stało się z wieloma plemionami połabskimi, które straciły wolność, a później także język."
        ru: "Так случилось со многими полабскими племенами, которые потеряли свободу, а позже и язык."
      - pl: " Mieszko był na tyle mądry, że wyciągnął z tego wnioski."
        ru: "Мешко был достаточно умён, чтобы сделать из этого выводы."
        note: "wyciągnąć wnioski — сделать выводы"
      - pl: " Postanowił przyjąć chrzest, ale nie od Niemców, tylko od Czechów."
        ru: "Он решил принять крещение, но не от немцев, а от чехов."
        note: "chrzest — крещение"
    words: { "hasłem": haslo, "wnioski": wniosek }
  - clean: "W 965 roku ożenił się z Dobrawą, córką czeskiego księcia Bolesława I. Gall Anonim pisze, że wcześniej Mieszko miał według pogańskiego zwyczaju siedem żon. Dobrawa zgodziła się wyjść za niego tylko pod warunkiem, że porzuci on pogaństwo. Niemiecki biskup Thietmar opowiada o niej ciekawą historię. W czasie pierwszego postu po ślubie Dobrawa jadła mięso, żeby mąż widział, że nowa wiara nie jest dla niego zbyt surowa. Thietmar, który był bardzo pobożny, nie pochwalał tego, ale przyznawał, że cel był dobry."
