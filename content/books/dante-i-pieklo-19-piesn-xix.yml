# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 19
chapterTitle: "Pieśń XIX"
chapterTitleRu: "Песнь XIX. Папы-симонисты"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok III. Symoniacy. Mikołaj III i inni papieże)."
    chunks:
      - pl: "(Krąg VIII. Tłumok III. Symoniacy. Mikołaj III i inni papieże)."
        ru: "(Круг VIII. Ров III. Симонисты. Николай III и другие папы.)"
        note: "symoniak — симонист"
    words: { "Krąg": krag, "Mikołaj": mikolaj, "inni": inny, "papieże": papiez }
  - clean: "Mistrzu Symonie! Wy, jego sektarze,\nCo rzeczy boże, o łakome dusze,\nJako goniący za zyskiem kramarze,\nCudzołożycie za srebro i złoto,\nGdy być powinno żenione z szczodrotą:\nTeraz ja dla was zadąć w trąbę muszę,\nBoście trzeciego tłumoka mieszkańce."
    verse: true
    chunks:
      - pl: "Mistrzu Symonie! Wy, jego sektarze,"
        ru: "Учитель Симон! Вы, его сектанты,"
        note: "Симон Волхв; sektarz — сектант"
      - pl: "\nCo rzeczy boże, o łakome dusze,"
        ru: "что вещи Божьи, о жадные души,"
      - pl: "\nJako goniący za zyskiem kramarze,"
        ru: "как гоняющиеся за наживой торгаши,"
        note: "kramarz — лавочник, торгаш"
      - pl: "\nCudzołożycie za srebro i złoto,"
        ru: "блудно продаёте за серебро и золото,"
        note: "cudzołożyć — прелюбодействовать"
      - pl: "\nGdy być powinno żenione z szczodrotą:"
        ru: "тогда как им должно быть обвенчанными с щедростью:"
        note: "żeniony — обвенчанный; szczodrota — щедрость"
      - pl: "\nTeraz ja dla was zadąć w trąbę muszę,"
        ru: "теперь я должен для вас затрубить в трубу,"
        note: "zadąć — затрубить"
      - pl: "\nBoście trzeciego tłumoka mieszkańce."
        ru: "ибо вы жители третьего рва."
        note: "boście = bo + -ście"
    words: { "Mistrzu": mistrz, "rzeczy": rzecz, "goniący": gonic, "zyskiem": zysk, "srebro": srebro, "muszę": musiec }
  - clean: "Już wstąpiliśmy na same skał krańce,\nSkąd wzrok, jak stromą opoką kaskada,\nNa dno otchłani prostopadle spada.\nO jakże wielki twojej kunszt, o Panie,\nArcymądrości, którą Tyś przyodział\nStosownie niebo, ziemię i otchłanie!"
    verse: true
    chunks:
      - pl: "Już wstąpiliśmy na same skał krańce,"
        ru: "Мы уже взошли на самый край скал,"
        note: "kraniec — край"
      - pl: "\nSkąd wzrok, jak stromą opoką kaskada,"
        ru: "откуда взгляд, как каскад по крутой скале,"
      - pl: "\nNa dno otchłani prostopadle spada."
        ru: "отвесно падает на дно бездны."
        note: "prostopadle — отвесно"
      - pl: "\nO jakże wielki twojej kunszt, o Panie,"
        ru: "О, как велико твоё искусство, Господи,"
        note: "kunszt — искусство, мастерство"
      - pl: "\nArcymądrości, którą Tyś przyodział"
        ru: "высшая мудрость, в которую Ты облёк"
        note: "arcymądrość — высшая мудрость"
      - pl: "\nStosownie niebo, ziemię i otchłanie!"
        ru: "подобающим образом небо, землю и бездны!"
        note: "stosownie — подобающе"
    words: { "wstąpiliśmy": wstapic, "skał": skala, "wzrok": wzrok, "prostopadle": prostopadle, "jakże": jakze, "niebo": niebo }
  - clean: "Jak sprawiedliwy przez ciebie jej podział!\nWidziałem z brzegu i na dnie głaz szary,\nPełen dziur krągłych, wszystkie jednej miary:\nTakie są w moim pięknym Świętym Janie,\nGdzie kąpią dzieci przy chrzestnym obrzędzie;\nJedną z nich stłukłem niewiele lat temu,\nPodając pomoc dziecku tonącemu;\nA co przynajmniej niech dowodem będzie,\nAby człek każdy spostrzegał się w błędzie."
    verse: true
    chunks:
      - pl: "Jak sprawiedliwy przez ciebie jej podział!"
        ru: "Как справедливо через тебя её разделение!"
      - pl: "\nWidziałem z brzegu i na dnie głaz szary,"
        ru: "Я видел и по берегу, и на дне серый камень,"
      - pl: "\nPełen dziur krągłych, wszystkie jednej miary:"
        ru: "полный круглых дыр, все одной меры:"
        note: "krągły — круглый"
      - pl: "\nTakie są w moim pięknym Świętym Janie,"
        ru: "такие есть в моём прекрасном Сан-Джованни,"
        note: "Святой Иоанн — флорентийский баптистерий"
      - pl: "\nGdzie kąpią dzieci przy chrzestnym obrzędzie;"
        ru: "где купают детей при обряде крещения;"
        note: "chrzestny — крестильный; obrzęd — обряд"
      - pl: "\nJedną z nich stłukłem niewiele lat temu,"
        ru: "одну из них я разбил немного лет назад,"
        note: "stłuc — разбить"
      - pl: "\nPodając pomoc dziecku tonącemu;"
        ru: "подавая помощь тонущему ребёнку;"
      - pl: "\nA co przynajmniej niech dowodem będzie,"
        ru: "и это пусть по крайней мере будет доказательством,"
      - pl: "\nAby człek każdy spostrzegał się w błędzie."
        ru: "чтобы каждый человек увидел свою ошибку."
        note: "spostrzegać się — опомниться"
    words: { "sprawiedliwy": sprawiedliwy, "brzegu": brzeg, "szary": szary, "dziur": dziura, "miary": miara, "Podając": podawac }
  - clean: "Grzesznik wytykał z jamy każdej dziury\nNogi po uda, resztę jego ciała\nWięziła w środku swego lochu skała.\nDwie stopy płomień przypalał jaskrawy,\nBoleść tak silnie miotała nóg stawy,\nŻe mógłby zerwać i więzy, i sznury."
    verse: true
    chunks:
      - pl: "Grzesznik wytykał z jamy każdej dziury"
        ru: "Грешник выставлял из каждой дыры"
      - pl: "\nNogi po uda, resztę jego ciała"
        ru: "ноги до бёдер, остальное его тело"
        note: "udo — бедро"
      - pl: "\nWięziła w środku swego lochu skała."
        ru: "держала в заточении внутри своей темницы скала."
        note: "więzić — держать в заточении; loch — темница"
      - pl: "\nDwie stopy płomień przypalał jaskrawy,"
        ru: "Обе ступни жгло яркое пламя,"
      - pl: "\nBoleść tak silnie miotała nóg stawy,"
        ru: "боль так сильно трясла суставы ног,"
        note: "staw — сустав"
      - pl: "\nŻe mógłby zerwać i więzy, i sznury."
        ru: "что он мог бы порвать и путы, и верёвки."
        note: "więzy — путы"
    words: { "jamy": jama, "Nogi": noga, "Więziła": wiezic, "płomień": plomien, "stawy": staw, "zerwać": zerwac }
  - clean: "Jak napojone przedmioty oliwą\nPochwycą płomień w sam wierzch wyciągnięty,\nTak płomień sięgał ich palców od pięty.\n«Pojaśń mi mistrzu,» zagadłem go żywo,\n«Kto by w tej dziurze rzucał się jak wściekły,\nCzy mu tak ognie czerwone dopiekły?»"
    verse: true
    chunks:
      - pl: "Jak napojone przedmioty oliwą"
        ru: "Как пропитанные маслом предметы"
        note: "napojony — пропитанный; oliwa — масло"
      - pl: "\nPochwycą płomień w sam wierzch wyciągnięty,"
        ru: "хватают пламя, тянущееся к самой верхушке,"
      - pl: "\nTak płomień sięgał ich palców od pięty."
        ru: "так пламя доходило до их пальцев от пятки."
      - pl: "\n«Pojaśń mi mistrzu,» zagadłem go żywo,"
        ru: "«Объясни мне, учитель, — живо спросил я, —"
        note: "pojaśnić — устар. «объяснить»"
      - pl: "\n«Kto by w tej dziurze rzucał się jak wściekły,"
        ru: "кто это в той дыре бьётся, как бешеный,"
      - pl: "\nCzy mu tak ognie czerwone dopiekły?»"
        ru: "так ли ему досадили красные огни?»"
        note: "dopiec — допечь, досадить"
    words: { "przedmioty": przedmiot, "wyciągnięty": wyciagnac, "sięgał": siegac, "rzucał": rzucac, "ognie": ogien }
  - clean: "«Jeśli chcesz» mówił «zejść na dno tej jamy,\nDzieje ich zbrodni z ichże ust poznamy».\nA ja: «Ty pan mój, jam sługa twej woli,\nA sługa robi, co mu pan pozwoli».\nI wstąpiliśmy na łuk czwartej tamy,\nTuż ponad fosę pokłutą dziurami."
    verse: true
    chunks:
      - pl: "«Jeśli chcesz» mówił «zejść na dno tej jamy,"
        ru: "«Если хочешь, — сказал, — сойти на дно этой ямы,"
      - pl: "\nDzieje ich zbrodni z ichże ust poznamy»."
        ru: "историю их преступлений узнаем из их же уст»."
        note: "ichże — их же"
      - pl: "\nA ja: «Ty pan mój, jam sługa twej woli,"
        ru: "А я: «Ты мой господин, я слуга твоей воли,"
      - pl: "\nA sługa robi, co mu pan pozwoli»."
        ru: "а слуга делает, что господин ему позволит»."
      - pl: "\nI wstąpiliśmy na łuk czwartej tamy,"
        ru: "И мы взошли на дугу четвёртой плотины,"
      - pl: "\nTuż ponad fosę pokłutą dziurami."
        ru: "прямо над рвом, изрытым дырами."
        note: "pokłuty — исколотый"
    words: { "zejść": zejsc, "zbrodni": zbrodnia, "poznamy": poznac, "sługa": sluga, "pozwoli": pozwolic, "tamy": tama }
  - clean: "Mistrz na dno fosy sprowadzał mnie z góry\nI przyprowadził do otworu dziury,\nSkąd duch boleśnie skarżył się udami.\n«O kto bądź jesteś, jak pal w dziurę wbity,»\nPocząłem mówić, «duchu nieszczęśliwy,\nJeżeli możesz, miarkuj ból twój żywy»."
    verse: true
    chunks:
      - pl: "Mistrz na dno fosy sprowadzał mnie z góry"
        ru: "Учитель сводил меня сверху на дно рва"
      - pl: "\nI przyprowadził do otworu dziury,"
        ru: "и подвёл к отверстию дыры,"
      - pl: "\nSkąd duch boleśnie skarżył się udami."
        ru: "откуда дух мучительно жаловался бёдрами."
        note: "то есть дёргая ногами"
      - pl: "\n«O kto bądź jesteś, jak pal w dziurę wbity,»"
        ru: "«О кто бы ты ни был, вбитый в дыру, как кол,"
        note: "pal — кол"
      - pl: "\nPocząłem mówić, «duchu nieszczęśliwy,"
        ru: "— начал я говорить, — несчастный дух,"
      - pl: "\nJeżeli możesz, miarkuj ból twój żywy»."
        ru: "если можешь, умерь свою живую боль»."
        note: "miarkować — умерять"
    words: { "otworu": otwor, "udami": udo, "wbity": wbic, "Począłem": poczac, "nieszczęśliwy": nieszczesliwy, "miarkuj": miarkowac }
  - clean: "I stałem jak mnich kapturem zakryty,\nSpowiadający zbójcę w jego jamie,\nCo się ma nad nim za chwilę zawalić;\nGdy spowiedź chytry złoczyńca odkłada,\nTo woła mnicha, a ten go spowiada,\nChciałby na chwilę bliską śmierć oddalić."
    verse: true
    chunks:
      - pl: "I stałem jak mnich kapturem zakryty,"
        ru: "И я стоял, как монах, покрытый капюшоном,"
        note: "kaptur — капюшон"
      - pl: "\nSpowiadający zbójcę w jego jamie,"
        ru: "исповедующий разбойника в его яме,"
        note: "zbójca — разбойник; казнимых убийц закапывали вниз головой"
      - pl: "\nCo się ma nad nim za chwilę zawalić;"
        ru: "что должна над ним через миг обрушиться;"
        note: "zawalić się — обрушиться"
      - pl: "\nGdy spowiedź chytry złoczyńca odkłada,"
        ru: "когда хитрый злодей откладывает исповедь,"
        note: "złoczyńca — злодей"
      - pl: "\nTo woła mnicha, a ten go spowiada,"
        ru: "то зовёт монаха, а тот его исповедует,"
      - pl: "\nChciałby na chwilę bliską śmierć oddalić."
        ru: "хотел бы на миг отдалить близкую смерть."
    words: { "mnich": mnich, "zawalić": zawalic, "woła": wolac, "bliską": bliski, "śmierć": smierc, "oddalić": oddalic }
  - clean: "Duch krzyknął: «Ha, tu jesteś, Bonifacy?\nJuż mi od dawna przepowiednia kłamie:\nGdzie skarby twoje, owoce twej pracy?\nDla których zdradą, drogami krzywemi,\nŚmiałeś odważny zaślubić na ziemi\nPiękną niewiastę, dać ją na targ zysku,\nAbyś ją wzgardą zbrukał w twym uścisku»."
    verse: true
    chunks:
      - pl: "Duch krzyknął: «Ha, tu jesteś, Bonifacy?"
        ru: "Дух крикнул: «Ха, ты здесь, Бонифаций?"
        note: "Бонифаций VIII, тогда ещё живой"
      - pl: "\nJuż mi od dawna przepowiednia kłamie:"
        ru: "Давно уже лжёт мне пророчество:"
      - pl: "\nGdzie skarby twoje, owoce twej pracy?"
        ru: "где твои сокровища, плоды твоего труда?"
      - pl: "\nDla których zdradą, drogami krzywemi,"
        ru: "Ради которых коварством, кривыми путями"
      - pl: "\nŚmiałeś odważny zaślubić na ziemi"
        ru: "ты, смелый, посмел обвенчаться на земле"
        note: "zaślubić — взять в жёны"
      - pl: "\nPiękną niewiastę, dać ją na targ zysku,"
        ru: "с прекрасной женой, отдать её на торг наживы,"
        note: "Церковь"
      - pl: "\nAbyś ją wzgardą zbrukał w twym uścisku»."
        ru: "чтобы опозорить её презрением в своих объятиях»."
        note: "zbrukać — опозорить"
    words: { "owoce": owoc, "zdradą": zdrada, "odważny": odwazny, "niewiastę": niewiasta, "targ": targ, "uścisku": uscisk }
  - clean: "Jak ten, co słysząc niepojęte słowa,\nZe wstydu milczy, stałem jak niemowa.\n«Mów, odpowiadaj»: zawołał Wirgili,\n«Zupełnie inne, nie to noszę miano,\nJak się domyślasz». Nie zwlekając chwili\nOdpowiedziałem, tak jak mi kazano."
    verse: true
    chunks:
      - pl: "Jak ten, co słysząc niepojęte słowa,"
        ru: "Как тот, кто, слыша непонятные слова,"
        note: "niepojęty — непостижимый"
      - pl: "\nZe wstydu milczy, stałem jak niemowa."
        ru: "от стыда молчит, я стоял как немой."
        note: "niemowa — немой"
      - pl: "\n«Mów, odpowiadaj»: zawołał Wirgili,"
        ru: "«Говори, отвечай, — воскликнул Вергилий, —"
      - pl: "\n«Zupełnie inne, nie to noszę miano,"
        ru: "„Я ношу совсем иное, не это имя,"
      - pl: "\nJak się domyślasz». Nie zwlekając chwili"
        ru: "как ты предполагаешь“». Не медля ни минуты,"
        note: "zwlekać — медлить"
      - pl: "\nOdpowiedziałem, tak jak mi kazano."
        ru: "я ответил, как мне было велено."
    words: { "wstydu": wstyd, "milczy": milczec, "odpowiadaj": odpowiadac, "zawołał": zawolac, "Zupełnie": zupelnie, "domyślasz": domyslac }
  - clean: "Duch kręcąc stopy konwulsyjnym ruchem,\nMówił z westchnieniem głębokiem i głuchem:\n«O co mnie pytasz? Jeśliś wiedzieć chciwy,\nJaki w tej dziurze jest duch nieszczęśliwy,\nWiedz, że płaszcz wielki był moją odzieżą.\nJam syn, zaiste, niedźwiedzicy matki\nPragnąc wychować pokrewne niedźwiadki,\nAby na złotym wierzgały obroku,\nW mój wór złożyłem z całej ziemi złoto\nA w końcu siebie w tym ciasnym tłumoku."
    verse: true
    chunks:
      - pl: "Duch kręcąc stopy konwulsyjnym ruchem,"
        ru: "Дух, крутя ступнями судорожным движением,"
      - pl: "\nMówił z westchnieniem głębokiem i głuchem:"
        ru: "говорил с глубоким и глухим вздохом:"
      - pl: "\n«O co mnie pytasz? Jeśliś wiedzieć chciwy,"
        ru: "«О чём ты меня спрашиваешь? Если жаждешь знать,"
      - pl: "\nJaki w tej dziurze jest duch nieszczęśliwy,"
        ru: "какой несчастный дух в этой дыре,"
      - pl: "\nWiedz, że płaszcz wielki był moją odzieżą."
        ru: "знай, что великая мантия была моей одеждой."
        note: "odzież — одежда"
      - pl: "\nJam syn, zaiste, niedźwiedzicy matki"
        ru: "Я воистину сын медведицы-матери,"
        note: "Орсини (orso — медведь), Николай III"
      - pl: "\nPragnąc wychować pokrewne niedźwiadki,"
        ru: "желая вырастить родственных медвежат,"
        note: "niedźwiadek — медвежонок"
      - pl: "\nAby na złotym wierzgały obroku,"
        ru: "чтобы они брыкались на золотом корму,"
        note: "wierzgać — брыкаться; obrok — корм, овёс"
      - pl: "\nW mój wór złożyłem z całej ziemi złoto"
        ru: "в свой мешок я сложил золото со всей земли,"
      - pl: "\nA w końcu siebie w tym ciasnym tłumoku."
        ru: "а в конце концов — себя в этот тесный ров."
    words: { "kręcąc": krecic, "płaszcz": plaszcz, "Pragnąc": pragnac, "wychować": wychowac, "złożyłem": zlozyc, "ciasnym": ciasny }
  - clean: "Jeszcze tu drudzy pod mą głową leżą\nSymonijacy, co w tę jamę ciemną,\nMiędzy jej lochy zapadli przede mną.\nTam ja zapadnę, gdy tu, o sromoto!\nPrzyjdzie i w lochach tych skał się zagrzebie\nTen, za którego mylnie wziąłem ciebie."
    verse: true
    chunks:
      - pl: "Jeszcze tu drudzy pod mą głową leżą"
        ru: "Ещё здесь другие лежат под моей головой,"
      - pl: "\nSymonijacy, co w tę jamę ciemną,"
        ru: "симонисты, что в эту тёмную яму,"
      - pl: "\nMiędzy jej lochy zapadli przede mną."
        ru: "между её темниц провалились до меня."
      - pl: "\nTam ja zapadnę, gdy tu, o sromoto!"
        ru: "Туда и я провалюсь, когда сюда, о позор!"
        note: "sromota — позор"
      - pl: "\nPrzyjdzie i w lochach tych skał się zagrzebie"
        ru: "придёт и в темницах этих скал закопается"
        note: "zagrzebać się — закопаться"
      - pl: "\nTen, za którego mylnie wziąłem ciebie."
        ru: "тот, за кого я ошибочно принял тебя."
        note: "mylnie — ошибочно"
    words: { "głową": glowa, "ciemną": ciemny, "Przyjdzie": przyjsc, "wziąłem": wziac }
