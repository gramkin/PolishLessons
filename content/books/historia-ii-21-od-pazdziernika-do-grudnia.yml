  - clean: "Nadzieje Października szybko jednak osłabły. Gomułka okazał się przede wszystkim komunistą, który nie chciał prawdziwej demokracji. Zamykano niezależne czasopisma, a cenzura znów stała się surowa. Lata sześćdziesiąte nazwano czasem małej stabilizacji: życie było spokojniejsze niż za Stalina, ale szare i ubogie. Ludzie mieli pracę i mieszkania w nowych blokach, ale na samochód czy telewizor trzeba było długo oszczędzać."
    draft: true
    chunks:
