        ru: "Многие поляки искали правдивые сведения вне официальной прессы."
      - pl: " Wieczorami słuchano Radia Wolna Europa, którego polską sekcją kierował Jan Nowak-Jeziorański, dawny kurier Armii Krajowej."
        ru: "По вечерам слушали радио «Свободная Европа», польской секцией которого руководил Ян Новак-Езёраньский, бывший курьер Армии Крайовой."
      - pl: " Władze zagłuszały jego audycje, ale ludzie i tak ich słuchali, przyciskając ucho do odbiornika."
        ru: "Власти глушили его передачи, но люди всё равно их слушали, прижимая ухо к приёмнику."
      - pl: " W Paryżu Jerzy Giedroyc wydawał miesięcznik „Kultura”, który przemycano do kraju i czytano w tajemnicy."
        ru: "В Париже Ежи Гедройц издавал ежемесячник «Культура», который тайно ввозили в страну и читали украдкой."
        note: "miesięcznik — ежемесячник"
      - pl: " „Kultura” głosiła, że przyszła wolna Polska powinna uznać utratę Wilna i Lwowa i żyć w przyjaźni z niepodległą Litwą, Białorusią i Ukrainą."
        ru: "«Культура» провозглашала, что будущая свободная Польша должна признать потерю Вильно и Львова и жить в дружбе с независимыми Литвой, Белоруссией и Украиной."
