  - clean: "28 czerwca 1956 roku robotnicy zakładów Cegielskiego w Poznaniu wyszli na ulice. Protestowali przeciwko wysokim normom, niskim płacom i brakom w sklepach, a nieśli transparenty z hasłami „Chleba!” i „Chcemy wolności!”. Do robotników przyłączyły się dziesiątki tysięcy mieszkańców miasta. Demonstranci zdobyli więzienie i rozbroili strażników, a pod budynkiem bezpieki doszło do strzelaniny. Władze wysłały przeciwko nim wojsko i czołgi. Zginęło co najmniej pięćdziesiąt siedem osób, wśród nich trzynastoletni Romek Strzałkowski. Poznański Czerwiec był pierwszym wielkim buntem robotników przeciwko władzy, która nazywała się robotniczą."
    draft: true
    chunks:
      - pl: "28 czerwca 1956 roku robotnicy zakładów Cegielskiego w Poznaniu wyszli na ulice."
        ru: "28 июня 1956 года рабочие заводов Цегельского в Познани вышли на улицы."
      - pl: " Protestowali przeciwko wysokim normom, niskim płacom i brakom w sklepach, a nieśli transparenty z hasłami „Chleba!” i „Chcemy wolności!”."
        ru: "Они протестовали против высоких норм, низкой зарплаты и нехватки товаров в магазинах и несли транспаранты с лозунгами «Хлеба!» и «Хотим свободы!»."
        note: "transparent — транспарант"
      - pl: " Do robotników przyłączyły się dziesiątki tysięcy mieszkańców miasta."
        ru: "К рабочим присоединились десятки тысяч жителей города."
      - pl: " Demonstranci zdobyli więzienie i rozbroili strażników, a pod budynkiem bezpieki doszło do strzelaniny."
        ru: "Демонстранты захватили тюрьму и разоружили охранников, а у здания госбезопасности завязалась перестрелка."
      - pl: " Władze wysłały przeciwko nim wojsko i czołgi."
        ru: "Власти направили против них армию и танки."
      - pl: " Zginęło co najmniej pięćdziesiąt siedem osób, wśród nich trzynastoletni Romek Strzałkowski."
        ru: "Погибли по меньшей мере пятьдесят семь человек, среди них тринадцатилетний Ромек Стшалковский."
      - pl: " Poznański Czerwiec był pierwszym wielkim buntem robotników przeciwko władzy, która nazywała się robotniczą."
        ru: "Познанский июнь стал первым большим бунтом рабочих против власти, которая называла себя рабочей."
