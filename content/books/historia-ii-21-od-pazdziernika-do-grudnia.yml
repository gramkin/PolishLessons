  - clean: "Kościół pozostawał najważniejszą niezależną siłą w kraju. W 1965 roku polscy biskupi wysłali list do biskupów niemieckich, w którym napisali słynne słowa: „przebaczamy i prosimy o przebaczenie”. Władze komunistyczne zaatakowały ich, twierdząc, że biskupi nie mieli prawa przebaczać w imieniu narodu, który tak bardzo ucierpiał. Wielu zwykłych Polaków też nie rozumiało tego gestu, ale z czasem stał się on początkiem pojednania polsko-niemieckiego."
    draft: true
    chunks:
      - pl: "Kościół pozostawał najważniejszą niezależną siłą w kraju."
        ru: "Церковь оставалась главной независимой силой в стране."
