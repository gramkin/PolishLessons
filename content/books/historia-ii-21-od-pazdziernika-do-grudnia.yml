paragraphs:
  - clean: "W lutym 1956 roku przywódca radziecki Nikita Chruszczow wygłosił na zjeździe partii w Moskwie tajny referat, w którym potępił zbrodnie Stalina. Bierut, który był na zjeździe, zachorował i zmarł w Moskwie kilka tygodni później. Polscy komuniści rozpowszechnili tekst referatu tak szeroko, że wkrótce trafił on na Zachód, a jego treść znało pół kraju. Ludzie, którzy przez lata musieli wychwalać Stalina, dowiedzieli się z ust jego następcy, że był on zbrodniarzem."
    draft: true
    chunks:
      - pl: "W lutym 1956 roku przywódca radziecki Nikita Chruszczow wygłosił na zjeździe partii w Moskwie tajny referat, w którym potępił zbrodnie Stalina."
        ru: "В феврале 1956 года советский лидер Никита Хрущёв произнёс на съезде партии в Москве секретный доклад, в котором осудил преступления Сталина."
        note: "referat — доклад"
      - pl: " Bierut, który był na zjeździe, zachorował i zmarł w Moskwie kilka tygodni później."
        ru: "Берут, находившийся на съезде, заболел и умер в Москве несколько недель спустя."
      - pl: " Polscy komuniści rozpowszechnili tekst referatu tak szeroko, że wkrótce trafił on na Zachód, a jego treść znało pół kraju."
        ru: "Польские коммунисты распространили текст доклада так широко, что вскоре он попал на Запад, а его содержание знала половина страны."
        note: "rozpowszechnić — распространить"
      - pl: " Ludzie, którzy przez lata musieli wychwalać Stalina, dowiedzieli się z ust jego następcy, że był on zbrodniarzem."
        ru: "Люди, которые годами должны были восхвалять Сталина, узнали из уст его преемника, что он был преступником."
