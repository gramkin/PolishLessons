  - clean: "Po Poznaniu władze zrozumiały, że muszą coś zmienić. Na zebraniach partyjnych, na uczelniach i w fabrykach ludzie otwarcie domagali się reform, a w prasie ukazywały się coraz śmielsze artykuły. Wielu Polaków widziało nadzieję we Władysławie Gomułce, którego uważano za ofiarę stalinizmu i patriotę. W październiku 1956 roku władze partii postanowiły przywrócić go na stanowisko pierwszego sekretarza."
    draft: true
    chunks:
      - pl: "Po Poznaniu władze zrozumiały, że muszą coś zmienić."
        ru: "После Познани власти поняли, что должны что-то изменить."
      - pl: " Na zebraniach partyjnych, na uczelniach i w fabrykach ludzie otwarcie domagali się reform, a w prasie ukazywały się coraz śmielsze artykuły."
        ru: "На партийных собраниях, в вузах и на фабриках люди открыто требовали реформ, а в прессе появлялись всё более смелые статьи."
      - pl: " Wielu Polaków widziało nadzieję we Władysławie Gomułce, którego uważano za ofiarę stalinizmu i patriotę."
        ru: "Многие поляки видели надежду во Владиславе Гомулке, которого считали жертвой сталинизма и патриотом."
      - pl: " W październiku 1956 roku władze partii postanowiły przywrócić go na stanowisko pierwszego sekretarza."
        ru: "В октябре 1956 года руководство партии решило вернуть его на пост первого секретаря."
