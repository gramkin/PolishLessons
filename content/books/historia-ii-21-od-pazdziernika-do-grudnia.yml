  - clean: "Moskwa była zaniepokojona. 19 października do Warszawy niespodziewanie przyleciał Chruszczow z innymi radzieckimi przywódcami, a w stronę stolicy ruszyły radzieckie dywizje stacjonujące w Polsce. Gomułka zapewnił go, że Polska pozostanie w sojuszu ze Związkiem Radzieckim i w Układzie Warszawskim, ale chce sama decydować o swoich sprawach wewnętrznych. Chruszczow ustąpił, a wojska radzieckie wróciły do koszar. 24 października na placu Defilad w Warszawie Gomułka przemawiał do kilkuset tysięcy ludzi, którzy przyjęli go entuzjastycznie. Obiecał demokratyzację, poszanowanie prawa i polską drogę do socjalizmu. Był to moment, w którym Gomułka cieszył się największym poparciem społeczeństwa w całej swojej karierze."
    draft: true
    chunks:
      - pl: "Moskwa była zaniepokojona."
        ru: "Москва была встревожена."
      - pl: " 19 października do Warszawy niespodziewanie przyleciał Chruszczow z innymi radzieckimi przywódcami, a w stronę stolicy ruszyły radzieckie dywizje stacjonujące w Polsce."
        ru: "19 октября в Варшаву неожиданно прилетел Хрущёв с другими советскими руководителями, а в сторону столицы двинулись советские дивизии, стоявшие в Польше."
      - pl: " Gomułka zapewnił go, że Polska pozostanie w sojuszu ze Związkiem Radzieckim i w Układzie Warszawskim, ale chce sama decydować o swoich sprawach wewnętrznych."
        ru: "Гомулка заверил его, что Польша останется в союзе с Советским Союзом и в Варшавском договоре, но хочет сама решать свои внутренние дела."
      - pl: " Chruszczow ustąpił, a wojska radzieckie wróciły do koszar."
        ru: "Хрущёв уступил, и советские войска вернулись в казармы."
        note: "koszary — казармы"
      - pl: " 24 października na placu Defilad w Warszawie Gomułka przemawiał do kilkuset tysięcy ludzi, którzy przyjęli go entuzjastycznie."
        ru: "24 октября на площади Дефилад в Варшаве Гомулка выступил перед несколькими сотнями тысяч людей, которые встретили его восторженно."
      - pl: " Obiecał demokratyzację, poszanowanie prawa i polską drogę do socjalizmu."
        ru: "Он обещал демократизацию, соблюдение законов и польский путь к социализму."
      - pl: " Był to moment, w którym Gomułka cieszył się największym poparciem społeczeństwa w całej swojej karierze."
        ru: "Это был момент, когда Гомулка пользовался самой большой поддержкой общества за всю свою карьеру."
    words: { "zaniepokojona": zaniepokoic, "października": pazdziernik, "przyleciał": przyleciec, "przywódcami": przywodca, "stolicy": stolica, "zapewnił": zapewnic, "sojuszu": sojusz, "decydować": decydowac, "wewnętrznych": wewnetrzny, "wojska": wojsko, "placu": plac, "przemawiał": przemawiac, "polską": polski, "społeczeństwa": spoleczenstwo }
  - clean: "Październik 1956 roku przyniósł wiele zmian. Marszałek Rokossowski i radzieccy oficerowie wyjechali z Polski. Prymas Wyszyński wrócił do Warszawy, a religię przywrócono w szkołach. Rozwiązano większość spółdzielni produkcyjnych na wsi i chłopi znów mogli gospodarować na własnej ziemi. Polska stała się jedynym krajem bloku radzieckiego, w którym większość ziemi należała do prywatnych rolników."
