  - clean: "Z łagrów wróciły tysiące Polaków, a cenzura na pewien czas złagodniała. W tym samym czasie w Budapeszcie wybuchło powstanie przeciwko komunistom, które wojska radzieckie krwawo stłumiły. Polacy masowo oddawali krew dla rannych Węgrów i wysyłali im lekarstwa i żywność. Przyjaźń polsko-węgierska, opisywana przysłowiem „Polak, Węgier dwa bratanki”, okazała się wtedy czymś więcej niż słowami. Los Węgier pokazał jednak Polakom, gdzie leżą granice swobody, na którą pozwala Moskwa."
    draft: true
    chunks:
      - pl: "Z łagrów wróciły tysiące Polaków, a cenzura na pewien czas złagodniała."
        ru: "Из лагерей вернулись тысячи поляков, а цензура на время смягчилась."
        note: "złagodnieć — смягчиться"
      - pl: " W tym samym czasie w Budapeszcie wybuchło powstanie przeciwko komunistom, które wojska radzieckie krwawo stłumiły."
        ru: "В то же время в Будапеште вспыхнуло восстание против коммунистов, которое советские войска кроваво подавили."
        note: "stłumić — подавить"
      - pl: " Polacy masowo oddawali krew dla rannych Węgrów i wysyłali im lekarstwa i żywność."
        ru: "Поляки массово сдавали кровь для раненых венгров и отправляли им лекарства и продовольствие."
      - pl: " Przyjaźń polsko-węgierska, opisywana przysłowiem „Polak, Węgier dwa bratanki”, okazała się wtedy czymś więcej niż słowami."
        ru: "Польско-венгерская дружба, описываемая пословицей «Поляк и венгр — два брата», оказалась тогда чем-то большим, чем слова."
        note: "bratanek — здесь: брат, побратим"
      - pl: " Los Węgier pokazał jednak Polakom, gdzie leżą granice swobody, na którą pozwala Moskwa."
        ru: "Однако судьба Венгрии показала полякам, где проходят границы свободы, которую позволяет Москва."
