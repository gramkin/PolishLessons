        ru: "Гомулка оказался прежде всего коммунистом, который не хотел настоящей демократии."
      - pl: " Zamykano niezależne czasopisma, a cenzura znów stała się surowa."
        ru: "Закрывали независимые журналы, а цензура снова стала строгой."
      - pl: " Lata sześćdziesiąte nazwano czasem małej stabilizacji: życie było spokojniejsze niż za Stalina, ale szare i ubogie."
        ru: "Шестидесятые годы назвали временем «малой стабилизации»: жизнь была спокойнее, чем при Сталине, но серой и бедной."
      - pl: " Ludzie mieli pracę i mieszkania w nowych blokach, ale na samochód czy telewizor trzeba było długo oszczędzać."
        ru: "У людей были работа и квартиры в новых панельных домах, но на машину или телевизор приходилось долго копить."
        note: "blok — многоквартирный (панельный) дом"
    words: { "demokracji": demokracja, "Zamykano": zamykac, "niezależne": niezalezny, "surowa": surowy, "spokojniejsze": spokojny, "szare": szary, "ubogie": ubogi, "blokach": blok, "telewizor": telewizor, "oszczędzać": oszczedzac }
  - clean: "Wiele Polaków szukało prawdziwych informacji poza oficjalną prasą. Wieczorami słuchano Radia Wolna Europa, którego polską sekcją kierował Jan Nowak-Jeziorański, dawny kurier Armii Krajowej. Władze zagłuszały jego audycje, ale ludzie i tak ich słuchali, przyciskając ucho do odbiornika. W Paryżu Jerzy Giedroyc wydawał miesięcznik „Kultura”, który przemycano do kraju i czytano w tajemnicy. „Kultura” głosiła, że przyszła wolna Polska powinna uznać utratę Wilna i Lwowa i żyć w przyjaźni z niepodległą Litwą, Białorusią i Ukrainą. Idee te stały się później podstawą polityki wschodniej wolnej Polski."
    draft: true
