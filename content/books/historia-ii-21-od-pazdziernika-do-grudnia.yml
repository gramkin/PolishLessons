        ru: "Примас Вышинский вернулся в Варшаву, а преподавание религии вернули в школы."
      - pl: " Rozwiązano większość spółdzielni produkcyjnych na wsi i chłopi znów mogli gospodarować na własnej ziemi."
        ru: "Распустили большинство производственных кооперативов в деревне, и крестьяне снова могли хозяйствовать на собственной земле."
      - pl: " Polska stała się jedynym krajem bloku radzieckiego, w którym większość ziemi należała do prywatnych rolników."
