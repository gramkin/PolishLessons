  - clean: "Gdy za Semelę gorączką obrazy\nJunona wrzała przeciw krwi tebańskiej,\nSpędzając na nich gniew po wiele razy,\nWidząc swą żonę Atamas szatański\nWchodzącą w progi z dwojgiem małych dzieci,\nKrzyknął jak wściekły: «Rozciągajmy sieci,\nLwica z lwiątkami w ich przeguby wleci»."
    verse: true
    chunks:
      - pl: "Gdy za Semelę gorączką obrazy"
        ru: "Когда из-за Семелы, в лихорадке обиды,"
      - pl: "\nJunona wrzała przeciw krwi tebańskiej,"
        ru: "Юнона кипела против фиванской крови,"
      - pl: "\nSpędzając na nich gniew po wiele razy,"
        ru: "не раз изливая на них гнев,"
        note: "spędzać gniew — изливать гнев"
      - pl: "\nWidząc swą żonę Atamas szatański"
        ru: "увидев свою жену, бесовский Атамант,"
        note: "Atamas — Атамант, обезумевший по воле Юноны"
      - pl: "\nWchodzącą w progi z dwojgiem małych dzieci,"
        ru: "входящую в порог с двумя малыми детьми,"
      - pl: "\nKrzyknął jak wściekły: «Rozciągajmy sieci,"
        ru: "крикнул, как бешеный: «Растянем сети,"
      - pl: "\nLwica z lwiątkami w ich przeguby wleci»."
        ru: "львица со львятами влетит в их петли»."
        note: "lwiątko — львёнок; przegub — здесь «петля»"
    words: { "gorączką": goraczka, "Spędzając": spedzac, "gniew": gniew, "Wchodzącą": wchodzic, "progi": prog, "sieci": siec }
  - clean: "I jedno dziecko, Learkiem nazwane,\nPorwał i cisnął o twardą skał ścianę,\nA matka, myśl tę snadź rozpacz natchnęła,\nZ drugim ciężarem swoim utonęła.\nKiedy Fortuna twarz swą odwróciła\nOd wielkich Trojan, tak że jednej chwili\nSpołem królestwo i króla stracili,\nHekuba smutna, niewolnica chora,\nPłacząc nad ciałem swego Polidora,\nJak pies szalona w swej boleści wyła,\nTak boleść wszystkie jej zmysły zmąciła!"
    verse: true
    chunks:
      - pl: "I jedno dziecko, Learkiem nazwane,"
        ru: "И одного ребёнка, по имени Леарх,"
      - pl: "\nPorwał i cisnął o twardą skał ścianę,"
        ru: "схватил и швырнул о твёрдую стену скал,"
      - pl: "\nA matka, myśl tę snadź rozpacz natchnęła,"
        ru: "а мать — эту мысль, видно, внушило отчаяние,"
        note: "natchnąć — внушить"
      - pl: "\nZ drugim ciężarem swoim utonęła."
        ru: "утонула со своей второй ношей."
      - pl: "\nKiedy Fortuna twarz swą odwróciła"
        ru: "Когда Фортуна отвернула своё лицо"
      - pl: "\nOd wielkich Trojan, tak że jednej chwili"
        ru: "от великих троянцев, так что в один миг"
      - pl: "\nSpołem królestwo i króla stracili,"
        ru: "они потеряли вместе и царство, и царя,"
      - pl: "\nHekuba smutna, niewolnica chora,"
        ru: "печальная Гекуба, больная невольница,"
      - pl: "\nPłacząc nad ciałem swego Polidora,"
        ru: "плача над телом своего Полидора,"
      - pl: "\nJak pies szalona w swej boleści wyła,"
        ru: "выла, обезумев, как собака, в своей скорби,"
      - pl: "\nTak boleść wszystkie jej zmysły zmąciła!"
        ru: "так боль помутила все её чувства!"
        note: "zmącić — помутить"
    words: { "skał": skala, "rozpacz": rozpacz, "ciężarem": ciezar, "utonęła": utonac, "Fortuna": fortuna, "zmysły": zmysl }
  - clean: "Jednak Tebanie i Trojanie wściekli,\nChoć tyle zwierząt i ludzi wysiekli,\nNie pastwili się z okrucieństwem takiem:\nDwa cienie nagie biegły jednym szlakiem,\nGryząc się w biegu, jak wieprz wszystkim w oczy\nRzuca się, gdy z swej zagrody wyskoczy."
    verse: true
    chunks:
      - pl: "Jednak Tebanie i Trojanie wściekli,"
        ru: "Однако бешеные фиванцы и троянцы,"
      - pl: "\nChoć tyle zwierząt i ludzi wysiekli,"
        ru: "хоть и порубили столько зверей и людей,"
        note: "wysiec — порубить"
      - pl: "\nNie pastwili się z okrucieństwem takiem:"
        ru: "не свирепствовали с такой жестокостью:"
        note: "pastwić się — свирепствовать"
      - pl: "\nDwa cienie nagie biegły jednym szlakiem,"
        ru: "две нагие тени бежали одним путём,"
      - pl: "\nGryząc się w biegu, jak wieprz wszystkim w oczy"
        ru: "кусая друг друга на бегу, как кабан на всех"
      - pl: "\nRzuca się, gdy z swej zagrody wyskoczy."
        ru: "бросается, когда выскочит из своего загона."
        note: "zagroda — загон"
    words: { "pastwili": pastwic, "nagie": nagi, "szlakiem": szlak, "biegu": bieg, "Rzuca": rzucac, "wyskoczy": wyskoczyc }
  - clean: "Jeden z nich, biegnąc, wpadł na Kapokiję,\nW kark jemu pięścią grzmotnął ponad uchem,\nZwalił, po ziemi ciągnął go za szyję,\nGracując drogę Kapokija brzuchem.\nA Griffolino, z przestrachu wielkiego\nDrżąc, mówił do mnie: «To duch Jana Skiki,\nTak wszystkich dręczy ten szaleniec dziki»."
    verse: true
    chunks:
      - pl: "Jeden z nich, biegnąc, wpadł na Kapokiję,"
        ru: "Один из них, бегом, налетел на Капоккьо,"
      - pl: "\nW kark jemu pięścią grzmotnął ponad uchem,"
        ru: "ударил его кулаком в загривок над ухом,"
        note: "kark — загривок; grzmotnąć — грохнуть"
      - pl: "\nZwalił, po ziemi ciągnął go za szyję,"
        ru: "повалил, потащил по земле за шею,"
        note: "zwalić — повалить"
      - pl: "\nGracując drogę Kapokija brzuchem."
        ru: "скребя дорогу брюхом Капоккьо."
        note: "gracować — скрести, рыхлить"
      - pl: "\nA Griffolino, z przestrachu wielkiego"
        ru: "А Гриффолино, дрожа от великого испуга,"
      - pl: "\nDrżąc, mówił do mnie: «To duch Jana Skiki,"
        ru: "сказал мне: «Это дух Джанни Скикки,"
      - pl: "\nTak wszystkich dręczy ten szaleniec dziki»."
        ru: "так всех мучит этот дикий безумец»."
        note: "szaleniec — безумец"
    words: { "kark": kark, "pięścią": piesc, "ciągnął": ciagnac, "szyję": szyja, "brzuchem": brzuch, "szaleniec": szaleniec }
  - clean: "— «Jeśli ten drugi duch cię nie uszczyknie\nZębem lub szponą,» wołałem do niego,\n«Powiedz mi wprzódy, kto on jest, nim zniknie».\nA on: «To Myrry starożytnej dusza,\nKtóra do ojca czuła upał żywy,\nPrzeciwko prawu miłości uczciwej;\nPragnąc grzech ukryć w kryjomym niewstydzie,\nOjca pod cudzą postacią spokusza,\nPodobnie jak duch, który oto idzie!"
    verse: true
    chunks:
      - pl: "— «Jeśli ten drugi duch cię nie uszczyknie"
        ru: "— «Если тот второй дух тебя не ущипнёт"
      - pl: "\nZębem lub szponą,» wołałem do niego,"
        ru: "зубом или когтем, — воскликнул я ему, —"
      - pl: "\n«Powiedz mi wprzódy, kto on jest, nim zniknie»."
        ru: "скажи мне сперва, кто он, пока не исчез»."
      - pl: "\nA on: «To Myrry starożytnej dusza,"
        ru: "А он: «Это душа древней Мирры,"
      - pl: "\nKtóra do ojca czuła upał żywy,"
        ru: "что к отцу пылала живым жаром,"
      - pl: "\nPrzeciwko prawu miłości uczciwej;"
        ru: "против закона честной любви;"
      - pl: "\nPragnąc grzech ukryć w kryjomym niewstydzie,"
        ru: "желая скрыть грех в тайном бесстыдстве,"
        note: "niewstyd — бесстыдство"
      - pl: "\nOjca pod cudzą postacią spokusza,"
        ru: "она под чужим обличьем соблазняет отца,"
        note: "spokuszać — соблазнять"
      - pl: "\nPodobnie jak duch, który oto idzie!"
        ru: "как и дух, что вот идёт!"
    words: { "wołałem": wolac, "wprzódy": wprzody, "starożytnej": starozytny, "uczciwej": uczciwy, "cudzą": cudzy, "Podobnie": podobnie }
  - clean: "Znęcony zyskiem końskich stad królowy,\nWybieg zaiste cudacki i nowy,\nZamiast Donata w łóżko się położył,\nSkłamał testament i znów z grobu ożył».\nGdy znikli z oczu mych ci dwaj okrutni,\nWnet odwróciłem ciekawe spojrzenie,\nPatrzeć na inne tam leżące cienie."
    verse: true
    chunks:
      - pl: "Znęcony zyskiem końskich stad królowy,"
        ru: "Прельщённый наживой — царицей конских табунов,"
        note: "кобылой Буозо Донати"
      - pl: "\nWybieg zaiste cudacki i nowy,"
        ru: "уловка поистине диковинная и новая,"
      - pl: "\nZamiast Donata w łóżko się położył,"
        ru: "он вместо Донати лёг в постель,"
      - pl: "\nSkłamał testament i znów z grobu ożył»."
        ru: "составил ложное завещание и снова ожил из гроба»."
        note: "skłamać testament — подделать завещание"
      - pl: "\nGdy znikli z oczu mych ci dwaj okrutni,"
        ru: "Когда эти двое жестоких исчезли из моих глаз,"
      - pl: "\nWnet odwróciłem ciekawe spojrzenie,"
        ru: "я тотчас отвёл любопытный взор,"
      - pl: "\nPatrzeć na inne tam leżące cienie."
        ru: "чтобы смотреть на других теней, лежавших там."
    words: { "zyskiem": zysk, "stad": stado, "Skłamał": sklamac, "testament": testament, "grobu": grob, "okrutni": okrutny }
  - clean: "Jeden cień byłby podobny do lutni,\nGdyby miał otwór jego brzuch obrzydły,\nW miejscu, skąd ciało rozdziela się w widły:\nPuchlina wodna w jego ciele całem\nZmieniając kształty przez wilgoci chore,\nRozwarte usta zwiesiła do brody,\nJako suchotnik, gdy pragnieniem gore."
    verse: true
    chunks:
      - pl: "Jeden cień byłby podobny do lutni,"
        ru: "Одна тень была бы похожа на лютню,"
        note: "lutnia — лютня"
      - pl: "\nGdyby miał otwór jego brzuch obrzydły,"
        ru: "если бы её мерзкий живот имел отверстие"
      - pl: "\nW miejscu, skąd ciało rozdziela się w widły:"
        ru: "в том месте, где тело раздваивается вилами:"
      - pl: "\nPuchlina wodna w jego ciele całem"
        ru: "водянка во всём его теле,"
        note: "puchlina wodna — водянка"
      - pl: "\nZmieniając kształty przez wilgoci chore,"
        ru: "меняя облик через больные влаги,"
        note: "wilgoci — влаги"
      - pl: "\nRozwarte usta zwiesiła do brody,"
        ru: "раскрытые губы свесила к подбородку,"
      - pl: "\nJako suchotnik, gdy pragnieniem gore."
        ru: "как у чахоточного, когда он горит жаждой."
        note: "suchotnik — чахоточный"
    words: { "cień": cien, "otwór": otwor, "wodna": wodny, "kształty": ksztalt, "usta": usta, "pragnieniem": pragnienie }
  - clean: "«Wy, których wita z podziwem ta jama,»\nCień mówił, «patrzcie na mistrza Adama!\nCzegom zapragnął, żyjąc wszystko miałem,\nTeraz, niestety, pragnę kropli wody.\nMałe strumyki, co żywią nurt Arny,\nPłynąc z pagórków zielonych Kasenty,\nZ rzeźwiącą treścią, przejrzyste aż do dna,\nCiągną tam oczy tu z wieczności czarnej;\nBo ich obrazu marzone ponęty\nWięcej mnie trawią jak puchlina wodna."
    verse: true
    chunks:
      - pl: "«Wy, których wita z podziwem ta jama,»"
        ru: "«Вы, кого с изумлением приветствует эта яма, —"
      - pl: "\nCień mówił, «patrzcie na mistrza Adama!"
        ru: "сказала тень, — смотрите на мастера Адамо!"
      - pl: "\nCzegom zapragnął, żyjąc wszystko miałem,"
        ru: "Чего я ни желал, живя, всё имел,"
      - pl: "\nTeraz, niestety, pragnę kropli wody."
        ru: "теперь, увы, жажду капли воды."
      - pl: "\nMałe strumyki, co żywią nurt Arny,"
        ru: "Малые ручьи, что питают течение Арно,"
        note: "nurt — течение"
      - pl: "\nPłynąc z pagórków zielonych Kasenty,"
        ru: "текущие с зелёных холмов Казентино,"
      - pl: "\nZ rzeźwiącą treścią, przejrzyste aż do dna,"
        ru: "с освежающим вкусом, прозрачные до самого дна,"
      - pl: "\nCiągną tam oczy tu z wieczności czarnej;"
        ru: "манят туда глаза отсюда, из чёрной вечности;"
      - pl: "\nBo ich obrazu marzone ponęty"
        ru: "ибо грёзами вызванные прелести их образа"
        note: "ponęty — прелести, соблазны"
      - pl: "\nWięcej mnie trawią jak puchlina wodna."
        ru: "сильнее меня иссушают, чем водянка."
    words: { "jama": jama, "pragnę": pragnac, "żywią": zywic, "Płynąc": plynac, "wieczności": wiecznosc, "obrazu": obraz }
  - clean: "Tu Sprawiedliwość z swoim sądem w zgodzie,\nTym samym miejscem, gdziem grzeszył, mnie bodzie,\nBy więcej westchnień wydostać z grzesznika.\nTam jest Romena, gdziem oprócz psot wiela\nFałszował pieniądz z popiersiem Chrzciciela,\nZa co spalono żywcem fałszownika."
    verse: true
    chunks:
      - pl: "Tu Sprawiedliwość z swoim sądem w zgodzie,"
        ru: "Здесь Правосудие в согласии со своим судом"
      - pl: "\nTym samym miejscem, gdziem grzeszył, mnie bodzie,"
        ru: "тем самым местом, где я грешил, меня колет,"
      - pl: "\nBy więcej westchnień wydostać z grzesznika."
        ru: "чтобы выжать из грешника больше вздохов."
      - pl: "\nTam jest Romena, gdziem oprócz psot wiela"
        ru: "Там Ромена, где я, кроме многих проделок,"
        note: "psota — проделка; wiela — устар. «много»"
      - pl: "\nFałszował pieniądz z popiersiem Chrzciciela,"
        ru: "подделывал монету с изображением Крестителя,"
        note: "флорин с Иоанном Крестителем"
      - pl: "\nZa co spalono żywcem fałszownika."
        ru: "за что сожгли заживо фальшивомонетчика."
        note: "żywcem — заживо; fałszownik — фальсификатор"
    words: { "Sprawiedliwość": sprawiedliwosc, "sądem": sad, "zgodzie": zgoda, "miejscem": miejsce, "wydostać": wydostac, "pieniądz": pieniadz }
  - clean: "Lecz gdybym spotkał tu duchy Gwidona\nI Aleksandra, i obu ich brata,\nJeszcze bym tego nie mieniał widoku\nNa Fontebrandę, co stoi w mym oku.\nJuż jeden pono tu zstąpił ze świata,\nJeśli wieść do mnie doszła nieskażona\nZ ust innych cieniów; ale co mi po tem,\nGdy ja tu leżę jak przybity młotem!"
    verse: true
    chunks:
      - pl: "Lecz gdybym spotkał tu duchy Gwidona"
        ru: "Но если бы я встретил здесь духов Гвидо"
      - pl: "\nI Aleksandra, i obu ich brata,"
        ru: "и Александра, и их обоих брата,"
        note: "графы Гвиди"
      - pl: "\nJeszcze bym tego nie mieniał widoku"
        ru: "я и тогда не променял бы этого зрелища"
        note: "mieniać — менять"
      - pl: "\nNa Fontebrandę, co stoi w mym oku."
        ru: "на Фонтебранду, что стоит у меня в глазах."
        note: "источник"
      - pl: "\nJuż jeden pono tu zstąpił ze świata,"
        ru: "Один, говорят, уже сошёл сюда с земли,"
        note: "pono — говорят, будто"
      - pl: "\nJeśli wieść do mnie doszła nieskażona"
        ru: "если весть дошла до меня неискажённой"
        note: "nieskażony — неискажённый"
      - pl: "\nZ ust innych cieniów; ale co mi po tem,"
        ru: "из уст других теней; но что мне с того,"
      - pl: "\nGdy ja tu leżę jak przybity młotem!"
        ru: "когда я лежу здесь, как прибитый молотом!"
    words: { "duchy": duch, "brata": brat, "widoku": widok, "wieść": wiesc, "doszła": dojsc, "leżę": lezec }
  - clean: "Gdybym tak lekki był, że zrobić mogę\nW sto lat krok jeden, już poszedłbym w drogę,\nSzukając jego w tej wielkiej przepaści.\nKtóra w obwodzie ma mil jedenaście\nA wszerz pół mili. Zły duch, co w nich siedzi.\nSkusił mnie radą tych hrabiów Romeny,\nAbym w mennicy bił takie floreny,\nW których jest najmniej trzy karaty miedzi»."
    verse: true
    chunks:
      - pl: "Gdybym tak lekki był, że zrobić mogę"
        ru: "Будь я так лёгок, чтобы сделать"
      - pl: "\nW sto lat krok jeden, już poszedłbym w drogę,"
        ru: "за сто лет хоть шаг, я уже пошёл бы в путь,"
      - pl: "\nSzukając jego w tej wielkiej przepaści."
        ru: "ища его в этой великой пропасти,"
      - pl: "\nKtóra w obwodzie ma mil jedenaście"
        ru: "что в окружности имеет одиннадцать миль,"
      - pl: "\nA wszerz pół mili. Zły duch, co w nich siedzi."
        ru: "а в ширину полмили. Злой дух, что в них сидит,"
      - pl: "\nSkusił mnie radą tych hrabiów Romeny,"
        ru: "соблазнил меня советом этих графов Ромены,"
      - pl: "\nAbym w mennicy bił takie floreny,"
        ru: "чтобы я чеканил на монетном дворе такие флорины,"
        note: "mennica — монетный двор"
      - pl: "\nW których jest najmniej trzy karaty miedzi»."
        ru: "в которых по меньшей мере три карата меди»."
    words: { "lekki": lekki, "krok": krok, "Szukając": szukac, "obwodzie": obwod, "radą": rada, "hrabiów": hrabia }
  - clean: "Rzekłem do niego: «Wskaż tych dwóch na imię,\nCo tam na prawo leżą razem w dymie,\nJak zimą dymiąc parą z mokrej ręki?»\n— «Tak ich znalazłem,» odpowiedział «wtedy,\nGdy mnie w tę otchłań wtrącono na męki,\nI wątpię, z miejsca czy ruszą się kiedy?"
    verse: true
    chunks:
      - pl: "Rzekłem do niego: «Wskaż tych dwóch na imię,"
        ru: "Я сказал ему: «Назови мне по имени тех двоих,"
