chapter: 20
chapterTitle: "Nowe granice, nowa władza"
chapterTitleRu: "Новые границы, новая власть"
level: B2
paragraphs:
  - clean: "Latem 1944 roku, gdy w Warszawie trwało jeszcze powstanie, w Lublinie zaczęła działać nowa władza. Polski Komitet Wyzwolenia Narodowego ogłosił manifest, datowany na 22 lipca, w którym obiecywał demokrację, reformę rolną i odbudowę kraju. Manifest powstał w Moskwie, a komitet był całkowicie zależny od Stalina. W czasach komunizmu dzień 22 lipca był najważniejszym świętem państwowym."
    draft: true
    chunks:
      - pl: "Latem 1944 roku, gdy w Warszawie trwało jeszcze powstanie, w Lublinie zaczęła działać nowa władza."
        ru: "Летом 1944 года, когда в Варшаве ещё шло восстание, в Люблине начала действовать новая власть."
      - pl: " Polski Komitet Wyzwolenia Narodowego ogłosił manifest, datowany na 22 lipca, w którym obiecywał demokrację, reformę rolną i odbudowę kraju."
        ru: "Польский комитет национального освобождения обнародовал манифест, датированный 22 июля, в котором обещал демократию, земельную реформу и восстановление страны."
      - pl: " Manifest powstał w Moskwie, a komitet był całkowicie zależny od Stalina."
        ru: "Манифест был составлен в Москве, а комитет полностью зависел от Сталина."
      - pl: " W czasach komunizmu dzień 22 lipca był najważniejszym świętem państwowym."
        ru: "Во времена коммунизма день 22 июля был главным государственным праздником."
    words: { "ogłosił": oglosic, "lipca": lipiec, "demokrację": demokracja, "powstał": powstac, "komitet": komitet }
  - clean: "Nowa władza szybko przeprowadziła reformę rolną. Majątki ziemskie powyżej pięćdziesięciu hektarów odebrano właścicielom bez odszkodowania, a ziemię rozdano chłopom. Ziemian wysiedlano z ich dworów i zakazywano im mieszkać w rodzinnym powiecie. Wiele dworów, pałaców i zbiorów sztuki zostało zniszczonych lub rozkradzionych. Dla biednych chłopów reforma była spełnieniem marzeń, ale gospodarstwa, które dostali, były zwykle małe i słabe. Jednocześnie NKWD i nowa polska bezpieka aresztowały żołnierzy Armii Krajowej, którzy wyszli z konspiracji. Tysiące z nich wywieziono do łagrów w Związku Radzieckim."
    draft: true
    chunks:
      - pl: "Nowa władza szybko przeprowadziła reformę rolną."
        ru: "Новая власть быстро провела земельную реформу."
      - pl: " Majątki ziemskie powyżej pięćdziesięciu hektarów odebrano właścicielom bez odszkodowania, a ziemię rozdano chłopom."
        ru: "Помещичьи имения площадью свыше пятидесяти гектаров отобрали у владельцев без компенсации, а землю раздали крестьянам."
        note: "odszkodowanie — компенсация"
      - pl: " Ziemian wysiedlano z ich dworów i zakazywano im mieszkać w rodzinnym powiecie."
        ru: "Помещиков выселяли из их усадеб и запрещали им жить в родном уезде."
      - pl: " Wiele dworów, pałaców i zbiorów sztuki zostało zniszczonych lub rozkradzionych."
        ru: "Многие усадьбы, дворцы и художественные собрания были уничтожены или разграблены."
        note: "rozkraść — разворовать"
      - pl: " Dla biednych chłopów reforma była spełnieniem marzeń, ale gospodarstwa, które dostali, były zwykle małe i słabe."
        ru: "Для бедных крестьян реформа была исполнением мечты, но хозяйства, которые они получили, обычно были маленькими и слабыми."
      - pl: " Jednocześnie NKWD i nowa polska bezpieka aresztowały żołnierzy Armii Krajowej, którzy wyszli z konspiracji."
        ru: "Одновременно НКВД и новая польская госбезопасность арестовывали бойцов Армии Крайовой, вышедших из подполья."
        note: "bezpieka — госбезопасность (разг.)"
      - pl: " Tysiące z nich wywieziono do łagrów w Związku Radzieckim."
        ru: "Тысячи из них вывезли в лагеря в Советском Союзе."
    words: { "Majątki": majatek, "ziemskie": ziemski, "powyżej": powyzej, "pięćdziesięciu": piecdziesiat, "chłopom": chlop, "dworów": dwor, "pałaców": palac, "chłopów": chlop, "marzeń": marzenie, "Jednocześnie": jednoczesnie, "polska": polski }
  - clean: "W marcu 1945 roku NKWD zaprosiło przywódców Polskiego Państwa Podziemnego na rozmowy, gwarantując im bezpieczeństwo. Szesnastu z nich, wśród nich ostatniego komendanta Armii Krajowej generała Okulickiego i Delegata Rządu Jana Stanisława Jankowskiego, aresztowano i wywieziono samolotem do Moskwy. W czerwcu 1945 roku postawiono ich przed sądem, oskarżając o współpracę z Niemcami i dywersję na tyłach Armii Czerwonej. Proces szesnastu odbywał się w tych samych dniach, w których w Moskwie rozmawiano o utworzeniu nowego rządu polskiego."
    draft: true
    chunks:
      - pl: "W marcu 1945 roku NKWD zaprosiło przywódców Polskiego Państwa Podziemnego na rozmowy, gwarantując im bezpieczeństwo."
        ru: "В марте 1945 года НКВД пригласил руководителей Польского подпольного государства на переговоры, гарантируя им безопасность."
      - pl: " Szesnastu z nich, wśród nich ostatniego komendanta Armii Krajowej generała Okulickiego i Delegata Rządu Jana Stanisława Jankowskiego, aresztowano i wywieziono samolotem do Moskwy."
        ru: "Шестнадцать из них, в том числе последнего коменданта Армии Крайовой генерала Окулицкого и Представителя правительства Яна Станислава Янковского, арестовали и вывезли самолётом в Москву."
      - pl: " W czerwcu 1945 roku postawiono ich przed sądem, oskarżając o współpracę z Niemcami i dywersję na tyłach Armii Czerwonej."
        ru: "В июне 1945 года их предали суду, обвинив в сотрудничестве с немцами и диверсиях в тылу Красной армии."
        note: "dywersja — диверсия"
      - pl: " Proces szesnastu odbywał się w tych samych dniach, w których w Moskwie rozmawiano o utworzeniu nowego rządu polskiego."
        ru: "Процесс шестнадцати проходил в те же дни, когда в Москве шли переговоры о создании нового польского правительства."
    words: { "marcu": marzec, "przywódców": przywodca, "gwarantując": gwarantowac, "komendanta": komendant, "czerwcu": czerwiec, "oskarżając": oskarzac, "współpracę": wspolpraca, "polskiego": polski }
  - clean: "Okulicki został skazany na dziesięć lat więzienia i zmarł w więzieniu w Moskwie. Jankowski również nie wrócił do kraju. Zachodni politycy protestowali tylko słabo, bo nie chcieli psuć stosunków ze Stalinem tuż przed końcem wojny. Proces pokazał, jak nowa władza zamierza traktować ludzi, którzy przez całą wojnę walczyli z Niemcami. Żołnierzy podziemia nazywano bandytami i faszystami, a ich bohaterstwo przez dziesięciolecia było przemilczane."
    draft: true
    chunks:
      - pl: "Okulicki został skazany na dziesięć lat więzienia i zmarł w więzieniu w Moskwie."
        ru: "Окулицкий был приговорён к десяти годам тюрьмы и умер в московской тюрьме."
      - pl: " Jankowski również nie wrócił do kraju."
        ru: "Янковский тоже не вернулся на родину."
      - pl: " Zachodni politycy protestowali tylko słabo, bo nie chcieli psuć stosunków ze Stalinem tuż przed końcem wojny."
        ru: "Западные политики протестовали лишь вяло, потому что не хотели портить отношения со Сталиным перед самым концом войны."
      - pl: " Proces pokazał, jak nowa władza zamierza traktować ludzi, którzy przez całą wojnę walczyli z Niemcami."
        ru: "Процесс показал, как новая власть намерена обращаться с людьми, которые всю войну сражались с немцами."
      - pl: " Żołnierzy podziemia nazywano bandytami i faszystami, a ich bohaterstwo przez dziesięciolecia było przemilczane."
        ru: "Бойцов подполья называли бандитами и фашистами, а их героизм десятилетиями замалчивался."
        note: "przemilczać — замалчивать"
    words: { "skazany": skazac, "Zachodni": zachodni, "politycy": polityk, "psuć": psuc, "stosunków": stosunek, "podziemia": podziemie, "bandytami": bandyta }
  - clean: "Granice nowej Polski wyznaczyły wielkie mocarstwa. Wschodnia granica przebiegła wzdłuż linii Curzona, a Wilno, Lwów, Grodno i Pińsk znalazły się w Związku Radzieckim. W zamian na konferencji w Poczdamie latem 1945 roku Polska otrzymała ziemie niemieckie aż po Odrę i Nysę Łużycką. Przyłączono do niej Śląsk, Pomorze Zachodnie, Gdańsk i południową część Prus Wschodnich, a północną część z Królewcem zatrzymał Związek Radziecki."
    draft: true
    chunks:
      - pl: "Granice nowej Polski wyznaczyły wielkie mocarstwa."
        ru: "Границы новой Польши определили великие державы."
      - pl: " Wschodnia granica przebiegła wzdłuż linii Curzona, a Wilno, Lwów, Grodno i Pińsk znalazły się w Związku Radzieckim."
        ru: "Восточная граница прошла по линии Керзона, а Вильно, Львов, Гродно и Пинск оказались в Советском Союзе."
      - pl: " W zamian na konferencji w Poczdamie latem 1945 roku Polska otrzymała ziemie niemieckie aż po Odrę i Nysę Łużycką."
        ru: "Взамен на конференции в Потсдаме летом 1945 года Польша получила немецкие земли вплоть до Одры и Лужицкой Нисы."
      - pl: " Przyłączono do niej Śląsk, Pomorze Zachodnie, Gdańsk i południową część Prus Wschodnich, a północną część z Królewcem zatrzymał Związek Radziecki."
        ru: "К ней присоединили Силезию, Западное Поморье, Гданьск и южную часть Восточной Пруссии, а северную часть с Кёнигсбергом удержал Советский Союз."
    words: { "wyznaczyły": wyznaczyc, "Wschodnia": wschodni, "wzdłuż": wzdluz, "konferencji": konferencja, "niemieckie": niemiecki, "Przyłączono": przylaczyc, "południową": poludniowy, "północną": polnocny }
  - clean: "Polska przesunęła się na mapie o kilkaset kilometrów na zachód. Jej powierzchnia zmniejszyła się o mniej więcej jedną piątą, ale nowe ziemie były lepiej zagospodarowane i miały więcej przemysłu niż utracone tereny na wschodzie. Polska zyskała też długie wybrzeże z portami w Gdańsku i Szczecinie. Komunistyczna propaganda nazwała nowe ziemie Ziemiami Odzyskanymi, przypominając, że w średniowieczu rządzili nimi Piastowie. Granica na Odrze i Nysie miała być ostateczna, ale Republika Federalna Niemiec uznała ją w pełni dopiero w 1990 roku."
    draft: true
    chunks:
      - pl: "Polska przesunęła się na mapie o kilkaset kilometrów na zachód."
        ru: "Польша сдвинулась на карте на несколько сотен километров на запад."
      - pl: " Jej powierzchnia zmniejszyła się o mniej więcej jedną piątą, ale nowe ziemie były lepiej zagospodarowane i miały więcej przemysłu niż utracone tereny na wschodzie."
        ru: "Её площадь уменьшилась примерно на пятую часть, но новые земли были лучше освоены и обладали большей промышленностью, чем потерянные территории на востоке."
        note: "zagospodarowany — освоенный, обустроенный"
      - pl: " Polska zyskała też długie wybrzeże z portami w Gdańsku i Szczecinie."
        ru: "Польша получила также длинное побережье с портами в Гданьске и Щецине."
      - pl: " Komunistyczna propaganda nazwała nowe ziemie Ziemiami Odzyskanymi, przypominając, że w średniowieczu rządzili nimi Piastowie."
        ru: "Коммунистическая пропаганда назвала новые земли Возвращёнными землями, напоминая, что в Средние века ими правили Пясты."
      - pl: " Granica na Odrze i Nysie miała być ostateczna, ale Republika Federalna Niemiec uznała ją w pełni dopiero w 1990 roku."
        ru: "Граница по Одре и Нисе должна была быть окончательной, но Федеративная Республика Германия признала её полностью лишь в 1990 году."
