  - clean: "Zmiana granic oznaczała wędrówkę milionów ludzi. Polaków z kresów wschodnich, którzy nie chcieli żyć w Związku Radzieckim, przesiedlano na zachód. Oficjalnie nazywano to repatriacją, czyli powrotem do ojczyzny, choć ludzie opuszczali ziemie, na których ich rodziny żyły od stuleci. W latach 1944–1946 przyjechało w ten sposób do nowej Polski ponad milion ludzi. Jechali tygodniami w wagonach towarowych, zabierając ze sobą krowy, meble, obrazy świętych i grudki ziemi z rodzinnych grobów."
    draft: true
    chunks:
      - pl: "Zmiana granic oznaczała wędrówkę milionów ludzi."
        ru: "Изменение границ означало переселение миллионов людей."
        note: "wędrówka — странствие, переселение"
      - pl: " Polaków z kresów wschodnich, którzy nie chcieli żyć w Związku Radzieckim, przesiedlano na zachód."
        ru: "Поляков с восточных окраин, которые не хотели жить в Советском Союзе, переселяли на запад."
      - pl: " Oficjalnie nazywano to repatriacją, czyli powrotem do ojczyzny, choć ludzie opuszczali ziemie, na których ich rodziny żyły od stuleci."
        ru: "Официально это называли репатриацией, то есть возвращением на родину, хотя люди покидали земли, на которых их семьи жили веками."
      - pl: " W latach 1944–1946 przyjechało w ten sposób do nowej Polski ponad milion ludzi."
        ru: "В 1944–1946 годах таким образом в новую Польшу приехали больше миллиона человек."
      - pl: " Jechali tygodniami w wagonach towarowych, zabierając ze sobą krowy, meble, obrazy świętych i grudki ziemi z rodzinnych grobów."
        ru: "Они неделями ехали в товарных вагонах, забирая с собой коров, мебель, иконы и горсти земли с родных могил."
        note: "grudka — комок"
