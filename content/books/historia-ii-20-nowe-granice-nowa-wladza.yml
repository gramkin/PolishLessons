  - clean: "Dla wielu Polaków utrata Wilna i Lwowa była bolesna jak utrata części własnej duszy. W Wilnie chodził do szkoły Mickiewicz, a we Lwowie działały uniwersytet, Ossolineum i słynna szkoła matematyczna. W obu miastach zostały groby przodków, kościoły i domy, do których nie można było wrócić. W Polsce Ludowej o kresach mówiło się niewiele, bo przypominały o radzieckich krzywdach. Na Litwie i Białorusi zostało jednak kilkaset tysięcy Polaków, których potomkowie mieszkają tam do dziś. Wielu z nich stara się zachować polski język i polskie szkoły, co nie zawsze podoba się władzom ich państw."
    draft: true
    chunks:
      - pl: "Dla wielu Polaków utrata Wilna i Lwowa była bolesna jak utrata części własnej duszy."
        ru: "Для многих поляков потеря Вильно и Львова была болезненной, как потеря части собственной души."
      - pl: " W Wilnie chodził do szkoły Mickiewicz, a we Lwowie działały uniwersytet, Ossolineum i słynna szkoła matematyczna."
        ru: "В Вильно ходил в школу Мицкевич, а во Львове работали университет, Оссолинеум и знаменитая математическая школа."
      - pl: " W obu miastach zostały groby przodków, kościoły i domy, do których nie można było wrócić."
        ru: "В обоих городах остались могилы предков, костёлы и дома, в которые нельзя было вернуться."
      - pl: " W Polsce Ludowej o kresach mówiło się niewiele, bo przypominały o radzieckich krzywdach."
        ru: "В Народной Польше о восточных окраинах говорили мало, потому что они напоминали о советских обидах."
      - pl: " Na Litwie i Białorusi zostało jednak kilkaset tysięcy Polaków, których potomkowie mieszkają tam do dziś."
        ru: "Однако в Литве и Белоруссии остались несколько сотен тысяч поляков, чьи потомки живут там до сих пор."
      - pl: " Wielu z nich stara się zachować polski język i polskie szkoły, co nie zawsze podoba się władzom ich państw."
        ru: "Многие из них стараются сохранить польский язык и польские школы, что не всегда нравится властям их государств."
