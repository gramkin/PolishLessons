  - clean: "Jednocześnie z ziem przyznanych Polsce wysiedlano Niemców. Wielu z nich uciekło już zimą 1945 roku przed Armią Czerwoną, a pozostałych wywieziono do Niemiec w ciągu kilku następnych lat. Wysiedlenia były brutalne, a w obozach i transportach zginęło wielu ludzi, zwłaszcza starszych i dzieci. Ukraińców z Polski przesiedlano do radzieckiej Ukrainy. W 1947 roku w akcji „Wisła” władze rozproszyły po zachodniej i północnej Polsce około stu czterdziestu tysięcy Ukraińców i Łemków z południowo-wschodniej części kraju, oskarżając ich o wspieranie UPA. Po raz pierwszy w historii Polska stała się państwem prawie jednolitym narodowo."
    draft: true
    chunks:
      - pl: "Jednocześnie z ziem przyznanych Polsce wysiedlano Niemców."
        ru: "Одновременно с переданных Польше земель выселяли немцев."
      - pl: " Wielu z nich uciekło już zimą 1945 roku przed Armią Czerwoną, a pozostałych wywieziono do Niemiec w ciągu kilku następnych lat."
        ru: "Многие из них бежали ещё зимой 1945 года от Красной армии, а остальных вывезли в Германию в течение нескольких следующих лет."
      - pl: " Wysiedlenia były brutalne, a w obozach i transportach zginęło wielu ludzi, zwłaszcza starszych i dzieci."
        ru: "Выселения были жестокими, и в лагерях и эшелонах погибло много людей, особенно стариков и детей."
