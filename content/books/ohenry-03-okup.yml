  - clean: "— Ty będziesz koniem — mówi Czarny Zwiadowca. — Stań na czworakach. Jak mam dojechać do fortu bez konia?"
    en: "“You are the hoss,” says Black Scout. “Get down on your hands and knees. How can I ride to the stockade without a hoss?”"
    draft: true
    chunks:
