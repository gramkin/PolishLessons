  - clean: "— Sam — mówi Bill — pewnie uznasz mnie za zdrajcę, ale nic nie mogłem na to poradzić. Jestem dorosłym człowiekiem o męskich skłonnościach i nawykach samoobrony, ale przychodzi taka chwila, kiedy wszelkie systemy egotyzmu i przewagi zawodzą. Chłopaka nie ma. Odesłałem go do domu. Wszystko odwołane. W dawnych czasach byli męczennicy — ciągnie Bill — którzy woleli ponieść śmierć, niż zrezygnować z ulubionego kantu. Żadnego z nich nie poddano takim nadprzyrodzonym torturom jak mnie. Starałem się dochować wierności naszemu statutowi grabieży; ale wszystko ma swoje granice."
    en: "“Sam,” says Bill, “I suppose you’ll think I’m a renegade, but I couldn’t help it. I’m a grown person with masculine proclivities and habits of self-defense, but there is a time when all systems of egotism and predominance fail. The boy is gone. I have sent him home. All is off. There was martyrs in old times,” goes on Bill, “that suffered death rather than give up the particular graft they enjoyed. None of ’em ever was subjugated to such supernatural tortures as I have been. I tried to be faithful to our articles of depredation; but there came a limit.”"
    draft: true
    chunks:
      - pl: "— Sam — mówi Bill —"
        ru: "— Сэм, — говорит Билл, —"
