  - clean: "Poszedłem pieszo do Poplar Cove i przesiedziałem trochę na poczcie i w sklepie, gawędząc z wieśniakami, którzy przychodzili zrobić zakupy. Jeden brodacz mówi, że słyszał, że w Summit wszyscy są poruszeni, bo synek starszego zboru Ebenezera Dorseta zaginął albo został porwany. Więcej nie musiałem wiedzieć. Kupiłem trochę tytoniu do fajki, napomknąłem mimochodem o cenie fasoli, ukradkiem wrzuciłem list do skrzynki i wyszedłem. Poczmistrz powiedział, że za godzinę przyjedzie listonosz i zabierze pocztę do Summit."
    en: "I walked over to Poplar Cove and sat around the postoffice and store, talking with the chawbacons that came in to trade. One whiskerando says that he hears Summit is all upset on account of Elder Ebenezer Dorset’s boy having been lost or stolen. That was all I wanted to know. I bought some smoking tobacco, referred casually to the price of black-eyed peas, posted my letter surreptitiously and came away. The postmaster said the mail-carrier would come by in an hour to take the mail on to Summit."
