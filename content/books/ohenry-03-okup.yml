  - clean: "— Na litość boską — mówi Bill — wracaj, Sam, jak najszybciej. Żałuję, że zażądaliśmy więcej niż tysiąc. Ej, przestań mnie kopać, bo wstanę i tak cię złoję, że popamiętasz."
