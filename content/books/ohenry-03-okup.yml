  - clean: "— Lepiej go czymś zajmij — powiedziałem — dopóki nie ruszymy z naszym planem. Nie bądź taki sztywny."
    en: "“You’d better keep him interested,” said I, “till we get the scheme going. Loosen up.”"
    draft: true
    chunks:
