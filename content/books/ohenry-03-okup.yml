paragraphs:
  - clean: "Zaadresowałem list do Dorseta i schowałem go do kieszeni. Kiedy już miałem ruszać, dzieciak podchodzi do mnie i mówi:"
    en: "I addressed this letter to Dorset, and put it in my pocket. As I was about to start, the kid comes up to me and says:"
    draft: true
    chunks:
      - pl: "Zaadresowałem list do Dorseta"
        ru: "Я надписал на письме адрес Дорсета"
        note: "zaadresować — надписать адрес"
      - pl: " i schowałem go do kieszeni."
        ru: "и спрятал его в карман."
        note: "schować do czegoś — спрятать во что-л."
      - pl: " Kiedy już miałem ruszać,"
        ru: "Когда я уже собирался трогаться,"
        note: "mieć + инфинитив — собираться"
      - pl: " dzieciak podchodzi do mnie i mówi:"
        ru: "малец подходит ко мне и говорит:"
    words: { "schowałem": schowac, "kieszeni": kieszen, "ruszać": ruszac, "dzieciak": dzieciak, "podchodzi": podchodzic, "mówi": mowic }
  - clean: "— E, Wężowe Oko, mówiłeś, że jak cię nie będzie, mogę się bawić w Czarnego Zwiadowcę."
    en: "“Aw, Snake-eye, you said I could play the Black Scout while you was gone.”"
    draft: true
    chunks:
      - pl: "— E, Wężowe Oko,"
        ru: "— Эй, Змеиный Глаз,"
      - pl: " mówiłeś, że jak cię nie będzie, mogę się bawić w Czarnego Zwiadowcę."
        ru: "ты говорил, что, пока тебя не будет, я могу играть в Чёрного Разведчика."
    words: { "mówiłeś": mowic, "będzie": byc, "mogę": moc, "bawić": bawic, "Czarnego": czarny }
  - clean: "— Pewnie, baw się — mówię. — Pan Bill się z tobą pobawi. A co to za zabawa?"
    en: "“Play it, of course,” says I. “Mr. Bill will play with you. What kind of a game is it?”"
    draft: true
    chunks:
      - pl: "— Pewnie, baw się — mówię. —"
        ru: "— Конечно, играй, — говорю я. —"
        note: "pewnie — разговорное «конечно»"
      - pl: " Pan Bill się z tobą pobawi."
        ru: "Мистер Билл с тобой поиграет."
        note: "pobawić się — поиграть"
      - pl: " A co to za zabawa?"
        ru: "А что это за игра?"
    words: { "Pewnie": pewnie, "mówię": mowic, "pobawi": pobawic, "zabawa": zabawa }
  - clean: "— Ja jestem Czarny Zwiadowca — mówi Czerwony Wódz — i muszę pojechać do fortu, żeby ostrzec osadników, że nadchodzą Indianie. Mam już dość bawienia się w Indianina. Chcę być Czarnym Zwiadowcą."
    en: "“I’m the Black Scout,” says Red Chief, “and I have to ride to the stockade to warn the settlers that the Indians are coming. I’m tired of playing Indian myself. I want to be the Black Scout.”"
    draft: true
    chunks:
      - pl: "— Ja jestem Czarny Zwiadowca — mówi Czerwony Wódz —"
        ru: "— Я Чёрный Разведчик, — говорит Красный Вождь, —"
      - pl: " i muszę pojechać do fortu,"
        ru: "и мне надо скакать в форт,"
        note: "fort — форт, укрепление"
      - pl: " żeby ostrzec osadników, że nadchodzą Indianie."
        ru: "чтобы предупредить поселенцев, что идут индейцы."
        note: "ostrzec — предупредить; osadnik — поселенец"
      - pl: " Mam już dość bawienia się w Indianina."
        ru: "Мне уже надоело играть в индейца."
        note: "mieć dość czegoś — быть сытым по горло: родительный"
      - pl: " Chcę być Czarnym Zwiadowcą."
        ru: "Хочу быть Чёрным Разведчиком."
        note: "być kimś — быть кем-л.: творительный"
    words: { "Czerwony": czerwony, "Wódz": wodz, "fortu": fort, "ostrzec": ostrzec, "nadchodzą": nadchodzic, "Indianie": indianin }
  - clean: "— Dobrze — mówię. — Brzmi to dość niewinnie. Pan Bill na pewno pomoże ci pokrzyżować plany tych wrednych dzikusów."
    en: "“All right,” says I. “It sounds harmless to me. I guess Mr. Bill will help you foil the pesky savages.”"
    draft: true
    chunks:
      - pl: "— Dobrze — mówię. —"
        ru: "— Ладно, — говорю я. —"
      - pl: " Brzmi to dość niewinnie."
