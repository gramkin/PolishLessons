  - clean: "Przywileje szlachty miały też drugą, ciemniejszą stronę. Każda nowa wolność szlachecka oznaczała zwykle mniej praw dla innych stanów. W 1496 roku statut piotrkowski ograniczył prawo chłopów do opuszczania wsi: z każdej wsi mógł odejść w ciągu roku tylko jeden chłop. Ten sam statut zabronił mieszczanom kupowania ziemi. Szlachta budowała państwo dla siebie i powoli zamykała drogę awansu dla innych. Skutki tej polityki miały się w pełni ujawnić dopiero w następnych stuleciach."
    draft: true
    chunks:
      - pl: "Przywileje szlachty miały też drugą, ciemniejszą stronę."
        ru: "У привилегий шляхты была и другая, более тёмная сторона."
      - pl: " Każda nowa wolność szlachecka oznaczała zwykle mniej praw dla innych stanów."
        ru: "Каждая новая шляхетская вольность обычно означала меньше прав для других сословий."
        note: "wolność — свобода, вольность"
      - pl: " W 1496 roku statut piotrkowski ograniczył prawo chłopów do opuszczania wsi: z każdej wsi mógł odejść w ciągu roku tylko jeden chłop."
        ru: "В 1496 году Петрковский статут ограничил право крестьян покидать деревню: из каждой деревни в течение года мог уйти только один крестьянин."
      - pl: " Ten sam statut zabronił mieszczanom kupowania ziemi."
        ru: "Тот же статут запретил горожанам покупать землю."
