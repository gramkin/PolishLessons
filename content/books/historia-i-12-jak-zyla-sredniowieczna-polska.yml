  - clean: "Pod koniec XV wieku sejm podzielił się na dwie izby. W senacie zasiadali biskupi i najwyżsi urzędnicy państwa, a w izbie poselskiej posłowie wybierani przez sejmiki. Razem z królem tworzyli trzy stany sejmujące. W 1505 roku sejm w Radomiu uchwalił konstytucję, nazywaną od pierwszych słów „Nihil novi”. Stanowiła ona, że król nie może wprowadzić żadnego nowego prawa bez zgody senatu i izby poselskiej. Od tej chwili Polska była monarchią, w której władzę króla ograniczało przedstawicielstwo szlachty. Historycy nazywają ten ustrój demokracją szlachecką. Była to demokracja dla kilku procent ludności, ale jak na ówczesną Europę, gdzie władcy coraz częściej rządzili absolutnie, było to rozwiązanie niezwykłe."
    draft: true
    chunks:
      - pl: "Pod koniec XV wieku sejm podzielił się na dwie izby."
        ru: "В конце XV века сейм разделился на две палаты."
        note: "izba — палата"
      - pl: " W senacie zasiadali biskupi i najwyżsi urzędnicy państwa, a w izbie poselskiej posłowie wybierani przez sejmiki."
        ru: "В сенате заседали епископы и высшие сановники государства, а в Посольской избе — послы, избранные сеймиками."
        note: "poseł — здесь «депутат»"
      - pl: " Razem z królem tworzyli trzy stany sejmujące."
        ru: "Вместе с королём они составляли три сеймующих сословия."
      - pl: " W 1505 roku sejm w Radomiu uchwalił konstytucję, nazywaną od pierwszych słów „Nihil novi”."
        ru: "В 1505 году сейм в Радоме принял конституцию, называемую по первым словам «Nihil novi»."
        note: "uchwalić — принять (закон); konstytucja — здесь «постановление сейма»"
      - pl: " Stanowiła ona, że król nie może wprowadzić żadnego nowego prawa bez zgody senatu i izby poselskiej."
        ru: "Она устанавливала, что король не может ввести никакого нового закона без согласия сената и Посольской избы."
        note: "stanowić — устанавливать"
      - pl: " Od tej chwili Polska była monarchią, w której władzę króla ograniczało przedstawicielstwo szlachty."
        ru: "С этого момента Польша была монархией, в которой власть короля ограничивало представительство шляхты."
        note: "przedstawicielstwo — представительство"
      - pl: " Historycy nazywają ten ustrój demokracją szlachecką."
        ru: "Историки называют этот строй шляхетской демократией."
      - pl: " Była to demokracja dla kilku procent ludności, ale jak na ówczesną Europę, gdzie władcy coraz częściej rządzili absolutnie, było to rozwiązanie niezwykłe."
        ru: "Это была демократия для нескольких процентов населения, но для тогдашней Европы, где государи всё чаще правили абсолютно, это было необычное решение."
        note: "rozwiązanie — решение"
