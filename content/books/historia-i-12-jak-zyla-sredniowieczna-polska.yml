  - clean: "Jak wyglądał dzień szlachcica? Szlachcic średniej zamożności mieszkał w drewnianym dworze, otoczonym sadem, stawem i zabudowaniami gospodarczymi. Jego zajęciem było przede wszystkim gospodarstwo: doglądał pracy na folwarku, sprzedawał zboże, kupował konie. Jeździł na sejmik, na jarmarki i do sądu, gdzie toczyły się niezliczone procesy z sąsiadami o miedzę, las albo staw. Polska szlachta uwielbiała procesy i potrafiła spierać się przez całe pokolenia. Wolny czas spędzała na polowaniach i ucztach, które słynęły z obfitości."
