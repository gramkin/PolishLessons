  - clean: "Średniowieczna Polska nie była odcięta od wielkich sporów, które poruszały Europę. Najbliżej, za południową granicą, wybuchł w XV wieku ruch husycki. Jego twórcą był czeski kaznodzieja Jan Hus, który krytykował bogactwo i zepsucie duchowieństwa i domagał się, by Biblię czytano w języku narodowym. W 1415 roku na soborze w Konstancji, tym samym, na którym przemawiał Paweł Włodkowic, Husa skazano jako heretyka i spalono na stosie. Czesi chwycili za broń i przez kilkanaście lat odpierali kolejne wyprawy krzyżowe wysyłane przeciwko nim. Ich wojska, złożone głównie z chłopów i mieszczan, walczyły zza wozów połączonych łańcuchami i pokonywały rycerstwo całej Europy."
