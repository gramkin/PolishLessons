chapter: 12
chapterTitle: "Jak żyła średniowieczna Polska"
chapterTitleRu: "Как жила средневековая Польша"
level: B2
paragraphs:
  - clean: "Do tej pory opowiadaliśmy głównie o królach, bitwach i traktatach. Zatrzymajmy się teraz na chwilę i zobaczmy, jak żyli ludzie w Polsce pod koniec średniowiecza, w XIV i XV wieku. Ludność królestwa liczyła wtedy, według szacunków historyków, około dwóch, a pod koniec XV wieku ponad trzech milionów ludzi. Większość z nich mieszkała na wsi i nigdy w życiu nie widziała króla. Społeczeństwo dzieliło się na stany, czyli grupy ludzi o różnych prawach i obowiązkach. Byli to duchowieństwo, szlachta, mieszczaństwo i chłopi. Do jakiego stanu ktoś należał, decydowało zwykle urodzenie."
    draft: true
    chunks:
      - pl: "Do tej pory opowiadaliśmy głównie o królach, bitwach i traktatach."
        ru: "До сих пор мы рассказывали главным образом о королях, битвах и договорах."
        note: "traktat — договор"
      - pl: " Zatrzymajmy się teraz na chwilę i zobaczmy, jak żyli ludzie w Polsce pod koniec średniowiecza, w XIV i XV wieku."
        ru: "Остановимся теперь ненадолго и посмотрим, как жили люди в Польше в конце Средневековья, в XIV–XV веках."
      - pl: " Ludność królestwa liczyła wtedy, według szacunków historyków, około dwóch, a pod koniec XV wieku ponad trzech milionów ludzi."
        ru: "Население королевства насчитывало тогда, по оценкам историков, около двух, а к концу XV века — больше трёх миллионов человек."
        note: "szacunek — оценка"
      - pl: " Większość z nich mieszkała na wsi i nigdy w życiu nie widziała króla."
        ru: "Большинство из них жило в деревне и никогда в жизни не видело короля."
      - pl: " Społeczeństwo dzieliło się na stany, czyli grupy ludzi o różnych prawach i obowiązkach."
        ru: "Общество делилось на сословия, то есть группы людей с разными правами и обязанностями."
        note: "stan — сословие"
      - pl: " Byli to duchowieństwo, szlachta, mieszczaństwo i chłopi."
        ru: "Это были духовенство, шляхта, мещанство и крестьяне."
      - pl: " Do jakiego stanu ktoś należał, decydowało zwykle urodzenie."
        ru: "К какому сословию кто-то принадлежал, решало обычно рождение."
        note: "urodzenie — рождение, происхождение"
