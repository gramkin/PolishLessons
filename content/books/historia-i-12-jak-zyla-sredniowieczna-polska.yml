  - clean: "A jakim językiem mówiono w Polsce? Ludzie mówili po polsku, ale pisano prawie wyłącznie po łacinie. Polskie teksty z tego okresu są nieliczne i cenne. Najstarszym zabytkiem polskiej prozy są Kazania świętokrzyskie z XIV wieku, odnalezione w 1890 roku w oprawie łacińskiej książki. Z tego samego wieku pochodzi Psałterz floriański, przekład psalmów na trzy języki: łacinę, polski i niemiecki. W połowie XV wieku powstał pierwszy przekład całej Biblii na język polski, nazwany Biblią królowej Zofii, od czwartej żony Jagiełły. Około 1440 roku profesor Akademii Jakub Parkosz napisał pierwszy traktat o tym, jak zapisywać polskie głoski łacińskimi literami. Jego propozycje się nie przyjęły, ale pokazują, że ludzie zaczynali myśleć o polszczyźnie jako o języku, który zasługuje na staranność."
