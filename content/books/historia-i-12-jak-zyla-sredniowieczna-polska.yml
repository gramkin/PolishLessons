  - clean: "Szlachta wywodziła się z dawnego rycerstwa, które służyło księciu konno i z bronią w ręku. W zamian za służbę wojskową rycerze otrzymywali ziemię i różne przywileje. Z czasem przywileje stały się dziedziczne, a służba coraz rzadsza. Polska szlachta była bardzo liczna: w XVI wieku stanowiła prawdopodobnie od ośmiu do dziesięciu procent ludności, kilka razy więcej niż szlachta we Francji czy w Anglii. Była też bardzo zróżnicowana. Obok wielkich panów, którzy mieli dziesiątki wsi, żyła szlachta średnia, mająca jedną lub kilka wsi, i szlachta zagrodowa, która uprawiała swoją ziemię sama, jak chłopi. Wszyscy jednak uważali się za równych sobie. Stare przysłowie mówiło: „Szlachcic na zagrodzie równy wojewodzie”."
    draft: true
    chunks:
      - pl: "Szlachta wywodziła się z dawnego rycerstwa, które służyło księciu konno i z bronią w ręku."
        ru: "Шляхта происходила от старого рыцарства, служившего князю конно и с оружием в руках."
      - pl: " W zamian za służbę wojskową rycerze otrzymywali ziemię i różne przywileje."
        ru: "В обмен на военную службу рыцари получали землю и разные привилегии."
      - pl: " Z czasem przywileje stały się dziedziczne, a służba coraz rzadsza."
        ru: "Со временем привилегии стали наследственными, а служба — всё более редкой."
      - pl: " Polska szlachta była bardzo liczna: w XVI wieku stanowiła prawdopodobnie od ośmiu do dziesięciu procent ludności, kilka razy więcej niż szlachta we Francji czy w Anglii."
        ru: "Польская шляхта была очень многочисленна: в XVI веке она составляла, вероятно, от восьми до десяти процентов населения, в несколько раз больше, чем дворянство во Франции или в Англии."
        note: "liczny — многочисленный"
      - pl: " Była też bardzo zróżnicowana."
        ru: "Она была также очень неоднородна."
        note: "zróżnicowany — неоднородный"
      - pl: " Obok wielkich panów, którzy mieli dziesiątki wsi, żyła szlachta średnia, mająca jedną lub kilka wsi, i szlachta zagrodowa, która uprawiała swoją ziemię sama, jak chłopi."
        ru: "Рядом с крупными магнатами, владевшими десятками деревень, жила средняя шляхта, имевшая одну или несколько деревень, и шляхта загродовая, которая обрабатывала свою землю сама, как крестьяне."
        note: "szlachta zagrodowa — мелкая шляхта, сама пахавшая свою землю"
      - pl: " Wszyscy jednak uważali się za równych sobie."
        ru: "Но все считали себя равными между собой."
      - pl: " Stare przysłowie mówiło: „Szlachcic na zagrodzie równy wojewodzie”."
        ru: "Старая пословица гласила: «Шляхтич на своём дворе равен воеводе»."
        note: "zagroda — двор, усадьба"
    words: { "wsi": wies, "chłopi": chlop, "wojskową": wojskowy, "rycerze": rycerz, "otrzymywali": otrzymywac, "przywileje": przywilej, "rzadsza": rzadki, "stanowiła": stanowic, "procent": procent, "zróżnicowana": zroznicowac, "dziesiątki": dziesiatka, "średnia": sredni, "równych": rowny, "równy": rowny }
  - clean: "Znakiem przynależności do szlachty był herb. W Polsce herby wyglądały inaczej niż na Zachodzie: nie należały do jednej rodziny, tylko do całego rodu, a czasem do kilkuset rodzin, które nie były ze sobą spokrewnione. Herby miały swoje nazwy, na przykład Topór, Nałęcz, Leliwa czy Jastrzębiec, a także zawołania, czyli okrzyki bojowe, którymi przywoływano się w bitwie. W 1413 roku w Horodle polskie rody szlacheckie przyjęły do swoich herbów czterdzieści siedem rodzin bojarów litewskich. Był to symboliczny gest braterstwa dwóch narodów. Dotyczył jednak tylko katolików, a prawosławni bojarzy ruscy zostali przez długi czas wykluczeni z tych praw."
    draft: true
    chunks:
      - pl: "Znakiem przynależności do szlachty był herb."
        ru: "Знаком принадлежности к шляхте был герб."
      - pl: " W Polsce herby wyglądały inaczej niż na Zachodzie: nie należały do jednej rodziny, tylko do całego rodu, a czasem do kilkuset rodzin, które nie były ze sobą spokrewnione."
        ru: "В Польше гербы были устроены иначе, чем на Западе: они принадлежали не одной семье, а целому роду, а иногда нескольким сотням семей, которые не состояли между собой в родстве."
      - pl: " Herby miały swoje nazwy, na przykład Topór, Nałęcz, Leliwa czy Jastrzębiec, a także zawołania, czyli okrzyki bojowe, którymi przywoływano się w bitwie."
        ru: "Гербы имели свои названия, например Топор, Наленч, Лелива или Ястшембец, а также зволания, то есть боевые кличи, которыми созывали своих в бою."
        note: "zawołanie — боевой клич; okrzyk — возглас; przywoływać — призывать"
      - pl: " W 1413 roku w Horodle polskie rody szlacheckie przyjęły do swoich herbów czterdzieści siedem rodzin bojarów litewskich."
        ru: "В 1413 году в Городле польские шляхетские роды приняли в свои гербы сорок семь семей литовских бояр."
      - pl: " Był to symboliczny gest braterstwa dwóch narodów."
        ru: "Это был символический жест братства двух народов."
        note: "braterstwo — братство"
      - pl: " Dotyczył jednak tylko katolików, a prawosławni bojarzy ruscy zostali przez długi czas wykluczeni z tych praw."
        ru: "Однако он касался только католиков, а православные русские бояре долгое время были исключены из этих прав."
        note: "wykluczyć — исключить"
