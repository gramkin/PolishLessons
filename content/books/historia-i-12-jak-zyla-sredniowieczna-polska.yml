  - clean: "W XV wieku szlachta zdobywała kolejne przywileje, które stopniowo zmieniały ustrój państwa. Każdy nowy król potrzebował jej poparcia, a każdą wojnę trzeba było z czegoś opłacić. Szlachta wykorzystywała to bardzo umiejętnie. W latach 1430–1433 Jagiełło wydał przywilej, który zawierał słynną zasadę zapisaną po łacinie: „neminem captivabimus nisi iure victum”. Znaczyło to: „nikogo nie uwięzimy bez wyroku sądu”. Szlachcica nie wolno było aresztować ani odebrać mu majątku, dopóki nie skazał go sąd. Była to gwarancja wolności osobistej, którą w Anglii wprowadzono w podobnej formie dopiero ponad dwieście lat później. Obejmowała jednak tylko szlachtę."
    draft: true
    chunks:
      - pl: "W XV wieku szlachta zdobywała kolejne przywileje, które stopniowo zmieniały ustrój państwa."
        ru: "В XV веке шляхта добивалась всё новых привилегий, которые постепенно меняли государственный строй."
        note: "ustrój — строй"
      - pl: " Każdy nowy król potrzebował jej poparcia, a każdą wojnę trzeba było z czegoś opłacić."
        ru: "Каждому новому королю нужна была её поддержка, а любую войну надо было на что-то оплатить."
      - pl: " Szlachta wykorzystywała to bardzo umiejętnie."
        ru: "Шляхта пользовалась этим очень умело."
        note: "umiejętnie — умело"
      - pl: " W latach 1430–1433 Jagiełło wydał przywilej, który zawierał słynną zasadę zapisaną po łacinie: „neminem captivabimus nisi iure victum”."
        ru: "В 1430–1433 годах Ягайло издал привилегию, содержавшую знаменитый принцип, записанный по-латыни: «neminem captivabimus nisi iure victum»."
      - pl: " Znaczyło to: „nikogo nie uwięzimy bez wyroku sądu”."
        ru: "Это означало: «никого не заключим под стражу без приговора суда»."
      - pl: " Szlachcica nie wolno było aresztować ani odebrać mu majątku, dopóki nie skazał go sąd."
        ru: "Шляхтича нельзя было арестовать или отнять у него имущество, пока его не осудил суд."
        note: "aresztować — арестовать"
      - pl: " Była to gwarancja wolności osobistej, którą w Anglii wprowadzono w podobnej formie dopiero ponad dwieście lat później."
        ru: "Это была гарантия личной свободы, которую в Англии ввели в похожей форме лишь более двухсот лет спустя."
        note: "gwarancja — гарантия"
      - pl: " Obejmowała jednak tylko szlachtę."
        ru: "Однако она распространялась только на шляхту."
    words: { "przywileje": przywilej, "opłacić": oplacic, "wykorzystywała": wykorzystywac, "przywilej": przywilej, "zawierał": zawierac, "słynną": slynny, "zapisaną": zapisac, "uwięzimy": uwiezic, "wyroku": wyrok, "wolno": wolno, "majątku": majatek, "skazał": skazac, "gwarancja": gwarancja }
  - clean: "Jeszcze ważniejsze były przywileje wydane przez Kazimierza Jagiellończyka w Nieszawie w 1454 roku, w czasie wojny trzynastoletniej. Szlachta zebrana na pospolite ruszenie odmówiła walki, dopóki król nie spełni jej żądań. Król obiecał, że bez zgody sejmików ziemskich nie będzie zwoływał pospolitego ruszenia ani nakładał nowych podatków. Sejmiki były zebraniami szlachty jednej ziemi, na których dyskutowano o sprawach lokalnych i państwowych. Z ich przedstawicieli powstał z czasem sejm walny, czyli parlament całego królestwa."
    draft: true
    chunks:
      - pl: "Jeszcze ważniejsze były przywileje wydane przez Kazimierza Jagiellończyka w Nieszawie w 1454 roku, w czasie wojny trzynastoletniej."
        ru: "Ещё важнее были привилегии, изданные Казимиром Ягеллончиком в Нешаве в 1454 году, во время Тринадцатилетней войны."
      - pl: " Szlachta zebrana na pospolite ruszenie odmówiła walki, dopóki król nie spełni jej żądań."
        ru: "Шляхта, собранная в посполитое рушение, отказалась воевать, пока король не выполнит её требований."
        note: "żądanie — требование"
      - pl: " Król obiecał, że bez zgody sejmików ziemskich nie będzie zwoływał pospolitego ruszenia ani nakładał nowych podatków."
        ru: "Король обещал, что без согласия земских сеймиков не будет созывать посполитое рушение и вводить новые налоги."
        note: "zwoływać — созывать"
      - pl: " Sejmiki były zebraniami szlachty jednej ziemi, na których dyskutowano o sprawach lokalnych i państwowych."
        ru: "Сеймики были собраниями шляхты одной земли, на которых обсуждали местные и государственные дела."
        note: "zebranie — собрание"
      - pl: " Z ich przedstawicieli powstał z czasem sejm walny, czyli parlament całego królestwa."
        ru: "Из их представителей со временем сложился вальный сейм, то есть парламент всего королевства."
