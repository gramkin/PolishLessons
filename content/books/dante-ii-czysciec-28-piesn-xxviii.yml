chapter: 28
chapterTitle: "Pieśń XXVIII"
chapterTitleRu: "Песнь XXVIII. Земной рай"
level: B2
paragraphs:
  - clean: "(Oddział III. Raj ziemski. Szósty poranek podróży. Gaj. Strumień. Matylda.)"
    chunks:
      - pl: "(Oddział III. Raj ziemski. Szósty poranek podróży. Gaj. Strumień. Matylda.)"
        ru: "(Отдел III. Земной рай. Шестое утро путешествия. Роща. Ручей. Матильда.)"
    words: { "Oddział": oddzial, "ziemski": ziemski, "poranek": poranek, "podróży": podroz, "Strumień": strumien }
  - clean: "Żądny obejrzeć wewnątrz i wokoło\nWdzięk boskiej, wonnej i gęstej dąbrowy,\nCo łagodziła blask dnia porankowy,\nZ niecierpliwością rzuciłem brzeg skały\nI szedłem z wolna przez pole i z wolna,\nAż mię owiała woń kwiatów okolna."
    verse: true
    chunks:
      - pl: "Żądny obejrzeć wewnątrz i wokoło"
        ru: "Жаждая осмотреть внутри и вокруг"
      - pl: "\nWdzięk boskiej, wonnej i gęstej dąbrowy,"
        ru: "прелесть божественной, благоуханной и густой дубравы,"
        note: "dąbrowa — дубрава"
      - pl: "\nCo łagodziła blask dnia porankowy,"
        ru: "что смягчала утренний блеск дня,"
        note: "porankowy — утренний"
      - pl: "\nZ niecierpliwością rzuciłem brzeg skały"
        ru: "я с нетерпением покинул край скалы"
      - pl: "\nI szedłem z wolna przez pole i z wolna,"
        ru: "и шёл медленно по полю, медленно,"
      - pl: "\nAż mię owiała woń kwiatów okolna."
        ru: "пока меня не обвеял запах цветов вокруг."
    words: { "obejrzeć": obejrzec, "boskiej": boski, "blask": blask, "brzeg": brzeg, "skały": skala, "kwiatów": kwiat }
  - clean: "Powietrze słodkie musnęło mi czoło,\nNiezmienne, świeże jak powiew majowy;\nLiście drżeć skore w tym lubym powiewie,\nWszystkie się na wstecz w tę stronę skłaniały.\nGdzie pierwszy cień swój rzuca góra święta.\nJednak zagięte gałęzie i chrusty\nTak nie zboczyły od liniji prostej,\nAżeby na ich wierzchołkach ptaszęta\nPrzestały śpiewać i ćwiczyć się w śpiewie."
    verse: true
    chunks:
      - pl: "Powietrze słodkie musnęło mi czoło,"
        ru: "Сладкий воздух коснулся моего лба,"
      - pl: "\nNiezmienne, świeże jak powiew majowy;"
        ru: "неизменный, свежий, как майское веяние;"
      - pl: "\nLiście drżeć skore w tym lubym powiewie,"
        ru: "листья, скорые дрожать в этом милом веянии,"
      - pl: "\nWszystkie się na wstecz w tę stronę skłaniały."
        ru: "все клонились назад, в ту сторону,"
      - pl: "\nGdzie pierwszy cień swój rzuca góra święta."
        ru: "куда святая гора бросает свою первую тень."
      - pl: "\nJednak zagięte gałęzie i chrusty"
        ru: "Однако согнутые ветви и хворост"
        note: "chrust — хворост"
      - pl: "\nTak nie zboczyły od liniji prostej,"
        ru: "не настолько отклонились от прямой линии,"
      - pl: "\nAżeby na ich wierzchołkach ptaszęta"
        ru: "чтобы на их верхушках птахи"
        note: "ptaszę — птаха"
      - pl: "\nPrzestały śpiewać i ćwiczyć się w śpiewie."
        ru: "перестали петь и упражняться в пении."
    words: { "musnęło": musnac, "czoło": czolo, "świeże": swiezy, "wstecz": wstecz, "cień": cien, "ćwiczyć": cwiczyc }
  - clean: "Wesołe siedząc i nucąc na drzewie,\nWitały ranek pomiędzy liściami,\nMieszającymi swój szmer z ich pieśniami.\nTaki szmer szumi na pola i lasy,\nZ gałęzi sosen nad brzegiem Chiassy,\nKiedy dmie Eol duszące Siroko."
    verse: true
    chunks:
      - pl: "Wesołe siedząc i nucąc na drzewie,"
        ru: "Весёлые, сидя и напевая на дереве,"
      - pl: "\nWitały ranek pomiędzy liściami,"
        ru: "они приветствовали утро среди листьев,"
      - pl: "\nMieszającymi swój szmer z ich pieśniami."
        ru: "смешивающих свой шелест с их песнями."
      - pl: "\nTaki szmer szumi na pola i lasy,"
        ru: "Такой шелест шумит по полям и лесам"
      - pl: "\nZ gałęzi sosen nad brzegiem Chiassy,"
        ru: "с ветвей сосен над берегом Кьясси,"
      - pl: "\nKiedy dmie Eol duszące Siroko."
        ru: "когда Эол выпускает удушливый сирокко."
    words: { "Wesołe": wesoly, "Mieszającymi": mieszac, "szmer": szmer, "pieśniami": piesn, "lasy": las, "duszące": dusic }
  - clean: "Choć z wolna idąc, w las wszedłem głęboko,\nAż w leśnych błędach gubiło się oko.\nI oto krok mój w chaosie zadumień\nNie mógł iść dalej, zatrzymał mię strumień,\nKtórego drobne fale w lewą stronę\nZginały trawy przy nim urodzone."
    verse: true
    chunks:
      - pl: "Choć z wolna idąc, w las wszedłem głęboko,"
        ru: "Хоть и идя медленно, я вошёл в лес глубоко,"
      - pl: "\nAż w leśnych błędach gubiło się oko."
        ru: "так что глаз терялся в лесных блужданиях."
      - pl: "\nI oto krok mój w chaosie zadumień"
        ru: "И вот мой шаг в хаосе раздумий"
      - pl: "\nNie mógł iść dalej, zatrzymał mię strumień,"
        ru: "не мог идти дальше, меня остановил ручей,"
      - pl: "\nKtórego drobne fale w lewą stronę"
        ru: "чьи мелкие волны влево"
      - pl: "\nZginały trawy przy nim urodzone."
        ru: "сгибали траву, рождённую у него."
    words: { "wszedłem": wejsc, "błędach": blad, "krok": krok, "chaosie": chaos, "zatrzymał": zatrzymac, "fale": fala }
  - clean: "Najczystsze wody po ziemi rozlane\nByłyby mętne z wodą porównane,\nKtóra nie kryje żadnej rzeczy na dnie:\nChociaż jej przeźrocz cień osłania wieczny,\nPrzez który księżyc i promień słoneczny\nDo jej fal jasnych nigdy się nie wkradnie."
    verse: true
    chunks:
      - pl: "Najczystsze wody po ziemi rozlane"
        ru: "Самые чистые воды, разлитые по земле,"
      - pl: "\nByłyby mętne z wodą porównane,"
        ru: "были бы мутны в сравнении с водой,"
      - pl: "\nKtóra nie kryje żadnej rzeczy na dnie:"
        ru: "что не скрывает на дне никакой вещи:"
      - pl: "\nChociaż jej przeźrocz cień osłania wieczny,"
        ru: "хотя её прозрачность заслоняет вечная тень,"
      - pl: "\nPrzez który księżyc i promień słoneczny"
        ru: "сквозь которую луна и солнечный луч"
      - pl: "\nDo jej fal jasnych nigdy się nie wkradnie."
        ru: "никогда не прокрадутся к её ясным волнам."
    words: { "porównane": porownac, "kryje": kryc, "wieczny": wieczny, "księżyc": ksiezyc, "promień": promien, "słoneczny": sloneczny }
  - clean: "Stanąłem, oczy za strumień posłałem,\nDrzew rozmaitość podziwiać z zapałem.\nI tam (jak przedmiot gdy się zjawi nowy,\nKażdą myśl inną wywietrza nam z głowy),\nWidziałem damę, po kwietnych zieleniach\nIdąc, nuciła i kwiaty zbierała,\nJakimi łąka jej drogę dzierzgała."
    verse: true
    chunks:
      - pl: "Stanąłem, oczy za strumień posłałem,"
        ru: "Я остановился, послал глаза за ручей,"
      - pl: "\nDrzew rozmaitość podziwiać z zapałem."
        ru: "чтобы с жаром любоваться разнообразием деревьев."
      - pl: "\nI tam (jak przedmiot gdy się zjawi nowy,"
        ru: "И там (как, когда явится новый предмет,"
      - pl: "\nKażdą myśl inną wywietrza nam z głowy),"
        ru: "он выветривает у нас из головы всякую другую мысль)"
      - pl: "\nWidziałem damę, po kwietnych zieleniach"
        ru: "я увидел даму: идя по цветущей зелени,"
        note: "kwietny — цветущий"
      - pl: "\nIdąc, nuciła i kwiaty zbierała,"
        ru: "она напевала и собирала цветы,"
      - pl: "\nJakimi łąka jej drogę dzierzgała."
        ru: "которыми луг расшивал её дорогу."
        note: "dzierzgać — расшивать"
    words: { "Stanąłem": stanac, "posłałem": poslac, "podziwiać": podziwiac, "przedmiot": przedmiot, "zjawi": zjawic, "damę": dama }
  - clean: "«Ty, co się grzejesz w miłości promieniach,\nO piękna!» rzekłem: «jeśli z lic twych zgadłem,\nZbliż się do zdroju, śpiewaczek królowo,\nAbym, co śpiewasz, mógł słyszeć twe słowo.\nTy przypominasz mi ową dolinę,\nZ której porwano piękną Prozerpinę,\nI chwilę, gdy ją straciła jej matka\nA ona świeżość wiośnianego kwiatka»."
    verse: true
    chunks:
      - pl: "«Ty, co się grzejesz w miłości promieniach,"
        ru: "«Ты, что греешься в лучах любви,"
      - pl: "\nO piękna!» rzekłem: «jeśli z lic twych zgadłem,"
        ru: "о прекрасная! — сказал я, — если я угадал по твоему лицу,"
      - pl: "\nZbliż się do zdroju, śpiewaczek królowo,"
        ru: "приблизься к источнику, царица певиц,"
      - pl: "\nAbym, co śpiewasz, mógł słyszeć twe słowo."
        ru: "чтобы я мог слышать слова того, что ты поёшь."
      - pl: "\nTy przypominasz mi ową dolinę,"
        ru: "Ты напоминаешь мне ту долину,"
      - pl: "\nZ której porwano piękną Prozerpinę,"
        ru: "из которой похитили прекрасную Прозерпину,"
      - pl: "\nI chwilę, gdy ją straciła jej matka"
        ru: "и миг, когда её потеряла мать,"
      - pl: "\nA ona świeżość wiośnianego kwiatka»."
        ru: "а она — свежесть весеннего цветка»."
    words: { "grzejesz": grzac, "rzekłem": rzec, "zgadłem": zgadnac, "Zbliż": zblizyc, "dolinę": dolina, "kwiatka": kwiatek }
  - clean: "Gdy tanecznica skoczne kręgi toczy,\nSama na sobie obraca się długo,\nZaledwo jedną mknie stopą przed drugą:\nTak się na kwiatach lotem błyskawicy\nZwróciła ku mnie, podobna dziewicy,\nKtóra w dół spuszcza swoje skromne oczy."
    verse: true
    chunks:
      - pl: "Gdy tanecznica skoczne kręgi toczy,"
        ru: "Как плясунья кружит быстрые круги,"
        note: "tanecznica — плясунья"
      - pl: "\nSama na sobie obraca się długo,"
        ru: "долго поворачиваясь на месте,"
      - pl: "\nZaledwo jedną mknie stopą przed drugą:"
        ru: "едва передвигая одну ногу перед другой:"
      - pl: "\nTak się na kwiatach lotem błyskawicy"
        ru: "так по цветам с быстротой молнии"
      - pl: "\nZwróciła ku mnie, podobna dziewicy,"
        ru: "она обернулась ко мне, подобная деве,"
      - pl: "\nKtóra w dół spuszcza swoje skromne oczy."
        ru: "что опускает вниз свои скромные глаза."
    words: { "kręgi": krag, "toczy": toczyc, "lotem": lot, "Zwróciła": zwrocic, "dziewicy": dziewica, "skromne": skromny }
  - clean: "Ona odmową prośby mej nie drażni,\nTak blisko smugiem podeszła murawy,\nŻem mógł jej słowa słyszeć najwyraźniej.\nLedwo stanęła nad pięknym strumieniem,\nTam, gdzie nadbrzeżne w nim kąpią się trawy,\nJuż mię darzyła oczu podniesieniem."
    verse: true
    chunks:
      - pl: "Ona odmową prośby mej nie drażni,"
        ru: "Она не раздражает отказом мою просьбу,"
      - pl: "\nTak blisko smugiem podeszła murawy,"
        ru: "так близко подошла по полоске дёрна,"
        note: "murawa — дёрн"
      - pl: "\nŻem mógł jej słowa słyszeć najwyraźniej."
        ru: "что я мог слышать её слова как можно яснее."
      - pl: "\nLedwo stanęła nad pięknym strumieniem,"
        ru: "Едва она остановилась над прекрасным ручьём,"
      - pl: "\nTam, gdzie nadbrzeżne w nim kąpią się trawy,"
        ru: "там, где прибрежные травы купаются в нём,"
      - pl: "\nJuż mię darzyła oczu podniesieniem."
        ru: "уже одарила меня поднятием глаз."
    words: { "prośby": prosba, "podeszła": podejsc, "słyszeć": slyszec, "najwyraźniej": wyraznie, "Ledwo": ledwo, "podniesieniem": podniesc }
  - clean: "Wątpię, czy żywszym spod rzęsów promieniem\nWenus błysnęła, czując ból od strzały,\nGdy ją niebacznie ranił syn jej mały.\nZ prawego brzegu wciąż się uśmiechały\nJej usta do mnie, kwiaty, jakie zrywa,\nBez nasion rodzi ta ziemi szczęśliwa."
    verse: true
    chunks:
      - pl: "Wątpię, czy żywszym spod rzęsów promieniem"
        ru: "Сомневаюсь, что более живым лучом из-под ресниц"
      - pl: "\nWenus błysnęła, czując ból od strzały,"
        ru: "блеснула Венера, почувствовав боль от стрелы,"
      - pl: "\nGdy ją niebacznie ranił syn jej mały."
        ru: "когда её нечаянно ранил её маленький сын."
      - pl: "\nZ prawego brzegu wciąż się uśmiechały"
        ru: "С правого берега всё улыбались"
      - pl: "\nJej usta do mnie, kwiaty, jakie zrywa,"
        ru: "мне её уста, цветы, что она срывает,"
      - pl: "\nBez nasion rodzi ta ziemi szczęśliwa."
        ru: "эта счастливая земля рождает без семян."
    words: { "Wątpię": watpic, "żywszym": zywy, "prawego": prawy, "uśmiechały": usmiechac, "usta": usta, "nasion": nasienie }
  - clean: "Strumień nas dzielił ledwo o trzy kroki,\nLecz Hellespontu rozdąsana fala,\nGdzie most Kserksesa w swe tonie zawala,\n(Dla dumy ludzkiej dziś jeszcze wędzidło),\nTak Leandrowi nie była obrzydłą,\nGdy między Sestos a Abidos pływa:\nJako był dla mnie ten strumień głęboki,\nKtóry natenczas mój przechód zapierał,\nA sam przede mną swych wód nie otwierał."
    verse: true
    chunks:
      - pl: "Strumień nas dzielił ledwo o trzy kroki,"
        ru: "Ручей разделял нас едва на три шага,"
      - pl: "\nLecz Hellespontu rozdąsana fala,"
        ru: "но разъярённая волна Геллеспонта,"
      - pl: "\nGdzie most Kserksesa w swe tonie zawala,"
        ru: "где мост Ксеркса обрушился в её пучину,"
      - pl: "\n(Dla dumy ludzkiej dziś jeszcze wędzidło),"
        ru: "(для людской гордыни ещё ныне узда),"
      - pl: "\nTak Leandrowi nie była obrzydłą,"
        ru: "не была так ненавистна Леандру,"
      - pl: "\nGdy między Sestos a Abidos pływa:"
        ru: "когда он плавает между Сестом и Абидосом,"
      - pl: "\nJako był dla mnie ten strumień głęboki,"
        ru: "как для меня был этот глубокий ручей,"
      - pl: "\nKtóry natenczas mój przechód zapierał,"
        ru: "что тогда преграждал мне переход"
      - pl: "\nA sam przede mną swych wód nie otwierał."
        ru: "и сам не раскрывал передо мной своих вод."
    words: { "dzielił": dzielic, "most": most, "dumy": duma, "pływa": plywac, "głęboki": gleboki, "otwierał": otwierac }
  - clean: "«Jesteś» mówiła «tu jeszcze gość nowy,\nMoże mój uśmiech, coś dostrzegł z daleka,\nW miejscu wybranym na gniazdo człowieka,\nDziwi cię, wzbudza jakieś podejrzenie?\nLecz światło z psalmu: »Boś ucieszył, Panie«,\nW zmroku twej myśli wejdzie jak zaranie."
    verse: true
    chunks:
      - pl: "«Jesteś» mówiła «tu jeszcze gość nowy,"
        ru: "«Ты, — сказала она, — здесь ещё новый гость,"
      - pl: "\nMoże mój uśmiech, coś dostrzegł z daleka,"
        ru: "может быть, моя улыбка, что ты заметил издали,"
      - pl: "\nW miejscu wybranym na gniazdo człowieka,"
        ru: "в месте, избранном гнездом человека,"
      - pl: "\nDziwi cię, wzbudza jakieś podejrzenie?"
        ru: "удивляет тебя, будит какое-то подозрение?"
      - pl: "\nLecz światło z psalmu: »Boś ucieszył, Panie«,"
        ru: "Но свет из псалма: „Ибо ты возвеселил меня, Господи“,"
      - pl: "\nW zmroku twej myśli wejdzie jak zaranie."
        ru: "войдёт в сумрак твоей мысли, как заря."
    words: { "dostrzegł": dostrzec, "gniazdo": gniazdo, "Dziwi": dziwic, "podejrzenie": podejrzenie, "ucieszył": ucieszyc, "zmroku": zmrok }
  - clean: "Ty, coś mię prośbą wyzwał do rozmowy,\nGdy chcesz ode mnie o czym innym wiedzieć,\nPrzyszłam gotowa tobie odpowiedzieć,\nWszelkich zapytań rozwiązać zwątpienie».\n— «Woda,» mówiłem «szelest tej dąbrowy,\nZ jedną mi rzeczą nie godzą się dziwnie,\nO której naprzód słyszałem przeciwnie,\nI nową wiarę wyzywa do boju»."
    verse: true
    chunks:
      - pl: "Ty, coś mię prośbą wyzwał do rozmowy,"
        ru: "Ты, что просьбой вызвал меня на разговор,"
      - pl: "\nGdy chcesz ode mnie o czym innym wiedzieć,"
        ru: "если хочешь знать от меня о чём-то другом,"
      - pl: "\nPrzyszłam gotowa tobie odpowiedzieć,"
        ru: "я пришла готовой тебе ответить,"
      - pl: "\nWszelkich zapytań rozwiązać zwątpienie»."
        ru: "разрешить сомнение всяких вопросов»."
      - pl: "\n— «Woda,» mówiłem «szelest tej dąbrowy,"
        ru: "— «Вода, — сказал я, — шелест этой дубравы"
      - pl: "\nZ jedną mi rzeczą nie godzą się dziwnie,"
        ru: "странно не согласуются у меня с одной вещью,"
      - pl: "\nO której naprzód słyszałem przeciwnie,"
        ru: "о которой я прежде слышал противоположное,"
        note: "от Стация: здесь нет ветров и дождей"
      - pl: "\nI nową wiarę wyzywa do boju»."
