  - clean: "«Bóg wszystko widzi!» rzekłem, «Twoje oko\nWzajem się w Bogu zatapia głęboko,\nKażda myśl jego, jaką w tobie czyta,\nWzajem nie może być dla cię zakryta.\nDlaczegóż głos twój, co wśród pieśni wiela\nZ Serafinami niebo rozwesela,\nKtórych zakrywa aż skrzydeł sześcioro,\nNie chce ukoić mych żądz, co tak gorą?"
    verse: true
    chunks:
      - pl: "«Bóg wszystko widzi!» rzekłem, «Twoje oko"
        ru: "«Бог видит всё! — сказал я, — твой глаз"
      - pl: "\nWzajem się w Bogu zatapia głęboko,"
        ru: "в свою очередь глубоко погружается в Бога,"
      - pl: "\nKażda myśl jego, jaką w tobie czyta,"
        ru: "каждая его мысль, которую он в тебе читает,"
      - pl: "\nWzajem nie może być dla cię zakryta."
        ru: "в свою очередь не может быть от тебя скрыта."
      - pl: "\nDlaczegóż głos twój, co wśród pieśni wiela"
        ru: "Почему же твой голос, что среди многих песен"
      - pl: "\nZ Serafinami niebo rozwesela,"
        ru: "веселит небо с серафимами,"
      - pl: "\nKtórych zakrywa aż skrzydeł sześcioro,"
        ru: "которых закрывают целых шесть крыльев,"
      - pl: "\nNie chce ukoić mych żądz, co tak gorą?"
        ru: "не хочет утолить мои желания, что так горят?"
    words: { "Bogu": bog, "Każda": kazdy, "głos": glos, "pieśni": piesn, "niebo": niebo, "skrzydeł": skrzydlo }
  - clean: "Ja bym nie czekał na twoje pytanie,\nWidząc tak w tobie, jak ty widzisz we mnie».\nDuch począł mówić wyzwany przeze mnie:\n— «Największy padół zalany wodami,\nCo się nie mogły zmieścić w Oceanie\nOpasującym ziemię ramionami,\nCo pod południk idąc przeciw słońca,\nZ zachodu na wschód ciągnie się bez końca,\nTego padołu na jednym z wybrzeży\nMoja rodzinna Marsylija leży,\nA która niegdyś, w czym wieczna jej chwała,\nWody w swym porcie swoją krwią zagrzała."
    verse: true
    chunks:
      - pl: "Ja bym nie czekał na twoje pytanie,"
        ru: "Я бы не ждал твоего вопроса,"
      - pl: "\nWidząc tak w tobie, jak ty widzisz we mnie»."
