        ru: "Божий дух струится на нас, как луч,"
      - pl: "\nStąd mowa nasza szczera i prawdziwa»."
        ru: "отсюда наша речь искренна и правдива»."
      - pl: "\nTu duch do swojej sfery się obrócił"
        ru: "Тут дух обратился к своей сфере"
      - pl: "\nI znów Hosannę, zdało mi się, nucił."
