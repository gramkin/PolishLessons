    words: { "Ciąg": ciag, "dalszy": daleki, "Kościele": kosciol }
  - clean: "Tak objaśniwszy mi moje wątpienia,\nPiękna Klemenso, twój ojciec mi gadał,\nJako królewski szczep z jego nasienia\nNikczemną zdradą niszczał i przepadał,\n«Milcz!» — mówił do mnie: «niechaj lata cieką,\nGrom nieszczęść waszych już grzmi niedaleko»."
    verse: true
    chunks:
      - pl: "Tak objaśniwszy mi moje wątpienia,"
        ru: "Так разъяснив мне мои сомнения,"
      - pl: "\nPiękna Klemenso, twój ojciec mi gadał,"
        ru: "прекрасная Клеменца, твой отец говорил мне,"
        note: "дочь или жена Карла Мартелла"
      - pl: "\nJako królewski szczep z jego nasienia"
        ru: "как королевский род от его семени"
      - pl: "\nNikczemną zdradą niszczał i przepadał,"
        ru: "гиб и пропадал от подлой измены;"
        note: "niszczeć — разрушаться, гибнуть"
      - pl: "\n«Milcz!» — mówił do mnie: «niechaj lata cieką,"
        ru: "«Молчи! — сказал он мне, — пусть текут годы,"
      - pl: "\nGrom nieszczęść waszych już grzmi niedaleko»."
        ru: "гром ваших несчастий уже гремит недалеко»."
    words: { "szczep": szczep, "nasienia": nasienie, "zdradą": zdrada, "przepadał": przepadac, "nieszczęść": nieszczescie, "niedaleko": niedaleko }
  - clean: "I oto światłość święta i żyjąca\nJuż się zwróciła do swojego słońca\nJako ku dobru, które nie ma końca.\nO płoche dusze! Czemu krewkość wasza\nMyśl od takiego dobra wam odpłasza,\nŻe jako nocne ćmy przez całe życie\nTylko za blaskiem próżności gonicie."
    verse: true
    chunks:
      - pl: "I oto światłość święta i żyjąca"
        ru: "И вот святой и живой свет"
      - pl: "\nJuż się zwróciła do swojego słońca"
        ru: "уже обратился к своему солнцу,"
      - pl: "\nJako ku dobru, które nie ma końca."
        ru: "как к благу, у которого нет конца."
      - pl: "\nO płoche dusze! Czemu krewkość wasza"
        ru: "О легкомысленные души! почему ваша горячность"
      - pl: "\nMyśl od takiego dobra wam odpłasza,"
        ru: "отпугивает вашу мысль от такого блага,"
        note: "odpłaszać — отпугивать"
      - pl: "\nŻe jako nocne ćmy przez całe życie"
        ru: "что вы, как ночные мотыльки, всю жизнь"
        note: "ćma — ночная бабочка"
      - pl: "\nTylko za blaskiem próżności gonicie."
        ru: "гонитесь лишь за блеском суеты."
    words: { "zwróciła": zwrocic, "słońca": slonce, "wasza": wasz, "nocne": nocny, "blaskiem": blask, "gonicie": gonic }
  - clean: "W tej chwili druga światłość z świateł grona\nZstąpiła ku mnie, a blask jej uroczy\nZdradzał, że dla mnie jest dobrze skłoniona.\nUtkwione we mnie Beatrycze oczy\nChęć mą przydługim drażnioną pragnieniem\nUspokoiły słodkim przyzwoleniem."
    verse: true
    chunks:
      - pl: "W tej chwili druga światłość z świateł grona"
        ru: "В этот миг другой свет из круга светил"
      - pl: "\nZstąpiła ku mnie, a blask jej uroczy"
        ru: "сошёл ко мне, а его прелестный блеск"
      - pl: "\nZdradzał, że dla mnie jest dobrze skłoniona."
        ru: "выдавал, что он хорошо ко мне расположен."
      - pl: "\nUtkwione we mnie Beatrycze oczy"
        ru: "Вперённые в меня глаза Беатриче"
      - pl: "\nChęć mą przydługim drażnioną pragnieniem"
        ru: "успокоили моё желание, раздражённое слишком долгой жаждой,"
      - pl: "\nUspokoiły słodkim przyzwoleniem."
        ru: "сладким согласием."
    words: { "grona": grono, "Zdradzał": zdradzac, "Chęć": chec, "pragnieniem": pragnienie, "Uspokoiły": uspokoic, "słodkim": slodki }
  - clean: "«O! Przemów» rzekłem: «mów, duchu szczęśliwy,\nSłowami twymi daj mi dowód żywy,\nŻe moich myśli świeci odblask w tobie».\nI rzekła światłość dla mnie jeszcze nowa,\nZe środka sfery, skąd wprzód szły jej słowa,\nZ radością zwykłą szlachetnej osobie,\nCo dobrze czyniąc, raduje się w sobie."
    verse: true
    chunks:
      - pl: "«O! Przemów» rzekłem: «mów, duchu szczęśliwy,"
        ru: "«О! заговори, — сказал я, — говори, счастливый дух,"
      - pl: "\nSłowami twymi daj mi dowód żywy,"
        ru: "своими словами дай мне живое доказательство,"
      - pl: "\nŻe moich myśli świeci odblask w tobie»."
        ru: "что в тебе светит отблеск моих мыслей»."
      - pl: "\nI rzekła światłość dla mnie jeszcze nowa,"
        ru: "И сказал свет, для меня ещё новый,"
      - pl: "\nZe środka sfery, skąd wprzód szły jej słowa,"
        ru: "из середины сферы, откуда прежде шли его слова,"
      - pl: "\nZ radością zwykłą szlachetnej osobie,"
        ru: "с радостью, обычной благородному человеку,"
      - pl: "\nCo dobrze czyniąc, raduje się w sobie."
        ru: "что, делая добро, радуется в себе."
    words: { "rzekłem": rzec, "żywy": zywy, "radością": radosc, "zwykłą": zwykly, "szlachetnej": szlachetny, "czyniąc": czynic }
  - clean: "— «W części Włoch głośnej z zepsucia i wrzawy,\nMiędzy Rialto od morskiej zatoki\nA strumieniami Brenty i Piawy,\nJest ląd wzniesiony, wzgórek niewysoki,\nSkąd płomień mały zstąpił iskrą marną,\nW końcu się rozdął na żagiew pożarną,\nKraj wokół strawił w płomieniu i dymie."
    verse: true
    chunks:
      - pl: "— «W części Włoch głośnej z zepsucia i wrzawy,"
        ru: "— «В части Италии, известной порчей и шумом,"
      - pl: "\nMiędzy Rialto od morskiej zatoki"
        ru: "между Риальто от морского залива"
      - pl: "\nA strumieniami Brenty i Piawy,"
        ru: "и потоками Бренты и Пьявы,"
      - pl: "\nJest ląd wzniesiony, wzgórek niewysoki,"
        ru: "есть возвышенная земля, невысокий холм,"
      - pl: "\nSkąd płomień mały zstąpił iskrą marną,"
        ru: "откуда сошло малое пламя ничтожной искрой,"
        note: "Эццелино да Романо"
      - pl: "\nW końcu się rozdął na żagiew pożarną,"
        ru: "под конец раздувшееся в пожарный факел,"
      - pl: "\nKraj wokół strawił w płomieniu i dymie."
        ru: "сожгло край кругом в пламени и дыму."
    words: { "głośnej": glosny, "zatoki": zatoka, "strumieniami": strumien, "wzniesiony": wzniesc, "płomień": plomien, "marną": marny }
  - clean: "Oboje wiedziem ród z jednego gniazda,\nJa świecę tutaj, Kunizza na imię,\nBo mnie swym blaskiem podbiła ta gwiazda.\nLecz ja wesoła, choć gwiazda Wenery\nNiższym od wielu gwiazd jest pomieszkaniem,\nPrzyczynę losu znoszę z pobłażaniem,\nCo wy na ziemi za dziwo weźmiecie!"
    verse: true
    chunks:
      - pl: "Oboje wiedziem ród z jednego gniazda,"
        ru: "Мы оба ведём род из одного гнезда,"
      - pl: "\nJa świecę tutaj, Kunizza na imię,"
        ru: "я свечу здесь, имя мне Куницца,"
      - pl: "\nBo mnie swym blaskiem podbiła ta gwiazda."
        ru: "ибо меня покорила своим блеском эта звезда."
        note: "то есть любовь"
      - pl: "\nLecz ja wesoła, choć gwiazda Wenery"
        ru: "Но я весела, хоть звезда Венеры"
      - pl: "\nNiższym od wielu gwiazd jest pomieszkaniem,"
        ru: "— жилище ниже многих звёзд,"
      - pl: "\nPrzyczynę losu znoszę z pobłażaniem,"
        ru: "причину своего удела я сношу снисходительно,"
        note: "pobłażanie — снисхождение"
      - pl: "\nCo wy na ziemi za dziwo weźmiecie!"
        ru: "что вы на земле примете за диво!"
    words: { "gniazda": gniazdo, "wesoła": wesoly, "Niższym": niski, "Przyczynę": przyczyna, "losu": los, "znoszę": znosic }
  - clean: "To promieniste cacko naszej sfery,\nCo świeci przy mnie, sławnym jest na świecie,\nI będzie sławnym aż w piąte stulecie.\nCzyliż nie miło czymkolwiek się wsławić?\nCzłowieku, zespól swe słowa i czyny,\nBy drugie życie po sobie zostawić."
    verse: true
    chunks:
      - pl: "To promieniste cacko naszej sfery,"
        ru: "Эта лучистая драгоценность нашей сферы,"
        note: "cacko — драгоценность; Фолько"
      - pl: "\nCo świeci przy mnie, sławnym jest na świecie,"
        ru: "что светит рядом со мной, славна на свете"
      - pl: "\nI będzie sławnym aż w piąte stulecie."
        ru: "и будет славна до пятого столетия."
      - pl: "\nCzyliż nie miło czymkolwiek się wsławić?"
        ru: "Разве не мило чем-либо прославиться?"
      - pl: "\nCzłowieku, zespól swe słowa i czyny,"
        ru: "Человек, соедини свои слова и дела,"
      - pl: "\nBy drugie życie po sobie zostawić."
        ru: "чтобы оставить после себя вторую жизнь."
    words: { "naszej": nasz, "sławnym": slawny, "stulecie": stulecie, "Człowieku": czlowiek, "czyny": czyn, "zostawić": zostawic }
  - clean: "Nie tą zaiste myślą jest przejętą\nCiżba żyjąca przy Tagliamento;\nChoć bita, jeszcze nie żałuje winy.\nLecz przyjdzie chwila, gdy znękani więcej\nW jarzmo niewoli swoje karki nagną;\nGdy krew Padwanów ufarbuje bagno\nI z nim popłynie aż pod mur Wicency."
    verse: true
    chunks:
      - pl: "Nie tą zaiste myślą jest przejętą"
        ru: "Воистину, не этой мыслью проникнута"
      - pl: "\nCiżba żyjąca przy Tagliamento;"
        ru: "толпа, живущая у Тальяменто;"
      - pl: "\nChoć bita, jeszcze nie żałuje winy."
        ru: "хоть и битая, она ещё не жалеет о вине."
      - pl: "\nLecz przyjdzie chwila, gdy znękani więcej"
        ru: "Но придёт миг, когда, ещё более измученные,"
      - pl: "\nW jarzmo niewoli swoje karki nagną;"
        ru: "они пригнут свои шеи в ярмо неволи;"
      - pl: "\nGdy krew Padwanów ufarbuje bagno"
        ru: "когда кровь падуанцев окрасит болото"
      - pl: "\nI z nim popłynie aż pod mur Wicency."
        ru: "и с ним потечёт до самых стен Виченцы."
    words: { "przejętą": przejac, "żałuje": zalowac, "jarzmo": jarzmo, "karki": kark, "bagno": bagno, "popłynie": poplynac }
  - clean: "W Trewigo z dumą rządzi harde książę,\nNie wie, że zdrada już nań sieci wiąże.\nLud z Feltry płaczem jak klątwą uderza\nKrzywoprzysięstwo swojego Pasterza:\nPodobną zdradą nikt jemu nie sprostał,\nNikt się do Malty tak chytrze nie dostał."
    verse: true
    chunks:
      - pl: "W Trewigo z dumą rządzi harde książę,"
        ru: "В Тревизо с гордостью правит надменный князь,"
      - pl: "\nNie wie, że zdrada już nań sieci wiąże."
        ru: "не знает, что измена уже вяжет на него сети."
      - pl: "\nLud z Feltry płaczem jak klątwą uderza"
        ru: "Народ из Фельтре плачем, как проклятием, поражает"
      - pl: "\nKrzywoprzysięstwo swojego Pasterza:"
        ru: "клятвопреступление своего пастыря:"
        note: "krzywoprzysięstwo — клятвопреступление"
      - pl: "\nPodobną zdradą nikt jemu nie sprostał,"
        ru: "никто не сравнился с ним в подобной измене,"
      - pl: "\nNikt się do Malty tak chytrze nie dostał."
        ru: "никто так хитро не попал в Мальту."
        note: "тюрьма для клириков"
    words: { "dumą": duma, "rządzi": rzadzic, "wiąże": wiazac, "płaczem": placz, "klątwą": klatwa, "uderza": uderzac }
  - clean: "Któż widział kiedy kadź tak wielkiej miary,\nW jaką by ściekła cała krew Ferrary,\nCo będzie przez jej pasterza wylana\nW darze stronnictwu, hojność niesłychana!\nDar taki zawsze będzie zgodny z krajem,\nKtóry przyswoił zdradę obyczajem."
    verse: true
    chunks:
      - pl: "Któż widział kiedy kadź tak wielkiej miary,"
        ru: "Кто видел когда-нибудь чан такой великой меры,"
      - pl: "\nW jaką by ściekła cała krew Ferrary,"
        ru: "в который стекла бы вся кровь Феррары,"
      - pl: "\nCo będzie przez jej pasterza wylana"
        ru: "что будет пролита её пастырем"
      - pl: "\nW darze stronnictwu, hojność niesłychana!"
        ru: "в дар партии, — неслыханная щедрость!"
      - pl: "\nDar taki zawsze będzie zgodny z krajem,"
        ru: "Такой дар всегда будет согласен с краем,"
      - pl: "\nKtóry przyswoił zdradę obyczajem."
        ru: "который усвоил измену обычаем."
    words: { "miary": miara, "krew": krew, "wylana": wylac, "darze": dar, "zgodny": zgodny, "krajem": kraj }
  - clean: "Zwierciadła, które wy zowiecie Trony,\nTam wyżej stoją; od nich odstrzelony\nDuch boży na nas jako promień spływa,\nStąd mowa nasza szczera i prawdziwa».\nTu duch do swojej sfery się obrócił\nI znów Hosannę, zdało mi się, nucił."
