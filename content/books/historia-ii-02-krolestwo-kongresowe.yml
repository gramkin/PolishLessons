  - clean: "Zesłanie Mickiewicza okazało się dla niego niezwykłym doświadczeniem. Przez prawie pięć lat mieszkał w Petersburgu, Odessie i Moskwie, podróżował na Krym i poznał rosyjskie elity intelektualne. Zaprzyjaźnił się z wieloma rosyjskimi pisarzami, a przede wszystkim z Aleksandrem Puszkinem. Obaj poeci podziwiali się nawzajem: Puszkin tłumaczył wiersze Mickiewicza, a podobno, kiedy improwizował po francusku na przyjęciu, Puszkin zerwał się i zawołał: „Co za geniusz!” Mickiewicz poznał też przyszłych dekabrystów, którzy marzyli o wolnej Rosji, i opisał ich później z wielką sympatią. Na Krymie napisał cykl „Sonetów krymskich”, jedno z arcydzieł polskiej poezji. Później, po powstaniu listopadowym, drogi przyjaciół rozeszły się, bo każdy z nich stanął po stronie swojego narodu. Puszkin napisał wiersz „Oszczercom Rosji”, a Mickiewicz w „Ustępie” do „Dziadów” odpowiedział mu gorzkim wierszem „Do przyjaciół Moskali”."
    draft: true
    chunks:
      - pl: "Zesłanie Mickiewicza okazało się dla niego niezwykłym doświadczeniem."
        ru: "Ссылка оказалась для Мицкевича необыкновенным опытом."
