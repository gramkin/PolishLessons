  - clean: "Konstytucja, którą car nadał Królestwu w listopadzie 1815 roku, była jedną z najbardziej liberalnych w ówczesnej Europie. Gwarantowała wolność osobistą, wolność wyznania i wolność prasy, nietykalność majątku i to, że urzędnikami mogą być tylko Polacy. Językiem urzędowym był polski. Sejm składał się z senatu i izby poselskiej, a prawo wybierania posłów miało więcej ludzi niż we Francji: nie tylko szlachta, ale także zamożni mieszczanie, nauczyciele, lekarze i artyści. Królestwo miało własną armię, z polskimi mundurami i polskimi oficerami, wielu z nich weteranami wojen napoleońskich. Liczyła ona około trzydziestu tysięcy żołnierzy i była świetnie wyszkolona, a w Warszawie działała Szkoła Podchorążych, która kształciła przyszłych oficerów."
    draft: true
    chunks:
      - pl: "Konstytucja, którą car nadał Królestwu w listopadzie 1815 roku, była jedną z najbardziej liberalnych w ówczesnej Europie."
        ru: "Конституция, которую царь даровал Королевству в ноябре 1815 года, была одной из самых либеральных в тогдашней Европе."
      - pl: " Gwarantowała wolność osobistą, wolność wyznania i wolność prasy, nietykalność majątku i to, że urzędnikami mogą być tylko Polacy."
        ru: "Она гарантировала личную свободу, свободу вероисповедания и свободу печати, неприкосновенность имущества и то, что чиновниками могут быть только поляки."
        note: "nietykalność — неприкосновенность"
      - pl: " Językiem urzędowym był polski."
        ru: "Официальным языком был польский."
      - pl: " Sejm składał się z senatu i izby poselskiej, a prawo wybierania posłów miało więcej ludzi niż we Francji: nie tylko szlachta, ale także zamożni mieszczanie, nauczyciele, lekarze i artyści."
        ru: "Сейм состоял из сената и посольской палаты, а право выбирать послов имело больше людей, чем во Франции: не только шляхта, но и зажиточные горожане, учителя, врачи и художники."
      - pl: " Królestwo miało własną armię, z polskimi mundurami i polskimi oficerami, wielu z nich weteranami wojen napoleońskich."
        ru: "У Королевства была собственная армия с польскими мундирами и польскими офицерами, многие из которых были ветеранами наполеоновских войн."
      - pl: " Liczyła ona około trzydziestu tysięcy żołnierzy i była świetnie wyszkolona, a w Warszawie działała Szkoła Podchorążych, która kształciła przyszłych oficerów."
