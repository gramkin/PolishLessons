  - clean: "W 1822 roku Mickiewicz wydał w Wilnie pierwszy tomik poezji, „Ballady i romanse”. Ten skromny zbiór zapoczątkował w Polsce romantyzm. Mickiewicz pisał o duchach, czarach, ludowych wierzeniach i o miłości silniejszej niż śmierć. W balladzie „Romantyczność” przeciwstawił zimnemu rozumowi uczonego wiarę prostej dziewczyny, która widzi ducha zmarłego ukochanego. Kończył ją słynnym wezwaniem: „Miej serce i patrzaj w serce”. Młode pokolenie przyjęło nową poezję z entuzjazmem, a starsi krytycy, wychowani na klasycyzmie, z oburzeniem. Spór między romantykami a klasykami toczył się także w Warszawie, gdzie starsi pisarze i profesorowie uważali nową poezję za niesmaczną i barbarzyńską. W ciągu kilku lat romantyzm zwyciężył i stał się główną siłą polskiej kultury na całe stulecie."
