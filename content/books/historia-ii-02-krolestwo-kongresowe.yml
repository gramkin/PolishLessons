  - clean: "Jeszcze bujniej rozkwitało życie umysłowe w Wilnie. Uniwersytet Wileński, kierowany przez księcia Czartoryskiego, był wtedy największą uczelnią w Imperium Rosyjskim. Studiowało na nim kilkuset młodych ludzi z ziem litewskich i białoruskich, w większości synów drobnej szlachty. Wśród nich był młody Adam Mickiewicz, syn adwokata z Nowogródka. Razem z przyjaciółmi założył tajne Towarzystwo Filomatów, czyli miłośników wiedzy, które zajmowało się samokształceniem, literaturą i patriotyzmem. Filomaci byli młodzi, idealistyczni i niezbyt groźni dla władzy, ale dla carskiej policji każde tajne stowarzyszenie było spiskiem."
