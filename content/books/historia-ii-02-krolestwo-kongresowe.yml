  - clean: "Inaczej żyli Polacy w Wielkim Księstwie Poznańskim. Jego namiestnikiem został książę Antoni Radziwiłł, polski magnat, który ożenił się z pruską księżniczką i był przyjacielem rodziny królewskiej. Radziwiłł był też utalentowanym kompozytorem i jako jeden z pierwszych napisał muzykę do „Fausta” Goethego. Język polski był używany w urzędach i szkołach, a polska szlachta zachowała swoje majątki i wpływy. Władze pruskie stopniowo ograniczały jednak autonomię Księstwa i coraz chętniej osiedlały tam niemieckich urzędników i kolonistów. W 1829 roku hrabia Edward Raczyński założył w Poznaniu publiczną bibliotekę, która miała wspierać polską kulturę w zaborze pruskim i działa do dziś."
    draft: true
    chunks:
      - pl: "Inaczej żyli Polacy w Wielkim Księstwie Poznańskim."
        ru: "Иначе жили поляки в Великом княжестве Познанском."
      - pl: " Jego namiestnikiem został książę Antoni Radziwiłł, polski magnat, który ożenił się z pruską księżniczką i był przyjacielem rodziny królewskiej."
        ru: "Его наместником стал князь Антоний Радзивилл, польский магнат, женатый на прусской принцессе и друживший с королевской семьёй."
      - pl: " Radziwiłł był też utalentowanym kompozytorem i jako jeden z pierwszych napisał muzykę do „Fausta” Goethego."
        ru: "Радзивилл был также талантливым композитором и одним из первых написал музыку к «Фаусту» Гёте."
      - pl: " Język polski był używany w urzędach i szkołach, a polska szlachta zachowała swoje majątki i wpływy."
        ru: "Польский язык употреблялся в учреждениях и школах, а польская шляхта сохранила свои имения и влияние."
      - pl: " Władze pruskie stopniowo ograniczały jednak autonomię Księstwa i coraz chętniej osiedlały tam niemieckich urzędników i kolonistów."
        ru: "Однако прусские власти постепенно ограничивали автономию княжества и всё охотнее селили там немецких чиновников и колонистов."
      - pl: " W 1829 roku hrabia Edward Raczyński założył w Poznaniu publiczną bibliotekę, która miała wspierać polską kulturę w zaborze pruskim i działa do dziś."
        ru: "В 1829 году граф Эдвард Рачиньский основал в Познани публичную библиотеку, которая должна была поддерживать польскую культуру в прусской части и работает до сих пор."
    words: { "polska": polski, "polski": polski, "ożenił": ozenic, "księżniczką": ksiezniczka, "królewskiej": krolewski, "utalentowanym": utalentowany, "urzędach": urzad, "majątki": majatek, "niemieckich": niemiecki, "urzędników": urzednik, "hrabia": hrabia, "publiczną": publiczny, "bibliotekę": biblioteka, "wspierać": wspierac, "polską": polski, "kulturę": kultura }
  - clean: "Wolne Miasto Kraków było osobliwym tworem. Ta mała republika obejmowała miasto i ponad dwieście okolicznych wsi i miała własny senat, sejm i milicję. Formalnie była niezależna, ale w praktyce rządzili nią rezydenci trzech mocarstw, którzy pilnowali, by nie stała się ośrodkiem spisków. Kraków był dla Polaków przede wszystkim symbolem. Na Wawelu spoczywali królowie, a w katedrze pochowano teraz także narodowych bohaterów: księcia Józefa Poniatowskiego i Tadeusza Kościuszkę. W latach 1820–1823 mieszkańcy miasta i przybysze z całego kraju usypali na wzgórzu pod Krakowem wielki kopiec ku czci Kościuszki. Każdy, kto przyjeżdżał do Krakowa, przynosił garść ziemi, a praca przy kopcu stała się patriotycznym obowiązkiem. Kopiec Kościuszki stoi do dziś i rozciąga się z niego jeden z najpiękniejszych widoków na miasto."
    draft: true
    chunks:
      - pl: "Wolne Miasto Kraków było osobliwym tworem."
        ru: "Вольный город Краков был своеобразным образованием."
        note: "osobliwy — своеобразный; twór — образование, создание"
      - pl: " Ta mała republika obejmowała miasto i ponad dwieście okolicznych wsi i miała własny senat, sejm i milicję."
        ru: "Эта маленькая республика включала город и больше двухсот окрестных деревень и имела собственный сенат, сейм и милицию."
      - pl: " Formalnie była niezależna, ale w praktyce rządzili nią rezydenci trzech mocarstw, którzy pilnowali, by nie stała się ośrodkiem spisków."
        ru: "Формально она была независимой, но на практике ею управляли резиденты трёх держав, следившие, чтобы она не стала центром заговоров."
        note: "rezydent — резидент, представитель"
      - pl: " Kraków był dla Polaków przede wszystkim symbolem."
        ru: "Краков был для поляков прежде всего символом."
      - pl: " Na Wawelu spoczywali królowie, a w katedrze pochowano teraz także narodowych bohaterów: księcia Józefa Poniatowskiego i Tadeusza Kościuszkę."
        ru: "На Вавеле покоились короли, а в соборе теперь похоронили и национальных героев — князя Юзефа Понятовского и Тадеуша Костюшко."
      - pl: " W latach 1820–1823 mieszkańcy miasta i przybysze z całego kraju usypali na wzgórzu pod Krakowem wielki kopiec ku czci Kościuszki."
        ru: "В 1820–1823 годах жители города и приезжие со всей страны насыпали на холме под Краковом большой курган в честь Костюшко."
        note: "ku czci — в честь"
      - pl: " Każdy, kto przyjeżdżał do Krakowa, przynosił garść ziemi, a praca przy kopcu stała się patriotycznym obowiązkiem."
        ru: "Каждый, кто приезжал в Краков, приносил горсть земли, а работа на кургане стала патриотическим долгом."
        note: "garść — горсть"
      - pl: " Kopiec Kościuszki stoi do dziś i rozciąga się z niego jeden z najpiękniejszych widoków na miasto."
        ru: "Курган Костюшко стоит до сих пор, и с него открывается один из красивейших видов на город."
