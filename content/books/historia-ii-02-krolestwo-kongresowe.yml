  - clean: "W końcu osiągnięto kompromis. Z większej części Księstwa Warszawskiego utworzono Królestwo Polskie, połączone z Rosją osobą wspólnego monarchy: car rosyjski był jednocześnie królem polskim. Polacy nazywali je Królestwem Kongresowym, a potocznie Kongresówką. Zachodnia część Księstwa, z Poznaniem, przypadła Prusom jako Wielkie Księstwo Poznańskie, z pewną autonomią. Kraków z okolicami stał się Wolnym Miastem pod opieką trzech mocarstw. Była to maleńka republika, z własnym senatem i uniwersytetem, ostatni skrawek wolnej Polski. Galicja pozostała przy Austrii."
    draft: true
    chunks:
      - pl: "W końcu osiągnięto kompromis."
        ru: "В конце концов был достигнут компромисс."
      - pl: " Z większej części Księstwa Warszawskiego utworzono Królestwo Polskie, połączone z Rosją osobą wspólnego monarchy: car rosyjski był jednocześnie królem polskim."
        ru: "Из большей части Варшавского герцогства было создано Королевство Польское, связанное с Россией личностью общего монарха: российский царь был одновременно польским королём."
      - pl: " Polacy nazywali je Królestwem Kongresowym, a potocznie Kongresówką."
        ru: "Поляки называли его Конгрессовым королевством, а в просторечии — Конгресувкой."
        note: "potocznie — в просторечии"
      - pl: " Zachodnia część Księstwa, z Poznaniem, przypadła Prusom jako Wielkie Księstwo Poznańskie, z pewną autonomią."
        ru: "Западная часть герцогства с Познанью досталась Пруссии как Великое княжество Познанское с некоторой автономией."
      - pl: " Kraków z okolicami stał się Wolnym Miastem pod opieką trzech mocarstw."
        ru: "Краков с окрестностями стал Вольным городом под покровительством трёх держав."
      - pl: " Była to maleńka republika, z własnym senatem i uniwersytetem, ostatni skrawek wolnej Polski."
        ru: "Это была крошечная республика с собственным сенатом и университетом, последний клочок свободной Польши."
      - pl: " Galicja pozostała przy Austrii."
        ru: "Галиция осталась за Австрией."
    words: { "car": car, "rosyjski": rosyjski, "jednocześnie": jednoczesnie, "polskim": polski, "potocznie": potocznie, "Zachodnia": zachodni, "maleńka": malenki, "republika": republika, "senatem": senat, "uniwersytetem": uniwersytet, "Królestwo": krolestwo }
  - clean: "Królestwo Polskie było niewielkie: liczyło około stu dwudziestu ośmiu tysięcy kilometrów kwadratowych i ponad trzy miliony mieszkańców. Nie obejmowało ani Krakowa, ani Poznania, ani ziem litewskich i ruskich, które od rozbiorów wchodziły w skład Rosji. Polacy, którzy na tych ziemiach mieszkali, nazywali je ziemiami zabranymi i marzyli o ich połączeniu z Królestwem. Car obiecywał podobno, że kiedyś to zrobi. Na razie jednak Królestwo dostało coś, czego Polacy nie mieli od dwudziestu lat: własną konstytucję, własny sejm, własne wojsko i polskie urzędy."
    draft: true
    chunks:
      - pl: "Królestwo Polskie było niewielkie: liczyło około stu dwudziestu ośmiu tysięcy kilometrów kwadratowych i ponad trzy miliony mieszkańców."
        ru: "Королевство Польское было невелико: около ста двадцати восьми тысяч квадратных километров и больше трёх миллионов жителей."
      - pl: " Nie obejmowało ani Krakowa, ani Poznania, ani ziem litewskich i ruskich, które od rozbiorów wchodziły w skład Rosji."
        ru: "Оно не включало ни Кракова, ни Познани, ни литовских и русских земель, которые с разделов входили в состав России."
      - pl: " Polacy, którzy na tych ziemiach mieszkali, nazywali je ziemiami zabranymi i marzyli o ich połączeniu z Królestwem."
        ru: "Поляки, жившие на этих землях, называли их «забранными землями» и мечтали об их присоединении к Королевству."
        note: "ziemie zabrane — «забранные земли»"
      - pl: " Car obiecywał podobno, że kiedyś to zrobi."
        ru: "Царь будто бы обещал, что когда-нибудь это сделает."
      - pl: " Na razie jednak Królestwo dostało coś, czego Polacy nie mieli od dwudziestu lat: własną konstytucję, własny sejm, własne wojsko i polskie urzędy."
        ru: "Но пока Королевство получило то, чего у поляков не было двадцать лет: собственную конституцию, собственный сейм, собственное войско и польские учреждения."
