paragraphs:
  - clean: "Jesienią 1814 roku do Wiednia zjechali się cesarze, królowie, książęta i dyplomaci z całej Europy. Po upadku Napoleona chcieli na nowo ułożyć mapę kontynentu. Obrady kongresu wiedeńskiego trwały prawie rok i przerywane były niekończącymi się balami, koncertami i polowaniami. Jeden z uczestników zażartował, że kongres nie posuwa się naprzód, tylko tańczy. Jedną z najtrudniejszych spraw była sprawa polska. Losy Europy rozstrzygali przede wszystkim kanclerz austriacki Metternich, brytyjski minister Castlereagh, francuski dyplomata Talleyrand i sam car, który przyjechał do Wiednia osobiście. Polaków nikt nie pytał o zdanie, choć w Wiedniu przebywał książę Czartoryski, który jako doradca cara starał się wywalczyć dla kraju jak najwięcej. Car Aleksander I chciał zatrzymać prawie całe Księstwo Warszawskie, a Austria, Prusy i Wielka Brytania obawiały się zbytniego wzrostu potęgi rosyjskiej. Spór był tak ostry, że przez pewien czas groziła nawet nowa wojna."
    draft: true
    chunks:
      - pl: "Jesienią 1814 roku do Wiednia zjechali się cesarze, królowie, książęta i dyplomaci z całej Europy."
        ru: "Осенью 1814 года в Вену съехались императоры, короли, князья и дипломаты со всей Европы."
      - pl: " Po upadku Napoleona chcieli na nowo ułożyć mapę kontynentu."
        ru: "После падения Наполеона они хотели заново перекроить карту континента."
      - pl: " Obrady kongresu wiedeńskiego trwały prawie rok i przerywane były niekończącymi się balami, koncertami i polowaniami."
        ru: "Заседания Венского конгресса длились почти год и перемежались нескончаемыми балами, концертами и охотами."
      - pl: " Jeden z uczestników zażartował, że kongres nie posuwa się naprzód, tylko tańczy."
        ru: "Один из участников пошутил, что конгресс не движется вперёд, а танцует."
      - pl: " Jedną z najtrudniejszych spraw była sprawa polska."
        ru: "Одним из самых трудных вопросов был польский."
      - pl: " Losy Europy rozstrzygali przede wszystkim kanclerz austriacki Metternich, brytyjski minister Castlereagh, francuski dyplomata Talleyrand i sam car, który przyjechał do Wiednia osobiście."
        ru: "Судьбы Европы решали прежде всего австрийский канцлер Меттерних, британский министр Каслри, французский дипломат Талейран и сам царь, лично приехавший в Вену."
      - pl: " Polaków nikt nie pytał o zdanie, choć w Wiedniu przebywał książę Czartoryski, który jako doradca cara starał się wywalczyć dla kraju jak najwięcej."
        ru: "Мнения поляков никто не спрашивал, хотя в Вене находился князь Чарторыйский, который как советник царя старался добиться для страны как можно большего."
        note: "wywalczyć — добиться"
      - pl: " Car Aleksander I chciał zatrzymać prawie całe Księstwo Warszawskie, a Austria, Prusy i Wielka Brytania obawiały się zbytniego wzrostu potęgi rosyjskiej."
        ru: "Царь Александр I хотел оставить себе почти всё Варшавское герцогство, а Австрия, Пруссия и Великобритания опасались чрезмерного роста российской мощи."
      - pl: " Spór był tak ostry, że przez pewien czas groziła nawet nowa wojna."
        ru: "Спор был таким острым, что некоторое время грозила даже новая война."
