  - clean: "Dlaczego powstanie listopadowe upadło? Historycy wskazują kilka przyczyn. Przede wszystkim przewaga Rosji była ogromna: imperium miało kilkadziesiąt razy więcej ludności i mogło wystawiać kolejne armie. Przywódcy powstania, zwłaszcza na początku, nie wierzyli w zwycięstwo i zamiast walczyć, szukali porozumienia. Nie udało się porwać do walki chłopów, bo nikt nie dał im ziemi. A Europa, choć współczuła Polakom, nie zamierzała dla nich ryzykować wojny z Rosją. Niektórzy historycy dodają, że samo rozpoczęcie powstania było błędem, bo zniszczyło autonomię, którą Królestwo miało, a nie dało nic w zamian. Inni odpowiadają, że autonomia i tak była łamana i że Polacy nie mogli się zgodzić na to, by ich armia tłumiła rewolucje w Europie."
