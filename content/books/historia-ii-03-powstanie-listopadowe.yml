  - clean: "Ze sprawą rosyjską wiąże się jeszcze jedno ważne wydarzenie tamtych tygodni. W dniu detronizacji, 25 stycznia, w Warszawie odbyła się manifestacja ku czci straconych przywódców dekabrystów. Uczestnicy nieśli sztandar z napisem po polsku i po rosyjsku: „Za naszą i waszą wolność”. Hasło to miało wyrazić myśl, że Polacy walczą nie z narodem rosyjskim, lecz z despotyzmem, który uciska oba narody. Później stało się ono dewizą polskich ochotników, którzy walczyli o wolność innych narodów na całym świecie, od Węgier po Amerykę. W 1968 roku z tym samym hasłem wyszło na plac Czerwony w Moskwie ośmioro odważnych ludzi, protestujących przeciwko inwazji na Czechosłowację."
    draft: true
    chunks:
      - pl: "Ze sprawą rosyjską wiąże się jeszcze jedno ważne wydarzenie tamtych tygodni."
        ru: "С русским вопросом связано ещё одно важное событие тех недель."
      - pl: " W dniu detronizacji, 25 stycznia, w Warszawie odbyła się manifestacja ku czci straconych przywódców dekabrystów."
        ru: "В день низложения, 25 января, в Варшаве прошла манифестация в память казнённых вождей декабристов."
        note: "stracony — казнённый"
      - pl: " Uczestnicy nieśli sztandar z napisem po polsku i po rosyjsku: „Za naszą i waszą wolność”."
        ru: "Участники несли знамя с надписью по-польски и по-русски: «За нашу и вашу свободу»."
      - pl: " Hasło to miało wyrazić myśl, że Polacy walczą nie z narodem rosyjskim, lecz z despotyzmem, który uciska oba narody."
        ru: "Этот лозунг должен был выразить мысль, что поляки воюют не с русским народом, а с деспотизмом, угнетающим оба народа."
        note: "despotyzm — деспотизм; uciskać — угнетать"
      - pl: " Później stało się ono dewizą polskich ochotników, którzy walczyli o wolność innych narodów na całym świecie, od Węgier po Amerykę."
        ru: "Позже он стал девизом польских добровольцев, сражавшихся за свободу других народов по всему миру — от Венгрии до Америки."
        note: "dewiza — девиз"
      - pl: " W 1968 roku z tym samym hasłem wyszło na plac Czerwony w Moskwie ośmioro odważnych ludzi, protestujących przeciwko inwazji na Czechosłowację."
        ru: "В 1968 году с тем же лозунгом вышли на Красную площадь в Москве восемь смелых людей, протестовавших против вторжения в Чехословакию."
