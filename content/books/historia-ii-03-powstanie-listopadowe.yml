  - clean: "Lata rządów Paskiewicza nazywa się w Polsce nocą paskiewiczowską. Cenzura była niezwykle surowa, z książek usuwano nawet niewinne wzmianki o wolności i ojczyźnie, a za posiadanie zakazanej poezji można było trafić na Syberię. Mimo to konspiracja nie ustawała. Emisariusz emigracji Szymon Konarski przez kilka lat tworzył tajne organizacje na Litwie i Wołyniu, zanim w 1839 roku został aresztowany i rozstrzelany w Wilnie. Według legendy przed śmiercią jeden z rosyjskich oficerów, który zakochał się w jego idei wolności, próbował go uwolnić i sam za to trafił na zesłanie. Konarski stał się dla młodego pokolenia symbolem ofiary i nadziei."
