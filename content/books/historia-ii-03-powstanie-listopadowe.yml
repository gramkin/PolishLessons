  - clean: "Władzę przejęli doświadczeni politycy, którzy wcale nie chcieli powstania. Książę Lubecki i książę Czartoryski liczyli, że uda się porozumieć z carem: uspokoić kraj w zamian za przestrzeganie konstytucji i przyłączenie ziem zabranych. Na dyktatora wybrano generała Józefa Chłopickiego, słynnego bohatera wojen napoleońskich, którego wojsko i ludność darzyły wielkim szacunkiem. Chłopicki uważał jednak, że wojna z Rosją jest beznadziejna, i za wszelką cenę chciał jej uniknąć. Wysłał do Petersburga posłów z propozycjami porozumienia. Paradoksem było to, że powstanie mogło się utrzymać w dużej mierze dzięki pracy księcia Lubeckiego. Pieniądze, które zgromadził w skarbie Królestwa, i fabryki broni, które powstały za jego rządów, służyły teraz do walki z carem. Sam Lubecki, który był przeciwnikiem powstania, pojechał do Petersburga jako poseł i już nigdy nie wrócił do Warszawy. Został w Rosji, gdzie zrobił dalszą karierę w administracji carskiej."
    draft: true
    chunks:
      - pl: "Władzę przejęli doświadczeni politycy, którzy wcale nie chcieli powstania."
        ru: "Власть взяли в свои руки опытные политики, которые вовсе не хотели восстания."
      - pl: " Książę Lubecki i książę Czartoryski liczyli, że uda się porozumieć z carem: uspokoić kraj w zamian za przestrzeganie konstytucji i przyłączenie ziem zabranych."
        ru: "Князь Любецкий и князь Чарторыйский рассчитывали, что удастся договориться с царём: успокоить страну в обмен на соблюдение конституции и присоединение «забранных земель»."
      - pl: " Na dyktatora wybrano generała Józefa Chłopickiego, słynnego bohatera wojen napoleońskich, którego wojsko i ludność darzyły wielkim szacunkiem."
        ru: "Диктатором избрали генерала Юзефа Хлопицкого, знаменитого героя наполеоновских войн, которого войско и население глубоко уважали."
        note: "darzyć szacunkiem — относиться с уважением"
      - pl: " Chłopicki uważał jednak, że wojna z Rosją jest beznadziejna, i za wszelką cenę chciał jej uniknąć."
        ru: "Однако Хлопицкий считал войну с Россией безнадёжной и любой ценой хотел её избежать."
        note: "za wszelką cenę — любой ценой"
      - pl: " Wysłał do Petersburga posłów z propozycjami porozumienia."
        ru: "Он отправил в Петербург послов с предложениями соглашения."
      - pl: " Paradoksem było to, że powstanie mogło się utrzymać w dużej mierze dzięki pracy księcia Lubeckiego."
        ru: "Парадокс состоял в том, что восстание могло держаться во многом благодаря трудам князя Любецкого."
      - pl: " Pieniądze, które zgromadził w skarbie Królestwa, i fabryki broni, które powstały za jego rządów, służyły teraz do walki z carem."
        ru: "Деньги, которые он накопил в казне Королевства, и оружейные фабрики, появившиеся при его управлении, служили теперь борьбе с царём."
      - pl: " Sam Lubecki, który był przeciwnikiem powstania, pojechał do Petersburga jako poseł i już nigdy nie wrócił do Warszawy."
        ru: "Сам Любецкий, противник восстания, поехал в Петербург послом и больше никогда не вернулся в Варшаву."
      - pl: " Został w Rosji, gdzie zrobił dalszą karierę w administracji carskiej."
        ru: "Он остался в России, где продолжил карьеру в царской администрации."
