level: B2
paragraphs:
  - clean: "Wieczorem 29 listopada 1830 roku Piotr Wysocki wszedł do sali Szkoły Podchorążych w Łazienkach i zawołał: „Polacy, godzina zemsty wybiła!” Sygnałem do rozpoczęcia powstania miał być pożar browaru na Solcu, ale podpalono go za wcześnie i spiskowcy działali w zamieszaniu. Grupa podchorążych i studentów wtargnęła do Belwederu, żeby pojmać wielkiego księcia Konstantego. Wśród atakujących byli dwaj młodzi poeci, Seweryn Goszczyński i Ludwik Nabielak, którzy chcieli nie tylko pisać o wolności, ale też o nią walczyć. Książę zdążył się ukryć: według tradycji zamknął się w pokoju na poddaszu, a spiskowcy, nie znając pałacu, nie znaleźli go. Zginęło kilku jego urzędników i oficerów."
    draft: true
    chunks:
      - pl: "Wieczorem 29 listopada 1830 roku Piotr Wysocki wszedł do sali Szkoły Podchorążych w Łazienkach i zawołał: „Polacy, godzina zemsty wybiła!”"
        ru: "Вечером 29 ноября 1830 года Пётр Высоцкий вошёл в зал Школы подхорунжих в Лазенках и воскликнул: «Поляки, пробил час мщения!»"
        note: "zemsta — месть; wybić — пробить (о часах)"
      - pl: " Sygnałem do rozpoczęcia powstania miał być pożar browaru na Solcu, ale podpalono go za wcześnie i spiskowcy działali w zamieszaniu."
        ru: "Сигналом к началу восстания должен был стать пожар пивоварни на Сольце, но её подожгли слишком рано, и заговорщики действовали в суматохе."
        note: "browar — пивоварня; zamieszanie — суматоха"
      - pl: " Grupa podchorążych i studentów wtargnęła do Belwederu, żeby pojmać wielkiego księcia Konstantego."
        ru: "Группа подхорунжих и студентов ворвалась в Бельведер, чтобы схватить великого князя Константина."
        note: "wtargnąć — ворваться; pojmać — схватить"
      - pl: " Wśród atakujących byli dwaj młodzi poeci, Seweryn Goszczyński i Ludwik Nabielak, którzy chcieli nie tylko pisać o wolności, ale też o nią walczyć."
        ru: "Среди нападавших были два молодых поэта, Северин Гощинский и Людвик Набеляк, которые хотели не только писать о свободе, но и бороться за неё."
      - pl: " Książę zdążył się ukryć: według tradycji zamknął się w pokoju na poddaszu, a spiskowcy, nie znając pałacu, nie znaleźli go."
        ru: "Князь успел спрятаться: по преданию, он заперся в комнате на чердаке, а заговорщики, не зная дворца, не нашли его."
        note: "poddasze — чердак, мансарда"
      - pl: " Zginęło kilku jego urzędników i oficerów."
        ru: "Погибли несколько его чиновников и офицеров."
    words: { "listopada": listopad, "zawołał": zawolac, "zemsty": zemsta, "wybiła": wybic, "pożar": pozar, "podpalono": podpalic, "studentów": student, "atakujących": atakowac, "poeci": poeta, "zdążył": zdazyc, "tradycji": tradycja, "pałacu": palac, "urzędników": urzednik }
  - clean: "Tymczasem podchorążowie ruszyli do centrum miasta, wzywając po drodze żołnierzy i mieszkańców do walki. Większość wyższych oficerów odmówiła przyłączenia się do powstania. Byli to często starzy generałowie napoleońscy, którzy uważali spisek za szaleństwo i dochowywali wierności przysiędze złożonej carowi. Kilku z nich, w tym ministra wojny, zabito tej nocy na ulicach. Był to tragiczny początek: Polacy zabijali Polaków, i to bohaterów dawnych wojen. Do powstańców przyłączyły się jednak tłumy mieszkańców Warszawy, które opanowały arsenał i rozebrały broń. Rano miasto było w rękach powstańców."
    draft: true
    chunks:
      - pl: "Tymczasem podchorążowie ruszyli do centrum miasta, wzywając po drodze żołnierzy i mieszkańców do walki."
        ru: "Тем временем подхорунжие двинулись в центр города, по дороге призывая солдат и жителей к борьбе."
      - pl: " Większość wyższych oficerów odmówiła przyłączenia się do powstania."
        ru: "Большинство старших офицеров отказались присоединиться к восстанию."
      - pl: " Byli to często starzy generałowie napoleońscy, którzy uważali spisek za szaleństwo i dochowywali wierności przysiędze złożonej carowi."
        ru: "Это были часто старые наполеоновские генералы, которые считали заговор безумием и хранили верность присяге, данной царю."
        note: "szaleństwo — безумие; dochować wierności — сохранить верность"
      - pl: " Kilku z nich, w tym ministra wojny, zabito tej nocy na ulicach."
        ru: "Нескольких из них, в том числе военного министра, убили той ночью на улицах."
      - pl: " Był to tragiczny początek: Polacy zabijali Polaków, i to bohaterów dawnych wojen."
        ru: "Это было трагическое начало: поляки убивали поляков, и к тому же героев прежних войн."
      - pl: " Do powstańców przyłączyły się jednak tłumy mieszkańców Warszawy, które opanowały arsenał i rozebrały broń."
        ru: "Однако к повстанцам присоединились толпы варшавян, которые захватили арсенал и разобрали оружие."
        note: "rozebrać — разобрать"
      - pl: " Rano miasto było w rękach powstańców."
        ru: "К утру город был в руках повстанцев."
    words: { "Tymczasem": tymczasem, "wzywając": wzywac, "mieszkańców": mieszkaniec, "spisek": spisek, "przysiędze": przysiega, "carowi": car, "ministra": minister, "tragiczny": tragiczny, "przyłączyły": przylaczyc, "tłumy": tlum, "opanowały": opanowac, "rozebrały": rozebrac }
  - clean: "Wielki książę Konstanty mógł łatwo stłumić powstanie, bo miał pod Warszawą kilka tysięcy żołnierzy rosyjskich. Nie zrobił tego. Powiedział podobno, że to sprawa Polaków i Polacy muszą ją sami załatwić. Może nie chciał przelewać krwi wojska, które sam zbudował i do którego był przywiązany, a może nie docenił siły powstania. Po kilku dniach opuścił Królestwo razem z wojskami rosyjskimi i tymi oddziałami polskimi, które pozostały mu wierne. Zabrał ze sobą także więźnia Waleriana Łukasińskiego. Polacy znaleźli się w sytuacji, której nikt nie przewidział: mieli w rękach państwo i armię, ale nie mieli planu."
    draft: true
    chunks:
      - pl: "Wielki książę Konstanty mógł łatwo stłumić powstanie, bo miał pod Warszawą kilka tysięcy żołnierzy rosyjskich."
        ru: "Великий князь Константин мог легко подавить восстание, потому что под Варшавой у него было несколько тысяч русских солдат."
      - pl: " Nie zrobił tego."
        ru: "Он этого не сделал."
      - pl: " Powiedział podobno, że to sprawa Polaków i Polacy muszą ją sami załatwić."
        ru: "Он будто бы сказал, что это дело поляков и поляки должны решить его сами."
      - pl: " Może nie chciał przelewać krwi wojska, które sam zbudował i do którego był przywiązany, a może nie docenił siły powstania."
        ru: "Может быть, он не хотел проливать кровь войска, которое сам создал и к которому был привязан, а может быть, недооценил силу восстания."
        note: "docenić — оценить; nie docenić — недооценить"
      - pl: " Po kilku dniach opuścił Królestwo razem z wojskami rosyjskimi i tymi oddziałami polskimi, które pozostały mu wierne."
        ru: "Через несколько дней он покинул Королевство вместе с русскими войсками и теми польскими частями, что остались ему верны."
      - pl: " Zabrał ze sobą także więźnia Waleriana Łukasińskiego."
        ru: "С собой он увёз и узника Валериана Лукасиньского."
      - pl: " Polacy znaleźli się w sytuacji, której nikt nie przewidział: mieli w rękach państwo i armię, ale nie mieli planu."
        ru: "Поляки оказались в ситуации, которую никто не предвидел: в их руках были государство и армия, но не было плана."
