  - clean: "Wiadomość o upadku Warszawy wstrząsnęła Europą. Francuski minister spraw zagranicznych powiedział w parlamencie zdanie, które przeszło do historii jako symbol cynizmu wielkiej polityki: „Porządek panuje w Warszawie”. Zwykli ludzie na Zachodzie myśleli jednak inaczej. W Niemczech, we Francji i w Anglii powstanie listopadowe wywołało falę sympatii dla Polaków. W Paryżu sędziwy generał Lafayette, bohater rewolucji amerykańskiej i francuskiej, przewodniczył komitetowi pomocy dla Polaków. W wielu miastach zbierano pieniądze dla powstańców, organizowano koncerty i wiece. Francuski poeta Casimir Delavigne napisał na cześć powstania pieśń „Warszawianka”, do której muzykę skomponował Karol Kurpiński. Polscy żołnierze śpiewali ją, idąc do boju, a jej słowa wzywały, by Polacy powstali do walki o wolność. Nie należy jej mylić z inną „Warszawianką”, pieśnią robotniczą z końca XIX wieku, znaną także w Rosji. Niemieccy poeci pisali tak zwane pieśni polskie, a kiedy pokonani polscy żołnierze maszerowali przez Niemcy na emigrację, mieszkańcy miast witali ich jak bohaterów, urządzali na ich cześć bankiety i dawali im schronienie. W Stuttgarcie młody Chopin, który dowiedział się o upadku Warszawy w czasie podróży, zanotował w dzienniku rozpaczliwe słowa i podobno właśnie wtedy skomponował etiudę, nazywaną później Rewolucyjną."
