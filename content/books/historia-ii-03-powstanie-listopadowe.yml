  - clean: "Na początku lutego 1831 roku do Królestwa wkroczyła ponad stutysięczna armia rosyjska pod dowództwem feldmarszałka Iwana Dybicza. Armia polska była o połowę mniejsza, ale dobrze wyszkolona i pełna zapału. 25 lutego pod Olszynką Grochowską, na przedpolach Warszawy, doszło do wielkiej bitwy. Przez cały dzień Polacy bronili niewielkiego lasku olszowego przed atakami przeważających sił rosyjskich. Chłopicki, który walczył jako zwykły ochotnik, został ciężko ranny. Pod koniec dnia wojsko polskie wycofało się na Pragę, ale Rosjanie, którzy też ponieśli ogromne straty, nie odważyli się atakować Warszawy."
    draft: true
    chunks:
      - pl: "Na początku lutego 1831 roku do Królestwa wkroczyła ponad stutysięczna armia rosyjska pod dowództwem feldmarszałka Iwana Dybicza."
        ru: "В начале февраля 1831 года в Королевство вступила более чем стотысячная русская армия под командованием фельдмаршала Ивана Дибича."
        note: "feldmarszałek — фельдмаршал"
