      - pl: " Chłopicki złożył dyktaturę."
        ru: "Хлопицкий сложил с себя диктатуру."
      - pl: " W styczniu 1831 roku sejm zebrany w Warszawie podjął decyzję, która przekreślała wszelkie szanse porozumienia."
        ru: "В январе 1831 года сейм, собравшийся в Варшаве, принял решение, перечеркнувшее все шансы на соглашение."
      - pl: " 25 stycznia, po burzliwej dyskusji, jeden z posłów zawołał: „Nie ma Mikołaja!”, a sejm jednogłośnie ogłosił detronizację cara jako króla Polski."
        ru: "25 января после бурного обсуждения один из послов воскликнул: «Нет Николая!», и сейм единогласно объявил о низложении царя как польского короля."
        note: "detronizacja — низложение"
      - pl: " Od tej chwili wojna była nieunikniona."
