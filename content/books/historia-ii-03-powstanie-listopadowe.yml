  - clean: "Represje były surowe. Uczestników powstania skazywano na śmierć, katorgę i zesłanie na Syberię, a tysiące żołnierzy wcielono przymusowo do armii rosyjskiej i wysłano na Kaukaz. Na Kaukazie wielu z nich zginęło w wojnie z góralami, niektórzy uciekali do walczących o wolność Czerkiesów, a inni zostawili cenne opisy kraju i jego ludów. Skonfiskowano majątki tysięcy rodzin szlacheckich, zwłaszcza na Litwie i Rusi, i rozdano je rosyjskim urzędnikom i generałom. Na ziemiach zabranych władze zlikwidowały w 1839 roku Kościół greckokatolicki i siłą przyłączyły unitów do Cerkwi prawosławnej. Zamknięto wiele klasztorów i szkół. Dzieci osób zesłanych zabierano czasem rodzicom i wysyłano do szkół wojskowych w głębi Rosji."
