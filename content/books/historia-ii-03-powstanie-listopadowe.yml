  - clean: "Mikołaj I nie zamierzał negocjować z buntownikami. Zażądał bezwarunkowego poddania się i zapowiedział, że jeśli Polacy będą stawiać opór, Polska zostanie zniszczona. Chłopicki złożył dyktaturę. W styczniu 1831 roku sejm zebrany w Warszawie podjął decyzję, która przekreślała wszelkie szanse porozumienia. 25 stycznia, po burzliwej dyskusji, jeden z posłów zawołał: „Nie ma Mikołaja!”, a sejm jednogłośnie ogłosił detronizację cara jako króla Polski. Od tej chwili wojna była nieunikniona. Szefem nowego Rządu Narodowego został książę Adam Czartoryski."
    draft: true
    chunks:
      - pl: "Mikołaj I nie zamierzał negocjować z buntownikami."
        ru: "Николай I не собирался вести переговоры с бунтовщиками."
