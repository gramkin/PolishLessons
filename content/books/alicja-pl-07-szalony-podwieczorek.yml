chapter: 7
chapterTitle: Szalony podwieczorek
chapterTitleRu: Безумное чаепитие
level: B1
paragraphs:
  - clean: "Pod drzewem przed domem stał nakryty stół, a Zając Marcowy i Kapelusznik pili przy nim herbatę: między nimi siedział Suseł, pogrążony w głębokim śnie, a tamci dwaj używali go jako poduszki, opierając na nim łokcie i rozmawiając ponad jego głową. „Bardzo niewygodnie dla Susła”, pomyślała Alicja; „tyle że skoro śpi, to chyba mu to nie przeszkadza.”"
    en: "There was a table set out under a tree in front of the house, and the March Hare and the Hatter were having tea at it: a Dormouse was sitting between them, fast asleep, and the other two were using it as a cushion, resting their elbows on it, and talking over its head. “Very uncomfortable for the Dormouse,” thought Alice; “only, as it’s asleep, I suppose it doesn’t mind.”"
    chunks:
      - pl: "Pod drzewem przed domem stał nakryty stół,"
        ru: "Под деревом перед домом стоял накрытый стол,"
        note: "nakryty stół — накрытый стол"
      - pl: " a Zając Marcowy i Kapelusznik pili przy nim herbatę:"
        ru: "а Мартовский Заяц и Шляпник пили за ним чай:"
        note: "pić herbatę — пить чай"
      - pl: " między nimi siedział Suseł, pogrążony w głębokim śnie,"
        ru: "между ними сидел Соня, погружённый в глубокий сон,"
        note: "pogrążony w czymś — погружённый во что-л.: w и предложный"
      - pl: " a tamci dwaj używali go jako poduszki, opierając na nim łokcie i rozmawiając ponad jego głową."
        ru: "а те двое использовали его как подушку, опирая на него локти и разговаривая поверх его головы."
        note: "używać czegoś jako czegoś — использовать что-л. в качестве чего-л."
      - pl: " „Bardzo niewygodnie dla Susła”, pomyślała Alicja;"
        ru: "«Очень неудобно для Сони», — подумала Алиса;"
        note: "Suseł — соня (грызун): в косвенных падежах Susła"
      - pl: " „tyle że skoro śpi, to chyba mu to nie przeszkadza.”"
        ru: "«только раз он спит, то, наверно, ему это не мешает.»"
        note: "przeszkadzać komuś — мешать кому-л.: дательный падеж"
    words: { "drzewem": drzewo, "stół": stol, "pili": pic, "herbatę": herbata, "siedział": siedziec, "głębokim": gleboki, "śnie": sen, "tamci": tamten, "używali": uzywac, "rozmawiając": rozmawiac, "głową": glowa, "pomyślała": pomyslec, "tyle": tyl, "skoro": skoro, "śpi": spac, "przeszkadza": przeszkadzac }
  - clean: "Stół był duży, ale wszyscy trzej stłoczyli się w jednym jego rogu: „Nie ma miejsca! Nie ma miejsca!”, zawołali, gdy zobaczyli nadchodzącą Alicję. „Miejsca jest mnóstwo!”, powiedziała z oburzeniem Alicja i usiadła w wielkim fotelu na końcu stołu."
    en: "The table was a large one, but the three were all crowded together at one corner of it: “No room! No room!” they cried out when they saw Alice coming. “There’s _plenty_ of room!” said Alice indignantly, and she sat down in a large arm-chair at one end of the table."
    chunks:
      - pl: "Stół był duży, ale wszyscy trzej stłoczyli się w jednym jego rogu:"
        ru: "Стол был большой, но все трое сгрудились в одном его углу:"
        note: "wszyscy trzej — все трое: мужская личная форма"
      - pl: " „Nie ma miejsca! Nie ma miejsca!”, zawołali, gdy zobaczyli nadchodzącą Alicję."
        ru: "«Нет места! Нет места!» — закричали они, когда увидели подходящую Алису."
        note: "nie ma miejsca — нет места: при отрицании родительный падеж"
      - pl: " „Miejsca jest mnóstwo!”, powiedziała z oburzeniem Alicja"
        ru: "«Места сколько угодно!» — с возмущением сказала Алиса"
        note: "mnóstwo czegoś — множество чего-л.: родительный падеж"
      - pl: " i usiadła w wielkim fotelu na końcu stołu."
        ru: "и села в большое кресло на конце стола."
        note: "usiąść w fotelu — сесть в кресло"
    words: { "wszyscy": wszyscy, "rogu": rog, "zawołali": zawolac, "nadchodzącą": nadchodzic, "mnóstwo": mnostwo, "usiadła": usiasc }
  - clean: "„Napij się wina”, powiedział Zając Marcowy zachęcającym tonem."
    en: "“Have some wine,” the March Hare said in an encouraging tone."
    chunks:
      - pl: "„Napij się wina”, powiedział Zając Marcowy zachęcającym tonem."
        ru: "«Выпей вина», — сказал Мартовский Заяц ободряющим тоном."
        note: "napić się czegoś — выпить чего-л.: родительный падеж"
    words: { "Napij": napic, "wina": wina, "tonem": ton }
  - clean: "Alicja rozejrzała się po całym stole, ale nie było na nim nic prócz herbaty. „Nie widzę żadnego wina”, zauważyła."
    en: "Alice looked all round the table, but there was nothing on it but tea. “I don’t see any wine,” she remarked."
    chunks:
      - pl: "Alicja rozejrzała się po całym stole, ale nie było na nim nic prócz herbaty."
        ru: "Алиса оглядела весь стол, но на нём не было ничего кроме чая."
        note: "prócz czegoś — кроме чего-л.: родительный падеж"
      - pl: " „Nie widzę żadnego wina”, zauważyła."
        ru: "«Я не вижу никакого вина», — заметила она."
        note: "nie widzę żadnego — не вижу никакого: двойное отрицание обязательно"
    words: { "zauważyła": zauwazyc }
  - clean: "„Bo go nie ma”, powiedział Zając Marcowy."
    en: "“There isn’t any,” said the March Hare."
    chunks:
      - pl: "„Bo go nie ma”, powiedział Zając Marcowy."
        ru: "«Потому что его и нет», — сказал Мартовский Заяц."
        note: "nie ma go — его нет: родительный падеж при отрицании"
  - clean: "„W takim razie nieuprzejmie było je proponować”, powiedziała gniewnie Alicja."
    en: "“Then it wasn’t very civil of you to offer it,” said Alice angrily."
    chunks:
      - pl: "„W takim razie nieuprzejmie było je proponować”, powiedziała gniewnie Alicja."
        ru: "«В таком случае было невежливо его предлагать», — сердито сказала Алиса."
        note: "nieuprzejmie — невежливо"
  - clean: "„Nieuprzejmie było siadać bez zaproszenia”, powiedział Zając Marcowy."
    en: "“It wasn’t very civil of you to sit down without being invited,” said the March Hare."
    chunks:
      - pl: "„Nieuprzejmie było siadać bez zaproszenia”, powiedział Zając Marcowy."
        ru: "«Было невежливо садиться без приглашения», — сказал Мартовский Заяц."
        note: "bez zaproszenia — без приглашения: bez и родительный"
    words: { "siadać": siadac, "zaproszenia": zaprosic }
  - clean: "„Nie wiedziałam, że to twój stół”, powiedziała Alicja; „jest nakryty dla o wiele więcej niż trzech.”"
    en: "“I didn’t know it was _your_ table,” said Alice; “it’s laid for a great many more than three.”"
    chunks:
      - pl: "„Nie wiedziałam, że to twój stół”, powiedziała Alicja;"
        ru: "«Я не знала, что это твой стол», — сказала Алиса;"
        note: "wiedzieć, że — знать, что"
      - pl: " „jest nakryty dla o wiele więcej niż trzech.”"
        ru: "«он накрыт куда больше чем на троих.»"
        note: "o wiele więcej — гораздо больше"
    words: { "więcej": wiecej }
  - clean: "„Trzeba ci ostrzyc włosy”, powiedział Kapelusznik. Przyglądał się Alicji już od dłuższego czasu z wielką ciekawością i to były jego pierwsze słowa."
    en: "“Your hair wants cutting,” said the Hatter. He had been looking at Alice for some time with great curiosity, and this was his first speech."
    chunks:
      - pl: "„Trzeba ci ostrzyc włosy”, powiedział Kapelusznik."
        ru: "«Тебе надо постричься», — сказал Шляпник."
        note: "trzeba komuś coś zrobić — кому-л. нужно что-л. сделать: дательный падеж"
      - pl: " Przyglądał się Alicji już od dłuższego czasu z wielką ciekawością i to były jego pierwsze słowa."
        ru: "Он уже долгое время разглядывал Алису с большим любопытством, и это были его первые слова."
        note: "przyglądać się komuś — разглядывать кого-л.: дательный падеж"
    words: { "Trzeba": trzeba, "włosy": wlosy, "dłuższego": dlugi, "były": byly, "słowa": slowo }
  - clean: "„Powinieneś się nauczyć, że nie robi się osobistych uwag”, powiedziała Alicja z pewną surowością; „to bardzo niegrzeczne.”"
    en: "“You should learn not to make personal remarks,” Alice said with some severity; “it’s very rude.”"
    chunks:
      - pl: "„Powinieneś się nauczyć, że nie robi się osobistych uwag”, powiedziała Alicja z pewną surowością;"
        ru: "«Тебе следует научиться не делать личных замечаний», — сказала Алиса с некоторой строгостью;"
        note: "nie robi się — не делают: безличная возвратная форма"
      - pl: " „to bardzo niegrzeczne.”"
        ru: "«это очень невежливо.»"
        note: "niegrzeczny — невежливый, невоспитанный"
    words: { "nauczyć": nauczyc, "osobistych": osobisty, "uwag": uwaga, "pewną": pewien }
  - clean: "Kapelusznik na te słowa szeroko otworzył oczy; ale powiedział tylko: „Czym kruk przypomina biurko?”"
    en: "The Hatter opened his eyes very wide on hearing this; but all he _said_ was, “Why is a raven like a writing-desk?”"
    chunks:
      - pl: "Kapelusznik na te słowa szeroko otworzył oczy; ale powiedział tylko: „Czym kruk przypomina biurko?”"
        ru: "Шляпник на эти слова широко раскрыл глаза; но сказал только: «Чем ворон похож на письменный стол?»"
        note: "przypominać coś — напоминать что-л.; czym — чем: творительный падеж"
    words: { "otworzył": otworzyc, "przypomina": przypominac, "biurko": biurko }
  - clean: "„No, teraz będzie zabawa!”, pomyślała Alicja. „Cieszę się, że zaczęli zadawać zagadki. — Chyba potrafię to odgadnąć”, dodała na głos."
    en: "“Come, we shall have some fun now!” thought Alice. “I’m glad they’ve begun asking riddles.—I believe I can guess that,” she added aloud."
    chunks:
      - pl: "„No, teraz będzie zabawa!”, pomyślała Alicja."
        ru: "«Ну, теперь будет весело!» — подумала Алиса."
        note: "będzie zabawa — будет весело"
      - pl: " „Cieszę się, że zaczęli zadawać zagadki."
        ru: "«Я рада, что они начали загадывать загадки."
        note: "zadawać zagadki — загадывать загадки"
      - pl: " — Chyba potrafię to odgadnąć”, dodała na głos."
        ru: "— Пожалуй, я сумею её отгадать», — добавила она вслух."
        note: "odgadnąć — отгадать"
    words: { "zabawa": zabawa, "Cieszę": cieszyc, "zadawać": zadawac, "zagadki": zagadka, "potrafię": potrafic, "dodała": dodac, "głos": glos }
  - clean: "„Chcesz powiedzieć, że sądzisz, iż potrafisz znaleźć na to odpowiedź?”, spytał Zając Marcowy."
    en: "“Do you mean that you think you can find out the answer to it?” said the March Hare."
    chunks:
      - pl: "„Chcesz powiedzieć, że sądzisz, iż potrafisz znaleźć na to odpowiedź?”, spytał Zając Marcowy."
        ru: "«Ты хочешь сказать, что считаешь, будто сумеешь найти на неё ответ?» — спросил Мартовский Заяц."
        note: "iż — что: книжный синоним że"
    words: { "sądzisz": sadzic, "odpowiedź": odpowiedz }
  - clean: "„Właśnie tak”, powiedziała Alicja."
    en: "“Exactly so,” said Alice."
    chunks:
      - pl: "„Właśnie tak”, powiedziała Alicja."
        ru: "«Именно так», — сказала Алиса."
        note: "właśnie tak — именно так"
  - clean: "„To powinnaś mówić to, co myślisz”, ciągnął Zając Marcowy."
    en: "“Then you should say what you mean,” the March Hare went on."
    chunks:
      - pl: "„To powinnaś mówić to, co myślisz”, ciągnął Zając Marcowy."
        ru: "«Тогда тебе следует говорить то, что думаешь», — продолжал Мартовский Заяц."
        note: "powinnaś — тебе следует: женская форма powinien"
  - clean: "„Mówię”, odparła pospiesznie Alicja; „to znaczy… to znaczy mówię to, co myślę — a to przecież to samo.”"
    en: "“I do,” Alice hastily replied; “at least—at least I mean what I say—that’s the same thing, you know.”"
    chunks:
      - pl: "„Mówię”, odparła pospiesznie Alicja;"
        ru: "«Я и говорю», — поспешно ответила Алиса;"
        note: "odparła — ответила: книжный синоним odpowiedziała"
      - pl: " „to znaczy… to znaczy mówię to, co myślę — a to przecież to samo.”"
        ru: "«то есть… то есть я говорю то, что думаю, — а это ведь одно и то же.»"
        note: "to samo — то же самое"
    words: { "odparła": odeprzec }
  - clean: "„Wcale nie to samo!”, powiedział Kapelusznik. „Równie dobrze mogłabyś powiedzieć, że «widzę, co jem» to to samo co «jem, co widzę»!”"
    en: "“Not the same thing a bit!” said the Hatter. “You might just as well say that ‘I see what I eat’ is the same thing as ‘I eat what I see’!”"
    chunks:
      - pl: "„Wcale nie to samo!”, powiedział Kapelusznik."
        ru: "«Вовсе не одно и то же!» — сказал Шляпник."
        note: "wcale nie — вовсе не"
      - pl: " „Równie dobrze mogłabyś powiedzieć, że «widzę, co jem» to to samo co «jem, co widzę»!”"
        ru: "«Ты с тем же успехом могла бы сказать, что «вижу, что ем» — это то же, что «ем, что вижу»!»"
        note: "równie dobrze — с тем же успехом"
    words: { "Wcale": wcale, "Równie": rownie, "jem": jesc }
  - clean: "„Równie dobrze mogłabyś powiedzieć”, dodał Zając Marcowy, „że «lubię to, co dostaję» to to samo co «dostaję to, co lubię»!”"
    en: "“You might just as well say,” added the March Hare, “that ‘I like what I get’ is the same thing as ‘I get what I like’!”"
    chunks:
      - pl: "„Równie dobrze mogłabyś powiedzieć”, dodał Zając Marcowy,"
        ru: "«Ты с тем же успехом могла бы сказать», — добавил Мартовский Заяц,"
        note: "mogłabyś — могла бы: условное наклонение, женский род"
      - pl: " „że «lubię to, co dostaję» to to samo co «dostaję to, co lubię»!”"
        ru: "«что «люблю то, что получаю» — это то же, что «получаю то, что люблю»!»"
        note: "dostawać — получать"
    words: { "dostaję": dostawac }
  - clean: "„Równie dobrze mogłabyś powiedzieć”, dodał Suseł, który zdawał się mówić przez sen, „że «oddycham, kiedy śpię» to to samo co «śpię, kiedy oddycham»!”"
    en: "“You might just as well say,” added the Dormouse, who seemed to be talking in his sleep, “that ‘I breathe when I sleep’ is the same thing as ‘I sleep when I breathe’!”"
    chunks:
      - pl: "„Równie dobrze mogłabyś powiedzieć”, dodał Suseł, który zdawał się mówić przez sen,"
        ru: "«Ты с тем же успехом могла бы сказать», — добавил Соня, который, казалось, говорил во сне,"
        note: "przez sen — сквозь сон, во сне"
      - pl: " „że «oddycham, kiedy śpię» to to samo co «śpię, kiedy oddycham»!”"
        ru: "«что «дышу, когда сплю» — это то же, что «сплю, когда дышу»!»"
        note: "oddychać — дышать"
    words: { "zdawał": zdawac, "oddycham": oddychac }
  - clean: "„U ciebie to rzeczywiście to samo”, powiedział Kapelusznik, i tu rozmowa się urwała, a całe towarzystwo siedziało przez minutę w milczeniu, podczas gdy Alicja przypominała sobie wszystko, co wiedziała o krukach i biurkach, a nie było tego wiele."
    en: "“It _is_ the same thing with you,” said the Hatter, and here the conversation dropped, and the party sat silent for a minute, while Alice thought over all she could remember about ravens and writing-desks, which wasn’t much."
    chunks:
      - pl: "„U ciebie to rzeczywiście to samo”, powiedział Kapelusznik,"
        ru: "«У тебя это и вправду одно и то же», — сказал Шляпник,"
        note: "u ciebie — у тебя: u и родительный"
      - pl: " i tu rozmowa się urwała, a całe towarzystwo siedziało przez minutę w milczeniu,"
        ru: "и тут разговор оборвался, и всё общество с минуту сидело в молчании,"
        note: "urwać się — оборваться, прерваться"
      - pl: " podczas gdy Alicja przypominała sobie wszystko, co wiedziała o krukach i biurkach, a nie było tego wiele."
        ru: "пока Алиса припоминала всё, что знала о воронах и письменных столах, а было этого немного."
        note: "przypominać sobie — припоминать, вспоминать"
    words: { "rzeczywiście": rzeczywiscie, "rozmowa": rozmowa, "towarzystwo": towarzystwo, "minutę": minuta }
  - clean: "Kapelusznik pierwszy przerwał ciszę. „Który dziś mamy dzień miesiąca?”, powiedział, zwracając się do Alicji: wyjął z kieszeni zegarek i patrzył na niego niespokojnie, co chwila nim potrząsając i przykładając go do ucha."
    en: "The Hatter was the first to break the silence. “What day of the month is it?” he said, turning to Alice: he had taken his watch out of his pocket, and was looking at it uneasily, shaking it every now and then, and holding it to his ear."
    chunks:
      - pl: "Kapelusznik pierwszy przerwał ciszę."
        ru: "Шляпник первым нарушил тишину."
        note: "przerwać ciszę — нарушить тишину"
      - pl: " „Który dziś mamy dzień miesiąca?”, powiedział, zwracając się do Alicji:"
        ru: "«Какое сегодня число?» — сказал он, обращаясь к Алисе:"
        note: "który mamy dzień — какое сегодня число"
      - pl: " wyjął z kieszeni zegarek i patrzył na niego niespokojnie, co chwila nim potrząsając i przykładając go do ucha."
        ru: "он вынул из кармана часы и смотрел на них тревожно, то и дело встряхивая их и прикладывая к уху."
        note: "potrząsać czymś — встряхивать что-л.: творительный падеж"
    words: { "ciszę": cisza, "dziś": dzis, "miesiąca": miesiac, "kieszeni": kieszen, "zegarek": zegarek, "ucha": ucho }
  - clean: "Alicja zastanowiła się chwilę, a potem powiedziała: „Czwarty.”"
    en: "Alice considered a little, and then said “The fourth.”"
    chunks:
      - pl: "Alicja zastanowiła się chwilę, a potem powiedziała: „Czwarty.”"
        ru: "Алиса немного подумала, а потом сказала: «Четвёртое»."
        note: "zastanowić się — подумать, поразмыслить"
    words: { "potem": potem }
  - clean: "„Spóźnia się o dwa dni!”, westchnął Kapelusznik. „Mówiłem ci, że masło nie posłuży mechanizmowi!”, dodał, patrząc gniewnie na Zająca Marcowego."
    en: "“Two days wrong!” sighed the Hatter. “I told you butter wouldn’t suit the works!” he added looking angrily at the March Hare."
    chunks:
      - pl: "„Spóźnia się o dwa dni!”, westchnął Kapelusznik."
        ru: "«Отстают на два дня!» — вздохнул Шляпник."
