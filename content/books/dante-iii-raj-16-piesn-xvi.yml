# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 16
chapterTitle: "Pieśń XVI"
chapterTitleRu: "Песнь XVI. Старинные роды Флоренции"
level: B2
paragraphs:
  - clean: "Ciąg dalszy. Kaciagwida mówi o późniejszych dziejach i teraźniejszych stosunkach Florencji."
    chunks:
      - pl: "Ciąg dalszy. Kaciagwida mówi o późniejszych dziejach i teraźniejszych stosunkach Florencji."
        ru: "Продолжение. Каччагвида говорит о позднейшей истории и нынешних отношениях Флоренции."
    words: { "Ciąg": ciag, "dalszy": daleki, "mówi": mowic, "późniejszych": pozny, "dziejach": dzieje }
  - clean: "O błahe nasze po krwi uszlachcenie!\nJeśli na ziemi wzbijasz w pychę ludzi,\nGdzie tak mdłe ducha naszego skłonienie;\nRzecz ta podziwu już we mnie nie wzbudzi,\nOdtąd gdy próżny chwaliłem się z ciebie,\nTam gdzie nie błądzą żądze, mówię, w niebie."
    verse: true
    chunks:
      - pl: "O błahe nasze po krwi uszlachcenie!"
        ru: "О ничтожное наше благородство по крови!"
        note: "uszlachcenie — благородство"
      - pl: "\nJeśli na ziemi wzbijasz w pychę ludzi,"
        ru: "Если на земле ты возносишь людей в гордыню,"
      - pl: "\nGdzie tak mdłe ducha naszego skłonienie;"
        ru: "где столь слабо стремление нашего духа;"
      - pl: "\nRzecz ta podziwu już we mnie nie wzbudzi,"
        ru: "эта вещь уже не вызовет во мне удивления,"
      - pl: "\nOdtąd gdy próżny chwaliłem się z ciebie,"
        ru: "с тех пор как я тщеславно гордился тобой"
      - pl: "\nTam gdzie nie błądzą żądze, mówię, w niebie."
        ru: "там, где не блуждают желания, говорю — на небе."
    words: { "błahe": blahy, "krwi": krew, "ducha": duch, "Odtąd": odtad, "chwaliłem": chwalic, "niebie": niebo }
  - clean: "Ty jesteś płaszczem, co szybko się skraca,\nJeśli z dnia na dzień zasługa lub praca\nNowego sukna dla cię nie przykroi,\nCzas mknie z nożycą wkoło poły twojej.\nOd *Wy*, co pierwszy Rzym użył w swej mowie,\nA które potem jego potomkowie\nZ nowożytnego wygnali języka,\nPocząłem mówić: przeto Beatryce\nStojąc na stronie wpół się uśmiechnęła,\nPodobna do tej wiernej służebnicy,\nCo na błąd pierwszy Ginewry kaszlnęła,\nO czym szeroko powiada kronika."
    verse: true
    chunks:
      - pl: "Ty jesteś płaszczem, co szybko się skraca,"
        ru: "Ты — плащ, что быстро укорачивается,"
      - pl: "\nJeśli z dnia na dzień zasługa lub praca"
        ru: "если изо дня в день заслуга или труд"
      - pl: "\nNowego sukna dla cię nie przykroi,"
        ru: "не скроят тебе нового сукна,"
      - pl: "\nCzas mknie z nożycą wkoło poły twojej."
        ru: "время мчится с ножницами вокруг твоей полы."
        note: "nożyca — ножницы"
      - pl: "\nOd *Wy*, co pierwszy Rzym użył w swej mowie,"
        ru: "С «Вы», которое первым употребил Рим в своей речи"
      - pl: "\nA które potem jego potomkowie"
        ru: "и которое потом его потомки"
      - pl: "\nZ nowożytnego wygnali języka,"
        ru: "изгнали из нового языка,"
      - pl: "\nPocząłem mówić: przeto Beatryce"
        ru: "я начал говорить: поэтому Беатриче,"
      - pl: "\nStojąc na stronie wpół się uśmiechnęła,"
        ru: "стоя в стороне, полуулыбнулась,"
      - pl: "\nPodobna do tej wiernej służebnicy,"
        ru: "подобная той верной служанке,"
      - pl: "\nCo na błąd pierwszy Ginewry kaszlnęła,"
        ru: "что кашлянула при первом проступке Джиневры,"
        note: "Гиневры, в романе о Ланселоте"
      - pl: "\nO czym szeroko powiada kronika."
        ru: "о чём пространно говорит хроника."
    words: { "płaszczem": plaszcz, "zasługa": zasluga, "języka": jezyk, "Począłem": poczac, "uśmiechnęła": usmiechnac, "wiernej": wierny }
  - clean: "«Wy» tak mówiłem, «ojcem mi jesteście.\nWy ośmielacie mówić mnie nareszcie,\nWy tak wysoko mnie do się wznosicie,\nŻe czuję wyższe i pełniejsze życie;\nRadość w me serce strumieniami wsięka,\nSerce radością wzbiera, lecz nie pęka."
    verse: true
    chunks:
      - pl: "«Wy» tak mówiłem, «ojcem mi jesteście."
        ru: "«Вы, — так я говорил, — мне отец."
      - pl: "\nWy ośmielacie mówić mnie nareszcie,"
        ru: "Вы ободряете меня наконец говорить,"
      - pl: "\nWy tak wysoko mnie do się wznosicie,"
        ru: "вы так высоко возносите меня к себе,"
      - pl: "\nŻe czuję wyższe i pełniejsze życie;"
        ru: "что я чувствую более высокую и полную жизнь;"
      - pl: "\nRadość w me serce strumieniami wsięka,"
        ru: "радость ручьями втекает в моё сердце,"
        note: "wsiękać — впитываться"
      - pl: "\nSerce radością wzbiera, lecz nie pęka."
        ru: "сердце переполняется радостью, но не разрывается."
    words: { "wznosicie": wznosic, "wyższe": wysoki, "pełniejsze": pelny, "Radość": radosc, "serce": serce, "strumieniami": strumien }
  - clean: "Powiedz mi, droga krynico krwi mojej,\nKrew jakich przodków twoje źródło poi,\nNad twą kolebką jakie przeszły lata?\nO Świętojańskiej powiedz mi owczarni\nCzy ludzie zgodni żyli w niej, nieswarni,\nCzy była w mężów dostojnych bogata?»"
    verse: true
    chunks:
      - pl: "Powiedz mi, droga krynico krwi mojej,"
        ru: "Скажи мне, дорогой источник моей крови,"
      - pl: "\nKrew jakich przodków twoje źródło poi,"
        ru: "кровь каких предков поит твой исток,"
      - pl: "\nNad twą kolebką jakie przeszły lata?"
        ru: "какие годы прошли над твоей колыбелью?"
      - pl: "\nO Świętojańskiej powiedz mi owczarni"
        ru: "Расскажи мне об Иоанновой овчарне,"
        note: "Флоренция, город Иоанна Крестителя"
      - pl: "\nCzy ludzie zgodni żyli w niej, nieswarni,"
        ru: "жили ли люди в ней в согласии, без раздоров,"
        note: "nieswarny — неспорливый"
      - pl: "\nCzy była w mężów dostojnych bogata?»"
        ru: "была ли она богата достойными мужами?»"
    words: { "przodków": przodek, "źródło": zrodlo, "przeszły": przejsc, "zgodni": zgodny, "mężów": maz, "bogata": bogaty }
  - clean: "Jak się ożywia na wiatr żar w płomieniu,\nTak na pieszczotę słów mych w okamgnieniu\nŚwiatło jasnością żywszą się oblekło,\nSłodziej, lecz mową nie naszą tak rzekło:\n— «Od dnia, gdy pierwsze wymówiono Ave!\nAż do dziś świętej, matki mej połogu,\nW którym mnie zległa, błogosławiąc Bogu,\nPięćset pięćdziesiąt trzy razy Mars biegał\nDo stóp Lwa swego i ognie jaskrawe\nWciąż ten planeta w lwim oku zażegał,\nJam się urodził, gdzie przodkowie moi\nW tym samym miejscu rodzili się, żyli,\nW ostatniej miasta starego dzielnicy,\nKędy ciekawy tłum mrowi się, ściska,\nIdąc na wasze doroczne igrzyska."
    verse: true
    chunks:
      - pl: "Jak się ożywia na wiatr żar w płomieniu,"
        ru: "Как оживляется на ветру жар в пламени,"
      - pl: "\nTak na pieszczotę słów mych w okamgnieniu"
        ru: "так на ласку моих слов в мгновение ока"
      - pl: "\nŚwiatło jasnością żywszą się oblekło,"
        ru: "свет облёкся более живой ясностью,"
      - pl: "\nSłodziej, lecz mową nie naszą tak rzekło:"
        ru: "слаще, но не нашей речью сказал:"
        note: "то есть на старом флорентийском"
      - pl: "\n— «Od dnia, gdy pierwsze wymówiono Ave!"
        ru: "— «Со дня, когда было произнесено первое „Ave“,"
      - pl: "\nAż do dziś świętej, matki mej połogu,"
        ru: "и до святых родов моей матери,"
      - pl: "\nW którym mnie zległa, błogosławiąc Bogu,"
        ru: "в которых она родила меня, благословляя Бога,"
      - pl: "\nPięćset pięćdziesiąt trzy razy Mars biegał"
        ru: "пятьсот пятьдесят три раза Марс обегал"
      - pl: "\nDo stóp Lwa swego i ognie jaskrawe"
        ru: "к подножию своего Льва, и яркие огни"
      - pl: "\nWciąż ten planeta w lwim oku zażegał,"
        ru: "всё зажигала эта планета в львином глазу,"
      - pl: "\nJam się urodził, gdzie przodkowie moi"
        ru: "я родился там, где мои предки"
      - pl: "\nW tym samym miejscu rodzili się, żyli,"
        ru: "в том же месте рождались, жили,"
      - pl: "\nW ostatniej miasta starego dzielnicy,"
        ru: "в последнем квартале старого города,"
      - pl: "\nKędy ciekawy tłum mrowi się, ściska,"
        ru: "где любопытная толпа роится, теснится,"
      - pl: "\nIdąc na wasze doroczne igrzyska."
        ru: "идя на ваши ежегодные игры."
        note: "скачки на Иванов день"
    words: { "płomieniu": plomien, "jasnością": jasnosc, "rzekło": rzec, "błogosławiąc": blogoslawic, "biegał": biegac, "dzielnicy": dzielnica }
  - clean: "Dość o mych przodkach, skąd przyszli, czym byli?\nMilczeć tu raczej, nie mówić przystoi,\nLud wtedy zdolny do miecza i zbroi\nAż od posągu Marsa do Chrzcielnicy\nSkładał część piątą dzisiejszej ludności;\nTa dziś złożona z dziwnej mieszaniny,\nZ włóczęgów z Kampi, Certaldo, Figiny."
    verse: true
    chunks:
      - pl: "Dość o mych przodkach, skąd przyszli, czym byli?"
        ru: "Довольно о моих предках: откуда пришли, кем были?"
      - pl: "\nMilczeć tu raczej, nie mówić przystoi,"
        ru: "Здесь подобает скорее молчать, чем говорить."
      - pl: "\nLud wtedy zdolny do miecza i zbroi"
        ru: "Народ, тогда способный к мечу и доспехам,"
      - pl: "\nAż od posągu Marsa do Chrzcielnicy"
        ru: "от статуи Марса до Крестильни"
      - pl: "\nSkładał część piątą dzisiejszej ludności;"
        ru: "составлял пятую часть нынешнего населения;"
      - pl: "\nTa dziś złożona z dziwnej mieszaniny,"
        ru: "оно сегодня составлено из странной смеси,"
      - pl: "\nZ włóczęgów z Kampi, Certaldo, Figiny."
        ru: "из бродяг из Кампи, Чертальдо, Фиггине."
        note: "włóczęga — бродяга"
    words: { "Milczeć": milczec, "zdolny": zdolny, "miecza": miecz, "posągu": posag, "Składał": skladac, "dzisiejszej": dzisiejszy }
  - clean: "Dawniej krew strzegła w rodzimej czystości,\nDo rzemieślnika od barońskiej mości.\nLepiej by było miedzą szachowaną\nPrzytykać do nich, jak graniczną ścianą,\nZ strony Gulazzo albo Trespiano,\nNiźli mur miasta mieć zapowietrzony\nGawiedzią z Signy i Agugliony,\nCo wzrok wyszczerza lichwą zaostrzony."
    verse: true
    chunks:
      - pl: "Dawniej krew strzegła w rodzimej czystości,"
        ru: "Прежде кровь хранилась в родной чистоте,"
      - pl: "\nDo rzemieślnika od barońskiej mości."
        ru: "от ремесленника до баронской милости."
      - pl: "\nLepiej by było miedzą szachowaną"
        ru: "Лучше было бы межой в шашку"
      - pl: "\nPrzytykać do nich, jak graniczną ścianą,"
        ru: "примыкать к ним, как пограничной стеной,"
      - pl: "\nZ strony Gulazzo albo Trespiano,"
        ru: "со стороны Галуццо или Треспьяно,"
      - pl: "\nNiźli mur miasta mieć zapowietrzony"
        ru: "чем иметь стену города, заражённую"
        note: "zapowietrzony — заражённый"
      - pl: "\nGawiedzią z Signy i Agugliony,"
        ru: "сбродом из Синьи и Агульоне,"
      - pl: "\nCo wzrok wyszczerza lichwą zaostrzony."
        ru: "что скалит взгляд, обострённый лихвой."
        note: "wyszczerzać — скалить"
    words: { "Dawniej": dawno, "strzegła": strzec, "czystości": czystosc, "miedzą": miedza, "ścianą": sciana, "wzrok": wzrok }
  - clean: "Gdyby nie będąc Florencyja płochą,\nDziś dla Cezara nie była macochą,\nLecz kochającą matką swego syna,\nKramarz nie hańbiąc nazwy florentyna,\nDo Simifonti wróciłby, jak trzeba,\nGdzie jego ojciec chodził, żebrząc chleba."
    verse: true
    chunks:
      - pl: "Gdyby nie będąc Florencyja płochą,"
        ru: "Если бы Флоренция, не будучи легкомысленной,"
      - pl: "\nDziś dla Cezara nie była macochą,"
        ru: "не была сегодня мачехой для Цезаря,"
      - pl: "\nLecz kochającą matką swego syna,"
        ru: "а любящей матерью своему сыну,"
      - pl: "\nKramarz nie hańbiąc nazwy florentyna,"
        ru: "торгаш, не позоря имени флорентийца,"
      - pl: "\nDo Simifonti wróciłby, jak trzeba,"
        ru: "вернулся бы, как надо, в Симифонти,"
      - pl: "\nGdzie jego ojciec chodził, żebrząc chleba."
        ru: "где его отец ходил, прося хлеба."
    words: { "Dziś": dzis, "matką": matka, "syna": syn, "nazwy": nazwa, "trzeba": trzeba, "chleba": chleb }
  - clean: "Dziś w Montemurlo siedzieliby Konti,\nCerchi w Akonie, a Buondelmonti\nW Waldegriewe. Mieszanina osób\nZawsze na miasta działa w zgubny sposób,\nDo zła ma dosyć zarodów, jak wiele\nRazem pokarmów natłoczonych w ciele."
    verse: true
    chunks:
      - pl: "Dziś w Montemurlo siedzieliby Konti,"
        ru: "Сегодня в Монтемурло сидели бы Конти,"
      - pl: "\nCerchi w Akonie, a Buondelmonti"
        ru: "Черки — в Аконе, а Буондельмонти —"
      - pl: "\nW Waldegriewe. Mieszanina osób"
        ru: "в Вальдигреве. Смешение людей"
      - pl: "\nZawsze na miasta działa w zgubny sposób,"
        ru: "всегда губительно действует на города,"
      - pl: "\nDo zła ma dosyć zarodów, jak wiele"
        ru: "в нём довольно зародышей зла, как много"
      - pl: "\nRazem pokarmów natłoczonych w ciele."
        ru: "пищи, натолканной разом в теле."
    words: { "siedzieliby": siedziec, "osób": osoba, "Zawsze": zawsze, "miasta": miasto, "sposób": sposob }
  - clean: "Byk ślepy prędzej niźli ślepe jagnie\nMoże się potknąć lub zagrzęznąć w bagnie;\nPięć szpad nie tyle ran śmiertelnych zada,\nCo może czasem zadać jedna szpada.\nSpojrzyj na mury Luni i Chiuzy,\nNa Synigaglją, ruina i gruzy!"
    verse: true
    chunks:
      - pl: "Byk ślepy prędzej niźli ślepe jagnie"
        ru: "Слепой бык скорее, чем слепой ягнёнок,"
      - pl: "\nMoże się potknąć lub zagrzęznąć w bagnie;"
        ru: "может споткнуться или увязнуть в болоте;"
      - pl: "\nPięć szpad nie tyle ran śmiertelnych zada,"
        ru: "пять шпаг не нанесут столько смертельных ран,"
      - pl: "\nCo może czasem zadać jedna szpada."
        ru: "сколько может порой нанести одна шпага."
      - pl: "\nSpojrzyj na mury Luni i Chiuzy,"
        ru: "Взгляни на стены Луни и Кьюзи,"
      - pl: "\nNa Synigaglją, ruina i gruzy!"
        ru: "на Синигалью: развалины и обломки!"
    words: { "ślepy": slepy, "prędzej": predko, "bagnie": bagno, "śmiertelnych": smiertelny, "zada": zadac, "mury": mur }
  - clean: "Słysząc, jak świetne wygasnęły rody,\nMniej dziwnym zda się, gdy kres mają grody.\nWszystko co wasze, tak jak wy umiera,\nLecz śmierć czasami zakrywa swe skutki\nW niektórych rzeczach, bo wasz żywot krótki.\nJak księżyc wznosząc, to zniżając fale,\nMorzom ich brzegi daje i zabiera,\nSzczęście z twym miastem tak igra niestale."
    verse: true
    chunks:
      - pl: "Słysząc, jak świetne wygasnęły rody,"
        ru: "Слыша, как угасли блестящие роды,"
      - pl: "\nMniej dziwnym zda się, gdy kres mają grody."
        ru: "менее странным покажется, что у городов есть предел."
      - pl: "\nWszystko co wasze, tak jak wy umiera,"
        ru: "Всё ваше умирает, как и вы,"
      - pl: "\nLecz śmierć czasami zakrywa swe skutki"
        ru: "но смерть иногда скрывает свои следствия"
      - pl: "\nW niektórych rzeczach, bo wasz żywot krótki."
        ru: "в некоторых вещах, ибо ваша жизнь коротка."
      - pl: "\nJak księżyc wznosząc, to zniżając fale,"
        ru: "Как луна, то поднимая, то опуская волны,"
      - pl: "\nMorzom ich brzegi daje i zabiera,"
        ru: "даёт морям их берега и забирает,"
      - pl: "\nSzczęście z twym miastem tak igra niestale."
        ru: "так счастье непостоянно играет с твоим городом."
    words: { "rody": rod-2, "kres": kres, "skutki": skutek, "księżyc": ksiezyc, "fale": fala, "brzegi": brzeg }
  - clean: "A więc nie będzie rzecz dziwna i nowa,\nŻe świetność domów florenckich rodowa\nZgasła i spadła z potęgi swej wierzchu,\nChociaż ich sława ginie w czasów zmierzchu.\nJuż Filipesków, Alberigów domy,\nWidziałem, przeszły jako cień znikomy."
    verse: true
    chunks:
      - pl: "A więc nie będzie rzecz dziwna i nowa,"
        ru: "Итак, не будет вещью странной и новой,"
      - pl: "\nŻe świetność domów florenckich rodowa"
        ru: "что родовой блеск флорентийских домов"
      - pl: "\nZgasła i spadła z potęgi swej wierzchu,"
        ru: "угас и упал с вершины своей мощи,"
      - pl: "\nChociaż ich sława ginie w czasów zmierzchu."
        ru: "хотя их слава теряется в сумерках времён."
      - pl: "\nJuż Filipesków, Alberigów domy,"
        ru: "Уже дома Филиппески, Альбериги"
      - pl: "\nWidziałem, przeszły jako cień znikomy."
        ru: "я видел прошедшими, как мимолётная тень."
    words: { "domów": dom, "spadła": spasc, "potęgi": potega, "sława": slawa, "czasów": czas, "cień": cien }
