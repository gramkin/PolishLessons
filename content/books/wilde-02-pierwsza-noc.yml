  - clean: "Tuż przed sobą ujrzał w bladym świetle księżyca starca o strasznym wyglądzie. Oczy miał jak rozżarzone węgle; długie siwe włosy spadały mu na ramiona w skołtunionych zwojach; jego szaty o staroświeckim kroju były brudne i podarte, a z nadgarstków i kostek zwisały ciężkie kajdany i zardzewiałe okowy."
    en: "Right in front of him he saw, in the wan moonlight, an old man of terrible aspect. His eyes were as red burning coals; long grey hair fell over his shoulders in matted coils; his garments, which were of antique cut, were soiled and ragged, and from his wrists and ankles hung heavy manacles and rusty gyves."
