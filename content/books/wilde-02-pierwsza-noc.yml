  - clean: "Dotarłszy do małej tajnej komnaty w lewym skrzydle, oparł się o promień księżyca, żeby złapać oddech, i zaczął próbować zrozumieć swoje położenie. Nigdy przez trzysta lat świetnej i nieprzerwanej kariery nie został tak grubiańsko znieważony. Przypomniał sobie wdowę po księciu, którą przyprawił o atak nerwowy, gdy stała przed lustrem w koronkach i brylantach; cztery pokojówki, które dostały histerii, kiedy tylko uśmiechnął się do nich szyderczo zza zasłon w jednej z gościnnych sypialni; proboszcza, któremu zdmuchnął świecę, gdy ten wracał późną nocą z biblioteki, i który od tamtej pory był pod opieką sir Williama Gulla, istny męczennik zaburzeń nerwowych; i starą madame de Tremouillac, która obudziwszy się pewnego ranka wcześnie i ujrzawszy szkielet siedzący w fotelu przy kominku i czytający jej pamiętnik, przeleżała sześć tygodni w łóżku z zapaleniem mózgu, a po wyzdrowieniu pojednała się z Kościołem i zerwała znajomość z tym osławionym sceptykiem, panem de Voltaire."
    en: "On reaching a small secret chamber in the left wing, he leaned up against a moonbeam to recover his breath, and began to try and realize his position. Never, in a brilliant and uninterrupted career of three hundred years, had he been so grossly insulted. He thought of the Dowager Duchess, whom he had frightened into a fit as she stood before the glass in her lace and diamonds; of the four housemaids, who had gone into hysterics when he merely grinned at them through the curtains on one of the spare bedrooms; of the rector of the parish, whose candle he had blown out as he was coming late one night from the library, and who had been under the care of Sir William Gull ever since, a perfect martyr to nervous disorders; and of old Madame de Tremouillac, who, having wakened up one morning early and seen a skeleton seated in an armchair by the fire reading her diary, had been confined to her bed for six weeks with an attack of brain fever, and, on her recovery, had become reconciled to the Church, and broken off her connection with that notorious sceptic, Monsieur de Voltaire."
    draft: true
