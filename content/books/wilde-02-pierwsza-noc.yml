  - clean: "Z entuzjastycznym egotyzmem prawdziwego artysty przeglądał swoje najsłynniejsze występy i uśmiechał się gorzko do siebie, przypominając sobie swój ostatni występ jako „Czerwony Ruben, czyli Uduszone Niemowlę”, swój debiut jako „Chudy Gibeon, Krwiopijca z Bexley Moor” i furorę, jaką wywołał pewnego pięknego czerwcowego wieczoru, po prostu grając w kręgle własnymi kośćmi na korcie tenisowym. A po tym wszystkim jacyś nędzni współcześni Amerykanie mieli przyjść i proponować mu Smar Wschodzące Słońce i rzucać mu poduszkami w głowę! Było to zupełnie nie do zniesienia. Poza tym żaden duch w historii nie był nigdy tak traktowany. Postanowił więc się zemścić i aż do świtu trwał w postawie głębokiej zadumy."
    en: "With the enthusiastic egotism of the true artist, he went over his most celebrated performances, and smiled bitterly to himself as he recalled to mind his last appearance as \"Red Reuben, or the Strangled Babe,\" his début as \"Guant Gibeon, the Blood-sucker of Bexley Moor,\" and the furore he had excited one lovely June evening by merely playing ninepins with his own bones upon the lawn-tennis ground. And after all this some wretched modern Americans were to come and offer him the Rising Sun Lubricator, and throw pillows at his head! It was quite unbearable. Besides, no ghost in history had ever been treated in this manner. Accordingly, he determined to have vengeance, and remained till daylight in an attitude of deep thought."
    draft: true
