  - clean: "Ani słowem nie wspomniano o tym, co nadprzyrodzone, ani w żaden sposób nie nawiązano do sir Simona de Canterville. O jedenastej rodzina udała się na spoczynek, a o wpół do dwunastej wszystkie światła były zgaszone. Jakiś czas później pana Otisa obudził dziwny hałas na korytarzu, tuż za drzwiami jego pokoju. Brzmiało to jak szczęk metalu i z każdą chwilą zdawało się zbliżać. Natychmiast wstał, zapalił zapałkę i spojrzał, która godzina. Była dokładnie pierwsza. Był zupełnie spokojny i zbadał sobie puls, który wcale nie był gorączkowy. Dziwny hałas wciąż trwał, a wraz z nim wyraźnie słychać było kroki. Włożył pantofle, wyjął z neseseru małą podłużną buteleczkę i otworzył drzwi."
    en: "No mention at all was made of the supernatural, nor was Sir Simon de Canterville alluded to in any way. At eleven o'clock the family retired, and by half-past all the lights were out. Some time after, Mr. Otis was awakened by a curious noise in the corridor, outside his room. It sounded like the clank of metal, and seemed to be coming nearer every moment. He got up at once, struck a match, and looked at the time. It was exactly one o'clock. He was quite calm, and felt his pulse, which was not at all feverish. The strange noise still continued, and with it he heard distinctly the sound of footsteps. He put on his slippers, took a small oblong phial out of his dressing-case, and opened the door."
    draft: true
