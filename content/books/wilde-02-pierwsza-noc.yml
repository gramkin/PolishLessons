  - clean: "Przypomniał sobie straszną noc, kiedy niegodziwego lorda Canterville znaleziono duszącego się w garderobie z waletem karo w połowie gardła, i jak tuż przed śmiercią wyznał, że właśnie za pomocą tej karty oszukał Charlesa Jamesa Foxa na pięćdziesiąt tysięcy funtów u Crockforda, i przysięgał, że to duch kazał mu ją połknąć. Wróciły do niego wszystkie jego wielkie osiągnięcia: od kamerdynera, który zastrzelił się w spiżarni, bo zobaczył zieloną rękę stukającą w szybę, aż po piękną lady Stutfield, która musiała zawsze nosić na szyi czarną aksamitną wstążkę, żeby ukryć ślad pięciu palców wypalony na jej białej skórze, i która w końcu utopiła się w stawie z karpiami na końcu Królewskiej Alei."
    en: "He remembered the terrible night when the wicked Lord Canterville was found choking in his dressing-room, with the knave of diamonds half-way down his throat, and confessed, just before he died, that he had cheated Charles James Fox out of £50,000 at Crockford's by means of that very card, and swore that the ghost had made him swallow it. All his great achievements came back to him again, from the butler who had shot himself in the pantry because he had seen a green hand tapping at the window-pane, to the beautiful Lady Stutfield, who was always obliged to wear a black velvet band round her throat to hide the mark of five fingers burnt upon her white skin, and who drowned herself at last in the carp-pond at the end of the King's Walk."
    draft: true
