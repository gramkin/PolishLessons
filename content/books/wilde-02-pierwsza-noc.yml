  - clean: "Przez chwilę duch Canterville stał zupełnie nieruchomo w naturalnym oburzeniu; potem, cisnąwszy gwałtownie buteleczkę o wypolerowaną podłogę, rzucił się do ucieczki korytarzem, wydając głuche jęki i upiorne zielone światło. Jednak akurat gdy dotarł do szczytu wielkich dębowych schodów, otworzyły się z rozmachem drzwi, ukazały się dwie małe postacie w białych koszulach i tuż koło jego głowy przeleciała ze świstem wielka poduszka! Najwyraźniej nie było czasu do stracenia, więc pośpiesznie obrawszy czwarty wymiar przestrzeni jako drogę ucieczki, zniknął w boazerii, i w domu zapanowała zupełna cisza."
    en: "For a moment the Canterville ghost stood quite motionless in natural indignation; then, dashing the bottle violently upon the polished floor, he fled down the corridor, uttering hollow groans, and emitting a ghastly green light. Just, however, as he reached the top of the great oak staircase, a door was flung open, two little white-robed figures appeared, and a large pillow whizzed past his head! There was evidently no time to be lost, so, hastily adopting the Fourth dimension of Space as a means of escape, he vanished through the wainscoting, and the house became quite quiet."
