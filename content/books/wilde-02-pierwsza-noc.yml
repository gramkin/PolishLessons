  - clean: "Dzień był ciepły i słoneczny, a w wieczornym chłodzie cała rodzina wybrała się na przejażdżkę. Wrócili do domu dopiero o dziewiątej i zjedli lekką kolację. Rozmowa w ogóle nie dotyczyła duchów, nie było więc nawet tych podstawowych warunków chłonnego oczekiwania, które tak często poprzedzają zjawiska psychiczne. Omawiano, jak dowiedziałem się później od pana Otisa, jedynie tematy, z jakich składa się zwykła rozmowa wykształconych Amerykanów z lepszych sfer, jak ogromna wyższość panny Fanny Devonport nad Sarą Bernhardt jako aktorki; trudność zdobycia młodej kukurydzy, gryczanych placków i kaszy kukurydzianej nawet w najlepszych angielskich domach; znaczenie Bostonu dla rozwoju duszy świata; zalety systemu kwitów bagażowych w podróżach koleją oraz słodycz nowojorskiego akcentu w porównaniu z londyńskim przeciąganiem słów."
    en: "The day had been warm and sunny; and, in the cool of the evening, the whole family went out to drive. They did not return home till nine o'clock, when they had a light supper. The conversation in no way turned upon ghosts, so there were not even those primary conditions of receptive expectations which so often precede the presentation of psychical phenomena. The subjects discussed, as I have since learned from Mr. Otis, were merely such as form the ordinary conversation of cultured Americans of the better class, such as the immense superiority of Miss Fanny Devonport over Sarah Bernhardt as an actress; the difficulty of obtaining green corn, buckwheat cakes, and hominy, even in the best English houses; the importance of Boston in the development of the world-soul; the advantages of the baggage-check system in railway travelling; and the sweetness of the New York accent as compared to the London drawl."
    draft: true
