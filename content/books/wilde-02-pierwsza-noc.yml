  - clean: "Cała rodzina była teraz bardzo zainteresowana; pan Otis zaczął podejrzewać, że zbyt dogmatycznie zaprzeczał istnieniu duchów, pani Otis oznajmiła, że zamierza wstąpić do Towarzystwa Badań Psychicznych, a Waszyngton przygotował długi list do panów Myersa i Podmore'a na temat Trwałości Plam Krwi Związanych ze Zbrodnią. Tej nocy wszelkie wątpliwości co do obiektywnego istnienia zjaw zostały rozwiane na zawsze."
    en: "The whole family were now quite interested; Mr. Otis began to suspect that he had been too dogmatic in his denial of the existence of ghosts, Mrs. Otis expressed her intention of joining the Psychical Society, and Washington prepared a long letter to Messrs. Myers and Podmore on the subject of the Permanence of Sanguineous Stains when connected with Crime. That night all doubts about the objective existence of phantasmata were removed for ever."
    draft: true
