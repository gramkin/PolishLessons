  - clean: "— Szanowny panie — rzekł pan Otis — muszę naprawdę nalegać, żeby pan naoliwił te łańcuchy, i w tym celu przyniosłem panu małą buteleczkę Smaru Wschodzące Słońce Tammany. Podobno jest całkowicie skuteczny po jednym zastosowaniu, a na opakowaniu jest kilka świadectw w tej sprawie od naszych najwybitniejszych rodzimych duchownych. Zostawię go tu dla pana przy świecach w sypialni i chętnie dostarczę więcej, gdyby pan potrzebował. Z tymi słowami minister Stanów Zjednoczonych postawił buteleczkę na marmurowym stoliku i zamknąwszy drzwi, udał się na spoczynek."
    en: "\"My dear sir,\" said Mr. Otis, \"I really must insist on your oiling those chains, and have brought you for that purpose a small bottle of the Tammany Rising Sun Lubricator. It is said to be completely efficacious upon one application, and there are several testimonials to that effect on the wrapper from some of our most eminent native divines. I shall leave it here for you by the bedroom candles, and will be happy to supply you with more, should you require it.\" With these words the United States Minister laid the bottle down on a marble table, and, closing his door, retired to rest."
    draft: true
