paragraphs:
  - clean: "Burza szalała gwałtownie przez całą noc, ale nie wydarzyło się nic szczególnego. Jednak następnego ranka, kiedy zeszli na śniadanie, znowu zastali na podłodze straszliwą plamę krwi. — Nie sądzę, żeby to była wina Detergentu Ideał — powiedział Waszyngton — bo wypróbowałem go już na wszystkim. To musi być duch. Toteż zatarł plamę po raz drugi, ale drugiego ranka znów się pojawiła. Trzeciego ranka także tam była, choć pan Otis osobiście zamknął na noc bibliotekę i zabrał klucz na górę."
    en: "The storm raged fiercely all that night, but nothing of particular note occurred. The next morning, however, when they came down to breakfast, they found the terrible stain of blood once again on the floor. \"I don't think it can be the fault of the Paragon Detergent,\" said Washington, \"for I have tried it with everything. It must be the ghost.\" He accordingly rubbed out the stain a second time, but the second morning it appeared again. The third morning also it was there, though the library had been locked up at night by Mr. Otis himself, and the key carried up-stairs."
    draft: true
    chunks:
      - pl: "Burza szalała gwałtownie przez całą noc,"
        ru: "Буря свирепо бушевала всю ночь,"
