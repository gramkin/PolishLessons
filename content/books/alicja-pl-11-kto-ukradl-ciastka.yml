  - clean: "„A to jest ława przysięgłych”, pomyślała Alicja, „a te dwanaście stworzeń” (musiała powiedzieć „stworzeń”, widzicie, bo niektóre z nich były zwierzętami, a niektóre ptakami) „to chyba przysięgli.” Powtórzyła sobie to ostatnie słowo dwa czy trzy razy, dość z niego dumna: myślała bowiem, i słusznie, że bardzo niewiele małych dziewczynek w jej wieku w ogóle wie, co ono znaczy. Ale „sędziowie przysięgli” wyszłoby równie dobrze."
    en: "“And that’s the jury-box,” thought Alice, “and those twelve creatures,” (she was obliged to say “creatures,” you see, because some of them were animals, and some were birds,) “I suppose they are the jurors.” She said this last word two or three times over to herself, being rather proud of it: for she thought, and rightly too, that very few little girls of her age knew the meaning of it at all. However, “jury-men” would have done just as well."
    draft: true
    chunks:
      - pl: "„A to jest ława przysięgłych”, pomyślała Alicja, „a te dwanaście stworzeń”"
        ru: "«А это скамья присяжных», — подумала Алиса, — «а эти двенадцать созданий»"
        note: "ława przysięgłych — скамья присяжных"
