paragraphs:
  - clean: "Król i Królowa Kier siedzieli na tronie, gdy przybyli, a wokół nich zebrał się wielki tłum — wszelkiego rodzaju ptaszki i zwierzątka, a także cała talia kart: Walet stał przed nimi w kajdanach, z żołnierzem po każdej stronie, żeby go pilnowali; a obok Króla stał Biały Królik z trąbką w jednej ręce i zwojem pergaminu w drugiej. W samym środku sali sądowej stał stół, a na nim wielki półmisek ciastek: wyglądały tak smakowicie, że Alicji na ich widok zrobiło się całkiem głodno. „Chciałabym, żeby skończyli już tę rozprawę”, pomyślała, „i podali poczęstunek!” Ale nie zanosiło się na to, więc zaczęła rozglądać się dookoła, żeby jakoś zabić czas."
    en: "The King and Queen of Hearts were seated on their throne when they arrived, with a great crowd assembled about them—all sorts of little birds and beasts, as well as the whole pack of cards: the Knave was standing before them, in chains, with a soldier on each side to guard him; and near the King was the White Rabbit, with a trumpet in one hand, and a scroll of parchment in the other. In the very middle of the court was a table, with a large dish of tarts upon it: they looked so good, that it made Alice quite hungry to look at them—“I wish they’d get the trial done,” she thought, “and hand round the refreshments!” But there seemed to be no chance of this, so she began looking at everything about her, to pass away the time."
    draft: true
    chunks:
      - pl: "Król i Królowa Kier siedzieli na tronie, gdy przybyli, a wokół nich zebrał się wielki tłum —"
        ru: "Король и Королева Червей сидели на троне, когда те прибыли, а вокруг них собралась большая толпа —"
        note: "zebrać się — собраться"
      - pl: " wszelkiego rodzaju ptaszki i zwierzątka, a także cała talia kart:"
        ru: "всякого рода птички и зверюшки, а также вся колода карт:"
        note: "wszelkiego rodzaju — всякого рода: родительный падеж"
      - pl: " Walet stał przed nimi w kajdanach, z żołnierzem po każdej stronie, żeby go pilnowali;"
        ru: "Валет стоял перед ними в кандалах, с солдатом по каждую сторону, чтобы его стерегли;"
        note: "w kajdanach — в кандалах"
      - pl: " a obok Króla stał Biały Królik z trąbką w jednej ręce i zwojem pergaminu w drugiej."
        ru: "а рядом с Королём стоял Белый Кролик с трубой в одной руке и свитком пергамента в другой."
        note: "obok kogoś — рядом с кем-л.: родительный падеж"
      - pl: " W samym środku sali sądowej stał stół, a na nim wielki półmisek ciastek:"
        ru: "В самой середине зала суда стоял стол, а на нём большое блюдо пирожков:"
        note: "sala sądowa — зал суда"
      - pl: " wyglądały tak smakowicie, że Alicji na ich widok zrobiło się całkiem głodno."
        ru: "они выглядели так аппетитно, что Алисе при виде их стало совсем голодно."
        note: "zrobiło się jej głodno — ей стало голодно: безличный оборот с дательным"
      - pl: " „Chciałabym, żeby skończyli już tę rozprawę”, pomyślała, „i podali poczęstunek!”"
        ru: "«Хотела бы я, чтобы они уже кончили этот суд, — подумала она, — и подали угощение!»"
        note: "poczęstunek — угощение"
      - pl: " Ale nie zanosiło się na to, więc zaczęła rozglądać się dookoła, żeby jakoś zabić czas."
        ru: "Но на это не было похоже, поэтому она принялась оглядываться кругом, чтобы как-то убить время."
        note: "zabić czas — убить время"
