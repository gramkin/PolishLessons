  - clean: "Alicja widziała, tak wyraźnie, jakby zaglądała im przez ramię, że wszyscy przysięgli zapisują na tabliczkach „głupki!”, a nawet zdołała dostrzec, że jeden z nich nie umie napisać słowa „głupki” i musi spytać sąsiada. „Ładny bałagan będą miały te ich tabliczki, zanim rozprawa się skończy!”, pomyślała Alicja."
    en: "Alice could see, as well as if she were looking over their shoulders, that all the jurors were writing down “stupid things!” on their slates, and she could even make out that one of them didn’t know how to spell “stupid,” and that he had to ask his neighbour to tell him. “A nice muddle their slates’ll be in before the trial’s over!” thought Alice."
    draft: true
