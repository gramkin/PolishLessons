  - clean: "Sędzią, nawiasem mówiąc, był Król; a ponieważ nosił koronę na peruce (spójrzcie na frontyspis, jeśli chcecie zobaczyć, jak to robił), wcale nie wyglądał na to, że mu wygodnie, i z pewnością nie było mu do twarzy."
    en: "The judge, by the way, was the King; and as he wore his crown over the wig, (look at the frontispiece if you want to see how he did it,) he did not look at all comfortable, and it was certainly not becoming."
    draft: true
    chunks:
