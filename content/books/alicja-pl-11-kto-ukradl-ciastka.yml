  - clean: "Jeden z przysięgłych miał rysik, który skrzypiał. Tego Alicja oczywiście nie mogła znieść, więc obeszła salę, stanęła za nim i wkrótce znalazła sposobność, żeby mu go zabrać. Zrobiła to tak szybko, że biedny mały przysięgły (był to Bill, Jaszczurka) zupełnie nie mógł pojąć, co się z rysikiem stało; toteż po długim szukaniu wszędzie dookoła musiał przez resztę dnia pisać jednym palcem, a z tego był niewielki pożytek, bo nie zostawiało to na tabliczce żadnego śladu."
    en: "One of the jurors had a pencil that squeaked. This of course, Alice could _not_ stand, and she went round the court and got behind him, and very soon found an opportunity of taking it away. She did it so quickly that the poor little juror (it was Bill, the Lizard) could not make out at all what had become of it; so, after hunting all about for it, he was obliged to write with one finger for the rest of the day; and this was of very little use, as it left no mark on the slate."
    draft: true
    chunks:
      - pl: "Jeden z przysięgłych miał rysik, który skrzypiał."
        ru: "У одного из присяжных был грифель, который скрипел."
