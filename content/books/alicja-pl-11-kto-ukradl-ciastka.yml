  - clean: "Dwunastu przysięgłych pisało bardzo pilnie na tabliczkach. „Co oni robią?”, szepnęła Alicja do Gryfa. „Przecież nie mają jeszcze nic do zapisania, skoro rozprawa się nie zaczęła.”"
