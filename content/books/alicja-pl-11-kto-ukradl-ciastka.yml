      - pl: " Tego Alicja oczywiście nie mogła znieść, więc obeszła salę, stanęła za nim i wkrótce znalazła sposobność, żeby mu go zabrać."
        ru: "Этого Алиса, конечно, не могла вынести, поэтому обошла зал, встала за ним и вскоре нашла случай его отобрать."
        note: "znieść — вынести, стерпеть"
      - pl: " Zrobiła to tak szybko, że biedny mały przysięgły (był to Bill, Jaszczurka) zupełnie nie mógł pojąć, co się z rysikiem stało;"
        ru: "Она сделала это так быстро, что бедный маленький присяжный (это был Билль, Ящерка) совершенно не мог понять, что с грифелем случилось;"
