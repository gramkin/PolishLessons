  - clean: "Alicja nigdy przedtem nie była w sądzie, ale czytała o nim w książkach i była całkiem zadowolona, stwierdziwszy, że zna nazwę niemal wszystkiego, co tam było. „To jest sędzia”, powiedziała sobie, „bo ma tę wielką perukę.”"
    en: "Alice had never been in a court of justice before, but she had read about them in books, and she was quite pleased to find that she knew the name of nearly everything there. “That’s the judge,” she said to herself, “because of his great wig.”"
    draft: true
    chunks:
      - pl: "Alicja nigdy przedtem nie była w sądzie, ale czytała o nim w książkach i była całkiem zadowolona, stwierdziwszy, że zna nazwę niemal wszystkiego, co tam było."
        ru: "Алиса никогда прежде не была в суде, но читала о нём в книгах и была вполне довольна, обнаружив, что знает название почти всего, что там было."
        note: "stwierdziwszy — обнаружив: деепричастие на -wszy"
      - pl: " „To jest sędzia”, powiedziała sobie, „bo ma tę wielką perukę.”"
        ru: "«Это судья», — сказала она себе, — «потому что у него этот большой парик.»"
        note: "peruka — парик"
