  - clean: "— Nie ma obawy — mówię. — Nie wygląda mi na domatora. Ale musimy obmyślić jakiś plan co do okupu. W Summit jakoś nie widać wielkiego poruszenia z powodu jego zniknięcia; ale może jeszcze się nie zorientowali, że go nie ma. Rodzina może myśleć, że nocuje u cioci Jane albo u któregoś z sąsiadów. Tak czy inaczej, dziś na pewno zaczną się o niego niepokoić. Dziś wieczorem musimy przekazać jego ojcu wiadomość z żądaniem dwóch tysięcy dolarów za jego zwrot."
    en: "“No fear of it,” says I. “He don’t seem to be much of a home body. But we’ve got to fix up some plan about the ransom. There don’t seem to be much excitement around Summit on account of his disappearance; but maybe they haven’t realized yet that he’s gone. His folks may think he’s spending the night with Aunt Jane or one of the neighbours. Anyhow, he’ll be missed to-day. To-night we must get a message to his father demanding the two thousand dollars for his return.”"
    draft: true
    chunks:
      - pl: "— Nie ma obawy — mówię. —"
        ru: "— Не бойся, — говорю я. —"
        note: "nie ma obawy — опасаться нечего"
      - pl: " Nie wygląda mi na domatora."
        ru: "Не похож он на домоседа."
        note: "wyglądać na kogoś — выглядеть кем-л.: na + винительный; domator — домосед"
      - pl: " Ale musimy obmyślić jakiś plan co do okupu."
        ru: "Но нам надо придумать какой-то план насчёт выкупа."
        note: "obmyślić — обдумать, придумать; co do + родительный — насчёт"
      - pl: " W Summit jakoś nie widać wielkiego poruszenia z powodu jego zniknięcia;"
        ru: "В Саммите что-то не видно большого переполоха из-за его исчезновения;"
        note: "poruszenie — волнение, переполох; z powodu + родительный — из-за"
      - pl: " ale może jeszcze się nie zorientowali, że go nie ma."
        ru: "но, может, они ещё не сообразили, что его нет."
        note: "zorientować się — сообразить, понять"
      - pl: " Rodzina może myśleć, że nocuje u cioci Jane"
        ru: "Родные могут думать, что он ночует у тёти Джейн"
        note: "nocować u kogoś — ночевать у кого-л."
      - pl: " albo u któregoś z sąsiadów."
        ru: "или у кого-нибудь из соседей."
      - pl: " Tak czy inaczej, dziś na pewno zaczną się o niego niepokoić."
        ru: "Так или иначе, сегодня его наверняка хватятся."
        note: "niepokoić się o kogoś — беспокоиться о ком-л.: o + винительный"
      - pl: " Dziś wieczorem musimy przekazać jego ojcu wiadomość"
        ru: "Сегодня вечером мы должны передать его отцу весточку"
        note: "przekazać — передать"
      - pl: " z żądaniem dwóch tysięcy dolarów za jego zwrot."
        ru: "с требованием двух тысяч долларов за его возвращение."
        note: "żądanie — требование; zwrot — возврат"
    words: { "okupu": okup, "zorientowali": zorientowac, "pewno": pewno, "zwrot": zwrot }
  - clean: "Właśnie wtedy usłyszeliśmy coś w rodzaju okrzyku wojennego, jaki mógł wydać Dawid, kiedy znokautował mistrza Goliata. To Czerwony Wódz wyjął z kieszeni procę i kręcił nią nad głową."
    en: "Just then we heard a kind Of war-whoop, such as David might have emitted when he knocked out the champion Goliath. It was a sling that Red Chief had pulled out of his pocket, and he was whirling it around his head."
    draft: true
    chunks:
