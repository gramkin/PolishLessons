  - clean: "Pański syn jest ukryty w miejscu odległym od Summit. Daremnie byłoby, gdyby Pan lub najzręczniejsi detektywi próbowali go odnaleźć. Jedyne warunki, na jakich może go Pan odzyskać, są bezwzględnie następujące: za jego zwrot żądamy tysiąca pięciuset dolarów w dużych banknotach; pieniądze należy zostawić dziś o północy w tym samym miejscu i w tym samym pudełku co Pańską odpowiedź — jak opisano poniżej. Jeśli zgadza się Pan na te warunki, proszę przysłać odpowiedź na piśmie przez jednego posłańca dziś o wpół do dziewiątej wieczorem. Za Owl Creek, na drodze do Poplar Cove, rosną trzy duże drzewa, mniej więcej sto jardów od siebie, tuż przy płocie pola pszenicy po prawej stronie. U stóp słupka płotu, naprzeciwko trzeciego drzewa, znajdzie się małe tekturowe pudełko. Posłaniec włoży odpowiedź do tego pudełka i natychmiast wróci do Summit. Jeśli spróbuje Pan jakiegokolwiek podstępu albo nie spełni naszego żądania, jak je przedstawiono, nigdy więcej nie zobaczy Pan swojego syna. Jeśli zapłaci Pan żądaną sumę, w ciągu trzech godzin odzyska go Pan cało i zdrowo. Warunki te są ostateczne i jeśli nie przystanie Pan na nie, nie podejmiemy żadnych dalszych prób porozumienia."
    en: "We have your boy concealed in a place far from Summit. It is useless for you or the most skilful detectives to attempt to find him. Absolutely, the only terms on which you can have him restored to you are these: We demand fifteen hundred dollars in large bills for his return; the money to be left at midnight to-night at the same spot and in the same box as your reply—as hereinafter described. If you agree to these terms, send your answer in writing by a solitary messenger to-night at half-past eight o’clock. After crossing Owl Creek, on the road to Poplar Cove, there are three large trees about a hundred yards apart, close to the fence of the wheat field on the right-hand side. At the bottom of the fence-post, opposite the third tree, will be found a small pasteboard box. The messenger will place the answer in this box and return immediately to Summit. If you attempt any treachery or fail to comply with our demand as stated, you will never see your boy again. If you pay the money as demanded, he will be returned to you safe and well within three hours. These terms are final, and if you do not accede to them no further communication will be attempted."
    draft: true
    chunks:
      - pl: "Pański syn jest ukryty w miejscu odległym od Summit."
        ru: "Ваш сын спрятан в месте, далёком от Саммита."
