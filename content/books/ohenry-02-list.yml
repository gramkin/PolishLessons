paragraphs:
  - clean: "— Czemu tak wcześnie wstajesz, Sam? — zapytał Bill."
    en: "“What you getting up so soon for, Sam?” asked Bill."
    draft: true
    chunks:
      - pl: "— Czemu tak wcześnie wstajesz, Sam? —"
        ru: "— Чего ты так рано встаёшь, Сэм? —"
        note: "czemu — разговорное «почему, чего»"
      - pl: " zapytał Bill."
        ru: "спросил Билл."
    words: { "Czemu": co, "wcześnie": wczesnie, "wstajesz": wstawac, "zapytał": zapytac }
  - clean: "— Ja? — mówię. — A, coś mnie łupie w barku. Pomyślałem, że jak posiedzę, to mu ulży."
    en: "“Me?” says I. “Oh, I got a kind of a pain in my shoulder. I thought sitting up would rest it.”"
    draft: true
    chunks:
      - pl: "— Ja? — mówię. —"
        ru: "— Я? — говорю я. —"
      - pl: " A, coś mnie łupie w barku."
        ru: "А, что-то у меня ломит плечо."
        note: "łupać kogoś w czymś — разговорное «ломить» о боли; bark — плечо"
      - pl: " Pomyślałem, że jak posiedzę, to mu ulży."
        ru: "Подумал, что, если посижу, ему полегчает."
        note: "ulżyć czemuś — облегчить: дательный (mu = barkowi)"
    words: { "mówię": mowic, "Pomyślałem": pomyslec, "posiedzę": posiedziec, "ulży": ulzyc }
  - clean: "— Kłamiesz! — mówi Bill. — Boisz się. Miałeś pójść na stos o wschodzie słońca i bałeś się, że on to zrobi. I zrobiłby, gdyby tylko znalazł zapałkę. Czy to nie okropne, Sam? Myślisz, że ktoś zapłaci, żeby takie diablę wróciło do domu?"
    en: "“You’re a liar!” says Bill. “You’re afraid. You was to be burned at sunrise, and you was afraid he’d do it. And he would, too, if he could find a match. Ain’t it awful, Sam? Do you think anybody will pay out money to get a little imp like that back home?”"
    draft: true
    chunks:
      - pl: "— Kłamiesz! — mówi Bill. —"
        ru: "— Врёшь! — говорит Билл. —"
      - pl: " Boisz się."
        ru: "Боишься."
      - pl: " Miałeś pójść na stos o wschodzie słońca"
        ru: "Тебя должны были сжечь на восходе солнца,"
        note: "pójść na stos — пойти на костёр"
      - pl: " i bałeś się, że on to zrobi."
        ru: "и ты боялся, что он это сделает."
      - pl: " I zrobiłby, gdyby tylko znalazł zapałkę."
        ru: "И сделал бы, найди он только спичку."
        note: "gdyby tylko — если бы только"
      - pl: " Czy to nie okropne, Sam?"
        ru: "Ну не ужас ли, Сэм?"
      - pl: " Myślisz, że ktoś zapłaci,"
        ru: "Думаешь, кто-нибудь заплатит,"
      - pl: " żeby takie diablę wróciło do domu?"
        ru: "чтобы такой бесёнок вернулся домой?"
        note: "diablę — чертёнок, бесёнок (средний род)"
    words: { "Kłamiesz": klamac, "stos": stos, "wschodzie": wschod, "słońca": slonce, "okropne": okropny, "zapłaci": zaplacic }
  - clean: "— Jasne — powiedziałem. — Właśnie takie łobuziaki rodzice uwielbiają. A teraz ty i Wódz wstańcie i zróbcie śniadanie, a ja pójdę na szczyt tej góry na zwiad."
    en: "“Sure,” said I. “A rowdy kid like that is just the kind that parents dote on. Now, you and the Chief get up and cook breakfast, while I go up on the top of this mountain and reconnoitre.”"
    draft: true
    chunks:
      - pl: "— Jasne — powiedziałem. —"
        ru: "— Конечно, — сказал я. —"
        note: "jasne — разговорное «конечно»"
      - pl: " Właśnie takie łobuziaki rodzice uwielbiają."
        ru: "Как раз в таких сорванцах родители души не чают."
        note: "łobuziak — сорванец; uwielbiać — обожать"
      - pl: " A teraz ty i Wódz wstańcie i zróbcie śniadanie,"
        ru: "А теперь вы с Вождём вставайте и готовьте завтрак,"
        note: "ty i Wódz — «ты и Вождь», глагол во мн. числе"
      - pl: " a ja pójdę na szczyt tej góry na zwiad."
        ru: "а я схожу на вершину этой горы на разведку."
        note: "zwiad — разведка"
    words: { "uwielbiają": uwielbiac, "Wódz": wodz, "wstańcie": wstac, "śniadanie": sniadanie, "szczyt": szczyt, "zwiad": zwiad }
  - clean: "Wszedłem na szczyt góry i powiodłem wzrokiem po przyległej okolicy. Od strony Summit spodziewałem się ujrzeć krzepkich wieśniaków uzbrojonych w kosy i widły, przeczesujących okolicę w poszukiwaniu nikczemnych porywaczy. Ujrzałem jednak spokojny krajobraz, na którym jedyną plamką był człowiek orzący pole bułanym mułem. Nikt nie przeszukiwał dna strumienia; żaden goniec nie pędził tu i tam, przynosząc zrozpaczonym rodzicom wieść o braku wieści. Nad tą częścią zewnętrznej wierzchniej powierzchni Alabamy, która rozciągała się przed moimi oczami, unosił się sielski nastrój sennej senności. „Może — mówię do siebie — jeszcze nie zauważono, że wilki porwały z owczarni delikatne jagniątko. Niech Bóg ma w opiece wilki!” — mówię i schodzę z góry na śniadanie."
    en: "I went up on the peak of the little mountain and ran my eye over the contiguous vicinity. Over toward Summit I expected to see the sturdy yeomanry of the village armed with scythes and pitchforks beating the countryside for the dastardly kidnappers. But what I saw was a peaceful landscape dotted with one man ploughing with a dun mule. Nobody was dragging the creek; no couriers dashed hither and yon, bringing tidings of no news to the distracted parents. There was a sylvan attitude of somnolent sleepiness pervading that section of the external outward surface of Alabama that lay exposed to my view. “Perhaps,” says I to myself, “it has not yet been discovered that the wolves have borne away the tender lambkin from the fold. Heaven help the wolves!” says I, and I went down the mountain to breakfast."
    draft: true
    chunks:
      - pl: "Wszedłem na szczyt góry"
        ru: "Я поднялся на вершину горы"
        note: "wejść na coś — подняться на что-л.: na + винительный"
      - pl: " i powiodłem wzrokiem po przyległej okolicy."
        ru: "и окинул взглядом прилегающую местность."
        note: "powieść wzrokiem — окинуть взглядом; przyległy — прилегающий"
      - pl: " Od strony Summit spodziewałem się ujrzeć"
        ru: "Со стороны Саммита я ожидал увидеть"
        note: "spodziewać się + инфинитив — ожидать"
      - pl: " krzepkich wieśniaków uzbrojonych w kosy i widły,"
        ru: "крепких селян, вооружённых косами и вилами,"
        note: "uzbrojony w coś — вооружённый чем-л.: w + винительный"
      - pl: " przeczesujących okolicę w poszukiwaniu nikczemnych porywaczy."
        ru: "прочёсывающих окрестности в поисках подлых похитителей."
        note: "przeczesywać — прочёсывать; nikczemny — подлый"
      - pl: " Ujrzałem jednak spokojny krajobraz,"
        ru: "Но увидел я мирный пейзаж,"
      - pl: " na którym jedyną plamką był człowiek"
        ru: "на котором единственным пятнышком был человек,"
      - pl: " orzący pole bułanym mułem."
        ru: "пахавший поле на буланом муле."
        note: "orać — пахать; bułany — буланый"
      - pl: " Nikt nie przeszukiwał dna strumienia;"
        ru: "Никто не обшаривал дно ручья;"
        note: "przeszukiwać — обыскивать"
      - pl: " żaden goniec nie pędził tu i tam,"
        ru: "никакой гонец не носился туда-сюда,"
        note: "goniec — гонец, посыльный"
      - pl: " przynosząc zrozpaczonym rodzicom wieść o braku wieści."
        ru: "принося обезумевшим родителям весть об отсутствии вестей."
        note: "wieść — весть; brak czegoś — отсутствие чего-л."
      - pl: " Nad tą częścią zewnętrznej wierzchniej powierzchni Alabamy,"
        ru: "Над той частью внешней наружной поверхности Алабамы,"
        note: "Сэм нарочно говорит напыщенно и с повторами"
      - pl: " która rozciągała się przed moimi oczami,"
        ru: "что простиралась перед моими глазами,"
        note: "rozciągać się — простираться"
      - pl: " unosił się sielski nastrój sennej senności."
        ru: "витало сельское настроение сонной сонливости."
        note: "sielski — идиллический, сельский; unosić się — витать"
      - pl: " „Może — mówię do siebie —"
        ru: "«Может быть, — говорю я себе, —"
      - pl: " jeszcze nie zauważono,"
        ru: "ещё не заметили,"
        note: "zauważono — безличная форма: «заметили»"
      - pl: " że wilki porwały z owczarni delikatne jagniątko."
        ru: "что волки унесли из овчарни нежного ягнёночка."
        note: "owczarnia — овчарня; jagniątko — ягнёночек"
      - pl: " Niech Bóg ma w opiece wilki!” — mówię"
        ru: "Да хранит Бог волков!» — говорю я"
        note: "mieć kogoś w opiece — оберегать кого-л."
      - pl: " i schodzę z góry na śniadanie."
        ru: "и спускаюсь с горы к завтраку."
        note: "schodzić z czegoś — спускаться с чего-л."
