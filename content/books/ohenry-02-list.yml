        note: "od siebie — друг от друга"
      - pl: " tuż przy płocie pola pszenicy po prawej stronie."
        ru: "у самого забора пшеничного поля по правую руку."
        note: "pszenica — пшеница"
      - pl: " U stóp słupka płotu, naprzeciwko trzeciego drzewa,"
