      - pl: " Daremnie byłoby, gdyby Pan lub najzręczniejsi detektywi próbowali go odnaleźć."
        ru: "Тщетно было бы Вам или самым ловким сыщикам пытаться его найти."
        note: "daremnie — тщетно; Pan с большой буквы — вежливость в письме"
      - pl: " Jedyne warunki, na jakich może go Pan odzyskać, są bezwzględnie następujące:"
        ru: "Единственные условия, на которых Вы можете его вернуть, безусловно таковы:"
        note: "odzyskać — вернуть себе; bezwzględnie — безусловно"
      - pl: " za jego zwrot żądamy tysiąca pięciuset dolarów w dużych banknotach;"
        ru: "за его возвращение мы требуем полторы тысячи долларов крупными купюрами;"
        note: "banknot — купюра"
      - pl: " pieniądze należy zostawić dziś o północy"
        ru: "деньги следует оставить сегодня в полночь"
        note: "należy — следует"
      - pl: " w tym samym miejscu i w tym samym pudełku co Pańską odpowiedź"
