  - clean: "Kiedy dotarłem do jaskini, zastałem Billa przyciśniętego plecami do ściany, ciężko dyszącego, a chłopak groził, że go rozwali kamieniem wielkości połowy kokosa."
    en: "When I got to the cave I found Bill backed up against the side of it, breathing hard, and the boy threatening to smash him with a rock half as big as a cocoanut."
    draft: true
    chunks:
      - pl: "Kiedy dotarłem do jaskini,"
