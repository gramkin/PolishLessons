        ru: "какой мог издать Давид,"
        note: "wydać okrzyk — издать крик"
      - pl: " kiedy znokautował mistrza Goliata."
        ru: "когда нокаутировал чемпиона Голиафа."
        note: "znokautować — нокаутировать"
      - pl: " To Czerwony Wódz wyjął z kieszeni procę"
        ru: "Это Красный Вождь вынул из кармана пращу"
        note: "proca — праща, рогатка"
      - pl: " i kręcił nią nad głową."
