        ru: "пришлите письменный ответ с одним посыльным сегодня в половине девятого вечера."
        note: "na piśmie — в письменном виде; posłaniec — посыльный"
      - pl: " Za Owl Creek, na drodze do Poplar Cove,"
        ru: "За ручьём Оул-Крик, по дороге в Поплар-Ков,"
      - pl: " rosną trzy duże drzewa, mniej więcej sto jardów od siebie,"
