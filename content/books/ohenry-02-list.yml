  - clean: "Odebrałem chłopakowi kamień i jakoś załagodziłem kłótnię. — Jeszcze ci pokażę — mówi dzieciak do Billa. — Jeszcze nikt nie uderzył Czerwonego Wodza, żeby za to nie zapłacił. Strzeż się!"
    en: "I took the rock away from the boy and kind of patched up the argument. “I’ll fix you,” says the kid to Bill. “No man ever yet struck the Red Chief but what he got paid for it. You better beware!”"
    draft: true
    chunks:
