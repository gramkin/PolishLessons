  - clean: "W tych okolicznościach, lordzie Canterville, jestem pewien, że zrozumie pan, jak niemożliwe byłoby dla mnie pozwolić, by pozostały w posiadaniu kogokolwiek z mojej rodziny; a zresztą wszystkie takie próżne świecidełka i fraszki, choćby nie wiem jak stosowne czy nawet niezbędne dla godności brytyjskiej arystokracji, byłyby zupełnie nie na miejscu wśród ludzi wychowanych na surowych, i wierzę, że nieśmiertelnych, zasadach republikańskiej prostoty. Być może powinienem wspomnieć, że Virginii bardzo zależy, aby pozwolił jej pan zatrzymać szkatułkę na pamiątkę pańskiego nieszczęśliwego, choć zbłąkanego przodka. Ponieważ jest ona niezwykle stara, a co za tym idzie, mocno zniszczona, może uzna pan za stosowne spełnić jej prośbę."
    en: "Under these circumstances, Lord Canterville, I feel sure that you will recognize how impossible it would be for me to allow them to remain in the possession of any member of my family; and, indeed, all such vain gauds and toys, however suitable or necessary to the dignity of the British aristocracy, would be completely out of place among those who have been brought up on the severe, and I believe immortal, principles of Republican simplicity. Perhaps I should mention that Virginia is very anxious that you should allow her to retain the box, as a memento of your unfortunate but misguided ancestor. As it is extremely old, and consequently a good deal out of repair, you may perhaps think fit to comply with her request."
    draft: true
