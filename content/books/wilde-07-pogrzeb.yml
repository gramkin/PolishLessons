  - clean: "Pan Otis był mocno zmartwiony odmową lorda Canterville i prosił go, żeby jeszcze raz rozważył swoją decyzję, ale dobroduszny par był nieugięty i w końcu skłonił ministra, by pozwolił córce zatrzymać prezent od ducha, a kiedy wiosną 1890 roku młoda księżna Cheshire została z okazji ślubu przedstawiona na pierwszym przyjęciu u królowej, jej klejnoty budziły powszechny zachwyt. Virginia otrzymała bowiem diadem książęcy, który jest nagrodą wszystkich grzecznych amerykańskich dziewczynek, i wyszła za mąż za swego młodego wielbiciela, gdy tylko osiągnął pełnoletność. Oboje byli tak uroczy i tak bardzo się kochali, że wszyscy cieszyli się z tego małżeństwa, z wyjątkiem starej markizy Dumbleton, która usiłowała złowić księcia dla jednej ze swych siedmiu niezamężnych córek i wydała w tym celu nie mniej niż trzy kosztowne przyjęcia, oraz, rzecz dziwna, samego pana Otisa."
    en: "Mr. Otis was a good deal distressed at Lord Canterville's refusal, and begged him to reconsider his decision, but the good-natured peer was quite firm, and finally induced the Minister to allow his daughter to retain the present the ghost had given her, and when, in the spring of 1890, the young Duchess of Cheshire was presented at the Queen's first drawing-room on the occasion of her marriage, her jewels were the universal theme of admiration. For Virginia received the coronet, which is the reward of all good little American girls, and was married to her boy-lover as soon as he came of age. They were both so charming, and they loved each other so much, that every one was delighted at the match, except the old Marchioness of Dumbleton, who had tried to catch the Duke for one of her seven unmarried daughters, and had given no less than three expensive dinner-parties for that purpose, and, strange to say, Mr. Otis himself."
