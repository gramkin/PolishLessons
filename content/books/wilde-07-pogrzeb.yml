  - clean: "Co do mnie, przyznaję, że jestem mocno zdziwiony, widząc, że moje dziecko okazuje sympatię dla średniowiecza w jakiejkolwiek postaci, i mogę to sobie wytłumaczyć jedynie tym, że Virginia urodziła się na jednym z waszych londyńskich przedmieść wkrótce po tym, jak pani Otis wróciła z podróży do Aten."
    en: "For my own part, I confess I am a good deal surprised to find a child of mine expressing sympathy with mediævalism in any form, and can only account for it by the fact that Virginia was born in one of your London suburbs shortly after Mrs. Otis had returned from a trip to Athens.\""
