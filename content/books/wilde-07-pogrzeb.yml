  - clean: "W rogu cmentarza, tuż pod starym cisem, wykopano głęboki grób, a wielebny Augustus Dampier odprawił nabożeństwo w niezwykle podniosły sposób. Gdy ceremonia dobiegła końca, służba, zgodnie ze starym zwyczajem przestrzeganym w rodzie Canterville'ów, zgasiła pochodnie, a kiedy trumnę opuszczano do grobu, Virginia wystąpiła naprzód i położyła na niej duży krzyż z białych i różowych kwiatów migdałowca. W tej samej chwili księżyc wyszedł zza chmury i zalał małe cmentarzysko swym cichym srebrem, a w dalekim zagajniku zaczął śpiewać słowik. Pomyślała o tym, jak duch opisywał Ogród Śmierci, oczy zaszły jej łzami i przez całą drogę do domu prawie nie odezwała się ani słowem."
    en: "A deep grave had been dug in the corner of the churchyard, just under the old yew-tree, and the service was read in the most impressive manner by the Rev. Augustus Dampier. When the ceremony was over, the servants, according to an old custom observed in the Canterville family, extinguished their torches, and, as the coffin was being lowered into the grave, Virginia stepped forward, and laid on it a large cross made of white and pink almond-blossoms. As she did so, the moon came out from behind a cloud, and flooded with its silent silver the little churchyard, and from a distant copse a nightingale began to sing. She thought of the ghost's description of the Garden of Death, her eyes became dim with tears, and she hardly spoke a word during the drive home."
    draft: true
    chunks:
