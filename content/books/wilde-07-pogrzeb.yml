paragraphs:
  - clean: "Cztery dni po tych dziwnych wydarzeniach, około jedenastej w nocy, z Canterville Chase wyruszył kondukt pogrzebowy. Karawan ciągnęło osiem karych koni, a każdy z nich miał na głowie wielki pióropusz z kołyszących się strusich piór, ołowianą trumnę zaś okrywał bogaty purpurowy całun, na którym złotem wyhaftowano herb Canterville'ów. Obok karawanu i powozów szła służba z zapalonymi pochodniami, a cały orszak robił niezwykle podniosłe wrażenie. Głównym żałobnikiem był lord Canterville, który przyjechał specjalnie z Walii na pogrzeb i siedział w pierwszym powozie razem z małą Virginią. Potem jechał minister Stanów Zjednoczonych z żoną, potem Waszyngton i trzej chłopcy, a w ostatnim powozie pani Umney. Powszechnie uważano, że skoro duch straszył ją przez ponad pięćdziesiąt lat życia, ma prawo odprowadzić go w ostatnią drogę."
    en: "Four days after these curious incidents, a funeral started from Canterville Chase at about eleven o'clock at night. The hearse was drawn by eight black horses, each of which carried on its head a great tuft of nodding ostrich-plumes, and the leaden coffin was covered by a rich purple pall, on which was embroidered in gold the Canterville coat-of-arms. By the side of the hearse and the coaches walked the servants with lighted torches, and the whole procession was wonderfully impressive. Lord Canterville was the chief mourner, having come up specially from Wales to attend the funeral, and sat in the first carriage along with little Virginia. Then came the United States Minister and his wife, then Washington and the three boys, and in the last carriage was Mrs. Umney. It was generally felt that, as she had been frightened by the ghost for more than fifty years of her life, she had a right to see the last of him."
    draft: true
