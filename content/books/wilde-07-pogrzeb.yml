  - clean: "— Milordzie — powiedział — wiem, że w tym kraju zasada martwej ręki stosuje się do błyskotek tak samo jak do ziemi, i jest dla mnie zupełnie jasne, że te klejnoty są albo powinny być pamiątkami rodowymi w pańskiej rodzinie. Muszę więc prosić pana, aby zabrał je pan ze sobą do Londynu i uważał je po prostu za część swojej własności, która wróciła do pana w pewnych dziwnych okolicznościach. Co do mojej córki, to jest jeszcze tylko dzieckiem i, z radością to stwierdzam, mało ją dotąd obchodzą takie akcesoria próżnego zbytku. Pani Otis, która, mogę to powiedzieć, jest niemałym autorytetem w dziedzinie sztuki — miała bowiem przywilej spędzić w młodości kilka zim w Bostonie — poinformowała mnie także, że te kamienie mają wielką wartość pieniężną i gdyby wystawić je na sprzedaż, przyniosłyby wysoką cenę."
    en: "\"My lord,\" he said, \"I know that in this country mortmain is held to apply to trinkets as well as to land, and it is quite clear to me that these jewels are, or should be, heirlooms in your family. I must beg you, accordingly, to take them to London with you, and to regard them simply as a portion of your property which has been restored to you under certain strange conditions. As for my daughter, she is merely a child, and has as yet, I am glad to say, but little interest in such appurtenances of idle luxury. I am also informed by Mrs. Otis, who, I may say, is no mean authority upon Art,--having had the privilege of spending several winters in Boston when she was a girl,--that these gems are of great monetary worth, and if offered for sale would fetch a tall price."
    draft: true
