  - clean: "Pan Otis bardzo lubił młodego księcia jako człowieka, ale teoretycznie był przeciwny tytułom i, mówiąc jego własnymi słowami, „nie był wolny od obawy, że wśród zniewieściałych wpływów lubującej się w przyjemnościach arystokracji mogą pójść w zapomnienie prawdziwe zasady republikańskiej prostoty”. Jego sprzeciwy zostały jednak całkowicie odrzucone i sądzę, że kiedy szedł nawą kościoła św. Jerzego na Hanover Square, z córką wspartą na jego ramieniu, nie było dumniejszego człowieka na całej długości i szerokości Anglii."
    en: "Mr. Otis was extremely fond of the young Duke personally, but, theoretically, he objected to titles, and, to use his own words, \"was not without apprehension lest, amid the enervating influences of a pleasure-loving aristocracy, the true principles of Republican simplicity should be forgotten.\" His objections, however, were completely overruled, and I believe that when he walked up the aisle of St. George's, Hanover Square, with his daughter leaning on his arm, there was not a prouder man in the whole length and breadth of England."
