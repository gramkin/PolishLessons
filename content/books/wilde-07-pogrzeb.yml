  - clean: "Następnego ranka, zanim lord Canterville wyjechał do Londynu, pan Otis odbył z nim rozmowę w sprawie klejnotów, które duch dał Virginii. Były zupełnie wspaniałe, zwłaszcza pewien rubinowy naszyjnik w starej weneckiej oprawie, prawdziwie wspaniały okaz szesnastowiecznej roboty, a ich wartość była tak wielka, że pan Otis miał poważne skrupuły, czy pozwolić córce je przyjąć."
    en: "The next morning, before Lord Canterville went up to town, Mr. Otis had an interview with him on the subject of the jewels the ghost had given to Virginia. They were perfectly magnificent, especially a certain ruby necklace with old Venetian setting, which was really a superb specimen of sixteenth-century work, and their value was so great that Mr. Otis felt considerable scruples about allowing his daughter to accept them."
