  - clean: "Lord Canterville wysłuchał przemowy zacnego ministra bardzo poważnie, od czasu do czasu podkręcając siwego wąsa, żeby ukryć mimowolny uśmiech, a gdy pan Otis skończył, serdecznie uścisnął mu rękę i rzekł: — Drogi panie, pańska urocza córeczka oddała mojemu nieszczęsnemu przodkowi, sir Simonowi, bardzo ważną przysługę, a ja i moja rodzina jesteśmy jej bardzo zobowiązani za jej cudowną odwagę i hart ducha. Klejnoty niewątpliwie należą do niej, i, na honor, sądzę, że gdybym był tak bez serca, żeby jej je odebrać, ten stary nikczemnik w dwa tygodnie wylazłby z grobu i zrobiłby mi z życia piekło. Co zaś do tego, że miałyby być pamiątkami rodowymi, to pamiątką rodową jest tylko to, co jako takie wymieniono w testamencie lub dokumencie prawnym, a o istnieniu tych klejnotów nikt nie miał pojęcia."
