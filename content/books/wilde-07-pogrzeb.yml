  - clean: "Książę i księżna po miodowym miesiącu pojechali do Canterville Chase, a nazajutrz po przyjeździe wybrali się po południu na samotny cmentarz przy sosnowym lesie. Z początku było wiele kłopotu z napisem na nagrobku sir Simona, ale w końcu postanowiono wyryć na nim po prostu inicjały starego dżentelmena i wiersz z okna biblioteki. Księżna przyniosła ze sobą prześliczne róże, którymi usłała grób, a postawszy przy nim przez jakiś czas, zawędrowali do zrujnowanego prezbiterium starego opactwa. Tam księżna usiadła na przewróconej kolumnie, a jej mąż położył się u jej stóp, paląc papierosa i patrząc w jej piękne oczy. Nagle odrzucił papierosa, ujął jej dłoń i powiedział: — Virginio, żona nie powinna mieć tajemnic przed mężem."
    en: "The Duke and Duchess, after the honeymoon was over, went down to Canterville Chase, and on the day after their arrival they walked over in the afternoon to the lonely churchyard by the pine-woods. There had been a great deal of difficulty at first about the inscription on Sir Simon's tombstone, but finally it had been decided to engrave on it simply the initials of the old gentleman's name, and the verse from the library window. The Duchess had brought with her some lovely roses, which she strewed upon the grave, and after they had stood by it for some time they strolled into the ruined chancel of the old abbey. There the Duchess sat down on a fallen pillar, while her husband lay at her feet smoking a cigarette and looking up at her beautiful eyes. Suddenly he threw his cigarette away, took hold of her hand, and said to her, \"Virginia, a wife should have no secrets from her husband.\""
