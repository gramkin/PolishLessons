  - clean: "Miesiące przychodziły i odchodziły, a oni kluczyli tam i z powrotem przez niezbadane bezkresy, gdzie nie było ludzi, a jednak gdzie ludzie bywali, jeśli Zaginiona Chata była prawdą. Przechodzili przez działy wodne w letnich zamieciach, drżeli w północnym słońcu na nagich górach między granicą lasu a wiecznym śniegiem, schodzili do letnich dolin pośród rojów komarów i much, a w cieniu lodowców zbierali poziomki i kwiaty tak dojrzałe i piękne jak te, którymi mogło się szczycić Południe."
    en: "The months came and went, and back and forth they twisted through the uncharted vastness, where no men were and yet where men had been if the Lost Cabin were true. They went across divides in summer blizzards, shivered under the midnight sun on naked mountains between the timber line and the eternal snows, dropped into summer valleys amid swarming gnats and flies, and in the shadows of glaciers picked strawberries and flowers as ripe and fair as any the Southland could boast."
    draft: true
    chunks:
      - pl: "Miesiące przychodziły i odchodziły, a oni kluczyli tam i z powrotem przez niezbadane bezkresy,"
        ru: "Месяцы приходили и уходили, а они петляли туда и обратно по неизведанным просторам,"
        note: "kluczyć — петлять; bezkres — бескрайность"
      - pl: " gdzie nie było ludzi, a jednak gdzie ludzie bywali, jeśli Zaginiona Chata była prawdą."
        ru: "где не было людей и где всё же люди бывали, если Затерянная Хижина была правдой."
