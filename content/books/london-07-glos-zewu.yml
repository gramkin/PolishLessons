paragraphs:
  - clean: "Kiedy Buck zarobił dla Johna Thorntona tysiąc sześćset dolarów w pięć minut, umożliwił swojemu panu spłacenie pewnych długów i wyruszenie ze wspólnikami na Wschód w poszukiwaniu legendarnej zaginionej kopalni, której historia była tak stara jak historia tego kraju. Wielu ludzi jej szukało; niewielu ją znalazło; a sporo było takich, którzy z tych poszukiwań nigdy nie wrócili."
    en: "When Buck earned sixteen hundred dollars in five minutes for John Thornton, he made it possible for his master to pay off certain debts and to journey with his partners into the East after a fabled lost mine, the history of which was as old as the history of the country. Many men had sought it; few had found it; and more than a few there were who had never returned from the quest."
    draft: true
    chunks:
      - pl: "Kiedy Buck zarobił dla Johna Thorntona tysiąc sześćset dolarów w pięć minut, umożliwił swojemu panu spłacenie pewnych długów"
        ru: "Когда Бэк заработал для Джона Торнтона тысячу шестьсот долларов за пять минут, он дал хозяину возможность расплатиться с кое-какими долгами"
        note: "spłacić — выплатить; dług — долг"
      - pl: " i wyruszenie ze wspólnikami na Wschód w poszukiwaniu legendarnej zaginionej kopalni, której historia była tak stara jak historia tego kraju."
        ru: "и отправиться с компаньонами на Восток на поиски легендарного затерянного рудника, история которого была так же стара, как история этого края."
        note: "zaginiony — затерянный, пропавший"
      - pl: " Wielu ludzi jej szukało; niewielu ją znalazło; a sporo było takich, którzy z tych poszukiwań nigdy nie wrócili."
        ru: "Многие его искали; немногие нашли; а немало было и таких, кто из этих поисков не вернулся."
    words: { "zaginionej": zaginiony, "kopalni": kopalnia, "sporo": sporo, "poszukiwań": poszukiwanie }
  - clean: "Ta zaginiona kopalnia była przesiąknięta tragedią i spowita tajemnicą. Nikt nie wiedział nic o pierwszym człowieku. Najstarsza tradycja urywała się, zanim do niego dotarła. Od samego początku była stara, rozpadająca się chata. Umierający zaklinali się, że istnieje ona i kopalnia, której położenie wskazywała, przypieczętowując swoje świadectwo samorodkami, które nie przypominały żadnego znanego gatunku złota na Północy."
    en: "This lost mine was steeped in tragedy and shrouded in mystery. No one knew of the first man. The oldest tradition stopped before it got back to him. From the beginning there had been an ancient and ramshackle cabin. Dying men had sworn to it, and to the mine the site of which it marked, clinching their testimony with nuggets that were unlike any known grade of gold in the Northland."
    draft: true
    chunks:
      - pl: "Ta zaginiona kopalnia była przesiąknięta tragedią i spowita tajemnicą."
        ru: "Этот затерянный рудник был пропитан трагедией и окутан тайной."
        note: "przesiąknięty — пропитанный; spowity — окутанный"
      - pl: " Nikt nie wiedział nic o pierwszym człowieku."
        ru: "Никто ничего не знал о первом человеке."
      - pl: " Najstarsza tradycja urywała się, zanim do niego dotarła."
        ru: "Самое старое предание обрывалось, не дойдя до него."
        note: "urywać się — обрываться"
      - pl: " Od samego początku była stara, rozpadająca się chata."
        ru: "С самого начала была старая, разваливающаяся хижина."
      - pl: " Umierający zaklinali się, że istnieje ona i kopalnia, której położenie wskazywała,"
        ru: "Умирающие клялись, что она существует, как и рудник, чьё место она отмечала,"
        note: "zaklinać się — клясться, божиться"
      - pl: " przypieczętowując swoje świadectwo samorodkami, które nie przypominały żadnego znanego gatunku złota na Północy."
        ru: "скрепляя свои показания самородками, не похожими ни на один известный сорт золота на Севере."
        note: "przypieczętować — скрепить; samorodek — самородок"
