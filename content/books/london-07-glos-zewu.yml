        ru: "а расписание определяло безграничное будущее."
        note: "rozkład jazdy — расписание"
    words: { "garścią": garsc, "karabinem": karabin, "dziennej": dzienny, "Indianin": indianin, "amunicji": amunicja, "rozkład": rozklad }
  - clean: "Dla Bucka była to bezgraniczna rozkosz — to polowanie, łowienie ryb i bezcelowe wędrowanie przez obce miejsca. Całymi tygodniami posuwali się wytrwale naprzód, dzień po dniu; a całymi tygodniami obozowali tu i tam: psy próżnowały, a ludzie wypalali dziury w zamarzniętym mule i żwirze i przy cieple ogniska przepłukiwali niezliczone płuczki ziemi. Czasem głodowali, czasem ucztowali hucznie, zależnie od obfitości zwierzyny i szczęścia w łowach. Przyszło lato i psy i ludzie nieśli juki na grzbietach, przeprawiali się tratwami przez błękitne górskie jeziora i spływali lub płynęli w górę nieznanych rzek w smukłych łodziach, wyciętych piłą z rosnącego lasu."
    en: "To Buck it was boundless delight, this hunting, fishing, and indefinite wandering through strange places. For weeks at a time they would hold on steadily, day after day; and for weeks upon end they would camp, here and there, the dogs loafing and the men burning holes through frozen muck and gravel and washing countless pans of dirt by the heat of the fire. Sometimes they went hungry, sometimes they feasted riotously, all according to the abundance of game and the fortune of hunting. Summer arrived, and dogs and men packed on their backs, rafted across blue mountain lakes, and descended or ascended unknown rivers in slender boats whipsawed from the standing forest."
    draft: true
    chunks:
      - pl: "Dla Bucka była to bezgraniczna rozkosz — to polowanie, łowienie ryb i bezcelowe wędrowanie przez obce miejsca."
