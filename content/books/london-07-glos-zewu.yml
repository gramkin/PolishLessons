  - clean: "John Thornton niewiele wymagał od ludzi i od przyrody. Nie bał się dzikich ostępów. Z garścią soli i karabinem mógł zanurzyć się w dzicz i wędrować, dokąd chciał i jak długo chciał. Nie spiesząc się, na sposób indiański, polował na obiad w ciągu dziennej drogi; a jeśli go nie znalazł, jak Indianin szedł dalej, pewien, że prędzej czy później na niego natrafi. Tak więc w tej wielkiej podróży na Wschód jadłospis stanowiło samo mięso, ładunek na saniach składał się głównie z amunicji i narzędzi, a rozkład jazdy wyznaczała bezgraniczna przyszłość."
    en: "John Thornton asked little of man or nature. He was unafraid of the wild. With a handful of salt and a rifle he could plunge into the wilderness and fare wherever he pleased and as long as he pleased. Being in no haste, Indian fashion, he hunted his dinner in the course of the day’s travel; and if he failed to find it, like the Indian, he kept on travelling, secure in the knowledge that sooner or later he would come to it. So, on this great journey into the East, straight meat was the bill of fare, ammunition and tools principally made up the load on the sled, and the time-card was drawn upon the limitless future."
    draft: true
    chunks:
      - pl: "John Thornton niewiele wymagał od ludzi i od przyrody."
        ru: "Джон Торнтон немногого требовал от людей и от природы."
      - pl: " Nie bał się dzikich ostępów."
        ru: "Он не боялся дикой глуши."
        note: "ostęp — глухомань, дебри"
      - pl: " Z garścią soli i karabinem mógł zanurzyć się w dzicz i wędrować, dokąd chciał i jak długo chciał."
        ru: "С горстью соли и винтовкой он мог углубиться в дебри и бродить где хотел и сколько хотел."
        note: "garść — горсть; karabin — винтовка"
      - pl: " Nie spiesząc się, na sposób indiański, polował na obiad w ciągu dziennej drogi;"
        ru: "Не торопясь, на индейский лад, он добывал себе обед в течение дневного перехода;"
      - pl: " a jeśli go nie znalazł, jak Indianin szedł dalej, pewien, że prędzej czy później na niego natrafi."
        ru: "а если не находил, то, как индеец, шёл дальше, уверенный, что рано или поздно на него наткнётся."
      - pl: " Tak więc w tej wielkiej podróży na Wschód jadłospis stanowiło samo mięso, ładunek na saniach składał się głównie z amunicji i narzędzi,"
        ru: "Так что в этом великом походе на Восток меню состояло из одного мяса, груз на санях — главным образом из патронов и инструментов,"
        note: "jadłospis — меню"
