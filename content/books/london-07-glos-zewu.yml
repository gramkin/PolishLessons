  - clean: "I tu może się skończyć historia Bucka. Nie minęło wiele lat, gdy Yeehatowie zauważyli zmianę w rasie wilków leśnych; widywano bowiem niektóre z brązowymi plamami na łbie i pysku i z białym pasem biegnącym środkiem piersi. Ale bardziej niezwykłe jest to, że Yeehatowie opowiadają o Psie Widmie, który biegnie na czele watahy. Boją się tego Psa Widma, bo jest przebieglejszy od nich: w srogie zimy kradnie z ich obozów, ogałaca ich sidła, zabija ich psy i urąga ich najdzielniejszym myśliwym."
    en: "And here may well end the story of Buck. The years were not many when the Yeehats noted a change in the breed of timber wolves; for some were seen with splashes of brown on head and muzzle, and with a rift of white centring down the chest. But more remarkable than this, the Yeehats tell of a Ghost Dog that runs at the head of the pack. They are afraid of this Ghost Dog, for it has cunning greater than they, stealing from their camps in fierce winters, robbing their traps, slaying their dogs, and defying their bravest hunters."
