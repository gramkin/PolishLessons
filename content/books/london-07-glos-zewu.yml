  - clean: "Ale żaden żywy człowiek nie złupił tego skarbca, a umarli byli umarli; dlatego John Thornton, Pete i Hans, z Buckiem i pół tuzinem innych psów, ruszyli na Wschód nieznanym szlakiem, by dokonać tego, czego nie dokonali ludzie i psy nie gorsi od nich. Przejechali saniami sto dziesięć kilometrów w górę Jukonu, skręcili w lewo w rzekę Stewart, minęli Mayo i McQuestion i parli naprzód, aż sama Stewart zmieniła się w strumyk, wijący się między wyniosłymi szczytami, które wyznaczały grzbiet kontynentu."
    en: "But no living man had looted this treasure house, and the dead were dead; wherefore John Thornton and Pete and Hans, with Buck and half a dozen other dogs, faced into the East on an unknown trail to achieve where men and dogs as good as themselves had failed. They sledded seventy miles up the Yukon, swung to the left into the Stewart River, passed the Mayo and the McQuestion, and held on until the Stewart itself became a streamlet, threading the upstanding peaks which marked the backbone of the continent."
    draft: true
    chunks:
      - pl: "Ale żaden żywy człowiek nie złupił tego skarbca, a umarli byli umarli;"
        ru: "Но ни один живой человек не разграбил эту сокровищницу, а мёртвые были мертвы;"
        note: "złupić — разграбить; skarbiec — сокровищница"
      - pl: " dlatego John Thornton, Pete i Hans, z Buckiem i pół tuzinem innych psów, ruszyli na Wschód nieznanym szlakiem,"
        ru: "поэтому Джон Торнтон, Пит и Ганс с Бэком и полудюжиной других собак двинулись на Восток неведомой тропой,"
      - pl: " by dokonać tego, czego nie dokonali ludzie i psy nie gorsi od nich."
        ru: "чтобы добиться того, в чём потерпели неудачу люди и собаки не хуже их."
      - pl: " Przejechali saniami sto dziesięć kilometrów w górę Jukonu, skręcili w lewo w rzekę Stewart, minęli Mayo i McQuestion"
        ru: "Они проехали на санях сто десять километров вверх по Юкону, свернули влево в реку Стюарт, миновали Мейо и Мак-Квещен"
      - pl: " i parli naprzód, aż sama Stewart zmieniła się w strumyk, wijący się między wyniosłymi szczytami, które wyznaczały grzbiet kontynentu."
        ru: "и шли дальше, пока сама Стюарт не превратилась в ручеёк, вьющийся между высокими пиками, что обозначали хребет континента."
        note: "przeć — напирать, продвигаться; wyniosły — высокий, величавый"
