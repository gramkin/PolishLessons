  - clean: "Co więcej, opowieść staje się gorsza. Są myśliwi, którzy nie wracają do obozu, i byli myśliwi, których współplemieńcy znaleźli z okrutnie rozdartymi gardłami, a wokół nich w śniegu ślady wilcze większe niż ślady jakiegokolwiek wilka. Każdej jesieni, gdy Yeehatowie podążają za wędrówką łosi, jest pewna dolina, do której nigdy nie wchodzą. I są kobiety, które smutnieją, gdy przy ognisku przechodzi z ust do ust opowieść o tym, jak Zły Duch wybrał tę dolinę na swoje siedlisko."
    en: "Nay, the tale grows worse. Hunters there are who fail to return to the camp, and hunters there have been whom their tribesmen found with throats slashed cruelly open and with wolf prints about them in the snow greater than the prints of any wolf. Each fall, when the Yeehats follow the movement of the moose, there is a certain valley which they never enter. And women there are who become sad when the word goes over the fire of how the Evil Spirit came to select that valley for an abiding-place."
