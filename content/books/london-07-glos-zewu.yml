  - clean: "Jesienią dotarli do niesamowitej krainy jezior, smutnej i cichej, gdzie kiedyś bywało dzikie ptactwo, ale gdzie wtedy nie było życia ani śladu życia — tylko powiew zimnych wiatrów, tworzący się lód w osłoniętych miejscach i melancholijny plusk fal na samotnych plażach."
    en: "In the fall of the year they penetrated a weird lake country, sad and silent, where wildfowl had been, but where then there was no life nor sign of life—only the blowing of chill winds, the forming of ice in sheltered places, and the melancholy rippling of waves on lonely beaches."
    draft: true
    chunks:
      - pl: "Jesienią dotarli do niesamowitej krainy jezior, smutnej i cichej, gdzie kiedyś bywało dzikie ptactwo,"
