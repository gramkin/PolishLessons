  - clean: "Latem jednak ta dolina ma jednego gościa, o którym Yeehatowie nie wiedzą. Jest to wielki wilk o wspaniałym futrze, podobny, a zarazem niepodobny do wszystkich innych wilków. Przechodzi samotnie z uśmiechniętej krainy lasów i schodzi na polanę między drzewami. Tutaj żółty strumień wypływa ze spróchniałych worków z łosiowej skóry i wsiąka w ziemię, a przez niego przerastają wysokie trawy i zarasta go próchnica, kryjąc jego żółć przed słońcem; i tu wilk rozmyśla przez chwilę i zawywszy raz, długo i żałośnie, odchodzi."
    en: "In the summers there is one visitor, however, to that valley, of which the Yeehats do not know. It is a great, gloriously coated wolf, like, and yet unlike, all other wolves. He crosses alone from the smiling timber land and comes down into an open space among the trees. Here a yellow stream flows from rotted moose-hide sacks and sinks into the ground, with long grasses growing through it and vegetable mould overrunning it and hiding its yellow from the sun; and here he muses for a time, howling once, long and mournfully, ere he departs."
