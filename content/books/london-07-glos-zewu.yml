  - clean: "I przez kolejną zimę wędrowali po zatartych szlakach ludzi, którzy byli tu przed nimi. Raz natrafili na ścieżkę wyrąbaną przez las, starą ścieżkę, i Zaginiona Chata wydawała się bardzo bliska. Ale ścieżka zaczynała się znikąd i kończyła nigdzie, i pozostała tajemnicą, tak jak tajemnicą pozostał człowiek, który ją zrobił, i powód, dla którego ją zrobił. Innym razem trafili na naznaczone czasem szczątki myśliwskiej chaty, a wśród strzępów zbutwiałych koców John Thornton znalazł długolufową flintę skałkową."
    en: "And through another winter they wandered on the obliterated trails of men who had gone before. Once, they came upon a path blazed through the forest, an ancient path, and the Lost Cabin seemed very near. But the path began nowhere and ended nowhere, and it remained mystery, as the man who made it and the reason he made it remained mystery. Another time they chanced upon the time-graven wreckage of a hunting lodge, and amid the shreds of rotted blankets John Thornton found a long-barrelled flint-lock."
    draft: true
    chunks:
      - pl: "I przez kolejną zimę wędrowali po zatartych szlakach ludzi, którzy byli tu przed nimi."
        ru: "И ещё одну зиму они бродили по затёртым тропам людей, побывавших здесь до них."
        note: "zatarty — стёртый"
