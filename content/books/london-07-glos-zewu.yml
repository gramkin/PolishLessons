        note: "wyrąbać — прорубить"
      - pl: " Ale ścieżka zaczynała się znikąd i kończyła nigdzie, i pozostała tajemnicą,"
        ru: "Но тропа начиналась ниоткуда и кончалась нигде, и осталась тайной,"
      - pl: " tak jak tajemnicą pozostał człowiek, który ją zrobił, i powód, dla którego ją zrobił."
        ru: "как тайной остался человек, проложивший её, и причина, по которой он её проложил."
      - pl: " Innym razem trafili na naznaczone czasem szczątki myśliwskiej chaty,"
