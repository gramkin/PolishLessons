  - clean: "Pięć kilometrów od obozu natrafił na świeży trop, od którego sierść na karku zafalowała mu i się zjeżyła. Prowadził prosto do obozu i do Johna Thorntona. Buck pospieszył naprzód, szybko i ukradkiem, z każdym nerwem napiętym, wyczulony na mnóstwo szczegółów, które opowiadały historię — całą prócz zakończenia. Nos podawał mu zmienny opis przejścia życia, za którym podążał. Zauważył brzemienną ciszę lasu. Ptaki odleciały. Wiewiórki się pochowały. Widział tylko jedną — gładką, szarą, przywartą do szarej, martwej gałęzi tak, że zdawała się jej częścią, drewnianą naroślą na samym drewnie."
    en: "Three miles away he came upon a fresh trail that sent his neck hair rippling and bristling, It led straight toward camp and John Thornton. Buck hurried on, swiftly and stealthily, every nerve straining and tense, alert to the multitudinous details which told a story—all but the end. His nose gave him a varying description of the passage of the life on the heels of which he was travelling. He remarked the pregnant silence of the forest. The bird life had flitted. The squirrels were in hiding. One only he saw,—a sleek gray fellow, flattened against a gray dead limb so that he seemed a part of it, a woody excrescence upon the wood itself."
