        ru: "и если бы небо отпечатало свою печать"
      - pl: "\nNa takim wosku z bezpośrednią siłą,"
        ru: "на таком воске с непосредственной силой,"
      - pl: "\nByłaby widną idealność cała!"
        ru: "была бы видна вся идеальность!"
      - pl: "\nAle natura, którą błąd przesiąka"
        ru: "Но природа, которую пропитывает ошибка,"
      - pl: "\nPodobnie jako ziemski sztukmistrz działa,"
        ru: "действует подобно земному мастеру,"
      - pl: "\nZna on swą sztukę; lecz drży jego ręka."
