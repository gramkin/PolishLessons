  - clean: "I że w pierś ową, co włócznią przebita,\nSpełniając bożą sprawiedliwość w chwale,\nMimo ciężaru naszych win i złości\nWagą swych zasług przechyliła szalę,\nTyle wlał światła, ile jego złożył\nW naturze ludzkiej, czym ją uwielmożył,\nTen, który pierwsze jak i drugą stworzył."
    verse: true
    chunks:
      - pl: "I że w pierś ową, co włócznią przebita,"
        ru: "и в ту грудь, что, пронзённая копьём,"
        note: "Христос"
