        ru: "исполняя Божью справедливость во славе,"
      - pl: "\nMimo ciężaru naszych win i złości"
        ru: "несмотря на тяжесть наших вин и злобы,"
      - pl: "\nWagą swych zasług przechyliła szalę,"
        ru: "перевесила чашу весом своих заслуг,"
      - pl: "\nTyle wlał światła, ile jego złożył"
        ru: "столько света влил, сколько его вложил"
      - pl: "\nW naturze ludzkiej, czym ją uwielmożył,"
        ru: "в человеческую природу, чем её возвеличил,"
      - pl: "\nTen, który pierwsze jak i drugą stworzył."
        ru: "Тот, кто создал и первого, и второго."
