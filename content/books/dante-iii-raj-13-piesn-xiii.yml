  - clean: "Kto chcesz zrozumieć i rozważyć ściślej,\nCom wtedy widział, utwórz obraz w głowie\nI taki obraz, podczas gdy ja mówię,\nMocno jak skała niech stoi w twej myśli.\nGwiazd ci piętnaście wyobrazić trzeba,\nOświecających różne części nieba\nTaką światłością, co przez chmur zasłonę\nPrzenika na skroś powietrze zgęszczone;\nSchwyć wóz gwiaździsty wyobraźni okiem,\nCo się po niebie toczy tak szerokiem,\nŻe choć zawraca dyszlem dniem i nocą,\nWciąż nam promienie jego kół migocą;"
    verse: true
    chunks:
      - pl: "Kto chcesz zrozumieć i rozważyć ściślej,"
        ru: "Кто хочешь понять и точнее взвесить"
      - pl: "\nCom wtedy widział, utwórz obraz w głowie"
        ru: "то, что я тогда видел, создай образ в голове,"
      - pl: "\nI taki obraz, podczas gdy ja mówię,"
        ru: "и пусть этот образ, пока я говорю,"
      - pl: "\nMocno jak skała niech stoi w twej myśli."
        ru: "стоит в твоей мысли крепко, как скала."
      - pl: "\nGwiazd ci piętnaście wyobrazić trzeba,"
        ru: "Нужно вообразить тебе пятнадцать звёзд,"
      - pl: "\nOświecających różne części nieba"
        ru: "освещающих разные части неба"
      - pl: "\nTaką światłością, co przez chmur zasłonę"
        ru: "таким светом, что сквозь покров туч"
      - pl: "\nPrzenika na skroś powietrze zgęszczone;"
        ru: "насквозь проникает сгустившийся воздух;"
      - pl: "\nSchwyć wóz gwiaździsty wyobraźni okiem,"
        ru: "схвати глазом воображения звёздный Воз,"
      - pl: "\nCo się po niebie toczy tak szerokiem,"
        ru: "что катится по небу так широко,"
      - pl: "\nŻe choć zawraca dyszlem dniem i nocą,"
        ru: "что, хоть поворачивает дышлом днём и ночью,"
      - pl: "\nWciąż nam promienie jego kół migocą;"
        ru: "всё мерцают нам лучи его колёс;"
    words: { "rozważyć": rozwazyc, "ściślej": scisle, "zasłonę": zaslona, "toczy": toczyc, "zawraca": zawracac, "promienie": promien }
  - clean: "Wyobraź jeszcze zwierzę, co otwiera\nDwoje ócz złotych na krańcu tej osi,\nWokoło której pierwsza krąży sfera;\nI że na niebie te gwiazdy osobne,\nŁącząc się, tworzą dwa znaki podobne\nDo dwoistego wieńca Aryjadny\nW chwili, gdy czuła chłód śmierci bezwładny;\nI że przeciwny wir kół je unosi,\nChociaż w ten sposób prąd ich biegu żenie,\nŻe wzajem swoje mieszają promienie;"
    verse: true
    chunks:
      - pl: "Wyobraź jeszcze zwierzę, co otwiera"
        ru: "вообрази ещё зверя, что открывает"
        note: "рог Малой Медведицы"
      - pl: "\nDwoje ócz złotych na krańcu tej osi,"
        ru: "два золотых глаза на краю той оси,"
      - pl: "\nWokoło której pierwsza krąży sfera;"
        ru: "вокруг которой кружится первая сфера;"
      - pl: "\nI że na niebie te gwiazdy osobne,"
        ru: "и что на небе эти отдельные звёзды,"
      - pl: "\nŁącząc się, tworzą dwa znaki podobne"
        ru: "соединяясь, образуют два знака, подобных"
      - pl: "\nDo dwoistego wieńca Aryjadny"
        ru: "двойному венцу Ариадны"
      - pl: "\nW chwili, gdy czuła chłód śmierci bezwładny;"
        ru: "в тот миг, когда она почувствовала бессильный холод смерти;"
      - pl: "\nI że przeciwny wir kół je unosi,"
        ru: "и что противоположный вихрь колёс их уносит,"
      - pl: "\nChociaż w ten sposób prąd ich biegu żenie,"
        ru: "хоть так гонит течение их бега,"
        note: "żenie — гонит"
      - pl: "\nŻe wzajem swoje mieszają promienie;"
        ru: "что они взаимно смешивают свои лучи;"
    words: { "krąży": krazyc, "osobne": osobny, "bezwładny": bezwladny, "przeciwny": przeciwny, "prąd": prad, "biegu": bieg }
  - clean: "Wtedy mieć będziesz słaby odblask wzoru,\nRzeczywistego obraz gwiazdozbioru\nI podwójnego tańca, co z zapałem\nWokoło punktu ruszał się, gdzie stałem.\nCom kiedy widział, wszystko przy tym blednie,\nPrzewyższa nasze widzenia uprzednie,\nJak bieg najszybszej sfery porównany\nZ biegiem fal naszej leniwej Chijany."
    verse: true
    chunks:
      - pl: "Wtedy mieć będziesz słaby odblask wzoru,"
        ru: "тогда у тебя будет слабый отблеск образца,"
      - pl: "\nRzeczywistego obraz gwiazdozbioru"
        ru: "образ действительного созвездия"
      - pl: "\nI podwójnego tańca, co z zapałem"
        ru: "и двойной пляски, что с пылом"
      - pl: "\nWokoło punktu ruszał się, gdzie stałem."
        ru: "двигалась вокруг точки, где я стоял."
      - pl: "\nCom kiedy widział, wszystko przy tym blednie,"
        ru: "Что я когда-либо видел, всё бледнеет перед этим,"
      - pl: "\nPrzewyższa nasze widzenia uprzednie,"
        ru: "оно превосходит наши прежние видения,"
      - pl: "\nJak bieg najszybszej sfery porównany"
        ru: "как бег самой быстрой сферы в сравнении"
      - pl: "\nZ biegiem fal naszej leniwej Chijany."
        ru: "с течением волн нашей ленивой Кьяны."
    words: { "słaby": slaby, "wzoru": wzor, "podwójnego": podwojny, "tańca": taniec, "porównany": porownac, "leniwej": leniwy }
  - clean: "Tam pieśń Bachusa, Peana nie cześci,\nLecz trzy Osoby jednej boskiej treści,\nW jednej Osobie, jak dwie zlane głoski,\nBożej z naturą ludzką zjednoczenie.\nTańce i pieśni ucichły ucięte\nI ku nam światła spoglądały święte,\nWinszując sobie przejścia w troskę z troski,\nŚwiatło, z którego poznałem powieści\ncudowny żywot bożego żebraka,\nW te słowa swoje przerwało milczenie:"
    verse: true
    chunks:
      - pl: "Tam pieśń Bachusa, Peana nie cześci,"
        ru: "Там песнь не Вакха, не Пеана в честь,"
      - pl: "\nLecz trzy Osoby jednej boskiej treści,"
        ru: "а трёх Лиц одной божественной сути,"
      - pl: "\nW jednej Osobie, jak dwie zlane głoski,"
        ru: "в одном Лице, как два слитых звука,"
      - pl: "\nBożej z naturą ludzką zjednoczenie."
        ru: "соединение божественной природы с человеческой."
      - pl: "\nTańce i pieśni ucichły ucięte"
        ru: "Пляски и песни смолкли, оборвавшись,"
      - pl: "\nI ku nam światła spoglądały święte,"
        ru: "и святые светила смотрели на нас,"
      - pl: "\nWinszując sobie przejścia w troskę z troski,"
        ru: "радуясь переходу от заботы к заботе."
        note: "winszować — поздравлять, радоваться"
      - pl: "\nŚwiatło, z którego poznałem powieści"
        ru: "Свет, из которого я узнал повесть"
      - pl: "\ncudowny żywot bożego żebraka,"
        ru: "о чудесной жизни Божьего нищего,"
        note: "Фома о Франциске"
      - pl: "\nW te słowa swoje przerwało milczenie:"
        ru: "такими словами прервал молчание:"
    words: { "pieśń": piesn, "naturą": natura, "zjednoczenie": zjednoczyc, "spoglądały": spogladac, "troskę": troska, "powieści": powiesc-noun }
  - clean: "«Ponieważ ziarno wysiane z przetaka\nDo swego spichrza już musiałeś wrzucić,\nMiłość mnie wzywa, co dla mnie jest błogo,\nZbity w połowie snop tobie domłócić.\nMniemasz, że w tego pierś, z którego kości\nStworzoną była najpierwsza kobieta,\nA która światu kosztuje tak drogo!"
    verse: true
    chunks:
      - pl: "«Ponieważ ziarno wysiane z przetaka"
        ru: "«Так как зерно, просеянное через решето,"
        note: "przetak — решето"
      - pl: "\nDo swego spichrza już musiałeś wrzucić,"
        ru: "ты уже должен был ссыпать в свою житницу,"
        note: "spichrz — амбар"
      - pl: "\nMiłość mnie wzywa, co dla mnie jest błogo,"
        ru: "любовь, что для меня блаженна, зовёт меня"
      - pl: "\nZbity w połowie snop tobie domłócić."
        ru: "домолотить тебе сноп, обмолоченный наполовину."
        note: "domłócić — домолотить"
      - pl: "\nMniemasz, że w tego pierś, z którego kości"
        ru: "Ты полагаешь, что в грудь того, из чьих рёбер"
      - pl: "\nStworzoną była najpierwsza kobieta,"
        ru: "была создана самая первая женщина,"
        note: "Адам"
      - pl: "\nA która światu kosztuje tak drogo!"
