  - clean: "Co wyżej rzekłem, również tym zdziwiony,\nOpowiadając, że błogosławiony,\nKtórego w piątym świetle duch zamknięty,\nNie ma równego, choć z matki poczęty.\nTeraz co mówię, zwróć na to baczenie;\nA moje słowa i twoje wierzenie\nZetkną się w prawdzie węzłem rozumowym,\nJak kół promienie w ich punkcie środkowym."
    verse: true
    chunks:
      - pl: "Co wyżej rzekłem, również tym zdziwiony,"
        ru: "Ты удивлён и тем, что я сказал выше,"
      - pl: "\nOpowiadając, że błogosławiony,"
        ru: "рассказывая, что блаженный,"
        note: "Соломон"
      - pl: "\nKtórego w piątym świetle duch zamknięty,"
        ru: "чей дух заключён в пятом свете,"
      - pl: "\nNie ma równego, choć z matki poczęty."
        ru: "не имеет равного, хоть и зачат от матери."
      - pl: "\nTeraz co mówię, zwróć na to baczenie;"
        ru: "Теперь обрати внимание на то, что я говорю;"
      - pl: "\nA moje słowa i twoje wierzenie"
        ru: "и мои слова, и твоё верование"
      - pl: "\nZetkną się w prawdzie węzłem rozumowym,"
        ru: "сойдутся в истине разумным узлом,"
      - pl: "\nJak kół promienie w ich punkcie środkowym."
        ru: "как лучи колёс в их средней точке."
    words: { "rzekłem": rzec, "Opowiadając": opowiadac, "błogosławiony": blogoslawic, "poczęty": poczac, "węzłem": wezel, "środkowym": srodkowy }
  - clean: "Co jest i nie jest w śmiertelnej kolei,\nCo nie umiera i co umrzeć może,\nJest tylko blaskiem tej arcyidei,\nZ jaką w połogu jest kochanie boże.\nBowiem ta światłość żywa, co wytryska\nZ rozpromienionej potęgi ogniska,\nZ miłością ma w niej wspólną wiekuistość,\nA ten stosunek tworzy Ich troistość,\nW dziewięciu sferach przez skutek swej łaski\nJako w zwierciadle zestrzela swe blaski,\nLecz pozostając nieśmiertelnie jedną."
    verse: true
    chunks:
      - pl: "Co jest i nie jest w śmiertelnej kolei,"
        ru: "Что есть и чего нет в смертной череде,"
      - pl: "\nCo nie umiera i co umrzeć może,"
        ru: "что не умирает и что может умереть,"
      - pl: "\nJest tylko blaskiem tej arcyidei,"
        ru: "есть лишь блеск той высшей идеи,"
      - pl: "\nZ jaką w połogu jest kochanie boże."
        ru: "которую в родах порождает Божья любовь."
        note: "połóg — роды; Слово"
      - pl: "\nBowiem ta światłość żywa, co wytryska"
        ru: "Ибо этот живой свет, что брызжет"
      - pl: "\nZ rozpromienionej potęgi ogniska,"
        ru: "из очага лучезарной мощи,"
      - pl: "\nZ miłością ma w niej wspólną wiekuistość,"
        ru: "имеет с любовью в ней общую вечность,"
      - pl: "\nA ten stosunek tworzy Ich troistość,"
        ru: "а это отношение образует их троичность;"
      - pl: "\nW dziewięciu sferach przez skutek swej łaski"
        ru: "в девяти сферах действием своей милости"
      - pl: "\nJako w zwierciadle zestrzela swe blaski,"
        ru: "он, как в зеркале, собирает свои блески,"
      - pl: "\nLecz pozostając nieśmiertelnie jedną."
        ru: "но оставаясь бессмертно единым."
    words: { "śmiertelnej": smiertelny, "blaskiem": blask, "potęgi": potega, "ogniska": ognisko, "skutek": skutek, "pozostając": pozostawac }
  - clean: "Z tych sfer schodzące promienie jej bledną,\nStopniowie słabszych sił wiążąc osnowę,\nW końcu żyjątka tworzy jednodniowe.\nPrzez co rozumiem urodzone rzeczy,\nKtórych żywotność znikoma i marna,\nKtóre wpływ nieba, co świat ma na pieczy,\nZapładza różnie z ziarnem lub bez ziarna."
    verse: true
    chunks:
      - pl: "Z tych sfer schodzące promienie jej bledną,"
        ru: "Сходящие с этих сфер её лучи бледнеют,"
      - pl: "\nStopniowie słabszych sił wiążąc osnowę,"
        ru: "ступенями связывая основу более слабых сил,"
      - pl: "\nW końcu żyjątka tworzy jednodniowe."
        ru: "наконец творят однодневные существа."
        note: "żyjątko — существо, тварь"
      - pl: "\nPrzez co rozumiem urodzone rzeczy,"
        ru: "Под этим я разумею рождённые вещи,"
      - pl: "\nKtórych żywotność znikoma i marna,"
        ru: "чья жизненность мимолётна и ничтожна,"
      - pl: "\nKtóre wpływ nieba, co świat ma na pieczy,"
        ru: "которые влияние неба, что опекает мир,"
      - pl: "\nZapładza różnie z ziarnem lub bez ziarna."
        ru: "оплодотворяет по-разному, с семенем или без семени."
    words: { "schodzące": schodzic, "wiążąc": wiazac, "tworzy": tworzyc, "marna": marny, "wpływ": wplyw, "nieba": niebo }
  - clean: "Wosk ich jest różny jak siła rodząca,\nCo różną iskrę ich bytu roznieca,\nA jednak spod ich pieczęci tysiąca\nMniej albo więcej ideał prześwieca.\nStąd drzewo dobry lub zły owoc rodzi\nWedle nasienia, z jakiego pochodzi,\nI wy się z różną skłonnością rodzicie."
    verse: true
    chunks:
      - pl: "Wosk ich jest różny jak siła rodząca,"
        ru: "Воск их различен, как рождающая сила,"
      - pl: "\nCo różną iskrę ich bytu roznieca,"
        ru: "что разжигает разную искру их бытия,"
      - pl: "\nA jednak spod ich pieczęci tysiąca"
        ru: "и всё же из-под тысячи их печатей"
      - pl: "\nMniej albo więcej ideał prześwieca."
        ru: "более или менее просвечивает идеал."
      - pl: "\nStąd drzewo dobry lub zły owoc rodzi"
        ru: "Отсюда дерево рождает добрый или дурной плод"
      - pl: "\nWedle nasienia, z jakiego pochodzi,"
        ru: "по семени, от которого происходит,"
      - pl: "\nI wy się z różną skłonnością rodzicie."
        ru: "и вы рождаетесь с разной склонностью."
    words: { "różny": rozny, "ideał": ideal, "drzewo": drzewo, "owoc": owoc, "nasienia": nasienie, "pochodzi": pochodzic }
  - clean: "Gdyby wosk doszedł, stanął na swym szczycie\nI gdyby niebo swą pieczęć odbiło\nNa takim wosku z bezpośrednią siłą,\nByłaby widną idealność cała!\nAle natura, którą błąd przesiąka\nPodobnie jako ziemski sztukmistrz działa,\nZna on swą sztukę; lecz drży jego ręka."
