chapter: 2
chapterTitle: "Legendy początków"
chapterTitleRu: "Легенды о началах"
level: B1
paragraphs:
  - clean: "Każdy naród chce wiedzieć, skąd się wziął. Kiedy brakuje dokumentów, ludzie opowiadają legendy. Polskie legendy o początkach zapisali średniowieczni kronikarze, ale opowiadano je na pewno dużo wcześniej. Nie są historią, ale bez nich trudno zrozumieć Polaków. Znają je wszystkie dzieci, a ich bohaterowie są na herbach, pomnikach i w nazwach ulic."
    draft: true
    chunks:
      - pl: "Każdy naród chce wiedzieć, skąd się wziął."
        ru: "Каждый народ хочет знать, откуда он взялся."
        note: "wziąć się — взяться, появиться"
      - pl: " Kiedy brakuje dokumentów, ludzie opowiadają legendy."
        ru: "Когда не хватает документов, люди рассказывают легенды."
        note: "brakować czegoś — не хватать чего-л.: родительный"
      - pl: " Polskie legendy o początkach zapisali średniowieczni kronikarze, ale opowiadano je na pewno dużo wcześniej."
        ru: "Польские легенды о началах записали средневековые летописцы, но рассказывали их наверняка гораздо раньше."
        note: "kronikarz — летописец, хронист"
      - pl: " Nie są historią, ale bez nich trudno zrozumieć Polaków."
        ru: "Это не история, но без них трудно понять поляков."
      - pl: " Znają je wszystkie dzieci, a ich bohaterowie są na herbach, pomnikach i w nazwach ulic."
        ru: "Их знают все дети, а их герои — на гербах, памятниках и в названиях улиц."
        note: "herb — герб; bohater — герой"
    words: { "naród": narod, "legendy": legenda, "Polskie": polski, "zapisali": zapisac, "pewno": pewno, "trudno": trudno, "pomnikach": pomnik, "nazwach": nazwa }
  - clean: "Najstarsza z nich opowiada o trzech braciach: Lechu, Czechu i Rusie. Bracia wędrowali ze swoimi ludźmi przez lasy i góry, szukając miejsca do życia. W końcu ich drogi się rozeszły. Czech poszedł na południe, Rus na wschód, a Lech na północ. Tak, według legendy, powstały trzy narody: Czesi, Rusini i Polacy."
    draft: true
    chunks:
      - pl: "Najstarsza z nich opowiada o trzech braciach: Lechu, Czechu i Rusie."
        ru: "Самая старая из них рассказывает о трёх братьях: Лехе, Чехе и Русе."
      - pl: " Bracia wędrowali ze swoimi ludźmi przez lasy i góry, szukając miejsca do życia."
        ru: "Братья странствовали со своими людьми через леса и горы в поисках места для жизни."
        note: "szukając — ища, в поисках"
      - pl: " W końcu ich drogi się rozeszły."
        ru: "В конце концов их пути разошлись."
        note: "rozejść się — разойтись"
      - pl: " Czech poszedł na południe, Rus na wschód, a Lech na północ."
        ru: "Чех пошёл на юг, Рус — на восток, а Лех — на север."
      - pl: " Tak, według legendy, powstały trzy narody: Czesi, Rusini i Polacy."
        ru: "Так, согласно легенде, возникли три народа: чехи, русины и поляки."
        note: "Rusin — русин, так поляки звали восточных славян Руси"
    words: { "legendy": legenda, "rozeszły": rozejsc, "wschód": wschod, "powstały": powstac, "narody": narod }
  - clean: "Pewnego wieczoru Lech zatrzymał się na wzgórzu wśród lasów i jezior. Słońce zachodziło i niebo było czerwone. Nagle Lech zobaczył na starym dębie gniazdo, a w nim wielkiego białego orła. Orzeł rozłożył skrzydła i na tle czerwonego nieba wyglądał wspaniale. Lech uznał to za dobry znak. Postanowił zostać w tym miejscu i założył tam gród, który nazwał Gnieznem, od słowa „gniazdo”. A biały orzeł na czerwonym polu stał się herbem Polski i jest nim do dziś."
    draft: true
    chunks:
      - pl: "Pewnego wieczoru Lech zatrzymał się na wzgórzu wśród lasów i jezior."
        ru: "Однажды вечером Лех остановился на холме среди лесов и озёр."
        note: "pewnego wieczoru — однажды вечером; wzgórze — холм"
      - pl: " Słońce zachodziło i niebo było czerwone."
        ru: "Солнце садилось, и небо было красным."
        note: "zachodzić — заходить, садиться (о солнце)"
      - pl: " Nagle Lech zobaczył na starym dębie gniazdo, a w nim wielkiego białego orła."
        ru: "Вдруг Лех увидел на старом дубе гнездо, а в нём — большого белого орла."
        note: "gniazdo — гнездо; dąb — дуб"
      - pl: " Orzeł rozłożył skrzydła i na tle czerwonego nieba wyglądał wspaniale."
        ru: "Орёл расправил крылья и на фоне красного неба выглядел великолепно."
        note: "rozłożyć skrzydła — расправить крылья; na tle — на фоне"
      - pl: " Lech uznał to za dobry znak."
        ru: "Лех счёл это добрым знаком."
        note: "uznać coś za coś — счесть что-л. чем-л."
      - pl: " Postanowił zostać w tym miejscu i założył tam gród, który nazwał Gnieznem, od słowa „gniazdo”."
        ru: "Он решил остаться в этом месте и основал там град, который назвал Гнезно — от слова gniazdo «гнездо»."
        note: "założyć — основать"
      - pl: " A biały orzeł na czerwonym polu stał się herbem Polski i jest nim do dziś."
        ru: "А белый орёл на красном поле стал гербом Польши и остаётся им до сих пор."
        note: "pole — здесь поле герба"
    words: { "wzgórzu": wzgorze, "jezior": jezioro, "dębie": dab, "gniazdo": gniazdo, "orła": orzel, "Orzeł": orzel, "skrzydła": skrzydlo, "tle": tlo, "orzeł": orzel }
  - clean: "Tę legendę zapisano dopiero na przełomie XIII i XIV wieku, w tak zwanej Kronice wielkopolskiej. Czesi mają własną wersję, w której jest tylko praojciec Czech. Historycy widzą w opowieści o braciach prostą myśl: Polacy, Czesi i Rusini są sobie bliscy, bo mówią podobnymi językami. Kronikarze wyrazili tę myśl językiem legendy."
    draft: true
    chunks:
      - pl: "Tę legendę zapisano dopiero na przełomie XIII i XIV wieku, w tak zwanej Kronice wielkopolskiej."
        ru: "Эту легенду записали лишь на рубеже XIII и XIV веков, в так называемой Великопольской хронике."
        note: "na przełomie — на рубеже"
      - pl: " Czesi mają własną wersję, w której jest tylko praojciec Czech."
        ru: "У чехов есть своя версия, в которой есть только праотец Чех."
        note: "praojciec — праотец"
      - pl: " Historycy widzą w opowieści o braciach prostą myśl: Polacy, Czesi i Rusini są sobie bliscy, bo mówią podobnymi językami."
        ru: "Историки видят в рассказе о братьях простую мысль: поляки, чехи и русины близки друг другу, потому что говорят на похожих языках."
        note: "być sobie bliskim — быть близкими друг другу"
      - pl: " Kronikarze wyrazili tę myśl językiem legendy."
        ru: "Летописцы выразили эту мысль языком легенды."
    words: { "legendy": legenda, "legendę": legenda, "zapisano": zapisac, "przełomie": przelom, "zwanej": zwac, "opowieści": opowiesc, "wyrazili": wyrazic }
  - clean: "Druga wielka legenda przenosi nas do Krakowa. Dawno temu nad Wisłą panował mądry książę Krak. Zbudował gród na wzgórzu Wawel i od jego imienia miasto nazwano Krakowem. Ale w jaskini pod wzgórzem mieszkał straszny smok. Smok porywał krowy i owce, a czasem także ludzi. Mieszkańcy musieli co tydzień przyprowadzać mu bydło, żeby nie zjadł ich samych. Wielu rycerzy próbowało go zabić, ale wszyscy zginęli."
    draft: true
    chunks:
      - pl: "Druga wielka legenda przenosi nas do Krakowa."
        ru: "Вторая великая легенда переносит нас в Краков."
        note: "przenosić — переносить"
      - pl: " Dawno temu nad Wisłą panował mądry książę Krak."
        ru: "Давным-давно над Вислой правил мудрый князь Крак."
        note: "panować — править, царствовать"
      - pl: " Zbudował gród na wzgórzu Wawel i od jego imienia miasto nazwano Krakowem."
        ru: "Он построил град на холме Вавель, и по его имени город назвали Краковом."
      - pl: " Ale w jaskini pod wzgórzem mieszkał straszny smok."
        ru: "Но в пещере под холмом жил страшный дракон."
        note: "jaskinia — пещера; smok — дракон, змей"
      - pl: " Smok porywał krowy i owce, a czasem także ludzi."
        ru: "Дракон похищал коров и овец, а иногда и людей."
        note: "porywać — похищать, хватать"
      - pl: " Mieszkańcy musieli co tydzień przyprowadzać mu bydło, żeby nie zjadł ich samych."
        ru: "Жителям приходилось каждую неделю приводить ему скот, чтобы он не съел их самих."
        note: "bydło — (крупный рогатый) скот"
      - pl: " Wielu rycerzy próbowało go zabić, ale wszyscy zginęli."
        ru: "Многие рыцари пытались его убить, но все погибли."
        note: "zginąć — погибнуть"
    words: { "wzgórzu": wzgorze, "legenda": legenda, "przenosi": przenosic, "Dawno": dawno, "panował": panowac, "jaskini": jaskinia, "wzgórzem": wzgorze, "smok": smok, "krowy": krowa, "owce": owca, "Mieszkańcy": mieszkaniec, "bydło": bydlo, "rycerzy": rycerz }
  - clean: "Najpopularniejszą wersję tej legendy zna każde polskie dziecko. Pewien młody szewc, Skuba, wziął skórę barana i wypchał ją siarką. Potem podrzucił ją pod jaskinię smoka. Smok połknął barana w całości. Siarka zaczęła palić go od środka, więc pobiegł nad Wisłę i pił, pił i pił. Pił tak długo, aż w końcu pękł. Książę nagrodził szewca, a cały Kraków świętował."
    draft: true
    chunks:
      - pl: "Najpopularniejszą wersję tej legendy zna każde polskie dziecko."
        ru: "Самую популярную версию этой легенды знает каждый польский ребёнок."
      - pl: " Pewien młody szewc, Skuba, wziął skórę barana i wypchał ją siarką."
        ru: "Один молодой сапожник, Скуба, взял шкуру барана и набил её серой."
        note: "szewc — сапожник; wypchać — набить; siarka — сера"
      - pl: " Potem podrzucił ją pod jaskinię smoka."
        ru: "Потом подбросил её к пещере дракона."
        note: "podrzucić — подбросить"
      - pl: " Smok połknął barana w całości."
        ru: "Дракон проглотил барана целиком."
        note: "połknąć — проглотить; w całości — целиком"
      - pl: " Siarka zaczęła palić go od środka, więc pobiegł nad Wisłę i pił, pił i pił."
        ru: "Сера начала жечь его изнутри, поэтому он побежал к Висле и пил, пил и пил."
        note: "od środka — изнутри"
      - pl: " Pił tak długo, aż w końcu pękł."
        ru: "Он пил так долго, что в конце концов лопнул."
        note: "aż — пока не, до тех пор пока; pęknąć — лопнуть"
      - pl: " Książę nagrodził szewca, a cały Kraków świętował."
        ru: "Князь наградил сапожника, а весь Краков праздновал."
        note: "nagrodzić — наградить"
    words: { "legendy": legenda, "Najpopularniejszą": popularny, "polskie": polski, "siarką": siarka, "podrzucił": podrzucic, "jaskinię": jaskinia, "smoka": smok, "połknął": polknac, "całości": calosc, "Siarka": siarka, "pobiegł": pobiec, "pękł": peknac, "świętował": swietowac }
  - clean: "W najstarszej wersji, którą około 1200 roku zapisał biskup Wincenty Kadłubek, nie ma jednak żadnego szewca. Smoka zabijają tam synowie Kraka, a potem jeden brat zabija drugiego, bo nie chce dzielić się sławą. Szewc Skuba pojawił się dopiero w XVI wieku. Widać, że ludzie woleli bohatera, który zwycięża sprytem, a nie siłą. Dziś pod Wawelem można zwiedzać Smoczą Jamę, a przy wyjściu stoi metalowy smok, który co kilka minut zieje ogniem."
    draft: true
    chunks:
      - pl: "W najstarszej wersji, którą około 1200 roku zapisał biskup Wincenty Kadłubek, nie ma jednak żadnego szewca."
        ru: "Однако в самой старой версии, которую около 1200 года записал епископ Винцентий Кадлубек, никакого сапожника нет."
      - pl: " Smoka zabijają tam synowie Kraka, a potem jeden brat zabija drugiego, bo nie chce dzielić się sławą."
        ru: "Там дракона убивают сыновья Крака, а потом один брат убивает другого, потому что не хочет делиться славой."
        note: "dzielić się czymś — делиться чем-л."
      - pl: " Szewc Skuba pojawił się dopiero w XVI wieku."
        ru: "Сапожник Скуба появился лишь в XVI веке."
      - pl: " Widać, że ludzie woleli bohatera, który zwycięża sprytem, a nie siłą."
        ru: "Видно, что людям больше нравился герой, который побеждает хитростью, а не силой."
        note: "woleć — предпочитать; spryt — смекалка, хитрость"
      - pl: " Dziś pod Wawelem można zwiedzać Smoczą Jamę, a przy wyjściu stoi metalowy smok, który co kilka minut zieje ogniem."
        ru: "Сегодня под Вавелем можно осмотреть Драконову пещеру, а у выхода стоит металлический дракон, который каждые несколько минут извергает огонь."
        note: "jama — нора, пещера; zionąć ogniem — дышать огнём"
    words: { "smok": smok, "zapisał": zapisac, "dzielić": dzielic, "sławą": slawa, "metalowy": metalowy, "zieje": ziac }
  - clean: "Po śmierci Kraka rządy objęła jego córka Wanda. Była piękna i mądra, a ludzie ją kochali. Pewien niemiecki książę, Rydygier, chciał się z nią ożenić, a razem z nią zdobyć jej kraj. Wanda odmówiła. Rydygier przyszedł więc z wojskiem, ale jego żołnierze nie chcieli walczyć z tak piękną władczynią. Według jednej wersji to sam Rydygier odebrał sobie życie. Według innej, bardziej znanej, Wanda rzuciła się do Wisły, żeby nikt jej nie zmusił do małżeństwa z cudzoziemcem. Stąd wzięło się słynne powiedzenie „Wanda, co nie chciała Niemca”. Pod Krakowem stoją dwa wielkie ziemne kopce: kopiec Krakusa i kopiec Wandy. Nikt nie wie, kto i kiedy je usypał, ale tradycja łączy je z księciem i jego córką."
    draft: true
    chunks:
      - pl: "Po śmierci Kraka rządy objęła jego córka Wanda."
        ru: "После смерти Крака правление приняла его дочь Ванда."
        note: "objąć rządy — принять правление"
      - pl: " Była piękna i mądra, a ludzie ją kochali."
        ru: "Она была красива и мудра, и люди её любили."
      - pl: " Pewien niemiecki książę, Rydygier, chciał się z nią ożenić, a razem z nią zdobyć jej kraj."
        ru: "Один немецкий князь, Ридигер, хотел на ней жениться, а вместе с ней заполучить и её страну."
        note: "ożenić się z kimś — жениться на ком-л."
      - pl: " Wanda odmówiła."
        ru: "Ванда отказала."
        note: "odmówić — отказать"
      - pl: " Rydygier przyszedł więc z wojskiem, ale jego żołnierze nie chcieli walczyć z tak piękną władczynią."
        ru: "Тогда Ридигер пришёл с войском, но его воины не хотели сражаться с такой прекрасной правительницей."
        note: "władczyni — правительница"
      - pl: " Według jednej wersji to sam Rydygier odebrał sobie życie."
        ru: "По одной версии, жизнь покончил с собой сам Ридигер."
        note: "odebrać sobie życie — покончить с собой"
      - pl: " Według innej, bardziej znanej, Wanda rzuciła się do Wisły, żeby nikt jej nie zmusił do małżeństwa z cudzoziemcem."
        ru: "По другой, более известной, Ванда бросилась в Вислу, чтобы никто не заставил её выйти замуж за чужеземца."
        note: "zmusić — заставить; cudzoziemiec — иностранец, чужеземец"
      - pl: " Stąd wzięło się słynne powiedzenie „Wanda, co nie chciała Niemca”."
        ru: "Отсюда пошло знаменитое выражение «Ванда, которая не хотела немца»."
        note: "co — здесь разговорное «которая»"
      - pl: " Pod Krakowem stoją dwa wielkie ziemne kopce: kopiec Krakusa i kopiec Wandy."
        ru: "Под Краковом стоят два больших земляных кургана: курган Кракуса и курган Ванды."
        note: "kopiec — курган, насыпь"
      - pl: " Nikt nie wie, kto i kiedy je usypał, ale tradycja łączy je z księciem i jego córką."
        ru: "Никто не знает, кто и когда их насыпал, но предание связывает их с князем и его дочерью."
        note: "usypać — насыпать"
    words: { "objęła": objac, "niemiecki": niemiecki, "ożenić": ozenic, "wojskiem": wojsko, "słynne": slynny, "tradycja": tradycja }
  - clean: "Swoją legendę ma też Warszawa, choć dużo młodszą. Opowiada ona o rybaku Warsie i syrenie Sawie, od których imion miasto miało wziąć nazwę. Syrenka z mieczem i tarczą jest dziś herbem stolicy. Naprawdę jednak nazwa pochodzi prawdopodobnie od Warsza, właściciela wsi, który żył w średniowieczu."
    draft: true
    chunks:
      - pl: "Swoją legendę ma też Warszawa, choć dużo młodszą."
        ru: "Своя легенда есть и у Варшавы, хотя гораздо моложе."
      - pl: " Opowiada ona o rybaku Warsie i syrenie Sawie, od których imion miasto miało wziąć nazwę."
        ru: "Она рассказывает о рыбаке Варсе и русалке Саве, от чьих имён город якобы получил название."
        note: "syrena — русалка (морская дева с рыбьим хвостом); miało wziąć — якобы получило"
      - pl: " Syrenka z mieczem i tarczą jest dziś herbem stolicy."
        ru: "Русалка с мечом и щитом сегодня — герб столицы."
        note: "tarcza — щит"
      - pl: " Naprawdę jednak nazwa pochodzi prawdopodobnie od Warsza, właściciela wsi, który żył w średniowieczu."
        ru: "На самом же деле название, вероятно, происходит от Варша — владельца деревни, жившего в Средние века."
        note: "właściciel — владелец"
    words: { "legendę": legenda, "syrenie": syrena, "tarczą": tarcza, "stolicy": stolica, "nazwa": nazwa, "wsi": wies }
  - clean: "Najważniejsza dla historii Polski jest jednak legenda o Popielu i Piaście. Opowiada ją pierwszy kronikarz Polski, Gall Anonim, który pisał na początku XII wieku. Był to cudzoziemiec, prawdopodobnie mnich z Francji albo z Włoch, i stąd jego przydomek."
    draft: true
    chunks:
      - pl: "Najważniejsza dla historii Polski jest jednak legenda o Popielu i Piaście."
