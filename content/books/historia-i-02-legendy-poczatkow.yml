  - clean: "Swoje legendy ma prawie każde polskie miasto. W Poznaniu codziennie w południe na wieży ratusza wychodzą dwa metalowe koziołki i trykają się rogami dwanaście razy. Legenda mówi, że kiedyś, w czasie uroczystości otwarcia nowego zegara, kucharzowi uciekły dwa koziołki przeznaczone na pieczeń. Uciekły na wieżę i zaczęły się tam bóść, a goście tak się śmiali, że burmistrz kazał je wyrzeźbić i umieścić w zegarze. Dziś tłumy turystów czekają w południe na rynku, żeby zobaczyć walkę koziołków. W Krakowie mówi się, że gołębie na rynku to zaczarowani rycerze księcia Henryka Probusa. Książę, który chciał zdobyć koronę, poprosił czarownicę o pieniądze na podróż do papieża, a ona zamieniła jego rycerzy w gołębie, które wydziobywały dla niego złoto z murów kościoła Mariackiego. Książę roztrwonił pieniądze po drodze i nigdy nie dotarł do Rzymu, a rycerze do dziś krążą nad rynkiem i czekają, aż czar przestanie działać. W Warszawie w podziemiach Zamku Ostrogskich mieszka podobno złota kaczka, która może dać ubogiemu ogromny skarb, jeśli wyda go w ciągu jednego dnia wyłącznie na siebie. Pewien szewc prawie wypełnił ten warunek, ale na koniec dał ostatnią monetę żebrakowi i skarb zniknął. Legenda uczy, że dobroć jest więcej warta niż złoto."
