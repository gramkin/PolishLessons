  - clean: "Kronikarze nie zawsze trzymali się prawdy. Wincenty Kadłubek, ten sam, który pisał o smoku, chciał pokazać, że Polacy są równi starożytnym Rzymianom i Grekom. Napisał więc, że dawni Lechici pokonali Aleksandra Wielkiego, a Juliusz Cezar oddał za żonę polskiemu księciu swoją siostrę. Dziś czytamy to z uśmiechem. Ale takie opowieści wiele mówią o ludziach, którzy je tworzyli: o ich dumie, marzeniach i lękach. A prawdziwa historia Polski zaczyna się od księcia, o którym pisali już cudzoziemcy: od Mieszka."
