# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 12
chapterTitle: "Pieśń XII"
chapterTitleRu: "Песнь XII. Святой Доминик"
level: B2
paragraphs:
  - clean: "(Ciąg dalszy. Mowa św. Bonawentury o św. Dominiku. Skargi na ówczesnych franciszkanów. Teologowie: Hugo, Chryzostom, Anzelm, Joachim i inni.)"
    chunks:
      - pl: "(Ciąg dalszy. Mowa św. Bonawentury o św. Dominiku. Skargi na ówczesnych franciszkanów. Teologowie: Hugo, Chryzostom, Anzelm, Joachim i inni.)"
        ru: "(Продолжение. Речь святого Бонавентуры о святом Доминике. Жалобы на тогдашних францисканцев. Богословы: Гуго, Златоуст, Ансельм, Иоахим и другие.)"
    words: { "Ciąg": ciag, "dalszy": daleki, "Mowa": mowa, "Skargi": skarga, "ówczesnych": owczesny, "inni": inny }
  - clean: "Gdy światło rzekło swe ostatnie słowo,\nMłyn święty zaczął kołować na nowo:\nJeszcze pierwszego obrotu nie skończył,\nJuż go krąg drugi zamknął w swym obwodzie,\nI jak muzyczne dwa akordy w zgodzie,\nRuch z ruchem jego, a pieśń z pieśnią złączył."
    verse: true
    chunks:
      - pl: "Gdy światło rzekło swe ostatnie słowo,"
        ru: "Когда свет сказал своё последнее слово,"
      - pl: "\nMłyn święty zaczął kołować na nowo:"
        ru: "святая мельница снова начала кружиться:"
        note: "młyn — жернов, мельница"
      - pl: "\nJeszcze pierwszego obrotu nie skończył,"
        ru: "ещё не окончила первого оборота,"
      - pl: "\nJuż go krąg drugi zamknął w swym obwodzie,"
        ru: "как её уже замкнул в своём обводе второй круг,"
      - pl: "\nI jak muzyczne dwa akordy w zgodzie,"
        ru: "и, как два музыкальных аккорда в согласии,"
      - pl: "\nRuch z ruchem jego, a pieśń z pieśnią złączył."
        ru: "соединил движение с её движением, а песнь с песнью."
    words: { "rzekło": rzec, "obrotu": obrot, "krąg": krag, "obwodzie": obwod, "muzyczne": muzyczny, "pieśń": piesn }
  - clean: "Pieśń ta w słodyczy, w melodyi sile,\nGłos naszych syren, naszych muz powszednie\nPieśń ta do tyla przewyższała, ile\nWyższe nad odblask światło bezpośrednie.\nJak równoległe, jedną barwną lśniące,\nDwa łuki niebo pokazuje oku,\nGnące się lekko na lekkim obłoku,\nGdy swą Junona posłankę wysyła;\nŁuk się zewnętrzny z wewnętrznego rodzi,\n(Na podobieństwo głosu, co wychodzi\nZ ust nimfy, którą tak miłość strawiła,\nJako poranne mgły przetrawia słońce)\nJak łuki, mówię, niebieskiego stropu,\nCo było ludziom znakiem wróżb weselnych,\nPrzymierza z niebem, gdy Bóg rzekł Noemu,\nŻe już nie będą mieć nigdy potopu;"
    verse: true
    chunks:
      - pl: "Pieśń ta w słodyczy, w melodyi sile,"
        ru: "Эта песнь сладостью, силой мелодии"
      - pl: "\nGłos naszych syren, naszych muz powszednie"
        ru: "обычные голоса наших сирен, наших муз"
      - pl: "\nPieśń ta do tyla przewyższała, ile"
        ru: "настолько превосходила, насколько"
      - pl: "\nWyższe nad odblask światło bezpośrednie."
        ru: "непосредственный свет выше отблеска."
      - pl: "\nJak równoległe, jedną barwną lśniące,"
        ru: "Как две параллельные дуги, сияющие одной краской,"
      - pl: "\nDwa łuki niebo pokazuje oku,"
        ru: "небо показывает глазу,"
      - pl: "\nGnące się lekko na lekkim obłoku,"
        ru: "изгибающиеся легко на лёгком облаке,"
      - pl: "\nGdy swą Junona posłankę wysyła;"
        ru: "когда Юнона посылает свою вестницу,"
        note: "Ирида — радуга"
      - pl: "\nŁuk się zewnętrzny z wewnętrznego rodzi,"
        ru: "внешняя дуга рождается из внутренней"
      - pl: "\n(Na podobieństwo głosu, co wychodzi"
        ru: "(наподобие голоса, что выходит"
      - pl: "\nZ ust nimfy, którą tak miłość strawiła,"
        ru: "из уст нимфы, которую так поглотила любовь,"
        note: "Эхо"
      - pl: "\nJako poranne mgły przetrawia słońce)"
        ru: "как солнце истаивает утренние туманы),"
      - pl: "\nJak łuki, mówię, niebieskiego stropu,"
        ru: "как дуги, говорю, небесного свода,"
        note: "strop — свод"
      - pl: "\nCo było ludziom znakiem wróżb weselnych,"
        ru: "что были людям знаком радостных предвестий,"
      - pl: "\nPrzymierza z niebem, gdy Bóg rzekł Noemu,"
        ru: "завета с небом, когда Бог сказал Ною,"
      - pl: "\nŻe już nie będą mieć nigdy potopu;"
        ru: "что уже никогда не будет потопа;"
    words: { "syren": syrena, "łuki": luk, "zewnętrzny": zewnetrzny, "podobieństwo": podobienstwo, "mgły": mgla, "stropu": strop }
  - clean: "Równie dwa wieńce tych róż nieśmiertelnych\nNas okrążyły, a pierwszy drugiemu,\nZewnętrzny krąg był równy wewnętrznemu.\nGdy ten korowód piesień i płomieni,\nZlany z pieszczących głosów i promieni,\nWstrzymał się zgodnie (jak woli człowieka\nOboich oczu posłuszna powieka,\nCo się zamyka razem i otwiera),\nZe świateł nowych, jedna światła sfera\nPowiała głosem jakby dźwiękiem słowa,\nAżem się zwrócił, skąd te dźwięki wiały,\nJak do bieguna igła magnesowa."
    verse: true
    chunks:
      - pl: "Równie dwa wieńce tych róż nieśmiertelnych"
        ru: "так два венца этих бессмертных роз"
      - pl: "\nNas okrążyły, a pierwszy drugiemu,"
        ru: "окружили нас, и первому второй,"
      - pl: "\nZewnętrzny krąg był równy wewnętrznemu."
        ru: "внешний круг был равен внутреннему."
      - pl: "\nGdy ten korowód piesień i płomieni,"
        ru: "Когда этот хоровод песен и пламени,"
        note: "korowód — хоровод"
      - pl: "\nZlany z pieszczących głosów i promieni,"
        ru: "слитый из ласкающих голосов и лучей,"
      - pl: "\nWstrzymał się zgodnie (jak woli człowieka"
        ru: "согласно остановился (как, по воле человека,"
      - pl: "\nOboich oczu posłuszna powieka,"
        ru: "послушное веко обоих глаз,"
      - pl: "\nCo się zamyka razem i otwiera),"
        ru: "что вместе закрывается и открывается),"
      - pl: "\nZe świateł nowych, jedna światła sfera"
        ru: "из новых светил одна сфера света"
      - pl: "\nPowiała głosem jakby dźwiękiem słowa,"
        ru: "повеяла голосом, словно звуком слова,"
      - pl: "\nAżem się zwrócił, skąd te dźwięki wiały,"
        ru: "так что я обернулся туда, откуда веяли эти звуки,"
      - pl: "\nJak do bieguna igła magnesowa."
        ru: "как магнитная стрелка к полюсу."
        note: "igła magnesowa — магнитная стрелка"
    words: { "równy": rowny, "wewnętrznemu": wewnetrzny, "płomieni": plomien, "promieni": promien, "Wstrzymał": wstrzymac, "igła": igla }
  - clean: "I rzekła: «Miłość, co mnie piękną robi,\nO innym wodzu radzi wejść w rozmowę,\nZ powodu wodza mojego pochwały;\nSłusznie, gdzie jeden, niech będzie i drugi,\nW ich bojowaniu równe ich zasługi,\nNiech jednoczesny blask chwały ich zdobi."
    verse: true
    chunks:
      - pl: "I rzekła: «Miłość, co mnie piękną robi,"
        ru: "И сказала: «Любовь, что делает меня прекрасной,"
      - pl: "\nO innym wodzu radzi wejść w rozmowę,"
        ru: "советует вступить в разговор о другом вожде"
      - pl: "\nZ powodu wodza mojego pochwały;"
        ru: "по поводу похвалы моему вождю;"
      - pl: "\nSłusznie, gdzie jeden, niech będzie i drugi,"
        ru: "справедливо, где один, пусть будет и другой,"
      - pl: "\nW ich bojowaniu równe ich zasługi,"
        ru: "в их борьбе равны их заслуги,"
      - pl: "\nNiech jednoczesny blask chwały ich zdobi."
        ru: "пусть одновременный блеск славы их украшает."
    words: { "wodzu": wodz, "rozmowę": rozmowa, "chwały": chwala, "Słusznie": slusznie, "zasługi": zasluga, "blask": blask }
  - clean: "Za swym sztandarem wojsko Chrystusowe,\nKtórego nabór kosztował tak drogo,\nPostępowało leniwo i z trwogą.\nKiedy się troskać zaczął Cezar wieczny,\nWidząc zastępów tych stan niebezpieczny,\nJak już mówiłem, swej Oblubienicy\nPosłał dwóch w pomoc rycerzy w kapicy,\nNa których słowo i znak wszyscy zbiegi\nZbłąkani w swoje wrócili szeregi."
    verse: true
    chunks:
      - pl: "Za swym sztandarem wojsko Chrystusowe,"
        ru: "За своим знаменем Христово войско,"
      - pl: "\nKtórego nabór kosztował tak drogo,"
        ru: "набор которого стоил так дорого,"
        note: "nabór — набор"
      - pl: "\nPostępowało leniwo i z trwogą."
        ru: "продвигалось медленно и со страхом."
      - pl: "\nKiedy się troskać zaczął Cezar wieczny,"
        ru: "Когда вечный Цезарь начал тревожиться,"
      - pl: "\nWidząc zastępów tych stan niebezpieczny,"
        ru: "видя опасное положение этих воинств,"
      - pl: "\nJak już mówiłem, swej Oblubienicy"
        ru: "как я уже говорил, своей Невесте"
      - pl: "\nPosłał dwóch w pomoc rycerzy w kapicy,"
        ru: "он послал в помощь двух рыцарей в плаще,"
      - pl: "\nNa których słowo i znak wszyscy zbiegi"
        ru: "по чьему слову и знаку все беглецы,"
        note: "zbieg — беглец"
      - pl: "\nZbłąkani w swoje wrócili szeregi."
        ru: "заблудшие, вернулись в свои ряды."
    words: { "Postępowało": postepowac, "wieczny": wieczny, "Posłał": poslac, "rycerzy": rycerz, "zbiegi": zbieg, "szeregi": szereg }
  - clean: "W tej części świata, skąd ciepły powiewa\nWiatr do Europy, jej łąki i drzewa\nNajpierwszym kwiatem i liściem odziewa,\nWód Oceanu blisko, za którymi\nSłońce zapada, kryjąc się od ziemi,\nPod lwa opieką leży Kallaroga;\nGdzie lew na herbie jest z obojej strony\nJako zwycięzca i jak zwyciężony."
    verse: true
    chunks:
      - pl: "W tej części świata, skąd ciepły powiewa"
        ru: "В той части света, откуда тёплый ветер"
      - pl: "\nWiatr do Europy, jej łąki i drzewa"
        ru: "веет на Европу, одевая её луга и деревья"
      - pl: "\nNajpierwszym kwiatem i liściem odziewa,"
        ru: "самым первым цветом и листом,"
        note: "западный ветер, Испания"
      - pl: "\nWód Oceanu blisko, za którymi"
        ru: "близко от вод Океана, за которыми"
      - pl: "\nSłońce zapada, kryjąc się od ziemi,"
        ru: "солнце заходит, скрываясь от земли,"
      - pl: "\nPod lwa opieką leży Kallaroga;"
        ru: "под защитой льва лежит Калагорра;"
      - pl: "\nGdzie lew na herbie jest z obojej strony"
        ru: "где лев на гербе с обеих сторон"
      - pl: "\nJako zwycięzca i jak zwyciężony."
        ru: "и как победитель, и как побеждённый."
        note: "герб Кастилии"
    words: { "Wiatr": wiatr, "Oceanu": ocean, "kryjąc": kryc, "opieką": opieka, "zwycięzca": zwyciezca, "zwyciężony": zwyciezyc }
  - clean: "Tam się urodził ów zapaśnik Pański,\nCzuły kochanek wiary chrześcijańskiej,\nWrogów Kościoła boży miecz i trwoga,\nWierzących słodycz i kochanie ludów.\nA jego dusza, największy cud z cudów,\nLedwo w żywocie matki żyć poczęła,\nJuż matkę duchem proroczym natchnęła."
    verse: true
    chunks:
      - pl: "Tam się urodził ów zapaśnik Pański,"
        ru: "Там родился тот борец Господень,"
      - pl: "\nCzuły kochanek wiary chrześcijańskiej,"
        ru: "нежный возлюбленный христианской веры,"
      - pl: "\nWrogów Kościoła boży miecz i trwoga,"
        ru: "Божий меч и страх врагов Церкви,"
      - pl: "\nWierzących słodycz i kochanie ludów."
        ru: "сладость верующих и любовь народов."
      - pl: "\nA jego dusza, największy cud z cudów,"
        ru: "А его душа, величайшее чудо из чудес,"
      - pl: "\nLedwo w żywocie matki żyć poczęła,"
        ru: "едва начала жить во чреве матери,"
      - pl: "\nJuż matkę duchem proroczym natchnęła."
        ru: "уже вдохновила мать пророческим духом."
        note: "ей приснилась собака с факелом"
    words: { "boży": bozy, "miecz": miecz, "słodycz": slodycz, "ludów": lud, "Ledwo": ledwo, "poczęła": poczac }
  - clean: "Kiedy ślub z wiarą brał nad świętym zdrojem,\nA kościół żegnał mówiąc: idź z pokojem!\nW śnie był widziany przez chrzestnych rodziców\nCudowny owoc świecący jak płomię,\nCo miał wyjść z niego i jego dziedziców.\nI gdybym czym był, mógł stać się widomie,\nDuch święty zstąpił, by dać imię tego\nCo nowochrzczeńca posiadał całego,\nI dał mu chrzestne imię Dominika."
    verse: true
    chunks:
      - pl: "Kiedy ślub z wiarą brał nad świętym zdrojem,"
        ru: "Когда он брал обручение с верой над святым источником,"
      - pl: "\nA kościół żegnał mówiąc: idź z pokojem!"
        ru: "а церковь благословляла, говоря: «Иди с миром!»,"
      - pl: "\nW śnie był widziany przez chrzestnych rodziców"
        ru: "во сне крёстные родители видели"
      - pl: "\nCudowny owoc świecący jak płomię,"
        ru: "чудесный плод, светящийся, как пламя,"
      - pl: "\nCo miał wyjść z niego i jego dziedziców."
        ru: "что должен был выйти из него и его наследников."
      - pl: "\nI gdybym czym był, mógł stać się widomie,"
        ru: "И чтобы то, чем он был, могло стать видимым,"
      - pl: "\nDuch święty zstąpił, by dać imię tego"
        ru: "сошёл Святой Дух, чтобы дать имя Того,"
      - pl: "\nCo nowochrzczeńca posiadał całego,"
        ru: "кто владел новокрещёным всецело,"
        note: "nowochrzczeniec — новокрещёный"
      - pl: "\nI dał mu chrzestne imię Dominika."
        ru: "и дал ему крёстное имя Доминик."
        note: "Dominicus — «Господень»"
    words: { "kościół": kosciol, "żegnał": zegnac, "Cudowny": cudowny, "owoc": owoc, "świecący": swiecic, "dziedziców": dziedzic }
  - clean: "Chrystus go wybrał sam na ogrodnika\nSwego ogrodu, bo sercem i głową\nPokochał pierwszą radę Chrystusową.\nCzęsto piastunka znalazła go rano,\nZrywał się ze snu i zginał kolano,\nModląc się długo jako mnich za kratą,\nJak gdyby mówił: »Przyszedłem tu na to«."
    verse: true
    chunks:
      - pl: "Chrystus go wybrał sam na ogrodnika"
        ru: "Христос сам избрал его садовником"
      - pl: "\nSwego ogrodu, bo sercem i głową"
        ru: "своего сада, ибо сердцем и головой"
      - pl: "\nPokochał pierwszą radę Chrystusową."
        ru: "он полюбил первый совет Христов."
        note: "бедность"
      - pl: "\nCzęsto piastunka znalazła go rano,"
        ru: "Часто нянька находила его утром:"
        note: "piastunka — нянька"
      - pl: "\nZrywał się ze snu i zginał kolano,"
        ru: "он вскакивал со сна и преклонял колено,"
      - pl: "\nModląc się długo jako mnich za kratą,"
        ru: "долго молясь, как монах за решёткой,"
      - pl: "\nJak gdyby mówił: »Przyszedłem tu na to«."
        ru: "словно говорил: „Я пришёл сюда для этого“."
    words: { "ogrodu": ogrod, "Pokochał": pokochac, "Często": czesto, "kolano": kolano, "Modląc": modlic, "mnich": mnich }
  - clean: "Słusznie cię, ojcze jego, Szczęsnym zwano,\nSłusznie cię, jego matko, zwą Joanną,\nJeżeli wykład, o jakim wieść gada,\nImionom waszym wiernie odpowiada.\nOn z tłumem nie biegł za mądrością świata,\nPrawdę ukochał, karmił się jej manną,\nW mądrości ducha gdy dojrzał nad lata,\nZajął się pilnie uprawą winnicy."
    verse: true
    chunks:
      - pl: "Słusznie cię, ojcze jego, Szczęsnym zwano,"
        ru: "Справедливо тебя, его отец, звали Счастливым,"
        note: "Феличе"
      - pl: "\nSłusznie cię, jego matko, zwą Joanną,"
        ru: "справедливо тебя, его мать, зовут Джованной,"
        note: "«Благодать Божья»"
      - pl: "\nJeżeli wykład, o jakim wieść gada,"
        ru: "если толкование, о котором гласит молва,"
      - pl: "\nImionom waszym wiernie odpowiada."
        ru: "верно соответствует вашим именам."
      - pl: "\nOn z tłumem nie biegł za mądrością świata,"
        ru: "Он не бежал с толпой за мудростью мира,"
      - pl: "\nPrawdę ukochał, karmił się jej manną,"
        ru: "он полюбил истину, питался её манной,"
      - pl: "\nW mądrości ducha gdy dojrzał nad lata,"
        ru: "когда созрел в мудрости духа не по годам,"
      - pl: "\nZajął się pilnie uprawą winnicy."
        ru: "он прилежно занялся возделыванием виноградника."
    words: { "zwano": zwac, "wykład": wyklad, "tłumem": tlum, "mądrością": madrosc, "karmił": karmic, "manną": manna }
  - clean: "Gdy przyszedł poznać majestat Piotrowy,\nCo niegdyś wspierał ubogie i wdowy,\nA dziś ma dla nich serce kute z miedzi,\n(O co ja świętej nie skarżę stolicy,\nLecz raczej tego, który na niej siedzi),\nNie żądał płatnych odpustów, pacierzy,\nBy za sześć liczbę dwa lub trzy odliczył\nI niezajętych posad mieć nie życzył,\nAni dziesięcin brał z pola lub z broga,\nKtóre należą do ubogich Boga."
    verse: true
    chunks:
      - pl: "Gdy przyszedł poznać majestat Piotrowy,"
        ru: "Когда он пришёл познать величие Петрово,"
      - pl: "\nCo niegdyś wspierał ubogie i wdowy,"
        ru: "что некогда поддерживало бедных и вдов,"
