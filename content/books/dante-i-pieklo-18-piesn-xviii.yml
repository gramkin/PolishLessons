# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 18
chapterTitle: "Pieśń XVIII"
chapterTitleRu: "Песнь XVIII. Злые Щели"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok 1 i 2. Rajfury i pochlebcy.)"
    chunks:
      - pl: "(Krąg VIII. Tłumok 1 i 2. Rajfury i pochlebcy.)"
        ru: "(Круг VIII. Ров 1 и 2. Сводники и льстецы.)"
        note: "tłumok — у Korsaka «ров», по-итальянски bolgia; rajfur — сводник"
    words: { "Krąg": krag }
  - clean: "Jest miejsce w piekle zwane Złe Tłumoki,\nŻelaznej barwy, a całe z opoki,\nOkólna ściana także granitowa;\nPośrodku jama wrzyna się opoką,\nTworząc szeroką studnię i głęboką,\nO której będzie na swym miejscu mowa."
    verse: true
    chunks:
      - pl: "Jest miejsce w piekle zwane Złe Tłumoki,"
        ru: "Есть в аду место, зовомое Злыми Щелями,"
        note: "Złe Tłumoki — Malebolge, «Злые Щели»"
      - pl: "\nŻelaznej barwy, a całe z opoki,"
        ru: "железного цвета и всё из камня,"
        note: "opoka — камень, скала"
      - pl: "\nOkólna ściana także granitowa;"
        ru: "окружающая стена тоже гранитная;"
        note: "okólny — окружающий"
      - pl: "\nPośrodku jama wrzyna się opoką,"
        ru: "посередине яма врезается в скалу,"
        note: "wrzynać się — врезаться"
      - pl: "\nTworząc szeroką studnię i głęboką,"
        ru: "образуя широкий и глубокий колодец,"
        note: "studnia — колодец"
      - pl: "\nO której będzie na swym miejscu mowa."
        ru: "о котором речь будет в своём месте."
    words: { "piekle": pieklo, "zwane": zwac, "jama": jama, "Tworząc": tworzyc, "szeroką": szeroki, "studnię": studnia }
  - clean: "Od zrębu studni aż po skał podnoże,\nPrzestrzeń okrągła, a całe wydroże\nDo dna porznięte na dziesięć oddziałów.\nA jako liczne przekopy i jamy\nBronią przystępu do zamkowych wałów —\nPewne schronienie od wrogów napaści —\nNa wzór ten były te kamienne tamy;\nA jako twierdza fosą otoczona\nNa brzeg jej drugi rzuca most od bramy,\nTak od stóp skały szły kamienne zęby,\nKtóre przerżnąwszy fosy i przepaści,\nKońcami w studni wpierały się zręby."
    verse: true
    chunks:
      - pl: "Od zrębu studni aż po skał podnoże,"
        ru: "От края колодца до подножия скал"
        note: "zrąb — край, сруб; podnóże — подножие"
      - pl: "\nPrzestrzeń okrągła, a całe wydroże"
        ru: "пространство круглое, и вся эта впадина"
        note: "wydroże — устар. «впадина»"
      - pl: "\nDo dna porznięte na dziesięć oddziałów."
        ru: "до дна изрезана на десять отделов."
        note: "porznięty — изрезанный"
      - pl: "\nA jako liczne przekopy i jamy"
        ru: "И как многочисленные рвы и ямы"
        note: "przekop — ров, траншея"
      - pl: "\nBronią przystępu do zamkowych wałów —"
        ru: "защищают подступ к валам замка —"
        note: "przystęp — подступ; wał — вал"
      - pl: "\nPewne schronienie od wrogów napaści —"
        ru: "надёжное убежище от нападения врагов, —"
        note: "schronienie — убежище; napaść — нападение"
      - pl: "\nNa wzór ten były te kamienne tamy;"
        ru: "по этому образцу были эти каменные плотины;"
      - pl: "\nA jako twierdza fosą otoczona"
        ru: "и как крепость, окружённая рвом,"
      - pl: "\nNa brzeg jej drugi rzuca most od bramy,"
        ru: "перекидывает мост от ворот на другой его берег,"
      - pl: "\nTak od stóp skały szły kamienne zęby,"
        ru: "так от подножия скалы шли каменные зубцы,"
      - pl: "\nKtóre przerżnąwszy fosy i przepaści,"
        ru: "которые, перерезав рвы и пропасти,"
        note: "przerżnąwszy — «перерезав»"
      - pl: "\nKońcami w studni wpierały się zręby."
        ru: "концами упирались в край колодца."
        note: "wpierać się — упираться"
    words: { "skał": skala, "okrągła": okragly, "schronienie": schronienie, "wzór": wzor, "tamy": tama, "brzeg": brzeg }
  - clean: "Kiedyśmy zsiedli z grzbietu Geryjona,\nW takie skaliste weszliśmy warownie.\nZ mistrzem na lewo zawróciłem kroku,\nNa prawo zasię widziałem w pół zmroku\nI nowych katów, i nowe katownie.\nGrzesznicy nadzy w tym pierwszym tłumoku\nJedni szli do nas, połowa szła bokiem\nW naszym kierunku, ale sporszym krokiem."
    verse: true
    chunks:
      - pl: "Kiedyśmy zsiedli z grzbietu Geryjona,"
        ru: "Когда мы сошли со спины Гериона,"
        note: "zsiąść — сойти, слезть"
      - pl: "\nW takie skaliste weszliśmy warownie."
        ru: "мы вступили в такие скалистые укрепления."
        note: "warownia — укрепление"
      - pl: "\nZ mistrzem na lewo zawróciłem kroku,"
        ru: "С учителем я повернул шаг налево,"
      - pl: "\nNa prawo zasię widziałem w pół zmroku"
        ru: "направо же я видел в полумраке"
        note: "zasię — же"
      - pl: "\nI nowych katów, i nowe katownie."
        ru: "и новых палачей, и новые застенки."
        note: "kat — палач; katownia — застенок"
      - pl: "\nGrzesznicy nadzy w tym pierwszym tłumoku"
        ru: "Грешники нагие в этом первом рву"
      - pl: "\nJedni szli do nas, połowa szła bokiem"
        ru: "одни шли к нам, половина шла сбоку"
      - pl: "\nW naszym kierunku, ale sporszym krokiem."
        ru: "в нашем направлении, но более скорым шагом."
        note: "sporszy — устар. «более скорый»"
    words: { "grzbietu": grzbiet, "warownie": warownia, "zawróciłem": zawrocic, "zmroku": zmrok, "katów": kat-2, "nadzy": nagi }
  - clean: "Rzym gdy rok święci jubileuszowy,\nPrzyjęto zwyczaj, by przez most zamkowy\nDla ogromnego nacisku pątników\nLud, idąc, na dwie dzielił się połowy.\nJedni przechodząc, mają w Santo-Pietro\nTwarz obróconą, ci w Monte-Giordano,\nŻe tłumy ludu nigdy się nie zetrą."
    verse: true
    chunks:
      - pl: "Rzym gdy rok święci jubileuszowy,"
        ru: "Когда Рим празднует юбилейный год,"
        note: "jubileuszowy — юбилейный; 1300 год"
      - pl: "\nPrzyjęto zwyczaj, by przez most zamkowy"
        ru: "был принят обычай, чтобы через замковый мост"
      - pl: "\nDla ogromnego nacisku pątników"
        ru: "из-за огромного напора паломников"
        note: "pątnik — паломник"
      - pl: "\nLud, idąc, na dwie dzielił się połowy."
        ru: "народ, идя, делился на две половины."
      - pl: "\nJedni przechodząc, mają w Santo-Pietro"
        ru: "Одни, проходя, к собору Святого Петра"
        note: "Santo-Pietro — Сан-Пьетро"
      - pl: "\nTwarz obróconą, ci w Monte-Giordano,"
        ru: "обращены лицом, те — к Монте-Джордано,"
      - pl: "\nŻe tłumy ludu nigdy się nie zetrą."
        ru: "чтобы толпы народа никогда не сталкивались."
    words: { "zwyczaj": zwyczaj, "most": most, "nacisku": nacisk, "obróconą": obrocic, "tłumy": tlum, "ludu": lud }
  - clean: "Tak z stron przeciwnych szatany rogale\nIdąc z biczami po tej czarnej skale,\nOkrutnie z tyłu smagały grzeszników.\nI na trzask pierwszy bicza jakby gnano\nTrzodę ze szkody, cały tłum uciekał,\nNikt na trzask drugi i trzeci nie czekał."
    verse: true
    chunks:
      - pl: "Tak z stron przeciwnych szatany rogale"
        ru: "Так с противоположных сторон рогатые бесы,"
        note: "rogal — здесь «рогатый»"
      - pl: "\nIdąc z biczami po tej czarnej skale,"
        ru: "идя с бичами по этой чёрной скале,"
      - pl: "\nOkrutnie z tyłu smagały grzeszników."
        ru: "жестоко хлестали грешников сзади."
        note: "smagać — хлестать"
      - pl: "\nI na trzask pierwszy bicza jakby gnano"
        ru: "И при первом щелчке бича, будто гнали"
        note: "trzask — щелчок"
      - pl: "\nTrzodę ze szkody, cały tłum uciekał,"
        ru: "стадо с потравы, вся толпа убегала,"
        note: "szkoda — здесь «потрава»"
      - pl: "\nNikt na trzask drugi i trzeci nie czekał."
        ru: "никто второго и третьего щелчка не ждал."
    words: { "przeciwnych": przeciwny, "szatany": szatan, "Okrutnie": okrutnie, "smagały": smagac, "Trzodę": trzoda, "szkody": szkoda }
  - clean: "Podczas gdy szedłem ponad jamą ciemną,\nWidzę, znajomy potępieniec kroczy,\nI rzekłem: «Znam go, nie mylą mnie oczy».\nWstrzymałem kroku, a nie chcąc mnie smucić,\nWódz mój łagodny zatrzymał się ze mną,\nKrok trochę na wstecz pozwolił mi zwrócić."
    verse: true
    chunks:
      - pl: "Podczas gdy szedłem ponad jamą ciemną,"
        ru: "Пока я шёл над тёмной ямой,"
      - pl: "\nWidzę, znajomy potępieniec kroczy,"
        ru: "вижу — знакомый осуждённый шагает,"
      - pl: "\nI rzekłem: «Znam go, nie mylą mnie oczy»."
        ru: "и я сказал: «Я его знаю, глаза меня не обманывают»."
      - pl: "\nWstrzymałem kroku, a nie chcąc mnie smucić,"
        ru: "Я задержал шаг, а, не желая меня огорчать,"
      - pl: "\nWódz mój łagodny zatrzymał się ze mną,"
        ru: "мой кроткий вождь остановился со мной,"
      - pl: "\nKrok trochę na wstecz pozwolił mi zwrócić."
        ru: "позволил мне немного повернуть шаг назад."
    words: { "ciemną": ciemny, "rzekłem": rzec, "Wstrzymałem": wstrzymac, "Wódz": wodz, "łagodny": lagodny, "wstecz": wstecz }
  - clean: "Lecz duch smagany wpadł na wybieg nowy,\nChciał mi się ukryć nachyleniem głowy;\nJa mówię: «Ty, co wzrok spuszczasz tak dziko,\nJeśli twych rysów wyraz niekłamany,\nPoznaję ciebie, witaj Wenediko\nZa jaką winę jesteś tak chłostany?»"
    verse: true
    chunks:
      - pl: "Lecz duch smagany wpadł na wybieg nowy,"
        ru: "Но хлещемый дух напал на новую уловку,"
        note: "wybieg — уловка"
      - pl: "\nChciał mi się ukryć nachyleniem głowy;"
        ru: "хотел от меня скрыться, наклонив голову;"
      - pl: "\nJa mówię: «Ty, co wzrok spuszczasz tak dziko,"
        ru: "я говорю: «Ты, что так дико опускаешь взгляд,"
      - pl: "\nJeśli twych rysów wyraz niekłamany,"
        ru: "если выражение твоих черт не обманчиво,"
        note: "niekłamany — неподдельный"
      - pl: "\nPoznaję ciebie, witaj Wenediko"
        ru: "я узнаю тебя, здравствуй, Венедико!"
        note: "Венедико Каччанемико из Болоньи"
      - pl: "\nZa jaką winę jesteś tak chłostany?»"
        ru: "За какую вину тебя так бичуют?»"
        note: "chłostać — бичевать"
    words: { "duch": duch, "ukryć": ukryc, "wzrok": wzrok, "wyraz": wyraz, "niekłamany": klamac, "Poznaję": poznawac }
  - clean: "«Ze wstrętem mówię, jaka moja wina,\nChociaż wstręt głos twój łagodzi srebrzysty,\nGłos, co mi świat mój niegdyś przypomina.\nJestem ten, który jako duch nieczysty\nSkusiłem piękną mą siostrę Gizolę,\nAby się zdała na margrafa wolę."
    verse: true
    chunks:
      - pl: "«Ze wstrętem mówię, jaka moja wina,"
        ru: "«С отвращением говорю, какова моя вина,"
      - pl: "\nChociaż wstręt głos twój łagodzi srebrzysty,"
        ru: "хоть отвращение смягчает твой серебристый голос,"
        note: "srebrzysty — серебристый"
      - pl: "\nGłos, co mi świat mój niegdyś przypomina."
        ru: "голос, что напоминает мне некогда мой мир."
      - pl: "\nJestem ten, który jako duch nieczysty"
        ru: "Я тот, кто, как нечистый дух,"
      - pl: "\nSkusiłem piękną mą siostrę Gizolę,"
        ru: "соблазнил мою прекрасную сестру Гизолу"
        note: "skusić — соблазнить"
      - pl: "\nAby się zdała na margrafa wolę."
        ru: "отдаться на волю маркграфа."
        note: "zdać się na coś — отдаться; margraf — маркграф"
    words: { "głos": glos, "świat": swiat, "przypomina": przypominac, "piękną": piekny, "siostrę": siostra, "zdała": zdac }
  - clean: "Różnie w powieściach brzmi ta historyja!\nNiejeden tutaj grzbiet biczami sieką,\nPełno tu moich ziomków Bolończyków;\nPomiędzy Reno a Saweny rzeką,\nWięcej nie spotkasz nawykłych języków\nDo wymawiania sipa zamiast sia;\nGdy chcesz świadectwo mieć tej prawdy godne,\nWspomnij na nasze łakomstwo przyrodne."
    verse: true
    chunks:
      - pl: "Różnie w powieściach brzmi ta historyja!"
        ru: "По-разному звучит эта история в рассказах!"
        note: "powieść — рассказ; historyja — старое написание"
      - pl: "\nNiejeden tutaj grzbiet biczami sieką,"
        ru: "Не одному тут спину бичами секут,"
      - pl: "\nPełno tu moich ziomków Bolończyków;"
        ru: "полно тут моих земляков-болонцев;"
      - pl: "\nPomiędzy Reno a Saweny rzeką,"
        ru: "между Рено и рекой Савеной"
        note: "Saweny — Савена"
      - pl: "\nWięcej nie spotkasz nawykłych języków"
        ru: "больше не встретишь языков, привыкших"
        note: "nawykły — привыкший"
      - pl: "\nDo wymawiania sipa zamiast sia;"
        ru: "выговаривать «сипа» вместо «сиа»;"
        note: "sipa — болонское «да»"
      - pl: "\nGdy chcesz świadectwo mieć tej prawdy godne,"
        ru: "если хочешь иметь достойное свидетельство этой правды,"
      - pl: "\nWspomnij na nasze łakomstwo przyrodne."
        ru: "вспомни нашу врождённую жадность."
        note: "łakomstwo — жадность; przyrodny — врождённый"
    words: { "powieściach": powiesc-noun, "brzmi": brzmiec, "spotkasz": spotkac, "języków": jezyk, "prawdy": prawda, "Wspomnij": wspomniec }
  - clean: "Gdy mówił, szatan uderzył go biczem:\n«Idź,» krzyknął, «z swoim gronem wszetecznieczem,\nTu nie ma targów na wdzięki niewieście!»\nJa do mojego wracam przewodnika;\nIdąc znów za nim przyszliśmy nareszcie,\nGdzie skała ramię kamienne wytyka."
    verse: true
    chunks:
      - pl: "Gdy mówił, szatan uderzył go biczem:"
        ru: "Пока он говорил, бес ударил его бичом:"
      - pl: "\n«Idź,» krzyknął, «z swoim gronem wszetecznieczem,"
        ru: "«Иди, — крикнул, — со своей распутной компанией,"
        note: "wszetecznieczy — устар. «распутный»"
      - pl: "\nTu nie ma targów na wdzięki niewieście!»"
        ru: "здесь нет торгов на женские прелести!»"
        note: "targ — торг; wdzięki — прелести"
      - pl: "\nJa do mojego wracam przewodnika;"
        ru: "Я возвращаюсь к своему проводнику;"
      - pl: "\nIdąc znów za nim przyszliśmy nareszcie,"
        ru: "идя снова за ним, мы пришли наконец"
      - pl: "\nGdzie skała ramię kamienne wytyka."
        ru: "туда, где скала выставляет каменное плечо."
        note: "wytykać — выставлять"
    words: { "uderzył": uderzyc, "gronem": grono, "targów": targ, "niewieście": niewiasta, "przewodnika": przewodnik, "ramię": ramie }
  - clean: "I szliśmy lekko po skale i żwawo,\nDalszy nasz pochód zwracając na prawo.\nGdyśmy wstąpili na łuk jej arkady,\nPod którą duchów przechodzą gromady,\nMój wódz «Stój,» mówił, «daj folgę krokowi!\nPatrz, oto idą potępieńcy nowi,\nJeszcześ ich widzieć nie mógł oko w oko,\nBo w tym kierunku idą pod opoką»."
    verse: true
    chunks:
      - pl: "I szliśmy lekko po skale i żwawo,"
        ru: "И мы шли легко по скале и бодро,"
        note: "żwawo — бодро"
      - pl: "\nDalszy nasz pochód zwracając na prawo."
        ru: "направляя наш дальнейший поход направо."
      - pl: "\nGdyśmy wstąpili na łuk jej arkady,"
        ru: "Когда мы взошли на дугу её арки,"
        note: "arkada — арка"
      - pl: "\nPod którą duchów przechodzą gromady,"
        ru: "под которой проходят толпы духов,"
      - pl: "\nMój wódz «Stój,» mówił, «daj folgę krokowi!"
        ru: "мой вождь сказал: «Стой, дай отдых шагу!"
        note: "dać folgę — дать послабление"
      - pl: "\nPatrz, oto idą potępieńcy nowi,"
        ru: "Смотри, вот идут новые осуждённые,"
      - pl: "\nJeszcześ ich widzieć nie mógł oko w oko,"
        ru: "ты ещё не мог их видеть лицом к лицу,"
        note: "oko w oko — лицом к лицу"
      - pl: "\nBo w tym kierunku idą pod opoką»."
        ru: "ибо они идут в этом направлении под скалой»."
    words: { "Dalszy": daleki, "zwracając": zwracac, "wstąpili": wstapic, "przechodzą": przechodzic, "krokowi": krok, "kierunku": kierunek }
  - clean: "Z starego mostu, pod jego łukami,\nWidzę, cug duchów przeciągał przed nami,\nBiczem jak pierwszy zarówno smagany.\nA dobry mistrz mój mówił niepytany:\n«Patrz, wyższy głową nad wszystkich cień idzie,\nA który mimo częstych razów bicza,\nZda się, łzą jedną nie zwilżył oblicza."
    verse: true
    chunks:
      - pl: "Z starego mostu, pod jego łukami,"
        ru: "Со старого моста, под его арками,"
      - pl: "\nWidzę, cug duchów przeciągał przed nami,"
        ru: "вижу — вереница духов тянулась перед нами,"
        note: "cug — вереница"
      - pl: "\nBiczem jak pierwszy zarówno smagany."
        ru: "так же хлещемая бичом, как первая."
      - pl: "\nA dobry mistrz mój mówił niepytany:"
        ru: "А мой добрый учитель сказал, не спрошенный:"
        note: "niepytany — не спрошенный"
      - pl: "\n«Patrz, wyższy głową nad wszystkich cień idzie,"
        ru: "«Смотри, идёт тень, на голову выше всех,"
      - pl: "\nA który mimo częstych razów bicza,"
