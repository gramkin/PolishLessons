  - clean: "Dla wielu była to zagadka nie do rozgryzienia: co ci dwaj widzą w sobie nawzajem i jaki wspólny temat potrafią znaleźć. Ci, którzy spotykali ich podczas niedzielnych spacerów, opowiadali, że nic nie mówili, wyglądali na wyjątkowo znudzonych i z wyraźną ulgą witali pojawienie się jakiegoś znajomego. Mimo to obaj przywiązywali do tych wypraw największą wagę, uważali je za najcenniejszy klejnot każdego tygodnia i nie tylko rezygnowali dla nich z przyjemności, ale nawet opierali się wezwaniom interesów, żeby nikt im ich nie przerywał."
    en: "It was a nut to crack for many, what these two could see in each other, or what subject they could find in common. It was reported by those who encountered them in their Sunday walks, that they said nothing, looked singularly dull and would hail with obvious relief the appearance of a friend. For all that, the two men put the greatest store by these excursions, counted them the chief jewel of each week, and not only set aside occasions of pleasure, but even resisted the calls of business, that they might enjoy them uninterrupted."
    draft: true
    chunks:
      - pl: "Dla wielu była to zagadka nie do rozgryzienia:"
        ru: "Для многих это была неразрешимая загадка:"
