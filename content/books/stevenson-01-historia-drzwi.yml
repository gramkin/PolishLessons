paragraphs:
  - clean: "Pan Utterson, adwokat, był człowiekiem o surowej twarzy, której nigdy nie rozjaśniał uśmiech; w rozmowie chłodny, małomówny i niezręczny; powściągliwy w uczuciach; chudy, wysoki, wyblakły, posępny, a mimo to w jakiś sposób budzący sympatię. Na przyjacielskich spotkaniach, gdy wino przypadło mu do smaku, z jego oczu wyzierało coś na wskroś ludzkiego; coś, co wprawdzie nigdy nie znajdowało drogi do jego słów, lecz przemawiało nie tylko w tych milczących znakach poobiedniej twarzy, ale częściej i głośniej w jego czynach. Wobec siebie był surowy; gdy był sam, pił dżin, żeby umartwić w sobie upodobanie do dobrych win; i choć lubił teatr, od dwudziestu lat nie przekroczył progu żadnego z nich."
    en: "Mr. Utterson the lawyer was a man of a rugged countenance that was never lighted by a smile; cold, scanty and embarrassed in discourse; backward in sentiment; lean, long, dusty, dreary and yet somehow lovable. At friendly meetings, and when the wine was to his taste, something eminently human beaconed from his eye; something indeed which never found its way into his talk, but which spoke not only in these silent symbols of the after-dinner face, but more often and loudly in the acts of his life. He was austere with himself; drank gin when he was alone, to mortify a taste for vintages; and though he enjoyed the theatre, had not crossed the doors of one for twenty years."
    draft: true
    chunks:
      - pl: "Pan Utterson, adwokat, był człowiekiem o surowej twarzy, której nigdy nie rozjaśniał uśmiech;"
