  - clean: "Wobec innych okazywał jednak wypróbowaną wyrozumiałość; czasem dziwił się, niemal z zazdrością, sile namiętności, jakiej wymagały ich występki; a w każdej ostateczności skłonny był raczej pomóc niż ganić. — Skłaniam się ku herezji Kaina — mawiał dziwacznie. — Pozwalam bratu iść do diabła jego własną drogą. Z takim charakterem często przypadał mu los ostatniego szanowanego znajomego i ostatniego dobrego wpływu w życiu ludzi staczających się na dno. A wobec takich, dopóki przychodzili do jego kancelarii, nigdy nie zmienił się ani o odcień w swoim zachowaniu."
    en: "But he had an approved tolerance for others; sometimes wondering, almost with envy, at the high pressure of spirits involved in their misdeeds; and in any extremity inclined to help rather than to reprove. “I incline to Cain’s heresy,” he used to say quaintly: “I let my brother go to the devil in his own way.” In this character, it was frequently his fortune to be the last reputable acquaintance and the last good influence in the lives of downgoing men. And to such as these, so long as they came about his chambers, he never marked a shade of change in his demeanour."
    draft: true
    chunks:
      - pl: "Wobec innych okazywał jednak wypróbowaną wyrozumiałość;"
