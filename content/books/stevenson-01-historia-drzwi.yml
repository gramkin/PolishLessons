  - clean: "Zdarzyło się, że podczas jednej z tych przechadzek trafili w boczną uliczkę w ruchliwej dzielnicy Londynu. Uliczka była mała i, jak to się mówi, spokojna, ale w dni powszednie kwitł na niej handel. Mieszkańcom, jak się zdawało, wiodło się dobrze i wszyscy na wyścigi liczyli, że będzie im się wiodło jeszcze lepiej, a nadwyżki zysków wydawali na kokieterię; tak że witryny sklepów stały wzdłuż ulicy z zapraszającą miną, jak rzędy uśmiechniętych sprzedawczyń."
    en: "It chanced on one of these rambles that their way led them down a by-street in a busy quarter of London. The street was small and what is called quiet, but it drove a thriving trade on the weekdays. The inhabitants were all doing well, it seemed, and all emulously hoping to do better still, and laying out the surplus of their gains in coquetry; so that the shop fronts stood along that thoroughfare with an air of invitation, like rows of smiling saleswomen."
    draft: true
    chunks:
