  - clean: "Była jednak jedna osobliwa okoliczność. Od pierwszego wejrzenia poczułem do mojego dżentelmena wstręt. Rodzina dziecka również, co było całkiem naturalne. Ale uderzył mnie przypadek lekarza. Był to zwykły, suchy i rzeczowy aptekarz, w nieokreślonym wieku i nijakiej barwy, z silnym edynburskim akcentem i mniej więcej tak uczuciowy jak dudy. Otóż, proszę pana, był taki jak my wszyscy; za każdym razem, gdy patrzył na mojego więźnia, widziałem, jak ten konował blednie i robi mu się słabo z chęci, by go zabić. Wiedziałem, co mu chodzi po głowie, tak jak on wiedział, co chodzi po mojej; a ponieważ zabójstwo nie wchodziło w grę, zrobiliśmy to, co było najlepsze w zamian."
