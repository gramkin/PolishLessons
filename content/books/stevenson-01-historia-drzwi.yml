  - clean: "Powiedzieliśmy temu człowiekowi, że możemy i zrobimy z tego taki skandal, że jego nazwisko będzie cuchnąć od jednego końca Londynu do drugiego. Jeśli miał jakichś przyjaciół albo jakąś reputację, zobowiązaliśmy się, że je straci. A przez cały czas, gdy tak na niego z furią nacieraliśmy, odpędzaliśmy od niego kobiety, jak tylko mogliśmy, bo były dzikie jak harpie. Nigdy nie widziałem kręgu tak nienawistnych twarzy; a pośrodku stał ten człowiek z jakimś czarnym, szyderczym chłodem — przestraszony też, widziałem to — ale trzymał fason, proszę pana, zupełnie jak szatan."
