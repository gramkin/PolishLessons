  - clean: "Bez wątpienia przychodziło to panu Uttersonowi łatwo; był bowiem w najlepszym razie człowiekiem nieskorym do wylewności, a nawet jego przyjaźń zdawała się opierać na podobnie szerokiej życzliwości. Znakiem skromnego człowieka jest przyjmować krąg przyjaciół gotowy, z rąk przypadku; i taki był obyczaj adwokata. Jego przyjaciółmi byli krewni albo ci, których znał najdłużej; jego uczucia, jak bluszcz, rosły z czasem i nie świadczyły o żadnych zaletach ich przedmiotu. Stąd zapewne więź, która łączyła go z panem Richardem Enfieldem, jego dalekim krewnym, znanym bywalcem salonów."
    en: "No doubt the feat was easy to Mr. Utterson; for he was undemonstrative at the best, and even his friendship seemed to be founded in a similar catholicity of good-nature. It is the mark of a modest man to accept his friendly circle ready-made from the hands of opportunity; and that was the lawyer’s way. His friends were those of his own blood or those whom he had known the longest; his affections, like ivy, were the growth of time, they implied no aptness in the object. Hence, no doubt the bond that united him to Mr. Richard Enfield, his distant kinsman, the well-known man about town."
    draft: true
    chunks:
      - pl: "Bez wątpienia przychodziło to panu Uttersonowi łatwo;"
