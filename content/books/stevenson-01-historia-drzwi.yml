        note: "dzień powszedni — будний день; kwitnąć — процветать"
      - pl: " Mieszkańcom, jak się zdawało, wiodło się dobrze"
        ru: "Жителям, как казалось, жилось хорошо,"
        note: "wieść się komuś — житься, удаваться кому-л."
      - pl: " i wszyscy na wyścigi liczyli, że będzie im się wiodło jeszcze lepiej,"
