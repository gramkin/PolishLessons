  - clean: "Dwa domy od jednego z rogów, po lewej stronie, idąc na wschód, ciąg domów przerywał wjazd na podwórze; i właśnie w tym miejscu pewien złowrogi budynek wysuwał na ulicę swój szczyt. Był piętrowy; nie miał okien, nic poza drzwiami na parterze i ślepym czołem odbarwionego muru na górze; i każdym swoim rysem nosił ślady długotrwałego i plugawego zaniedbania."
    en: "Two doors from one corner, on the left hand going east the line was broken by the entry of a court; and just at that point a certain sinister block of building thrust forward its gable on the street. It was two storeys high; showed no window, nothing but a door on the lower storey and a blind forehead of discoloured wall on the upper; and bore in every feature, the marks of prolonged and sordid negligence."
    draft: true
