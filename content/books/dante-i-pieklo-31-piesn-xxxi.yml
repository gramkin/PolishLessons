level: B2
paragraphs:
  - clean: "(Do kręgu IX. Studnia. Olbrzymi. Anteus osadza poetów na dnie piekła.)"
    chunks:
      - pl: "(Do kręgu IX. Studnia. Olbrzymi. Anteus osadza poetów na dnie piekła.)"
        ru: "(К кругу IX. Колодец. Гиганты. Антей опускает поэтов на дно ада.)"
        note: "olbrzym — великан; osadzać — сажать"
    words: { "kręgu": krag, "Studnia": studnia, "poetów": poeta }
  - clean: "Język, co wprzódy zranił mnie do tyla,\nŻem spłonął wstydem, wnet balsam żądany\nPodał i leczył jak włócznia Achilla,\nCo i raniła, i leczyła rany.\nI milcząc szliśmy od tej smutnej jamy,\nBrzegiem krążącej wokoło niej tamy;\nTam nie noc, zmrok był pół nocny, pół dzienny,\nWidziałem tylko szary grunt kamienny,\nLecz echo za mną dźwiękiem rogu grało,\nDźwiękiem, co mógłby zagłuszyć trzask grzmotu."
    verse: true
    chunks:
      - pl: "Język, co wprzódy zranił mnie do tyla,"
        ru: "Язык, что прежде так ранил меня,"
        note: "do tyla — настолько"
      - pl: "\nŻem spłonął wstydem, wnet balsam żądany"
        ru: "что я зарделся от стыда, тотчас желанный бальзам"
        note: "spłonąć wstydem — зардеться от стыда"
      - pl: "\nPodał i leczył jak włócznia Achilla,"
        ru: "подал и лечил, как копьё Ахилла,"
        note: "włócznia — копьё"
      - pl: "\nCo i raniła, i leczyła rany."
        ru: "что и ранило, и лечило раны."
      - pl: "\nI milcząc szliśmy od tej smutnej jamy,"
        ru: "И молча мы шли от этой печальной ямы"
      - pl: "\nBrzegiem krążącej wokoło niej tamy;"
        ru: "по краю кружащей вокруг неё плотины;"
      - pl: "\nTam nie noc, zmrok był pół nocny, pół dzienny,"
        ru: "там была не ночь, сумрак — полуночный, полудневной,"
      - pl: "\nWidziałem tylko szary grunt kamienny,"
        ru: "я видел лишь серую каменную почву,"
      - pl: "\nLecz echo za mną dźwiękiem rogu grało,"
        ru: "но эхо за мной звучало звуком рога,"
      - pl: "\nDźwiękiem, co mógłby zagłuszyć trzask grzmotu."
        ru: "звуком, что мог бы заглушить раскат грома."
    words: { "wprzódy": wprzody, "spłonął": splonac, "zmrok": zmrok, "dzienny": dzienny, "szary": szary, "grunt": grunt }
  - clean: "W stronę, skąd dźwięk ten pobrzmiewał za skałą,\nOczy z uwagą obróciłem całą.\nNie tak straszliwie Roland do odwrotu\nDął w róg wojenny, gdy z chrześcijan żalem\nKarloman przegrał bój pod Ronsewalem\nPodniosłem głowę; nad poziom opoki,\nZda się z jej gruntu, tłum wieżyc wyrasta,\nDlatego rzekłem: «Widzę mur wysoki,\nMistrzu, jakiego to widok jest miasta?»"
    verse: true
    chunks:
      - pl: "W stronę, skąd dźwięk ten pobrzmiewał za skałą,"
        ru: "В сторону, откуда этот звук доносился из-за скалы,"
      - pl: "\nOczy z uwagą obróciłem całą."
        ru: "я обратил глаза со всем вниманием."
      - pl: "\nNie tak straszliwie Roland do odwrotu"
        ru: "Не так страшно Роланд к отступлению"
      - pl: "\nDął w róg wojenny, gdy z chrześcijan żalem"
        ru: "трубил в боевой рог, когда, к горю христиан,"
      - pl: "\nKarloman przegrał bój pod Ronsewalem"
        ru: "Карл проиграл битву при Ронсевале."
        note: "Karloman — у Korsaka вместо Карла Великого"
      - pl: "\nPodniosłem głowę; nad poziom opoki,"
        ru: "Я поднял голову; над уровнем скалы,"
        note: "poziom — уровень"
      - pl: "\nZda się z jej gruntu, tłum wieżyc wyrasta,"
        ru: "кажется, из самой её почвы, вырастает толпа башен,"
        note: "wieżyca — башенка"
      - pl: "\nDlatego rzekłem: «Widzę mur wysoki,"
        ru: "поэтому я сказал: «Вижу высокую стену,"
      - pl: "\nMistrzu, jakiego to widok jest miasta?»"
        ru: "учитель, что это за город с виду?»"
    words: { "skałą": skala, "obróciłem": obrocic, "odwrotu": odwrot, "wojenny": wojenny, "chrześcijan": chrzescijanin, "rzekłem": rzec }
  - clean: "A mistrz: «Tyś w błędzie, bo patrzysz z daleka,\nGdy przyjdziesz bliżej, uzna twa powieka,\nJak oddalenie fałszuje zmysł wzroku,\nWięc trochę więcej przyspiesz twego kroku».\nWziął mnie za rękę i czule ją ściska,\nI mówi: «Nim ten przedmiot ujrzysz z bliska,\nAby mniej dziwnym zdał się, jak widzimy,\nWiedz, że nie wieże to są, lecz olbrzymy,\nOd stóp po biodra sami i bezludni,\nWokoło zrębów stoją w wielkiej studni»."
    verse: true
    chunks:
      - pl: "A mistrz: «Tyś w błędzie, bo patrzysz z daleka,"
        ru: "А учитель: «Ты ошибаешься, ибо смотришь издалека,"
      - pl: "\nGdy przyjdziesz bliżej, uzna twa powieka,"
        ru: "когда подойдёшь ближе, твой глаз признает,"
      - pl: "\nJak oddalenie fałszuje zmysł wzroku,"
        ru: "как расстояние обманывает чувство зрения,"
      - pl: "\nWięc trochę więcej przyspiesz twego kroku»."
        ru: "так ускорь немного свой шаг»."
      - pl: "\nWziął mnie za rękę i czule ją ściska,"
        ru: "Он взял меня за руку и нежно её сжимает"
      - pl: "\nI mówi: «Nim ten przedmiot ujrzysz z bliska,"
        ru: "и говорит: «Прежде чем ты увидишь этот предмет вблизи,"
      - pl: "\nAby mniej dziwnym zdał się, jak widzimy,"
        ru: "чтобы он показался менее странным, чем видим,"
      - pl: "\nWiedz, że nie wieże to są, lecz olbrzymy,"
        ru: "знай, что это не башни, а великаны,"
      - pl: "\nOd stóp po biodra sami i bezludni,"
        ru: "от ног до бёдер одинокие и безлюдные,"
        note: "bezludny — безлюдный"
      - pl: "\nWokoło zrębów stoją w wielkiej studni»."
        ru: "стоят вокруг краёв в великом колодце»."
        note: "zręby — края"
    words: { "zmysł": zmysl, "przyspiesz": przyspieszyc, "przedmiot": przedmiot, "ujrzysz": ujrzec, "olbrzymy": olbrzym, "biodra": biodro }
  - clean: "Jak wzrok wśród mglistej uwięzły ciemnoty\nZ wolna odkrywa ukryte przedmioty,\nGdy mgła spadając ze światłem się zetrze;\nTak przerzynając to ciemne powietrze,\nW miarę jak szedłem pod studni tej progi,\nBłąd mój się rozwiał, a wzrastał chłód trwogi\nJak wieże zamku Monteregijone\nTworzą okrągłych jego ścian koronę,\nTak nad zrąb studni pod same podpasy\nSterczały wkoło potworne Gigasy,\nA którym zda się jeszcze groził z góry,\nPiorunem Jowisz, gdy brzmi z ciemnej chmury,\nJeden stał twarzą do nas obrócony,\nBarkami, piersią i dwoma ramiony;"
    verse: true
    chunks:
      - pl: "Jak wzrok wśród mglistej uwięzły ciemnoty"
        ru: "Как взгляд, застрявший среди туманной тьмы,"
        note: "ciemnota — тьма"
      - pl: "\nZ wolna odkrywa ukryte przedmioty,"
        ru: "медленно открывает скрытые предметы,"
      - pl: "\nGdy mgła spadając ze światłem się zetrze;"
        ru: "когда туман, опадая, сталкивается со светом;"
      - pl: "\nTak przerzynając to ciemne powietrze,"
        ru: "так, прорезая этот тёмный воздух,"
      - pl: "\nW miarę jak szedłem pod studni tej progi,"
        ru: "по мере того как я шёл к порогам этого колодца,"
      - pl: "\nBłąd mój się rozwiał, a wzrastał chłód trwogi"
        ru: "моя ошибка развеялась, а рос холод страха."
      - pl: "\nJak wieże zamku Monteregijone"
        ru: "Как башни замка Монтериджони"
      - pl: "\nTworzą okrągłych jego ścian koronę,"
        ru: "образуют корону его круглых стен,"
      - pl: "\nTak nad zrąb studni pod same podpasy"
        ru: "так над краем колодца, до самых подмышек,"
      - pl: "\nSterczały wkoło potworne Gigasy,"
        ru: "торчали кругом чудовищные гиганты,"
        note: "Gigas — гигант"
      - pl: "\nA którym zda się jeszcze groził z góry,"
        ru: "которым, кажется, ещё грозил сверху"
      - pl: "\nPiorunem Jowisz, gdy brzmi z ciemnej chmury,"
        ru: "молнией Юпитер, когда гремит из тёмной тучи."
      - pl: "\nJeden stał twarzą do nas obrócony,"
        ru: "Один стоял, обращённый к нам лицом,"
      - pl: "\nBarkami, piersią i dwoma ramiony;"
        ru: "плечами, грудью и обеими руками;"
    words: { "mgła": mgla, "miarę": miara, "progi": prog, "okrągłych": okragly, "koronę": korona, "Piorunem": piorun }
  - clean: "Zaiste, jeśli natura przestała\nTworzyć olbrzymy, w tym loicznie działa,\nBo przez to, gwoli świata pokojowi,\nTakich siłaczy odjęła Marsowi.\nA gdy bez troski zapładza w swym łonie\nJeszcze ogromne wieloryby, słonie,\nŁatwo w tym dojrzy ludzka przenikliwość\nMądrą ostrożność jej i sprawiedliwość."
    verse: true
    chunks:
      - pl: "Zaiste, jeśli natura przestała"
        ru: "воистину, если природа перестала"
      - pl: "\nTworzyć olbrzymy, w tym loicznie działa,"
        ru: "творить великанов, в этом она действует логично,"
        note: "loicznie — устар. «логично»"
      - pl: "\nBo przez to, gwoli świata pokojowi,"
        ru: "ибо тем, ради мира на свете,"
      - pl: "\nTakich siłaczy odjęła Marsowi."
        ru: "она отняла у Марса таких силачей."
        note: "siłacz — силач; odjąć — отнять"
      - pl: "\nA gdy bez troski zapładza w swym łonie"
        ru: "А если она без тревоги зачинает в своём лоне"
        note: "zapładzać — оплодотворять"
      - pl: "\nJeszcze ogromne wieloryby, słonie,"
        ru: "ещё огромных китов, слонов,"
        note: "wieloryb — кит"
      - pl: "\nŁatwo w tym dojrzy ludzka przenikliwość"
        ru: "легко в этом увидит человеческая проницательность"
        note: "przenikliwość — проницательность"
      - pl: "\nMądrą ostrożność jej i sprawiedliwość."
        ru: "её мудрую осторожность и справедливость."
    words: { "natura": natura, "troski": troska, "wieloryby": wieloryb, "słonie": slon, "ostrożność": ostroznosc, "sprawiedliwość": sprawiedliwosc }
  - clean: "Bo gdzie się rozum człowieka zespoli\nZ siłą potęgi i chęcią złej woli,\nTam ludziom opór nigdy się nie uda.\nCzaszka tak wielka była wielkoluda,\nJakby świętego Piotra szyszka w Rzymie.\nI inne kości miał równie olbrzymie:\nTak, że począwszy od pasa w pół ciała,\nTrzech Fryzów rosłych, daremna ich chluba,\nLedwo by wzrostem doszli mu do czuba;\nBo jego wzrostu potworna wyżyna,\nMogła, jak studni kończyły się zręby,\nDo miejsca, człowiek gdzie płaszcz swój zapina,\nMieć miar trzydzieści wielkiej rzymskiej palmy."
    verse: true
    chunks:
      - pl: "Bo gdzie się rozum człowieka zespoli"
        ru: "Ибо где разум человека соединится"
      - pl: "\nZ siłą potęgi i chęcią złej woli,"
        ru: "с силой мощи и злой волей,"
        note: "zespolić się — соединиться"
      - pl: "\nTam ludziom opór nigdy się nie uda."
        ru: "там людям сопротивление никогда не удастся."
      - pl: "\nCzaszka tak wielka była wielkoluda,"
        ru: "Голова у великана была так велика,"
        note: "wielkolud — великан"
      - pl: "\nJakby świętego Piotra szyszka w Rzymie."
        ru: "как шишка святого Петра в Риме."
        note: "szyszka — шишка; бронзовая шишка у собора"
      - pl: "\nI inne kości miał równie olbrzymie:"
        ru: "И другие кости были у него столь же огромны:"
      - pl: "\nTak, że począwszy od pasa w pół ciała,"
        ru: "так что, начиная от пояса, полтела —"
      - pl: "\nTrzech Fryzów rosłych, daremna ich chluba,"
        ru: "трое рослых фризов, напрасна их гордость,"
        note: "Fryz — фриз (житель Фрисландии)"
      - pl: "\nLedwo by wzrostem doszli mu do czuba;"
        ru: "едва ли достали бы ростом ему до макушки;"
        note: "czub — макушка"
      - pl: "\nBo jego wzrostu potworna wyżyna,"
        ru: "ибо чудовищная высота его роста"
      - pl: "\nMogła, jak studni kończyły się zręby,"
        ru: "могла, там, где кончались края колодца,"
      - pl: "\nDo miejsca, człowiek gdzie płaszcz swój zapina,"
        ru: "до места, где человек застёгивает плащ,"
        note: "zapinać — застёгивать"
      - pl: "\nMieć miar trzydzieści wielkiej rzymskiej palmy."
        ru: "иметь тридцать мер большой римской пяди."
        note: "palma — ладонь, пядь"
    words: { "rozum": rozum, "potęgi": potega, "opór": opor, "Czaszka": czaszka, "począwszy": poczac, "wzrostem": wzrost }
  - clean: "Rapho Lmaj Amec! jakaś mowa brzmiała\nDzika, nam obca, z jego dumnej gęby,\nDla której słodsze niestosowne psalmy.\nMój wódz doń mówił: «Nieroztropny duchu!\nZadmij w róg, niech się rozlega w twym uchu\nŁowczy dźwięk rogu; jeśli tobą miota\nGniew albo inna namiętność żywota,\nUlgi twej męce szukaj w jego brzmieniu:\nPatrz, on z twej szyi zwisa na rzemieniu,\nKtóry ogromną twoją pierś oplata»."
    verse: true
    chunks:
      - pl: "Rapho Lmaj Amec! jakaś mowa brzmiała"
        ru: "«Рафо лмай амек!» — какая-то речь звучала,"
        note: "бессмысленные слова Нимрода"
      - pl: "\nDzika, nam obca, z jego dumnej gęby,"
        ru: "дикая, нам чужая, из его гордых уст,"
      - pl: "\nDla której słodsze niestosowne psalmy."
        ru: "для которой не подходят более сладкие псалмы."
        note: "niestosowny — неподходящий"
      - pl: "\nMój wódz doń mówił: «Nieroztropny duchu!"
        ru: "Мой вождь сказал ему: «Безрассудный дух!"
      - pl: "\nZadmij w róg, niech się rozlega w twym uchu"
        ru: "Дуй в рог, пусть раздаётся в твоём ухе"
      - pl: "\nŁowczy dźwięk rogu; jeśli tobą miota"
        ru: "охотничий звук рога; если тобой мечет"
      - pl: "\nGniew albo inna namiętność żywota,"
        ru: "гнев или иная страсть жизни,"
      - pl: "\nUlgi twej męce szukaj w jego brzmieniu:"
        ru: "ищи облегчения своей муки в его звучании:"
      - pl: "\nPatrz, on z twej szyi zwisa na rzemieniu,"
        ru: "смотри, он висит у тебя на шее на ремне,"
        note: "rzemień — ремень"
      - pl: "\nKtóry ogromną twoją pierś oplata»."
        ru: "что оплетает твою огромную грудь»."
    words: { "gęby": geba, "wódz": wodz, "Gniew": gniew, "Ulgi": ulga, "szyi": szyja, "pierś": piers }
  - clean: "Potem rzekł do mnie: «Patrz, to duch Nemroda,\nGłupi, sam siebie oskarża w swej dumie,\nŻe przezeń znikła jedna mowa świata.\nZostawmy jego, tu słów naszych szkoda,\nMy go nie pojmiem, on nas nie zrozumie».\nI szliśmy kołem, zwracając się w lewo."
    verse: true
    chunks:
      - pl: "Potem rzekł do mnie: «Patrz, to duch Nemroda,"
        ru: "Потом сказал мне: «Смотри, это дух Нимрода,"
      - pl: "\nGłupi, sam siebie oskarża w swej dumie,"
        ru: "глупец сам себя обвиняет в своей гордыне,"
      - pl: "\nŻe przezeń znikła jedna mowa świata."
        ru: "что через него исчез единый язык мира."
        note: "Вавилонская башня"
      - pl: "\nZostawmy jego, tu słów naszych szkoda,"
        ru: "Оставим его, здесь жаль наших слов,"
      - pl: "\nMy go nie pojmiem, on nas nie zrozumie»."
        ru: "мы его не поймём, он нас не поймёт»."
        note: "pojmiem — устар. «поймём»"
      - pl: "\nI szliśmy kołem, zwracając się w lewo."
        ru: "И мы шли по кругу, поворачивая налево."
    words: { "oskarża": oskarzac, "dumie": duma, "mowa": mowa, "szkoda": szkoda, "kołem": kolo, "zwracając": zwracac }
  - clean: "Z dala sterczało jakieś wielkie drzewo,\nPodchodzim, widzim olbrzyma drugiego,\nJeszcze był dzikszy i wzrostu większego.\nJaki go siłacz łańcuchem skrępował,\nNie wiem, lecz obie miał związane ręce,\nŁańcuch od szyi pięć razy zagięty\nCiało mu ściskał żelaznymi pręty."
    verse: true
    chunks:
      - pl: "Z dala sterczało jakieś wielkie drzewo,"
        ru: "Вдали торчало какое-то большое дерево,"
      - pl: "\nPodchodzim, widzim olbrzyma drugiego,"
        ru: "подходим, видим второго великана,"
      - pl: "\nJeszcze był dzikszy i wzrostu większego."
        ru: "он был ещё более дикий и большего роста."
      - pl: "\nJaki go siłacz łańcuchem skrępował,"
        ru: "Какой силач сковал его цепью,"
        note: "skrępować — сковать"
      - pl: "\nNie wiem, lecz obie miał związane ręce,"
        ru: "не знаю, но обе руки у него были связаны,"
      - pl: "\nŁańcuch od szyi pięć razy zagięty"
        ru: "цепь, обёрнутая пять раз от шеи,"
        note: "zagięty — загнутый"
      - pl: "\nCiało mu ściskał żelaznymi pręty."
        ru: "сжимала ему тело железными прутьями."
        note: "pręt — прут"
    words: { "wielkie": wielki, "drzewo": drzewo, "łańcuchem": lancuch, "związane": zwiazac, "ręce": reka, "Ciało": cialo }
  - clean: "«Pyszny, z Jowiszem o władzę szermował,»\nTak mój wódz mówił, «a skończył na męce:\nTo Efialtes! w walce z olbrzymami\nPrzed nim zadrżeli i bogowie sami,\nMyśląc, że pierwszy drzwi niebios wyłamie;\nTeraz bezwładne to straszliwe ramie»."
    verse: true
    chunks:
