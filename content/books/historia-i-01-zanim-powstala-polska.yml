chapter: 1
chapterTitle: "Zanim powstała Polska"
chapterTitleRu: "Пока не было Польши"
level: B1
paragraphs:
  - clean: "Polska jako państwo ma nieco ponad tysiąc lat. Ale ludzie żyli na jej ziemiach dużo wcześniej. Zanim pojawili się tu Słowianie, przez te tereny przeszło wiele ludów. Jedne zostawiły po sobie tylko narzędzia i groby, inne — całe osady. O większości z nich nie wiemy nawet, jak się nazywały. Wiemy o nich tyle, ile powiedzą nam archeolodzy."
    draft: true
    chunks:
      - pl: "Polska jako państwo ma nieco ponad tysiąc lat."
        ru: "Польша как государство существует чуть больше тысячи лет."
        note: "nieco ponad — чуть больше"
      - pl: " Ale ludzie żyli na jej ziemiach dużo wcześniej."
        ru: "Но люди жили на её землях гораздо раньше."
      - pl: " Zanim pojawili się tu Słowianie, przez te tereny przeszło wiele ludów."
        ru: "Прежде чем здесь появились славяне, через эти края прошло много народов."
        note: "zanim — прежде чем; teren — местность, территория; lud — народ"
      - pl: " Jedne zostawiły po sobie tylko narzędzia i groby, inne — całe osady."
        ru: "Одни оставили после себя только орудия и могилы, другие — целые поселения."
        note: "osada — поселение"
      - pl: " O większości z nich nie wiemy nawet, jak się nazywały."
        ru: "О большинстве из них мы даже не знаем, как они назывались."
      - pl: " Wiemy o nich tyle, ile powiedzą nam archeolodzy."
        ru: "Мы знаем о них столько, сколько скажут нам археологи."
    words: { "państwo": panstwo, "nieco": nieco, "tereny": teren, "narzędzia": narzedzie, "groby": grob }
  - clean: "Pierwsi ludzie przyszli na ziemie dzisiejszej Polski setki tysięcy lat temu. Byli to myśliwi i zbieracze, którzy wędrowali za zwierzętami. Kilka razy nadchodził lodowiec i ludzie odchodzili na południe. Kiedy lód się cofał, wracali. Około siedmiu i pół tysiąca lat temu pojawili się tu pierwsi rolnicy. Przyszli z południa, znad Dunaju, i przynieśli ze sobą zboże, krowy i owce. Zaczęli budować domy i zostawać na długo w jednym miejscu."
    draft: true
    chunks:
      - pl: "Pierwsi ludzie przyszli na ziemie dzisiejszej Polski setki tysięcy lat temu."
        ru: "Первые люди пришли на земли нынешней Польши сотни тысяч лет назад."
      - pl: " Byli to myśliwi i zbieracze, którzy wędrowali za zwierzętami."
        ru: "Это были охотники и собиратели, которые кочевали вслед за животными."
        note: "wędrować za czymś — идти вслед за чем-л."
      - pl: " Kilka razy nadchodził lodowiec i ludzie odchodzili na południe."
        ru: "Несколько раз наступал ледник, и люди уходили на юг."
        note: "lodowiec — ледник"
      - pl: " Kiedy lód się cofał, wracali."
        ru: "Когда лёд отступал, они возвращались."
        note: "cofać się — отступать, пятиться"
      - pl: " Około siedmiu i pół tysiąca lat temu pojawili się tu pierwsi rolnicy."
        ru: "Около семи с половиной тысяч лет назад здесь появились первые земледельцы."
        note: "rolnik — земледелец, крестьянин"
      - pl: " Przyszli z południa, znad Dunaju, i przynieśli ze sobą zboże, krowy i owce."
        ru: "Они пришли с юга, с Дуная, и принесли с собой зерно, коров и овец."
        note: "znad Dunaju — с берегов Дуная: znad + родительный — «откуда»"
      - pl: " Zaczęli budować domy i zostawać na długo w jednym miejscu."
        ru: "Они начали строить дома и надолго оставаться на одном месте."
    words: { "myśliwi": mysliwy, "lodowiec": lodowiec, "cofał": cofac, "zboże": zboze, "owce": owca }
  - clean: "Jednym z najciekawszych śladów tamtych czasów są Krzemionki koło Ostrowca Świętokrzyskiego. Przez ponad dwa tysiące lat ludzie wydobywali tam krzemień. Krzemień był wtedy tym, czym jest dla nas stal: robiono z niego siekiery, noże i groty strzał. Górnicy kopali szyby głębokie nawet na dziewięć metrów i drążyli pod ziemią długie korytarze. Siekiery z tutejszego krzemienia pasiastego znajdowano nawet kilkaset kilometrów dalej. Dziś dawna kopalnia jest wpisana na listę światowego dziedzictwa UNESCO."
    draft: true
    chunks:
      - pl: "Jednym z najciekawszych śladów tamtych czasów są Krzemionki koło Ostrowca Świętokrzyskiego."
        ru: "Один из самых интересных следов тех времён — Кшемёнки под Островцом-Свентокшиским."
        note: "ślad — след; koło + родительный — возле"
      - pl: " Przez ponad dwa tysiące lat ludzie wydobywali tam krzemień."
        ru: "Больше двух тысяч лет люди добывали там кремень."
        note: "wydobywać — добывать; krzemień — кремень"
      - pl: " Krzemień był wtedy tym, czym jest dla nas stal: robiono z niego siekiery, noże i groty strzał."
        ru: "Кремень был тогда тем, чем для нас является сталь: из него делали топоры, ножи и наконечники стрел."
        note: "grot — наконечник; strzała — стрела"
      - pl: " Górnicy kopali szyby głębokie nawet na dziewięć metrów i drążyli pod ziemią długie korytarze."
        ru: "Горняки копали шахты глубиной до девяти метров и прорубали под землёй длинные ходы."
        note: "szyb — шахтный ствол; drążyć — долбить, прокладывать"
      - pl: " Siekiery z tutejszego krzemienia pasiastego znajdowano nawet kilkaset kilometrów dalej."
        ru: "Топоры из здешнего полосатого кремня находили даже за несколько сотен километров."
        note: "pasiasty — полосатый"
      - pl: " Dziś dawna kopalnia jest wpisana na listę światowego dziedzictwa UNESCO."
        ru: "Сегодня древний рудник внесён в список всемирного наследия ЮНЕСКО."
        note: "kopalnia — рудник, шахта; dziedzictwo — наследие"
    words: { "stal": stal, "kopali": kopac, "korytarze": korytarz, "tutejszego": tutejszy, "kopalnia": kopalnia, "dziedzictwa": dziedzictwo }
  - clean: "Potem przyszła epoka brązu, a z nią nowi ludzie i nowe zwyczaje. Archeolodzy nazywają ich kulturą łużycką. Nie wiemy, jakim językiem mówili ci ludzie ani jak sami siebie nazywali. Wiemy natomiast, że palili swoich zmarłych, a prochy składali w glinianych urnach. Takich cmentarzysk znaleziono w Polsce bardzo wiele."
    draft: true
    chunks:
      - pl: "Potem przyszła epoka brązu, a z nią nowi ludzie i nowe zwyczaje."
        ru: "Потом наступил бронзовый век, а с ним — новые люди и новые обычаи."
        note: "epoka brązu — бронзовый век"
      - pl: " Archeolodzy nazywają ich kulturą łużycką."
        ru: "Археологи называют их лужицкой культурой."
        note: "łużycki — от Łużyce «Лужица», где эту культуру впервые описали"
      - pl: " Nie wiemy, jakim językiem mówili ci ludzie ani jak sami siebie nazywali."
        ru: "Мы не знаем, на каком языке говорили эти люди и как они сами себя называли."
        note: "mówić jakim językiem — говорить на каком языке: творительный без предлога"
      - pl: " Wiemy natomiast, że palili swoich zmarłych, a prochy składali w glinianych urnach."
        ru: "Зато мы знаем, что они сжигали своих умерших, а прах складывали в глиняные урны."
        note: "natomiast — зато, а; prochy — прах"
      - pl: " Takich cmentarzysk znaleziono w Polsce bardzo wiele."
        ru: "Таких могильников в Польше нашли очень много."
        note: "cmentarzysko — древний могильник"
    words: { "zwyczaje": zwyczaj, "natomiast": natomiast, "prochy": proch }
  - clean: "Najsłynniejszą osadą kultury łużyckiej jest Biskupin. Jego historia zaczyna się od zwykłego wiejskiego nauczyciela. W 1933 roku Walenty Szwajcer wybrał się ze swoimi uczniami nad jezioro. Woda opadła wtedy bardzo nisko i z brzegu wystawały dziwne drewniane pale. Nauczyciel zrozumiał, że to coś bardzo starego, i powiadomił uczonych z Poznania. W następnym roku rozpoczęły się wykopaliska."
    draft: true
    chunks:
      - pl: "Najsłynniejszą osadą kultury łużyckiej jest Biskupin."
        ru: "Самое знаменитое поселение лужицкой культуры — Бискупин."
      - pl: " Jego historia zaczyna się od zwykłego wiejskiego nauczyciela."
        ru: "Его история начинается с обычного сельского учителя."
      - pl: " W 1933 roku Walenty Szwajcer wybrał się ze swoimi uczniami nad jezioro."
        ru: "В 1933 году Валенты Швайцер отправился со своими учениками к озеру."
        note: "w 1933 roku — w tysiąc dziewięćset trzydziestym trzecim roku; nad jezioro — к озеру: nad + винительный — «куда»"
      - pl: " Woda opadła wtedy bardzo nisko i z brzegu wystawały dziwne drewniane pale."
        ru: "Вода тогда сильно спала, и из берега торчали странные деревянные сваи."
        note: "opaść — спасть, опуститься; wystawać — торчать; pal — свая"
      - pl: " Nauczyciel zrozumiał, że to coś bardzo starego, i powiadomił uczonych z Poznania."
        ru: "Учитель понял, что это что-то очень старое, и сообщил учёным из Познани."
        note: "powiadomić — известить, сообщить"
      - pl: " W następnym roku rozpoczęły się wykopaliska."
        ru: "На следующий год начались раскопки."
        note: "wykopaliska — раскопки, только множественное число"
    words: { "brzegu": brzeg, "powiadomił": powiadomic, "wykopaliska": wykopaliska }
  - clean: "To, co odkryto, zaskoczyło cały świat naukowy. Na wyspie na jeziorze stała kiedyś drewniana osada, otoczona wałem i palisadą. Wał miał ponad czterysta pięćdziesiąt metrów długości. W środku stało około stu domów w równych rzędach, a między nimi biegło jedenaście ulic wyłożonych drewnem. Domy były do siebie podobne: każdy miał dwie izby i mieszkało w nim około dziesięciu osób. W całej osadzie mogło mieszkać nawet tysiąc ludzi."
    draft: true
    chunks:
      - pl: "To, co odkryto, zaskoczyło cały świat naukowy."
        ru: "То, что обнаружили, удивило весь научный мир."
        note: "zaskoczyć — удивить, застать врасплох"
      - pl: " Na wyspie na jeziorze stała kiedyś drewniana osada, otoczona wałem i palisadą."
        ru: "На острове посреди озера когда-то стояло деревянное поселение, окружённое валом и частоколом."
        note: "wał — вал; palisada — частокол"
      - pl: " Wał miał ponad czterysta pięćdziesiąt metrów długości."
        ru: "Вал был длиной больше четырёхсот пятидесяти метров."
        note: "mieć … metrów długości — быть длиной в … метров"
      - pl: " W środku stało około stu domów w równych rzędach, a między nimi biegło jedenaście ulic wyłożonych drewnem."
        ru: "Внутри стояло около ста домов ровными рядами, а между ними шли одиннадцать улиц, вымощенных деревом."
        note: "biec — здесь «тянуться» (об улице); wyłożony — выложенный"
      - pl: " Domy były do siebie podobne: każdy miał dwie izby i mieszkało w nim około dziesięciu osób."
        ru: "Дома были похожи друг на друга: в каждом было по две комнаты, и жило в нём человек десять."
        note: "izba — горница, комната"
      - pl: " W całej osadzie mogło mieszkać nawet tysiąc ludzi."
        ru: "Во всём поселении могло жить до тысячи человек."
    words: { "zaskoczyło": zaskoczyc, "wyspie": wyspa, "otoczona": otoczyc, "izby": izba }
  - clean: "Biskupin od razu nazwano „polskimi Pompejami”. Przez długi czas sądzono, że zbudowali go przodkowie Słowian. W latach trzydziestych miało to znaczenie także polityczne, bo niemieccy nacjonaliści twierdzili, że Słowianie nigdy nie stworzyli niczego wielkiego. Dziś wiemy, że osada jest dużo starsza. Drzewa na jej budowę ścięto około 738 roku przed naszą erą, mniej więcej wtedy, kiedy według legendy założono Rzym. Słowian nie było wtedy na tych ziemiach, a w każdym razie nic na to nie wskazuje. Z czasem poziom jeziora się podniósł i osada opustoszała. Dziś można ją zwiedzać: archeolodzy odbudowali część wału, bramę i kilka domów."
    draft: true
    chunks:
      - pl: "Biskupin od razu nazwano „polskimi Pompejami”."
        ru: "Бискупин сразу назвали «польскими Помпеями»."
      - pl: " Przez długi czas sądzono, że zbudowali go przodkowie Słowian."
        ru: "Долгое время считалось, что его построили предки славян."
        note: "sądzić — полагать, считать; przodek — предок"
      - pl: " W latach trzydziestych miało to znaczenie także polityczne, bo niemieccy nacjonaliści twierdzili, że Słowianie nigdy nie stworzyli niczego wielkiego."
        ru: "В тридцатые годы это имело и политическое значение: немецкие националисты утверждали, что славяне никогда не создали ничего великого."
        note: "twierdzić — утверждать"
      - pl: " Dziś wiemy, że osada jest dużo starsza."
        ru: "Сегодня мы знаем, что поселение гораздо старше."
      - pl: " Drzewa na jej budowę ścięto około 738 roku przed naszą erą, mniej więcej wtedy, kiedy według legendy założono Rzym."
        ru: "Деревья на её постройку срубили около 738 года до нашей эры — примерно тогда, когда, по преданию, был основан Рим."
        note: "przed naszą erą (p.n.e.) — до нашей эры; ściąć — срубить; Рим, по преданию, основан в 753 году до н. э."
      - pl: " Słowian nie było wtedy na tych ziemiach, a w każdym razie nic na to nie wskazuje."
        ru: "Славян тогда на этих землях не было — во всяком случае, ничто на это не указывает."
        note: "w każdym razie — во всяком случае; wskazywać na coś — указывать на что-л."
      - pl: " Z czasem poziom jeziora się podniósł i osada opustoszała."
        ru: "Со временем уровень озера поднялся, и поселение опустело."
        note: "opustoszeć — опустеть"
      - pl: " Dziś można ją zwiedzać: archeolodzy odbudowali część wału, bramę i kilka domów."
        ru: "Сегодня её можно посетить: археологи восстановили часть вала, ворота и несколько домов."
        note: "zwiedzać — осматривать (музей, город)"
    words: { "przodkowie": przodek, "twierdzili": twierdzic, "erą": era, "wskazuje": wskazywac, "poziom": poziom, "bramę": brama }
  - clean: "W następnych wiekach przez ziemie polskie przechodziły kolejne ludy. Na Śląsk i do Małopolski przybyli Celtowie. Byli świetnymi kowalami i to od nich tutejsi mieszkańcy nauczyli się używać koła garncarskiego. Później nad dolną Wisłą osiedlili się Goci, którzy według własnej tradycji przypłynęli ze Skandynawii. Po jakimś czasie ruszyli dalej na południowy wschód, aż nad Morze Czarne."
    draft: true
    chunks:
      - pl: "W następnych wiekach przez ziemie polskie przechodziły kolejne ludy."
        ru: "В следующие века через польские земли проходили всё новые народы."
        note: "kolejny — очередной, следующий"
      - pl: " Na Śląsk i do Małopolski przybyli Celtowie."
        ru: "В Силезию и Малую Польшу пришли кельты."
        note: "na Śląsk, но do Małopolski — у разных земель разные предлоги, это надо запоминать"
      - pl: " Byli świetnymi kowalami i to od nich tutejsi mieszkańcy nauczyli się używać koła garncarskiego."
        ru: "Они были превосходными кузнецами, и именно у них местные жители научились пользоваться гончарным кругом."
        note: "koło garncarskie — гончарный круг; uczyć się od kogoś — учиться у кого-л."
      - pl: " Później nad dolną Wisłą osiedlili się Goci, którzy według własnej tradycji przypłynęli ze Skandynawii."
        ru: "Позже на нижней Висле поселились готы, которые, по их собственному преданию, приплыли из Скандинавии."
        note: "osiedlić się — поселиться"
      - pl: " Po jakimś czasie ruszyli dalej na południowy wschód, aż nad Morze Czarne."
        ru: "Через какое-то время они двинулись дальше на юго-восток, вплоть до Чёрного моря."
        note: "ruszyć — тронуться, двинуться"
    words: { "garncarskiego": garncarski, "ruszyli": ruszyc }
  - clean: "Nad Bałtykiem od dawna zbierano bursztyn, czyli skamieniałą żywicę drzew sprzed milionów lat. Rzymianie bardzo go cenili. Kupcy wozili go z wybrzeża na południe, aż do Akwilei nad Adriatykiem. Tę drogę nazywamy dziś szlakiem bursztynowym. Rzymski pisarz Pliniusz Starszy opisał, jak za panowania Nerona pewien rzymski rycerz pojechał nad Bałtyk po bursztyn. Przywiózł go tak dużo, że ozdobiono nim nawet sieci i broń gladiatorów na igrzyskach. Na ziemiach polskich znaleziono tysiące rzymskich monet. W II wieku grecki uczony Ptolemeusz wymienił na swojej mapie miejscowość Kalisia. Wielu uważa, że chodzi o dzisiejszy Kalisz, i dlatego Kalisz nazywa się najstarszym miastem w Polsce. Uczeni nie są jednak tego pewni."
    draft: true
    chunks:
      - pl: "Nad Bałtykiem od dawna zbierano bursztyn, czyli skamieniałą żywicę drzew sprzed milionów lat."
        ru: "На Балтике издавна собирали янтарь — окаменевшую смолу деревьев, росших миллионы лет назад."
        note: "czyli — то есть; żywica — смола; sprzed + родительный — «существовавший до»"
      - pl: " Rzymianie bardzo go cenili."
        ru: "Римляне очень его ценили."
      - pl: " Kupcy wozili go z wybrzeża na południe, aż do Akwilei nad Adriatykiem."
        ru: "Купцы возили его с побережья на юг, вплоть до Аквилеи на Адриатике."
        note: "wybrzeże — побережье"
      - pl: " Tę drogę nazywamy dziś szlakiem bursztynowym."
        ru: "Этот путь мы сегодня называем Янтарным путём."
        note: "szlak — путь, маршрут"
      - pl: " Rzymski pisarz Pliniusz Starszy opisał, jak za panowania Nerona pewien rzymski rycerz pojechał nad Bałtyk po bursztyn."
        ru: "Римский писатель Плиний Старший описал, как в правление Нерона один римский всадник съездил на Балтику за янтарём."
        note: "za panowania — в правление; rycerz — здесь римский всадник (eques); pojechać po coś — поехать за чем-л."
