  - clean: "Wigilia jest świętem rodziny w najdosłowniejszym sensie. Na ten jeden wieczór do rodzinnych domów wracają studenci, którzy studiują w innych miastach, i emigranci, którzy pracują w Anglii, Niemczech czy Norwegii. Przed świętami dworce i lotniska są pełne ludzi z walizkami i torbami pełnymi prezentów. Od 2025 roku dzień Wigilii jest w Polsce ustawowo dniem wolnym od pracy, co dla wielu rodzin było tylko potwierdzeniem tego, jak obchodziły go od zawsze. Zwyczaje się zmieniają, przy stole siadają czasem goście z innych krajów i innych religii, a niektóre potrawy kupuje się już gotowe. Opłatek, pierwsza gwiazda i puste nakrycie pozostają jednak na swoim miejscu, a to wystarczy, żeby każdy Polak, gdziekolwiek jest, czuł, że jest w domu."
