  - clean: "Mikołaj w czerwonym płaszczu, z białą brodą i z reniferami, to postać stosunkowo nowa. Dawniej przedstawiano go jako biskupa z pastorałem i w mitrze, a w niektórych miejscowościach tak chodzi po domach do dziś. Kto przynosi prezenty w Wigilię, zależy od regionu. W Wielkopolsce i na Pomorzu robi to Gwiazdor, przebrany w kożuch, z twarzą ukrytą za maską albo brodą, który pyta dzieci, czy były grzeczne, i czasem zostawia rózgę. Na Śląsku prezenty przynosi Dzieciątko, czyli mały Jezus, w Małopolsce często Aniołek, a w pozostałych częściach kraju po prostu Mikołaj. Dzieci, które przeprowadzają się z jednego regionu do drugiego, bywają tym bardzo zdziwione."
    draft: true
    chunks:
      - pl: "Mikołaj w czerwonym płaszczu, z białą brodą i z reniferami, to postać stosunkowo nowa."
