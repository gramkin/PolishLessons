  - clean: "W tej książce opowiemy o tym, jak Polacy świętują, od pierwszych dni adwentu aż po jesienne Zaduszki. Druga część poświęcona jest temu, co dzieje się poza kalendarzem: chrzcinom, weselom i pogrzebom, imieninom, polskiemu stołowi i sztuce ludowej. Nie wszystkie opisane tu zwyczaje są dziś żywe. Niektóre przetrwały tylko w jednej wsi albo w muzeum, inne obchodzi cały kraj, a jeszcze inne pojawiły się niedawno i dopiero stają się tradycją. Tam, gdzie zwyczaj różni się w zależności od regionu, będziemy o tym mówić, bo Polska, choć dziś jednolita językowo, przez wieki była krajem bardzo różnorodnym."
    draft: true
    chunks:
      - pl: "W tej książce opowiemy o tym, jak Polacy świętują, od pierwszych dni adwentu aż po jesienne Zaduszki."
        ru: "В этой книге мы расскажем о том, как поляки празднуют, от первых дней Адвента до осенних Задушек."
      - pl: " Druga część poświęcona jest temu, co dzieje się poza kalendarzem: chrzcinom, weselom i pogrzebom, imieninom, polskiemu stołowi i sztuce ludowej."
        ru: "Вторая часть посвящена тому, что происходит вне календаря: крестинам, свадьбам и похоронам, именинам, польскому столу и народному искусству."
      - pl: " Nie wszystkie opisane tu zwyczaje są dziś żywe."
        ru: "Не все описанные здесь обычаи сегодня живы."
      - pl: " Niektóre przetrwały tylko w jednej wsi albo w muzeum, inne obchodzi cały kraj, a jeszcze inne pojawiły się niedawno i dopiero stają się tradycją."
        ru: "Некоторые сохранились только в одной деревне или в музее, другие отмечает вся страна, а третьи появились недавно и только становятся традицией."
      - pl: " Tam, gdzie zwyczaj różni się w zależności od regionu, będziemy o tym mówić, bo Polska, choć dziś jednolita językowo, przez wieki była krajem bardzo różnorodnym."
        ru: "Там, где обычай различается в зависимости от региона, мы будем об этом говорить, потому что Польша, хотя сегодня и единообразна по языку, веками была очень разнообразной страной."
        note: "jednolity — однородный, единый"
