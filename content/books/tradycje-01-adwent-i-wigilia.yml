  - clean: "Zaczynamy od zimy, bo właśnie zimą przypada najważniejsze dla większości Polaków święto rodzinne. Nie jest nim, jak mogłoby się wydawać, sam dzień Bożego Narodzenia, ale wieczór przed nim, czyli Wigilia. Zanim jednak rodzina zasiądzie do wigilijnego stołu, mijają cztery tygodnie oczekiwania."
    draft: true
    chunks:
      - pl: "Zaczynamy od zimy, bo właśnie zimą przypada najważniejsze dla większości Polaków święto rodzinne."
        ru: "Начинаем с зимы, потому что именно на зиму приходится самый важный для большинства поляков семейный праздник."
      - pl: " Nie jest nim, jak mogłoby się wydawać, sam dzień Bożego Narodzenia, ale wieczór przed nim, czyli Wigilia."
        ru: "Это не сам день Рождества, как могло бы показаться, а вечер накануне, то есть Сочельник."
        note: "Wigilia — Сочельник"
      - pl: " Zanim jednak rodzina zasiądzie do wigilijnego stołu, mijają cztery tygodnie oczekiwania."
        ru: "Но прежде чем семья сядет за сочельниковый стол, проходят четыре недели ожидания."
    words: { "zimy": zima, "zimą": zima, "większości": wiekszosc, "święto": swieto, "rodzinne": rodzinny, "czyli": czyli, "stołu": stol, "mijają": mijac, "cztery": cztery }
  - clean: "Adwent, od łacińskiego słowa adventus, czyli przyjście, to czas przygotowania do świąt. Zaczyna się w czwartą niedzielę przed Bożym Narodzeniem, zwykle pod koniec listopada albo na początku grudnia, i rozpoczyna nowy rok liturgiczny w Kościele katolickim. Dawniej był to czas postu i ciszy. Nie urządzano wesel ani zabaw, a w wielu wsiach milkły nawet skrzypce i harmonie. Dziś mało kto pości przez cały adwent, ale wiele parafii wciąż prosi, żeby w tym czasie nie organizować hucznych imprez."
    draft: true
    chunks:
      - pl: "Adwent, od łacińskiego słowa adventus, czyli przyjście, to czas przygotowania do świąt."
        ru: "Адвент, от латинского слова adventus, то есть «пришествие», — время подготовки к празднику."
      - pl: " Zaczyna się w czwartą niedzielę przed Bożym Narodzeniem, zwykle pod koniec listopada albo na początku grudnia, i rozpoczyna nowy rok liturgiczny w Kościele katolickim."
        ru: "Он начинается в четвёртое воскресенье перед Рождеством, обычно в конце ноября или в начале декабря, и открывает новый литургический год в католической церкви."
      - pl: " Dawniej był to czas postu i ciszy."
        ru: "Раньше это было время поста и тишины."
      - pl: " Nie urządzano wesel ani zabaw, a w wielu wsiach milkły nawet skrzypce i harmonie."
        ru: "Не устраивали свадеб и гулянок, а во многих деревнях умолкали даже скрипки и гармони."
        note: "milknąć — умолкать"
      - pl: " Dziś mało kto pości przez cały adwent, ale wiele parafii wciąż prosi, żeby w tym czasie nie organizować hucznych imprez."
        ru: "Сегодня мало кто постится весь Адвент, но многие приходы по-прежнему просят в это время не устраивать шумных вечеринок."
        note: "huczny — шумный, пышный"
    words: { "czwartą": czwarty, "niedzielę": niedziela, "zwykle": zwykle, "listopada": listopad, "początku": poczatek, "grudnia": grudzien, "rozpoczyna": rozpoczynac, "ciszy": cisza, "wesel": wesele, "wsiach": wies, "mało": malo, "organizować": organizowac, "imprez": impreza }
  - clean: "Najbardziej charakterystycznym zwyczajem adwentu są roraty. Tak nazywa się msza ku czci Matki Bożej, odprawiana bardzo wcześnie rano, jeszcze przed świtem, albo wieczorem. Nazwa pochodzi od pierwszych słów łacińskiej pieśni Rorate caeli, czyli Spuśćcie rosę, niebiosa. Msza zaczyna się w ciemnym kościele, a wierni przychodzą z zapalonymi lampionami. Światło stopniowo wypełnia wnętrze, co ma przypominać, że ludzie czekają na przyjście Chrystusa jak na wschód słońca. Na ołtarzu stoi wtedy specjalna świeca, zwana roratką, przewiązana białą albo niebieską wstążką."
    draft: true
    chunks:
      - pl: "Najbardziej charakterystycznym zwyczajem adwentu są roraty."
        ru: "Самым характерным обычаем Адвента являются рораты."
      - pl: " Tak nazywa się msza ku czci Matki Bożej, odprawiana bardzo wcześnie rano, jeszcze przed świtem, albo wieczorem."
        ru: "Так называется месса в честь Богоматери, которую служат очень рано утром, ещё до рассвета, или вечером."
        note: "odprawiać mszę — служить мессу"
      - pl: " Nazwa pochodzi od pierwszych słów łacińskiej pieśni Rorate caeli, czyli Spuśćcie rosę, niebiosa."
        ru: "Название происходит от первых слов латинского песнопения Rorate caeli, то есть «Кропите, небеса»."
      - pl: " Msza zaczyna się w ciemnym kościele, a wierni przychodzą z zapalonymi lampionami."
        ru: "Месса начинается в тёмном костёле, а верующие приходят с зажжёнными фонариками."
        note: "lampion — фонарик"
      - pl: " Światło stopniowo wypełnia wnętrze, co ma przypominać, że ludzie czekają na przyjście Chrystusa jak na wschód słońca."
        ru: "Свет постепенно заполняет помещение, что должно напоминать: люди ждут пришествия Христа, как восхода солнца."
      - pl: " Na ołtarzu stoi wtedy specjalna świeca, zwana roratką, przewiązana białą albo niebieską wstążką."
        ru: "На алтаре в это время стоит особая свеча, называемая роратка, перевязанная белой или голубой лентой."
        note: "wstążka — лента"
    words: { "zwyczajem": zwyczaj, "świtem": swit, "pochodzi": pochodzic, "pieśni": piesn, "rosę": rosa, "niebiosa": niebiosa, "ciemnym": ciemny, "kościele": kosciol, "wierni": wierny, "przychodzą": przychodzic, "zapalonymi": zapalic, "wnętrze": wnetrze, "przypominać": przypominac, "wschód": wschod, "ołtarzu": oltarz, "specjalna": specjalny, "świeca": swieca, "zwana": zwac, "białą": bialy, "niebieską": niebieski }
  - clean: "Na roraty chętnie chodzą dzieci. Dawniej robiły lampiony same, z papieru i drewnianych listewek, dziś częściej kupują je w sklepie, z kolorowymi szybkami i elektryczną świeczką. Wiele parafii prowadzi wtedy konkursy na najładniejszy lampion, a dzieci, które przychodzą codziennie, dostają obrazki albo naklejki, z których na koniec adwentu powstaje cały album. Dla wielu dorosłych wspomnienie zimnego poranka, ciemnej ulicy i ciepłego, oświetlonego kościoła jest jednym z najmocniejszych obrazów dzieciństwa."
    draft: true
    chunks:
      - pl: "Na roraty chętnie chodzą dzieci."
        ru: "На рораты охотно ходят дети."
      - pl: " Dawniej robiły lampiony same, z papieru i drewnianych listewek, dziś częściej kupują je w sklepie, z kolorowymi szybkami i elektryczną świeczką."
        ru: "Раньше они делали фонарики сами, из бумаги и деревянных реек, сегодня чаще покупают их в магазине, с цветными стёклышками и электрической свечкой."
      - pl: " Wiele parafii prowadzi wtedy konkursy na najładniejszy lampion, a dzieci, które przychodzą codziennie, dostają obrazki albo naklejki, z których na koniec adwentu powstaje cały album."
        ru: "Многие приходы проводят тогда конкурсы на самый красивый фонарик, а дети, приходящие каждый день, получают картинки или наклейки, из которых к концу Адвента складывается целый альбом."
        note: "naklejka — наклейка"
      - pl: " Dla wielu dorosłych wspomnienie zimnego poranka, ciemnej ulicy i ciepłego, oświetlonego kościoła jest jednym z najmocniejszych obrazów dzieciństwa."
        ru: "Для многих взрослых воспоминание о холодном утре, тёмной улице и тёплом, освещённом костёле — один из самых сильных образов детства."
    words: { "chętnie": chetnie, "papieru": papier, "częściej": czesto, "kupują": kupowac, "sklepie": sklep, "szybkami": szybka, "elektryczną": elektryczny, "konkursy": konkurs, "najładniejszy": ladny, "codziennie": codziennie, "dostają": dostawac, "obrazki": obrazek, "album": album, "dorosłych": dorosly, "zimnego": zimny, "poranka": poranek, "ciemnej": ciemny, "ulicy": ulica, "ciepłego": cieply, "kościoła": kosciol, "najmocniejszych": mocny, "obrazów": obraz, "dzieciństwa": dziecinstwo }
  - clean: "W domach pojawia się wieniec adwentowy z czterema świecami, z których w każdą kolejną niedzielę zapala się o jedną więcej. Ten zwyczaj przyszedł do Polski z Niemiec, podobnie jak kalendarz adwentowy z okienkami, za którymi czekają czekoladki. Jeszcze kilkadziesiąt lat temu oba były rzadkością, a dziś trudno sobie bez nich wyobrazić grudzień w miejskim mieszkaniu."
    draft: true
    chunks:
      - pl: "W domach pojawia się wieniec adwentowy z czterema świecami, z których w każdą kolejną niedzielę zapala się o jedną więcej."
        ru: "В домах появляется адвентский венок с четырьмя свечами, из которых в каждое следующее воскресенье зажигают на одну больше."
        note: "wieniec — венок"
      - pl: " Ten zwyczaj przyszedł do Polski z Niemiec, podobnie jak kalendarz adwentowy z okienkami, za którymi czekają czekoladki."
        ru: "Этот обычай пришёл в Польшу из Германии, как и адвент-календарь с окошками, за которыми ждут шоколадки."
      - pl: " Jeszcze kilkadziesiąt lat temu oba były rzadkością, a dziś trudno sobie bez nich wyobrazić grudzień w miejskim mieszkaniu."
        ru: "Ещё несколько десятилетий назад и то и другое было редкостью, а сегодня без них трудно представить себе декабрь в городской квартире."
    words: { "pojawia": pojawiac, "czterema": cztery, "świecami": swieca, "podobnie": podobnie, "trudno": trudno, "wyobrazić": wyobrazic, "grudzień": grudzien, "miejskim": miejski }
  - clean: "Szóstego grudnia dzieci budzą się wcześniej niż zwykle. To dzień świętego Mikołaja, czyli mikołajki, kiedy pod poduszką albo w bucie postawionym przy drzwiach czeka na nie mały prezent. Święty Mikołaj był biskupem w Mirze, w dzisiejszej Turcji, i według legendy potajemnie pomagał biednym. Najbardziej znana opowieść mówi, że wrzucił przez okno sakiewki ze złotem trzem ubogim pannom, żeby mogły wyjść za mąż. W szkołach i w pracy ludzie losują wtedy imiona i kupują sobie nawzajem drobne upominki."
    draft: true
    chunks:
      - pl: "Szóstego grudnia dzieci budzą się wcześniej niż zwykle."
        ru: "Шестого декабря дети просыпаются раньше обычного."
      - pl: " To dzień świętego Mikołaja, czyli mikołajki, kiedy pod poduszką albo w bucie postawionym przy drzwiach czeka na nie mały prezent."
        ru: "Это день святого Николая, то есть миколайки, когда под подушкой или в ботинке, поставленном у двери, их ждёт маленький подарок."
      - pl: " Święty Mikołaj był biskupem w Mirze, w dzisiejszej Turcji, i według legendy potajemnie pomagał biednym."
        ru: "Святой Николай был епископом в Мирах, на территории нынешней Турции, и, согласно легенде, тайно помогал бедным."
        note: "potajemnie — тайком"
      - pl: " Najbardziej znana opowieść mówi, że wrzucił przez okno sakiewki ze złotem trzem ubogim pannom, żeby mogły wyjść za mąż."
        ru: "Самая известная история гласит, что он бросил в окно мешочки с золотом трём бедным девушкам, чтобы они смогли выйти замуж."
        note: "sakiewka — кошелёк, мешочек"
      - pl: " W szkołach i w pracy ludzie losują wtedy imiona i kupują sobie nawzajem drobne upominki."
        ru: "В школах и на работе люди тянут тогда жребий с именами и покупают друг другу небольшие подарки."
        note: "losować — тянуть жребий; upominek — подарок"
