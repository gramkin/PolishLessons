chapter: 1
chapterTitle: "Adwent i Wigilia"
chapterTitleRu: "Адвент и Сочельник"
level: B2
paragraphs:
  - clean: "Polski rok ma dwa rytmy. Jeden wyznacza kalendarz pracy i szkoły, drugi kalendarz świąt, który od ponad tysiąca lat porządkuje życie rodzin, wsi i miast. Większość polskich świąt ma korzenie chrześcijańskie, ale pod wieloma z nich kryją się dużo starsze zwyczaje, związane z przesileniem słońca, z siewem i ze żniwami. Kościół nie zawsze walczył z dawnymi obrzędami. Często nadawał im nowe znaczenie, a ludzie dalej robili to, co robili ich dziadkowie, choć tłumaczyli to sobie inaczej."
    draft: true
    chunks:
      - pl: "Polski rok ma dwa rytmy."
        ru: "У польского года два ритма."
      - pl: " Jeden wyznacza kalendarz pracy i szkoły, drugi kalendarz świąt, który od ponad tysiąca lat porządkuje życie rodzin, wsi i miast."
        ru: "Один задаёт календарь работы и школы, другой — календарь праздников, который уже больше тысячи лет упорядочивает жизнь семей, деревень и городов."
        note: "wyznaczać — задавать, определять"
      - pl: " Większość polskich świąt ma korzenie chrześcijańskie, ale pod wieloma z nich kryją się dużo starsze zwyczaje, związane z przesileniem słońca, z siewem i ze żniwami."
        ru: "Большинство польских праздников имеет христианские корни, но под многими из них скрываются гораздо более древние обычаи, связанные с солнцестоянием, севом и жатвой."
        note: "przesilenie — солнцестояние"
      - pl: " Kościół nie zawsze walczył z dawnymi obrzędami."
        ru: "Церковь не всегда боролась со старыми обрядами."
      - pl: " Często nadawał im nowe znaczenie, a ludzie dalej robili to, co robili ich dziadkowie, choć tłumaczyli to sobie inaczej."
        ru: "Часто она придавала им новый смысл, а люди продолжали делать то, что делали их деды, хотя объясняли себе это иначе."
        note: "obrzęd — обряд"
