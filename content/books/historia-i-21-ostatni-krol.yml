  - clean: "Oburzenie szlachty było ogromne. W lutym 1768 roku w miasteczku Bar na Podolu grupa szlachty zawiązała konfederację w obronie wiary i wolności. Konfederaci barscy walczyli przeciwko Rosji i przeciwko królowi, którego uważali za jej sługę. Byli odważni, ale źle zorganizowani i podzieleni. Najsłynniejszym z ich wodzów był młody Kazimierz Pułaski, który przez wiele miesięcy bronił Jasnej Góry przed Rosjanami. Później walczył w wojnie o niepodległość Stanów Zjednoczonych i zginął w 1779 roku pod Savannah, a Amerykanie uważają go za ojca swojej kawalerii."
    draft: true
    chunks:
      - pl: "Oburzenie szlachty było ogromne."
        ru: "Возмущение шляхты было огромным."
      - pl: " W lutym 1768 roku w miasteczku Bar na Podolu grupa szlachty zawiązała konfederację w obronie wiary i wolności."
        ru: "В феврале 1768 года в местечке Бар в Подолии группа шляхты создала конфедерацию в защиту веры и вольности."
      - pl: " Konfederaci barscy walczyli przeciwko Rosji i przeciwko królowi, którego uważali za jej sługę."
        ru: "Барские конфедераты воевали против России и против короля, которого считали её слугой."
      - pl: " Byli odważni, ale źle zorganizowani i podzieleni."
        ru: "Они были отважны, но плохо организованы и разобщены."
      - pl: " Najsłynniejszym z ich wodzów był młody Kazimierz Pułaski, który przez wiele miesięcy bronił Jasnej Góry przed Rosjanami."
        ru: "Самым знаменитым из их вождей был молодой Казимир Пулавский, который много месяцев оборонял Ясную Гору от русских."
      - pl: " Później walczył w wojnie o niepodległość Stanów Zjednoczonych i zginął w 1779 roku pod Savannah, a Amerykanie uważają go za ojca swojej kawalerii."
        ru: "Позже он воевал в Войне за независимость США и погиб в 1779 году под Саванной, а американцы считают его отцом своей кавалерии."
    words: { "lutym": luty, "miasteczku": miasteczko, "sługę": sluga, "odważni": odwazny, "zorganizowani": zorganizowac, "podzieleni": podzielic, "Najsłynniejszym": slynny, "wodzów": wodz }
  - clean: "Wojna konfederacji barskiej trwała cztery lata i pustoszyła kraj. W 1768 roku na Ukrainie wybuchło powstanie hajdamaków, czyli zbuntowanych Kozaków i chłopów, nazywane koliszczyzną. Powstańcy, głosząc obronę prawosławia, mordowali szlachtę, Żydów i unitów. W Humaniu wymordowano kilka tysięcy ludzi, którzy schronili się w mieście. Powstanie stłumiły wspólnie wojska polskie i rosyjskie, a wielu jego uczestników stracono w okrutny sposób. W 1771 roku grupa konfederatów porwała nawet króla na ulicy w Warszawie, ale Stanisław August zdołał przekonać jednego z porywaczy, żeby go uwolnił. Tysiące wziętych do niewoli konfederatów wywieziono na Syberię, co było zapowiedzią losu wielu pokoleń polskich patriotów."
    draft: true
    chunks:
      - pl: "Wojna konfederacji barskiej trwała cztery lata i pustoszyła kraj."
        ru: "Война Барской конфедерации длилась четыре года и опустошала страну."
      - pl: " W 1768 roku na Ukrainie wybuchło powstanie hajdamaków, czyli zbuntowanych Kozaków i chłopów, nazywane koliszczyzną."
        ru: "В 1768 году на Украине вспыхнуло восстание гайдамаков, то есть восставших казаков и крестьян, называемое Колиивщиной."
        note: "hajdamak — гайдамак"
      - pl: " Powstańcy, głosząc obronę prawosławia, mordowali szlachtę, Żydów i unitów."
        ru: "Повстанцы, провозглашая защиту православия, убивали шляхту, евреев и униатов."
      - pl: " W Humaniu wymordowano kilka tysięcy ludzi, którzy schronili się w mieście."
        ru: "В Умани были перебиты несколько тысяч людей, укрывшихся в городе."
      - pl: " Powstanie stłumiły wspólnie wojska polskie i rosyjskie, a wielu jego uczestników stracono w okrutny sposób."
        ru: "Восстание подавили совместно польские и русские войска, а многих его участников жестоко казнили."
        note: "stracić — здесь «казнить»"
      - pl: " W 1771 roku grupa konfederatów porwała nawet króla na ulicy w Warszawie, ale Stanisław August zdołał przekonać jednego z porywaczy, żeby go uwolnił."
        ru: "В 1771 году группа конфедератов даже похитила короля на улице в Варшаве, но Станиславу Августу удалось уговорить одного из похитителей его отпустить."
        note: "porwać — похитить; porywacz — похититель"
      - pl: " Tysiące wziętych do niewoli konfederatów wywieziono na Syberię, co było zapowiedzią losu wielu pokoleń polskich patriotów."
