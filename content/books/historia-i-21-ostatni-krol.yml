paragraphs:
  - clean: "Stanisław August Poniatowski urodził się w 1732 roku w rodzinie, która dopiero niedawno awansowała do grona magnatów. Jego ojciec był zaufanym człowiekiem Karola XII, a matka pochodziła z potężnego rodu Czartoryskich. Młody Stanisław otrzymał staranne wykształcenie, podróżował po Europie, mówił kilkoma językami i przyjaźnił się z filozofami oświecenia. Jako sekretarz posła angielskiego przebywał w Petersburgu, gdzie nawiązał romans z wielką księżną Katarzyną, późniejszą carycą Katarzyną II. Ta znajomość miała zdecydować o jego losie i o losie całego kraju."
    draft: true
    chunks:
      - pl: "Stanisław August Poniatowski urodził się w 1732 roku w rodzinie, która dopiero niedawno awansowała do grona magnatów."
        ru: "Станислав Август Понятовский родился в 1732 году в семье, которая лишь недавно вошла в круг магнатов."
        note: "grono — круг"
      - pl: " Jego ojciec był zaufanym człowiekiem Karola XII, a matka pochodziła z potężnego rodu Czartoryskich."
        ru: "Его отец был доверенным человеком Карла XII, а мать происходила из могущественного рода Чарторыйских."
      - pl: " Młody Stanisław otrzymał staranne wykształcenie, podróżował po Europie, mówił kilkoma językami i przyjaźnił się z filozofami oświecenia."
        ru: "Юный Станислав получил тщательное образование, путешествовал по Европе, говорил на нескольких языках и дружил с философами Просвещения."
      - pl: " Jako sekretarz posła angielskiego przebywał w Petersburgu, gdzie nawiązał romans z wielką księżną Katarzyną, późniejszą carycą Katarzyną II."
        ru: "Как секретарь английского посла он жил в Петербурге, где завязал роман с великой княгиней Екатериной, впоследствии императрицей Екатериной II."
        note: "nawiązać romans — завязать роман"
      - pl: " Ta znajomość miała zdecydować o jego losie i o losie całego kraju."
        ru: "Это знакомство решило его судьбу и судьбу всей страны."
    words: { "niedawno": niedawno, "grona": grono, "potężnego": potezny, "rodu": rod-2, "podróżował": podrozowac, "przyjaźnił": przyjaznic, "sekretarz": sekretarz, "przebywał": przebywac, "nawiązał": nawiazac, "romans": romans, "późniejszą": pozny, "znajomość": znajomosc }
  - clean: "Po śmierci Augusta III caryca postanowiła osadzić na tronie polskim swojego dawnego kochanka. Uważała, że będzie posłuszny i wdzięczny, a przez niego Rosja będzie rządzić Rzecząpospolitą. W 1764 roku, w obecności wojsk rosyjskich, kilka tysięcy szlachciców wybrało Poniatowskiego jednogłośnie na króla. Został koronowany w Warszawie, jako pierwszy król w historii, i przyjął imiona Stanisław August. Miał trzydzieści dwa lata i wielkie plany."
    draft: true
    chunks:
      - pl: "Po śmierci Augusta III caryca postanowiła osadzić na tronie polskim swojego dawnego kochanka."
        ru: "После смерти Августа III императрица решила посадить на польский престол своего бывшего возлюбленного."
        note: "kochanek — возлюбленный"
      - pl: " Uważała, że będzie posłuszny i wdzięczny, a przez niego Rosja będzie rządzić Rzecząpospolitą."
        ru: "Она считала, что он будет послушен и благодарен и через него Россия будет управлять Речью Посполитой."
        note: "wdzięczny — благодарный"
      - pl: " W 1764 roku, w obecności wojsk rosyjskich, kilka tysięcy szlachciców wybrało Poniatowskiego jednogłośnie na króla."
        ru: "В 1764 году в присутствии русских войск несколько тысяч шляхтичей единогласно избрали Понятовского королём."
        note: "jednogłośnie — единогласно"
      - pl: " Został koronowany w Warszawie, jako pierwszy król w historii, i przyjął imiona Stanisław August."
        ru: "Он был коронован в Варшаве — первым из королей в истории — и принял имена Станислав Август."
      - pl: " Miał trzydzieści dwa lata i wielkie plany."
        ru: "Ему было тридцать два года, и у него были большие планы."
    words: { "tronie": tron, "polskim": polski, "rządzić": rzadzic, "obecności": obecnosc, "wojsk": wojsko, "rosyjskich": rosyjski, "trzydzieści": trzydziesci }
  - clean: "Stanisław August nie był posłusznym narzędziem, jakiego spodziewała się Katarzyna. Był inteligentny, pracowity i szczerze chciał zreformować państwo. Razem z wujami Czartoryskimi przeprowadził pierwsze zmiany: założył mennicę, wprowadził nowe cła, ograniczył władzę hetmanów i podskarbich. W 1765 roku otworzył w Warszawie Szkołę Rycerską, która kształciła oficerów w duchu oświecenia i patriotyzmu. Jednym z jej pierwszych uczniów był młody Tadeusz Kościuszko. W tym samym roku powstał pierwszy publiczny teatr w Warszawie i czasopismo „Monitor”, które krytykowało sarmackie przesądy."
    draft: true
    chunks:
      - pl: "Stanisław August nie był posłusznym narzędziem, jakiego spodziewała się Katarzyna."
        ru: "Станислав Август не стал послушным орудием, какого ожидала Екатерина."
      - pl: " Był inteligentny, pracowity i szczerze chciał zreformować państwo."
        ru: "Он был умён, трудолюбив и искренне хотел реформировать государство."
        note: "szczerze — искренне"
      - pl: " Razem z wujami Czartoryskimi przeprowadził pierwsze zmiany: założył mennicę, wprowadził nowe cła, ograniczył władzę hetmanów i podskarbich."
        ru: "Вместе с дядьями Чарторыйскими он провёл первые изменения: основал монетный двор, ввёл новые пошлины, ограничил власть гетманов и подскарбиев."
        note: "mennica — монетный двор"
      - pl: " W 1765 roku otworzył w Warszawie Szkołę Rycerską, która kształciła oficerów w duchu oświecenia i patriotyzmu."
        ru: "В 1765 году он открыл в Варшаве Рыцарскую школу, которая готовила офицеров в духе Просвещения и патриотизма."
      - pl: " Jednym z jej pierwszych uczniów był młody Tadeusz Kościuszko."
        ru: "Одним из её первых учеников был юный Тадеуш Костюшко."
      - pl: " W tym samym roku powstał pierwszy publiczny teatr w Warszawie i czasopismo „Monitor”, które krytykowało sarmackie przesądy."
        ru: "В том же году появились первый публичный театр в Варшаве и журнал «Монитор», критиковавший сарматские предрассудки."
        note: "czasopismo — журнал; przesąd — предрассудок"
    words: { "narzędziem": narzedzie, "inteligentny": inteligentny, "wujami": wuj, "ograniczył": ograniczyc, "kształciła": ksztalcic, "uczniów": uczen, "powstał": powstac, "publiczny": publiczny, "teatr": teatr }
  - clean: "Król miał jednak przeciwko sobie zarówno Rosję i Prusy, jak i dużą część szlachty. Katarzyna i król pruski Fryderyk II nie chcieli silnej Polski. Zawarli tajne porozumienie, że będą razem bronić liberum veto i wolnej elekcji, czyli tego, co czyniło Rzeczpospolitą słabą. Szlachta konserwatywna uważała natomiast króla za parweniusza i rosyjskiego agenta, który chce zniszczyć złotą wolność. Stanisław August był więc królem bez prawdziwych sojuszników."
    draft: true
    chunks:
      - pl: "Król miał jednak przeciwko sobie zarówno Rosję i Prusy, jak i dużą część szlachty."
        ru: "Однако против короля были как Россия и Пруссия, так и бо́льшая часть шляхты."
      - pl: " Katarzyna i król pruski Fryderyk II nie chcieli silnej Polski."
        ru: "Екатерина и прусский король Фридрих II не хотели сильной Польши."
      - pl: " Zawarli tajne porozumienie, że będą razem bronić liberum veto i wolnej elekcji, czyli tego, co czyniło Rzeczpospolitą słabą."
        ru: "Они заключили тайное соглашение, что будут вместе защищать liberum veto и вольную элекцию, то есть то, что делало Речь Посполитую слабой."
      - pl: " Szlachta konserwatywna uważała natomiast króla za parweniusza i rosyjskiego agenta, który chce zniszczyć złotą wolność."
        ru: "Консервативная шляхта, напротив, считала короля выскочкой и русским агентом, который хочет уничтожить золотую вольность."
        note: "parweniusz — выскочка"
      - pl: " Stanisław August był więc królem bez prawdziwych sojuszników."
        ru: "Таким образом, Станислав Август был королём без настоящих союзников."
    words: { "zarówno": zarowno, "Zawarli": zawrzec, "natomiast": natomiast, "rosyjskiego": rosyjski, "sojuszników": sojusznik }
  - clean: "Pretekstem do mieszania się w sprawy polskie stała się kwestia dysydentów, czyli innowierców. Rosja i Prusy zażądały, żeby prawosławni i protestanci mieli takie same prawa polityczne jak katolicy. Sama w sobie była to sprawa słuszna, bo innowiercy od dawna byli w Rzeczypospolitej dyskryminowani. Dla Katarzyny chodziło jednak przede wszystkim o to, żeby mieć w Polsce swoje stronnictwo i pretekst do interwencji. Katolicka szlachta odebrała to żądanie jako atak na wiarę i niepodległość."
    draft: true
    chunks:
      - pl: "Pretekstem do mieszania się w sprawy polskie stała się kwestia dysydentów, czyli innowierców."
        ru: "Предлогом для вмешательства в польские дела стал диссидентский вопрос, то есть вопрос об иноверцах."
        note: "dysydent — диссидент, иноверец"
      - pl: " Rosja i Prusy zażądały, żeby prawosławni i protestanci mieli takie same prawa polityczne jak katolicy."
        ru: "Россия и Пруссия потребовали, чтобы православные и протестанты имели такие же политические права, как католики."
      - pl: " Sama w sobie była to sprawa słuszna, bo innowiercy od dawna byli w Rzeczypospolitej dyskryminowani."
        ru: "Само по себе это было справедливо, потому что иноверцы давно подвергались в Речи Посполитой дискриминации."
        note: "słuszny — справедливый; dyskryminować — дискриминировать"
      - pl: " Dla Katarzyny chodziło jednak przede wszystkim o to, żeby mieć w Polsce swoje stronnictwo i pretekst do interwencji."
        ru: "Но Екатерине важно было прежде всего иметь в Польше свою партию и предлог для вмешательства."
      - pl: " Katolicka szlachta odebrała to żądanie jako atak na wiarę i niepodległość."
        ru: "Католическая шляхта восприняла это требование как нападение на веру и независимость."
    words: { "polskie": polski, "polityczne": polityczny, "słuszna": sluszny }
  - clean: "Ambasador rosyjski, książę Nikołaj Repnin, zachowywał się w Warszawie jak namiestnik. Kiedy na sejmie w 1767 roku kilku senatorów, wśród nich biskupi krakowski i kijowski, ostro sprzeciwiło się żądaniom rosyjskim, Repnin kazał ich aresztować w nocy i wywieźć do Kaługi w głębi Rosji. Przestraszony sejm uchwalił wszystko, czego chciała Rosja. Dysydenci otrzymali równe prawa, ale jednocześnie uchwalono tak zwane prawa kardynalne, czyli niezmienne, wśród nich liberum veto i wolną elekcję. Ich gwarantką została caryca. Od tej chwili każda zmiana ustroju wymagała zgody Rosji."
    draft: true
    chunks:
      - pl: "Ambasador rosyjski, książę Nikołaj Repnin, zachowywał się w Warszawie jak namiestnik."
        ru: "Русский посол, князь Николай Репнин, вёл себя в Варшаве как наместник."
      - pl: " Kiedy na sejmie w 1767 roku kilku senatorów, wśród nich biskupi krakowski i kijowski, ostro sprzeciwiło się żądaniom rosyjskim, Repnin kazał ich aresztować w nocy i wywieźć do Kaługi w głębi Rosji."
        ru: "Когда на сейме 1767 года несколько сенаторов, среди них краковский и киевский епископы, резко воспротивились русским требованиям, Репнин велел ночью арестовать их и вывезти в Калугу, вглубь России."
      - pl: " Przestraszony sejm uchwalił wszystko, czego chciała Rosja."
        ru: "Напуганный сейм принял всё, чего хотела Россия."
      - pl: " Dysydenci otrzymali równe prawa, ale jednocześnie uchwalono tak zwane prawa kardynalne, czyli niezmienne, wśród nich liberum veto i wolną elekcję."
        ru: "Иноверцы получили равные права, но одновременно были приняты так называемые кардинальные, то есть неизменные, законы, среди них liberum veto и вольная элекция."
        note: "kardynalny — основной, неизменный"
      - pl: " Ich gwarantką została caryca."
        ru: "Их гарантом стала императрица."
        note: "gwarantka — гарант (о женщине)"
      - pl: " Od tej chwili każda zmiana ustroju wymagała zgody Rosji."
        ru: "С этого момента любое изменение строя требовало согласия России."
