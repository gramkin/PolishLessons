  - clean: "Mocarstwa chciały, żeby rozbiór zatwierdził polski sejm, bo wtedy byłby zgodny z prawem. Sejm, który zebrał się w 1773 roku, otoczony był przez obce wojska, a wielu posłów zostało przekupionych. Tylko kilku protestowało. Najbardziej znany z nich, poseł nowogródzki Tadeusz Rejtan, położył się na progu sali obrad i nie chciał przepuścić posłów, krzycząc, żeby go zabili, ale nie zabijali ojczyzny. Jego protest był bezskuteczny, ale stał się symbolem. Jan Matejko namalował tę scenę w 1866 roku, a obraz „Rejtan. Upadek Polski” wywołał gwałtowne spory, bo pokazywał, że Polskę zgubiła nie tylko przemoc sąsiadów, ale także zdrada i egoizm własnych elit. W 1775 roku sejm zatwierdził rozbiór. Skutki gospodarcze rozbioru były bardzo dotkliwe. Prusy, które teraz panowały nad dolną Wisłą, założyły w Fordonie komorę celną i nakładały wysokie cła na wszystkie towary płynące do Gdańska. Handel zbożem, główne źródło bogactwa szlachty i miasta, zaczął się dusić. Gdańsk, otoczony ze wszystkich stron przez ziemie pruskie, tracił znaczenie z roku na rok. Wielu jego kupców przenosiło się do innych portów, a miasto, niegdyś najbogatsze w Rzeczypospolitej, powoli ubożało."
