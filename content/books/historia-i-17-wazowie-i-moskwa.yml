  - clean: "W 1596 roku król przeniósł swoją siedzibę z Krakowa do Warszawy. Mówi się często, że powodem był pożar Wawelu, ale ważniejsze było to, że Warszawa leżała bliżej Wilna i Szwecji, a w niej obradował sejm. Kraków pozostał miastem koronacji i pogrzebów królewskich, ale życie polityczne przeniosło się nad środkową Wisłę. Zygmunt przebudował Zamek Królewski w Warszawie, a jego syn Władysław postawił przed nim kolumnę z posągiem ojca. Kolumna Zygmunta, wzniesiona w 1644 roku, jest dziś jednym z symboli Warszawy. Warszawiacy umawiają się „pod Zygmuntem”, jak krakowianie „pod Adasiem”, czyli pod pomnikiem Mickiewicza."
    draft: true
    chunks:
