      - pl: " Szlachta podejrzewała, że chce wzmocnić władzę królewską, wprowadzić głosowanie większością na sejmie i zapewnić tron synowi."
        ru: "Шляхта подозревала, что он хочет усилить королевскую власть, ввести голосование большинством на сейме и обеспечить престол сыну."
        note: "podejrzewać — подозревать; większość — большинство"
      - pl: " Kiedy król ożenił się po raz drugi, z siostrą swojej zmarłej żony, Habsburżanką, oskarżano go o to, że chce związać Polskę z Habsburgami."
        ru: "Когда король женился во второй раз, на сестре своей покойной жены, габсбургской принцессе, его обвиняли в том, что он хочет связать Польшу с Габсбургами."
      - pl: " W latach 1606–1609 przeciwko królowi wybuchł rokosz, na którego czele stanął wojewoda krakowski Mikołaj Zebrzydowski."
        ru: "В 1606–1609 годах против короля вспыхнул рокош, во главе которого встал краковский воевода Миколай Зебжидовский."
