  - clean: "Za panowania Zygmunta III doszło też do wydarzenia, które na stulecia zmieniło życie religijne na ziemiach ruskich. Część prawosławnych biskupów w Rzeczypospolitej, niezadowolona ze stanu swojej Cerkwi, z ingerencji wschodnich patriarchów i z wpływów świeckich bractw, postanowiła uznać zwierzchnictwo papieża. Zachowywali przy tym wschodni obrządek, język cerkiewnosłowiański w liturgii i prawo księży do zawierania małżeństw. W 1596 roku na synodzie w Brześciu ogłoszono unię kościelną, z której narodził się Kościół greckokatolicki, nazywany wtedy unickim. Unia brzeska podzieliła prawosławnych. Wielu wiernych, mieszczan i duchownych, na czele z księciem Konstantym Ostrogskim, nie przyjęło jej i walczyło o prawa swojej Cerkwi. Spór o cerkwie, parafie i majątki trwał przez dziesięciolecia i zaostrzał konflikty na Rusi. Dziś Kościół greckokatolicki jest jednym z najważniejszych Kościołów na zachodniej Ukrainie."
    draft: true
    chunks:
