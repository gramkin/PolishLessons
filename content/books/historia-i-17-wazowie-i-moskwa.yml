  - clean: "Spór dynastyczny stał się przyczyną długich wojen polsko-szwedzkich. Toczyły się one głównie w Inflantach, które Szwedzi chcieli zdobyć, żeby panować nad całym wschodnim wybrzeżem Bałtyku. Najsłynniejszym epizodem była bitwa pod Kircholmem, niedaleko Rygi, 27 września 1605 roku. Hetman litewski Jan Karol Chodkiewicz miał niespełna cztery tysiące żołnierzy, a król szwedzki prawie trzy razy więcej. Chodkiewicz udał odwrót, wywabił Szwedów z dogodnej pozycji, a potem rzucił na nich husarię. Szarża trwała zaledwie kilkanaście minut, ale rozbiła całą armię szwedzką. Wiadomość o zwycięstwie obiegła Europę, a gratulacje przysłali nawet papież i sułtan."
    draft: true
    chunks:
      - pl: "Spór dynastyczny stał się przyczyną długich wojen polsko-szwedzkich."
        ru: "Династический спор стал причиной долгих польско-шведских войн."
        note: "dynastyczny — династический"
      - pl: " Toczyły się one głównie w Inflantach, które Szwedzi chcieli zdobyć, żeby panować nad całym wschodnim wybrzeżem Bałtyku."
        ru: "Они шли главным образом в Ливонии, которую шведы хотели захватить, чтобы господствовать над всем восточным побережьем Балтики."
      - pl: " Najsłynniejszym epizodem była bitwa pod Kircholmem, niedaleko Rygi, 27 września 1605 roku."
        ru: "Самым знаменитым эпизодом стала битва под Кирхгольмом, недалеко от Риги, 27 сентября 1605 года."
      - pl: " Hetman litewski Jan Karol Chodkiewicz miał niespełna cztery tysiące żołnierzy, a król szwedzki prawie trzy razy więcej."
        ru: "У литовского гетмана Яна Кароля Ходкевича было неполных четыре тысячи воинов, а у шведского короля почти втрое больше."
      - pl: " Chodkiewicz udał odwrót, wywabił Szwedów z dogodnej pozycji, a potem rzucił na nich husarię."
        ru: "Ходкевич изобразил отступление, выманил шведов с выгодной позиции, а потом бросил на них гусарию."
        note: "wywabić — выманить; dogodny — удобный, выгодный"
      - pl: " Szarża trwała zaledwie kilkanaście minut, ale rozbiła całą armię szwedzką."
        ru: "Атака длилась всего около четверти часа, но разгромила всю шведскую армию."
        note: "szarża — кавалерийская атака"
      - pl: " Wiadomość o zwycięstwie obiegła Europę, a gratulacje przysłali nawet papież i sułtan."
        ru: "Весть о победе облетела Европу, и поздравления прислали даже папа и султан."
        note: "obiec — облететь"
