  - clean: "Rzeczpospolita szczęśliwie uniknęła udziału w tej strasznej wojnie, w której zginęła jedna trzecia mieszkańców Niemiec. W latach trzydziestych i czterdziestych XVII wieku, za panowania syna Zygmunta, Władysława IV, w kraju panował względny spokój. Władysław był królem pogodnym, tolerancyjnym i lubianym. Kochał teatr i muzykę, a na Zamku Królewskim w Warszawie urządził scenę, na której wystawiano włoskie opery, jedne z pierwszych poza Italią. Szlachta z sentymentem wspominała jego czasy jako ostatnie szczęśliwe lata dawnej Rzeczypospolitej. Pod powierzchnią narastały jednak konflikty, które w 1648 roku wybuchły z siłą, jakiej nikt się nie spodziewał."
