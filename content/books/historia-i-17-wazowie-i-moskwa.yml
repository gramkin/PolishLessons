paragraphs:
  - clean: "Elekcja po śmierci Batorego zakończyła się, jak się obawiano, podwójnym wyborem. Stronnictwo kanclerza Zamoyskiego wybrało szwedzkiego królewicza Zygmunta Wazę, syna Katarzyny Jagiellonki, siostry Zygmunta Augusta. Przeciwnicy kanclerza, na czele z rodem Zborowskich, którzy nie mogli mu darować egzekucji Samuela, wybrali arcyksięcia Maksymiliana Habsburga. Spór rozstrzygnęła bitwa. W styczniu 1588 roku pod Byczyną na Śląsku Zamoyski rozbił wojska Maksymiliana, a samego arcyksięcia wziął do niewoli. Habsburg musiał zrzec się pretensji do polskiej korony."
    draft: true
    chunks:
      - pl: "Elekcja po śmierci Batorego zakończyła się, jak się obawiano, podwójnym wyborem."
        ru: "Элекция после смерти Батория закончилась, как и опасались, двойным избранием."
      - pl: " Stronnictwo kanclerza Zamoyskiego wybrało szwedzkiego królewicza Zygmunta Wazę, syna Katarzyny Jagiellonki, siostry Zygmunta Augusta."
        ru: "Партия канцлера Замойского избрала шведского королевича Сигизмунда Вазу, сына Екатерины Ягеллонки, сестры Сигизмунда Августа."
        note: "stronnictwo — партия, группировка"
      - pl: " Przeciwnicy kanclerza, na czele z rodem Zborowskich, którzy nie mogli mu darować egzekucji Samuela, wybrali arcyksięcia Maksymiliana Habsburga."
        ru: "Противники канцлера во главе с родом Зборовских, не простившие ему казни Самуэля, избрали эрцгерцога Максимилиана Габсбурга."
        note: "darować — простить"
      - pl: " Spór rozstrzygnęła bitwa."
        ru: "Спор решила битва."
      - pl: " W styczniu 1588 roku pod Byczyną na Śląsku Zamoyski rozbił wojska Maksymiliana, a samego arcyksięcia wziął do niewoli."
        ru: "В январе 1588 года под Бычиной в Силезии Замойский разбил войска Максимилиана, а самого эрцгерцога взял в плен."
      - pl: " Habsburg musiał zrzec się pretensji do polskiej korony."
        ru: "Габсбургу пришлось отказаться от притязаний на польскую корону."
        note: "pretensja — притязание"
