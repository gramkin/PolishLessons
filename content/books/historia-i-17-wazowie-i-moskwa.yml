        note: "rokoszanin — участник рокоша"
      - pl: " W 1607 roku wojska królewskie pobiły ich pod Guzowem, ale król musiał obiecać, że nie będzie naruszał szlacheckich wolności."
        ru: "В 1607 году королевские войска разбили их под Гузовом, но король был вынужден пообещать, что не будет посягать на шляхетские вольности."
        note: "naruszać — нарушать, посягать"
