  - clean: "Władysław IV rozumiał, że Kozaków trzeba czymś zająć. Marzył o wielkiej wojnie z Turcją, w której mógłby zdobyć sławę, a Kozacy znaleźliby zajęcie i nagrodę. W tajemnicy przed sejmem prowadził rozmowy z Wenecją i obiecywał kozackim starszynom zwiększenie rejestru. Kiedy plan wyszedł na jaw, szlachta wpadła w oburzenie, bo bała się, że król chce z pomocą wojny wzmocnić swoją władzę. Sejm w 1646 roku zakazał wojny i kazał rozpuścić zaciągnięte wojska. Kozacy, którym obiecano tak wiele, zostali z niczym. Wśród rozczarowanych był pewien setnik z Czehryna, szlachcic prawosławny, którego nazwisko wkrótce poznała cała Europa: Bohdan Chmielnicki."
