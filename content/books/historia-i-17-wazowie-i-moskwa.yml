  - clean: "Najpoważniejszym z tych konfliktów była sprawa kozacka. Kozacy uważali się za rycerzy, którzy bronią chrześcijaństwa przed Tatarami i Turkami, i domagali się praw podobnych do szlacheckich. Rzeczpospolita chętnie korzystała z ich pomocy w czasie wojny, ale w czasie pokoju chciała ich ograniczyć i zmniejszyć rejestr. Magnaci uważali Kozaków za zbiegłych chłopów, których należy zmusić do pańszczyzny. Do tego dochodziła sprawa religijna: Kozacy byli prawosławni i bronili swojej Cerkwi przed unią. W latach dwudziestych i trzydziestych XVII wieku wybuchło kilka powstań kozackich, które wojska koronne krwawo stłumiły. Po ostatnim z nich, w 1638 roku, sejm odebrał Kozakom dawne przywileje, a nad Dnieprem odbudowano twierdzę Kudak, która miała pilnować, by chłopi nie uciekali na Zaporoże. Szlachta nazywała następne dziesięć lat „złotym pokojem”. Dla Kozaków był to czas upokorzenia i gniewu, który czekał na swoją chwilę."
