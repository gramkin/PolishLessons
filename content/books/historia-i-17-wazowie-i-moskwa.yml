  - clean: "Zygmunt III, który panował od 1587 do 1632 roku, był człowiekiem głęboko religijnym, wychowanym przez jezuitów. Był też jednym z niewielu katolików w protestanckiej Szwecji. W 1592 roku, po śmierci ojca, odziedziczył tron szwedzki i przez kilka lat był królem dwóch państw. Szwedzi nie chcieli jednak katolickiego króla, który mieszkał w Warszawie. W 1599 roku zdetronizował go jego stryj, Karol Sudermański, który później koronował się jako Karol IX. Zygmunt do końca życia nie pogodził się z utratą szwedzkiej korony."
    draft: true
    chunks:
      - pl: "Zygmunt III, który panował od 1587 do 1632 roku, był człowiekiem głęboko religijnym, wychowanym przez jezuitów."
        ru: "Сигизмунд III, правивший с 1587 по 1632 год, был глубоко религиозным человеком, воспитанным иезуитами."
      - pl: " Był też jednym z niewielu katolików w protestanckiej Szwecji."
        ru: "Он был также одним из немногих католиков в протестантской Швеции."
      - pl: " W 1592 roku, po śmierci ojca, odziedziczył tron szwedzki i przez kilka lat był królem dwóch państw."
        ru: "В 1592 году, после смерти отца, он унаследовал шведский престол и несколько лет был королём двух государств."
      - pl: " Szwedzi nie chcieli jednak katolickiego króla, który mieszkał w Warszawie."
        ru: "Но шведы не хотели католического короля, жившего в Варшаве."
      - pl: " W 1599 roku zdetronizował go jego stryj, Karol Sudermański, który później koronował się jako Karol IX."
        ru: "В 1599 году его низложил дядя, Карл Сёдерманландский, который позже короновался как Карл IX."
        note: "zdetronizować — низложить"
      - pl: " Zygmunt do końca życia nie pogodził się z utratą szwedzkiej korony."
        ru: "Сигизмунд до конца жизни не смирился с потерей шведской короны."
