        ru: "В 1629 году под Тшцяной гетман Станислав Конецпольский едва не взял в плен самого Густава Адольфа."
      - pl: " Mimo to rozejm w Altmarku był dla Polski niekorzystny: Szwedzi zatrzymali większość Inflant i przez kilka lat pobierali cła z handlu w pruskich portach."
        ru: "Тем не менее Альтмаркское перемирие было для Польши невыгодным: шведы сохранили большую часть Ливонии и несколько лет взимали пошлины с торговли в прусских портах."
