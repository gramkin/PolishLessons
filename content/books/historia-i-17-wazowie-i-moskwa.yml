      - pl: " Gustaw Adolf mógł zwrócić się przeciwko cesarzowi i włączyć do wojny trzydziestoletniej, która w tym czasie pustoszyła Niemcy."
        ru: "Густав Адольф смог обратиться против императора и вступить в Тридцатилетнюю войну, которая в это время опустошала Германию."
