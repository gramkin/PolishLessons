  - clean: "Husaria była wtedy u szczytu swojej sławy. Husarze nosili zbroje, długie kopie, nawet pięciometrowe, i skrzydła z piór przymocowane do zbroi albo siodła. Do dziś historycy spierają się, po co były te skrzydła: czy miały straszyć konie przeciwnika szumem, czy chronić przed arkanami, czy po prostu robić wrażenie. Wiadomo za to, że szarża husarii, rozpędzonej do pełnego galopu w zwartym szyku, była przez ponad sto lat jedną z najgroźniejszych broni na polach bitew Europy Wschodniej. Husarz musiał sam utrzymać konie i pocztowych, czyli towarzyszących mu żołnierzy, więc służyli w niej głównie zamożni szlachcice."
    draft: true
    chunks:
      - pl: "Husaria była wtedy u szczytu swojej sławy."
        ru: "Гусария тогда была на вершине своей славы."
      - pl: " Husarze nosili zbroje, długie kopie, nawet pięciometrowe, i skrzydła z piór przymocowane do zbroi albo siodła."
        ru: "Гусары носили доспехи, длинные копья — до пяти метров — и крылья из перьев, прикреплённые к доспехам или седлу."
        note: "pióro — перо; przymocować — прикрепить; siodło — седло"
      - pl: " Do dziś historycy spierają się, po co były te skrzydła: czy miały straszyć konie przeciwnika szumem, czy chronić przed arkanami, czy po prostu robić wrażenie."
        ru: "До сих пор историки спорят, зачем были эти крылья: должны ли они были пугать коней противника шумом, защищать от арканов или просто производить впечатление."
        note: "szum — шум; arkan — аркан"
      - pl: " Wiadomo za to, że szarża husarii, rozpędzonej do pełnego galopu w zwartym szyku, była przez ponad sto lat jedną z najgroźniejszych broni na polach bitew Europy Wschodniej."
        ru: "Зато известно, что атака гусарии, разогнанной до полного галопа в сомкнутом строю, больше ста лет была одним из самых грозных видов оружия на полях сражений Восточной Европы."
        note: "rozpędzony — разогнанный; zwarty — сомкнутый"
      - pl: " Husarz musiał sam utrzymać konie i pocztowych, czyli towarzyszących mu żołnierzy, więc służyli w niej głównie zamożni szlachcice."
        ru: "Гусар должен был сам содержать коней и пахолков, то есть сопровождавших его воинов, поэтому в ней служили главным образом зажиточные шляхтичи."
        note: "pocztowy — пахолок, воин из свиты"
    words: { "głównie": glownie, "szczytu": szczyt, "sławy": slawa, "skrzydła": skrzydlo, "piór": pioro, "straszyć": straszyc, "przeciwnika": przeciwnik, "szumem": szum, "zwartym": zwarty, "najgroźniejszych": grozny, "bitew": bitwa, "towarzyszących": towarzyszyc, "zamożni": zamozny }
  - clean: "Zygmunt III nie cieszył się sympatią szlachty. Był małomówny, sztywny i otaczał się cudzoziemcami i jezuitami. Szlachta podejrzewała, że chce wzmocnić władzę królewską, wprowadzić głosowanie większością na sejmie i zapewnić tron synowi. Kiedy król ożenił się po raz drugi, z siostrą swojej zmarłej żony, Habsburżanką, oskarżano go o to, że chce związać Polskę z Habsburgami. W latach 1606–1609 przeciwko królowi wybuchł rokosz, na którego czele stanął wojewoda krakowski Mikołaj Zebrzydowski. Rokoszanie domagali się nawet detronizacji Zygmunta. W 1607 roku wojska królewskie pobiły ich pod Guzowem, ale król musiał obiecać, że nie będzie naruszał szlacheckich wolności. Odtąd każda próba wzmocnienia władzy królewskiej budziła w szlachcie natychmiastowy opór."
    draft: true
    chunks:
      - pl: "Zygmunt III nie cieszył się sympatią szlachty."
        ru: "Сигизмунд III не пользовался симпатией шляхты."
