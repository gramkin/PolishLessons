      - pl: "\nSnują się każdym znęcone pastwiskiem;"
        ru: "бродят, привлечённые каждым пастбищем;"
        note: "znęcić — приманить"
      - pl: "\nBoże! Dlaczego twój piorun tak drzymie?"
        ru: "Боже! Почему твоя молния так дремлет?"
        note: "drzymać — дремать"
      - pl: "\nChciwiec z Kahorsu, chełpliwy Gaskoniec"
        ru: "Скряга из Каора, хвастливый гасконец"
        note: "Иоанн XXII и Климент V"
      - pl: "\nJuż pić krew naszą nie żartem zamierza;"
        ru: "уже не в шутку намерен пить нашу кровь;"
      - pl: "\nPiękny początku, zły będzie twój koniec"
        ru: "прекрасное начало, дурным будет твой конец!"
      - pl: "\nAle Opatrzność, która ze Scypionem"
        ru: "Но Провидение, что со Сципионом"
      - pl: "\nBroniła niegdyś chwałę świata w Rzymie,"
        ru: "защитило некогда в Риме славу мира,"
      - pl: "\nPrzyjdzie mu w pomoc, w co wierzę z zapałem!"
        ru: "придёт ему на помощь, во что я горячо верю!"
    words: { "suknią": suknia, "piorun": piorun, "żartem": zart, "zamierza": zamierzac, "początku": poczatek, "Broniła": bronic }
  - clean: "Synu, gdy w świat twój jako ciężki ciałem\nWrócisz, otwieraj usta, niech kto żyje\nSłucha, a nie kryj, czego ja nie kryję.»\nA jak z powietrza kędzierzawym szronem\nPaździerzą śniegi miękko spadające,\nGdy Koziorożec bodzie rogiem słońce;\nPodobnie eter, na cośmy patrzyli,\nTymi świętymi paździerzył światłami,\nKtóre się były zatrzymały z nami,\nAż od ich iskier mżył deszcz srebrno-złoty;"
