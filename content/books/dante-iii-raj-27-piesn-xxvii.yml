  - clean: "Od chwili, skąd tam pierwszy raz spojrzałem\nSpostrzegłem, żem łuk południowy słońca\nPrzebiegł od jego środka aż do końca;\nI tak patrzyłem oczyma bystremi,\nŻe za Kadyksem opodal widziałem\nTwój nieroztropny przechód, Ulissesie\nI brzeg, na którym, jak wieść stara niesie,\nPiękną Europę porwał byk na rogi."
    verse: true
    chunks:
      - pl: "Od chwili, skąd tam pierwszy raz spojrzałem"
        ru: "С того мига, когда я впервые взглянул туда,"
      - pl: "\nSpostrzegłem, żem łuk południowy słońca"
        ru: "я заметил, что пробежал полуденную дугу солнца"
      - pl: "\nPrzebiegł od jego środka aż do końca;"
        ru: "от её середины до конца;"
      - pl: "\nI tak patrzyłem oczyma bystremi,"
        ru: "и так я смотрел зоркими глазами,"
      - pl: "\nŻe za Kadyksem opodal widziałem"
        ru: "что за Кадисом невдалеке увидел"
      - pl: "\nTwój nieroztropny przechód, Ulissesie"
        ru: "твой безрассудный путь, Улисс,"
        note: "przechód — переход"
      - pl: "\nI brzeg, na którym, jak wieść stara niesie,"
        ru: "и берег, на котором, как гласит старое предание,"
