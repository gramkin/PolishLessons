      - pl: "\nPodobnie eter, na cośmy patrzyli,"
        ru: "так эфир, на который мы смотрели,"
      - pl: "\nTymi świętymi paździerzył światłami,"
        ru: "осыпался этими святыми светами,"
      - pl: "\nKtóre się były zatrzymały z nami,"
