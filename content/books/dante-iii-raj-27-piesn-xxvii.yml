paragraphs:
  - clean: "8. Hymn pochwalny rajski. Skarga św. Piotra na rządy papieskie, przepowiednia mściciela. Św. Piotr znika. 9. Ku niebu kryształowemu, Primum Mobile, i siedzibie aniołów. Beatrycze mówi o przewrocie porządku i ogólnym zwyrodnieniu świata współczesnego. Powtórna zapowiedź zbawcy."
    chunks:
      - pl: "8. Hymn pochwalny rajski. Skarga św. Piotra na rządy papieskie, przepowiednia mściciela. Św. Piotr znika. 9. Ku niebu kryształowemu, Primum Mobile, i siedzibie aniołów. Beatrycze mówi o przewrocie porządku i ogólnym zwyrodnieniu świata współczesnego. Powtórna zapowiedź zbawcy."
        ru: "8. Райский хвалебный гимн. Жалоба святого Петра на папское правление, пророчество о мстителе. Святой Пётр исчезает. 9. К хрустальному небу, Перводвигателю, обители ангелов. Беатриче говорит о перевороте порядка и всеобщем вырождении современного мира. Повторное предвестие спасителя."
    words: { "Skarga": skarga, "znika": znikac, "niebu": niebo, "siedzibie": siedziba, "ogólnym": ogolny, "współczesnego": wspolczesny }
  - clean: "«Ojcu, Synowi i Duchowi chwała!»\nŚpiewał raj cały, pieśń co to śpiewała\nTak była słodka, że mnie upajała.\nZda się, widziałem tam uśmiech wszechświata,\nBo upojenia mego szał uroczy\nWchodził zarazem przez słuch i przez oczy."
    verse: true
    chunks:
      - pl: "«Ojcu, Synowi i Duchowi chwała!»"
        ru: "«Отцу, Сыну и Духу слава!»"
      - pl: "\nŚpiewał raj cały, pieśń co to śpiewała"
        ru: "пел весь рай, и песнь, что он пел,"
      - pl: "\nTak była słodka, że mnie upajała."
        ru: "была так сладка, что меня опьяняла."
        note: "upajać — опьянять"
      - pl: "\nZda się, widziałem tam uśmiech wszechświata,"
        ru: "Казалось, я видел там улыбку вселенной,"
      - pl: "\nBo upojenia mego szał uroczy"
        ru: "ибо прелестное безумие моего опьянения"
      - pl: "\nWchodził zarazem przez słuch i przez oczy."
        ru: "входило разом через слух и через глаза."
    words: { "chwała": chwala, "pieśń": piesn, "uśmiech": usmiech, "wszechświata": wszechswiat, "szał": szal, "słuch": sluch }
  - clean: "O! Wesołości wielka i bogata.\nO! Życie w miłość i pokój obfite,\nBogactwo wiecznie bez żądzy i syte!\nCztery pochodnie płonęły bez przerwy\nStojąc przede mną, ta, co przyszła pierwej,\nPoczęła iskrzyć, a żar jej był taki,\nJak gdyby gwiazdy Marsa i Jowisza\nPrzeobrażone niespodzianie w ptaki\nNawzajem swoje zamieniały pierze."
    verse: true
    chunks:
      - pl: "O! Wesołości wielka i bogata."
        ru: "О великое и богатое веселье!"
      - pl: "\nO! Życie w miłość i pokój obfite,"
        ru: "О жизнь, обильная любовью и миром,"
      - pl: "\nBogactwo wiecznie bez żądzy i syte!"
        ru: "богатство, вечно сытое и без жажды!"
      - pl: "\nCztery pochodnie płonęły bez przerwy"
        ru: "Четыре факела пылали без перерыва,"
      - pl: "\nStojąc przede mną, ta, co przyszła pierwej,"
        ru: "стоя передо мной; тот, что пришёл первым,"
        note: "святой Пётр"
      - pl: "\nPoczęła iskrzyć, a żar jej był taki,"
        ru: "начал искриться, и жар его был таков,"
      - pl: "\nJak gdyby gwiazdy Marsa i Jowisza"
        ru: "как если бы звёзды Марса и Юпитера,"
      - pl: "\nPrzeobrażone niespodzianie w ptaki"
        ru: "нежданно превращённые в птиц,"
      - pl: "\nNawzajem swoje zamieniały pierze."
        ru: "поменялись друг с другом перьями."
        note: "белый Юпитер стал красным"
    words: { "Bogactwo": bogactwo, "wiecznie": wiecznie, "pochodnie": pochodnia, "płonęły": plonac, "Poczęła": poczac, "zamieniały": zamieniac }
  - clean: "Opatrzność sama zajęta w tej sferze\nI obowiązków, i czasów wydziałem,\nBłogosławionych pieśniom w niebie całem\nKazała milczeć i stała się cisza,\nGdy posłyszałem: — «Że się blask mój mieni,\nNie dziw się temu, w ciągu mowy mojej\nKażde z tych świateł tak się zaczerwieni."
    verse: true
    chunks:
      - pl: "Opatrzność sama zajęta w tej sferze"
        ru: "Само Провидение, что ведает в этой сфере"
      - pl: "\nI obowiązków, i czasów wydziałem,"
        ru: "распределением обязанностей и времён,"
        note: "wydział — распределение"
      - pl: "\nBłogosławionych pieśniom w niebie całem"
        ru: "велело умолкнуть песням блаженных"
      - pl: "\nKazała milczeć i stała się cisza,"
        ru: "во всём небе, и настала тишина,"
      - pl: "\nGdy posłyszałem: — «Że się blask mój mieni,"
        ru: "когда я услышал: — «Что мой блеск меняется,"
      - pl: "\nNie dziw się temu, w ciągu mowy mojej"
        ru: "тому не дивись: пока я говорю,"
      - pl: "\nKażde z tych świateł tak się zaczerwieni."
        ru: "каждый из этих светов так же покраснеет."
    words: { "obowiązków": obowiazek, "Błogosławionych": blogoslawic, "milczeć": milczec, "cisza": cisza, "blask": blask, "ciągu": ciag }
  - clean: "On co na ziemi sam na imię swoje\nPrzywłaszczył miejsce, miejsce, miejsce moje,\nKtóre, o zgrozo! niezajęte stoi\nPrzed Synem Bożym! On z mego cmentarza\nZrobił kałużę z krwi i nieczystoty,\nCo dla strąconej stąd w otchłań istoty\nTam ukorzonej ból pychy umarza»."
    verse: true
    chunks:
      - pl: "On co na ziemi sam na imię swoje"
        ru: "Тот, кто на земле сам на своё имя"
        note: "Бонифаций VIII"
      - pl: "\nPrzywłaszczył miejsce, miejsce, miejsce moje,"
        ru: "присвоил место, место, место моё,"
      - pl: "\nKtóre, o zgrozo! niezajęte stoi"
        ru: "которое, о ужас! стоит незанятым"
      - pl: "\nPrzed Synem Bożym! On z mego cmentarza"
        ru: "перед Сыном Божьим! Он из моего кладбища"
        note: "Рим"
      - pl: "\nZrobił kałużę z krwi i nieczystoty,"
        ru: "сделал лужу из крови и нечистот,"
      - pl: "\nCo dla strąconej stąd w otchłań istoty"
        ru: "что для существа, сброшенного отсюда в бездну,"
        note: "Люцифера"
      - pl: "\nTam ukorzonej ból pychy umarza»."
        ru: "там униженного, утоляет боль гордыни»."
    words: { "ziemi": ziemia, "imię": imie, "Bożym": bozy, "cmentarza": cmentarz, "krwi": krew, "istoty": istota }
  - clean: "Wtenczas widziałem oba nieba końce\nPrzyobleczone w blask ognia tak ostry,\nJakim w poranek i wieczorem słońce\nNaprzeciw siebie maluje obłoki.\nJak piękność znana ze skromności wysokiej\nPewną jest siebie, a jednak źrenice\nSpuszcza, słuchając o błędzie swej siostry,\nTak się mieniła z wstydu Beatryce,\nTakie być mogło w niebie przemienienie,\nGdy się spełniało krzyżowe cierpienie."
    verse: true
    chunks:
      - pl: "Wtenczas widziałem oba nieba końce"
        ru: "Тогда я увидел оба конца неба"
      - pl: "\nPrzyobleczone w blask ognia tak ostry,"
        ru: "облечёнными в столь резкий блеск огня,"
      - pl: "\nJakim w poranek i wieczorem słońce"
        ru: "каким утром и вечером солнце"
      - pl: "\nNaprzeciw siebie maluje obłoki."
        ru: "расписывает облака напротив себя."
      - pl: "\nJak piękność znana ze skromności wysokiej"
        ru: "Как красавица, известная высокой скромностью,"
      - pl: "\nPewną jest siebie, a jednak źrenice"
        ru: "уверена в себе, а всё же опускает"
      - pl: "\nSpuszcza, słuchając o błędzie swej siostry,"
        ru: "зрачки, слушая о проступке своей сестры,"
      - pl: "\nTak się mieniła z wstydu Beatryce,"
        ru: "так менялась от стыда Беатриче;"
      - pl: "\nTakie być mogło w niebie przemienienie,"
        ru: "такое могло быть на небе преображение,"
      - pl: "\nGdy się spełniało krzyżowe cierpienie."
        ru: "когда свершалось крестное страдание."
    words: { "ostry": ostry, "poranek": poranek, "słońce": slonce, "maluje": malowac, "piękność": pieknosc, "wstydu": wstyd }
  - clean: "Potem tak mówił, lecz głos swój tak zmienił,\nWięc tak jak światło, gdy je zaczerwienił:\n«Oblubienica Chrystusa skąpana\nW krwi mojej, Lina i Kleta nie na to,\nA żeby złoto było jej zapłatą,\nLecz raczej życia błogość wiekuista\nSyksta, Kaliksta, Piusa, Urbana,\nKtórych ze łzami krew lała się czysta."
    verse: true
    chunks:
      - pl: "Potem tak mówił, lecz głos swój tak zmienił,"
        ru: "Потом он говорил так, но так изменил свой голос,"
      - pl: "\nWięc tak jak światło, gdy je zaczerwienił:"
        ru: "как свет, когда покраснел:"
      - pl: "\n«Oblubienica Chrystusa skąpana"
        ru: "«Невеста Христова, омытая"
      - pl: "\nW krwi mojej, Lina i Kleta nie na to,"
        ru: "моей кровью, кровью Лина и Клета, не для того,"
        note: "первые папы"
      - pl: "\nA żeby złoto było jej zapłatą,"
        ru: "чтобы золото было ей платой,"
      - pl: "\nLecz raczej życia błogość wiekuista"
        ru: "но скорее ради вечного блаженства жизни"
      - pl: "\nSyksta, Kaliksta, Piusa, Urbana,"
        ru: "Сикста, Каликста, Пия, Урбана,"
      - pl: "\nKtórych ze łzami krew lała się czysta."
        ru: "чья чистая кровь лилась со слезами."
    words: { "głos": glos, "zmienił": zmienic, "światło": swiatlo, "zapłatą": zaplata, "łzami": lza, "lała": lac }
  - clean: "Nie taki cel był mojego zamiaru,\nAby lud boży przy mojej stolicy\nStał po prawicy, a ten po lewicy;\nAżeby klucz mój był godłem sztandaru,\nPod którym krew się chrześcijańska leje;\nAżebym stał się pieczęci odciskiem,\nKłamne lub kupne zdobić przywileje,\nCo widząc, często wstydem czerwienieję."
    verse: true
    chunks:
      - pl: "Nie taki cel był mojego zamiaru,"
        ru: "Не такова была цель моего намерения,"
      - pl: "\nAby lud boży przy mojej stolicy"
        ru: "чтобы народ Божий при моём престоле"
      - pl: "\nStał po prawicy, a ten po lewicy;"
        ru: "стоял одни по правую руку, а другие по левую;"
      - pl: "\nAżeby klucz mój był godłem sztandaru,"
        ru: "чтобы мой ключ был эмблемой знамени,"
        note: "godło — эмблема, герб"
      - pl: "\nPod którym krew się chrześcijańska leje;"
        ru: "под которым льётся христианская кровь;"
      - pl: "\nAżebym stał się pieczęci odciskiem,"
        ru: "чтобы я стал оттиском печати,"
      - pl: "\nKłamne lub kupne zdobić przywileje,"
        ru: "украшающим лживые или купленные привилегии,"
      - pl: "\nCo widząc, często wstydem czerwienieję."
