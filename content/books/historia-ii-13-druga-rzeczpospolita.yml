  - clean: "Piłsudski nie chciał kandydować na urząd prezydenta, który uważał za zbyt słaby. W grudniu 1922 roku Zgromadzenie Narodowe wybrało na prezydenta Gabriela Narutowicza, profesora politechniki w Zurychu i wybitnego inżyniera, budowniczego elektrowni wodnych. Narutowicz wygrał dzięki głosom lewicy, ludowców i posłów mniejszości narodowych, zwłaszcza żydowskich i ukraińskich. Endecja rozpętała przeciwko niemu kampanię nienawiści i nazywała go prezydentem wybranym przez Żydów. W dniu zaprzysiężenia tłumy próbowały zatrzymać jego powóz, obrzucając go śniegiem i błotem."
    draft: true
    chunks:
      - pl: "Piłsudski nie chciał kandydować na urząd prezydenta, który uważał za zbyt słaby."
        ru: "Пилсудский не захотел баллотироваться на пост президента, который считал слишком слабым."
      - pl: " W grudniu 1922 roku Zgromadzenie Narodowe wybrało na prezydenta Gabriela Narutowicza, profesora politechniki w Zurychu i wybitnego inżyniera, budowniczego elektrowni wodnych."
        ru: "В декабре 1922 года Национальное собрание избрало президентом Габриэля Нарутовича, профессора политехникума в Цюрихе и выдающегося инженера, строителя гидроэлектростанций."
        note: "elektrownia wodna — гидроэлектростанция"
      - pl: " Narutowicz wygrał dzięki głosom lewicy, ludowców i posłów mniejszości narodowych, zwłaszcza żydowskich i ukraińskich."
        ru: "Нарутович победил благодаря голосам левых, крестьянских партий и депутатов национальных меньшинств, особенно еврейских и украинских."
        note: "ludowiec — член крестьянской партии"
      - pl: " Endecja rozpętała przeciwko niemu kampanię nienawiści i nazywała go prezydentem wybranym przez Żydów."
        ru: "Эндеция развязала против него кампанию ненависти и называла его президентом, избранным евреями."
        note: "rozpętać — развязать"
      - pl: " W dniu zaprzysiężenia tłumy próbowały zatrzymać jego powóz, obrzucając go śniegiem i błotem."
        ru: "В день присяги толпы пытались остановить его экипаж, забрасывая его снегом и грязью."
        note: "zaprzysiężenie — приведение к присяге"
    words: { "narodowych": narodowy, "urząd": urzad, "grudniu": grudzien, "wybitnego": wybitny, "inżyniera": inzynier, "wodnych": wodny, "żydowskich": zydowski, "kampanię": kampania, "nienawiści": nienawisc, "tłumy": tlum, "śniegiem": snieg, "błotem": bloto }
  - clean: "Pięć dni później, 16 grudnia 1922 roku, Narutowicz odwiedził wystawę sztuki w warszawskiej galerii Zachęta. Tam zastrzelił go malarz Eligiusz Niewiadomski, związany wcześniej z endecją. Zabójca został skazany na śmierć i stracony, ale dla części prawicy stał się bohaterem, a na jego grób przychodziły tłumy. Zabójstwo pierwszego prezydenta było dla Polski ogromnym wstrząsem. Piłsudski nigdy nie wybaczył endecji tej zbrodni i na zawsze zachował do niej głęboką niechęć. Nowym prezydentem został Stanisław Wojciechowski, dawny towarzysz Piłsudskiego z PPS."
    draft: true
    chunks:
      - pl: "Pięć dni później, 16 grudnia 1922 roku, Narutowicz odwiedził wystawę sztuki w warszawskiej galerii Zachęta."
        ru: "Через пять дней, 16 декабря 1922 года, Нарутович посетил художественную выставку в варшавской галерее «Захента»."
      - pl: " Tam zastrzelił go malarz Eligiusz Niewiadomski, związany wcześniej z endecją."
        ru: "Там его застрелил художник Элигиуш Невядомский, прежде связанный с эндецией."
      - pl: " Zabójca został skazany na śmierć i stracony, ale dla części prawicy stał się bohaterem, a na jego grób przychodziły tłumy."
        ru: "Убийца был приговорён к смерти и казнён, но для части правых стал героем, и к его могиле приходили толпы."
        note: "stracić — казнить"
      - pl: " Zabójstwo pierwszego prezydenta było dla Polski ogromnym wstrząsem."
        ru: "Убийство первого президента стало для Польши огромным потрясением."
        note: "wstrząs — потрясение"
      - pl: " Piłsudski nigdy nie wybaczył endecji tej zbrodni i na zawsze zachował do niej głęboką niechęć."
        ru: "Пилсудский так и не простил эндеции этого преступления и навсегда сохранил к ней глубокую неприязнь."
      - pl: " Nowym prezydentem został Stanisław Wojciechowski, dawny towarzysz Piłsudskiego z PPS."
        ru: "Новым президентом стал Станислав Войцеховский, бывший товарищ Пилсудского по ППС."
    words: { "tłumy": tlum, "grudnia": grudzien, "wystawę": wystawa, "galerii": galeria, "skazany": skazac, "grób": grob, "wstrząsem": wstrzas }
  - clean: "W pierwszych latach niepodległości Polska przeżyła straszną inflację. Rząd, który musiał utrzymywać wojsko i odbudowywać kraj, drukował coraz więcej pieniędzy. W 1923 roku ceny rosły z dnia na dzień, a za jednego dolara płacono w końcu kilka milionów marek polskich. Ludzie wydawali pensje natychmiast po otrzymaniu, bo następnego dnia pieniądze były już warte o wiele mniej. Najbardziej cierpieli robotnicy i urzędnicy, a najwięcej zarabiali spekulanci."
    draft: true
    chunks:
      - pl: "W pierwszych latach niepodległości Polska przeżyła straszną inflację."
        ru: "В первые годы независимости Польша пережила страшную инфляцию."
      - pl: " Rząd, który musiał utrzymywać wojsko i odbudowywać kraj, drukował coraz więcej pieniędzy."
        ru: "Правительство, которому нужно было содержать армию и восстанавливать страну, печатало всё больше денег."
      - pl: " W 1923 roku ceny rosły z dnia na dzień, a za jednego dolara płacono w końcu kilka milionów marek polskich."
        ru: "В 1923 году цены росли изо дня в день, и за один доллар в конце концов платили несколько миллионов польских марок."
      - pl: " Ludzie wydawali pensje natychmiast po otrzymaniu, bo następnego dnia pieniądze były już warte o wiele mniej."
        ru: "Люди тратили зарплату сразу после получения, потому что на следующий день деньги стоили уже гораздо меньше."
        note: "pensja — зарплата"
      - pl: " Najbardziej cierpieli robotnicy i urzędnicy, a najwięcej zarabiali spekulanci."
        ru: "Больше всего страдали рабочие и служащие, а больше всего зарабатывали спекулянты."
    words: { "utrzymywać": utrzymywac, "wojsko": wojsko, "rosły": rosnac, "marek": marka, "polskich": polski, "pensje": pensja, "robotnicy": robotnik, "urzędnicy": urzednik, "zarabiali": zarabiac }
  - clean: "Kryzys opanował premier Władysław Grabski, ekonomista, który w 1924 roku przeprowadził reformę walutową. Wprowadził nową walutę, złotego, i utworzył Bank Polski, który miał pilnować jej wartości. Reformę przeprowadzono bez pożyczek zagranicznych, dzięki podatkom i oszczędnościom, co budziło podziw w Europie. Rok później Niemcy rozpoczęły z Polską wojnę celną i przestały kupować polski węgiel, co wywołało nowy kryzys. Złoty stracił część wartości, bezrobocie wzrosło, a rząd Grabskiego upadł. Polacy coraz bardziej tracili zaufanie do parlamentu i partii politycznych."
    draft: true
    chunks:
      - pl: "Kryzys opanował premier Władysław Grabski, ekonomista, który w 1924 roku przeprowadził reformę walutową."
        ru: "С кризисом справился премьер Владислав Грабский, экономист, который в 1924 году провёл денежную реформу."
        note: "walutowy — денежный, валютный"
      - pl: " Wprowadził nową walutę, złotego, i utworzył Bank Polski, który miał pilnować jej wartości."
        ru: "Он ввёл новую валюту, злотый, и создал Польский банк, который должен был следить за её стоимостью."
      - pl: " Reformę przeprowadzono bez pożyczek zagranicznych, dzięki podatkom i oszczędnościom, co budziło podziw w Europie."
        ru: "Реформу провели без иностранных займов, за счёт налогов и экономии, что вызывало восхищение в Европе."
        note: "pożyczka — заём"
      - pl: " Rok później Niemcy rozpoczęły z Polską wojnę celną i przestały kupować polski węgiel, co wywołało nowy kryzys."
        ru: "Год спустя Германия начала с Польшей таможенную войну и перестала покупать польский уголь, что вызвало новый кризис."
        note: "celny — таможенный"
      - pl: " Złoty stracił część wartości, bezrobocie wzrosło, a rząd Grabskiego upadł."
        ru: "Злотый потерял часть стоимости, безработица выросла, а правительство Грабского пало."
      - pl: " Polacy coraz bardziej tracili zaufanie do parlamentu i partii politycznych."
        ru: "Поляки всё больше теряли доверие к парламенту и политическим партиям."
