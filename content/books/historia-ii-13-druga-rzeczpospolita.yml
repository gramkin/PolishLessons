    chunks:
      - pl: "Piłsudski przez kilka lat pozostawał poza polityką i mieszkał w dworku w Sulejówku pod Warszawą."
        ru: "Пилсудский несколько лет оставался вне политики и жил в усадьбе в Сулеювке под Варшавой."
        note: "dworek — усадьба, небольшой помещичий дом"
      - pl: " Krytykował jednak ostro partie polityczne, które jego zdaniem dbały tylko o własne interesy i niszczyły państwo."
        ru: "Однако он резко критиковал политические партии, которые, по его мнению, заботились только о собственных интересах и разрушали государство."
      - pl: " W maju 1926 roku, gdy premierem po raz kolejny został Wincenty Witos, Piłsudski postanowił działać."
        ru: "В мае 1926 года, когда премьером в очередной раз стал Винценты Витос, Пилсудский решил действовать."
      - pl: " 12 maja wyruszył na czele wiernych mu oddziałów na Warszawę."
        ru: "12 мая он выступил на Варшаву во главе верных ему частей."
      - pl: " Na moście Poniatowskiego spotkał się z prezydentem Wojciechowskim, swoim dawnym przyjacielem, który zażądał, żeby podporządkował się prawu."
        ru: "На мосту Понятовского он встретился с президентом Войцеховским, своим давним другом, который потребовал, чтобы он подчинился закону."
