  - clean: "Przez trzy dni na ulicach Warszawy żołnierze polscy strzelali do siebie nawzajem. Zginęło prawie czterysta osób, wśród nich wielu przypadkowych cywilów. Rozstrzygające okazało się poparcie kolejarzy, związanych z PPS, którzy nie dopuścili do stolicy pociągów z oddziałami wiernymi rządowi. Rząd Witosa podał się do dymisji, a prezydent Wojciechowski ustąpił ze stanowiska. Zamach majowy był dla wielu Polaków szokiem, bo człowiek, który był symbolem niepodległości, sięgnął po władzę siłą. Inni witali go z ulgą, bo mieli nadzieję, że Marszałek zaprowadzi w państwie porządek. Wśród tych, którzy poparli zamach, było też wielu socjalistów i komunistów."
    draft: true
    chunks:
      - pl: "Przez trzy dni na ulicach Warszawy żołnierze polscy strzelali do siebie nawzajem."
        ru: "Три дня на улицах Варшавы польские солдаты стреляли друг в друга."
      - pl: " Zginęło prawie czterysta osób, wśród nich wielu przypadkowych cywilów."
        ru: "Погибли почти четыреста человек, среди них много случайных мирных жителей."
      - pl: " Rozstrzygające okazało się poparcie kolejarzy, związanych z PPS, którzy nie dopuścili do stolicy pociągów z oddziałami wiernymi rządowi."
        ru: "Решающей оказалась поддержка железнодорожников, связанных с ППС, которые не пропустили в столицу поезда с верными правительству частями."
        note: "kolejarz — железнодорожник"
      - pl: " Rząd Witosa podał się do dymisji, a prezydent Wojciechowski ustąpił ze stanowiska."
        ru: "Правительство Витоса ушло в отставку, а президент Войцеховский оставил свой пост."
        note: "ustąpić — уйти (с поста)"
      - pl: " Zamach majowy był dla wielu Polaków szokiem, bo człowiek, który był symbolem niepodległości, sięgnął po władzę siłą."
        ru: "Майский переворот стал для многих поляков шоком, потому что человек, бывший символом независимости, взял власть силой."
        note: "zamach — переворот; покушение"
      - pl: " Inni witali go z ulgą, bo mieli nadzieję, że Marszałek zaprowadzi w państwie porządek."
