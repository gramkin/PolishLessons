paragraphs:
  - clean: "Okres między dwiema wojnami światowymi Polacy nazywają dwudziestoleciem międzywojennym, a państwo z tamtych lat Drugą Rzecząpospolitą. Nazwa ta podkreślała, że nowa Polska jest kontynuacją dawnej Rzeczypospolitej, zniszczonej przez rozbiory. W marcu 1921 roku Sejm Ustawodawczy uchwalił konstytucję, wzorowaną w dużej mierze na konstytucji francuskiej. Najważniejszą władzę miał w niej parlament, złożony z Sejmu i Senatu, a prezydent, wybierany przez obie izby, miał niewiele uprawnień. Posłowie endecji świadomie ograniczyli władzę prezydenta, bo spodziewali się, że zostanie nim Piłsudski."
    draft: true
    chunks:
      - pl: "Okres między dwiema wojnami światowymi Polacy nazywają dwudziestoleciem międzywojennym, a państwo z tamtych lat Drugą Rzecząpospolitą."
        ru: "Период между двумя мировыми войнами поляки называют межвоенным двадцатилетием, а государство тех лет — Второй Речью Посполитой."
        note: "dwudziestolecie — двадцатилетие"
      - pl: " Nazwa ta podkreślała, że nowa Polska jest kontynuacją dawnej Rzeczypospolitej, zniszczonej przez rozbiory."
        ru: "Это название подчёркивало, что новая Польша — продолжение прежней Речи Посполитой, уничтоженной разделами."
      - pl: " W marcu 1921 roku Sejm Ustawodawczy uchwalił konstytucję, wzorowaną w dużej mierze na konstytucji francuskiej."
        ru: "В марте 1921 года Учредительный сейм принял конституцию, во многом составленную по образцу французской."
        note: "wzorowany — созданный по образцу"
      - pl: " Najważniejszą władzę miał w niej parlament, złożony z Sejmu i Senatu, a prezydent, wybierany przez obie izby, miał niewiele uprawnień."
        ru: "Главная власть по ней принадлежала парламенту, состоявшему из Сейма и Сената, а президент, избиравшийся обеими палатами, имел мало полномочий."
        note: "uprawnienie — полномочие"
      - pl: " Posłowie endecji świadomie ograniczyli władzę prezydenta, bo spodziewali się, że zostanie nim Piłsudski."
        ru: "Депутаты-эндеки сознательно ограничили власть президента, потому что ожидали, что им станет Пилсудский."
