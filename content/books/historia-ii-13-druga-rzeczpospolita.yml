  - clean: "Konstytucja marcowa była bardzo demokratyczna. Gwarantowała równość wszystkich obywateli wobec prawa, wolność słowa, wyznania i zgromadzeń oraz prawa mniejszości narodowych. W praktyce okazało się jednak, że system parlamentarny działa w Polsce z trudem. W sejmie zasiadało kilkanaście partii, które rzadko potrafiły się porozumieć. Rządy zmieniały się bardzo często, a w ciągu pierwszych siedmiu lat niepodległości było ich kilkanaście. Wielu Polaków zaczęło myśleć, że państwu potrzebna jest silniejsza władza."
    draft: true
    chunks:
      - pl: "Konstytucja marcowa była bardzo demokratyczna."
        ru: "Мартовская конституция была очень демократичной."
      - pl: " Gwarantowała równość wszystkich obywateli wobec prawa, wolność słowa, wyznania i zgromadzeń oraz prawa mniejszości narodowych."
        ru: "Она гарантировала равенство всех граждан перед законом, свободу слова, вероисповедания и собраний, а также права национальных меньшинств."
        note: "zgromadzenie — собрание"
      - pl: " W praktyce okazało się jednak, że system parlamentarny działa w Polsce z trudem."
        ru: "Однако на практике оказалось, что парламентская система работает в Польше с трудом."
      - pl: " W sejmie zasiadało kilkanaście partii, które rzadko potrafiły się porozumieć."
        ru: "В сейме заседали больше десятка партий, которые редко умели договориться."
      - pl: " Rządy zmieniały się bardzo często, a w ciągu pierwszych siedmiu lat niepodległości było ich kilkanaście."
        ru: "Правительства менялись очень часто, и за первые семь лет независимости их было больше десятка."
      - pl: " Wielu Polaków zaczęło myśleć, że państwu potrzebna jest silniejsza władza."
        ru: "Многие поляки начали думать, что государству нужна более сильная власть."
