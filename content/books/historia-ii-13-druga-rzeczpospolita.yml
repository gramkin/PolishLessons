  - clean: "Piłsudski przez kilka lat pozostawał poza polityką i mieszkał w dworku w Sulejówku pod Warszawą. Krytykował jednak ostro partie polityczne, które jego zdaniem dbały tylko o własne interesy i niszczyły państwo. W maju 1926 roku, gdy premierem po raz kolejny został Wincenty Witos, Piłsudski postanowił działać. 12 maja wyruszył na czele wiernych mu oddziałów na Warszawę. Na moście Poniatowskiego spotkał się z prezydentem Wojciechowskim, swoim dawnym przyjacielem, który zażądał, żeby podporządkował się prawu. Rozmowa nic nie dała i rozpoczęły się walki."
