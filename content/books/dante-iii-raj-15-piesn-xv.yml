  - clean: "Lecz moc i wola nasza, jako wiecie,\nNierównym lotem buja w naszym świecie;\nBędąc śmiertelnym, tę nierówność czuję\nSercem, gdy usta nie dosyć wymowne,\nZa twe ojcowskie przyjęcie dziękuję.\nWzbogacający to cacko kosztowne,\nPowiedz mi, błagam, żyjący Topazie,\nJakim na ziemi zwano cię imieniem?»"
    verse: true
    chunks:
      - pl: "Lecz moc i wola nasza, jako wiecie,"
        ru: "Но наша сила и воля, как вы знаете,"
      - pl: "\nNierównym lotem buja w naszym świecie;"
        ru: "неравным полётом парят в нашем мире;"
      - pl: "\nBędąc śmiertelnym, tę nierówność czuję"
        ru: "будучи смертным, я чувствую это неравенство,"
      - pl: "\nSercem, gdy usta nie dosyć wymowne,"
        ru: "сердцем, так как уста недостаточно красноречивы,"
      - pl: "\nZa twe ojcowskie przyjęcie dziękuję."
        ru: "благодарю за твой отеческий приём."
