      - pl: "\nKtóra mi słodkie zaostrza łaknienie,"
        ru: "что обостряет мне сладкий голод,"
      - pl: "\nPoczuła całe swe zadowolenie,"
        ru: "почувствовала всё своё удовлетворение,"
      - pl: "\nObjaw twą wolę, śmiało wciel ją w słowo,"
        ru: "объяви свою волю, смело воплоти её в слово,"
      - pl: "\nJuż mam dla ciebie odpowiedź gotową»."
        ru: "у меня уже готов для тебя ответ»."
    words: { "miłość": milosc, "ciągłym": ciagly, "Poczuła": poczuc, "zadowolenie": zadowolic, "słowo": slowo, "odpowiedź": odpowiedz }
  - clean: "Do Beatrycze potem wzrok zwróciłem,\nCo mnie słyszała wpierw, nim przemówiłem;\nUśmiech jej w takiej świecił aureoli,\nŻe podniósł w górę skrzydło mojej woli.\nWięc rzekłem: «Miłość i wiedza od chwili,\nKiedyście pierwszą równość tu uczcili,\nW każdym z was w dziwnej stoją równowadze;\nBo w słońcu, które na was blask swój zlewa,\nŚwiatłem oświeca, a ciepłem zagrzewa,\nTak w Nim podobne są te obie władze,\nŻe przy nich wszystkie ziemskie podobieństwa\nMiałyby jeszcze pozór przeciwieństwa."
    verse: true
    chunks:
      - pl: "Do Beatrycze potem wzrok zwróciłem,"
        ru: "Потом я обратил взгляд к Беатриче,"
      - pl: "\nCo mnie słyszała wpierw, nim przemówiłem;"
        ru: "что слышала меня прежде, чем я заговорил;"
      - pl: "\nUśmiech jej w takiej świecił aureoli,"
        ru: "её улыбка светилась в таком ореоле,"
      - pl: "\nŻe podniósł w górę skrzydło mojej woli."
        ru: "что подняла вверх крыло моей воли."
      - pl: "\nWięc rzekłem: «Miłość i wiedza od chwili,"
        ru: "И я сказал: «Любовь и знание с той минуты,"
      - pl: "\nKiedyście pierwszą równość tu uczcili,"
        ru: "как вы почтили здесь первое равенство,"
        note: "Бога"
      - pl: "\nW każdym z was w dziwnej stoją równowadze;"
        ru: "стоят в каждом из вас в удивительном равновесии;"
      - pl: "\nBo w słońcu, które na was blask swój zlewa,"
        ru: "ибо в солнце, что изливает на вас свой блеск,"
      - pl: "\nŚwiatłem oświeca, a ciepłem zagrzewa,"
        ru: "светом освещает, а теплом согревает,"
      - pl: "\nTak w Nim podobne są te obie władze,"
        ru: "так в Нём подобны эти обе силы,"
      - pl: "\nŻe przy nich wszystkie ziemskie podobieństwa"
        ru: "что рядом с ними все земные подобия"
      - pl: "\nMiałyby jeszcze pozór przeciwieństwa."
        ru: "имели бы ещё вид противоположности."
