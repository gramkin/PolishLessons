level: B2
paragraphs:
  - clean: "5. Na Marsie (Ciąg dalszy). Kaciagwidy pochwała dawnych dobrych czasów Florencji."
    chunks:
      - pl: "5. Na Marsie (Ciąg dalszy). Kaciagwidy pochwała dawnych dobrych czasów Florencji."
        ru: "5. На Марсе (продолжение). Похвала Каччагвиды добрым старым временам Флоренции."
        note: "Kaciagwida — Каччагвида, прапрадед Данте"
    words: { "Ciąg": ciag, "dalszy": daleki, "dawnych": dawny, "czasów": czas }
  - clean: "Wola, przez którą tchnie zawsze życzliwość\nI miłość, której natchnienia są prawe,\nJak przez złą wolę objawia się chciwość,\nTej liry dźwięczną uciszyła wrzawę,\nAby spoczęły święte struny krzyża,\nKtórych strój mistrz ich podnosi, to zniża."
    verse: true
    chunks:
      - pl: "Wola, przez którą tchnie zawsze życzliwość"
        ru: "Воля, через которую всегда дышит благосклонность"
      - pl: "\nI miłość, której natchnienia są prawe,"
        ru: "и любовь, чьи вдохновения праведны,"
      - pl: "\nJak przez złą wolę objawia się chciwość,"
        ru: "как через злую волю проявляется алчность,"
      - pl: "\nTej liry dźwięczną uciszyła wrzawę,"
        ru: "утихомирила звонкий шум этой лиры,"
      - pl: "\nAby spoczęły święte struny krzyża,"
        ru: "чтобы смолкли святые струны креста,"
      - pl: "\nKtórych strój mistrz ich podnosi, to zniża."
        ru: "строй которых их мастер то поднимает, то понижает."
        note: "strój — строй (музыкальный)"
    words: { "uciszyła": uciszyc, "spoczęły": spoczac, "krzyża": krzyz, "strój": stroj, "mistrz": mistrz, "podnosi": podnosic }
  - clean: "Mogłaż być głuchą takich istot rzesza\nGodziwym prośbom? Kiedy dla zachęty\nAbym ją prosił, przerwała śpiew święty.\nDowód, dlaczego żali się bez końca\nKto z żądz doczesnych skrę znikomą skrzesza,\nA taką miłość od siebie odtrąca."
    verse: true
    chunks:
      - pl: "Mogłaż być głuchą takich istot rzesza"
        ru: "Могло ли множество таких существ быть глухо"
      - pl: "\nGodziwym prośbom? Kiedy dla zachęty"
        ru: "к достойным просьбам? Когда, для поощрения,"
      - pl: "\nAbym ją prosił, przerwała śpiew święty."
        ru: "чтобы я его просил, прервало святое пение."
        note: "zachęta — поощрение"
      - pl: "\nDowód, dlaczego żali się bez końca"
        ru: "Доказательство, почему без конца сетует"
      - pl: "\nKto z żądz doczesnych skrę znikomą skrzesza,"
        ru: "тот, кто высекает мимолётную искру из земных желаний,"
        note: "skrzesać — высечь"
      - pl: "\nA taką miłość od siebie odtrąca."
        ru: "а такую любовь от себя отталкивает."
    words: { "głuchą": gluchy, "istot": istota, "prośbom": prosba, "przerwała": przerwac, "święty": swiety, "Dowód": dowod }
  - clean: "Jak nocą w jasnej powietrza przeźroczy,\nSzybko lecące światło meteoru,\nRażąc nam dotąd obojętne oczy,\nZdaje się gwiazdą, która miejsce zmienia,\nPrócz że z tej strony, skąd się zapłomienia\nI gaśnie, światło nie traci promienia;\nTak z tej niebieskiej sfery gwiazdozbioru,\nZ prawego krańca prawie do stóp krzyża,\nTrzęsąc iskrami biegła gwiazda chyża."
    verse: true
    chunks:
      - pl: "Jak nocą w jasnej powietrza przeźroczy,"
        ru: "Как ночью в ясной прозрачности воздуха"
      - pl: "\nSzybko lecące światło meteoru,"
        ru: "быстро летящий свет метеора,"
      - pl: "\nRażąc nam dotąd obojętne oczy,"
        ru: "поражая доселе безразличные глаза,"
      - pl: "\nZdaje się gwiazdą, która miejsce zmienia,"
        ru: "кажется звездой, что меняет место,"
      - pl: "\nPrócz że z tej strony, skąd się zapłomienia"
        ru: "только с той стороны, откуда вспыхивает"
      - pl: "\nI gaśnie, światło nie traci promienia;"
        ru: "и гаснет, свет не теряет луча;"
      - pl: "\nTak z tej niebieskiej sfery gwiazdozbioru,"
        ru: "так из этой небесной сферы созвездия,"
      - pl: "\nZ prawego krańca prawie do stóp krzyża,"
        ru: "с правого конца почти до подножия креста,"
      - pl: "\nTrzęsąc iskrami biegła gwiazda chyża."
        ru: "стряхивая искры, бежала быстрая звезда."
    words: { "dotąd": dotad, "obojętne": obojetny, "promienia": promien, "niebieskiej": niebieski, "prawego": prawy, "Trzęsąc": trzasc }
  - clean: "Brylant ze swojej nie zerwał się nici,\nŚliznąc się tylko smugiem promienistym,\nBłyszczał jak ogień w alabastrze czystym.\nGdy wierzyć Muzie, jaką świat się szczyci,\nNie mniej pobożnie twój cień, Anchizesie,\nSpotykał syna w elizejskim lesie:\n«O! Pełneś łaski Bogów, dziecię moje,\nKomuż jak tobie niebieskie pokoje\nAż po dwa razy rozwarły podwoje!»"
    verse: true
    chunks:
      - pl: "Brylant ze swojej nie zerwał się nici,"
        ru: "Бриллиант не сорвался со своей нити,"
      - pl: "\nŚliznąc się tylko smugiem promienistym,"
        ru: "скользнув лишь лучистой полосой,"
      - pl: "\nBłyszczał jak ogień w alabastrze czystym."
        ru: "он сверкал, как огонь в чистом алебастре."
      - pl: "\nGdy wierzyć Muzie, jaką świat się szczyci,"
        ru: "Если верить Музе, которой гордится мир,"
        note: "Вергилию"
      - pl: "\nNie mniej pobożnie twój cień, Anchizesie,"
        ru: "не менее благочестиво твоя тень, Анхиз,"
      - pl: "\nSpotykał syna w elizejskim lesie:"
        ru: "встречала сына в Елисейском лесу:"
      - pl: "\n«O! Pełneś łaski Bogów, dziecię moje,"
        ru: "«О! ты полон милости богов, дитя моё,"
      - pl: "\nKomuż jak tobie niebieskie pokoje"
        ru: "кому, как тебе, небесные чертоги"
        note: "у Данте — по-латыни"
      - pl: "\nAż po dwa razy rozwarły podwoje!»"
        ru: "дважды раскрыли врата!»"
        note: "живым — и после смерти"
    words: { "zerwał": zerwac, "nici": nic-2, "Błyszczał": blyszczec, "cień": cien, "Spotykał": spotykac, "lesie": las }
  - clean: "Tak rzekła światłość; pełen cześci dla niej\nZ schylonym czołem stałem zadziwiony,\nPotem zwróciłem wzrok do mojej Pani,\nPełen podziwu z tej i z drugiej strony.\nUśmiech promienny jako słońce w maju\nBłysnął w jej oczach blaskami takimi,\nŻe ja myślałem oglądać moimi\nDno mojej łaski i mojego raju."
    verse: true
    chunks:
      - pl: "Tak rzekła światłość; pełen cześci dla niej"
        ru: "Так сказал свет; полный почтения к нему,"
      - pl: "\nZ schylonym czołem stałem zadziwiony,"
        ru: "я стоял, склонив чело, удивлённый,"
      - pl: "\nPotem zwróciłem wzrok do mojej Pani,"
        ru: "потом обратил взгляд к моей Госпоже,"
      - pl: "\nPełen podziwu z tej i z drugiej strony."
        ru: "полный изумления с той и с другой стороны."
      - pl: "\nUśmiech promienny jako słońce w maju"
        ru: "Лучистая, как солнце в мае, улыбка"
      - pl: "\nBłysnął w jej oczach blaskami takimi,"
        ru: "блеснула в её глазах такими блесками,"
      - pl: "\nŻe ja myślałem oglądać moimi"
        ru: "что я думал увидеть своими глазами"
      - pl: "\nDno mojej łaski i mojego raju."
        ru: "дно своей милости и своего рая."
    words: { "rzekła": rzec, "zwróciłem": zwrocic, "wzrok": wzrok, "Uśmiech": usmiech, "blaskami": blask, "raju": raj }
  - clean: "Potem duch słodki dla ucha i oka\nMówił przeze mnie niepojęte rzeczy;\nTreść jego mowy tak była głęboka.\nOn nie z rozmysłu, aby mówić ciemno,\nLecz z konieczności snadź je krył przede mną,\nBo wyższe były nad rozum człowieczy."
    verse: true
    chunks:
      - pl: "Potem duch słodki dla ucha i oka"
        ru: "Потом дух, сладкий для уха и глаза,"
      - pl: "\nMówił przeze mnie niepojęte rzeczy;"
        ru: "говорил непостижимые для меня вещи;"
        note: "przeze mnie — здесь «для меня»"
      - pl: "\nTreść jego mowy tak była głęboka."
        ru: "так глубоко было содержание его речи."
      - pl: "\nOn nie z rozmysłu, aby mówić ciemno,"
        ru: "Он не нарочно, чтобы говорить темно,"
      - pl: "\nLecz z konieczności snadź je krył przede mną,"
        ru: "а, видно, по необходимости скрывал их от меня,"
      - pl: "\nBo wyższe były nad rozum człowieczy."
        ru: "ибо они были выше человеческого разума."
    words: { "słodki": slodki, "mowy": mowa, "głęboka": gleboki, "konieczności": koniecznosc, "krył": kryc, "rozum": rozum }
  - clean: "Lecz gdy łuk strunę odpuścił zapału,\nBy lot słów zniżyć do celu pomału,\nW jaki wbić wolno strzałę rozumową,\nPierwsze, com pojął, takie było słowo:\n«Chwała niech będzie w Trójcy Jedynemu,\nCo tak życzliwy nasieniu mojemu»."
    verse: true
    chunks:
      - pl: "Lecz gdy łuk strunę odpuścił zapału,"
        ru: "Но когда лук пыла ослабил тетиву,"
      - pl: "\nBy lot słów zniżyć do celu pomału,"
        ru: "чтобы постепенно снизить полёт слов к цели,"
      - pl: "\nW jaki wbić wolno strzałę rozumową,"
        ru: "в которую позволено вонзить разумную стрелу,"
      - pl: "\nPierwsze, com pojął, takie było słowo:"
        ru: "первое, что я понял, было такое слово:"
      - pl: "\n«Chwała niech będzie w Trójcy Jedynemu,"
        ru: "«Слава да будет Единому в Троице,"
      - pl: "\nCo tak życzliwy nasieniu mojemu»."
        ru: "что так благосклонен к моему семени»."
    words: { "odpuścił": odpuscic, "pomału": pomalu, "wbić": wbic, "strzałę": strzala, "Chwała": chwala, "nasieniu": nasienie }
  - clean: "I dodał: «Długą i słodką tęsknotę,\nJakąm zaczerpnął, czytając z zapałem\nW tej wielkiej księdze, gdzie czarno na białem\nGłoska swej treści nie zmieni na jotę,\nTyś mi ugasił w tym świetle, skąd mówię,\nZa co dziękuję świętej białogłowie,\nKtóra cię z grzechu wyzwoliwszy sidła,\nAbyś tu wzleciał, przypięła ci skrzydła."
    verse: true
    chunks:
      - pl: "I dodał: «Długą i słodką tęsknotę,"
        ru: "И добавил: «Долгую и сладкую тоску,"
      - pl: "\nJakąm zaczerpnął, czytając z zapałem"
        ru: "что я почерпнул, читая с жаром"
      - pl: "\nW tej wielkiej księdze, gdzie czarno na białem"
        ru: "в той великой книге, где чёрным по белому"
      - pl: "\nGłoska swej treści nie zmieni na jotę,"
        ru: "буква не изменит своего содержания ни на йоту,"
        note: "книга предопределения"
      - pl: "\nTyś mi ugasił w tym świetle, skąd mówię,"
        ru: "ты утолил мне в этом свете, откуда я говорю,"
      - pl: "\nZa co dziękuję świętej białogłowie,"
        ru: "за что я благодарю святую жену,"
      - pl: "\nKtóra cię z grzechu wyzwoliwszy sidła,"
        ru: "что, освободив тебя из сети греха,"
      - pl: "\nAbyś tu wzleciał, przypięła ci skrzydła."
        ru: "прицепила тебе крылья, чтобы ты взлетел сюда."
    words: { "dodał": dodac, "Długą": dlugi, "czytając": czytac, "świetle": swiatlo, "grzechu": grzech, "skrzydła": skrzydlo }
  - clean: "Wierzysz, że twoja myśl do mnie przychodzi\nOd arcymyśli i błąd cię nie zwodzi,\nJak się z jedności pięć i sześć rozwija.\nPrzeto nie pytasz, kto jestem? Skąd płonie\nBlask mój weselej w tym wesołym gronie?\nTak jest, jak wierzysz: tu wielcy i mali\nPatrzą w zwierciadło, gdzie jak w szybie fali,\nNim co pomyślisz, twa się myśl odbija."
    verse: true
    chunks:
      - pl: "Wierzysz, że twoja myśl do mnie przychodzi"
        ru: "Ты веришь, что твоя мысль приходит ко мне"
      - pl: "\nOd arcymyśli i błąd cię nie zwodzi,"
        ru: "от высшей мысли, и ошибка тебя не обманывает,"
      - pl: "\nJak się z jedności pięć i sześć rozwija."
        ru: "как из единицы развиваются пять и шесть."
      - pl: "\nPrzeto nie pytasz, kto jestem? Skąd płonie"
        ru: "Поэтому ты не спрашиваешь: кто я? Почему"
      - pl: "\nBlask mój weselej w tym wesołym gronie?"
        ru: "мой блеск пылает веселее в этом весёлом кругу?"
      - pl: "\nTak jest, jak wierzysz: tu wielcy i mali"
        ru: "Так и есть, как веришь: здесь великие и малые"
      - pl: "\nPatrzą w zwierciadło, gdzie jak w szybie fali,"
        ru: "смотрят в зеркало, где, как в стекле волны,"
      - pl: "\nNim co pomyślisz, twa się myśl odbija."
        ru: "прежде чем ты что-то подумаешь, отражается твоя мысль."
    words: { "jedności": jednosc, "płonie": plonac, "gronie": grono, "szybie": szyba, "fali": fala, "odbija": odbijac }
  - clean: "Lecz żeby miłość, w którą czujne oko\nZ ciągłym czuwaniem zatapiam głęboko,\nKtóra mi słodkie zaostrza łaknienie,\nPoczuła całe swe zadowolenie,\nObjaw twą wolę, śmiało wciel ją w słowo,\nJuż mam dla ciebie odpowiedź gotową»."
