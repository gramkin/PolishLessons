  - clean: "Efekty były widoczne bardzo szybko. W ciągu kilku tygodni sklepy zapełniły się towarami, a na ulicach pojawiły się tysiące straganów, z których ludzie sprzedawali wszystko, od bananów po dżinsy. Inflacja zaczęła spadać, a złoty stał się prawdziwą walutą. Ceną reform było jednak bezrobocie, którego w socjalizmie oficjalnie nie było. Upadały wielkie zakłady, a w niektórych regionach, zwłaszcza tam, gdzie zlikwidowano państwowe gospodarstwa rolne, pracy nie miała prawie połowa dorosłych. Wielu ludzi czuło się przegranymi transformacji, a spór o jej ocenę trwa do dziś."
    draft: true
    chunks:
      - pl: "Efekty były widoczne bardzo szybko."
        ru: "Результаты были видны очень быстро."
      - pl: " W ciągu kilku tygodni sklepy zapełniły się towarami, a na ulicach pojawiły się tysiące straganów, z których ludzie sprzedawali wszystko, od bananów po dżinsy."
        ru: "За несколько недель магазины наполнились товарами, а на улицах появились тысячи прилавков, с которых люди продавали всё — от бананов до джинсов."
        note: "stragan — прилавок, ларёк"
      - pl: " Inflacja zaczęła spadać, a złoty stał się prawdziwą walutą."
        ru: "Инфляция начала снижаться, а злотый стал настоящей валютой."
      - pl: " Ceną reform było jednak bezrobocie, którego w socjalizmie oficjalnie nie było."
        ru: "Однако ценой реформ стала безработица, которой при социализме официально не было."
      - pl: " Upadały wielkie zakłady, a w niektórych regionach, zwłaszcza tam, gdzie zlikwidowano państwowe gospodarstwa rolne, pracy nie miała prawie połowa dorosłych."
        ru: "Разорялись крупные предприятия, а в некоторых районах, особенно там, где ликвидировали государственные сельхозпредприятия, работы не было почти у половины взрослых."
      - pl: " Wielu ludzi czuło się przegranymi transformacji, a spór o jej ocenę trwa do dziś."
        ru: "Многие люди чувствовали себя проигравшими от трансформации, и спор о её оценке продолжается до сих пор."
        note: "transformacja — трансформация, преобразование"
    words: { "Efekty": efekt, "widoczne": widoczny, "bananów": banan, "oficjalnie": oficjalnie, "zakłady": zaklad, "dorosłych": dorosly, "ocenę": ocena }
  - clean: "W 1990 roku generał Jaruzelski zgodził się skrócić swoją kadencję i odbyły się pierwsze powszechne wybory prezydenckie. Kandydowali w nich Wałęsa i Mazowiecki, dawni sojusznicy, którzy stali się rywalami. Ku zaskoczeniu wszystkich do drugiej tury przeszedł nie Mazowiecki, ale nieznany biznesmen z Kanady Stan Tymiński. W grudniu 1990 roku prezydentem został Lech Wałęsa."
    draft: true
    chunks:
      - pl: "W 1990 roku generał Jaruzelski zgodził się skrócić swoją kadencję i odbyły się pierwsze powszechne wybory prezydenckie."
        ru: "В 1990 году генерал Ярузельский согласился сократить срок своих полномочий, и прошли первые всеобщие президентские выборы."
        note: "kadencja — срок полномочий"
      - pl: " Kandydowali w nich Wałęsa i Mazowiecki, dawni sojusznicy, którzy stali się rywalami."
        ru: "В них участвовали Валенса и Мазовецкий, бывшие союзники, ставшие соперниками."
      - pl: " Ku zaskoczeniu wszystkich do drugiej tury przeszedł nie Mazowiecki, ale nieznany biznesmen z Kanady Stan Tymiński."
        ru: "Ко всеобщему удивлению во второй тур вышел не Мазовецкий, а никому не известный бизнесмен из Канады Стан Тыминьский."
        note: "tura — тур"
      - pl: " W grudniu 1990 roku prezydentem został Lech Wałęsa."
        ru: "В декабре 1990 года президентом стал Лех Валенса."
    words: { "odbyły": odbyc, "powszechne": powszechny, "sojusznicy": sojusznik, "Ku": ku, "biznesmen": biznesmen, "grudniu": grudzien }
  - clean: "Kilkanaście dni później w Zamku Królewskim w Warszawie ostatni prezydent Rzeczypospolitej na uchodźstwie, Ryszard Kaczorowski, przekazał Wałęsie insygnia władzy państwowej, które przechowywano w Londynie od 1939 roku. Gest ten oznaczał, że wolna Polska uważa się za kontynuację Drugiej Rzeczypospolitej, a nie Polski Ludowej. Z nazwy państwa usunięto słowo „Ludowa”, a do godła wrócił orzeł w koronie, którą komuniści mu odebrali. W 1991 roku odbyły się pierwsze całkowicie wolne wybory do sejmu. Weszło do niego prawie trzydzieści partii i ugrupowań, a rządy zmieniały się często, jak w pierwszych latach Drugiej Rzeczypospolitej."
    draft: true
    chunks:
      - pl: "Kilkanaście dni później w Zamku Królewskim w Warszawie ostatni prezydent Rzeczypospolitej na uchodźstwie, Ryszard Kaczorowski, przekazał Wałęsie insygnia władzy państwowej, które przechowywano w Londynie od 1939 roku."
        ru: "Почти через две недели в Королевском замке в Варшаве последний президент Речи Посполитой в изгнании Рышард Качоровский передал Валенсе знаки государственной власти, которые хранились в Лондоне с 1939 года."
      - pl: " Gest ten oznaczał, że wolna Polska uważa się za kontynuację Drugiej Rzeczypospolitej, a nie Polski Ludowej."
        ru: "Этот жест означал, что свободная Польша считает себя продолжением Второй Речи Посполитой, а не Народной Польши."
      - pl: " Z nazwy państwa usunięto słowo „Ludowa”, a do godła wrócił orzeł w koronie, którą komuniści mu odebrali."
        ru: "Из названия государства убрали слово «Народная», а в герб вернулся орёл в короне, которую у него отняли коммунисты."
        note: "godło — герб"
      - pl: " W 1991 roku odbyły się pierwsze całkowicie wolne wybory do sejmu."
        ru: "В 1991 году прошли первые полностью свободные выборы в сейм."
      - pl: " Weszło do niego prawie trzydzieści partii i ugrupowań, a rządy zmieniały się często, jak w pierwszych latach Drugiej Rzeczypospolitej."
        ru: "В него прошли почти тридцать партий и объединений, а правительства менялись часто, как в первые годы Второй Речи Посполитой."
    words: { "odbyły": odbyc, "Kilkanaście": kilkanascie, "Gest": gest, "nazwy": nazwa, "orzeł": orzel, "koronie": korona, "trzydzieści": trzydziesci, "partii": partia }
  - clean: "Demokracja oznaczała, że władza może się zmieniać w wyniku wyborów. W 1993 roku wybory wygrała partia wywodząca się z dawnej partii komunistycznej, a w 1995 roku jej kandydat Aleksander Kwaśniewski pokonał Wałęsę w wyborach prezydenckich. Dla wielu działaczy Solidarności był to szok, ale nowa władza nie próbowała wracać do komunizmu i kontynuowała reformy. Od tego czasu władza w Polsce wielokrotnie przechodziła w drodze wyborów z rąk jednych partii do drugich."
    draft: true
    chunks:
      - pl: "Demokracja oznaczała, że władza może się zmieniać w wyniku wyborów."
        ru: "Демократия означала, что власть может меняться в результате выборов."
      - pl: " W 1993 roku wybory wygrała partia wywodząca się z dawnej partii komunistycznej, a w 1995 roku jej kandydat Aleksander Kwaśniewski pokonał Wałęsę w wyborach prezydenckich."
        ru: "В 1993 году выборы выиграла партия, происходившая из бывшей коммунистической партии, а в 1995 году её кандидат Александр Квасьневский победил Валенсу на президентских выборах."
        note: "wywodzić się — происходить"
      - pl: " Dla wielu działaczy Solidarności był to szok, ale nowa władza nie próbowała wracać do komunizmu i kontynuowała reformy."
        ru: "Для многих деятелей «Солидарности» это был шок, но новая власть не пыталась вернуться к коммунизму и продолжила реформы."
      - pl: " Od tego czasu władza w Polsce wielokrotnie przechodziła w drodze wyborów z rąk jednych partii do drugich."
        ru: "С тех пор власть в Польше многократно переходила путём выборов от одних партий к другим."
    words: { "partii": partia, "Demokracja": demokracja, "partia": partia, "kandydat": kandydat, "szok": szok, "wielokrotnie": wielokrotnie }
  - clean: "W 1997 roku Polacy przyjęli w referendum nową konstytucję. Zaczyna się ona od słów, które łączą ludzi wierzących i niewierzących: obywateli, którzy wierzą w Boga jako źródło prawdy, sprawiedliwości, dobra i piękna, i tych, którzy nie podzielają tej wiary. Konstytucja gwarantuje wolność słowa, wyznania i zgromadzeń, niezależność sądów i prawa mniejszości narodowych. Powstał samorząd terytorialny, dzięki któremu mieszkańcy gmin i miast sami decydują o wielu sprawach lokalnych. Reforma samorządowa jest uważana za jedną z najbardziej udanych reform wolnej Polski."
    draft: true
    chunks:
      - pl: "W 1997 roku Polacy przyjęli w referendum nową konstytucję."
        ru: "В 1997 году поляки приняли на референдуме новую конституцию."
      - pl: " Zaczyna się ona od słów, które łączą ludzi wierzących i niewierzących: obywateli, którzy wierzą w Boga jako źródło prawdy, sprawiedliwości, dobra i piękna, i tych, którzy nie podzielają tej wiary."
        ru: "Она начинается со слов, которые объединяют верующих и неверующих: граждан, верующих в Бога как источник истины, справедливости, добра и красоты, и тех, кто не разделяет этой веры."
      - pl: " Konstytucja gwarantuje wolność słowa, wyznania i zgromadzeń, niezależność sądów i prawa mniejszości narodowych."
        ru: "Конституция гарантирует свободу слова, вероисповедания и собраний, независимость судов и права национальных меньшинств."
      - pl: " Powstał samorząd terytorialny, dzięki któremu mieszkańcy gmin i miast sami decydują o wielu sprawach lokalnych."
        ru: "Было создано территориальное самоуправление, благодаря которому жители гмин и городов сами решают многие местные вопросы."
        note: "samorząd terytorialny — местное самоуправление"
      - pl: " Reforma samorządowa jest uważana za jedną z najbardziej udanych reform wolnej Polski."
        ru: "Реформа самоуправления считается одной из самых удачных реформ свободной Польши."
    words: { "obywateli": obywatel, "gwarantuje": gwarantowac, "narodowych": narodowy, "Powstał": powstac, "mieszkańcy": mieszkaniec, "decydują": decydowac, "lokalnych": lokalny }
  - clean: "Wolna Polska musiała na nowo ułożyć stosunki z sąsiadami. W 1991 roku rozwiązano Układ Warszawski, a we wrześniu 1993 roku z Polski wyjechali ostatni żołnierze rosyjscy, którzy stacjonowali tu od wojny. Ze zjednoczonymi Niemcami Polska podpisała traktat graniczny, który ostatecznie potwierdził granicę na Odrze i Nysie, oraz traktat o dobrym sąsiedztwie. Niemcy stały się najważniejszym partnerem gospodarczym Polski."
    draft: true
    chunks:
      - pl: "Wolna Polska musiała na nowo ułożyć stosunki z sąsiadami."
        ru: "Свободной Польше нужно было заново выстроить отношения с соседями."
      - pl: " W 1991 roku rozwiązano Układ Warszawski, a we wrześniu 1993 roku z Polski wyjechali ostatni żołnierze rosyjscy, którzy stacjonowali tu od wojny."
        ru: "В 1991 году был распущен Варшавский договор, а в сентябре 1993 года из Польши уехали последние российские солдаты, стоявшие здесь со времён войны."
      - pl: " Ze zjednoczonymi Niemcami Polska podpisała traktat graniczny, który ostatecznie potwierdził granicę na Odrze i Nysie, oraz traktat o dobrym sąsiedztwie."
        ru: "С объединённой Германией Польша подписала пограничный договор, окончательно подтвердивший границу по Одре и Нисе, а также договор о добрососедстве."
        note: "sąsiedztwo — соседство"
      - pl: " Niemcy stały się najważniejszym partnerem gospodarczym Polski."
        ru: "Германия стала главным экономическим партнёром Польши."
    words: { "ułożyć": ulozyc, "stosunki": stosunek, "wrześniu": wrzesien, "rosyjscy": rosyjski, "zjednoczonymi": zjednoczyc, "ostatecznie": ostatecznie, "sąsiedztwie": sasiedztwo }
  - clean: "Polska poparła niepodległość Litwy, Białorusi i Ukrainy, zgodnie z ideami paryskiej „Kultury”. W grudniu 1991 roku jako pierwsze państwo na świecie uznała niepodległość Ukrainy. Zrezygnowała z wszelkich roszczeń do Wilna i Lwowa, a w zamian domagała się szacunku dla praw mieszkających tam Polaków. Najważniejszym celem polityki zagranicznej stało się jednak wejście do zachodnich wspólnot, które miały zagwarantować krajowi bezpieczeństwo i rozwój. Po doświadczeniach historii Polacy nie chcieli już nigdy zostać sami między Niemcami a Rosją."
    draft: true
    chunks:
      - pl: "Polska poparła niepodległość Litwy, Białorusi i Ukrainy, zgodnie z ideami paryskiej „Kultury”."
        ru: "Польша поддержала независимость Литвы, Белоруссии и Украины в соответствии с идеями парижской «Культуры»."
      - pl: " W grudniu 1991 roku jako pierwsze państwo na świecie uznała niepodległość Ukrainy."
        ru: "В декабре 1991 года она первой в мире признала независимость Украины."
      - pl: " Zrezygnowała z wszelkich roszczeń do Wilna i Lwowa, a w zamian domagała się szacunku dla praw mieszkających tam Polaków."
        ru: "Она отказалась от любых притязаний на Вильно и Львов, а взамен требовала уважения к правам живущих там поляков."
        note: "roszczenie — притязание"
      - pl: " Najważniejszym celem polityki zagranicznej stało się jednak wejście do zachodnich wspólnot, które miały zagwarantować krajowi bezpieczeństwo i rozwój."
        ru: "Однако главной целью внешней политики стало вступление в западные сообщества, которые должны были гарантировать стране безопасность и развитие."
      - pl: " Po doświadczeniach historii Polacy nie chcieli już nigdy zostać sami między Niemcami a Rosją."
        ru: "После уроков истории поляки больше никогда не хотели оставаться одни между Германией и Россией."
