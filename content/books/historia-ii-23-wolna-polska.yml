  - clean: "12 marca 1999 roku Polska, razem z Czechami i Węgrami, została członkiem Paktu Północnoatlantyckiego, czyli NATO. Znalazła się w sojuszu z najsilniejszymi państwami Zachodu, w którym atak na jednego członka uważa się za atak na wszystkich. Polscy żołnierze brali później udział w misjach sojuszniczych w Afganistanie i w Iraku."
