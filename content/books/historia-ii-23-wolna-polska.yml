  - clean: "Polska historia nie skończyła się w dniu, w którym napisano tę książkę. Pisze ją codziennie czterdzieści milionów ludzi w kraju i miliony Polaków rozsianych po całym świecie. Może któryś z czytelników tej książki pojedzie kiedyś do Krakowa, stanie na Wawelu, przejdzie się po odbudowanym Starym Mieście w Warszawie albo zapali znicz na Westerplatte. Wtedy przypomni sobie może kilka historii z tych stron i usłyszy, co mówią mu kamienie. Mickiewicz napisał na początku „Pana Tadeusza”, że ile ojczyznę trzeba cenić, dowie się tylko ten, kto ją stracił. Polacy tracili ją wiele razy, dlatego dobrze wiedzą, ile jest warta. Ojczyzna to bowiem nie tylko granice na mapie, ale przede wszystkim ludzie, język i pamięć. Koniec."
