  - clean: "Ta książka powstała dla czytelników, którzy uczą się polskiego, a zwłaszcza dla tych, którzy mówią po rosyjsku. Historia Polski i Rosji była przez stulecia splątana, pełna wojen, krzywd i wzajemnych uprzedzeń, ale także przyjaźni, wspólnej kultury i ludzi, którzy łączyli oba narody. Mickiewicz przyjaźnił się z Puszkinem, a polscy zesłańcy na Syberii zakładali tam szkoły i badali przyrodę. Zrozumienie cudzej historii nie oznacza przyjęcia cudzych racji, ale pozwala lepiej zrozumieć sąsiada."
