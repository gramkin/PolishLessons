  - clean: "Pięć lat później, 1 maja 2004 roku, Polska weszła do Unii Europejskiej. W referendum ponad trzy czwarte głosujących opowiedziało się za członkostwem. W nocy z 30 kwietnia na 1 maja na placach polskich miast odbywały się koncerty i pokazy sztucznych ogni. Wejście do Unii otworzyło przed Polakami europejski rynek pracy, a do kraju napłynęły pieniądze z funduszy unijnych. Za te pieniądze zbudowano tysiące kilometrów autostrad i dróg ekspresowych, oczyszczalnie ścieków, stadiony, mosty i muzea. Rolnicy, którzy na początku obawiali się Unii, stali się jej entuzjastami, gdy zaczęli otrzymywać dopłaty. Dla wielu Polaków wejście do Unii było symbolicznym powrotem do Europy, do której zawsze czuli, że należą."
    draft: true
    chunks:
      - pl: "Pięć lat później, 1 maja 2004 roku, Polska weszła do Unii Europejskiej."
        ru: "Пять лет спустя, 1 мая 2004 года, Польша вступила в Европейский союз."
      - pl: " W referendum ponad trzy czwarte głosujących opowiedziało się za członkostwem."
