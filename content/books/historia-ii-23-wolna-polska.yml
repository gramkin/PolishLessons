paragraphs:
  - clean: "Rząd Mazowieckiego przejął kraj w ruinie gospodarczej. Ceny rosły z tygodnia na tydzień, półki w sklepach były puste, a państwo miało ogromne długi zagraniczne. Minister finansów Leszek Balcerowicz przygotował program szybkiego przejścia od gospodarki planowej do rynkowej. 1 stycznia 1990 roku uwolniono większość cen, ograniczono dotacje dla nieefektywnych zakładów i pozwolono na swobodny handel. Plan nazwano terapią szokową."
    draft: true
    chunks:
      - pl: "Rząd Mazowieckiego przejął kraj w ruinie gospodarczej."
        ru: "Правительство Мазовецкого приняло страну в состоянии экономической разрухи."
      - pl: " Ceny rosły z tygodnia na tydzień, półki w sklepach były puste, a państwo miało ogromne długi zagraniczne."
        ru: "Цены росли от недели к неделе, полки в магазинах были пусты, а у государства были огромные внешние долги."
      - pl: " Minister finansów Leszek Balcerowicz przygotował program szybkiego przejścia od gospodarki planowej do rynkowej."
        ru: "Министр финансов Лешек Бальцерович подготовил программу быстрого перехода от плановой экономики к рыночной."
      - pl: " 1 stycznia 1990 roku uwolniono większość cen, ograniczono dotacje dla nieefektywnych zakładów i pozwolono na swobodny handel."
        ru: "1 января 1990 года отпустили большинство цен, сократили дотации неэффективным предприятиям и разрешили свободную торговлю."
        note: "dotacja — дотация"
      - pl: " Plan nazwano terapią szokową."
        ru: "План назвали шоковой терапией."
