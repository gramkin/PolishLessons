chapter: 8
chapterTitle: "Imieniny i gościnność"
chapterTitleRu: "Именины и гостеприимство"
level: B2
paragraphs:
  - clean: "Cudzoziemcy, którzy zamieszkają w Polsce, szybko odkrywają, że Polacy mają w roku dwa osobiste święta: urodziny i imieniny. Imieniny obchodzi się w dniu świętego, którego imię się nosi, a każdy dzień w kalendarzu ma kilka imion. Kalendarze ścienne, gazety i strony internetowe podają, kto danego dnia obchodzi imieniny, i wiele osób zagląda tam rano, żeby nie zapomnieć o życzeniach dla przyjaciół. Popularne imiona mają po kilka dni w roku, więc na przykład Janów jest w kalendarzu kilkanaście, a każdy Jan wybiera sobie jeden, zwykle ten najbliższy dnia urodzin albo najważniejszy."
    draft: true
    chunks:
      - pl: "Cudzoziemcy, którzy zamieszkają w Polsce, szybko odkrywają, że Polacy mają w roku dwa osobiste święta: urodziny i imieniny."
        ru: "Иностранцы, поселившиеся в Польше, быстро обнаруживают, что у поляков в году два личных праздника: день рождения и именины."
        note: "imieniny — именины"
      - pl: " Imieniny obchodzi się w dniu świętego, którego imię się nosi, a każdy dzień w kalendarzu ma kilka imion."
        ru: "Именины отмечают в день святого, чьё имя человек носит, а у каждого дня в календаре есть несколько имён."
      - pl: " Kalendarze ścienne, gazety i strony internetowe podają, kto danego dnia obchodzi imieniny, i wiele osób zagląda tam rano, żeby nie zapomnieć o życzeniach dla przyjaciół."
        ru: "Настенные календари, газеты и сайты сообщают, у кого в этот день именины, и многие заглядывают туда утром, чтобы не забыть поздравить друзей."
      - pl: " Popularne imiona mają po kilka dni w roku, więc na przykład Janów jest w kalendarzu kilkanaście, a każdy Jan wybiera sobie jeden, zwykle ten najbliższy dnia urodzin albo najważniejszy."
        ru: "У популярных имён по несколько дней в году, так что, например, Янов в календаре больше десятка, и каждый Ян выбирает себе один, обычно ближайший ко дню рождения или самый важный."
    words: { "zamieszkają": zamieszkac, "osobiste": osobisty, "urodziny": urodziny, "obchodzi": obchodzic, "świętego": swiety, "nosi": nosic, "kalendarzu": kalendarz, "gazety": gazeta, "internetowe": internetowy, "podają": podawac, "życzeniach": zyczenie, "przykład": przyklad, "kilkanaście": kilkanascie, "wybiera": wybierac, "zwykle": zwykle, "najbliższy": bliski, "urodzin": urodziny }
  - clean: "Dawniej imieniny były w Polsce dużo ważniejsze niż urodziny. Datę urodzin znała rodzina, ale imieniny były świętem publicznym: wiedzieli o nich sąsiedzi, koledzy z pracy i wszyscy znajomi, więc nie trzeba było nikogo zapraszać. W czasach Polski Ludowej w biurach i zakładach pracy świętowało się imieniny przy kawie, torcie i kieliszku, a solenizant dostawał od kolegów kwiaty i drobny prezent. Dziś młodsze pokolenie woli urodziny, ale w wielu rodzinach, zwłaszcza u babć i dziadków, imieniny wciąż są dniem, kiedy dom jest otwarty dla każdego, kto przyjdzie z życzeniami. W niektórych firmach nadal przynosi się w imieniny ciasto dla całego działu, a kto o tym zapomni, może liczyć na żartobliwe wyrzuty."
    draft: true
    chunks:
      - pl: "Dawniej imieniny były w Polsce dużo ważniejsze niż urodziny."
        ru: "Раньше именины в Польше были гораздо важнее дня рождения."
      - pl: " Datę urodzin znała rodzina, ale imieniny były świętem publicznym: wiedzieli o nich sąsiedzi, koledzy z pracy i wszyscy znajomi, więc nie trzeba było nikogo zapraszać."
        ru: "Дату рождения знала семья, а именины были праздником публичным: о них знали соседи, коллеги по работе и все знакомые, так что никого не нужно было приглашать."
      - pl: " W czasach Polski Ludowej w biurach i zakładach pracy świętowało się imieniny przy kawie, torcie i kieliszku, a solenizant dostawał od kolegów kwiaty i drobny prezent."
        ru: "Во времена Народной Польши в учреждениях и на предприятиях именины отмечали за кофе, тортом и рюмкой, а именинник получал от коллег цветы и небольшой подарок."
      - pl: " Dziś młodsze pokolenie woli urodziny, ale w wielu rodzinach, zwłaszcza u babć i dziadków, imieniny wciąż są dniem, kiedy dom jest otwarty dla każdego, kto przyjdzie z życzeniami."
        ru: "Сегодня молодое поколение предпочитает дни рождения, но во многих семьях, особенно у бабушек и дедушек, именины по-прежнему день, когда дом открыт для каждого, кто придёт с поздравлениями."
      - pl: " W niektórych firmach nadal przynosi się w imieniny ciasto dla całego działu, a kto o tym zapomni, może liczyć na żartobliwe wyrzuty."
        ru: "В некоторых фирмах до сих пор в именины приносят пирог для всего отдела, а тот, кто об этом забудет, может рассчитывать на шутливые упрёки."
        note: "wyrzut — упрёк"
    words: { "świętem": swieto, "publicznym": publiczny, "sąsiedzi": sasiad, "koledzy": kolega, "znajomi": znajomy, "zapraszać": zapraszac, "biurach": biuro, "zakładach": zaklad, "świętowało": swietowac, "kawie": kawa, "torcie": tort, "kieliszku": kieliszek, "dostawał": dostawac, "kolegów": kolega, "kwiaty": kwiat, "drobny": drobny, "prezent": prezent, "pokolenie": pokolenie, "zwłaszcza": zwlaszcza, "babć": babcia, "dziadków": dziadek, "życzeniami": zyczenie, "niektórych": niektory, "firmach": firma, "przynosi": przynosic, "ciasto": ciasto, "liczyć": liczyc, "wyrzuty": wyrzut }
  - clean: "Na urodzinach, imieninach, weselach i jubileuszach śpiewa się zawsze tę samą piosenkę: Sto lat. Jej słowa są bardzo proste: sto lat, sto lat, niech żyje, żyje nam, a potem jeszcze raz, i jeszcze raz niech żyje nam. Śpiewają ją goście przy stole, kibice na stadionie dla zwycięskiej drużyny, a nawet uczestnicy oficjalnych uroczystości dla jubilata, który skończył okrągłą liczbę lat. Pochodzenie piosenki nie jest dokładnie znane, ale w obecnej formie śpiewano ją już w okresie międzywojennym. Czasem goście dodają drugą zwrotkę, w której życzą solenizantowi zdrowia, szczęścia i miłości, a na koniec zawsze pada wesołe: a kto z nami nie wypije, niech go piorun trzaśnie!"
    draft: true
    chunks:
      - pl: "Na urodzinach, imieninach, weselach i jubileuszach śpiewa się zawsze tę samą piosenkę: Sto lat."
        ru: "На днях рождения, именинах, свадьбах и юбилеях всегда поют одну и ту же песню: «Сто лет»."
      - pl: " Jej słowa są bardzo proste: sto lat, sto lat, niech żyje, żyje nam, a potem jeszcze raz, i jeszcze raz niech żyje nam."
        ru: "Её слова очень простые: «Сто лет, сто лет, пусть живёт, живёт для нас», а потом ещё раз и ещё раз «пусть живёт для нас»."
      - pl: " Śpiewają ją goście przy stole, kibice na stadionie dla zwycięskiej drużyny, a nawet uczestnicy oficjalnych uroczystości dla jubilata, który skończył okrągłą liczbę lat."
        ru: "Её поют гости за столом, болельщики на стадионе для команды-победителя и даже участники официальных торжеств для юбиляра, которому исполнилось круглое число лет."
      - pl: " Pochodzenie piosenki nie jest dokładnie znane, ale w obecnej formie śpiewano ją już w okresie międzywojennym."
        ru: "Происхождение песни точно не известно, но в нынешнем виде её пели уже в межвоенный период."
      - pl: " Czasem goście dodają drugą zwrotkę, w której życzą solenizantowi zdrowia, szczęścia i miłości, a na koniec zawsze pada wesołe: a kto z nami nie wypije, niech go piorun trzaśnie!"
        ru: "Иногда гости добавляют второй куплет, в котором желают имениннику здоровья, счастья и любви, а в конце всегда звучит весёлое: «А кто с нами не выпьет, пусть его гром разразит!»"
        note: "trzasnąć — грянуть, ударить"
    words: { "urodzinach": urodziny, "weselach": wesele, "śpiewa": spiewac, "piosenkę": piosenka, "stole": stol, "stadionie": stadion, "zwycięskiej": zwycieski, "drużyny": druzyna, "oficjalnych": oficjalny, "uroczystości": uroczystosc, "okrągłą": okragly, "liczbę": liczba, "piosenki": piosenka, "obecnej": obecny, "formie": forma, "śpiewano": spiewac, "okresie": okres, "dodają": dodawac, "życzą": zyczyc, "zdrowia": zdrowie, "szczęścia": szczescie, "pada": padac, "wesołe": wesoly, "wypije": wypic, "piorun": piorun }
  - clean: "Jedno z najczęściej powtarzanych polskich przysłów brzmi: gość w dom, Bóg w dom. Gościnność była w dawnej Polsce cnotą, którą szczyciła się szlachta, a cudzoziemscy podróżnicy często pisali o tym, jak hojnie przyjmowano ich w polskich dworach. Inne przysłowie mówi: czym chata bogata, tym rada, czyli gospodarz daje gościom wszystko, co ma, nawet jeśli nie ma wiele. Ta zasada obowiązuje do dziś, a polscy gospodarze potrafią przygotować dla gości tyle jedzenia, jakby spodziewali się całego pułku."
    draft: true
    chunks:
      - pl: "Jedno z najczęściej powtarzanych polskich przysłów brzmi: gość w dom, Bóg w dom."
        ru: "Одна из самых часто повторяемых польских пословиц гласит: гость в дом — Бог в дом."
      - pl: " Gościnność była w dawnej Polsce cnotą, którą szczyciła się szlachta, a cudzoziemscy podróżnicy często pisali o tym, jak hojnie przyjmowano ich w polskich dworach."
        ru: "Гостеприимство в старой Польше было добродетелью, которой гордилась шляхта, и иностранные путешественники часто писали о том, как щедро их принимали в польских усадьбах."
        note: "cnota — добродетель; hojnie — щедро"
      - pl: " Inne przysłowie mówi: czym chata bogata, tym rada, czyli gospodarz daje gościom wszystko, co ma, nawet jeśli nie ma wiele."
        ru: "Другая пословица говорит: «Чем изба богата, тем и рада», то есть хозяин даёт гостям всё, что у него есть, даже если у него немного."
      - pl: " Ta zasada obowiązuje do dziś, a polscy gospodarze potrafią przygotować dla gości tyle jedzenia, jakby spodziewali się całego pułku."
        ru: "Этот принцип действует до сих пор, и польские хозяева способны приготовить для гостей столько еды, будто ждут целый полк."
        note: "pułk — полк"
    words: { "najczęściej": czesto, "powtarzanych": powtarzac, "polskich": polski, "brzmi": brzmiec, "dawnej": dawny, "często": czesto, "pisali": pisac, "hojnie": hojnie, "przyjmowano": przyjmowac, "dworach": dwor, "chata": chata, "bogata": bogaty, "czyli": czyli, "gospodarz": gospodarz, "zasada": zasada, "polscy": polski, "gospodarze": gospodarz, "przygotować": przygotowac, "spodziewali": spodziewac }
  - clean: "Gość, który przychodzi do polskiego domu, powinien przynieść jakiś drobiazg. Najczęściej są to kwiaty dla pani domu, czekoladki, ciasto albo butelka wina. Kwiatów powinna być nieparzysta liczba, bo parzystą przynosi się na pogrzeb, i nie powinny to być chryzantemy, które kojarzą się z cmentarzem. W wielu domach po wejściu zdejmuje się buty, a gospodarze proponują gościom kapcie, co dla niektórych cudzoziemców jest zaskoczeniem. Nie wypada podawać sobie ręki przez próg, bo według przesądu wróży to kłótnię, więc gospodarz zawsze zaprasza gościa najpierw do środka."
    draft: true
    chunks:
      - pl: "Gość, który przychodzi do polskiego domu, powinien przynieść jakiś drobiazg."
        ru: "Гость, который приходит в польский дом, должен принести какую-нибудь мелочь."
        note: "drobiazg — мелочь, безделушка"
      - pl: " Najczęściej są to kwiaty dla pani domu, czekoladki, ciasto albo butelka wina."
        ru: "Чаще всего это цветы для хозяйки, конфеты, пирог или бутылка вина."
      - pl: " Kwiatów powinna być nieparzysta liczba, bo parzystą przynosi się na pogrzeb, i nie powinny to być chryzantemy, które kojarzą się z cmentarzem."
        ru: "Цветов должно быть нечётное число, потому что чётное приносят на похороны, и это не должны быть хризантемы, которые ассоциируются с кладбищем."
      - pl: " W wielu domach po wejściu zdejmuje się buty, a gospodarze proponują gościom kapcie, co dla niektórych cudzoziemców jest zaskoczeniem."
        ru: "Во многих домах при входе снимают обувь, а хозяева предлагают гостям тапочки, что для некоторых иностранцев неожиданно."
        note: "kapcie — домашние тапочки"
      - pl: " Nie wypada podawać sobie ręki przez próg, bo według przesądu wróży to kłótnię, więc gospodarz zawsze zaprasza gościa najpierw do środka."
        ru: "Не полагается подавать друг другу руку через порог, потому что по примете это сулит ссору, поэтому хозяин всегда сначала приглашает гостя внутрь."
    words: { "przychodzi": przychodzic, "polskiego": polski, "drobiazg": drobiazg, "butelka": butelka, "liczba": liczba, "kojarzą": kojarzyc, "cmentarzem": cmentarz, "zdejmuje": zdejmowac, "proponują": proponowac, "wypada": wypadac, "podawać": podawac, "próg": prog, "według": wedlug, "kłótnię": klotnia, "zaprasza": zapraszac, "najpierw": najpierw }
  - clean: "Przy stole gospodarze nieustannie dokładają gościom jedzenia i namawiają ich, żeby zjedli jeszcze kawałek. Grzeczny gość najpierw odmawia, mówiąc, że już nie może, a gospodarz nalega, bo jedna odmowa jest tylko formą uprzejmości. Kto naprawdę nie chce już jeść, musi powtórzyć to kilka razy i najlepiej pochwalić przy tym jedzenie. Pusty talerz bywa bowiem odczytywany jako znak, że gość jest głodny, i natychmiast pojawia się na nim kolejna porcja. Siedzenie na rogu stołu nie jest dobrym pomysłem dla osób samotnych, bo podobno nie wyjdą one za mąż ani się nie ożenią przez siedem lat. Gospodarze rzadko pozwalają gościom pomóc w zmywaniu, a kiedy goście wychodzą, często wręczają im na drogę pakunek z ciastem albo resztkami obiadu."
    draft: true
    chunks:
      - pl: "Przy stole gospodarze nieustannie dokładają gościom jedzenia i namawiają ich, żeby zjedli jeszcze kawałek."
        ru: "За столом хозяева то и дело подкладывают гостям еды и уговаривают их съесть ещё кусочек."
        note: "namawiać — уговаривать"
      - pl: " Grzeczny gość najpierw odmawia, mówiąc, że już nie może, a gospodarz nalega, bo jedna odmowa jest tylko formą uprzejmości."
        ru: "Вежливый гость сначала отказывается, говоря, что больше не может, а хозяин настаивает, потому что один отказ — лишь форма вежливости."
        note: "nalegać — настаивать"
      - pl: " Kto naprawdę nie chce już jeść, musi powtórzyć to kilka razy i najlepiej pochwalić przy tym jedzenie."
        ru: "Тот, кто действительно больше не хочет есть, должен повторить это несколько раз и при этом лучше похвалить еду."
      - pl: " Pusty talerz bywa bowiem odczytywany jako znak, że gość jest głodny, i natychmiast pojawia się na nim kolejna porcja."
        ru: "Ведь пустая тарелка бывает понята как знак того, что гость голоден, и на ней сразу появляется очередная порция."
      - pl: " Siedzenie na rogu stołu nie jest dobrym pomysłem dla osób samotnych, bo podobno nie wyjdą one za mąż ani się nie ożenią przez siedem lat."
        ru: "Сидеть на углу стола — плохая идея для одиноких, потому что они якобы не выйдут замуж и не женятся семь лет."
      - pl: " Gospodarze rzadko pozwalają gościom pomóc w zmywaniu, a kiedy goście wychodzą, często wręczają im na drogę pakunek z ciastem albo resztkami obiadu."
        ru: "Хозяева редко позволяют гостям помочь с мытьём посуды, а когда гости уходят, часто вручают им на дорогу свёрток с пирогом или остатками обеда."
        note: "pakunek — свёрток"
    words: { "zjedli": zjesc, "kawałek": kawalek, "odmawia": odmawiac, "nalega": nalegac, "formą": forma, "uprzejmości": uprzejmosc, "powtórzyć": powtorzyc, "talerz": talerz, "bywa": bywac, "bowiem": bowiem, "znak": znak, "głodny": glodny, "natychmiast": natychmiast, "pojawia": pojawiac, "porcja": porcja, "rogu": rog, "stołu": stol, "samotnych": samotny, "ożenią": ozenic, "siedem": siedem, "rzadko": rzadko, "pozwalają": pozwalac, "ciastem": ciasto, "resztkami": resztki, "obiadu": obiad }
  - clean: "W wielu rodzinach istnieje zwyczaj niedzielnych odwiedzin. Po obiedzie jedzie się do dziadków albo do rodzeństwa na kawę i ciasto, a gospodyni piecze z tej okazji szarlotkę, sernik albo drożdżowe ciasto z kruszonką. Takie odwiedziny nie wymagają zaproszenia, ale wypada wcześniej zadzwonić, żeby gospodarze zdążyli coś przygotować, bo przyjąć gościa bez poczęstunku byłoby wstydem. W „Panu Tadeuszu” Mickiewicza zwaśnieni sąsiedzi godzą się w końcu przy wspólnej uczcie, a okrzyk: kochajmy się!, stał się symbolem polskiego pojednania przy stole, choć dziś używa się go często z ironią."
    draft: true
    chunks:
      - pl: "W wielu rodzinach istnieje zwyczaj niedzielnych odwiedzin."
        ru: "Во многих семьях существует обычай воскресных визитов."
      - pl: " Po obiedzie jedzie się do dziadków albo do rodzeństwa na kawę i ciasto, a gospodyni piecze z tej okazji szarlotkę, sernik albo drożdżowe ciasto z kruszonką."
        ru: "После обеда едут к бабушке с дедушкой или к братьям и сёстрам на кофе с пирогом, а хозяйка печёт по этому случаю шарлотку, сырник или дрожжевой пирог с крошкой."
        note: "kruszonka — посыпка-крошка; rodzeństwo — братья и сёстры"
      - pl: " Takie odwiedziny nie wymagają zaproszenia, ale wypada wcześniej zadzwonić, żeby gospodarze zdążyli coś przygotować, bo przyjąć gościa bez poczęstunku byłoby wstydem."
        ru: "Такие визиты не требуют приглашения, но принято заранее позвонить, чтобы хозяева успели что-нибудь приготовить, ведь принять гостя без угощения было бы стыдно."
      - pl: " W „Panu Tadeuszu” Mickiewicza zwaśnieni sąsiedzi godzą się w końcu przy wspólnej uczcie, a okrzyk: kochajmy się!, stał się symbolem polskiego pojednania przy stole, choć dziś używa się go często z ironią."
