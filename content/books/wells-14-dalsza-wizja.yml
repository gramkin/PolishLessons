  - clean: "Nie potrafię oddać uczucia potwornego spustoszenia, jakie wisiało nad światem. Czerwone niebo na wschodzie, czerń na północy, słone Morze Martwe, kamieniste wybrzeże, po którym pełzały te plugawe, powoli poruszające się potwory, jednolita, trująco wyglądająca zieleń porostów, rzadkie powietrze, które rani płuca: wszystko to składało się na przerażające wrażenie. Posunąłem się o sto lat naprzód, i było tam to samo czerwone słońce — trochę większe, trochę bardziej przygasłe — to samo umierające morze, to samo chłodne powietrze i ten sam tłum ziemistych skorupiaków, pełzających tam i z powrotem wśród zielonego zielska i czerwonych skał. A na zachodnim niebie zobaczyłem wygiętą bladą linię, jak ogromny nów księżyca."
