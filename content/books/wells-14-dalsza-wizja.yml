  - clean: "Zatrzymałem się bardzo łagodnie i siedziałem na Wehikule Czasu, rozglądając się. Niebo nie było już niebieskie. Na północnym wschodzie było czarne jak atrament, a z tej czerni świeciły jasno i spokojnie blade, białe gwiazdy. Nad głową było głęboko indyjskoczerwone i bezgwiezdne, a ku południowemu wschodowi jaśniało, przechodząc w żarzący się szkarłat, gdzie, przecięty horyzontem, leżał ogromny kadłub słońca, czerwony i nieruchomy."
    en: "“I stopped very gently and sat upon the Time Machine, looking round. The sky was no longer blue. North-eastward it was inky black, and out of the blackness shone brightly and steadily the pale white stars. Overhead it was a deep Indian red and starless, and south-eastward it grew brighter to a glowing scarlet where, cut by the horizon, lay the huge hull of the sun, red and motionless."
    draft: true
