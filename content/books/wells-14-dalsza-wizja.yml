paragraphs:
  - clean: "Opowiadałem wam już o mdłościach i oszołomieniu, które towarzyszą podróży w czasie. A tym razem nie siedziałem porządnie na siodełku, lecz bokiem i niepewnie. Przez nieokreślony czas trzymałem się kurczowo maszyny, która się kołysała i drżała, zupełnie nie zważając, dokąd jadę, a gdy w końcu zmusiłem się, by znów spojrzeć na tarcze, ze zdumieniem zobaczyłem, dokąd dotarłem."
    en: "“I have already told you of the sickness and confusion that comes with time travelling. And this time I was not seated properly in the saddle, but sideways and in an unstable fashion. For an indefinite time I clung to the machine as it swayed and vibrated, quite unheeding how I went, and when I brought myself to look at the dials again I was amazed to find where I had arrived."
    draft: true
    chunks:
