  - clean: "Maszyna stała na pochyłym wybrzeżu. Morze ciągnęło się na południowy zachód, wznosząc się w ostry, jasny horyzont na tle bladego nieba. Nie było przyboju ani fal, bo nie poruszał się najlżejszy podmuch wiatru. Tylko lekka, oleista fala martwa unosiła się i opadała jak łagodny oddech, pokazując, że wieczne morze wciąż się porusza i żyje. A wzdłuż brzegu, gdzie woda czasem się łamała, była gruba skorupa soli — różowa pod złowieszczym niebem. Czułem ucisk w głowie i zauważyłem, że oddycham bardzo szybko. To uczucie przypomniało mi moje jedyne doświadczenie wspinaczki górskiej, i z tego wywnioskowałem, że powietrze jest rzadsze niż teraz."
    en: "“The machine was standing on a sloping beach. The sea stretched away to the south-west, to rise into a sharp bright horizon against the wan sky. There were no breakers and no waves, for not a breath of wind was stirring. Only a slight oily swell rose and fell like a gentle breathing, and showed that the eternal sea was still moving and living. And along the margin where the water sometimes broke was a thick incrustation of salt—pink under the lurid sky. There was a sense of oppression in my head, and I noticed that I was breathing very fast. The sensation reminded me of my only experience of mountaineering, and from that I judged the air to be more rarefied than it is now."
    draft: true
