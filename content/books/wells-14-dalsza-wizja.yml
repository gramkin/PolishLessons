        ru: "а единственным следом жизни, который я сначала увидел, была ярко-зелёная растительность, покрывавшая каждый выступ на их юго-восточной стороне."
      - pl: " Była to ta sama soczysta zieleń, którą widzi się na leśnym mchu albo na porostach w jaskiniach: roślinach, które jak one rosną w wiecznym półmroku."
        ru: "Это была та же сочная зелень, что видишь на лесном мху или на лишайниках в пещерах: растениях, которые, как и эти, растут в вечном полумраке."
        note: "porost — лишайник"
