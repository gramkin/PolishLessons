  - clean: "Podróżowałem tak, zatrzymując się raz po raz, wielkimi krokami po tysiąc lat albo więcej, wiedziony tajemnicą losów ziemi, patrząc z dziwną fascynacją, jak słońce na zachodnim niebie rośnie i przygasa, a życie starej ziemi uchodzi. W końcu, ponad trzydzieści milionów lat później, ogromna rozżarzona kopuła słońca zasłaniała prawie dziesiątą część ciemniejącego nieba. Wtedy znowu się zatrzymałem, bo pełzające mrowie krabów zniknęło, a czerwone wybrzeże, poza sinozielonymi wątrobowcami i porostami, wydawało się martwe."
