  - clean: "Skały wokół mnie miały ostry czerwonawy kolor, a jedynym śladem życia, jaki z początku widziałem, była intensywnie zielona roślinność, pokrywająca każdy wystający punkt na ich południowo-wschodnich ścianach. Była to ta sama soczysta zieleń, którą widzi się na leśnym mchu albo na porostach w jaskiniach: roślinach, które jak one rosną w wiecznym półmroku."
    en: "The rocks about me were of a harsh reddish colour, and all the trace of life that I could see at first was the intensely green vegetation that covered every projecting point on their south-eastern face. It was the same rich green that one sees on forest moss or on the lichen in caves: plants which like these grow in a perpetual twilight."
    draft: true
    chunks:
