      - pl: " Otóż zamiast przestawić dźwignie na wstecz, pociągnąłem je tak, że poruszałem się naprzód,"
        ru: "Так вот, вместо того чтобы перевести рычаги назад, я потянул их так, что двигался вперёд,"
      - pl: " a gdy spojrzałem na te wskaźniki, zobaczyłem, że wskazówka tysięcy obraca się tak szybko jak sekundnik zegarka — w przyszłość."
        ru: "а когда взглянул на эти указатели, увидел, что стрелка тысяч вращается так же быстро, как секундная стрелка часов, — в будущее."
        note: "wskaźnik — указатель; sekundnik — секундная стрелка"
    words: { "tarcza": tarcza, "wstecz": wstecz, "pociągnąłem": pociagnac, "poruszałem": poruszac, "wskazówka": wskazowka }
  - clean: "Gdy jechałem dalej, wygląd rzeczy zaczął się osobliwie zmieniać. Pulsująca szarość ściemniała; potem — choć wciąż podróżowałem z ogromną prędkością — powróciło migotliwe następstwo dnia i nocy, które zwykle oznaczało wolniejsze tempo, i stawało się coraz wyraźniejsze. Z początku bardzo mnie to zastanawiało. Zmiany nocy i dnia stawały się coraz wolniejsze, podobnie jak wędrówka słońca po niebie, aż zdawały się ciągnąć przez stulecia."
    en: "“As I drove on, a peculiar change crept over the appearance of things. The palpitating greyness grew darker; then—though I was still travelling with prodigious velocity—the blinking succession of day and night, which was usually indicative of a slower pace, returned, and grew more and more marked. This puzzled me very much at first. The alternations of night and day grew slower and slower, and so did the passage of the sun across the sky, until they seemed to stretch through centuries."
    draft: true
    chunks:
      - pl: "Gdy jechałem dalej, wygląd rzeczy zaczął się osobliwie zmieniać."
        ru: "Пока я ехал дальше, облик вещей стал странно меняться."
      - pl: " Pulsująca szarość ściemniała; potem — choć wciąż podróżowałem z ogromną prędkością —"
        ru: "Пульсирующая серость потемнела; потом — хотя я всё ещё мчался с огромной скоростью —"
      - pl: " powróciło migotliwe następstwo dnia i nocy, które zwykle oznaczało wolniejsze tempo, i stawało się coraz wyraźniejsze."
        ru: "вернулось мерцающее чередование дня и ночи, обычно означавшее более медленный ход, и становилось всё заметнее."
      - pl: " Z początku bardzo mnie to zastanawiało."
        ru: "Поначалу это меня очень озадачило."
      - pl: " Zmiany nocy i dnia stawały się coraz wolniejsze, podobnie jak wędrówka słońca po niebie, aż zdawały się ciągnąć przez stulecia."
        ru: "Смена ночи и дня становилась всё медленнее, как и путь солнца по небу, пока они не стали, казалось, растягиваться на столетия."
    words: { "wygląd": wyglad, "podróżowałem": podrozowac, "tempo": tempo, "podobnie": podobnie, "wędrówka": wedrowka, "stulecia": stulecie }
  - clean: "W końcu nad ziemią zawisł stały zmierzch, przerywany tylko od czasu do czasu, gdy kometa rozbłyskała na ciemniejącym niebie. Pas światła, który oznaczał słońce, dawno zniknął; słońce bowiem przestało zachodzić — po prostu wznosiło się i opadało na zachodzie, i stawało się coraz szersze i czerwieńsze. Wszelki ślad księżyca zniknął. Krążenie gwiazd, coraz wolniejsze, ustąpiło miejsca pełzającym punktom światła."
    en: "At last a steady twilight brooded over the earth, a twilight only broken now and then when a comet glared across the darkling sky. The band of light that had indicated the sun had long since disappeared; for the sun had ceased to set—it simply rose and fell in the west, and grew ever broader and more red. All trace of the moon had vanished. The circling of the stars, growing slower and slower, had given place to creeping points of light."
    draft: true
    chunks:
      - pl: "W końcu nad ziemią zawisł stały zmierzch, przerywany tylko od czasu do czasu, gdy kometa rozbłyskała na ciemniejącym niebie."
        ru: "Наконец над землёй нависли постоянные сумерки, прерывавшиеся лишь изредка, когда по темнеющему небу вспыхивала комета."
        note: "rozbłyskać — вспыхивать"
      - pl: " Pas światła, który oznaczał słońce, dawno zniknął;"
        ru: "Полоса света, обозначавшая солнце, давно исчезла;"
      - pl: " słońce bowiem przestało zachodzić — po prostu wznosiło się i opadało na zachodzie, i stawało się coraz szersze i czerwieńsze."
        ru: "ведь солнце перестало заходить — оно просто поднималось и опускалось на западе и становилось всё шире и краснее."
      - pl: " Wszelki ślad księżyca zniknął."
        ru: "Всякий след луны исчез."
      - pl: " Krążenie gwiazd, coraz wolniejsze, ustąpiło miejsca pełzającym punktom światła."
        ru: "Кружение звёзд, всё более медленное, уступило место ползущим точкам света."
        note: "ustąpić miejsca — уступить место"
    words: { "przerywany": przerywac, "dawno": dawno, "wznosiło": wznosic, "zachodzie": zachod, "szersze": szeroki }
  - clean: "W końcu, na jakiś czas przed tym, nim się zatrzymałem, słońce, czerwone i bardzo duże, zatrzymało się nieruchomo nad horyzontem, ogromna kopuła żarząca się tępym żarem, chwilami przygasająca na moment. W pewnej chwili rozjarzyło się przez krótki czas znów jaśniej, ale szybko wróciło do swojego posępnego czerwonego żaru. Po tym spowolnieniu wschodów i zachodów poznałem, że praca hamowania pływowego dobiegła końca. Ziemia znieruchomiała, zwrócona jedną stroną do słońca, tak jak w naszych czasach księżyc jest zwrócony do ziemi."
    en: "At last, some time before I stopped, the sun, red and very large, halted motionless upon the horizon, a vast dome glowing with a dull heat, and now and then suffering a momentary extinction. At one time it had for a little while glowed more brilliantly again, but it speedily reverted to its sullen red heat. I perceived by this slowing down of its rising and setting that the work of the tidal drag was done. The earth had come to rest with one face to the sun, even as in our own time the moon faces the earth."
    draft: true
    chunks:
      - pl: "W końcu, na jakiś czas przed tym, nim się zatrzymałem, słońce, czerwone i bardzo duże, zatrzymało się nieruchomo nad horyzontem,"
        ru: "Наконец, незадолго до того, как я остановился, солнце, красное и очень большое, неподвижно застыло над горизонтом —"
      - pl: " ogromna kopuła żarząca się tępym żarem, chwilami przygasająca na moment."
        ru: "огромный купол, тлеющий тусклым жаром и порой на миг угасающий."
        note: "żarzyć się — тлеть, раскаляться"
      - pl: " W pewnej chwili rozjarzyło się przez krótki czas znów jaśniej, ale szybko wróciło do swojego posępnego czerwonego żaru."
        ru: "Однажды оно ненадолго снова разгорелось ярче, но быстро вернулось к своему угрюмому красному жару."
        note: "rozjarzyć się — разгореться"
      - pl: " Po tym spowolnieniu wschodów i zachodów poznałem, że praca hamowania pływowego dobiegła końca."
        ru: "По этому замедлению восходов и закатов я понял, что работа приливного торможения завершена."
        note: "pływowy — приливный"
      - pl: " Ziemia znieruchomiała, zwrócona jedną stroną do słońca, tak jak w naszych czasach księżyc jest zwrócony do ziemi."
        ru: "Земля остановилась, обращённая к солнцу одной стороной, точно так же, как в наше время луна обращена к земле."
