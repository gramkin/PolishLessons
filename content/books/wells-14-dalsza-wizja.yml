      - pl: " Przez nieokreślony czas trzymałem się kurczowo maszyny, która się kołysała i drżała, zupełnie nie zważając, dokąd jadę,"
        ru: "Неопределённое время я судорожно держался за машину, которая раскачивалась и дрожала, совершенно не обращая внимания, куда я еду,"
      - pl: " a gdy w końcu zmusiłem się, by znów spojrzeć na tarcze, ze zdumieniem zobaczyłem, dokąd dotarłem."
        ru: "а когда наконец заставил себя снова взглянуть на циферблаты, с изумлением увидел, куда попал."
    words: { "towarzyszą": towarzyszyc, "porządnie": porzadnie, "bokiem": bok, "maszyny": maszyna, "tarcze": tarcza }
  - clean: "Jedna tarcza rejestruje dni, druga tysiące dni, inna miliony dni, a jeszcze inna tysiące milionów. Otóż zamiast przestawić dźwignie na wstecz, pociągnąłem je tak, że poruszałem się naprzód, a gdy spojrzałem na te wskaźniki, zobaczyłem, że wskazówka tysięcy obraca się tak szybko jak sekundnik zegarka — w przyszłość."
    en: "One dial records days, and another thousands of days, another millions of days, and another thousands of millions. Now, instead of reversing the levers, I had pulled them over so as to go forward with them, and when I came to look at these indicators I found that the thousands hand was sweeping round as fast as the seconds hand of a watch—into futurity."
    draft: true
    chunks:
      - pl: "Jedna tarcza rejestruje dni, druga tysiące dni, inna miliony dni, a jeszcze inna tysiące milionów."
