  - clean: "Bardzo ostrożnie, bo pamiętałem swój poprzedni upadek na łeb na szyję, zacząłem odwracać ruch. Krążące wskazówki szły coraz wolniej, aż wskazówka tysięcy wydawała się nieruchoma, a dzienna nie była już tylko mgiełką na swojej skali. Jeszcze wolniej, aż stały się widoczne niewyraźne zarysy pustego wybrzeża."
    en: "Very cautiously, for I remembered my former headlong fall, I began to reverse my motion. Slower and slower went the circling hands until the thousands one seemed motionless and the daily one was no longer a mere mist upon its scale. Still slower, until the dim outlines of a desolate beach grew visible."
    draft: true
