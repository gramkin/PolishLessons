        ru: "А вдоль кромки, где вода порой разбивалась, лежала толстая корка соли — розовая под зловещим небом."
        note: "skorupa — корка; złowieszczy — зловещий"
      - pl: " Czułem ucisk w głowie i zauważyłem, że oddycham bardzo szybko."
        ru: "Я ощущал давление в голове и заметил, что дышу очень часто."
