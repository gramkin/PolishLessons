  - clean: "Rozejrzałem się, czy zostały jakieś ślady życia zwierzęcego. Jakaś nieokreślona obawa wciąż trzymała mnie na siodełku maszyny. Ale nie widziałem niczego, co by się poruszało, ani na ziemi, ani na niebie, ani w morzu. Tylko zielony śluz na skałach świadczył, że życie nie wygasło. W morzu pojawiła się płytka mielizna, a woda cofnęła się od brzegu. Wydało mi się, że widzę jakiś czarny przedmiot, który podskakiwał na tej mieliźnie, ale znieruchomiał, gdy na niego spojrzałem, i uznałem, że oko mnie zwiodło, a czarny przedmiot to tylko skała. Gwiazdy na niebie były nadzwyczaj jasne i, jak mi się zdawało, prawie nie migotały."
