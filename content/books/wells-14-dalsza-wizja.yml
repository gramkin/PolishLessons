  - clean: "Nagle zauważyłem, że okrągły zachodni zarys słońca się zmienił; że w łuku pojawiło się wklęśnięcie, zatoka. Widziałem, jak się powiększa. Może przez minutę wpatrywałem się z przerażeniem w tę czerń, która pełzła po dniu, a potem zrozumiałem, że zaczyna się zaćmienie. Albo księżyc, albo planeta Merkury przechodziła przez tarczę słońca. Naturalnie z początku wziąłem to za księżyc, ale wiele skłania mnie do wiary, że to, co naprawdę widziałem, było przejściem planety wewnętrznej, przechodzącej bardzo blisko ziemi."
