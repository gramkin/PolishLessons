  - clean: "Ciemność szybko gęstniała; zimny wiatr zaczął wiać ze wschodu coraz silniejszymi porywami, a płatków sypiących się w powietrzu przybywało. Od brzegu morza dochodził plusk i szept. Poza tymi martwymi dźwiękami świat był cichy. Cichy? Trudno byłoby oddać tę ciszę. Wszystkie odgłosy człowieka, beczenie owiec, krzyki ptaków, brzęczenie owadów, ten gwar, który stanowi tło naszego życia — wszystko to się skończyło."
