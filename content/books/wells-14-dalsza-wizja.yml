  - clean: "Gdy wpatrywałem się w to złowrogie zjawisko, pełznące ku mnie, poczułem łaskotanie na policzku, jakby usiadła tam mucha. Próbowałem ją strzepnąć ręką, ale po chwili wróciła, a niemal natychmiast druga pojawiła się przy uchu. Uderzyłem w nią i złapałem coś nitkowatego. Zostało mi to szybko wyrwane z ręki. Z przerażającym ściśnięciem w żołądku odwróciłem się i zobaczyłem, że chwyciłem czułek innego potwornego kraba, który stał tuż za mną. Jego złe oczy wiły się na słupkach, pysk drgał łapczywie, a ogromne, niezgrabne szczypce, umazane śluzem z glonów, opuszczały się na mnie."
