chapter: 10
chapterTitle: "Jadwiga i Jagiełło"
chapterTitleRu: "Ядвига и Ягайло"
level: B2
paragraphs:
  - clean: "Ludwik Węgierski, siostrzeniec Kazimierza, objął tron polski w 1370 roku. Był potężnym monarchą, który rządził Węgrami, Chorwacją i częścią Bałkanów, a Polska była dla niego sprawą drugorzędną. Przez dwanaście lat panowania przyjechał do Krakowa tylko kilka razy. Rządy w jego imieniu sprawowała matka, sędziwa królowa Elżbieta, siostra Kazimierza Wielkiego, a potem węgierscy namiestnicy. Polacy szybko zatęsknili za królem, który mieszka w kraju i dba o jego sprawy."
    draft: true
    chunks:
      - pl: "Ludwik Węgierski, siostrzeniec Kazimierza, objął tron polski w 1370 roku."
        ru: "Людовик Венгерский, племянник Казимира, занял польский престол в 1370 году."
        note: "siostrzeniec — племянник (сын сестры)"
      - pl: " Był potężnym monarchą, który rządził Węgrami, Chorwacją i częścią Bałkanów, a Polska była dla niego sprawą drugorzędną."
        ru: "Он был могущественным монархом, правившим Венгрией, Хорватией и частью Балкан, а Польша была для него делом второстепенным."
        note: "drugorzędny — второстепенный"
      - pl: " Przez dwanaście lat panowania przyjechał do Krakowa tylko kilka razy."
        ru: "За двенадцать лет правления он приезжал в Краков лишь несколько раз."
      - pl: " Rządy w jego imieniu sprawowała matka, sędziwa królowa Elżbieta, siostra Kazimierza Wielkiego, a potem węgierscy namiestnicy."
        ru: "Правление от его имени осуществляла мать, престарелая королева Елизавета, сестра Казимира Великого, а затем венгерские наместники."
        note: "sprawować rządy — осуществлять правление; sędziwy — престарелый; namiestnik — наместник"
      - pl: " Polacy szybko zatęsknili za królem, który mieszka w kraju i dba o jego sprawy."
        ru: "Поляки быстро затосковали по королю, который живёт в стране и заботится о её делах."
    words: { "siostrzeniec": siostrzeniec, "objął": objac, "tron": tron, "polski": polski, "potężnym": potezny, "rządził": rzadzic, "dwanaście": dwanascie }
  - clean: "Ludwik miał tylko córki i chciał, żeby jedna z nich odziedziczyła polski tron. Polskie prawo zwyczajowe tego nie przewidywało, więc król potrzebował zgody szlachty. W 1374 roku w Koszycach wydał przywilej, w którym zwolnił szlachtę z prawie wszystkich podatków. Od tej pory szlachcic płacił tylko dwa grosze rocznie z łanu ziemi uprawianej przez chłopów. W zamian szlachta zgodziła się, by na tronie zasiadła córka Ludwika. Przywilej koszycki był pierwszym z długiego szeregu przywilejów, za które kolejni królowie kupowali sobie poparcie szlachty. Z biegiem czasu uczyniły one ze szlachty najpotężniejszą siłę w państwie."
    draft: true
    chunks:
      - pl: "Ludwik miał tylko córki i chciał, żeby jedna z nich odziedziczyła polski tron."
        ru: "У Людовика были только дочери, и он хотел, чтобы одна из них унаследовала польский престол."
      - pl: " Polskie prawo zwyczajowe tego nie przewidywało, więc król potrzebował zgody szlachty."
        ru: "Польское обычное право этого не предусматривало, поэтому королю требовалось согласие шляхты."
        note: "prawo zwyczajowe — обычное право; przewidywać — предусматривать"
      - pl: " W 1374 roku w Koszycach wydał przywilej, w którym zwolnił szlachtę z prawie wszystkich podatków."
        ru: "В 1374 году в Кошице он издал привилегию, по которой освободил шляхту почти от всех налогов."
      - pl: " Od tej pory szlachcic płacił tylko dwa grosze rocznie z łanu ziemi uprawianej przez chłopów."
        ru: "С тех пор шляхтич платил лишь два гроша в год с лана земли, обрабатываемой крестьянами."
        note: "szlachcic — шляхтич"
      - pl: " W zamian szlachta zgodziła się, by na tronie zasiadła córka Ludwika."
        ru: "Взамен шляхта согласилась, чтобы на престол взошла дочь Людовика."
        note: "zasiąść na tronie — взойти на престол"
      - pl: " Przywilej koszycki był pierwszym z długiego szeregu przywilejów, za które kolejni królowie kupowali sobie poparcie szlachty."
        ru: "Кошицкая привилегия стала первой в длинном ряду привилегий, которыми следующие короли покупали себе поддержку шляхты."
        note: "szereg — ряд"
      - pl: " Z biegiem czasu uczyniły one ze szlachty najpotężniejszą siłę w państwie."
        ru: "Со временем они сделали шляхту самой могущественной силой в государстве."
    words: { "tron": tron, "polski": polski, "Polskie": polski, "przywilej": przywilej, "podatków": podatek, "grosze": grosz, "rocznie": rocznie, "chłopów": chlop, "tronie": tron, "szeregu": szereg, "przywilejów": przywilej, "biegiem": bieg, "najpotężniejszą": potezny }
  - clean: "Ludwik zmarł w 1382 roku. Węgry przypadły jego starszej córce Marii, narzeczonej Zygmunta Luksemburskiego. Polscy możni nie chcieli jednak, żeby Zygmunt został ich królem, bo obawiali się, że będzie rządził z daleka, tak jak Ludwik. Postanowili, że koronę dostanie młodsza córka, Jadwiga, pod warunkiem że zamieszka w Polsce na stałe. Przez dwa lata matka dziewczynki zwlekała z jej przyjazdem, a w Wielkopolsce wybuchła wojna domowa między rodami możnych. Wreszcie jesienią 1384 roku Jadwiga przybyła do Krakowa."
    draft: true
    chunks:
      - pl: "Ludwik zmarł w 1382 roku."
        ru: "Людовик умер в 1382 году."
      - pl: " Węgry przypadły jego starszej córce Marii, narzeczonej Zygmunta Luksemburskiego."
        ru: "Венгрия досталась его старшей дочери Марии, невесте Сигизмунда Люксембургского."
        note: "przypaść — достаться; narzeczona — невеста"
      - pl: " Polscy możni nie chcieli jednak, żeby Zygmunt został ich królem, bo obawiali się, że będzie rządził z daleka, tak jak Ludwik."
        ru: "Однако польские вельможи не хотели, чтобы Сигизмунд стал их королём, опасаясь, что он будет править издалека, как Людовик."
      - pl: " Postanowili, że koronę dostanie młodsza córka, Jadwiga, pod warunkiem że zamieszka w Polsce na stałe."
        ru: "Они решили, что корону получит младшая дочь, Ядвига, при условии, что она поселится в Польше навсегда."
        note: "na stałe — навсегда, постоянно"
      - pl: " Przez dwa lata matka dziewczynki zwlekała z jej przyjazdem, a w Wielkopolsce wybuchła wojna domowa między rodami możnych."
        ru: "Два года мать девочки тянула с её приездом, а в Великой Польше разразилась междоусобная война между родами вельмож."
        note: "zwlekać — медлить, тянуть; wojna domowa — гражданская, междоусобная война"
      - pl: " Wreszcie jesienią 1384 roku Jadwiga przybyła do Krakowa."
        ru: "Наконец осенью 1384 года Ядвига прибыла в Краков."
    words: { "rządził": rzadzic, "narzeczonej": narzeczony, "Polscy": polski, "koronę": korona, "zamieszka": zamieszkac, "przyjazdem": przyjazd, "wybuchła": wybuchnac, "rodami": rod-2, "jesienią": jesien }
  - clean: "16 października 1384 roku arcybiskup koronował ją w katedrze wawelskiej. Miała około dziesięciu lat. W dokumentach nazywano ją nie królową, ale królem Polski, łac. rex. Nie chodziło o jakiś dziwny zwyczaj, tylko o sprawę zasadniczą. Królowa była zwykle tylko żoną króla, a Jadwiga była władczynią z własnego prawa, dziedziczką korony. Kraków powitał ją z radością, a dziewczynka szybko zdobyła serca poddanych. Kronikarze opisują ją jako piękną, inteligentną i bardzo wykształconą: znała kilka języków, kochała muzykę i książki."
    draft: true
    chunks:
      - pl: "16 października 1384 roku arcybiskup koronował ją w katedrze wawelskiej."
        ru: "16 октября 1384 года архиепископ короновал её в Вавельском соборе."
      - pl: " Miała około dziesięciu lat."
        ru: "Ей было около десяти лет."
      - pl: " W dokumentach nazywano ją nie królową, ale królem Polski, łac. rex."
        ru: "В документах её называли не королевой, а королём Польши, по-латыни rex."
      - pl: " Nie chodziło o jakiś dziwny zwyczaj, tylko o sprawę zasadniczą."
        ru: "Речь шла не о каком-то странном обычае, а о деле принципиальном."
        note: "zasadniczy — принципиальный"
      - pl: " Królowa była zwykle tylko żoną króla, a Jadwiga była władczynią z własnego prawa, dziedziczką korony."
        ru: "Королева обычно была лишь женой короля, а Ядвига была правительницей по собственному праву, наследницей короны."
      - pl: " Kraków powitał ją z radością, a dziewczynka szybko zdobyła serca poddanych."
        ru: "Краков встретил её с радостью, и девочка быстро завоевала сердца подданных."
      - pl: " Kronikarze opisują ją jako piękną, inteligentną i bardzo wykształconą: znała kilka języków, kochała muzykę i książki."
        ru: "Летописцы описывают её как красивую, умную и очень образованную: она знала несколько языков, любила музыку и книги."
    words: { "października": pazdziernik, "zwyczaj": zwyczaj, "zasadniczą": zasadniczy, "korony": korona, "powitał": powitac, "radością": radosc, "inteligentną": inteligentny, "wykształconą": wyksztalcic }
  - clean: "Młoda królowa potrzebowała męża, a jej małżeństwo było sprawą państwową najwyższej wagi. Ojciec zaręczył ją jeszcze w dzieciństwie z austriackim księciem Wilhelmem Habsburgiem. Według dawnego zwyczaju takie zaręczyny dzieci można było unieważnić, jeśli nie zostały potwierdzone po osiągnięciu dorosłości. Polscy możni mieli jednak zupełnie inny plan. Zamiast austriackiego księcia chcieli za męża dla Jadwigi wielkiego księcia litewskiego Jagiełłę."
    draft: true
    chunks:
      - pl: "Młoda królowa potrzebowała męża, a jej małżeństwo było sprawą państwową najwyższej wagi."
        ru: "Юной королеве нужен был муж, а её брак был государственным делом высочайшей важности."
        note: "waga — здесь «важность»"
      - pl: " Ojciec zaręczył ją jeszcze w dzieciństwie z austriackim księciem Wilhelmem Habsburgiem."
        ru: "Отец ещё в детстве обручил её с австрийским герцогом Вильгельмом Габсбургом."
        note: "zaręczyć — обручить"
      - pl: " Według dawnego zwyczaju takie zaręczyny dzieci można było unieważnić, jeśli nie zostały potwierdzone po osiągnięciu dorosłości."
        ru: "По старому обычаю такую помолвку детей можно было расторгнуть, если её не подтверждали по достижении совершеннолетия."
        note: "unieważnić — аннулировать; dorosłość — совершеннолетие"
      - pl: " Polscy możni mieli jednak zupełnie inny plan."
        ru: "Однако у польских вельмож был совсем другой план."
      - pl: " Zamiast austriackiego księcia chcieli za męża dla Jadwigi wielkiego księcia litewskiego Jagiełłę."
        ru: "Вместо австрийского герцога они хотели в мужья Ядвиге великого князя литовского Ягайло."
    words: { "Polscy": polski, "wagi": waga, "zaręczył": zareczyc, "dzieciństwie": dziecinstwo, "zwyczaju": zwyczaj, "zaręczyny": zareczyny }
  - clean: "Wielkie Księstwo Litewskie było wtedy jednym z największych państw Europy. W XIII i XIV wieku książęta litewscy, korzystając z upadku Rusi po najeździe mongolskim, podporządkowali sobie ogromne ziemie ruskie: Białoruś, dużą część Ukrainy z Kijowem i ziemie aż po okolice Smoleńska i Briańska. Sami Litwini stanowili tylko mniejszość, a większość mieszkańców była prawosławnymi Rusinami. Językiem urzędowym kancelarii wielkoksiążęcej był język ruski, przodek dzisiejszego białoruskiego i ukraińskiego. Rodzina wielkiego księcia była jednak pogańska, a Litwa była ostatnim pogańskim państwem w Europie."
    draft: true
    chunks:
      - pl: "Wielkie Księstwo Litewskie było wtedy jednym z największych państw Europy."
        ru: "Великое княжество Литовское было тогда одним из крупнейших государств Европы."
      - pl: " W XIII i XIV wieku książęta litewscy, korzystając z upadku Rusi po najeździe mongolskim, podporządkowali sobie ogromne ziemie ruskie: Białoruś, dużą część Ukrainy z Kijowem i ziemie aż po okolice Smoleńska i Briańska."
        ru: "В XIII–XIV веках литовские князья, пользуясь упадком Руси после монгольского нашествия, подчинили себе огромные русские земли: Беларусь, значительную часть Украины с Киевом и земли вплоть до окрестностей Смоленска и Брянска."
      - pl: " Sami Litwini stanowili tylko mniejszość, a większość mieszkańców była prawosławnymi Rusinami."
        ru: "Сами литовцы составляли лишь меньшинство, а большинство жителей были православными русинами."
        note: "mniejszość — меньшинство"
      - pl: " Językiem urzędowym kancelarii wielkoksiążęcej był język ruski, przodek dzisiejszego białoruskiego i ukraińskiego."
        ru: "Официальным языком великокняжеской канцелярии был русский (западнорусский) язык, предок нынешних белорусского и украинского."
        note: "urzędowy — официальный; kancelaria — канцелярия"
      - pl: " Rodzina wielkiego księcia była jednak pogańska, a Litwa była ostatnim pogańskim państwem w Europie."
        ru: "Однако семья великого князя была языческой, а Литва была последним языческим государством в Европе."
    words: { "korzystając": korzystac, "upadku": upadek, "stanowili": stanowic, "mieszkańców": mieszkaniec, "kancelarii": kancelaria, "przodek": przodek }
  - clean: "Litwa była potężna, ale miała dwóch groźnych przeciwników. Z zachodu atakowali ją Krzyżacy, którzy co roku organizowali na Litwę wyprawy, nazywane rejzami, i zapraszali na nie rycerzy z całej Europy. Z perspektywy zachodnich rycerzy była to krucjata przeciw poganom, a dla Litwinów — walka o życie. Ze wschodu rosła potęga Moskwy, która po zwycięstwie na Kulikowym Polu w 1380 roku zaczynała zbierać wokół siebie ziemie ruskie. Jagiełło musiał wybrać, z kim się sprzymierzyć i jaką wiarę przyjąć. Rozważał nawet małżeństwo z córką moskiewskiego księcia Dymitra Dońskiego i przyjęcie prawosławia. Jego matka, Julianna, była przecież twerską księżniczką i prawosławną."
    draft: true
    chunks:
      - pl: "Litwa była potężna, ale miała dwóch groźnych przeciwników."
        ru: "Литва была могущественна, но у неё было два опасных противника."
      - pl: " Z zachodu atakowali ją Krzyżacy, którzy co roku organizowali na Litwę wyprawy, nazywane rejzami, i zapraszali na nie rycerzy z całej Europy."
        ru: "С запада её атаковали крестоносцы, которые каждый год устраивали на Литву походы, называемые рейзами, и приглашали на них рыцарей со всей Европы."
        note: "rejza — рейза, набег крестоносцев на Литву"
      - pl: " Z perspektywy zachodnich rycerzy była to krucjata przeciw poganom, a dla Litwinów — walka o życie."
        ru: "С точки зрения западных рыцарей это был крестовый поход против язычников, а для литовцев — борьба за жизнь."
      - pl: " Ze wschodu rosła potęga Moskwy, która po zwycięstwie na Kulikowym Polu w 1380 roku zaczynała zbierać wokół siebie ziemie ruskie."
        ru: "С востока росла мощь Москвы, которая после победы на Куликовом поле в 1380 году начинала собирать вокруг себя русские земли."
      - pl: " Jagiełło musiał wybrać, z kim się sprzymierzyć i jaką wiarę przyjąć."
        ru: "Ягайло должен был выбрать, с кем вступить в союз и какую веру принять."
      - pl: " Rozważał nawet małżeństwo z córką moskiewskiego księcia Dymitra Dońskiego i przyjęcie prawosławia."
        ru: "Он даже рассматривал брак с дочерью московского князя Дмитрия Донского и принятие православия."
        note: "rozważać — обдумывать, рассматривать"
      - pl: " Jego matka, Julianna, była przecież twerską księżniczką i prawosławną."
        ru: "Ведь его мать, Ульяна, была тверской княжной и православной."
    words: { "potężna": potezny, "groźnych": grozny, "przeciwników": przeciwnik, "zachodu": zachod, "atakowali": atakowac, "organizowali": organizowac, "wyprawy": wyprawa, "zapraszali": zapraszac, "rycerzy": rycerz, "perspektywy": perspektywa, "zachodnich": zachodni, "wschodu": wschod, "rosła": rosnac, "potęga": potega, "zwycięstwie": zwyciestwo, "księżniczką": ksiezniczka }
  - clean: "Ostatecznie wybrał Polskę. Unia z Królestwem Polskim dawała mu sojusznika przeciw Krzyżakom, koronę królewską i pozycję w katolickiej Europie. Chrzest z rąk polskich, a nie niemieckich, odbierał zakonowi główny pretekst do wojen. Polsce unia dawała sojusznika przeciw Krzyżakom, szansę na odzyskanie Rusi Halickiej i ogromne nowe możliwości na wschodzie. Obie strony potrzebowały się nawzajem."
    draft: true
    chunks:
      - pl: "Ostatecznie wybrał Polskę."
        ru: "В конце концов он выбрал Польшу."
      - pl: " Unia z Królestwem Polskim dawała mu sojusznika przeciw Krzyżakom, koronę królewską i pozycję w katolickiej Europie."
        ru: "Уния с Королевством Польским давала ему союзника против крестоносцев, королевскую корону и положение в католической Европе."
      - pl: " Chrzest z rąk polskich, a nie niemieckich, odbierał zakonowi główny pretekst do wojen."
