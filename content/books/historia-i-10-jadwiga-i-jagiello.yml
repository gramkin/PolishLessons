  - clean: "Po tej klęsce obaj kuzyni zrozumieli, że muszą trzymać się razem. W 1401 roku zawarto nowy układ, który potwierdzał, że Litwa ma własnego wielkiego księcia, ale pozostaje w unii z Polską. Polska i Litwa były odtąd dwoma państwami połączonymi wspólnym władcą i wspólnymi interesami. Najważniejszym z tych interesów była rozprawa z zakonem krzyżackim. Zakon nie zamierzał bowiem pogodzić się z tym, że jego wróg przyjął chrzest. Twierdził, że chrzest Litwy jest fałszywy, i dalej najeżdżał jej ziemie, zwłaszcza Żmudź. Zbliżała się wielka wojna, która miała rozstrzygnąć, kto będzie panem w tej części Europy."
