  - clean: "Unia nie oznaczała, że na Litwie zapanował spokój. Jagiełło miał wielu braci i kuzynów, a każdy z nich chciał mieć udział we władzy. Najgroźniejszym z nich był jego stryjeczny brat Witold, syn Kiejstuta. Między obu rodzinami istniała krwawa zadra. W 1382 roku, w czasie walk o władzę, Kiejstut został uwięziony w tym samym zamku w Krewie i tam zginął, najprawdopodobniej uduszony na rozkaz Jagiełły. Witold uciekł z więzienia w przebraniu, podobno w stroju służącej żony, która go odwiedziła."
