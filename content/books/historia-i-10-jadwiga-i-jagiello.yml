  - clean: "Unia polsko-litewska była jednym z najdziwniejszych i najtrwalszych związków w historii Europy. Połączyła dwa bardzo różne kraje: katolickie królestwo z rozwiniętymi miastami i ogromne, wielonarodowe państwo, w którym obok siebie żyli poganie, prawosławni i katolicy. Przetrwała, w różnych formach, ponad czterysta lat, aż do rozbiorów pod koniec XVIII wieku. Dla Litwinów, Białorusinów i Ukraińców była to także epoka, którą dziś oceniają różnie: jedni widzą w niej okres rozkwitu, inni czas polonizacji ich elit. Jedno jest pewne: bez decyzji podjętej w Krewie historia całej Europy Wschodniej potoczyłaby się zupełnie inaczej."
