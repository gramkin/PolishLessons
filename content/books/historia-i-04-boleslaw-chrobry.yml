chapter: 4
chapterTitle: "Bolesław Chrobry"
chapterTitleRu: "Болеслав Храбрый"
level: B2
paragraphs:
  - clean: "Bolesław, syn Mieszka i Dobrawy, przyszedł na świat w 967 roku. Przydomek Chrobry, czyli „dzielny, waleczny”, nadali mu dopiero późniejsi kronikarze, ale pasuje do niego doskonale. Przez trzydzieści trzy lata swoich rządów prawie bez przerwy prowadził wojny, zawierał sojusze i budował potęgę państwa. Dla jednych był wielkim bohaterem, dla innych groźnym i podstępnym przeciwnikiem. Obydwa te obrazy są po części prawdziwe."
    draft: true
    chunks:
      - pl: "Bolesław, syn Mieszka i Dobrawy, przyszedł na świat w 967 roku."
        ru: "Болеслав, сын Мешко и Добравы, появился на свет в 967 году."
        note: "przyjść na świat — появиться на свет, родиться"
      - pl: " Przydomek Chrobry, czyli „dzielny, waleczny”, nadali mu dopiero późniejsi kronikarze, ale pasuje do niego doskonale."
        ru: "Прозвище Храбрый, то есть «доблестный, отважный», дали ему лишь поздние летописцы, но оно подходит ему превосходно."
        note: "przydomek — прозвище; chrobry — старинное «храбрый»; nadać — дать, присвоить"
      - pl: " Przez trzydzieści trzy lata swoich rządów prawie bez przerwy prowadził wojny, zawierał sojusze i budował potęgę państwa."
        ru: "За тридцать три года своего правления он почти непрерывно вёл войны, заключал союзы и укреплял мощь государства."
        note: "zawierać sojusz — заключать союз; potęga — могущество, мощь"
      - pl: " Dla jednych był wielkim bohaterem, dla innych groźnym i podstępnym przeciwnikiem."
        ru: "Для одних он был великим героем, для других — грозным и коварным противником."
        note: "podstępny — коварный"
      - pl: " Obydwa te obrazy są po części prawdziwe."
        ru: "Оба эти образа отчасти верны."
        note: "po części — отчасти"
    words: { "dzielny": dzielny, "nadali": nadac, "późniejsi": pozny, "trzydzieści": trzydziesci, "zawierał": zawierac, "sojusze": sojusz, "budował": budowac, "potęgę": potega, "groźnym": grozny, "przeciwnikiem": przeciwnik, "Obydwa": obydwa }
  - clean: "Rządy zaczął w sposób typowy dla tamtej epoki. Ojciec chciał, żeby państwo podzielili między siebie wszyscy jego synowie, ale Bolesław nie zamierzał się z nikim dzielić. Wygnał z kraju macochę Odę i jej synów, a ich zwolenników kazał oślepić. Okrucieństwo było w tamtych czasach zwykłym narzędziem władzy i Bolesław nie był pod tym względem wyjątkiem. Zjednoczone państwo przetrwało i to było dla niego najważniejsze."
    draft: true
    chunks:
      - pl: "Rządy zaczął w sposób typowy dla tamtej epoki."
        ru: "Правление он начал типичным для той эпохи образом."
      - pl: " Ojciec chciał, żeby państwo podzielili między siebie wszyscy jego synowie, ale Bolesław nie zamierzał się z nikim dzielić."
        ru: "Отец хотел, чтобы государство поделили между собой все его сыновья, но Болеслав не собирался ни с кем делиться."
        note: "zamierzać — намереваться"
      - pl: " Wygnał z kraju macochę Odę i jej synów, a ich zwolenników kazał oślepić."
        ru: "Он изгнал из страны мачеху Оду и её сыновей, а их сторонников велел ослепить."
        note: "zwolennik — сторонник; oślepić — ослепить"
      - pl: " Okrucieństwo było w tamtych czasach zwykłym narzędziem władzy i Bolesław nie był pod tym względem wyjątkiem."
        ru: "Жестокость была в те времена обычным орудием власти, и Болеслав не был в этом отношении исключением."
        note: "okrucieństwo — жестокость; pod tym względem — в этом отношении"
      - pl: " Zjednoczone państwo przetrwało i to było dla niego najważniejsze."
        ru: "Единое государство уцелело, и для него это было главным."
        note: "zjednoczony — объединённый"
    words: { "typowy": typowy, "podzielili": podzielic, "dzielić": dzielic, "narzędziem": narzedzie, "wyjątkiem": wyjatek, "Zjednoczone": zjednoczyc }
  - clean: "Gall Anonim opisuje jego armię z dumą i z liczbami. Według niego w samym Poznaniu stacjonowało tysiąc trzystu pancernych i cztery tysiące tarczowników, a w Gnieźnie jeszcze więcej. Łącznie Bolesław miał mieć prawie cztery tysiące pancernych i trzynaście tysięcy tarczowników. Liczby te są zapewne przesadzone, ale pokazują, że była to jedna z najsilniejszych armii w tej części Europy. Książę utrzymywał ją z danin i z łupów zdobytych na wojnach."
    draft: true
    chunks:
      - pl: "Gall Anonim opisuje jego armię z dumą i z liczbami."
        ru: "Галл Аноним описывает его войско с гордостью и с цифрами."
      - pl: " Według niego w samym Poznaniu stacjonowało tysiąc trzystu pancernych i cztery tysiące tarczowników, a w Gnieźnie jeszcze więcej."
        ru: "По его словам, в одной только Познани стояли тысяча триста латников и четыре тысячи щитоносцев, а в Гнезно — ещё больше."
        note: "stacjonować — стоять (о войске); pancerny — латник, тяжеловооружённый воин; tarczownik — щитоносец, легковооружённый воин"
      - pl: " Łącznie Bolesław miał mieć prawie cztery tysiące pancernych i trzynaście tysięcy tarczowników."
        ru: "Всего у Болеслава будто бы было почти четыре тысячи латников и тринадцать тысяч щитоносцев."
        note: "łącznie — в общей сложности; miał mieć — будто бы имел"
      - pl: " Liczby te są zapewne przesadzone, ale pokazują, że była to jedna z najsilniejszych armii w tej części Europy."
        ru: "Эти цифры, вероятно, преувеличены, но показывают, что это было одно из сильнейших войск в этой части Европы."
        note: "zapewne — вероятно; przesadzony — преувеличенный"
      - pl: " Książę utrzymywał ją z danin i z łupów zdobytych na wojnach."
        ru: "Князь содержал его на дань и на добычу, захваченную в войнах."
        note: "łup — добыча, трофей"
    words: { "dumą": duma, "Łącznie": lacznie, "zapewne": zapewne, "przesadzone": przesadzic, "utrzymywał": utrzymywac }
  - clean: "Najważniejszym wydarzeniem pierwszych lat panowania okazała się jednak śmierć pewnego biskupa. Wojciech, z pochodzenia Czech z możnego rodu Sławnikowiców, był biskupem Pragi. Popadł w konflikt z księciem czeskim, który wymordował prawie całą jego rodzinę. Wojciech znalazł schronienie na dworze Bolesława. W 997 roku wyruszył stąd na misję do pogańskich Prusów, którzy mieszkali nad Bałtykiem na wschód od Wisły. Bolesław dał mu łódź i zbrojną eskortę."
    draft: true
    chunks:
      - pl: "Najważniejszym wydarzeniem pierwszych lat panowania okazała się jednak śmierć pewnego biskupa."
        ru: "Однако важнейшим событием первых лет правления оказалась смерть одного епископа."
      - pl: " Wojciech, z pochodzenia Czech z możnego rodu Sławnikowiców, był biskupem Pragi."
        ru: "Войцех, по происхождению чех из знатного рода Славниковичей, был епископом Праги."
        note: "z pochodzenia — по происхождению; Wojciech — по-чешски Vojtěch, в святцах Адальберт"
      - pl: " Popadł w konflikt z księciem czeskim, który wymordował prawie całą jego rodzinę."
        ru: "Он вступил в конфликт с чешским князем, который перебил почти всю его семью."
        note: "popaść w konflikt — вступить в конфликт; wymordować — перебить, вырезать"
      - pl: " Wojciech znalazł schronienie na dworze Bolesława."
        ru: "Войцех нашёл приют при дворе Болеслава."
        note: "schronienie — убежище, приют"
      - pl: " W 997 roku wyruszył stąd na misję do pogańskich Prusów, którzy mieszkali nad Bałtykiem na wschód od Wisły."
        ru: "В 997 году он отправился отсюда с миссией к языческим пруссам, жившим на Балтике к востоку от Вислы."
        note: "wyruszyć — отправиться, выступить"
      - pl: " Bolesław dał mu łódź i zbrojną eskortę."
        ru: "Болеслав дал ему лодку и вооружённую охрану."
        note: "zbrojny — вооружённый"
    words: { "rodu": rod-2, "konflikt": konflikt, "schronienie": schronienie, "dworze": dwor, "wyruszył": wyruszyc, "wschód": wschod }
  - clean: "Prusowie nie chcieli słuchać kazań obcego przybysza. Przepędzali go z miejsca na miejsce, a 23 kwietnia 997 roku zabili go, prawdopodobnie gdzieś w pobliżu dzisiejszego Elbląga albo na Sambii. Bolesław wykupił jego ciało i pochował je w Gnieźnie. Legenda mówi, że zapłacił za nie tyle złota, ile ważyło. Już w 999 roku papież ogłosił Wojciecha świętym. Polska zyskała własnego męczennika, a to w średniowieczu miało ogromne znaczenie: grób świętego przyciągał pielgrzymów i dodawał krajowi prestiżu."
    draft: true
    chunks:
      - pl: "Prusowie nie chcieli słuchać kazań obcego przybysza."
        ru: "Пруссы не хотели слушать проповедей чужого пришельца."
        note: "kazanie — проповедь; przybysz — пришелец"
      - pl: " Przepędzali go z miejsca na miejsce, a 23 kwietnia 997 roku zabili go, prawdopodobnie gdzieś w pobliżu dzisiejszego Elbląga albo na Sambii."
        ru: "Они прогоняли его с места на место, а 23 апреля 997 года убили — вероятно, где-то возле нынешнего Эльблонга или на Самбии."
        note: "przepędzać — прогонять; w pobliżu — поблизости; Sambia — Самбийский полуостров, ныне Калининградская область"
      - pl: " Bolesław wykupił jego ciało i pochował je w Gnieźnie."
        ru: "Болеслав выкупил его тело и похоронил его в Гнезно."
        note: "wykupić — выкупить"
      - pl: " Legenda mówi, że zapłacił za nie tyle złota, ile ważyło."
        ru: "Легенда гласит, что он заплатил за него столько золота, сколько оно весило."
        note: "ważyć — весить"
      - pl: " Już w 999 roku papież ogłosił Wojciecha świętym."
        ru: "Уже в 999 году папа провозгласил Войцеха святым."
        note: "ogłosić — объявить, провозгласить"
      - pl: " Polska zyskała własnego męczennika, a to w średniowieczu miało ogromne znaczenie: grób świętego przyciągał pielgrzymów i dodawał krajowi prestiżu."
        ru: "Польша обрела собственного мученика, а в Средние века это имело огромное значение: могила святого привлекала паломников и придавала стране престиж."
        note: "męczennik — мученик; pielgrzym — паломник; przyciągać — притягивать"
    words: { "kwietnia": kwiecien, "pochował": pochowac, "Legenda": legenda, "ważyło": wazyc, "papież": papiez, "ogłosił": oglosic, "zyskała": zyskac, "grób": grob, "przyciągał": przyciagac, "dodawał": dodawac }
  - clean: "Wojciech nie był jedynym męczennikiem tamtych lat. Bolesław sprowadził do Polski grupę mnichów z Włoch, którzy mieli prowadzić misję wśród pogańskich Słowian. W 1003 roku pięciu z nich zamordowali w ich pustelni rabusie, którzy szukali pieniędzy. Kościół czci ich jako Pięciu Braci Męczenników, pierwszych świętych, którzy zginęli na ziemiach polskich. Ich historię opisał Bruno z Kwerfurtu, niemiecki misjonarz i przyjaciel Bolesława, który kilka lat później sam zginął śmiercią męczeńską, próbując nawracać Prusów. Bruno był jednym z nielicznych Niemców, którzy w sporze Bolesława z cesarzem stanęli po stronie polskiego księcia."
    draft: true
    chunks:
      - pl: "Wojciech nie był jedynym męczennikiem tamtych lat."
        ru: "Войцех был не единственным мучеником тех лет."
      - pl: " Bolesław sprowadził do Polski grupę mnichów z Włoch, którzy mieli prowadzić misję wśród pogańskich Słowian."
        ru: "Болеслав пригласил в Польшу группу монахов из Италии, которые должны были вести миссию среди языческих славян."
      - pl: " W 1003 roku pięciu z nich zamordowali w ich pustelni rabusie, którzy szukali pieniędzy."
        ru: "В 1003 году пятерых из них убили в их пустыни разбойники, искавшие денег."
        note: "pustelnia — пустынь, скит; rabuś — грабитель"
      - pl: " Kościół czci ich jako Pięciu Braci Męczenników, pierwszych świętych, którzy zginęli na ziemiach polskich."
        ru: "Церковь чтит их как Пятерых братьев-мучеников, первых святых, погибших на польских землях."
      - pl: " Ich historię opisał Bruno z Kwerfurtu, niemiecki misjonarz i przyjaciel Bolesława, który kilka lat później sam zginął śmiercią męczeńską, próbując nawracać Prusów."
        ru: "Их историю описал Бруно Кверфуртский, немецкий миссионер и друг Болеслава, который несколько лет спустя сам принял мученическую смерть, пытаясь обращать пруссов."
      - pl: " Bruno był jednym z nielicznych Niemców, którzy w sporze Bolesława z cesarzem stanęli po stronie polskiego księcia."
        ru: "Бруно был одним из немногих немцев, которые в споре Болеслава с императором встали на сторону польского князя."
    words: { "mnichów": mnich, "polskich": polski, "opisał": opisac, "niemiecki": niemiecki, "cesarzem": cesarz, "polskiego": polski }
  - clean: "Kult świętego Wojciecha stał się jednym z filarów polskiej tożsamości. Jego grób w Gnieźnie był najważniejszym sanktuarium kraju aż do czasów, kiedy Czesi wykradli jego relikwie, o czym opowiemy w następnym rozdziale. W XII wieku dla katedry gnieźnieńskiej odlano z brązu wielkie drzwi, na których w osiemnastu scenach przedstawiono życie i śmierć świętego. Drzwi Gnieźnieńskie należą do najcenniejszych dzieł sztuki romańskiej w Europie i można je oglądać do dziś. Tradycja przypisuje świętemu Wojciechowi nawet autorstwo „Bogurodzicy”, najstarszej polskiej pieśni, ale historycy uważają to za legendę. Do dziś święty Wojciech jest jednym z patronów Polski, a w kwietniu do Gniezna przybywają tłumy pielgrzymów."
    draft: true
    chunks:
      - pl: "Kult świętego Wojciecha stał się jednym z filarów polskiej tożsamości."
        ru: "Культ святого Войцеха стал одной из опор польского самосознания."
      - pl: " Jego grób w Gnieźnie był najważniejszym sanktuarium kraju aż do czasów, kiedy Czesi wykradli jego relikwie, o czym opowiemy w następnym rozdziale."
        ru: "Его гробница в Гнезно была главной святыней страны вплоть до того времени, когда чехи похитили его мощи, о чём мы расскажем в следующей главе."
        note: "sanktuarium — святыня; wykraść — похитить"
      - pl: " W XII wieku dla katedry gnieźnieńskiej odlano z brązu wielkie drzwi, na których w osiemnastu scenach przedstawiono życie i śmierć świętego."
        ru: "В XII веке для Гнезненского собора отлили из бронзы большие двери, на которых в восемнадцати сценах изображены жизнь и смерть святого."
        note: "odlać — отлить; brąz — бронза"
      - pl: " Drzwi Gnieźnieńskie należą do najcenniejszych dzieł sztuki romańskiej w Europie i można je oglądać do dziś."
        ru: "Гнезненские двери принадлежат к ценнейшим произведениям романского искусства в Европе, и их можно увидеть до сих пор."
        note: "romański — романский"
      - pl: " Tradycja przypisuje świętemu Wojciechowi nawet autorstwo „Bogurodzicy”, najstarszej polskiej pieśni, ale historycy uważają to za legendę."
        ru: "Предание приписывает святому Войцеху даже авторство «Богородицы», древнейшей польской песни, но историки считают это легендой."
        note: "autorstwo — авторство"
      - pl: " Do dziś święty Wojciech jest jednym z patronów Polski, a w kwietniu do Gniezna przybywają tłumy pielgrzymów."
        ru: "Святой Войцех до сих пор — один из покровителей Польши, а в апреле в Гнезно прибывают толпы паломников."
    words: { "grób": grob, "polskiej": polski, "tożsamości": tozsamosc, "rozdziale": rozdzial, "najcenniejszych": cenny, "dzieł": dzielo, "Tradycja": tradycja, "pieśni": piesn, "legendę": legenda, "kwietniu": kwiecien, "przybywają": przybywac, "tłumy": tlum }
  - clean: "Wkrótce okazało się, jak bardzo grób Wojciecha był cenny. Cesarz Otton III, młody i bardzo pobożny, przyjaźnił się z Wojciechem i był wstrząśnięty jego śmiercią. Postanowił odbyć pielgrzymkę do grobu przyjaciela. W marcu 1000 roku przybył do Gniezna. Według tradycji ostatni odcinek drogi przeszedł boso. Spotkanie cesarza z polskim księciem przeszło do historii jako zjazd gnieźnieński."
    draft: true
    chunks:
      - pl: "Wkrótce okazało się, jak bardzo grób Wojciecha był cenny."
        ru: "Вскоре выяснилось, насколько ценна была могила Войцеха."
      - pl: " Cesarz Otton III, młody i bardzo pobożny, przyjaźnił się z Wojciechem i był wstrząśnięty jego śmiercią."
        ru: "Император Оттон III, молодой и очень набожный, дружил с Войцехом и был потрясён его смертью."
        note: "przyjaźnić się — дружить; wstrząśnięty — потрясённый"
      - pl: " Postanowił odbyć pielgrzymkę do grobu przyjaciela."
        ru: "Он решил совершить паломничество к могиле друга."
        note: "odbyć pielgrzymkę — совершить паломничество"
      - pl: " W marcu 1000 roku przybył do Gniezna."
        ru: "В марте 1000 года он прибыл в Гнезно."
        note: "w 1000 roku — w roku tysięcznym"
      - pl: " Według tradycji ostatni odcinek drogi przeszedł boso."
        ru: "Согласно преданию, последний отрезок пути он прошёл босиком."
        note: "odcinek — отрезок; boso — босиком"
      - pl: " Spotkanie cesarza z polskim księciem przeszło do historii jako zjazd gnieźnieński."
