  - clean: "Jak rządził Bolesław swoim ogromnym państwem? Podstawą była sieć grodów, w których rezydowali urzędnicy księcia, nazywani komesami. Komes dowodził załogą, sądził ludzi, zbierał daniny i pilnował dróg. Sam książę nieustannie podróżował z dworem od grodu do grodu, bo tylko w ten sposób mógł kontrolować kraj i korzystać z danin, które trudno było przewozić. Bolesław bił też własne monety, srebrne denary. Na jednej z nich, wybitej około roku tysięcznego, pojawia się łaciński napis „Princes Polonie”, czyli „książę Polski”. Jest to jedno z najstarszych świadectw nazwy naszego kraju. Monety te miały jednak znaczenie bardziej prestiżowe niż gospodarcze, bo w codziennym handlu wciąż używano kawałków srebra ważonych na wagach."
