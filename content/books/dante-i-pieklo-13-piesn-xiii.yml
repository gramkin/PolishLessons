# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 13
chapterTitle: "Pieśń XIII"
chapterTitleRu: "Песнь XIII. Лес самоубийц"
level: B2
paragraphs:
  - clean: "(Krąg VII. Koło drugie: samobójcy, Piotr a Vineis, gracze.)"
    chunks:
      - pl: "(Krąg VII. Koło drugie: samobójcy, Piotr a Vineis, gracze.)"
        ru: "(Круг VII. Пояс второй: самоубийцы, Пьетро делла Винья, игроки.)"
        note: "samobójca — самоубийца; Piotr a Vineis — Пьер делла Винья"
    words: { "Krąg": krag, "Koło": kolo }
  - clean: "Jeszcze przechodził Nessus bród czerwony,\nGdyśmy wchodzili w las dalszym pochodem,\nW las pusty, żadną ścieżką nieznaczony.\nTam liść na drzewach czarny, nie zielony,\nGałęzie krzywe, zwikłane niezmiernie,\nZamiast owoców trucizna i ciernie."
    verse: true
    chunks:
      - pl: "Jeszcze przechodził Nessus bród czerwony,"
        ru: "Ещё переходил Несс красный брод,"
      - pl: "\nGdyśmy wchodzili w las dalszym pochodem,"
        ru: "когда мы вступали в лес дальнейшим походом,"
        note: "pochód — шествие, поход"
      - pl: "\nW las pusty, żadną ścieżką nieznaczony."
        ru: "в лес пустой, не отмеченный никакой тропой."
        note: "znaczony — отмеченный"
      - pl: "\nTam liść na drzewach czarny, nie zielony,"
        ru: "Там лист на деревьях чёрный, не зелёный,"
      - pl: "\nGałęzie krzywe, zwikłane niezmiernie,"
        ru: "ветви кривые, безмерно спутанные,"
        note: "zwikłany — спутанный; niezmiernie — безмерно"
      - pl: "\nZamiast owoców trucizna i ciernie."
        ru: "вместо плодов — яд и терновник."
        note: "trucizna — яд; ciernie — тернии"
    words: { "przechodził": przechodzic, "ścieżką": sciezka, "drzewach": drzewo, "zielony": zielony, "owoców": owoc, "trucizna": trucizna }
  - clean: "W gęstszej zarośli nie mieszka zwierz dziki,\nCo się kłem znęca nad żyzną doliną,\nMiędzy Korneto a rzeką Cecyną.\nTam gniazda mają harpije, straszydła,\nKtóre ze Strofad przegnały Trojanów\nNa nieznajome wody oceanów,\nSmutnym proroctwem trwożąc wędrowniki;\nSzyja, twarz ludzkie, a szerokie skrzydła,\nBrzuch pierzem kryty, nogi ze szponami,\nA napełniają cały las żalami."
    verse: true
    chunks:
      - pl: "W gęstszej zarośli nie mieszka zwierz dziki,"
        ru: "В более густых зарослях не живёт дикий зверь,"
        note: "zarośl — заросль"
      - pl: "\nCo się kłem znęca nad żyzną doliną,"
        ru: "что клыком терзает плодородную долину"
        note: "kieł — клык; znęcać się — издеваться, терзать; żyzny — плодородный"
      - pl: "\nMiędzy Korneto a rzeką Cecyną."
        ru: "между Корнето и рекой Чечиной."
      - pl: "\nTam gniazda mają harpije, straszydła,"
        ru: "Там гнёзда имеют гарпии, страшилища,"
        note: "straszydło — страшилище"
      - pl: "\nKtóre ze Strofad przegnały Trojanów"
        ru: "что со Строфад прогнали троянцев"
        note: "przegnać — прогнать"
      - pl: "\nNa nieznajome wody oceanów,"
        ru: "на незнакомые воды океанов,"
      - pl: "\nSmutnym proroctwem trwożąc wędrowniki;"
        ru: "печальным пророчеством пугая странников;"
        note: "trwożyć — пугать; wędrowniki — устар. мн. «странники»"
      - pl: "\nSzyja, twarz ludzkie, a szerokie skrzydła,"
        ru: "шея, лицо человеческие, а широкие крылья,"
      - pl: "\nBrzuch pierzem kryty, nogi ze szponami,"
        ru: "брюхо, покрытое пером, ноги с когтями,"
        note: "pierze — перья"
      - pl: "\nA napełniają cały las żalami."
        ru: "и наполняют весь лес жалобами."
    words: { "zwierz": zwierz, "doliną": dolina, "gniazda": gniazdo, "szerokie": szeroki, "kryty": kryc, "żalami": zal }
  - clean: "Mistrz tak się ozwał po milczeniu długim;\n«Wiedz, że iść będziesz wciąż obwodem drugim\nPóty, aż wstąpisz w step okropnych piasków.\nDlatego dobrze wytężaj tu oko.\nA rzeczy ujrzysz tak dziwne jak mary,\nCo z ust mych słysząc, nie dałbyś mi wiary»."
    verse: true
    chunks:
      - pl: "Mistrz tak się ozwał po milczeniu długim;"
        ru: "Учитель так заговорил после долгого молчания:"
        note: "ozwać się — заговорить"
      - pl: "\n«Wiedz, że iść będziesz wciąż obwodem drugim"
        ru: "«Знай, что ты будешь идти всё вторым поясом,"
        note: "obwód — пояс, окружность"
      - pl: "\nPóty, aż wstąpisz w step okropnych piasków."
        ru: "пока не вступишь в степь страшных песков."
        note: "póty, aż — до тех пор, пока"
      - pl: "\nDlatego dobrze wytężaj tu oko."
        ru: "Поэтому хорошо напрягай здесь глаза,"
        note: "wytężać — напрягать"
      - pl: "\nA rzeczy ujrzysz tak dziwne jak mary,"
        ru: "и увидишь вещи, странные, как призраки,"
        note: "mara — призрак"
      - pl: "\nCo z ust mych słysząc, nie dałbyś mi wiary»."
        ru: "что, слыша из моих уст, ты бы мне не поверил»."
        note: "dać wiarę — поверить"
    words: { "Mistrz": mistrz, "obwodem": obwod, "wstąpisz": wstapic, "piasków": piasek, "ujrzysz": ujrzec, "wiary": wiara }
  - clean: "Już las jękami pobrzmiewał szeroko;\nNie widząc, co jest przyczyną tych wrzasków,\nStanąłem jak słup i tak żem się zdumiał,\nŻe mistrz mój sądził, jakobym rozumiał,\nIż te jęczenia wyszły z piersi żywych\nJakichś zakrytych dla nas nieszczęśliwych!"
    verse: true
    chunks:
      - pl: "Już las jękami pobrzmiewał szeroko;"
        ru: "Уже лес широко звучал стонами;"
      - pl: "\nNie widząc, co jest przyczyną tych wrzasków,"
        ru: "не видя, что причина этих воплей,"
      - pl: "\nStanąłem jak słup i tak żem się zdumiał,"
        ru: "я остановился как столб и так изумился,"
        note: "słup — столб; zdumieć się — изумиться"
      - pl: "\nŻe mistrz mój sądził, jakobym rozumiał,"
        ru: "что мой учитель решил, будто я думаю,"
        note: "jakobym — будто бы я"
      - pl: "\nIż te jęczenia wyszły z piersi żywych"
        ru: "что эти стоны вышли из груди живых,"
      - pl: "\nJakichś zakrytych dla nas nieszczęśliwych!"
        ru: "каких-то скрытых от нас несчастных!"
    words: { "przyczyną": przyczyna, "Stanąłem": stanac, "słup": slup, "piersi": piers, "żywych": zywy, "nieszczęśliwych": nieszczesliwy }
  - clean: "I mistrz rzekł do mnie: «Ot złam gałąź krzywą,\nA błąd swój poznasz». Jam wnet niecierpliwą\nWyciągnął rękę i gałąź uszczyknął.\n«Po co mnie łamiesz?» nagle pień zakrzyknął;\nKrwią cały sczerniał i znów mówił z krzykiem:\n«Dlaczego szarpiesz mnie z sercem tak dzikiem?"
    verse: true
    chunks:
      - pl: "I mistrz rzekł do mnie: «Ot złam gałąź krzywą,"
        ru: "И учитель сказал мне: «Ну, сломай кривую ветвь,"
        note: "ot — ну, вот"
      - pl: "\nA błąd swój poznasz». Jam wnet niecierpliwą"
        ru: "и ты узнаешь свою ошибку». Я тотчас нетерпеливую"
      - pl: "\nWyciągnął rękę i gałąź uszczyknął."
        ru: "протянул руку и отщипнул ветку."
        note: "uszczyknąć — отщипнуть"
      - pl: "\n«Po co mnie łamiesz?» nagle pień zakrzyknął;"
        ru: "«Зачем ты меня ломаешь?» — вдруг крикнул ствол;"
        note: "pień — ствол"
      - pl: "\nKrwią cały sczerniał i znów mówił z krzykiem:"
        ru: "весь почернел от крови и снова говорил с криком:"
        note: "sczernieć — почернеть"
      - pl: "\n«Dlaczego szarpiesz mnie z sercem tak dzikiem?"
        ru: "«Зачем ты рвёшь меня с таким диким сердцем?"
        note: "dzikiem — ныне dzikim"
    words: { "rzekł": rzec, "złam": zlamac, "Wyciągnął": wyciagnac, "łamiesz": lamac, "nagle": nagle, "krzykiem": krzyk }
  - clean: "Byliśmy ludźmi, jesteśmy drzewami,\nWięcej litości mógłbyś mieć nad nami,\nChoćbyśmy byli robactwa duszami».\nJak jednym końcem gore zapalona,\nA drugim syczy, skrzy głownia zielona.\nZiejąc powietrze, co się w niej zagrzewa,\nTak krew i słowa szły z pnia tego drzewa."
    verse: true
    chunks:
      - pl: "Byliśmy ludźmi, jesteśmy drzewami,"
        ru: "Мы были людьми, мы стали деревьями,"
      - pl: "\nWięcej litości mógłbyś mieć nad nami,"
        ru: "больше жалости ты мог бы иметь к нам,"
      - pl: "\nChoćbyśmy byli robactwa duszami»."
        ru: "будь мы даже душами гадов»."
        note: "robactwo — гады, черви"
      - pl: "\nJak jednym końcem gore zapalona,"
        ru: "Как зелёная головня, зажжённая с одного конца,"
        note: "gore — книжн. «горит»"
      - pl: "\nA drugim syczy, skrzy głownia zielona."
        ru: "а другим шипит, искрится,"
        note: "syczeć — шипеть; skrzyć się — искриться"
      - pl: "\nZiejąc powietrze, co się w niej zagrzewa,"
        ru: "выдыхая воздух, что в ней нагревается,"
        note: "ziać — дышать, выпускать; zagrzewać się — нагреваться"
      - pl: "\nTak krew i słowa szły z pnia tego drzewa."
        ru: "так кровь и слова шли из ствола этого дерева."
    words: { "litości": litosc, "zapalona": zapalic, "syczy": syczec, "Ziejąc": ziac, "powietrze": powietrze, "krew": krew }
  - clean: "I upuściłem gałązkę pod nogi,\nStając jak człowiek potruchlały z trwogi.\n«Zraniona duszo!» mistrz mój odpowiedział:\n«Gdyby on wierzył w to, co jednak wiedział,\nCzytając moje na ziemi poema,\nNigdy by ręki nie podniósł na ciebie."
    verse: true
    chunks:
      - pl: "I upuściłem gałązkę pod nogi,"
        ru: "И я уронил веточку под ноги,"
      - pl: "\nStając jak człowiek potruchlały z trwogi."
        ru: "стоя, как человек, оцепеневший от страха."
        note: "potruchlały — оцепеневший от страха"
      - pl: "\n«Zraniona duszo!» mistrz mój odpowiedział:"
        ru: "«Раненая душа! — ответил мой учитель. —"
      - pl: "\n«Gdyby on wierzył w to, co jednak wiedział,"
        ru: "Если бы он верил в то, что всё же знал,"
      - pl: "\nCzytając moje na ziemi poema,"
        ru: "читая мою поэму на земле,"
        note: "poema — устар. ср. р., ныне poemat"
      - pl: "\nNigdy by ręki nie podniósł na ciebie."
        ru: "он никогда не поднял бы на тебя руки."
    words: { "upuściłem": upuscic, "Stając": stawac, "Zraniona": zranic, "duszo": dusza, "odpowiedział": odpowiedziec, "podniósł": podniesc }
  - clean: "Widząc, że pełnej w tę rzecz wiary nie ma,\nUszczknąć twą gałąź poradziłem jemu,\nCo, wierz mi, sobie wyrzucam samemu.\nLecz chciej, kim byłeś, powiedzieć poecie,\nOn z niepamięci twe imię odgrzebie,\nOn twoją pamięć odświeży na świecie,\nGdzie ma powrócić i żyć tam na nowo»."
    verse: true
    chunks:
      - pl: "Widząc, że pełnej w tę rzecz wiary nie ma,"
        ru: "Видя, что полной веры в это у него нет,"
      - pl: "\nUszczknąć twą gałąź poradziłem jemu,"
        ru: "я посоветовал ему отщипнуть твою ветвь,"
        note: "uszczknąć — отщипнуть"
      - pl: "\nCo, wierz mi, sobie wyrzucam samemu."
        ru: "что, поверь мне, сам себе ставлю в упрёк."
        note: "wyrzucać sobie — упрекать себя"
      - pl: "\nLecz chciej, kim byłeś, powiedzieć poecie,"
        ru: "Но изволь сказать поэту, кем ты был,"
      - pl: "\nOn z niepamięci twe imię odgrzebie,"
        ru: "он из забвения откопает твоё имя,"
        note: "niepamięć — забвение; odgrzebać — откопать"
      - pl: "\nOn twoją pamięć odświeży na świecie,"
        ru: "он освежит твою память на свете,"
      - pl: "\nGdzie ma powrócić i żyć tam na nowo»."
        ru: "куда должен вернуться и жить там снова»."
    words: { "pełnej": pelny, "poradziłem": poradzic, "wyrzucam": wyrzucac, "poecie": poeta, "pamięć": pamiec, "powrócić": powrocic }
  - clean: "A drzewo: «Nęcisz mnie tak słodką mową,\nMilczeć nie mogę, lecz ostrzeżcie sami,\nJeśli za długo mówić będę z wami.\nJestem ten, który rządził Fryderykiem,\nOd jego serca dwa klucze trzymałem,\nPierwszy zamykał, drugi je otwierał\nJak własny zamek; w jego państwie całem\nByłem jedynym jego powiernikiem,\nOn mnie podnosił i na mnie się wspierał;\nJa tak gorliwy byłem w tym zaszczycie,\nŻe przezeń sen mój straciłem i życie."
    verse: true
    chunks:
      - pl: "A drzewo: «Nęcisz mnie tak słodką mową,"
        ru: "А дерево: «Ты манишь меня такой сладкой речью,"
        note: "nęcić — манить"
      - pl: "\nMilczeć nie mogę, lecz ostrzeżcie sami,"
        ru: "молчать не могу, но остерегите сами,"
      - pl: "\nJeśli za długo mówić będę z wami."
        ru: "если я слишком долго буду говорить с вами."
      - pl: "\nJestem ten, który rządził Fryderykiem,"
        ru: "Я тот, кто управлял Фридрихом,"
        note: "Фридрих II"
      - pl: "\nOd jego serca dwa klucze trzymałem,"
        ru: "от его сердца я держал два ключа:"
      - pl: "\nPierwszy zamykał, drugi je otwierał"
        ru: "первым запирал, вторым его отпирал,"
      - pl: "\nJak własny zamek; w jego państwie całem"
        ru: "как собственный замок; во всём его государстве"
      - pl: "\nByłem jedynym jego powiernikiem,"
        ru: "я был единственным его доверенным,"
        note: "powiernik — доверенное лицо"
      - pl: "\nOn mnie podnosił i na mnie się wspierał;"
        ru: "он меня возвышал и на меня опирался;"
        note: "wspierać się — опираться"
      - pl: "\nJa tak gorliwy byłem w tym zaszczycie,"
        ru: "я был так ревностен в этой почётной службе,"
        note: "gorliwy — ревностный"
      - pl: "\nŻe przezeń sen mój straciłem i życie."
        ru: "что из-за неё потерял сон и жизнь."
        note: "przezeń = przez niego"
    words: { "Milczeć": milczec, "rządził": rzadzic, "zamykał": zamykac, "podnosił": podnosic, "wspierał": wspierac, "zaszczycie": zaszczyt }
  - clean: "Lecz nierządnica, co w dworzan nacisku\nBezwstydnym okiem strzelała dla zysku,\nPowszednia klęska i dworów zakała,\nZażegła wszystkie przeciw mnie umysły.\nI tak zawistni iskrą po iskierce\nNa mnie Augusta zapalili serce,\nŻe z dwojga słońc-ócz noc dla mnie się stała,\nJak wodne bańki mi źrenice prysły."
    verse: true
    chunks:
      - pl: "Lecz nierządnica, co w dworzan nacisku"
        ru: "Но блудница, что в давке придворных"
        note: "nierządnica — блудница; Зависть; dworzanin — придворный"
      - pl: "\nBezwstydnym okiem strzelała dla zysku,"
        ru: "бесстыдным глазом стреляла ради выгоды,"
        note: "bezwstydny — бесстыдный"
      - pl: "\nPowszednia klęska i dworów zakała,"
        ru: "общая беда и позор дворов,"
        note: "powszedni — повседневный, общий"
      - pl: "\nZażegła wszystkie przeciw mnie umysły."
        ru: "разожгла против меня все умы."
        note: "zażegnąć — разжечь"
      - pl: "\nI tak zawistni iskrą po iskierce"
        ru: "И так завистники, искра за искоркой,"
        note: "zawistny — завистливый; iskierka — искорка"
      - pl: "\nNa mnie Augusta zapalili serce,"
        ru: "против меня зажгли сердце Августа,"
        note: "Август — здесь император"
      - pl: "\nŻe z dwojga słońc-ócz noc dla mnie się stała,"
        ru: "что из двух солнц-очей ночь для меня стала,"
        note: "ócz — устар. род. мн. «очей»; его ослепили"
      - pl: "\nJak wodne bańki mi źrenice prysły."
        ru: "как водяные пузыри, мои зрачки лопнули."
        note: "prysnąć — лопнуть"
    words: { "nacisku": nacisk, "zysku": zysk, "dworów": dwor, "umysły": umysl, "słońc": slonce, "wodne": wodny }
  - clean: "A dusza moja, możem był zbyt hardy,\nWierząc, że śmiercią zetrze piętno wzgardy,\nMnie uczyniła przeciw mnie samego\nNiesprawiedliwym ze sprawiedliwego.\nKlnę się na świeży korzeń tego drzewa,\nŻem nigdy wiary przez mój wstręt przyrodny\nNie zdradził pana, co był jej tak godny!"
    verse: true
    chunks:
      - pl: "A dusza moja, możem był zbyt hardy,"
        ru: "А душа моя — может, я был слишком надменен, —"
        note: "możem = może + -m"
      - pl: "\nWierząc, że śmiercią zetrze piętno wzgardy,"
        ru: "веря, что смертью сотрёт клеймо презрения,"
        note: "zetrzeć — стереть; wzgarda — презрение"
      - pl: "\nMnie uczyniła przeciw mnie samego"
        ru: "сделала меня против меня самого"
      - pl: "\nNiesprawiedliwym ze sprawiedliwego."
        ru: "несправедливым из справедливого."
      - pl: "\nKlnę się na świeży korzeń tego drzewa,"
        ru: "Клянусь свежим корнем этого дерева,"
        note: "kląć się na coś — клясться чем-л."
      - pl: "\nŻem nigdy wiary przez mój wstręt przyrodny"
        ru: "что я никогда верности из-за врождённой неприязни"
        note: "przyrodny — врождённый"
      - pl: "\nNie zdradził pana, co był jej tak godny!"
        ru: "не изменил господину, что был её так достоин!"
