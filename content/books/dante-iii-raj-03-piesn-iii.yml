      - pl: "\nTak coś boskiego wzrok mój do was nęci,"
        ru: "Так что-то божественное влечёт к вам мой взгляд,"
      - pl: "\nŻe pierwszy rys wasz spłowiał w mej pamięci."
        ru: "что первые ваши черты поблёкли в моей памяти."
    words: { "różne": rozny, "złamali": zlamac, "wasz": wasz, "boskiego": boski, "pierwszy": pierwszy, "pamięci": pamiec }
  - clean: "Długo szukałem ciebie w przypomnieniu,\nGdy mi pomagasz, zwąc się po imieniu,\nPoznaję, jakbym cię widział od wczoraj.\nLecz powiedz, tu, gdyś wiekuiście błoga,\nCzy do sfer wyższych nie tęsknisz goręcej,\nAżeby bliżej spoglądać na Boga,\nKochać go więcej, być kochaną więcej?»"
    verse: true
    chunks:
      - pl: "Długo szukałem ciebie w przypomnieniu,"
        ru: "Долго я искал тебя в воспоминании,"
      - pl: "\nGdy mi pomagasz, zwąc się po imieniu,"
        ru: "когда ты мне помогаешь, называясь по имени,"
      - pl: "\nPoznaję, jakbym cię widział od wczoraj."
        ru: "узнаю, будто видел тебя со вчерашнего дня."
      - pl: "\nLecz powiedz, tu, gdyś wiekuiście błoga,"
        ru: "Но скажи: здесь, где ты вечно блаженна,"
      - pl: "\nCzy do sfer wyższych nie tęsknisz goręcej,"
        ru: "не тоскуешь ли ты горячее по высшим сферам,"
      - pl: "\nAżeby bliżej spoglądać na Boga,"
        ru: "чтобы ближе смотреть на Бога,"
      - pl: "\nKochać go więcej, być kochaną więcej?»"
        ru: "больше любить его, быть больше любимой?»"
    words: { "przypomnieniu": przypomniec, "zwąc": zwac, "Poznaję": poznawac, "tęsknisz": tesknic, "bliżej": blisko, "spoglądać": spogladac }
  - clean: "Wtem uśmiech, w którym prześwieca pokora,\nJej twarz i drugich oświecił dokoła,\nI przemówiła do mnie tak wesoła,\nŻe mi się zdała z światła, jakim błyska,\nPłonąć miłością z pierwszego ogniska.\n— «Bracie! Tu miłość żar woli przygasza,\nChęć w tym, co mamy, określa jej władza,\nOna dóbr innych pragnąć nam odradza."
    verse: true
    chunks:
      - pl: "Wtem uśmiech, w którym prześwieca pokora,"
        ru: "Тут улыбка, в которой просвечивает смирение,"
      - pl: "\nJej twarz i drugich oświecił dokoła,"
        ru: "озарила её лицо и лица других вокруг,"
      - pl: "\nI przemówiła do mnie tak wesoła,"
        ru: "и она заговорила со мной столь весёлая,"
      - pl: "\nŻe mi się zdała z światła, jakim błyska,"
        ru: "что мне показалось по свету, каким она блещет,"
      - pl: "\nPłonąć miłością z pierwszego ogniska."
        ru: "она пылает любовью из первого очага."
      - pl: "\n— «Bracie! Tu miłość żar woli przygasza,"
        ru: "— «Брат! Здесь любовь притушает жар воли,"
      - pl: "\nChęć w tym, co mamy, określa jej władza,"
        ru: "её власть ограничивает желание тем, что мы имеем,"
      - pl: "\nOna dóbr innych pragnąć nam odradza."
        ru: "она отговаривает нас желать иных благ."
    words: { "dokoła": dokola, "przemówiła": przemowic, "wesoła": wesoly, "Płonąć": plonac, "ogniska": ognisko, "pragnąć": pragnac }
  - clean: "Gdybyśmy sami, na przekór pokorze\nWyżej być chcieli, chęć i wola nasza\nByłyby zaraz z wolą tego w sporze,\nKtórego mądrość nas tu współgromadzi:\nA zgodą stoi to królestwo boże.\nGdy bliżej poznasz naturę sfer nieba,\nPrzyznasz, że tu żyć w miłości potrzeba."
    verse: true
    chunks:
      - pl: "Gdybyśmy sami, na przekór pokorze"
        ru: "Если бы мы сами, наперекор смирению,"
      - pl: "\nWyżej być chcieli, chęć i wola nasza"
        ru: "хотели быть выше, наше желание и воля"
      - pl: "\nByłyby zaraz z wolą tego w sporze,"
        ru: "тотчас были бы в споре с волей Того,"
      - pl: "\nKtórego mądrość nas tu współgromadzi:"
        ru: "чья мудрость собирает нас здесь вместе:"
      - pl: "\nA zgodą stoi to królestwo boże."
        ru: "а согласием стоит это Божье царство."
      - pl: "\nGdy bliżej poznasz naturę sfer nieba,"
        ru: "Когда ты ближе узнаешь природу сфер неба,"
      - pl: "\nPrzyznasz, że tu żyć w miłości potrzeba."
        ru: "признаешь, что здесь нужно жить в любви."
