chapter: 3
chapterTitle: "Pieśń III"
chapterTitleRu: "Песнь III. Пиккарда"
level: B2
paragraphs:
  - clean: "(Ciąg dalszy. Mieszkanki księżyca. Zakonnica Pikarda. Konstancja, matka Fryderyka II. Pouczenie o istocie świętości.)"
    chunks:
      - pl: "(Ciąg dalszy. Mieszkanki księżyca. Zakonnica Pikarda. Konstancja, matka Fryderyka II. Pouczenie o istocie świętości.)"
        ru: "(Продолжение. Обитательницы Луны. Монахиня Пиккарда. Констанция, мать Фридриха II. Поучение о сущности святости.)"
        note: "zakonnica — монахиня"
    words: { "Ciąg": ciag, "dalszy": daleki, "księżyca": ksiezyc, "Zakonnica": zakonnica, "matka": matka, "istocie": istota }
  - clean: "To słońce, co mnie miłości płomieniem\nPaliło, teraz wdzięk prawdy uroczy\nOdkryło swoim dowodem, przeczeniem.\nA ja, ze skruchą pragnąc doskonałą\nWyznać me błędy, o ile przystało,\nPodniosłem głowę i już mówić miałem:\nLecz widok nowy pociągał me oczy,\nWzrok mój weń z takim wraziłem zapałem,\nŻe o spowiedzi mojej zapomniałem."
    verse: true
    chunks:
      - pl: "To słońce, co mnie miłości płomieniem"
        ru: "То солнце, что жгло меня пламенем любви,"
        note: "Беатриче"
      - pl: "\nPaliło, teraz wdzięk prawdy uroczy"
        ru: "теперь открыло прелестную красоту истины"
      - pl: "\nOdkryło swoim dowodem, przeczeniem."
        ru: "своим доказательством, опровержением."
        note: "przeczenie — отрицание"
      - pl: "\nA ja, ze skruchą pragnąc doskonałą"
        ru: "А я, желая с совершенным раскаянием"
      - pl: "\nWyznać me błędy, o ile przystało,"
        ru: "признать свои заблуждения, насколько подобало,"
      - pl: "\nPodniosłem głowę i już mówić miałem:"
        ru: "поднял голову и уже собирался говорить:"
      - pl: "\nLecz widok nowy pociągał me oczy,"
        ru: "но новое зрелище влекло мои глаза,"
      - pl: "\nWzrok mój weń z takim wraziłem zapałem,"
        ru: "я вперил в него взгляд с таким пылом,"
      - pl: "\nŻe o spowiedzi mojej zapomniałem."
        ru: "что забыл о своей исповеди."
    words: { "płomieniem": plomien, "przeczeniem": przeczyc, "doskonałą": doskonaly, "Wyznać": wyznac, "widok": widok, "Wzrok": wzrok }
  - clean: "Jak przez szkła przeźrocz czystą i bez skazy,\nAlbo przez jasne, ciche wód kryształy,\nNie tak głębokie by dno zaciemniały,\nSzły do mych oczu takie mdłe obrazy,\nŻe prędzej perła na tle białym czoła\nBlaskiem swym oczu uwagę wywoła."
    verse: true
    chunks:
      - pl: "Jak przez szkła przeźrocz czystą i bez skazy,"
        ru: "Как сквозь прозрачность стекла, чистого и без изъяна,"
      - pl: "\nAlbo przez jasne, ciche wód kryształy,"
        ru: "или сквозь ясные, тихие хрустали вод,"
      - pl: "\nNie tak głębokie by dno zaciemniały,"
        ru: "не столь глубокие, чтобы затемнять дно,"
      - pl: "\nSzły do mych oczu takie mdłe obrazy,"
        ru: "к моим глазам шли такие бледные образы,"
      - pl: "\nŻe prędzej perła na tle białym czoła"
        ru: "что жемчужина на белом фоне лба скорее"
      - pl: "\nBlaskiem swym oczu uwagę wywoła."
        ru: "привлечёт своим блеском внимание глаз."
    words: { "kryształy": krysztal, "prędzej": predko, "czoła": czolo, "Blaskiem": blask, "uwagę": uwaga, "wywoła": wywolac }
  - clean: "Widziałem, zda się, orszak cieniów nowy\nRozwierał usta skore do rozmowy:\nDlatego łatwo w błąd przeciwny wpadłem\nTemu błędowi, co miłość złudzeniem\nMiędzy człowiekiem zatlił a strumieniem.\nChcąc widzieć cienie, azali zwierciadłem\nByły obite, ciekawie patrzałem,\nSkąd wychodziły, z jakich ciał poczęte?"
    verse: true
    chunks:
      - pl: "Widziałem, zda się, orszak cieniów nowy"
        ru: "Мне показалось, я видел новую свиту теней,"
      - pl: "\nRozwierał usta skore do rozmowy:"
        ru: "что раскрывала уста, охочие до разговора:"
      - pl: "\nDlatego łatwo w błąd przeciwny wpadłem"
        ru: "поэтому я легко впал в ошибку, противоположную"
      - pl: "\nTemu błędowi, co miłość złudzeniem"
        ru: "той ошибке, что любовь обманом"
      - pl: "\nMiędzy człowiekiem zatlił a strumieniem."
        ru: "зажгла между человеком и ручьём."
        note: "Нарцисс"
      - pl: "\nChcąc widzieć cienie, azali zwierciadłem"
        ru: "Желая видеть тени, не зеркалом ли"
      - pl: "\nByły obite, ciekawie patrzałem,"
        ru: "они отражены, я с любопытством смотрел,"
        note: "obity — обитый, здесь «отражённый»"
      - pl: "\nSkąd wychodziły, z jakich ciał poczęte?"
        ru: "откуда они исходили, из каких тел зачатые?"
    words: { "cieniów": cien, "usta": usta, "przeciwny": przeciwny, "strumieniem": strumien, "ciekawie": ciekawie, "poczęte": poczac }
  - clean: "I nic nie widząc, wzrok znowu zwracałem\nNa światło pięknej przewodniczki mojej,\nA uśmiech błyskał przez jej oczy święte.\nOna mówiła: — «Nie z przyczyny innej,\nJa się uśmiecham z twej myśli dziecinnej;\nJeszcze twa stopa nie o mocy swojej,\nSłabo na prawdzie jak potknięta stoi."
    verse: true
    chunks:
      - pl: "I nic nie widząc, wzrok znowu zwracałem"
        ru: "И, ничего не видя, снова обращал взгляд"
      - pl: "\nNa światło pięknej przewodniczki mojej,"
        ru: "на свет моей прекрасной вожатой,"
      - pl: "\nA uśmiech błyskał przez jej oczy święte."
        ru: "а улыбка блистала сквозь её святые глаза."
      - pl: "\nOna mówiła: — «Nie z przyczyny innej,"
        ru: "Она говорила: — «Не по иной причине"
      - pl: "\nJa się uśmiecham z twej myśli dziecinnej;"
        ru: "я улыбаюсь твоей детской мысли;"
      - pl: "\nJeszcze twa stopa nie o mocy swojej,"
        ru: "ещё твоя нога не своей силой,"
      - pl: "\nSłabo na prawdzie jak potknięta stoi."
        ru: "слабо, как оступившаяся, стоит на истине."
    words: { "zwracałem": zwracac, "uśmiech": usmiech, "przyczyny": przyczyna, "uśmiecham": usmiechac, "stopa": stopa, "mocy": moc-2 }
  - clean: "Te, jako widzisz, rysy cieniów mglistych,\nSą to postacie istot rzeczywistych,\nTu wywołanych za śluby złamane.\nA więc jak stoisz, przemów do nich z dala,\nSłuchaj ich z wiarą, bo światłość prawdziwa,\nPrzez którą duch ich w radości opływa,\nNigdy im od się zbłądzić nie pozwala»."
    verse: true
    chunks:
      - pl: "Te, jako widzisz, rysy cieniów mglistych,"
        ru: "Эти, как видишь, черты туманных теней —"
      - pl: "\nSą to postacie istot rzeczywistych,"
        ru: "облики действительных существ,"
      - pl: "\nTu wywołanych za śluby złamane."
        ru: "вызванных сюда за нарушенные обеты."
      - pl: "\nA więc jak stoisz, przemów do nich z dala,"
        ru: "Итак, как стоишь, заговори с ними издали,"
      - pl: "\nSłuchaj ich z wiarą, bo światłość prawdziwa,"
        ru: "слушай их с верой, ибо истинный свет,"
      - pl: "\nPrzez którą duch ich w radości opływa,"
        ru: "которым их дух преисполнен радости,"
      - pl: "\nNigdy im od się zbłądzić nie pozwala»."
        ru: "никогда не позволяет им отклониться от себя»."
    words: { "postacie": postac, "śluby": slub, "wiarą": wiara, "duch": duch, "radości": radosc, "pozwala": pozwalac }
  - clean: "I obróciłem rozmowę do cienia,\nKtóry najwięcej miał chęci mówienia,\nRzucając słowa z pośpiechu splątane:\n«Duchu!» mówiłem: «Szczęśliwie stworzony,\nCo w sobie, życiem wiecznym oświecony,\nCzujesz tę słodycz, jakiej nie pojmuje\nNikt i nie pojmie, aż nim jej skosztuje;\nPrzyrzekam tobie wdzięczność niezrównaną,\nJeśli mi powiesz los wasz, twoje miano;\nCiekawej chęci nie licz na karb grzechu»."
    verse: true
    chunks:
      - pl: "I obróciłem rozmowę do cienia,"
        ru: "И я обратил речь к тени,"
      - pl: "\nKtóry najwięcej miał chęci mówienia,"
        ru: "что больше всех желала говорить,"
      - pl: "\nRzucając słowa z pośpiechu splątane:"
        ru: "бросая слова, спутанные от спешки:"
      - pl: "\n«Duchu!» mówiłem: «Szczęśliwie stworzony,"
        ru: "«Дух, — сказал я, — счастливо созданный,"
      - pl: "\nCo w sobie, życiem wiecznym oświecony,"
        ru: "что в себе, озарённый вечной жизнью,"
      - pl: "\nCzujesz tę słodycz, jakiej nie pojmuje"
        ru: "чувствуешь ту сладость, какой не постигает"
      - pl: "\nNikt i nie pojmie, aż nim jej skosztuje;"
        ru: "никто и не постигнет, пока её не вкусит;"
      - pl: "\nPrzyrzekam tobie wdzięczność niezrównaną,"
        ru: "обещаю тебе несравненную благодарность,"
      - pl: "\nJeśli mi powiesz los wasz, twoje miano;"
        ru: "если скажешь мне вашу судьбу, своё имя;"
      - pl: "\nCiekawej chęci nie licz na karb grzechu»."
        ru: "не считай любопытное желание грехом»."
    words: { "obróciłem": obrocic, "pośpiechu": pospiech, "Szczęśliwie": szczesliwie, "słodycz": slodycz, "Przyrzekam": przyrzekac, "wdzięczność": wdziecznosc }
  - clean: "A cień z oczyma pełnymi uśmiechu:\n«Tu miłość nasza, boskiej obraz żywy,\nDrzwi nie zamyka dla chęci godziwej,\nBo miłosierdziu zdało się bożemu,\nAby dwór jego był podobny Jemu.\nByłam na ziemi zakonnicą skromną,\nJeśli mnie dobrze twoje oczy pomną,\nChoć piękność moja dziś jest w krasie żywszej."
    verse: true
    chunks:
      - pl: "A cień z oczyma pełnymi uśmiechu:"
        ru: "А тень с глазами, полными улыбки:"
      - pl: "\n«Tu miłość nasza, boskiej obraz żywy,"
        ru: "«Здесь наша любовь, живой образ божественной,"
      - pl: "\nDrzwi nie zamyka dla chęci godziwej,"
        ru: "не закрывает дверей для достойного желания,"
      - pl: "\nBo miłosierdziu zdało się bożemu,"
        ru: "ибо Божьему милосердию угодно было,"
      - pl: "\nAby dwór jego był podobny Jemu."
        ru: "чтобы его двор был подобен Ему."
      - pl: "\nByłam na ziemi zakonnicą skromną,"
        ru: "Я была на земле скромной монахиней,"
      - pl: "\nJeśli mnie dobrze twoje oczy pomną,"
        ru: "если твои глаза хорошо меня помнят,"
      - pl: "\nChoć piękność moja dziś jest w krasie żywszej."
        ru: "хоть моя красота сегодня в более живой красе."
    words: { "zamyka": zamykac, "chęci": chec, "bożemu": bozy, "dwór": dwor, "skromną": skromny, "piękność": pieknosc }
  - clean: "Poznasz Pikardę; mieszkam pośród grona\nBłogosławionych i błogosławiona\nJestem tu w sferze ze sfer najleniwszej.\nPłomień żądz naszych do tyla rozdęty,\nJaką w nich iskrę zapalił Duch Święty,\nCieszy się sferą, jaką jest objęty."
    verse: true
    chunks:
      - pl: "Poznasz Pikardę; mieszkam pośród grona"
        ru: "Ты узнаешь Пиккарду; я живу среди круга"
      - pl: "\nBłogosławionych i błogosławiona"
        ru: "блаженных и блаженна"
      - pl: "\nJestem tu w sferze ze sfer najleniwszej."
        ru: "здесь, в самой медленной из сфер."
      - pl: "\nPłomień żądz naszych do tyla rozdęty,"
        ru: "Пламя наших желаний, раздутое настолько,"
      - pl: "\nJaką w nich iskrę zapalił Duch Święty,"
        ru: "какую искру зажёг в них Дух Святой,"
      - pl: "\nCieszy się sferą, jaką jest objęty."
        ru: "радуется сфере, которой объято."
    words: { "grona": grono, "Błogosławionych": blogoslawic, "najleniwszej": leniwy, "zapalił": zapalic, "Święty": swiety, "objęty": objac }
  - clean: "Los nasz, jak widzisz, ma blasku niewiele,\nBośmy na różne rozstrzeleni cele,\nNiedbale, w części złamali swe śluby».\nA ja: — «Postaci waszych wdzięk tak luby!\nTak coś boskiego wzrok mój do was nęci,\nŻe pierwszy rys wasz spłowiał w mej pamięci."
    verse: true
    chunks:
      - pl: "Los nasz, jak widzisz, ma blasku niewiele,"
        ru: "Наш удел, как видишь, имеет мало блеска,"
