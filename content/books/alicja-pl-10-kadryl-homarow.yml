paragraphs:
  - clean: "Niby-Żółw westchnął głęboko i przesunął grzbietem jednej płetwy po oczach. Spojrzał na Alicję i spróbował się odezwać, ale przez minutę czy dwie szlochy dławiły mu głos. „Zupełnie jakby mu ość stanęła w gardle”, powiedział Gryf i zabrał się do potrząsania nim i okładania go po plecach. W końcu Niby-Żółw odzyskał głos i ze łzami płynącymi po policzkach ciągnął dalej:—"
    en: "The Mock Turtle sighed deeply, and drew the back of one flapper across his eyes. He looked at Alice, and tried to speak, but for a minute or two sobs choked his voice. “Same as if he had a bone in his throat,” said the Gryphon: and it set to work shaking him and punching him in the back. At last the Mock Turtle recovered his voice, and, with tears running down his cheeks, he went on again:—"
    draft: true
    chunks:
      - pl: "Niby-Żółw westchnął głęboko i przesunął grzbietem jednej płetwy po oczach."
        ru: "Мнимый Черепах глубоко вздохнул и провёл тыльной стороной ласта по глазам."
        note: "przesunąć czymś po czymś — провести чем-л. по чему-л.: творительный и предложный"
      - pl: " Spojrzał na Alicję i spróbował się odezwać, ale przez minutę czy dwie szlochy dławiły mu głos."
        ru: "Он посмотрел на Алису и попробовал заговорить, но минуту или две рыдания душили его голос."
        note: "dławić komuś głos — душить кому-л. голос: дательный падеж"
      - pl: " „Zupełnie jakby mu ość stanęła w gardle”, powiedział Gryf i zabrał się do potrząsania nim i okładania go po plecach."
        ru: "«Совсем как если бы у него кость застряла в горле», — сказал Грифон и принялся трясти его и колотить по спине."
        note: "ość stanęła w gardle — кость застряла в горле: ość — именно рыбья кость"
      - pl: " W końcu Niby-Żółw odzyskał głos i ze łzami płynącymi po policzkach ciągnął dalej:—"
        ru: "Наконец Мнимый Черепах вернул себе голос и со слезами, текущими по щекам, продолжал:—"
        note: "odzyskać — вернуть себе, обрести вновь"
