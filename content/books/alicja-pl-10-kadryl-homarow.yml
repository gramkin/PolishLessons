  - clean: "„Czy nie zechcesz iść prędzej?”, rzekł bielinek do ślimaka.\n„Tuż za nami morświn płynie i po ogonie mnie trąca.\nPatrz, jak raźno homary i żółwie naprzód mkną!\nCzekają tam na żwirze — czy pójdziesz z nami w tan?\nCzy chcesz, czy nie chcesz, czy chcesz, czy nie chcesz, czy pójdziesz z nami w tan?\nCzy chcesz, czy nie chcesz, czy chcesz, czy nie chcesz, czy nie pójdziesz w tan?"
    en: "“Will you walk a little faster?” said a whiting to a snail.\n“There’s a porpoise close behind us, and he’s treading on my tail.\nSee how eagerly the lobsters and the turtles all advance!\nThey are waiting on the shingle—will you come and join the dance?\nWill you, won’t you, will you, won’t you, will you join the dance?\nWill you, won’t you, will you, won’t you, won’t you join the dance?"
    draft: true
    verse: true
    chunks:
      - pl: "„Czy nie zechcesz iść prędzej?”, rzekł bielinek do ślimaka."
        ru: "«Не пойдёшь ли побыстрее?» — сказал бьелинек улитке."
        note: "В оригинале это рыба, чьё название совпадает с названием белил для обуви, на чём дальше строится шутка Грифа. По-польски рыба названа bielinek, от bielić «белить», чтобы каламбур уцелел."
