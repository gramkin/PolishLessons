  - clean: "„Może nie mieszkałaś wiele pod morzem—” („Nie mieszkałam”, powiedziała Alicja) „—a może nigdy nawet nie przedstawiono cię homarowi—” (Alicja zaczęła mówić: „Raz skosztowałam—”, ale powstrzymała się pospiesznie i powiedziała: „Nie, nigdy”) „—więc nie możesz mieć pojęcia, jaką rozkoszną rzeczą jest Kadryl homarów!”"
    en: "“You may not have lived much under the sea—” (“I haven’t,” said Alice)—“and perhaps you were never even introduced to a lobster—” (Alice began to say “I once tasted—” but checked herself hastily, and said “No, never”) “—so you can have no idea what a delightful thing a Lobster Quadrille is!”"
    draft: true
    chunks:
      - pl: "„Może nie mieszkałaś wiele pod morzem—” („Nie mieszkałam”, powiedziała Alicja)"
        ru: "«Может, ты немного жила под морем—» («Не жила», — сказала Алиса)"
        note: "mieszkać pod morzem — жить под морем"
      - pl: " „—a może nigdy nawet nie przedstawiono cię homarowi—”"
        ru: "«—а может, тебя никогда даже не представляли омару—»"
        note: "przedstawiono cię — тебя представили: безличная форма на -no"
      - pl: " (Alicja zaczęła mówić: „Raz skosztowałam—”, ale powstrzymała się pospiesznie i powiedziała: „Nie, nigdy”)"
        ru: "(Алиса начала говорить: «Однажды я пробовала—», но поспешно осеклась и сказала: «Нет, никогда»)"
        note: "skosztować czegoś — отведать чего-л.: родительный падеж"
      - pl: " „—więc nie możesz mieć pojęcia, jaką rozkoszną rzeczą jest Kadryl homarów!”"
        ru: "«—так что ты не можешь иметь понятия, какая это восхитительная вещь — Кадриль омаров!»"
        note: "jaką rzeczą jest — какая это вещь: при być именная часть в творительном"
    words: { "mieszkałaś": mieszkac, "morzem": morze, "przedstawiono": przedstawic, "powstrzymała": powstrzymac, "pojęcia": pojac }
  - clean: "„Rzeczywiście nie”, powiedziała Alicja. „Cóż to za taniec?”"
