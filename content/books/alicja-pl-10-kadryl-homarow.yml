  - clean: "Zaczęli więc uroczyście tańczyć wokół Alicji, co chwila nadeptując jej na palce, gdy przechodzili zbyt blisko, i machając przednimi łapami, żeby wybijać takt, podczas gdy Niby-Żółw śpiewał to bardzo powoli i smutno:—"
