  - clean: "„W dwa szeregi!”, zawołał Niby-Żółw. „Foki, żółwie, łososie i tak dalej; potem, kiedy uprzątniecie z drogi wszystkie meduzy—”"
    en: "“Two lines!” cried the Mock Turtle. “Seals, turtles, salmon, and so on; then, when you’ve cleared all the jelly-fish out of the way—”"
    draft: true
    chunks:
      - pl: "„W dwa szeregi!”, zawołał Niby-Żółw."
        ru: "«В два ряда!» — воскликнул Мнимый Черепах."
