  - clean: "Tuż o świcie obudził mnie szereg okropnych wrzasków Billa. Nie były to okrzyki, ryki, wołania, pohukiwania ani wycie, jakich można by się spodziewać po męskim aparacie głosowym — były to po prostu nieprzyzwoite, przerażające, upokarzające piski, jakie wydają kobiety na widok duchów albo gąsienic. To straszna rzecz słyszeć, jak silny, zdesperowany, gruby mężczyzna piszczy bez opamiętania w jaskini o świcie."
    en: "Just at daybreak, I was awakened by a series of awful screams from Bill. They weren’t yells, or howls, or shouts, or whoops, or yawps, such as you’d expect from a manly set of vocal organs—they were simply indecent, terrifying, humiliating screams, such as women emit when they see ghosts or caterpillars. It’s an awful thing to hear a strong, desperate, fat man scream incontinently in a cave at daybreak."
    draft: true
