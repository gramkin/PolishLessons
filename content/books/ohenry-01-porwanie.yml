      - pl: " żeby przeprowadzić oszukańczy interes z działkami budowlanymi"
        ru: "чтобы провернуть жульническую аферу с участками под застройку"
        note: "oszukańczy — мошеннический; działka — участок земли"
      - pl: " w zachodnim Illinois."
