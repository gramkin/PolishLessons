paragraphs:
  - clean: "Wyglądało to na świetny interes — ale poczekajcie, aż wam opowiem. Byliśmy na Południu, w Alabamie — Bill Driscoll i ja — kiedy wpadliśmy na ten pomysł z porwaniem. Było to, jak to Bill później określił, „w chwili przejściowego zamrożenia umysłowego”; ale przekonaliśmy się o tym dopiero później."
    en: "It looked like a good thing: but wait till I tell you. We were down South, in Alabama—Bill Driscoll and myself—when this kidnapping idea struck us. It was, as Bill afterward expressed it, “during a moment of temporary mental apparition”; but we didn’t find that out till later."
    draft: true
    chunks:
      - pl: "Wyglądało to na świetny interes —"
        ru: "Дело казалось выгодным, —"
        note: "wyglądać na coś — казаться чем-л.: na + винительный; interes — здесь «дело, сделка»"
      - pl: " ale poczekajcie, aż wam opowiem."
        ru: "но погодите, вот я вам расскажу."
        note: "poczekać, aż… — подождать, пока…"
      - pl: " Byliśmy na Południu, w Alabamie"
        ru: "Мы были на Юге, в Алабаме"
        note: "na Południu — на Юге: na + местный"
      - pl: " — Bill Driscoll i ja —"
        ru: "— Билл Дрисколл и я, —"
      - pl: " kiedy wpadliśmy na ten pomysł z porwaniem."
        ru: "когда нам пришла в голову эта идея с похищением."
        note: "wpaść na pomysł — придумать, «напасть» на мысль"
      - pl: " Było to, jak to Bill później określił,"
        ru: "Это было, как потом выразился Билл,"
        note: "określić — определить; здесь «выразиться»"
      - pl: " „w chwili przejściowego zamrożenia umysłowego”;"
        ru: "«в минуту временной умственной заморозки»;"
        note: "Билл путает zamroczenie (помрачение) и zamrożenie (заморозка); у О. Генри та же ошибка: apparition вместо aberration"
      - pl: " ale przekonaliśmy się o tym dopiero później."
        ru: "но убедились мы в этом только потом."
        note: "przekonać się o czymś — убедиться в чём-л.: o + местный"
    words: { "interes": interes, "opowiem": opowiedziec, "Południu": poludnie, "określił": okreslic, "przekonaliśmy": przekonac }
  - clean: "Było tam miasteczko, płaskie jak naleśnik, i nazywało się, rzecz jasna, Summit. Mieszkała w nim ludność tak nieszkodliwa i zadowolona z siebie, jak żadne inne chłopstwo, które kiedykolwiek tańczyło wokół majowego drzewka."
    en: "There was a town down there, as flat as a flannel-cake, and called Summit, of course. It contained inhabitants of as undeleterious and self-satisfied a class of peasantry as ever clustered around a Maypole."
    draft: true
    chunks:
      - pl: "Było tam miasteczko,"
        ru: "Был там городок,"
      - pl: " płaskie jak naleśnik,"
        ru: "плоский, как блин,"
        note: "naleśnik — тонкий блин"
      - pl: " i nazywało się, rzecz jasna, Summit."
        ru: "и назывался он, разумеется, Саммит."
        note: "rzecz jasna — разумеется; summit по-английски «вершина» — в этом шутка"
      - pl: " Mieszkała w nim ludność"
        ru: "Жило в нём население"
        note: "ludność — население"
      - pl: " tak nieszkodliwa i zadowolona z siebie,"
