  - clean: "Jakieś dwie mile od Summit wznosiła się niewielka góra, porośnięta gęstym cedrowym zagajnikiem. Na jej tylnym zboczu była jaskinia. Tam zgromadziliśmy zapasy. Pewnego wieczoru po zachodzie słońca przejechaliśmy bryczką obok domu starego Dorseta. Dzieciak był na ulicy i rzucał kamieniami w kotka na płocie naprzeciwko."
    en: "About two miles from Summit was a little mountain, covered with a dense cedar brake. On the rear elevation of this mountain was a cave. There we stored provisions. One evening after sundown, we drove in a buggy past old Dorset’s house. The kid was in the street, throwing rocks at a kitten on the opposite fence."
    draft: true
