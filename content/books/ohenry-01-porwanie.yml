  - clean: "Bill i ja mieliśmy wspólny kapitał około sześciuset dolarów, a brakowało nam jeszcze dokładnie dwóch tysięcy, żeby przeprowadzić oszukańczy interes z działkami budowlanymi w zachodnim Illinois. Omówiliśmy sprawę na schodach przed hotelem. Przywiązanie do potomstwa, mówiliśmy sobie, jest silne w społecznościach na wpół wiejskich; dlatego, i z innych jeszcze powodów, porwanie powinno się tam udać lepiej niż w zasięgu gazet, które wysyłają reporterów w cywilu, żeby rozdmuchiwali takie sprawy. Wiedzieliśmy, że w pogoń za nami Summit wyśle najwyżej paru konstabli i może kilka ospałych psów gończych, a „Tygodnik Rolnika” wydrukuje jeden czy dwa gromkie artykuły. Wyglądało to więc dobrze."
    en: "Bill and me had a joint capital of about six hundred dollars, and we needed just two thousand dollars more to pull off a fraudulent town-lot scheme in Western Illinois with. We talked it over on the front steps of the hotel. Philoprogenitiveness, says we, is strong in semi-rural communities; therefore and for other reasons, a kidnapping project ought to do better there than in the radius of newspapers that send reporters out in plain clothes to stir up talk about such things. We knew that Summit couldn’t get after us with anything stronger than constables and maybe some lackadaisical bloodhounds and a diatribe or two in the Weekly Farmers’ Budget. So, it looked good."
    draft: true
    chunks:
      - pl: "Bill i ja mieliśmy wspólny kapitał"
        ru: "У нас с Биллом был общий капитал"
      - pl: " około sześciuset dolarów,"
        ru: "около шестисот долларов,"
        note: "około + родительный — около"
