  - clean: "Położyliśmy się spać około jedenastej. Rozłożyliśmy kilka szerokich koców i kołder i położyliśmy Czerwonego Wodza między sobą. Nie baliśmy się, że ucieknie. Przez trzy godziny nie dawał nam zasnąć: zrywał się, sięgał po strzelbę i wrzeszczał nam, mnie i Billowi, do ucha: „Cicho, kamracie!”, ilekroć wyimaginowany trzask gałązki czy szelest liścia zdradzał jego młodej wyobraźni skradanie się bandy wyjętych spod prawa. W końcu zapadłem w niespokojny sen i śniło mi się, że porwał mnie i przykuł łańcuchem do drzewa okrutny rudowłosy pirat."
    en: "We went to bed about eleven o’clock. We spread down some wide blankets and quilts and put Red Chief between us. We weren’t afraid he’d run away. He kept us awake for three hours, jumping up and reaching for his rifle and screeching: “Hist! pard,” in mine and Bill’s ears, as the fancied crackle of a twig or the rustle of a leaf revealed to his young imagination the stealthy approach of the outlaw band. At last, I fell into a troubled sleep, and dreamed that I had been kidnapped and chained to a tree by a ferocious pirate with red hair."
    draft: true
