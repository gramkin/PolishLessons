  - clean: "Na ofiarę wybraliśmy jedyne dziecko pewnego wpływowego obywatela, niejakiego Ebenezera Dorseta. Ojciec był człowiekiem poważanym i skąpym, miłośnikiem hipotek, surowym i prawym zbieraczem datków w kościele oraz bezlitosnym egzekutorem długów. Dzieciak był dziesięcioletnim chłopcem z piegami wypukłymi jak płaskorzeźba i włosami koloru okładki tego magazynu, który kupuje się w kiosku, kiedy trzeba zdążyć na pociąg. Bill i ja uznaliśmy, że Ebenezer bez szemrania wybuli okup w wysokości dwóch tysięcy dolarów co do centa. Ale poczekajcie, aż wam opowiem."
    en: "We selected for our victim the only child of a prominent citizen named Ebenezer Dorset. The father was respectable and tight, a mortgage fancier and a stern, upright collection-plate passer and forecloser. The kid was a boy of ten, with bas-relief freckles, and hair the colour of the cover of the magazine you buy at the news-stand when you want to catch a train. Bill and me figured that Ebenezer would melt down for a ransom of two thousand dollars to a cent. But wait till I tell you."
    draft: true
    chunks:
      - pl: "Na ofiarę wybraliśmy jedyne dziecko"
        ru: "В жертву мы выбрали единственного ребёнка"
        note: "na ofiarę — в жертву: na + винительный цели"
      - pl: " pewnego wpływowego obywatela, niejakiego Ebenezera Dorseta."
        ru: "одного влиятельного гражданина, некоего Эбенезера Дорсета."
        note: "niejaki — некий"
      - pl: " Ojciec był człowiekiem poważanym i skąpym,"
        ru: "Отец был человеком почтенным и скупым,"
        note: "poważany — уважаемый; skąpy — скупой"
