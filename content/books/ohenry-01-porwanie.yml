  - clean: "— Bardzo mi się tu podoba. Jeszcze nigdy nie nocowałem w lesie; ale miałem kiedyś oswojonego oposa, a w ostatnie urodziny skończyłem dziewięć lat. Nie znoszę chodzić do szkoły. Szczury zjadły szesnaście jajek nakrapianej kury cioci Jimmy'ego Talbota. Czy w tych lasach są prawdziwi Indianie? Chcę jeszcze sosu. Czy to drzewa, jak się ruszają, robią wiatr? Mieliśmy pięć szczeniaków. Czemu masz taki czerwony nos, Hank? Mój tata ma kupę pieniędzy. Czy gwiazdy są gorące? W sobotę dwa razy sprałem Eda Walkera. Nie lubię dziewczyn. Ropuchy nie złapiesz inaczej, jak na sznurek. Czy woły robią jakiś hałas? Czemu pomarańcze są okrągłe? Macie w tej jaskini łóżka do spania? Amos Murray ma sześć palców u nogi. Papuga umie mówić, ale ani małpa, ani ryba nie umie. Ile trzeba, żeby było dwanaście?"
