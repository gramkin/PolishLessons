        ru: "Колыбель, алтарь и могила отмечают путь каждого человека, а сопровождающие их обряды напоминают, что никто не идёт этим путём в одиночку."
      - pl: " Rodzina, sąsiedzi i przyjaciele są przy nim w chwilach radości i smutku, a wspólne jedzenie, śpiew i modlitwa sprawiają, że te chwile łatwiej przeżyć."
        ru: "Семья, соседи и друзья рядом с ним в минуты радости и печали, а совместная еда, пение и молитва помогают пережить эти минуты."
