paragraphs:
  - clean: "Kalendarz świąt jest wspólny dla całej wspólnoty, ale każdy człowiek ma też swój własny kalendarz: narodziny, dorastanie, ślub i śmierć. Etnografowie nazywają obrzędy, które towarzyszą tym chwilom, obrzędami przejścia, bo pomagają człowiekowi przejść z jednego stanu do drugiego. W dawnej wsi każdy z nich był sprawą całej społeczności, a nie tylko rodziny. Dziś są bardziej prywatne, ale wiele dawnych gestów przetrwało, często w zaskakującej formie."
    draft: true
    chunks:
      - pl: "Kalendarz świąt jest wspólny dla całej wspólnoty, ale każdy człowiek ma też swój własny kalendarz: narodziny, dorastanie, ślub i śmierć."
        ru: "Календарь праздников общий для всей общины, но у каждого человека есть и свой собственный календарь: рождение, взросление, свадьба и смерть."
        note: "dorastanie — взросление"
      - pl: " Etnografowie nazywają obrzędy, które towarzyszą tym chwilom, obrzędami przejścia, bo pomagają człowiekowi przejść z jednego stanu do drugiego."
        ru: "Этнографы называют обряды, сопровождающие эти моменты, обрядами перехода, потому что они помогают человеку перейти из одного состояния в другое."
        note: "etnograf — этнограф"
      - pl: " W dawnej wsi każdy z nich był sprawą całej społeczności, a nie tylko rodziny."
        ru: "В старой деревне каждый из них был делом всей общины, а не только семьи."
      - pl: " Dziś są bardziej prywatne, ale wiele dawnych gestów przetrwało, często w zaskakującej formie."
        ru: "Сегодня они более частные, но многие старые жесты сохранились, часто в неожиданной форме."
