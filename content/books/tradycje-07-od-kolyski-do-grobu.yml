  - clean: "Wokół narodzin dziecka narosło w tradycji ludowej wiele przesądów. Uważano, że niemowlę jest szczególnie narażone na złe spojrzenie, czyli urok, który może rzucić na nie zazdrosny albo po prostu nieostrożny człowiek. Dlatego do wózka albo łóżeczka przywiązywano czerwoną wstążkę, która miała odpędzać złe moce. Ten zwyczaj jest zaskakująco żywy i czerwone wstążki można zobaczyć na wózkach w każdym polskim mieście, także u rodziców, którzy w żadne uroki nie wierzą. Nie wypada też zbyt głośno zachwycać się cudzym dzieckiem, a kto to zrobi, dodaje czasem szybko: żeby nie zapeszyć, i puka w niemalowane drewno."
    draft: true
    chunks:
      - pl: "Wokół narodzin dziecka narosło w tradycji ludowej wiele przesądów."
        ru: "Вокруг рождения ребёнка в народной традиции накопилось множество суеверий."
        note: "narosnąć — накопиться"
      - pl: " Uważano, że niemowlę jest szczególnie narażone na złe spojrzenie, czyli urok, który może rzucić na nie zazdrosny albo po prostu nieostrożny człowiek."
        ru: "Считалось, что младенец особенно уязвим для дурного взгляда, то есть сглаза, который может навести на него завистливый или просто неосторожный человек."
        note: "urok — сглаз; niemowlę — младенец"
      - pl: " Dlatego do wózka albo łóżeczka przywiązywano czerwoną wstążkę, która miała odpędzać złe moce."
        ru: "Поэтому к коляске или кроватке привязывали красную ленточку, которая должна была отгонять злые силы."
      - pl: " Ten zwyczaj jest zaskakująco żywy i czerwone wstążki można zobaczyć na wózkach w każdym polskim mieście, także u rodziców, którzy w żadne uroki nie wierzą."
        ru: "Этот обычай на удивление жив, и красные ленточки можно увидеть на колясках в любом польском городе, даже у родителей, которые ни в какой сглаз не верят."
      - pl: " Nie wypada też zbyt głośno zachwycać się cudzym dzieckiem, a kto to zrobi, dodaje czasem szybko: żeby nie zapeszyć, i puka w niemalowane drewno."
        ru: "Неприлично также слишком громко восхищаться чужим ребёнком, а кто это сделает, порой быстро добавляет: «чтобы не сглазить» — и стучит по некрашеному дереву."
        note: "zapeszyć — сглазить"
    words: { "narodzin": narodziny, "tradycji": tradycja, "szczególnie": szczegolnie, "narażone": narazic, "czyli": czyli, "urok": urok, "rzucić": rzucic, "zazdrosny": zazdrosny, "wózka": wozek, "przywiązywano": przywiazywac, "czerwoną": czerwony, "moce": moc-2, "zwyczaj": zwyczaj, "zaskakująco": zaskakujaco, "żywy": zywy, "czerwone": czerwony, "wózkach": wozek, "polskim": polski, "także": takze, "rodziców": rodzice, "uroki": urok, "wypada": wypadac, "głośno": glosno, "cudzym": cudzy, "dodaje": dodawac, "puka": pukac, "niemalowane": malowac, "drewno": drewno }
  - clean: "Większość polskich dzieci jest chrzczona w pierwszych miesiącach życia. Chrzest jest dla katolików przyjęciem do Kościoła, ale dla wielu rodzin także wielkim świętem rodzinnym, zwanym chrzcinami. Najważniejszą decyzją rodziców jest wybór chrzestnych, czyli ojca chrzestnego i matki chrzestnej. Zostają nimi zwykle bliscy krewni albo przyjaciele, a ich rola nie kończy się na samej uroczystości. Chrzestni mają przez całe życie dbać o swojego chrześniaka, dawać mu prezenty na imieniny, pierwszą komunię i ślub, a w razie nieszczęścia zastąpić mu rodziców. Tradycyjnym prezentem na chrzest jest srebrny medalik albo łańcuszek z krzyżykiem, a dawniej także srebrna łyżeczka. Dawniej kilka tygodni po porodzie matka szła do kościoła na wywód, czyli specjalne błogosławieństwo, i dopiero potem mogła wrócić do normalnego życia we wsi, chodzić do sąsiadów i pracować w polu."
    draft: true
    chunks:
      - pl: "Większość polskich dzieci jest chrzczona w pierwszych miesiącach życia."
        ru: "Большинство польских детей крестят в первые месяцы жизни."
      - pl: " Chrzest jest dla katolików przyjęciem do Kościoła, ale dla wielu rodzin także wielkim świętem rodzinnym, zwanym chrzcinami."
        ru: "Крещение для католиков — это принятие в церковь, но для многих семей ещё и большой семейный праздник, называемый крестинами."
      - pl: " Najważniejszą decyzją rodziców jest wybór chrzestnych, czyli ojca chrzestnego i matki chrzestnej."
        ru: "Самое важное решение родителей — выбор крёстных, то есть крёстного отца и крёстной матери."
      - pl: " Zostają nimi zwykle bliscy krewni albo przyjaciele, a ich rola nie kończy się na samej uroczystości."
        ru: "Ими обычно становятся близкие родственники или друзья, и их роль не заканчивается на самом обряде."
      - pl: " Chrzestni mają przez całe życie dbać o swojego chrześniaka, dawać mu prezenty na imieniny, pierwszą komunię i ślub, a w razie nieszczęścia zastąpić mu rodziców."
        ru: "Крёстные должны всю жизнь заботиться о своём крестнике, дарить ему подарки на именины, первое причастие и свадьбу, а в случае несчастья заменить ему родителей."
        note: "chrześniak — крестник"
      - pl: " Tradycyjnym prezentem na chrzest jest srebrny medalik albo łańcuszek z krzyżykiem, a dawniej także srebrna łyżeczka."
        ru: "Традиционный подарок на крещение — серебряный образок или цепочка с крестиком, а раньше ещё и серебряная ложечка."
        note: "medalik — образок"
      - pl: " Dawniej kilka tygodni po porodzie matka szła do kościoła na wywód, czyli specjalne błogosławieństwo, i dopiero potem mogła wrócić do normalnego życia we wsi, chodzić do sąsiadów i pracować w polu."
        ru: "Раньше через несколько недель после родов мать шла в костёл на «вывод», то есть особое благословение, и только после этого могла вернуться к обычной жизни в деревне, ходить к соседям и работать в поле."
        note: "wywód — очистительная молитва после родов"
    words: { "polskich": polski, "świętem": swieto, "rodzinnym": rodzinny, "zwanym": zwac, "decyzją": decyzja, "wybór": wybor, "zwykle": zwykle, "bliscy": bliski, "krewni": krewny, "rola": rola, "kończy": konczyc, "uroczystości": uroczystosc, "dbać": dbac, "prezenty": prezent, "nieszczęścia": nieszczescie, "zastąpić": zastapic, "prezentem": prezent, "srebrny": srebrny, "srebrna": srebrny, "porodzie": porod, "kościoła": kosciol, "specjalne": specjalny, "błogosławieństwo": blogoslawienstwo, "dopiero": dopiero, "normalnego": normalny, "sąsiadów": sasiad, "polu": pole }
  - clean: "Dawniej imię dla dziecka wybierano często według kalendarza, od świętego, którego wspomina się w dniu narodzin albo chrztu. Dlatego w starszych pokoleniach jest tak wielu Janów, Józefów, Stanisławów, Marii i Katarzyn. Dziś rodzice wybierają imiona, które im się podobają, i co kilka lat pojawia się nowa moda: niedawno najpopularniejsze były Zuzanna, Zofia, Antoni i Jan. Urzędnik stanu cywilnego może jednak odmówić zapisania imienia, które jest ośmieszające albo nie pozwala rozpoznać płci dziecka. Wiele osób ma też drugie imię, które wybiera się na pamiątkę dziadka albo babci, a w czasie bierzmowania, w wieku kilkunastu lat, młodzi katolicy wybierają sobie jeszcze jedno, od świętego patrona."
    draft: true
    chunks:
      - pl: "Dawniej imię dla dziecka wybierano często według kalendarza, od świętego, którego wspomina się w dniu narodzin albo chrztu."
        ru: "Раньше имя ребёнку часто выбирали по календарю, по святому, которого поминают в день рождения или крещения."
      - pl: " Dlatego w starszych pokoleniach jest tak wielu Janów, Józefów, Stanisławów, Marii i Katarzyn."
        ru: "Поэтому в старших поколениях так много Янов, Юзефов, Станиславов, Марий и Катажин."
      - pl: " Dziś rodzice wybierają imiona, które im się podobają, i co kilka lat pojawia się nowa moda: niedawno najpopularniejsze były Zuzanna, Zofia, Antoni i Jan."
        ru: "Сегодня родители выбирают имена, которые им нравятся, и каждые несколько лет появляется новая мода: недавно самыми популярными были Зузанна, Зофья, Антони и Ян."
      - pl: " Urzędnik stanu cywilnego może jednak odmówić zapisania imienia, które jest ośmieszające albo nie pozwala rozpoznać płci dziecka."
        ru: "Однако сотрудник загса может отказаться записать имя, которое звучит унизительно или не позволяет определить пол ребёнка."
        note: "ośmieszający — выставляющий на посмешище"
      - pl: " Wiele osób ma też drugie imię, które wybiera się na pamiątkę dziadka albo babci, a w czasie bierzmowania, w wieku kilkunastu lat, młodzi katolicy wybierają sobie jeszcze jedno, od świętego patrona."
        ru: "У многих есть и второе имя, которое выбирают в память о дедушке или бабушке, а во время конфирмации, в возрасте около пятнадцати лет, молодые католики выбирают себе ещё одно — по святому покровителю."
        note: "bierzmowanie — конфирмация (миропомазание)"
    words: { "wybierano": wybierac, "według": wedlug, "kalendarza": kalendarz, "świętego": swiety, "wspomina": wspominac, "pokoleniach": pokolenie, "rodzice": rodzice, "wybierają": wybierac, "pojawia": pojawiac, "moda": moda, "niedawno": niedawno, "najpopularniejsze": popularny, "cywilnego": cywilny, "odmówić": odmowic, "pozwala": pozwalac, "rozpoznać": rozpoznac, "płci": plec, "wybiera": wybierac, "pamiątkę": pamiatka, "dziadka": dziadek, "babci": babcia, "wieku": wiek, "kilkunastu": kilkanascie }
  - clean: "Najbardziej rozbudowanym obrzędem przejścia jest wesele. Dawniej zaczynało się ono na długo przed ślubem, od swatów. Do domu panny przychodził swat, czyli przedstawiciel kawalera, często z butelką wódki, i rozmawiał z rodzicami o posagu, ziemi i warunkach małżeństwa. Jeśli panna się zgadzała, wypijano wódkę, a jeśli odmawiała, oddawano ją albo podawano kawalerowi czarną polewkę, zupę, która oznaczała grzeczną, ale stanowczą odmowę. Do dziś mówi się o kimś, kto dostał kosza, że dostał czarną polewkę."
    draft: true
    chunks:
      - pl: "Najbardziej rozbudowanym obrzędem przejścia jest wesele."
        ru: "Самый развёрнутый обряд перехода — свадьба."
      - pl: " Dawniej zaczynało się ono na długo przed ślubem, od swatów."
        ru: "Раньше она начиналась задолго до венчания, со сватовства."
      - pl: " Do domu panny przychodził swat, czyli przedstawiciel kawalera, często z butelką wódki, i rozmawiał z rodzicami o posagu, ziemi i warunkach małżeństwa."
        ru: "В дом девушки приходил сват, то есть представитель жениха, часто с бутылкой водки, и обсуждал с родителями приданое, землю и условия брака."
        note: "posag — приданое"
      - pl: " Jeśli panna się zgadzała, wypijano wódkę, a jeśli odmawiała, oddawano ją albo podawano kawalerowi czarną polewkę, zupę, która oznaczała grzeczną, ale stanowczą odmowę."
        ru: "Если девушка соглашалась, водку выпивали, а если отказывала, её возвращали или подавали жениху «чёрную похлёбку», суп, который означал вежливый, но твёрдый отказ."
        note: "polewka — похлёбка; stanowczy — решительный"
      - pl: " Do dziś mówi się o kimś, kto dostał kosza, że dostał czarną polewkę."
        ru: "До сих пор о человеке, получившем отказ, говорят, что ему подали «чёрную похлёбку»."
        note: "dostać kosza — получить отказ"
    words: { "wesele": wesele, "ślubem": slub, "panny": panna, "przychodził": przychodzic, "przedstawiciel": przedstawiciel, "kawalera": kawaler, "butelką": butelka, "wódki": wodka, "rodzicami": rodzice, "warunkach": warunek, "małżeństwa": malzenstwo, "panna": panna, "wódkę": wodka, "odmawiała": odmawiac, "oddawano": oddawac, "podawano": podawac, "kawalerowi": kawaler, "czarną": czarny, "zupę": zupa, "oznaczała": oznaczac, "grzeczną": grzeczny, "kosza": kosz }
  - clean: "Dziś para sama decyduje o ślubie, a zaręczyny są prywatną chwilą, kiedy chłopak daje dziewczynie pierścionek, najlepiej w romantycznym miejscu. Większość par bierze ślub konkordatowy, czyli kościelny, który od 1998 roku ma od razu skutki cywilne, ale coraz więcej osób wybiera tylko ślub w urzędzie albo w plenerze. Przed ślubem przyszła panna młoda urządza z przyjaciółkami wieczór panieński, a pan młody z kolegami kawalerski, co bywa okazją do różnych szaleństw. Ważną rolę odgrywają świadkowie, zwykle najbliższy przyjaciel pana młodego i najbliższa przyjaciółka panny młodej, którzy podpisują akt ślubu, pomagają w przygotowaniach i pilnują, żeby w czasie wesela wszystko szło zgodnie z planem. Wesela odbywają się najczęściej w soboty od maja do września, a dobrą salę trzeba rezerwować nawet dwa lata wcześniej. Według przesądu najlepiej brać ślub w miesiącu, który ma w nazwie literę r, i stąd popularność czerwca, sierpnia i września i niechęć do maja, choć lipiec, w którym tej litery też nie ma, jakoś nikomu nie przeszkadza."
    draft: true
    chunks:
      - pl: "Dziś para sama decyduje o ślubie, a zaręczyny są prywatną chwilą, kiedy chłopak daje dziewczynie pierścionek, najlepiej w romantycznym miejscu."
        ru: "Сегодня пара сама решает вопрос о браке, а помолвка — личный момент, когда парень дарит девушке кольцо, лучше всего в романтическом месте."
        note: "zaręczyny — помолвка"
      - pl: " Większość par bierze ślub konkordatowy, czyli kościelny, który od 1998 roku ma od razu skutki cywilne, ale coraz więcej osób wybiera tylko ślub w urzędzie albo w plenerze."
        ru: "Большинство пар заключают конкордатный брак, то есть церковный, который с 1998 года сразу имеет гражданскую силу, но всё больше людей выбирают только регистрацию в загсе или на природе."
        note: "skutek — последствие, сила"
      - pl: " Przed ślubem przyszła panna młoda urządza z przyjaciółkami wieczór panieński, a pan młody z kolegami kawalerski, co bywa okazją do różnych szaleństw."
        ru: "Перед свадьбой будущая невеста устраивает с подругами девичник, а жених с друзьями — мальчишник, что бывает поводом для разных безумств."
        note: "panna młoda — невеста; pan młody — жених"
      - pl: " Ważną rolę odgrywają świadkowie, zwykle najbliższy przyjaciel pana młodego i najbliższa przyjaciółka panny młodej, którzy podpisują akt ślubu, pomagają w przygotowaniach i pilnują, żeby w czasie wesela wszystko szło zgodnie z planem."
        ru: "Важную роль играют свидетели, обычно лучший друг жениха и лучшая подруга невесты, которые подписывают свидетельство о браке, помогают в подготовке и следят, чтобы во время свадьбы всё шло по плану."
        note: "świadek — свидетель"
      - pl: " Wesela odbywają się najczęściej w soboty od maja do września, a dobrą salę trzeba rezerwować nawet dwa lata wcześniej."
        ru: "Свадьбы проходят чаще всего по субботам с мая по сентябрь, а хороший зал нужно бронировать даже за два года."
      - pl: " Według przesądu najlepiej brać ślub w miesiącu, który ma w nazwie literę r, i stąd popularność czerwca, sierpnia i września i niechęć do maja, choć lipiec, w którym tej litery też nie ma, jakoś nikomu nie przeszkadza."
