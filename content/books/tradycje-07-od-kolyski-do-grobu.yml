  - clean: "Najsłynniejsze polskie wesele odbyło się naprawdę. W listopadzie 1900 roku krakowski poeta Lucjan Rydel ożenił się z chłopką Jadwigą Mikołajczykówną ze wsi Bronowice pod Krakowem, a na wesele przyszli zarówno artyści z miasta, jak i chłopi z całej okolicy. Wśród gości był Stanisław Wyspiański, który na podstawie tej nocy napisał dramat „Wesele”, jeden z najważniejszych tekstów polskiej literatury. W dramacie inteligenci i chłopi tańczą razem, ale nie potrafią się naprawdę porozumieć, a w nocy na wesele przychodzą duchy z polskiej historii. Pytania, które zadał Wyspiański, o to, co łączy i dzieli Polaków, do dziś wracają w szkolnych lekcjach i w publicznych dyskusjach."
