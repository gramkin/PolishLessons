# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 13
chapterTitle: "Pieśń XIII"
chapterTitleRu: "Песнь XIII. Сапия"
level: B2
paragraphs:
  - clean: "(Koło II. Zazdrośni. Sapia.)"
    chunks:
      - pl: "(Koło II. Zazdrośni. Sapia.)"
        ru: "(Пояс II. Завистливые. Сапия.)"
        note: "zazdrosny — завистливый"
    words: { "Koło": kolo, "Zazdrośni": zazdrosny }
  - clean: "Na wierzchu schodów byliśmy, gdzie skała\nDrugim wypustem górę zamykała,\nKędy wstępując czyszczą się grzesznicy.\nTam jako pierwszy jest krąg wkoło góry,\nWzwyż podniesiony, bez żadnej różnicy,\nTylko łuk jego prędzej się zagina."
    verse: true
    chunks:
      - pl: "Na wierzchu schodów byliśmy, gdzie skała"
        ru: "Мы были на верху лестницы, где скала"
      - pl: "\nDrugim wypustem górę zamykała,"
        ru: "вторым выступом замыкала гору,"
        note: "wypust — выступ"
      - pl: "\nKędy wstępując czyszczą się grzesznicy."
        ru: "куда, восходя, очищаются грешники."
      - pl: "\nTam jako pierwszy jest krąg wkoło góry,"
        ru: "Там, как и первый, идёт круг вокруг горы,"
      - pl: "\nWzwyż podniesiony, bez żadnej różnicy,"
        ru: "поднятый ввысь, без всякого различия,"
      - pl: "\nTylko łuk jego prędzej się zagina."
        ru: "только дуга его быстрее загибается."
    words: { "schodów": schody, "skała": skala, "zamykała": zamykac, "czyszczą": czyscic, "krąg": krag, "prędzej": predko }
  - clean: "Tam płaskorzeźbą rzezane figury\nNie nęcą oczu, a oczu uwaga:\nBrzeg równy, droga jednostajnie naga,\nA barwa skał jej ołowianosina.\nWódz mówił: «Jeśli będziem czekać kogo,\nAby zapytać, jaką tu iść drogą,\nCzas nazbyt długą zmitrężymy zwłoką»."
    verse: true
    chunks:
      - pl: "Tam płaskorzeźbą rzezane figury"
        ru: "Там высеченные барельефом фигуры"
      - pl: "\nNie nęcą oczu, a oczu uwaga:"
        ru: "не манят глаз и внимания глаз:"
      - pl: "\nBrzeg równy, droga jednostajnie naga,"
        ru: "край ровный, дорога однообразно голая,"
        note: "jednostajnie — однообразно"
      - pl: "\nA barwa skał jej ołowianosina."
        ru: "а цвет её скал свинцово-синий."
        note: "ołowianosiny — свинцово-синий"
      - pl: "\nWódz mówił: «Jeśli będziem czekać kogo,"
        ru: "Вождь сказал: «Если мы будем ждать кого-нибудь,"
      - pl: "\nAby zapytać, jaką tu iść drogą,"
        ru: "чтобы спросить, какой дорогой здесь идти,"
      - pl: "\nCzas nazbyt długą zmitrężymy zwłoką»."
        ru: "мы потеряем время слишком долгим промедлением»."
        note: "zmitrężyć — потерять (время)"
    words: { "Brzeg": brzeg, "równy": rowny, "naga": nagi, "Wódz": wodz, "zapytać": zapytac, "zwłoką": zwloka }
  - clean: "Na koniec w słońce zatopił swe oko,\nŚrodek swych ruchów wsparł na prawej nodze\nI cały lewą obrócił się stroną.\n«O słodkie światło! pod którym ja wchodzę\nNa nową drogę z ufnością natchnioną,\nProwadź nas» mówił «tym kręgiem, jak trzeba."
    verse: true
    chunks:
      - pl: "Na koniec w słońce zatopił swe oko,"
        ru: "Наконец он погрузил свой глаз в солнце,"
      - pl: "\nŚrodek swych ruchów wsparł na prawej nodze"
        ru: "центр своих движений оперев на правую ногу,"
      - pl: "\nI cały lewą obrócił się stroną."
        ru: "и весь повернулся левой стороной."
      - pl: "\n«O słodkie światło! pod którym ja wchodzę"
        ru: "«О сладкий свет! под которым я вступаю"
      - pl: "\nNa nową drogę z ufnością natchnioną,"
        ru: "на новую дорогу с вдохновенным доверием,"
        note: "natchniony — вдохновенный"
      - pl: "\nProwadź nas» mówił «tym kręgiem, jak trzeba."
        ru: "веди нас, — сказал он, — этим кругом, как надо."
    words: { "słońce": slonce, "wsparł": wesprzec, "obrócił": obrocic, "słodkie": slodki, "światło": swiatlo, "wchodzę": wchodzic }
  - clean: "Ty świat ogrzewasz i świecisz nam z nieba,\nJeśli przyczyna jaka nie zawadzi,\nO! niech twój promień zawsze nas prowadzi».\nPrzestrzeń, co milą zwą na tym padole,\nPrzeszliśmy szybko zbrojni w czynną wolę.\nI oto czułem, jak ku nam bieżeli,\nBo nie widziałem, duchy czy anieli?"
    verse: true
    chunks:
      - pl: "Ty świat ogrzewasz i świecisz nam z nieba,"
        ru: "Ты согреваешь мир и светишь нам с неба,"
      - pl: "\nJeśli przyczyna jaka nie zawadzi,"
        ru: "если какая причина не помешает,"
        note: "zawadzić — помешать"
      - pl: "\nO! niech twój promień zawsze nas prowadzi»."
        ru: "о, пусть твой луч всегда ведёт нас»."
      - pl: "\nPrzestrzeń, co milą zwą na tym padole,"
        ru: "Расстояние, что зовут на этой земле милей,"
        note: "padół — дол, юдоль"
      - pl: "\nPrzeszliśmy szybko zbrojni w czynną wolę."
        ru: "мы прошли быстро, вооружённые деятельной волей."
      - pl: "\nI oto czułem, jak ku nam bieżeli,"
        ru: "И вот я почувствовал, как к нам летели —"
      - pl: "\nBo nie widziałem, duchy czy anieli?"
        ru: "ибо я не видел — духи или ангелы?"
    words: { "świecisz": swiecic, "przyczyna": przyczyna, "promień": promien, "Przestrzeń": przestrzen, "czynną": czynny, "anieli": aniol }
  - clean: "Mówiąc, wzywając uprzejmie, by społem\nUcztować z nimi za miłości stołem.\nGłos pierwszy lecąc szeleścił słowami:\nVinum non habent i przeszedł za nami,\nWtórząc te słowa jak dźwięk echa długi.\nNim ścichł, przechodził, wołając, głos drugi:\n«Jam Orest!» i znikł jak pierwszy w tej chwili."
    verse: true
    chunks:
      - pl: "Mówiąc, wzywając uprzejmie, by społem"
        ru: "говоря, приглашая любезно, чтобы вместе"
      - pl: "\nUcztować z nimi za miłości stołem."
        ru: "пировать с ними за столом любви."
        note: "ucztować — пировать"
      - pl: "\nGłos pierwszy lecąc szeleścił słowami:"
        ru: "Первый голос, пролетая, прошелестел словами:"
      - pl: "\nVinum non habent i przeszedł za nami,"
        ru: "«Vinum non habent» — и прошёл за нами,"
        note: "«Вина нет у них» — слова Марии в Кане"
      - pl: "\nWtórząc te słowa jak dźwięk echa długi."
        ru: "повторяя эти слова, как долгий звук эха."
      - pl: "\nNim ścichł, przechodził, wołając, głos drugi:"
        ru: "Прежде чем он стих, проходил, восклицая, второй голос:"
      - pl: "\n«Jam Orest!» i znikł jak pierwszy w tej chwili."
        ru: "«Я Орест!» — и исчез, как первый, в тот же миг."
    words: { "wzywając": wzywac, "stołem": stol, "dźwięk": dzwiek, "echa": echo, "przechodził": przechodzic, "wołając": wolac }
  - clean: "«Czyje to głosy, skąd ich echo leci?»\nGdym pytał, lecąc przemówił głos trzeci:\n«Miłujcie bliźnich, co wam źle robili».\nDobry mistrz mówił z słodyczą oblicza:\n«Krąg ten biczuje, smaga grzech zawiści,\nDlatego Miłość potrząsa sznur bicza."
    verse: true
    chunks:
      - pl: "«Czyje to głosy, skąd ich echo leci?»"
        ru: "«Чьи это голоса, откуда летит их эхо?»"
      - pl: "\nGdym pytał, lecąc przemówił głos trzeci:"
        ru: "Когда я спрашивал, пролетая, заговорил третий голос:"
      - pl: "\n«Miłujcie bliźnich, co wam źle robili»."
        ru: "«Любите ближних, что делали вам зло»."
      - pl: "\nDobry mistrz mówił z słodyczą oblicza:"
        ru: "Добрый учитель сказал со сладостью в лице:"
      - pl: "\n«Krąg ten biczuje, smaga grzech zawiści,"
        ru: "«Этот круг бичует, хлещет грех зависти,"
      - pl: "\nDlatego Miłość potrząsa sznur bicza."
        ru: "поэтому Любовь потрясает верёвкой бича."
        note: "то есть бичом служат примеры любви"
    words: { "przemówił": przemowic, "mistrz": mistrz, "słodyczą": slodycz, "oblicza": oblicze, "smaga": smagac, "grzech": grzech }
  - clean: "Wędzidło grzechu dźwięk wydaje inny,\nDźwięk ten posłyszysz, gdzie tej zmazy winny\nW pokucie duch się przebaczeniem czyści.\nTeraz w tę stronę wytężaj spojrzenie,\nA ujrzysz duchy leżące na skale,\nKażdy o ścianę jej leży oparty»."
    verse: true
    chunks:
      - pl: "Wędzidło grzechu dźwięk wydaje inny,"
        ru: "Узда греха издаёт другой звук,"
        note: "wędzidło — узда; примеры наказанной зависти"
      - pl: "\nDźwięk ten posłyszysz, gdzie tej zmazy winny"
        ru: "этот звук ты услышишь там, где, виновный в этом пятне,"
      - pl: "\nW pokucie duch się przebaczeniem czyści."
        ru: "дух в покаянии очищается прощением."
      - pl: "\nTeraz w tę stronę wytężaj spojrzenie,"
        ru: "Теперь в ту сторону напряги взгляд,"
      - pl: "\nA ujrzysz duchy leżące na skale,"
        ru: "и увидишь духов, сидящих у скалы,"
      - pl: "\nKażdy o ścianę jej leży oparty»."
        ru: "каждый сидит, опершись о её стену»."
    words: { "wydaje": wydawac, "duch": duch, "ujrzysz": ujrzec, "leżące": lezec, "ścianę": sciana, "oparty": oprzec }
  - clean: "I czujne oczu podwoiłem warty,\nPatrzałem bystrzej i widziałem cienie,\nJak głaz sinymi okryte płaszczami.\nGdy coraz dalej i dalej stąpałem,\n«Maryjo! módl się za nami!» słyszałem;\nPotem wołali: «Pietrze i Michale!"
    verse: true
    chunks:
      - pl: "I czujne oczu podwoiłem warty,"
        ru: "И я удвоил бдительную стражу глаз,"
        note: "warta — стража"
      - pl: "\nPatrzałem bystrzej i widziałem cienie,"
        ru: "смотрел зорче и видел тени,"
      - pl: "\nJak głaz sinymi okryte płaszczami."
        ru: "покрытые плащами, синими, как камень."
      - pl: "\nGdy coraz dalej i dalej stąpałem,"
        ru: "Когда я ступал всё дальше и дальше,"
      - pl: "\n«Maryjo! módl się za nami!» słyszałem;"
        ru: "я слышал: «Мария! молись за нас!»"
      - pl: "\nPotem wołali: «Pietrze i Michale!"
        ru: "Потом взывали: «Пётр и Михаил!"
    words: { "oczu": oko, "Patrzałem": patrzec, "płaszczami": plaszcz, "coraz": coraz, "módl": modlic, "słyszałem": slyszec }
  - clean: "I wszyscy święci, módlcie się za nami!»\nGdzieżby był człowiek tak zimnym kamieniem,\nCo by się moim nie wzruszył widzeniem?\nBo gdy patrzałem z bliska na te duchy,\nWidząc wyraźniej ich rysy i ruchy,\nZ boleści łzą mi nabiegła źrenica."
    verse: true
    chunks:
      - pl: "I wszyscy święci, módlcie się za nami!»"
        ru: "И все святые, молитесь за нас!»"
      - pl: "\nGdzieżby był człowiek tak zimnym kamieniem,"
        ru: "Где был бы человек столь холодным камнем,"
      - pl: "\nCo by się moim nie wzruszył widzeniem?"
        ru: "чтобы не тронуться тем, что я видел?"
      - pl: "\nBo gdy patrzałem z bliska na te duchy,"
        ru: "Ибо когда я смотрел вблизи на этих духов,"
      - pl: "\nWidząc wyraźniej ich rysy i ruchy,"
        ru: "видя яснее их черты и движения,"
      - pl: "\nZ boleści łzą mi nabiegła źrenica."
        ru: "у меня от боли слеза набежала на зрачок."
    words: { "święci": swiety, "człowiek": czlowiek, "kamieniem": kamien, "widzeniem": widziec, "bliska": bliski, "wyraźniej": wyraznie }
  - clean: "Ciało ich kryła licha włosiennica,\nJeden na drugim opierał mdłe ciało,\nA wszyscy byli podpierani skałą.\nJak ślepi co dzień łaknąc manny z nieba,\nSiedzą przy kruchcie i wołają: chleba,\nJeden na drugim zwisłą głowę trzyma;\nBy litość w sercu poruszyć człowieka,\nŻebrzą nie tylko słowem, lecz oczyma,\nGdzie jej skra niemniej żywe ognie nieci;\nA jako słońce dla ślepych nie świeci\nRównie tym cieniom, o których się mówi,\nNiebo odmawia światła ich wzrokowi."
    verse: true
    chunks:
      - pl: "Ciało ich kryła licha włosiennica,"
        ru: "Их тело покрывала жалкая власяница,"
        note: "włosiennica — власяница"
      - pl: "\nJeden na drugim opierał mdłe ciało,"
        ru: "один опирал на другого немощное тело,"
      - pl: "\nA wszyscy byli podpierani skałą."
        ru: "а все опирались о скалу."
      - pl: "\nJak ślepi co dzień łaknąc manny z nieba,"
        ru: "Как слепые, каждый день жаждущие манны с неба,"
      - pl: "\nSiedzą przy kruchcie i wołają: chleba,"
        ru: "сидят у паперти и взывают: «Хлеба!»"
        note: "kruchta — паперть"
      - pl: "\nJeden na drugim zwisłą głowę trzyma;"
        ru: "один держит на другом свешенную голову;"
      - pl: "\nBy litość w sercu poruszyć człowieka,"
        ru: "чтобы пробудить в сердце человека жалость,"
      - pl: "\nŻebrzą nie tylko słowem, lecz oczyma,"
        ru: "просят не только словом, но и глазами,"
      - pl: "\nGdzie jej skra niemniej żywe ognie nieci;"
        ru: "где её искра разжигает не менее живые огни;"
        note: "skra — искра; niecić — разжигать"
      - pl: "\nA jako słońce dla ślepych nie świeci"
        ru: "и как солнце не светит для слепых,"
      - pl: "\nRównie tym cieniom, o których się mówi,"
        ru: "так и этим теням, о которых говорится,"
      - pl: "\nNiebo odmawia światła ich wzrokowi."
        ru: "небо отказывает в свете их взору."
    words: { "kryła": kryc, "opierał": opierac, "manny": manna, "chleba": chleb, "poruszyć": poruszyc, "odmawia": odmawiac }
  - clean: "Cieniów tych drutem sposzyta powieka,\nJako dzikiemu robią sokołowi,\nGdy niepowolny na łowca wołania.\nMyśląc, że drugim obelgę zadajem,\nWidząc ich, od nich niewidziani wzajem,\nStanąłem twarzą wprost do poradnika."
    verse: true
    chunks:
      - pl: "Cieniów tych drutem sposzyta powieka,"
        ru: "У этих теней веки зашиты проволокой,"
        note: "drut — проволока; sposzyty — устар. «сшитый»"
      - pl: "\nJako dzikiemu robią sokołowi,"
        ru: "как делают дикому соколу,"
      - pl: "\nGdy niepowolny na łowca wołania."
        ru: "когда он непослушен на зов охотника."
        note: "niepowolny — непослушный"
      - pl: "\nMyśląc, że drugim obelgę zadajem,"
        ru: "Думая, что наношу другим оскорбление,"
        note: "obelga — оскорбление"
      - pl: "\nWidząc ich, od nich niewidziani wzajem,"
        ru: "видя их, сам не видимый ими,"
      - pl: "\nStanąłem twarzą wprost do poradnika."
        ru: "я встал лицом прямо к советчику."
        note: "poradnik — советчик"
    words: { "Cieniów": cien, "drutem": drut, "dzikiemu": dziki, "łowca": lowca, "obelgę": obelga, "Stanąłem": stanac }
  - clean: "On, co chcę mówić, gdy milczę, przenika,\nRzekł, nie czekając mojego pytania:\n«Mów, lecz twe słowa w trzeźwe ujmij pęta».\nWirgili z wolna szedł z tej strony drogą,\nSkąd łatwo w przepaść uśliznąć się nogą,\nBo droga żadnym zrębem niezamknięta."
    verse: true
    chunks:
      - pl: "On, co chcę mówić, gdy milczę, przenika,"
        ru: "Он, что проникает, что я хочу сказать, когда молчу,"
      - pl: "\nRzekł, nie czekając mojego pytania:"
        ru: "сказал, не дожидаясь моего вопроса:"
      - pl: "\n«Mów, lecz twe słowa w trzeźwe ujmij pęta»."
        ru: "«Говори, но заключи свои слова в трезвые путы»."
        note: "pęta — путы"
      - pl: "\nWirgili z wolna szedł z tej strony drogą,"
        ru: "Вергилий шёл медленно с той стороны дороги,"
      - pl: "\nSkąd łatwo w przepaść uśliznąć się nogą,"
        ru: "откуда легко соскользнуть ногой в пропасть,"
        note: "uśliznąć się — соскользнуть"
      - pl: "\nBo droga żadnym zrębem niezamknięta."
        ru: "ибо дорога не огорожена никаким краем."
    words: { "milczę": milczec, "Rzekł": rzec, "trzeźwe": trzezwy, "ujmij": ujac, "przepaść": przepasc, "nogą": noga }
  - clean: "A cienie zasię z drugiej były strony,\nTak ich bolało druciane sposzycie,\nŻe łzy z ich oczu lały się obficie.\n— «O! pewni» rzekłem do nich obrócony,\n«Oglądać światłość wiekuiście boską,\nCo waszej żądzy jedyną jest troską!"
    verse: true
    chunks:
      - pl: "A cienie zasię z drugiej były strony,"
        ru: "А тени были с другой стороны,"
      - pl: "\nTak ich bolało druciane sposzycie,"
        ru: "их так болело проволочное сшивание,"
      - pl: "\nŻe łzy z ich oczu lały się obficie."
        ru: "что слёзы обильно лились из их глаз."
      - pl: "\n— «O! pewni» rzekłem do nich obrócony,"
        ru: "— «О уверенные, — сказал я, обратившись к ним, —"
      - pl: "\n«Oglądać światłość wiekuiście boską,"
        ru: "что увидите вечно божественный свет,"
      - pl: "\nCo waszej żądzy jedyną jest troską!"
