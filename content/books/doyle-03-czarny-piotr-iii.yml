  - clean: "— Więc, jak mówię, zbiegły bankier Neligan był moim ojcem. Bankructwo to bolało naprawdę tylko jego, Dawson usunął się od wszystkiego. Miałem wówczas dopiero dziesięć lat, ale wystarczyło to już, abym odczuł całą hańbę i zarzut, jaki dotknął naszą rodzinę. Mówiono powszechnie, że mój ojciec skradł wszystkie papiery wartościowe, które leżały w banku w depozycie, i uciekł z nimi. Otóż to nie jest prawdą. Był święcie przekonany, że zdoła wszystko doprowadzić do porządku i zapłacić należne pieniądze każdemu wierzycielowi, jeżeli tylko będzie miał czas na przeprowadzenie nowych interesów. Na swoim małym jachcie odpłynął do Norwegii tuż przedtem, zanim wydano rozkaz aresztowania go. Przypominam sobie dokładnie tę ostatnią noc, kiedy nas pożegnał, niestety na zawsze. Pozostawił nam spis papierów wartościowych, jakie zabrał ze sobą, i złożył przysięgę mojej matce, że powróci, aby odzyskać utraconą cześć i zapłacić wszystkie należności, tak aby nikt z tych, którzy mu zawierzyli, nie poniósł szkody."
    chunks:
      - pl: "— Więc, jak mówię,"
        ru: "— Итак, как я говорю,"
      - pl: " zbiegły bankier Neligan był moim ojcem."
        ru: "беглый банкир Нелиган был моим отцом."
        note: "zbiegły — беглый"
      - pl: " Bankructwo to bolało naprawdę tylko jego,"
        ru: "Это банкротство по-настоящему тяжело ударило только по нему,"
