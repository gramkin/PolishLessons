  - clean: "Ale ledwie miał czas się obrócić i zrobić parę kroków ku drzwiom, gdy już dłoń Hopkinsa spoczęła na jego ramieniu. Z ust wydarł mu się okrzyk przerażenia, kiedy zrozumiał, że został schwytany. Zapaliliśmy znowu świecę; nasz biedny więzień drżał ciągle i wił się rozpaczliwie pod ręką detektywa. Potem osunął się na skrzynię okrętową i bezradnie spoglądał na nas po kolei."
    chunks:
