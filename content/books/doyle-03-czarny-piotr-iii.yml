  - clean: "Przybyłem do Sussex, zamierzając zobaczyć się z nim i rozmówić. Ale właśnie wtedy nastąpiła jego nagła śmierć. W sprawozdaniu o oględzinach miejsca zbrodni wyczytałem opis jego kabiny, była tam także wzmianka, że kapitan przechowywał w niej stare księgi urzędowe swojego okrętu. Przyszło mi na myśl, że gdybym zobaczył, co się działo w sierpniu 1883 roku na pokładzie „Narwala”, może w ten sposób mógłbym rozjaśnić zagadkę śmierci mojego ojca. Próbowałem wczoraj w nocy wedrzeć się do chaty i zobaczyć te księgi, ale nie starczyło mi sił na otwarcie drzwi. Dzisiaj ponowiłem próbę, tym razem ze szczęśliwym wynikiem. Niestety, z niezmierną rozpaczą przekonałem się, że karty dotyczące tego miesiąca są wydarte z księgi; w tej samej chwili wpadłem w ręce panów jako więzień."
