        ru: "он захлопнул книгу ударом сжатого кулака,"
        note: "zaciśnięty — сжатый; dłoń — ладонь, кисть"
      - pl: " rzucił ją z gniewem w kąt pokoju"
        ru: "в гневе швырнул её в угол комнаты"
