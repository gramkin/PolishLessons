        note: "rozglądać się — оглядываться; dokoła — вокруг"
      - pl: " Postawił kawałeczek świeczki na stole"
        ru: "Он поставил огарок свечи на стол"
        note: "kawałeczek — кусочек"
      - pl: " i zniknął nam z oczu w jednym z kątów pokoju."
