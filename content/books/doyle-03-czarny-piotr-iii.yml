  - clean: "Oczywiście, starałem się dowiedzieć jakichś szczegółów o tym człowieku. Nie było to zbyt trudne do przeprowadzenia. Wykryłem, że Piotr Carey był komendantem statku polującego na wieloryby i że właśnie powracał z wód polarnych wówczas, kiedy mój ojciec popłynął do Norwegii. Jesień owego roku była bardzo burzliwa, bez przerwy trwały długie niepogody i orkany wywoływane południowym wichrem. Nie było nieprawdopodobne, że jacht mojego ojca został zapędzony na północ i że tam spotkał okręt Piotra Careya. Bez względu na to, jak się sprawa przedstawiała, przede wszystkim zajmowało mnie pytanie, co się stało z moim ojcem. Chodziło mi o zrehabilitowanie jego pamięci. Gdybym z pomocą świadectwa Piotra Careya zdołał dowieść, w jaki sposób te papiery wartościowe dostały się na giełdę, byłoby to także dowodem, że mój ojciec ich nie sprzedał i że nie miał żadnej osobistej korzyści z tego, że zabrał je z sobą."
