# review
title: Czarny Piotr
titleRu: Чёрный Питер
author: Arthur Conan Doyle
translator: "tłumacz nieznany"
source:
  name: "Wolne Lektury (Arthur Conan Doyle, «Tajemnica oblubienicy i inne nowele», Gebethner i Wolf 1905)"
  url: https://wolnelektury.pl/katalog/lektura/doyle-czarny-piotr/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 3
chapterTitle: "Zasadzka"
chapterTitleRu: "Засада"
level: B2
paragraphs:
  - clean: "W chwili gdy układaliśmy naszą zasadzkę, była godzina jedenasta. Hopkins radził, aby drzwi do chaty pozostawić otwarte, lecz Holmes zwrócił słusznie uwagę, że to obudziłoby podejrzenie owego nieznanego gościa. Zamek był bardzo prosty. Dość było odsunąć go na bok silnym nożem, aby wejść do chaty."
    chunks:
      - pl: "W chwili gdy układaliśmy naszą zasadzkę,"
        ru: "Когда мы устраивали нашу засаду,"
        note: "układać — укладывать; здесь «устраивать, готовить»"
      - pl: " była godzina jedenasta."
        ru: "было одиннадцать часов."
      - pl: " Hopkins radził, aby drzwi do chaty pozostawić otwarte,"
        ru: "Хопкинс советовал оставить дверь хижины открытой,"
        note: "radzić — советовать"
      - pl: " lecz Holmes zwrócił słusznie uwagę,"
        ru: "но Холмс справедливо заметил,"
        note: "słusznie — справедливо, правильно"
      - pl: " że to obudziłoby podejrzenie owego nieznanego gościa."
        ru: "что это вызвало бы подозрение у того неизвестного гостя."
        note: "obudzić podejrzenie — вызвать подозрение"
      - pl: " Zamek był bardzo prosty."
        ru: "Замок был очень простой."
        note: "zamek — и «замок» (запор), и «замок» (дворец)"
      - pl: " Dość było odsunąć go na bok silnym nożem,"
        ru: "Достаточно было отодвинуть его в сторону крепким ножом,"
        note: "dość — достаточно"
      - pl: " aby wejść do chaty."
        ru: "чтобы войти в хижину."
    words: { "układaliśmy": ukladac, "zasadzkę": zasadzka, "chaty": chata, "pozostawić": pozostawic, "słusznie": slusznie, "podejrzenie": podejrzenie }
  - clean: "Holmes zaproponował także, aby czekać nie we wnętrzu chaty, lecz w krzakach obok okna. Tym sposobem można będzie, jak mówił, pilnować nieproszonego gościa i zobaczyć, co będzie robił, zapaliwszy światło."
    chunks:
      - pl: "Holmes zaproponował także,"
        ru: "Холмс предложил также"
      - pl: " aby czekać nie we wnętrzu chaty,"
        ru: "ждать не внутри хижины,"
      - pl: " lecz w krzakach obok okna."
        ru: "а в кустах возле окна."
      - pl: " Tym sposobem można będzie, jak mówił,"
        ru: "Таким образом, как он говорил, можно будет"
        note: "tym sposobem — таким образом"
      - pl: " pilnować nieproszonego gościa"
        ru: "следить за непрошеным гостем"
        note: "pilnować kogoś — стеречь, следить за кем-л.: родительный"
      - pl: " i zobaczyć, co będzie robił, zapaliwszy światło."
        ru: "и увидеть, что он станет делать, когда зажжёт свет."
        note: "zapaliwszy — деепричастие прошедшего: «зажёгши»"
    words: { "zaproponował": zaproponowac, "wnętrzu": wnetrze, "chaty": chata, "okna": okno, "pilnować": pilnowac, "zapaliwszy": zapalic }
  - clean: "Zaczęło się długie i melancholiczne oczekiwanie — oczekiwanie myśliwego, który leży koło leśnego jeziorka i czeka na zwierzynę, która ma wyjść napić się wody. Nasze myśli krążyły wokół tego nieznanego człowieka, który miał się nam ukazać, wyjść na nas z ciemności. Cóż to była za zwierzyna? Czy tygrys, którego można schwytać tylko w otwartej walce na kły i pazury, czy też podstępny szakal, straszny tylko dla tchórzów?"
    chunks:
      - pl: "Zaczęło się długie i melancholiczne oczekiwanie —"
        ru: "Началось долгое и тоскливое ожидание —"
      - pl: " oczekiwanie myśliwego,"
        ru: "ожидание охотника,"
        note: "myśliwy — охотник"
      - pl: " który leży koło leśnego jeziorka"
        ru: "который лежит у лесного озерца"
      - pl: " i czeka na zwierzynę,"
        ru: "и ждёт дичь,"
        note: "zwierzyna — дичь, зверь"
      - pl: " która ma wyjść napić się wody."
        ru: "которая должна выйти на водопой."
      - pl: " Nasze myśli krążyły wokół tego nieznanego człowieka,"
        ru: "Наши мысли кружили вокруг этого неизвестного человека,"
        note: "krążyć wokół — кружить вокруг"
      - pl: " który miał się nam ukazać,"
        ru: "который должен был нам явиться,"
        note: "ukazać się — показаться, явиться"
      - pl: " wyjść na nas z ciemności."
        ru: "выйти на нас из темноты."
      - pl: " Cóż to była za zwierzyna?"
        ru: "Что это был за зверь?"
        note: "cóż to za — что это за"
      - pl: " Czy tygrys, którego można schwytać"
        ru: "Тигр ли, которого можно поймать"
        note: "czy… czy też — то ли… то ли"
      - pl: " tylko w otwartej walce na kły i pazury,"
        ru: "только в открытой схватке, клыками и когтями,"
        note: "kieł — клык; pazur — коготь"
      - pl: " czy też podstępny szakal, straszny tylko dla tchórzów?"
        ru: "или коварный шакал, страшный лишь для трусов?"
        note: "podstępny — коварный; tchórz — трус"
    words: { "myśliwego": mysliwy, "krążyły": krazyc, "ciemności": ciemnosc, "tygrys": tygrys, "schwytać": schwytac, "tchórzów": tchorz }
  - clean: "W absolutnym milczeniu kuliliśmy się pod krzakami, czekając na dalszy bieg wypadków. Z początku dochodziły nas spieszne kroki zapóźnionych wieśniaków i głosy brzmiące od strony wsi. Powoli jednak zapadała absolutna cisza, głosy marły jeden po drugim, z wyjątkiem dalekiego zegara na wieży kościelnej, który co pół godziny wskazywał nam swym dźwiękiem, jak upływa czas, i z wyjątkiem szemrzącego strumienia deszczu, który spływał po liściastym dachu osłaniającym nas ze wszystkich stron."
    chunks:
      - pl: "W absolutnym milczeniu"
        ru: "В полном молчании"
      - pl: " kuliliśmy się pod krzakami,"
        ru: "мы сидели, съёжившись, под кустами,"
        note: "kulić się — съёживаться"
      - pl: " czekając na dalszy bieg wypadków."
        ru: "ожидая дальнейшего хода событий."
        note: "bieg wypadków — ход событий"
      - pl: " Z początku dochodziły nas spieszne kroki zapóźnionych wieśniaków"
        ru: "Поначалу до нас доносились торопливые шаги запоздалых крестьян"
        note: "dochodzić kogoś — доноситься до кого-л.; wieśniak — сельский житель"
      - pl: " i głosy brzmiące od strony wsi."
        ru: "и голоса со стороны деревни."
        note: "brzmieć — звучать"
      - pl: " Powoli jednak zapadała absolutna cisza,"
        ru: "Постепенно, однако, наступала полная тишина,"
        note: "zapadać — наступать (о тишине, ночи)"
      - pl: " głosy marły jeden po drugim,"
        ru: "голоса затихали один за другим,"
        note: "mrzeć — книжное «умирать, затихать»"
      - pl: " z wyjątkiem dalekiego zegara na wieży kościelnej,"
        ru: "кроме далёких часов на церковной башне,"
        note: "z wyjątkiem + родительный — за исключением"
      - pl: " który co pół godziny wskazywał nam swym dźwiękiem,"
        ru: "которые каждые полчаса своим звоном показывали нам,"
      - pl: " jak upływa czas,"
        ru: "как течёт время,"
        note: "upływać — проходить, истекать (о времени)"
      - pl: " i z wyjątkiem szemrzącego strumienia deszczu,"
        ru: "и кроме журчащих струй дождя,"
        note: "szemrać — журчать"
      - pl: " który spływał po liściastym dachu"
        ru: "стекавших по лиственной крыше,"
      - pl: " osłaniającym nas ze wszystkich stron."
        ru: "укрывавшей нас со всех сторон."
        note: "osłaniać — заслонять, укрывать"
    words: { "absolutnym": absolutny, "bieg": bieg, "zegara": zegar, "wieży": wieza, "strumienia": strumien }
  - clean: "Wybiło wpół do trzeciej. Było bardzo ciemno, jak zwykle bezpośrednio przed nadejściem zmroku. Nagle usłyszeliśmy, że od strony parkanu zbliżają się wolne, ostrożne kroki."
    chunks:
      - pl: "Wybiło wpół do trzeciej."
        ru: "Пробило половину третьего."
        note: "wybić — пробить (о часах); wpół do trzeciej — половина третьего"
      - pl: " Było bardzo ciemno,"
        ru: "Было очень темно,"
      - pl: " jak zwykle bezpośrednio przed nadejściem zmroku."
        ru: "как обычно бывает перед самым наступлением сумерек."
        note: "zmrok — сумерки; у Дойла здесь «самый тёмный час перед рассветом», переводчик 1905 года выразился неточно"
      - pl: " Nagle usłyszeliśmy,"
        ru: "Вдруг мы услышали,"
      - pl: " że od strony parkanu zbliżają się wolne, ostrożne kroki."
        ru: "что со стороны забора приближаются медленные, осторожные шаги."
        note: "parkan — забор; wolny — здесь «медленный», а не «свободный»"
    words: { "Wybiło": wybic, "bezpośrednio": bezposrednio, "zmroku": zmrok, "zbliżają": zblizac, "ostrożne": ostrozny }
  - clean: "Ktoś stąpał po drodze. Potem nastała długa chwila ciszy, zacząłem się już obawiać, że wszystko, cośmy słyszeli, było tylko fałszywym alarmem i złudzeniem zmysłów, gdy odezwał się znowu odgłos cichych, ostrożnych kroków, tym razem z drugiej strony chaty. Po chwili usłyszeliśmy także zgrzyt metalu i ciche uderzenia."
    chunks:
      - pl: "Ktoś stąpał po drodze."
        ru: "Кто-то ступал по дороге."
        note: "stąpać — ступать"
      - pl: " Potem nastała długa chwila ciszy,"
        ru: "Потом наступила долгая тишина,"
        note: "nastać — наступить"
      - pl: " zacząłem się już obawiać,"
        ru: "я уже начал опасаться,"
        note: "obawiać się — опасаться"
      - pl: " że wszystko, cośmy słyszeli,"
        ru: "что всё, что мы слышали,"
        note: "cośmy — co + -śmy: окончание прошедшего времени ушло к союзу"
      - pl: " było tylko fałszywym alarmem i złudzeniem zmysłów,"
        ru: "было лишь ложной тревогой и обманом чувств,"
        note: "złudzenie — иллюзия; zmysł — чувство (зрение, слух…)"
      - pl: " gdy odezwał się znowu odgłos cichych, ostrożnych kroków,"
        ru: "как вдруг снова раздался звук тихих, осторожных шагов,"
        note: "odezwać się — раздаться, отозваться"
      - pl: " tym razem z drugiej strony chaty."
        ru: "на этот раз с другой стороны хижины."
      - pl: " Po chwili usłyszeliśmy także zgrzyt metalu i ciche uderzenia."
        ru: "Через минуту мы услышали ещё скрежет металла и тихие удары."
        note: "zgrzyt — скрежет"
    words: { "zmysłów": zmysl, "odgłos": odglos, "chaty": chata, "zgrzyt": zgrzyt, "metalu": metal }
  - clean: "Nieznany człowiek usiłował wyłamać zamek przy drzwiach. Tym razem albo jego zręczność była większa, albo posiadał lepsze narzędzie, bo nagle odezwał się szczęk zardzewiałych zawiasów i trzeszczenie drzewa. Potem rozbłysła zapałka, w następnej chwili światło świecy napełniło wnętrze chaty. Przez firanki i kwiaty patrzyliśmy z zaciekawieniem na rozgrywającą się wewnątrz scenę. Nocny gość był młodym człowiekiem, wyglądał chorobliwie, był chudy, miał czarne wąsiki, wskutek których śmiertelnie blada twarz wydawała się jeszcze bielsza. O ile się zdawało, nie miał więcej jak dwadzieścia lat. Nie widziałem nigdy żadnej ludzkiej istoty, która by budziła tak wielką litość wskutek przestrachu, jaki ją opanował. Zęby młodego człowieka szczękały głośno, drżał na całym ciele. Był ubrany jak dżentelmen, na głowie miał sukienną czapeczkę."
    chunks:
      - pl: "Nieznany człowiek usiłował wyłamać zamek przy drzwiach."
        ru: "Неизвестный пытался взломать замок на двери."
        note: "usiłować — пытаться; wyłamać — взломать"
      - pl: " Tym razem albo jego zręczność była większa,"
        ru: "На этот раз то ли его ловкость была больше,"
        note: "zręczność — ловкость"
      - pl: " albo posiadał lepsze narzędzie,"
        ru: "то ли у него был инструмент получше,"
      - pl: " bo nagle odezwał się szczęk zardzewiałych zawiasów"
        ru: "потому что вдруг раздался скрип ржавых петель"
        note: "szczęk — лязг; zawias — дверная петля"
      - pl: " i trzeszczenie drzewa."
        ru: "и треск дерева."
        note: "drzewo — здесь «древесина», обычно «дерево» (растение)"
      - pl: " Potem rozbłysła zapałka,"
        ru: "Потом вспыхнула спичка,"
      - pl: " w następnej chwili światło świecy napełniło wnętrze chaty."
        ru: "в следующее мгновение свет свечи наполнил хижину."
      - pl: " Przez firanki i kwiaty"
        ru: "Сквозь занавески и цветы"
      - pl: " patrzyliśmy z zaciekawieniem na rozgrywającą się wewnątrz scenę."
        ru: "мы с любопытством смотрели на сцену, разыгрывавшуюся внутри."
        note: "rozgrywać się — разыгрываться, происходить"
      - pl: " Nocny gość był młodym człowiekiem,"
        ru: "Ночной гость был молодым человеком,"
      - pl: " wyglądał chorobliwie, był chudy,"
        ru: "выглядел болезненно, был худ,"
      - pl: " miał czarne wąsiki,"
        ru: "у него были чёрные усики,"
      - pl: " wskutek których śmiertelnie blada twarz wydawała się jeszcze bielsza."
        ru: "из-за которых смертельно бледное лицо казалось ещё белее."
        note: "wskutek + родительный — вследствие"
      - pl: " O ile się zdawało, nie miał więcej jak dwadzieścia lat."
        ru: "Насколько можно было судить, ему было не больше двадцати лет."
        note: "więcej jak — старое «больше чем», сегодня więcej niż"
      - pl: " Nie widziałem nigdy żadnej ludzkiej istoty,"
        ru: "Я никогда не видел ни одного человеческого существа,"
      - pl: " która by budziła tak wielką litość"
        ru: "которое вызывало бы такую жалость"
        note: "budzić litość — вызывать жалость"
      - pl: " wskutek przestrachu, jaki ją opanował."
        ru: "из-за охватившего его страха."
        note: "opanować — овладеть, охватить"
      - pl: " Zęby młodego człowieka szczękały głośno,"
        ru: "Зубы молодого человека громко стучали,"
      - pl: " drżał na całym ciele."
        ru: "он дрожал всем телом."
        note: "drżeć — дрожать"
      - pl: " Był ubrany jak dżentelmen,"
        ru: "Он был одет как джентльмен,"
      - pl: " na głowie miał sukienną czapeczkę."
        ru: "на голове у него была суконная кепочка."
        note: "sukno — сукно"
    words: { "usiłował": usilowac, "świecy": swieca, "chudy": chudy, "śmiertelnie": smiertelnie, "blada": blady }
  - clean: "Obserwowaliśmy go, jak przestraszonym wzrokiem rozglądał się dokoła siebie. Postawił kawałeczek świeczki na stole i zniknął nam z oczu w jednym z kątów pokoju. Po chwili powrócił na środek, trzymając w ręku jedną z dużych ksiąg okrętowych, które stały w szeregu na półce. Pochylił się nad stołem i szybko przewracał karty książki, aż wreszcie doszedł widocznie do miejsca, którego szukał. Potem z wściekłością na twarzy zamknął książkę uderzeniem zaciśniętej dłoni, rzucił ją z gniewem w kąt pokoju i zagasił światło."
