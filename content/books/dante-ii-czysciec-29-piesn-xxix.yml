chapterTitle: "Pieśń XXIX"
chapterTitleRu: "Песнь XXIX. Шествие Церкви"
level: B2
paragraphs:
  - clean: "(Pochód zwycięski prawdziwego Kościoła objawia się na przeciwnym brzegu strumienia.)"
    chunks:
      - pl: "(Pochód zwycięski prawdziwego Kościoła objawia się na przeciwnym brzegu strumienia.)"
        ru: "(Победное шествие истинной Церкви является на противоположном берегу ручья.)"
    words: { "zwycięski": zwycieski, "prawdziwego": prawdziwy, "Kościoła": kosciol, "przeciwnym": przeciwny, "brzegu": brzeg, "strumienia": strumien }
  - clean: "Jak zakochana, co słodką rozmową\nAlbo przegrawką swoją pieśń przeplata,\nOna tak zwrotkę zanuciła nową:\nBeati, quorum tecta sunt peccata.\nPotem jak nimfy samotnie błądzące\nW cienistych gajach, brzegami potoków,\nTa szuka cienia, ta chce widzieć słońce,\nOna szła z wolna przeciw rzeki biegu;\nWedług niej szedłem drugą stroną brzegu."
    verse: true
    chunks:
      - pl: "Jak zakochana, co słodką rozmową"
        ru: "Как влюблённая, что сладкой беседой"
      - pl: "\nAlbo przegrawką swoją pieśń przeplata,"
        ru: "или своим наигрышем перемежает песнь,"
        note: "przegrawka — наигрыш"
      - pl: "\nOna tak zwrotkę zanuciła nową:"
        ru: "так она запела новый куплет:"
      - pl: "\nBeati, quorum tecta sunt peccata."
        ru: "«Beati, quorum tecta sunt peccata»."
        note: "«Блаженны, чьи грехи покрыты»"
      - pl: "\nPotem jak nimfy samotnie błądzące"
        ru: "Потом, как нимфы, одиноко блуждающие"
      - pl: "\nW cienistych gajach, brzegami potoków,"
        ru: "в тенистых рощах, по берегам потоков,"
      - pl: "\nTa szuka cienia, ta chce widzieć słońce,"
        ru: "одна ищет тени, другая хочет видеть солнце,"
      - pl: "\nOna szła z wolna przeciw rzeki biegu;"
        ru: "она шла медленно против течения реки;"
      - pl: "\nWedług niej szedłem drugą stroną brzegu."
        ru: "вровень с ней я шёл по другой стороне берега."
    words: { "pieśń": piesn, "samotnie": samotnie, "cienia": cien, "słońce": slonce, "rzeki": rzeka, "biegu": bieg }
  - clean: "Jeszcześmy może nie uszli stu kroków,\nGdy oba brzegi swój zakręt złamały\nW sposób, żem na wschód obrócił się cały.\nKrótko tak szliśmy przeciw wschodu słońca,\nGdy piękna dama do mnie się zwróciła,\n«Mój bracie, patrzaj i słuchaj» mówiła."
    verse: true
    chunks:
      - pl: "Jeszcześmy może nie uszli stu kroków,"
        ru: "Мы прошли ещё, может быть, не сто шагов,"
      - pl: "\nGdy oba brzegi swój zakręt złamały"
        ru: "когда оба берега изломили свой изгиб"
      - pl: "\nW sposób, żem na wschód obrócił się cały."
        ru: "так, что я весь обратился к востоку."
      - pl: "\nKrótko tak szliśmy przeciw wschodu słońca,"
        ru: "Недолго так мы шли навстречу восходу солнца,"
      - pl: "\nGdy piękna dama do mnie się zwróciła,"
        ru: "как прекрасная дама обернулась ко мне:"
      - pl: "\n«Mój bracie, patrzaj i słuchaj» mówiła."
        ru: "«Мой брат, смотри и слушай», — сказала она."
    words: { "uszli": ujsc, "zakręt": zakret, "wschód": wschod, "obrócił": obrocic, "dama": dama, "zwróciła": zwrocic }
  - clean: "Wtem las jak wielki, od końca do końca\nBlask nagły przebiegł; złudzona źrenica\nKazała wierzyć, że to błyskawica.\nLecz gdy ta szybko przepada jak wschodzi,\nA blask ten coraz żywsze ognie niecił,\nKtórymi w końcu cały las oświecił,\nMówiłem w myśli: «Skąd ten blask pochodzi?"
    verse: true
    chunks:
      - pl: "Wtem las jak wielki, od końca do końca"
        ru: "Тут лес, как он велик, от края до края"
      - pl: "\nBlask nagły przebiegł; złudzona źrenica"
        ru: "пробежал внезапный блеск; обманутый зрачок"
      - pl: "\nKazała wierzyć, że to błyskawica."
        ru: "заставил верить, что это молния."
      - pl: "\nLecz gdy ta szybko przepada jak wschodzi,"
        ru: "Но так как та быстро исчезает, как появляется,"
      - pl: "\nA blask ten coraz żywsze ognie niecił,"
        ru: "а этот блеск разжигал всё более живые огни,"
      - pl: "\nKtórymi w końcu cały las oświecił,"
        ru: "которыми в конце осветил весь лес,"
      - pl: "\nMówiłem w myśli: «Skąd ten blask pochodzi?"
        ru: "я говорил в мыслях: «Откуда этот блеск?»"
    words: { "Blask": blask, "nagły": nagly, "przepada": przepadac, "coraz": coraz, "żywsze": zywy, "pochodzi": pochodzic }
  - clean: "W powietrzu jasnym słodkie wiały śpiewy,\nWtedy ja z dobrej żarliwości ducha\nJąłem wyrzekać na zuchwałość Ewy;\nBo tam, gdzie ziemia i gdzie niebo słucha,\nJedna niewiasta, ledwo że wyrosła,\nJuż być pod jakąś zasłoną nie zniosła:\nA gdyby pod tą została zasłoną,\nMógłbym i prędzej, i dłużej zaiste\nUciech tych słodycz czuć niewysłowioną."
    verse: true
    chunks:
      - pl: "W powietrzu jasnym słodkie wiały śpiewy,"
        ru: "В ясном воздухе веяли сладкие песни,"
      - pl: "\nWtedy ja z dobrej żarliwości ducha"
        ru: "тогда я по доброй ревности духа"
      - pl: "\nJąłem wyrzekać na zuchwałość Ewy;"
        ru: "начал роптать на дерзость Евы;"
        note: "wyrzekać — роптать"
      - pl: "\nBo tam, gdzie ziemia i gdzie niebo słucha,"
        ru: "ибо там, где земля и где небо послушны,"
      - pl: "\nJedna niewiasta, ledwo że wyrosła,"
        ru: "одна женщина, едва выросшая,"
      - pl: "\nJuż być pod jakąś zasłoną nie zniosła:"
        ru: "уже не стерпела быть под каким-либо покровом:"
        note: "под запретом"
      - pl: "\nA gdyby pod tą została zasłoną,"
        ru: "а если бы она осталась под этим покровом,"
      - pl: "\nMógłbym i prędzej, i dłużej zaiste"
        ru: "я мог бы и скорее, и дольше, воистину,"
      - pl: "\nUciech tych słodycz czuć niewysłowioną."
        ru: "чувствовать невыразимую сладость этих утех."
        note: "uciecha — утеха"
    words: { "niewiasta": niewiasta, "ledwo": ledwo, "zasłoną": zaslona, "zniosła": zniesc, "prędzej": predko, "słodycz": slodycz }
  - clean: "Wielkim zadatkiem uciech kołysany\nWiecznych, mających trwanie rzeczywiste,\nGdy szedłem z wolna i cały zmieszany,\nPowietrze jakby ogniem zapalone\nBuchnęło światłem przez liście zielone:\nDźwięk słodki, cośmy słyszeli już wcześniej,\nStał się wyraźną, czystą nutą pieśni."
    verse: true
    chunks:
      - pl: "Wielkim zadatkiem uciech kołysany"
        ru: "Убаюкиваемый великим залогом утех"
      - pl: "\nWiecznych, mających trwanie rzeczywiste,"
        ru: "вечных, имеющих действительное существование,"
      - pl: "\nGdy szedłem z wolna i cały zmieszany,"
        ru: "когда я шёл медленно и весь смущённый,"
      - pl: "\nPowietrze jakby ogniem zapalone"
        ru: "воздух, будто зажжённый огнём,"
      - pl: "\nBuchnęło światłem przez liście zielone:"
        ru: "полыхнул светом сквозь зелёные листья:"
      - pl: "\nDźwięk słodki, cośmy słyszeli już wcześniej,"
        ru: "сладкий звук, что мы слышали уже раньше,"
      - pl: "\nStał się wyraźną, czystą nutą pieśni."
        ru: "стал явным, чистым напевом песни."
    words: { "Wiecznych": wieczny, "trwanie": trwac, "zmieszany": zmieszac, "Powietrze": powietrze, "zapalone": zapalic, "Dźwięk": dzwiek }
  - clean: "O! jeślim cierpiał dla was, święte panny,\nGłód, chłód, bezsenność i trud nieustanny,\nWaszej pomocy ja tu wezwać muszę;\nNiechaj Helikon zaleje mi duszę,\nNiech Uranija z sióstr swych gronem całem\nŁaskawie mojej pieśni nie zaprzeczy,\nWłożyć w rym trudne do pojęcia rzeczy."
    verse: true
    chunks:
      - pl: "O! jeślim cierpiał dla was, święte panny,"
        ru: "О! если я терпел ради вас, святые девы,"
        note: "Музы"
      - pl: "\nGłód, chłód, bezsenność i trud nieustanny,"
        ru: "голод, холод, бессонницу и непрестанный труд,"
      - pl: "\nWaszej pomocy ja tu wezwać muszę;"
        ru: "я должен здесь призвать вашу помощь;"
      - pl: "\nNiechaj Helikon zaleje mi duszę,"
        ru: "пусть Геликон зальёт мне душу,"
      - pl: "\nNiech Uranija z sióstr swych gronem całem"
        ru: "пусть Урания со всем кругом своих сестёр"
      - pl: "\nŁaskawie mojej pieśni nie zaprzeczy,"
        ru: "милостиво не откажет моей песни"
      - pl: "\nWłożyć w rym trudne do pojęcia rzeczy."
        ru: "вложить в рифму вещи, трудные для понимания."
    words: { "cierpiał": cierpiec, "Głód": glod, "trud": trud, "gronem": grono, "zaprzeczy": zaprzeczyc, "Włożyć": wlozyc }
  - clean: "Zdało się, złotych siedem drzew widziałem,\nBędąc złudzonym zbyt wielką przestrzenią,\nPomiędzy nami a nowym przedmiotem:\nLecz gdy do tyla zbliżyłem się potem,\nŻe przedmiot zmysłom kłamiący złudzeniem\nZaprzestał zwodzić oczy oddaleniem,\nWładza, co wiąże z rozumem rozmowę,\nRzeczywistością rozwiała błąd cały:\nWidzę, świeczniki złotem się promienią,\nSłyszałem, głosy: «Hosanna!» śpiewały."
    verse: true
    chunks:
      - pl: "Zdało się, złotych siedem drzew widziałem,"
        ru: "Мне показалось, что я видел семь золотых деревьев,"
      - pl: "\nBędąc złudzonym zbyt wielką przestrzenią,"
        ru: "будучи обманут слишком большим расстоянием"
      - pl: "\nPomiędzy nami a nowym przedmiotem:"
        ru: "между нами и новым предметом:"
      - pl: "\nLecz gdy do tyla zbliżyłem się potem,"
        ru: "но когда я затем настолько приблизился,"
      - pl: "\nŻe przedmiot zmysłom kłamiący złudzeniem"
        ru: "что предмет, лгущий чувствам обманом,"
      - pl: "\nZaprzestał zwodzić oczy oddaleniem,"
        ru: "перестал обманывать глаза расстоянием,"
      - pl: "\nWładza, co wiąże z rozumem rozmowę,"
        ru: "способность, что связывает речь с разумом,"
      - pl: "\nRzeczywistością rozwiała błąd cały:"
        ru: "действительностью развеяла всю ошибку:"
      - pl: "\nWidzę, świeczniki złotem się promienią,"
        ru: "вижу — светильники сияют золотом,"
        note: "świecznik — светильник"
      - pl: "\nSłyszałem, głosy: «Hosanna!» śpiewały."
        ru: "я слышал, голоса пели: «Осанна!»"
    words: { "przedmiotem": przedmiot, "zbliżyłem": zblizyc, "zmysłom": zmysl, "wiąże": wiazac, "rozumem": rozum, "złotem": zloto }
  - clean: "Z świeczników w sklepy niebios lazurowe\nI czyste biła światłość więcej lśniąca\nNiż w północ w środku pełni od miesiąca.\nPełen podziwu, gdzie stał mój Wirgili,\nZwróciłem oczy, lecz i on w tej chwili\nOdrzekł mi nie mniej zadziwionym wzrokiem."
    verse: true
    chunks:
      - pl: "Z świeczników w sklepy niebios lazurowe"
        ru: "От светильников в лазурные своды небес"
      - pl: "\nI czyste biła światłość więcej lśniąca"
        ru: "и чистые бил свет более сияющий,"
      - pl: "\nNiż w północ w środku pełni od miesiąca."
        ru: "чем в полночь в середине полнолуния от месяца."
      - pl: "\nPełen podziwu, gdzie stał mój Wirgili,"
        ru: "Полный изумления, туда, где стоял мой Вергилий,"
      - pl: "\nZwróciłem oczy, lecz i on w tej chwili"
        ru: "я обратил глаза, но и он в этот миг"
      - pl: "\nOdrzekł mi nie mniej zadziwionym wzrokiem."
        ru: "ответил мне не менее изумлённым взглядом."
    words: { "niebios": niebiosa, "biła": bic, "północ": polnoc, "środku": srodek, "Pełen": pelny, "wzrokiem": wzrok }
  - clean: "Znów na wysokie spojrzałem świeczniki,\nKtóre szły do nas powolniejszym krokiem,\nNiźli do ślubu idzie panna młoda.\n«Przecz» rzekła dama «w te złote ozdoby\nW te żywe światła tak wraziłeś oczy,\nŻe nic nie widzisz, kto za nimi kroczy?»"
    verse: true
    chunks:
      - pl: "Znów na wysokie spojrzałem świeczniki,"
        ru: "Снова я взглянул на высокие светильники,"
      - pl: "\nKtóre szły do nas powolniejszym krokiem,"
        ru: "что шли к нам более медленным шагом,"
      - pl: "\nNiźli do ślubu idzie panna młoda."
        ru: "чем идёт к венцу невеста."
      - pl: "\n«Przecz» rzekła dama «w te złote ozdoby"
        ru: "«Почему, — сказала дама, — в эти золотые украшения,"
      - pl: "\nW te żywe światła tak wraziłeś oczy,"
        ru: "в эти живые огни ты так вперил глаза,"
        note: "wrazić — вонзить, вперить"
      - pl: "\nŻe nic nie widzisz, kto za nimi kroczy?»"
        ru: "что не видишь, кто за ними шагает?»"
    words: { "spojrzałem": spojrzec, "krokiem": krok, "ślubu": slub, "panna": panna, "rzekła": rzec, "ozdoby": ozdoba }
  - clean: "I jakby z tyłu szły ich przewodniki,\nWidziałem w bieli ubrane osoby,\nA taka białość, jaka szat ich była,\nNigdy na ziemi oczom nie świeciła.\nW lewo błyszczała taka jasna woda,\nGdyby źrenica gdzie indziej zwrócona\nMogła w nią spojrzeć, moja lewa strona\nJak we zwierciadle w niej by się odbiła."
    verse: true
    chunks:
      - pl: "I jakby z tyłu szły ich przewodniki,"
        ru: "И словно сзади шли их вожатые,"
      - pl: "\nWidziałem w bieli ubrane osoby,"
        ru: "я видел особ, одетых в белое,"
      - pl: "\nA taka białość, jaka szat ich była,"
        ru: "а такая белизна, какой была их одежда,"
      - pl: "\nNigdy na ziemi oczom nie świeciła."
        ru: "никогда на земле не светила глазам."
      - pl: "\nW lewo błyszczała taka jasna woda,"
        ru: "Слева блестела такая ясная вода,"
      - pl: "\nGdyby źrenica gdzie indziej zwrócona"
        ru: "что, если бы зрачок, обращённый в другое место,"
      - pl: "\nMogła w nią spojrzeć, moja lewa strona"
        ru: "мог в неё взглянуть, моя левая сторона"
      - pl: "\nJak we zwierciadle w niej by się odbiła."
        ru: "отразилась бы в ней, как в зеркале."
    words: { "przewodniki": przewodnik, "świeciła": swiecic, "błyszczała": blyszczec, "woda": woda, "indziej": indziej, "odbiła": odbic }
  - clean: "Gdy już doszedłem, gdzie z tym gronem całem\nDzielił mię tylko wąski nurt potoku,\nChcąc lepiej widzieć, zatrzymałem kroku.\nPrzodem idące płomienie widziałem\nI jak powietrze w tyle malowały\nW barwiste pręgi, które pozór miały\nPędzlów ciągnących na dłuż linijami:\nGdy w górze błyszczał łuk z siedmiu pręgami,\nJakimi dla nas zdobi niebo czasem\nSłońce swym łukiem, księżyc swoim pasem."
    verse: true
    chunks:
      - pl: "Gdy już doszedłem, gdzie z tym gronem całem"
        ru: "Когда я уже дошёл до места, где от этого круга"
      - pl: "\nDzielił mię tylko wąski nurt potoku,"
        ru: "меня отделяло лишь узкое течение потока,"
      - pl: "\nChcąc lepiej widzieć, zatrzymałem kroku."
        ru: "желая лучше видеть, я остановил шаг."
      - pl: "\nPrzodem idące płomienie widziałem"
        ru: "Я видел огни, идущие впереди,"
      - pl: "\nI jak powietrze w tyle malowały"
        ru: "и как они расписывали воздух позади"
      - pl: "\nW barwiste pręgi, które pozór miały"
        ru: "цветными полосами, что имели вид"
        note: "pręga — полоса"
      - pl: "\nPędzlów ciągnących na dłuż linijami:"
        ru: "кистей, проводящих в длину линии:"
      - pl: "\nGdy w górze błyszczał łuk z siedmiu pręgami,"
        ru: "так что вверху блестела дуга из семи полос,"
      - pl: "\nJakimi dla nas zdobi niebo czasem"
        ru: "какими нам иногда украшает небо"
      - pl: "\nSłońce swym łukiem, księżyc swoim pasem."
        ru: "солнце своей дугой, луна своим поясом."
    words: { "płomienie": plomien, "malowały": malowac, "pozór": pozor, "ciągnących": ciagnac, "łukiem": luk, "pasem": pas }
  - clean: "Gdy te sztandary już nikły w oddali,\nJakby ich pochód wódz urządził biegły,\nW przedziałach świecznik każdy postępuje\nO dziesięć kroków od siebie odległy.\nPod pięknym niebem, które opisuję,\nDwudziestu czterech starców szło parami,\nW wieńcach z liliji, a wszyscy śpiewali:\n«Między córkami Adama zrodzona,\nPiękna, na wieki bądź błogosławiona!»"
    verse: true
    chunks:
      - pl: "Gdy te sztandary już nikły w oddali,"
        ru: "Когда эти знамёна уже исчезали вдали,"
      - pl: "\nJakby ich pochód wódz urządził biegły,"
        ru: "будто их шествие устроил искусный вождь,"
      - pl: "\nW przedziałach świecznik każdy postępuje"
        ru: "в промежутках идёт каждый светильник,"
      - pl: "\nO dziesięć kroków od siebie odległy."
        ru: "отстоящий от другого на десять шагов."
      - pl: "\nPod pięknym niebem, które opisuję,"
