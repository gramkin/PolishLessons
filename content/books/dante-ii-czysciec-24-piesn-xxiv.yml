paragraphs:
  - clean: "(Papież Marcin IV i inni. Przedostatnie P znika z czoła.)"
    chunks:
      - pl: "(Papież Marcin IV i inni. Przedostatnie P znika z czoła.)"
        ru: "(Папа Мартин IV и другие. Предпоследнее «P» исчезает с чела.)"
    words: { "Papież": papiez, "inni": inny, "Przedostatnie": przedostatni, "znika": znikac, "czoła": czolo }
  - clean: "Gdy tak wciąż idziem i wciąż rozmawiamy,\nSzliśmy wypustem granitowej ściany,\nSzybko jak okręt dobrym wiatrem gnany.\nA zmarłych zda się po dwa razy cienie,\nWiedząc, żem żywy, przez oczu swych jamy\nPokazywały swoje zadziwienie."
    verse: true
    chunks:
      - pl: "Gdy tak wciąż idziem i wciąż rozmawiamy,"
        ru: "Так, всё идя и всё разговаривая,"
      - pl: "\nSzliśmy wypustem granitowej ściany,"
        ru: "мы шли по выступу гранитной стены,"
      - pl: "\nSzybko jak okręt dobrym wiatrem gnany."
        ru: "быстро, как корабль, гонимый добрым ветром."
      - pl: "\nA zmarłych zda się po dwa razy cienie,"
        ru: "А тени, казалось, дважды умершие,"
      - pl: "\nWiedząc, żem żywy, przez oczu swych jamy"
        ru: "зная, что я живой, через ямы своих глаз"
      - pl: "\nPokazywały swoje zadziwienie."
        ru: "показывали своё удивление."
    words: { "ściany": sciana, "okręt": okret, "wiatrem": wiatr, "żywy": zywy, "jamy": jama, "Pokazywały": pokazywac }
  - clean: "«Ten cień» mówiłem «z naszego powodu,\nSnadź w niebo swego nie nagli pochodu.\nMów, gdzie Pikarda? Mów, gdy łaska twoja,\nW tłumie, co na mnie zwraca wzrok tak głodny,\nCzy jest choć jeden mąż uwagi godny?»\nForeze mówił: «Piękna siostra moja\nI taka dobra! Duch jej w zachwyceniu\nCieszy się w raju tryumfu koroną»."
    verse: true
    chunks:
      - pl: "«Ten cień» mówiłem «z naszego powodu,"
        ru: "«Эта тень, — говорил я, — из-за нас,"
        note: "Стаций"
      - pl: "\nSnadź w niebo swego nie nagli pochodu."
        ru: "видно, не торопит своего шествия в небо."
      - pl: "\nMów, gdzie Pikarda? Mów, gdy łaska twoja,"
        ru: "Скажи, где Пиккарда? Скажи, будь милостив,"
        note: "сестра Форезе"
      - pl: "\nW tłumie, co na mnie zwraca wzrok tak głodny,"
        ru: "есть ли в толпе, что обращает на меня столь голодный взгляд,"
      - pl: "\nCzy jest choć jeden mąż uwagi godny?»"
        ru: "хоть один муж, достойный внимания?»"
      - pl: "\nForeze mówił: «Piękna siostra moja"
        ru: "Форезе сказал: «Прекрасная моя сестра,"
      - pl: "\nI taka dobra! Duch jej w zachwyceniu"
        ru: "и такая добрая! Её дух в восторге"
      - pl: "\nCieszy się w raju tryumfu koroną»."
        ru: "радуется в раю венцом торжества»."
    words: { "wzrok": wzrok, "godny": godny, "zachwyceniu": zachwycic, "raju": raj, "tryumfu": tryumf, "koroną": korona }
  - clean: "I dodał potem: «Tu nam nie wzbroniono\nWzajem nazywać siebie po imieniu,\nTak podobieństwo nasze głód sfałszował».\nWskazując palcem: «Patrz, jak wyschły głodem\nBuonadżunta, z miasta Lukki rodem.\nPatrz, ten najchudszy, jakby z krzyża zdjęty,\nW ramionach swoich trzymał kościół święty,\nFrank ten węgorze warzył w słodkim winie,\nNie myślił, kładąc je żywcem w naczynie,\nŻe będzie takim postem pokutował»."
    verse: true
    chunks:
      - pl: "I dodał potem: «Tu nam nie wzbroniono"
        ru: "И добавил потом: «Здесь нам не запрещено"
        note: "wzbronić — запретить"
      - pl: "\nWzajem nazywać siebie po imieniu,"
        ru: "называть друг друга по имени,"
      - pl: "\nTak podobieństwo nasze głód sfałszował»."
        ru: "так голод подделал наше сходство»."
        note: "то есть исказил черты"
      - pl: "\nWskazując palcem: «Patrz, jak wyschły głodem"
        ru: "Указывая пальцем: «Смотри, как иссох от голода"
      - pl: "\nBuonadżunta, z miasta Lukki rodem."
        ru: "Бонаджунта, родом из города Лукки."
      - pl: "\nPatrz, ten najchudszy, jakby z krzyża zdjęty,"
        ru: "Смотри: этот, самый худой, будто снятый с креста,"
      - pl: "\nW ramionach swoich trzymał kościół święty,"
        ru: "держал в своих руках святую церковь,"
      - pl: "\nFrank ten węgorze warzył w słodkim winie,"
        ru: "этот француз варил угрей в сладком вине,"
        note: "Мартин IV"
      - pl: "\nNie myślił, kładąc je żywcem w naczynie,"
        ru: "не думал, кладя их живьём в посудину,"
      - pl: "\nŻe będzie takim postem pokutował»."
        ru: "что будет каяться таким постом»."
    words: { "podobieństwo": podobienstwo, "rodem": rod-2, "najchudszy": chudy, "krzyża": krzyz, "kładąc": klasc, "naczynie": naczynie }
  - clean: "Koleją wielu po imieniu woła,\nZ nazwanych żaden ani zmarszczył czoła.\nWidziałem między tylu żarłokami\nUbalda, jak żuł powietrze zębami,\nBonifacego, co na uczty, gody,\nArcybiskupie marnował dochody."
    verse: true
    chunks:
      - pl: "Koleją wielu po imieniu woła,"
        ru: "По очереди он называет многих по имени,"
      - pl: "\nZ nazwanych żaden ani zmarszczył czoła."
        ru: "из названных ни один и бровью не повёл."
        note: "zmarszczyć czoło — нахмуриться"
      - pl: "\nWidziałem między tylu żarłokami"
        ru: "Я видел среди стольких обжор"
      - pl: "\nUbalda, jak żuł powietrze zębami,"
        ru: "Убальдино, как он жевал воздух зубами,"
      - pl: "\nBonifacego, co na uczty, gody,"
        ru: "Бонифация, что на пиры, празднества"
      - pl: "\nArcybiskupie marnował dochody."
        ru: "растрачивал архиепископские доходы."
        note: "dochód — доход"
    words: { "Koleją": kolej, "woła": wolac, "powietrze": powietrze, "zębami": zab, "marnował": marnowac, "dochody": dochod }
  - clean: "Markiza z Forli, co z pełnego dzbana\nPragnienie gasił do zmroku od rana.\nPodobny temu, co w tłumie rad bada,\nKto jemu więcej do serca przypada,\nWybrałem sobie znajomego z Lukki:\nOn imię jakiejś wyjąkał Gentuki\nGardłem zranionym przez ogień suchotny."
    verse: true
    chunks:
      - pl: "Markiza z Forli, co z pełnego dzbana"
        ru: "Маркиза из Форли, что из полного кувшина"
        note: "dzban — кувшин"
      - pl: "\nPragnienie gasił do zmroku od rana."
        ru: "утолял жажду с утра до сумерек."
      - pl: "\nPodobny temu, co w tłumie rad bada,"
        ru: "Подобный тому, кто в толпе охотно выискивает,"
      - pl: "\nKto jemu więcej do serca przypada,"
        ru: "кто ему больше приходится по сердцу,"
      - pl: "\nWybrałem sobie znajomego z Lukki:"
        ru: "я выбрал себе знакомого из Лукки:"
      - pl: "\nOn imię jakiejś wyjąkał Gentuki"
        ru: "он пробормотал имя какой-то Джентукки"
      - pl: "\nGardłem zranionym przez ogień suchotny."
        ru: "горлом, израненным иссушающим огнём."
        note: "suchotny — чахоточный, иссушающий"
    words: { "Pragnienie": pragnienie, "zmroku": zmrok, "tłumie": tlum, "bada": badac, "Gardłem": gardlo, "zranionym": zranic }
  - clean: "«Duchu,» doń rzekłem «jeśliś tak ochotny\nRozmawiać ze mną, gdy ci głos nie drażni\nWyschłej gardzieli, chciej mówić wyraźniej».\nDuch zaczął mówić: «Niewiasta zrodzona,\nKtórej lic jeszcze nie kryje zasłona,\nPrzez nią podobasz mieszkać w moim mieście;\nZ tą przepowiednią pójdziesz tam nareszcie."
    verse: true
    chunks:
      - pl: "«Duchu,» doń rzekłem «jeśliś tak ochotny"
        ru: "«Дух, — сказал я ему, — если ты так охотно"
      - pl: "\nRozmawiać ze mną, gdy ci głos nie drażni"
        ru: "говоришь со мной, если тебе голос не раздражает"
      - pl: "\nWyschłej gardzieli, chciej mówić wyraźniej»."
        ru: "иссохшей глотки, изволь говорить яснее»."
      - pl: "\nDuch zaczął mówić: «Niewiasta zrodzona,"
        ru: "Дух начал говорить: «Рождена жена,"
      - pl: "\nKtórej lic jeszcze nie kryje zasłona,"
        ru: "чьё лицо ещё не покрывает покрывало,"
        note: "ещё не замужем"
      - pl: "\nPrzez nią podobasz mieszkać w moim mieście;"
        ru: "благодаря ей тебе понравится жить в моём городе;"
      - pl: "\nZ tą przepowiednią pójdziesz tam nareszcie."
        ru: "с этим предсказанием ты пойдёшь туда наконец."
    words: { "Duchu": duch, "rzekłem": rzec, "wyraźniej": wyraznie, "Niewiasta": niewiasta, "kryje": kryc, "zasłona": zaslona }
  - clean: "Jeśli co błędnie usta moje mruczą,\nPrzyszłe wypadki same cię pouczą.\nLecz mów, azali w tobie nie widzimy\nTego, co wydał na świat nowe rymy,\nGdzie na początku jest wiersz: »Piękne panie!\nCo pojmujecie tak żywo kochanie«?»"
    verse: true
    chunks:
      - pl: "Jeśli co błędnie usta moje mruczą,"
        ru: "Если мои уста что-нибудь бормочут ошибочно,"
        note: "mruczeć — бормотать"
      - pl: "\nPrzyszłe wypadki same cię pouczą."
        ru: "будущие события сами тебя научат."
      - pl: "\nLecz mów, azali w tobie nie widzimy"
        ru: "Но скажи: не видим ли мы в тебе"
      - pl: "\nTego, co wydał na świat nowe rymy,"
        ru: "того, кто выпустил в свет новые рифмы,"
      - pl: "\nGdzie na początku jest wiersz: »Piękne panie!"
        ru: "где в начале стих: „Прекрасные дамы,"
      - pl: "\nCo pojmujecie tak żywo kochanie«?»"
        ru: "что так живо постигаете любовь“?»"
        note: "канцона из «Новой жизни»"
    words: { "usta": usta, "Przyszłe": przyszly, "wypadki": wypadek, "wydał": wydac, "początku": poczatek, "wiersz": wiersz }
  - clean: "A ja: «Gdy miłość natchnie mego ducha,\nCo myśl z jej mowy wewnętrznej podsłucha,\nCo ona mówi, ja tylko to piszę».\n«O bracie!» rzekł on «z tego, co ja słyszę,\nPostrzegam węzeł, co poetów tylu\nZatrzymał z dala od twojego stylu,\nZwłaszcza Notera, mnie i Guitona."
    verse: true
    chunks:
      - pl: "A ja: «Gdy miłość natchnie mego ducha,"
        ru: "А я: «Когда любовь вдохновит мой дух,"
      - pl: "\nCo myśl z jej mowy wewnętrznej podsłucha,"
        ru: "что мысль подслушает из её внутренней речи,"
      - pl: "\nCo ona mówi, ja tylko to piszę»."
        ru: "что она говорит, только то я и пишу»."
      - pl: "\n«O bracie!» rzekł on «z tego, co ja słyszę,"
        ru: "«О брат! — сказал он, — из того, что я слышу,"
      - pl: "\nPostrzegam węzeł, co poetów tylu"
        ru: "я вижу узел, что столько поэтов"
      - pl: "\nZatrzymał z dala od twojego stylu,"
        ru: "удержал вдали от твоего стиля,"
      - pl: "\nZwłaszcza Notera, mnie i Guitona."
        ru: "особенно Нотаро, меня и Гвиттоне."
        note: "Якопо да Лентини, Гвиттоне д’Ареццо"
    words: { "mowy": mowa, "wewnętrznej": wewnetrzny, "piszę": pisac, "węzeł": wezel, "poetów": poeta, "stylu": styl }
  - clean: "Spod pióra twego tryska pieśń natchniona,\nKogo natchnienia lot wyżej porywa,\nDwóch stylów z sobą ten nie porównywa».\nRad w sobie, zamilkł: jak jeden za drugim\nPtak zimujący nad brzegami Nilu\nZrywa się, leci, ciągnie pasem długim,\nTak wszystkie duchy, wszystkie, co tam były,\nZwracając twarze swój pochód nagliły,\nLekkie zarazem chudością i wolą."
    verse: true
    chunks:
      - pl: "Spod pióra twego tryska pieśń natchniona,"
        ru: "Из-под твоего пера брызжет вдохновенная песнь,"
      - pl: "\nKogo natchnienia lot wyżej porywa,"
        ru: "кого полёт вдохновения уносит выше,"
      - pl: "\nDwóch stylów z sobą ten nie porównywa»."
        ru: "тот не сравнивает двух стилей друг с другом»."
      - pl: "\nRad w sobie, zamilkł: jak jeden za drugim"
        ru: "Довольный в себе, он умолк: как одна за другой"
      - pl: "\nPtak zimujący nad brzegami Nilu"
        ru: "птицы, зимующие на берегах Нила,"
      - pl: "\nZrywa się, leci, ciągnie pasem długim,"
        ru: "срываются, летят, тянутся длинной вереницей,"
      - pl: "\nTak wszystkie duchy, wszystkie, co tam były,"
        ru: "так все духи, все, что там были,"
      - pl: "\nZwracając twarze swój pochód nagliły,"
        ru: "отворачивая лица, ускорили своё шествие,"
      - pl: "\nLekkie zarazem chudością i wolą."
        ru: "лёгкие разом и худобой, и волей."
    words: { "pieśń": piesn, "brzegami": brzeg, "ciągnie": ciagnac, "pasem": pas, "Zwracając": zwracac, "Lekkie": lekki }
  - clean: "Jak biegącemu gdy nogi zabolą,\nZnużony swoich spółbiegaczów rzuca,\nZanim odetchną zmordowane płuca:\nTak i Foreze za trzodą szczęśliwą,\nZ tyłu, opodal szedł za mną leniwo,\nI mówił do mnie: «Kiedyż cię zobaczę?»"
    verse: true
    chunks:
      - pl: "Jak biegącemu gdy nogi zabolą,"
        ru: "Как у бегущего, когда заболят ноги,"
      - pl: "\nZnużony swoich spółbiegaczów rzuca,"
        ru: "усталый, он оставляет своих товарищей по бегу,"
        note: "spółbiegacz — товарищ по бегу"
      - pl: "\nZanim odetchną zmordowane płuca:"
        ru: "пока не переведут дух измученные лёгкие:"
      - pl: "\nTak i Foreze za trzodą szczęśliwą,"
        ru: "так и Форезе за счастливым стадом"
      - pl: "\nZ tyłu, opodal szedł za mną leniwo,"
        ru: "сзади, поодаль, медленно шёл за мной"
      - pl: "\nI mówił do mnie: «Kiedyż cię zobaczę?»"
        ru: "и говорил мне: «Когда же я увижу тебя?»"
    words: { "nogi": noga, "zabolą": zabolec, "rzuca": rzucac, "płuca": pluco, "trzodą": trzoda, "szczęśliwą": szczesliwy }
  - clean: "— «Nie wiem,» odrzekłem «jak żyć będę długo,\nLecz w chęci rad bym tu pielgrzymkę drugą\nOdbyć co prędzej: bo moja kraina,\nGdzie pędzą życie z dnia na dzień tułacze,\nSmutna jest, bliska grozi jej ruina».\n«Idź!» rzekł «już widzę zwierzę, jak Donata,\nOgonem wlecze w otchłań zatracenia,\nGdzie żadnym grzechom nie ma przebaczenia."
    verse: true
    chunks:
      - pl: "— «Nie wiem,» odrzekłem «jak żyć będę długo,"
        ru: "— «Не знаю, — ответил я, — как долго буду жить,"
      - pl: "\nLecz w chęci rad bym tu pielgrzymkę drugą"
        ru: "но желанием я охотно совершил бы здесь второе паломничество"
      - pl: "\nOdbyć co prędzej: bo moja kraina,"
        ru: "как можно скорее: ибо мой край,"
      - pl: "\nGdzie pędzą życie z dnia na dzień tułacze,"
        ru: "где скитальцы влачат жизнь изо дня в день,"
        note: "tułacz — скиталец"
      - pl: "\nSmutna jest, bliska grozi jej ruina»."
        ru: "печален, близкая гибель грозит ему»."
      - pl: "\n«Idź!» rzekł «już widzę zwierzę, jak Donata,"
        ru: "«Иди! — сказал он, — уже вижу, как зверь Донати"
        note: "Корсо Донати, брат Форезе"
      - pl: "\nOgonem wlecze w otchłań zatracenia,"
        ru: "хвостом тащит в бездну погибели,"
      - pl: "\nGdzie żadnym grzechom nie ma przebaczenia."
        ru: "где никаким грехам нет прощения."
    words: { "chęci": chec, "Odbyć": odbyc, "prędzej": predko, "kraina": kraina, "pędzą": pedzic, "Ogonem": ogon }
  - clean: "Koń jak wiatr pędzi, kurz trupem zamiata,\nWstrząsł się, trup wagą swojego ciężaru\nOkaleczały runął w przepaść jaru.\nTym sferom krążyć maluczko po niebie,\n(I spojrzał w niebo) aż sam ujrzysz z trwogą\nTo, co me słowa jaśniej rzec nie mogą."
    verse: true
    chunks:
      - pl: "Koń jak wiatr pędzi, kurz trupem zamiata,"
        ru: "Конь мчится, как ветер, трупом метёт пыль,"
      - pl: "\nWstrząsł się, trup wagą swojego ciężaru"
        ru: "встряхнулся — и труп тяжестью своего веса,"
      - pl: "\nOkaleczały runął w przepaść jaru."
        ru: "изувеченный, рухнул в пропасть оврага."
      - pl: "\nTym sferom krążyć maluczko po niebie,"
        ru: "Этим сферам недолго кружить по небу,"
        note: "maluczko — немного"
      - pl: "\n(I spojrzał w niebo) aż sam ujrzysz z trwogą"
        ru: "(и он посмотрел в небо) пока сам со страхом не увидишь"
      - pl: "\nTo, co me słowa jaśniej rzec nie mogą."
        ru: "того, чего мои слова не могут сказать яснее."
    words: { "kurz": kurz, "ciężaru": ciezar, "przepaść": przepasc, "jaru": jar, "krążyć": krazyc, "ujrzysz": ujrzec }
  - clean: "Czas w tym królestwie drogi, żegnam ciebie!\nIdąc tak we dwóch, choć się chętnie dzielę\nZ tobą mym czasem, tracę go za wiele».\nJak kiedy jazda na jazdę naciera,\nJeździec rycerskim uniesion zapałem,\nZ szeregu naprzód pomyka się cwałem,\nI cześć pierwszego natarcia odbiera;\nForeze od nas wielkim skoczył krokiem."
    verse: true
    chunks:
