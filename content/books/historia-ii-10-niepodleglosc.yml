        ru: "Многие жители Королевства помнили поражение Январского восстания и боялись, что новый порыв закончится так же."
      - pl: " Inni ufali raczej Dmowskiemu i uważali, że prawdziwym wrogiem Polski są Niemcy, a nie Rosja."
        ru: "Другие больше доверяли Дмовскому и считали, что настоящий враг Польши — Германия, а не Россия."
      - pl: " Marsz Kadrówki okazał się więc politycznym rozczarowaniem, ale stał się symbolem."
        ru: "Поход Кадровой роты оказался политическим разочарованием, но стал символом."
      - pl: " Po raz pierwszy od pół wieku polski oddział w polskich mundurach walczył pod własnymi rozkazami."
        ru: "Впервые за полвека польский отряд в польской форме сражался под собственным командованием."
      - pl: " Dzień 6 sierpnia obchodzono później w niepodległej Polsce jako święto żołnierzy Legionów, a co roku na trasie dawnego marszu odbywa się Marsz Szlakiem Kadrówki."
        ru: "День 6 августа позже отмечали в независимой Польше как праздник легионеров, а каждый год по маршруту того похода проходит «Марш по следам Кадровой роты»."
        note: "szlak — путь, маршрут"
