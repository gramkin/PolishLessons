        note: "ochotnik — доброволец"
      - pl: " Legiony podzielono na trzy brygady."
        ru: "Легионы разделили на три бригады."
      - pl: " Pierwszą dowodził Piłsudski, którego żołnierze nazywali po prostu Komendantem i otaczali niemal religijnym kultem."
