  - clean: "Rosja również próbowała pozyskać Polaków. W sierpniu 1914 roku wielki książę Mikołaj, naczelny wódz armii rosyjskiej, ogłosił odezwę do Polaków. Obiecywał w niej, że po wojnie wszystkie ziemie polskie zostaną zjednoczone pod berłem cara, z wolnością wiary, języka i samorządu. Odezwa brzmiała pięknie, ale nie mówiła nic o niepodległości, a w następnych miesiącach rząd w Petersburgu nie zrobił nic, żeby spełnić te obietnice."
    draft: true
    chunks:
      - pl: "Rosja również próbowała pozyskać Polaków."
        ru: "Россия тоже пыталась привлечь поляков на свою сторону."
