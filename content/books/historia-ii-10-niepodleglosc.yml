  - clean: "Legiony walczyły dzielnie w wielu bitwach. Pod Łowczówkiem w grudniu 1914 roku I Brygada przez kilka dni powstrzymywała natarcie Rosjan. II Brygada walczyła w Karpatach i z tego powodu nazywano ją Karpacką. Najkrwawszą bitwą była obrona pod Kostiuchnówką na Wołyniu w lipcu 1916 roku, gdzie legioniści przez trzy dni odpierali ataki znacznie silniejszych wojsk rosyjskich. Zginęło tam lub zostało rannych około dwóch tysięcy legionistów. Austriacy traktowali jednak Legiony jak zwykłe oddziały pomocnicze i nie chcieli słyszeć o niepodległej Polsce."
