  - clean: "Latem 1915 roku armie niemieckie i austriackie przełamały front i ruszyły na wschód. Rosjanie wycofywali się z całego Królestwa, a 5 sierpnia 1915 roku Niemcy weszli do Warszawy. Po ponad stu latach skończyło się rosyjskie panowanie nad polską stolicą. Cofająca się armia rosyjska wysadzała mosty i fabryki, wywoziła maszyny i dzwony kościelne, a często paliła także wsie i pola. Władze zmuszały ludność do ucieczki razem z wojskiem, a wielu ludzi uciekało samych, w strachu przed nadchodzącym frontem. Około miliona Polaków znalazło się wtedy w głębi Rosji, jako uchodźcy, nazywani bieżeńcami."
    draft: true
