      - pl: " Legioniści śpiewali piosenki, które do dziś zna każdy Polak, jak „My, Pierwsza Brygada” czy „Pierwsza Kadrowa”."
        ru: "Легионеры пели песни, которые до сих пор знает каждый поляк, такие как «Мы, Первая бригада» или «Первая кадровая»."
