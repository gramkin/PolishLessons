      - pl: " II Brygada walczyła w Karpatach i z tego powodu nazywano ją Karpacką."
        ru: "Вторая бригада воевала в Карпатах, и поэтому её называли Карпатской."
      - pl: " Najkrwawszą bitwą była obrona pod Kostiuchnówką na Wołyniu w lipcu 1916 roku, gdzie legioniści przez trzy dni odpierali ataki znacznie silniejszych wojsk rosyjskich."
        ru: "Самой кровавой битвой была оборона под Костюхновкой на Волыни в июле 1916 года, где легионеры три дня отбивали атаки значительно более сильных русских войск."
        note: "odpierać — отбивать"
      - pl: " Zginęło tam lub zostało rannych około dwóch tysięcy legionistów."
        ru: "Там погибли или были ранены около двух тысяч легионеров."
