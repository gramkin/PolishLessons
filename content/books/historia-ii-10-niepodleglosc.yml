  - clean: "Dmowski i jego zwolennicy stanęli mimo to po stronie Rosji. W listopadzie 1914 roku utworzyli w Warszawie Komitet Narodowy Polski, który miał reprezentować Polaków wobec Rosji i jej sojuszników. Przy armii rosyjskiej powstał też niewielki Legion Puławski, w którym polscy ochotnicy walczyli przeciwko Niemcom i Austriakom. Dmowski szybko zrozumiał jednak, że w Petersburgu niewiele osiągnie. Wyjechał na Zachód, do Londynu i Paryża, gdzie przekonywał polityków, że silna Polska będzie najlepszą zaporą przed Niemcami. Jego praca dyplomatyczna przyniosła owoce dopiero pod koniec wojny, ale okazała się bardzo ważna."
    draft: true
    chunks:
