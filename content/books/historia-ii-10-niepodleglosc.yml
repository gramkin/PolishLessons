  - clean: "W sierpniu 1914 roku w Krakowie powstał Naczelny Komitet Narodowy, w którym zasiedli politycy galicyjscy różnych partii. Za zgodą Austrii utworzył on Legiony Polskie, w których z czasem służyło kilkadziesiąt tysięcy ochotników. Legiony podzielono na trzy brygady. Pierwszą dowodził Piłsudski, którego żołnierze nazywali po prostu Komendantem i otaczali niemal religijnym kultem. Legioniści śpiewali piosenki, które do dziś zna każdy Polak, jak „My, Pierwsza Brygada” czy „Pierwsza Kadrowa”."
    draft: true
