  - clean: "Piłsudski był przygotowany na ten moment. Rankiem 6 sierpnia 1914 roku z krakowskich Oleandrów wymaszerowała Pierwsza Kompania Kadrowa, złożona ze stu kilkudziesięciu strzelców. Wkrótce przekroczyła granicę Królestwa w Michałowicach i zrywała po drodze rosyjskie słupy graniczne. Piłsudski liczył, że na widok polskich żołnierzy wybuchnie w Królestwie powstanie przeciwko Rosji. Tak się jednak nie stało. Kiedy strzelcy weszli do Kielc, mieszkańcy przyjęli ich chłodno, zamykali okna i nie wierzyli, że przychodzą jako wyzwoliciele."
    draft: true
    chunks:
      - pl: "Piłsudski był przygotowany na ten moment."
        ru: "Пилсудский был готов к этому моменту."
      - pl: " Rankiem 6 sierpnia 1914 roku z krakowskich Oleandrów wymaszerowała Pierwsza Kompania Kadrowa, złożona ze stu kilkudziesięciu strzelców."
        ru: "Утром 6 августа 1914 года из краковских Олеандров выступила Первая кадровая рота, состоявшая из полутора сотен стрельцов."
        note: "kadrowy — кадровый"
      - pl: " Wkrótce przekroczyła granicę Królestwa w Michałowicach i zrywała po drodze rosyjskie słupy graniczne."
        ru: "Вскоре она перешла границу Королевства у Михаловиц и по пути срывала русские пограничные столбы."
      - pl: " Piłsudski liczył, że na widok polskich żołnierzy wybuchnie w Królestwie powstanie przeciwko Rosji."
        ru: "Пилсудский рассчитывал, что при виде польских солдат в Королевстве вспыхнет восстание против России."
      - pl: " Tak się jednak nie stało."
        ru: "Однако этого не произошло."
      - pl: " Kiedy strzelcy weszli do Kielc, mieszkańcy przyjęli ich chłodno, zamykali okna i nie wierzyli, że przychodzą jako wyzwoliciele."
        ru: "Когда стрельцы вошли в Кельце, жители встретили их холодно, закрывали окна и не верили, что те приходят как освободители."
        note: "wyzwoliciel — освободитель"
    words: { "Rankiem": ranek, "sierpnia": sierpien, "strzelców": strzelec, "przekroczyła": przekroczyc, "rosyjskie": rosyjski, "słupy": slup, "polskich": polski, "strzelcy": strzelec, "mieszkańcy": mieszkaniec, "zamykali": zamykac }
  - clean: "Wielu mieszkańców Królestwa pamiętało klęskę powstania styczniowego i bało się, że nowy zryw skończy się tak samo. Inni ufali raczej Dmowskiemu i uważali, że prawdziwym wrogiem Polski są Niemcy, a nie Rosja. Marsz Kadrówki okazał się więc politycznym rozczarowaniem, ale stał się symbolem. Po raz pierwszy od pół wieku polski oddział w polskich mundurach walczył pod własnymi rozkazami. Dzień 6 sierpnia obchodzono później w niepodległej Polsce jako święto żołnierzy Legionów, a co roku na trasie dawnego marszu odbywa się Marsz Szlakiem Kadrówki."
    draft: true
    chunks:
