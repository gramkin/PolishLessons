paragraphs:
  - clean: "Latem 1914 roku wybuchła wojna, na którą Polacy czekali przez całe stulecie. Mickiewicz modlił się kiedyś „o wojnę powszechną za wolność ludów”, a teraz trzej zaborcy naprawdę stanęli przeciwko sobie. Niemcy i Austro-Węgry walczyły z Rosją, a po stronie Rosji stały Francja i Wielka Brytania. Dla Polaków była to jednak także wojna tragiczna. W armiach zaborców służyło, według różnych szacunków, około trzech milionów Polaków, a setki tysięcy z nich zginęły lub zostały rannych. Zdarzało się, że Polacy w mundurach rosyjskich strzelali do Polaków w mundurach austriackich lub niemieckich."
    draft: true
    chunks:
      - pl: "Latem 1914 roku wybuchła wojna, na którą Polacy czekali przez całe stulecie."
        ru: "Летом 1914 года разразилась война, которой поляки ждали целое столетие."
      - pl: " Mickiewicz modlił się kiedyś „o wojnę powszechną za wolność ludów”, a teraz trzej zaborcy naprawdę stanęli przeciwko sobie."
        ru: "Мицкевич когда-то молился «о всеобщей войне за свободу народов», и теперь три державы-участницы разделов действительно встали друг против друга."
      - pl: " Niemcy i Austro-Węgry walczyły z Rosją, a po stronie Rosji stały Francja i Wielka Brytania."
        ru: "Германия и Австро-Венгрия воевали с Россией, а на стороне России стояли Франция и Великобритания."
      - pl: " Dla Polaków była to jednak także wojna tragiczna."
        ru: "Однако для поляков это была и трагическая война."
      - pl: " W armiach zaborców służyło, według różnych szacunków, około trzech milionów Polaków, a setki tysięcy z nich zginęły lub zostały rannych."
        ru: "В армиях держав-участниц разделов служили, по разным оценкам, около трёх миллионов поляков, и сотни тысяч из них погибли или были ранены."
      - pl: " Zdarzało się, że Polacy w mundurach rosyjskich strzelali do Polaków w mundurach austriackich lub niemieckich."
        ru: "Случалось, что поляки в русских мундирах стреляли в поляков в австрийских или немецких мундирах."
    words: { "wybuchła": wybuchnac, "stulecie": stulecie, "powszechną": powszechny, "ludów": lud, "tragiczna": tragiczny, "mundurach": mundur, "rosyjskich": rosyjski, "niemieckich": niemiecki }
  - clean: "Ziemie polskie stały się jednym z głównych pól bitewnych wschodniego frontu. Przez Galicję i Królestwo kilka razy przetaczały się armie, które paliły wsie, niszczyły mosty i zabierały ludziom żywność i konie. Pod Krakowem, w Karpatach i nad Wisłą toczyły się wielkie bitwy, w których ginęły dziesiątki tysięcy żołnierzy. Twierdza Przemyśl przez kilka miesięcy broniła się przed oblężeniem rosyjskim i poddała się dopiero wiosną 1915 roku, gdy w mieście skończyła się żywność. Na cmentarzach wojennych w Galicji leżą obok siebie żołnierze wielu narodów, a ich groby do dziś przypominają o tej wojnie."
    draft: true
    chunks:
      - pl: "Ziemie polskie stały się jednym z głównych pól bitewnych wschodniego frontu."
        ru: "Польские земли стали одним из главных полей сражений Восточного фронта."
      - pl: " Przez Galicję i Królestwo kilka razy przetaczały się armie, które paliły wsie, niszczyły mosty i zabierały ludziom żywność i konie."
        ru: "Через Галицию и Королевство несколько раз прокатывались армии, которые жгли деревни, разрушали мосты и отбирали у людей продовольствие и лошадей."
        note: "przetaczać się — прокатываться"
      - pl: " Pod Krakowem, w Karpatach i nad Wisłą toczyły się wielkie bitwy, w których ginęły dziesiątki tysięcy żołnierzy."
        ru: "Под Краковом, в Карпатах и на Висле шли большие сражения, в которых гибли десятки тысяч солдат."
      - pl: " Twierdza Przemyśl przez kilka miesięcy broniła się przed oblężeniem rosyjskim i poddała się dopiero wiosną 1915 roku, gdy w mieście skończyła się żywność."
        ru: "Крепость Перемышль несколько месяцев выдерживала русскую осаду и сдалась только весной 1915 года, когда в городе кончилось продовольствие."
        note: "twierdza — крепость"
      - pl: " Na cmentarzach wojennych w Galicji leżą obok siebie żołnierze wielu narodów, a ich groby do dziś przypominają o tej wojnie."
        ru: "На военных кладбищах Галиции рядом лежат солдаты многих народов, и их могилы до сих пор напоминают об этой войне."
