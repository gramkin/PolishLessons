        ru: "В августе 1914 года великий князь Николай Николаевич, верховный главнокомандующий русской армией, обнародовал воззвание к полякам."
        note: "odezwa — воззвание"
      - pl: " Obiecywał w niej, że po wojnie wszystkie ziemie polskie zostaną zjednoczone pod berłem cara, z wolnością wiary, języka i samorządu."
        ru: "В нём он обещал, что после войны все польские земли будут объединены под скипетром царя, со свободой веры, языка и самоуправления."
        note: "berło — скипетр"
      - pl: " Odezwa brzmiała pięknie, ale nie mówiła nic o niepodległości, a w następnych miesiącach rząd w Petersburgu nie zrobił nic, żeby spełnić te obietnice."
        ru: "Воззвание звучало красиво, но ничего не говорило о независимости, а в следующие месяцы правительство в Петербурге ничего не сделало, чтобы выполнить эти обещания."
