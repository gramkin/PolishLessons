        ru: "Дмовский и его сторонники тем не менее встали на сторону России."
      - pl: " W listopadzie 1914 roku utworzyli w Warszawie Komitet Narodowy Polski, który miał reprezentować Polaków wobec Rosji i jej sojuszników."
        ru: "В ноябре 1914 года они создали в Варшаве Польский национальный комитет, который должен был представлять поляков перед Россией и её союзниками."
      - pl: " Przy armii rosyjskiej powstał też niewielki Legion Puławski, w którym polscy ochotnicy walczyli przeciwko Niemcom i Austriakom."
        ru: "При русской армии возник и небольшой Пулавский легион, в котором польские добровольцы воевали против немцев и австрийцев."
      - pl: " Dmowski szybko zrozumiał jednak, że w Petersburgu niewiele osiągnie."
        ru: "Однако Дмовский быстро понял, что в Петербурге многого не добьётся."
      - pl: " Wyjechał na Zachód, do Londynu i Paryża, gdzie przekonywał polityków, że silna Polska będzie najlepszą zaporą przed Niemcami."
        ru: "Он уехал на Запад, в Лондон и Париж, где убеждал политиков, что сильная Польша будет лучшим заслоном против Германии."
