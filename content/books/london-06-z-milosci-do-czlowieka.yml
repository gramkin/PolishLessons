    words: { "słonecznej": sloneczny, "dolinie": dolina, "wędrówkach": wedrowka, "wnukami": wnuk, "godności": godnosc, "gorączkową": goraczkowy }
  - clean: "Ten człowiek uratował mu życie, a to już coś znaczyło; ale co więcej, był idealnym panem. Inni ludzie dbali o dobro swoich psów z poczucia obowiązku i z wyrachowania; on dbał o dobro swoich, jakby były jego własnymi dziećmi, bo nie umiał inaczej. I widział więcej. Nigdy nie zapominał o życzliwym powitaniu czy słowie otuchy, a usiąść z nimi na długą pogawędkę („gadanie”, jak to nazywał) sprawiało mu tyle samo radości co im. Miał zwyczaj brać szorstko łeb Bucka w dłonie, opierać na nim własną głowę i potrząsać nim w przód i w tył, wyzywając go przy tym od najgorszych, co dla Bucka było słowami miłości."
    en: "This man had saved his life, which was something; but, further, he was the ideal master. Other men saw to the welfare of their dogs from a sense of duty and business expediency; he saw to the welfare of his as if they were his own children, because he could not help it. And he saw further. He never forgot a kindly greeting or a cheering word, and to sit down for a long talk with them (“gas” he called it) was as much his delight as theirs. He had a way of taking Buck’s head roughly between his hands, and resting his own head upon Buck’s, of shaking him back and forth, the while calling him ill names that to Buck were love names."
    draft: true
    chunks:
      - pl: "Ten człowiek uratował mu życie, a to już coś znaczyło; ale co więcej, był idealnym panem."
        ru: "Этот человек спас ему жизнь, а это уже кое-что значило; но более того, он был идеальным хозяином."
      - pl: " Inni ludzie dbali o dobro swoich psów z poczucia obowiązku i z wyrachowania;"
