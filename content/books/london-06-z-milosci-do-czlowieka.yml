  - clean: "Był starszy niż dni, które widział, i oddechy, które zaczerpnął. Łączył przeszłość z teraźniejszością, a wieczność za nim pulsowała w nim potężnym rytmem, w którym się kołysał, jak kołyszą się przypływy i pory roku. Siedział przy ogniu Johna Thorntona, pies o szerokiej piersi, białych kłach i długiej sierści; ale za nim były cienie wszelkiego rodzaju psów, półwilków i dzikich wilków, ponaglających i podszeptujących, które smakowały mięso, jakie jadł, pragnęły wody, jaką pił, węszyły z nim wiatr, nasłuchiwały z nim i mówiły mu, jakie dźwięki wydaje dzikie życie w lesie, które dyktowały mu nastroje, kierowały jego czynami, kładły się z nim do snu, kiedy się kładł, i śniły razem z nim i poza nim, same stając się materią jego snów."
