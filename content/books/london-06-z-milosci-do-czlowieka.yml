paragraphs:
  - clean: "Kiedy poprzedniego grudnia John Thornton odmroził sobie stopy, jego wspólnicy urządzili go wygodnie i zostawili, żeby wyzdrowiał, a sami popłynęli w górę rzeki po tratwę z kłód do tartaku w Dawson. Kiedy ratował Bucka, wciąż jeszcze lekko kulał, ale przy utrzymującej się ciepłej pogodzie znikło nawet to lekkie kulenie. A tutaj, leżąc nad brzegiem rzeki przez długie wiosenne dni, patrząc na płynącą wodę i leniwie wsłuchując się w śpiew ptaków i szum przyrody, Buck powoli odzyskiwał siły."
    en: "When John Thornton froze his feet in the previous December his partners had made him comfortable and left him to get well, going on themselves up the river to get out a raft of saw-logs for Dawson. He was still limping slightly at the time he rescued Buck, but with the continued warm weather even the slight limp left him. And here, lying by the river bank through the long spring days, watching the running water, listening lazily to the songs of birds and the hum of nature, Buck slowly won back his strength."
    draft: true
    chunks:
      - pl: "Kiedy poprzedniego grudnia John Thornton odmroził sobie stopy, jego wspólnicy urządzili go wygodnie i zostawili, żeby wyzdrowiał,"
        ru: "Когда в декабре Джон Торнтон отморозил ноги, его компаньоны удобно устроили его и оставили выздоравливать,"
        note: "odmrozić — отморозить; wspólnik — компаньон"
      - pl: " a sami popłynęli w górę rzeki po tratwę z kłód do tartaku w Dawson."
        ru: "а сами отправились вверх по реке за плотом брёвен для лесопилки в Доусоне."
        note: "tratwa — плот; kłoda — бревно; tartak — лесопилка"
      - pl: " Kiedy ratował Bucka, wciąż jeszcze lekko kulał, ale przy utrzymującej się ciepłej pogodzie znikło nawet to lekkie kulenie."
        ru: "Когда он спас Бэка, он ещё слегка хромал, но при стоявшей тёплой погоде прошла даже лёгкая хромота."
      - pl: " A tutaj, leżąc nad brzegiem rzeki przez długie wiosenne dni, patrząc na płynącą wodę i leniwie wsłuchując się w śpiew ptaków i szum przyrody, Buck powoli odzyskiwał siły."
        ru: "А здесь, лёжа на берегу реки долгими весенними днями, глядя на бегущую воду и лениво прислушиваясь к пению птиц и гулу природы, Бэк понемногу набирался сил."
    words: { "grudnia": grudzien, "wygodnie": wygodnie, "wyzdrowiał": wyzdrowiec, "popłynęli": poplynac, "brzegiem": brzeg, "szum": szum }
  - clean: "Odpoczynek bardzo dobrze robi po przebyciu pięciu tysięcy kilometrów i trzeba przyznać, że Buck rozleniwił się, gdy goiły mu się rany, nabrzmiewały mięśnie, a ciało znów okrywało kości. Zresztą wszyscy próżnowali — Buck, John Thornton oraz Skeet i Nig — czekając na tratwę, która miała ich zawieźć w dół rzeki do Dawson. Skeet była małą seterką irlandzką, która wcześnie zaprzyjaźniła się z Buckiem, bo konający nie był w stanie odtrącić jej pierwszych zalotów."
    en: "A rest comes very good after one has travelled three thousand miles, and it must be confessed that Buck waxed lazy as his wounds healed, his muscles swelled out, and the flesh came back to cover his bones. For that matter, they were all loafing,—Buck, John Thornton, and Skeet and Nig,—waiting for the raft to come that was to carry them down to Dawson. Skeet was a little Irish setter who early made friends with Buck, who, in a dying condition, was unable to resent her first advances."
    draft: true
    chunks:
      - pl: "Odpoczynek bardzo dobrze robi po przebyciu pięciu tysięcy kilometrów i trzeba przyznać, że Buck rozleniwił się, gdy goiły mu się rany,"
        ru: "Отдых очень хорош после пяти тысяч километров пути, и надо признать, что Бэк обленился, пока заживали его раны,"
        note: "rozleniwić się — разлениться; goić się — заживать; у Лондона 3000 миль"
      - pl: " nabrzmiewały mięśnie, a ciało znów okrywało kości."
        ru: "наливались мышцы, а мясо снова покрывало кости."
      - pl: " Zresztą wszyscy próżnowali — Buck, John Thornton oraz Skeet i Nig — czekając na tratwę, która miała ich zawieźć w dół rzeki do Dawson."
        ru: "Впрочем, все бездельничали — Бэк, Джон Торнтон, Скит и Ниг, — ожидая плота, который должен был отвезти их вниз по реке в Доусон."
      - pl: " Skeet była małą seterką irlandzką, która wcześnie zaprzyjaźniła się z Buckiem, bo konający nie był w stanie odtrącić jej pierwszych zalotów."
        ru: "Скит была маленькой ирландской сеттершей, которая рано подружилась с Бэком, потому что он, умирающий, не в силах был отвергнуть её первые заигрывания."
        note: "konający — умирающий; odtrącić — оттолкнуть"
    words: { "Odpoczynek": odpoczynek, "przebyciu": przebyc, "kilometrów": kilometr, "mięśnie": miesien, "zawieźć": zawiezc, "rzeki": rzeka }
  - clean: "Miała w sobie żyłkę lekarza, którą mają niektóre psy; i tak jak kotka myje swoje kocięta, tak ona myła i oczyszczała rany Bucka. Regularnie, każdego ranka, gdy skończył śniadanie, wykonywała zadanie, które sama sobie wyznaczyła, aż zaczął wyglądać jej opieki tak samo jak opieki Thorntona. Nig, równie przyjazny, choć mniej wylewny, był ogromnym czarnym psem, w połowie posokowcem, a w połowie chartem szkockim, z roześmianymi oczami i bezgraniczną dobrodusznością."
    en: "She had the doctor trait which some dogs possess; and as a mother cat washes her kittens, so she washed and cleansed Buck’s wounds. Regularly, each morning after he had finished his breakfast, she performed her self-appointed task, till he came to look for her ministrations as much as he did for Thornton’s. Nig, equally friendly, though less demonstrative, was a huge black dog, half bloodhound and half deerhound, with eyes that laughed and a boundless good nature."
    draft: true
    chunks:
      - pl: "Miała w sobie żyłkę lekarza, którą mają niektóre psy; i tak jak kotka myje swoje kocięta, tak ona myła i oczyszczała rany Bucka."
        ru: "В ней была докторская жилка, какая бывает у некоторых собак; и как кошка-мать моет своих котят, так она мыла и очищала раны Бэка."
        note: "żyłka — жилка, склонность; kocię — котёнок"
      - pl: " Regularnie, każdego ranka, gdy skończył śniadanie, wykonywała zadanie, które sama sobie wyznaczyła,"
        ru: "Регулярно, каждое утро, когда он кончал завтракать, она исполняла возложенную на себя обязанность,"
      - pl: " aż zaczął wyglądać jej opieki tak samo jak opieki Thorntona."
        ru: "пока он не стал ждать её забот так же, как забот Торнтона."
        note: "wyglądać czegoś — ждать, высматривать"
      - pl: " Nig, równie przyjazny, choć mniej wylewny, był ogromnym czarnym psem, w połowie posokowcem, a w połowie chartem szkockim, z roześmianymi oczami i bezgraniczną dobrodusznością."
        ru: "Ниг, такой же дружелюбный, хоть и менее экспансивный, был огромным чёрным псом, наполовину бладхаундом, наполовину дирхаундом, со смеющимися глазами и безграничным добродушием."
        note: "wylewny — экспансивный; posokowiec — гончая-ищейка; chart — борзая"
    words: { "myje": myc, "Regularnie": regularnie, "wyznaczyła": wyznaczyc, "równie": rownie, "przyjazny": przyjazny, "roześmianymi": rozesmiac }
  - clean: "Ku zdziwieniu Bucka te psy nie okazywały mu żadnej zazdrości. Zdawały się podzielać życzliwość i wielkoduszność Johna Thorntona. Gdy Buck nabierał sił, wciągały go we wszelkie niedorzeczne zabawy, do których nawet Thornton nie mógł się powstrzymać, żeby nie dołączyć; i w ten sposób Buck przebrykał swoją rekonwalescencję i wszedł w nowe istnienie. Miłość, prawdziwa, namiętna miłość, po raz pierwszy stała się jego udziałem."
    en: "To Buck’s surprise these dogs manifested no jealousy toward him. They seemed to share the kindliness and largeness of John Thornton. As Buck grew stronger they enticed him into all sorts of ridiculous games, in which Thornton himself could not forbear to join; and in this fashion Buck romped through his convalescence and into a new existence. Love, genuine passionate love, was his for the first time."
    draft: true
    chunks:
      - pl: "Ku zdziwieniu Bucka te psy nie okazywały mu żadnej zazdrości."
        ru: "К удивлению Бэка, эти собаки не выказывали к нему никакой ревности."
        note: "zazdrość — зависть, ревность"
      - pl: " Zdawały się podzielać życzliwość i wielkoduszność Johna Thorntona."
        ru: "Казалось, они разделяли доброту и великодушие Джона Торнтона."
        note: "wielkoduszność — великодушие"
      - pl: " Gdy Buck nabierał sił, wciągały go we wszelkie niedorzeczne zabawy, do których nawet Thornton nie mógł się powstrzymać, żeby nie dołączyć;"
        ru: "Когда Бэк окреп, они вовлекали его во всякие нелепые игры, к которым и сам Торнтон не мог удержаться не присоединиться;"
        note: "niedorzeczny — нелепый"
      - pl: " i w ten sposób Buck przebrykał swoją rekonwalescencję i wszedł w nowe istnienie."
        ru: "и так Бэк пропрыгал свою поправку и вошёл в новое бытие."
        note: "brykać — резвиться; rekonwalescencja — выздоровление"
      - pl: " Miłość, prawdziwa, namiętna miłość, po raz pierwszy stała się jego udziałem."
        ru: "Любовь, настоящая страстная любовь, впервые выпала ему на долю."
        note: "udział — доля"
    words: { "okazywały": okazywac, "nabierał": nabierac, "wszelkie": wszelki, "niedorzeczne": niedorzeczny, "dołączyć": dolaczyc, "udziałem": udzial }
  - clean: "Nigdy jej nie zaznał u sędziego Millera w słonecznej dolinie Santa Clara. Z synami sędziego, na polowaniach i wędrówkach, łączyło go koleżeństwo w pracy; z wnukami sędziego — coś w rodzaju napuszonej opieki; a z samym sędzią — dostojna i pełna godności przyjaźń. Ale miłość gorączkową i palącą, która była uwielbieniem, która była szaleństwem, obudził dopiero John Thornton."
    en: "This he had never experienced at Judge Miller’s down in the sun-kissed Santa Clara Valley. With the Judge’s sons, hunting and tramping, it had been a working partnership; with the Judge’s grandsons, a sort of pompous guardianship; and with the Judge himself, a stately and dignified friendship. But love that was feverish and burning, that was adoration, that was madness, it had taken John Thornton to arouse."
    draft: true
    chunks:
      - pl: "Nigdy jej nie zaznał u sędziego Millera w słonecznej dolinie Santa Clara."
        ru: "Он никогда не знал её у судьи Миллера в солнечной долине Санта-Клара."
        note: "zaznać — испытать"
      - pl: " Z synami sędziego, na polowaniach i wędrówkach, łączyło go koleżeństwo w pracy;"
        ru: "С сыновьями судьи, на охоте и в походах, его связывало рабочее товарищество;"
