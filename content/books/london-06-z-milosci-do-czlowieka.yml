        ru: "а с самим судьёй — величавая, исполненная достоинства дружба."
        note: "dostojny — величавый"
      - pl: " Ale miłość gorączkową i palącą, która była uwielbieniem, która była szaleństwem, obudził dopiero John Thornton."
        ru: "Но любовь лихорадочную и жгучую, которая была обожанием, которая была безумием, пробудил только Джон Торнтон."
