        ru: "Он никогда не забывал ласкового приветствия или ободряющего слова, а посидеть с ними за долгой беседой («болтовнёй», как он это называл) доставляло ему столько же радости, сколько им."
        note: "pogawędka — болтовня, беседа"
      - pl: " Miał zwyczaj brać szorstko łeb Bucka w dłonie, opierać na nim własną głowę i potrząsać nim w przód i w tył,"
        ru: "У него была привычка грубовато брать голову Бэка в ладони, класть на неё свою голову и трясти его взад и вперёд,"
      - pl: " wyzywając go przy tym od najgorszych, co dla Bucka było słowami miłości."
        ru: "обзывая его при этом последними словами, которые для Бэка были словами любви."
        note: "wyzywać od najgorszych — обзывать последними словами"
    words: { "otuchy": otucha, "pogawędkę": pogawedka, "radości": radosc, "zwyczaj": zwyczaj, "opierać": opierac }
  - clean: "Buck nie znał większej radości niż ten szorstki uścisk i dźwięk mruczanych przekleństw, a przy każdym szarpnięciu w przód i w tył zdawało się, że serce wyskoczy mu z piersi, tak wielki był jego zachwyt. A kiedy, wypuszczony, zrywał się na nogi, z roześmianym pyskiem, wymownymi oczami i gardłem drżącym od niewypowiedzianego dźwięku, i tak trwał bez ruchu, John Thornton wołał z czcią: „Boże! Ty prawie mówisz!”"
    en: "Buck knew no greater joy than that rough embrace and the sound of murmured oaths, and at each jerk back and forth it seemed that his heart would be shaken out of his body so great was its ecstasy. And when, released, he sprang to his feet, his mouth laughing, his eyes eloquent, his throat vibrant with unuttered sound, and in that fashion remained without movement, John Thornton would reverently exclaim, “God! you can all but speak!”"
    draft: true
    chunks:
      - pl: "Buck nie znał większej radości niż ten szorstki uścisk i dźwięk mruczanych przekleństw,"
        ru: "Бэк не знал большей радости, чем это грубое объятие и звук бормочемых ругательств,"
        note: "mruczeć — бормотать, урчать"
      - pl: " a przy każdym szarpnięciu w przód i w tył zdawało się, że serce wyskoczy mu z piersi, tak wielki był jego zachwyt."
        ru: "и при каждом рывке взад и вперёд казалось, что сердце вот-вот выскочит у него из груди, так велик был его восторг."
      - pl: " A kiedy, wypuszczony, zrywał się na nogi, z roześmianym pyskiem, wymownymi oczami i gardłem drżącym od niewypowiedzianego dźwięku, i tak trwał bez ruchu,"
        ru: "А когда, отпущенный, он вскакивал на ноги, со смеющейся пастью, красноречивыми глазами и горлом, дрожащим от невысказанного звука, и так замирал без движения,"
      - pl: " John Thornton wołał z czcią: „Boże! Ty prawie mówisz!”"
        ru: "Джон Торнтон благоговейно восклицал: «Боже! Да ты почти говоришь!»"
        note: "cześć — благоговение, почтение"
    words: { "uścisk": uscisk, "przekleństw": przeklenstwo, "zachwyt": zachwyt, "roześmianym": rozesmiac, "pyskiem": pysk }
  - clean: "Buck miał sposób okazywania miłości, który był pokrewny zadawaniu bólu. Często chwytał rękę Thorntona w pysk i zaciskał zęby tak mocno, że na skórze jeszcze długo potem widać było ślady jego zębów. I tak jak Buck rozumiał przekleństwa jako słowa miłości, tak człowiek rozumiał to udawane ugryzienie jako pieszczotę."
    en: "Buck had a trick of love expression that was akin to hurt. He would often seize Thornton’s hand in his mouth and close so fiercely that the flesh bore the impress of his teeth for some time afterward. And as Buck understood the oaths to be love words, so the man understood this feigned bite for a caress."
    draft: true
    chunks:
      - pl: "Buck miał sposób okazywania miłości, który był pokrewny zadawaniu bólu."
        ru: "У Бэка был способ выражать любовь, сродни причинению боли."
        note: "pokrewny — родственный, сродни"
      - pl: " Często chwytał rękę Thorntona w pysk i zaciskał zęby tak mocno, że na skórze jeszcze długo potem widać było ślady jego zębów."
        ru: "Он часто хватал руку Торнтона пастью и сжимал так крепко, что на коже ещё долго оставались отпечатки его зубов."
      - pl: " I tak jak Buck rozumiał przekleństwa jako słowa miłości, tak człowiek rozumiał to udawane ugryzienie jako pieszczotę."
        ru: "И как Бэк понимал ругательства как слова любви, так человек понимал этот притворный укус как ласку."
        note: "pieszczota — ласка"
