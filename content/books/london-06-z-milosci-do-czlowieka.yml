  - clean: "Przeważnie jednak miłość Bucka wyrażała się w uwielbieniu. Choć szalał ze szczęścia, kiedy Thornton go dotykał albo do niego mówił, nie zabiegał o te oznaki. Inaczej niż Skeet, która miała zwyczaj wsuwać nos pod rękę Thorntona i trącać, i trącać, aż ją pogłaskał, albo Nig, który podchodził dostojnie i kładł wielki łeb na kolanie Thorntona, Buck zadowalał się uwielbieniem z daleka. Leżał godzinami, gorliwy i czujny, u stóp Thorntona, patrząc mu w twarz, zatrzymując na niej wzrok, studiując ją, śledząc z najżywszym zainteresowaniem każdy przelotny wyraz, każdy ruch czy zmianę rysów."
