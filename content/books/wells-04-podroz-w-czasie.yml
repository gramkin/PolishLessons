  - clean: "Szczególne ryzyko tkwiło w możliwości, że w przestrzeni, którą zajmowałem ja lub maszyna, znajdę jakąś substancję. Dopóki pędziłem przez czas z dużą prędkością, nie miało to prawie znaczenia: byłem, że tak powiem, rozrzedzony — przenikałem jak para przez szczeliny napotykanych substancji! Ale zatrzymanie się oznaczało wciśnięcie samego siebie, cząsteczka po cząsteczce, w to, co leżało mi na drodze; oznaczało doprowadzenie moich atomów do tak bliskiego zetknięcia z atomami przeszkody, że wynikłaby z tego głęboka reakcja chemiczna — może potężny wybuch — który wyrzuciłby mnie i mój aparat poza wszelkie możliwe wymiary — w Nieznane."
