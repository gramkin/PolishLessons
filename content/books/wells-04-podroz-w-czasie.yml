paragraphs:
  - clean: "Niektórym z was opowiadałem w zeszły czwartek o zasadach działania Wehikułu Czasu i pokazałem wam samą maszynę, niedokończoną, w warsztacie. Oto i ona, co prawda trochę sfatygowana podróżą; jeden z prętów z kości słoniowej jest pęknięty, a mosiężna poręcz wygięta, ale reszta jest w dość dobrym stanie. Spodziewałem się skończyć ją w piątek; ale w piątek, gdy montaż był prawie gotowy, odkryłem, że jeden z niklowych prętów jest dokładnie o cal za krótki, i musiałem go dać do przerobienia; tak że maszyna była gotowa dopiero dziś rano."
    en: "“I told some of you last Thursday of the principles of the Time Machine, and showed you the actual thing itself, incomplete in the workshop. There it is now, a little travel-worn, truly; and one of the ivory bars is cracked, and a brass rail bent; but the rest of it’s sound enough. I expected to finish it on Friday; but on Friday, when the putting together was nearly done, I found that one of the nickel bars was exactly one inch too short, and this I had to get remade; so that the thing was not complete until this morning."
    draft: true
    chunks:
      - pl: "Niektórym z was opowiadałem w zeszły czwartek o zasadach działania Wehikułu Czasu i pokazałem wam samą maszynę, niedokończoną, w warsztacie."
        ru: "Некоторым из вас я в прошлый четверг рассказывал о принципах Машины Времени и показал саму вещь, недоделанную, в мастерской."
      - pl: " Oto i ona, co prawda trochę sfatygowana podróżą;"
        ru: "Вот она — правда, немного потрёпанная в дороге;"
        note: "sfatygowany — потрёпанный"
      - pl: " jeden z prętów z kości słoniowej jest pęknięty, a mosiężna poręcz wygięta, ale reszta jest w dość dobrym stanie."
        ru: "один из стержней слоновой кости треснул, а латунный поручень погнут, но остальное вполне цело."
        note: "poręcz — поручень, перила"
      - pl: " Spodziewałem się skończyć ją w piątek;"
        ru: "Я рассчитывал закончить её в пятницу;"
      - pl: " ale w piątek, gdy montaż był prawie gotowy, odkryłem, że jeden z niklowych prętów jest dokładnie o cal za krótki, i musiałem go dać do przerobienia;"
        ru: "но в пятницу, когда сборка была почти завершена, я обнаружил, что один из никелевых стержней ровно на дюйм короче, чем нужно, и его пришлось переделать;"
        note: "cal — дюйм"
      - pl: " tak że maszyna była gotowa dopiero dziś rano."
        ru: "так что машина была готова только сегодня утром."
    words: { "czwartek": czwartek, "maszynę": maszyna, "warsztacie": warsztat, "kości": kosc, "pęknięty": peknac }
  - clean: "Dziś o dziesiątej pierwszy ze wszystkich Wehikułów Czasu rozpoczął swoją karierę. Stuknąłem w niego ostatni raz, jeszcze raz sprawdziłem wszystkie śruby, dałem jeszcze kroplę oleju na kwarcowy pręt i usiadłem na siodełku. Przypuszczam, że samobójca, przykładający pistolet do skroni, czuje mniej więcej to samo zdumienie wobec tego, co nastąpi, co ja wtedy. Ująłem dźwignię startową w jedną rękę, a hamującą w drugą, nacisnąłem pierwszą i niemal natychmiast drugą."
    en: "It was at ten o’clock today that the first of all Time Machines began its career. I gave it a last tap, tried all the screws again, put one more drop of oil on the quartz rod, and sat myself in the saddle. I suppose a suicide who holds a pistol to his skull feels much the same wonder at what will come next as I felt then. I took the starting lever in one hand and the stopping one in the other, pressed the first, and almost immediately the second."
    draft: true
    chunks:
      - pl: "Dziś o dziesiątej pierwszy ze wszystkich Wehikułów Czasu rozpoczął swoją karierę."
        ru: "Сегодня в десять часов первая из всех Машин Времени начала свой путь."
      - pl: " Stuknąłem w niego ostatni raz, jeszcze raz sprawdziłem wszystkie śruby, dałem jeszcze kroplę oleju na kwarcowy pręt i usiadłem na siodełku."
        ru: "Я в последний раз постучал по ней, ещё раз проверил все винты, капнул ещё каплю масла на кварцевый стержень и сел в седло."
        note: "śruba — винт"
      - pl: " Przypuszczam, że samobójca, przykładający pistolet do skroni, czuje mniej więcej to samo zdumienie wobec tego, co nastąpi, co ja wtedy."
        ru: "Полагаю, самоубийца, приставивший пистолет к виску, испытывает примерно то же изумление перед тем, что будет дальше, что и я тогда."
        note: "samobójca — самоубийца; skroń — висок"
      - pl: " Ująłem dźwignię startową w jedną rękę, a hamującą w drugą, nacisnąłem pierwszą i niemal natychmiast drugą."
        ru: "Я взял пусковой рычаг в одну руку, а тормозной в другую, нажал первый и почти сразу же второй."
    words: { "kroplę": kropla, "oleju": olej, "nastąpi": nastapic, "Ująłem": ujac, "nacisnąłem": nacisnac }
  - clean: "Zdawało mi się, że się zachwiałem; poczułem koszmarne uczucie spadania; a rozejrzawszy się, zobaczyłem laboratorium dokładnie takie jak przedtem. Czy coś się stało? Przez chwilę podejrzewałem, że rozum spłatał mi figla. Wtedy spojrzałem na zegar. Chwilę wcześniej, jak mi się zdawało, wskazywał minutę czy dwie po dziesiątej; teraz było prawie wpół do czwartej!"
    en: "I seemed to reel; I felt a nightmare sensation of falling; and, looking round, I saw the laboratory exactly as before. Had anything happened? For a moment I suspected that my intellect had tricked me. Then I noted the clock. A moment before, as it seemed, it had stood at a minute or so past ten; now it was nearly half-past three!"
    draft: true
    chunks:
      - pl: "Zdawało mi się, że się zachwiałem;"
        ru: "Мне показалось, что я пошатнулся;"
        note: "zachwiać się — пошатнуться"
      - pl: " poczułem koszmarne uczucie spadania;"
        ru: "я ощутил кошмарное чувство падения;"
        note: "koszmarny — кошмарный"
      - pl: " a rozejrzawszy się, zobaczyłem laboratorium dokładnie takie jak przedtem."
        ru: "а оглядевшись, увидел лабораторию в точности такой, как прежде."
      - pl: " Czy coś się stało?"
        ru: "Произошло ли что-нибудь?"
      - pl: " Przez chwilę podejrzewałem, że rozum spłatał mi figla."
        ru: "На миг я заподозрил, что разум сыграл со мной шутку."
      - pl: " Wtedy spojrzałem na zegar."
        ru: "Тогда я взглянул на часы."
      - pl: " Chwilę wcześniej, jak mi się zdawało, wskazywał minutę czy dwie po dziesiątej; teraz było prawie wpół do czwartej!"
        ru: "Мгновение назад, как мне казалось, они показывали минуту-другую одиннадцатого; теперь было почти половина четвёртого!"
    words: { "rozejrzawszy": rozejrzec, "przedtem": przedtem, "podejrzewałem": podejrzewac, "rozum": rozum, "zegar": zegar, "wskazywał": wskazywac }
  - clean: "Wziąłem oddech, zacisnąłem zęby, chwyciłem dźwignię startową obiema rękami i ruszyłem z łoskotem. Laboratorium zamgliło się i pociemniało. Weszła pani Watchett i, najwyraźniej mnie nie widząc, poszła w stronę drzwi do ogrodu. Przypuszczam, że przejście przez pokój zajęło jej z minutę, ale mnie wydawało się, że przemknęła przez niego jak rakieta."
    en: "“I drew a breath, set my teeth, gripped the starting lever with both hands, and went off with a thud. The laboratory got hazy and went dark. Mrs. Watchett came in and walked, apparently without seeing me, towards the garden door. I suppose it took her a minute or so to traverse the place, but to me she seemed to shoot across the room like a rocket."
    draft: true
    chunks:
      - pl: "Wziąłem oddech, zacisnąłem zęby, chwyciłem dźwignię startową obiema rękami i ruszyłem z łoskotem."
        ru: "Я перевёл дух, стиснул зубы, схватил пусковой рычаг обеими руками и тронулся с глухим стуком."
        note: "łoskot — грохот, стук"
      - pl: " Laboratorium zamgliło się i pociemniało."
        ru: "Лаборатория затуманилась и потемнела."
      - pl: " Weszła pani Watchett i, najwyraźniej mnie nie widząc, poszła w stronę drzwi do ogrodu."
        ru: "Вошла миссис Уотчет и, очевидно не видя меня, пошла к двери в сад."
      - pl: " Przypuszczam, że przejście przez pokój zajęło jej z minutę, ale mnie wydawało się, że przemknęła przez niego jak rakieta."
        ru: "Полагаю, чтобы пересечь комнату, ей понадобилась минута или около того, но мне показалось, что она пронеслась через неё, как ракета."
    words: { "oddech": oddech, "chwyciłem": chwycic, "Laboratorium": laboratorium, "ogrodu": ogrod, "Przypuszczam": przypuszczac, "rakieta": rakieta }
  - clean: "Przesunąłem dźwignię do skrajnego położenia. Noc nadeszła, jakby ktoś zgasił lampę, a w następnej chwili nadeszło jutro. Laboratorium stawało się blade i mgliste, potem coraz bledsze i bledsze. Nadeszła czarna noc następnego dnia, potem znów dzień, znów noc, znów dzień, coraz szybciej i szybciej. Uszy wypełnił mi wirujący szum, a na umysł spadło dziwne, głuche oszołomienie."
    en: "I pressed the lever over to its extreme position. The night came like the turning out of a lamp, and in another moment came tomorrow. The laboratory grew faint and hazy, then fainter and ever fainter. Tomorrow night came black, then day again, night again, day again, faster and faster still. An eddying murmur filled my ears, and a strange, dumb confusedness descended on my mind."
    draft: true
    chunks:
      - pl: "Przesunąłem dźwignię do skrajnego położenia."
        ru: "Я перевёл рычаг в крайнее положение."
        note: "skrajny — крайний"
      - pl: " Noc nadeszła, jakby ktoś zgasił lampę, a w następnej chwili nadeszło jutro."
        ru: "Ночь пришла, словно кто-то погасил лампу, а в следующий миг пришло завтра."
      - pl: " Laboratorium stawało się blade i mgliste, potem coraz bledsze i bledsze."
        ru: "Лаборатория становилась бледной и туманной, потом всё бледнее и бледнее."
      - pl: " Nadeszła czarna noc następnego dnia, potem znów dzień, znów noc, znów dzień, coraz szybciej i szybciej."
        ru: "Наступила чёрная ночь следующего дня, потом снова день, снова ночь, снова день, всё быстрее и быстрее."
      - pl: " Uszy wypełnił mi wirujący szum, a na umysł spadło dziwne, głuche oszołomienie."
        ru: "Уши мне наполнил кружащийся гул, а на разум опустилось странное, глухое оцепенение."
        note: "oszołomienie — оглушённость, ошеломление"
    words: { "Przesunąłem": przesunac, "zgasił": zgasic, "lampę": lampa, "blade": blady, "szum": szum, "głuche": gluchy }
  - clean: "Obawiam się, że nie potrafię oddać szczególnych doznań podróży w czasie. Są nadzwyczaj nieprzyjemne. Uczucie jest dokładnie takie jak na kolejce górskiej — bezradnego pędu na łeb na szyję! Czułem też to samo okropne oczekiwanie, że zaraz nastąpi zderzenie. Gdy przyspieszałem, noc następowała po dniu jak łopot czarnego skrzydła. Mglisty zarys laboratorium wkrótce jakby odpadł ode mnie, i zobaczyłem słońce przeskakujące szybko po niebie, przemierzające je co minutę, a każda minuta oznaczała dzień."
    en: "“I am afraid I cannot convey the peculiar sensations of time travelling. They are excessively unpleasant. There is a feeling exactly like that one has upon a switchback—of a helpless headlong motion! I felt the same horrible anticipation, too, of an imminent smash. As I put on pace, night followed day like the flapping of a black wing. The dim suggestion of the laboratory seemed presently to fall away from me, and I saw the sun hopping swiftly across the sky, leaping it every minute, and every minute marking a day."
    draft: true
    chunks:
      - pl: "Obawiam się, że nie potrafię oddać szczególnych doznań podróży w czasie."
        ru: "Боюсь, я не сумею передать своеобразных ощущений путешествия во времени."
        note: "doznanie — ощущение"
      - pl: " Są nadzwyczaj nieprzyjemne."
        ru: "Они чрезвычайно неприятны."
      - pl: " Uczucie jest dokładnie takie jak na kolejce górskiej — bezradnego pędu na łeb na szyję!"
        ru: "Чувство в точности такое, как на американских горках, — беспомощного движения сломя голову!"
        note: "kolejka górska — американские горки; na łeb na szyję — сломя голову"
      - pl: " Czułem też to samo okropne oczekiwanie, że zaraz nastąpi zderzenie."
        ru: "Я испытывал и то же ужасное ожидание неминуемого удара."
        note: "zderzenie — столкновение"
      - pl: " Gdy przyspieszałem, noc następowała po dniu jak łopot czarnego skrzydła."
        ru: "Когда я прибавлял скорость, ночь сменяла день, как взмахи чёрного крыла."
        note: "łopot — хлопанье"
      - pl: " Mglisty zarys laboratorium wkrótce jakby odpadł ode mnie,"
        ru: "Смутные очертания лаборатории вскоре как будто отпали от меня,"
        note: "zarys — очертание"
      - pl: " i zobaczyłem słońce przeskakujące szybko po niebie, przemierzające je co minutę, a każda minuta oznaczała dzień."
        ru: "и я увидел солнце, быстро скачущее по небу, пересекающее его каждую минуту, и каждая минута означала день."
        note: "przemierzać — пересекать, проходить"
    words: { "szczególnych": szczegolny, "nieprzyjemne": nieprzyjemny, "szyję": szyja, "nastąpi": nastapic, "następowała": nastepowac, "skrzydła": skrzydlo }
  - clean: "Przypuszczałem, że laboratorium zostało zburzone i że znalazłem się pod gołym niebem. Miałem niewyraźne wrażenie rusztowań, ale pędziłem już zbyt szybko, by dostrzegać cokolwiek ruchomego. Najwolniejszy ślimak, jaki kiedykolwiek pełzał, przemykał obok mnie zbyt szybko. Migotliwe następstwo ciemności i światła było nadzwyczaj bolesne dla oka. Potem w przerywanych ciemnościach zobaczyłem księżyc, szybko przechodzący swoje kwadry od nowiu do pełni, i dostrzegłem słaby blask krążących gwiazd."
    en: "I supposed the laboratory had been destroyed and I had come into the open air. I had a dim impression of scaffolding, but I was already going too fast to be conscious of any moving things. The slowest snail that ever crawled dashed by too fast for me. The twinkling succession of darkness and light was excessively painful to the eye. Then, in the intermittent darknesses, I saw the moon spinning swiftly through her quarters from new to full, and had a faint glimpse of the circling stars."
    draft: true
    chunks:
      - pl: "Przypuszczałem, że laboratorium zostało zburzone i że znalazłem się pod gołym niebem."
        ru: "Я предположил, что лаборатория разрушена и я оказался под открытым небом."
        note: "pod gołym niebem — под открытым небом"
      - pl: " Miałem niewyraźne wrażenie rusztowań, ale pędziłem już zbyt szybko, by dostrzegać cokolwiek ruchomego."
        ru: "У меня было смутное впечатление строительных лесов, но я нёсся уже слишком быстро, чтобы замечать что-либо движущееся."
        note: "rusztowanie — строительные леса"
      - pl: " Najwolniejszy ślimak, jaki kiedykolwiek pełzał, przemykał obok mnie zbyt szybko."
        ru: "Самая медленная улитка, когда-либо ползавшая, проносилась мимо меня слишком быстро."
        note: "ślimak — улитка; pełzać — ползать"
      - pl: " Migotliwe następstwo ciemności i światła było nadzwyczaj bolesne dla oka."
        ru: "Мерцающее чередование тьмы и света было чрезвычайно болезненно для глаз."
        note: "następstwo — чередование, последовательность"
      - pl: " Potem w przerywanych ciemnościach zobaczyłem księżyc, szybko przechodzący swoje kwadry od nowiu do pełni, i dostrzegłem słaby blask krążących gwiazd."
        ru: "Потом в прерывистой тьме я увидел луну, быстро проходившую свои четверти от новолуния до полнолуния, и мельком разглядел кружащиеся звёзды."
        note: "kwadra — четверть (луны); nów — новолуние; pełnia — полнолуние"
    words: { "zburzone": zburzyc, "gołym": goly, "pędziłem": pedzic, "dostrzegać": dostrzegac, "dostrzegłem": dostrzec, "blask": blask }
  - clean: "Wkrótce, gdy pędziłem dalej, wciąż nabierając prędkości, pulsowanie nocy i dnia zlało się w jedną ciągłą szarość; niebo nabrało cudownej głębi błękitu, wspaniałej, świetlistej barwy, jak o wczesnym zmierzchu; skaczące słońce stało się smugą ognia, lśniącym łukiem w przestrzeni; księżyc — bledszą, falującą wstęgą; a z gwiazd nie widziałem nic, poza jaśniejszym od czasu do czasu kręgiem migocącym w błękicie."
    en: "Presently, as I went on, still gaining velocity, the palpitation of night and day merged into one continuous greyness; the sky took on a wonderful deepness of blue, a splendid luminous colour like that of early twilight; the jerking sun became a streak of fire, a brilliant arch, in space; the moon a fainter fluctuating band; and I could see nothing of the stars, save now and then a brighter circle flickering in the blue."
    draft: true
    chunks:
      - pl: "Wkrótce, gdy pędziłem dalej, wciąż nabierając prędkości, pulsowanie nocy i dnia zlało się w jedną ciągłą szarość;"
        ru: "Вскоре, по мере того как я нёсся дальше, всё набирая скорость, пульсация ночи и дня слилась в одну сплошную серость;"
        note: "zlać się — слиться"
      - pl: " niebo nabrało cudownej głębi błękitu, wspaniałej, świetlistej barwy, jak o wczesnym zmierzchu;"
        ru: "небо приобрело чудесную глубину синевы, великолепный светящийся цвет, как в ранних сумерках;"
        note: "świetlisty — светящийся"
      - pl: " skaczące słońce stało się smugą ognia, lśniącym łukiem w przestrzeni;"
        ru: "прыгающее солнце превратилось в полосу огня, сверкающую дугу в пространстве;"
        note: "smuga — полоса; łuk — дуга"
      - pl: " księżyc — bledszą, falującą wstęgą;"
        ru: "луна — более бледной, колышущейся лентой;"
        note: "wstęga — лента"
      - pl: " a z gwiazd nie widziałem nic, poza jaśniejszym od czasu do czasu kręgiem migocącym w błękicie."
        ru: "а из звёзд я не видел ничего, кроме изредка мерцающего в синеве более яркого кружка."
    words: { "pędziłem": pedzic, "nabierając": nabierac, "ciągłą": ciagly, "łukiem": luk, "bledszą": blady, "kręgiem": krag }
  - clean: "Krajobraz był mglisty i niewyraźny. Wciąż znajdowałem się na zboczu wzgórza, na którym stoi teraz ten dom, a garb wzgórza wznosił się nade mną, szary i mroczny. Widziałem drzewa, które rosły i zmieniały się jak kłęby pary, to brązowe, to zielone; rosły, rozrastały się, drżały i przemijały. Widziałem, jak wznoszą się ogromne budowle, mgliste i piękne, i przemijają jak sny. Cała powierzchnia ziemi zdawała się odmieniona — topniała i płynęła mi przed oczami."
    en: "“The landscape was misty and vague. I was still on the hillside upon which this house now stands, and the shoulder rose above me grey and dim. I saw trees growing and changing like puffs of vapour, now brown, now green; they grew, spread, shivered, and passed away. I saw huge buildings rise up faint and fair, and pass like dreams. The whole surface of the earth seemed changed—melting and flowing under my eyes."
    draft: true
