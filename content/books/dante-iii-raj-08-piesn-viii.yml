  - clean: "«Panie mój!» rzekłem: «Gdy radość głęboką,\nJaką przelewasz w duszy mej naczynie,\nJak ja ją widzę, widzi twoje oko\nW Tym, w kim się radość poczyna i ginie,\nA którą, wierzę, oglądając Boga,\nDzielisz się ze mną, czym więcej mi droga!"
    verse: true
    chunks:
      - pl: "«Panie mój!» rzekłem: «Gdy radość głęboką,"
        ru: "«Господин мой! — сказал я, — так как глубокую радость,"
      - pl: "\nJaką przelewasz w duszy mej naczynie,"
        ru: "которую ты переливаешь в сосуд моей души,"
