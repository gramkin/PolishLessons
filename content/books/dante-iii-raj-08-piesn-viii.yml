      - pl: "\nZ szczodrego ojca urodzony sknerą,"
        ru: "Рождённый скрягой от щедрого отца,"
        note: "sknera — скряга"
      - pl: "\nSług potrzebował z inną troską szczerą,"
        ru: "он нуждался в слугах с иной, искренней заботой,"
      - pl: "\nNie żeby złotem ładowali skrzynie»."
        ru: "а не в тех, кто набивает сундуки золотом»."
