paragraphs:
  - clean: "(3. Wenera. Karol Młot i synowie jego niepodobni. Rozmaite zdolności stwarzają podług wyroków Opatrzności boskiej formę społeczeństwa ludzkiego, państwo.)"
    chunks:
      - pl: "(3. Wenera. Karol Młot i synowie jego niepodobni. Rozmaite zdolności stwarzają podług wyroków Opatrzności boskiej formę społeczeństwa ludzkiego, państwo.)"
        ru: "(3. Венера. Карл Мартелл и его непохожие сыновья. Разнообразные способности создают по приговорам Божественного Провидения форму человеческого общества, государство.)"
        note: "Karol Młot — у Korsaka; Карл Мартелл Анжуйский"
    words: { "wyroków": wyrok, "boskiej": boski, "formę": forma, "społeczeństwa": spoleczenstwo, "ludzkiego": ludzki, "państwo": panstwo }
  - clean: "Świat niegdyś wierzył na swej duszy zgubę,\nŻe piękna Wenus ogniem jakim świeci,\nKołując sama przez epicykl trzeci\nŚlepej miłości zapalała żary.\nŚwiat starożytny tym błędem rażony,\nCzcił ją przez ślubne modlitwy, ofiary,\nJeszcze ubóstwiał jej matkę i syna,\nKtóry, jak baśnie powiadały grube,\nRad siedział blisko przy sercu Dydony."
    verse: true
    chunks:
      - pl: "Świat niegdyś wierzył na swej duszy zgubę,"
        ru: "Мир некогда верил на погибель своей души,"
      - pl: "\nŻe piękna Wenus ogniem jakim świeci,"
        ru: "что прекрасная Венера, огнём, каким сияет,"
      - pl: "\nKołując sama przez epicykl trzeci"
        ru: "кружась сама по третьему эпициклу,"
      - pl: "\nŚlepej miłości zapalała żary."
        ru: "зажигала жар слепой любви."
      - pl: "\nŚwiat starożytny tym błędem rażony,"
        ru: "Древний мир, поражённый этим заблуждением,"
      - pl: "\nCzcił ją przez ślubne modlitwy, ofiary,"
        ru: "чтил её брачными молитвами, жертвами,"
      - pl: "\nJeszcze ubóstwiał jej matkę i syna,"
        ru: "ещё обожествлял её мать и сына,"
        note: "Диону и Купидона"
      - pl: "\nKtóry, jak baśnie powiadały grube,"
        ru: "который, как говорили грубые басни,"
      - pl: "\nRad siedział blisko przy sercu Dydony."
        ru: "охотно сидел близко к сердцу Дидоны."
    words: { "duszy": dusza, "zgubę": zguba, "ogniem": ogien, "starożytny": starozytny, "ślubne": slubny, "modlitwy": modlitwa }
  - clean: "W cześć tej, od której ta się pieśń zaczyna,\nNazwano gwiazdę, a której uroczym\nZłotem jej rzęsów, to jasnym warkoczem,\nPatrzając na nią, słońce się zachwyca.\nNie tylko czułem, lecz wierzyłem szczerze,\nŻe już naprawdę jestem w trzeciej sferze,\nWidząc piękniejsze mojej Pani lica."
    verse: true
    chunks:
      - pl: "W cześć tej, od której ta się pieśń zaczyna,"
        ru: "В честь той, с которой начинается эта песнь,"
      - pl: "\nNazwano gwiazdę, a której uroczym"
        ru: "назвали звезду, на которую, то на прелестное"
      - pl: "\nZłotem jej rzęsów, to jasnym warkoczem,"
        ru: "золото её ресниц, то на ясную косу,"
      - pl: "\nPatrzając na nią, słońce się zachwyca."
        ru: "глядя, восхищается солнце."
        note: "то она утренняя, то вечерняя звезда"
      - pl: "\nNie tylko czułem, lecz wierzyłem szczerze,"
        ru: "Я не только чувствовал, но искренне верил,"
      - pl: "\nŻe już naprawdę jestem w trzeciej sferze,"
        ru: "что я уже поистине в третьей сфере,"
      - pl: "\nWidząc piękniejsze mojej Pani lica."
        ru: "видя лицо моей Госпожи прекраснее."
    words: { "pieśń": piesn, "gwiazdę": gwiazda, "uroczym": uroczy, "Złotem": zloto, "słońce": slonce, "szczerze": szczerze }
  - clean: "Jak grę promieni w blasku rannej rosy,\nJak w ogniu iskry widzimy oczyma,\nJak w chórze głosów rozpoznajem głosy,\nGdy jeden stale jedną nutę trzyma,\nDrugi przechodzi w spadki harmonijne;\nWidziałem w świetle gwiazdy światła inne,\nCo się mniej więcej szybko obracały,\nO ile wieczną światłość odbijały."
    verse: true
    chunks:
      - pl: "Jak grę promieni w blasku rannej rosy,"
        ru: "Как игру лучей в блеске утренней росы,"
      - pl: "\nJak w ogniu iskry widzimy oczyma,"
        ru: "как искры в огне мы видим глазами,"
      - pl: "\nJak w chórze głosów rozpoznajem głosy,"
        ru: "как в хоре голосов различаем голоса,"
      - pl: "\nGdy jeden stale jedną nutę trzyma,"
        ru: "когда один постоянно держит одну ноту,"
      - pl: "\nDrugi przechodzi w spadki harmonijne;"
        ru: "другой переходит в гармонические переливы;"
        note: "spadek — каденция"
      - pl: "\nWidziałem w świetle gwiazdy światła inne,"
        ru: "так я видел в свете звезды другие светила,"
      - pl: "\nCo się mniej więcej szybko obracały,"
        ru: "что кружились более или менее быстро,"
      - pl: "\nO ile wieczną światłość odbijały."
        ru: "насколько отражали вечный свет."
    words: { "promieni": promien, "blasku": blask, "rosy": rosa, "chórze": chor, "spadki": spadek, "odbijały": odbijac }
  - clean: "Z chmur chłodnych wiatry czy to grady miecą,\nCzy skwarem zieją, nie tak szybko lecą,\nJak do nas biegły owe światła święte.\nNagle przerwawszy swe kręgi poczęte\nAż w Serafinów niebie, dalej nieco\nBrzmiała Hosanna tony tak dźwięcznemi,\nŻe za jej nutą dziś tęsknię na ziemi."
    verse: true
    chunks:
      - pl: "Z chmur chłodnych wiatry czy to grady miecą,"
        ru: "Ветры из холодных туч, мечут ли они град"
      - pl: "\nCzy skwarem zieją, nie tak szybko lecą,"
        ru: "или пышут зноем, не так быстро летят,"
      - pl: "\nJak do nas biegły owe światła święte."
        ru: "как бежали к нам те святые светила."
      - pl: "\nNagle przerwawszy swe kręgi poczęte"
        ru: "Вдруг прервав свои начатые круги"
      - pl: "\nAż w Serafinów niebie, dalej nieco"
        ru: "в самом небе серафимов, чуть дальше"
      - pl: "\nBrzmiała Hosanna tony tak dźwięcznemi,"
        ru: "звучала «Осанна» столь звонкими тонами,"
      - pl: "\nŻe za jej nutą dziś tęsknię na ziemi."
        ru: "что по её напеву я сегодня тоскую на земле."
    words: { "chmur": chmura, "chłodnych": chlodny, "zieją": ziac, "przerwawszy": przerwac, "kręgi": krag, "poczęte": poczac }
  - clean: "Jedno z tych świateł sporszą lotu siłą\nStanęło blisko od nas i mówiło:\n«Rozkosz ci zrobić jesteśmy gotowe,\nAbyś w nas cały rozradował siebie.\nTu jednym kołem treść nasza objęta\nZ jednym pragnieniem, w też kręgi wirowe,\nKołujem jako niebiescy książęta,\nKtórzy, co o nich mówiłeś na świecie,\n»Mądrością niebo poruszają trzecie«."
    verse: true
    chunks:
      - pl: "Jedno z tych świateł sporszą lotu siłą"
        ru: "Одно из этих светил с более скорой силой полёта"
      - pl: "\nStanęło blisko od nas i mówiło:"
        ru: "остановилось близко от нас и сказало:"
      - pl: "\n«Rozkosz ci zrobić jesteśmy gotowe,"
        ru: "«Мы готовы доставить тебе наслаждение,"
      - pl: "\nAbyś w nas cały rozradował siebie."
        ru: "чтобы ты весь возрадовался в нас."
      - pl: "\nTu jednym kołem treść nasza objęta"
        ru: "Здесь одним кругом объята наша суть,"
      - pl: "\nZ jednym pragnieniem, w też kręgi wirowe,"
        ru: "с одним желанием, в те же кружащиеся круги"
      - pl: "\nKołujem jako niebiescy książęta,"
        ru: "мы кружимся, как небесные князья,"
        note: "Начала, ангельский чин"
      - pl: "\nKtórzy, co o nich mówiłeś na świecie,"
        ru: "о которых ты говорил на свете:"
      - pl: "\n»Mądrością niebo poruszają trzecie«."
        ru: "„Мудростью движете вы третье небо“."
        note: "начало канцоны Данте"
    words: { "Stanęło": stanac, "objęta": objac, "pragnieniem": pragnienie, "książęta": ksiaze, "Mądrością": madrosc, "poruszają": poruszac }
  - clean: "Miłość do tyla przepełnia nas w niebie,\nNiemniej jak krążyć w wiekuistym młynku,\nMiłą nam będzie ta chwila spoczynku».\nPotem gdy moje oczy się podniosły,\nDo mojej Pani, kiedy jej spojrzenie\nOdpowiedziało mi przez przyzwolenie,\nSpojrzałem w światło, co z taką miłością\nMówiło do mnie. Z uczucia wielkiego\n«Mów, ktoś jest?» ledwom przemówił do niego."
    verse: true
    chunks:
      - pl: "Miłość do tyla przepełnia nas w niebie,"
        ru: "Любовь так переполняет нас на небе,"
      - pl: "\nNiemniej jak krążyć w wiekuistym młynku,"
        ru: "что, не меньше, чем кружиться в вечной мельнице,"
        note: "młynek — мельница"
      - pl: "\nMiłą nam będzie ta chwila spoczynku»."
        ru: "мила нам будет эта минута отдыха»."
      - pl: "\nPotem gdy moje oczy się podniosły,"
        ru: "Потом, когда мои глаза поднялись"
      - pl: "\nDo mojej Pani, kiedy jej spojrzenie"
        ru: "к моей Госпоже и её взгляд"
      - pl: "\nOdpowiedziało mi przez przyzwolenie,"
        ru: "ответил мне согласием,"
      - pl: "\nSpojrzałem w światło, co z taką miłością"
        ru: "я взглянул на свет, что с такой любовью"
      - pl: "\nMówiło do mnie. Z uczucia wielkiego"
        ru: "говорил со мной. От великого чувства"
      - pl: "\n«Mów, ktoś jest?» ledwom przemówił do niego."
        ru: "«Скажи, кто ты?» — едва вымолвил я к нему."
    words: { "niebie": niebo, "krążyć": krazyc, "podniosły": podniesc, "Odpowiedziało": odpowiedziec, "światło": swiatlo, "przemówił": przemowic }
  - clean: "Kiedym doń mówił, blaski jego rosły\nRozpromienione nową wesołością\nI rzekło do mnie, świecąc promieniście:\n«Świat mnie miał krótko, gdybym nie legł w grobie,\nWiele bied, jakich myśl twa nie przenika,\nA które będą, osłodziłbym tobie."
    verse: true
    chunks:
      - pl: "Kiedym doń mówił, blaski jego rosły"
        ru: "Когда я говорил ему, его блески росли,"
      - pl: "\nRozpromienione nową wesołością"
        ru: "озарённые новым весельем,"
      - pl: "\nI rzekło do mnie, świecąc promieniście:"
        ru: "и он сказал мне, сияя лучисто:"
      - pl: "\n«Świat mnie miał krótko, gdybym nie legł w grobie,"
        ru: "«Мир держал меня недолго; если бы я не лёг в могилу,"
        note: "Карл Мартелл умер в 24 года"
      - pl: "\nWiele bied, jakich myśl twa nie przenika,"
        ru: "многие беды, которых твоя мысль не прозревает"
      - pl: "\nA które będą, osłodziłbym tobie."
        ru: "и которые будут, я подсластил бы тебе."
    words: { "rosły": rosnac, "rzekło": rzec, "świecąc": swiecic, "Świat": swiat, "grobie": grob, "jakich": jaki }
  - clean: "Tak mnie oświetla radość moja żywa,\nŻe mnie przed twymi oczyma zakrywa,\nJako jedwabna przędza jedwabnika.\nSłusznieś mnie kochał! Coś więcej jak liście\nDałbym ci widzieć z naszych związków drzewa,\nGdybym żył dłużej. Kraj, co Ron oblewa,\nI auzoński róg z szyją zagiętą,\nGdzie stoją Bari, Gaeta, Krotona,\nSkąd Werda wpada do morza i Trento,\nMnie oczekiwał jako swego pana."
    verse: true
    chunks:
      - pl: "Tak mnie oświetla radość moja żywa,"
        ru: "Так меня озаряет моя живая радость,"
      - pl: "\nŻe mnie przed twymi oczyma zakrywa,"
        ru: "что скрывает меня от твоих глаз,"
      - pl: "\nJako jedwabna przędza jedwabnika."
        ru: "как шелковичного червя — шёлковая пряжа."
        note: "jedwabnik — шелкопряд"
      - pl: "\nSłusznieś mnie kochał! Coś więcej jak liście"
        ru: "Справедливо ты любил меня! Больше, чем листья,"
        note: "Карл и Данте встречались во Флоренции"
      - pl: "\nDałbym ci widzieć z naszych związków drzewa,"
        ru: "я дал бы тебе увидеть от древа нашей дружбы,"
      - pl: "\nGdybym żył dłużej. Kraj, co Ron oblewa,"
        ru: "если бы жил дольше. Край, что омывает Рона,"
        note: "Прованс"
      - pl: "\nI auzoński róg z szyją zagiętą,"
        ru: "и авзонийский рог с загнутой шеей,"
        note: "Неаполитанское королевство"
      - pl: "\nGdzie stoją Bari, Gaeta, Krotona,"
        ru: "где стоят Бари, Гаэта, Кротоне,"
      - pl: "\nSkąd Werda wpada do morza i Trento,"
        ru: "откуда в море впадают Верде и Тренто,"
        note: "у Данте — Тронто"
      - pl: "\nMnie oczekiwał jako swego pana."
        ru: "ждал меня как своего господина."
    words: { "radość": radosc, "żywa": zywy, "drzewa": drzewo, "szyją": szyja, "wpada": wpadac, "morza": morze }
  - clean: "Już ziem Dunaju świeciła korona\nNa czole moim, gdzie rzeka tak zwana\nSzerszym korytem żegna Teutony.\nPiękna Trinakria, co ląd zaczerniony\nMiędzy Pachiny wznosi a Peloro,\nGdzie Eurus burze w zatoce porusza."
    verse: true
    chunks:
      - pl: "Już ziem Dunaju świeciła korona"
        ru: "Уже корона земель Дуная сияла"
        note: "Венгрия"
      - pl: "\nNa czole moim, gdzie rzeka tak zwana"
        ru: "на моём челе, где река, так называемая,"
      - pl: "\nSzerszym korytem żegna Teutony."
        ru: "более широким руслом прощается с тевтонами."
      - pl: "\nPiękna Trinakria, co ląd zaczerniony"
        ru: "Прекрасная Тринакрия, что поднимает почерневшую землю"
        note: "Сицилия"
      - pl: "\nMiędzy Pachiny wznosi a Peloro,"
        ru: "между Пахином и Пелором,"
      - pl: "\nGdzie Eurus burze w zatoce porusza."
        ru: "где Эвр движет бури в заливе,"
        note: "юго-восточный ветер"
    words: { "korona": korona, "czole": czolo, "Szerszym": szeroki, "wznosi": wznosic, "burze": burza, "zatoce": zatoka }
  - clean: "Nie ogniem, dymem z gardła Tyfeusza,\nRaczej siarkami, co w jej łonie gorą.\nTrinakria jeszcze mogłaby mieć króla\nZ krwi mej, z Rudolfa wnuków i Karola,\nGdyby jej rządcy okrutni a słabi,\nA co do buntu lud podbity wabi,\nW Palermie hasła nie dali: «Bij, zabij!»"
    verse: true
    chunks:
      - pl: "Nie ogniem, dymem z gardła Tyfeusza,"
        ru: "не от огня, а от дыма из глотки Тифея,"
      - pl: "\nRaczej siarkami, co w jej łonie gorą."
        ru: "а скорее от серы, что горит в её лоне,"
      - pl: "\nTrinakria jeszcze mogłaby mieć króla"
        ru: "Тринакрия ещё могла бы иметь короля"
      - pl: "\nZ krwi mej, z Rudolfa wnuków i Karola,"
        ru: "из моей крови, от внуков Рудольфа и Карла,"
      - pl: "\nGdyby jej rządcy okrutni a słabi,"
        ru: "если бы её жестокие и слабые правители,"
      - pl: "\nA co do buntu lud podbity wabi,"
        ru: "что манят покорённый народ к мятежу,"
      - pl: "\nW Palermie hasła nie dali: «Bij, zabij!»"
        ru: "не дали в Палермо сигнала: „Бей, убивай!“"
        note: "Сицилийская вечерня, 1282"
    words: { "dymem": dym, "siarkami": siarka, "wnuków": wnuk, "okrutni": okrutny, "buntu": bunt, "hasła": haslo }
  - clean: "I gdyby brat mój miał wzrok więcej bystry,\nA katalańskie łakome ministry\nKarcił lub uczuł tę prawdę na tronie,\nŻe przeciążona jego łódź utonie.\nZ szczodrego ojca urodzony sknerą,\nSług potrzebował z inną troską szczerą,\nNie żeby złotem ładowali skrzynie»."
    verse: true
