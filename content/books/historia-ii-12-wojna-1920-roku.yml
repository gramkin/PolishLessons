  - clean: "W 1919 roku, gdy w Rosji trwała wojna domowa, walki między Polakami a bolszewikami miały ograniczony charakter. Piłsudski nie chciał pomagać białym generałom, takim jak Denikin, bo ci zapowiadali odbudowę jednej i niepodzielnej Rosji, a niepodległej Polsce dawali najwyżej niewielki obszar. Wolał poczekać, aż biali zostaną pokonani, choć wiedział, że wtedy bolszewicy zwrócą się przeciwko Polsce. Na przełomie 1919 i 1920 roku stało się jasne, że wielka rozprawa jest nieunikniona. Obie strony gromadziły wojska i przygotowywały się do wiosennej ofensywy. Żadna ze stron nie wypowiedziała drugiej wojny, a mimo to walki trwały prawie dwa lata."
    draft: true
    chunks:
      - pl: "W 1919 roku, gdy w Rosji trwała wojna domowa, walki między Polakami a bolszewikami miały ograniczony charakter."
        ru: "В 1919 году, когда в России шла гражданская война, бои между поляками и большевиками носили ограниченный характер."
      - pl: " Piłsudski nie chciał pomagać białym generałom, takim jak Denikin, bo ci zapowiadali odbudowę jednej i niepodzielnej Rosji, a niepodległej Polsce dawali najwyżej niewielki obszar."
        ru: "Пилсудский не хотел помогать белым генералам, таким как Деникин, потому что те провозглашали восстановление единой и неделимой России, а независимой Польше давали в лучшем случае небольшую территорию."
        note: "niepodzielny — неделимый"
      - pl: " Wolał poczekać, aż biali zostaną pokonani, choć wiedział, że wtedy bolszewicy zwrócą się przeciwko Polsce."
        ru: "Он предпочёл подождать, пока белые не будут разбиты, хотя знал, что тогда большевики обратятся против Польши."
      - pl: " Na przełomie 1919 i 1920 roku stało się jasne, że wielka rozprawa jest nieunikniona."
        ru: "На рубеже 1919 и 1920 годов стало ясно, что большая схватка неизбежна."
        note: "rozprawa — схватка, расправа"
      - pl: " Obie strony gromadziły wojska i przygotowywały się do wiosennej ofensywy."
        ru: "Обе стороны стягивали войска и готовились к весеннему наступлению."
      - pl: " Żadna ze stron nie wypowiedziała drugiej wojny, a mimo to walki trwały prawie dwa lata."
        ru: "Ни одна из сторон не объявила другой войну, и тем не менее бои длились почти два года."
