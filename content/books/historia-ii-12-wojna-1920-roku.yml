paragraphs:
  - clean: "Wojna polsko-bolszewicka była zderzeniem dwóch zupełnie różnych wizji Europy. Lenin i jego towarzysze wierzyli, że rewolucja w Rosji jest tylko początkiem rewolucji światowej. Najważniejsze były dla nich Niemcy, kraj wielkiego przemysłu i silnego ruchu robotniczego, a droga do Niemiec prowadziła przez Polskę. Piłsudski uważał z kolei, że Rosja, niezależnie od tego, kto nią rządzi, zawsze będzie zagrożeniem dla Polski. Chciał więc oddzielić ją od Polski pasem niepodległych państw: Litwy, Białorusi i Ukrainy, związanych sojuszem z Warszawą."
    draft: true
    chunks:
      - pl: "Wojna polsko-bolszewicka była zderzeniem dwóch zupełnie różnych wizji Europy."
        ru: "Польско-большевистская война была столкновением двух совершенно разных видений Европы."
        note: "zderzenie — столкновение"
      - pl: " Lenin i jego towarzysze wierzyli, że rewolucja w Rosji jest tylko początkiem rewolucji światowej."
        ru: "Ленин и его товарищи верили, что революция в России — лишь начало мировой революции."
      - pl: " Najważniejsze były dla nich Niemcy, kraj wielkiego przemysłu i silnego ruchu robotniczego, a droga do Niemiec prowadziła przez Polskę."
        ru: "Важнее всего для них была Германия, страна крупной промышленности и сильного рабочего движения, а путь в Германию лежал через Польшу."
      - pl: " Piłsudski uważał z kolei, że Rosja, niezależnie od tego, kto nią rządzi, zawsze będzie zagrożeniem dla Polski."
        ru: "Пилсудский, в свою очередь, считал, что Россия, независимо от того, кто ею правит, всегда будет угрозой для Польши."
      - pl: " Chciał więc oddzielić ją od Polski pasem niepodległych państw: Litwy, Białorusi i Ukrainy, związanych sojuszem z Warszawą."
        ru: "Поэтому он хотел отделить её от Польши поясом независимых государств — Литвы, Белоруссии и Украины, — связанных союзом с Варшавой."
        note: "pas — пояс, полоса"
