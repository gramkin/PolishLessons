  - clean: "Pomoc materialna z Zachodu była niewielka. Robotnicy w wielu krajach, sympatyzujący z rewolucją, odmawiali przeładunku broni dla Polski. Czechosłowacja i Niemcy zamknęły swoje terytorium dla transportów wojskowych, a dokerzy w Gdańsku nie chcieli rozładowywać statków. Prawdziwą pomoc okazały tylko Węgry, które przysłały amunicję, oraz Francja, która wysłała do Warszawy misję wojskową z generałem Maxime’em Weygandem. Polacy musieli więc liczyć przede wszystkim na siebie. W kraju powołano Radę Obrony Państwa, a pod koniec lipca powstał rząd obrony narodowej z chłopskim przywódcą Wincentym Witosem jako premierem i socjalistą Ignacym Daszyńskim jako wicepremierem."
    draft: true
    chunks:
      - pl: "Pomoc materialna z Zachodu była niewielka."
        ru: "Материальная помощь с Запада была невелика."
      - pl: " Robotnicy w wielu krajach, sympatyzujący z rewolucją, odmawiali przeładunku broni dla Polski."
        ru: "Рабочие во многих странах, сочувствовавшие революции, отказывались перегружать оружие для Польши."
        note: "przeładunek — перегрузка"
