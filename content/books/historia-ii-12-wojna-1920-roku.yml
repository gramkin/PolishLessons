  - clean: "Piłsudski postanowił uderzyć pierwszy. W kwietniu 1920 roku zawarł sojusz z atamanem Symonem Petlurą, przywódcą Ukraińskiej Republiki Ludowej, której wojska zostały wyparte z Ukrainy przez bolszewików. Petlura zgodził się zrezygnować ze wschodniej Galicji w zamian za polską pomoc w odzyskaniu Kijowa. Wielu Ukraińców uznało to za zdradę, ale Petlura nie widział innej drogi do niepodległości."
    draft: true
    chunks:
      - pl: "Piłsudski postanowił uderzyć pierwszy."
        ru: "Пилсудский решил ударить первым."
      - pl: " W kwietniu 1920 roku zawarł sojusz z atamanem Symonem Petlurą, przywódcą Ukraińskiej Republiki Ludowej, której wojska zostały wyparte z Ukrainy przez bolszewików."
        ru: "В апреле 1920 года он заключил союз с атаманом Симоном Петлюрой, руководителем Украинской народной республики, войска которой были вытеснены большевиками с Украины."
        note: "ataman — атаман"
      - pl: " Petlura zgodził się zrezygnować ze wschodniej Galicji w zamian za polską pomoc w odzyskaniu Kijowa."
        ru: "Петлюра согласился отказаться от Восточной Галиции в обмен на польскую помощь в возвращении Киева."
      - pl: " Wielu Ukraińców uznało to za zdradę, ale Petlura nie widział innej drogi do niepodległości."
        ru: "Многие украинцы сочли это предательством, но Петлюра не видел другого пути к независимости."
    words: { "wojska": wojsko, "kwietniu": kwiecien, "zawarł": zawrzec, "sojusz": sojusz, "przywódcą": przywodca, "wyparte": wyprzec, "zrezygnować": zrezygnowac, "wschodniej": wschodni, "polską": polski, "zdradę": zdrada }
  - clean: "Pod koniec kwietnia wojska polskie i ukraińskie ruszyły na Kijów i 7 maja zajęły miasto prawie bez walki. Na Kreszczatiku, głównej ulicy Kijowa, odbyła się defilada zwycięskich wojsk. W Warszawie świętowano, a Piłsudskiego witano jak triumfatora. Zwycięstwo okazało się jednak pozorne. Armia Czerwona wycofała się, nie ponosząc większych strat, a ukraińscy chłopi, zmęczeni latami wojny, nie przyłączyli się masowo do armii Petlury. Wielu z nich pamiętało też polskich ziemian i nie ufało nowym sojusznikom. Bolszewicy przedstawiali wyprawę kijowską jako najazd polskich panów i wzywali do obrony ojczyzny nawet byłych oficerów carskich. Słynny generał Brusiłow zaapelował wtedy do dawnych oficerów, żeby wstąpili do Armii Czerwonej, i wielu z nich go posłuchało."
    draft: true
    chunks:
      - pl: "Pod koniec kwietnia wojska polskie i ukraińskie ruszyły na Kijów i 7 maja zajęły miasto prawie bez walki."
        ru: "В конце апреля польские и украинские войска двинулись на Киев и 7 мая заняли город почти без боя."
      - pl: " Na Kreszczatiku, głównej ulicy Kijowa, odbyła się defilada zwycięskich wojsk."
        ru: "На Крещатике, главной улице Киева, прошёл парад победоносных войск."
        note: "defilada — парад"
      - pl: " W Warszawie świętowano, a Piłsudskiego witano jak triumfatora."
        ru: "В Варшаве праздновали, а Пилсудского встречали как триумфатора."
      - pl: " Zwycięstwo okazało się jednak pozorne."
        ru: "Однако победа оказалась мнимой."
        note: "pozorny — мнимый, кажущийся"
      - pl: " Armia Czerwona wycofała się, nie ponosząc większych strat, a ukraińscy chłopi, zmęczeni latami wojny, nie przyłączyli się masowo do armii Petlury."
        ru: "Красная армия отступила, не понеся больших потерь, а украинские крестьяне, уставшие от многолетней войны, не присоединились массово к армии Петлюры."
      - pl: " Wielu z nich pamiętało też polskich ziemian i nie ufało nowym sojusznikom."
        ru: "Многие из них помнили также польских помещиков и не доверяли новым союзникам."
      - pl: " Bolszewicy przedstawiali wyprawę kijowską jako najazd polskich panów i wzywali do obrony ojczyzny nawet byłych oficerów carskich."
        ru: "Большевики представляли Киевский поход как нашествие польских панов и призывали к защите отечества даже бывших царских офицеров."
      - pl: " Słynny generał Brusiłow zaapelował wtedy do dawnych oficerów, żeby wstąpili do Armii Czerwonej, i wielu z nich go posłuchało."
        ru: "Знаменитый генерал Брусилов обратился тогда к бывшим офицерам с призывом вступать в Красную армию, и многие из них его послушали."
        note: "zaapelować — обратиться с призывом"
