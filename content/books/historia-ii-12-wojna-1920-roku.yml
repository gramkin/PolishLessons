  - clean: "Kontrofensywa bolszewicka nadeszła szybko. Na Ukrainie uderzyła 1 Armia Konna Siemiona Budionnego, licząca kilkanaście tysięcy jeźdźców, która w czerwcu przerwała polski front. Polskie wojska musiały opuścić Kijów i cofać się na zachód, a konnica Budionnego siała po drodze strach i zniszczenie. Na północy, na Białorusi, w lipcu ruszył Front Zachodni pod dowództwem młodego dowódcy Michaiła Tuchaczewskiego. W rozkazie do swoich żołnierzy Tuchaczewski pisał, że przez trupa białej Polski prowadzi droga do światowego pożaru."
    draft: true
    chunks:
      - pl: "Kontrofensywa bolszewicka nadeszła szybko."
        ru: "Большевистское контрнаступление последовало быстро."
      - pl: " Na Ukrainie uderzyła 1 Armia Konna Siemiona Budionnego, licząca kilkanaście tysięcy jeźdźców, która w czerwcu przerwała polski front."
        ru: "На Украине ударила 1-я Конная армия Семёна Будённого, насчитывавшая больше десяти тысяч всадников, которая в июне прорвала польский фронт."
        note: "jeździec — всадник"
      - pl: " Polskie wojska musiały opuścić Kijów i cofać się na zachód, a konnica Budionnego siała po drodze strach i zniszczenie."
        ru: "Польским войскам пришлось оставить Киев и отступать на запад, а конница Будённого сеяла по пути страх и разрушение."
        note: "konnica — конница"
      - pl: " Na północy, na Białorusi, w lipcu ruszył Front Zachodni pod dowództwem młodego dowódcy Michaiła Tuchaczewskiego."
        ru: "На севере, в Белоруссии, в июле двинулся Западный фронт под командованием молодого командира Михаила Тухачевского."
      - pl: " W rozkazie do swoich żołnierzy Tuchaczewski pisał, że przez trupa białej Polski prowadzi droga do światowego pożaru."
        ru: "В приказе своим войскам Тухачевский писал, что через труп белой Польши лежит путь к мировому пожару."
        note: "trup — труп"
