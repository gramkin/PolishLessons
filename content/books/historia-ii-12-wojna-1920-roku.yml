  - clean: "W obliczu klęski Polska szukała pomocy u zachodnich sojuszników. W lipcu 1920 roku na konferencji w Spa premier Władysław Grabski prosił o wsparcie. Alianci postawili twarde warunki: Polska miała wycofać się za linię, którą zaproponował brytyjski minister spraw zagranicznych lord Curzon. Linia ta biegła mniej więcej wzdłuż Bugu i pozostawiała Wilno i Lwów poza Polską. Polska musiała też zgodzić się na to, żeby o losie Śląska Cieszyńskiego i Wilna zdecydowali alianci."
    draft: true
    chunks:
      - pl: "W obliczu klęski Polska szukała pomocy u zachodnich sojuszników."
        ru: "Перед лицом поражения Польша искала помощи у западных союзников."
        note: "w obliczu — перед лицом"
      - pl: " W lipcu 1920 roku na konferencji w Spa premier Władysław Grabski prosił o wsparcie."
        ru: "В июле 1920 года на конференции в Спа премьер Владислав Грабский просил о поддержке."
      - pl: " Alianci postawili twarde warunki: Polska miała wycofać się za linię, którą zaproponował brytyjski minister spraw zagranicznych lord Curzon."
        ru: "Союзники поставили жёсткие условия: Польша должна была отойти за линию, которую предложил британский министр иностранных дел лорд Керзон."
      - pl: " Linia ta biegła mniej więcej wzdłuż Bugu i pozostawiała Wilno i Lwów poza Polską."
        ru: "Эта линия проходила примерно по Бугу и оставляла Вильно и Львов за пределами Польши."
      - pl: " Polska musiała też zgodzić się na to, żeby o losie Śląska Cieszyńskiego i Wilna zdecydowali alianci."
        ru: "Польше пришлось также согласиться, чтобы о судьбе Тешинской Силезии и Вильно решили союзники."
