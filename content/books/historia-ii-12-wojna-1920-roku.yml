  - clean: "Wojska polskie cofały się coraz szybciej. W ciągu kilku tygodni Armia Czerwona przeszła setki kilometrów i zajęła Mińsk, Wilno, Grodno i Białystok. Żołnierze polscy byli zmęczeni, brakowało im amunicji i zaopatrzenia, a w wielu oddziałach szerzyła się panika. Na początku sierpnia wojska Tuchaczewskiego stanęły nad Wisłą, a konnica dotarła prawie pod Toruń i Płock. Na Zachodzie wielu polityków uważało, że upadek Warszawy jest tylko kwestią dni. Zagraniczni dyplomaci zaczęli opuszczać polską stolicę, a niektórzy przenieśli się do Poznania. Wydawało się, że historia z czasów rozbiorów zaraz się powtórzy."
    draft: true
    chunks:
      - pl: "Wojska polskie cofały się coraz szybciej."
        ru: "Польские войска отступали всё быстрее."
      - pl: " W ciągu kilku tygodni Armia Czerwona przeszła setki kilometrów i zajęła Mińsk, Wilno, Grodno i Białystok."
        ru: "За несколько недель Красная армия прошла сотни километров и заняла Минск, Вильно, Гродно и Белосток."
      - pl: " Żołnierze polscy byli zmęczeni, brakowało im amunicji i zaopatrzenia, a w wielu oddziałach szerzyła się panika."
        ru: "Польские солдаты были измотаны, им не хватало боеприпасов и снабжения, а во многих частях распространялась паника."
        note: "zaopatrzenie — снабжение"
      - pl: " Na początku sierpnia wojska Tuchaczewskiego stanęły nad Wisłą, a konnica dotarła prawie pod Toruń i Płock."
        ru: "В начале августа войска Тухачевского вышли к Висле, а конница дошла почти до Торуня и Плоцка."
      - pl: " Na Zachodzie wielu polityków uważało, że upadek Warszawy jest tylko kwestią dni."
        ru: "На Западе многие политики считали, что падение Варшавы — лишь вопрос дней."
      - pl: " Zagraniczni dyplomaci zaczęli opuszczać polską stolicę, a niektórzy przenieśli się do Poznania."
        ru: "Иностранные дипломаты начали покидать польскую столицу, а некоторые переехали в Познань."
      - pl: " Wydawało się, że historia z czasów rozbiorów zaraz się powtórzy."
        ru: "Казалось, что история времён разделов вот-вот повторится."
