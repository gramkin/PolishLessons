  - clean: "W milczeniu też przeszli boczną uliczkę; i dopiero gdy wyszli na sąsiednią arterię, gdzie nawet w niedzielę panował jeszcze jakiś ruch, pan Utterson w końcu się odwrócił i spojrzał na towarzysza. Obaj byli bladzi; i w ich oczach odbijała się ta sama groza."
    en: "In silence, too, they traversed the by-street; and it was not until they had come into a neighbouring thoroughfare, where even upon a Sunday there were still some stirrings of life, that Mr. Utterson at last turned and looked at his companion. They were both pale; and there was an answering horror in their eyes."
    draft: true
    chunks:
