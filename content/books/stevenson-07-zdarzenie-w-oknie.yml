      - pl: " i zastąpiony wyrazem tak bezgranicznego przerażenia i rozpaczy,"
        ru: "и её сменило выражение такого беспредельного ужаса и отчаяния,"
      - pl: " że krew zastygła w żyłach obu dżentelmenów na dole."
        ru: "что кровь застыла в жилах у обоих джентльменов внизу."
      - pl: " Zobaczyli to tylko przez mgnienie oka, bo okno natychmiast zatrzaśnięto;"
        ru: "Они увидели это лишь на мгновение, потому что окно тут же захлопнули;"
        note: "mgnienie oka — мгновение ока; zatrzasnąć — захлопнуть"
      - pl: " ale to mgnienie wystarczyło;"
        ru: "но этого мгновения было довольно;"
