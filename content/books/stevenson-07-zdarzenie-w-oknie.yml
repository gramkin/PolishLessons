  - clean: "— Wobec tego — rzekł dobrodusznie adwokat — najlepiej będzie, jeśli zostaniemy tu na dole i porozmawiamy z tobą stąd."
    en: "“Why, then,” said the lawyer, good-naturedly, “the best thing we can do is to stay down here and speak with you from where we are.”"
