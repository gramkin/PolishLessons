        ru: "— Раз так, мы можем зайти во двор и взглянуть на окна."
        note: "rzucić okiem — взглянуть"
      - pl: " Prawdę mówiąc, niepokoję się o biednego Jekylla;"
        ru: "По правде говоря, я беспокоюсь о бедном Джекиле;"
      - pl: " i nawet z zewnątrz czuję, że obecność przyjaciela mogłaby mu dobrze zrobić."
        ru: "и мне кажется, что даже снаружи присутствие друга может пойти ему на пользу."
