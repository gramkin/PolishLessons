  - clean: "— Jesteś bardzo dobry — westchnął tamten. — Bardzo bym chciał; ale nie, nie, nie, to zupełnie niemożliwe; nie śmiem. Ale naprawdę, Uttersonie, bardzo się cieszę, że cię widzę; to dla mnie wielka przyjemność; zaprosiłbym ciebie i pana Enfielda na górę, ale miejsce doprawdy się nie nadaje."
    en: "“You are very good,” sighed the other. “I should like to very much; but no, no, no, it is quite impossible; I dare not. But indeed, Utterson, I am very glad to see you; this is really a great pleasure; I would ask you and Mr. Enfield up, but the place is really not fit.”"
    draft: true
    chunks:
