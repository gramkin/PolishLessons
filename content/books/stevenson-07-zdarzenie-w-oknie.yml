paragraphs:
  - clean: "Zdarzyło się w niedzielę, gdy pan Utterson był na swoim zwykłym spacerze z panem Enfieldem, że ich droga znów wiodła przez boczną uliczkę; i gdy znaleźli się naprzeciw drzwi, obaj przystanęli, żeby na nie popatrzeć."
    en: "It chanced on Sunday, when Mr. Utterson was on his usual walk with Mr. Enfield, that their way lay once again through the by-street; and that when they came in front of the door, both stopped to gaze on it."
    draft: true
    chunks:
      - pl: "Zdarzyło się w niedzielę, gdy pan Utterson był na swoim zwykłym spacerze z panem Enfieldem,"
        ru: "Случилось в воскресенье, когда мистер Аттерсон был на своей обычной прогулке с мистером Энфилдом,"
      - pl: " że ich droga znów wiodła przez boczną uliczkę;"
        ru: "что их путь снова лежал через тот переулок;"
      - pl: " i gdy znaleźli się naprzeciw drzwi, obaj przystanęli, żeby na nie popatrzeć."
        ru: "и когда они оказались напротив двери, оба остановились, чтобы на неё посмотреть."
        note: "przystanąć — приостановиться"
    words: { "Zdarzyło": zdarzyc, "niedzielę": niedziela, "zwykłym": zwykly, "spacerze": spacer, "drzwi": drzwi, "popatrzeć": popatrzec }
  - clean: "— No cóż — rzekł Enfield — ta historia przynajmniej się skończyła. Już nigdy nie zobaczymy pana Hyde'a."
    en: "“Well,” said Enfield, “that story’s at an end at least. We shall never see more of Mr. Hyde.”"
    draft: true
    chunks:
      - pl: "— No cóż — rzekł Enfield — ta historia przynajmniej się skończyła."
        ru: "— Ну что ж, — сказал Энфилд, — эта история по крайней мере закончилась."
      - pl: " Już nigdy nie zobaczymy pana Hyde'a."
        ru: "Мистера Хайда мы больше никогда не увидим."
    words: { "rzekł": rzec, "historia": historia, "skończyła": skonczyc, "nigdy": nigdy, "zobaczymy": zobaczyc, "pana": pan }
  - clean: "— Mam nadzieję — rzekł Utterson. — Czy mówiłem ci kiedyś, że raz go widziałem i podzieliłem twoje uczucie odrazy?"
    en: "“I hope not,” said Utterson. “Did I ever tell you that I once saw him, and shared your feeling of repulsion?”"
    draft: true
    chunks:
      - pl: "— Mam nadzieję — rzekł Utterson."
        ru: "— Надеюсь, — сказал Аттерсон."
      - pl: " — Czy mówiłem ci kiedyś, że raz go widziałem i podzieliłem twoje uczucie odrazy?"
        ru: "— Я тебе когда-нибудь говорил, что однажды видел его и разделил твоё чувство отвращения?"
        note: "odraza — отвращение"
    words: { "nadzieję": nadzieja, "rzekł": rzec, "mówiłem": mowic, "kiedyś": kiedys, "widziałem": widziec, "podzieliłem": podzielic }
  - clean: "— Nie dało się zrobić jednego bez drugiego — odparł Enfield. — A przy okazji, musiałeś mnie uważać za osła, że nie wiedziałem, że to tylne wejście do domu doktora Jekylla! Po części to twoja wina, że w ogóle się zorientowałem."
    en: "“It was impossible to do the one without the other,” returned Enfield. “And by the way, what an ass you must have thought me, not to know that this was a back way to Dr. Jekyll’s! It was partly your own fault that I found it out, even when I did.”"
    draft: true
    chunks:
      - pl: "— Nie dało się zrobić jednego bez drugiego — odparł Enfield."
        ru: "— Одно без другого было невозможно, — ответил Энфилд."
      - pl: " — A przy okazji, musiałeś mnie uważać za osła,"
        ru: "— Кстати, ты, верно, считал меня ослом"
      - pl: " że nie wiedziałem, że to tylne wejście do domu doktora Jekylla!"
