  - clean: "— Co takiego! Jekyll! Jekyll! — zawołał. — Mam nadzieję, że ci lepiej."
    en: "“What! Jekyll! Jekyll!” he cried. “I trust you are better.”"
    draft: true
    chunks:
      - pl: "— Co takiego! Jekyll! Jekyll! — zawołał. — Mam nadzieję, że ci lepiej."
        ru: "— Как! Джекил! Джекил! — воскликнул он. — Надеюсь, тебе лучше."
    words: { "takiego": taki, "zawołał": zawolac, "nadzieję": nadzieja, "lepiej": dobrze }
  - clean: "— Bardzo kiepsko ze mną, Uttersonie — odparł ponuro doktor — bardzo kiepsko. Nie potrwa to długo, dzięki Bogu."
    en: "“I am very low, Utterson,” replied the doctor drearily, “very low. It will not last long, thank God.”"
    draft: true
    chunks:
