        note: "tylne wejście — чёрный ход"
      - pl: " Po części to twoja wina, że w ogóle się zorientowałem."
        ru: "Отчасти ты сам виноват в том, что я вообще догадался."
        note: "zorientować się — догадаться, сообразить"
    words: { "odparł": odeprzec, "okazji": okazja, "osła": osiol, "tylne": tylny, "ogóle": ogol, "zorientowałem": zorientowac }
  - clean: "— A więc się zorientowałeś? — rzekł Utterson. — Skoro tak, możemy wejść na podwórze i rzucić okiem na okna. Prawdę mówiąc, niepokoję się o biednego Jekylla; i nawet z zewnątrz czuję, że obecność przyjaciela mogłaby mu dobrze zrobić."
    en: "“So you found it out, did you?” said Utterson. “But if that be so, we may step into the court and take a look at the windows. To tell you the truth, I am uneasy about poor Jekyll; and even outside, I feel as if the presence of a friend might do him good.”"
    draft: true
    chunks:
      - pl: "— A więc się zorientowałeś? — rzekł Utterson."
        ru: "— Так ты догадался? — сказал Аттерсон."
