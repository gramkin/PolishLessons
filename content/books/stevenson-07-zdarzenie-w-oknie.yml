  - clean: "— Właśnie to chciałem ośmielić się zaproponować — odparł doktor z uśmiechem. Ale ledwie wypowiedział te słowa, uśmiech został zmieciony z jego twarzy i zastąpiony wyrazem tak bezgranicznego przerażenia i rozpaczy, że krew zastygła w żyłach obu dżentelmenów na dole. Zobaczyli to tylko przez mgnienie oka, bo okno natychmiast zatrzaśnięto; ale to mgnienie wystarczyło; odwrócili się i bez słowa opuścili podwórze."
    en: "“That is just what I was about to venture to propose,” returned the doctor with a smile. But the words were hardly uttered, before the smile was struck out of his face and succeeded by an expression of such abject terror and despair, as froze the very blood of the two gentlemen below. They saw it but for a glimpse for the window was instantly thrust down; but that glimpse had been sufficient, and they turned and left the court without a word."
    draft: true
    chunks:
      - pl: "— Właśnie to chciałem ośmielić się zaproponować — odparł doktor z uśmiechem."
        ru: "— Именно это я и хотел осмелиться предложить, — ответил доктор с улыбкой."
        note: "ośmielić się — осмелиться"
      - pl: " Ale ledwie wypowiedział te słowa, uśmiech został zmieciony z jego twarzy"
