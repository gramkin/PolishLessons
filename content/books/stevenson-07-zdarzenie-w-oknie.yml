  - clean: "Na podwórzu było bardzo chłodno, trochę wilgotno i pełno przedwczesnego zmierzchu, choć niebo wysoko w górze wciąż jaśniało zachodem. Środkowe z trzech okien było do połowy otwarte; a tuż przy nim, oddychając świeżym powietrzem z nieskończonym smutkiem w obliczu, jak jakiś niepocieszony więzień, Utterson ujrzał doktora Jekylla."
    en: "The court was very cool and a little damp, and full of premature twilight, although the sky, high up overhead, was still bright with sunset. The middle one of the three windows was half-way open; and sitting close beside it, taking the air with an infinite sadness of mien, like some disconsolate prisoner, Utterson saw Dr. Jekyll."
    draft: true
    chunks:
      - pl: "Na podwórzu było bardzo chłodno, trochę wilgotno i pełno przedwczesnego zmierzchu,"
        ru: "Во дворе было очень прохладно, немного сыро и полно преждевременных сумерек,"
        note: "przedwczesny — преждевременный"
      - pl: " choć niebo wysoko w górze wciąż jaśniało zachodem."
        ru: "хотя небо высоко над головой ещё светилось закатом."
      - pl: " Środkowe z trzech okien było do połowy otwarte;"
