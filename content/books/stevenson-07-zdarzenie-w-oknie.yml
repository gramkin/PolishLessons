  - clean: "— Za dużo siedzisz w domu — rzekł adwokat. — Powinieneś wychodzić i rozruszać krążenie jak pan Enfield i ja. (To mój kuzyn, pan Enfield; doktor Jekyll.) No już; weź kapelusz i przejdź się z nami szybko."
    en: "“You stay too much indoors,” said the lawyer. “You should be out, whipping up the circulation like Mr. Enfield and me. (This is my cousin—Mr. Enfield—Dr. Jekyll.) Come now; get your hat and take a quick turn with us.”"
    draft: true
    chunks:
      - pl: "— Za dużo siedzisz w domu — rzekł adwokat."
