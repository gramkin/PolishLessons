# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 34
chapterTitle: "Pieśń XXXIV"
chapterTitleRu: "Песнь XXXIV. Люцифер"
level: B2
paragraphs:
  - clean: "(Krąg IX. 4. Judekka. Najwięksi zdrajcy: Judasz, Brutus, Kasjusz, Szatan. Powrót do światła.)"
    chunks:
      - pl: "(Krąg IX. 4. Judekka. Najwięksi zdrajcy: Judasz, Brutus, Kasjusz, Szatan. Powrót do światła.)"
        ru: "(Круг IX. 4. Джудекка. Величайшие предатели: Иуда, Брут, Кассий, Сатана. Возвращение к свету.)"
    words: { "Krąg": krag, "zdrajcy": zdrajca, "Szatan": szatan, "Powrót": powrot }
  - clean: "«*Vexilla regis prodeunt inferni*\nWprost ku nam! Jeśli widzisz za pomroką»\nMistrz mówił, «patrzaj, wytężaj twe oko».\nKiedy noc naszą półsferę zaczerni\nLub ciemny tuman przedmioty powleka,\nMyślim, że widzim młyn wietrzny z daleka;\nTak, zdało mi się, oko me postrzegło\nStojącą jakąś budowę odległą."
    verse: true
    chunks:
      - pl: "«*Vexilla regis prodeunt inferni*"
        ru: "«Близятся знамёна владыки ада —"
        note: "лат. «Vexilla regis prodeunt inferni», пародия на гимн"
      - pl: "\nWprost ku nam! Jeśli widzisz za pomroką»"
        ru: "прямо к нам! Если видишь сквозь сумрак, —"
        note: "pomroka — сумрак"
      - pl: "\nMistrz mówił, «patrzaj, wytężaj twe oko»."
        ru: "сказал учитель, — смотри, напрягай свой глаз»."
      - pl: "\nKiedy noc naszą półsferę zaczerni"
        ru: "Когда ночь зачернит наше полушарие"
        note: "zaczernić — зачернить"
      - pl: "\nLub ciemny tuman przedmioty powleka,"
        ru: "или тёмный туман окутывает предметы,"
        note: "powlekać — окутывать"
      - pl: "\nMyślim, że widzim młyn wietrzny z daleka;"
        ru: "мы думаем, что видим издали ветряную мельницу;"
      - pl: "\nTak, zdało mi się, oko me postrzegło"
        ru: "так, показалось мне, мой глаз заметил"
      - pl: "\nStojącą jakąś budowę odległą."
        ru: "какое-то стоящее далёкое строение."
    words: { "Mistrz": mistrz, "ciemny": ciemny, "przedmioty": przedmiot, "daleka": daleki, "budowę": budowa, "odległą": odlegly }
  - clean: "Wtenczas od wiatru szukając ochrony,\nStanąłem za mym wodzem, bo zasłony\nNie było innej; tam wśród wiecznej zimy,\nJuż byłem w miejscu, gdzie cienie widziałem,\nA co z przestrachem wpisuję w te rymy\nOblane lodem jak ździebło kryształem."
    verse: true
    chunks:
      - pl: "Wtenczas od wiatru szukając ochrony,"
        ru: "Тогда, ища защиты от ветра,"
      - pl: "\nStanąłem za mym wodzem, bo zasłony"
        ru: "я встал за моим вождём, ибо другого"
      - pl: "\nNie było innej; tam wśród wiecznej zimy,"
        ru: "заслона не было; там, среди вечной зимы,"
      - pl: "\nJuż byłem w miejscu, gdzie cienie widziałem,"
        ru: "я был уже в месте, где видел тени,"
      - pl: "\nA co z przestrachem wpisuję w te rymy"
        ru: "и что со страхом вписываю в эти рифмы, —"
      - pl: "\nOblane lodem jak ździebło kryształem."
        ru: "облитые льдом, как соломинка хрусталём."
        note: "ździebło — былинка, соломинка"
    words: { "wodzem": wodz, "zasłony": zaslona, "wiecznej": wieczny, "zimy": zima, "Oblane": oblac, "kryształem": krysztal }
  - clean: "Ten w lodach leży na wznak rozciągnięty.\nCi prosto stoją, drudzy wspak na głowie,\nTen łukiem twarz swą nagina do pięty.\nGdyśmy do tyla zaszli w to pustkowie,\nŻe już mojemu mistrzowi się zdało,\nPokazać szpetne, niegdyś piękne ciało,\nZwrócił się do mnie i mówił z powagą\n«Oto Lucyfer, oto krąg przeklęty!"
    verse: true
    chunks:
      - pl: "Ten w lodach leży na wznak rozciągnięty."
        ru: "Этот лежит во льдах, растянувшись навзничь,"
      - pl: "\nCi prosto stoją, drudzy wspak na głowie,"
        ru: "те стоят прямо, другие — вверх ногами,"
        note: "wspak — наоборот, вверх ногами"
      - pl: "\nTen łukiem twarz swą nagina do pięty."
        ru: "этот дугой сгибает лицо к пятке."
      - pl: "\nGdyśmy do tyla zaszli w to pustkowie,"
        ru: "Когда мы зашли так далеко в эту пустошь,"
      - pl: "\nŻe już mojemu mistrzowi się zdało,"
        ru: "что моему учителю уже показалось [время]"
      - pl: "\nPokazać szpetne, niegdyś piękne ciało,"
        ru: "показать безобразное, некогда прекрасное тело,"
      - pl: "\nZwrócił się do mnie i mówił z powagą"
        ru: "он обернулся ко мне и сказал с важностью:"
      - pl: "\n«Oto Lucyfer, oto krąg przeklęty!"
        ru: "«Вот Люцифер, вот проклятый круг!"
    words: { "łukiem": luk, "zaszli": zajsc, "zdało": zdac, "Zwrócił": zwrocic, "powagą": powaga, "przeklęty": przeklety }
  - clean: "Teraz się cały uzbrajaj odwagą».\nJakiem ja wtedy osłabnął i skolał,\nMój czytelniku, zamilczeć bym wolał,\nPod piórem moje zastygłoby słowo.\nJeśli najmniejszy masz kwiat wyobraźni,\nWyobraź sobie, jak dręczy i drażni\nStan, w jakim całą duszą się zawarłem,\nZda się, pół żyłem, na poły umarłem."
    verse: true
    chunks:
      - pl: "Teraz się cały uzbrajaj odwagą»."
        ru: "Теперь вооружайся вся отвагой»."
      - pl: "\nJakiem ja wtedy osłabnął i skolał,"
        ru: "Как я тогда ослабел и обмер,"
        note: "skoleć — окоченеть, обмереть"
      - pl: "\nMój czytelniku, zamilczeć bym wolał,"
        ru: "мой читатель, я предпочёл бы умолчать,"
      - pl: "\nPod piórem moje zastygłoby słowo."
        ru: "под пером застыло бы моё слово."
      - pl: "\nJeśli najmniejszy masz kwiat wyobraźni,"
        ru: "Если у тебя есть хоть малейший цвет воображения,"
      - pl: "\nWyobraź sobie, jak dręczy i drażni"
        ru: "представь себе, как мучит и терзает"
      - pl: "\nStan, w jakim całą duszą się zawarłem,"
        ru: "состояние, в которое я весь заключился душой:"
        note: "zawrzeć się — заключиться"
      - pl: "\nZda się, pół żyłem, na poły umarłem."
        ru: "кажется, наполовину я жил, наполовину умер."
    words: { "odwagą": odwaga, "piórem": pioro, "kwiat": kwiat, "wyobraźni": wyobraznia, "Wyobraź": wyobrazic, "zawarłem": zawrzec }
  - clean: "Król piekielnego państwa jakby kawał\nGłazu nad lody pół piersią wystawał;\nJak wzrost mój dosyć ogromny, nie kłamię,\nTak wielkie było jego jedno ramię.\nZważ, jaka całość mogła być niemała,\nZastosowana do tej części ciała."
    verse: true
    chunks:
      - pl: "Król piekielnego państwa jakby kawał"
        ru: "Король адского царства, как кусок"
      - pl: "\nGłazu nad lody pół piersią wystawał;"
        ru: "скалы, наполовину грудью выступал надо льдом;"
      - pl: "\nJak wzrost mój dosyć ogromny, nie kłamię,"
        ru: "как мой рост довольно огромен, не лгу,"
      - pl: "\nTak wielkie było jego jedno ramię."
        ru: "так велика была одна его рука."
        note: "то есть рост великана рядом с ним — как мой рядом с великаном"
      - pl: "\nZważ, jaka całość mogła być niemała,"
        ru: "Взвесь, каким немалым могло быть целое,"
      - pl: "\nZastosowana do tej części ciała."
        ru: "соразмерное с этой частью тела."
        note: "zastosowany — соразмерный"
    words: { "piekielnego": piekielny, "kawał": kawal, "piersią": piers, "wzrost": wzrost, "całość": calosc, "Zastosowana": zastosowac }
  - clean: "Jeśli tak piękny był, jak teraz szpetny,\nKiedy od Stwórcy odwrócił wzrok świetny,\nGrzew, wszelki zakał musi iść od niego.\nDziw! Głowa jego kształtu potwornego,\nNa trzech obliczach razem osadzona:\nPierwsza twarz była jako żar czerwona,\nDwie zaś policzkiem do pierwszej przypadły;\nObie na środku dwóch ramion usiadły,\nSchodząc się z sobą aż pod wierzchem głowy;\nOblicze prawe biało-żółtej barwy,\nJaką mieszkaniec dziwi nadnilowy."
    verse: true
    chunks:
      - pl: "Jeśli tak piękny był, jak teraz szpetny,"
        ru: "Если он был так прекрасен, как теперь безобразен,"
      - pl: "\nKiedy od Stwórcy odwrócił wzrok świetny,"
        ru: "когда отвратил от Творца свой сияющий взор,"
      - pl: "\nGrzew, wszelki zakał musi iść od niego."
        ru: "то, верно, всякое зло должно исходить от него."
        note: "zakał — порча, зло"
      - pl: "\nDziw! Głowa jego kształtu potwornego,"
        ru: "Чудо! Голова его чудовищного вида"
      - pl: "\nNa trzech obliczach razem osadzona:"
        ru: "насажена разом на три лица:"
      - pl: "\nPierwsza twarz była jako żar czerwona,"
        ru: "первое лицо было красным, как жар,"
      - pl: "\nDwie zaś policzkiem do pierwszej przypadły;"
        ru: "два же прилегли щекой к первому;"
      - pl: "\nObie na środku dwóch ramion usiadły,"
        ru: "оба сели над серединой двух плеч,"
      - pl: "\nSchodząc się z sobą aż pod wierzchem głowy;"
        ru: "сходясь друг с другом под самой макушкой;"
      - pl: "\nOblicze prawe biało-żółtej barwy,"
        ru: "правое лицо бело-жёлтого цвета,"
      - pl: "\nJaką mieszkaniec dziwi nadnilowy."
        ru: "каким удивляет житель приниловский,"
        note: "nadnilowy — живущий над Нилом"
    words: { "kształtu": ksztalt, "obliczach": oblicze, "policzkiem": policzek, "Schodząc": schodzic, "żółtej": zolty, "dziwi": dziwic }
  - clean: "Pod każdą twarzą tej potwornej larwy,\nJak z okrętowych żagli płachta jaka,\nW miarę wielkości tak dziwnego ptaka,\nSterczą dwa skrzydła, lecz bez piór, bez pierza,\nCałe skórzane jak u nietoperza.\nI nieustannym swych skrzydeł trzepotem\nWiał na trzy strony trzy wiatry z łoskotem,\nOd których marzły kocytowe lody."
    verse: true
    chunks:
      - pl: "Pod każdą twarzą tej potwornej larwy,"
        ru: "под каждым лицом этой чудовищной личины,"
        note: "larwa — личина, призрак"
      - pl: "\nJak z okrętowych żagli płachta jaka,"
        ru: "как полотнище корабельных парусов,"
        note: "płachta — полотнище"
      - pl: "\nW miarę wielkości tak dziwnego ptaka,"
        ru: "по мере величины столь странной птицы,"
      - pl: "\nSterczą dwa skrzydła, lecz bez piór, bez pierza,"
        ru: "торчат два крыла, но без перьев, без пера,"
      - pl: "\nCałe skórzane jak u nietoperza."
        ru: "все кожаные, как у летучей мыши."
        note: "nietoperz — летучая мышь"
      - pl: "\nI nieustannym swych skrzydeł trzepotem"
        ru: "И непрестанным трепетом своих крыльев"
        note: "trzepot — трепетание"
      - pl: "\nWiał na trzy strony trzy wiatry z łoskotem,"
        ru: "веял на три стороны три ветра с грохотом,"
      - pl: "\nOd których marzły kocytowe lody."
        ru: "от которых замерзали льды Коцита."
    words: { "twarzą": twarz, "miarę": miara, "wielkości": wielkosc, "ptaka": ptak, "skrzydła": skrzydlo, "wiatry": wiatr }
  - clean: "Sześcioro oczu miał, z tych każde oko\nNie łzami, krwawą płakało posoką,\nKtóra spływała jak łza na trzy brody.\nI trzech grzeszników przeżuwał jak zwierze,\nKażdego żuła osobna paszczęka,\nJako cierlica drze lniane paździerze."
    verse: true
    chunks:
      - pl: "Sześcioro oczu miał, z tych każde oko"
        ru: "Шесть глаз было у него, и каждый глаз"
      - pl: "\nNie łzami, krwawą płakało posoką,"
        ru: "плакал не слезами, а кровью,"
      - pl: "\nKtóra spływała jak łza na trzy brody."
        ru: "что стекала, как слеза, на три подбородка."
      - pl: "\nI trzech grzeszników przeżuwał jak zwierze,"
        ru: "И троих грешников он жевал, как зверь,"
        note: "przeżuwać — пережёвывать"
      - pl: "\nKażdego żuła osobna paszczęka,"
        ru: "каждого жевала отдельная челюсть,"
      - pl: "\nJako cierlica drze lniane paździerze."
        ru: "как трепалка рвёт льняную костру."
        note: "cierlica — мялка для льна"
    words: { "każde": kazdy, "łzami": lza, "krwawą": krwawy, "płakało": plakac, "zwierze": zwierz, "osobna": osobny }
  - clean: "Lecz ząb łagodniej kąsał porównany\nZ szponami, jakie zadawały rany,\nZdało się, skóra aż do kości pęka.\n«Duch, co największe bodaj cierpi męki.\nKtórego wewnątrz czarnej paszczy głowa,\nA sam na zewnątrz jej nogami miota»\nMistrz mówił, «oto Judasz Iskariota!"
    verse: true
    chunks:
      - pl: "Lecz ząb łagodniej kąsał porównany"
        ru: "Но зуб кусал мягче в сравнении"
      - pl: "\nZ szponami, jakie zadawały rany,"
        ru: "с когтями, что наносили раны,"
      - pl: "\nZdało się, skóra aż do kości pęka."
        ru: "казалось, кожа лопается до самых костей."
      - pl: "\n«Duch, co największe bodaj cierpi męki."
        ru: "«Дух, что терпит, пожалуй, величайшие муки,"
      - pl: "\nKtórego wewnątrz czarnej paszczy głowa,"
        ru: "у которого голова внутри чёрной пасти,"
      - pl: "\nA sam na zewnątrz jej nogami miota»"
        ru: "а сам снаружи мечется ногами, —"
      - pl: "\nMistrz mówił, «oto Judasz Iskariota!"
        ru: "сказал учитель, — вот Иуда Искариот!"
    words: { "porównany": porownac, "zadawały": zadawac, "skóra": skora, "Duch": duch, "cierpi": cierpiec, "nogami": noga }
  - clean: "Dwaj, co głowami zwisają z paszczęki,\nPierwszy to Brutus! choć ból rzeczywisty\nSzarpie go, jednak milczy jak niemowa;\nDrugi, patrz dobrze, to Kasjusz barczysty.\nNoc już powraca, teraz czas iść dalej,\nBośmy już w piekle wszystko oglądali»."
    verse: true
    chunks:
      - pl: "Dwaj, co głowami zwisają z paszczęki,"
        ru: "Двое, что свисают головами из пасти:"
      - pl: "\nPierwszy to Brutus! choć ból rzeczywisty"
        ru: "первый — это Брут! хоть настоящая боль"
      - pl: "\nSzarpie go, jednak milczy jak niemowa;"
        ru: "терзает его, однако молчит, как немой;"
      - pl: "\nDrugi, patrz dobrze, to Kasjusz barczysty."
        ru: "второй, смотри хорошенько, это плечистый Кассий."
        note: "barczysty — плечистый"
      - pl: "\nNoc już powraca, teraz czas iść dalej,"
        ru: "Ночь уже возвращается, теперь пора идти дальше,"
      - pl: "\nBośmy już w piekle wszystko oglądali»."
        ru: "ибо мы уже всё в аду осмотрели»."
    words: { "głowami": glowa, "milczy": milczec, "Drugi": drugi, "patrz": patrzec, "piekle": pieklo, "oglądali": ogladac }
  - clean: "Jak chciał, jam jemu na szyi zawisnął.\nW chwili, gdy potwór swe skrzydła roztacza,\nSzybki jak piorun, co już spadł, nim błysnął.\nMistrz się uczepił do boków kudłacza,\nZ kudłów na kudły śliznął się pięściami,\nMiędzy ich runem spadał a lodami."
    verse: true
    chunks:
      - pl: "Jak chciał, jam jemu na szyi zawisnął."
        ru: "Как он хотел, я повис у него на шее."
      - pl: "\nW chwili, gdy potwór swe skrzydła roztacza,"
        ru: "В тот миг, когда чудовище раскидывает свои крылья,"
      - pl: "\nSzybki jak piorun, co już spadł, nim błysnął."
        ru: "быстрый, как молния, что уже упала, прежде чем блеснула,"
      - pl: "\nMistrz się uczepił do boków kudłacza,"
        ru: "учитель уцепился за бока косматого,"
        note: "kudłacz — косматый"
      - pl: "\nZ kudłów na kudły śliznął się pięściami,"
        ru: "с клока на клок соскальзывал кулаками,"
        note: "kudły — космы, шерсть"
      - pl: "\nMiędzy ich runem spadał a lodami."
        ru: "спускался между его шерстью и льдами."
        note: "runo — руно, шерсть"
    words: { "szyi": szyja, "piorun": piorun, "spadł": spasc, "boków": bok, "pięściami": piesc, "spadał": spadac }
  - clean: "Gdyśmy już doszli do miejsca, o cudo!\nTam, gdzie pod biodra rozszerza się udo,\nMój wódz, jak gdyby wpadł na fortel nowy,\nGdzie były nogi, przewrócił wierzch głowy,\nPiął się po kudłach, aż trzęsły mną dreszcze,\nMyśląc, że nazad idę w piekło jeszcze."
    verse: true
    chunks:
      - pl: "Gdyśmy już doszli do miejsca, o cudo!"
        ru: "Когда мы уже дошли до места, о чудо!"
      - pl: "\nTam, gdzie pod biodra rozszerza się udo,"
        ru: "там, где под бёдрами расширяется ляжка,"
        note: "udo — бедро, ляжка"
      - pl: "\nMój wódz, jak gdyby wpadł na fortel nowy,"
        ru: "мой вождь, словно напав на новую уловку,"
        note: "fortel — уловка"
      - pl: "\nGdzie były nogi, przewrócił wierzch głowy,"
        ru: "повернул голову туда, где были ноги,"
      - pl: "\nPiął się po kudłach, aż trzęsły mną dreszcze,"
        ru: "карабкался по шерсти, так что меня трясла дрожь,"
        note: "piąć się — карабкаться"
      - pl: "\nMyśląc, że nazad idę w piekło jeszcze."
