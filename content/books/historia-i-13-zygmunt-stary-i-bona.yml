      - pl: " Pochodziła z rodu książąt Mediolanu, wychowywała się w Neapolu i Bari i otrzymała staranne renesansowe wykształcenie."
        ru: "Она происходила из рода герцогов Милана, росла в Неаполе и Бари и получила тщательное ренессансное образование."
