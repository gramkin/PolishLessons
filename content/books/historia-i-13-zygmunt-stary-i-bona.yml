  - clean: "Jego następca, Aleksander, był wcześniej wielkim księciem litewskim i większość panowania spędził w Wilnie. Za jego rządów sejm w Radomiu uchwalił konstytucję „Nihil novi”, o której była mowa w poprzednim rozdziale. Litwa toczyła w tym czasie ciężkie wojny z Moskwą. Iwan III, który nazywał się władcą całej Rusi, odebrał jej rozległe ziemie nad górną Oką i Desną, z Czernihowem i Briańskiem. Aleksander zmarł w 1506 roku, w dniu, w którym jego wojska odniosły wielkie zwycięstwo nad Tatarami pod Kleckiem."
    draft: true
    chunks:
      - pl: "Jego następca, Aleksander, był wcześniej wielkim księciem litewskim i większość panowania spędził w Wilnie."
        ru: "Его преемник, Александр, прежде был великим князем литовским и бо́льшую часть правления провёл в Вильно."
      - pl: " Za jego rządów sejm w Radomiu uchwalił konstytucję „Nihil novi”, o której była mowa w poprzednim rozdziale."
        ru: "В его правление сейм в Радоме принял конституцию «Nihil novi», о которой шла речь в предыдущей главе."
      - pl: " Litwa toczyła w tym czasie ciężkie wojny z Moskwą."
        ru: "Литва вела в это время тяжёлые войны с Москвой."
      - pl: " Iwan III, który nazywał się władcą całej Rusi, odebrał jej rozległe ziemie nad górną Oką i Desną, z Czernihowem i Briańskiem."
        ru: "Иван III, называвший себя государем всея Руси, отнял у неё обширные земли на верхней Оке и Десне, с Черниговом и Брянском."
        note: "rozległy — обширный"
      - pl: " Aleksander zmarł w 1506 roku, w dniu, w którym jego wojska odniosły wielkie zwycięstwo nad Tatarami pod Kleckiem."
        ru: "Александр умер в 1506 году, в тот самый день, когда его войска одержали большую победу над татарами под Клецком."
    words: { "następca": nastepca, "rozdziale": rozdzial, "toczyła": toczyc, "władcą": wladca, "górną": gorny, "wojska": wojsko, "odniosły": odniesc, "zwycięstwo": zwyciestwo }
  - clean: "Tron objął najmłodszy z braci, Zygmunt, któremu potomni nadali przydomek Stary, żeby odróżnić go od syna. Miał wtedy prawie czterdzieści lat i za sobą długie lata, w których jako młodszy syn bez ziemi czekał na swoją szansę. Był wysoki i bardzo silny, podobno łamał w palcach podkowy, ale przede wszystkim był rozważny, spokojny i pracowity. Rządził ponad czterdzieści lat, od 1506 do 1548 roku. Jego panowanie i panowanie jego syna nazywamy złotym wiekiem Polski."
    draft: true
    chunks:
      - pl: "Tron objął najmłodszy z braci, Zygmunt, któremu potomni nadali przydomek Stary, żeby odróżnić go od syna."
        ru: "Престол занял младший из братьев, Сигизмунд, которому потомки дали прозвище Старый, чтобы отличать его от сына."
        note: "odróżnić — отличить"
      - pl: " Miał wtedy prawie czterdzieści lat i za sobą długie lata, w których jako młodszy syn bez ziemi czekał na swoją szansę."
        ru: "Ему было тогда почти сорок лет, и за плечами у него были долгие годы, когда он, младший сын без удела, ждал своего шанса."
      - pl: " Był wysoki i bardzo silny, podobno łamał w palcach podkowy, ale przede wszystkim był rozważny, spokojny i pracowity."
        ru: "Он был высок и очень силён, говорят, гнул пальцами подковы, но прежде всего был рассудителен, спокоен и трудолюбив."
        note: "podkowa — подкова; rozważny — рассудительный; pracowity — трудолюбивый"
      - pl: " Rządził ponad czterdzieści lat, od 1506 do 1548 roku."
        ru: "Он правил больше сорока лет, с 1506 по 1548 год."
      - pl: " Jego panowanie i panowanie jego syna nazywamy złotym wiekiem Polski."
        ru: "Его правление и правление его сына мы называем золотым веком Польши."
    words: { "objął": objac, "nadali": nadac, "czterdzieści": czterdziesci, "łamał": lamac, "spokojny": spokojny, "Rządził": rzadzic }
  - clean: "Pierwsze lata nie zapowiadały jednak złotego wieku. Wojna z Moskwą trwała dalej, a jej głównym celem stał się Smoleńsk, potężna twierdza nad Dnieprem, od ponad stu lat należąca do Litwy. Latem 1514 roku wielki książę moskiewski Wasyl III, syn Iwana, po raz trzeci oblegał Smoleńsk i tym razem miasto się poddało. Zaledwie kilka tygodni później, 8 września 1514 roku, wojska polsko-litewskie pod wodzą hetmana Konstantego Ostrogskiego rozbiły armię moskiewską pod Orszą. Ostrogski był ruskim księciem i gorliwym prawosławnym, co pokazuje, jak złożone były wtedy lojalności. Zwycięstwo było wspaniałe, ale Smoleńska nie odzyskano. Miasto pozostało przy Moskwie na prawie sto lat."
    draft: true
    chunks:
      - pl: "Pierwsze lata nie zapowiadały jednak złotego wieku."
        ru: "Однако первые годы не предвещали золотого века."
        note: "zapowiadać — предвещать"
      - pl: " Wojna z Moskwą trwała dalej, a jej głównym celem stał się Smoleńsk, potężna twierdza nad Dnieprem, od ponad stu lat należąca do Litwy."
        ru: "Война с Москвой продолжалась, и её главной целью стал Смоленск — мощная крепость на Днепре, больше ста лет принадлежавшая Литве."
      - pl: " Latem 1514 roku wielki książę moskiewski Wasyl III, syn Iwana, po raz trzeci oblegał Smoleńsk i tym razem miasto się poddało."
        ru: "Летом 1514 года великий князь московский Василий III, сын Ивана, в третий раз осадил Смоленск, и на этот раз город сдался."
      - pl: " Zaledwie kilka tygodni później, 8 września 1514 roku, wojska polsko-litewskie pod wodzą hetmana Konstantego Ostrogskiego rozbiły armię moskiewską pod Orszą."
        ru: "Всего через несколько недель, 8 сентября 1514 года, польско-литовские войска под командованием гетмана Константина Острожского разбили московскую армию под Оршей."
        note: "hetman — гетман, главнокомандующий"
      - pl: " Ostrogski był ruskim księciem i gorliwym prawosławnym, co pokazuje, jak złożone były wtedy lojalności."
        ru: "Острожский был русским князем и ревностным православным, что показывает, насколько сложными были тогда лояльности."
        note: "gorliwy — ревностный; złożony — сложный"
      - pl: " Zwycięstwo było wspaniałe, ale Smoleńska nie odzyskano."
        ru: "Победа была блестящей, но Смоленск вернуть не удалось."
      - pl: " Miasto pozostało przy Moskwie na prawie sto lat."
        ru: "Город остался за Москвой почти на сто лет."
    words: { "wojska": wojsko, "potężna": potezny, "Zaledwie": zaledwie, "września": wrzesien, "rozbiły": rozbic, "lojalności": lojalnosc }
  - clean: "Z tą chwilą wiąże się słynny obraz Jana Matejki „Stańczyk”. Przedstawia on królewskiego błazna, który siedzi samotnie w ciemnej komnacie, podczas gdy w sąsiedniej sali dwór beztrosko bawi się na balu. Na stole leży list z wiadomością o utracie Smoleńska. Błazen jako jedyny rozumie, co ta strata oznacza dla państwa. Stańczyk stał się w polskiej kulturze symbolem mądrego człowieka, który widzi więcej niż możni tego świata."
    draft: true
    chunks:
      - pl: "Z tą chwilą wiąże się słynny obraz Jana Matejki „Stańczyk”."
        ru: "С этим моментом связана знаменитая картина Яна Матейко «Станчик»."
      - pl: " Przedstawia on królewskiego błazna, który siedzi samotnie w ciemnej komnacie, podczas gdy w sąsiedniej sali dwór beztrosko bawi się na balu."
        ru: "На ней изображён королевский шут, который сидит в одиночестве в тёмной комнате, тогда как в соседнем зале двор беззаботно веселится на балу."
        note: "błazen — шут; komnata — покой, палата; beztrosko — беззаботно"
      - pl: " Na stole leży list z wiadomością o utracie Smoleńska."
        ru: "На столе лежит письмо с известием о потере Смоленска."
        note: "utrata — потеря"
      - pl: " Błazen jako jedyny rozumie, co ta strata oznacza dla państwa."
        ru: "Шут — единственный, кто понимает, что эта потеря значит для государства."
      - pl: " Stańczyk stał się w polskiej kulturze symbolem mądrego człowieka, który widzi więcej niż możni tego świata."
        ru: "Станчик стал в польской культуре символом мудрого человека, который видит больше, чем сильные мира сего."
    words: { "wiąże": wiazac, "słynny": slynny, "Przedstawia": przedstawiac, "królewskiego": krolewski, "samotnie": samotnie, "komnacie": komnata, "dwór": dwor, "balu": bal, "utracie": utrata, "polskiej": polski, "kulturze": kultura, "symbolem": symbol }
  - clean: "Zygmunt musiał też uważać na zachodzie. Cesarz Maksymilian Habsburg wspierał Moskwę i zakon krzyżacki przeciw Polsce. W 1515 roku Zygmunt i jego brat Władysław, król Czech i Węgier, spotkali się z cesarzem w Wiedniu. Cesarz przestał wspierać wrogów Polski, a w zamian Jagiellonowie zgodzili się na podwójne małżeństwo dzieci Władysława z wnukami Maksymiliana. Umowa przewidywała, że jeśli męska linia Jagiellonów w Czechach i na Węgrzech wygaśnie, ich trony przejdą na Habsburgów. Nikt nie przypuszczał, jak szybko to nastąpi."
    draft: true
    chunks:
      - pl: "Zygmunt musiał też uważać na zachodzie."
        ru: "Сигизмунду приходилось быть осторожным и на западе."
      - pl: " Cesarz Maksymilian Habsburg wspierał Moskwę i zakon krzyżacki przeciw Polsce."
        ru: "Император Максимилиан Габсбург поддерживал Москву и Тевтонский орден против Польши."
      - pl: " W 1515 roku Zygmunt i jego brat Władysław, król Czech i Węgier, spotkali się z cesarzem w Wiedniu."
        ru: "В 1515 году Сигизмунд и его брат Владислав, король Чехии и Венгрии, встретились с императором в Вене."
      - pl: " Cesarz przestał wspierać wrogów Polski, a w zamian Jagiellonowie zgodzili się na podwójne małżeństwo dzieci Władysława z wnukami Maksymiliana."
        ru: "Император перестал поддерживать врагов Польши, а взамен Ягеллоны согласились на двойной брак детей Владислава с внуками Максимилиана."
        note: "podwójny — двойной"
      - pl: " Umowa przewidywała, że jeśli męska linia Jagiellonów w Czechach i na Węgrzech wygaśnie, ich trony przejdą na Habsburgów."
        ru: "Договор предусматривал, что если мужская линия Ягеллонов в Чехии и Венгрии пресечётся, их престолы перейдут к Габсбургам."
        note: "wygasnąć — угаснуть, пресечься"
      - pl: " Nikt nie przypuszczał, jak szybko to nastąpi."
        ru: "Никто не предполагал, как скоро это случится."
