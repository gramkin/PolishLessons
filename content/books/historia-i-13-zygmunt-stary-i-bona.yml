  - clean: "Zygmunt Stary zmarł 1 kwietnia 1548 roku, mając osiemdziesiąt jeden lat. Spoczął w swojej pięknej kaplicy na Wawelu. Bona nie potrafiła ułożyć sobie relacji z synem, zwłaszcza po tym, jak potajemnie poślubił kobietę, której nie akceptowała. W 1556 roku wyjechała do swojego księstwa Bari, zabierając ze sobą ogromny majątek. Pożyczyła dużą sumę królowi Hiszpanii Filipowi II, a rok później zmarła, otruta przez własnego dworzanina, który najprawdopodobniej działał na zlecenie Hiszpanów. Pożyczonych pieniędzy, nazywanych sumami neapolitańskimi, Polska próbowała odzyskać przez prawie dwieście lat, bez skutku."
