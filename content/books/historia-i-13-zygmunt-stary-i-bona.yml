  - clean: "Szlachta tymczasem coraz pewniej czuła się w państwie i coraz chętniej krytykowała króla. Szczególnie nie podobała jej się Bona, która, jak mówiono, rządziła mężem. W 1537 roku szlachta zebrana pod Lwowem na pospolite ruszenie, zamiast iść na wojnę z Mołdawią, zorganizowała rokosz, czyli zbrojny protest przeciw królowi. Domagała się ograniczenia władzy króla i królowej i potwierdzenia swoich praw. Przez kilka tygodni obozujący szlachcice kłócili się i jedli wszystko, co znaleźli w okolicy. Podobno zjedli wszystkie kury w okolicy, dlatego ten rokosz przeszedł do historii pod drwiącą nazwą wojny kokoszej. Skończył się kompromisem, ale pokazał, jak silna stała się szlachta."
