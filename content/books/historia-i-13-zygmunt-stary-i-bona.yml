  - clean: "W 1518 roku Zygmunt, wdowiec po pierwszej żonie, poślubił włoską księżniczkę Bonę Sforzę. Pochodziła z rodu książąt Mediolanu, wychowywała się w Neapolu i Bari i otrzymała staranne renesansowe wykształcenie. Znała łacinę, prawo, muzykę i matematykę, a przede wszystkim znała się na polityce i pieniądzach. Do Krakowa przyjechała z wielkim orszakiem Włochów: dworzan, artystów, lekarzy i kucharzy. Była o dwadzieścia siedem lat młodsza od męża i miała zupełnie inny temperament."
