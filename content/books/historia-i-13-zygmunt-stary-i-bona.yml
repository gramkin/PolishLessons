  - clean: "Bona była energiczna, ambitna i bezwzględna. Szybko zrozumiała, że król, który chce mieć realną władzę, musi mieć własne pieniądze, niezależne od sejmu. Wykupywała zastawione królewskie dobra, zakładała folwarki i nowe wsie, budowała młyny i stawy. Na Litwie i Mazowszu przeprowadziła reformę rolną: pomierzyła ziemię na równe działki, zwane włókami, i ustaliła stałe powinności chłopów. Reformę tę dokończył później jej syn i zmieniła ona wygląd litewskiej wsi na stulecia."
    draft: true
    chunks:
      - pl: "Bona była energiczna, ambitna i bezwzględna."
        ru: "Бона была энергичной, честолюбивой и беспощадной."
        note: "bezwzględny — беспощадный, жёсткий"
