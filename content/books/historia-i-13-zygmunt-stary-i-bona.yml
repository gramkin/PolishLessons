  - clean: "W 1526 roku młody syn Władysława, król Ludwik, zginął w bitwie z Turkami pod Mohaczem. Utonął w bagnistym strumieniu, uciekając z pola bitwy, w ciężkiej zbroi. Miał dwadzieścia lat i nie zostawił dzieci. Czechy i Węgry przeszły pod władzę Habsburgów, którzy rządzili nimi aż do 1918 roku. Większa część Węgier dostała się jednak na półtora wieku pod panowanie tureckie. Polska zyskała u swoich południowych granic potężnego sąsiada, z którym przez następne wieki musiała się liczyć."
    draft: true
    chunks:
      - pl: "W 1526 roku młody syn Władysława, król Ludwik, zginął w bitwie z Turkami pod Mohaczem."
        ru: "В 1526 году юный сын Владислава, король Людовик, погиб в битве с турками при Мохаче."
      - pl: " Utonął w bagnistym strumieniu, uciekając z pola bitwy, w ciężkiej zbroi."
        ru: "Он утонул в болотистом ручье, спасаясь с поля битвы в тяжёлых доспехах."
      - pl: " Miał dwadzieścia lat i nie zostawił dzieci."
        ru: "Ему было двадцать лет, и он не оставил детей."
      - pl: " Czechy i Węgry przeszły pod władzę Habsburgów, którzy rządzili nimi aż do 1918 roku."
        ru: "Чехия и Венгрия перешли под власть Габсбургов, которые правили ими вплоть до 1918 года."
      - pl: " Większa część Węgier dostała się jednak na półtora wieku pod panowanie tureckie."
        ru: "Однако бо́льшая часть Венгрии на полтора века попала под турецкое владычество."
      - pl: " Polska zyskała u swoich południowych granic potężnego sąsiada, z którym przez następne wieki musiała się liczyć."
        ru: "У южных границ Польши появился могущественный сосед, с которым ей в последующие века приходилось считаться."
