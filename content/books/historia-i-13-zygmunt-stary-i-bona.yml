paragraphs:
  - clean: "Po śmierci Kazimierza Jagiellończyka w 1492 roku tron polski objęli kolejno trzej jego synowie. Pierwszy z nich, Jan Olbracht, był ambitny i porywczy. W 1497 roku poprowadził wielką wyprawę na Mołdawię, kraj położony nad dolnym Dniestrem, który chciał uczynić księstwem dla swojego brata. Wyprawa skończyła się klęską: w lasach Bukowiny Mołdawianie zastawili zasadzkę na wycofującą się armię i zadali jej ogromne straty. Długo potem powtarzano gorzkie powiedzenie: „Za króla Olbrachta wyginęła szlachta”."
    draft: true
    chunks:
      - pl: "Po śmierci Kazimierza Jagiellończyka w 1492 roku tron polski objęli kolejno trzej jego synowie."
        ru: "После смерти Казимира Ягеллончика в 1492 году польский престол поочерёдно занимали трое его сыновей."
        note: "kolejno — поочерёдно"
      - pl: " Pierwszy z nich, Jan Olbracht, był ambitny i porywczy."
        ru: "Первый из них, Ян Ольбрахт, был честолюбив и вспыльчив."
        note: "porywczy — вспыльчивый, порывистый"
      - pl: " W 1497 roku poprowadził wielką wyprawę na Mołdawię, kraj położony nad dolnym Dniestrem, który chciał uczynić księstwem dla swojego brata."
        ru: "В 1497 году он повёл большой поход на Молдавию, страну на нижнем Днестре, которую хотел сделать княжеством для своего брата."
      - pl: " Wyprawa skończyła się klęską: w lasach Bukowiny Mołdawianie zastawili zasadzkę na wycofującą się armię i zadali jej ogromne straty."
        ru: "Поход закончился разгромом: в лесах Буковины молдаване устроили засаду на отступавшую армию и нанесли ей огромные потери."
        note: "zastawić zasadzkę — устроить засаду"
      - pl: " Długo potem powtarzano gorzkie powiedzenie: „Za króla Olbrachta wyginęła szlachta”."
        ru: "Ещё долго повторяли горькую поговорку: «При короле Ольбрахте погибла шляхта»."
        note: "wyginąć — погибнуть (во множестве)"
