# review
title: Czarny Piotr
titleRu: Чёрный Питер
author: Arthur Conan Doyle
translator: "tłumacz nieznany"
source:
  name: "Wolne Lektury (Arthur Conan Doyle, «Tajemnica oblubienicy i inne nowele», Gebethner i Wolf 1905); сверено с оригиналом (Project Gutenberg)"
  url: https://wolnelektury.pl/katalog/lektura/doyle-czarny-piotr/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 1
chapterTitle: "Harpun"
chapterTitleRu: "Гарпун"
level: B2
paragraphs:
  - clean: "Nigdy nie widziałem Sherlocka Holmesa w takiej pełni sił umysłowych i fizycznych, w takim rozkwicie, jak wtedy, gdy przypatrywałem mu się w roku 1895. Jego sława wzrastała z dnia na dzień, a za nią szła olbrzymia, ciągle rosnąca praktyka."
    en: "I have never known my friend to be in better form, both mental and physical, than in the year ’95."
    chunks:
      - pl: "Nigdy nie widziałem Sherlocka Holmesa"
        ru: "Никогда я не видел Шерлока Холмса"
      - pl: " w takiej pełni sił umysłowych i fizycznych,"
        ru: "в такой полноте умственных и физических сил,"
        note: "w pełni sił — в расцвете сил, полный сил"
      - pl: " w takim rozkwicie,"
        ru: "в таком расцвете,"
      - pl: " jak wtedy, gdy przypatrywałem mu się w roku 1895."
        ru: "как тогда, когда я наблюдал за ним в 1895 году."
        note: "przypatrywać się komuś — присматриваться к кому-л.: дательный падеж"
      - pl: " Jego sława wzrastała z dnia na dzień,"
        ru: "Его слава росла день ото дня,"
        note: "z dnia na dzień — день ото дня"
      - pl: " a za nią szła olbrzymia, ciągle rosnąca praktyka."
        ru: "а вслед за ней шла огромная, постоянно растущая практика."
        note: "rosnąca — причастие от rosnąć «расти»"
    words: { "fizycznych": fizyczny, "sława": slawa, "olbrzymia": olbrzymi, "ciągle": ciagle, "rosnąca": rosnac, "praktyka": praktyka }
  - clean: "Naraziłbym się na słuszny zarzut niedyskrecji, gdybym wymienił lub choćby tylko pozwolił domyślać się nazwisk klientów, którzy przestępowali skromne progi naszego mieszkanka przy Baker Street. Mimo tego powodzenia Holmes żył, jak każdy wielki artysta, wyłącznie dla swej sztuki. O ile wiem, rzadko żądał wysokiego wynagrodzenia; wyjątkiem były znane poszukiwania syna księcia Holdernesse. Poza tym cena nigdy nie pozostawała w proporcji do bezinteresownych usług, które Holmes oddawał swoją wiedzą i sprytem."
    en: "His increasing fame had brought with it an immense practice, and I should be guilty of an indiscretion if I were even to hint at the identity of some of the illustrious clients who crossed our humble threshold in Baker Street. Holmes, however, like all great artists, lived for his art’s sake, and, save in the case of the Duke of Holdernesse, I have seldom known him claim any large reward for his inestimable services."
    draft: true
    chunks:
      - pl: "Naraziłbym się na słuszny zarzut niedyskrecji,"
        ru: "Я навлёк бы на себя справедливый упрёк в нескромности,"
        note: "narazić się na coś — навлечь на себя что-л.; zarzut — упрёк, обвинение"
      - pl: " gdybym wymienił"
        ru: "если бы назвал"
        note: "wymienić — здесь «назвать, перечислить», а не «обменять»"
      - pl: " lub choćby tylko pozwolił domyślać się nazwisk klientów,"
        ru: "или хотя бы позволил догадаться о фамилиях клиентов,"
        note: "domyślać się czegoś — догадываться о чём-л.: родительный; nazwisko — фамилия, не «название»"
      - pl: " którzy przestępowali skromne progi naszego mieszkanka przy Baker Street."
        ru: "которые переступали скромный порог нашей квартирки на Бейкер-стрит."
        note: "przestępować próg — переступать порог; mieszkanko — уменьшительное от mieszkanie"
      - pl: " Mimo tego powodzenia"
        ru: "Несмотря на этот успех"
        note: "mimo + родительный — несмотря на; powodzenie — успех, удача"
      - pl: " Holmes żył, jak każdy wielki artysta,"
        ru: "Холмс жил, как всякий великий художник,"
      - pl: " wyłącznie dla swej sztuki."
        ru: "исключительно ради своего искусства."
        note: "swej — краткая книжная форма swojej"
      - pl: " O ile wiem,"
        ru: "Насколько я знаю,"
        note: "o ile wiem — насколько я знаю"
      - pl: " rzadko żądał wysokiego wynagrodzenia;"
        ru: "он редко требовал высокого вознаграждения;"
        note: "żądać czegoś — требовать чего-л.: родительный"
      - pl: " wyjątkiem były znane poszukiwania syna księcia Holdernesse."
        ru: "исключением были известные поиски сына герцога Холдернесса."
        note: "wyjątek — исключение; książę — и «князь», и «герцог»"
      - pl: " Poza tym cena nigdy nie pozostawała w proporcji"
        ru: "В остальном плата никогда не была соразмерна"
        note: "poza tym — кроме того, в остальном"
      - pl: " do bezinteresownych usług,"
        ru: "бескорыстным услугам,"
      - pl: " które Holmes oddawał swoją wiedzą i sprytem."
        ru: "которые Холмс оказывал своим знанием и хитроумием."
        note: "oddawać usługi — оказывать услуги; spryt — смекалка, ловкость"
    words: { "Naraziłbym": narazic, "skromne": skromny, "progi": prog, "rzadko": rzadko, "usług": usluga }
  - clean: "Zresztą, nawet w przyjmowaniu propozycji kierowała Holmesem artystyczna wybredność. Nieraz odmawiał pomocy ludziom możnym i bogatym, jeżeli kwestia, o którą szło, nie wydawała mu się interesująca, a przypadek sam w sobie mógłby być rozwiązany przez zwykłego agenta policji. Nieraz znowu całe tygodnie poświęcał bezinteresownie sprawom ludzi biednych, jeżeli trafił na godne siebie i prawdziwie ciekawe zadanie, i jeżeli dramatyczne okoliczności sprawy apelowały do jego czynnej wyobraźni i wyzywały bystrość."
    en: "So unworldly was he—or so capricious—that he frequently refused his help to the powerful and wealthy where the problem made no appeal to his sympathies, while he would devote weeks of most intense application to the affairs of some humble client whose case presented those strange and dramatic qualities which appealed to his imagination and challenged his ingenuity."
    chunks:
      - pl: "Zresztą, nawet w przyjmowaniu propozycji"
        ru: "Впрочем, даже в принятии предложений"
        note: "zresztą — впрочем"
      - pl: " kierowała Holmesem artystyczna wybredność."
        ru: "Холмсом руководила артистическая разборчивость."
        note: "kierować kimś — руководить кем-л.: творительный, как в русском"
      - pl: " Nieraz odmawiał pomocy ludziom możnym i bogatym,"
        ru: "Не раз он отказывал в помощи людям влиятельным и богатым,"
        note: "odmawiać komuś czegoś — отказывать кому-л. в чём-л.: родительный, без предлога; nieraz — не раз, часто (≠ «ни разу»)"
      - pl: " jeżeli kwestia, o którą szło,"
        ru: "если вопрос, о котором шла речь,"
        note: "chodzi (szło) o coś — речь идёт о чём-л.; szło — старое, сегодня chodziło"
      - pl: " nie wydawała mu się interesująca,"
        ru: "не казался ему интересным,"
        note: "wydawać się — казаться"
      - pl: " a przypadek sam w sobie mógłby być rozwiązany"
        ru: "а дело само по себе могло быть раскрыто"
        note: "sam w sobie — сам по себе"
      - pl: " przez zwykłego agenta policji."
        ru: "обычным полицейским агентом."
        note: "przez — творительный деятель в пассиве: «кем»"
      - pl: " Nieraz znowu całe tygodnie poświęcał bezinteresownie"
        ru: "А то, наоборот, целые недели он бескорыстно посвящал"
        note: "znowu — здесь «зато, с другой стороны»"
      - pl: " sprawom ludzi biednych,"
        ru: "делам бедных людей,"
      - pl: " jeżeli trafił na godne siebie i prawdziwie ciekawe zadanie,"
        ru: "если попадалась достойная его и по-настоящему интересная задача,"
        note: "trafić na coś — натолкнуться на что-л.; godny czegoś — достойный чего-л.: родительный"
      - pl: " i jeżeli dramatyczne okoliczności sprawy"
        ru: "и если драматические обстоятельства дела"
        note: "okoliczność — обстоятельство"
      - pl: " apelowały do jego czynnej wyobraźni i wyzywały bystrość."
        ru: "взывали к его живому воображению и бросали вызов его проницательности."
        note: "wyzywać — бросать вызов"
    words: { "wybredność": wybrednosc, "odmawiał": odmawiac, "godne": godny, "wyobraźni": wyobraznia, "bystrość": bystrosc }
  - clean: "W tym pamiętnym roku 1895 różne ciekawe historie zajmowały bezustannie barwnym kalejdoskopem życie i pracę Sherlocka, począwszy od słynnego śledztwa z powodu nagłej śmierci kardynała Tosca aż do aresztowania Wilsona, hodowcy kanarków — aresztowania, które oczyściło dzielnicę East End w Londynie od hańbiącej plamy. Po tych dwóch słynnych wypadkach nastąpiła zaraz tragedia z Woodman's Lee oraz bardzo zawikłana historia tycząca się śmierci kapitana Piotra Careya i towarzyszących jego zgonowi bardzo dziwnych okoliczności. To, co opowiadałem dotychczas o Holmesie, nie byłoby wiernym obrazem jego działalności, gdybym pominął ten wysoce ciekawy i charakterystyczny epizod."
    en: "In this memorable year ’95, a curious and incongruous succession of cases had engaged his attention, ranging from his famous investigation of the sudden death of Cardinal Tosca—an inquiry which was carried out by him at the express desire of His Holiness the Pope—down to his arrest of Wilson, the notorious canary-trainer, which removed a plague-spot from the East End of London. Close on the heels of these two famous cases came the tragedy of Woodman’s Lee, and the very obscure circumstances which surrounded the death of Captain Peter Carey. No record of the doings of Mr. Sherlock Holmes would be complete which did not include some account of this very unusual affair."
    chunks:
      - pl: "W tym pamiętnym roku 1895"
        ru: "В том памятном 1895 году"
      - pl: " różne ciekawe historie zajmowały bezustannie"
        ru: "разные любопытные истории беспрестанно занимали"
        note: "bezustannie — беспрестанно"
      - pl: " barwnym kalejdoskopem życie i pracę Sherlocka,"
        ru: "пёстрым калейдоскопом жизнь и работу Шерлока,"
      - pl: " począwszy od słynnego śledztwa"
        ru: "начиная со знаменитого расследования"
        note: "począwszy od — начиная с; śledztwo — следствие, расследование"
      - pl: " z powodu nagłej śmierci kardynała Tosca"
        ru: "по поводу внезапной смерти кардинала Тоски"
        note: "z powodu + родительный — из-за, по причине"
      - pl: " aż do aresztowania Wilsona, hodowcy kanarków —"
        ru: "вплоть до ареста Уилсона, разводчика канареек, —"
        note: "aż do — вплоть до; hodowca — тот, кто разводит животных"
      - pl: " aresztowania, które oczyściło dzielnicę East End w Londynie"
        ru: "ареста, который очистил лондонский Ист-Энд"
        note: "dzielnica — район города"
      - pl: " od hańbiącej plamy."
        ru: "от позорного пятна."
      - pl: " Po tych dwóch słynnych wypadkach"
        ru: "За этими двумя громкими делами"
      - pl: " nastąpiła zaraz tragedia z Woodman's Lee"
        ru: "сразу последовала трагедия в Вудменс-Ли"
        note: "nastąpić — последовать, наступить"
      - pl: " oraz bardzo zawikłana historia"
        ru: "а также очень запутанная история"
        note: "zawikłany — запутанный"
      - pl: " tycząca się śmierci kapitana Piotra Careya"
        ru: "касающаяся смерти капитана Питера Кэри"
        note: "tyczyć się czegoś — старое «касаться чего-л.», сегодня dotyczyć; Piotr — польская форма имени Peter"
      - pl: " i towarzyszących jego zgonowi bardzo dziwnych okoliczności."
        ru: "и весьма странных обстоятельств, сопровождавших его кончину."
        note: "towarzyszyć czemuś — сопровождать что-л.: дательный (zgonowi); zgon — смерть, кончина (официальное)"
      - pl: " To, co opowiadałem dotychczas o Holmesie,"
        ru: "То, что я рассказывал до сих пор о Холмсе,"
        note: "dotychczas — до сих пор"
      - pl: " nie byłoby wiernym obrazem jego działalności,"
        ru: "не было бы верной картиной его деятельности,"
      - pl: " gdybym pominął ten wysoce ciekawy i charakterystyczny epizod."
        ru: "если бы я опустил этот весьма любопытный и характерный эпизод."
        note: "pominąć — опустить, пропустить"
    words: { "począwszy": poczac, "słynnego": slynny, "plamy": plama, "towarzyszących": towarzyszyc, "dotychczas": dotychczas, "działalności": dzialalnosc }
  - clean: "W pierwszych dniach lipca Holmes tak mało bywał w domu, że wiedziałem zaraz, iż ma jakąś napiętą sprawę. Od czasu do czasu pojawiali się też w naszym mieszkaniu jacyś obdarci ludzie, zapytując za każdym razem o kapitana Basila. To znów świadczyło, że Holmes działa w przebraniu, jak to często czynił, aby ukryć swą dobrze znaną i nieraz budzącą postrach powierzchowność. W różnych stronach Londynu miał on najmniej pięć małych pokoików, gdzie mógł się spokojnie zamieniać w innego człowieka. Zresztą nie mówił mi nic, co czyni, a ja znów nie miałem żadnej przyczyny domagać się wyjaśnień przed czasem, wiedząc, że gdy nadejdzie pora, sam mi ich udzieli."
    en: "During the first week of July, my friend had been absent so often and so long from our lodgings that I knew he had something on hand. The fact that several rough-looking men called during that time and inquired for Captain Basil made me understand that Holmes was working somewhere under one of the numerous disguises and names with which he concealed his own formidable identity. He had at least five small refuges in different parts of London, in which he was able to change his personality. He said nothing of his business to me, and it was not my habit to force a confidence."
    chunks:
      - pl: "W pierwszych dniach lipca"
        ru: "В первые дни июля"
      - pl: " Holmes tak mało bywał w domu,"
        ru: "Холмс так мало бывал дома,"
        note: "bywać — бывать (многократный глагол)"
      - pl: " że wiedziałem zaraz, iż ma jakąś napiętą sprawę."
        ru: "что я сразу понял: у него какое-то напряжённое дело."
        note: "iż — книжное «что», то же, что że"
      - pl: " Od czasu do czasu pojawiali się też w naszym mieszkaniu"
        ru: "Время от времени у нас в квартире появлялись также"
        note: "od czasu do czasu — время от времени"
      - pl: " jacyś obdarci ludzie,"
        ru: "какие-то оборванцы,"
        note: "obdarty — оборванный"
      - pl: " zapytując za każdym razem o kapitana Basila."
        ru: "спрашивая каждый раз о капитане Бэзиле."
        note: "zapytywać o kogoś — спрашивать о ком-л.: o + винительный"
      - pl: " To znów świadczyło, że Holmes działa w przebraniu,"
        ru: "Это, в свою очередь, говорило о том, что Холмс действует переодетым,"
        note: "świadczyć o czymś / że… — свидетельствовать; w przebraniu — переодетым"
      - pl: " jak to często czynił,"
        ru: "как он часто делал,"
        note: "czynić — книжное «делать»"
      - pl: " aby ukryć swą dobrze znaną"
        ru: "чтобы скрыть свою хорошо известную"
      - pl: " i nieraz budzącą postrach powierzchowność."
        ru: "и нередко наводящую страх внешность."
        note: "budzić postrach — наводить страх; powierzchowność — внешность, наружность"
      - pl: " W różnych stronach Londynu"
        ru: "В разных концах Лондона"
        note: "strona — здесь «часть, район»"
      - pl: " miał on najmniej pięć małych pokoików,"
        ru: "у него было по меньшей мере пять маленьких комнаток,"
        note: "najmniej — здесь «по меньшей мере», сегодня co najmniej"
      - pl: " gdzie mógł się spokojnie zamieniać w innego człowieka."
        ru: "где он мог спокойно превращаться в другого человека."
        note: "zamieniać się w kogoś — превращаться в кого-л.: w + винительный"
      - pl: " Zresztą nie mówił mi nic, co czyni,"
        ru: "Впрочем, он ничего не говорил мне о том, что делает,"
      - pl: " a ja znów nie miałem żadnej przyczyny"
        ru: "а у меня, со своей стороны, не было никакой причины"
      - pl: " domagać się wyjaśnień przed czasem,"
        ru: "требовать объяснений раньше времени,"
        note: "domagać się czegoś — требовать чего-л.: родительный"
      - pl: " wiedząc, że gdy nadejdzie pora,"
        ru: "зная, что, когда придёт время,"
        note: "pora — время, пора"
      - pl: " sam mi ich udzieli."
        ru: "он сам мне их даст."
        note: "udzielić czegoś — дать, предоставить (объяснения, помощь): родительный"
    words: { "lipca": lipiec, "napiętą": napiac, "świadczyło": swiadczyc, "zamieniać": zamieniac, "wyjaśnień": wyjasnienia, "udzieli": udzielic }
  - clean: "Jednak tym razem w szczególny sposób dał mi pierwszą wskazówkę co do kierunku, w jakim obecnie działa. Pewnego dnia wyszedł wcześnie, jeszcze przed śniadaniem, a wrócił właśnie w chwili, gdy ja, ubrawszy się, zasiadłem do stołu. Wszedł do pokoju w kapeluszu na głowie, trzymając pod pachą niczym parasol potężny kij z ościeniem na końcu."
    en: "The first positive sign which he gave me of the direction which his investigation was taking was an extraordinary one. He had gone out before breakfast, and I had sat down to mine when he strode into the room, his hat upon his head and a huge barbed-headed spear tucked like an umbrella under his arm."
    chunks:
      - pl: "Jednak tym razem w szczególny sposób"
        ru: "Однако на этот раз он особым образом"
      - pl: " dał mi pierwszą wskazówkę"
        ru: "дал мне первую подсказку"
        note: "wskazówka — указание, подсказка; также стрелка часов"
      - pl: " co do kierunku, w jakim obecnie działa."
        ru: "насчёт того, в каком направлении он теперь действует."
        note: "co do + родительный — насчёт, что касается"
      - pl: " Pewnego dnia wyszedł wcześnie,"
        ru: "Однажды он вышел рано,"
        note: "pewnego dnia — однажды"
      - pl: " jeszcze przed śniadaniem,"
        ru: "ещё до завтрака,"
      - pl: " a wrócił właśnie w chwili,"
        ru: "а вернулся как раз в ту минуту,"
      - pl: " gdy ja, ubrawszy się, zasiadłem do stołu."
        ru: "когда я, одевшись, сел за стол."
        note: "ubrawszy się — деепричастие прошедшего времени: «одевшись»; zasiąść do stołu — сесть за стол"
      - pl: " Wszedł do pokoju w kapeluszu na głowie,"
        ru: "Он вошёл в комнату в шляпе,"
        note: "kapelusz — шляпа, не «капюшон»"
      - pl: " trzymając pod pachą niczym parasol"
        ru: "держа под мышкой, словно зонтик,"
        note: "pod pachą — под мышкой; niczym — словно, как"
      - pl: " potężny kij z ościeniem na końcu."
        ru: "огромную палку с острым наконечником."
        note: "oścień — острый наконечник, гарпун; kij — палка"
