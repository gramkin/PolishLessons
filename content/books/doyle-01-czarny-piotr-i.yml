  - clean: "— Ach, jakimże byłem głupcem, nie prosząc pana zaraz o pomoc! Ale teraz próżne żale. Tak jest, w pokoju było wiele przedmiotów, które zwracały od razu uwagę. Przede wszystkim harpun, którym dokonano zbrodni. Zerwano go ze ściany, gdzie był przytwierdzony na desce. Dwa inne, również tam umieszczone, pozostały na swoich miejscach. Na harpunie był napis: „Narwal, Dundee”. Z tego można by wnioskować, że morderstwa dokonano w przystępie gniewu, bo morderca chwycił za pierwszą lepszą broń, jaka mu się nasunęła pod rękę. Nadto wiemy, że zbrodnia była popełniona o drugiej po północy, a Piotr Carey był zupełnie ubrany. Wynika stąd, że ów człowiek, który zamordował Careya, był z nim umówiony na schadzkę. To przypuszczenie potwierdza znaleziona na stole flaszka rumu i dwa brudne kieliszki."
    en: "“I was a fool not to call you in at the time Mr. Holmes. However, that’s past praying for now. Yes, there were several objects in the room which called for special attention. One was the harpoon with which the deed was committed. It had been snatched down from a rack on the wall. Two others remained there, and there was a vacant place for the third. On the stock was engraved ‘SS. Sea Unicorn, Dundee.’ This seemed to establish that the crime had been done in a moment of fury, and that the murderer had seized the first weapon which came in his way. The fact that the crime was committed at two in the morning, and yet Peter Carey was fully dressed, suggested that he had an appointment with the murderer, which is borne out by the fact that a bottle of rum and two dirty glasses stood upon the table.”"
