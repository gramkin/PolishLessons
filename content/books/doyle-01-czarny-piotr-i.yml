  - clean: "— Był to człowiek ciekawy, trochę dziwak; zwyczajnie odznaczał się purytańską wstrzemięźliwością, był surowy, milczący i ponury. W domu miał żonę, dwudziestoletnią córkę i dwoje służby kobiecej. Służbę ciągle zmieniał, gdyż praca u niego nie należała do najmilszych i mało kto mógł wytrzymać dłużej. Carey miewał bowiem okresy pijaństwa, a gdy się upił, stawał się człowiekiem nie do zniesienia. Wiadomo, że wypędzał nieraz o północy czy nad samym ranem żonę albo córkę z domu i gonił je po parku batem tak, że ich krzyki dochodziły aż do sąsiadów. Budzili się i słuchali, co to za awantura. Raz stawał przed sądem za napad na starego księdza, który go odwiedzał i przy tej sposobności czynił mu różne słuszne uwagi. Słowem, trzeba by daleko szukać, nim znalazłby pan człowieka bardziej niebezpiecznego niż Carey. Słyszałem, że tą sławą cieszył się już, gdy dowodził okrętem. Znano go w całej marynarce jako „Czarnego Piotra”. Nazwano go tak nie tylko dla czarnych włosów i oliwkowej, prawie brunatnej cery, lecz także dzięki przymiotom charakteru, które czyniły zeń postrach całego otoczenia. Nie potrzebuję dodawać, że sąsiedzi go nie lubili i nie słyszałem, aby ktoś wyraził żal z powodu strasznej śmierci, jaka go spotkała."
    en: "“There were some most singular points about the man. In ordinary life, he was a strict Puritan—a silent, gloomy fellow. His household consisted of his wife, his daughter, aged twenty, and two female servants. These last were continually changing, for it was never a very cheery situation, and sometimes it became past all bearing. The man was an intermittent drunkard, and when he had the fit on him he was a perfect fiend. He has been known to drive his wife and daughter out of doors in the middle of the night and flog them through the park until the whole village outside the gates was aroused by their screams. “He was summoned once for a savage assault upon the old vicar, who had called upon him to remonstrate with him upon his conduct. In short, Mr. Holmes, you would go far before you found a more dangerous man than Peter Carey, and I have heard that he bore the same character when he commanded his ship. He was known in the trade as Black Peter, and the name was given him, not only on account of his swarthy features and the colour of his huge beard, but for the humours which were the terror of all around him. I need not say that he was loathed and avoided by every one of his neighbours, and that I have not heard one single word of sorrow about his terrible end."
