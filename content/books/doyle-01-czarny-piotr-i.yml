  - clean: "— Kochany panie! Badałem już niejedno przestępstwo, lecz nie natrafiłem jeszcze na takie, które byłoby popełnione przez jakąś latającą istotę. Dopóki zbrodniarz chodzi jak inni ludzie na nogach, dopóty musi zostać po nim jakieś wgłębienie, zdrapanie ziemi, jakaś maleńka zmiana, którą można odkryć przy naukowym badaniu. Niepodobna przypuścić, aby tam, w tym obryzganym krwią pokoju, nie było żadnego śladu, który by dał nam jakiś punkt oparcia."
