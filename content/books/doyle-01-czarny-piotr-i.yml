  - clean: "— Wie pan chyba, że mam silne nerwy. A jednak daję panu słowo, że zimny dreszcz przebiegł mnie od stóp do głów, gdy zajrzałem do chałupy. Muchy brzęczały jak w ulu, a podłoga i ściany wyglądały jak w rzeźni. Carey zawsze nazywał tę chatę kabiną, i w istocie urządzenie było zupełnie takie, jak w kabinie. Można było sądzić, że jest się na okręcie. Hamak, mapy morskie, fotografia „Narwala”, księgi okrętowe na półce; wszystko było tak urządzone, jak zwykle bywa w kapitańskiej kabinie."
