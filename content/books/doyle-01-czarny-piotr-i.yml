  - clean: "— Przypomina pan sobie, że wiadomo, iż dwa dni przed morderstwem przechodził drogą pewien kamieniarz z okolicy, nazwiskiem Slater. Otóż on opowiada, że idąc z Forest Row, zatrzymał się, gdyż jego uwagę zwróciło światło błyszczące pośród gałęzi. Zatrzymawszy się, zobaczył na tle okna cień męskiej głowy zwróconej bokiem. Wyraźnie widział brodę, ale była to broda krótka, stercząca do przodu, zupełnie inna niż ta, którą nosił Carey. Zresztą znał Careya dobrze. Tak przynajmniej mówił. Ale nie trzeba zapominać, że Slater spędził poprzednie dwie godziny w szynku, a z gościńca do okna wcale nie jest tak blisko. Zresztą to, co on opowiada, miało dziać się w poniedziałek, a morderstwo popełniono w środę."
    en: "“You remember that a stonemason, named Slater, walking from Forest Row about one o’clock in the morning—two days before the murder—stopped as he passed the grounds and looked at the square of light still shining among the trees. He swears that the shadow of a man’s head turned sideways was clearly visible on the blind, and that this shadow was certainly not that of Peter Carey, whom he knew well. It was that of a bearded man, but the beard was short and bristled forward in a way very different from that of the captain. So he says, but he had been two hours in the public-house, and it is some distance from the road to the window. Besides, this refers to the Monday, and the crime was done upon the Wednesday."
    draft: true
