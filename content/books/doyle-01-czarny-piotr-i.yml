  - clean: "Na środku leżał on sam. Twarz miał wykrzywioną w męce śmiertelnej, a wielka, szpakowata broda sterczała do góry. Przez sam środek piersi był przebity ogromnym harpunem, który wyszedł przez plecy i wbił się głęboko w ścianę. Przybito go jak chrząszcza na kartonie. Naturalnie nie żył, i to od chwili, gdy wydał ów ostatni krzyk. Znam pańską metodę, panie Holmes, i zastosowałem ją od razu. Zanim pozwoliłem, aby cokolwiek ruszono, zbadałem jak najdokładniej cały grunt zewnątrz chaty i podłogę wewnątrz pokoju. Nie było żadnych śladów."
