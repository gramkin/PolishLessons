  - clean: "— W protokole obdukcji musiał pan czytać, że Carey miał swoją „kabinę”. Tak jest, kabinę. Tak nazwał sobie drewniany domek zbudowany obok folwarku, o kilkaset kroków od właściwego domu mieszkalnego, i tam sypiał co noc. Była to mała chałupka o jednym pokoju. Dłuższa ściana miała szesnaście stóp, a krótsza dziesięć. Klucz nosił zawsze w kieszeni, sam słał łóżko, sam porządkował i sprzątał, i nikomu nie pozwalał wejść za próg. Po obu stronach domu były małe okienka, zawsze zasłonięte firankami i nigdy nieotwierane. Jedno z nich wychodziło na gościniec. Gdy w nocy zapalał światło, przechodzący ludzie pokazywali je sobie nawzajem, dziwiąc się, co Czarny Piotr tam robi. Muszę dodać, że dzięki temu oknu posiadamy główną poszlakę, wprawdzie bardzo słabą, ale zawsze jakąś."
    en: "“You must have read in the account of the inquest about the man’s cabin, Mr. Holmes, but perhaps your friend here has not heard of it. He had built himself a wooden outhouse—he always called it the ‘cabin’—a few hundred yards from his house, and it was here that he slept every night. It was a little, single-roomed hut, sixteen feet by ten. He kept the key in his pocket, made his own bed, cleaned it himself, and allowed no other foot to cross the threshold. There are small windows on each side, which were covered by curtains and never opened. One of these windows was turned towards the high road, and when the light burned in it at night the folk used to point it out to each other and wonder what Black Peter was doing in there. That’s the window, Mr. Holmes, which gave us one of the few bits of positive evidence that came out at the inquest."
