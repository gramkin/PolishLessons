  - clean: "— Mam tu parę dat, które razem tworzą zarys kariery życiowej Piotra Careya, kapitana okrętowego, zabitego przez nieznanych sprawców czy sprawcę. Urodził się w roku 1845, miał zatem pięćdziesiąt lat. Był to człowiek bardzo śmiały, wyborny kierownik wszelkich połowów na wieloryby i foki. W 1883 roku komenderował statkiem „Narwal” z Dundee. Zaraz potem udało mu się zrobić kilka świetnych połowów i już w następnym roku mógł się usunąć od interesu. Podróżował wiele, potem kupił niewielką posiadłość zwaną Woodman's Lee, niedaleko Forest Row w Sussex. Tam mieszkał przez sześć lat i tam też przed tygodniem właśnie zmarł nagłą śmiercią."
    en: "“I have a few dates here which will give you the career of the dead man, Captain Peter Carey. He was born in ’45—fifty years of age. He was a most daring and successful seal and whale fisher. In 1883 he commanded the steam sealer Sea Unicorn, of Dundee. He had then had several successful voyages in succession, and in the following year, 1884, he retired. After that he travelled for some years, and finally he bought a small place called Woodman’s Lee, near Forest Row, in Sussex. There he has lived for six years, and there he died just a week ago to-day."
