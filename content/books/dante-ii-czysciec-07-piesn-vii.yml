# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 7
chapterTitle: "Pieśń VII"
chapterTitleRu: "Песнь VII. Долина государей"
level: B2
paragraphs:
  - clean: "(Tacy, którzy zajęci sprawami politycznymi zaniedbali pokuty. Łąka kwiecista. Rudolf i inni monarchowie.)"
    chunks:
      - pl: "(Tacy, którzy zajęci sprawami politycznymi zaniedbali pokuty. Łąka kwiecista. Rudolf i inni monarchowie.)"
        ru: "(Те, кто, занятый делами правления, пренебрёг покаянием. Цветущий луг. Рудольф и другие монархи.)"
        note: "zaniedbać — пренебречь; kwiecisty — цветущий"
    words: { "sprawami": sprawa, "politycznymi": polityczny, "inni": inny }
  - clean: "Gdy witające uściski, objęcia,\nCzule trzy, cztery razy powtórzyli,\nSordello jednym w tył cofnął się krokiem,\n«Kto jesteś?» spytał z wzruszeniem głębokiem.\n— «Wprzódy nim dusze godne wniebowzięcia\nNa wierzch tej góry zaczęły wędrować,\nOktawian Cezar kazał mnie pochować\nW uczciwym grobie; ja jestem Wirgili,»\nMówił, «dla nieba umarłem na wieki,\nNie z winy grzechu, lecz żem nie miał wiary»."
    verse: true
    chunks:
      - pl: "Gdy witające uściski, objęcia,"
        ru: "Когда приветственные объятия"
      - pl: "\nCzule trzy, cztery razy powtórzyli,"
        ru: "нежно три, четыре раза повторили,"
      - pl: "\nSordello jednym w tył cofnął się krokiem,"
        ru: "Сорделло отступил на шаг назад,"
      - pl: "\n«Kto jesteś?» spytał z wzruszeniem głębokiem."
        ru: "«Кто ты?» — спросил с глубоким волнением."
      - pl: "\n— «Wprzódy nim dusze godne wniebowzięcia"
        ru: "— «Ещё прежде чем души, достойные вознесения,"
      - pl: "\nNa wierzch tej góry zaczęły wędrować,"
        ru: "начали странствовать на вершину этой горы,"
      - pl: "\nOktawian Cezar kazał mnie pochować"
        ru: "Октавиан Цезарь велел меня похоронить"
      - pl: "\nW uczciwym grobie; ja jestem Wirgili,»"
        ru: "в почётной гробнице; я Вергилий, —"
      - pl: "\nMówił, «dla nieba umarłem na wieki,"
        ru: "сказал он, — для неба я умер навеки"
      - pl: "\nNie z winy grzechu, lecz żem nie miał wiary»."
        ru: "не по вине греха, а потому, что не имел веры»."
    words: { "uściski": uscisk, "Wprzódy": wprzody, "pochować": pochowac, "uczciwym": uczciwy, "grobie": grob, "grzechu": grzech }
  - clean: "Jak ten, którego rzecz dziwna uderzy,\nWidzi i patrzy jak na widmo mary,\nWoła: jest, nie jest! na końcu uwierzy,\nTakim Sordello był w ciągu rozmowy;\nPodszedł, pokornie w dół spuścił powieki\nI Wirgiliusza objął za kolana,\nJak gdy uściska sługa swego pana."
    verse: true
    chunks:
      - pl: "Jak ten, którego rzecz dziwna uderzy,"
        ru: "Как тот, кого поразит странная вещь,"
      - pl: "\nWidzi i patrzy jak na widmo mary,"
        ru: "видит и смотрит, как на видение призрака,"
      - pl: "\nWoła: jest, nie jest! na końcu uwierzy,"
        ru: "восклицает: есть, нет! и в конце поверит,"
      - pl: "\nTakim Sordello był w ciągu rozmowy;"
        ru: "таким был Сорделло в ходе беседы;"
      - pl: "\nPodszedł, pokornie w dół spuścił powieki"
        ru: "подошёл, смиренно опустил веки"
      - pl: "\nI Wirgiliusza objął za kolana,"
        ru: "и обнял Вергилия за колени,"
      - pl: "\nJak gdy uściska sługa swego pana."
        ru: "как когда обнимает слуга своего господина."
    words: { "widmo": widmo, "Woła": wolac, "spuścił": spuscic, "objął": objac, "kolana": kolano, "sługa": sluga }
  - clean: "— «Chlubo Latynów!» mówił, «skarbie nowy\nSiły, bogactwa, wdzięku naszej mowy,\nMojej ojczyzny celu wiecznej cześci,\nJakaż zasługa czy łaska sprawiła,\nŻe oto witam poetę wielkiego!\nO! jeślim godnym słyszeć cię w tej chwili,\nMów, z piekła idziesz, i z kręgu jakiego?»"
    verse: true
    chunks:
      - pl: "— «Chlubo Latynów!» mówił, «skarbie nowy"
        ru: "— «Гордость латинян! — сказал он, — новое сокровище"
      - pl: "\nSiły, bogactwa, wdzięku naszej mowy,"
        ru: "силы, богатства, прелести нашей речи,"
      - pl: "\nMojej ojczyzny celu wiecznej cześci,"
        ru: "цель вечной чести моей отчизны,"
      - pl: "\nJakaż zasługa czy łaska sprawiła,"
        ru: "какая же заслуга или милость сделала так,"
      - pl: "\nŻe oto witam poetę wielkiego!"
        ru: "что вот я приветствую великого поэта!"
      - pl: "\nO! jeślim godnym słyszeć cię w tej chwili,"
        ru: "О! если я достоин слышать тебя в этот миг,"
      - pl: "\nMów, z piekła idziesz, i z kręgu jakiego?»"
        ru: "скажи: из ада ли ты идёшь, и из какого круга?»"
    words: { "bogactwa": bogactwo, "ojczyzny": ojczyzna, "wiecznej": wieczny, "Jakaż": jakiz, "zasługa": zasluga, "poetę": poeta }
  - clean: "«Przeszedłem tutaj,» tak mówił Wirgili:\n«A wciąż niebieska prowadzi mię siła;\nNie, żem co zdziałał, że nic nie zdziałałem,\nStraciłem widok ogniska słońc Słońca,\nZa którym tęsknisz ty z takim zapałem,\nA które z wieści za późno poznałem."
    verse: true
    chunks:
      - pl: "«Przeszedłem tutaj,» tak mówił Wirgili:"
        ru: "«Я прошёл сюда, — так сказал Вергилий, —"
      - pl: "\n«A wciąż niebieska prowadzi mię siła;"
        ru: "и меня всё время ведёт небесная сила;"
      - pl: "\nNie, żem co zdziałał, że nic nie zdziałałem,"
        ru: "не за то, что я что-то сделал, а за то, что ничего не сделал,"
        note: "zdziałać — сделать"
      - pl: "\nStraciłem widok ogniska słońc Słońca,"
        ru: "я потерял вид очага солнц, Солнца,"
        note: "Бога"
      - pl: "\nZa którym tęsknisz ty z takim zapałem,"
        ru: "о котором ты тоскуешь с таким жаром"
      - pl: "\nA które z wieści za późno poznałem."
        ru: "и которое я по слухам узнал слишком поздно."
    words: { "niebieska": niebieski, "widok": widok, "ogniska": ognisko, "słońc": slonce, "tęsknisz": tesknic, "wieści": wiesc }
  - clean: "Jest miejsce smutne, nie męki bez końca,\nTylko ciemności, gdzie skargi, cierpienia\nNie brzmią jak jęki, lecz tchną jak westchnienia\nTam z niewinnymi mieszkam niemowlęty,\nKtórym zmaz ciała nie obmył chrzest święty:\nTam społem mieszkam z takimi istoty,\nCo się w trzy święte nie ubrały cnoty,\nChoć w innych cnotach ćwiczyły się pilnie."
    verse: true
    chunks:
      - pl: "Jest miejsce smutne, nie męki bez końca,"
        ru: "Есть место печальное, не муки без конца,"
      - pl: "\nTylko ciemności, gdzie skargi, cierpienia"
        ru: "а лишь тьма, где жалобы, страдания"
      - pl: "\nNie brzmią jak jęki, lecz tchną jak westchnienia"
        ru: "звучат не как стоны, а дышат как вздохи."
        note: "tchnąć — дышать"
      - pl: "\nTam z niewinnymi mieszkam niemowlęty,"
        ru: "Там я живу с невинными младенцами,"
        note: "niemowlęta — младенцы"
      - pl: "\nKtórym zmaz ciała nie obmył chrzest święty:"
        ru: "с которых пятен плоти не омыло святое крещение:"
        note: "zmaz — пятно"
      - pl: "\nTam społem mieszkam z takimi istoty,"
        ru: "там я живу вместе с такими существами,"
      - pl: "\nCo się w trzy święte nie ubrały cnoty,"
        ru: "что не облеклись в три святые добродетели,"
        note: "вера, надежда, любовь"
      - pl: "\nChoć w innych cnotach ćwiczyły się pilnie."
        ru: "хоть в иных добродетелях усердно упражнялись."
    words: { "smutne": smutny, "skargi": skarga, "niewinnymi": niewinny, "istoty": istota, "ubrały": ubrac, "ćwiczyły": cwiczyc }
  - clean: "Wskaż, jeśli możesz, błagam cię usilnie,\nKędy dojść prościej do czyśćcowej bramy?»\nA on: «My stałych tutaj miejsc nie mamy.\nA wolno tylko posuwać nam nogę,\nTu w krąg i wyżej; wszędzie, gdzie iść mogę,\nJako przewodnik rad wskażę ci drogę."
    verse: true
    chunks:
      - pl: "Wskaż, jeśli możesz, błagam cię usilnie,"
        ru: "Укажи, если можешь, молю тебя настойчиво,"
        note: "usilnie — настойчиво"
      - pl: "\nKędy dojść prościej do czyśćcowej bramy?»"
        ru: "где проще дойти до ворот Чистилища?»"
      - pl: "\nA on: «My stałych tutaj miejsc nie mamy."
        ru: "А он: «У нас здесь нет постоянных мест."
      - pl: "\nA wolno tylko posuwać nam nogę,"
        ru: "Нам дозволено лишь передвигать ногу"
      - pl: "\nTu w krąg i wyżej; wszędzie, gdzie iść mogę,"
        ru: "здесь кругом и выше; всюду, где могу идти,"
      - pl: "\nJako przewodnik rad wskażę ci drogę."
        ru: "как проводник, охотно укажу тебе дорогу."
    words: { "Wskaż": wskazac, "błagam": blagac, "bramy": brama, "krąg": krag, "wszędzie": wszedzie, "przewodnik": przewodnik }
  - clean: "Lecz patrz, dzień w swoim nachyla się biegu,\nIść tam wysoko i nocą nie radzę,\nLepiej pomyśleć o dobrym noclegu.\nTu od nas w prawo zebrane są duchy\nW pustym ustroniu, kąt cichy i głuchy;\nJeśli się zgadzasz, do nich zaprowadzę,\nA będziesz rad z ich uprzejmej gościny."
    verse: true
    chunks:
      - pl: "Lecz patrz, dzień w swoim nachyla się biegu,"
        ru: "Но смотри: день клонится в своём беге,"
      - pl: "\nIść tam wysoko i nocą nie radzę,"
        ru: "идти туда, высоко, и ночью я не советую,"
      - pl: "\nLepiej pomyśleć o dobrym noclegu."
        ru: "лучше подумать о хорошем ночлеге."
        note: "nocleg — ночлег"
      - pl: "\nTu od nas w prawo zebrane są duchy"
        ru: "Здесь, от нас справа, собраны духи"
      - pl: "\nW pustym ustroniu, kąt cichy i głuchy;"
        ru: "в пустом уединении, угол тихий и глухой;"
      - pl: "\nJeśli się zgadzasz, do nich zaprowadzę,"
        ru: "если согласен, отведу к ним,"
      - pl: "\nA będziesz rad z ich uprzejmej gościny."
        ru: "и ты будешь рад их любезному гостеприимству»."
        note: "gościna — гостеприимство"
    words: { "biegu": bieg, "zebrane": zebrac, "cichy": cichy, "głuchy": gluchy, "zaprowadzę": zaprowadzic, "uprzejmej": uprzejmy }
  - clean: "— «Jak to?» mistrz mówił, «czy w nocne godziny,\nNie wolno wchodzić na skał tych wyżynę?\nCzy siłę traci w noc stopa idąca?»\nSordello wodząc swój palec po ziemi,\nRzekł: «Tu nie przejdziesz stopami twojemi\nTej jednej kreski po zachodzie słońca."
    verse: true
    chunks:
      - pl: "— «Jak to?» mistrz mówił, «czy w nocne godziny,"
        ru: "— «Как это? — сказал учитель, — неужели в ночные часы"
      - pl: "\nNie wolno wchodzić na skał tych wyżynę?"
        ru: "нельзя всходить на высоту этих скал?"
      - pl: "\nCzy siłę traci w noc stopa idąca?»"
        ru: "Неужели идущая нога теряет ночью силу?»"
      - pl: "\nSordello wodząc swój palec po ziemi,"
        ru: "Сорделло, водя пальцем по земле,"
      - pl: "\nRzekł: «Tu nie przejdziesz stopami twojemi"
        ru: "сказал: «Здесь ты не перейдёшь своими ногами"
      - pl: "\nTej jednej kreski po zachodzie słońca."
        ru: "и этой одной черты после захода солнца."
        note: "kreska — черта"
    words: { "nocne": nocny, "skał": skala, "stopa": stopa, "wodząc": wodzic, "Rzekł": rzec, "zachodzie": zachod }
  - clean: "Tutaj gdy ciemność tę górę okoli,\nNiemożność iścia hamuje chęć woli.\nTrudno iść nocą na same jej szczyty,\nPóki widnokrąg dzień trzyma ukryty».\nNatenczas mistrz mój jakby zadziwiony:\n«Prowadź nas» mówił «do owej zachrony,\nGdzie nas ma spotkać uprzejma gościna»."
    verse: true
    chunks:
      - pl: "Tutaj gdy ciemność tę górę okoli,"
        ru: "Здесь, когда тьма окружит эту гору,"
      - pl: "\nNiemożność iścia hamuje chęć woli."
        ru: "невозможность идти сдерживает желание воли."
        note: "iście — устар. «хождение»"
      - pl: "\nTrudno iść nocą na same jej szczyty,"
        ru: "Трудно идти ночью на самые её вершины,"
      - pl: "\nPóki widnokrąg dzień trzyma ukryty»."
        ru: "пока горизонт держит день скрытым»."
      - pl: "\nNatenczas mistrz mój jakby zadziwiony:"
        ru: "Тогда мой учитель, словно удивлённый:"
      - pl: "\n«Prowadź nas» mówił «do owej zachrony,"
        ru: "«Веди нас, — сказал, — к тому убежищу,"
        note: "zachrona — убежище"
      - pl: "\nGdzie nas ma spotkać uprzejma gościna»."
        ru: "где нас ждёт любезное гостеприимство»."
    words: { "ciemność": ciemnosc, "chęć": chec, "szczyty": szczyt, "ukryty": ukryc, "mistrz": mistrz, "Prowadź": prowadzic }
  - clean: "I szliśmy; blisko leżała dolina,\nWklęsłością swoją w bok skały werznięta.\n«Tam krok wstrzymamy naszego pochodu,»\nDuch rzekł, «tam będziem czekać słońca wschodu».\nWiodła nas ścieżka pochyła i kręta,\nSchodząc w dolinę krańcem jej wybrzeży,\nZłoto i srebro, rubinu czerwieni,\nSzafiru barwa, blask szmaragdu świeży,\nZgasły wszech kruszców połysk i kamieni\nPrzy tej doliny kwiatach i zieleni;"
    verse: true
    chunks:
      - pl: "I szliśmy; blisko leżała dolina,"
        ru: "И мы пошли; близко лежала долина,"
      - pl: "\nWklęsłością swoją w bok skały werznięta."
        ru: "своей впадиной врезанная в бок скалы."
        note: "werznięty — врезанный"
      - pl: "\n«Tam krok wstrzymamy naszego pochodu,»"
        ru: "«Там остановим шаг нашего шествия, —"
      - pl: "\nDuch rzekł, «tam będziem czekać słońca wschodu»."
        ru: "сказал дух, — там будем ждать восхода солнца»."
      - pl: "\nWiodła nas ścieżka pochyła i kręta,"
        ru: "Вела нас тропа покатая и извилистая,"
      - pl: "\nSchodząc w dolinę krańcem jej wybrzeży,"
        ru: "спускаясь в долину по краю её берегов;"
      - pl: "\nZłoto i srebro, rubinu czerwieni,"
        ru: "золото и серебро, краснота рубина,"
        note: "rubin — рубин"
      - pl: "\nSzafiru barwa, blask szmaragdu świeży,"
        ru: "цвет сапфира, свежий блеск изумруда,"
        note: "szmaragd — изумруд"
      - pl: "\nZgasły wszech kruszców połysk i kamieni"
        ru: "померкли бы — блеск всех металлов и камней —"
      - pl: "\nPrzy tej doliny kwiatach i zieleni;"
        ru: "перед цветами и зеленью этой долины;"
    words: { "dolina": dolina, "wstrzymamy": wstrzymac, "Schodząc": schodzic, "wybrzeży": wybrzeze, "srebro": srebro, "blask": blask }
  - clean: "Jak wszelka małość przy wielkości znika.\nNie tylko pędzel natury bogaty\nTę grotę w zioła malował i kwiaty;\nZiejąc tysiącem zapachów dolina\nNieznanych woni lubością przenika.\nWidziałem duchy, pomiędzy kwiatami\nSiedząc nuciły pieśń: Salve Regina."
    verse: true
    chunks:
      - pl: "Jak wszelka małość przy wielkości znika."
        ru: "как всякая малость исчезает перед величием."
      - pl: "\nNie tylko pędzel natury bogaty"
        ru: "Не только богатая кисть природы"
        note: "pędzel — кисть"
      - pl: "\nTę grotę w zioła malował i kwiaty;"
        ru: "расписала эту впадину травами и цветами;"
      - pl: "\nZiejąc tysiącem zapachów dolina"
        ru: "дыша тысячей запахов, долина"
      - pl: "\nNieznanych woni lubością przenika."
        ru: "пронизывает сладостью неведомых благоуханий."
        note: "lubość — сладость"
      - pl: "\nWidziałem duchy, pomiędzy kwiatami"
        ru: "Я видел духов, что меж цветами,"
      - pl: "\nSiedząc nuciły pieśń: Salve Regina."
        ru: "сидя, напевали песнь «Salve Regina»."
        note: "«Славься, Царица»"
    words: { "wielkości": wielkosc, "znika": znikac, "malował": malowac, "Ziejąc": ziac, "woni": won, "pieśń": piesn }
  - clean: "«Wprzódy nim słońce zapadnie przed nami,»\nRzekł Mantuańczyk, który nas prowadził,\n«Zstąpić tam do nich ja bym wam nie radził.\nTu z brzegu stojąc na tych skał urwisku,\nWidzieć będziecie ich gesta i twarze\nLepiej niż w grocie, w ich tłumnym nacisku."
    verse: true
    chunks:
      - pl: "«Wprzódy nim słońce zapadnie przed nami,»"
        ru: "«Прежде чем солнце сядет перед нами, —"
      - pl: "\nRzekł Mantuańczyk, który nas prowadził,"
        ru: "сказал мантуанец, что нас вёл, —"
      - pl: "\n«Zstąpić tam do nich ja bym wam nie radził."
        ru: "спускаться туда к ним я бы вам не советовал."
      - pl: "\nTu z brzegu stojąc na tych skał urwisku,"
        ru: "Стоя здесь с края, на обрыве этих скал,"
        note: "urwisko — обрыв"
      - pl: "\nWidzieć będziecie ich gesta i twarze"
        ru: "вы будете видеть их жесты и лица"
      - pl: "\nLepiej niż w grocie, w ich tłumnym nacisku."
        ru: "лучше, чем внизу, в их толпе и тесноте."
    words: { "radził": radzic, "brzegu": brzeg, "stojąc": stac, "Widzieć": widziec, "twarze": twarz, "nacisku": nacisk }
