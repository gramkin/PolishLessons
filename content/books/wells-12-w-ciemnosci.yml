  - clean: "Z jego szczytu mogłem teraz przez mgłę dymu rozpoznać Pałac z Zielonej Porcelany, a stamtąd ustalić kierunek do Białego Sfinksa. I tak, zostawiając resztkę tych potępionych dusz, wciąż błąkających się tu i tam i jęczących, gdy dzień stawał się jaśniejszy, owinąłem stopy trawą i pokuśtykałem dalej po dymiących popiołach, między czarnymi pniami, w których wciąż pulsował ogień, w stronę kryjówki Wehikułu Czasu. Szedłem powoli, bo byłem prawie wyczerpany, a do tego kulałem, i czułem najgłębszą rozpacz z powodu strasznej śmierci małej Weeny."
