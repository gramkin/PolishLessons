level: B2
paragraphs:
  - clean: "Wyszliśmy z Pałacu, gdy słońce było jeszcze częściowo nad horyzontem. Byłem zdecydowany dotrzeć do Białego Sfinksa wczesnym rankiem następnego dnia, a przed zmrokiem zamierzałem przedrzeć się przez las, który zatrzymał mnie podczas poprzedniej wędrówki. Moim planem było zajść tej nocy jak najdalej, a potem, rozpaliwszy ogień, spać pod ochroną jego blasku. Idąc, zbierałem więc wszelkie patyki i suchą trawę, jakie zobaczyłem, i wkrótce miałem pełne naręcze takiego śmiecia. Tak obładowani posuwaliśmy się wolniej, niż przewidywałem, a poza tym Weena była zmęczona."
    en: "“We emerged from the Palace while the sun was still in part above the horizon. I was determined to reach the White Sphinx early the next morning, and ere the dusk I purposed pushing through the woods that had stopped me on the previous journey. My plan was to go as far as possible that night, and then, building a fire, to sleep in the protection of its glare. Accordingly, as we went along I gathered any sticks or dried grass I saw, and presently had my arms full of such litter. Thus loaded, our progress was slower than I had anticipated, and besides Weena was tired."
    draft: true
    chunks:
      - pl: "Wyszliśmy z Pałacu, gdy słońce było jeszcze częściowo nad horyzontem."
        ru: "Мы вышли из Дворца, когда солнце ещё отчасти стояло над горизонтом."
      - pl: " Byłem zdecydowany dotrzeć do Białego Sfinksa wczesnym rankiem następnego dnia, a przed zmrokiem zamierzałem przedrzeć się przez las, który zatrzymał mnie podczas poprzedniej wędrówki."
        ru: "Я был полон решимости добраться до Белого Сфинкса рано утром следующего дня, а до сумерек собирался пробиться через лес, который остановил меня в прошлый раз."
        note: "przedrzeć się — пробиться"
      - pl: " Moim planem było zajść tej nocy jak najdalej, a potem, rozpaliwszy ogień, spać pod ochroną jego blasku."
        ru: "Мой план был — уйти в ту ночь как можно дальше, а потом, разведя костёр, спать под защитой его света."
      - pl: " Idąc, zbierałem więc wszelkie patyki i suchą trawę, jakie zobaczyłem, i wkrótce miałem pełne naręcze takiego śmiecia."
        ru: "Поэтому по дороге я собирал все палки и сухую траву, какие видел, и вскоре у меня была полная охапка этого мусора."
        note: "patyk — палка; naręcze — охапка"
      - pl: " Tak obładowani posuwaliśmy się wolniej, niż przewidywałem, a poza tym Weena była zmęczona."
        ru: "С такой ношей мы шли медленнее, чем я рассчитывал, к тому же Уина устала."
        note: "obładowany — нагружённый"
    words: { "horyzontem": horyzont, "zmrokiem": zmrok, "wędrówki": wedrowka, "blasku": blask, "patyki": patyk, "wolniej": wolno }
  - clean: "I ja również zacząłem cierpieć z powodu senności, tak że zapadła już głęboka noc, zanim doszliśmy do lasu. Na porośniętym krzakami wzgórzu na jego skraju Weena chciała się zatrzymać, bojąc się ciemności przed nami; ale osobliwe przeczucie zbliżającej się klęski, które powinno było posłużyć mi za ostrzeżenie, pchało mnie naprzód. Nie spałem przez noc i dwa dni, byłem rozgorączkowany i drażliwy. Czułem, że ogarnia mnie sen, a wraz z nim nadchodzą Morlokowie."
    en: "And I, also, began to suffer from sleepiness too; so that it was full night before we reached the wood. Upon the shrubby hill of its edge Weena would have stopped, fearing the darkness before us; but a singular sense of impending calamity, that should indeed have served me as a warning, drove me onward. I had been without sleep for a night and two days, and I was feverish and irritable. I felt sleep coming upon me, and the Morlocks with it."
    draft: true
    chunks:
      - pl: "I ja również zacząłem cierpieć z powodu senności, tak że zapadła już głęboka noc, zanim doszliśmy do lasu."
        ru: "И меня тоже начала одолевать сонливость, так что, когда мы дошли до леса, была уже глубокая ночь."
        note: "senność — сонливость"
      - pl: " Na porośniętym krzakami wzgórzu na jego skraju Weena chciała się zatrzymać, bojąc się ciemności przed nami;"
        ru: "На поросшем кустарником холме у его опушки Уина хотела остановиться, боясь темноты впереди;"
        note: "skraj — край, опушка"
      - pl: " ale osobliwe przeczucie zbliżającej się klęski, które powinno było posłużyć mi za ostrzeżenie, pchało mnie naprzód."
        ru: "но странное предчувствие надвигающейся беды, которое должно было бы послужить мне предостережением, гнало меня вперёд."
        note: "klęska — бедствие"
      - pl: " Nie spałem przez noc i dwa dni, byłem rozgorączkowany i drażliwy."
        ru: "Я не спал ночь и два дня, у меня был жар, и я был раздражителен."
        note: "drażliwy — раздражительный"
      - pl: " Czułem, że ogarnia mnie sen, a wraz z nim nadchodzą Morlokowie."
        ru: "Я чувствовал, что меня одолевает сон, а вместе с ним приближаются морлоки."
    words: { "głęboka": gleboki, "wzgórzu": wzgorze, "ciemności": ciemnosc, "przeczucie": przeczucie, "naprzód": naprzod, "nadchodzą": nadchodzic }
  - clean: "Gdy się wahaliśmy, wśród czarnych krzaków za nami, ledwie widoczne na ich czerni, zobaczyłem trzy przyczajone postacie. Wokół nas były zarośla i wysoka trawa, i nie czułem się bezpieczny przed ich podstępnym podejściem. Las, jak obliczyłem, miał nieco mniej niż milę szerokości. Gdybyśmy zdołali przejść przez niego na nagie zbocze, tam, jak mi się zdawało, byłoby o wiele bezpieczniejsze miejsce na odpoczynek; myślałem, że zapałkami i kamforą zdołam oświetlać sobie drogę przez las."
    en: "“While we hesitated, among the black bushes behind us, and dim against their blackness, I saw three crouching figures. There was scrub and long grass all about us, and I did not feel safe from their insidious approach. The forest, I calculated, was rather less than a mile across. If we could get through it to the bare hillside, there, as it seemed to me, was an altogether safer resting-place; I thought that with my matches and my camphor I could contrive to keep my path illuminated through the woods."
    draft: true
    chunks:
      - pl: "Gdy się wahaliśmy, wśród czarnych krzaków za nami, ledwie widoczne na ich czerni, zobaczyłem trzy przyczajone postacie."
        ru: "Пока мы колебались, среди чёрных кустов позади нас, едва различимые на их черноте, я увидел три притаившиеся фигуры."
      - pl: " Wokół nas były zarośla i wysoka trawa, i nie czułem się bezpieczny przed ich podstępnym podejściem."
        ru: "Вокруг нас был кустарник и высокая трава, и я не чувствовал себя в безопасности от их коварного приближения."
        note: "podstępny — коварный"
      - pl: " Las, jak obliczyłem, miał nieco mniej niż milę szerokości."
        ru: "Лес, по моим расчётам, был чуть меньше мили в ширину."
      - pl: " Gdybyśmy zdołali przejść przez niego na nagie zbocze, tam, jak mi się zdawało, byłoby o wiele bezpieczniejsze miejsce na odpoczynek;"
        ru: "Если бы мы сумели пройти его насквозь к голому склону, там, как мне казалось, было бы куда более надёжное место для отдыха;"
      - pl: " myślałem, że zapałkami i kamforą zdołam oświetlać sobie drogę przez las."
        ru: "я думал, что спичками и камфорой сумею освещать себе путь через лес."
    words: { "wahaliśmy": wahac, "ledwie": ledwie, "widoczne": widoczny, "trawa": trawa, "zdołali": zdolac, "odpoczynek": odpoczynek }
  - clean: "Było jednak jasne, że jeśli mam wymachiwać zapałkami, muszę porzucić chrust; dość niechętnie położyłem go więc na ziemi. I wtedy przyszło mi do głowy, że zadziwię naszych przyjaciół za nami, podpalając go. Miałem się przekonać o potwornej głupocie tego postępku, ale wtedy wydał mi się zręcznym posunięciem dla osłony naszego odwrotu."
    en: "Yet it was evident that if I was to flourish matches with my hands I should have to abandon my firewood; so, rather reluctantly, I put it down. And then it came into my head that I would amaze our friends behind by lighting it. I was to discover the atrocious folly of this proceeding, but it came to my mind as an ingenious move for covering our retreat."
    draft: true
    chunks:
      - pl: "Było jednak jasne, że jeśli mam wymachiwać zapałkami, muszę porzucić chrust;"
        ru: "Однако было ясно, что если мне придётся размахивать спичками, то хворост надо бросить;"
        note: "chrust — хворост"
      - pl: " dość niechętnie położyłem go więc na ziemi."
        ru: "поэтому я довольно неохотно положил его на землю."
      - pl: " I wtedy przyszło mi do głowy, że zadziwię naszych przyjaciół za nami, podpalając go."
        ru: "И тут мне пришло в голову, что я удивлю наших друзей позади, подпалив его."
      - pl: " Miałem się przekonać o potwornej głupocie tego postępku, ale wtedy wydał mi się zręcznym posunięciem dla osłony naszego odwrotu."
        ru: "Мне предстояло убедиться в чудовищной глупости этого поступка, но тогда он показался мне ловким ходом, чтобы прикрыть наше отступление."
        note: "posunięcie — ход, шаг"
    words: { "porzucić": porzucic, "położyłem": polozyc, "głupocie": glupota, "osłony": oslona, "odwrotu": odwrot }
  - clean: "Nie wiem, czy myśleliście kiedyś, jak rzadką rzeczą musi być płomień pod nieobecność człowieka i w klimacie umiarkowanym. Żar słońca rzadko jest dość silny, by palić, nawet gdy skupiają go krople rosy, jak to bywa czasem w okolicach bardziej tropikalnych. Piorun może razić i osmalić, ale rzadko wznieca rozległy pożar. Gnijąca roślinność może czasem tlić się od ciepła fermentacji, ale rzadko kończy się to płomieniem. W tym upadku zapomniano też na ziemi sztuki rozniecania ognia. Czerwone języki, które liżąc pięły się po moim stosie drewna, były dla Weeny czymś zupełnie nowym i dziwnym."
    en: "“I don’t know if you have ever thought what a rare thing flame must be in the absence of man and in a temperate climate. The sun’s heat is rarely strong enough to burn, even when it is focused by dewdrops, as is sometimes the case in more tropical districts. Lightning may blast and blacken, but it rarely gives rise to widespread fire. Decaying vegetation may occasionally smoulder with the heat of its fermentation, but this rarely results in flame. In this decadence, too, the art of fire-making had been forgotten on the earth. The red tongues that went licking up my heap of wood were an altogether new and strange thing to Weena."
    draft: true
    chunks:
      - pl: "Nie wiem, czy myśleliście kiedyś, jak rzadką rzeczą musi być płomień pod nieobecność człowieka i w klimacie umiarkowanym."
        ru: "Не знаю, задумывались ли вы когда-нибудь, какая редкость пламя в отсутствие человека и в умеренном климате."
        note: "umiarkowany — умеренный"
      - pl: " Żar słońca rzadko jest dość silny, by palić, nawet gdy skupiają go krople rosy, jak to bywa czasem w okolicach bardziej tropikalnych."
        ru: "Солнечный жар редко бывает достаточно силён, чтобы жечь, даже когда его собирают капли росы, как это иногда бывает в более тропических краях."
        note: "rosa — роса; skupiać — собирать (в фокус)"
      - pl: " Piorun może razić i osmalić, ale rzadko wznieca rozległy pożar."
        ru: "Молния может поразить и опалить, но редко вызывает обширный пожар."
        note: "razić — поражать; osmalić — опалить; pożar — пожар"
      - pl: " Gnijąca roślinność może czasem tlić się od ciepła fermentacji, ale rzadko kończy się to płomieniem."
        ru: "Гниющая растительность иногда может тлеть от тепла брожения, но это редко кончается пламенем."
        note: "tlić się — тлеть"
      - pl: " W tym upadku zapomniano też na ziemi sztuki rozniecania ognia."
        ru: "В этом упадке на земле было забыто и искусство добывания огня."
      - pl: " Czerwone języki, które liżąc pięły się po moim stosie drewna, były dla Weeny czymś zupełnie nowym i dziwnym."
        ru: "Красные языки, которые, облизывая, взбирались по моей куче дров, были для Уины чем-то совершенно новым и странным."
        note: "lizać — лизать; piąć się — взбираться"
    words: { "klimacie": klimat, "rzadko": rzadko, "Piorun": piorun, "tlić": tlic, "stosie": stos }
  - clean: "Chciała do niego podbiec i się nim bawić. Myślę, że rzuciłaby się w niego, gdybym jej nie powstrzymał. Ale chwyciłem ją i mimo jej oporu śmiało zanurzyłem się przed siebie w las. Przez kawałek drogi blask mojego ognia oświetlał ścieżkę. Obejrzawszy się po chwili, zobaczyłem przez gęsto stojące pnie, że od mojej sterty patyków płomień przeszedł na sąsiednie krzaki, a wygięta linia ognia pełzła po trawie wzgórza. Roześmiałem się na to i znów zwróciłem się ku ciemnym drzewom przede mną."
    en: "“She wanted to run to it and play with it. I believe she would have cast herself into it had I not restrained her. But I caught her up, and in spite of her struggles, plunged boldly before me into the wood. For a little way the glare of my fire lit the path. Looking back presently, I could see, through the crowded stems, that from my heap of sticks the blaze had spread to some bushes adjacent, and a curved line of fire was creeping up the grass of the hill. I laughed at that, and turned again to the dark trees before me."
    draft: true
    chunks:
      - pl: "Chciała do niego podbiec i się nim bawić."
        ru: "Ей хотелось подбежать к нему и поиграть с ним."
      - pl: " Myślę, że rzuciłaby się w niego, gdybym jej nie powstrzymał."
        ru: "Думаю, она бросилась бы в него, если бы я её не удержал."
      - pl: " Ale chwyciłem ją i mimo jej oporu śmiało zanurzyłem się przed siebie w las."
        ru: "Но я подхватил её и, несмотря на её сопротивление, смело углубился в лес."
        note: "opór — сопротивление"
      - pl: " Przez kawałek drogi blask mojego ognia oświetlał ścieżkę."
        ru: "Какое-то время свет моего костра освещал тропу."
      - pl: " Obejrzawszy się po chwili, zobaczyłem przez gęsto stojące pnie,"
        ru: "Оглянувшись немного погодя, я увидел сквозь густо стоящие стволы,"
      - pl: " że od mojej sterty patyków płomień przeszedł na sąsiednie krzaki, a wygięta linia ognia pełzła po trawie wzgórza."
        ru: "что от моей кучи хвороста пламя перекинулось на соседние кусты, а изогнутая линия огня ползла по траве холма."
      - pl: " Roześmiałem się na to i znów zwróciłem się ku ciemnym drzewom przede mną."
        ru: "Я рассмеялся и снова повернулся к тёмным деревьям впереди."
    words: { "chwyciłem": chwycic, "blask": blask, "gęsto": gesto, "patyków": patyk, "Roześmiałem": rozesmiac }
  - clean: "Było bardzo ciemno, a Weena kurczowo się do mnie tuliła, ale gdy oczy przywykły do ciemności, było jeszcze dość światła, bym omijał pnie. W górze było po prostu czarno, z wyjątkiem miejsc, gdzie tu i ówdzie przez lukę świecił na nas daleki błękit nieba. Nie zapaliłem żadnej zapałki, bo nie miałem wolnej ręki. Na lewym ręku niosłem moją maleńką, w prawej trzymałem żelazną sztabę."
    en: "It was very black, and Weena clung to me convulsively, but there was still, as my eyes grew accustomed to the darkness, sufficient light for me to avoid the stems. Overhead it was simply black, except where a gap of remote blue sky shone down upon us here and there. I lit none of my matches because I had no hand free. Upon my left arm I carried my little one, in my right hand I had my iron bar."
    draft: true
    chunks:
      - pl: "Było bardzo ciemno, a Weena kurczowo się do mnie tuliła,"
        ru: "Было очень темно, и Уина судорожно прижималась ко мне,"
        note: "kurczowo — судорожно; tulić się — прижиматься"
      - pl: " ale gdy oczy przywykły do ciemności, było jeszcze dość światła, bym omijał pnie."
        ru: "но когда глаза привыкли к темноте, света ещё хватало, чтобы обходить стволы."
        note: "przywyknąć — привыкнуть"
      - pl: " W górze było po prostu czarno, z wyjątkiem miejsc, gdzie tu i ówdzie przez lukę świecił na nas daleki błękit nieba."
        ru: "Над головой было просто черно, кроме мест, где кое-где сквозь просвет на нас светила далёкая синева неба."
        note: "luka — просвет, прореха"
      - pl: " Nie zapaliłem żadnej zapałki, bo nie miałem wolnej ręki."
        ru: "Я не зажёг ни одной спички, потому что у меня не было свободной руки."
      - pl: " Na lewym ręku niosłem moją maleńką, w prawej trzymałem żelazną sztabę."
        ru: "На левой руке я нёс свою малышку, в правой держал железный брусок."
    words: { "przywykły": przywyknac, "lukę": luka, "świecił": swiecic, "niosłem": niesc, "maleńką": malenki }
  - clean: "Przez jakiś czas nie słyszałem nic poza trzaskiem gałązek pod stopami, słabym szelestem wiatru w górze, własnym oddechem i pulsowaniem naczyń krwionośnych w uszach. Potem wydało mi się, że za mną coś tupocze. Szedłem zawzięcie dalej. Tupot stawał się wyraźniejszy, a potem dosłyszałem ten sam dziwny dźwięk i głosy, które słyszałem w Podziemnym Świecie. Najwyraźniej było tam kilku Morloków i otaczali mnie coraz ciaśniej. Rzeczywiście, po minucie poczułem szarpnięcie za marynarkę, potem coś przy ramieniu. A Weena zadrżała gwałtownie i znieruchomiała."
    en: "“For some way I heard nothing but the crackling twigs under my feet, the faint rustle of the breeze above, and my own breathing and the throb of the blood-vessels in my ears. Then I seemed to know of a pattering behind me. I pushed on grimly. The pattering grew more distinct, and then I caught the same queer sound and voices I had heard in the Underworld. There were evidently several of the Morlocks, and they were closing in upon me. Indeed, in another minute I felt a tug at my coat, then something at my arm. And Weena shivered violently, and became quite still."
    draft: true
    chunks:
      - pl: "Przez jakiś czas nie słyszałem nic poza trzaskiem gałązek pod stopami, słabym szelestem wiatru w górze, własnym oddechem i pulsowaniem naczyń krwionośnych w uszach."
        ru: "Какое-то время я не слышал ничего, кроме треска веточек под ногами, слабого шелеста ветра наверху, собственного дыхания и пульсации сосудов в ушах."
        note: "naczynie krwionośne — кровеносный сосуд"
      - pl: " Potem wydało mi się, że za mną coś tupocze."
        ru: "Потом мне почудился топот позади."
      - pl: " Szedłem zawzięcie dalej."
        ru: "Я упрямо шёл дальше."
        note: "zawzięcie — упрямо, ожесточённо"
      - pl: " Tupot stawał się wyraźniejszy, a potem dosłyszałem ten sam dziwny dźwięk i głosy, które słyszałem w Podziemnym Świecie."
        ru: "Топот становился отчётливее, а потом я уловил тот же странный звук и голоса, что слышал в Подземном Мире."
      - pl: " Najwyraźniej było tam kilku Morloków i otaczali mnie coraz ciaśniej."
        ru: "Очевидно, там было несколько морлоков, и они смыкали кольцо вокруг меня."
