paragraphs:
  - clean: "Po śmierci Zygmunta Augusta Rzeczpospolita po raz pierwszy w historii znalazła się bez króla i bez dynastii. Prawo nie mówiło jasno, co należy w takiej sytuacji zrobić. Władzę na czas bezkrólewia przejął prymas, arcybiskup gnieźnieński, którego nazwano interrexem, czyli zastępcą króla. Był nim wtedy Jakub Uchański, człowiek ostrożny, który w młodości sam sympatyzował z reformacją i opowiadał się za pokojem między wyznaniami. W poszczególnych województwach szlachta zawiązywała konfederacje, czyli związki, które miały pilnować porządku, sądzić przestępców i bronić granic. Nikt nie wiedział jeszcze, kto i w jaki sposób wybierze nowego władcę."
    draft: true
    chunks:
      - pl: "Po śmierci Zygmunta Augusta Rzeczpospolita po raz pierwszy w historii znalazła się bez króla i bez dynastii."
        ru: "После смерти Сигизмунда Августа Речь Посполитая впервые в истории оказалась без короля и без династии."
      - pl: " Prawo nie mówiło jasno, co należy w takiej sytuacji zrobić."
        ru: "Закон не говорил ясно, что следует делать в такой ситуации."
      - pl: " Władzę na czas bezkrólewia przejął prymas, arcybiskup gnieźnieński, którego nazwano interrexem, czyli zastępcą króla."
        ru: "Власть на время бескоролевья принял примас, архиепископ гнезненский, которого назвали интеррексом, то есть заместителем короля."
        note: "prymas — примас, глава польской церкви; zastępca — заместитель"
      - pl: " Był nim wtedy Jakub Uchański, człowiek ostrożny, który w młodości sam sympatyzował z reformacją i opowiadał się za pokojem między wyznaniami."
        ru: "Им был тогда Якуб Уханьский, человек осторожный, который в молодости сам сочувствовал Реформации и выступал за мир между вероисповеданиями."
        note: "sympatyzować — сочувствовать"
      - pl: " W poszczególnych województwach szlachta zawiązywała konfederacje, czyli związki, które miały pilnować porządku, sądzić przestępców i bronić granic."
        ru: "В отдельных воеводствах шляхта создавала конфедерации, то есть союзы, которые должны были поддерживать порядок, судить преступников и защищать границы."
        note: "poszczególny — отдельный; zawiązać — создать, заключить (союз); przestępca — преступник"
      - pl: " Nikt nie wiedział jeszcze, kto i w jaki sposób wybierze nowego władcę."
        ru: "Никто ещё не знал, кто и каким образом выберет нового государя."
    words: { "zastępcą": zastepca, "młodości": mlodosc, "poszczególnych": poszczegolny, "przestępców": przestepca, "władcę": wladca }
  - clean: "Najważniejszy spór dotyczył tego, kto ma prawo głosu. Senatorowie uważali, że wybór króla należy do nich. Szlachta średnia obawiała się, że magnaci sprzedadzą koronę temu, kto im najwięcej zapłaci. Młody i ambitny Jan Zamoyski, wtedy jeszcze tylko starosta, zaproponował rozwiązanie śmiałe i bardzo szlacheckie: elekcję „viritim”, czyli taką, w której każdy szlachcic może głosować osobiście. Propozycja zwyciężyła, bo każdy szlachcic chciał mieć wpływ na wybór króla. Rzeczpospolita stała się monarchią elekcyjną, w której wyborcami było kilkadziesiąt tysięcy ludzi."
    draft: true
    chunks:
      - pl: "Najważniejszy spór dotyczył tego, kto ma prawo głosu."
        ru: "Главный спор касался того, у кого есть право голоса."
      - pl: " Senatorowie uważali, że wybór króla należy do nich."
        ru: "Сенаторы считали, что выбор короля принадлежит им."
      - pl: " Szlachta średnia obawiała się, że magnaci sprzedadzą koronę temu, kto im najwięcej zapłaci."
        ru: "Средняя шляхта опасалась, что магнаты продадут корону тому, кто больше им заплатит."
      - pl: " Młody i ambitny Jan Zamoyski, wtedy jeszcze tylko starosta, zaproponował rozwiązanie śmiałe i bardzo szlacheckie: elekcję „viritim”, czyli taką, w której każdy szlachcic może głosować osobiście."
        ru: "Молодой и честолюбивый Ян Замойский, тогда ещё только староста, предложил решение смелое и очень шляхетское: элекцию «viritim», то есть такую, в которой каждый шляхтич может голосовать лично."
        note: "starosta — староста, королевский наместник; osobiście — лично"
      - pl: " Propozycja zwyciężyła, bo każdy szlachcic chciał mieć wpływ na wybór króla."
        ru: "Предложение победило, потому что каждый шляхтич хотел влиять на выбор короля."
      - pl: " Rzeczpospolita stała się monarchią elekcyjną, w której wyborcami było kilkadziesiąt tysięcy ludzi."
        ru: "Речь Посполитая стала выборной монархией, в которой избирателями были несколько десятков тысяч человек."
        note: "elekcyjny — выборный; wyborca — избиратель"
    words: { "średnia": sredni, "koronę": korona, "zaproponował": zaproponowac, "głosować": glosowac, "Propozycja": propozycja, "zwyciężyła": zwyciezyc }
  - clean: "Zanim jednak przystąpiono do elekcji, trzeba było rozwiązać inny problem. W sierpniu 1572 roku, kilka tygodni po śmierci Zygmunta Augusta, w Paryżu katolicy wymordowali w ciągu jednej nocy tysiące protestantów. Rzeź nazwano nocą świętego Bartłomieja, a wiadomość o niej wstrząsnęła Europą. W Polsce wielu szlachciców było protestantami, a większość katolikami. Wszyscy bali się, że w czasie bezkrólewia i elekcji spór religijny może zamienić się w wojnę domową."
    draft: true
    chunks:
      - pl: "Zanim jednak przystąpiono do elekcji, trzeba było rozwiązać inny problem."
        ru: "Но прежде чем приступить к элекции, нужно было решить другую проблему."
        note: "przystąpić — приступить"
      - pl: " W sierpniu 1572 roku, kilka tygodni po śmierci Zygmunta Augusta, w Paryżu katolicy wymordowali w ciągu jednej nocy tysiące protestantów."
        ru: "В августе 1572 года, через несколько недель после смерти Сигизмунда Августа, в Париже католики за одну ночь перебили тысячи протестантов."
      - pl: " Rzeź nazwano nocą świętego Bartłomieja, a wiadomość o niej wstrząsnęła Europą."
        ru: "Резню назвали Варфоломеевской ночью, и весть о ней потрясла Европу."
      - pl: " W Polsce wielu szlachciców było protestantami, a większość katolikami."
        ru: "В Польше многие шляхтичи были протестантами, а большинство — католиками."
      - pl: " Wszyscy bali się, że w czasie bezkrólewia i elekcji spór religijny może zamienić się w wojnę domową."
        ru: "Все боялись, что во время бескоролевья и элекции религиозный спор может превратиться в гражданскую войну."
    words: { "sierpniu": sierpien, "wstrząsnęła": wstrzasnac, "religijny": religijny }
  - clean: "28 stycznia 1573 roku szlachta zebrana na sejmie konwokacyjnym w Warszawie podpisała akt, który nazywamy konfederacją warszawską. Jego najważniejsze zdanie mówiło, że szlachcice, którzy różnią się w wierze, mają zachować między sobą pokój i nie przelewać krwi z powodu różnic w religii. Zobowiązali się też, że nie będą pomagać nikomu, kto chciałby prześladować innych za wiarę, nawet gdyby był to król albo urzędnik. Każdy nowy król musiał przysiąc, że będzie przestrzegał tej zasady."
    draft: true
    chunks:
      - pl: "28 stycznia 1573 roku szlachta zebrana na sejmie konwokacyjnym w Warszawie podpisała akt, który nazywamy konfederacją warszawską."
        ru: "28 января 1573 года шляхта, собравшаяся на конвокационном сейме в Варшаве, подписала акт, который мы называем Варшавской конфедерацией."
        note: "konwokacyjny — конвокационный, созывной"
      - pl: " Jego najważniejsze zdanie mówiło, że szlachcice, którzy różnią się w wierze, mają zachować między sobą pokój i nie przelewać krwi z powodu różnic w religii."
        ru: "Его главная фраза гласила, что шляхтичи, различающиеся в вере, должны сохранять между собой мир и не проливать крови из-за религиозных различий."
        note: "przelewać krew — проливать кровь"
      - pl: " Zobowiązali się też, że nie będą pomagać nikomu, kto chciałby prześladować innych za wiarę, nawet gdyby był to król albo urzędnik."
        ru: "Они обязались также не помогать никому, кто захотел бы преследовать других за веру, даже если бы это был король или чиновник."
      - pl: " Każdy nowy król musiał przysiąc, że będzie przestrzegał tej zasady."
        ru: "Каждый новый король должен был поклясться соблюдать этот принцип."
        note: "przysiąc — поклясться"
    words: { "stycznia": styczen, "religii": religia, "urzędnik": urzednik, "przysiąc": przysiegnac }
  - clean: "Konfederacja warszawska była jednym z pierwszych w Europie aktów prawnych, które gwarantowały wolność wyznania. Nie była doskonała: dotyczyła przede wszystkim szlachty i nie mówiła nic o prawach chłopów, którzy musieli zwykle przyjmować wiarę pana. Katoliccy biskupi, z wyjątkiem jednego, odmówili jej podpisania. Mimo to w czasach, gdy w całej Europie palono heretyków i toczono wojny religijne, był to akt niezwykły. Polskę nazywano wtedy „państwem bez stosów”, a do kraju przybywali prześladowani za wiarę ludzie z wielu krajów. W 2003 roku akt konfederacji wpisano na listę Pamięć Świata UNESCO."
    draft: true
    chunks:
      - pl: "Konfederacja warszawska była jednym z pierwszych w Europie aktów prawnych, które gwarantowały wolność wyznania."
        ru: "Варшавская конфедерация была одним из первых в Европе правовых актов, гарантировавших свободу вероисповедания."
        note: "wyznanie — вероисповедание"
      - pl: " Nie była doskonała: dotyczyła przede wszystkim szlachty i nie mówiła nic o prawach chłopów, którzy musieli zwykle przyjmować wiarę pana."
        ru: "Она не была совершенной: касалась прежде всего шляхты и ничего не говорила о правах крестьян, которым обычно приходилось принимать веру господина."
      - pl: " Katoliccy biskupi, z wyjątkiem jednego, odmówili jej podpisania."
        ru: "Католические епископы, за исключением одного, отказались её подписать."
      - pl: " Mimo to w czasach, gdy w całej Europie palono heretyków i toczono wojny religijne, był to akt niezwykły."
        ru: "Тем не менее во времена, когда по всей Европе жгли еретиков и вели религиозные войны, это был необыкновенный акт."
      - pl: " Polskę nazywano wtedy „państwem bez stosów”, a do kraju przybywali prześladowani za wiarę ludzie z wielu krajów."
        ru: "Польшу называли тогда «государством без костров», и в страну приезжали люди, гонимые за веру, из многих стран."
      - pl: " W 2003 roku akt konfederacji wpisano na listę Pamięć Świata UNESCO."
        ru: "В 2003 году акт конфедерации был внесён в список «Память мира» ЮНЕСКО."
    words: { "prawnych": prawny, "gwarantowały": gwarantowac, "chłopów": chlop, "przyjmować": przyjmowac, "wyjątkiem": wyjatek, "toczono": toczyc, "religijne": religijny, "niezwykły": niezwykly, "stosów": stos, "przybywali": przybywac, "wpisano": wpisac }
  - clean: "W kwietniu 1573 roku na polu pod wsią Kamień niedaleko Warszawy zebrało się kilkadziesiąt tysięcy szlachciców. Przyjeżdżali konno, z bronią, ze sługami i wozami pełnymi zapasów, bo elekcja mogła trwać tygodniami. Rozbijali namioty województwami, a w środku pola stała szopa, w której obradowali senatorowie. Było to największe zgromadzenie wyborców w ówczesnej Europie. Według różnych szacunków na pole elekcyjne przybyło od czterdziestu do pięćdziesięciu tysięcy szlachciców."
    draft: true
    chunks:
      - pl: "W kwietniu 1573 roku na polu pod wsią Kamień niedaleko Warszawy zebrało się kilkadziesiąt tysięcy szlachciców."
        ru: "В апреле 1573 года на поле у деревни Камень недалеко от Варшавы собралось несколько десятков тысяч шляхтичей."
      - pl: " Przyjeżdżali konno, z bronią, ze sługami i wozami pełnymi zapasów, bo elekcja mogła trwać tygodniami."
        ru: "Они приезжали верхом, с оружием, со слугами и повозками, полными припасов, потому что элекция могла длиться неделями."
      - pl: " Rozbijali namioty województwami, a w środku pola stała szopa, w której obradowali senatorowie."
        ru: "Они разбивали шатры по воеводствам, а посреди поля стоял навес, где совещались сенаторы."
        note: "szopa — навес, сарай"
      - pl: " Było to największe zgromadzenie wyborców w ówczesnej Europie."
        ru: "Это было крупнейшее собрание избирателей в тогдашней Европе."
        note: "zgromadzenie — собрание"
      - pl: " Według różnych szacunków na pole elekcyjne przybyło od czterdziestu do pięćdziesięciu tysięcy szlachciców."
        ru: "По разным оценкам, на элекционное поле прибыло от сорока до пятидесяти тысяч шляхтичей."
    words: { "kwietniu": kwiecien, "wsią": wies, "niedaleko": niedaleko, "Przyjeżdżali": przyjezdzac, "sługami": sluga, "zapasów": zapas, "namioty": namiot, "szopa": szopa, "ówczesnej": owczesny, "czterdziestu": czterdziesci, "pięćdziesięciu": piecdziesiat }
  - clean: "Kandydatów było kilku. Habsburgowie zgłosili arcyksięcia Ernesta, syna cesarza. Kandydował również król Szwecji, a nawet car Iwan Groźny, choć jego kandydatura budziła raczej strach niż entuzjazm. Francuzi zgłosili Henryka Walezego, brata króla Francji Karola IX. Jego poseł, sprytny biskup Jan de Monluc, obiecywał szlachcie wszystko: pieniądze, flotę na Bałtyku, wojsko przeciw Moskwie i studia dla młodzieży w Paryżu. Kłopot polegał na tym, że Henryk był jednym z organizatorów nocy świętego Bartłomieja. Monluc przekonywał jednak, że jego pan nie miał z tym nic wspólnego, i protestanci w końcu mu uwierzyli. W maju 1573 roku Henryk Walezy został wybrany na króla Polski."
    draft: true
    chunks:
      - pl: "Kandydatów było kilku."
        ru: "Кандидатов было несколько."
      - pl: " Habsburgowie zgłosili arcyksięcia Ernesta, syna cesarza."
        ru: "Габсбурги выдвинули эрцгерцога Эрнста, сына императора."
        note: "arcyksiążę — эрцгерцог"
      - pl: " Kandydował również król Szwecji, a nawet car Iwan Groźny, choć jego kandydatura budziła raczej strach niż entuzjazm."
        ru: "Выдвигались также король Швеции и даже царь Иван Грозный, хотя его кандидатура вызывала скорее страх, чем воодушевление."
        note: "kandydatura — кандидатура"
      - pl: " Francuzi zgłosili Henryka Walezego, brata króla Francji Karola IX."
        ru: "Французы выдвинули Генриха Валуа, брата французского короля Карла IX."
      - pl: " Jego poseł, sprytny biskup Jan de Monluc, obiecywał szlachcie wszystko: pieniądze, flotę na Bałtyku, wojsko przeciw Moskwie i studia dla młodzieży w Paryżu."
        ru: "Его посол, ловкий епископ Жан де Монлюк, обещал шляхте всё: деньги, флот на Балтике, войско против Москвы и учёбу для юношества в Париже."
        note: "sprytny — ловкий, хитрый"
      - pl: " Kłopot polegał na tym, że Henryk był jednym z organizatorów nocy świętego Bartłomieja."
        ru: "Беда заключалась в том, что Генрих был одним из организаторов Варфоломеевской ночи."
      - pl: " Monluc przekonywał jednak, że jego pan nie miał z tym nic wspólnego, i protestanci w końcu mu uwierzyli."
        ru: "Но Монлюк убеждал, что его господин не имел к этому никакого отношения, и протестанты в конце концов ему поверили."
      - pl: " W maju 1573 roku Henryk Walezy został wybrany na króla Polski."
        ru: "В мае 1573 года Генрих Валуа был избран королём Польши."
    words: { "Kandydatów": kandydat, "cesarza": cesarz, "car": car, "budziła": budzic, "sprytny": sprytny, "flotę": flota, "wojsko": wojsko, "młodzieży": mlodziez, "polegał": polegac, "maju": maj }
  - clean: "Zanim nowy król przyjechał, szlachta przygotowała warunki, które musiał zaprzysiąc. Pierwszy dokument nazwano od jego imienia artykułami henrykowskimi. Miał on obowiązywać każdego kolejnego władcę. Król nie mógł wyznaczyć następcy, bo po jego śmierci miała odbyć się wolna elekcja. Bez zgody sejmu nie mógł nakładać podatków, zwoływać pospolitego ruszenia ani wypowiadać wojny. Sejm miał się zbierać co dwa lata na sześć tygodni. Przy królu stale przebywać miało szesnastu senatorów, którzy mieli go kontrolować. Najbardziej niezwykły był ostatni punkt: jeśli król złamie prawa i przywileje szlachty, szlachta ma prawo wypowiedzieć mu posłuszeństwo."
    draft: true
    chunks:
      - pl: "Zanim nowy król przyjechał, szlachta przygotowała warunki, które musiał zaprzysiąc."
        ru: "Прежде чем новый король приехал, шляхта подготовила условия, которые он должен был поклясться соблюдать."
        note: "zaprzysiąc — присягнуть, поклясться"
      - pl: " Pierwszy dokument nazwano od jego imienia artykułami henrykowskimi."
        ru: "Первый документ назвали по его имени Генриковыми артикулами."
      - pl: " Miał on obowiązywać każdego kolejnego władcę."
        ru: "Он должен был обязывать каждого следующего государя."
      - pl: " Król nie mógł wyznaczyć następcy, bo po jego śmierci miała odbyć się wolna elekcja."
        ru: "Король не мог назначить преемника, потому что после его смерти должна была состояться вольная элекция."
        note: "wyznaczyć — назначить"
      - pl: " Bez zgody sejmu nie mógł nakładać podatków, zwoływać pospolitego ruszenia ani wypowiadać wojny."
        ru: "Без согласия сейма он не мог вводить налоги, созывать посполитое рушение или объявлять войну."
      - pl: " Sejm miał się zbierać co dwa lata na sześć tygodni."
