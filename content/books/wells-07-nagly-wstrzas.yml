  - clean: "Gdy przechodziłem przez wielki pałac, wydawało mi się, że mali ludzie mnie unikają. Może mi się zdawało, a może miało to coś wspólnego z moim waleniem w brązowe wrota. Byłem jednak dość pewien, że mnie unikają. Starałem się wszakże nie okazywać niepokoju ani nie ganiać za nimi, i po dniu czy dwóch wszystko wróciło do dawnego porządku. Robiłem, jakie mogłem, postępy w języku, a ponadto prowadziłem tu i tam swoje poszukiwania. Albo umykał mi jakiś subtelny szczegół, albo ich język był nadzwyczaj prosty — złożony niemal wyłącznie z konkretnych rzeczowników i czasowników."
    en: "“Going through the big palace, it seemed to me that the little people avoided me. It may have been my fancy, or it may have had something to do with my hammering at the gates of bronze. Yet I felt tolerably sure of the avoidance. I was careful, however, to show no concern and to abstain from any pursuit of them, and in the course of a day or two things got back to the old footing. I made what progress I could in the language, and in addition I pushed my explorations here and there. Either I missed some subtle point or their language was excessively simple—almost exclusively composed of concrete substantives and verbs."
    draft: true
