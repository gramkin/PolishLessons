paragraphs:
  - clean: "Gdy tak stałem, rozmyślając nad tym zbyt doskonałym triumfem człowieka, księżyc w pełni, żółty i wypukły, wzeszedł na północnym wschodzie z rozlewiska srebrnego światła. Jasne małe postacie w dole przestały się kręcić, bezszelestna sowa przemknęła obok, a ja zadrżałem z nocnego chłodu. Postanowiłem zejść na dół i poszukać miejsca do spania."
    en: "“As I stood there musing over this too perfect triumph of man, the full moon, yellow and gibbous, came up out of an overflow of silver light in the north-east. The bright little figures ceased to move about below, a noiseless owl flitted by, and I shivered with the chill of the night. I determined to descend and find where I could sleep."
    draft: true
    chunks:
      - pl: "Gdy tak stałem, rozmyślając nad tym zbyt doskonałym triumfem człowieka,"
        ru: "Пока я так стоял, размышляя об этом слишком совершенном торжестве человека,"
      - pl: " księżyc w pełni, żółty i wypukły, wzeszedł na północnym wschodzie z rozlewiska srebrnego światła."
        ru: "полная луна, жёлтая и выпуклая, взошла на северо-востоке из разлива серебряного света."
        note: "wzejść — взойти; rozlewisko — разлив"
      - pl: " Jasne małe postacie w dole przestały się kręcić, bezszelestna sowa przemknęła obok, a ja zadrżałem z nocnego chłodu."
        ru: "Яркие маленькие фигурки внизу перестали сновать, бесшумная сова пролетела мимо, а я задрожал от ночного холода."
        note: "sowa — сова"
      - pl: " Postanowiłem zejść na dół i poszukać miejsca do spania."
        ru: "Я решил спуститься и найти, где бы мне выспаться."
    words: { "żółty": zolty, "północnym": polnocny, "wschodzie": wschod, "srebrnego": srebrny, "postacie": postac, "nocnego": nocny }
  - clean: "Szukałem wzrokiem budowli, którą znałem. Potem mój wzrok powędrował do postaci Białego Sfinksa na brązowym cokole, coraz wyraźniejszej w miarę, jak światło wschodzącego księżyca jaśniało. Widziałem na jego tle srebrzystą brzozę. Była tam gęstwina krzaków różanecznika, czarna w bladym świetle, i był mały trawnik. Spojrzałem znowu na trawnik. Dziwna wątpliwość zmroziła moje zadowolenie z siebie. „Nie — powiedziałem sobie stanowczo — to nie był ten trawnik”."
    en: "“I looked for the building I knew. Then my eye travelled along to the figure of the White Sphinx upon the pedestal of bronze, growing distinct as the light of the rising moon grew brighter. I could see the silver birch against it. There was the tangle of rhododendron bushes, black in the pale light, and there was the little lawn. I looked at the lawn again. A queer doubt chilled my complacency. ‘No,’ said I stoutly to myself, ‘that was not the lawn.’"
    draft: true
    chunks:
      - pl: "Szukałem wzrokiem budowli, którą znałem."
        ru: "Я поискал глазами знакомое здание."
      - pl: " Potem mój wzrok powędrował do postaci Białego Sfinksa na brązowym cokole, coraz wyraźniejszej w miarę, jak światło wschodzącego księżyca jaśniało."
        ru: "Потом мой взгляд переместился к фигуре Белого Сфинкса на бронзовом пьедестале, всё отчётливее проступавшей по мере того, как свет восходящей луны становился ярче."
        note: "powędrować — переместиться"
      - pl: " Widziałem na jego tle srebrzystą brzozę."
        ru: "На его фоне я видел серебристую берёзу."
        note: "na tle — на фоне"
      - pl: " Była tam gęstwina krzaków różanecznika, czarna w bladym świetle, i był mały trawnik."
        ru: "Там была чаща рододендронов, чёрная в бледном свете, и была маленькая лужайка."
        note: "gęstwina — чаща"
      - pl: " Spojrzałem znowu na trawnik."
        ru: "Я снова взглянул на лужайку."
      - pl: " Dziwna wątpliwość zmroziła moje zadowolenie z siebie."
        ru: "Странное сомнение остудило моё самодовольство."
        note: "zmrozić — заморозить, остудить"
      - pl: " „Nie — powiedziałem sobie stanowczo — to nie był ten trawnik”."
        ru: "«Нет, — твёрдо сказал я себе, — это не та лужайка»."
    words: { "wzrokiem": wzrok, "brązowym": brazowy, "miarę": miara, "bladym": blady, "wątpliwość": watpliwosc, "stanowczo": stanowczo }
  - clean: "Ale to był ten trawnik. Biała, trędowata twarz sfinksa była bowiem zwrócona ku niemu. Czy potraficie sobie wyobrazić, co poczułem, gdy dotarło do mnie to przekonanie? Nie potraficie. Wehikuł Czasu zniknął!"
    en: "“But it was the lawn. For the white leprous face of the sphinx was towards it. Can you imagine what I felt as this conviction came home to me? But you cannot. The Time Machine was gone!"
    draft: true
    chunks:
      - pl: "Ale to był ten trawnik."
        ru: "Но это была та самая лужайка."
      - pl: " Biała, trędowata twarz sfinksa była bowiem zwrócona ku niemu."
        ru: "Ведь белое, словно прокажённое лицо сфинкса было обращено к ней."
        note: "trędowaty — прокажённый"
      - pl: " Czy potraficie sobie wyobrazić, co poczułem, gdy dotarło do mnie to przekonanie?"
        ru: "Можете ли вы представить, что я почувствовал, когда до меня дошла эта уверенность?"
      - pl: " Nie potraficie."
        ru: "Нет, не можете."
      - pl: " Wehikuł Czasu zniknął!"
        ru: "Машина Времени исчезла!"
    words: { "Biała": bialy, "zwrócona": zwrocic, "wyobrazić": wyobrazic, "dotarło": dotrzec, "zniknął": zniknac }
  - clean: "Natychmiast, jak smagnięcie batem przez twarz, przyszła myśl, że mogę utracić własną epokę, że zostanę bezradny w tym dziwnym nowym świecie. Sama ta myśl była prawdziwym fizycznym doznaniem. Czułem, jak chwyta mnie za gardło i odbiera oddech. W następnej chwili, w szale strachu, biegłem wielkimi susami w dół zbocza. Raz upadłem jak długi i rozciąłem sobie twarz; nie traciłem czasu na tamowanie krwi, tylko zerwałem się i biegłem dalej, z ciepłą strużką spływającą po policzku i brodzie."
    en: "“At once, like a lash across the face, came the possibility of losing my own age, of being left helpless in this strange new world. The bare thought of it was an actual physical sensation. I could feel it grip me at the throat and stop my breathing. In another moment I was in a passion of fear and running with great leaping strides down the slope. Once I fell headlong and cut my face; I lost no time in stanching the blood, but jumped up and ran on, with a warm trickle down my cheek and chin."
    draft: true
    chunks:
      - pl: "Natychmiast, jak smagnięcie batem przez twarz, przyszła myśl, że mogę utracić własną epokę,"
        ru: "Тотчас, как удар хлыстом по лицу, пришла мысль, что я могу утратить свою эпоху,"
        note: "smagnięcie — удар (хлыстом); bat — кнут"
      - pl: " że zostanę bezradny w tym dziwnym nowym świecie."
        ru: "что останусь беспомощным в этом странном новом мире."
      - pl: " Sama ta myśl była prawdziwym fizycznym doznaniem."
        ru: "Одна эта мысль была настоящим физическим ощущением."
      - pl: " Czułem, jak chwyta mnie za gardło i odbiera oddech."
        ru: "Я чувствовал, как она хватает меня за горло и не даёт дышать."
      - pl: " W następnej chwili, w szale strachu, biegłem wielkimi susami w dół zbocza."
        ru: "В следующий миг, в исступлении страха, я мчался огромными прыжками вниз по склону."
        note: "sus — прыжок, скачок"
      - pl: " Raz upadłem jak długi i rozciąłem sobie twarz;"
        ru: "Однажды я растянулся во весь рост и рассёк себе лицо;"
        note: "upaść jak długi — растянуться во весь рост"
      - pl: " nie traciłem czasu na tamowanie krwi, tylko zerwałem się i biegłem dalej, z ciepłą strużką spływającą po policzku i brodzie."
        ru: "я не стал тратить время, чтобы остановить кровь, а вскочил и побежал дальше, и тёплая струйка стекала по щеке и подбородку."
        note: "tamować — останавливать (кровь); strużka — струйка"
    words: { "fizycznym": fizyczny, "szale": szal, "upadłem": upasc, "policzku": policzek, "brodzie": broda }
  - clean: "Przez cały czas, gdy biegłem, mówiłem do siebie: „Przesunęli ją trochę, wepchnęli pod krzaki, żeby nie zawadzała”. Mimo to biegłem ile sił w nogach. Przez cały czas, z tą pewnością, która czasem przychodzi z nadmiernym lękiem, wiedziałem, że takie zapewnienie to szaleństwo, wiedziałem instynktownie, że maszynę usunięto poza mój zasięg. Oddychałem z bólem. Przypuszczam, że całą drogę od grzbietu wzgórza do małego trawnika, może dwie mile, przebyłem w dziesięć minut."
    en: "All the time I ran I was saying to myself: ‘They have moved it a little, pushed it under the bushes out of the way.’ Nevertheless, I ran with all my might. All the time, with the certainty that sometimes comes with excessive dread, I knew that such assurance was folly, knew instinctively that the machine was removed out of my reach. My breath came with pain. I suppose I covered the whole distance from the hill crest to the little lawn, two miles perhaps, in ten minutes."
    draft: true
    chunks:
      - pl: "Przez cały czas, gdy biegłem, mówiłem do siebie: „Przesunęli ją trochę, wepchnęli pod krzaki, żeby nie zawadzała”."
        ru: "Всё время, пока бежал, я твердил себе: «Её чуть-чуть передвинули, затолкали под кусты, чтобы не мешала»."
        note: "zawadzać — мешать"
      - pl: " Mimo to biegłem ile sił w nogach."
        ru: "Тем не менее я бежал изо всех сил."
        note: "ile sił w nogach — со всех ног"
      - pl: " Przez cały czas, z tą pewnością, która czasem przychodzi z nadmiernym lękiem,"
        ru: "Всё это время, с той уверенностью, которая порой приходит вместе с чрезмерным страхом,"
      - pl: " wiedziałem, że takie zapewnienie to szaleństwo, wiedziałem instynktownie, że maszynę usunięto poza mój zasięg."
        ru: "я знал, что такое утешение — безумие, инстинктивно знал, что машину унесли туда, куда мне не дотянуться."
        note: "zasięg — досягаемость"
      - pl: " Oddychałem z bólem."
        ru: "Я дышал с болью."
      - pl: " Przypuszczam, że całą drogę od grzbietu wzgórza do małego trawnika, może dwie mile, przebyłem w dziesięć minut."
        ru: "Полагаю, весь путь от гребня холма до маленькой лужайки, мили две, я покрыл за десять минут."
    words: { "Przesunęli": przesunac, "lękiem": lek-2, "zasięg": zasieg, "wzgórza": wzgorze, "przebyłem": przebyc }
  - clean: "A nie jestem młodym człowiekiem. Biegnąc, przeklinałem na głos swoją pewną siebie głupotę, że zostawiłem maszynę, i marnowałem przy tym cenny oddech. Wołałem głośno i nikt nie odpowiadał. W tym skąpanym w księżycowym blasku świecie zdawało się, że nie porusza się żadna istota."
    en: "And I am not a young man. I cursed aloud, as I ran, at my confident folly in leaving the machine, wasting good breath thereby. I cried aloud, and none answered. Not a creature seemed to be stirring in that moonlit world."
    draft: true
    chunks:
      - pl: "A nie jestem młodym człowiekiem."
        ru: "А ведь я человек не молодой."
      - pl: " Biegnąc, przeklinałem na głos swoją pewną siebie głupotę, że zostawiłem maszynę, i marnowałem przy tym cenny oddech."
        ru: "На бегу я вслух проклинал свою самоуверенную глупость — оставить машину! — и тратил на это драгоценное дыхание."
        note: "przeklinać — проклинать"
      - pl: " Wołałem głośno i nikt nie odpowiadał."
        ru: "Я громко кричал, и никто не отвечал."
      - pl: " W tym skąpanym w księżycowym blasku świecie zdawało się, że nie porusza się żadna istota."
        ru: "В этом залитом лунным светом мире, казалось, не шевелилось ни одно существо."
        note: "skąpany — залитый, омытый"
    words: { "głupotę": glupota, "cenny": cenny, "Wołałem": wolac, "głośno": glosno, "księżycowym": ksiezycowy, "blasku": blask }
  - clean: "Gdy dobiegłem do trawnika, moje najgorsze obawy się sprawdziły. Nie było widać ani śladu maszyny. Zrobiło mi się słabo i zimno, gdy stanąłem przed pustym miejscem wśród czarnej gęstwiny krzaków. Obiegłem je wściekle dookoła, jakby maszyna mogła się gdzieś ukryć w kącie, a potem nagle stanąłem, chwytając się rękami za włosy. Nade mną górował sfinks na brązowym cokole, biały, lśniący, trędowaty, w świetle wschodzącego księżyca. Zdawał się uśmiechać, drwiąc z mojej rozpaczy."
    en: "“When I reached the lawn my worst fears were realised. Not a trace of the thing was to be seen. I felt faint and cold when I faced the empty space among the black tangle of bushes. I ran round it furiously, as if the thing might be hidden in a corner, and then stopped abruptly, with my hands clutching my hair. Above me towered the sphinx, upon the bronze pedestal, white, shining, leprous, in the light of the rising moon. It seemed to smile in mockery of my dismay."
    draft: true
    chunks:
      - pl: "Gdy dobiegłem do trawnika, moje najgorsze obawy się sprawdziły."
        ru: "Когда я добежал до лужайки, мои худшие опасения подтвердились."
        note: "sprawdzić się — сбыться"
      - pl: " Nie było widać ani śladu maszyny."
        ru: "Машины не было и следа."
      - pl: " Zrobiło mi się słabo i zimno, gdy stanąłem przed pustym miejscem wśród czarnej gęstwiny krzaków."
        ru: "Мне стало дурно и холодно, когда я оказался перед пустым местом среди чёрной чащи кустов."
      - pl: " Obiegłem je wściekle dookoła, jakby maszyna mogła się gdzieś ukryć w kącie, a potem nagle stanąłem, chwytając się rękami za włosy."
        ru: "Я в бешенстве обежал его кругом, будто машина могла спрятаться где-нибудь в углу, а потом вдруг остановился, вцепившись руками в волосы."
      - pl: " Nade mną górował sfinks na brązowym cokole, biały, lśniący, trędowaty, w świetle wschodzącego księżyca."
        ru: "Надо мной возвышался сфинкс на бронзовом пьедестале, белый, сияющий, прокажённый, в свете восходящей луны."
        note: "górować — возвышаться"
      - pl: " Zdawał się uśmiechać, drwiąc z mojej rozpaczy."
        ru: "Казалось, он улыбается, насмехаясь над моим отчаянием."
        note: "drwić — насмехаться"
    words: { "dobiegłem": dobiec, "zimno": zimno, "kącie": kat, "brązowym": brazowy, "drwiąc": drwic, "rozpaczy": rozpacz }
  - clean: "Mógłbym się pocieszać, wyobrażając sobie, że mali ludzie schowali dla mnie mechanizm w jakimś schronieniu, gdybym nie był pewien ich fizycznej i umysłowej nieporadności. To właśnie mnie przerażało: poczucie jakiejś nieznanej dotąd siły, za której sprawą mój wynalazek zniknął. Jednego byłem jednak pewien: o ile jakaś inna epoka nie wyprodukowała jej dokładnego duplikatu, maszyna nie mogła przesunąć się w czasie. Sposób mocowania dźwigni — pokażę wam go później — nie pozwalał nikomu przy niej majstrować w ten sposób, gdy je zdjęto. Przesunięto ją i ukryto tylko w przestrzeni. Ale w takim razie gdzie mogła być?"
    en: "“I might have consoled myself by imagining the little people had put the mechanism in some shelter for me, had I not felt assured of their physical and intellectual inadequacy. That is what dismayed me: the sense of some hitherto unsuspected power, through whose intervention my invention had vanished. Yet, for one thing I felt assured: unless some other age had produced its exact duplicate, the machine could not have moved in time. The attachment of the levers—I will show you the method later—prevented anyone from tampering with it in that way when they were removed. It had moved, and was hid, only in space. But then, where could it be?"
    draft: true
    chunks:
      - pl: "Mógłbym się pocieszać, wyobrażając sobie, że mali ludzie schowali dla mnie mechanizm w jakimś schronieniu,"
        ru: "Я мог бы утешаться, воображая, что маленькие люди убрали для меня механизм в какое-нибудь укрытие,"
      - pl: " gdybym nie był pewien ich fizycznej i umysłowej nieporadności."
        ru: "если бы не был уверен в их физической и умственной беспомощности."
        note: "nieporadność — беспомощность"
      - pl: " To właśnie mnie przerażało: poczucie jakiejś nieznanej dotąd siły, za której sprawą mój wynalazek zniknął."
        ru: "Вот что меня пугало: ощущение некой до сих пор неведомой силы, по чьей воле исчезло моё изобретение."
        note: "za czyjąś sprawą — по чьей-л. милости"
      - pl: " Jednego byłem jednak pewien: o ile jakaś inna epoka nie wyprodukowała jej dokładnego duplikatu, maszyna nie mogła przesunąć się w czasie."
        ru: "Однако в одном я был уверен: если только какая-нибудь другая эпоха не произвела её точной копии, машина не могла переместиться во времени."
      - pl: " Sposób mocowania dźwigni — pokażę wam go później — nie pozwalał nikomu przy niej majstrować w ten sposób, gdy je zdjęto."
        ru: "Способ крепления рычагов — я покажу вам его позже — не позволял никому таким способом с ней повозиться, когда рычаги сняты."
        note: "majstrować — возиться, ковыряться"
      - pl: " Przesunięto ją i ukryto tylko w przestrzeni."
        ru: "Её передвинули и спрятали только в пространстве."
      - pl: " Ale w takim razie gdzie mogła być?"
        ru: "Но тогда где же она могла быть?"
    words: { "schronieniu": schronienie, "fizycznej": fizyczny, "dotąd": dotad, "dokładnego": dokladny, "przesunąć": przesunac, "przestrzeni": przestrzen }
  - clean: "Chyba ogarnął mnie jakiś szał. Pamiętam, jak gwałtownie biegałem tam i z powrotem między oświetlonymi księżycem krzakami dokoła sfinksa i spłoszyłem jakieś białe zwierzę, które w mdłym świetle wziąłem za małego jelenia. Pamiętam też, jak późno w nocy tłukłem zaciśniętą pięścią w krzaki, aż połamane gałązki porozcinały mi knykcie do krwi. Potem, łkając i bredząc w udręce ducha, zszedłem do wielkiej kamiennej budowli. Wielka sala była ciemna, cicha i pusta. Pośliznąłem się na nierównej posadzce i upadłem na jeden z malachitowych stołów, omal nie łamiąc sobie goleni. Zapaliłem zapałkę i poszedłem dalej, za zakurzone zasłony, o których wam mówiłem."
    en: "“I think I must have had a kind of frenzy. I remember running violently in and out among the moonlit bushes all round the sphinx, and startling some white animal that, in the dim light, I took for a small deer. I remember, too, late that night, beating the bushes with my clenched fist until my knuckles were gashed and bleeding from the broken twigs. Then, sobbing and raving in my anguish of mind, I went down to the great building of stone. The big hall was dark, silent, and deserted. I slipped on the uneven floor, and fell over one of the malachite tables, almost breaking my shin. I lit a match and went on past the dusty curtains, of which I have told you."
    draft: true
    chunks:
      - pl: "Chyba ogarnął mnie jakiś szał."
        ru: "Думаю, на меня нашло что-то вроде помешательства."
