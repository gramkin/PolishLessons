  - clean: "Pojęć abstrakcyjnych było, zdaje się, niewiele, jeśli w ogóle, a mowy przenośnej używano mało. Ich zdania były zwykle proste i dwuwyrazowe, a ja nie umiałem ani przekazać, ani zrozumieć niczego poza najprostszymi twierdzeniami. Postanowiłem odłożyć myśl o moim Wehikule Czasu i zagadkę brązowych drzwi pod sfinksem jak najdalej w kąt pamięci, dopóki rosnąca wiedza nie doprowadzi mnie do nich w naturalny sposób. Mimo to pewne uczucie, jak możecie zrozumieć, trzymało mnie na uwięzi w kręgu kilku mil wokół miejsca mojego przybycia."
    en: "There seemed to be few, if any, abstract terms, or little use of figurative language. Their sentences were usually simple and of two words, and I failed to convey or understand any but the simplest propositions. I determined to put the thought of my Time Machine and the mystery of the bronze doors under the sphinx, as much as possible in a corner of memory, until my growing knowledge would lead me back to them in a natural way. Yet a certain feeling, you may understand, tethered me in a circle of a few miles round the point of my arrival."
