chapterTitle: "Pieśń XXVI"
chapterTitleRu: "Песнь XXVI. Испытание в любви. Адам"
level: B2
paragraphs:
  - clean: "Ciąg dalszy. Poeta ociemniał. Św. Jan wypytuje go o miłość. Wzrok poety wraca mu się, widzi znowu Beatrycze, potem Adama. Rzecz o pobycie Adama w raju, o jego zgrzeszeniu i mowie ludzkiej."
    chunks:
      - pl: "Ciąg dalszy. Poeta ociemniał. Św. Jan wypytuje go o miłość. Wzrok poety wraca mu się, widzi znowu Beatrycze, potem Adama. Rzecz o pobycie Adama w raju, o jego zgrzeszeniu i mowie ludzkiej."
        ru: "Продолжение. Поэт ослеп. Святой Иоанн расспрашивает его о любви. Зрение возвращается к поэту, он снова видит Беатриче, потом Адама. Речь о пребывании Адама в раю, о его грехопадении и о человеческом языке."
    words: { "Ciąg": ciag, "dalszy": daleki, "Poeta": poeta, "Wzrok": wzrok, "raju": raj, "ludzkiej": ludzki }
  - clean: "Podczas gdym chwiał się, co bez wzroku zrobię,\nZ płomienia, który ślepiący blask rzucił,\nGłos wyszedł, na siebie uwagę mą zwrócił,\nMówiąc: — «Nim przejrzy wzrok twój ociemniały\nW chwili, gdy we mnie zatopił się cały,\nMówieniem siebie pocieszaj w olśnieniu."
    verse: true
    chunks:
      - pl: "Podczas gdym chwiał się, co bez wzroku zrobię,"
        ru: "Пока я колебался, что делать без зрения,"
      - pl: "\nZ płomienia, który ślepiący blask rzucił,"
        ru: "из пламени, что бросило слепящий блеск,"
      - pl: "\nGłos wyszedł, na siebie uwagę mą zwrócił,"
        ru: "вышел голос и обратил на себя моё внимание,"
      - pl: "\nMówiąc: — «Nim przejrzy wzrok twój ociemniały"
        ru: "говоря: — «Пока не прозреет твой ослепший взгляд,"
      - pl: "\nW chwili, gdy we mnie zatopił się cały,"
        ru: "в тот миг, когда он весь погрузился в меня,"
      - pl: "\nMówieniem siebie pocieszaj w olśnieniu."
        ru: "утешай себя в ослеплении речью."
    words: { "płomienia": plomien, "blask": blask, "rzucił": rzucic, "Głos": glos, "zwrócił": zwrocic, "przejrzy": przejrzec }
  - clean: "Mów, twoją duszę gdzie żądza unosi?\nWierz, wzrok się zbłąkał, lecz nie zamarł w tobie;\nBo przewodniczka twoja ma w spojrzeniu\nMoc, jaką miała dłoń Ananijasza».\nRzekłem: — «Jak zechce, ona przyjdzie w porę\nW pomoc mym oczom, które były drzwiami,\nGdy weszła z ogniem, jakim zawsze gore."
    verse: true
    chunks:
      - pl: "Mów, twoją duszę gdzie żądza unosi?"
        ru: "Скажи, куда устремляется желание твоей души?"
      - pl: "\nWierz, wzrok się zbłąkał, lecz nie zamarł w tobie;"
        ru: "Верь, взгляд в тебе заблудился, но не умер;"
      - pl: "\nBo przewodniczka twoja ma w spojrzeniu"
        ru: "ибо у твоей путеводительницы во взгляде"
      - pl: "\nMoc, jaką miała dłoń Ananijasza»."
        ru: "та сила, какая была в руке Анании»."
        note: "исцелил слепоту Павла"
      - pl: "\nRzekłem: — «Jak zechce, ona przyjdzie w porę"
        ru: "Я сказал: — «Как она захочет, пусть придёт вовремя"
      - pl: "\nW pomoc mym oczom, które były drzwiami,"
        ru: "на помощь моим глазам, которые были дверьми,"
      - pl: "\nGdy weszła z ogniem, jakim zawsze gore."
        ru: "когда она вошла с огнём, которым я всегда горю."
    words: { "dłoń": dlon, "Rzekłem": rzec, "zechce": zechciec, "porę": pora, "drzwiami": drzwi, "ogniem": ogien }
  - clean: "Dobro, ta radość dworu niebieskiego,\nJest wszechpism świata Alfą i Omegą,\nRozmaitymi pisanych głoskami,\nCo miłość łatwo lub trudno mi czyta».\nTen głos, co ze mnie zdjął bojaźń ślepoty,\nMówić z nim dłużej dodał mi ochoty,\nI rzekł: — «Sczyść siebie dnem gęstszego sita;\nMusisz powiedzieć, łuk twój z celów wielu\nCo skierowało do takiego celu?»"
    verse: true
    chunks:
      - pl: "Dobro, ta radość dworu niebieskiego,"
        ru: "Добро, эта радость небесного двора,"
      - pl: "\nJest wszechpism świata Alfą i Omegą,"
        ru: "есть Альфа и Омега всех писаний мира,"
      - pl: "\nRozmaitymi pisanych głoskami,"
        ru: "написанных разными буквами,"
        note: "głoska — звук, буква"
      - pl: "\nCo miłość łatwo lub trudno mi czyta»."
        ru: "которые любовь читает мне легко или трудно»."
      - pl: "\nTen głos, co ze mnie zdjął bojaźń ślepoty,"
        ru: "Этот голос, что снял с меня страх слепоты,"
      - pl: "\nMówić z nim dłużej dodał mi ochoty,"
        ru: "придал мне охоты говорить с ним дольше"
      - pl: "\nI rzekł: — «Sczyść siebie dnem gęstszego sita;"
        ru: "и сказал: — «Просей себя дном более частого сита;"
      - pl: "\nMusisz powiedzieć, łuk twój z celów wielu"
        ru: "ты должен сказать: что направило твой лук"
      - pl: "\nCo skierowało do takiego celu?»"
        ru: "из многих целей к такой цели?»"
    words: { "radość": radosc, "dworu": dwor, "niebieskiego": niebieski, "Alfą": alfa, "dodał": dodac, "skierowało": skierowac }
  - clean: "«Filozofija» rzekłem «i powaga,\nKtóra stąd schodzi, tę miłość skrą z nieba\nZapala we mnie i płomień jej wzmaga.\nBo dobro, odkąd je pojmiem, jak trzeba,\nZapala miłość i żywiej przenika,\nIm więcej w sobie dobroci zamyka."
    verse: true
    chunks:
      - pl: "«Filozofija» rzekłem «i powaga,"
        ru: "«Философия, — сказал я, — и авторитет,"
      - pl: "\nKtóra stąd schodzi, tę miłość skrą z nieba"
        ru: "что сходит отсюда, эту любовь искрой с неба"
        note: "skra — искра"
      - pl: "\nZapala we mnie i płomień jej wzmaga."
        ru: "зажигают во мне и усиливают её пламя."
      - pl: "\nBo dobro, odkąd je pojmiem, jak trzeba,"
        ru: "Ибо добро, как только мы постигнем его как должно,"
      - pl: "\nZapala miłość i żywiej przenika,"
        ru: "зажигает любовь и тем живее проникает,"
      - pl: "\nIm więcej w sobie dobroci zamyka."
        ru: "чем больше доброты в себе заключает."
    words: { "powaga": powaga, "schodzi": schodzic, "odkąd": odkad, "żywiej": zywo, "dobroci": dobroc, "zamyka": zamykac }
  - clean: "Więc do tej treści, w czym znak jej dobroci,\nŻe wszelkie dobre, co zewnątrz jej błyska\nTylko promieniem jest od jej ogniska,\nNiechaj z miłością wszelki duch się zwróci\nTego, w kim prawda objawia się szczera,\nNa zrębie której ten dowód się wspiera:\nTę prawdę odkrył memu rozumowi\nTen, który miłość, co serca porywa\nWszystkim co boskie, rad pierwszą nazywa:\nTę prawdę jeszcze dowodzą mi słowa\nPrawdomównego Stwórcy, który mówi\nW głos do Mojżesza, sam mówiąc o sobie:"
    verse: true
    chunks:
      - pl: "Więc do tej treści, w czym znak jej dobroci,"
        ru: "Итак, к той сущности, знак доброты которой в том,"
      - pl: "\nŻe wszelkie dobre, co zewnątrz jej błyska"
        ru: "что всякое благо, сверкающее вне её,"
      - pl: "\nTylko promieniem jest od jej ogniska,"
        ru: "есть лишь луч от её очага,"
      - pl: "\nNiechaj z miłością wszelki duch się zwróci"
        ru: "пусть с любовью обратится всякий дух,"
      - pl: "\nTego, w kim prawda objawia się szczera,"
        ru: "кому открывается чистая истина,"
      - pl: "\nNa zrębie której ten dowód się wspiera:"
        ru: "на основании которой держится этот довод."
        note: "zrąb — основание, сруб"
      - pl: "\nTę prawdę odkrył memu rozumowi"
        ru: "Эту истину открыл моему разуму"
      - pl: "\nTen, który miłość, co serca porywa"
        ru: "тот, кто любовь, что увлекает сердца"
        note: "Аристотель"
      - pl: "\nWszystkim co boskie, rad pierwszą nazywa:"
        ru: "ко всему божественному, охотно называет первой."
      - pl: "\nTę prawdę jeszcze dowodzą mi słowa"
        ru: "Эту истину доказывают мне ещё слова"
      - pl: "\nPrawdomównego Stwórcy, który mówi"
        ru: "правдивого Творца, который говорит"
      - pl: "\nW głos do Mojżesza, sam mówiąc o sobie:"
        ru: "вслух Моисею, сам говоря о себе:"
    words: { "wszelkie": wszelki, "promieniem": promien, "ogniska": ognisko, "wspiera": wspierac, "rozumowi": rozum, "dowodzą": dowodzic }
  - clean: "»Najwyższe dobro ja pokażę tobie.«\nTy ją dowodzisz, pierwsza przed wszystkimi\nO najwznioślejsza wieści heroldowa!\nSkrytości nieba zwiastująca ziemi».\nSłyszałem: — «W imię więc ziemskiej mądrości,\nW imię powagi, która z nią jest w zgodzie,\nBoga największą miłuj z twych miłości."
    verse: true
    chunks:
      - pl: "»Najwyższe dobro ja pokażę tobie.«"
        ru: "„Я покажу тебе высшее благо“."
      - pl: "\nTy ją dowodzisz, pierwsza przed wszystkimi"
        ru: "Ты доказываешь её, первая перед всеми,"
        note: "Евангелие от Иоанна"
      - pl: "\nO najwznioślejsza wieści heroldowa!"
        ru: "о высочайшая весть глашатая,"
        note: "herold — глашатай"
      - pl: "\nSkrytości nieba zwiastująca ziemi»."
        ru: "возвещающая земле сокровенное неба»."
      - pl: "\nSłyszałem: — «W imię więc ziemskiej mądrości,"
        ru: "Я услышал: — «Итак, во имя земной мудрости,"
      - pl: "\nW imię powagi, która z nią jest w zgodzie,"
        ru: "во имя авторитета, что согласен с ней,"
      - pl: "\nBoga największą miłuj z twych miłości."
        ru: "люби Бога величайшей из своих любовей."
    words: { "wieści": wiesc, "nieba": niebo, "ziemskiej": ziemski, "mądrości": madrosc, "zgodzie": zgoda, "miłości": milosc }
  - clean: "Lecz mów, czy czujesz inne struny w sobie,\nKtóre ku Niemu ciągną cię w tej dobie,\nIlu ostrzami ta miłość cię bodzie?»\nZ Chrystusowego orła zapowiedzi\nZgadłem, gdzie zwrócić chciał prąd mej spowiedzi,\nWięc rzekłem: — «Wszystkie te ostrza, co mogą\nZwrócić ku Bogu tą czy inną drogą\nZmysły i serce, jakby się zmówiły,\nW jedno ognisko miłość mą roztliły."
    verse: true
    chunks:
      - pl: "Lecz mów, czy czujesz inne struny w sobie,"
        ru: "Но скажи, чувствуешь ли в себе иные струны,"
      - pl: "\nKtóre ku Niemu ciągną cię w tej dobie,"
        ru: "что влекут тебя к Нему в эту пору,"
      - pl: "\nIlu ostrzami ta miłość cię bodzie?»"
        ru: "сколькими остриями колет тебя эта любовь?»"
        note: "bóść — бодать, колоть"
      - pl: "\nZ Chrystusowego orła zapowiedzi"
        ru: "По намерению Христова орла"
        note: "Иоанн, символ — орёл"
      - pl: "\nZgadłem, gdzie zwrócić chciał prąd mej spowiedzi,"
        ru: "я угадал, куда он хотел направить течение моей исповеди,"
      - pl: "\nWięc rzekłem: — «Wszystkie te ostrza, co mogą"
        ru: "и сказал: — «Все эти острия, что могут"
      - pl: "\nZwrócić ku Bogu tą czy inną drogą"
        ru: "обратить к Богу тем или иным путём"
      - pl: "\nZmysły i serce, jakby się zmówiły,"
        ru: "чувства и сердце, словно сговорившись,"
      - pl: "\nW jedno ognisko miłość mą roztliły."
        ru: "разожгли мою любовь в один очаг."
        note: "roztlić — разжечь"
    words: { "ciągną": ciagnac, "ostrzami": ostrze, "orła": orzel, "Zgadłem": zgadnac, "prąd": prad, "Zmysły": zmysl }
  - clean: "Byt świata, byt mój, ofiara krzyżowa\nTego, co umarł, abym w duchu ożył,\nNadzieja, w czym ją każdy wierny złożył,\nI ziemska mądrość, o czym była mowa,\nWyrwawszy z morza miłości fałszywej\nMnie postawiły na brzegu prawdziwej."
    verse: true
    chunks:
      - pl: "Byt świata, byt mój, ofiara krzyżowa"
        ru: "Бытие мира, моё бытие, крестная жертва"
      - pl: "\nTego, co umarł, abym w duchu ożył,"
        ru: "того, кто умер, чтобы я ожил в духе,"
      - pl: "\nNadzieja, w czym ją każdy wierny złożył,"
        ru: "надежда, которую положил в это каждый верный,"
      - pl: "\nI ziemska mądrość, o czym była mowa,"
        ru: "и земная мудрость, о которой шла речь,"
      - pl: "\nWyrwawszy z morza miłości fałszywej"
        ru: "вырвав меня из моря ложной любви,"
      - pl: "\nMnie postawiły na brzegu prawdziwej."
        ru: "поставили меня на берег истинной."
    words: { "wierny": wierny, "złożył": zlozyc, "Wyrwawszy": wyrwac, "morza": morze, "fałszywej": falszywy, "brzegu": brzeg }
  - clean: "Lubię ja kwiaty, jakie tu zamyka\nWiekuistego ogród ogrodnika,\nIle on więcej im dobra udziela».\nGdym zamilkł, w niebie zabrzmiał hymn wesela\nI mojej Pani głos chórem objęty\nŚpiewał z drugimi: «Święty! święty! święty!»."
