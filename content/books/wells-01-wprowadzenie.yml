      - pl: " Wiecie oczywiście, że linia matematyczna, linia o grubości zerowej, nie istnieje naprawdę."
        ru: "Вы, конечно, знаете, что математическая линия, линия нулевой толщины, реально не существует."
      - pl: " Uczono was tego?"
        ru: "Вас этому учили?"
      - pl: " Płaszczyzna matematyczna też nie."
        ru: "Математическая плоскость тоже."
        note: "płaszczyzna — плоскость"
      - pl: " Te rzeczy to tylko abstrakcje."
        ru: "Это всего лишь абстракции."
