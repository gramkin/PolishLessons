  - clean: "Filby się zamyślił. — Najwyraźniej — ciągnął Podróżnik w Czasie — każde rzeczywiste ciało musi mieć rozciągłość w czterech kierunkach: musi mieć Długość, Szerokość, Grubość i… Trwanie. Ale z powodu przyrodzonej słabości ciała, którą zaraz wam wyjaśnię, skłonni jesteśmy przeoczać ten fakt. Istnieją naprawdę cztery wymiary: trzy, które nazywamy trzema płaszczyznami Przestrzeni, i czwarty — Czas. Istnieje jednak skłonność do przeprowadzania sztucznego rozróżnienia między trzema pierwszymi wymiarami a ostatnim, bo tak się składa, że nasza świadomość porusza się wzdłuż niego z przerwami, w jednym kierunku, od początku do końca naszego życia."
    en: "Filby became pensive. “Clearly,” the Time Traveller proceeded, “any real body must have extension in four directions: it must have Length, Breadth, Thickness, and—Duration. But through a natural infirmity of the flesh, which I will explain to you in a moment, we incline to overlook this fact. There are really four dimensions, three which we call the three planes of Space, and a fourth, Time. There is, however, a tendency to draw an unreal distinction between the former three dimensions and the latter, because it happens that our consciousness moves intermittently in one direction along the latter from the beginning to the end of our lives.”"
    draft: true
    chunks:
      - pl: "Filby się zamyślił."
        ru: "Филби задумался."
      - pl: " — Najwyraźniej — ciągnął Podróżnik w Czasie — każde rzeczywiste ciało musi mieć rozciągłość w czterech kierunkach:"
        ru: "— Очевидно, — продолжал Путешественник во Времени, — всякое реальное тело должно иметь протяжённость в четырёх направлениях:"
        note: "rozciągłość — протяжённость"
      - pl: " musi mieć Długość, Szerokość, Grubość i… Trwanie."
        ru: "у него должны быть Длина, Ширина, Толщина и… Длительность."
        note: "trwanie — длительность, продолжительность"
      - pl: " Ale z powodu przyrodzonej słabości ciała, którą zaraz wam wyjaśnię, skłonni jesteśmy przeoczać ten fakt."
        ru: "Но из-за природной немощи плоти, которую я сейчас вам объясню, мы склонны упускать этот факт из виду."
        note: "przeoczać — упускать из виду"
      - pl: " Istnieją naprawdę cztery wymiary: trzy, które nazywamy trzema płaszczyznami Przestrzeni, i czwarty — Czas."
        ru: "На самом деле есть четыре измерения: три, которые мы называем тремя плоскостями Пространства, и четвёртое — Время."
        note: "wymiar — измерение"
      - pl: " Istnieje jednak skłonność do przeprowadzania sztucznego rozróżnienia między trzema pierwszymi wymiarami a ostatnim,"
        ru: "Однако существует склонность проводить надуманное различие между первыми тремя измерениями и последним,"
        note: "rozróżnienie — различение"
