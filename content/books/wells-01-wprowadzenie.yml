  - clean: "— Chodzi po prostu o to. O Przestrzeni, tak jak ją ujmują nasi matematycy, mówi się, że ma trzy wymiary, które można nazwać Długością, Szerokością i Grubością, i że zawsze da się je określić za pomocą trzech płaszczyzn, z których każda jest prostopadła do pozostałych. Ale niektórzy filozofujący ludzie pytają, dlaczego akurat trzy wymiary — czemu nie jeszcze jeden kierunek, prostopadły do tamtych trzech? — i próbowali nawet zbudować geometrię Czterowymiarową."
    en: "“It is simply this. That Space, as our mathematicians have it, is spoken of as having three dimensions, which one may call Length, Breadth, and Thickness, and is always definable by reference to three planes, each at right angles to the others. But some philosophical people have been asking why three dimensions particularly—why not another direction at right angles to the other three?—and have even tried to construct a Four-Dimensional geometry."
    draft: true
    chunks:
      - pl: "— Chodzi po prostu o to."
        ru: "— Дело просто вот в чём."
      - pl: " O Przestrzeni, tak jak ją ujmują nasi matematycy, mówi się, że ma trzy wymiary, które można nazwać Długością, Szerokością i Grubością,"
        ru: "О Пространстве, как его понимают наши математики, говорят, что у него три измерения, которые можно назвать Длиной, Шириной и Толщиной,"
        note: "ujmować — понимать, формулировать"
      - pl: " i że zawsze da się je określić za pomocą trzech płaszczyzn, z których każda jest prostopadła do pozostałych."
        ru: "и что его всегда можно определить с помощью трёх плоскостей, каждая из которых перпендикулярна остальным."
        note: "prostopadły — перпендикулярный"
