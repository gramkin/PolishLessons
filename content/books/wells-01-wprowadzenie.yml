  - clean: "— Otóż jest bardzo zastanawiające, że tak powszechnie się to przeocza — ciągnął Podróżnik w Czasie, nieco weselszy. — Właśnie to rozumie się przez Czwarty Wymiar, choć niektórzy, którzy mówią o Czwartym Wymiarze, nie wiedzą, że to mają na myśli. To tylko inny sposób patrzenia na Czas. Nie ma żadnej różnicy między Czasem a którymkolwiek z trzech wymiarów Przestrzeni, poza tym, że nasza świadomość porusza się wzdłuż niego. Ale niektórzy głupcy uchwycili tę myśl z niewłaściwej strony. Wszyscy słyszeliście, co mają do powiedzenia o tym Czwartym Wymiarze?"
    en: "“Now, it is very remarkable that this is so extensively overlooked,” continued the Time Traveller, with a slight accession of cheerfulness. “Really this is what is meant by the Fourth Dimension, though some people who talk about the Fourth Dimension do not know they mean it. It is only another way of looking at Time. There is no difference between Time and any of the three dimensions of Space except that our consciousness moves along it. But some foolish people have got hold of the wrong side of that idea. You have all heard what they have to say about this Fourth Dimension?”"
    draft: true
    chunks:
      - pl: "— Otóż jest bardzo zastanawiające, że tak powszechnie się to przeocza — ciągnął Podróżnik w Czasie, nieco weselszy."
        ru: "— Так вот, очень примечательно, что это так повсеместно упускают из виду, — продолжал Путешественник во Времени, слегка повеселев."
      - pl: " — Właśnie to rozumie się przez Czwarty Wymiar, choć niektórzy, którzy mówią o Czwartym Wymiarze, nie wiedzą, że to mają na myśli."
        ru: "— Именно это и подразумевается под Четвёртым Измерением, хотя некоторые из тех, кто о нём говорит, не знают, что имеют в виду это."
        note: "mieć na myśli — иметь в виду"
      - pl: " To tylko inny sposób patrzenia na Czas."
        ru: "Это всего лишь иной взгляд на Время."
      - pl: " Nie ma żadnej różnicy między Czasem a którymkolwiek z trzech wymiarów Przestrzeni, poza tym, że nasza świadomość porusza się wzdłuż niego."
        ru: "Нет никакой разницы между Временем и любым из трёх измерений Пространства, кроме того, что наше сознание движется вдоль него."
      - pl: " Ale niektórzy głupcy uchwycili tę myśl z niewłaściwej strony."
        ru: "Но некоторые глупцы ухватились за эту мысль не с той стороны."
      - pl: " Wszyscy słyszeliście, co mają do powiedzenia o tym Czwartym Wymiarze?"
        ru: "Вы все слышали, что они говорят об этом Четвёртом Измерении?"
