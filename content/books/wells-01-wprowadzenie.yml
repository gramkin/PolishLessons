paragraphs:
  - clean: "Podróżnik w Czasie (bo tak wygodnie będzie o nim mówić) wykładał nam pewną zawiłą kwestię. Jego szare oczy lśniły i iskrzyły się, a zwykle blada twarz była zarumieniona i ożywiona. Ogień płonął jasno, a łagodny blask żarówek w srebrnych liliach chwytał pęcherzyki, które błyskały i znikały w naszych kieliszkach. Nasze fotele, jego własne patenty, raczej obejmowały nas i pieściły, niż pozwalały na sobie siedzieć; panował ten wytworny poobiedni nastrój, kiedy myśl płynie swobodnie, wolna od więzów ścisłości. A on przedstawił nam to w ten sposób — zaznaczając kolejne punkty chudym palcem wskazującym — gdy siedzieliśmy, leniwie podziwiając jego zapał w sprawie tego nowego paradoksu (za jaki go uważaliśmy) i jego płodność umysłu."
    en: "The Time Traveller (for so it will be convenient to speak of him) was expounding a recondite matter to us. His grey eyes shone and twinkled, and his usually pale face was flushed and animated. The fire burnt brightly, and the soft radiance of the incandescent lights in the lilies of silver caught the bubbles that flashed and passed in our glasses. Our chairs, being his patents, embraced and caressed us rather than submitted to be sat upon, and there was that luxurious after-dinner atmosphere, when thought runs gracefully free of the trammels of precision. And he put it to us in this way—marking the points with a lean forefinger—as we sat and lazily admired his earnestness over this new paradox (as we thought it) and his fecundity."
    draft: true
    chunks:
      - pl: "Podróżnik w Czasie (bo tak wygodnie będzie o nim mówić) wykładał nam pewną zawiłą kwestię."
        ru: "Путешественник во Времени (так нам будет удобно его называть) излагал нам некий мудрёный вопрос."
        note: "wykładać — излагать, объяснять; zawiły — запутанный, мудрёный"
      - pl: " Jego szare oczy lśniły i iskrzyły się, a zwykle blada twarz była zarumieniona i ożywiona."
        ru: "Его серые глаза блестели и искрились, а обычно бледное лицо раскраснелось и оживилось."
        note: "iskrzyć się — искриться"
      - pl: " Ogień płonął jasno, a łagodny blask żarówek w srebrnych liliach"
        ru: "Огонь горел ярко, а мягкий свет ламп накаливания в серебряных лилиях"
        note: "żarówka — лампа накаливания"
      - pl: " chwytał pęcherzyki, które błyskały i znikały w naszych kieliszkach."
        ru: "ловил пузырьки, вспыхивавшие и исчезавшие в наших бокалах."
        note: "pęcherzyk — пузырёк"
      - pl: " Nasze fotele, jego własne patenty, raczej obejmowały nas i pieściły, niż pozwalały na sobie siedzieć;"
        ru: "Наши кресла, его собственные патенты, скорее обнимали и ласкали нас, чем позволяли на себе сидеть;"
      - pl: " panował ten wytworny poobiedni nastrój, kiedy myśl płynie swobodnie, wolna od więzów ścisłości."
        ru: "царила та изысканная послеобеденная атмосфера, когда мысль свободно течёт, не скованная путами точности."
        note: "więzy — путы, оковы; ścisłość — точность"
      - pl: " A on przedstawił nam to w ten sposób — zaznaczając kolejne punkty chudym palcem wskazującym —"
        ru: "И он изложил нам это так — отмечая каждый пункт худым указательным пальцем, —"
        note: "palec wskazujący — указательный палец"
