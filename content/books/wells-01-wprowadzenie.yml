  - clean: "— Tu protestuję — rzekł Filby. — Oczywiście, że ciało stałe może istnieć. Wszystkie rzeczywiste rzeczy…"
    en: "“There I object,” said Filby. “Of course a solid body may exist. All real things—”"
    draft: true
