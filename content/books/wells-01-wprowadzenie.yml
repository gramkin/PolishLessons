  - clean: "— Musicie mnie uważnie śledzić. Będę musiał podważyć jedno czy dwa przekonania, przyjmowane niemal powszechnie. Na przykład geometria, której was uczono w szkole, opiera się na nieporozumieniu."
    en: "“You must follow me carefully. I shall have to controvert one or two ideas that are almost universally accepted. The geometry, for instance, they taught you at school is founded on a misconception.”"
    draft: true
    chunks:
      - pl: "— Musicie mnie uważnie śledzić."
        ru: "— Следите за мной внимательно."
      - pl: " Będę musiał podważyć jedno czy dwa przekonania, przyjmowane niemal powszechnie."
        ru: "Мне придётся оспорить одно-два представления, принятые почти всеми."
        note: "podważyć — поставить под сомнение, оспорить"
      - pl: " Na przykład geometria, której was uczono w szkole, opiera się na nieporozumieniu."
        ru: "Например, геометрия, которой вас учили в школе, основана на недоразумении."
    words: { "uważnie": uwaznie, "śledzić": sledzic, "przyjmowane": przyjmowac, "powszechnie": powszechnie, "opiera": opierac }
  - clean: "— Czy to nie za wielka rzecz, żebyśmy od niej zaczynali? — zapytał Filby, rudy człowiek skłonny do sporów."
    en: "“Is not that rather a large thing to expect us to begin upon?” said Filby, an argumentative person with red hair."
    draft: true
    chunks:
      - pl: "— Czy to nie za wielka rzecz, żebyśmy od niej zaczynali? — zapytał Filby, rudy człowiek skłonny do sporów."
        ru: "— Не слишком ли это крупная вещь, чтобы с неё начинать? — спросил Филби, рыжий любитель поспорить."
        note: "skłonny do sporów — склонный к спорам"
    words: { "wielka": wielki, "zaczynali": zaczynac, "zapytał": zapytac, "rudy": rudy, "człowiek": czlowiek, "skłonny": sklonny }
  - clean: "— Nie zamierzam prosić was o przyjęcie czegokolwiek bez rozsądnej podstawy. Wkrótce sami przyznacie tyle, ile mi potrzeba. Wiecie oczywiście, że linia matematyczna, linia o grubości zerowej, nie istnieje naprawdę. Uczono was tego? Płaszczyzna matematyczna też nie. Te rzeczy to tylko abstrakcje."
    en: "“I do not mean to ask you to accept anything without reasonable ground for it. You will soon admit as much as I need from you. You know of course that a mathematical line, a line of thickness nil, has no real existence. They taught you that? Neither has a mathematical plane. These things are mere abstractions.”"
    draft: true
    chunks:
      - pl: "— Nie zamierzam prosić was o przyjęcie czegokolwiek bez rozsądnej podstawy."
        ru: "— Я не собираюсь просить вас принять что-либо без разумного основания."
      - pl: " Wkrótce sami przyznacie tyle, ile mi potrzeba."
