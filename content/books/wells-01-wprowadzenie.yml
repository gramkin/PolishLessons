  - clean: "— Ludzie nauki — ciągnął Podróżnik w Czasie po przerwie potrzebnej, by należycie to przyswoić — wiedzą bardzo dobrze, że Czas jest tylko pewnym rodzajem Przestrzeni. Oto popularny wykres naukowy, zapis pogody. Ta linia, którą wodzę palcem, pokazuje ruch barometru. Wczoraj był tak wysoko, wczoraj w nocy spadł, potem dziś rano znów się podniósł i tak łagodnie w górę aż do tego miejsca. Przecież rtęć nie wykreśliła tej linii w żadnym z powszechnie uznanych wymiarów Przestrzeni? A jednak z pewnością wykreśliła taką linię, a zatem, musimy wnioskować, linia ta biegła wzdłuż Wymiaru Czasu."
