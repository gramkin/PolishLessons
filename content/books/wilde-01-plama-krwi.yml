        ru: "член совета Королевского колледжа в Кембридже."
        note: "у Уайльда Fellow — член совета колледжа"
      - pl: " Po tym niefortunnym wypadku z księżną"
        ru: "После этого злосчастного случая с герцогиней"
        note: "niefortunny — злосчастный"
      - pl: " żaden z młodszych służących nie chciał u nas zostać,"
        ru: "никто из младших слуг не пожелал у нас остаться,"
