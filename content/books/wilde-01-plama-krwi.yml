  - clean: "Ponieważ Canterville Chase leży siedem mil od Ascot, najbliższej stacji kolejowej, pan Otis zatelegrafował, żeby wysłano po nich bryczkę, i wyruszyli w drogę w doskonałych humorach. Był piękny lipcowy wieczór, a powietrze było delikatne od zapachu sosnowych lasów. Od czasu do czasu słyszeli grzywacza, który rozkoszował się słodyczą własnego głosu, albo widzieli głęboko w szeleszczącej paproci lśniącą pierś bażanta. Małe wiewiórki zerkały na nich z buków, kiedy przejeżdżali, a króliki umykały przez zarośla i po omszałych pagórkach, zadzierając białe ogonki. Kiedy jednak wjechali w aleję Canterville Chase, niebo nagle zasnuło się chmurami, powietrze jakby zamarło w dziwnej ciszy, nad ich głowami przeleciało bezgłośnie wielkie stado gawronów, i zanim dotarli do domu, spadło kilka wielkich kropel deszczu."
    en: "As Canterville Chase is seven miles from Ascot, the nearest railway station, Mr. Otis had telegraphed for a waggonette to meet them, and they started on their drive in high spirits. It was a lovely July evening, and the air was delicate with the scent of the pinewoods. Now and then they heard a wood-pigeon brooding over its own sweet voice, or saw, deep in the rustling fern, the burnished breast of the pheasant. Little squirrels peered at them from the beech-trees as they went by, and the rabbits scudded away through the brushwood and over the mossy knolls, with their white tails in the air. As they entered the avenue of Canterville Chase, however, the sky became suddenly overcast with clouds, a curious stillness seemed to hold the atmosphere, a great flight of rooks passed silently over their heads, and, before they reached the house, some big drops of rain had fallen."
    draft: true
