  - clean: "— Z pewnością jesteście w Ameryce bardzo naturalni — odpowiedział lord Canterville, który nie całkiem zrozumiał ostatnią uwagę pana Otisa — i jeśli nie przeszkadza panu duch w domu, to w porządku. Tylko proszę pamiętać, że pana ostrzegałem."
