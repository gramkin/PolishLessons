  - clean: "— Milordzie — odpowiedział minister — biorę meble i ducha według wyceny. Przybywam z nowoczesnego kraju, gdzie mamy wszystko, co można kupić za pieniądze; a skoro nasi rzutcy młodzieńcy hulają po całym Starym Świecie i wywożą od was najlepszych aktorów i primadonny, to sądzę, że gdyby w Europie istniało coś takiego jak duch, mielibyśmy go u siebie w bardzo krótkim czasie w którymś z naszych muzeów albo w objazdowym gabinecie osobliwości."
    en: "\"My Lord,\" answered the Minister, \"I will take the furniture and the ghost at a valuation. I have come from a modern country, where we have everything that money can buy; and with all our spry young fellows painting the Old World red, and carrying off your best actors and prima-donnas, I reckon that if there were such a thing as a ghost in Europe, we'd have it at home in a very short time in one of our public museums, or on the road as a show.\""
    draft: true
    chunks:
