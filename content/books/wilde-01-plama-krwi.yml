  - clean: "Na schodach, gotowa ich przyjąć, stała stara kobieta w schludnej czarnej jedwabnej sukni, w białym czepku i fartuszku. Była to pani Umney, gospodyni, którą pani Otis, na usilną prośbę lady Canterville, zgodziła się zatrzymać na dawnym stanowisku. Kiedy wysiadali, dygnęła nisko przed każdym z nich i powiedziała w osobliwy, staroświecki sposób: „Witam państwa w Canterville Chase”. Idąc za nią, przeszli przez piękny tudorowski hol do biblioteki, długiej, niskiej sali wyłożonej czarnym dębem, na której końcu było duże witrażowe okno. Czekała tam na nich podana herbata, więc zdjąwszy okrycia, usiedli i zaczęli się rozglądać, a pani Umney im usługiwała."
    en: "Standing on the steps to receive them was an old woman, neatly dressed in black silk, with a white cap and apron. This was Mrs. Umney, the housekeeper, whom Mrs. Otis, at Lady Canterville's earnest request, had consented to keep in her former position. She made them each a low curtsey as they alighted, and said in a quaint, old-fashioned manner, \"I bid you welcome to Canterville Chase.\" Following her, they passed through the fine Tudor hall into the library, a long, low room, panelled in black oak, at the end of which was a large stained glass window. Here they found tea laid out for them, and, after taking off their wraps, they sat down and began to look round, while Mrs. Umney waited on them."
