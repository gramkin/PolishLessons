  - clean: "W kilka tygodni później transakcja została zawarta, a pod koniec sezonu minister z rodziną pojechał do Canterville Chase. Pani Otis, która jako panna Lukrecja R. Tappan z Zachodniej Pięćdziesiątej Trzeciej Ulicy słynęła niegdyś z urody w całym Nowym Jorku, była teraz bardzo przystojną kobietą w średnim wieku, o pięknych oczach i wspaniałym profilu. Wiele Amerykanek, opuszczając ojczyznę, przybiera wygląd osób chronicznie chorych, w przekonaniu, że to oznaka europejskiego wyrafinowania, lecz pani Otis nigdy nie popadła w ten błąd. Miała wspaniałe zdrowie i naprawdę zdumiewający zapas energii życiowej. Pod wieloma względami była właściwie zupełną Angielką i stanowiła doskonały przykład tego, że dziś naprawdę mamy z Ameryką wszystko wspólne, z wyjątkiem, oczywiście, języka."
    en: "A few weeks after this, the purchase was concluded, and at the close of the season the Minister and his family went down to Canterville Chase. Mrs. Otis, who, as Miss Lucretia R. Tappan, of West 53d Street, had been a celebrated New York belle, was now a very handsome, middle-aged woman, with fine eyes, and a superb profile. Many American ladies on leaving their native land adopt an appearance of chronic ill-health, under the impression that it is a form of European refinement, but Mrs. Otis had never fallen into this error. She had a magnificent constitution, and a really wonderful amount of animal spirits. Indeed, in many respects, she was quite English, and was an excellent example of the fact that we have really everything in common with America nowadays, except, of course, language."
    draft: true
