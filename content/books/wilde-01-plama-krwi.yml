      - pl: " bo nie ulegało najmniejszej wątpliwości, że w tym miejscu straszy."
        ru: "потому что не было ни малейшего сомнения, что в этом месте водятся привидения."
        note: "straszy — безличное «там нечисто»; nie ulegać wątpliwości — не подлежать сомнению"
      - pl: " Nawet sam lord Canterville, człowiek niezwykle skrupulatny w sprawach honoru,"
        ru: "Даже сам лорд Кентервиль, человек чрезвычайно щепетильный в вопросах чести,"
