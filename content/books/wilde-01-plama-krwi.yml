  - clean: "— Obawiam się, że duch istnieje — rzekł z uśmiechem lord Canterville — choć być może oparł się zakusom waszych przedsiębiorczych impresariów. Znany jest od trzech stuleci, dokładnie od roku 1584, i zawsze się ukazuje przed śmiercią któregoś z członków naszej rodziny."
    en: "\"I fear that the ghost exists,\" said Lord Canterville, smiling, \"though it may have resisted the overtures of your enterprising impresarios. It has been well known for three centuries, since 1584 in fact, and always makes its appearance before the death of any member of our family.\""
