paragraphs:
  - clean: "Kiedy pan Hiram B. Otis, amerykański minister pełnomocny, kupił Canterville Chase, wszyscy mówili mu, że robi wielkie głupstwo, bo nie ulegało najmniejszej wątpliwości, że w tym miejscu straszy. Nawet sam lord Canterville, człowiek niezwykle skrupulatny w sprawach honoru, uznał za swój obowiązek wspomnieć o tym panu Otisowi, kiedy przyszło do omawiania warunków."
    en: "When Mr. Hiram B. Otis, the American Minister, bought Canterville Chase, every one told him he was doing a very foolish thing, as there was no doubt at all that the place was haunted. Indeed, Lord Canterville himself, who was a man of the most punctilious honour, had felt it his duty to mention the fact to Mr. Otis when they came to discuss terms."
    draft: true
    chunks:
      - pl: "Kiedy pan Hiram B. Otis, amerykański minister pełnomocny, kupił Canterville Chase,"
        ru: "Когда мистер Хайрам Б. Отис, американский посланник, купил Кентервиль-Чейз,"
        note: "minister pełnomocny — полномочный посланник; у Уайльда American Minister"
      - pl: " wszyscy mówili mu, że robi wielkie głupstwo,"
