  - clean: "Jej najstarszy syn, którego rodzice w przypływie patriotyzmu ochrzcili imieniem Waszyngton, czego on sam nigdy nie przestał żałować, był jasnowłosym, dość przystojnym młodzieńcem, który przygotował się do kariery w amerykańskiej dyplomacji, prowadząc kotyliona w kasynie w Newport przez trzy kolejne sezony, i nawet w Londynie słynął jako świetny tancerz. Gardenie i arystokracja były jego jedynymi słabostkami. Poza tym był niezwykle rozsądny. Panna Virginia E. Otis była piętnastoletnią dziewczynką, zwinną i śliczną jak sarenka, o wielkich niebieskich oczach, w których malowała się piękna swoboda. Była wspaniałą amazonką i raz ścigała się na kucyku ze starym lordem Biltonem dwa razy dookoła parku, wygrywając o półtorej długości tuż przed posągiem Achillesa, ku wielkiej radości młodego księcia Cheshire, który natychmiast się jej oświadczył i jeszcze tego samego wieczoru, zalany łzami, został przez opiekunów odesłany z powrotem do Eton. Po Virginii przyszli na świat bliźniacy, których zwykle nazywano „Gwiazdami i Pasami”, bo ciągle dostawali w skórę. Byli to przemili chłopcy i, nie licząc zacnego ministra, jedyni prawdziwi republikanie w rodzinie."
    en: "Her eldest son, christened Washington by his parents in a moment of patriotism, which he never ceased to regret, was a fair-haired, rather good-looking young man, who had qualified himself for American diplomacy by leading the German at the Newport Casino for three successive seasons, and even in London was well known as an excellent dancer. Gardenias and the peerage were his only weaknesses. Otherwise he was extremely sensible. Miss Virginia E. Otis was a little girl of fifteen, lithe and lovely as a fawn, and with a fine freedom in her large blue eyes. She was a wonderful Amazon, and had once raced old Lord Bilton on her pony twice round the park, winning by a length and a half, just in front of the Achilles statue, to the huge delight of the young Duke of Cheshire, who proposed for her on the spot, and was sent back to Eton that very night by his guardians, in floods of tears. After Virginia came the twins, who were usually called \"The Star and Stripes,\" as they were always getting swished. They were delightful boys, and, with the exception of the worthy Minister, the only true republicans of the family."
