  - clean: "— Sami nie mieliśmy ochoty tam mieszkać — powiedział lord Canterville — odkąd moja cioteczna babka, wdowa po księciu Bolton, dostała ataku nerwowego, z którego tak naprawdę nigdy się nie podniosła, bo kiedy przebierała się do obiadu, na jej ramionach spoczęły dwie ręce szkieletu; i czuję się w obowiązku powiedzieć panu, panie Otis, że ducha widziało kilku żyjących członków mojej rodziny, a także proboszcz naszej parafii, wielebny Augustus Dampier, członek rady King's College w Cambridge. Po tym niefortunnym wypadku z księżną żaden z młodszych służących nie chciał u nas zostać, a lady Canterville często prawie nie sypiała w nocy z powodu tajemniczych odgłosów dochodzących z korytarza i z biblioteki."
    en: "\"We have not cared to live in the place ourselves,\" said Lord Canterville, \"since my grandaunt, the Dowager Duchess of Bolton, was frightened into a fit, from which she never really recovered, by two skeleton hands being placed on her shoulders as she was dressing for dinner, and I feel bound to tell you, Mr. Otis, that the ghost has been seen by several living members of my family, as well as by the rector of the parish, the Rev. Augustus Dampier, who is a Fellow of King's College, Cambridge. After the unfortunate accident to the Duchess, none of our younger servants would stay with us, and Lady Canterville often got very little sleep at night, in consequence of the mysterious noises that came from the corridor and the library.\""
    draft: true
    chunks:
      - pl: "— Sami nie mieliśmy ochoty tam mieszkać —"
        ru: "— Сами мы не желали там жить, —"
        note: "mieć ochotę — хотеть"
      - pl: " powiedział lord Canterville —"
        ru: "сказал лорд Кентервиль, —"
