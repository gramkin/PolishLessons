  - clean: "Staruszka uśmiechnęła się i odpowiedziała tym samym cichym, tajemniczym głosem: — To krew lady Eleanore de Canterville, zamordowanej w tym właśnie miejscu przez własnego męża, sir Simona de Canterville, w roku 1575. Sir Simon przeżył ją o dziewięć lat i zniknął nagle w bardzo tajemniczych okolicznościach. Jego ciała nigdy nie odnaleziono, ale jego grzeszny duch wciąż nawiedza posiadłość. Turyści i inni bardzo podziwiają tę plamę krwi i nie da się jej usunąć."
    en: "The old woman smiled, and answered in the same low, mysterious voice, \"It is the blood of Lady Eleanore de Canterville, who was murdered on that very spot by her own husband, Sir Simon de Canterville, in 1575. Sir Simon survived her nine years, and disappeared suddenly under very mysterious circumstances. His body has never been discovered, but his guilty spirit still haunts the Chase. The blood-stain has been much admired by tourists and others, and cannot be removed.\""
    draft: true
