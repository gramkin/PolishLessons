      - pl: "\nStanęły w sposób, że zdało się złotem"
        ru: "встали так, что казалось, будто золотом"
      - pl: "\nPisze na srebrze gwiazda Jowiszowa."
        ru: "пишет по серебру звезда Юпитера."
    words: { "okres": okres, "zamykało": zamykac, "Stanęły": stanac, "złotem": zloto, "srebrze": srebro, "gwiazda": gwiazda }
