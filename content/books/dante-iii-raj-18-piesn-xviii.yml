chapter: 18
chapterTitle: "Pieśń XVIII"
chapterTitleRu: "Песнь XVIII. Буквы на Юпитере"
level: B2
paragraphs:
  - clean: "Zakończenie. Kaciagwida wymienia Jozuego, Machabeusza, Karola, Rolanda Godofreda z Bulionu, Gwiskarda i innych. 6. Ku Jowiszowi, gwieździe sprawiedliwych monarchów. Duchy tworzą swym szeregiem słowa Diligite justitiam itd., potem orła. Skarga na stolicę apostolską."
    chunks:
      - pl: "Zakończenie. Kaciagwida wymienia Jozuego, Machabeusza, Karola, Rolanda Godofreda z Bulionu, Gwiskarda i innych. 6. Ku Jowiszowi, gwieździe sprawiedliwych monarchów. Duchy tworzą swym szeregiem słowa Diligite justitiam itd., potem orła. Skarga na stolicę apostolską."
        ru: "Окончание. Каччагвида называет Иисуса Навина, Маккавея, Карла, Роланда, Готфрида Бульонского, Гвискара и других. 6. К Юпитеру, звезде справедливых монархов. Духи своим строем образуют слова «Diligite justitiam» и т. д., потом орла. Жалоба на апостольский престол."
    words: { "sprawiedliwych": sprawiedliwy, "tworzą": tworzyc, "szeregiem": szereg, "orła": orzel, "Skarga": skarga, "stolicę": stolica }
  - clean: "Już w sobie światłość cieszyła się błoga,\nSama ze swoją myślą tajemniczą,\nJa z moją, słodycz miarkując goryczą.\nNiewiasta, która wiodła mnie do Boga,\nMówiła: «Myślom daj inny kierunek,\nMyśl, żem jest bliska tego, który wchodzi\nW boleść skrzywdzonych, ból krzywdy łagodzi»."
    verse: true
    chunks:
      - pl: "Już w sobie światłość cieszyła się błoga,"
        ru: "Уже свет блаженно радовался в себе"
      - pl: "\nSama ze swoją myślą tajemniczą,"
        ru: "сам своей таинственной мыслью,"
      - pl: "\nJa z moją, słodycz miarkując goryczą."
        ru: "я — своей, умеряя сладость горечью."
      - pl: "\nNiewiasta, która wiodła mnie do Boga,"
        ru: "Жена, что вела меня к Богу,"
      - pl: "\nMówiła: «Myślom daj inny kierunek,"
        ru: "сказала: «Дай мыслям другое направление,"
      - pl: "\nMyśl, żem jest bliska tego, który wchodzi"
        ru: "думай, что я близко от того, кто входит"
      - pl: "\nW boleść skrzywdzonych, ból krzywdy łagodzi»."
        ru: "в скорбь обиженных, смягчает боль обиды»."
        note: "skrzywdzony — обиженный"
    words: { "tajemniczą": tajemniczy, "słodycz": slodycz, "miarkując": miarkowac, "goryczą": gorycz, "Niewiasta": niewiasta, "Myślom": mysl }
  - clean: "Jam się obrócił cały ku głosowi\nPocieszycielki, co tak słodko mówi.\nIle ja wtedy i z jakim zapałem\nW świętych jej oczach miłości widziałem,\nTu łamię pędzel na ten wizerunek;\nNie tylko, że nie ufam w moje słowa,\nLecz i przez słabość umysłu powszednią,\nKtóry rzecz wyższą nad siebie nie może\nWysłowić, gdy mu łaska nie pomoże."
    verse: true
    chunks:
      - pl: "Jam się obrócił cały ku głosowi"
        ru: "Я весь обратился к голосу"
      - pl: "\nPocieszycielki, co tak słodko mówi."
        ru: "утешительницы, что так сладко говорит."
      - pl: "\nIle ja wtedy i z jakim zapałem"
        ru: "Сколько я тогда и с каким пылом"
      - pl: "\nW świętych jej oczach miłości widziałem,"
        ru: "видел любви в её святых глазах,"
      - pl: "\nTu łamię pędzel na ten wizerunek;"
        ru: "здесь я ломаю кисть на этом изображении;"
      - pl: "\nNie tylko, że nie ufam w moje słowa,"
        ru: "не только потому, что не доверяю своим словам,"
      - pl: "\nLecz i przez słabość umysłu powszednią,"
        ru: "но и из-за обыденной слабости ума,"
      - pl: "\nKtóry rzecz wyższą nad siebie nie może"
        ru: "который не может выразить вещь выше себя,"
      - pl: "\nWysłowić, gdy mu łaska nie pomoże."
        ru: "если ему не поможет милость."
    words: { "obrócił": obrocic, "łamię": lamac, "wizerunek": wizerunek, "ufam": ufac, "słabość": slabosc, "umysłu": umysl }
  - clean: "To tylko powiem, że jej słodka mowa\nGdym patrzył na nią, tak w sercu utkwiła,\nAż mnie z żądności wszelkiej wyzwoliła.\nPodczas gdy wieczna rozkosz bezpośrednio\nOpromieniając Beatrycze lica,\nMnie ich natchnionym upaja wyrazem,\nOna z uśmiechem, co duszę zachwyca,\n«Odwróć się» rzekła «i słuchaj zarazem,\nNie tylko w oczach moich jest raj cały»."
    verse: true
    chunks:
      - pl: "To tylko powiem, że jej słodka mowa"
        ru: "Скажу лишь то, что её сладкая речь,"
      - pl: "\nGdym patrzył na nią, tak w sercu utkwiła,"
        ru: "когда я смотрел на неё, так засела в сердце,"
      - pl: "\nAż mnie z żądności wszelkiej wyzwoliła."
        ru: "что освободила меня от всякой жажды."
      - pl: "\nPodczas gdy wieczna rozkosz bezpośrednio"
        ru: "Пока вечное наслаждение непосредственно,"
      - pl: "\nOpromieniając Beatrycze lica,"
        ru: "озаряя лицо Беатриче,"
      - pl: "\nMnie ich natchnionym upaja wyrazem,"
        ru: "опьяняет меня их вдохновенным выражением,"
        note: "upajać — опьянять"
      - pl: "\nOna z uśmiechem, co duszę zachwyca,"
        ru: "она с улыбкой, что восхищает душу,"
      - pl: "\n«Odwróć się» rzekła «i słuchaj zarazem,"
        ru: "«Обернись, — сказала, — и слушай заодно,"
      - pl: "\nNie tylko w oczach moich jest raj cały»."
        ru: "не только в моих глазах весь рай»."
    words: { "wieczna": wieczny, "Opromieniając": opromieniac, "wyrazem": wyraz, "uśmiechem": usmiech, "Odwróć": odwrocic, "rzekła": rzec }
  - clean: "A jak uczucie w twarzy się maluje,\nGdy silne całą duszę opanuje,\nTak w blasku, w iskrach tej światłości świętej,\nDo której moje oczy się zwracały,\nPoznałem wolę i chęć jej tajemną\nMówienia jeszcze o czymkolwiek ze mną."
    verse: true
    chunks:
      - pl: "A jak uczucie w twarzy się maluje,"
        ru: "И как чувство отражается на лице,"
      - pl: "\nGdy silne całą duszę opanuje,"
        ru: "когда сильное овладеет всей душой,"
      - pl: "\nTak w blasku, w iskrach tej światłości świętej,"
        ru: "так в блеске, в искрах этого святого света,"
      - pl: "\nDo której moje oczy się zwracały,"
        ru: "к которому обращались мои глаза,"
      - pl: "\nPoznałem wolę i chęć jej tajemną"
        ru: "я узнал его волю и тайное желание"
      - pl: "\nMówienia jeszcze o czymkolwiek ze mną."
        ru: "говорить ещё о чём-нибудь со мной."
    words: { "maluje": malowac, "silne": silny, "opanuje": opanowac, "blasku": blask, "zwracały": zwracac, "chęć": chec }
  - clean: "I w dobrotliwie rozmowie poczętej\nTak rzekła: — «Na tej, patrz, piątej gałęzi\nWierzchołkiem swoim żyjącego drzewa,\nNa którym owoc w kwiecie i zawięzi\nI liść zielony bez przerwy powiewa,\nSą duchy wiecznym szczęśliwe zbawieniem,\nKtóre przed swoim tu wniebowstąpieniem\nTak wielką sławą słynęły na ziemi,\nŻe każdą Muzę wzbogaciłbyś niemi."
    verse: true
    chunks:
      - pl: "I w dobrotliwie rozmowie poczętej"
        ru: "И в начатой доброжелательно беседе"
      - pl: "\nTak rzekła: — «Na tej, patrz, piątej gałęzi"
        ru: "он так сказал: — «На этой, смотри, пятой ветви"
      - pl: "\nWierzchołkiem swoim żyjącego drzewa,"
        ru: "дерева, живущего вершиной,"
        note: "рай как дерево, растущее сверху"
      - pl: "\nNa którym owoc w kwiecie i zawięzi"
        ru: "на котором плод в цвету и в завязи"
        note: "zawiąź — завязь"
      - pl: "\nI liść zielony bez przerwy powiewa,"
        ru: "и зелёный лист без перерыва веет,"
      - pl: "\nSą duchy wiecznym szczęśliwe zbawieniem,"
        ru: "есть духи, счастливые вечным спасением,"
      - pl: "\nKtóre przed swoim tu wniebowstąpieniem"
        ru: "которые перед своим вознесением сюда"
      - pl: "\nTak wielką sławą słynęły na ziemi,"
        ru: "славились на земле такой великой славой,"
      - pl: "\nŻe każdą Muzę wzbogaciłbyś niemi."
        ru: "что ты обогатил бы ими каждую Музу."
    words: { "poczętej": poczac, "owoc": owoc, "kwiecie": kwiat, "zielony": zielony, "przerwy": przerwa, "sławą": slawa }
  - clean: "Patrz na ramiona oto tego krzyża,\nKażdy, którego nazwę po imieniu,\nTo samo tobie zrobi w okamgnieniu,\nCo w chmurze robi jej iskra tak chyża».\nI wtem widziałem, jak światło olbrzymie\nPrzeszło po krzyżu, Jozue na imię,\nPrędzej niż wyraz głos wymówić zdołał;\nMachabeusza gdy na imię wołał,\nWidziałem, oto druga światłość śmiga,\nKręcąc się w kółko jak frucząca cyga."
    verse: true
    chunks:
      - pl: "Patrz na ramiona oto tego krzyża,"
        ru: "Смотри на руки вот этого креста:"
      - pl: "\nKażdy, którego nazwę po imieniu,"
        ru: "каждый, кого я назову по имени,"
      - pl: "\nTo samo tobie zrobi w okamgnieniu,"
        ru: "сделает тебе в мгновение ока то же,"
      - pl: "\nCo w chmurze robi jej iskra tak chyża»."
        ru: "что в туче делает её быстрая искра»."
        note: "молния"
      - pl: "\nI wtem widziałem, jak światło olbrzymie"
        ru: "И тут я увидел, как исполинский свет"
      - pl: "\nPrzeszło po krzyżu, Jozue na imię,"
        ru: "прошёл по кресту, по имени Иисус Навин,"
      - pl: "\nPrędzej niż wyraz głos wymówić zdołał;"
        ru: "быстрее, чем голос смог произнести слово;"
      - pl: "\nMachabeusza gdy na imię wołał,"
        ru: "когда он позвал по имени Маккавея,"
      - pl: "\nWidziałem, oto druga światłość śmiga,"
        ru: "я увидел: вот мелькает второй свет,"
      - pl: "\nKręcąc się w kółko jak frucząca cyga."
        ru: "крутясь кругом, как жужжащий волчок."
        note: "cyga — волчок"
    words: { "krzyża": krzyz, "chmurze": chmura, "Prędzej": predko, "wołał": wolac, "śmiga": smigac, "kółko": kolko }
  - clean: "Karloman, Roland! Gdy głos w kolej woła,\nWzrok mój na krzyżu wysoko, wysoko,\nŚcigał dwa światła, jak myśliwca oko\nTropi w powietrzu lot swego sokoła.\nI na tym krzyżu w kolej Guiskarda\nPrzebiegły światła Godfreda, Ryszarda."
    verse: true
    chunks:
      - pl: "Karloman, Roland! Gdy głos w kolej woła,"
        ru: "Карломан, Роланд! когда голос зовёт по очереди,"
        note: "у Korsaka Karloman — Карл Великий"
      - pl: "\nWzrok mój na krzyżu wysoko, wysoko,"
        ru: "мой взгляд высоко, высоко на кресте"
      - pl: "\nŚcigał dwa światła, jak myśliwca oko"
        ru: "следил за двумя светилами, как глаз охотника"
      - pl: "\nTropi w powietrzu lot swego sokoła."
        ru: "выслеживает в воздухе полёт своего сокола."
      - pl: "\nI na tym krzyżu w kolej Guiskarda"
        ru: "И по этому кресту по очереди Гвискара"
      - pl: "\nPrzebiegły światła Godfreda, Ryszarda."
        ru: "пробежали светила Готфрида, Ричарда."
        note: "у Данте — Ренуар"
    words: { "głos": glos, "kolej": kolej, "Wzrok": wzrok, "Ścigał": scigac, "powietrzu": powietrze }
  - clean: "Wtenczas zmieszane z drugimi światłami,\nRównie szybkimi wirując kręgami,\nDowiodło światło, co do mnie mówiło,\nJakim śpiewakiem w chórze niebios było.\nSpojrzałem w lewo, aby w Beatrycy\nCzytać powinność moją, z jej źrenicy,\nZ jej słów i gestów: i widziałem oczy\nTakie wesołe, wzrok jej tak uroczy,\nKtórym swe wszystkie zgasiła spojrzenia,\nNawet ostatni wzrok pełen natchnienia."
    verse: true
    chunks:
      - pl: "Wtenczas zmieszane z drugimi światłami,"
        ru: "Тогда, смешавшись с другими светилами,"
      - pl: "\nRównie szybkimi wirując kręgami,"
        ru: "кружась столь же быстрыми кругами,"
      - pl: "\nDowiodło światło, co do mnie mówiło,"
        ru: "свет, что говорил со мной, показал,"
      - pl: "\nJakim śpiewakiem w chórze niebios było."
        ru: "каким певцом он был в хоре небес."
      - pl: "\nSpojrzałem w lewo, aby w Beatrycy"
        ru: "Я посмотрел налево, чтобы в Беатриче"
      - pl: "\nCzytać powinność moją, z jej źrenicy,"
        ru: "читать свой долг по её зрачку,"
      - pl: "\nZ jej słów i gestów: i widziałem oczy"
        ru: "по её словам и жестам: и я видел глаза"
      - pl: "\nTakie wesołe, wzrok jej tak uroczy,"
        ru: "такие весёлые, её взгляд столь прелестный,"
      - pl: "\nKtórym swe wszystkie zgasiła spojrzenia,"
        ru: "что им она погасила все свои взгляды,"
      - pl: "\nNawet ostatni wzrok pełen natchnienia."
        ru: "даже последний взгляд, полный вдохновения."
    words: { "zmieszane": zmieszac, "Dowiodło": dowiesc, "chórze": chor, "niebios": niebiosa, "gestów": gest, "zgasiła": zgasic }
  - clean: "A jako człowiek, kiedy dobrze robi,\nPrzez żywszą rozkosz spostrzega w istocie,\nŻe sam z dnia na dzień postępuje w cnocie,\nPodobnie w moim kolistym obrocie,\nZdało się, z niebem łuk większy pisałem,\nPatrząc na moją panią, jak się zdobi\nBlaskiem i światłem więcej doskonałem."
    verse: true
    chunks:
      - pl: "A jako człowiek, kiedy dobrze robi,"
        ru: "И как человек, когда хорошо поступает,"
      - pl: "\nPrzez żywszą rozkosz spostrzega w istocie,"
        ru: "через более живое наслаждение замечает воистину,"
      - pl: "\nŻe sam z dnia na dzień postępuje w cnocie,"
        ru: "что сам изо дня в день продвигается в добродетели,"
      - pl: "\nPodobnie w moim kolistym obrocie,"
        ru: "так в моём круговом обороте,"
      - pl: "\nZdało się, z niebem łuk większy pisałem,"
        ru: "казалось, я описывал с небом большую дугу,"
      - pl: "\nPatrząc na moją panią, jak się zdobi"
        ru: "глядя на мою госпожу, как она украшается"
      - pl: "\nBlaskiem i światłem więcej doskonałem."
        ru: "блеском и светом ещё более совершенным."
    words: { "żywszą": zywy, "istocie": istota, "postępuje": postepowac, "Podobnie": podobnie, "obrocie": obrot, "niebem": niebo }
  - clean: "A jak rumieniec z białej twarzy panny\nZnika, nim oczy podniesie spuszczone,\nTak szybko w chwili, gdym wzrok zwrócił w stronę,\nPo złagodzonej białości spostrzegłem,\nŻe już na szóstą gwiazdę nieba wbiegłem.\nW tej Jowiszowej pochodni widziałem,\nJak świętych świateł migot nieustanny\nPrzedstawiał oczom nasze abecadło."
    verse: true
    chunks:
      - pl: "A jak rumieniec z białej twarzy panny"
        ru: "И как румянец с белого лица девушки"
      - pl: "\nZnika, nim oczy podniesie spuszczone,"
        ru: "исчезает, прежде чем она поднимет опущенные глаза,"
      - pl: "\nTak szybko w chwili, gdym wzrok zwrócił w stronę,"
        ru: "так быстро, в тот миг, когда я обратил взгляд в сторону,"
      - pl: "\nPo złagodzonej białości spostrzegłem,"
        ru: "по смягчённой белизне я заметил,"
      - pl: "\nŻe już na szóstą gwiazdę nieba wbiegłem."
        ru: "что уже взбежал на шестую звезду неба."
        note: "Юпитер"
      - pl: "\nW tej Jowiszowej pochodni widziałem,"
        ru: "В этом юпитеровом светильнике я видел,"
      - pl: "\nJak świętych świateł migot nieustanny"
        ru: "как непрестанное мерцание святых светил"
      - pl: "\nPrzedstawiał oczom nasze abecadło."
        ru: "представляло глазам нашу азбуку."
        note: "abecadło — азбука"
    words: { "rumieniec": rumieniec, "Znika": znikac, "spuszczone": spuscic, "spostrzegłem": spostrzec, "pochodni": pochodnia, "Przedstawiał": przedstawiac }
  - clean: "Jak opuszczając ponadrzeczne żery,\nWesoło w górę podnoszą się ptaki,\nI z siebie samych na zgłosek zwierciadło\nLiniję długą tworzą, to zygzaki;\nTak święte w środku swych świateł istoty\nLecąc, śpiewały i na tle tej sfery\nTo *D*, to *J L* tworzyły litery."
    verse: true
    chunks:
      - pl: "Jak opuszczając ponadrzeczne żery,"
        ru: "Как, покидая корм над рекой,"
      - pl: "\nWesoło w górę podnoszą się ptaki,"
        ru: "весело поднимаются вверх птицы"
      - pl: "\nI z siebie samych na zgłosek zwierciadło"
        ru: "и из самих себя в зеркало букв"
      - pl: "\nLiniję długą tworzą, to zygzaki;"
        ru: "образуют длинную линию, то зигзаги;"
      - pl: "\nTak święte w środku swych świateł istoty"
        ru: "так святые существа в середине своих светил,"
      - pl: "\nLecąc, śpiewały i na tle tej sfery"
        ru: "летя, пели и на фоне этой сферы"
      - pl: "\nTo *D*, to *J L* tworzyły litery."
        ru: "образовывали буквы то «D», то «I», «L»."
    words: { "opuszczając": opuszczac, "podnoszą": podnosic, "ptaki": ptak, "Lecąc": leciec, "śpiewały": spiewac, "litery": litera }
  - clean: "Zrazu takt pieśni wymierzał ich loty,\nPotem w milczeniu stawały niektóre,\nWyobrażając tych zgłosek figurę.\nO Muzo! Którą lotny Pegaz nosi,\nPrzez którą sława nieśmiertelność głosi\nPiewców i wieszczów, co nieśmiertelnemi\nTyle miast, królestw zrobili na ziemi,\nTu mnie z triumfem doprowadź do celu,\nOświeć mnie sobą, a żebym z zapałem\nSkreślił ich kształty, jak je sam poznałem,\nObjaw moc swoją w tych wierszach niewielu."
    verse: true
    chunks:
