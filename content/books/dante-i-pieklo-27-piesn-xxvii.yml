chapter: 27
chapterTitle: "Pieśń XXVII"
chapterTitleRu: "Песнь XXVII. Гвидо да Монтефельтро"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok VIII. Ciąg dalszy. Gwido z Montefeltro.)"
    chunks:
      - pl: "(Krąg VIII. Tłumok VIII. Ciąg dalszy. Gwido z Montefeltro.)"
        ru: "(Круг VIII. Ров VIII. Продолжение. Гвидо да Монтефельтро.)"
    words: { "Krąg": krag, "Ciąg": ciag, "dalszy": daleki }
  - clean: "Płomień prostując ostrze i milczący\nOdchodził od nas jak szermierz od mety,\nZa przyzwoleniem słodkiego poety.\nGdy oto, widzę, drugi płomień kroczy,\nNa swoje ostrze zwrócił moje oczy,\nGłosem, co szumiał zeń z trzaskiem i sykiem;\nJak sycylijski byk żarem ziejący\nCo po raz pierwszy, i słusznie zaiste,\nRyknął swojego budownika krzykiem,\nA potem ryczał jękiem nieszczęśliwych,\nKtórych palono w jego wnętrzu żywych;"
    verse: true
    chunks:
      - pl: "Płomień prostując ostrze i milczący"
        ru: "Пламя, выпрямив остриё, и молчащее,"
      - pl: "\nOdchodził od nas jak szermierz od mety,"
        ru: "уходило от нас, как боец от черты,"
        note: "szermierz — фехтовальщик, боец; meta — черта"
      - pl: "\nZa przyzwoleniem słodkiego poety."
        ru: "с позволения сладкого поэта."
        note: "przyzwolenie — позволение"
      - pl: "\nGdy oto, widzę, drugi płomień kroczy,"
        ru: "Как вот, вижу, другое пламя шагает,"
      - pl: "\nNa swoje ostrze zwrócił moje oczy,"
        ru: "к своему острию оно обратило мои глаза"
      - pl: "\nGłosem, co szumiał zeń z trzaskiem i sykiem;"
        ru: "голосом, что шумел из него с треском и шипением;"
        note: "syk — шипение"
      - pl: "\nJak sycylijski byk żarem ziejący"
        ru: "как сицилийский бык, пышущий жаром,"
        note: "медный бык тирана Фалариса"
      - pl: "\nCo po raz pierwszy, i słusznie zaiste,"
        ru: "что в первый раз, и воистину справедливо,"
      - pl: "\nRyknął swojego budownika krzykiem,"
        ru: "взревел криком своего строителя,"
      - pl: "\nA potem ryczał jękiem nieszczęśliwych,"
        ru: "а потом ревел стоном несчастных,"
      - pl: "\nKtórych palono w jego wnętrzu żywych;"
        ru: "которых сжигали живьём в его нутре;"
    words: { "Płomień": plomien, "ostrze": ostrze, "mety": meta, "poety": poeta, "ziejący": ziac, "wnętrzu": wnetrze }
  - clean: "To ciało z miedzi, niejeden w złudzeniu\nMyślał, że wiercą bóle rzeczywiste:\nTak zamkniętego ducha głos w płomieniu\nNie mając ujścia trzask ognia udawał,\nLecz gdy przez ostrze utorował drogę,\nDał mu ruch, jaki jemu język dawał,\nSłyszałem, w takie zamienił się słowo:\n«Ty, co lombardzką przemówiłeś mową,\nMówiąc: Idź, dłużej pytać cię nie mogę,\nChociaż przyszedłem za późno, nie w porę,\nO, nie odmawiaj, racz pomówić ze mną!"
    verse: true
    chunks:
      - pl: "To ciało z miedzi, niejeden w złudzeniu"
        ru: "хотя тело это было из меди, не один в заблуждении"
        note: "złudzenie — заблуждение"
      - pl: "\nMyślał, że wiercą bóle rzeczywiste:"
        ru: "думал, что его сверлят настоящие боли:"
      - pl: "\nTak zamkniętego ducha głos w płomieniu"
        ru: "так голос духа, заключённого в пламени,"
      - pl: "\nNie mając ujścia trzask ognia udawał,"
        ru: "не имея выхода, подражал треску огня,"
        note: "udawać — подражать"
      - pl: "\nLecz gdy przez ostrze utorował drogę,"
        ru: "но когда он проложил себе путь через остриё,"
        note: "utorować — проложить"
      - pl: "\nDał mu ruch, jaki jemu język dawał,"
        ru: "дал ему движение, какое давал ему язык,"
      - pl: "\nSłyszałem, w takie zamienił się słowo:"
        ru: "я слышал, он превратился в такое слово:"
      - pl: "\n«Ty, co lombardzką przemówiłeś mową,"
        ru: "«Ты, что заговорил ломбардской речью,"
        note: "lombardzki — ломбардский"
      - pl: "\nMówiąc: Idź, dłużej pytać cię nie mogę,"
        ru: "говоря: „Иди, дольше спрашивать тебя не могу“, —"
      - pl: "\nChociaż przyszedłem za późno, nie w porę,"
        ru: "хоть я пришёл слишком поздно, не вовремя,"
      - pl: "\nO, nie odmawiaj, racz pomówić ze mną!"
        ru: "о, не отказывай, изволь поговорить со мной!"
    words: { "bóle": bol, "język": jezyk, "zamienił": zamienic, "przemówiłeś": przemowic, "odmawiaj": odmawiac, "pomówić": pomowic }
  - clean: "Widzisz, że mówię, a jednak ja gorę.\nO, jeśli schodzisz w naszą otchłań ciemną\nZ słodkiej i pięknej Latynów krainy,\nZ której tu czynię pokutę za winy,\nCiekawość ziomka przez litość uspokój,\nMów, w Romaniji wojna jest czy pokój?"
    verse: true
    chunks:
      - pl: "Widzisz, że mówię, a jednak ja gorę."
        ru: "Видишь, я говорю, а ведь я горю."
      - pl: "\nO, jeśli schodzisz w naszą otchłań ciemną"
        ru: "О, если ты спускаешься в нашу тёмную бездну"
      - pl: "\nZ słodkiej i pięknej Latynów krainy,"
        ru: "из сладкой и прекрасной страны латинян,"
      - pl: "\nZ której tu czynię pokutę za winy,"
        ru: "из которой я здесь несу покаяние за вины,"
      - pl: "\nCiekawość ziomka przez litość uspokój,"
        ru: "утоли из жалости любопытство земляка,"
      - pl: "\nMów, w Romaniji wojna jest czy pokój?"
        ru: "скажи: в Романье война или мир?"
    words: { "schodzisz": schodzic, "ciemną": ciemny, "krainy": kraina, "czynię": czynic, "Ciekawość": ciekawosc, "litość": litosc }
  - clean: "Bo ja z latyńskiej matki życie wziąłem,\nW górach pomiędzy Tybrem a Urbinem».\nSłuchałem jeszcze z pochylonym czołem,\nGdy mistrz mnie trącił i rzekł: «Mów z Latynem!»\nMając odpowiedź już gotową w myśli,\nBez zwłoki rzekłem: «Duchu, któż określi,\nJak jest Romania twoja niespokojna!"
    verse: true
    chunks:
      - pl: "Bo ja z latyńskiej matki życie wziąłem,"
        ru: "Ибо я от латинской матери получил жизнь,"
      - pl: "\nW górach pomiędzy Tybrem a Urbinem»."
        ru: "в горах между Тибром и Урбино»."
        note: "Монтефельтро"
      - pl: "\nSłuchałem jeszcze z pochylonym czołem,"
        ru: "Я слушал ещё, склонив чело,"
      - pl: "\nGdy mistrz mnie trącił i rzekł: «Mów z Latynem!»"
        ru: "когда учитель тронул меня и сказал: «Говори с латинянином!»"
      - pl: "\nMając odpowiedź już gotową w myśli,"
        ru: "Имея ответ уже готовым в мысли,"
      - pl: "\nBez zwłoki rzekłem: «Duchu, któż określi,"
        ru: "без промедления я сказал: «Дух, кто же опишет,"
        note: "określić — определить, описать"
      - pl: "\nJak jest Romania twoja niespokojna!"
        ru: "как беспокойна твоя Романья!"
    words: { "pochylonym": pochylic, "mistrz": mistrz, "rzekł": rzec, "Duchu": duch, "określi": okreslic, "niespokojna": niespokojny }
  - clean: "Gdym odszedł, jawna nie wrzała w niej wojna,\nRząd po staremu tyrański w Rawennie,\nOrzeł z Polenty wziął ją w dziób swój orli,\nI nakrył Cerwię sąsiednią skrzydłami.\nPosoką Franków zbroczony kraj Forli,\nPod zielonego lwa leży szponami."
    verse: true
    chunks:
      - pl: "Gdym odszedł, jawna nie wrzała w niej wojna,"
        ru: "Когда я ушёл, явная война в ней не кипела,"
        note: "jawny — явный"
      - pl: "\nRząd po staremu tyrański w Rawennie,"
        ru: "правление по-старому тираническое в Равенне,"
      - pl: "\nOrzeł z Polenty wziął ją w dziób swój orli,"
        ru: "орёл из Поленты взял её в свой орлиный клюв,"
        note: "герб рода да Полента"
      - pl: "\nI nakrył Cerwię sąsiednią skrzydłami."
        ru: "и накрыл крыльями соседнюю Червию."
      - pl: "\nPosoką Franków zbroczony kraj Forli,"
        ru: "Земля Форли, обагрённая кровью франков,"
        note: "zbroczony — обагрённый"
      - pl: "\nPod zielonego lwa leży szponami."
        ru: "лежит под когтями зелёного льва."
        note: "герб Орделаффи"
    words: { "odszedł": odejsc, "wojna": wojna, "Rząd": rzad, "Orzeł": orzel, "skrzydłami": skrzydlo, "kraj": kraj }
  - clean: "Brytan z Werukio, on i jego szczenię,\nCo mogą śmiało Montagna zadławić,\nRządzą w Rimini, tam jest ich siedzenie,\nGdzie już przywykli swoje zęby krwawić.\nLudem Faency rządzi starożytny\nLew w gnieździe białym na tarczy błękitnej,\nŁaknący ciągłej w stronnictwach odmiany."
    verse: true
    chunks:
      - pl: "Brytan z Werukio, on i jego szczenię,"
        ru: "Пёс из Верруккьо, он и его щенок,"
        note: "Малатеста; szczenię — щенок"
      - pl: "\nCo mogą śmiało Montagna zadławić,"
        ru: "что смело могут удавить Монтанью,"
        note: "zadławić — удавить"
      - pl: "\nRządzą w Rimini, tam jest ich siedzenie,"
        ru: "правят в Римини, там их седалище,"
        note: "siedzenie — здесь «резиденция»"
      - pl: "\nGdzie już przywykli swoje zęby krwawić."
        ru: "где они уже привыкли кровавить свои зубы."
      - pl: "\nLudem Faency rządzi starożytny"
        ru: "Народом Фаэнцы правит древний"
      - pl: "\nLew w gnieździe białym na tarczy błękitnej,"
        ru: "лев в белом гнезде на голубом щите,"
      - pl: "\nŁaknący ciągłej w stronnictwach odmiany."
        ru: "жаждущий постоянной смены партий."
        note: "łaknąć — жаждать; odmiana — перемена"
    words: { "przywykli": przywyknac, "starożytny": starozytny, "gnieździe": gniazdo, "tarczy": tarcza, "ciągłej": ciagly, "odmiany": odmiana }
  - clean: "Ludy osiadłe nad rzeką Sawijo,\nPodobnie jako gród ich zbudowany\nPomiędzy górą a doliny szyją,\nMiędzy niewolą a wolnością żyją.\nTeraz kto jesteś? Mów, o, nie bądź twardy!\nWzględność umieją szanować Lombardy,\nMnie mówiącemu odpowiedz nawzajem»."
    verse: true
    chunks:
      - pl: "Ludy osiadłe nad rzeką Sawijo,"
        ru: "Народы, осевшие над рекой Савио,"
      - pl: "\nPodobnie jako gród ich zbudowany"
        ru: "так же, как их город построен"
      - pl: "\nPomiędzy górą a doliny szyją,"
        ru: "между горой и горлом долины,"
        note: "Чезена"
      - pl: "\nMiędzy niewolą a wolnością żyją."
        ru: "живут между неволей и свободой."
      - pl: "\nTeraz kto jesteś? Mów, o, nie bądź twardy!"
        ru: "Теперь — кто ты? Скажи, о, не будь жестоким!"
      - pl: "\nWzględność umieją szanować Lombardy,"
        ru: "Учтивость умеют уважать ломбардцы,"
        note: "względność — учтивость"
      - pl: "\nMnie mówiącemu odpowiedz nawzajem»."
        ru: "мне, говорящему, ответь взаимно»."
    words: { "Ludy": lud, "Podobnie": podobnie, "doliny": dolina, "szyją": szyja, "szanować": szanowac, "nawzajem": nawzajem }
  - clean: "Płomień sczerwieniał trochę swym zwyczajem,\nWierzch zaostrzony tam i sam obrócił,\nTchnął i wśród iskier te słowa wyrzucił:\n«Gdybym ja mniemał, że tu z gościem gadam,\nKtóry na ziemię stąd wróci szczęśliwy,\nPłomień mój wnet by nieruchomym został;\nLecz jeśli prawdę mówią, że nikt żywy\nZ tej się otchłani piekieł nie wydostał,\nMało się troszcząc o wstyd, odpowiadam."
    verse: true
    chunks:
      - pl: "Płomień sczerwieniał trochę swym zwyczajem,"
        ru: "Пламя по своему обычаю немного покраснело,"
        note: "sczerwienieć — покраснеть"
      - pl: "\nWierzch zaostrzony tam i sam obrócił,"
        ru: "заострённую вершину повернуло туда и сюда,"
      - pl: "\nTchnął i wśród iskier te słowa wyrzucił:"
        ru: "дохнуло и среди искр выбросило такие слова:"
      - pl: "\n«Gdybym ja mniemał, że tu z gościem gadam,"
        ru: "«Если бы я думал, что здесь говорю с гостем,"
        note: "gadać — болтать, говорить"
      - pl: "\nKtóry na ziemię stąd wróci szczęśliwy,"
        ru: "который вернётся отсюда на землю счастливым,"
      - pl: "\nPłomień mój wnet by nieruchomym został;"
        ru: "моё пламя тотчас стало бы неподвижным;"
      - pl: "\nLecz jeśli prawdę mówią, że nikt żywy"
        ru: "но если правду говорят, что никто живой"
      - pl: "\nZ tej się otchłani piekieł nie wydostał,"
        ru: "из этой бездны ада не выбрался,"
        note: "wydostać się — выбраться"
      - pl: "\nMało się troszcząc o wstyd, odpowiadam."
        ru: "мало заботясь о стыде, отвечаю."
    words: { "zwyczajem": zwyczaj, "obrócił": obrocic, "piekieł": pieklo, "wydostał": wydostac, "troszcząc": troszczyc, "wstyd": wstyd }
  - clean: "Byłem żołnierzem, byłem franciszkanem,\nBiorąc sznur, w moją poprawę wierzyłem\nI mógłbym stanąć bez grzechu przed Panem;\nAlem skuszony był przez Arcymnicha,\nW grzech dawny jego wtrąciła mnie pycha,\nWiedz i dlaczego, i przez co zgrzeszyłem."
    verse: true
    chunks:
      - pl: "Byłem żołnierzem, byłem franciszkanem,"
        ru: "Я был воином, был францисканцем,"
        note: "franciszkanin — францисканец"
      - pl: "\nBiorąc sznur, w moją poprawę wierzyłem"
        ru: "беря верёвку, я верил в своё исправление,"
        note: "sznur — верёвка, пояс францисканца; poprawa — исправление"
      - pl: "\nI mógłbym stanąć bez grzechu przed Panem;"
        ru: "и мог бы предстать без греха перед Господом;"
      - pl: "\nAlem skuszony był przez Arcymnicha,"
        ru: "но я был соблазнён Верховным монахом,"
        note: "alem = ale + -m; Arcymnich — папа Бонифаций VIII"
      - pl: "\nW grzech dawny jego wtrąciła mnie pycha,"
        ru: "гордыня его ввергла меня в мой давний грех,"
      - pl: "\nWiedz i dlaczego, i przez co zgrzeszyłem."
        ru: "знай, и почему, и через что я согрешил."
    words: { "żołnierzem": zolnierz, "poprawę": poprawa, "stanąć": stanac, "grzechu": grzech, "dawny": dawny, "wtrąciła": wtracic }
  - clean: "Gdym nosił ciało i kość wzięte z matki,\nPrzebiegłość głównym była moim rysem,\nZ czynów mnie zwać by nie lwem, raczej lisem,\nWykrętów moich znajdziesz żywe świadki;\nMistrz w sztuce zdrady, zdradami mojemi\nStałem się głośnym aż do krańców ziemi."
    verse: true
    chunks:
      - pl: "Gdym nosił ciało i kość wzięte z matki,"
        ru: "Пока я носил тело и кость, взятые от матери,"
      - pl: "\nPrzebiegłość głównym była moim rysem,"
        ru: "хитрость была моей главной чертой,"
        note: "przebiegłość — хитрость; rys — черта"
      - pl: "\nZ czynów mnie zwać by nie lwem, raczej lisem,"
        ru: "по делам меня звать бы не львом, скорее лисом,"
        note: "lis — лис"
      - pl: "\nWykrętów moich znajdziesz żywe świadki;"
        ru: "моих увёрток найдёшь живых свидетелей;"
        note: "wykręt — увёртка; świadki — устар. мн."
      - pl: "\nMistrz w sztuce zdrady, zdradami mojemi"
        ru: "мастер в искусстве обмана, своими обманами"
      - pl: "\nStałem się głośnym aż do krańców ziemi."
        ru: "я стал славен до краёв земли."
    words: { "czynów": czyn, "zwać": zwac, "lwem": lew, "lisem": lis, "zdrady": zdrada, "głośnym": glosny }
  - clean: "Lecz gdy dożyłem sędziwego wieku,\nGdzie każdy człowiek u dni swoich ścieku\nRad zwija żagiel, zbiera liny statku,\nCo wprzód lubiłem, zbrzydło mi w ostatku.\nPokutowałem za klasztorną kratą,\nPłacząc na moje upłynione lato,\nJużem się cieszył, że do nieba zdążę!"
    verse: true
    chunks:
      - pl: "Lecz gdy dożyłem sędziwego wieku,"
        ru: "Но когда я дожил до седого возраста,"
        note: "sędziwy — седой, преклонный"
      - pl: "\nGdzie każdy człowiek u dni swoich ścieku"
        ru: "когда каждый человек на исходе своих дней"
        note: "ściek dni — исход дней"
      - pl: "\nRad zwija żagiel, zbiera liny statku,"
        ru: "охотно сворачивает парус, собирает канаты корабля,"
      - pl: "\nCo wprzód lubiłem, zbrzydło mi w ostatku."
        ru: "что прежде я любил, опостылело мне под конец."
        note: "zbrzydnąć — опостылеть"
      - pl: "\nPokutowałem za klasztorną kratą,"
        ru: "Я каялся за монастырской решёткой,"
        note: "klasztorny — монастырский; krata — решётка"
      - pl: "\nPłacząc na moje upłynione lato,"
        ru: "оплакивая моё ушедшее лето,"
      - pl: "\nJużem się cieszył, że do nieba zdążę!"
        ru: "я уже радовался, что успею на небо!"
    words: { "wieku": wiek, "zbiera": zbierac, "Płacząc": plakac, "lato": lato, "nieba": niebo, "zdążę": zdazyc }
  - clean: "Faryzeuszów nowych pan i książę\nGrzmiał ciągłą wojną, siedząc w Lateranie;\nNie Saraceny, żydzi, nie poganie,\nWrogami jego byli chrześcijanie.\nŻaden z nich rogów księżyca nie zniża,\nNa ziemi pogan nikt nie utkwił krzyża."
    verse: true
    chunks:
      - pl: "Faryzeuszów nowych pan i książę"
        ru: "Новых фарисеев господин и князь"
        note: "папа"
      - pl: "\nGrzmiał ciągłą wojną, siedząc w Lateranie;"
        ru: "гремел непрестанной войной, сидя в Латеране;"
      - pl: "\nNie Saraceny, żydzi, nie poganie,"
        ru: "не сарацины, иудеи, не язычники,"
      - pl: "\nWrogami jego byli chrześcijanie."
        ru: "его врагами были христиане."
      - pl: "\nŻaden z nich rogów księżyca nie zniża,"
        ru: "Ни один из них не умаляет рогов луны,"
        note: "полумесяца, ислама"
      - pl: "\nNa ziemi pogan nikt nie utkwił krzyża."
        ru: "на земле язычников никто не водрузил креста."
