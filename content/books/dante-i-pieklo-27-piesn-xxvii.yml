      - pl: "\nLecz jak Konstantyn, gdy go trąd kaleczył,"
        ru: "Но как Константин, когда его калечила проказа,"
        note: "trąd — проказа"
      - pl: "\nWezwał Sylwestra, by z trądu uleczył,"
        ru: "призвал Сильвестра, чтобы тот исцелил его от проказы,"
      - pl: "\nTak on mnie wezwał; leczyłem, mnich lichy,"
        ru: "так он призвал меня; лечил я, жалкий монах,"
      - pl: "\nArcykapłana od gorączki pychy."
