      - pl: "\nSam kalał ślubów zakonnych dziewictwo,"
        ru: "сам осквернил девственность монашеских обетов,"
        note: "dziewictwo — девственность"
      - pl: "\nSznur mój miał za nic, który w owej chwili"
        ru: "мою верёвку ставил ни во что, которая в ту пору"
      - pl: "\nWięcej wychudzał tych, co go nosili."
