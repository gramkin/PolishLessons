  - clean: "Gdy schyliłem się ku wejściu, nagle przyszła mi do głowy pewna myśl. Choć raz przynajmniej pojąłem tok myślenia Morloków. Tłumiąc silną ochotę do śmiechu, przeszedłem przez brązową ramę i podszedłem do Wehikułu Czasu. Ze zdziwieniem stwierdziłem, że starannie go naoliwiono i oczyszczono. Podejrzewam od tamtej pory, że Morlokowie nawet częściowo go rozebrali, próbując na swój mętny sposób pojąć jego przeznaczenie."
    en: "“A sudden thought came into my head as I stooped towards the portal. For once, at least, I grasped the mental operations of the Morlocks. Suppressing a strong inclination to laugh, I stepped through the bronze frame and up to the Time Machine. I was surprised to find it had been carefully oiled and cleaned. I have suspected since that the Morlocks had even partially taken it to pieces while trying in their dim way to grasp its purpose."
