  - clean: "Możecie sobie wyobrazić, jak cały mój spokój zniknął. Małe bestie były tuż przy mnie. Jedna mnie dotknęła. Zamachnąłem się na nie w ciemności dźwigniami i zacząłem gramolić się na siodełko maszyny. Potem poczułem na sobie jedną rękę, potem drugą. Musiałem po prostu walczyć z ich uporczywymi palcami o dźwignie i zarazem szukać po omacku czopów, na które się je zakłada. Jedną naprawdę omal mi nie odebrali. Gdy wyślizgnęła mi się z ręki, musiałem w ciemności uderzyć głową — słyszałem, jak zadźwięczała czaszka Morloka — by ją odzyskać. Ta ostatnia szamotanina była, jak sądzę, groźniejsza niż walka w lesie."
    en: "“You may imagine how all my calm vanished. The little brutes were close upon me. One touched me. I made a sweeping blow in the dark at them with the levers, and began to scramble into the saddle of the machine. Then came one hand upon me and then another. Then I had simply to fight against their persistent fingers for my levers, and at the same time feel for the studs over which these fitted. One, indeed, they almost got away from me. As it slipped from my hand, I had to butt in the dark with my head—I could hear the Morlock’s skull ring—to recover it. It was a nearer thing than the fight in the forest, I think, this last scramble."
