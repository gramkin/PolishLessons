paragraphs:
  - clean: "Około ósmej czy dziewiątej rano doszedłem do tej samej ławki z żółtego metalu, z której oglądałem świat wieczorem w dniu przybycia. Pomyślałem o swoich pochopnych wnioskach z tamtego wieczoru i nie mogłem powstrzymać się od gorzkiego śmiechu nad własną pewnością siebie. Był tu ten sam piękny widok, to samo bujne listowie, te same wspaniałe pałace i okazałe ruiny, ta sama srebrna rzeka płynąca między żyznymi brzegami. Wesołe szaty pięknych ludzi przesuwały się tu i tam między drzewami."
    en: "“About eight or nine in the morning I came to the same seat of yellow metal from which I had viewed the world upon the evening of my arrival. I thought of my hasty conclusions upon that evening and could not refrain from laughing bitterly at my confidence. Here was the same beautiful scene, the same abundant foliage, the same splendid palaces and magnificent ruins, the same silver river running between its fertile banks. The gay robes of the beautiful people moved hither and thither among the trees."
    draft: true
    chunks:
      - pl: "Około ósmej czy dziewiątej rano doszedłem do tej samej ławki z żółtego metalu, z której oglądałem świat wieczorem w dniu przybycia."
        ru: "Около восьми или девяти утра я дошёл до той же скамьи из жёлтого металла, с которой смотрел на мир вечером в день прибытия."
      - pl: " Pomyślałem o swoich pochopnych wnioskach z tamtego wieczoru i nie mogłem powstrzymać się od gorzkiego śmiechu nad własną pewnością siebie."
        ru: "Я подумал о своих поспешных выводах того вечера и не мог удержаться от горького смеха над собственной самоуверенностью."
      - pl: " Był tu ten sam piękny widok, to samo bujne listowie, te same wspaniałe pałace i okazałe ruiny, ta sama srebrna rzeka płynąca między żyznymi brzegami."
        ru: "Здесь был тот же прекрасный вид, та же пышная листва, те же великолепные дворцы и величественные руины, та же серебряная река, текущая между плодородными берегами."
        note: "listowie — листва; żyzny — плодородный"
      - pl: " Wesołe szaty pięknych ludzi przesuwały się tu i tam między drzewami."
        ru: "Яркие одежды прекрасных людей мелькали туда и сюда между деревьями."
    words: { "ławki": lawka, "metalu": metal, "gorzkiego": gorzki, "śmiechu": smiech, "srebrna": srebrny, "przesuwały": przesuwac }
  - clean: "Niektórzy kąpali się dokładnie w tym miejscu, gdzie uratowałem Weenę, i to nagle przeszyło mnie ostrym bólem. A jak plamy na krajobrazie wznosiły się kopuły nad wejściami do Podziemnego Świata. Rozumiałem teraz, co kryło całe to piękno mieszkańców Górnego Świata. Bardzo przyjemny był ich dzień, tak przyjemny jak dzień bydła na pastwisku. Jak bydło nie znali wrogów i nie zabezpieczali się przed żadną potrzebą. I koniec mieli taki sam."
    en: "Some were bathing in exactly the place where I had saved Weena, and that suddenly gave me a keen stab of pain. And like blots upon the landscape rose the cupolas above the ways to the Underworld. I understood now what all the beauty of the Overworld people covered. Very pleasant was their day, as pleasant as the day of the cattle in the field. Like the cattle, they knew of no enemies and provided against no needs. And their end was the same."
    draft: true
    chunks:
      - pl: "Niektórzy kąpali się dokładnie w tym miejscu, gdzie uratowałem Weenę, i to nagle przeszyło mnie ostrym bólem."
        ru: "Некоторые купались как раз на том месте, где я спас Уину, и это вдруг пронзило меня острой болью."
        note: "przeszyć — пронзить"
      - pl: " A jak plamy na krajobrazie wznosiły się kopuły nad wejściami do Podziemnego Świata."
        ru: "А как пятна на пейзаже поднимались купола над входами в Подземный Мир."
      - pl: " Rozumiałem teraz, co kryło całe to piękno mieszkańców Górnego Świata."
        ru: "Теперь я понимал, что скрывала вся эта красота жителей Верхнего Мира."
      - pl: " Bardzo przyjemny był ich dzień, tak przyjemny jak dzień bydła na pastwisku."
        ru: "Очень приятен был их день, так же приятен, как день скота на пастбище."
        note: "pastwisko — пастбище"
      - pl: " Jak bydło nie znali wrogów i nie zabezpieczali się przed żadną potrzebą."
        ru: "Как скот, они не знали врагов и не запасались ни на какую нужду."
      - pl: " I koniec mieli taki sam."
        ru: "И конец у них был такой же."
    words: { "plamy": plama, "wznosiły": wznosic, "wejściami": wejscie, "Podziemnego": podziemny, "Górnego": gorny, "bydła": bydlo }
  - clean: "Zasmuciła mnie myśl, jak krótki był sen ludzkiego rozumu. Popełnił samobójstwo. Uparcie dążył do wygody i spokoju, do zrównoważonego społeczeństwa z hasłem bezpieczeństwa i trwałości, osiągnął to, czego pragnął — by w końcu dojść do tego. Niegdyś życie i własność musiały osiągnąć niemal absolutne bezpieczeństwo. Bogaty był pewien swego bogactwa i wygody, pracujący pewien swego życia i pracy. Bez wątpienia w tym doskonałym świecie nie było problemu bezrobocia ani nierozwiązanej kwestii społecznej. I nastała wielka cisza."
    en: "“I grieved to think how brief the dream of the human intellect had been. It had committed suicide. It had set itself steadfastly towards comfort and ease, a balanced society with security and permanency as its watchword, it had attained its hopes—to come to this at last. Once, life and property must have reached almost absolute safety. The rich had been assured of his wealth and comfort, the toiler assured of his life and work. No doubt in that perfect world there had been no unemployed problem, no social question left unsolved. And a great quiet had followed."
    draft: true
    chunks:
      - pl: "Zasmuciła mnie myśl, jak krótki był sen ludzkiego rozumu."
        ru: "Меня опечалила мысль о том, как короток был сон человеческого разума."
      - pl: " Popełnił samobójstwo."
        ru: "Он совершил самоубийство."
        note: "samobójstwo — самоубийство"
      - pl: " Uparcie dążył do wygody i spokoju, do zrównoważonego społeczeństwa z hasłem bezpieczeństwa i trwałości,"
        ru: "Он упорно стремился к удобству и покою, к уравновешенному обществу с девизом безопасности и постоянства,"
        note: "trwałość — постоянство, прочность"
      - pl: " osiągnął to, czego pragnął — by w końcu dojść do tego."
        ru: "достиг того, чего желал, — чтобы в конце концов прийти к этому."
      - pl: " Niegdyś życie i własność musiały osiągnąć niemal absolutne bezpieczeństwo."
        ru: "Когда-то жизнь и собственность, должно быть, достигли почти абсолютной безопасности."
      - pl: " Bogaty był pewien swego bogactwa i wygody, pracujący pewien swego życia i pracy."
        ru: "Богатый был уверен в своём богатстве и удобстве, труженик — в своей жизни и работе."
      - pl: " Bez wątpienia w tym doskonałym świecie nie było problemu bezrobocia ani nierozwiązanej kwestii społecznej."
        ru: "Без сомнения, в этом совершенном мире не было проблемы безработицы, не осталось ни одного нерешённого социального вопроса."
        note: "bezrobocie — безработица"
      - pl: " I nastała wielka cisza."
        ru: "И наступила великая тишина."
    words: { "rozumu": rozum, "dążył": dazyc, "hasłem": haslo, "absolutne": absolutny, "bogactwa": bogactwo, "społecznej": spoleczny }
  - clean: "Jest to prawo natury, które przeoczamy: wszechstronność umysłu jest wynagrodzeniem za zmianę, niebezpieczeństwo i trudy. Zwierzę w doskonałej harmonii ze swoim otoczeniem jest doskonałym mechanizmem. Natura nigdy nie odwołuje się do inteligencji, dopóki nawyk i instynkt nie staną się bezużyteczne. Nie ma inteligencji tam, gdzie nie ma zmiany i potrzeby zmiany. Tylko te zwierzęta mają udział w inteligencji, które muszą sprostać ogromnej różnorodności potrzeb i niebezpieczeństw."
    en: "“It is a law of nature we overlook, that intellectual versatility is the compensation for change, danger, and trouble. An animal perfectly in harmony with its environment is a perfect mechanism. Nature never appeals to intelligence until habit and instinct are useless. There is no intelligence where there is no change and no need of change. Only those animals partake of intelligence that have to meet a huge variety of needs and dangers."
    draft: true
    chunks:
      - pl: "Jest to prawo natury, które przeoczamy: wszechstronność umysłu jest wynagrodzeniem za zmianę, niebezpieczeństwo i trudy."
        ru: "Это закон природы, который мы упускаем из виду: гибкость ума — вознаграждение за перемены, опасности и невзгоды."
        note: "wszechstronność — разносторонность; wynagrodzenie — вознаграждение"
      - pl: " Zwierzę w doskonałej harmonii ze swoim otoczeniem jest doskonałym mechanizmem."
        ru: "Животное, совершенно гармонирующее со своей средой, — совершенный механизм."
        note: "otoczenie — окружение, среда"
      - pl: " Natura nigdy nie odwołuje się do inteligencji, dopóki nawyk i instynkt nie staną się bezużyteczne."
        ru: "Природа никогда не обращается к разуму, пока привычка и инстинкт не становятся бесполезны."
        note: "odwoływać się — обращаться (к чему-л.)"
      - pl: " Nie ma inteligencji tam, gdzie nie ma zmiany i potrzeby zmiany."
        ru: "Нет разума там, где нет перемен и нужды в переменах."
      - pl: " Tylko te zwierzęta mają udział w inteligencji, które muszą sprostać ogromnej różnorodności potrzeb i niebezpieczeństw."
        ru: "Разумом наделены лишь те животные, которым приходится справляться с огромным разнообразием нужд и опасностей."
        note: "sprostać — справиться"
    words: { "trudy": trud, "inteligencji": inteligencja, "nawyk": nawyk, "instynkt": instynkt, "bezużyteczne": bezuzyteczny }
  - clean: "Tak więc, jak to widzę, człowiek Górnego Świata dryfował ku swej wątłej urodzie, a Podziemny — ku czysto mechanicznej pracowitości. Ale temu doskonałemu stanowi brakowało jednej rzeczy, nawet do mechanicznej doskonałości — absolutnej trwałości. Najwyraźniej z biegiem czasu wyżywienie Podziemnego Świata, jakkolwiek się odbywało, uległo rozprzężeniu. Matka Konieczność, odsunięta na kilka tysięcy lat, wróciła i zaczęła od dołu. Podziemny Świat, mając styczność z maszynerią, która, jakkolwiek doskonała, wciąż wymaga odrobiny myśli poza nawykiem, zachował zapewne z konieczności nieco więcej inicjatywy, choć mniej wszystkich innych cech ludzkich, niż Górny."
    en: "“So, as I see it, the Upperworld man had drifted towards his feeble prettiness, and the Underworld to mere mechanical industry. But that perfect state had lacked one thing even for mechanical perfection—absolute permanency. Apparently as time went on, the feeding of an Underworld, however it was effected, had become disjointed. Mother Necessity, who had been staved off for a few thousand years, came back again, and she began below. The Underworld being in contact with machinery, which, however perfect, still needs some little thought outside habit, had probably retained perforce rather more initiative, if less of every other human character, than the Upper."
    draft: true
    chunks:
      - pl: "Tak więc, jak to widzę, człowiek Górnego Świata dryfował ku swej wątłej urodzie, a Podziemny — ku czysto mechanicznej pracowitości."
        ru: "Итак, как я это вижу, человек Верхнего Мира дрейфовал к своей хилой миловидности, а Подземного — к чисто механическому трудолюбию."
        note: "pracowitość — трудолюбие"
      - pl: " Ale temu doskonałemu stanowi brakowało jednej rzeczy, nawet do mechanicznej doskonałości — absolutnej trwałości."
        ru: "Но этому совершенному состоянию недоставало одного, даже для механического совершенства, — абсолютного постоянства."
      - pl: " Najwyraźniej z biegiem czasu wyżywienie Podziemnego Świata, jakkolwiek się odbywało, uległo rozprzężeniu."
        ru: "Очевидно, с течением времени снабжение Подземного Мира пищей, как бы оно ни осуществлялось, расстроилось."
        note: "wyżywienie — пропитание; rozprzężenie — разлад"
      - pl: " Matka Konieczność, odsunięta na kilka tysięcy lat, wróciła i zaczęła od dołu."
        ru: "Мать-Необходимость, отодвинутая на несколько тысяч лет, вернулась — и начала снизу."
      - pl: " Podziemny Świat, mając styczność z maszynerią, która, jakkolwiek doskonała, wciąż wymaga odrobiny myśli poza nawykiem,"
        ru: "Подземный Мир, соприкасаясь с машинами, которые, как бы совершенны ни были, всё же требуют немного мысли сверх привычки,"
        note: "styczność — соприкосновение"
      - pl: " zachował zapewne z konieczności nieco więcej inicjatywy, choć mniej wszystkich innych cech ludzkich, niż Górny."
        ru: "сохранил, вероятно, поневоле несколько больше инициативы, хотя и меньше всех прочих человеческих черт, чем Верхний."
    words: { "wątłej": watly, "urodzie": uroda, "Podziemny": podziemny, "absolutnej": absolutny, "Konieczność": koniecznosc, "nawykiem": nawyk }
  - clean: "A gdy zabrakło im innego mięsa, zwrócili się ku temu, czego dawny nawyk dotąd zabraniał. Tak, powiadam, widziałem to w moim ostatnim spojrzeniu na świat roku osiemset dwa tysiące siedemset jeden. Może to być wyjaśnienie tak błędne, jak tylko zdoła wymyślić śmiertelny rozum. Tak ta rzecz ukształtowała się w moich oczach, i jako takie wam je podaję."
    en: "And when other meat failed them, they turned to what old habit had hitherto forbidden. So I say I saw it in my last view of the world of Eight Hundred and Two Thousand Seven Hundred and One. It may be as wrong an explanation as mortal wit could invent. It is how the thing shaped itself to me, and as that I give it to you."
    draft: true
    chunks:
      - pl: "A gdy zabrakło im innego mięsa, zwrócili się ku temu, czego dawny nawyk dotąd zabraniał."
        ru: "А когда другое мясо у них кончилось, они обратились к тому, что до сих пор запрещала старая привычка."
      - pl: " Tak, powiadam, widziałem to w moim ostatnim spojrzeniu na świat roku osiemset dwa tysiące siedemset jeden."
        ru: "Так, говорю я, я видел это, в последний раз взглянув на мир восемьсот две тысячи семьсот первого года."
      - pl: " Może to być wyjaśnienie tak błędne, jak tylko zdoła wymyślić śmiertelny rozum."
        ru: "Может быть, это объяснение настолько ошибочно, насколько только способен выдумать смертный ум."
      - pl: " Tak ta rzecz ukształtowała się w moich oczach, i jako takie wam je podaję."
        ru: "Так это сложилось в моих глазах, и таким я вам его и передаю."
    words: { "zabrakło": zabraknac, "nawyk": nawyk, "dotąd": dotad, "śmiertelny": smiertelny, "rozum": rozum, "podaję": podawac }
  - clean: "Po trudach, wzruszeniach i grozie minionych dni, mimo smutku, ta ławka, spokojny widok i ciepłe słońce były bardzo przyjemne. Byłem bardzo zmęczony i senny, i wkrótce moje teoretyzowanie przeszło w drzemkę. Złapawszy się na tym, posłuchałem własnej wskazówki i, wyciągnąwszy się na darni, zapadłem w długi, pokrzepiający sen."
    en: "“After the fatigues, excitements, and terrors of the past days, and in spite of my grief, this seat and the tranquil view and the warm sunlight were very pleasant. I was very tired and sleepy, and soon my theorising passed into dozing. Catching myself at that, I took my own hint, and spreading myself out upon the turf I had a long and refreshing sleep."
    draft: true
    chunks:
      - pl: "Po trudach, wzruszeniach i grozie minionych dni, mimo smutku, ta ławka, spokojny widok i ciepłe słońce były bardzo przyjemne."
        ru: "После усталости, волнений и ужасов минувших дней, несмотря на горе, эта скамья, спокойный вид и тёплое солнце были очень приятны."
      - pl: " Byłem bardzo zmęczony i senny, i wkrótce moje teoretyzowanie przeszło w drzemkę."
        ru: "Я очень устал и хотел спать, и вскоре мои рассуждения перешли в дрёму."
        note: "drzemka — дрёма"
      - pl: " Złapawszy się na tym, posłuchałem własnej wskazówki i, wyciągnąwszy się na darni, zapadłem w długi, pokrzepiający sen."
        ru: "Поймав себя на этом, я последовал собственной подсказке и, растянувшись на дёрне, погрузился в долгий освежающий сон."
        note: "pokrzepiający — освежающий, бодрящий"
    words: { "trudach": trud, "smutku": smutek, "ławka": lawka, "przyjemne": przyjemny, "drzemkę": drzemka, "wskazówki": wskazowka }
  - clean: "Obudziłem się tuż przed zachodem słońca. Nie bałem się już, że Morlokowie zaskoczą mnie we śnie, i przeciągnąwszy się, zszedłem ze wzgórza w stronę Białego Sfinksa. W jednej ręce miałem łom, a druga bawiła się zapałkami w kieszeni."
    en: "“I awoke a little before sunsetting. I now felt safe against being caught napping by the Morlocks, and, stretching myself, I came on down the hill towards the White Sphinx. I had my crowbar in one hand, and the other hand played with the matches in my pocket."
    draft: true
    chunks:
      - pl: "Obudziłem się tuż przed zachodem słońca."
        ru: "Я проснулся незадолго до заката."
      - pl: " Nie bałem się już, że Morlokowie zaskoczą mnie we śnie, i przeciągnąwszy się, zszedłem ze wzgórza w stronę Białego Sfinksa."
        ru: "Теперь я уже не боялся, что морлоки застанут меня спящим, и, потянувшись, спустился с холма к Белому Сфинксу."
        note: "przeciągnąć się — потянуться"
      - pl: " W jednej ręce miałem łom, a druga bawiła się zapałkami w kieszeni."
        ru: "В одной руке у меня был лом, а другая перебирала спички в кармане."
    words: { "zachodem": zachod, "zaskoczą": zaskoczyc, "zszedłem": zejsc, "wzgórza": wzgorze, "kieszeni": kieszen }
  - clean: "A teraz zdarzyła się rzecz najbardziej nieoczekiwana. Gdy zbliżyłem się do cokołu sfinksa, zobaczyłem, że brązowe skrzydła są otwarte. Zsunęły się w dół, w rowki."
    en: "“And now came a most unexpected thing. As I approached the pedestal of the sphinx I found the bronze valves were open. They had slid down into grooves."
    draft: true
    chunks:
      - pl: "A teraz zdarzyła się rzecz najbardziej nieoczekiwana."
        ru: "И тут случилось самое неожиданное."
      - pl: " Gdy zbliżyłem się do cokołu sfinksa, zobaczyłem, że brązowe skrzydła są otwarte."
        ru: "Подойдя к пьедесталу сфинкса, я увидел, что бронзовые створки открыты."
      - pl: " Zsunęły się w dół, w rowki."
        ru: "Они опустились вниз, в пазы."
        note: "rowek — желобок, паз"
    words: { "zdarzyła": zdarzyc, "najbardziej": najbardziej, "zbliżyłem": zblizyc, "brązowe": brazowy, "skrzydła": skrzydlo }
  - clean: "Na ten widok stanąłem jak wryty przed nimi, wahając się, czy wejść."
    en: "“At that I stopped short before them, hesitating to enter."
    draft: true
    chunks:
      - pl: "Na ten widok stanąłem jak wryty przed nimi, wahając się, czy wejść."
        ru: "При этом я застыл перед ними как вкопанный, не решаясь войти."
