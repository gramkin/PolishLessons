# review
title: Nowele
titleRu: Новеллы
author: Bolesław Prus
source:
  name: "Wolne Lektury (Bolesław Prus, «Nowele wybrane», PIW 1976)"
  url: https://wolnelektury.pl/katalog/lektura/katarynka/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 3
chapterTitle: "Katarynka (I)"
chapterTitleRu: "Шарманка (I)"
level: B2
paragraphs:
  - clean: "Na ulicy Miodowej co dzień około południa można było spotkać jegomościa w pewnym wieku, który chodził z placu Krasińskich ku ulicy Senatorskiej. Latem nosił on wykwintne, ciemnogranatowe palto, popielate spodnie od pierwszorzędnego krawca, buty połyskujące jak zwierciadła — i — nieco wyszarzany cylinder."
    chunks:
      - pl: "Na ulicy Miodowej co dzień około południa"
        ru: "На Медовой улице каждый день около полудня"
        note: "co dzień — каждый день; сегодня чаще codziennie"
      - pl: " można było spotkać jegomościa w pewnym wieku,"
        ru: "можно было встретить господина в летах,"
        note: "jegomość — устар. «господин, сударь» (из jego mość); w pewnym wieku — немолодой, «в известном возрасте»"
      - pl: " który chodził z placu Krasińskich ku ulicy Senatorskiej."
        ru: "который ходил с площади Красинских к Сенаторской улице."
        note: "ku + дательный — книжн. «к, по направлению к»; сегодня w stronę + родительный"
      - pl: " Latem nosił on wykwintne, ciemnogranatowe palto,"
        ru: "Летом он носил изысканное тёмно-синее пальто,"
        note: "latem — летом: творительный времени; wykwintny — изысканный"
      - pl: " popielate spodnie od pierwszorzędnego krawca,"
        ru: "пепельно-серые брюки от первоклассного портного,"
        note: "spodnie — только мн. ч., как «брюки»"
      - pl: " buty połyskujące jak zwierciadła — i —"
        ru: "сапоги, блестящие, как зеркала, — и —"
        note: "zwierciadło — книжн. «зеркало»; сегодня lustro"
      - pl: " nieco wyszarzany cylinder."
        ru: "несколько поношенный цилиндр."
        note: "wyszarzany — посеревший от носки, потёртый; nieco — немного, несколько"
    words: { "ulicy": ulica, "południa": poludnie, "spotkać": spotkac, "wieku": wiek, "chodził": chodzic, "nosił": nosic, "spodnie": spodnie, "buty": but }
  - clean: "Jegomość miał twarz rumianą, szpakowate faworyty i siwe, łagodne oczy. Chodził pochylony, trzymając ręce w kieszeniach. W dzień pogodny nosił pod pachą laskę; w pochmurny — dźwigał jedwabny parasol angielski."
    chunks:
      - pl: "Jegomość miał twarz rumianą,"
        ru: "У господина было румяное лицо,"
      - pl: " szpakowate faworyty i siwe, łagodne oczy."
        ru: "седеющие бакенбарды и серые кроткие глаза."
        note: "szpakowaty — с проседью (от szpak «скворец»); faworyty — бакенбарды; siwy — седой, о глазах — серый"
      - pl: " Chodził pochylony, trzymając ręce w kieszeniach."
        ru: "Ходил он сгорбившись, держа руки в карманах."
        note: "trzymając — деепричастие от trzymać: держа"
      - pl: " W dzień pogodny nosił pod pachą laskę;"
        ru: "В ясный день носил под мышкой трость;"
        note: "pod pachą — под мышкой; pogodny — ясный, не «погодный»"
      - pl: " w pochmurny — dźwigał jedwabny parasol angielski."
        ru: "в пасмурный — таскал шёлковый английский зонт."
        note: "dźwigać — тащить тяжёлое; parasol — зонт"
    words: { "twarz": twarz, "łagodne": lagodny, "oczy": oko, "trzymając": trzymac, "ręce": reka, "kieszeniach": kieszen, "laskę": laska }
  - clean: "Był zawsze głęboko zamyślony i posuwał się z wolna. Około Kapucynów dotykał pobożnie ręką kapelusza i przechodził na drugą stronę ulicy, ażeby zobaczyć u Pika, jak stoi barometr i termometr, potem znowu zawracał na prawy chodnik, zatrzymywał się przed wystawą Mieczkowskiego, oglądał fotografie Modrzejewskiej — i szedł dalej."
    chunks:
      - pl: "Był zawsze głęboko zamyślony"
        ru: "Он всегда был глубоко задумчив"
      - pl: " i posuwał się z wolna."
        ru: "и продвигался не спеша."
        note: "z wolna — устар. «медленно»; сегодня powoli. posuwać się — продвигаться"
      - pl: " Około Kapucynów dotykał pobożnie ręką kapelusza"
        ru: "Возле капуцинов он набожно касался рукой шляпы"
        note: "Kapucyni — костёл капуцинов на Медовой; dotykać czegoś — родительный: kapelusza"
      - pl: " i przechodził na drugą stronę ulicy,"
        ru: "и переходил на другую сторону улицы,"
      - pl: " ażeby zobaczyć u Pika,"
        ru: "чтобы посмотреть у Пика,"
        note: "ażeby — устар. «чтобы»; сегодня żeby, aby. u Pika — «у Пика», в его заведении (фамилия владельца)"
      - pl: " jak stoi barometr i termometr,"
        ru: "что показывают барометр и термометр,"
        note: "jak stoi barometr — букв. «как стоит барометр»"
      - pl: " potem znowu zawracał na prawy chodnik,"
        ru: "потом снова возвращался на правый тротуар,"
        note: "chodnik — тротуар; zawracać — поворачивать назад"
      - pl: " zatrzymywał się przed wystawą Mieczkowskiego,"
        ru: "останавливался перед витриной Мечковского,"
        note: "wystawa — витрина (и выставка); przed + творительный"
      - pl: " oglądał fotografie Modrzejewskiej — i szedł dalej."
        ru: "рассматривал фотографии Моджеевской — и шёл дальше."
        note: "Helena Modrzejewska — знаменитая актриса тех лет"
    words: { "zawsze": zawsze, "głęboko": gleboko, "dotykał": dotykac, "kapelusza": kapelusz, "stronę": strona, "zobaczyć": zobaczyc, "zatrzymywał": zatrzymywac, "wystawą": wystawa, "oglądał": ogladac }
  - clean: "W drodze ustępował każdemu, a potrącony uśmiechał się życzliwie."
    chunks:
      - pl: "W drodze ustępował każdemu,"
        ru: "По дороге он уступал каждому,"
        note: "ustępować komuś — дательный"
      - pl: " a potrącony uśmiechał się życzliwie."
        ru: "а когда его задевали, доброжелательно улыбался."
        note: "potrącony — причастие: «задетый, толкнутый»"
    words: { "drodze": droga, "każdemu": kazdy, "uśmiechał": usmiechac }
  - clean: "Jeżeli kiedy spostrzegał ładną kobietę, zakładał binokle, aby przypatrzeć się jej. Ale że robił to flegmatycznie, więc zwykle spotykał go zawód."
    chunks:
      - pl: "Jeżeli kiedy spostrzegał ładną kobietę,"
        ru: "Если иной раз он замечал хорошенькую женщину,"
        note: "kiedy здесь = kiedykolwiek, «когда-нибудь»; spostrzegać — замечать"
      - pl: " zakładał binokle, aby przypatrzeć się jej."
        ru: "он надевал пенсне, чтобы её рассмотреть."
        note: "binokle — пенсне; przypatrzeć się komuś — дательный; сегодня чаще przyjrzeć się jej"
      - pl: " Ale że robił to flegmatycznie,"
        ru: "Но так как делал он это флегматично,"
        note: "że…, więc… — книжное «так как…, то…»"
      - pl: " więc zwykle spotykał go zawód."
        ru: "то обычно его постигало разочарование."
        note: "zawód — здесь «разочарование», не «профессия»"
    words: { "ładną": ladny, "kobietę": kobieta, "robił": robic, "zwykle": zwykle, "zawód": zawod }
  - clean: "Ten jegomość był to — pan Tomasz."
    chunks:
      - pl: "Ten jegomość był to — pan Tomasz."
        ru: "Этим господином был — пан Томаш."
        note: "был to — книжная связка «это был»"
    words: { "pan": pan }
  - clean: "Pan Tomasz trzydzieści lat chodził ulicą Miodową i nieraz myślał, że się na niej wiele rzeczy zmieniło. Toż samo ulica Miodowa pomyśleć by mogła o nim."
    chunks:
      - pl: "Pan Tomasz trzydzieści lat chodził ulicą Miodową"
        ru: "Пан Томаш тридцать лет ходил по Медовой улице"
        note: "chodzić ulicą — творительный пути: «по улице»"
      - pl: " i nieraz myślał,"
        ru: "и не раз думал,"
        note: "nieraz — не раз, часто; не путать с nigdy"
      - pl: " że się na niej wiele rzeczy zmieniło."
        ru: "что многое на ней изменилось."
        note: "się перед глаголом — старый порядок; сегодня że wiele rzeczy się na niej zmieniło"
      - pl: " Toż samo ulica Miodowa"
        ru: "То же самое Медовая улица"
        note: "toż samo — устар. «то же самое»; сегодня to samo"
      - pl: " pomyśleć by mogła o nim."
        ru: "могла бы подумать о нём."
    words: { "trzydzieści": trzydziesci, "lat": rok, "chodził": chodzic, "myślał": myslec, "wiele": wiele, "rzeczy": rzecz, "zmieniło": zmienic, "pomyśleć": pomyslec }
  - clean: "Gdy był jeszcze obrońcą, biegał tak prędko, że nie uciekłaby przed nim żadna szwaczka wracająca z magazynu do domu. Był wesoły, rozmowny, trzymał się prosto, miał czuprynę i nosił wąsy zakręcone ostro do góry. Już wówczas sztuki piękne robiły na nim wrażenie, ale czasu im nie poświęcał, bo szalał — za kobietami. Co prawda miał do nich szczęście i nieustannie był swatany. Ale cóż z tego, kiedy pan Tomasz nie mógł nigdy znaleźć ani jednej chwili na oświadczyny, będąc zajęty jeżeli nie praktyką, to — schadzkami. Od Frani szedł do sądu, z sądu biegł do Zosi, którą nad wieczorem opuszczał, ażeby z Józią i Filką zjeść kolację."
    chunks:
      - pl: "Gdy był jeszcze obrońcą,"
        ru: "Когда он был ещё защитником,"
        note: "obrońca — адвокат-защитник; być + творительный"
      - pl: " biegał tak prędko,"
        ru: "бегал так быстро,"
        note: "prędko — быстро; сегодня чаще szybko"
      - pl: " że nie uciekłaby przed nim żadna szwaczka"
        ru: "что от него не убежала бы ни одна швея,"
        note: "uciec przed kimś — убежать от кого-л."
      - pl: " wracająca z magazynu do domu."
        ru: "возвращающаяся из мастерской домой."
        note: "magazyn — тогда модная мастерская-магазин; сегодня «склад»"
      - pl: " Był wesoły, rozmowny, trzymał się prosto,"
        ru: "Он был весел, разговорчив, держался прямо,"
      - pl: " miał czuprynę i nosił wąsy"
        ru: "имел густую шевелюру и носил усы,"
        note: "czupryna — чуб, шевелюра; wąsy — усы (мн. ч.)"
      - pl: " zakręcone ostro do góry."
        ru: "лихо закрученные вверх."
        note: "do góry — вверх"
      - pl: " Już wówczas sztuki piękne robiły na nim wrażenie,"
        ru: "Уже тогда изящные искусства производили на него впечатление,"
        note: "wówczas — книжн. «тогда»; robić wrażenie na kimś — на + предложный"
      - pl: " ale czasu im nie poświęcał,"
        ru: "но времени им не уделял,"
        note: "родительный при отрицании: czasu"
      - pl: " bo szalał — za kobietami."
        ru: "потому что был без ума — от женщин."
        note: "szaleć za kimś — сходить с ума по ком-л."
      - pl: " Co prawda miał do nich szczęście"
        ru: "Правда, ему с ними везло"
        note: "mieć szczęście do kogoś — везти с кем-л."
      - pl: " i nieustannie był swatany."
        ru: "и его непрестанно сватали."
      - pl: " Ale cóż z tego,"
        ru: "Но что с того,"
        note: "cóż — книжн. co с усилительным -ż"
      - pl: " kiedy pan Tomasz nie mógł nigdy znaleźć"
        ru: "раз пан Томаш никак не мог найти"
        note: "kiedy здесь «раз, если»"
      - pl: " ani jednej chwili na oświadczyny,"
        ru: "ни минуты для предложения руки и сердца,"
        note: "oświadczyny — предложение руки, только мн. ч."
      - pl: " będąc zajęty jeżeli nie praktyką, to — schadzkami."
        ru: "будучи занят если не практикой, то — свиданиями."
        note: "jeżeli nie…, to… — если не…, то…; schadzka — тайное свидание"
      - pl: " Od Frani szedł do sądu,"
        ru: "От Франи он шёл в суд,"
      - pl: " z sądu biegł do Zosi,"
        ru: "из суда бежал к Зосе,"
      - pl: " którą nad wieczorem opuszczał,"
        ru: "которую под вечер оставлял,"
        note: "nad wieczorem — устар. «под вечер»; сегодня pod wieczór"
      - pl: " ażeby z Józią i Filką zjeść kolację."
        ru: "чтобы поужинать с Юзей и Филькой."
        note: "zjeść kolację — поужинать"
    words: { "biegał": biegac, "prędko": predko, "wracająca": wracac, "domu": dom, "wesoły": wesoly, "wąsy": wasy, "wrażenie": wrazenie, "czasu": czas, "szczęście": szczescie, "znaleźć": znalezc, "chwili": chwila, "sądu": sad, "kolację": kolacja }
  - clean: "Gdy został mecenasem, czoło, skutkiem natężonej pracy umysłowej, urosło mu aż do ciemienia, a na wąsach pokazało się kilka srebrnych włosów. Pan Tomasz pozbył się już wówczas młodzieńczej gorączki, miał majątek i ustaloną opinię znawcy sztuk pięknych. A że kobiety wciąż kochał, więc począł myśleć o małżeństwie. Najął nawet mieszkanie z sześciu pokojów złożone, urządził w nim na własny koszt posadzki, sprawił obicia, piękne meble — i szukał żony."
    chunks:
      - pl: "Gdy został mecenasem,"
        ru: "Когда он стал меценасом,"
        note: "mecenas — в Польше обращение к адвокату, ложный друг «мецената»"
      - pl: " czoło, skutkiem natężonej pracy umysłowej,"
        ru: "лоб, вследствие напряжённой умственной работы,"
        note: "skutkiem czegoś — книжн. «вследствие»; сегодня wskutek"
      - pl: " urosło mu aż do ciemienia,"
        ru: "вырос у него до самого темени,"
        note: "шутка о лысине; ciemię — темя; mu — «у него»"
      - pl: " a na wąsach pokazało się kilka srebrnych włosów."
        ru: "а на усах показалось несколько серебряных волосков."
        note: "kilka + родительный мн. ч."
      - pl: " Pan Tomasz pozbył się już wówczas młodzieńczej gorączki,"
        ru: "Пан Томаш уже тогда избавился от юношеской горячки,"
        note: "pozbyć się czegoś — родительный"
      - pl: " miał majątek i ustaloną opinię"
        ru: "имел состояние и прочную репутацию"
        note: "majątek — состояние; opinia — здесь «репутация»"
      - pl: " znawcy sztuk pięknych."
        ru: "знатока изящных искусств."
      - pl: " A że kobiety wciąż kochał,"
        ru: "А так как женщин он всё ещё любил,"
      - pl: " więc począł myśleć o małżeństwie."
        ru: "то начал подумывать о женитьбе."
        note: "począć — устар. «начать»; сегодня zaczął. myśleć o + предложный"
      - pl: " Najął nawet mieszkanie z sześciu pokojów złożone,"
        ru: "Он даже снял квартиру из шести комнат,"
        note: "nająć — нанять, снять; pokojów — старое род. мн. ч., сегодня pokoi"
      - pl: " urządził w nim na własny koszt posadzki,"
        ru: "настелил в ней за свой счёт паркетные полы,"
        note: "posadzka — пол (паркет, плитка); na własny koszt — за свой счёт"
      - pl: " sprawił obicia, piękne meble — i szukał żony."
        ru: "обзавёлся обивкой стен, красивой мебелью — и искал жену."
        note: "sprawić (sobie) coś — справить, обзавестись; obicie — обивка стен тканью; szukać + родительный: żony"
    words: { "został": zostac, "pracy": praca, "włosów": wlos, "majątek": majatek, "kochał": kochac, "myśleć": myslec, "małżeństwie": malzenstwo, "koszt": koszt, "meble": mebel, "szukał": szukac, "żony": zona }
  - clean: "Ale człowiekowi dojrzałemu trudno zrobić wybór. Ta była za młoda, a tamtą uwielbiał już zbyt długo. Trzecia miała wdzięki i wiek właściwy, ale nieodpowiedni temperament, a czwarta posiadała wdzięki, wiek i temperament należyty, ale… nie czekając na oświadczyny mecenasa wyszła za doktora…"
    chunks:
      - pl: "Ale człowiekowi dojrzałemu trudno zrobić wybór."
        ru: "Но зрелому человеку трудно сделать выбор."
        note: "człowiekowi — дательный при trudno"
      - pl: " Ta była za młoda,"
        ru: "Эта была слишком молода,"
      - pl: " a tamtą uwielbiał już zbyt długo."
        ru: "а ту он обожал уже слишком долго."
      - pl: " Trzecia miała wdzięki i wiek właściwy,"
        ru: "У третьей были прелести и подходящий возраст,"
        note: "wdzięki — прелести, очарование (мн. ч. от wdzięk)"
      - pl: " ale nieodpowiedni temperament,"
        ru: "но неподходящий темперамент,"
      - pl: " a czwarta posiadała wdzięki, wiek i temperament należyty,"
        ru: "а четвёртая обладала прелестями, возрастом и должным темпераментом,"
        note: "należyty — книжн. «надлежащий»; posiadać — книжнее, чем mieć"
      - pl: " ale… nie czekając na oświadczyny mecenasa"
        ru: "но… не дождавшись предложения меценаса,"
        note: "czekać na + винительный"
      - pl: " wyszła za doktora…"
        ru: "вышла за доктора…"
        note: "wyjść za kogoś — выйти замуж: za + винительный"
    words: { "człowiekowi": czlowiek, "trudno": trudno, "wybór": wybor, "młoda": mlody, "długo": dlugo, "wiek": wiek, "czekając": czekac, "doktora": doktor }
  - clean: "Pan Tomasz jednak nie martwił się, ponieważ panien nie brakło. Ekwipował się powoli, coraz usilniej dbając o to, ażeby każdy szczegół jego mieszkania posiadał wartość artystyczną. Zmieniał meble, przestawiał zwierciadła, kupował obrazy."
    chunks:
      - pl: "Pan Tomasz jednak nie martwił się,"
        ru: "Пан Томаш, однако, не огорчался,"
      - pl: " ponieważ panien nie brakło."
        ru: "поскольку барышень хватало."
        note: "nie brakło — старая форма; сегодня nie brakowało; brakować + родительный: panien"
      - pl: " Ekwipował się powoli,"
        ru: "Он обзаводился всем не спеша,"
        note: "ekwipować się — устар. «снаряжаться, обзаводиться»"
      - pl: " coraz usilniej dbając o to,"
        ru: "всё усерднее заботясь о том,"
        note: "dbać o + винительный"
