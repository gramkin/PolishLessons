# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 32
chapterTitle: "Pieśń XXXII"
chapterTitleRu: "Песнь XXXII. Ледяное озеро"
level: B2
paragraphs:
  - clean: "(Krąg IX. Wieczne lody. 1. Kaina. Zdrajcy krewnych. 2. Antenora. Zdrajcy kraju rodzinnego.)"
    chunks:
      - pl: "(Krąg IX. Wieczne lody. 1. Kaina. Zdrajcy krewnych. 2. Antenora. Zdrajcy kraju rodzinnego.)"
        ru: "(Круг IX. Вечные льды. 1. Каина. Предатели родных. 2. Антенора. Предатели родины.)"
        note: "lody — льды; zdrajca — предатель"
    words: { "Krąg": krag, "Wieczne": wieczny, "Zdrajcy": zdrajca, "krewnych": krewny, "kraju": kraj, "rodzinnego": rodzinny }
  - clean: "Gdybym miał dzikie, tak chrapliwe rymy,\nCo by do ciemnej tej studni przystały,\nNa której stoją wszystkie inne skały,\nWydałbym pełniej całą treść mej myśli;\nLecz gdy tej władzy w sobie nie widzimy,\nWażę się podnieść głos nie bez bojaźni."
    verse: true
    chunks:
      - pl: "Gdybym miał dzikie, tak chrapliwe rymy,"
        ru: "Если бы у меня были дикие, столь хриплые рифмы,"
        note: "chrapliwy — хриплый"
      - pl: "\nCo by do ciemnej tej studni przystały,"
        ru: "что подошли бы к этому тёмному колодцу,"
      - pl: "\nNa której stoją wszystkie inne skały,"
        ru: "на котором стоят все прочие скалы,"
      - pl: "\nWydałbym pełniej całą treść mej myśli;"
        ru: "я выразил бы полнее всё содержание моей мысли;"
      - pl: "\nLecz gdy tej władzy w sobie nie widzimy,"
        ru: "но так как этой власти мы в себе не видим,"
      - pl: "\nWażę się podnieść głos nie bez bojaźni."
        ru: "я осмеливаюсь возвысить голос не без боязни."
        note: "ważyć się — осмеливаться"
    words: { "ciemnej": ciemny, "studni": studnia, "skały": skala, "władzy": wladza, "Ważę": wazyc, "podnieść": podniesc }
  - clean: "Nie jest to zamiar jak gra wyobraźni\nWylęgły w głowie, co dno świata kreśli,\nNie czyn języka, co ledwo szczebioce.\nMuzy, przyzywam ja wasze pomoce,\nDajcie mi skrzydła Amfijona lotu,\nAby nie niższy był wiersz od przedmiotu."
    verse: true
    chunks:
      - pl: "Nie jest to zamiar jak gra wyobraźni"
        ru: "Это не замысел, как игра воображения,"
      - pl: "\nWylęgły w głowie, co dno świata kreśli,"
        ru: "вылупившийся в голове, — описать дно мира,"
      - pl: "\nNie czyn języka, co ledwo szczebioce."
        ru: "не дело языка, что едва лепечет."
        note: "szczebiotać — лепетать"
      - pl: "\nMuzy, przyzywam ja wasze pomoce,"
        ru: "Музы, я призываю вашу помощь,"
      - pl: "\nDajcie mi skrzydła Amfijona lotu,"
        ru: "дайте мне крылья полёта Амфиона,"
        note: "Амфион, чья музыка воздвигла стены Фив"
      - pl: "\nAby nie niższy był wiersz od przedmiotu."
        ru: "чтобы стих был не ниже предмета."
    words: { "wyobraźni": wyobraznia, "czyn": czyn, "ledwo": ledwo, "skrzydła": skrzydlo, "wiersz": wiersz, "przedmiotu": przedmiot }
  - clean: "Mieszkańce miejsca, o przeklęte duchy!\nKtóre opisać słowami najtrudniej,\nCzemu was owcze nie kryją kożuchy\nW tym chłodnym świecie albo kozie puchy?\nGdyśmy już byli w zrębach ciemnej studni,\nDaleko niżej jak stopy olbrzyma,\nZrąb jej wysoki gdym mierzył oczyma,\n«Ostrożnie stąpaj!» ktoś rzekł tymi słowy,\n«Abyś omijał stopą nasze głowy»."
    verse: true
    chunks:
      - pl: "Mieszkańce miejsca, o przeklęte duchy!"
        ru: "Жители места, о проклятые духи!"
      - pl: "\nKtóre opisać słowami najtrudniej,"
        ru: "которое описать словами труднее всего,"
      - pl: "\nCzemu was owcze nie kryją kożuchy"
        ru: "почему вас не укрывают овечьи тулупы"
        note: "owczy — овечий; kożuch — тулуп"
      - pl: "\nW tym chłodnym świecie albo kozie puchy?"
        ru: "в этом холодном мире или козий пух?"
      - pl: "\nGdyśmy już byli w zrębach ciemnej studni,"
        ru: "Когда мы были уже в глубине тёмного колодца,"
      - pl: "\nDaleko niżej jak stopy olbrzyma,"
        ru: "гораздо ниже ног великана,"
      - pl: "\nZrąb jej wysoki gdym mierzył oczyma,"
        ru: "пока я мерил глазами его высокий край,"
      - pl: "\n«Ostrożnie stąpaj!» ktoś rzekł tymi słowy,"
        ru: "«Осторожно ступай! — кто-то сказал такими словами, —"
      - pl: "\n«Abyś omijał stopą nasze głowy»."
        ru: "чтобы ты обходил ногой наши головы»."
    words: { "najtrudniej": trudno, "chłodnym": chlodny, "niżej": nisko, "olbrzyma": olbrzym, "mierzył": mierzyc, "rzekł": rzec }
  - clean: "Spojrzałem za się, zdziwion nie po mału,\nZmarzłe jezioro leżało pode mną,\nLśniące jak szyba ogromna kryształu.\nNigdy tak grubym lodem się nie ścina\nNiemiecki Dunaj lub północna Dźwina;\nGdyby Tabernik albo Pietrapiana\nSpadły przypadkiem w tę otchłań podziemną,\nSzyba tych lodów stałaby jak ściana."
    verse: true
    chunks:
      - pl: "Spojrzałem za się, zdziwion nie po mału,"
        ru: "Я оглянулся, немало удивлённый,"
        note: "zdziwion — краткая форма; nie po mału — немало"
      - pl: "\nZmarzłe jezioro leżało pode mną,"
        ru: "подо мной лежало замёрзшее озеро,"
      - pl: "\nLśniące jak szyba ogromna kryształu."
        ru: "блестящее, как огромная пластина хрусталя."
        note: "szyba — стекло, пластина"
      - pl: "\nNigdy tak grubym lodem się nie ścina"
        ru: "Никогда таким толстым льдом не сковывается"
        note: "ścinać się lodem — покрываться льдом"
      - pl: "\nNiemiecki Dunaj lub północna Dźwina;"
        ru: "немецкий Дунай или северная Двина;"
        note: "у Данте — Танаис, то есть Дон"
      - pl: "\nGdyby Tabernik albo Pietrapiana"
        ru: "если бы Таберник или Пьетрапана"
      - pl: "\nSpadły przypadkiem w tę otchłań podziemną,"
        ru: "упали случайно в эту подземную бездну,"
      - pl: "\nSzyba tych lodów stałaby jak ściana."
        ru: "пластина этих льдов стояла бы, как стена."
    words: { "jezioro": jezioro, "szyba": szyba, "kryształu": krysztal, "Niemiecki": niemiecki, "północna": polnocny, "podziemną": podziemny }
  - clean: "Jak żaby skrzecząc wystają znad wody\nW porze, gdy myśli żniwiarka o żniwie,\nTak cienie blade, skarżące płaczliwie,\nW lód pogrążone sterczały nad lody\nPół twarzą, gdzie wstyd czerwieni jagody.\nZ dzikim hałasem jak klekot bociani\nBrzmiał zgrzyt ich zębów po całej otchłani;\nSkrzepłe ich usta wzrok ponuro toczy,\nSmutek ich serca zdradzały ich oczy."
    verse: true
    chunks:
      - pl: "Jak żaby skrzecząc wystają znad wody"
        ru: "Как лягушки, квакая, высовываются из воды"
        note: "skrzeczeć — квакать"
      - pl: "\nW porze, gdy myśli żniwiarka o żniwie,"
        ru: "в пору, когда жница думает о жатве,"
        note: "żniwiarka — жница"
      - pl: "\nTak cienie blade, skarżące płaczliwie,"
        ru: "так бледные тени, жалобно сетующие,"
      - pl: "\nW lód pogrążone sterczały nad lody"
        ru: "погружённые в лёд, торчали надо льдом"
      - pl: "\nPół twarzą, gdzie wstyd czerwieni jagody."
        ru: "по пол-лица, где стыд краснит щёки."
      - pl: "\nZ dzikim hałasem jak klekot bociani"
        ru: "С диким шумом, как стук аиста,"
        note: "klekot bociani — щёлканье клюва аиста"
      - pl: "\nBrzmiał zgrzyt ich zębów po całej otchłani;"
        ru: "звучал скрежет их зубов по всей бездне;"
        note: "zgrzyt — скрежет"
      - pl: "\nSkrzepłe ich usta wzrok ponuro toczy,"
        ru: "окоченевшие уста их мрачно водят взглядом,"
        note: "skrzepły — окоченевший"
      - pl: "\nSmutek ich serca zdradzały ich oczy."
        ru: "печаль их сердца выдавали их глаза."
    words: { "żaby": zaba, "blade": blady, "zgrzyt": zgrzyt, "toczy": toczyc, "Smutek": smutek, "zdradzały": zdradzac }
  - clean: "Gdy spojrzę na dół, pod mymi stopami\nDwa cienie z sobą zwarły się piersiami,\nAż czub ich włosów przytykał do czuba.\n«Kto wy jesteście?» krzyknąłem. Wtem cienie\nUkośne ku mnie zwróciły spojrzenie,\nŁzy, co w ich oczach przed chwilą pływały,\nSpadły na rzęsy i chłodem stężały."
    verse: true
    chunks:
      - pl: "Gdy spojrzę na dół, pod mymi stopami"
        ru: "Когда взгляну вниз, под моими ногами"
      - pl: "\nDwa cienie z sobą zwarły się piersiami,"
        ru: "две тени сцепились друг с другом грудью,"
      - pl: "\nAż czub ich włosów przytykał do czuba."
        ru: "так что чуб их волос прикасался к чубу."
      - pl: "\n«Kto wy jesteście?» krzyknąłem. Wtem cienie"
        ru: "«Кто вы?» — крикнул я. Тут тени"
      - pl: "\nUkośne ku mnie zwróciły spojrzenie,"
        ru: "обратили на меня косой взгляд,"
      - pl: "\nŁzy, co w ich oczach przed chwilą pływały,"
        ru: "слёзы, что в их глазах только что плавали,"
      - pl: "\nSpadły na rzęsy i chłodem stężały."
        ru: "упали на ресницы и застыли от холода."
        note: "rzęsy — ресницы; stężeć — затвердеть"
    words: { "spojrzę": spojrzec, "piersiami": piers, "zwróciły": zwrocic, "chwilą": chwila, "pływały": plywac, "Spadły": spasc }
  - clean: "Silniej nie ściska deskę z deską śruba,\nJak potępieńcy zwarli czoła swoje;\nJak dwa rogami bodące się byki,\nTak gniew ich obu był wielki i dziki.\nCień, co od mrozu stracił uszu dwoje,\nSchylając głowę rzekł do mnie łaskawie:\n«Dlaczego na nas patrzysz tak ciekawie?"
    verse: true
    chunks:
      - pl: "Silniej nie ściska deskę z deską śruba,"
        ru: "Сильнее не сжимает доску с доской винт,"
        note: "deska — доска"
      - pl: "\nJak potępieńcy zwarli czoła swoje;"
        ru: "чем осуждённые сжали свои лбы;"
      - pl: "\nJak dwa rogami bodące się byki,"
        ru: "как два быка, бодающиеся рогами,"
      - pl: "\nTak gniew ich obu był wielki i dziki."
        ru: "так гнев их обоих был велик и дик."
      - pl: "\nCień, co od mrozu stracił uszu dwoje,"
        ru: "Тень, что от мороза потеряла оба уха,"
      - pl: "\nSchylając głowę rzekł do mnie łaskawie:"
        ru: "склонив голову, сказала мне любезно:"
      - pl: "\n«Dlaczego na nas patrzysz tak ciekawie?"
        ru: "«Почему ты смотришь на нас так любопытно?"
    words: { "deskę": deska, "czoła": czolo, "byki": byk, "gniew": gniew, "mrozu": mroz, "ciekawie": ciekawie }
  - clean: "Chcesz wiedzieć, ci dwaj jakiego są rodu?\nGdzie zdrój Bisencjo wypływa, dolina,\nWłasność Albertich, ojczyzną ich była,\nTaż sama, jedna matka ich rodziła.\nNie znajdziesz w całym tym kręgu Kaina\nGodniejszych siedzieć w bryłach tego lodu:\nNawet ten, którym wzdryga się natura,\nNa wylot włócznią przebity Artura,\nAni Kancelieri, ani Maskeroni."
    verse: true
    chunks:
      - pl: "Chcesz wiedzieć, ci dwaj jakiego są rodu?"
        ru: "Хочешь знать, какого рода эти двое?"
      - pl: "\nGdzie zdrój Bisencjo wypływa, dolina,"
        ru: "Где течёт источник Бизенцио, долина,"
      - pl: "\nWłasność Albertich, ojczyzną ich była,"
        ru: "владение Альберти, была их отчизной,"
        note: "własność — владение"
      - pl: "\nTaż sama, jedna matka ich rodziła."
        ru: "одна и та же мать их родила."
      - pl: "\nNie znajdziesz w całym tym kręgu Kaina"
        ru: "Не найдёшь во всём этом круге Каины"
      - pl: "\nGodniejszych siedzieć w bryłach tego lodu:"
        ru: "более достойных сидеть в глыбах этого льда:"
      - pl: "\nNawet ten, którym wzdryga się natura,"
        ru: "даже тот, от кого содрогается природа,"
        note: "wzdrygać się — содрогаться"
      - pl: "\nNa wylot włócznią przebity Artura,"
        ru: "пронзённый насквозь копьём Артура,"
        note: "Мордред; na wylot — насквозь"
      - pl: "\nAni Kancelieri, ani Maskeroni."
        ru: "ни Канчельери, ни Маскерони."
        note: "Фокачча Канчельери, Сассоль Маскерони"
    words: { "rodu": rod-2, "dolina": dolina, "Własność": wlasnosc, "ojczyzną": ojczyzna, "Godniejszych": godny, "przebity": przebic }
  - clean: "Jeśliś Toskańczyk, musisz znać, kto oni.\nO jeśli głos mój uszu twych nie kazi,\nWiedz, że ja jestem Kamerione z Pazzi,\nŻe oczekuję tu jeszcze Karlina!»\nWidziałem potem z tysiąc innych twarzy,\nNa pół skostniałych, zsiniałych od chłodu\nMyśl jeszcze z dreszczem o tych lodach marzy!"
    verse: true
    chunks:
      - pl: "Jeśliś Toskańczyk, musisz znać, kto oni."
        ru: "Если ты тосканец, ты должен знать, кто они."
      - pl: "\nO jeśli głos mój uszu twych nie kazi,"
        ru: "О, если мой голос не оскверняет твоих ушей,"
        note: "kazić — осквернять, портить"
      - pl: "\nWiedz, że ja jestem Kamerione z Pazzi,"
        ru: "знай, что я Камиччоне де Пацци,"
      - pl: "\nŻe oczekuję tu jeszcze Karlina!»"
        ru: "что жду здесь ещё Карлино!»"
        note: "его вина затмит мою"
      - pl: "\nWidziałem potem z tysiąc innych twarzy,"
        ru: "Я видел потом тысячу других лиц,"
      - pl: "\nNa pół skostniałych, zsiniałych od chłodu"
        ru: "полуокоченевших, посиневших от холода,"
        note: "skostniały — окоченевший; zsiniały — посиневший"
      - pl: "\nMyśl jeszcze z dreszczem o tych lodach marzy!"
        ru: "мысль ещё с дрожью грезит об этих льдах!"
    words: { "głos": glos, "uszu": ucho, "oczekuję": oczekiwac, "tysiąc": tysiac, "twarzy": twarz, "marzy": marzyc }
  - clean: "Gdy ku środkowi szukamy przechodu,\nGdzie każda ciężkość cięży swoim ciałem,\nW tym wiecznym zmroku z przerażenia drżałem.\nNie wiem, przypadkiem czy wyższym zrządzeniem\nŚród głów sterczących stawiąc stopy z trwogą,\nJednemu na twarz nastąpiłem nogą."
    verse: true
    chunks:
      - pl: "Gdy ku środkowi szukamy przechodu,"
        ru: "Когда мы ищем прохода к середине,"
      - pl: "\nGdzie każda ciężkość cięży swoim ciałem,"
        ru: "где всякая тяжесть тяготеет своим телом,"
        note: "то есть к центру земли"
      - pl: "\nW tym wiecznym zmroku z przerażenia drżałem."
        ru: "в этом вечном мраке я дрожал от ужаса."
      - pl: "\nNie wiem, przypadkiem czy wyższym zrządzeniem"
        ru: "Не знаю, случайно или по высшему изволению,"
        note: "zrządzenie — изволение, промысел"
      - pl: "\nŚród głów sterczących stawiąc stopy z trwogą,"
        ru: "среди торчащих голов ставя ноги со страхом,"
      - pl: "\nJednemu na twarz nastąpiłem nogą."
        ru: "одному я наступил ногой на лицо."
    words: { "zmroku": zmrok, "przerażenia": przerazic, "przypadkiem": przypadek, "stawiąc": stawic, "nastąpiłem": nastapic, "nogą": noga }
  - clean: "«Za co mnie depczesz?» rzekł duch z bólu blady,\n«Czy mścisz się na mnie Montaperto zdrady?»\n«Czekaj mnie, mistrzu,» mówiłem z wzruszeniem;\n«Chcę mą wątpliwość objaśnić z tym cieniem,\nPotem, jak zechcesz, jam śpieszyć gotowy».\nWódz stanął, a jam wyzwał do rozmowy\nDucha, co bluźnił, nie szczędząc klątw długich:\n«Powiedz, kto jesteś, ty, co fukasz drugich?»"
    verse: true
    chunks:
      - pl: "«Za co mnie depczesz?» rzekł duch z bólu blady,"
        ru: "«За что ты меня топчешь? — сказал дух, бледный от боли, —"
      - pl: "\n«Czy mścisz się na mnie Montaperto zdrady?»"
        ru: "неужто мстишь мне за измену при Монтаперти?»"
      - pl: "\n«Czekaj mnie, mistrzu,» mówiłem z wzruszeniem;"
        ru: "«Подожди меня, учитель, — сказал я в волнении, —"
      - pl: "\n«Chcę mą wątpliwość objaśnić z tym cieniem,"
        ru: "хочу прояснить своё сомнение с этой тенью,"
      - pl: "\nPotem, jak zechcesz, jam śpieszyć gotowy»."
        ru: "потом, как пожелаешь, я готов спешить»."
      - pl: "\nWódz stanął, a jam wyzwał do rozmowy"
        ru: "Вождь остановился, а я вызвал на разговор"
      - pl: "\nDucha, co bluźnił, nie szczędząc klątw długich:"
        ru: "духа, что богохульствовал, не скупясь на долгие проклятия:"
      - pl: "\n«Powiedz, kto jesteś, ty, co fukasz drugich?»"
        ru: "«Скажи, кто ты, ты, что фыркаешь на других?»"
        note: "fukać — фыркать, огрызаться"
    words: { "zdrady": zdrada, "śpieszyć": spieszyc, "Wódz": wodz, "wyzwał": wyzwac, "szczędząc": szczedzic, "klątw": klatwa }
  - clean: "— «Ty sam kto jesteś? Za co w Antenorze\nIdąc, twe stopy drugich twarze depcą?\nZa co naciskasz krokiem tak bolącym,\nZa ciężkim, nawet gdybyś był żyjącym?»\n— «Ja żyję,» rzekłem, «miło ci być może,\nGdy kochasz sławę lub wspomnienie skromne,\nWśród wielu imion twe imię przypomnę»."
    verse: true
    chunks:
      - pl: "— «Ty sam kto jesteś? Za co w Antenorze"
        ru: "— «А ты сам кто? За что, в Антеноре"
