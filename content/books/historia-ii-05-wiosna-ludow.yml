  - clean: "Mimo represji Królestwo Polskie rozwijało się gospodarczo. W latach pięćdziesiątych rosła liczba fabryk, zwłaszcza w Łodzi i w Warszawie, a obok przemysłu włókienniczego rozwijały się hutnictwo i przemysł maszynowy. Budowano nowe linie kolejowe, a Warszawa otrzymała oświetlenie gazowe i wodociągi. Ogromną rolę odgrywali bankierzy i przedsiębiorcy, często pochodzenia żydowskiego albo niemieckiego, jak Leopold Kronenberg, który finansował koleje, cukrownie i banki. Kronenberg uważał się za Polaka i wspierał polską kulturę, a jego postać pokazuje, że polskość stawała się coraz bardziej sprawą wyboru, a nie tylko pochodzenia. W tym samym czasie w Warszawie dorastało nowe pokolenie młodzieży, które nie pamiętało klęski z 1831 roku i nie bało się już rosyjskiej władzy. Studenci, rzemieślnicy i młodzi urzędnicy zbierali się w tajnych kółkach, czytali zakazane książki i marzyli o czynie. To oni mieli wkrótce wyjść na ulice Warszawy."
    draft: true
    chunks:
