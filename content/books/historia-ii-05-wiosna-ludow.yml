  - clean: "Dwa lata później cała Europa stanęła w płomieniach. W lutym 1848 roku rewolucja w Paryżu obaliła króla i proklamowała republikę. W marcu wybuchły rewolucje w Wiedniu i w Berlinie, a kanclerz Metternich, symbol starego porządku, musiał uciekać z Austrii. Powstali Węgrzy, Włosi, Czesi, Niemcy i wiele innych narodów. Ten wielki zryw nazwano Wiosną Ludów. Polacy przyjęli wiadomości z Paryża i Wiednia z ogromną nadzieją. Wierzyli, że nadszedł czas, kiedy wolne narody Europy pomogą im odzyskać niepodległość. Z więzienia w Berlinie wypuszczono Mierosławskiego i innych spiskowców, a berlińczycy nieśli ich na rękach przez ulice miasta."
    draft: true
    chunks:
      - pl: "Dwa lata później cała Europa stanęła w płomieniach."
        ru: "Два года спустя вся Европа была охвачена пламенем."
        note: "stanąć w płomieniach — охватиться пламенем"
      - pl: " W lutym 1848 roku rewolucja w Paryżu obaliła króla i proklamowała republikę."
        ru: "В феврале 1848 года революция в Париже свергла короля и провозгласила республику."
        note: "proklamować — провозгласить"
      - pl: " W marcu wybuchły rewolucje w Wiedniu i w Berlinie, a kanclerz Metternich, symbol starego porządku, musiał uciekać z Austrii."
        ru: "В марте вспыхнули революции в Вене и Берлине, а канцлер Меттерних, символ старого порядка, был вынужден бежать из Австрии."
      - pl: " Powstali Węgrzy, Włosi, Czesi, Niemcy i wiele innych narodów."
        ru: "Восстали венгры, итальянцы, чехи, немцы и многие другие народы."
      - pl: " Ten wielki zryw nazwano Wiosną Ludów."
        ru: "Этот великий порыв назвали «Весной народов»."
      - pl: " Polacy przyjęli wiadomości z Paryża i Wiednia z ogromną nadzieją."
        ru: "Поляки встретили вести из Парижа и Вены с огромной надеждой."
      - pl: " Wierzyli, że nadszedł czas, kiedy wolne narody Europy pomogą im odzyskać niepodległość."
