  - clean: "Tysiące uczestników spisków i powstań odbywały w tym czasie karę na Syberii. Zesłańcy pracowali w kopalniach i na budowach, mieszkali w nędznych barakach i często umierali z wyczerpania. Droga na Syberię trwała często wiele miesięcy, a skazańcy szli pieszo, skuci łańcuchami, przez tysiące kilometrów. Ci, którzy przeżyli, pisali wspomnienia, badali przyrodę i ludy Syberii i uczyli dzieci miejscowych urzędników. Wielu polskich zesłańców zostało cenionymi badaczami Syberii, a niektóre jeziora i góry noszą do dziś ich nazwiska. W latach pięćdziesiątych w więzieniu w Omsku przebywał razem z polskimi zesłańcami młody pisarz rosyjski Fiodor Dostojewski. Opisał ich później w „Zapiskach z martwego domu”, a jeden z Polaków, Szymon Tokarzewski, zostawił własne wspomnienia z tego samego więzienia, w których opisał Dostojewskiego. Obaj patrzyli na siebie z mieszaniną szacunku i nieufności, co dobrze pokazuje skomplikowane stosunki między obu narodami."
