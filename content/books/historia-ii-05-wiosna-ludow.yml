chapter: 5
chapterTitle: "Wiosna Ludów"
chapterTitleRu: "Весна народов"
level: B2
paragraphs:
  - clean: "W połowie lat czterdziestych XIX wieku emigracyjni demokraci uznali, że nadszedł czas na nowe powstanie, które obejmie wszystkie trzy zabory naraz. Tym razem miało być prawdziwie ludowe: powstańcy zamierzali od razu znieść pańszczyznę i dać chłopom ziemię. Naczelnym wodzem miał być Ludwik Mierosławski, młody i bardzo pewny siebie teoretyk wojskowy. Plan został jednak zdradzony. W lutym 1846 roku policja pruska aresztowała Mierosławskiego i wielu spiskowców w Poznańskiem, a w Królestwie powstanie nie wybuchło."
    draft: true
    chunks:
      - pl: "W połowie lat czterdziestych XIX wieku emigracyjni demokraci uznali, że nadszedł czas na nowe powstanie, które obejmie wszystkie trzy zabory naraz."
        ru: "В середине сороковых годов XIX века эмигрантские демократы решили, что пришло время для нового восстания, которое охватит все три части разом."
      - pl: " Tym razem miało być prawdziwie ludowe: powstańcy zamierzali od razu znieść pańszczyznę i dać chłopom ziemię."
        ru: "На этот раз оно должно было стать по-настоящему народным: повстанцы собирались сразу отменить барщину и дать крестьянам землю."
      - pl: " Naczelnym wodzem miał być Ludwik Mierosławski, młody i bardzo pewny siebie teoretyk wojskowy."
        ru: "Главнокомандующим должен был стать Людвик Мерославский, молодой и очень самоуверенный военный теоретик."
        note: "pewny siebie — самоуверенный"
      - pl: " Plan został jednak zdradzony."
        ru: "Однако план был выдан."
      - pl: " W lutym 1846 roku policja pruska aresztowała Mierosławskiego i wielu spiskowców w Poznańskiem, a w Królestwie powstanie nie wybuchło."
        ru: "В феврале 1846 года прусская полиция арестовала Мерославского и многих заговорщиков в Познанском крае, а в Королевстве восстание не вспыхнуло."
    words: { "obejmie": objac, "chłopom": chlop, "wodzem": wodz, "wojskowy": wojskowy, "lutym": luty, "wybuchło": wybuchnac }
  - clean: "Wybuchło tylko w Krakowie. 22 lutego 1846 roku ogłoszono tam powstanie i utworzono Rząd Narodowy, który wydał manifest wzywający wszystkich Polaków do walki. Manifest zapowiadał zniesienie wszelkich przywilejów i pańszczyzny i obiecywał chłopom ziemię na własność. Najbardziej radykalnym przywódcą powstania był młody filozof Edward Dembowski, syn kasztelana, którego nazywano czerwonym kasztelanicem. Dembowski chodził po wsiach w przebraniu, rozmawiał z chłopami i przekonywał ich, że wolna Polska będzie także ich Polską. 27 lutego poprowadził pod Krakowem procesję z krzyżem i chorągwiami kościelnymi, żeby przekonać chłopów do powstania. Na procesję uderzyli żołnierze austriaccy, a Dembowski zginął od kuli. Miał dwadzieścia czwarty rok życia. Kilka dni później wojska austriackie wkroczyły do Krakowa i powstanie upadło."
    draft: true
    chunks:
      - pl: "Wybuchło tylko w Krakowie."
        ru: "Оно вспыхнуло только в Кракове."
      - pl: " 22 lutego 1846 roku ogłoszono tam powstanie i utworzono Rząd Narodowy, który wydał manifest wzywający wszystkich Polaków do walki."
        ru: "22 февраля 1846 года там объявили восстание и создали Национальное правительство, которое издало манифест, призывавший всех поляков к борьбе."
      - pl: " Manifest zapowiadał zniesienie wszelkich przywilejów i pańszczyzny i obiecywał chłopom ziemię na własność."
        ru: "Манифест провозглашал отмену всех привилегий и барщины и обещал крестьянам землю в собственность."
      - pl: " Najbardziej radykalnym przywódcą powstania był młody filozof Edward Dembowski, syn kasztelana, którego nazywano czerwonym kasztelanicem."
        ru: "Самым радикальным вождём восстания был молодой философ Эдвард Дембовский, сын каштеляна, которого называли красным каштелянчиком."
        note: "kasztelan — каштелян (сановник)"
      - pl: " Dembowski chodził po wsiach w przebraniu, rozmawiał z chłopami i przekonywał ich, że wolna Polska będzie także ich Polską."
        ru: "Дембовский ходил по деревням переодетым, разговаривал с крестьянами и убеждал их, что свободная Польша будет и их Польшей."
      - pl: " 27 lutego poprowadził pod Krakowem procesję z krzyżem i chorągwiami kościelnymi, żeby przekonać chłopów do powstania."
        ru: "27 февраля он повёл под Краковом процессию с крестом и церковными хоругвями, чтобы склонить крестьян к восстанию."
      - pl: " Na procesję uderzyli żołnierze austriaccy, a Dembowski zginął od kuli."
        ru: "На процессию напали австрийские солдаты, и Дембовский погиб от пули."
      - pl: " Miał dwadzieścia czwarty rok życia."
        ru: "Ему шёл двадцать четвёртый год."
      - pl: " Kilka dni później wojska austriackie wkroczyły do Krakowa i powstanie upadło."
        ru: "Через несколько дней австрийские войска вступили в Краков, и восстание пало."
    words: { "chłopom": chlop, "lutego": luty, "ogłoszono": oglosic, "wzywający": wzywac, "przywilejów": przywilej, "własność": wlasnosc, "przywódcą": przywodca, "wsiach": wies, "chłopami": chlop, "poprowadził": poprowadzic, "krzyżem": krzyz, "chłopów": chlop, "dwadzieścia": dwadziescia, "czwarty": czwarty, "wojska": wojsko, "wkroczyły": wkroczyc, "upadło": upasc }
  - clean: "W tym samym czasie w Galicji wydarzyła się tragedia, która na zawsze zapisała się w polskiej pamięci. Kiedy szlachta z okolic Tarnowa zaczęła zbierać się, by przyłączyć się do powstania, przeciwko niej wystąpili chłopi. Uzbrojeni w cepy, kosy i siekiery, napadali na dwory, mordowali właścicieli, rządców i ich rodziny, a dwory grabili i palili. W ciągu kilku dni zginęło od tysiąca do dwóch tysięcy ludzi, a kilkaset dworów zostało zniszczonych. Wydarzenia te nazwano rzezią galicyjską albo rabacją. Najkrwawsze wydarzenia rozegrały się w okolicach Tarnowa, Bochni, Jasła i Sanoka, w zachodniej części Galicji. Najsłynniejszym przywódcą chłopów był Jakub Szela, gospodarz ze wsi Smarżowa, który od lat procesował się ze swoim dziedzicem."
    draft: true
    chunks:
      - pl: "W tym samym czasie w Galicji wydarzyła się tragedia, która na zawsze zapisała się w polskiej pamięci."
        ru: "В то же время в Галиции произошла трагедия, навсегда оставшаяся в польской памяти."
      - pl: " Kiedy szlachta z okolic Tarnowa zaczęła zbierać się, by przyłączyć się do powstania, przeciwko niej wystąpili chłopi."
        ru: "Когда шляхта из окрестностей Тарнова начала собираться, чтобы присоединиться к восстанию, против неё выступили крестьяне."
      - pl: " Uzbrojeni w cepy, kosy i siekiery, napadali na dwory, mordowali właścicieli, rządców i ich rodziny, a dwory grabili i palili."
        ru: "Вооружённые цепами, косами и топорами, они нападали на усадьбы, убивали владельцев, управляющих и их семьи, а усадьбы грабили и жгли."
        note: "cep — цеп; rządca — управляющий"
      - pl: " W ciągu kilku dni zginęło od tysiąca do dwóch tysięcy ludzi, a kilkaset dworów zostało zniszczonych."
        ru: "За несколько дней погибли от тысячи до двух тысяч человек, а несколько сотен усадеб были разорены."
      - pl: " Wydarzenia te nazwano rzezią galicyjską albo rabacją."
        ru: "Эти события назвали Галицийской резнёй, или рабацией."
        note: "rabacja — рабация, крестьянский погром"
      - pl: " Najkrwawsze wydarzenia rozegrały się w okolicach Tarnowa, Bochni, Jasła i Sanoka, w zachodniej części Galicji."
        ru: "Самые кровавые события разыгрались в окрестностях Тарнова, Бохни, Ясла и Санока, в западной части Галиции."
      - pl: " Najsłynniejszym przywódcą chłopów był Jakub Szela, gospodarz ze wsi Smarżowa, który od lat procesował się ze swoim dziedzicem."
        ru: "Самым известным вожаком крестьян был Якуб Шеля, хозяин из деревни Смаржова, который годами судился со своим помещиком."
    words: { "przywódcą": przywodca, "chłopów": chlop, "tragedia": tragedia, "zapisała": zapisac, "polskiej": polski, "przyłączyć": przylaczyc, "wystąpili": wystapic, "chłopi": chlop, "Uzbrojeni": uzbroic, "dwory": dwor, "dworów": dwor, "Najkrwawsze": krwawy, "rozegrały": rozegrac, "zachodniej": zachodni, "Najsłynniejszym": slynny, "gospodarz": gospodarz, "wsi": wies, "dziedzicem": dziedzic }
  - clean: "Dlaczego chłopi wystąpili przeciwko panom, którzy obiecywali im wolność? Przede wszystkim dlatego, że im nie wierzyli. Pańszczyzna w Galicji była bardzo ciężka, a dla chłopa pan był wrogiem, który każe go bić i zabiera mu owoce pracy. Polska kojarzyła mu się z władzą szlachty, a cesarz w Wiedniu wydawał się dobrym ojcem, który chroni go przed panami. Do tego doszła polityka austriackich urzędników, którzy umiejętnie podsycali nienawiść chłopów do szlachty. Według wielu relacji starosta tarnowski płacił chłopom za przywożonych do miasta powstańców, żywych albo martwych. Austria wykorzystała konflikt społeczny, żeby zdusić konflikt narodowy."
    draft: true
    chunks:
      - pl: "Dlaczego chłopi wystąpili przeciwko panom, którzy obiecywali im wolność?"
        ru: "Почему крестьяне выступили против панов, обещавших им свободу?"
      - pl: " Przede wszystkim dlatego, że im nie wierzyli."
        ru: "Прежде всего потому, что им не верили."
      - pl: " Pańszczyzna w Galicji była bardzo ciężka, a dla chłopa pan był wrogiem, który każe go bić i zabiera mu owoce pracy."
        ru: "Барщина в Галиции была очень тяжёлой, и для крестьянина пан был врагом, который велит его бить и отнимает плоды его труда."
      - pl: " Polska kojarzyła mu się z władzą szlachty, a cesarz w Wiedniu wydawał się dobrym ojcem, który chroni go przed panami."
        ru: "Польша ассоциировалась у него с властью шляхты, а император в Вене казался добрым отцом, защищающим его от панов."
      - pl: " Do tego doszła polityka austriackich urzędników, którzy umiejętnie podsycali nienawiść chłopów do szlachty."
        ru: "К этому добавилась политика австрийских чиновников, которые умело разжигали ненависть крестьян к шляхте."
        note: "podsycać — разжигать"
      - pl: " Według wielu relacji starosta tarnowski płacił chłopom za przywożonych do miasta powstańców, żywych albo martwych."
        ru: "По многим свидетельствам, тарновский староста платил крестьянам за привезённых в город повстанцев, живых или мёртвых."
      - pl: " Austria wykorzystała konflikt społeczny, żeby zdusić konflikt narodowy."
        ru: "Австрия использовала социальный конфликт, чтобы подавить национальный."
        note: "zdusić — задушить, подавить"
    words: { "chłopom": chlop, "chłopów": chlop, "wystąpili": wystapic, "chłopi": chlop, "chłopa": chlop, "owoce": owoc, "kojarzyła": kojarzyc, "cesarz": cesarz, "urzędników": urzednik, "nienawiść": nienawisc, "relacji": relacja, "konflikt": konflikt, "społeczny": spoleczny, "narodowy": narodowy }
  - clean: "Rzeź galicyjska była szokiem dla polskich patriotów. Pokazała, że naród polski w rozumieniu szlachty i naród w rozumieniu chłopa to dwie zupełnie różne rzeczy. Przez dziesięciolecia w Galicji pamiętano o niej z lękiem po obu stronach. Ponad pięćdziesiąt lat później, w słynnym dramacie Stanisława Wyspiańskiego „Wesele”, na wiejskim weselu pojawia się upiór Szeli z krwawymi plamami na koszuli, przypominając, że stare rany wciąż się nie zagoiły. Sam Szela otrzymał od Austriaków ziemię na Bukowinie, z dala od miejsc, gdzie mieszkały rodziny jego ofiar."
    draft: true
    chunks:
      - pl: "Rzeź galicyjska była szokiem dla polskich patriotów."
        ru: "Галицийская резня стала шоком для польских патриотов."
      - pl: " Pokazała, że naród polski w rozumieniu szlachty i naród w rozumieniu chłopa to dwie zupełnie różne rzeczy."
        ru: "Она показала, что польский народ в понимании шляхты и народ в понимании крестьянина — две совершенно разные вещи."
      - pl: " Przez dziesięciolecia w Galicji pamiętano o niej z lękiem po obu stronach."
        ru: "Десятилетиями в Галиции помнили о ней со страхом с обеих сторон."
      - pl: " Ponad pięćdziesiąt lat później, w słynnym dramacie Stanisława Wyspiańskiego „Wesele”, na wiejskim weselu pojawia się upiór Szeli z krwawymi plamami na koszuli, przypominając, że stare rany wciąż się nie zagoiły."
        ru: "Более пятидесяти лет спустя в знаменитой драме Станислава Выспяньского «Свадьба» на деревенской свадьбе появляется призрак Шели с кровавыми пятнами на рубахе, напоминая, что старые раны всё ещё не зажили."
        note: "upiór — призрак; plama — пятно; zagoić się — зажить"
      - pl: " Sam Szela otrzymał od Austriaków ziemię na Bukowinie, z dala od miejsc, gdzie mieszkały rodziny jego ofiar."
        ru: "Сам Шеля получил от австрийцев землю на Буковине, вдали от мест, где жили семьи его жертв."
