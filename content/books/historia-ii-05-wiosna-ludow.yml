  - clean: "Powstanie krakowskie dało mocarstwom pretekst do zlikwidowania ostatniego skrawka wolnej Polski. W listopadzie 1846 roku Rosja, Prusy i Austria postanowiły, że Wolne Miasto Kraków zostanie przyłączone do Austrii. Rzeczpospolita Krakowska, która istniała ponad trzydzieści lat, przestała istnieć. W Europie przyjęto tę decyzję z oburzeniem, bo łamała postanowienia kongresu wiedeńskiego, ale nikt nie zrobił nic, by ją zmienić. Kraków stał się zwykłym miastem prowincjonalnym monarchii habsburskiej, choć jako dawna stolica królów zachował swoje szczególne znaczenie dla Polaków."
    draft: true
    chunks:
      - pl: "Powstanie krakowskie dało mocarstwom pretekst do zlikwidowania ostatniego skrawka wolnej Polski."
        ru: "Краковское восстание дало державам предлог для ликвидации последнего клочка свободной Польши."
      - pl: " W listopadzie 1846 roku Rosja, Prusy i Austria postanowiły, że Wolne Miasto Kraków zostanie przyłączone do Austrii."
        ru: "В ноябре 1846 года Россия, Пруссия и Австрия решили, что Вольный город Краков будет присоединён к Австрии."
      - pl: " Rzeczpospolita Krakowska, która istniała ponad trzydzieści lat, przestała istnieć."
        ru: "Краковская республика, существовавшая больше тридцати лет, перестала существовать."
      - pl: " W Europie przyjęto tę decyzję z oburzeniem, bo łamała postanowienia kongresu wiedeńskiego, ale nikt nie zrobił nic, by ją zmienić."
        ru: "В Европе это решение встретили с возмущением, потому что оно нарушало постановления Венского конгресса, но никто ничего не сделал, чтобы его изменить."
        note: "postanowienie — постановление"
      - pl: " Kraków stał się zwykłym miastem prowincjonalnym monarchii habsburskiej, choć jako dawna stolica królów zachował swoje szczególne znaczenie dla Polaków."
        ru: "Краков стал обычным провинциальным городом габсбургской монархии, хотя как бывшая королевская столица сохранил своё особое значение для поляков."
