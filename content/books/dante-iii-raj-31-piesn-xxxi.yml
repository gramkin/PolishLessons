# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 31
chapterTitle: "Pieśń XXXI"
chapterTitleRu: "Песнь XXXI. Святой Бернард"
level: B2
paragraphs:
  - clean: "Ciąg dalszy. Beatrycze zniknęła i zajęła miejsce w róży niebiańskiej. Pożegnanie. Św. Bernard. Królowa niebios."
    chunks:
      - pl: "Ciąg dalszy. Beatrycze zniknęła i zajęła miejsce w róży niebiańskiej. Pożegnanie. Św. Bernard. Królowa niebios."
        ru: "Продолжение. Беатриче исчезла и заняла место в небесной розе. Прощание. Святой Бернард. Царица небес."
    words: { "Ciąg": ciag, "dalszy": daleki, "zniknęła": zniknac, "róży": roza, "Królowa": krolowa, "niebios": niebiosa }
  - clean: "Tak pod figurą cudnie białej róży\nPokazał mi się pierwszy zastęp święty,\nKtóry w triumfie został wniebowzięty\nPrzez krew, co wylał zań Baranek Boży.\nDrugi, co widzi, latając, i śpiewa\nChwałę, cześć Tego, który go zagrzewa\nMiłością swoją, a przez swą szczodrotę\nWzniósł tak wysoko! Jako pszczelna rzesza,\nCo biorąc miody po kwiatach się wiesza\nI wraca w ulach snuć wonną robotę,\nZapadał w różę strojną w piękne liście,\nTo stamtąd znowu zrywał się w tę stronę,\nGdzie jego miłość mieszka wiekuiście:"
    verse: true
    chunks:
      - pl: "Tak pod figurą cudnie białej róży"
        ru: "Так в образе дивно белой розы"
      - pl: "\nPokazał mi się pierwszy zastęp święty,"
        ru: "мне явилось первое святое воинство,"
        note: "zastęp — воинство; блаженные"
      - pl: "\nKtóry w triumfie został wniebowzięty"
        ru: "что в торжестве было взято на небо"
      - pl: "\nPrzez krew, co wylał zań Baranek Boży."
        ru: "через кровь, которую пролил за него Агнец Божий."
      - pl: "\nDrugi, co widzi, latając, i śpiewa"
        ru: "Второе, что, летая, видит и поёт"
        note: "ангелы"
      - pl: "\nChwałę, cześć Tego, który go zagrzewa"
        ru: "славу и честь Того, кто его согревает"
      - pl: "\nMiłością swoją, a przez swą szczodrotę"
        ru: "своей любовью и по своей щедрости"
        note: "szczodrota — щедрость"
      - pl: "\nWzniósł tak wysoko! Jako pszczelna rzesza,"
        ru: "вознёс так высоко! Как пчелиный рой,"
      - pl: "\nCo biorąc miody po kwiatach się wiesza"
        ru: "что, собирая мёд, виснет на цветах"
      - pl: "\nI wraca w ulach snuć wonną robotę,"
        ru: "и возвращается в ульи прясть благоуханную работу,"
      - pl: "\nZapadał w różę strojną w piękne liście,"
        ru: "то опускалось в розу, убранную прекрасными лепестками,"
      - pl: "\nTo stamtąd znowu zrywał się w tę stronę,"
        ru: "то оттуда снова взмывало в ту сторону,"
      - pl: "\nGdzie jego miłość mieszka wiekuiście:"
        ru: "где вечно живёт его любовь:"
    words: { "wylał": wylac, "Boży": bozy, "latając": latac, "Chwałę": chwala, "Wzniósł": wzniesc, "miody": miod }
  - clean: "Twarze ich płomień żywy, skrzydła złote,\nA reszta kształtów tak świeciła biało,\nŻe z nimi śniegi porównać za mało.\nDuchy zlatując w tej róży koronę,\nMiotały skrzydła i nabytym w górze\nWiały pokojem i ogniem na różę:\nJednak ta rzesza ciągle latająca\nW górę to na dół, od kwiatu do słońca,\nNie zakrywała patrzącemu oku\nOkolicznego blasku i widoku;"
    verse: true
    chunks:
      - pl: "Twarze ich płomień żywy, skrzydła złote,"
        ru: "их лица — живое пламя, крылья золотые,"
      - pl: "\nA reszta kształtów tak świeciła biało,"
        ru: "а прочие очертания светились так бело,"
      - pl: "\nŻe z nimi śniegi porównać za mało."
        ru: "что сравнить с ними снега — слишком мало."
      - pl: "\nDuchy zlatując w tej róży koronę,"
        ru: "Духи, слетая в венец этой розы,"
      - pl: "\nMiotały skrzydła i nabytym w górze"
        ru: "взмахивали крыльями и веяли на розу"
      - pl: "\nWiały pokojem i ogniem na różę:"
        ru: "миром и огнём, обретёнными наверху;"
      - pl: "\nJednak ta rzesza ciągle latająca"
        ru: "однако этот рой, непрестанно летающий"
      - pl: "\nW górę to na dół, od kwiatu do słońca,"
        ru: "то вверх, то вниз, от цветка к солнцу,"
      - pl: "\nNie zakrywała patrzącemu oku"
        ru: "не заслонял смотрящему глазу"
      - pl: "\nOkolicznego blasku i widoku;"
        ru: "окрестного блеска и вида;"
    words: { "płomień": plomien, "kształtów": ksztalt, "świeciła": swiecic, "porównać": porownac, "koronę": korona, "blasku": blask }
  - clean: "Bo światłość boska świat z końca do końca\nPrzenika w miarę, ile jej jest godnym,\nNiehamowana wypadkiem przygodnym.\nBłogie, bezpieczne to królestwo całe,\nStarym i nowym ludem zamieszkałe,\nWzrok swój i miłość w jeden punkt utkwiło."
    verse: true
    chunks:
      - pl: "Bo światłość boska świat z końca do końca"
        ru: "ибо божественный свет проникает мир из конца в конец"
      - pl: "\nPrzenika w miarę, ile jej jest godnym,"
        ru: "по мере того, насколько тот его достоин,"
      - pl: "\nNiehamowana wypadkiem przygodnym."
        ru: "не сдерживаемый случайной помехой."
        note: "przygodny — случайный"
      - pl: "\nBłogie, bezpieczne to królestwo całe,"
        ru: "Это блаженное, безопасное царство,"
      - pl: "\nStarym i nowym ludem zamieszkałe,"
        ru: "населённое ветхим и новым народом,"
      - pl: "\nWzrok swój i miłość w jeden punkt utkwiło."
        ru: "устремило свой взгляд и любовь в одну точку."
    words: { "boska": boski, "miarę": miara, "królestwo": krolestwo, "ludem": lud, "Wzrok": wzrok, "punkt": punkt }
  - clean: "Ty w jednej gwieździe, co świecisz zaiste\nNa rozkosz duchów, o światło troiste!\nJeśli im patrzeć na ciebie tak miło,\nSpojrzyj na ziemię, jaka burza nasza!\nJeśli przybyły z tej strony lud dziki,\nGdzie ciągle w krąg się Helice unasza,\nZ czułą jak matka miłością, tęsknotą,\nZa swoim synem, polarnym Beotą,\nPatrząc na Romę, jej wielkie pomniki,\nZdrętwiał, osłupiał dziwem niespodzianem,\nWtenczas gdy klękał świat przed Lateranem;"
    verse: true
    chunks:
      - pl: "Ty w jednej gwieździe, co świecisz zaiste"
        ru: "Ты, что в одной звезде светишь, воистину,"
      - pl: "\nNa rozkosz duchów, o światło troiste!"
        ru: "на радость духам, о тройственный свет!"
      - pl: "\nJeśli im patrzeć na ciebie tak miło,"
        ru: "Если им так мило смотреть на тебя,"
      - pl: "\nSpojrzyj na ziemię, jaka burza nasza!"
        ru: "взгляни на землю, какова наша буря!"
      - pl: "\nJeśli przybyły z tej strony lud dziki,"
        ru: "Если дикий народ, пришедший из той страны,"
      - pl: "\nGdzie ciągle w krąg się Helice unasza,"
        ru: "где непрестанно кружит Гелика,"
        note: "Большая Медведица; unaszać się — носиться"
      - pl: "\nZ czułą jak matka miłością, tęsknotą,"
        ru: "с нежной, как у матери, любовью и тоской"
      - pl: "\nZa swoim synem, polarnym Beotą,"
        ru: "за своим сыном, полярным Волопасом,"
        note: "Беотом"
      - pl: "\nPatrząc na Romę, jej wielkie pomniki,"
        ru: "глядя на Рим, на его великие памятники,"
      - pl: "\nZdrętwiał, osłupiał dziwem niespodzianem,"
        ru: "цепенел, остолбеневший от нежданного дива,"
      - pl: "\nWtenczas gdy klękał świat przed Lateranem;"
        ru: "в те времена, когда мир преклонялся перед Латераном;"
    words: { "gwieździe": gwiazda, "duchów": duch, "światło": swiatlo, "burza": burza, "krąg": krag, "pomniki": pomnik }
  - clean: "Ja, com przechodził bez tchu i popasu\nZ ziemskiego w boskie, do wieczności czasu,\nOd florentynów gwaru i hałasu\nDo rozumnego i cichego ludu,\nNie dziw, że wzruszon dziwem i zapałem\nNie chcąc nic słyszeć i mówić, milczałem."
    verse: true
    chunks:
      - pl: "Ja, com przechodził bez tchu i popasu"
        ru: "то я, что прошёл без передышки и привала"
        note: "popas — привал"
      - pl: "\nZ ziemskiego w boskie, do wieczności czasu,"
        ru: "от земного к божественному, от времени к вечности,"
      - pl: "\nOd florentynów gwaru i hałasu"
        ru: "от гомона и шума флорентийцев"
      - pl: "\nDo rozumnego i cichego ludu,"
        ru: "к разумному и тихому народу,"
      - pl: "\nNie dziw, że wzruszon dziwem i zapałem"
        ru: "не диво, что, потрясённый дивом и восторгом,"
      - pl: "\nNie chcąc nic słyszeć i mówić, milczałem."
        ru: "не желая ничего слышать и говорить, я молчал."
    words: { "przechodził": przechodzic, "tchu": dech, "ziemskiego": ziemski, "wieczności": wiecznosc, "hałasu": halas, "milczałem": milczec }
  - clean: "Pielgrzym, gdzie doznał łask niebieskich cudu,\nPilnie kościoła rozpatruje mury,\nBy zapamiętał, jakiej jest struktury,\nI opowiedział drugim z przypomnienia.\nPodobnie patrząc w to niebo wesoło,\nPrzeprowadzałem po nim me spojrzenia\nI najwyraźniej widziałem oblicza,\nZ jakich wybłyska miłość tajemnicza,\nA wszystkie światłem oświecone z góry\nI swym uśmiechem; kształt raju ogólny\nWzrok mój ogarnął, ale nie był zdolny\nW żadną część spojrzeć źrenicą utkwioną."
    verse: true
    chunks:
      - pl: "Pielgrzym, gdzie doznał łask niebieskich cudu,"
        ru: "Паломник там, где испытал чудо небесных милостей,"
      - pl: "\nPilnie kościoła rozpatruje mury,"
        ru: "прилежно рассматривает стены храма,"
      - pl: "\nBy zapamiętał, jakiej jest struktury,"
        ru: "чтобы запомнить, каково его устройство,"
      - pl: "\nI opowiedział drugim z przypomnienia."
        ru: "и рассказать другим по памяти."
      - pl: "\nPodobnie patrząc w to niebo wesoło,"
        ru: "Так же, весело глядя в это небо,"
      - pl: "\nPrzeprowadzałem po nim me spojrzenia"
        ru: "я водил по нему своими взглядами"
      - pl: "\nI najwyraźniej widziałem oblicza,"
        ru: "и отчётливо видел лица,"
      - pl: "\nZ jakich wybłyska miłość tajemnicza,"
        ru: "из которых сверкает таинственная любовь,"
      - pl: "\nA wszystkie światłem oświecone z góry"
        ru: "и все освещены светом свыше"
      - pl: "\nI swym uśmiechem; kształt raju ogólny"
        ru: "и своей улыбкой; общий облик рая"
      - pl: "\nWzrok mój ogarnął, ale nie był zdolny"
        ru: "мой взгляд охватил, но не был способен"
      - pl: "\nW żadną część spojrzeć źrenicą utkwioną."
        ru: "посмотреть пристальным зрачком ни на какую часть."
    words: { "doznał": doznac, "struktury": struktura, "Przeprowadzałem": przeprowadzac, "oblicza": oblicze, "ogólny": ogolny, "ogarnął": ogarnac }
  - clean: "Wtem się zwróciłem z żądzą odrodzoną\nDo mojej Pani, by w moim zwątpieniu\nNazwała rzeczy te po ich imieniu.\nI wtem, o dziwo! zamiast Beatrycy\nWidziałem starca kształt, wdzięk jego ruchów,\nNa podobieństwo był niebieskich duchów,\nŚwięte wesele pałało w źrenicy,\nTwarz mu powaga ze słodyczą stroi,\nJako czułemu ojcowi przystoi."
    verse: true
    chunks:
      - pl: "Wtem się zwróciłem z żądzą odrodzoną"
        ru: "Тогда я обернулся с возрождённым желанием"
      - pl: "\nDo mojej Pani, by w moim zwątpieniu"
        ru: "к моей Госпоже, чтобы в моём сомнении"
      - pl: "\nNazwała rzeczy te po ich imieniu."
        ru: "она назвала эти вещи по имени."
      - pl: "\nI wtem, o dziwo! zamiast Beatrycy"
        ru: "И тут, о диво! вместо Беатриче"
      - pl: "\nWidziałem starca kształt, wdzięk jego ruchów,"
        ru: "я увидел облик старца, прелесть его движений,"
      - pl: "\nNa podobieństwo był niebieskich duchów,"
        ru: "он был подобен небесным духам,"
      - pl: "\nŚwięte wesele pałało w źrenicy,"
        ru: "святое веселье пылало в зрачках,"
      - pl: "\nTwarz mu powaga ze słodyczą stroi,"
        ru: "лицо его украшает важность со сладостью,"
      - pl: "\nJako czułemu ojcowi przystoi."
        ru: "как подобает нежному отцу."
    words: { "zwróciłem": zwrocic, "starca": starzec, "podobieństwo": podobienstwo, "niebieskich": niebieski, "powaga": powaga, "słodyczą": slodycz }
  - clean: "«Mów, gdzie jest ona?» pytam niecierpliwy.\n«Z mego siedzenia» rzekł starzec sędziwy\n«Od Beatrycze przychodzę, jej goniec,\nAby twej żądzy wskazać kres i koniec.\nSpójrz, gdzie najwyżej kołuje krąg trzeci,\nTam ją zobaczysz, jak na tronie świeci,\nGdzie posadzona jest własną zasługą»."
    verse: true
    chunks:
      - pl: "«Mów, gdzie jest ona?» pytam niecierpliwy."
        ru: "«Скажи, где она?» — спрашиваю я нетерпеливо."
      - pl: "\n«Z mego siedzenia» rzekł starzec sędziwy"
        ru: "«С моего места, — сказал седой старец,"
        note: "sędziwy — седой, преклонных лет"
      - pl: "\n«Od Beatrycze przychodzę, jej goniec,"
        ru: "я прихожу от Беатриче, её гонец,"
      - pl: "\nAby twej żądzy wskazać kres i koniec."
        ru: "чтобы указать предел и конец твоему желанию."
      - pl: "\nSpójrz, gdzie najwyżej kołuje krąg trzeci,"
        ru: "Взгляни, где выше всех кружит третий круг,"
        note: "считая от высшего"
      - pl: "\nTam ją zobaczysz, jak na tronie świeci,"
        ru: "там ты увидишь её, как она светит на престоле,"
      - pl: "\nGdzie posadzona jest własną zasługą»."
        ru: "куда посажена собственной заслугой»."
    words: { "rzekł": rzec, "przychodzę": przychodzic, "wskazać": wskazac, "kres": kres, "tronie": tron, "zasługą": zasluga }
  - clean: "Podniosłem oczy, nie czekając długo,\nI zobaczyłem siedzącą na tronie,\nW odbijającej blask wieczny koronie.\nIm wyżej piorun grzmi wśród chmur przestworza,\nOdeń wzrok ludzki nie jest tak odległy\nW chwili, gdy tonie w głębokości morza,\nJak ją daleko oczy me postrzegły:\nMimo odległość, obraz Beatrycy\nJak promień słońca zszedł do mej źrenicy."
    verse: true
    chunks:
      - pl: "Podniosłem oczy, nie czekając długo,"
        ru: "Я поднял глаза, не ожидая долго,"
      - pl: "\nI zobaczyłem siedzącą na tronie,"
        ru: "и увидел её сидящей на престоле,"
      - pl: "\nW odbijającej blask wieczny koronie."
        ru: "в короне, отражающей вечный блеск."
      - pl: "\nIm wyżej piorun grzmi wśród chmur przestworza,"
        ru: "Как ни высоко гремит гром среди туч простора,"
      - pl: "\nOdeń wzrok ludzki nie jest tak odległy"
        ru: "от него человеческий взгляд не так удалён"
      - pl: "\nW chwili, gdy tonie w głębokości morza,"
        ru: "в миг, когда тонет в глубине моря,"
      - pl: "\nJak ją daleko oczy me postrzegły:"
        ru: "как далеко её увидели мои глаза;"
      - pl: "\nMimo odległość, obraz Beatrycy"
        ru: "несмотря на расстояние, образ Беатриче,"
      - pl: "\nJak promień słońca zszedł do mej źrenicy."
        ru: "как луч солнца, сошёл в мой зрачок."
    words: { "odbijającej": odbijac, "wieczny": wieczny, "piorun": piorun, "chmur": chmura, "odległy": odlegly, "promień": promien }
  - clean: "«O Pani! w której żyję przez nadzieję,\nTy, co przez łaskę, ażeby mnie zbawić,\nRaczyłaś w piekle swe ślady zostawić,\nJeśli widziałem tyle nowych rzeczy,\nWinienem twojej dobroci, twej pieczy;\nDuch mój przez ciebie, czuję, jak mężnieje."
    verse: true
    chunks:
      - pl: "«O Pani! w której żyję przez nadzieję,"
        ru: "«О Госпожа! в которой я живу надеждой,"
      - pl: "\nTy, co przez łaskę, ażeby mnie zbawić,"
        ru: "ты, что по милости, чтобы меня спасти,"
      - pl: "\nRaczyłaś w piekle swe ślady zostawić,"
        ru: "соизволила оставить свои следы в аду,"
        note: "в Лимбе, у Вергилия"
      - pl: "\nJeśli widziałem tyle nowych rzeczy,"
        ru: "если я видел столько новых вещей,"
      - pl: "\nWinienem twojej dobroci, twej pieczy;"
        ru: "этим я обязан твоей доброте, твоей заботе;"
        note: "piecza — попечение"
      - pl: "\nDuch mój przez ciebie, czuję, jak mężnieje."
        ru: "мой дух через тебя, я чувствую, мужает."
    words: { "nadzieję": nadzieja, "łaskę": laska-2, "piekle": pieklo, "ślady": slad, "zostawić": zostawic, "dobroci": dobroc }
  - clean: "Tyś mnie wywiodła na wolność z niewoli\nPrzez wszystkie środki twej mocy i woli,\nChciej szczodrobliwość twą zachować we mnie,\nBy uzdrowiony przez ciebie po ciemnie\nDuch mój nie zbłądził i tu miał mieszkanie,\nGdy chorym ciałem zasnę na skonanie»."
    verse: true
    chunks:
      - pl: "Tyś mnie wywiodła na wolność z niewoli"
        ru: "Ты вывела меня из неволи на свободу"
      - pl: "\nPrzez wszystkie środki twej mocy i woli,"
        ru: "всеми средствами своей силы и воли;"
      - pl: "\nChciej szczodrobliwość twą zachować we mnie,"
