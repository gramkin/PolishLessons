      - pl: "\nI w oczy wodza mojego spojrzałem."
        ru: "и посмотрел в глаза моему вождю."
      - pl: "\nWódz rzekł: «Mój synu, posłuchaj mej rady,"
        ru: "Вождь сказал: «Мой сын, послушай моего совета,"
      - pl: "\nWracajmy nazad, a idź w moje ślady,"
        ru: "вернёмся назад и иди по моим следам,"
      - pl: "\nBo tam, uważam, pochyłość tej błoni"
        ru: "ибо там, замечаю, склон этого поля"
      - pl: "\nAż do swych krańców wyraźnie się kłoni»."
        ru: "до самых своих краёв явно клонится»."
    words: { "zniknął": zniknac, "wstałem": wstac, "spojrzałem": spojrzec, "posłuchaj": posluchac, "ślady": slad, "wyraźnie": wyraznie }
  - clean: "Ranną godzinę już goniła zorza,\nZ dala widziałem blask i drżenie morza.\nPłaszczyzną pustą szliśmy nie bez trwogi,\nJako podróżny szukający drogi.\nWidziałem rosę walczącą ze słońcem,\nTa w cieniu góry skryta przed gorącem\nParą nie mogła wznieść się ponad błonie."
    verse: true
    chunks:
      - pl: "Ranną godzinę już goniła zorza,"
        ru: "Утренний час уже гнала заря,"
        note: "zorza — заря; ranny — утренний"
      - pl: "\nZ dala widziałem blask i drżenie morza."
        ru: "издали я видел блеск и дрожь моря."
      - pl: "\nPłaszczyzną pustą szliśmy nie bez trwogi,"
        ru: "По пустой равнине мы шли не без робости,"
      - pl: "\nJako podróżny szukający drogi."
        ru: "как путник, ищущий дороги."
      - pl: "\nWidziałem rosę walczącą ze słońcem,"
        ru: "Я видел росу, борющуюся с солнцем,"
        note: "rosa — роса"
      - pl: "\nTa w cieniu góry skryta przed gorącem"
        ru: "она, скрытая в тени горы от жара,"
      - pl: "\nParą nie mogła wznieść się ponad błonie."
        ru: "не могла подняться паром над полем."
    words: { "goniła": gonic, "morza": morze, "rosę": rosa, "walczącą": walczyc, "cieniu": cien, "wznieść": wzniesc }
  - clean: "Mistrz mój na trawach złożył obie dłonie,\nOdgadłem zamysł i łzą, co przecieka\nZ duszy skruszonej przez oczy człowieka,\nSpłukane lic mych daję mu jagody.\nW ten czas mistrz krytą pod piekła zasłoną\nUjrzał mej twarzy barwę przyrodzoną."
