# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 1
chapterTitle: "Pieśń I"
chapterTitleRu: "Песнь I. Катон"
level: B2
paragraphs:
  - clean: "(Wstęp. Katon. Przygotowania. Wejście.)"
    chunks:
      - pl: "(Wstęp. Katon. Przygotowania. Wejście.)"
        ru: "(Вступление. Катон. Приготовления. Вход.)"
        note: "przygotowanie — приготовление; wejście — вход"
    words: { "Wstęp": wstep }
  - clean: "Do żeglowania przez weselsze wody\nZwraca ster łódka mego genijusza,\nStraszne za sobą zostawiając brody.\nChcę śpiewać drugie królestwo, gdzie dusza\nCzyści się z grzechu przed swym wniebowzięciem.\nZmartwychwstań, pełna poezyjo życia!"
    verse: true
    chunks:
      - pl: "Do żeglowania przez weselsze wody"
        ru: "Для плавания по более весёлым водам"
        note: "żeglowanie — плавание"
      - pl: "\nZwraca ster łódka mego genijusza,"
        ru: "поворачивает руль лодка моего гения,"
        note: "ster — руль; genijusz — старое написание geniusz"
      - pl: "\nStraszne za sobą zostawiając brody."
        ru: "оставляя позади страшные воды."
        note: "brody — здесь «воды»"
      - pl: "\nChcę śpiewać drugie królestwo, gdzie dusza"
        ru: "Хочу воспеть второе царство, где душа"
      - pl: "\nCzyści się z grzechu przed swym wniebowzięciem."
        ru: "очищается от греха перед своим вознесением на небо."
        note: "wniebowzięcie — вознесение"
      - pl: "\nZmartwychwstań, pełna poezyjo życia!"
        ru: "Воскресни, полная жизни поэзия!"
        note: "zmartwychwstać — воскреснуть; poezyjo — зват. п., старое написание"
    words: { "żeglowania": zeglowac, "Zwraca": zwracac, "ster": ster, "łódka": lodka, "królestwo": krolestwo, "grzechu": grzech }
  - clean: "O święte Muzy! gorącym zaklęciem\nTu was przyzywam, ja, wasz od powicia!\nNiech Kalijope wtóruje mej pieśni,\nGłosem, co w rozpacz biedne wpędził sroki.\nJasne wschodniego szafiru obłoki,\nZlane z błękitem powietrznej przezroczy,\nAż do najpierwszej sfery sięgającej,\nOswobodzone z martwej piekieł cieśni,\nRozweseliły moją pierś i oczy."
    verse: true
    chunks:
      - pl: "O święte Muzy! gorącym zaklęciem"
        ru: "О святые Музы! горячим заклинанием"
      - pl: "\nTu was przyzywam, ja, wasz od powicia!"
        ru: "здесь я призываю вас, я, ваш от рождения!"
        note: "od powicia — от рождения"
      - pl: "\nNiech Kalijope wtóruje mej pieśni,"
        ru: "Пусть Каллиопа вторит моей песни"
        note: "wtórować — вторить"
      - pl: "\nGłosem, co w rozpacz biedne wpędził sroki."
        ru: "голосом, что вверг в отчаяние бедных сорок."
        note: "дочери Пиера, превращённые в сорок"
      - pl: "\nJasne wschodniego szafiru obłoki,"
        ru: "Ясные облака восточного сапфира,"
        note: "szafir — сапфир"
      - pl: "\nZlane z błękitem powietrznej przezroczy,"
        ru: "слитые с голубизной воздушной прозрачности,"
        note: "przezrocz — устар. «прозрачность»"
      - pl: "\nAż do najpierwszej sfery sięgającej,"
        ru: "достающие до самой первой сферы,"
        note: "najpierwszy — самый первый"
      - pl: "\nOswobodzone z martwej piekieł cieśni,"
        ru: "освобождённые из мёртвой теснины ада,"
        note: "oswobodzony — освобождённый"
      - pl: "\nRozweseliły moją pierś i oczy."
        ru: "развеселили мою грудь и глаза."
    words: { "zaklęciem": zaklecie, "pieśni": piesn, "rozpacz": rozpacz, "wschodniego": wschodni, "powietrznej": powietrzny, "sięgającej": siegac }
  - clean: "Już piękna gwiazda, co w nas miłość budzi,\nRyb w jej orszaku blask chłodno świecący\nGasi; wschód cały w jej uśmiechu płonie.\nKu drugiej osi gdy spojrzę na prawo,\nSamoczwart gwiazdy świeciły jaskrawo,\nJakie widziała pierwsza para ludzi."
    verse: true
    chunks:
      - pl: "Już piękna gwiazda, co w nas miłość budzi,"
        ru: "Уже прекрасная звезда, что будит в нас любовь,"
        note: "Венера"
      - pl: "\nRyb w jej orszaku blask chłodno świecący"
        ru: "блеск Рыб, холодно светящих в её свите,"
      - pl: "\nGasi; wschód cały w jej uśmiechu płonie."
        ru: "гасит; весь восток пылает в её улыбке."
      - pl: "\nKu drugiej osi gdy spojrzę na prawo,"
        ru: "Когда взгляну направо, к другой оси,"
        note: "ku drugiej osi — к южному полюсу"
      - pl: "\nSamoczwart gwiazdy świeciły jaskrawo,"
        ru: "вчетвером ярко светили звёзды,"
        note: "samoczwart — устар. «вчетвером»"
      - pl: "\nJakie widziała pierwsza para ludzi."
        ru: "какие видела первая пара людей."
        note: "Адам и Ева"
    words: { "budzi": budzic, "blask": blask, "świecący": swiecic, "wschód": wschod, "uśmiechu": usmiech, "płonie": plonac }
  - clean: "W ich blasku niebios rozedniało błonie:\nPrawdziwieś wdowi, o septentryjonie,\nBoś pozbawiony widoku gwiazd takich!\nGdym wzrok odrywał od tych gwiazd czworakich\nKu innej osi, gdzie wóz gwiazdy zniknął,\nPatrzę, aż przy mnie starzec jeden stoi."
    verse: true
    chunks:
      - pl: "W ich blasku niebios rozedniało błonie:"
        ru: "В их блеске рассвело поле небес:"
        note: "rozednieć — рассвести"
      - pl: "\nPrawdziwieś wdowi, o septentryjonie,"
        ru: "воистину ты вдов, о Север,"
        note: "septentryjon — Север (лат.)"
      - pl: "\nBoś pozbawiony widoku gwiazd takich!"
        ru: "ибо лишён вида таких звёзд!"
      - pl: "\nGdym wzrok odrywał od tych gwiazd czworakich"
        ru: "Когда я отрывал взгляд от этих четырёх звёзд"
      - pl: "\nKu innej osi, gdzie wóz gwiazdy zniknął,"
        ru: "к другой оси, где исчезли звёзды Воза,"
        note: "Большая Медведица"
      - pl: "\nPatrzę, aż przy mnie starzec jeden stoi."
        ru: "смотрю — возле меня стоит один старец."
    words: { "niebios": niebiosa, "pozbawiony": pozbawic, "widoku": widok, "gwiazd": gwiazda, "wzrok": wzrok, "starzec": starzec }
  - clean: "Powagą ruchów, sędziwością lica\nPoszanowaniem dziwnym mnie przeniknął;\nWięcej by nie mógł czuć syn dla rodzica.\nBroda mu długa, jak włos głowy biała\nDwoistą miotłą na piersi spadała,\nBlask, co od czterech świętych gwiazd się roi,\nTak mi oświecił jego postać całą,\nJakby już przed nim samo słońce stało."
    verse: true
    chunks:
      - pl: "Powagą ruchów, sędziwością lica"
        ru: "Важностью движений, сединой лица"
      - pl: "\nPoszanowaniem dziwnym mnie przeniknął;"
        ru: "он проник меня странным почтением;"
        note: "sędziwość — седина, старость"
      - pl: "\nWięcej by nie mógł czuć syn dla rodzica."
        ru: "больше не мог бы чувствовать сын к родителю."
      - pl: "\nBroda mu długa, jak włos głowy biała"
        ru: "Борода у него длинная, как волос головы, белая,"
      - pl: "\nDwoistą miotłą na piersi spadała,"
        ru: "двойной метлой спадала на грудь,"
      - pl: "\nBlask, co od czterech świętych gwiazd się roi,"
        ru: "блеск, что роится от четырёх святых звёзд,"
      - pl: "\nTak mi oświecił jego postać całą,"
        ru: "так осветил мне весь его облик,"
      - pl: "\nJakby już przed nim samo słońce stało."
        ru: "будто перед ним уже стояло само солнце."
    words: { "Powagą": powaga, "Broda": broda, "włos": wlos, "piersi": piers, "postać": postac, "słońce": slonce }
  - clean: "Starzec tak mówił, trzęsąc brodą białą:\n«Kto wy? i jak wy z wiecznego więzienia\nUszliście ślepym korytem strumienia?\nKto wam prostował, kto oświecał drogi?\nJakeście śmieli przez wieczne ciemnoty\nPrzestąpić piekieł zakazane progi?"
    verse: true
    chunks:
      - pl: "Starzec tak mówił, trzęsąc brodą białą:"
        ru: "Старец так говорил, тряся белой бородой:"
      - pl: "\n«Kto wy? i jak wy z wiecznego więzienia"
        ru: "«Кто вы? и как вы из вечной темницы"
      - pl: "\nUszliście ślepym korytem strumienia?"
        ru: "ушли слепым руслом ручья?"
      - pl: "\nKto wam prostował, kto oświecał drogi?"
        ru: "Кто вам выпрямлял, кто освещал дороги?"
      - pl: "\nJakeście śmieli przez wieczne ciemnoty"
        ru: "Как вы посмели сквозь вечную тьму"
      - pl: "\nPrzestąpić piekieł zakazane progi?"
        ru: "переступить запретные пороги ада?"
        note: "zakazany — запретный"
    words: { "trzęsąc": trzasc, "wiecznego": wieczny, "Uszliście": ujsc, "strumienia": strumien, "zakazane": zakazac, "progi": prog }
  - clean: "Czy już otchłani prawo jest złamanem,\nŻe potępieni wchodzicie w me groty?»\nWódz mi zalecał i gestem, i słowy,\nAbym go uczcił pochyleniem głowy,\nSpuszczonym wzrokiem i niższym kolanem.\nI mówił: «Ja tu nie jestem sam z siebie,\nNa prośbę pani mieszkającej w niebie\nStałem się jego przewodnikiem, sługą."
    verse: true
    chunks:
      - pl: "Czy już otchłani prawo jest złamanem,"
        ru: "Разве уже закон бездны нарушен,"
        note: "złamanem — ныне złamanym"
      - pl: "\nŻe potępieni wchodzicie w me groty?»"
        ru: "что вы, осуждённые, входите в мои гроты?»"
      - pl: "\nWódz mi zalecał i gestem, i słowy,"
        ru: "Вождь наставлял меня и жестом, и словами,"
      - pl: "\nAbym go uczcił pochyleniem głowy,"
        ru: "чтобы я почтил его наклоном головы,"
      - pl: "\nSpuszczonym wzrokiem i niższym kolanem."
        ru: "опущенным взглядом и преклонённым коленом."
      - pl: "\nI mówił: «Ja tu nie jestem sam z siebie,"
        ru: "И сказал: «Я здесь не сам по себе,"
      - pl: "\nNa prośbę pani mieszkającej w niebie"
        ru: "по просьбе госпожи, живущей на небе,"
      - pl: "\nStałem się jego przewodnikiem, sługą."
        ru: "я стал ему проводником, слугой."
    words: { "Wódz": wodz, "gestem": gest, "pochyleniem": pochylic, "Spuszczonym": spuscic, "przewodnikiem": przewodnik, "sługą": sluga }
  - clean: "Chcesz, jam twej woli posłuszny poddany.\nSkąd i jak idziem? mówić o tym długo.\nJeszcze nie dogasł jego dzień ostatni;\nLecz tak w swych błędów zawikłał się matni,\nŻe mu niewiele chwil życia zostało.\nJak wyżej rzekłem, byłem doń posłany,\nAby go zbawić; odtąd wciąż z nim chodzę:\nJuż potępionych widział tłuszczę całą,\nTeraz chcę jemu pokazać po drodze\nTych, co się czyszczą tu pod twoją strażą."
    verse: true
    chunks:
      - pl: "Chcesz, jam twej woli posłuszny poddany."
        ru: "Хочешь — я послушный подданный твоей воли."
        note: "poddany — подданный"
      - pl: "\nSkąd i jak idziem? mówić o tym długo."
        ru: "Откуда и как мы идём? Об этом говорить долго."
      - pl: "\nJeszcze nie dogasł jego dzień ostatni;"
        ru: "Его последний день ещё не догорел;"
        note: "dogasnąć — догореть"
      - pl: "\nLecz tak w swych błędów zawikłał się matni,"
        ru: "но он так запутался в сети своих заблуждений,"
        note: "zawikłać się — запутаться"
      - pl: "\nŻe mu niewiele chwil życia zostało."
        ru: "что ему оставалось немного мгновений жизни."
      - pl: "\nJak wyżej rzekłem, byłem doń posłany,"
        ru: "Как я сказал выше, я был к нему послан,"
      - pl: "\nAby go zbawić; odtąd wciąż z nim chodzę:"
        ru: "чтобы его спасти; с тех пор я всё хожу с ним:"
      - pl: "\nJuż potępionych widział tłuszczę całą,"
        ru: "он уже видел всю толпу осуждённых,"
      - pl: "\nTeraz chcę jemu pokazać po drodze"
        ru: "теперь я хочу показать ему по дороге"
      - pl: "\nTych, co się czyszczą tu pod twoją strażą."
        ru: "тех, кто очищается здесь под твоей стражей."
    words: { "rzekłem": rzec, "posłany": poslac, "odtąd": odtad, "wciąż": wciaz, "czyszczą": czyscic, "strażą": straz }
  - clean: "Jak tu on zaszedł, słowa nie wyrażą;\nMoc z góry wiodła nas przez to rozdroże,\nDość, że cię widzieć tu i słyszeć może.\nUłomna jego dusza, lecz szlachetna,\nSzuka wolności, która jak jest miła,\nTy wiesz, boć dla niej śmierć gorzką nie była."
    verse: true
    chunks:
      - pl: "Jak tu on zaszedł, słowa nie wyrażą;"
        ru: "Как он сюда зашёл, слова не выразят;"
      - pl: "\nMoc z góry wiodła nas przez to rozdroże,"
        ru: "сила свыше вела нас через это распутье,"
      - pl: "\nDość, że cię widzieć tu i słyszeć może."
        ru: "довольно того, что он может тебя здесь видеть и слышать."
      - pl: "\nUłomna jego dusza, lecz szlachetna,"
        ru: "Душа его несовершенна, но благородна,"
        note: "ułomny — несовершенный"
      - pl: "\nSzuka wolności, która jak jest miła,"
        ru: "ищет свободы, которая, как она мила,"
      - pl: "\nTy wiesz, boć dla niej śmierć gorzką nie była."
        ru: "ты знаешь, ибо ради неё смерть не была тебе горька."
        note: "boć = bo + -ć"
    words: { "zaszedł": zajsc, "wyrażą": wyrazic, "dusza": dusza, "szlachetna": szlachetny, "wolności": wolnosc, "gorzką": gorzki }
  - clean: "Świadczy Utyka twą oponą krwawą,\nKtóra w dzień wielki zabłyśnie tak świetna!\nNieodwołane dla nas wieczne prawo,\nOn żyw, mnie Minos w swe kręgi nie tłoczy,\nJa jestem z kręgu, gdzie lśnią skromne oczy\nTwej wiernej Marcji, której miłość cicha,\nO święte serce! wciąż do ciebie wzdycha."
    verse: true
    chunks:
      - pl: "Świadczy Utyka twą oponą krwawą,"
        ru: "Свидетельствует Утика твоим кровавым покровом,"
        note: "opona — покров, оболочка; тело Катона"
      - pl: "\nKtóra w dzień wielki zabłyśnie tak świetna!"
        ru: "что в великий день засияет так ярко!"
        note: "на Страшном суде"
      - pl: "\nNieodwołane dla nas wieczne prawo,"
        ru: "Вечный закон для нас не отменён,"
        note: "nieodwołany — неотменённый"
      - pl: "\nOn żyw, mnie Minos w swe kręgi nie tłoczy,"
        ru: "он жив, меня Минос не загоняет в свои круги,"
      - pl: "\nJa jestem z kręgu, gdzie lśnią skromne oczy"
        ru: "я из круга, где сияют скромные глаза"
      - pl: "\nTwej wiernej Marcji, której miłość cicha,"
        ru: "твоей верной Марции, чья тихая любовь,"
        note: "Марция, жена Катона, в Лимбе"
      - pl: "\nO święte serce! wciąż do ciebie wzdycha."
        ru: "о святое сердце! всё вздыхает о тебе."
    words: { "Świadczy": swiadczyc, "oponą": opona, "krwawą": krwawy, "kręgi": krag, "skromne": skromny, "wiernej": wierny }
  - clean: "O! przez jej miłość błagamy z pokorą,\nPozwól nam zwiedzić twych królestw siedmioro,\nZa co jej moje dziękczynienie zrobię,\nJeśli pozwolisz tam mówić o tobie».\nOn odpowiedział: „Tak oczyma memi\nMarcję kochałem, pókim był na ziemi,\nŻe wszystkie łaski, ledwo pomyślała,\nCo mieć pragnęła, już ode mnie miała."
    verse: true
    chunks:
      - pl: "O! przez jej miłość błagamy z pokorą,"
        ru: "О! её любовью молим со смирением,"
        note: "pokora — смирение"
      - pl: "\nPozwól nam zwiedzić twych królestw siedmioro,"
        ru: "позволь нам посетить семь твоих царств,"
        note: "siedmioro — семь (собир.)"
      - pl: "\nZa co jej moje dziękczynienie zrobię,"
        ru: "за что я передам ей свою благодарность,"
        note: "dziękczynienie — благодарение"
      - pl: "\nJeśli pozwolisz tam mówić o tobie»."
        ru: "если позволишь там говорить о тебе»."
      - pl: "\nOn odpowiedział: „Tak oczyma memi"
        ru: "Он ответил: „Так моими глазами"
      - pl: "\nMarcję kochałem, pókim był na ziemi,"
        ru: "я любил Марцию, пока был на земле,"
      - pl: "\nŻe wszystkie łaski, ledwo pomyślała,"
        ru: "что все милости, едва она подумала,"
      - pl: "\nCo mieć pragnęła, już ode mnie miała."
        ru: "чего желала иметь, уже имела от меня."
    words: { "miłość": milosc, "błagamy": blagac, "dziękczynienie": dziekczynienie, "odpowiedział": odpowiedziec, "ledwo": ledwo, "pragnęła": pragnac }
  - clean: "Teraz gdy mieszka za rzeką jej dusza,\nZa krańcem piekła, jej los mię nie wzrusza\nZ powodu, który jest prawem dla cieni,\nOdkąd wyszedłem z piekielnej przedsieni.\nJeśli szle ciebie Niebieska Królowa,\nPo co te słodkie i pochlebne słowa?"
    verse: true
    chunks:
      - pl: "Teraz gdy mieszka za rzeką jej dusza,"
        ru: "Теперь, когда её душа живёт за рекой,"
      - pl: "\nZa krańcem piekła, jej los mię nie wzrusza"
        ru: "за краем ада, её судьба меня не трогает"
      - pl: "\nZ powodu, który jest prawem dla cieni,"
        ru: "по причине, что есть закон для теней,"
      - pl: "\nOdkąd wyszedłem z piekielnej przedsieni."
        ru: "с тех пор как я вышел из адских сеней."
        note: "przedsień — сени"
      - pl: "\nJeśli szle ciebie Niebieska Królowa,"
        ru: "Если тебя шлёт Небесная Царица,"
      - pl: "\nPo co te słodkie i pochlebne słowa?"
        ru: "к чему эти сладкие и льстивые слова?"
