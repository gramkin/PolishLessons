  - clean: "Dość rzec jej rozkaz, a ja ci odpowiem.\nIdź więc i wiotkim opasz go sitowiem,\nBrud mu zmyj z twarzy, aby jak przystoi\nWszedł za aniołem do rajskich podwoi.\nJest mała wyspa, tam, tam, nieco w dali,\nO której brzegi wciąż bije prąd fali,\nGdzie tylko rośnie sitowie i trzcina,\nA grunt jej cały jest miękki i grząski."
    verse: true
    chunks:
      - pl: "Dość rzec jej rozkaz, a ja ci odpowiem."
        ru: "Довольно сказать её повеление, и я тебе отвечу."
      - pl: "\nIdź więc i wiotkim opasz go sitowiem,"
        ru: "Иди же и опояшь его гибким тростником,"
        note: "wiotki — гибкий; sitowie — тростник, камыш"
      - pl: "\nBrud mu zmyj z twarzy, aby jak przystoi"
        ru: "смой ему грязь с лица, чтобы, как подобает,"
      - pl: "\nWszedł za aniołem do rajskich podwoi."
        ru: "он вошёл за ангелом в райские врата."
        note: "podwoje — врата"
      - pl: "\nJest mała wyspa, tam, tam, nieco w dali,"
        ru: "Есть маленький остров, там, там, немного вдали,"
      - pl: "\nO której brzegi wciąż bije prąd fali,"
        ru: "о берега которого всё бьёт течение волны,"
      - pl: "\nGdzie tylko rośnie sitowie i trzcina,"
        ru: "где растут лишь тростник и камыш,"
        note: "trzcina — камыш"
      - pl: "\nA grunt jej cały jest miękki i grząski."
        ru: "а вся почва его мягкая и топкая."
    words: { "Brud": brud, "zmyj": zmyc, "brzegi": brzeg, "prąd": prad, "grunt": grunt, "miękki": miekki }
  - clean: "Bo jakaż z twardą łodygą roślina\nUbrana w kruche liście i gałązki,\nPrzed szturmem wodnym gnie się i odgina?\nNie powracajcie, radzę wam, tą stroną,\nW tej chwili oto, podnosząc się, słońce\nWskaże pod górę ścieżki mniej nużące,\nJej pochyłością łagodniej skłonioną»."
