  - clean: "Rzeczy, które przyniosłyby sławę człowiekowi mniej zdolnemu, w jego rękach wydawały się sztuczkami. Błędem jest robić rzeczy zbyt łatwo. Poważni ludzie, którzy traktowali go poważnie, nigdy nie byli do końca pewni jego zachowania; czuli jakoś, że powierzać mu swoją reputację ludzi rozważnych to jak urządzać pokój dziecinny porcelaną cienką jak skorupka jajka. Nie sądzę więc, by ktokolwiek z nas wiele mówił o podróżach w czasie między tamtym czwartkiem a następnym, choć dziwne możliwości takiej podróży bez wątpienia krążyły w głowach większości z nas: jej wiarygodność, a zarazem praktyczna niewiarygodność, osobliwe możliwości anachronizmu i zupełnego zamętu, które nasuwała."
    en: "Things that would have made the fame of a less clever man seemed tricks in his hands. It is a mistake to do things too easily. The serious people who took him seriously never felt quite sure of his deportment; they were somehow aware that trusting their reputations for judgment with him was like furnishing a nursery with eggshell china. So I don’t think any of us said very much about time travelling in the interval between that Thursday and the next, though its odd potentialities ran, no doubt, in most of our minds: its plausibility, that is, its practical incredibleness, the curious possibilities of anachronism and of utter confusion it suggested."
    draft: true
    chunks:
      - pl: "Rzeczy, które przyniosłyby sławę człowiekowi mniej zdolnemu, w jego rękach wydawały się sztuczkami."
