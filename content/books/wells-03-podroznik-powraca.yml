  - clean: "Psycholog był jedyną osobą, poza Doktorem i mną, która była na poprzednim obiedzie. Pozostali to Blank, wspomniany Redaktor, pewien dziennikarz i jeszcze ktoś — cichy, nieśmiały mężczyzna z brodą — którego nie znałem i który, o ile zdołałem zauważyć, przez cały wieczór nie otworzył ust. Przy stole snuto domysły co do nieobecności Podróżnika w Czasie, a ja na pół żartem podsunąłem podróż w czasie. Redaktor chciał, żeby mu to wyjaśniono, i Psycholog sam się zgłosił, by drętwo opowiedzieć o „pomysłowym paradoksie i sztuczce”, których byliśmy świadkami tydzień wcześniej."
    en: "The Psychologist was the only person besides the Doctor and myself who had attended the previous dinner. The other men were Blank, the Editor aforementioned, a certain journalist, and another—a quiet, shy man with a beard—whom I didn’t know, and who, as far as my observation went, never opened his mouth all the evening. There was some speculation at the dinner-table about the Time Traveller’s absence, and I suggested time travelling, in a half-jocular spirit. The Editor wanted that explained to him, and the Psychologist volunteered a wooden account of the “ingenious paradox and trick” we had witnessed that day week."
    draft: true
    chunks:
