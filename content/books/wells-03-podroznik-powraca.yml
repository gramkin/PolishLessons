paragraphs:
  - clean: "Sądzę, że wtedy żaden z nas nie wierzył całkiem w Wehikuł Czasu. Rzecz w tym, że Podróżnik w Czasie był jednym z tych ludzi, którzy są zbyt mądrzy, by im wierzyć: nigdy nie miało się wrażenia, że widzi się go ze wszystkich stron; zawsze podejrzewało się za jego jasną szczerością jakąś subtelną rezerwę, jakiś pomysł czyhający w zasadzce. Gdyby to Filby pokazał model i wyjaśnił sprawę słowami Podróżnika w Czasie, okazalibyśmy mu znacznie mniej sceptycyzmu. Dostrzeglibyśmy bowiem jego pobudki: Filby'ego zrozumiałby nawet rzeźnik. Ale w naturze Podróżnika w Czasie było więcej niż odrobina kaprysu, i nie ufaliśmy mu."
    en: "I think that at that time none of us quite believed in the Time Machine. The fact is, the Time Traveller was one of those men who are too clever to be believed: you never felt that you saw all round him; you always suspected some subtle reserve, some ingenuity in ambush, behind his lucid frankness. Had Filby shown the model and explained the matter in the Time Traveller’s words, we should have shown him far less scepticism. For we should have perceived his motives: a pork-butcher could understand Filby. But the Time Traveller had more than a touch of whim among his elements, and we distrusted him."
    draft: true
    chunks:
      - pl: "Sądzę, że wtedy żaden z nas nie wierzył całkiem w Wehikuł Czasu."
        ru: "Думаю, что тогда никто из нас по-настоящему не верил в Машину Времени."
      - pl: " Rzecz w tym, że Podróżnik w Czasie był jednym z tych ludzi, którzy są zbyt mądrzy, by im wierzyć:"
        ru: "Дело в том, что Путешественник во Времени был одним из тех людей, которые слишком умны, чтобы им верить:"
        note: "rzecz w tym — дело в том"
      - pl: " nigdy nie miało się wrażenia, że widzi się go ze wszystkich stron;"
        ru: "никогда не казалось, что видишь его со всех сторон;"
      - pl: " zawsze podejrzewało się za jego jasną szczerością jakąś subtelną rezerwę, jakiś pomysł czyhający w zasadzce."
        ru: "за его ясной откровенностью всегда подозревалась какая-то тонкая сдержанность, какая-то затаившаяся в засаде хитрость."
        note: "czyhać — подстерегать; zasadzka — засада"
      - pl: " Gdyby to Filby pokazał model i wyjaśnił sprawę słowami Podróżnika w Czasie, okazalibyśmy mu znacznie mniej sceptycyzmu."
        ru: "Если бы модель показал Филби и объяснил дело словами Путешественника во Времени, мы отнеслись бы к нему с гораздо меньшим скептицизмом."
      - pl: " Dostrzeglibyśmy bowiem jego pobudki: Filby'ego zrozumiałby nawet rzeźnik."
        ru: "Ведь мы разглядели бы его побуждения: Филби понял бы даже мясник."
        note: "pobudka — побуждение, мотив; rzeźnik — мясник"
      - pl: " Ale w naturze Podróżnika w Czasie było więcej niż odrobina kaprysu, i nie ufaliśmy mu."
        ru: "Но в натуре Путешественника во Времени было больше, чем капля причуды, и мы ему не доверяли."
        note: "kaprys — каприз, причуда"
