  - clean: "Co do mnie, szczególnie zajmowała mnie sztuczka z modelem. Pamiętam, że rozmawiałem o niej z Lekarzem, którego spotkałem w piątek w Towarzystwie Linneuszowskim. Powiedział, że widział coś podobnego w Tybindze, i kładł duży nacisk na zgaśnięcie świecy. Ale jak ta sztuczka została wykonana, nie umiał wyjaśnić."
    en: "For my own part, I was particularly preoccupied with the trick of the model. That I remember discussing with the Medical Man, whom I met on Friday at the Linnæan. He said he had seen a similar thing at Tübingen, and laid considerable stress on the blowing-out of the candle. But how the trick was done he could not explain."
    draft: true
    chunks:
