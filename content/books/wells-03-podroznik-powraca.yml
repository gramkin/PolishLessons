  - clean: "Był w środku swojego wykładu, gdy drzwi z korytarza otworzyły się powoli i bezszelestnie. Siedziałem twarzą do drzwi i zobaczyłem to pierwszy. — Hej! — powiedziałem. — Nareszcie! Drzwi otworzyły się szerzej i stanął przed nami Podróżnik w Czasie. Krzyknąłem ze zdziwienia. — Wielkie nieba! Człowieku, co się stało? — zawołał Lekarz, który zobaczył go drugi. I cały stół odwrócił się ku drzwiom."
    en: "He was in the midst of his exposition when the door from the corridor opened slowly and without noise. I was facing the door, and saw it first. “Hallo!” I said. “At last!” And the door opened wider, and the Time Traveller stood before us. I gave a cry of surprise. “Good heavens! man, what’s the matter?” cried the Medical Man, who saw him next. And the whole tableful turned towards the door."
    draft: true
