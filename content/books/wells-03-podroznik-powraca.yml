  - clean: "Był w zdumiewającym stanie. Marynarkę miał zakurzoną i brudną, rękawy umazane czymś zielonym; włosy w nieładzie i, jak mi się zdawało, bardziej siwe — czy to od kurzu i brudu, czy też dlatego, że naprawdę wyblakły. Twarz miał upiornie bladą; na brodzie brązową ranę — ranę na wpół zagojoną; wyraz twarzy wymizerowany i ściągnięty, jak po silnym cierpieniu. Przez chwilę zawahał się w progu, jak gdyby oślepiło go światło. Potem wszedł do pokoju. Kulał zupełnie tak, jak kuleją włóczędzy o obolałych stopach. Patrzyliśmy na niego w milczeniu, czekając, aż przemówi."
    en: "He was in an amazing plight. His coat was dusty and dirty, and smeared with green down the sleeves; his hair disordered, and as it seemed to me greyer—either with dust and dirt or because its colour had actually faded. His face was ghastly pale; his chin had a brown cut on it—a cut half-healed; his expression was haggard and drawn, as by intense suffering. For a moment he hesitated in the doorway, as if he had been dazzled by the light. Then he came into the room. He walked with just such a limp as I have seen in footsore tramps. We stared at him in silence, expecting him to speak."
    draft: true
    chunks:
      - pl: "Był w zdumiewającym stanie."
        ru: "Он был в поразительном состоянии."
      - pl: " Marynarkę miał zakurzoną i brudną, rękawy umazane czymś zielonym;"
