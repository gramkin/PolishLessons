  - clean: "W następny czwartek znów pojechałem do Richmond — chyba byłem jednym z najwierniejszych gości Podróżnika w Czasie — i przybywszy późno, zastałem w jego salonie już czterech czy pięciu zebranych mężczyzn. Lekarz stał przed kominkiem z kartką papieru w jednej ręce i zegarkiem w drugiej. Rozejrzałem się za Podróżnikiem w Czasie, a wtedy… — Jest już wpół do ósmej — powiedział Lekarz. — Chyba lepiej zjedzmy obiad?"
    en: "The next Thursday I went again to Richmond—I suppose I was one of the Time Traveller’s most constant guests—and, arriving late, found four or five men already assembled in his drawing-room. The Medical Man was standing before the fire with a sheet of paper in one hand and his watch in the other. I looked round for the Time Traveller, and—“It’s half-past seven now,” said the Medical Man. “I suppose we’d better have dinner?”"
    draft: true
    chunks:
