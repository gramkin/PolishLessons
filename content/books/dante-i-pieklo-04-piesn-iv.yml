  - clean: "Tak do ogniska szliśmy gronem całem.\nMówiąc o rzeczach niejednych z zapałem,\nO których milczeć tak pięknie w tej chwili,\nJak było pięknie mówić, gdzieśmy byli.\nStał świetny zamek z darniowym tarasem,\nMur siedmiorakim otoczył go pasem,\nStrumień okrążał falami bystremi,\nPrzeszliśmy po nim jak po twardej ziemi:\nI przez bram siedem, i z siedmiu mędrcami\nWszedłem na łąkę usłaną kwiatami."
    verse: true
    chunks:
      - pl: "Tak do ogniska szliśmy gronem całem."
        ru: "Так к огню мы шли всем кругом."
        note: "grono — круг, общество; całem — ныне całym"
      - pl: "\nMówiąc o rzeczach niejednych z zapałem,"
        ru: "Говоря с жаром о вещах разных,"
        note: "niejeden — не один, разный"
      - pl: "\nO których milczeć tak pięknie w tej chwili,"
        ru: "о которых так прекрасно молчать сейчас,"
      - pl: "\nJak było pięknie mówić, gdzieśmy byli."
        ru: "как было прекрасно говорить там, где мы были."
        note: "gdzieśmy = gdzie + -śmy (gdzie byliśmy)"
      - pl: "\nStał świetny zamek z darniowym tarasem,"
        ru: "Стоял блестящий замок с дерновой террасой,"
        note: "darniowy — дерновый"
      - pl: "\nMur siedmiorakim otoczył go pasem,"
        ru: "стена семикратным поясом окружила его,"
        note: "siedmioraki — семикратный"
      - pl: "\nStrumień okrążał falami bystremi,"
        ru: "ручей огибал его быстрыми волнами,"
        note: "okrążać — огибать; bystremi — ныне bystrymi"
      - pl: "\nPrzeszliśmy po nim jak po twardej ziemi:"
        ru: "мы прошли по нему, как по твёрдой земле:"
      - pl: "\nI przez bram siedem, i z siedmiu mędrcami"
        ru: "и через семь ворот, и с семью мудрецами"
        note: "bram — род. мн. от brama"
      - pl: "\nWszedłem na łąkę usłaną kwiatami."
