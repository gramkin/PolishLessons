# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 4
chapterTitle: "Pieśń IV"
chapterTitleRu: "Песнь IV. Лимб"
level: B2
paragraphs:
  - clean: "(Krąg I. Niechrzczeni. Bohaterowie, poeci, filozofowie pogańscy.)"
    chunks:
      - pl: "(Krąg I. Niechrzczeni. Bohaterowie, poeci, filozofowie pogańscy.)"
        ru: "(Круг I. Некрещёные. Языческие герои, поэты, философы.)"
        note: "krąg — круг; niechrzczony — некрещёный; pogański — языческий"
    words: { "Krąg": krag, "Bohaterowie": bohater, "poeci": poeta }
  - clean: "Huk tak potężny sen mi spłoszył z powiek,\nChwiałem się cały z wrażeniem niemiłem,\nJak nagle ze snu przebudzony człowiek.\nWstałem i we śnie wypoczętym okiem\nWodziłem wkoło, badając, gdzie byłem.\nByłem nad brzegiem otchłani boleści,\nZ której bez końca zgiełk zmieszanej treści\nHuczał jękami, westchnieniem głębokiem,\nJako huk grzmotów daleki i długi."
    verse: true
    chunks:
      - pl: "Huk tak potężny sen mi spłoszył z powiek,"
        ru: "Гул такой мощный спугнул сон с моих век,"
        note: "huk — гул, грохот; spłoszyć — спугнуть"
      - pl: "\nChwiałem się cały z wrażeniem niemiłem,"
        ru: "я весь шатался с неприятным чувством,"
        note: "chwiać się — шататься; niemiłem — старое окончание, ныне niemiłym"
      - pl: "\nJak nagle ze snu przebudzony człowiek."
        ru: "как внезапно пробуждённый ото сна человек."
        note: "przebudzony — пробуждённый"
      - pl: "\nWstałem i we śnie wypoczętym okiem"
        ru: "Я встал и отдохнувшим во сне глазом"
        note: "wypoczęty — отдохнувший"
      - pl: "\nWodziłem wkoło, badając, gdzie byłem."
        ru: "водил кругом, выясняя, где я."
        note: "wodzić okiem — водить глазами; badać — исследовать"
      - pl: "\nByłem nad brzegiem otchłani boleści,"
        ru: "Я был на краю бездны скорби,"
        note: "otchłań — бездна"
      - pl: "\nZ której bez końca zgiełk zmieszanej treści"
        ru: "из которой без конца гомон смешанного содержания"
        note: "zgiełk — гомон, шум"
      - pl: "\nHuczał jękami, westchnieniem głębokiem,"
        ru: "гудел стонами, глубоким вздохом,"
        note: "huczeć — гудеть; westchnienie — вздох"
      - pl: "\nJako huk grzmotów daleki i długi."
        ru: "как гул громов, далёкий и долгий."
        note: "grzmot — гром"
    words: { "potężny": potezny, "spłoszył": sploszyc, "Wodziłem": wodzic, "badając": badac, "brzegiem": brzeg, "zmieszanej": zmieszac }
  - clean: "Spojrzałem w otchłań: mglista i głęboka,\nStraszliwie ciemna jak ślepota oka.\n«Wstąpmy w świat ciemny», przewodnik mój blady\nRzekł do mnie: «Wstąpmy, ja pierwszy, ty drugi».\nA ja spostrzegłszy jego twarz zmienioną,\nMówiłem: «Mistrzu! Głowo do porady,\nPocieszycielu, ty, moja obrono,\nGdy ty się boisz, kto się iść odważy?»."
    verse: true
    chunks:
      - pl: "Spojrzałem w otchłań: mglista i głęboka,"
        ru: "Я заглянул в бездну: туманная и глубокая,"
        note: "mglisty — туманный"
      - pl: "\nStraszliwie ciemna jak ślepota oka."
        ru: "страшно тёмная, как слепота глаза."
        note: "ślepota — слепота"
      - pl: "\n«Wstąpmy w świat ciemny», przewodnik mój blady"
        ru: "«Вступим в тёмный мир», — мой бледный проводник"
      - pl: "\nRzekł do mnie: «Wstąpmy, ja pierwszy, ty drugi»."
        ru: "сказал мне: «Вступим, я первый, ты второй»."
      - pl: "\nA ja spostrzegłszy jego twarz zmienioną,"
        ru: "А я, заметив его изменившееся лицо,"
        note: "spostrzegłszy — «заметив»; zmieniony — изменившийся"
      - pl: "\nMówiłem: «Mistrzu! Głowo do porady,"
        ru: "говорил: «Учитель! Голова, дающая совет,"
        note: "porada — совет"
      - pl: "\nPocieszycielu, ty, moja obrono,"
        ru: "утешитель, ты, моя защита,"
        note: "pocieszyciel — утешитель; obrona — защита"
      - pl: "\nGdy ty się boisz, kto się iść odważy?»."
        ru: "когда ты боишься, кто осмелится идти?»"
        note: "odważyć się — осмелиться"
    words: { "Wstąpmy": wstapic, "przewodnik": przewodnik, "blady": blady, "Rzekł": rzec, "spostrzegłszy": spostrzec, "porady": porada }
  - clean: "A on: «Otchłani męczarnie i bole,\nJęk nieszczęśliwych, co tam jęczą w dole,\nLitością w mojej malują się twarzy,\nA którą w błędzie ty bierzesz za trwogę;\nIdźmy, bo mamy jeszcze długą drogę».\nI mnie wprowadził, a sam naprzód kroczył,\nW krąg pierwszy, który tę otchłań otoczył."
    verse: true
    chunks:
      - pl: "A on: «Otchłani męczarnie i bole,"
        ru: "А он: «Муки и боли бездны,"
        note: "męczarnia — мучение; bole — старое мн. от ból"
      - pl: "\nJęk nieszczęśliwych, co tam jęczą w dole,"
        ru: "стон несчастных, что стонут там внизу,"
        note: "jęczeć — стонать"
      - pl: "\nLitością w mojej malują się twarzy,"
        ru: "жалостью отражаются на моём лице,"
        note: "malować się — рисоваться, отражаться (о чувстве)"
      - pl: "\nA którą w błędzie ty bierzesz za trwogę;"
        ru: "а её ты по ошибке принимаешь за страх;"
        note: "brać za coś — принимать за что-л."
      - pl: "\nIdźmy, bo mamy jeszcze długą drogę»."
        ru: "идём, ибо у нас ещё долгий путь»."
        note: "idźmy — пойдём"
      - pl: "\nI mnie wprowadził, a sam naprzód kroczył,"
        ru: "И ввёл меня, а сам шагал впереди,"
        note: "naprzód — вперёд"
      - pl: "\nW krąg pierwszy, który tę otchłań otoczył."
        ru: "в первый круг, что опоясал эту бездну."
        note: "otoczyć — окружить"
    words: { "nieszczęśliwych": nieszczesliwy, "Litością": litosc, "malują": malowac, "wprowadził": wprowadzic, "naprzód": naprzod, "otoczył": otoczyc }
  - clean: "Tam, ilem słyszał, ile pomnieć mogę,\nNie były skargi, lecz tylko westchnienia,\nOd których wieczne powietrze wciąż drżało:\nBył to głos jakiś smutku bez cierpienia,\nGłos mnóstwa mężów i niewiast, i dzieci.\nMistrz dobry mówił: «Czemu mnie nie pytasz,\nCo są za duchy, które okiem witasz?"
    verse: true
    chunks:
      - pl: "Tam, ilem słyszał, ile pomnieć mogę,"
        ru: "Там, сколько я слышал, сколько помнить могу,"
        note: "ilem = ile + -m (ile słyszałem)"
      - pl: "\nNie były skargi, lecz tylko westchnienia,"
        ru: "были не жалобы, а лишь вздохи,"
        note: "skarga — жалоба"
      - pl: "\nOd których wieczne powietrze wciąż drżało:"
        ru: "от которых вечный воздух всё дрожал:"
      - pl: "\nBył to głos jakiś smutku bez cierpienia,"
        ru: "это был голос печали без страдания,"
        note: "cierpienie — страдание"
      - pl: "\nGłos mnóstwa mężów i niewiast, i dzieci."
        ru: "голос множества мужей, и жён, и детей."
        note: "mąż — здесь «муж, мужчина»; niewiasta — жена"
      - pl: "\nMistrz dobry mówił: «Czemu mnie nie pytasz,"
        ru: "Добрый учитель сказал: «Почему ты не спрашиваешь,"
      - pl: "\nCo są za duchy, które okiem witasz?"
        ru: "что это за духи, которых ты приветствуешь взглядом?"
        note: "witać — приветствовать"
    words: { "skargi": skarga, "wieczne": wieczny, "powietrze": powietrze, "smutku": smutek, "mnóstwa": mnostwo, "niewiast": niewiasta }
  - clean: "Chcę, żebyś wiedział, nim pójdziemy dalej.\nGrzech i występek tych duchów nie szpeci,\nAle na cnotach choć im nie zbywało,\nChrzest cnót nie święcił, ta brama twej wiary!\nA chociaż przyszli na ziemię przed chrzestem.\nOni, jak trzeba, Boga nie kochali."
    verse: true
    chunks:
      - pl: "Chcę, żebyś wiedział, nim pójdziemy dalej."
        ru: "Хочу, чтобы ты знал, прежде чем мы пойдём дальше."
        note: "nim — прежде чем"
      - pl: "\nGrzech i występek tych duchów nie szpeci,"
        ru: "Грех и порок этих духов не уродуют,"
        note: "występek — проступок, порок; szpecić — уродовать"
      - pl: "\nAle na cnotach choć im nie zbywało,"
        ru: "но хоть добродетелей им и не недоставало,"
        note: "zbywać na czymś — недоставать"
      - pl: "\nChrzest cnót nie święcił, ta brama twej wiary!"
        ru: "крещение, эти врата твоей веры, не освятило добродетелей!"
        note: "chrzest — крещение"
      - pl: "\nA chociaż przyszli na ziemię przed chrzestem."
        ru: "А хоть они пришли на землю до крещения,"
        note: "то есть до Христа"
      - pl: "\nOni, jak trzeba, Boga nie kochali."
        ru: "они не любили Бога, как подобает."
        note: "jak trzeba — как следует"
    words: { "Grzech": grzech, "duchów": duch, "brama": brama, "wiary": wiara, "ziemię": ziemia, "trzeba": trzeba }
  - clean: "Z liczby tych duchów oto ja sam jestem!\nZa to nieszczęście, nie za grzech, z kolei\nSpadła kaźń na nas, a treścią tej kary,\nŻe pożądamy wiecznie bez nadziei».\nSłysząc to, boleść uczułem tajemną,\nBom poznał wielu obecnych przede mną,\nCo byli ludźmi wznioślejszego rzędu,\nDziś w sieni piekieł jakby w zawieszeniu."
    verse: true
    chunks:
      - pl: "Z liczby tych duchów oto ja sam jestem!"
        ru: "Из числа этих духов вот я и сам!"
        note: "z liczby — из числа"
      - pl: "\nZa to nieszczęście, nie za grzech, z kolei"
        ru: "За это несчастье, не за грех, в свой черёд"
        note: "z kolei — в свою очередь"
      - pl: "\nSpadła kaźń na nas, a treścią tej kary,"
        ru: "пала на нас казнь, а суть этой кары —"
        note: "kaźń — казнь, кара; treść — суть"
      - pl: "\nŻe pożądamy wiecznie bez nadziei»."
        ru: "что мы вечно желаем без надежды»."
        note: "pożądać — желать, вожделеть"
      - pl: "\nSłysząc to, boleść uczułem tajemną,"
        ru: "Слыша это, я почувствовал тайную скорбь,"
        note: "uczuć — почувствовать"
      - pl: "\nBom poznał wielu obecnych przede mną,"
        ru: "ибо узнал многих, присутствующих передо мной,"
        note: "bom = bo + -m (bo poznałem); obecny — присутствующий"
      - pl: "\nCo byli ludźmi wznioślejszego rzędu,"
        ru: "что были людьми более высокого ранга,"
        note: "wznioślejszy — сравн. от wzniosły; rząd — ряд, разряд"
      - pl: "\nDziś w sieni piekieł jakby w zawieszeniu."
        ru: "а ныне в сенях ада словно в подвешенном состоянии."
        note: "sień — сени; w zawieszeniu — в подвешенном состоянии"
    words: { "liczby": liczba, "nieszczęście": nieszczescie, "Spadła": spasc, "wiecznie": wiecznie, "uczułem": uczuc, "piekieł": pieklo }
  - clean: "«Mów», zawołałem: «Mistrzu mój i panie!\nAbyś mnie w moim umocnił wierzeniu,\nKtóre zwycięża moc wszelkiego błędu:\nCzy nikt z tych duchów o własnej zasłudze\nLub za przyczyną przez zasługi cudze\nNie wstąpił kiedy w niebios pomieszkanie?»"
    verse: true
    chunks:
      - pl: "«Mów», zawołałem: «Mistrzu mój i panie!"
        ru: "«Скажи, — воскликнул я, — учитель мой и господин!"
      - pl: "\nAbyś mnie w moim umocnił wierzeniu,"
        ru: "Чтобы ты укрепил меня в моей вере,"
        note: "umocnić — укрепить; wierzenie — верование"
      - pl: "\nKtóre zwycięża moc wszelkiego błędu:"
        ru: "что побеждает силу всякого заблуждения:"
      - pl: "\nCzy nikt z tych duchów o własnej zasłudze"
        ru: "неужели никто из этих духов собственной заслугой"
        note: "o własnej zasłudze — собственной заслугой"
      - pl: "\nLub za przyczyną przez zasługi cudze"
        ru: "или по ходатайству, чужими заслугами,"
        note: "za przyczyną — по ходатайству"
      - pl: "\nNie wstąpił kiedy w niebios pomieszkanie?»"
        ru: "не вступил когда-либо в обитель небес?»"
        note: "kiedy — здесь «когда-нибудь»; pomieszkanie — жилище"
    words: { "zawołałem": zawolac, "wszelkiego": wszelki, "zasłudze": zasluga, "przyczyną": przyczyna, "cudze": cudzy, "niebios": niebiosa }
  - clean: "On, który pojął skrytą myśl tej mowy,\nTak odpowiedział: «Byłem tu gość nowy,\nKiedy widziałem, jak wszedł Pan nad pany,\nZnakiem zwycięstwa ukoronowany!\nOn stąd cień wyrwał naszego praojca\nI Abla, jego syna, i Noego,\nMojżesza, sługę zakonu bożego;\nAbraham, Dawid, Izrael, Rachela\nZ potomstwem swoim, w triumfie wesela\nWstąpili za nim do chwały ogrojca!"
    verse: true
    chunks:
      - pl: "On, który pojął skrytą myśl tej mowy,"
        ru: "Он, понявший скрытую мысль этой речи,"
        note: "pojąć — понять; skryty — скрытый"
      - pl: "\nTak odpowiedział: «Byłem tu gość nowy,"
        ru: "так ответил: «Я был здесь новым гостем,"
        note: "то есть недавно умершим"
      - pl: "\nKiedy widziałem, jak wszedł Pan nad pany,"
        ru: "когда увидел, как вошёл Господь над господами,"
        note: "pany — старое мн. от pan"
      - pl: "\nZnakiem zwycięstwa ukoronowany!"
        ru: "увенчанный знаком победы!"
        note: "ukoronowany — коронованный"
      - pl: "\nOn stąd cień wyrwał naszego praojca"
        ru: "Он вырвал отсюда тень нашего праотца"
        note: "praojciec — праотец (Адам)"
      - pl: "\nI Abla, jego syna, i Noego,"
        ru: "и Авеля, его сына, и Ноя,"
        note: "Abel, Noe — Авель, Ной"
      - pl: "\nMojżesza, sługę zakonu bożego;"
        ru: "Моисея, слугу Божьего закона;"
        note: "zakon — здесь «закон» (не «орден»)"
      - pl: "\nAbraham, Dawid, Izrael, Rachela"
        ru: "Авраам, Давид, Израиль, Рахиль"
      - pl: "\nZ potomstwem swoim, w triumfie wesela"
        ru: "со своим потомством, в торжестве радости"
        note: "potomstwo — потомство; wesele — здесь «радость», не «свадьба»"
      - pl: "\nWstąpili za nim do chwały ogrojca!"
        ru: "вознеслись за ним к славе Гефсимании!"
        note: "ogrojec — Гефсиманский сад; здесь — образ спасения Христова"
    words: { "zwycięstwa": zwyciestwo, "cień": cien, "wyrwał": wyrwac, "sługę": sluga, "bożego": bozy, "chwały": chwala }
  - clean: "Wiedz, że przed nimi w tę otchłań z wtrąconych\nZgoła dusz ludzkich nie było zbawionych».\nTak idąc, rzucał mi słowo po słowie,\nA szliśmy lasem, lasem duchów, mówię.\nJeszcze byliśmy przy otchłani blisko,\nGdy zmrok tłumiące ujrzałem ognisko,\nA idąc dalej, przy blasku płomienia\nSpostrzegłem duchy szlachetne z wejrzenia."
    verse: true
    chunks:
      - pl: "Wiedz, że przed nimi w tę otchłań z wtrąconych"
        ru: "Знай, что до них в эту бездну из низвергнутых"
        note: "wtrącony — низвергнутый"
      - pl: "\nZgoła dusz ludzkich nie było zbawionych»."
        ru: "вовсе ни одна душа человеческая не была спасена»."
        note: "zgoła — вовсе; zbawiony — спасённый"
      - pl: "\nTak idąc, rzucał mi słowo po słowie,"
        ru: "Так идя, он бросал мне слово за словом,"
      - pl: "\nA szliśmy lasem, lasem duchów, mówię."
        ru: "а мы шли лесом — лесом духов, говорю."
      - pl: "\nJeszcze byliśmy przy otchłani blisko,"
        ru: "Мы были ещё близко от бездны,"
      - pl: "\nGdy zmrok tłumiące ujrzałem ognisko,"
        ru: "когда я увидел огонь, гасящий мрак,"
        note: "zmrok — мрак, сумерки; tłumić — подавлять"
      - pl: "\nA idąc dalej, przy blasku płomienia"
        ru: "а идя дальше, при блеске пламени"
      - pl: "\nSpostrzegłem duchy szlachetne z wejrzenia."
        ru: "заметил духов благородных обликом."
        note: "wejrzenie — взгляд, облик"
    words: { "wtrąconych": wtracic, "zmrok": zmrok, "tłumiące": tlumic, "ognisko": ognisko, "blasku": blask, "szlachetne": szlachetny }
  - clean: "«O ty, wszech nauk i sztuki zaszczycie!\nMów, kto są oni i jaka to chwała\nOd drugich miejsce osobne im dała?»\nA on mi na to: «Gdzie ty pędzisz życie,\nTam o nich dobra sława pozostała;\nPrzez wzgląd na blask jej, jakim ich otacza,\nŁaska ich nieba od drugich odznacza»."
    verse: true
    chunks:
      - pl: "«O ty, wszech nauk i sztuki zaszczycie!"
        ru: "«О ты, честь всех наук и искусства!"
        note: "wszech nauk — всех наук"
      - pl: "\nMów, kto są oni i jaka to chwała"
        ru: "Скажи, кто они и какая это слава"
      - pl: "\nOd drugich miejsce osobne im dała?»"
        ru: "отвела им особое место от прочих?»"
        note: "osobny — отдельный"
      - pl: "\nA on mi na to: «Gdzie ty pędzisz życie,"
        ru: "А он мне на это: «Там, где ты проводишь жизнь,"
        note: "pędzić życie — вести жизнь"
      - pl: "\nTam o nich dobra sława pozostała;"
        ru: "там о них осталась добрая слава;"
      - pl: "\nPrzez wzgląd na blask jej, jakim ich otacza,"
