  - clean: "Ile od świtu do godziny trzeciej\nUpłynie czasu, nim sfera obleci\nJak żywe dziecko zawsze igrająca;\nSnadź tyle czasu zostało dla słońca\nUbiec nad czyśćcem kres dziennego toru:\nTu była północ, tam gwiazda wieczoru."
    verse: true
    chunks:
      - pl: "Ile od świtu do godziny trzeciej"
        ru: "Сколько от рассвета до третьего часа"
      - pl: "\nUpłynie czasu, nim sfera obleci"
        ru: "пройдёт времени, пока облетит сфера,"
      - pl: "\nJak żywe dziecko zawsze igrająca;"
        ru: "всегда играющая, как живое дитя;"
      - pl: "\nSnadź tyle czasu zostało dla słońca"
        ru: "видно, столько времени оставалось солнцу,"
      - pl: "\nUbiec nad czyśćcem kres dziennego toru:"
        ru: "чтобы пробежать над Чистилищем предел дневного пути:"
        note: "ubiec — пробежать"
      - pl: "\nTu była północ, tam gwiazda wieczoru."
        ru: "здесь была полночь, там — вечерняя звезда."
        note: "то есть здесь вечер, в Италии полночь"
    words: { "świtu": swit, "słońca": slonce, "kres": kres, "dziennego": dzienny, "toru": tor, "północ": polnoc }
  - clean: "Promienie na nas w samą twarz padały,\nBośmy obeszli krąg góry obwodu,\nKierując nasze kroki do zachodu.\nGdym poczuł, jak mi upaliła czoło\nŚwiatłość daleko większa jak słoneczna,\nNa tę rzecz nową zdumiałem się cały,\nZ trwogi oczyma zataczając wkoło."
    verse: true
    chunks:
      - pl: "Promienie na nas w samą twarz padały,"
        ru: "Лучи падали нам прямо в лицо,"
      - pl: "\nBośmy obeszli krąg góry obwodu,"
        ru: "ибо мы обошли круг окружности горы,"
      - pl: "\nKierując nasze kroki do zachodu."
        ru: "направляя свои шаги к западу."
      - pl: "\nGdym poczuł, jak mi upaliła czoło"
        ru: "Когда я почувствовал, как мне опалил лоб"
      - pl: "\nŚwiatłość daleko większa jak słoneczna,"
        ru: "свет, намного больший, чем солнечный,"
      - pl: "\nNa tę rzecz nową zdumiałem się cały,"
        ru: "от этой новой вещи я весь изумился,"
      - pl: "\nZ trwogi oczyma zataczając wkoło."
        ru: "от страха поводя глазами вокруг."
    words: { "Promienie": promien, "padały": padac, "obeszli": obejsc, "obwodu": obwod, "czoło": czolo, "słoneczna": sloneczny }
  - clean: "Wzwyż nad powieki wzniosłem obie ręce,\nRobiąc dla oczu zasłonę naprędce,\nKędy się jasność łamała zbyteczna.\nJak w przeciwległe wznosi się przestrzenie\nPromień odbity w wodzie lub zwierciadle,\nPod jednym kątem wznosząc się, jak zstąpił;\nWtedy gdy kamień spada prostopadle,\nJak uczy sztuka nas i doświadczenie:\nTak byłem rażon światłością tajemną,\nKtóra swój promień odbiła przede mną,\nAż wzrok mój przed nim w głąb oka ustąpił."
    verse: true
    chunks:
      - pl: "Wzwyż nad powieki wzniosłem obie ręce,"
        ru: "Я поднял обе руки над веками,"
      - pl: "\nRobiąc dla oczu zasłonę naprędce,"
        ru: "делая наскоро заслон для глаз,"
        note: "naprędce — наскоро"
      - pl: "\nKędy się jasność łamała zbyteczna."
        ru: "где преломлялся излишний свет."
        note: "zbyteczny — излишний"
      - pl: "\nJak w przeciwległe wznosi się przestrzenie"
        ru: "Как в противоположные пространства поднимается"
      - pl: "\nPromień odbity w wodzie lub zwierciadle,"
        ru: "луч, отражённый в воде или в зеркале,"
      - pl: "\nPod jednym kątem wznosząc się, jak zstąpił;"
        ru: "поднимаясь под тем же углом, под каким сошёл,"
        note: "kąt — угол"
      - pl: "\nWtedy gdy kamień spada prostopadle,"
        ru: "тогда как камень падает отвесно,"
      - pl: "\nJak uczy sztuka nas i doświadczenie:"
        ru: "как учат нас искусство и опыт:"
      - pl: "\nTak byłem rażon światłością tajemną,"
        ru: "так я был поражён таинственным светом,"
      - pl: "\nKtóra swój promień odbiła przede mną,"
        ru: "что отразил передо мной свой луч,"
      - pl: "\nAż wzrok mój przed nim w głąb oka ustąpił."
        ru: "так что мой взгляд отступил перед ним вглубь глаза."
    words: { "wzniosłem": wzniesc, "zasłonę": zaslona, "jasność": jasnosc, "wznosi": wznosic, "kątem": kat, "prostopadle": prostopadle }
  - clean: "«Jaka to światłość, ojcze, co me oko»,\nRzekłem, «jak strzałą przebija głęboko,\nZda się wprost ku nam pomyka się bliżej?»\n«Nie dziw się» odrzekł, «że widok uroczy\nNiebieskich gońców jeszcze lśni twe oczy.\nGoniec ten wzywa, by człowiek szedł wyżej."
    verse: true
    chunks:
      - pl: "«Jaka to światłość, ojcze, co me oko»,"
        ru: "«Что это за свет, отец, что мой глаз, —"
      - pl: "\nRzekłem, «jak strzałą przebija głęboko,"
        ru: "сказал я, — пронзает, как стрелой, глубоко,"
      - pl: "\nZda się wprost ku nam pomyka się bliżej?»"
        ru: "кажется, он скользит прямо к нам ближе?»"
      - pl: "\n«Nie dziw się» odrzekł, «że widok uroczy"
        ru: "«Не удивляйся, — ответил он, — что прелестный вид"
      - pl: "\nNiebieskich gońców jeszcze lśni twe oczy."
        ru: "небесных гонцов ещё слепит твои глаза."
      - pl: "\nGoniec ten wzywa, by człowiek szedł wyżej."
        ru: "Этот гонец зовёт, чтобы человек шёл выше."
    words: { "Rzekłem": rzec, "strzałą": strzala, "bliżej": blisko, "widok": widok, "Niebieskich": niebieski, "wzywa": wzywac }
  - clean: "Na światło, co go znieść wzrok twój nie zdoła,\nPatrzeć z rozkoszą przywykniesz powoli,\nIle ci czuć ją natura pozwoli».\nKiedyśmy byli już blisko anioła:\n«Idźcie!» rzekł pełen anielskiej pogody;\n«Od dwóch poprzednich tu mniej strome schody."
    verse: true
    chunks:
      - pl: "Na światło, co go znieść wzrok twój nie zdoła,"
        ru: "На свет, которого твой взгляд вынести не может,"
      - pl: "\nPatrzeć z rozkoszą przywykniesz powoli,"
        ru: "ты постепенно привыкнешь смотреть с наслаждением,"
      - pl: "\nIle ci czuć ją natura pozwoli»."
        ru: "сколько природа позволит тебе его чувствовать»."
      - pl: "\nKiedyśmy byli już blisko anioła:"
        ru: "Когда мы были уже близко от ангела:"
      - pl: "\n«Idźcie!» rzekł pełen anielskiej pogody;"
        ru: "«Идите! — сказал он, полный ангельской безмятежности;"
        note: "pogoda — безмятежность"
      - pl: "\n«Od dwóch poprzednich tu mniej strome schody."
        ru: "— здесь лестница менее крута, чем две предыдущие»."
    words: { "wzrok": wzrok, "zdoła": zdolac, "przywykniesz": przywyknac, "natura": natura, "pogody": pogoda, "schody": schody }
  - clean: "Jużeśmy zeszli z kręgu, gdy za nami\nMisericordes beati śpiewano,\nI: *«Bądź tu, duszo zwycięzcy, wesoła*!»\nMój wódz, ja, szliśmy samotni schodami:\nA idąc krokiem dość sporym, myślałem\nZ jego słów korzyść wyciągnąć żądaną."
    verse: true
    chunks:
      - pl: "Jużeśmy zeszli z kręgu, gdy za nami"
        ru: "Мы уже сошли с круга, когда позади нас"
      - pl: "\nMisericordes beati śpiewano,"
        ru: "пели «Misericordes beati»"
        note: "«Блаженны милостивые»"
      - pl: "\nI: *«Bądź tu, duszo zwycięzcy, wesoła*!»"
        ru: "и: «Будь здесь весела, душа победителя!»"
      - pl: "\nMój wódz, ja, szliśmy samotni schodami:"
        ru: "Мой вождь и я шли одни по лестнице:"
      - pl: "\nA idąc krokiem dość sporym, myślałem"
        ru: "и, идя довольно скорым шагом, я думал"
      - pl: "\nZ jego słów korzyść wyciągnąć żądaną."
        ru: "извлечь из его слов желанную пользу."
    words: { "zwycięzcy": zwyciezca, "wesoła": wesoly, "wódz": wodz, "samotni": samotny, "korzyść": korzysc, "żądaną": zadac-2 }
  - clean: "Więc go zaszedłem z boku i spytałem:\n«Co duch romański chciał rzec, mówiąc ciemno\nO dobrach, które zawiścią wzajemną\nJedne od drugich wyłączać się rade?»\nA wódz: «On teraz zna niebezpieczeństwo\nGrzechu, co ściągnął nań czyśćca męczeństwo:\nPotępia zawiść, duchową szkaradę,\nKtóra was brudem tak powszednim kali,\nAby mniej drudzy na ten grzech płakali."
    verse: true
    chunks:
      - pl: "Więc go zaszedłem z boku i spytałem:"
        ru: "И я зашёл к нему сбоку и спросил:"
      - pl: "\n«Co duch romański chciał rzec, mówiąc ciemno"
        ru: "«Что хотел сказать романский дух, говоря темно"
      - pl: "\nO dobrach, które zawiścią wzajemną"
        ru: "о благах, которые взаимной завистью"
      - pl: "\nJedne od drugich wyłączać się rade?»"
        ru: "охотно исключают друг друга?»"
      - pl: "\nA wódz: «On teraz zna niebezpieczeństwo"
        ru: "А вождь: «Он теперь знает опасность"
      - pl: "\nGrzechu, co ściągnął nań czyśćca męczeństwo:"
        ru: "греха, что навлёк на него муку Чистилища:"
      - pl: "\nPotępia zawiść, duchową szkaradę,"
        ru: "он осуждает зависть, духовное уродство,"
        note: "szkarada — уродство"
      - pl: "\nKtóra was brudem tak powszednim kali,"
        ru: "что пачкает вас столь обычной грязью,"
        note: "kalać — пачкать"
      - pl: "\nAby mniej drudzy na ten grzech płakali."
        ru: "чтобы другие меньше плакали об этом грехе."
    words: { "boku": bok, "niebezpieczeństwo": niebezpieczenstwo, "Grzechu": grzech, "ściągnął": sciagnac, "duchową": duchowy, "brudem": brud }
  - clean: "Bo gdy lgną wasze żądze i nadzieje\nDo tych dóbr, z których część każda maleje\nGdy się ich *całość* na wielu rozrzuca,\nZawiść wzdychaniem morduje wam płuca.\nGdybyście w niebo wznieśli żądze wasze,\nKtóre na ziemi lada fraszka drażni,\nW sercach by takiej nie było bojaźni."
    verse: true
    chunks:
      - pl: "Bo gdy lgną wasze żądze i nadzieje"
        ru: "Ибо когда ваши желания и надежды льнут"
      - pl: "\nDo tych dóbr, z których część każda maleje"
        ru: "к тем благам, из которых каждая часть уменьшается,"
      - pl: "\nGdy się ich *całość* na wielu rozrzuca,"
        ru: "когда их целое раздаётся многим,"
      - pl: "\nZawiść wzdychaniem morduje wam płuca."
        ru: "зависть изводит вам лёгкие вздохами."
        note: "mordować — изводить"
      - pl: "\nGdybyście w niebo wznieśli żądze wasze,"
        ru: "Если бы вы вознесли свои желания к небу,"
      - pl: "\nKtóre na ziemi lada fraszka drażni,"
        ru: "которые на земле дразнит любой пустяк,"
        note: "fraszka — пустяк"
      - pl: "\nW sercach by takiej nie było bojaźni."
        ru: "в сердцах не было бы такой боязни."
    words: { "część": czesc-noun, "całość": calosc, "płuca": pluco, "niebo": niebo, "ziemi": ziemia, "sercach": serce }
  - clean: "Bo tam kto więcej mówi: *Oto nasze!*\nTen większą cząstkę posiada z dóbr ducha,\nW nim miłosierdzie większym ogniem bucha».\n— «Twych odpowiedzi ja łaknę bez końca,»\nRzekłem, «bo duch mój trawi myśl wątpiąca.\nJakżeby mogło dobro podzielone\nWięcej bogacić licznych posiadaczy,\nNiż gdyby było w jednostce skupione?»"
    verse: true
    chunks:
      - pl: "Bo tam kto więcej mówi: *Oto nasze!*"
        ru: "Ибо там, чем больше [людей] говорят: „Вот наше!“,"
      - pl: "\nTen większą cząstkę posiada z dóbr ducha,"
        ru: "тем большую часть духовных благ каждый имеет,"
      - pl: "\nW nim miłosierdzie większym ogniem bucha»."
        ru: "тем большим огнём пылает в нём милосердие»."
      - pl: "\n— «Twych odpowiedzi ja łaknę bez końca,»"
        ru: "— «Твоих ответов я жажду без конца, —"
      - pl: "\nRzekłem, «bo duch mój trawi myśl wątpiąca."
        ru: "сказал я, — ибо мой дух мучит сомневающаяся мысль."
      - pl: "\nJakżeby mogło dobro podzielone"
        ru: "Как же могло бы разделённое благо"
      - pl: "\nWięcej bogacić licznych posiadaczy,"
        ru: "больше обогащать многочисленных владельцев,"
        note: "posiadacz — владелец"
      - pl: "\nNiż gdyby było w jednostce skupione?»"
        ru: "чем если бы оно было сосредоточено в одном?»"
        note: "jednostka — единица, один"
    words: { "cząstkę": czastka, "posiada": posiadac, "wątpiąca": watpic, "podzielone": podzielic, "jednostce": jednostka, "skupione": skupic }
  - clean: "A mistrz: «Twej myśli ruch zawsze ślimaczy,\nTkwi w rzeczach ziemskich, w ciasnym kółku chodzi,\nZe światła prawdy w niej się ciemność rodzi.\nNajwyższe dobro i niewysłowione\nSpada, gdzie miłość ku niemu drży cała,\nJak schodzi promień do jasnego ciała,\nGdzie większy zapał większym blaskiem pała."
    verse: true
    chunks:
      - pl: "A mistrz: «Twej myśli ruch zawsze ślimaczy,"
        ru: "А учитель: «Движение твоей мысли всегда улиточье,"
        note: "ślimaczy — улиточий"
      - pl: "\nTkwi w rzeczach ziemskich, w ciasnym kółku chodzi,"
        ru: "оно застревает в земных вещах, ходит в тесном кругу,"
      - pl: "\nZe światła prawdy w niej się ciemność rodzi."
        ru: "из света истины в нём рождается тьма."
      - pl: "\nNajwyższe dobro i niewysłowione"
        ru: "Высшее и невыразимое благо"
        note: "niewysłowiony — невыразимый"
      - pl: "\nSpada, gdzie miłość ku niemu drży cała,"
        ru: "нисходит туда, где любовь к нему вся трепещет,"
      - pl: "\nJak schodzi promień do jasnego ciała,"
        ru: "как луч сходит к светлому телу,"
      - pl: "\nGdzie większy zapał większym blaskiem pała."
        ru: "где больший пыл горит большим блеском."
    words: { "Tkwi": tkwic, "ziemskich": ziemski, "ciasnym": ciasny, "kółku": kolko, "schodzi": schodzic, "blaskiem": blask }
  - clean: "Duch ile więcej ukochał miłośnie,\nO tyle wieczna jego wartość rośnie;\nTam dusz społecznych im większe zebranie,\nTym większa jest ich miłość i kochanie;\nJak jedna drugą szyba zwierciadlana,\nTreść kochającą odbija kochana."
    verse: true
    chunks:
      - pl: "Duch ile więcej ukochał miłośnie,"
        ru: "Чем больше дух возлюбил любовно,"
      - pl: "\nO tyle wieczna jego wartość rośnie;"
        ru: "тем больше растёт его вечная ценность;"
      - pl: "\nTam dusz społecznych im większe zebranie,"
        ru: "там, чем больше собрание общих душ,"
      - pl: "\nTym większa jest ich miłość i kochanie;"
        ru: "тем больше их любовь и приязнь;"
      - pl: "\nJak jedna drugą szyba zwierciadlana,"
        ru: "как одно зеркальное стекло — другое,"
        note: "zwierciadlany — зеркальный"
      - pl: "\nTreść kochającą odbija kochana."
        ru: "любимая душа отражает любящую суть."
    words: { "Duch": duch, "wieczna": wieczny, "wartość": wartosc, "społecznych": spoleczny, "szyba": szyba, "odbija": odbijac }
  - clean: "Jeśli za skąpo twoją żądzę sycę,\nJeśli głód czują twoje myśli czynne,\nTam wyżej wkrótce twoja Beatryce\nUkoi żądzę tę i wszystkie inne.\nPostępuj dalej, bo co prędzej warto\nPięć plam ci zetrzeć, jako dwie już starto,\nA które łzami Bóg zmywać pozwolił»."
    verse: true
    chunks:
      - pl: "Jeśli za skąpo twoją żądzę sycę,"
        ru: "Если я слишком скупо насыщаю твоё желание,"
      - pl: "\nJeśli głód czują twoje myśli czynne,"
        ru: "если голод чувствуют твои деятельные мысли,"
      - pl: "\nTam wyżej wkrótce twoja Beatryce"
        ru: "там, наверху, вскоре твоя Беатриче"
      - pl: "\nUkoi żądzę tę i wszystkie inne."
        ru: "утолит это желание и все другие."
      - pl: "\nPostępuj dalej, bo co prędzej warto"
        ru: "Иди дальше, ибо стоит поскорее"
      - pl: "\nPięć plam ci zetrzeć, jako dwie już starto,"
        ru: "стереть тебе пять пятен, как уже стёрты два,"
      - pl: "\nA które łzami Bóg zmywać pozwolił»."
