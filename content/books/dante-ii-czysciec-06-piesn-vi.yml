  - clean: "Gdy od gry w kości grono graczy wstaje,\nPrzegrani długo jeszcze poza stołem\nPróbują rzutów, z nachmurzonym czołem\nZłorzecząc w myśli doświadczonej doli;\nLecz szczęśliwego tłum wkoło otacza:\nTen go spotyka, ten staje przy boku,\nTen się pamięci i łasce poleca;\nOn wszystkich słucha — temu dłoń podaje,\nNa tego spojrzy, temu coś obieca,\nAle jak może, umyka powoli:"
    verse: true
    chunks:
      - pl: "Gdy od gry w kości grono graczy wstaje,"
        ru: "Когда после игры в кости круг игроков встаёт,"
        note: "gra w kości — игра в кости"
      - pl: "\nPrzegrani długo jeszcze poza stołem"
        ru: "проигравшие долго ещё в стороне от стола"
        note: "przegrany — проигравший"
      - pl: "\nPróbują rzutów, z nachmurzonym czołem"
        ru: "пробуют броски, нахмурив лоб,"
      - pl: "\nZłorzecząc w myśli doświadczonej doli;"
        ru: "кляня в мыслях испытанную долю;"
        note: "złorzeczyć — клясть"
      - pl: "\nLecz szczęśliwego tłum wkoło otacza:"
        ru: "а счастливца окружает толпа:"
      - pl: "\nTen go spotyka, ten staje przy boku,"
        ru: "этот его встречает, тот становится сбоку,"
      - pl: "\nTen się pamięci i łasce poleca;"
        ru: "тот просит о памяти и милости;"
      - pl: "\nOn wszystkich słucha — temu dłoń podaje,"
        ru: "он всех слушает — этому подаёт руку,"
      - pl: "\nNa tego spojrzy, temu coś obieca,"
        ru: "на того взглянет, этому что-то пообещает,"
      - pl: "\nAle jak może, umyka powoli:"
        ru: "но, как может, ускользает понемногу:"
    words: { "grono": grono, "rzutów": rzut, "otacza": otaczac, "łasce": laska-2, "poleca": polecac, "podaje": podawac }
  - clean: "Tak i ja byłem na kształt tego gracza,\nI chcąc się z duchów wydostać natłoku,\nObietnicami ich prośby zbywałem.\nTam Beninkasa z Arezzo widziałem,\nCo poległ z Dżina zuchwałego dłoni:\nTam był Cione, co sam śród pogoni\nWroga spadł z konia i utonął w rzece."
    verse: true
    chunks:
      - pl: "Tak i ja byłem na kształt tego gracza,"
        ru: "так и я был подобен этому игроку"
      - pl: "\nI chcąc się z duchów wydostać natłoku,"
        ru: "и, желая выбраться из толчеи духов,"
      - pl: "\nObietnicami ich prośby zbywałem."
        ru: "отделывался от их просьб обещаниями."
        note: "zbywać — отделываться"
      - pl: "\nTam Beninkasa z Arezzo widziałem,"
        ru: "Там я видел Бенинказу из Ареццо,"
      - pl: "\nCo poległ z Dżina zuchwałego dłoni:"
        ru: "что пал от руки дерзкого Гина;"
        note: "Гино ди Такко, разбойник"
      - pl: "\nTam był Cione, co sam śród pogoni"
        ru: "там был Чоне, что сам во время погони"
        note: "Гуччо Тарлати"
      - pl: "\nWroga spadł z konia i utonął w rzece."
        ru: "за врагом упал с коня и утонул в реке."
    words: { "kształt": ksztalt, "gracza": gracz, "Obietnicami": obietnica, "prośby": prosba, "utonął": utonac, "rzece": rzeka }
  - clean: "Frydryk Novello błagał tak dalece,\nŻe mi z litości łzy musiały pociec.\nToż ów Pizańczyk, co go płacząc ojciec,\nPokorą wiary tak przemógł swe serce,\nŻe syna swego uściskał mordercę.\nTam hrabia Orso, który jak się skarży,\nZniósł kaźń nie z winy swojej, lecz z potwarzy,\nZa co dziś ciężkie sumienia wyrzuty\nPani Brabantu koi w łzach pokuty."
    verse: true
    chunks:
      - pl: "Frydryk Novello błagał tak dalece,"
        ru: "Федериго Новелло молил так сильно,"
      - pl: "\nŻe mi z litości łzy musiały pociec."
        ru: "что у меня от жалости потекли слёзы."
      - pl: "\nToż ów Pizańczyk, co go płacząc ojciec,"
        ru: "Также тот пизанец, отец которого, плача,"
        note: "Марцукко, простивший убийцу сына"
      - pl: "\nPokorą wiary tak przemógł swe serce,"
        ru: "смирением веры так одолел своё сердце,"
      - pl: "\nŻe syna swego uściskał mordercę."
        ru: "что обнял убийцу своего сына."
      - pl: "\nTam hrabia Orso, który jak się skarży,"
        ru: "Там граф Орсо, который, как он жалуется,"
      - pl: "\nZniósł kaźń nie z winy swojej, lecz z potwarzy,"
        ru: "перенёс казнь не по своей вине, а из-за клеветы,"
        note: "potwarz — клевета; Пьер де ла Бросс"
      - pl: "\nZa co dziś ciężkie sumienia wyrzuty"
        ru: "за что ныне тяжкие угрызения совести"
      - pl: "\nPani Brabantu koi w łzach pokuty."
        ru: "госпожа Брабанта утоляет в слезах покаяния."
    words: { "litości": litosc, "hrabia": hrabia, "Zniósł": zniesc, "sumienia": sumienie, "wyrzuty": wyrzut, "łzach": lza }
  - clean: "Gdym się uwolnił od tych wszystkich, którzy\nProsili tylko, aby za nich prosić,\nIżby w tych miejscach nie cierpieli dłużej\nI mogli wieczne osiągnąć wesele,\nRzekłem do mistrza: «Ucz mię, co mam wnosić?\nIle pamiętam, rzekłeś w twoim dziele,\nŻe prośba niebios wyroków nie wzrusza,\nA tu mię o to każda prosi dusza."
    verse: true
    chunks:
      - pl: "Gdym się uwolnił od tych wszystkich, którzy"
        ru: "Когда я освободился от всех них, которые"
      - pl: "\nProsili tylko, aby za nich prosić,"
        ru: "просили лишь о том, чтобы молиться за них,"
      - pl: "\nIżby w tych miejscach nie cierpieli dłużej"
        ru: "чтобы в этих местах они не страдали дольше"
      - pl: "\nI mogli wieczne osiągnąć wesele,"
        ru: "и могли достичь вечной радости,"
      - pl: "\nRzekłem do mistrza: «Ucz mię, co mam wnosić?"
        ru: "я сказал учителю: «Научи меня, что мне заключить?"
      - pl: "\nIle pamiętam, rzekłeś w twoim dziele,"
        ru: "Насколько помню, ты сказал в своём творении,"
      - pl: "\nŻe prośba niebios wyroków nie wzrusza,"
        ru: "что мольба не трогает приговоров небес,"
        note: "у Вергилия: «Не надейся молитвой изменить волю богов»"
      - pl: "\nA tu mię o to każda prosi dusza."
        ru: "а здесь меня об этом просит каждая душа."
    words: { "wieczne": wieczny, "osiągnąć": osiagnac, "Rzekłem": rzec, "dziele": dzielo, "niebios": niebiosa, "wyroków": wyrok }
  - clean: "Czyż więc nadzieja ich ma być daremna,\nCzy tylko dla mnie myśl twa była ciemna?»\nA mistrz mi na to: «I myśl moja jasna,\nI ich nadzieja bynajmniej nie myli.\nRzecz tylko zdrowo rozważyć potrzeba.\nIści się bowiem, nie zmienia sąd nieba,\nGdy miłość za nich spełni w jednej chwili,\nCo spełnić miała ich tu męka własna,\nW owych zaś czasach, gdym ja myśl mą głosił,\nGrzech nie mógł cudzym gładzić się pacierzem."
    verse: true
    chunks:
      - pl: "Czyż więc nadzieja ich ma być daremna,"
        ru: "Неужели же их надежда должна быть напрасной,"
      - pl: "\nCzy tylko dla mnie myśl twa była ciemna?»"
        ru: "или только для меня твоя мысль была тёмной?»"
      - pl: "\nA mistrz mi na to: «I myśl moja jasna,"
        ru: "А учитель мне на это: «И моя мысль ясна,"
      - pl: "\nI ich nadzieja bynajmniej nie myli."
        ru: "и их надежда отнюдь не обманывает."
        note: "bynajmniej — отнюдь"
      - pl: "\nRzecz tylko zdrowo rozważyć potrzeba."
        ru: "Нужно лишь здраво взвесить дело."
      - pl: "\nIści się bowiem, nie zmienia sąd nieba,"
        ru: "Ибо исполняется, а не изменяется суд неба,"
        note: "iścić się — исполняться"
      - pl: "\nGdy miłość za nich spełni w jednej chwili,"
        ru: "когда любовь за них в одно мгновение совершит"
      - pl: "\nCo spełnić miała ich tu męka własna,"
        ru: "то, что должна была совершить здесь их собственная мука."
      - pl: "\nW owych zaś czasach, gdym ja myśl mą głosił,"
        ru: "В те же времена, когда я возвещал свою мысль,"
      - pl: "\nGrzech nie mógł cudzym gładzić się pacierzem."
        ru: "грех не мог смываться чужой молитвой,"
    words: { "mistrz": mistrz, "rozważyć": rozwazyc, "nieba": niebo, "spełni": spelnic, "Grzech": grzech, "cudzym": cudzy }
  - clean: "Bo i proszący, i ten, za kim prosił,\nNie byli z Bogiem złączeni przymierzem.\nLecz przestań zgłębiać myśli tajemnicze,\nAż ci to powie ta, której oblicze\nI twój ci umysł, i prawdę rozjaśni,\nChcę mówić — aż cię spotka Beatrycze."
    verse: true
    chunks:
      - pl: "Bo i proszący, i ten, za kim prosił,"
        ru: "ибо и просящий, и тот, за кого он просил,"
      - pl: "\nNie byli z Bogiem złączeni przymierzem."
        ru: "не были соединены с Богом заветом."
        note: "przymierze — завет, союз"
      - pl: "\nLecz przestań zgłębiać myśli tajemnicze,"
        ru: "Но перестань постигать таинственные мысли,"
      - pl: "\nAż ci to powie ta, której oblicze"
        ru: "пока тебе это не скажет та, чьё лицо"
      - pl: "\nI twój ci umysł, i prawdę rozjaśni,"
        ru: "и твой ум тебе, и правду озарит,"
      - pl: "\nChcę mówić — aż cię spotka Beatrycze."
        ru: "хочу сказать — пока тебя не встретит Беатриче."
    words: { "Bogiem": bog, "przestań": przestac, "tajemnicze": tajemniczy, "oblicze": oblicze, "umysł": umysl, "spotka": spotkac }
  - clean: "Ujrzysz ją wkrótce na szczycie tej góry,\nGdzie jako słońce wiosenne bez chmury,\nWieczną pogodą i weselem świeci».\n—«O! wodzu!» rzekłem, «idźmy tam co skorzej,\nNic już nie czuję trudu, com czuł pierwej,\nA cień, jak widzę, dłużeje od wzgórzy»."
