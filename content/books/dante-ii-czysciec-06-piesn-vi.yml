        ru: "ибо, хочешь не хочешь, нам надо идти без перерыва,"
      - pl: "\nLecz snadź wprzód słońce zgaśnie za tym wzgórzem"
        ru: "но, видно, прежде солнце погаснет за этим холмом"
      - pl: "\nI z drugiej strony znów wejdzie na nowo,"
        ru: "и с другой стороны снова взойдёт,"
