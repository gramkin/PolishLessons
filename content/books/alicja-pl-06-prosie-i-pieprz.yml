  - clean: "„Będę tu siedział”, zauważył Lokaj, „do jutra…”"
    en: "“I shall sit here,” the Footman remarked, “till tomorrow—”"
    chunks:
      - pl: "„Będę tu siedział”, zauważył Lokaj, „do jutra…”"
        ru: "«Я буду тут сидеть, — заметил Лакей, — до завтра…»"
        note: "będę siedział — буду сидеть: сложное будущее несовершенного вида"
    words: { "jutra": jutro }
  - clean: "W tej chwili drzwi domu otworzyły się i wyleciał z nich wielki talerz, prosto w głowę Lokaja: musnął mu tylko nos i rozbił się o jedno z drzew za nim."
    en: "At this moment the door of the house opened, and a large plate came skimming out, straight at the Footman’s head: it just grazed his nose, and broke to pieces against one of the trees behind him."
    chunks:
      - pl: "W tej chwili drzwi domu otworzyły się i wyleciał z nich wielki talerz, prosto w głowę Lokaja:"
        ru: "В эту минуту дверь дома отворилась, и оттуда вылетела большая тарелка, прямо в голову Лакею:"
        note: "w tej chwili — в эту минуту"
      - pl: " musnął mu tylko nos i rozbił się o jedno z drzew za nim."
        ru: "она лишь задела ему нос и разбилась о одно из деревьев позади него."
        note: "musnąć — слегка задеть, коснуться"
    words: { "nos": nos, "drzew": drzewo }
  - clean: "„…albo i do pojutrza, być może”, ciągnął Lokaj tym samym tonem, zupełnie jakby nic się nie stało."
