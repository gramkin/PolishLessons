    chunks:
      - pl: "Było tak bez wątpienia, tyle że Alicja nie lubiła, gdy jej to mówiono."
        ru: "Так оно, без сомнения, и было, только Алиса не любила, когда ей это говорили."
        note: "mówiono — говорили: безличная форма на -no, без подлежащего"
      - pl: " „To naprawdę okropne”, mruknęła do siebie, „jak te wszystkie stworzenia się spierają."
        ru: "«Это правда ужасно, — пробормотала она себе под нос, — как все эти создания спорят."
        note: "spierać się — спорить, препираться"
      - pl: " Można od tego zwariować!”"
        ru: "От этого можно с ума сойти!»"
        note: "można zwariować — можно сойти с ума: безличный оборот"
    words: { "wątpienia": watpic, "tyle": tyl, "okropne": okropny, "stworzenia": stworzyc, "Można": mozna, "zwariować": zwariowac }
  - clean: "Lokaj najwyraźniej uznał to za dobrą sposobność, by powtórzyć swoją uwagę z odmianami. „Będę tu siedział”, powiedział, „z przerwami, całymi dniami.”"
    en: "The Footman seemed to think this a good opportunity for repeating his remark, with variations. “I shall sit here,” he said, “on and off, for days and days.”"
    chunks:
      - pl: "Lokaj najwyraźniej uznał to za dobrą sposobność, by powtórzyć swoją uwagę z odmianami."
        ru: "Лакей, по-видимому, счёл это хорошим случаем, чтобы повторить своё замечание с вариациями."
        note: "najwyraźniej — по-видимому, очевидно"
      - pl: " „Będę tu siedział”, powiedział, „z przerwami, całymi dniami.”"
        ru: "«Я буду тут сидеть, — сказал он, — с перерывами, целыми днями.»"
        note: "z przerwami — с перерывами"
    words: { "najwyraźniej": wyraznie, "odmianami": odmiana, "przerwami": przerwa }
  - clean: "„A co ja mam robić?”, spytała Alicja."
    en: "“But what am _I_ to do?” said Alice."
    chunks:
