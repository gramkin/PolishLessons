  - clean: "Lokaj-Ryba zaczął od wyjęcia spod pachy ogromnego listu, niemal tak wielkiego jak on sam, i wręczył go drugiemu, mówiąc uroczystym tonem: „Dla Księżnej. Zaproszenie od Królowej na krokieta.” Lokaj-Żaba powtórzył tym samym uroczystym tonem, zmieniając tylko nieco szyk słów: „Od Królowej. Zaproszenie dla Księżnej na krokieta.”"
    en: "The Fish-Footman began by producing from under his arm a great letter, nearly as large as himself, and this he handed over to the other, saying, in a solemn tone, “For the Duchess. An invitation from the Queen to play croquet.” The Frog-Footman repeated, in the same solemn tone, only changing the order of the words a little, “From the Queen. An invitation for the Duchess to play croquet.”"
    chunks:
      - pl: "Lokaj-Ryba zaczął od wyjęcia spod pachy ogromnego listu, niemal tak wielkiego jak on sam,"
        ru: "Лакей-Рыба начал с того, что вынул из-под мышки огромное письмо, почти такое же большое, как он сам,"
        note: "zacząć od czegoś — начать с чего-л.: od и родительный"
      - pl: " i wręczył go drugiemu, mówiąc uroczystym tonem:"
        ru: "и вручил его другому, говоря торжественным тоном:"
        note: "wręczyć komuś coś — вручить кому-л. что-л.: дательный падеж"
      - pl: " „Dla Księżnej. Zaproszenie od Królowej na krokieta.”"
        ru: "«Для Герцогини. Приглашение от Королевы на крокет.»"
        note: "zaproszenie na coś — приглашение на что-л.: na и винительный"
      - pl: " Lokaj-Żaba powtórzył tym samym uroczystym tonem, zmieniając tylko nieco szyk słów:"
        ru: "Лакей-Лягушка повторил тем же торжественным тоном, лишь слегка изменив порядок слов:"
        note: "szyk słów — порядок слов"
      - pl: " „Od Królowej. Zaproszenie dla Księżnej na krokieta.”"
        ru: "«От Королевы. Приглашение для Герцогини на крокет.»"
    words: { "ogromnego": ogromny, "listu": list, "drugiemu": drugi, "tonem": ton, "Zaproszenie": zaprosic, "Królowej": krolowa, "powtórzył": powtorzyc, "zmieniając": zmieniac, "nieco": nieco, "słów": slowo }
  - clean: "Potem obaj skłonili się nisko i ich loki splątały się ze sobą."
    en: "Then they both bowed low, and their curls got entangled together."
    chunks:
      - pl: "Potem obaj skłonili się nisko i ich loki splątały się ze sobą."
        ru: "Потом оба низко поклонились, и их локоны перепутались друг с другом."
        note: "skłonić się — поклониться"
    words: { "Potem": potem }
  - clean: "Alicja tak się z tego śmiała, że musiała uciec z powrotem do lasu w obawie, że ją usłyszą; a kiedy znów wyjrzała, Lokaja-Ryby już nie było, a drugi siedział na ziemi koło drzwi, gapiąc się tępo w niebo."
    en: "Alice laughed so much at this, that she had to run back into the wood for fear of their hearing her; and when she next peeped out the Fish-Footman was gone, and the other was sitting on the ground near the door, staring stupidly up into the sky."
    chunks:
      - pl: "Alicja tak się z tego śmiała, że musiała uciec z powrotem do lasu w obawie, że ją usłyszą;"
        ru: "Алиса так над этим смеялась, что ей пришлось убежать обратно в лес из опасения, что её услышат;"
        note: "w obawie, że — из опасения, что"
      - pl: " a kiedy znów wyjrzała, Lokaja-Ryby już nie było,"
        ru: "а когда она снова выглянула, Лакея-Рыбы уже не было,"
        note: "nie było kogoś — кого-то не было: при отрицании родительный падеж"
      - pl: " a drugi siedział na ziemi koło drzwi, gapiąc się tępo w niebo."
        ru: "а другой сидел на земле у двери, тупо глазея в небо."
        note: "gapić się — глазеть, пялиться"
    words: { "śmiała": smiac, "uciec": uciec, "powrotem": powrot, "obawie": obawa, "usłyszą": uslyszec, "siedział": siedziec, "ziemi": ziemia, "koło": kolo, "niebo": niebo }
  - clean: "Alicja podeszła nieśmiało do drzwi i zapukała."
    en: "Alice went timidly up to the door, and knocked."
    chunks:
      - pl: "Alicja podeszła nieśmiało do drzwi i zapukała."
        ru: "Алиса робко подошла к двери и постучала."
        note: "podejść do czegoś — подойти к чему-л.: do и родительный"
    words: { "podeszła": podejsc }
  - clean: "„Pukanie nie ma najmniejszego sensu”, powiedział Lokaj, „i to z dwóch powodów. Po pierwsze, bo jestem po tej samej stronie drzwi co ty; po drugie, bo w środku robią taki hałas, że nikt nie mógłby cię usłyszeć.” I rzeczywiście w środku panował niezwykły hałas — nieustanne wycie i kichanie, a co chwila wielki brzęk, jakby półmisek albo garnek rozbijał się na kawałki."
    en: "“There’s no sort of use in knocking,” said the Footman, “and that for two reasons. First, because I’m on the same side of the door as you are; secondly, because they’re making such a noise inside, no one could possibly hear you.” And certainly there _was_ a most extraordinary noise going on within—a constant howling and sneezing, and every now and then a great crash, as if a dish or kettle had been broken to pieces."
    chunks:
      - pl: "„Pukanie nie ma najmniejszego sensu”, powiedział Lokaj, „i to z dwóch powodów."
        ru: "«Стучать нет ни малейшего смысла, — сказал Лакей, — и это по двум причинам."
        note: "nie ma sensu — нет смысла: безличный оборот"
      - pl: " Po pierwsze, bo jestem po tej samej stronie drzwi co ty;"
        ru: "Во-первых, потому что я по ту же сторону двери, что и ты;"
        note: "po pierwsze — во-первых"
      - pl: " po drugie, bo w środku robią taki hałas, że nikt nie mógłby cię usłyszeć.”"
        ru: "во-вторых, потому что внутри поднимают такой шум, что никто не смог бы тебя услышать.»"
        note: "robić hałas — шуметь, поднимать шум"
      - pl: " I rzeczywiście w środku panował niezwykły hałas —"
        ru: "И действительно, внутри стоял необычайный шум —"
        note: "panować — царить, стоять (о шуме, тишине)"
      - pl: " nieustanne wycie i kichanie, a co chwila wielki brzęk, jakby półmisek albo garnek rozbijał się na kawałki."
        ru: "беспрестанный вой и чихание, а то и дело громкий звон, будто блюдо или котелок разбивался вдребезги."
        note: "rozbić się na kawałki — разбиться вдребезги"
    words: { "sensu": sens, "powodów": powod, "stronie": strona, "środku": srodek, "rzeczywiście": rzeczywiscie, "niezwykły": niezwykly }
  - clean: "„Proszę zatem powiedzieć”, rzekła Alicja, „jak mam się dostać do środka?”"
    en: "“Please, then,” said Alice, “how am I to get in?”"
    chunks:
      - pl: "„Proszę zatem powiedzieć”, rzekła Alicja, „jak mam się dostać do środka?”"
        ru: "«Тогда скажите, пожалуйста, — сказала Алиса, — как мне попасть внутрь?»"
        note: "mam się dostać — мне попасть: mieć + инфинитив о долженствовании"
    words: { "rzekła": rzec }
  - clean: "„Twoje pukanie miałoby jakiś sens”, ciągnął Lokaj, nie zwracając na nią uwagi, „gdyby drzwi były między nami. Na przykład, gdybyś była w środku, mogłabyś zapukać, a ja mógłbym cię wypuścić, wiesz.” Przez cały czas, gdy mówił, patrzył w niebo, co Alicja uznała za stanowczo nieuprzejme. „Ale może nic na to nie poradzi”, powiedziała sobie; „jego oczy są przecież tak bardzo blisko czubka głowy. W każdym razie mógłby odpowiadać na pytania. — Jak mam się dostać do środka?”, powtórzyła na głos."
    en: "“There might be some sense in your knocking,” the Footman went on without attending to her, “if we had the door between us. For instance, if you were _inside_, you might knock, and I could let you out, you know.” He was looking up into the sky all the time he was speaking, and this Alice thought decidedly uncivil. “But perhaps he can’t help it,” she said to herself; “his eyes are so _very_ nearly at the top of his head. But at any rate he might answer questions.—How am I to get in?” she repeated, aloud."
    chunks:
      - pl: "„Twoje pukanie miałoby jakiś sens”, ciągnął Lokaj, nie zwracając na nią uwagi,"
        ru: "«В твоём стуке был бы какой-то смысл, — продолжал Лакей, не обращая на неё внимания, —"
        note: "mieć sens — иметь смысл"
