        ru: "«если бы дверь была между нами."
        note: "gdyby — если бы: вводит условие"
      - pl: " Na przykład, gdybyś była w środku, mogłabyś zapukać, a ja mógłbym cię wypuścić, wiesz.”"
        ru: "Например, если бы ты была внутри, ты могла бы постучать, а я мог бы тебя выпустить, знаешь.»"
        note: "wypuścić — выпустить"
      - pl: " Przez cały czas, gdy mówił, patrzył w niebo, co Alicja uznała za stanowczo nieuprzejme."
        ru: "Всё время, пока он говорил, он смотрел в небо, что Алиса сочла решительно невежливым."
        note: "uznać coś za coś — счесть что-л. чем-л.: za и винительный"
      - pl: " „Ale może nic na to nie poradzi”, powiedziała sobie;"
        ru: "«Но, может быть, он ничего не может с этим поделать», — сказала она себе;"
        note: "nic na to nie poradzi — ничего с этим не поделает"
      - pl: " „jego oczy są przecież tak bardzo blisko czubka głowy."
        ru: "«ведь глаза у него так близко к макушке."
        note: "czubek głowy — макушка"
      - pl: " W każdym razie mógłby odpowiadać na pytania."
        ru: "Во всяком случае, мог бы отвечать на вопросы."
        note: "odpowiadać na pytania — отвечать на вопросы: na и винительный"
      - pl: " — Jak mam się dostać do środka?”, powtórzyła na głos."
        ru: "— Как мне попасть внутрь?» — повторила она вслух."
        note: "na głos — вслух"
