chapterTitle: Prosię i pieprz
chapterTitleRu: Поросёнок и перец
level: B1
paragraphs:
  - clean: "Przez minutę czy dwie stała, patrząc na dom i zastanawiając się, co dalej robić, gdy nagle z lasu wybiegł lokaj w liberii — (uznała go za lokaja, ponieważ był w liberii; inaczej, sądząc po samej twarzy, nazwałaby go rybą) — i zastukał głośno do drzwi kostkami palców. Otworzył mu inny lokaj w liberii, o okrągłej twarzy i wielkich oczach jak u żaby; a obaj lokaje, jak zauważyła Alicja, mieli upudrowane włosy, kręcące się na całej głowie. Bardzo ją ciekawiło, o co w tym wszystkim chodzi, więc wysunęła się kawałek z lasu, żeby posłuchać."
    en: "For a minute or two she stood looking at the house, and wondering what to do next, when suddenly a footman in livery came running out of the wood—(she considered him to be a footman because he was in livery: otherwise, judging by his face only, she would have called him a fish)—and rapped loudly at the door with his knuckles. It was opened by another footman in livery, with a round face, and large eyes like a frog; and both footmen, Alice noticed, had powdered hair that curled all over their heads. She felt very curious to know what it was all about, and crept a little way out of the wood to listen."
    chunks:
      - pl: "Przez minutę czy dwie stała, patrząc na dom i zastanawiając się, co dalej robić,"
        ru: "Минуту или две она стояла, глядя на дом и раздумывая, что делать дальше,"
        note: "zastanawiać się nad czymś — раздумывать над чем-л.: nad и творительный"
      - pl: " gdy nagle z lasu wybiegł lokaj w liberii —"
        ru: "когда вдруг из леса выбежал лакей в ливрее —"
        note: "lokaj w liberii — лакей в ливрее"
      - pl: " (uznała go za lokaja, ponieważ był w liberii;"
        ru: "(она сочла его лакеем, потому что он был в ливрее;"
        note: "uznać kogoś za kogoś — счесть кого-л. кем-л.: za и винительный"
      - pl: " inaczej, sądząc po samej twarzy, nazwałaby go rybą) —"
        ru: "иначе, судя по одному лицу, она назвала бы его рыбой) —"
        note: "sądząc po czymś — судя по чему-л.: po и предложный"
      - pl: " i zastukał głośno do drzwi kostkami palców."
        ru: "и громко постучал в дверь костяшками пальцев."
        note: "zastukać do drzwi — постучать в дверь: do и родительный"
      - pl: " Otworzył mu inny lokaj w liberii, o okrągłej twarzy i wielkich oczach jak u żaby;"
        ru: "Ему открыл другой лакей в ливрее, с круглым лицом и большими глазами, как у лягушки;"
        note: "o okrągłej twarzy — с круглым лицом: предлог o описывает признак"
      - pl: " a obaj lokaje, jak zauważyła Alicja, mieli upudrowane włosy, kręcące się na całej głowie."
        ru: "а у обоих лакеев, как заметила Алиса, были напудренные волосы, завитые по всей голове."
        note: "obaj — оба: мужская личная форма числительного"
      - pl: " Bardzo ją ciekawiło, o co w tym wszystkim chodzi,"
        ru: "Ей было очень любопытно, в чём тут всё дело,"
        note: "o co chodzi — в чём дело"
      - pl: " więc wysunęła się kawałek z lasu, żeby posłuchać."
        ru: "поэтому она немного высунулась из леса, чтобы послушать."
        note: "wysunąć się — высунуться"
