        ru: "«А должна ли ты вообще попасть внутрь?» — сказал Лакей."
        note: "w ogóle — вообще"
      - pl: " „To jest pierwsze pytanie, wiesz.”"
        ru: "«Это первый вопрос, знаешь ли.»"
    words: { "ogóle": ogol }
  - clean: "Było tak bez wątpienia, tyle że Alicja nie lubiła, gdy jej to mówiono. „To naprawdę okropne”, mruknęła do siebie, „jak te wszystkie stworzenia się spierają. Można od tego zwariować!”"
