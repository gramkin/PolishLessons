  - clean: "Nie uszła daleko, gdy ujrzała dom Zająca Marcowego: pomyślała, że to musi być właściwy dom, bo kominy miały kształt uszu, a dach był kryty futrem. Dom był tak duży, że nie chciała podchodzić bliżej, dopóki nie skubnęła jeszcze trochę z lewego kawałka grzyba i nie podniosła się do jakichś dwóch stóp wzrostu: nawet wtedy szła ku niemu dość nieśmiało, mówiąc sobie: „A jeśli mimo wszystko jest kompletnie szalony! Prawie żałuję, że nie poszłam zamiast tego do Kapelusznika!”"
