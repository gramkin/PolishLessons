  - clean: "Z początku moje wysiłki spotykały się ze zdumionym spojrzeniem albo z nieustającym śmiechem, ale wkrótce małe jasnowłose stworzenie zdawało się pojąć mój zamiar i powtórzyło nazwę. Musieli długo szczebiotać i tłumaczyć sobie nawzajem całą sprawę, a moje pierwsze próby wydania wytwornych dźwięków ich języka wywołały ogromne, szczere, choć niegrzeczne rozbawienie. Czułem się jednak jak nauczyciel wśród dzieci i nie ustępowałem, i wkrótce miałem w zanadrzu co najmniej dwadzieścia rzeczowników; potem przeszedłem do zaimków wskazujących, a nawet do czasownika „jeść”. Ale była to powolna praca, a mali ludzie szybko się męczyli i chcieli uciec od moich pytań, postanowiłem więc, raczej z konieczności, pozwolić im dawać lekcje w małych dawkach, kiedy będą mieli ochotę. A dawki te, jak się wkrótce przekonałem, były bardzo małe, bo nigdy nie spotkałem ludzi bardziej leniwych ani łatwiej się męczących."
    en: "At first my efforts met with a stare of surprise or inextinguishable laughter, but presently a fair-haired little creature seemed to grasp my intention and repeated a name. They had to chatter and explain the business at great length to each other, and my first attempts to make the exquisite little sounds of their language caused an immense amount of genuine, if uncivil, amusement. However, I felt like a schoolmaster amidst children, and persisted, and presently I had a score of noun substantives at least at my command; and then I got to demonstrative pronouns, and even the verb ‘to eat.’ But it was slow work, and the little people soon tired and wanted to get away from my interrogations, so I determined, rather of necessity, to let them give their lessons in little doses when they felt inclined. And very little doses I found they were before long, for I never met people more indolent or more easily fatigued."
