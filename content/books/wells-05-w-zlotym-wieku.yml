  - clean: "Nawiasem mówiąc, owoce stanowiły całe ich pożywienie. Ci ludzie odległej przyszłości byli ścisłymi jaroszami, i dopóki byłem z nimi, mimo pewnych cielesnych pragnień, ja też musiałem żywić się owocami. Odkryłem zresztą później, że konie, bydło, owce i psy podzieliły los ichtiozaura i wymarły. Ale owoce były przepyszne; szczególnie jeden, który przez cały mój pobyt był jakby w porze dojrzewania — mączysty owoc w trójgraniastej łusce — był wyjątkowo dobry, i uczyniłem go swoim głównym pożywieniem. Z początku zastanawiały mnie te wszystkie dziwne owoce i dziwne kwiaty, które widziałem, ale później zacząłem pojmować ich znaczenie."
