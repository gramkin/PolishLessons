paragraphs:
  - clean: "W następnej chwili staliśmy twarzą w twarz, ja i ta krucha istota z przyszłości. Podszedł prosto do mnie i roześmiał mi się w oczy. Od razu uderzył mnie brak jakiegokolwiek śladu strachu w jego postawie. Potem zwrócił się do dwóch innych, którzy szli za nim, i przemówił do nich w dziwnym, bardzo słodkim i płynnym języku."
    en: "“In another moment we were standing face to face, I and this fragile thing out of futurity. He came straight up to me and laughed into my eyes. The absence from his bearing of any sign of fear struck me at once. Then he turned to the two others who were following him and spoke to them in a strange and very sweet and liquid tongue."
    draft: true
    chunks:
      - pl: "W następnej chwili staliśmy twarzą w twarz, ja i ta krucha istota z przyszłości."
        ru: "В следующий миг мы стояли лицом к лицу — я и это хрупкое создание из будущего."
        note: "kruchy — хрупкий"
      - pl: " Podszedł prosto do mnie i roześmiał mi się w oczy."
        ru: "Он подошёл прямо ко мне и рассмеялся мне в глаза."
      - pl: " Od razu uderzył mnie brak jakiegokolwiek śladu strachu w jego postawie."
        ru: "Меня сразу поразило, что в его поведении не было ни малейшего следа страха."
        note: "postawa — осанка, поведение"
      - pl: " Potem zwrócił się do dwóch innych, którzy szli za nim, i przemówił do nich w dziwnym, bardzo słodkim i płynnym języku."
        ru: "Потом он повернулся к двум другим, шедшим за ним, и заговорил с ними на странном, очень нежном и певучем языке."
    words: { "istota": istota, "roześmiał": rozesmiac, "jakiegokolwiek": jakikolwiek, "postawie": postawa, "zwrócił": zwrocic, "przemówił": przemowic }
  - clean: "Nadchodzili też inni i wkrótce otaczała mnie gromadka może ośmiu czy dziesięciu tych wytwornych stworzeń. Jedno z nich zwróciło się do mnie. Przyszło mi do głowy, dość dziwnie, że mój głos jest dla nich zbyt szorstki i niski. Pokręciłem więc głową i, wskazując na uszy, pokręciłem nią znowu. Zrobił krok naprzód, zawahał się, a potem dotknął mojej ręki. Potem poczułem inne miękkie, małe macki na plecach i ramionach. Chcieli się upewnić, że jestem prawdziwy. Nie było w tym nic niepokojącego. Przeciwnie, w tych ładnych małych ludziach było coś, co budziło zaufanie — pełna wdzięku łagodność, jakaś dziecięca swoboda."
    en: "“There were others coming, and presently a little group of perhaps eight or ten of these exquisite creatures were about me. One of them addressed me. It came into my head, oddly enough, that my voice was too harsh and deep for them. So I shook my head, and, pointing to my ears, shook it again. He came a step forward, hesitated, and then touched my hand. Then I felt other soft little tentacles upon my back and shoulders. They wanted to make sure I was real. There was nothing in this at all alarming. Indeed, there was something in these pretty little people that inspired confidence—a graceful gentleness, a certain childlike ease."
    draft: true
    chunks:
      - pl: "Nadchodzili też inni i wkrótce otaczała mnie gromadka może ośmiu czy dziesięciu tych wytwornych stworzeń."
        ru: "Подходили и другие, и вскоре вокруг меня собралась кучка из восьми или десяти этих изящных созданий."
        note: "gromadka — кучка, группка"
      - pl: " Jedno z nich zwróciło się do mnie."
        ru: "Одно из них обратилось ко мне."
      - pl: " Przyszło mi do głowy, dość dziwnie, że mój głos jest dla nich zbyt szorstki i niski."
        ru: "Мне почему-то пришло в голову, что мой голос для них слишком груб и низок."
        note: "szorstki — грубый, шершавый"
      - pl: " Pokręciłem więc głową i, wskazując na uszy, pokręciłem nią znowu."
        ru: "Поэтому я покачал головой и, показав на уши, покачал снова."
      - pl: " Zrobił krok naprzód, zawahał się, a potem dotknął mojej ręki."
        ru: "Он шагнул вперёд, помедлил, а потом коснулся моей руки."
      - pl: " Potem poczułem inne miękkie, małe macki na plecach i ramionach."
        ru: "Потом я почувствовал на спине и плечах другие мягкие маленькие щупальца."
        note: "macka — щупальце"
      - pl: " Chcieli się upewnić, że jestem prawdziwy."
        ru: "Они хотели убедиться, что я настоящий."
      - pl: " Nie było w tym nic niepokojącego."
        ru: "В этом не было ничего тревожного."
      - pl: " Przeciwnie, w tych ładnych małych ludziach było coś, co budziło zaufanie — pełna wdzięku łagodność, jakaś dziecięca swoboda."
        ru: "Напротив, в этих милых маленьких людях было что-то, внушавшее доверие, — изящная мягкость, какая-то детская непринуждённость."
    words: { "otaczała": otaczac, "Pokręciłem": pokrecic, "miękkie": miekki, "Przeciwnie": przeciwnie, "budziło": budzic, "dziecięca": dzieciecy }
  - clean: "A poza tym wyglądali tak wątło, że wyobrażałem sobie, jak rozrzucam cały ich tuzin niczym kręgle. Ale wykonałem nagły ruch, by ich ostrzec, gdy zobaczyłem, jak ich małe różowe rączki obmacują Wehikuł Czasu. Na szczęście wtedy, póki nie było za późno, pomyślałem o niebezpieczeństwie, o którym dotąd zapomniałem, i sięgnąwszy ponad prętami maszyny, odkręciłem małe dźwignie, które wprawiały ją w ruch, i schowałem je do kieszeni. Potem znów się odwróciłem, żeby zobaczyć, co mogę zrobić, by się porozumieć."
    en: "And besides, they looked so frail that I could fancy myself flinging the whole dozen of them about like ninepins. But I made a sudden motion to warn them when I saw their little pink hands feeling at the Time Machine. Happily then, when it was not too late, I thought of a danger I had hitherto forgotten, and reaching over the bars of the machine I unscrewed the little levers that would set it in motion, and put these in my pocket. Then I turned again to see what I could do in the way of communication."
    draft: true
    chunks:
      - pl: "A poza tym wyglądali tak wątło, że wyobrażałem sobie, jak rozrzucam cały ich tuzin niczym kręgle."
        ru: "К тому же они выглядели такими хрупкими, что я представлял, как разбрасываю всю их дюжину, словно кегли."
        note: "kręgle — кегли"
      - pl: " Ale wykonałem nagły ruch, by ich ostrzec, gdy zobaczyłem, jak ich małe różowe rączki obmacują Wehikuł Czasu."
        ru: "Но я сделал резкое движение, чтобы предостеречь их, когда увидел, как их маленькие розовые ручки ощупывают Машину Времени."
        note: "obmacywać — ощупывать"
      - pl: " Na szczęście wtedy, póki nie było za późno, pomyślałem o niebezpieczeństwie, o którym dotąd zapomniałem,"
        ru: "К счастью, тогда, пока не было слишком поздно, я подумал об опасности, о которой до сих пор забывал,"
      - pl: " i sięgnąwszy ponad prętami maszyny, odkręciłem małe dźwignie, które wprawiały ją w ruch, i schowałem je do kieszeni."
        ru: "и, дотянувшись через стержни машины, отвинтил маленькие рычаги, приводившие её в движение, и спрятал их в карман."
        note: "odkręcić — отвинтить; wprawić w ruch — привести в движение"
      - pl: " Potem znów się odwróciłem, żeby zobaczyć, co mogę zrobić, by się porozumieć."
        ru: "Потом я снова обернулся, чтобы посмотреть, что можно сделать, чтобы объясниться."
        note: "porozumieć się — объясниться, договориться"
    words: { "tuzin": tuzin, "różowe": rozowy, "rączki": raczka, "dotąd": dotad, "sięgnąwszy": siegnac, "porozumieć": porozumiec }
  - clean: "A potem, przyglądając się bliżej ich rysom, dostrzegłem kolejne osobliwości w ich urodzie, przypominającej porcelanę miśnieńską. Ich włosy, u wszystkich jednakowo kręcone, kończyły się ostro na karku i policzkach; na twarzy nie było ich ani śladu, a uszy mieli osobliwie maleńkie. Usta były małe, o jaskrawoczerwonych, raczej cienkich wargach, a drobne podbródki były spiczaste. Oczy były duże i łagodne; i — może to egotyzm z mojej strony — wydało mi się nawet, że brak w nich było zainteresowania, jakiego mógłbym się spodziewać."
    en: "“And then, looking more nearly into their features, I saw some further peculiarities in their Dresden china type of prettiness. Their hair, which was uniformly curly, came to a sharp end at the neck and cheek; there was not the faintest suggestion of it on the face, and their ears were singularly minute. The mouths were small, with bright red, rather thin lips, and the little chins ran to a point. The eyes were large and mild; and—this may seem egotism on my part—I fancied even that there was a certain lack of the interest I might have expected in them."
    draft: true
    chunks:
      - pl: "A potem, przyglądając się bliżej ich rysom, dostrzegłem kolejne osobliwości w ich urodzie, przypominającej porcelanę miśnieńską."
        ru: "А затем, вглядевшись в их черты, я заметил другие особенности их красоты, напоминавшей дрезденский фарфор."
        note: "rysy — черты (лица); porcelana miśnieńska — мейсенский, «дрезденский» фарфор"
      - pl: " Ich włosy, u wszystkich jednakowo kręcone, kończyły się ostro na karku i policzkach;"
        ru: "Их волосы, у всех одинаково кудрявые, резко кончались на шее и щеках;"
        note: "kark — затылок, шея"
      - pl: " na twarzy nie było ich ani śladu, a uszy mieli osobliwie maleńkie."
        ru: "на лице их не было и следа, а уши у них были на редкость крохотные."
      - pl: " Usta były małe, o jaskrawoczerwonych, raczej cienkich wargach, a drobne podbródki były spiczaste."
        ru: "Рты были маленькие, с ярко-красными, довольно тонкими губами, а маленькие подбородки заострены."
        note: "spiczasty — заострённый"
      - pl: " Oczy były duże i łagodne;"
        ru: "Глаза были большие и кроткие;"
      - pl: " i — może to egotyzm z mojej strony — wydało mi się nawet, że brak w nich było zainteresowania, jakiego mógłbym się spodziewać."
        ru: "и — пусть это покажется эгоизмом с моей стороны — мне даже почудилось, что в них недоставало того интереса, которого я мог бы ожидать."
    words: { "przyglądając": przygladac, "urodzie": uroda, "policzkach": policzek, "cienkich": cienki, "wargach": warga, "łagodne": lagodny }
  - clean: "Ponieważ nie czynili żadnych wysiłków, by się ze mną porozumieć, tylko stali wokół, uśmiechając się i gruchając do siebie miękkimi głosami, zacząłem rozmowę sam. Wskazałem na Wehikuł Czasu i na siebie. Potem, wahając się przez chwilę, jak wyrazić Czas, wskazałem na słońce. Natychmiast śliczna, dziwaczna figurka w purpurowo-białą kratkę powtórzyła mój gest, a potem zdumiała mnie, naśladując odgłos grzmotu."
    en: "“As they made no effort to communicate with me, but simply stood round me smiling and speaking in soft cooing notes to each other, I began the conversation. I pointed to the Time Machine and to myself. Then, hesitating for a moment how to express Time, I pointed to the sun. At once a quaintly pretty little figure in chequered purple and white followed my gesture, and then astonished me by imitating the sound of thunder."
    draft: true
    chunks:
      - pl: "Ponieważ nie czynili żadnych wysiłków, by się ze mną porozumieć, tylko stali wokół, uśmiechając się i gruchając do siebie miękkimi głosami,"
        ru: "Так как они не делали никаких попыток объясниться со мной, а просто стояли вокруг, улыбаясь и воркуя друг с другом нежными голосами,"
        note: "gruchać — ворковать"
      - pl: " zacząłem rozmowę sam."
        ru: "я начал разговор сам."
      - pl: " Wskazałem na Wehikuł Czasu i na siebie."
        ru: "Я показал на Машину Времени и на себя."
      - pl: " Potem, wahając się przez chwilę, jak wyrazić Czas, wskazałem na słońce."
        ru: "Потом, помедлив, как выразить Время, показал на солнце."
      - pl: " Natychmiast śliczna, dziwaczna figurka w purpurowo-białą kratkę powtórzyła mój gest,"
        ru: "Тотчас же причудливая хорошенькая фигурка в пурпурно-белую клетку повторила мой жест,"
        note: "w kratkę — в клетку"
      - pl: " a potem zdumiała mnie, naśladując odgłos grzmotu."
