    words: { "miękkimi": miekki, "wahając": wahac, "dziwaczna": dziwaczny, "kratkę": kratka, "gest": gest, "odgłos": odglos }
  - clean: "Przez chwilę byłem oszołomiony, choć znaczenie jego gestu było dość jasne. W głowie nagle pojawiło mi się pytanie: czy te stworzenia są głupcami? Trudno wam chyba zrozumieć, jak mnie to dotknęło. Widzicie, zawsze oczekiwałem, że ludzie roku ośmiuset dwóch tysięcy z okładem będą nieprawdopodobnie wyprzedzać nas w wiedzy, sztuce, we wszystkim. A tu jeden z nich nagle zadał mi pytanie, które dowodziło, że jest na poziomie umysłowym naszego pięcioletniego dziecka — zapytał mnie mianowicie, czy przybyłem ze słońca w czasie burzy!"
    en: "“For a moment I was staggered, though the import of his gesture was plain enough. The question had come into my mind abruptly: were these creatures fools? You may hardly understand how it took me. You see, I had always anticipated that the people of the year Eight Hundred and Two Thousand odd would be incredibly in front of us in knowledge, art, everything. Then one of them suddenly asked me a question that showed him to be on the intellectual level of one of our five-year-old children—asked me, in fact, if I had come from the sun in a thunderstorm!"
    draft: true
    chunks:
      - pl: "Przez chwilę byłem oszołomiony, choć znaczenie jego gestu było dość jasne."
        ru: "На мгновение я опешил, хотя смысл его жеста был достаточно ясен."
      - pl: " W głowie nagle pojawiło mi się pytanie: czy te stworzenia są głupcami?"
        ru: "В голове у меня вдруг возник вопрос: уж не глупцы ли эти создания?"
      - pl: " Trudno wam chyba zrozumieć, jak mnie to dotknęło."
        ru: "Вам, наверное, трудно понять, как это меня задело."
      - pl: " Widzicie, zawsze oczekiwałem, że ludzie roku ośmiuset dwóch tysięcy z okładem będą nieprawdopodobnie wyprzedzać nas w wiedzy, sztuce, we wszystkim."
        ru: "Видите ли, я всегда ожидал, что люди года восемьсот две тысячи с лишним будут невероятно опережать нас в знаниях, искусстве, во всём."
        note: "z okładem — с лишним; речь о 802 000-м годе"
      - pl: " A tu jeden z nich nagle zadał mi pytanie, które dowodziło, że jest na poziomie umysłowym naszego pięcioletniego dziecka —"
        ru: "А тут один из них вдруг задал мне вопрос, который показал, что он на умственном уровне нашего пятилетнего ребёнка, —"
      - pl: " zapytał mnie mianowicie, czy przybyłem ze słońca w czasie burzy!"
        ru: "он спросил меня, ни много ни мало, не прибыл ли я с солнца во время грозы!"
    words: { "gestu": gest, "głupcami": glupiec, "Trudno": trudno, "wiedzy": wiedza, "dowodziło": dowodzic, "burzy": burza }
  - clean: "To uwolniło osąd, który dotąd wstrzymywałem w sprawie ich ubrań, kruchych, lekkich członków i delikatnych rysów. Przez mój umysł przetoczyła się fala rozczarowania. Przez chwilę czułem, że na próżno zbudowałem Wehikuł Czasu."
    en: "It let loose the judgment I had suspended upon their clothes, their frail light limbs, and fragile features. A flow of disappointment rushed across my mind. For a moment I felt that I had built the Time Machine in vain."
    draft: true
    chunks:
      - pl: "To uwolniło osąd, który dotąd wstrzymywałem w sprawie ich ubrań, kruchych, lekkich członków i delikatnych rysów."
        ru: "Это развязало суждение, которое я до сих пор откладывал, об их одежде, хрупких лёгких членах и тонких чертах."
        note: "osąd — суждение"
      - pl: " Przez mój umysł przetoczyła się fala rozczarowania."
        ru: "По моему сознанию прокатилась волна разочарования."
        note: "rozczarowanie — разочарование"
      - pl: " Przez chwilę czułem, że na próżno zbudowałem Wehikuł Czasu."
        ru: "На миг мне показалось, что я напрасно построил Машину Времени."
        note: "na próżno — напрасно"
    words: { "dotąd": dotad, "ubrań": ubranie, "delikatnych": delikatny, "fala": fala, "próżno": prozno }
  - clean: "Skinąłem głową, wskazałem na słońce i przedstawiłem im tak żywo uderzenie pioruna, że aż się przestraszyli. Wszyscy cofnęli się o krok czy dwa i się ukłonili. Potem jeden podszedł do mnie ze śmiechem, niosąc łańcuch z pięknych, zupełnie mi nieznanych kwiatów, i zawiesił mi go na szyi. Pomysł przyjęto melodyjnymi oklaskami; i wkrótce wszyscy biegali tam i z powrotem po kwiaty i ze śmiechem obrzucali mnie nimi, aż niemal utonąłem w kwieciu. Wy, którzy nigdy nie widzieliście czegoś podobnego, ledwie możecie sobie wyobrazić, jakie delikatne i cudowne kwiaty stworzyły niezliczone lata uprawy."
    en: "“I nodded, pointed to the sun, and gave them such a vivid rendering of a thunderclap as startled them. They all withdrew a pace or so and bowed. Then came one laughing towards me, carrying a chain of beautiful flowers altogether new to me, and put it about my neck. The idea was received with melodious applause; and presently they were all running to and fro for flowers, and laughingly flinging them upon me until I was almost smothered with blossom. You who have never seen the like can scarcely imagine what delicate and wonderful flowers countless years of culture had created."
    draft: true
    chunks:
      - pl: "Skinąłem głową, wskazałem na słońce i przedstawiłem im tak żywo uderzenie pioruna, że aż się przestraszyli."
        ru: "Я кивнул, показал на солнце и так живо изобразил им удар грома, что они испугались."
      - pl: " Wszyscy cofnęli się o krok czy dwa i się ukłonili."
        ru: "Все отступили на шаг-другой и поклонились."
      - pl: " Potem jeden podszedł do mnie ze śmiechem, niosąc łańcuch z pięknych, zupełnie mi nieznanych kwiatów, i zawiesił mi go na szyi."
        ru: "Потом один подошёл ко мне, смеясь, с гирляндой красивых, совершенно незнакомых мне цветов и повесил её мне на шею."
      - pl: " Pomysł przyjęto melodyjnymi oklaskami;"
        ru: "Эту мысль встретили мелодичными рукоплесканиями;"
        note: "oklaski — аплодисменты"
      - pl: " i wkrótce wszyscy biegali tam i z powrotem po kwiaty i ze śmiechem obrzucali mnie nimi, aż niemal utonąłem w kwieciu."
        ru: "и вскоре все бегали туда-сюда за цветами и со смехом забрасывали меня ими, пока я чуть не утонул в цветах."
        note: "kwiecie — цветы (собир.)"
      - pl: " Wy, którzy nigdy nie widzieliście czegoś podobnego, ledwie możecie sobie wyobrazić, jakie delikatne i cudowne kwiaty stworzyły niezliczone lata uprawy."
        ru: "Вы, никогда не видевшие ничего подобного, едва ли можете вообразить, какие нежные и чудесные цветы создали бесчисленные годы возделывания."
