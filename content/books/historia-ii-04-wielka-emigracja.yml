        note: "wywrzeć wrażenie — произвести впечатление"
      - pl: " Jej akcja dzieje się w Wilnie w czasie procesu filomatów, a bohaterem jest więzień Konrad, który w słynnej Wielkiej Improwizacji wyzywa samego Boga, oskarżając go o obojętność na cierpienie narodu."
        ru: "Её действие происходит в Вильно во время процесса филоматов, а героем является узник Конрад, который в знаменитой «Великой импровизации» бросает вызов самому Богу, обвиняя его в равнодушии к страданиям народа."
        note: "wyzywać — бросать вызов; obojętność — равнодушие"
      - pl: " Dramat zawierał także przejmujące sceny zsyłki młodzieży na Syberię i portret senatora Nowosilcowa jako okrutnego prześladowcy."
        ru: "Драма содержала и пронзительные сцены ссылки молодёжи в Сибирь, и портрет сенатора Новосильцева как жестокого гонителя."
        note: "przejmujący — пронзительный; prześladowca — гонитель"
