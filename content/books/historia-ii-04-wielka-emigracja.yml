  - clean: "Także w Królestwie, mimo nocy paskiewiczowskiej, życie nie zamarło. W 1833 roku otwarto w Warszawie gmach Teatru Wielkiego, w którym wystawiano opery, balety i dramaty. W latach czterdziestych zbudowano pierwszą w Królestwie kolej żelazną, łączącą Warszawę z Wiedniem. Młodzi pisarze i artyści, nazywani cyganerią warszawską, spotykali się w kawiarniach, pisali wiersze i marzyli o wolności, choć za głośne słowa groziło więzienie. Kompozytor Stanisław Moniuszko pisał pieśni do słów polskich poetów, które śpiewano w domach w całym kraju. Jego opera „Halka”, opowiadająca o tragicznej miłości wiejskiej dziewczyny do szlachcica, uważana jest za polską operę narodową. Pierwszy raz wystawiono ją w Wilnie, a dziesięć lat później w Warszawie, gdzie odniosła ogromny sukces."
