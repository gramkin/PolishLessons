  - clean: "Emigracja podzieliła się na kilka obozów politycznych. Obóz konserwatywny skupiał się wokół księcia Adama Czartoryskiego, którego zwolennicy uważali za nieformalnego króla Polski na wygnaniu. Od 1843 roku jego siedzibą był piękny pałac na wyspie Świętego Ludwika w Paryżu, Hôtel Lambert, i od tej nazwy cały obóz nazywano Hotelem Lambert. Czartoryski liczył przede wszystkim na dyplomację: na to, że mocarstwa zachodnie w czasie przyszłego konfliktu z Rosją upomną się o Polskę. Jego agenci działali w Turcji, na Bałkanach, w Anglii i we Francji, a w salonach Hotelu Lambert urządzano bale, z których dochód przeznaczano na pomoc dla biednych emigrantów. Na tych balach grywał czasem sam Chopin."
    draft: true
    chunks:
      - pl: "Emigracja podzieliła się na kilka obozów politycznych."
        ru: "Эмиграция разделилась на несколько политических лагерей."
      - pl: " Obóz konserwatywny skupiał się wokół księcia Adama Czartoryskiego, którego zwolennicy uważali za nieformalnego króla Polski na wygnaniu."
        ru: "Консервативный лагерь объединялся вокруг князя Адама Чарторыйского, которого сторонники считали неофициальным королём Польши в изгнании."
        note: "nieformalny — неофициальный"
      - pl: " Od 1843 roku jego siedzibą był piękny pałac na wyspie Świętego Ludwika w Paryżu, Hôtel Lambert, i od tej nazwy cały obóz nazywano Hotelem Lambert."
        ru: "С 1843 года его резиденцией был красивый дворец на острове Сен-Луи в Париже, Отель Ламбер, и по этому названию весь лагерь называли «Отель Ламбер»."
      - pl: " Czartoryski liczył przede wszystkim na dyplomację: na to, że mocarstwa zachodnie w czasie przyszłego konfliktu z Rosją upomną się o Polskę."
        ru: "Чарторыйский рассчитывал прежде всего на дипломатию: на то, что западные державы во время будущего конфликта с Россией вступятся за Польшу."
        note: "upomnieć się — вступиться"
      - pl: " Jego agenci działali w Turcji, na Bałkanach, w Anglii i we Francji, a w salonach Hotelu Lambert urządzano bale, z których dochód przeznaczano na pomoc dla biednych emigrantów."
        ru: "Его агенты действовали в Турции, на Балканах, в Англии и во Франции, а в салонах «Отеля Ламбер» устраивали балы, доход от которых шёл на помощь бедным эмигрантам."
      - pl: " Na tych balach grywał czasem sam Chopin."
        ru: "На этих балах иногда играл сам Шопен."
