      - pl: " W 1832 roku powstało Towarzystwo Demokratyczne Polskie, które w ogłoszonym kilka lat później manifeście żądało zniesienia pańszczyzny, uwłaszczenia chłopów i równości wszystkich obywateli."
        ru: "В 1832 году было основано Польское демократическое общество, которое в манифесте, обнародованном несколько лет спустя, требовало отмены барщины, наделения крестьян землёй и равенства всех граждан."
      - pl: " Demokraci uważali, że powstanie listopadowe upadło, bo było sprawą szlachty, i że następne musi być powstaniem całego ludu."
        ru: "Демократы считали, что Ноябрьское восстание пало, потому что было делом шляхты, и что следующее должно стать восстанием всего народа."
      - pl: " Wysyłali do kraju emisariuszy, którzy tworzyli tajne organizacje i przygotowywali nowe powstanie."
        ru: "Они посылали на родину эмиссаров, которые создавали тайные организации и готовили новое восстание."
      - pl: " Jeszcze bardziej radykalni byli żołnierze, którzy osiedlili się w Anglii i założyli Gromady Ludu Polskiego."
        ru: "Ещё радикальнее были солдаты, осевшие в Англии и основавшие «Громады польского народа»."
