  - clean: "Jeszcze większe wrażenie wywarła trzecia część dramatu „Dziady”, napisana w Dreźnie w 1832 roku. Jej akcja dzieje się w Wilnie w czasie procesu filomatów, a bohaterem jest więzień Konrad, który w słynnej Wielkiej Improwizacji wyzywa samego Boga, oskarżając go o obojętność na cierpienie narodu. Dramat zawierał także przejmujące sceny zsyłki młodzieży na Syberię i portret senatora Nowosilcowa jako okrutnego prześladowcy. W dodatku do „Dziadów” Mickiewicz opisał Petersburg, cara i Rosję, a także swoje rosyjskie przyjaźnie. „Dziady” stały się jednym z najważniejszych dzieł polskiej literatury, a ich wystawienie w teatrze było zawsze wydarzeniem politycznym. W 1968 roku zakaz wystawiania „Dziadów” w Warszawie wywołał protesty studenckie, o których opowiemy w jednym z ostatnich rozdziałów."
    draft: true
    chunks:
