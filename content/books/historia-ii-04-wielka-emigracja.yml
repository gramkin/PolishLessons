paragraphs:
  - clean: "Po upadku powstania listopadowego kraj opuściło około dziesięciu tysięcy ludzi. Byli wśród nich oficerowie i żołnierze, posłowie i ministrowie, pisarze, artyści, księża i studenci. Większość przeszła przez Niemcy do Francji, gdzie rząd przyznał im skromne zasiłki. Władze francuskie obawiały się jednak tak dużej grupy rewolucjonistów i rozmieściły ich w zakładach na prowincji, z dala od Paryża. Wielu i tak przedostało się do stolicy, która stała się centrum polskiego życia politycznego i kulturalnego na całe dziesięciolecia. Emigrację tę nazwano Wielką nie tylko z powodu jej liczebności, ale przede wszystkim dlatego, że należeli do niej najwybitniejsi ludzie epoki."
    draft: true
    chunks:
      - pl: "Po upadku powstania listopadowego kraj opuściło około dziesięciu tysięcy ludzi."
        ru: "После падения Ноябрьского восстания страну покинули около десяти тысяч человек."
      - pl: " Byli wśród nich oficerowie i żołnierze, posłowie i ministrowie, pisarze, artyści, księża i studenci."
        ru: "Среди них были офицеры и солдаты, послы и министры, писатели, художники, священники и студенты."
      - pl: " Większość przeszła przez Niemcy do Francji, gdzie rząd przyznał im skromne zasiłki."
        ru: "Большинство прошло через Германию во Францию, где правительство назначило им скромные пособия."
        note: "zasiłek — пособие"
      - pl: " Władze francuskie obawiały się jednak tak dużej grupy rewolucjonistów i rozmieściły ich w zakładach na prowincji, z dala od Paryża."
        ru: "Однако французские власти опасались столь большой группы революционеров и разместили их в депо в провинции, подальше от Парижа."
        note: "zakład — здесь «депо, лагерь»"
      - pl: " Wielu i tak przedostało się do stolicy, która stała się centrum polskiego życia politycznego i kulturalnego na całe dziesięciolecia."
        ru: "Многие всё равно перебрались в столицу, которая стала центром польской политической и культурной жизни на целые десятилетия."
        note: "przedostać się — пробраться"
      - pl: " Emigrację tę nazwano Wielką nie tylko z powodu jej liczebności, ale przede wszystkim dlatego, że należeli do niej najwybitniejsi ludzie epoki."
        ru: "Эту эмиграцию назвали Великой не только из-за её численности, но прежде всего потому, что к ней принадлежали самые выдающиеся люди эпохи."
