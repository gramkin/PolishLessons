  - clean: "Obóz demokratyczny był liczniejszy i bardziej radykalny. W 1832 roku powstało Towarzystwo Demokratyczne Polskie, które w ogłoszonym kilka lat później manifeście żądało zniesienia pańszczyzny, uwłaszczenia chłopów i równości wszystkich obywateli. Demokraci uważali, że powstanie listopadowe upadło, bo było sprawą szlachty, i że następne musi być powstaniem całego ludu. Wysyłali do kraju emisariuszy, którzy tworzyli tajne organizacje i przygotowywali nowe powstanie. Jeszcze bardziej radykalni byli żołnierze, którzy osiedlili się w Anglii i założyli Gromady Ludu Polskiego. Głosili oni idee bliskie socjalizmowi: wspólną własność ziemi i zniesienie podziałów społecznych."
    draft: true
    chunks:
      - pl: "Obóz demokratyczny był liczniejszy i bardziej radykalny."
