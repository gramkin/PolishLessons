  - clean: "Trzecim wielkim poetą emigracji był Zygmunt Krasiński, syn generała, który za życia był wierny carowi. Ze względu na ojca publikował swoje dzieła anonimowo. W dramacie „Nie-Boska komedia” opisał straszną wizję przyszłej rewolucji społecznej, w której lud niszczy arystokrację, ale sam też nie potrafi zbudować sprawiedliwego świata. Mickiewicza, Słowackiego i Krasińskiego nazywa się w Polsce wieszczami, czyli poetami-prorokami, którzy w czasach niewoli byli duchowymi przewodnikami narodu. Czasem do tej trójki dodaje się czwartego, Cypriana Kamila Norwida, który zmarł w zapomnieniu i nędzy w przytułku pod Paryżem, a jego genialną poezję odkryto dopiero w XX wieku."
