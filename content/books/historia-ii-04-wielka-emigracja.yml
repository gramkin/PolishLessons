  - clean: "Emigranci uważali się za naród na wygnaniu, który ma prawo i obowiązek mówić w imieniu zniewolonego kraju. Wierzyli, że ich pobyt za granicą jest tymczasowy i że wkrótce wrócą do wolnej ojczyzny. Nazywali siebie pielgrzymami, a nie emigrantami, bo pielgrzym zawsze wraca do domu. Większość z nich nigdy już nie zobaczyła kraju. Wielu założyło rodziny we Francji, a ich dzieci i wnuki stały się już Francuzami, zachowując tylko polskie nazwiska. Żyli w biedzie, utrzymując się z zasiłków, lekcji, tłumaczeń i drobnej pracy, i spędzali lata na sporach o przyczyny klęski i o przyszłość Polski. Spory te były często gorzkie i bezlitosne, ale wypracowano w nich programy polityczne, które przez wiele lat kształtowały myśl polską."
    draft: true
    chunks:
      - pl: "Emigranci uważali się za naród na wygnaniu, który ma prawo i obowiązek mówić w imieniu zniewolonego kraju."
        ru: "Эмигранты считали себя народом в изгнании, который вправе и обязан говорить от имени порабощённой страны."
        note: "zniewolony — порабощённый"
      - pl: " Wierzyli, że ich pobyt za granicą jest tymczasowy i że wkrótce wrócą do wolnej ojczyzny."
        ru: "Они верили, что их пребывание за границей временно и что скоро они вернутся на свободную родину."
      - pl: " Nazywali siebie pielgrzymami, a nie emigrantami, bo pielgrzym zawsze wraca do domu."
        ru: "Они называли себя пилигримами, а не эмигрантами, потому что пилигрим всегда возвращается домой."
        note: "pielgrzym — пилигрим, паломник"
      - pl: " Większość z nich nigdy już nie zobaczyła kraju."
        ru: "Большинство из них так и не увидели родины."
      - pl: " Wielu założyło rodziny we Francji, a ich dzieci i wnuki stały się już Francuzami, zachowując tylko polskie nazwiska."
        ru: "Многие создали семьи во Франции, и их дети и внуки стали уже французами, сохранив лишь польские фамилии."
      - pl: " Żyli w biedzie, utrzymując się z zasiłków, lekcji, tłumaczeń i drobnej pracy, i spędzali lata na sporach o przyczyny klęski i o przyszłość Polski."
        ru: "Они жили в бедности, перебиваясь пособиями, уроками, переводами и мелкой работой, и проводили годы в спорах о причинах поражения и о будущем Польши."
      - pl: " Spory te były często gorzkie i bezlitosne, ale wypracowano w nich programy polityczne, które przez wiele lat kształtowały myśl polską."
        ru: "Эти споры были часто горькими и беспощадными, но в них были выработаны политические программы, на многие годы определившие польскую мысль."
        note: "bezlitosny — беспощадный; wypracować — выработать"
