  - clean: "W 1840 roku Mickiewicz otrzymał w Paryżu katedrę literatury słowiańskiej w prestiżowym Collège de France. Jego wykłady o literaturze polskiej, rosyjskiej, czeskiej i serbskiej przyciągały tłumy słuchaczy. Z czasem jednak poeta zbliżył się do mistyka Andrzeja Towiańskiego, który głosił własną, dziwną naukę religijną, i zamiast o literaturze zaczął mówić na wykładach o mistycznych objawieniach. Władze odebrały mu katedrę. Życie prywatne poety było trudne. Ożenił się z Celiną Szymanowską, córką słynnej pianistki, i miał z nią sześcioro dzieci, ale rodzina żyła w biedzie, a żona przez lata cierpiała na ciężką chorobę psychiczną. Zmarła w 1855 roku, kilka miesięcy przed mężem. W 1848 roku, w czasie Wiosny Ludów, Mickiewicz zorganizował we Włoszech mały Legion Polski, który walczył o wolność Włoch. Zmarł w 1855 roku w Konstantynopolu, dokąd pojechał, żeby tworzyć polskie wojsko do walki z Rosją w czasie wojny krymskiej."
