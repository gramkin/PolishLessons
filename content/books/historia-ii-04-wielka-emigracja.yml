  - clean: "Najsłynniejszym emigrantem był Adam Mickiewicz. W czasie powstania był za granicą, w Rzymie i Dreźnie, i do końca życia czuł się winny, że nie walczył razem z rodakami. Próbował dostać się do Królestwa, ale dotarł tylko do Wielkopolski, kiedy było już po wszystkim. Do Paryża przyjechał w 1832 roku i stał się duchowym przywódcą emigracji. W tym samym roku wydał „Księgi narodu polskiego i pielgrzymstwa polskiego”, napisane biblijnym stylem. Przedstawił w nich Polskę jako Chrystusa narodów, który cierpi za grzechy świata, umiera i zmartwychwstanie, a jego zmartwychwstanie przyniesie wolność wszystkim ludom. Tę wiarę w szczególną misję Polski nazwano mesjanizmem."
    draft: true
    chunks:
      - pl: "Najsłynniejszym emigrantem był Adam Mickiewicz."
        ru: "Самым знаменитым эмигрантом был Адам Мицкевич."
      - pl: " W czasie powstania był za granicą, w Rzymie i Dreźnie, i do końca życia czuł się winny, że nie walczył razem z rodakami."
        ru: "Во время восстания он был за границей, в Риме и Дрездене, и до конца жизни чувствовал себя виноватым, что не сражался вместе с соотечественниками."
      - pl: " Próbował dostać się do Królestwa, ale dotarł tylko do Wielkopolski, kiedy było już po wszystkim."
        ru: "Он пытался пробраться в Королевство, но добрался лишь до Великой Польши, когда всё уже было кончено."
      - pl: " Do Paryża przyjechał w 1832 roku i stał się duchowym przywódcą emigracji."
        ru: "В Париж он приехал в 1832 году и стал духовным вождём эмиграции."
      - pl: " W tym samym roku wydał „Księgi narodu polskiego i pielgrzymstwa polskiego”, napisane biblijnym stylem."
        ru: "В том же году он издал «Книги польского народа и польского пилигримства», написанные библейским слогом."
      - pl: " Przedstawił w nich Polskę jako Chrystusa narodów, który cierpi za grzechy świata, umiera i zmartwychwstanie, a jego zmartwychwstanie przyniesie wolność wszystkim ludom."
        ru: "Он изобразил в них Польшу как Христа народов, который страдает за грехи мира, умирает и воскреснет, а его воскресение принесёт свободу всем народам."
