  - clean: "Rywalem Mickiewicza był młodszy od niego o dziesięć lat Juliusz Słowacki. Urodził się w Krzemieńcu na Wołyniu i jako młody urzędnik wyjechał z Warszawy w czasie powstania, nigdy już do kraju nie wracając. Był dumny, wrażliwy, ironiczny i źle znosił to, że wszyscy uważali Mickiewicza za największego poetę. W dramacie „Kordian” odpowiedział na „Dziady”: jego bohater, młody arystokrata, postanawia zabić cara w czasie koronacji w Warszawie, ale w decydującej chwili ogarniają go strach i wyobraźnia i mdleje przed drzwiami carskiej sypialni. Słowacki pokazał w ten sposób, że romantyczny bohater, pełen wielkich słów, może być bezsilny wobec rzeczywistości. Pisał też baśniowe dramaty, jak „Balladyna”, liryki pełne tęsknoty i poemat „Testament mój”, w którym wzywał następne pokolenia, by nie traciły nadziei."
