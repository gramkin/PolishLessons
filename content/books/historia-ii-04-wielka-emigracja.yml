  - clean: "Większość ludzi Wielkiej Emigracji zmarła na obczyźnie. Wiele ich grobów, na cmentarzu Montmorency pod Paryżem i na innych cmentarzach Francji, odwiedzają dziś polscy turyści. Niektórzy wrócili do kraju dopiero po śmierci. Prochy Mickiewicza przewieziono na Wawel w 1890 roku, kiedy Kraków był pod władzą Austrii, a uroczystość pogrzebowa zamieniła się w wielką manifestację patriotyczną. W 2001 roku do krypty wieszczów na Wawelu złożono urnę z ziemią ze zbiorowej mogiły, w której pochowano Norwida. Tak symbolicznie zakończyła się historia emigracji, która przez dziesiątki lat była sercem i sumieniem narodu bez państwa."
