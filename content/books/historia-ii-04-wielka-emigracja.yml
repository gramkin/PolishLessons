  - clean: "Osobną postacią był historyk Joachim Lelewel, dawny profesor uniwersytetu w Wilnie i jeden z przywódców powstania. Wygnany z Francji, osiadł w Brukseli, gdzie żył w ogromnej biedzie, w małym pokoiku, i przez ponad dwadzieścia lat pisał książki o historii Polski. Był przekonany, że dawna Polska była w gruncie rzeczy republiką ludową, którą zniszczyli magnaci i obcy. W Brukseli poznał Karola Marksa i był przez pewien czas członkiem tego samego stowarzyszenia demokratycznego. Lelewel zmarł w 1861 roku we Francji, a jego prochy przewieziono później do Wilna, miasta jego młodości."
