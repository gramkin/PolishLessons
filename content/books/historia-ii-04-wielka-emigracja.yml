  - clean: "Między emigracją a krajem istniało jednak napięcie. Emigranci uważali, że tylko oni mogą swobodnie mówić w imieniu narodu, i czasem patrzyli z góry na tych, którzy zostali i musieli żyć pod władzą zaborców. Ludzie w kraju zarzucali z kolei emigrantom, że nie znają realiów i wysyłają młodzież na pewną śmierć w beznadziejnych spiskach. Ten spór między emigracją a krajem miał powracać w polskiej historii jeszcze wiele razy, aż do czasów komunizmu."
