  - clean: "— Jestem go zupełnie pewien — odparł Jekyll; — mam podstawy do tej pewności, których z nikim nie mogę dzielić. Ale jest jedna rzecz, w której możesz mi doradzić. Ja… dostałem list; i nie wiem, czy powinienem pokazać go policji. Chciałbym zostawić go w twoich rękach, Uttersonie; ocenisz to mądrze, jestem pewien; tak bardzo ci ufam."
    en: "“I am quite sure of him,” replied Jekyll; “I have grounds for certainty that I cannot share with any one. But there is one thing on which you may advise me. I have—I have received a letter; and I am at a loss whether I should show it to the police. I should like to leave it in your hands, Utterson; you would judge wisely, I am sure; I have so great a trust in you.”"
    draft: true
    chunks:
