  - clean: "Adwokat słuchał posępnie; nie podobało mu się gorączkowe zachowanie przyjaciela. — Wydajesz się go dość pewien — rzekł — i ze względu na ciebie mam nadzieję, że masz rację. Gdyby doszło do procesu, mogłoby paść twoje nazwisko."
