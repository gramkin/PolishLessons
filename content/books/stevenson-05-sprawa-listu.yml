  - clean: "W drugim końcu schody prowadziły do drzwi obitych czerwonym suknem; i przez nie pan Utterson został wreszcie wpuszczony do gabinetu doktora. Był to duży pokój, wokół zastawiony oszklonymi szafami, umeblowany między innymi lustrem na stojaku i biurkiem, z trzema zakurzonymi, okratowanymi oknami wychodzącymi na podwórze. W kominku płonął ogień; na gzymsie kominka stała zapalona lampa, bo nawet w domach mgła zaczynała gęstnieć; i tam, tuż przy cieple, siedział doktor Jekyll, wyglądając na śmiertelnie chorego. Nie wstał na powitanie gościa, lecz wyciągnął zimną rękę i przywitał go zmienionym głosem."
    en: "At the further end, a flight of stairs mounted to a door covered with red baize; and through this, Mr. Utterson was at last received into the doctor’s cabinet. It was a large room fitted round with glass presses, furnished, among other things, with a cheval-glass and a business table, and looking out upon the court by three dusty windows barred with iron. The fire burned in the grate; a lamp was set lighted on the chimney shelf, for even in the houses the fog began to lie thickly; and there, close up to the warmth, sat Dr. Jekyll, looking deathly sick. He did not rise to meet his visitor, but held out a cold hand and bade him welcome in a changed voice."
    draft: true
    chunks:
