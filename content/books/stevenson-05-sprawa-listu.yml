  - clean: "— Uttersonie, przysięgam na Boga — zawołał doktor — przysięgam na Boga, że nigdy więcej go nie zobaczę. Ręczę ci honorem, że skończyłem z nim na tym świecie. Wszystko skończone. Zresztą on nie potrzebuje mojej pomocy; nie znasz go tak jak ja; jest bezpieczny, zupełnie bezpieczny; zapamiętaj moje słowa, nikt już nigdy o nim nie usłyszy."
    en: "“Utterson, I swear to God,” cried the doctor, “I swear to God I will never set eyes on him again. I bind my honour to you that I am done with him in this world. It is all at an end. And indeed he does not want my help; you do not know him as I do; he is safe, he is quite safe; mark my words, he will never more be heard of.”"
