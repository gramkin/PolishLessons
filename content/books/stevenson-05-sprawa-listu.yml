paragraphs:
  - clean: "Było już późne popołudnie, gdy pan Utterson dotarł do drzwi doktora Jekylla, gdzie natychmiast wpuścił go Poole i poprowadził przez kuchenne zabudowania i przez podwórze, które niegdyś było ogrodem, do budynku nazywanego bez różnicy laboratorium albo salą sekcyjną. Doktor kupił dom od spadkobierców słynnego chirurga; a ponieważ jego upodobania były raczej chemiczne niż anatomiczne, zmienił przeznaczenie budynku w głębi ogrodu. Adwokat po raz pierwszy był przyjmowany w tej części posiadłości przyjaciela; przyglądał się z ciekawością obskurnej budowli bez okien i rozglądał się z niemiłym poczuciem obcości, przechodząc przez salę wykładową, niegdyś pełną gorliwych studentów, a teraz pustą i cichą, ze stołami zastawionymi aparaturą chemiczną, z podłogą zasłaną skrzyniami i zaśmieconą słomą do pakowania i ze światłem padającym mętnie przez zamgloną kopułę."
    en: "It was late in the afternoon, when Mr. Utterson found his way to Dr. Jekyll’s door, where he was at once admitted by Poole, and carried down by the kitchen offices and across a yard which had once been a garden, to the building which was indifferently known as the laboratory or dissecting rooms. The doctor had bought the house from the heirs of a celebrated surgeon; and his own tastes being rather chemical than anatomical, had changed the destination of the block at the bottom of the garden. It was the first time that the lawyer had been received in that part of his friend’s quarters; and he eyed the dingy, windowless structure with curiosity, and gazed round with a distasteful sense of strangeness as he crossed the theatre, once crowded with eager students and now lying gaunt and silent, the tables laden with chemical apparatus, the floor strewn with crates and littered with packing straw, and the light falling dimly through the foggy cupola."
    draft: true
    chunks:
