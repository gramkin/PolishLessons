  - clean: "List był napisany dziwnym, pionowym pismem i podpisany „Edward Hyde”; oznajmiał dość zwięźle, że dobroczyńca piszącego, doktor Jekyll, któremu ten od dawna tak niegodnie odpłacał za tysiąc szczodrości, nie musi się wcale niepokoić o jego bezpieczeństwo, gdyż ma on sposób ucieczki, na którym może pewnie polegać. Adwokatowi list ten dość się spodobał; przedstawiał tę zażyłość w lepszym świetle, niż się spodziewał; i robił sobie wyrzuty z powodu niektórych dawnych podejrzeń."
    en: "The letter was written in an odd, upright hand and signed “Edward Hyde”: and it signified, briefly enough, that the writer’s benefactor, Dr. Jekyll, whom he had long so unworthily repaid for a thousand generosities, need labour under no alarm for his safety, as he had means of escape on which he placed a sure dependence. The lawyer liked this letter well enough; it put a better colour on the intimacy than he had looked for; and he blamed himself for some of his past suspicions."
    draft: true
    chunks:
      - pl: "List był napisany dziwnym, pionowym pismem i podpisany „Edward Hyde”;"
        ru: "Письмо было написано странным, прямым почерком и подписано «Эдвард Хайд»;"
        note: "pismo — почерк (здесь)"
      - pl: " oznajmiał dość zwięźle, że dobroczyńca piszącego, doktor Jekyll,"
        ru: "в нём довольно коротко сообщалось, что благодетель пишущего, доктор Джекил,"
        note: "zwięźle — кратко"
      - pl: " któremu ten od dawna tak niegodnie odpłacał za tysiąc szczodrości,"
