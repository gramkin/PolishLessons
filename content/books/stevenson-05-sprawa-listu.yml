      - pl: " a ponieważ jego upodobania były raczej chemiczne niż anatomiczne,"
        ru: "а поскольку его вкусы были скорее химические, чем анатомические,"
      - pl: " zmienił przeznaczenie budynku w głębi ogrodu."
        ru: "он изменил назначение постройки в глубине сада."
