  - clean: "Najbardziej osobistym i najbardziej poruszającym dziełem Kochanowskiego są „Treny”. W 1579 roku zmarła jego ukochana córeczka Urszula, która miała niespełna trzy lata. Zrozpaczony ojciec napisał dziewiętnaście trenów, czyli żałobnych wierszy. Do tej pory w poezji opłakiwano tylko wielkich ludzi: królów, bohaterów, uczonych. Kochanowski opłakiwał małe dziecko i była to wielka nowość. W „Trenach” poeta, który całe życie wierzył w rozum, ład świata i boską opiekę, nagle traci tę pewność i pyta, czy życie ma jakikolwiek sens. Na końcu odnajduje spokój, ale nie jest to już spokój dawny, tylko spokój człowieka, który wiele przeszedł. Polskie dzieci w szkole do dziś uczą się „Trenów” i wielu z nich zna na pamięć ich pierwsze wersy."
