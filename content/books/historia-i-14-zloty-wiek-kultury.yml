paragraphs:
  - clean: "Zimą 1491 roku na Akademię Krakowską zapisał się osiemnastoletni student z Torunia, Mikołaj Kopernik. Urodził się 19 lutego 1473 roku w rodzinie bogatego kupca. Ojciec zmarł wcześnie, a chłopcem zaopiekował się wuj, Łukasz Watzenrode, późniejszy biskup warmiński. W Krakowie Kopernik słuchał wykładów z astronomii i matematyki, które słynęły wtedy w całej Europie. Potem studiował we Włoszech: prawo w Bolonii, medycynę w Padwie, a doktorat z prawa kanonicznego uzyskał w Ferrarze. Był człowiekiem renesansu w pełnym tego słowa znaczeniu: lekarzem, prawnikiem, ekonomistą, tłumaczem, administratorem i żołnierzem."
    draft: true
    chunks:
      - pl: "Zimą 1491 roku na Akademię Krakowską zapisał się osiemnastoletni student z Torunia, Mikołaj Kopernik."
        ru: "Зимой 1491 года в Краковскую академию записался восемнадцатилетний студент из Торуни, Николай Коперник."
        note: "zapisać się — записаться, поступить"
      - pl: " Urodził się 19 lutego 1473 roku w rodzinie bogatego kupca."
        ru: "Он родился 19 февраля 1473 года в семье богатого купца."
      - pl: " Ojciec zmarł wcześnie, a chłopcem zaopiekował się wuj, Łukasz Watzenrode, późniejszy biskup warmiński."
        ru: "Отец умер рано, и о мальчике позаботился дядя по матери, Лукаш Ватценроде, впоследствии вармийский епископ."
        note: "wuj — дядя по матери; zaopiekować się — позаботиться"
      - pl: " W Krakowie Kopernik słuchał wykładów z astronomii i matematyki, które słynęły wtedy w całej Europie."
        ru: "В Кракове Коперник слушал лекции по астрономии и математике, славившиеся тогда на всю Европу."
      - pl: " Potem studiował we Włoszech: prawo w Bolonii, medycynę w Padwie, a doktorat z prawa kanonicznego uzyskał w Ferrarze."
        ru: "Затем он учился в Италии: право — в Болонье, медицину — в Падуе, а степень доктора канонического права получил в Ферраре."
        note: "prawo kanoniczne — каноническое право"
      - pl: " Był człowiekiem renesansu w pełnym tego słowa znaczeniu: lekarzem, prawnikiem, ekonomistą, tłumaczem, administratorem i żołnierzem."
        ru: "Он был человеком Ренессанса в полном смысле слова: врачом, юристом, экономистом, переводчиком, администратором и воином."
    words: { "Zimą": zima, "zapisał": zapisac, "student": student, "lutego": luty, "kupca": kupiec, "zaopiekował": zaopiekowac, "wuj": wuj, "późniejszy": pozny, "wykładów": wyklad, "matematyki": matematyka, "studiował": studiowac, "medycynę": medycyna, "uzyskał": uzyskac }
  - clean: "Po powrocie do kraju Kopernik został kanonikiem kapituły warmińskiej i większość życia spędził we Fromborku, małym mieście nad Zalewem Wiślanym. Zajmował się sprawami kapituły, leczył ludzi i zarządzał majątkami kościelnymi. W czasie ostatniej wojny z Krzyżakami, w latach 1520–1521, kierował obroną zamku w Olsztynie i nie dopuścił do jego zdobycia. Napisał także traktat o monecie, w którym zauważył, że gorszy pieniądz wypiera z obiegu lepszy, kilkadziesiąt lat przed angielskim finansistą Greshamem, od którego nazwiska nazywa się dziś tę zasadę."
    draft: true
    chunks:
      - pl: "Po powrocie do kraju Kopernik został kanonikiem kapituły warmińskiej i większość życia spędził we Fromborku, małym mieście nad Zalewem Wiślanym."
        ru: "Вернувшись на родину, Коперник стал каноником вармийского капитула и большую часть жизни провёл во Фромборке, маленьком городке на Вислинском заливе."
        note: "kapituła — капитул"
      - pl: " Zajmował się sprawami kapituły, leczył ludzi i zarządzał majątkami kościelnymi."
        ru: "Он занимался делами капитула, лечил людей и управлял церковными имениями."
      - pl: " W czasie ostatniej wojny z Krzyżakami, w latach 1520–1521, kierował obroną zamku w Olsztynie i nie dopuścił do jego zdobycia."
        ru: "Во время последней войны с крестоносцами, в 1520–1521 годах, он руководил обороной замка в Ольштыне и не допустил его взятия."
        note: "dopuścić — допустить"
      - pl: " Napisał także traktat o monecie, w którym zauważył, że gorszy pieniądz wypiera z obiegu lepszy, kilkadziesiąt lat przed angielskim finansistą Greshamem, od którego nazwiska nazywa się dziś tę zasadę."
        ru: "Он написал также трактат о монете, в котором заметил, что худшие деньги вытесняют из обращения лучшие, — за несколько десятилетий до английского финансиста Грешема, по имени которого этот закон называют сегодня."
        note: "wypierać — вытеснять; obieg — обращение"
    words: { "zarządzał": zarzadzac, "majątkami": majatek, "kierował": kierowac, "zamku": zamek, "dopuścił": dopuscic, "monecie": moneta }
  - clean: "Ale najważniejsze były nocne obserwacje nieba. Od starożytności uczeni przyjmowali, że Ziemia stoi nieruchomo w środku świata, a Słońce, Księżyc i planety krążą wokół niej. System ten, opisany przez greckiego astronoma Ptolemeusza, był bardzo skomplikowany, bo ruchy planet trzeba było tłumaczyć za pomocą dziesiątek dodatkowych kół. Kopernik doszedł do wniosku, że wszystko staje się prostsze, jeśli w środku umieścimy Słońce, a Ziemię uznamy za jedną z planet. Ziemia obraca się wokół własnej osi raz na dobę i okrąża Słońce raz na rok."
    draft: true
    chunks:
      - pl: "Ale najważniejsze były nocne obserwacje nieba."
        ru: "Но важнее всего были ночные наблюдения за небом."
        note: "obserwacja — наблюдение"
      - pl: " Od starożytności uczeni przyjmowali, że Ziemia stoi nieruchomo w środku świata, a Słońce, Księżyc i planety krążą wokół niej."
        ru: "Со времён античности учёные принимали, что Земля неподвижно стоит в центре мира, а Солнце, Луна и планеты вращаются вокруг неё."
        note: "nieruchomo — неподвижно; krążyć — кружить, вращаться"
      - pl: " System ten, opisany przez greckiego astronoma Ptolemeusza, był bardzo skomplikowany, bo ruchy planet trzeba było tłumaczyć za pomocą dziesiątek dodatkowych kół."
        ru: "Эта система, описанная греческим астрономом Птолемеем, была очень сложной: движение планет приходилось объяснять с помощью десятков дополнительных кругов."
        note: "ruch — движение"
      - pl: " Kopernik doszedł do wniosku, że wszystko staje się prostsze, jeśli w środku umieścimy Słońce, a Ziemię uznamy za jedną z planet."
        ru: "Коперник пришёл к выводу, что всё становится проще, если поместить в центр Солнце, а Землю признать одной из планет."
        note: "dojść do wniosku — прийти к выводу; umieścić — поместить"
      - pl: " Ziemia obraca się wokół własnej osi raz na dobę i okrąża Słońce raz na rok."
        ru: "Земля обращается вокруг своей оси раз в сутки и обходит Солнце раз в год."
        note: "oś — ось; doba — сутки; okrążać — обходить по кругу"
    words: { "nocne": nocny, "obserwacje": obserwacja, "przyjmowali": przyjmowac, "krążą": krazyc, "opisany": opisac, "greckiego": grecki, "dziesiątek": dziesiatka, "wniosku": wniosek, "dobę": doba }
  - clean: "Kopernik pracował nad swoim dziełem prawie trzydzieści lat i długo wahał się z jego wydaniem. Bał się, jak to sam napisał, że zostanie wyśmiany. Krótki zarys teorii krążył w rękopisach wśród uczonych już od około 1514 roku. Dopiero namowy przyjaciół i młodego niemieckiego matematyka Jerzego Joachima Retyka skłoniły go do wydania całości. Dzieło „O obrotach sfer niebieskich” ukazało się w Norymberdze w 1543 roku. Według tradycji pierwszy egzemplarz dostarczono Kopernikowi na łoże śmierci, 24 maja 1543 roku."
    draft: true
    chunks:
      - pl: "Kopernik pracował nad swoim dziełem prawie trzydzieści lat i długo wahał się z jego wydaniem."
        ru: "Коперник работал над своим трудом почти тридцать лет и долго колебался с его изданием."
        note: "wahać się — колебаться"
      - pl: " Bał się, jak to sam napisał, że zostanie wyśmiany."
        ru: "Он боялся, как сам писал, что его высмеют."
      - pl: " Krótki zarys teorii krążył w rękopisach wśród uczonych już od około 1514 roku."
        ru: "Краткий набросок теории ходил в рукописях среди учёных уже примерно с 1514 года."
        note: "zarys — очерк, набросок; rękopis — рукопись"
      - pl: " Dopiero namowy przyjaciół i młodego niemieckiego matematyka Jerzego Joachima Retyka skłoniły go do wydania całości."
        ru: "Лишь уговоры друзей и молодого немецкого математика Георга Иоахима Ретика побудили его издать труд целиком."
        note: "namowa — уговоры; skłonić — побудить"
      - pl: " Dzieło „O obrotach sfer niebieskich” ukazało się w Norymberdze w 1543 roku."
        ru: "Труд «О вращениях небесных сфер» вышел в Нюрнберге в 1543 году."
        note: "obrót — вращение; ukazać się — выйти (о книге)"
      - pl: " Według tradycji pierwszy egzemplarz dostarczono Kopernikowi na łoże śmierci, 24 maja 1543 roku."
        ru: "По преданию, первый экземпляр доставили Копернику на смертное ложе 24 мая 1543 года."
        note: "egzemplarz — экземпляр; łoże śmierci — смертное ложе"
    words: { "dziełem": dzielo, "trzydzieści": trzydziesci, "wahał": wahac, "krążył": krazyc, "niemieckiego": niemiecki, "matematyka": matematyka, "całości": calosc, "Dzieło": dzielo, "obrotach": obrot, "tradycji": tradycja, "egzemplarz": egzemplarz, "maja": maj }
  - clean: "Wydawca opatrzył książkę anonimową przedmową, w której napisał, że teoria Kopernika jest tylko hipotezą, wygodną do obliczeń, a nie opisem rzeczywistości. Sam Kopernik z pewnością tak nie myślał. Przez kilkadziesiąt lat jego dzieło czytali głównie astronomowie i nie budziło ono wielkich sporów. Burza wybuchła dopiero na początku XVII wieku, kiedy teorię Kopernika zaczęli bronić Galileusz i Kepler. W 1616 roku Kościół katolicki umieścił dzieło na indeksie ksiąg zakazanych, z którego zdjęto je dopiero w XIX wieku. Zmiana, którą zapoczątkował, nazywana jest dziś przewrotem kopernikańskim, a słowo to oznacza każdą radykalną zmianę sposobu myślenia."
    draft: true
    chunks:
      - pl: "Wydawca opatrzył książkę anonimową przedmową, w której napisał, że teoria Kopernika jest tylko hipotezą, wygodną do obliczeń, a nie opisem rzeczywistości."
        ru: "Издатель снабдил книгу анонимным предисловием, в котором написал, что теория Коперника — лишь гипотеза, удобная для вычислений, а не описание действительности."
        note: "przedmowa — предисловие; obliczenie — вычисление"
      - pl: " Sam Kopernik z pewnością tak nie myślał."
        ru: "Сам Коперник наверняка так не думал."
      - pl: " Przez kilkadziesiąt lat jego dzieło czytali głównie astronomowie i nie budziło ono wielkich sporów."
        ru: "Несколько десятилетий его труд читали главным образом астрономы, и он не вызывал больших споров."
      - pl: " Burza wybuchła dopiero na początku XVII wieku, kiedy teorię Kopernika zaczęli bronić Galileusz i Kepler."
        ru: "Буря разразилась лишь в начале XVII века, когда теорию Коперника стали защищать Галилей и Кеплер."
      - pl: " W 1616 roku Kościół katolicki umieścił dzieło na indeksie ksiąg zakazanych, z którego zdjęto je dopiero w XIX wieku."
        ru: "В 1616 году католическая церковь внесла труд в Индекс запрещённых книг, откуда его исключили лишь в XIX веке."
        note: "indeks ksiąg zakazanych — Индекс запрещённых книг"
      - pl: " Zmiana, którą zapoczątkował, nazywana jest dziś przewrotem kopernikańskim, a słowo to oznacza każdą radykalną zmianę sposobu myślenia."
        ru: "Перемену, которую он начал, сегодня называют коперниканским переворотом, и это выражение означает любое радикальное изменение образа мыслей."
        note: "zapoczątkować — положить начало; przewrót — переворот"
    words: { "Wydawca": wydawca, "anonimową": anonimowy, "wygodną": wygodny, "opisem": opis, "rzeczywistości": rzeczywistosc, "dzieło": dzielo, "głównie": glownie, "budziło": budzic, "Burza": burza, "wybuchła": wybuchnac, "ksiąg": ksiega, "zakazanych": zakazac }
  - clean: "Polacy są dumni z Kopernika, ale jego przynależność narodowa była przez długi czas przedmiotem sporu z Niemcami. Kopernik pisał po łacinie, w domu mówiono prawdopodobnie po niemiecku, ale był poddanym króla Polski, wiernym mu przez całe życie, i bronił polskiego zamku przed Krzyżakami. Pytanie o narodowość w dzisiejszym sensie nie ma dla epoki renesansu wielkiego znaczenia. W Warszawie przed Pałacem Staszica stoi jego pomnik z napisem „Mikołajowi Kopernikowi rodacy”. O Koperniku mówi się też w Polsce krótko: „wstrzymał Słońce, ruszył Ziemię”. W 2005 roku w katedrze we Fromborku odnaleziono jego szczątki, które zidentyfikowano dzięki badaniom DNA, porównując je z włosami znalezionymi w jednej z jego książek."
    draft: true
    chunks:
      - pl: "Polacy są dumni z Kopernika, ale jego przynależność narodowa była przez długi czas przedmiotem sporu z Niemcami."
        ru: "Поляки гордятся Коперником, но его национальная принадлежность долгое время была предметом спора с немцами."
      - pl: " Kopernik pisał po łacinie, w domu mówiono prawdopodobnie po niemiecku, ale był poddanym króla Polski, wiernym mu przez całe życie, i bronił polskiego zamku przed Krzyżakami."
        ru: "Коперник писал по-латыни, дома говорили, вероятно, по-немецки, но он был подданным польского короля, верным ему всю жизнь, и защищал польский замок от крестоносцев."
      - pl: " Pytanie o narodowość w dzisiejszym sensie nie ma dla epoki renesansu wielkiego znaczenia."
        ru: "Вопрос о национальности в нынешнем смысле для эпохи Ренессанса не имеет большого значения."
        note: "narodowość — национальность"
      - pl: " W Warszawie przed Pałacem Staszica stoi jego pomnik z napisem „Mikołajowi Kopernikowi rodacy”."
        ru: "В Варшаве перед дворцом Сташица стоит его памятник с надписью «Николаю Копернику — соотечественники»."
        note: "rodak — соотечественник"
      - pl: " O Koperniku mówi się też w Polsce krótko: „wstrzymał Słońce, ruszył Ziemię”."
        ru: "О Копернике в Польше говорят и коротко: «остановил Солнце, сдвинул Землю»."
        note: "wstrzymać — остановить; ruszyć — сдвинуть"
      - pl: " W 2005 roku w katedrze we Fromborku odnaleziono jego szczątki, które zidentyfikowano dzięki badaniom DNA, porównując je z włosami znalezionymi w jednej z jego książek."
        ru: "В 2005 году в соборе во Фромборке нашли его останки, которые опознали благодаря анализу ДНК, сравнив их с волосами, найденными в одной из его книг."
        note: "zidentyfikować — опознать"
    words: { "zamku": zamek, "narodowa": narodowy, "przedmiotem": przedmiot, "wiernym": wierny, "polskiego": polski, "pomnik": pomnik, "wstrzymał": wstrzymac, "zidentyfikowano": zidentyfikowac }
  - clean: "Kopernik pisał po łacinie, bo był to język nauki. W tym samym czasie zaczęła jednak rozkwitać literatura w języku polskim. Jej ojcem nazywa się Mikołaja Reja z Nagłowic, szlachcica, który nie skończył żadnej szkoły i którego koledzy uważali w młodości za próżniaka. Rej był samoukiem, ale miał ogromny talent i niezwykłą pracowitość. Napisał setki utworów: satyry, dialogi, epigramaty, przekłady psalmów i obszerne księgi moralne. W swoim „Żywocie człowieka poczciwego” opisał ideał szlachcica, który mieszka na wsi, dba o gospodarstwo, kocha rodzinę i spokojnie cieszy się życiem."
    draft: true
    chunks:
      - pl: "Kopernik pisał po łacinie, bo był to język nauki."
        ru: "Коперник писал по-латыни, потому что это был язык науки."
      - pl: " W tym samym czasie zaczęła jednak rozkwitać literatura w języku polskim."
        ru: "Но в то же время начала расцветать литература на польском языке."
        note: "rozkwitać — расцветать"
      - pl: " Jej ojcem nazywa się Mikołaja Reja z Nagłowic, szlachcica, który nie skończył żadnej szkoły i którego koledzy uważali w młodości za próżniaka."
        ru: "Её отцом называют Миколая Рея из Нагловиц, шляхтича, который не окончил никакой школы и которого товарищи в юности считали бездельником."
        note: "próżniak — бездельник"
      - pl: " Rej był samoukiem, ale miał ogromny talent i niezwykłą pracowitość."
        ru: "Рей был самоучкой, но обладал огромным талантом и необычайным трудолюбием."
        note: "samouk — самоучка"
      - pl: " Napisał setki utworów: satyry, dialogi, epigramaty, przekłady psalmów i obszerne księgi moralne."
        ru: "Он написал сотни произведений: сатиры, диалоги, эпиграммы, переводы псалмов и обширные нравоучительные книги."
        note: "utwór — произведение; obszerny — обширный"
      - pl: " W swoim „Żywocie człowieka poczciwego” opisał ideał szlachcica, który mieszka na wsi, dba o gospodarstwo, kocha rodzinę i spokojnie cieszy się życiem."
        ru: "В своём «Жизнеописании честного человека» он описал идеал шляхтича, который живёт в деревне, заботится о хозяйстве, любит семью и спокойно радуется жизни."
