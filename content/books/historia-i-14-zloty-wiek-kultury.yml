  - clean: "Złoty wiek nie był wyłącznie polski. Rzeczpospolita była państwem wielu narodów i każdy z nich przeżywał w tym czasie własny rozkwit kulturalny. W 1517 roku w Pradze Franciszek Skaryna, mieszczanin z Połocka, wydrukował psałterz i inne księgi Biblii w języku cerkiewnosłowiańskim z elementami ruskiej mowy. Białorusini uważają go dziś za twórcę swojego piśmiennictwa, a później drukował także w Wilnie. Iwan Fiodorow, pierwszy drukarz moskiewski, który musiał uciekać z Moskwy, znalazł schronienie w Rzeczypospolitej. We Lwowie wydał w 1574 roku „Apostoła” i pierwszy elementarz, a w Ostrogu na Wołyniu, pod opieką księcia Konstantego Wasyla Ostrogskiego, wydrukował w 1581 roku pierwszą pełną Biblię w języku cerkiewnosłowiańskim. Biblia ostrogska stała się wzorem dla wydań prawosławnych, także późniejszych wydań moskiewskich."
