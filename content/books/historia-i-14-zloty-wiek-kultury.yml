  - clean: "Książę Ostrogski, syn zwycięzcy spod Orszy, był najpotężniejszym magnatem ruskim i gorliwym obrońcą prawosławia. Założył w Ostrogu akademię, w której uczono greki, łaciny i języka cerkiewnosłowiańskiego. W miastach Rusi działały bractwa cerkiewne, stowarzyszenia prawosławnych mieszczan, które prowadziły szkoły i drukarnie. Żydowskie drukarnie w Krakowie i Lublinie wydawały księgi hebrajskie, które rozchodziły się po całej Europie. W Gdańsku i Toruniu kwitła kultura niemiecka, a w Wilnie spotykały się wpływy polskie, litewskie i ruskie."
