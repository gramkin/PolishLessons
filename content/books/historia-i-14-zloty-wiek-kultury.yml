  - clean: "Złoty wiek miał jednak swoje granice. Jego owoce trafiały głównie do szlachty i bogatych mieszczan. Większość chłopów nie umiała czytać i coraz ciężej pracowała na folwarkach. Szlachta, dumna ze swoich wolności, coraz mniej chętnie myślała o reformach, które mogłyby je ograniczyć. Ale w porównaniu z resztą Europy XVI wiek był dla Polski czasem wyjątkowo szczęśliwym: bez wojen religijnych, bez wielkich klęsk, z rosnącym bogactwem i kwitnącą kulturą. Nic dziwnego, że późniejsze pokolenia wspominały go z tęsknotą. W następnym rozdziale zobaczymy, jak w tym samym stuleciu Polska i Litwa połączyły się w jedno państwo."
