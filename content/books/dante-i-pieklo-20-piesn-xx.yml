# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 20
chapterTitle: "Pieśń XX"
chapterTitleRu: "Песнь XX. Прорицатели"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok IV. Czarnoksiężnicy i wróżbici.)"
    chunks:
      - pl: "(Krąg VIII. Tłumok IV. Czarnoksiężnicy i wróżbici.)"
        ru: "(Круг VIII. Ров IV. Колдуны и прорицатели.)"
        note: "czarnoksiężnik — колдун; wróżbita — прорицатель"
    words: { "Krąg": krag }
  - clean: "Nowa męczarnia wierszem wyśpiewana\nDa treść dwudziestej z mojej pierwszej pieśni,\nKtóra opiewa kary potępionych.\nSkłoniony zajrzeć do rozwartej cieśni,\nCo się czerniła wśród skał rozszczepionych,\nA cała we łzach bolesnych skąpana:\nWidziałem duchy; krągłą jej doliną,\nCicho płaczące, wciąż idą i płyną,\nJako na ziemi lud za procesyją."
    verse: true
    chunks:
      - pl: "Nowa męczarnia wierszem wyśpiewana"
        ru: "Новая мука, воспетая стихом,"
        note: "wyśpiewany — воспетый"
      - pl: "\nDa treść dwudziestej z mojej pierwszej pieśni,"
        ru: "даст содержание двадцатой [песни] моей первой песни,"
        note: "то есть первой кантики, «Ада»"
      - pl: "\nKtóra opiewa kary potępionych."
        ru: "которая воспевает кары осуждённых."
        note: "opiewać — воспевать"
      - pl: "\nSkłoniony zajrzeć do rozwartej cieśni,"
        ru: "Склонённый заглянуть в разверстую теснину,"
        note: "cieśń — теснина"
      - pl: "\nCo się czerniła wśród skał rozszczepionych,"
        ru: "что чернела среди расколотых скал,"
        note: "rozszczepiony — расщеплённый"
      - pl: "\nA cała we łzach bolesnych skąpana:"
        ru: "а вся омыта горькими слезами,"
        note: "skąpany — омытый"
      - pl: "\nWidziałem duchy; krągłą jej doliną,"
        ru: "я видел духов: по её круглой долине,"
      - pl: "\nCicho płaczące, wciąż idą i płyną,"
        ru: "тихо плача, они всё идут и плывут,"
      - pl: "\nJako na ziemi lud za procesyją."
        ru: "как на земле народ за крестным ходом."
        note: "procesyja — старое написание procesja"
    words: { "wierszem": wiersz, "pieśni": piesn, "zajrzeć": zajrzec, "skał": skala, "bolesnych": bolesny, "doliną": dolina }
  - clean: "Ci potępieńcy z wykrzywioną szyją,\nSkrzywione brody wspierali na krzyżu,\nTwarz ich wyraźnie była wykręcona\nMiędzy łopatki grzbietu za ramiona.\nA szli wstecz, tyłem, tak idą od chwili\nGdy zmysł widzenia przed się utracili."
    verse: true
    chunks:
      - pl: "Ci potępieńcy z wykrzywioną szyją,"
        ru: "Эти осуждённые со свёрнутой шеей"
      - pl: "\nSkrzywione brody wspierali na krzyżu,"
        ru: "опирали искривлённые подбородки о хребет,"
        note: "krzyż — здесь «крестец, хребет»"
      - pl: "\nTwarz ich wyraźnie była wykręcona"
        ru: "лицо их явно было вывернуто"
      - pl: "\nMiędzy łopatki grzbietu za ramiona."
        ru: "между лопатками спины, за плечи."
        note: "łopatka — лопатка"
      - pl: "\nA szli wstecz, tyłem, tak idą od chwili"
        ru: "И шли они назад, задом, так идут с той минуты,"
      - pl: "\nGdy zmysł widzenia przed się utracili."
        ru: "как утратили способность видеть перед собой."
    words: { "szyją": szyja, "wspierali": wspierac, "krzyżu": krzyz, "grzbietu": grzbiet, "wstecz": wstecz, "zmysł": zmysl }
  - clean: "Może się komu na ziemi zdarzyło\nWidzieć tak zgiętych kurczem paraliżu,\nNie widząc, nie śmiem wierzyć, że tak było.\nMój czytelniku! jeśli Bóg cię skłania,\nZebrać tu owoc z twojego czytania,\nJeśli masz serce na boleść niegłuche,\nOsądź, czy mogłem ja mieć oczy suche,\nWidząc nasz obraz, nasze podobieństwo,\nTak wykrzywione przez dziwne męczeństwo,\nI widząc łzy ich (któż temu uwierzy!),\nJak z ócz spadały bruzdą ich pacierzy."
    verse: true
    chunks:
      - pl: "Może się komu na ziemi zdarzyło"
        ru: "Может, кому-нибудь на земле случалось"
      - pl: "\nWidzieć tak zgiętych kurczem paraliżu,"
        ru: "видеть людей, так согнутых судорогой паралича,"
        note: "kurcz — судорога"
      - pl: "\nNie widząc, nie śmiem wierzyć, że tak było."
        ru: "не видав, не смею верить, что так было."
      - pl: "\nMój czytelniku! jeśli Bóg cię skłania,"
        ru: "Мой читатель! если Бог тебя склоняет"
      - pl: "\nZebrać tu owoc z twojego czytania,"
        ru: "собрать здесь плод своего чтения,"
      - pl: "\nJeśli masz serce na boleść niegłuche,"
        ru: "если у тебя сердце не глухое к боли,"
      - pl: "\nOsądź, czy mogłem ja mieć oczy suche,"
        ru: "суди, мог ли я иметь сухие глаза,"
      - pl: "\nWidząc nasz obraz, nasze podobieństwo,"
        ru: "видя наш образ, наше подобие,"
      - pl: "\nTak wykrzywione przez dziwne męczeństwo,"
        ru: "так искривлённое странным мучением,"
      - pl: "\nI widząc łzy ich (któż temu uwierzy!),"
        ru: "и видя их слёзы (кто этому поверит!),"
      - pl: "\nJak z ócz spadały bruzdą ich pacierzy."
        ru: "как они из очей стекали по ложбине их хребта."
        note: "bruzda — борозда; pacierze — здесь «позвоночник»"
    words: { "zdarzyło": zdarzyc, "kurczem": kurcz, "owoc": owoc, "Osądź": osadzic, "suche": suchy, "podobieństwo": podobienstwo }
  - clean: "Zaiste, wsparty o skałę płakałem,\nA wódz mój wołał: «Czyś rażon ich szałem?\nTu litość żyje wtenczas, gdy zamarła!\nGdzie tak zuchwali, co się nie zatrwożą,\nPrzesądzać żalem sprawiedliwość bożą?\nWznieś wyżej głowę, patrz, oto duch kroczy,\nPod którym ziemia swą przepaść rozwarła."
    verse: true
    chunks:
      - pl: "Zaiste, wsparty o skałę płakałem,"
        ru: "Воистину, опершись о скалу, я плакал,"
      - pl: "\nA wódz mój wołał: «Czyś rażon ich szałem?"
        ru: "а мой вождь восклицал: «Неужто ты поражён их безумием?"
        note: "rażon — краткая форма: «поражён»"
      - pl: "\nTu litość żyje wtenczas, gdy zamarła!"
        ru: "Здесь жалость живёт тогда, когда умерла!"
      - pl: "\nGdzie tak zuchwali, co się nie zatrwożą,"
        ru: "Где те дерзкие, что не устрашатся"
      - pl: "\nPrzesądzać żalem sprawiedliwość bożą?"
        ru: "предрешать скорбью Божье правосудие?"
        note: "przesądzać — предрешать"
      - pl: "\nWznieś wyżej głowę, patrz, oto duch kroczy,"
        ru: "Подними выше голову, смотри: вот дух шагает,"
      - pl: "\nPod którym ziemia swą przepaść rozwarła."
        ru: "под которым земля разверзла свою пропасть."
    words: { "wódz": wodz, "wołał": wolac, "szałem": szal, "żalem": zal, "Wznieś": wzniesc, "przepaść": przepasc }
  - clean: "Wobec Tebanów, ledwo w przepaść wskoczy,\n»Amfiaraus zapadł!« Krzyk się szerzy\n»Już on do szturmu jutro nie uderzy«.\nGdy go chłonęła w głąb ta przepaść dzika,\nMinos, co sądzi każdego grzesznika,\nWidzi, pierś jego z ramion się wytyka;\nZa to, że w przyszłość zagłębiał się okiem,\nTutaj wstecz patrzy, wstecznym idzie krokiem."
    verse: true
    chunks:
      - pl: "Wobec Tebanów, ledwo w przepaść wskoczy,"
        ru: "На глазах у фиванцев, едва он прыгнет в пропасть,"
        note: "wobec — перед; Teban — фиванец"
      - pl: "\n»Amfiaraus zapadł!« Krzyk się szerzy"
        ru: "„Амфиарай провалился!“ — разносится крик,"
      - pl: "\n»Już on do szturmu jutro nie uderzy«."
        ru: "„Уже он завтра не пойдёт на штурм“."
      - pl: "\nGdy go chłonęła w głąb ta przepaść dzika,"
        ru: "Когда его поглощала вглубь эта дикая пропасть,"
      - pl: "\nMinos, co sądzi każdego grzesznika,"
        ru: "Минос, что судит каждого грешника,"
      - pl: "\nWidzi, pierś jego z ramion się wytyka;"
        ru: "видит: грудь его выставляется вместо плеч;"
        note: "wytykać się — выдаваться"
      - pl: "\nZa to, że w przyszłość zagłębiał się okiem,"
        ru: "за то, что он углублялся взглядом в будущее,"
      - pl: "\nTutaj wstecz patrzy, wstecznym idzie krokiem."
        ru: "здесь он смотрит назад, идёт попятным шагом."
        note: "wsteczny — попятный"
    words: { "ledwo": ledwo, "wskoczy": wskoczyc, "Krzyk": krzyk, "głąb": glab, "pierś": piers, "ramion": ramie }
  - clean: "Patrz, Tyrezyjasz, co czarów zaklęciem\nZ męża w niewiastę zmienił się, dziw nowy!\nPrzeobrażony od stóp aż do głowy.\nI wprzódy musiał laską czarnoksięską\nDwóch sprzęgłych wężów zabić jednym cięciem,\nNim się na powrót oblekł w skórę męską."
    verse: true
    chunks:
      - pl: "Patrz, Tyrezyjasz, co czarów zaklęciem"
        ru: "Смотри: Тиресий, что заклятием чар"
        note: "Tyrezyjasz — Тиресий"
      - pl: "\nZ męża w niewiastę zmienił się, dziw nowy!"
        ru: "из мужа превратился в жену, новое чудо!"
      - pl: "\nPrzeobrażony od stóp aż do głowy."
        ru: "преображённый от ног до головы."
        note: "przeobrażony — преображённый"
      - pl: "\nI wprzódy musiał laską czarnoksięską"
        ru: "И прежде он должен был колдовским жезлом"
        note: "czarnoksięski — колдовской"
      - pl: "\nDwóch sprzęgłych wężów zabić jednym cięciem,"
        ru: "двух сплетённых змей убить одним ударом,"
        note: "sprzęgły — сплетённый; cięcie — удар"
      - pl: "\nNim się na powrót oblekł w skórę męską."
        ru: "прежде чем снова облёкся в мужскую кожу."
    words: { "zaklęciem": zaklecie, "niewiastę": niewiasta, "wprzódy": wprzody, "wężów": waz, "skórę": skora, "męską": meski }
  - clean: "Patrz, który idąc w zad zatacza brzuchem,\nTo Aruns, głośny niegdyś wieszczym duchem.\nW góry od ludzi skrył się za żywota;\nBiała z marmurów kararyjskich grota\nByła mu domem, skąd mógł w każdej porze\nPatrzeć na gwiazdy, to na pełne morze."
    verse: true
    chunks:
      - pl: "Patrz, który idąc w zad zatacza brzuchem,"
        ru: "Смотри: тот, кто, идя задом, обращён к нему животом,"
        note: "w zad — задом"
      - pl: "\nTo Aruns, głośny niegdyś wieszczym duchem."
        ru: "это Аррунт, некогда славный вещим духом."
      - pl: "\nW góry od ludzi skrył się za żywota;"
        ru: "В горах от людей он скрывался при жизни;"
      - pl: "\nBiała z marmurów kararyjskich grota"
        ru: "белый грот из каррарских мраморов"
        note: "kararyjski — каррарский"
      - pl: "\nByła mu domem, skąd mógł w każdej porze"
        ru: "был ему домом, откуда он мог в любую пору"
      - pl: "\nPatrzeć na gwiazdy, to na pełne morze."
        ru: "смотреть на звёзды или на открытое море."
    words: { "brzuchem": brzuch, "głośny": glosny, "duchem": duch, "gwiazdy": gwiazda, "pełne": pelny, "morze": morze }
  - clean: "Ta, co włosami rozwianych warkoczy\nKryje pierś, której nie widzą twe oczy,\nTo Manto, niegdyś ziem i wysep siła,\nNiejedne lądy i morza zwiedziła,\nAż przyszła w stronę, która mnie zrodziła.\nMłoda i piękna, w samym wieku kwiecie,\nPrzez swego ojca śmierć osierocona,\nGdy miasto Teby zdobył miecz Kreona,\nPrzeżyła młodość, wędrując po świecie."
    verse: true
    chunks:
      - pl: "Ta, co włosami rozwianych warkoczy"
        ru: "Та, что волосами распущенных кос"
        note: "warkocz — коса"
      - pl: "\nKryje pierś, której nie widzą twe oczy,"
        ru: "закрывает грудь, которой не видят твои глаза,"
      - pl: "\nTo Manto, niegdyś ziem i wysep siła,"
        ru: "это Манто, что некогда земель и островов множество"
        note: "wysep — род. мн. от wyspa; siła — устар. «множество»"
      - pl: "\nNiejedne lądy i morza zwiedziła,"
        ru: "и немало стран и морей посетила,"
      - pl: "\nAż przyszła w stronę, która mnie zrodziła."
        ru: "пока не пришла в край, что меня породил."
      - pl: "\nMłoda i piękna, w samym wieku kwiecie,"
        ru: "Юная и прекрасная, в самом цвету лет,"
      - pl: "\nPrzez swego ojca śmierć osierocona,"
        ru: "осиротевшая со смертью отца,"
        note: "osierocony — осиротевший"
      - pl: "\nGdy miasto Teby zdobył miecz Kreona,"
        ru: "когда город Фивы взял меч Креонта,"
      - pl: "\nPrzeżyła młodość, wędrując po świecie."
        ru: "она провела юность, странствуя по свету."
    words: { "Kryje": kryc, "lądy": lad, "kwiecie": kwiat, "miecz": miecz, "Przeżyła": przezyc, "młodość": mlodosc }
  - clean: "Tam w pięknej ziemi, gdzie Alpy półkolem\nŚciskają Niemcy wyżej za Tyrolem,\nTuż pod alpejską ścianą granitową,\nLeży jezioro, Benako je zową.\nTysiąc strumieni, myślę, więcej może,\nPomiędzy Gardą a Apeninami\nKryształowymi leją się krużami\nW wodę, co drzemie w tym pięknym jeziorze."
    verse: true
    chunks:
      - pl: "Tam w pięknej ziemi, gdzie Alpy półkolem"
        ru: "Там, в прекрасной земле, где Альпы полукругом"
      - pl: "\nŚciskają Niemcy wyżej za Tyrolem,"
        ru: "сжимают Германию выше Тироля,"
      - pl: "\nTuż pod alpejską ścianą granitową,"
        ru: "у самой альпийской гранитной стены"
      - pl: "\nLeży jezioro, Benako je zową."
        ru: "лежит озеро, его зовут Бенако."
        note: "Benako — Бенако, ныне Гарда; zową — зовут"
      - pl: "\nTysiąc strumieni, myślę, więcej może,"
        ru: "Тысяча ручьёв, думаю, может быть и больше,"
      - pl: "\nPomiędzy Gardą a Apeninami"
        ru: "между Гардой и Апеннинами"
      - pl: "\nKryształowymi leją się krużami"
        ru: "льются хрустальными кувшинами"
        note: "krużami — устар. «кувшинами»"
      - pl: "\nW wodę, co drzemie w tym pięknym jeziorze."
        ru: "в воду, что дремлет в этом прекрасном озере."
    words: { "ścianą": sciana, "jezioro": jezioro, "zową": zwac, "Tysiąc": tysiac, "strumieni": strumien, "leją": lac }
  - clean: "Trzy pogranicza tworzą jej wybrzeże,\nGdzie z Trentu, z Bresci, z Werony pasterze,\nRazem swym trzodom błogosławić mogą,\nJeśliby razem jechali tą drogą.\nNiżej, gdzie woda nad brzegi się wzbiera,\nUsiadła piękna twierdza Peskijera,\nZdolna od wrogów swą kamienną tamą\nBronić mieszkańców Bresci i Bergamo."
    verse: true
    chunks:
      - pl: "Trzy pogranicza tworzą jej wybrzeże,"
        ru: "Три пограничья образуют его берег,"
        note: "pogranicze — пограничье"
      - pl: "\nGdzie z Trentu, z Bresci, z Werony pasterze,"
        ru: "где пастыри из Тренто, из Брешии, из Вероны"
        note: "епископы трёх епархий"
      - pl: "\nRazem swym trzodom błogosławić mogą,"
        ru: "вместе могли бы благословлять свои стада,"
      - pl: "\nJeśliby razem jechali tą drogą."
        ru: "если бы вместе ехали этой дорогой."
      - pl: "\nNiżej, gdzie woda nad brzegi się wzbiera,"
        ru: "Ниже, где вода поднимается над берегами,"
      - pl: "\nUsiadła piękna twierdza Peskijera,"
        ru: "уселась прекрасная крепость Пескьера,"
      - pl: "\nZdolna od wrogów swą kamienną tamą"
        ru: "способная своей каменной плотиной от врагов"
      - pl: "\nBronić mieszkańców Bresci i Bergamo."
        ru: "защищать жителей Брешии и Бергамо."
    words: { "wybrzeże": wybrzeze, "trzodom": trzoda, "błogosławić": blogoslawic, "Niżej": nisko, "brzegi": brzeg, "tamą": tama }
  - clean: "Z czary jeziora wody przepełnione\nWzbierają rzeką na łąki zielone,\nTa Mincio zwana, bieży po dolinie\nAż pod Gowerno, gdzie w rzece Po ginie.\nDalej płaszczyzną nurtując krynice,\nZ wód ścieku tworzą stęchłe trzęsawice,\nGdzie woda parą chorobliwą dysze."
    verse: true
    chunks:
      - pl: "Z czary jeziora wody przepełnione"
        ru: "Из чаши озера переполненные воды"
        note: "czara — чаша"
      - pl: "\nWzbierają rzeką na łąki zielone,"
        ru: "поднимаются рекой на зелёные луга,"
      - pl: "\nTa Mincio zwana, bieży po dolinie"
        ru: "она зовётся Минчо, бежит по долине"
      - pl: "\nAż pod Gowerno, gdzie w rzece Po ginie."
        ru: "до самого Говерно, где теряется в реке По."
        note: "ginąć — теряться"
      - pl: "\nDalej płaszczyzną nurtując krynice,"
        ru: "Дальше по равнине, точа источники,"
        note: "nurtować — подтачивать, струиться"
      - pl: "\nZ wód ścieku tworzą stęchłe trzęsawice,"
        ru: "из стока вод они образуют затхлые топи,"
        note: "stęchły — затхлый; trzęsawica — топь"
      - pl: "\nGdzie woda parą chorobliwą dysze."
        ru: "где вода дышит болезненным паром."
    words: { "wody": woda, "rzece": rzeka, "tworzą": tworzyc }
  - clean: "Tam sobie Manto obrała zacisze,\nZ dala od ludzi, nieznane nikomu,\nGdzie się czarami bawiąc po kryjomu,\nŻyła lat wiele, aż wiekiem schyloną\nTaż sama ziemia przyjęła w swe łono.\nWkrótce w to miejsce lud ciągnął tłumami,\nObwarowane wokoło bagnami;\nNa kościach zmarłej miasto zbudowane\nOd miana Manty Mantuą nazwane."
