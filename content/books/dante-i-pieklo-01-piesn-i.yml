# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 1
chapterTitle: "Pieśń I"
chapterTitleRu: "Песнь I. Сумрачный лес"
level: B2
paragraphs:
  - clean: "(Wstęp: Las. Zwierzęta. Wirgiliusz.)"
    chunks:
      - pl: "(Wstęp: Las. Zwierzęta. Wirgiliusz.)"
        ru: "(Вступление: Лес. Звери. Вергилий.)"
        note: "Wirgiliusz — Вергилий; Korsak предваряет каждую песнь кратким перечнем её содержания"
    words: { "Wstęp": wstep, "Zwierzęta": zwierze }
  - clean: "Z prostego toru w naszych dni połowie\nWszedłem w las ciemny; jaka gęstwa dzika,\nJakie w tym lesie okropne pustkowie,\nŻyjący język tego nie wypowie;\nWspomnienie gorzkie i zgrozą przenika,\nŚmierć odeń gorzką nie więcej być może."
    verse: true
    chunks:
      - pl: "Z prostego toru w naszych dni połowie"
        ru: "С прямого пути в половине наших дней"
        note: "tor — путь, колея; w połowie dni — «на середине жизни», Данте 35 лет"
      - pl: "\nWszedłem w las ciemny; jaka gęstwa dzika,"
        ru: "я вошёл в тёмный лес; какая дикая чаща,"
        note: "gęstwa — устар. «чаща», ср. gęsty"
      - pl: "\nJakie w tym lesie okropne pustkowie,"
        ru: "какая в этом лесу страшная пустошь,"
        note: "pustkowie — пустошь, безлюдье"
      - pl: "\nŻyjący język tego nie wypowie;"
        ru: "живой язык этого не выскажет;"
        note: "wypowiedzieć — высказать"
      - pl: "\nWspomnienie gorzkie i zgrozą przenika,"
        ru: "воспоминание горькое и ужасом пронзает,"
        note: "zgroza — ужас; przenikać — пронизывать"
      - pl: "\nŚmierć odeń gorzką nie więcej być może."
        ru: "сама смерть едва ли горше его."
        note: "odeń = od niego — «чем оно» (устар. слитная форма)"
    words: { "toru": tor, "ciemny": ciemny, "lesie": las, "język": jezyk, "wypowie": wypowiedziec, "gorzkie": gorzki }
  - clean: "Lecz o pomocach mówiąc dobroczynnych,\nJakie spotkałem, zszedłszy w to rozdroże,\nPowiem, com widział, wiele rzeczy innych.\nJak w ten las wszedłem, przypomnieć nie mogę.\nSenny, prawdziwą opuściłem drogę.\nLedwo mnie dzika przywiodła drożyna\nPod górę, gdzie się kończyła dolina,\nW której mi serce zakrzepło od trwogi."
    verse: true
    chunks:
      - pl: "Lecz o pomocach mówiąc dobroczynnych,"
        ru: "Но, говоря о благодетельной помощи,"
        note: "dobroczynny — благодетельный"
      - pl: "\nJakie spotkałem, zszedłszy w to rozdroże,"
        ru: "которую я встретил, спустившись на это распутье,"
        note: "zszedłszy — деепричастие прошедшего: «спустившись»; rozdroże — распутье"
      - pl: "\nPowiem, com widział, wiele rzeczy innych."
        ru: "скажу, что я видел, много иного."
        note: "com = co + -m (co widziałem): старинное прикрепление личного окончания к первому слову"
      - pl: "\nJak w ten las wszedłem, przypomnieć nie mogę."
        ru: "Как я вошёл в этот лес, вспомнить не могу."
      - pl: "\nSenny, prawdziwą opuściłem drogę."
        ru: "Сонный, я покинул истинный путь."
      - pl: "\nLedwo mnie dzika przywiodła drożyna"
        ru: "Едва дикая тропинка привела меня"
        note: "drożyna — тропинка, уменьш. от droga"
      - pl: "\nPod górę, gdzie się kończyła dolina,"
        ru: "к горе, где кончалась долина,"
      - pl: "\nW której mi serce zakrzepło od trwogi."
        ru: "в которой сердце моё застыло от страха."
        note: "zakrzepnąć — застыть, свернуться (о крови); trwoga — книжн. «страх, тревога»"
    words: { "zszedłszy": zejsc, "przypomnieć": przypomniec, "opuściłem": opuscic, "Ledwo": ledwo, "kończyła": konczyc, "dolina": dolina }
  - clean: "Podniosłem oczy, wierzch góry wschodzące\nW promienie złote ubierało słońce:\nPewny przewodnik nasz na wszystkie drogi.\nWtenczas uciszył strach mój, choć niesporo,\nWzburzone serca mojego jezioro,\nGdy w tę noc straszną ziębiły mnie dreszcze."
    verse: true
    chunks:
      - pl: "Podniosłem oczy, wierzch góry wschodzące"
        ru: "Я поднял глаза: вершину горы восходящее"
        note: "wierzch — верх, вершина"
      - pl: "\nW promienie złote ubierało słońce:"
        ru: "в золотые лучи одевало солнце:"
      - pl: "\nPewny przewodnik nasz na wszystkie drogi."
        ru: "надёжный наш проводник на всех дорогах."
      - pl: "\nWtenczas uciszył strach mój, choć niesporo,"
        ru: "Тогда оно уняло мой страх, хоть и не сразу,"
        note: "niesporo — устар. «нескоро, с трудом»"
      - pl: "\nWzburzone serca mojego jezioro,"
        ru: "взволнованное озеро моего сердца,"
        note: "jezioro serca — «озеро сердца», образ Данте (lago del cor)"
      - pl: "\nGdy w tę noc straszną ziębiły mnie dreszcze."
        ru: "когда в эту страшную ночь меня бил озноб."
        note: "ziębić — студить; dreszcze — озноб, дрожь"
    words: { "promienie": promien, "ubierało": ubierac, "przewodnik": przewodnik, "uciszył": uciszyc, "strach": strach, "jezioro": jezioro }
  - clean: "I jak tonący, gdy z morza wyskoczy,\nDysząc piersiami rozbit nieszczęśliwy,\nKu niebezpiecznym wodom zwraca oczy,\nPodobnie duch mój w ten spacer złowrogi,\nSkąd nigdy człowiek nie wychodzi żywy,\nSpojrzał za siebie, choć uciekał jeszcze."
    verse: true
    chunks:
      - pl: "I jak tonący, gdy z morza wyskoczy,"
        ru: "И как утопающий, выбравшись из моря,"
        note: "tonący — причастие: «тонущий, утопающий»"
      - pl: "\nDysząc piersiami rozbit nieszczęśliwy,"
        ru: "задыхаясь грудью, несчастный потерпевший крушение,"
        note: "dyszeć — тяжело дышать; rozbit — устар. краткая форма: «разбитый»"
      - pl: "\nKu niebezpiecznym wodom zwraca oczy,"
        ru: "обращает глаза к опасным водам,"
        note: "ku + дат. п. — к"
      - pl: "\nPodobnie duch mój w ten spacer złowrogi,"
        ru: "так и мой дух на этом зловещем пути,"
        note: "spacer здесь — «путь, хождение», не «прогулка»; złowrogi — зловещий"
      - pl: "\nSkąd nigdy człowiek nie wychodzi żywy,"
        ru: "откуда человек никогда не выходит живым,"
      - pl: "\nSpojrzał za siebie, choć uciekał jeszcze."
        ru: "оглянулся назад, хоть ещё бежал."
        note: "spojrzeć za siebie — оглянуться"
    words: { "wyskoczy": wyskoczyc, "piersiami": piers, "nieszczęśliwy": nieszczesliwy, "zwraca": zwracac, "Podobnie": podobnie, "złowrogi": zlowrogi }
  - clean: "Wytchnąwszy trochę zmordowanym ciałem,\nRuszyłem kroku, ale jeszcze stałem\nSilnie tą stopą, co była najniżej.\nI oto w chwili, gdym postąpił wyżej,\nPantera z góry, pochyłą jej ścianą,\nBiegła okryta skórą cętkowaną;\nZwinna i rącza, ile pomnieć mogę,\nTak mi stanowczo zastąpiła drogę,\nŻe nieraz cofać wstecz musiałem nogę."
    verse: true
    chunks:
      - pl: "Wytchnąwszy trochę zmordowanym ciałem,"
        ru: "Передохнув немного измученным телом,"
        note: "wytchnąć — передохнуть; zmordowany — измученный"
      - pl: "\nRuszyłem kroku, ale jeszcze stałem"
        ru: "я двинулся в путь, но всё ещё стоял"
        note: "ruszyć kroku — устар. «двинуться шагом»"
      - pl: "\nSilnie tą stopą, co była najniżej."
        ru: "твёрдо на той ноге, что была ниже."
        note: "то есть шёл вверх по склону"
      - pl: "\nI oto w chwili, gdym postąpił wyżej,"
        ru: "И вот, в тот миг, как я ступил выше,"
        note: "gdym = gdy + -m (gdy postąpiłem)"
      - pl: "\nPantera z góry, pochyłą jej ścianą,"
        ru: "пантера с горы, по её покатому склону,"
        note: "pochyły — наклонный, покатый; ściana — здесь «склон»"
      - pl: "\nBiegła okryta skórą cętkowaną;"
        ru: "бежала, покрытая пятнистой шкурой;"
        note: "cętkowany — пятнистый"
      - pl: "\nZwinna i rącza, ile pomnieć mogę,"
        ru: "ловкая и быстрая, сколько я могу помнить,"
        note: "rączy — книжн. «быстроногий»; pomnieć — устар. «помнить»"
      - pl: "\nTak mi stanowczo zastąpiła drogę,"
        ru: "так решительно преградила мне дорогу,"
        note: "zastąpić drogę — преградить путь"
      - pl: "\nŻe nieraz cofać wstecz musiałem nogę."
        ru: "что не раз мне приходилось отступать назад."
        note: "cofać nogę — отводить ногу, отступать"
    words: { "najniżej": nisko, "postąpił": postapic, "stanowczo": stanowczo, "zastąpiła": zastapic, "cofać": cofac, "wstecz": wstecz }
  - clean: "Był ranek, słońce wschodziło na niebie,\nMając też same gwiazdy wkoło siebie,\nGdy boża miłość te tak piękne twory\nNowymi pchnęła po raz pierwszy tory.\nPoranek, wiosna rzeźwiąca naturę,\nBudziły we mnie nadzieję różową,\nŻe świetną zwierza upoluję skórę,\nChoć nie bez trwogi. Gdy przeszła pantera,\nLew szedł naprzeciw i z zadartą głową\nGłodowym rykiem grzmiał na paszczę całą,\nZda się powietrze od przestrachu drżało."
    verse: true
    chunks:
      - pl: "Był ranek, słońce wschodziło na niebie,"
        ru: "Было утро, солнце всходило на небе,"
      - pl: "\nMając też same gwiazdy wkoło siebie,"
        ru: "имея вокруг себя те же самые звёзды,"
        note: "wkoło — вокруг; по преданию, мир был сотворён весной, при солнце в созвездии Овна"
      - pl: "\nGdy boża miłość te tak piękne twory"
        ru: "когда Божья любовь эти столь прекрасные творенья"
        note: "twór — творение"
      - pl: "\nNowymi pchnęła po raz pierwszy tory."
        ru: "впервые двинула новыми путями."
      - pl: "\nPoranek, wiosna rzeźwiąca naturę,"
        ru: "Утро, весна, освежающая природу,"
        note: "rzeźwić — освежать, бодрить"
      - pl: "\nBudziły we mnie nadzieję różową,"
        ru: "пробуждали во мне радужную надежду,"
        note: "różowa nadzieja — «розовая», то есть радужная надежда"
      - pl: "\nŻe świetną zwierza upoluję skórę,"
        ru: "что я добуду прекрасную шкуру зверя,"
        note: "zwierz — книжн. «зверь»; upolować — добыть на охоте"
      - pl: "\nChoć nie bez trwogi. Gdy przeszła pantera,"
        ru: "хоть и не без страха. Когда прошла пантера,"
      - pl: "\nLew szedł naprzeciw i z zadartą głową"
        ru: "лев шёл навстречу и с задранной головой"
        note: "zadarty — задранный"
      - pl: "\nGłodowym rykiem grzmiał na paszczę całą,"
        ru: "голодным рыком гремел во всю пасть,"
        note: "paszcza — пасть"
      - pl: "\nZda się powietrze od przestrachu drżało."
        ru: "казалось, воздух дрожал от испуга."
        note: "zda się = zdaje się — кажется; przestrach — испуг"
    words: { "Poranek": poranek, "wiosna": wiosna, "naturę": natura, "Budziły": budzic, "różową": rozowy, "zwierza": zwierz }
  - clean: "W ślad szła wilczyca z wpadłymi bokami,\nJakby żądz wszystkich wyschła suchotami,\nDla której nędzą część świata przymiera.\nPrzez strach, co na mnie spoglądał z jej oczu,\nCzułem się w jakimś bezwładnym omroczu,\nWstąpić na górę straciłem nadzieję."
    verse: true
    chunks:
      - pl: "W ślad szła wilczyca z wpadłymi bokami,"
        ru: "Следом шла волчица с впалыми боками,"
        note: "w ślad — следом; wpadły — впалый"
      - pl: "\nJakby żądz wszystkich wyschła suchotami,"
        ru: "словно иссохшая от чахотки всех вожделений,"
        note: "żądza — вожделение, страсть; suchoty — устар. «чахотка»"
      - pl: "\nDla której nędzą część świata przymiera."
        ru: "из-за которой полмира прозябает в нищете."
        note: "przymierać nędzą — бедствовать, перебиваться впроголодь"
      - pl: "\nPrzez strach, co na mnie spoglądał z jej oczu,"
        ru: "От страха, что глядел на меня из её глаз,"
      - pl: "\nCzułem się w jakimś bezwładnym omroczu,"
        ru: "я чувствовал себя в каком-то бессильном помрачении,"
        note: "bezwładny — бессильный, неподвижный; omrocz — устар. «помрачение, обморок»"
      - pl: "\nWstąpić na górę straciłem nadzieję."
        ru: "потерял надежду подняться на гору."
        note: "wstąpić — взойти"
    words: { "ślad": slad, "bokami": bok, "nędzą": nedza, "spoglądał": spogladac, "bezwładnym": bezwladny, "Wstąpić": wstapic }
  - clean: "Jak ten, co w zysku z nałogu podoba,\nGdy przyjdzie strata, los i siebie wini,\nPłacze, wszystkimi myślami boleje,\nW takiej wilczyca stawiła mnie doli;\nPchnąc mnie przed sobą, powoli, powoli,\nW końcu zepchnęła tam, gdzie milczy słońce."
    verse: true
    chunks:
      - pl: "Jak ten, co w zysku z nałogu podoba,"
        ru: "Как тот, кто в наживе по привычке находит удовольствие,"
        note: "nałóg — привычка, пристрастие; (się) podobać — нравиться"
      - pl: "\nGdy przyjdzie strata, los i siebie wini,"
        ru: "когда придёт утрата, винит и судьбу, и себя,"
        note: "winić — винить"
      - pl: "\nPłacze, wszystkimi myślami boleje,"
        ru: "плачет, всеми помыслами скорбит,"
        note: "boleć nad czymś — скорбеть"
      - pl: "\nW takiej wilczyca stawiła mnie doli;"
        ru: "в такую участь поставила меня волчица;"
        note: "dola — доля, участь; stawić — устар. «поставить»"
      - pl: "\nPchnąc mnie przed sobą, powoli, powoli,"
        ru: "толкая меня перед собой, медленно, медленно,"
        note: "pchnąc — так в тексте Korsaka вместо pchnąwszy, «толкнув»"
      - pl: "\nW końcu zepchnęła tam, gdzie milczy słońce."
        ru: "наконец столкнула туда, где молчит солнце."
        note: "zepchnąć — столкнуть; «где молчит солнце» — во тьму"
    words: { "zysku": zysk, "wini": winic, "myślami": mysl, "stawiła": stawic, "powoli": powoli, "milczy": milczec }
  - clean: "Kiedym w dolinę cofał kroki drżące,\nPatrzę, aż jakaś przede mną osoba\nDługim milczeniem ochrypiała stoi.\nLedwiem ją zoczył na wielkiej pustyni,\nKrzyknąłem: «Błagam, bądź mi litościwym,\nKto jesteś, marą, czy człowiekiem żywym?»"
    verse: true
    chunks:
      - pl: "Kiedym w dolinę cofał kroki drżące,"
        ru: "Когда я отступал в долину дрожащими шагами,"
        note: "kiedym = kiedy + -m (kiedy cofałem)"
      - pl: "\nPatrzę, aż jakaś przede mną osoba"
        ru: "смотрю — вдруг передо мной какая-то фигура,"
        note: "patrzę, aż… — смотрю — и вдруг…; osoba — здесь «фигура, существо»"
      - pl: "\nDługim milczeniem ochrypiała stoi."
        ru: "от долгого молчания охрипшая, стоит."
        note: "ochrypnąć — охрипнуть"
      - pl: "\nLedwiem ją zoczył na wielkiej pustyni,"
        ru: "Едва я её заметил в великой пустыне,"
        note: "ledwiem = ledwo + -m; zoczyć — устар. «завидеть, заметить»"
      - pl: "\nKrzyknąłem: «Błagam, bądź mi litościwym,"
        ru: "я крикнул: «Молю, будь милосерден ко мне,"
        note: "być litościwym — творит. п. при być: «быть милосердным»"
      - pl: "\nKto jesteś, marą, czy człowiekiem żywym?»"
        ru: "кто бы ты ни был — призрак или живой человек?»"
        note: "mara — призрак, видение"
    words: { "Patrzę": patrzec, "osoba": osoba, "wielkiej": wielki, "pustyni": pustynia, "Błagam": blagac, "żywym": zywy }
  - clean: "Głos rzekł: «człowiekiem nie jestem, lecz byłem,\nMantuańczycy są rodzice moi,\nPod Julijuszem wszedłem na próg świata,\nPóźno, ostatnie gdy doliczał lata.\nW Rzymie wesoło pod Augustem żyłem,\nGdy bogom fałszu stawiano ołtarze."
    verse: true
    chunks:
      - pl: "Głos rzekł: «człowiekiem nie jestem, lecz byłem,"
        ru: "Голос сказал: «Я не человек, но был им,"
        note: "rzec, rzekł — книжн. «сказать»"
      - pl: "\nMantuańczycy są rodzice moi,"
        ru: "мантуанцы — мои родители,"
        note: "Mantuańczyk — житель Мантуи"
      - pl: "\nPod Julijuszem wszedłem na próg świata,"
        ru: "при Юлии я вступил на порог мира,"
        note: "Julijusz — Юлий Цезарь; wejść na próg świata — родиться"
      - pl: "\nPóźno, ostatnie gdy doliczał lata."
        ru: "поздно, когда он досчитывал последние годы."
        note: "doliczać — досчитывать"
      - pl: "\nW Rzymie wesoło pod Augustem żyłem,"
        ru: "В Риме я весело жил при Августе,"
      - pl: "\nGdy bogom fałszu stawiano ołtarze."
        ru: "когда ложным богам ставили алтари."
        note: "bogowie fałszu — «боги лжи», языческие боги"
    words: { "Głos": glos, "rzekł": rzec, "rodzice": rodzice, "próg": prog, "stawiano": stawiac, "ołtarze": oltarz }
  - clean: "Byłem poetą i śpiewałem męża\nZ krwi Anchizesa, który przybył z Troi,\nGród Ilijonu, gdy dymił w pożarze.\nLecz ty, czy dawna troska cię zwycięża,\nCzemu dojść nie chcesz tej pięknej wyżyny,\nPełnego szczęścia źródła i przyczyny?»"
    verse: true
    chunks:
      - pl: "Byłem poetą i śpiewałem męża"
        ru: "Я был поэтом и воспел мужа"
        note: "śpiewać kogoś — воспевать кого-л. (вин. п.)"
      - pl: "\nZ krwi Anchizesa, który przybył z Troi,"
        ru: "от крови Анхиза, который прибыл из Трои,"
        note: "Anchizes — Анхиз, отец Энея"
      - pl: "\nGród Ilijonu, gdy dymił w pożarze."
        ru: "когда град Илион дымился в пожаре."
        note: "gród — устар. «град, город»"
      - pl: "\nLecz ty, czy dawna troska cię zwycięża,"
        ru: "Но ты — неужели давняя тревога тебя одолевает,"
        note: "zwyciężać — побеждать, одолевать"
      - pl: "\nCzemu dojść nie chcesz tej pięknej wyżyny,"
        ru: "почему ты не хочешь достичь этой прекрасной высоты,"
        note: "dojść czegoś — устар. «дойти до чего-л.» с род. п.; wyżyna — возвышенность"
      - pl: "\nPełnego szczęścia źródła i przyczyny?»"
        ru: "источника и причины полного счастья?»"
    words: { "poetą": poeta, "śpiewałem": spiewac, "pożarze": pozar, "troska": troska, "źródła": zrodlo, "przyczyny": przyczyna }
  - clean: "Odrzekłem, wstydem czerwieniąc me czoło:\n«Tyżeś Wirgili? Zdroju, co daleko\nTryskasz szeroką poezyi rzeką,\nZaszczycie, światło spółpoetów tylu,\nJam pieśń twą zbadał jak nikt może drugi,\nZ wielką miłością i długim mozołem,\nPolicz to teraz na karb mej zasługi!"
    verse: true
    chunks:
      - pl: "Odrzekłem, wstydem czerwieniąc me czoło:"
        ru: "Я ответил, заливая стыдом своё чело:"
        note: "czerwienić — красить в красный; czoło — лоб, чело"
      - pl: "\n«Tyżeś Wirgili? Zdroju, co daleko"
        ru: "«Так ты Вергилий? Родник, что далеко"
        note: "tyżeś = ty + -że + -ś: «так это ты…»; zdrój — родник, источник"
      - pl: "\nTryskasz szeroką poezyi rzeką,"
        ru: "бьёшь широкой рекой поэзии,"
        note: "tryskać — бить струёй; poezyi — старое написание poezji"
      - pl: "\nZaszczycie, światło spółpoetów tylu,"
        ru: "честь и свет стольких собратьев-поэтов,"
        note: "zaszczyt — честь; spółpoeta — устар. «собрат-поэт» (spół- = współ-)"
      - pl: "\nJam pieśń twą zbadał jak nikt może drugi,"
        ru: "я изучил твою песнь, как, может, никто другой,"
        note: "jam = ja + -m (ja zbadałem)"
      - pl: "\nZ wielką miłością i długim mozołem,"
        ru: "с великой любовью и долгим трудом,"
        note: "mozół — тяжкий труд"
      - pl: "\nPolicz to teraz na karb mej zasługi!"
        ru: "зачти это теперь мне в заслугу!"
        note: "policzyć na karb czegoś — зачесть, отнести на счёт"
    words: { "szeroką": szeroki, "Zaszczycie": zaszczyt, "pieśń": piesn, "zbadał": zbadac, "Policz": policzyc, "zasługi": zasluga }
  - clean: "Mistrzu! Od ciebie wziąłem piękno stylu,\nCo mnie tak wielkim honorem zaszczyca.\nPatrz, oto za mną w ślad pędzi wilczyca,\nBroń mnie! Patrz, chudą jak wyciąga szyję,\nDrżą we mnie żyły, krew pulsami bije».\nWidząc mnie we łzach mędrzec tak powiada:\n«Inną idź drogą, taka moja rada,\nJeśli chcesz umknąć z tej dzikiej ustroni;\nZwierzę to często podróżnych napada,\nZachodzi w drogę, pożre, gdy dogoni."
    verse: true
    chunks:
      - pl: "Mistrzu! Od ciebie wziąłem piękno stylu,"
        ru: "Учитель! От тебя я взял красоту слога,"
        note: "styl — стиль, слог"
      - pl: "\nCo mnie tak wielkim honorem zaszczyca."
        ru: "что приносит мне такую великую честь."
        note: "zaszczycać — оказывать честь"
      - pl: "\nPatrz, oto za mną w ślad pędzi wilczyca,"
        ru: "Смотри, вот за мной по следу гонится волчица,"
        note: "pędzić — мчаться, гнаться"
      - pl: "\nBroń mnie! Patrz, chudą jak wyciąga szyję,"
        ru: "защити меня! Смотри, как тощую вытягивает шею,"
        note: "wyciągać — вытягивать"
      - pl: "\nDrżą we mnie żyły, krew pulsami bije»."
        ru: "дрожат во мне жилы, кровь бьётся толчками»."
        note: "żyła — жила, вена; puls — пульс, толчок"
      - pl: "\nWidząc mnie we łzach mędrzec tak powiada:"
        ru: "Видя меня в слезах, мудрец так говорит:"
        note: "mędrzec — мудрец"
      - pl: "\n«Inną idź drogą, taka moja rada,"
        ru: "«Иди другой дорогой, таков мой совет,"
      - pl: "\nJeśli chcesz umknąć z tej dzikiej ustroni;"
        ru: "если хочешь ускользнуть из этой дикой глуши;"
        note: "umknąć — ускользнуть; ustroń — глушь, уединённое место"
      - pl: "\nZwierzę to często podróżnych napada,"
        ru: "этот зверь часто нападает на путников,"
        note: "napadać na kogoś или kogoś (устар.) — нападать"
      - pl: "\nZachodzi w drogę, pożre, gdy dogoni."
        ru: "заступает дорогу, пожирает, когда догонит."
        note: "pożreć — сожрать"
    words: { "pędzi": pedzic, "chudą": chudy, "wyciąga": wyciagac, "pulsami": puls, "łzach": lza, "dogoni": dogonic }
  - clean: "Zwierzę to niczym chuci nie ostudza,\nW nim nowy pokarm nowy głód rozbudza.\nWiele jest zwierząt, z którymi się para,\nI więcej będzie; lecz wilczyca stara\nW paszczę brytana gdy przyjdzie, zachrzęści.\nNa koniec skona w mękach i boleści."
    verse: true
    chunks:
      - pl: "Zwierzę to niczym chuci nie ostudza,"
        ru: "Этот зверь ничем похоти не остужает,"
        note: "chuć — похоть, алчность; ostudzać — остужать"
      - pl: "\nW nim nowy pokarm nowy głód rozbudza."
        ru: "в нём новая пища новый голод пробуждает."
        note: "pokarm — пища, корм"
      - pl: "\nWiele jest zwierząt, z którymi się para,"
        ru: "Много есть зверей, с которыми она спаривается,"
        note: "parać się — здесь «спариваться», обычно «заниматься чем-л.»"
      - pl: "\nI więcej będzie; lecz wilczyca stara"
        ru: "и будет больше; но старая волчица,"
        note: "będzie więcej — «будет больше» (подразумевается: зверей)"
      - pl: "\nW paszczę brytana gdy przyjdzie, zachrzęści."
        ru: "попав в пасть пса, захрустит."
        note: "brytan — устар. «боевой пёс, волкодав», у Данте Veltro, Пёс-освободитель"
      - pl: "\nNa koniec skona w mękach i boleści."
        ru: "Наконец издохнет в муках и боли."
        note: "skonać — испустить дух"
    words: { "nowy": nowy, "głód": glod, "którymi": ktory, "przyjdzie": przyjsc, "koniec": koniec }
  - clean: "Ziemia i kruszec głodu w nim nie wzmaga,\nŻywi go miłość, mądrość i odwaga;\nOn między Feltro a Feltrem się zjawi,\nUpokorzoną Italiję zbawi,\nDla której prócz tych, co rym nie wylicza,\nUmarli Turnus, Kamilla dziewicza."
    verse: true
    chunks:
      - pl: "Ziemia i kruszec głodu w nim nie wzmaga,"
        ru: "Земля и металл не разжигают в нём голода,"
        note: "kruszec — металл, руда; wzmagać — усиливать"
      - pl: "\nŻywi go miłość, mądrość i odwaga;"
        ru: "питают его любовь, мудрость и отвага;"
        note: "żywić — питать, кормить"
      - pl: "\nOn między Feltro a Feltrem się zjawi,"
        ru: "он явится между Фельтро и Фельтро,"
        note: "между двумя Фельтро — загадочное место рождения Пса"
      - pl: "\nUpokorzoną Italiję zbawi,"
        ru: "униженную Италию спасёт,"
        note: "Italija — устар. «Италия»; zbawić — спасти"
      - pl: "\nDla której prócz tych, co rym nie wylicza,"
        ru: "за которую, кроме тех, кого рифма не перечислит,"
        note: "wyliczać — перечислять"
      - pl: "\nUmarli Turnus, Kamilla dziewicza."
        ru: "умерли Турн, Камилла-дева."
        note: "Turnus, Kamilla — герои «Энеиды»"
    words: { "Ziemia": ziemia, "miłość": milosc, "mądrość": madrosc, "odwaga": odwaga, "zjawi": zjawic, "Upokorzoną": upokorzyc }
  - clean: "Podłą wilczycę, jej plemię wszeteczne,\nPrzepędzi z grodów jego ręka chrobra,\nW końcu w triumfie strąci ją do piekła,\nSkąd pierwsza zazdrość na świat ją wywlekła.\nTeraz ci radzę dla twojego dobra,\nIdź za mną, będę twoim przewodnikiem\nI przeprowadzę przez królestwo wieczne."
    verse: true
    chunks:
      - pl: "Podłą wilczycę, jej plemię wszeteczne,"
        ru: "Подлую волчицу, её распутное племя,"
        note: "wszeteczny — устар. «распутный, бесстыдный»"
      - pl: "\nPrzepędzi z grodów jego ręka chrobra,"
        ru: "изгонит из городов его храбрая рука,"
        note: "chrobry — книжн. «храбрый» (ср. Bolesław Chrobry)"
      - pl: "\nW końcu w triumfie strąci ją do piekła,"
        ru: "в конце концов с триумфом низвергнет её в ад,"
        note: "strącić — сбросить, низвергнуть"
      - pl: "\nSkąd pierwsza zazdrość na świat ją wywlekła."
        ru: "откуда первая зависть выволокла её на свет."
        note: "zazdrość — зависть; wywlec — выволочь"
      - pl: "\nTeraz ci radzę dla twojego dobra,"
        ru: "Теперь советую тебе для твоего же блага:"
        note: "dla twojego dobra — для твоего же блага"
      - pl: "\nIdź za mną, będę twoim przewodnikiem"
        ru: "иди за мной, я буду твоим проводником"
      - pl: "\nI przeprowadzę przez królestwo wieczne."
        ru: "и проведу через вечное царство."
    words: { "Podłą": podly, "plemię": plemie, "radzę": radzic, "przeprowadzę": przeprowadzic, "królestwo": krolestwo, "wieczne": wieczny }
  - clean: "Tam płacz posłyszysz z rozpaczy wykrzykiem,\nTam starożytne ujrzysz potępieńce,\nCo o śmierć drugą wołają w swej męce,\nI tych, co radzi w płomieniu goreją\nZ cichym wytrwaniem, bo żyją nadzieją\nSpółobcowania z błogosławionymi;\nChcesz dojść aż do nich i pogościć z nimi;\nTam duch godniejszy wprowadzi już ciebie."
    verse: true
    chunks:
      - pl: "Tam płacz posłyszysz z rozpaczy wykrzykiem,"
        ru: "Там услышишь плач с криком отчаяния,"
        note: "wykrzyk — возглас, крик"
      - pl: "\nTam starożytne ujrzysz potępieńce,"
        ru: "там увидишь древних осуждённых,"
        note: "potępieniec — осуждённый, проклятый (на вечные муки)"
      - pl: "\nCo o śmierć drugą wołają w swej męce,"
        ru: "что о второй смерти взывают в своей муке,"
        note: "wołać o coś — взывать о чём-л., просить"
      - pl: "\nI tych, co radzi w płomieniu goreją"
        ru: "и тех, кто охотно горит в пламени"
        note: "radzi — устар. «рады», мн. ч. от rad; goreć — книжн. «гореть»"
      - pl: "\nZ cichym wytrwaniem, bo żyją nadzieją"
        ru: "с тихим терпением, ибо живут надеждой"
        note: "wytrwanie — стойкость, терпение"
      - pl: "\nSpółobcowania z błogosławionymi;"
        ru: "на общение с блаженными;"
        note: "spółobcowanie — устар. «общение» (ср. współobcowanie świętych)"
      - pl: "\nChcesz dojść aż do nich i pogościć z nimi;"
        ru: "ты хочешь дойти до них и погостить с ними;"
        note: "pogościć — погостить"
      - pl: "\nTam duch godniejszy wprowadzi już ciebie."
        ru: "туда тебя уже введёт более достойный дух."
        note: "godniejszy — сравнит. от godny"
    words: { "rozpaczy": rozpacz, "starożytne": starozytny, "wołają": wolac, "płomieniu": plomien, "błogosławionymi": blogoslawic, "godniejszy": godny }
  - clean: "Bo królujący na wysokim niebie\nNie chce, by tacy, co ufają we mnie,\nW królestwo Jego wchodzili przeze mnie,\nNieposłusznego Jego wierze świętej.\nOn świat ma u stóp swojej wielmożności,\nTron Jego twierdzą tam na wysokości,\nBłogi, kto w poczet Jego sług przyjęty»."
    verse: true
    chunks:
      - pl: "Bo królujący na wysokim niebie"
        ru: "Ибо Царствующий на высоком небе"
        note: "królujący — причастие: «царствующий»"
      - pl: "\nNie chce, by tacy, co ufają we mnie,"
        ru: "не хочет, чтобы такие, кто уповает на меня,"
        note: "ufać w kogoś — уповать на кого-л."
      - pl: "\nW królestwo Jego wchodzili przeze mnie,"
        ru: "входили в царство Его через меня,"
        note: "przeze mnie — «через меня» (przez + mnie)"
      - pl: "\nNieposłusznego Jego wierze świętej."
        ru: "непокорного Его святой вере."
        note: "Вергилий — язычник, не знавший Христа"
      - pl: "\nOn świat ma u stóp swojej wielmożności,"
        ru: "Он мир держит у подножия своего величия,"
        note: "wielmożność — устар. «величие, могущество»"
      - pl: "\nTron Jego twierdzą tam na wysokości,"
        ru: "престол Его — твердыня там, на высоте,"
        note: "twierdza — крепость, твердыня"
      - pl: "\nBłogi, kto w poczet Jego sług przyjęty»."
        ru: "блажен, кто принят в число Его слуг»."
        note: "błogi — блаженный; poczet — число, ряды"
    words: { "niebie": niebo, "wierze": wiara, "stóp": stopa, "Tron": tron, "wysokości": wysokosc, "sług": sluga }
  - clean: "«Poeto!» rzekłem, «wzywam cię na Boga,\nKtóregoś nie znał, jeśli chcesz, bym zdrowo\nMiejsc tych uniknął według twojej rady,\nAlbo, co gorsze, wilczycy paszczęki:\nProwadź, gdzieś mówił! Moją twoja droga,\nAbym oglądać mógł bramę Piotrową\nI tych, co cierpią wiekuiste męki».\nDuch ruszył naprzód, jam szedł w jego ślady."
    verse: true
    chunks:
      - pl: "«Poeto!» rzekłem, «wzywam cię na Boga,"
        ru: "«Поэт! — сказал я, — заклинаю тебя Богом,"
        note: "wzywać na Boga — заклинать Богом"
      - pl: "\nKtóregoś nie znał, jeśli chcesz, bym zdrowo"
        ru: "которого ты не знал: если хочешь, чтобы я благополучно"
        note: "któregoś = którego + -ś (którego nie znałeś)"
      - pl: "\nMiejsc tych uniknął według twojej rady,"
        ru: "этих мест избежал по твоему совету,"
        note: "uniknąć czegoś — избежать (род. п.)"
      - pl: "\nAlbo, co gorsze, wilczycy paszczęki:"
        ru: "или, что хуже, пасти волчицы:"
        note: "paszczęki — челюсти, пасть"
      - pl: "\nProwadź, gdzieś mówił! Moją twoja droga,"
        ru: "веди, куда ты говорил! Твой путь — мой,"
        note: "gdzieś = gdzie + -ś (gdzie mówiłeś), не «где-то»"
      - pl: "\nAbym oglądać mógł bramę Piotrową"
        ru: "чтобы я мог узреть врата Петровы"
        note: "brama Piotrowa — врата святого Петра"
      - pl: "\nI tych, co cierpią wiekuiste męki»."
        ru: "и тех, кто терпит вечные муки»."
        note: "wiekuisty — книжн. «вечный»"
      - pl: "\nDuch ruszył naprzód, jam szedł w jego ślady."
        ru: "Дух двинулся вперёд, я пошёл по его следам."
        note: "iść w czyjeś ślady — идти по следам"
    words: { "wzywam": wzywac, "uniknął": uniknac, "bramę": brama, "cierpią": cierpiec, "ruszył": ruszyc, "naprzód": naprzod }
