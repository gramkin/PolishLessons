chapter: 16
chapterTitle: "Pieśń XVI"
chapterTitleRu: "Песнь XVI. Марко Ломбардец"
level: B2
paragraphs:
  - clean: "(Marko Lombardo mówi o dwu słońcach. Dantego zapatrywania polityczne.)"
    chunks:
      - pl: "(Marko Lombardo mówi o dwu słońcach. Dantego zapatrywania polityczne.)"
        ru: "(Марко Ломбардец говорит о двух солнцах. Политические взгляды Данте.)"
        note: "zapatrywania — взгляды"
    words: { "mówi": mowic, "słońcach": slonce, "polityczne": polityczny }
  - clean: "Ciemność piekielnej nocy pozbawionej\nGwiazd i księżyca, grubszej, o nie kłamię!\nNa wzrok nie mogła narzucić zasłony,\nJak dym, co wtenczas skrył nas w swej omroczy:\nGryzące dymy zamykały oczy.\nWódz podszedł do mnie i podał mi ramię."
    verse: true
    chunks:
      - pl: "Ciemność piekielnej nocy pozbawionej"
        ru: "Тьма адской ночи, лишённой"
      - pl: "\nGwiazd i księżyca, grubszej, o nie kłamię!"
        ru: "звёзд и луны, более густая, о, не лгу!"
      - pl: "\nNa wzrok nie mogła narzucić zasłony,"
        ru: "не могла бы набросить на взгляд покрова"
      - pl: "\nJak dym, co wtenczas skrył nas w swej omroczy:"
        ru: "так, как дым, что тогда скрыл нас в своём мраке:"
        note: "omrocz — мрак"
      - pl: "\nGryzące dymy zamykały oczy."
        ru: "едкие дымы закрывали глаза."
      - pl: "\nWódz podszedł do mnie i podał mi ramię."
        ru: "Вождь подошёл ко мне и подал мне плечо."
    words: { "piekielnej": piekielny, "pozbawionej": pozbawic, "wzrok": wzrok, "zasłony": zaslona, "dymy": dym, "Wódz": wodz }
  - clean: "Jak ślepy, aby nie zbłąkać się z drogi\nLub o głaz ostry nie obrazić nogi,\nKrok w krok za swoim przewodnikiem kroczy:\nPodobnie szedłem w tym straszliwym ciemnie,\nWciąż nasłuchując, co mi wódz mój powie;\nWódz mówił: «Strzeż się, nie odchodź ode mnie»."
    verse: true
    chunks:
      - pl: "Jak ślepy, aby nie zbłąkać się z drogi"
        ru: "Как слепой, чтобы не сбиться с дороги"
      - pl: "\nLub o głaz ostry nie obrazić nogi,"
        ru: "или не поранить ногу об острый камень,"
      - pl: "\nKrok w krok za swoim przewodnikiem kroczy:"
        ru: "шаг в шаг шагает за своим проводником:"
      - pl: "\nPodobnie szedłem w tym straszliwym ciemnie,"
        ru: "так я шёл в этой страшной тьме,"
      - pl: "\nWciąż nasłuchując, co mi wódz mój powie;"
        ru: "всё прислушиваясь, что скажет мне мой вождь;"
      - pl: "\nWódz mówił: «Strzeż się, nie odchodź ode mnie»."
        ru: "вождь говорил: «Берегись, не отходи от меня»."
    words: { "ślepy": slepy, "ostry": ostry, "obrazić": obrazic, "przewodnikiem": przewodnik, "Podobnie": podobnie, "Strzeż": strzec }
  - clean: "Słyszałem głosy, jak słowo po słowie\nŚpiewały, żebrząc łaski i pociechy:\n«Baranku Boży, który gładzisz grzechy!»\nOd słów tych zwrotkę poczynając śpiewu.\n— «Słyszę li duchów głosy uroczyste?» —\nA mistrz: «Głos duchów ty słyszysz, zaiste,\nTu one węzeł rozwiązują gniewu»."
    verse: true
    chunks:
      - pl: "Słyszałem głosy, jak słowo po słowie"
        ru: "Я слышал голоса, как слово за словом"
      - pl: "\nŚpiewały, żebrząc łaski i pociechy:"
        ru: "они пели, моля о милости и утешении:"
      - pl: "\n«Baranku Boży, który gładzisz grzechy!»"
        ru: "«Агнец Божий, что берёшь на себя грехи!»"
        note: "gładzić grzechy — брать грехи (мира)"
      - pl: "\nOd słów tych zwrotkę poczynając śpiewu."
        ru: "с этих слов начиная куплет пения."
        note: "zwrotka — куплет"
      - pl: "\n— «Słyszę li duchów głosy uroczyste?» —"
        ru: "— «Не голоса ли духов, торжественные, я слышу?» —"
      - pl: "\nA mistrz: «Głos duchów ty słyszysz, zaiste,"
        ru: "А учитель: «Ты слышишь голоса духов, воистину,"
      - pl: "\nTu one węzeł rozwiązują gniewu»."
        ru: "здесь они развязывают узел гнева»."
    words: { "Śpiewały": spiewac, "Boży": bozy, "grzechy": grzech, "mistrz": mistrz, "węzeł": wezel, "gniewu": gniew }
  - clean: "— «Przerzynający nasze dymy, witaj!\nKtoś jest? Gdy mówisz, widzę z twojej mowy,\nCzas jeszcze liczysz na bieg księżycowy?»\nTak rzekł głos jeden; więc mistrz mówił do mnie:\n«Odpowiedz jemu uważnie a skromnie;\nI kędy tu nam iść wyżej, zapytaj»."
    verse: true
    chunks:
      - pl: "— «Przerzynający nasze dymy, witaj!"
        ru: "— «Ты, что рассекаешь наши дымы, здравствуй!"
      - pl: "\nKtoś jest? Gdy mówisz, widzę z twojej mowy,"
        ru: "Кто ты? Когда ты говоришь, я вижу по твоей речи,"
      - pl: "\nCzas jeszcze liczysz na bieg księżycowy?»"
        ru: "что ты ещё считаешь время по бегу луны?»"
        note: "то есть живой"
      - pl: "\nTak rzekł głos jeden; więc mistrz mówił do mnie:"
        ru: "Так сказал один голос; и учитель сказал мне:"
      - pl: "\n«Odpowiedz jemu uważnie a skromnie;"
        ru: "«Ответь ему внимательно и скромно;"
      - pl: "\nI kędy tu nam iść wyżej, zapytaj»."
        ru: "и спроси, где нам здесь идти выше»."
    words: { "mowy": mowa, "bieg": bieg, "księżycowy": ksiezycowy, "rzekł": rzec, "Odpowiedz": odpowiedziec, "uważnie": uwaznie }
  - clean: "A ja: «Czyszczące swą zmazę stworzenie,\nBy pięknym, obym ja czci takiej dożył!\nWrócić do Tego, który ciebie stworzył:\nDziwy posłyszysz, chciej tylko iść ze mną».\n— «Pójdę, o ile pozwoli to ciemno»,\nDuch odpowiedział, «a jeśli zaćmienie\nDymu obłąka ślad naszego kroku,\nZbliżym się głosem w niedostatku wzroku»."
    verse: true
    chunks:
      - pl: "A ja: «Czyszczące swą zmazę stworzenie,"
        ru: "А я: «Создание, очищающее своё пятно,"
      - pl: "\nBy pięknym, obym ja czci takiej dożył!"
        ru: "чтобы прекрасным — о, если бы и я дожил до такой чести! —"
      - pl: "\nWrócić do Tego, który ciebie stworzył:"
        ru: "вернуться к Тому, кто тебя создал:"
      - pl: "\nDziwy posłyszysz, chciej tylko iść ze mną»."
        ru: "услышишь чудеса, лишь изволь идти со мной»."
      - pl: "\n— «Pójdę, o ile pozwoli to ciemno»,"
        ru: "— «Пойду, насколько позволит эта тьма, —"
      - pl: "\nDuch odpowiedział, «a jeśli zaćmienie"
        ru: "ответил дух, — а если затмение"
      - pl: "\nDymu obłąka ślad naszego kroku,"
        ru: "дыма собьёт с пути след нашего шага,"
      - pl: "\nZbliżym się głosem w niedostatku wzroku»."
        ru: "приблизимся голосом за недостатком зрения»."
        note: "niedostatek — недостаток"
    words: { "Czyszczące": czyscic, "stworzył": stworzyc, "Duch": duch, "ślad": slad, "kroku": krok, "głosem": glos }
  - clean: "— «Tam wyżej niosę ciało skazitelne,\nA tu przyszedłem przez kręgi piekielne,»\nRzekłem, «a jeśli łaska niebios Pana\nDaje mi widzieć blask swojego dworu\nI dojść tam drogą niezwykłego toru,\nPodróż w dzisiejszych czasach niesłychana!"
    verse: true
    chunks:
      - pl: "— «Tam wyżej niosę ciało skazitelne,"
        ru: "— «Там, наверху, я ношу тленное тело,"
        note: "skazitelny — тленный"
      - pl: "\nA tu przyszedłem przez kręgi piekielne,»"
        ru: "а сюда пришёл через адские круги, —"
      - pl: "\nRzekłem, «a jeśli łaska niebios Pana"
        ru: "сказал я, — а если милость Господа небес"
      - pl: "\nDaje mi widzieć blask swojego dworu"
        ru: "даёт мне видеть блеск своего двора"
      - pl: "\nI dojść tam drogą niezwykłego toru,"
        ru: "и дойти туда дорогой необычного пути,"
      - pl: "\nPodróż w dzisiejszych czasach niesłychana!"
        ru: "путешествие, неслыханное в нынешние времена!"
    words: { "niosę": niesc, "kręgi": krag, "niebios": niebiosa, "blask": blask, "dworu": dwor, "toru": tor }
  - clean: "Nie kryj mi twego przedśmiertnego miana\nI czy tu idę dobrze, mów zarazem,\nSłowa twe będą naszym drogoskazem».\n— «Mnie, Marka, matka ma w Lombardii zległa,\nMądrość ma była w sprawach świeckich biegła,\nA prawość moja, cnota z cnót jedyna,\nDo której nikt dziś łuku nie napina."
    verse: true
    chunks:
      - pl: "Nie kryj mi twego przedśmiertnego miana"
        ru: "не скрывай мне своего предсмертного имени"
      - pl: "\nI czy tu idę dobrze, mów zarazem,"
        ru: "и скажи заодно, хорошо ли я здесь иду,"
      - pl: "\nSłowa twe będą naszym drogoskazem»."
        ru: "твои слова будут нашим указателем»."
        note: "drogoskaz — указатель"
      - pl: "\n— «Mnie, Marka, matka ma w Lombardii zległa,"
        ru: "— «Меня, Марко, родила мать в Ломбардии,"
        note: "zlec — родить"
      - pl: "\nMądrość ma była w sprawach świeckich biegła,"
        ru: "мудрость моя была сведуща в мирских делах,"
      - pl: "\nA prawość moja, cnota z cnót jedyna,"
        ru: "а честность моя — добродетель из добродетелей единственная,"
      - pl: "\nDo której nikt dziś łuku nie napina."
        ru: "к которой сегодня никто не натягивает лука."
        note: "то есть никто не стремится"
    words: { "kryj": kryc, "matka": matka, "Mądrość": madrosc, "nikt": nikt, "dziś": dzis, "łuku": luk }
  - clean: "Chcąc iść tam wyżej, prosto idź opoką»,\nDuch odpowiedział i dodał po chwili:\n«Przyczyń się za mną będąc tam wysoko!»\nA ja: «Na wiarę prośba cię nie zmyli,\nAle wątpieniem myśl się moja gmatwa,\nA jej dwoistość zgodzić rzecz niełatwa;\nGdy twoje zdanie obecne rad godzę\nZe zdaniem, co gdzieś słyszałem po drodze."
    verse: true
    chunks:
      - pl: "Chcąc iść tam wyżej, prosto idź opoką»,"
        ru: "Желая идти туда, выше, иди прямо по скале», —"
      - pl: "\nDuch odpowiedział i dodał po chwili:"
        ru: "ответил дух и добавил через минуту:"
      - pl: "\n«Przyczyń się za mną będąc tam wysoko!»"
        ru: "«Заступись за меня, будучи там, наверху!»"
        note: "przyczynić się — заступиться"
      - pl: "\nA ja: «Na wiarę prośba cię nie zmyli,"
        ru: "А я: «Клянусь, просьба тебя не обманет,"
        note: "na wiarę — честное слово"
      - pl: "\nAle wątpieniem myśl się moja gmatwa,"
        ru: "но моя мысль запутывается сомнением,"
        note: "gmatwać się — запутываться"
      - pl: "\nA jej dwoistość zgodzić rzecz niełatwa;"
        ru: "а примирить её двойственность — дело нелёгкое;"
      - pl: "\nGdy twoje zdanie obecne rad godzę"
        ru: "когда я охотно согласую твоё нынешнее мнение"
      - pl: "\nZe zdaniem, co gdzieś słyszałem po drodze."
        ru: "с мнением, что я где-то слышал по дороге."
        note: "у Гвидо дель Дука"
    words: { "dodał": dodac, "wiarę": wiara, "prośba": prosba, "wątpieniem": watpic, "zgodzić": zgodzic, "drodze": droga }
  - clean: "Więc świat bez cnoty, w swoich sądach zmienny,\nJak mi powiadasz, a złością brzemienny:\nChciej tę przyczynę wyłuszczyć tak jasno,\nAbym mógł drugich oświecić przez ciebie,\nTen jej na ziemi, drugi szuka w niebie».\nDuch tchnął boleścią w głębokim westchnieniu\nI tak jął mówić po krótkim milczeniu:\n«Bracie, świat ślepy, zdradzasz mową własną,\nŻe stamtąd idziesz: wy, którzy żyjecie,\nW niebie szukacie wszech przyczyn na świecie,\nJakby rzecz każda, jak wielka, tak mała,\nKoniecznie z jego woli się ruszała:"
    verse: true
    chunks:
      - pl: "Więc świat bez cnoty, w swoich sądach zmienny,"
        ru: "Итак, мир без добродетели, изменчив в своих суждениях,"
      - pl: "\nJak mi powiadasz, a złością brzemienny:"
        ru: "как ты мне говоришь, и чреват злобой:"
        note: "brzemienny — чреватый"
      - pl: "\nChciej tę przyczynę wyłuszczyć tak jasno,"
        ru: "изволь растолковать эту причину так ясно,"
      - pl: "\nAbym mógł drugich oświecić przez ciebie,"
        ru: "чтобы я мог просветить других через тебя:"
      - pl: "\nTen jej na ziemi, drugi szuka w niebie»."
        ru: "один ищет её на земле, другой — на небе»."
      - pl: "\nDuch tchnął boleścią w głębokim westchnieniu"
        ru: "Дух дохнул болью в глубоком вздохе"
      - pl: "\nI tak jął mówić po krótkim milczeniu:"
        ru: "и так начал говорить после короткого молчания:"
      - pl: "\n«Bracie, świat ślepy, zdradzasz mową własną,"
        ru: "«Брат, мир слеп, ты выдаёшь собственной речью,"
      - pl: "\nŻe stamtąd idziesz: wy, którzy żyjecie,"
        ru: "что идёшь оттуда: вы, кто живёт,"
      - pl: "\nW niebie szukacie wszech przyczyn na świecie,"
        ru: "ищете в небе все причины на свете,"
      - pl: "\nJakby rzecz każda, jak wielka, tak mała,"
        ru: "будто каждая вещь, как великая, так и малая,"
      - pl: "\nKoniecznie z jego woli się ruszała:"
        ru: "непременно двигалась по его воле:"
    words: { "złością": zlosc, "przyczynę": przyczyna, "krótkim": krotki, "zdradzasz": zdradzac, "stamtąd": stamtad, "Koniecznie": koniecznie }
  - clean: "Gdyby tak było, w złu, co was okala,\nMogłaby zginąć wasza wolna wola.\nSprawiedliwości czyżby było zadość\nZa złe czuć boleść, a za dobro radość!\nNiebo skłonności szczepi w sercu ludzi,\nNie mówię, wszystkie; z nieba światło macie,\nPrzez co od złego dobro odróżniacie,\nI wolną wolę; zrazu bój ją trudzi,\nW pierwszym natarciu gdy się skłonność budzi:\nLecz wykarmiona dobrze w sercu męża,\nZłamie wpływ sfery i wszystko zwycięża."
    verse: true
    chunks:
      - pl: "Gdyby tak było, w złu, co was okala,"
        ru: "если бы было так, во зле, что вас окружает,"
      - pl: "\nMogłaby zginąć wasza wolna wola."
        ru: "могла бы погибнуть ваша свободная воля."
      - pl: "\nSprawiedliwości czyżby było zadość"
        ru: "Было бы удовлетворено правосудие,"
      - pl: "\nZa złe czuć boleść, a za dobro radość!"
        ru: "если бы за зло чувствовать боль, а за добро — радость!"
        note: "ирония: если бы не было свободы"
      - pl: "\nNiebo skłonności szczepi w sercu ludzi,"
        ru: "Небо прививает склонности в сердце людей,"
      - pl: "\nNie mówię, wszystkie; z nieba światło macie,"
        ru: "не говорю — все; с неба у вас свет,"
      - pl: "\nPrzez co od złego dobro odróżniacie,"
        ru: "которым вы отличаете добро от зла,"
      - pl: "\nI wolną wolę; zrazu bój ją trudzi,"
        ru: "и свободная воля; сперва её утомляет борьба,"
      - pl: "\nW pierwszym natarciu gdy się skłonność budzi:"
        ru: "когда при первом натиске пробуждается склонность:"
      - pl: "\nLecz wykarmiona dobrze w sercu męża,"
        ru: "но, хорошо вскормленная в сердце мужа,"
      - pl: "\nZłamie wpływ sfery i wszystko zwycięża."
        ru: "она сломит влияние сферы и победит всё."
    words: { "Sprawiedliwości": sprawiedliwosc, "radość": radosc, "Niebo": niebo, "budzi": budzic, "Złamie": zlamac, "wpływ": wplyw }
  - clean: "Jako wolnymi tylko Arcysiła\nZarządza wami, jej natura boska\nNa własny obraz w was duszę stworzyła,\nKtórej opieką sfera się nie troska.\nWięc gdy świat błędem obecność porywa,\nPrzyczyna błędu wewnątrz was spoczywa:\nPrzejrzyj tę prawdę w słów moich powłoce."
    verse: true
    chunks:
      - pl: "Jako wolnymi tylko Arcysiła"
        ru: "Как свободными только Высшая Сила"
      - pl: "\nZarządza wami, jej natura boska"
        ru: "управляет вами, её божественная природа"
      - pl: "\nNa własny obraz w was duszę stworzyła,"
        ru: "по собственному образу создала в вас душу,"
      - pl: "\nKtórej opieką sfera się nie troska."
        ru: "о которой сфера не заботится своей опекой."
      - pl: "\nWięc gdy świat błędem obecność porywa,"
        ru: "Итак, если мир уносит нынешнее время заблуждением,"
      - pl: "\nPrzyczyna błędu wewnątrz was spoczywa:"
        ru: "причина заблуждения покоится внутри вас:"
      - pl: "\nPrzejrzyj tę prawdę w słów moich powłoce."
        ru: "прозри эту правду в оболочке моих слов."
    words: { "Zarządza": zarzadzac, "natura": natura, "boska": boski, "opieką": opieka, "obecność": obecnosc, "Przejrzyj": przejrzec }
  - clean: "Bo z ręki tego wymyka się dusza,\nKtóry ją w duchu jak swoje kochanie\nPieści, kołysze naprzód, nim się stanie\nPodobna dziecku, co ledwo się rusza,\nŚmiejąc się, płacząc, igra i szczebioce.\nDusza prostaczka i nic niewiedząca\nPrócz że ją miłość stworzyła bez końca,\nZwraca się do niej jako kwiat do słońca."
    verse: true
    chunks:
      - pl: "Bo z ręki tego wymyka się dusza,"
        ru: "Ибо из руки Того выходит душа,"
      - pl: "\nKtóry ją w duchu jak swoje kochanie"
