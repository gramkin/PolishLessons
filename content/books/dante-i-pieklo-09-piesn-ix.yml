# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 9
chapterTitle: "Pieśń IX"
chapterTitleRu: "Песнь IX. Небесный посланец"
level: B2
paragraphs:
  - clean: "(Anioł. Krąg VI. Ateusze i kacerze.)"
    chunks:
      - pl: "(Anioł. Krąg VI. Ateusze i kacerze.)"
        ru: "(Ангел. Круг VI. Безбожники и еретики.)"
        note: "ateusz — устар. «атеист»; kacerz — устар. «еретик»"
    words: { "Anioł": aniol, "Krąg": krag }
  - clean: "Wódz mój, gdy wracał od bramy piekielnej,\nSpostrzegłszy twarz mą bladości śmiertelnej,\nSkrył własną bladość w głębi swego ducha\nI stanął w kroku, jak człowiek, gdy słucha,\nBo wzrok nie sięgał dalekich widoków\nW powietrzu czarnym od dymu obłoków."
    verse: true
    chunks:
      - pl: "Wódz mój, gdy wracał od bramy piekielnej,"
        ru: "Мой вождь, когда возвращался от адских ворот,"
      - pl: "\nSpostrzegłszy twarz mą bladości śmiertelnej,"
        ru: "заметив моё лицо смертельной бледности,"
        note: "bladość — бледность"
      - pl: "\nSkrył własną bladość w głębi swego ducha"
        ru: "скрыл собственную бледность в глубине своего духа"
      - pl: "\nI stanął w kroku, jak człowiek, gdy słucha,"
        ru: "и остановился на ходу, как человек, когда слушает,"
        note: "stanąć w kroku — остановиться на ходу"
      - pl: "\nBo wzrok nie sięgał dalekich widoków"
        ru: "ибо взгляд не достигал далёких видов"
        note: "sięgać — достигать; widok — вид"
      - pl: "\nW powietrzu czarnym od dymu obłoków."
        ru: "в воздухе, чёрном от дымных облаков."
    words: { "Wódz": wodz, "piekielnej": piekielny, "Spostrzegłszy": spostrzec, "śmiertelnej": smiertelny, "sięgał": siegac, "dymu": dym }
  - clean: "«Zwycięstwo przy nas w tej walce być może,»\nTak począł mówić, «gdy nie — On pomoże…\nAch! tu na niego jak mi czekać długo!»\nGdym zauważał, jak swych myśli wątek\nMistrz plącząc, pierwszą myśl maskował drugą,\nJak sprzeczny słów był koniec a początek;\nStrwożony byłem tą uciętą mową,\nRojąc myśl gorszą niż mogło mieć słowo,\nI zapytałem: «Czy kiedy duch jaki\nNa dno tej smutnej konchy szedł w te szlaki,\nZ pierwszego kręgu, gdzie zeszłym ze świata\nJedyną karą jest nadziei strata?»"
    verse: true
    chunks:
      - pl: "«Zwycięstwo przy nas w tej walce być może,»"
        ru: "«Победа в этой борьбе может быть за нами, —"
        note: "przy nas — за нами"
      - pl: "\nTak począł mówić, «gdy nie — On pomoże…"
        ru: "так начал он говорить, — а если нет — Он поможет…"
        note: "począć — начать"
      - pl: "\nAch! tu na niego jak mi czekać długo!»"
        ru: "ах, как долго мне здесь его ждать!»"
        note: "jak mi czekać długo — как долго мне ждать"
      - pl: "\nGdym zauważał, jak swych myśli wątek"
        ru: "Когда я заметил, как нить своих мыслей"
        note: "zauważać — замечать; wątek — нить"
      - pl: "\nMistrz plącząc, pierwszą myśl maskował drugą,"
        ru: "учитель, путая, первую мысль прикрывал второй,"
        note: "plątać — путать; maskować — маскировать"
      - pl: "\nJak sprzeczny słów był koniec a początek;"
        ru: "как противоречили конец и начало слов,"
        note: "sprzeczny — противоречивый"
      - pl: "\nStrwożony byłem tą uciętą mową,"
        ru: "я был встревожен этой оборванной речью,"
        note: "strwożony — встревоженный; ucięty — оборванный"
      - pl: "\nRojąc myśl gorszą niż mogło mieć słowo,"
        ru: "воображая мысль худшую, чем могло иметь слово,"
        note: "roić — воображать, мечтать"
      - pl: "\nI zapytałem: «Czy kiedy duch jaki"
        ru: "и спросил: «Сходил ли когда-нибудь какой-нибудь дух"
        note: "czy kiedy… jaki — ли когда-нибудь… какой-нибудь"
      - pl: "\nNa dno tej smutnej konchy szedł w te szlaki,"
        ru: "на дно этой печальной раковины этими путями,"
        note: "koncha — раковина; szlak — путь"
      - pl: "\nZ pierwszego kręgu, gdzie zeszłym ze świata"
        ru: "из первого круга, где ушедшим из мира"
        note: "zeszły ze świata — ушедший из мира"
      - pl: "\nJedyną karą jest nadziei strata?»"
        ru: "единственная кара — утрата надежды?»"
        note: "strata — утрата"
    words: { "Zwycięstwo": zwyciestwo, "począł": poczac, "Mistrz": mistrz, "smutnej": smutny, "szlaki": szlak, "strata": strata }
  - clean: "A on: «Tą drogą chodził arcyrzadki\nDuch, tej mieszkaniec, gdzie ja mieszkam, klatki.\nZaiste niegdyś zwiedziłem te strony,\nDzikiej Erychty zaklęciem zmuszony,\nCo zmarłych dusze do ich ciał wzywała:\nDuch mój zaledwo rozebrał się z ciała,\nRzekła mi: «Zejdź tu!» czarodziejka nasza:\n«Wydobyć jeden cień z kręgu Judasza»."
    verse: true
    chunks:
      - pl: "A on: «Tą drogą chodził arcyrzadki"
        ru: "А он: «Этой дорогой ходил крайне редкий"
        note: "arcyrzadki — крайне редкий (arcy- — архи-)"
      - pl: "\nDuch, tej mieszkaniec, gdzie ja mieszkam, klatki."
        ru: "дух, обитатель той темницы, где живу я."
        note: "klatka — клетка, темница"
      - pl: "\nZaiste niegdyś zwiedziłem te strony,"
        ru: "Воистину некогда я посетил эти края,"
        note: "zwiedzić — посетить, осмотреть"
      - pl: "\nDzikiej Erychty zaklęciem zmuszony,"
        ru: "принуждённый заклятием дикой Эрихто,"
        note: "Erychta — Эрихто, фессалийская колдунья; zmuszony — принуждённый"
      - pl: "\nCo zmarłych dusze do ich ciał wzywała:"
        ru: "что души мёртвых в их тела призывала:"
      - pl: "\nDuch mój zaledwo rozebrał się z ciała,"
        ru: "мой дух едва разоблачился от тела,"
        note: "zaledwo — едва; rozebrać się — раздеться"
      - pl: "\nRzekła mi: «Zejdź tu!» czarodziejka nasza:"
        ru: "как сказала мне: «Сойди сюда!» наша чародейка:"
        note: "czarodziejka — чародейка"
      - pl: "\n«Wydobyć jeden cień z kręgu Judasza»."
        ru: "«Извлечь одну тень из круга Иуды»."
        note: "wydobyć — извлечь"
    words: { "mieszkaniec": mieszkaniec, "zaklęciem": zaklecie, "wzywała": wzywac, "rozebrał": rozebrac, "Rzekła": rzec, "Wydobyć": wydobyc }
  - clean: "Krąg ten najniższy i najwięcej ciemny,\nNajdalszy nieba, co wszystko otacza.\nBądź więc spokojnym, znam ten szlak podziemny.\nBagno dyszące zgnilizną wyziewu\nWokoło grodzi to miasto boleści,\nGdzie odtąd wstąpić nie możem bez gniewu»."
    verse: true
    chunks:
      - pl: "Krąg ten najniższy i najwięcej ciemny,"
        ru: "Этот круг самый нижний и самый тёмный,"
        note: "najwięcej ciemny — устар. «самый тёмный»"
      - pl: "\nNajdalszy nieba, co wszystko otacza."
        ru: "самый далёкий от неба, что всё окружает."
      - pl: "\nBądź więc spokojnym, znam ten szlak podziemny."
        ru: "Будь же спокоен, я знаю этот подземный путь."
        note: "podziemny — подземный"
      - pl: "\nBagno dyszące zgnilizną wyziewu"
        ru: "Болото, дышащее гнилым испарением,"
        note: "zgnilizna — гниль"
      - pl: "\nWokoło grodzi to miasto boleści,"
        ru: "кругом ограждает этот город скорби,"
        note: "grodzić — ограждать"
      - pl: "\nGdzie odtąd wstąpić nie możem bez gniewu»."
        ru: "куда теперь нам не войти без гнева»."
        note: "możem — устар. «можем»"
    words: { "otacza": otaczac, "podziemny": podziemny, "Bagno": bagno, "odtąd": odtad, "wstąpić": wstapic, "gniewu": gniew }
  - clean: "I mówił jeszcze rzeczy różnej treści,\nKtóre zwietrzały z pamięci słuchacza.\nBo cały byłem duszą i spojrzeniem\nNa szczycie wieży świecącej płomieniem.\nTam trzy piekielne widziałem Furyje,\nStały przy ogniu; z niewiasty postawą,\nZ hyder zielonych okolone pasem,\nA zamiast włosów drobne węże, żmije\nNa szpetne czoła spadały i szyje."
    verse: true
    chunks:
      - pl: "I mówił jeszcze rzeczy różnej treści,"
        ru: "И говорил он ещё о разных вещах,"
      - pl: "\nKtóre zwietrzały z pamięci słuchacza."
        ru: "что выветрились из памяти слушателя."
        note: "zwietrzeć — выветриться"
      - pl: "\nBo cały byłem duszą i spojrzeniem"
        ru: "Ибо я весь был душой и взглядом"
      - pl: "\nNa szczycie wieży świecącej płomieniem."
        ru: "на вершине башни, сияющей пламенем."
      - pl: "\nTam trzy piekielne widziałem Furyje,"
        ru: "Там трёх адских Фурий я увидел,"
        note: "Furyje — старое написание Furie"
      - pl: "\nStały przy ogniu; z niewiasty postawą,"
        ru: "стояли у огня; с осанкой женщин,"
        note: "postawa — осанка"
      - pl: "\nZ hyder zielonych okolone pasem,"
        ru: "опоясанные поясом из зелёных гидр,"
        note: "hydra — гидра; okolony — окружённый"
      - pl: "\nA zamiast włosów drobne węże, żmije"
        ru: "а вместо волос мелкие змеи, гадюки"
        note: "żmija — гадюка"
      - pl: "\nNa szpetne czoła spadały i szyje."
        ru: "спадали на безобразные лбы и шеи."
        note: "szpetny — безобразный"
    words: { "wieży": wieza, "świecącej": swiecic, "płomieniem": plomien, "niewiasty": niewiasta, "postawą": postawa, "węże": waz }
  - clean: "On, który poznał znajome służebne\nKrólowej piekieł: «Patrz», mówił, «to ona,\nStoi na lewo Megera, na prawo\nStoi Alekto, w środku Tyzyfona».\nTo rzekłszy, zamilkł. Furyje tymczasem\nTłukły swe piersi, wszystkie ciała części\nKrwawiły znakiem paznokcia lub pięści."
    verse: true
    chunks:
      - pl: "On, który poznał znajome służebne"
        ru: "Он, что узнал знакомых служанок"
        note: "służebna — служанка"
      - pl: "\nKrólowej piekieł: «Patrz», mówił, «to ona,"
        ru: "царицы ада: «Смотри, — сказал, — это они,"
        note: "Прозерпина — царица ада"
      - pl: "\nStoi na lewo Megera, na prawo"
        ru: "стоит слева Мегера, справа"
      - pl: "\nStoi Alekto, w środku Tyzyfona»."
        ru: "стоит Алекто, посередине Тисифона»."
      - pl: "\nTo rzekłszy, zamilkł. Furyje tymczasem"
        ru: "Сказав это, он умолк. Фурии тем временем"
      - pl: "\nTłukły swe piersi, wszystkie ciała części"
        ru: "били себя в грудь, все части тела"
      - pl: "\nKrwawiły znakiem paznokcia lub pięści."
        ru: "кровоточили от следа ногтя или кулака."
        note: "krwawić — кровоточить; paznokieć — ноготь"
    words: { "piekieł": pieklo, "tymczasem": tymczasem, "piersi": piers, "Krwawiły": krwawic, "paznokcia": paznokiec, "pięści": piesc }
  - clean: "Krzyk ich tak straszny bił w gwiazdy podniebne,\nŻem do poety tulił się jak dziecko,\nPodejrzewając ich wściekłość zdradziecką.\n«Sam tu, Meduzo! a przemień go w kamień!»\nKrzyknęła pierwsza; w kolej «Zamień, zamień!»\nKrzyczały wszystkie, patrząc na dół z wieży:\n«My niepomszczone, zemścić się należy\nZa tak zuchwałe zejście Tezeusza!»"
    verse: true
    chunks:
      - pl: "Krzyk ich tak straszny bił w gwiazdy podniebne,"
        ru: "Крик их такой страшный бил в поднебесные звёзды,"
        note: "podniebny — поднебесный"
      - pl: "\nŻem do poety tulił się jak dziecko,"
        ru: "что я к поэту жался, как дитя,"
        note: "żem = że + -m; tulić się — прижиматься"
      - pl: "\nPodejrzewając ich wściekłość zdradziecką."
        ru: "подозревая их коварную ярость."
        note: "zdradziecki — коварный"
      - pl: "\n«Sam tu, Meduzo! a przemień go w kamień!»"
        ru: "«Сюда, Медуза! И преврати его в камень!»"
        note: "przemienić — превратить"
      - pl: "\nKrzyknęła pierwsza; w kolej «Zamień, zamień!»"
        ru: "крикнула первая; вслед: «Преврати, преврати!»"
        note: "w kolej — следом"
      - pl: "\nKrzyczały wszystkie, patrząc na dół z wieży:"
        ru: "кричали все, глядя вниз с башни:"
      - pl: "\n«My niepomszczone, zemścić się należy"
        ru: "«Мы не отомщены, надо отомстить"
        note: "niepomszczony — неотомщённый; zemścić się — отомстить"
      - pl: "\nZa tak zuchwałe zejście Tezeusza!»"
        ru: "за столь дерзкое нисхождение Тесея!»"
        note: "zejście — нисхождение; Tezeusz — Тесей"
    words: { "Krzyk": krzyk, "poety": poeta, "Podejrzewając": podejrzewac, "kamień": kamien, "kolej": kolej, "Zamień": zamienic }
  - clean: "A mistrz tak mówił: «Ten widok zbyt wzrusza!\nPrzymknij twe oczy i stój odwrócony;\nGdybyś tu spojrzał twarzą w twarz Gorgony.\nNa świat słoneczny już byś stąd nie wrócił».\nI sam do wieży mnie tyłem obrócił;\nWątpiąc, czy dobrze me dłonie zasłonią."
    verse: true
    chunks:
      - pl: "A mistrz tak mówił: «Ten widok zbyt wzrusza!"
        ru: "А учитель сказал так: «Это зрелище слишком потрясает!"
        note: "wzruszać — потрясать"
      - pl: "\nPrzymknij twe oczy i stój odwrócony;"
        ru: "Прикрой глаза и стой отвернувшись;"
        note: "przymknąć — прикрыть"
      - pl: "\nGdybyś tu spojrzał twarzą w twarz Gorgony."
        ru: "если бы ты здесь взглянул в лицо Горгоне,"
      - pl: "\nNa świat słoneczny już byś stąd nie wrócił»."
        ru: "на солнечный свет ты уже не вернулся бы отсюда»."
      - pl: "\nI sam do wieży mnie tyłem obrócił;"
        ru: "И сам повернул меня спиной к башне;"
        note: "tyłem — спиной"
      - pl: "\nWątpiąc, czy dobrze me dłonie zasłonią."
        ru: "сомневаясь, хорошо ли закроют мои ладони,"
    words: { "widok": widok, "Przymknij": przymknac, "odwrócony": odwrocic, "słoneczny": sloneczny, "obrócił": obrocic, "dłonie": dlon }
  - clean: "Jeszcze mi oczy zasłonił swą dłonią.\nO wy! co macie zmysł pojęcia zdrowy,\nChciejcie naukę odkryć utajoną\nW tych dziwnych wierszach pod słowa zasłoną.\nTrzęsąc aż do dna cały nurt styksowy,\nPo mętnych wodach szumiał huk daleki,\nObu brzegami potrząsając rzeki."
    verse: true
    chunks:
      - pl: "Jeszcze mi oczy zasłonił swą dłonią."
        ru: "ещё закрыл мне глаза своей рукой."
      - pl: "\nO wy! co macie zmysł pojęcia zdrowy,"
        ru: "О вы, у кого здравое чувство разумения,"
        note: "zmysł pojęcia — способность понимания"
      - pl: "\nChciejcie naukę odkryć utajoną"
        ru: "пожелайте открыть учение, скрытое"
        note: "chciejcie — повел. от chcieć: «пожелайте»; utajony — скрытый"
      - pl: "\nW tych dziwnych wierszach pod słowa zasłoną."
        ru: "в этих странных стихах под покровом слов."
        note: "zasłona — покров"
      - pl: "\nTrzęsąc aż do dna cały nurt styksowy,"
        ru: "Сотрясая до дна весь стигийский поток,"
        note: "trząść — трясти; nurt — поток"
      - pl: "\nPo mętnych wodach szumiał huk daleki,"
        ru: "по мутным водам шумел далёкий гул,"
      - pl: "\nObu brzegami potrząsając rzeki."
        ru: "потрясая оба берега реки."
    words: { "zmysł": zmysl, "naukę": nauka, "zasłoną": zaslona, "Trzęsąc": trzasc, "brzegami": brzeg, "rzeki": rzeka }
  - clean: "Tak burza huczy w czasie niepogodnym,\nKiedy wiatr dysząc tchem ciepłym, to chłodnym,\nSzturmuje lasy; jak lniane paździerze\nŁamie gałęzie, rwąc kwiaty i trawy,\nToczy się z pychą po kłębach kurzawy,\nA z pól pierzchają trzody i pasterze."
    verse: true
    chunks:
      - pl: "Tak burza huczy w czasie niepogodnym,"
        ru: "Так буря гудит в ненастное время,"
        note: "niepogodny — ненастный"
      - pl: "\nKiedy wiatr dysząc tchem ciepłym, to chłodnym,"
        ru: "когда ветер, дыша то тёплым, то холодным дыханием,"
        note: "tchem — твор. от dech"
      - pl: "\nSzturmuje lasy; jak lniane paździerze"
        ru: "штурмует леса; как льняную костру,"
        note: "lniany — льняной; paździerz — костра (стебли льна)"
      - pl: "\nŁamie gałęzie, rwąc kwiaty i trawy,"
        ru: "ломает ветви, срывая цветы и травы,"
        note: "gałąź — ветвь"
      - pl: "\nToczy się z pychą po kłębach kurzawy,"
        ru: "катится с гордостью по клубам пыли,"
        note: "kłęby — клубы; kurzawa — пыль, туча пыли"
      - pl: "\nA z pól pierzchają trzody i pasterze."
        ru: "а с полей разбегаются стада и пастухи."
        note: "pierzchać — разбегаться; trzoda — стадо; pasterz — пастух"
    words: { "burza": burza, "tchem": dech, "chłodnym": chlodny, "Łamie": lamac, "Toczy": toczyc, "trzody": trzoda }
  - clean: "Mistrz dłoń z mych oczu zdjął i rzekł: «Patrz w stronę,\nGdzie najzjadliwszy dym jak czad błękitny,\nBucha ze środka pleśni starożytnej».\nJak żaby wodnym wężem wystraszone,\nPłyną samopas przez wodne powierzchnie,\nAż gdzieś pod wodę każda w bagno pierzchnie;\nTak potępieńców gromada ladaco,\nPrzed kimś, widziałem, uciekała z trwogą,\nKtóry przechodził przez Styks suchą nogą."
