level: B2
paragraphs:
  - clean: "Na początku XV wieku spór z zakonem krzyżackim skupiał się wokół jednej krainy: Żmudzi. Ta leśna, bagnista ziemia na zachodzie Litwy oddzielała państwo zakonne w Prusach od drugiej gałęzi zakonu w Inflantach, czyli na terenie dzisiejszej Łotwy i Estonii. Krzyżacy bardzo chcieli ją zdobyć, bo wtedy ich posiadłości nad Bałtykiem połączyłyby się w jeden pas. Witold, żeby mieć spokój w innych sprawach, kilka razy oddawał im Żmudź, ale jej mieszkańcy nie chcieli znosić rządów zakonu. W 1409 roku wybuchło tam powstanie, a Witold i Jagiełło po cichu je wspierali."
    draft: true
    chunks:
      - pl: "Na początku XV wieku spór z zakonem krzyżackim skupiał się wokół jednej krainy: Żmudzi."
        ru: "В начале XV века спор с Тевтонским орденом сосредоточился вокруг одного края — Жемайтии."
        note: "skupiać się — сосредоточиваться"
      - pl: " Ta leśna, bagnista ziemia na zachodzie Litwy oddzielała państwo zakonne w Prusach od drugiej gałęzi zakonu w Inflantach, czyli na terenie dzisiejszej Łotwy i Estonii."
        ru: "Эта лесистая, болотистая земля на западе Литвы отделяла орденское государство в Пруссии от другой ветви ордена в Ливонии, то есть на территории нынешних Латвии и Эстонии."
        note: "bagnisty — болотистый; gałąź — ветвь; Inflanty — Ливония, Инфлянты"
      - pl: " Krzyżacy bardzo chcieli ją zdobyć, bo wtedy ich posiadłości nad Bałtykiem połączyłyby się w jeden pas."
        ru: "Крестоносцы очень хотели её захватить, потому что тогда их владения на Балтике слились бы в одну полосу."
        note: "posiadłość — владение"
      - pl: " Witold, żeby mieć spokój w innych sprawach, kilka razy oddawał im Żmudź, ale jej mieszkańcy nie chcieli znosić rządów zakonu."
        ru: "Витовт, чтобы иметь покой в других делах, несколько раз уступал им Жемайтию, но её жители не желали терпеть власти ордена."
        note: "znosić — терпеть"
      - pl: " W 1409 roku wybuchło tam powstanie, a Witold i Jagiełło po cichu je wspierali."
        ru: "В 1409 году там вспыхнуло восстание, и Витовт с Ягайло втихую его поддерживали."
        note: "po cichu — втихомолку, тайно; wspierać — поддерживать"
    words: { "skupiał": skupiac, "krainy": kraina, "zachodzie": zachod, "posiadłości": posiadlosc, "pas": pas, "oddawał": oddawac, "mieszkańcy": mieszkaniec, "znosić": znosic, "wybuchło": wybuchnac, "wspierali": wspierac }
  - clean: "Wielki mistrz Ulrich von Jungingen zapytał polskich posłów, co zrobi król, jeśli zakon uderzy na Litwę. Arcybiskup Mikołaj Kurowski odpowiedział podobno, że Polska stanie po stronie Litwy jak po stronie własnego kraju. W sierpniu 1409 roku zakon wypowiedział wojnę Polsce i zajął ziemię dobrzyńską. Jesienią zawarto rozejm do czerwca następnego roku. Obie strony wiedziały, że jest to tylko chwila na przygotowania do wielkiej rozprawy. Krzyżacy szukali sojuszników na dworach Europy, a król czeski Wacław IV, który miał rozstrzygnąć spór jako sędzia polubowny, ogłosił wyrok korzystny dla zakonu."
    draft: true
    chunks:
      - pl: "Wielki mistrz Ulrich von Jungingen zapytał polskich posłów, co zrobi król, jeśli zakon uderzy na Litwę."
        ru: "Великий магистр Ульрих фон Юнгинген спросил польских послов, что сделает король, если орден ударит по Литве."
        note: "poseł — посол"
      - pl: " Arcybiskup Mikołaj Kurowski odpowiedział podobno, że Polska stanie po stronie Litwy jak po stronie własnego kraju."
        ru: "Архиепископ Миколай Куровский будто бы ответил, что Польша встанет на сторону Литвы, как на сторону собственной страны."
      - pl: " W sierpniu 1409 roku zakon wypowiedział wojnę Polsce i zajął ziemię dobrzyńską."
        ru: "В августе 1409 года орден объявил войну Польше и захватил Добжинскую землю."
        note: "wypowiedzieć wojnę — объявить войну"
      - pl: " Jesienią zawarto rozejm do czerwca następnego roku."
        ru: "Осенью заключили перемирие до июня следующего года."
      - pl: " Obie strony wiedziały, że jest to tylko chwila na przygotowania do wielkiej rozprawy."
        ru: "Обе стороны знали, что это лишь передышка для подготовки к решающей схватке."
      - pl: " Krzyżacy szukali sojuszników na dworach Europy, a król czeski Wacław IV, który miał rozstrzygnąć spór jako sędzia polubowny, ogłosił wyrok korzystny dla zakonu."
        ru: "Крестоносцы искали союзников при европейских дворах, а чешский король Вацлав IV, который должен был разрешить спор как третейский судья, вынес приговор в пользу ордена."
        note: "sędzia polubowny — третейский судья; korzystny — выгодный"
    words: { "polskich": polski, "sierpniu": sierpien, "wypowiedział": wypowiedziec, "Jesienią": jesien, "zawarto": zawrzec, "czerwca": czerwiec, "rozprawy": rozprawa, "sojuszników": sojusznik, "dworach": dwor, "ogłosił": oglosic, "wyrok": wyrok }
  - clean: "Jagiełło i Witold spotkali się w grudniu 1409 roku w Brześciu nad Bugiem i ułożyli plan wojny. Postanowili, że tym razem nie będą prowadzić osobnych wypraw, tylko połączą siły i uderzą prosto na stolicę zakonu, Malbork. Plan trzymano w ścisłej tajemnicy. Krzyżacy spodziewali się raczej kilku mniejszych najazdów z różnych stron i rozproszyli część swoich sił wzdłuż granic."
    draft: true
    chunks:
      - pl: "Jagiełło i Witold spotkali się w grudniu 1409 roku w Brześciu nad Bugiem i ułożyli plan wojny."
        ru: "Ягайло и Витовт встретились в декабре 1409 года в Бресте на Буге и составили план войны."
        note: "ułożyć plan — составить план"
      - pl: " Postanowili, że tym razem nie będą prowadzić osobnych wypraw, tylko połączą siły i uderzą prosto na stolicę zakonu, Malbork."
        ru: "Они решили, что на этот раз не будут вести отдельные походы, а соединят силы и ударят прямо на столицу ордена, Мальборк."
      - pl: " Plan trzymano w ścisłej tajemnicy."
        ru: "План держали в строжайшей тайне."
        note: "tajemnica — тайна"
      - pl: " Krzyżacy spodziewali się raczej kilku mniejszych najazdów z różnych stron i rozproszyli część swoich sił wzdłuż granic."
        ru: "Крестоносцы скорее ожидали нескольких небольших набегов с разных сторон и рассредоточили часть своих сил вдоль границ."
        note: "spodziewać się — ожидать; rozproszyć — рассеять"
    words: { "grudniu": grudzien, "ułożyli": ulozyc, "osobnych": osobny, "wypraw": wyprawa, "stolicę": stolica, "ścisłej": scisly, "wzdłuż": wzdluz }
  - clean: "Przygotowania trwały całą zimę i wiosnę. Długosz opowiada, że w Puszczy Białowieskiej królewscy myśliwi upolowali tysiące zwierząt, a mięso solono i pakowano do beczek, żeby wyżywić wojsko. W lasach pod Kozienicami cieśle budowali w tajemnicy most łyżwowy, czyli most pływający, składający się z łodzi połączonych pomostem. Na wiosnę spławiono go Wisłą do Czerwińska. Na przełomie czerwca i lipca 1410 roku polskie wojsko przeprawiło się po nim przez rzekę w ciągu trzech dni. Był to jeden z pierwszych takich mostów w historii średniowiecznej Europy, a Krzyżacy, którzy pilnowali przepraw, zostali całkowicie zaskoczeni."
    draft: true
    chunks:
      - pl: "Przygotowania trwały całą zimę i wiosnę."
        ru: "Подготовка шла всю зиму и весну."
      - pl: " Długosz opowiada, że w Puszczy Białowieskiej królewscy myśliwi upolowali tysiące zwierząt, a mięso solono i pakowano do beczek, żeby wyżywić wojsko."
        ru: "Длугош рассказывает, что в Беловежской пуще королевские охотники добыли тысячи зверей, а мясо солили и складывали в бочки, чтобы прокормить войско."
        note: "upolować — добыть на охоте; solić — солить; wyżywić — прокормить"
      - pl: " W lasach pod Kozienicami cieśle budowali w tajemnicy most łyżwowy, czyli most pływający, składający się z łodzi połączonych pomostem."
        ru: "В лесах под Козеницами плотники тайно строили наплавной мост, то есть плавучий мост из лодок, соединённых настилом."
        note: "cieśla — плотник; most łyżwowy — наплавной (понтонный) мост; pomost — настил"
      - pl: " Na wiosnę spławiono go Wisłą do Czerwińska."
        ru: "Весной его сплавили по Висле до Червиньска."
        note: "spławić — сплавить"
      - pl: " Na przełomie czerwca i lipca 1410 roku polskie wojsko przeprawiło się po nim przez rzekę w ciągu trzech dni."
        ru: "На рубеже июня и июля 1410 года польское войско переправилось по нему через реку за три дня."
        note: "przeprawić się — переправиться"
      - pl: " Był to jeden z pierwszych takich mostów w historii średniowiecznej Europy, a Krzyżacy, którzy pilnowali przepraw, zostali całkowicie zaskoczeni."
        ru: "Это был один из первых таких мостов в истории средневековой Европы, а крестоносцы, стерёгшие переправы, были застигнуты врасплох."
        note: "przeprawa — переправа; całkowicie — полностью"
    words: { "czerwca": czerwiec, "zimę": zima, "wiosnę": wiosna, "królewscy": krolewski, "myśliwi": mysliwy, "mięso": mieso, "pakowano": pakowac, "beczek": beczka, "wojsko": wojsko, "budowali": budowac, "most": most, "pływający": plywac, "składający": skladac, "przełomie": przelom, "lipca": lipiec, "polskie": polski, "mostów": most }
  - clean: "Pod Czerwińskiem armia polska połączyła się z wojskami Witolda. Była to jedna z największych armii, jakie widziała wtedy Europa. Historycy szacują jej liczebność na około trzydzieści tysięcy ludzi, choć podawane liczby bardzo się różnią. Wojsko dzieliło się na chorągwie, czyli oddziały walczące pod jednym sztandarem. Polska wystawiła ich około pięćdziesięciu, Litwa około czterdziestu. Były wśród nich chorągwie królewskie, biskupie i rycerskie, a także chorągwie ziem: krakowskiej, sandomierskiej, lwowskiej."
    draft: true
    chunks:
      - pl: "Pod Czerwińskiem armia polska połączyła się z wojskami Witolda."
        ru: "Под Червиньском польская армия соединилась с войсками Витовта."
      - pl: " Była to jedna z największych armii, jakie widziała wtedy Europa."
        ru: "Это была одна из крупнейших армий, какие видела тогда Европа."
      - pl: " Historycy szacują jej liczebność na około trzydzieści tysięcy ludzi, choć podawane liczby bardzo się różnią."
        ru: "Историки оценивают её численность примерно в тридцать тысяч человек, хотя называемые цифры сильно разнятся."
        note: "szacować — оценивать; liczebność — численность"
      - pl: " Wojsko dzieliło się na chorągwie, czyli oddziały walczące pod jednym sztandarem."
        ru: "Войско делилось на хоругви, то есть отряды, сражавшиеся под одним знаменем."
        note: "chorągiew — хоругвь; sztandar — знамя"
      - pl: " Polska wystawiła ich około pięćdziesięciu, Litwa około czterdziestu."
        ru: "Польша выставила их около пятидесяти, Литва — около сорока."
      - pl: " Były wśród nich chorągwie królewskie, biskupie i rycerskie, a także chorągwie ziem: krakowskiej, sandomierskiej, lwowskiej."
        ru: "Среди них были королевские, епископские и рыцарские хоругви, а также хоругви земель: краковской, сандомирской, львовской."
    words: { "polska": polski, "wojskami": wojsko, "trzydzieści": trzydziesci, "podawane": podawac, "dzieliło": dzielic, "wystawiła": wystawic, "pięćdziesięciu": piecdziesiat, "czterdziestu": czterdziesci, "królewskie": krolewski }
  - clean: "Armia była bardzo różnorodna. Obok polskich rycerzy w ciężkich zbrojach szli litewscy i ruscy wojownicy na lekkich koniach. Ze wschodnich ziem Witolda przyszły chorągwie smoleńskie, połockie, kijowskie i wiele innych. Witoldowi towarzyszył też oddział Tatarów pod wodzą Dżalal ad-Dina, syna chana Złotej Ordy Tochtamysza. Byli wreszcie zaciężni rycerze z Czech i Moraw, a w czeskim oddziale, według tradycji, walczył młody Jan Żiżka, późniejszy przywódca husytów. Krzyżacy chętnie podkreślali, że idą przeciw nim poganie i schizmatycy, czyli prawosławni."
    draft: true
    chunks:
      - pl: "Armia była bardzo różnorodna."
        ru: "Армия была очень разнородной."
        note: "różnorodny — разнообразный, разнородный"
      - pl: " Obok polskich rycerzy w ciężkich zbrojach szli litewscy i ruscy wojownicy na lekkich koniach."
        ru: "Рядом с польскими рыцарями в тяжёлых доспехах шли литовские и русские воины на лёгких конях."
        note: "zbroja — доспехи"
      - pl: " Ze wschodnich ziem Witolda przyszły chorągwie smoleńskie, połockie, kijowskie i wiele innych."
        ru: "С восточных земель Витовта пришли смоленские, полоцкие, киевские и многие другие хоругви."
      - pl: " Witoldowi towarzyszył też oddział Tatarów pod wodzą Dżalal ad-Dina, syna chana Złotej Ordy Tochtamysza."
        ru: "Витовта сопровождал также отряд татар во главе с Джелал ад-Дином, сыном хана Золотой Орды Тохтамыша."
        note: "towarzyszyć — сопровождать"
      - pl: " Byli wreszcie zaciężni rycerze z Czech i Moraw, a w czeskim oddziale, według tradycji, walczył młody Jan Żiżka, późniejszy przywódca husytów."
        ru: "Были, наконец, наёмные рыцари из Чехии и Моравии, а в чешском отряде, по преданию, сражался молодой Ян Жижка, позднейший вождь гуситов."
        note: "zaciężny — наёмный; przywódca — вождь"
      - pl: " Krzyżacy chętnie podkreślali, że idą przeciw nim poganie i schizmatycy, czyli prawosławni."
        ru: "Крестоносцы охотно подчёркивали, что против них идут язычники и схизматики, то есть православные."
        note: "schizmatyk — схизматик, раскольник"
    words: { "polskich": polski, "rycerzy": rycerz, "wojownicy": wojownik, "lekkich": lekki, "wschodnich": wschodni, "towarzyszył": towarzyszyc, "rycerze": rycerz, "tradycji": tradycja, "późniejszy": pozny, "przywódca": przywodca }
  - clean: "Armia zakonu była mniejsza, ale lepiej uzbrojona i wyszkolona. Oprócz braci zakonnych, których było kilkuset, walczyli w niej rycerze świeccy z Prus, najemnicy i goście z całej Europy: z Niemiec, Francji, Anglii, Szwajcarii. Dla wielu z nich wyprawa przeciw Litwie była czymś w rodzaju pielgrzymki i rycerskiej przygody. Krzyżacy mieli także działa, wtedy jeszcze nową i niezbyt skuteczną broń."
    draft: true
    chunks:
      - pl: "Armia zakonu była mniejsza, ale lepiej uzbrojona i wyszkolona."
        ru: "Армия ордена была меньше, но лучше вооружена и обучена."
        note: "uzbrojony — вооружённый; wyszkolony — обученный"
      - pl: " Oprócz braci zakonnych, których było kilkuset, walczyli w niej rycerze świeccy z Prus, najemnicy i goście z całej Europy: z Niemiec, Francji, Anglii, Szwajcarii."
        ru: "Кроме братьев-рыцарей, которых было несколько сотен, в ней сражались светские рыцари из Пруссии, наёмники и гости со всей Европы: из Германии, Франции, Англии, Швейцарии."
        note: "świecki — светский; najemnik — наёмник"
      - pl: " Dla wielu z nich wyprawa przeciw Litwie była czymś w rodzaju pielgrzymki i rycerskiej przygody."
        ru: "Для многих из них поход против Литвы был чем-то вроде паломничества и рыцарского приключения."
        note: "przygoda — приключение"
      - pl: " Krzyżacy mieli także działa, wtedy jeszcze nową i niezbyt skuteczną broń."
        ru: "У крестоносцев были также пушки — тогда ещё новое и не слишком действенное оружие."
        note: "działo — пушка, орудие"
    words: { "rycerze": rycerz, "uzbrojona": uzbroic, "wyprawa": wyprawa, "przygody": przygoda, "niezbyt": niezbyt }
  - clean: "Wojska Jagiełły i Witolda maszerowały na północ, paląc po drodze krzyżackie wsie i zamki. Wielki mistrz próbował zatrzymać je nad rzeką Drwęcą, gdzie przygotował umocnioną pozycję. Jagiełło nie dał się złapać w pułapkę: zawrócił i obszedł przeszkodę od wschodu. Obie armie spotkały się rankiem 15 lipca 1410 roku na polach między wsiami Grunwald, Stębark i Łodwigowo. Niemcy nazwali później tę bitwę od nazwy Stębarka, po niemiecku Tannenberg. Dla Litwinów jest to bitwa pod Żalgirisem, co jest litewskim tłumaczeniem nazwy Grunwald, czyli „zielony las”."
    draft: true
    chunks:
      - pl: "Wojska Jagiełły i Witolda maszerowały na północ, paląc po drodze krzyżackie wsie i zamki."
        ru: "Войска Ягайло и Витовта шли на север, сжигая по дороге орденские деревни и замки."
      - pl: " Wielki mistrz próbował zatrzymać je nad rzeką Drwęcą, gdzie przygotował umocnioną pozycję."
        ru: "Великий магистр пытался остановить их на реке Дрвенце, где подготовил укреплённую позицию."
        note: "umocniony — укреплённый"
      - pl: " Jagiełło nie dał się złapać w pułapkę: zawrócił i obszedł przeszkodę od wschodu."
        ru: "Ягайло не дал себя поймать в ловушку: он повернул назад и обошёл преграду с востока."
        note: "pułapka — ловушка; przeszkoda — препятствие"
      - pl: " Obie armie spotkały się rankiem 15 lipca 1410 roku na polach między wsiami Grunwald, Stębark i Łodwigowo."
        ru: "Обе армии встретились утром 15 июля 1410 года на полях между деревнями Грюнвальд, Стембарк и Лодвигово."
