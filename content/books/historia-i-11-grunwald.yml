  - clean: "Pamięć o Grunwaldzie stała się jednym z filarów polskiej tożsamości. Kiedy w XIX wieku Polski nie było na mapie, a Prusy prowadziły politykę germanizacji, zwycięstwo nad Krzyżakami przypominało, że Polacy potrafili kiedyś pokonać niemiecką potęgę. W 1878 roku Jan Matejko namalował ogromny obraz „Bitwa pod Grunwaldem”, mający prawie dziesięć metrów szerokości. W 1900 roku Henryk Sienkiewicz wydał powieść „Krzyżacy”, którą czytały całe pokolenia. Niemcy także pamiętali o Tannenbergu: kiedy w 1914 roku pokonali w pobliżu armię rosyjską, nazwali to zwycięstwo bitwą pod Tannenbergiem, jakby chcieli zmazać dawną klęskę. W czasie II wojny światowej Niemcy szukali obrazu Matejki, żeby go zniszczyć, ale Polacy ukryli go i ocalili. Dziś co roku w lipcu na polach Grunwaldu tysiące ludzi w zbrojach odtwarzają bitwę przed dziesiątkami tysięcy widzów."
