# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 7
chapterTitle: "Pieśń VII"
chapterTitleRu: "Песнь VII. Об искуплении"
level: B2
paragraphs:
  - clean: "(Na Merkurym: zakończenie. Pouczenie o grzechu i zbawieniu. Dodatek o stworzeniu pośrednim i bezpośrednim.)"
    chunks:
      - pl: "(Na Merkurym: zakończenie. Pouczenie o grzechu i zbawieniu. Dodatek o stworzeniu pośrednim i bezpośrednim.)"
        ru: "(На Меркурии: окончание. Поучение о грехе и спасении. Дополнение о творении опосредованном и непосредственном.)"
        note: "pośredni — опосредованный"
    words: { "grzechu": grzech, "Dodatek": dodatek, "bezpośrednim": bezposredni }
  - clean: "«Boże zastępów! Ich tarczo i zbrojo,\nHosanna tobie! W tym królestwie całym\nSzczęśliwe światła sam światłością twoją\nZapalający z miłością, z zapałem».\nTak do swej sfery zwrócony duch śpiewał,\nPromień go blaskiem podwójnym zalewał."
    verse: true
    chunks:
      - pl: "«Boże zastępów! Ich tarczo i zbrojo,"
        ru: "«Боже воинств! Их щит и броня,"
        note: "zastęp — воинство; zbroja — броня"
      - pl: "\nHosanna tobie! W tym królestwie całym"
        ru: "осанна тебе! Во всём этом царстве"
      - pl: "\nSzczęśliwe światła sam światłością twoją"
        ru: "ты сам своим светом зажигаешь"
      - pl: "\nZapalający z miłością, z zapałem»."
        ru: "счастливые светила с любовью, с пылом»."
        note: "у Данте — по-латыни"
      - pl: "\nTak do swej sfery zwrócony duch śpiewał,"
        ru: "Так пел дух, обратившись к своей сфере,"
      - pl: "\nPromień go blaskiem podwójnym zalewał."
        ru: "луч заливал его двойным блеском."
    words: { "tarczo": tarcza, "królestwie": krolestwo, "zwrócony": zwrocic, "Promień": promien, "blaskiem": blask, "podwójnym": podwojny }
  - clean: "On, inne światła, co razem z tym duchem\nZnów jęły tańczyć wirującym ruchem,\nZnikły w oddali jak skry latające,\nA we mnie myśli mówiły wątpiące;\n«Mów do swej Pani: o święta szczebiotko!\nZgaś mi pragnienie rosą ust twych słodką»."
    verse: true
    chunks:
      - pl: "On, inne światła, co razem z tym duchem"
        ru: "Он и другие светила, что вместе с этим духом"
      - pl: "\nZnów jęły tańczyć wirującym ruchem,"
        ru: "снова начали плясать кружащимся движением,"
      - pl: "\nZnikły w oddali jak skry latające,"
        ru: "исчезли вдали, как летящие искры,"
      - pl: "\nA we mnie myśli mówiły wątpiące;"
        ru: "а во мне сомневающиеся мысли говорили:"
      - pl: "\n«Mów do swej Pani: o święta szczebiotko!"
        ru: "«Скажи своей Госпоже: о святая щебетунья!"
        note: "szczebiotka — щебетунья"
      - pl: "\nZgaś mi pragnienie rosą ust twych słodką»."
        ru: "утоли мою жажду сладкой росой своих уст»."
    words: { "tańczyć": tanczyc, "latające": latac, "wątpiące": watpic, "Zgaś": zgasic, "pragnienie": pragnienie, "rosą": rosa }
  - clean: "Lecz przez cześć, jaką mam dla B, dla ICE\nSkłoniłem głowę jak człek przy zaśnieniu,\nPoszanowania tak wielkiej oznaki\nNie mogła długo ścierpieć Beatryce,\nI tak poczęła, podnosząc głos silny,\nŚwiecąc uśmiechem, uśmiech mógłby taki\nZrobić człowieka szczęśliwym w płomieniu."
    verse: true
    chunks:
      - pl: "Lecz przez cześć, jaką mam dla B, dla ICE"
        ru: "Но из почтения, какое я питаю к «Б», к «ИЧЕ»,"
        note: "Bice — уменьшительное от Беатриче"
      - pl: "\nSkłoniłem głowę jak człek przy zaśnieniu,"
        ru: "я склонил голову, как человек при засыпании,"
      - pl: "\nPoszanowania tak wielkiej oznaki"
        ru: "знака столь великого почтения"
      - pl: "\nNie mogła długo ścierpieć Beatryce,"
        ru: "Беатриче не могла долго терпеть"
      - pl: "\nI tak poczęła, podnosząc głos silny,"
        ru: "и так начала, возвышая сильный голос,"
      - pl: "\nŚwiecąc uśmiechem, uśmiech mógłby taki"
        ru: "сияя улыбкой, — такая улыбка могла бы"
      - pl: "\nZrobić człowieka szczęśliwym w płomieniu."
        ru: "сделать человека счастливым в пламени."
    words: { "oznaki": oznaka, "poczęła": poczac, "podnosząc": podnosic, "Świecąc": swiecic, "uśmiechem": usmiech, "płomieniu": plomien }
  - clean: "«Jak mnie poucza sąd mój nieomylny,\nTy myślisz: zemsta z woli niebios Pana\nSłuszna, jak była słusznie ukarana?\nWięc słuchaj, myśl twą ja szybko wyzwolę,\nSiew prawdy wielkiej rzucam na jej rolę.\nGdy użyteczne wędzidło na wolę\nPotargał człowiek z matki niepoczęty,\nZa grzech ten z raju na zawsze wyklęty,\nKlątwę sprowadził na całe swe plemię."
    verse: true
    chunks:
      - pl: "«Jak mnie poucza sąd mój nieomylny,"
        ru: "«Как меня учит моё непогрешимое суждение,"
      - pl: "\nTy myślisz: zemsta z woli niebios Pana"
        ru: "ты думаешь: месть по воле Господа небес"
      - pl: "\nSłuszna, jak była słusznie ukarana?"
        ru: "справедлива — как же она была справедливо наказана?"
        note: "месть за распятие — разрушение Иерусалима"
      - pl: "\nWięc słuchaj, myśl twą ja szybko wyzwolę,"
        ru: "Так слушай, я быстро освобожу твою мысль,"
      - pl: "\nSiew prawdy wielkiej rzucam na jej rolę."
        ru: "бросаю на её ниву семя великой истины."
      - pl: "\nGdy użyteczne wędzidło na wolę"
        ru: "Когда полезную узду на волю"
      - pl: "\nPotargał człowiek z matki niepoczęty,"
        ru: "порвал человек, не зачатый от матери,"
        note: "Адам"
      - pl: "\nZa grzech ten z raju na zawsze wyklęty,"
        ru: "проклятый за этот грех из рая навсегда,"
      - pl: "\nKlątwę sprowadził na całe swe plemię."
        ru: "он навлёк проклятие на всё своё племя."
    words: { "niebios": niebiosa, "Słuszna": sluszny, "słusznie": slusznie, "ukarana": ukarac, "raju": raj, "Klątwę": klatwa }
  - clean: "Stąd w błędzie wielkim, znosząc grzechu brzemię\nPrzez wiele wieków żył świat podsłoneczny,\nAż gdy Bóg-słowo zstępując na ziemię,\nNaturę, co grzech z jej stwórcą rozdzielił,\nZłączył sam w sobie i do siebie wcielił,\nWprost przez czyn jeden swej miłości wiecznej."
    verse: true
    chunks:
      - pl: "Stąd w błędzie wielkim, znosząc grzechu brzemię"
        ru: "Оттого в великом заблуждении, неся бремя греха,"
      - pl: "\nPrzez wiele wieków żył świat podsłoneczny,"
        ru: "много веков жил подсолнечный мир,"
      - pl: "\nAż gdy Bóg-słowo zstępując na ziemię,"
        ru: "пока Бог-Слово, сойдя на землю,"
      - pl: "\nNaturę, co grzech z jej stwórcą rozdzielił,"
        ru: "природу, которую грех отделил от её создателя,"
      - pl: "\nZłączył sam w sobie i do siebie wcielił,"
        ru: "не соединил сам в себе и не воплотил в себя"
      - pl: "\nWprost przez czyn jeden swej miłości wiecznej."
        ru: "прямо одним делом своей вечной любви."
    words: { "znosząc": znosic, "wieków": wiek, "Naturę": natura, "rozdzielił": rozdzielic, "czyn": czyn, "wiecznej": wieczny }
  - clean: "Tu z twoich oczu spadnie błędu chmura:\nZłączona z swoim stwórcą ta natura\nSzczerą i dobrą w swojej treści była,\nJak w dzień, gdy wieczna miłość ją stworzyła.\nJej grzech ją z raju wygnał bez nadziei,\nBo wyszła z prawdy i życia kolei."
    verse: true
    chunks:
      - pl: "Tu z twoich oczu spadnie błędu chmura:"
        ru: "Здесь с твоих глаз спадёт туча заблуждения:"
      - pl: "\nZłączona z swoim stwórcą ta natura"
        ru: "соединённая со своим создателем, эта природа"
      - pl: "\nSzczerą i dobrą w swojej treści była,"
        ru: "была искренней и доброй в своей сути,"
      - pl: "\nJak w dzień, gdy wieczna miłość ją stworzyła."
        ru: "как в день, когда вечная любовь её создала."
      - pl: "\nJej grzech ją z raju wygnał bez nadziei,"
        ru: "Её грех изгнал её из рая без надежды,"
      - pl: "\nBo wyszła z prawdy i życia kolei."
        ru: "ибо она сошла с пути истины и жизни."
    words: { "spadnie": spasc, "błędu": blad, "chmura": chmura, "Szczerą": szczery, "stworzyła": stworzyc, "kolei": kolej }
  - clean: "A zatem, męka porównana krzyża\nZ naturą, jaką wziął Ukrzyżowany,\nSprawiedliwości w niczym nie ubliża;\nRazem jej sądu nie wytrzyma próby,\nJako sądzona względnie do osoby,\nCo wycierpiała obelgi i rany,\nW końcu krzyżową śmierć za grzech Adama,\nŁącząc treść z sobą natury człowieczej,\nPrzeto czyn jeden wylągł różne rzeczy;\nBo śmierć ta sama pożądaną była\nBogu i Żydom; śmierć, mówię, ta sama\nZiemią zatrzęsła, niebo otworzyła."
    verse: true
    chunks:
      - pl: "A zatem, męka porównana krzyża"
        ru: "Итак, мука креста, если сравнить её"
      - pl: "\nZ naturą, jaką wziął Ukrzyżowany,"
        ru: "с природой, которую принял Распятый,"
      - pl: "\nSprawiedliwości w niczym nie ubliża;"
        ru: "ни в чём не умаляет справедливости;"
        note: "ubliżać — умалять"
      - pl: "\nRazem jej sądu nie wytrzyma próby,"
        ru: "вместе с тем она не выдержит испытания её суда,"
      - pl: "\nJako sądzona względnie do osoby,"
        ru: "если судить её относительно Лица,"
        note: "то есть Бога"
      - pl: "\nCo wycierpiała obelgi i rany,"
        ru: "что претерпело оскорбления и раны,"
      - pl: "\nW końcu krzyżową śmierć za grzech Adama,"
        ru: "наконец смерть на кресте за грех Адама,"
      - pl: "\nŁącząc treść z sobą natury człowieczej,"
        ru: "соединяя с собой суть человеческой природы,"
      - pl: "\nPrzeto czyn jeden wylągł różne rzeczy;"
        ru: "поэтому одно дело породило разные вещи;"
      - pl: "\nBo śmierć ta sama pożądaną była"
        ru: "ибо эта самая смерть была желанна"
      - pl: "\nBogu i Żydom; śmierć, mówię, ta sama"
        ru: "Богу и иудеям; смерть, говорю, та самая"
      - pl: "\nZiemią zatrzęsła, niebo otworzyła."
        ru: "сотрясла землю, открыла небо."
    words: { "porównana": porownac, "krzyża": krzyz, "Sprawiedliwości": sprawiedliwosc, "wytrzyma": wytrzymac, "obelgi": obelga, "Łącząc": laczyc }
  - clean: "Odtąd zwątpienie tobie nie zaprzeczy,\nŻe sprawiedliwy sąd sądził niekrzywo,\nUkarać zemstą zemstę sprawiedliwą.\nLecz widzę, duch twój w sieć myśli uwięzły,\nRad by co prędzej potargać jej węzły.\nMówisz: »Co słyszę, pojmuję nieciemno,\nLecz ku naszemu po co odkupieniu\nBóg-syn chciał umrzeć w krzyżowym cierpieniu?"
    verse: true
    chunks:
      - pl: "Odtąd zwątpienie tobie nie zaprzeczy,"
        ru: "Отныне сомнение тебе не возразит,"
      - pl: "\nŻe sprawiedliwy sąd sądził niekrzywo,"
        ru: "что справедливый суд судил не криво,"
      - pl: "\nUkarać zemstą zemstę sprawiedliwą."
        ru: "карая местью справедливую месть."
      - pl: "\nLecz widzę, duch twój w sieć myśli uwięzły,"
        ru: "Но вижу, твой дух, застрявший в сети мыслей,"
      - pl: "\nRad by co prędzej potargać jej węzły."
        ru: "хотел бы поскорее разорвать её узлы."
      - pl: "\nMówisz: »Co słyszę, pojmuję nieciemno,"
        ru: "Ты говоришь: „Что слышу, понимаю не темно,"
      - pl: "\nLecz ku naszemu po co odkupieniu"
        ru: "но зачем для нашего искупления"
      - pl: "\nBóg-syn chciał umrzeć w krzyżowym cierpieniu?"
        ru: "Бог-Сын захотел умереть в крестной муке?"
    words: { "Odtąd": odtad, "zaprzeczy": zaprzeczyc, "sprawiedliwy": sprawiedliwy, "prędzej": predko, "węzły": wezel, "odkupieniu": odkupic }
  - clean: "To jest na zawsze zakryte przede mną«.\n— Bracie, ten wyrok zawsze się powleka\nMgłą tajemniczą przed wzrokiem człowieka,\nCzyj duch nie wyrósł w miłości płomieniu.\nW rozumującym o wszech rzeczach tłumie,\nGdy arcyrzadki ten przedmiot rozumie,\nPowiem ci, w jakim był wybrany celu\nŚrodek ten jako najgodniejszy z wielu."
    verse: true
    chunks:
      - pl: "To jest na zawsze zakryte przede mną«."
        ru: "Это навсегда скрыто от меня“."
      - pl: "\n— Bracie, ten wyrok zawsze się powleka"
        ru: "— Брат, этот приговор всегда окутывается"
      - pl: "\nMgłą tajemniczą przed wzrokiem człowieka,"
        ru: "таинственным туманом перед взором человека,"
      - pl: "\nCzyj duch nie wyrósł w miłości płomieniu."
        ru: "чей дух не вырос в пламени любви."
      - pl: "\nW rozumującym o wszech rzeczach tłumie,"
        ru: "В толпе, рассуждающей обо всех вещах,"
      - pl: "\nGdy arcyrzadki ten przedmiot rozumie,"
        ru: "так как крайне редко кто понимает этот предмет,"
      - pl: "\nPowiem ci, w jakim był wybrany celu"
        ru: "я скажу тебе, с какой целью было избрано"
      - pl: "\nŚrodek ten jako najgodniejszy z wielu."
        ru: "это средство как самое достойное из многих."
    words: { "Mgłą": mgla, "tajemniczą": tajemniczy, "wzrokiem": wzrok, "tłumie": tlum, "przedmiot": przedmiot, "najgodniejszy": godny }
  - clean: "Bóg sam ognisko miłości przeczyste\nZapala w sobie; On moc wszechmogąca,\nWyiskrza w sobie piękno wiekuiste:\nCo bezpośrednio z niej jest, nie ma końca,\nBo jej pieczęci nic złamać nie może,\nGdzie ją przyłożą same ręce boże."
    verse: true
    chunks:
      - pl: "Bóg sam ognisko miłości przeczyste"
        ru: "Бог сам зажигает в себе пречистый очаг"
      - pl: "\nZapala w sobie; On moc wszechmogąca,"
        ru: "любви; Он, всемогущая сила,"
      - pl: "\nWyiskrza w sobie piękno wiekuiste:"
        ru: "выискривает в себе вечную красоту:"
      - pl: "\nCo bezpośrednio z niej jest, nie ma końca,"
        ru: "что непосредственно от неё, не имеет конца,"
      - pl: "\nBo jej pieczęci nic złamać nie może,"
        ru: "ибо её печати ничто не может сломать,"
      - pl: "\nGdzie ją przyłożą same ręce boże."
        ru: "там, где её приложат сами Божьи руки."
    words: { "ognisko": ognisko, "miłości": milosc, "końca": koniec, "złamać": zlamac, "przyłożą": przylozyc, "ręce": reka }
  - clean: "Jej bezpośredni wpływ wolny, rozległy,\nPodrzędnych rzeczy wpływom niepodległy.\nIm więcej w treści ducha i żywota\nDo niej podobna z niej wyszła istota,\nW tej święty ogień żywsze blaski miota.\nBezpośrednimi miłości darami\nLudzie są wyżsi nad inne stworzenia,\nJeden z tych darów gdy znieważą sami,\nJuż zrzec się muszą swego uszlachcenia."
    verse: true
    chunks:
      - pl: "Jej bezpośredni wpływ wolny, rozległy,"
        ru: "Её непосредственное влияние свободно, обширно,"
      - pl: "\nPodrzędnych rzeczy wpływom niepodległy."
        ru: "не подвластно влияниям подчинённых вещей."
      - pl: "\nIm więcej w treści ducha i żywota"
        ru: "Чем больше по сути духа и жизни"
      - pl: "\nDo niej podobna z niej wyszła istota,"
        ru: "подобно ей вышедшее из неё существо,"
      - pl: "\nW tej święty ogień żywsze blaski miota."
        ru: "тем живее мечет в нём блески святой огонь."
      - pl: "\nBezpośrednimi miłości darami"
        ru: "Непосредственными дарами любви"
      - pl: "\nLudzie są wyżsi nad inne stworzenia,"
        ru: "люди выше прочих творений;"
      - pl: "\nJeden z tych darów gdy znieważą sami,"
        ru: "если они сами оскорбят один из этих даров,"
      - pl: "\nJuż zrzec się muszą swego uszlachcenia."
        ru: "они уже должны отречься от своего благородства."
    words: { "wpływ": wplyw, "istota": istota, "święty": swiety, "ogień": ogien, "żywsze": zywy, "darami": dar }
  - clean: "Grzechu nad ludzką naturą zwycięstwo\nOdbiera wolność jej i podobieństwo\nZ najwyższym Dobrem, bo ciemna zakałą\nSłabo odbija jego światłość białą.\nI do rodzimej godności nie wróci,\nJeśli pokuta albo czyn dobroci\nPrzez grzech zrobionej czczości nie zapełni."
    verse: true
    chunks:
      - pl: "Grzechu nad ludzką naturą zwycięstwo"
        ru: "Победа греха над человеческой природой"
      - pl: "\nOdbiera wolność jej i podobieństwo"
        ru: "отнимает у неё свободу и сходство"
      - pl: "\nZ najwyższym Dobrem, bo ciemna zakałą"
        ru: "с высшим Благом, ибо, тёмная позором,"
      - pl: "\nSłabo odbija jego światłość białą."
        ru: "она слабо отражает его белый свет."
      - pl: "\nI do rodzimej godności nie wróci,"
        ru: "И к родному достоинству она не вернётся,"
      - pl: "\nJeśli pokuta albo czyn dobroci"
        ru: "если покаяние или дело доброты"
      - pl: "\nPrzez grzech zrobionej czczości nie zapełni."
        ru: "не наполнит пустоты, сделанной грехом."
