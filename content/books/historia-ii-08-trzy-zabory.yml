  - clean: "Drugim wielkim polem walki była szkoła. W szkołach pruskich uczono po niemiecku, a po polsku tylko religii. W 1901 roku władze postanowiły, że także religii dzieci mają się uczyć po niemiecku. W szkole we Wrześni dzieci odmówiły odpowiadania po niemiecku na lekcjach religii i używania niemieckich katechizmów. Nauczyciele bili je za to, a kiedy rodzice stanęli w obronie dzieci, sąd skazał ich na więzienie. O strajku dzieci we Wrześni dowiedział się cały świat, a Henryk Sienkiewicz i inni pisarze publicznie protestowali. Kilka lat później strajk szkolny objął setki szkół i dziesiątki tysięcy dzieci w całej Wielkopolsce."
