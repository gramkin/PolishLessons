  - clean: "Najważniejszym polem walki stała się ziemia. W 1886 roku rząd pruski utworzył Komisję Kolonizacyjną, która dostała ogromne pieniądze na wykupywanie ziemi od Polaków i osiedlanie na niej niemieckich chłopów. Kilka lat później powstało Niemieckie Towarzystwo Kresów Wschodnich, które Polacy nazywali Hakatą, od pierwszych liter nazwisk jego założycieli. Hakata prowadziła propagandę przeciwko Polakom i domagała się coraz ostrzejszych ustaw."
    draft: true
    chunks:
      - pl: "Najważniejszym polem walki stała się ziemia."
        ru: "Главным полем борьбы стала земля."
      - pl: " W 1886 roku rząd pruski utworzył Komisję Kolonizacyjną, która dostała ogromne pieniądze na wykupywanie ziemi od Polaków i osiedlanie na niej niemieckich chłopów."
        ru: "В 1886 году прусское правительство создало Колонизационную комиссию, которая получила огромные деньги на скупку земли у поляков и поселение на ней немецких крестьян."
      - pl: " Kilka lat później powstało Niemieckie Towarzystwo Kresów Wschodnich, które Polacy nazywali Hakatą, od pierwszych liter nazwisk jego założycieli."
        ru: "Несколько лет спустя возникло Германское общество восточных окраин, которое поляки называли Хакатой — по первым буквам фамилий его основателей."
      - pl: " Hakata prowadziła propagandę przeciwko Polakom i domagała się coraz ostrzejszych ustaw."
        ru: "Хаката вела пропаганду против поляков и требовала всё более жёстких законов."
    words: { "niemieckich": niemiecki, "chłopów": chlop, "powstało": powstac, "liter": litera }
  - clean: "Polacy odpowiedzieli w sposób, którego Niemcy się nie spodziewali. Zamiast powstania zorganizowali sieć banków, spółdzielni i towarzystw rolniczych, które pomagały polskim chłopom i ziemianom utrzymać ziemię. Ksiądz Piotr Wawrzyniak kierował związkiem kilkuset polskich spółdzielni kredytowych, które udzielały tanich pożyczek. Polskie gazety apelowały, żeby nie sprzedawać ziemi Niemcom, a sprzedaż ziemi Komisji uważano za zdradę narodową. Wynik był zaskakujący: w ciągu kilkudziesięciu lat Polacy kupili więcej ziemi od Niemców, niż Komisja zdołała wykupić od Polaków. Zabór pruski stał się dla Polaków szkołą nowoczesnej, zorganizowanej pracy. Poznańczyków do dziś uważa się w Polsce za ludzi szczególnie pracowitych, oszczędnych i dobrze zorganizowanych. Polacy mieli też swoich przedstawicieli w parlamencie pruskim i w parlamencie Rzeszy, gdzie tworzyli Koło Polskie i bronili praw polskiej ludności. Ich przemówienia rzadko coś zmieniały, ale pokazywały Europie, że w Niemczech żyje naród, który nie chce się zgermanizować."
    draft: true
    chunks:
      - pl: "Polacy odpowiedzieli w sposób, którego Niemcy się nie spodziewali."
        ru: "Поляки ответили так, как немцы не ожидали."
      - pl: " Zamiast powstania zorganizowali sieć banków, spółdzielni i towarzystw rolniczych, które pomagały polskim chłopom i ziemianom utrzymać ziemię."
        ru: "Вместо восстания они создали сеть банков, кооперативов и сельскохозяйственных обществ, которые помогали польским крестьянам и землевладельцам сохранить землю."
      - pl: " Ksiądz Piotr Wawrzyniak kierował związkiem kilkuset polskich spółdzielni kredytowych, które udzielały tanich pożyczek."
        ru: "Ксёндз Пётр Вавжиняк руководил союзом нескольких сотен польских кредитных кооперативов, которые давали дешёвые займы."
        note: "pożyczka — заём"
      - pl: " Polskie gazety apelowały, żeby nie sprzedawać ziemi Niemcom, a sprzedaż ziemi Komisji uważano za zdradę narodową."
        ru: "Польские газеты призывали не продавать землю немцам, а продажу земли комиссии считали национальной изменой."
      - pl: " Wynik był zaskakujący: w ciągu kilkudziesięciu lat Polacy kupili więcej ziemi od Niemców, niż Komisja zdołała wykupić od Polaków."
        ru: "Результат был неожиданным: за несколько десятилетий поляки купили у немцев больше земли, чем комиссия сумела выкупить у поляков."
      - pl: " Zabór pruski stał się dla Polaków szkołą nowoczesnej, zorganizowanej pracy."
        ru: "Прусская часть стала для поляков школой современного, организованного труда."
      - pl: " Poznańczyków do dziś uważa się w Polsce za ludzi szczególnie pracowitych, oszczędnych i dobrze zorganizowanych."
        ru: "Познаньцев до сих пор считают в Польше особенно трудолюбивыми, бережливыми и хорошо организованными людьми."
        note: "oszczędny — бережливый"
      - pl: " Polacy mieli też swoich przedstawicieli w parlamencie pruskim i w parlamencie Rzeszy, gdzie tworzyli Koło Polskie i bronili praw polskiej ludności."
        ru: "У поляков были и свои представители в прусском парламенте и в рейхстаге, где они образовывали Польское коло и защищали права польского населения."
      - pl: " Ich przemówienia rzadko coś zmieniały, ale pokazywały Europie, że w Niemczech żyje naród, który nie chce się zgermanizować."
        ru: "Их речи редко что-то меняли, но показывали Европе, что в Германии живёт народ, который не хочет германизироваться."
    words: { "zorganizowali": zorganizowac, "polskim": polski, "chłopom": chlop, "Ksiądz": ksiadz, "kierował": kierowac, "polskich": polski, "kredytowych": kredytowy, "tanich": tani, "pożyczek": pozyczka, "sprzedaż": sprzedaz, "zdradę": zdrada, "narodową": narodowy, "zdołała": zdolac, "nowoczesnej": nowoczesny, "zorganizowanej": zorganizowac, "szczególnie": szczegolnie, "zorganizowanych": zorganizowac, "przedstawicieli": przedstawiciel, "polskiej": polski, "rzadko": rzadko, "naród": narod }
  - clean: "Symbolem tej walki stał się chłop Michał Drzymała. W 1904 roku kupił kawałek ziemi we wsi Podgradowice w Wielkopolsce i chciał zbudować na nim dom. Władze pruskie odmówiły mu pozwolenia, powołując się na nowe prawo, które zakazywało Polakom budowania domów na nowo kupionej ziemi. Drzymała znalazł sposób, by obejść ten przepis. Kupił stary wóz cyrkowy i zamieszkał w nim z rodziną. Prawo mówiło o domach, a wóz był pojazdem, a nie domem, ale urzędnicy uznali, że wóz stojący ciągle w jednym miejscu jest domem. Wtedy Drzymała zaczął codziennie przesuwać wóz o kilka metrów. Walka z urzędnikami trwała kilka lat, a o chłopie w wozie pisała prasa w całej Europie. Wóz Drzymały stał się symbolem polskiego uporu i sprytu w walce z germanizacją. Wieś, w której mieszkał, nazywa się dziś na jego cześć Drzymałowo, a jego wóz stał się bohaterem piosenek, wierszy i karykatur."
    draft: true
    chunks:
