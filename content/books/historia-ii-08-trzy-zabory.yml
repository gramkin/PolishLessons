  - clean: "Jedynym wielkim bogactwem Galicji była ropa naftowa. Już w 1853 roku we Lwowie aptekarz Ignacy Łukasiewicz wydestylował z ropy naftę i skonstruował pierwszą lampę naftową. Jej światło oświetliło po raz pierwszy salę operacyjną szpitala lwowskiego w czasie nocnej operacji. Rok później Łukasiewicz założył w Bóbrce koło Krosna jedną z pierwszych na świecie kopalń ropy naftowej, która działa do dziś jako muzeum. Pod koniec stulecia okolice Borysławia stały się jednym z najważniejszych zagłębi naftowych Europy. Większość zysków trafiała jednak do zagranicznych spółek, a ropa nie zmieniła biedy całej prowincji. Galicja miała jednak też swoje zalety: dzięki polskim szkołom, uniwersytetom i urzędom wychowało się tam pokolenie wykształconych urzędników, nauczycieli i oficerów. To oni po odzyskaniu niepodległości stali się kadrą administracji nowego państwa."
