      - pl: " Władze pruskie odmówiły mu pozwolenia, powołując się na nowe prawo, które zakazywało Polakom budowania domów na nowo kupionej ziemi."
        ru: "Прусские власти отказали ему в разрешении, ссылаясь на новый закон, запрещавший полякам строить дома на вновь купленной земле."
      - pl: " Drzymała znalazł sposób, by obejść ten przepis."
        ru: "Джимала нашёл способ обойти это предписание."
      - pl: " Kupił stary wóz cyrkowy i zamieszkał w nim z rodziną."
        ru: "Он купил старый цирковой фургон и поселился в нём с семьёй."
        note: "wóz cyrkowy — цирковой фургон"
      - pl: " Prawo mówiło o domach, a wóz był pojazdem, a nie domem, ale urzędnicy uznali, że wóz stojący ciągle w jednym miejscu jest domem."
        ru: "Закон говорил о домах, а фургон был транспортным средством, а не домом, но чиновники решили, что фургон, постоянно стоящий на одном месте, является домом."
        note: "pojazd — транспортное средство"
      - pl: " Wtedy Drzymała zaczął codziennie przesuwać wóz o kilka metrów."
        ru: "Тогда Джимала стал каждый день передвигать фургон на несколько метров."
