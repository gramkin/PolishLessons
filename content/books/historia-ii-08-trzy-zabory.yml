      - pl: " W szkole we Wrześni dzieci odmówiły odpowiadania po niemiecku na lekcjach religii i używania niemieckich katechizmów."
        ru: "В школе во Вжесне дети отказались отвечать по-немецки на уроках закона Божьего и пользоваться немецкими катехизисами."
