  - clean: "W odpowiedzi na politykę germanizacji poetka Maria Konopnicka napisała w 1908 roku wiersz „Rota”. Zaczynał się od słów: „Nie rzucim ziemi, skąd nasz ród”. Była to przysięga, że Polacy nigdy nie oddadzą swojej ziemi i nie pozwolą zgermanizować swoich dzieci. Do słów Konopnickiej muzykę skomponował Feliks Nowowiejski, a „Rotę” po raz pierwszy wykonano publicznie w 1910 roku w Krakowie, w czasie obchodów pięćsetnej rocznicy bitwy pod Grunwaldem. Przez długi czas pieśń ta była nieoficjalnym hymnem Polaków w zaborze pruskim, a po odzyskaniu niepodległości proponowano nawet, by została hymnem państwowym."
    draft: true
    chunks:
      - pl: "W odpowiedzi na politykę germanizacji poetka Maria Konopnicka napisała w 1908 roku wiersz „Rota”."
        ru: "В ответ на политику германизации поэтесса Мария Конопницкая написала в 1908 году стихотворение «Рота»."
        note: "rota — клятва (старинное)"
      - pl: " Zaczynał się od słów: „Nie rzucim ziemi, skąd nasz ród”."
        ru: "Оно начиналось словами: «Не бросим землю, откуда наш род»."
      - pl: " Była to przysięga, że Polacy nigdy nie oddadzą swojej ziemi i nie pozwolą zgermanizować swoich dzieci."
        ru: "Это была клятва, что поляки никогда не отдадут свою землю и не позволят германизировать своих детей."
