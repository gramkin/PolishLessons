  - clean: "Najtrudniej było w zaborze pruskim. Po zjednoczeniu Niemiec w 1871 roku kanclerz Otto von Bismarck uznał, że w nowym państwie nie ma miejsca dla innych narodów. Rozpoczął walkę z Kościołem katolickim, którą nazwano Kulturkampfem, czyli walką o kulturę. Dla Polaków była to walka z ich wiarą i narodowością jednocześnie. Arcybiskupa gnieźnieńskiego i poznańskiego, Mieczysława Ledóchowskiego, uwięziono za to, że nie chciał podporządkować się nowym prawom. Setki parafii zostały bez księży, a językiem urzędowym we wszystkich instytucjach stał się wyłącznie niemiecki."
    draft: true
    chunks:
      - pl: "Najtrudniej było w zaborze pruskim."
        ru: "Труднее всего было в прусской части."
      - pl: " Po zjednoczeniu Niemiec w 1871 roku kanclerz Otto von Bismarck uznał, że w nowym państwie nie ma miejsca dla innych narodów."
        ru: "После объединения Германии в 1871 году канцлер Отто фон Бисмарк решил, что в новом государстве нет места для других народов."
      - pl: " Rozpoczął walkę z Kościołem katolickim, którą nazwano Kulturkampfem, czyli walką o kulturę."
        ru: "Он начал борьбу с католической церковью, которую назвали Культуркампфом, то есть борьбой за культуру."
      - pl: " Dla Polaków była to walka z ich wiarą i narodowością jednocześnie."
        ru: "Для поляков это была борьба одновременно с их верой и их национальностью."
      - pl: " Arcybiskupa gnieźnieńskiego i poznańskiego, Mieczysława Ledóchowskiego, uwięziono za to, że nie chciał podporządkować się nowym prawom."
        ru: "Архиепископа гнезненского и познанского, Мечислава Ледуховского, заключили в тюрьму за то, что он не захотел подчиниться новым законам."
      - pl: " Setki parafii zostały bez księży, a językiem urzędowym we wszystkich instytucjach stał się wyłącznie niemiecki."
        ru: "Сотни приходов остались без священников, а официальным языком во всех учреждениях стал исключительно немецкий."
