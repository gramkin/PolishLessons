paragraphs:
  - clean: "W drugiej połowie XIX wieku Polacy żyli w trzech zupełnie różnych światach. Granice zaborów dzieliły nie tylko państwa, ale także systemy prawne, szkoły, gospodarkę, a nawet sposób myślenia. Polak z Poznania, Polak z Krakowa i Polak z Warszawy mówili tym samym językiem, modlili się w tych samych kościołach i czytali te same książki. Ale ich codzienne życie wyglądało zupełnie inaczej. W zaborze pruskim panował porządek i dobrobyt, ale państwo walczyło z polskością. W zaborze austriackim panowała bieda, ale Polacy mieli autonomię i polskie szkoły. W zaborze rosyjskim rozwijał się przemysł, ale rządziła cenzura i policja. W tym rozdziale przyjrzymy się bliżej dwóm pierwszym."
    draft: true
    chunks:
      - pl: "W drugiej połowie XIX wieku Polacy żyli w trzech zupełnie różnych światach."
        ru: "Во второй половине XIX века поляки жили в трёх совершенно разных мирах."
      - pl: " Granice zaborów dzieliły nie tylko państwa, ale także systemy prawne, szkoły, gospodarkę, a nawet sposób myślenia."
        ru: "Границы между частями страны разделяли не только государства, но и правовые системы, школы, экономику и даже образ мыслей."
      - pl: " Polak z Poznania, Polak z Krakowa i Polak z Warszawy mówili tym samym językiem, modlili się w tych samych kościołach i czytali te same książki."
        ru: "Поляк из Познани, поляк из Кракова и поляк из Варшавы говорили на одном языке, молились в одних и тех же костёлах и читали одни и те же книги."
      - pl: " Ale ich codzienne życie wyglądało zupełnie inaczej."
        ru: "Но их повседневная жизнь выглядела совсем по-разному."
      - pl: " W zaborze pruskim panował porządek i dobrobyt, ale państwo walczyło z polskością."
        ru: "В прусской части царили порядок и достаток, но государство боролось с польскостью."
      - pl: " W zaborze austriackim panowała bieda, ale Polacy mieli autonomię i polskie szkoły."
        ru: "В австрийской части царила бедность, но у поляков была автономия и польские школы."
      - pl: " W zaborze rosyjskim rozwijał się przemysł, ale rządziła cenzura i policja."
        ru: "В российской части развивалась промышленность, но правили цензура и полиция."
      - pl: " W tym rozdziale przyjrzymy się bliżej dwóm pierwszym."
        ru: "В этой главе мы внимательнее посмотрим на две первые."
