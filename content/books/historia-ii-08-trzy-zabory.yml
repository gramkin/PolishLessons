  - clean: "W Galicji rodził się też nowoczesny ruch polityczny chłopów. Chłopi, którzy dopiero niedawno przestali być poddanymi panów, chcieli mieć własnych przedstawicieli w sejmie i w parlamencie wiedeńskim. Wielką rolę odegrał w tym ksiądz Stanisław Stojałowski, który wydawał gazety dla ludu i budził w chłopach świadomość ich praw, za co często popadał w konflikt z biskupami i władzami. W 1895 roku powstało Stronnictwo Ludowe, pierwsza polska partia chłopska. W 1907 roku Austria wprowadziła powszechne prawo wyborcze dla mężczyzn, a do parlamentu weszło wielu posłów chłopskich. Jednym z nich był Wincenty Witos, chłop spod Tarnowa, który sam uprawiał swoją ziemię, a w niepodległej Polsce trzykrotnie został premierem. Wnuki chłopów, którzy w 1846 roku mordowali szlachtę, stawały się świadomymi obywatelami polskiego narodu."
