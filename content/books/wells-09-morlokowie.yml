      - pl: " Ale następnego ranka zrozumiałem dość jasno, że moja ciekawość co do Pałacu z Zielonej Porcelany była samooszukiwaniem,"
        ru: "Но на следующее утро я довольно ясно понял, что моё любопытство к Дворцу из Зелёного Фарфора было самообманом,"
