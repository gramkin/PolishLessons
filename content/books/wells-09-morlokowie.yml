  - clean: "Następnej nocy spałem źle. Prawdopodobnie moje zdrowie było trochę nadwątlone. Gnębiły mnie zakłopotanie i wątpliwości. Raz czy dwa poczułem silny strach, dla którego nie umiałem dostrzec żadnej wyraźnej przyczyny. Pamiętam, jak bezszelestnie zakradłem się do wielkiej sali, gdzie mali ludzie spali w świetle księżyca — tej nocy była wśród nich Weena — i jak ich obecność dodała mi otuchy. Już wtedy przyszło mi do głowy, że za kilka dni księżyc musi przejść w ostatnią kwadrę i noce staną się ciemne, a wtedy te nieprzyjemne stworzenia z dołu, te wybielone Lemury, to nowe robactwo, które zastąpiło dawne, mogą pojawiać się liczniej."
    en: "“The next night I did not sleep well. Probably my health was a little disordered. I was oppressed with perplexity and doubt. Once or twice I had a feeling of intense fear for which I could perceive no definite reason. I remember creeping noiselessly into the great hall where the little people were sleeping in the moonlight—that night Weena was among them—and feeling reassured by their presence. It occurred to me even then, that in the course of a few days the moon must pass through its last quarter, and the nights grow dark, when the appearances of these unpleasant creatures from below, these whitened Lemurs, this new vermin that had replaced the old, might be more abundant."
    draft: true
    chunks:
      - pl: "Następnej nocy spałem źle."
        ru: "Следующей ночью я спал плохо."
      - pl: " Prawdopodobnie moje zdrowie było trochę nadwątlone."
        ru: "Вероятно, здоровье моё было немного расстроено."
        note: "nadwątlony — подорванный"
      - pl: " Gnębiły mnie zakłopotanie i wątpliwości."
        ru: "Меня угнетали растерянность и сомнения."
      - pl: " Raz czy dwa poczułem silny strach, dla którego nie umiałem dostrzec żadnej wyraźnej przyczyny."
        ru: "Раз или два я ощутил сильный страх, для которого не мог найти никакой ясной причины."
      - pl: " Pamiętam, jak bezszelestnie zakradłem się do wielkiej sali, gdzie mali ludzie spali w świetle księżyca — tej nocy była wśród nich Weena — i jak ich obecność dodała mi otuchy."
        ru: "Помню, как бесшумно прокрался в большой зал, где маленькие люди спали в лунном свете, — в ту ночь среди них была Уина, — и как их присутствие меня успокоило."
        note: "zakraść się — прокрасться; dodać otuchy — ободрить"
      - pl: " Już wtedy przyszło mi do głowy, że za kilka dni księżyc musi przejść w ostatnią kwadrę i noce staną się ciemne,"
        ru: "Уже тогда мне пришло в голову, что через несколько дней луна должна вступить в последнюю четверть и ночи станут тёмными,"
      - pl: " a wtedy te nieprzyjemne stworzenia z dołu, te wybielone Lemury, to nowe robactwo, które zastąpiło dawne, mogą pojawiać się liczniej."
        ru: "и тогда эти неприятные создания снизу, эти выбеленные Лемуры, эти новые паразиты, сменившие прежних, могут появляться чаще."
        note: "robactwo — паразиты, гнусь"
    words: { "wątpliwości": watpliwosc, "dostrzec": dostrzec, "otuchy": otucha, "nieprzyjemne": nieprzyjemny, "zastąpiło": zastapic, "pojawiać": pojawiac }
  - clean: "A przez oba te dni miałem niespokojne poczucie człowieka, który wymiguje się od nieuniknionego obowiązku. Byłem pewien, że Wehikuł Czasu można odzyskać tylko śmiało wnikając w te podziemne tajemnice. A jednak nie potrafiłem stawić czoła tej tajemnicy. Gdybym tylko miał towarzysza, byłoby inaczej. Ale byłem tak strasznie sam, że nawet zejście w ciemność studni napawało mnie przerażeniem. Nie wiem, czy zrozumiecie moje uczucie, ale nigdy nie czułem się całkiem bezpieczny od tyłu."
    en: "And on both these days I had the restless feeling of one who shirks an inevitable duty. I felt assured that the Time Machine was only to be recovered by boldly penetrating these mysteries of underground. Yet I could not face the mystery. If only I had had a companion it would have been different. But I was so horribly alone, and even to clamber down into the darkness of the well appalled me. I don’t know if you will understand my feeling, but I never felt quite safe at my back."
    draft: true
    chunks:
      - pl: "A przez oba te dni miałem niespokojne poczucie człowieka, który wymiguje się od nieuniknionego obowiązku."
        ru: "И все эти два дня у меня было беспокойное чувство человека, который увиливает от неизбежного долга."
        note: "wymigiwać się — увиливать"
      - pl: " Byłem pewien, że Wehikuł Czasu można odzyskać tylko śmiało wnikając w te podziemne tajemnice."
        ru: "Я был уверен, что Машину Времени можно вернуть, лишь смело проникнув в эти подземные тайны."
        note: "wnikać — проникать"
      - pl: " A jednak nie potrafiłem stawić czoła tej tajemnicy."
        ru: "И всё же я не мог решиться встретиться с этой тайной лицом к лицу."
        note: "stawić czoła — противостоять"
      - pl: " Gdybym tylko miał towarzysza, byłoby inaczej."
        ru: "Будь у меня спутник, всё было бы иначе."
      - pl: " Ale byłem tak strasznie sam, że nawet zejście w ciemność studni napawało mnie przerażeniem."
        ru: "Но я был так ужасно одинок, что даже спуск в темноту колодца приводил меня в ужас."
        note: "napawać — наполнять (чувством)"
      - pl: " Nie wiem, czy zrozumiecie moje uczucie, ale nigdy nie czułem się całkiem bezpieczny od tyłu."
        ru: "Не знаю, поймёте ли вы моё чувство, но я никогда не чувствовал себя в безопасности со спины."
