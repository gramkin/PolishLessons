      - pl: " Z początku patrzyła na mnie zdumiona."
        ru: "Сначала она смотрела на меня в изумлении."
      - pl: " Potem wydała najżałośniejszy okrzyk, podbiegła do mnie i zaczęła mnie ciągnąć swoimi małymi rączkami."
