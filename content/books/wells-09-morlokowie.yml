  - clean: "Ale dzień chylił się już ku końcowi, a ja natknąłem się na widok tego miejsca po długim i męczącym obchodzie; postanowiłem więc odłożyć przygodę na następny dzień i wróciłem do powitań i pieszczot małej Weeny. Ale następnego ranka zrozumiałem dość jasno, że moja ciekawość co do Pałacu z Zielonej Porcelany była samooszukiwaniem, pozwalającym mi uchylić się o kolejny dzień od przeżycia, którego się bałem. Postanowiłem zejść bez dalszej straty czasu i wczesnym rankiem wyruszyłem w stronę studni koło ruin z granitu i aluminium."
    en: "But the day was growing late, and I had come upon the sight of the place after a long and tiring circuit; so I resolved to hold over the adventure for the following day, and I returned to the welcome and the caresses of little Weena. But next morning I perceived clearly enough that my curiosity regarding the Palace of Green Porcelain was a piece of self-deception, to enable me to shirk, by another day, an experience I dreaded. I resolved I would make the descent without further waste of time, and started out in the early morning towards a well near the ruins of granite and aluminium."
    draft: true
    chunks:
      - pl: "Ale dzień chylił się już ku końcowi, a ja natknąłem się na widok tego miejsca po długim i męczącym obchodzie;"
