paragraphs:
  - clean: "Może wam się to wydać dziwne, ale minęły dwa dni, zanim zdołałem pójść za nowo odnalezionym tropem w sposób, który był najwyraźniej właściwy. Czułem osobliwą odrazę do tych bladych ciał. Miały właśnie ten na wpół wyblakły kolor robaków i innych stworzeń, które ogląda się zakonserwowane w spirytusie w muzeum zoologicznym. A w dotyku były obrzydliwie zimne. Moja odraza wynikała zapewne w dużej mierze z udzielającego mi się wpływu Elojów, których wstręt do Morloków zaczynałem teraz rozumieć."
    en: "“It may seem odd to you, but it was two days before I could follow up the new-found clue in what was manifestly the proper way. I felt a peculiar shrinking from those pallid bodies. They were just the half-bleached colour of the worms and things one sees preserved in spirit in a zoological museum. And they were filthily cold to the touch. Probably my shrinking was largely due to the sympathetic influence of the Eloi, whose disgust of the Morlocks I now began to appreciate."
    draft: true
    chunks:
      - pl: "Może wam się to wydać dziwne, ale minęły dwa dni, zanim zdołałem pójść za nowo odnalezionym tropem w sposób, który był najwyraźniej właściwy."
        ru: "Вам это может показаться странным, но прошло два дня, прежде чем я смог пойти по новонайденному следу так, как, очевидно, следовало."
        note: "trop — след"
      - pl: " Czułem osobliwą odrazę do tych bladych ciał."
        ru: "Я испытывал особое отвращение к этим бледным телам."
      - pl: " Miały właśnie ten na wpół wyblakły kolor robaków i innych stworzeń, które ogląda się zakonserwowane w spirytusie w muzeum zoologicznym."
        ru: "Они были как раз того полуобесцвеченного цвета, как черви и прочие твари, которых видишь заспиртованными в зоологическом музее."
        note: "robak — червь; spirytus — спирт"
      - pl: " A w dotyku były obrzydliwie zimne."
        ru: "А на ощупь они были омерзительно холодными."
