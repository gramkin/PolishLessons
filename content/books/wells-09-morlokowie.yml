  - clean: "Wydało mi się, że słyszę wokół siebie oddech tłumu tych okropnych małych istot. Poczułem, jak delikatnie wyjmują mi z ręki pudełko zapałek, a inne ręce za mną szarpią moje ubranie. Świadomość, że te niewidzialne stworzenia mnie badają, była nieopisanie przykra. W ciemności bardzo żywo dotarło do mnie nagle, jak nic nie wiem o ich sposobie myślenia i działania. Krzyknąłem na nie najgłośniej, jak mogłem. Odskoczyły, a potem poczułem, że znów się zbliżają."
