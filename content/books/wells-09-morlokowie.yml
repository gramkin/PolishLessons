  - clean: "Myślałem później, jak szczególnie źle byłem przygotowany na takie przeżycie. Kiedy wyruszałem Wehikułem Czasu, wyruszałem z niedorzecznym założeniem, że ludzie Przyszłości z pewnością będą nieskończenie nas wyprzedzać we wszystkich swoich urządzeniach. Przybyłem bez broni, bez lekarstw, bez niczego do palenia — chwilami strasznie brakowało mi tytoniu! — nawet bez dostatecznej liczby zapałek. Gdybym tylko pomyślał o kodaku! Mógłbym w sekundę utrwalić ten przebłysk Podziemnego Świata i obejrzeć go potem w spokoju. A tak stałem tam tylko z bronią i siłami, w które wyposażyła mnie Natura — rękami, nogami i zębami; z nimi i z czterema zapałkami bezpiecznymi, które mi jeszcze zostały."
    en: "“I have thought since how particularly ill-equipped I was for such an experience. When I had started with the Time Machine, I had started with the absurd assumption that the men of the Future would certainly be infinitely ahead of ourselves in all their appliances. I had come without arms, without medicine, without anything to smoke—at times I missed tobacco frightfully!—even without enough matches. If only I had thought of a Kodak! I could have flashed that glimpse of the Underworld in a second, and examined it at leisure. But, as it was, I stood there with only the weapons and the powers that Nature had endowed me with—hands, feet, and teeth; these, and four safety-matches that still remained to me."
