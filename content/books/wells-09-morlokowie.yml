  - clean: "Mała Weena pobiegła ze mną. Tańczyła obok mnie aż do studni, ale gdy zobaczyła, że pochylam się nad otworem i patrzę w dół, wydała się dziwnie zmieszana. — Do widzenia, mała Weeno — powiedziałem, całując ją; a potem postawiwszy ją na ziemi, zacząłem szukać po omacku za murkiem haków do wspinaczki. Dość pospiesznie, muszę wyznać, bo bałem się, że odwaga może mnie opuścić! Z początku patrzyła na mnie zdumiona. Potem wydała najżałośniejszy okrzyk, podbiegła do mnie i zaczęła mnie ciągnąć swoimi małymi rączkami."
    en: "“Little Weena ran with me. She danced beside me to the well, but when she saw me lean over the mouth and look downward, she seemed strangely disconcerted. ‘Good-bye, little Weena,’ I said, kissing her; and then putting her down, I began to feel over the parapet for the climbing hooks. Rather hastily, I may as well confess, for I feared my courage might leak away! At first she watched me in amazement. Then she gave a most piteous cry, and running to me, she began to pull at me with her little hands."
    draft: true
    chunks:
      - pl: "Mała Weena pobiegła ze mną."
        ru: "Маленькая Уина побежала со мной."
      - pl: " Tańczyła obok mnie aż do studni, ale gdy zobaczyła, że pochylam się nad otworem i patrzę w dół, wydała się dziwnie zmieszana."
        ru: "Она приплясывала рядом со мной до самого колодца, но, увидев, что я наклоняюсь над отверстием и смотрю вниз, казалось, странно смутилась."
        note: "zmieszany — смущённый"
      - pl: " — Do widzenia, mała Weeno — powiedziałem, całując ją;"
        ru: "— Прощай, маленькая Уина, — сказал я, целуя её;"
      - pl: " a potem postawiwszy ją na ziemi, zacząłem szukać po omacku za murkiem haków do wspinaczki."
        ru: "а потом, поставив её на землю, стал нащупывать за парапетом скобы для лазанья."
        note: "hak — крюк; murek — низкая стенка"
