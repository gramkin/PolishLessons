  - clean: "Ten niepokój, to poczucie zagrożenia pchały mnie być może coraz dalej w moich wyprawach badawczych. Idąc na południowy zachód, ku wznoszącej się okolicy, którą dziś nazywa się Combe Wood, zauważyłem w oddali, w stronie dziewiętnastowiecznego Banstead, ogromną zieloną budowlę, inną z charakteru niż wszystkie, które dotąd widziałem. Była większa od największych pałaców i ruin, jakie znałem, a fasada miała wschodni wygląd: jej lico miało połysk, a także bladozieloną barwę, rodzaj niebieskawej zieleni, pewnego rodzaju chińskiej porcelany. Ta różnica w wyglądzie nasuwała myśl o różnicy przeznaczenia, i miałem ochotę ruszyć dalej i to zbadać."
    en: "“It was this restlessness, this insecurity, perhaps, that drove me farther and farther afield in my exploring expeditions. Going to the south-westward towards the rising country that is now called Combe Wood, I observed far-off, in the direction of nineteenth-century Banstead, a vast green structure, different in character from any I had hitherto seen. It was larger than the largest of the palaces or ruins I knew, and the façade had an Oriental look: the face of it having the lustre, as well as the pale-green tint, a kind of bluish-green, of a certain type of Chinese porcelain. This difference in aspect suggested a difference in use, and I was minded to push on and explore."
    draft: true
    chunks:
      - pl: "Ten niepokój, to poczucie zagrożenia pchały mnie być może coraz dalej w moich wyprawach badawczych."
        ru: "Это беспокойство, это чувство незащищённости, пожалуй, и гнали меня всё дальше в моих исследовательских вылазках."
        note: "zagrożenie — угроза"
      - pl: " Idąc na południowy zachód, ku wznoszącej się okolicy, którą dziś nazywa się Combe Wood,"
        ru: "Направляясь на юго-запад, к возвышенности, которую сейчас называют Кум-Вуд,"
      - pl: " zauważyłem w oddali, w stronie dziewiętnastowiecznego Banstead, ogromną zieloną budowlę, inną z charakteru niż wszystkie, które dotąd widziałem."
        ru: "я заметил вдали, в направлении Банстеда девятнадцатого века, огромное зелёное здание, по характеру отличное от всех, что я до сих пор видел."
      - pl: " Była większa od największych pałaców i ruin, jakie znałem, a fasada miała wschodni wygląd:"
        ru: "Оно было больше самых больших дворцов и руин, какие я знал, а фасад имел восточный вид:"
      - pl: " jej lico miało połysk, a także bladozieloną barwę, rodzaj niebieskawej zieleni, pewnego rodzaju chińskiej porcelany."
        ru: "его лицевая сторона имела блеск, а также бледно-зелёный, голубовато-зелёный оттенок одного сорта китайского фарфора."
        note: "lico — лицевая сторона"
      - pl: " Ta różnica w wyglądzie nasuwała myśl o różnicy przeznaczenia, i miałem ochotę ruszyć dalej i to zbadać."
        ru: "Это различие во внешности наводило на мысль о различии назначения, и мне хотелось пойти дальше и осмотреть его."
