  - clean: "Myślę, że jej sprzeciw raczej dodał mi sił, by iść dalej. Strząsnąłem ją, może trochę szorstko, i w następnej chwili byłem w gardzieli studni. Zobaczyłem jej udręczoną twarz nad murkiem i uśmiechnąłem się, by ją uspokoić. Potem musiałem spojrzeć w dół, na chwiejne haki, których się trzymałem."
    en: "I think her opposition nerved me rather to proceed. I shook her off, perhaps a little roughly, and in another moment I was in the throat of the well. I saw her agonised face over the parapet, and smiled to reassure her. Then I had to look down at the unstable hooks to which I clung."
    draft: true
    chunks:
      - pl: "Myślę, że jej sprzeciw raczej dodał mi sił, by iść dalej."
        ru: "Думаю, её сопротивление скорее придало мне решимости продолжать."
        note: "sprzeciw — возражение, сопротивление"
      - pl: " Strząsnąłem ją, może trochę szorstko, i w następnej chwili byłem w gardzieli studni."
        ru: "Я стряхнул её, может быть, немного грубо, и в следующий миг уже был в жерле колодца."
        note: "strząsnąć — стряхнуть"
      - pl: " Zobaczyłem jej udręczoną twarz nad murkiem i uśmiechnąłem się, by ją uspokoić."
        ru: "Я увидел её измученное лицо над парапетом и улыбнулся, чтобы её успокоить."
        note: "udręczony — измученный"
      - pl: " Potem musiałem spojrzeć w dół, na chwiejne haki, których się trzymałem."
        ru: "Потом мне пришлось посмотреть вниз, на шаткие скобы, за которые я держался."
        note: "chwiejny — шаткий"
    words: { "dodał": dodac, "studni": studnia, "twarz": twarz, "uśmiechnąłem": usmiechnac, "uspokoić": uspokoic, "haki": hak }
  - clean: "Musiałem zejść szybem głębokim może na dwieście jardów. Schodziło się po metalowych prętach wystających ze ścian studni, a ponieważ były dostosowane do potrzeb stworzenia znacznie mniejszego i lżejszego ode mnie, szybko zesztywniałem i zmęczyłem się schodzeniem. I nie tylko się zmęczyłem! Jeden z prętów nagle wygiął się pod moim ciężarem i omal nie strącił mnie w czerń pod spodem. Przez chwilę wisiałem na jednej ręce, a po tym doświadczeniu nie odważyłem się już odpocząć."
    en: "“I had to clamber down a shaft of perhaps two hundred yards. The descent was effected by means of metallic bars projecting from the sides of the well, and these being adapted to the needs of a creature much smaller and lighter than myself, I was speedily cramped and fatigued by the descent. And not simply fatigued! One of the bars bent suddenly under my weight, and almost swung me off into the blackness beneath. For a moment I hung by one hand, and after that experience I did not dare to rest again."
    draft: true
    chunks:
      - pl: "Musiałem zejść szybem głębokim może na dwieście jardów."
