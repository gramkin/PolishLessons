# review
title: Nowele
titleRu: Новеллы
author: Bolesław Prus
source:
  name: "Wolne Lektury (Bolesław Prus, «Nowele wybrane», PIW 1976)"
  url: https://wolnelektury.pl/katalog/lektura/kamizelka/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 2
chapterTitle: "Kamizelka (II)"
chapterTitleRu: "Жилетка (II)"
level: B2
paragraphs:
  - clean: "Lekarz ostrożnie obudził go, wybadał i także powiedział, że to nic."
    chunks:
      - pl: "Lekarz ostrożnie obudził go,"
        ru: "Врач осторожно разбудил его,"
        note: "obudzić kogoś — разбудить кого-л.; budzić się — просыпаться"
      - pl: " wybadał i także powiedział, że to nic."
        ru: "обследовал и тоже сказал, что это пустяки."
        note: "wybadać — здесь «обследовать, выслушать» больного; сегодня скорее zbadać. To nic — «ничего страшного»"
    words: { "Lekarz": lekarz, "ostrożnie": ostroznie, "obudził": obudzic, "także": takze, "powiedział": powiedziec }
  - clean: "— Ja zaraz mówiłem, że to nic! — odezwał się chory."
    chunks:
      - pl: "— Ja zaraz mówiłem, że to nic!"
        ru: "— Я же сразу говорил, что это пустяки!"
        note: "zaraz — здесь «сразу, с самого начала», а не «сейчас»"
      - pl: " — odezwał się chory."
        ru: "— отозвался больной."
        note: "odezwać się — подать голос, заговорить; chory — субстантивированное прилагательное: больной"
    words: { "zaraz": zaraz, "mówiłem": mowic, "odezwał": odezwac, "chory": chory }
  - clean: "— O, nic… — powtórzyła pani ściskając jego spotniałe ręce. — Wiem przecie, że krwotok może być z żołądka albo z nosa. U ciebie pewnie z nosa… Tyś taki tęgi, potrzebujesz ruchu, a ciągle siedzisz… Prawda, panie doktorze, że on potrzebuje ruchu?…"
    chunks:
      - pl: "— O, nic… — powtórzyła pani"
        ru: "— О, пустяки… — повторила пани,"
        note: "pani — «госпожа, дама»: так рассказчик называет героиню на протяжении всего рассказа"
      - pl: " ściskając jego spotniałe ręce."
        ru: "сжимая его вспотевшие руки."
        note: "spotniały — вспотевший (от spotnieć); перед деепричастием Прус не ставит запятую, сегодня её ставят: powtórzyła, ściskając"
      - pl: " — Wiem przecie, że krwotok może być z żołądka albo z nosa."
        ru: "— Я ведь знаю, что кровотечение может быть из желудка или из носа."
        note: "przecie — устаревшее przecież «ведь»; krwotok — кровотечение (не «кровоток»!)"
      - pl: " U ciebie pewnie z nosa…"
        ru: "У тебя, наверное, из носа…"
      - pl: " Tyś taki tęgi, potrzebujesz ruchu,"
        ru: "Ты такой полный, тебе нужно движение,"
        note: "tyś = ty jesteś: связка -ś приклеена к местоимению, сегодня книжно. tęgi — дородный, полный; potrzebować + родительный"
      - pl: " a ciągle siedzisz…"
        ru: "а ты всё время сидишь…"
      - pl: " Prawda, panie doktorze, że on potrzebuje ruchu?…"
        ru: "Правда, господин доктор, ему нужно движение?…"
        note: "panie doktorze — звательный падеж; так к врачу обращаются и сегодня"
    words: { "powtórzyła": powtorzyc, "ręce": reka, "przecie": przeciez, "żołądka": zoladek, "nosa": nos, "ruchu": ruch, "ciągle": ciagle }
  - clean: "— Tak, tak!… Ruch jest w ogóle potrzebny, ale małżonek pani musi parę dni poleżeć. Czy może wyjechać na wieś?"
    chunks:
      - pl: "— Tak, tak!… Ruch jest w ogóle potrzebny,"
        ru: "— Да, да!… Движение вообще нужно,"
        note: "w ogóle — вообще"
      - pl: " ale małżonek pani musi parę dni poleżeć."
        ru: "но вашему супругу нужно несколько дней полежать."
        note: "małżonek pani — «ваш супруг»: вежливое обращение через pani; parę dni — несколько дней"
      - pl: " Czy może wyjechać na wieś?"
        ru: "Может он уехать в деревню?"
        note: "na wieś — в деревню (направление, винительный); na wsi — в деревне"
    words: { "ogóle": ogol, "potrzebny": potrzebny, "parę": pare, "dni": dzien, "pani": pani, "wyjechać": wyjechac, "wieś": wies }
  - clean: "— Nie może… — szepnęła pani ze smutkiem."
    chunks:
      - pl: "— Nie może… — szepnęła pani ze smutkiem."
        ru: "— Не может… — прошептала пани с грустью."
        note: "ze smutkiem — с грустью: z перед группой согласных становится ze"
    words: { "może": moc, "pani": pani, "smutkiem": smutek }
  - clean: "— No — to nic! Więc zostanie w Warszawie. Ja będę go odwiedzał, a tymczasem — niech sobie poleży i odpocznie. Gdyby się zaś krwotok powtórzył… — dodał lekarz."
    chunks:
      - pl: "— No — to nic! Więc zostanie w Warszawie."
        ru: "— Ну что ж, ничего! Значит, останется в Варшаве."
      - pl: " Ja będę go odwiedzał, a tymczasem"
        ru: "Я буду его навещать, а пока"
        note: "będę odwiedzał — будущее несовершенного вида: będę + форма прошедшего (или będę odwiedzać)"
      - pl: " — niech sobie poleży i odpocznie."
        ru: "— пусть себе полежит и отдохнёт."
        note: "niech + 3-е лицо — «пусть»; sobie смягчает: «пусть себе»"
      - pl: " Gdyby się zaś krwotok powtórzył…"
        ru: "А если бы кровотечение повторилось…"
        note: "gdyby — «если бы»: условие с -by; zaś — книжное «же, а»"
      - pl: " — dodał lekarz."
        ru: "— добавил врач."
    words: { "zostanie": zostac, "odwiedzał": odwiedzac, "tymczasem": tymczasem, "odpocznie": odpoczac, "powtórzył": powtorzyc, "dodał": dodac }
  - clean: "— To co, panie? — spytała żona blednąc jak wosk."
    chunks:
      - pl: "— To co, panie?"
        ru: "— И что тогда, сударь?"
        note: "panie — звательный от pan: обращение к мужчине"
      - pl: " — spytała żona blednąc jak wosk."
        ru: "— спросила жена, бледнея как воск."
        note: "blednąć — бледнеть; blednąc — деепричастие (сегодня через запятую). Spytać — то же, что zapytać"
    words: { "panie": pan, "żona": zona, "jak": jak }
  - clean: "— No, to nic. Mąż pani wypocznie, tam się zasklepi…"
    chunks:
      - pl: "— No, to nic. Mąż pani wypocznie,"
        ru: "— Ну, ничего. Ваш муж отдохнёт,"
        note: "wypocząć — отдохнуть как следует, восстановить силы"
      - pl: " tam się zasklepi…"
        ru: "там всё затянется…"
        note: "zasklepić się — затянуться (о ране), зарубцеваться"
    words: { "nic": nic, "Mąż": maz, "pani": pani, "tam": tam }
  - clean: "— Tam… w nosie? — mówiła pani składając przed doktorem ręce."
    chunks:
      - pl: "— Tam… w nosie?"
        ru: "— Там… в носу?"
      - pl: " — mówiła pani składając przed doktorem ręce."
        ru: "— говорила пани, складывая перед доктором руки."
        note: "składać ręce — складывать руки, как в мольбе; przed + творительный — перед"
    words: { "nosie": nos, "mówiła": mowic, "składając": skladac, "doktorem": doktor }
  - clean: "— Tak… w nosie! Rozumie się. Niech pani uspokoi się, a resztę zdać na Boga. Dobranoc."
    chunks:
      - pl: "— Tak… w nosie! Rozumie się."
        ru: "— Да… в носу! Разумеется."
        note: "rozumie się — разумеется; сегодня чаще oczywiście"
      - pl: " Niech pani uspokoi się,"
        ru: "Успокойтесь, пани,"
        note: "niech pani + 3-е лицо — вежливый императив; сегодня порядок обычно niech się pani uspokoi"
      - pl: " a resztę zdać na Boga. Dobranoc."
        ru: "а остальное предоставить Богу. Доброй ночи."
        note: "zdać na Boga — положиться на Бога; инфинитив здесь звучит как совет"
    words: { "Rozumie": rozumiec, "uspokoi": uspokoic, "resztę": reszta, "Boga": bog, "Dobranoc": dobranoc }
  - clean: "Słowa doktora tak uspokoiły panią, że po trwodze, jaką przechodziła od kilku godzin, zrobiło się jej prawie wesoło."
    chunks:
      - pl: "Słowa doktora tak uspokoiły panią,"
        ru: "Слова доктора так успокоили пани,"
      - pl: " że po trwodze, jaką przechodziła od kilku godzin,"
        ru: "что после тревоги, которую она переживала уже несколько часов,"
        note: "trwoga — книжное «тревога, страх»; przechodzić coś — переживать, испытывать"
      - pl: " zrobiło się jej prawie wesoło."
        ru: "ей стало почти весело."
        note: "zrobiło się komuś wesoło — кому-то стало весело: безличная конструкция с дательным"
    words: { "Słowa": slowo, "uspokoiły": uspokoic, "przechodziła": przechodzic, "godzin": godzina }
  - clean: "— No, i cóż to tak wielkiego! — rzekła, trochę śmiejąc się, a trochę popłakując."
    chunks:
      - pl: "— No, i cóż to tak wielkiego!"
        ru: "— Ну и что тут такого страшного!"
        note: "cóż — усиленное co, книжное и эмоциональное; co to tak wielkiego — «что тут такого»"
      - pl: " — rzekła, trochę śmiejąc się, a trochę popłakując."
        ru: "— сказала она, то ли смеясь, то ли всхлипывая."
        note: "rzec (rzekła) — книжное «сказать, молвить»; popłakiwać — поплакивать, всхлипывать"
    words: { "wielkiego": wielki, "rzekła": rzec, "trochę": troche, "śmiejąc": smiac }
  - clean: "Uklękła przy łóżku chorego i zaczęła całować go po rękach."
    chunks:
      - pl: "Uklękła przy łóżku chorego"
        ru: "Она опустилась на колени у кровати больного"
        note: "uklęknąć — встать на колени; przy + предложный — у, возле"
      - pl: " i zaczęła całować go po rękach."
        ru: "и стала целовать ему руки."
        note: "całować kogoś po rękach — целовать кому-то руки: po + предложный, «по рукам»"
    words: { "łóżku": lozko, "chorego": chory, "zaczęła": zaczac, "całować": calowac, "rękach": reka }
  - clean: "— Cóż tak wielkiego! — powtórzył pan cicho i uśmiechnął się. — Ile to krwi na wojnie z człowieka upływa, a jednak jest potem zdrów!…"
    chunks:
      - pl: "— Cóż tak wielkiego! — powtórzył pan cicho i uśmiechnął się."
        ru: "— Что тут такого страшного! — тихо повторил пан и улыбнулся."
      - pl: " — Ile to krwi na wojnie z człowieka upływa,"
        ru: "— Сколько крови на войне из человека вытекает,"
        note: "upływać — вытекать, утекать (о крови); ile + родительный: ile krwi"
      - pl: " a jednak jest potem zdrów!…"
        ru: "а всё-таки он потом здоров!…"
        note: "zdrów — краткая форма от zdrowy, сегодня книжная, живёт в выражении bądź zdrów"
    words: { "cicho": cicho, "uśmiechnął": usmiechnac, "krwi": krew, "wojnie": wojna, "człowieka": czlowiek, "jednak": jednak, "zdrów": zdrowy }
  - clean: "— Już tylko nic nie mów — prosiła go pani."
    chunks:
      - pl: "— Już tylko nic nie mów"
        ru: "— Только ничего больше не говори"
        note: "już nic nie mów — больше ничего не говори: двойное отрицание, как в русском"
      - pl: " — prosiła go pani."
        ru: "— просила его пани."
        note: "prosić kogoś — просить кого-л.: винительный, как в русском"
    words: { "Już": juz, "tylko": tylko, "mów": mowic, "prosiła": prosic }
  - clean: "Na dworze zaczęło świtać. W lecie, jak wiadomo, noce są bardzo krótkie."
    chunks:
      - pl: "Na dworze zaczęło świtać."
        ru: "На дворе начало светать."
        note: "na dworze — на улице, снаружи (так говорят и сегодня; в Кракове — na polu)"
      - pl: " W lecie, jak wiadomo, noce są bardzo krótkie."
        ru: "Летом, как известно, ночи очень короткие."
        note: "w lecie — летом; сегодня чаще latem. Jak wiadomo — как известно"
    words: { "dworze": dwor, "zaczęło": zaczac, "lecie": lato, "wiadomo": wiadomo, "noce": noc, "krótkie": krotki }
  - clean: "Choroba przeciągnęła się znacznie dłużej, niż myślano. Mąż nie chodził już do biura, co mu tym mniej robiło kłopotu, że jako urzędnik najemny nie potrzebował brać urlopu, a mógł wrócić, kiedy by mu się podobało i — o ile znalazłby miejsce. Ponieważ gdy siedział w mieszkaniu, był zdrowszy, więc pani wystarała się jeszcze o kilka lekcji na tydzień i za ich pomocą opędzała domowe potrzeby."
    chunks:
      - pl: "Choroba przeciągnęła się znacznie dłużej, niż myślano."
        ru: "Болезнь затянулась гораздо дольше, чем думали."
        note: "przeciągnąć się — затянуться; myślano — безличная форма на -no: «думали»"
      - pl: " Mąż nie chodził już do biura,"
        ru: "Муж уже не ходил в контору,"
        note: "biuro — контора, канцелярия; do biura — родительный после do"
      - pl: " co mu tym mniej robiło kłopotu,"
        ru: "что доставляло ему тем меньше хлопот,"
        note: "robić komuś kłopot — доставлять хлопоты; tym mniej, że… — тем меньше, что…"
      - pl: " że jako urzędnik najemny nie potrzebował brać urlopu,"
        ru: "что как наёмный служащий он не должен был брать отпуск,"
        note: "urzędnik najemny — служащий по найму, без штатной должности; nie potrzebować + инфинитив — «не нужно было»; urlop — отпуск, не «увольнительная»"
      - pl: " a mógł wrócić, kiedy by mu się podobało"
        ru: "и мог вернуться, когда ему заблагорассудится,"
        note: "kiedy by mu się podobało — когда бы ему ни захотелось: условное наклонение в придаточном"
      - pl: " i — o ile znalazłby miejsce."
        ru: "и — если бы нашёл место."
        note: "o ile — «если, поскольку»; miejsce — здесь «должность, место службы»"
      - pl: " Ponieważ gdy siedział w mieszkaniu, był zdrowszy,"
        ru: "Поскольку, когда он сидел дома, ему было лучше,"
        note: "mieszkanie — квартира; zdrowszy — сравнительная степень от zdrowy"
      - pl: " więc pani wystarała się jeszcze o kilka lekcji na tydzień"
        ru: "пани раздобыла ещё несколько уроков в неделю"
        note: "wystarać się o coś — выхлопотать, раздобыть что-л.: o + винительный"
      - pl: " i za ich pomocą opędzała domowe potrzeby."
        ru: "и с их помощью покрывала домашние нужды."
        note: "za pomocą czegoś — с помощью чего-л.; opędzać potrzeby — книжное «покрывать нужды», сегодня pokrywać wydatki"
    words: { "Choroba": choroba, "znacznie": znacznie, "biura": biuro, "kłopotu": klopot, "urzędnik": urzednik, "urlopu": urlop, "miejsce": miejsce, "lekcji": lekcja }
  - clean: "Wychodziła zwykle do miasta o ósmej rano. Około pierwszej wracała na parę godzin do domu, ażeby ugotować mężowi obiad na maszynce, a potem znowu wybiegała na jakiś czas."
    chunks:
      - pl: "Wychodziła zwykle do miasta o ósmej rano."
        ru: "Обычно она уходила в город в восемь утра."
        note: "o ósmej — в восемь: o + предложный порядкового числительного"
      - pl: " Około pierwszej wracała na parę godzin do domu,"
        ru: "Около часа дня она возвращалась на пару часов домой,"
        note: "około + родительный — около; pierwsza — час дня (godzina pierwsza)"
      - pl: " ażeby ugotować mężowi obiad na maszynce,"
        ru: "чтобы сварить мужу обед на спиртовке,"
        note: "ażeby — книжное «чтобы», сегодня żeby; maszynka — маленькая плитка, спиртовка"
      - pl: " a potem znowu wybiegała na jakiś czas."
        ru: "а потом снова убегала на какое-то время."
    words: { "zwykle": zwykle, "miasta": miasto, "rano": rano, "wracała": wracac, "obiad": obiad, "znowu": znowu }
  - clean: "Za to już wieczory spędzali razem. Pani zaś, aby nie próżnować, brała trochę więcej do szycia."
    chunks:
      - pl: "Za to już wieczory spędzali razem."
        ru: "Зато вечера они уже проводили вместе."
        note: "za to — зато; spędzać czas — проводить время"
      - pl: " Pani zaś, aby nie próżnować,"
        ru: "А пани, чтобы не сидеть без дела,"
        note: "próżnować — бездельничать, книжное; aby — «чтобы»"
      - pl: " brała trochę więcej do szycia."
        ru: "брала немного больше шитья."
        note: "do szycia — «на шитьё»: брала работу на дом"
    words: { "wieczory": wieczor, "spędzali": spedzac, "brała": brac, "więcej": wiecej }
  - clean: "Jakoś w końcu sierpnia spotkała się pani z doktorem na ulicy. Długo chodzili razem. W końcu pani schwyciła doktora za rękę i rzekła błagalnym tonem:"
    chunks:
      - pl: "Jakoś w końcu sierpnia spotkała się pani z doktorem na ulicy."
        ru: "Как-то в конце августа пани встретилась с доктором на улице."
        note: "w końcu sierpnia — в конце августа; spotkać się z kimś — встретиться с кем-л."
      - pl: " Długo chodzili razem."
        ru: "Они долго ходили вместе."
      - pl: " W końcu pani schwyciła doktora za rękę"
        ru: "Наконец пани схватила доктора за руку"
        note: "schwycić — книжное «схватить», сегодня chwycić; w końcu — наконец"
      - pl: " i rzekła błagalnym tonem:"
        ru: "и сказала умоляющим тоном:"
        note: "błagalny — умоляющий, от błagać «умолять»"
    words: { "końcu": koniec, "sierpnia": sierpien, "spotkała": spotkac, "ulicy": ulica, "Długo": dlugo, "rękę": reka, "tonem": ton }
  - clean: "— Ale swoją drogą, niech pan do nas przychodzi. Może też Bóg da!… On tak się uspokaja po każdej pańskiej wizycie…"
    chunks:
      - pl: "— Ale swoją drogą, niech pan do nas przychodzi."
        ru: "— Но всё равно приходите к нам."
        note: "swoją drogą — тем не менее, всё же; niech pan + 3-е лицо — вежливая просьба"
      - pl: " Może też Bóg da!…"
        ru: "Может, Бог даст!…"
        note: "Bóg da — «Бог даст», надежда на лучшее"
      - pl: " On tak się uspokaja po każdej pańskiej wizycie…"
