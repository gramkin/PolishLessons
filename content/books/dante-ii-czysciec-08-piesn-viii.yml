# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 8
chapterTitle: "Pieśń VIII"
chapterTitleRu: "Песнь VIII. Змей в долине"
level: B2
paragraphs:
  - clean: "(Wieczór w dolinie książęcej. Trzy gwiazdy. Wąż. Malaspina.)"
    chunks:
      - pl: "(Wieczór w dolinie książęcej. Trzy gwiazdy. Wąż. Malaspina.)"
        ru: "(Вечер в долине князей. Три звезды. Змей. Маласпина.)"
        note: "książęcy — княжеский"
    words: { "Wieczór": wieczor, "dolinie": dolina, "gwiazdy": gwiazda }
  - clean: "Była godzina, w której żeglarzowi\nTęsknota serca pamięć dnia odnowi,\nGdy do przyjaciół mówi: Bądźcie zdrowi!\nGodzina, w której oko łzy nie wstrzyma,\nPłynącej z duszy nowego pielgrzyma,\nGdy dzwon wieczorny słyszy niespodzianie\nSmutnie dzwoniący jak na dnia skonanie:\nGdy ja na śpiewy mało dając ucha,\nSpostrzegłem w tłumie stojącego ducha,\nCo dłonią błagał tłum o posłuchanie."
    verse: true
    chunks:
      - pl: "Była godzina, w której żeglarzowi"
        ru: "Был час, когда у мореплавателя"
      - pl: "\nTęsknota serca pamięć dnia odnowi,"
        ru: "тоска сердца обновит память дня,"
        note: "odnowić — обновить"
      - pl: "\nGdy do przyjaciół mówi: Bądźcie zdrowi!"
        ru: "когда он говорит друзьям: «Прощайте!»"
      - pl: "\nGodzina, w której oko łzy nie wstrzyma,"
        ru: "Час, когда глаз не удержит слезы,"
      - pl: "\nPłynącej z duszy nowego pielgrzyma,"
        ru: "текущей из души нового паломника,"
      - pl: "\nGdy dzwon wieczorny słyszy niespodzianie"
        ru: "когда он нечаянно слышит вечерний колокол,"
      - pl: "\nSmutnie dzwoniący jak na dnia skonanie:"
        ru: "печально звонящий словно по умирающему дню:"
      - pl: "\nGdy ja na śpiewy mało dając ucha,"
        ru: "когда я, мало внимая пению,"
      - pl: "\nSpostrzegłem w tłumie stojącego ducha,"
        ru: "заметил в толпе стоящего духа,"
      - pl: "\nCo dłonią błagał tłum o posłuchanie."
        ru: "что рукой молил толпу о внимании."
        note: "posłuchanie — внимание"
    words: { "wstrzyma": wstrzymac, "Płynącej": plynac, "dzwon": dzwon, "Spostrzegłem": spostrzec, "tłumie": tlum, "dłonią": dlon }
  - clean: "Duch złożył, podniósł w górę ręce obie,\nPatrzając na wschód, jak gdyby w tej dobie\nMówił do Boga: Tyś mój Pan na niebie!\nTe lucis ante, z jego ust pieśń brzmiała\nPobożnie, taką słodką nutą wiała,\nŻe myślą, duszą wyszedłem sam z siebie."
    verse: true
    chunks:
      - pl: "Duch złożył, podniósł w górę ręce obie,"
        ru: "Дух сложил, поднял вверх обе руки,"
      - pl: "\nPatrzając na wschód, jak gdyby w tej dobie"
        ru: "глядя на восток, будто в эту пору"
      - pl: "\nMówił do Boga: Tyś mój Pan na niebie!"
        ru: "говорил Богу: «Ты мой Господь на небе!»"
      - pl: "\nTe lucis ante, z jego ust pieśń brzmiała"
        ru: "«Te lucis ante» — звучала из его уст песнь"
        note: "«Тебя прежде света», вечерний гимн"
      - pl: "\nPobożnie, taką słodką nutą wiała,"
        ru: "благоговейно, таким сладким напевом веяла,"
      - pl: "\nŻe myślą, duszą wyszedłem sam z siebie."
        ru: "что мыслью, душой я вышел из себя."
    words: { "złożył": zlozyc, "podniósł": podniesc, "wschód": wschod, "dobie": doba, "niebie": niebo, "pieśń": piesn }
  - clean: "Za nim tłum duchów całym chórem nucił\nTen hymn i oczy na gwiazdy wywrócił.\nTu, czytelniku, utkwij w prawdę oczy,\nZasłona lekka, przejrzysz w jej przeźroczy.\nWidziałem potem, ta duchów gromada,\nMyślą w pobożnym tonąc rozmyślaniu,\nPatrzała w niebo; jak w oczekiwaniu\nStała milcząca, pokorna i blada."
    verse: true
    chunks:
      - pl: "Za nim tłum duchów całym chórem nucił"
        ru: "За ним толпа духов всем хором напевала"
      - pl: "\nTen hymn i oczy na gwiazdy wywrócił."
        ru: "этот гимн, обратив глаза к звёздам."
      - pl: "\nTu, czytelniku, utkwij w prawdę oczy,"
        ru: "Здесь, читатель, вперь глаза в правду,"
      - pl: "\nZasłona lekka, przejrzysz w jej przeźroczy."
        ru: "покров лёгок, ты прозришь сквозь его прозрачность."
        note: "przejrzeć — прозреть"
      - pl: "\nWidziałem potem, ta duchów gromada,"
        ru: "Я видел потом: эта толпа духов,"
      - pl: "\nMyślą w pobożnym tonąc rozmyślaniu,"
        ru: "утопая мыслью в благочестивом размышлении,"
      - pl: "\nPatrzała w niebo; jak w oczekiwaniu"
        ru: "смотрела в небо; словно в ожидании,"
      - pl: "\nStała milcząca, pokorna i blada."
        ru: "стояла молчаливая, смиренная и бледная."
    words: { "chórem": chor, "Zasłona": zaslona, "lekka": lekki, "przejrzysz": przejrzec, "milcząca": milczec, "blada": blady }
  - clean: "A potem z góry do skalnych rozdołów,\nDwóch zstępujących widziałem aniołów,\nZ dwoma mieczami, jak z ognia kowane,\nTak płomieniste, lecz ostrza złamane.\nJak liście w pączkach ich szaty zielone,\nZielonym pierzem ich skrzydeł wzruszone\nSpływając z tyłu igrały z wiatrami."
    verse: true
    chunks:
      - pl: "A potem z góry do skalnych rozdołów,"
        ru: "А потом сверху, в скалистые лощины,"
        note: "rozdół — лощина"
      - pl: "\nDwóch zstępujących widziałem aniołów,"
        ru: "я видел двух сходящих ангелов"
      - pl: "\nZ dwoma mieczami, jak z ognia kowane,"
        ru: "с двумя мечами, будто кованными из огня,"
      - pl: "\nTak płomieniste, lecz ostrza złamane."
        ru: "столь пламенными, но с обломанными остриями."
      - pl: "\nJak liście w pączkach ich szaty zielone,"
        ru: "Как листья в почках, их зелёные одежды,"
        note: "pączek — почка"
      - pl: "\nZielonym pierzem ich skrzydeł wzruszone"
        ru: "колеблемые зелёными перьями их крыльев,"
      - pl: "\nSpływając z tyłu igrały z wiatrami."
        ru: "стекая сзади, играли с ветрами."
        note: "igrać — играть"
    words: { "mieczami": miecz, "ostrza": ostrze, "pączkach": paczek, "skrzydeł": skrzydlo, "wzruszone": wzruszony, "wiatrami": wiatr }
  - clean: "Jeden z nich stanął blisko ponad nami,\nA drugi zstąpił na brzeg przeciwległy.\nTak stał tłum duchów między aniołami.\nOczy włos jasny ich łatwo postrzegły,\nLecz po ich twarzy zbłądziło spojrzenie,\nJak siła słabnie przez swe natężenie."
    verse: true
    chunks:
      - pl: "Jeden z nich stanął blisko ponad nami,"
        ru: "Один из них встал близко над нами,"
      - pl: "\nA drugi zstąpił na brzeg przeciwległy."
        ru: "а другой сошёл на противоположный берег."
      - pl: "\nTak stał tłum duchów między aniołami."
        ru: "Так стояла толпа духов между ангелами."
      - pl: "\nOczy włos jasny ich łatwo postrzegły,"
        ru: "Глаза легко различали их светлые волосы,"
      - pl: "\nLecz po ich twarzy zbłądziło spojrzenie,"
        ru: "но на их лице взгляд терялся,"
        note: "zbłądzić — заблудиться"
      - pl: "\nJak siła słabnie przez swe natężenie."
        ru: "как сила слабеет от своего напряжения."
        note: "natężenie — напряжение"
    words: { "stanął": stanac, "brzeg": brzeg, "duchów": duch, "włos": wlos, "twarzy": twarz, "siła": sila }
  - clean: "«Z Maryi kręgu,» rzekł Sordello, «oni\nPrzychodzą trzymać straż wkoło tej błoni\nOd węża, który ma przyjść w okamgnieniu».\nJa nic nie wiedząc, jaką przyjdzie drogą,\nSpojrzałem za się i skolały trwogą\nNa mistrza wiernym wsparłem się ramieniu."
    verse: true
    chunks:
      - pl: "«Z Maryi kręgu,» rzekł Sordello, «oni"
        ru: "«Из круга Марии, — сказал Сорделло, — они"
      - pl: "\nPrzychodzą trzymać straż wkoło tej błoni"
        ru: "приходят нести стражу вокруг этого поля"
      - pl: "\nOd węża, który ma przyjść w okamgnieniu»."
        ru: "от змея, что должен прийти в мгновение ока»."
      - pl: "\nJa nic nie wiedząc, jaką przyjdzie drogą,"
        ru: "Я, ничего не зная, какой дорогой он придёт,"
      - pl: "\nSpojrzałem za się i skolały trwogą"
        ru: "оглянулся и, окоченев от страха,"
      - pl: "\nNa mistrza wiernym wsparłem się ramieniu."
        ru: "опёрся на верное плечо учителя."
    words: { "kręgu": krag, "rzekł": rzec, "straż": straz, "węża": waz, "wiernym": wierny, "wsparłem": wesprzec }
  - clean: "Znów rzekł Sordello: «Gdzie są duchy owe,\nZejdźmy i z nimi zawiążem rozmowę;\nTu ciebie widzieć będzie im przyjemnie».\nZstąpiłem na dół trzy kroki, zda mi się,\nGdy wtem duch jeden wpatrywał się we mnie,\nSnadź chciał mię poznać po twarzy zarysie."
    verse: true
    chunks:
      - pl: "Znów rzekł Sordello: «Gdzie są duchy owe,"
        ru: "Снова сказал Сорделло: «Туда, где те духи,"
      - pl: "\nZejdźmy i z nimi zawiążem rozmowę;"
        ru: "сойдём и завяжем с ними разговор;"
      - pl: "\nTu ciebie widzieć będzie im przyjemnie»."
        ru: "здесь им будет приятно тебя видеть»."
      - pl: "\nZstąpiłem na dół trzy kroki, zda mi się,"
        ru: "Я спустился вниз на три шага, мне кажется,"
      - pl: "\nGdy wtem duch jeden wpatrywał się we mnie,"
        ru: "как вдруг один дух стал всматриваться в меня,"
      - pl: "\nSnadź chciał mię poznać po twarzy zarysie."
        ru: "видно, хотел узнать меня по очертаниям лица."
        note: "zarys — очертание"
    words: { "Zejdźmy": zejsc, "rozmowę": rozmowa, "widzieć": widziec, "przyjemnie": przyjemnie, "jeden": jeden, "poznać": poznac }
  - clean: "Już tam powietrze tonęło w swym ciemnie,\nLecz jeszcze między jego a mym okiem,\nDość przyświecało wątpliwym półzmrokiem.\nI cień szedł do mnie, ja szedłem do cienia:\n«Miło mi, Nino! nie w grzeszników rzędzie,\nWitać tu ciebie, tak zacnego sędzię!»"
    verse: true
    chunks:
      - pl: "Już tam powietrze tonęło w swym ciemnie,"
        ru: "Уже там воздух тонул в своей тьме,"
      - pl: "\nLecz jeszcze między jego a mym okiem,"
        ru: "но ещё между его и моим глазом"
      - pl: "\nDość przyświecało wątpliwym półzmrokiem."
        ru: "светило довольно неверным полумраком."
        note: "półzmrok — полумрак"
      - pl: "\nI cień szedł do mnie, ja szedłem do cienia:"
        ru: "И тень шла ко мне, я шёл к тени:"
      - pl: "\n«Miło mi, Nino! nie w grzeszników rzędzie,"
        ru: "«Рад я, Нино, не в ряду грешников"
        note: "Нино Висконти, судья Галлуры"
      - pl: "\nWitać tu ciebie, tak zacnego sędzię!»"
        ru: "приветствовать здесь тебя, столь достойного судью!»"
    words: { "powietrze": powietrze, "cień": cien, "rzędzie": rzad, "Witać": witac, "zacnego": zacny, "sędzię": sedzia }
  - clean: "Gdyśmy skończyli czułe pozdrowienia,\nOn pytał: «Czy już czas upłynął długi,\nJak tu przybyłeś przez dalekie wody?»\n— «Zaiste, szedłem przez smutne przechody,\nNim pod tą górą stanąłem o świcie.\nChoć w sobie noszę jeszcze pierwsze życie,\nNabywam drugie wędrując tą drogą»."
    verse: true
    chunks:
      - pl: "Gdyśmy skończyli czułe pozdrowienia,"
        ru: "Когда мы кончили нежные приветствия,"
      - pl: "\nOn pytał: «Czy już czas upłynął długi,"
        ru: "он спросил: «Уже давно ли прошло время,"
      - pl: "\nJak tu przybyłeś przez dalekie wody?»"
        ru: "как ты прибыл сюда через далёкие воды?»"
      - pl: "\n— «Zaiste, szedłem przez smutne przechody,"
        ru: "— «Воистину, я шёл через печальные переходы,"
        note: "то есть через ад"
      - pl: "\nNim pod tą górą stanąłem o świcie."
        ru: "прежде чем на рассвете встал под этой горой."
      - pl: "\nChoć w sobie noszę jeszcze pierwsze życie,"
        ru: "Хоть я ещё ношу в себе первую жизнь,"
      - pl: "\nNabywam drugie wędrując tą drogą»."
        ru: "приобретаю вторую, странствуя этой дорогой»."
        note: "nabywać — приобретать"
    words: { "pozdrowienia": pozdrowic, "przybyłeś": przybyc, "dalekie": daleki, "smutne": smutny, "świcie": swit, "noszę": nosic }
  - clean: "On i Sordello, ledwom odpowiedział,\nW tył się cofnęli jak rażeni trwogą.\nJeden do mistrza zwrócił się, a drugi\nDo ducha, który w głębi groty siedział.\n«Chodź, patrz, Konradzie!» wołał, «co za dziwo!\nPatrz, co Bóg zdziałał przez łaskę prawdziwą»."
    verse: true
    chunks:
      - pl: "On i Sordello, ledwom odpowiedział,"
        ru: "Он и Сорделло, едва я ответил,"
      - pl: "\nW tył się cofnęli jak rażeni trwogą."
        ru: "отступили назад, как поражённые страхом."
      - pl: "\nJeden do mistrza zwrócił się, a drugi"
        ru: "Один обратился к учителю, а другой"
      - pl: "\nDo ducha, który w głębi groty siedział."
        ru: "к духу, что сидел в глубине грота."
      - pl: "\n«Chodź, patrz, Konradzie!» wołał, «co za dziwo!"
        ru: "«Иди, смотри, Конрад! — кричал он, — что за чудо!"
      - pl: "\nPatrz, co Bóg zdziałał przez łaskę prawdziwą»."
        ru: "Смотри, что Бог сотворил истинной милостью»."
    words: { "cofnęli": cofnac, "mistrza": mistrz, "zwrócił": zwrocic, "głębi": glab, "wołał": wolac, "łaskę": laska-2 }
  - clean: "Potem rzekł do mnie: «Przez wdzięczność szczególną,\nCoś winien Temu, który w tajemnicę\nTak dobrze ukrył swą arcykrynicę,\nŻe nam wprost do niej dojść samym nie wolno!\nGdy nazad morze przepłyniesz olbrzymie,\nPowiedz mej córce, Joannie na imię,\nNiechaj w tym miejscu za mną się przyczyni,\nGdzie wysłuchani są wszyscy niewinni."
    verse: true
    chunks:
      - pl: "Potem rzekł do mnie: «Przez wdzięczność szczególną,"
        ru: "Потом сказал мне: «Особой благодарностью"
      - pl: "\nCoś winien Temu, który w tajemnicę"
        ru: "ты обязан Тому, кто в тайне"
      - pl: "\nTak dobrze ukrył swą arcykrynicę,"
        ru: "так хорошо скрыл свой первоисточник,"
        note: "arcykrynica — первоисточник"
      - pl: "\nŻe nam wprost do niej dojść samym nie wolno!"
        ru: "что нам самим прямо дойти до него нельзя!"
      - pl: "\nGdy nazad morze przepłyniesz olbrzymie,"
        ru: "Когда ты переплывёшь назад огромное море,"
      - pl: "\nPowiedz mej córce, Joannie na imię,"
        ru: "скажи моей дочери по имени Джованна,"
      - pl: "\nNiechaj w tym miejscu za mną się przyczyni,"
        ru: "пусть в том месте помолится за меня,"
        note: "przyczynić się za kogoś — заступиться"
      - pl: "\nGdzie wysłuchani są wszyscy niewinni."
        ru: "где все невинные услышаны."
    words: { "wdzięczność": wdziecznosc, "szczególną": szczegolny, "tajemnicę": tajemnica, "morze": morze, "wysłuchani": wysluchac, "niewinni": niewinny }
  - clean: "Wątpię, jej matka czy jeszcze mnie kocha,\nWdowią zasłonę już zrzuciła płocha.\nPrzez nią wiem, ile kobiece kochanie\nTrwać może, jeśli wzrok i dotykanie\nŻaru jej uczuć często nie poddyma.\nZnany herbowy wąż w Medyjolanie\nCzy jej nagrobne okrasi marmury\nŚwietniej niżeli mój kogut z Gallury?»"
    verse: true
    chunks:
      - pl: "Wątpię, jej matka czy jeszcze mnie kocha,"
        ru: "Сомневаюсь, любит ли ещё меня её мать,"
      - pl: "\nWdowią zasłonę już zrzuciła płocha."
        ru: "вдовье покрывало уже сбросила ветреница."
        note: "płocha — ветреная"
      - pl: "\nPrzez nią wiem, ile kobiece kochanie"
        ru: "Через неё я знаю, сколько женская любовь"
      - pl: "\nTrwać może, jeśli wzrok i dotykanie"
        ru: "может длиться, если взгляд и прикосновение"
      - pl: "\nŻaru jej uczuć często nie poddyma."
        ru: "не раздувают часто жара её чувств."
        note: "poddymać — раздувать"
      - pl: "\nZnany herbowy wąż w Medyjolanie"
        ru: "Знаменитый гербовый змей в Милане"
        note: "герб Висконти"
      - pl: "\nCzy jej nagrobne okrasi marmury"
        ru: "украсит ли её надгробные мраморы"
        note: "okrasić — украсить"
      - pl: "\nŚwietniej niżeli mój kogut z Gallury?»"
        ru: "пышнее, чем мой петух из Галлуры?»"
    words: { "Wątpię": watpic, "zrzuciła": zrzucic, "kobiece": kobiecy, "Trwać": trwac, "wzrok": wzrok, "dotykanie": dotykac }
  - clean: "Kiedy to mówił, czytałem oczyma\nPrawą żarliwość z całej jego twarzy,\nCo na dnie serca, miarkując się, żarzy.\nGdy wzrok mych oczu pod gwiazdy się wznosi.\nTam gdzie leniwiej po niebie się wloką,\nJak części koła najbliższe od osi."
    verse: true
    chunks:
      - pl: "Kiedy to mówił, czytałem oczyma"
        ru: "Пока он это говорил, я читал глазами"
      - pl: "\nPrawą żarliwość z całej jego twarzy,"
