# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 10
chapterTitle: "Pieśń X"
chapterTitleRu: "Песнь X. Фарината"
level: B2
paragraphs:
  - clean: "(Krąg VI. Ciąg dalszy: Farinata, Kawalkante, Fryderyk II.)"
    chunks:
      - pl: "(Krąg VI. Ciąg dalszy: Farinata, Kawalkante, Fryderyk II.)"
        ru: "(Круг VI. Продолжение: Фарината, Кавальканте, Фридрих II.)"
        note: "ciąg dalszy — продолжение"
    words: { "Krąg": krag, "Ciąg": ciag, "dalszy": daleki }
  - clean: "Między cmentarzem, przez ścieżki bezdrożne,\nA miejskim murem, idziemy powoli:\n«Wysoka cnoto! Co według swej woli\nWodzisz mnie», rzekłem, «przez kręgi bezbożne,\nPowiedz: (któż lepiej chęć mą zaspokoi?)\nMożna li widzieć tych, co w grobach leżą?"
    verse: true
    chunks:
      - pl: "Między cmentarzem, przez ścieżki bezdrożne,"
        ru: "Между кладбищем, по бездорожным тропам,"
        note: "cmentarz — кладбище; bezdrożny — бездорожный"
      - pl: "\nA miejskim murem, idziemy powoli:"
        ru: "и городской стеной мы идём медленно:"
      - pl: "\n«Wysoka cnoto! Co według swej woli"
        ru: "«Высокая добродетель! Ты, что по своей воле"
        note: "cnota — добродетель"
      - pl: "\nWodzisz mnie», rzekłem, «przez kręgi bezbożne,"
        ru: "водишь меня, — сказал я, — по безбожным кругам,"
        note: "bezbożny — безбожный"
      - pl: "\nPowiedz: (któż lepiej chęć mą zaspokoi?)"
        ru: "скажи (кто же лучше утолит моё желание?):"
        note: "zaspokoić — утолить"
      - pl: "\nMożna li widzieć tych, co w grobach leżą?"
        ru: "можно ли видеть тех, что лежат в гробницах?"
        note: "można li — можно ли (книжн.)"
    words: { "cmentarzem": cmentarz, "ścieżki": sciezka, "miejskim": miejski, "murem": mur, "Wodzisz": wodzic, "rzekłem": rzec }
  - clean: "Grobowe wieka snadź podjęte świeżo,\nA nikt wkoło nich na straży nie stoi».\nMistrz na to: «Wszystkie zamkną się mogiły:\nGdy tu powrócą z Jozefatu dusze\nZ ciałami, które na ziemi rzuciły.\nTu z Epikurem cmentarz po tej stronie\nMają ci wszyscy, co szerzyli zdanie,\nŻe dusza z ciałem zamiera przy skonie."
    verse: true
    chunks:
      - pl: "Grobowe wieka snadź podjęte świeżo,"
        ru: "Надгробные крышки, видно, только что подняты,"
        note: "podjęty — поднятый; świeżo — только что"
      - pl: "\nA nikt wkoło nich na straży nie stoi»."
        ru: "а никто вокруг них на страже не стоит»."
        note: "na straży — на страже"
      - pl: "\nMistrz na to: «Wszystkie zamkną się mogiły:"
        ru: "Учитель на это: «Все могилы закроются,"
      - pl: "\nGdy tu powrócą z Jozefatu dusze"
        ru: "когда сюда вернутся из Иосафата души"
        note: "долина Иосафата — место Страшного суда"
      - pl: "\nZ ciałami, które na ziemi rzuciły."
        ru: "с телами, которые оставили на земле."
      - pl: "\nTu z Epikurem cmentarz po tej stronie"
        ru: "Здесь с Эпикуром кладбище по эту сторону"
      - pl: "\nMają ci wszyscy, co szerzyli zdanie,"
        ru: "имеют все те, кто распространял мнение,"
        note: "szerzyć — распространять"
      - pl: "\nŻe dusza z ciałem zamiera przy skonie."
        ru: "что душа с телом умирает при кончине."
        note: "zamierać — умирать; skon — кончина"
    words: { "podjęte": podjac, "straży": straz, "Mistrz": mistrz, "powrócą": powrocic, "rzuciły": rzucic, "dusza": dusza }
  - clean: "Odpowiadając na twoje pytanie\nChęć, jaką skrywasz, zaspokoić, muszę».\nA ja mu na to: «Wodzu! chęć niecałą\nOdkrywam tobie, bo chcę mówić mało,\nJak żąda twoja przestroga nienowa».\n«Ty, co za życia idziesz, Toskańczyku,\nPrzez cmentarz ognia i mówisz tak skromnie,\nJeśli twa łaska, wstrzymaj się koło mnie."
    verse: true
    chunks:
      - pl: "Odpowiadając na twoje pytanie"
        ru: "Отвечая на твой вопрос,"
      - pl: "\nChęć, jaką skrywasz, zaspokoić, muszę»."
        ru: "желание, что ты скрываешь, я должен утолить»."
        note: "skrywać — скрывать"
      - pl: "\nA ja mu na to: «Wodzu! chęć niecałą"
        ru: "А я ему на это: «Вождь! Желание не полностью"
        note: "niecały — неполный"
      - pl: "\nOdkrywam tobie, bo chcę mówić mało,"
        ru: "открываю тебе, ибо хочу говорить мало,"
      - pl: "\nJak żąda twoja przestroga nienowa»."
        ru: "как требует твоё не новое предостережение»."
        note: "przestroga — предостережение"
      - pl: "\n«Ty, co za życia idziesz, Toskańczyku,"
        ru: "«Ты, что идёшь живым, тосканец,"
        note: "za życia — при жизни; Toskańczyk — тосканец"
      - pl: "\nPrzez cmentarz ognia i mówisz tak skromnie,"
        ru: "по кладбищу огня и говоришь так скромно,"
      - pl: "\nJeśli twa łaska, wstrzymaj się koło mnie."
        ru: "если будет твоя милость, задержись возле меня."
        note: "jeśli twa łaska — будь добр"
    words: { "Odpowiadając": odpowiadac, "Chęć": chec, "Wodzu": wodz, "niecałą": niecaly, "żąda": zadac-2, "wstrzymaj": wstrzymac }
  - clean: "Szlachetny kraj nasz zdradza twoja mowa,\nKtóry klął może fatalność mej chwały».\nGłos z grobu do mnie przemówił w te słowa.\nDo mego wodza podszedłem, drżąc cały,\nA on rzekł do mnie: «Zwróć oczy, co tobie?\nPatrz, Farinata siedzi w swoim grobie,\nMożesz go widzieć od pasa do głowy»."
    verse: true
    chunks:
      - pl: "Szlachetny kraj nasz zdradza twoja mowa,"
        ru: "Твоя речь выдаёт нашу благородную страну,"
        note: "zdradzać — выдавать"
      - pl: "\nKtóry klął może fatalność mej chwały»."
        ru: "которую, может, проклинала роковая сила моей славы»."
        note: "fatalność — роковость"
      - pl: "\nGłos z grobu do mnie przemówił w te słowa."
        ru: "Голос из гробницы заговорил со мной такими словами."
      - pl: "\nDo mego wodza podszedłem, drżąc cały,"
        ru: "К моему вождю я подошёл, весь дрожа,"
      - pl: "\nA on rzekł do mnie: «Zwróć oczy, co tobie?"
        ru: "а он сказал мне: «Обрати взор, что с тобой?"
        note: "co tobie? — что с тобой?"
      - pl: "\nPatrz, Farinata siedzi w swoim grobie,"
        ru: "Смотри, Фарината сидит в своей гробнице,"
        note: "Farinata degli Uberti — вождь флорентийских гибеллинов"
      - pl: "\nMożesz go widzieć od pasa do głowy»."
        ru: "ты можешь видеть его от пояса до головы»."
    words: { "Szlachetny": szlachetny, "zdradza": zdradzac, "chwały": chwala, "grobu": grob, "przemówił": przemowic, "pasa": pas }
  - clean: "Utkwiłem oczy w jego wzrok grobowy,\nOn piersią, czołem prostował się w trumnie,\nJak gdyby piekłu urągał się dumnie.\nMistrz mnie pełnego zgrozy i żałoby\nPorwał co żywo i pchnął między groby,\nI rzekł: «Bądź jasnym i otwartym w mowie!»."
    verse: true
    chunks:
      - pl: "Utkwiłem oczy w jego wzrok grobowy,"
        ru: "Я вперил глаза в его могильный взгляд,"
      - pl: "\nOn piersią, czołem prostował się w trumnie,"
        ru: "он грудью, челом выпрямлялся в гробу,"
        note: "prostować się — выпрямляться"
      - pl: "\nJak gdyby piekłu urągał się dumnie."
        ru: "словно гордо насмехался над адом."
        note: "urągać — глумиться, насмехаться"
      - pl: "\nMistrz mnie pełnego zgrozy i żałoby"
        ru: "Учитель меня, полного ужаса и скорби,"
        note: "żałoba — траур, скорбь"
      - pl: "\nPorwał co żywo i pchnął między groby,"
        ru: "схватил живо и подтолкнул меж гробниц,"
      - pl: "\nI rzekł: «Bądź jasnym i otwartym w mowie!»."
        ru: "и сказал: «Будь ясен и открыт в речи!»"
    words: { "wzrok": wzrok, "piersią": piers, "trumnie": trumna, "piekłu": pieklo, "żałoby": zaloba, "Porwał": porwac }
  - clean: "Gdym stanął przed nim, on na mnie ukosem\nPopatrzał trochę i wyniosłym głosem,\nZapytał: «Jacy są twoi przodkowie?».\nChcąc być posłusznym, nic nie zataiłem.\nOn spojrzał na wpół przymkniętą powieką\nI rzekł: «Z twoimi w ciągłej wojnie żyłem,\nOnychże z kraju wygnałem dwa razy»."
    verse: true
    chunks:
      - pl: "Gdym stanął przed nim, on na mnie ukosem"
        ru: "Когда я встал перед ним, он на меня искоса"
        note: "ukosem — искоса"
      - pl: "\nPopatrzał trochę i wyniosłym głosem,"
        ru: "посмотрел немного и надменным голосом"
        note: "wyniosły — надменный"
      - pl: "\nZapytał: «Jacy są twoi przodkowie?»."
        ru: "спросил: «Кто твои предки?»"
        note: "przodek — предок"
      - pl: "\nChcąc być posłusznym, nic nie zataiłem."
        ru: "Желая быть послушным, я ничего не утаил."
        note: "zataić — утаить"
      - pl: "\nOn spojrzał na wpół przymkniętą powieką"
        ru: "Он взглянул из-под наполовину прикрытого века"
        note: "przymknięty — прикрытый"
      - pl: "\nI rzekł: «Z twoimi w ciągłej wojnie żyłem,"
        ru: "и сказал: «С твоими я жил в постоянной войне,"
        note: "twoi — твои (родные)"
      - pl: "\nOnychże z kraju wygnałem dwa razy»."
        ru: "их же я изгнал из страны дважды»."
        note: "onychże — устар. «их же»; wygnać — изгнать"
    words: { "stanął": stanac, "Popatrzał": popatrzec, "głosem": glos, "przodkowie": przodek, "przymkniętą": przymknac, "ciągłej": ciagly }
  - clean: "«Wygnani», rzekłem z uczuciem obrazy,\n«Byli dwa razy, wracali dwa razy;\nTo była sztuka, której nie spostrzegli\nTwoi stronnicy jako w niej niebiegli».\nCień drugi wzniósł się ponad trumny wieko.\nTylko po brodę, z zdziwieniem nas obu,\nWidać, że wstawał na kolanach z grobu."
    verse: true
    chunks:
      - pl: "«Wygnani», rzekłem z uczuciem obrazy,"
        ru: "«Изгнанные, — сказал я с чувством обиды, —"
        note: "obraza — обида"
      - pl: "\n«Byli dwa razy, wracali dwa razy;"
        ru: "были дважды, возвращались дважды;"
      - pl: "\nTo była sztuka, której nie spostrzegli"
        ru: "это было искусство, которого не постигли"
        note: "sztuka — искусство"
      - pl: "\nTwoi stronnicy jako w niej niebiegli»."
        ru: "твои сторонники, как неискушённые в нём»."
        note: "stronnik — сторонник; niebiegły — неискушённый"
      - pl: "\nCień drugi wzniósł się ponad trumny wieko."
        ru: "Вторая тень поднялась над крышкой гроба."
      - pl: "\nTylko po brodę, z zdziwieniem nas obu,"
        ru: "Лишь по подбородок, к удивлению нас обоих,"
        note: "broda — подбородок"
      - pl: "\nWidać, że wstawał na kolanach z grobu."
        ru: "видно, что вставала на коленях из гроба."
    words: { "spostrzegli": spostrzec, "Cień": cien, "wzniósł": wzniesc, "brodę": broda, "Widać": widac, "kolanach": kolano }
  - clean: "Wodząc oczyma, mnie wkoło oglądał,\nJak gdyby kogoś przy mnie widzieć żądał;\nLecz gdy na koniec spostrzegł, że się mami\nPróżną nadzieją, przemówił ze łzami:\n«Jeżeli własna genijuszu siła\nTo ci więzienie ciemne otworzyła,\nPowiedz, gdzie syn mój, czemu on nie z tobą?»"
    verse: true
    chunks:
      - pl: "Wodząc oczyma, mnie wkoło oglądał,"
        ru: "Водя глазами, оглядывала меня кругом,"
      - pl: "\nJak gdyby kogoś przy mnie widzieć żądał;"
        ru: "как будто желала видеть кого-то при мне;"
      - pl: "\nLecz gdy na koniec spostrzegł, że się mami"
        ru: "но когда наконец заметила, что обманывается"
        note: "mamić się — обольщаться"
      - pl: "\nPróżną nadzieją, przemówił ze łzami:"
        ru: "пустой надеждой, заговорила со слезами:"
      - pl: "\n«Jeżeli własna genijuszu siła"
        ru: "«Если собственная сила гения"
        note: "genijusz — старое написание geniusz"
      - pl: "\nTo ci więzienie ciemne otworzyła,"
        ru: "открыла тебе эту тёмную темницу,"
        note: "więzienie — темница"
      - pl: "\nPowiedz, gdzie syn mój, czemu on nie z tobą?»"
        ru: "скажи, где мой сын, почему он не с тобой?»"
        note: "Кавальканте Кавальканти, отец поэта Гвидо"
    words: { "oglądał": ogladac, "łzami": lza, "własna": wlasny, "siła": sila, "ciemne": ciemny, "otworzyła": otworzyc }
  - clean: "A ja: «Nie wchodzę tu jedną osobą,\nW ślad tego mędrca stopy moje idą,\nKtóry tam czeka. Być może, twój Gwido\nZanadto mało oddawał mu cześci!»\nZ jego słów, z jego wyrazu boleści\nOdgadłem łatwo, kto ten cień był nowy,\nWięc mu odrzekłem stosownymi słowy."
    verse: true
    chunks:
      - pl: "A ja: «Nie wchodzę tu jedną osobą,"
        ru: "А я: «Я вхожу сюда не сам по себе,"
        note: "jedną osobą — одной своей особой"
      - pl: "\nW ślad tego mędrca stopy moje idą,"
        ru: "по следам того мудреца идут мои стопы,"
      - pl: "\nKtóry tam czeka. Być może, twój Gwido"
        ru: "который там ждёт. Быть может, твой Гвидо"
        note: "Gwido — Гвидо Кавальканти, друг Данте"
      - pl: "\nZanadto mało oddawał mu cześci!»"
        ru: "слишком мало оказывал ему почёта!»"
        note: "oddawać cześć — оказывать почёт; cześci — устар. «czci»"
      - pl: "\nZ jego słów, z jego wyrazu boleści"
        ru: "По его словам, по его выражению боли"
      - pl: "\nOdgadłem łatwo, kto ten cień był nowy,"
        ru: "я легко догадался, кто была эта новая тень,"
      - pl: "\nWięc mu odrzekłem stosownymi słowy."
        ru: "и ответил ему подобающими словами."
        note: "stosowny — подобающий"
    words: { "wchodzę": wchodzic, "osobą": osoba, "ślad": slad, "czeka": czekac, "oddawał": oddawac, "wyrazu": wyraz }
  - clean: "A cień się porwał na nogi i krzyknął:\n«On był ! Czy jeszcze spośród was nie zniknął?\nCzy mu się jeszcze jak w jasnej krynicy\nŁagodne światło odbija w źrenicy?»\nNa co nie mając mojej odpowiedzi,\nPadł w grób na powrót. A tamten cień siedzi\nNieporuszony jak popiersie z miedzi\nI swą rozmowę ciągnie ze mną dalej:\n«Jeśli źle moi tę sztukę poznali,\nTo więcej boli niż ten żar, co pali,\nLecz nim królowej piekieł światłość cudna\nBłyśnie na niebie po raz pięćdziesiąty,\nDoznasz na sobie, jak ta sztuka trudna!"
    verse: true
    chunks:
      - pl: "A cień się porwał na nogi i krzyknął:"
        ru: "А тень вскочила на ноги и крикнула:"
        note: "porwać się — вскочить"
      - pl: "\n«On był ! Czy jeszcze spośród was nie zniknął?"
        ru: "«Он был?! Неужели он уже исчез из вашей среды?"
        note: "у Данте — «был»: отец решил, что сын умер"
      - pl: "\nCzy mu się jeszcze jak w jasnej krynicy"
        ru: "Разве ему уже не отражается, как в ясном роднике,"
        note: "krynica — родник"
      - pl: "\nŁagodne światło odbija w źrenicy?»"
        ru: "мягкий свет в зрачке?»"
      - pl: "\nNa co nie mając mojej odpowiedzi,"
        ru: "На что, не получив моего ответа,"
      - pl: "\nPadł w grób na powrót. A tamten cień siedzi"
        ru: "она упала в гроб снова. А та тень сидит"
        note: "na powrót — снова, обратно"
      - pl: "\nNieporuszony jak popiersie z miedzi"
        ru: "неподвижно, как медный бюст,"
        note: "nieporuszony — неподвижный; popiersie — бюст; miedź — медь"
      - pl: "\nI swą rozmowę ciągnie ze mną dalej:"
        ru: "и продолжает свой разговор со мной дальше:"
      - pl: "\n«Jeśli źle moi tę sztukę poznali,"
        ru: "«Если мои плохо постигли это искусство,"
      - pl: "\nTo więcej boli niż ten żar, co pali,"
        ru: "это болит сильнее, чем этот жар, что жжёт."
      - pl: "\nLecz nim królowej piekieł światłość cudna"
        ru: "Но прежде чем чудесный свет царицы ада"
        note: "królowa piekieł — Луна (Геката-Прозерпина); cudny — чудный"
      - pl: "\nBłyśnie na niebie po raz pięćdziesiąty,"
        ru: "блеснёт на небе в пятидесятый раз,"
        note: "то есть через пятьдесят месяцев"
      - pl: "\nDoznasz na sobie, jak ta sztuka trudna!"
        ru: "ты испытаешь на себе, как трудно это искусство!"
        note: "doznać — испытать"
    words: { "Łagodne": lagodny, "odbija": odbijac, "Padł": pasc, "Nieporuszony": poruszyc, "ciągnie": ciagnac, "Doznasz": doznac }
  - clean: "Lecz mów, nim wrócisz w swe rodzinne kąty,\nCo moi temu zrobili ludowi,\nŻe na nich prawa tak dzikie stanowi??»\nJa na to: «Od krwi wielkiego rozlewu,\nZaczerwieniona Arbia posoką,\nTen lud pobudza do zemsty i gniewu»."
    verse: true
    chunks:
      - pl: "Lecz mów, nim wrócisz w swe rodzinne kąty,"
        ru: "Но скажи, прежде чем вернёшься в свои родные края,"
        note: "kąty — углы, родные места"
      - pl: "\nCo moi temu zrobili ludowi,"
