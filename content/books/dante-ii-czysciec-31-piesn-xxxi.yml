        ru: "но перед глазами птицы, что давно обросла"
      - pl: "\nW pierze i pióra, może mieć lot wzniosły,"
        ru: "перьями и пухом, может иметь высокий полёт,"
      - pl: "\nDaremnie łowiec nastawuje sieci."
        ru: "напрасно охотник ставит сети,"
        note: "nastawiać — ставить"
    words: { "zwyczajem": zwyczaj, "ptaka": ptak, "skrzydeł": skrzydlo, "różowych": rozowy, "równie": rownie, "sieci": siec }
  - clean: "Darmo łuk ciągnie, strzała nie doleci».\nJak gdy do winy przyznają się dzieci,\nMilczą i prosto stoją przed starszemi,\nTylko ich oczy wstyd spuszcza do ziemi;\nPodobnie stałem, a ona tak pocznie:\n«Gdy mnie słuchając bolejesz widocznie,\nPodnieś twą brodę, boleść, co cię tłoczy,\nPoczujesz żywiej patrząc w moje oczy»."
    verse: true
