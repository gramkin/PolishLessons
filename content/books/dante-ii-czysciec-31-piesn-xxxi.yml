        ru: "когда лицо называют через бороду, целое через часть,"
        note: "то есть «ты уже взрослый»"
      - pl: "\nSłów gorzkich żądło poczułem do razu."
        ru: "я сразу почувствовал жало горьких слов."
      - pl: "\nW chwili, gdym moje podnosił źrenice,"
        ru: "В тот миг, когда я поднимал свои зрачки,"
      - pl: "\nPrzestali rzucać kwiaty aniołowie,"
        ru: "ангелы перестали бросать цветы,"
      - pl: "\nWzrok mój nieśmiały padł na Beatrycę"
        ru: "мой робкий взгляд упал на Беатриче,"
      - pl: "\nPatrzącą w gryfa postać promienistą,"
        ru: "смотрящую на лучезарный облик грифона,"
      - pl: "\nW jednej osobie z naturą dwoistą."
        ru: "в одном лице с двойной природой."
        note: "Христос"
    words: { "oporem": opor, "całość": calosc, "zowie": zwac, "gorzkich": gorzki, "podnosił": podnosic, "nieśmiały": niesmialy }
  - clean: "Choć pod zasłoną stała poza rzeką,\nOd siebie samej piękniejsza daleko\nI tym piękniejsza, że wdziękami swemi\nDrugich piękności nie ćmiła na ziemi.\nŻal jął boleśnie piec mię jak pokrzywą,\nŻem ją zapomniał, kochając tak żywo,\nDla marnych uciech, światowej głupoty."
    verse: true
