      - pl: "\nSpuszczać twych skrzydeł, by czekać ran nowych"
        ru: "опускать свои крылья, чтобы ждать новых ран"
      - pl: "\nZ oczu dziewczyny lub z jej ust różowych,"
        ru: "от глаз девушки или от её розовых уст,"
      - pl: "\nLub od uciechy równie krótkotrwałej."
        ru: "или от столь же кратковременной утехи."
      - pl: "\nPtak dziecię czeka na dwa, trzy wystrzały,"
        ru: "Птенец ждёт двух, трёх выстрелов,"
