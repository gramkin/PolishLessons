level: B2
paragraphs:
  - clean: "(Dante spowiada się przed Beatrycze. Zanurza się w strumieniu i przekracza go. Beatrycze zdejmuje zasłonę.)"
    chunks:
      - pl: "(Dante spowiada się przed Beatrycze. Zanurza się w strumieniu i przekracza go. Beatrycze zdejmuje zasłonę.)"
        ru: "(Данте исповедуется перед Беатриче. Погружается в ручей и переходит его. Беатриче снимает покрывало.)"
    words: { "strumieniu": strumien, "przekracza": przekraczac, "zdejmuje": zdejmowac, "zasłonę": zaslona }
  - clean: "«Ty, który stoisz poza świętą rzeką»,\nTymi mówiła Beatrycze słowy,\nZwracając do mnie samo ostrze mowy,\nA której cięcia tak bolą i pieką.\n«Mów, czy to prawda? wielkie oskarżenie,\nSpowiedzią twoje oczyszczaj sumienie»."
    verse: true
    chunks:
      - pl: "«Ty, który stoisz poza świętą rzeką»,"
        ru: "«Ты, что стоишь по ту сторону святой реки», —"
      - pl: "\nTymi mówiła Beatrycze słowy,"
        ru: "такими словами говорила Беатриче,"
      - pl: "\nZwracając do mnie samo ostrze mowy,"
        ru: "обращая ко мне само остриё речи,"
      - pl: "\nA której cięcia tak bolą i pieką."
        ru: "чьи удары так болят и жгут."
      - pl: "\n«Mów, czy to prawda? wielkie oskarżenie,"
        ru: "«Скажи, правда ли это? великое обвинение,"
      - pl: "\nSpowiedzią twoje oczyszczaj sumienie»."
        ru: "исповедью очищай свою совесть»."
    words: { "Zwracając": zwracac, "ostrze": ostrze, "mowy": mowa, "bolą": bolec, "pieką": piec-2, "sumienie": sumienie }
  - clean: "Stałem zmieszany, ze zbytku wzruszenia\nGłos mój, nim wyszedł, stracił siłę brzmienia.\nCzekała trochę, potem tak mówiła:\n«Mów, nie myśl długo, twych błędów wspomnienia\nJeszcze ci woda Lety nie zgładziła».\nStrach tak potężnie głos we mnie zatłumiał,\nŻe ledwom ciche *Tak* wymówić umiał,\nŻe trzeba było patrzeć okiem umieć,\nChcąc po ust ruchu jego dźwięk zrozumieć."
    verse: true
    chunks:
      - pl: "Stałem zmieszany, ze zbytku wzruszenia"
        ru: "Я стоял смущённый, от избытка волнения"
      - pl: "\nGłos mój, nim wyszedł, stracił siłę brzmienia."
        ru: "мой голос, прежде чем вышел, потерял силу звука."
      - pl: "\nCzekała trochę, potem tak mówiła:"
        ru: "Она подождала немного, потом так сказала:"
      - pl: "\n«Mów, nie myśl długo, twych błędów wspomnienia"
        ru: "«Говори, не думай долго, воспоминаний о твоих заблуждениях"
      - pl: "\nJeszcze ci woda Lety nie zgładziła»."
        ru: "ещё не смыла тебе вода Леты»."
      - pl: "\nStrach tak potężnie głos we mnie zatłumiał,"
        ru: "Страх так сильно задушил во мне голос,"
      - pl: "\nŻe ledwom ciche *Tak* wymówić umiał,"
        ru: "что я едва сумел произнести тихое «Да»,"
      - pl: "\nŻe trzeba było patrzeć okiem umieć,"
        ru: "так что нужно было уметь смотреть глазом,"
      - pl: "\nChcąc po ust ruchu jego dźwięk zrozumieć."
        ru: "чтобы по движению уст понять его звук."
    words: { "zmieszany": zmieszac, "Głos": glos, "Strach": strach, "umiał": umiec, "ruchu": ruch, "dźwięk": dzwiek }
  - clean: "Majdan gwałtownie gdy naciągnie ręka,\nZarazem struna i łuk cały pęka,\nStrzała mniej szybko dobiega do celu;\nTakem złamany był od wrażeń wielu,\nTyle wzdychałem i płakałem tyle,\nŻe głos w swym przejściu spóźnił się o chwilę."
    verse: true
    chunks:
      - pl: "Majdan gwałtownie gdy naciągnie ręka,"
        ru: "Когда рука слишком резко натянет арбалет,"
        note: "majdan — середина лука, арбалет"
      - pl: "\nZarazem struna i łuk cały pęka,"
        ru: "одновременно лопаются тетива и весь лук,"
      - pl: "\nStrzała mniej szybko dobiega do celu;"
        ru: "стрела менее быстро долетает до цели;"
      - pl: "\nTakem złamany był od wrażeń wielu,"
        ru: "так я был сломлен множеством впечатлений,"
      - pl: "\nTyle wzdychałem i płakałem tyle,"
        ru: "столько вздыхал и столько плакал,"
      - pl: "\nŻe głos w swym przejściu spóźnił się o chwilę."
        ru: "что голос в своём проходе запоздал на миг."
    words: { "ręka": reka, "Strzała": strzala, "celu": cel, "płakałem": plakac, "spóźnił": spoznic, "chwilę": chwila }
  - clean: "Wtem ona: «Kiedy iskrę po iskierce\nWciąż dorzucając do twych żądz niewinnych,\nMiłością dobra zatliłam twe serce,\nPo którym żądza nie widzi dóbr innych;\nMów, jaki łańcuch lub przekop głęboki\nNa drodze dobra zatrzymał twe kroki,\nŻeś musiał stracić nadzieję iść dalej?"
    verse: true
    chunks:
      - pl: "Wtem ona: «Kiedy iskrę po iskierce"
        ru: "Тут она: «Когда я, искру за искоркой"
      - pl: "\nWciąż dorzucając do twych żądz niewinnych,"
        ru: "всё подбрасывая к твоим невинным желаниям,"
      - pl: "\nMiłością dobra zatliłam twe serce,"
        ru: "зажгла твоё сердце любовью к добру,"
      - pl: "\nPo którym żądza nie widzi dóbr innych;"
        ru: "за которым желание не видит иных благ;"
      - pl: "\nMów, jaki łańcuch lub przekop głęboki"
        ru: "скажи: какая цепь или глубокий ров"
      - pl: "\nNa drodze dobra zatrzymał twe kroki,"
        ru: "на пути добра остановил твои шаги,"
      - pl: "\nŻeś musiał stracić nadzieję iść dalej?"
        ru: "что ты должен был потерять надежду идти дальше?"
    words: { "Wciąż": wciaz, "niewinnych": niewinny, "Miłością": milosc, "łańcuch": lancuch, "głęboki": gleboki, "zatrzymał": zatrzymac }
  - clean: "Jakie korzyści i jakie pieszczoty\nUrzekły ciebie, że wstyd cię nie pali\nCiągle uganiać tak błędne przedmioty?»\nWestchnąłem gorzko, usta zmordowane,\nJąkając słowa krótkie i urwane,\nLedwo dość miały sił do odpowiedzi."
    verse: true
    chunks:
      - pl: "Jakie korzyści i jakie pieszczoty"
        ru: "Какие выгоды и какие ласки"
      - pl: "\nUrzekły ciebie, że wstyd cię nie pali"
        ru: "очаровали тебя, что тебя не жжёт стыд"
        note: "urzec — очаровать"
      - pl: "\nCiągle uganiać tak błędne przedmioty?»"
        ru: "всё гоняться за такими блуждающими предметами?»"
      - pl: "\nWestchnąłem gorzko, usta zmordowane,"
        ru: "Я горько вздохнул; измученные уста,"
      - pl: "\nJąkając słowa krótkie i urwane,"
        ru: "запинаясь на коротких и обрывистых словах,"
      - pl: "\nLedwo dość miały sił do odpowiedzi."
        ru: "едва имели довольно сил для ответа."
    words: { "korzyści": korzysc, "wstyd": wstyd, "przedmioty": przedmiot, "krótkie": krotki, "urwane": urwac, "Ledwo": ledwo }
  - clean: "Płacząc, mówiłem: «Obecne rozkosze\nDawny mój zapał studziły po trosze,\nOdkąd twarz twoja skryła się przede mną».\nA ona: «Szczerym bądź w twojej spowiedzi,\nNie zmniejszysz winy, tłumacząc ją ciemno,\nGdy ją skroś widzi oko spowiednika."
    verse: true
    chunks:
      - pl: "Płacząc, mówiłem: «Obecne rozkosze"
        ru: "Плача, я говорил: «Нынешние наслаждения"
      - pl: "\nDawny mój zapał studziły po trosze,"
        ru: "понемногу остужали мой прежний пыл,"
      - pl: "\nOdkąd twarz twoja skryła się przede mną»."
        ru: "с тех пор как твоё лицо скрылось от меня»."
      - pl: "\nA ona: «Szczerym bądź w twojej spowiedzi,"
        ru: "А она: «Будь искренен в своей исповеди,"
      - pl: "\nNie zmniejszysz winy, tłumacząc ją ciemno,"
        ru: "ты не уменьшишь вины, объясняя её темно,"
      - pl: "\nGdy ją skroś widzi oko spowiednika."
        ru: "когда её насквозь видит глаз исповедника."
    words: { "Dawny": dawny, "Odkąd": odkad, "twarz": twarz, "Szczerym": szczery, "zmniejszysz": zmniejszyc, "tłumacząc": tlumaczyc }
  - clean: "Wiedz, gdy wyznanie grzechu się wymyka\nZe skruszonego żalem ust grzesznika,\nTu kamień młyński z wiekuistej rady\nW obrocie swoim tępi ostrze szpady.\nJednak chcąc wstydu oszczędzić dla ucha\nI gdybyś potem uznając rzecz marną,\nSłuchać mógł syren z większym hartem ducha,\nSłuchaj, a odsuń wszelkie łez twych ziarno."
    verse: true
    chunks:
      - pl: "Wiedz, gdy wyznanie grzechu się wymyka"
        ru: "Знай: когда признание греха вырывается"
      - pl: "\nZe skruszonego żalem ust grzesznika,"
        ru: "из уст грешника, сокрушённых сожалением,"
      - pl: "\nTu kamień młyński z wiekuistej rady"
        ru: "здесь жёрнов вечного совета"
        note: "kamień młyński — жёрнов"
      - pl: "\nW obrocie swoim tępi ostrze szpady."
        ru: "в своём вращении тупит остриё меча."
      - pl: "\nJednak chcąc wstydu oszczędzić dla ucha"
        ru: "Однако, желая избавить твоё ухо от стыда"
      - pl: "\nI gdybyś potem uznając rzecz marną,"
        ru: "и чтобы ты потом, признав вещь суетной,"
      - pl: "\nSłuchać mógł syren z większym hartem ducha,"
        ru: "мог слушать сирен с большей твёрдостью духа,"
      - pl: "\nSłuchaj, a odsuń wszelkie łez twych ziarno."
        ru: "слушай и отложи всякое зерно своих слёз."
    words: { "wyznanie": wyznac, "obrocie": obrot, "oszczędzić": oszczedzic, "marną": marny, "syren": syrena, "ziarno": ziarno }
  - clean: "Tam ciało moje w mogile zamknięte\nMogłoby natchnąć cele życia święte;\nNigdy natury albo sztuki dzieło\nWiększą rozkoszą ciebie nie natchnęło,\nJak moje piękne, gdzie żył duch mój, ciało,\nA które teraz w proch się rozsypało."
    verse: true
    chunks:
      - pl: "Tam ciało moje w mogile zamknięte"
        ru: "Там моё тело, замкнутое в могиле,"
      - pl: "\nMogłoby natchnąć cele życia święte;"
        ru: "могло бы вдохновить святые цели жизни;"
      - pl: "\nNigdy natury albo sztuki dzieło"
        ru: "никогда творение природы или искусства"
      - pl: "\nWiększą rozkoszą ciebie nie natchnęło,"
        ru: "не вдохновляло тебя большим наслаждением,"
      - pl: "\nJak moje piękne, gdzie żył duch mój, ciało,"
        ru: "чем моё прекрасное тело, где жил мой дух,"
      - pl: "\nA które teraz w proch się rozsypało."
