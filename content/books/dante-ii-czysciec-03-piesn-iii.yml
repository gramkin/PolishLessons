# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 3
chapterTitle: "Pieśń III"
chapterTitleRu: "Песнь III. Манфред"
level: B2
paragraphs:
  - clean: "(Tacy, co umarli w klątwie kościelnej. Manfred.)"
    chunks:
      - pl: "(Tacy, co umarli w klątwie kościelnej. Manfred.)"
        ru: "(Те, кто умер под церковным отлучением. Манфред.)"
        note: "klątwa kościelna — церковное отлучение"
    words: { "umarli": umrzec, "klątwie": klatwa }
  - clean: "Gdy uciekając w rozsypce przez pole,\nZnowu ku górze zwracały się cienie,\nTam gdzie pociąga rozum naszą wolę;\nJa się zbliżyłem do wodza wiernego,\nCzyżbym tę podróż mógł odbyć bez niego?\nOn zda się czegoś żałował jak grzechu;\nO czysta duszo! jak lada zboczenie\nGoryczą bodzie twe czułe sumienie!"
    verse: true
    chunks:
      - pl: "Gdy uciekając w rozsypce przez pole,"
        ru: "Когда, убегая врассыпную по полю,"
        note: "w rozsypce — врассыпную"
      - pl: "\nZnowu ku górze zwracały się cienie,"
        ru: "тени снова обратились к горе,"
      - pl: "\nTam gdzie pociąga rozum naszą wolę;"
        ru: "туда, куда влечёт разум нашу волю;"
      - pl: "\nJa się zbliżyłem do wodza wiernego,"
        ru: "я приблизился к верному вождю, —"
      - pl: "\nCzyżbym tę podróż mógł odbyć bez niego?"
        ru: "разве мог бы я совершить этот путь без него?"
      - pl: "\nOn zda się czegoś żałował jak grzechu;"
        ru: "Он, казалось, сожалел о чём-то, как о грехе;"
        note: "о задержке у Каселлы"
      - pl: "\nO czysta duszo! jak lada zboczenie"
        ru: "о чистая душа! как малейшее отступление"
        note: "lada — малейший; zboczenie — отступление"
      - pl: "\nGoryczą bodzie twe czułe sumienie!"
        ru: "горечью колет твою чуткую совесть!"
    words: { "rozum": rozum, "wodza": wodz, "wiernego": wierny, "odbyć": odbyc, "Goryczą": gorycz, "sumienie": sumienie }
  - clean: "Gdy zwolnił pochód nagłego pośpiechu,\nCo odejmuje ruchom ich powagę,\nMyśl moja śmielej zwróciła uwagę\nI oczy moje w stronę owej góry,\nCo szczytem w niebo wznosi się nad chmury.\nW czerwonym ogniu za mną słońce stało,\nPrzede mną tylko swój promień łamało,\nBo mu na wstręcie było moje ciało."
    verse: true
    chunks:
      - pl: "Gdy zwolnił pochód nagłego pośpiechu,"
        ru: "Когда он замедлил шествие внезапной спешки,"
      - pl: "\nCo odejmuje ruchom ich powagę,"
        ru: "что отнимает у движений их достоинство,"
      - pl: "\nMyśl moja śmielej zwróciła uwagę"
        ru: "моя мысль смелее обратила внимание"
      - pl: "\nI oczy moje w stronę owej góry,"
        ru: "и мои глаза в сторону той горы,"
      - pl: "\nCo szczytem w niebo wznosi się nad chmury."
        ru: "что вершиной в небо поднимается над тучами."
      - pl: "\nW czerwonym ogniu za mną słońce stało,"
        ru: "В красном огне позади меня стояло солнце,"
      - pl: "\nPrzede mną tylko swój promień łamało,"
        ru: "передо мной лишь преломляло свой луч,"
      - pl: "\nBo mu na wstręcie było moje ciało."
        ru: "ибо ему препятствием было моё тело."
        note: "na wstręcie — помехой"
    words: { "pośpiechu": pospiech, "powagę": powaga, "wznosi": wznosic, "chmury": chmura, "promień": promien, "łamało": lamac }
  - clean: "Gdy tam mój jeden cień na ziemię padał,\nMyśląc, że byłem rzucony w pół drogi.\nOczyma za się obracałem z trwogi.\nMój pocieszyciel, co mój przestrach zbadał,\nPrzemówił do mnie: «Co roisz w tej dobie?\nMyślisz, że, wódz twój, nie jestem przy tobie."
    verse: true
    chunks:
      - pl: "Gdy tam mój jeden cień na ziemię padał,"
        ru: "Когда там лишь моя одна тень падала на землю,"
      - pl: "\nMyśląc, że byłem rzucony w pół drogi."
        ru: "думая, что я брошен на полпути,"
        note: "то есть покинут Вергилием"
      - pl: "\nOczyma za się obracałem z trwogi."
        ru: "я со страхом оглядывался назад."
      - pl: "\nMój pocieszyciel, co mój przestrach zbadał,"
        ru: "Мой утешитель, что разгадал мой испуг,"
      - pl: "\nPrzemówił do mnie: «Co roisz w tej dobie?"
        ru: "заговорил со мной: «Что ты воображаешь в эту пору?"
      - pl: "\nMyślisz, że, wódz twój, nie jestem przy tobie."
        ru: "Думаешь, что я, твой вождь, не с тобой?"
    words: { "cień": cien, "padał": padac, "rzucony": rzucic, "zbadał": zbadac, "Przemówił": przemowic, "dobie": doba }
  - clean: "Ciało me, którym cień słałem po polu,\nGdzie teraz wieczór, leży w Neapolu.\nJeśli przede mną cień teraz nie pada,\nCóż za dziw, spojrzyj na niebios sklepienia,\nGdzie jedno światło drugie nie zacienia.\nJak ciała wasze, my treścią czującą\nCzujem podobnie ból, chłód i gorąco:\nJak to się robi, Bóg nam odkryć nie chce."
    verse: true
    chunks:
      - pl: "Ciało me, którym cień słałem po polu,"
        ru: "Тело моё, которым я бросал тень на поле,"
      - pl: "\nGdzie teraz wieczór, leży w Neapolu."
        ru: "лежит там, где теперь вечер, в Неаполе."
      - pl: "\nJeśli przede mną cień teraz nie pada,"
        ru: "Если передо мной теперь не падает тень,"
      - pl: "\nCóż za dziw, spojrzyj na niebios sklepienia,"
        ru: "что за диво, взгляни на своды небес,"
        note: "sklepienie — свод"
      - pl: "\nGdzie jedno światło drugie nie zacienia."
        ru: "где один свет другого не затеняет."
        note: "zacieniać — затенять"
      - pl: "\nJak ciała wasze, my treścią czującą"
        ru: "Как ваши тела, мы чувствующей сутью"
      - pl: "\nCzujem podobnie ból, chłód i gorąco:"
        ru: "чувствуем так же боль, холод и жар:"
      - pl: "\nJak to się robi, Bóg nam odkryć nie chce."
        ru: "как это делается, Бог нам открыть не хочет."
    words: { "Ciało": cialo, "wieczór": wieczor, "spojrzyj": spojrzec, "niebios": niebiosa, "światło": swiatlo, "podobnie": podobnie }
  - clean: "Głupi, którego rozum pycha łechce,\nŻe nieskończoność tajemnicy zbada,\nJak się treść jedna ze trzech osób składa.\nRodzaju ludzki, przestań na twym Quia,\nGdybyś mógł zbadać tajnie wszystkie nieba,\nO! czyżby była konieczna potrzeba,\nAby przeczysta rodziła Maryja?"
    verse: true
    chunks:
      - pl: "Głupi, którego rozum pycha łechce,"
        ru: "Глуп тот, чей разум щекочет гордыня,"
        note: "łechtać — щекотать"
      - pl: "\nŻe nieskończoność tajemnicy zbada,"
        ru: "что он исследует бесконечность тайны,"
      - pl: "\nJak się treść jedna ze trzech osób składa."
        ru: "как одна суть складывается из трёх лиц."
        note: "Троица"
      - pl: "\nRodzaju ludzki, przestań na twym Quia,"
        ru: "Род людской, довольствуйся своим «Quia»,"
        note: "лат. «что», то есть знать, что есть, а не почему"
      - pl: "\nGdybyś mógł zbadać tajnie wszystkie nieba,"
        ru: "если бы ты мог исследовать все тайны неба,"
      - pl: "\nO! czyżby była konieczna potrzeba,"
        ru: "о! разве была бы необходимость,"
      - pl: "\nAby przeczysta rodziła Maryja?"
        ru: "чтобы пречистая Мария рождала?"
        note: "przeczysty — пречистый"
    words: { "łechce": lechtac, "tajemnicy": tajemnica, "składa": skladac, "ludzki": ludzki, "nieba": niebo, "konieczna": konieczny }
  - clean: "Tak wielu żądza niezaspokojona\nJest wiekuistą karą ich żywota\nWiekuistego! To mówiąc, Platona\nStoi mi w myśli duch i Arystota,\nI wielu innych». Mistrz zamilkł i czoło\nSchyliwszy w ziemię, patrzał niewesoło."
    verse: true
    chunks:
      - pl: "Tak wielu żądza niezaspokojona"
        ru: "Так у многих неутолённая жажда"
        note: "niezaspokojony — неутолённый"
      - pl: "\nJest wiekuistą karą ich żywota"
        ru: "есть вечная кара их вечной"
      - pl: "\nWiekuistego! To mówiąc, Platona"
        ru: "жизни! Говоря это, дух Платона"
      - pl: "\nStoi mi w myśli duch i Arystota,"
        ru: "стоит у меня в мысли и Аристотеля,"
        note: "Arystota — устар. род. п. Аристотеля"
      - pl: "\nI wielu innych». Mistrz zamilkł i czoło"
        ru: "и многих других». Учитель умолк и, чело"
      - pl: "\nSchyliwszy w ziemię, patrzał niewesoło."
        ru: "склонив к земле, смотрел невесело."
    words: { "duch": duch, "innych": inny, "Mistrz": mistrz, "czoło": czolo, "ziemię": ziemia, "patrzał": patrzec }
  - clean: "Przyszliśmy w końcu pod góry podnoże,\nWidzim, że idąc przez jej skał bezdroże,\nNajszybsza stopa nic nam nie pomoże.\nZnane z dróg ciasnych genueńskie skały\nPrzy nich jak schody szerokie się zdały:\nWstrzymując krok swój, mistrz ozwał się: «Kto tu\nZgadnie, gdzie głaz ten swą pochyłość stoczy?"
    verse: true
    chunks:
      - pl: "Przyszliśmy w końcu pod góry podnoże,"
        ru: "Мы пришли наконец к подножию горы,"
      - pl: "\nWidzim, że idąc przez jej skał bezdroże,"
        ru: "видим, что, идя по бездорожью её скал,"
      - pl: "\nNajszybsza stopa nic nam nie pomoże."
        ru: "самая быстрая нога нам ничуть не поможет."
      - pl: "\nZnane z dróg ciasnych genueńskie skały"
        ru: "Генуэзские скалы, знаменитые узкими дорогами,"
      - pl: "\nPrzy nich jak schody szerokie się zdały:"
        ru: "рядом с ними показались бы широкой лестницей:"
      - pl: "\nWstrzymując krok swój, mistrz ozwał się: «Kto tu"
        ru: "задержав свой шаг, учитель заговорил: «Кто здесь"
      - pl: "\nZgadnie, gdzie głaz ten swą pochyłość stoczy?"
        ru: "угадает, где этот камень скатит свой склон?"
    words: { "skał": skala, "stopa": stopa, "ciasnych": ciasny, "schody": schody, "szerokie": szeroki, "Zgadnie": zgadnac }
  - clean: "Któż by śmiał iść tam bez skrzydeł do lotu?»\nGdy mistrz, spuściwszy oczy w ziemię, stoi,\nZ troską szukając drogi w myśli swojej,\nA ja wzrok w głazy utkwiłem sterczące:\nNa lewo duchy spostrzegłem idące,\nSchodziły ku nam, a jednak, o dziwo!"
    verse: true
    chunks:
      - pl: "Któż by śmiał iść tam bez skrzydeł do lotu?»"
        ru: "Кто посмел бы идти туда без крыльев для полёта?»"
      - pl: "\nGdy mistrz, spuściwszy oczy w ziemię, stoi,"
        ru: "Пока учитель, опустив глаза в землю, стоит,"
      - pl: "\nZ troską szukając drogi w myśli swojej,"
        ru: "с тревогой ища дороги в своей мысли,"
      - pl: "\nA ja wzrok w głazy utkwiłem sterczące:"
        ru: "а я вперил взгляд в торчащие камни:"
      - pl: "\nNa lewo duchy spostrzegłem idące,"
        ru: "слева я заметил идущих духов,"
      - pl: "\nSchodziły ku nam, a jednak, o dziwo!"
        ru: "они спускались к нам, и всё же, о чудо!"
    words: { "skrzydeł": skrzydlo, "spuściwszy": spuscic, "troską": troska, "wzrok": wzrok, "spostrzegłem": spostrzec, "Schodziły": schodzic }
  - clean: "Zdało się, stały, snadź tak szły leniwo.\nMówię do mistrza: «Podnieś twoje oczy,\nPatrz, oto rada schodzi nam w potrzebie,\nJeśli nie możesz jej wysnuć sam z siebie».\nA mistrz spojrzawszy weselszą powieką,\nRzekł: «Z wolna idą, zachodźmy z ich strony,\nLepsza nadzieja błyska ci w tej chwili»."
    verse: true
    chunks:
      - pl: "Zdało się, stały, snadź tak szły leniwo."
        ru: "казалось, стояли, видно, так медленно шли."
      - pl: "\nMówię do mistrza: «Podnieś twoje oczy,"
        ru: "Говорю учителю: «Подними свои глаза,"
      - pl: "\nPatrz, oto rada schodzi nam w potrzebie,"
        ru: "смотри: вот помощь сходит к нам в нужде,"
      - pl: "\nJeśli nie możesz jej wysnuć sam z siebie»."
        ru: "если ты не можешь извлечь её сам из себя»."
        note: "wysnuć — вывести, извлечь"
      - pl: "\nA mistrz spojrzawszy weselszą powieką,"
        ru: "А учитель, взглянув повеселевшим взором,"
      - pl: "\nRzekł: «Z wolna idą, zachodźmy z ich strony,"
        ru: "сказал: «Медленно идут, зайдём с их стороны,"
      - pl: "\nLepsza nadzieja błyska ci w tej chwili»."
        ru: "лучшая надежда блещет тебе в этот миг»."
    words: { "Zdało": zdac, "Podnieś": podniesc, "weselszą": wesoly, "Rzekł": rzec, "strony": strona, "nadzieja": nadzieja }
  - clean: "Duchy te były od nas tak daleko,\nChoć z tysiąc kroków jużeśmy zrobili,\nJak kamień ręką procnika rzucony.\nNad brzeg spadzisty tłum się duchów cisnął,\nStanął, jak gdyby na skale zawisnął.\n«Wybrane duchy» przemówił Wirgili:\n«Na słodki pokój zaklinam wezwaniem,\nKtóre was wszystkich jest oczekiwaniem,\nMówcie, na górę kędy się dostaniem?"
    verse: true
    chunks:
      - pl: "Duchy te były od nas tak daleko,"
        ru: "Эти духи были от нас так далеко —"
      - pl: "\nChoć z tysiąc kroków jużeśmy zrobili,"
        ru: "хоть мы уже сделали тысячу шагов, —"
      - pl: "\nJak kamień ręką procnika rzucony."
        ru: "как камень, брошенный рукой пращника."
        note: "procnik — пращник"
      - pl: "\nNad brzeg spadzisty tłum się duchów cisnął,"
        ru: "К крутому краю толпа духов прижалась,"
      - pl: "\nStanął, jak gdyby na skale zawisnął."
        ru: "остановилась, как будто повисла на скале."
        note: "spadzisty — крутой"
      - pl: "\n«Wybrane duchy» przemówił Wirgili:"
        ru: "«Избранные духи, — сказал Вергилий, —"
      - pl: "\n«Na słodki pokój zaklinam wezwaniem,"
        ru: "заклинаю вас призывом к сладкому миру,"
      - pl: "\nKtóre was wszystkich jest oczekiwaniem,"
        ru: "который есть ожидание всех вас,"
      - pl: "\nMówcie, na górę kędy się dostaniem?"
        ru: "скажите, как нам подняться на гору?"
    words: { "tysiąc": tysiac, "kamień": kamien, "brzeg": brzeg, "Stanął": stanac, "słodki": slodki, "oczekiwaniem": oczekiwac }
  - clean: "Gdzie spad pochylszy głazów i kamieni?\nSmutno czas tracić temu, kto go ceni».\nA jak gdy owce wychodzą z zagrody,\nJedna, dwie i trzy, a trzoda w tej chwili\nStoi nieśmiała, na dół głowy chyli,\nGdy pierwsza bieży, drugie lecą pędem,\nZ przodu stojące naczekują rzędem,\nCierpliwie znosząc nacisk całej trzody:\nTak z tej gromady szczęśliwej biegł żwawo\nKu nam duch pierwszy, dość skromny postawą."
    verse: true
    chunks:
      - pl: "Gdzie spad pochylszy głazów i kamieni?"
        ru: "Где склон камней и скал более пологий?"
        note: "spad — склон"
      - pl: "\nSmutno czas tracić temu, kto go ceni»."
        ru: "Печально тратить время тому, кто его ценит»."
      - pl: "\nA jak gdy owce wychodzą z zagrody,"
        ru: "А как когда овцы выходят из загона,"
      - pl: "\nJedna, dwie i trzy, a trzoda w tej chwili"
        ru: "одна, две и три, а стадо в этот миг"
      - pl: "\nStoi nieśmiała, na dół głowy chyli,"
        ru: "стоит робкое, клонит головы вниз,"
      - pl: "\nGdy pierwsza bieży, drugie lecą pędem,"
        ru: "когда первая бежит, другие несутся вскачь,"
        note: "pędem — вскачь"
      - pl: "\nZ przodu stojące naczekują rzędem,"
        ru: "стоящие спереди ждут рядом,"
        note: "naczekiwać — поджидать"
      - pl: "\nCierpliwie znosząc nacisk całej trzody:"
        ru: "терпеливо снося напор всего стада:"
      - pl: "\nTak z tej gromady szczęśliwej biegł żwawo"
        ru: "так из этой счастливой толпы бойко бежал"
      - pl: "\nKu nam duch pierwszy, dość skromny postawą."
        ru: "к нам первый дух, довольно скромный осанкой."
    words: { "ceni": cenic, "trzoda": trzoda, "nieśmiała": niesmialy, "nacisk": nacisk, "skromny": skromny, "postawą": postawa }
  - clean: "Lecz gdy spostrzegli, że ode mnie w prawo,\nJak od żyjącej w swym ciele istoty,\nŁamiący światło cień wpadał do groty,\nZa pierwszym ciżbą wstrzymali się całą,\nSami nie wiedząc, co się przed nim stało.\n— «Choć niepytany, całe wasze grono\nRęczę mym słowem, cień, co się powleka\nPo ziemi, to cień żywego człowieka."
    verse: true
    chunks:
      - pl: "Lecz gdy spostrzegli, że ode mnie w prawo,"
        ru: "Но когда они заметили, что от меня справа,"
      - pl: "\nJak od żyjącej w swym ciele istoty,"
        ru: "как от живого в своём теле существа,"
      - pl: "\nŁamiący światło cień wpadał do groty,"
        ru: "тень, преломляющая свет, падала на скалу,"
        note: "grota — здесь «скала, утёс»"
      - pl: "\nZa pierwszym ciżbą wstrzymali się całą,"
        ru: "за первым они остановились всей толпой,"
      - pl: "\nSami nie wiedząc, co się przed nim stało."
        ru: "сами не зная, что перед ним случилось."
      - pl: "\n— «Choć niepytany, całe wasze grono"
        ru: "— «Хоть меня и не спрашивают, всему вашему кругу"
      - pl: "\nRęczę mym słowem, cień, co się powleka"
        ru: "ручаюсь своим словом: тень, что стелется"
        note: "powlekać się — стелиться"
      - pl: "\nPo ziemi, to cień żywego człowieka."
        ru: "по земле, — это тень живого человека."
    words: { "istoty": istota, "wpadał": wpadac, "wstrzymali": wstrzymac, "grono": grono, "słowem": slowo, "żywego": zywy }
