# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 28
chapterTitle: "Pieśń XXVIII"
chapterTitleRu: "Песнь XXVIII. Сеятели раздора"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok IX. Siejący niezgodę. Mahomet i Bertran de Born.)"
    chunks:
      - pl: "(Krąg VIII. Tłumok IX. Siejący niezgodę. Mahomet i Bertran de Born.)"
        ru: "(Круг VIII. Ров IX. Сеятели раздора. Магомет и Бертран де Борн.)"
        note: "siać — сеять; niezgoda — раздор"
    words: { "Krąg": krag }
  - clean: "Nawet od więzów rymu w wolnej mowie,\nRaz, dwa rzecz jedną mówiąc, kto opowie\nRany, krew całą, jaka tam się leje?\nNie ma języka, co by wydał w słowie\nTo, nad czym umysł tylko się dumieje.\nGdyby zarazem zebrać w jednej chwili\nWszystkich poległych Rzymian pod Kannami,\nChcących fortunę przełamać odwagą,\nGdzie dzieląc łupy zwycięska Kartago,\nJak pisze Liwiusz, który się nie myli,\nRzymskie pierścienie mierzyła korcami;"
    verse: true
    chunks:
      - pl: "Nawet od więzów rymu w wolnej mowie,"
        ru: "Даже свободной речью, без оков рифмы,"
        note: "więzy — оковы"
      - pl: "\nRaz, dwa rzecz jedną mówiąc, kto opowie"
        ru: "по нескольку раз говоря одно и то же, кто расскажет"
      - pl: "\nRany, krew całą, jaka tam się leje?"
        ru: "раны, всю кровь, что там льётся?"
      - pl: "\nNie ma języka, co by wydał w słowie"
        ru: "Нет языка, что выразил бы в слове"
      - pl: "\nTo, nad czym umysł tylko się dumieje."
        ru: "то, над чем разум лишь недоумевает."
        note: "dumieć się — устар. «недоумевать»"
      - pl: "\nGdyby zarazem zebrać w jednej chwili"
        ru: "Если бы собрать разом в один миг"
      - pl: "\nWszystkich poległych Rzymian pod Kannami,"
        ru: "всех павших римлян при Каннах,"
        note: "polegli — павшие"
      - pl: "\nChcących fortunę przełamać odwagą,"
        ru: "хотевших переломить судьбу отвагой,"
      - pl: "\nGdzie dzieląc łupy zwycięska Kartago,"
        ru: "где, деля добычу, победоносный Карфаген,"
        note: "łupy — добыча"
      - pl: "\nJak pisze Liwiusz, który się nie myli,"
        ru: "как пишет Ливий, что не ошибается,"
      - pl: "\nRzymskie pierścienie mierzyła korcami;"
        ru: "мерил римские перстни мерами;"
        note: "korzec — мера сыпучих тел"
    words: { "leje": lac, "fortunę": fortuna, "przełamać": przelamac, "zwycięska": zwycieski, "pierścienie": pierscien, "mierzyła": mierzyc }
  - clean: "I tych, co walcząc przeciw Guiskarda,\nCzuli po cięciach, jak stal jego twarda,\nI tych, co kości jeszcze dziś zbieramy,\nPod Kaperano i Taglijakozzo,\nGdzie Konradyna, dziwo niepojęte!\nBez broni podstęp pokonał Alarda:\nWszystkie te członki skłute lub odcięte\nPatrzących mniejszą raziłyby zgrozą\nJak straszny widok tej dziewiątej jamy."
    verse: true
    chunks:
      - pl: "I tych, co walcząc przeciw Guiskarda,"
        ru: "и тех, что, сражаясь против Гвискара,"
        note: "Роберт Гвискар"
      - pl: "\nCzuli po cięciach, jak stal jego twarda,"
        ru: "чувствовали по ударам, как тверда его сталь,"
      - pl: "\nI tych, co kości jeszcze dziś zbieramy,"
        ru: "и тех, чьи кости мы ещё сегодня собираем"
      - pl: "\nPod Kaperano i Taglijakozzo,"
        ru: "под Чеперано и Тальякоццо,"
      - pl: "\nGdzie Konradyna, dziwo niepojęte!"
        ru: "где Конрадина, непостижимое чудо!"
      - pl: "\nBez broni podstęp pokonał Alarda:"
        ru: "без оружия хитрость одолела Аларда:"
        note: "podstęp — хитрость; Алар де Валери"
      - pl: "\nWszystkie te członki skłute lub odcięte"
        ru: "все эти члены, исколотые или отрубленные,"
      - pl: "\nPatrzących mniejszą raziłyby zgrozą"
        ru: "смотрящих поразили бы меньшим ужасом,"
      - pl: "\nJak straszny widok tej dziewiątej jamy."
        ru: "чем страшный вид этой девятой ямы."
    words: { "cięciach": ciecie, "stal": stal, "twarda": twardy, "podstęp": podstep, "odcięte": odciac, "jamy": jama }
  - clean: "Z dziurawej kadzi mniej wina wyciecze,\nIle krwi ciekło z rozciętego ducha,\nOd samej brody aż poniżej brzucha;\nZ kolan drgające zwisały jelita;\nWidziałem serce, część wnętrza okryta\nRaziła oczy czerwonością nagą."
    verse: true
    chunks:
      - pl: "Z dziurawej kadzi mniej wina wyciecze,"
        ru: "Из дырявой бочки меньше вина вытечет,"
        note: "kadź — чан, бочка; wyciec — вытечь"
      - pl: "\nIle krwi ciekło z rozciętego ducha,"
        ru: "чем крови текло из рассечённого духа,"
      - pl: "\nOd samej brody aż poniżej brzucha;"
        ru: "от самого подбородка до низа живота;"
      - pl: "\nZ kolan drgające zwisały jelita;"
        ru: "с колен свисали трепещущие кишки;"
        note: "drgający — трепещущий; jelito — кишка"
      - pl: "\nWidziałem serce, część wnętrza okryta"
        ru: "я видел сердце, часть открытого нутра"
      - pl: "\nRaziła oczy czerwonością nagą."
        ru: "поражала глаза голой краснотой."
    words: { "poniżej": ponizej, "brzucha": brzuch, "kolan": kolano, "jelita": jelito, "wnętrza": wnetrze, "nagą": nagi }
  - clean: "Podczas gdym jego oglądał z uwagą,\nSpojrzał, rękoma pierś rozdarł i rzecze:\n«Patrz, ja, Mahomed, jak siebie kaleczę!\nPrzede mną Ali cały we łzach kroczy,\nTwarz mu po czaszkę jedna rana broczy;\nSzatan tu stoi i z naszej gromady\nKażdego bierze na ostrze swej szpady;\nGdy kończym obrót swej bolesnej drogi,\nTu choć najszersza zamyka się rana\nW chwili, gdy stajem przed mieczem szatana."
    verse: true
    chunks:
      - pl: "Podczas gdym jego oglądał z uwagą,"
        ru: "Пока я его разглядывал со вниманием,"
      - pl: "\nSpojrzał, rękoma pierś rozdarł i rzecze:"
        ru: "он взглянул, руками разодрал грудь и говорит:"
      - pl: "\n«Patrz, ja, Mahomed, jak siebie kaleczę!"
        ru: "«Смотри, я, Магомет, как я себя калечу!"
      - pl: "\nPrzede mną Ali cały we łzach kroczy,"
        ru: "Передо мной Али, весь в слезах, шагает,"
      - pl: "\nTwarz mu po czaszkę jedna rana broczy;"
        ru: "лицо ему до черепа одна рана заливает кровью;"
      - pl: "\nSzatan tu stoi i z naszej gromady"
        ru: "дьявол стоит здесь и из нашей толпы"
      - pl: "\nKażdego bierze na ostrze swej szpady;"
        ru: "каждого берёт на остриё своей шпаги;"
        note: "szpada — шпага"
      - pl: "\nGdy kończym obrót swej bolesnej drogi,"
        ru: "когда мы кончаем оборот своего мучительного пути,"
      - pl: "\nTu choć najszersza zamyka się rana"
        ru: "здесь даже самая широкая рана закрывается"
      - pl: "\nW chwili, gdy stajem przed mieczem szatana."
        ru: "в тот миг, когда мы предстаём перед мечом дьявола."
    words: { "rzecze": rzec, "Szatan": szatan, "ostrze": ostrze, "obrót": obrot, "bolesnej": bolesny, "najszersza": szeroki }
  - clean: "Lecz ty, kto jesteś, co stoisz bez trwogi?\nMoże niedługo skoczysz z tej wyżyny,\nGdzie ciebie strącą twoje własne winy?»\n— «On nieumarły, nie lżyj go bezkarnie!\nOn nie na męki wstąpił w wasze progi,\nLecz aby wszystkie tu poznał męczarnie:\nZmarły żywego, po nowej mu drodze,\nPrzez całe piekło z wyższej woli wodzę»."
    verse: true
    chunks:
      - pl: "Lecz ty, kto jesteś, co stoisz bez trwogi?"
        ru: "Но ты, кто ты, что стоишь без страха?"
      - pl: "\nMoże niedługo skoczysz z tej wyżyny,"
        ru: "Может, вскоре прыгнешь с этой высоты,"
      - pl: "\nGdzie ciebie strącą twoje własne winy?»"
        ru: "куда тебя низвергнут твои собственные вины?»"
      - pl: "\n— «On nieumarły, nie lżyj go bezkarnie!"
        ru: "— «Он неумерший, не хули его безнаказанно!"
        note: "lżyć — поносить, хулить"
      - pl: "\nOn nie na męki wstąpił w wasze progi,"
        ru: "Он не на муки вступил в ваши пределы,"
      - pl: "\nLecz aby wszystkie tu poznał męczarnie:"
        ru: "а чтобы узнать здесь все мучения:"
      - pl: "\nZmarły żywego, po nowej mu drodze,"
        ru: "я, мёртвый, живого по новой для него дороге"
      - pl: "\nPrzez całe piekło z wyższej woli wodzę»."
        ru: "вожу через весь ад по высшей воле»."
    words: { "skoczysz": skoczyc, "bezkarnie": bezkarnie, "wstąpił": wstapic, "progi": prog, "Zmarły": zmarly, "wodzę": wodzic }
  - clean: "Mistrz rzekł i dodał: «Prawdzie nie skłamałem».\nA na dnie jamy wszyscy potępieńce\nStanęli, patrzą na mnie gronem całem,\nZapominając z podziwu o męce.\n— «Jak ujrzysz słońce, powiedz Dulcynowi\nJeśli tu prędko zstąpić nieochoczy,\nNiech skupi żywność, śniegiem się otoczy;\nBo jak ci mówię, bez śniegu i głodu,\nNowarczyk w górach niełatwo go złowi»."
    verse: true
    chunks:
      - pl: "Mistrz rzekł i dodał: «Prawdzie nie skłamałem»."
        ru: "Учитель сказал и добавил: «Я не солгал правде»."
      - pl: "\nA na dnie jamy wszyscy potępieńce"
        ru: "А на дне ямы все осуждённые"
      - pl: "\nStanęli, patrzą na mnie gronem całem,"
        ru: "остановились, смотрят на меня всем сборищем,"
      - pl: "\nZapominając z podziwu o męce."
        ru: "от изумления забыв о муке."
      - pl: "\n— «Jak ujrzysz słońce, powiedz Dulcynowi"
        ru: "— «Когда увидишь солнце, скажи Дольчино,"
        note: "фра Дольчино, вождь еретиков"
      - pl: "\nJeśli tu prędko zstąpić nieochoczy,"
        ru: "если он не охоч вскоре сюда спуститься,"
        note: "nieochoczy — неохочий"
      - pl: "\nNiech skupi żywność, śniegiem się otoczy;"
        ru: "пусть запасёт пищу, окружит себя снегом;"
      - pl: "\nBo jak ci mówię, bez śniegu i głodu,"
        ru: "ибо, как я тебе говорю, без снега и голода"
      - pl: "\nNowarczyk w górach niełatwo go złowi»."
        ru: "новарцу в горах нелегко его поймать»."
        note: "Nowarczyk — новарец"
    words: { "skłamałem": sklamac, "gronem": grono, "ujrzysz": ujrzec, "żywność": zywnosc, "śniegiem": snieg, "niełatwo": nielatwo }
  - clean: "Tak z podniesioną stopą do pochodu,\nDuch Mahometa mówił, potem nogę\nNa dłuż prostując poszedł w swoją drogę.\nDuch drugi z krtanią przebitą, kaleki,\nZ nosem rozciętym pod same powieki,\nI z jednym uchem od lewego oka,\nStanął, z nim całe wstrzymało się grono:\nDuch patrząc na mnie z twarzą zadziwioną,\nOtworzył gębę jak jamę czerwoną,\nKtórą broczyła świeża krwi posoka,\nI rzekł: «Schodzący tu gościu bez winy,\nJeśli nie ludzi wielkie podobieństwo,\nWidziałem ciebie pomiędzy Latyny."
    verse: true
    chunks:
      - pl: "Tak z podniesioną stopą do pochodu,"
        ru: "Так, с поднятой для шага ногой,"
      - pl: "\nDuch Mahometa mówił, potem nogę"
        ru: "дух Магомета говорил, потом ногу"
      - pl: "\nNa dłuż prostując poszedł w swoją drogę."
        ru: "выпрямив в длину, пошёл своей дорогой."
      - pl: "\nDuch drugi z krtanią przebitą, kaleki,"
        ru: "Другой дух, с проколотой гортанью, калека,"
        note: "krtań — гортань"
      - pl: "\nZ nosem rozciętym pod same powieki,"
        ru: "с носом, рассечённым до самых век,"
      - pl: "\nI z jednym uchem od lewego oka,"
        ru: "и с одним ухом у левого глаза,"
      - pl: "\nStanął, z nim całe wstrzymało się grono:"
        ru: "остановился, с ним остановилась вся толпа:"
      - pl: "\nDuch patrząc na mnie z twarzą zadziwioną,"
        ru: "дух, глядя на меня с изумлённым лицом,"
      - pl: "\nOtworzył gębę jak jamę czerwoną,"
        ru: "открыл рот, как красную яму,"
      - pl: "\nKtórą broczyła świeża krwi posoka,"
        ru: "которую заливала свежая кровь,"
      - pl: "\nI rzekł: «Schodzący tu gościu bez winy,"
        ru: "и сказал: «Гость, сходящий сюда без вины,"
      - pl: "\nJeśli nie ludzi wielkie podobieństwo,"
        ru: "если меня не обманывает большое сходство людей,"
      - pl: "\nWidziałem ciebie pomiędzy Latyny."
        ru: "я видел тебя среди латинян."
    words: { "przebitą": przebic, "wstrzymało": wstrzymac, "gębę": geba, "świeża": swiezy, "Schodzący": schodzic, "podobieństwo": podobienstwo }
  - clean: "Przypomnij sobie Piotra z Medicyny!\nIdąc z Wercelli smugiem do Markabo\nOstrzeż ode mnie dwóch najlepszych z Fano,\nAndziolello i Gwido ich miano,\nŻe niespodziane czeka ich męczeństwo.\nGdy zmysł proroczy widzi tu niesłabo,\nWrzucą ich w morze w porcie Katoliki;\nBo od Majorki do Cypru zatoki\nNeptun nie widział nigdy takiej zbrodni,\nGdzie wciąż koczują greckie rozbójniki."
    verse: true
    chunks:
      - pl: "Przypomnij sobie Piotra z Medicyny!"
        ru: "Вспомни Пьера да Медичину!"
      - pl: "\nIdąc z Wercelli smugiem do Markabo"
        ru: "Идя из Верчелли долиной до Маркабо,"
        note: "smug — долина, полоса"
      - pl: "\nOstrzeż ode mnie dwóch najlepszych z Fano,"
        ru: "предостереги от меня двух лучших из Фано,"
      - pl: "\nAndziolello i Gwido ich miano,"
        ru: "Анджолелло и Гвидо их имена,"
      - pl: "\nŻe niespodziane czeka ich męczeństwo."
        ru: "что их ждёт нежданное мучение."
      - pl: "\nGdy zmysł proroczy widzi tu niesłabo,"
        ru: "Если пророческий взор здесь видит небезошибочно,"
        note: "niesłabo — не слабо, верно"
      - pl: "\nWrzucą ich w morze w porcie Katoliki;"
        ru: "их бросят в море у порта Каттолика;"
      - pl: "\nBo od Majorki do Cypru zatoki"
        ru: "ибо от Майорки до кипрского залива"
      - pl: "\nNeptun nie widział nigdy takiej zbrodni,"
        ru: "Нептун не видал никогда такого злодеяния,"
      - pl: "\nGdzie wciąż koczują greckie rozbójniki."
        ru: "где всё кочуют греческие разбойники."
    words: { "Ostrzeż": ostrzec, "zmysł": zmysl, "Wrzucą": wrzucic, "porcie": port, "zatoki": zatoka, "greckie": grecki }
  - clean: "Zdrajca rządzący, chociaż jednooki,\nKrajem, którego duch, co za mną kroczy,\nNie chciałby nigdy widzieć w żywe oczy,\nSprosi ich w gości, zdradzi najniegodniej,\nCzym ich uwolni od ślubów ofiary\nPrzeciw wiejącym wiatrom od Fokary»."
    verse: true
    chunks:
      - pl: "Zdrajca rządzący, chociaż jednooki,"
        ru: "Предатель, правящий, хоть и одноглазый,"
        note: "Малатестино"
      - pl: "\nKrajem, którego duch, co za mną kroczy,"
        ru: "краем, который дух, что идёт за мной,"
      - pl: "\nNie chciałby nigdy widzieć w żywe oczy,"
        ru: "не хотел бы никогда видеть воочию,"
      - pl: "\nSprosi ich w gości, zdradzi najniegodniej,"
        ru: "пригласит их в гости, предаст недостойнейше,"
      - pl: "\nCzym ich uwolni od ślubów ofiary"
        ru: "чем освободит их от обетов жертвы"
        note: "то есть молитв о защите"
      - pl: "\nPrzeciw wiejącym wiatrom od Fokary»."
        ru: "против ветров, дующих с Фокары»."
        note: "Фокара — мыс, опасный для мореходов"
    words: { "Zdrajca": zdrajca, "żywe": zywy, "zdradzi": zdradzic, "uwolni": uwolnic, "ślubów": slub, "wiatrom": wiatr }
  - clean: "— «Gdy chcesz,» odrzekłem, «abym tam wysoko\nMówił o tobie w twoim ziemskim raju,\nKto ten nieszczęsny, wskaż mi go na oko,\nKtóremu było tak gorzko w tym kraju?»\nDo towarzysza duch wyciągnął rękę,\nNa oścież jemu otwierając szczękę,\nKrzyczał: «Patrz teraz, to on, lecz nie mówi:\nOn myśl wątpiącą uśpił Cezarowi,\nTwierdząc, że zawsze niebezpiecznie czekać,\nZamiar dojrzały do czynu odwlekać»."
    verse: true
    chunks:
      - pl: "— «Gdy chcesz,» odrzekłem, «abym tam wysoko"
        ru: "— «Если хочешь, — ответил я, — чтобы я там, наверху,"
      - pl: "\nMówił o tobie w twoim ziemskim raju,"
        ru: "говорил о тебе в твоём земном раю,"
      - pl: "\nKto ten nieszczęsny, wskaż mi go na oko,"
        ru: "кто этот несчастный, укажи мне его воочию,"
      - pl: "\nKtóremu było tak gorzko w tym kraju?»"
        ru: "кому было так горько в той земле?»"
      - pl: "\nDo towarzysza duch wyciągnął rękę,"
        ru: "Дух протянул руку к товарищу,"
      - pl: "\nNa oścież jemu otwierając szczękę,"
        ru: "настежь открывая ему челюсть,"
        note: "na oścież — настежь"
      - pl: "\nKrzyczał: «Patrz teraz, to on, lecz nie mówi:"
        ru: "кричал: «Смотри теперь, это он, но не говорит:"
      - pl: "\nOn myśl wątpiącą uśpił Cezarowi,"
        ru: "он усыпил сомневающуюся мысль Цезаря,"
      - pl: "\nTwierdząc, że zawsze niebezpiecznie czekać,"
        ru: "утверждая, что всегда опасно медлить,"
      - pl: "\nZamiar dojrzały do czynu odwlekać»."
        ru: "откладывать созревший замысел до дела»."
        note: "odwlekać — откладывать"
    words: { "ziemskim": ziemski, "raju": raj, "wskaż": wskazac, "szczękę": szczeka, "niebezpiecznie": niebezpiecznie, "czynu": czyn }
  - clean: "Jakże przeraził mnie wrażeniem dzikiem,\nZe swoim w krtani uciętym językiem,\nTen Kurion niegdyś tak zuchwały w mowie.\nDuch drugi obie miał ucięte ręce,\nW zmroku wywijał tępymi ramiony.\nKrwią, co z nich ciekła, cały oczerniony,\nI krzyknął, krzyk ten aż mi szumiał w głowie:\n«Przypomnij Moskę, przebóg, ja to rzekłem:\n»Koniec koroną powinien być czynów!«\nZ tych słów urosły kłótnie florentynów»."
