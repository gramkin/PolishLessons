      - pl: "\nW zmroku wywijał tępymi ramiony."
        ru: "во мраке размахивал тупыми обрубками,"
        note: "wywijać — размахивать"
      - pl: "\nKrwią, co z nich ciekła, cały oczerniony,"
        ru: "весь зачернённый кровью, что из них текла,"
      - pl: "\nI krzyknął, krzyk ten aż mi szumiał w głowie:"
        ru: "и крикнул, крик этот так и шумел у меня в голове:"
      - pl: "\n«Przypomnij Moskę, przebóg, ja to rzekłem:"
        ru: "«Вспомни Моску, ей-богу, это я сказал:"
