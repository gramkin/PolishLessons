      - pl: "\nOdszedł jak gdyby już oszalał w męce."
        ru: "ушёл, словно уже обезумел в муке."
      - pl: "\nJa wciąż na trzodę piekielną patrzałem;"
        ru: "Я всё смотрел на адское стадо;"
      - pl: "\nI to widziałem, czego bez dowodu"
        ru: "и видел я то, чего без доказательства"
      - pl: "\nNie śmiałbym w pieśni opowiadać mojej,"
        ru: "не посмел бы рассказывать в моей песни,"
      - pl: "\nGdyby nie dobry nasz świadek, sumienie,"
        ru: "если бы не наш добрый свидетель, совесть,"
      - pl: "\nKtóre pod zbroją nam czystości swojej"
        ru: "что под бронёй своей чистоты"
        note: "zbroja — броня"
      - pl: "\nSerce umacnia, zagłusza zwątpienie."
