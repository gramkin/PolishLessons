  - clean: "Westerplatte było niewielkim półwyspem przy wejściu do portu gdańskiego, gdzie Polska miała prawo utrzymywać składnicę amunicji. Broniło go około dwustu żołnierzy pod dowództwem majora Henryka Sucharskiego. Planowano, że wytrzymają kilkanaście godzin. Bronili się przez siedem dni, mimo ostrzału z pancernika, ataków piechoty i nalotów bombowców. Codziennie o świcie Polskie Radio podawało, że Westerplatte broni się nadal, a wiadomość ta podnosiła na duchu cały kraj. 7 września obrońcy, którzy nie mieli już wody ani lekarstw dla rannych, złożyli broń."
    draft: true
    chunks:
      - pl: "Westerplatte było niewielkim półwyspem przy wejściu do portu gdańskiego, gdzie Polska miała prawo utrzymywać składnicę amunicji."
        ru: "Вестерплатте было небольшим полуостровом у входа в гданьский порт, где Польша имела право держать склад боеприпасов."
      - pl: " Broniło go około dwustu żołnierzy pod dowództwem majora Henryka Sucharskiego."
        ru: "Его обороняли около двухсот солдат под командованием майора Генрика Сухарского."
      - pl: " Planowano, że wytrzymają kilkanaście godzin."
        ru: "Планировалось, что они продержатся около полусуток."
      - pl: " Bronili się przez siedem dni, mimo ostrzału z pancernika, ataków piechoty i nalotów bombowców."
        ru: "Они оборонялись семь дней, несмотря на обстрел с линкора, атаки пехоты и налёты бомбардировщиков."
        note: "nalot — налёт"
      - pl: " Codziennie o świcie Polskie Radio podawało, że Westerplatte broni się nadal, a wiadomość ta podnosiła na duchu cały kraj."
        ru: "Каждый день на рассвете Польское радио сообщало, что Вестерплатте всё ещё обороняется, и эта весть поднимала дух всей страны."
        note: "podnosić na duchu — поднимать дух"
