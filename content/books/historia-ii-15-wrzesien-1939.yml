  - clean: "Niemcy stosowali nową taktykę, nazwaną później wojną błyskawiczną. Kolumny pancerne przełamywały front w kilku miejscach i szybko posuwały się w głąb kraju, a lotnictwo niszczyło mosty, linie kolejowe i lotniska. Wbrew późniejszej legendzie polskie lotnictwo nie zostało zniszczone na ziemi pierwszego dnia, bo samoloty przeniesiono wcześniej na polowe lotniska. Polscy piloci zestrzelili w ciągu kilku tygodni ponad sto samolotów niemieckich. Fałszywa jest też legenda o polskich ułanach, którzy szarżowali z szablami na czołgi. Pod Krojantami 1 września ułani rozbili szarżą batalion niemieckiej piechoty, a dopiero potem wpadli pod ogień samochodów pancernych, co niemiecka propaganda przedstawiła jako atak na czołgi."
    draft: true
    chunks:
      - pl: "Niemcy stosowali nową taktykę, nazwaną później wojną błyskawiczną."
        ru: "Немцы применяли новую тактику, позже названную молниеносной войной."
        note: "błyskawiczny — молниеносный"
      - pl: " Kolumny pancerne przełamywały front w kilku miejscach i szybko posuwały się w głąb kraju, a lotnictwo niszczyło mosty, linie kolejowe i lotniska."
        ru: "Танковые колонны прорывали фронт в нескольких местах и быстро продвигались вглубь страны, а авиация разрушала мосты, железные дороги и аэродромы."
