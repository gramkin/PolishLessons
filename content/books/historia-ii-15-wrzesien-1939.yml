  - clean: "Wieczorem 31 sierpnia esesmani przebrani w polskie mundury napadli na niemiecką radiostację w Gliwicach. Nadali krótki komunikat po polsku i zostawili na miejscu ciało zamordowanego więźnia, ubranego w cywilne ubranie. Prowokacja miała przekonać świat, że to Polska zaatakowała Niemcy."
    draft: true
    chunks:
      - pl: "Wieczorem 31 sierpnia esesmani przebrani w polskie mundury napadli na niemiecką radiostację w Gliwicach."
        ru: "Вечером 31 августа эсэсовцы, переодетые в польскую форму, напали на немецкую радиостанцию в Гливице."
        note: "esesman — эсэсовец"
      - pl: " Nadali krótki komunikat po polsku i zostawili na miejscu ciało zamordowanego więźnia, ubranego w cywilne ubranie."
        ru: "Они передали короткое сообщение по-польски и оставили на месте тело убитого заключённого в гражданской одежде."
      - pl: " Prowokacja miała przekonać świat, że to Polska zaatakowała Niemcy."
        ru: "Провокация должна была убедить мир, что это Польша напала на Германию."
        note: "prowokacja — провокация"
    words: { "sierpnia": sierpien, "przebrani": przebrac, "polskie": polski, "mundury": mundur, "napadli": napasc, "niemiecką": niemiecki, "Nadali": nadac, "więźnia": wiezien, "cywilne": cywilny }
  - clean: "1 września 1939 roku przed świtem wojska niemieckie przekroczyły polską granicę od zachodu, północy i południa. O świcie pancernik szkolny „Schleswig-Holstein”, który przypłynął do Gdańska z rzekomo przyjacielską wizytą, otworzył ogień do polskiej składnicy wojskowej na Westerplatte. W pierwszych minutach wojny niemieckie samoloty zbombardowały też małe miasteczko Wieluń, w którym nie było żadnych jednostek wojskowych. Zniszczono szpital, kościół i większą część centrum, a zginęło wielu mieszkańców. Wieluń był jednym z pierwszych miast, na których Niemcy pokazali, że ta wojna będzie wojną także przeciwko cywilom. Rano prezydent Mościcki ogłosił przez radio, że nieprzyjaciel napadł na Polskę, i wezwał naród do obrony."
    draft: true
    chunks:
      - pl: "1 września 1939 roku przed świtem wojska niemieckie przekroczyły polską granicę od zachodu, północy i południa."
        ru: "1 сентября 1939 года перед рассветом германские войска перешли польскую границу с запада, севера и юга."
        note: "świt — рассвет"
      - pl: " O świcie pancernik szkolny „Schleswig-Holstein”, który przypłynął do Gdańska z rzekomo przyjacielską wizytą, otworzył ogień do polskiej składnicy wojskowej na Westerplatte."
        ru: "На рассвете учебный линкор «Шлезвиг-Гольштейн», прибывший в Гданьск якобы с дружеским визитом, открыл огонь по польскому военному складу на Вестерплатте."
        note: "składnica — склад"
      - pl: " W pierwszych minutach wojny niemieckie samoloty zbombardowały też małe miasteczko Wieluń, w którym nie było żadnych jednostek wojskowych."
        ru: "В первые минуты войны немецкие самолёты разбомбили также маленький городок Велюнь, в котором не было никаких воинских частей."
      - pl: " Zniszczono szpital, kościół i większą część centrum, a zginęło wielu mieszkańców."
        ru: "Были разрушены больница, костёл и большая часть центра, а погибло много жителей."
      - pl: " Wieluń był jednym z pierwszych miast, na których Niemcy pokazali, że ta wojna będzie wojną także przeciwko cywilom."
        ru: "Велюнь стал одним из первых городов, на которых немцы показали, что эта война будет войной и против мирного населения."
      - pl: " Rano prezydent Mościcki ogłosił przez radio, że nieprzyjaciel napadł na Polskę, i wezwał naród do obrony."
        ru: "Утром президент Мосцицкий объявил по радио, что враг напал на Польшу, и призвал народ к обороне."
        note: "nieprzyjaciel — враг, неприятель"
