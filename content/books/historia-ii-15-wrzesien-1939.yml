  - clean: "Siły obu stron były bardzo nierówne. Niemcy rzuciły przeciwko Polsce około półtora miliona żołnierzy, ponad dwa i pół tysiąca czołgów i prawie dwa tysiące samolotów. Polska zdołała zmobilizować niecały milion żołnierzy, miała kilkaset czołgów, w większości lekkich, i kilkaset samolotów, z których wiele było przestarzałych. Polska granica z Niemcami była bardzo długa, bo po zajęciu Czech i Słowacji Niemcy otaczały Polskę z trzech stron. Polskie dowództwo postanowiło bronić granic, żeby nie oddać bez walki przemysłowych regionów kraju, i rozciągnęło wojska na długiej linii."
