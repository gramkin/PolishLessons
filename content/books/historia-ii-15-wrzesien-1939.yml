        ru: "Несколько десятков почтовых работников больше десяти часов отбивали атаки полиции и отрядов СС, пока немцы не подожгли здание."
        note: "pocztowiec — почтовый работник"
      - pl: " Ci, którzy przeżyli, zostali skazani przez sąd wojskowy jako partyzanci i rozstrzelani w październiku."
        ru: "Выживших военный суд приговорил как партизан, и в октябре они были расстреляны."
