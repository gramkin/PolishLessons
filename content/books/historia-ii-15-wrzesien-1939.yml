  - clean: "W samym Gdańsku 1 września bronili się także pracownicy Poczty Polskiej. Kilkudziesięciu pocztowców przez kilkanaście godzin odpierało ataki policji i oddziałów SS, aż Niemcy podpalili budynek. Ci, którzy przeżyli, zostali skazani przez sąd wojskowy jako partyzanci i rozstrzelani w październiku. Dopiero w 1998 roku sąd w Niemczech uchylił ten wyrok jako bezprawny. Wśród obrońców poczty był kuzyn matki Güntera Grassa, a pisarz opisał tę historię w powieści „Blaszany bębenek”. Na Westerplatte stoi dziś pomnik obrońców, a co roku 1 września o świcie odbywają się tam uroczystości rocznicowe."
    draft: true
