  - clean: "O istnieniu tajnego protokołu Polacy nie wiedzieli, ale rozumieli, że pakt oznacza wojnę. Hitler nie musiał się już obawiać, że będzie walczył na dwa fronty, jak Niemcy w pierwszej wojnie światowej. Związek Radziecki przez pół wieku zaprzeczał, że protokół istniał, i przyznał to dopiero w 1989 roku. 25 sierpnia Wielka Brytania zawarła z Polską formalny sojusz, co skłoniło Hitlera do przesunięcia ataku o kilka dni. Pod naciskiem sojuszników Polska odwołała ogłoszoną już powszechną mobilizację i ogłosiła ją ponownie dopiero 30 sierpnia. Sojusznicy obawiali się, że mobilizacja sprowokuje Hitlera, ale w rezultacie wielu żołnierzy nie zdążyło dotrzeć do swoich jednostek przed wybuchem wojny."
    draft: true
    chunks:
      - pl: "O istnieniu tajnego protokołu Polacy nie wiedzieli, ale rozumieli, że pakt oznacza wojnę."
        ru: "О существовании секретного протокола поляки не знали, но понимали, что пакт означает войну."
      - pl: " Hitler nie musiał się już obawiać, że będzie walczył na dwa fronty, jak Niemcy w pierwszej wojnie światowej."
        ru: "Гитлеру больше не нужно было опасаться войны на два фронта, как Германии в Первую мировую."
      - pl: " Związek Radziecki przez pół wieku zaprzeczał, że protokół istniał, i przyznał to dopiero w 1989 roku."
        ru: "Советский Союз полвека отрицал существование протокола и признал его только в 1989 году."
        note: "zaprzeczać — отрицать"
      - pl: " 25 sierpnia Wielka Brytania zawarła z Polską formalny sojusz, co skłoniło Hitlera do przesunięcia ataku o kilka dni."
        ru: "25 августа Великобритания заключила с Польшей официальный союз, что побудило Гитлера перенести нападение на несколько дней."
        note: "skłonić — побудить"
      - pl: " Pod naciskiem sojuszników Polska odwołała ogłoszoną już powszechną mobilizację i ogłosiła ją ponownie dopiero 30 sierpnia."
        ru: "Под давлением союзников Польша отменила уже объявленную всеобщую мобилизацию и объявила её снова только 30 августа."
        note: "odwołać — отменить"
      - pl: " Sojusznicy obawiali się, że mobilizacja sprowokuje Hitlera, ale w rezultacie wielu żołnierzy nie zdążyło dotrzeć do swoich jednostek przed wybuchem wojny."
        ru: "Союзники опасались, что мобилизация спровоцирует Гитлера, но в результате многие солдаты не успели добраться до своих частей до начала войны."
        note: "jednostka — (воинская) часть"
