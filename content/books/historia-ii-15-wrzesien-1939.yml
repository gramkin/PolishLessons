paragraphs:
  - clean: "23 sierpnia 1939 roku świat obiegła zaskakująca wiadomość. W Moskwie ministrowie spraw zagranicznych Niemiec i Związku Radzieckiego, Joachim von Ribbentrop i Wiaczesław Mołotow, podpisali pakt o nieagresji. Dwa państwa, które jeszcze niedawno nazywały się nawzajem największymi wrogami, nagle stały się partnerami. Do paktu dołączono tajny protokół, w którym oba państwa podzieliły między siebie Europę Wschodnią. Granica stref wpływów miała przebiegać przez środek Polski, wzdłuż Narwi, Wisły i Sanu."
    draft: true
    chunks:
      - pl: "23 sierpnia 1939 roku świat obiegła zaskakująca wiadomość."
        ru: "23 августа 1939 года мир облетела неожиданная новость."
      - pl: " W Moskwie ministrowie spraw zagranicznych Niemiec i Związku Radzieckiego, Joachim von Ribbentrop i Wiaczesław Mołotow, podpisali pakt o nieagresji."
        ru: "В Москве министры иностранных дел Германии и Советского Союза, Иоахим фон Риббентроп и Вячеслав Молотов, подписали пакт о ненападении."
      - pl: " Dwa państwa, które jeszcze niedawno nazywały się nawzajem największymi wrogami, nagle stały się partnerami."
        ru: "Два государства, которые ещё недавно называли друг друга злейшими врагами, внезапно стали партнёрами."
      - pl: " Do paktu dołączono tajny protokół, w którym oba państwa podzieliły między siebie Europę Wschodnią."
        ru: "К пакту был приложен секретный протокол, в котором оба государства поделили между собой Восточную Европу."
        note: "protokół — протокол"
      - pl: " Granica stref wpływów miała przebiegać przez środek Polski, wzdłuż Narwi, Wisły i Sanu."
        ru: "Граница сфер влияния должна была проходить через середину Польши, по Нареву, Висле и Сану."
