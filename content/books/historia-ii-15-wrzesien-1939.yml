        ru: "Силы сторон были очень неравны."
      - pl: " Niemcy rzuciły przeciwko Polsce około półtora miliona żołnierzy, ponad dwa i pół tysiąca czołgów i prawie dwa tysiące samolotów."
        ru: "Германия бросила против Польши около полутора миллионов солдат, больше двух с половиной тысяч танков и почти две тысячи самолётов."
        note: "czołg — танк"
      - pl: " Polska zdołała zmobilizować niecały milion żołnierzy, miała kilkaset czołgów, w większości lekkich, i kilkaset samolotów, z których wiele było przestarzałych."
        ru: "Польша сумела мобилизовать меньше миллиона солдат, у неё было несколько сотен танков, в основном лёгких, и несколько сотен самолётов, многие из которых устарели."
        note: "przestarzały — устаревший"
      - pl: " Polska granica z Niemcami była bardzo długa, bo po zajęciu Czech i Słowacji Niemcy otaczały Polskę z trzech stron."
        ru: "Польская граница с Германией была очень длинной, потому что после захвата Чехии и Словакии Германия окружала Польшу с трёх сторон."
