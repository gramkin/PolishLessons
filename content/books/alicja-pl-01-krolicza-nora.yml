  - clean: "Wkrótce jej wzrok padł na małe szklane pudełko leżące pod stolikiem: otworzyła je i znalazła w nim bardzo małe ciastko, na którym pięknie wypisano porzeczkami słowa „ZJEDZ MNIE”. „No dobrze, zjem je”, powiedziała Alicja, „i jeśli urosnę, sięgnę po klucz, a jeśli zmaleję, przecisnę się pod drzwiczkami. Tak czy inaczej dostanę się do ogrodu i wszystko mi jedno, co się stanie!”"
