  - clean: "„No już, nie ma sensu tak płakać!”, powiedziała sobie Alicja dość ostro. „Radzę ci przestać w tej chwili!” Zwykle dawała sobie bardzo dobre rady (choć bardzo rzadko się do nich stosowała), a czasem łajała się tak surowo, że aż łzy stawały jej w oczach. Raz, jak pamiętała, próbowała wytargać się za uszy za to, że oszukiwała samą siebie w krokieta, w którego grała sama ze sobą — to dziwne dziecko bardzo lubiło bowiem udawać dwie osoby naraz. „Ale teraz nie ma sensu udawać dwóch osób!”, pomyślała biedna Alicja. „Przecież zostało mnie ledwie tyle, żeby wystarczyło na jedną porządną osobę!”"
    en: "“Come, there’s no use in crying like that!” said Alice to herself, rather sharply; “I advise you to leave off this minute!” She generally gave herself very good advice, (though she very seldom followed it), and sometimes she scolded herself so severely as to bring tears into her eyes; and once she remembered trying to box her own ears for having cheated herself in a game of croquet she was playing against herself, for this curious child was very fond of pretending to be two people. “But it’s no use now,” thought poor Alice, “to pretend to be two people! Why, there’s hardly enough of me left to make _one_ respectable person!”"
