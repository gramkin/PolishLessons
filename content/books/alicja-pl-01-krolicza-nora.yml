  - clean: "Czekanie przy drzwiczkach nie miało chyba sensu, wróciła więc do stolika, po trosze mając nadzieję, że znajdzie na nim kolejny klucz albo przynajmniej podręcznik dla ludzi, którzy chcą składać się jak teleskopy. Tym razem znalazła na nim małą buteleczkę („której z pewnością wcześniej tu nie było”, powiedziała Alicja), a na szyjce butelki wisiała papierowa etykietka z pięknie wydrukowanym dużymi literami napisem „WYPIJ MNIE”."
    en: "There seemed to be no use in waiting by the little door, so she went back to the table, half hoping she might find another key on it, or at any rate a book of rules for shutting people up like telescopes: this time she found a little bottle on it, (“which certainly was not here before,” said Alice,) and round the neck of the bottle was a paper label, with the words “DRINK ME,” beautifully printed on it in large letters."
