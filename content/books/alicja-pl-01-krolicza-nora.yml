  - clean: "Alicja wcale się nie potłukła i w jednej chwili zerwała się na nogi. Spojrzała w górę, ale nad głową było zupełnie ciemno; przed nią ciągnął się kolejny długi korytarz, a Biały Królik wciąż był widoczny — biegł nim w pośpiechu. Nie było chwili do stracenia: Alicja pomknęła jak wiatr i zdążyła jeszcze usłyszeć, jak Królik mówi, skręcając za róg: „Na moje uszy i wąsy, ale się robi późno!” Była tuż za nim, gdy sama skręciła, ale Królika nigdzie już nie było: znalazła się w długiej, niskiej sali oświetlonej rzędem lamp zwisających z sufitu."
    en: "Alice was not a bit hurt, and she jumped up on to her feet in a moment: she looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it. There was not a moment to be lost: away went Alice like the wind, and was just in time to hear it say, as it turned a corner, “Oh my ears and whiskers, how late it’s getting!” She was close behind it when she turned the corner, but the Rabbit was no longer to be seen: she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof."
