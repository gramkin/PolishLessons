  - clean: "Alicja otworzyła drzwiczki i zobaczyła, że prowadzą do wąskiego przejścia, niewiele większego od szczurzej nory. Uklękła i spojrzała wzdłuż niego — w głębi był najpiękniejszy ogród, jaki można sobie wyobrazić. Jakże pragnęła wyjść z tej ciemnej sali i pospacerować wśród rabat jasnych kwiatów i chłodnych fontann, ale nie mogła przecisnąć przez drzwiczki nawet głowy. „A gdyby nawet głowa przeszła”, pomyślała biedna Alicja, „na niewiele by się zdała bez ramion. Ach, jak bardzo chciałabym składać się jak teleskop! Chyba bym potrafiła, gdybym tylko wiedziała, od czego zacząć.” Ostatnio bowiem zdarzyło się tyle niezwykłych rzeczy, że Alicja zaczynała uważać, iż naprawdę niewiele jest rzeczy niemożliwych."
    en: "Alice opened the door and found that it led into a small passage, not much larger than a rat-hole: she knelt down and looked along the passage into the loveliest garden you ever saw. How she longed to get out of that dark hall, and wander about among those beds of bright flowers and those cool fountains, but she could not even get her head through the doorway; “and even if my head would go through,” thought poor Alice, “it would be of very little use without my shoulders. Oh, how I wish I could shut up like a telescope! I think I could, if I only knew how to begin.” For, you see, so many out-of-the-way things had happened lately, that Alice had begun to think that very few things indeed were really impossible."
    chunks:
      - pl: "Alicja otworzyła drzwiczki i zobaczyła, że prowadzą do wąskiego przejścia,"
        ru: "Алиса открыла дверцу и увидела, что она ведёт в узкий проход,"
