  - clean: "„No proszę!”, pomyślała Alicja. „Po takim upadku spadnięcie ze schodów nie zrobi już na mnie żadnego wrażenia! Jaka odważna wydam się wszystkim w domu! Przecież nie pisnęłabym ani słowa, nawet gdybym spadła z dachu!” (Co było całkiem prawdopodobne.)"
    en: "“Well!” thought Alice to herself, “after such a fall as this, I shall think nothing of tumbling down stairs! How brave they’ll all think me at home! Why, I wouldn’t say anything about it, even if I fell off the top of the house!” (Which was very likely true.)"
    chunks:
      - pl: "„No proszę!”, pomyślała Alicja."
        ru: "«Ну надо же!» — подумала Алиса."
        note: "no proszę — разговорное: ну надо же, вот так так"
      - pl: " „Po takim upadku spadnięcie ze schodów"
        ru: "«После такого падения падение с лестницы"
      - pl: " nie zrobi już na mnie żadnego wrażenia!"
        ru: "уже не произведёт на меня никакого впечатления!"
        note: "zrobić wrażenie na kimś — произвести впечатление на кого-л."
      - pl: " Jaka odważna wydam się wszystkim w domu!"
        ru: "Какой храброй я покажусь всем дома!"
        note: "wydać się komuś jakimś — показаться кому-л. каким-л.: творительный"
      - pl: " Przecież nie pisnęłabym ani słowa,"
        ru: "Я ведь и не пискнула бы ни слова,"
        note: "ani słowa — ни слова: родительный при отрицании"
      - pl: " nawet gdybym spadła z dachu!”"
        ru: "даже если бы упала с крыши!»"
        note: "gdybym — если бы я: союз с личным окончанием"
      - pl: " (Co było całkiem prawdopodobne.)"
        ru: "(Что было вполне вероятно.)"
    words: { "spadnięcie": spasc, "schodów": schody, "wrażenia": wrazenie, "wszystkim": wszyscy, "słowa": slowo, "dachu": dach }
  - clean: "W dół, w dół, w dół. Czy ten upadek nigdy się nie skończy? „Ciekawe, ile kilometrów już przeleciałam?”, powiedziała na głos. „Muszę być gdzieś blisko środka ziemi. Niech pomyślę: to byłoby jakieś sześć tysięcy kilometrów w dół, tak sądzę…” (Alicja nauczyła się bowiem kilku takich rzeczy na lekcjach w szkole i choć nie była to najlepsza okazja, żeby popisać się wiedzą, bo nikt jej nie słuchał, i tak dobrze było powtórzyć to sobie) „…tak, to mniej więcej właściwa odległość… ale ciekawe, na jakiej jestem szerokości i długości geograficznej?” (Alicja nie miała pojęcia, czym jest szerokość geograficzna ani długość, ale uważała, że to ładne, dostojne słowa.)"
    en: "Down, down, down. Would the fall _never_ come to an end? “I wonder how many miles I’ve fallen by this time?” she said aloud. “I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think—” (for, you see, Alice had learnt several things of this sort in her lessons in the schoolroom, and though this was not a _very_ good opportunity for showing off her knowledge, as there was no one to listen to her, still it was good practice to say it over) “—yes, that’s about the right distance—but then I wonder what Latitude or Longitude I’ve got to?” (Alice had no idea what Latitude was, or Longitude either, but thought they were nice grand words to say.)"
    chunks:
      - pl: "W dół, w dół, w dół."
        ru: "Вниз, вниз, вниз."
        note: "w dół — вниз; повтор передаёт длительность падения"
      - pl: " Czy ten upadek nigdy się nie skończy?"
        ru: "Неужели это падение никогда не кончится?"
        note: "skończyć się — кончиться: всегда с się"
      - pl: " „Ciekawe, ile kilometrów już przeleciałam?”,"
        ru: "«Интересно, сколько километров я уже пролетела?» —"
