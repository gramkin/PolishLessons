  - clean: "Łatwo powiedzieć „wypij mnie”, ale mądra Alicja nie zamierzała robić tego w pośpiechu. „Nie, najpierw sprawdzę”, powiedziała, „czy jest na niej napisane «trucizna», czy nie” — czytała bowiem kilka ładnych historyjek o dzieciach, które się poparzyły albo zostały zjedzone przez dzikie zwierzęta, albo spotkały je inne nieprzyjemności, a wszystko dlatego, że nie chciały pamiętać prostych zasad, których uczyli ich przyjaciele: na przykład że rozżarzony pogrzebacz parzy, jeśli trzyma się go zbyt długo, albo że jeśli bardzo głęboko skaleczysz się nożem w palec, zwykle leci krew. I nigdy nie zapomniała, że jeśli wypije się dużo z butelki oznaczonej słowem „trucizna”, prędzej czy później prawie na pewno źle to człowiekowi zrobi."
    en: "It was all very well to say “Drink me,” but the wise little Alice was not going to do _that_ in a hurry. “No, I’ll look first,” she said, “and see whether it’s marked ‘_poison_’ or not”; for she had read several nice little histories about children who had got burnt, and eaten up by wild beasts and other unpleasant things, all because they _would_ not remember the simple rules their friends had taught them: such as, that a red-hot poker will burn you if you hold it too long; and that if you cut your finger _very_ deeply with a knife, it usually bleeds; and she had never forgotten that, if you drink much from a bottle marked “poison,” it is almost certain to disagree with you, sooner or later."
