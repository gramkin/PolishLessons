  - clean: "Nagle natknęła się na mały stolik na trzech nogach, cały z litego szkła; nie było na nim nic prócz maleńkiego złotego kluczyka, a pierwsza myśl Alicji była taka, że kluczyk pasuje do którychś drzwi w sali; niestety! Albo zamki były za duże, albo kluczyk za mały — w każdym razie żadnych nie dało się otworzyć. Za drugim jednak obejściem sali natrafiła na niską zasłonę, której wcześniej nie zauważyła, a za nią były drzwiczki wysokie na jakieś czterdzieści centymetrów. Wsunęła złoty kluczyk do zamka i ku wielkiej radości okazało się, że pasuje!"
    en: "Suddenly she came upon a little three-legged table, all made of solid glass; there was nothing on it except a tiny golden key, and Alice’s first thought was that it might belong to one of the doors of the hall; but, alas! either the locks were too large, or the key was too small, but at any rate it would not open any of them. However, on the second time round, she came upon a low curtain she had not noticed before, and behind it was a little door about fifteen inches high: she tried the little golden key in the lock, and to her great delight it fitted!"
