chapter: 1
chapterTitle: W głąb króliczej nory
chapterTitleRu: Вниз по кроличьей норе
level: B1
paragraphs:
  - clean: "Alicja zaczynała się już bardzo nudzić, siedząc obok siostry na brzegu rzeki i nie mając nic do roboty: raz czy dwa zajrzała do książki, którą czytała siostra, ale nie było w niej ani obrazków, ani rozmów. „I co komu po książce”, pomyślała Alicja, „w której nie ma obrazków ani rozmów?”"
    en: "Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice “without pictures or conversations?”"
    chunks:
      - pl: "Alicja zaczynała się już bardzo nudzić,"
        ru: "Алисе уже становилось очень скучно,"
        note: "nudzić się — скучать; zaczynać się nudzić — начинать скучать"
      - pl: " siedząc obok siostry na brzegu rzeki"
        ru: "сидеть рядом с сестрой на берегу реки"
        note: "siedząc — деепричастие от siedzieć: сидя"
      - pl: " i nie mając nic do roboty:"
        ru: "и ничего не делать:"
        note: "nie mieć nic do roboty — нечего делать"
      - pl: " raz czy dwa zajrzała do książki,"
        ru: "раз или два она заглянула в книжку,"
        note: "zajrzeć do czegoś — заглянуть во что-л.: do и родительный"
      - pl: " którą czytała siostra,"
        ru: "которую читала сестра,"
      - pl: " ale nie było w niej ani obrazków, ani rozmów."
        ru: "но в ней не было ни картинок, ни разговоров."
        note: "ani… ani… — ни… ни…"
      - pl: " „I co komu po książce”,"
        ru: "«И кому нужна книжка»,"
        note: "co komu po czymś — разговорное: зачем кому-то что-либо"
      - pl: " pomyślała Alicja,"
        ru: "подумала Алиса,"
      - pl: " „w której nie ma obrazków ani rozmów?”"
        ru: "«в которой нет ни картинок, ни разговоров?»"
    words: { "zaczynała": zaczynac, "siedząc": siedziec, "siostry": siostra, "brzegu": brzeg, "rzeki": rzeka, "roboty": robota, "książki": ksiazka, "czytała": czytac, "rozmów": rozmowa, "pomyślała": pomyslec }
  - clean: "Zastanawiała się więc w duchu (na tyle, na ile potrafiła, bo upalny dzień sprawiał, że była senna i otępiała), czy przyjemność zrobienia wianka ze stokrotek warta jest trudu wstawania i zbierania kwiatów, gdy nagle tuż obok przebiegł Biały Królik o różowych oczach."
    en: "So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her."
    chunks:
      - pl: "Zastanawiała się więc w duchu"
        ru: "И она раздумывала про себя"
        note: "zastanawiać się — раздумывать; w duchu — про себя"
      - pl: " (na tyle, na ile potrafiła,"
        ru: "(насколько могла,"
        note: "na tyle, na ile — настолько, насколько"
      - pl: " bo upalny dzień sprawiał, że była senna i otępiała),"
        ru: "потому что знойный день делал её сонной и вялой),"
        note: "sprawiać, że… — делать так, что…"
      - pl: " czy przyjemność zrobienia wianka ze stokrotek"
        ru: "стоит ли удовольствие сплести венок из маргариток"
      - pl: " warta jest trudu wstawania i zbierania kwiatów,"
        ru: "труда встать и собирать цветы,"
        note: "wart czegoś — стоящий чего-л.: родительный падеж"
      - pl: " gdy nagle tuż obok przebiegł Biały Królik o różowych oczach."
        ru: "как вдруг совсем рядом пробежал Белый Кролик с розовыми глазами."
        note: "o + предложный — с, описывает признак: królik o różowych oczach"
    words: { "Zastanawiała": zastanawiac, "duchu": duch, "tyle": tyl, "potrafiła": potrafic, "sprawiał": sprawiac, "była": byly, "przyjemność": przyjemnosc, "warta": wart, "trudu": trud, "wstawania": wstawac, "zbierania": zbierac, "kwiatów": kwiat, "nagle": nagle, "tuż": tuz, "Biały": bialy }
  - clean: "Nie było w tym nic szczególnie niezwykłego; Alicji nie wydało się też zbyt dziwne, gdy usłyszała, jak Królik mruczy do siebie: „Ojej! Ojej! Spóźnię się!” (kiedy później to przemyślała, uznała, że powinna była się zdziwić, ale w tamtej chwili wszystko wydawało się całkiem naturalne); kiedy jednak Królik naprawdę wyjął z kieszonki kamizelki zegarek, spojrzał na niego i pobiegł dalej, Alicja zerwała się na nogi, bo przemknęło jej przez myśl, że nigdy przedtem nie widziała królika, który miałby kieszonkę w kamizelce albo zegarek, który mógłby z niej wyjąć. Płonąc z ciekawości, pobiegła za nim przez pole i na szczęście zdążyła jeszcze zobaczyć, jak wskakuje do dużej króliczej nory pod żywopłotem."
    en: "There was nothing so _very_ remarkable in that; nor did Alice think it so _very_ much out of the way to hear the Rabbit say to itself, “Oh dear! Oh dear! I shall be late!” (when she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually _took a watch out of its waistcoat-pocket_, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that she had never before seen a rabbit with either a waistcoat-pocket, or a watch to take out of it, and burning with curiosity, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge."
    chunks:
      - pl: "Nie było w tym nic szczególnie niezwykłego;"
        ru: "В этом не было ничего особенно необычного;"
      - pl: " Alicji nie wydało się też zbyt dziwne,"
        ru: "Алисе не показалось и слишком странным,"
        note: "wydawać się komuś — казаться кому-л.: дательный падеж"
      - pl: " gdy usłyszała, jak Królik mruczy do siebie:"
        ru: "когда она услышала, как Кролик бормочет себе под нос:"
        note: "mruczeć do siebie — бормотать себе под нос"
      - pl: " „Ojej! Ojej! Spóźnię się!”"
        ru: "«Ой-ой! Я опоздаю!»"
        note: "spóźnić się — опоздать: всегда с się"
      - pl: " (kiedy później to przemyślała,"
        ru: "(когда она позже это обдумала,"
        note: "przemyśleć coś — обдумать что-л.: винительный без предлога"
      - pl: " uznała, że powinna była się zdziwić,"
        ru: "она решила, что должна была удивиться,"
        note: "powinna była — прошедшее долженствование: должна была"
      - pl: " ale w tamtej chwili wszystko wydawało się całkiem naturalne);"
        ru: "но в ту минуту всё казалось совершенно естественным);"
      - pl: " kiedy jednak Królik naprawdę wyjął z kieszonki kamizelki zegarek,"
        ru: "но когда Кролик и вправду вынул из кармашка жилетки часы,"
        note: "wyjąć z czegoś — вынуть из чего-л.: z и родительный"
      - pl: " spojrzał na niego i pobiegł dalej,"
        ru: "взглянул на них и побежал дальше,"
        note: "spojrzeć na coś — взглянуть на что-л.: na и винительный"
      - pl: " Alicja zerwała się na nogi,"
        ru: "Алиса вскочила на ноги,"
        note: "zerwać się na nogi — вскочить на ноги"
      - pl: " bo przemknęło jej przez myśl,"
        ru: "потому что у неё промелькнула мысль,"
        note: "przemknąć komuś przez myśl — промелькнуть в голове у кого-л."
      - pl: " że nigdy przedtem nie widziała królika,"
        ru: "что никогда прежде не видела кролика,"
      - pl: " który miałby kieszonkę w kamizelce"
        ru: "у которого был бы кармашек в жилетке"
      - pl: " albo zegarek, który mógłby z niej wyjąć."
        ru: "или часы, которые он мог бы оттуда вынуть."
      - pl: " Płonąc z ciekawości, pobiegła za nim przez pole"
        ru: "Сгорая от любопытства, она побежала за ним через поле"
        note: "płonąć z ciekawości — сгорать от любопытства: z и родительный"
      - pl: " i na szczęście zdążyła jeszcze zobaczyć,"
        ru: "и, к счастью, ещё успела увидеть,"
        note: "zdążyć + инфинитив — успеть сделать"
      - pl: " jak wskakuje do dużej króliczej nory pod żywopłotem."
        ru: "как он ныряет в большую кроличью нору под изгородью."
    words: { "szczególnie": szczegolnie, "niezwykłego": niezwykly, "wydało": wydac, "zbyt": zbyt, "dziwne": dziwny, "usłyszała": uslyszec, "Spóźnię": spoznic, "później": pozno, "przemyślała": przemyslec, "uznała": uznac, "tamtej": tamten, "wydawało": wydawac, "całkiem": calkiem, "zegarek": zegarek, "spojrzał": spojrzec, "dalej": dalej, "zerwała": zerwac, "nogi": noga, "pole": pole, "szczęście": szczescie, "zdążyła": zdazyc }
  - clean: "W następnej chwili Alicja skoczyła za nim, ani przez moment nie zastanawiając się, jak u licha zdoła się stamtąd wydostać."
    en: "In another moment down went Alice after it, never once considering how in the world she was to get out again."
    chunks:
      - pl: "W następnej chwili Alicja skoczyła za nim,"
        ru: "В следующее мгновение Алиса прыгнула за ним,"
      - pl: " ani przez moment nie zastanawiając się,"
        ru: "ни на миг не задумавшись,"
        note: "zastanawiać się nad czymś — задумываться над чем-л."
      - pl: " jak u licha zdoła się stamtąd wydostać."
        ru: "как, чёрт возьми, она оттуда выберется."
        note: "u licha — разговорное: чёрт возьми; wydostać się — выбраться"
    words: { "następnej": nastepny, "moment": moment, "zdoła": zdolac, "stamtąd": stamtad, "wydostać": wydostac }
  - clean: "Królicza nora biegła przez jakiś czas prosto niczym tunel, a potem nagle opadła w dół — tak nagle, że Alicja nie zdążyła nawet pomyśleć o zatrzymaniu się, zanim zorientowała się, że spada w głąb bardzo głębokiej studni."
    en: "The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well."
    chunks:
      - pl: "Królicza nora biegła przez jakiś czas prosto niczym tunel,"
        ru: "Кроличья нора какое-то время шла прямо, словно туннель,"
        note: "niczym — книжное: словно, как"
      - pl: " a potem nagle opadła w dół —"
        ru: "а потом вдруг обрывалась вниз —"
      - pl: " tak nagle, że Alicja nie zdążyła nawet pomyśleć o zatrzymaniu się,"
        ru: "так внезапно, что Алиса не успела даже подумать о том, чтобы остановиться,"
        note: "pomyśleć o czymś — подумать о чём-л.: o и предложный"
      - pl: " zanim zorientowała się, że spada w głąb bardzo głębokiej studni."
        ru: "прежде чем поняла, что падает вглубь очень глубокого колодца."
        note: "zorientować się — сообразить, понять"
    words: { "biegła": biec, "tunel": tunel, "potem": potem, "dół": dol, "zatrzymaniu": zatrzymac, "spada": spadac, "głąb": glab, "głębokiej": gleboki }
  - clean: "Albo studnia była bardzo głęboka, albo Alicja spadała bardzo powoli, miała bowiem mnóstwo czasu, żeby rozejrzeć się dookoła i zastanowić, co się teraz stanie. Najpierw spróbowała spojrzeć w dół i rozpoznać, dokąd leci, ale było zbyt ciemno, żeby cokolwiek zobaczyć; potem przyjrzała się ścianom studni i zauważyła, że są zastawione szafkami i półkami na książki; tu i ówdzie wisiały na kołkach mapy i obrazki. Mijając jedną z półek, zdjęła z niej słoik z napisem „MARMOLADA POMARAŃCZOWA”, ale ku wielkiemu rozczarowaniu okazał się pusty. Nie chciała go upuścić, żeby nie zabić kogoś na dole, więc udało jej się wsunąć go do jednej z szafek, obok której właśnie przelatywała."
    en: "Either the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her and to wonder what was going to happen next. First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and book-shelves; here and there she saw maps and pictures hung upon pegs. She took down a jar from one of the shelves as she passed; it was labelled “ORANGE MARMALADE”, but to her great disappointment it was empty: she did not like to drop the jar for fear of killing somebody underneath, so managed to put it into one of the cupboards as she fell past it."
    chunks:
      - pl: "Albo studnia była bardzo głęboka, albo Alicja spadała bardzo powoli,"
        ru: "Либо колодец был очень глубок, либо Алиса падала очень медленно,"
