  - clean: "Po chwili zaczęła znowu. „Ciekawe, czy przelecę przez całą ziemię na wylot! Ale będzie zabawnie wyjść wśród ludzi, którzy chodzą głowami w dół! Antypatie, tak mi się zdaje…” (tym razem była raczej zadowolona, że nikt jej nie słucha, bo słowo zabrzmiało jakoś nie tak) „…ale będę musiała ich zapytać, jak nazywa się ich kraj. Przepraszam panią, czy to Nowa Zelandia, czy Australia?” (i spróbowała dygnąć, mówiąc te słowa — wyobraźcie sobie: dygać, spadając w powietrzu! Myślicie, że dałoby się to zrobić?) „A za jaką niemądrą dziewczynkę mnie uzna, kiedy spytam! Nie, lepiej nie pytać: może gdzieś będzie to napisane.”"
    en: "Presently she began again. “I wonder if I shall fall right _through_ the earth! How funny it’ll seem to come out among the people that walk with their heads downward! The Antipathies, I think—” (she was rather glad there _was_ no one listening, this time, as it didn’t sound at all the right word) “—but I shall have to ask them what the name of the country is, you know. Please, Ma’am, is this New Zealand or Australia?” (and she tried to curtsey as she spoke—fancy _curtseying_ as you’re falling through the air! Do you think you could manage it?) “And what an ignorant little girl she’ll think me for asking! No, it’ll never do to ask: perhaps I shall see it written up somewhere.”"
