  - clean: "W dół, w dół, w dół. Nie było nic innego do roboty, więc Alicja wkrótce znów zaczęła mówić. „Dina będzie dziś za mną bardzo tęskniła, tak myślę!” (Dina była kotką.) „Mam nadzieję, że pamiętają o jej spodeczku mleka na podwieczorek. Dino, kochana! Szkoda, że nie ma cię tu ze mną! W powietrzu nie ma myszy, obawiam się, ale mogłabyś złapać nietoperza, a on jest bardzo podobny do myszy. Ciekawe tylko, czy koty jedzą nietoperze?” Tu Alicja zaczęła robić się senna i mówiła dalej do siebie, jakby przez sen: „Czy koty jedzą nietoperze? Czy koty jedzą nietoperze?”, a czasem: „Czy nietoperze jedzą koty?” — bo skoro nie znała odpowiedzi na żadne z tych pytań, nie miało większego znaczenia, jak je postawi. Czuła, że zasypia, i właśnie zaczęła śnić, że idzie ręka w łapę z Diną i mówi do niej bardzo poważnie: „No, Dino, powiedz mi prawdę: czy zjadłaś kiedyś nietoperza?”, gdy nagle — bach! bach! — wylądowała na stosie gałązek i suchych liści, i upadek się skończył."
    en: "Down, down, down. There was nothing else to do, so Alice soon began talking again. “Dinah’ll miss me very much to-night, I should think!” (Dinah was the cat.) “I hope they’ll remember her saucer of milk at tea-time. Dinah my dear! I wish you were down here with me! There are no mice in the air, I’m afraid, but you might catch a bat, and that’s very like a mouse, you know. But do cats eat bats, I wonder?” And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, “Do cats eat bats? Do cats eat bats?” and sometimes, “Do bats eat cats?” for, you see, as she couldn’t answer either question, it didn’t much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah, and saying to her very earnestly, “Now, Dinah, tell me the truth: did you ever eat a bat?” when suddenly, thump! thump! down she came upon a heap of sticks and dry leaves, and the fall was over."
