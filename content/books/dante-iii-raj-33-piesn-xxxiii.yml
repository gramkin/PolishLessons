# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 33
chapterTitle: "Pieśń XXXIII"
chapterTitleRu: "Песнь XXXIII. Любовь, что движет солнце и светила"
level: B2
paragraphs:
  - clean: "Zakończenie. Modlitwa św. Bernarda. Matka Boska. Trójca Przenajświętsza."
    chunks:
      - pl: "Zakończenie. Modlitwa św. Bernarda. Matka Boska. Trójca Przenajświętsza."
        ru: "Заключение. Молитва святого Бернарда. Богоматерь. Пресвятая Троица."
    words: { "Modlitwa": modlitwa, "Matka": matka, "Boska": boski }
  - clean: "«Dziewico, matko, córko twego syna,\nNajpokorniejsza i najwyższa w niebie,\nPrzedwiecznej woli granico jedyna!\nLudzka natura w tobie i przez ciebie\nTak się podniosła, że z jej uszlachceniem\nNie wzgardził stać się jej Stwórca stworzeniem\nW żywocie twoim, o Matko, Dziewico,\nZatliłaś miłość, pod której gorącem\nKwiat ten kielichem świecąc gęstolistym,\nBujnie w pokoju rośnie wiekuistym."
    verse: true
    chunks:
      - pl: "«Dziewico, matko, córko twego syna,"
        ru: "«Дева, мать, дочь своего сына,"
      - pl: "\nNajpokorniejsza i najwyższa w niebie,"
        ru: "смиреннейшая и высочайшая на небе,"
      - pl: "\nPrzedwiecznej woli granico jedyna!"
        ru: "единственный предел предвечной воли!"
        note: "у Данте — «предел» замысла"
      - pl: "\nLudzka natura w tobie i przez ciebie"
        ru: "Человеческая природа в тебе и через тебя"
      - pl: "\nTak się podniosła, że z jej uszlachceniem"
        ru: "так возвысилась, что, облагородив её,"
        note: "uszlachcenie — облагораживание"
      - pl: "\nNie wzgardził stać się jej Stwórca stworzeniem"
        ru: "её Творец не погнушался стать её творением."
      - pl: "\nW żywocie twoim, o Matko, Dziewico,"
        ru: "В твоём чреве, о Матерь, Дева,"
      - pl: "\nZatliłaś miłość, pod której gorącem"
        ru: "ты затеплила любовь, под жаром которой"
        note: "zatlić — затеплить"
      - pl: "\nKwiat ten kielichem świecąc gęstolistym,"
        ru: "этот цветок, светясь густолистой чашей,"
      - pl: "\nBujnie w pokoju rośnie wiekuistym."
        ru: "пышно растёт в вечном мире."
    words: { "Dziewico": dziewica, "granico": granica, "natura": natura, "podniosła": podniesc, "Kwiat": kwiat, "świecąc": swiecic }
  - clean: "Tu jesteś łaski południowym słońcem,\nNa ziemi żywą nadziei krynicą.\nNiewiasto, twoja tak wielka potęga,\nKto cię nie błaga, a po łaskę sięga,\nBezskrzydłą żądzą ten w górę się wznosi.\nDobroć twa wspiera nie tylko, kto prosi,\nCzęsto przygiętych boleści ciężarem\nUprzedza prośbę dobrowolnym darem."
    verse: true
    chunks:
      - pl: "Tu jesteś łaski południowym słońcem,"
        ru: "Здесь ты — полуденное солнце благодати,"
      - pl: "\nNa ziemi żywą nadziei krynicą."
        ru: "на земле — живой источник надежды."
        note: "krynica — источник"
      - pl: "\nNiewiasto, twoja tak wielka potęga,"
        ru: "Жена, так велико твоё могущество,"
      - pl: "\nKto cię nie błaga, a po łaskę sięga,"
        ru: "что тот, кто не молит тебя, а тянется к благодати,"
      - pl: "\nBezskrzydłą żądzą ten w górę się wznosi."
        ru: "поднимается вверх бескрылым желанием."
      - pl: "\nDobroć twa wspiera nie tylko, kto prosi,"
        ru: "Твоя доброта поддерживает не только того, кто просит,"
      - pl: "\nCzęsto przygiętych boleści ciężarem"
        ru: "часто она тех, кто согнут тяжестью скорбей,"
      - pl: "\nUprzedza prośbę dobrowolnym darem."
        ru: "предупреждает добровольным даром прежде просьбы."
    words: { "Niewiasto": niewiasta, "potęga": potega, "sięga": siegac, "wznosi": wznosic, "Dobroć": dobroc, "ciężarem": ciezar }
  - clean: "W tobie się łączy, miłosierdzia Pani,\nPobożność, miłość, dobroć, szczodrobliwość.\nOto ze świata najgłębszej otchłani\nOn, który wchodząc na te niebios szczyty\nWidział koleją wszystkie duchów byty,\nBłaga cię, wzmocnij w łasce jego oko,\nAby widzeniem wzniósł się tak wysoko,\nGdzie ostateczna jest jego szczęśliwość."
    verse: true
    chunks:
      - pl: "W tobie się łączy, miłosierdzia Pani,"
        ru: "В тебе соединяются, Госпожа милосердия,"
      - pl: "\nPobożność, miłość, dobroć, szczodrobliwość."
        ru: "благочестие, любовь, доброта, щедрость."
      - pl: "\nOto ze świata najgłębszej otchłani"
        ru: "Вот из глубочайшей бездны мира"
      - pl: "\nOn, który wchodząc na te niebios szczyty"
        ru: "он, что, восходя на эти вершины небес,"
      - pl: "\nWidział koleją wszystkie duchów byty,"
        ru: "видел по порядку все бытия духов,"
      - pl: "\nBłaga cię, wzmocnij w łasce jego oko,"
        ru: "молит тебя: укрепи в благодати его око,"
      - pl: "\nAby widzeniem wzniósł się tak wysoko,"
        ru: "чтобы он видением вознёсся так высоко,"
      - pl: "\nGdzie ostateczna jest jego szczęśliwość."
        ru: "где его последнее блаженство."
    words: { "niebios": niebiosa, "szczyty": szczyt, "wzmocnij": wzmocnic, "łasce": laska-2, "wzniósł": wzniesc, "ostateczna": ostateczny }
  - clean: "Ja, com goręcej takiej wzroku siły\nNie życzył sobie, jak jemu tu w niebie,\nWszystkie modlitwy moje ślę do ciebie,\nBłagając, oby daremne nie były!\nNiechaj on swojej śmiertelności błędy\nZa twą przyczyną jako mgły rozproszy,\nAby mógł utkwić wzrok w arcyrozkoszy."
    verse: true
    chunks:
      - pl: "Ja, com goręcej takiej wzroku siły"
        ru: "Я, что никогда не желал себе такой силы взгляда"
      - pl: "\nNie życzył sobie, jak jemu tu w niebie,"
        ru: "горячее, чем ему здесь, на небе,"
      - pl: "\nWszystkie modlitwy moje ślę do ciebie,"
        ru: "все свои молитвы шлю к тебе,"
      - pl: "\nBłagając, oby daremne nie były!"
        ru: "моля, чтобы они не были напрасны!"
      - pl: "\nNiechaj on swojej śmiertelności błędy"
        ru: "Пусть он заблуждения своей смертности"
      - pl: "\nZa twą przyczyną jako mgły rozproszy,"
        ru: "твоим заступничеством рассеет, как туман,"
      - pl: "\nAby mógł utkwić wzrok w arcyrozkoszy."
        ru: "чтобы мог устремить взгляд в высшее наслаждение."
    words: { "wzroku": wzrok, "życzył": zyczyc, "niebie": niebo, "Błagając": blagac, "przyczyną": przyczyna, "mgły": mgla }
  - clean: "Ty, która możesz, co chcesz, o Królowo!\nW nim twą opieką zwalcz krewkie popędy,\nBłagam cię jeszcze, po widzeniu takiem,\nChciej w nim zachować chęć i wolę zdrową.\nPatrz, Beatrycze z błogosławionymi\nSkładają ręce i całym orszakiem\nModlą się, łącząc swe prośby z moimi»."
    verse: true
    chunks:
      - pl: "Ty, która możesz, co chcesz, o Królowo!"
        ru: "Ты, что можешь всё, что хочешь, о Царица!"
      - pl: "\nW nim twą opieką zwalcz krewkie popędy,"
        ru: "одолей в нём своей опекой пылкие порывы,"
        note: "krewki — пылкий; popęd — порыв"
      - pl: "\nBłagam cię jeszcze, po widzeniu takiem,"
        ru: "молю тебя ещё: после такого видения"
      - pl: "\nChciej w nim zachować chęć i wolę zdrową."
        ru: "сохрани в нём здоровыми желание и волю."
      - pl: "\nPatrz, Beatrycze z błogosławionymi"
        ru: "Смотри, Беатриче с блаженными"
      - pl: "\nSkładają ręce i całym orszakiem"
        ru: "складывают руки и всем сонмом"
      - pl: "\nModlą się, łącząc swe prośby z moimi»."
        ru: "молятся, соединяя свои просьбы с моими»."
    words: { "chęć": chec, "błogosławionymi": blogoslawic, "Składają": skladac, "Modlą": modlic, "łącząc": laczyc, "prośby": prosba }
  - clean: "W mówcę przez Boga ukochane oczy\nUtkwione dały nam znać jako posły,\nJak głos modlitwy dla niej jest uroczy;\nPotem na wieczne światło się podniosły,\nTrudno uwierzyć, że twór w takie słońce\nZatapiał oczy tak przenikające."
    verse: true
    chunks:
      - pl: "W mówcę przez Boga ukochane oczy"
        ru: "Глаза, любимые Богом, устремлённые на говорящего,"
        note: "Марии"
      - pl: "\nUtkwione dały nam znać jako posły,"
        ru: "дали нам знать, как вестники,"
      - pl: "\nJak głos modlitwy dla niej jest uroczy;"
        ru: "как мил ей голос молитвы;"
      - pl: "\nPotem na wieczne światło się podniosły,"
        ru: "потом поднялись к вечному свету;"
      - pl: "\nTrudno uwierzyć, że twór w takie słońce"
        ru: "трудно поверить, что творение в такое солнце"
      - pl: "\nZatapiał oczy tak przenikające."
        ru: "погружало столь проникающие глаза."
    words: { "Boga": bog, "głos": glos, "wieczne": wieczny, "światło": swiatlo, "uwierzyć": uwierzyc, "słońce": slonce }
  - clean: "Do kresu wszystkich mych żądz, gdym z zapałem\nZbliżał się, czułem, zdumion nie po mału,\nJak stygł żądz owych cały żar zapału.\nBernard z uśmiechem wskazywał mi gestem,\nAżebym w górę patrzył, i patrzyłem\nCzując, że takim, jak być życzył, jestem,\nBo wzrok mój wedle ducha przemienienia\nBył więcej czystym i wrażał spojrzenia\nCoraz to głębiej w arcyświatło żywe,\nKtóre jest jedno przez siebie prawdziwe."
    verse: true
    chunks:
      - pl: "Do kresu wszystkich mych żądz, gdym z zapałem"
        ru: "Когда я с пылом приближался к пределу"
      - pl: "\nZbliżał się, czułem, zdumion nie po mału,"
        ru: "всех своих желаний, я чувствовал, немало изумлённый,"
      - pl: "\nJak stygł żądz owych cały żar zapału."
        ru: "как остывал весь жар пыла этих желаний."
      - pl: "\nBernard z uśmiechem wskazywał mi gestem,"
        ru: "Бернард с улыбкой показывал мне жестом,"
      - pl: "\nAżebym w górę patrzył, i patrzyłem"
        ru: "чтобы я смотрел вверх, и я смотрел,"
      - pl: "\nCzując, że takim, jak być życzył, jestem,"
        ru: "чувствуя, что я уже такой, каким он желал;"
      - pl: "\nBo wzrok mój wedle ducha przemienienia"
        ru: "ибо мой взгляд по мере преображения духа"
      - pl: "\nBył więcej czystym i wrażał spojrzenia"
        ru: "становился чище и вонзал взоры"
      - pl: "\nCoraz to głębiej w arcyświatło żywe,"
        ru: "всё глубже в живой высший свет,"
      - pl: "\nKtóre jest jedno przez siebie prawdziwe."
        ru: "что един истинен сам через себя."
    words: { "kresu": kres, "uśmiechem": usmiech, "wskazywał": wskazywac, "gestem": gest, "Coraz": coraz, "głębiej": gleboko }
  - clean: "Wzrok mój był odtąd wyższy nad moc słowa:\nSłowo i pamięć zbytnim wysileniem\nMdleją przed takim korząc się widzeniem.\nJako widzący we śnie po minionym\nMarzeniu czucie swych wrażeń przechowa,\nChoć rys obrazu tonie w tle zamglonym,\nTakim ja jestem, bo moje widzenie\nWionęło z duszy jak senne marzenie."
    verse: true
    chunks:
      - pl: "Wzrok mój był odtąd wyższy nad moc słowa:"
        ru: "Отныне моё видение было выше силы слова:"
      - pl: "\nSłowo i pamięć zbytnim wysileniem"
        ru: "слово и память от чрезмерного усилия"
      - pl: "\nMdleją przed takim korząc się widzeniem."
        ru: "изнемогают, склоняясь перед таким видением."
        note: "korzyć się — смиряться"
      - pl: "\nJako widzący we śnie po minionym"
        ru: "Как видящий во сне после минувшей"
      - pl: "\nMarzeniu czucie swych wrażeń przechowa,"
        ru: "грёзы сохраняет чувство своих впечатлений,"
      - pl: "\nChoć rys obrazu tonie w tle zamglonym,"
        ru: "хотя черты образа тонут в туманном фоне,"
      - pl: "\nTakim ja jestem, bo moje widzenie"
        ru: "таков и я, ибо моё видение"
      - pl: "\nWionęło z duszy jak senne marzenie."
        ru: "улетело из души, как сонная грёза."
        note: "wionąć — повеять, улететь"
    words: { "odtąd": odtad, "wyższy": wysoki, "pamięć": pamiec, "śnie": sen, "obrazu": obraz, "duszy": dusza }
  - clean: "A jeśli słodycz z niego urodzona\nCzuję, jak spada kroplami w to serce,\nTak śnieg od słońca topnieje niezwłocznie,\nTak się rozlecą, kiedy wiatr zadmucha\nNa wiotkich liściach spisane wyrocznie.\nŚmiertelną myślą, o niedościgniona,\nWieczna światłości, wskrześ z mojego ducha,\nCząstkę płomienia na twe podobieństwo,\nZapal mój język, aby choć w iskierce\nPrzekazał przyszłym pokoleniom gwoli\nChwałę płomiennej twojej aureoli,\nAby przez trochę wrażeń z mych uniesień,\nPrzez trochę dźwięków odbitych z mych piesień,\nŚwiat łatwiej pojąć mógł twoje zwycięstwo."
    verse: true
    chunks:
      - pl: "A jeśli słodycz z niego urodzona"
        ru: "И всё же я чувствую, как рождённая им сладость"
      - pl: "\nCzuję, jak spada kroplami w to serce,"
        ru: "падает каплями в это сердце."
      - pl: "\nTak śnieg od słońca topnieje niezwłocznie,"
        ru: "Так снег от солнца тает немедля,"
      - pl: "\nTak się rozlecą, kiedy wiatr zadmucha"
        ru: "так разлетятся, когда дунет ветер,"
      - pl: "\nNa wiotkich liściach spisane wyrocznie."
        ru: "пророчества, написанные на лёгких листьях."
        note: "листья Сивиллы"
      - pl: "\nŚmiertelną myślą, o niedościgniona,"
        ru: "О недостижимый для смертной мысли"
      - pl: "\nWieczna światłości, wskrześ z mojego ducha,"
        ru: "вечный свет, воскреси из моего духа"
      - pl: "\nCząstkę płomienia na twe podobieństwo,"
        ru: "частицу пламени по твоему подобию,"
      - pl: "\nZapal mój język, aby choć w iskierce"
        ru: "зажги мой язык, чтобы он хоть в искорке"
      - pl: "\nPrzekazał przyszłym pokoleniom gwoli"
        ru: "передал будущим поколениям"
      - pl: "\nChwałę płomiennej twojej aureoli,"
        ru: "славу твоего пламенного ореола,"
        note: "gwoli — ради"
      - pl: "\nAby przez trochę wrażeń z mych uniesień,"
        ru: "чтобы через немногие впечатления моих восторгов,"
      - pl: "\nPrzez trochę dźwięków odbitych z mych piesień,"
        ru: "через немногие звуки, отражённые из моих песен,"
      - pl: "\nŚwiat łatwiej pojąć mógł twoje zwycięstwo."
        ru: "мир легче мог постичь твою победу."
    words: { "słodycz": slodycz, "Śmiertelną": smiertelny, "Cząstkę": czastka, "płomienia": plomien, "podobieństwo": podobienstwo, "pokoleniom": pokolenie }
  - clean: "Wierzę na ranę palącą jak płomień,\nJaką mym oczom zadał żywy promień,\nŻe mógłbym nagle olsnąć, gdyby były\nOczy się moje odeń odwróciły.\nPomnę, jak wolą przezeń ośmieloną\nDopótym wzroku wytężał potęgę,\nAż go stopiłem z siłą nieskończoną."
    verse: true
    chunks:
      - pl: "Wierzę na ranę palącą jak płomień,"
        ru: "Я верю по ране, жгучей, как пламя,"
      - pl: "\nJaką mym oczom zadał żywy promień,"
        ru: "что нанёс моим глазам живой луч,"
      - pl: "\nŻe mógłbym nagle olsnąć, gdyby były"
        ru: "что я мог бы вдруг ослепнуть, если бы"
      - pl: "\nOczy się moje odeń odwróciły."
        ru: "мои глаза от него отвернулись."
      - pl: "\nPomnę, jak wolą przezeń ośmieloną"
        ru: "Помню, как волей, ободрённой им,"
      - pl: "\nDopótym wzroku wytężał potęgę,"
        ru: "я так долго напрягал силу взгляда,"
      - pl: "\nAż go stopiłem z siłą nieskończoną."
        ru: "пока не сплавил его с бесконечной силой."
    words: { "palącą": palic, "zadał": zadac, "żywy": zywy, "promień": promien, "nagle": nagle, "odwróciły": odwrocic }
  - clean: "Obfita łasko! Przez którą tam śmiałem\nTak oczy w wiecznej zatapiać światłości,\nŻe czułem, jak w niej wzrok mój przetrawiałem:\nW jej głębokościach treść rzeczy widziałem\nZ miłością w jedną oprawionych księgę,\nPorozrzucanych kartami po świecie."
    verse: true
    chunks:
      - pl: "Obfita łasko! Przez którą tam śmiałem"
        ru: "Обильная благодать! через которую я посмел"
      - pl: "\nTak oczy w wiecznej zatapiać światłości,"
        ru: "так погружать глаза в вечный свет,"
      - pl: "\nŻe czułem, jak w niej wzrok mój przetrawiałem:"
        ru: "что чувствовал, как в нём истощаю свой взгляд:"
        note: "przetrawiać — истощать, истратить"
      - pl: "\nW jej głębokościach treść rzeczy widziałem"
        ru: "в его глубинах я видел сущность вещей,"
      - pl: "\nZ miłością w jedną oprawionych księgę,"
        ru: "переплетённых любовью в одну книгу,"
      - pl: "\nPorozrzucanych kartami po świecie."
