chapter: 23
chapterTitle: "Pieśń XXIII"
chapterTitleRu: "Песнь XXIII. Лицемеры"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok VI. Obłudnicy: Kajfasz i inni.)"
    chunks:
      - pl: "(Krąg VIII. Tłumok VI. Obłudnicy: Kajfasz i inni.)"
        ru: "(Круг VIII. Ров VI. Лицемеры: Каиафа и другие.)"
        note: "obłudnik — лицемер; Kajfasz — Каиафа"
    words: { "Krąg": krag, "inni": inny }
  - clean: "Szliśmy w milczeniu i bez towarzyszy,\nJeden za drugim, jak dwa mnichy z celi;\nDiabli mi swoją kłótnią przypomnieli\nBajkę Ezopa o żabie i myszy.\nDwie części mowy, *teraz* i *w tej chwili*,\nNie tyle z sobą podobne być mogą,\nJak z ową bajką diabla bijatyka,\nGdy zagajali bitwę i kończyli."
    verse: true
    chunks:
      - pl: "Szliśmy w milczeniu i bez towarzyszy,"
        ru: "Мы шли в молчании и без спутников,"
      - pl: "\nJeden za drugim, jak dwa mnichy z celi;"
        ru: "один за другим, как два монаха из кельи;"
      - pl: "\nDiabli mi swoją kłótnią przypomnieli"
        ru: "бесы своей ссорой напомнили мне"
      - pl: "\nBajkę Ezopa o żabie i myszy."
        ru: "басню Эзопа о лягушке и мыши."
      - pl: "\nDwie części mowy, *teraz* i *w tej chwili*,"
        ru: "Два слова: «теперь» и «в этот миг» —"
      - pl: "\nNie tyle z sobą podobne być mogą,"
        ru: "не так могут быть подобны друг другу,"
      - pl: "\nJak z ową bajką diabla bijatyka,"
        ru: "как с той басней — бесовская драка,"
        note: "bijatyka — драка"
      - pl: "\nGdy zagajali bitwę i kończyli."
        ru: "как они начинали битву и кончали."
        note: "zagajać — начинать"
    words: { "celi": cela, "kłótnią": klotnia, "przypomnieli": przypomniec, "Bajkę": bajka, "żabie": zaba, "bitwę": bitwa }
  - clean: "Jak z jednej myśli myśl druga wynika,\nStrach pierwszy drugą przeraził mię trwogą;\nMyślałem sobie, ci diabli, zwiedzeni\nZ przyczyny naszej i okaleczeni\nWzajem ranami i smolnym gorącem,\nGdy ze złą chęcią ich gniew się ożeni,\nPolecą w trop nasz jak chart za zającem."
    verse: true
    chunks:
      - pl: "Jak z jednej myśli myśl druga wynika,"
        ru: "Как из одной мысли вытекает другая,"
      - pl: "\nStrach pierwszy drugą przeraził mię trwogą;"
        ru: "так первый страх поразил меня вторым ужасом;"
      - pl: "\nMyślałem sobie, ci diabli, zwiedzeni"
        ru: "я думал про себя: эти бесы, обманутые"
        note: "zwiedziony — обманутый"
      - pl: "\nZ przyczyny naszej i okaleczeni"
        ru: "по нашей вине и искалеченные"
      - pl: "\nWzajem ranami i smolnym gorącem,"
        ru: "взаимно ранами и смоляным жаром,"
      - pl: "\nGdy ze złą chęcią ich gniew się ożeni,"
        ru: "когда их гнев сочетается со злым умыслом,"
        note: "ożenić się — сочетаться, «обвенчаться»"
      - pl: "\nPolecą w trop nasz jak chart za zającem."
        ru: "полетят по нашему следу, как борзая за зайцем."
        note: "chart — борзая"
    words: { "wynika": wynikac, "przeraził": przerazic, "chęcią": chec, "gniew": gniew, "ożeni": ozenic, "trop": trop }
  - clean: "Strach włos mój jeżył i ziębił mię mrowiem,\nPatrzając za się rzekłem: «Ledwo dyszę,\nI mnie, i siebie skryj, mistrzu, w zacisze,\nZa ścianę skały, lękam się zawziętych\nSzatanów na nas i ich szpon przeklętych:\nJuż, już za nami szum ich skrzydeł słyszę»."
    verse: true
    chunks:
      - pl: "Strach włos mój jeżył i ziębił mię mrowiem,"
        ru: "Страх поднимал мне волосы и леденил мурашками,"
        note: "mrowie — мурашки"
      - pl: "\nPatrzając za się rzekłem: «Ledwo dyszę,"
        ru: "оглядываясь, я сказал: «Едва дышу,"
      - pl: "\nI mnie, i siebie skryj, mistrzu, w zacisze,"
        ru: "и меня, и себя спрячь, учитель, в укрытие,"
      - pl: "\nZa ścianę skały, lękam się zawziętych"
        ru: "за стену скалы; боюсь ожесточённых"
        note: "zawzięty — ожесточённый"
      - pl: "\nSzatanów na nas i ich szpon przeklętych:"
        ru: "на нас бесов и их проклятых когтей:"
      - pl: "\nJuż, już za nami szum ich skrzydeł słyszę»."
        ru: "уже, уже за нами я слышу шум их крыльев»."
    words: { "rzekłem": rzec, "skały": skala, "Szatanów": szatan, "przeklętych": przeklety, "szum": szum, "skrzydeł": skrzydlo }
  - clean: "Mistrz: «Gdybym szkłem był podszytym ołowiem,\nPrędzej bym twego nie odbił obrazu,\nJak w głąb twej duszy zajrzałem od razu:\nW tej chwili myśli twoje nie spostrzegły,\nJak jednolice przez moje przebiegły,\nTak że z nas obu jedną wziąłem radę."
    verse: true
    chunks:
      - pl: "Mistrz: «Gdybym szkłem był podszytym ołowiem,"
        ru: "Учитель: «Будь я стеклом, подбитым свинцом,"
        note: "szkło — стекло; ołów — свинец; то есть зеркалом"
      - pl: "\nPrędzej bym twego nie odbił obrazu,"
        ru: "я быстрее не отразил бы твоего образа,"
      - pl: "\nJak w głąb twej duszy zajrzałem od razu:"
        ru: "чем сразу заглянул в глубину твоей души:"
      - pl: "\nW tej chwili myśli twoje nie spostrzegły,"
        ru: "в этот миг твои мысли не заметили,"
      - pl: "\nJak jednolice przez moje przebiegły,"
        ru: "как совпадающие, пронеслись через мои,"
        note: "jednolicy — одинаковый"
      - pl: "\nTak że z nas obu jedną wziąłem radę."
        ru: "так что из нас обоих я принял одно решение."
    words: { "szkłem": szklo, "podszytym": podszyc, "Prędzej": predko, "głąb": glab, "zajrzałem": zajrzec, "spostrzegły": spostrzec }
  - clean: "Jeśli ta skała tak na dół się kłoni,\nŻe po niej zstąpim na drugą arkadę,\nUmkniem rojonej przez ciebie pogoni».\nLedwo swe zdanie wyrzekł mistrz kochany,\nBiegły spragnione nas dognać szatany,\nA grzmiał skrzydłami ich legijon czarny."
    verse: true
    chunks:
      - pl: "Jeśli ta skała tak na dół się kłoni,"
        ru: "Если эта скала так склоняется вниз,"
      - pl: "\nŻe po niej zstąpim na drugą arkadę,"
        ru: "что по ней мы спустимся к следующей арке,"
      - pl: "\nUmkniem rojonej przez ciebie pogoni»."
        ru: "мы ускользнём от погони, что тебе мерещится»."
        note: "umkniem — устар. «ускользнём»; rojony — воображаемый"
      - pl: "\nLedwo swe zdanie wyrzekł mistrz kochany,"
        ru: "Едва учитель дорогой произнёс своё мнение,"
      - pl: "\nBiegły spragnione nas dognać szatany,"
        ru: "прибежали бесы, жаждущие нас догнать,"
        note: "dognać — догнать"
      - pl: "\nA grzmiał skrzydłami ich legijon czarny."
        ru: "и гремел крыльями их чёрный легион."
    words: { "Ledwo": ledwo, "mistrz": mistrz, "Biegły": biec, "spragnione": spragniony, "czarny": czarny }
  - clean: "Mistrz mnie co prędzej w objęcia porywa;\nTak matka w nocy, kiedy blask pożarny\nZaświeci w okna, z pościeli się zrywa,\nChwyta swe dziecko i w jednej koszuli\nWychodząc bosa, w swój rąbek je tuli.\nMistrz w dół ze skały, jak stoczona wstęga,\nŚliznął się grzbietem do drugiego kręgu;\nNie jest tak szybki prąd wody u młyna,\nGdy ją na koło pędzi wąska rynna,\nJak on się stoczył, tuląc mnie jak syna."
    verse: true
    chunks:
      - pl: "Mistrz mnie co prędzej w objęcia porywa;"
        ru: "Учитель как можно скорее хватает меня в объятия;"
        note: "co prędzej — как можно скорее"
      - pl: "\nTak matka w nocy, kiedy blask pożarny"
        ru: "так мать ночью, когда отблеск пожара"
      - pl: "\nZaświeci w okna, z pościeli się zrywa,"
        ru: "засветит в окна, вскакивает с постели,"
      - pl: "\nChwyta swe dziecko i w jednej koszuli"
        ru: "хватает своё дитя и в одной рубашке,"
      - pl: "\nWychodząc bosa, w swój rąbek je tuli."
        ru: "выходя босая, укутывает его в подол."
        note: "rąbek — подол, край одежды"
      - pl: "\nMistrz w dół ze skały, jak stoczona wstęga,"
        ru: "Учитель вниз со скалы, как скатившаяся лента,"
        note: "wstęga — лента"
      - pl: "\nŚliznął się grzbietem do drugiego kręgu;"
        ru: "соскользнул спиной к следующему кругу;"
      - pl: "\nNie jest tak szybki prąd wody u młyna,"
        ru: "не так быстро течение воды у мельницы,"
      - pl: "\nGdy ją na koło pędzi wąska rynna,"
        ru: "когда её на колесо гонит узкий жёлоб,"
        note: "rynna — жёлоб"
      - pl: "\nJak on się stoczył, tuląc mnie jak syna."
        ru: "как он скатился, прижимая меня, как сына."
    words: { "blask": blask, "koszuli": koszula, "grzbietem": grzbiet, "prąd": prad, "koło": kolo, "pędzi": pedzic }
  - clean: "Ledwo dotknąłem stopą dna otchłani,\nNad nami stali na skale szatani;\nLecz o nich mało dbała moja troska,\nBo dając w zarząd im Opatrzność boska\nKrąg piąty, kres ich wskazała potęgi,\nAby nie śmieli w inne wkraczać kręgi."
    verse: true
    chunks:
      - pl: "Ledwo dotknąłem stopą dna otchłani,"
        ru: "Едва я коснулся ногой дна бездны,"
      - pl: "\nNad nami stali na skale szatani;"
        ru: "над нами на скале стояли бесы;"
      - pl: "\nLecz o nich mało dbała moja troska,"
        ru: "но о них мало заботилась моя тревога,"
      - pl: "\nBo dając w zarząd im Opatrzność boska"
        ru: "ибо, дав им в управление пятый круг,"
        note: "zarząd — управление"
      - pl: "\nKrąg piąty, kres ich wskazała potęgi,"
        ru: "Божественный Промысел указал предел их власти,"
        note: "Opatrzność — Провидение"
      - pl: "\nAby nie śmieli w inne wkraczać kręgi."
        ru: "чтобы они не смели вступать в другие круги."
    words: { "dotknąłem": dotknac, "dbała": dbac, "zarząd": zarzad, "kres": kres, "wskazała": wskazac, "potęgi": potega }
  - clean: "Tam napotkałem nową trzodę ludu:\nDuchy barwione szły leniwym krokiem,\nPłakały, mdlały z boleści i trudu;\nGłęboki kaptur zwisał nad ich okiem.\nNa wzór kolońskich skrojony kapturów\nKapice zewnątrz lśnią od złotych sznurów\nA poły ołów podszywa ciężący."
    verse: true
    chunks:
      - pl: "Tam napotkałem nową trzodę ludu:"
        ru: "Там я встретил новое стадо народа:"
      - pl: "\nDuchy barwione szły leniwym krokiem,"
        ru: "крашеные духи шли медленным шагом,"
        note: "barwiony — крашеный"
      - pl: "\nPłakały, mdlały z boleści i trudu;"
        ru: "плакали, изнемогали от боли и труда;"
      - pl: "\nGłęboki kaptur zwisał nad ich okiem."
        ru: "глубокий капюшон свисал над их глазами."
      - pl: "\nNa wzór kolońskich skrojony kapturów"
        ru: "Скроенные по образцу кёльнских капюшонов,"
        note: "koloński — кёльнский; skrojony — скроенный"
      - pl: "\nKapice zewnątrz lśnią od złotych sznurów"
        ru: "плащи снаружи блестят от золотых шнуров,"
        note: "kapica — устар. «плащ с капюшоном»"
      - pl: "\nA poły ołów podszywa ciężący."
        ru: "а полы подбивает тяжёлый свинец."
    words: { "napotkałem": napotkac, "trzodę": trzoda, "leniwym": leniwy, "trudu": trud, "wzór": wzor, "podszywa": podszywac }
  - clean: "Za Fryderyka kapica znajoma\nPrzy tych byłaby tak lekka jak słoma.\nO, zbyt na wieczność płaszczu mordujący\nNa lewo szliśmy z takimi duchami,\nSłuchając jęków, cierpiąc nad ich łzami.\nCi nieszczęśliwi ciężarem zgarbieni\nSzli tak leniwo i ślimaczym ruchem,\nŻe wciąż się z nowym spotykałem duchem."
    verse: true
    chunks:
      - pl: "Za Fryderyka kapica znajoma"
        ru: "Знакомый плащ времён Фридриха"
        note: "свинцовые плащи, которыми казнил Фридрих II"
      - pl: "\nPrzy tych byłaby tak lekka jak słoma."
        ru: "рядом с этими был бы лёгок, как солома."
      - pl: "\nO, zbyt na wieczność płaszczu mordujący"
        ru: "О, слишком изнурительный на вечность плащ!"
        note: "mordujący — изнурительный"
      - pl: "\nNa lewo szliśmy z takimi duchami,"
        ru: "Мы шли налево с такими духами,"
      - pl: "\nSłuchając jęków, cierpiąc nad ich łzami."
        ru: "слушая стоны, страдая над их слезами."
      - pl: "\nCi nieszczęśliwi ciężarem zgarbieni"
        ru: "Эти несчастные, сгорбленные тяжестью,"
        note: "zgarbiony — сгорбленный"
      - pl: "\nSzli tak leniwo i ślimaczym ruchem,"
        ru: "шли так медленно и улиточьим движением,"
        note: "ślimaczy — улиточий"
      - pl: "\nŻe wciąż się z nowym spotykałem duchem."
        ru: "что я всё время встречался с новым духом."
    words: { "lekka": lekki, "wieczność": wiecznosc, "płaszczu": plaszcz, "łzami": lza, "nieszczęśliwi": nieszczesliwy, "ciężarem": ciezar }
  - clean: "Rzekłem: «Mój wodzu, może wśród tych cieni\nSą jacy sławni czynem lub imieniem?\nIdąc, nawiasem wskaż ich mi spojrzeniem».\nJeden, toskańskiej słysząc mowy brzmienie,\nZakrzyknął za mną: «Wstrzymajcie swe kroki\nWy, co tak szybko idziecie w tym ciemnie;\nTy zaś, co pytasz, możesz sam ode mnie\nSłyszeć odpowiedź». I wódz mój bez zwłoki\nStanął i mówił: «Zaczekajmy chwilę,\nKrok z jego krokiem zgadzaj ile tyle»."
    verse: true
    chunks:
      - pl: "Rzekłem: «Mój wodzu, może wśród tych cieni"
        ru: "Я сказал: «Мой вождь, может, среди этих теней"
      - pl: "\nSą jacy sławni czynem lub imieniem?"
        ru: "есть кто-нибудь, славный делом или именем?"
      - pl: "\nIdąc, nawiasem wskaż ich mi spojrzeniem»."
        ru: "Идя, мимоходом укажи мне их взглядом»."
        note: "nawiasem — мимоходом"
      - pl: "\nJeden, toskańskiej słysząc mowy brzmienie,"
        ru: "Один, услышав звук тосканской речи,"
        note: "brzmienie — звучание"
      - pl: "\nZakrzyknął za mną: «Wstrzymajcie swe kroki"
        ru: "закричал мне вслед: «Остановите свои шаги,"
      - pl: "\nWy, co tak szybko idziecie w tym ciemnie;"
        ru: "вы, что так быстро идёте в этой тьме;"
        note: "ciemń — устар. «тьма»"
      - pl: "\nTy zaś, co pytasz, możesz sam ode mnie"
        ru: "ты же, кто спрашивает, можешь сам от меня"
      - pl: "\nSłyszeć odpowiedź». I wódz mój bez zwłoki"
        ru: "услышать ответ». И мой вождь без промедления"
        note: "zwłoka — промедление"
      - pl: "\nStanął i mówił: «Zaczekajmy chwilę,"
        ru: "остановился и сказал: «Подождём минуту,"
      - pl: "\nKrok z jego krokiem zgadzaj ile tyle»."
        ru: "сообразуй свой шаг с его шагом, сколько можно»."
        note: "ile tyle — сколько можно"
    words: { "wodzu": wodz, "sławni": slawny, "czynem": czyn, "Wstrzymajcie": wstrzymac, "Stanął": stanac, "Krok": krok }
  - clean: "Krok mój wstrzymałem i widzę dwa cienie,\nChęć ich być ze mną zdradzało spojrzenie;\nPoszedłszy ciężkim od ciężaru krokiem\nPatrzyły na mnie zezowatym okiem,\nMilcząc, a potem tak mówiły z sobą:\n«On jest, zaiste, żyjącą osobą,\nO ile wnoszę z ruchów jego garła;\nGdyby szła tędy para cieniów zmarła,\nJakiż przywilej ich, w tym miejscu zwłaszcza,\nIść upoważnił bez ciężkiego płaszcza?»"
    verse: true
    chunks:
      - pl: "Krok mój wstrzymałem i widzę dwa cienie,"
        ru: "Я сдержал шаг и вижу две тени,"
      - pl: "\nChęć ich być ze mną zdradzało spojrzenie;"
        ru: "их желание быть со мной выдавал взгляд;"
      - pl: "\nPoszedłszy ciężkim od ciężaru krokiem"
        ru: "подойдя тяжёлым от тяжести шагом,"
      - pl: "\nPatrzyły na mnie zezowatym okiem,"
        ru: "они смотрели на меня косым глазом,"
        note: "zezowaty — косой"
      - pl: "\nMilcząc, a potem tak mówiły z sobą:"
        ru: "молча, а потом так говорили между собой:"
      - pl: "\n«On jest, zaiste, żyjącą osobą,"
        ru: "«Он, воистину, живое лицо,"
      - pl: "\nO ile wnoszę z ruchów jego garła;"
        ru: "насколько заключаю по движениям его горла;"
        note: "wnosić — заключать; gardło — горло"
      - pl: "\nGdyby szła tędy para cieniów zmarła,"
        ru: "если бы здесь шла мёртвая пара теней,"
      - pl: "\nJakiż przywilej ich, w tym miejscu zwłaszcza,"
        ru: "какая же привилегия, особенно в этом месте,"
      - pl: "\nIść upoważnił bez ciężkiego płaszcza?»"
        ru: "позволила бы им идти без тяжёлого плаща?»"
        note: "upoważnić — уполномочить"
    words: { "zdradzało": zdradzac, "Milcząc": milczec, "tędy": tedy, "cieniów": cien, "Jakiż": jakiz, "przywilej": przywilej }
  - clean: "A potem do mnie: «Ty, co z gór twych szczytów\nZstąpiłeś w zbór nasz, smutnych hipokrytów,\nKto jesteś? Nie gardź, odpowiedz mi, proszę».\nA ja: «Gdzie płyną pięknej Arny wody,\nTam życie wziąłem, spędziłem wiek młody,\nZ całych Włoch może w najpiękniejszym mieście."
    verse: true
    chunks:
      - pl: "A potem do mnie: «Ty, co z gór twych szczytów"
