chapter: 9
chapterTitle: Opowieść Niby-Żółwia
chapterTitleRu: Повесть Мнимой Черепахи
level: B1
paragraphs:
  - clean: "„Nie masz pojęcia, jak się cieszę, że cię znowu widzę, moje ty kochanie!”, powiedziała Księżna, wsuwając czule swoje ramię pod ramię Alicji, i poszły razem dalej."
    en: "“You can’t think how glad I am to see you again, you dear old thing!” said the Duchess, as she tucked her arm affectionately into Alice’s, and they walked off together."
    chunks:
      - pl: "„Nie masz pojęcia, jak się cieszę, że cię znowu widzę, moje ty kochanie!”, powiedziała Księżna,"
        ru: "«Ты не представляешь, как я рада снова тебя видеть, моя дорогая!» — сказала Герцогиня,"
        note: "nie masz pojęcia — ты не представляешь: родительный падеж"
      - pl: " wsuwając czule swoje ramię pod ramię Alicji, i poszły razem dalej."
        ru: "нежно просунув свою руку под руку Алисы, и они пошли дальше вместе."
        note: "wsunąć ramię pod ramię — взять под руку"
    words: { "pojęcia": pojac, "cieszę": cieszyc, "znowu": znowu, "ramię": ramie, "dalej": dalej }
  - clean: "Alicja bardzo się ucieszyła, że zastała ją w tak miłym usposobieniu, i pomyślała sobie, że może to tylko pieprz sprawił, że była taka zajadła, kiedy spotkały się w kuchni."
    en: "Alice was very glad to find her in such a pleasant temper, and thought to herself that perhaps it was only the pepper that had made her so savage when they met in the kitchen."
    chunks:
      - pl: "Alicja bardzo się ucieszyła, że zastała ją w tak miłym usposobieniu,"
        ru: "Алиса очень обрадовалась, застав её в таком приятном расположении духа,"
        note: "usposobienie — расположение духа, настроение"
      - pl: " i pomyślała sobie, że może to tylko pieprz sprawił, że była taka zajadła, kiedy spotkały się w kuchni."
        ru: "и подумала про себя, что, может быть, это только перец сделал её такой свирепой, когда они встретились в кухне."
        note: "sprawić, że — сделать так, что"
    words: { "pomyślała": pomyslec, "pieprz": pieprzyc, "sprawił": sprawic, "była": byly, "kuchni": kuchnia }
  - clean: "„Kiedy ja będę Księżną”, powiedziała sobie (choć niezbyt pełnym nadziei tonem), „nie będę miała w kuchni ani odrobiny pieprzu. Zupa doskonale się bez niego obywa. Może to zawsze pieprz sprawia, że ludzie są porywczy”, ciągnęła, bardzo zadowolona, że odkryła nowy rodzaj prawidła, „a ocet sprawia, że są kwaśni — a rumianek, że są gorzcy — a… a cukierki jęczmienne i takie rzeczy sprawiają, że dzieci są słodkie. Chciałabym tylko, żeby ludzie o tym wiedzieli: wtedy nie byliby tacy skąpi w tych sprawach, wiecie—”"
    en: "“When _I’m_ a Duchess,” she said to herself, (not in a very hopeful tone though), “I won’t have any pepper in my kitchen _at all_. Soup does very well without—Maybe it’s always pepper that makes people hot-tempered,” she went on, very much pleased at having found out a new kind of rule, “and vinegar that makes them sour—and camomile that makes them bitter—and—and barley-sugar and such things that make children sweet-tempered. I only wish people knew _that_: then they wouldn’t be so stingy about it, you know—”"
    chunks:
      - pl: "„Kiedy ja będę Księżną”, powiedziała sobie (choć niezbyt pełnym nadziei tonem),"
        ru: "«Когда я буду Герцогиней, — сказала она себе (правда, не слишком обнадёженным тоном), —"
        note: "będę Księżną — буду Герцогиней: при być именная часть в творительном"
      - pl: " „nie będę miała w kuchni ani odrobiny pieprzu."
        ru: "у меня на кухне не будет ни крупинки перца."
        note: "ani odrobiny — ни капельки: родительный при отрицании"
      - pl: " Zupa doskonale się bez niego obywa."
        ru: "Суп прекрасно без него обходится."
        note: "obywać się bez czegoś — обходиться без чего-л.: bez и родительный"
      - pl: " Może to zawsze pieprz sprawia, że ludzie są porywczy”, ciągnęła, bardzo zadowolona, że odkryła nowy rodzaj prawidła,"
        ru: "Может, это всегда перец делает людей вспыльчивыми», — продолжала она, очень довольная тем, что открыла новый род правила,"
        note: "porywczy — вспыльчивый"
      - pl: " „a ocet sprawia, że są kwaśni — a rumianek, że są gorzcy —"
        ru: "«а уксус делает их кислыми — а ромашка горькими —"
        note: "kwaśny / gorzki — кислый / горький"
      - pl: " a… a cukierki jęczmienne i takie rzeczy sprawiają, że dzieci są słodkie."
        ru: "а… а ячменные леденцы и подобные вещи делают детей сладкими."
        note: "cukierki jęczmienne — ячменные леденцы"
      - pl: " Chciałabym tylko, żeby ludzie o tym wiedzieli: wtedy nie byliby tacy skąpi w tych sprawach, wiecie—”"
        ru: "Хотела бы я только, чтобы люди об этом знали: тогда они не были бы так скупы на это, знаете ли—»"
        note: "skąpy — скупой"
    words: { "niezbyt": niezbyt, "pełnym": pelny, "nadziei": nadzieja, "tonem": ton, "odrobiny": odrobina, "doskonale": doskonale, "sprawia": sprawiac, "zadowolona": zadowolony, "odkryła": odkryc, "rodzaj": rodzaj, "gorzcy": gorzki, "słodkie": slodki, "wtedy": wtedy }
  - clean: "Zupełnie już zapomniała o Księżnej i trochę się przestraszyła, gdy usłyszała jej głos tuż przy uchu. „Myślisz o czymś, moja droga, i przez to zapominasz mówić. Nie mogę ci w tej chwili powiedzieć, jaki z tego morał, ale za momencik sobie przypomnę.”"
    en: "She had quite forgotten the Duchess by this time, and was a little startled when she heard her voice close to her ear. “You’re thinking about something, my dear, and that makes you forget to talk. I can’t tell you just now what the moral of that is, but I shall remember it in a bit.”"
    chunks:
      - pl: "Zupełnie już zapomniała o Księżnej i trochę się przestraszyła, gdy usłyszała jej głos tuż przy uchu."
        ru: "Она совсем уже забыла о Герцогине и немного испугалась, когда услышала её голос прямо возле уха."
        note: "zapomnieć o kimś — забыть о ком-л.: o и предложный"
      - pl: " „Myślisz o czymś, moja droga, i przez to zapominasz mówić."
        ru: "«Ты о чём-то думаешь, моя дорогая, и из-за этого забываешь говорить."
        note: "przez to — из-за этого: przez и винительный"
      - pl: " Nie mogę ci w tej chwili powiedzieć, jaki z tego morał, ale za momencik sobie przypomnę.”"
        ru: "Не могу тебе сейчас сказать, какова из этого мораль, но через минутку припомню.»"
        note: "morał z czegoś — мораль из чего-л.: z и родительный"
    words: { "Zupełnie": zupelnie, "zapomniała": zapomniec, "przestraszyła": przestraszyc, "usłyszała": uslyszec, "głos": glos, "tuż": tuz, "uchu": ucho, "zapominasz": zapominac, "przypomnę": przypomniec }
  - clean: "„Może wcale go nie ma”, odważyła się zauważyć Alicja."
    en: "“Perhaps it hasn’t one,” Alice ventured to remark."
    chunks:
      - pl: "„Może wcale go nie ma”, odważyła się zauważyć Alicja."
        ru: "«Может быть, её вовсе нет», — отважилась заметить Алиса."
        note: "nie ma go — его нет: родительный при отрицании"
    words: { "wcale": wcale, "zauważyć": zauwazyc }
  - clean: "„Ejże, ejże, dziecko!”, powiedziała Księżna. „Wszystko ma swój morał, byle tylko umieć go znaleźć.” I mówiąc to, przycisnęła się jeszcze bliżej do boku Alicji."
    en: "“Tut, tut, child!” said the Duchess. “Everything’s got a moral, if only you can find it.” And she squeezed herself up closer to Alice’s side as she spoke."
    chunks:
      - pl: "„Ejże, ejże, dziecko!”, powiedziała Księżna. „Wszystko ma swój morał, byle tylko umieć go znaleźć.”"
        ru: "«Ну-ну, дитя!» — сказала Герцогиня. «У всего есть своя мораль, лишь бы уметь её найти.»"
        note: "byle tylko — лишь бы только"
      - pl: " I mówiąc to, przycisnęła się jeszcze bliżej do boku Alicji."
        ru: "И, говоря это, она прижалась ещё ближе к боку Алисы."
        note: "przycisnąć się do czegoś — прижаться к чему-л.: do и родительный"
    words: { "umieć": umiec, "bliżej": blisko, "boku": bok }
  - clean: "Alicji niezbyt się podobało to bliskie sąsiedztwo: po pierwsze dlatego, że Księżna była bardzo brzydka; a po drugie dlatego, że miała akurat odpowiedni wzrost, żeby oprzeć brodę na ramieniu Alicji, a broda była niewygodnie ostra. Nie chciała jednak być niegrzeczna, więc znosiła to, jak mogła."
    en: "Alice did not much like keeping so close to her: first, because the Duchess was _very_ ugly; and secondly, because she was exactly the right height to rest her chin upon Alice’s shoulder, and it was an uncomfortably sharp chin. However, she did not like to be rude, so she bore it as well as she could."
    chunks:
      - pl: "Alicji niezbyt się podobało to bliskie sąsiedztwo:"
        ru: "Алисе не очень нравилось это близкое соседство:"
        note: "podobać się komuś — нравиться кому-л.: дательный падеж"
      - pl: " po pierwsze dlatego, że Księżna była bardzo brzydka;"
        ru: "во-первых, потому что Герцогиня была очень некрасива;"
        note: "po pierwsze — во-первых"
      - pl: " a po drugie dlatego, że miała akurat odpowiedni wzrost, żeby oprzeć brodę na ramieniu Alicji, a broda była niewygodnie ostra."
        ru: "а во-вторых, потому что она была как раз подходящего роста, чтобы опереть подбородок на плечо Алисы, а подбородок был неудобно острый."
        note: "oprzeć coś na czymś — опереть что-л. на что-л.: na и предложный"
      - pl: " Nie chciała jednak być niegrzeczna, więc znosiła to, jak mogła."
        ru: "Однако она не хотела быть невежливой, поэтому терпела это как могла."
        note: "znosić coś — терпеть, выносить что-л."
    words: { "podobało": podobac, "bliskie": bliski, "drugie": drugi, "odpowiedni": odpowiedni, "oprzeć": oprzec, "brodę": broda, "ostra": ostry, "znosiła": znosic }
  - clean: "„Gra idzie teraz trochę lepiej”, powiedziała, żeby jakoś podtrzymać rozmowę."
    en: "“The game’s going on rather better now,” she said, by way of keeping up the conversation a little."
    chunks:
      - pl: "„Gra idzie teraz trochę lepiej”, powiedziała, żeby jakoś podtrzymać rozmowę."
        ru: "«Игра идёт теперь немного лучше», — сказала она, чтобы как-то поддержать разговор."
        note: "podtrzymać rozmowę — поддержать разговор"
    words: { "Gra": grac, "jakoś": jakos, "rozmowę": rozmowa }
  - clean: "„Tak jest”, powiedziała Księżna; „a morał z tego taki: «Ach, to miłość, to miłość sprawia, że świat się kręci!»”"
    en: "“’Tis so,” said the Duchess: “and the moral of that is—‘Oh, ’tis love, ’tis love, that makes the world go round!’”"
    chunks:
      - pl: "„Tak jest”, powiedziała Księżna; „a morał z tego taki: «Ach, to miłość, to miłość sprawia, że świat się kręci!»”"
        ru: "«Так и есть», — сказала Герцогиня; «а мораль из этого такая: «Ах, это любовь, это любовь заставляет мир вертеться!»»"
        note: "świat się kręci — мир вертится"
    words: { "miłość": milosc, "kręci": krecic }
  - clean: "„Ktoś mówił”, szepnęła Alicja, „że dzieje się tak dlatego, że każdy pilnuje własnego nosa!”"
    en: "“Somebody said,” Alice whispered, “that it’s done by everybody minding their own business!”"
    chunks:
      - pl: "„Ktoś mówił”, szepnęła Alicja, „że dzieje się tak dlatego, że każdy pilnuje własnego nosa!”"
        ru: "«Кто-то говорил, — прошептала Алиса, — что так происходит оттого, что каждый суёт нос только в своё дело!»"
        note: "pilnować własnego nosa — не совать нос в чужие дела: отсылка к словам Księżnej из главы 6"
    words: { "dzieje": dzieje, "pilnuje": pilnowac, "własnego": wlasny, "nosa": nos }
  - clean: "„Ach, cóż! To znaczy mniej więcej to samo”, powiedziała Księżna, wbijając swój ostry podbródek w ramię Alicji, i dodała: „a morał z tego taki: «Dbaj o sens, a dźwięki zadbają o siebie same.»”"
    en: "“Ah, well! It means much the same thing,” said the Duchess, digging her sharp little chin into Alice’s shoulder as she added, “and the moral of _that_ is—‘Take care of the sense, and the sounds will take care of themselves.’”"
    chunks:
      - pl: "„Ach, cóż! To znaczy mniej więcej to samo”, powiedziała Księżna, wbijając swój ostry podbródek w ramię Alicji,"
        ru: "«Ах, что ж! Это значит примерно то же самое», — сказала Герцогиня, вонзая свой острый подбородок в плечо Алисы,"
        note: "wbijać coś w coś — вонзать что-л. во что-л.: w и винительный"
      - pl: " i dodała: „a morał z tego taki: «Dbaj o sens, a dźwięki zadbają o siebie same.»”"
        ru: "и добавила: «а мораль из этого такая: «Заботься о смысле, а звуки позаботятся о себе сами.»»"
        note: "Герцогиня выворачивает английскую поговорку о том, что надо беречь пенсы, а фунты сберегут себя сами. По-польски за этой фразой никакой пословицы не слышно, так что шутка держится на самой нелепости совета."
    words: { "mniej": malo, "więcej": wiecej, "dodała": dodac, "Dbaj": dbac, "sens": sens, "dźwięki": dzwiek }
  - clean: "„Jakże ona lubi znajdować we wszystkim morały!”, pomyślała sobie Alicja."
    en: "“How fond she is of finding morals in things!” Alice thought to herself."
    chunks:
      - pl: "„Jakże ona lubi znajdować we wszystkim morały!”, pomyślała sobie Alicja."
        ru: "«Как же она любит находить во всём мораль!» — подумала про себя Алиса."
        note: "jakże — как же: усилительная частица -że"
    words: { "Jakże": jakze, "znajdować": znajdowac, "wszystkim": wszyscy }
  - clean: "„Pewnie się zastanawiasz, dlaczego nie obejmę cię ramieniem w pasie”, powiedziała Księżna po chwili milczenia; „powód jest taki, że nie jestem pewna usposobienia twojego flaminga. Mam spróbować?”"
    en: "“I dare say you’re wondering why I don’t put my arm round your waist,” the Duchess said after a pause: “the reason is, that I’m doubtful about the temper of your flamingo. Shall I try the experiment?”"
    chunks:
      - pl: "„Pewnie się zastanawiasz, dlaczego nie obejmę cię ramieniem w pasie”, powiedziała Księżna po chwili milczenia;"
        ru: "«Ты, верно, недоумеваешь, почему я не обниму тебя за талию», — сказала Герцогиня после паузы;"
        note: "obejmować kogoś w pasie — обнимать кого-л. за талию"
      - pl: " „powód jest taki, że nie jestem pewna usposobienia twojego flaminga. Mam spróbować?”"
        ru: "«причина та, что я не уверена в нраве твоего фламинго. Мне попробовать?»"
        note: "pewny czegoś — уверенный в чём-л.: родительный падеж"
    words: { "zastanawiasz": zastanawiac, "obejmę": objac, "pasie": pasc, "powód": powod, "pewna": pewien, "spróbować": sprobowac }
  - clean: "„Mógłby ugryźć”, odpowiedziała ostrożnie Alicja, wcale nie paląc się do tego, żeby próba została podjęta."
    en: "“He might bite,” Alice cautiously replied, not feeling at all anxious to have the experiment tried."
    chunks:
      - pl: "„Mógłby ugryźć”, odpowiedziała ostrożnie Alicja, wcale nie paląc się do tego, żeby próba została podjęta."
        ru: "«Он мог бы укусить», — осторожно ответила Алиса, вовсе не горя желанием, чтобы попытка была предпринята."
        note: "palić się do czegoś — гореть желанием чего-л.: do и родительный"
    words: { "odpowiedziała": odpowiedziec, "ostrożnie": ostroznie, "paląc": palic, "próba": proba, "podjęta": podjac }
  - clean: "„Bardzo słusznie”, powiedziała Księżna; „flamingi i musztarda oba gryzą. A morał z tego taki: «Ciągnie swój do swego.»”"
    en: "“Very true,” said the Duchess: “flamingoes and mustard both bite. And the moral of that is—‘Birds of a feather flock together.’”"
    chunks:
      - pl: "„Bardzo słusznie”, powiedziała Księżna; „flamingi i musztarda oba gryzą."
        ru: "«Очень верно», — сказала Герцогиня; «фламинго и горчица оба кусаются."
        note: "gryźć — кусать; о горчице — «щипать, драть»"
      - pl: " A morał z tego taki: «Ciągnie swój do swego.»”"
        ru: "А мораль из этого такая: «Тянется свой к своему.»»"
        note: "Ciągnie swój do swego — польская пословица, отвечающая английской Birds of a feather flock together"
  - clean: "„Tylko że musztarda to nie ptak”, zauważyła Alicja."
    en: "“Only mustard isn’t a bird,” Alice remarked."
    chunks:
      - pl: "„Tylko że musztarda to nie ptak”, zauważyła Alicja."
        ru: "«Только горчица — не птица», — заметила Алиса."
        note: "to nie ptak — не птица: to в роли связки"
    words: { "ptak": ptak }
  - clean: "„Słusznie, jak zwykle”, powiedziała Księżna; „jakże jasno potrafisz rzeczy ujmować!”"
    en: "“Right, as usual,” said the Duchess: “what a clear way you have of putting things!”"
    chunks:
      - pl: "„Słusznie, jak zwykle”, powiedziała Księżna; „jakże jasno potrafisz rzeczy ujmować!”"
        ru: "«Верно, как всегда», — сказала Герцогиня; «как же ясно ты умеешь излагать!»"
        note: "ujmować coś — излагать, формулировать что-л."
    words: { "zwykle": zwykle, "potrafisz": potrafic }
  - clean: "„To minerał, tak mi się zdaje”, powiedziała Alicja."
    en: "“It’s a mineral, I _think_,” said Alice."
    chunks:
      - pl: "„To minerał, tak mi się zdaje”, powiedziała Alicja."
        ru: "«Это минерал, так мне кажется», — сказала Алиса."
        note: "zdaje mi się — мне кажется"
    words: { "zdaje": zdawac }
  - clean: "„Oczywiście, że tak”, powiedziała Księżna, która zdawała się gotowa zgodzić się ze wszystkim, co Alicja mówiła; „niedaleko stąd jest wielka kopalnia musztardy. A morał z tego taki: «Im więcej jest mojego, tym mniej jest twojego.»”"
    en: "“Of course it is,” said the Duchess, who seemed ready to agree to everything that Alice said; “there’s a large mustard-mine near here. And the moral of that is—‘The more there is of mine, the less there is of yours.’”"
    chunks:
      - pl: "„Oczywiście, że tak”, powiedziała Księżna, która zdawała się gotowa zgodzić się ze wszystkim, co Alicja mówiła;"
        ru: "«Конечно же да», — сказала Герцогиня, которая казалась готовой согласиться со всем, что Алиса говорила;"
        note: "zgodzić się z czymś — согласиться с чем-л.: z и творительный"
