      - pl: "„Dość już o lekcjach”, przerwał Gryf bardzo stanowczym tonem; „opowiedz jej teraz coś o zabawach.”"
        ru: "«Довольно уже об уроках», — перебил Грифон очень решительным тоном; «расскажи ей теперь что-нибудь об играх.»"
        note: "dość już o czymś — довольно уже о чём-л.: o и предложный"
