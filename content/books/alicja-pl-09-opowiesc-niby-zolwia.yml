title: Przygody Alicji w Krainie Czarów
titleRu: Приключения Алисы в Стране чудес
author: Lewis Carroll
translator: "перевод на польский — черновик, требует проверки носителем"
source:
  name: Project Gutenberg (оригинал 1865 г.)
