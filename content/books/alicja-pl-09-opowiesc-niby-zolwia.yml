  - clean: "Wkrótce natknęły się na Gryfa, który leżał w słońcu, pogrążony w głębokim śnie. (Jeśli nie wiecie, co to Gryf, spójrzcie na obrazek.) „Wstawaj, leniu!”, powiedziała Królowa, „i zaprowadź tę młodą damę do Niby-Żółwia, żeby usłyszała jego dzieje. Ja muszę wracać i dopilnować kilku egzekucji, które zarządziłam”; i odeszła, zostawiając Alicję samą z Gryfem. Alicji niezbyt podobał się wygląd tego stworzenia, ale w sumie pomyślała, że zostać z nim będzie równie bezpiecznie jak iść za tą zajadłą Królową: czekała więc."
