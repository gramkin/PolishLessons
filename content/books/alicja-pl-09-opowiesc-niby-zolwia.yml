  - clean: "Nie uszli daleko, gdy zobaczyli w oddali Niby-Żółwia, siedzącego smutno i samotnie na małej skalnej półce, a gdy podeszli bliżej, Alicja usłyszała, jak wzdycha, jakby mu się serce miało pęknąć. Bardzo jej go było żal. „Co go trapi?”, spytała Gryfa, a Gryf odpowiedział niemal tymi samymi słowami co przedtem: „To wszystko tylko jego wymysły: on nie ma żadnego zmartwienia, wiesz. Chodź!”"
