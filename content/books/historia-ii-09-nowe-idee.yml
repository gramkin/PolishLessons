  - clean: "Dmowski wybrał zupełnie inną drogę. Uważał, że w nadchodzącej wojnie Polacy powinni stanąć po stronie Rosji i jej sojuszników, Francji i Anglii, przeciwko Niemcom. Tak powstały dwie orientacje polityczne: proaustriacka, związana z Piłsudskim, i prorosyjska, związana z Dmowskim. Obie strony zarzucały sobie zdradę, ale paradoksalnie obie miały swój udział w odzyskaniu niepodległości. Piłsudski stworzył wojsko, a Dmowski przekonał zachodnich polityków, że Polska musi powstać. Przez kilkadziesiąt lat po odzyskaniu niepodległości spór między zwolennikami obu przywódców miał dzielić polską politykę. Kiedy latem 1914 roku wybuchła wojna, której tak długo oczekiwano, obaj byli gotowi. O tym, jak z tej wojny narodziła się niepodległa Polska, opowie następny rozdział."
