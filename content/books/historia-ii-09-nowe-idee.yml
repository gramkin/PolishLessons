  - clean: "Drugim wielkim nurtem nowej polityki był nacjonalizm. Jego najważniejszym ideologiem był Roman Dmowski, z wykształcenia biolog, z temperamentu polityk. W 1893 roku współtworzył tajną Ligę Narodową, a kilka lat później Stronnictwo Narodowo-Demokratyczne, którego zwolenników nazywano endekami, od pierwszych liter nazwy. W książce „Myśli nowoczesnego Polaka” z 1903 roku Dmowski pisał, że naród jest najwyższą wartością, a w polityce trzeba kierować się zdrowym egoizmem narodowym, a nie moralnymi ideałami. Krytykował romantyczną tradycję powstań i uważał, że Polacy muszą być twardzi i realistyczni jak ich sąsiedzi."
    draft: true
    chunks:
      - pl: "Drugim wielkim nurtem nowej polityki był nacjonalizm."
        ru: "Вторым большим течением новой политики был национализм."
        note: "nurt — течение"
      - pl: " Jego najważniejszym ideologiem był Roman Dmowski, z wykształcenia biolog, z temperamentu polityk."
        ru: "Его главным идеологом был Роман Дмовский, по образованию биолог, по темпераменту политик."
      - pl: " W 1893 roku współtworzył tajną Ligę Narodową, a kilka lat później Stronnictwo Narodowo-Demokratyczne, którego zwolenników nazywano endekami, od pierwszych liter nazwy."
        ru: "В 1893 году он стал одним из основателей тайной Национальной лиги, а несколько лет спустя — Национально-демократической партии, сторонников которой называли эндеками, по первым буквам названия."
      - pl: " W książce „Myśli nowoczesnego Polaka” z 1903 roku Dmowski pisał, że naród jest najwyższą wartością, a w polityce trzeba kierować się zdrowym egoizmem narodowym, a nie moralnymi ideałami."
        ru: "В книге «Мысли современного поляка» 1903 года Дмовский писал, что народ — высшая ценность, а в политике следует руководствоваться здоровым национальным эгоизмом, а не нравственными идеалами."
