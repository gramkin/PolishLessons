  - clean: "Nie wszyscy polscy socjaliści uważali niepodległość za cel. Socjaldemokracja Królestwa Polskiego i Litwy, w skrócie SDKPiL, uważała, że walka o niepodległe państwo odciąga robotników od walki klasowej. Polscy robotnicy mieli według niej walczyć razem z robotnikami rosyjskimi o rewolucję w całym imperium. Najwybitniejszą teoretyczką tej partii była Róża Luksemburg, urodzona w Zamościu w rodzinie żydowskiej, która później stała się jedną z przywódczyń niemieckiego ruchu komunistycznego. Została zamordowana w Berlinie w 1919 roku."
    draft: true
    chunks:
      - pl: "Nie wszyscy polscy socjaliści uważali niepodległość za cel."
        ru: "Не все польские социалисты считали целью независимость."
      - pl: " Socjaldemokracja Królestwa Polskiego i Litwy, w skrócie SDKPiL, uważała, że walka o niepodległe państwo odciąga robotników od walki klasowej."
        ru: "Социал-демократия Королевства Польского и Литвы, сокращённо СДКПиЛ, считала, что борьба за независимое государство отвлекает рабочих от классовой борьбы."
        note: "walka klasowa — классовая борьба"
      - pl: " Polscy robotnicy mieli według niej walczyć razem z robotnikami rosyjskimi o rewolucję w całym imperium."
        ru: "Польские рабочие, по её мнению, должны были бороться вместе с русскими рабочими за революцию во всей империи."
      - pl: " Najwybitniejszą teoretyczką tej partii była Róża Luksemburg, urodzona w Zamościu w rodzinie żydowskiej, która później stała się jedną z przywódczyń niemieckiego ruchu komunistycznego."
        ru: "Самым выдающимся теоретиком этой партии была Роза Люксембург, родившаяся в Замостье в еврейской семье, которая позже стала одной из руководительниц немецкого коммунистического движения."
      - pl: " Została zamordowana w Berlinie w 1919 roku."
        ru: "Она была убита в Берлине в 1919 году."
