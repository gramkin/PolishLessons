      - pl: " Zaczął więc udawać chorobę psychiczną tak przekonująco, że przeniesiono go do szpitala dla obłąkanych w Petersburgu."
        ru: "Тогда он начал симулировать душевную болезнь так убедительно, что его перевели в больницу для душевнобольных в Петербурге."
        note: "udawać — притворяться, симулировать; obłąkany — душевнобольной"
      - pl: " Stamtąd, z pomocą polskiego lekarza, który był członkiem PPS, udało mu się uciec."
        ru: "Оттуда с помощью польского врача, члена ППС, ему удалось бежать."
