paragraphs:
  - clean: "Pod koniec XIX wieku na ziemiach polskich pojawiły się nowe idee polityczne, które miały zdecydować o losach kraju w XX wieku. Szybki rozwój przemysłu stworzył nową grupę społeczną: robotników fabrycznych. Pracowali po dwanaście godzin dziennie, mieszkali w nędzy i nie mieli żadnych praw. Wśród nich szybko rozpowszechniały się idee socjalistyczne. W 1882 roku Ludwik Waryński założył w Warszawie pierwszą polską partię robotniczą, nazwaną Proletariatem. Partia organizowała strajki i kółka samokształceniowe, a jej członkowie współpracowali z rosyjską organizacją rewolucyjną Narodnaja Wola. Policja szybko rozbiła Proletariat. W 1886 roku na stokach Cytadeli Warszawskiej powieszono czterech jego członków, a Waryński zmarł kilka lat później w twierdzy w Szlisselburgu."
    draft: true
    chunks:
      - pl: "Pod koniec XIX wieku na ziemiach polskich pojawiły się nowe idee polityczne, które miały zdecydować o losach kraju w XX wieku."
        ru: "В конце XIX века на польских землях появились новые политические идеи, которым предстояло определить судьбу страны в XX веке."
      - pl: " Szybki rozwój przemysłu stworzył nową grupę społeczną: robotników fabrycznych."
        ru: "Быстрое развитие промышленности создало новую социальную группу — фабричных рабочих."
      - pl: " Pracowali po dwanaście godzin dziennie, mieszkali w nędzy i nie mieli żadnych praw."
        ru: "Они работали по двенадцать часов в день, жили в нищете и не имели никаких прав."
      - pl: " Wśród nich szybko rozpowszechniały się idee socjalistyczne."
        ru: "Среди них быстро распространялись социалистические идеи."
      - pl: " W 1882 roku Ludwik Waryński założył w Warszawie pierwszą polską partię robotniczą, nazwaną Proletariatem."
        ru: "В 1882 году Людвик Варыньский основал в Варшаве первую польскую рабочую партию, названную «Пролетариат»."
      - pl: " Partia organizowała strajki i kółka samokształceniowe, a jej członkowie współpracowali z rosyjską organizacją rewolucyjną Narodnaja Wola."
        ru: "Партия организовывала забастовки и кружки самообразования, а её члены сотрудничали с русской революционной организацией «Народная воля»."
      - pl: " Policja szybko rozbiła Proletariat."
        ru: "Полиция быстро разгромила «Пролетариат»."
      - pl: " W 1886 roku na stokach Cytadeli Warszawskiej powieszono czterech jego członków, a Waryński zmarł kilka lat później w twierdzy w Szlisselburgu."
        ru: "В 1886 году на склонах Варшавской цитадели повесили четырёх его членов, а Варыньский умер несколько лет спустя в Шлиссельбургской крепости."
