        ru: "В юности он хотел стать священником, потом стал профессиональным революционером и провёл много лет в тюрьмах и ссылке."
      - pl: " Po rewolucji październikowej w 1917 roku stanął na czele Czeka, bolszewickiej policji politycznej, i stał się symbolem czerwonego terroru."
        ru: "После Октябрьской революции 1917 года он возглавил ВЧК, большевистскую политическую полицию, и стал символом красного террора."
        note: "terror — террор"
      - pl: " Jego pomnik, który przez wiele lat stał w Moskwie przed Łubianką, a także w Warszawie, został zburzony po upadku komunizmu."
        ru: "Его памятник, много лет стоявший в Москве перед Лубянкой, а также в Варшаве, был снесён после падения коммунизма."
