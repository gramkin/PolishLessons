  - clean: "Józef Piłsudski urodził się w 1867 roku w Zułowie pod Wilnem, w rodzinie zubożałej szlachty litewskiej. Matka wychowywała go w duchu romantycznego patriotyzmu i kultu powstania styczniowego. W gimnazjum w Wilnie przeżył upokorzenia rusyfikacji, które zapamiętał na całe życie. Studiował medycynę w Charkowie, ale wyrzucono go z uczelni za udział w studenckich protestach."
    draft: true
    chunks:
      - pl: "Józef Piłsudski urodził się w 1867 roku w Zułowie pod Wilnem, w rodzinie zubożałej szlachty litewskiej."
