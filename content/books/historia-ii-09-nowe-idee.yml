  - clean: "Po powrocie z zesłania Józef Piłsudski wstąpił do PPS i szybko stał się jednym z jej przywódców. W 1900 roku policja wykryła tajną drukarnię „Robotnika” w Łodzi i aresztowała go. Piłsudski wiedział, że grozi mu wiele lat więzienia. Zaczął więc udawać chorobę psychiczną tak przekonująco, że przeniesiono go do szpitala dla obłąkanych w Petersburgu. Stamtąd, z pomocą polskiego lekarza, który był członkiem PPS, udało mu się uciec. Historia ta przyczyniła się do jego legendy jako człowieka śmiałego i nieuchwytnego."
