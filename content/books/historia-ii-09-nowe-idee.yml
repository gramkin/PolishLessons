        note: "zubożały — обедневший"
      - pl: " Matka wychowywała go w duchu romantycznego patriotyzmu i kultu powstania styczniowego."
        ru: "Мать воспитывала его в духе романтического патриотизма и культа Январского восстания."
      - pl: " W gimnazjum w Wilnie przeżył upokorzenia rusyfikacji, które zapamiętał na całe życie."
        ru: "В виленской гимназии он пережил унижения русификации, которые запомнил на всю жизнь."
      - pl: " Studiował medycynę w Charkowie, ale wyrzucono go z uczelni za udział w studenckich protestach."
        ru: "Он изучал медицину в Харькове, но его исключили из университета за участие в студенческих протестах."
    words: { "romantycznego": romantyczny, "Studiował": studiowac, "medycynę": medycyna, "uczelni": uczelnia }
  - clean: "W 1887 roku los Piłsudskiego splótł się w niezwykły sposób z historią Rosji. Jego starszy brat Bronisław został zamieszany w spisek studentów petersburskich, którzy przygotowywali zamach na cara Aleksandra III. Przywódcą spisku był Aleksandr Uljanow, starszy brat Włodzimierza Lenina. Uljanowa powieszono, Bronisława skazano na katorgę na Sachalinie, a Józefa, który tylko pośrednio pomagał spiskowcom, zesłano na pięć lat na Syberię. Bronisław Piłsudski został na Sachalinie wybitnym badaczem kultury Ajnów, a jego nagrania ich mowy i pieśni są dziś bezcennym źródłem dla etnografów."
    draft: true
    chunks:
      - pl: "W 1887 roku los Piłsudskiego splótł się w niezwykły sposób z historią Rosji."
        ru: "В 1887 году судьба Пилсудского необычным образом переплелась с историей России."
        note: "spleść się — переплестись"
      - pl: " Jego starszy brat Bronisław został zamieszany w spisek studentów petersburskich, którzy przygotowywali zamach na cara Aleksandra III."
        ru: "Его старший брат Бронислав оказался замешан в заговоре петербургских студентов, готовивших покушение на царя Александра III."
        note: "zamieszany — замешанный"
      - pl: " Przywódcą spisku był Aleksandr Uljanow, starszy brat Włodzimierza Lenina."
        ru: "Руководителем заговора был Александр Ульянов, старший брат Владимира Ленина."
      - pl: " Uljanowa powieszono, Bronisława skazano na katorgę na Sachalinie, a Józefa, który tylko pośrednio pomagał spiskowcom, zesłano na pięć lat na Syberię."
        ru: "Ульянова повесили, Бронислава приговорили к каторге на Сахалине, а Юзефа, лишь косвенно помогавшего заговорщикам, сослали на пять лет в Сибирь."
        note: "pośrednio — косвенно"
      - pl: " Bronisław Piłsudski został na Sachalinie wybitnym badaczem kultury Ajnów, a jego nagrania ich mowy i pieśni są dziś bezcennym źródłem dla etnografów."
        ru: "Бронислав Пилсудский стал на Сахалине выдающимся исследователем культуры айнов, а его записи их речи и песен сегодня — бесценный источник для этнографов."
        note: "etnograf — этнограф"
