  - clean: "W 1892 roku na zjeździe w Paryżu polscy socjaliści założyli Polską Partię Socjalistyczną, w skrócie PPS. Jej program łączył dwa cele: sprawiedliwość społeczną dla robotników i niepodległość Polski. PPS uważała, że robotnicy nie mogą być wolni, dopóki ich naród jest w niewoli. W tajnych drukarniach wydawano gazetę „Robotnik”, którą przemycano do fabryk w całym kraju. Jej redaktorem i drukarzem był młody socjalista z Wilna, Józef Piłsudski."
    draft: true
    chunks:
      - pl: "W 1892 roku na zjeździe w Paryżu polscy socjaliści założyli Polską Partię Socjalistyczną, w skrócie PPS."
        ru: "В 1892 году на съезде в Париже польские социалисты основали Польскую социалистическую партию, сокращённо ППС."
      - pl: " Jej program łączył dwa cele: sprawiedliwość społeczną dla robotników i niepodległość Polski."
        ru: "Её программа соединяла две цели: социальную справедливость для рабочих и независимость Польши."
      - pl: " PPS uważała, że robotnicy nie mogą być wolni, dopóki ich naród jest w niewoli."
        ru: "ППС считала, что рабочие не могут быть свободны, пока их народ находится в неволе."
      - pl: " W tajnych drukarniach wydawano gazetę „Robotnik”, którą przemycano do fabryk w całym kraju."
        ru: "В тайных типографиях издавали газету «Роботник», которую тайно доставляли на фабрики по всей стране."
      - pl: " Jej redaktorem i drukarzem był młody socjalista z Wilna, Józef Piłsudski."
        ru: "Её редактором и печатником был молодой социалист из Вильно, Юзеф Пилсудский."
