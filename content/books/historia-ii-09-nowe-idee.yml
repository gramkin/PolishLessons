  - clean: "Innym działaczem SDKPiL był Feliks Dzierżyński, syn polskiego szlachcica spod Mińska. W młodości chciał zostać księdzem, potem stał się zawodowym rewolucjonistą i spędził wiele lat w więzieniach i na zesłaniu. Po rewolucji październikowej w 1917 roku stanął na czele Czeka, bolszewickiej policji politycznej, i stał się symbolem czerwonego terroru. Jego pomnik, który przez wiele lat stał w Moskwie przed Łubianką, a także w Warszawie, został zburzony po upadku komunizmu. Losy Luksemburg i Dzierżyńskiego pokazują, że polscy rewolucjoniści odegrali ogromną rolę nie tylko w historii Polski, ale także Niemiec i Rosji."
