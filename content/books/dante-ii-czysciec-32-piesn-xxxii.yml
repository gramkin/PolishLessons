# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 32
chapterTitle: "Pieśń XXXII"
chapterTitleRu: "Песнь XXXII. Древо и колесница"
level: B2
paragraphs:
  - clean: "(Widzenie się z Beatrycze — połączenie z łaską bożą. Pochód zwraca się na prawo, ku drzewu poznania. Rydwan pozostaje tu — Chrystus i Święci znikają. Beatrycze zstępuje. Widzenie dziejów widomego walczącego Kościoła.)"
    chunks:
      - pl: "(Widzenie się z Beatrycze — połączenie z łaską bożą. Pochód zwraca się na prawo, ku drzewu poznania. Rydwan pozostaje tu — Chrystus i Święci znikają. Beatrycze zstępuje. Widzenie dziejów widomego walczącego Kościoła.)"
        ru: "(Свидание с Беатриче — соединение с Божьей благодатью. Шествие поворачивает направо, к древу познания. Колесница остаётся здесь — Христос и святые исчезают. Беатриче сходит. Видение истории видимой воинствующей Церкви.)"
        note: "widomy — видимый"
    words: { "bożą": bozy, "zwraca": zwracac, "drzewu": drzewo, "pozostaje": pozostawac, "znikają": znikac, "Kościoła": kosciol }
  - clean: "Tak były moje oczy wytężone,\nDziesięcioletnie gaszące pragnienie,\nŻe inne zmysły wtrąciły w uśpienie;\nOczy jak murem z dwóch stron zasłonione,\nNa wszystko inne patrzyły bez troski:\nTak silnie uśmiech mojej pani boski\nCiągnął mnie do się dawnymi sieciami."
    verse: true
    chunks:
      - pl: "Tak były moje oczy wytężone,"
        ru: "Так были напряжены мои глаза,"
      - pl: "\nDziesięcioletnie gaszące pragnienie,"
        ru: "утоляя десятилетнюю жажду,"
        note: "Беатриче умерла за десять лет до 1300 года"
      - pl: "\nŻe inne zmysły wtrąciły w uśpienie;"
        ru: "что погрузили прочие чувства в сон;"
      - pl: "\nOczy jak murem z dwóch stron zasłonione,"
        ru: "глаза, словно стеной с двух сторон заслонённые,"
      - pl: "\nNa wszystko inne patrzyły bez troski:"
        ru: "на всё прочее смотрели без внимания:"
      - pl: "\nTak silnie uśmiech mojej pani boski"
        ru: "так сильно божественная улыбка моей госпожи"
      - pl: "\nCiągnął mnie do się dawnymi sieciami."
        ru: "влекла меня к себе давними сетями."
    words: { "wytężone": wytezyc, "pragnienie": pragnienie, "zmysły": zmysl, "wtrąciły": wtracic, "murem": mur, "troski": troska }
  - clean: "Wtenczas twarz moją gwałtownie rękami\nZwracały w lewo nimfy i mówiły:\n«Oczy się jego zanadto wpatrzyły».\nStan przykry, jaki czujem w naszym oku,\nGdy uderzona powieka przez słońce\nWzrok mruży, na czas pozbawił mię wzroku."
    verse: true
    chunks:
      - pl: "Wtenczas twarz moją gwałtownie rękami"
        ru: "Тогда моё лицо силой руками"
      - pl: "\nZwracały w lewo nimfy i mówiły:"
        ru: "поворачивали влево нимфы и говорили:"
      - pl: "\n«Oczy się jego zanadto wpatrzyły»."
        ru: "«Его глаза слишком уж засмотрелись»."
      - pl: "\nStan przykry, jaki czujem w naszym oku,"
        ru: "Неприятное состояние, какое мы чувствуем в глазу,"
      - pl: "\nGdy uderzona powieka przez słońce"
        ru: "когда веко, поражённое солнцем,"
      - pl: "\nWzrok mruży, na czas pozbawił mię wzroku."
        ru: "жмурит взгляд, на время лишило меня зрения."
    words: { "Stan": stan, "przykry": przykry, "uderzona": uderzyc, "słońce": slonce, "Wzrok": wzrok, "pozbawił": pozbawic }
  - clean: "Lecz wzrok przed światłem gdy wypoczął małem\n(Mówię, równając do wielkiej światłości,\nOd której gwałtem oczy oderwałem),\nSpostrzegłem w prawą zastępy idące\nOkrytych wieczną chwałą bojowników,\nTwarzą ku słońcu i siedmiu świeczników,\nJak pod zasłoną swojego obozu,\nBojowym szykiem postępując rota,\nZwraca się, kędy jej sztandar migota;\nTak cały zastęp królestwa wieczności,\nCo szedł przed wozem, przeciągał pochodem,\nNim wóz na prawą zawrócił się przodem."
    verse: true
    chunks:
      - pl: "Lecz wzrok przed światłem gdy wypoczął małem"
        ru: "Но когда взгляд отдохнул перед малым светом"
      - pl: "\n(Mówię, równając do wielkiej światłości,"
        ru: "(говорю, сравнивая с великим светом,"
      - pl: "\nOd której gwałtem oczy oderwałem),"
        ru: "от которого я силой оторвал глаза),"
      - pl: "\nSpostrzegłem w prawą zastępy idące"
        ru: "я заметил справа идущие воинства"
        note: "zastęp — воинство"
      - pl: "\nOkrytych wieczną chwałą bojowników,"
        ru: "бойцов, покрытых вечной славой,"
      - pl: "\nTwarzą ku słońcu i siedmiu świeczników,"
        ru: "лицом к солнцу и к семи светильникам."
      - pl: "\nJak pod zasłoną swojego obozu,"
        ru: "Как под прикрытием своего лагеря,"
      - pl: "\nBojowym szykiem postępując rota,"
        ru: "продвигаясь боевым строем, отряд"
      - pl: "\nZwraca się, kędy jej sztandar migota;"
        ru: "поворачивает туда, где мерцает его знамя;"
      - pl: "\nTak cały zastęp królestwa wieczności,"
        ru: "так всё воинство царства вечности,"
      - pl: "\nCo szedł przed wozem, przeciągał pochodem,"
        ru: "что шло перед колесницей, проходило шествием,"
      - pl: "\nNim wóz na prawą zawrócił się przodem."
        ru: "прежде чем колесница повернула передом направо."
    words: { "Spostrzegłem": spostrzec, "wieczną": wieczny, "zasłoną": zaslona, "Bojowym": bojowy, "wieczności": wiecznosc, "zawrócił": zawrocic }
  - clean: "Niewiasty stają tuż przy kołach wozu,\nA gryf wóz święty targnął siłą całą,\nChoć na nim żadne pióro nie zadrżało.\nDama, co dla mnie w bród ze mną szła rzeką,\nStacyjusz i ja szliśmy niedaleko\nZa kołem, które łuk mniejszy pisało,\nI szliśmy wielką, dziś pustą dąbrową,\nPrzez błąd wierzącej w poradę wężową,\nPieśnią aniołów mierząc swoje kroki."
    verse: true
    chunks:
      - pl: "Niewiasty stają tuż przy kołach wozu,"
        ru: "Жёны встают у самых колёс колесницы,"
      - pl: "\nA gryf wóz święty targnął siłą całą,"
        ru: "а грифон рванул святую колесницу всей силой,"
      - pl: "\nChoć na nim żadne pióro nie zadrżało."
        ru: "хоть на нём ни одно перо не дрогнуло."
      - pl: "\nDama, co dla mnie w bród ze mną szła rzeką,"
        ru: "Дама, что ради меня шла со мной вброд через реку,"
      - pl: "\nStacyjusz i ja szliśmy niedaleko"
        ru: "Стаций и я шли недалеко"
      - pl: "\nZa kołem, które łuk mniejszy pisało,"
        ru: "за колесом, что чертило меньшую дугу,"
      - pl: "\nI szliśmy wielką, dziś pustą dąbrową,"
        ru: "и мы шли по великой, ныне пустой дубраве,"
      - pl: "\nPrzez błąd wierzącej w poradę wężową,"
        ru: "пустой из-за ошибки поверившей змеиному совету,"
        note: "Евы"
      - pl: "\nPieśnią aniołów mierząc swoje kroki."
        ru: "соразмеряя свои шаги с пением ангелов."
    words: { "Niewiasty": niewiasta, "pióro": pioro, "niedaleko": niedaleko, "poradę": porada, "Pieśnią": piesn, "mierząc": mierzyc }
  - clean: "Gdyśmy do tyla zaszli w las głęboki.\nJak na potrójny rzut strzały w strzelnicę,\nZ wozu zstąpiła na dół Beatryce.\nWtem «Adam! Adam!» szmer zamruczał głuchy,\nWszyscy pień drzewa otoczyli suchy,\nZ liści i kwiatu z dawna obnażony;\nCzub drzewa tylko liściami odziany,\nWzwyż rozszerzając obwód swej korony\nMógłby zadziwić leśne Indiany."
    verse: true
    chunks:
      - pl: "Gdyśmy do tyla zaszli w las głęboki."
        ru: "Когда мы настолько зашли в глубокий лес,"
      - pl: "\nJak na potrójny rzut strzały w strzelnicę,"
        ru: "как на тройной полёт стрелы в цель,"
        note: "strzelnica — мишень"
      - pl: "\nZ wozu zstąpiła na dół Beatryce."
        ru: "с колесницы вниз сошла Беатриче."
      - pl: "\nWtem «Adam! Adam!» szmer zamruczał głuchy,"
        ru: "Тут «Адам! Адам!» — глухо пробормотал шёпот,"
      - pl: "\nWszyscy pień drzewa otoczyli suchy,"
        ru: "все окружили сухой ствол дерева,"
      - pl: "\nZ liści i kwiatu z dawna obnażony;"
        ru: "давно обнажённый от листьев и цвета;"
      - pl: "\nCzub drzewa tylko liściami odziany,"
        ru: "верхушка дерева, лишь одетая листьями,"
      - pl: "\nWzwyż rozszerzając obwód swej korony"
        ru: "расширяя ввысь окружность своей кроны,"
      - pl: "\nMógłby zadziwić leśne Indiany."
        ru: "могла бы удивить лесных индийцев."
    words: { "rzut": rzut, "szmer": szmer, "głuchy": gluchy, "rozszerzając": rozszerzac, "obwód": obwod, "korony": korona }
  - clean: "«Dwoisty gryfie, bądź błogosławiony!\nŻe nie rozdarłeś dziobem tego drzewa:\nSłodki smak jego, lecz Adam i Ewa\nCzuli, jak jadem paliło ich trzewa!»\nWokoło drzewa tłum szemrał tym śpiewem,\nGryf odpowiadał na ten szmer w te słowa:\n«Tak się nasienie wszelkiej prawdy chowa»."
    verse: true
    chunks:
      - pl: "«Dwoisty gryfie, bądź błogosławiony!"
        ru: "«Благословен будь, двойственный грифон,"
      - pl: "\nŻe nie rozdarłeś dziobem tego drzewa:"
        ru: "что не разодрал клювом этого дерева:"
      - pl: "\nSłodki smak jego, lecz Adam i Ewa"
        ru: "сладок вкус его, но Адам и Ева"
      - pl: "\nCzuli, jak jadem paliło ich trzewa!»"
        ru: "чувствовали, как ядом жгло их нутро!»"
        note: "trzewa — нутро, внутренности"
      - pl: "\nWokoło drzewa tłum szemrał tym śpiewem,"
        ru: "Вокруг дерева толпа шелестела этой песнью,"
      - pl: "\nGryf odpowiadał na ten szmer w te słowa:"
        ru: "грифон отвечал на этот шёпот такими словами:"
      - pl: "\n«Tak się nasienie wszelkiej prawdy chowa»."
        ru: "«Так хранится семя всякой правды»."
    words: { "błogosławiony": blogoslawic, "smak": smak, "odpowiadał": odpowiadac, "nasienie": nasienie, "wszelkiej": wszelki, "chowa": chowac }
  - clean: "I zaraz po tej uciętej przemowie,\nWóz pod to drzewo, po swych liściach wdowie,\nZatoczył dyszlem i rzucił pod drzewem,\nZ którego wóz ten zrobiony był rdzeni.\nA jak rośliny nasze, gdy stojące\nZa znakiem Ryby wyiskrza się słońce,\nZ nią blaski wspólnych mieszając promieni,\nNim swe rumaki, co ogniami zieją,\nPod inną gwiazdą zaprzęże koleją,\nZmieniają barwy i kwiatem pęcznieją;"
    verse: true
    chunks:
      - pl: "I zaraz po tej uciętej przemowie,"
        ru: "И тотчас после этой краткой речи"
      - pl: "\nWóz pod to drzewo, po swych liściach wdowie,"
        ru: "колесницу под это дерево, вдовствующее по своим листьям,"
      - pl: "\nZatoczył dyszlem i rzucił pod drzewem,"
        ru: "он подвёл дышлом и оставил под деревом,"
      - pl: "\nZ którego wóz ten zrobiony był rdzeni."
        ru: "из сердцевины которого была сделана эта колесница."
        note: "древо креста"
      - pl: "\nA jak rośliny nasze, gdy stojące"
        ru: "И как наши растения, когда, стоя,"
      - pl: "\nZa znakiem Ryby wyiskrza się słońce,"
        ru: "за знаком Рыбы искрится солнце,"
      - pl: "\nZ nią blaski wspólnych mieszając promieni,"
        ru: "смешивая с ним блеск общих лучей,"
      - pl: "\nNim swe rumaki, co ogniami zieją,"
        ru: "прежде чем оно запряжёт по очереди"
      - pl: "\nPod inną gwiazdą zaprzęże koleją,"
        ru: "своих коней, пышущих огнём, под другой звездой,"
      - pl: "\nZmieniają barwy i kwiatem pęcznieją;"
        ru: "меняют цвета и набухают цветом;"
        note: "pęcznieć — набухать"
    words: { "przemowie": przemowa, "wdowie": wdowa, "rdzeni": rdzen, "rośliny": roslina, "blaski": blask, "zieją": ziac }
  - clean: "Tak odzyskując barwy aż z wierzchołka,\nBledsze od róży, żywsze od fiołka,\nBezlistne drzewo odżyło na nowo.\nWtenczas tłum śpiewał jakąś pieśń godową,\nNuty tej pieśni na ziemi nie brzmiały,\nA ja nie mogłem dosłuchać jej całej."
    verse: true
    chunks:
      - pl: "Tak odzyskując barwy aż z wierzchołka,"
        ru: "так, обретая цвета до самой верхушки,"
      - pl: "\nBledsze od róży, żywsze od fiołka,"
        ru: "бледнее розы, живее фиалки,"
        note: "fiołek — фиалка"
      - pl: "\nBezlistne drzewo odżyło na nowo."
        ru: "безлистное дерево ожило вновь."
      - pl: "\nWtenczas tłum śpiewał jakąś pieśń godową,"
        ru: "Тогда толпа пела какую-то брачную песнь,"
      - pl: "\nNuty tej pieśni na ziemi nie brzmiały,"
        ru: "напевы этой песни на земле не звучали,"
      - pl: "\nA ja nie mogłem dosłuchać jej całej."
        ru: "а я не мог дослушать её всю."
    words: { "Bledsze": blady, "róży": roza, "żywsze": zywy, "śpiewał": spiewac, "ziemi": ziemia, "brzmiały": brzmiec }
  - clean: "Gdybym mógł skreślić, jak bajarz uroczy\nUśpił bajaniem Argusowe oczy,\nKtórym czuwanie zbytnie jest przestrogą,\nBo wzrok ich czujny kosztował tak drogo!\nJak malujący malarz według wzoru,\nSkreśliłbym sen mój barwą słów doboru;\nMaluj, kto sen mój pędzlem uosobisz,\nJa schodzę w moment, który wspomnieć miło,\nGdy światło snu mi zasłonę przebiło,\nGdy do mnie krzyknął głos: «Wstań! co ty robisz?»"
    verse: true
    chunks:
      - pl: "Gdybym mógł skreślić, jak bajarz uroczy"
        ru: "Если бы я мог описать, как прелестный сказитель"
        note: "bajarz — сказитель; Меркурий"
      - pl: "\nUśpił bajaniem Argusowe oczy,"
        ru: "усыпил сказкой глаза Аргуса,"
      - pl: "\nKtórym czuwanie zbytnie jest przestrogą,"
        ru: "для которых чрезмерное бодрствование — предостережение,"
      - pl: "\nBo wzrok ich czujny kosztował tak drogo!"
        ru: "ибо их зоркий взгляд так дорого обошёлся!"
      - pl: "\nJak malujący malarz według wzoru,"
        ru: "Как пишущий художник по образцу,"
      - pl: "\nSkreśliłbym sen mój barwą słów doboru;"
        ru: "я описал бы свой сон краской подбора слов;"
      - pl: "\nMaluj, kto sen mój pędzlem uosobisz,"
        ru: "изображай, кто кистью воплотит мой сон,"
        note: "uosobić — воплотить"
      - pl: "\nJa schodzę w moment, który wspomnieć miło,"
        ru: "я перехожу к моменту, который мило вспомнить,"
      - pl: "\nGdy światło snu mi zasłonę przebiło,"
        ru: "когда свет пробил мне покров сна,"
      - pl: "\nGdy do mnie krzyknął głos: «Wstań! co ty robisz?»"
        ru: "когда ко мне крикнул голос: «Встань! что ты делаешь?»"
    words: { "kosztował": kosztowac, "malujący": malowac, "wzoru": wzor, "schodzę": schodzic, "przebiło": przebic, "Wstań": wstac }
  - clean: "A jak na Tabor woń jabłoni luba,\nKtórej owocu aniołowie chciwi\nBez przerwy w niebie ucztują szczęśliwi,\nZnęciła Piotra, Jana i Jakuba,\nGdzie przed niebieskim blaskiem wywróceni,\nWstali na słowo, co z grobowych cieni\nBudzi umarłych i wtenczas widzieli\nJak Eliasz, Mojżesz w obłokach zniknęli;\nI jak ich mistrza, który w niebo wzlata,\nCzerwona z białą zmieniła się szata;"
    verse: true
    chunks:
      - pl: "A jak na Tabor woń jabłoni luba,"
        ru: "И как на Фаворе милый запах яблони,"
      - pl: "\nKtórej owocu aniołowie chciwi"
        ru: "чьих плодов жаждущие ангелы"
      - pl: "\nBez przerwy w niebie ucztują szczęśliwi,"
        ru: "без перерыва счастливо вкушают на небе,"
      - pl: "\nZnęciła Piotra, Jana i Jakuba,"
        ru: "привлёк Петра, Иоанна и Иакова,"
      - pl: "\nGdzie przed niebieskim blaskiem wywróceni,"
        ru: "где, повергнутые перед небесным блеском,"
      - pl: "\nWstali na słowo, co z grobowych cieni"
        ru: "они встали на слово, что из могильных теней"
      - pl: "\nBudzi umarłych i wtenczas widzieli"
        ru: "будит мёртвых, и тогда видели,"
      - pl: "\nJak Eliasz, Mojżesz w obłokach zniknęli;"
        ru: "как Илия, Моисей исчезли в облаках;"
      - pl: "\nI jak ich mistrza, który w niebo wzlata,"
        ru: "и как у их учителя, что взлетает в небо,"
      - pl: "\nCzerwona z białą zmieniła się szata;"
        ru: "красная одежда сменилась белой;"
    words: { "owocu": owoc, "przerwy": przerwa, "niebie": niebo, "niebieskim": niebieski, "Budzi": budzic, "mistrza": mistrz }
  - clean: "Taki głos ze snu przetarł mi źrenice.\nWidzę nade mną stoi pochylona,\nPełna współczucia niewiasta, to ona,\nCo mnie pod skrzydłem swej czułej opieki,\nPrzeprowadziła dnem letejskiej rzeki.\nZ trwogą ją pytam: «Gdzie jest Beatryce?»"
    verse: true
    chunks:
      - pl: "Taki głos ze snu przetarł mi źrenice."
        ru: "такой голос протёр мне зрачки ото сна."
      - pl: "\nWidzę nade mną stoi pochylona,"
        ru: "Вижу — надо мной стоит, склонившись,"
      - pl: "\nPełna współczucia niewiasta, to ona,"
