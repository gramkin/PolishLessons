  - clean: "Do Waszyngtona żywił szczególną urazę, wiedząc doskonale, że to właśnie on zwykł usuwać słynną plamę krwi Canterville'ów za pomocą Detergentu Ideał Pinkertona. Doprowadziwszy lekkomyślnego i zuchwałego młodzieńca do stanu skrajnego przerażenia, miał następnie przejść do pokoju zajmowanego przez ministra i jego żonę i tam położyć wilgotną, lepką dłoń na czole pani Otis, a jej drżącemu mężowi syczeć do ucha straszliwe tajemnice kostnicy. Co do małej Virginii, nie był jeszcze całkiem zdecydowany. Nigdy go w żaden sposób nie obraziła, a była ładna i łagodna. Kilka głuchych jęków z szafy, jak sądził, w zupełności wystarczy, a gdyby jej to nie obudziło, mógłby szarpać kołdrę palcami drżącymi jak w paraliżu. Co do bliźniaków, był absolutnie zdecydowany dać im nauczkę."
    en: "He bore Washington a special grudge, being quite aware that it was he who was in the habit of removing the famous Canterville blood-stain by means of Pinkerton's Paragon Detergent. Having reduced the reckless and foolhardy youth to a condition of abject terror, he was then to proceed to the room occupied by the United States Minister and his wife, and there to place a clammy hand on Mrs. Otis's forehead, while he hissed into her trembling husband's ear the awful secrets of the charnel-house. With regard to little Virginia, he had not quite made up his mind. She had never insulted him in any way, and was pretty and gentle. A few hollow groans from the wardrobe, he thought, would be more than sufficient, or, if that failed to wake her, he might grabble at the counterpane with palsy-twitching fingers. As for the twins, he was quite determined to teach them a lesson."
    draft: true
