  - clean: "Dotarłszy do swojego pokoju, zupełnie się załamał i padł ofiarą najgwałtowniejszego wzburzenia. Prostactwo bliźniaków i rażący materializm pani Otis były naturalnie niezwykle irytujące, ale tym, co go naprawdę najbardziej zmartwiło, było to, że nie zdołał włożyć zbroi. Miał nadzieję, że nawet współcześni Amerykanie przejmą się widokiem Upiora w zbroi, jeśli nie z rozsądniejszej przyczyny, to przynajmniej przez szacunek dla ich narodowego poety Longfellowa, nad którego wdzięczną i ujmującą poezją sam niejedną nudną godzinę przepędził, kiedy Cantervillowie wyjeżdżali do Londynu."
