  - clean: "O wpół do jedenastej usłyszał, że rodzina kładzie się spać. Przez jakiś czas przeszkadzały mu dzikie wybuchy śmiechu bliźniaków, którzy z beztroską wesołością uczniaków najwyraźniej bawili się przed snem, ale kwadrans po jedenastej wszystko ucichło, i gdy wybiła północ, wyruszył. Sowa tłukła się o szyby, kruk krakał na starym cisie, a wiatr błąkał się z jękiem wokół domu jak zabłąkana dusza; ale rodzina Otisów spała, nieświadoma czekającego ją losu, a ponad deszczem i burzą słyszał równomierne chrapanie ministra Stanów Zjednoczonych. Wysunął się ukradkiem z boazerii, ze złym uśmiechem na okrutnych, pomarszczonych ustach, a księżyc skrył twarz w chmurze, kiedy przemykał obok wielkiego wykuszowego okna, na którym lazurem i złotem wymalowane były jego herby i herby zamordowanej żony."
    en: "At half-past ten he heard the family going to bed. For some time he was disturbed by wild shrieks of laughter from the twins, who, with the light-hearted gaiety of schoolboys, were evidently amusing themselves before they retired to rest, but at a quarter-past eleven all was still, and, as midnight sounded, he sallied forth. The owl beat against the window-panes, the raven croaked from the old yew-tree, and the wind wandered moaning round the house like a lost soul; but the Otis family slept unconscious of their doom, and high above the rain and storm he could hear the steady snoring of the Minister for the United States. He stepped stealthily out of the wainscoting, with an evil smile on his cruel, wrinkled mouth, and the moon hid her face in a cloud as he stole past the great oriel window, where his own arms and those of his murdered wife were blazoned in azure and gold."
