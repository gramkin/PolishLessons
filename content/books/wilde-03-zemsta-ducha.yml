  - clean: "Tuż przed nim stało straszliwe widmo, nieruchome jak rzeźbiony posąg i potworne jak sen szaleńca! Głowę miało łysą i lśniącą; twarz okrągłą, tłustą i białą; a ohydny śmiech zdawał się wykrzywić jego rysy w wieczny uśmiech. Z oczu biły promienie szkarłatnego światła, usta były szeroką studnią ognia, a ohydna szata, podobna do jego własnej, okrywała milczącym śniegiem tytaniczną postać. Na piersi miało tablicę z dziwnym napisem starodawnymi literami — zdawało się, że to jakiś zwój hańby, jakiś rejestr dzikich grzechów, jakiś straszliwy kalendarz zbrodni — a w prawej ręce wznosiło wysoko lśniący stalowy miecz."
    en: "Right in front of him was standing a horrible spectre, motionless as a carven image, and monstrous as a madman's dream! Its head was bald and burnished; its face round, and fat, and white; and hideous laughter seemed to have writhed its features into an eternal grin. From the eyes streamed rays of scarlet light, the mouth was a wide well of fire, and a hideous garment, like to his own, swathed with its silent snows the Titan form. On its breast was a placard with strange writing in antique characters, some scroll of shame it seemed, some record of wild sins, some awful calendar of crime, and, with its right hand, it bore aloft a falchion of gleaming steel."
