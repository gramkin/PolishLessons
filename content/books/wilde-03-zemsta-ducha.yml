  - clean: "Wszystko stało się dla niego jasne. Oszukano go, wywiedziono w pole i przechytrzono! W jego oczach pojawiło się dawne spojrzenie Canterville'ów; zazgrzytał bezzębnymi dziąsłami i wzniósłszy wysoko nad głowę zwiędłe dłonie, przysiągł, zgodnie z malowniczą frazeologią dawnej szkoły, że gdy Kogut dwakroć zadmie w swój wesoły róg, dokonają się krwawe czyny, a mord będzie krążył po świecie bezgłośnym krokiem."
    en: "The whole thing flashed across him. He had been tricked, foiled, and out-witted! The old Canterville look came into his eyes; he ground his toothless gums together; and, raising his withered hands high above his head, swore according to the picturesque phraseology of the antique school, that, when Chanticleer had sounded twice his merry horn, deeds of blood would be wrought, and murder walk abroad with silent feet."
    draft: true
    chunks:
      - pl: "Wszystko stało się dla niego jasne."
        ru: "Ему всё стало ясно."
      - pl: " Oszukano go, wywiedziono w pole i przechytrzono!"
        ru: "Его обманули, провели и перехитрили!"
        note: "wywieść kogoś w pole — обвести вокруг пальца"
      - pl: " W jego oczach pojawiło się dawne spojrzenie Canterville'ów;"
        ru: "В его глазах появился прежний кентервильский взгляд;"
      - pl: " zazgrzytał bezzębnymi dziąsłami"
        ru: "оно заскрежетало беззубыми дёснами"
        note: "zgrzytać — скрежетать; dziąsło — десна"
      - pl: " i wzniósłszy wysoko nad głowę zwiędłe dłonie,"
        ru: "и, воздев высоко над головой иссохшие руки,"
        note: "wznieść — воздеть; zwiędły — увядший, иссохший"
      - pl: " przysiągł, zgodnie z malowniczą frazeologią dawnej szkoły,"
        ru: "поклялось, согласно живописной фразеологии старой школы,"
      - pl: " że gdy Kogut dwakroć zadmie w swój wesoły róg,"
        ru: "что, когда Петух дважды протрубит в свой весёлый рог,"
        note: "dwakroć — дважды (книжное); у Уайльда Chanticleer — Петух средневековых басен"
      - pl: " dokonają się krwawe czyny,"
        ru: "свершатся кровавые деяния,"
        note: "dokonać się — свершиться"
      - pl: " a mord będzie krążył po świecie bezgłośnym krokiem."
        ru: "и убийство пойдёт бродить по свету беззвучным шагом."
        note: "mord — убийство; krążyć — бродить, кружить"
    words: { "wzniósłszy": wzniesc, "przysiągł": przysiegnac, "malowniczą": malowniczy, "krwawe": krwawy, "krążył": krazyc }
  - clean: "Ledwie skończył tę straszliwą przysięgę, gdy na krytym czerwoną dachówką dachu dalekiej zagrody zapiał kogut. Zaśmiał się długim, cichym, gorzkim śmiechem i czekał. Czekał godzinę za godziną, ale kogut z jakiegoś dziwnego powodu nie zapiał po raz drugi. W końcu o wpół do ósmej przyjście pokojówek zmusiło go do porzucenia straszliwej warty, i odszedł dumnym krokiem do swojego pokoju, rozmyślając o daremnej przysiędze i udaremnionym zamiarze. Tam przejrzał kilka ksiąg o dawnym rycerstwie, które niezwykle lubił, i przekonał się, że za każdym razem, gdy użyto tej przysięgi, Kogut zawsze piał drugi raz. — Niech piekło pochłonie tego nicponia — mruknął. — Widziałem czasy, gdy moją mocną włócznią przebiłbym mu gardziel i kazałbym mu piać dla mnie, choćby i w godzinę śmierci! Potem udał się na spoczynek do wygodnej ołowianej trumny i pozostał tam do wieczora."
    en: "Hardly had he finished this awful oath when, from the red-tiled roof of a distant homestead, a cock crew. He laughed a long, low, bitter laugh, and waited. Hour after hour he waited, but the cock, for some strange reason, did not crow again. Finally, at half-past seven, the arrival of the housemaids made him give up his fearful vigil, and he stalked back to his room, thinking of his vain oath and baffled purpose. There he consulted several books of ancient chivalry, of which he was exceedingly fond, and found that, on every occasion on which this oath had been used, Chanticleer had always crowed a second time. \"Perdition seize the naughty fowl,\" he muttered, \"I have seen the day when, with my stout spear, I would have run him through the gorge, and made him crow for me an 'twere in death!\" He then retired to a comfortable lead coffin, and stayed there till evening."
    draft: true
    chunks:
      - pl: "Ledwie skończył tę straszliwą przysięgę,"
        ru: "Едва оно произнесло эту страшную клятву,"
