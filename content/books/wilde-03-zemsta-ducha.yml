  - clean: "Przez resztę tygodnia nikt im jednak nie przeszkadzał; jedyną rzeczą, która budziła zainteresowanie, było ciągłe odnawianie się plamy krwi na podłodze biblioteki. Było to doprawdy bardzo dziwne, bo pan Otis zawsze zamykał drzwi na noc, a okna były szczelnie zaryglowane. Wiele komentarzy wywoływał też kameleonowy kolor plamy. Czasem rano była matowoczerwona (prawie jak indyjska czerwień), potem cynobrowa, potem soczyście purpurowa, a raz, kiedy zeszli na rodzinne modły według prostego obrządku Wolnego Amerykańskiego Reformowanego Kościoła Episkopalnego, zastali ją jaskrawoszmaragdową. Te kalejdoskopowe zmiany ogromnie bawiły towarzystwo i co wieczór chętnie zakładano się o to. Jedyną osobą, która nie brała udziału w żartach, była mała Virginia, która z jakiegoś niewyjaśnionego powodu zawsze bardzo się martwiła na widok plamy krwi i omal się nie rozpłakała tego ranka, kiedy była szmaragdowa."
    en: "For the rest of the week, however, they were undisturbed, the only thing that excited any attention being the continual renewal of the blood-stain on the library floor. This certainly was very strange, as the door was always locked at night by Mr. Otis, and the windows kept closely barred. The chameleon-like colour, also, of the stain excited a good deal of comment. Some mornings it was a dull (almost Indian) red, then it would be vermilion, then a rich purple, and once when they came down for family prayers, according to the simple rites of the Free American Reformed Episcopalian Church, they found it a bright emerald-green. These kaleidoscopic changes naturally amused the party very much, and bets on the subject were freely made every evening. The only person who did not enter into the joke was little Virginia, who, for some unexplained reason, was always a good deal distressed at the sight of the blood-stain, and very nearly cried the morning it was emerald-green."
