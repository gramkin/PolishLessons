  - clean: "Pierwszą rzeczą było oczywiście usiąść im na piersiach, żeby wywołać duszące uczucie zmory. Potem, ponieważ ich łóżka stały tuż obok siebie, stanąć między nimi w postaci zielonego, lodowato zimnego trupa, aż sparaliżuje ich strach, a w końcu zrzucić całun i czołgać się po pokoju z białymi, wybielałymi kośćmi i jednym toczącym się okiem w roli „Niemego Daniela, czyli Szkieletu Samobójcy” — roli, w której nieraz osiągnął wielki efekt i którą uważał za całkowicie równą swej słynnej kreacji „Marcina Maniaka, czyli Zamaskowanej Tajemnicy”."
    en: "The first thing to be done was, of course, to sit upon their chests, so as to produce the stifling sensation of nightmare. Then, as their beds were quite close to each other, to stand between them in the form of a green, icy-cold corpse, till they became paralyzed with fear, and finally, to throw off the winding-sheet, and crawl round the room, with white, bleached bones and one rolling eyeball, in the character of \"Dumb Daniel, or the Suicide's Skeleton,\" a rôle in which he had on more than one occasion produced a great effect, and which he considered quite equal to his famous part of \"Martin the Maniac, or the Masked Mystery.\""
