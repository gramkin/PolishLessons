  - clean: "— Obawiam się, że nie czuje się pan najlepiej — powiedziała — więc przyniosłam panu buteleczkę nalewki doktora Dobella. Jeśli to niestrawność, przekona się pan, że to doskonałe lekarstwo. Duch spiorunował ją wściekłym spojrzeniem i natychmiast zaczął przygotowania, żeby zamienić się w wielkiego czarnego psa, co było sztuką, z której słusznie słynął i której rodzinny lekarz zawsze przypisywał nieuleczalne otępienie stryja lorda Canterville, szanownego Thomasa Hortona. Jednak odgłos zbliżających się kroków sprawił, że zawahał się w swym okrutnym zamiarze, poprzestał więc na tym, że zaczął lekko fosforyzować, i zniknął z głębokim cmentarnym jękiem akurat w chwili, gdy dobiegli do niego bliźniacy."
    en: "\"I am afraid you are far from well,\" she said, \"and have brought you a bottle of Doctor Dobell's tincture. If it is indigestion, you will find it a most excellent remedy.\" The ghost glared at her in fury, and began at once to make preparations for turning himself into a large black dog, an accomplishment for which he was justly renowned, and to which the family doctor always attributed the permanent idiocy of Lord Canterville's uncle, the Hon. Thomas Horton. The sound of approaching footsteps, however, made him hesitate in his fell purpose, so he contented himself with becoming faintly phosphorescent, and vanished with a deep churchyard groan, just as the twins had come up to him."
    draft: true
