  - clean: "Kiedy jednak dotarł na miejsce, jego oczom ukazał się straszny widok. Z widmem najwyraźniej coś się stało, bo z jego pustych oczu zupełnie zgasło światło, lśniący miecz wypadł mu z ręki, a ono samo opierało się o ścianę w sztywnej i niewygodnej pozie. Duch rzucił się naprzód i chwycił je w ramiona, gdy, ku jego przerażeniu, głowa zsunęła się i potoczyła po podłodze, ciało osunęło się na ziemię, a on stwierdził, że ściska białą bawełnianą zasłonę od łóżka, u jego stóp zaś leżą szczotka do zamiatania, tasak kuchenny i wydrążona rzepa! Nie mogąc pojąć tej dziwnej przemiany, chwycił z gorączkowym pośpiechem tablicę i w szarym porannym świetle przeczytał te straszne słowa:"
    en: "On reaching the spot, however, a terrible sight met his gaze. Something had evidently happened to the spectre, for the light had entirely faded from its hollow eyes, the gleaming falchion had fallen from its hand, and it was leaning up against the wall in a strained and uncomfortable attitude. He rushed forward and seized it in his arms, when, to his horror, the head slipped off and rolled on the floor, the body assumed a recumbent posture, and he found himself clasping a white dimity bed-curtain, with a sweeping-brush, a kitchen cleaver, and a hollow turnip lying at his feet! Unable to understand this curious transformation, he clutched the placard with feverish haste, and there, in the grey morning light, he read these fearful words:--"
    draft: true
    chunks:
      - pl: "Kiedy jednak dotarł na miejsce,"
        ru: "Однако, когда оно пришло на место,"
