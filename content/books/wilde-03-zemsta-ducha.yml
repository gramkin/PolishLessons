  - clean: "Poza tym była to jego własna zbroja. Nosił ją z wielkim powodzeniem na turnieju w Kenilworth i otrzymał za nią wiele komplementów od samej Królowej Dziewicy. Kiedy jednak ją włożył, zupełnie przytłoczył go ciężar ogromnego napierśnika i stalowego hełmu, i runął ciężko na kamienną posadzkę, boleśnie obcierając sobie oba kolana i tłukąc kostki prawej dłoni."
    en: "Besides it was his own suit. He had worn it with great success at the Kenilworth tournament, and had been highly complimented on it by no less a person than the Virgin Queen herself. Yet when he had put it on, he had been completely overpowered by the weight of the huge breastplate and steel casque, and had fallen heavily on the stone pavement, barking both his knees severely, and bruising the knuckles of his right hand."
