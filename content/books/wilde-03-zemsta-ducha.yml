  - clean: "Przez kilka dni potem był bardzo chory i prawie nie wychodził z pokoju, chyba że po to, by utrzymać plamę krwi w należytym stanie. Dbając jednak bardzo o siebie, wyzdrowiał i postanowił podjąć trzecią próbę nastraszenia ministra Stanów Zjednoczonych i jego rodziny. Na swoje wystąpienie wybrał piątek, 17 sierpnia, i spędził większość tego dnia na przeglądaniu garderoby, decydując się w końcu na duży kapelusz z opuszczonym rondem i czerwonym piórem, całun z falbankami u nadgarstków i szyi oraz zardzewiały sztylet. Pod wieczór rozpętała się gwałtowna ulewa, a wiatr był tak silny, że wszystkie okna i drzwi w starym domu trzęsły się i dzwoniły. Słowem, była to właśnie taka pogoda, jaką uwielbiał. Jego plan działania był następujący. Miał cicho przedostać się do pokoju Waszyngtona Otisa, bełkotać do niego z nóg łóżka i przy dźwiękach cichej muzyki trzy razy pchnąć się sztyletem w gardło."
    en: "For some days after this he was extremely ill, and hardly stirred out of his room at all, except to keep the blood-stain in proper repair. However, by taking great care of himself, he recovered, and resolved to make a third attempt to frighten the United States Minister and his family. He selected Friday, August 17th, for his appearance, and spent most of that day in looking over his wardrobe, ultimately deciding in favour of a large slouched hat with a red feather, a winding-sheet frilled at the wrists and neck, and a rusty dagger. Towards evening a violent storm of rain came on, and the wind was so high that all the windows and doors in the old house shook and rattled. In fact, it was just such weather as he loved. His plan of action was this. He was to make his way quietly to Washington Otis's room, gibber at him from the foot of the bed, and stab himself three times in the throat to the sound of low music."
    draft: true
