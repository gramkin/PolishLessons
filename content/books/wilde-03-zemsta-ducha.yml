paragraphs:
  - clean: "Następnego ranka, gdy rodzina Otisów spotkała się przy śniadaniu, dość długo rozmawiano o duchu. Minister Stanów Zjednoczonych był naturalnie nieco urażony, że jego prezent nie został przyjęty. — Nie mam zamiaru — powiedział — wyrządzać duchowi jakiejkolwiek osobistej krzywdy, i muszę powiedzieć, że zważywszy, jak długo już mieszka w tym domu, nie uważam, żeby rzucanie w niego poduszkami było choć trochę uprzejme — bardzo słuszna uwaga, przy której, z przykrością muszę stwierdzić, bliźniacy wybuchnęli gromkim śmiechem. — Z drugiej strony — ciągnął — jeśli naprawdę odmawia używania Smaru Wschodzące Słońce, będziemy musieli odebrać mu łańcuchy. Nie sposób byłoby spać przy takim hałasie pod drzwiami sypialni."
    en: "The next morning, when the Otis family met at breakfast, they discussed the ghost at some length. The United States Minister was naturally a little annoyed to find that his present had not been accepted. \"I have no wish,\" he said, \"to do the ghost any personal injury, and I must say that, considering the length of time he has been in the house, I don't think it is at all polite to throw pillows at him,\"--a very just remark, at which, I am sorry to say, the twins burst into shouts of laughter. \"Upon the other hand,\" he continued, \"if he really declines to use the Rising Sun Lubricator, we shall have to take his chains from him. It would be quite impossible to sleep, with such a noise going on outside the bedrooms.\""
    draft: true
