  - clean: "Duch zerwał się z dzikim wrzaskiem wściekłości i przemknął przez nich jak mgła, gasząc po drodze świecę Waszyngtona Otisa i zostawiając ich wszystkich w zupełnych ciemnościach. Na szczycie schodów odzyskał panowanie nad sobą i postanowił wydać swój słynny wybuch demonicznego śmiechu. Nieraz już okazał się on niezwykle przydatny. Podobno w jedną noc posiwiała od niego peruka lorda Rakera, a z pewnością trzy francuskie guwernantki lady Canterville złożyły przez niego wypowiedzenie, zanim upłynął miesiąc. Zaśmiał się więc swoim najstraszniejszym śmiechem, aż stare sklepienie dudniło raz po raz echem, lecz ledwie straszliwe echo ucichło, otworzyły się drzwi i wyszła z nich pani Otis w jasnoniebieskim szlafroku."
    en: "The ghost started up with a wild shriek of rage, and swept through them like a mist, extinguishing Washington Otis's candle as he passed, and so leaving them all in total darkness. On reaching the top of the staircase he recovered himself, and determined to give his celebrated peal of demoniac laughter. This he had on more than one occasion found extremely useful. It was said to have turned Lord Raker's wig grey in a single night, and had certainly made three of Lady Canterville's French governesses give warning before their month was up. He accordingly laughed his most horrible laugh, till the old vaulted roof rang and rang again, but hardly had the fearful echo died away when a door opened, and Mrs. Otis came out in a light blue dressing-gown."
