  - clean: "Sunął dalej i dalej jak zły cień, a sama ciemność zdawała się czuć do niego wstręt, kiedy przechodził. Raz wydało mu się, że coś go woła, i przystanął; ale było to tylko szczekanie psa z Czerwonej Farmy, więc poszedł dalej, mrucząc dziwne szesnastowieczne przekleństwa i raz po raz wymachując w północnym powietrzu zardzewiałym sztyletem. W końcu dotarł do rogu korytarza, który prowadził do pokoju nieszczęsnego Waszyngtona. Przystanął tam na chwilę; wiatr rozwiewał mu wokół głowy długie siwe kosmyki i układał w groteskowe, fantastyczne fałdy bezimienną grozę całunu umarłego. Potem zegar wybił kwadrans i duch poczuł, że nadszedł czas. Zachichotał do siebie i skręcił za róg; ale ledwie to zrobił, z żałosnym jękiem przerażenia cofnął się i ukrył pobladłą twarz w długich, kościstych dłoniach."
    en: "On and on he glided, like an evil shadow, the very darkness seeming to loathe him as he passed. Once he thought he heard something call, and stopped; but it was only the baying of a dog from the Red Farm, and he went on, muttering strange sixteenth-century curses, and ever and anon brandishing the rusty dagger in the midnight air. Finally he reached the corner of the passage that led to luckless Washington's room. For a moment he paused there, the wind blowing his long grey locks about his head, and twisting into grotesque and fantastic folds the nameless horror of the dead man's shroud. Then the clock struck the quarter, and he felt the time was come. He chuckled to himself, and turned the corner; but no sooner had he done so than, with a piteous wail of terror, he fell back, and hid his blanched face in his long, bony hands."
    draft: true
