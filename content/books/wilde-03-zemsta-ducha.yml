  - clean: "Drugi raz duch ukazał się w niedzielę w nocy. Wkrótce po tym, jak położyli się spać, zaniepokoił ich nagle straszliwy łoskot w holu. Zbiegłszy na dół, stwierdzili, że wielka stara zbroja odpadła od stojaka i runęła na kamienną posadzkę, a na krześle z wysokim oparciem siedział duch Canterville, rozcierając kolana, z wyrazem dotkliwego bólu na twarzy. Bliźniacy, którzy zabrali ze sobą dmuchawki, natychmiast wystrzelili w niego dwie kulki z tą celnością, jaką można osiągnąć jedynie po długich i starannych ćwiczeniach na nauczycielu kaligrafii, podczas gdy minister Stanów Zjednoczonych wziął go na muszkę rewolweru i zgodnie z kalifornijską etykietą wezwał go, by podniósł ręce do góry!"
    en: "The second appearance of the ghost was on Sunday night. Shortly after they had gone to bed they were suddenly alarmed by a fearful crash in the hall. Rushing down-stairs, they found that a large suit of old armour had become detached from its stand, and had fallen on the stone floor, while seated in a high-backed chair was the Canterville ghost, rubbing his knees with an expression of acute agony on his face. The twins, having brought their pea-shooters with them, at once discharged two pellets on him, with that accuracy of aim which can only be attained by long and careful practice on a writing-master, while the United States Minister covered him with his revolver, and called upon him, in accordance with Californian etiquette, to hold up his hands!"
    draft: true
