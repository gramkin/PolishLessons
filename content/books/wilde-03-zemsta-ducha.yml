  - clean: "Ponieważ nigdy przedtem nie widział ducha, naturalnie strasznie się przeraził i rzuciwszy na okropne widmo drugie pośpieszne spojrzenie, uciekł z powrotem do swojego pokoju, potykając się o długi całun, gdy pędził korytarzem, a w końcu upuszczając zardzewiały sztylet do butów z cholewami ministra, gdzie rano znalazł go kamerdyner. Znalazłszy się w zaciszu własnego mieszkania, rzucił się na małe posłanie i schował twarz pod pościelą. Po jakimś czasie jednak odezwał się w nim dzielny stary duch Canterville'ów i postanowił pójść porozmawiać z drugim duchem, gdy tylko zrobi się jasno. Toteż kiedy świt srebrzył już wzgórza, wrócił na miejsce, gdzie po raz pierwszy ujrzał upiorne widmo, czując, że ostatecznie dwa duchy są lepsze niż jeden i że z pomocą nowego przyjaciela może bezpiecznie rozprawić się z bliźniakami."
    en: "Never having seen a ghost before, he naturally was terribly frightened, and, after a second hasty glance at the awful phantom, he fled back to his room, tripping up in his long winding-sheet as he sped down the corridor, and finally dropping the rusty dagger into the Minister's jack-boots, where it was found in the morning by the butler. Once in the privacy of his own apartment, he flung himself down on a small pallet-bed, and hid his face under the clothes. After a time, however, the brave old Canterville spirit asserted itself, and he determined to go and speak to the other ghost as soon as it was daylight. Accordingly, just as the dawn was touching the hills with silver, he returned towards the spot where he had first laid eyes on the grisly phantom, feeling that, after all, two ghosts were better than one, and that, by the aid of his new friend, he might safely grapple with the twins."
