      - pl: " był z siebie bardzo dumny, a nawet odrobinę zarozumiały, jak bywają czasem wiejscy panowie z powodu swego odosobnienia."
        ru: "он очень гордился собой и был даже слегка самодоволен, как бывают порой деревенские помещики из-за своей оторванности от мира."
