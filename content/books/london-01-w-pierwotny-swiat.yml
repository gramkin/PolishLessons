  - clean: "Drugi pies nie zabiegał o niczyje względy ani ich nie przyjmował; nie próbował też okradać przybyszów. Był to ponury, posępny osobnik i jasno dał Curly do zrozumienia, że chce tylko, żeby zostawiono go w spokoju, a ponadto, że będą kłopoty, jeśli nie zostanie zostawiony w spokoju. Nazywał się Dave; jadł i spał albo w przerwach ziewał i nie interesował się niczym, nawet wtedy, gdy „Narwal” przepływał przez cieśninę Królowej Charlotty i kołysał się, kiwał i wierzgał jak opętany. Kiedy Buck i Curly wpadali w podniecenie, na wpół oszalali ze strachu, unosił głowę, jakby go to irytowało, obrzucał ich obojętnym spojrzeniem, ziewał i zasypiał znowu."
    en: "The other dog made no advances, nor received any; also, he did not attempt to steal from the newcomers. He was a gloomy, morose fellow, and he showed Curly plainly that all he desired was to be left alone, and further, that there would be trouble if he were not left alone. “Dave” he was called, and he ate and slept, or yawned between times, and took interest in nothing, not even when the Narwhal crossed Queen Charlotte Sound and rolled and pitched and bucked like a thing possessed. When Buck and Curly grew excited, half wild with fear, he raised his head as though annoyed, favored them with an incurious glance, yawned, and went to sleep again."
    draft: true
    chunks:
