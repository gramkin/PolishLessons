  - clean: "Buck nie czytał gazet, bo inaczej wiedziałby, że szykują się kłopoty — nie tylko dla niego, ale dla każdego psa z wybrzeża, silnego w mięśniach i okrytego ciepłą, długą sierścią, od Puget Sound po San Diego. Ludzie bowiem, błądząc po omacku w arktycznych ciemnościach, znaleźli żółty metal, a ponieważ towarzystwa żeglugowe i przewozowe rozdmuchiwały to odkrycie, tysiące ludzi ciągnęły na Północ. Ci ludzie potrzebowali psów, i to psów ciężkich, o silnych mięśniach do pracy i o futrze chroniącym przed mrozem."
    en: "Buck did not read the newspapers, or he would have known that trouble was brewing, not alone for himself, but for every tide-water dog, strong of muscle and with warm, long hair, from Puget Sound to San Diego. Because men, groping in the Arctic darkness, had found a yellow metal, and because steamship and transportation companies were booming the find, thousands of men were rushing into the Northland. These men wanted dogs, and the dogs they wanted were heavy dogs, with strong muscles by which to toil, and furry coats to protect them from the frost."
    draft: true
    chunks:
      - pl: "Buck nie czytał gazet, bo inaczej wiedziałby, że szykują się kłopoty — nie tylko dla niego, ale dla każdego psa z wybrzeża,"
        ru: "Бэк не читал газет, иначе он знал бы, что назревают неприятности — не только для него, но и для каждой собаки с побережья,"
        note: "Buck — Бэк (кличка); szykować się — назревать, готовиться"
      - pl: " silnego w mięśniach i okrytego ciepłą, długą sierścią, od Puget Sound po San Diego."
        ru: "сильной и покрытой тёплой длинной шерстью, от Пьюджет-Саунда до Сан-Диего."
        note: "sierść — шерсть (животного)"
      - pl: " Ludzie bowiem, błądząc po omacku w arktycznych ciemnościach, znaleźli żółty metal,"
        ru: "Ведь люди, бредя ощупью в арктической тьме, нашли жёлтый металл,"
        note: "po omacku — ощупью"
      - pl: " a ponieważ towarzystwa żeglugowe i przewozowe rozdmuchiwały to odkrycie, tysiące ludzi ciągnęły na Północ."
        ru: "а поскольку пароходные и транспортные компании раздували эту находку, тысячи людей устремлялись на Север."
        note: "rozdmuchiwać — раздувать"
      - pl: " Ci ludzie potrzebowali psów, i to psów ciężkich, o silnych mięśniach do pracy i o futrze chroniącym przed mrozem."
        ru: "Этим людям нужны были собаки, причём собаки тяжёлые, с сильными мышцами для работы и с шерстью, защищающей от мороза."
    words: { "szykują": szykowac, "wybrzeża": wybrzeze, "mięśniach": miesien, "omacku": omacek, "metal": metal, "mrozem": mroz }
  - clean: "Buck mieszkał w dużym domu w słonecznej dolinie Santa Clara. Nazywano go posiadłością sędziego Millera. Stał z dala od drogi, na wpół ukryty wśród drzew, spomiędzy których prześwitywała szeroka, chłodna weranda biegnąca wokół wszystkich czterech ścian. Do domu prowadziły wysypane żwirem aleje, które wiły się wśród rozległych trawników i pod splecionymi gałęziami wysokich topoli. Z tyłu wszystko miało jeszcze większy rozmach niż od frontu."
    en: "Buck lived at a big house in the sun-kissed Santa Clara Valley. Judge Miller’s place, it was called. It stood back from the road, half hidden among the trees, through which glimpses could be caught of the wide cool veranda that ran around its four sides. The house was approached by gravelled driveways which wound about through wide-spreading lawns and under the interlacing boughs of tall poplars. At the rear things were on even a more spacious scale than at the front."
    draft: true
    chunks:
      - pl: "Buck mieszkał w dużym domu w słonecznej dolinie Santa Clara."
        ru: "Бэк жил в большом доме в солнечной долине Санта-Клара."
      - pl: " Nazywano go posiadłością sędziego Millera."
        ru: "Его называли усадьбой судьи Миллера."
        note: "posiadłość — усадьба, имение"
      - pl: " Stał z dala od drogi, na wpół ukryty wśród drzew, spomiędzy których prześwitywała szeroka, chłodna weranda biegnąca wokół wszystkich czterech ścian."
        ru: "Он стоял в стороне от дороги, наполовину скрытый деревьями, между которыми проглядывала широкая прохладная веранда, обегавшая все четыре стены."
        note: "prześwitywać — просвечивать, проглядывать"
      - pl: " Do domu prowadziły wysypane żwirem aleje, które wiły się wśród rozległych trawników i pod splecionymi gałęziami wysokich topoli."
        ru: "К дому вели посыпанные гравием аллеи, вившиеся среди обширных лужаек и под сплетёнными ветвями высоких тополей."
        note: "żwir — гравий; topola — тополь"
      - pl: " Z tyłu wszystko miało jeszcze większy rozmach niż od frontu."
        ru: "Позади всё было ещё размашистее, чем спереди."
        note: "rozmach — размах"
    words: { "dolinie": dolina, "posiadłością": posiadlosc, "szeroka": szeroki, "chłodna": chlodny, "żwirem": zwir, "frontu": front }
  - clean: "Były tam wielkie stajnie, w których rządziło kilkunastu stajennych i chłopców, rzędy obrośniętych winoroślą domków dla służby, niekończący się i uporządkowany szereg zabudowań gospodarczych, długie altany winne, zielone pastwiska, sady i krzaki jagód. Była też pompownia przy studni artezyjskiej i duży cementowy basen, w którym synowie sędziego Millera brali rano kąpiel i chłodzili się w upalne popołudnia."
    en: "There were great stables, where a dozen grooms and boys held forth, rows of vine-clad servants’ cottages, an endless and orderly array of outhouses, long grape arbors, green pastures, orchards, and berry patches. Then there was the pumping plant for the artesian well, and the big cement tank where Judge Miller’s boys took their morning plunge and kept cool in the hot afternoon."
    draft: true
    chunks:
      - pl: "Były tam wielkie stajnie, w których rządziło kilkunastu stajennych i chłopców, rzędy obrośniętych winoroślą domków dla służby,"
        ru: "Там были большие конюшни, где хозяйничал десяток конюхов и мальчишек, ряды увитых виноградом домиков для прислуги,"
        note: "stajenny — конюх; winorośl — виноградная лоза"
      - pl: " niekończący się i uporządkowany szereg zabudowań gospodarczych, długie altany winne, zielone pastwiska, sady i krzaki jagód."
        ru: "бесконечный и аккуратный ряд хозяйственных построек, длинные виноградные беседки, зелёные пастбища, сады и ягодники."
        note: "zabudowania gospodarcze — хозяйственные постройки"
      - pl: " Była też pompownia przy studni artezyjskiej i duży cementowy basen,"
        ru: "Была и насосная у артезианского колодца, и большой цементный бассейн,"
      - pl: " w którym synowie sędziego Millera brali rano kąpiel i chłodzili się w upalne popołudnia."
        ru: "в котором сыновья судьи Миллера купались по утрам и охлаждались в жаркие послеполуденные часы."
    words: { "domków": domek, "szereg": szereg, "studni": studnia, "basen": basen, "kąpiel": kapiel, "popołudnia": popoludnie }
  - clean: "A nad całą tą wielką posiadłością panował Buck. Tu się urodził i tu przeżył cztery lata swojego życia. Owszem, były tu inne psy. W tak ogromnym miejscu nie mogło ich nie być, ale one się nie liczyły. Przychodziły i odchodziły, mieszkały w ludnych psiarniach albo żyły niepozornie w zakamarkach domu, jak Toots, japoński mops, czy Ysabel, meksykański nagi pies — dziwne stworzenia, które rzadko wystawiały nos za drzwi czy stawiały łapę na ziemi."
    en: "And over this great demesne Buck ruled. Here he was born, and here he had lived the four years of his life. It was true, there were other dogs. There could not but be other dogs on so vast a place, but they did not count. They came and went, resided in the populous kennels, or lived obscurely in the recesses of the house after the fashion of Toots, the Japanese pug, or Ysabel, the Mexican hairless,—strange creatures that rarely put nose out of doors or set foot to ground."
    draft: true
    chunks:
      - pl: "A nad całą tą wielką posiadłością panował Buck."
        ru: "А над всем этим большим имением властвовал Бэк."
      - pl: " Tu się urodził i tu przeżył cztery lata swojego życia."
        ru: "Здесь он родился и здесь прожил четыре года своей жизни."
      - pl: " Owszem, były tu inne psy."
        ru: "Правда, были здесь и другие собаки."
      - pl: " W tak ogromnym miejscu nie mogło ich nie być, ale one się nie liczyły."
        ru: "В таком огромном месте их не могло не быть, но они не шли в счёт."
      - pl: " Przychodziły i odchodziły, mieszkały w ludnych psiarniach albo żyły niepozornie w zakamarkach domu,"
        ru: "Они появлялись и исчезали, жили в многолюдных псарнях или незаметно ютились в закоулках дома,"
        note: "psiarnia — псарня; zakamarek — закоулок"
      - pl: " jak Toots, japoński mops, czy Ysabel, meksykański nagi pies — dziwne stworzenia, które rzadko wystawiały nos za drzwi czy stawiały łapę na ziemi."
        ru: "как Тутс, японский мопс, или Изабель, мексиканская голая собачка, — странные создания, которые редко высовывали нос за дверь или ступали лапой на землю."
        note: "mops — мопс; łapa — лапа"
    words: { "posiadłością": posiadlosc, "panował": panowac, "japoński": japonski, "meksykański": meksykanski, "rzadko": rzadko, "łapę": lapa }
  - clean: "Z drugiej strony były foksteriery, co najmniej ze dwadzieścia, które ujadały groźne obietnice pod adresem Tootsa i Ysabel, wyglądających na nie z okien pod ochroną legionu pokojówek uzbrojonych w miotły i szczotki."
    en: "On the other hand, there were the fox terriers, a score of them at least, who yelped fearful promises at Toots and Ysabel looking out of the windows at them and protected by a legion of housemaids armed with brooms and mops."
    draft: true
    chunks:
