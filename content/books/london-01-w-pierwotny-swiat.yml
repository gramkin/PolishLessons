        ru: "которые с визгом сулили страшные кары Тутсу и Изабель, глядевшим на них из окон под защитой легиона горничных, вооружённых мётлами и швабрами."
        note: "ujadać — тявкать, лаять; pokojówka — горничная; miotła — метла"
    words: { "groźne": grozny, "obietnice": obietnica, "adresem": adres, "pokojówek": pokojowka, "uzbrojonych": uzbroic }
  - clean: "Ale Buck nie był ani psem pokojowym, ani psem z psiarni. Całe królestwo należało do niego. Skakał do basenu albo chodził na polowanie z synami sędziego; towarzyszył Mollie i Alice, córkom sędziego, w długich spacerach o zmierzchu lub wczesnym rankiem; w zimowe noce leżał u stóp sędziego przed huczącym kominkiem w bibliotece; nosił na grzbiecie wnuków sędziego albo tarzał ich w trawie i strzegł ich kroków podczas dzikich wypraw aż do fontanny na podwórzu stajennym, a nawet dalej, gdzie były wybiegi i krzaki jagód. Wśród terierów kroczył władczo, a Tootsa i Ysabel zupełnie nie zauważał, bo był królem — królem wszystkiego, co pełza, czołga się i lata w posiadłości sędziego Millera, nie wyłączając ludzi."
    en: "But Buck was neither house-dog nor kennel-dog. The whole realm was his. He plunged into the swimming tank or went hunting with the Judge’s sons; he escorted Mollie and Alice, the Judge’s daughters, on long twilight or early morning rambles; on wintry nights he lay at the Judge’s feet before the roaring library fire; he carried the Judge’s grandsons on his back, or rolled them in the grass, and guarded their footsteps through wild adventures down to the fountain in the stable yard, and even beyond, where the paddocks were, and the berry patches. Among the terriers he stalked imperiously, and Toots and Ysabel he utterly ignored, for he was king,—king over all creeping, crawling, flying things of Judge Miller’s place, humans included."
    draft: true
    chunks:
      - pl: "Ale Buck nie był ani psem pokojowym, ani psem z psiarni."
        ru: "Но Бэк не был ни комнатной собакой, ни собакой с псарни."
