  - clean: "Uchronił się jednak przed tym, by stać się zwykłym rozpieszczonym psem pokojowym. Polowania i podobne rozrywki na świeżym powietrzu nie pozwalały mu przytyć i hartowały mięśnie; a dla niego, jak dla ludów kąpiących się w zimnej wodzie, miłość do wody była lekarstwem i strażnikiem zdrowia."
    en: "But he had saved himself by not becoming a mere pampered house-dog. Hunting and kindred outdoor delights had kept down the fat and hardened his muscles; and to him, as to the cold-tubbing races, the love of water had been a tonic and a health preserver."
    draft: true
    chunks:
      - pl: "Uchronił się jednak przed tym, by stać się zwykłym rozpieszczonym psem pokojowym."
        ru: "Однако он уберёгся от того, чтобы стать обыкновенной изнеженной комнатной собакой."
