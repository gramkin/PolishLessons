  - clean: "„Odwieczne tęsknoty wędrowne\nszarpią łańcuch obyczaju;\nznów z zimowego snu\nbudzi się dzika krew”."
    en: "“Old longings nomadic leap,\nChafing at custom’s chain;\nAgain from its brumal sleep\nWakens the ferine strain.”"
    draft: true
    verse: true
