  - clean: "Dniem i nocą statek drżał od niestrudzonego tętna śruby, i choć jeden dzień był bardzo podobny do drugiego, Buck wyraźnie czuł, że robi się coraz zimniej. Wreszcie pewnego ranka śruba ucichła, a „Narwala” przeniknęła atmosfera podniecenia. Buck czuł ją, podobnie jak inne psy, i wiedział, że zbliża się zmiana. François wziął ich na smycze i wyprowadził na pokład. Przy pierwszym kroku na zimnej powierzchni łapy Bucka zapadły się w coś białego i grząskiego, bardzo podobnego do błota."
    en: "Day and night the ship throbbed to the tireless pulse of the propeller, and though one day was very like another, it was apparent to Buck that the weather was steadily growing colder. At last, one morning, the propeller was quiet, and the Narwhal was pervaded with an atmosphere of excitement. He felt it, as did the other dogs, and knew that a change was at hand. François leashed them and brought them on deck. At the first step upon the cold surface, Buck’s feet sank into a white mushy something very like mud."
