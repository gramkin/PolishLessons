  - clean: "Odskoczył z parsknięciem. Z nieba sypało się więcej tej białej substancji. Otrząsnął się, ale spadło na niego jeszcze więcej. Obwąchał to z ciekawością, a potem zlizał trochę językiem. Piekło jak ogień, a w następnej chwili zniknęło. Zdziwiło go to. Spróbował jeszcze raz, z tym samym skutkiem. Gapie zaśmiewali się do rozpuku, a jemu zrobiło się wstyd, sam nie wiedział dlaczego, bo był to jego pierwszy śnieg."
