  - clean: "W międzypokładzie „Narwala” Buck i Curly dołączyli do dwóch innych psów. Jeden z nich był dużym, śnieżnobiałym psem ze Spitsbergenu, którego przywiózł kapitan wielorybniczego statku i który później towarzyszył wyprawie geologicznej na pustkowia. Był przyjazny w podstępny sposób: uśmiechał się prosto w twarz, obmyślając jednocześnie jakąś podłą sztuczkę, jak na przykład wtedy, gdy podczas pierwszego posiłku ukradł Buckowi jedzenie. Kiedy Buck skoczył, żeby go ukarać, w powietrzu zaśpiewał rzemień bata François i pierwszy dosięgnął winowajcy; Buckowi pozostało tylko odzyskać kość. To było sprawiedliwe ze strony François, uznał, i Metys zaczął rosnąć w oczach Bucka."
    en: "In the ’tween-decks of the Narwhal, Buck and Curly joined two other dogs. One of them was a big, snow-white fellow from Spitzbergen who had been brought away by a whaling captain, and who had later accompanied a Geological Survey into the Barrens. He was friendly, in a treacherous sort of way, smiling into one’s face the while he meditated some underhand trick, as, for instance, when he stole from Buck’s food at the first meal. As Buck sprang to punish him, the lash of François’s whip sang through the air, reaching the culprit first; and nothing remained to Buck but to recover the bone. That was fair of François, he decided, and the half-breed began his rise in Buck’s estimation."
    draft: true
