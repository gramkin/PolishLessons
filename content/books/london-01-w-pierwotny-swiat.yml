  - clean: "Jego ojciec, Elmo, olbrzymi bernardyn, był nieodłącznym towarzyszem sędziego, i zanosiło się na to, że Buck pójdzie w ślady ojca. Nie był tak wielki — ważył tylko sześćdziesiąt trzy kilogramy — bo jego matka, Shep, była szkockim owczarkiem. Mimo to sześćdziesiąt trzy kilogramy, do których dochodziła godność płynąca z dobrego życia i powszechnego szacunku, pozwalały mu nosić się iście po królewsku. Przez cztery lata, od kiedy był szczeniakiem, prowadził życie sytego arystokraty; był z siebie bardzo dumny, a nawet odrobinę zarozumiały, jak bywają czasem wiejscy panowie z powodu swego odosobnienia."
    en: "His father, Elmo, a huge St. Bernard, had been the Judge’s inseparable companion, and Buck bid fair to follow in the way of his father. He was not so large,—he weighed only one hundred and forty pounds,—for his mother, Shep, had been a Scotch shepherd dog. Nevertheless, one hundred and forty pounds, to which was added the dignity that comes of good living and universal respect, enabled him to carry himself in right royal fashion. During the four years since his puppyhood he had lived the life of a sated aristocrat; he had a fine pride in himself, was even a trifle egotistical, as country gentlemen sometimes become because of their insular situation."
    draft: true
    chunks:
      - pl: "Jego ojciec, Elmo, olbrzymi bernardyn, był nieodłącznym towarzyszem sędziego, i zanosiło się na to, że Buck pójdzie w ślady ojca."
        ru: "Его отец, Эльмо, огромный сенбернар, был неразлучным спутником судьи, и всё шло к тому, что Бэк пойдёт по стопам отца."
        note: "bernardyn — сенбернар; zanosić się na coś — назревать, к тому идти"
      - pl: " Nie był tak wielki — ważył tylko sześćdziesiąt trzy kilogramy — bo jego matka, Shep, była szkockim owczarkiem."
        ru: "Он был не так велик — весил всего шестьдесят три килограмма, — потому что его мать, Шеп, была шотландской овчаркой."
        note: "owczarek — овчарка; у Лондона 140 фунтов"
      - pl: " Mimo to sześćdziesiąt trzy kilogramy, do których dochodziła godność płynąca z dobrego życia i powszechnego szacunku, pozwalały mu nosić się iście po królewsku."
        ru: "Тем не менее шестьдесят три килограмма, к которым прибавлялось достоинство, рождённое сытой жизнью и всеобщим уважением, позволяли ему держаться истинно по-королевски."
        note: "iście — истинно, поистине"
      - pl: " Przez cztery lata, od kiedy był szczeniakiem, prowadził życie sytego arystokraty;"
        ru: "Четыре года, с тех пор как был щенком, он вёл жизнь пресыщенного аристократа;"
