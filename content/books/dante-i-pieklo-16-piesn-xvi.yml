        ru: "Как вспененная река своим устьем"
        note: "zapieniony — вспененный; ujście — устье"
      - pl: "\nNa wschód od Wizo do morza przecieka,"
        ru: "на восток от Монте-Визо к морю протекает,"
        note: "Wizo — Монте-Визо"
      - pl: "\nZ gór Apeninu, zwana Aquachetą,"
        ru: "с гор Апеннин, зовомая Аквакетой,"
        note: "Aquacheta — Аквакета, верхнее течение Монтоне"
      - pl: "\nNim zstąpi w głębsze na dolinach łoże;"
        ru: "прежде чем сойдёт в более глубокое ложе в долинах;"
      - pl: "\nPrzy Forli traci to imię, a potem,"
        ru: "у Форли теряет это имя, а потом,"
      - pl: "\nJak z gór kaskada spadając z łoskotem,"
        ru: "как каскад, падая с гор с грохотом,"
      - pl: "\nGrzmi wód hałasem przy San Benedetto,"
