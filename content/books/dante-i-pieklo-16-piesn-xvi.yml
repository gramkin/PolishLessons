      - pl: "\nJeśli ci zda się mówić: ja tam byłem —"
        ru: "если тебе захочется сказать: я там был, —"
      - pl: "\nChciej nas przypomnieć żyjących pamięci!»"
        ru: "изволь напомнить о нас памяти живых!»"
