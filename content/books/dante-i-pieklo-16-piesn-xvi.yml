# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 16
chapterTitle: "Pieśń XVI"
chapterTitleRu: "Песнь XVI. Три флорентийца"
level: B2
paragraphs:
  - clean: "(Krąg VII. Koło III. Ciąg dalszy. Gwidogwera. Rusticuci)."
    chunks:
      - pl: "(Krąg VII. Koło III. Ciąg dalszy. Gwidogwera. Rusticuci)."
        ru: "(Круг VII. Пояс III. Продолжение. Гвидо Гуэрра. Рустикуччи.)"
    words: { "Krąg": krag, "Koło": kolo, "Ciąg": ciag, "dalszy": daleki }
  - clean: "Już byłem w miejscu, gdzie słychać szum wody,\nKtóra spadała w drugi krąg piekielny\nSzumiąc podobnie jak w ulach gwar pszczelny.\nTrzy cienie od tej oderwane trzody,\nCo przechodziła pod ognistym deszczem,\nPodbiegły do nas, krzycząc w uniesieniu:\n«O stój, poznajem po twoim odzieniu,\nŻeś dziecko naszej występnej ojczyzny»."
    verse: true
    chunks:
      - pl: "Już byłem w miejscu, gdzie słychać szum wody,"
        ru: "Я был уже в месте, где слышен шум воды,"
      - pl: "\nKtóra spadała w drugi krąg piekielny"
        ru: "что падала во второй адский круг,"
        note: "то есть в следующий, восьмой"
      - pl: "\nSzumiąc podobnie jak w ulach gwar pszczelny."
        ru: "шумя, как гул пчёл в ульях."
        note: "ul — улей; gwar — гул; pszczelny — пчелиный"
      - pl: "\nTrzy cienie od tej oderwane trzody,"
        ru: "Три тени, оторвавшись от того стада,"
        note: "oderwany — оторванный"
      - pl: "\nCo przechodziła pod ognistym deszczem,"
        ru: "что проходило под огненным дождём,"
      - pl: "\nPodbiegły do nas, krzycząc w uniesieniu:"
        ru: "подбежали к нам, крича в возбуждении:"
        note: "uniesienie — возбуждение, порыв"
      - pl: "\n«O stój, poznajem po twoim odzieniu,"
        ru: "«О, стой! Мы узнаём по твоей одежде,"
        note: "odzienie — одежда; poznajem — устар. «узнаём»"
      - pl: "\nŻeś dziecko naszej występnej ojczyzny»."
        ru: "что ты дитя нашей преступной отчизны»."
        note: "występny — преступный, порочный"
    words: { "szum": szum, "piekielny": piekielny, "podobnie": podobnie, "trzody": trzoda, "deszczem": deszcz, "ojczyzny": ojczyzna }
  - clean: "Widziałem na ich ciałach od płomienia\nŚwieże i stare wypalone blizny;\nNiestety! Jeszcze wspominam je z dreszczem,\nChoć czas na poły zatarł ślad wrażenia.\nNa krzyk ich brzegiem idący porzecznym\nMistrz stanął; do mnie obrócił się twarzą\nI rzekł: «Stań, jeśli chcesz być dla nich grzecznym:\nGdyby nie ognie, co te piaski skwarzą,\nRzekłbym, że witać z skwapliwością całą,\nWięcej by tobie niźli im przystało»."
    verse: true
    chunks:
      - pl: "Widziałem na ich ciałach od płomienia"
        ru: "Я видел на их телах от пламени"
      - pl: "\nŚwieże i stare wypalone blizny;"
        ru: "свежие и старые выжженные шрамы;"
        note: "blizna — шрам"
      - pl: "\nNiestety! Jeszcze wspominam je z dreszczem,"
        ru: "увы! ещё вспоминаю их с дрожью,"
      - pl: "\nChoć czas na poły zatarł ślad wrażenia."
        ru: "хоть время наполовину стёрло след впечатления."
        note: "na poły — наполовину"
      - pl: "\nNa krzyk ich brzegiem idący porzecznym"
        ru: "На их крик учитель, шедший прибрежьем,"
        note: "porzeczny — прибрежный"
      - pl: "\nMistrz stanął; do mnie obrócił się twarzą"
        ru: "остановился; ко мне обернулся лицом"
      - pl: "\nI rzekł: «Stań, jeśli chcesz być dla nich grzecznym:"
        ru: "и сказал: «Остановись, если хочешь быть с ними учтивым:"
        note: "grzeczny — учтивый"
      - pl: "\nGdyby nie ognie, co te piaski skwarzą,"
        ru: "если бы не огни, что палят эти пески,"
        note: "skwarzyć — палить, жарить"
      - pl: "\nRzekłbym, że witać z skwapliwością całą,"
        ru: "сказал бы я, что встречать их со всей поспешностью"
        note: "skwapliwość — поспешность, рвение"
      - pl: "\nWięcej by tobie niźli im przystało»."
        ru: "больше подобало бы тебе, чем им»."
        note: "niźli — книжн. «чем»"
    words: { "płomienia": plomien, "wypalone": wypalic, "obrócił": obrocic, "rzekł": rzec, "piaski": piasek, "skwapliwością": skwapliwosc }
  - clean: "Gdyśmy stanęli, starą pieśń okrzyków\nCienie zawyły z boleści wyrazem,\nKręcąc się w kółko wszyscy trzej zarazem\nI obyczajem nagich zapaśników\nJuż namaszczonych, co się okiem mierzą,\nNim w szrankach na się piersią w pierś uderzą,\nCienie wprost do mnie obracając twarze,\nW krąg się kręciły po stepu obszarze,\nW sposób, że szyja skrzywiona z ich nogą,\nCiągle jak w sporze, przeciwną szły drogą."
    verse: true
    chunks:
      - pl: "Gdyśmy stanęli, starą pieśń okrzyków"
        ru: "Когда мы остановились, старую песнь причитаний"
      - pl: "\nCienie zawyły z boleści wyrazem,"
        ru: "тени взвыли с выражением боли,"
      - pl: "\nKręcąc się w kółko wszyscy trzej zarazem"
        ru: "кружась в кольцо все трое разом,"
        note: "w kółko — по кругу"
      - pl: "\nI obyczajem nagich zapaśników"
        ru: "и, по обычаю нагих борцов,"
        note: "zapaśnik — борец"
      - pl: "\nJuż namaszczonych, co się okiem mierzą,"
        ru: "уже умащённых, что меряются взглядом,"
        note: "namaszczony — умащённый"
      - pl: "\nNim w szrankach na się piersią w pierś uderzą,"
        ru: "прежде чем на арене ударятся грудь о грудь,"
        note: "szranki — ристалище; na się — друг на друга"
      - pl: "\nCienie wprost do mnie obracając twarze,"
        ru: "тени, обращая лица прямо ко мне,"
      - pl: "\nW krąg się kręciły po stepu obszarze,"
        ru: "кружились по простору степи,"
        note: "obszar — простор"
      - pl: "\nW sposób, że szyja skrzywiona z ich nogą,"
        ru: "так что шея, повёрнутая против ноги,"
        note: "skrzywiony — искривлённый"
      - pl: "\nCiągle jak w sporze, przeciwną szły drogą."
        ru: "всё время, словно в споре, шла противоположным путём."
    words: { "pieśń": piesn, "wyrazem": wyraz, "kółko": kolko, "mierzą": mierzyc, "obszarze": obszar, "przeciwną": przeciwny }
  - clean: "Jeden tak mówił: «Chociaż pełen groźby\nStep ten ruchomy, smutny i spalony,\nPodał w pogardę nas i nasze prośby,\nMów, naszej sławy odgłosem skłoniony,\nKto jesteś, co tu stopami żywemi\nStąpasz po piekle śmiało jak po ziemi?"
    verse: true
    chunks:
      - pl: "Jeden tak mówił: «Chociaż pełen groźby"
        ru: "Одна говорила так: «Хотя полная угрозы"
      - pl: "\nStep ten ruchomy, smutny i spalony,"
        ru: "эта зыбкая, печальная и выжженная степь"
      - pl: "\nPodał w pogardę nas i nasze prośby,"
        ru: "выставила на презрение нас и наши просьбы,"
        note: "podać w pogardę — сделать презренным"
      - pl: "\nMów, naszej sławy odgłosem skłoniony,"
        ru: "скажи, склонённый отзвуком нашей славы,"
        note: "odgłos — отзвук"
      - pl: "\nKto jesteś, co tu stopami żywemi"
        ru: "кто ты, что здесь живыми стопами"
        note: "żywemi — ныне żywymi"
      - pl: "\nStąpasz po piekle śmiało jak po ziemi?"
        ru: "ступаешь по аду смело, как по земле?"
        note: "stąpać — ступать"
    words: { "groźby": grozba, "smutny": smutny, "prośby": prosba, "sławy": slawa, "odgłosem": odglos, "piekle": pieklo }
  - clean: "Patrz, ten, którego ja zacieram ślady,\nNagi, żarami obdarty ze skóry,\nBył dobrze większym, jak ty mniemasz mężem;\nBył wnukiem skromnej i pięknej Gwalrady\nNazwisko jego było Gwidogwera,\nMąż zawołany radą i orężem."
    verse: true
    chunks:
      - pl: "Patrz, ten, którego ja zacieram ślady,"
        ru: "Смотри: этот, чьи следы я стираю,"
        note: "zacierać ślady — идти след в след"
      - pl: "\nNagi, żarami obdarty ze skóry,"
        ru: "нагой, жаром ободранный от кожи,"
        note: "obdarty — ободранный"
      - pl: "\nBył dobrze większym, jak ty mniemasz mężem;"
        ru: "был куда более великим мужем, чем ты думаешь;"
        note: "dobrze większy — куда больше"
      - pl: "\nBył wnukiem skromnej i pięknej Gwalrady"
        ru: "был внуком скромной и прекрасной Гвальдрады,"
      - pl: "\nNazwisko jego było Gwidogwera,"
        ru: "имя его было Гвидо Гуэрра,"
        note: "Gwidogwera — Гвидо Гуэрра"
      - pl: "\nMąż zawołany radą i orężem."
        ru: "муж, прославленный советом и оружием."
        note: "zawołany — славный; oręż — оружие"
    words: { "ślady": slad, "Nagi": nagi, "skóry": skora, "wnukiem": wnuk, "skromnej": skromny, "orężem": orez }
  - clean: "Drugi, co ze mną, smutny i ponury,\nGorące żwiry stopami rozciera,\nWpatruj się dobrze, to Aldobrandini,\nWieszcz bez słuchacza wśród swojej krainy!\nIch współmęczennik w tej ognia pustyni\nJam Rustikuci; zaiste zła żona\nWięcej jak wszystko, wwiodła mnie do winy»."
    verse: true
    chunks:
      - pl: "Drugi, co ze mną, smutny i ponury,"
        ru: "Второй, что со мной, печальный и мрачный,"
      - pl: "\nGorące żwiry stopami rozciera,"
        ru: "стопами растирает горячий гравий,"
        note: "żwir — гравий"
      - pl: "\nWpatruj się dobrze, to Aldobrandini,"
        ru: "вглядись хорошенько: это Альдобранди,"
        note: "Теггьяйо Альдобранди"
      - pl: "\nWieszcz bez słuchacza wśród swojej krainy!"
        ru: "пророк без слушателя в своей стране!"
        note: "wieszcz — пророк"
      - pl: "\nIch współmęczennik w tej ognia pustyni"
        ru: "Их товарищ по мучениям в этой огненной пустыне —"
        note: "współmęczennik — товарищ по мукам"
      - pl: "\nJam Rustikuci; zaiste zła żona"
        ru: "я, Рустикуччи; воистину, злая жена"
      - pl: "\nWięcej jak wszystko, wwiodła mnie do winy»."
        ru: "больше всего ввела меня в грех»."
        note: "wwieść — ввести"
    words: { "Gorące": goracy, "żwiry": zwir, "krainy": kraina, "ognia": ogien, "pustyni": pustynia, "winy": wina }
  - clean: "Gdybym był pewny od ognia zachrony,\nSkoczyłbym na dół objąć ich w ramiona,\nWierzę, nie byłby mistrz tym zasmucony;\nLecz myśl, że będę na żarach spieczony,\nStrach w końcu we mnie dobry zamiar przemógł,\nŻem ich uściskiem lubować się nie mógł."
    verse: true
    chunks:
      - pl: "Gdybym był pewny od ognia zachrony,"
        ru: "Если бы я был уверен в защите от огня,"
        note: "zachrona — устар. «защита»"
      - pl: "\nSkoczyłbym na dół objąć ich w ramiona,"
        ru: "я прыгнул бы вниз, чтобы обнять их,"
      - pl: "\nWierzę, nie byłby mistrz tym zasmucony;"
        ru: "верю, учитель не был бы этим огорчён;"
      - pl: "\nLecz myśl, że będę na żarach spieczony,"
        ru: "но мысль, что я буду обожжён на углях,"
        note: "spieczony — обожжённый"
      - pl: "\nStrach w końcu we mnie dobry zamiar przemógł,"
        ru: "страх наконец одолел во мне доброе намерение,"
        note: "przemóc — одолеть"
      - pl: "\nŻem ich uściskiem lubować się nie mógł."
        ru: "так что я не мог насладиться их объятием."
        note: "uścisk — объятие; lubować się — наслаждаться"
    words: { "Skoczyłbym": skoczyc, "objąć": objac, "ramiona": ramie, "mistrz": mistrz, "Strach": strach, "uściskiem": uscisk }
  - clean: "Potem na takie zdobyłem się słowa:\n«Nie jest to wzgarda, lecz boleść serdeczna,\nJaką mi sprawia wasza męka wieczna.\nMnie o was mistrza uprzedziła mowa,\nWedług słów jego pomyślałem wreszcie,\nJacyście przyszli, takimi jesteście,\nJestem wasz ziomek i zawsze z zapałem\nO waszych czynach szlachetnych słuchałem."
    verse: true
    chunks:
      - pl: "Potem na takie zdobyłem się słowa:"
        ru: "Потом я собрался с такими словами:"
        note: "zdobyć się na coś — собраться с силами на что-л."
      - pl: "\n«Nie jest to wzgarda, lecz boleść serdeczna,"
        ru: "«Это не презрение, а сердечная боль,"
      - pl: "\nJaką mi sprawia wasza męka wieczna."
        ru: "что причиняет мне ваша вечная мука."
      - pl: "\nMnie o was mistrza uprzedziła mowa,"
        ru: "Речь учителя предупредила меня о вас,"
        note: "uprzedzić — предупредить"
      - pl: "\nWedług słów jego pomyślałem wreszcie,"
        ru: "по его словам я подумал наконец,"
      - pl: "\nJacyście przyszli, takimi jesteście,"
        ru: "каковы вы, пришедшие, такими вы и являетесь,"
        note: "jacyście — jacy + -ście"
      - pl: "\nJestem wasz ziomek i zawsze z zapałem"
        ru: "я ваш земляк и всегда с жаром"
      - pl: "\nO waszych czynach szlachetnych słuchałem."
        ru: "слушал о ваших благородных делах."
    words: { "sprawia": sprawiac, "wieczna": wieczny, "uprzedziła": uprzedzic, "mowa": mowa, "czynach": czyn, "szlachetnych": szlachetny }
  - clean: "Żółć porzuciłem, cel mej drogi główny\nDojść do owoców, których treść tak słodka!\nCo mi obiecał mój wódz prawdomówny;\nLecz tu wpierw muszę zstąpić aż do środka».\nCień rzekł: «Niech dusza twoimi członkami\nKieruje długo, sława niech obleci\nZakres dni twoich i po tobie świeci."
    verse: true
    chunks:
      - pl: "Żółć porzuciłem, cel mej drogi główny"
        ru: "Я оставил желчь, главная цель моего пути —"
        note: "żółć — желчь, горечь"
      - pl: "\nDojść do owoców, których treść tak słodka!"
        ru: "дойти до плодов, чей вкус так сладок,"
      - pl: "\nCo mi obiecał mój wódz prawdomówny;"
        ru: "что обещал мне мой правдивый вождь;"
        note: "prawdomówny — правдивый"
      - pl: "\nLecz tu wpierw muszę zstąpić aż do środka»."
        ru: "но здесь я прежде должен спуститься до самого центра»."
      - pl: "\nCień rzekł: «Niech dusza twoimi członkami"
        ru: "Тень сказала: «Пусть душа твоими членами"
      - pl: "\nKieruje długo, sława niech obleci"
        ru: "правит долго, пусть слава облетит"
        note: "oblecieć — облететь"
      - pl: "\nZakres dni twoich i po tobie świeci."
        ru: "срок твоих дней и светит после тебя."
        note: "zakres — пределы, срок"
    words: { "porzuciłem": porzucic, "owoców": owoc, "wódz": wodz, "wpierw": wpierw, "Cień": cien, "Zakres": zakres }
  - clean: "Mów, czy waleczność i uczucia szczere\nŻyją jak niegdyś pomiędzy ziomkami,\nCzy już wygnane są u nich w bezcześci?\nBo gość niedawny Wilhelm Borsijere ,\nKtóry tu przybył społem jęczeć z nami,\nPrzerażające opowiada wieści»."
    verse: true
    chunks:
      - pl: "Mów, czy waleczność i uczucia szczere"
        ru: "Скажи, живут ли доблесть и искренние чувства"
        note: "waleczność — доблесть"
      - pl: "\nŻyją jak niegdyś pomiędzy ziomkami,"
        ru: "среди земляков, как некогда,"
      - pl: "\nCzy już wygnane są u nich w bezcześci?"
        ru: "или уже изгнаны и у них в бесчестье?"
        note: "bezcześć — бесчестье"
      - pl: "\nBo gość niedawny Wilhelm Borsijere ,"
        ru: "Ибо недавний гость, Гульельмо Борсьере,"
        note: "Wilhelm Borsijere — Гульельмо Борсьере"
      - pl: "\nKtóry tu przybył społem jęczeć z nami,"
        ru: "что прибыл сюда вместе стенать с нами,"
      - pl: "\nPrzerażające opowiada wieści»."
        ru: "рассказывает ужасающие вести»."
    words: { "szczere": szczery, "Żyją": zyc, "przybył": przybyc, "opowiada": opowiadac, "wieści": wiesc }
  - clean: "«Zatyli na twym, Florencyjo, chlebie\nPrzybysze nowi (zysk nagły a lichy),\nZrodzili tyle swawoli i pychy,\nŻe już złem własnym skarżysz sama siebie».\nTak wykrzyknąłem z podniesioną twarzą:\nSłysząc to, cienie po sobie spojrzały,\nJak ci, co głosem prawdy się przerażą."
    verse: true
    chunks:
      - pl: "«Zatyli na twym, Florencyjo, chlebie"
        ru: "«Разжирели на твоём, Флоренция, хлебе"
        note: "zatyć — разжиреть"
      - pl: "\nPrzybysze nowi (zysk nagły a lichy),"
        ru: "пришельцы новые (выгода внезапная и жалкая),"
        note: "przybysz — пришелец"
      - pl: "\nZrodzili tyle swawoli i pychy,"
        ru: "породили столько своеволия и гордыни,"
        note: "swawola — своеволие"
      - pl: "\nŻe już złem własnym skarżysz sama siebie»."
        ru: "что ты уже собственным злом сама себя обвиняешь»."
      - pl: "\nTak wykrzyknąłem z podniesioną twarzą:"
        ru: "Так воскликнул я, подняв лицо:"
      - pl: "\nSłysząc to, cienie po sobie spojrzały,"
        ru: "слыша это, тени переглянулись,"
        note: "spojrzeć po sobie — переглянуться"
      - pl: "\nJak ci, co głosem prawdy się przerażą."
        ru: "как те, что ужаснутся голосу правды."
    words: { "chlebie": chleb, "zysk": zysk, "nagły": nagly, "złem": zlo, "podniesioną": podniesc, "przerażą": przerazic }
  - clean: "Potem samotrzeć tak odpowiedziały:\n«Jeżeli zawsze, najskąpszy z gadaczy!\nTak małym kosztem zbywasz twych słuchaczy,\nSzczęśliwie mierzysz miarą słów twe chęci:\nPrzecież gdy zdołasz wyjść z tych miejsc rozpaczy\nI ujrzysz świat twój z gwiazd światłem tak miłym,\nJeśli ci zda się mówić: ja tam byłem —\nChciej nas przypomnieć żyjących pamięci!»"
