        note: "gadacz — говорун"
      - pl: "\nTak małym kosztem zbywasz twych słuchaczy,"
        ru: "так малой ценой отделываешься от своих слушателей,"
        note: "zbywać — отделываться"
      - pl: "\nSzczęśliwie mierzysz miarą słów twe chęci:"
        ru: "то счастливо меряешь мерой слов свои желания:"
      - pl: "\nPrzecież gdy zdołasz wyjść z tych miejsc rozpaczy"
        ru: "и всё же, когда сумеешь выйти из этих мест отчаяния"
      - pl: "\nI ujrzysz świat twój z gwiazd światłem tak miłym,"
