chapter: 6
chapterTitle: "Pieśń VI"
chapterTitleRu: "Песнь VI. Юстиниан"
level: B2
paragraphs:
  - clean: "(Na Merkurym. Mowa Justyniana o orle cesarskim. Dzieje cesarstwa rzymsko-niemieckiego i polityczny system Dantego. Mieszkańcy Merkurego.)"
    chunks:
      - pl: "(Na Merkurym. Mowa Justyniana o orle cesarskim. Dzieje cesarstwa rzymsko-niemieckiego i polityczny system Dantego. Mieszkańcy Merkurego.)"
        ru: "(На Меркурии. Речь Юстиниана об императорском орле. История Римско-германской империи и политическая система Данте. Обитатели Меркурия.)"
    words: { "Mowa": mowa, "niemieckiego": niemiecki, "polityczny": polityczny, "system": system, "Mieszkańcy": mieszkaniec }
  - clean: "«Za Konstantyna, gdy z Cezarów drzewa\nZerwał się orzeł, a przeciwna gwiazda,\nNie ta, gdy leciał w Eneasza tropy,\nWidziała, jak siadł na stolicy nowej;\nDwieście i więcej lat ptak Jowiszowy\nGościł na Wschodzie, na krańcu Europy,\nW pobliżu Idy, skąd wyleciał z gniazda."
    verse: true
    chunks:
      - pl: "«Za Konstantyna, gdy z Cezarów drzewa"
        ru: "«При Константине, когда с древа цезарей"
      - pl: "\nZerwał się orzeł, a przeciwna gwiazda,"
        ru: "сорвался орёл, против хода неба,"
        note: "przeciwna gwiazda — против движения неба: с запада на восток"
      - pl: "\nNie ta, gdy leciał w Eneasza tropy,"
        ru: "не так, как когда летел по следам Энея,"
      - pl: "\nWidziała, jak siadł na stolicy nowej;"
        ru: "видела [звезда], как он сел на новом престоле;"
      - pl: "\nDwieście i więcej lat ptak Jowiszowy"
        ru: "двести с лишним лет птица Юпитера"
      - pl: "\nGościł na Wschodzie, na krańcu Europy,"
        ru: "гостила на Востоке, на краю Европы,"
      - pl: "\nW pobliżu Idy, skąd wyleciał z gniazda."
        ru: "близ Иды, откуда вылетела из гнезда."
    words: { "orzeł": orzel, "przeciwna": przeciwny, "tropy": trop, "stolicy": stolica, "wyleciał": wyleciec, "gniazda": gniazdo }
  - clean: "Tam rządził światem w swoich skrzydeł cieniu;\nChodząc z rąk do rąk przez koleje różne,\nPtak przysiadł w końcu na moim ramieniu.\nByłem Justynian Cezar, moja sława\nBrzmi, że posłuszny bożemu natchnieniu\nPierwszy ludowe ułożyłem prawa,\nZ nich wyrzuciwszy zbyteczne i próżne."
    verse: true
    chunks:
      - pl: "Tam rządził światem w swoich skrzydeł cieniu;"
        ru: "Там он правил миром в тени своих крыльев;"
      - pl: "\nChodząc z rąk do rąk przez koleje różne,"
        ru: "переходя из рук в руки через разные превратности,"
      - pl: "\nPtak przysiadł w końcu na moim ramieniu."
        ru: "птица наконец присела на моём плече."
      - pl: "\nByłem Justynian Cezar, moja sława"
        ru: "Я был цезарь Юстиниан, моя слава"
      - pl: "\nBrzmi, że posłuszny bożemu natchnieniu"
        ru: "гласит, что, послушный Божьему вдохновению,"
      - pl: "\nPierwszy ludowe ułożyłem prawa,"
        ru: "я первый упорядочил народные законы,"
        note: "свод законов Юстиниана"
      - pl: "\nZ nich wyrzuciwszy zbyteczne i próżne."
        ru: "выбросив из них лишнее и пустое."
    words: { "rządził": rzadzic, "skrzydeł": skrzydlo, "cieniu": cien, "Ptak": ptak, "sława": slawa, "ułożyłem": ulozyc }
  - clean: "Wpierw, z wielu błędów wyznając niektóre,\nWierzyłem w jedną Chrystusa naturę;\nLecz wielki pasterz Agapet z urzędu\nZgromił błąd taki, wycofał mnie z błędu,\nWszystko, co mówił, sprawdziła tu wiara.\nWidzę w niej jasno, jak w każdym przeczeniu\nFałsz obok prawdy dojrzysz w okamgnieniu."
    verse: true
    chunks:
      - pl: "Wpierw, z wielu błędów wyznając niektóre,"
        ru: "Прежде, признавая некоторые из многих заблуждений,"
      - pl: "\nWierzyłem w jedną Chrystusa naturę;"
        ru: "я верил в одну природу Христа;"
        note: "монофизитство"
      - pl: "\nLecz wielki pasterz Agapet z urzędu"
        ru: "но великий пастырь Агапит по должности"
      - pl: "\nZgromił błąd taki, wycofał mnie z błędu,"
        ru: "обличил такое заблуждение, вывел меня из ошибки,"
      - pl: "\nWszystko, co mówił, sprawdziła tu wiara."
        ru: "всё, что он говорил, подтвердила здесь вера."
      - pl: "\nWidzę w niej jasno, jak w każdym przeczeniu"
        ru: "Я ясно вижу в ней, как в каждом противоречии"
      - pl: "\nFałsz obok prawdy dojrzysz w okamgnieniu."
        ru: "в мгновение ока различишь ложь рядом с правдой."
    words: { "Wpierw": wpierw, "niektóre": niektory, "naturę": natura, "urzędu": urzad, "wiara": wiara, "przeczeniu": przeczyc }
  - clean: "Gdym szedł z Kościołem, niebo myśl natchnęło,\nAbym wykonał to olbrzymie dzieło.\nMiecz zdałem w ręce mego Belizara,.\nPrawica boża była przy nim w boju\nJako znak, abym odpoczął w pokoju.\nZaspokoiłem twe pierwsze pytanie,\nLecz jego przedmiot wielce ważnej treści\nZmusza mnie jeszcze rzucić światło na nie,\nAżebyś widział, gdzie słuszności źródło,\nCzy w tych, co święte chcą przywłaszczyć godło,\nCzy w drugich, co się opierają temu."
    verse: true
    chunks:
      - pl: "Gdym szedł z Kościołem, niebo myśl natchnęło,"
        ru: "Когда я шёл с Церковью, небо вдохновило меня"
      - pl: "\nAbym wykonał to olbrzymie dzieło."
        ru: "совершить это исполинское дело."
      - pl: "\nMiecz zdałem w ręce mego Belizara,."
        ru: "Меч я передал в руки моего Велизария,"
      - pl: "\nPrawica boża była przy nim w boju"
        ru: "десница Божья была с ним в бою,"
        note: "prawica — десница"
      - pl: "\nJako znak, abym odpoczął w pokoju."
        ru: "как знак, чтобы я отдохнул в мире."
      - pl: "\nZaspokoiłem twe pierwsze pytanie,"
        ru: "Я утолил твой первый вопрос,"
      - pl: "\nLecz jego przedmiot wielce ważnej treści"
        ru: "но его предмет, весьма важного содержания,"
      - pl: "\nZmusza mnie jeszcze rzucić światło na nie,"
        ru: "заставляет меня ещё пролить на него свет,"
      - pl: "\nAżebyś widział, gdzie słuszności źródło,"
        ru: "чтобы ты видел, где источник правоты:"
      - pl: "\nCzy w tych, co święte chcą przywłaszczyć godło,"
        ru: "в тех ли, кто хочет присвоить святой знак,"
        note: "гибеллины"
      - pl: "\nCzy w drugich, co się opierają temu."
        ru: "или в других, кто противится ему."
        note: "гвельфы"
    words: { "dzieło": dzielo, "boju": boj, "odpoczął": odpoczac, "przedmiot": przedmiot, "Zmusza": zmuszac, "opierają": opierac }
  - clean: "Patrz, ptak monarszy przez jak świetne dzieła\nU wszystkich ludów stał się godnym cześci;\nA chwała jego w ten dzień się poczęła,\nGdy Pallas umarł, by państwo dać jemu.\nWiesz, jak on w Albie mieszkał przez trzy wieki\nDo dnia, o którym brzmiał rozgłos daleki,\nGdy zań trzej z trzema zwiedli pojedynek."
    verse: true
    chunks:
      - pl: "Patrz, ptak monarszy przez jak świetne dzieła"
        ru: "Смотри, какими блестящими делами царственная птица"
      - pl: "\nU wszystkich ludów stał się godnym cześci;"
        ru: "стала достойной почёта у всех народов;"
      - pl: "\nA chwała jego w ten dzień się poczęła,"
        ru: "а слава его началась в тот день,"
      - pl: "\nGdy Pallas umarł, by państwo dać jemu."
        ru: "когда Паллант умер, чтобы дать ему державу."
      - pl: "\nWiesz, jak on w Albie mieszkał przez trzy wieki"
        ru: "Ты знаешь, как он жил в Альбе три века"
      - pl: "\nDo dnia, o którym brzmiał rozgłos daleki,"
        ru: "до дня, о котором гремела далёкая молва,"
      - pl: "\nGdy zań trzej z trzema zwiedli pojedynek."
        ru: "когда за него трое с тремя вели поединок."
        note: "Горации и Куриации"
    words: { "ludów": lud, "chwała": chwala, "poczęła": poczac, "państwo": panstwo, "daleki": daleki, "pojedynek": pojedynek }
  - clean: "Wiesz od porwania co zrobił Sabinek,\nDo Lukrecyi zemszczonej boleści,\nZa siedmiu królów; wiesz, jak podniósł czoło,\nSąsiednie ludy korząc naokoło.\nOn wiódł do boju rzymskie legijony,\nHord koczujących zawściągał zagony,\nHołd na Brennusie, Pirrusie wymusza:\nSkąd Torkwat, Kwintus, który przyjął miano,\nŻe swą czuprynę nosił rozczochraną,\nSłyną po zgonie obok Fabijusza."
    verse: true
    chunks:
      - pl: "Wiesz od porwania co zrobił Sabinek,"
        ru: "Ты знаешь, что он сделал от похищения сабинянок"
      - pl: "\nDo Lukrecyi zemszczonej boleści,"
        ru: "до отомщённой скорби Лукреции"
      - pl: "\nZa siedmiu królów; wiesz, jak podniósł czoło,"
        ru: "при семи царях; знаешь, как он поднял чело,"
      - pl: "\nSąsiednie ludy korząc naokoło."
        ru: "покоряя соседние народы кругом."
        note: "korzyć — покорять"
      - pl: "\nOn wiódł do boju rzymskie legijony,"
        ru: "Он вёл в бой римские легионы,"
      - pl: "\nHord koczujących zawściągał zagony,"
        ru: "сдерживал набеги кочующих орд,"
      - pl: "\nHołd na Brennusie, Pirrusie wymusza:"
        ru: "вынуждает дань от Бренна, Пирра:"
      - pl: "\nSkąd Torkwat, Kwintus, który przyjął miano,"
        ru: "откуда Торкват, Квинций, получивший имя"
      - pl: "\nŻe swą czuprynę nosił rozczochraną,"
        ru: "за то, что носил растрёпанные волосы,"
        note: "Цинциннат — «кудрявый»"
      - pl: "\nSłyną po zgonie obok Fabijusza."
        ru: "славятся после смерти рядом с Фабием."
    words: { "królów": krol, "podniósł": podniesc, "czoło": czolo, "przyjął": przyjac, "nosił": nosic, "zgonie": zgon }
  - clean: "On dumę Maurów podeptał szponami,\nGdy przeszli Alpy śladem Hannibala,\nZ których, o Padzie, twoja płynie fala.\nScypion, Pompejusz, jeszcze młodzieńcami\nTryumfowali ponad jej brzegami;\nMiecz ich, gdzie młode igrałeś pacholę,\nTwoją rodzinną skrwawił Fijesolę."
    verse: true
    chunks:
      - pl: "On dumę Maurów podeptał szponami,"
        ru: "Он попрал когтями гордость мавров,"
      - pl: "\nGdy przeszli Alpy śladem Hannibala,"
        ru: "когда они перешли Альпы по следу Ганнибала,"
      - pl: "\nZ których, o Padzie, twoja płynie fala."
        ru: "из которых, о По, течёт твоя волна."
      - pl: "\nScypion, Pompejusz, jeszcze młodzieńcami"
        ru: "Сципион, Помпей, ещё юношами,"
      - pl: "\nTryumfowali ponad jej brzegami;"
        ru: "торжествовали над её берегами;"
      - pl: "\nMiecz ich, gdzie młode igrałeś pacholę,"
        ru: "их меч обагрил твоё родное Фьезоле,"
      - pl: "\nTwoją rodzinną skrwawił Fijesolę."
        ru: "где ты играл юным отроком."
        note: "pachołę — отрок"
    words: { "dumę": duma, "fala": fala, "młodzieńcami": mlodzieniec, "brzegami": brzeg, "Miecz": miecz, "rodzinną": rodzinny }
  - clean: "Potem, gdy niebo wzburzony przez wojny\nChciało na wzór swój zrobić świat spokojny,\nW ręce Cezara przeszedł ptak dostojny\nZa wolą Rzymian. Lecąc przed Cezarem,\nPtak grzmiał skrzydłami nad Renem i Warem:\nWody Isery, Saony, Sekwany,\nI strumieniami wzdęte fale Ronu,\nWidziały ptaka lot niezmordowany."
    verse: true
    chunks:
      - pl: "Potem, gdy niebo wzburzony przez wojny"
        ru: "Потом, когда небо, взволнованное войнами,"
      - pl: "\nChciało na wzór swój zrobić świat spokojny,"
        ru: "захотело сделать мир спокойным по своему образцу,"
      - pl: "\nW ręce Cezara przeszedł ptak dostojny"
        ru: "достойная птица перешла в руки Цезаря"
      - pl: "\nZa wolą Rzymian. Lecąc przed Cezarem,"
        ru: "по воле римлян. Летя перед Цезарем,"
      - pl: "\nPtak grzmiał skrzydłami nad Renem i Warem:"
        ru: "птица гремела крыльями над Рейном и Варом:"
      - pl: "\nWody Isery, Saony, Sekwany,"
        ru: "воды Изеры, Соны, Сены"
      - pl: "\nI strumieniami wzdęte fale Ronu,"
        ru: "и вздутые ручьями волны Роны"
      - pl: "\nWidziały ptaka lot niezmordowany."
        ru: "видели неутомимый полёт птицы."
    words: { "niebo": niebo, "wojny": wojna, "wzór": wzor, "spokojny": spokojny, "Lecąc": leciec, "strumieniami": strumien }
  - clean: "Pochód z Rawenny, przejście Rubikonu,\nTak były szybkie, że szlakiem latacza\nChcąc dążyć, język i pióro rozpacza.\nPrzebiegł Hiszpany, Durazzo, a potem\nO błoń farsalską jak grom spadający\nPotężnym skrzydeł uderzył łoskotem,\nAż z bólu do dna zadrżał Nil gorący."
    verse: true
    chunks:
      - pl: "Pochód z Rawenny, przejście Rubikonu,"
        ru: "Поход из Равенны, переход Рубикона"
      - pl: "\nTak były szybkie, że szlakiem latacza"
        ru: "были так быстры, что, желая следовать"
      - pl: "\nChcąc dążyć, język i pióro rozpacza."
        ru: "путём летуна, язык и перо отчаиваются."
      - pl: "\nPrzebiegł Hiszpany, Durazzo, a potem"
        ru: "Он пробежал Испании, Дураццо, а потом"
      - pl: "\nO błoń farsalską jak grom spadający"
        ru: "на фарсальское поле, как падающий гром,"
      - pl: "\nPotężnym skrzydeł uderzył łoskotem,"
        ru: "ударил могучим грохотом крыльев,"
      - pl: "\nAż z bólu do dna zadrżał Nil gorący."
        ru: "так что от боли до дна задрожал горячий Нил."
    words: { "szlakiem": szlak, "dążyć": dazyc, "język": jezyk, "pióro": pioro, "Potężnym": potezny, "bólu": bol }
  - clean: "Zwiedził Symois, skąd jakby od wczoraj\nZ gniazda wyleciał, zwiedził grób Hektora;\nPtolomeusza rzuciwszy na zgubę,\nPoleciał deptać Maurytana Jubę:\nPotem na Zachód załamał tor drogi,\nKędy Pompejusz dął w wojenne rogi."
    verse: true
    chunks:
      - pl: "Zwiedził Symois, skąd jakby od wczoraj"
        ru: "Посетил Симоент, откуда будто со вчерашнего дня"
      - pl: "\nZ gniazda wyleciał, zwiedził grób Hektora;"
        ru: "вылетел из гнезда, посетил гробницу Гектора;"
      - pl: "\nPtolomeusza rzuciwszy na zgubę,"
        ru: "бросив Птолемея на погибель,"
      - pl: "\nPoleciał deptać Maurytana Jubę:"
        ru: "полетел попирать мавританца Юбу:"
      - pl: "\nPotem na Zachód załamał tor drogi,"
        ru: "потом надломил путь на запад,"
      - pl: "\nKędy Pompejusz dął w wojenne rogi."
        ru: "где Помпей трубил в боевые рога."
        note: "сыновья Помпея"
    words: { "grób": grob, "zgubę": zguba, "Poleciał": poleciec, "załamał": zalamac, "rogi": rog, "wojenne": wojenny }
  - clean: "Na koniec spoczął na Augusta dłoni,\nA co z nim zdziałał, na odgłos tej wieści\nBrutus, Kasyjusz, z gniewu w piekle wyją.\nPłacze Modena, Perugia łzy roni,\nZ ócz Kleopatry płyną łzy boleści,\nGdy uciekając od orła pogoni\nUmiera nagle, ukąszona żmiją."
    verse: true
    chunks:
      - pl: "Na koniec spoczął na Augusta dłoni,"
        ru: "Наконец он отдохнул на руке Августа,"
      - pl: "\nA co z nim zdziałał, na odgłos tej wieści"
        ru: "а что он с ним совершил, — от отзвука этой вести"
      - pl: "\nBrutus, Kasyjusz, z gniewu w piekle wyją."
        ru: "Брут, Кассий в аду воют от гнева."
      - pl: "\nPłacze Modena, Perugia łzy roni,"
        ru: "Плачет Модена, Перуджа роняет слёзы,"
      - pl: "\nZ ócz Kleopatry płyną łzy boleści,"
        ru: "из очей Клеопатры текут слёзы скорби,"
      - pl: "\nGdy uciekając od orła pogoni"
        ru: "когда, убегая от погони орла,"
      - pl: "\nUmiera nagle, ukąszona żmiją."
        ru: "она внезапно умирает, ужаленная змеёй."
    words: { "spoczął": spoczac, "dłoni": dlon, "odgłos": odglos, "gniewu": gniew, "piekle": pieklo, "płyną": plynac }
  - clean: "Z nim rzymski orzeł, ludy rozburzone\nKarcąc, zaleciał na morze Czerwone,\nZ nim taki pokój zdobył przez podboje,\nŻe światu zamknął Janusa podwoje.\nLecz co to godło, które pobudziło\nMnie mówić o nim, dla świata zrobiło,\nCo mogło zrobić, jako cień, jak mara,\nWszystkie te czyny zbledną i zagasną,\nJeśli z miłością nań spojrzym i jasno,\nWidząc je w ręku trzeciego Cezara."
    verse: true
    chunks:
      - pl: "Z nim rzymski orzeł, ludy rozburzone"
        ru: "С ним римский орёл, карая взбунтовавшиеся народы,"
      - pl: "\nKarcąc, zaleciał na morze Czerwone,"
        ru: "долетел до Красного моря,"
      - pl: "\nZ nim taki pokój zdobył przez podboje,"
        ru: "с ним завоеваниями добыл такой мир,"
      - pl: "\nŻe światu zamknął Janusa podwoje."
        ru: "что закрыл миру двери Януса."
      - pl: "\nLecz co to godło, które pobudziło"
        ru: "Но то, что этот знак, который побудил"
      - pl: "\nMnie mówić o nim, dla świata zrobiło,"
        ru: "меня говорить о нём, сделал для мира,"
      - pl: "\nCo mogło zrobić, jako cień, jak mara,"
