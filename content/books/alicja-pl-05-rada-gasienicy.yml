  - clean: "Tak dawno nie była choć w przybliżeniu właściwej wielkości, że z początku wydało jej się to całkiem dziwne; ale po kilku minutach przywykła i zaczęła jak zwykle mówić do siebie. „No, połowa mojego planu już wykonana! Jakież mylące są te wszystkie przemiany! Nigdy nie jestem pewna, czym będę za chwilę! W każdym razie wróciłam do właściwego wzrostu: teraz trzeba dostać się do tego pięknego ogrodu — ciekawe, jak to zrobić?” Gdy to mówiła, wyszła nagle na otwarte miejsce, gdzie stał domek wysoki na jakieś cztery stopy. „Ktokolwiek tam mieszka”, pomyślała Alicja, „nie wypada zjawiać się u niego w tym wzroście: przecież wystraszyłabym go na śmierć!” Zaczęła więc znowu skubać kawałek z prawej ręki i nie odważyła się podejść do domku, dopóki nie zmalała do dziewięciu cali."
