title: Przygody Alicji w Krainie Czarów
titleRu: Приключения Алисы в Стране чудес
author: Lewis Carroll
translator: "перевод на польский — черновик, требует проверки носителем"
source:
  name: Project Gutenberg (оригинал 1865 г.)
  url: https://www.gutenberg.org/ebooks/11
  license: Public domain
  licenseUrl: https://www.gutenberg.org/policy/permission.html
chapter: 5
chapterTitle: Rada Gąsienicy
chapterTitleRu: Совет Гусеницы
level: B1
paragraphs:
  - clean: "Gąsienica i Alicja przyglądały się sobie przez chwilę w milczeniu; wreszcie Gąsienica wyjęła nargile z ust i odezwała się do niej omdlewającym, sennym głosem."
    en: "The Caterpillar and Alice looked at each other for some time in silence: at last the Caterpillar took the hookah out of its mouth, and addressed her in a languid, sleepy voice."
    chunks:
      - pl: "Gąsienica i Alicja przyglądały się sobie przez chwilę w milczeniu;"
        ru: "Гусеница и Алиса какое-то время молча разглядывали друг друга;"
        note: "przyglądać się komuś — разглядывать кого-л.: дательный падеж"
      - pl: " wreszcie Gąsienica wyjęła nargile z ust"
        ru: "наконец Гусеница вынула кальян изо рта"
        note: "wyjąć coś z czegoś — вынуть что-л. откуда-л.: z и родительный"
      - pl: " i odezwała się do niej omdlewającym, sennym głosem."
        ru: "и заговорила с ней томным, сонным голосом."
        note: "odezwać się do kogoś — заговорить с кем-л.: do и родительный"
    words: { "ust": usta, "odezwała": odezwac, "głosem": glos }
  - clean: "„Kim ty jesteś?”, spytała Gąsienica."
    en: "“Who are _you?_” said the Caterpillar."
    chunks:
      - pl: "„Kim ty jesteś?”, spytała Gąsienica."
        ru: "«Кто ты такая?» — спросила Гусеница."
        note: "kim jesteś — кто ты: при być именная часть идёт в творительном падеже"
  - clean: "Nie był to zachęcający początek rozmowy. Alicja odpowiedziała dość nieśmiało: „Ja… ja sama ledwie wiem, proszę pani, w tej chwili… to znaczy wiem, kim byłam, kiedy wstałam dziś rano, ale zdaje mi się, że od tego czasu zmieniałam się już kilka razy.”"
    en: "This was not an encouraging opening for a conversation. Alice replied, rather shyly, “I—I hardly know, sir, just at present—at least I know who I _was_ when I got up this morning, but I think I must have been changed several times since then.”"
    chunks:
      - pl: "Nie był to zachęcający początek rozmowy."
        ru: "Это было не слишком располагающее начало разговора."
        note: "zachęcający — располагающий, ободряющий"
      - pl: " Alicja odpowiedziała dość nieśmiało:"
        ru: "Алиса ответила довольно робко:"
        note: "nieśmiało — робко, застенчиво"
      - pl: " „Ja… ja sama ledwie wiem, proszę pani, w tej chwili…"
        ru: "«Я… я и сама едва знаю, сударыня, в эту минуту…"
        note: "proszę pani — сударыня: в оригинале Алиса зовёт Гусеницу «сэр», но польское gąsienica женского рода, поэтому обращение женское"
      - pl: " to znaczy wiem, kim byłam, kiedy wstałam dziś rano,"
        ru: "то есть я знаю, кем я была, когда встала сегодня утром,"
        note: "wstać — встать: совершенный вид от wstawać"
      - pl: " ale zdaje mi się, że od tego czasu zmieniałam się już kilka razy.”"
        ru: "но мне кажется, что с тех пор я уже несколько раз менялась.»"
        note: "zdaje mi się — мне кажется: безличный оборот с дательным"
    words: { "początek": poczatek, "rozmowy": rozmowa, "odpowiedziała": odpowiedziec, "wstałam": wstac, "dziś": dzis, "rano": rano, "zdaje": zdawac, "zmieniałam": zmieniac }
  - clean: "„Co przez to rozumiesz?”, spytała surowo Gąsienica. „Wytłumacz się!”"
    en: "“What do you mean by that?” said the Caterpillar sternly. “Explain yourself!”"
    chunks:
      - pl: "„Co przez to rozumiesz?”, spytała surowo Gąsienica."
        ru: "«Что ты хочешь этим сказать?» — строго спросила Гусеница."
        note: "co przez to rozumiesz — что ты под этим понимаешь"
      - pl: " „Wytłumacz się!”"
        ru: "«Объяснись!»"
        note: "wytłumaczyć się — объясниться, оправдаться"
    words: { "Wytłumacz": wytlumaczyc }
  - clean: "„Obawiam się, że nie potrafię wytłumaczyć samej siebie, proszę pani”, powiedziała Alicja, „bo widzi pani, ja nie jestem sobą.”"
    en: "“I can’t explain _myself_, I’m afraid, sir,” said Alice, “because I’m not myself, you see.”"
    chunks:
      - pl: "„Obawiam się, że nie potrafię wytłumaczyć samej siebie, proszę pani”, powiedziała Alicja,"
        ru: "«Боюсь, что не сумею объяснить саму себя, сударыня», — сказала Алиса,"
        note: "obawiam się, że — боюсь, что: вежливое смягчение"
      - pl: " „bo widzi pani, ja nie jestem sobą.”"
        ru: "«потому что, видите ли, я сама не своя.»"
        note: "nie jestem sobą — я сама не своя: творительный падеж при być"
    words: { "Obawiam": obawiac, "potrafię": potrafic }
  - clean: "„Nie widzę”, powiedziała Gąsienica."
    en: "“I don’t see,” said the Caterpillar."
    chunks:
      - pl: "„Nie widzę”, powiedziała Gąsienica."
        ru: "«Не вижу», — сказала Гусеница."
        note: "widzieć — видеть; nie widzę — не вижу"
  - clean: "„Obawiam się, że nie umiem tego wyrazić jaśniej”, odparła Alicja bardzo grzecznie, „bo przede wszystkim sama tego nie rozumiem; a być w ciągu jednego dnia tylu różnych rozmiarów to bardzo mąci w głowie.”"
    en: "“I’m afraid I can’t put it more clearly,” Alice replied very politely, “for I can’t understand it myself to begin with; and being so many different sizes in a day is very confusing.”"
    chunks:
      - pl: "„Obawiam się, że nie umiem tego wyrazić jaśniej”, odparła Alicja bardzo grzecznie,"
        ru: "«Боюсь, что яснее выразить не умею», — ответила Алиса очень вежливо,"
        note: "wyrazić — выразить; jaśniej — яснее: сравнительная степень"
      - pl: " „bo przede wszystkim sama tego nie rozumiem;"
        ru: "«потому что прежде всего я и сама этого не понимаю;"
        note: "przede wszystkim — прежде всего"
      - pl: " a być w ciągu jednego dnia tylu różnych rozmiarów to bardzo mąci w głowie.”"
        ru: "а быть в течение одного дня стольких разных размеров — это очень путает мысли.»"
        note: "w ciągu czegoś — в течение чего-л.: родительный падеж"
    words: { "umiem": umiec, "wyrazić": wyrazic, "odparła": odeprzec, "wszystkim": wszyscy, "ciągu": ciag, "różnych": rozny, "głowie": glowa }
  - clean: "„Wcale nie”, powiedziała Gąsienica."
    en: "“It isn’t,” said the Caterpillar."
    chunks:
      - pl: "„Wcale nie”, powiedziała Gąsienica."
        ru: "«Вовсе нет», — сказала Гусеница."
        note: "wcale nie — вовсе нет"
    words: { "Wcale": wcale }
  - clean: "„No, może pani jeszcze tego tak nie odczuwa”, powiedziała Alicja; „ale kiedy przyjdzie się pani zamienić w poczwarkę — a kiedyś się przyjdzie, wie pani — a potem w motyla, to chyba wyda się to pani trochę dziwne, prawda?”"
    en: "“Well, perhaps you haven’t found it so yet,” said Alice; “but when you have to turn into a chrysalis—you will some day, you know—and then after that into a butterfly, I should think you’ll feel it a little queer, won’t you?”"
    chunks:
      - pl: "„No, może pani jeszcze tego tak nie odczuwa”, powiedziała Alicja;"
        ru: "«Ну, может быть, вы этого пока так не чувствуете», — сказала Алиса;"
        note: "odczuwać — ощущать, чувствовать"
      - pl: " „ale kiedy przyjdzie się pani zamienić w poczwarkę —"
        ru: "«но когда вам придётся превратиться в куколку —"
        note: "przyjdzie się komuś coś zrobić — кому-л. придётся что-л. сделать: безличный оборот"
      - pl: " a kiedyś się przyjdzie, wie pani —"
        ru: "а когда-нибудь придётся, знаете ли —"
        note: "kiedyś — когда-нибудь, однажды"
      - pl: " a potem w motyla, to chyba wyda się to pani trochę dziwne, prawda?”"
        ru: "а потом в бабочку, то вам это, пожалуй, покажется немного странным, правда?»"
        note: "wydać się komuś — показаться кому-л.: дательный падеж"
    words: { "zamienić": zamienic, "kiedyś": kiedys, "potem": potem, "wyda": wydac, "dziwne": dziwny }
  - clean: "„Ani trochę”, powiedziała Gąsienica."
    en: "“Not a bit,” said the Caterpillar."
    chunks:
      - pl: "„Ani trochę”, powiedziała Gąsienica."
        ru: "«Ничуть», — сказала Гусеница."
        note: "ani trochę — ничуть, ни капельки"
  - clean: "„No, może pani odczucia są inne”, powiedziała Alicja; „wiem tylko tyle, że mnie wydałoby się to bardzo dziwne.”"
    en: "“Well, perhaps your feelings may be different,” said Alice; “all I know is, it would feel very queer to _me_.”"
    chunks:
      - pl: "„No, może pani odczucia są inne”, powiedziała Alicja;"
        ru: "«Ну, может быть, у вас другие ощущения», — сказала Алиса;"
        note: "pani odczucia — ваши ощущения: pani служит и притяжательным «ваш»"
      - pl: " „wiem tylko tyle, że mnie wydałoby się to bardzo dziwne.”"
        ru: "«знаю только то, что мне это показалось бы очень странным.»"
        note: "wydałoby się — показалось бы: условное наклонение"
    words: { "tyle": tyl }
  - clean: "„Tobie!”, powiedziała Gąsienica z pogardą. „A kim ty jesteś?”"
    en: "“You!” said the Caterpillar contemptuously. “Who are _you?_”"
    chunks:
      - pl: "„Tobie!”, powiedziała Gąsienica z pogardą."
        ru: "«Тебе!» — сказала Гусеница с презрением."
        note: "z pogardą — с презрением: творительный падеж"
      - pl: " „A kim ty jesteś?”"
        ru: "«А кто ты такая?»"
        note: "kim — творительный падеж от kto"
  - clean: "Co sprowadziło rozmowę z powrotem do punktu wyjścia. Alicję trochę zirytowało to, że Gąsienica robi tak bardzo krótkie uwagi, więc wyprostowała się i powiedziała z wielką powagą: „Sądzę, że to pani powinna najpierw powiedzieć mi, kim jest.”"
    en: "Which brought them back again to the beginning of the conversation. Alice felt a little irritated at the Caterpillar’s making such _very_ short remarks, and she drew herself up and said, very gravely, “I think, you ought to tell me who _you_ are, first.”"
    chunks:
      - pl: "Co sprowadziło rozmowę z powrotem do punktu wyjścia."
        ru: "Что вернуло разговор к исходной точке."
        note: "punkt wyjścia — исходная точка, отправной пункт"
      - pl: " Alicję trochę zirytowało to, że Gąsienica robi tak bardzo krótkie uwagi,"
        ru: "Алису немного раздражало, что Гусеница делает такие очень короткие замечания,"
        note: "zirytować kogoś — раздражать кого-л.: винительный падеж"
      - pl: " więc wyprostowała się i powiedziała z wielką powagą:"
        ru: "поэтому она выпрямилась и сказала с большой важностью:"
        note: "z wielką powagą — с большой серьёзностью: творительный падеж"
      - pl: " „Sądzę, że to pani powinna najpierw powiedzieć mi, kim jest.”"
        ru: "«Полагаю, это вы должны сначала сказать мне, кто вы.»"
        note: "sądzę, że — полагаю, что"
    words: { "sprowadziło": sprowadzic, "powrotem": powrot, "punktu": punkt, "krótkie": krotki, "uwagi": uwaga, "Sądzę": sadzic, "najpierw": najpierw }
  - clean: "„Dlaczego?”, spytała Gąsienica."
    en: "“Why?” said the Caterpillar."
    chunks:
      - pl: "„Dlaczego?”, spytała Gąsienica."
        ru: "«Почему?» — спросила Гусеница."
        note: "dlaczego — почему"
  - clean: "Oto kolejne kłopotliwe pytanie; a ponieważ Alicja nie mogła wymyślić żadnego dobrego powodu, a Gąsienica zdawała się być w bardzo niemiłym usposobieniu, dziewczynka odwróciła się i odeszła."
    en: "Here was another puzzling question; and as Alice could not think of any good reason, and as the Caterpillar seemed to be in a _very_ unpleasant state of mind, she turned away."
    chunks:
      - pl: "Oto kolejne kłopotliwe pytanie;"
        ru: "Вот ещё один затруднительный вопрос;"
        note: "kłopotliwy — затруднительный, неловкий"
      - pl: " a ponieważ Alicja nie mogła wymyślić żadnego dobrego powodu,"
        ru: "а так как Алиса не могла придумать никакой хорошей причины,"
        note: "wymyślić — придумать, выдумать"
      - pl: " a Gąsienica zdawała się być w bardzo niemiłym usposobieniu,"
        ru: "а Гусеница, казалось, была в очень недобром расположении духа,"
        note: "usposobienie — расположение духа, настроение"
      - pl: " dziewczynka odwróciła się i odeszła."
        ru: "девочка отвернулась и ушла."
        note: "odejść — уйти, отойти"
    words: { "Oto": oto, "kolejne": kolejny, "pytanie": pytanie, "wymyślić": wymyslic, "powodu": powod, "dziewczynka": dziewczynka, "odwróciła": odwrocic, "odeszła": odejsc }
  - clean: "„Wróć!”, zawołała za nią Gąsienica. „Mam ci coś ważnego do powiedzenia!”"
    en: "“Come back!” the Caterpillar called after her. “I’ve something important to say!”"
    chunks:
      - pl: "„Wróć!”, zawołała za nią Gąsienica."
        ru: "«Вернись!» — крикнула ей вслед Гусеница."
        note: "wrócić — вернуться; wróć! — вернись!"
      - pl: " „Mam ci coś ważnego do powiedzenia!”"
        ru: "«Мне надо сказать тебе кое-что важное!»"
        note: "mieć coś do powiedzenia — иметь что сказать: конструкция mieć + do + отглагольное существительное"
    words: { "zawołała": zawolac, "ważnego": wazny }
  - clean: "To zabrzmiało obiecująco, rzecz jasna: Alicja zawróciła i podeszła z powrotem."
    en: "This sounded promising, certainly: Alice turned and came back again."
    chunks:
      - pl: "To zabrzmiało obiecująco, rzecz jasna:"
        ru: "Это, разумеется, прозвучало многообещающе:"
        note: "rzecz jasna — разумеется, само собой"
      - pl: " Alicja zawróciła i podeszła z powrotem."
        ru: "Алиса повернула назад и подошла снова."
        note: "zawrócić — повернуть назад"
    words: { "rzecz": rzec, "jasna": jasny, "podeszła": podejsc }
  - clean: "„Panuj nad sobą”, powiedziała Gąsienica."
    en: "“Keep your temper,” said the Caterpillar."
    chunks:
      - pl: "„Panuj nad sobą”, powiedziała Gąsienica."
        ru: "«Владей собой», — сказала Гусеница."
        note: "panować nad sobą — владеть собой: nad и творительный"
  - clean: "„I to wszystko?”, spytała Alicja, przełykając gniew najlepiej, jak potrafiła."
    en: "“Is that all?” said Alice, swallowing down her anger as well as she could."
    chunks:
      - pl: "„I to wszystko?”, spytała Alicja,"
        ru: "«И это всё?» — спросила Алиса,"
        note: "i to wszystko — и это всё"
      - pl: " przełykając gniew najlepiej, jak potrafiła."
        ru: "проглатывая гнев как могла лучше."
        note: "przełykać gniew — глотать гнев, сдерживать злость"
  - clean: "„Nie”, powiedziała Gąsienica."
    en: "“No,” said the Caterpillar."
    chunks:
      - pl: "„Nie”, powiedziała Gąsienica."
        ru: "«Нет», — сказала Гусеница."
  - clean: "Alicja pomyślała, że równie dobrze może zaczekać, skoro i tak nie ma nic innego do roboty, a może w końcu usłyszy coś, co warto usłyszeć. Przez kilka minut Gąsienica pykała, nic nie mówiąc, ale wreszcie rozplotła ręce, znów wyjęła nargile z ust i powiedziała: „Więc uważasz, że się zmieniłaś, tak?”"
    en: "Alice thought she might as well wait, as she had nothing else to do, and perhaps after all it might tell her something worth hearing. For some minutes it puffed away without speaking, but at last it unfolded its arms, took the hookah out of its mouth again, and said, “So you think you’re changed, do you?”"
    chunks:
      - pl: "Alicja pomyślała, że równie dobrze może zaczekać,"
        ru: "Алиса подумала, что с тем же успехом может подождать,"
        note: "równie dobrze — с тем же успехом"
      - pl: " skoro i tak nie ma nic innego do roboty,"
        ru: "раз всё равно делать больше нечего,"
        note: "skoro — раз, поскольку"
      - pl: " a może w końcu usłyszy coś, co warto usłyszeć."
        ru: "а может, в конце концов услышит что-то стоящее."
        note: "warto — стоит: безличное слово, за ним инфинитив"
      - pl: " Przez kilka minut Gąsienica pykała, nic nie mówiąc,"
        ru: "Несколько минут Гусеница попыхивала, ничего не говоря,"
        note: "pykać — попыхивать (трубкой)"
      - pl: " ale wreszcie rozplotła ręce, znów wyjęła nargile z ust i powiedziała:"
        ru: "но наконец расплела руки, снова вынула кальян изо рта и сказала:"
        note: "rozpleść ręce — разомкнуть сложенные руки"
      - pl: " „Więc uważasz, że się zmieniłaś, tak?”"
        ru: "«Значит, ты считаешь, что изменилась, да?»"
        note: "uważać, że — считать, что"
    words: { "pomyślała": pomyslec, "równie": rownie, "zaczekać": zaczekac, "skoro": skoro, "roboty": robota, "usłyszy": uslyszec, "minut": minuta, "ręce": reka, "zmieniłaś": zmienic }
  - clean: "„Obawiam się, że tak, proszę pani”, powiedziała Alicja; „nie pamiętam rzeczy tak jak dawniej… i nie utrzymuję tego samego wzrostu nawet przez dziesięć minut!”"
    en: "“I’m afraid I am, sir,” said Alice; “I can’t remember things as I used—and I don’t keep the same size for ten minutes together!”"
    chunks:
      - pl: "„Obawiam się, że tak, proszę pani”, powiedziała Alicja;"
        ru: "«Боюсь, что так, сударыня», — сказала Алиса;"
        note: "obawiam się, że tak — боюсь, что да"
      - pl: " „nie pamiętam rzeczy tak jak dawniej…"
        ru: "«я не помню вещей так, как прежде…"
        note: "pamiętać coś — помнить что-л.: винительный падеж"
      - pl: " i nie utrzymuję tego samego wzrostu nawet przez dziesięć minut!”"
        ru: "и не сохраняю одного и того же роста даже десять минут!»"
        note: "utrzymywać — сохранять, удерживать"
    words: { "dawniej": dawno, "utrzymuję": utrzymywac }
  - clean: "„Jakich rzeczy nie pamiętasz?”, spytała Gąsienica."
    en: "“Can’t remember _what_ things?” said the Caterpillar."
    chunks:
      - pl: "„Jakich rzeczy nie pamiętasz?”, spytała Gąsienica."
        ru: "«Каких вещей ты не помнишь?» — спросила Гусеница."
        note: "jakich rzeczy — каких вещей: при отрицании дополнение идёт в родительный"
  - clean: "„No, próbowałam powiedzieć «Jak to pracowita pszczółka», ale wyszło całkiem inaczej!”, odpowiedziała Alicja bardzo melancholijnym głosem."
    en: "“Well, I’ve tried to say “How doth the little busy bee,” but it all came different!” Alice replied in a very melancholy voice."
    chunks:
