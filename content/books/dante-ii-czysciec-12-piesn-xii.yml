# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 12
chapterTitle: "Pieśń XII"
chapterTitleRu: "Песнь XII. Образы гордыни"
level: B2
paragraphs:
  - clean: "(Ku kołu II. Obrazy u wyjścia. Anioł zdejmuje z czoła poety pierwsze P.)"
    chunks:
      - pl: "(Ku kołu II. Obrazy u wyjścia. Anioł zdejmuje z czoła poety pierwsze P.)"
        ru: "(К поясу II. Изображения у выхода. Ангел снимает с чела поэта первое «P».)"
    words: { "kołu": kolo, "Anioł": aniol, "zdejmuje": zdejmowac, "czoła": czolo, "poety": poeta }
  - clean: "Jak pług ciągnące woły równym ruchem,\nNim słodki mistrz mię nie ostrzegł słowami,\nKrok w krok stąpałem z tym przygiętym duchem.\nLecz kiedy rzekł mi: «Rzuć go a idź dalej,\nBo tu jest dobrze żaglem i wiosłami\nGnać, ile można, swą łódkę po fali»."
    verse: true
    chunks:
      - pl: "Jak pług ciągnące woły równym ruchem,"
        ru: "Как волы, тянущие плуг ровным движением,"
        note: "pług — плуг"
      - pl: "\nNim słodki mistrz mię nie ostrzegł słowami,"
        ru: "пока сладкий учитель не предостерёг меня словами,"
      - pl: "\nKrok w krok stąpałem z tym przygiętym duchem."
        ru: "шаг в шаг я ступал с этим согбенным духом."
        note: "przygięty — согнутый"
      - pl: "\nLecz kiedy rzekł mi: «Rzuć go a idź dalej,"
        ru: "Но когда он сказал мне: «Оставь его и иди дальше,"
      - pl: "\nBo tu jest dobrze żaglem i wiosłami"
        ru: "ибо здесь хорошо парусом и вёслами"
      - pl: "\nGnać, ile można, swą łódkę po fali»."
        ru: "гнать, сколько можно, свою лодку по волне»,"
    words: { "ciągnące": ciagnac, "ostrzegł": ostrzec, "Krok": krok, "rzekł": rzec, "łódkę": lodka, "fali": fala }
  - clean: "Wyprostowałem całe moje ciało,\nJako chcącemu iść prędzej przystało,\nChoć myśli miałem przygięte w tej chwili:\nI szliśmy szybko, ja i mistrz Wirgili,\nDowodząc oba, jak lekcyśmy byli!\nW końcu rzekł do mnie: «Spuść na dół twe oczy,\nA lżej ci będzie wędrować tą drogą,\nWidząc grunt, jakim twoja stopa kroczy»."
    verse: true
    chunks:
      - pl: "Wyprostowałem całe moje ciało,"
        ru: "я выпрямил всё своё тело,"
      - pl: "\nJako chcącemu iść prędzej przystało,"
        ru: "как подобало желающему идти быстрее,"
      - pl: "\nChoć myśli miałem przygięte w tej chwili:"
        ru: "хоть мысли у меня были согнуты в этот миг:"
      - pl: "\nI szliśmy szybko, ja i mistrz Wirgili,"
        ru: "и мы пошли быстро, я и учитель Вергилий,"
      - pl: "\nDowodząc oba, jak lekcyśmy byli!"
        ru: "оба показывая, как мы были легки!"
        note: "lekcyśmy = lekcy + -śmy (устар. мн. от lekki)"
      - pl: "\nW końcu rzekł do mnie: «Spuść na dół twe oczy,"
        ru: "Наконец он сказал мне: «Опусти вниз свои глаза,"
      - pl: "\nA lżej ci będzie wędrować tą drogą,"
        ru: "и тебе легче будет странствовать этой дорогой,"
      - pl: "\nWidząc grunt, jakim twoja stopa kroczy»."
        ru: "видя почву, по которой шагает твоя нога»."
    words: { "prędzej": predko, "mistrz": mistrz, "Dowodząc": dowodzic, "Spuść": spuscic, "grunt": grunt, "stopa": stopa }
  - clean: "Jak nad sklepioną kościołów podłogą\nDla przedłużenia umarłych pamięci\nPłaskorzeźbami wyrażają groby\nZeszłych ze świata popiersia osoby;\nObraz ich w sercach pobożnych żal budzi,\nRozpamiętując pamięć zmarłych ludzi,\nCzęsto nam w oczach, aż łza się zakręci:\nTak droga między otchłanią i górą\nWzrok mój nęciła niejedną figurą,\nA każda z stokroć większym życiem kuta\nI podobieństwem podług sztuki dłuta."
    verse: true
    chunks:
      - pl: "Jak nad sklepioną kościołów podłogą"
        ru: "Как над сводчатым полом церквей"
        note: "sklepiony — сводчатый"
      - pl: "\nDla przedłużenia umarłych pamięci"
        ru: "для продления памяти умерших"
      - pl: "\nPłaskorzeźbami wyrażają groby"
        ru: "на гробницах изображают барельефами"
      - pl: "\nZeszłych ze świata popiersia osoby;"
        ru: "бюсты особ, ушедших из мира;"
      - pl: "\nObraz ich w sercach pobożnych żal budzi,"
        ru: "их образ в благочестивых сердцах будит скорбь,"
      - pl: "\nRozpamiętując pamięć zmarłych ludzi,"
        ru: "вспоминая память умерших людей,"
        note: "rozpamiętywać — вспоминать"
      - pl: "\nCzęsto nam w oczach, aż łza się zakręci:"
        ru: "часто у нас в глазах даже слеза навернётся:"
        note: "zakręcić się — навернуться"
      - pl: "\nTak droga między otchłanią i górą"
        ru: "так дорога между бездной и горой"
      - pl: "\nWzrok mój nęciła niejedną figurą,"
        ru: "манила мой взгляд не одной фигурой,"
      - pl: "\nA każda z stokroć większym życiem kuta"
        ru: "а каждая высечена с во сто крат большей жизнью"
      - pl: "\nI podobieństwem podług sztuki dłuta."
        ru: "и сходством по искусству резца."
    words: { "sklepioną": sklepic, "przedłużenia": przedluzyc, "wyrażają": wyrazac, "budzi": budzic, "Wzrok": wzrok, "podobieństwem": podobienstwo }
  - clean: "Widziałem tego, co piękniej stworzony\nOd wszystkich stworzeń, które z nim na głowę\nSpadały z nieba jak skry piorunowe.\nTam Bryjareusz leżał z drugiej strony,\nW pierś Jowiszowym grotem ugodzony;\nPrzytłaczał ziemię swoim skrzepłym ciałem."
    verse: true
    chunks:
      - pl: "Widziałem tego, co piękniej stworzony"
        ru: "Я видел того, кто был создан прекраснее"
        note: "Люцифер"
      - pl: "\nOd wszystkich stworzeń, które z nim na głowę"
        ru: "всех творений, которые с ним стремглав"
      - pl: "\nSpadały z nieba jak skry piorunowe."
        ru: "падали с неба, как громовые искры."
        note: "skra — искра"
      - pl: "\nTam Bryjareusz leżał z drugiej strony,"
        ru: "Там с другой стороны лежал Бриарей,"
      - pl: "\nW pierś Jowiszowym grotem ugodzony;"
        ru: "поражённый в грудь стрелой Юпитера;"
      - pl: "\nPrzytłaczał ziemię swoim skrzepłym ciałem."
        ru: "он придавливал землю своим окоченевшим телом."
    words: { "piękniej": pieknie, "Spadały": spadac, "nieba": niebo, "leżał": lezec, "pierś": piers, "Przytłaczał": przytlaczac }
  - clean: "Wokoło ojca stoją Mars, Pallada,\nW ich ręku jeszcze broń tryumfu świeci,\nPatrzą, jak olbrzym na proch się rozpada.\nU stóp Babelu Nemroda widziałem,\nStał, poglądając jako obłąkany\nNa tłum narodów w Sennarze zebrany."
    verse: true
    chunks:
      - pl: "Wokoło ojca stoją Mars, Pallada,"
        ru: "Вокруг отца стоят Марс, Паллада,"
        note: "отец — Юпитер; у Данте с ними и Аполлон"
      - pl: "\nW ich ręku jeszcze broń tryumfu świeci,"
        ru: "в их руках ещё сверкает оружие победы,"
      - pl: "\nPatrzą, jak olbrzym na proch się rozpada."
        ru: "смотрят, как великан рассыпается в прах."
      - pl: "\nU stóp Babelu Nemroda widziałem,"
        ru: "У подножия Вавилона я видел Нимрода,"
      - pl: "\nStał, poglądając jako obłąkany"
        ru: "он стоял, поглядывая, как безумный,"
      - pl: "\nNa tłum narodów w Sennarze zebrany."
        ru: "на толпу народов, собранных в Сеннааре."
    words: { "tryumfu": tryumf, "Patrzą": patrzec, "olbrzym": olbrzym, "proch": proch, "narodów": narod, "zebrany": zebrac }
  - clean: "Niobe! wzrok mi zabiegł łzą gorącą,\nPośród tej drogi widząc cię płaczącą\nMiędzy siedmiorgiem twych umarłych dzieci.\nSaulu! tam własny miecz w twe piersi wbity,\nJak na Gilboe; odtąd gór tych szczyty\nSchną niezwilżane ni rosą, ni deszczem."
    verse: true
    chunks:
      - pl: "Niobe! wzrok mi zabiegł łzą gorącą,"
        ru: "Ниобея! взгляд мне застлала горячая слеза,"
      - pl: "\nPośród tej drogi widząc cię płaczącą"
        ru: "когда я видел тебя плачущей посреди этой дороги"
      - pl: "\nMiędzy siedmiorgiem twych umarłych dzieci."
        ru: "среди семерых твоих умерших детей."
      - pl: "\nSaulu! tam własny miecz w twe piersi wbity,"
        ru: "Саул! там твой собственный меч вонзён тебе в грудь,"
      - pl: "\nJak na Gilboe; odtąd gór tych szczyty"
        ru: "как при Гелвуе; с тех пор вершины этих гор"
      - pl: "\nSchną niezwilżane ni rosą, ni deszczem."
        ru: "сохнут, не орошаемые ни росой, ни дождём."
        note: "niezwilżany — неорошаемый"
    words: { "miecz": miecz, "wbity": wbic, "odtąd": odtad, "szczyty": szczyt, "rosą": rosa, "deszczem": deszcz }
  - clean: "Arachne! jak tam tyś wyschła i zwiędła!\nWidziałem ciebie zmienioną w pająka,\nSmutny po niciach twych się krosien błąka,\nKtóreś, niestety, na swą zgubę sprzędła.\nTwój, Raboamie, strach mię wstrząsał dreszczem,\nGdy tam uciekasz jak zbieg w twym rydwanie,\nNim cię lud własny skazał na wygnanie."
    verse: true
    chunks:
      - pl: "Arachne! jak tam tyś wyschła i zwiędła!"
        ru: "Арахна! как ты там иссохла и увяла!"
        note: "zwiędnąć — увянуть"
      - pl: "\nWidziałem ciebie zmienioną w pająka,"
        ru: "Я видел тебя, превращённой в паука,"
        note: "pająk — паук"
      - pl: "\nSmutny po niciach twych się krosien błąka,"
        ru: "печально бродишь по нитям своего станка,"
        note: "krosna — ткацкий станок"
      - pl: "\nKtóreś, niestety, na swą zgubę sprzędła."
        ru: "что ты, увы, на свою погибель спряла."
      - pl: "\nTwój, Raboamie, strach mię wstrząsał dreszczem,"
        ru: "Твой, Ровоам, страх тряс меня дрожью,"
      - pl: "\nGdy tam uciekasz jak zbieg w twym rydwanie,"
        ru: "когда ты там бежишь, как беглец, на своей колеснице,"
        note: "zbieg — беглец"
      - pl: "\nNim cię lud własny skazał na wygnanie."
        ru: "прежде чем собственный народ осудил тебя на изгнание."
    words: { "pająka": pajak, "niciach": nic-2, "zgubę": zguba, "strach": strach, "zbieg": zbieg, "skazał": skazac }
  - clean: "Rznięta marmuru wyrażała szyba,\nJako Alkmeon własną matkę zmusza\nPrzypłacić drogo zgon Amfiarausza;\nJako synowie wściekli Sanheriba\nW świątyni głowę ojcowi ucięli\nI samotnego trupa odbieżeli;\nJak Asyryjczyk, gdzie go popłoch niesie,\nPierzchał po zgonie twym, Holofernesie!"
    verse: true
    chunks:
      - pl: "Rznięta marmuru wyrażała szyba,"
        ru: "Высеченная мраморная плита изображала,"
        note: "rznięty — высеченный; szyba — плита"
      - pl: "\nJako Alkmeon własną matkę zmusza"
        ru: "как Алкмеон заставляет собственную мать"
      - pl: "\nPrzypłacić drogo zgon Amfiarausza;"
        ru: "дорого поплатиться за смерть Амфиарая;"
        note: "przypłacić — поплатиться"
      - pl: "\nJako synowie wściekli Sanheriba"
        ru: "как бешеные сыновья Сеннахирима"
      - pl: "\nW świątyni głowę ojcowi ucięli"
        ru: "в храме отрубили голову отцу"
      - pl: "\nI samotnego trupa odbieżeli;"
        ru: "и покинули одинокий труп;"
        note: "odbieżeć — покинуть"
      - pl: "\nJak Asyryjczyk, gdzie go popłoch niesie,"
        ru: "как ассириец, куда несёт его паника,"
      - pl: "\nPierzchał po zgonie twym, Holofernesie!"
        ru: "бежал после твоей смерти, Олоферн!"
    words: { "szyba": szyba, "zmusza": zmuszac, "zgon": zgon, "świątyni": swiatynia, "samotnego": samotny, "niesie": niesc }
  - clean: "I Cyrus dłutem był rznięty w marmurze,\nOd Massagetów zabity królowej;\nTa zda się mówi do odciętej głowy:\n«Tyś krwi łaknęła, we krwi cię zanurzę».\nWidziałem Troję w gruzach i w popiele:\nO Ilijonie dumny! jak niewiele\nMiejscaś tam zajął w płaskorzeźby ramach,\nW dymie twych gmachów i w skruszonych bramach."
    verse: true
    chunks:
      - pl: "I Cyrus dłutem był rznięty w marmurze,"
        ru: "И Кир был высечен резцом в мраморе,"
      - pl: "\nOd Massagetów zabity królowej;"
        ru: "убитый царицей массагетов;"
      - pl: "\nTa zda się mówi do odciętej głowy:"
        ru: "она, кажется, говорит отрубленной голове:"
      - pl: "\n«Tyś krwi łaknęła, we krwi cię zanurzę»."
        ru: "«Ты жаждал крови — в крови тебя и утоплю»."
      - pl: "\nWidziałem Troję w gruzach i w popiele:"
        ru: "Я видел Трою в развалинах и в пепле:"
      - pl: "\nO Ilijonie dumny! jak niewiele"
        ru: "о гордый Илион! как мало"
      - pl: "\nMiejscaś tam zajął w płaskorzeźby ramach,"
        ru: "места ты занял там в рамах барельефа,"
      - pl: "\nW dymie twych gmachów i w skruszonych bramach."
        ru: "в дыму твоих зданий и в разбитых воротах."
        note: "gmach — здание"
    words: { "zanurzę": zanurzyc, "popiele": popiol, "ramach": rama, "dymie": dym, "gmachów": gmach, "bramach": brama }
  - clean: "Arcymistrz pędzla i dłuta do razu\nSnadź tam malował i dłutował z głazu\nWszystkie postaci tak pełne wyrazu.\nŻywi jak żywi, zmarli jak umarli,\nWszyscy się zdali, gdy ich depcąc nogą\nZ schylonym czołem szedłem ową drogą."
    verse: true
    chunks:
      - pl: "Arcymistrz pędzla i dłuta do razu"
        ru: "Верховный мастер кисти и резца разом,"
        note: "arcymistrz — верховный мастер"
      - pl: "\nSnadź tam malował i dłutował z głazu"
        ru: "видно, там писал и высекал из камня"
        note: "dłutować — высекать резцом"
      - pl: "\nWszystkie postaci tak pełne wyrazu."
        ru: "все фигуры, так полные выражения."
      - pl: "\nŻywi jak żywi, zmarli jak umarli,"
        ru: "Живые — как живые, мёртвые — как мёртвые,"
      - pl: "\nWszyscy się zdali, gdy ich depcąc nogą"
        ru: "все казались такими, когда, попирая их ногой,"
      - pl: "\nZ schylonym czołem szedłem ową drogą."
        ru: "со склонённым челом я шёл той дорогой."
    words: { "malował": malowac, "postaci": postac, "wyrazu": wyraz, "zmarli": zmarly, "zdali": zdac, "nogą": noga }
  - clean: "Wy, coście w pysze swe głowy zadarli,\nSynowie Ewy! nie zniżajcie czoła,\nIdąc, niech duma, co was tak unasza,\nUjrzy na końcu, jak zła droga wasza!\nJuż wkoło góry uszliśmy niemało,\nI słońce wyżej ponad nami stało,\nCzego zajęty wzrok nie dostrzegł zgoła:\nKiedy idący ciągle wprzód tą skałą\nRzekł: «Podnieś głowę, a idź sporszym krokiem,\nPatrz, oto ku nam idzie anioł gończy,\nSzósta dnia sługa już swą służbę kończy."
    verse: true
    chunks:
      - pl: "Wy, coście w pysze swe głowy zadarli,"
        ru: "Вы, что в гордыне задрали свои головы,"
      - pl: "\nSynowie Ewy! nie zniżajcie czoła,"
        ru: "сыны Евы! не опускайте чела,"
      - pl: "\nIdąc, niech duma, co was tak unasza,"
        ru: "идя: пусть гордость, что вас так возносит,"
        note: "unaszać — устар. «возносить»"
      - pl: "\nUjrzy na końcu, jak zła droga wasza!"
        ru: "увидит в конце, как дурна ваша дорога!"
        note: "ирония"
      - pl: "\nJuż wkoło góry uszliśmy niemało,"
        ru: "Уже мы прошли вокруг горы немало,"
      - pl: "\nI słońce wyżej ponad nami stało,"
        ru: "и солнце стояло выше над нами,"
      - pl: "\nCzego zajęty wzrok nie dostrzegł zgoła:"
        ru: "чего занятый взгляд вовсе не заметил:"
      - pl: "\nKiedy idący ciągle wprzód tą skałą"
        ru: "когда идущий всё время впереди по этой скале"
      - pl: "\nRzekł: «Podnieś głowę, a idź sporszym krokiem,"
        ru: "сказал: «Подними голову и иди более скорым шагом,"
      - pl: "\nPatrz, oto ku nam idzie anioł gończy,"
        ru: "смотри: вот к нам идёт ангел-гонец,"
      - pl: "\nSzósta dnia sługa już swą służbę kończy."
        ru: "шестая служанка дня уже кончает свою службу."
        note: "шестой час, полдень"
    words: { "duma": duma, "Ujrzy": ujrzec, "uszliśmy": ujsc, "dostrzegł": dostrzec, "skałą": skala, "sługa": sluga }
  - clean: "Uczcij go całą osobą i wzrokiem,\nNiech go z pokorą dusza twoja wita,\nMyśl, że dzień taki więcej nie zaświta».\nNie ciemną dla mnie zdała się ta mowa,\nKorzystaj z czasu, chciał rzec przez te słowa.\nBiało odziana szła piękna istota,\nTwarz jej jak gwiazda poranna migota."
    verse: true
    chunks:
      - pl: "Uczcij go całą osobą i wzrokiem,"
        ru: "Почти его всей своей особой и взглядом,"
      - pl: "\nNiech go z pokorą dusza twoja wita,"
        ru: "пусть твоя душа приветствует его со смирением,"
      - pl: "\nMyśl, że dzień taki więcej nie zaświta»."
        ru: "думай, что такой день больше не забрезжит»."
