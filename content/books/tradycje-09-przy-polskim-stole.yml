chapter: 9
chapterTitle: "Przy polskim stole"
chapterTitleRu: "За польским столом"
level: B2
paragraphs:
  - clean: "Polski dzień ma swój kulinarny rytm. Rano je się śniadanie, zwykle kanapki z chlebem, masłem, wędliną, serem i pomidorem, a do tego herbatę albo kawę. Dzieci zabierają do szkoły drugie śniadanie, czyli kanapkę zawiniętą w papier i jabłko, które zjadają na długiej przerwie. Najważniejszym posiłkiem dnia jest obiad, który tradycyjnie jada się wczesnym popołudniem, między czternastą a szesnastą, po powrocie z pracy i ze szkoły. Obiad składa się z dwóch dań: zupy i drugiego dania, czyli mięsa z ziemniakami i surówką, a do picia podaje się kompot. Wieczorem je się lekką kolację, często znowu kanapki, jajecznicę albo coś na ciepło z obiadu. W dużych miastach ten rytm się zmienia, bo ludzie pracują dłużej, jedzą lunch w pracy, a obiad z rodziną przesuwa się na wieczór."
    draft: true
    chunks:
      - pl: "Polski dzień ma swój kulinarny rytm."
        ru: "У польского дня свой кулинарный ритм."
      - pl: " Rano je się śniadanie, zwykle kanapki z chlebem, masłem, wędliną, serem i pomidorem, a do tego herbatę albo kawę."
        ru: "Утром завтракают, обычно бутербродами с хлебом, маслом, колбасой, сыром и помидором, а к ним пьют чай или кофе."
      - pl: " Dzieci zabierają do szkoły drugie śniadanie, czyli kanapkę zawiniętą w papier i jabłko, które zjadają na długiej przerwie."
        ru: "Дети берут в школу второй завтрак, то есть бутерброд, завёрнутый в бумагу, и яблоко, которые съедают на большой перемене."
        note: "przerwa — перемена"
      - pl: " Najważniejszym posiłkiem dnia jest obiad, który tradycyjnie jada się wczesnym popołudniem, między czternastą a szesnastą, po powrocie z pracy i ze szkoły."
        ru: "Самая важная трапеза дня — обед, который традиционно едят ранним днём, между двумя и четырьмя часами, после возвращения с работы и из школы."
      - pl: " Obiad składa się z dwóch dań: zupy i drugiego dania, czyli mięsa z ziemniakami i surówką, a do picia podaje się kompot."
        ru: "Обед состоит из двух блюд: супа и второго, то есть мяса с картофелем и салатом из сырых овощей, а пить подают компот."
        note: "surówka — салат из сырых овощей"
      - pl: " Wieczorem je się lekką kolację, często znowu kanapki, jajecznicę albo coś na ciepło z obiadu."
        ru: "Вечером едят лёгкий ужин, часто снова бутерброды, яичницу или что-нибудь горячее, оставшееся с обеда."
      - pl: " W dużych miastach ten rytm się zmienia, bo ludzie pracują dłużej, jedzą lunch w pracy, a obiad z rodziną przesuwa się na wieczór."
        ru: "В больших городах этот ритм меняется, потому что люди работают дольше, едят ланч на работе, а обед с семьёй сдвигается на вечер."
    words: { "rytm": rytm, "śniadanie": sniadanie, "zwykle": zwykle, "kanapki": kanapka, "chlebem": chleb, "masłem": maslo, "wędliną": wedlina, "serem": ser, "herbatę": herbata, "kawę": kawa, "zabierają": zabierac, "czyli": czyli, "kanapkę": kanapka, "papier": papier, "jabłko": jablko, "posiłkiem": posilek, "obiad": obiad, "wczesnym": wczesny, "popołudniem": popoludnie, "między": miedzy, "powrocie": powrot, "składa": skladac, "zupy": zupa, "mięsa": mieso, "ziemniakami": ziemniak, "podaje": podawac, "lekką": lekki, "kolację": kolacja, "często": czesto, "ciepło": cieplo, "obiadu": obiad, "lunch": lunch, "przesuwa": przesuwac }
  - clean: "Szczególnym posiłkiem jest obiad niedzielny. Po mszy cała rodzina spotyka się przy stole, a pierwszym daniem jest prawie zawsze rosół, złocisty bulion z kury albo wołowiny, podawany z cienkim makaronem i natką pietruszki. Rosół gotuje się na wolnym ogniu przez kilka godzin, a Polacy wierzą, że leczy przeziębienie, zmęczenie i złamane serce. Na drugie danie podaje się kotleta schabowego, panierowanego i smażonego na smalcu, z ziemniakami posypanymi koperkiem i mizerią, czyli sałatką z ogórków w śmietanie. Z resztek rosołu w poniedziałek gotuje się zupę pomidorową, co jest tak przewidywalne, że stało się tematem niezliczonych żartów."
    draft: true
    chunks:
      - pl: "Szczególnym posiłkiem jest obiad niedzielny."
        ru: "Особая трапеза — воскресный обед."
      - pl: " Po mszy cała rodzina spotyka się przy stole, a pierwszym daniem jest prawie zawsze rosół, złocisty bulion z kury albo wołowiny, podawany z cienkim makaronem i natką pietruszki."
        ru: "После мессы вся семья собирается за столом, и первым блюдом почти всегда бывает бульон, золотистый, из курицы или говядины, который подают с тонкой лапшой и зеленью петрушки."
        note: "rosół — бульон; natka pietruszki — зелень петрушки"
      - pl: " Rosół gotuje się na wolnym ogniu przez kilka godzin, a Polacy wierzą, że leczy przeziębienie, zmęczenie i złamane serce."
        ru: "Бульон варят на медленном огне несколько часов, и поляки верят, что он лечит простуду, усталость и разбитое сердце."
        note: "przeziębienie — простуда"
      - pl: " Na drugie danie podaje się kotleta schabowego, panierowanego i smażonego na smalcu, z ziemniakami posypanymi koperkiem i mizerią, czyli sałatką z ogórków w śmietanie."
        ru: "На второе подают свиную отбивную в панировке, жаренную на смальце, с картофелем, посыпанным укропом, и мизерией, то есть салатом из огурцов со сметаной."
        note: "koperek — укроп; mizeria — салат из огурцов со сметаной"
      - pl: " Z resztek rosołu w poniedziałek gotuje się zupę pomidorową, co jest tak przewidywalne, że stało się tematem niezliczonych żartów."
        ru: "Из остатков бульона в понедельник варят томатный суп, и это настолько предсказуемо, что стало темой бесчисленных шуток."
        note: "przewidywalny — предсказуемый"
    words: { "spotyka": spotykac, "stole": stol, "kury": kura, "wołowiny": wolowina, "podawany": podawac, "cienkim": cienki, "makaronem": makaron, "gotuje": gotowac, "ogniu": ogien, "leczy": leczyc, "złamane": zlamac, "schabowego": schabowy, "koperkiem": koperek, "sałatką": salatka, "resztek": resztki, "poniedziałek": poniedzialek, "zupę": zupa, "tematem": temat, "żartów": zart }
  - clean: "Polacy jedzą bardzo dużo zup, a w wielu domach obiad bez zupy nie jest prawdziwym obiadem. Oprócz rosołu, pomidorowej i żurku popularna jest ogórkowa z kiszonych ogórków, kapuśniak z kiszonej kapusty, krupnik z kaszą jęczmienną i grochówka, gęsta zupa z grochu z wędzonką. Grochówkę gotuje się często w wielkich kotłach na festynach i uroczystościach, a wojsko polskie słynie z grochówki z kuchni polowej. Latem je się chłodnik, zimną zupę z botwinki, czyli młodych buraków z liśćmi, z jogurtem, ogórkiem, koperkiem i jajkiem na twardo, która ma intensywnie różowy kolor. Najbardziej kontrowersyjną zupą jest czernina, gotowana na kaczej krwi z octem, suszonymi owocami i przyprawami. Dawniej, jak już wspomnieliśmy, podanie jej kawalerowi oznaczało odmowę, a dziś jedni uważają ją za przysmak, a inni nie chcą jej nawet spróbować."
    draft: true
    chunks:
      - pl: "Polacy jedzą bardzo dużo zup, a w wielu domach obiad bez zupy nie jest prawdziwym obiadem."
        ru: "Поляки едят очень много супов, и во многих домах обед без супа — не настоящий обед."
      - pl: " Oprócz rosołu, pomidorowej i żurku popularna jest ogórkowa z kiszonych ogórków, kapuśniak z kiszonej kapusty, krupnik z kaszą jęczmienną i grochówka, gęsta zupa z grochu z wędzonką."
        ru: "Помимо бульона, томатного супа и журека, популярны огуречный суп из солёных огурцов, капустняк из квашеной капусты, крупник с перловкой и гороховый суп, густой, с копчёностями."
        note: "wędzonka — копчёность; kasza jęczmienna — перловка"
      - pl: " Grochówkę gotuje się często w wielkich kotłach na festynach i uroczystościach, a wojsko polskie słynie z grochówki z kuchni polowej."
        ru: "Гороховый суп часто варят в больших котлах на праздниках и торжествах, а польская армия славится гороховым супом из полевой кухни."
        note: "kocioł — котёл"
      - pl: " Latem je się chłodnik, zimną zupę z botwinki, czyli młodych buraków z liśćmi, z jogurtem, ogórkiem, koperkiem i jajkiem na twardo, która ma intensywnie różowy kolor."
        ru: "Летом едят холодник, холодный суп из ботвиньи, то есть молодой свёклы с ботвой, с йогуртом, огурцом, укропом и крутым яйцом, у которого насыщенный розовый цвет."
        note: "botwinka — молодая свёкла с ботвой"
      - pl: " Najbardziej kontrowersyjną zupą jest czernina, gotowana na kaczej krwi z octem, suszonymi owocami i przyprawami."
        ru: "Самый спорный суп — чернина, которую варят на утиной крови с уксусом, сушёными фруктами и пряностями."
      - pl: " Dawniej, jak już wspomnieliśmy, podanie jej kawalerowi oznaczało odmowę, a dziś jedni uważają ją za przysmak, a inni nie chcą jej nawet spróbować."
        ru: "Раньше, как мы уже упоминали, подать её жениху означало отказ, а сегодня одни считают её деликатесом, а другие не хотят даже попробовать."
        note: "przysmak — лакомство, деликатес"
    words: { "obiadem": obiad, "popularna": popularny, "kaszą": kasza, "zupa": zupa, "uroczystościach": uroczystosc, "wojsko": wojsko, "polskie": polski, "kuchni": kuchnia, "zimną": zimny, "jajkiem": jajko, "różowy": rozowy, "kolor": kolor, "zupą": zupa, "gotowana": gotowac, "owocami": owoc, "wspomnieliśmy": wspomniec, "kawalerowi": kawaler, "oznaczało": oznaczac }
  - clean: "Symbolem polskiej kuchni są pierogi, czyli pierożki z ciasta z mąki i wody, nadziewane różnymi farszami, gotowane albo smażone. Najpopularniejsze są pierogi ruskie, z farszem z ziemniaków, twarogu i smażonej cebuli. Ich nazwa często myli cudzoziemców, a zwłaszcza Rosjan, bo nie pochodzi od Rosji, tylko od Rusi Czerwonej, czyli dawnych ziem wokół Lwowa, Przemyśla i Sanoka, skąd ten przepis się rozpowszechnił. Je się też pierogi z mięsem, z kapustą i grzybami, ze szpinakiem, a latem pierogi z jagodami albo truskawkami, polane śmietaną i posypane cukrem. Lepienie pierogów jest w wielu domach rodzinną pracą, w której uczestniczą babcie, mamy i dzieci, a gotowe pierogi można zamrozić i jeść przez wiele tygodni. Patronem pierogów jest święty Jacek, który według legendy nakarmił nimi głodnych mieszkańców Krakowa w czasie klęski głodu, a okrzyk: święty Jacku z pierogami!, oznacza do dziś zdziwienie albo przerażenie."
    draft: true
    chunks:
      - pl: "Symbolem polskiej kuchni są pierogi, czyli pierożki z ciasta z mąki i wody, nadziewane różnymi farszami, gotowane albo smażone."
        ru: "Символ польской кухни — пероги, то есть вареники из теста из муки и воды с разными начинками, отварные или жареные."
        note: "farsz — начинка"
      - pl: " Najpopularniejsze są pierogi ruskie, z farszem z ziemniaków, twarogu i smażonej cebuli."
        ru: "Самые популярные — «русские» пероги, с начинкой из картофеля, творога и жареного лука."
      - pl: " Ich nazwa często myli cudzoziemców, a zwłaszcza Rosjan, bo nie pochodzi od Rosji, tylko od Rusi Czerwonej, czyli dawnych ziem wokół Lwowa, Przemyśla i Sanoka, skąd ten przepis się rozpowszechnił."
        ru: "Их название часто сбивает с толку иностранцев, особенно русских, потому что оно происходит не от России, а от Червонной Руси, то есть бывших земель вокруг Львова, Перемышля и Санока, откуда этот рецепт распространился."
      - pl: " Je się też pierogi z mięsem, z kapustą i grzybami, ze szpinakiem, a latem pierogi z jagodami albo truskawkami, polane śmietaną i posypane cukrem."
        ru: "Едят также пероги с мясом, с капустой и грибами, со шпинатом, а летом пероги с черникой или клубникой, политые сметаной и посыпанные сахаром."
        note: "jagody — черника"
      - pl: " Lepienie pierogów jest w wielu domach rodzinną pracą, w której uczestniczą babcie, mamy i dzieci, a gotowe pierogi można zamrozić i jeść przez wiele tygodni."
        ru: "Лепка перогов во многих домах — семейная работа, в которой участвуют бабушки, мамы и дети, а готовые пероги можно заморозить и есть много недель."
      - pl: " Patronem pierogów jest święty Jacek, który według legendy nakarmił nimi głodnych mieszkańców Krakowa w czasie klęski głodu, a okrzyk: święty Jacku z pierogami!, oznacza do dziś zdziwienie albo przerażenie."
        ru: "Покровителем перогов считается святой Яцек, который, по легенде, накормил ими голодающих жителей Кракова во время голода, а возглас «Святой Яцек с пирогами!» до сих пор выражает удивление или испуг."
        note: "klęska głodu — голод (бедствие)"
