  - clean: "Jeśli pierogi są symbolem polskiej kuchni, to bigos jest jej narodową legendą. To gęsta potrawa z kiszonej i świeżej kapusty, kilku rodzajów mięsa i kiełbasy, suszonych grzybów i śliwek, przyprawiona zielem angielskim, liściem laurowym i czasem czerwonym winem. Bigos nazywano dawniej myśliwskim, bo zabierano go na polowania, a jego zaletą było to, że można go odgrzewać wiele razy. Mówi się, że prawdziwy bigos jest najlepszy trzeciego dnia, po kilkukrotnym gotowaniu i studzeniu, a niektóre gospodynie przygotowują go przez cały tydzień. Mickiewicz poświęcił mu w „Panu Tadeuszu” kilka wersów, pisząc, że jego smaku, koloru i zapachu nie da się opisać słowami. Każda rodzina ma swój przepis i jest przekonana, że jest on jedynym właściwym."
    draft: true
    chunks:
      - pl: "Jeśli pierogi są symbolem polskiej kuchni, to bigos jest jej narodową legendą."
        ru: "Если пероги — символ польской кухни, то бигос — её национальная легенда."
      - pl: " To gęsta potrawa z kiszonej i świeżej kapusty, kilku rodzajów mięsa i kiełbasy, suszonych grzybów i śliwek, przyprawiona zielem angielskim, liściem laurowym i czasem czerwonym winem."
        ru: "Это густое блюдо из квашеной и свежей капусты, нескольких видов мяса и колбасы, сушёных грибов и слив, приправленное душистым перцем, лавровым листом и иногда красным вином."
        note: "ziele angielskie — душистый перец"
      - pl: " Bigos nazywano dawniej myśliwskim, bo zabierano go na polowania, a jego zaletą było to, że można go odgrzewać wiele razy."
        ru: "Бигос раньше называли охотничьим, потому что его брали с собой на охоту, а его достоинством было то, что его можно разогревать много раз."
        note: "odgrzewać — разогревать"
      - pl: " Mówi się, że prawdziwy bigos jest najlepszy trzeciego dnia, po kilkukrotnym gotowaniu i studzeniu, a niektóre gospodynie przygotowują go przez cały tydzień."
        ru: "Говорят, что настоящий бигос лучше всего на третий день, после нескольких варок и остужений, а некоторые хозяйки готовят его целую неделю."
        note: "studzić — остужать"
      - pl: " Mickiewicz poświęcił mu w „Panu Tadeuszu” kilka wersów, pisząc, że jego smaku, koloru i zapachu nie da się opisać słowami."
        ru: "Мицкевич посвятил ему в «Пане Тадеуше» несколько строк, написав, что его вкус, цвет и запах невозможно описать словами."
        note: "wers — стих, строка"
      - pl: " Każda rodzina ma swój przepis i jest przekonana, że jest on jedynym właściwym."
        ru: "У каждой семьи свой рецепт, и каждая уверена, что он единственно правильный."
