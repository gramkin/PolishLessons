  - clean: "Do klasyki polskiej kuchni należą też gołąbki, czyli liście kapusty zawijane z farszem z mięsa i ryżu albo kaszy i duszone w sosie pomidorowym. Placki ziemniaczane smaży się z tartych ziemniaków z cebulą i podaje ze śmietaną albo z cukrem, a w wersji węgierskiej z gulaszem. Na Śląsku niedzielny obiad to rolada wołowa z kluskami śląskimi i modrą kapustą. Kluski śląskie robi się z ugotowanych ziemniaków i mąki ziemniaczanej, a na środku każdej z nich robi się palcem charakterystyczne wgłębienie, w którym zbiera się sos. Popularne są także kopytka, małe kluski w kształcie rombu, oraz kasza gryczana, którą Polacy jedzą tak chętnie jak Rosjanie, choć częściej jako dodatek do mięsa niż na śniadanie."
    draft: true
    chunks:
      - pl: "Do klasyki polskiej kuchni należą też gołąbki, czyli liście kapusty zawijane z farszem z mięsa i ryżu albo kaszy i duszone w sosie pomidorowym."
        ru: "К классике польской кухни относятся и голубцы, то есть капустные листья, завёрнутые с начинкой из мяса и риса или крупы и тушённые в томатном соусе."
      - pl: " Placki ziemniaczane smaży się z tartych ziemniaków z cebulą i podaje ze śmietaną albo z cukrem, a w wersji węgierskiej z gulaszem."
