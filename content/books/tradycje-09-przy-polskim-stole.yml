  - clean: "Polska jest w świecie znana z wódki, a spór o to, czy wódkę wymyślili Polacy, czy Rosjanie, toczy się od dawna, i zapewne nigdy się nie skończy. Do najbardziej znanych gatunków należy żubrówka, wódka z dodatkiem trawy żubrowej z Puszczy Białowieskiej, w której butelce pływa źdźbło tej trawy. W wielu domach robi się też nalewki, czyli domowe likiery z owoców zalanych spirytusem i cukrem, które dojrzewają miesiącami w ciemnej spiżarni. Najpopularniejsze są wiśniówka, pigwówka z pigwy i orzechówka z zielonych orzechów włoskich, a dobra nalewka babci jest w rodzinie powodem do dumy i prezentem dla najważniejszych gości. Polacy mają też starą tradycję miodów pitnych, robionych z miodu, wody i przypraw, które pito na dworach królewskich już w średniowieczu. Dziś jednak najczęściej pije się piwo, a w ostatnich latach w całym kraju powstały setki małych browarów rzemieślniczych, które warzą piwa o najróżniejszych smakach. Przy stole obowiązuje zasada, że nie odmawia się toastu za zdrowie gospodarzy, ale nikt nie powinien zmuszać gościa do picia, i coraz więcej Polaków to rozumie."
