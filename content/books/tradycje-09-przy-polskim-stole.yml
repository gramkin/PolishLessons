  - clean: "Chleb ma w polskiej tradycji wyjątkowe znaczenie. Dawniej, zanim gospodyni ukroiła pierwszą kromkę nowego bochenka, robiła na nim nożem znak krzyża. Chleba nie wolno było wyrzucać, a kawałek, który upadł na ziemię, podnoszono i całowano na przeprosiny. Starsze pokolenie, które pamięta wojnę i głód, do dziś nie potrafi wyrzucić czerstwego chleba i robi z niego grzanki, bułkę tartą albo daje go ptakom. Polacy jedzą przede wszystkim chleb pszenno-żytni na zakwasie, z chrupiącą skórką, a piekarnie z dobrym chlebem mają w każdym mieście wiernych klientów, którzy stoją w kolejce od rana."
