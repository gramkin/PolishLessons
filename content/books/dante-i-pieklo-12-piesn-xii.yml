  - clean: "Chiron na prawo zawróciwszy nogę,\nRzekł do Nessusa: «Idź i wskaż im drogę.\nA jeśli drogę zaskoczą łuczniki,\nPowiedz im, niech się ich tykać nie ważą».\nI szliśmy dalej pod tą wierną strażą\nWzdłuż ponad brzegiem kałuży czerwonej,\nW której topieni wydają krzyk dziki,\nA z nich niejeden po brwi zanurzony."
    verse: true
    chunks:
      - pl: "Chiron na prawo zawróciwszy nogę,"
        ru: "Хирон, повернув ногу направо,"
      - pl: "\nRzekł do Nessusa: «Idź i wskaż im drogę."
        ru: "сказал Нессу: «Иди и укажи им дорогу."
      - pl: "\nA jeśli drogę zaskoczą łuczniki,"
        ru: "А если дорогу преградят стрелки,"
        note: "zaskoczyć — застать врасплох, преградить; łuczniki — устар. мн. «лучники»"
      - pl: "\nPowiedz im, niech się ich tykać nie ważą»."
        ru: "скажи им, чтобы не смели их трогать»."
        note: "tykać — трогать; ważyć się — сметь"
      - pl: "\nI szliśmy dalej pod tą wierną strażą"
        ru: "И мы пошли дальше под этой верной стражей"
      - pl: "\nWzdłuż ponad brzegiem kałuży czerwonej,"
        ru: "вдоль, над берегом красной лужи,"
        note: "kałuża — лужа"
      - pl: "\nW której topieni wydają krzyk dziki,"
        ru: "в которой утопленные издают дикий крик,"
      - pl: "\nA z nich niejeden po brwi zanurzony."
        ru: "а из них не один погружён по брови."
        note: "brew — бровь; zanurzony — погружённый"
