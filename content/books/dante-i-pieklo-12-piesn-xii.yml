# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 12
chapterTitle: "Pieśń XII"
chapterTitleRu: "Песнь XII. Кровавая река"
level: B2
paragraphs:
  - clean: "(Krąg VII. Koło I. Zbrodniarze przeciw innym; centaurowie, Chiron, Attyla i inni tyrani i mordercy.)"
    chunks:
      - pl: "(Krąg VII. Koło I. Zbrodniarze przeciw innym; centaurowie, Chiron, Attyla i inni tyrani i mordercy.)"
        ru: "(Круг VII. Пояс I. Насильники над ближними; кентавры, Хирон, Аттила и иные тираны и убийцы.)"
        note: "zbrodniarz — преступник; koło — здесь «пояс»"
    words: { "Krąg": krag, "Koło": kolo, "innym": inny, "mordercy": morderca }
  - clean: "Miejsce przechodu, brzeg ze ścianą ściętą\nI to, co jeszcze na przechodzie było,\nZe wstrętem wszelki wzrok by odwróciło.\nTaki jest widok zwaliska przy Trento,\nCo na Adygę stoczyło się z góry,\nTrzęsieniem ziemi lub z braku podpory\nBrzeg spadający środkiem skał wyłomu\nZ wierzchu zejść na dół nie radził nikomu,\nTak był okropnie stromy i wysoki;\nA na wierzchołku rozwartej opoki,\nSromota Krety, leżał rozciągnięty\nPotwór z kłamanej cielicy poczęty."
    verse: true
    chunks:
      - pl: "Miejsce przechodu, brzeg ze ścianą ściętą"
        ru: "Место перехода, берег с отвесной стеной,"
        note: "przechód — устар. «переход»; ścięty — срезанный"
      - pl: "\nI to, co jeszcze na przechodzie było,"
        ru: "и то, что ещё было на переходе,"
      - pl: "\nZe wstrętem wszelki wzrok by odwróciło."
        ru: "с отвращением отвратило бы всякий взгляд."
        note: "wstręt — отвращение"
      - pl: "\nTaki jest widok zwaliska przy Trento,"
        ru: "Таков вид обвала у Тренто,"
        note: "zwalisko — обвал, развалины"
      - pl: "\nCo na Adygę stoczyło się z góry,"
        ru: "что скатился с горы на Адидже,"
        note: "Adyga — река Адидже"
      - pl: "\nTrzęsieniem ziemi lub z braku podpory"
        ru: "от землетрясения или от недостатка опоры, —"
        note: "trzęsienie ziemi — землетрясение; podpora — опора"
      - pl: "\nBrzeg spadający środkiem skał wyłomu"
        ru: "обрушенный берег посреди пролома скал"
        note: "wyłom — пролом"
      - pl: "\nZ wierzchu zejść na dół nie radził nikomu,"
        ru: "никому не советовал спускаться сверху вниз,"
      - pl: "\nTak był okropnie stromy i wysoki;"
        ru: "так он был страшно крут и высок;"
      - pl: "\nA na wierzchołku rozwartej opoki,"
        ru: "а на вершине расколотой скалы,"
        note: "wierzchołek — вершина; opoka — скала"
      - pl: "\nSromota Krety, leżał rozciągnięty"
        ru: "позор Крита, лежал растянувшись"
        note: "sromota — позор"
      - pl: "\nPotwór z kłamanej cielicy poczęty."
        ru: "зверь, зачатый от поддельной тёлки."
        note: "kłamany — поддельный; cielica — тёлка; Минотавр"
    words: { "brzeg": brzeg, "wzrok": wzrok, "widok": widok, "skał": skala, "okropnie": okropnie, "poczęty": poczac }
  - clean: "A gdy nas ujrzał, to sam siebie kąsał,\nJak ten, co gniewem wściekle się rozdąsał.\nMędrzec doń krzyknął: «Może ci się roi,\nŻe tu przed tobą wódz ateński stoi,\nKtóry tam wyżej strzaskał ci paszczękę?\nPatrz, on nie idzie za radą twej siostry,\nTylko przychodzi widzieć twoją mękę»."
    verse: true
    chunks:
      - pl: "A gdy nas ujrzał, to sam siebie kąsał,"
        ru: "А когда нас увидел, то сам себя кусал,"
        note: "kąsać — кусать"
      - pl: "\nJak ten, co gniewem wściekle się rozdąsał."
        ru: "как тот, кто гневом яростно разъярился."
        note: "rozdąsać się — разозлиться"
      - pl: "\nMędrzec doń krzyknął: «Może ci się roi,"
        ru: "Мудрец крикнул ему: «Может, тебе мерещится,"
        note: "roić się — мерещиться"
      - pl: "\nŻe tu przed tobą wódz ateński stoi,"
        ru: "что здесь перед тобой стоит афинский вождь,"
        note: "Тесей"
      - pl: "\nKtóry tam wyżej strzaskał ci paszczękę?"
        ru: "который там, наверху, раздробил тебе челюсть?"
        note: "strzaskać — раздробить"
      - pl: "\nPatrz, on nie idzie za radą twej siostry,"
        ru: "Смотри, он идёт не по совету твоей сестры,"
        note: "Ариадна"
      - pl: "\nTylko przychodzi widzieć twoją mękę»."
        ru: "а приходит видеть твою муку»."
    words: { "ujrzał": ujrzec, "gniewem": gniew, "wódz": wodz, "radą": rada, "siostry": siostra, "przychodzi": przychodzic }
  - clean: "Jak byk, gdy postrzał uwięźnie w nim ostry,\nSkacze, unosząc żelazo utkwione,\nTak Minotaurus uskoczył na stronę.\nA mistrz zakrzyknął: «Nim tego potworu\nGniew się wytrawi, wejdź w szyję otworu».\nI drogę sami robiąc gardłem jaru,\nSzliśmy przez głazy, kamienie i progi;\nGłazy naciskiem nowego ciężaru\nZ trzaskiem spod mojej toczyły się nogi."
    verse: true
    chunks:
      - pl: "Jak byk, gdy postrzał uwięźnie w nim ostry,"
        ru: "Как бык, когда в нём застрянет острая стрела,"
        note: "postrzał — рана от выстрела; uwięznąć — застрять"
      - pl: "\nSkacze, unosząc żelazo utkwione,"
        ru: "скачет, унося вонзённое железо,"
        note: "utkwiony — вонзённый"
      - pl: "\nTak Minotaurus uskoczył na stronę."
        ru: "так Минотавр отскочил в сторону."
        note: "uskoczyć — отскочить"
      - pl: "\nA mistrz zakrzyknął: «Nim tego potworu"
        ru: "А учитель вскричал: «Пока гнев этого чудовища"
        note: "potworu — устар. род. п., ныне potwora"
      - pl: "\nGniew się wytrawi, wejdź w szyję otworu»."
        ru: "не выгорит, войди в горловину прохода»."
        note: "wytrawić się — выгореть, перебродить"
      - pl: "\nI drogę sami robiąc gardłem jaru,"
        ru: "И, сами прокладывая путь по горлу оврага,"
        note: "jar — овраг"
      - pl: "\nSzliśmy przez głazy, kamienie i progi;"
        ru: "мы шли через валуны, камни и уступы;"
        note: "głaz — валун; próg — уступ"
      - pl: "\nGłazy naciskiem nowego ciężaru"
        ru: "валуны под напором новой тяжести"
        note: "nacisk — напор"
      - pl: "\nZ trzaskiem spod mojej toczyły się nogi."
        ru: "с треском катились из-под моей ноги."
        note: "trzask — треск"
    words: { "żelazo": zelazo, "otworu": otwor, "jaru": jar, "progi": prog, "naciskiem": nacisk, "toczyły": toczyc }
  - clean: "A mistrz tak mówił, gdy idąc, marzyłem:\n«Ty może marzysz o tych skał ruinie,\nStrzeżonej przez złość gorszą niż w gadzinie,\nA którą gromem słów moich zgłuszyłem.\nChcę, abyś wiedział, gdy ostatnim razem\nZszedłem do piekieł za wróżki rozkazem,\nSkała ta jeszcze w jednej była bryle;\nNiewiele przedtem (jeśli się nie mylę)."
    verse: true
    chunks:
      - pl: "A mistrz tak mówił, gdy idąc, marzyłem:"
        ru: "А учитель так говорил, когда я, идя, задумался:"
        note: "marzyć — мечтать, задуматься"
      - pl: "\n«Ty może marzysz o tych skał ruinie,"
        ru: "«Ты, может, думаешь об этом обвале скал,"
      - pl: "\nStrzeżonej przez złość gorszą niż w gadzinie,"
        ru: "стерегомом злобой худшей, чем у гада,"
        note: "gadzina — гад, ядовитая тварь"
      - pl: "\nA którą gromem słów moich zgłuszyłem."
        ru: "которую я заглушил громом своих слов."
        note: "zgłuszyć — заглушить"
      - pl: "\nChcę, abyś wiedział, gdy ostatnim razem"
        ru: "Хочу, чтобы ты знал: когда в прошлый раз"
      - pl: "\nZszedłem do piekieł za wróżki rozkazem,"
        ru: "я сошёл в ад по велению колдуньи,"
        note: "wróżka — гадалка, колдунья"
      - pl: "\nSkała ta jeszcze w jednej była bryle;"
        ru: "эта скала была ещё одной глыбой;"
        note: "bryła — глыба"
      - pl: "\nNiewiele przedtem (jeśli się nie mylę)."
        ru: "незадолго до того (если не ошибаюсь),"
        note: "przedtem — до того"
    words: { "marzyłem": marzyc, "Strzeżonej": strzec, "Zszedłem": zejsc, "piekieł": pieklo, "wróżki": wrozka, "przedtem": przedtem }
  - clean: "Gdy zstąpił z nieba ten, który Disowi\nWziął wielką zdobycz! Strach był w piekle całem,\nTrzęsła się do dna ta otchłań głęboka;\nCzy świat miłością zadrżał, pomyślałem,\nPrzez którą, jeśli wierzyć, co Grek gadał,\nPo wiele razy świat w chaos odpadał?"
    verse: true
    chunks:
      - pl: "Gdy zstąpił z nieba ten, który Disowi"
        ru: "как сошёл с неба Тот, кто у Дита"
        note: "Христос; Dis — владыка ада"
      - pl: "\nWziął wielką zdobycz! Strach był w piekle całem,"
        ru: "взял великую добычу! Страх был во всём аду,"
        note: "zdobycz — добыча"
      - pl: "\nTrzęsła się do dna ta otchłań głęboka;"
        ru: "дрожала до дна эта глубокая бездна;"
      - pl: "\nCzy świat miłością zadrżał, pomyślałem,"
        ru: "не задрожал ли мир от любви, подумал я,"
      - pl: "\nPrzez którą, jeśli wierzyć, co Grek gadał,"
        ru: "из-за которой, если верить тому, что грек болтал,"
        note: "Эмпедокл"
      - pl: "\nPo wiele razy świat w chaos odpadał?"
        ru: "мир много раз впадал в хаос?"
        note: "odpadać — впадать, отпадать"
    words: { "nieba": niebo, "Strach": strach, "Trzęsła": trzasc, "głęboka": gleboki, "chaos": chaos, "odpadał": odpadac }
  - clean: "Wtenczas runęła ta stara opoka!\nSpójrz, oto rzeka krwi!» Mistrz dalej mówi:\n«W której się warzy wrzucony w jej brody,\nKto przez gwałt drugim przyczyną był szkody».\nŚlepa chciwości! bezrozumny gniewie!\nKrótkie nam życie paląc jak zarzewie,\nW takie na wieki rzucacie nas wody!"
    verse: true
    chunks:
      - pl: "Wtenczas runęła ta stara opoka!"
        ru: "Тогда и рухнула эта древняя скала!"
        note: "runąć — рухнуть"
      - pl: "\nSpójrz, oto rzeka krwi!» Mistrz dalej mówi:"
        ru: "Взгляни, вот река крови!» Учитель говорит дальше:"
      - pl: "\n«W której się warzy wrzucony w jej brody,"
        ru: "«В которой варится, брошенный в её воды,"
        note: "warzyć się — вариться"
      - pl: "\nKto przez gwałt drugim przyczyną był szkody»."
        ru: "тот, кто насилием причинил вред другим»."
        note: "być przyczyną szkody — причинить вред"
      - pl: "\nŚlepa chciwości! bezrozumny gniewie!"
        ru: "Слепая алчность! Безрассудный гнев!"
        note: "chciwość — алчность"
      - pl: "\nKrótkie nam życie paląc jak zarzewie,"
        ru: "Сжигая нам короткую жизнь, как головню,"
        note: "zarzewie — головня, тлеющий уголь"
      - pl: "\nW takie na wieki rzucacie nas wody!"
        ru: "вы бросаете нас навеки в такие воды!"
    words: { "rzeka": rzeka, "wrzucony": wrzucic, "przyczyną": przyczyna, "Krótkie": krotki, "paląc": palic, "rzucacie": rzucac }
  - clean: "Widziałem fosę, jak łuk zakrzywiona\nDolinę w krzywe objęła ramiona;\nA między fosą i pomiędzy skałą,\nJeden za drugim uzbrojony strzałą,\nBiegły centaury jak niegdyś na łowy.\nGdy nas zobaczył ten orszak myśliwy,\nWstrzymał się, patrzym, aż wprost ku nam leci,\nZ łukiem napiętym jeden, drugi, trzeci;\nJeden z nich z dala krzyczał tymi słowy:\nNa jakie wasze skazane tu życie\nCierpienia? mówcie, bo jeśli milczycie,\nWypuszczę strzałę na was». A mistrz mówi:"
    verse: true
    chunks:
      - pl: "Widziałem fosę, jak łuk zakrzywiona"
        ru: "Я видел ров, изогнутый, как лук,"
        note: "zakrzywiony — изогнутый"
      - pl: "\nDolinę w krzywe objęła ramiona;"
        ru: "что обнял долину кривыми руками;"
        note: "ramię — плечо, рука"
      - pl: "\nA między fosą i pomiędzy skałą,"
        ru: "а между рвом и скалой,"
      - pl: "\nJeden za drugim uzbrojony strzałą,"
        ru: "один за другим, вооружённые стрелами,"
      - pl: "\nBiegły centaury jak niegdyś na łowy."
        ru: "бежали кентавры, как некогда на охоту."
        note: "łowy — охота"
      - pl: "\nGdy nas zobaczył ten orszak myśliwy,"
        ru: "Когда нас увидела эта охотничья свита,"
        note: "myśliwy — охотничий"
      - pl: "\nWstrzymał się, patrzym, aż wprost ku nam leci,"
        ru: "остановилась; смотрим — прямо к нам летит"
        note: "patrzym — устар. «смотрим»"
      - pl: "\nZ łukiem napiętym jeden, drugi, trzeci;"
        ru: "с натянутым луком один, второй, третий;"
        note: "napięty — натянутый"
      - pl: "\nJeden z nich z dala krzyczał tymi słowy:"
        ru: "один из них издали кричал такими словами:"
        note: "z dala — издали"
      - pl: "\nNa jakie wasze skazane tu życie"
        ru: "«На какие страдания вы здесь обречены"
        note: "skazany — обречённый"
      - pl: "\nCierpienia? mówcie, bo jeśli milczycie,"
        ru: "жизнью вашей? Говорите, ибо, если молчите,"
      - pl: "\nWypuszczę strzałę na was». A mistrz mówi:"
        ru: "выпущу в вас стрелу». А учитель говорит:"
    words: { "Dolinę": dolina, "objęła": objac, "myśliwy": mysliwy, "Wstrzymał": wstrzymac, "łukiem": luk, "napiętym": napiac }
  - clean: "«Naszą odpowiedź damy Chironowi:\nNa twe nieszczęście zawsześ był zbyt żywy«\nPotem mnie trącił i rzekł słodkim tonem:\n«Oto jest Nessus, doradca nieszczery,\nKtóry dla pięknej umarł Dejaniry\nI sam swej śmierci pomścił się przed zgonem."
    verse: true
    chunks:
      - pl: "«Naszą odpowiedź damy Chironowi:"
        ru: "«Наш ответ мы дадим Хирону:"
      - pl: "\nNa twe nieszczęście zawsześ był zbyt żywy«"
        ru: "на твоё несчастье ты всегда был слишком горяч»."
        note: "zawsześ = zawsze + -ś"
      - pl: "\nPotem mnie trącił i rzekł słodkim tonem:"
        ru: "Потом тронул меня и сказал ласковым тоном:"
        note: "trącić — тронуть"
      - pl: "\n«Oto jest Nessus, doradca nieszczery,"
        ru: "«Вот это Несс, советчик неискренний,"
        note: "doradca — советчик"
      - pl: "\nKtóry dla pięknej umarł Dejaniry"
        ru: "что из-за прекрасной Деяниры умер"
      - pl: "\nI sam swej śmierci pomścił się przed zgonem."
        ru: "и сам отомстил за свою смерть перед кончиной."
        note: "pomścić się czegoś — отомстить за что-л."
    words: { "nieszczęście": nieszczescie, "żywy": zywy, "rzekł": rzec, "tonem": ton, "doradca": doradca, "zgonem": zgon }
  - clean: "Pośrodku z czołem na pierś pochylonem,\nPatrz, stoi wielki Chiron, mistrz Achilla,\nTrzeci, to Folus, co był zły jak żmija\nMnóstwo ich biega wokoło tej fosy,\nA każdy strzałą w lot ducha przebija,\nJeśli z krwi który więcej się wychyla,\nNiż grzech pozwala wypłynąć z tej wody»."
    verse: true
    chunks:
      - pl: "Pośrodku z czołem na pierś pochylonem,"
        ru: "Посередине, с челом, склонённым на грудь,"
      - pl: "\nPatrz, stoi wielki Chiron, mistrz Achilla,"
        ru: "смотри, стоит великий Хирон, учитель Ахилла,"
      - pl: "\nTrzeci, to Folus, co był zły jak żmija"
        ru: "третий — это Фол, что был зол, как гадюка."
      - pl: "\nMnóstwo ich biega wokoło tej fosy,"
        ru: "Множество их бегает вокруг этого рва,"
      - pl: "\nA każdy strzałą w lot ducha przebija,"
        ru: "и каждый стрелой на лету пронзает духа,"
        note: "w lot — на лету"
      - pl: "\nJeśli z krwi który więcej się wychyla,"
        ru: "если кто-нибудь высовывается из крови больше,"
        note: "wychylać się — высовываться"
      - pl: "\nNiż grzech pozwala wypłynąć z tej wody»."
        ru: "чем грех позволяет вынырнуть из этой воды»."
    words: { "pierś": piers, "Mnóstwo": mnostwo, "biega": biegac, "strzałą": strzala, "grzech": grzech, "wypłynąć": wyplynac }
  - clean: "Gdy nasze kroki do nich się zbliżały,\nChiron ująwszy za głownię od strzały\nI przyłożywszy do kudłatej brody,\nW takim sposobie rozczesał jej włosy,\nŻe odkrył wargi wielkiej gęby swojej\nI rzekł: «Widzicież, towarzysze moi?"
    verse: true
    chunks:
      - pl: "Gdy nasze kroki do nich się zbliżały,"
        ru: "Когда наши шаги к ним приближались,"
      - pl: "\nChiron ująwszy za głownię od strzały"
        ru: "Хирон, взяв стрелу за ушко"
        note: "głownia — здесь «древко, конец стрелы»"
      - pl: "\nI przyłożywszy do kudłatej brody,"
        ru: "и приложив к косматой бороде,"
        note: "kudłaty — косматый"
      - pl: "\nW takim sposobie rozczesał jej włosy,"
        ru: "таким способом расчесал на ней волосы,"
      - pl: "\nŻe odkrył wargi wielkiej gęby swojej"
        ru: "что открыл губы своего большого рта"
        note: "warga — губа; gęba — пасть, рот"
      - pl: "\nI rzekł: «Widzicież, towarzysze moi?"
        ru: "и сказал: «Видите ли, товарищи мои?"
        note: "widzicież — видите ли"
    words: { "zbliżały": zblizac, "ująwszy": ujac, "przyłożywszy": przylozyc, "wargi": warga, "gęby": geba, "towarzysze": towarzysz }
  - clean: "Ten drugi z tyłu, czego tknie, porusza,\nTak ciężkiej stopy nie ma zmarłych dusza!».\nMistrz do potwora zbliżywszy się rączo,\nKu piersiom, gdzie się dwie natury łączą,\nTak rzekł: «On żyje, przez daną mi władzę\nPo ciemnych kręgach ja go sam prowadzę."
