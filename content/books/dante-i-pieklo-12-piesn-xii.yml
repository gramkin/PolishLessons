    chunks:
      - pl: "Ten drugi z tyłu, czego tknie, porusza,"
        ru: "Тот второй, сзади, двигает то, чего коснётся,"
        note: "tknąć — коснуться"
      - pl: "\nTak ciężkiej stopy nie ma zmarłych dusza!»."
        ru: "столь тяжёлой стопы нет у души мёртвых!»"
      - pl: "\nMistrz do potwora zbliżywszy się rączo,"
        ru: "Учитель, быстро подойдя к чудовищу,"
        note: "rączo — быстро"
      - pl: "\nKu piersiom, gdzie się dwie natury łączą,"
        ru: "к груди, где соединяются две природы,"
