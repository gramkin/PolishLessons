        ru: "Он уворачивался."
      - pl: " Przeklinali jego, jego ojców i matki przed nim, i całe jego potomstwo po nim aż do najdalszego pokolenia,"
        ru: "Они проклинали его, его отцов и матерей до него и всё его потомство после него до самого дальнего колена,"
        note: "przeklinać — проклинать"
      - pl: " i każdy włos na jego ciele, i każdą kroplę krwi w jego żyłach;"
        ru: "и каждый волос на его теле, и каждую каплю крови в его жилах;"
        note: "żyła — вена, жила"
      - pl: " a on odpowiadał na przekleństwa warczeniem i trzymał się poza ich zasięgiem."
        ru: "а он отвечал на проклятия рычанием и держался вне их досягаемости."
      - pl: " Nie próbował uciec, tylko krążył wokół obozu, dając jasno do zrozumienia,"
        ru: "Он не пытался убежать, а лишь кружил вокруг лагеря, ясно давая понять,"
      - pl: " że gdy jego pragnienie zostanie spełnione, podejdzie i będzie grzeczny."
