paragraphs:
  - clean: "— Hę? Co ja mówić? Ja mówić prawda, kiedy mówić, że ten Buck dwa diabły. Tak przemówił François następnego ranka, kiedy odkrył, że Spitza nie ma, a Buck jest cały w ranach. Przyciągnął go do ognia i w jego blasku pokazał je."
    en: "“Eh? Wot I say? I spik true w’en I say dat Buck two devils.” This was François’s speech next morning when he discovered Spitz missing and Buck covered with wounds. He drew him to the fire and by its light pointed them out."
    draft: true
    chunks:
      - pl: "— Hę? Co ja mówić? Ja mówić prawda, kiedy mówić, że ten Buck dwa diabły."
        ru: "— А? Что я говорить? Я говорить правда, когда говорить, что этот Бэк два дьявола."
      - pl: " Tak przemówił François następnego ranka, kiedy odkrył, że Spitza nie ma, a Buck jest cały w ranach."
        ru: "Так сказал Франсуа на следующее утро, когда обнаружил, что Шпица нет, а Бэк весь в ранах."
      - pl: " Przyciągnął go do ognia i w jego blasku pokazał je."
        ru: "Он подтащил его к огню и при его свете показал их."
        note: "blask — свет, сияние"
    words: { "diabły": diabel, "przemówił": przemowic, "następnego": nastepny, "odkrył": odkryc, "ognia": ogien, "blasku": blask }
  - clean: "— Ten Spitz walczyć jak diabli — powiedział Perrault, oglądając ziejące rozdarcia i cięcia."
    en: "“Dat Spitz fight lak hell,” said Perrault, as he surveyed the gaping rips and cuts."
    draft: true
    chunks:
      - pl: "— Ten Spitz walczyć jak diabli — powiedział Perrault, oglądając ziejące rozdarcia i cięcia."
        ru: "— Этот Шпиц драться как черти, — сказал Перро, осматривая зияющие разрывы и порезы."
        note: "ziejący — зияющий; rozdarcie — разрыв"
    words: { "walczyć": walczyc, "diabli": diabel, "powiedział": powiedziec, "oglądając": ogladac, "ziejące": ziac }
  - clean: "— A ten Buck walczyć jak dwa piekła — odpowiedział François. — A teraz my jechać szybko. Nie ma Spitz, nie ma kłopot, na pewno."
    en: "“An’ dat Buck fight lak two hells,” was François’s answer. “An’ now we make good time. No more Spitz, no more trouble, sure.”"
    draft: true
    chunks:
      - pl: "— A ten Buck walczyć jak dwa piekła — odpowiedział François. — A teraz my jechać szybko. Nie ma Spitz, nie ma kłopot, na pewno."
        ru: "— А этот Бэк драться как два ада, — ответил Франсуа. — А теперь мы ехать быстро. Нет Шпиц — нет беда, точно."
    words: { "walczyć": walczyc, "odpowiedział": odpowiedziec, "teraz": teraz, "jechać": jechac, "kłopot": klopot, "pewno": pewno }
  - clean: "Kiedy Perrault pakował obozowy sprzęt i ładował sanie, poganiacz zabrał się do zaprzęgania psów. Buck podbiegł truchtem na miejsce, które zajmowałby Spitz jako przewodnik; ale François, nie zauważając go, postawił na upragnionym miejscu Sol-leksa. Jego zdaniem Sol-leks był najlepszym przewodnikiem, jaki został. Buck z furią skoczył na Sol-leksa, odepchnął go i stanął na jego miejscu."
    en: "While Perrault packed the camp outfit and loaded the sled, the dog-driver proceeded to harness the dogs. Buck trotted up to the place Spitz would have occupied as leader; but François, not noticing him, brought Sol-leks to the coveted position. In his judgment, Sol-leks was the best lead-dog left. Buck sprang upon Sol-leks in a fury, driving him back and standing in his place."
    draft: true
    chunks:
      - pl: "Kiedy Perrault pakował obozowy sprzęt i ładował sanie, poganiacz zabrał się do zaprzęgania psów."
        ru: "Пока Перро упаковывал лагерное снаряжение и грузил сани, погонщик принялся запрягать собак."
        note: "sprzęt — снаряжение"
      - pl: " Buck podbiegł truchtem na miejsce, które zajmowałby Spitz jako przewodnik;"
        ru: "Бэк трусцой подбежал к месту, которое занимал бы Шпиц как вожак;"
        note: "truchtem — рысцой, трусцой"
      - pl: " ale François, nie zauważając go, postawił na upragnionym miejscu Sol-leksa."
        ru: "но Франсуа, не замечая его, поставил на вожделенное место Сол-лекса."
        note: "upragniony — желанный"
      - pl: " Jego zdaniem Sol-leks był najlepszym przewodnikiem, jaki został."
        ru: "По его мнению, Сол-лекс был лучшим из оставшихся вожаков."
      - pl: " Buck z furią skoczył na Sol-leksa, odepchnął go i stanął na jego miejscu."
        ru: "Бэк в ярости прыгнул на Сол-лекса, отогнал его и встал на его место."
    words: { "pakował": pakowac, "sprzęt": sprzet, "przewodnik": przewodnik, "postawił": postawic, "skoczył": skoczyc, "stanął": stanac }
  - clean: "— Hę? Hę? — zawołał François, z radością klepiąc się po udach. — Patrz na tego Bucka. On zabić tego Spitza, on myśleć wziąć jego robota."
    en: "“Eh? eh?” François cried, slapping his thighs gleefully. “Look at dat Buck. Heem keel dat Spitz, heem t’ink to take de job.”"
    draft: true
    chunks:
      - pl: "— Hę? Hę? — zawołał François, z radością klepiąc się po udach. — Patrz na tego Bucka. On zabić tego Spitza, on myśleć wziąć jego robota."
        ru: "— А? А? — воскликнул Франсуа, радостно хлопая себя по ляжкам. — Смотри на этот Бэк. Он убить этот Шпиц, он думать взять его работа."
        note: "udo — бедро"
    words: { "zawołał": zawolac, "radością": radosc, "udach": udo, "Patrz": patrzec, "zabić": zabic, "wziąć": wziac }
  - clean: "— Precz, Chook! — krzyknął, ale Buck nie chciał się ruszyć."
    en: "“Go ’way, Chook!” he cried, but Buck refused to budge."
    draft: true
    chunks:
      - pl: "— Precz, Chook! — krzyknął, ale Buck nie chciał się ruszyć."
        ru: "— Пошёл, Чук! — крикнул он, но Бэк не желал двигаться."
        note: "Chook — окрик погонщика"
    words: { "chciał": chciec, "ruszyć": ruszyc }
  - clean: "Złapał Bucka za kark i choć pies groźnie warczał, odciągnął go na bok i z powrotem postawił Sol-leksa. Stary pies tego nie lubił i wyraźnie okazywał, że boi się Bucka. François był uparty, ale kiedy się odwrócił, Buck znów wyparł Sol-leksa, który wcale nie wzbraniał się odejść."
    en: "He took Buck by the scruff of the neck, and though the dog growled threateningly, dragged him to one side and replaced Sol-leks. The old dog did not like it, and showed plainly that he was afraid of Buck. François was obdurate, but when he turned his back Buck again displaced Sol-leks, who was not at all unwilling to go."
    draft: true
    chunks:
      - pl: "Złapał Bucka za kark i choć pies groźnie warczał, odciągnął go na bok i z powrotem postawił Sol-leksa."
        ru: "Он схватил Бэка за загривок и, хотя пёс грозно рычал, оттащил его в сторону и снова поставил Сол-лекса."
      - pl: " Stary pies tego nie lubił i wyraźnie okazywał, że boi się Bucka."
        ru: "Старому псу это не нравилось, и он явно показывал, что боится Бэка."
      - pl: " François był uparty, ale kiedy się odwrócił, Buck znów wyparł Sol-leksa, który wcale nie wzbraniał się odejść."
        ru: "Франсуа был упрям, но когда он отвернулся, Бэк снова вытеснил Сол-лекса, который вовсе не возражал уйти."
        note: "wyprzeć — вытеснить; wzbraniać się — отказываться"
    words: { "kark": kark, "wyraźnie": wyraznie, "okazywał": okazywac, "uparty": uparty, "odwrócił": odwrocic, "wyparł": wyprzec }
  - clean: "François się rozzłościł. — Teraz, na Boga, ja cię nauczyć! — krzyknął, wracając z ciężką pałką w ręku."
    en: "François was angry. “Now, by Gar, I feex you!” he cried, coming back with a heavy club in his hand."
    draft: true
    chunks:
      - pl: "François się rozzłościł."
        ru: "Франсуа рассердился."
      - pl: " — Teraz, na Boga, ja cię nauczyć! — krzyknął, wracając z ciężką pałką w ręku."
        ru: "— Ну, ей-богу, я тебя проучить! — крикнул он, возвращаясь с тяжёлой дубинкой в руке."
    words: { "Teraz": teraz, "Boga": bog, "nauczyć": nauczyc, "wracając": wracac, "ciężką": ciezki, "ręku": reka }
  - clean: "Buck przypomniał sobie mężczyznę w czerwonym swetrze i powoli się wycofał; nie próbował też atakować, kiedy Sol-leksa znów wprowadzono na przód. Ale krążył tuż poza zasięgiem pałki, warcząc z goryczą i wściekłością; a krążąc, obserwował pałkę, żeby się uchylić, gdyby François nią rzucił, bo nauczył się już, jak to jest z pałkami. Poganiacz zajął się swoją robotą, a gdy był gotów, zawołał Bucka, żeby postawić go na dawnym miejscu przed Dave'em."
    en: "Buck remembered the man in the red sweater, and retreated slowly; nor did he attempt to charge in when Sol-leks was once more brought forward. But he circled just beyond the range of the club, snarling with bitterness and rage; and while he circled he watched the club so as to dodge it if thrown by François, for he was become wise in the way of clubs. The driver went about his work, and he called to Buck when he was ready to put him in his old place in front of Dave."
    draft: true
    chunks:
      - pl: "Buck przypomniał sobie mężczyznę w czerwonym swetrze i powoli się wycofał;"
        ru: "Бэк вспомнил человека в красном свитере и медленно отступил;"
      - pl: " nie próbował też atakować, kiedy Sol-leksa znów wprowadzono na przód."
        ru: "не пытался он и наброситься, когда Сол-лекса снова вывели вперёд."
      - pl: " Ale krążył tuż poza zasięgiem pałki, warcząc z goryczą i wściekłością;"
        ru: "Но он кружил прямо за пределами досягаемости дубинки, рыча с горечью и злобой;"
