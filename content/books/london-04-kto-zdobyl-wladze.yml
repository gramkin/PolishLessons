  - clean: "François usłuchał, a wtedy Buck podbiegł truchtem, śmiejąc się triumfalnie, i stanął na czele zaprzęgu. Przypięto mu szleje, oderwano sanie od lodu i obaj mężczyźni, biegnąc, wypadli z nimi na szlak rzeczny."
    en: "François complied, whereupon Buck trotted in, laughing triumphantly, and swung around into position at the head of the team. His traces were fastened, the sled broken out, and with both men running they dashed out on to the river trail."
    draft: true
    chunks:
