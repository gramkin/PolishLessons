      - pl: " Wtedy François podszedł tam, gdzie stał Sol-leks, i zawołał Bucka."
        ru: "Тогда Франсуа подошёл туда, где стоял Сол-лекс, и позвал Бэка."
      - pl: " Buck się zaśmiał, tak jak śmieją się psy, ale trzymał się z daleka."
        ru: "Бэк засмеялся, как смеются собаки, но держался на расстоянии."
      - pl: " François odpiął szleje Sol-leksa i odprowadził go na dawne miejsce."
        ru: "Франсуа отстегнул постромки Сол-лекса и отвёл его на прежнее место."
        note: "odpiąć — отстегнуть"
      - pl: " Zaprzęg stał przy saniach w nieprzerwanym szeregu, gotów do drogi."
        ru: "Упряжка стояла у саней непрерывной цепочкой, готовая в путь."
      - pl: " Dla Bucka nie było miejsca inaczej niż na przedzie."
        ru: "Для Бэка не оставалось места, кроме как впереди."
      - pl: " Jeszcze raz François zawołał i jeszcze raz Buck się zaśmiał i trzymał z daleka."
        ru: "Ещё раз Франсуа позвал, и ещё раз Бэк засмеялся и держался в стороне."
