  - clean: "François usiadł i podrapał się w głowę. Perrault spojrzał na zegarek i zaklął. Czas uciekał, a oni powinni byli być na szlaku już od godziny. François znów podrapał się w głowę. Pokręcił nią i uśmiechnął się z zakłopotaniem do kuriera, który wzruszył ramionami na znak, że zostali pokonani. Wtedy François podszedł tam, gdzie stał Sol-leks, i zawołał Bucka. Buck się zaśmiał, tak jak śmieją się psy, ale trzymał się z daleka. François odpiął szleje Sol-leksa i odprowadził go na dawne miejsce. Zaprzęg stał przy saniach w nieprzerwanym szeregu, gotów do drogi. Dla Bucka nie było miejsca inaczej niż na przedzie. Jeszcze raz François zawołał i jeszcze raz Buck się zaśmiał i trzymał z daleka."
    en: "François sat down and scratched his head. Perrault looked at his watch and swore. Time was flying, and they should have been on the trail an hour gone. François scratched his head again. He shook it and grinned sheepishly at the courier, who shrugged his shoulders in sign that they were beaten. Then François went up to where Sol-leks stood and called to Buck. Buck laughed, as dogs laugh, yet kept his distance. François unfastened Sol-leks’s traces and put him back in his old place. The team stood harnessed to the sled in an unbroken line, ready for the trail. There was no place for Buck save at the front. Once more François called, and once more Buck laughed and kept away."
    draft: true
    chunks:
      - pl: "François usiadł i podrapał się w głowę."
        ru: "Франсуа сел и почесал в затылке."
        note: "podrapać się — почесаться"
      - pl: " Perrault spojrzał na zegarek i zaklął."
        ru: "Перро посмотрел на часы и выругался."
      - pl: " Czas uciekał, a oni powinni byli być na szlaku już od godziny."
        ru: "Время уходило, а им следовало быть на тропе уже час назад."
      - pl: " François znów podrapał się w głowę."
        ru: "Франсуа снова почесал в затылке."
      - pl: " Pokręcił nią i uśmiechnął się z zakłopotaniem do kuriera, który wzruszył ramionami na znak, że zostali pokonani."
        ru: "Он покачал головой и сконфуженно улыбнулся курьеру, а тот пожал плечами в знак того, что они побеждены."
