      - pl: " a krążąc, obserwował pałkę, żeby się uchylić, gdyby François nią rzucił, bo nauczył się już, jak to jest z pałkami."
        ru: "а кружа, следил за дубинкой, чтобы увернуться, если Франсуа её бросит, ведь он уже знал толк в дубинках."
