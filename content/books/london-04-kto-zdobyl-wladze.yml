  - clean: "Buck cofnął się o dwa czy trzy kroki. François poszedł za nim, a on znowu się cofnął. Po jakimś czasie François rzucił pałkę, myśląc, że Buck boi się lania. Ale Buck podniósł jawny bunt. Chciał nie uniknąć pałki, lecz zdobyć przywództwo. Słusznie mu się należało. Zasłużył na nie i nie zadowoliłby się niczym mniej."
    en: "Buck retreated two or three steps. François followed him up, whereupon he again retreated. After some time of this, François threw down the club, thinking that Buck feared a thrashing. But Buck was in open revolt. He wanted, not to escape a clubbing, but to have the leadership. It was his by right. He had earned it, and he would not be content with less."
    draft: true
    chunks:
      - pl: "Buck cofnął się o dwa czy trzy kroki."
        ru: "Бэк отступил на два-три шага."
      - pl: " François poszedł za nim, a on znowu się cofnął."
        ru: "Франсуа пошёл за ним, а он снова отступил."
      - pl: " Po jakimś czasie François rzucił pałkę, myśląc, że Buck boi się lania."
        ru: "Через некоторое время Франсуа бросил дубинку, думая, что Бэк боится трёпки."
      - pl: " Ale Buck podniósł jawny bunt."
        ru: "Но Бэк поднял открытый бунт."
      - pl: " Chciał nie uniknąć pałki, lecz zdobyć przywództwo."
        ru: "Он хотел не избежать дубинки, а получить первенство."
      - pl: " Słusznie mu się należało."
        ru: "Оно принадлежало ему по праву."
      - pl: " Zasłużył na nie i nie zadowoliłby się niczym mniej."
        ru: "Он его заслужил и не удовольствовался бы ничем меньшим."
    words: { "cofnął": cofnac, "bunt": bunt, "uniknąć": uniknac, "Zasłużył": zasluzyc, "zadowoliłby": zadowolic }
  - clean: "Do sprawy włączył się Perrault. We dwóch uganiali się za nim przez dobrą godzinę. Rzucali w niego pałkami. Uchylał się. Przeklinali jego, jego ojców i matki przed nim, i całe jego potomstwo po nim aż do najdalszego pokolenia, i każdy włos na jego ciele, i każdą kroplę krwi w jego żyłach; a on odpowiadał na przekleństwa warczeniem i trzymał się poza ich zasięgiem. Nie próbował uciec, tylko krążył wokół obozu, dając jasno do zrozumienia, że gdy jego pragnienie zostanie spełnione, podejdzie i będzie grzeczny."
    en: "Perrault took a hand. Between them they ran him about for the better part of an hour. They threw clubs at him. He dodged. They cursed him, and his fathers and mothers before him, and all his seed to come after him down to the remotest generation, and every hair on his body and drop of blood in his veins; and he answered curse with snarl and kept out of their reach. He did not try to run away, but retreated around and around the camp, advertising plainly that when his desire was met, he would come in and be good."
    draft: true
    chunks:
      - pl: "Do sprawy włączył się Perrault."
        ru: "В дело вмешался Перро."
      - pl: " We dwóch uganiali się za nim przez dobrą godzinę."
        ru: "Вдвоём они гонялись за ним добрый час."
