  - clean: "Był to rekordowy bieg. Przez czternaście dni pokonywali średnio po sześćdziesiąt pięć kilometrów dziennie. Przez trzy dni Perrault i François chodzili dumnie po głównej ulicy Skagway i zasypywano ich zaproszeniami na kieliszek, a zaprzęg był bezustannie w centrum uwielbiającego tłumu treserów i poganiaczy psów. Potem trzech czy czterech zabijaków z Zachodu zapragnęło zrobić porządek z miastem, za swój trud zostali podziurawieni jak sitka, i uwaga publiczności zwróciła się ku innym bożyszczom. Następnie przyszły rozkazy urzędowe. François przywołał Bucka, objął go ramionami i zapłakał nad nim. I na tym skończyło się z Françoisem i Perraultem. Jak inni ludzie, odeszli z życia Bucka na zawsze."
    en: "It was a record run. Each day for fourteen days they had averaged forty miles. For three days Perrault and François threw chests up and down the main street of Skaguay and were deluged with invitations to drink, while the team was the constant centre of a worshipful crowd of dog-busters and mushers. Then three or four western bad men aspired to clean out the town, were riddled like pepper-boxes for their pains, and public interest turned to other idols. Next came official orders. François called Buck to him, threw his arms around him, wept over him. And that was the last of François and Perrault. Like other men, they passed out of Buck’s life for good."
