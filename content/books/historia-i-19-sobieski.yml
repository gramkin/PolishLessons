paragraphs:
  - clean: "Po abdykacji Jana Kazimierza szlachta wybrała na króla Michała Korybuta Wiśniowieckiego, syna słynnego księcia Jeremiego. Wybrano go głównie dlatego, że był Polakiem, a szlachta miała dość cudzoziemców. Nowy król był jednak słaby, niezdecydowany i bez doświadczenia. Nie miał też majątku, bo ojciec stracił wszystko na Ukrainie. Rozpowiadano, że kiedy dowiedział się o swoim wyborze, rozpłakał się, bo wiedział, że nie podoła zadaniu."
    draft: true
    chunks:
      - pl: "Po abdykacji Jana Kazimierza szlachta wybrała na króla Michała Korybuta Wiśniowieckiego, syna słynnego księcia Jeremiego."
        ru: "После отречения Яна Казимира шляхта избрала королём Михаила Корибута Вишневецкого, сына знаменитого князя Иеремии."
      - pl: " Wybrano go głównie dlatego, że był Polakiem, a szlachta miała dość cudzoziemców."
        ru: "Его избрали главным образом потому, что он был поляком, а шляхта устала от иноземцев."
      - pl: " Nowy król był jednak słaby, niezdecydowany i bez doświadczenia."
        ru: "Однако новый король был слаб, нерешителен и неопытен."
        note: "niezdecydowany — нерешительный"
      - pl: " Nie miał też majątku, bo ojciec stracił wszystko na Ukrainie."
        ru: "У него не было и состояния, потому что отец потерял всё на Украине."
      - pl: " Rozpowiadano, że kiedy dowiedział się o swoim wyborze, rozpłakał się, bo wiedział, że nie podoła zadaniu."
        ru: "Рассказывали, что, узнав о своём избрании, он расплакался, потому что знал, что не справится с задачей."
        note: "podołać — справиться"
    words: { "słynnego": slynny, "głównie": glownie, "majątku": majatek }
  - clean: "Jego krótkie panowanie przyniosło jedną z największych klęsk w historii Rzeczypospolitej. W 1672 roku armia turecka pod wodzą sułtana Mehmeda IV wkroczyła na Podole i obległa Kamieniec Podolski, najpotężniejszą twierdzę na południowo-wschodniej granicy. Załoga była nieliczna i źle przygotowana. Po dziewięciu dniach oblężenia komendant zdecydował się na kapitulację. Jeden z oficerów, pułkownik Jerzy Wołodyjowski, zginął wtedy w wybuchu prochowni, który według tradycji wywołano celowo, żeby nie oddać jej wrogom. Sienkiewicz uczynił z niego bohatera trzeciej części swojej trylogii."
    draft: true
    chunks:
      - pl: "Jego krótkie panowanie przyniosło jedną z największych klęsk w historii Rzeczypospolitej."
        ru: "Его короткое правление принесло одно из крупнейших поражений в истории Речи Посполитой."
      - pl: " W 1672 roku armia turecka pod wodzą sułtana Mehmeda IV wkroczyła na Podole i obległa Kamieniec Podolski, najpotężniejszą twierdzę na południowo-wschodniej granicy."
        ru: "В 1672 году турецкая армия во главе с султаном Мехмедом IV вступила в Подолию и осадила Каменец-Подольский, мощнейшую крепость на юго-восточной границе."
      - pl: " Załoga była nieliczna i źle przygotowana."
        ru: "Гарнизон был малочислен и плохо подготовлен."
      - pl: " Po dziewięciu dniach oblężenia komendant zdecydował się na kapitulację."
        ru: "После девяти дней осады комендант решился на капитуляцию."
      - pl: " Jeden z oficerów, pułkownik Jerzy Wołodyjowski, zginął wtedy w wybuchu prochowni, który według tradycji wywołano celowo, żeby nie oddać jej wrogom."
        ru: "Один из офицеров, полковник Ежи Володыёвский, погиб тогда при взрыве порохового склада, который, по преданию, устроили намеренно, чтобы не отдать его врагам."
        note: "prochownia — пороховой склад; celowo — намеренно"
      - pl: " Sienkiewicz uczynił z niego bohatera trzeciej części swojej trylogii."
        ru: "Сенкевич сделал его героем третьей части своей трилогии."
    words: { "wkroczyła": wkroczyc, "najpotężniejszą": potezny, "wschodniej": wschodni, "Załoga": zaloga, "dziewięciu": dziewiec, "komendant": komendant, "wybuchu": wybuch, "tradycji": tradycja, "wywołano": wywolac, "celowo": celowo }
  - clean: "Upadek Kamieńca otworzył Turkom drogę w głąb kraju. W październiku 1672 roku w Buczaczu zawarto upokarzający traktat. Rzeczpospolita oddała Turcji Podole, zrzekła się prawobrzeżnej Ukrainy i zobowiązała się płacić sułtanowi coroczny haracz. Płacenie haraczu oznaczało, że chrześcijańskie państwo stawało się w oczach Turków prawie lennikiem sułtana. Szlachta była oburzona, a sejm odmówił zatwierdzenia traktatu. Trzeba było znowu walczyć."
    draft: true
    chunks:
      - pl: "Upadek Kamieńca otworzył Turkom drogę w głąb kraju."
        ru: "Падение Каменца открыло туркам путь вглубь страны."
      - pl: " W październiku 1672 roku w Buczaczu zawarto upokarzający traktat."
        ru: "В октябре 1672 года в Бучаче был заключён унизительный договор."
        note: "upokarzający — унизительный"
      - pl: " Rzeczpospolita oddała Turcji Podole, zrzekła się prawobrzeżnej Ukrainy i zobowiązała się płacić sułtanowi coroczny haracz."
        ru: "Речь Посполитая отдала Турции Подолию, отказалась от Правобережной Украины и обязалась платить султану ежегодную дань."
        note: "haracz — дань, харач"
      - pl: " Płacenie haraczu oznaczało, że chrześcijańskie państwo stawało się w oczach Turków prawie lennikiem sułtana."
        ru: "Выплата дани означала, что христианское государство становилось в глазах турок почти вассалом султана."
      - pl: " Szlachta była oburzona, a sejm odmówił zatwierdzenia traktatu."
        ru: "Шляхта была возмущена, а сейм отказался утвердить договор."
        note: "zatwierdzić — утвердить"
      - pl: " Trzeba było znowu walczyć."
        ru: "Пришлось снова воевать."
    words: { "Upadek": upadek, "głąb": glab, "październiku": pazdziernik, "zawarto": zawrzec }
  - clean: "Na czele armii stanął hetman wielki koronny Jan Sobieski. Urodził się w 1629 roku w zamku w Olesku na Rusi, w rodzinie zamożnej szlachty. Studiował w Krakowie, a potem podróżował po Europie, odwiedzając Francję, Niderlandy i Anglię. Walczył z Kozakami, Tatarami, Szwedami i Moskwą. W czasie potopu przez krótki czas był po stronie Szwedów, czego później nie lubił wspominać. Był znakomitym dowódcą, odważnym, pomysłowym i potrafiącym zachować zimną krew w najgorszej sytuacji. Kochał też książki, astronomię i piękne przedmioty, a w polityce bywał ambitny i małostkowy."
    draft: true
    chunks:
      - pl: "Na czele armii stanął hetman wielki koronny Jan Sobieski."
        ru: "Во главе армии встал великий коронный гетман Ян Собеский."
      - pl: " Urodził się w 1629 roku w zamku w Olesku na Rusi, w rodzinie zamożnej szlachty."
        ru: "Он родился в 1629 году в замке в Олеско на Руси, в семье зажиточной шляхты."
      - pl: " Studiował w Krakowie, a potem podróżował po Europie, odwiedzając Francję, Niderlandy i Anglię."
        ru: "Он учился в Кракове, а потом путешествовал по Европе, побывав во Франции, Нидерландах и Англии."
      - pl: " Walczył z Kozakami, Tatarami, Szwedami i Moskwą."
        ru: "Он воевал с казаками, татарами, шведами и Москвой."
      - pl: " W czasie potopu przez krótki czas był po stronie Szwedów, czego później nie lubił wspominać."
        ru: "Во время Потопа он короткое время был на стороне шведов, о чём потом не любил вспоминать."
      - pl: " Był znakomitym dowódcą, odważnym, pomysłowym i potrafiącym zachować zimną krew w najgorszej sytuacji."
        ru: "Он был превосходным полководцем — смелым, изобретательным и умевшим сохранять хладнокровие в самой тяжёлой ситуации."
        note: "pomysłowy — изобретательный; zimna krew — хладнокровие"
      - pl: " Kochał też książki, astronomię i piękne przedmioty, a w polityce bywał ambitny i małostkowy."
        ru: "Он любил также книги, астрономию и красивые вещи, а в политике бывал честолюбив и мелочен."
        note: "małostkowy — мелочный"
    words: { "czele": czolo, "zamku": zamek, "zamożnej": zamozny, "Studiował": studiowac, "podróżował": podrozowac, "odwiedzając": odwiedzac, "znakomitym": znakomity, "dowódcą": dowodca, "odważnym": odwazny, "przedmioty": przedmiot, "polityce": polityka, "bywał": bywac }
  - clean: "Sławę wodza Sobieski zdobył już kilka lat wcześniej. Na Ukrainie trwała wtedy Ruina, a hetman kozacki Piotr Doroszenko, rozczarowany zarówno Polską, jak i Moskwą, szukał opieki u sułtana. Jesienią 1667 roku Doroszenko i Tatarzy krymscy najechali Ruś Czerwoną z armią kilkakrotnie większą od polskiej. Sobieski, który miał zaledwie kilka tysięcy żołnierzy, zamknął się w ufortyfikowanym obozie pod Podhajcami. Przez dwa tygodnie odpierał ataki, a jego jazda wypadała z obozu i rozbijała tatarskie oddziały. W końcu chan zgodził się na rozmowy i zawarł rozejm. Podhajce pokazały, że Sobieski umie walczyć z przeciwnikiem, który ma przewagę liczebną, i nie traci głowy. Rok później został hetmanem wielkim koronnym, najwyższym dowódcą armii."
    draft: true
    chunks:
      - pl: "Sławę wodza Sobieski zdobył już kilka lat wcześniej."
        ru: "Славу полководца Собеский завоевал ещё несколькими годами ранее."
      - pl: " Na Ukrainie trwała wtedy Ruina, a hetman kozacki Piotr Doroszenko, rozczarowany zarówno Polską, jak i Moskwą, szukał opieki u sułtana."
        ru: "На Украине тогда шла Руина, а казацкий гетман Пётр Дорошенко, разочарованный и Польшей, и Москвой, искал покровительства у султана."
      - pl: " Jesienią 1667 roku Doroszenko i Tatarzy krymscy najechali Ruś Czerwoną z armią kilkakrotnie większą od polskiej."
        ru: "Осенью 1667 года Дорошенко и крымские татары вторглись в Червонную Русь с армией, в несколько раз превосходившей польскую."
      - pl: " Sobieski, który miał zaledwie kilka tysięcy żołnierzy, zamknął się w ufortyfikowanym obozie pod Podhajcami."
        ru: "Собеский, у которого было всего несколько тысяч воинов, заперся в укреплённом лагере под Подгайцами."
        note: "ufortyfikowany — укреплённый"
      - pl: " Przez dwa tygodnie odpierał ataki, a jego jazda wypadała z obozu i rozbijała tatarskie oddziały."
        ru: "Две недели он отбивал атаки, а его конница делала вылазки из лагеря и громила татарские отряды."
        note: "wypadać — делать вылазку"
      - pl: " W końcu chan zgodził się na rozmowy i zawarł rozejm."
        ru: "В конце концов хан согласился на переговоры и заключил перемирие."
      - pl: " Podhajce pokazały, że Sobieski umie walczyć z przeciwnikiem, który ma przewagę liczebną, i nie traci głowy."
        ru: "Подгайцы показали, что Собеский умеет воевать с противником, имеющим численное превосходство, и не теряет головы."
        note: "przewaga — превосходство"
      - pl: " Rok później został hetmanem wielkim koronnym, najwyższym dowódcą armii."
        ru: "Через год он стал великим коронным гетманом, высшим командующим армией."
    words: { "dowódcą": dowodca, "Sławę": slawa, "wodza": wodz, "rozczarowany": rozczarowac, "zarówno": zarowno, "Jesienią": jesien, "kilkakrotnie": kilkakrotnie, "polskiej": polski, "zaledwie": zaledwie, "wypadała": wypadac, "zawarł": zawrzec, "przeciwnikiem": przeciwnik, "przewagę": przewaga }
  - clean: "To właśnie Doroszenko, który w 1669 roku uznał zwierzchnictwo sułtana, ściągnął na Rzeczpospolitą wielką wojnę z Turcją. Turcja uznała prawobrzeżną Ukrainę za swoje lenno i postanowiła wziąć ją siłą. Ukraina stała się polem, na którym ścierały się trzy wielkie potęgi: Rzeczpospolita, Rosja i Turcja. Jej mieszkańcy płacili za to najwyższą cenę. Całe regiony nad Dnieprem opustoszały, a ludność uciekała na lewy brzeg, pod władzę cara, albo ginęła w tatarskiej niewoli."
    draft: true
    chunks:
      - pl: "To właśnie Doroszenko, który w 1669 roku uznał zwierzchnictwo sułtana, ściągnął na Rzeczpospolitą wielką wojnę z Turcją."
        ru: "Именно Дорошенко, признавший в 1669 году верховную власть султана, навлёк на Речь Посполитую большую войну с Турцией."
        note: "ściągnąć — навлечь"
      - pl: " Turcja uznała prawobrzeżną Ukrainę za swoje lenno i postanowiła wziąć ją siłą."
        ru: "Турция признала Правобережную Украину своим леном и решила взять её силой."
      - pl: " Ukraina stała się polem, na którym ścierały się trzy wielkie potęgi: Rzeczpospolita, Rosja i Turcja."
        ru: "Украина стала полем, на котором сталкивались три великие державы: Речь Посполитая, Россия и Турция."
        note: "ścierać się — сталкиваться"
      - pl: " Jej mieszkańcy płacili za to najwyższą cenę."
        ru: "Её жители платили за это высочайшую цену."
      - pl: " Całe regiony nad Dnieprem opustoszały, a ludność uciekała na lewy brzeg, pod władzę cara, albo ginęła w tatarskiej niewoli."
        ru: "Целые области на Днепре опустели, а население бежало на левый берег, под власть царя, или гибло в татарском плену."
    words: { "ściągnął": sciagnac, "potęgi": potega, "mieszkańcy": mieszkaniec, "brzeg": brzeg, "cara": car, "ginęła": ginac }
  - clean: "11 listopada 1673 roku Sobieski zaatakował armię turecką, obozującą pod Chocimiem, w tym samym miejscu, gdzie pięćdziesiąt lat wcześniej bronił się Chodkiewicz. Noc była mroźna i deszczowa, a polscy żołnierze stali całą noc w szyku, podczas gdy Turcy, nieprzyzwyczajeni do takiej pogody, marzli w swoich namiotach. O świcie Sobieski uderzył. Piechota przebiła się przez wały obozu, a za nią wjechała husaria. Armia turecka została rozbita, a tysiące jej żołnierzy utonęło w Dniestrze, kiedy załamał się most. Dzień wcześniej, nie wiedząc jeszcze o zwycięstwie, zmarł we Lwowie król Michał."
    draft: true
    chunks:
      - pl: "11 listopada 1673 roku Sobieski zaatakował armię turecką, obozującą pod Chocimiem, w tym samym miejscu, gdzie pięćdziesiąt lat wcześniej bronił się Chodkiewicz."
        ru: "11 ноября 1673 года Собеский атаковал турецкую армию, стоявшую лагерем под Хотином, — на том самом месте, где пятьдесят лет назад оборонялся Ходкевич."
      - pl: " Noc była mroźna i deszczowa, a polscy żołnierze stali całą noc w szyku, podczas gdy Turcy, nieprzyzwyczajeni do takiej pogody, marzli w swoich namiotach."
        ru: "Ночь была морозной и дождливой, польские солдаты простояли всю ночь в строю, а турки, непривычные к такой погоде, мёрзли в своих шатрах."
        note: "marznąć — мёрзнуть"
      - pl: " O świcie Sobieski uderzył."
        ru: "На рассвете Собеский ударил."
      - pl: " Piechota przebiła się przez wały obozu, a za nią wjechała husaria."
        ru: "Пехота пробилась через валы лагеря, а за ней ворвалась гусария."
      - pl: " Armia turecka została rozbita, a tysiące jej żołnierzy utonęło w Dniestrze, kiedy załamał się most."
        ru: "Турецкая армия была разгромлена, а тысячи её воинов утонули в Днестре, когда рухнул мост."
        note: "załamać się — обрушиться"
      - pl: " Dzień wcześniej, nie wiedząc jeszcze o zwycięstwie, zmarł we Lwowie król Michał."
        ru: "Накануне, ещё не зная о победе, во Львове умер король Михаил."
