  - clean: "Jan III Sobieski zmarł 17 czerwca 1696 roku w Wilanowie. Podobno przed śmiercią powiedział z goryczą, że po jego śmierci wszystko się rozpadnie, bo w Polsce nikt nikogo nie słucha. Jego zwycięstwo pod Wiedniem było ostatnim wielkim triumfem dawnej Rzeczypospolitej na arenie europejskiej. Polacy pamiętają go jako bohatera, który uratował Europę. Na wzgórzu Kahlenberg pod Wiedniem stoi kościół, w którym znajduje się kaplica polska, a pomniki Sobieskiego można zobaczyć między innymi w Gdańsku i w Warszawie. W Wilanowie zaś, w pałacu, który zbudował, wciąż można poczuć atmosferę jego czasów. Ale historycy dodają, że wielkie zwycięstwo przyniosło Rzeczypospolitej mniej korzyści niż Austrii, a pod błyszczącą powierzchnią państwo słabło coraz bardziej."
    draft: true
    chunks:
