  - clean: "Rodzina Sobieskiego rozproszyła się po Europie. Maria Kazimiera wyjechała do Rzymu, a potem wróciła do Francji, gdzie zmarła w 1716 roku. Jego wnuczka, Maria Klementyna Sobieska, poślubiła Jakuba Stuarta, pretendenta do tronu Anglii i Szkocji. Ich syn, Karol Edward Stuart, znany w Szkocji jako „Bonnie Prince Charlie”, poprowadził w 1745 roku ostatnie wielkie powstanie jakobitów. Powstanie zakończyło się klęską pod Culloden, ale Szkoci do dziś pamiętają go jako romantycznego bohatera pieśni i legend. Tak krew zwycięzcy spod Wiednia popłynęła w żyłach szkockich bohaterów."
