  - clean: "Zwycięzca spod Chocimia był naturalnym kandydatem do tronu. W maju 1674 roku szlachta wybrała go na króla jako Jana III. Był drugim, po Michale, Polakiem na tronie od czasów Jagiellonów i pierwszym od dawna, który naprawdę umiał walczyć. Koronacja odbyła się dopiero dwa lata później, bo Sobieski najpierw musiał bronić kraju przed Turkami. W 1676 roku, po ciężkich walkach pod Żórawnem, zawarto rozejm, w którym Polska odzyskała część Ukrainy i zwolniono ją z haraczu, ale Kamieniec i większość Podola pozostały przy Turcji."
    draft: true
    chunks:
      - pl: "Zwycięzca spod Chocimia był naturalnym kandydatem do tronu."
        ru: "Победитель при Хотине был естественным кандидатом на престол."
      - pl: " W maju 1674 roku szlachta wybrała go na króla jako Jana III."
        ru: "В мае 1674 года шляхта избрала его королём как Яна III."
      - pl: " Był drugim, po Michale, Polakiem na tronie od czasów Jagiellonów i pierwszym od dawna, który naprawdę umiał walczyć."
        ru: "Он был вторым после Михаила поляком на престоле со времён Ягеллонов и первым за долгое время, кто действительно умел воевать."
      - pl: " Koronacja odbyła się dopiero dwa lata później, bo Sobieski najpierw musiał bronić kraju przed Turkami."
        ru: "Коронация состоялась лишь через два года, потому что Собескому сначала пришлось защищать страну от турок."
      - pl: " W 1676 roku, po ciężkich walkach pod Żórawnem, zawarto rozejm, w którym Polska odzyskała część Ukrainy i zwolniono ją z haraczu, ale Kamieniec i większość Podola pozostały przy Turcji."
