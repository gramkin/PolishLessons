# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 22
chapterTitle: "Pieśń XXII"
chapterTitleRu: "Песнь XXII. Проделка наваррца"
level: B2
paragraphs:
  - clean: "(Ciąg dalszy. Hulanka szatanów)."
    chunks:
      - pl: "(Ciąg dalszy. Hulanka szatanów)."
        ru: "(Продолжение. Бесовская потеха.)"
        note: "hulanka — гулянка, потеха"
    words: { "Ciąg": ciag, "dalszy": daleki, "szatanów": szatan }
  - clean: "Widziałem jezdne na przeglądach roty,\nSzyk ich łamany, natarcie, odwroty,\nWidziałem w mieście Arezzo przed laty,\nJako rabują podjazdowe czaty,\nWidziałem turniej, gdy na ostre gonią,\nGdy w kolej trąby, to dzwony gomonią,\nStosownie jakie hasła dają z wieży\nDla narodowych i obcych rycerzy."
    verse: true
    chunks:
      - pl: "Widziałem jezdne na przeglądach roty,"
        ru: "Я видел конные отряды на смотрах,"
        note: "jezdny — конный; przegląd — смотр; rota — рота, отряд"
      - pl: "\nSzyk ich łamany, natarcie, odwroty,"
        ru: "их ломаный строй, натиск, отступления,"
      - pl: "\nWidziałem w mieście Arezzo przed laty,"
        ru: "видел в городе Ареццо в былые годы,"
      - pl: "\nJako rabują podjazdowe czaty,"
        ru: "как грабят дозоры в набегах,"
        note: "podjazdowy — набеговый; czaty — дозор"
      - pl: "\nWidziałem turniej, gdy na ostre gonią,"
        ru: "видел турнир, когда сшибаются боевым оружием,"
        note: "gonić na ostre — биться боевым оружием"
      - pl: "\nGdy w kolej trąby, to dzwony gomonią,"
        ru: "когда по очереди трубы, то колокола гудят,"
        note: "gomonić — устар. «гудеть, гомонить»"
      - pl: "\nStosownie jakie hasła dają z wieży"
        ru: "смотря по тому, какие сигналы дают с башни"
      - pl: "\nDla narodowych i obcych rycerzy."
        ru: "для своих и чужих рыцарей."
    words: { "odwroty": odwrot, "turniej": turniej, "gonią": gonic, "dzwony": dzwon, "hasła": haslo, "rycerzy": rycerz }
  - clean: "Lecz nigdy trąba jazdę czy piechotę\nNie poruszała na tak dziką notę,\nNigdy tak sprzeczne tony, tak nieczyste,\nNie brzmiały razem na morzu, na ziemi.\nDziesięć szatanów szło w krok nasz za krokiem,\nO, towarzystwo okropne zaiste!"
    verse: true
    chunks:
      - pl: "Lecz nigdy trąba jazdę czy piechotę"
        ru: "Но никогда труба конницу или пехоту"
        note: "piechota — пехота"
      - pl: "\nNie poruszała na tak dziką notę,"
        ru: "не поднимала на столь дикую ноту,"
      - pl: "\nNigdy tak sprzeczne tony, tak nieczyste,"
        ru: "никогда столь нестройные звуки, столь нечистые,"
      - pl: "\nNie brzmiały razem na morzu, na ziemi."
        ru: "не звучали вместе на море, на земле."
      - pl: "\nDziesięć szatanów szło w krok nasz za krokiem,"
        ru: "Десять бесов шли шаг в шаг за нами,"
      - pl: "\nO, towarzystwo okropne zaiste!"
        ru: "о, общество поистине страшное!"
    words: { "jazdę": jazda, "piechotę": piechota, "poruszała": poruszac, "notę": nota, "morzu": morze, "towarzystwo": towarzystwo }
  - clean: "Ale w kościele jestem ze świętymi,\nW sądzie z jurystą, w garkuchni z żarłokiem.\nJednak badałem to smolne jezioro\nZ całą uwagą i tych, co w nim gorą.\nA jak grające delfiny przed burzą\nSkaczą nad wody i majtkom źle wróżą,\nTak niejednego grzbiet nagi grzesznika\nDla ulgi w bólu nad smolne powierzchnie\nBłyśnie, to na dno błyskawicą pierzchnie;\nA jako w stawie, przy ścieku poników,\nTrzoda żab z wody swe głowy wytyka,\nPodobnie głowy sterczały grzeszników."
    verse: true
    chunks:
      - pl: "Ale w kościele jestem ze świętymi,"
        ru: "Но в церкви — со святыми,"
      - pl: "\nW sądzie z jurystą, w garkuchni z żarłokiem."
        ru: "в суде — с законником, в харчевне — с обжорой."
        note: "jurysta — юрист; garkuchnia — харчевня"
      - pl: "\nJednak badałem to smolne jezioro"
        ru: "Однако я рассматривал это смоляное озеро"
      - pl: "\nZ całą uwagą i tych, co w nim gorą."
        ru: "со всем вниманием и тех, кто в нём горит."
        note: "gorą — горят"
      - pl: "\nA jak grające delfiny przed burzą"
        ru: "И как играющие дельфины перед бурей"
      - pl: "\nSkaczą nad wody i majtkom źle wróżą,"
        ru: "прыгают над водой и сулят беду матросам,"
        note: "majtek — матрос"
      - pl: "\nTak niejednego grzbiet nagi grzesznika"
        ru: "так не одного грешника голая спина"
      - pl: "\nDla ulgi w bólu nad smolne powierzchnie"
        ru: "для облегчения боли над смоляной поверхностью"
      - pl: "\nBłyśnie, to na dno błyskawicą pierzchnie;"
        ru: "блеснёт, то молнией скроется на дно;"
      - pl: "\nA jako w stawie, przy ścieku poników,"
        ru: "и как в пруду, у стока ручьёв,"
        note: "ponik — устар. «ручей»"
      - pl: "\nTrzoda żab z wody swe głowy wytyka,"
        ru: "стая лягушек высовывает головы из воды,"
      - pl: "\nPodobnie głowy sterczały grzeszników."
        ru: "так торчали головы грешников."
    words: { "Skaczą": skakac, "grzbiet": grzbiet, "ulgi": ulga, "stawie": staw, "Trzoda": trzoda, "Podobnie": podobnie }
  - clean: "Lecz Jeżobroda gdy przyszedł, wespoły\nSzybko do wrzącej rzucali się smoły:\nWidziałem, myśląc teraz, czuję dreszcze,\nJeden się spóźnił, nie dał nurka jeszcze,\nJak widzim żabę na cichym wód łonie\nZostaje jedna, kiedy druga tonie."
    verse: true
    chunks:
      - pl: "Lecz Jeżobroda gdy przyszedł, wespoły"
        ru: "Но когда пришёл Ежебород, все разом"
      - pl: "\nSzybko do wrzącej rzucali się smoły:"
        ru: "быстро бросались в кипящую смолу:"
      - pl: "\nWidziałem, myśląc teraz, czuję dreszcze,"
        ru: "я видел — думая сейчас, чувствую дрожь, —"
      - pl: "\nJeden się spóźnił, nie dał nurka jeszcze,"
        ru: "один опоздал, не нырнул ещё,"
      - pl: "\nJak widzim żabę na cichym wód łonie"
        ru: "как мы видим: на тихом лоне вод"
      - pl: "\nZostaje jedna, kiedy druga tonie."
        ru: "остаётся одна лягушка, когда другая ныряет."
    words: { "przyszedł": przyjsc, "rzucali": rzucac, "czuję": czuc, "spóźnił": spoznic, "żabę": zaba, "Zostaje": zostawac }
  - clean: "A Drapigraca stojąc przy nim z bliska,\nZahaczył jego osmolone włosy,\nNa brzeg jak wydrę dobył w okamgnieniu.\nWiedziałem wszystkich szatanów nazwiska,\nBo wybór diabli szedł na żywe głosy,\nI sami siebie zwali po imieniu."
    verse: true
    chunks:
      - pl: "A Drapigraca stojąc przy nim z bliska,"
        ru: "А Царапала, стоя рядом с ним,"
      - pl: "\nZahaczył jego osmolone włosy,"
        ru: "зацепил его просмолённые волосы,"
        note: "osmolony — просмолённый"
      - pl: "\nNa brzeg jak wydrę dobył w okamgnieniu."
        ru: "вытащил на берег, как выдру, в мгновение ока."
        note: "wydra — выдра; okamgnienie — мгновение"
      - pl: "\nWiedziałem wszystkich szatanów nazwiska,"
        ru: "Я знал имена всех бесов,"
        note: "nazwisko — здесь «кличка»"
      - pl: "\nBo wybór diabli szedł na żywe głosy,"
        ru: "ибо выбор у чертей шёл вслух,"
        note: "na żywe głosy — вслух"
      - pl: "\nI sami siebie zwali po imieniu."
        ru: "и сами себя они звали по имени."
    words: { "bliska": bliski, "Zahaczył": zahaczyc, "brzeg": brzeg, "żywe": zywy, "głosy": glos, "zwali": zwac }
  - clean: "Wtem zagrzmiał diabłów krzyk i wrzask straszliwy:\n«Sam, Gniewożarze, twym hakiem grzesznika\nŚciągnij po grzbiecie i drzyj go na łyka!»\nA ja: «Mów, mistrzu, kto ten nieszczęśliwy?\nMój wódz do niego zbliżył się i mówi:\n«Skąd i kto jesteś?» On odrzekł wodzowi:\n«Jam się urodził w królestwie Nawarry."
    verse: true
    chunks:
      - pl: "Wtem zagrzmiał diabłów krzyk i wrzask straszliwy:"
        ru: "Тут грянул крик бесов и страшный вопль:"
      - pl: "\n«Sam, Gniewożarze, twym hakiem grzesznika"
        ru: "«Ну-ка, Гневожар, своим крюком грешника"
      - pl: "\nŚciągnij po grzbiecie i drzyj go na łyka!»"
        ru: "полосни по спине и дери с него лыко!»"
        note: "drzeć na łyka — драть шкуру"
      - pl: "\nA ja: «Mów, mistrzu, kto ten nieszczęśliwy?"
        ru: "А я: «Скажи, учитель, кто этот несчастный?»"
      - pl: "\nMój wódz do niego zbliżył się i mówi:"
        ru: "Мой вождь подошёл к нему и говорит:"
      - pl: "\n«Skąd i kto jesteś?» On odrzekł wodzowi:"
        ru: "«Откуда ты и кто ты?» Тот ответил вождю:"
      - pl: "\n«Jam się urodził w królestwie Nawarry."
        ru: "«Я родился в королевстве Наварра."
    words: { "krzyk": krzyk, "hakiem": hak, "nieszczęśliwy": nieszczesliwy, "wódz": wodz, "zbliżył": zblizyc, "królestwie": krolestwo }
  - clean: "Matka do dworskiej oddała mnie służby;\nOjciec mój strwonił fortunę i zdrowie,\nZ niej ledwo został kęs na życie wdowie.\nWkrótce mnie dworskie oślepiły blaski,\nA dumny z króla Teobalda drużby,\nKryjomie pańskie frymarczyłem łaski;\nZa grzech ten w smolne wrzucono mnie żary»."
    verse: true
    chunks:
      - pl: "Matka do dworskiej oddała mnie służby;"
        ru: "Мать отдала меня на придворную службу;"
      - pl: "\nOjciec mój strwonił fortunę i zdrowie,"
        ru: "отец мой промотал состояние и здоровье,"
        note: "strwonić — промотать"
      - pl: "\nZ niej ledwo został kęs na życie wdowie."
        ru: "от него едва остался кусок хлеба на жизнь вдове."
        note: "kęs — кусок"
      - pl: "\nWkrótce mnie dworskie oślepiły blaski,"
        ru: "Вскоре меня ослепил придворный блеск,"
      - pl: "\nA dumny z króla Teobalda drużby,"
        ru: "и, гордый дружбой короля Тибальда,"
        note: "drużba — устар. «дружба»"
      - pl: "\nKryjomie pańskie frymarczyłem łaski;"
        ru: "я тайком торговал господскими милостями;"
        note: "kryjomie — тайком; frymarczyć — торговать, барышничать"
      - pl: "\nZa grzech ten w smolne wrzucono mnie żary»."
        ru: "за этот грех меня бросили в смоляной жар»."
    words: { "fortunę": fortuna, "ledwo": ledwo, "wdowie": wdowa, "blaski": blask, "grzech": grzech, "wrzucono": wrzucic }
  - clean: "Zęboknur, który jak dzik wkoło pyska\nDwa kły zakrzywia, stojąc tuż przed nami,\nDał jemu uczuć, jak kaleczy kłami.\nLecz mysz trafiła na koty nieuki;\nJuż Jeżobroda potężnie go ściska\nI mówi: «Odejdź, on nam nie uciecze»."
    verse: true
    chunks:
      - pl: "Zęboknur, który jak dzik wkoło pyska"
        ru: "Зуборыл, что, как кабан, вокруг пасти"
      - pl: "\nDwa kły zakrzywia, stojąc tuż przed nami,"
        ru: "загибает два клыка, стоя прямо перед нами,"
      - pl: "\nDał jemu uczuć, jak kaleczy kłami."
        ru: "дал ему почувствовать, как калечат клыками."
      - pl: "\nLecz mysz trafiła na koty nieuki;"
        ru: "Но мышь попалась неучёным котам;"
        note: "nieuk — неуч; у Korsaka: мышь среди злых котов"
      - pl: "\nJuż Jeżobroda potężnie go ściska"
        ru: "уже Ежебород крепко его сжимает"
      - pl: "\nI mówi: «Odejdź, on nam nie uciecze»."
        ru: "и говорит: «Отойди, он от нас не убежит»."
        note: "uciecze — устар. «убежит»"
    words: { "pyska": pysk, "stojąc": stac, "mysz": mysz, "trafiła": trafic, "mówi": mowic, "Odejdź": odejsc }
  - clean: "A obrócony do wodza, tak rzecze:\n«Pytaj go, jeśli co chcesz wiedzieć jeszcze,\nJa między nogi wziąłem go jak w kleszcze.\nNiech mówi, nim go rezerwą na sztuki».\nA wódz: «Mów, duchu, czy tu, w waszym kole\nJaki Łacinnik warzy się w tej smole?»"
    verse: true
    chunks:
      - pl: "A obrócony do wodza, tak rzecze:"
        ru: "И, обратившись к вождю, так говорит:"
      - pl: "\n«Pytaj go, jeśli co chcesz wiedzieć jeszcze,"
        ru: "«Спрашивай его, если ещё что-нибудь хочешь знать,"
      - pl: "\nJa między nogi wziąłem go jak w kleszcze."
        ru: "я взял его между ног, как в клещи."
        note: "kleszcze — клещи"
      - pl: "\nNiech mówi, nim go rezerwą na sztuki»."
        ru: "Пусть говорит, пока мы не разорвали его на куски»."
        note: "rezerwą — тёмное место у Korsaka; na sztuki — на куски"
      - pl: "\nA wódz: «Mów, duchu, czy tu, w waszym kole"
        ru: "А вождь: «Скажи, дух, нет ли здесь, в вашем кругу,"
      - pl: "\nJaki Łacinnik warzy się w tej smole?»"
        ru: "какого-нибудь латинянина, что варится в этой смоле?»"
        note: "Łacinnik — италиец"
    words: { "obrócony": obrocic, "rzecze": rzec, "Pytaj": pytac, "nogi": noga, "duchu": duch, "kole": kolo }
  - clean: "A on: «Niedawno rozstałem się z jednym,\nGdybym z nim skrył się, zwyczajem powszednim\nOd tych by haków zakryła mnie smoła».\n— «Dość cierpliwości,» tu Ostrohak woła\nI widłą jego zahaczył o ramię,\nAż kość ramienną hak na druzgi łamie."
    verse: true
    chunks:
      - pl: "A on: «Niedawno rozstałem się z jednym,"
        ru: "А он: «Недавно я расстался с одним,"
      - pl: "\nGdybym z nim skrył się, zwyczajem powszednim"
        ru: "если бы я с ним спрятался, по обычной привычке,"
        note: "powszedni — обычный"
      - pl: "\nOd tych by haków zakryła mnie smoła»."
        ru: "от этих крюков меня укрыла бы смола»."
      - pl: "\n— «Dość cierpliwości,» tu Ostrohak woła"
        ru: "— «Довольно терпения», — тут Острокрюк кричит"
      - pl: "\nI widłą jego zahaczył o ramię,"
        ru: "и вилами зацепил его за плечо,"
      - pl: "\nAż kość ramienną hak na druzgi łamie."
        ru: "так что крюк ломает плечевую кость в щепки."
        note: "druzgi — щепки"
    words: { "Niedawno": niedawno, "rozstałem": rozstac, "zwyczajem": zwyczaj, "cierpliwości": cierpliwosc, "woła": wolac, "łamie": lamac }
  - clean: "Chciał Drapigraca schwycić go za nogę,\nLecz na spojrzenie srogie dekuriona\nOrszak dziewięciu uderzył na trwogę.\nGdy ścichła trochę gawiedź rozjuszona,\nMój wódz znów ducha kalekiego pyta:\n«Kto jest ten, który ciebie rzucił w chwili,\nGdyśmy przy brzegu twą postać zoczyli?»"
    verse: true
    chunks:
      - pl: "Chciał Drapigraca schwycić go za nogę,"
        ru: "Царапала хотел схватить его за ногу,"
      - pl: "\nLecz na spojrzenie srogie dekuriona"
        ru: "но при суровом взгляде десятника"
        note: "dekurion — десятник"
      - pl: "\nOrszak dziewięciu uderzył na trwogę."
        ru: "свита девятерых ударила отбой."
        note: "uderzyć na trwogę — здесь «остановиться»"
      - pl: "\nGdy ścichła trochę gawiedź rozjuszona,"
        ru: "Когда немного утихла разъярённая чернь,"
        note: "gawiedź — чернь, толпа; rozjuszony — разъярённый"
      - pl: "\nMój wódz znów ducha kalekiego pyta:"
        ru: "мой вождь снова спрашивает искалеченного духа:"
        note: "kaleki — искалеченный"
      - pl: "\n«Kto jest ten, który ciebie rzucił w chwili,"
        ru: "«Кто тот, кого ты покинул в тот миг,"
      - pl: "\nGdyśmy przy brzegu twą postać zoczyli?»"
        ru: "когда мы у берега заметили тебя?»"
    words: { "Chciał": chciec, "uderzył": uderzyc, "rzucił": rzucic, "chwili": chwila, "postać": postac }
  - clean: "On odpowiedział: «Jest to mnich Gomita,\nRządca Gallury, urna zabrukana;\nMając w swym ręku wrogów swego pana,\nTych puszcza, drugich do więzienia sadzi,\nW sposób, że z niego wszyscy byli radzi;\nWielu dał wolność, ale brał ich złoto,\nJak sam powiadał, i różną niecnotą\nW różnych urzędach brukał się wiek cały,\nNiemierny, był to szalbierz doskonały."
    verse: true
    chunks:
      - pl: "On odpowiedział: «Jest to mnich Gomita,"
        ru: "Он ответил: «Это монах Гомита,"
      - pl: "\nRządca Gallury, urna zabrukana;"
        ru: "правитель Галлуры, сосуд нечистый;"
        note: "rządca — правитель; urna — сосуд"
      - pl: "\nMając w swym ręku wrogów swego pana,"
        ru: "имея в своих руках врагов своего господина,"
      - pl: "\nTych puszcza, drugich do więzienia sadzi,"
        ru: "одних отпускает, других сажает в темницу,"
      - pl: "\nW sposób, że z niego wszyscy byli radzi;"
        ru: "так что все были им довольны;"
      - pl: "\nWielu dał wolność, ale brał ich złoto,"
        ru: "многим дал свободу, но брал их золото,"
      - pl: "\nJak sam powiadał, i różną niecnotą"
        ru: "как сам говорил, и разным бесчестьем"
        note: "niecnota — бесчестье"
      - pl: "\nW różnych urzędach brukał się wiek cały,"
        ru: "в разных должностях пачкался весь век,"
      - pl: "\nNiemierny, był to szalbierz doskonały."
        ru: "неумеренный, это был совершенный мошенник."
        note: "niemierny — неумеренный; szalbierz — мошенник"
