# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 2
chapterTitle: "Pieśń II"
chapterTitleRu: "Песнь II. Пятна на Луне"
level: B2
paragraphs:
  - clean: "(I. oddział, siedem kół planetowych. Na Księżycu. Koniec pouczenia o wszechświecie (o plamach na Księżycu))"
    chunks:
      - pl: "(I. oddział, siedem kół planetowych. Na Księżycu. Koniec pouczenia o wszechświecie (o plamach na Księżycu))"
        ru: "(I отдел, семь планетных кругов. На Луне. Окончание поучения о вселенной (о пятнах на Луне).)"
        note: "planetowy — планетный"
    words: { "oddział": oddzial, "Księżycu": ksiezyc, "Koniec": koniec, "wszechświecie": wszechswiat, "plamach": plama }
  - clean: "Tłumie, coś płynął słuchać mnie ciekawy\nŁódką w ślad mojej śpiewającej nawy,\nZawracaj wiosłem w brzegi za pogody,\nNie tobie za mną żeglować przez morze,\nTracąc mnie z oczu zabłądziłbyś może.\nJa płynę dotąd w nieżeglowne wody,\nŻagiel mój tchnienie rozdyma Minerwy,\nApollo ster mój, grono Muz dziewięciu\nGwiazdą niedźwiedzic wzrok żeglarza nęci."
    verse: true
    chunks:
      - pl: "Tłumie, coś płynął słuchać mnie ciekawy"
        ru: "Толпа, что плыла, любопытная меня слушать,"
      - pl: "\nŁódką w ślad mojej śpiewającej nawy,"
        ru: "в лодке по следу моего поющего корабля,"
        note: "nawa — корабль"
      - pl: "\nZawracaj wiosłem w brzegi za pogody,"
        ru: "поворачивай веслом к берегам, пока ясно,"
      - pl: "\nNie tobie za mną żeglować przez morze,"
        ru: "не тебе плыть за мной по морю,"
      - pl: "\nTracąc mnie z oczu zabłądziłbyś może."
        ru: "потеряв меня из виду, ты, может быть, заблудишься."
      - pl: "\nJa płynę dotąd w nieżeglowne wody,"
        ru: "Я плыву по водам, по которым ещё не плавали,"
        note: "nieżeglowny — несудоходный"
      - pl: "\nŻagiel mój tchnienie rozdyma Minerwy,"
        ru: "мой парус надувает дыхание Минервы,"
      - pl: "\nApollo ster mój, grono Muz dziewięciu"
        ru: "Аполлон — мой руль, круг девяти Муз"
      - pl: "\nGwiazdą niedźwiedzic wzrok żeglarza nęci."
        ru: "звездой Медведиц манит взгляд мореплавателя."
    words: { "Łódką": lodka, "Zawracaj": zawracac, "brzegi": brzeg, "żeglować": zeglowac, "ster": ster, "grono": grono }
  - clean: "Ty mała garstko! Co wcześnie bez przerwy\nPo chleb aniołów wyciągałaś szyję,\nChleb, jakim człowiek tu z dnia na dzień żyje,\nLecz którym nigdy nie może być sytym,\nOkręt twój śmiało pod żaglem rozwitym\nW ślad moją bruzdą niech się szybko śliźnie,\nNim wiatr ją zmiecie na wodnej płaszczyźnie."
    verse: true
    chunks:
      - pl: "Ty mała garstko! Co wcześnie bez przerwy"
        ru: "Ты, малая горстка! что рано, без перерыва,"
        note: "garstka — горстка"
      - pl: "\nPo chleb aniołów wyciągałaś szyję,"
        ru: "тянула шею за хлебом ангелов,"
        note: "знание, богословие"
      - pl: "\nChleb, jakim człowiek tu z dnia na dzień żyje,"
        ru: "хлебом, которым человек здесь живёт изо дня в день,"
      - pl: "\nLecz którym nigdy nie może być sytym,"
        ru: "но которым никогда не может быть сыт,"
      - pl: "\nOkręt twój śmiało pod żaglem rozwitym"
        ru: "пусть твой корабль смело под развёрнутым парусом"
      - pl: "\nW ślad moją bruzdą niech się szybko śliźnie,"
        ru: "быстро скользит по моей борозде,"
      - pl: "\nNim wiatr ją zmiecie na wodnej płaszczyźnie."
        ru: "пока ветер не сметёт её на водной глади."
    words: { "garstko": garstka, "chleb": chleb, "wyciągałaś": wyciagac, "szyję": szyja, "Okręt": okret, "wodnej": wodny }
  - clean: "Co zobaczycie, dziwniejszym się wyda\nNiż Argonautom zamorska Kolchida,\nGdzie się dziwili pierwsze wędrowniki,\nWidząc Jazona, jak w pług wprzęgał byki.\nWieczne pragnienie współ z duszą stworzone.\nW królestwo duchów wejść błogosławione,\nSzybko nas niosło coraz wyżej, wyżej,\nJak widzim z nieba ziemi obrót chyży."
    verse: true
    chunks:
      - pl: "Co zobaczycie, dziwniejszym się wyda"
        ru: "То, что вы увидите, покажется удивительнее,"
      - pl: "\nNiż Argonautom zamorska Kolchida,"
        ru: "чем аргонавтам заморская Колхида,"
      - pl: "\nGdzie się dziwili pierwsze wędrowniki,"
        ru: "где дивились первые путники,"
      - pl: "\nWidząc Jazona, jak w pług wprzęgał byki."
        ru: "видя Ясона, как он впрягал быков в плуг."
      - pl: "\nWieczne pragnienie współ z duszą stworzone."
        ru: "Вечная жажда, сотворённая вместе с душой, —"
      - pl: "\nW królestwo duchów wejść błogosławione,"
        ru: "войти в благословенное царство духов —"
      - pl: "\nSzybko nas niosło coraz wyżej, wyżej,"
        ru: "быстро несла нас всё выше, выше,"
      - pl: "\nJak widzim z nieba ziemi obrót chyży."
        ru: "как мы видим с неба быстрый оборот земли."
        note: "у Данте — как небо вращается"
    words: { "byki": byk, "Wieczne": wieczny, "pragnienie": pragnienie, "błogosławione": blogoslawic, "niosło": niesc, "obrót": obrot }
  - clean: "A Beatrycze wciąż w górę patrzyła,\nJam patrzył na nią; jak złożona strzała\nNa łuku z węzła zrywa się i leci,\nTak szybko byłem w tym miejscu, gdzie świeci\nCudowna światłość, której blask uroczy\nOd Beatrycze oderwał me oczy."
    verse: true
    chunks:
      - pl: "A Beatrycze wciąż w górę patrzyła,"
        ru: "А Беатриче всё смотрела вверх,"
      - pl: "\nJam patrzył na nią; jak złożona strzała"
        ru: "я смотрел на неё; как наложенная стрела"
      - pl: "\nNa łuku z węzła zrywa się i leci,"
        ru: "на луке срывается с узла и летит,"
      - pl: "\nTak szybko byłem w tym miejscu, gdzie świeci"
        ru: "так быстро я был в том месте, где светит"
      - pl: "\nCudowna światłość, której blask uroczy"
        ru: "чудесный свет, чей прелестный блеск"
      - pl: "\nOd Beatrycze oderwał me oczy."
        ru: "оторвал мои глаза от Беатриче."
    words: { "złożona": zlozyc, "strzała": strzala, "łuku": luk, "węzła": wezel, "Cudowna": cudowny, "blask": blask }
  - clean: "Ona, co w głębi mego serca czyta,\nZwrócona do mnie, tak piękna, jak miła,\nZe zwykłym słów swych wdziękiem i urokiem\n«Wznieś wdzięczną duszę do Boga» mówiła:\n«Przez Niego nas tu pierwsza gwiazda wita».\nByliśmy, zda się, przykryci obłokiem\nLśniącym i twardym, grał blasków tysiącem,\nJak dyjamentu szlif rażony słońcem."
    verse: true
    chunks:
      - pl: "Ona, co w głębi mego serca czyta,"
        ru: "Она, что читает в глубине моего сердца,"
      - pl: "\nZwrócona do mnie, tak piękna, jak miła,"
        ru: "обратившись ко мне, столь же прекрасная, как милая,"
      - pl: "\nZe zwykłym słów swych wdziękiem i urokiem"
        ru: "с обычной прелестью и очарованием своих слов"
      - pl: "\n«Wznieś wdzięczną duszę do Boga» mówiła:"
        ru: "«Вознеси благодарную душу к Богу, — сказала, —"
      - pl: "\n«Przez Niego nas tu pierwsza gwiazda wita»."
        ru: "через Него нас здесь приветствует первая звезда»."
        note: "Луна"
      - pl: "\nByliśmy, zda się, przykryci obłokiem"
        ru: "Мы были, казалось, покрыты облаком,"
      - pl: "\nLśniącym i twardym, grał blasków tysiącem,"
        ru: "блестящим и твёрдым, оно играло тысячей блесков,"
      - pl: "\nJak dyjamentu szlif rażony słońcem."
        ru: "как грань алмаза, поражённая солнцем."
        note: "szlif — грань"
    words: { "głębi": glab, "urokiem": urok, "Wznieś": wzniesc, "wdzięczną": wdzieczny, "przykryci": przykryc, "twardym": twardy }
  - clean: "Ta wieczna perła świecąca na niebie\nBlaskiem niezmierzchłym przyjęła nas w siebie\nJak woda, która do swojego łona\nPrzyjmuje promień, cała i złączona.\nKtóż pojmie z ludzi, że ja będąc ciałem,\nDrugie sam sobą ciało przenikałem,\nMający ciała rozciągłość i miarę?"
    verse: true
    chunks:
      - pl: "Ta wieczna perła świecąca na niebie"
        ru: "Эта вечная жемчужина, сияющая на небе"
      - pl: "\nBlaskiem niezmierzchłym przyjęła nas w siebie"
        ru: "неугасающим блеском, приняла нас в себя,"
        note: "niezmierzchły — неугасающий"
      - pl: "\nJak woda, która do swojego łona"
        ru: "как вода, что в своё лоно"
      - pl: "\nPrzyjmuje promień, cała i złączona."
        ru: "принимает луч, оставаясь целой и сомкнутой."
      - pl: "\nKtóż pojmie z ludzi, że ja będąc ciałem,"
        ru: "Кто из людей поймёт, что я, будучи телом,"
      - pl: "\nDrugie sam sobą ciało przenikałem,"
        ru: "сам собой проникал другое тело,"
      - pl: "\nMający ciała rozciągłość i miarę?"
        ru: "имея протяжённость и меру тела?"
        note: "rozciągłość — протяжённость"
    words: { "świecąca": swiecic, "niebie": niebo, "Przyjmuje": przyjmowac, "promień": promien, "pojmie": pojac, "miarę": miara }
  - clean: "Jaką czuć w sobie winniśmy tęsknotę,\nAby oglądać tę arcyistotę,\nW której dopatrzym w zachwyceniu błogim,\nJak się natura nasza łączy z Bogiem.\nTam się objawi, w co wierzym przez wiarę,\nI bez dowodu samo cię uderzy,\nJak pierwsza wiara, w jaką człowiek wierzy."
    verse: true
    chunks:
      - pl: "Jaką czuć w sobie winniśmy tęsknotę,"
        ru: "Какую тоску мы должны чувствовать в себе,"
      - pl: "\nAby oglądać tę arcyistotę,"
        ru: "чтобы увидеть то высшее существо,"
      - pl: "\nW której dopatrzym w zachwyceniu błogim,"
        ru: "в котором мы в блаженном восторге разглядим,"
      - pl: "\nJak się natura nasza łączy z Bogiem."
        ru: "как наша природа соединяется с Богом."
      - pl: "\nTam się objawi, w co wierzym przez wiarę,"
        ru: "Там откроется то, во что мы верим верой,"
      - pl: "\nI bez dowodu samo cię uderzy,"
        ru: "и без доказательства само поразит тебя,"
      - pl: "\nJak pierwsza wiara, w jaką człowiek wierzy."
        ru: "как первая истина, в которую верит человек."
        note: "аксиома"
    words: { "oglądać": ogladac, "zachwyceniu": zachwycic, "natura": natura, "łączy": laczyc, "wiarę": wiara, "uderzy": uderzyc }
  - clean: "Odpowiedziałem: — «Pani! Ile może\nWdzięcznym być człowiek, dziękuję w pokorze\nTemu, co wzniósł mnie nad padoły ziemne.\nLecz powiedz, jakie są te plamy ciemne\nNa księżycowym ciele, a skąd w gminie\nTysiące bajek krąży o Kainie»."
    verse: true
    chunks:
      - pl: "Odpowiedziałem: — «Pani! Ile może"
        ru: "Я ответил: — «Госпожа! Насколько может"
      - pl: "\nWdzięcznym być człowiek, dziękuję w pokorze"
        ru: "человек быть благодарным, благодарю смиренно"
      - pl: "\nTemu, co wzniósł mnie nad padoły ziemne."
        ru: "Того, кто вознёс меня над земными долами."
      - pl: "\nLecz powiedz, jakie są te plamy ciemne"
        ru: "Но скажи, что это за тёмные пятна"
      - pl: "\nNa księżycowym ciele, a skąd w gminie"
        ru: "на лунном теле, откуда в простонародье"
        note: "gmin — простонародье"
      - pl: "\nTysiące bajek krąży o Kainie»."
        ru: "кружат тысячи басен о Каине?»"
    words: { "Odpowiedziałem": odpowiedziec, "jakie": jaki, "ciemne": ciemny, "księżycowym": ksiezycowy, "bajek": bajka, "krąży": krazyc }
  - clean: "Ona uśmiechem na chwilę powlekła\nUrocze lica, a potem tak rzekła:\n— «Jeśli sąd ludzki błądzi na rozdroże,\nTam gdzie klucz zmysłów otworzyć nie może,\nZaiste, odtąd, rzecz tę widząc jaśniej,\nStrzała podziwu ciebie nie zadraśnie;\nGdy w zmysłach sądu szukacie prawidła,\nWidzisz, twój rozum jak ma krótkie skrzydła!"
    verse: true
    chunks:
      - pl: "Ona uśmiechem na chwilę powlekła"
        ru: "Она на миг подёрнула улыбкой"
      - pl: "\nUrocze lica, a potem tak rzekła:"
        ru: "прелестное лицо, а потом так сказала:"
      - pl: "\n— «Jeśli sąd ludzki błądzi na rozdroże,"
        ru: "— «Если человеческое суждение блуждает на распутье"
      - pl: "\nTam gdzie klucz zmysłów otworzyć nie może,"
        ru: "там, где ключ чувств не может открыть,"
      - pl: "\nZaiste, odtąd, rzecz tę widząc jaśniej,"
        ru: "воистину, отныне, видя эту вещь яснее,"
      - pl: "\nStrzała podziwu ciebie nie zadraśnie;"
        ru: "стрела удивления тебя не заденет;"
      - pl: "\nGdy w zmysłach sądu szukacie prawidła,"
        ru: "раз в чувствах вы ищете правило суждения,"
      - pl: "\nWidzisz, twój rozum jak ma krótkie skrzydła!"
        ru: "видишь, какие короткие крылья у твоего разума!"
    words: { "uśmiechem": usmiech, "rzekła": rzec, "zmysłów": zmysl, "odtąd": odtad, "rozum": rozum, "skrzydła": skrzydlo }
  - clean: "Lecz mów, co o tym myślisz sam przez siebie?»\n— «Ta rozmaitość» rzekłem: «form na niebie,\nWierzę, z ciał ciekłych i zsiadłych pochodzi».\nOna: — «Wierzenie twoje w fałszu brodzi,\nCo sam rad ujrzysz; gdy z uwagą ducha\nNa mój przeczący wywód skłonisz ucha."
    verse: true
    chunks:
      - pl: "Lecz mów, co o tym myślisz sam przez siebie?»"
        ru: "Но скажи, что ты думаешь об этом сам?»"
      - pl: "\n— «Ta rozmaitość» rzekłem: «form na niebie,"
        ru: "— «Это разнообразие, — сказал я, — форм на небе,"
      - pl: "\nWierzę, z ciał ciekłych i zsiadłych pochodzi»."
        ru: "верю, происходит от тел редких и плотных»."
        note: "ciekły — жидкий, здесь «редкий»; zsiadły — плотный"
      - pl: "\nOna: — «Wierzenie twoje w fałszu brodzi,"
        ru: "Она: — «Твоё мнение бредёт во лжи,"
      - pl: "\nCo sam rad ujrzysz; gdy z uwagą ducha"
        ru: "что ты сам охотно увидишь, если со вниманием духа"
      - pl: "\nNa mój przeczący wywód skłonisz ucha."
        ru: "склонишь ухо к моему опровергающему доводу."
        note: "przeczący — опровергающий"
    words: { "form": forma, "pochodzi": pochodzic, "ujrzysz": ujrzec, "uwagą": uwaga, "ducha": duch, "przeczący": przeczyc }
  - clean: "Na ósmej sferze gwiazd naliczysz sporo,\nIlość i jakość światła, jakim gorą,\nKaże nam wnosić, że są różnolice.\nGdy ciała ciekłe i zsiadłe różnice\nWszystkich form tworzą, w tych by gwiazdach była\nRówna lub różna, jednak jedna siła."
    verse: true
    chunks:
      - pl: "Na ósmej sferze gwiazd naliczysz sporo,"
        ru: "На восьмой сфере ты насчитаешь немало звёзд,"
      - pl: "\nIlość i jakość światła, jakim gorą,"
        ru: "количество и качество света, каким они горят,"
      - pl: "\nKaże nam wnosić, że są różnolice."
        ru: "заставляет нас заключить, что они разнолики."
      - pl: "\nGdy ciała ciekłe i zsiadłe różnice"
        ru: "Если бы тела редкие и плотные создавали"
      - pl: "\nWszystkich form tworzą, w tych by gwiazdach była"
        ru: "различия всех форм, в этих звёздах была бы"
      - pl: "\nRówna lub różna, jednak jedna siła."
        ru: "равная или различная, однако одна сила."
    words: { "Ilość": ilosc, "jakość": jakosc, "różnice": roznica, "tworzą": tworzyc, "Równa": rowny, "różna": rozny }
  - clean: "Gdy różne siły powinny być w owych\nCiałach owocem ich zasad formowych;\nTwierdzenie twoje, jako miecz zagłady\nPrócz jednej niszczy wszystkie te zasady.\nNadto, jeśliby rozrzedzone ciało\nSamo te ciemne plamy formowało\nWtedy planeta z tej lub owej strony\nZe swojej treści byłby pozbawiony,\nAlbo wciąż łudząc twoich oczu wartę,\nZmieniałby ciągle swojej księgi kartę;"
    verse: true
    chunks:
      - pl: "Gdy różne siły powinny być w owych"
        ru: "Тогда как в этих телах должны быть различные силы —"
      - pl: "\nCiałach owocem ich zasad formowych;"
        ru: "плод их формирующих начал;"
      - pl: "\nTwierdzenie twoje, jako miecz zagłady"
        ru: "твоё утверждение, как меч уничтожения,"
      - pl: "\nPrócz jednej niszczy wszystkie te zasady."
        ru: "кроме одного, уничтожает все эти начала."
      - pl: "\nNadto, jeśliby rozrzedzone ciało"
        ru: "Кроме того, если бы разреженное тело"
      - pl: "\nSamo te ciemne plamy formowało"
        ru: "само образовывало эти тёмные пятна,"
      - pl: "\nWtedy planeta z tej lub owej strony"
        ru: "тогда планета с той или другой стороны"
      - pl: "\nZe swojej treści byłby pozbawiony,"
        ru: "была бы лишена своей сути,"
      - pl: "\nAlbo wciąż łudząc twoich oczu wartę,"
        ru: "или, всё обманывая стражу твоих глаз,"
