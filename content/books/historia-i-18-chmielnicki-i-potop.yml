  - clean: "Chmielnicki rozumiał, że sam nie zdoła obronić się przed Rzecząpospolitą, a chanowi nie można ufać. Szukał opiekuna wśród potężnych sąsiadów: w Turcji, w Szwecji, a przede wszystkim w Moskwie, która była prawosławna. W styczniu 1654 roku w Perejasławiu rada kozacka pod przewodnictwem Chmielnickiego złożyła przysięgę wierności carowi Aleksemu Michajłowiczowi. Ugodę perejasławską do dziś interpretuje się różnie. W rosyjskiej tradycji przedstawiano ją jako zjednoczenie Ukrainy z Rosją, a w ukraińskiej najczęściej jako sojusz wojskowy i protektorat, który car później złamał, ograniczając autonomię Hetmanatu. Dla Rzeczypospolitej był to początek nowej, ciężkiej wojny z Moskwą."
    draft: true
    chunks:
      - pl: "Chmielnicki rozumiał, że sam nie zdoła obronić się przed Rzecząpospolitą, a chanowi nie można ufać."
        ru: "Хмельницкий понимал, что сам не сможет защититься от Речи Посполитой, а хану доверять нельзя."
      - pl: " Szukał opiekuna wśród potężnych sąsiadów: w Turcji, w Szwecji, a przede wszystkim w Moskwie, która była prawosławna."
        ru: "Он искал покровителя среди могущественных соседей — в Турции, в Швеции, а прежде всего в Москве, которая была православной."
