chapter: 18
chapterTitle: "Chmielnicki i potop"
chapterTitleRu: "Хмельницкий и Потоп"
level: B2
paragraphs:
  - clean: "Bohdan Chmielnicki był człowiekiem doświadczonym i wykształconym. Uczył się w kolegium jezuickim, znał łacinę i polski, walczył pod Cecorą i był dwa lata w niewoli tureckiej. Był pisarzem wojska zaporoskiego, a potem setnikiem w Czehrynie, i miał tam swój chutor, czyli majątek, Subotów. Sam niczym nie zapowiadał buntownika. Wszystko zmieniła osobista krzywda."
    draft: true
    chunks:
      - pl: "Bohdan Chmielnicki był człowiekiem doświadczonym i wykształconym."
        ru: "Богдан Хмельницкий был человеком опытным и образованным."
      - pl: " Uczył się w kolegium jezuickim, znał łacinę i polski, walczył pod Cecorą i był dwa lata w niewoli tureckiej."
        ru: "Он учился в иезуитской коллегии, знал латынь и польский, воевал под Цецорой и два года провёл в турецком плену."
      - pl: " Był pisarzem wojska zaporoskiego, a potem setnikiem w Czehrynie, i miał tam swój chutor, czyli majątek, Subotów."
        ru: "Он был писарем Войска Запорожского, затем сотником в Чигирине, и у него там был свой хутор, то есть имение, Суботов."
        note: "chutor — хутор; pisarz — здесь «войсковой писарь»"
      - pl: " Sam niczym nie zapowiadał buntownika."
        ru: "Сам он ничем не предвещал бунтаря."
      - pl: " Wszystko zmieniła osobista krzywda."
        ru: "Всё изменила личная обида."
        note: "krzywda — обида, несправедливость"
    words: { "wykształconym": wyksztalcic, "polski": polski, "pisarzem": pisarz, "wojska": wojsko, "majątek": majatek, "krzywda": krzywda }
  - clean: "Podstarości czehryński Daniel Czapliński, korzystając z poparcia możnego pana, najechał Subotów, zagarnął majątek i porwał kobietę, z którą Chmielnicki żył. Według kozackich kronik jego ludzie dotkliwie pobili też syna Chmielnickiego. Chmielnicki szukał sprawiedliwości w sądzie, w senacie, a nawet u samego króla. Wszędzie odpowiadano mu, że nie ma dokumentów na swoją własność. Podobno król Władysław IV powiedział mu, że Kozacy mają przecież szable. Na początku 1648 roku Chmielnicki uciekł na Zaporoże, gdzie Kozacy obwołali go hetmanem. Zawarł też sojusz z chanem krymskim, wrogiem Rzeczypospolitej, który przysłał mu na pomoc tysiące jeźdźców."
    draft: true
    chunks:
      - pl: "Podstarości czehryński Daniel Czapliński, korzystając z poparcia możnego pana, najechał Subotów, zagarnął majątek i porwał kobietę, z którą Chmielnicki żył."
        ru: "Чигиринский подстароста Даниэль Чаплинский, пользуясь поддержкой влиятельного господина, напал на Суботов, захватил имение и похитил женщину, с которой жил Хмельницкий."
        note: "podstarości — подстароста"
      - pl: " Według kozackich kronik jego ludzie dotkliwie pobili też syna Chmielnickiego."
        ru: "По казацким летописям, его люди жестоко избили и сына Хмельницкого."
        note: "dotkliwie — жестоко, больно"
      - pl: " Chmielnicki szukał sprawiedliwości w sądzie, w senacie, a nawet u samego króla."
        ru: "Хмельницкий искал справедливости в суде, в сенате и даже у самого короля."
      - pl: " Wszędzie odpowiadano mu, że nie ma dokumentów na swoją własność."
        ru: "Везде ему отвечали, что у него нет документов на собственность."
      - pl: " Podobno król Władysław IV powiedział mu, że Kozacy mają przecież szable."
        ru: "Говорят, король Владислав IV сказал ему, что у казаков ведь есть сабли."
        note: "szabla — сабля"
      - pl: " Na początku 1648 roku Chmielnicki uciekł na Zaporoże, gdzie Kozacy obwołali go hetmanem."
        ru: "В начале 1648 года Хмельницкий бежал на Запорожье, где казаки провозгласили его гетманом."
        note: "obwołać — провозгласить"
      - pl: " Zawarł też sojusz z chanem krymskim, wrogiem Rzeczypospolitej, który przysłał mu na pomoc tysiące jeźdźców."
        ru: "Он заключил также союз с крымским ханом, врагом Речи Посполитой, который прислал ему на помощь тысячи всадников."
    words: { "majątek": majatek, "korzystając": korzystac, "pobili": pobic, "senacie": senat, "własność": wlasnosc, "Zawarł": zawrzec, "sojusz": sojusz, "jeźdźców": jezdziec }
  - clean: "Wiosną 1648 roku armia kozacko-tatarska rozbiła wojska koronne najpierw nad Żółtymi Wodami, a potem pod Korsuniem. Obaj hetmani koronni, wielki i polny, dostali się do niewoli tatarskiej. W tym samym czasie zmarł król Władysław IV i Rzeczpospolita została bez króla i bez armii. Wieść o zwycięstwach Kozaków rozeszła się po całej Ukrainie. Powstali chłopi, mieszczanie, drobna szlachta prawosławna. Bunt kozacki przerodził się w wielkie powstanie ludowe."
    draft: true
    chunks:
      - pl: "Wiosną 1648 roku armia kozacko-tatarska rozbiła wojska koronne najpierw nad Żółtymi Wodami, a potem pod Korsuniem."
        ru: "Весной 1648 года казацко-татарское войско разбило коронные войска сначала у Жёлтых Вод, а потом под Корсунем."
      - pl: " Obaj hetmani koronni, wielki i polny, dostali się do niewoli tatarskiej."
        ru: "Оба коронных гетмана, великий и польный, попали в татарский плен."
        note: "hetman polny — польный гетман, заместитель великого"
      - pl: " W tym samym czasie zmarł król Władysław IV i Rzeczpospolita została bez króla i bez armii."
        ru: "В это же время умер король Владислав IV, и Речь Посполитая осталась без короля и без армии."
      - pl: " Wieść o zwycięstwach Kozaków rozeszła się po całej Ukrainie."
        ru: "Весть о победах казаков разнеслась по всей Украине."
      - pl: " Powstali chłopi, mieszczanie, drobna szlachta prawosławna."
        ru: "Восстали крестьяне, горожане, мелкая православная шляхта."
      - pl: " Bunt kozacki przerodził się w wielkie powstanie ludowe."
        ru: "Казацкий бунт перерос в великое народное восстание."
        note: "przerodzić się — перерасти"
    words: { "wojska": wojsko, "Wiosną": wiosna, "rozbiła": rozbic, "zwycięstwach": zwyciestwo, "rozeszła": rozejsc, "Powstali": powstac, "chłopi": chlop, "Bunt": bunt }
  - clean: "Powstanie było niezwykle okrutne. Mordowano szlachtę, księży katolickich i unickich, a szczególnie Żydów, którzy dla chłopów byli symbolem znienawidzonej władzy panów, bo często dzierżawili od nich karczmy, młyny i cła. Zginęło wiele tysięcy Żydów: historycy szacują ich liczbę bardzo różnie, od kilkunastu do kilkudziesięciu tysięcy. W żydowskiej pamięci lata 1648–1649 pozostały jedną z największych katastrof przed Zagładą. Odpowiedź strony polskiej była równie brutalna. Książę Jeremi Wiśniowiecki, największy magnat zadnieprzański, palił zbuntowane wsie i kazał wbijać powstańców na pale. Wojna stała się pasmem wzajemnych okrucieństw, które na długo zatruły stosunki między Polakami a Ukraińcami."
    draft: true
    chunks:
      - pl: "Powstanie było niezwykle okrutne."
        ru: "Восстание было необычайно жестоким."
      - pl: " Mordowano szlachtę, księży katolickich i unickich, a szczególnie Żydów, którzy dla chłopów byli symbolem znienawidzonej władzy panów, bo często dzierżawili od nich karczmy, młyny i cła."
        ru: "Убивали шляхту, католических и униатских священников, а особенно евреев, которые для крестьян были символом ненавистной панской власти, поскольку часто арендовали у панов корчмы, мельницы и пошлины."
        note: "dzierżawić — арендовать"
      - pl: " Zginęło wiele tysięcy Żydów: historycy szacują ich liczbę bardzo różnie, od kilkunastu do kilkudziesięciu tysięcy."
        ru: "Погибли многие тысячи евреев: историки оценивают их число очень по-разному — от полутора десятков до нескольких десятков тысяч."
      - pl: " W żydowskiej pamięci lata 1648–1649 pozostały jedną z największych katastrof przed Zagładą."
        ru: "В еврейской памяти 1648–1649 годы остались одной из величайших катастроф до Холокоста."
        note: "Zagłada — Холокост"
      - pl: " Odpowiedź strony polskiej była równie brutalna."
        ru: "Ответ польской стороны был столь же жестоким."
      - pl: " Książę Jeremi Wiśniowiecki, największy magnat zadnieprzański, palił zbuntowane wsie i kazał wbijać powstańców na pale."
        ru: "Князь Иеремия Вишневецкий, крупнейший заднепровский магнат, сжигал восставшие деревни и велел сажать повстанцев на кол."
        note: "wbijać na pal — сажать на кол"
      - pl: " Wojna stała się pasmem wzajemnych okrucieństw, które na długo zatruły stosunki między Polakami a Ukraińcami."
        ru: "Война превратилась в череду взаимных жестокостей, которые надолго отравили отношения между поляками и украинцами."
        note: "pasmo — череда, полоса; zatruć — отравить"
    words: { "niezwykle": niezwykle, "okrutne": okrutny, "księży": ksiadz, "szczególnie": szczegolnie, "chłopów": chlop, "symbolem": symbol, "kilkunastu": kilkanascie, "żydowskiej": zydowski, "katastrof": katastrofa, "polskiej": polski, "równie": rownie, "brutalna": brutalny, "wsie": wies, "zatruły": zatruc, "stosunki": stosunek }
  - clean: "We wrześniu 1648 roku pospolite ruszenie szlachty zebrane pod Piławcami w panice uciekło przed Kozakami, zostawiając obóz pełen bogactw. Była to jedna z najbardziej haniebnych klęsk w historii polskiego oręża. Chmielnicki obległ Lwów i Zamość, ale nie zdobył ich i wrócił do Kijowa, gdzie witano go jak triumfatora. W listopadzie szlachta wybrała na króla brata zmarłego władcy, Jana Kazimierza, który rozpoczął rozmowy z Kozakami. Chmielnicki zaczynał już mówić nie tylko o prawach Kozaków, ale o wyzwoleniu całego „ludu ruskiego”."
    draft: true
    chunks:
      - pl: "We wrześniu 1648 roku pospolite ruszenie szlachty zebrane pod Piławcami w panice uciekło przed Kozakami, zostawiając obóz pełen bogactw."
        ru: "В сентябре 1648 года шляхетское ополчение, собранное под Пилявцами, в панике бежало от казаков, бросив лагерь, полный богатств."
      - pl: " Była to jedna z najbardziej haniebnych klęsk w historii polskiego oręża."
        ru: "Это было одно из самых позорных поражений в истории польского оружия."
        note: "haniebny — позорный"
      - pl: " Chmielnicki obległ Lwów i Zamość, ale nie zdobył ich i wrócił do Kijowa, gdzie witano go jak triumfatora."
        ru: "Хмельницкий осадил Львов и Замостье, но не взял их и вернулся в Киев, где его встречали как триумфатора."
      - pl: " W listopadzie szlachta wybrała na króla brata zmarłego władcy, Jana Kazimierza, który rozpoczął rozmowy z Kozakami."
        ru: "В ноябре шляхта избрала королём брата покойного государя, Яна Казимира, который начал переговоры с казаками."
      - pl: " Chmielnicki zaczynał już mówić nie tylko o prawach Kozaków, ale o wyzwoleniu całego „ludu ruskiego”."
        ru: "Хмельницкий уже начинал говорить не только о правах казаков, но и об освобождении всего «русского народа»."
    words: { "wrześniu": wrzesien, "panice": panika, "bogactw": bogactwo, "polskiego": polski, "oręża": orez, "listopadzie": listopad, "władcy": wladca, "ludu": lud }
  - clean: "W 1649 roku Kozacy i Tatarzy oblegli pod Zbarażem armię koronną. Obrona Zbaraża, którą kierował Wiśniowiecki, stała się później tematem pierwszej części trylogii Henryka Sienkiewicza, „Ogniem i mieczem”. Król, który szedł na odsiecz, został otoczony pod Zborowem i musiał zawrzeć ugodę. Rejestr kozacki zwiększono do czterdziestu tysięcy, a trzy województwa, kijowskie, bracławskie i czernihowskie, miały być zarządzane przez prawosławną szlachtę i Kozaków. Na tych ziemiach powstało de facto państwo kozackie, nazywane Hetmanatem. Ani szlachta, ani Kozacy nie byli jednak zadowoleni z ugody, i wojna wkrótce wybuchła znowu."
    draft: true
    chunks:
      - pl: "W 1649 roku Kozacy i Tatarzy oblegli pod Zbarażem armię koronną."
        ru: "В 1649 году казаки и татары осадили под Збаражем коронную армию."
      - pl: " Obrona Zbaraża, którą kierował Wiśniowiecki, stała się później tematem pierwszej części trylogii Henryka Sienkiewicza, „Ogniem i mieczem”."
        ru: "Оборона Збаража, которой руководил Вишневецкий, позже стала темой первой части трилогии Генрика Сенкевича «Огнём и мечом»."
      - pl: " Król, który szedł na odsiecz, został otoczony pod Zborowem i musiał zawrzeć ugodę."
        ru: "Король, шедший на выручку, был окружён под Зборовом и был вынужден заключить соглашение."
        note: "ugoda — соглашение, договор"
      - pl: " Rejestr kozacki zwiększono do czterdziestu tysięcy, a trzy województwa, kijowskie, bracławskie i czernihowskie, miały być zarządzane przez prawosławną szlachtę i Kozaków."
        ru: "Казацкий реестр увеличили до сорока тысяч, а три воеводства — Киевское, Брацлавское и Черниговское — должны были управляться православной шляхтой и казаками."
      - pl: " Na tych ziemiach powstało de facto państwo kozackie, nazywane Hetmanatem."
        ru: "На этих землях фактически возникло казацкое государство, называемое Гетманщиной."
        note: "de facto — фактически"
      - pl: " Ani szlachta, ani Kozacy nie byli jednak zadowoleni z ugody, i wojna wkrótce wybuchła znowu."
        ru: "Однако ни шляхта, ни казаки не были довольны соглашением, и война вскоре вспыхнула снова."
    words: { "kierował": kierowac, "otoczony": otoczyc, "zawrzeć": zawrzec, "ugodę": ugoda, "Rejestr": rejestr, "zwiększono": zwiekszyc, "czterdziestu": czterdziesci, "zarządzane": zarzadzac, "powstało": powstac, "ugody": ugoda, "wybuchła": wybuchnac }
  - clean: "W czerwcu 1651 roku pod Beresteczkiem na Wołyniu doszło do jednej z największych bitew XVII wieku w Europie. Po obu stronach walczyło łącznie ponad dwieście tysięcy ludzi. W decydującej chwili chan krymski wycofał się z pola bitwy i zabrał ze sobą Chmielnickiego, którego zatrzymał na kilka tygodni. Pozbawieni wodza Kozacy bronili się w obozie przez dziesięć dni, a potem próbowali przeprawić się przez bagna. Tysiące zginęły w walce i utonęły. Zwycięstwo pod Beresteczkiem nie zakończyło jednak wojny. Rok później pod Batohem Kozacy i Tatarzy rozbili armię koronną, a jeńców, kilka tysięcy żołnierzy, wymordowano."
