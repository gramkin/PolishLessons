        ru: "С обеих сторон сражалось в общей сложности больше двухсот тысяч человек."
      - pl: " W decydującej chwili chan krymski wycofał się z pola bitwy i zabrał ze sobą Chmielnickiego, którego zatrzymał na kilka tygodni."
        ru: "В решающий момент крымский хан ушёл с поля битвы и увёл с собой Хмельницкого, которого задержал на несколько недель."
      - pl: " Pozbawieni wodza Kozacy bronili się w obozie przez dziesięć dni, a potem próbowali przeprawić się przez bagna."
        ru: "Лишённые вождя казаки оборонялись в лагере десять дней, а потом пытались переправиться через болота."
      - pl: " Tysiące zginęły w walce i utonęły."
        ru: "Тысячи погибли в бою и утонули."
