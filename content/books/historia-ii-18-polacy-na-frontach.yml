  - clean: "Latem 1940 roku Niemcy rozpoczęli bitwę o Anglię. Luftwaffe miała zniszczyć brytyjskie lotnictwo i przygotować inwazję na Wyspy. Brytyjczycy początkowo nie ufali polskim pilotom, bo nie znali angielskiego i latali na starych samolotach we wrześniu 1939 roku. Szybko okazało się jednak, że Polacy są doświadczeni, odważni i świetnie strzelają."
    draft: true
    chunks:
      - pl: "Latem 1940 roku Niemcy rozpoczęli bitwę o Anglię."
        ru: "Летом 1940 года немцы начали битву за Англию."
      - pl: " Luftwaffe miała zniszczyć brytyjskie lotnictwo i przygotować inwazję na Wyspy."
        ru: "Люфтваффе должны были уничтожить британскую авиацию и подготовить вторжение на острова."
        note: "inwazja — вторжение"
      - pl: " Brytyjczycy początkowo nie ufali polskim pilotom, bo nie znali angielskiego i latali na starych samolotach we wrześniu 1939 roku."
        ru: "Британцы сначала не доверяли польским лётчикам, потому что те не знали английского и в сентябре 1939 года летали на старых самолётах."
      - pl: " Szybko okazało się jednak, że Polacy są doświadczeni, odważni i świetnie strzelają."
        ru: "Однако быстро оказалось, что поляки опытны, отважны и прекрасно стреляют."
