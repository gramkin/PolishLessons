      - pl: " Niemiecka propaganda nazwała obrońców Tobruku szczurami, a oni przyjęli to przezwisko z dumą."
        ru: "Немецкая пропаганда назвала защитников Тобрука крысами, а они с гордостью приняли это прозвище."
