  - clean: "W bitwie o Anglię walczyło około stu czterdziestu polskich pilotów. Najsłynniejszy był Dywizjon 303 imienia Tadeusza Kościuszki, który zestrzelił najwięcej samolotów niemieckich ze wszystkich dywizjonów myśliwskich RAF. Jego piloci nosili na mundurach znak dawnej eskadry Kościuszkowskiej, w której w 1920 roku latali amerykańscy ochotnicy. Czech Josef František, który latał w polskim dywizjonie, był jednym z najskuteczniejszych pilotów całej bitwy. Churchill powiedział o lotnikach bitwy o Anglię, że nigdy tak wielu nie zawdzięczało tak wiele tak nielicznym. Polacy mieli w tym zwycięstwie swój wyraźny udział. Przez całą wojnę w Polskich Siłach Powietrznych na Zachodzie służyło kilkanaście tysięcy ludzi, a prawie dwa tysiące z nich zginęło."
    draft: true
    chunks:
      - pl: "W bitwie o Anglię walczyło około stu czterdziestu polskich pilotów."
        ru: "В битве за Англию сражались около ста сорока польских лётчиков."
      - pl: " Najsłynniejszy był Dywizjon 303 imienia Tadeusza Kościuszki, który zestrzelił najwięcej samolotów niemieckich ze wszystkich dywizjonów myśliwskich RAF."
        ru: "Самой знаменитой была 303-я эскадрилья имени Тадеуша Костюшко, которая сбила больше немецких самолётов, чем любая другая истребительная эскадрилья Королевских ВВС."
        note: "dywizjon — эскадрилья (в польской авиации)"
      - pl: " Jego piloci nosili na mundurach znak dawnej eskadry Kościuszkowskiej, w której w 1920 roku latali amerykańscy ochotnicy."
        ru: "Его лётчики носили на форме знак бывшей эскадрильи имени Костюшко, в которой в 1920 году летали американские добровольцы."
      - pl: " Czech Josef František, który latał w polskim dywizjonie, był jednym z najskuteczniejszych pilotów całej bitwy."
        ru: "Чех Йозеф Франтишек, летавший в польской эскадрилье, был одним из самых результативных лётчиков всей битвы."
        note: "skuteczny — результативный"
      - pl: " Churchill powiedział o lotnikach bitwy o Anglię, że nigdy tak wielu nie zawdzięczało tak wiele tak nielicznym."
        ru: "Черчилль сказал о лётчиках битвы за Англию, что никогда ещё столь многие не были обязаны столь многим столь немногим."
      - pl: " Polacy mieli w tym zwycięstwie swój wyraźny udział."
        ru: "Поляки внесли в эту победу заметный вклад."
      - pl: " Przez całą wojnę w Polskich Siłach Powietrznych na Zachodzie służyło kilkanaście tysięcy ludzi, a prawie dwa tysiące z nich zginęło."
        ru: "За всю войну в Польских ВВС на Западе служили больше десяти тысяч человек, и почти две тысячи из них погибли."
