  - clean: "Polskie statki handlowe przewoziły żołnierzy, broń i żywność, a wielu marynarzy zginęło od niemieckich torped. Polskie okręty brały udział w lądowaniu w Normandii w czerwcu 1944 roku. W tym samym czasie w Afryce Północnej walczyła Samodzielna Brygada Strzelców Karpackich generała Stanisława Kopańskiego. W 1941 roku przez kilka miesięcy broniła oblężonego Tobruku w Libii. Niemiecka propaganda nazwała obrońców Tobruku szczurami, a oni przyjęli to przezwisko z dumą. Do dziś weterani tej bitwy są znani w Polsce jako Szczury Tobruku."
