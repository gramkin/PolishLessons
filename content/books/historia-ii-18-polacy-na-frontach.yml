paragraphs:
  - clean: "Po klęsce wrześniowej dziesiątki tysięcy polskich żołnierzy przedostały się do Francji, gdzie generał Sikorski odtwarzał armię. Do żołnierzy z Polski dołączyli emigranci, którzy od lat pracowali we francuskich kopalniach i fabrykach. Wiosną 1940 roku Polska armia we Francji liczyła ponad osiemdziesiąt tysięcy ludzi. W maju 1940 roku Samodzielna Brygada Strzelców Podhalańskich walczyła razem z Brytyjczykami i Francuzami pod Narwikiem w dalekiej Norwegii."
    draft: true
    chunks:
      - pl: "Po klęsce wrześniowej dziesiątki tysięcy polskich żołnierzy przedostały się do Francji, gdzie generał Sikorski odtwarzał armię."
        ru: "После сентябрьского поражения десятки тысяч польских солдат пробрались во Францию, где генерал Сикорский воссоздавал армию."
        note: "odtwarzać — воссоздавать"
      - pl: " Do żołnierzy z Polski dołączyli emigranci, którzy od lat pracowali we francuskich kopalniach i fabrykach."
        ru: "К солдатам из Польши присоединились эмигранты, которые годами работали на французских шахтах и фабриках."
      - pl: " Wiosną 1940 roku Polska armia we Francji liczyła ponad osiemdziesiąt tysięcy ludzi."
        ru: "Весной 1940 года польская армия во Франции насчитывала больше восьмидесяти тысяч человек."
      - pl: " W maju 1940 roku Samodzielna Brygada Strzelców Podhalańskich walczyła razem z Brytyjczykami i Francuzami pod Narwikiem w dalekiej Norwegii."
        ru: "В мае 1940 года Отдельная бригада подгалянских стрелков сражалась вместе с британцами и французами под Нарвиком в далёкой Норвегии."
        note: "samodzielny — отдельный, самостоятельный"
    words: { "dziesiątki": dziesiatka, "polskich": polski, "francuskich": francuski, "kopalniach": kopalnia, "fabrykach": fabryka, "Wiosną": wiosna, "maju": maj }
  - clean: "W czerwcu 1940 roku Niemcy w ciągu kilku tygodni pokonały Francję. Polskie dywizje walczyły dzielnie, ale wiele z nich zostało rozbitych lub musiało przejść do Szwajcarii, gdzie internowano je do końca wojny. Sikorski przyleciał do Londynu i przekonał Churchilla, żeby pomógł ewakuować polskich żołnierzy do Wielkiej Brytanii. Z francuskich portów przypłynęło na Wyspy kilkanaście tysięcy żołnierzy i lotników. Polski rząd na uchodźstwie przeniósł się do Londynu. Przez pewien czas Polska była jedynym sojusznikiem, który walczył u boku Wielkiej Brytanii z całą swoją armią, flotą i lotnictwem. W Szkocji, gdzie stacjonowała polska armia, wielu żołnierzy zawarło małżeństwa z miejscowymi dziewczętami i zostało tam po wojnie na zawsze."
    draft: true
    chunks:
      - pl: "W czerwcu 1940 roku Niemcy w ciągu kilku tygodni pokonały Francję."
        ru: "В июне 1940 года Германия за несколько недель разгромила Францию."
      - pl: " Polskie dywizje walczyły dzielnie, ale wiele z nich zostało rozbitych lub musiało przejść do Szwajcarii, gdzie internowano je do końca wojny."
        ru: "Польские дивизии сражались храбро, но многие из них были разбиты или были вынуждены перейти в Швейцарию, где их интернировали до конца войны."
      - pl: " Sikorski przyleciał do Londynu i przekonał Churchilla, żeby pomógł ewakuować polskich żołnierzy do Wielkiej Brytanii."
        ru: "Сикорский прилетел в Лондон и убедил Черчилля помочь эвакуировать польских солдат в Великобританию."
      - pl: " Z francuskich portów przypłynęło na Wyspy kilkanaście tysięcy żołnierzy i lotników."
        ru: "Из французских портов на Британские острова прибыли больше десяти тысяч солдат и лётчиков."
        note: "Wyspy — здесь: Британские острова"
      - pl: " Polski rząd na uchodźstwie przeniósł się do Londynu."
        ru: "Польское правительство в изгнании переехало в Лондон."
      - pl: " Przez pewien czas Polska była jedynym sojusznikiem, który walczył u boku Wielkiej Brytanii z całą swoją armią, flotą i lotnictwem."
        ru: "Некоторое время Польша была единственным союзником, который сражался бок о бок с Великобританией всей своей армией, флотом и авиацией."
      - pl: " W Szkocji, gdzie stacjonowała polska armia, wielu żołnierzy zawarło małżeństwa z miejscowymi dziewczętami i zostało tam po wojnie na zawsze."
        ru: "В Шотландии, где стояла польская армия, многие солдаты женились на местных девушках и остались там после войны навсегда."
