  - clean: "Polska marynarka wojenna walczyła na wszystkich morzach. Polskie okręty osłaniały konwoje płynące z Ameryki do Wielkiej Brytanii i do północnych portów Związku Radzieckiego. W maju 1941 roku niszczyciel „Piorun” jako pierwszy odnalazł nocą niemiecki pancernik „Bismarck” i przez godzinę ostrzeliwał go, choć był od niego wielokrotnie słabszy. Według relacji dowódca okrętu nadał do przeciwnika sygnał, że jest Polakiem."
