  - clean: "Po ataku Niemiec na Związek Radziecki w Moskwie zaczęła się formować nowa armia polska. Jej dowódcą został generał Władysław Anders, którego właśnie wypuszczono z więzienia NKWD na Łubiance, gdzie spędził prawie dwa lata. Do punktów werbunkowych przybywały tysiące ludzi wypuszczonych z łagrów i zesłania, wychudzonych, chorych i w łachmanach. Przychodzili całymi rodzinami, z dziećmi, bo wiedzieli, że tylko przy armii mogą przeżyć."
    draft: true
    chunks:
      - pl: "Po ataku Niemiec na Związek Radziecki w Moskwie zaczęła się formować nowa armia polska."
        ru: "После нападения Германии на Советский Союз в Москве начала формироваться новая польская армия."
      - pl: " Jej dowódcą został generał Władysław Anders, którego właśnie wypuszczono z więzienia NKWD na Łubiance, gdzie spędził prawie dwa lata."
        ru: "Её командующим стал генерал Владислав Андерс, которого только что выпустили из тюрьмы НКВД на Лубянке, где он провёл почти два года."
      - pl: " Do punktów werbunkowych przybywały tysiące ludzi wypuszczonych z łagrów i zesłania, wychudzonych, chorych i w łachmanach."
        ru: "На вербовочные пункты прибывали тысячи людей, выпущенных из лагерей и ссылки, исхудавших, больных и в лохмотьях."
        note: "łachmany — лохмотья"
      - pl: " Przychodzili całymi rodzinami, z dziećmi, bo wiedzieli, że tylko przy armii mogą przeżyć."
        ru: "Они приходили целыми семьями, с детьми, потому что знали, что только при армии могут выжить."
    words: { "polska": polski, "dowódcą": dowodca, "przybywały": przybywac }
  - clean: "Anders szukał tysięcy oficerów, którzy byli w niewoli radzieckiej, ale nigdzie ich nie było. Kiedy Sikorski zapytał o nich Stalina, ten odpowiedział, że pewnie uciekli do Mandżurii. Nikt nie wiedział jeszcze, że wszyscy leżą w masowych grobach w Katyniu i innych miejscach. Związek Radziecki nie zapewniał armii wystarczającej ilości żywności i broni, a ludzie wciąż umierali na tyfus i czerwonkę. W 1942 roku Anders wyprowadził armię przez Morze Kaspijskie do Iranu, który był wtedy pod kontrolą brytyjską. Razem z żołnierzami ewakuowano kilkadziesiąt tysięcy cywilów, w tym wiele dzieci, z których część znalazła schronienie w Iranie, Indiach, Afryce, a nawet w Nowej Zelandii. Dla wielu z nich Iran był pierwszym miejscem od lat, gdzie mogli najeść się do syta."
    draft: true
    chunks:
      - pl: "Anders szukał tysięcy oficerów, którzy byli w niewoli radzieckiej, ale nigdzie ich nie było."
        ru: "Андерс искал тысячи офицеров, находившихся в советском плену, но их нигде не было."
      - pl: " Kiedy Sikorski zapytał o nich Stalina, ten odpowiedział, że pewnie uciekli do Mandżurii."
        ru: "Когда Сикорский спросил о них Сталина, тот ответил, что они, наверное, бежали в Маньчжурию."
