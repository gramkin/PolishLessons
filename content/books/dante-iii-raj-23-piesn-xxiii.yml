# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 23
chapterTitle: "Pieśń XXIII"
chapterTitleRu: "Песнь XXIII. Торжество Христа"
level: B2
paragraphs:
  - clean: "Oddział drugi. W niebie gwiazd stałych, w kręgu róży i lilii, panny Marii z apostołami i Adamem. Wewnętrzne udoskonalenie Dantego. Okazują się Chrystus i Panna Maria."
    chunks:
      - pl: "Oddział drugi. W niebie gwiazd stałych, w kręgu róży i lilii, panny Marii z apostołami i Adamem. Wewnętrzne udoskonalenie Dantego. Okazują się Chrystus i Panna Maria."
        ru: "Второй отдел. На небе неподвижных звёзд, в кругу розы и лилий, Дева Мария с апостолами и Адамом. Внутреннее совершенствование Данте. Являются Христос и Дева Мария."
    words: { "Oddział": oddzial, "niebie": niebo, "kręgu": krag, "róży": roza, "Wewnętrzne": wewnetrzny, "Okazują": okazywac }
  - clean: "Jak między liśćmi ptaszyna ukryta,\nSiedząc przy gnieździe ukochanych dzieci,\nGdy noc świat siecią nakrywa ciemnoty,\nAżeby widzieć swe drogie przedmioty\nI znaleźć pokarm, po który poleci\nNakarmić siebie i głód swojej dziatwy,\n(Trud wprawdzie miły dla niej lecz niełatwy,)\nPrzez przeźrocz liści bez przerwy patrząca\nZ strzelistą żądzą oczekuje słońca,\nŚledzi oczyma, czy jutrzenka świta?"
    verse: true
    chunks:
      - pl: "Jak między liśćmi ptaszyna ukryta,"
        ru: "Как птичка, спрятанная между листьев,"
      - pl: "\nSiedząc przy gnieździe ukochanych dzieci,"
        ru: "сидя у гнезда любимых детей,"
      - pl: "\nGdy noc świat siecią nakrywa ciemnoty,"
        ru: "когда ночь накрывает мир сетью темноты,"
      - pl: "\nAżeby widzieć swe drogie przedmioty"
        ru: "чтобы видеть свои дорогие предметы"
      - pl: "\nI znaleźć pokarm, po który poleci"
        ru: "и найти корм, за которым полетит,"
      - pl: "\nNakarmić siebie i głód swojej dziatwy,"
        ru: "чтобы накормить себя и утолить голод своих птенцов,"
        note: "dziatwa — детвора"
      - pl: "\n(Trud wprawdzie miły dla niej lecz niełatwy,)"
        ru: "(труд, правда, милый для неё, но нелёгкий,)"
      - pl: "\nPrzez przeźrocz liści bez przerwy patrząca"
        ru: "непрестанно глядя сквозь прозрачность листьев,"
      - pl: "\nZ strzelistą żądzą oczekuje słońca,"
        ru: "с устремлённым желанием ждёт солнца"
      - pl: "\nŚledzi oczyma, czy jutrzenka świta?"
        ru: "и следит глазами, не светает ли заря;"
    words: { "gnieździe": gniazdo, "siecią": siec, "przedmioty": przedmiot, "Nakarmić": nakarmic, "głód": glod, "Trud": trud }
  - clean: "Tak moja pani stojąc w miejsce wryta,\nWyprostowana, obracała oczy\nW stronę, gdzie słońce powolniej się toczy,\nA tak ciekawie widząc ją patrzącą,\nStałem się jak ten, co żądzą gorącą\nCzego innego chciałby i koleją\nNiepokój żądzy kołysze nadzieją."
    verse: true
    chunks:
      - pl: "Tak moja pani stojąc w miejsce wryta,"
        ru: "так моя госпожа, стоя как вкопанная,"
        note: "wryty w miejsce — как вкопанный"
      - pl: "\nWyprostowana, obracała oczy"
        ru: "выпрямившись, обращала глаза"
      - pl: "\nW stronę, gdzie słońce powolniej się toczy,"
        ru: "в ту сторону, где солнце катится медленнее;"
        note: "к полудню"
      - pl: "\nA tak ciekawie widząc ją patrzącą,"
        ru: "и, видя, как она так жадно смотрит,"
      - pl: "\nStałem się jak ten, co żądzą gorącą"
        ru: "я стал как тот, кто горячим желанием"
      - pl: "\nCzego innego chciałby i koleją"
        ru: "хотел бы чего-то иного и попеременно"
      - pl: "\nNiepokój żądzy kołysze nadzieją."
        ru: "качает тревогу желания надеждой."
    words: { "stronę": strona, "słońce": slonce, "toczy": toczyc, "ciekawie": ciekawie, "gorącą": goracy, "nadzieją": nadzieja }
  - clean: "Lecz między moim czas oczekiwaniem\nPrzeleciał chwilą, a światła łyskaniem,\nJakim się większa część nieba oblekła.\n«Oto Chrystusa triumfu legiony\nI cały owoc» Beatrycze rzekła\n«Z obrotu sfer tych zarazem uszczkniony»."
    verse: true
    chunks:
      - pl: "Lecz między moim czas oczekiwaniem"
        ru: "Но время между моим ожиданием"
      - pl: "\nPrzeleciał chwilą, a światła łyskaniem,"
        ru: "пролетело мигом, и блеском светил,"
        note: "łyskanie — сверкание"
      - pl: "\nJakim się większa część nieba oblekła."
        ru: "каким облеклась бо́льшая часть неба."
      - pl: "\n«Oto Chrystusa triumfu legiony"
        ru: "«Вот легионы торжества Христова"
      - pl: "\nI cały owoc» Beatrycze rzekła"
        ru: "и весь плод, — сказала Беатриче, —"
      - pl: "\n«Z obrotu sfer tych zarazem uszczkniony»."
        ru: "собранный разом с вращения этих сфер»."
        note: "uszczknąć — сорвать"
    words: { "oczekiwaniem": oczekiwac, "Przeleciał": przeleciec, "część": czesc-noun, "owoc": owoc, "rzekła": rzec, "obrotu": obrot }
  - clean: "I zdało mi się, z jej oczu, z jej liców\nRadość tryskała iskrami, płomieniem;\nPomimo woli tu czuję potrzebę\nZakryć blask tego obrazu milczeniem.\nJak podczas pełni pogodnych księżyców\nPośród nimf wiecznych uśmiecha się Febe\nOświecających niebios okolice;\nTak tam wzniesione nad świateł tysiące,\nWidziałem, światła zapalało słońce\nJak nasze niebios zapala pochodnie."
    verse: true
    chunks:
      - pl: "I zdało mi się, z jej oczu, z jej liców"
        ru: "И мне казалось, из её глаз, с её лица"
        note: "lica — лицо, щёки"
      - pl: "\nRadość tryskała iskrami, płomieniem;"
        ru: "радость брызгала искрами, пламенем;"
      - pl: "\nPomimo woli tu czuję potrzebę"
        ru: "поневоле я чувствую здесь нужду"
      - pl: "\nZakryć blask tego obrazu milczeniem."
        ru: "покрыть блеск этого образа молчанием."
      - pl: "\nJak podczas pełni pogodnych księżyców"
        ru: "Как в ясные полнолуния"
      - pl: "\nPośród nimf wiecznych uśmiecha się Febe"
        ru: "среди вечных нимф улыбается Феба,"
        note: "Луна среди звёзд"
      - pl: "\nOświecających niebios okolice;"
        ru: "освещающих области небес,"
      - pl: "\nTak tam wzniesione nad świateł tysiące,"
        ru: "так там, вознесённое над тысячами светил,"
      - pl: "\nWidziałem, światła zapalało słońce"
        ru: "я видел, солнце зажигало светила,"
      - pl: "\nJak nasze niebios zapala pochodnie."
        ru: "как наше зажигает факелы небес."
    words: { "płomieniem": plomien, "blask": blask, "wiecznych": wieczny, "niebios": niebiosa, "wzniesione": wzniesc, "pochodnie": pochodnia }
  - clean: "I przez blask jego promiennej przeźroczy\nŻywą treść światła widziałem dowodnie;\nRzekłem, zalśnione opuszczając oczy,\n«Droga, o słodka moja Beatryce!»\nA ona: — «Ciebie przytłoczył blask siły,\nKtóra się nie da złamać siłą drugą;\nW niej jest moc, mądrość, jakim równych nie ma,\nCo między niebem a ziemią tak długo\nOczekiwane drogi otworzyły»."
    verse: true
    chunks:
      - pl: "I przez blask jego promiennej przeźroczy"
        ru: "И сквозь блеск его лучистой прозрачности"
      - pl: "\nŻywą treść światła widziałem dowodnie;"
        ru: "я явственно видел живую сущность света;"
        note: "dowodnie — явно"
      - pl: "\nRzekłem, zalśnione opuszczając oczy,"
        ru: "я сказал, опуская ослеплённые глаза:"
      - pl: "\n«Droga, o słodka moja Beatryce!»"
        ru: "«Дорогая, о сладкая моя Беатриче!»"
      - pl: "\nA ona: — «Ciebie przytłoczył blask siły,"
        ru: "А она: — «Тебя подавил блеск силы,"
      - pl: "\nKtóra się nie da złamać siłą drugą;"
        ru: "которую не сломить никакой другой силой;"
      - pl: "\nW niej jest moc, mądrość, jakim równych nie ma,"
        ru: "в ней мощь и мудрость, каким нет равных,"
      - pl: "\nCo między niebem a ziemią tak długo"
        ru: "что открыли между небом и землёй"
      - pl: "\nOczekiwane drogi otworzyły»."
        ru: "столь долго ожидаемые дороги»."
    words: { "Żywą": zywy, "opuszczając": opuszczac, "słodka": slodki, "złamać": zlamac, "siłą": sila, "mądrość": madrosc }
  - clean: "Jak ogień kiedy wymyka się z chmury,\nPolotu ognia chmura nie zatrzyma,\nSpada na ziemię wbrew swojej natury,\nPodobnie duch mój w takim wrażeń tłumie,\nRósł, stał się większym i wyszedł sam z siebie,\nLecz co z nim było, przypomnieć nie umie."
    verse: true
    chunks:
      - pl: "Jak ogień kiedy wymyka się z chmury,"
        ru: "Как огонь, когда вырывается из тучи"
      - pl: "\nPolotu ognia chmura nie zatrzyma,"
        ru: "и туча не удержит полёта огня,"
      - pl: "\nSpada na ziemię wbrew swojej natury,"
        ru: "падает на землю вопреки своей природе,"
        note: "огонь по природе стремится вверх"
      - pl: "\nPodobnie duch mój w takim wrażeń tłumie,"
        ru: "так мой дух в таком множестве впечатлений"
      - pl: "\nRósł, stał się większym i wyszedł sam z siebie,"
        ru: "рос, стал больше и вышел сам из себя,"
      - pl: "\nLecz co z nim było, przypomnieć nie umie."
        ru: "но что с ним было, вспомнить не умеет."
    words: { "chmury": chmura, "natury": natura, "Podobnie": podobnie, "tłumie": tlum, "Rósł": rosnac, "przypomnieć": przypomniec }
  - clean: "«Otwieraj oczy, patrz, czym jestem w niebie,\nTo, co widziałeś, siły ci użycza\nZnieść blask uśmiechu mojego oblicza».\nByłem jak człowiek, co ze snów objęcia\nZerwany, lube gdy wionie marzenie,\nChce zapomniane przypomnieć widzenie."
    verse: true
    chunks:
      - pl: "«Otwieraj oczy, patrz, czym jestem w niebie,"
        ru: "«Открой глаза, смотри, что я такое на небе:"
      - pl: "\nTo, co widziałeś, siły ci użycza"
        ru: "то, что ты видел, даёт тебе силу"
        note: "użyczać — давать, одалживать"
      - pl: "\nZnieść blask uśmiechu mojego oblicza»."
        ru: "вынести блеск улыбки моего лица»."
      - pl: "\nByłem jak człowiek, co ze snów objęcia"
        ru: "Я был как человек, что, вырванный из объятий"
      - pl: "\nZerwany, lube gdy wionie marzenie,"
        ru: "сна, когда развеется милая грёза,"
        note: "wionąć — повеять, улететь"
      - pl: "\nChce zapomniane przypomnieć widzenie."
        ru: "хочет вспомнить забытое видение."
    words: { "Otwieraj": otwierac, "Znieść": zniesc, "uśmiechu": usmiech, "oblicza": oblicze, "snów": sen, "Zerwany": zerwac }
  - clean: "Słysząc ofiarę tak godną przyjęcia,\nKtóra na jotę nigdy nie zwietrzeje\nZ księgi, gdzie przeszłość wpisuje swe dzieje.\nGdyby tu wszystkich poetów języki\nMuz, co najsłodszym wykarmione mlekiem,\nZaświergotały chórem jak słowiki,\nWtór mi trzymając, gdy echem dalekiem\nLas rozwołują melodyją maju,\nJeszcze bym zwątpił, czy mi się poszczęści\nDoścignąć prawdę w tysiącznej jej części,\nŚpiewając święty uśmiech, blask jej twarzy."
    verse: true
    chunks:
      - pl: "Słysząc ofiarę tak godną przyjęcia,"
        ru: "Слыша предложение, столь достойное принятия,"
      - pl: "\nKtóra na jotę nigdy nie zwietrzeje"
        ru: "которое ни на йоту никогда не выветрится"
      - pl: "\nZ księgi, gdzie przeszłość wpisuje swe dzieje."
        ru: "из книги, куда прошлое вписывает свою историю."
        note: "dzieje — история"
      - pl: "\nGdyby tu wszystkich poetów języki"
        ru: "Если бы здесь языки всех поэтов,"
      - pl: "\nMuz, co najsłodszym wykarmione mlekiem,"
        ru: "Муз, вскормленных сладчайшим молоком,"
      - pl: "\nZaświergotały chórem jak słowiki,"
        ru: "защебетали хором, как соловьи,"
        note: "zaświergotać — защебетать"
      - pl: "\nWtór mi trzymając, gdy echem dalekiem"
        ru: "вторя мне, когда далёким эхом"
      - pl: "\nLas rozwołują melodyją maju,"
        ru: "наполняют лес майской мелодией,"
        note: "rozwoływać — оглашать"
      - pl: "\nJeszcze bym zwątpił, czy mi się poszczęści"
        ru: "я и тогда усомнился бы, удастся ли мне"
      - pl: "\nDoścignąć prawdę w tysiącznej jej części,"
        ru: "настичь истину в тысячной её части,"
      - pl: "\nŚpiewając święty uśmiech, blask jej twarzy."
        ru: "воспевая святую улыбку, блеск её лица."
    words: { "godną": godny, "poetów": poeta, "mlekiem": mleko, "chórem": chor, "echem": echo, "poszczęści": poszczescic }
  - clean: "Równie pieśń święta kreśląc obraz raju\nPowinna skakać jak krok podróżnika,\nGdy na swej drodze zawadę spotyka.\nAle kto ciężar przedmiotu rozważy\nI ramię, jakie dźwigając go, mdleje,\nPrzebaczy, jeśli pod nim się zachwieje."
    verse: true
    chunks:
      - pl: "Równie pieśń święta kreśląc obraz raju"
        ru: "Так и святая песнь, рисуя образ рая,"
      - pl: "\nPowinna skakać jak krok podróżnika,"
        ru: "должна перескакивать, как шаг путника,"
      - pl: "\nGdy na swej drodze zawadę spotyka."
        ru: "когда он встречает на дороге препятствие."
        note: "zawada — препятствие"
      - pl: "\nAle kto ciężar przedmiotu rozważy"
        ru: "Но кто взвесит тяжесть предмета"
      - pl: "\nI ramię, jakie dźwigając go, mdleje,"
        ru: "и плечо, что, неся его, изнемогает,"
      - pl: "\nPrzebaczy, jeśli pod nim się zachwieje."
        ru: "тот простит, если оно под ним пошатнётся."
    words: { "pieśń": piesn, "raju": raj, "skakać": skakac, "ciężar": ciezar, "rozważy": rozwazyc, "Przebaczy": przebaczyc }
  - clean: "Nie małej łódce krajać fal tych wały,\nPo jakich buja tu mój okręt śmiały;\nNie żeglarzowi, który z niepogodą\nSpotkać się boi, żeglować tą wodą.\n— «Dlaczego w mojej twarzy twa źrenica\nTak się zatapia, do tyla zachwyca,\nŻe jej nie zwracasz na ten ogród chwały,\nKtóra w promieniach Chrystusa rozkwita."
    verse: true
    chunks:
      - pl: "Nie małej łódce krajać fal tych wały,"
        ru: "Не малой лодке резать валы этих волн,"
      - pl: "\nPo jakich buja tu mój okręt śmiały;"
        ru: "по которым носится здесь мой смелый корабль;"
      - pl: "\nNie żeglarzowi, który z niepogodą"
        ru: "не мореходу, который боится встретиться"
      - pl: "\nSpotkać się boi, żeglować tą wodą."
        ru: "с непогодой, плыть по этой воде."
      - pl: "\n— «Dlaczego w mojej twarzy twa źrenica"
        ru: "— «Почему в моём лице твой зрачок"
      - pl: "\nTak się zatapia, do tyla zachwyca,"
        ru: "так тонет и так им восхищается,"
      - pl: "\nŻe jej nie zwracasz na ten ogród chwały,"
        ru: "что ты не обращаешь его на этот сад славы,"
      - pl: "\nKtóra w promieniach Chrystusa rozkwita."
        ru: "что расцветает в лучах Христа?"
    words: { "łódce": lodka, "żeglować": zeglowac, "zwracasz": zwracac, "ogród": ogrod, "chwały": chwala, "promieniach": promien }
  - clean: "Tam kwitnie Róża, w której słowo boże\nStało się ciałem, tam wzrok twój powita\nBiałością śniegi wstydzące lilije,\nKtórych woń wskazać dobre drogi może.\nTak Beatrycze, posłuszny jej słowu,\nWzrok mój do walki wyzywałem znowu:\nJak niegdyś okiem zakrytym cieniami,\nWidziałem łąkę usłaną kwiatami,\nGdy się kryjomie i nagle przebije\nPromień słoneczny przez szczelinę chmury\nWidziałem światła oświecone z góry,\nNie widząc źródła, co ich blask roznieca\nŁaskawa siła, która tak oświeca,\nTak się podniosła nad światła okolne,\nŻe moim oczom dała miejsce wolne\nWidzieć, gdy patrzeć już nie były zdolne"
    verse: true
    chunks:
      - pl: "Tam kwitnie Róża, w której słowo boże"
        ru: "Там цветёт Роза, в которой Слово Божье"
        note: "Дева Мария"
      - pl: "\nStało się ciałem, tam wzrok twój powita"
        ru: "стало плотью, там твой взгляд встретит"
      - pl: "\nBiałością śniegi wstydzące lilije,"
        ru: "лилии, стыдящие снега белизной,"
        note: "апостолы"
      - pl: "\nKtórych woń wskazać dobre drogi może."
        ru: "чей аромат может указать добрые пути»."
      - pl: "\nTak Beatrycze, posłuszny jej słowu,"
        ru: "Так Беатриче; послушный её слову,"
      - pl: "\nWzrok mój do walki wyzywałem znowu:"
        ru: "я снова вызывал свой взгляд на борьбу:"
      - pl: "\nJak niegdyś okiem zakrytym cieniami,"
        ru: "как некогда глазом, закрытым тенями,"
      - pl: "\nWidziałem łąkę usłaną kwiatami,"
        ru: "я видел луг, усыпанный цветами,"
      - pl: "\nGdy się kryjomie i nagle przebije"
        ru: "когда украдкой и вдруг пробьётся"
      - pl: "\nPromień słoneczny przez szczelinę chmury"
        ru: "солнечный луч сквозь щель тучи,"
      - pl: "\nWidziałem światła oświecone z góry,"
        ru: "так я видел светила, освещённые сверху,"
      - pl: "\nNie widząc źródła, co ich blask roznieca"
