  - clean: "Usłyszałem brzęk jak gdyby stalowego łańcucha, a zaraz potem ryk niby rozszalałego byka. Chwilę później Holmes i marynarz tarzali się po ziemi, mocując się ze sobą. Był to człowiek tak strasznie silny, że nawet w kajdankach, które Holmes zarzucił mu na ręce z ogromną zręcznością, bardzo szybko obezwładniłby mojego przyjaciela, gdybyśmy obaj z Hopkinsem nie skoczyli mu na pomoc. Dopiero kiedy dotknąłem jego skroni zimną lufą rewolweru, zrozumiał, że wszelki opór jest daremny. Skrępowaliśmy mu nogi sznurem, po czym powstaliśmy zadyszani i zmęczeni straszną walką."
