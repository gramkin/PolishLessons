# review
title: Czarny Piotr
titleRu: Чёрный Питер
author: Arthur Conan Doyle
translator: "tłumacz nieznany"
source:
  name: "Wolne Lektury (Arthur Conan Doyle, «Tajemnica oblubienicy i inne nowele», Gebethner i Wolf 1905); сверено с оригиналом (Project Gutenberg)"
  url: https://wolnelektury.pl/katalog/lektura/doyle-czarny-piotr/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 4
chapterTitle: "Harpunnik"
chapterTitleRu: "Гарпунщик"
level: B2
paragraphs:
  - clean: "— Jak mi się zdaje, idzie w tej chwili po schodach — odparł Holmes wesoło. — Sądzę, że dobrze uczynisz, Watsonie, biorąc rewolwer do ręki."
    en: "“I rather fancy that he is on the stair,” said Holmes, serenely. “I think, Watson, that you would do well to put that revolver where you can reach it.”"
    chunks:
      - pl: "— Jak mi się zdaje, idzie w tej chwili po schodach —"
        ru: "— Мне кажется, он как раз сейчас поднимается по лестнице, —"
        note: "schody — лестница, только мн. число"
      - pl: " odparł Holmes wesoło. —"
        ru: "весело ответил Холмс. —"
      - pl: " Sądzę, że dobrze uczynisz, Watsonie,"
        ru: "Думаю, ты правильно сделаешь, Уотсон,"
      - pl: " biorąc rewolwer do ręki."
        ru: "если возьмёшь в руку револьвер."
        note: "biorąc — деепричастие: «взяв»; здесь в значении условия"
    words: { "zdaje": zdawac, "schodach": schody, "odparł": odeprzec, "uczynisz": uczynic, "biorąc": brac, "ręki": reka }
  - clean: "Holmes powstał z krzesła i położył na bocznym stoliku jakiś papier."
    en: "He rose and laid a written paper upon a side-table."
    chunks:
      - pl: "Holmes powstał z krzesła"
        ru: "Холмс поднялся со стула"
        note: "powstać — книжное «встать, подняться»"
      - pl: " i położył na bocznym stoliku jakiś papier."
        ru: "и положил на боковой столик какую-то бумагу."
    words: { "powstał": powstac, "krzesła": krzeslo, "położył": polozyc, "stoliku": stolik, "jakiś": jakis, "papier": papier }
  - clean: "— Tak, teraz jesteśmy gotowi — rzekł."
    en: "“Now we are ready,” said he."
    chunks:
      - pl: "— Tak, teraz jesteśmy gotowi — rzekł."
        ru: "— Так, теперь мы готовы, — сказал он."
    words: { "teraz": teraz, "jesteśmy": byc, "gotowi": gotowy, "rzekł": rzec }
  - clean: "Usłyszeliśmy kilka zachrypłych głosów w przedpokoju, a równocześnie pani Hudson otworzyła drzwi, zawiadamiając nas, że przybyło trzech ludzi, którzy pytają się o kapitana Basila."
    en: "There had been some talking in gruff voices outside, and now Mrs. Hudson opened the door to say that there were three men inquiring for Captain Basil."
    chunks:
      - pl: "Usłyszeliśmy kilka zachrypłych głosów w przedpokoju,"
        ru: "Мы услышали несколько хриплых голосов в прихожей,"
        note: "zachrypły — охрипший; przedpokój — прихожая"
      - pl: " a równocześnie pani Hudson otworzyła drzwi,"
        ru: "и одновременно миссис Хадсон открыла дверь,"
      - pl: " zawiadamiając nas,"
        ru: "сообщая нам,"
        note: "zawiadamiać — извещать"
      - pl: " że przybyło trzech ludzi,"
        ru: "что пришли трое,"
        note: "przybyło trzech ludzi — глагол в ср. роде при мужско-личном числительном"
      - pl: " którzy pytają się o kapitana Basila."
        ru: "которые спрашивают капитана Бэзила."
        note: "pytać się o kogoś — спрашивать о ком-л."
    words: { "Usłyszeliśmy": uslyszec, "głosów": glos, "otworzyła": otworzyc, "drzwi": drzwi, "przybyło": przybyc, "kapitana": kapitan }
  - clean: "— Niech pani wpuszcza ich kolejno, jednego po drugim — rzekł Holmes."
    en: "“Show them in one by one,” said Holmes."
    chunks:
      - pl: "— Niech pani wpuszcza ich kolejno, jednego po drugim —"
        ru: "— Впускайте их, пожалуйста, по очереди, одного за другим, —"
        note: "kolejno — по очереди"
      - pl: " rzekł Holmes."
        ru: "сказал Холмс."
    words: { "pani": pani, "jednego": jeden, "rzekł": rzec }
  - clean: "Pierwszy, który wszedł, był małym, krępym człowiekiem z czerwonymi policzkami i puszystymi siwymi bokobrodami. Holmes sięgnął do kieszeni i wyjął jakiś list."
    en: "“The first who entered was a little Ribston pippin of a man, with ruddy cheeks and fluffy white side-whiskers. Holmes had drawn a letter from his pocket."
    draft: true
    chunks:
      - pl: "Pierwszy, który wszedł,"
        ru: "Первый, кто вошёл,"
      - pl: " był małym, krępym człowiekiem"
        ru: "был маленьким коренастым человеком"
        note: "krępy — коренастый"
      - pl: " z czerwonymi policzkami"
        ru: "с красными щеками"
      - pl: " i puszystymi siwymi bokobrodami."
        ru: "и пушистыми седыми бакенбардами."
        note: "bokobrody — бакенбарды (только мн. число)"
      - pl: " Holmes sięgnął do kieszeni i wyjął jakiś list."
        ru: "Холмс сунул руку в карман и вынул какое-то письмо."
        note: "sięgnąć do czegoś — потянуться к чему-л."
    words: { "wszedł": wejsc, "czerwonymi": czerwony, "policzkami": policzek, "sięgnął": siegnac, "kieszeni": kieszen, "wyjął": wyjac }
  - clean: "— Jak się nazywasz? — zapytał."
    en: "“What name?” he asked."
    chunks:
      - pl: "— Jak się nazywasz? — zapytał."
        ru: "— Как тебя зовут? — спросил он."
        note: "nazywać się — называться, зваться"
    words: { "nazywasz": nazywac, "zapytał": zapytac }
  - clean: "— James Lancaster."
    en: "“James Lancaster.”"
    chunks:
      - pl: "— James Lancaster."
        ru: "— Джеймс Ланкастер."
  - clean: "— Bardzo mi przykro, mój dobry obywatelu, ale załoga statku jest już skompletowana. Oto masz tu pół suwerena za fatygę. Ale tymczasem proszę bardzo, wejdź do tamtego pokoju i zaczekaj tam kilka minut."
    en: "“I am sorry, Lancaster, but the berth is full. Here is half a sovereign for your trouble. Just step into this room and wait there for a few minutes.”"
    chunks:
      - pl: "— Bardzo mi przykro, mój dobry obywatelu,"
        ru: "— Мне очень жаль, мой добрый друг,"
        note: "obywatel — гражданин; здесь фамильярное обращение"
      - pl: " ale załoga statku jest już skompletowana."
        ru: "но команда судна уже набрана."
        note: "załoga — экипаж, команда"
      - pl: " Oto masz tu pół suwerena za fatygę."
        ru: "Вот тебе полсоверена за беспокойство."
        note: "fatyga — хлопоты, беспокойство"
      - pl: " Ale tymczasem proszę bardzo,"
        ru: "Но пока, будь добр,"
      - pl: " wejdź do tamtego pokoju i zaczekaj tam kilka minut."
        ru: "зайди в ту комнату и подожди там несколько минут."
    words: { "obywatelu": obywatel, "załoga": zaloga, "statku": statek, "tymczasem": tymczasem, "tamtego": tamten, "zaczekaj": zaczekac }
  - clean: "Drugi marynarz był wysoką, chudą postacią z cienkimi płowymi włosami i z zapadłymi białożółtymi policzkami. Nazywał się Hugh Pattins. I on otrzymał odmowną odpowiedź, pół suwerena nagrody za to, że przyszedł, a wreszcie polecenie, aby zatrzymał się w pokoju obok."
    en: "The second man was a long, dried-up creature, with lank hair and sallow cheeks. His name was Hugh Pattins. He also received his dismissal, his half-sovereign, and the order to wait."
    chunks:
      - pl: "Drugi marynarz był wysoką, chudą postacią"
        ru: "Второй моряк был высоким и худым"
        note: "postać — фигура, персонаж"
      - pl: " z cienkimi płowymi włosami"
        ru: "с тонкими белёсыми волосами"
        note: "płowy — белёсый, соломенный"
      - pl: " i z zapadłymi białożółtymi policzkami."
        ru: "и впалыми желтовато-бледными щеками."
      - pl: " Nazywał się Hugh Pattins."
        ru: "Его звали Хью Паттинс."
      - pl: " I on otrzymał odmowną odpowiedź,"
        ru: "Он тоже получил отказ,"
        note: "odmowny — отрицательный"
      - pl: " pół suwerena nagrody za to, że przyszedł,"
        ru: "полсоверена в награду за то, что пришёл,"
      - pl: " a wreszcie polecenie,"
        ru: "и, наконец, распоряжение,"
        note: "polecenie — поручение, указание"
      - pl: " aby zatrzymał się w pokoju obok."
        ru: "подождать в соседней комнате."
    words: { "marynarz": marynarz, "chudą": chudy, "postacią": postac, "cienkimi": cienki, "policzkami": policzek, "nagrody": nagroda }
  - clean: "Trzeci człowiek starający się o zajęcie na statku sprawiał dziwne wrażenie. Dzika twarz buldoga była okolona gęstym zarostem, dawno niestrzyżonym; miał czarne wąsy i brodę, a dwoje zuchwałych oczu żarzyło się pod cieniem gęstych, krzaczastych, zwisających brwi. Wchodząc do pokoju, pozdrowił nas i stanął w pozycji marynarza, obracając w rękach okrągłą czapeczkę."
    en: "The third applicant was a man of remarkable appearance. A fierce bull-dog face was framed in a tangle of hair and beard, and two bold, dark eyes gleamed behind the cover of thick, tufted, overhung eyebrows. He saluted and stood sailor-fashion, turning his cap round in his hands."
    chunks:
      - pl: "Trzeci człowiek starający się o zajęcie na statku"
        ru: "Третий человек, искавший места на судне,"
        note: "starać się o coś — добиваться чего-л.; zajęcie — здесь «работа, место»"
      - pl: " sprawiał dziwne wrażenie."
        ru: "производил странное впечатление."
        note: "sprawiać wrażenie — производить впечатление"
      - pl: " Dzika twarz buldoga była okolona gęstym zarostem,"
        ru: "Свирепое бульдожье лицо обрамляла густая щетина,"
        note: "okolony — окаймлённый; zarost — растительность на лице"
      - pl: " dawno niestrzyżonym;"
        ru: "давно не стриженная;"
      - pl: " miał czarne wąsy i brodę,"
        ru: "у него были чёрные усы и борода,"
      - pl: " a dwoje zuchwałych oczu żarzyło się"
        ru: "а два дерзких глаза горели"
        note: "dwoje oczu — собирательное числительное; żarzyć się — тлеть, гореть"
      - pl: " pod cieniem gęstych, krzaczastych, zwisających brwi."
        ru: "в тени густых, кустистых, нависших бровей."
        note: "brew — бровь (родительный мн. brwi)"
      - pl: " Wchodząc do pokoju, pozdrowił nas"
        ru: "Войдя в комнату, он поздоровался с нами"
        note: "pozdrowić kogoś — поприветствовать кого-л.: винительный"
      - pl: " i stanął w pozycji marynarza,"
        ru: "и встал по-матросски,"
      - pl: " obracając w rękach okrągłą czapeczkę."
        ru: "вертя в руках круглую шапочку."
    words: { "dawno": dawno, "brodę": broda, "cieniem": cien, "pozdrowił": pozdrowic, "marynarza": marynarz, "okrągłą": okragly }
  - clean: "— Nazywasz się? — pytał Holmes."
    en: "“Your name?” asked Holmes."
    chunks:
      - pl: "— Nazywasz się? — pytał Holmes."
        ru: "— Как звать? — спросил Холмс."
    words: { "Nazywasz": nazywac, "pytał": pytac }
  - clean: "— Patrick Cairns."
    en: "“Patrick Cairns.”"
    draft: true
    chunks:
      - pl: "— Patrick Cairns."
        ru: "— Патрик Кэрнс."
        note: "в издании 1905 года опечатка «Cairus»"
  - clean: "— Władasz harpunem?"
    en: "“Harpooner?”"
    chunks:
      - pl: "— Władasz harpunem?"
        ru: "— Гарпуном владеешь?"
        note: "władać czymś — владеть чем-л.: творительный, как в русском"
  - clean: "— Tak jest, panie kapitanie, polowałem dwadzieścia sześć razy."
    en: "“Yes, sir. Twenty-six voyages.”"
    chunks:
      - pl: "— Tak jest, panie kapitanie,"
        ru: "— Так точно, капитан,"
        note: "tak jest — «так точно»"
      - pl: " polowałem dwadzieścia sześć razy."
        ru: "ходил на промысел двадцать шесть раз."
    words: { "jest": byc, "kapitanie": kapitan, "polowałem": polowac, "razy": raz }
  - clean: "— Jesteś gotów popłynąć z wyprawą polarną?"
    en: "“And ready to start with an exploring ship?”"
    draft: true
    chunks:
      - pl: "— Jesteś gotów popłynąć z wyprawą polarną?"
        ru: "— Ты готов отправиться в полярную экспедицию?"
        note: "gotów — краткая форма gotowy; wyprawa — экспедиция"
    words: { "Jesteś": byc, "gotów": gotowy, "popłynąć": poplynac, "wyprawą": wyprawa }
  - clean: "— Tak, panie kapitanie."
    en: "“Yes, sir.”"
    chunks:
      - pl: "— Tak, panie kapitanie."
        ru: "— Да, капитан."
    words: { "kapitanie": kapitan }
  - clean: "— Jakiej żądasz płacy?"
    en: "“What wages?”"
    chunks:
      - pl: "— Jakiej żądasz płacy?"
        ru: "— Какого жалованья требуешь?"
        note: "żądać czegoś — требовать чего-л.: родительный; płaca — плата, жалованье"
    words: { "Jakiej": jaki, "żądasz": zadac-2 }
  - clean: "— Osiem funtów na miesiąc."
    en: "“Eight pounds a month.”"
    chunks:
      - pl: "— Osiem funtów na miesiąc."
        ru: "— Восемь фунтов в месяц."
        note: "na miesiąc — в месяц"
    words: { "funtów": funt, "miesiąc": miesiac }
  - clean: "— Kiedy mógłbyś wyruszyć w drogę? Czy zaraz?"
    en: "“Could you start at once?”"
    chunks:
      - pl: "— Kiedy mógłbyś wyruszyć w drogę?"
        ru: "— Когда ты мог бы отправиться в путь?"
        note: "wyruszyć w drogę — отправиться в путь"
      - pl: " Czy zaraz?"
        ru: "Прямо сейчас?"
    words: { "wyruszyć": wyruszyc, "drogę": droga }
  - clean: "— Skoro tylko poczynię najpotrzebniejsze zakupy."
    en: "“As soon as I get my kit.”"
    chunks:
      - pl: "— Skoro tylko poczynię najpotrzebniejsze zakupy."
        ru: "— Как только сделаю самые необходимые покупки."
        note: "skoro tylko — как только; poczynić — книжное «сделать»"
    words: { "Skoro": skoro, "najpotrzebniejsze": potrzebny }
  - clean: "— Masz jakieś świadectwa?"
    en: "“Have you your papers?”"
    chunks:
      - pl: "— Masz jakieś świadectwa?"
        ru: "— Есть у тебя какие-нибудь документы?"
        note: "świadectwo — свидетельство, аттестат"
    words: { "Masz": miec, "jakieś": jakis }
  - clean: "— Tak, panie kapitanie."
    en: "“Yes, sir.”"
    chunks:
      - pl: "— Tak, panie kapitanie."
        ru: "— Да, капитан."
    words: { "kapitanie": kapitan }
  - clean: "Wyciągnął z kieszeni paczkę zniszczonych i zatłuszczonych papierów. Holmes przejrzał je szybko, a potem zwrócił stojącemu naprzeciw niego."
    en: "He took a sheaf of worn and greasy forms from his pocket. Holmes glanced over them and returned them."
    chunks:
      - pl: "Wyciągnął z kieszeni paczkę"
        ru: "Он вытащил из кармана пачку"
        note: "paczka — пачка, свёрток"
      - pl: " zniszczonych i zatłuszczonych papierów."
        ru: "потрёпанных и засаленных бумаг."
        note: "zatłuszczony — засаленный"
      - pl: " Holmes przejrzał je szybko,"
        ru: "Холмс быстро их просмотрел,"
        note: "przejrzeć — просмотреть"
      - pl: " a potem zwrócił stojącemu naprzeciw niego."
        ru: "а потом вернул стоявшему напротив."
        note: "zwrócić komuś — вернуть кому-л.: дательный"
    words: { "Wyciągnął": wyciagnac, "kieszeni": kieszen, "paczkę": paczka, "papierów": papier, "przejrzał": przejrzec, "zwrócił": zwrocic }
  - clean: "— Jesteś człowiekiem, jakiego potrzebuję — rzekł. — Tam na stoliku leży kontrakt. Musisz go tylko podpisać i wszystko będzie w porządku."
    en: "“You are just the man I want,” said he. “Here’s the agreement on the side-table. If you sign it the whole matter will be settled.”"
    chunks:
      - pl: "— Jesteś człowiekiem, jakiego potrzebuję —"
        ru: "— Ты как раз тот человек, который мне нужен, —"
        note: "potrzebować kogoś/czegoś — нуждаться: родительный (jakiego)"
      - pl: " rzekł. —"
        ru: "сказал он. —"
      - pl: " Tam na stoliku leży kontrakt."
        ru: "Вон на столике лежит контракт."
      - pl: " Musisz go tylko podpisać"
        ru: "Тебе нужно только его подписать,"
      - pl: " i wszystko będzie w porządku."
        ru: "и всё будет в порядке."
    words: { "jakiego": jaki, "rzekł": rzec, "stoliku": stolik, "leży": lezec, "kontrakt": kontrakt, "podpisać": podpisac }
  - clean: "Marynarz przeszedł niezgrabnie przez pokój i ujął pióro w rękę."
    en: "The seaman lurched across the room and took up the pen."
    chunks:
      - pl: "Marynarz przeszedł niezgrabnie przez pokój"
        ru: "Моряк неуклюже прошёл через комнату"
        note: "niezgrabnie — неуклюже"
      - pl: " i ujął pióro w rękę."
        ru: "и взял в руку перо."
        note: "ująć — взять, схватить"
    words: { "Marynarz": marynarz, "przeszedł": przejsc, "pokój": pokoj, "ujął": ujac, "pióro": pioro, "rękę": reka }
  - clean: "— Czy tutaj mam podpisać? — zapytał, pochylając się nad stołem."
    en: "“Shall I sign here?” he asked, stooping over the table."
    chunks:
      - pl: "— Czy tutaj mam podpisać? —"
        ru: "— Здесь подписать? —"
      - pl: " zapytał, pochylając się nad stołem."
        ru: "спросил он, наклоняясь над столом."
    words: { "tutaj": tutaj, "podpisać": podpisac, "zapytał": zapytac, "stołem": stol }
  - clean: "Holmes nagłym ruchem nachylił się nad nim i zarzucił mu obie ręce na szyję."
    en: "Holmes leaned over his shoulder and passed both hands over his neck."
    chunks:
      - pl: "Holmes nagłym ruchem nachylił się nad nim"
        ru: "Холмс резким движением наклонился над ним"
        note: "nagły — внезапный, резкий"
      - pl: " i zarzucił mu obie ręce na szyję."
        ru: "и закинул ему обе руки на шею."
        note: "zarzucić — накинуть"
    words: { "nagłym": nagly, "ruchem": ruch, "ręce": reka, "szyję": szyja }
  - clean: "— Tu właśnie! — zawołał."
    en: "“This will do,” said he."
    chunks:
      - pl: "— Tu właśnie! — zawołał."
