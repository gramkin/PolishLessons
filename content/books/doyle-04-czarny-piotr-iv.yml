  - clean: "— Opowiem panom wszystko od samego początku. Tylko, jeżeli łaska, posadźcie mnie na krześle, bo mi tak strasznie niewygodnie mówić. Było to w roku 1883, kiedy to się stało, w sierpniu. Piotr Carey był właścicielem „Narvala”, a ja drugim harpunnikiem. Już prawie wracaliśmy z Morza Lodowatego, walcząc z przeciwnymi wiatrami i olbrzymią falą morską, kiedy spotkaliśmy po drodze mały okręcik pędzony wiatrem ku północy. Na statku był tylko jeden człowiek, nasz rodak. Załoga sądziła, że okręt zatonie, i dlatego wszyscy wsiedli do łodzi ratunkowej, aby udać się ku wybrzeżom norweskim. Jak sądzę jednak, wszyscy zatonęli. Tylko sam właściciel pozostał na statku. Widząc jego rozpaczliwe położenie, wzięliśmy go na nasz pokład; kapitan Piotr Carey zabrał go do swojej kajuty i obaj prowadzili tam długie rozmowy. Jedynym pakunkiem, jaki zabrał z sobą, przechodząc na nasz okręt, była cynkowa puszka. O ile mi wiadomo, nikt nigdy nie dowiedział się jego nazwiska, zresztą już następnej nocy nieznajomy zniknął w tajemniczy sposób. Opowiadano, że albo zrozpaczony skoczył do morza, albo też zmiotła go wysoka fala, która szalała przez całą noc. Tylko jeden człowiek wiedział, co się naprawdę stało z nieznajomym, a tym człowiekiem byłem ja. Bo widziałem na własne oczy, jak Piotr Carey pochwycił go w nocy wpół i przerzucił przez burtę. Stało się to późno w nocy, na dwa dni przed tym, jak ujrzeliśmy światła i brzeg Szetlandów. Zachowałem w tajemnicy ten wypadek, czekając cierpliwie, co będzie dalej — opowiadał Cairus. — W Szkocji kapitan z łatwością zatuszował całą sprawę, nikt zresztą nie wypytywał się dokładnie. Przyjęto do wiadomości, że jakiś obcy poniósł śmierć wskutek nieszczęśliwego wypadku, nikomu nie zależało na tym, aby zbadać tę sprawę. Niedługo potem Piotr Carey sprzedał okręt i przestał polować na wieloryby. Wiele lat minęło, zanim zdołałem odszukać jego mieszkanie. Ale byłem niemal pewny, że popełnił zbrodnię dlatego, aby przywłaszczyć sobie zawartość puszki cynkowej; przypuszczałem też, że będzie mógł mi zapłacić, abym milczał dalej."
