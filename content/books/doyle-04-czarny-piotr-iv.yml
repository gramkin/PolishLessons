  - clean: "— Opowiem panom wszystko od samego początku. Tylko, jeżeli łaska, posadźcie mnie na krześle, bo mi tak strasznie niewygodnie mówić. Było to w roku 1883, kiedy to się stało, w sierpniu. Piotr Carey był kapitanem „Narwala”, a ja drugim harpunnikiem. Już prawie wracaliśmy z Morza Lodowatego, walcząc z przeciwnymi wiatrami i olbrzymią falą morską, kiedy spotkaliśmy po drodze mały okręcik pędzony wiatrem ku północy. Na statku był tylko jeden człowiek, szczur lądowy. Załoga sądziła, że okręt zatonie, i dlatego wszyscy wsiedli do łodzi ratunkowej, aby udać się ku wybrzeżom norweskim. Jak sądzę jednak, wszyscy zatonęli. Tylko sam właściciel pozostał na statku. Widząc jego rozpaczliwe położenie, wzięliśmy go na nasz pokład; kapitan Piotr Carey zabrał go do swojej kajuty i obaj prowadzili tam długie rozmowy. Jedynym pakunkiem, jaki zabrał z sobą, przechodząc na nasz okręt, była cynkowa puszka. O ile mi wiadomo, nikt nigdy nie dowiedział się jego nazwiska, zresztą już drugiej nocy nieznajomy zniknął w tajemniczy sposób. Opowiadano, że albo zrozpaczony skoczył do morza, albo też zmiotła go wysoka fala, która szalała przez całą noc. Tylko jeden człowiek wiedział, co się naprawdę stało z nieznajomym, a tym człowiekiem byłem ja. Bo widziałem na własne oczy, jak Piotr Carey pochwycił go w nocy wpół i przerzucił przez burtę. Stało się to późno w nocy, na dwa dni przed tym, jak ujrzeliśmy światła i brzeg Szetlandów. Zachowałem w tajemnicy ten wypadek, czekając cierpliwie, co będzie dalej — opowiadał Cairns. — W Szkocji kapitan z łatwością zatuszował całą sprawę, nikt zresztą nie wypytywał się dokładnie. Przyjęto do wiadomości, że jakiś obcy poniósł śmierć wskutek nieszczęśliwego wypadku, nikomu nie zależało na tym, aby zbadać tę sprawę. Niedługo potem Piotr Carey porzucił morze i przestał polować na wieloryby. Wiele lat minęło, zanim zdołałem odszukać jego mieszkanie. Ale byłem niemal pewny, że popełnił zbrodnię dlatego, aby przywłaszczyć sobie zawartość puszki cynkowej; przypuszczałem też, że będzie mógł mi zapłacić, abym milczał dalej."
    en: "“I’ll tell it you from the beginning. Just sit me up a little, so as I can speak easy. It was in ’83 that it happened—August of that year. Peter Carey was master of the Sea Unicorn, and I was spare harpooner. We were coming out of the ice-pack on our way home, with head winds and a week’s southerly gale, when we picked up a little craft that had been blown north. There was one man on her—a landsman. The crew had thought she would founder and had made for the Norwegian coast in the dinghy. I guess they were all drowned. Well, we took him on board, this man, and he and the skipper had some long talks in the cabin. All the baggage we took off with him was one tin box. So far as I know, the man’s name was never mentioned, and on the second night he disappeared as if he had never been. It was given out that he had either thrown himself overboard or fallen overboard in the heavy weather that we were having. Only one man knew what had happened to him, and that was me, for, with my own eyes, I saw the skipper tip up his heels and put him over the rail in the middle watch of a dark night, two days before we sighted the Shetland Lights. Well, I kept my knowledge to myself, and waited to see what would come of it. When we got back to Scotland it was easily hushed up, and nobody asked any questions. A stranger died by accident and it was nobody’s business to inquire. Shortly after Peter Carey gave up the sea, and it was long years before I could find where he was. I guessed that he had done the deed for the sake of what was in that tin box, and that he could afford now to pay me well for keeping my mouth shut."
