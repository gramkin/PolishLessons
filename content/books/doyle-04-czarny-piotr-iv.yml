  - clean: "Za pośrednictwem pewnego majtka, który spotkał Czarnego Piotra w Londynie, dowiedziałem się, gdzie mieszka, i udałem się do niego, by zażądać nagrody za milczenie. Pierwszej nocy mówił ze mną bardzo rozsądnie i oświadczył, że gotów jest mi dać pewną sumę, która by wystarczyła mi na życie i pozwoliła porzucić żmudną pracę na morzu. W dwa dni później mieliśmy ostatecznie załatwić sprawę. Kiedy przyszedłem, kapitan był prawie zupełnie pijany, we wściekłym humorze. Usiedliśmy przy stole, zaczęliśmy pić i rozmawiać o dawnych, razem spędzonych czasach; ale im więcej pił, tym mniej podobał mi się jego wyraz twarzy."
