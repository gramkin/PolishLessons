  - clean: "Teraz opowiem panom najzabawniejszą część całej historii. Ledwie wyszedłem z kabiny, usłyszałem nagle jakiś szmer. Cofnąłem się ze ścieżki i ukryłem się w pobliskich zaroślach. Jakiś człowiek skradał się ku chacie, wszedł do środka, krzyknął, jak gdyby zobaczył upiora, a potem zaczął uciekać nieprzytomny, gdzie go oczy niosły, aż wreszcie zginął w oddali. Kto to był albo też czego chciał, nie umiem odgadnąć. Gdy już zniknął w ciemnościach nocy, ruszyłem w drogę; przeszedłem dziesięć mil piechotą, w Tunbridge Wells wsiadłem do pociągu i przybyłem do Londynu, a nikt się o niczym nie dowiedział."
    en: "“Now I’ll tell you the queerest part of the whole story. I had hardly got outside the hut when I heard someone coming, and I hid among the bushes. A man came slinking along, went into the hut, gave a cry as if he had seen a ghost, and legged it as hard as he could run until he was out of sight. Who he was or what he wanted is more than I can tell. For my part I walked ten miles, got a train at Tunbridge Wells, and so reached London, and no one the wiser."
