  - clean: "— Po prostu dlatego, że od początku miałem szczęście trafić na właściwą wskazówkę. I nie zaprzeczam wcale, że gdybym od razu wiedział o tym znalezionym notatniku, może i mnie wprowadziłby na fałszywy trop, jak stało się to z panem. Ale wszystko, co słyszałem i wiedziałem, kazało mi iść właśnie w tym, a nie innym kierunku. Ta zdumiewająca siła fizyczna, ta zręczność w rzucaniu harpunem, rozwodniony rum, ten kapciuch ze skóry psa morskiego, napełniony grubym, lichym tytoniem — wszystko dowodziło, że zbrodnię popełnił marynarz, i to poławiacz wielorybów. Byłem też stanowczo przekonany, że inicjały P. C. na kapciuchu były tylko przypadkowym zbiegiem okoliczności, a nie inicjałami Piotra Careya, co wynikało już z tego, że — jak zeznała rodzina — palił niewiele, a przy tym nie znaleziono fajki w jego kabinie. Przypomina pan sobie zapewne, że pytałem, czy znajdowała się tam whisky, czy brandy. A czy sądzi pan, że można by znaleźć jakiegoś szczura lądowego, który mając do dyspozycji rozmaite wódki, piłby rum? Tak jest, panie Hopkins, byłem pewny, że sprawca jest marynarzem."
