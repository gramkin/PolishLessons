  - clean: "Kiedy wreszcie znalazłem sposobność, aby otworzyć puszkę, przekonałem się, że nie było w niej pieniędzy, lecz papiery wartościowe. A papierów nie śmiałem sprzedawać. Tak więc straciłem moc nad Czarnym Piotrem i zostałem w Londynie bez szylinga w kieszeni. Trzeba się było obejrzeć za jakimś zajęciem. Wtedy znalazłem to ogłoszenie, zachęciła mnie wysoka płaca, poszedłem do ajenta okrętowego, a on przysłał mnie tutaj. To wszystko, co wiem. I powtarzam: za to, że zabiłem Czarnego Piotra, sąd powinien mi być tylko wdzięczny, ponieważ oszczędziłem sprawiedliwości kosztów konopnego sznura do szubienicy."
