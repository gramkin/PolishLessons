chapter: 14
chapterTitle: "Pieśń XIV"
chapterTitleRu: "Песнь XIV. Гвидо дель Дука"
level: B2
paragraphs:
  - clean: "(Gwido del Duka i Renier de Kalboli. Przeciw Florencji i Pizie.)"
    chunks:
      - pl: "(Gwido del Duka i Renier de Kalboli. Przeciw Florencji i Pizie.)"
        ru: "(Гвидо дель Дука и Риньер да Кальболи. Против Флоренции и Пизы.)"
  - clean: "«Nie wiesz, kto wkoło naszej góry kroczy,\nWprzód nim śmierć jemu dała polot chyży,\nCo jak chce, mruży i otwiera oczy?»\n«Wiem, że tu idą jacyś dwaj przychodnie;\nKto on, ja nie wiem: ty, co stoisz bliżej,\nAby rad odrzekł, zapytaj łagodnie»."
    verse: true
    chunks:
      - pl: "«Nie wiesz, kto wkoło naszej góry kroczy,"
        ru: "«Не знаешь, кто это шагает вокруг нашей горы,"
      - pl: "\nWprzód nim śmierć jemu dała polot chyży,"
        ru: "прежде чем смерть дала ему быстрый полёт,"
        note: "polot — полёт; chyży — быстрый"
      - pl: "\nCo jak chce, mruży i otwiera oczy?»"
        ru: "кто, как хочет, жмурит и открывает глаза?»"
      - pl: "\n«Wiem, że tu idą jacyś dwaj przychodnie;"
        ru: "«Знаю, что здесь идут какие-то двое пришельцев;"
        note: "przychodzień — пришелец"
      - pl: "\nKto on, ja nie wiem: ty, co stoisz bliżej,"
        ru: "кто он, я не знаю: ты, что стоишь ближе,"
      - pl: "\nAby rad odrzekł, zapytaj łagodnie»."
        ru: "спроси ласково, чтобы он охотно ответил»."
    words: { "oczy": oko, "śmierć": smierc, "otwiera": otwierac, "stoisz": stac, "bliżej": blisko, "zapytaj": zapytac }
  - clean: "Tak wsparte jeden na drugim dwa duchy,\nOde mnie w prawo między sobą gwarzą.\nJeden z nich bliższy, z podniesioną twarzą,\nRzekł do mnie: «Duchu, co w ciele zamknięty\nIdziesz ku niebu jak wpół wniebowzięty,\nPociesz nas, nie bądź naszym prośbom głuchy,\nMów, skąd i ktoś jest? widna łaska boża,\nJaka twą duszę w tobie uwielmoża,\nO tyle sobą nas tu zachwyciła,\nJak chce rzecz nowa, co nigdy nie była»."
    verse: true
    chunks:
      - pl: "Tak wsparte jeden na drugim dwa duchy,"
        ru: "Так два духа, опершись один на другого,"
      - pl: "\nOde mnie w prawo między sobą gwarzą."
        ru: "справа от меня переговариваются между собой."
      - pl: "\nJeden z nich bliższy, z podniesioną twarzą,"
        ru: "Один из них, ближний, подняв лицо,"
      - pl: "\nRzekł do mnie: «Duchu, co w ciele zamknięty"
        ru: "сказал мне: «Дух, что, заключённый в тело,"
      - pl: "\nIdziesz ku niebu jak wpół wniebowzięty,"
        ru: "идёшь к небу, как наполовину вознесённый,"
      - pl: "\nPociesz nas, nie bądź naszym prośbom głuchy,"
        ru: "утешь нас, не будь глух к нашим просьбам,"
      - pl: "\nMów, skąd i ktoś jest? widna łaska boża,"
        ru: "скажи, откуда и кто ты? видна Божья милость,"
      - pl: "\nJaka twą duszę w tobie uwielmoża,"
        ru: "что возвеличивает твою душу в тебе,"
        note: "uwielmożyć — возвеличить"
      - pl: "\nO tyle sobą nas tu zachwyciła,"
        ru: "настолько она здесь восхитила нас собой,"
      - pl: "\nJak chce rzecz nowa, co nigdy nie była»."
        ru: "как требует новая вещь, какой никогда не бывало»."
    words: { "wsparte": wesprzec, "Rzekł": rzec, "Pociesz": pocieszyc, "prośbom": prosba, "głuchy": gluchy, "zachwyciła": zachwycic }
  - clean: "A ja: «Przez środek Toskaniji płynie\nNiewielka rzeka, co krynicą małą\nLedwo się sączy z góry Falterona,\nA stumilowym ujściem nieznużona.\nPrzy jej wybrzeżu oblokłem się w ciało.\nMówiąc, kto jestem, rzekłbym słowa marne,\nBo imię moje jeszcze dość nie słynie»."
    verse: true
    chunks:
      - pl: "A ja: «Przez środek Toskaniji płynie"
        ru: "А я: «Посреди Тосканы течёт"
      - pl: "\nNiewielka rzeka, co krynicą małą"
        ru: "небольшая река, что малым родником"
      - pl: "\nLedwo się sączy z góry Falterona,"
        ru: "едва сочится с горы Фальтерона,"
      - pl: "\nA stumilowym ujściem nieznużona."
        ru: "а неутомима в стомильном течении."
        note: "stumilowy — стомильный"
      - pl: "\nPrzy jej wybrzeżu oblokłem się w ciało."
        ru: "На её берегу я облёкся в тело."
        note: "oblec się — облечься"
      - pl: "\nMówiąc, kto jestem, rzekłbym słowa marne,"
        ru: "Говоря, кто я, я сказал бы пустые слова,"
      - pl: "\nBo imię moje jeszcze dość nie słynie»."
        ru: "ибо моё имя ещё недостаточно славно»."
    words: { "środek": srodek, "Niewielka": niewielki, "rzeka": rzeka, "Ledwo": ledwo, "wybrzeżu": wybrzeze, "ciało": cialo }
  - clean: "Duch odpowiedział, ten co pierwszy pytał:\n«Jeślim rozmowy twojej myśl wyczytał,\nPod jej zasłoną widzę rzekę Arnę».\nA drugi rzekł doń: «Dlaczego nazwisko\nUkrył tej rzeki jak na pośmiewisko?»\nCień zagadnięty na to odparł żywo:\n«Nie wiem, lecz żadne nie będzie w tym dziwo,\nGdy takiej rzeki nazwisko zaginie."
    verse: true
    chunks:
      - pl: "Duch odpowiedział, ten co pierwszy pytał:"
        ru: "Дух, тот, что первым спрашивал, ответил:"
      - pl: "\n«Jeślim rozmowy twojej myśl wyczytał,"
        ru: "«Если я вычитал мысль твоей речи,"
      - pl: "\nPod jej zasłoną widzę rzekę Arnę»."
        ru: "под её покровом я вижу реку Арно»."
      - pl: "\nA drugi rzekł doń: «Dlaczego nazwisko"
        ru: "А второй сказал ему: «Почему он скрыл"
      - pl: "\nUkrył tej rzeki jak na pośmiewisko?»"
        ru: "название этой реки, как на посмешище?»"
        note: "pośmiewisko — посмешище"
      - pl: "\nCień zagadnięty na to odparł żywo:"
        ru: "Тень, к которой обратились, на это живо ответила:"
        note: "zagadnięty — спрошенный"
      - pl: "\n«Nie wiem, lecz żadne nie będzie w tym dziwo,"
        ru: "«Не знаю, но не будет в этом никакого чуда,"
      - pl: "\nGdy takiej rzeki nazwisko zaginie."
        ru: "если имя такой реки пропадёт."
    words: { "odpowiedział": odpowiedziec, "zasłoną": zaslona, "Ukrył": ukryc, "Cień": cien, "odparł": odeprzec, "zaginie": zaginac }
  - clean: "Bo od jej źródła, kędy Apeniny,\nOd których morzem odcięte Peloro,\nToną w powietrzu jako obłok siny,\nAż do jej kresu, gdzie powraca szkody\nZrządzone morzu przez ubytek wody,\nJaką zeń chmury w dni słoneczne biorą,\nWszyscy od cnoty stronią jak od węża,\nTak lud w tym kraju zły nałóg zwycięża!"
    verse: true
    chunks:
      - pl: "Bo od jej źródła, kędy Apeniny,"
        ru: "Ибо от её истока, где Апеннины,"
      - pl: "\nOd których morzem odcięte Peloro,"
        ru: "от которых морем отрезан Пелоро,"
        note: "мыс Пелор в Сицилии"
      - pl: "\nToną w powietrzu jako obłok siny,"
        ru: "тонут в воздухе, как сизое облако,"
      - pl: "\nAż do jej kresu, gdzie powraca szkody"
        ru: "и до её конца, где она возвращает убыль,"
        note: "ubytek — убыль"
      - pl: "\nZrządzone morzu przez ubytek wody,"
        ru: "причинённую морю убылью воды,"
      - pl: "\nJaką zeń chmury w dni słoneczne biorą,"
        ru: "которую тучи забирают из него в солнечные дни,"
      - pl: "\nWszyscy od cnoty stronią jak od węża,"
        ru: "все бегут от добродетели, как от змеи,"
      - pl: "\nTak lud w tym kraju zły nałóg zwycięża!"
        ru: "так дурная привычка одолевает народ в этом краю!"
    words: { "źródła": zrodlo, "odcięte": odciac, "kresu": kres, "chmury": chmura, "słoneczne": sloneczny, "węża": waz }
  - clean: "Tam ludzie tak swą naturę zmienili,\nJakby się Cyrcy karmią utuczyli.\nPośród tych wieprzów, o wspomnieć bolesno!\nGodnych przeżuwać chyba żołędź leśną,\nNie owoc dany na pokarm człowieka,\nZrazu nurt wąski toruje ta rzeka,\nW kolej zstępując korytem pochyłem,\nSpotyka małe kundle, które warczą,\nWięcej niż siły na ich wark wystarczą:\nZe wzgardą do nich obraca się tyłem\nI szybko płynie; im bystrzej przecieka\nTa nieszczęśliwa i przeklęta rzeka\nWita psy, co się mianują wilkami;"
    verse: true
    chunks:
      - pl: "Tam ludzie tak swą naturę zmienili,"
        ru: "Там люди так изменили свою природу,"
      - pl: "\nJakby się Cyrcy karmią utuczyli."
        ru: "будто откормились пищей Цирцеи."
        note: "utuczyć się — откормиться"
      - pl: "\nPośród tych wieprzów, o wspomnieć bolesno!"
        ru: "Среди этих свиней, о, больно вспомнить!"
        note: "wieprz — боров"
      - pl: "\nGodnych przeżuwać chyba żołędź leśną,"
        ru: "достойных жевать разве что лесные жёлуди,"
        note: "żołędź — жёлудь"
      - pl: "\nNie owoc dany na pokarm człowieka,"
        ru: "а не плод, данный в пищу человеку,"
      - pl: "\nZrazu nurt wąski toruje ta rzeka,"
        ru: "сперва эта река прокладывает узкое течение,"
      - pl: "\nW kolej zstępując korytem pochyłem,"
        ru: "потом, спускаясь покатым руслом,"
      - pl: "\nSpotyka małe kundle, które warczą,"
        ru: "встречает маленьких шавок, что рычат,"
        note: "kundel — шавка; warczeć — рычать"
      - pl: "\nWięcej niż siły na ich wark wystarczą:"
        ru: "больше, чем хватает сил на их рычание:"
      - pl: "\nZe wzgardą do nich obraca się tyłem"
        ru: "с презрением она поворачивается к ним задом"
      - pl: "\nI szybko płynie; im bystrzej przecieka"
        ru: "и быстро течёт; чем стремительнее протекает"
      - pl: "\nTa nieszczęśliwa i przeklęta rzeka"
        ru: "эта несчастная и проклятая река,"
      - pl: "\nWita psy, co się mianują wilkami;"
        ru: "она встречает псов, что называют себя волками;"
        note: "mianować się — называть себя"
    words: { "naturę": natura, "karmią": karmic, "owoc": owoc, "kolej": kolej, "nieszczęśliwa": nieszczesliwy, "przeklęta": przeklety }
  - clean: "Potem głębszymi werznięta brzegami,\nSpotyka lisy, co chytrzy i zdradni\nOdwietrzą łatwo przynętę w zapadni.\nRad prorokuję, choć wobec słuchacza,\nW korzyść mu pójdzie widzieć obraz czasu,\nJaki duch prawdy przede mną roztacza."
    verse: true
    chunks:
      - pl: "Potem głębszymi werznięta brzegami,"
        ru: "потом, врезанная более глубокими берегами,"
      - pl: "\nSpotyka lisy, co chytrzy i zdradni"
        ru: "встречает лис, что, хитрые и коварные,"
        note: "zdradny — коварный"
      - pl: "\nOdwietrzą łatwo przynętę w zapadni."
        ru: "легко учуют приманку в западне."
        note: "odwietrzyć — учуять; zapadnia — западня"
      - pl: "\nRad prorokuję, choć wobec słuchacza,"
        ru: "Охотно пророчествую, хоть и при слушателе:"
      - pl: "\nW korzyść mu pójdzie widzieć obraz czasu,"
        ru: "пойдёт ему на пользу видеть образ времени,"
      - pl: "\nJaki duch prawdy przede mną roztacza."
        ru: "что дух истины раскрывает передо мной."
    words: { "głębszymi": gleboki, "brzegami": brzeg, "Spotyka": spotykac, "przynętę": przyneta, "korzyść": korzysc, "duch": duch }
  - clean: "Widzę synowca twego, bohatera,\nKtóry tych wilków staje się myśliwcem;\nRzęże jak bydlę, ścierw ich kupczy żywcem,\nBiorąc im życie sobie cześć odbiera.\nWychodzi krwawy ze smutnego lasu,\nKtóry od dzisiaj wyschłych aż do rdzeni\nDrzew i za tysiąc lat nie zazieleni»."
    verse: true
    chunks:
      - pl: "Widzę synowca twego, bohatera,"
        ru: "Вижу твоего племянника, героя,"
        note: "synowiec — племянник; Фульчери да Кальболи"
      - pl: "\nKtóry tych wilków staje się myśliwcem;"
        ru: "который становится охотником на этих волков;"
      - pl: "\nRzęże jak bydlę, ścierw ich kupczy żywcem,"
        ru: "режет, как скот, их падаль торгует живьём,"
        note: "rzezać — резать; ścierw — падаль; kupczyć — торговать"
      - pl: "\nBiorąc im życie sobie cześć odbiera."
        ru: "отнимая у них жизнь, у себя отнимает честь."
      - pl: "\nWychodzi krwawy ze smutnego lasu,"
        ru: "Выходит окровавленный из печального леса,"
        note: "Флоренции"
      - pl: "\nKtóry od dzisiaj wyschłych aż do rdzeni"
        ru: "который от сегодняшнего дня, засохший до сердцевины"
      - pl: "\nDrzew i za tysiąc lat nie zazieleni»."
        ru: "деревьев, и за тысячу лет не зазеленеет»."
    words: { "bohatera": bohater, "odbiera": odbierac, "krwawy": krwawy, "smutnego": smutny, "rdzeni": rdzen, "Drzew": drzewo }
  - clean: "Jak na wieść smutną proroczego ducha,\nMiesza się, blednie twarz tego, co słucha,\nZ jakiej bądź strony nań godzi nieszczęście:\nPodobnie drugi cień, który, jak sądzę,\nAżeby słuchać, ku nam się obrócił,\nWyraźnie w twarzy mieszał się i smucił,\nPocierał czoło i zaciskał pięście,\nGdy te do niego dochodziły słowa."
    verse: true
    chunks:
      - pl: "Jak na wieść smutną proroczego ducha,"
        ru: "Как от печальной вести пророческого духа"
      - pl: "\nMiesza się, blednie twarz tego, co słucha,"
        ru: "смущается, бледнеет лицо того, кто слушает,"
      - pl: "\nZ jakiej bądź strony nań godzi nieszczęście:"
        ru: "с какой бы стороны на него ни грозило несчастье:"
      - pl: "\nPodobnie drugi cień, który, jak sądzę,"
        ru: "так и другая тень, которая, как я полагаю,"
      - pl: "\nAżeby słuchać, ku nam się obrócił,"
        ru: "чтобы слушать, повернулась к нам,"
      - pl: "\nWyraźnie w twarzy mieszał się i smucił,"
        ru: "явно смущалась и печалилась в лице,"
      - pl: "\nPocierał czoło i zaciskał pięście,"
        ru: "тёрла лоб и сжимала кулаки,"
      - pl: "\nGdy te do niego dochodziły słowa."
        ru: "когда эти слова доходили до неё."
    words: { "Miesza": mieszac, "nieszczęście": nieszczescie, "Podobnie": podobnie, "obrócił": obrocic, "czoło": czolo, "dochodziły": dochodzic }
  - clean: "Postać drugiego i pierwszego mowa,\nWiedzieć, kto oni, wzbudziła mą żądzę.\nModląc się prawie błagałem ich o to:\nPrzeto duch pierwszy jął mówić z ochotą:\n«Ty chcesz to wymóc na mojej osobie,\nCzegoś nie zrobił dla mnie; lecz gdy w tobie\nZnak bożej łaski tak widomie pała,\nDla cię nie będą skąpe usta moje:\nGwido del Duka tu przed tobą stoję;\nKrew niegdyś we mnie tak zawiścią wrzała,\nŻe gdybym spotkał wesołość człowieka,\nWidziałbyś bladość, jak mą twarz powleka."
    verse: true
    chunks:
      - pl: "Postać drugiego i pierwszego mowa,"
        ru: "Облик второго и речь первого"
      - pl: "\nWiedzieć, kto oni, wzbudziła mą żądzę."
        ru: "пробудили во мне желание знать, кто они."
      - pl: "\nModląc się prawie błagałem ich o to:"
        ru: "Почти молясь, я умолял их об этом:"
      - pl: "\nPrzeto duch pierwszy jął mówić z ochotą:"
        ru: "потому первый дух начал говорить с охотой:"
      - pl: "\n«Ty chcesz to wymóc na mojej osobie,"
        ru: "«Ты хочешь добиться от моей особы того,"
        note: "wymóc — добиться"
      - pl: "\nCzegoś nie zrobił dla mnie; lecz gdy w tobie"
        ru: "чего не сделал для меня; но раз в тебе"
      - pl: "\nZnak bożej łaski tak widomie pała,"
        ru: "знак Божьей милости так явно пылает,"
        note: "widomie — явно"
      - pl: "\nDla cię nie będą skąpe usta moje:"
        ru: "для тебя мои уста не будут скупы:"
      - pl: "\nGwido del Duka tu przed tobą stoję;"
        ru: "я, Гвидо дель Дука, стою здесь перед тобой;"
      - pl: "\nKrew niegdyś we mnie tak zawiścią wrzała,"
        ru: "кровь некогда так кипела во мне завистью,"
      - pl: "\nŻe gdybym spotkał wesołość człowieka,"
        ru: "что, если бы я встретил весёлость человека,"
      - pl: "\nWidziałbyś bladość, jak mą twarz powleka."
        ru: "ты увидел бы, как бледность покрывает моё лицо."
    words: { "Postać": postac, "Modląc": modlic, "błagałem": blagac, "ochotą": ochota, "bożej": bozy, "usta": usta }
  - clean: "Patrz, z mojej siejby jaką żnę tu słomę!\nPrzecz w to, o ludzie, kłaść serce łakome,\nGdzie jedno dobro, łechcąc wasze chcenia,\nDrugiego dobra pragnie wyłączenia?\nPatrz, Rinieri, skarb Kalbolich domu,\nSpadek cnót jego nie dany nikomu."
    verse: true
    chunks:
      - pl: "Patrz, z mojej siejby jaką żnę tu słomę!"
        ru: "Смотри, какую солому я жну здесь со своего посева!"
        note: "siejba — посев"
      - pl: "\nPrzecz w to, o ludzie, kłaść serce łakome,"
        ru: "Зачем, о люди, вкладывать в то жадное сердце,"
      - pl: "\nGdzie jedno dobro, łechcąc wasze chcenia,"
        ru: "где одно благо, щекоча ваши желания,"
      - pl: "\nDrugiego dobra pragnie wyłączenia?"
        ru: "жаждет исключения другого блага?"
        note: "wyłączenie — исключение"
