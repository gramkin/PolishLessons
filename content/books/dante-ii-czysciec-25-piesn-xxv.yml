level: B2
paragraphs:
  - clean: "(W drodze do kręgu VII. Rozprawa o powstaniu duszy, o śmierci i cieniach. Krąg VII. Rozpustnicy wśród płomieni i burzy.)"
    chunks:
      - pl: "(W drodze do kręgu VII. Rozprawa o powstaniu duszy, o śmierci i cieniach. Krąg VII. Rozpustnicy wśród płomieni i burzy.)"
        ru: "(По дороге к кругу VII. Рассуждение о происхождении души, о смерти и тенях. Круг VII. Сладострастники среди пламени и бури.)"
        note: "rozprawa — рассуждение; rozpustnik — сладострастник"
    words: { "kręgu": krag, "Rozprawa": rozprawa, "duszy": dusza, "śmierci": smierc, "płomieni": plomien, "burzy": burza }
  - clean: "Była godzina niecierpiąca zwłoki,\nBo ustąpiły kręgu południka\nNoc dla Skorpiona, a słońce dla Byka.\nJak robi człowiek naglący swe kroki,\nCo bądź napotka, idzie swoją drogą,\nJeśli potrzeba, bodzie go ostrogą."
    verse: true
    chunks:
      - pl: "Była godzina niecierpiąca zwłoki,"
        ru: "Был час, не терпящий промедления,"
      - pl: "\nBo ustąpiły kręgu południka"
        ru: "ибо круг меридиана уступили"
      - pl: "\nNoc dla Skorpiona, a słońce dla Byka."
        ru: "ночь — Скорпиону, а солнце — Тельцу."
        note: "Byk — Телец"
      - pl: "\nJak robi człowiek naglący swe kroki,"
        ru: "Как поступает человек, торопящий свои шаги,"
      - pl: "\nCo bądź napotka, idzie swoją drogą,"
        ru: "что бы ни встретил, идёт своей дорогой,"
      - pl: "\nJeśli potrzeba, bodzie go ostrogą."
        ru: "если нужда колет его шпорой."
    words: { "godzina": godzina, "niecierpiąca": cierpiec, "słońce": slonce, "Byka": byk, "napotka": napotkac, "potrzeba": potrzeba }
  - clean: "Jakeśmy weszli w sklepiony loch skały,\nJeden za drugim, bo w chwili przechodu\nNas rozdzieliła zbytnia ważkość schodu.\nJak chęć latania czując bocian mały,\nPodnosi skrzydła, to spuszcza koleją,\nGdy te już gniazda porzucić nie śmieją:\nTak zapytania chęć we mnie paliła,\nTo zapalała siebie, to gasiła,\nAżem poruszył wargą, jak gotowy\nCzłowiek przemówić gorącymi słowy."
    verse: true
    chunks:
      - pl: "Jakeśmy weszli w sklepiony loch skały,"
        ru: "Так мы вошли в сводчатый проход скалы,"
      - pl: "\nJeden za drugim, bo w chwili przechodu"
        ru: "один за другим, ибо в миг перехода"
      - pl: "\nNas rozdzieliła zbytnia ważkość schodu."
        ru: "нас разделила чрезмерная узость ступеней."
        note: "ważkość — здесь «узость»"
      - pl: "\nJak chęć latania czując bocian mały,"
        ru: "Как маленький аист, чувствуя желание летать,"
      - pl: "\nPodnosi skrzydła, to spuszcza koleją,"
        ru: "поднимает крылья, то опускает по очереди,"
      - pl: "\nGdy te już gniazda porzucić nie śmieją:"
        ru: "когда они ещё не смеют покинуть гнездо:"
      - pl: "\nTak zapytania chęć we mnie paliła,"
        ru: "так во мне горело желание спросить,"
      - pl: "\nTo zapalała siebie, to gasiła,"
        ru: "то зажигалось, то гасло,"
      - pl: "\nAżem poruszył wargą, jak gotowy"
        ru: "пока я не пошевелил губой, как готовый"
      - pl: "\nCzłowiek przemówić gorącymi słowy."
        ru: "заговорить горячими словами человек."
    words: { "sklepiony": sklepic, "Podnosi": podnosic, "gniazda": gniazdo, "poruszył": poruszyc, "wargą": warga, "przemówić": przemowic }
  - clean: "A chociaż szliśmy dość szybko tą razą,\nOjciec mój rzekł mi: «Puszczaj strzałę słowa,\nWidzę nagiąłeś łuk aż po żelazo».\nWtedy ja usta otworzyłem śmiało:\n— «Jak można schudnąć, tam gdzie was nie bodzie\nPotrzeba łaknąć pokarmu o głodzie?»"
    verse: true
    chunks:
      - pl: "A chociaż szliśmy dość szybko tą razą,"
        ru: "И хотя мы шли на этот раз довольно быстро,"
      - pl: "\nOjciec mój rzekł mi: «Puszczaj strzałę słowa,"
        ru: "мой отец сказал мне: «Пускай стрелу слова,"
      - pl: "\nWidzę nagiąłeś łuk aż po żelazo»."
        ru: "вижу, ты натянул лук до самого железа»."
      - pl: "\nWtedy ja usta otworzyłem śmiało:"
        ru: "Тогда я смело открыл уста:"
      - pl: "\n— «Jak można schudnąć, tam gdzie was nie bodzie"
        ru: "— «Как можно похудеть там, где вас не колет"
      - pl: "\nPotrzeba łaknąć pokarmu o głodzie?»"
        ru: "нужда жаждать пищи в голод?»"
    words: { "rzekł": rzec, "Puszczaj": puszczac, "strzałę": strzala, "żelazo": zelazo, "usta": usta, "głodzie": glod }
  - clean: "A mistrz: «To dla cię zaiste rzecz nowa,\nLecz gdybyś żywiej w swej myśli przedstawił,\nJak się trawiło Meleagra ciało,\nW miarę jak ogień suche drewno trawił;\nGdybyś uważał, jako w jednym czasie,\nLedwo twa postać po zwierciadle wionie,\nCały twój obraz w jego szkle już tonie,\nCo było twardym, wnet ci miękkim zda się."
    verse: true
    chunks:
      - pl: "A mistrz: «To dla cię zaiste rzecz nowa,"
        ru: "А учитель: «Это для тебя воистину вещь новая,"
      - pl: "\nLecz gdybyś żywiej w swej myśli przedstawił,"
        ru: "но если бы ты живее представил себе в мысли,"
      - pl: "\nJak się trawiło Meleagra ciało,"
        ru: "как истаивало тело Мелеагра,"
      - pl: "\nW miarę jak ogień suche drewno trawił;"
        ru: "по мере того как огонь пожирал сухое полено,"
        note: "trawić — пожирать"
      - pl: "\nGdybyś uważał, jako w jednym czasie,"
        ru: "если бы ты обратил внимание, как в одно время,"
      - pl: "\nLedwo twa postać po zwierciadle wionie,"
        ru: "едва твой облик повеет по зеркалу,"
      - pl: "\nCały twój obraz w jego szkle już tonie,"
        ru: "весь твой образ уже тонет в его стекле, —"
      - pl: "\nCo było twardym, wnet ci miękkim zda się."
        ru: "то, что было твёрдым, тотчас показалось бы тебе мягким."
    words: { "żywiej": zywo, "miarę": miara, "suche": suchy, "drewno": drewno, "szkle": szklo, "miękkim": miekki }
  - clean: "Oto przeze mnie Stacyjusz wezwany\nRaczy lekarzem być na twoje rany».\nStacjusz: «Jeśli widzisz być koniecznym,\nBym wobec ciebie o karaniu wiecznym\nRozprawiał przed nim, niech to mię wymówi,\nŻe, uczeń, nie śmiem zaprzeczać mistrzowi»."
    verse: true
    chunks:
      - pl: "Oto przeze mnie Stacyjusz wezwany"
        ru: "Вот Стаций, призванный мной,"
      - pl: "\nRaczy lekarzem być na twoje rany»."
        ru: "соизволит быть лекарем для твоих ран»."
      - pl: "\nStacjusz: «Jeśli widzisz być koniecznym,"
        ru: "Стаций: «Если ты видишь необходимость,"
      - pl: "\nBym wobec ciebie o karaniu wiecznym"
        ru: "чтобы я в твоём присутствии о вечной каре"
      - pl: "\nRozprawiał przed nim, niech to mię wymówi,"
        ru: "рассуждал перед ним, пусть меня извинит"
      - pl: "\nŻe, uczeń, nie śmiem zaprzeczać mistrzowi»."
        ru: "то, что я, ученик, не смею противоречить учителю»."
    words: { "koniecznym": konieczny, "karaniu": karac, "wiecznym": wieczny, "uczeń": uczen, "zaprzeczać": zaprzeczac, "mistrzowi": mistrz }
  - clean: "A do mnie: «Synu, słuchaj, moje słowo\nNa twe pytanie rzuci światłość nową.\nKrew niewypita przez spragnione żyły,\nKtóra zostaje jak zbytnia potrawa,\nGdy syty ucztą gość od stołu wstawa,\nPrzeczysta, w sercu bierze treść tej siły,\nKtóra ukształca wszystkie członki wasze\nJak ta, co wsiąkać w te członki stworzona,\nKrąży po żyłach. A lepiej strawiona\nSchodzi w część ciała, którą tu w mym rymie\nLepiej przemilczeć niż nazwać na imię."
    verse: true
    chunks:
      - pl: "A do mnie: «Synu, słuchaj, moje słowo"
        ru: "А мне: «Сын, слушай: моё слово"
      - pl: "\nNa twe pytanie rzuci światłość nową."
        ru: "бросит новый свет на твой вопрос."
      - pl: "\nKrew niewypita przez spragnione żyły,"
        ru: "Кровь, не выпитая жаждущими жилами,"
      - pl: "\nKtóra zostaje jak zbytnia potrawa,"
        ru: "что остаётся, как лишнее кушанье,"
      - pl: "\nGdy syty ucztą gość od stołu wstawa,"
        ru: "когда сытый пиром гость встаёт из-за стола,"
      - pl: "\nPrzeczysta, w sercu bierze treść tej siły,"
        ru: "пречистая, в сердце принимает суть той силы,"
      - pl: "\nKtóra ukształca wszystkie członki wasze"
        ru: "что образует все ваши члены,"
      - pl: "\nJak ta, co wsiąkać w te członki stworzona,"
        ru: "как та, что, созданная впитываться в эти члены,"
      - pl: "\nKrąży po żyłach. A lepiej strawiona"
        ru: "кружит по жилам. А лучше переваренная,"
      - pl: "\nSchodzi w część ciała, którą tu w mym rymie"
        ru: "сходит в часть тела, которую здесь, в моём стихе,"
      - pl: "\nLepiej przemilczeć niż nazwać na imię."
        ru: "лучше обойти молчанием, чем назвать по имени."
    words: { "niewypita": wypic, "spragnione": spragniony, "stołu": stol, "Krąży": krazyc, "żyłach": zyla, "Schodzi": schodzic }
  - clean: "Stamtąd kroplami na krew drugą wpływa\nDrugiej istoty, w przyrodzoną czaszę.\nTam wspólny pociąg dwie treści ożenią,\nJedną skłonioną przyjmować wrażenia,\nA drugą działać, gdy ta oddziaływa.\nWtenczas ojcowska krew działać zaczyna,\nZrazu tężejąc, w kolej treść stężałą\nOżywia jako mające żyć ciało."
    verse: true
    chunks:
      - pl: "Stamtąd kroplami na krew drugą wpływa"
        ru: "Оттуда каплями она втекает на другую кровь"
      - pl: "\nDrugiej istoty, w przyrodzoną czaszę."
        ru: "другого существа, в природную чашу."
      - pl: "\nTam wspólny pociąg dwie treści ożenią,"
        ru: "Там общее влечение соединяет две сути:"
      - pl: "\nJedną skłonioną przyjmować wrażenia,"
        ru: "одну, склонную принимать впечатления,"
      - pl: "\nA drugą działać, gdy ta oddziaływa."
        ru: "а другую — действовать, когда та воздействует."
      - pl: "\nWtenczas ojcowska krew działać zaczyna,"
        ru: "Тогда отцовская кровь начинает действовать,"
      - pl: "\nZrazu tężejąc, w kolej treść stężałą"
        ru: "сперва сгущаясь, потом сгустившуюся суть"
      - pl: "\nOżywia jako mające żyć ciało."
        ru: "оживляет, как тело, которому предстоит жить."
    words: { "Stamtąd": stamtad, "wpływa": wplywac, "istoty": istota, "ożenią": ozenic, "przyjmować": przyjmowac, "kolej": kolej }
  - clean: "Krew rodzicielska swoją treścią czynną,\nKiedy już duszą staje się roślinną\nI żyć, i rosnąć pocznie jak roślina,\n(Lecz z tą różnicą, gdy ta jest już w brzegu,\nTamta na drogę wchodzi w pełnym biegu),\nZrazu tak działa, że już się mocuje\nJak morska gąbka rusza się i czuje;\nI wnet rozwija dane przyrodzeniem\nWładze człowieka, których jest nasieniem."
    verse: true
    chunks:
      - pl: "Krew rodzicielska swoją treścią czynną,"
        ru: "Родительская кровь своей деятельной сутью,"
      - pl: "\nKiedy już duszą staje się roślinną"
        ru: "когда уже становится растительной душой"
      - pl: "\nI żyć, i rosnąć pocznie jak roślina,"
        ru: "и начнёт жить и расти, как растение,"
      - pl: "\n(Lecz z tą różnicą, gdy ta jest już w brzegu,"
        ru: "(но с той разницей, что та уже у берега,"
      - pl: "\nTamta na drogę wchodzi w pełnym biegu),"
        ru: "а эта вступает на путь в полном беге),"
        note: "душа растения завершена, человеческая только начинает путь"
      - pl: "\nZrazu tak działa, że już się mocuje"
        ru: "сперва действует так, что уже напрягается,"
      - pl: "\nJak morska gąbka rusza się i czuje;"
        ru: "как морская губка, движется и чувствует;"
      - pl: "\nI wnet rozwija dane przyrodzeniem"
        ru: "и тотчас развивает данные природой"
      - pl: "\nWładze człowieka, których jest nasieniem."
        ru: "способности человека, семенем которых она является."
    words: { "czynną": czynny, "pocznie": poczac, "roślina": roslina, "brzegu": brzeg, "morska": morski, "nasieniem": nasienie }
  - clean: "Szerzy się, to się rozciąga, mój synu,\nSiła, co z serca rodzica pochodzi,\nA skąd natura skład członków wywodzi.\nLecz dalszy rozwój zważając jej czynu,\nJak ten zwierzokrzew mający żyć mlekiem,\nJak ssące zwierzę, staje się człowiekiem,\nNie widzisz jeszcze; oto jest punkt główny,\nGdzie mędrszy od cię wpadł w błąd niewymowny;\nUmysł od duszy oddzielając w błędzie,\nŻe widnym jego nie było narzędzie."
    verse: true
    chunks:
      - pl: "Szerzy się, to się rozciąga, mój synu,"
        ru: "Распространяется, то растягивается, мой сын,"
      - pl: "\nSiła, co z serca rodzica pochodzi,"
        ru: "сила, что исходит из сердца родителя,"
      - pl: "\nA skąd natura skład członków wywodzi."
        ru: "откуда природа выводит строение членов."
      - pl: "\nLecz dalszy rozwój zważając jej czynu,"
        ru: "Но, взвешивая дальнейшее развитие её действия,"
      - pl: "\nJak ten zwierzokrzew mający żyć mlekiem,"
        ru: "как этот зоофит, которому предстоит жить молоком,"
        note: "zwierzokrzew — зоофит"
      - pl: "\nJak ssące zwierzę, staje się człowiekiem,"
        ru: "как сосущее животное, становится человеком,"
      - pl: "\nNie widzisz jeszcze; oto jest punkt główny,"
        ru: "ты ещё не видишь; вот главная точка,"
      - pl: "\nGdzie mędrszy od cię wpadł w błąd niewymowny;"
        ru: "где мудрее тебя впал в невыразимое заблуждение,"
        note: "Аверроэс"
      - pl: "\nUmysł od duszy oddzielając w błędzie,"
        ru: "отделяя по ошибке ум от души,"
      - pl: "\nŻe widnym jego nie było narzędzie."
        ru: "потому что его орудие не было видно."
    words: { "natura": natura, "skład": sklad, "rozwój": rozwoj, "czynu": czyn, "mlekiem": mleko, "narzędzie": narzedzie }
  - clean: "Otwórz twe serce, bo doń z prawdą dążę.\nGdy już tkań mózgu w płodzie się zawiąże,\nStwórca, któremu swój twór uznać miło,\nWesół się zwraca i zstępuje z góry\nKu arcydziełu takiemu natury,\nTchnie weń duch nowy, który z taką siłą\nCzynność mózgową jeszcze pół roślinną\nŁączy, zespala ze swą treścią czynną,\nAż jedna dusza z nich się przeobraża,\nTa żyje, czuje i siebie rozważa."
    verse: true
    chunks:
      - pl: "Otwórz twe serce, bo doń z prawdą dążę."
        ru: "Открой своё сердце, ибо я стремлюсь к нему с правдой."
      - pl: "\nGdy już tkań mózgu w płodzie się zawiąże,"
        ru: "Когда в зародыше уже завяжется ткань мозга,"
        note: "płód — зародыш; tkań — ткань"
      - pl: "\nStwórca, któremu swój twór uznać miło,"
        ru: "Творец, которому мило признать своё творение,"
      - pl: "\nWesół się zwraca i zstępuje z góry"
        ru: "радостно обращается и сходит свыше"
      - pl: "\nKu arcydziełu takiemu natury,"
        ru: "к такому шедевру природы,"
      - pl: "\nTchnie weń duch nowy, który z taką siłą"
        ru: "вдыхает в него новый дух, который с такой силой"
      - pl: "\nCzynność mózgową jeszcze pół roślinną"
        ru: "мозговую деятельность, ещё полурастительную,"
      - pl: "\nŁączy, zespala ze swą treścią czynną,"
        ru: "соединяет, сплавляет со своей деятельной сутью,"
      - pl: "\nAż jedna dusza z nich się przeobraża,"
        ru: "пока из них не преобразится одна душа,"
      - pl: "\nTa żyje, czuje i siebie rozważa."
        ru: "что живёт, чувствует и сознаёт себя."
    words: { "dążę": dazyc, "mózgu": mozg, "uznać": uznac, "Wesół": wesoly, "zwraca": zwracac, "Łączy": laczyc }
  - clean: "Gdybyś ze słów mych sąd pogodził sprzeczny\nI mniej się dziwił, zważ upał słoneczny,\nKtóry złączony z sokami, co płyną\nZ winnej jagody, przemienia się w wino.\nZ prządki wrzeciona gdy nić życia rwie się,\nWnet z ciałem rozwód bierze dusza nasza,\nZ sobą co ludzkie, co boskie, unasza;\nCzujące władze krzepną w tym momencie,\nLecz za to pamięć, wola i pojęcie\nBystrzej działają i w szerszym zakresie."
    verse: true
    chunks:
      - pl: "Gdybyś ze słów mych sąd pogodził sprzeczny"
        ru: "Чтобы ты примирил с моими словами противоречащее суждение"
      - pl: "\nI mniej się dziwił, zważ upał słoneczny,"
        ru: "и меньше удивлялся, взвесь солнечный жар,"
      - pl: "\nKtóry złączony z sokami, co płyną"
        ru: "который, соединившись с соками, что текут"
      - pl: "\nZ winnej jagody, przemienia się w wino."
        ru: "из виноградной ягоды, превращается в вино."
      - pl: "\nZ prządki wrzeciona gdy nić życia rwie się,"
        ru: "Когда с веретена пряхи рвётся нить жизни,"
      - pl: "\nWnet z ciałem rozwód bierze dusza nasza,"
