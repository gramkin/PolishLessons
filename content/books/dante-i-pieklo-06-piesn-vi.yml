    words: { "Pragnący": pragnac, "niebo": niebo, "wyznać": wyznac, "głębszy": gleboki, "śmiesz": smiec, "ujrzysz": ujrzec }
  - clean: "Gdy cię świat słodki do powrotu znęci,\nPrzypomnij, proszę, mnie ziomków pamięci.\nDłużej nie mówię, ucinam rozmowę».\nWtenczas utkwione we mnie prosto oczy\nWykrzywił zezem i trochę z uboczy\nPopatrzał na mnie, potem schylił głowę\nI zapadł w błoto. Przewodnik mój rzecze:\n«On już nie wstanie, aż prochy człowiecze\nWstaną budzone trąbą Archanioła,\nAż nieprzyjaciel grzechu nań zawoła."
    verse: true
    chunks:
      - pl: "Gdy cię świat słodki do powrotu znęci,"
        ru: "Когда сладкий мир приманит тебя к возвращению,"
        note: "znęcić — приманить"
      - pl: "\nPrzypomnij, proszę, mnie ziomków pamięci."
        ru: "напомни, прошу, землякам память обо мне."
      - pl: "\nDłużej nie mówię, ucinam rozmowę»."
        ru: "Больше не говорю, обрываю разговор»."
        note: "ucinać — обрывать"
      - pl: "\nWtenczas utkwione we mnie prosto oczy"
        ru: "Тогда устремлённые прямо на меня глаза"
        note: "utkwiony — вперенный"
      - pl: "\nWykrzywił zezem i trochę z uboczy"
        ru: "он скосил и немного искоса"
        note: "wykrzywić zezem — скосить глаза; z uboczy — сбоку"
      - pl: "\nPopatrzał na mnie, potem schylił głowę"
        ru: "посмотрел на меня, потом склонил голову"
        note: "popatrzać — устар. «посмотреть»"
      - pl: "\nI zapadł w błoto. Przewodnik mój rzecze:"
        ru: "и погрузился в грязь. Мой проводник говорит:"
        note: "rzecze — книжн. «говорит»"
      - pl: "\n«On już nie wstanie, aż prochy człowiecze"
        ru: "«Он уже не встанет, пока прах человеческий"
        note: "prochy — прах; człowieczy — человеческий"
      - pl: "\nWstaną budzone trąbą Archanioła,"
        ru: "не встанет, разбуженный трубой Архангела,"
        note: "trąba — труба"
      - pl: "\nAż nieprzyjaciel grzechu nań zawoła."
        ru: "пока враг греха не воззовёт к нему."
        note: "Христос в день Суда"
