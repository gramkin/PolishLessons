# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 6
chapterTitle: "Pieśń VI"
chapterTitleRu: "Песнь VI. Чревоугодники"
level: B2
paragraphs:
  - clean: "(Krąg III. Żarłocy. Cerber. Ciacco.)"
    chunks:
      - pl: "(Krąg III. Żarłocy. Cerber. Ciacco.)"
        ru: "(Круг III. Чревоугодники. Цербер. Чакко.)"
        note: "żarłok — обжора; Ciacco — флорентиец, прозванный «Боров»"
    words: { "Krąg": krag }
  - clean: "Kiedym odzyskał zabłąkane zmysły,\nCo się nad losem dwojga moich krewnych\nW żalu, w litości i smutku rozprysły,\nNowy się obraz przede mną rozrzucił:\nGdziem tylko spojrzał, kędym się obrócił,\nWidziałem inne męki i męczonych."
    verse: true
    chunks:
      - pl: "Kiedym odzyskał zabłąkane zmysły,"
        ru: "Когда я вновь обрёл блуждавшие чувства,"
        note: "odzyskać — вновь обрести; zabłąkany — заблудившийся"
      - pl: "\nCo się nad losem dwojga moich krewnych"
        ru: "что над судьбой двух моих родных"
        note: "krewny — родственник; dwoje — двое (м. и ж.)"
      - pl: "\nW żalu, w litości i smutku rozprysły,"
        ru: "в горе, в жалости и печали рассеялись,"
        note: "rozprysnąć się — разлететься брызгами"
      - pl: "\nNowy się obraz przede mną rozrzucił:"
        ru: "новая картина раскинулась передо мной:"
        note: "rozrzucić się — раскинуться"
      - pl: "\nGdziem tylko spojrzał, kędym się obrócił,"
        ru: "куда я только ни взглянул, куда ни обернулся,"
        note: "gdziem, kędym — gdzie/kędy + -m"
      - pl: "\nWidziałem inne męki i męczonych."
        ru: "я видел иные муки и мучимых."
        note: "męczony — мучимый"
    words: { "zmysły": zmysl, "krewnych": krewny, "żalu": zal, "smutku": smutek, "obrócił": obrocic, "męczonych": meczyc }
  - clean: "Był to krąg trzeci, krąg deszczów ulewnych,\nDeszcz jak z upustów spadał otworzonych\nCiężki i chłodny; śnieg zmieszany z gradem\nW ciemnym powietrzu szumiał wodospadem,\nZiemia deszcz chłonąc, oddychała czadem.\nCerber tam szczekał swą paszczą troistą\nNa duchy, które w ziemię ugrzęzły bagnistą,\nA oczy jego świeciły czerwono;\nWełna nań czarna, sam szerokobrzuchy,\nŁapy niejedną uzbrojone szponą,\nNimi darł w pasy potępione duchy."
    verse: true
    chunks:
      - pl: "Był to krąg trzeci, krąg deszczów ulewnych,"
        ru: "Это был третий круг, круг проливных дождей,"
        note: "ulewny — проливной"
      - pl: "\nDeszcz jak z upustów spadał otworzonych"
        ru: "дождь падал, как из открытых шлюзов,"
        note: "upust — шлюз, водоспуск; otworzony — устар. «открытый»"
      - pl: "\nCiężki i chłodny; śnieg zmieszany z gradem"
        ru: "тяжёлый и холодный; снег, смешанный с градом,"
        note: "grad — град"
      - pl: "\nW ciemnym powietrzu szumiał wodospadem,"
        ru: "шумел в тёмном воздухе водопадом,"
        note: "wodospad — водопад"
      - pl: "\nZiemia deszcz chłonąc, oddychała czadem."
        ru: "земля, впитывая дождь, дышала смрадом."
        note: "chłonąć — впитывать; czad — угар, смрад"
      - pl: "\nCerber tam szczekał swą paszczą troistą"
        ru: "Цербер там лаял своей тройной пастью"
        note: "szczekać — лаять; troisty — устар. «тройной»"
      - pl: "\nNa duchy, które w ziemię ugrzęzły bagnistą,"
        ru: "на духов, что увязли в болотистой земле,"
        note: "ugrząźć — увязнуть; bagnisty — болотистый"
      - pl: "\nA oczy jego świeciły czerwono;"
        ru: "а глаза его светились красным;"
      - pl: "\nWełna nań czarna, sam szerokobrzuchy,"
        ru: "шерсть на нём чёрная, сам широкобрюхий,"
        note: "wełna — шерсть; nań = na nim"
      - pl: "\nŁapy niejedną uzbrojone szponą,"
        ru: "лапы вооружены не одним когтем,"
        note: "szpona — коготь (ныне szpon)"
      - pl: "\nNimi darł w pasy potępione duchy."
        ru: "ими он рвал в клочья осуждённых духов."
        note: "drzeć w pasy — драть в клочья"
    words: { "chłodny": chlodny, "śnieg": snieg, "zmieszany": zmieszac, "czadem": czad, "szczekał": szczekac, "świeciły": swiecic }
  - clean: "Jak psy pod deszczem potępieńcy wyją,\nZmokłą za siebie obracając szyją,\nKręcą się ciągle w tę i ową stronę,\nTworząc nawzajem z swych boków zasłonę.\nCerber, ów robak wielki, gdy nas zoczył,\nTroista jego paszcza się rozwarła,\nA gniew członkami konwulsyjnie miota;\nWirgili dłońmi po ziemi zatoczył\nI w nie nabrawszy, co tylko mógł, błota,\nCisnął oburącz w łakome trzy gardła."
    verse: true
    chunks:
      - pl: "Jak psy pod deszczem potępieńcy wyją,"
        ru: "Как псы под дождём, осуждённые воют,"
        note: "wyć — выть"
      - pl: "\nZmokłą za siebie obracając szyją,"
        ru: "поворачивая назад промокшую шею,"
        note: "zmokły — промокший"
      - pl: "\nKręcą się ciągle w tę i ową stronę,"
        ru: "вертятся непрестанно туда и сюда,"
        note: "w tę i ową stronę — туда и сюда"
      - pl: "\nTworząc nawzajem z swych boków zasłonę."
        ru: "образуя друг другу из своих боков заслон."
        note: "zasłona — заслон"
      - pl: "\nCerber, ów robak wielki, gdy nas zoczył,"
        ru: "Цербер, этот великий червь, когда нас заметил,"
        note: "robak — у Данте il gran vermo, «великий червь»; zoczyć — заметить"
      - pl: "\nTroista jego paszcza się rozwarła,"
        ru: "разинул свою тройную пасть,"
        note: "rozewrzeć się — раскрыться"
      - pl: "\nA gniew członkami konwulsyjnie miota;"
        ru: "а гнев судорожно бьётся в его членах;"
        note: "członki — члены, конечности; miotać — метать, бросать"
      - pl: "\nWirgili dłońmi po ziemi zatoczył"
        ru: "Вергилий провёл ладонями по земле"
        note: "zatoczyć — провести кругом"
      - pl: "\nI w nie nabrawszy, co tylko mógł, błota,"
        ru: "и, набрав в них, сколько только мог, грязи,"
        note: "nabrać — набрать; błoto — грязь"
      - pl: "\nCisnął oburącz w łakome trzy gardła."
        ru: "швырнул обеими руками в три жадных глотки."
        note: "cisnąć — швырнуть; oburącz — обеими руками; łakomy — жадный"
    words: { "nawzajem": nawzajem, "zasłonę": zaslona, "robak": robak, "gniew": gniew, "nabrawszy": nabrac, "błota": bloto }
  - clean: "Jak pies drży cały, kiedy oszczekuje,\nLecz gdy mu spadnie kawał chleba z ręki,\nPrzylega cichy i chleb, milcząc, żuje;\nTak szatan Cerber plugawe paszczęki\nZamknął, którymi tak zagłuszał duchy,\nŻe każdy raczej wolałby być głuchy!"
    verse: true
    chunks:
      - pl: "Jak pies drży cały, kiedy oszczekuje,"
        ru: "Как пёс весь дрожит, когда облаивает,"
        note: "oszczekiwać — облаивать"
      - pl: "\nLecz gdy mu spadnie kawał chleba z ręki,"
        ru: "но когда ему упадёт кусок хлеба из руки,"
      - pl: "\nPrzylega cichy i chleb, milcząc, żuje;"
        ru: "припадает тихо и молча жуёт хлеб;"
        note: "przylegać — прижиматься; żuć — жевать"
      - pl: "\nTak szatan Cerber plugawe paszczęki"
        ru: "так демон Цербер мерзкие пасти"
        note: "plugawy — мерзкий, гнусный"
      - pl: "\nZamknął, którymi tak zagłuszał duchy,"
        ru: "закрыл, которыми так оглушал духов,"
        note: "zagłuszać — заглушать, оглушать"
      - pl: "\nŻe każdy raczej wolałby być głuchy!"
        ru: "что каждый скорее предпочёл бы быть глухим!"
        note: "woleć — предпочитать"
    words: { "spadnie": spasc, "kawał": kawal, "chleba": chleb, "milcząc": milczec, "szatan": szatan, "głuchy": gluchy }
  - clean: "Szliśmy płaszczyzną bagna ruchomego.\nGdy stopa nasza po cieniach deptała,\nZdało się, żeśmy deptali ich ciała.\nCienie leżały w bagnie prócz jednego,\nKtóry wstał szybko i siadł, właśnie w chwili,\nOkoło niego gdyśmy przechodzili."
    verse: true
    chunks:
      - pl: "Szliśmy płaszczyzną bagna ruchomego."
        ru: "Мы шли по равнине зыбкого болота."
        note: "płaszczyzna — равнина; ruchomy — подвижный"
      - pl: "\nGdy stopa nasza po cieniach deptała,"
        ru: "Когда наша стопа ступала по теням,"
        note: "deptać — топтать, ступать"
      - pl: "\nZdało się, żeśmy deptali ich ciała."
        ru: "казалось, что мы топчем их тела."
      - pl: "\nCienie leżały w bagnie prócz jednego,"
        ru: "Тени лежали в болоте, кроме одной,"
      - pl: "\nKtóry wstał szybko i siadł, właśnie w chwili,"
        ru: "которая быстро встала и села как раз в тот миг,"
        note: "siąść — сесть"
      - pl: "\nOkoło niego gdyśmy przechodzili."
        ru: "когда мы проходили около неё."
    words: { "bagna": bagno, "stopa": stopa, "Zdało": zdac, "leżały": lezec, "wstał": wstac, "przechodzili": przechodzic }
  - clean: "«O! Kto bądź ciebie w te piekła prowadzi,\nPoznaj mnie», mówił, «wprzód nim się rozstałem\nZ mą klatką, jeszcze byłeś obleczony ciałem».\nJa na to: «Zda się, że ciebie widziałem,\nAle mi za to ma pamięć nie ręczy,\nMoże to boleść, co ciebie tak męczy,\nW niej tak dalece rysy twoje gładzi."
    verse: true
    chunks:
      - pl: "«O! Kto bądź ciebie w te piekła prowadzi,"
        ru: "«О, ты, кто бы тебя в эти ады ни вёл,"
        note: "kto bądź — кто бы ни"
      - pl: "\nPoznaj mnie», mówił, «wprzód nim się rozstałem"
        ru: "узнай меня, — сказал он, — прежде чем я расстался"
        note: "wprzód nim — прежде чем"
      - pl: "\nZ mą klatką, jeszcze byłeś obleczony ciałem»."
        ru: "со своей клеткой, ты уже был облечён телом»."
        note: "klatka — клетка (образ тела); obleczony — облечённый"
      - pl: "\nJa na to: «Zda się, że ciebie widziałem,"
        ru: "Я на это: «Кажется, что я тебя видел,"
      - pl: "\nAle mi za to ma pamięć nie ręczy,"
        ru: "но моя память мне за это не ручается,"
        note: "ręczyć za coś — ручаться"
      - pl: "\nMoże to boleść, co ciebie tak męczy,"
        ru: "может, это боль, что тебя так мучит,"
      - pl: "\nW niej tak dalece rysy twoje gładzi."
        ru: "так сильно в ней стирает твои черты."
        note: "dalece — далеко, сильно; rysy — черты лица; gładzić — сглаживать"
    words: { "prowadzi": prowadzic, "Poznaj": poznac, "rozstałem": rozstac, "klatką": klatka, "ciałem": cialo, "pamięć": pamiec }
  - clean: "Kto taki jesteś, zaspokój pielgrzyma,\nWtrącony tutaj i na karę taką?\nJeśli jest większa, równie przykrej nie ma».\nA on: «W twym mieście, gdzie zawiść tak płuży,\nWesół przeżyłem czas ziemskiej podróży,\nPrzez ziomków twoich przezwany Ciakko."
    verse: true
    chunks:
      - pl: "Kto taki jesteś, zaspokój pielgrzyma,"
        ru: "Кто ты такой, утоли [любопытство] странника,"
        note: "zaspokoić — удовлетворить; pielgrzym — паломник"
      - pl: "\nWtrącony tutaj i na karę taką?"
        ru: "низвергнутый сюда, и на такую кару?"
        note: "wtrącony — низвергнутый"
      - pl: "\nJeśli jest większa, równie przykrej nie ma»."
        ru: "Если есть и большая, то столь же мерзкой нет»."
        note: "przykry — неприятный, мерзкий"
      - pl: "\nA on: «W twym mieście, gdzie zawiść tak płuży,"
        ru: "А он: «В твоём городе, где зависть так процветает,"
        note: "zawiść — зависть; płużyć — устар. «процветать»"
      - pl: "\nWesół przeżyłem czas ziemskiej podróży,"
        ru: "я весело прожил время земного странствия,"
        note: "wesół — краткая форма: «весел»"
      - pl: "\nPrzez ziomków twoich przezwany Ciakko."
        ru: "твоими земляками прозванный Чакко."
        note: "ziomek — земляк; przezwać — прозвать"
    words: { "Wtrącony": wtracic, "karę": kara, "równie": rownie, "przykrej": przykry, "Wesół": wesoly, "ziemskiej": ziemski }
  - clean: "Za chuć obżarstwa niską i nikczemną,\nJak widzisz, leje wieczny deszcz nade mną.\nTu ja niejeden, wszystkie cierpią dusze\nZa grzech ten samy też same katusze».\nI zamilkł, snadź się nagadał do woli.\n— «Ciakko», rzekłem «twa kara mnie boli,\nLecz powiedz, proszę, do jak smutnej doli\nDojść może naszych byt obywateli,\nGdy ich do tyla duch stronnictwa dzieli?"
    verse: true
    chunks:
      - pl: "Za chuć obżarstwa niską i nikczemną,"
        ru: "За низкую и подлую страсть обжорства,"
        note: "obżarstwo — обжорство; nikczemny — подлый"
      - pl: "\nJak widzisz, leje wieczny deszcz nade mną."
        ru: "как видишь, льёт надо мной вечный дождь."
      - pl: "\nTu ja niejeden, wszystkie cierpią dusze"
        ru: "Здесь не я один, все души терпят"
        note: "niejeden — не один"
      - pl: "\nZa grzech ten samy też same katusze»."
        ru: "за этот же грех те же муки»."
        note: "samy — устар. «самый»"
      - pl: "\nI zamilkł, snadź się nagadał do woli."
        ru: "И умолк, видно, наговорившись вдоволь."
        note: "nagadać się — наговориться; do woli — вдоволь"
      - pl: "\n— «Ciakko», rzekłem «twa kara mnie boli,"
        ru: "— «Чакко, — сказал я, — твоя кара причиняет мне боль,"
        note: "boleć — болеть"
      - pl: "\nLecz powiedz, proszę, do jak smutnej doli"
        ru: "но скажи, прошу, до какой печальной доли"
      - pl: "\nDojść może naszych byt obywateli,"
        ru: "может дойти жизнь наших граждан,"
        note: "byt — существование; obywatel — гражданин"
      - pl: "\nGdy ich do tyla duch stronnictwa dzieli?"
        ru: "если их столь разделяет дух партий?"
        note: "stronnictwo — партия, группировка; do tyla — настолько"
    words: { "leje": lac, "wieczny": wieczny, "deszcz": deszcz, "grzech": grzech, "rzekłem": rzec, "obywateli": obywatel }
  - clean: "Czy sprawiedliwy jest mąż między nimi?\nSkąd się tam pożar zapalił niezgody?»\nA on: «Znużeni sporami długimi,\nKrwią chyba zgaszą te żagwie pożarne.\nStronnictwo Białe przecz wypędzi Czarne.\nO, któż obliczy ich klęski i szkody!"
    verse: true
    chunks:
      - pl: "Czy sprawiedliwy jest mąż między nimi?"
        ru: "Есть ли среди них праведный муж?"
        note: "sprawiedliwy — праведный, справедливый"
      - pl: "\nSkąd się tam pożar zapalił niezgody?»"
        ru: "Откуда там зажёгся пожар раздора?»"
        note: "niezgoda — раздор"
      - pl: "\nA on: «Znużeni sporami długimi,"
        ru: "А он: «Утомлённые долгими спорами,"
        note: "znużony — утомлённый"
      - pl: "\nKrwią chyba zgaszą te żagwie pożarne."
        ru: "разве что кровью они погасят эти пожарные головни."
        note: "żagiew — головня, факел"
      - pl: "\nStronnictwo Białe przecz wypędzi Czarne."
        ru: "Партия Белых прочь изгонит Чёрных."
        note: "przecz — устар. «прочь»"
      - pl: "\nO, któż obliczy ich klęski i szkody!"
        ru: "О, кто же сочтёт их беды и убытки!"
        note: "klęska — бедствие; szkoda — ущерб"
    words: { "sprawiedliwy": sprawiedliwy, "pożar": pozar, "zapalił": zapalic, "Krwią": krew, "zgaszą": zgasic, "szkody": szkoda }
  - clean: "Nim słońce trzeci swój obrót dokona,\nUpadną Biali; strona zwyciężona\nZnów się podniesie za pomocą męża,\nKtóry w spoczynku ostrzy żądło węża,\nI harde czoło podniesie na długo,\nI w ciężkie jarzmo wprzęże stronę drugą;\nNad nimi płaczę i za nich się wstydzę."
    verse: true
    chunks:
      - pl: "Nim słońce trzeci swój obrót dokona,"
        ru: "Прежде чем солнце свершит свой третий оборот,"
        note: "obrót — оборот; dokonać — совершить"
      - pl: "\nUpadną Biali; strona zwyciężona"
        ru: "падут Белые; побеждённая сторона"
      - pl: "\nZnów się podniesie za pomocą męża,"
        ru: "снова поднимется с помощью мужа,"
      - pl: "\nKtóry w spoczynku ostrzy żądło węża,"
        ru: "который в покое точит жало змеи,"
        note: "ostrzyć — точить; żądło — жало"
      - pl: "\nI harde czoło podniesie na długo,"
        ru: "и надменное чело поднимет надолго,"
        note: "hardy — надменный"
      - pl: "\nI w ciężkie jarzmo wprzęże stronę drugą;"
        ru: "и в тяжкое ярмо запряжёт другую сторону;"
        note: "jarzmo — ярмо; wprząc — запрячь"
      - pl: "\nNad nimi płaczę i za nich się wstydzę."
        ru: "над ними я плачу и за них стыжусь."
    words: { "obrót": obrot, "Upadną": upasc, "zwyciężona": zwyciezyc, "węża": waz, "jarzmo": jarzmo, "wstydzę": wstydzic }
  - clean: "Dwóch między nimi sprawiedliwych widzę,\nNikt ich nie słucha w ślepym żądz zapale,\nDuma, łakomstwo i zawiść, trzy głownie,\nSerca ich pieką swym żarem gwałtownie».\nNa tym Ciakko zakończył swe żale.\n«O! nie przerywaj» rzekłem doń «rozmowy,\nObdarz mnie jeszcze choć niewielu słowy."
    verse: true
    chunks:
      - pl: "Dwóch między nimi sprawiedliwych widzę,"
        ru: "Двоих праведных среди них вижу,"
      - pl: "\nNikt ich nie słucha w ślepym żądz zapale,"
        ru: "никто их не слушает в слепом пылу страстей,"
        note: "zapał — пыл"
      - pl: "\nDuma, łakomstwo i zawiść, trzy głownie,"
        ru: "гордыня, алчность и зависть, три головни,"
        note: "łakomstwo — алчность; głownia — головня"
      - pl: "\nSerca ich pieką swym żarem gwałtownie»."
        ru: "жгут их сердца своим жаром неистово»."
        note: "piec — жечь, печь; gwałtownie — неистово"
      - pl: "\nNa tym Ciakko zakończył swe żale."
        ru: "На этом Чакко закончил свои жалобы."
      - pl: "\n«O! nie przerywaj» rzekłem doń «rozmowy,"
        ru: "«О, не прерывай, — сказал я ему, — разговора,"
        note: "doń = do niego"
      - pl: "\nObdarz mnie jeszcze choć niewielu słowy."
        ru: "одари меня ещё хоть немногими словами."
        note: "obdarzyć — одарить; słowy — твор. мн."
    words: { "słucha": sluchac, "Duma": duma, "Serca": serce, "pieką": piec-2, "zakończył": zakonczyc, "przerywaj": przerywac }
  - clean: "Mów: Tedżiajo, Moska, Farinata,\nGdzie Rustikuci, Arigo i inni,\nPragnący dobra ziomków, dobroczynni,\nW niebo czy w piekło zstąpili ze świata?»\nOn: «Grzechy inne, z żalem wyznać muszę,\nMiędzy czarniejsze strąciły je dusze,\nW krąg głębszy; gdy śmiesz zstąpić tak głęboko,\nWszystkich ich społem tam ujrzysz na oko."
    verse: true
    chunks:
