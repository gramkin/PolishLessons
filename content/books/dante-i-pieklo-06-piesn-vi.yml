        ru: "Скажи: Теггьяйо, Моска, Фарината,"
        note: "флорентийцы, о которых Данте спросит позже"
      - pl: "\nGdzie Rustikuci, Arigo i inni,"
        ru: "где Рустикуччи, Арриго и другие,"
      - pl: "\nPragnący dobra ziomków, dobroczynni,"
        ru: "желавшие блага землякам, благодетельные,"
        note: "pragnąć — желать"
      - pl: "\nW niebo czy w piekło zstąpili ze świata?»"
        ru: "на небо или в ад сошли из мира?»"
        note: "zstąpić — сойти"
      - pl: "\nOn: «Grzechy inne, z żalem wyznać muszę,"
        ru: "Он: «Другие грехи, с горем должен признать,"
        note: "wyznać — признать"
      - pl: "\nMiędzy czarniejsze strąciły je dusze,"
        ru: "низвергли их к более чёрным душам,"
        note: "strącić — низвергнуть"
      - pl: "\nW krąg głębszy; gdy śmiesz zstąpić tak głęboko,"
        ru: "в более глубокий круг; если посмеешь сойти так глубоко,"
      - pl: "\nWszystkich ich społem tam ujrzysz na oko."
        ru: "всех их вместе там увидишь воочию."
