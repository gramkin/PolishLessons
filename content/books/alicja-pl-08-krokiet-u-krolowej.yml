  - clean: "Alicja nie była pewna, czy nie powinna położyć się twarzą do ziemi jak trzej ogrodnicy, ale nie mogła sobie przypomnieć, żeby kiedykolwiek słyszała o takiej zasadzie podczas pochodów; „a zresztą, jaki byłby pożytek z pochodu”, pomyślała, „gdyby wszyscy musieli leżeć twarzą do ziemi, tak że nie mogliby go zobaczyć?” Została więc tam, gdzie stała, i czekała."
    en: "Alice was rather doubtful whether she ought not to lie down on her face like the three gardeners, but she could not remember ever having heard of such a rule at processions; “and besides, what would be the use of a procession,” thought she, “if people had all to lie down upon their faces, so that they couldn’t see it?” So she stood still where she was, and waited."
    chunks:
      - pl: "Alicja nie była pewna, czy nie powinna położyć się twarzą do ziemi jak trzej ogrodnicy,"
        ru: "Алиса не была уверена, не следует ли ей лечь лицом к земле, как трое садовников,"
        note: "nie była pewna, czy — не была уверена, ли"
      - pl: " ale nie mogła sobie przypomnieć, żeby kiedykolwiek słyszała o takiej zasadzie podczas pochodów;"
        ru: "но не могла припомнить, чтобы когда-нибудь слышала о таком правиле во время шествий;"
        note: "przypomnieć sobie — припомнить, вспомнить"
      - pl: " „a zresztą, jaki byłby pożytek z pochodu”, pomyślała, „gdyby wszyscy musieli leżeć twarzą do ziemi, tak że nie mogliby go zobaczyć?”"
        ru: "«а впрочем, какая была бы польза от шествия, — подумала она, — если бы все должны были лежать лицом к земле, так что не могли бы его видеть?»"
        note: "pożytek z czegoś — польза от чего-л.: z и родительный"
      - pl: " Została więc tam, gdzie stała, i czekała."
        ru: "Поэтому она осталась там, где стояла, и ждала."
        note: "zostać — остаться"
    words: { "pewna": pewien, "położyć": polozyc, "ziemi": ziemia, "przypomnieć": przypomniec, "kiedykolwiek": kiedykolwiek, "zasadzie": zasada, "pomyślała": pomyslec, "leżeć": lezec }
  - clean: "Kiedy pochód zrównał się z Alicją, wszyscy się zatrzymali i spojrzeli na nią, a Królowa powiedziała surowo: „Kto to jest?” Powiedziała to do Waleta Kier, który w odpowiedzi tylko się skłonił i uśmiechnął."
    en: "When the procession came opposite to Alice, they all stopped and looked at her, and the Queen said severely “Who is this?” She said it to the Knave of Hearts, who only bowed and smiled in reply."
