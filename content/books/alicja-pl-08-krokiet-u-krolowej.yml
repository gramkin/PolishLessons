  - clean: "Największą trudnością, jaką Alicja napotkała na początku, było poradzenie sobie z flamingiem: udało jej się wsunąć jego korpus, całkiem wygodnie, pod pachę, tak że nogi zwisały w dół, ale zwykle, akurat gdy ładnie wyprostowała mu szyję i miała uderzyć jeża jego głową, flaming wykręcał się i patrzył jej w twarz z tak zdumionym wyrazem, że nie mogła powstrzymać się od śmiechu: a kiedy już opuściła mu głowę i miała zacząć od nowa, było bardzo irytujące stwierdzić, że jeż się rozwinął i właśnie odpełza: a do tego wszystkiego zwykle na drodze był jakiś grzbiet albo bruzda tam, gdzie chciała posłać jeża, a ponieważ zgięci wpół żołnierze ciągle wstawali i odchodzili w inne części boiska, Alicja wkrótce doszła do wniosku, że to doprawdy bardzo trudna gra."
