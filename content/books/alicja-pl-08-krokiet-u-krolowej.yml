    words: { "spojrzały": spojrzec, "cicho": cicho, "panienka": panienka, "faktem": fakt, "czerwony": czerwony, "pomyłkę": pomylka, "dowiedziała": dowiedziec, "głowy": glowa, "mocy": moc-2, "zawołała": zawolac, "natychmiast": natychmiast, "rzucili": rzucic, "twarz": twarz, "odgłos": odglos, "kroków": krok, "koniecznie": koniecznie }
  - clean: "Najpierw szło dziesięciu żołnierzy niosących pałki; wszyscy byli ukształtowani tak jak trzej ogrodnicy — podłużni i płascy, z rękami i nogami po rogach: potem dziesięciu dworzan; ci byli cali ozdobieni karami i szli parami, tak jak żołnierze. Za nimi przyszły królewskie dzieci; było ich dziesięcioro, a te kochane maleństwa szły wesoło podskakując, trzymając się za ręce, parami: wszystkie były ozdobione kierami. Dalej szli goście, przeważnie Królowie i Królowe, a wśród nich Alicja rozpoznała Białego Królika: mówił pospiesznie i nerwowo, uśmiechając się do wszystkiego, co powiedziano, i przeszedł obok, nie zauważywszy jej. Potem szedł Walet Kier, niosąc koronę Króla na karmazynowej aksamitnej poduszce; a na samym końcu tego wspaniałego pochodu szli KRÓL I KRÓLOWA KIER."
    en: "First came ten soldiers carrying clubs; these were all shaped like the three gardeners, oblong and flat, with their hands and feet at the corners: next the ten courtiers; these were ornamented all over with diamonds, and walked two and two, as the soldiers did. After these came the royal children; there were ten of them, and the little dears came jumping merrily along hand in hand, in couples: they were all ornamented with hearts. Next came the guests, mostly Kings and Queens, and among them Alice recognised the White Rabbit: it was talking in a hurried nervous manner, smiling at everything that was said, and went by without noticing her. Then followed the Knave of Hearts, carrying the King’s crown on a crimson velvet cushion; and, last of all this grand procession, came THE KING AND QUEEN OF HEARTS."
    chunks:
      - pl: "Najpierw szło dziesięciu żołnierzy niosących pałki;"
        ru: "Сперва шли десять солдат, несущих дубинки;"
        note: "dziesięciu żołnierzy — десять солдат: мужской личный род требует родительного"
      - pl: " wszyscy byli ukształtowani tak jak trzej ogrodnicy — podłużni i płascy, z rękami i nogami po rogach:"
        ru: "все они были сложены так же, как трое садовников, — продолговатые и плоские, с руками и ногами по углам:"
        note: "z rękami i nogami — с руками и ногами: творительный падеж"
      - pl: " potem dziesięciu dworzan; ci byli cali ozdobieni karami i szli parami, tak jak żołnierze."
        ru: "потом десять придворных; эти были сплошь украшены бубнами и шли парами, как и солдаты."
        note: "kary — бубны (карточная масть); kier — червы"
      - pl: " Za nimi przyszły królewskie dzieci; było ich dziesięcioro,"
        ru: "За ними шли королевские дети; их было десятеро,"
        note: "dziesięcioro — десятеро: собирательное числительное для смешанной группы"
      - pl: " a te kochane maleństwa szły wesoło podskakując, trzymając się za ręce, parami: wszystkie były ozdobione kierami."
        ru: "а эти милые крошки шли, весело подпрыгивая, держась за руки, парами: все они были украшены червами."
        note: "trzymać się za ręce — держаться за руки"
      - pl: " Dalej szli goście, przeważnie Królowie i Królowe, a wśród nich Alicja rozpoznała Białego Królika:"
        ru: "Дальше шли гости, в основном Короли и Королевы, и среди них Алиса узнала Белого Кролика:"
        note: "wśród czegoś — среди чего-л.: родительный падеж"
      - pl: " mówił pospiesznie i nerwowo, uśmiechając się do wszystkiego, co powiedziano, i przeszedł obok, nie zauważywszy jej."
        ru: "он говорил торопливо и нервно, улыбаясь всему, что говорилось, и прошёл мимо, не заметив её."
        note: "nie zauważywszy — не заметив: деепричастие на -wszy"
      - pl: " Potem szedł Walet Kier, niosąc koronę Króla na karmazynowej aksamitnej poduszce;"
        ru: "Потом шёл Червонный Валет, неся корону Короля на малиновой бархатной подушке;"
