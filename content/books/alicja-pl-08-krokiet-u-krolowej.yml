title: Przygody Alicji w Krainie Czarów
titleRu: Приключения Алисы в Стране чудес
author: Lewis Carroll
translator: "перевод на польский — черновик, требует проверки носителем"
source:
  name: Project Gutenberg (оригинал 1865 г.)
  url: https://www.gutenberg.org/ebooks/11
  license: Public domain
  licenseUrl: https://www.gutenberg.org/policy/permission.html
chapter: 8
chapterTitle: Krokiet u Królowej
chapterTitleRu: Королевский крокет
level: B1
paragraphs:
  - clean: "Przy wejściu do ogrodu stał wielki krzew różany: róże na nim rosnące były białe, ale trzej ogrodnicy krzątali się przy nim, pilnie malując je na czerwono. Alicja uznała to za rzecz bardzo osobliwą i podeszła bliżej, żeby im się przyjrzeć, a właśnie gdy do nich doszła, usłyszała, jak jeden z nich mówi: „Uważaj no, Piątko! Nie ochlapuj mnie tak farbą!”"
    en: "A large rose-tree stood near the entrance of the garden: the roses growing on it were white, but there were three gardeners at it, busily painting them red. Alice thought this a very curious thing, and she went nearer to watch them, and just as she came up to them she heard one of them say, “Look out now, Five! Don’t go splashing paint over me like that!”"
    chunks:
      - pl: "Przy wejściu do ogrodu stał wielki krzew różany:"
        ru: "У входа в сад стоял большой розовый куст:"
        note: "przy wejściu — у входа: przy и предложный"
      - pl: " róże na nim rosnące były białe, ale trzej ogrodnicy krzątali się przy nim, pilnie malując je na czerwono."
        ru: "росшие на нём розы были белые, но трое садовников хлопотали возле него, усердно крася их в красный."
        note: "malować coś na jakiś kolor — красить что-л. в какой-л. цвет: na и винительный"
      - pl: " Alicja uznała to za rzecz bardzo osobliwą i podeszła bliżej, żeby im się przyjrzeć,"
        ru: "Алиса сочла это весьма удивительной вещью и подошла ближе, чтобы к ним присмотреться,"
        note: "uznać coś za coś — счесть что-л. чем-л.: za и винительный"
      - pl: " a właśnie gdy do nich doszła, usłyszała, jak jeden z nich mówi:"
        ru: "а как раз когда она до них дошла, услышала, как один из них говорит:"
        note: "jeden z nich — один из них: родительный падеж"
      - pl: " „Uważaj no, Piątko! Nie ochlapuj mnie tak farbą!”"
        ru: "«Осторожней, Пятёрка! Не забрызгивай меня так краской!»"
        note: "Piątko — звательный падеж от Piątka «пятёрка»"
    words: { "wejściu": wejsc, "były": byly, "białe": bialy, "uznała": uznac, "rzecz": rzec, "podeszła": podejsc, "bliżej": blisko, "przyjrzeć": przyjrzec, "doszła": dojsc, "usłyszała": uslyszec, "Piątko": piatka }
  - clean: "„Nic na to nie poradzę”, powiedziała Piątka nadąsanym tonem; „Siódemka trąciła mnie w łokieć.”"
    en: "“I couldn’t help it,” said Five, in a sulky tone; “Seven jogged my elbow.”"
    chunks:
      - pl: "„Nic na to nie poradzę”, powiedziała Piątka nadąsanym tonem;"
        ru: "«Я ничего не могу поделать», — надутым тоном сказала Пятёрка;"
        note: "nic na to nie poradzę — ничего не могу с этим поделать"
      - pl: " „Siódemka trąciła mnie w łokieć.”"
        ru: "«Семёрка толкнула меня под локоть.»"
        note: "trącić kogoś w coś — толкнуть кого-л. во что-л.: w и винительный"
    words: { "poradzę": poradzic, "tonem": ton }
  - clean: "Na co Siódemka podniosła wzrok i powiedziała: „No właśnie, Piątko! Zawsze zwalaj winę na innych!”"
    en: "On which Seven looked up and said, “That’s right, Five! Always lay the blame on others!”"
    chunks:
      - pl: "Na co Siódemka podniosła wzrok i powiedziała: „No właśnie, Piątko! Zawsze zwalaj winę na innych!”"
        ru: "На что Семёрка подняла взгляд и сказала: «Вот именно, Пятёрка! Вечно сваливай вину на других!»"
        note: "zwalać winę na kogoś — сваливать вину на кого-л.: na и винительный"
    words: { "podniosła": podniesc, "wzrok": wzrok, "winę": wina }
  - clean: "„Ty byś lepiej milczała!”, powiedziała Piątka. „Nie dalej jak wczoraj słyszałam, jak Królowa mówiła, że zasługujesz na ścięcie!”"
    en: "“_You’d_ better not talk!” said Five. “I heard the Queen say only yesterday you deserved to be beheaded!”"
    chunks:
      - pl: "„Ty byś lepiej milczała!”, powiedziała Piątka."
        ru: "«Ты бы лучше помолчала!» — сказала Пятёрка."
        note: "ty byś lepiej — ты бы лучше: условное наклонение"
      - pl: " „Nie dalej jak wczoraj słyszałam, jak Królowa mówiła, że zasługujesz na ścięcie!”"
        ru: "«Не далее как вчера я слышала, как Королева говорила, что ты заслуживаешь казни!»"
        note: "zasługiwać na coś — заслуживать чего-л.: na и винительный"
    words: { "dalej": dalej, "wczoraj": wczoraj, "Królowa": krolowa, "zasługujesz": zaslugiwac }
  - clean: "„Za co?”, spytała ta, która odezwała się pierwsza."
    en: "“What for?” said the one who had spoken first."
    chunks:
      - pl: "„Za co?”, spytała ta, która odezwała się pierwsza."
        ru: "«За что?» — спросила та, которая заговорила первой."
        note: "odezwać się — заговорить, подать голос"
    words: { "odezwała": odezwac }
  - clean: "„To nie twoja sprawa, Dwójko!”, powiedziała Siódemka."
    en: "“That’s none of _your_ business, Two!” said Seven."
    chunks:
      - pl: "„To nie twoja sprawa, Dwójko!”, powiedziała Siódemka."
        ru: "«Это не твоё дело, Двойка!» — сказала Семёрка."
        note: "to nie twoja sprawa — это не твоё дело"
    words: { "Dwójko": dwojka }
  - clean: "„Owszem, to jej sprawa!”, powiedziała Piątka, „i powiem jej — to było za to, że przyniosła kucharce cebulki tulipanów zamiast cebuli.”"
    en: "“Yes, it _is_ his business!” said Five, “and I’ll tell him—it was for bringing the cook tulip-roots instead of onions.”"
    chunks:
      - pl: "„Owszem, to jej sprawa!”, powiedziała Piątka, „i powiem jej —"
        ru: "«Нет уж, это её дело! — сказала Пятёрка. — И я ей скажу —"
        note: "owszem — да нет же, напротив: возражение на отрицание"
      - pl: " to było za to, że przyniosła kucharce cebulki tulipanów zamiast cebuli.”"
        ru: "это было за то, что она принесла кухарке тюльпанные луковицы вместо лука.»"
        note: "cebulki tulipanów — луковицы тюльпанов: в польском cebulka «луковица» и cebula «лук» — одно гнездо слов, так что подмена выходит нагляднее, чем в оригинале"
    words: { "przyniosła": przyniesc }
  - clean: "Siódemka cisnęła pędzel i właśnie zaczęła: „No, ze wszystkich niesprawiedliwości—”, gdy jej wzrok przypadkiem padł na Alicję, która stała i im się przyglądała, i nagle się powstrzymała: pozostali też się obejrzeli i wszyscy nisko się skłonili."
    en: "Seven flung down his brush, and had just begun “Well, of all the unjust things—” when his eye chanced to fall upon Alice, as she stood watching them, and he checked himself suddenly: the others looked round also, and all of them bowed low."
    chunks:
      - pl: "Siódemka cisnęła pędzel i właśnie zaczęła: „No, ze wszystkich niesprawiedliwości—”,"
        ru: "Семёрка швырнула кисть и как раз начала: «Ну, из всех несправедливостей—»,"
        note: "cisnąć — швырнуть"
      - pl: " gdy jej wzrok przypadkiem padł na Alicję, która stała i im się przyglądała, i nagle się powstrzymała:"
        ru: "когда её взгляд случайно упал на Алису, которая стояла и к ним присматривалась, и она вдруг осеклась:"
        note: "wzrok padł na kogoś — взгляд упал на кого-л."
      - pl: " pozostali też się obejrzeli i wszyscy nisko się skłonili."
        ru: "остальные тоже обернулись, и все низко поклонились."
        note: "skłonić się — поклониться"
    words: { "wszystkich": wszyscy, "przypadkiem": przypadek, "padł": pasc, "nagle": nagle, "powstrzymała": powstrzymac, "pozostali": pozostac, "obejrzeli": obejrzec }
  - clean: "„Czy moglibyście mi powiedzieć”, odezwała się Alicja trochę nieśmiało, „dlaczego malujecie te róże?”"
    en: "“Would you tell me,” said Alice, a little timidly, “why you are painting those roses?”"
    chunks:
      - pl: "„Czy moglibyście mi powiedzieć”, odezwała się Alicja trochę nieśmiało, „dlaczego malujecie te róże?”"
        ru: "«Не могли бы вы мне сказать, — немного робко заговорила Алиса, — почему вы красите эти розы?»"
        note: "moglibyście — не могли бы вы: вежливая просьба в условном наклонении"
  - clean: "Piątka i Siódemka nic nie powiedziały, tylko spojrzały na Dwójkę. Dwójka zaczęła cicho: „No bo widzi panienka, faktem jest, że tu powinien był stać czerwony krzew różany, a myśmy przez pomyłkę posadzili biały; i gdyby Królowa się o tym dowiedziała, wszystkim by nam ścięto głowy, wie panienka. Więc widzi panienka, robimy, co w naszej mocy, zanim przyjdzie, żeby—” W tej chwili Piątka, która niespokojnie zerkała przez ogród, zawołała: „Królowa! Królowa!” i trzej ogrodnicy natychmiast rzucili się plackiem na twarz. Rozległ się odgłos wielu kroków i Alicja obejrzała się, chcąc koniecznie zobaczyć Królową."
    en: "Five and Seven said nothing, but looked at Two. Two began in a low voice, “Why the fact is, you see, Miss, this here ought to have been a _red_ rose-tree, and we put a white one in by mistake; and if the Queen was to find it out, we should all have our heads cut off, you know. So you see, Miss, we’re doing our best, afore she comes, to—” At this moment Five, who had been anxiously looking across the garden, called out “The Queen! The Queen!” and the three gardeners instantly threw themselves flat upon their faces. There was a sound of many footsteps, and Alice looked round, eager to see the Queen."
    chunks:
      - pl: "Piątka i Siódemka nic nie powiedziały, tylko spojrzały na Dwójkę."
        ru: "Пятёрка и Семёрка ничего не сказали, только посмотрели на Двойку."
        note: "spojrzeć na kogoś — посмотреть на кого-л.: na и винительный"
      - pl: " Dwójka zaczęła cicho: „No bo widzi panienka, faktem jest, że tu powinien był stać czerwony krzew różany,"
        ru: "Двойка начала тихо: «Ну, видите ли, барышня, дело в том, что тут должен был стоять красный розовый куст,"
        note: "panienka — барышня: почтительное обращение прислуги"
      - pl: " a myśmy przez pomyłkę posadzili biały;"
        ru: "а мы по ошибке посадили белый;"
        note: "przez pomyłkę — по ошибке: przez и винительный"
      - pl: " i gdyby Królowa się o tym dowiedziała, wszystkim by nam ścięto głowy, wie panienka."
        ru: "и если бы Королева про это узнала, всем нам отрубили бы головы, знаете ли, барышня."
        note: "dowiedzieć się o czymś — узнать о чём-л.: o и предложный"
      - pl: " Więc widzi panienka, robimy, co w naszej mocy, zanim przyjdzie, żeby—”"
        ru: "Так что, видите ли, барышня, делаем что в наших силах, прежде чем она придёт, чтобы—»"
        note: "co w naszej mocy — что в наших силах"
      - pl: " W tej chwili Piątka, która niespokojnie zerkała przez ogród, zawołała: „Królowa! Królowa!”"
        ru: "В эту минуту Пятёрка, тревожно поглядывавшая через сад, закричала: «Королева! Королева!»"
        note: "zerkać — поглядывать, посматривать"
      - pl: " i trzej ogrodnicy natychmiast rzucili się plackiem na twarz."
        ru: "и трое садовников тотчас растянулись плашмя лицом вниз."
        note: "rzucić się plackiem — растянуться плашмя"
      - pl: " Rozległ się odgłos wielu kroków i Alicja obejrzała się, chcąc koniecznie zobaczyć Królową."
        ru: "Раздался звук множества шагов, и Алиса обернулась, непременно желая увидеть Королеву."
