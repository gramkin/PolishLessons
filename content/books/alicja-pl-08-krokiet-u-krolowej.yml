    en: "The Cat’s head began fading away the moment he was gone, and, by the time he had come back with the Duchess, it had entirely disappeared; so the King and the executioner ran wildly up and down looking for it, while the rest of the party went back to the game."
    chunks:
      - pl: "Głowa Kota zaczęła blednąć i znikać w tej samej chwili, gdy kat odszedł, a zanim wrócił z Księżną, zniknęła zupełnie; Król i kat biegali więc jak szaleni tam i z powrotem, szukając jej, a reszta towarzystwa wróciła do gry."
        ru: "Голова Кота начала бледнеть и исчезать в ту же минуту, как палач ушёл, а к тому времени, как он вернулся с Герцогиней, она исчезла совершенно; поэтому Король и палач как безумные бегали туда и обратно, ища её, а остальная компания вернулась к игре."
        note: "tam i z powrotem — туда и обратно"
    words: { "odszedł": odejsc, "zupełnie": zupelnie }
