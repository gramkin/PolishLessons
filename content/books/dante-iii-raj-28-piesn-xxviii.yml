level: B2
paragraphs:
  - clean: "9. W niebie kryształowym. Stosunek świata aniołów i świata cielesnego. Pouczenie o hierarchii aniołów."
    chunks:
      - pl: "9. W niebie kryształowym. Stosunek świata aniołów i świata cielesnego. Pouczenie o hierarchii aniołów."
        ru: "9. В хрустальном небе. Соотношение мира ангелов и телесного мира. Наставление об иерархии ангелов."
    words: { "niebie": niebo, "Stosunek": stosunek, "świata": swiat }
  - clean: "Gdy nędz obecnych prawdę mi odkryła,\nDo jakich ludzie nieszczęśliwi przyszli,\nTa, która duch mój tak blisko wraiła,\nJak gdy w zwierciadle kto postrzeże z dala\nPochodnię, która za nim się zapala,\nWprzód nim ją ujrzy lub o niej pomyśli,\nWzrok za się zwraca, nie wierząc wzrokowi,\nAżeby widzieć, czy szkło prawdę mówi,\nI widzi, że te światła, co się dwoją,\nZgodne są z sobą jak pieśń z nutą swoją;"
    verse: true
    chunks:
      - pl: "Gdy nędz obecnych prawdę mi odkryła,"
        ru: "Когда открыла мне правду о нынешних бедствиях,"
      - pl: "\nDo jakich ludzie nieszczęśliwi przyszli,"
        ru: "до которых дошли несчастные люди,"
      - pl: "\nTa, która duch mój tak blisko wraiła,"
        ru: "та, что так близко ввела мой дух в рай,"
        note: "wraić — ввести в рай"
      - pl: "\nJak gdy w zwierciadle kto postrzeże z dala"
        ru: "как когда кто-то издали заметит в зеркале"
      - pl: "\nPochodnię, która za nim się zapala,"
        ru: "факел, что зажигается позади него,"
      - pl: "\nWprzód nim ją ujrzy lub o niej pomyśli,"
        ru: "прежде чем его увидит или о нём подумает,"
      - pl: "\nWzrok za się zwraca, nie wierząc wzrokowi,"
        ru: "обращает взгляд назад, не веря взгляду,"
      - pl: "\nAżeby widzieć, czy szkło prawdę mówi,"
        ru: "чтобы видеть, правду ли говорит стекло,"
      - pl: "\nI widzi, że te światła, co się dwoją,"
        ru: "и видит, что эти светы, что двоятся,"
      - pl: "\nZgodne są z sobą jak pieśń z nutą swoją;"
        ru: "согласны друг с другом, как песня со своей мелодией;"
    words: { "nędz": nedza, "nieszczęśliwi": nieszczesliwy, "Pochodnię": pochodnia, "szkło": szklo, "Zgodne": zgodny, "pieśń": piesn }
  - clean: "Podobnie, ile pamięć moja sięga,\nZrobiłem w piękne spoglądając oczy,\nSkąd miłość w pierwszy swój węzeł uroczy\nMnie usidliła; i gdym się obrócił\nSpojrzeć za siebie wkoło niebokręga,\nCo patrzącego wzrok za każdym razem\nSwej bezmierności zadziwia obrazem,\nTam punkt widziałem, który blask wyrzucił,\nBlask, co powiekę słabą śmiertelnika\nPali swym ostrzem, a paląc zamyka."
    verse: true
    chunks:
      - pl: "Podobnie, ile pamięć moja sięga,"
        ru: "так же, насколько достигает моя память,"
      - pl: "\nZrobiłem w piękne spoglądając oczy,"
        ru: "сделал и я, глядя в прекрасные глаза,"
      - pl: "\nSkąd miłość w pierwszy swój węzeł uroczy"
        ru: "которыми любовь в свой первый прелестный узел"
      - pl: "\nMnie usidliła; i gdym się obrócił"
        ru: "меня уловила; и когда я обернулся,"
        note: "usidlić — поймать в силки"
      - pl: "\nSpojrzeć za siebie wkoło niebokręga,"
        ru: "чтобы взглянуть назад, по кругу небосвода,"
        note: "niebokrąg — небосвод"
      - pl: "\nCo patrzącego wzrok za każdym razem"
        ru: "что каждый раз удивляет взгляд смотрящего"
      - pl: "\nSwej bezmierności zadziwia obrazem,"
        ru: "образом своей безмерности,"
      - pl: "\nTam punkt widziałem, który blask wyrzucił,"
        ru: "я увидел там точку, что метала блеск,"
      - pl: "\nBlask, co powiekę słabą śmiertelnika"
        ru: "блеск, что слабое веко смертного"
      - pl: "\nPali swym ostrzem, a paląc zamyka."
        ru: "жжёт своим остриём и, обжигая, закрывает."
    words: { "sięga": siegac, "spoglądając": spogladac, "węzeł": wezel, "obrócił": obrocic, "blask": blask, "ostrzem": ostrze }
  - clean: "Najmniejsza gwiazda świecąca z wysoka,\nWydałaby się jak księżyc dla oka,\nStojąc tuż przy nim, jak przy gwiazdach gwiazdy.\nIle w mgle może wydać się odległym\nŚwiatło od koła, w które się oplata,\nRównie odległy od punktu spostrzegłem\nKrąg ognia, który swym szybkim obrotem\nMógłby prześcignąć bieg najszybszej jazdy\nObiegającej naokoło świata."
    verse: true
    chunks:
      - pl: "Najmniejsza gwiazda świecąca z wysoka,"
        ru: "Самая малая звезда, светящая с высоты,"
      - pl: "\nWydałaby się jak księżyc dla oka,"
        ru: "показалась бы глазу луной,"
      - pl: "\nStojąc tuż przy nim, jak przy gwiazdach gwiazdy."
        ru: "стоя тут же рядом с ней, как звезда при звёздах."
      - pl: "\nIle w mgle może wydać się odległym"
        ru: "Насколько в тумане может показаться удалённым"
      - pl: "\nŚwiatło od koła, w które się oplata,"
        ru: "свет от круга, которым он себя оплетает,"
        note: "гало вокруг луны"
      - pl: "\nRównie odległy od punktu spostrzegłem"
        ru: "на таком же расстоянии от точки я заметил"
      - pl: "\nKrąg ognia, który swym szybkim obrotem"
        ru: "огненный круг, который своим быстрым вращением"
      - pl: "\nMógłby prześcignąć bieg najszybszej jazdy"
        ru: "мог бы обогнать бег быстрейшего движения,"
      - pl: "\nObiegającej naokoło świata."
        ru: "обегающего вокруг мира."
    words: { "świecąca": swiecic, "mgle": mgla, "odległym": odlegly, "spostrzegłem": spostrzec, "Krąg": krag, "obrotem": obrot }
  - clean: "Krąg był otoczon drugim kołowrotem,\nA drugi trzecim, krąg czwarty i piąty\nOtaczał szósty, nad którymi społem\nKrąg siódmy śmigał tak szerokim kołem,\nŻe tego kręgu posłanka Junony\nNie objęłaby swoimi ramiony."
    verse: true
    chunks:
      - pl: "Krąg był otoczon drugim kołowrotem,"
        ru: "Круг был окружён вторым кругом,"
      - pl: "\nA drugi trzecim, krąg czwarty i piąty"
        ru: "второй третьим, круг четвёртый и пятый"
      - pl: "\nOtaczał szósty, nad którymi społem"
        ru: "окружал шестой, а над ними всеми"
      - pl: "\nKrąg siódmy śmigał tak szerokim kołem,"
        ru: "мчался седьмой круг таким широким кольцом,"
      - pl: "\nŻe tego kręgu posłanka Junony"
        ru: "что этот круг вестница Юноны"
        note: "Ирида, радуга"
      - pl: "\nNie objęłaby swoimi ramiony."
        ru: "не объяла бы своими руками."
    words: { "drugi": drugi, "Otaczał": otaczac, "śmigał": smigac, "szerokim": szeroki, "kołem": kolo, "objęłaby": objac }
  - clean: "W kolej krąg ósmy otaczał dziewiąty\nA ruch wolniejszy był kręgu każdego,\nWzględnie do liczby, pod jaką bieg jego\nKołował dalej od kręgu pierwszego.\nNajodleglejszy krąg od iskry czystej\nMiał blask i promień więcej przeźroczysty,\nSnadź się najwięcej do niej porównywa."
    verse: true
    chunks:
      - pl: "W kolej krąg ósmy otaczał dziewiąty"
        ru: "Далее восьмой круг окружал девятый,"
        note: "у Данте — наоборот"
      - pl: "\nA ruch wolniejszy był kręgu każdego,"
        ru: "и движение было медленнее у каждого круга"
      - pl: "\nWzględnie do liczby, pod jaką bieg jego"
        ru: "соответственно числу, под которым его бег"
      - pl: "\nKołował dalej od kręgu pierwszego."
        ru: "кружил дальше от первого круга."
      - pl: "\nNajodleglejszy krąg od iskry czystej"
        ru: "Круг, самый удалённый от чистой искры,"
        note: "у Данте — самый близкий"
      - pl: "\nMiał blask i promień więcej przeźroczysty,"
        ru: "имел блеск и луч прозрачнее,"
      - pl: "\nSnadź się najwięcej do niej porównywa."
        ru: "видно, всего больше с ней сравнивается."
        note: "snadź — видно"
    words: { "ruch": ruch, "wolniejszy": wolny, "każdego": kazdy, "liczby": liczba, "bieg": bieg, "promień": promien }
  - clean: "A moja Pani widząc, jaka chmura\nGwałtownej troski nade mną ciążyła,\n«Od tego punktu», tak do mnie mówiła:\n«Zależą niebo i cała natura!\nPatrz, krąg najbliższy jaki wir porywa,\nWiedz, że przyczyną tak szybkich obrotów\nJest miłość, jaką pędzi zaogniony»."
    verse: true
    chunks:
      - pl: "A moja Pani widząc, jaka chmura"
        ru: "А моя Госпожа, видя, какая туча"
      - pl: "\nGwałtownej troski nade mną ciążyła,"
        ru: "бурной тревоги тяготела надо мной,"
      - pl: "\n«Od tego punktu», tak do mnie mówiła:"
        ru: "«От этой точки, — так говорила она мне, —"
      - pl: "\n«Zależą niebo i cała natura!"
        ru: "зависят небо и вся природа!"
      - pl: "\nPatrz, krąg najbliższy jaki wir porywa,"
        ru: "Смотри, какой вихрь увлекает ближайший круг;"
      - pl: "\nWiedz, że przyczyną tak szybkich obrotów"
        ru: "знай, что причина столь быстрых вращений —"
      - pl: "\nJest miłość, jaką pędzi zaogniony»."
        ru: "любовь, которой он, воспламенённый, мчится»."
    words: { "chmura": chmura, "troski": troska, "ciążyła": ciazyc, "natura": natura, "przyczyną": przyczyna, "pędzi": pedzic }
  - clean: "Ja do niej: «Gdyby świat był urządzony\nNa obraz ruchu, co toczy te koła,\nNa tym wykładzie przestać byłbym gotów.\nLecz gdy przeciwnie, w świecie dotykalnym\nRuch coraz większy w sferach jest widzialny,\nIm dalej krążą od swojego środka,\nJeśli swój kres tu moja żądza spotka\nW tej anielskiego budowie kościoła,\nKtóry w krąg miłość i światło otacza,\nNaucz, dlaczego nie jeden kierunek\nObrał dla siebie wzór i wizerunek?"
    verse: true
    chunks:
      - pl: "Ja do niej: «Gdyby świat był urządzony"
        ru: "Я ей: «Если бы мир был устроен"
      - pl: "\nNa obraz ruchu, co toczy te koła,"
        ru: "по образу движения, что катит эти колёса,"
      - pl: "\nNa tym wykładzie przestać byłbym gotów."
        ru: "я был бы готов удовольствоваться этим объяснением."
        note: "wykład — изложение, объяснение"
      - pl: "\nLecz gdy przeciwnie, w świecie dotykalnym"
        ru: "Но поскольку, напротив, в осязаемом мире"
      - pl: "\nRuch coraz większy w sferach jest widzialny,"
        ru: "движение в сферах видно тем большее,"
      - pl: "\nIm dalej krążą od swojego środka,"
        ru: "чем дальше они кружат от своей середины,"
      - pl: "\nJeśli swój kres tu moja żądza spotka"
        ru: "то, если моё желание найдёт здесь свой предел"
      - pl: "\nW tej anielskiego budowie kościoła,"
        ru: "в этом строении ангельского храма,"
      - pl: "\nKtóry w krąg miłość i światło otacza,"
        ru: "который кругом окружает любовь и свет,"
      - pl: "\nNaucz, dlaczego nie jeden kierunek"
        ru: "научи, почему образец и отображение"
      - pl: "\nObrał dla siebie wzór i wizerunek?"
        ru: "избрали для себя не одно направление?"
    words: { "toczy": toczyc, "wykładzie": wyklad, "przeciwnie": przeciwnie, "krążą": krazyc, "kres": kres, "wizerunek": wizerunek }
  - clean: "Bo nie mam na to sam w sobie tłumacza».\n— «Jeśli» mówiła «w sieci tego węzła\nTak niedołężnie twoja dłoń uwięzła,\nNic w tym dziwnego, bo ten węzeł święty\nTak się zawiązał, aby był nietknięty».\nA potem rzekła: «Nakłoń na to ucha,\nCo ja ci powiem; jeśli chcesz być sytym,\nZaostrzaj na tym myśl twojego ducha."
    verse: true
    chunks:
      - pl: "Bo nie mam na to sam w sobie tłumacza»."
        ru: "Ибо у меня нет для этого толкователя в себе самом»."
      - pl: "\n— «Jeśli» mówiła «w sieci tego węzła"
        ru: "— «Если, — говорила она, — в сети этого узла"
      - pl: "\nTak niedołężnie twoja dłoń uwięzła,"
        ru: "так беспомощно застряла твоя рука,"
        note: "niedołężnie — беспомощно"
      - pl: "\nNic w tym dziwnego, bo ten węzeł święty"
        ru: "в этом нет ничего удивительного, ибо этот святой узел"
      - pl: "\nTak się zawiązał, aby był nietknięty»."
        ru: "так завязался, чтобы быть нетронутым»."
      - pl: "\nA potem rzekła: «Nakłoń na to ucha,"
        ru: "А потом сказала: «Приклони ухо к тому,"
      - pl: "\nCo ja ci powiem; jeśli chcesz być sytym,"
        ru: "что я тебе скажу; если хочешь насытиться,"
      - pl: "\nZaostrzaj na tym myśl twojego ducha."
        ru: "заостряй на этом мысль своего духа."
    words: { "sieci": siec, "dłoń": dlon, "dziwnego": dziwny, "święty": swiety, "rzekła": rzec, "ducha": duch }
  - clean: "Kręgi ciał widzisz z kształtem rozmaitym,\nWiększe i mniejsze, stosownie do siły,\nJaka wstąpiła w ich nerwy i żyły.\nZ większego światła większy promień wschodzi,\nWiększa zasługa większe dobro rodzi\nI większe dobro mają większe ciała,\nGdy treść ich części równie doskonała."
    verse: true
    chunks:
      - pl: "Kręgi ciał widzisz z kształtem rozmaitym,"
        ru: "Ты видишь круги тел разной формы,"
      - pl: "\nWiększe i mniejsze, stosownie do siły,"
        ru: "бо́льшие и меньшие, соответственно силе,"
      - pl: "\nJaka wstąpiła w ich nerwy i żyły."
        ru: "что вошла в их нервы и жилы."
      - pl: "\nZ większego światła większy promień wschodzi,"
        ru: "Из большего света восходит больший луч,"
      - pl: "\nWiększa zasługa większe dobro rodzi"
        ru: "бо́льшая заслуга рождает большее благо,"
      - pl: "\nI większe dobro mają większe ciała,"
        ru: "и большее благо имеют бо́льшие тела,"
      - pl: "\nGdy treść ich części równie doskonała."
        ru: "когда сущность их частей равно совершенна."
    words: { "ciał": cialo, "kształtem": ksztalt, "wstąpiła": wstapic, "zasługa": zasluga, "równie": rownie, "doskonała": doskonaly }
  - clean: "Więc krąg ten, który najchyżej kołuje,\nPrzez podobieństwo temu odpowiada,\nKtóry najwięcej kocha i pojmuje,\nTak mierząc siłę, nie tylko rozciągłość\nIstot mających w twych oczach okrągłość,\nDziwny stosunek wyśledzi myśl rada\nSfer między sobą spojonych łańcuchem\nWielkich z małymi i z ich arcyruchem»."
    verse: true
    chunks:
      - pl: "Więc krąg ten, który najchyżej kołuje,"
        ru: "Итак, этот круг, что кружит быстрее всех,"
