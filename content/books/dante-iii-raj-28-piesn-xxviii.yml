        ru: "по подобию соответствует тому,"
      - pl: "\nKtóry najwięcej kocha i pojmuje,"
        ru: "который больше всех любит и постигает."
        note: "кругу серафимов"
      - pl: "\nTak mierząc siłę, nie tylko rozciągłość"
        ru: "Так измеряя силу, а не только протяжённость"
      - pl: "\nIstot mających w twych oczach okrągłość,"
        ru: "существ, имеющих в твоих глазах круглость,"
      - pl: "\nDziwny stosunek wyśledzi myśl rada"
        ru: "мысль охотно проследит дивное соотношение"
      - pl: "\nSfer między sobą spojonych łańcuchem"
        ru: "сфер, скреплённых между собой цепью,"
      - pl: "\nWielkich z małymi i z ich arcyruchem»."
        ru: "больших с малыми и с их высшим движением»."
    words: { "podobieństwo": podobienstwo, "odpowiada": odpowiadac, "mierząc": mierzyc, "siłę": sila, "Istot": istota, "łańcuchem": lancuch }
  - clean: "A jak półkula wyjaśnia się nasza,\nGdy tchnie łagodny wiatr z ust Boreasza,\nNiebo się czystym zaciąga obłokiem,\nŚmiejąc się do nas całym swym urokiem;\nTak jej odpowiedź jasna błąd rozprasza\nI prawda, wzrok mój zwracając na siebie,\nDała się widzieć jak gwiazda na niebie."
    verse: true
    chunks:
      - pl: "A jak półkula wyjaśnia się nasza,"
        ru: "И как проясняется наше полушарие,"
      - pl: "\nGdy tchnie łagodny wiatr z ust Boreasza,"
        ru: "когда повеет мягкий ветер из уст Борея,"
      - pl: "\nNiebo się czystym zaciąga obłokiem,"
        ru: "небо затягивается чистым облаком,"
      - pl: "\nŚmiejąc się do nas całym swym urokiem;"
        ru: "улыбаясь нам всей своей прелестью,"
      - pl: "\nTak jej odpowiedź jasna błąd rozprasza"
        ru: "так её ясный ответ рассеивает заблуждение,"
      - pl: "\nI prawda, wzrok mój zwracając na siebie,"
        ru: "и истина, обращая на себя мой взгляд,"
      - pl: "\nDała się widzieć jak gwiazda na niebie."
