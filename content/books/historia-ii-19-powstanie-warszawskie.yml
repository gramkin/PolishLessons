paragraphs:
  - clean: "Przez całą okupację Armia Krajowa przygotowywała się do powszechnego powstania, które miało wybuchnąć, gdy Niemcy będą przegrywać wojnę. W 1944 roku Armia Czerwona zbliżała się do przedwojennych granic Polski. Dowództwo AK postanowiło, że jej oddziały będą atakować wycofujących się Niemców i wyzwalać miasta, zanim wejdą do nich Rosjanie. Polscy żołnierze mieli występować wobec Armii Czerwonej jako gospodarze swojej ziemi. Plan nazwano akcją „Burza”."
    draft: true
    chunks:
      - pl: "Przez całą okupację Armia Krajowa przygotowywała się do powszechnego powstania, które miało wybuchnąć, gdy Niemcy będą przegrywać wojnę."
        ru: "Всю оккупацию Армия Крайова готовилась к всеобщему восстанию, которое должно было вспыхнуть, когда Германия начнёт проигрывать войну."
      - pl: " W 1944 roku Armia Czerwona zbliżała się do przedwojennych granic Polski."
        ru: "В 1944 году Красная армия приближалась к довоенным границам Польши."
      - pl: " Dowództwo AK postanowiło, że jej oddziały będą atakować wycofujących się Niemców i wyzwalać miasta, zanim wejdą do nich Rosjanie."
        ru: "Командование АК решило, что её отряды будут атаковать отступающих немцев и освобождать города прежде, чем туда войдут русские."
      - pl: " Polscy żołnierze mieli występować wobec Armii Czerwonej jako gospodarze swojej ziemi."
        ru: "Польские солдаты должны были выступать перед Красной армией как хозяева своей земли."
      - pl: " Plan nazwano akcją „Burza”."
        ru: "План назвали операцией «Буря»."
    words: { "przygotowywała": przygotowywac, "powszechnego": powszechny, "wybuchnąć": wybuchnac, "przegrywać": przegrywac, "Dowództwo": dowodztwo, "atakować": atakowac, "wycofujących": wycofywac, "Polscy": polski, "występować": wystepowac, "gospodarze": gospodarz }
  - clean: "W lipcu 1944 roku oddziały AK wzięły udział w walkach o Wilno razem z Armią Czerwoną. Po zdobyciu miasta NKWD zaprosiło polskich dowódców na naradę i aresztowało ich, a żołnierzy rozbrojono, część z nich wywieziono w głąb Związku Radzieckiego. Podobnie stało się we Lwowie i w innych miejscach. W Lublinie, który zajęła Armia Czerwona, ogłoszono powstanie Polskiego Komitetu Wyzwolenia Narodowego, czyli rządu złożonego z komunistów. Stało się jasne, że Stalin nie zamierza uznać władz podziemnych i że Polska może trafić pod władzę komunistów bez żadnego oporu."
    draft: true
    chunks:
      - pl: "W lipcu 1944 roku oddziały AK wzięły udział w walkach o Wilno razem z Armią Czerwoną."
        ru: "В июле 1944 года отряды АК участвовали в боях за Вильно вместе с Красной армией."
      - pl: " Po zdobyciu miasta NKWD zaprosiło polskich dowódców na naradę i aresztowało ich, a żołnierzy rozbrojono, część z nich wywieziono w głąb Związku Radzieckiego."
        ru: "После взятия города НКВД пригласил польских командиров на совещание и арестовал их, а солдат разоружили, и часть из них вывезли вглубь Советского Союза."
        note: "narada — совещание"
      - pl: " Podobnie stało się we Lwowie i w innych miejscach."
        ru: "То же самое произошло во Львове и в других местах."
      - pl: " W Lublinie, który zajęła Armia Czerwona, ogłoszono powstanie Polskiego Komitetu Wyzwolenia Narodowego, czyli rządu złożonego z komunistów."
        ru: "В Люблине, который заняла Красная армия, было объявлено о создании Польского комитета национального освобождения, то есть правительства, состоявшего из коммунистов."
      - pl: " Stało się jasne, że Stalin nie zamierza uznać władz podziemnych i że Polska może trafić pod władzę komunistów bez żadnego oporu."
        ru: "Стало ясно, что Сталин не намерен признавать подпольную власть и что Польша может оказаться под властью коммунистов без всякого сопротивления."
    words: { "lipcu": lipiec, "polskich": polski, "dowódców": dowodca, "głąb": glab, "Podobnie": podobnie, "ogłoszono": oglosic, "podziemnych": podziemny, "oporu": opor }
  - clean: "Pod koniec lipca 1944 roku czołgi radzieckie dotarły na przedpola Warszawy, a w mieście słychać było odgłosy dział. Niemcy w pośpiechu ewakuowali urzędy, a ulicami ciągnęły na zachód kolumny pobitych wojsk. Radio moskiewskie wzywało mieszkańców Warszawy do walki z Niemcami. Dowódcy Armii Krajowej, generał Tadeusz Bór-Komorowski i jego najbliżsi współpracownicy, musieli podjąć decyzję. Jeśli nie wybuchnie powstanie, komuniści oskarżą AK o bierność, a Warszawę wyzwoli Armia Czerwona. Jeśli wybuchnie, Polacy sami wyzwolą stolicę i przyjmą Rosjan jako gospodarze."
    draft: true
    chunks:
      - pl: "Pod koniec lipca 1944 roku czołgi radzieckie dotarły na przedpola Warszawy, a w mieście słychać było odgłosy dział."
        ru: "В конце июля 1944 года советские танки вышли на подступы к Варшаве, а в городе был слышен грохот орудий."
        note: "przedpole — подступы"
      - pl: " Niemcy w pośpiechu ewakuowali urzędy, a ulicami ciągnęły na zachód kolumny pobitych wojsk."
        ru: "Немцы поспешно эвакуировали учреждения, а по улицам тянулись на запад колонны разбитых войск."
      - pl: " Radio moskiewskie wzywało mieszkańców Warszawy do walki z Niemcami."
        ru: "Московское радио призывало жителей Варшавы к борьбе с немцами."
      - pl: " Dowódcy Armii Krajowej, generał Tadeusz Bór-Komorowski i jego najbliżsi współpracownicy, musieli podjąć decyzję."
        ru: "Командующему Армией Крайовой генералу Тадеушу Буру-Коморовскому и его ближайшим соратникам предстояло принять решение."
      - pl: " Jeśli nie wybuchnie powstanie, komuniści oskarżą AK o bierność, a Warszawę wyzwoli Armia Czerwona."
        ru: "Если восстание не вспыхнет, коммунисты обвинят АК в бездействии, а Варшаву освободит Красная армия."
      - pl: " Jeśli wybuchnie, Polacy sami wyzwolą stolicę i przyjmą Rosjan jako gospodarze."
        ru: "Если вспыхнет, поляки сами освободят столицу и встретят русских как хозяева."
    words: { "gospodarze": gospodarz, "lipca": lipiec, "czołgi": czolg, "odgłosy": odglos, "pośpiechu": pospiech, "urzędy": urzad, "ciągnęły": ciagnac, "zachód": zachod, "pobitych": pobic, "wojsk": wojsko, "Radio": radio, "wzywało": wzywac, "mieszkańców": mieszkaniec, "Dowódcy": dowodca, "współpracownicy": wspolpracownik, "stolicę": stolica }
  - clean: "31 lipca, po otrzymaniu fałszywej wiadomości, że radzieckie czołgi są już na Pradze, Bór-Komorowski wydał rozkaz rozpoczęcia walki. Godzinę rozpoczęcia, nazwaną godziną W, wyznaczono na piątą po południu 1 sierpnia 1944 roku. Wielu dowódców uważało decyzję za przedwczesną, bo powstańcy mieli bardzo mało broni. Tylko co któryś z kilkudziesięciu tysięcy żołnierzy miał karabin lub pistolet, a amunicji wystarczało na kilka dni walki. Młodzi ludzie, którzy czekali na tę chwilę przez pięć lat okupacji, chcieli jednak walczyć za wszelką cenę. Nikt z nich nie przypuszczał, że walka potrwa nie kilka dni, ale ponad dwa miesiące."
    draft: true
    chunks:
      - pl: "31 lipca, po otrzymaniu fałszywej wiadomości, że radzieckie czołgi są już na Pradze, Bór-Komorowski wydał rozkaz rozpoczęcia walki."
        ru: "31 июля, получив ложное известие о том, что советские танки уже в Праге, Бур-Коморовский отдал приказ начать борьбу."
      - pl: " Godzinę rozpoczęcia, nazwaną godziną W, wyznaczono na piątą po południu 1 sierpnia 1944 roku."
        ru: "Час начала, названный часом «W», назначили на пять часов вечера 1 августа 1944 года."
      - pl: " Wielu dowódców uważało decyzję za przedwczesną, bo powstańcy mieli bardzo mało broni."
        ru: "Многие командиры считали решение преждевременным, потому что у повстанцев было очень мало оружия."
        note: "przedwczesny — преждевременный"
      - pl: " Tylko co któryś z kilkudziesięciu tysięcy żołnierzy miał karabin lub pistolet, a amunicji wystarczało na kilka dni walki."
        ru: "Лишь у немногих из нескольких десятков тысяч бойцов была винтовка или пистолет, а боеприпасов хватало на несколько дней борьбы."
      - pl: " Młodzi ludzie, którzy czekali na tę chwilę przez pięć lat okupacji, chcieli jednak walczyć za wszelką cenę."
        ru: "Однако молодые люди, ждавшие этой минуты пять лет оккупации, хотели сражаться любой ценой."
      - pl: " Nikt z nich nie przypuszczał, że walka potrwa nie kilka dni, ale ponad dwa miesiące."
        ru: "Никто из них не предполагал, что борьба продлится не несколько дней, а больше двух месяцев."
    words: { "dowódców": dowodca, "lipca": lipiec, "czołgi": czolg, "wyznaczono": wyznaczyc, "piątą": piaty, "sierpnia": sierpien, "karabin": karabin, "amunicji": amunicja, "wystarczało": wystarczac, "przypuszczał": przypuszczac, "potrwa": potrwac }
  - clean: "1 sierpnia o godzinie piątej oddziały powstańcze zaatakowały niemieckie posterunki w całym mieście. Z okien domów zaczęły zwisać biało-czerwone flagi, po raz pierwszy od pięciu lat. Mieszkańcy z entuzjazmem budowali barykady z płyt chodnikowych, mebli i przewróconych tramwajów. W pierwszych dniach powstańcy opanowali większą część Śródmieścia, Starego Miasta i Woli. Nie udało się jednak zdobyć mostów na Wiśle, lotniska ani najsilniej bronionych budynków."
    draft: true
    chunks:
      - pl: "1 sierpnia o godzinie piątej oddziały powstańcze zaatakowały niemieckie posterunki w całym mieście."
        ru: "1 августа в пять часов повстанческие отряды атаковали немецкие посты по всему городу."
        note: "posterunek — пост"
      - pl: " Z okien domów zaczęły zwisać biało-czerwone flagi, po raz pierwszy od pięciu lat."
        ru: "Из окон домов свесились бело-красные флаги, впервые за пять лет."
      - pl: " Mieszkańcy z entuzjazmem budowali barykady z płyt chodnikowych, mebli i przewróconych tramwajów."
        ru: "Жители с воодушевлением строили баррикады из тротуарных плит, мебели и перевёрнутых трамваев."
        note: "chodnikowy — тротуарный"
      - pl: " W pierwszych dniach powstańcy opanowali większą część Śródmieścia, Starego Miasta i Woli."
