      - pl: " Nie udało się jednak zdobyć mostów na Wiśle, lotniska ani najsilniej bronionych budynków."
        ru: "Однако не удалось взять мосты через Вислу, аэродром и наиболее укреплённые здания."
    words: { "sierpnia": sierpien, "piątej": piaty, "niemieckie": niemiecki, "posterunki": posterunek, "flagi": flaga, "Mieszkańcy": mieszkaniec, "budowali": budowac, "płyt": plyta, "mebli": mebel, "przewróconych": przewrocic, "opanowali": opanowac, "mostów": most, "lotniska": lotnisko }
  - clean: "O wiele budynków, które Niemcy zamienili w twierdze, walki trwały tygodniami. Powstańcy zdobyli między innymi gmach telefonów PAST-y w Śródmieściu i Pocztę Główną, a w zdobytych magazynach znaleźli mundury i żywność. Nosili na ramieniu biało-czerwone opaski, a na głowach niemieckie hełmy zdobyte na wrogu. Na odbitym terenie powstańcy uwolnili kilkuset Żydów więzionych w obozie na Gęsiówce, którzy przyłączyli się do walki. Przez pierwsze dni w mieście panowała radość i nadzieja, że za kilka dni przyjdzie pomoc. Ludzie płakali ze wzruszenia, słysząc na ulicach polskie rozkazy i widząc polskich żołnierzy w biało-czerwonych opaskach."
    draft: true
    chunks:
      - pl: "O wiele budynków, które Niemcy zamienili w twierdze, walki trwały tygodniami."
        ru: "За многие здания, которые немцы превратили в крепости, бои шли неделями."
      - pl: " Powstańcy zdobyli między innymi gmach telefonów PAST-y w Śródmieściu i Pocztę Główną, a w zdobytych magazynach znaleźli mundury i żywność."
        ru: "Повстанцы взяли, среди прочего, здание телефонной станции ПАСТ в Средместье и Главный почтамт, а на захваченных складах нашли обмундирование и продовольствие."
      - pl: " Nosili na ramieniu biało-czerwone opaski, a na głowach niemieckie hełmy zdobyte na wrogu."
        ru: "Они носили на рукаве бело-красные повязки, а на головах — немецкие каски, захваченные у врага."
        note: "hełm — каска, шлем"
      - pl: " Na odbitym terenie powstańcy uwolnili kilkuset Żydów więzionych w obozie na Gęsiówce, którzy przyłączyli się do walki."
        ru: "На отбитой у немцев территории повстанцы освободили несколько сотен евреев, содержавшихся в лагере на Генсювке, и те присоединились к борьбе."
      - pl: " Przez pierwsze dni w mieście panowała radość i nadzieja, że za kilka dni przyjdzie pomoc."
        ru: "Первые дни в городе царили радость и надежда, что через несколько дней придёт помощь."
      - pl: " Ludzie płakali ze wzruszenia, słysząc na ulicach polskie rozkazy i widząc polskich żołnierzy w biało-czerwonych opaskach."
        ru: "Люди плакали от волнения, слыша на улицах польские команды и видя польских солдат в бело-красных повязках."
        note: "wzruszenie — волнение, растроганность"
    words: { "polskich": polski, "niemieckie": niemiecki, "gmach": gmach, "mundury": mundur, "żywność": zywnosc, "odbitym": odbic, "przyłączyli": przylaczyc, "panowała": panowac, "radość": radosc, "polskie": polski }
  - clean: "Hitler i Himmler wpadli we wściekłość, gdy dowiedzieli się o powstaniu. Himmler wydał rozkaz, żeby zabijać wszystkich mieszkańców, nie brać jeńców i zrównać Warszawę z ziemią. Do miasta skierowano oddziały złożone z kryminalistów, dowodzone przez Oskara Dirlewangera, i formacje kolaboracyjne złożone z obywateli radzieckich. Dowództwo nad nimi objął generał SS Erich von dem Bach-Zelewski."
