  - clean: "Od 5 sierpnia na Woli rozpoczęła się rzeź ludności cywilnej. Żołnierze niemieccy wchodzili do domów, wypędzali mieszkańców na podwórza i do fabryk i rozstrzeliwali ich z karabinów maszynowych. Zabijano mężczyzn, kobiety i dzieci, a także chorych w szpitalach razem z lekarzami i pielęgniarkami. W ciągu kilku dni zamordowano na Woli kilkadziesiąt tysięcy ludzi. Ciała palono na stosach, żeby ukryć ślady zbrodni. Podobne zbrodnie popełniono na Ochocie, gdzie mordowano, gwałcono i rabowano. Rzeź Woli była jedną z największych masakr ludności cywilnej w czasie wojny w Europie, a jej sprawcy nigdy nie ponieśli kary."
    draft: true
    chunks:
      - pl: "Od 5 sierpnia na Woli rozpoczęła się rzeź ludności cywilnej."
        ru: "С 5 августа на Воле началась резня мирного населения."
        note: "rzeź — резня"
      - pl: " Żołnierze niemieccy wchodzili do domów, wypędzali mieszkańców na podwórza i do fabryk i rozstrzeliwali ich z karabinów maszynowych."
        ru: "Немецкие солдаты входили в дома, выгоняли жителей во дворы и на фабрики и расстреливали их из пулемётов."
      - pl: " Zabijano mężczyzn, kobiety i dzieci, a także chorych w szpitalach razem z lekarzami i pielęgniarkami."
        ru: "Убивали мужчин, женщин и детей, а также больных в больницах вместе с врачами и медсёстрами."
      - pl: " W ciągu kilku dni zamordowano na Woli kilkadziesiąt tysięcy ludzi."
        ru: "За несколько дней на Воле убили несколько десятков тысяч человек."
      - pl: " Ciała palono na stosach, żeby ukryć ślady zbrodni."
        ru: "Тела сжигали на кострах, чтобы скрыть следы преступления."
        note: "stos — костёр, груда"
      - pl: " Podobne zbrodnie popełniono na Ochocie, gdzie mordowano, gwałcono i rabowano."
        ru: "Подобные преступления совершались на Охоте, где убивали, насиловали и грабили."
        note: "gwałcić — насиловать"
      - pl: " Rzeź Woli była jedną z największych masakr ludności cywilnej w czasie wojny w Europie, a jej sprawcy nigdy nie ponieśli kary."
        ru: "Резня на Воле была одним из крупнейших массовых убийств мирного населения во время войны в Европе, а её виновники так и не понесли наказания."
