chapter: 8
chapterTitle: "Pieśń VIII"
chapterTitleRu: "Песнь VIII. Город Дит"
level: B2
paragraphs:
  - clean: "(Przeprawa. Argenti. Ku kręgowi VI. Walka o wstęp do miasta Dis. )"
    chunks:
      - pl: "(Przeprawa. Argenti. Ku kręgowi VI. Walka o wstęp do miasta Dis. )"
        ru: "(Переправа. Ардженти. К кругу VI. Борьба за вход в город Дит.)"
        note: "przeprawa — переправа; wstęp — вход, доступ"
    words: { "kręgowi": krag, "Walka": walka, "wstęp": wstep, "miasta": miasto }
  - clean: "Tak postępując wzdłuż błotnych wybrzeży,\nWpierw nim przyszedłem pod wieżę wysoką,\nW szczyt jej z powodu dwóch małych płomieni\nUtkwiłem oczy; sygnał z drugiej wieży\nJej odpowiadał, lecz w takiej przestrzeni,\nŻe ledwo dobrze wytężone oko\nMogło odróżnić jeden od drugiego."
    verse: true
    chunks:
      - pl: "Tak postępując wzdłuż błotnych wybrzeży,"
        ru: "Так продвигаясь вдоль болотистых берегов,"
        note: "postępować — продвигаться"
      - pl: "\nWpierw nim przyszedłem pod wieżę wysoką,"
        ru: "ещё прежде чем я подошёл к высокой башне,"
        note: "wpierw nim — прежде чем"
      - pl: "\nW szczyt jej z powodu dwóch małych płomieni"
        ru: "на её вершину из-за двух маленьких огней"
        note: "szczyt — вершина"
      - pl: "\nUtkwiłem oczy; sygnał z drugiej wieży"
        ru: "я устремил глаза; сигнал с другой башни"
        note: "utkwić oczy — вперить глаза"
      - pl: "\nJej odpowiadał, lecz w takiej przestrzeni,"
        ru: "ей отвечал, но на таком расстоянии,"
        note: "przestrzeń — пространство, расстояние"
      - pl: "\nŻe ledwo dobrze wytężone oko"
        ru: "что едва хорошо напряжённый глаз"
        note: "wytężony — напряжённый"
      - pl: "\nMogło odróżnić jeden od drugiego."
        ru: "мог отличить один от другого."
        note: "odróżnić — отличить"
    words: { "postępując": postepowac, "wybrzeży": wybrzeze, "Wpierw": wpierw, "wieżę": wieza, "płomieni": plomien, "wytężone": wytezyc }
  - clean: "Więc się zwracając do mędrca mojego,\nPytam: «Co znaczą te hasła ogniowe,\nKto ich znakami prowadzi rozmowę?».\nA on: «Co ujrzeć pożąda twa dusza,\nJuż na tych wodach bagnistych wpław rusza,\nPatrz, gdy ci oczu tuman nie zaprósza»."
    verse: true
    chunks:
      - pl: "Więc się zwracając do mędrca mojego,"
        ru: "И вот, обращаясь к моему мудрецу,"
      - pl: "\nPytam: «Co znaczą te hasła ogniowe,"
        ru: "спрашиваю: «Что значат эти огненные сигналы,"
        note: "hasło — здесь «сигнал»; ogniowy — огненный"
      - pl: "\nKto ich znakami prowadzi rozmowę?»."
        ru: "кто их знаками ведёт разговор?»"
      - pl: "\nA on: «Co ujrzeć pożąda twa dusza,"
        ru: "А он: «То, что жаждет увидеть твоя душа,"
        note: "pożądać — жаждать"
      - pl: "\nJuż na tych wodach bagnistych wpław rusza,"
        ru: "уже по этим болотистым водам плывёт к нам,"
        note: "wpław — вплавь"
      - pl: "\nPatrz, gdy ci oczu tuman nie zaprósza»."
        ru: "смотри, если туман не застилает тебе глаз»."
        note: "zaprószyć — запорошить"
    words: { "zwracając": zwracac, "hasła": haslo, "znakami": znak, "rozmowę": rozmowa, "ujrzeć": ujrzec, "dusza": dusza }
  - clean: "Nikt szybszej strzały w powietrzu nie spotka,\nJak mała ku nam szybowała łódka;\nTen, co wioślarzem jej był i sternikiem,\nWykrzyknął: «Sam tu, zła duszo, tyś nasza!».\nMistrz mój z powagą rzekł do Flegijasza:\n«O Flegijaszu! krzyk twój próżnym krzykiem\nTym razem; nasze przyjście tu chwilowe,\nNim się przez bagno przeprawim styksowe»."
    verse: true
    chunks:
      - pl: "Nikt szybszej strzały w powietrzu nie spotka,"
        ru: "Никто более быстрой стрелы в воздухе не встретит,"
        note: "strzała — стрела"
      - pl: "\nJak mała ku nam szybowała łódka;"
        ru: "чем [та], с какой к нам неслась маленькая лодка;"
        note: "szybować — парить, нестись"
      - pl: "\nTen, co wioślarzem jej był i sternikiem,"
        ru: "тот, кто был её гребцом и кормчим,"
        note: "wioślarz — гребец; sternik — рулевой"
      - pl: "\nWykrzyknął: «Sam tu, zła duszo, tyś nasza!»."
        ru: "выкрикнул: «Сюда, злая душа, ты наша!»"
        note: "sam tu — сюда!"
      - pl: "\nMistrz mój z powagą rzekł do Flegijasza:"
        ru: "Мой учитель с важностью сказал Флегию:"
        note: "Flegijasz — Флегий"
      - pl: "\n«O Flegijaszu! krzyk twój próżnym krzykiem"
        ru: "«О Флегий! Твой крик — напрасный крик"
        note: "próżny — напрасный"
      - pl: "\nTym razem; nasze przyjście tu chwilowe,"
        ru: "на этот раз; наш приход сюда недолог,"
        note: "chwilowy — кратковременный"
      - pl: "\nNim się przez bagno przeprawim styksowe»."
        ru: "пока мы не переправимся через стигийское болото»."
        note: "przeprawim — устар. «переправимся»; styksowy — стигийский"
    words: { "łódka": lodka, "krzyk": krzyk, "powagą": powaga, "rzekł": rzec, "chwilowe": chwilowy, "bagno": bagno }
  - clean: "Jak człowiek, gdy się omylonym widzi,\nGniew swój hamuje, omyłki się wstydzi,\nTak i Flegijasz swój wybuch łagodzi.\nWtem mnie Wirgili zawezwał do łodzi,\nTa nie wprzód wagę uczuwać się zdała,\nAż ciężar mego unosiła ciała."
    verse: true
    chunks:
      - pl: "Jak człowiek, gdy się omylonym widzi,"
        ru: "Как человек, когда видит себя обманутым,"
        note: "omylony — обманутый"
      - pl: "\nGniew swój hamuje, omyłki się wstydzi,"
        ru: "сдерживает свой гнев, стыдится ошибки,"
        note: "omyłka — ошибка"
      - pl: "\nTak i Flegijasz swój wybuch łagodzi."
        ru: "так и Флегий смягчает свою вспышку."
        note: "łagodzić — смягчать"
      - pl: "\nWtem mnie Wirgili zawezwał do łodzi,"
        ru: "Тут Вергилий позвал меня в лодку,"
        note: "zawezwać — призвать, позвать"
      - pl: "\nTa nie wprzód wagę uczuwać się zdała,"
        ru: "она не прежде, казалось, ощутила вес,"
        note: "uczuwać — ощущать"
      - pl: "\nAż ciężar mego unosiła ciała."
        ru: "чем подняла тяжесть моего тела."
        note: "у Данте лодка оседает лишь под живым"
    words: { "Gniew": gniew, "wstydzi": wstydzic, "wybuch": wybuch, "łodzi": lodz, "wagę": waga, "ciężar": ciezar }
  - clean: "Gdyśmy płynęli przez te martwe brody,\nCień obłocony wynurzył się z wody,\nStaje przede mną i pyta z hałasem:\n«Ktoś ty jest, co tu przychodzisz przed czasem?»\n«A tyś kto?» rzekłem. Cień na to z rozpaczą:\n«Widzisz, że jestem jeden z tych, co płaczą»."
    verse: true
    chunks:
      - pl: "Gdyśmy płynęli przez te martwe brody,"
        ru: "Когда мы плыли через эти мёртвые воды,"
        note: "brody — броды, здесь «воды»"
      - pl: "\nCień obłocony wynurzył się z wody,"
        ru: "тень, покрытая грязью, вынырнула из воды,"
        note: "obłocony — забрызганный грязью; wynurzyć się — вынырнуть"
      - pl: "\nStaje przede mną i pyta z hałasem:"
        ru: "встаёт передо мной и спрашивает с шумом:"
      - pl: "\n«Ktoś ty jest, co tu przychodzisz przed czasem?»"
        ru: "«Кто ты такой, что приходишь сюда прежде времени?»"
        note: "ktoś ty = kto + -ś + ty: «кто ты»"
      - pl: "\n«A tyś kto?» rzekłem. Cień na to z rozpaczą:"
        ru: "«А ты кто?» — сказал я. Тень на это с отчаянием:"
      - pl: "\n«Widzisz, że jestem jeden z tych, co płaczą»."
        ru: "«Видишь, что я один из тех, кто плачет»."
    words: { "płynęli": plynac, "Cień": cien, "hałasem": halas, "przychodzisz": przychodzic, "rozpaczą": rozpacz, "płaczą": plakac }
  - clean: "A ja: «Żyj w płaczu, w wiekuistej męce!\nChoć tak zbrukało twe policzki błoto,\nPoznaję ciebie, przeklęta istoto».\nWtenczas ku łodzi cień wyciągnął ręce,\nLecz mistrz roztropny odepchnął natręta,\nMówiąc: «Z psią zgrają precz, duszo przeklęta!»"
    verse: true
    chunks:
      - pl: "A ja: «Żyj w płaczu, w wiekuistej męce!"
        ru: "А я: «Живи в плаче, в вечной муке!"
      - pl: "\nChoć tak zbrukało twe policzki błoto,"
        ru: "Хоть грязь так замарала твои щёки,"
        note: "zbrukać — замарать"
      - pl: "\nPoznaję ciebie, przeklęta istoto»."
        ru: "я узнаю тебя, проклятое существо»."
        note: "istota — существо"
      - pl: "\nWtenczas ku łodzi cień wyciągnął ręce,"
        ru: "Тогда тень протянула к лодке руки,"
      - pl: "\nLecz mistrz roztropny odepchnął natręta,"
        ru: "но благоразумный учитель оттолкнул назойливого,"
        note: "odepchnąć — оттолкнуть; natręt — назойливый человек"
      - pl: "\nMówiąc: «Z psią zgrają precz, duszo przeklęta!»"
        ru: "говоря: «Прочь к собачьей своре, проклятая душа!»"
        note: "psi — собачий; zgraja — свора"
    words: { "płaczu": placz, "policzki": policzek, "błoto": bloto, "Poznaję": poznawac, "przeklęta": przeklety, "psią": psi }
  - clean: "Potem rękoma objął mnie za szyję,\nW twarz mnie całował i rzekł: «Słusznie, duszo,\nTak się oburzasz, niechaj będzie w niebie\nBłogosławiona, co rodziła ciebie!\nOn był nadęty próżnością i pychą,\nŻadna go w życiu nie zdobiła cnota\nI tu gniew za to bez przerwy nim miota."
    verse: true
    chunks:
      - pl: "Potem rękoma objął mnie za szyję,"
        ru: "Потом руками обнял меня за шею,"
        note: "rękoma — старое твор. дв. ч.: «руками»"
      - pl: "\nW twarz mnie całował i rzekł: «Słusznie, duszo,"
        ru: "в лицо целовал меня и сказал: «Справедливо, душа,"
      - pl: "\nTak się oburzasz, niechaj będzie w niebie"
        ru: "ты так возмущаешься; да будет на небе"
        note: "oburzać się — возмущаться"
      - pl: "\nBłogosławiona, co rodziła ciebie!"
        ru: "благословенна та, что родила тебя!"
      - pl: "\nOn był nadęty próżnością i pychą,"
        ru: "Он был надут тщеславием и гордыней,"
        note: "próżność — тщеславие; pycha — гордыня"
      - pl: "\nŻadna go w życiu nie zdobiła cnota"
        ru: "никакая добродетель не украшала его в жизни,"
        note: "zdobić — украшать"
      - pl: "\nI tu gniew za to bez przerwy nim miota."
        ru: "и здесь за это гнев без перерыва его мечет."
        note: "miotać — метать, трясти"
    words: { "objął": objac, "szyję": szyja, "całował": calowac, "Słusznie": slusznie, "Błogosławiona": blogoslawic, "przerwy": przerwa }
  - clean: "Iluż na waszej ziemi dotąd żyje\nKsiążąt i królów, co się dmą i puszą,\nKażdy uchodzić za wielkiego pragnie,\nCo będą leżeć jak wieprze w tym bagnie,\nSławę po sobie zostawiwszy lichą».\n«Mistrzu», mówiłem, «łódź szybko pomyka,\nChciałbym zobaczyć tego tam grzesznika»."
    verse: true
    chunks:
      - pl: "Iluż na waszej ziemi dotąd żyje"
        ru: "Сколько же на вашей земле до сих пор живёт"
        note: "iluż — сколько же"
      - pl: "\nKsiążąt i królów, co się dmą i puszą,"
        ru: "князей и королей, что надуваются и пыжатся,"
        note: "dąć się — надуваться; puszyć się — пыжиться"
      - pl: "\nKażdy uchodzić za wielkiego pragnie,"
        ru: "каждый жаждет слыть великим,"
        note: "uchodzić za kogoś — слыть кем-л."
      - pl: "\nCo będą leżeć jak wieprze w tym bagnie,"
        ru: "что будут лежать, как свиньи, в этом болоте,"
        note: "wieprz — боров"
      - pl: "\nSławę po sobie zostawiwszy lichą»."
        ru: "оставив по себе жалкую славу»."
        note: "zostawiwszy — «оставив»"
      - pl: "\n«Mistrzu», mówiłem, «łódź szybko pomyka,"
        ru: "«Учитель, — сказал я, — лодка быстро скользит,"
        note: "pomykać — скользить, мчаться"
      - pl: "\nChciałbym zobaczyć tego tam grzesznika»."
        ru: "я хотел бы увидеть того грешника»."
    words: { "dotąd": dotad, "Książąt": ksiaze, "uchodzić": uchodzic, "pragnie": pragnac, "Sławę": slawa, "Mistrzu": mistrz }
  - clean: "Mistrz: «Nim ta łódka drugi brzeg powita,\nTakiej uciechy użyjesz do syta».\nPatrzę, aż za nim po tej mętnej toni\nBłotniste duchy pędziły w pogoni;\nZa co niech jeszcze będzie Bogu chwała\nI pochwalone jego imię święte!"
    verse: true
    chunks:
      - pl: "Mistrz: «Nim ta łódka drugi brzeg powita,"
        ru: "Учитель: «Прежде чем эта лодка приветствует другой берег,"
      - pl: "\nTakiej uciechy użyjesz do syta»."
        ru: "ты такой потехой насладишься досыта»."
        note: "uciecha — потеха, радость; użyć czegoś — насладиться; do syta — досыта"
      - pl: "\nPatrzę, aż za nim po tej mętnej toni"
        ru: "Смотрю — и вот за ним по этой мутной глади"
        note: "toń — гладь, глубина вод"
      - pl: "\nBłotniste duchy pędziły w pogoni;"
        ru: "грязные духи мчались в погоне;"
      - pl: "\nZa co niech jeszcze będzie Bogu chwała"
        ru: "за что пусть ещё будет Богу слава"
      - pl: "\nI pochwalone jego imię święte!"
        ru: "и хвалимо его святое имя!"
        note: "pochwalony — хвалимый"
    words: { "brzeg": brzeg, "powita": powitac, "użyjesz": uzyc, "duchy": duch, "pędziły": pedzic, "chwała": chwala }
  - clean: "Wszyscy krzyczeli: «Hejże na Argentę!»\nI duchów zgraja w skok za nim bieżała:\nGnany floreńczyk, jakby szczuty psami,\nZe złości szarpał, gryzł siebie zębami\nI legł znużony pod naciskiem zgrai,\nJak pies gdy w sobie dech życia przyczai."
    verse: true
    chunks:
      - pl: "Wszyscy krzyczeli: «Hejże na Argentę!»"
        ru: "Все кричали: «А ну на Ардженти!»"
        note: "hejże na… — а ну, бей…; Argenta — Филиппо Ардженти, флорентиец"
      - pl: "\nI duchów zgraja w skok za nim bieżała:"
        ru: "и свора духов вскачь бежала за ним:"
        note: "w skok — вскачь; bieżeć — устар. «бежать»"
      - pl: "\nGnany floreńczyk, jakby szczuty psami,"
        ru: "гонимый флорентиец, будто травимый собаками,"
        note: "szczuty — травимый; floreńczyk — флорентиец"
      - pl: "\nZe złości szarpał, gryzł siebie zębami"
        ru: "со злости рвал, грыз себя зубами"
      - pl: "\nI legł znużony pod naciskiem zgrai,"
        ru: "и лёг, изнурённый, под натиском своры,"
        note: "nacisk — натиск"
      - pl: "\nJak pies gdy w sobie dech życia przyczai."
        ru: "как пёс, когда в себе дыхание жизни затаит."
        note: "przyczaić — затаить"
    words: { "krzyczeli": krzyczec, "skok": skok, "psami": pies, "zębami": zab, "naciskiem": nacisk, "dech": dech }
  - clean: "Dość mówić o nim! Nowy jęk z uboczy\nWpadł w ucho moje, wytężyłem oczy.\nMistrz mówił: «Synu, patrz mury olbrzymie,\nUjrzysz za chwilę miasto, Dis na imię,\nMieszkańcy żyją tam w ogniu i dymie».\nA ja: «W dolinie postrzegam zaiste\nMiasto meczetów, ich mur się czerwieni,\nJakby się wyrwał dopiero z płomieni»."
    verse: true
    chunks:
      - pl: "Dość mówić o nim! Nowy jęk z uboczy"
        ru: "Довольно о нём! Новый стон сбоку"
      - pl: "\nWpadł w ucho moje, wytężyłem oczy."
        ru: "попал мне в ухо, я напряг глаза."
        note: "wytężyć — напрячь"
      - pl: "\nMistrz mówił: «Synu, patrz mury olbrzymie,"
        ru: "Учитель сказал: «Сын, смотри — исполинские стены,"
      - pl: "\nUjrzysz za chwilę miasto, Dis na imię,"
        ru: "увидишь сейчас город по имени Дит,"
        note: "Dis — Дит, нижний ад"
      - pl: "\nMieszkańcy żyją tam w ogniu i dymie»."
        ru: "жители живут там в огне и дыму»."
      - pl: "\nA ja: «W dolinie postrzegam zaiste"
        ru: "А я: «В долине я различаю воистину"
        note: "postrzegać — замечать; zaiste — воистину"
      - pl: "\nMiasto meczetów, ich mur się czerwieni,"
        ru: "город мечетей, их стена краснеет,"
        note: "meczet — мечеть"
      - pl: "\nJakby się wyrwał dopiero z płomieni»."
        ru: "будто только что вырвалась из пламени»."
    words: { "mury": mur, "Mieszkańcy": mieszkaniec, "ogniu": ogien, "dymie": dym, "dolinie": dolina, "wyrwał": wyrwac }
  - clean: "Mistrz odpowiedział: «Ognie wiekuiste,\nKtóre w ich wnętrzach żarzą się i płoną,\nDają im barwę, jak widzisz, czerwoną».\nWeszliśmy w końcu do fosy głębokiej,\nOkopującej w krąg ziemię spaloną,\nPustą, jak gdyby szła po niej zaraza,\nMury na pozór zdały się z żelaza."
    verse: true
    chunks:
      - pl: "Mistrz odpowiedział: «Ognie wiekuiste,"
        ru: "Учитель ответил: «Вечные огни,"
      - pl: "\nKtóre w ich wnętrzach żarzą się i płoną,"
