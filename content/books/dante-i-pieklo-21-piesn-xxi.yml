# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 21
chapterTitle: "Pieśń XXI"
chapterTitleRu: "Песнь XXI. Мздоимцы в смоле"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok V. Przedajni.)"
    chunks:
      - pl: "(Krąg VIII. Tłumok V. Przedajni.)"
        ru: "(Круг VIII. Ров V. Мздоимцы.)"
        note: "przedajny — продажный"
    words: { "Krąg": krag }
  - clean: "Tak na most z mostu, mówiąc rzeczy inne,\nA których pieśń ta opiewać nie myśli,\nPrzez skalne chrapy, progi niegościnne,\nPiąty z kolei, kiedyśmy już przyszli:\nWytchnąwszy trochę, ciekawością ginę,\nAby oglądać inną rozpadlinę\nTych złych tłumoków, inne łzy daremne;\nDno jej, widziałem, szczególnie jest ciemne."
    verse: true
    chunks:
      - pl: "Tak na most z mostu, mówiąc rzeczy inne,"
        ru: "Так с моста на мост, говоря о другом,"
      - pl: "\nA których pieśń ta opiewać nie myśli,"
        ru: "о чём эта песнь воспевать не думает,"
      - pl: "\nPrzez skalne chrapy, progi niegościnne,"
        ru: "по скальным ухабам, негостеприимным уступам,"
        note: "chrapy — неровности, ухабы"
      - pl: "\nPiąty z kolei, kiedyśmy już przyszli:"
        ru: "когда мы уже пришли к пятому по счёту,"
        note: "z kolei — по счёту"
      - pl: "\nWytchnąwszy trochę, ciekawością ginę,"
        ru: "передохнув немного, я умираю от любопытства,"
        note: "ginąć z ciekawości — умирать от любопытства"
      - pl: "\nAby oglądać inną rozpadlinę"
        ru: "чтобы увидеть другую расщелину"
        note: "rozpadlina — расщелина"
      - pl: "\nTych złych tłumoków, inne łzy daremne;"
        ru: "этих Злых Щелей, иные напрасные слёзы;"
      - pl: "\nDno jej, widziałem, szczególnie jest ciemne."
        ru: "дно её, видел я, особенно темно."
    words: { "most": most, "pieśń": piesn, "progi": prog, "ciekawością": ciekawosc, "szczególnie": szczegolnie, "ciemne": ciemny }
  - clean: "Jak w arsenale weneckim wśród zimy\nW dymiących kotłach war smoły widzimy,\nAby nadpsute przez morskie odmęty,\nJuż nieżeglowne naprawiać okręty;\nCi smołę leją, ci tkają pakuły\nW szczel łodzi, którą podróże nadpsuły;\nCi nowych statków budową zajęci,\nTen struga wiosło, drugi linę kręci:\nTak nie przez ogień, lecz przez bożą wolę\nWrzały w tej jamie gęste wary smolne,\nJak klejem lepiąc jej ściany okolne."
    verse: true
    chunks:
      - pl: "Jak w arsenale weneckim wśród zimy"
        ru: "Как в венецианском арсенале среди зимы"
      - pl: "\nW dymiących kotłach war smoły widzimy,"
        ru: "в дымящих котлах мы видим варево смолы,"
        note: "kocioł — котёл; war — кипящее варево; smoła — смола"
      - pl: "\nAby nadpsute przez morskie odmęty,"
        ru: "чтобы попорченные морской пучиной"
        note: "nadpsuty — попорченный; odmęt — пучина"
      - pl: "\nJuż nieżeglowne naprawiać okręty;"
        ru: "уже негодные к плаванию корабли чинить;"
        note: "nieżeglowny — негодный к плаванию; okręt — корабль"
      - pl: "\nCi smołę leją, ci tkają pakuły"
        ru: "одни льют смолу, другие конопатят паклей"
        note: "pakuły — пакля"
      - pl: "\nW szczel łodzi, którą podróże nadpsuły;"
        ru: "щели лодки, что путешествия попортили;"
        note: "szczel — устар. «щель»"
      - pl: "\nCi nowych statków budową zajęci,"
        ru: "одни заняты постройкой новых судов,"
      - pl: "\nTen struga wiosło, drugi linę kręci:"
        ru: "этот строгает весло, другой вьёт канат:"
        note: "strugać — строгать; lina — канат"
      - pl: "\nTak nie przez ogień, lecz przez bożą wolę"
        ru: "так не огнём, а Божьей волей"
      - pl: "\nWrzały w tej jamie gęste wary smolne,"
        ru: "кипело в этой яме густое смоляное варево,"
      - pl: "\nJak klejem lepiąc jej ściany okolne."
        ru: "словно клеем облепляя её окружные стены."
        note: "klej — клей"
    words: { "zimy": zima, "morskie": morski, "naprawiać": naprawiac, "okręty": okret, "budową": budowa, "jamie": jama }
  - clean: "Wydęte bąble na powierzchni waru,\nCiągle, widziałem, pękały od skwaru:\nPodczas gdy oczy utkwiłem w tej smole,\nWódz mówiąc: «Strzeż się! strzeż się!» — mnie z zapałem\nDo siebie z miejsca przyciągnął, gdzie stałem.\nJam się odwrócił, jak ów nieroztropny,\nCo bieży widok oglądać okropny,\nA patrząc, ledwie nie mdleje od trwogi."
    verse: true
    chunks:
      - pl: "Wydęte bąble na powierzchni waru,"
        ru: "Вздутые пузыри на поверхности варева,"
        note: "bąbel — пузырь"
      - pl: "\nCiągle, widziałem, pękały od skwaru:"
        ru: "видел я, всё время лопались от жара:"
      - pl: "\nPodczas gdy oczy utkwiłem w tej smole,"
        ru: "пока я вперил глаза в эту смолу,"
      - pl: "\nWódz mówiąc: «Strzeż się! strzeż się!» — mnie z zapałem"
        ru: "вождь, говоря: «Берегись! Берегись!» — с жаром"
      - pl: "\nDo siebie z miejsca przyciągnął, gdzie stałem."
        ru: "притянул меня к себе с места, где я стоял."
      - pl: "\nJam się odwrócił, jak ów nieroztropny,"
        ru: "Я обернулся, как тот неразумный,"
      - pl: "\nCo bieży widok oglądać okropny,"
        ru: "что бежит смотреть на страшное зрелище,"
      - pl: "\nA patrząc, ledwie nie mdleje od trwogi."
        ru: "а глядя, чуть не падает в обморок от страха."
    words: { "Wódz": wodz, "Strzeż": strzec, "odwrócił": odwrocic, "widok": widok, "okropny": okropny, "ledwie": ledwie }
  - clean: "I diabeł czarny biegł mostem za nami,\nO jakże jego była postać dzika!\nJak groźne gesta! Ciężkimi skrzydłami\nSzumiał, a lekko biegł na obie nogi:\nBarki spiczaste, widzę, nowe cudo!\nNa ostrych barkach unosił grzesznika,\nJak hakiem szponą trzymając za udo."
    verse: true
    chunks:
      - pl: "I diabeł czarny biegł mostem za nami,"
        ru: "И чёрный бес бежал по мосту за нами,"
      - pl: "\nO jakże jego była postać dzika!"
        ru: "о, какой дикий был у него вид!"
      - pl: "\nJak groźne gesta! Ciężkimi skrzydłami"
        ru: "Какие грозные жесты! Тяжёлыми крыльями"
      - pl: "\nSzumiał, a lekko biegł na obie nogi:"
        ru: "он шумел, а легко бежал на обеих ногах:"
      - pl: "\nBarki spiczaste, widzę, nowe cudo!"
        ru: "плечи острые, вижу, новое диво!"
        note: "spiczasty — острый; cudo — диво"
      - pl: "\nNa ostrych barkach unosił grzesznika,"
        ru: "на острых плечах он нёс грешника,"
      - pl: "\nJak hakiem szponą trzymając za udo."
        ru: "держа его когтем, как крюком, за бедро."
        note: "hak — крюк"
    words: { "jakże": jakze, "postać": postac, "groźne": grozny, "skrzydłami": skrzydlo, "ostrych": ostry, "hakiem": hak }
  - clean: "Z naszego mostu wołał zaperzony:\n«Oto jest jeden z radców z Santa-Zita,\nRzucaj go w jamę, panie Ostroszpony!\nWracam, gdzie strona w takich dość obfita:\nOprócz Bontura, tam każdy ladaco,\nNie w Tak przemieni, gdy mu za to płacą»."
    verse: true
    chunks:
      - pl: "Z naszego mostu wołał zaperzony:"
        ru: "С нашего моста он кричал, разгорячённый:"
        note: "zaperzony — разгорячённый"
      - pl: "\n«Oto jest jeden z radców z Santa-Zita,"
        ru: "«Вот один из старейшин Санта-Циты,"
        note: "Santa Zita — покровительница Лукки; radca — советник"
      - pl: "\nRzucaj go w jamę, panie Ostroszpony!"
        ru: "бросай его в яму, господин Острокоготь!"
        note: "Ostroszpony — у Korsaka польская кличка беса (у Данте Malebranche)"
      - pl: "\nWracam, gdzie strona w takich dość obfita:"
        ru: "Я возвращаюсь туда, где край довольно богат такими:"
      - pl: "\nOprócz Bontura, tam każdy ladaco,"
        ru: "кроме Бонтуро, там каждый — негодяй,"
        note: "у Данте ирония: Бонтуро — худший из всех"
      - pl: "\nNie w Tak przemieni, gdy mu za to płacą»."
        ru: "„нет“ в „да“ превратит, когда ему за это платят»."
    words: { "wołał": wolac, "Rzucaj": rzucac, "Wracam": wracac, "strona": strona, "każdy": kazdy, "płacą": placic }
  - clean: "Rzucił go w jamę, a sam szybkostopy\nBiegł jak pies dworny za złodziejem w tropy.\nGrzesznik dał nurka i cały zbrukany\nWypłynął na wierzch; ukryte szatany\nZa skałą, krzycząc taką groźbę gwarzą:\n«Tu cię nie zbawi obraz z świętą twarzą."
    verse: true
    chunks:
      - pl: "Rzucił go w jamę, a sam szybkostopy"
        ru: "Бросил его в яму, а сам, быстроногий,"
      - pl: "\nBiegł jak pies dworny za złodziejem w tropy."
        ru: "побежал, как дворовый пёс по следам за вором."
        note: "dworny — дворовый"
      - pl: "\nGrzesznik dał nurka i cały zbrukany"
        ru: "Грешник нырнул и, весь замаранный,"
        note: "dać nurka — нырнуть"
      - pl: "\nWypłynął na wierzch; ukryte szatany"
        ru: "всплыл наверх; бесы, укрытые"
      - pl: "\nZa skałą, krzycząc taką groźbę gwarzą:"
        ru: "за скалой, крича, гудят такую угрозу:"
        note: "gwarzyć — гомонить"
      - pl: "\n«Tu cię nie zbawi obraz z świętą twarzą."
        ru: "«Здесь тебя не спасёт образ со святым ликом."
        note: "Святой Лик — чтимое в Лукке распятие"
    words: { "złodziejem": zlodziej, "tropy": trop, "Wypłynął": wyplynac, "szatany": szatan, "skałą": skala, "groźbę": grozba }
  - clean: "Tu pływacz lekko jak w Serchio nie pierzchnie,\nJeśli mieć nie chcesz od naszych szpon znaków,\nNie marszcz daremnie tej smoły powierzchnie».\nI weń wrazili więcej jak sto haków,\nMówiąc: «Tam na dnie tańcuj sobie w koło,\nGdy możesz skraść co, to chyba pod smołą»."
    verse: true
    chunks:
      - pl: "Tu pływacz lekko jak w Serchio nie pierzchnie,"
        ru: "Здесь пловец не уплывёт легко, как в Серкьо,"
        note: "pływacz — пловец; Serchio — река у Лукки"
      - pl: "\nJeśli mieć nie chcesz od naszych szpon znaków,"
        ru: "если не хочешь иметь знаков от наших когтей,"
      - pl: "\nNie marszcz daremnie tej smoły powierzchnie»."
        ru: "не мути напрасно поверхности этой смолы»."
        note: "marszczyć — морщить"
      - pl: "\nI weń wrazili więcej jak sto haków,"
        ru: "И вонзили в него больше сотни крюков,"
        note: "wrazić — вонзить"
      - pl: "\nMówiąc: «Tam na dnie tańcuj sobie w koło,"
        ru: "говоря: «Там, на дне, пляши себе по кругу,"
        note: "tańcować — плясать"
      - pl: "\nGdy możesz skraść co, to chyba pod smołą»."
        ru: "если можешь что-нибудь украсть, то разве что под смолой»."
    words: { "chcesz": chciec, "znaków": znak, "Mówiąc": mowic, "koło": kolo, "możesz": moc, "skraść": skrasc }
  - clean: "Tak kucharz swoim trójzębem w naczynie\nZatapia mięso, gdy na wierzch wypłynie.\nA mistrz: «Oszukaj zgraję diabłów całą,\nChyłkiem pół zgięty skryj się za tą skałą.\nNie bój się o mnie, znam się z ich obrazą,\nJuż ja w tym zgiełku byłem inną razą»."
    verse: true
    chunks:
      - pl: "Tak kucharz swoim trójzębem w naczynie"
        ru: "Так повар своим трезубцем в посудину"
        note: "trójząb — трезубец; naczynie — посудина"
      - pl: "\nZatapia mięso, gdy na wierzch wypłynie."
        ru: "погружает мясо, когда оно всплывёт наверх."
      - pl: "\nA mistrz: «Oszukaj zgraję diabłów całą,"
        ru: "А учитель: «Обмани всю свору бесов,"
      - pl: "\nChyłkiem pół zgięty skryj się za tą skałą."
        ru: "украдкой, полусогнувшись, спрячься за той скалой."
        note: "chyłkiem — украдкой"
      - pl: "\nNie bój się o mnie, znam się z ich obrazą,"
        ru: "Не бойся за меня, я знаю их злобу,"
        note: "obraza — здесь «злоба»"
      - pl: "\nJuż ja w tym zgiełku byłem inną razą»."
        ru: "я уже был в этой сумятице в другой раз»."
    words: { "kucharz": kucharz, "naczynie": naczynie, "mięso": mieso, "Oszukaj": oszukac, "Chyłkiem": chylkiem, "obrazą": obraza }
  - clean: "I ledwo przeszedł przez mostu upusty,\nDochodząc śmiałym krokiem pod most szósty,\nW krąg pogodnymi spoglądał oczyma.\nWtem jak huragan, jakby psiarnia jaka,\nCo się obcesem rzuca na żebraka,\nGdy żebrząc chleba u drzwi się zatrzyma,\nSzatany biegły ze dna skałoziemu,\nWszystkie swe haki zwróciły ku niemu,\nA wódz mój wołał: «Stój, rodzie obrzydły:\nWpierw nim na wasze weźmiecie mię widły,\nPrzyjdź który do mnie, niechaj mnie wysłucha,\nMoże się gniew wasz nieco udobrucha»."
    verse: true
    chunks:
      - pl: "I ledwo przeszedł przez mostu upusty,"
        ru: "И едва он прошёл через провалы моста,"
      - pl: "\nDochodząc śmiałym krokiem pod most szósty,"
        ru: "подходя смелым шагом к шестому мосту,"
      - pl: "\nW krąg pogodnymi spoglądał oczyma."
        ru: "кругом поглядывал спокойными глазами."
      - pl: "\nWtem jak huragan, jakby psiarnia jaka,"
        ru: "Вдруг, как ураган, словно какая-то псарня,"
        note: "psiarnia — свора собак"
      - pl: "\nCo się obcesem rzuca na żebraka,"
        ru: "что внезапно бросается на нищего,"
        note: "obcesem — внезапно, напролом; żebrak — нищий"
      - pl: "\nGdy żebrząc chleba u drzwi się zatrzyma,"
        ru: "когда он, прося хлеба, остановится у дверей,"
        note: "żebrać — просить милостыню"
      - pl: "\nSzatany biegły ze dna skałoziemu,"
        ru: "бесы выбежали со дна каменной ямы,"
        note: "skałoziem — устар. «каменистая земля»"
      - pl: "\nWszystkie swe haki zwróciły ku niemu,"
        ru: "все свои крюки обратили к нему,"
      - pl: "\nA wódz mój wołał: «Stój, rodzie obrzydły:"
        ru: "а мой вождь кричал: «Стой, мерзкое отродье:"
      - pl: "\nWpierw nim na wasze weźmiecie mię widły,"
        ru: "прежде чем возьмёте меня на свои вилы,"
      - pl: "\nPrzyjdź który do mnie, niechaj mnie wysłucha,"
        ru: "пусть придёт ко мне кто-нибудь, пусть меня выслушает,"
      - pl: "\nMoże się gniew wasz nieco udobrucha»."
        ru: "может, ваш гнев немного смягчится»."
        note: "udobruchać się — смягчиться"
    words: { "ledwo": ledwo, "spoglądał": spogladac, "chleba": chleb, "rodzie": rod-2, "Wpierw": wpierw, "gniew": gniew }
  - clean: "Jakby zahuczał grom jeden i drugi,\nWszyscy krzyknęli straszliwymi wrzaski:\n«Idź sam do niego, Przeklęty Ogonie!»\nJeden szedł, drudzy stali nieruchomie\nPodchodząc: «Jestem» rzekł «na twe usługi».\n— «Czyżbyś mnie widział na tej skały złomie\nZdrowym i całym, mimo wasze bronie,\nBez woli bożej i niebieskiej łaski?"
    verse: true
    chunks:
      - pl: "Jakby zahuczał grom jeden i drugi,"
        ru: "Словно прогремел гром раз и другой,"
      - pl: "\nWszyscy krzyknęli straszliwymi wrzaski:"
        ru: "все закричали страшными воплями:"
        note: "wrzaski — устар. твор. мн."
      - pl: "\n«Idź sam do niego, Przeklęty Ogonie!»"
        ru: "«Иди сам к нему, Проклятый Хвост!»"
        note: "Przeklęty Ogon — бес Malacoda"
      - pl: "\nJeden szedł, drudzy stali nieruchomie"
        ru: "Один пошёл, другие стояли неподвижно;"
      - pl: "\nPodchodząc: «Jestem» rzekł «na twe usługi»."
        ru: "подходя: «Я, — сказал, — к твоим услугам»."
      - pl: "\n— «Czyżbyś mnie widział na tej skały złomie"
        ru: "— «Неужели ты видел бы меня на изломе этой скалы"
        note: "złom — излом, обломок"
      - pl: "\nZdrowym i całym, mimo wasze bronie,"
        ru: "здоровым и невредимым, несмотря на ваше оружие,"
      - pl: "\nBez woli bożej i niebieskiej łaski?"
        ru: "без воли Божьей и небесной милости?"
    words: { "Przeklęty": przeklety, "Ogonie": ogon, "Podchodząc": podchodzic, "rzekł": rzec, "bożej": bozy, "niebieskiej": niebieski }
  - clean: "Puść mnie! Bo niebo chce na twoją trwogę,\nAbym jednemu wskazywał tu drogę!»\nI na te słowa mistrza rozdąsana\nTak silnie pycha zgięła się szatana,\nŻe z rąk mu widły upadły pod nogi\nI rzekł do swoich: «Nie brać go na rogi!»"
    verse: true
    chunks:
      - pl: "Puść mnie! Bo niebo chce na twoją trwogę,"
        ru: "Пусти меня! Ибо небо хочет, к твоему страху,"
      - pl: "\nAbym jednemu wskazywał tu drogę!»"
        ru: "чтобы я указывал здесь дорогу одному!»"
      - pl: "\nI na te słowa mistrza rozdąsana"
        ru: "И при этих словах учителя разъярённая"
        note: "rozdąsany — разъярённый"
      - pl: "\nTak silnie pycha zgięła się szatana,"
        ru: "так сильно гордыня беса согнулась,"
      - pl: "\nŻe z rąk mu widły upadły pod nogi"
        ru: "что вилы упали у него из рук к ногам,"
      - pl: "\nI rzekł do swoich: «Nie brać go na rogi!»"
        ru: "и он сказал своим: «Не брать его на рога!»"
    words: { "Puść": puscic, "niebo": niebo, "wskazywał": wskazywac, "mistrza": mistrz, "upadły": upasc, "rogi": rog }
