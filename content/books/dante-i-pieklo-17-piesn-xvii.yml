# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 17
chapterTitle: "Pieśń XVII"
chapterTitleRu: "Песнь XVII. Герион"
level: B2
paragraphs:
  - clean: "(Gerion. Ostatni z koła III: lichwiarze. Odjazd.)"
    chunks:
      - pl: "(Gerion. Ostatni z koła III: lichwiarze. Odjazd.)"
        ru: "(Герион. Последние из III пояса: ростовщики. Отлёт.)"
        note: "odjazd — отъезд"
    words: { "Ostatni": ostatni }
  - clean: "«Zarażająca świat tchem jadowitym,\nOto z ogonem stalowym bestyja.\nKtórym broń łamie i mury przebija!»\nTak mówił wódz mój, a na zwierza skinął,\nAby z powietrza do nas lot swój zwinął,\nNa brzeg, gdzie szliśmy nadrzecznym granitem."
    verse: true
    chunks:
      - pl: "«Zarażająca świat tchem jadowitym,"
        ru: "«Отравляющий мир ядовитым дыханием, —"
        note: "zarażać — заражать; jadowity — ядовитый"
      - pl: "\nOto z ogonem stalowym bestyja."
        ru: "вот зверь со стальным хвостом,"
        note: "bestyja — старое написание bestia"
      - pl: "\nKtórym broń łamie i mury przebija!»"
        ru: "которым он ломает оружие и пробивает стены!»"
      - pl: "\nTak mówił wódz mój, a na zwierza skinął,"
        ru: "Так говорил мой вождь и кивнул зверю,"
        note: "skinąć — кивнуть, подать знак"
      - pl: "\nAby z powietrza do nas lot swój zwinął,"
        ru: "чтобы он из воздуха свернул свой полёт к нам,"
        note: "zwinąć — свернуть"
      - pl: "\nNa brzeg, gdzie szliśmy nadrzecznym granitem."
        ru: "на берег, где мы шли по речному граниту."
        note: "nadrzeczny — речной"
    words: { "tchem": dech, "ogonem": ogon, "wódz": wodz, "zwierza": zwierz, "skinął": skinac, "brzeg": brzeg }
  - clean: "I oszukaństwa spadł obraz obrzydły;\nWysunął głowę, pierś pod stopy nasze,\nLecz nie położył ogona na tamie.\nTen latający dziwoląg, nie kłamię,\nSprawiedliwego miał oblicze męża,\nA skóra na nim błyszcząca i miękka,\nResztą był ciała podobny do węża."
    verse: true
    chunks:
      - pl: "I oszukaństwa spadł obraz obrzydły;"
        ru: "И опустился мерзкий образ обмана;"
        note: "oszukaństwo — обман"
      - pl: "\nWysunął głowę, pierś pod stopy nasze,"
        ru: "выдвинул голову, грудь к нашим ногам,"
      - pl: "\nLecz nie położył ogona na tamie."
        ru: "но не положил хвоста на плотину."
        note: "tama — плотина"
      - pl: "\nTen latający dziwoląg, nie kłamię,"
        ru: "У этого летающего чудища, не лгу,"
        note: "dziwoląg — чудище, диковина"
      - pl: "\nSprawiedliwego miał oblicze męża,"
        ru: "было лицо праведного мужа,"
        note: "oblicze — лицо, лик"
      - pl: "\nA skóra na nim błyszcząca i miękka,"
        ru: "а кожа на нём блестящая и мягкая,"
      - pl: "\nResztą był ciała podobny do węża."
        ru: "остальным телом он был подобен змее."
    words: { "Wysunął": wysunac, "tamie": tama, "Sprawiedliwego": sprawiedliwy, "oblicze": oblicze, "błyszcząca": blyszczec, "miękka": miekki }
  - clean: "A miał dwie łapy zakrzywione w widły,\nPodszyte puchem pod samo podpasze;\nPierś, grzbiet i boki jak hieroglif jaki\nByły pisane w kółka i gzygzaki:\nPiękniej Arachny nie dzierzgała ręka,\nTkań, jaką snuje piękna odaliska,\nWiększym bogactwem barwy nie połyska."
    verse: true
    chunks:
      - pl: "A miał dwie łapy zakrzywione w widły,"
        ru: "А было у него две лапы, изогнутые вилами,"
        note: "zakrzywiony — изогнутый"
      - pl: "\nPodszyte puchem pod samo podpasze;"
        ru: "подбитые пухом до самых подмышек;"
        note: "podszyty — подбитый; podpasze — устар. «подмышки»"
      - pl: "\nPierś, grzbiet i boki jak hieroglif jaki"
        ru: "грудь, спина и бока, как какой-то иероглиф,"
      - pl: "\nByły pisane w kółka i gzygzaki:"
        ru: "были расписаны кольцами и зигзагами:"
        note: "gzygzak — устар. «зигзаг»"
      - pl: "\nPiękniej Arachny nie dzierzgała ręka,"
        ru: "прекраснее рука Арахны не ткала,"
        note: "dzierzgać — устар. «ткать, вышивать»"
      - pl: "\nTkań, jaką snuje piękna odaliska,"
        ru: "ткань, что прядёт прекрасная одалиска,"
        note: "tkań — ткань; snuć — прясть"
      - pl: "\nWiększym bogactwem barwy nie połyska."
        ru: "большим богатством красок не переливается."
        note: "połyskiwać — переливаться"
    words: { "Podszyte": podszyc, "Pierś": piers, "grzbiet": grzbiet, "kółka": kolko, "Piękniej": pieknie, "bogactwem": bogactwo }
  - clean: "Jak czasem stoją w brzegach rzeki łodzie,\nNa pół na ziemi, a na poły w wodzie,\nJak bóbr do walki po pas wynurzony,\nW kraju, gdzie żyją żarłoczne Teutony,\nTak zajmowała ta bestyja dzika\nBrzeg, co step piasków granitem zamyka."
    verse: true
    chunks:
      - pl: "Jak czasem stoją w brzegach rzeki łodzie,"
        ru: "Как порой стоят у берегов реки лодки,"
      - pl: "\nNa pół na ziemi, a na poły w wodzie,"
        ru: "наполовину на земле, а наполовину в воде,"
      - pl: "\nJak bóbr do walki po pas wynurzony,"
        ru: "как бобр для ловли по пояс высунувшийся"
        note: "bóbr — бобр"
      - pl: "\nW kraju, gdzie żyją żarłoczne Teutony,"
        ru: "в стране, где живут прожорливые тевтоны,"
        note: "żarłoczny — прожорливый; Teuton — тевтон"
      - pl: "\nTak zajmowała ta bestyja dzika"
        ru: "так занимал этот дикий зверь"
      - pl: "\nBrzeg, co step piasków granitem zamyka."
        ru: "берег, что замыкает гранитом степь песков."
    words: { "rzeki": rzeka, "łodzie": lodz, "walki": walka, "zajmowała": zajmowac, "piasków": piasek, "zamyka": zamykac }
  - clean: "Całym ogonem potwór na wiatr miotał,\nJak skorpion żądłem zatrutym migotał,\nA wódz mi mówił: «Teraz nam z wybrzeży\nZstąpić przystoi, gdzie ten potwór leży».\nI schodząc w prawo (któż ostrożność zgani?),\nJeszcze dwa dałem kroki tym wybrzeżem\nZ myślą, że w stepie ognia się ustrzeżem."
    verse: true
    chunks:
      - pl: "Całym ogonem potwór na wiatr miotał,"
        ru: "Всем хвостом чудовище металось на ветру,"
      - pl: "\nJak skorpion żądłem zatrutym migotał,"
        ru: "как скорпион, мерцало отравленным жалом,"
      - pl: "\nA wódz mi mówił: «Teraz nam z wybrzeży"
        ru: "а вождь говорил мне: «Теперь нам с берегов"
      - pl: "\nZstąpić przystoi, gdzie ten potwór leży»."
        ru: "следует спуститься туда, где лежит это чудовище»."
      - pl: "\nI schodząc w prawo (któż ostrożność zgani?),"
        ru: "И, спускаясь направо (кто осудит осторожность?),"
        note: "zganić — осудить"
      - pl: "\nJeszcze dwa dałem kroki tym wybrzeżem"
        ru: "я сделал ещё два шага по этому берегу"
      - pl: "\nZ myślą, że w stepie ognia się ustrzeżem."
        ru: "с мыслью, что убережёмся в степи от огня."
        note: "ustrzec się — уберечься"
    words: { "wiatr": wiatr, "zatrutym": zatruc, "wybrzeży": wybrzeze, "schodząc": schodzic, "ostrożność": ostroznosc, "ognia": ogien }
  - clean: "Gdyśmy stanęli przed tym ptako-zwierzem,\nNieco opodal, u progu otchłani,\nDuchy, widziałem, na piasku siedziały.\nA mistrz: «Ażebyś poznał krąg ten cały,\nIdź, poznaj bliżej ich stan i katusze,\nLecz z nimi długą nie baw się rozmową:\nNim wrócisz, spytać tej bestyi muszę,\nCzy nam do jazdy grzbietu nie użyczy»."
    verse: true
    chunks:
      - pl: "Gdyśmy stanęli przed tym ptako-zwierzem,"
        ru: "Когда мы встали перед этим птицезверем,"
        note: "ptako-zwierz — птицезверь"
      - pl: "\nNieco opodal, u progu otchłani,"
        ru: "чуть поодаль, на пороге бездны,"
        note: "opodal — поодаль"
      - pl: "\nDuchy, widziałem, na piasku siedziały."
        ru: "я видел: на песке сидели духи."
      - pl: "\nA mistrz: «Ażebyś poznał krąg ten cały,"
        ru: "А учитель: «Чтобы ты узнал весь этот круг,"
      - pl: "\nIdź, poznaj bliżej ich stan i katusze,"
        ru: "иди, узнай поближе их положение и муки,"
      - pl: "\nLecz z nimi długą nie baw się rozmową:"
        ru: "но долгим разговором с ними не занимайся:"
        note: "bawić się — забавляться, тратить время"
      - pl: "\nNim wrócisz, spytać tej bestyi muszę,"
        ru: "пока ты вернёшься, я должен спросить этого зверя,"
      - pl: "\nCzy nam do jazdy grzbietu nie użyczy»."
        ru: "не одолжит ли он нам спину для езды»."
        note: "użyczyć — одолжить"
    words: { "stanęli": stanac, "Nieco": nieco, "progu": prog, "mistrz": mistrz, "krąg": krag, "jazdy": jazda }
  - clean: "I sam poszedłem w dolinę stepową,\nGdzie krańcem siódmy krąg z ósmym graniczy,\nTam gdzie siedziały nieszczęśliwe duchy.\nBoleść tryskała przez oczy ich łzami,\nPodnosząc ręce od ruchu mdlejące,\nŻar odsuwały, to piaski gorące;\nJak psy w skwar letni pyskiem, to łapami\nIch kąsające opędzają muchy."
    verse: true
    chunks:
      - pl: "I sam poszedłem w dolinę stepową,"
        ru: "И один я пошёл в степную долину,"
      - pl: "\nGdzie krańcem siódmy krąg z ósmym graniczy,"
        ru: "где краем седьмой круг граничит с восьмым,"
        note: "graniczyć — граничить"
      - pl: "\nTam gdzie siedziały nieszczęśliwe duchy."
        ru: "туда, где сидели несчастные духи."
      - pl: "\nBoleść tryskała przez oczy ich łzami,"
        ru: "Боль брызгала через их глаза слезами,"
      - pl: "\nPodnosząc ręce od ruchu mdlejące,"
        ru: "поднимая руки, изнемогающие от движения,"
        note: "mdlejący — изнемогающий"
      - pl: "\nŻar odsuwały, to piaski gorące;"
        ru: "они отстраняли то жар, то горячие пески;"
      - pl: "\nJak psy w skwar letni pyskiem, to łapami"
        ru: "как собаки в летний зной мордой, то лапами"
      - pl: "\nIch kąsające opędzają muchy."
        ru: "отгоняют кусающих их мух."
        note: "opędzać — отгонять"
    words: { "dolinę": dolina, "nieszczęśliwe": nieszczesliwy, "Podnosząc": podnosic, "letni": letni, "pyskiem": pysk, "muchy": mucha }
  - clean: "Próżno oczyma przeglądałem twarze\nOkaleczałe w tym bolesnym żarze.\nNikogo w takiem zebraniu niemałem,\nNie mogłem poznać, lecz zauważałem,\nZ każdego szyi zwisała kaleta,\nGodłem i barwą każda rozmaita;\nIch oczy, zda się, że pasły się nimi."
    verse: true
    chunks:
      - pl: "Próżno oczyma przeglądałem twarze"
        ru: "Напрасно глазами я просматривал лица,"
        note: "przeglądać — просматривать"
      - pl: "\nOkaleczałe w tym bolesnym żarze."
        ru: "изувеченные в этом мучительном жаре."
        note: "okaleczały — изувеченный"
      - pl: "\nNikogo w takiem zebraniu niemałem,"
        ru: "Никого в таком немалом собрании"
      - pl: "\nNie mogłem poznać, lecz zauważałem,"
        ru: "я не мог узнать, но заметил,"
      - pl: "\nZ każdego szyi zwisała kaleta,"
        ru: "что с шеи каждого свисала мошна,"
        note: "kaleta — устар. «кошель, мошна»"
      - pl: "\nGodłem i barwą każda rozmaita;"
        ru: "каждая различна гербом и цветом;"
        note: "godło — герб, эмблема"
      - pl: "\nIch oczy, zda się, że pasły się nimi."
        ru: "их глаза, казалось, насыщались ими."
        note: "paść się — пастись, насыщаться"
    words: { "Próżno": prozno, "twarze": twarz, "bolesnym": bolesny, "Nikogo": nikt, "poznać": poznac, "szyi": szyja }
  - clean: "Podszedłszy bliżej, oczyma własnymi\nWidziałem, jak na błękitnej kalecie\nSiedział lew bury i tonął w błękicie:\nTak robiąc przegląd, postrzegłem z daleka\nDrugą kaletę jak w krwi farbowaną,\nA na tle krwawym gęś bielszą od mleka;\nJeden, któremu tło białego wora\nZdobiła świnia, błękitna maciora,\nPrzemówił do mnie: «Co tu robisz żywy?"
    verse: true
    chunks:
      - pl: "Podszedłszy bliżej, oczyma własnymi"
        ru: "Подойдя ближе, собственными глазами"
      - pl: "\nWidziałem, jak na błękitnej kalecie"
        ru: "я видел, как на голубой мошне"
      - pl: "\nSiedział lew bury i tonął w błękicie:"
        ru: "сидел бурый лев и тонул в голубизне:"
        note: "bury — бурый"
      - pl: "\nTak robiąc przegląd, postrzegłem z daleka"
        ru: "так обозревая, я заметил издали"
      - pl: "\nDrugą kaletę jak w krwi farbowaną,"
        ru: "другую мошну, будто крашенную в крови,"
      - pl: "\nA na tle krwawym gęś bielszą od mleka;"
        ru: "а на кровавом поле — гуся белее молока;"
        note: "tło — фон, поле"
      - pl: "\nJeden, któremu tło białego wora"
        ru: "один, у которого фон белого мешка"
        note: "wór — мешок"
      - pl: "\nZdobiła świnia, błękitna maciora,"
        ru: "украшала свинья, голубая свиноматка,"
        note: "maciora — свиноматка"
      - pl: "\nPrzemówił do mnie: «Co tu robisz żywy?"
        ru: "заговорил со мной: «Что ты здесь делаешь, живой?"
    words: { "Podszedłszy": podejsc, "krwawym": krwawy, "mleka": mleko, "wora": wor, "świnia": swinia, "Przemówił": przemowic }
  - clean: "Wiedz, że mój były sąsiad Witaliano\nSiądzie tu przy mnie, po mej lewej stronie:\nPadwianin jestem w florentynów gronie,\nCzęsto mnie głuszy ich okrzyk wrzaskliwy:\n»Oby mąż nadszedł krokiem uroczystym,\nKtóry ma worek o dziobie troistym«»."
    verse: true
    chunks:
      - pl: "Wiedz, że mój były sąsiad Witaliano"
        ru: "Знай, что мой бывший сосед Витальяно"
      - pl: "\nSiądzie tu przy mnie, po mej lewej stronie:"
        ru: "сядет здесь рядом со мной, по левую мою руку:"
      - pl: "\nPadwianin jestem w florentynów gronie,"
        ru: "я падуанец среди флорентийцев,"
      - pl: "\nCzęsto mnie głuszy ich okrzyk wrzaskliwy:"
        ru: "часто меня оглушает их визгливый крик:"
        note: "wrzaskliwy — крикливый"
      - pl: "\n»Oby mąż nadszedł krokiem uroczystym,"
        ru: "„О если бы пришёл торжественной поступью муж,"
        note: "uroczysty — торжественный"
      - pl: "\nKtóry ma worek o dziobie troistym«»."
        ru: "у которого мешок с тройным клювом“»."
        note: "герб ростовщика Буйамонте"
    words: { "sąsiad": sasiad, "lewej": lewy, "gronie": grono, "nadszedł": nadejsc, "krokiem": krok, "worek": worek }
  - clean: "A potem dziko żar oczyma wskrzesił,\nWykrzywił wargę i język wywiesił\nJako wół, kiedy swoje nozdrza liże.\nA ja z bojaźni, czy nie zabawiłem\nDłużej nad zakres według słów przestrogi,\nGrzbiet do tych nędznych duchów obróciłem."
    verse: true
    chunks:
      - pl: "A potem dziko żar oczyma wskrzesił,"
        ru: "А потом дико зажёг жар глазами,"
        note: "wskrzesić — воскресить, разжечь"
      - pl: "\nWykrzywił wargę i język wywiesił"
        ru: "скривил губу и высунул язык,"
        note: "wywiesić — вывесить, высунуть"
      - pl: "\nJako wół, kiedy swoje nozdrza liże."
        ru: "как вол, когда лижет свои ноздри."
        note: "nozdrza — ноздри"
      - pl: "\nA ja z bojaźni, czy nie zabawiłem"
        ru: "А я, в боязни, не задержался ли я"
      - pl: "\nDłużej nad zakres według słów przestrogi,"
        ru: "дольше положенного по словам предостережения,"
      - pl: "\nGrzbiet do tych nędznych duchów obróciłem."
        ru: "повернулся спиной к этим жалким духам."
    words: { "wargę": warga, "język": jezyk, "zabawiłem": zabawic, "zakres": zakres, "nędznych": nedzny, "obróciłem": obrocic }
  - clean: "Patrzę, zwierz dziki już oczyma strzyże,\nNa grzbiecie jego siedział mój wódz drogi\nI mówił: «Teraz bądź krzepki i śmiały!\nKtokolwiek tutaj chce zstąpić z tej skały,\nMusi drabiną schodzić tylko taką.\nSiądź z przodu, moje do ogona siodło,\nAby cię jego ostrze nie ubodło»."
    verse: true
    chunks:
      - pl: "Patrzę, zwierz dziki już oczyma strzyże,"
        ru: "Смотрю — дикий зверь уже стрижёт глазами,"
      - pl: "\nNa grzbiecie jego siedział mój wódz drogi"
        ru: "на спине его сидел мой дорогой вождь"
      - pl: "\nI mówił: «Teraz bądź krzepki i śmiały!"
        ru: "и говорил: «Теперь будь крепок и смел!"
        note: "krzepki — крепкий"
      - pl: "\nKtokolwiek tutaj chce zstąpić z tej skały,"
        ru: "Кто бы здесь ни хотел спуститься с этой скалы,"
      - pl: "\nMusi drabiną schodzić tylko taką."
        ru: "должен сходить только по такой лестнице."
        note: "drabina — лестница"
      - pl: "\nSiądź z przodu, moje do ogona siodło,"
        ru: "Садись впереди, моё место ближе к хвосту,"
        note: "siodło — седло"
      - pl: "\nAby cię jego ostrze nie ubodło»."
        ru: "чтобы тебя его остриё не ужалило»."
        note: "ubość — уколоть, боднуть"
    words: { "Patrzę": patrzec, "siedział": siedziec, "skały": skala, "drabiną": drabina, "przodu": przod, "ostrze": ostrze }
