# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 26
chapterTitle: "Pieśń XXVI"
chapterTitleRu: "Песнь XXVI. Улисс"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok VIII. Źli doradcy: Ulisses.)"
    chunks:
      - pl: "(Krąg VIII. Tłumok VIII. Źli doradcy: Ulisses.)"
        ru: "(Круг VIII. Ров VIII. Лукавые советчики: Улисс.)"
        note: "doradca — советчик; Ulisses — Улисс (Одиссей)"
    words: { "Krąg": krag, "doradcy": doradca }
  - clean: "Ciesz się, Florencjo! Twe skrzydła olbrzymie\nPrzez ląd i morze szeleszczą w tej dobie,\nNawet do piekła zaniosły twe imię.\nW kręgu złodziei, daj wiarę zaklęciu,\nObywateli twych znalazłem pięciu,\nA co mnie wstydem rumieni i tobie,\nZda się, nie robi wielkiego zaszczytu,\nJeśli po ranu, w marzeniach przedświtu,\nMarzących sny są prawdziwsze niekiedy,\nWkrótce się dowiesz, co ci życzy Prato\nJeśli nieszczęście już cię nawiedziło,\nCo być musiało, nie przed czasem było;"
    verse: true
    chunks:
      - pl: "Ciesz się, Florencjo! Twe skrzydła olbrzymie"
        ru: "Радуйся, Флоренция! Твои исполинские крылья"
      - pl: "\nPrzez ląd i morze szeleszczą w tej dobie,"
        ru: "шелестят в эту пору над сушей и морем,"
        note: "szeleścić — шелестеть"
      - pl: "\nNawet do piekła zaniosły twe imię."
        ru: "даже до ада донесли твоё имя."
      - pl: "\nW kręgu złodziei, daj wiarę zaklęciu,"
        ru: "В кругу воров — поверь заклятию —"
        note: "dać wiarę — поверить"
      - pl: "\nObywateli twych znalazłem pięciu,"
        ru: "я нашёл пятерых твоих граждан,"
      - pl: "\nA co mnie wstydem rumieni i tobie,"
        ru: "и это, что меня заливает стыдом, и тебе,"
        note: "rumienić — заставлять краснеть"
      - pl: "\nZda się, nie robi wielkiego zaszczytu,"
        ru: "кажется, не делает большой чести."
      - pl: "\nJeśli po ranu, w marzeniach przedświtu,"
        ru: "Если под утро, в грёзах перед рассветом,"
        note: "przedświt — предрассветная пора"
      - pl: "\nMarzących sny są prawdziwsze niekiedy,"
        ru: "сны мечтающих бывают порой правдивее,"
      - pl: "\nWkrótce się dowiesz, co ci życzy Prato"
        ru: "вскоре ты узнаешь, чего тебе желает Прато;"
        note: "Прато — подвластный город, ненавидящий Флоренцию"
      - pl: "\nJeśli nieszczęście już cię nawiedziło,"
        ru: "если несчастье уже тебя посетило,"
        note: "nawiedzić — посетить"
      - pl: "\nCo być musiało, nie przed czasem było;"
        ru: "то, что должно было быть, случилось не прежде срока;"
    words: { "dobie": doba, "zaniosły": zaniesc, "zaklęciu": zaklecie, "Obywateli": obywatel, "zaszczytu": zaszczyt, "nieszczęście": nieszczescie }
  - clean: "Bo w czas im dalej zajdzie moje lato,\nWięcej mi będą ciężyć twoje biedy!\nWódz szedł i tymi szczeblami, co skały,\nGdyśmy schodzili, dla nas wykowały,\nPowraca, ciągnąc mnie za swoją nogą.\nI tak samotną pośród głazów drogą\nStopa się plącząc, między skał osęki,\nPostępowała za pomocą ręki."
    verse: true
    chunks:
      - pl: "Bo w czas im dalej zajdzie moje lato,"
        ru: "ибо, чем дальше со временем зайдёт моё лето,"
        note: "то есть чем старше я буду"
      - pl: "\nWięcej mi będą ciężyć twoje biedy!"
        ru: "тем тяжелее мне будут твои беды!"
      - pl: "\nWódz szedł i tymi szczeblami, co skały,"
        ru: "Вождь пошёл и по тем ступеням, что скалы"
        note: "szczebel — ступень"
      - pl: "\nGdyśmy schodzili, dla nas wykowały,"
        ru: "выковали для нас, когда мы спускались,"
        note: "wykować — выковать, выбить"
      - pl: "\nPowraca, ciągnąc mnie za swoją nogą."
        ru: "возвращается, увлекая меня за собой."
        note: "za swoją nogą — по своему следу"
      - pl: "\nI tak samotną pośród głazów drogą"
        ru: "И так по одинокой дороге среди камней"
      - pl: "\nStopa się plącząc, między skał osęki,"
        ru: "нога, путаясь меж острых выступов скал,"
        note: "osęki — острия, выступы"
      - pl: "\nPostępowała za pomocą ręki."
        ru: "продвигалась с помощью руки."
    words: { "zajdzie": zajsc, "Wódz": wodz, "skały": skala, "schodzili": schodzic, "ciągnąc": ciagnac, "Postępowała": postepowac }
  - clean: "Jam się zasmucił i jeszcze się smucę,\nPo ile razy pamięć moją zwrócę\nNa dziwne, co tam widziałem, przedmioty,\nZawściągam silniej wodze mego ducha,\nBy swej nie stracił przewodniczki cnoty;\nI gdy mi gwiazda rai światłem błogiem\nJakie bądź dobro, nie chcę być mu wrogiem."
    verse: true
    chunks:
      - pl: "Jam się zasmucił i jeszcze się smucę,"
        ru: "Я опечалился и ещё печалюсь,"
      - pl: "\nPo ile razy pamięć moją zwrócę"
        ru: "всякий раз, как обращу свою память"
        note: "po ile razy — всякий раз как"
      - pl: "\nNa dziwne, co tam widziałem, przedmioty,"
        ru: "на странные вещи, что я там видел,"
      - pl: "\nZawściągam silniej wodze mego ducha,"
        ru: "сильнее натягиваю поводья своего духа,"
        note: "zawściągać wodze — натягивать поводья"
      - pl: "\nBy swej nie stracił przewodniczki cnoty;"
        ru: "чтобы он не утратил своей вожатой — добродетели;"
      - pl: "\nI gdy mi gwiazda rai światłem błogiem"
        ru: "и если звезда сулит мне блаженным светом"
        note: "raić — сулить, сватать"
      - pl: "\nJakie bądź dobro, nie chcę być mu wrogiem."
        ru: "какое-либо благо, не хочу быть ему врагом."
    words: { "pamięć": pamiec, "zwrócę": zwrocic, "przedmioty": przedmiot, "ducha": duch, "gwiazda": gwiazda, "wrogiem": wrog }
  - clean: "Jak w porze roku, gdy więcej palące\nTwarz swą najdłużej nam odkrywa słońce,\nWieśniak na wzgórku wczasując przed nocą,\nGdy komar brzęczy, a zamilknie mucha,\nWidzi w dolinie robaczki błyszczące,\nGdy w ciemnych liściach winnicy migocą:\nTak ja widziałem na dnie ósmej jamy\nMnóstwo płomyków patrząc z wierzchu tamy."
    verse: true
    chunks:
      - pl: "Jak w porze roku, gdy więcej palące"
        ru: "Как в пору года, когда жарче палящее"
      - pl: "\nTwarz swą najdłużej nam odkrywa słońce,"
        ru: "солнце дольше всего открывает нам своё лицо,"
      - pl: "\nWieśniak na wzgórku wczasując przed nocą,"
        ru: "крестьянин, отдыхая на холмике перед ночью,"
        note: "wczasować — устар. «отдыхать»"
      - pl: "\nGdy komar brzęczy, a zamilknie mucha,"
        ru: "когда комар звенит, а муха смолкнет,"
        note: "komar — комар; brzęczeć — звенеть"
      - pl: "\nWidzi w dolinie robaczki błyszczące,"
        ru: "видит в долине светящихся букашек,"
        note: "robaczek — букашка; светлячки"
      - pl: "\nGdy w ciemnych liściach winnicy migocą:"
        ru: "как мерцают они в тёмной листве виноградника:"
        note: "winnica — виноградник"
      - pl: "\nTak ja widziałem na dnie ósmej jamy"
        ru: "так я видел на дне восьмой ямы"
      - pl: "\nMnóstwo płomyków patrząc z wierzchu tamy."
        ru: "множество огоньков, глядя с вершины плотины."
        note: "płomyk — огонёк"
    words: { "mucha": mucha, "dolinie": dolina, "błyszczące": blyszczec, "ciemnych": ciemny, "jamy": jama, "tamy": tama }
  - clean: "Jak ów pomszczony za się przez niedźwiedzi\nZa lekkomyślną niewiarę gawiedzi,\nWidząc ognisty rydwan Elijasza,\nGdy zaprząg wichru w niebo go unasza,\nTylko oczyma lekki płomyk tropił,\nCo się jak obłok w powietrzu roztopił:\nTak na dnie jamy każdy kształt płomyka\nRuszał się, kryjąc w swym wnętrzu grzesznika."
    verse: true
    chunks:
      - pl: "Jak ów pomszczony za się przez niedźwiedzi"
        ru: "Как тот, кто был отмщён медведями"
        note: "Елисей; pomszczony — отмщённый"
      - pl: "\nZa lekkomyślną niewiarę gawiedzi,"
        ru: "за легкомысленное неверие черни,"
      - pl: "\nWidząc ognisty rydwan Elijasza,"
        ru: "видя огненную колесницу Илии,"
      - pl: "\nGdy zaprząg wichru w niebo go unasza,"
        ru: "когда упряжка вихря уносила его в небо,"
        note: "zaprząg — упряжка; unaszać — устар. «уносить»"
      - pl: "\nTylko oczyma lekki płomyk tropił,"
        ru: "лишь глазами следил за лёгким огоньком,"
        note: "tropić — выслеживать"
      - pl: "\nCo się jak obłok w powietrzu roztopił:"
        ru: "что растаял в воздухе, как облако:"
      - pl: "\nTak na dnie jamy każdy kształt płomyka"
        ru: "так на дне ямы каждый огонёк"
      - pl: "\nRuszał się, kryjąc w swym wnętrzu grzesznika."
        ru: "двигался, скрывая в своём нутре грешника."
    words: { "niedźwiedzi": niedzwiedz, "lekki": lekki, "powietrzu": powietrze, "kształt": ksztalt, "kryjąc": kryc, "wnętrzu": wnetrze }
  - clean: "Z mostu uwięzłem cały w tym widoku\nI gdybym ręką nie chwycił się głazu,\nNiepchnięty w otchłań upadłbym do razu.\nWódz widząc moje wytężenie w oku,\nRzekł: «Tu duch każdy żyć w ogniu skazany,\nChodzi płomieniem jak suknią odziany»."
    verse: true
    chunks:
      - pl: "Z mostu uwięzłem cały w tym widoku"
        ru: "С моста я весь застыл в этом зрелище"
        note: "uwięznąć — застрять, застыть"
      - pl: "\nI gdybym ręką nie chwycił się głazu,"
        ru: "и, если бы не схватился рукой за камень,"
      - pl: "\nNiepchnięty w otchłań upadłbym do razu."
        ru: "не будучи толкнут, сразу упал бы в бездну."
      - pl: "\nWódz widząc moje wytężenie w oku,"
        ru: "Вождь, видя напряжение в моём взгляде,"
        note: "wytężenie — напряжение"
      - pl: "\nRzekł: «Tu duch każdy żyć w ogniu skazany,"
        ru: "сказал: «Здесь каждый дух, обречённый жить в огне,"
      - pl: "\nChodzi płomieniem jak suknią odziany»."
        ru: "ходит, одетый пламенем, как платьем»."
    words: { "mostu": most, "chwycił": chwycic, "upadłbym": upasc, "Rzekł": rzec, "płomieniem": plomien, "suknią": suknia }
  - clean: "Odpowiedziałem: «Mistrzu, z twego słowa\nNa to, co widzę, pada jasność nowa:\nMów, z tylu ogni migających w zmierzchu,\nJaki to płomień, co rozdzielon z wierzchu,\nJako ze stosu na dwie strony wionął,\nNa którym z bratem swym Eteokl płonął?»"
    verse: true
    chunks:
      - pl: "Odpowiedziałem: «Mistrzu, z twego słowa"
        ru: "Я ответил: «Учитель, от твоего слова"
      - pl: "\nNa to, co widzę, pada jasność nowa:"
        ru: "на то, что я вижу, падает новый свет:"
      - pl: "\nMów, z tylu ogni migających w zmierzchu,"
        ru: "скажи, из стольких огней, мерцающих в сумраке,"
      - pl: "\nJaki to płomień, co rozdzielon z wierzchu,"
        ru: "какое это пламя, что, разделённое сверху,"
      - pl: "\nJako ze stosu na dwie strony wionął,"
        ru: "словно с костра, взметнулось на две стороны,"
        note: "wionąć — повеять, взметнуться"
      - pl: "\nNa którym z bratem swym Eteokl płonął?»"
        ru: "на котором горел Этеокл со своим братом?»"
        note: "Этеокл и Полиник"
    words: { "Odpowiedziałem": odpowiedziec, "Mistrzu": mistrz, "pada": padac, "jasność": jasnosc, "stosu": stos, "płonął": plonac }
  - clean: "Mistrz: «Dyjomeda duch i Ulissesa\nZa karę wspólnej ich zdrady po zgonie\nW jednym płomieniu nierozdzielnie płonie;\nW nim płaczą sławnej zasadzki trojańskiej,\nZ której nam wyszedł piękny szczep rzymiański;\nW nim za łzy cierpią córki Likomeda,\nCo w swoim żalu ukoić się nie da,\nUmarła skarży jeszcze Achillesa;\nI w nim pokutę cierpią i karanie,\nZa uwiezione Palladium kryjomie»."
    verse: true
    chunks:
      - pl: "Mistrz: «Dyjomeda duch i Ulissesa"
        ru: "Учитель: «Дух Диомеда и Улисса"
      - pl: "\nZa karę wspólnej ich zdrady po zgonie"
        ru: "в наказание за их общий обман после смерти"
      - pl: "\nW jednym płomieniu nierozdzielnie płonie;"
        ru: "горит неразделимо в одном пламени;"
      - pl: "\nW nim płaczą sławnej zasadzki trojańskiej,"
        ru: "в нём оплакивают они знаменитую троянскую засаду,"
        note: "zasadzka — засада; троянский конь"
      - pl: "\nZ której nam wyszedł piękny szczep rzymiański;"
        ru: "из которой вышел нам прекрасный римский род;"
        note: "szczep — род, племя"
      - pl: "\nW nim za łzy cierpią córki Likomeda,"
        ru: "в нём они страдают за слёзы дочери Ликомеда,"
        note: "Деидамия"
      - pl: "\nCo w swoim żalu ukoić się nie da,"
        ru: "что в своём горе не даёт себя утешить,"
        note: "ukoić — утешить"
      - pl: "\nUmarła skarży jeszcze Achillesa;"
        ru: "и, умершая, ещё оплакивает Ахилла;"
      - pl: "\nI w nim pokutę cierpią i karanie,"
        ru: "и в нём они несут покаяние и кару"
      - pl: "\nZa uwiezione Palladium kryjomie»."
        ru: "за похищенный тайком Палладий»."
        note: "uwieziony — увезённый"
    words: { "zdrady": zdrada, "zgonie": zgon, "sławnej": slawny, "zasadzki": zasadzka, "szczep": szczep, "karanie": karac }
  - clean: "— «O! jeśli mogą przemówić z płomienia,\nNiech ci ta prośba za tysiąc próśb stanie,\nPozwól mi czekać, nim dwoiste płomię\nZbliży się do nas, wszak po tośmy przyszli.\nPatrz, z jaką żądzą ku niemu się chylę!»\nA mistrz: «Rad spełnię chwalebne życzenia,\nLecz trzymaj język na wodzy milczenia;\nJa mówić będę, odgadłem twe myśli;\nBo ci grzesznicy w uprzedzeniu dzikiem\nMoże, jak Grecy, wzgardzą twym językiem?»"
    verse: true
    chunks:
      - pl: "— «O! jeśli mogą przemówić z płomienia,"
        ru: "— «О, если они могут заговорить из пламени,"
      - pl: "\nNiech ci ta prośba za tysiąc próśb stanie,"
        ru: "пусть эта просьба станет тебе за тысячу просьб,"
      - pl: "\nPozwól mi czekać, nim dwoiste płomię"
        ru: "позволь мне подождать, пока двойное пламя"
      - pl: "\nZbliży się do nas, wszak po tośmy przyszli."
        ru: "не приблизится к нам, ведь для того мы и пришли."
        note: "po tośmy = po to + -śmy"
      - pl: "\nPatrz, z jaką żądzą ku niemu się chylę!»"
        ru: "Смотри, с каким желанием я к нему склоняюсь!»"
      - pl: "\nA mistrz: «Rad spełnię chwalebne życzenia,"
        ru: "А учитель: «Охотно исполню похвальные желания,"
        note: "chwalebny — похвальный"
      - pl: "\nLecz trzymaj język na wodzy milczenia;"
        ru: "но держи язык на привязи молчания;"
        note: "trzymać na wodzy — держать в узде"
      - pl: "\nJa mówić będę, odgadłem twe myśli;"
        ru: "говорить буду я, я угадал твои мысли;"
      - pl: "\nBo ci grzesznicy w uprzedzeniu dzikiem"
        ru: "ибо эти грешники в своём диком предубеждении,"
        note: "uprzedzenie — предубеждение"
      - pl: "\nMoże, jak Grecy, wzgardzą twym językiem?»"
        ru: "может, как греки, пренебрегут твоим языком?»"
    words: { "przemówić": przemowic, "prośba": prosba, "tysiąc": tysiac, "Zbliży": zblizyc, "spełnię": spelnic, "język": jezyk }
  - clean: "Gdy płomień do nas zbliżył się, mistrz chwilę\nI miejsce k'temu wybrawszy stosowne,\nW tych słowach usta otworzył wymowne:\n«Wy, w jednym ogniu jak dwóch w jednym ciele,\nO, jeśli miła wam mało czy wiele,\nPisana, wielka moja pieśń na świecie!"
    verse: true
    chunks:
      - pl: "Gdy płomień do nas zbliżył się, mistrz chwilę"
        ru: "Когда пламя приблизилось к нам, учитель, выбрав"
      - pl: "\nI miejsce k'temu wybrawszy stosowne,"
        ru: "время и подходящее для того место,"
        note: "k'temu — устар. «к тому»"
      - pl: "\nW tych słowach usta otworzył wymowne:"
        ru: "такими словами открыл красноречивые уста:"
      - pl: "\n«Wy, w jednym ogniu jak dwóch w jednym ciele,"
        ru: "«Вы, в одном огне, как двое в одном теле,"
      - pl: "\nO, jeśli miła wam mało czy wiele,"
        ru: "о, если вам мила — мало ли, много ли —"
      - pl: "\nPisana, wielka moja pieśń na świecie!"
        ru: "написанная мною на свете великая песнь!"
    words: { "wybrawszy": wybrac, "usta": usta, "otworzył": otworzyc, "ogniu": ogien, "Pisana": pisac, "pieśń": piesn }
  - clean: "Stójcie, niech jeden z was powie poecie,\nGdzie umarł, trudy skończywszy wędrowne?»\nStarożytnego wierzchołek ogniska\nZaczął się ruszać, o dziw niepojęty!\nSzumiąc jak płomień wiatrami rozdęty;\nI wierzch zwężony w kształcie obeliska\nTam i sam wodząc, jak język gotowy\nPrzemówić słowo, zabrzmiał tymi słowy:\n«Gdym zbiegł od Cyrcy, jej więzień niestety!"
    verse: true
    chunks:
      - pl: "Stójcie, niech jeden z was powie poecie,"
        ru: "Постойте, пусть один из вас скажет поэту,"
