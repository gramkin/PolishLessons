  - clean: "Tam przynajmniej nie odmówiono mu wstępu; ale gdy wszedł, wstrząsnęła nim zmiana, jaka zaszła w wyglądzie doktora. Na twarzy miał czytelnie wypisany wyrok śmierci. Rumiany człowiek pobladł i wychudł; był wyraźnie bardziej łysy i starszy; a jednak nie tyle te oznaki szybkiego fizycznego upadku przykuły uwagę adwokata, ile spojrzenie i sposób bycia, które zdawały się świadczyć o jakimś głęboko zakorzenionym przerażeniu umysłu."
    en: "There at least he was not denied admittance; but when he came in, he was shocked at the change which had taken place in the doctor’s appearance. He had his death-warrant written legibly upon his face. The rosy man had grown pale; his flesh had fallen away; he was visibly balder and older; and yet it was not so much these tokens of a swift physical decay that arrested the lawyer’s notice, as a look in the eye and quality of manner that seemed to testify to some deep-seated terror of the mind."
    draft: true
