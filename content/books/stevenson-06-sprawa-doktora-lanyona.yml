  - clean: "Od chwili, gdy rankiem w dniu morderstwa opuścił dom w Soho, po prostu przepadł; i stopniowo, w miarę upływu czasu, pan Utterson zaczął się otrząsać z gorączki swego niepokoju i odzyskiwać spokój ducha. Śmierć sir Danversa była, według jego sposobu myślenia, więcej niż opłacona zniknięciem pana Hyde'a. Teraz, gdy ten zły wpływ został usunięty, dla doktora Jekylla zaczęło się nowe życie."
    en: "From the time he had left the house in Soho on the morning of the murder, he was simply blotted out; and gradually, as time drew on, Mr. Utterson began to recover from the hotness of his alarm, and to grow more at quiet with himself. The death of Sir Danvers was, to his way of thinking, more than paid for by the disappearance of Mr. Hyde. Now that that evil influence had been withdrawn, a new life began for Dr. Jekyll."
    draft: true
    chunks:
      - pl: "Od chwili, gdy rankiem w dniu morderstwa opuścił dom w Soho, po prostu przepadł;"
