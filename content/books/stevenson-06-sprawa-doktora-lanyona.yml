  - clean: "— Przeżyłem wstrząs — rzekł — i nigdy się z niego nie podniosę. To kwestia tygodni. Cóż, życie było przyjemne; lubiłem je; tak, proszę pana, kiedyś je lubiłem. Czasem myślę, że gdybyśmy wiedzieli wszystko, chętniej byśmy odchodzili."
    en: "“I have had a shock,” he said, “and I shall never recover. It is a question of weeks. Well, life has been pleasant; I liked it; yes, sir, I used to like it. I sometimes think if we knew all, we should be more glad to get away.”"
