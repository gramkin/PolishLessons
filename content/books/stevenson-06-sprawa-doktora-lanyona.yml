  - clean: "— No, no! — rzekł pan Utterson; a po dłuższym milczeniu zapytał: — Czy nie mogę nic zrobić? Jesteśmy trzema bardzo starymi przyjaciółmi, Lanyonie; nie dożyjemy, żeby zdobyć innych."
    en: "“Tut, tut!” said Mr. Utterson; and then after a considerable pause, “Can’t I do anything?” he inquired. “We are three very old friends, Lanyon; we shall not live to make others.”"
