  - clean: "Było mało prawdopodobne, by doktor bał się śmierci; a jednak to właśnie Utterson skłonny był podejrzewać. „Tak — myślał — jest lekarzem, musi znać swój stan i wiedzieć, że jego dni są policzone; a ta wiedza przerasta jego siły”. A jednak gdy Utterson wspomniał o jego złym wyglądzie, Lanyon z wielką stanowczością oświadczył, że jest człowiekiem skazanym."
    en: "It was unlikely that the doctor should fear death; and yet that was what Utterson was tempted to suspect. “Yes,” he thought; “he is a doctor, he must know his own state and that his days are counted; and the knowledge is more than he can bear.” And yet when Utterson remarked on his ill looks, it was with an air of great firmness that Lanyon declared himself a doomed man."
