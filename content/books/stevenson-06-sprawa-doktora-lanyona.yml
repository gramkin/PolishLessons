  - clean: "Wyszedł ze swego odosobnienia, odnowił stosunki z przyjaciółmi, znów stał się ich zażyłym gościem i gospodarzem; i choć zawsze był znany z dobroczynności, teraz nie mniej wyróżniał się pobożnością. Był zajęty, dużo przebywał na świeżym powietrzu, czynił dobro; jego twarz zdawała się otwierać i rozjaśniać, jakby z wewnętrznej świadomości służby; i przez ponad dwa miesiące doktor żył w spokoju."
    en: "He came out of his seclusion, renewed relations with his friends, became once more their familiar guest and entertainer; and whilst he had always been known for charities, he was now no less distinguished for religion. He was busy, he was much in the open air, he did good; his face seemed to open and brighten, as if with an inward consciousness of service; and for more than two months, the doctor was at peace."
    draft: true
