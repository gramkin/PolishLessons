  - clean: "Ósmego stycznia Utterson jadł obiad u doktora w niewielkim gronie; był tam Lanyon; a gospodarz spoglądał z jednego na drugiego jak w dawnych czasach, gdy trzej byli nierozłącznymi przyjaciółmi. Dwunastego, a potem czternastego drzwi były dla adwokata zamknięte. — Doktor nie wychodzi z domu — mówił Poole — i nikogo nie przyjmuje. Piętnastego spróbował znowu i znowu mu odmówiono; a ponieważ przez ostatnie dwa miesiące przywykł widywać przyjaciela niemal codziennie, ten powrót samotności ciążył mu na duszy. Piątego wieczoru zaprosił do siebie na obiad Guesta; a szóstego udał się do doktora Lanyona."
    en: "On the 8th of January Utterson had dined at the doctor’s with a small party; Lanyon had been there; and the face of the host had looked from one to the other as in the old days when the trio were inseparable friends. On the 12th, and again on the 14th, the door was shut against the lawyer. “The doctor was confined to the house,” Poole said, “and saw no one.” On the 15th, he tried again, and was again refused; and having now been used for the last two months to see his friend almost daily, he found this return of solitude to weigh upon his spirits. The fifth night he had in Guest to dine with him; and the sixth he betook himself to Dr. Lanyon’s."
    draft: true
