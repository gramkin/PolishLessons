paragraphs:
  - clean: "Czas płynął; oferowano tysiące funtów nagrody, bo śmierć sir Danversa odczuwano jako krzywdę publiczną; ale pan Hyde zniknął z pola widzenia policji, jakby nigdy nie istniał. Wygrzebano co prawda wiele z jego przeszłości, i to samych hańbiących rzeczy: wyszły na jaw opowieści o okrucieństwie tego człowieka, zarazem tak bezdusznym i gwałtownym; o jego plugawym życiu, o jego dziwnych kompanach, o nienawiści, która zdawała się otaczać całą jego drogę; ale o tym, gdzie przebywa obecnie, ani szeptu."
    en: "Time ran on; thousands of pounds were offered in reward, for the death of Sir Danvers was resented as a public injury; but Mr. Hyde had disappeared out of the ken of the police as though he had never existed. Much of his past was unearthed, indeed, and all disreputable: tales came out of the man’s cruelty, at once so callous and violent; of his vile life, of his strange associates, of the hatred that seemed to have surrounded his career; but of his present whereabouts, not a whisper."
    draft: true
