# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 17
chapterTitle: "Pieśń XVII"
chapterTitleRu: "Песнь XVII. Горький хлеб изгнания"
level: B2
paragraphs:
  - clean: "Ciąg dalszy. Kaciagwida przepowiada poecie wygnanie jego, gościnny pobyt u Kangranda, sławę jego poematu, upatrując w Dantem powołanego kaznodzieję i nauczyciela."
    chunks:
      - pl: "Ciąg dalszy. Kaciagwida przepowiada poecie wygnanie jego, gościnny pobyt u Kangranda, sławę jego poematu, upatrując w Dantem powołanego kaznodzieję i nauczyciela."
        ru: "Продолжение. Каччагвида предсказывает поэту его изгнание, гостеприимный приют у Кангранде, славу его поэмы, видя в Данте призванного проповедника и учителя."
        note: "upatrywać — видеть, усматривать"
    words: { "Ciąg": ciag, "poecie": poeta, "pobyt": pobyt, "sławę": slawa, "powołanego": powolac, "nauczyciela": nauczyciel }
  - clean: "Syn nieroztropny, co pytał rodzicy,\nCzy prawda, że był bez ojca poczęty,\nDotąd jest jeszcze przestrogą dla matek,\nBy mniej słabymi były dla swych dziatek.\nTakim się wydać mogłem Beatrycy\nI tej światłości promiennej i świętej,\nKtóra wpierw dla mnie swe miejsce zmieniła."
    verse: true
    chunks:
      - pl: "Syn nieroztropny, co pytał rodzicy,"
        ru: "Безрассудный сын, что спрашивал родительницу,"
        note: "Фаэтон спрашивал Климену"
      - pl: "\nCzy prawda, że był bez ojca poczęty,"
        ru: "правда ли, что он был зачат без отца,"
      - pl: "\nDotąd jest jeszcze przestrogą dla matek,"
        ru: "до сих пор ещё служит предостережением для матерей,"
      - pl: "\nBy mniej słabymi były dla swych dziatek."
        ru: "чтобы были менее слабыми к своим деткам."
      - pl: "\nTakim się wydać mogłem Beatrycy"
        ru: "Таким я мог показаться Беатриче"
      - pl: "\nI tej światłości promiennej i świętej,"
        ru: "и тому лучистому и святому свету,"
      - pl: "\nKtóra wpierw dla mnie swe miejsce zmieniła."
        ru: "что прежде ради меня сменил своё место."
    words: { "pytał": pytac, "poczęty": poczac, "Dotąd": dotad, "wydać": wydac, "wpierw": wpierw, "zmieniła": zmienic }
  - clean: "Dlatego moja Pani tak mówiła:\n«Wyrzuć na zewnątrz cały zapał chęci,\nZ wiernym odciskiem wewnętrznej pieczęci;\nNie, żeby z nas kto mógł coś więcej wiedzieć\nPrzez twoje słowa: co myślisz w tej dobie?\nLecz, żebyś śmiał swe pragnienie powiedzieć,\nA drugi słysząc, podał napój tobie»."
    verse: true
    chunks:
      - pl: "Dlatego moja Pani tak mówiła:"
        ru: "Поэтому моя Госпожа так сказала:"
      - pl: "\n«Wyrzuć na zewnątrz cały zapał chęci,"
        ru: "«Выбрось наружу весь пыл желания"
      - pl: "\nZ wiernym odciskiem wewnętrznej pieczęci;"
        ru: "верным оттиском внутренней печати;"
      - pl: "\nNie, żeby z nas kto mógł coś więcej wiedzieć"
        ru: "не затем, чтобы кто-то из нас мог знать больше"
      - pl: "\nPrzez twoje słowa: co myślisz w tej dobie?"
        ru: "через твои слова, что ты думаешь в эту пору,"
      - pl: "\nLecz, żebyś śmiał swe pragnienie powiedzieć,"
        ru: "а чтобы ты смел высказать свою жажду,"
      - pl: "\nA drugi słysząc, podał napój tobie»."
        ru: "а другой, услышав, подал тебе питьё»."
    words: { "chęci": chec, "wiernym": wierny, "wewnętrznej": wewnetrzny, "dobie": doba, "pragnienie": pragnienie, "napój": napoj }
  - clean: "— «Drogi mój szczepie, coś wrósł tak wysoko!\nJak rozum ziemski widzi, że nie może\nDwóch kątów tępych zamykać trójroże,\nPrzygodne rzeczy, nim się staną w sobie\nTym, czym być mają, tak widzi twe oko,\nPatrząc w zwierciadło, które ci odbija\nCzas przyjść mający, jak ten, który mija."
    verse: true
    chunks:
      - pl: "— «Drogi mój szczepie, coś wrósł tak wysoko!"
        ru: "— «Дорогой мой корень, что вознёсся так высоко!"
        note: "szczep — корень, ствол рода"
      - pl: "\nJak rozum ziemski widzi, że nie może"
        ru: "Как земной разум видит, что не может"
      - pl: "\nDwóch kątów tępych zamykać trójroże,"
        ru: "треугольник заключать два тупых угла,"
        note: "trójroże — треугольник"
      - pl: "\nPrzygodne rzeczy, nim się staną w sobie"
        ru: "так случайные вещи, прежде чем станут в себе"
      - pl: "\nTym, czym być mają, tak widzi twe oko,"
        ru: "тем, чем должны быть, видит твой глаз,"
      - pl: "\nPatrząc w zwierciadło, które ci odbija"
        ru: "глядя в зеркало, что отражает тебе"
      - pl: "\nCzas przyjść mający, jak ten, który mija."
        ru: "время, которое должно прийти, как то, что проходит."
    words: { "szczepie": szczep, "ziemski": ziemski, "kątów": kat, "tępych": tepy, "odbija": odbijac, "mija": mijac }
  - clean: "Gdy mnie Wirgili wodził drogą nową\nPrzez świat umarłych i na górę ową,\nGdzie dusze skrucha i pokuta leczy,\nSłyszałem wróżbę przyszłości surową:\nLecz ja odtrącę cios, co mnie uderzy,\nNieporuszony jak czworobok wieży."
    verse: true
    chunks:
      - pl: "Gdy mnie Wirgili wodził drogą nową"
        ru: "Когда Вергилий водил меня новой дорогой"
      - pl: "\nPrzez świat umarłych i na górę ową,"
        ru: "через мир умерших и на ту гору,"
      - pl: "\nGdzie dusze skrucha i pokuta leczy,"
        ru: "где души лечат раскаяние и покаяние,"
      - pl: "\nSłyszałem wróżbę przyszłości surową:"
        ru: "я слышал суровое пророчество о будущем:"
      - pl: "\nLecz ja odtrącę cios, co mnie uderzy,"
        ru: "но я отражу удар, что меня поразит,"
        note: "odtrącić — отразить"
      - pl: "\nNieporuszony jak czworobok wieży."
        ru: "неподвижный, как четырёхгранник башни."
    words: { "wodził": wodzic, "przyszłości": przyszlosc, "surową": surowy, "cios": cios, "Nieporuszony": poruszyc, "wieży": wieza }
  - clean: "Dlatego rad bym wcześniej i powoli\nOswoić siebie z grozą przyszłej doli;\nGrot przewidziany nie tak nas kaleczy».\nZ woli mej Pani tak mówiłem śmiało\nDo światła, co wprzód ze mną rozmawiało,\nWyznając przed nim moją żądność całą."
    verse: true
    chunks:
      - pl: "Dlatego rad bym wcześniej i powoli"
        ru: "Поэтому я рад бы заранее и понемногу"
      - pl: "\nOswoić siebie z grozą przyszłej doli;"
        ru: "освоиться с ужасом будущей доли;"
      - pl: "\nGrot przewidziany nie tak nas kaleczy»."
        ru: "предвиденная стрела не так нас калечит»."
      - pl: "\nZ woli mej Pani tak mówiłem śmiało"
        ru: "По воле моей Госпожи я так смело говорил"
      - pl: "\nDo światła, co wprzód ze mną rozmawiało,"
        ru: "свету, что прежде беседовал со мной,"
      - pl: "\nWyznając przed nim moją żądność całą."
        ru: "признаваясь перед ним во всей своей жажде знания."
    words: { "Dlatego": dlatego, "wcześniej": wczesnie, "powoli": powoli, "przyszłej": przyszly, "przewidziany": przewidziec, "rozmawiało": rozmawiac }
  - clean: "I nie przez ciemną słów myśli zawiłość,\nJaką wyrocznie starożytne słyną,\nStraszące ludy ogłupiałe w grzechu,\nWpierw nim odkupił świat Baranek Boży,\nLecz jasnym słowem, treściwą łaciną,\nOdpowiedziała ta ojcowska miłość,\nZamknięta w świetle, lecz widna z uśmiechu\nTejże światłości, w której się zamyka."
    verse: true
    chunks:
      - pl: "I nie przez ciemną słów myśli zawiłość,"
        ru: "И не тёмной путаницей мыслей в словах,"
      - pl: "\nJaką wyrocznie starożytne słyną,"
        ru: "какой славятся древние оракулы,"
      - pl: "\nStraszące ludy ogłupiałe w grzechu,"
        ru: "пугающие народы, одурманенные грехом,"
      - pl: "\nWpierw nim odkupił świat Baranek Boży,"
        ru: "прежде чем Агнец Божий искупил мир,"
      - pl: "\nLecz jasnym słowem, treściwą łaciną,"
        ru: "а ясным словом, сжатой латынью,"
        note: "treściwy — сжатый"
      - pl: "\nOdpowiedziała ta ojcowska miłość,"
        ru: "ответила эта отеческая любовь,"
      - pl: "\nZamknięta w świetle, lecz widna z uśmiechu"
        ru: "заключённая в свете, но видимая по улыбке"
      - pl: "\nTejże światłości, w której się zamyka."
        ru: "этого же света, в котором она замыкается."
    words: { "starożytne": starozytny, "Straszące": straszyc, "ludy": lud, "grzechu": grzech, "odkupił": odkupic, "uśmiechu": usmiech }
  - clean: "— «Przygodne rzeczy, co przypadek tworzy\nW granicach zmysłów, w świecie podsłonecznym,\nWszystkie pod wzrokiem kształtują się wiecznym,\nLecz zeń konieczność nie więcej wynika,\nJak obraz łodzi z oka podróżnika,\nPłynącej prądem swobodnym potoku:\nZeń, jak z organu harmonija słodka\nWchodzi do uszu, odbija w mym oku\nSmutny swój obraz czas, co ciebie spotka."
    verse: true
    chunks:
      - pl: "— «Przygodne rzeczy, co przypadek tworzy"
        ru: "— «Случайные вещи, которые творит случай"
      - pl: "\nW granicach zmysłów, w świecie podsłonecznym,"
        ru: "в пределах чувств, в подсолнечном мире,"
      - pl: "\nWszystkie pod wzrokiem kształtują się wiecznym,"
        ru: "все образуются под вечным взором,"
      - pl: "\nLecz zeń konieczność nie więcej wynika,"
        ru: "но из него необходимость вытекает не больше,"
      - pl: "\nJak obraz łodzi z oka podróżnika,"
        ru: "чем образ лодки из глаза путника,"
      - pl: "\nPłynącej prądem swobodnym potoku:"
        ru: "плывущей по свободному течению потока:"
      - pl: "\nZeń, jak z organu harmonija słodka"
        ru: "из него, как сладкая гармония органа"
      - pl: "\nWchodzi do uszu, odbija w mym oku"
        ru: "входит в уши, отражается в моём глазу"
      - pl: "\nSmutny swój obraz czas, co ciebie spotka."
        ru: "печальный образ времени, что тебя постигнет."
    words: { "zmysłów": zmysl, "wiecznym": wieczny, "konieczność": koniecznosc, "wynika": wynikac, "prądem": prad, "swobodnym": swobodny }
  - clean: "Jak Hipolita wygnała macocha,\nWyżenie ciebie Florencyja płocha;\nTego chcą, wszyscy naglą twe wygnanie,\nPrzez tychże samych, niesłychana zbrodnia,\nCo tym zajęci, wkrótce się to stanie,\nTam, gdzie Chrystusem radzi kupczą co dnia\nJuż wrogi twoje wabią cię na harce,\nJuż ostrzą bronie twojej krwi łakome\nI jak się dzieje, sąd zwycięskiej strony\nPrzysądzi winę stronie zwyciężonej;"
    verse: true
    chunks:
      - pl: "Jak Hipolita wygnała macocha,"
        ru: "Как Ипполита изгнала мачеха,"
      - pl: "\nWyżenie ciebie Florencyja płocha;"
        ru: "так легкомысленная Флоренция выгонит тебя;"
      - pl: "\nTego chcą, wszyscy naglą twe wygnanie,"
        ru: "этого хотят, все торопят твоё изгнание,"
      - pl: "\nPrzez tychże samych, niesłychana zbrodnia,"
        ru: "теми же самыми — неслыханное преступление, —"
      - pl: "\nCo tym zajęci, wkrótce się to stanie,"
        ru: "кто этим занят, вскоре это свершится"
      - pl: "\nTam, gdzie Chrystusem radzi kupczą co dnia"
        ru: "там, где Христом охотно торгуют каждый день."
        note: "в Риме, при Бонифации VIII"
      - pl: "\nJuż wrogi twoje wabią cię na harce,"
        ru: "Уже твои враги манят тебя на стычки,"
        note: "harce — стычки"
      - pl: "\nJuż ostrzą bronie twojej krwi łakome"
        ru: "уже точат оружие, жадное до твоей крови,"
      - pl: "\nI jak się dzieje, sąd zwycięskiej strony"
        ru: "и, как бывает, суд победившей стороны"
      - pl: "\nPrzysądzi winę stronie zwyciężonej;"
        ru: "присудит вину побеждённой стороне;"
    words: { "zbrodnia": zbrodnia, "wkrótce": wkrotce, "bronie": bron, "zwycięskiej": zwycieski, "winę": wina, "zwyciężonej": zwyciezyc }
  - clean: "Lecz zemsta boża przyjdzie dać widome\nŚwiadectwo prawdzie, tej zemsty szafarce.\nPorzucisz drogie osoby i rzeczy,\nTen grot wygnania najsrożej kaleczy;\nPoznasz, jak gorzką zaprawiony solą\nChleb cudzy dany nie z gościnną wolą;\nPoznasz, jak przykro, bodaj się nie rodzić,\nPo cudzych schodach wstępować i schodzić!"
    verse: true
    chunks:
      - pl: "Lecz zemsta boża przyjdzie dać widome"
        ru: "но Божья месть придёт дать явное"
      - pl: "\nŚwiadectwo prawdzie, tej zemsty szafarce."
        ru: "свидетельство истине, распорядительнице этой мести."
        note: "szafarka — распорядительница"
      - pl: "\nPorzucisz drogie osoby i rzeczy,"
        ru: "Ты покинешь дорогих людей и вещи,"
      - pl: "\nTen grot wygnania najsrożej kaleczy;"
        ru: "эта стрела изгнания калечит больнее всего;"
      - pl: "\nPoznasz, jak gorzką zaprawiony solą"
        ru: "узнаешь, как горек, приправленный солью,"
      - pl: "\nChleb cudzy dany nie z gościnną wolą;"
        ru: "чужой хлеб, данный не с гостеприимной волей;"
      - pl: "\nPoznasz, jak przykro, bodaj się nie rodzić,"
        ru: "узнаешь, как тяжко — лучше бы не родиться! —"
      - pl: "\nPo cudzych schodach wstępować i schodzić!"
        ru: "по чужим лестницам подниматься и спускаться!"
    words: { "gorzką": gorzki, "solą": sol, "Chleb": chleb, "cudzy": cudzy, "schodach": schody, "schodzić": schodzic }
  - clean: "A co najwięcej zgarbi twe ramiona,\nTo ciżba głupia z tobą potępiona,\nNiewdzięczna, podła; jej gniew ją uzbroi\nPrzeciwko tobie; nie ty, ale ona\nMieć będzie czoło od wstydu czerwone.\nGdy tym dowiedzie zwierzęcości swojej,\nPięknie ci będzie, żeś umiał w potrzebie\nWłasne stronnictwo wyrobić sam z siebie."
    verse: true
    chunks:
      - pl: "A co najwięcej zgarbi twe ramiona,"
        ru: "А что больше всего согнёт тебе плечи,"
      - pl: "\nTo ciżba głupia z tobą potępiona,"
        ru: "это глупая толпа, осуждённая вместе с тобой,"
      - pl: "\nNiewdzięczna, podła; jej gniew ją uzbroi"
        ru: "неблагодарная, подлая; её гнев вооружит её"
      - pl: "\nPrzeciwko tobie; nie ty, ale ona"
        ru: "против тебя; не ты, а она"
      - pl: "\nMieć będzie czoło od wstydu czerwone."
        ru: "будет иметь лоб, красный от стыда."
      - pl: "\nGdy tym dowiedzie zwierzęcości swojej,"
        ru: "Когда она этим докажет свою звериность,"
      - pl: "\nPięknie ci będzie, żeś umiał w potrzebie"
        ru: "хорошо тебе будет, что ты сумел в нужде"
      - pl: "\nWłasne stronnictwo wyrobić sam z siebie."
        ru: "создать собственную партию сам из себя."
    words: { "podła": podly, "gniew": gniew, "uzbroi": uzbroic, "czoło": czolo, "wstydu": wstyd, "dowiedzie": dowiesc }
  - clean: "Pierwszą tułacza ulgę i zachronę\nZnajdziesz w uprzejmej Lombarda gościnie,\nKtóry ma w herbie orła na drabinie\nJego życzliwy dla ciebie dostatek\nTak zrówna ściśle i prośbę, i datek,\nŻe co na końcu kładzie pańska duma,\nStanie się pierwszym między wami dwoma."
    verse: true
    chunks:
      - pl: "Pierwszą tułacza ulgę i zachronę"
        ru: "Первое облегчение и приют скитальца"
      - pl: "\nZnajdziesz w uprzejmej Lombarda gościnie,"
        ru: "ты найдёшь в любезном гостеприимстве ломбардца,"
        note: "Бартоломео делла Скала"
      - pl: "\nKtóry ma w herbie orła na drabinie"
        ru: "у которого в гербе орёл на лестнице;"
      - pl: "\nJego życzliwy dla ciebie dostatek"
        ru: "его благосклонный к тебе достаток"
      - pl: "\nTak zrówna ściśle i prośbę, i datek,"
        ru: "так точно уравняет и просьбу, и дар,"
      - pl: "\nŻe co na końcu kładzie pańska duma,"
        ru: "что то, что господская гордость кладёт на конец,"
      - pl: "\nStanie się pierwszym między wami dwoma."
        ru: "станет первым между вами двумя."
    words: { "ulgę": ulga, "uprzejmej": uprzejmy, "orła": orzel, "drabinie": drabina, "ściśle": scisle, "duma": duma }
  - clean: "Na jego dworze rośnie dzieciuch mężny,\nCo wpływ tej gwiazdy poczuł tak potężny,\nŻe męstwem zrówna pierwsze bohatery.\nNiepostrzeżony jeszcze dziś od ludów,\nBo nad nim krążą lat dziewięć te sfery:\nLecz nim Gaskończyk Henryka omami,\nOn jak mąż wielki zabłyśnie cnotami,\nPogardą bogactw i znoszeniem trudów."
    verse: true
    chunks:
      - pl: "Na jego dworze rośnie dzieciuch mężny,"
        ru: "При его дворе растёт мужественный ребёнок,"
        note: "Кангранде делла Скала"
      - pl: "\nCo wpływ tej gwiazdy poczuł tak potężny,"
        ru: "что почувствовал влияние этой звезды так сильно,"
      - pl: "\nŻe męstwem zrówna pierwsze bohatery."
        ru: "что мужеством сравняется с первыми героями."
      - pl: "\nNiepostrzeżony jeszcze dziś od ludów,"
        ru: "Ещё сегодня не замеченный народами,"
      - pl: "\nBo nad nim krążą lat dziewięć te sfery:"
        ru: "ибо над ним кружили эти сферы лишь девять лет:"
      - pl: "\nLecz nim Gaskończyk Henryka omami,"
        ru: "но прежде чем гасконец обманет Генриха,"
        note: "Климент V — Генриха VII"
