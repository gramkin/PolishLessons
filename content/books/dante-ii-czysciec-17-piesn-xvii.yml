# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 17
chapterTitle: "Pieśń XVII"
chapterTitleRu: "Песнь XVII. Учение о любви"
level: B2
paragraphs:
  - clean: "(Widzenia obrazów gniewu. Krąg IV. Gnuśni chrześcijanie w szybkim pędzie. Wieczór. Moralny podział czyśćca.)"
    chunks:
      - pl: "(Widzenia obrazów gniewu. Krąg IV. Gnuśni chrześcijanie w szybkim pędzie. Wieczór. Moralny podział czyśćca.)"
        ru: "(Видения образов гнева. Круг IV. Нерадивые христиане в быстром беге. Вечер. Нравственное деление Чистилища.)"
        note: "gnuśny — нерадивый, вялый"
    words: { "gniewu": gniew, "Krąg": krag, "chrześcijanie": chrzescijanin, "szybkim": szybki, "Wieczór": wieczor, "Moralny": moralny }
  - clean: "Przypomnij sobie, czytelniku miły,\nJeśli cię kiedy w Alpach mgły zgęszczone\nNagle wilgotnym obłokiem nakryły,\nPatrzałeś jak kret przez skórzaną błonę;\nMgła zaś gdy rzadziej swoje kłęby zwija,\nPrzez nią słoneczny blask słabo przebija;\nA wyobrazisz, jak ja mimochodem\nUjrzałem słońce przed jego zachodem."
    verse: true
    chunks:
      - pl: "Przypomnij sobie, czytelniku miły,"
        ru: "Вспомни, милый читатель,"
      - pl: "\nJeśli cię kiedy w Alpach mgły zgęszczone"
        ru: "если тебя когда-нибудь в Альпах сгустившиеся туманы"
        note: "zgęszczony — сгустившийся"
      - pl: "\nNagle wilgotnym obłokiem nakryły,"
        ru: "внезапно накрывали влажным облаком,"
      - pl: "\nPatrzałeś jak kret przez skórzaną błonę;"
        ru: "и ты смотрел, как крот сквозь кожаную плёнку;"
        note: "kret — крот; błona — плёнка"
      - pl: "\nMgła zaś gdy rzadziej swoje kłęby zwija,"
        ru: "когда же туман реже свёртывает свои клубы,"
      - pl: "\nPrzez nią słoneczny blask słabo przebija;"
        ru: "сквозь него слабо пробивается солнечный блеск;"
      - pl: "\nA wyobrazisz, jak ja mimochodem"
        ru: "и ты представишь, как я мимоходом"
      - pl: "\nUjrzałem słońce przed jego zachodem."
        ru: "увидел солнце перед его закатом."
    words: { "mgły": mgla, "błonę": blona, "rzadziej": rzadko, "słoneczny": sloneczny, "blask": blask, "Ujrzałem": ujrzec }
  - clean: "Tak równo z wodzem gdy stanąłem w kroku,\nNa koniec z dymu wyszedłem obłoku\nW chwili, gdy góry tej poziomsze skały\nPromienie dla się zmarłe pożegnały.\nImaginacjo! czasem tak daleko\nSkrzydło twe z sobą człowieka porywa,\nŻe on nie słyszy, nie widzi powieką,\nJak wkoło niego z tysiąc trąb przegrywa."
    verse: true
    chunks:
      - pl: "Tak równo z wodzem gdy stanąłem w kroku,"
        ru: "Так, поравнявшись шагом с вождём,"
      - pl: "\nNa koniec z dymu wyszedłem obłoku"
        ru: "я наконец вышел из облака дыма"
      - pl: "\nW chwili, gdy góry tej poziomsze skały"
        ru: "в тот миг, когда нижние скалы этой горы"
        note: "poziomszy — устар. «более низкий»"
      - pl: "\nPromienie dla się zmarłe pożegnały."
        ru: "простились с угасшими для них лучами."
      - pl: "\nImaginacjo! czasem tak daleko"
        ru: "Воображение! порой так далеко"
      - pl: "\nSkrzydło twe z sobą człowieka porywa,"
        ru: "твоё крыло уносит с собой человека,"
      - pl: "\nŻe on nie słyszy, nie widzi powieką,"
        ru: "что он не слышит, не видит глазом,"
      - pl: "\nJak wkoło niego z tysiąc trąb przegrywa."
        ru: "как вокруг него играют тысячи труб."
    words: { "wodzem": wodz, "dymu": dym, "skały": skala, "Promienie": promien, "Skrzydło": skrzydlo, "przegrywa": przegrywac }
  - clean: "Cóż cię ożywia, gdy nie bodą zmysły?\nOto ożywia cię promień wybłysły\nAż z wysokości nieba, gdzie się tworzy,\nSchodząc sam przez się albo z woli bożej.\nSynobójczyni widziałem oblicze\nKtórą żal w piórka przyodział słowicze,\nPtak, co swą boleść tak rozkosznie kwili!"
    verse: true
    chunks:
      - pl: "Cóż cię ożywia, gdy nie bodą zmysły?"
        ru: "Что тебя оживляет, когда не колют чувства?"
      - pl: "\nOto ożywia cię promień wybłysły"
        ru: "Вот, тебя оживляет луч, блеснувший"
      - pl: "\nAż z wysokości nieba, gdzie się tworzy,"
        ru: "с самой высоты неба, где он творится,"
      - pl: "\nSchodząc sam przez się albo z woli bożej."
        ru: "сходя сам собой или по воле Божьей."
      - pl: "\nSynobójczyni widziałem oblicze"
        ru: "Я увидел лицо детоубийцы,"
        note: "synobójczyni — убийца сына; Прокна"
      - pl: "\nKtórą żal w piórka przyodział słowicze,"
        ru: "которую скорбь одела в соловьиные пёрышки,"
        note: "słowiczy — соловьиный"
      - pl: "\nPtak, co swą boleść tak rozkosznie kwili!"
        ru: "птица, что так сладостно щебечет свою боль!"
    words: { "zmysły": zmysl, "tworzy": tworzyc, "Schodząc": schodzic, "bożej": bozy, "oblicze": oblicze, "Ptak": ptak }
  - clean: "Duch mój sam w siebie zebrał się w tej chwili,\nNic nie przyjmując z zewnętrznego świata:\nFantazja moja, co pod gwiazdy lata,\nSpadła obrazem aż na krzyż Hamana,\nKtórego dumą twarz napiętnowana;\nPrzy nim widziałem króla Ahaswera,\nTuż stała żona królewska Estera\nI Mardocheusz, twarz pełna pogody,\nW słowach i w czynach mąż prawy, bez zmazy."
    verse: true
    chunks:
      - pl: "Duch mój sam w siebie zebrał się w tej chwili,"
        ru: "Мой дух в этот миг собрался в себе,"
      - pl: "\nNic nie przyjmując z zewnętrznego świata:"
        ru: "ничего не принимая из внешнего мира:"
      - pl: "\nFantazja moja, co pod gwiazdy lata,"
        ru: "моя фантазия, что летает под звёздами,"
      - pl: "\nSpadła obrazem aż na krzyż Hamana,"
        ru: "упала образом на самый крест Амана,"
        note: "Аман, распятый по указу Артаксеркса"
      - pl: "\nKtórego dumą twarz napiętnowana;"
        ru: "чьё лицо заклеймено гордыней;"
        note: "napiętnowany — заклеймённый"
      - pl: "\nPrzy nim widziałem króla Ahaswera,"
        ru: "при нём я видел царя Артаксеркса,"
        note: "Ahaswer — Ахашверош (Артаксеркс)"
      - pl: "\nTuż stała żona królewska Estera"
        ru: "рядом стояла царская жена Эсфирь"
      - pl: "\nI Mardocheusz, twarz pełna pogody,"
        ru: "и Мардохей, лицо полное ясности,"
      - pl: "\nW słowach i w czynach mąż prawy, bez zmazy."
        ru: "в словах и делах муж праведный, без пятна."
    words: { "zewnętrznego": zewnetrzny, "Fantazja": fantazja, "krzyż": krzyz, "dumą": duma, "pogody": pogoda, "czynach": czyn }
  - clean: "Gdy z ócz mych prysły te oba obrazy,\nJak bańka z braku, co ją tworzy, wody,\nWtem przystąpiła płacząca dziewica\nNa tło mych widzeń i ku mnie swe lica\nZwraca, i mówi: «Czemu, o królowo!\nGniew ciebie w ziemię zakopał surową?"
    verse: true
    chunks:
      - pl: "Gdy z ócz mych prysły te oba obrazy,"
        ru: "Когда из моих глаз лопнули оба эти образа,"
      - pl: "\nJak bańka z braku, co ją tworzy, wody,"
        ru: "как пузырь от недостатка воды, что его образует,"
      - pl: "\nWtem przystąpiła płacząca dziewica"
        ru: "тут выступила плачущая дева"
      - pl: "\nNa tło mych widzeń i ku mnie swe lica"
        ru: "на фон моих видений и ко мне своё лицо"
      - pl: "\nZwraca, i mówi: «Czemu, o królowo!"
        ru: "обращает и говорит: «Зачем, о царица!"
      - pl: "\nGniew ciebie w ziemię zakopał surową?"
        ru: "гнев закопал тебя в суровую землю?"
        note: "Амата, мать Лавинии, повесившаяся в гневе"
    words: { "płacząca": plakac, "dziewica": dziewica, "Zwraca": zwracac, "królowo": krolowa, "zakopał": zakopac, "surową": surowy }
  - clean: "Siebie zabiłaś, nie chcąc córki zgubić,\nJednak tyś twoją Lawinię zgubiła.\nMatko! mnie więcej boli twa mogiła\nNiż tego, który pragnął mię zaślubić».\nSenne powieki gdy blask draśnie we dnie,\nSen wnet się łamie, lecz nim się dokruszy,\nJeszcze się ślizga po marzącej duszy."
    verse: true
    chunks:
      - pl: "Siebie zabiłaś, nie chcąc córki zgubić,"
        ru: "Ты убила себя, не желая потерять дочь,"
      - pl: "\nJednak tyś twoją Lawinię zgubiła."
        ru: "и всё же ты потеряла свою Лавинию."
      - pl: "\nMatko! mnie więcej boli twa mogiła"
        ru: "Мать! мне больнее твоя могила,"
      - pl: "\nNiż tego, który pragnął mię zaślubić»."
        ru: "чем того, кто хотел на мне жениться»."
        note: "Турн"
      - pl: "\nSenne powieki gdy blask draśnie we dnie,"
        ru: "Когда свет заденет днём сонные веки,"
      - pl: "\nSen wnet się łamie, lecz nim się dokruszy,"
        ru: "сон тотчас ломается, но, прежде чем рассыплется,"
        note: "dokruszyć się — раскрошиться"
      - pl: "\nJeszcze się ślizga po marzącej duszy."
        ru: "он ещё скользит по грезящей душе."
    words: { "zgubić": zgubic, "boli": bolec, "pragnął": pragnac, "łamie": lamac, "marzącej": marzyc, "duszy": dusza }
  - clean: "Podobnie moje widzenia wokoło\nPierzchając znikły, gdy mi twarz i czoło\nDrasnęło światło większe niż powszednie.\nSpojrzałem za się, chcąc widzieć, gdzie byłem,\nGdy głos przemówił: «Wstępujcie na schody!»\nI w ten głos całą uwagę utkwiłem."
    verse: true
    chunks:
      - pl: "Podobnie moje widzenia wokoło"
        ru: "Так и мои видения вокруг"
      - pl: "\nPierzchając znikły, gdy mi twarz i czoło"
        ru: "исчезли, разбегаясь, когда мне лицо и чело"
      - pl: "\nDrasnęło światło większe niż powszednie."
        ru: "задел свет больший, чем обыкновенный."
      - pl: "\nSpojrzałem za się, chcąc widzieć, gdzie byłem,"
        ru: "Я оглянулся, желая видеть, где я был,"
      - pl: "\nGdy głos przemówił: «Wstępujcie na schody!»"
        ru: "когда голос сказал: «Восходите по лестнице!»"
      - pl: "\nI w ten głos całą uwagę utkwiłem."
        ru: "И я вперил в этот голос всё внимание."
    words: { "Podobnie": podobnie, "znikły": zniknac, "czoło": czolo, "światło": swiatlo, "przemówił": przemowic, "schody": schody }
  - clean: "Czułem się skorszym i lżejszym niż wprzódy\nI niecierpliwą wolą cały drżałem,\nAż w mówiącego twarzą w twarz spojrzałem.\nLecz jak powieki nasze mruży słońce\nKształt swój zbytecznym swym blaskiem kryjące,\nTak blask tę siłę odebrał wzrokowi."
    verse: true
    chunks:
      - pl: "Czułem się skorszym i lżejszym niż wprzódy"
        ru: "Я чувствовал себя проворнее и легче, чем прежде,"
      - pl: "\nI niecierpliwą wolą cały drżałem,"
        ru: "и весь дрожал нетерпеливой волей,"
      - pl: "\nAż w mówiącego twarzą w twarz spojrzałem."
        ru: "пока не взглянул говорящему лицом в лицо."
      - pl: "\nLecz jak powieki nasze mruży słońce"
        ru: "Но как солнце жмурит наши веки,"
      - pl: "\nKształt swój zbytecznym swym blaskiem kryjące,"
        ru: "скрывающее свой облик излишним блеском,"
      - pl: "\nTak blask tę siłę odebrał wzrokowi."
        ru: "так блеск отнял эту силу у зрения."
    words: { "lżejszym": lekki, "wprzódy": wprzody, "słońce": slonce, "Kształt": ksztalt, "kryjące": kryc, "wzrokowi": wzrok }
  - clean: "— «Oto jest boży anioł», mistrz mój mówi:\n«Co nas prowadzi tędy nieproszony,\nA sam się kryje w blasku swej zasłony.\nOn robi z nami, co człowiek na ziemi\nNa wzór ten robić powinien z bliźniemi:\nBo ten, kto prośby proszącego czeka,\nWidząc potrzebę, nie śpieszy z pomocą,\nNie licz na serce takiego człowieka."
    verse: true
    chunks:
      - pl: "— «Oto jest boży anioł», mistrz mój mówi:"
        ru: "— «Вот Божий ангел, — говорит мой учитель, —"
      - pl: "\n«Co nas prowadzi tędy nieproszony,"
        ru: "что ведёт нас здесь непрошеный"
      - pl: "\nA sam się kryje w blasku swej zasłony."
        ru: "и сам скрывается в блеске своего покрова."
      - pl: "\nOn robi z nami, co człowiek na ziemi"
        ru: "Он делает с нами то, что человек на земле"
      - pl: "\nNa wzór ten robić powinien z bliźniemi:"
        ru: "по этому образцу должен делать с ближними:"
      - pl: "\nBo ten, kto prośby proszącego czeka,"
        ru: "ибо тот, кто ждёт просьбы просящего,"
      - pl: "\nWidząc potrzebę, nie śpieszy z pomocą,"
        ru: "видя нужду, не спешит с помощью,"
      - pl: "\nNie licz na serce takiego człowieka."
        ru: "не рассчитывай на сердце такого человека."
    words: { "anioł": aniol, "tędy": tedy, "zasłony": zaslona, "wzór": wzor, "prośby": prosba, "śpieszy": spieszyc }
  - clean: "Bądźmy posłuszni anioła wezwaniu,\nSzybko te schody szczeblujmy przed nocą,\nBo je przejdziemy chyba na zaraniu».\nTak wódz mój mówił i w szyję opoki\nKu schodom nasze zwróciliśmy kroki.\nPierwszy ich stopień gdym dotknął stopami,\nPoczułem jakby od skrzydeł powiewu\nWiatr na mym czole; głos mówił za nami:\n«Błogosławieni, co wolni od gniewu!»."
    verse: true
    chunks:
      - pl: "Bądźmy posłuszni anioła wezwaniu,"
        ru: "Будем послушны призыву ангела,"
      - pl: "\nSzybko te schody szczeblujmy przed nocą,"
        ru: "быстро поднимемся по этим ступеням до ночи,"
        note: "szczeblować — подниматься по ступеням"
      - pl: "\nBo je przejdziemy chyba na zaraniu»."
        ru: "ибо их мы пройдём разве что на заре»."
        note: "zaranie — заря"
      - pl: "\nTak wódz mój mówił i w szyję opoki"
        ru: "Так говорил мой вождь, и в горловину скалы"
      - pl: "\nKu schodom nasze zwróciliśmy kroki."
        ru: "мы направили наши шаги к лестнице."
      - pl: "\nPierwszy ich stopień gdym dotknął stopami,"
        ru: "Когда я коснулся ногами первой её ступени,"
      - pl: "\nPoczułem jakby od skrzydeł powiewu"
        ru: "я почувствовал, будто от веяния крыльев,"
      - pl: "\nWiatr na mym czole; głos mówił za nami:"
        ru: "ветер на моём лбу; голос говорил позади нас:"
      - pl: "\n«Błogosławieni, co wolni od gniewu!»."
        ru: "«Блаженны те, кто свободен от гнева!»"
    words: { "szyję": szyja, "zwróciliśmy": zwrocic, "stopień": stopien, "dotknął": dotknac, "Wiatr": wiatr, "Błogosławieni": blogoslawic }
  - clean: "Promienie słońca uchodząc przed nocą,\nWstawały proste z brzegów widnokręga,\nPatrzą, już gwiazdy tu i tam migocą.\nOdwago moja, gdzie jest twa potęga?\nMyślałem w sobie, bo czułem, jak nogi\nMdlały pode mną na pośrodku drogi."
    verse: true
    chunks:
      - pl: "Promienie słońca uchodząc przed nocą,"
        ru: "Лучи солнца, уходя перед ночью,"
      - pl: "\nWstawały proste z brzegów widnokręga,"
        ru: "поднимались прямо от краёв горизонта,"
      - pl: "\nPatrzą, już gwiazdy tu i tam migocą."
        ru: "смотрим — уже звёзды мерцают там и сям."
      - pl: "\nOdwago moja, gdzie jest twa potęga?"
        ru: "Отвага моя, где твоя мощь?"
      - pl: "\nMyślałem w sobie, bo czułem, jak nogi"
        ru: "думал я про себя, ибо чувствовал, как ноги"
      - pl: "\nMdlały pode mną na pośrodku drogi."
        ru: "изнемогали подо мной посреди дороги."
    words: { "uchodząc": uchodzic, "Wstawały": wstawac, "brzegów": brzeg, "gwiazdy": gwiazda, "Odwago": odwaga, "potęga": potega }
  - clean: "Z mistrzem stanąłem, przebiegłszy te schody,\nJak łódź zaryta na mieliźnie wody.\nW tym nowym kręgu natężałem ucha,\nChcąc coś posłyszeć, była cisza głucha:\nPotem do mistrza mówiłem w te słowa:\n«Z jakiej się czyści duch obrazy Boga\nTu, gdzie jesteśmy? gdy spoczywa noga,\nNiech się z letargu przebudzi twa mowa» ."
    verse: true
    chunks:
      - pl: "Z mistrzem stanąłem, przebiegłszy te schody,"
        ru: "Я остановился с учителем, пробежав эту лестницу,"
      - pl: "\nJak łódź zaryta na mieliźnie wody."
        ru: "как лодка, зарывшаяся в мель."
        note: "mielizna — мель"
      - pl: "\nW tym nowym kręgu natężałem ucha,"
        ru: "В этом новом круге я напрягал слух,"
      - pl: "\nChcąc coś posłyszeć, była cisza głucha:"
        ru: "желая что-нибудь услышать, — была глухая тишина:"
      - pl: "\nPotem do mistrza mówiłem w te słowa:"
        ru: "потом я сказал учителю такими словами:"
      - pl: "\n«Z jakiej się czyści duch obrazy Boga"
        ru: "«От какого оскорбления Бога очищается дух"
      - pl: "\nTu, gdzie jesteśmy? gdy spoczywa noga,"
        ru: "здесь, где мы? раз нога отдыхает,"
      - pl: "\nNiech się z letargu przebudzi twa mowa» ."
        ru: "пусть от летаргии пробудится твоя речь»."
    words: { "mistrzem": mistrz, "stanąłem": stanac, "łódź": lodz, "cisza": cisza, "głucha": gluchy, "mowa": mowa }
