  - clean: "Zdaje się, że miała romantyczne usposobienie, bo usiadła na swoim kufrze, który stał tuż pod oknem, i pogrążyła się w marzeniach. Nigdy — mawiała, zalewając się łzami, gdy opowiadała o tym przeżyciu — nigdy nie czuła się bardziej pogodzona ze wszystkimi ludźmi ani nie myślała życzliwiej o świecie. I gdy tak siedziała, zauważyła starszego, pięknego pana o białych włosach, który zbliżał się uliczką; a naprzeciw niego szedł inny, bardzo mały pan, na którego z początku mniej zwracała uwagę."
    en: "It seems she was romantically given, for she sat down upon her box, which stood immediately under the window, and fell into a dream of musing. Never (she used to say, with streaming tears, when she narrated that experience), never had she felt more at peace with all men or thought more kindly of the world. And as she so sat she became aware of an aged beautiful gentleman with white hair, drawing near along the lane; and advancing to meet him, another and very small gentleman, to whom at first she paid less attention."
    draft: true
    chunks:
      - pl: "Zdaje się, że miała romantyczne usposobienie,"
        ru: "Похоже, у неё был романтический склад,"
        note: "usposobienie — нрав, склад характера"
      - pl: " bo usiadła na swoim kufrze, który stał tuż pod oknem, i pogrążyła się w marzeniach."
        ru: "потому что она села на свой сундук, стоявший прямо под окном, и погрузилась в мечты."
        note: "kufer — сундук"
      - pl: " Nigdy — mawiała, zalewając się łzami, gdy opowiadała o tym przeżyciu —"
        ru: "Никогда, говаривала она, обливаясь слезами, когда рассказывала об этом случае,"
        note: "zalewać się łzami — обливаться слезами"
      - pl: " nigdy nie czuła się bardziej pogodzona ze wszystkimi ludźmi ani nie myślała życzliwiej o świecie."
        ru: "никогда не чувствовала она себя в большем мире со всеми людьми и не думала о мире добрее."
        note: "pogodzony — примирённый"
      - pl: " I gdy tak siedziała, zauważyła starszego, pięknego pana o białych włosach,"
        ru: "И пока она так сидела, она заметила пожилого красивого господина с белыми волосами,"
      - pl: " który zbliżał się uliczką;"
        ru: "который приближался по переулку;"
      - pl: " a naprzeciw niego szedł inny, bardzo mały pan, na którego z początku mniej zwracała uwagę."
        ru: "а навстречу ему шёл другой, совсем маленький господин, на которого она сначала обращала меньше внимания."
    words: { "romantyczne": romantyczny, "marzeniach": marzenie, "mawiała": mawiac, "łzami": lza, "pogodzona": pogodzic, "zwracała": zwracac }
  - clean: "Gdy zbliżyli się na odległość rozmowy (a było to tuż pod oczami służącej), starszy pan ukłonił się i zagadnął drugiego z bardzo ujmującą uprzejmością. Nie wyglądało na to, by przedmiot jego słów był bardzo ważny; sądząc z tego, jak wskazywał ręką, chwilami zdawało się wręcz, że tylko pyta o drogę; ale księżyc oświetlał mu twarz, gdy mówił, i dziewczyna z przyjemnością się jej przyglądała, tak bardzo zdawała się tchnąć niewinną, staroświecką dobrocią usposobienia, a jednocześnie czymś wyniosłym, jak dobrze uzasadnione zadowolenie z siebie."
    en: "When they had come within speech (which was just under the maid’s eyes) the older man bowed and accosted the other with a very pretty manner of politeness. It did not seem as if the subject of his address were of great importance; indeed, from his pointing, it sometimes appeared as if he were only inquiring his way; but the moon shone on his face as he spoke, and the girl was pleased to watch it, it seemed to breathe such an innocent and old-world kindness of disposition, yet with something high too, as of a well-founded self-content."
    draft: true
    chunks:
      - pl: "Gdy zbliżyli się na odległość rozmowy (a było to tuż pod oczami służącej),"
        ru: "Когда они сошлись на расстояние разговора (как раз под глазами служанки),"
      - pl: " starszy pan ukłonił się i zagadnął drugiego z bardzo ujmującą uprzejmością."
        ru: "старший господин поклонился и обратился к другому с очень милой учтивостью."
        note: "zagadnąć — заговорить, обратиться; ujmujący — располагающий"
      - pl: " Nie wyglądało na to, by przedmiot jego słów był bardzo ważny;"
        ru: "Не было похоже, чтобы предмет его речи был очень важен;"
      - pl: " sądząc z tego, jak wskazywał ręką, chwilami zdawało się wręcz, że tylko pyta o drogę;"
        ru: "судя по тому, как он показывал рукой, порой даже казалось, что он только спрашивает дорогу;"
      - pl: " ale księżyc oświetlał mu twarz, gdy mówił,"
        ru: "но луна освещала его лицо, пока он говорил,"
      - pl: " i dziewczyna z przyjemnością się jej przyglądała,"
        ru: "и девушке было приятно на него смотреть,"
      - pl: " tak bardzo zdawała się tchnąć niewinną, staroświecką dobrocią usposobienia,"
        ru: "так оно, казалось, дышало невинной, старомодной добротой нрава,"
        note: "tchnąć czymś — дышать чем-л."
      - pl: " a jednocześnie czymś wyniosłym, jak dobrze uzasadnione zadowolenie z siebie."
        ru: "и вместе с тем чем-то высоким, вроде вполне обоснованного довольства собой."
        note: "wyniosły — горделивый, возвышенный"
    words: { "odległość": odleglosc, "uprzejmością": uprzejmosc, "przedmiot": przedmiot, "przyglądała": przygladac, "dobrocią": dobroc, "jednocześnie": jednoczesnie }
  - clean: "Po chwili jej wzrok powędrował ku drugiemu i ze zdziwieniem rozpoznała w nim niejakiego pana Hyde'a, który odwiedził kiedyś jej pana i do którego poczuła niechęć. Trzymał w ręku ciężką laskę, którą się bawił; ale nie odpowiadał ani słowem i zdawał się słuchać z ledwie hamowaną niecierpliwością. A potem nagle wybuchnął wielkim płomieniem gniewu, tupiąc nogą, wymachując laską i zachowując się (jak to opisała służąca) jak szaleniec."
    en: "Presently her eye wandered to the other, and she was surprised to recognise in him a certain Mr. Hyde, who had once visited her master and for whom she had conceived a dislike. He had in his hand a heavy cane, with which he was trifling; but he answered never a word, and seemed to listen with an ill-contained impatience. And then all of a sudden he broke out in a great flame of anger, stamping with his foot, brandishing the cane, and carrying on (as the maid described it) like a madman."
    draft: true
    chunks:
      - pl: "Po chwili jej wzrok powędrował ku drugiemu"
        ru: "Вскоре её взгляд перешёл на другого,"
      - pl: " i ze zdziwieniem rozpoznała w nim niejakiego pana Hyde'a,"
        ru: "и она с удивлением узнала в нём некоего мистера Хайда,"
      - pl: " który odwiedził kiedyś jej pana i do którego poczuła niechęć."
        ru: "который однажды приходил к её хозяину и к которому она почувствовала неприязнь."
      - pl: " Trzymał w ręku ciężką laskę, którą się bawił;"
        ru: "Он держал в руке тяжёлую трость и поигрывал ею;"
      - pl: " ale nie odpowiadał ani słowem i zdawał się słuchać z ledwie hamowaną niecierpliwością."
        ru: "но не отвечал ни слова и, казалось, слушал с едва сдерживаемым нетерпением."
        note: "hamować — сдерживать"
      - pl: " A potem nagle wybuchnął wielkim płomieniem gniewu,"
        ru: "А потом вдруг вспыхнул великим пламенем гнева,"
      - pl: " tupiąc nogą, wymachując laską i zachowując się (jak to opisała służąca) jak szaleniec."
        ru: "топая ногой, размахивая тростью и ведя себя (как описала служанка) словно безумный."
        note: "tupać — топать; wymachiwać — размахивать"
    words: { "wzrok": wzrok, "ledwie": ledwie, "płomieniem": plomien, "gniewu": gniew, "opisała": opisac, "szaleniec": szaleniec }
  - clean: "Starszy pan cofnął się o krok z miną kogoś bardzo zdziwionego i odrobinę urażonego; a wtedy pan Hyde przekroczył wszelkie granice i jednym ciosem laski powalił go na ziemię. A w następnej chwili z małpią furią tratował swoją ofiarę i zasypywał ją gradem ciosów, pod którymi słychać było trzask łamanych kości, a ciało podskakiwało na jezdni. Na widok i odgłos tej grozy służąca zemdlała."
    en: "The old gentleman took a step back, with the air of one very much surprised and a trifle hurt; and at that Mr. Hyde broke out of all bounds and clubbed him to the earth. And next moment, with ape-like fury, he was trampling his victim under foot and hailing down a storm of blows, under which the bones were audibly shattered and the body jumped upon the roadway. At the horror of these sights and sounds, the maid fainted."
    draft: true
    chunks:
      - pl: "Starszy pan cofnął się o krok z miną kogoś bardzo zdziwionego i odrobinę urażonego;"
        ru: "Старый джентльмен отступил на шаг с видом человека очень удивлённого и слегка обиженного;"
        note: "urażony — обиженный"
      - pl: " a wtedy pan Hyde przekroczył wszelkie granice i jednym ciosem laski powalił go na ziemię."
        ru: "и тут мистер Хайд перешёл всякие границы и одним ударом трости свалил его на землю."
        note: "powalić — повалить"
      - pl: " A w następnej chwili z małpią furią tratował swoją ofiarę"
        ru: "А в следующий миг с обезьяньей яростью он топтал свою жертву"
        note: "małpi — обезьяний"
      - pl: " i zasypywał ją gradem ciosów, pod którymi słychać było trzask łamanych kości,"
        ru: "и осыпал её градом ударов, под которыми слышно было, как ломаются кости,"
        note: "grad ciosów — град ударов"
      - pl: " a ciało podskakiwało na jezdni."
        ru: "а тело подпрыгивало на мостовой."
      - pl: " Na widok i odgłos tej grozy służąca zemdlała."
        ru: "От ужаса этих зрелищ и звуков служанка лишилась чувств."
        note: "zemdleć — упасть в обморок"
    words: { "zdziwionego": zdziwic, "urażonego": urazic, "przekroczył": przekroczyc, "łamanych": lamac, "odgłos": odglos, "zemdlała": zemdlec }
  - clean: "Była druga, gdy oprzytomniała i wezwała policję. Morderca dawno zniknął; ale pośrodku uliczki leżała jego ofiara, niewiarygodnie zmasakrowana. Laska, którą popełniono ten czyn, choć była z jakiegoś rzadkiego, bardzo twardego i ciężkiego drewna, złamała się na pół pod naporem tego bezrozumnego okrucieństwa; jedna roztrzaskana połowa potoczyła się do pobliskiego rynsztoka — drugą bez wątpienia zabrał morderca. Przy ofierze znaleziono sakiewkę i złoty zegarek, ale żadnych wizytówek ani papierów, z wyjątkiem zaklejonej i ofrankowanej koperty, którą prawdopodobnie niósł na pocztę i na której widniało nazwisko i adres pana Uttersona."
    en: "It was two o’clock when she came to herself and called for the police. The murderer was gone long ago; but there lay his victim in the middle of the lane, incredibly mangled. The stick with which the deed had been done, although it was of some rare and very tough and heavy wood, had broken in the middle under the stress of this insensate cruelty; and one splintered half had rolled in the neighbouring gutter—the other, without doubt, had been carried away by the murderer. A purse and gold watch were found upon the victim: but no cards or papers, except a sealed and stamped envelope, which he had been probably carrying to the post, and which bore the name and address of Mr. Utterson."
    draft: true
    chunks:
      - pl: "Była druga, gdy oprzytomniała i wezwała policję."
        ru: "Было два часа, когда она очнулась и позвала полицию."
        note: "oprzytomnieć — очнуться"
      - pl: " Morderca dawno zniknął;"
        ru: "Убийца давно скрылся;"
      - pl: " ale pośrodku uliczki leżała jego ofiara, niewiarygodnie zmasakrowana."
        ru: "но посреди переулка лежала его жертва, невероятно изуродованная."
      - pl: " Laska, którą popełniono ten czyn,"
        ru: "Трость, которой было совершено это дело,"
      - pl: " choć była z jakiegoś rzadkiego, bardzo twardego i ciężkiego drewna,"
        ru: "хотя и была из какого-то редкого, очень твёрдого и тяжёлого дерева,"
      - pl: " złamała się na pół pod naporem tego bezrozumnego okrucieństwa;"
        ru: "переломилась пополам под натиском этой безумной жестокости;"
        note: "napór — натиск; bezrozumny — бессмысленный"
      - pl: " jedna roztrzaskana połowa potoczyła się do pobliskiego rynsztoka"
        ru: "одна расщеплённая половина откатилась в соседнюю сточную канаву,"
        note: "rynsztok — сточная канава"
      - pl: " — drugą bez wątpienia zabrał morderca."
        ru: "— другую, без сомнения, унёс убийца."
      - pl: " Przy ofierze znaleziono sakiewkę i złoty zegarek,"
        ru: "При жертве нашли кошелёк и золотые часы,"
        note: "sakiewka — кошелёк"
      - pl: " ale żadnych wizytówek ani papierów,"
        ru: "но никаких визитных карточек или бумаг,"
      - pl: " z wyjątkiem zaklejonej i ofrankowanej koperty, którą prawdopodobnie niósł na pocztę"
        ru: "кроме запечатанного конверта с маркой, который он, вероятно, нёс на почту"
        note: "ofrankować — оплатить маркой"
      - pl: " i na której widniało nazwisko i adres pana Uttersona."
        ru: "и на котором значились имя и адрес мистера Аттерсона."
    words: { "czyn": czyn, "drewna": drewno, "potoczyła": potoczyc, "wizytówek": wizytowka, "koperty": koperta, "niósł": niesc }
  - clean: "Przyniesiono ją adwokatowi następnego ranka, zanim wstał z łóżka; a ledwie ją zobaczył i usłyszał o okolicznościach, wydął z powagą wargi. — Nic nie powiem, dopóki nie zobaczę ciała — rzekł. — To może być bardzo poważne. Proszę łaskawie zaczekać, aż się ubiorę. I z tą samą poważną miną pospiesznie zjadł śniadanie i pojechał na posterunek policji, dokąd przewieziono ciało. Gdy tylko wszedł do celi, skinął głową."
    en: "This was brought to the lawyer the next morning, before he was out of bed; and he had no sooner seen it and been told the circumstances, than he shot out a solemn lip. “I shall say nothing till I have seen the body,” said he; “this may be very serious. Have the kindness to wait while I dress.” And with the same grave countenance he hurried through his breakfast and drove to the police station, whither the body had been carried. As soon as he came into the cell, he nodded."
    draft: true
    chunks:
      - pl: "Przyniesiono ją adwokatowi następnego ranka, zanim wstał z łóżka;"
        ru: "Его принесли адвокату на следующее утро, когда он ещё не встал с постели;"
      - pl: " a ledwie ją zobaczył i usłyszał o okolicznościach, wydął z powagą wargi."
        ru: "и едва он его увидел и услышал об обстоятельствах, как с важностью поджал губы."
        note: "wydąć wargi — надуть, выпятить губы"
      - pl: " — Nic nie powiem, dopóki nie zobaczę ciała — rzekł. — To może być bardzo poważne."
        ru: "— Я ничего не скажу, пока не увижу тело, — сказал он. — Это может быть очень серьёзно."
      - pl: " Proszę łaskawie zaczekać, aż się ubiorę."
        ru: "Будьте любезны подождать, пока я оденусь."
        note: "łaskawie — любезно"
      - pl: " I z tą samą poważną miną pospiesznie zjadł śniadanie i pojechał na posterunek policji, dokąd przewieziono ciało."
        ru: "И с тем же серьёзным видом наскоро позавтракал и поехал в полицейский участок, куда доставили тело."
        note: "posterunek policji — полицейский участок"
      - pl: " Gdy tylko wszedł do celi, skinął głową."
        ru: "Едва войдя в камеру, он кивнул."
        note: "skinąć głową — кивнуть"
    words: { "ledwie": ledwie, "powagą": powaga, "wargi": warga, "rzekł": rzec, "celi": cela, "skinął": skinac }
  - clean: "— Tak — rzekł — rozpoznaję go. Z przykrością muszę powiedzieć, że to sir Danvers Carew."
    en: "“Yes,” said he, “I recognise him. I am sorry to say that this is Sir Danvers Carew.”"
    draft: true
    chunks:
      - pl: "— Tak — rzekł — rozpoznaję go. Z przykrością muszę powiedzieć, że to sir Danvers Carew."
