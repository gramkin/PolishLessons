paragraphs:
  - clean: "Blisko rok później, w październiku 18… roku, Londynem wstrząsnęła zbrodnia o niezwykłym okrucieństwie, tym głośniejsza z powodu wysokiej pozycji ofiary. Szczegółów było niewiele, a były zatrważające. Służąca, mieszkająca samotnie w domu niedaleko rzeki, poszła na górę spać około jedenastej. Choć nad ranem nad miasto napłynęła mgła, pierwsza część nocy była bezchmurna, a uliczka, na którą wychodziło okno służącej, była jasno oświetlona przez księżyc w pełni."
    en: "Nearly a year later, in the month of October, 18—, London was startled by a crime of singular ferocity and rendered all the more notable by the high position of the victim. The details were few and startling. A maid servant living alone in a house not far from the river, had gone upstairs to bed about eleven. Although a fog rolled over the city in the small hours, the early part of the night was cloudless, and the lane, which the maid’s window overlooked, was brilliantly lit by the full moon."
    draft: true
    chunks:
      - pl: "Blisko rok później, w październiku 18… roku, Londynem wstrząsnęła zbrodnia o niezwykłym okrucieństwie,"
        ru: "Почти год спустя, в октябре 18… года, Лондон потрясло преступление необычайной жестокости,"
        note: "wstrząsnąć czymś — потрясти что-л.: творительный; okrucieństwo — жестокость"
      - pl: " tym głośniejsza z powodu wysokiej pozycji ofiary."
        ru: "тем более громкое из-за высокого положения жертвы."
      - pl: " Szczegółów było niewiele, a były zatrważające."
        ru: "Подробностей было немного, и они были ужасающими."
        note: "zatrważający — ужасающий"
      - pl: " Służąca, mieszkająca samotnie w domu niedaleko rzeki, poszła na górę spać około jedenastej."
        ru: "Служанка, жившая одна в доме недалеко от реки, поднялась наверх спать около одиннадцати."
      - pl: " Choć nad ranem nad miasto napłynęła mgła,"
