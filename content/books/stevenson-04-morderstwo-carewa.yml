  - clean: "W całym domu, który poza starą kobietą był pusty, pan Hyde używał tylko paru pokoi; ale były one urządzone z przepychem i dobrym smakiem. Szafa była pełna wina; zastawa była srebrna, bielizna stołowa elegancka; na ścianie wisiał dobry obraz, prezent (jak przypuszczał Utterson) od Henry'ego Jekylla, który był wielkim znawcą; a dywany były grube i miłe dla oka. W tej chwili jednak pokoje nosiły wszelkie ślady niedawnego i pospiesznego przetrząsania; ubrania leżały na podłodze z kieszeniami wywróconymi na lewą stronę; zamykane na klucz szuflady stały otworem; a na palenisku leżał stos szarego popiołu, jakby spalono wiele papierów."
    en: "In the whole extent of the house, which but for the old woman remained otherwise empty, Mr. Hyde had only used a couple of rooms; but these were furnished with luxury and good taste. A closet was filled with wine; the plate was of silver, the napery elegant; a good picture hung upon the walls, a gift (as Utterson supposed) from Henry Jekyll, who was much of a connoisseur; and the carpets were of many piles and agreeable in colour. At this moment, however, the rooms bore every mark of having been recently and hurriedly ransacked; clothes lay about the floor, with their pockets inside out; lock-fast drawers stood open; and on the hearth there lay a pile of grey ashes, as though many papers had been burned."
