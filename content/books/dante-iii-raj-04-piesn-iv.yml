# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 4
chapterTitle: "Pieśń IV"
chapterTitleRu: "Песнь IV. Воля и насилие"
level: B2
paragraphs:
  - clean: "(Dalszy ciąg. Pouczenie o istocie i stopniach błogosławieństwa i o wolnej woli.)"
    chunks:
      - pl: "(Dalszy ciąg. Pouczenie o istocie i stopniach błogosławieństwa i o wolnej woli.)"
        ru: "(Продолжение. Поучение о сущности и ступенях блаженства и о свободной воле.)"
    words: { "Dalszy": daleki, "ciąg": ciag, "istocie": istota, "stopniach": stopien, "błogosławieństwa": blogoslawienstwo }
  - clean: "Pomiędzy dwiema siedząc potrawami,\nUmarłby z głodu człowiek, pan wyboru,\nGdyby z nich jednej nie przeżuł zębami.\nTak między dwoma drży jagnię wilkami,\nTak drży pies, wpadłszy między dwa rogale;\nTak zawieszony między dwa zwątpienia\nMilczałem tylko, bom czuł mus milczenia,\nZ czego bynajmniej ja się nie pochwalę."
    verse: true
    chunks:
      - pl: "Pomiędzy dwiema siedząc potrawami,"
        ru: "Сидя между двумя кушаньями,"
      - pl: "\nUmarłby z głodu człowiek, pan wyboru,"
        ru: "умер бы с голоду человек, господин выбора,"
      - pl: "\nGdyby z nich jednej nie przeżuł zębami."
        ru: "если бы не разжевал зубами одно из них."
      - pl: "\nTak między dwoma drży jagnię wilkami,"
        ru: "Так между двумя волками дрожит ягнёнок,"
      - pl: "\nTak drży pies, wpadłszy między dwa rogale;"
        ru: "так дрожит пёс, попав между двумя ланями;"
        note: "rogal — здесь «рогатый зверь»"
      - pl: "\nTak zawieszony między dwa zwątpienia"
        ru: "так, повиснув между двумя сомнениями,"
      - pl: "\nMilczałem tylko, bom czuł mus milczenia,"
        ru: "я лишь молчал, ибо чувствовал необходимость молчать,"
        note: "mus — необходимость"
      - pl: "\nZ czego bynajmniej ja się nie pochwalę."
        ru: "чем я отнюдь не стану хвалиться."
    words: { "głodu": glod, "wyboru": wybor, "zębami": zab, "wpadłszy": wpasc, "zawieszony": zawiesic, "Milczałem": milczec }
  - clean: "Milczałem, ale był to chłód pozoru,\nZ lic mych iskrzyła chęć pytania nowa\nGoręcej, niżby buchnęła przez słowa.\nJak prorok Daniel przez wykład snu dziwny\nGniew ukołysał okrutnego króla,\nTak Beatrycze przez natchnienie boże\nZrobiła mówiąc: — «Ja widzę niemylnie,\nJak cię pociąga dwóch żądz prąd przeciwny;\nTroska twa sama wiąże się tak silnie,\nŻe się na zewnątrz rozwinąć nie może."
    verse: true
    chunks:
      - pl: "Milczałem, ale był to chłód pozoru,"
        ru: "Я молчал, но это был холод видимости,"
      - pl: "\nZ lic mych iskrzyła chęć pytania nowa"
        ru: "с моего лица искрилось новое желание спросить"
      - pl: "\nGoręcej, niżby buchnęła przez słowa."
        ru: "горячее, чем если бы вырвалось словами."
      - pl: "\nJak prorok Daniel przez wykład snu dziwny"
        ru: "Как пророк Даниил дивным толкованием сна"
      - pl: "\nGniew ukołysał okrutnego króla,"
        ru: "усмирил гнев жестокого царя,"
      - pl: "\nTak Beatrycze przez natchnienie boże"
        ru: "так поступила Беатриче по Божьему вдохновению,"
      - pl: "\nZrobiła mówiąc: — «Ja widzę niemylnie,"
        ru: "говоря: — «Я безошибочно вижу,"
      - pl: "\nJak cię pociąga dwóch żądz prąd przeciwny;"
        ru: "как тебя влечёт встречное течение двух желаний;"
      - pl: "\nTroska twa sama wiąże się tak silnie,"
        ru: "твоя забота сама себя так сильно связывает,"
      - pl: "\nŻe się na zewnątrz rozwinąć nie może."
        ru: "что не может развернуться наружу."
    words: { "pozoru": pozor, "prorok": prorok, "wykład": wyklad, "okrutnego": okrutny, "wiąże": wiazac, "rozwinąć": rozwinac }
  - clean: "Ty rozumujesz: gdy trwa dobra wola,\nDlaczego, gdy jej czyni gwałt kto drugi,\nMaleje wartość jej własnej zasługi?\nJeszcze cię robak drugiej troski wierci,\nJakoby dusze wedle słów Platona\nDo gwiazd rodzinnych wracają po śmierci."
    verse: true
    chunks:
      - pl: "Ty rozumujesz: gdy trwa dobra wola,"
        ru: "Ты рассуждаешь: если добрая воля длится,"
      - pl: "\nDlaczego, gdy jej czyni gwałt kto drugi,"
        ru: "почему, когда ей другой чинит насилие,"
      - pl: "\nMaleje wartość jej własnej zasługi?"
        ru: "уменьшается цена её собственной заслуги?"
      - pl: "\nJeszcze cię robak drugiej troski wierci,"
        ru: "Ещё тебя точит червь второй заботы:"
      - pl: "\nJakoby dusze wedle słów Platona"
        ru: "будто, по словам Платона, души"
      - pl: "\nDo gwiazd rodzinnych wracają po śmierci."
        ru: "после смерти возвращаются к родным звёздам."
    words: { "trwa": trwac, "wartość": wartosc, "zasługi": zasluga, "robak": robak, "troski": troska, "rodzinnych": rodzinny }
  - clean: "Dwóch tych trosk w tobie walka niestoczona.\nWpierw zwalczę bronią mojego wykładu\nMyśl, co najwięcej ma żółci i jadu.\nWśród Serafinów, co przed Panem panów\nNajświetniej gorą, dwóch, czy jeden z Janów,\nSamuel, Mojżesz nie mówię, Maryja,\nWszyscy jak duchy, których widzisz cienie,\nNie mają swoich stolic w drugim niebie:\nRównie im świeci wiekuiste lato."
    verse: true
    chunks:
      - pl: "Dwóch tych trosk w tobie walka niestoczona."
        ru: "Борьба этих двух забот в тебе не решена."
      - pl: "\nWpierw zwalczę bronią mojego wykładu"
        ru: "Сперва я одолею оружием моего толкования"
      - pl: "\nMyśl, co najwięcej ma żółci i jadu."
        ru: "мысль, в которой больше всего желчи и яда."
      - pl: "\nWśród Serafinów, co przed Panem panów"
        ru: "Среди серафимов, что перед Господом господ"
      - pl: "\nNajświetniej gorą, dwóch, czy jeden z Janów,"
        ru: "горят ярче всех, ни один из Иоаннов,"
      - pl: "\nSamuel, Mojżesz nie mówię, Maryja,"
        ru: "ни Самуил, ни Моисей, не говорю уже — Мария,"
      - pl: "\nWszyscy jak duchy, których widzisz cienie,"
        ru: "все, как духи, тени которых ты видишь,"
      - pl: "\nNie mają swoich stolic w drugim niebie:"
        ru: "имеют свои престолы не в другом небе:"
      - pl: "\nRównie im świeci wiekuiste lato."
        ru: "им одинаково светит вечное лето."
    words: { "Wpierw": wpierw, "duchy": duch, "stolic": stolica, "niebie": niebo, "Równie": rownie, "lato": lato }
  - clean: "Lecz wszyscy pierwszą upiękniają sferę,\nSłodycz ich życia równie się rozwija\nI światło różnie wyiskrzają z siebie,\nWedług jak czują w sobie boże tchnienie.\nTe duchy tu się pokazały na to,\nAbyś przez znaki poznał prawdoszczere,\nJaka najniższa sfera ze sfer nieba."
    verse: true
    chunks:
      - pl: "Lecz wszyscy pierwszą upiękniają sferę,"
        ru: "Но все украшают первую сферу,"
        note: "Эмпирей"
      - pl: "\nSłodycz ich życia równie się rozwija"
        ru: "сладость их жизни развивается по-разному,"
      - pl: "\nI światło różnie wyiskrzają z siebie,"
        ru: "и свет они изливают из себя различно,"
      - pl: "\nWedług jak czują w sobie boże tchnienie."
        ru: "смотря по тому, как чувствуют в себе Божье дыхание."
      - pl: "\nTe duchy tu się pokazały na to,"
        ru: "Эти духи показались здесь для того,"
      - pl: "\nAbyś przez znaki poznał prawdoszczere,"
        ru: "чтобы ты по знакам узнал истинно,"
        note: "prawdoszczery — истинный"
      - pl: "\nJaka najniższa sfera ze sfer nieba."
        ru: "какова самая низкая сфера из сфер неба."
    words: { "Słodycz": slodycz, "światło": swiatlo, "pokazały": pokazac, "znaki": znak, "poznał": poznac, "najniższa": niski }
  - clean: "Do waszych pojęć tak przemawiać trzeba,\nBo rozumowy wasz pogląd zawisły\nOd sądu, jaki naprzód tworzą zmysły.\nDlatego pismo folgować wam umie,\nGdy boże oko, boża ręka mówi,\nNadając ludzki kształt Arcyduchowi;\nChoć Pismo wcale rzecz inną rozumie."
    verse: true
    chunks:
      - pl: "Do waszych pojęć tak przemawiać trzeba,"
        ru: "С вашими понятиями так нужно говорить,"
      - pl: "\nBo rozumowy wasz pogląd zawisły"
        ru: "ибо ваше разумное воззрение зависит"
      - pl: "\nOd sądu, jaki naprzód tworzą zmysły."
        ru: "от суждения, которое прежде создают чувства."
      - pl: "\nDlatego pismo folgować wam umie,"
        ru: "Поэтому Писание умеет снисходить к вам,"
        note: "folgować — снисходить"
      - pl: "\nGdy boże oko, boża ręka mówi,"
        ru: "когда говорит о Божьем оке, Божьей руке,"
      - pl: "\nNadając ludzki kształt Arcyduchowi;"
        ru: "придавая человеческий облик Высшему Духу;"
      - pl: "\nChoć Pismo wcale rzecz inną rozumie."
        ru: "хотя Писание разумеет вовсе иное."
    words: { "przemawiać": przemawiac, "pogląd": poglad, "zmysły": zmysl, "pismo": pismo, "Nadając": nadawac, "kształt": ksztalt }
  - clean: "I święty Kościół pod figurą ciała\nWam Gabriela przedstawia, Michała\nI tego, co wzrok wrócił Tobiaszowi. —\nMyśl, jaką Platon w usta Tymeusza\nWkłada o duszach, nic wspólnego nie ma\nZ tym, co tu widzim; on mówi, jak mniema;\nMówi, że wraca do swej gwiazdy dusza,\nWierząc, że od niej oderwaną była,\nKiedy natura ją z formą łączyła."
    verse: true
    chunks:
      - pl: "I święty Kościół pod figurą ciała"
        ru: "И святая Церковь в образе тела"
      - pl: "\nWam Gabriela przedstawia, Michała"
        ru: "представляет вам Гавриила, Михаила"
      - pl: "\nI tego, co wzrok wrócił Tobiaszowi. —"
        ru: "и того, кто вернул зрение Товии."
        note: "Рафаил"
      - pl: "\nMyśl, jaką Platon w usta Tymeusza"
        ru: "Мысль, какую Платон вкладывает в уста Тимея"
      - pl: "\nWkłada o duszach, nic wspólnego nie ma"
        ru: "о душах, не имеет ничего общего"
      - pl: "\nZ tym, co tu widzim; on mówi, jak mniema;"
        ru: "с тем, что мы видим здесь; он говорит, как полагает;"
      - pl: "\nMówi, że wraca do swej gwiazdy dusza,"
        ru: "говорит, что душа возвращается к своей звезде,"
      - pl: "\nWierząc, że od niej oderwaną była,"
        ru: "веря, что она была от неё оторвана,"
      - pl: "\nKiedy natura ją z formą łączyła."
        ru: "когда природа соединяла её с формой."
    words: { "przedstawia": przedstawiac, "wzrok": wzrok, "Wkłada": wkladac, "natura": natura, "formą": forma, "łączyła": laczyc }
  - clean: "Może w tym zdaniu inna myśl się chowa,\nZamiar, którego nie wydały słowa,\nGodny nie żartu, lecz raczej podziwu.\nJeżeli przez to rozumie, że wpływu\nDo swych sfer wraca chwała i nagana,\nJako odbity promień od zwierciadła;\nStrzała być mogła dobrze celowana,\nOd tarczy prawdy niedaleko padła."
    verse: true
    chunks:
      - pl: "Może w tym zdaniu inna myśl się chowa,"
        ru: "Может быть, в этом мнении прячется иная мысль,"
      - pl: "\nZamiar, którego nie wydały słowa,"
        ru: "намерение, которого не выразили слова,"
      - pl: "\nGodny nie żartu, lecz raczej podziwu."
        ru: "достойное не насмешки, а скорее удивления."
      - pl: "\nJeżeli przez to rozumie, że wpływu"
        ru: "Если он разумеет под этим, что к своим сферам"
      - pl: "\nDo swych sfer wraca chwała i nagana,"
        ru: "возвращаются слава и порицание за влияние,"
      - pl: "\nJako odbity promień od zwierciadła;"
        ru: "как луч, отражённый от зеркала,"
      - pl: "\nStrzała być mogła dobrze celowana,"
        ru: "то стрела могла быть хорошо нацелена,"
      - pl: "\nOd tarczy prawdy niedaleko padła."
        ru: "упала недалеко от щита истины."
    words: { "Godny": godny, "chwała": chwala, "promień": promien, "Strzała": strzala, "celowana": celowac, "tarczy": tarcza }
  - clean: "Już źle pojęta zasada ta śmiała\nLedwo nie cały stary świat zbłąkała,\nKtóry cześć Marsa, Jowisza ogłasza.\nDruga wątpliwość, jaka tobą chwieje,\nMniej jadowita, zbić ją mam nadzieję.\nŻe ludziom zda się sprawiedliwość nasza\nNiesprawiedliwą, w tym jest skarga stara,\nNie złość kacerska, lecz wątpiąca wiara."
    verse: true
    chunks:
      - pl: "Już źle pojęta zasada ta śmiała"
        ru: "Уже это смелое начало, дурно понятое,"
      - pl: "\nLedwo nie cały stary świat zbłąkała,"
        ru: "сбило с пути едва ли не весь древний мир,"
      - pl: "\nKtóry cześć Marsa, Jowisza ogłasza."
        ru: "что провозглашает почитание Марса, Юпитера."
      - pl: "\nDruga wątpliwość, jaka tobą chwieje,"
        ru: "Второе сомнение, что тебя колеблет,"
      - pl: "\nMniej jadowita, zbić ją mam nadzieję."
        ru: "менее ядовито, надеюсь его опровергнуть."
      - pl: "\nŻe ludziom zda się sprawiedliwość nasza"
        ru: "Что людям наша справедливость кажется"
      - pl: "\nNiesprawiedliwą, w tym jest skarga stara,"
        ru: "несправедливой — в этом старая жалоба,"
      - pl: "\nNie złość kacerska, lecz wątpiąca wiara."
        ru: "не еретическая злоба, а сомневающаяся вера."
    words: { "Ledwo": ledwo, "wątpliwość": watpliwosc, "sprawiedliwość": sprawiedliwosc, "Niesprawiedliwą": niesprawiedliwy, "skarga": skarga, "wątpiąca": watpic }
  - clean: "A że tę prawdę twój rozum w lot zbada,\nWedle, jak żądasz, objaśnię cię rada.\nGdy gwałt przychodzi, cierpiąca go dusza,\nChociaż spokojnym żalem się zakrwawia,\nBez żadnej spółki z tym, który ją zmusza,\nGwałt jeszcze takiej duszy nie wymawia."
    verse: true
    chunks:
      - pl: "A że tę prawdę twój rozum w lot zbada,"
        ru: "А так как твой разум на лету исследует эту истину,"
      - pl: "\nWedle, jak żądasz, objaśnię cię rada."
        ru: "я охотно разъясню тебе, как ты желаешь."
      - pl: "\nGdy gwałt przychodzi, cierpiąca go dusza,"
        ru: "Когда приходит насилие, душа, терпящая его,"
      - pl: "\nChociaż spokojnym żalem się zakrwawia,"
        ru: "хотя и обливается кровью спокойной скорбью,"
      - pl: "\nBez żadnej spółki z tym, który ją zmusza,"
        ru: "без всякого соучастия с тем, кто её принуждает,"
      - pl: "\nGwałt jeszcze takiej duszy nie wymawia."
        ru: "насилие ещё не оправдывает такую душу."
        note: "wymawiać — оправдывать"
    words: { "rozum": rozum, "zbada": zbadac, "żądasz": zadac-2, "spokojnym": spokojny, "żalem": zal, "zmusza": zmuszac }
  - clean: "Wola, gdy nie chce, ma ognia naturę,\nGaś po sto razy, on wybucha w górę.\nWięc gdy się wola mniej lub więcej zgina\nPrzed siłą, siły sługą być zaczyna:\nTak i te duchy mogły na wstyd siły\nWrócić za kratę, jednak nie wróciły."
    verse: true
    chunks:
      - pl: "Wola, gdy nie chce, ma ognia naturę,"
        ru: "Воля, когда не хочет, имеет природу огня:"
      - pl: "\nGaś po sto razy, on wybucha w górę."
        ru: "гаси его хоть сто раз — он вырывается вверх."
      - pl: "\nWięc gdy się wola mniej lub więcej zgina"
        ru: "Итак, когда воля более или менее сгибается"
      - pl: "\nPrzed siłą, siły sługą być zaczyna:"
        ru: "перед силой, она начинает быть слугой силы:"
      - pl: "\nTak i te duchy mogły na wstyd siły"
        ru: "так и эти духи могли, к стыду силы,"
      - pl: "\nWrócić za kratę, jednak nie wróciły."
        ru: "вернуться за решётку, однако не вернулись."
    words: { "ognia": ogien, "górę": gora, "siłą": sila, "sługą": sluga, "zaczyna": zaczynac, "wstyd": wstyd }
  - clean: "Gdyby ich wola była tak wytrwała,\nJaka Wawrzyńca na żarach trzymała,\nCo w ogniu rękę paliła Scewoli;\nCzyżby nie mogły swe śluby przerwane\nDopełnić w miejscu, skąd były porwane?\nLecz arcyrzadka taka stałość woli!"
    verse: true
    chunks:
      - pl: "Gdyby ich wola była tak wytrwała,"
        ru: "Если бы их воля была столь стойкой,"
      - pl: "\nJaka Wawrzyńca na żarach trzymała,"
        ru: "какая держала Лаврентия на углях,"
      - pl: "\nCo w ogniu rękę paliła Scewoli;"
        ru: "что в огне жгла руку Сцеволе;"
      - pl: "\nCzyżby nie mogły swe śluby przerwane"
        ru: "неужели они не могли бы исполнить свои прерванные обеты"
      - pl: "\nDopełnić w miejscu, skąd były porwane?"
        ru: "в том месте, откуда были похищены?"
      - pl: "\nLecz arcyrzadka taka stałość woli!"
        ru: "Но крайне редка такая твёрдость воли!"
    words: { "trzymała": trzymac, "rękę": reka, "paliła": palic, "śluby": slub, "przerwane": przerwac, "porwane": porwac }
  - clean: "Ten wykład, jeśliś doń ucha przykładał,\nTwemu twierdzeniu cios ostatni zadał.\nLecz oto drugi ciebie błąd pokusza,\nZ którego własna myśl cię nie wyzwoli:\nZ tej walki mógłbyś wyjść cały znużony.\nBłogosławiona, mówiłam ci, dusza\nKłamać nie może, ponieważ szczęśliwa\nPrzy pierwszej prawdzie najbliżej przebywa."
    verse: true
    chunks:
      - pl: "Ten wykład, jeśliś doń ucha przykładał,"
        ru: "Это толкование, если ты приложил к нему ухо,"
      - pl: "\nTwemu twierdzeniu cios ostatni zadał."
