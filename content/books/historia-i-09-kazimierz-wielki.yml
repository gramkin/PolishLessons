        note: "szczątki — останки; wylec — высыпать (о толпе); otucha — бодрость, надежда"
      - pl: " W następnym rozdziale zobaczymy, jak jego dziedzictwo przejęła węgierska dynastia, a potem młoda dziewczyna, którą Polacy mieli koronować nie na królową, ale na króla."
        ru: "В следующей главе мы увидим, как его наследие перешло к венгерской династии, а затем к юной девушке, которую поляки короновали не королевой, а королём."
