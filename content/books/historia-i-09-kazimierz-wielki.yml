  - clean: "Kazimierz zakładał też nowe miasta i wsie. Obok Krakowa powstało miasto nazwane od jego imienia Kazimierzem, które później stało się centrum życia żydowskiego. Uporządkował zarząd kopalń soli w Wieliczce i Bochni, które przynosiły skarbowi królewskiemu ogromne dochody. Wprowadził nową, dobrą monetę, grosz krakowski. Dbał o drogi i handel, nadawał miastom przywileje i bronił kupców przed rozbójnikami."
    draft: true
    chunks:
      - pl: "Kazimierz zakładał też nowe miasta i wsie."
        ru: "Казимир основывал и новые города и деревни."
      - pl: " Obok Krakowa powstało miasto nazwane od jego imienia Kazimierzem, które później stało się centrum życia żydowskiego."
        ru: "Рядом с Краковом появился город, названный по его имени Казимежем, который позже стал центром еврейской жизни."
      - pl: " Uporządkował zarząd kopalń soli w Wieliczce i Bochni, które przynosiły skarbowi królewskiemu ogromne dochody."
        ru: "Он упорядочил управление соляными копями в Величке и Бохне, которые приносили королевской казне огромные доходы."
