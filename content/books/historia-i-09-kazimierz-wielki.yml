chapter: 9
chapterTitle: "Kazimierz Wielki"
chapterTitleRu: "Казимир Великий"
level: B2
paragraphs:
  - clean: "Kazimierz, jedyny żyjący syn Łokietka, został koronowany w kwietniu 1333 roku, mając niespełna dwadzieścia trzy lata. Był wysoki, okazały i lubił życie: polowania, uczty i piękne kobiety. Niektórzy możni obawiali się, że będzie lekkomyślnym władcą. Pamiętano, że w bitwie pod Płowcami ojciec kazał go odesłać z pola walki, i szeptano, że brakuje mu odwagi. Ci, którzy tak sądzili, bardzo się pomylili. Kazimierz okazał się jednym z najmądrzejszych władców w dziejach Polski i jedynym, którego potomni nazwali Wielkim."
    draft: true
    chunks:
      - pl: "Kazimierz, jedyny żyjący syn Łokietka, został koronowany w kwietniu 1333 roku, mając niespełna dwadzieścia trzy lata."
        ru: "Казимир, единственный выживший сын Локотка, был коронован в апреле 1333 года, когда ему не было и двадцати трёх лет."
        note: "niespełna — неполных"
      - pl: " Był wysoki, okazały i lubił życie: polowania, uczty i piękne kobiety."
        ru: "Он был высок, статен и любил жизнь: охоту, пиры и красивых женщин."
        note: "okazały — статный, видный; polowanie — охота"
      - pl: " Niektórzy możni obawiali się, że będzie lekkomyślnym władcą."
        ru: "Некоторые вельможи опасались, что он будет легкомысленным правителем."
        note: "obawiać się — опасаться"
      - pl: " Pamiętano, że w bitwie pod Płowcami ojciec kazał go odesłać z pola walki, i szeptano, że brakuje mu odwagi."
        ru: "Помнили, что в битве под Пловцами отец велел увести его с поля боя, и шептались, что ему не хватает отваги."
        note: "szeptać — шептаться; odwaga — отвага"
      - pl: " Ci, którzy tak sądzili, bardzo się pomylili."
        ru: "Те, кто так думал, сильно ошиблись."
        note: "pomylić się — ошибиться"
      - pl: " Kazimierz okazał się jednym z najmądrzejszych władców w dziejach Polski i jedynym, którego potomni nazwali Wielkim."
        ru: "Казимир оказался одним из мудрейших правителей в истории Польши и единственным, кого потомки назвали Великим."
    words: { "kwietniu": kwiecien, "dwadzieścia": dwadziescia, "władcą": wladca, "bitwie": bitwa, "odesłać": odeslac, "odwagi": odwaga, "pomylili": pomylic, "władców": wladca }
  - clean: "Odziedziczył państwo w bardzo trudnym położeniu. Królestwo było małe, otoczone wrogami i zrujnowane wojnami. Krzyżacy trzymali Pomorze, Kujawy i ziemię dobrzyńską. Czeski król Jan Luksemburski nadal tytułował się królem Polski, a większość książąt śląskich była jego lennikami. Ojciec walczył ze wszystkimi naraz i niemal wszystko przegrał. Syn wybrał inną drogę: zamiast wojować, postanowił negocjować."
    draft: true
    chunks:
      - pl: "Odziedziczył państwo w bardzo trudnym położeniu."
        ru: "Он унаследовал государство в очень тяжёлом положении."
        note: "położenie — положение"
      - pl: " Królestwo było małe, otoczone wrogami i zrujnowane wojnami."
        ru: "Королевство было маленьким, окружённым врагами и разорённым войнами."
      - pl: " Krzyżacy trzymali Pomorze, Kujawy i ziemię dobrzyńską."
        ru: "Крестоносцы удерживали Поморье, Куявию и Добжинскую землю."
      - pl: " Czeski król Jan Luksemburski nadal tytułował się królem Polski, a większość książąt śląskich była jego lennikami."
        ru: "Чешский король Иоанн Люксембургский по-прежнему титуловал себя королём Польши, а большинство силезских князей были его вассалами."
        note: "lennik — вассал, ленник"
      - pl: " Ojciec walczył ze wszystkimi naraz i niemal wszystko przegrał."
        ru: "Отец воевал со всеми сразу и почти всё проиграл."
      - pl: " Syn wybrał inną drogę: zamiast wojować, postanowił negocjować."
        ru: "Сын выбрал иной путь: вместо того чтобы воевать, он решил договариваться."
        note: "wojować — воевать; negocjować — вести переговоры"
    words: { "Królestwo": krolestwo, "otoczone": otoczyc, "zrujnowane": zrujnowac, "niemal": niemal }
  - clean: "Pierwszym wielkim sukcesem był zjazd w Wyszehradzie na Węgrzech w 1335 roku. Pośrednikiem był szwagier Kazimierza, król Węgier Karol Robert, który gościł obu rywali w swoim zamku nad Dunajem. Jan Luksemburski zrzekł się praw do polskiej korony za ogromną sumę dwudziestu tysięcy kop groszy praskich. Kazimierz musiał w zamian uznać, że Śląsk należy do korony czeskiej. Była to bolesna decyzja, ale realistyczna: Polska nie miała sił, żeby odzyskać Śląsk, a teraz przynajmniej miała spokój na południowym zachodzie."
    draft: true
    chunks:
      - pl: "Pierwszym wielkim sukcesem był zjazd w Wyszehradzie na Węgrzech w 1335 roku."
        ru: "Первым большим успехом стал съезд в Вышеграде в Венгрии в 1335 году."
      - pl: " Pośrednikiem był szwagier Kazimierza, król Węgier Karol Robert, który gościł obu rywali w swoim zamku nad Dunajem."
        ru: "Посредником выступил зять Казимира, король Венгрии Карл Роберт, который принимал обоих соперников в своём замке на Дунае."
        note: "pośrednik — посредник; szwagier — муж сестры, шурин, зять"
      - pl: " Jan Luksemburski zrzekł się praw do polskiej korony za ogromną sumę dwudziestu tysięcy kop groszy praskich."
        ru: "Иоанн Люксембургский отказался от прав на польскую корону за огромную сумму в двадцать тысяч коп пражских грошей."
        note: "zrzec się — отказаться (от права); kopa — копа, шестьдесят штук"
      - pl: " Kazimierz musiał w zamian uznać, że Śląsk należy do korony czeskiej."
        ru: "Казимир должен был взамен признать, что Силезия принадлежит чешской короне."
      - pl: " Była to bolesna decyzja, ale realistyczna: Polska nie miała sił, żeby odzyskać Śląsk, a teraz przynajmniej miała spokój na południowym zachodzie."
        ru: "Это было болезненное, но реалистичное решение: у Польши не было сил вернуть Силезию, а теперь у неё по крайней мере был покой на юго-западе."
        note: "bolesny — болезненный; przynajmniej — по крайней мере"
    words: { "zjazd": zjazd, "szwagier": szwagier, "zamku": zamek, "polskiej": polski, "korony": korona, "dwudziestu": dwadziescia, "groszy": grosz, "bolesna": bolesny, "południowym": poludniowy, "zachodzie": zachod }
  - clean: "Z Krzyżakami sprawa była trudniejsza. Kazimierz, podobnie jak ojciec, wytoczył im proces przed sądem papieskim. W 1339 roku w Warszawie przesłuchano ponad stu świadków, którzy opowiadali o krzyżackich najazdach, a sąd znów przyznał rację Polsce. Zakon znów zignorował wyrok. W 1343 roku w Kaliszu zawarto więc pokój kompromisowy. Krzyżacy oddali Kujawy i ziemię dobrzyńską, a Kazimierz zrzekł się Pomorza Gdańskiego i ziemi chełmińskiej. Dokument mówił o tym, że król oddaje je zakonowi „jako wieczystą jałmużnę”. Wielu Polaków uważało to za hańbę, ale Kazimierz zyskał pokój na północy na całe swoje panowanie."
    draft: true
    chunks:
      - pl: "Z Krzyżakami sprawa była trudniejsza."
        ru: "С крестоносцами дело было сложнее."
      - pl: " Kazimierz, podobnie jak ojciec, wytoczył im proces przed sądem papieskim."
        ru: "Казимир, как и отец, возбудил против них процесс в папском суде."
      - pl: " W 1339 roku w Warszawie przesłuchano ponad stu świadków, którzy opowiadali o krzyżackich najazdach, a sąd znów przyznał rację Polsce."
        ru: "В 1339 году в Варшаве допросили больше ста свидетелей, рассказывавших о набегах крестоносцев, и суд снова признал правоту Польши."
        note: "przesłuchać — допросить; świadek — свидетель; przyznać rację — признать правоту"
      - pl: " Zakon znów zignorował wyrok."
        ru: "Орден вновь проигнорировал приговор."
      - pl: " W 1343 roku w Kaliszu zawarto więc pokój kompromisowy."
        ru: "Поэтому в 1343 году в Калише заключили компромиссный мир."
      - pl: " Krzyżacy oddali Kujawy i ziemię dobrzyńską, a Kazimierz zrzekł się Pomorza Gdańskiego i ziemi chełmińskiej."
        ru: "Крестоносцы вернули Куявию и Добжинскую землю, а Казимир отказался от Гданьского Поморья и Хелминской земли."
      - pl: " Dokument mówił o tym, że król oddaje je zakonowi „jako wieczystą jałmużnę”."
        ru: "В документе говорилось, что король отдаёт их ордену «как вечную милостыню»."
        note: "wieczysty — вечный"
      - pl: " Wielu Polaków uważało to za hańbę, ale Kazimierz zyskał pokój na północy na całe swoje panowanie."
        ru: "Многие поляки считали это позором, но Казимир обеспечил себе мир на севере на всё своё правление."
    words: { "podobnie": podobnie, "przesłuchano": przesluchac, "zignorował": zignorowac, "wyrok": wyrok, "zawarto": zawrzec, "oddaje": oddawac, "hańbę": hanba, "zyskał": zyskac }
  - clean: "Zabezpieczony na zachodzie i północy, Kazimierz zwrócił się na wschód. Na południowy wschód od Polski leżała Ruś Halicka, bogata kraina ze Lwowem, Haliczem i Przemyślem, przez którą biegły szlaki handlowe nad Morze Czarne. W 1340 roku jej władca, książę Bolesław Jerzy II, spokrewniony z Piastami, został otruty przez swoich bojarów. Kazimierz natychmiast ruszył na Lwów, powołując się na prawa dziedziczne. O Ruś walczyli też Litwini, Węgrzy i Tatarzy, więc wojna ciągnęła się z przerwami ponad dwadzieścia lat. W końcu Kazimierz utrzymał ziemię halicką ze Lwowem, a także część Wołynia."
    draft: true
    chunks:
      - pl: "Zabezpieczony na zachodzie i północy, Kazimierz zwrócił się na wschód."
        ru: "Обезопасив себя на западе и севере, Казимир обратился на восток."
        note: "zabezpieczony — обезопасенный"
      - pl: " Na południowy wschód od Polski leżała Ruś Halicka, bogata kraina ze Lwowem, Haliczem i Przemyślem, przez którą biegły szlaki handlowe nad Morze Czarne."
        ru: "К юго-востоку от Польши лежала Галицкая Русь — богатый край со Львовом, Галичем и Перемышлем, через который шли торговые пути к Чёрному морю."
      - pl: " W 1340 roku jej władca, książę Bolesław Jerzy II, spokrewniony z Piastami, został otruty przez swoich bojarów."
        ru: "В 1340 году её правитель, князь Болеслав-Юрий II, состоявший в родстве с Пястами, был отравлен своими боярами."
        note: "spokrewniony — состоящий в родстве; bojar — боярин"
      - pl: " Kazimierz natychmiast ruszył na Lwów, powołując się na prawa dziedziczne."
        ru: "Казимир немедленно двинулся на Львов, ссылаясь на наследственные права."
        note: "powoływać się — ссылаться"
      - pl: " O Ruś walczyli też Litwini, Węgrzy i Tatarzy, więc wojna ciągnęła się z przerwami ponad dwadzieścia lat."
        ru: "За Русь боролись также литовцы, венгры и татары, поэтому война тянулась с перерывами больше двадцати лет."
      - pl: " W końcu Kazimierz utrzymał ziemię halicką ze Lwowem, a także część Wołynia."
        ru: "В конце концов Казимир удержал Галицкую землю со Львовом, а также часть Волыни."
        note: "Wołyń — Волынь"
    words: { "dwadzieścia": dwadziescia, "zachodzie": zachod, "Zabezpieczony": zabezpieczyc, "wschód": wschod, "południowy": poludniowy, "kraina": kraina, "szlaki": szlak, "handlowe": handlowy, "władca": wladca, "otruty": otruc, "ciągnęła": ciagnac }
  - clean: "Było to wydarzenie o ogromnym znaczeniu dla przyszłości. Po raz pierwszy w granicach królestwa znalazło się wielu prawosławnych Rusinów, a obok nich Ormianie, Żydzi i inne narody. Polska przestała być państwem jednego narodu i jednej wiary. Kazimierz rozumiał, że nowych poddanych nie zdobędzie się siłą. Pozostawił im ich wiarę, cerkwie i zwyczaje, a ruskich bojarów przyjmował do swojej służby. W 1356 roku nadał Lwowowi prawo magdeburskie i miasto szybko stało się jednym z największych ośrodków handlowych w tej części Europy. Przez następne sześćset lat Lwów był jednym z najważniejszych miast polskiej kultury."
    draft: true
    chunks:
      - pl: "Było to wydarzenie o ogromnym znaczeniu dla przyszłości."
        ru: "Это было событие огромного значения для будущего."
      - pl: " Po raz pierwszy w granicach królestwa znalazło się wielu prawosławnych Rusinów, a obok nich Ormianie, Żydzi i inne narody."
        ru: "Впервые в границах королевства оказалось множество православных русинов, а рядом с ними армяне, евреи и другие народы."
        note: "prawosławny — православный; Ormianin — армянин"
      - pl: " Polska przestała być państwem jednego narodu i jednej wiary."
        ru: "Польша перестала быть государством одного народа и одной веры."
      - pl: " Kazimierz rozumiał, że nowych poddanych nie zdobędzie się siłą."
        ru: "Казимир понимал, что новых подданных силой не завоюешь."
      - pl: " Pozostawił im ich wiarę, cerkwie i zwyczaje, a ruskich bojarów przyjmował do swojej służby."
        ru: "Он оставил им их веру, церкви и обычаи, а русских бояр принимал к себе на службу."
        note: "cerkiew — православная церковь"
      - pl: " W 1356 roku nadał Lwowowi prawo magdeburskie i miasto szybko stało się jednym z największych ośrodków handlowych w tej części Europy."
        ru: "В 1356 году он даровал Львову магдебургское право, и город быстро стал одним из крупнейших торговых центров в этой части Европы."
      - pl: " Przez następne sześćset lat Lwów był jednym z najważniejszych miast polskiej kultury."
        ru: "Следующие шестьсот лет Львов был одним из важнейших городов польской культуры."
    words: { "polskiej": polski, "królestwa": krolestwo, "narody": narod, "narodu": narod, "Pozostawił": pozostawic, "zwyczaje": zwyczaj, "przyjmował": przyjmowac, "nadał": nadac, "ośrodków": osrodek, "handlowych": handlowy, "kultury": kultura }
  - clean: "W polityce wewnętrznej Kazimierz był równie skuteczny. Kronikarz Jan Długosz napisał o nim zdanie, które zna każdy polski uczeń: „Zastał Polskę drewnianą, a zostawił murowaną”. To nie była tylko przenośnia. Za jego panowania zbudowano kilkadziesiąt zamków i otoczono murami prawie trzydzieści miast. Szczególnie dużo warowni powstało na Jurze Krakowsko-Częstochowskiej, na wapiennych skałach wzdłuż zachodniej granicy. Ich ruiny, nazywane dziś Szlakiem Orlich Gniazd, należą do najpiękniejszych zabytków Polski."
    draft: true
    chunks:
      - pl: "W polityce wewnętrznej Kazimierz był równie skuteczny."
        ru: "Во внутренней политике Казимир был столь же успешен."
        note: "skuteczny — действенный, успешный"
      - pl: " Kronikarz Jan Długosz napisał o nim zdanie, które zna każdy polski uczeń: „Zastał Polskę drewnianą, a zostawił murowaną”."
        ru: "Летописец Ян Длугош написал о нём фразу, которую знает каждый польский школьник: «Застал Польшу деревянной, а оставил каменной»."
        note: "zastać — застать"
      - pl: " To nie była tylko przenośnia."
        ru: "Это была не просто метафора."
        note: "przenośnia — метафора, иносказание"
      - pl: " Za jego panowania zbudowano kilkadziesiąt zamków i otoczono murami prawie trzydzieści miast."
        ru: "В его правление было построено несколько десятков замков и почти тридцать городов обнесено стенами."
      - pl: " Szczególnie dużo warowni powstało na Jurze Krakowsko-Częstochowskiej, na wapiennych skałach wzdłuż zachodniej granicy."
        ru: "Особенно много крепостей возникло на Краковско-Ченстоховской Юре, на известняковых скалах вдоль западной границы."
        note: "warownia — крепость; wapienny — известняковый"
      - pl: " Ich ruiny, nazywane dziś Szlakiem Orlich Gniazd, należą do najpiękniejszych zabytków Polski."
        ru: "Их руины, называемые сегодня Тропой орлиных гнёзд, принадлежат к красивейшим памятникам Польши."
        note: "zabytek — памятник (старины)"
