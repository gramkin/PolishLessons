  - clean: "Psycholog ocknął się z osłupienia i nagle zajrzał pod stolik. Na to Podróżnik w Czasie roześmiał się wesoło. — No i? — powiedział, przedrzeźniając Psychologa. Potem wstał, podszedł do słoja z tytoniem na gzymsie kominka i plecami do nas zaczął nabijać fajkę."
    en: "The Psychologist recovered from his stupor, and suddenly looked under the table. At that the Time Traveller laughed cheerfully. “Well?” he said, with a reminiscence of the Psychologist. Then, getting up, he went to the tobacco jar on the mantel, and with his back to us began to fill his pipe."
    draft: true
