paragraphs:
  - clean: "Przedmiot, który Podróżnik w Czasie trzymał w ręku, był lśniącą metalową konstrukcją, niewiele większą od małego zegara i bardzo misternie wykonaną. Była w niej kość słoniowa i jakaś przezroczysta, krystaliczna substancja. A teraz muszę mówić dokładnie, bo to, co nastąpiło, jest — o ile nie przyjmiemy jego wyjaśnienia — rzeczą absolutnie niewytłumaczalną. Wziął jeden z małych ośmiokątnych stolików rozstawionych po pokoju i postawił go przed kominkiem, dwiema nogami na dywaniku przy palenisku."
    en: "The thing the Time Traveller held in his hand was a glittering metallic framework, scarcely larger than a small clock, and very delicately made. There was ivory in it, and some transparent crystalline substance. And now I must be explicit, for this that follows—unless his explanation is to be accepted—is an absolutely unaccountable thing. He took one of the small octagonal tables that were scattered about the room, and set it in front of the fire, with two legs on the hearthrug."
    draft: true
    chunks:
      - pl: "Przedmiot, który Podróżnik w Czasie trzymał w ręku, był lśniącą metalową konstrukcją, niewiele większą od małego zegara i bardzo misternie wykonaną."
        ru: "Предмет, который Путешественник во Времени держал в руке, был блестящим металлическим каркасом, едва ли больше маленьких часов и очень тонкой работы."
        note: "misterny — искусный, тонкой работы"
      - pl: " Była w niej kość słoniowa i jakaś przezroczysta, krystaliczna substancja."
        ru: "В нём была слоновая кость и какое-то прозрачное кристаллическое вещество."
        note: "kość słoniowa — слоновая кость"
      - pl: " A teraz muszę mówić dokładnie, bo to, co nastąpiło, jest — o ile nie przyjmiemy jego wyjaśnienia — rzeczą absolutnie niewytłumaczalną."
        ru: "А теперь я должен говорить точно, ибо то, что последовало, — если не принять его объяснения, — вещь совершенно необъяснимая."
        note: "niewytłumaczalny — необъяснимый"
      - pl: " Wziął jeden z małych ośmiokątnych stolików rozstawionych po pokoju"
        ru: "Он взял один из маленьких восьмиугольных столиков, расставленных по комнате,"
        note: "ośmiokątny — восьмиугольный"
      - pl: " i postawił go przed kominkiem, dwiema nogami na dywaniku przy palenisku."
        ru: "и поставил его перед камином, двумя ножками на коврике у очага."
        note: "palenisko — очаг"
    words: { "Przedmiot": przedmiot, "metalową": metalowy, "zegara": zegar, "substancja": substancja, "stolików": stolik, "kominkiem": kominek }
  - clean: "Na tym stoliku umieścił mechanizm. Potem przysunął krzesło i usiadł. Jedynym innym przedmiotem na stoliku była mała lampka z abażurem, której jasne światło padało prosto na model. Wokół paliło się też może z tuzin świec, dwie w mosiężnych lichtarzach na gzymsie kominka i kilka w kinkietach, tak że pokój był rzęsiście oświetlony. Siedziałem w niskim fotelu najbliżej ognia i przysunąłem go tak, że znalazłem się niemal między Podróżnikiem w Czasie a kominkiem."
    en: "On this table he placed the mechanism. Then he drew up a chair, and sat down. The only other object on the table was a small shaded lamp, the bright light of which fell full upon the model. There were also perhaps a dozen candles about, two in brass candlesticks upon the mantel and several in sconces, so that the room was brilliantly illuminated. I sat in a low arm-chair nearest the fire, and I drew this forward so as to be almost between the Time Traveller and the fireplace."
    draft: true
    chunks:
      - pl: "Na tym stoliku umieścił mechanizm."
        ru: "На этот столик он поместил механизм."
      - pl: " Potem przysunął krzesło i usiadł."
        ru: "Потом придвинул стул и сел."
      - pl: " Jedynym innym przedmiotem na stoliku była mała lampka z abażurem, której jasne światło padało prosto na model."
        ru: "Единственным другим предметом на столике была маленькая лампа под абажуром, яркий свет которой падал прямо на модель."
      - pl: " Wokół paliło się też może z tuzin świec, dwie w mosiężnych lichtarzach na gzymsie kominka i kilka w kinkietach,"
        ru: "Вокруг горело ещё, пожалуй, с дюжину свечей — две в латунных подсвечниках на каминной полке и несколько в настенных бра,"
        note: "mosiężny — латунный; lichtarz — подсвечник; gzyms kominka — каминная полка"
      - pl: " tak że pokój był rzęsiście oświetlony."
        ru: "так что комната была ярко освещена."
        note: "rzęsiście — ярко, обильно (о свете)"
      - pl: " Siedziałem w niskim fotelu najbliżej ognia i przysunąłem go tak, że znalazłem się niemal między Podróżnikiem w Czasie a kominkiem."
        ru: "Я сидел в низком кресле ближе всех к огню и придвинул его так, что оказался почти между Путешественником во Времени и камином."
    words: { "przedmiotem": przedmiot, "lampka": lampka, "tuzin": tuzin, "świec": swieca, "kominka": kominek, "fotelu": fotel }
  - clean: "Filby siedział za nim, zaglądając mu przez ramię. Lekarz i Burmistrz z Prowincji obserwowali go z profilu z prawej strony, Psycholog z lewej. Bardzo Młody Człowiek stał za Psychologiem. Wszyscy byliśmy czujni. Wydaje mi się nie do wiary, by w tych warunkach można było spłatać nam jakąkolwiek sztuczkę, choćby najsubtelniej obmyśloną i najzręczniej wykonaną."
    en: "Filby sat behind him, looking over his shoulder. The Medical Man and the Provincial Mayor watched him in profile from the right, the Psychologist from the left. The Very Young Man stood behind the Psychologist. We were all on the alert. It appears incredible to me that any kind of trick, however subtly conceived and however adroitly done, could have been played upon us under these conditions."
    draft: true
    chunks:
      - pl: "Filby siedział za nim, zaglądając mu przez ramię."
        ru: "Филби сидел позади него, заглядывая ему через плечо."
      - pl: " Lekarz i Burmistrz z Prowincji obserwowali go z profilu z prawej strony, Psycholog z lewej."
        ru: "Врач и Провинциальный Мэр наблюдали за ним в профиль справа, Психолог — слева."
      - pl: " Bardzo Młody Człowiek stał za Psychologiem."
        ru: "Очень Молодой Человек стоял за Психологом."
      - pl: " Wszyscy byliśmy czujni."
        ru: "Все мы были настороже."
        note: "czujny — бдительный, настороже"
      - pl: " Wydaje mi się nie do wiary, by w tych warunkach można było spłatać nam jakąkolwiek sztuczkę,"
        ru: "Мне кажется невероятным, чтобы в таких условиях с нами можно было сыграть какую-либо шутку,"
        note: "spłatać figla — сыграть шутку"
      - pl: " choćby najsubtelniej obmyśloną i najzręczniej wykonaną."
        ru: "как бы тонко она ни была задумана и как бы ловко ни исполнена."
        note: "obmyślić — продумать, задумать"
    words: { "Burmistrz": burmistrz, "profilu": profil, "Psycholog": psycholog, "warunkach": warunek, "jakąkolwiek": jakikolwiek, "sztuczkę": sztuczka }
  - clean: "Podróżnik w Czasie spojrzał na nas, a potem na mechanizm. — No i? — powiedział Psycholog."
    en: "The Time Traveller looked at us, and then at the mechanism. “Well?” said the Psychologist."
    draft: true
    chunks:
      - pl: "Podróżnik w Czasie spojrzał na nas, a potem na mechanizm."
        ru: "Путешественник во Времени посмотрел на нас, а потом на механизм."
      - pl: " — No i? — powiedział Psycholog."
        ru: "— Ну и? — сказал Психолог."
    words: { "Czasie": czas, "spojrzał": spojrzec, "powiedział": powiedziec, "Psycholog": psycholog }
  - clean: "— Ta drobna rzecz — rzekł Podróżnik w Czasie, opierając łokcie na stole i składając dłonie nad aparatem — to tylko model. To mój projekt maszyny do podróży w czasie. Zauważycie, że wygląda dziwnie krzywo i że ten pręt jakoś osobliwie migocze, jak gdyby był w pewien sposób nierzeczywisty. Wskazał palcem tę część. — A tu jest mała biała dźwignia, i tu druga."
    en: "“This little affair,” said the Time Traveller, resting his elbows upon the table and pressing his hands together above the apparatus, “is only a model. It is my plan for a machine to travel through time. You will notice that it looks singularly askew, and that there is an odd twinkling appearance about this bar, as though it was in some way unreal.” He pointed to the part with his finger. “Also, here is one little white lever, and here is another.”"
    draft: true
    chunks:
      - pl: "— Ta drobna rzecz — rzekł Podróżnik w Czasie, opierając łokcie na stole i składając dłonie nad aparatem — to tylko model."
        ru: "— Эта вещица, — сказал Путешественник во Времени, опершись локтями о стол и сложив ладони над аппаратом, — всего лишь модель."
        note: "łokieć — локоть"
      - pl: " To mój projekt maszyny do podróży w czasie."
        ru: "Это мой проект машины для путешествий во времени."
      - pl: " Zauważycie, że wygląda dziwnie krzywo i że ten pręt jakoś osobliwie migocze, jak gdyby był w pewien sposób nierzeczywisty."
        ru: "Вы заметите, что она выглядит странно перекошенной и что этот стержень как-то необычно мерцает, будто он в каком-то смысле нереален."
        note: "pręt — стержень, прут; migotać — мерцать"
