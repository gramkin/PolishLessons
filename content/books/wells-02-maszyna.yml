  - clean: "Nastąpiła może minuta przerwy. Psycholog zdawał się chcieć coś do mnie powiedzieć, ale się rozmyślił. Wtedy Podróżnik w Czasie wyciągnął palec ku dźwigni. — Nie — powiedział nagle. — Daj mi rękę. I zwróciwszy się do Psychologa, ujął jego dłoń w swoją i kazał mu wysunąć palec wskazujący. Tak więc to sam Psycholog wysłał model Wehikułu Czasu w jego nieskończoną podróż."
    en: "There was a minute’s pause perhaps. The Psychologist seemed about to speak to me, but changed his mind. Then the Time Traveller put forth his finger towards the lever. “No,” he said suddenly. “Lend me your hand.” And turning to the Psychologist, he took that individual’s hand in his own and told him to put out his forefinger. So that it was the Psychologist himself who sent forth the model Time Machine on its interminable voyage."
    draft: true
    chunks:
      - pl: "Nastąpiła może minuta przerwy."
        ru: "Наступила, пожалуй, минутная пауза."
      - pl: " Psycholog zdawał się chcieć coś do mnie powiedzieć, ale się rozmyślił."
        ru: "Психолог, казалось, хотел что-то мне сказать, но передумал."
        note: "rozmyślić się — передумать"
      - pl: " Wtedy Podróżnik w Czasie wyciągnął palec ku dźwigni."
        ru: "Тогда Путешественник во Времени протянул палец к рычагу."
      - pl: " — Nie — powiedział nagle. — Daj mi rękę."
        ru: "— Нет, — сказал он вдруг. — Дай мне руку."
      - pl: " I zwróciwszy się do Psychologa, ujął jego dłoń w swoją i kazał mu wysunąć palec wskazujący."
        ru: "И, повернувшись к Психологу, взял его руку в свою и велел ему выставить указательный палец."
        note: "ująć — взять"
      - pl: " Tak więc to sam Psycholog wysłał model Wehikułu Czasu w jego nieskończoną podróż."
        ru: "Так что именно сам Психолог отправил модель Машины Времени в её бесконечное путешествие."
        note: "wehikuł — (книжн., шутл.) повозка, экипаж; WEHIKUŁ CZASU — так по-польски зовут машину времени"
    words: { "Nastąpiła": nastapic, "przerwy": przerwa, "Psycholog": psycholog, "ujął": ujac, "wskazujący": wskazywac, "model": model }
  - clean: "Wszyscy widzieliśmy, jak dźwignia się obraca. Jestem absolutnie pewien, że nie było w tym żadnego oszustwa. Powiał wiatr i płomień lampy podskoczył. Jedna ze świec na gzymsie zgasła, a mała maszyna nagle się obróciła, zatarła się, przez sekundę może widać ją było jak widmo, jak wir słabo połyskującego mosiądzu i kości słoniowej; i już jej nie było — znikła! Poza lampą stolik był pusty."
    en: "We all saw the lever turn. I am absolutely certain there was no trickery. There was a breath of wind, and the lamp flame jumped. One of the candles on the mantel was blown out, and the little machine suddenly swung round, became indistinct, was seen as a ghost for a second perhaps, as an eddy of faintly glittering brass and ivory; and it was gone—vanished! Save for the lamp the table was bare."
    draft: true
