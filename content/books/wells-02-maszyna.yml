  - clean: "— Robiłem to dwa lata — odparł Podróżnik w Czasie. Potem, gdy wszyscy powtórzyliśmy ruch Lekarza, powiedział: — Chcę teraz, żebyście dobrze zrozumieli: ta dźwignia, gdy się ją naciśnie, posyła maszynę płynnym ruchem w przyszłość, a ta druga odwraca ruch. To siodełko przedstawia siedzenie podróżnika w czasie. Zaraz nacisnę dźwignię i maszyna ruszy. Zniknie, przejdzie w przyszły Czas i przepadnie. Przyjrzyjcie się jej dobrze. Obejrzyjcie też stolik i upewnijcie się, że nie ma tu żadnego oszustwa. Nie chcę zmarnować tego modelu, a potem usłyszeć, że jestem szarlatanem."
    en: "“It took two years to make,” retorted the Time Traveller. Then, when we had all imitated the action of the Medical Man, he said: “Now I want you clearly to understand that this lever, being pressed over, sends the machine gliding into the future, and this other reverses the motion. This saddle represents the seat of a time traveller. Presently I am going to press the lever, and off the machine will go. It will vanish, pass into future Time, and disappear. Have a good look at the thing. Look at the table too, and satisfy yourselves there is no trickery. I don’t want to waste this model, and then be told I’m a quack.”"
    draft: true
    chunks:
      - pl: "— Robiłem to dwa lata — odparł Podróżnik w Czasie."
        ru: "— Я делал её два года, — ответил Путешественник во Времени."
