  - clean: "Kwiatkowski był także autorem drugiego wielkiego projektu, Centralnego Okręgu Przemysłowego. Od 1936 roku w widłach Wisły i Sanu budowano fabryki, huty i elektrownie. Wybrano to miejsce, bo leżało daleko od granic z Niemcami i Związkiem Radzieckim, a w okolicy było wielu ludzi szukających pracy. W lesie nad Sanem w ciągu kilku lat powstało zupełnie nowe miasto przemysłowe, Stalowa Wola, z hutą i fabryką broni. Budowano też fabryki samolotów, silników i opon."
    draft: true
    chunks:
      - pl: "Kwiatkowski był także autorem drugiego wielkiego projektu, Centralnego Okręgu Przemysłowego."
        ru: "Квятковский был также автором второго большого проекта — Центрального промышленного района."
      - pl: " Od 1936 roku w widłach Wisły i Sanu budowano fabryki, huty i elektrownie."
        ru: "С 1936 года в междуречье Вислы и Сана строили фабрики, металлургические заводы и электростанции."
        note: "widły rzek — междуречье, место слияния"
      - pl: " Wybrano to miejsce, bo leżało daleko od granic z Niemcami i Związkiem Radzieckim, a w okolicy było wielu ludzi szukających pracy."
        ru: "Это место выбрали, потому что оно лежало далеко от границ с Германией и Советским Союзом, а в округе было много людей, искавших работу."
      - pl: " W lesie nad Sanem w ciągu kilku lat powstało zupełnie nowe miasto przemysłowe, Stalowa Wola, z hutą i fabryką broni."
        ru: "В лесу на Сане за несколько лет вырос совершенно новый промышленный город — Стальова-Воля, с металлургическим заводом и оружейной фабрикой."
      - pl: " Budowano też fabryki samolotów, silników i opon."
        ru: "Строили также заводы самолётов, двигателей и шин."
        note: "opona — шина"
    words: { "autorem": autor, "budowano": budowac, "fabryki": fabryka, "powstało": powstac, "fabryką": fabryka, "silników": silnik, "opon": opona }
  - clean: "Centralny Okręg Przemysłowy miał wzmocnić armię przed nadchodzącą wojną i dać pracę mieszkańcom przeludnionej wsi. Wojna przerwała prace, zanim większość zakładów zaczęła pełną produkcję. Wcześniej zbudowano magistralę węglową, linię kolejową, która łączyła Śląsk z Gdynią i pozwalała wywozić węgiel przez polski port. Kraj rozwijał się szybko, ale wciąż znacznie wolniej niż państwa Zachodu, a dochody przeciętnego Polaka były kilka razy niższe niż Anglika czy Francuza."
    draft: true
    chunks:
      - pl: "Centralny Okręg Przemysłowy miał wzmocnić armię przed nadchodzącą wojną i dać pracę mieszkańcom przeludnionej wsi."
        ru: "Центральный промышленный район должен был укрепить армию перед надвигающейся войной и дать работу жителям перенаселённой деревни."
        note: "przeludniony — перенаселённый"
      - pl: " Wojna przerwała prace, zanim większość zakładów zaczęła pełną produkcję."
        ru: "Война прервала работы прежде, чем большинство предприятий начали работать в полную силу."
      - pl: " Wcześniej zbudowano magistralę węglową, linię kolejową, która łączyła Śląsk z Gdynią i pozwalała wywozić węgiel przez polski port."
        ru: "Ранее была построена угольная магистраль — железная дорога, которая связывала Силезию с Гдыней и позволяла вывозить уголь через польский порт."
        note: "magistrala — магистраль"
      - pl: " Kraj rozwijał się szybko, ale wciąż znacznie wolniej niż państwa Zachodu, a dochody przeciętnego Polaka były kilka razy niższe niż Anglika czy Francuza."
        ru: "Страна развивалась быстро, но всё же значительно медленнее западных государств, а доходы среднего поляка были в несколько раз ниже, чем у англичанина или француза."
