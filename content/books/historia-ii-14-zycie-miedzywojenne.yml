chapter: 14
chapterTitle: "Życie międzywojenne"
chapterTitleRu: "Межвоенная жизнь"
level: B2
paragraphs:
  - clean: "Polska międzywojenna była krajem przede wszystkim rolniczym. Ponad sześćdziesiąt procent ludzi żyło z pracy na roli, a w wielu wsiach na wschodzie życie niewiele różniło się od tego sprzed stu lat. Chłopi orali pole końmi, oświetlali domy lampami naftowymi, a do najbliższego lekarza mieli często kilkadziesiąt kilometrów. Elektryczność, radio i kino były dla nich czymś odległym i niemal cudownym."
    draft: true
    chunks:
      - pl: "Polska międzywojenna była krajem przede wszystkim rolniczym."
        ru: "Межвоенная Польша была прежде всего аграрной страной."
      - pl: " Ponad sześćdziesiąt procent ludzi żyło z pracy na roli, a w wielu wsiach na wschodzie życie niewiele różniło się od tego sprzed stu lat."
        ru: "Больше шестидесяти процентов людей жили трудом на земле, а во многих деревнях на востоке жизнь мало отличалась от той, что была сто лет назад."
        note: "rola — пашня"
      - pl: " Chłopi orali pole końmi, oświetlali domy lampami naftowymi, a do najbliższego lekarza mieli często kilkadziesiąt kilometrów."
        ru: "Крестьяне пахали поле на лошадях, освещали дома керосиновыми лампами, а до ближайшего врача им часто было несколько десятков километров."
      - pl: " Elektryczność, radio i kino były dla nich czymś odległym i niemal cudownym."
        ru: "Электричество, радио и кино были для них чем-то далёким и почти чудесным."
    words: { "procent": procent, "wsiach": wies, "wschodzie": wschod, "sprzed": sprzed, "Chłopi": chlop, "lampami": lampa, "kilometrów": kilometr, "radio": radio, "kino": kino, "odległym": odlegly, "niemal": niemal }
  - clean: "Jednocześnie szybko rosły miasta. Warszawa liczyła w 1939 roku ponad milion trzysta tysięcy mieszkańców i była jednym z największych miast Europy Środkowej. Powstawały tam nowoczesne dzielnice, takie jak Żoliborz i Saska Kępa, z willami i spółdzielczymi domami w stylu modernistycznym. W 1934 roku oddano do użytku Prudential, jeden z najwyższych budynków w Europie, który miał szesnaście pięter. Obok eleganckich ulic istniały jednak dzielnice biedy, gdzie całe rodziny mieszkały w jednej izbie, bez wody i kanalizacji. Kontrast między bogactwem i nędzą był w Polsce bardzo wyraźny."
    draft: true
    chunks:
      - pl: "Jednocześnie szybko rosły miasta."
        ru: "Одновременно быстро росли города."
      - pl: " Warszawa liczyła w 1939 roku ponad milion trzysta tysięcy mieszkańców i była jednym z największych miast Europy Środkowej."
        ru: "Варшава насчитывала в 1939 году больше миллиона трёхсот тысяч жителей и была одним из крупнейших городов Центральной Европы."
      - pl: " Powstawały tam nowoczesne dzielnice, takie jak Żoliborz i Saska Kępa, z willami i spółdzielczymi domami w stylu modernistycznym."
        ru: "Там возникали современные районы, такие как Жолибож и Саска-Кемпа, с виллами и кооперативными домами в модернистском стиле."
        note: "spółdzielczy — кооперативный"
      - pl: " W 1934 roku oddano do użytku Prudential, jeden z najwyższych budynków w Europie, który miał szesnaście pięter."
        ru: "В 1934 году был сдан «Пруденшл», одно из самых высоких зданий в Европе, в котором было шестнадцать этажей."
        note: "piętro — этаж"
      - pl: " Obok eleganckich ulic istniały jednak dzielnice biedy, gdzie całe rodziny mieszkały w jednej izbie, bez wody i kanalizacji."
        ru: "Однако рядом с элегантными улицами существовали кварталы бедноты, где целые семьи жили в одной комнате, без воды и канализации."
        note: "izba — комната, изба"
      - pl: " Kontrast między bogactwem i nędzą był w Polsce bardzo wyraźny."
        ru: "Контраст между богатством и нищетой был в Польше очень заметен."
