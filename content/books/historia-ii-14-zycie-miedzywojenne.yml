  - clean: "Rozwijało się także szkolnictwo wyższe. Obok starych uniwersytetów w Krakowie i Lwowie powstały nowe w Warszawie, Wilnie, Poznaniu i Lublinie, gdzie działał Katolicki Uniwersytet Lubelski. Ukończenie gimnazjum i zdanie matury otwierało drogę do lepszego życia, ale nauka w gimnazjum była płatna i dla dzieci chłopskich często niedostępna. Uczniowie gimnazjów nosili mundurki i czapki z daszkiem, a na rękawie mieli tarczę z numerem szkoły. Dzięki temu nauczyciele mogli łatwo rozpoznać ucznia, który wieczorem chodził do kina bez pozwolenia. Ogromną rolę w oświacie dorosłych odgrywały uniwersytety ludowe, czytelnie i kółka rolnicze, w których chłopi uczyli się nowoczesnych metod uprawy, rachunków i historii. Dla wielu młodych ludzi ze wsi była to jedyna szansa na zdobycie wiedzy."
    draft: true
    chunks:
      - pl: "Rozwijało się także szkolnictwo wyższe."
        ru: "Развивалось и высшее образование."
      - pl: " Obok starych uniwersytetów w Krakowie i Lwowie powstały nowe w Warszawie, Wilnie, Poznaniu i Lublinie, gdzie działał Katolicki Uniwersytet Lubelski."
        ru: "Помимо старых университетов в Кракове и Львове, появились новые в Варшаве, Вильно, Познани и Люблине, где действовал Католический Люблинский университет."
      - pl: " Ukończenie gimnazjum i zdanie matury otwierało drogę do lepszego życia, ale nauka w gimnazjum była płatna i dla dzieci chłopskich często niedostępna."
        ru: "Окончание гимназии и сдача выпускных экзаменов открывали дорогу к лучшей жизни, но обучение в гимназии было платным и для крестьянских детей часто недоступным."
        note: "matura — выпускные экзамены"
      - pl: " Uczniowie gimnazjów nosili mundurki i czapki z daszkiem, a na rękawie mieli tarczę z numerem szkoły."
        ru: "Гимназисты носили форменные костюмчики и фуражки, а на рукаве у них был щиток с номером школы."
        note: "tarcza — щиток, нашивка"
      - pl: " Dzięki temu nauczyciele mogli łatwo rozpoznać ucznia, który wieczorem chodził do kina bez pozwolenia."
        ru: "Благодаря этому учителя легко могли узнать ученика, который вечером ходил в кино без разрешения."
      - pl: " Ogromną rolę w oświacie dorosłych odgrywały uniwersytety ludowe, czytelnie i kółka rolnicze, w których chłopi uczyli się nowoczesnych metod uprawy, rachunków i historii."
        ru: "Огромную роль в образовании взрослых играли народные университеты, читальни и сельскохозяйственные кружки, в которых крестьяне учились современным методам земледелия, счёту и истории."
        note: "oświata — просвещение"
      - pl: " Dla wielu młodych ludzi ze wsi była to jedyna szansa na zdobycie wiedzy."
