  - clean: "Ogromnym zadaniem było zbudowanie wspólnego systemu szkolnego. W 1921 roku jedna trzecia dorosłych Polaków nie umiała czytać ani pisać, a na wschodzie odsetek analfabetów był jeszcze znacznie wyższy. Państwo wprowadziło obowiązek nauki dla wszystkich dzieci od siódmego roku życia i budowało tysiące nowych szkół. Na wsi uczyli często młodzi nauczyciele, którzy traktowali swoją pracę jak misję i zakładali przy szkołach biblioteki i chóry. Do 1931 roku odsetek analfabetów spadł do mniej więcej jednej czwartej."
    draft: true
    chunks:
      - pl: "Ogromnym zadaniem było zbudowanie wspólnego systemu szkolnego."
        ru: "Огромной задачей было создание общей школьной системы."
      - pl: " W 1921 roku jedna trzecia dorosłych Polaków nie umiała czytać ani pisać, a na wschodzie odsetek analfabetów był jeszcze znacznie wyższy."
        ru: "В 1921 году треть взрослых поляков не умела читать и писать, а на востоке доля неграмотных была ещё значительно выше."
        note: "odsetek — доля, процент"
      - pl: " Państwo wprowadziło obowiązek nauki dla wszystkich dzieci od siódmego roku życia i budowało tysiące nowych szkół."
        ru: "Государство ввело обязательное обучение для всех детей с семи лет и строило тысячи новых школ."
      - pl: " Na wsi uczyli często młodzi nauczyciele, którzy traktowali swoją pracę jak misję i zakładali przy szkołach biblioteki i chóry."
        ru: "В деревне часто преподавали молодые учителя, которые относились к своей работе как к миссии и создавали при школах библиотеки и хоры."
      - pl: " Do 1931 roku odsetek analfabetów spadł do mniej więcej jednej czwartej."
        ru: "К 1931 году доля неграмотных снизилась примерно до четверти."
