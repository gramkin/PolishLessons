  - clean: "Największym osiągnięciem gospodarczym Drugiej Rzeczypospolitej była budowa Gdyni. Na początku lat dwudziestych była to mała wieś rybacka, w której mieszkało kilkaset osób. Polska potrzebowała jednak portu niezależnego od Gdańska i postanowiła zbudować go od podstaw. Budową kierował inżynier Tadeusz Wenda, a jej najważniejszym zwolennikiem był minister przemysłu i handlu Eugeniusz Kwiatkowski. Już w latach trzydziestych Gdynia była jednym z największych i najnowocześniejszych portów nad Bałtykiem."
    draft: true
    chunks:
      - pl: "Największym osiągnięciem gospodarczym Drugiej Rzeczypospolitej była budowa Gdyni."
        ru: "Крупнейшим экономическим достижением Второй Речи Посполитой было строительство Гдыни."
      - pl: " Na początku lat dwudziestych była to mała wieś rybacka, w której mieszkało kilkaset osób."
        ru: "В начале двадцатых годов это была маленькая рыбацкая деревня, в которой жили несколько сотен человек."
      - pl: " Polska potrzebowała jednak portu niezależnego od Gdańska i postanowiła zbudować go od podstaw."
        ru: "Однако Польше был нужен порт, независимый от Гданьска, и она решила построить его с нуля."
      - pl: " Budową kierował inżynier Tadeusz Wenda, a jej najważniejszym zwolennikiem był minister przemysłu i handlu Eugeniusz Kwiatkowski."
        ru: "Строительством руководил инженер Тадеуш Венда, а его главным сторонником был министр промышленности и торговли Эугениуш Квятковский."
      - pl: " Już w latach trzydziestych Gdynia była jednym z największych i najnowocześniejszych portów nad Bałtykiem."
        ru: "Уже в тридцатые годы Гдыня была одним из крупнейших и самых современных портов на Балтике."
    words: { "budowa": budowa, "wieś": wies, "portu": port, "niezależnego": niezalezny, "Budową": budowa, "kierował": kierowac, "inżynier": inzynier, "minister": minister, "przemysłu": przemysl, "handlu": handel, "najnowocześniejszych": nowoczesny, "portów": port }
  - clean: "Wokół portu w kilkanaście lat wyrosło miasto, które w 1939 roku liczyło ponad sto dwadzieścia tysięcy mieszkańców. Przyjeżdżali tu ludzie ze wszystkich stron Polski w poszukiwaniu pracy i lepszego życia. Białe modernistyczne kamienice Gdyni, z zaokrąglonymi balkonami przypominającymi statki, do dziś zachwycają architektów. Gdynia stała się symbolem nowoczesnej Polski i jej otwarcia na świat. Z jej portu wypływały statki pasażerskie do Ameryki, a polskie dzieci zbierały pieniądze na budowę floty. Żaglowiec szkolny „Dar Pomorza”, kupiony za pieniądze zebrane przez mieszkańców Pomorza, opłynął potem cały świat."
    draft: true
    chunks:
      - pl: "Wokół portu w kilkanaście lat wyrosło miasto, które w 1939 roku liczyło ponad sto dwadzieścia tysięcy mieszkańców."
        ru: "Вокруг порта за полтора десятка лет вырос город, который в 1939 году насчитывал больше ста двадцати тысяч жителей."
      - pl: " Przyjeżdżali tu ludzie ze wszystkich stron Polski w poszukiwaniu pracy i lepszego życia."
        ru: "Сюда приезжали люди со всех концов Польши в поисках работы и лучшей жизни."
      - pl: " Białe modernistyczne kamienice Gdyni, z zaokrąglonymi balkonami przypominającymi statki, do dziś zachwycają architektów."
        ru: "Белые модернистские дома Гдыни с закруглёнными балконами, напоминающими корабли, до сих пор восхищают архитекторов."
        note: "zaokrąglony — закруглённый"
      - pl: " Gdynia stała się symbolem nowoczesnej Polski i jej otwarcia na świat."
        ru: "Гдыня стала символом современной Польши и её открытости миру."
      - pl: " Z jej portu wypływały statki pasażerskie do Ameryki, a polskie dzieci zbierały pieniądze na budowę floty."
        ru: "Из её порта отправлялись пассажирские суда в Америку, а польские дети собирали деньги на строительство флота."
      - pl: " Żaglowiec szkolny „Dar Pomorza”, kupiony za pieniądze zebrane przez mieszkańców Pomorza, opłynął potem cały świat."
        ru: "Учебный парусник «Дар Поморья», купленный на деньги, собранные жителями Поморья, позже обошёл весь мир."
        note: "żaglowiec — парусник"
