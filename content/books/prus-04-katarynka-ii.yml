# review
title: Nowele
titleRu: Новеллы
author: Bolesław Prus
source:
  name: "Wolne Lektury (Bolesław Prus, «Nowele wybrane», PIW 1976)"
  url: https://wolnelektury.pl/katalog/lektura/katarynka/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 4
chapterTitle: "Katarynka (II)"
chapterTitleRu: "Шарманка (II)"
level: B2
paragraphs:
  - clean: "Ale wzrok jej nie wracał."
    chunks:
      - pl: "Ale wzrok jej nie wracał."
        ru: "Но зрение к ней не возвращалось."
        note: "wzrok — зрение (не «взор»); wzrok jej — притяжательный родительный: её зрение"
    words: { "wzrok": wzrok, "wracał": wracac, "Ale": ale }
  - clean: "Jednego razu mówiła:"
    chunks:
      - pl: "Jednego razu mówiła:"
        ru: "Однажды она говорила:"
        note: "jednego razu — книжное «однажды»; сегодня чаще pewnego razu или raz"
    words: { "Jednego": jeden, "razu": raz, "mówiła": mowic }
  - clean: "— Prawda, mamo, że ja mam niebieską sukienkę?…"
    chunks:
      - pl: "— Prawda, mamo, że ja mam niebieską sukienkę?…"
        ru: "— Правда, мама, что у меня голубое платьице?…"
        note: "mamo — звательный от mama; mieć coś — «у меня есть»; niebieski — голубой/синий"
    words: { "Prawda": prawda, "mamo": mama, "mam": miec, "niebieską": niebieski, "sukienkę": sukienka }
  - clean: "— Nie, dziecko, masz popielatą."
    chunks:
      - pl: "— Nie, dziecko, masz popielatą."
        ru: "— Нет, дитя, у тебя пепельно-серое."
        note: "popielaty — пепельный, серый (от popiół — пепел)"
    words: { "dziecko": dziecko, "masz": miec }
  - clean: "— Mama ją widzi?"
    chunks:
      - pl: "— Mama ją widzi?"
        ru: "— Мама его видит?"
        note: "обращение к матери в третьем лице (mama widzi) — старая вежливая форма; ją — винительный от ona (sukienka); по-русски «его», потому что «платьице» среднего рода"
    words: { "Mama": mama, "widzi": widziec }
  - clean: "— Widzę, moje kochanie."
    chunks:
      - pl: "— Widzę, moje kochanie."
        ru: "— Вижу, моя любимая."
        note: "moje kochanie — «моя дорогая», ласковое обращение (среднего рода)"
    words: { "Widzę": widziec, "moje": moj }
  - clean: "— Tak jak i w dzień?"
    chunks:
      - pl: "— Tak jak i w dzień?"
        ru: "— Так же, как и днём?"
        note: "w dzień — днём"
    words: { "dzień": dzien, "jak": jak }
  - clean: "— Tak."
    chunks:
      - pl: "— Tak."
        ru: "— Да."
  - clean: "— Ja także będę widziała wszystko za kilka dni?…. Nie, może za miesiąc…"
    chunks:
      - pl: "— Ja także będę widziała wszystko"
        ru: "— Я тоже буду видеть всё"
        note: "będę widziała — будущее несов. вида: być + форма прошедшего (женский род)"
      - pl: " za kilka dni?…."
        ru: "через несколько дней?…"
        note: "za + винительный о времени — «через»: za kilka dni, za miesiąc"
      - pl: " Nie, może za miesiąc…"
        ru: "Нет, может, через месяц…"
    words: { "także": takze, "będę": byc, "widziała": widziec, "kilka": kilka, "miesiąc": miesiac }
  - clean: "Ale ponieważ matka nie odpowiedziała jej nic, więc mówiła dalej:"
    chunks:
      - pl: "Ale ponieważ matka nie odpowiedziała jej nic,"
        ru: "Но так как мать ничего ей не ответила,"
        note: "двойное отрицание: nie… nic — ничего не"
      - pl: " więc mówiła dalej:"
        ru: "то она продолжала говорить:"
        note: "ponieważ…, więc… — «так как…, то…»; сегодня więc после ponieważ звучит избыточно"
    words: { "ponieważ": poniewaz, "matka": matka, "odpowiedziała": odpowiedziec, "więc": wiec, "dalej": dalej }
  - clean: "— Prawda, mamo, że na dworze ciągle jest dzień?… A w ogrodzie są drzewa, tak jak dawniej?… Czy do nas przychodzi ten biały kotek z czarnymi łapami?… Prawda, mamo, że ja widziałam siebie w lustrze?… Nie ma tu lustra?…"
    chunks:
      - pl: "— Prawda, mamo, że na dworze ciągle jest dzień?…"
        ru: "— Правда, мама, что на дворе всё время день?…"
        note: "na dworze — на улице, снаружи; ciągle — постоянно"
      - pl: " A w ogrodzie są drzewa, tak jak dawniej?…"
        ru: "А в саду есть деревья, так же как раньше?…"
        note: "ogród — сад (не «огород»): ложный друг"
      - pl: " Czy do nas przychodzi"
        ru: "Приходит ли к нам"
      - pl: " ten biały kotek z czarnymi łapami?…"
        ru: "тот белый котёнок с чёрными лапками?…"
      - pl: " Prawda, mamo, że ja widziałam siebie w lustrze?…"
        ru: "Правда, мама, что я видела себя в зеркале?…"
      - pl: " Nie ma tu lustra?…"
        ru: "Здесь нет зеркала?…"
        note: "nie ma + родительный — «нет»: nie ma lustra"
    words: { "dworze": dwor, "ciągle": ciagle, "ogrodzie": ogrod, "drzewa": drzewo, "dawniej": dawno, "przychodzi": przychodzic, "łapami": lapa, "lustrze": lustro }
  - clean: "Matka podaje jej lusterko."
    chunks:
      - pl: "Matka podaje jej lusterko."
        ru: "Мать подаёт ей зеркальце."
        note: "настоящее время посреди рассказа в прошедшем — оживляет сцену; lusterko — уменьшительное от lustro"
    words: { "Matka": matka, "podaje": podawac, "jej": "on" }
  - clean: "— Trzeba patrzeć tutaj, o tu, gdzie jest gładkie — mówiła dziewczynka przykładając lustro do twarzy. — Nic nie widzę! — rzekła — Czy i mama nie widzi mnie w lusterku?"
    chunks:
      - pl: "— Trzeba patrzeć tutaj, o tu,"
        ru: "— Надо смотреть сюда, вот сюда,"
        note: "o tu — «вот здесь», o как указательная частица"
      - pl: " gdzie jest gładkie —"
        ru: "где гладко, —"
      - pl: " mówiła dziewczynka przykładając lustro do twarzy."
        ru: "говорила девочка, прикладывая зеркало к лицу."
        note: "przykładać coś do czegoś — прикладывать что-л. к чему-л.; запятой перед деепричастием у Пруса нет"
      - pl: " — Nic nie widzę! — rzekła —"
        ru: "— Ничего не вижу! — сказала она. —"
        note: "rzec, rzekła — книжное «сказать, молвить»; в разговоре powiedziała"
      - pl: " Czy i mama nie widzi mnie w lusterku?"
        ru: "Неужели и мама не видит меня в зеркальце?"
        note: "i — здесь «и, тоже»"
    words: { "Trzeba": trzeba, "patrzeć": patrzec, "gładkie": gladki, "dziewczynka": dziewczynka, "lustro": lustro, "twarzy": twarz, "rzekła": rzec }
  - clean: "— Widzę cię, moja ptaszyno."
    chunks:
      - pl: "— Widzę cię, moja ptaszyno."
        ru: "— Вижу тебя, птичка моя."
        note: "ptaszyna — ласк. «птичка, пташка»; ptaszyno — звательный"
    words: { "Widzę": widziec, "cię": ty, "moja": moj }
  - clean: "— Jakim sposobem?… — zawołała dziewczynka żałośnie. — Przecie jeżeli ja nie widzę siebie, to już w lustrze nie powinno być nic…"
    chunks:
      - pl: "— Jakim sposobem?… — zawołała dziewczynka żałośnie."
        ru: "— Каким образом?… — жалобно воскликнула девочка."
        note: "jakim sposobem — каким образом (творительный); zawołać — воскликнуть, позвать"
      - pl: " — Przecie jeżeli ja nie widzę siebie,"
        ru: "— Ведь если я не вижу себя,"
        note: "przecie — старое и диалектное; сегодня przecież"
      - pl: " to już w lustrze nie powinno być nic…"
        ru: "то в зеркале уже ничего не должно быть…"
        note: "nie powinno być nic — безличное, средний род: «не должно быть ничего»"
    words: { "sposobem": sposob, "zawołała": zawolac, "jeżeli": jezeli, "siebie": siebie, "powinno": powinien }
  - clean: "— A tamta, co jest w lustrze, czy ona mnie widzi, czy nie widzi?…"
    chunks:
      - pl: "— A tamta, co jest w lustrze,"
        ru: "— А та, что в зеркале,"
        note: "co вместо która — разговорное относительное местоимение"
      - pl: " czy ona mnie widzi, czy nie widzi?…"
        ru: "она меня видит или не видит?…"
        note: "czy…, czy… — «ли…, или…»"
    words: { "tamta": tamten, "lustrze": lustro, "widzi": widziec }
  - clean: "Ale matka rozpłakała się i wybiegła z pokoju."
    chunks:
      - pl: "Ale matka rozpłakała się"
        ru: "Но мать расплакалась"
        note: "rozpłakać się — расплакаться (roz- + się: начало и полнота действия)"
      - pl: " i wybiegła z pokoju."
        ru: "и выбежала из комнаты."
        note: "pokój — комната; z + родительный — из"
    words: { "matka": matka, "pokoju": pokoj, "Ale": ale }
  - clean: "Najmilszym zajęciem kaleki było dotykać rękoma drobnych przedmiotów i poznawać je."
    chunks:
      - pl: "Najmilszym zajęciem kaleki było"
        ru: "Самым приятным занятием калеки было"
        note: "kaleka — калека; здесь — слепая девочка; być + творительный: było zajęciem"
      - pl: " dotykać rękoma drobnych przedmiotów"
        ru: "трогать руками мелкие предметы"
        note: "dotykać + родительный: dotykać przedmiotów; rękoma — старая форма двойственного числа, сегодня и rękami"
      - pl: " i poznawać je."
        ru: "и узнавать их."
    words: { "Najmilszym": mily, "zajęciem": zajecie, "dotykać": dotykac, "rękoma": reka, "drobnych": drobny, "przedmiotów": przedmiot, "poznawać": poznawac }
  - clean: "Jednego dnia przyniosła jej matka lalkę porcelanową, ładnie ubraną, za rubla. Dziewczynka nie wypuszczała jej z rąk, dotykała jej noska, ust, oczu, pieściła się nią."
    chunks:
      - pl: "Jednego dnia przyniosła jej matka"
        ru: "Однажды мать принесла ей"
      - pl: " lalkę porcelanową, ładnie ubraną, za rubla."
        ru: "фарфоровую куклу, красиво одетую, за рубль."
        note: "za + винительный о цене; rubla — у ряда неодушевлённых существительных мужского рода (rubel, dolar, papieros, banan) винительный совпадает с родительным: za rubla, zapalić papierosa; в Царстве Польском ходил рубль"
      - pl: " Dziewczynka nie wypuszczała jej z rąk,"
        ru: "Девочка не выпускала её из рук,"
        note: "nie wypuszczać z rąk — не выпускать из рук; при отрицании родительный: jej"
      - pl: " dotykała jej noska, ust, oczu,"
        ru: "трогала её носик, губы, глаза,"
        note: "usta — рот, губы (только мн. ч.); dotykać + родительный"
      - pl: " pieściła się nią."
        ru: "ласкала её."
        note: "pieścić się czymś — устар. «нежно возиться, тешиться чем-л.»: творительный nią"
    words: { "dnia": dzien, "przyniosła": przyniesc, "lalkę": lalka, "ładnie": ladnie, "rąk": reka, "dotykała": dotykac, "ust": usta, "oczu": oko }
  - clean: "Poszła spać bardzo późno, wciąż myśląc o swej lalce, którą ułożyła w pudełku wysłanym watą."
    chunks:
      - pl: "Poszła spać bardzo późno,"
        ru: "Она легла спать очень поздно,"
        note: "iść spać — идти спать, ложиться спать"
      - pl: " wciąż myśląc o swej lalce,"
        ru: "всё время думая о своей кукле,"
        note: "swej — книжная краткая форма от swojej; myśleć o + предложный"
      - pl: " którą ułożyła w pudełku wysłanym watą."
        ru: "которую уложила в коробочку, выстланную ватой."
        note: "wysłany watą — выстланный ватой (от wysłać — выстлать, не «выслать»); ułożyć w czymś — предложный"
    words: { "Poszła": pojsc, "spać": spac, "późno": pozno, "wciąż": wciaz, "myśląc": myslec, "lalce": lalka, "ułożyła": ulozyc, "pudełku": pudelko }
  - clean: "W nocy zbudził matkę szmer i szept. Zerwała się z pościeli, zapaliła świecę i zobaczyła w kąciku swoją córkę, już ubraną i bawiącą się lalką."
    chunks:
      - pl: "W nocy zbudził matkę szmer i szept."
        ru: "Ночью мать разбудил шорох и шёпот."
        note: "порядок слов: подлежащее (szmer i szept) в конце; zbudzić — разбудить, сегодня чаще obudzić"
      - pl: " Zerwała się z pościeli,"
        ru: "Она вскочила с постели,"
        note: "zerwać się — вскочить; pościel — постельное бельё, постель"
      - pl: " zapaliła świecę i zobaczyła w kąciku swoją córkę,"
        ru: "зажгла свечу и увидела в уголке свою дочь,"
        note: "kącik — уменьш. от kąt: уголок"
      - pl: " już ubraną i bawiącą się lalką."
        ru: "уже одетую и играющую с куклой."
        note: "bawić się czymś — играть чем-л./с чем-л.: творительный без предлога"
    words: { "nocy": noc, "szmer": szmer, "Zerwała": zerwac, "zapaliła": zapalic, "świecę": swieca, "zobaczyła": zobaczyc, "córkę": corka, "bawiącą": bawic }
  - clean: "— Co ty robisz, dziecino? — zawołała. — Dlaczego nie śpisz?"
    chunks:
      - pl: "— Co ty robisz, dziecino? —"
        ru: "— Что ты делаешь, деточка? —"
        note: "dziecina — ласк. «дитятко», устар.; dziecino — звательный"
      - pl: " zawołała. — Dlaczego nie śpisz?"
        ru: "воскликнула она. — Почему ты не спишь?"
    words: { "robisz": robic, "zawołała": zawolac, "Dlaczego": dlaczego, "śpisz": spac }
  - clean: "— Bo już przecie jest dzień, proszę mamy — odparła kaleka."
    chunks:
      - pl: "— Bo już przecie jest dzień,"
        ru: "— Так ведь уже день,"
        note: "przecie — устар. przecież"
      - pl: " proszę mamy — odparła kaleka."
        ru: "мамочка, — ответила калека."
        note: "proszę mamy — как proszę pana: почтительное обращение к матери в третьем лице, принятое в XIX веке; odeprzeć, odparła — книжное «возразить, ответить»"
    words: { "proszę": prosic, "mamy": mama, "odparła": odeprzec }
  - clean: "Dla niej dzień i noc zlały się w jedno i trwały zawsze…"
    chunks:
      - pl: "Dla niej dzień i noc zlały się w jedno"
        ru: "Для неё день и ночь слились воедино"
        note: "zlać się w jedno — слиться воедино"
      - pl: " i trwały zawsze…"
        ru: "и длились всегда…"
        note: "trwać — длиться, продолжаться (не «тратить»)"
    words: { "niej": "on", "dzień": dzien, "noc": noc, "trwały": trwac, "zawsze": zawsze }
  - clean: "Stopniowo pamięć wzrokowych wrażeń poczęła zacierać się w dziewczynce. Czerwona wiśnia stała się dla niej wiśnią gładką, okrągłą i miękką, błyszczący pieniądz był twardym i dźwięcznym krążkiem, na którym znajdowały się jakieś znaki w płaskorzeźbie. Wiedziała, że pokój jest większy od niej, dom większy od pokoju, ulica od domu. Ale wszystko to jakoś — skróciło się w jej wyobraźni."
    chunks:
      - pl: "Stopniowo pamięć wzrokowych wrażeń"
        ru: "Постепенно память о зрительных впечатлениях"
        note: "wrażenie — впечатление; pamięć czegoś — память о чём-л.: родительный"
      - pl: " poczęła zacierać się w dziewczynce."
        ru: "начала стираться в девочке."
        note: "poczęła — книжное и устар. «начала» (począć); сегодня zaczęła"
      - pl: " Czerwona wiśnia stała się dla niej"
        ru: "Красная вишня стала для неё"
        note: "stać się kimś/czymś — стать: творительный (wiśnią)"
      - pl: " wiśnią gładką, okrągłą i miękką,"
        ru: "вишней гладкой, круглой и мягкой,"
      - pl: " błyszczący pieniądz był twardym i dźwięcznym krążkiem,"
        ru: "блестящая монета была твёрдым и звонким кружком,"
        note: "pieniądz в ед. ч. — монета; pieniądze — деньги"
      - pl: " na którym znajdowały się jakieś znaki w płaskorzeźbie."
        ru: "на котором были какие-то знаки в рельефе."
        note: "znajdować się — находиться; płaskorzeźba — барельеф"
      - pl: " Wiedziała, że pokój jest większy od niej,"
        ru: "Она знала, что комната больше её,"
        note: "większy od + родительный — больше чем; так же większy niż"
      - pl: " dom większy od pokoju, ulica od domu."
        ru: "дом больше комнаты, улица — дома."
      - pl: " Ale wszystko to jakoś — skróciło się w jej wyobraźni."
        ru: "Но всё это как-то — сократилось в её воображении."
    words: { "pamięć": pamiec, "wrażeń": wrazenie, "poczęła": poczac, "Czerwona": czerwony, "okrągłą": okragly, "miękką": miekki, "pieniądz": pieniadz, "wyobraźni": wyobraznia }
  - clean: "Uwaga jej skierowała się na zmysł dotyku, powonienia i słuchu. Jej twarz i ręce nabrały takiej wrażliwości, że zbliżywszy się do ściany, czuła o kilka cali lekki chłód. Zjawiska odległe oddziaływały na nią tylko przez słuch. Przysłuchiwała się więc po całych dniach."
    chunks:
      - pl: "Uwaga jej skierowała się"
        ru: "Её внимание обратилось"
        note: "uwaga — внимание (не только «осторожно!»)"
      - pl: " na zmysł dotyku, powonienia i słuchu."
        ru: "на чувства осязания, обоняния и слуха."
        note: "zmysł — органы чувств: zmysł dotyku — осязание, powonienie — обоняние"
      - pl: " Jej twarz i ręce nabrały takiej wrażliwości,"
        ru: "Её лицо и руки приобрели такую чувствительность,"
        note: "nabrać czegoś — набраться, приобрести: родительный"
      - pl: " że zbliżywszy się do ściany,"
        ru: "что, приблизившись к стене,"
        note: "zbliżywszy się — деепричастие на -wszy: «приблизившись»; сегодня книжное"
      - pl: " czuła o kilka cali lekki chłód."
        ru: "она за несколько дюймов чувствовала лёгкий холодок."
        note: "cal — дюйм; o kilka cali — на расстоянии нескольких дюймов"
      - pl: " Zjawiska odległe oddziaływały na nią"
        ru: "Далёкие явления действовали на неё"
        note: "oddziaływać na coś — воздействовать на что-л."
      - pl: " tylko przez słuch."
        ru: "только через слух."
