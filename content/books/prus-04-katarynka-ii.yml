  - clean: "Obywatel X w roku 1872 zapisał swemu siostrzeńcowi folwark, a w roku 1875 — synowcowi kamienicę. Synowiec twierdził, że obywatel X był wariatem w roku 1872, a siostrzeniec dowodził, że X oszalał dopiero w roku 1875. Zaś mąż rodzonej siostry nieboszczyka składał nie ulegające wątpliwości świadectwa, że X i w roku 1872, i w 1875 działał jak obłąkany, a cały swój majątek jeszcze w roku 1869, czyli w epoce zupełnej świadomości, zapisał siostrze."
