paragraphs:
  - clean: "(*Ojcze nasz*. Malarz. Oderisi i inni.)"
    chunks:
      - pl: "(*Ojcze nasz*. Malarz. Oderisi i inni.)"
        ru: "(«Отче наш». Художник. Одеризи и другие.)"
        note: "malarz — художник"
    words: { "Ojcze": ojciec, "nasz": nasz, "inni": inny }
  - clean: "«Ojcze nasz, niebem nieobjęty twojem,\nPrzez miłość, z jakąś ukochał głęboko\nPierwsze istoty, co są tam wysoko,\nŚwięć się Twe imię przez wszelkie stworzenie,\nMoc, mądrość Twoja przez ich dziękczynienie:\nPrzyjdź Twe Królestwo, gdy to z swym pokojem\nNie znijdzie do nas, nasz duch mdły, o Boże!"
    verse: true
    chunks:
      - pl: "«Ojcze nasz, niebem nieobjęty twojem,"
        ru: "«Отче наш, не объемлемый своим небом,"
        note: "nieobjęty — необъятный"
      - pl: "\nPrzez miłość, z jakąś ukochał głęboko"
        ru: "ради любви, которой ты глубоко возлюбил"
      - pl: "\nPierwsze istoty, co są tam wysoko,"
        ru: "первые творения, что там, наверху,"
        note: "ангелов"
      - pl: "\nŚwięć się Twe imię przez wszelkie stworzenie,"
        ru: "да святится имя Твоё всяким творением,"
      - pl: "\nMoc, mądrość Twoja przez ich dziękczynienie:"
        ru: "мощь, мудрость Твоя — их благодарением:"
      - pl: "\nPrzyjdź Twe Królestwo, gdy to z swym pokojem"
        ru: "да приидет Царствие Твоё, ибо если оно со своим миром"
      - pl: "\nNie znijdzie do nas, nasz duch mdły, o Boże!"
        ru: "не снизойдёт к нам, наш слабый дух, о Боже,"
        note: "znijść — устар. «сойти»"
    words: { "niebem": niebo, "istoty": istota, "wszelkie": wszelki, "mądrość": madrosc, "dziękczynienie": dziekczynienie, "Królestwo": krolestwo }
  - clean: "Sam doń o własnej sile dojść nie może.\nJak aniołowie ofiarę Ci w niebie\nRobią z swej woli, śpiewając Hosannę,\nOby tak ludzie robili dla Ciebie!\nDziś nam, błagamy, daj powszechną mannę,\nBez której na tej pustyni żywota\nWstecz idzie, kto się więcej naprzód miota."
    verse: true
    chunks:
      - pl: "Sam doń o własnej sile dojść nie może."
        ru: "сам к нему собственной силой дойти не может."
      - pl: "\nJak aniołowie ofiarę Ci w niebie"
        ru: "Как ангелы приносят Тебе жертву на небе"
      - pl: "\nRobią z swej woli, śpiewając Hosannę,"
        ru: "по своей воле, воспевая «Осанну»,"
      - pl: "\nOby tak ludzie robili dla Ciebie!"
        ru: "о, если бы так люди поступали для Тебя!"
      - pl: "\nDziś nam, błagamy, daj powszechną mannę,"
        ru: "Насущную манну дай нам днесь, молим,"
        note: "powszechny — здесь «насущный»"
      - pl: "\nBez której na tej pustyni żywota"
        ru: "без которой в этой пустыне жизни"
      - pl: "\nWstecz idzie, kto się więcej naprzód miota."
        ru: "идёт назад тот, кто больше рвётся вперёд."
    words: { "błagamy": blagac, "powszechną": powszechny, "mannę": manna, "pustyni": pustynia, "Wstecz": wstecz, "naprzód": naprzod }
  - clean: "Jak winy drugich przebaczamy sami,\nTy na karb łaski policz nasze długi,\nPrzebacz, a nie patrz na nasze zasługi.\nSpraw, nasza wola tak ułomna, oby\nStarego wroga uniknęła proby!\nZbaw ją od złego, niech z pokus powstanie."
    verse: true
    chunks:
      - pl: "Jak winy drugich przebaczamy sami,"
        ru: "Как мы сами прощаем вины других,"
      - pl: "\nTy na karb łaski policz nasze długi,"
        ru: "так Ты на счёт милости зачти наши долги,"
        note: "policzyć na karb — зачесть"
      - pl: "\nPrzebacz, a nie patrz na nasze zasługi."
        ru: "прости и не смотри на наши заслуги."
      - pl: "\nSpraw, nasza wola tak ułomna, oby"
        ru: "Сделай, чтобы наша воля, столь немощная,"
      - pl: "\nStarego wroga uniknęła proby!"
        ru: "избежала искушения древнего врага!"
        note: "proba — устар. «искушение, испытание»"
      - pl: "\nZbaw ją od złego, niech z pokus powstanie."
        ru: "Избавь её от лукавого, пусть восстанет от соблазнов."
        note: "pokusa — соблазн"
    words: { "winy": wina, "policz": policzyc, "Przebacz": przebaczyc, "patrz": patrzec, "zasługi": zasluga, "uniknęła": uniknac }
  - clean: "A tę ostatnią modlitwę, o Panie!\nNie mówim za nas, tu złe nas nie mami,\nLecz za tych, którzy zostali za nami».\nModląc się za się i za nas zarazem,\nSzły duchy, każdy ugięty pod głazem,\nPodobne temu, co w śnie marząc mniema,\nŻe dźwiga ciężar barkami obiema."
    verse: true
    chunks:
      - pl: "A tę ostatnią modlitwę, o Panie!"
        ru: "А эту последнюю молитву, о Господи!"
      - pl: "\nNie mówim za nas, tu złe nas nie mami,"
        ru: "мы говорим не за себя, здесь зло нас не обольщает,"
        note: "mamić — обольщать"
      - pl: "\nLecz za tych, którzy zostali za nami»."
        ru: "а за тех, кто остался позади нас»."
      - pl: "\nModląc się za się i za nas zarazem,"
        ru: "Молясь за себя и за нас разом,"
      - pl: "\nSzły duchy, każdy ugięty pod głazem,"
        ru: "шли духи, каждый согбенный под камнем,"
      - pl: "\nPodobne temu, co w śnie marząc mniema,"
        ru: "подобные тому, кто, грезя во сне, мнит,"
      - pl: "\nŻe dźwiga ciężar barkami obiema."
        ru: "что несёт тяжесть обоими плечами."
    words: { "modlitwę": modlitwa, "Modląc": modlic, "duchy": duch, "Podobne": podobny, "marząc": marzyc, "ciężar": ciezar }
  - clean: "A idąc, mdlały z trudu i żałości,\nW krąg pierwszym gzymsem, co górę okola,\nBy się oczyścić z światowych ciemności.\nJeśli tam za nas modlą się tak szczerze,\nSłusznie tu za nich słać modły, pacierze,\nTym, których dobrą zasadę ma wola."
    verse: true
    chunks:
      - pl: "A idąc, mdlały z trudu i żałości,"
        ru: "И, идя, изнемогали от труда и скорби"
      - pl: "\nW krąg pierwszym gzymsem, co górę okola,"
        ru: "по первому карнизу, что окружает гору,"
        note: "gzyms — карниз"
      - pl: "\nBy się oczyścić z światowych ciemności."
        ru: "чтобы очиститься от мирской тьмы."
        note: "światowy — мирской"
      - pl: "\nJeśli tam za nas modlą się tak szczerze,"
        ru: "Если там за нас молятся так искренне,"
      - pl: "\nSłusznie tu za nich słać modły, pacierze,"
        ru: "справедливо здесь за них возносить молитвы"
      - pl: "\nTym, których dobrą zasadę ma wola."
        ru: "тем, у кого воля имеет доброе основание."
    words: { "trudu": trud, "krąg": krag, "oczyścić": oczyscic, "światowych": swiatowy, "szczerze": szczerze, "Słusznie": slusznie }
  - clean: "Trzeba im pomóc obmywać te plamy,\nJakie tam wszyscy ze świata wnaszamy;\nAby te dusze, już lekkie i czyste,\nMogły ulecieć pod kręgi gwiaździste.\n— «Prawo i łaska ulżą wam zaiste,\nI wasze skrzydła lekkie, jako trzeba,\nPodług żądz waszych wzniosą was do nieba."
    verse: true
    chunks:
      - pl: "Trzeba im pomóc obmywać te plamy,"
        ru: "Нужно им помочь омыть те пятна,"
      - pl: "\nJakie tam wszyscy ze świata wnaszamy;"
        ru: "что все туда приносим из мира;"
        note: "wnaszać — устар. «вносить»"
      - pl: "\nAby te dusze, już lekkie i czyste,"
        ru: "чтобы эти души, уже лёгкие и чистые,"
      - pl: "\nMogły ulecieć pod kręgi gwiaździste."
        ru: "могли взлететь к звёздным кругам."
      - pl: "\n— «Prawo i łaska ulżą wam zaiste,"
        ru: "— «Да облегчат вам воистину справедливость и милость,"
      - pl: "\nI wasze skrzydła lekkie, jako trzeba,"
        ru: "и ваши крылья, лёгкие, как подобает,"
      - pl: "\nPodług żądz waszych wzniosą was do nieba."
        ru: "согласно вашим желаниям вознесут вас на небо."
    words: { "Trzeba": trzeba, "plamy": plama, "lekkie": lekki, "ulżą": ulzyc, "skrzydła": skrzydlo, "wzniosą": wzniesc }
  - clean: "Wskażcie, skąd prędzej na schody dojść można.\nGdzie ścieżka do nich jak najmniej bezdrożna.\nBo mój towarzysz wędrując tą skałą,\nZe krwi i kości Adamowe ciało\nDźwigając, za mną sunie krok powoli\nPo złomach skał tych, mimo dobrej woli»."
    verse: true
    chunks:
      - pl: "Wskażcie, skąd prędzej na schody dojść można."
        ru: "Укажите, откуда скорее можно дойти до лестницы,"
      - pl: "\nGdzie ścieżka do nich jak najmniej bezdrożna."
        ru: "где тропа к ней наименее бездорожна."
      - pl: "\nBo mój towarzysz wędrując tą skałą,"
        ru: "Ибо мой спутник, странствуя по этой скале,"
      - pl: "\nZe krwi i kości Adamowe ciało"
        ru: "неся Адамово тело из крови и костей,"
      - pl: "\nDźwigając, za mną sunie krok powoli"
        ru: "медленно движется за мной шагом"
      - pl: "\nPo złomach skał tych, mimo dobrej woli»."
        ru: "по обломкам этих скал, несмотря на добрую волю»."
    words: { "Wskażcie": wskazac, "prędzej": predko, "schody": schody, "ścieżka": sciezka, "skałą": skala, "powoli": powoli }
  - clean: "Zgodnie do wodza mojego przemowy,\nNie wiem, duch jaki odrzekł tymi słowy:\n«Brzegiem na prawo wstępujcie tu z nami,\nZnajdziecie przejście pomiędzy skałami,\nKtórędy może iść człowiek żyjący.\nGdyby nie kamień na barkach ciężący,\nCo mi do ziemi twarz i czoło chyli,\nSpojrzałbym, może poznałbym w tej chwili\nTego, co nie chce zwać się po imieniu,\nBy litość jego wzbudzić w mym cierpieniu."
    verse: true
    chunks:
      - pl: "Zgodnie do wodza mojego przemowy,"
        ru: "В согласии с речью моего вождя"
      - pl: "\nNie wiem, duch jaki odrzekł tymi słowy:"
        ru: "не знаю какой дух ответил такими словами:"
      - pl: "\n«Brzegiem na prawo wstępujcie tu z nami,"
        ru: "«Поднимайтесь здесь с нами краем направо,"
      - pl: "\nZnajdziecie przejście pomiędzy skałami,"
        ru: "найдёте проход между скалами,"
      - pl: "\nKtórędy może iść człowiek żyjący."
        ru: "где может идти живой человек."
      - pl: "\nGdyby nie kamień na barkach ciężący,"
        ru: "Если бы не камень, тяготеющий на плечах,"
      - pl: "\nCo mi do ziemi twarz i czoło chyli,"
        ru: "что клонит мне к земле лицо и лоб,"
      - pl: "\nSpojrzałbym, może poznałbym w tej chwili"
        ru: "я взглянул бы, может, узнал бы в этот миг"
      - pl: "\nTego, co nie chce zwać się po imieniu,"
        ru: "того, кто не хочет называться по имени,"
      - pl: "\nBy litość jego wzbudzić w mym cierpieniu."
        ru: "чтобы пробудить его жалость к моему страданию."
    words: { "wodza": wodz, "przemowy": przemowa, "Brzegiem": brzeg, "czoło": czolo, "zwać": zwac, "litość": litosc }
  - clean: "Z możnych Toskanów ja byłem Latynem,\nAldobrandeska pierworodnym synem.\nNie wiem, czyś kiedy znał nasze nazwisko?\nZ mych antenatów pełen próżnej chluby,\nWzbiłem się w pychę, a pycha nie wierzy,\nŻe pochodzimy ze wspólnej macierzy."
    verse: true
    chunks:
      - pl: "Z możnych Toskanów ja byłem Latynem,"
        ru: "Из могущественных тосканцев я был латинянин,"
      - pl: "\nAldobrandeska pierworodnym synem."
        ru: "первородный сын Альдобрандески."
      - pl: "\nNie wiem, czyś kiedy znał nasze nazwisko?"
        ru: "Не знаю, знал ли ты когда-нибудь наше имя?"
      - pl: "\nZ mych antenatów pełen próżnej chluby,"
        ru: "Полный пустой гордости своими предками,"
        note: "antenat — предок"
      - pl: "\nWzbiłem się w pychę, a pycha nie wierzy,"
        ru: "я вознёсся в гордыне, а гордыня не верит,"
      - pl: "\nŻe pochodzimy ze wspólnej macierzy."
        ru: "что мы происходим от общей матери."
    words: { "synem": syn, "nazwisko": nazwisko, "pełen": pelny, "wierzy": wierzyc, "pochodzimy": pochodzic, "wspólnej": wspolny }
  - clean: "Gardziłem ludźmi, z nikim ani blisko,\nTa wzgarda była przyczyną mej zguby.\nJak mię w Maremmie zabito zdradziecko,\nW Kampognatiko powie lada dziecko.\nJestem Omberto, grzech mój w oczach stoi,\nPychą zginąłem ja i wszyscy moi."
    verse: true
    chunks:
      - pl: "Gardziłem ludźmi, z nikim ani blisko,"
        ru: "Я презирал людей, ни с кем не был близок,"
      - pl: "\nTa wzgarda była przyczyną mej zguby."
        ru: "это презрение было причиной моей гибели."
      - pl: "\nJak mię w Maremmie zabito zdradziecko,"
        ru: "Как меня в Маремме убили коварно,"
      - pl: "\nW Kampognatiko powie lada dziecko."
        ru: "в Кампаньятико скажет любой ребёнок."
      - pl: "\nJestem Omberto, grzech mój w oczach stoi,"
        ru: "Я Омберто, грех мой стоит перед глазами,"
      - pl: "\nPychą zginąłem ja i wszyscy moi."
        ru: "гордыней погиб я и все мои."
    words: { "nikim": nikt, "przyczyną": przyczyna, "zguby": zguba, "dziecko": dziecko, "grzech": grzech, "zginąłem": zginac }
  - clean: "Za grzech ten ciężar zgina barki moje,\nAż nim tą karą Boga zaspokoję.\nCzegom nie robił między żyjącymi,\nTu robię teraz między umarłymi».\nSłuchając jego w dół zwiesiłem głowę.\nWtem drugi, nie ten, co uciął rozmowę,\nLedwo się zwrócić pod ciężarem zdołał,\nSpojrzał, mnie poznał, po imieniu wołał,\nZ męką trzymając wzrok we mnie utkwiony;\nSzedł obok drugich cały pochylony."
    verse: true
    chunks:
      - pl: "Za grzech ten ciężar zgina barki moje,"
        ru: "За этот грех тяжесть гнёт мне плечи,"
      - pl: "\nAż nim tą karą Boga zaspokoję."
        ru: "пока этой карой я не удовлетворю Бога."
        note: "zaspokoić — удовлетворить"
      - pl: "\nCzegom nie robił między żyjącymi,"
        ru: "Чего я не делал среди живых,"
      - pl: "\nTu robię teraz między umarłymi»."
        ru: "делаю здесь теперь среди умерших»."
      - pl: "\nSłuchając jego w dół zwiesiłem głowę."
        ru: "Слушая его, я свесил голову вниз."
      - pl: "\nWtem drugi, nie ten, co uciął rozmowę,"
        ru: "Тут другой, не тот, что прервал разговор,"
      - pl: "\nLedwo się zwrócić pod ciężarem zdołał,"
        ru: "едва сумел повернуться под тяжестью,"
      - pl: "\nSpojrzał, mnie poznał, po imieniu wołał,"
        ru: "взглянул, узнал меня, позвал по имени,"
      - pl: "\nZ męką trzymając wzrok we mnie utkwiony;"
        ru: "с мукой держа вперённым в меня взгляд;"
      - pl: "\nSzedł obok drugich cały pochylony."
        ru: "он шёл рядом с другими, весь согнувшись."
    words: { "Ledwo": ledwo, "zwrócić": zwrocic, "zdołał": zdolac, "wołał": wolac, "wzrok": wzrok, "pochylony": pochylic }
  - clean: "— «Ty Oderisi?» rzekłem doń, «O, chlubo\nZiemi Urbino, jak cię witać lubo!\nZaszczycie sztuki pod nowym nazwaniem,\nCo zwą w Paryżu: *illuminowaniem*».\n—«Bracie» rzekł: «teraz Franczesko z Bolony\nKość, papier barwi w świetniejsze kolory."
