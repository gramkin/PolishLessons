      - pl: "\nZaszczycie sztuki pod nowym nazwaniem,"
        ru: "Честь искусства под новым названием,"
      - pl: "\nCo zwą w Paryżu: *illuminowaniem*»."
        ru: "что зовут в Париже „иллюминированием“»."
        note: "миниатюра в рукописях"
      - pl: "\n—«Bracie» rzekł: «teraz Franczesko z Bolony"
        ru: "— «Брат, — сказал он, — теперь Франческо из Болоньи"
        note: "у Данте — Франко Болоньезе"
      - pl: "\nKość, papier barwi w świetniejsze kolory."
        ru: "красит кость, бумагу в более блестящие цвета."
    words: { "rzekłem": rzec, "Zaszczycie": zaszczyt, "nazwaniem": nazwac, "Paryżu": paryz, "Kość": kosc, "papier": papier }
  - clean: "On wieńcem chwały promienieje wszystek,\nZ której mi został ledwo mały listek.\nW życiu do pochwał nie byłbym tak skory,\nBom chciał prześcignąć drugich pędzla prace;\nTej dumy cło tu pogrobowe płacę.\nByłaby jeszcze nie tu moja droga,\nGdybym się w końcu nie zwrócił do Boga."
    verse: true
    chunks:
      - pl: "On wieńcem chwały promienieje wszystek,"
        ru: "Он весь сияет венцом славы,"
      - pl: "\nZ której mi został ledwo mały listek."
        ru: "от которой мне остался лишь маленький листок."
      - pl: "\nW życiu do pochwał nie byłbym tak skory,"
        ru: "В жизни я не был бы так скор на похвалы,"
      - pl: "\nBom chciał prześcignąć drugich pędzla prace;"
        ru: "ибо хотел превзойти работы чужой кисти;"
        note: "prześcignąć — превзойти"
      - pl: "\nTej dumy cło tu pogrobowe płacę."
