# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 29
chapterTitle: "Pieśń XXIX"
chapterTitleRu: "Песнь XXIX. Сотворение ангелов"
level: B2
paragraphs:
  - clean: "Ciąg dalszy i koniec pouczenia o aniołach. Skargi na przewrotną filozofię, przekręcanie Pisma Świętego itp."
    chunks:
      - pl: "Ciąg dalszy i koniec pouczenia o aniołach. Skargi na przewrotną filozofię, przekręcanie Pisma Świętego itp."
        ru: "Продолжение и окончание наставления об ангелах. Жалобы на превратную философию, искажение Священного Писания и т. д."
    words: { "Ciąg": ciag, "dalszy": daleki, "koniec": koniec, "Skargi": skarga, "filozofię": filozofia, "Pisma": pismo }
  - clean: "Kiedy z Latony zrodzone bliźnięta\nPoza Barana i Wagi znakami\nWidnokrąg wspólnym pasem opromienią,\nIle trwa chwila, gdzie je równoważy\nZenit, nim z sobą półsferę zamienią,\nPatrzyła, milcząc, przewodniczka święta\nW punkt, który wzrok mój zwyciężył blaskami,\nA potem rzekła z uśmiechem na twarzy:\n«Co chcesz usłyszeć, nie pytając ciebie\nPowiem, bo chęć twą ja widziałam w niebie,\nTam gdzie, jak z ziarna wschodząca roślina,\nWszelkie się Ubi i Quando zaczyna,\nNie żeby podnieść swoją doskonałość,\nCo być nie może, lecz by jej wspaniałość,\nW światłości, jaka ją jak płaszcz odziała,\n»Ja jestem, który jestem« powiedziała,"
    verse: true
    chunks:
      - pl: "Kiedy z Latony zrodzone bliźnięta"
        ru: "Когда рождённые Латоной близнецы,"
        note: "Солнце и Луна"
      - pl: "\nPoza Barana i Wagi znakami"
        ru: "под знаками Овна и Весов,"
        note: "у Korsaka «poza» — за"
      - pl: "\nWidnokrąg wspólnym pasem opromienią,"
        ru: "опоясывают горизонт общим поясом,"
        note: "widnokrąg — горизонт"
      - pl: "\nIle trwa chwila, gdzie je równoważy"
        ru: "сколько длится миг, когда их уравновешивает"
      - pl: "\nZenit, nim z sobą półsferę zamienią,"
        ru: "зенит, прежде чем они обменяются полусферами,"
      - pl: "\nPatrzyła, milcząc, przewodniczka święta"
        ru: "столько, молча, смотрела святая путеводительница"
      - pl: "\nW punkt, który wzrok mój zwyciężył blaskami,"
        ru: "в точку, что победила мой взгляд блеском,"
      - pl: "\nA potem rzekła z uśmiechem na twarzy:"
        ru: "а потом сказала с улыбкой на лице:"
      - pl: "\n«Co chcesz usłyszeć, nie pytając ciebie"
        ru: "«Что ты хочешь услышать, я скажу, не спрашивая тебя,"
      - pl: "\nPowiem, bo chęć twą ja widziałam w niebie,"
        ru: "ибо твоё желание я видела в небе,"
      - pl: "\nTam gdzie, jak z ziarna wschodząca roślina,"
        ru: "там, где, как растение, всходящее из зерна,"
      - pl: "\nWszelkie się Ubi i Quando zaczyna,"
        ru: "начинается всякое «Ubi» и «Quando»."
        note: "«где» и «когда»"
      - pl: "\nNie żeby podnieść swoją doskonałość,"
        ru: "Не для того, чтобы умножить своё совершенство,"
      - pl: "\nCo być nie może, lecz by jej wspaniałość,"
        ru: "что невозможно, но чтобы её великолепие"
      - pl: "\nW światłości, jaka ją jak płaszcz odziała,"
        ru: "в свете, что облёк её, как плащ,"
      - pl: "\n»Ja jestem, który jestem« powiedziała,"
        ru: "сказало: «Я есмь сущий», —"
    words: { "zwyciężył": zwyciezyc, "blaskami": blask, "rzekła": rzec, "ziarna": ziarno, "roślina": roslina, "płaszcz": plaszcz }
  - clean: "Miłość poczęła siebie w swej wieczności,\nBez czasu, miejsca, tak jak się jej zdało,\nI dziewięć stopni stworzyła miłości.\nNie, żeby wpierw jej ziarno próżnowało,\nBo wpierw, przed czasem mierzonym latami,\nDuch się unosił boży nad wodami."
    verse: true
    chunks:
      - pl: "Miłość poczęła siebie w swej wieczności,"
        ru: "Любовь зачала себя в своей вечности,"
        note: "у Данте: раскрылась в новых любовях"
      - pl: "\nBez czasu, miejsca, tak jak się jej zdało,"
        ru: "вне времени, вне места, как ей было угодно,"
      - pl: "\nI dziewięć stopni stworzyła miłości."
        ru: "и создала девять ступеней любви."
      - pl: "\nNie, żeby wpierw jej ziarno próżnowało,"
        ru: "Не то чтобы прежде её зерно бездействовало,"
        note: "próżnować — бездействовать"
      - pl: "\nBo wpierw, przed czasem mierzonym latami,"
        ru: "ибо прежде, до времени, измеряемого годами,"
      - pl: "\nDuch się unosił boży nad wodami."
        ru: "дух Божий носился над водами."
    words: { "poczęła": poczac, "wieczności": wiecznosc, "stopni": stopien, "wpierw": wpierw, "mierzonym": mierzyc, "boży": bozy }
  - clean: "Złączone forma z materyją, czyste\nWyszły poczęte w doskonałym czynie,\nJak łuk trójstronny wyrzuca trzy strzały.\nA jak w krysztale, we szkle i w bursztynie,\nPromień odbija przez tło przeźroczyste,\nBez przerwy schodząc stamtąd, gdzie jest cały;\nRównie ten skutek trójkształtny zaiste,\nOd swego Stwórcy wyszedł jednolicy,\nW zasadzie swojej bez żadnej różnicy."
    verse: true
    chunks:
      - pl: "Złączone forma z materyją, czyste"
        ru: "Соединённые форма с материей, чистые,"
      - pl: "\nWyszły poczęte w doskonałym czynie,"
        ru: "вышли, зачатые в совершенном действии,"
      - pl: "\nJak łuk trójstronny wyrzuca trzy strzały."
        ru: "как трёхтетивный лук выпускает три стрелы."
      - pl: "\nA jak w krysztale, we szkle i w bursztynie,"
        ru: "И как в хрустале, в стекле и в янтаре"
      - pl: "\nPromień odbija przez tło przeźroczyste,"
        ru: "луч отражается сквозь прозрачную основу,"
      - pl: "\nBez przerwy schodząc stamtąd, gdzie jest cały;"
        ru: "непрерывно сходя оттуда, где он весь,"
      - pl: "\nRównie ten skutek trójkształtny zaiste,"
        ru: "так же это трёхобразное следствие, воистину,"
      - pl: "\nOd swego Stwórcy wyszedł jednolicy,"
        ru: "вышло от своего Творца единым,"
      - pl: "\nW zasadzie swojej bez żadnej różnicy."
        ru: "в своём начале без всякого различия."
    words: { "wyrzuca": wyrzucac, "krysztale": krysztal, "szkle": szklo, "Promień": promien, "odbija": odbijac, "schodząc": schodzic }
  - clean: "Wtedy stworzony był i zbudowany\nStopień tych istot, Bóg zaś je postawił\nNajwyżej jakby wierzch, koronę świata.\nW których się czysty arcyczyn przejawił:\nNajniższe miejsce materyja trzyma;\nLecz w środku formę z materyją splata\nWęzeł, co nigdy nie jest rozwiązany."
    verse: true
    chunks:
      - pl: "Wtedy stworzony był i zbudowany"
        ru: "Тогда была сотворена и устроена"
      - pl: "\nStopień tych istot, Bóg zaś je postawił"
        ru: "ступень этих существ, Бог же поставил их"
      - pl: "\nNajwyżej jakby wierzch, koronę świata."
        ru: "выше всех, как вершину, венец мира,"
      - pl: "\nW których się czysty arcyczyn przejawił:"
        ru: "в которых явилось чистое высшее действие;"
        note: "ангелы — чистый акт"
      - pl: "\nNajniższe miejsce materyja trzyma;"
        ru: "низшее место держит материя;"
      - pl: "\nLecz w środku formę z materyją splata"
        ru: "а в середине форму с материей сплетает"
      - pl: "\nWęzeł, co nigdy nie jest rozwiązany."
        ru: "узел, который никогда не развязывается."
    words: { "zbudowany": zbudowac, "istot": istota, "koronę": korona, "Najniższe": niski, "formę": forma, "Węzeł": wezel }
  - clean: "Wprawdzie aniołów wedle Hieronima\nBóg naprzód stworzył i prąd wieków długi\nUpłynął, zanim utworzył świat drugi:\nAle ta prawda nie tak zapisana\nW księgach natchnionych Duchem świętym Pana,\nWidną jest, kto by głębokość ich zbrodził."
    verse: true
    chunks:
      - pl: "Wprawdzie aniołów wedle Hieronima"
        ru: "Правда, по Иерониму, ангелов"
      - pl: "\nBóg naprzód stworzył i prąd wieków długi"
        ru: "Бог сотворил прежде, и протекло долгое течение веков,"
      - pl: "\nUpłynął, zanim utworzył świat drugi:"
        ru: "прежде чем он создал другой мир;"
      - pl: "\nAle ta prawda nie tak zapisana"
        ru: "но эта истина не так записана"
      - pl: "\nW księgach natchnionych Duchem świętym Pana,"
        ru: "в книгах, вдохновлённых Святым Духом Господа;"
      - pl: "\nWidną jest, kto by głębokość ich zbrodził."
        ru: "она видна тому, кто пройдёт вброд их глубину."
        note: "zbrodzić — пройти вброд"
    words: { "naprzód": naprzod, "stworzył": stworzyc, "prąd": prad, "wieków": wiek, "zapisana": zapisac, "Duchem": duch }
  - clean: "Sam by wasz rozum na to się nie zgodził,\nAby te czynu bezpośrednie siły\nTak długo same bezczynnymi były.\nGdzie, jak i kiedy te miłości święte\nStworzone były, masz tu wywód cały,\nRazem twej żądzy studzisz trzy zapały."
    verse: true
    chunks:
      - pl: "Sam by wasz rozum na to się nie zgodził,"
        ru: "Сам ваш разум на это бы не согласился,"
      - pl: "\nAby te czynu bezpośrednie siły"
        ru: "чтобы эти непосредственные силы действия"
      - pl: "\nTak długo same bezczynnymi były."
        ru: "так долго оставались бездеятельными."
      - pl: "\nGdzie, jak i kiedy te miłości święte"
        ru: "Где, как и когда были созданы эти святые любови,"
      - pl: "\nStworzone były, masz tu wywód cały,"
        ru: "здесь у тебя полное объяснение;"
      - pl: "\nRazem twej żądzy studzisz trzy zapały."
        ru: "разом ты остужаешь три пыла своего желания."
    words: { "wasz": wasz, "rozum": rozum, "zgodził": zgodzic, "czynu": czyn, "bezpośrednie": bezposredni, "miłości": milosc }
  - clean: "Tak szybko w myśli nie zliczysz dwadzieścia\nJak ze stworzonych część jedna aniołów\nZawieruszyła ład waszych żywiołów.\nCzęść druga wiernie dotrwała w swej cześci;\nZ jaką rozkoszą dzieło rozpoczęte\nCiągle prowadzą, sam ich bieg dowodzi,\nCo kołowrotem nieustannym chodzi."
    verse: true
    chunks:
      - pl: "Tak szybko w myśli nie zliczysz dwadzieścia"
        ru: "Ты не успеешь так быстро сосчитать в уме до двадцати,"
      - pl: "\nJak ze stworzonych część jedna aniołów"
        ru: "как одна часть сотворённых ангелов"
      - pl: "\nZawieruszyła ład waszych żywiołów."
        ru: "смешала порядок ваших стихий."
        note: "zawieruszyć — смешать, перевернуть"
      - pl: "\nCzęść druga wiernie dotrwała w swej cześci;"
        ru: "Другая часть верно устояла в своей чести;"
      - pl: "\nZ jaką rozkoszą dzieło rozpoczęte"
        ru: "с каким наслаждением они ведут начатое дело,"
      - pl: "\nCiągle prowadzą, sam ich bieg dowodzi,"
        ru: "доказывает сам их бег,"
      - pl: "\nCo kołowrotem nieustannym chodzi."
        ru: "что ходит непрестанным кругом."
    words: { "żywiołów": zywiol, "dzieło": dzielo, "rozpoczęte": rozpoczac, "Ciągle": ciagle, "bieg": bieg, "dowodzi": dowodzic }
  - clean: "Pierwszy strąciła duch przeklęta pycha\nTego coś widział, jak zdeptany w pysze\nPod ciężarami światów ledwo dysze.\nCzęść, którą widzisz tutaj, była cicha,\nUznała Dobroć, co ich w swej miłości\nDo tak wysokich wzniosła pojętności."
    verse: true
    chunks:
      - pl: "Pierwszy strąciła duch przeklęta pycha"
        ru: "Первым дух свергла проклятая гордыня"
      - pl: "\nTego coś widział, jak zdeptany w pysze"
        ru: "того, кого ты видел, как, растоптанный в гордыне,"
        note: "Люцифер"
      - pl: "\nPod ciężarami światów ledwo dysze."
        ru: "он едва дышит под тяжестью миров."
      - pl: "\nCzęść, którą widzisz tutaj, była cicha,"
        ru: "Часть, которую ты видишь здесь, была смиренна,"
      - pl: "\nUznała Dobroć, co ich w swej miłości"
        ru: "признала Доброту, что в своей любви"
      - pl: "\nDo tak wysokich wzniosła pojętności."
        ru: "вознесла их к столь высокому разумению."
        note: "pojętność — понятливость"
    words: { "przeklęta": przeklety, "ciężarami": ciezar, "ledwo": ledwo, "Uznała": uznac, "Dobroć": dobroc, "wzniosła": wzniesc }
  - clean: "Wzrok ich wzmocniła siłą doskonałą\nOświecająca Łaska i zasługa,\nPrzeto ich wola jest pełną i stałą.\nUwierz na pewno jak pokorny sługa,\nŻe zasłużoną łaskę ten odbiera,\nO ile serce kto dla niej otwiera."
    verse: true
    chunks:
      - pl: "Wzrok ich wzmocniła siłą doskonałą"
        ru: "Их взгляд укрепили совершенной силой"
      - pl: "\nOświecająca Łaska i zasługa,"
        ru: "озаряющая Благодать и заслуга,"
      - pl: "\nPrzeto ich wola jest pełną i stałą."
        ru: "поэтому их воля полна и постоянна."
      - pl: "\nUwierz na pewno jak pokorny sługa,"
        ru: "Поверь непременно, как смиренный слуга,"
      - pl: "\nŻe zasłużoną łaskę ten odbiera,"
        ru: "что заслуженную милость получает тот,"
      - pl: "\nO ile serce kto dla niej otwiera."
        ru: "кто насколько открывает для неё сердце."
    words: { "Wzrok": wzrok, "wzmocniła": wzmocnic, "zasługa": zasluga, "sługa": sluga, "zasłużoną": zasluzyc, "łaskę": laska-2 }
  - clean: "Sam teraz poznasz bez cudzej podpory,\nJeśliś mnie pojął, te anielskie chóry.\nLecz gdy na ziemi błąd po waszych szkołach\nOgłasza błędny wykład o aniołach,\nŻe chcieć, pojmować i pamiętać mogą,\nJeszcze sprostuję w tobie sąd opaczny,\nMroczący prawdę przez wykład dwuznaczny."
    verse: true
    chunks:
      - pl: "Sam teraz poznasz bez cudzej podpory,"
        ru: "Теперь ты сам познаешь без чужой опоры,"
      - pl: "\nJeśliś mnie pojął, te anielskie chóry."
        ru: "если ты меня понял, эти ангельские хоры."
      - pl: "\nLecz gdy na ziemi błąd po waszych szkołach"
        ru: "Но поскольку на земле заблуждение в ваших школах"
      - pl: "\nOgłasza błędny wykład o aniołach,"
        ru: "провозглашает ошибочное учение об ангелах,"
      - pl: "\nŻe chcieć, pojmować i pamiętać mogą,"
        ru: "что они могут хотеть, постигать и помнить,"
      - pl: "\nJeszcze sprostuję w tobie sąd opaczny,"
        ru: "я ещё исправлю в тебе превратное суждение,"
        note: "opaczny — превратный"
      - pl: "\nMroczący prawdę przez wykład dwuznaczny."
        ru: "омрачающее истину двусмысленным толкованием."
    words: { "cudzej": cudzy, "pojął": pojac, "chóry": chor, "ziemi": ziemia, "błąd": blad, "wykład": wyklad }
  - clean: "Duchom tym oczy tak zatapiać błogo\nW obrazie bożym, że wzroku ni razu\nNie oderwały od tego obrazu,\nPrzed którym żadna rzecz nie jest zakryta.\nOczu ich przedmiot nowy nie odrywa,\nMyśl ich na różne cele nierozbita,\nWewnętrzną ducha jednością szczęśliwa\nNie potrzebuje władzy przypomnienia."
    verse: true
    chunks:
      - pl: "Duchom tym oczy tak zatapiać błogo"
        ru: "Этим духам так блаженно погружать глаза"
      - pl: "\nW obrazie bożym, że wzroku ni razu"
        ru: "в Божий образ, что ни разу"
      - pl: "\nNie oderwały od tego obrazu,"
        ru: "не оторвали взгляда от этого образа,"
      - pl: "\nPrzed którym żadna rzecz nie jest zakryta."
        ru: "перед которым никакая вещь не скрыта."
      - pl: "\nOczu ich przedmiot nowy nie odrywa,"
        ru: "Их глаз не отрывает новый предмет,"
      - pl: "\nMyśl ich na różne cele nierozbita,"
        ru: "их мысль, не рассеянная на разные цели,"
      - pl: "\nWewnętrzną ducha jednością szczęśliwa"
        ru: "счастливая внутренним единством духа,"
      - pl: "\nNie potrzebuje władzy przypomnienia."
        ru: "не нуждается в способности воспоминания."
    words: { "obrazu": obraz, "przedmiot": przedmiot, "nierozbita": rozbic, "Wewnętrzną": wewnetrzny, "jednością": jednosc, "przypomnienia": przypomniec }
  - clean: "U was w czuwaniu roją się marzenia,\nTen wierzy, drugi bez wiary słuchacza\nSłucha, lecz pierwszy najwięcej wykracza.\nFilozofując na ziemi myśl wasza\nBez drogi idzie nowotnymi tory,\nTak was namiętność pozoru unosi."
    verse: true
    chunks:
      - pl: "U was w czuwaniu roją się marzenia,"
        ru: "У вас наяву роятся грёзы:"
      - pl: "\nTen wierzy, drugi bez wiary słuchacza"
        ru: "этот верит, другой без веры"
      - pl: "\nSłucha, lecz pierwszy najwięcej wykracza."
        ru: "слушает слушателя, но первый грешит больше."
        note: "wykraczać — провиниться"
      - pl: "\nFilozofując na ziemi myśl wasza"
        ru: "Философствуя на земле, ваша мысль"
      - pl: "\nBez drogi idzie nowotnymi tory,"
        ru: "без дороги идёт новыми колеями,"
        note: "nowotny — новый, новомодный"
      - pl: "\nTak was namiętność pozoru unosi."
        ru: "так вас увлекает страсть к видимости."
    words: { "wierzy": wierzyc, "drugi": drugi, "wiary": wiara, "Słucha": sluchac, "tory": tor, "pozoru": pozor }
