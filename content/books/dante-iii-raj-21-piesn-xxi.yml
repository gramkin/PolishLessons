paragraphs:
  - clean: "7. Saturn: święci kontemplacyjnego życia. Duchy tworzą drabinę. Zakończenie materii o błogosławieństwie niechrześcijan. Damiani przemawia przeciw urągającemu z przykazań bożych wyższemu duchowieństwu."
    chunks:
      - pl: "7. Saturn: święci kontemplacyjnego życia. Duchy tworzą drabinę. Zakończenie materii o błogosławieństwie niechrześcijan. Damiani przemawia przeciw urągającemu z przykazań bożych wyższemu duchowieństwu."
        ru: "7. Сатурн: святые созерцательной жизни. Духи образуют лестницу. Завершение рассуждения о блаженстве нехристиан. Дамиани выступает против высшего духовенства, глумящегося над Божьими заповедями."
        note: "urągać — глумиться"
    words: { "tworzą": tworzyc, "drabinę": drabina, "materii": materia, "błogosławieństwie": blogoslawienstwo, "przemawia": przemawiac, "bożych": bozy }
  - clean: "Znów moje oczy, z nimi dusza cała\nDo mojej pani odwrócone były,\nCałą uwagę tylko w niej utkwiły:\nOna uroczo więcej się nie śmiała:\n«Gdybym uśmiechem błyszczącym za wiele\nTu zaświeciła,» rzekła Beatryce:\n«Spłonąłbyś cały na proch jak Semele,\nBo piękność moja w blask rośnie stopniami,\nIle, coś widział w ciągu naszej jazdy,\nWstępujem dworca wiecznymi schodami,\nGdybym ci blasku jej nie złagodziła,\nTu wystawiona na jej błyskawice\nTak by zwietrzała twa śmiertelna siła\nJak liść piorunem okruszony z drzewa."
    verse: true
    chunks:
      - pl: "Znów moje oczy, z nimi dusza cała"
        ru: "Снова мои глаза, а с ними и вся душа"
      - pl: "\nDo mojej pani odwrócone były,"
        ru: "были обращены к моей госпоже,"
      - pl: "\nCałą uwagę tylko w niej utkwiły:"
        ru: "всё внимание устремили только на неё:"
      - pl: "\nOna uroczo więcej się nie śmiała:"
        ru: "она прелестно больше не улыбалась."
      - pl: "\n«Gdybym uśmiechem błyszczącym za wiele"
        ru: "«Если бы я сияющей улыбкой слишком сильно"
      - pl: "\nTu zaświeciła,» rzekła Beatryce:"
        ru: "здесь засветилась, — сказала Беатриче, —"
      - pl: "\n«Spłonąłbyś cały na proch jak Semele,"
        ru: "ты сгорел бы весь в прах, как Семела,"
      - pl: "\nBo piękność moja w blask rośnie stopniami,"
        ru: "ибо моя красота растёт в блеске ступенями,"
      - pl: "\nIle, coś widział w ciągu naszej jazdy,"
        ru: "по мере того, как, ты видел, в ходе нашего пути"
      - pl: "\nWstępujem dworca wiecznymi schodami,"
        ru: "мы восходим по вечным ступеням дворца;"
      - pl: "\nGdybym ci blasku jej nie złagodziła,"
        ru: "если бы я не смягчила тебе её блеска,"
      - pl: "\nTu wystawiona na jej błyskawice"
        ru: "здесь, подставленная её молниям,"
      - pl: "\nTak by zwietrzała twa śmiertelna siła"
        ru: "твоя смертная сила так бы выветрилась,"
      - pl: "\nJak liść piorunem okruszony z drzewa."
        ru: "как лист, раскрошенный молнией с дерева."
    words: { "błyszczącym": blyszczec, "rzekła": rzec, "Spłonąłbyś": splonac, "piękność": pieknosc, "blask": blask, "piorunem": piorun }
  - clean: "Jużeśmy przyszli aż do siódmej gwiazdy,\nCo pod lwa piersią swe żary zagrzewa,\nKtóre łagodząc z nim przyświeca ziemi.\nMyśl twoją ciskaj za oczyma twymi,\nA zrób zwierciadło z oczu dla obrazu,\nCo się w nich cały odbije do razu»."
    verse: true
    chunks:
      - pl: "Jużeśmy przyszli aż do siódmej gwiazdy,"
        ru: "Мы уже пришли к седьмой звезде,"
        note: "Сатурн"
      - pl: "\nCo pod lwa piersią swe żary zagrzewa,"
        ru: "что под грудью Льва разогревает свой жар,"
        note: "Сатурн в созвездии Льва"
      - pl: "\nKtóre łagodząc z nim przyświeca ziemi."
        ru: "который, смягчаясь, светит с ним земле."
      - pl: "\nMyśl twoją ciskaj za oczyma twymi,"
        ru: "Бросай свою мысль вслед за своими глазами"
      - pl: "\nA zrób zwierciadło z oczu dla obrazu,"
        ru: "и сделай из глаз зеркало для образа,"
      - pl: "\nCo się w nich cały odbije do razu»."
        ru: "что весь сразу отразится в них»."
    words: { "gwiazdy": gwiazda, "piersią": piers, "ziemi": ziemia, "oczyma": oko, "obrazu": obraz, "odbije": odbic }
  - clean: "O! Kto by wiedział, jak strzelistym okiem\nBłogosławionym pasłem się widokiem,\nW chwili gdy wzrok mój oderwałem od niej,\nPrzyzna, że trudno być posłusznym godniej\nPani, co wagą łaski nad swym sługą\nRównoważyła jedną rozkosz drugą."
    verse: true
    chunks:
      - pl: "O! Kto by wiedział, jak strzelistym okiem"
        ru: "О! Кто знал бы, каким устремлённым оком"
      - pl: "\nBłogosławionym pasłem się widokiem,"
        ru: "я насыщался блаженным зрелищем,"
        note: "paść się — пастись, насыщаться"
      - pl: "\nW chwili gdy wzrok mój oderwałem od niej,"
        ru: "в миг, когда оторвал от неё взгляд,"
      - pl: "\nPrzyzna, że trudno być posłusznym godniej"
        ru: "признает, что трудно достойнее быть послушным"
      - pl: "\nPani, co wagą łaski nad swym sługą"
        ru: "госпоже, которая весом милости к своему слуге"
      - pl: "\nRównoważyła jedną rozkosz drugą."
        ru: "уравновешивала одно наслаждение другим."
    words: { "Błogosławionym": blogoslawic, "widokiem": widok, "wzrok": wzrok, "Przyzna": przyznac, "wagą": waga, "sługą": sluga }
  - clean: "W planecie, który świat biegiem okola,\nNoszącym imię kochanego króla,\nPod którym ziemskie zło jak trup zastygło.\nWidziałem długą drabinę, bez końca\nZ barwą pozłoty od promienia słońca,\nSzczebli jej wyższych oko nie dościgło."
    verse: true
    chunks:
      - pl: "W planecie, który świat biegiem okola,"
        ru: "В планете, что бегом огибает мир,"
        note: "okalać — окружать"
      - pl: "\nNoszącym imię kochanego króla,"
        ru: "носящей имя любимого царя,"
        note: "Сатурн, царь золотого века"
      - pl: "\nPod którym ziemskie zło jak trup zastygło."
        ru: "при котором земное зло застыло, как труп,"
      - pl: "\nWidziałem długą drabinę, bez końca"
        ru: "я видел длинную лестницу, без конца,"
      - pl: "\nZ barwą pozłoty od promienia słońca,"
        ru: "цвета позолоты от солнечного луча;"
      - pl: "\nSzczebli jej wyższych oko nie dościgło."
        ru: "её высших ступеней глаз не достиг."
        note: "szczebel — ступень, перекладина"
    words: { "biegiem": bieg, "Noszącym": nosic, "króla": krol, "ziemskie": ziemski, "promienia": promien, "słońca": slonce }
  - clean: "Widziałem światła po szczeblach schodzące,\nPatrząc, myślałem, że z niebios zasłony\nZarazem świateł wybłysło tysiące.\nA jak z nałogu przyrodnego wrony,\nGdy świta ranek, skrzydłami trzepocą,\nGrzejąc nastygłe skrzydła chłodną nocą,\nJedne daleko lecą bez powrotu,\nDrugie tam, skąd się zerwały do lotu,\nTe w miejscu krążą; w takim ciągłym ruchu\nSnuły się światła drabiną rozległą,\nNim każde szczebla pewnego dobiegło."
    verse: true
    chunks:
      - pl: "Widziałem światła po szczeblach schodzące,"
        ru: "Я видел светила, спускающиеся по ступеням,"
      - pl: "\nPatrząc, myślałem, że z niebios zasłony"
        ru: "и, глядя, думал, что из завесы небес"
      - pl: "\nZarazem świateł wybłysło tysiące."
        ru: "разом вспыхнули тысячи светил."
      - pl: "\nA jak z nałogu przyrodnego wrony,"
        ru: "И как по природной привычке вороны,"
        note: "у Данте — галки"
      - pl: "\nGdy świta ranek, skrzydłami trzepocą,"
        ru: "когда светает утро, хлопают крыльями,"
      - pl: "\nGrzejąc nastygłe skrzydła chłodną nocą,"
        ru: "грея крылья, озябшие холодной ночью,"
      - pl: "\nJedne daleko lecą bez powrotu,"
        ru: "одни улетают далеко без возврата,"
      - pl: "\nDrugie tam, skąd się zerwały do lotu,"
        ru: "другие — туда, откуда сорвались в полёт,"
      - pl: "\nTe w miejscu krążą; w takim ciągłym ruchu"
        ru: "а те кружат на месте; в таком непрерывном движении"
      - pl: "\nSnuły się światła drabiną rozległą,"
        ru: "вились светила по широкой лестнице,"
      - pl: "\nNim każde szczebla pewnego dobiegło."
        ru: "пока каждое не достигло определённой ступени."
    words: { "niebios": niebiosa, "zasłony": zaslona, "wrony": wrona, "Grzejąc": grzac, "chłodną": chlodny, "dobiegło": dobiec }
  - clean: "To, co na szczeblu najwyższym stanęło,\nTak promienisty blask rzucać poczęło,\nAżem rzekł w sobie: «Co ciebie natchnęło\nMiłością, jaką objawiasz mi, duchu!»\nLecz ta, od której zależą rozkazu\nMilczenie moje, głos mego wyrazu,\nMilczała ciągle, ja pytać nie śmiałem."
    verse: true
    chunks:
      - pl: "To, co na szczeblu najwyższym stanęło,"
        ru: "То, что остановилось на высшей ступени,"
      - pl: "\nTak promienisty blask rzucać poczęło,"
        ru: "начало бросать столь лучистый блеск,"
      - pl: "\nAżem rzekł w sobie: «Co ciebie natchnęło"
        ru: "что я сказал про себя: «Что вдохновило тебя"
      - pl: "\nMiłością, jaką objawiasz mi, duchu!»"
        ru: "любовью, которую ты мне являешь, дух!»"
      - pl: "\nLecz ta, od której zależą rozkazu"
        ru: "Но та, от чьего приказа зависят"
      - pl: "\nMilczenie moje, głos mego wyrazu,"
        ru: "моё молчание и голос моих слов,"
      - pl: "\nMilczała ciągle, ja pytać nie śmiałem."
        ru: "всё молчала, и я не смел спрашивать."
    words: { "stanęło": stanac, "rzucać": rzucac, "poczęło": poczac, "rozkazu": rozkaz, "wyrazu": wyraz, "Milczała": milczec }
  - clean: "Potem, gdy w moim milczeniu wyśledzi\nOczyma Tego, który wszystko widzi,\nChęć, co przez słowa objawić się wstydzi,\nRzekła: «Niech twoja żądza swym upałem\nSama stopnieje». Więc tak się ozwałem:\n«Lubom nie godzien twojej odpowiedzi,\nW imię tej, która mówić mi pozwala,\nSzczęśliwa duszo! Z twej światłości środka,\nJaką radości skra w tobie zapala,\nMów, czy cię do mnie zbliża pociąg dzielny,\nMów, za co w raju melodyja słodka\nNagle w tej sferze swój akord urywa,\nGdy tak pobożnie niżej go wygrywa?»"
    verse: true
    chunks:
      - pl: "Potem, gdy w moim milczeniu wyśledzi"
        ru: "Потом, когда в моём молчании выследила"
      - pl: "\nOczyma Tego, który wszystko widzi,"
        ru: "глазами Того, кто видит всё,"
      - pl: "\nChęć, co przez słowa objawić się wstydzi,"
        ru: "желание, что стыдится открыться словами,"
      - pl: "\nRzekła: «Niech twoja żądza swym upałem"
        ru: "сказала: «Пусть твоя жажда своим жаром"
      - pl: "\nSama stopnieje». Więc tak się ozwałem:"
        ru: "сама растает». Так я и заговорил:"
        note: "ozwać się — заговорить"
      - pl: "\n«Lubom nie godzien twojej odpowiedzi,"
        ru: "«Хоть я не достоин твоего ответа,"
      - pl: "\nW imię tej, która mówić mi pozwala,"
        ru: "во имя той, что позволяет мне говорить,"
      - pl: "\nSzczęśliwa duszo! Z twej światłości środka,"
        ru: "счастливая душа! Из середины своего света,"
      - pl: "\nJaką radości skra w tobie zapala,"
        ru: "который зажигает в тебе искра радости,"
        note: "skra — искра"
      - pl: "\nMów, czy cię do mnie zbliża pociąg dzielny,"
        ru: "скажи, влечёт ли тебя ко мне сильное притяжение;"
      - pl: "\nMów, za co w raju melodyja słodka"
        ru: "скажи, почему в раю сладкая мелодия"
      - pl: "\nNagle w tej sferze swój akord urywa,"
        ru: "вдруг в этой сфере обрывает свой аккорд,"
      - pl: "\nGdy tak pobożnie niżej go wygrywa?»"
        ru: "тогда как ниже так благочестиво звучит?»"
    words: { "Chęć": chec, "wstydzi": wstydzic, "godzien": godny, "dzielny": dzielny, "raju": raj, "niżej": nisko }
  - clean: "«Ty masz podobnie słuch jak wzrok śmiertelny»\nOdpowiedziała: — «tu nikt z nas nie śpiewa\nDla tej przyczyny, co i Beatryce\nKryje uśmiechu swego błyskawice.\nSchodzę tak nisko świętymi szczeblami,\nAby ci duszę ugościć godami\nSłowa i światła jakie mnie odziewa:\nSchodzę, nie żebym kochała cię więcej,\nWzwyż tak kochają, a może goręcej,\nCo świadczą światłem rzęśniejąc bogatem;"
    verse: true
    chunks:
      - pl: "«Ty masz podobnie słuch jak wzrok śmiertelny»"
        ru: "«У тебя слух, как и взгляд, смертный, —"
      - pl: "\nOdpowiedziała: — «tu nikt z nas nie śpiewa"
        ru: "ответила она, — здесь никто из нас не поёт"
      - pl: "\nDla tej przyczyny, co i Beatryce"
        ru: "по той же причине, по какой и Беатриче"
      - pl: "\nKryje uśmiechu swego błyskawice."
        ru: "скрывает молнии своей улыбки."
      - pl: "\nSchodzę tak nisko świętymi szczeblami,"
        ru: "Я спускаюсь так низко по святым ступеням,"
      - pl: "\nAby ci duszę ugościć godami"
        ru: "чтобы угостить твою душу пиром"
      - pl: "\nSłowa i światła jakie mnie odziewa:"
        ru: "слова и света, что меня облекает;"
      - pl: "\nSchodzę, nie żebym kochała cię więcej,"
        ru: "спускаюсь не потому, что люблю тебя больше:"
      - pl: "\nWzwyż tak kochają, a może goręcej,"
        ru: "выше любят так же, а может, и горячее,"
      - pl: "\nCo świadczą światłem rzęśniejąc bogatem;"
        ru: "о чём свидетельствуют, сверкая богатым светом;"
    words: { "podobnie": podobnie, "słuch": sluch, "śmiertelny": smiertelny, "Kryje": kryc, "Schodzę": schodzic, "świadczą": swiadczyc }
  - clean: "Lecz miłość wielka, przez którą pobożnie\nSłużymy Woli rządzącej wszechświatem,\nNas, jako widzisz, umieszcza tu różnie.»\n— «O święte światło!» rzekłem «Na tym dworze\nWiecznego króla widzę miłość wolna\nPosługom niebios wystarczyć jest zdolna;\nLecz tego moja myśl pojąć nie może,\nDlaczego jedna ze współświateł grona\nNa tę posługę byłaś przeznaczona?»"
    verse: true
    chunks:
      - pl: "Lecz miłość wielka, przez którą pobożnie"
