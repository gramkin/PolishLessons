        ru: "служим Воле, правящей вселенной,"
      - pl: "\nNas, jako widzisz, umieszcza tu różnie.»"
        ru: "нас, как видишь, размещает здесь по-разному»."
      - pl: "\n— «O święte światło!» rzekłem «Na tym dworze"
        ru: "— «О святой свет! — сказал я. — При этом дворе"
      - pl: "\nWiecznego króla widzę miłość wolna"
        ru: "Вечного Царя я вижу, что свободная любовь"
      - pl: "\nPosługom niebios wystarczyć jest zdolna;"
        ru: "способна сполна послужить небесам;"
      - pl: "\nLecz tego moja myśl pojąć nie może,"
        ru: "но вот чего моя мысль понять не может:"
      - pl: "\nDlaczego jedna ze współświateł grona"
        ru: "почему из сонма соседних светил именно ты"
      - pl: "\nNa tę posługę byłaś przeznaczona?»"
        ru: "была предназначена для этой службы?»"
    words: { "wszechświatem": wszechswiat, "dworze": dwor, "Wiecznego": wieczny, "zdolna": zdolny, "grona": grono, "przeznaczona": przeznaczyc }
  - clean: "Jeszcze nie były słowa domówione,\nŚwiatło krążyło jak koło we młynie,\nMiłość tak w jego mówiła średzinie:\n«Tu światłość boża na mnie promień ciska,\nKtóry przenika mych blasków zasłonę,\nMoc jej i wzrok mój razem zespolone\nTak mnie podnoszą, że gdy wzrok wytężę,\nArcytreść widzę, gdzie ta moc się lęże."
    verse: true
    chunks:
      - pl: "Jeszcze nie były słowa domówione,"
        ru: "Ещё не были договорены слова,"
      - pl: "\nŚwiatło krążyło jak koło we młynie,"
        ru: "как свет закружился, как колесо на мельнице,"
      - pl: "\nMiłość tak w jego mówiła średzinie:"
        ru: "и любовь так заговорила в его середине:"
        note: "średzina — середина"
      - pl: "\n«Tu światłość boża na mnie promień ciska,"
        ru: "«Здесь божий свет мечет на меня луч,"
      - pl: "\nKtóry przenika mych blasków zasłonę,"
        ru: "который проникает сквозь покров моего блеска;"
      - pl: "\nMoc jej i wzrok mój razem zespolone"
        ru: "его сила и моё зрение, соединённые вместе,"
      - pl: "\nTak mnie podnoszą, że gdy wzrok wytężę,"
        ru: "так меня возносят, что, когда я напрягу взгляд,"
      - pl: "\nArcytreść widzę, gdzie ta moc się lęże."
        ru: "вижу Высшую Сущность, где рождается эта сила."
