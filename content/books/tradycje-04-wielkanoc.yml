      - pl: " Dzieci szukają w ogrodzie albo w mieszkaniu prezentów od zajączka, czyli słodyczy i drobnych upominków, choć ten zwyczaj przyszedł z Niemiec i nie wszędzie jest znany."
        ru: "Дети ищут в саду или в квартире подарки от зайчика, то есть сладости и небольшие подарки, хотя этот обычай пришёл из Германии и известен не везде."
