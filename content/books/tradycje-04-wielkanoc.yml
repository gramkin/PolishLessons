        ru: "На столе стоит журек с яйцом и белой колбасой, который иногда подают в выдолбленной буханке хлеба, а рядом ветчина, паштет, фаршированные яйца и овощной салат."
        note: "wydrążony — выдолбленный; bochenek — буханка"
      - pl: " Do mięsa podaje się chrzan i ćwikłę, czyli tarte buraki z chrzanem, ostrą i słodkawą jednocześnie."
        ru: "К мясу подают хрен и цвиклу, то есть тёртую свёклу с хреном, острую и сладковатую одновременно."
        note: "ćwikła — свёкла с хреном"
      - pl: " Na stole wielkanocnym nie może zabraknąć ciast: wysokiej baby drożdżowej, polanej lukrem, sernika i mazurka, płaskiego ciasta ozdobionego bakaliami, czekoladą i kolorowymi wzorami."
        ru: "На пасхальном столе не могут отсутствовать пироги: высокая дрожжевая баба, политая глазурью, сырник и мазурек, плоский пирог, украшенный орехами и сухофруктами, шоколадом и цветными узорами."
        note: "drożdżowy — дрожжевой"
      - pl: " W rodzinach z dawnych Kresów przygotowuje się też paschę, deser z twarogu, masła, jajek i bakalii, w kształcie piramidy."
        ru: "В семьях с бывших Кресов готовят и пасху, десерт из творога, масла, яиц и сухофруктов в форме пирамиды."
        note: "twaróg — творог"
      - pl: " Na środku stołu stoi baranek z cukru, a całość ozdabia się bukszpanem, rzeżuchą wyhodowaną na watce i żonkilami."
        ru: "В центре стола стоит сахарный ягнёнок, а всё украшают самшитом, кресс-салатом, выращенным на вате, и нарциссами."
        note: "rzeżucha — кресс-салат; żonkil — нарцисс"
      - pl: " Po śniadaniu dzieci, a czasem i dorośli, bawią się w stukanie jajkami."
        ru: "После завтрака дети, а иногда и взрослые, играют в битьё яйцами."
      - pl: " Dwie osoby uderzają czubkami swoich ugotowanych jajek, a ten, czyje jajko się nie rozbije, zabiera jajko przeciwnika."
        ru: "Два человека ударяют друг о друга кончиками своих варёных яиц, и тот, чьё яйцо не разбилось, забирает яйцо противника."
      - pl: " Doświadczeni gracze wiedzą, które jajka są najtwardsze, i starannie je wybierają, a niektórzy podobno oszukują, używając jajek z drewna."
