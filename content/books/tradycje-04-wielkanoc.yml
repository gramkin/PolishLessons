  - clean: "W Kalwarii Zebrzydowskiej pod Krakowem, w jednym z najstarszych polskich sanktuariów, od wieków odbywa się misterium Męki Pańskiej. Przez cały Wielki Tydzień aktorzy amatorzy, w większości mieszkańcy okolicznych wsi, odgrywają ostatnie dni życia Jezusa na wzgórzach i w kaplicach, a za nimi idą tysiące pielgrzymów. Kalwaria została wpisana na listę światowego dziedzictwa UNESCO, bo jej kościoły i kaplice tworzą razem z krajobrazem wyjątkowy zespół."
    draft: true
    chunks:
      - pl: "W Kalwarii Zebrzydowskiej pod Krakowem, w jednym z najstarszych polskich sanktuariów, od wieków odbywa się misterium Męki Pańskiej."
        ru: "В Кальварии-Зебжидовской под Краковом, в одном из старейших польских святилищ, веками разыгрывается мистерия Страстей Господних."
        note: "misterium — мистерия"
      - pl: " Przez cały Wielki Tydzień aktorzy amatorzy, w większości mieszkańcy okolicznych wsi, odgrywają ostatnie dni życia Jezusa na wzgórzach i w kaplicach, a za nimi idą tysiące pielgrzymów."
        ru: "Всю Страстную неделю актёры-любители, по большей части жители окрестных деревень, разыгрывают последние дни жизни Иисуса на холмах и в часовнях, а за ними идут тысячи паломников."
        note: "pielgrzym — паломник"
      - pl: " Kalwaria została wpisana na listę światowego dziedzictwa UNESCO, bo jej kościoły i kaplice tworzą razem z krajobrazem wyjątkowy zespół."
        ru: "Кальвария внесена в список всемирного наследия ЮНЕСКО, потому что её храмы и часовни вместе с ландшафтом образуют исключительный ансамбль."
    words: { "polskich": polski, "wieków": wiek, "aktorzy": aktor, "amatorzy": amator, "większości": wiekszosc, "mieszkańcy": mieszkaniec, "wzgórzach": wzgorze, "tysiące": tysiac, "wpisana": wpisac, "listę": lista, "światowego": swiatowy, "dziedzictwa": dziedzictwo, "kościoły": kosciol, "tworzą": tworzyc, "wyjątkowy": wyjatkowy, "zespół": zespol }
  - clean: "W niektórych miejscowościach przetrwał też ludowy zwyczaj wieszania albo topienia kukły Judasza, która przedstawia ucznia, który zdradził Jezusa. Kukłę bije się kijami, ciągnie przez wieś, a na koniec pali albo wrzuca do rzeki. W 2019 roku taki obrzęd w Pruchniku na Podkarpaciu wywołał ostrą krytykę w Polsce i za granicą, bo kukła miała antysemickie cechy, a biskupi i władze lokalne odcięli się od niego. Ta sprawa pokazała, że nie wszystkie stare zwyczaje są niewinne i że tradycja wymaga czasem namysłu."
    draft: true
    chunks:
      - pl: "W niektórych miejscowościach przetrwał też ludowy zwyczaj wieszania albo topienia kukły Judasza, która przedstawia ucznia, który zdradził Jezusa."
        ru: "В некоторых местах сохранился и народный обычай вешать или топить чучело Иуды, изображающее ученика, предавшего Иисуса."
        note: "zdradzić — предать"
      - pl: " Kukłę bije się kijami, ciągnie przez wieś, a na koniec pali albo wrzuca do rzeki."
        ru: "Чучело бьют палками, тащат через деревню, а в конце сжигают или бросают в реку."
      - pl: " W 2019 roku taki obrzęd w Pruchniku na Podkarpaciu wywołał ostrą krytykę w Polsce i za granicą, bo kukła miała antysemickie cechy, a biskupi i władze lokalne odcięli się od niego."
        ru: "В 2019 году такой обряд в Прухнике в Подкарпатье вызвал резкую критику в Польше и за рубежом, потому что чучело имело антисемитские черты, а епископы и местные власти от него отмежевались."
        note: "odciąć się — отмежеваться"
      - pl: " Ta sprawa pokazała, że nie wszystkie stare zwyczaje są niewinne i że tradycja wymaga czasem namysłu."
        ru: "Эта история показала, что не все старые обычаи невинны и что традиция порой требует размышления."
