  - clean: "Najbardziej charakterystycznym symbolem polskiej Wielkanocy są malowane jajka. Mają różne nazwy, w zależności od techniki, którą je zdobiono. Kraszanki barwi się na jeden kolor, gotując je w wywarze z naturalnych składników: łupiny cebuli dają kolor brązowy, kora dębu czarny, młode żyto zielony, a sok z buraków różowy. Pisanki powstają dzięki technice batikowej: na skorupce rysuje się wzory roztopionym woskiem, a potem zanurza jajko w barwniku, więc miejsca pokryte woskiem zostają jasne. Drapanki to jajka, na których po zabarwieniu wydrapuje się wzór ostrym narzędziem, a oklejanki ozdabia się kolorowym papierem, tkaniną albo rdzeniem sitowia. Wzory są geometryczne albo roślinne i różnią się w zależności od regionu, a mistrzynie pisanek z Opolszczyzny, Kurpiów czy Podlasia biorą udział w konkursach i sprzedają swoje dzieła do muzeów. W domach dzieci najczęściej malują jajka farbkami albo flamastrami, a coraz popularniejsze są też naklejki termokurczliwe, które wystarczy założyć na jajko i włożyć do gorącej wody."
