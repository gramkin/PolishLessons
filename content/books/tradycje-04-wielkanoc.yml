chapter: 4
chapterTitle: "Wielkanoc"
chapterTitleRu: "Пасха"
level: B2
paragraphs:
  - clean: "Wielkanoc jest najstarszym i z religijnego punktu widzenia najważniejszym świętem chrześcijańskim. Upamiętnia zmartwychwstanie Jezusa, które według wiary katolików jest centrum całej ich religii. Dla wielu Polaków Boże Narodzenie jest jednak świętem bliższym i bardziej rodzinnym, a Wielkanoc kojarzy się raczej z wiosną, jajkami i wodą. Jej data zmienia się co roku: wypada w pierwszą niedzielę po pierwszej wiosennej pełni księżyca, czyli między dwudziestym drugim marca a dwudziestym piątym kwietnia. Prawosławni, których w Polsce mieszka najwięcej na Podlasiu, obchodzą ją według kalendarza juliańskiego, więc zwykle później, a tylko czasem tego samego dnia co katolicy."
    draft: true
    chunks:
      - pl: "Wielkanoc jest najstarszym i z religijnego punktu widzenia najważniejszym świętem chrześcijańskim."
        ru: "Пасха — древнейший и, с религиозной точки зрения, важнейший христианский праздник."
      - pl: " Upamiętnia zmartwychwstanie Jezusa, które według wiary katolików jest centrum całej ich religii."
        ru: "Она посвящена воскресению Иисуса, которое, по вере католиков, является центром всей их религии."
        note: "zmartwychwstanie — воскресение"
      - pl: " Dla wielu Polaków Boże Narodzenie jest jednak świętem bliższym i bardziej rodzinnym, a Wielkanoc kojarzy się raczej z wiosną, jajkami i wodą."
        ru: "Однако для многих поляков Рождество — праздник более близкий и семейный, а Пасха ассоциируется скорее с весной, яйцами и водой."
      - pl: " Jej data zmienia się co roku: wypada w pierwszą niedzielę po pierwszej wiosennej pełni księżyca, czyli między dwudziestym drugim marca a dwudziestym piątym kwietnia."
        ru: "Её дата меняется каждый год: она выпадает на первое воскресенье после первого весеннего полнолуния, то есть между двадцать вторым марта и двадцать пятым апреля."
        note: "pełnia — полнолуние"
      - pl: " Prawosławni, których w Polsce mieszka najwięcej na Podlasiu, obchodzą ją według kalendarza juliańskiego, więc zwykle później, a tylko czasem tego samego dnia co katolicy."
        ru: "Православные, которых в Польше больше всего живёт в Подляшье, отмечают её по юлианскому календарю, поэтому обычно позже и лишь иногда в один день с католиками."
    words: { "religijnego": religijny, "punktu": punkt, "świętem": swieto, "według": wedlug, "wiary": wiara, "centrum": centrum, "religii": religia, "bliższym": bliski, "rodzinnym": rodzinny, "kojarzy": kojarzyc, "raczej": raczej, "wiosną": wiosna, "jajkami": jajko, "data": data, "wypada": wypadac, "niedzielę": niedziela, "księżyca": ksiezyc, "czyli": czyli, "między": miedzy, "marca": marzec, "piątym": piaty, "kwietnia": kwiecien, "obchodzą": obchodzic, "kalendarza": kalendarz, "zwykle": zwykle }
  - clean: "Obchody zaczynają się tydzień wcześniej, w Niedzielę Palmową, która upamiętnia wjazd Jezusa do Jerozolimy. Ponieważ w Polsce nie rosną palmy, ich rolę pełnią gałązki wierzby z baziami, czyli puszystymi kotkami, które pojawiają się na krzakach na początku wiosny. Do wierzby dodaje się bukszpan, borówkę, suszone kwiaty, kolorowe wstążki i trawy, a gotowe palmy przynosi się do kościoła, żeby ksiądz je poświęcił. Dawniej połykano jedną bazię z poświęconej palmy, bo miało to chronić przed bólem gardła, a samą palmę zatykano za obrazem w domu albo wbijano w pole, żeby chroniła przed gradem i piorunami."
    draft: true
    chunks:
      - pl: "Obchody zaczynają się tydzień wcześniej, w Niedzielę Palmową, która upamiętnia wjazd Jezusa do Jerozolimy."
        ru: "Празднования начинаются неделей раньше, в Вербное воскресенье, посвящённое въезду Иисуса в Иерусалим."
        note: "wjazd — въезд"
      - pl: " Ponieważ w Polsce nie rosną palmy, ich rolę pełnią gałązki wierzby z baziami, czyli puszystymi kotkami, które pojawiają się na krzakach na początku wiosny."
        ru: "Поскольку в Польше не растут пальмы, их роль выполняют ветки ивы с «котиками», то есть пушистыми серёжками, которые появляются на кустах в начале весны."
        note: "bazie — вербные «котики»; wierzba — ива"
      - pl: " Do wierzby dodaje się bukszpan, borówkę, suszone kwiaty, kolorowe wstążki i trawy, a gotowe palmy przynosi się do kościoła, żeby ksiądz je poświęcił."
        ru: "К иве добавляют самшит, бруснику, сухие цветы, цветные ленты и травы, а готовые «пальмы» приносят в костёл, чтобы ксёндз их освятил."
        note: "bukszpan — самшит"
      - pl: " Dawniej połykano jedną bazię z poświęconej palmy, bo miało to chronić przed bólem gardła, a samą palmę zatykano za obrazem w domu albo wbijano w pole, żeby chroniła przed gradem i piorunami."
        ru: "Раньше глотали один «котик» с освящённой вербы, потому что это должно было защищать от боли в горле, а саму вербу затыкали за икону в доме или втыкали в поле, чтобы она защищала от града и молний."
        note: "grad — град; połykać — глотать"
    words: { "rosną": rosnac, "rolę": rola, "kotkami": kotek, "pojawiają": pojawiac, "początku": poczatek, "wiosny": wiosna, "dodaje": dodawac, "kwiaty": kwiat, "trawy": trawa, "przynosi": przynosic, "kościoła": kosciol, "ksiądz": ksiadz, "poświęcił": poswiecic, "poświęconej": poswiecic, "chronić": chronic, "bólem": bol, "gardła": gardlo, "obrazem": obraz, "pole": pole, "chroniła": chronic, "piorunami": piorun }
  - clean: "Najsłynniejsze palmy robi się w Lipnicy Murowanej w Małopolsce i na Kurpiach. W Lipnicy od 1958 roku odbywa się konkurs na najwyższą i najpiękniejszą palmę. Mieszkańcy przygotowują je przez wiele tygodni, a najwyższe mają po kilkanaście, a nawet ponad trzydzieści metrów, więc trzeba je ustawiać przy pomocy lin i całej grupy mężczyzn. Palmy kurpiowskie są niższe, ale bardzo kolorowe, ozdobione kwiatami z bibuły w kształcie róż, maków i lilii. Coraz więcej ludzi kupuje dziś gotowe palmy na targu przed kościołem, ale w wielu rodzinach dzieci wciąż robią je same, z babcią."
    draft: true
    chunks:
      - pl: "Najsłynniejsze palmy robi się w Lipnicy Murowanej w Małopolsce i na Kurpiach."
        ru: "Самые знаменитые вербы делают в Липнице-Мурованой в Малопольше и на Курпях."
      - pl: " W Lipnicy od 1958 roku odbywa się konkurs na najwyższą i najpiękniejszą palmę."
        ru: "В Липнице с 1958 года проходит конкурс на самую высокую и самую красивую вербу."
      - pl: " Mieszkańcy przygotowują je przez wiele tygodni, a najwyższe mają po kilkanaście, a nawet ponad trzydzieści metrów, więc trzeba je ustawiać przy pomocy lin i całej grupy mężczyzn."
        ru: "Жители готовят их много недель, а самые высокие достигают десяти-пятнадцати, а то и более тридцати метров, так что их приходится ставить с помощью верёвок и целой группы мужчин."
        note: "lina — канат, верёвка"
      - pl: " Palmy kurpiowskie są niższe, ale bardzo kolorowe, ozdobione kwiatami z bibuły w kształcie róż, maków i lilii."
        ru: "Курпёвские вербы ниже, но очень красочные, украшенные цветами из папиросной бумаги в виде роз, маков и лилий."
      - pl: " Coraz więcej ludzi kupuje dziś gotowe palmy na targu przed kościołem, ale w wielu rodzinach dzieci wciąż robią je same, z babcią."
        ru: "Всё больше людей покупает сегодня готовые вербы на рынке перед костёлом, но во многих семьях дети по-прежнему делают их сами, с бабушкой."
    words: { "konkurs": konkurs, "przygotowują": przygotowywac, "kilkanaście": kilkanascie, "ponad": ponad, "trzydzieści": trzydziesci, "metrów": metr, "grupy": grupa, "niższe": niski, "ozdobione": ozdobic, "kwiatami": kwiat, "kształcie": ksztalt, "kupuje": kupowac, "targu": targ, "kościołem": kosciol, "babcią": babcia }
  - clean: "Ostatni tydzień przed Wielkanocą nazywa się Wielkim Tygodniem. W Wielki Czwartek wierni wspominają Ostatnią Wieczerzę, a w Wielki Piątek śmierć Jezusa na krzyżu. Wielki Piątek jest dniem ścisłego postu i ciszy. W kościołach milkną dzwony, a zamiast nich słychać drewniane kołatki, które wydają suchy, stukający dźwięk. Mówi się, że dzwony odleciały do Rzymu i wrócą dopiero w noc zmartwychwstania."
    draft: true
    chunks:
      - pl: "Ostatni tydzień przed Wielkanocą nazywa się Wielkim Tygodniem."
        ru: "Последняя неделя перед Пасхой называется Страстной (Великой) неделей."
      - pl: " W Wielki Czwartek wierni wspominają Ostatnią Wieczerzę, a w Wielki Piątek śmierć Jezusa na krzyżu."
        ru: "В Великий четверг верующие вспоминают Тайную вечерю, а в Великую пятницу — смерть Иисуса на кресте."
        note: "Ostatnia Wieczerza — Тайная вечеря"
      - pl: " Wielki Piątek jest dniem ścisłego postu i ciszy."
        ru: "Великая пятница — день строгого поста и тишины."
      - pl: " W kościołach milkną dzwony, a zamiast nich słychać drewniane kołatki, które wydają suchy, stukający dźwięk."
        ru: "В костёлах умолкают колокола, а вместо них слышны деревянные трещотки, издающие сухой, стучащий звук."
        note: "kołatka — трещотка"
      - pl: " Mówi się, że dzwony odleciały do Rzymu i wrócą dopiero w noc zmartwychwstania."
        ru: "Говорят, что колокола улетели в Рим и вернутся только в ночь воскресения."
    words: { "wierni": wierny, "wspominają": wspominac, "krzyżu": krzyz, "ścisłego": scisly, "ciszy": cisza, "kościołach": kosciol, "dzwony": dzwon, "zamiast": zamiast, "słychać": slychac, "suchy": suchy, "dźwięk": dzwiek, "odleciały": odleciec, "dopiero": dopiero }
  - clean: "W każdym kościele przygotowuje się wtedy Grób Pański, czyli dekorację przedstawiającą grób, w którym złożono ciało Jezusa. Ludzie chodzą od kościoła do kościoła, żeby je zobaczyć i chwilę się pomodlić. Polskie groby bywają bardzo pomysłowe i często nawiązują do wydarzeń z życia kraju. W czasach zaborów i komunizmu pojawiały się w nich symbole patriotyczne, na przykład w latach osiemdziesiątych znak Solidarności albo krzyże z więzień, a dziś bywają w nich odniesienia do wojen, katastrof czy problemów społecznych. Przy grobie stoją na straży strażacy, harcerze albo żołnierze. Na Podkarpaciu straż pełnią Turki, mężczyźni w kolorowych, orientalnych mundurach i turbanach, a zwyczaj ten według tradycji przypomina zwycięstwo Jana Trzeciego Sobieskiego pod Wiedniem w 1683 roku. W Wielkanoc Turki tańczą i maszerują, a ich musztra budzi wielkie zainteresowanie turystów."
    draft: true
    chunks:
      - pl: "W każdym kościele przygotowuje się wtedy Grób Pański, czyli dekorację przedstawiającą grób, w którym złożono ciało Jezusa."
        ru: "В каждом костёле тогда устраивают Гроб Господень, то есть декорацию, изображающую гробницу, в которую положили тело Иисуса."
      - pl: " Ludzie chodzą od kościoła do kościoła, żeby je zobaczyć i chwilę się pomodlić."
        ru: "Люди ходят от костёла к костёлу, чтобы их увидеть и немного помолиться."
      - pl: " Polskie groby bywają bardzo pomysłowe i często nawiązują do wydarzeń z życia kraju."
        ru: "Польские гробы бывают очень изобретательными и часто отсылают к событиям в жизни страны."
        note: "pomysłowy — изобретательный"
      - pl: " W czasach zaborów i komunizmu pojawiały się w nich symbole patriotyczne, na przykład w latach osiemdziesiątych znak Solidarności albo krzyże z więzień, a dziś bywają w nich odniesienia do wojen, katastrof czy problemów społecznych."
        ru: "Во времена разделов и коммунизма в них появлялись патриотические символы, например в восьмидесятые годы знак «Солидарности» или кресты из тюрем, а сегодня в них бывают отсылки к войнам, катастрофам или социальным проблемам."
      - pl: " Przy grobie stoją na straży strażacy, harcerze albo żołnierze."
        ru: "У гроба стоят в карауле пожарные, харцеры или солдаты."
        note: "harcerz — харцер, польский скаут"
      - pl: " Na Podkarpaciu straż pełnią Turki, mężczyźni w kolorowych, orientalnych mundurach i turbanach, a zwyczaj ten według tradycji przypomina zwycięstwo Jana Trzeciego Sobieskiego pod Wiedniem w 1683 roku."
        ru: "В Подкарпатье караул несут «турки», мужчины в цветных восточных мундирах и тюрбанах, и этот обычай, по преданию, напоминает о победе Яна Третьего Собеского под Веной в 1683 году."
      - pl: " W Wielkanoc Turki tańczą i maszerują, a ich musztra budzi wielkie zainteresowanie turystów."
        ru: "На Пасху «турки» танцуют и маршируют, а их строевые упражнения вызывают большой интерес туристов."
        note: "musztra — строевая подготовка"
