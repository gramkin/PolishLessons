  - clean: "Śniadanie zaczyna się od dzielenia się poświęconym jajkiem, podobnie jak w Wigilię dzieli się opłatkiem. Wszyscy składają sobie życzenia zdrowia, radości i wesołego alleluja, a potem siadają do stołu, na którym po czterdziestu dniach postu jest wszystko, czego brakowało. Na stole stoi żurek z jajkiem i białą kiełbasą, podawany czasem w wydrążonym bochenku chleba, a obok szynka, pasztet, jajka faszerowane i sałatka jarzynowa. Do mięsa podaje się chrzan i ćwikłę, czyli tarte buraki z chrzanem, ostrą i słodkawą jednocześnie. Na stole wielkanocnym nie może zabraknąć ciast: wysokiej baby drożdżowej, polanej lukrem, sernika i mazurka, płaskiego ciasta ozdobionego bakaliami, czekoladą i kolorowymi wzorami. W rodzinach z dawnych Kresów przygotowuje się też paschę, deser z twarogu, masła, jajek i bakalii, w kształcie piramidy. Na środku stołu stoi baranek z cukru, a całość ozdabia się bukszpanem, rzeżuchą wyhodowaną na watce i żonkilami. Po śniadaniu dzieci, a czasem i dorośli, bawią się w stukanie jajkami. Dwie osoby uderzają czubkami swoich ugotowanych jajek, a ten, czyje jajko się nie rozbije, zabiera jajko przeciwnika. Doświadczeni gracze wiedzą, które jajka są najtwardsze, i starannie je wybierają, a niektórzy podobno oszukują, używając jajek z drewna. Pierwszy dzień Wielkanocy spędza się zwykle w gronie najbliższej rodziny, spokojnie, podobnie jak pierwszy dzień Bożego Narodzenia. Dzieci szukają w ogrodzie albo w mieszkaniu prezentów od zajączka, czyli słodyczy i drobnych upominków, choć ten zwyczaj przyszedł z Niemiec i nie wszędzie jest znany."
    draft: true
