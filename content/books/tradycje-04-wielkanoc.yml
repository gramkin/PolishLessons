  - clean: "Zwyczaj jest bardzo stary, a jego nazwa łączy w sobie dwa różne obrzędy. Śmigus oznaczał smaganie, czyli lekkie bicie wierzbowymi witkami albo palmą po nogach, które miało przynosić zdrowie i siłę. Dyngus był natomiast zwyczajem chodzenia po domach, w czasie którego chłopcy domagali się od gospodarzy wykupu, zwykle w postaci jajek, ciasta albo wódki. Z czasem oba zwyczaje połączyły się, a woda stała się najważniejszym elementem zabawy. Woda symbolizowała oczyszczenie i wiosenne odrodzenie przyrody, a dziewczyna, której nikt nie oblał, mogła się martwić, że nie jest atrakcyjna i nie wyjdzie w tym roku za mąż. Już w średniowieczu biskupi próbowali zakazać tej zabawy jako zbyt swawolnej, oczywiście bezskutecznie."
