  - clean: "Moc leku nie zawsze objawiała się jednakowo. Raz, bardzo wcześnie w mojej karierze, zawiódł mnie zupełnie; od tego czasu byłem zmuszony niejednokrotnie podwoić dawkę, a raz, z nieskończonym ryzykiem śmierci, potroić ją; i te rzadkie niepewności rzucały dotąd jedyny cień na moje zadowolenie. Teraz jednak, w świetle porannego wypadku, zauważyłem, że o ile na początku trudność polegała na zrzuceniu ciała Jekylla, o tyle ostatnio przeszła ona stopniowo, ale zdecydowanie na drugą stronę."
    en: "The power of the drug had not been always equally displayed. Once, very early in my career, it had totally failed me; since then I had been obliged on more than one occasion to double, and once, with infinite risk of death, to treble the amount; and these rare uncertainties had cast hitherto the sole shadow on my contentment. Now, however, and in the light of that morning’s accident, I was led to remark that whereas, in the beginning, the difficulty had been to throw off the body of Jekyll, it had of late gradually but decidedly transferred itself to the other side."
