  - clean: "Musiałem wpatrywać się w nią blisko pół minuty, pogrążony w samym otępieniu zdumienia, zanim przerażenie obudziło się w mojej piersi, nagłe i wstrząsające jak brzęk cymbałów; i zerwawszy się z łóżka, rzuciłem się do lustra. Na widok, jaki ukazał się moim oczom, krew moja zmieniła się w coś przeraźliwie rzadkiego i lodowatego. Tak, położyłem się spać jako Henry Jekyll, obudziłem się jako Edward Hyde. Jak to wyjaśnić? — pytałem sam siebie; a potem, z nowym skokiem przerażenia: jak temu zaradzić?"
