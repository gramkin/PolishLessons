  - clean: "On, powiadam — nie mogę powiedzieć: ja. To dziecię piekła nie miało w sobie nic ludzkiego; nic w nim nie żyło prócz strachu i nienawiści. A gdy w końcu, sądząc, że woźnica zaczął nabierać podejrzeń, odprawił dorożkę i zaryzykował pieszo, w źle dopasowanym ubraniu, rzucając się w oczy, pośród nocnych przechodniów, te dwie podłe namiętności szalały w nim jak burza. Szedł szybko, ścigany przez swoje lęki, mamrocząc do siebie, przemykając się mniej uczęszczanymi ulicami, licząc minuty, które wciąż dzieliły go od północy. Raz zagadnęła go jakaś kobieta, oferując, zdaje się, pudełko zapałek. Uderzył ją w twarz, a ona uciekła."
    en: "He, I say—I cannot say, I. That child of Hell had nothing human; nothing lived in him but fear and hatred. And when at last, thinking the driver had begun to grow suspicious, he discharged the cab and ventured on foot, attired in his misfitting clothes, an object marked out for observation, into the midst of the nocturnal passengers, these two base passions raged within him like a tempest. He walked fast, hunted by his fears, chattering to himself, skulking through the less frequented thoroughfares, counting the minutes that still divided him from midnight. Once a woman spoke to him, offering, I think, a box of lights. He smote her in the face, and she fled."
    draft: true
    chunks:
      - pl: "On, powiadam — nie mogę powiedzieć: ja."
        ru: "Он, говорю я, — не могу сказать «я»."
