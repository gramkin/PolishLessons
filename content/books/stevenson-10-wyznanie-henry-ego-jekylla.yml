paragraphs:
  - clean: "Urodziłem się w roku 18… jako dziedzic wielkiego majątku, obdarzony ponadto znakomitymi zdolnościami, z natury skłonny do pracowitości, spragniony szacunku mądrych i dobrych spośród bliźnich, a więc, jak można by przypuszczać, z wszelkimi rękojmiami zaszczytnej i wybitnej przyszłości. I rzeczywiście najgorszą z moich wad była pewna niecierpliwa wesołość usposobienia, taka, jaka dała szczęście wielu ludziom, ale którą trudno mi było pogodzić z władczym pragnieniem, by nosić głowę wysoko i okazywać publicznie oblicze poważniejsze niż zwykle."
    en: "I was born in the year 18— to a large fortune, endowed besides with excellent parts, inclined by nature to industry, fond of the respect of the wise and good among my fellowmen, and thus, as might have been supposed, with every guarantee of an honourable and distinguished future. And indeed the worst of my faults was a certain impatient gaiety of disposition, such as has made the happiness of many, but such as I found it hard to reconcile with my imperious desire to carry my head high, and wear a more than commonly grave countenance before the public."
    draft: true
    chunks:
      - pl: "Urodziłem się w roku 18… jako dziedzic wielkiego majątku,"
        ru: "Я родился в 18… году наследником большого состояния,"
      - pl: " obdarzony ponadto znakomitymi zdolnościami, z natury skłonny do pracowitości,"
        ru: "наделённый к тому же превосходными способностями, от природы склонный к трудолюбию,"
        note: "obdarzony — наделённый; pracowitość — трудолюбие"
      - pl: " spragniony szacunku mądrych i dobrych spośród bliźnich,"
        ru: "жаждущий уважения мудрых и добрых из числа ближних,"
        note: "spragniony — жаждущий"
      - pl: " a więc, jak można by przypuszczać, z wszelkimi rękojmiami zaszczytnej i wybitnej przyszłości."
        ru: "а значит, как можно было предположить, со всеми залогами почётного и блестящего будущего."
        note: "rękojmia — залог, порука; zaszczytny — почётный"
      - pl: " I rzeczywiście najgorszą z moich wad była pewna niecierpliwa wesołość usposobienia,"
        ru: "И в самом деле, худшим из моих недостатков была некая нетерпеливая весёлость нрава,"
      - pl: " taka, jaka dała szczęście wielu ludziom,"
        ru: "такая, что составила счастье многих,"
      - pl: " ale którą trudno mi było pogodzić z władczym pragnieniem, by nosić głowę wysoko"
        ru: "но которую мне трудно было примирить с властным желанием высоко держать голову"
        note: "władczy — властный"
      - pl: " i okazywać publicznie oblicze poważniejsze niż zwykle."
        ru: "и являть на людях лицо серьёзнее обычного."
    words: { "dziedzic": dziedzic, "znakomitymi": znakomity, "skłonny": sklonny, "spragniony": spragniony, "wybitnej": wybitny, "publicznie": publicznie }
  - clean: "Stąd wzięło się, że ukrywałem swoje przyjemności; i że gdy doszedłem do wieku rozwagi i zacząłem się rozglądać wokół siebie i oceniać swoje postępy i pozycję w świecie, byłem już uwikłany w głęboką dwoistość życia. Niejeden człowiek obnosiłby się nawet z takimi wybrykami, jakich się dopuszczałem; ale z powodu wysokich celów, jakie sobie postawiłem, patrzyłem na nie i ukrywałem je z niemal chorobliwym poczuciem wstydu. To więc raczej wymagająca natura moich dążeń niż jakieś szczególne upodlenie moich wad uczyniła mnie tym, kim byłem, i przecięła we mnie, głębszym rowem niż u większości ludzi, te dziedziny dobra i zła, które dzielą i zarazem składają podwójną naturę człowieka."
    en: "Hence it came about that I concealed my pleasures; and that when I reached years of reflection, and began to look round me and take stock of my progress and position in the world, I stood already committed to a profound duplicity of life. Many a man would have even blazoned such irregularities as I was guilty of; but from the high views that I had set before me, I regarded and hid them with an almost morbid sense of shame. It was thus rather the exacting nature of my aspirations than any particular degradation in my faults, that made me what I was, and, with even a deeper trench than in the majority of men, severed in me those provinces of good and ill which divide and compound man’s dual nature."
    draft: true
    chunks:
      - pl: "Stąd wzięło się, że ukrywałem swoje przyjemności;"
        ru: "Отсюда и вышло, что я скрывал свои удовольствия;"
      - pl: " i że gdy doszedłem do wieku rozwagi i zacząłem się rozglądać wokół siebie"
        ru: "и что, когда я достиг зрелых лет и начал оглядываться вокруг"
        note: "rozwaga — рассудительность"
      - pl: " i oceniać swoje postępy i pozycję w świecie,"
        ru: "и подводить итог своим успехам и положению в свете,"
      - pl: " byłem już uwikłany w głęboką dwoistość życia."
        ru: "я был уже погружён в глубокую двойственность жизни."
        note: "uwikłany — запутавшийся, втянутый; dwoistość — двойственность"
      - pl: " Niejeden człowiek obnosiłby się nawet z takimi wybrykami, jakich się dopuszczałem;"
        ru: "Иной человек даже выставлял бы напоказ такие проказы, в которых я был повинен;"
        note: "obnosić się z czymś — выставлять напоказ; dopuścić się czegoś — совершить (проступок)"
      - pl: " ale z powodu wysokich celów, jakie sobie postawiłem,"
        ru: "но из-за высоких целей, которые я перед собой поставил,"
      - pl: " patrzyłem na nie i ukrywałem je z niemal chorobliwym poczuciem wstydu."
        ru: "я смотрел на них и скрывал их с почти болезненным чувством стыда."
      - pl: " To więc raczej wymagająca natura moich dążeń niż jakieś szczególne upodlenie moich wad"
        ru: "Итак, скорее требовательный характер моих стремлений, чем какая-то особая низость моих пороков,"
        note: "dążenie — стремление; upodlenie — падение, низость"
      - pl: " uczyniła mnie tym, kim byłem,"
        ru: "сделал меня тем, кем я был,"
      - pl: " i przecięła we mnie, głębszym rowem niż u większości ludzi,"
        ru: "и прорезал во мне, более глубоким рвом, чем у большинства людей,"
        note: "rów — ров"
      - pl: " te dziedziny dobra i zła, które dzielą i zarazem składają podwójną naturę człowieka."
        ru: "те области добра и зла, что разделяют и вместе составляют двойственную природу человека."
    words: { "oceniać": oceniac, "postępy": postep, "szczególne": szczegolny, "przecięła": przeciac, "dziedziny": dziedzina, "podwójną": podwojny }
  - clean: "W tym położeniu zmuszony byłem głęboko i uporczywie rozmyślać nad tym twardym prawem życia, które leży u korzeni religii i jest jednym z najobfitszych źródeł cierpienia. Choć byłem tak głęboko dwulicowy, w żadnym razie nie byłem hipokrytą; obie strony mojej natury były śmiertelnie poważne; nie byłem bardziej sobą, gdy odrzucałem hamulce i pogrążałem się w hańbie, niż wtedy, gdy w świetle dnia pracowałem nad rozwojem wiedzy albo nad ulżeniem smutkowi i cierpieniu."
    en: "In this case, I was driven to reflect deeply and inveterately on that hard law of life, which lies at the root of religion and is one of the most plentiful springs of distress. Though so profound a double-dealer, I was in no sense a hypocrite; both sides of me were in dead earnest; I was no more myself when I laid aside restraint and plunged in shame, than when I laboured, in the eye of day, at the furtherance of knowledge or the relief of sorrow and suffering."
    draft: true
    chunks:
      - pl: "W tym położeniu zmuszony byłem głęboko i uporczywie rozmyślać nad tym twardym prawem życia,"
        ru: "В таком положении я был вынужден глубоко и неотступно размышлять над тем суровым законом жизни,"
      - pl: " które leży u korzeni religii i jest jednym z najobfitszych źródeł cierpienia."
        ru: "который лежит в корне религии и является одним из самых обильных источников страдания."
        note: "obfity — обильный"
      - pl: " Choć byłem tak głęboko dwulicowy, w żadnym razie nie byłem hipokrytą;"
        ru: "Хотя я был таким законченным двуличником, лицемером я ни в коей мере не был;"
        note: "dwulicowy — двуличный"
      - pl: " obie strony mojej natury były śmiertelnie poważne;"
        ru: "обе мои стороны были смертельно серьёзны;"
      - pl: " nie byłem bardziej sobą, gdy odrzucałem hamulce i pogrążałem się w hańbie,"
        ru: "я был ничуть не больше собой, когда отбрасывал узду и погружался в позор,"
        note: "hamulec — тормоз, узда"
      - pl: " niż wtedy, gdy w świetle dnia pracowałem nad rozwojem wiedzy albo nad ulżeniem smutkowi i cierpieniu."
        ru: "чем тогда, когда при свете дня трудился ради развития знания или облегчения горя и страданий."
    words: { "śmiertelnie": smiertelnie, "odrzucałem": odrzucac, "hamulce": hamulec, "pogrążałem": pograzac, "hańbie": hanba }
  - clean: "I zdarzyło się, że kierunek moich badań naukowych, wiodący całkowicie ku mistycznemu i transcendentalnemu, oddziałał na tę świadomość nieustannej wojny między członkami mojej istoty i rzucił na nią silne światło. Z każdym dniem, i z obu stron mego umysłu, moralnej i intelektualnej, zbliżałem się więc stale do tej prawdy, przez której częściowe odkrycie zostałem skazany na tak straszliwą katastrofę: że człowiek nie jest naprawdę jeden, lecz naprawdę dwoisty. Mówię dwoisty, bo stan mojej wiedzy nie wychodzi poza ten punkt."
    en: "And it chanced that the direction of my scientific studies, which led wholly towards the mystic and the transcendental, reacted and shed a strong light on this consciousness of the perennial war among my members. With every day, and from both sides of my intelligence, the moral and the intellectual, I thus drew steadily nearer to that truth, by whose partial discovery I have been doomed to such a dreadful shipwreck: that man is not truly one, but truly two. I say two, because the state of my own knowledge does not pass beyond that point."
    draft: true
    chunks:
      - pl: "I zdarzyło się, że kierunek moich badań naukowych, wiodący całkowicie ku mistycznemu i transcendentalnemu,"
        ru: "И случилось так, что направление моих научных занятий, целиком ведущее к мистическому и трансцендентальному,"
      - pl: " oddziałał na tę świadomość nieustannej wojny między członkami mojej istoty i rzucił na nią silne światło."
        ru: "повлияло на это сознание непрестанной войны между частями моего существа и пролило на него яркий свет."
        note: "oddziałać — повлиять"
      - pl: " Z każdym dniem, i z obu stron mego umysłu, moralnej i intelektualnej,"
        ru: "С каждым днём, и с обеих сторон моего разума, нравственной и умственной,"
      - pl: " zbliżałem się więc stale do tej prawdy, przez której częściowe odkrycie zostałem skazany na tak straszliwą katastrofę:"
        ru: "я неуклонно приближался к той истине, частичное открытие которой обрекло меня на такое ужасное крушение:"
      - pl: " że człowiek nie jest naprawdę jeden, lecz naprawdę dwoisty."
        ru: "что человек на самом деле не един, но поистине двойствен."
        note: "dwoisty — двойственный"
      - pl: " Mówię dwoisty, bo stan mojej wiedzy nie wychodzi poza ten punkt."
        ru: "Я говорю «двойствен», потому что мои знания не простираются дальше этого."
    words: { "naukowych": naukowy, "świadomość": swiadomosc, "moralnej": moralny, "częściowe": czesciowy, "skazany": skazac }
  - clean: "Inni pójdą dalej, inni prześcigną mnie na tej samej drodze; i ośmielam się zgadywać, że człowiek okaże się w końcu jedynie wspólnotą rozmaitych, niezgodnych i niezależnych mieszkańców. Ja ze swej strony, z natury mego życia, posuwałem się niezawodnie w jednym kierunku i tylko w jednym. To po stronie moralnej i we własnej osobie nauczyłem się rozpoznawać zupełną i pierwotną dwoistość człowieka; widziałem, że z dwóch natur, które walczyły na polu mojej świadomości, nawet jeśli słusznie można było powiedzieć, że jestem którąś z nich, to tylko dlatego, że w gruncie rzeczy byłem obiema; i od wczesnych lat, zanim jeszcze bieg moich odkryć naukowych zaczął podsuwać choćby nagą możliwość takiego cudu, nauczyłem się z upodobaniem rozmyślać, jak nad ukochanym marzeniem, o rozdzieleniu tych pierwiastków."
    en: "Others will follow, others will outstrip me on the same lines; and I hazard the guess that man will be ultimately known for a mere polity of multifarious, incongruous and independent denizens. I, for my part, from the nature of my life, advanced infallibly in one direction and in one direction only. It was on the moral side, and in my own person, that I learned to recognise the thorough and primitive duality of man; I saw that, of the two natures that contended in the field of my consciousness, even if I could rightly be said to be either, it was only because I was radically both; and from an early date, even before the course of my scientific discoveries had begun to suggest the most naked possibility of such a miracle, I had learned to dwell with pleasure, as a beloved daydream, on the thought of the separation of these elements."
    draft: true
    chunks:
      - pl: "Inni pójdą dalej, inni prześcigną mnie na tej samej drodze;"
        ru: "Другие последуют за мной, другие обгонят меня на том же пути;"
        note: "prześcignąć — обогнать"
      - pl: " i ośmielam się zgadywać, że człowiek okaże się w końcu jedynie wspólnotą rozmaitych, niezgodnych i niezależnych mieszkańców."
        ru: "и я рискну предположить, что в конце концов человек окажется лишь содружеством разнообразных, несовместимых и независимых обитателей."
        note: "wspólnota — сообщество; niezgodny — несовместимый"
      - pl: " Ja ze swej strony, z natury mego życia, posuwałem się niezawodnie w jednym kierunku i tylko w jednym."
        ru: "Я же, по самой природе моей жизни, неуклонно продвигался в одном направлении, и только в одном."
        note: "niezawodnie — неуклонно, безошибочно"
      - pl: " To po stronie moralnej i we własnej osobie nauczyłem się rozpoznawać zupełną i pierwotną dwoistość człowieka;"
        ru: "Именно в нравственной области и на собственном примере я научился распознавать полную и изначальную двойственность человека;"
        note: "pierwotny — изначальный"
      - pl: " widziałem, że z dwóch natur, które walczyły na polu mojej świadomości,"
        ru: "я видел, что из двух натур, боровшихся на поле моего сознания,"
      - pl: " nawet jeśli słusznie można było powiedzieć, że jestem którąś z nich,"
        ru: "даже если обо мне по праву можно было сказать, что я — одна из них,"
      - pl: " to tylko dlatego, że w gruncie rzeczy byłem obiema;"
        ru: "то лишь потому, что по существу я был обеими;"
        note: "w gruncie rzeczy — по сути"
      - pl: " i od wczesnych lat, zanim jeszcze bieg moich odkryć naukowych zaczął podsuwać choćby nagą możliwość takiego cudu,"
        ru: "и с ранних пор, ещё прежде чем ход моих научных открытий начал подсказывать хотя бы голую возможность такого чуда,"
        note: "podsuwać — подсказывать"
      - pl: " nauczyłem się z upodobaniem rozmyślać, jak nad ukochanym marzeniem, o rozdzieleniu tych pierwiastków."
        ru: "я научился с наслаждением мечтать, как о заветной грёзе, о разделении этих начал."
        note: "pierwiastek — начало, элемент"
    words: { "wspólnotą": wspolnota, "niezależnych": niezalezny, "moralnej": moralny, "pierwotną": pierwotny, "gruncie": grunt, "pierwiastków": pierwiastek }
  - clean: "Gdyby każdy z nich, mówiłem sobie, mógł zamieszkać w odrębnej tożsamości, życie zostałoby uwolnione od wszystkiego, co nie do zniesienia; niesprawiedliwy mógłby iść swoją drogą, wolny od dążeń i wyrzutów sumienia swego prawszego bliźniaka; a sprawiedliwy mógłby kroczyć wytrwale i bezpiecznie swoją drogą w górę, czyniąc dobro, w którym znajdował przyjemność, i nie narażony już na hańbę i pokutę z ręki tego obcego mu zła. Przekleństwem ludzkości było, że te niedobrane wiązki zostały tak razem związane… że w udręczonym łonie świadomości ci biegunowo przeciwni bliźniacy muszą nieustannie walczyć. Jak więc ich rozdzielić?"
    en: "If each, I told myself, could be housed in separate identities, life would be relieved of all that was unbearable; the unjust might go his way, delivered from the aspirations and remorse of his more upright twin; and the just could walk steadfastly and securely on his upward path, doing the good things in which he found his pleasure, and no longer exposed to disgrace and penitence by the hands of this extraneous evil. It was the curse of mankind that these incongruous faggots were thus bound together—that in the agonised womb of consciousness, these polar twins should be continuously struggling. How, then were they dissociated?"
    draft: true
    chunks:
      - pl: "Gdyby każdy z nich, mówiłem sobie, mógł zamieszkać w odrębnej tożsamości,"
        ru: "Если бы каждое из них, говорил я себе, могло поселиться в отдельной личности,"
        note: "odrębny — отдельный; tożsamość — тождество, личность"
      - pl: " życie zostałoby uwolnione od wszystkiego, co nie do zniesienia;"
        ru: "жизнь избавилась бы от всего невыносимого;"
        note: "nie do zniesienia — невыносимый"
      - pl: " niesprawiedliwy mógłby iść swoją drogą, wolny od dążeń i wyrzutów sumienia swego prawszego bliźniaka;"
        ru: "неправедный мог бы идти своей дорогой, свободный от стремлений и угрызений совести своего более праведного близнеца;"
        note: "wyrzuty sumienia — угрызения совести; bliźniak — близнец"
      - pl: " a sprawiedliwy mógłby kroczyć wytrwale i bezpiecznie swoją drogą w górę,"
        ru: "а праведный мог бы твёрдо и уверенно шагать своим путём вверх,"
        note: "kroczyć — шагать, ступать"
      - pl: " czyniąc dobro, w którym znajdował przyjemność,"
        ru: "творя добро, в котором находил радость,"
      - pl: " i nie narażony już na hańbę i pokutę z ręki tego obcego mu zła."
        ru: "и не подвергаясь больше позору и покаянию по вине этого чуждого ему зла."
        note: "pokuta — покаяние"
      - pl: " Przekleństwem ludzkości było, że te niedobrane wiązki zostały tak razem związane…"
        ru: "Проклятием человечества было то, что эти несовместимые вязанки оказались связаны вместе…"
        note: "niedobrany — неподходящий; wiązka — вязанка"
      - pl: " że w udręczonym łonie świadomości ci biegunowo przeciwni bliźniacy muszą nieustannie walczyć."
        ru: "что в измученном лоне сознания эти полярные близнецы обречены непрестанно бороться."
        note: "łono — лоно; biegunowy — полярный"
      - pl: " Jak więc ich rozdzielić?"
