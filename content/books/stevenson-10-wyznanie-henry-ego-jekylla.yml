  - clean: "Ujrzał teraz całą potworność tego stworzenia, które dzieliło z nim niektóre zjawiska świadomości i było razem z nim współdziedzicem śmierci: a poza tymi więzami wspólnoty, które same w sobie stanowiły najdotkliwszą część jego udręki, myślał o Hydzie, mimo całej jego energii życiowej, jak o czymś nie tylko piekielnym, ale nieorganicznym. To było przerażające: że szlam otchłani zdawał się wydawać krzyki i głosy; że bezkształtny pył gestykulował i grzeszył; że to, co było martwe i nie miało kształtu, uzurpowało sobie funkcje życia."
