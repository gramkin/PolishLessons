  - clean: "Uporządkowałem więc ubranie, jak mogłem najlepiej, i przywoławszy przejeżdżającą dorożkę, pojechałem do hotelu przy Portland Street, którego nazwę przypadkiem pamiętałem. Na mój widok (który był doprawdy dość komiczny, jakkolwiek tragiczny los okrywały te szaty) woźnica nie mógł ukryć wesołości. Zgrzytnąłem na niego zębami w porywie diabelskiej furii; i uśmiech zwiądł na jego twarzy… na szczęście dla niego, a jeszcze większym dla mnie, bo w następnej chwili z pewnością ściągnąłbym go z kozła. W zajeździe, gdy wszedłem, rozejrzałem się z tak czarną miną, że obsługa zadrżała; nie wymienili przy mnie ani jednego spojrzenia; lecz usłużnie przyjęli moje polecenia, zaprowadzili mnie do osobnego pokoju i przynieśli przybory do pisania."
