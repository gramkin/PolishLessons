  - clean: "Tej nocy doszedłem do fatalnego rozdroża. Gdybym przystąpił do swego odkrycia w szlachetniejszym duchu, gdybym zaryzykował doświadczenie pod władzą wspaniałomyślnych czy pobożnych dążeń, wszystko musiałoby potoczyć się inaczej, i z tych mąk śmierci i narodzin wyszedłbym aniołem zamiast diabła. Lek nie działał wybiórczo; nie był ani diabelski, ani boski; tylko wstrząsnął drzwiami więzienia mego usposobienia; i jak więźniowie z Filippi, wybiegło to, co było w środku."
