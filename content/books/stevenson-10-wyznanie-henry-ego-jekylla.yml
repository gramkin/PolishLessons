  - clean: "Minął mniej więcej tydzień, a ja kończę teraz to wyznanie pod działaniem ostatniego ze starych proszków. To więc ostatni raz, chyba że stanie się cud, kiedy Henry Jekyll może myśleć własne myśli albo widzieć własną twarz (jakże smutnie teraz zmienioną!) w lustrze. Nie wolno mi też zbyt długo zwlekać z zakończeniem pisania; bo jeśli moja opowieść dotąd uniknęła zniszczenia, to dzięki połączeniu wielkiej ostrożności i wielkiego szczęścia. Gdyby bóle przemiany zaskoczyły mnie przy pisaniu, Hyde podrze to na strzępy; ale jeśli upłynie trochę czasu po tym, jak to odłożę, jego zdumiewające samolubstwo i ograniczenie do chwili obecnej prawdopodobnie znów ocalą to od jego małpiej złośliwości."
    en: "About a week has passed, and I am now finishing this statement under the influence of the last of the old powders. This, then, is the last time, short of a miracle, that Henry Jekyll can think his own thoughts or see his own face (now how sadly altered!) in the glass. Nor must I delay too long to bring my writing to an end; for if my narrative has hitherto escaped destruction, it has been by a combination of great prudence and great good luck. Should the throes of change take me in the act of writing it, Hyde will tear it in pieces; but if some time shall have elapsed after I have laid it by, his wonderful selfishness and circumscription to the moment will probably save it once again from the action of his ape-like spite."
