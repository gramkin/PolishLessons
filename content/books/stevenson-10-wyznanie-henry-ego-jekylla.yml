  - clean: "Hyde miał na ustach piosenkę, gdy mieszał napój, a pijąc go, wzniósł toast za zmarłego. Męki przemiany jeszcze go nie przestały szarpać, gdy Henry Jekyll, ze łzami wdzięczności i skruchy płynącymi strumieniem, padł na kolana i wzniósł złożone ręce do Boga. Zasłona dogadzania sobie została rozdarta od góry do dołu. Ujrzałem swoje życie jako całość: śledziłem je od dni dzieciństwa, gdy chodziłem trzymając ojca za rękę, poprzez pełne wyrzeczeń trudy mego życia zawodowego, by raz po raz, z tym samym poczuciem nierealności, dochodzić do przeklętych okropności tego wieczoru."
    en: "Hyde had a song upon his lips as he compounded the draught, and as he drank it, pledged the dead man. The pangs of transformation had not done tearing him, before Henry Jekyll, with streaming tears of gratitude and remorse, had fallen upon his knees and lifted his clasped hands to God. The veil of self-indulgence was rent from head to foot. I saw my life as a whole: I followed it up from the days of childhood, when I had walked with my father’s hand, and through the self-denying toils of my professional life, to arrive again and again, with the same sense of unreality, at the damned horrors of the evening."
