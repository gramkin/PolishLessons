  - clean: "Nie przypuszczam, żeby pijak, który zastanawia się nad swoim nałogiem, choć raz na pięćset przejął się niebezpieczeństwami, na jakie naraża go jego zwierzęca, fizyczna nieczułość; ani ja, choć tak długo rozważałem swoje położenie, nie wziąłem dostatecznie pod uwagę zupełnej nieczułości moralnej i bezmyślnej gotowości do zła, które były głównymi cechami Edwarda Hyde'a. A jednak właśnie przez nie zostałem ukarany. Mój diabeł długo siedział w klatce i wyszedł z rykiem. Czułem, nawet gdy piłem napój, bardziej nieokiełznaną, bardziej wściekłą skłonność do zła. To właśnie, jak przypuszczam, wzbudziło w mojej duszy tę burzę niecierpliwości, z jaką słuchałem uprzejmości mojej nieszczęsnej ofiary; oświadczam przynajmniej przed Bogiem, że żaden moralnie zdrowy człowiek nie mógłby popełnić tej zbrodni przy tak żałosnym powodzie; i że uderzyłem z nie większym rozsądkiem, niż chore dziecko łamie zabawkę."
    en: "I do not suppose that, when a drunkard reasons with himself upon his vice, he is once out of five hundred times affected by the dangers that he runs through his brutish, physical insensibility; neither had I, long as I had considered my position, made enough allowance for the complete moral insensibility and insensate readiness to evil, which were the leading characters of Edward Hyde. Yet it was by these that I was punished. My devil had been long caged, he came out roaring. I was conscious, even when I took the draught, of a more unbridled, a more furious propensity to ill. It must have been this, I suppose, that stirred in my soul that tempest of impatience with which I listened to the civilities of my unhappy victim; I declare, at least, before God, no man morally sane could have been guilty of that crime upon so pitiful a provocation; and that I struck in no more reasonable spirit than that in which a sick child may break a plaything."
