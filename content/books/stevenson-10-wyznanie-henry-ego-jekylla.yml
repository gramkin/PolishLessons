  - clean: "Wszystko ma swój koniec; najpojemniejsza miara w końcu się napełnia; i to krótkie ustępstwo wobec mego zła ostatecznie zniszczyło równowagę mojej duszy. A jednak się nie zaniepokoiłem; upadek wydawał się naturalny, jak powrót do dawnych dni, zanim dokonałem odkrycia. Był piękny, jasny styczniowy dzień, mokry pod stopami tam, gdzie stopniał szron, ale bezchmurny w górze; a Regent's Park był pełen zimowego ćwierkania i słodki od wiosennych zapachów. Siedziałem w słońcu na ławce; zwierzę we mnie oblizywało się na wspomnienie; strona duchowa, nieco rozespana, obiecywała późniejszą skruchę, ale jeszcze nie skłaniała się, by ją zacząć."
