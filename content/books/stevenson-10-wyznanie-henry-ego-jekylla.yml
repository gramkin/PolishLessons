  - clean: "Następnego dnia przyszła wiadomość, że morderstwo nie uszło uwagi, że wina Hyde'a jest dla świata oczywista i że ofiarą był człowiek wysoko ceniony przez ogół. Była to nie tylko zbrodnia, była to tragiczna głupota. Myślę, że cieszyłem się, wiedząc o tym; myślę, że cieszyłem się, iż moje lepsze porywy zostały tak podparte i strzeżone przez grozę szubienicy. Jekyll był teraz moim miastem schronienia; wystarczyło, żeby Hyde wyjrzał na chwilę, a ręce wszystkich ludzi uniosłyby się, by go pochwycić i zgładzić."
