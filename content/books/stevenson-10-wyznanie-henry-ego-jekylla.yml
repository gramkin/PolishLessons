  - clean: "Stąd te małpie figle, które mi płatał, wypisując moim własnym pismem bluźnierstwa na stronicach moich książek, paląc listy i niszcząc portret mego ojca; i doprawdy, gdyby nie strach przed śmiercią, dawno by sam siebie zniszczył, byle tylko pociągnąć mnie za sobą w zgubę. Ale jego miłość do życia jest zdumiewająca; powiem więcej: ja, którego mdli i przenika chłodem sama myśl o nim, gdy przypominam sobie nikczemność i namiętność tego przywiązania i gdy wiem, jak boi się on mojej mocy odcięcia go przez samobójstwo, znajduję w sercu litość dla niego."
