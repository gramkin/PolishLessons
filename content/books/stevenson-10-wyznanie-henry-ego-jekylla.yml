  - clean: "Nastąpiły najokropniejsze męki: zgrzytanie w kościach, śmiertelne mdłości i taka groza ducha, jakiej nie da się przewyższyć w godzinie narodzin czy śmierci. Potem te męki zaczęły szybko ustępować i przyszedłem do siebie jak po ciężkiej chorobie. Było coś dziwnego w moich doznaniach, coś nieopisanie nowego i, właśnie przez tę nowość, niewiarygodnie słodkiego. Czułem się młodszy, lżejszy, szczęśliwszy w ciele; wewnątrz byłem świadom upojnej lekkomyślności, prądu bezładnych zmysłowych obrazów, pędzących w mojej wyobraźni jak strumień pod młyńskim kołem, rozwiązania więzów obowiązku, nieznanej, lecz nie niewinnej wolności duszy."
