  - clean: "Tak jak dobro jaśniało na obliczu jednego, tak zło było szeroko i wyraźnie wypisane na twarzy drugiego. Zło ponadto (które wciąż muszę uważać za śmiercionośną stronę człowieka) pozostawiło na tym ciele piętno kalectwa i rozkładu. A jednak, gdy patrzyłem na tego brzydkiego bożka w lustrze, nie czułem żadnej odrazy, raczej skok radosnego powitania. To także byłem ja. Wydawało się to naturalne i ludzkie. W moich oczach nosiło żywszy obraz ducha, wydawało się bardziej wyraziste i jednolite niż niedoskonałe i rozdwojone oblicze, które dotąd przywykłem nazywać swoim."
