  - clean: "Uśmiechnąłem się do siebie i na swój psychologiczny sposób zacząłem leniwie badać składniki tego złudzenia, od czasu do czasu, nawet przy tym, zapadając z powrotem w wygodną poranną drzemkę. Wciąż byłem tym zajęty, gdy w jednej z bardziej przytomnych chwil mój wzrok padł na moją rękę. Otóż ręka Henry'ego Jekylla (jak często zauważałeś) była kształtem i wielkością ręką lekarza; była duża, jędrna, biała i kształtna. Ale ręka, którą teraz widziałem dość wyraźnie w żółtym świetle londyńskiego przedpołudnia, leżąca na wpół zaciśnięta na pościeli, była chuda, żylasta, koścista, o ciemnawej bladości i gęsto porośnięta śniadym owłosieniem. Była to ręka Edwarda Hyde'a."
    en: "I smiled to myself, and in my psychological way, began lazily to inquire into the elements of this illusion, occasionally, even as I did so, dropping back into a comfortable morning doze. I was still so engaged when, in one of my more wakeful moments, my eyes fell upon my hand. Now the hand of Henry Jekyll (as you have often remarked) was professional in shape and size; it was large, firm, white and comely. But the hand which I now saw, clearly enough, in the yellow light of a mid-London morning, lying half shut on the bedclothes, was lean, corded, knuckly, of a dusky pallor and thickly shaded with a swart growth of hair. It was the hand of Edward Hyde."
