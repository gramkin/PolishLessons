  - clean: "Hyde w niebezpieczeństwie śmierci był dla mnie nową istotą; wstrząsany nieumiarkowanym gniewem, napięty do granic morderstwa, spragniony zadawania bólu. A jednak stworzenie było przebiegłe; wielkim wysiłkiem woli opanowało furię; ułożyło swoje dwa ważne listy, jeden do Lanyona, drugi do Poole'a; i żeby mieć namacalny dowód ich nadania, kazało je wysłać jako polecone. Odtąd siedział cały dzień przy ogniu w osobnym pokoju, obgryzając paznokcie; tam jadł obiad, siedząc sam ze swoimi lękami, a kelner wyraźnie drżał pod jego spojrzeniem; a stamtąd, gdy zapadła już pełna noc, wyruszył w kącie zamkniętej dorożki i kazał się wozić tam i z powrotem po ulicach miasta."
