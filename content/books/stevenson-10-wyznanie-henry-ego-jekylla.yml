  - clean: "Postanowiłem w przyszłym postępowaniu odkupić przeszłość; i mogę uczciwie powiedzieć, że to postanowienie przyniosło nieco dobra. Sam wiesz, jak gorliwie w ostatnich miesiącach ubiegłego roku pracowałem nad ulżeniem cierpieniu; wiesz, że wiele zrobiono dla innych i że dni mijały mi spokojnie, niemal szczęśliwie. Nie mogę też naprawdę powiedzieć, żebym znużył się tym dobroczynnym i niewinnym życiem; myślę raczej, że z każdym dniem cieszyłem się nim pełniej; ale wciąż ciążyło na mnie przekleństwo dwoistości dążeń; i gdy pierwsze ostrze skruchy się stępiło, niższa strona mnie, której tak długo dogadzano, a tak niedawno ją skuto, zaczęła warczeć, domagając się swobody."
