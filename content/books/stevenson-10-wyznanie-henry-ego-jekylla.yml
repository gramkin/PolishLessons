  - clean: "Nie ma sensu, a czasu straszliwie mi brakuje, przedłużać ten opis; nikt nigdy nie cierpiał takich męczarni, niech to wystarczy; a jednak nawet do nich przyzwyczajenie przyniosło — nie, nie ulgę — ale pewne zobojętnienie duszy, pewną rezygnację rozpaczy; i moja kara mogłaby trwać latami, gdyby nie ostatnie nieszczęście, które teraz spadło i które ostatecznie odcięło mnie od mojej własnej twarzy i natury. Mój zapas soli, którego nigdy nie odnawiałem od dnia pierwszego doświadczenia, zaczął się wyczerpywać."
