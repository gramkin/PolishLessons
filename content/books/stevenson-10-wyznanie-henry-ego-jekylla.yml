  - clean: "Przechodziłem niespiesznie przez podwórze po śniadaniu, z przyjemnością pijąc chłód powietrza, gdy znów ogarnęły mnie te nieopisane doznania, które zwiastowały przemianę; i ledwie zdążyłem dotrzeć do schronienia mego gabinetu, a już znowu szalałem i drętwiałem od namiętności Hyde'a. Tym razem potrzeba było podwójnej dawki, żeby przywrócić mnie sobie; i niestety! sześć godzin później, gdy siedziałem, patrząc smutno w ogień, męki powróciły i trzeba było znów zażyć lek. Krótko mówiąc, od tego dnia zdawało się, że tylko wielkim wysiłkiem, jakby gimnastycznym, i tylko pod bezpośrednim działaniem leku mogłem nosić oblicze Jekylla."
