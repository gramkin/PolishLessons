  - clean: "Posłałem po świeży zapas i zmieszałem napój; nastąpiło wrzenie i pierwsza zmiana barwy, ale nie druga; wypiłem go i nie zadziałał. Dowiesz się od Poole'a, jak kazałem przetrząsnąć cały Londyn; na próżno; i jestem teraz przekonany, że mój pierwszy zapas był zanieczyszczony i że to właśnie ta nieznana domieszka nadawała napojowi skuteczność."
