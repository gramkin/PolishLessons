  - clean: "Ludzie już przedtem wynajmowali zbirów, by dokonywali za nich zbrodni, podczas gdy ich własna osoba i reputacja pozostawały w ukryciu. Ja byłem pierwszym, który zrobił to dla swoich przyjemności. Byłem pierwszym, który mógł kroczyć w oczach publiczności z ciężarem dobrodusznej szacowności, i w jednej chwili, jak uczniak, zrzucić te pożyczone szaty i skoczyć na łeb na szyję w morze wolności. Dla mnie jednak, w moim nieprzeniknionym płaszczu, bezpieczeństwo było zupełne. Pomyśl tylko… ja nawet nie istniałem!"
