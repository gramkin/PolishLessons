  - clean: "I doprawdy, zguba, która zamyka się nad nami obydwoma, już go zmieniła i zmiażdżyła. Za pół godziny, gdy znów i na zawsze przywdzieję tę znienawidzoną osobowość, wiem, jak będę siedział, drżąc i płacząc, w fotelu, albo dalej, w najbardziej napiętym i przerażonym upojeniu nasłuchiwania, chodził tam i z powrotem po tym pokoju (moim ostatnim ziemskim schronieniu) i nadstawiał ucha na każdy groźny dźwięk. Czy Hyde umrze na szubienicy? czy też znajdzie odwagę, by uwolnić się w ostatniej chwili? Bóg wie; mnie to nie obchodzi; to jest moja prawdziwa godzina śmierci, a to, co nastąpi, dotyczy kogoś innego niż ja."
