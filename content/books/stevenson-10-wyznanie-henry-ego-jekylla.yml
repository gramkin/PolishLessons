  - clean: "Mógłbym krzyczeć na głos; łzami i modlitwami próbowałem zdławić tłum ohydnych obrazów i dźwięków, którymi pamięć roiła się przeciw mnie; a mimo to, między modlitwami, szpetna twarz mojej nieprawości wpatrywała się w moją duszę. Gdy ostrość tej skruchy zaczęła słabnąć, zastąpiło ją uczucie radości. Problem mego postępowania został rozwiązany. Hyde był odtąd niemożliwy; czy chciałem, czy nie, byłem teraz ograniczony do lepszej części mego istnienia; i och, jak radowałem się tą myślą! z jaką ochoczą pokorą przyjąłem na nowo ograniczenia naturalnego życia! z jakim szczerym wyrzeczeniem zamknąłem drzwi, przez które tak często wychodziłem i wchodziłem, i zmiażdżyłem klucz obcasem!"
