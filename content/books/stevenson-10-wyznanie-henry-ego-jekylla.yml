  - clean: "Niewielki był w istocie mój apetyt. To niewytłumaczalne zdarzenie, to odwrócenie mego poprzedniego doświadczenia zdawało się, jak babiloński palec na ścianie, wypisywać litery mego wyroku; i zacząłem poważniej niż kiedykolwiek rozmyślać nad skutkami i możliwościami mojej podwójnej egzystencji. Ta część mnie, którą miałem moc wyłaniać, była ostatnio wiele ćwiczona i karmiona; wydawało mi się ostatnio, jakby ciało Edwarda Hyde'a urosło, jakbym (gdy przybierałem tę postać) czuł obfitszy przypływ krwi; i zacząłem dostrzegać niebezpieczeństwo, że jeśli to się znacznie przedłuży, równowaga mojej natury może zostać trwale obalona, moc dobrowolnej przemiany utracona, a charakter Edwarda Hyde'a stanie się nieodwołalnie moim."
    en: "Small indeed was my appetite. This inexplicable incident, this reversal of my previous experience, seemed, like the Babylonian finger on the wall, to be spelling out the letters of my judgment; and I began to reflect more seriously than ever before on the issues and possibilities of my double existence. That part of me which I had the power of projecting, had lately been much exercised and nourished; it had seemed to me of late as though the body of Edward Hyde had grown in stature, as though (when I wore that form) I were conscious of a more generous tide of blood; and I began to spy a danger that, if this were much prolonged, the balance of my nature might be permanently overthrown, the power of voluntary change be forfeited, and the character of Edward Hyde become irrevocably mine."
