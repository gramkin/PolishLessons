  - clean: "I o tyle bez wątpienia miałem rację. Zauważyłem, że gdy przybierałem postać Edwarda Hyde'a, nikt nie mógł się do mnie zbliżyć z początku bez widocznego wzdrygnięcia się ciała. Działo się tak, jak sądzę, ponieważ wszystkie istoty ludzkie, jakie spotykamy, są zmieszane z dobra i zła: a Edward Hyde, jedyny w szeregach ludzkości, był czystym złem."
