  - clean: "I jeszcze to, że ta zbuntowana groza była z nim spleciona ściślej niż żona, ściślej niż oko; leżała zamknięta w jego ciele, gdzie słyszał, jak mamrocze, i czuł, jak walczy, by się narodzić; a w każdej godzinie słabości i w ufności snu brała nad nim górę i wypierała go z życia. Nienawiść Hyde'a do Jekylla była innego rzędu. Strach przed szubienicą nieustannie pchał go do popełniania tymczasowego samobójstwa i powrotu na podrzędne miejsce części zamiast osoby; ale nienawidził tej konieczności, nienawidził przygnębienia, w jakie popadł teraz Jekyll, i miał mu za złe niechęć, z jaką on sam był traktowany."
    en: "And this again, that that insurgent horror was knit to him closer than a wife, closer than an eye; lay caged in his flesh, where he heard it mutter and felt it struggle to be born; and at every hour of weakness, and in the confidence of slumber, prevailed against him, and deposed him out of life. The hatred of Hyde for Jekyll was of a different order. His terror of the gallows drove him continually to commit temporary suicide, and return to his subordinate station of a part instead of a person; but he loathed the necessity, he loathed the despondency into which Jekyll was now fallen, and he resented the dislike with which he was himself regarded."
