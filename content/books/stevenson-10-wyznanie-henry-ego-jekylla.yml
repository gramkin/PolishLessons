  - clean: "Obudziłem się rano wstrząśnięty, osłabiony, ale wypoczęty. Wciąż nienawidziłem i bałem się myśli o bestii, która spała we mnie, i nie zapomniałem oczywiście o przerażających niebezpieczeństwach poprzedniego dnia; ale znowu byłem w domu, we własnym domu i blisko swoich leków; a wdzięczność za ocalenie jaśniała w mojej duszy tak mocno, że niemal dorównywała blaskowi nadziei."
