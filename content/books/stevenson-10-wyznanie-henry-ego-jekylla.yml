  - clean: "Zatrzymałem się przy lustrze tylko na chwilę: trzeba było jeszcze spróbować drugiego i rozstrzygającego doświadczenia; trzeba było się przekonać, czy nie utraciłem tożsamości bezpowrotnie i czy nie muszę uciekać przed świtem z domu, który już nie był mój; i pospieszywszy z powrotem do gabinetu, raz jeszcze przygotowałem i wypiłem kielich, raz jeszcze wycierpiałem męki rozpadu i przyszedłem do siebie raz jeszcze z charakterem, wzrostem i twarzą Henry'ego Jekylla."
