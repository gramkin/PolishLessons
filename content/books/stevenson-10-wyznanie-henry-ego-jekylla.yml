  - clean: "Czułem teraz, że muszę wybrać między tymi dwoma. Moje dwie natury miały wspólną pamięć, ale wszystkie inne zdolności były między nimi rozdzielone bardzo nierówno. Jekyll (który był złożony) to z najczulszymi obawami, to z chciwym upodobaniem planował i dzielił przyjemności i przygody Hyde'a; ale Hyde był obojętny wobec Jekylla albo pamiętał o nim tylko tak, jak górski bandyta pamięta o jaskini, w której ukrywa się przed pościgiem. Jekyll miał w sobie więcej niż ojcowską troskę; Hyde więcej niż synowską obojętność."
