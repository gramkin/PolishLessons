  - clean: "Związać los z Jekyllem znaczyło umrzeć dla tych żądz, którym od dawna potajemnie folgowałem, a ostatnio zacząłem dogadzać. Związać go z Hyde'em znaczyło umrzeć dla tysiąca zainteresowań i dążeń i stać się jednym ciosem i na zawsze pogardzanym i samotnym. Układ mógł się wydawać nierówny; ale na szali leżał jeszcze jeden wzgląd; bo podczas gdy Jekyll cierpiałby dotkliwie w ogniu wstrzemięźliwości, Hyde nawet nie byłby świadom wszystkiego, co utracił."
