  - clean: "Gdy przyszedłem do siebie u Lanyona, przerażenie mego starego przyjaciela być może nieco mnie poruszyło: nie wiem; w każdym razie była to tylko kropla w morzu w porównaniu z odrazą, z jaką wspominałem te godziny. Zaszła we mnie zmiana. Nie był to już strach przed szubienicą, to groza bycia Hyde'em mnie dręczyła. Potępienie Lanyona przyjąłem po części jak we śnie; po części jak we śnie wróciłem do własnego domu i położyłem się do łóżka. Po wyczerpaniu tego dnia spałem snem ciężkim i głębokim, którego nie zdołały przerwać nawet koszmary, które mnie męczyły."
