  - clean: "W owym czasie moja cnota drzemała; moje zło, czuwające dzięki ambicji, było czujne i szybkie, by pochwycić sposobność; i to, co zostało rzucone na zewnątrz, było Edwardem Hyde'em. Stąd, choć miałem teraz dwa charaktery, tak jak dwa wyglądy, jeden był całkowicie zły, a drugi wciąż był dawnym Henrym Jekyllem, tą niedobraną mieszaniną, w której poprawę i udoskonalenie nauczyłem się już zwątpić. Ruch szedł więc całkowicie ku gorszemu."
