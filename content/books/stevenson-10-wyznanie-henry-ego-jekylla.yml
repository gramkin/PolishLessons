  - clean: "Natychmiast obudził się we mnie duch piekła i zaczął szaleć. W uniesieniu radości maltretowałem bezbronne ciało, rozkoszując się każdym ciosem; i dopiero gdy zaczęło nadchodzić znużenie, nagle, w samym szczycie mego obłędu, przeszył mi serce zimny dreszcz grozy. Mgła się rozwiała; ujrzałem, że moje życie jest stracone; i uciekłem z miejsca tych ekscesów, zarazem triumfując i drżąc, z żądzą zła zaspokojoną i podsyconą, z miłością do życia napiętą do ostatniej struny. Pobiegłem do domu w Soho i (dla podwójnej pewności) zniszczyłem papiery; stamtąd ruszyłem przez oświetlone latarniami ulice, w tym samym rozdwojonym upojeniu umysłu, napawając się zbrodnią, lekkomyślnie obmyślając następne na przyszłość, a jednak wciąż spiesząc się i wciąż nasłuchując za sobą kroków mściciela."
    en: "Instantly the spirit of hell awoke in me and raged. With a transport of glee, I mauled the unresisting body, tasting delight from every blow; and it was not till weariness had begun to succeed, that I was suddenly, in the top fit of my delirium, struck through the heart by a cold thrill of terror. A mist dispersed; I saw my life to be forfeit; and fled from the scene of these excesses, at once glorying and trembling, my lust of evil gratified and stimulated, my love of life screwed to the topmost peg. I ran to the house in Soho, and (to make assurance doubly sure) destroyed my papers; thence I set out through the lamplit streets, in the same divided ecstasy of mind, gloating on my crime, light-headedly devising others in the future, and yet still hastening and still hearkening in my wake for the steps of the avenger."
    draft: true
    chunks:
