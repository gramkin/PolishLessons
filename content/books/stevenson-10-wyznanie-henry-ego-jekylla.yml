  - clean: "Z dwóch ważnych powodów nie będę się zagłębiał w tę naukową część mego wyznania. Po pierwsze, ponieważ musiałem się nauczyć, że przeznaczenie i brzemię naszego życia są na zawsze przywiązane do ramion człowieka, a gdy próbuje się je zrzucić, wraca tylko na nas z bardziej nieznanym i straszliwszym ciężarem. Po drugie, ponieważ, jak moja opowieść niestety aż nazbyt jasno pokaże, moje odkrycia były niepełne. Wystarczy więc, że nie tylko rozpoznałem swoje naturalne ciało jako zwykłą aurę i blask pewnych sił, które tworzyły mego ducha, lecz zdołałem sporządzić lek, przez który moce te zostałyby strącone z tronu swej przewagi, a ich miejsce zajęłaby druga postać i drugie oblicze, nie mniej mi naturalne przez to, że były wyrazem i nosiły piętno niższych pierwiastków mojej duszy."
    en: "For two good reasons, I will not enter deeply into this scientific branch of my confession. First, because I have been made to learn that the doom and burthen of our life is bound for ever on man’s shoulders, and when the attempt is made to cast it off, it but returns upon us with more unfamiliar and more awful pressure. Second, because, as my narrative will make, alas! too evident, my discoveries were incomplete. Enough then, that I not only recognised my natural body from the mere aura and effulgence of certain of the powers that made up my spirit, but managed to compound a drug by which these powers should be dethroned from their supremacy, and a second form and countenance substituted, none the less natural to me because they were the expression, and bore the stamp, of lower elements in my soul."
    draft: true
    chunks:
