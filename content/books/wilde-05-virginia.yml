      - pl: " Ku jej ogromnemu zdumieniu był to jednak sam Duch Canterville!"
        ru: "Но, к её огромному изумлению, это было само Кентервильское привидение!"
        note: "ku zdumieniu — к изумлению: ku + дательный"
    words: { "kawaler": kawaler, "przejażdżkę": przejazdzka, "schodami": schody, "Komnaty": komnata, "pokojówka": pokojowka, "zajrzała": zajrzec }
  - clean: "Siedział przy oknie i patrzył, jak zrujnowane złoto żółknących drzew fruwa w powietrzu, a czerwone liście tańczą szaleńczo wzdłuż długiej alei. Głowę wsparł na dłoni, a cała jego postawa wyrażała skrajne przygnębienie. Wyglądał doprawdy tak opuszczony i tak zaniedbany, że mała Virginia, która w pierwszej chwili chciała uciec i zamknąć się w swoim pokoju, poczuła wielką litość i postanowiła spróbować go pocieszyć. Jej kroki były tak lekkie, a jego smutek tak głęboki, że nie zauważył jej obecności, dopóki się do niego nie odezwała."
    en: "He was sitting by the window, watching the ruined gold of the yellowing trees fly through the air, and the red leaves dancing madly down the long avenue. His head was leaning on his hand, and his whole attitude was one of extreme depression. Indeed, so forlorn, and so much out of repair did he look, that little Virginia, whose first idea had been to run away and lock herself in her room, was filled with pity, and determined to try and comfort him. So light was her footfall, and so deep his melancholy, that he was not aware of her presence till she spoke to him."
    draft: true
    chunks:
      - pl: "Siedział przy oknie i patrzył,"
