        ru: "Это вы грубый, ужасный и вульгарный,"
      - pl: " a co do nieuczciwości, to pan wie, że ukradł mi pan farby z pudełka,"
        ru: "а что до бесчестности, так вы знаете, что украли у меня краски из коробки,"
        note: "ukraść komuś coś — украсть у кого-л. что-л.: дательный"
      - pl: " żeby odświeżać tę śmieszną plamę krwi w bibliotece."
        ru: "чтобы подновлять это смешное кровавое пятно в библиотеке."
