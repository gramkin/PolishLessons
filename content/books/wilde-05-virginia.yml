  - clean: "— Tak mi pana żal — powiedziała — ale moi bracia wracają jutro do Eton, a wtedy, jeśli będzie się pan dobrze sprawował, nikt nie będzie panu dokuczał."
    en: "\"I am so sorry for you,\" she said, \"but my brothers are going back to Eton to-morrow, and then, if you behave yourself, no one will annoy you.\""
