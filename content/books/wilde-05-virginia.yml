  - clean: "— To niedorzeczne, prosić mnie, żebym się dobrze sprawował — odpowiedział, oglądając się ze zdumieniem na ładną dziewczynkę, która odważyła się do niego odezwać — zupełnie niedorzeczne. Muszę pobrzękiwać łańcuchami, jęczeć przez dziurki od klucza i chodzić nocami po domu, jeśli o to pani chodzi. To moja jedyna racja bytu."
    en: "\"It is absurd asking me to behave myself,\" he answered, looking round in astonishment at the pretty little girl who had ventured to address him, \"quite absurd. I must rattle my chains, and groan through keyholes, and walk about at night, if that is what you mean. It is my only reason for existing.\""
