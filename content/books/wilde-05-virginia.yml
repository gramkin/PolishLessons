      - pl: " gdzie przedzierając się przez żywopłot, tak bardzo podarła amazonkę,"
        ru: "где, продираясь сквозь живую изгородь, она так сильно порвала амазонку,"
        note: "przedzierać się — продираться; żywopłot — живая изгородь; amazonka — здесь «костюм для верховой езды»"
      - pl: " że po powrocie do domu postanowiła wejść na górę kuchennymi schodami,"
        ru: "что по возвращении домой решила подняться наверх по чёрной лестнице,"
        note: "kuchenne schody — чёрная лестница"
      - pl: " żeby nikt jej nie zobaczył."
        ru: "чтобы её никто не увидел."
      - pl: " Kiedy przebiegała obok Komnaty Gobelinów, której drzwi akurat były otwarte,"
        ru: "Когда она пробегала мимо Гобеленовой комнаты, дверь которой как раз была открыта,"
        note: "akurat — как раз"
      - pl: " wydało jej się, że ktoś jest w środku,"
        ru: "ей показалось, что внутри кто-то есть,"
      - pl: " a sądząc, że to pokojówka matki, która czasem przynosiła tam robótkę,"
        ru: "и, решив, что это горничная матери, которая иногда приносила туда рукоделие,"
        note: "robótka — рукоделие"
      - pl: " zajrzała, żeby poprosić ją o zacerowanie amazonki."
        ru: "она заглянула попросить её заштопать амазонку."
