  - clean: "— Dość tego! — zawołała Virginia, tupiąc nogą. — To pan jest grubiański, okropny i prostacki, a co do nieuczciwości, to pan wie, że ukradł mi pan farby z pudełka, żeby odświeżać tę śmieszną plamę krwi w bibliotece. Najpierw zabrał pan wszystkie moje czerwienie, łącznie z cynobrem, i nie mogłam już malować zachodów słońca, potem zabrał pan szmaragdową zieleń i żółcień chromową, aż w końcu zostały mi tylko indygo i biel chińska i mogłam malować tylko pejzaże przy księżycu, na które zawsze przygnębiająco się patrzy i które wcale nie są łatwe do namalowania. Nigdy na pana nie naskarżyłam, choć byłam bardzo zła, a cała ta sprawa była przecież zupełnie śmieszna; bo kto słyszał o szmaragdowozielonej krwi?"
    en: "\"Stop!\" cried Virginia, stamping her foot, \"it is you who are rude, and horrid, and vulgar, and as for dishonesty, you know you stole the paints out of my box to try and furbish up that ridiculous blood-stain in the library. First you took all my reds, including the vermilion, and I couldn't do any more sunsets, then you took the emerald-green and the chrome-yellow, and finally I had nothing left but indigo and Chinese white, and could only do moonlight scenes, which are always depressing to look at, and not at all easy to paint. I never told on you, though I was very much annoyed, and it was most ridiculous, the whole thing; for who ever heard of emerald-green blood?\""
    draft: true
    chunks:
      - pl: "— Dość tego! — zawołała Virginia, tupiąc nogą. —"
        ru: "— Перестаньте! — воскликнула Вирджиния, топнув ногой. —"
        note: "tupać — топать"
