  - clean: "— Och, nie znoszę taniej surowości abstrakcyjnej etyki! Moja żona była bardzo brzydka, nigdy porządnie nie krochmaliła mi kryz i nie miała pojęcia o gotowaniu. Proszę sobie wyobrazić, upolowałem kiedyś w lasach Hogley jelenia, wspaniałego dwulatka, i wie pani, jak kazała go podać do stołu? Ale mniejsza z tym, to już przeszłość, i nie sądzę, żeby to było bardzo ładnie ze strony jej braci, że zagłodzili mnie na śmierć, choć rzeczywiście ją zabiłem."
    en: "\"Oh, I hate the cheap severity of abstract ethics! My wife was very plain, never had my ruffs properly starched, and knew nothing about cookery. Why, there was a buck I had shot in Hogley Woods, a magnificent pricket, and do you know how she had it sent to table? However, it is no matter now, for it is all over, and I don't think it was very nice of her brothers to starve me to death, though I did kill her.\""
    draft: true
