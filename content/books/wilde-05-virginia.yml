paragraphs:
  - clean: "Kilka dni później Virginia i jej kędzierzawy kawaler wybrali się na przejażdżkę konną po łąkach Brockley, gdzie przedzierając się przez żywopłot, tak bardzo podarła amazonkę, że po powrocie do domu postanowiła wejść na górę kuchennymi schodami, żeby nikt jej nie zobaczył. Kiedy przebiegała obok Komnaty Gobelinów, której drzwi akurat były otwarte, wydało jej się, że ktoś jest w środku, a sądząc, że to pokojówka matki, która czasem przynosiła tam robótkę, zajrzała, żeby poprosić ją o zacerowanie amazonki. Ku jej ogromnemu zdumieniu był to jednak sam Duch Canterville!"
    en: "A few days after this, Virginia and her curly-haired cavalier went out riding on Brockley meadows, where she tore her habit so badly in getting through a hedge that, on their return home, she made up her mind to go up by the back staircase so as not to be seen. As she was running past the Tapestry Chamber, the door of which happened to be open, she fancied she saw some one inside, and thinking it was her mother's maid, who sometimes used to bring her work there, looked in to ask her to mend her habit. To her immense surprise, however, it was the Canterville Ghost himself!"
    draft: true
    chunks:
      - pl: "Kilka dni później Virginia i jej kędzierzawy kawaler wybrali się na przejażdżkę konną po łąkach Brockley,"
        ru: "Несколько дней спустя Вирджиния и её кудрявый кавалер отправились кататься верхом по Броклийским лугам,"
