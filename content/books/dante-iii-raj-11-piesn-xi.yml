# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 11
chapterTitle: "Pieśń XI"
chapterTitleRu: "Песнь XI. Святой Франциск"
level: B2
paragraphs:
  - clean: "(Ciąg dalszy. Mowa św. Tomasza o św. Franciszku z Asyżu. Skarga na ówczesnych dominikanów)"
    chunks:
      - pl: "(Ciąg dalszy. Mowa św. Tomasza o św. Franciszku z Asyżu. Skarga na ówczesnych dominikanów)"
        ru: "(Продолжение. Речь святого Фомы о святом Франциске Ассизском. Жалоба на тогдашних доминиканцев.)"
    words: { "Ciąg": ciag, "dalszy": daleki, "Mowa": mowa, "Skarga": skarga, "ówczesnych": owczesny }
  - clean: "O nieroztropne śmiertelnych starania!\nLot wasz zwichnięty przez rozumowania\nZiemię zamiata waszymi skrzydłami.\nJeden się uczył prawa z całą żądzą,\nTen głowę łamał aforycznym zdaniem,\nDrudzy sofizmem albo siłą rządzą:\nTen się wycieńczał ciała rozkoszami,\nTen się upajał słodkim próżnowaniem,\nTen sprawy kraju ciągle miał na pieczy,\nDrugi zysk gonił duchownego chleba:"
    verse: true
    chunks:
      - pl: "O nieroztropne śmiertelnych starania!"
        ru: "О безрассудные старания смертных!"
      - pl: "\nLot wasz zwichnięty przez rozumowania"
        ru: "ваш полёт, вывихнутый рассуждениями,"
      - pl: "\nZiemię zamiata waszymi skrzydłami."
        ru: "метёт землю вашими крыльями."
      - pl: "\nJeden się uczył prawa z całą żądzą,"
        ru: "Один со всей страстью учился праву,"
      - pl: "\nTen głowę łamał aforycznym zdaniem,"
        ru: "этот ломал голову над афористическим изречением,"
        note: "aforyczny — афористический"
      - pl: "\nDrudzy sofizmem albo siłą rządzą:"
        ru: "другие правят софизмом или силой:"
      - pl: "\nTen się wycieńczał ciała rozkoszami,"
        ru: "этот истощал себя плотскими наслаждениями,"
      - pl: "\nTen się upajał słodkim próżnowaniem,"
        ru: "этот упивался сладким бездельем,"
      - pl: "\nTen sprawy kraju ciągle miał na pieczy,"
        ru: "этот всё держал на попечении дела страны,"
        note: "piecza — попечение"
      - pl: "\nDrugi zysk gonił duchownego chleba:"
        ru: "другой гнался за выгодой духовного хлеба:"
    words: { "śmiertelnych": smiertelny, "skrzydłami": skrzydlo, "łamał": lamac, "zysk": zysk, "gonił": gonic, "chleba": chleb }
  - clean: "Podczas gdy wolny od tych wszystkich rzeczy,\nJa z Beatrycze wstąpiłem do nieba,\nGdzie mnie czekało tak świetne przyjęcie,\nGdy każda z dusz tych w wirowym zakręcie\nNa punkcie koła, skąd krążyć zaczęła,\nJak świeca na swym świeczniku stanęła;\nZe światła, które przed chwilą mówiło,\nGłos wyszedł słodszy, głos dźwięczny i czysty:\n«Jak od światłości promień wiekuistej\nBlask mój zapala, w jej jasności boskiej\nWidzę twe myśli, powody ich troski."
    verse: true
    chunks:
      - pl: "Podczas gdy wolny od tych wszystkich rzeczy,"
        ru: "тогда как я, свободный от всех этих вещей,"
      - pl: "\nJa z Beatrycze wstąpiłem do nieba,"
        ru: "вступил с Беатриче на небо,"
      - pl: "\nGdzie mnie czekało tak świetne przyjęcie,"
        ru: "где меня ждал такой блестящий приём,"
      - pl: "\nGdy każda z dusz tych w wirowym zakręcie"
        ru: "когда каждая из этих душ в кружащемся повороте"
      - pl: "\nNa punkcie koła, skąd krążyć zaczęła,"
        ru: "на той точке круга, откуда начала кружиться,"
      - pl: "\nJak świeca na swym świeczniku stanęła;"
        ru: "остановилась, как свеча на своём подсвечнике;"
      - pl: "\nZe światła, które przed chwilą mówiło,"
        ru: "из света, что минуту назад говорил,"
      - pl: "\nGłos wyszedł słodszy, głos dźwięczny i czysty:"
        ru: "вышел голос, более сладкий, звонкий и чистый:"
      - pl: "\n«Jak od światłości promień wiekuistej"
        ru: "«Как от вечного света луч"
      - pl: "\nBlask mój zapala, w jej jasności boskiej"
        ru: "зажигает мой блеск, в его божественной ясности"
      - pl: "\nWidzę twe myśli, powody ich troski."
        ru: "я вижу твои мысли, причины их тревоги."
    words: { "zakręcie": zakret, "świeca": swieca, "promień": promien, "Blask": blask, "jasności": jasnosc, "troski": troska }
  - clean: "Ty wątpisz, pragniesz całej żądzy siłą,\nAbym wyrazy wkładał ci do ucha,\nJasne, z pojęciem zgodne twego ducha.\nSłowa, gdzie rzekłem: »Droga do zasługi\nUmacnia duszę, jeśli z niej nie zbłądzi«,\nI te: »Nad niego nie wzniósł się nikt drugi«."
    verse: true
    chunks:
      - pl: "Ty wątpisz, pragniesz całej żądzy siłą,"
        ru: "Ты сомневаешься, ты жаждешь всей силой желания,"
      - pl: "\nAbym wyrazy wkładał ci do ucha,"
        ru: "чтобы я вкладывал тебе в ухо слова,"
      - pl: "\nJasne, z pojęciem zgodne twego ducha."
        ru: "ясные, согласные с пониманием твоего духа."
      - pl: "\nSłowa, gdzie rzekłem: »Droga do zasługi"
        ru: "Слова, где я сказал: „Путь к заслуге"
      - pl: "\nUmacnia duszę, jeśli z niej nie zbłądzi«,"
        ru: "укрепляет душу, если она не собьётся с него“,"
      - pl: "\nI te: »Nad niego nie wzniósł się nikt drugi«."
        ru: "и эти: „Выше него не поднялся никто другой“."
    words: { "wyrazy": wyraz, "wkładał": wkladac, "zgodne": zgodny, "rzekłem": rzec, "zasługi": zasluga, "wzniósł": wzniesc }
  - clean: "Tu jak najściślej rozróżnić wypada.\nOpatrzność światem z tą nauką rządzi,\nW którą wzrok ludzki jak w bezdeń zapada.\nAby w godowej doprowadzić części\nOblubienicę do jej Oblubieńca\nCo ją zaślubił z wykrzykiem boleści,\nKrwią i kolcami cierniowego wieńca:\nAby ją więcej ufającą w siebie,\nWięcej mu wierną, połączyć z nim w niebie,\nOpatrzność dla niej dwóch książąt zesłała,\nAby do celu wiedli ją najprościej,\nDrogą miłości i drogą mądrości."
    verse: true
    chunks:
      - pl: "Tu jak najściślej rozróżnić wypada."
        ru: "Здесь как можно точнее следует различать."
      - pl: "\nOpatrzność światem z tą nauką rządzi,"
        ru: "Провидение правит миром с той мудростью,"
      - pl: "\nW którą wzrok ludzki jak w bezdeń zapada."
        ru: "в которую взгляд человека тонет, как в бездне."
        note: "bezdeń — бездна"
      - pl: "\nAby w godowej doprowadzić części"
        ru: "Чтобы в брачный час довести"
      - pl: "\nOblubienicę do jej Oblubieńca"
        ru: "невесту к её Жениху,"
        note: "Церковь ко Христу"
      - pl: "\nCo ją zaślubił z wykrzykiem boleści,"
        ru: "что обручился с ней с криком боли,"
      - pl: "\nKrwią i kolcami cierniowego wieńca:"
        ru: "кровью и шипами тернового венца:"
      - pl: "\nAby ją więcej ufającą w siebie,"
        ru: "чтобы её, более доверяющую себе,"
      - pl: "\nWięcej mu wierną, połączyć z nim w niebie,"
        ru: "более верную ему, соединить с ним на небе,"
      - pl: "\nOpatrzność dla niej dwóch książąt zesłała,"
        ru: "Провидение послало ей двух князей,"
      - pl: "\nAby do celu wiedli ją najprościej,"
        ru: "чтобы вели её к цели прямее всего,"
      - pl: "\nDrogą miłości i drogą mądrości."
        ru: "путём любви и путём мудрости."
    words: { "najściślej": scisle, "wypada": wypadac, "rządzi": rzadzic, "wzrok": wzrok, "wierną": wierny, "mądrości": madrosc }
  - clean: "Gdy pierwszy ogniem seraficznym pała,\nDrugi mądrością słów swoich i czynów\nOdbił na ziemi światło Cherubinów.\nO dwóch powiadam, gdy mówię o jednym,\nBo oba wielcy duchem niepowszednim,\nBo jeden miały cel i kres ich dzieła."
    verse: true
    chunks:
      - pl: "Gdy pierwszy ogniem seraficznym pała,"
        ru: "Тогда как первый пылает серафическим огнём,"
        note: "Франциск"
      - pl: "\nDrugi mądrością słów swoich i czynów"
        ru: "второй мудростью своих слов и дел"
        note: "Доминик"
      - pl: "\nOdbił na ziemi światło Cherubinów."
        ru: "отразил на земле свет херувимов."
      - pl: "\nO dwóch powiadam, gdy mówię o jednym,"
        ru: "О двоих говорю, когда говорю об одном,"
      - pl: "\nBo oba wielcy duchem niepowszednim,"
        ru: "ибо оба велики незаурядным духом,"
      - pl: "\nBo jeden miały cel i kres ich dzieła."
        ru: "ибо одна была у них цель и предел их дела."
    words: { "ogniem": ogien, "czynów": czyn, "Odbił": odbic, "duchem": duch, "kres": kres, "dzieła": dzielo }
  - clean: "Między Tupino a krynicą żywą\nGóra porosła zieloną oliwą,\nBłogosławiony gdzie mieszkał Ubaldo,\nPochyłość swoją w dolinę zsunęła:\nSkąd na Perugię wiatr to chłodną chmurą,\nTo skwarem zieje, podczas gdy za górą\nW jarzmie Nocera jęczy i Gualdo."
    verse: true
    chunks:
      - pl: "Między Tupino a krynicą żywą"
        ru: "Между Тупино и живым родником,"
      - pl: "\nGóra porosła zieloną oliwą,"
        ru: "гора, поросшая зелёной оливой,"
      - pl: "\nBłogosławiony gdzie mieszkał Ubaldo,"
        ru: "где жил блаженный Убальдо,"
      - pl: "\nPochyłość swoją w dolinę zsunęła:"
        ru: "спустила свой склон в долину:"
      - pl: "\nSkąd na Perugię wiatr to chłodną chmurą,"
        ru: "откуда на Перуджу ветер то холодной тучей,"
      - pl: "\nTo skwarem zieje, podczas gdy za górą"
        ru: "то зноем пышет, тогда как за горой"
      - pl: "\nW jarzmie Nocera jęczy i Gualdo."
        ru: "в ярме стонут Ночера и Гвальдо."
    words: { "Błogosławiony": blogoslawic, "dolinę": dolina, "chłodną": chlodny, "chmurą": chmura, "zieje": ziac, "jarzmie": jarzmo }
  - clean: "Na tych pagórków pochyłym skłonieniu,\nZ pieluch się na świat wywinęło słońce,\nJakby z Gangesu ogniem buchające.\nO! Kto chcesz nazwać rzecz po jej imieniu,\nMiejsce to nie zwij Asyżem z powodu\nŻe straci wiele na słowa znaczeniu,\nZwać je właściwiej miejscem słońca wschodu,\nCo ledwo weszło ponad ziemią skrzepłą,\nŚwiat poczuł jego dobroczynne ciepło."
    verse: true
    chunks:
      - pl: "Na tych pagórków pochyłym skłonieniu,"
        ru: "На покатом склоне этих холмов"
      - pl: "\nZ pieluch się na świat wywinęło słońce,"
        ru: "вывернулось на свет из пелёнок солнце,"
      - pl: "\nJakby z Gangesu ogniem buchające."
        ru: "словно пышущее огнём из Ганга."
      - pl: "\nO! Kto chcesz nazwać rzecz po jej imieniu,"
        ru: "О! ты, кто хочет назвать вещь её именем,"
      - pl: "\nMiejsce to nie zwij Asyżem z powodu"
        ru: "не зови это место Ассизи, потому что"
      - pl: "\nŻe straci wiele na słowa znaczeniu,"
        ru: "оно много потеряет в значении слова,"
      - pl: "\nZwać je właściwiej miejscem słońca wschodu,"
        ru: "вернее звать его местом восхода солнца,"
      - pl: "\nCo ledwo weszło ponad ziemią skrzepłą,"
        ru: "которое, едва взошло над окоченевшей землёй,"
      - pl: "\nŚwiat poczuł jego dobroczynne ciepło."
        ru: "мир почувствовал его благодетельное тепло."
    words: { "pieluch": pielucha, "słońce": slonce, "nazwać": nazwac, "zwij": zwac, "wschodu": wschod, "ledwo": ledwo }
  - clean: "Od dziecka z ojcem wiódł wojnę zaciętą\nO swą kochankę, o niewiastę świętą,\nKtórej jak śmierci, choć ta nie dba o to,\nNikt nie otwiera swoich drzwi z ochotą.\nZ nią ślubnym węzłem złączył się duchownie\nOdtąd z dnia na dzień kochał ją gwałtownie;\nOna po pierwszym wdowa oblubieńcu,\nWięcej tysiąca lat we wdowim wieńcu\nSmutna przeżyła; świat wzgardą ją krwawił,\nŻaden zalotnik przed nią się nie stawił,\nChociaż bez trwogi przy swym Amyklasie\nPrzyjęła gościa w chruścianym szałasie,\nNa głos którego drżał świat w owym czasie;"
    verse: true
    chunks:
      - pl: "Od dziecka z ojcem wiódł wojnę zaciętą"
        ru: "С детства он вёл с отцом упорную войну"
      - pl: "\nO swą kochankę, o niewiastę świętą,"
        ru: "за свою возлюбленную, за святую жену,"
      - pl: "\nKtórej jak śmierci, choć ta nie dba o to,"
        ru: "которой, как смерти, — хоть она о том не заботится, —"
      - pl: "\nNikt nie otwiera swoich drzwi z ochotą."
        ru: "никто не открывает своих дверей с охотой."
      - pl: "\nZ nią ślubnym węzłem złączył się duchownie"
        ru: "С ней он соединился духовно брачным узлом,"
      - pl: "\nOdtąd z dnia na dzień kochał ją gwałtownie;"
        ru: "отныне изо дня в день любил её горячо;"
      - pl: "\nOna po pierwszym wdowa oblubieńcu,"
        ru: "она, вдова после первого жениха,"
        note: "Христа"
      - pl: "\nWięcej tysiąca lat we wdowim wieńcu"
        ru: "более тысячи лет во вдовьем венке"
      - pl: "\nSmutna przeżyła; świat wzgardą ją krwawił,"
        ru: "прожила печальная; мир обагрял её презрением,"
      - pl: "\nŻaden zalotnik przed nią się nie stawił,"
        ru: "ни один жених не явился перед ней,"
      - pl: "\nChociaż bez trwogi przy swym Amyklasie"
        ru: "хотя без страха при своём Амикле"
      - pl: "\nPrzyjęła gościa w chruścianym szałasie,"
        ru: "она приняла гостя в хворостяном шалаше,"
        note: "Цезаря; chruściany — хворостяной"
      - pl: "\nNa głos którego drżał świat w owym czasie;"
        ru: "при чьём голосе дрожал в то время мир;"
    words: { "kochankę": kochanka, "niewiastę": niewiasta, "ślubnym": slubny, "węzłem": wezel, "Odtąd": odtad, "wdowa": wdowa }
  - clean: "Chociaż jej statku taka moc i siła,\nKiedy Maryja u stóp krzyża stoi,\nOna z Chrystusem na sam krzyż wstąpiła.\nCzas zdjąć zasłonę z ciemnej mowy mojej,\nŚwięty Franciszek i ubóstwo, mówię,\nSą to ci sami czuli kochankowie."
    verse: true
    chunks:
      - pl: "Chociaż jej statku taka moc i siła,"
        ru: "хотя такова сила и мощь её стойкости,"
        note: "statek — здесь «стойкость»"
      - pl: "\nKiedy Maryja u stóp krzyża stoi,"
        ru: "что, когда Мария стоит у подножия креста,"
      - pl: "\nOna z Chrystusem na sam krzyż wstąpiła."
        ru: "она с Христом взошла на самый крест."
      - pl: "\nCzas zdjąć zasłonę z ciemnej mowy mojej,"
        ru: "Пора снять покров с моей тёмной речи:"
      - pl: "\nŚwięty Franciszek i ubóstwo, mówię,"
        ru: "святой Франциск и бедность, говорю,"
      - pl: "\nSą to ci sami czuli kochankowie."
        ru: "это те самые нежные возлюбленные."
    words: { "stóp": stopa, "krzyża": krzyz, "wstąpiła": wstapic, "zasłonę": zaslona, "ciemnej": ciemny, "kochankowie": kochanek }
  - clean: "Ich zgoda, pokój ich oblicza błogi,\nSłodycz ich wzroku, kędy tylko przyszli,\nPociągał tłumy, święte budził myśli.\nPierwszy szanowny Bernard bosonogi\nBiegł za tą parą kochanków szczęśliwą,\nMyśląc, że jeszcze bieży dość leniwo."
    verse: true
    chunks:
      - pl: "Ich zgoda, pokój ich oblicza błogi,"
        ru: "Их согласие, блаженный мир их лица,"
      - pl: "\nSłodycz ich wzroku, kędy tylko przyszli,"
        ru: "сладость их взгляда, куда бы они ни пришли,"
      - pl: "\nPociągał tłumy, święte budził myśli."
        ru: "привлекали толпы, будили святые мысли."
      - pl: "\nPierwszy szanowny Bernard bosonogi"
        ru: "Первым почтенный Бернард босоногий"
      - pl: "\nBiegł za tą parą kochanków szczęśliwą,"
        ru: "бежал за этой счастливой парой возлюбленных,"
      - pl: "\nMyśląc, że jeszcze bieży dość leniwo."
        ru: "думая, что ещё бежит довольно медленно."
    words: { "zgoda": zgoda, "oblicza": oblicze, "Słodycz": slodycz, "tłumy": tlum, "budził": budzic, "Biegł": biec }
  - clean: "O! Godna cześci ta bogactw pogarda.\nEgid, Sylwester, przykładem Bernarda,\nSzli bosonodzy w ślad oblubienicy.\nTak pan z swą panią i rodziną całą,\nKtórej sznur skromny już krępował ciało,\nStanął u progu Piotrowej stolicy."
    verse: true
    chunks:
      - pl: "O! Godna cześci ta bogactw pogarda."
        ru: "О! достойно почёта это презрение к богатствам."
      - pl: "\nEgid, Sylwester, przykładem Bernarda,"
        ru: "Эгидий, Сильвестр, по примеру Бернарда,"
      - pl: "\nSzli bosonodzy w ślad oblubienicy."
        ru: "шли босыми по следу невесты."
      - pl: "\nTak pan z swą panią i rodziną całą,"
        ru: "Так господин со своей госпожой и всей семьёй,"
      - pl: "\nKtórej sznur skromny już krępował ciało,"
        ru: "чьё тело уже стягивала скромная верёвка,"
      - pl: "\nStanął u progu Piotrowej stolicy."
