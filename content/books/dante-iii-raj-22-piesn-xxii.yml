# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 22
chapterTitle: "Pieśń XXII"
chapterTitleRu: "Песнь XXII. Взгляд на Землю"
level: B2
paragraphs:
  - clean: "Przepowiednia zmian w kościele. Św. Benedykt. Skarga na zakon, klasztory i opactwa benedyktynów. Wyższy wzlot ku niebu gwiazd stałych, najpierw do konstelacji Bliźniąt, pod którą Dante się urodził. Dante spogląda wstecz na drogę przebytą i na ziemię."
    chunks:
      - pl: "Przepowiednia zmian w kościele. Św. Benedykt. Skarga na zakon, klasztory i opactwa benedyktynów. Wyższy wzlot ku niebu gwiazd stałych, najpierw do konstelacji Bliźniąt, pod którą Dante się urodził. Dante spogląda wstecz na drogę przebytą i na ziemię."
        ru: "Предсказание перемен в церкви. Святой Бенедикт. Жалоба на орден, монастыри и аббатства бенедиктинцев. Более высокий взлёт к небу неподвижных звёзд, сперва к созвездию Близнецов, под которым родился Данте. Данте оглядывается на пройденный путь и на землю."
    words: { "kościele": kosciol, "Skarga": skarga, "klasztory": klasztor, "spogląda": spogladac, "wstecz": wstecz, "przebytą": przebyc }
  - clean: "Tym przerażony krzykiem niespodzianie,\nNa przewodniczkę spojrzałem z daleka,\nJak małe dziecko, co się tam ucieka,\nGdzie swe złożyło największe ufanie.\nOna, jak matka ratująca syna,\nGdy przed nią stoi blady, bez oddechu,\nGłosem, na który pierzcha dziecka trwoga,\nRzekła: — «Czy nie wiesz, gdzie jesteś, dla Boga!"
    verse: true
    chunks:
      - pl: "Tym przerażony krzykiem niespodzianie,"
        ru: "Неожиданно испуганный этим криком,"
      - pl: "\nNa przewodniczkę spojrzałem z daleka,"
        ru: "я издали взглянул на путеводительницу,"
      - pl: "\nJak małe dziecko, co się tam ucieka,"
        ru: "как маленький ребёнок, что бежит туда,"
      - pl: "\nGdzie swe złożyło największe ufanie."
        ru: "где положил своё величайшее доверие."
      - pl: "\nOna, jak matka ratująca syna,"
        ru: "Она, как мать, спасающая сына,"
      - pl: "\nGdy przed nią stoi blady, bez oddechu,"
        ru: "когда он стоит перед ней бледный, без дыхания,"
      - pl: "\nGłosem, na który pierzcha dziecka trwoga,"
        ru: "голосом, от которого бежит страх ребёнка,"
        note: "pierzchać — разбегаться, бежать"
      - pl: "\nRzekła: — «Czy nie wiesz, gdzie jesteś, dla Boga!"
        ru: "сказала: — «Разве ты не знаешь, где ты, ради Бога!"
    words: { "krzykiem": krzyk, "złożyło": zlozyc, "ratująca": ratowac, "blady": blady, "oddechu": oddech, "Rzekła": rzec }
  - clean: "Nie wiesz, że w niebie ucieczka jedyna\nI że to wszystko, co się w niebie święci,\nWynika tylko z żywej dobra chęci?\nJakżeby ciebie, pomyśl, przeobraził\nŚpiew świateł bożych, blask mego uśmiechu,\nGdy ich krzyk ciebie do tyla przeraził!"
    verse: true
    chunks:
      - pl: "Nie wiesz, że w niebie ucieczka jedyna"
        ru: "Не знаешь, что на небе — единственное прибежище"
      - pl: "\nI że to wszystko, co się w niebie święci,"
        ru: "и что всё, что свершается на небе,"
      - pl: "\nWynika tylko z żywej dobra chęci?"
        ru: "вытекает лишь из живого желания добра?"
      - pl: "\nJakżeby ciebie, pomyśl, przeobraził"
        ru: "Как же преобразило бы тебя, подумай,"
      - pl: "\nŚpiew świateł bożych, blask mego uśmiechu,"
        ru: "пение Божьих светил, блеск моей улыбки,"
      - pl: "\nGdy ich krzyk ciebie do tyla przeraził!"
        ru: "когда их крик так тебя испугал!"
    words: { "ucieczka": ucieczka, "Wynika": wynikac, "chęci": chec, "blask": blask, "uśmiechu": usmiech, "przeraził": przerazic }
  - clean: "Gdybyś w tym krzyku zgadł treść ich pacierza,\nPoznałbyś zemstę, jakiej z upragnionym\nSercem, zaiste, doczekasz przed zgonem.\nMiecz z góry nigdy prędzej nie uderza,\nAni leniwiej, gwoli tym, co mogą\nWyglądać jego z pragnieniem lub trwogą."
    verse: true
    chunks:
      - pl: "Gdybyś w tym krzyku zgadł treść ich pacierza,"
        ru: "Если бы ты угадал в этом крике смысл их молитвы,"
      - pl: "\nPoznałbyś zemstę, jakiej z upragnionym"
        ru: "ты узнал бы о мести, которую с жаждущим"
      - pl: "\nSercem, zaiste, doczekasz przed zgonem."
        ru: "сердцем ты, воистину, увидишь до своей кончины."
      - pl: "\nMiecz z góry nigdy prędzej nie uderza,"
        ru: "Меч свыше никогда не разит ни скорее,"
      - pl: "\nAni leniwiej, gwoli tym, co mogą"
        ru: "ни медленнее, чем кажется тем, кто"
      - pl: "\nWyglądać jego z pragnieniem lub trwogą."
        ru: "ожидает его с желанием или страхом."
        note: "gwoli — ради, для"
    words: { "zemstę": zemsta, "doczekasz": doczekac, "zgonem": zgon, "prędzej": predko, "uderza": uderzac, "pragnieniem": pragnienie }
  - clean: "A teraz odwróć oczy w inną stronę,\nObaczysz duchy w swych światłach zamknione,\nJeśli, jak mówię, zwrócisz wzrok ode mnie».\nZwracając oczy, jak chciała, widziałem\nZe sto sfer małych, co się gronem całem\nW promienie wspólne stroiły wzajemnie."
    verse: true
    chunks:
      - pl: "A teraz odwróć oczy w inną stronę,"
        ru: "А теперь обрати глаза в другую сторону,"
      - pl: "\nObaczysz duchy w swych światłach zamknione,"
        ru: "ты увидишь духов, заключённых в своих светах,"
      - pl: "\nJeśli, jak mówię, zwrócisz wzrok ode mnie»."
        ru: "если, как я говорю, отведёшь от меня взгляд»."
      - pl: "\nZwracając oczy, jak chciała, widziałem"
        ru: "Обратив глаза, как она хотела, я увидел"
      - pl: "\nZe sto sfer małych, co się gronem całem"
        ru: "около сотни малых сфер, что всем сонмом"
      - pl: "\nW promienie wspólne stroiły wzajemnie."
        ru: "взаимно украшали друг друга общими лучами."
    words: { "odwróć": odwrocic, "wzrok": wzrok, "Zwracając": zwracac, "gronem": grono, "promienie": promien, "wzajemnie": wzajemnie }
  - clean: "Stałem podobny ostrożnej osobie,\nCo ukrywając ostrze żądzy w sobie,\nNie śmie z pytaniem wymknąć się nie w porę.\nWiększa z tych pereł i najwięcej słodka\nCiekawość moją ukoić zstąpiła.\n«Gdybyś» głos taki przemówił z jej środka:\n«Mógł widzieć miłość, jaka tu w nas gore,\nJuż by myśl twoja wyrażoną była,\nGdybyś zbyt późno nie stanął u kresu,\nKtóry cię siłą pociąga magnesu,\nWpierw pożądaną odpowiedź odbierzesz\nNa myśl, od której tak się pilno strzeżesz."
    verse: true
    chunks:
      - pl: "Stałem podobny ostrożnej osobie,"
        ru: "Я стоял, подобный осторожному человеку,"
      - pl: "\nCo ukrywając ostrze żądzy w sobie,"
        ru: "что, скрывая в себе остриё желания,"
      - pl: "\nNie śmie z pytaniem wymknąć się nie w porę."
        ru: "не смеет некстати вырваться с вопросом."
      - pl: "\nWiększa z tych pereł i najwięcej słodka"
        ru: "Большая и сладчайшая из этих жемчужин"
      - pl: "\nCiekawość moją ukoić zstąpiła."
        ru: "сошла, чтобы утолить моё любопытство."
      - pl: "\n«Gdybyś» głos taki przemówił z jej środka:"
        ru: "«Если бы ты, — такой голос сказал из её середины, —"
      - pl: "\n«Mógł widzieć miłość, jaka tu w nas gore,"
        ru: "мог видеть любовь, что здесь в нас горит,"
        note: "gorzeć — гореть"
      - pl: "\nJuż by myśl twoja wyrażoną była,"
        ru: "твоя мысль уже была бы высказана."
      - pl: "\nGdybyś zbyt późno nie stanął u kresu,"
        ru: "Чтобы ты не опоздал достичь предела,"
        note: "kres — предел, цель"
      - pl: "\nKtóry cię siłą pociąga magnesu,"
        ru: "который влечёт тебя силой магнита,"
      - pl: "\nWpierw pożądaną odpowiedź odbierzesz"
        ru: "ты прежде получишь желанный ответ"
      - pl: "\nNa myśl, od której tak się pilno strzeżesz."
        ru: "на мысль, от которой ты так усердно сторожишься."
    words: { "ostrze": ostrze, "Ciekawość": ciekawosc, "kresu": kres, "Wpierw": wpierw, "pilno": pilno, "strzeżesz": strzec }
  - clean: "Góra, na której dziś kasyno siedzi,\nZwiedzana niegdyś od błędnej gawiedzi,\nMiała świątynie i zbory pogańskie;\nPierwszy zaniosłem na nią imię Pańskie,\nPierwszego prawdy wiekuistej posła,\nCo nas od ziemi tak wysoko wzniosła."
    verse: true
    chunks:
      - pl: "Góra, na której dziś kasyno siedzi,"
        ru: "Гора, на склоне которой сегодня стоит Кассино,"
        note: "Монтекассино"
      - pl: "\nZwiedzana niegdyś od błędnej gawiedzi,"
        ru: "посещаемая некогда заблудшей чернью,"
        note: "gawiedź — чернь, толпа"
      - pl: "\nMiała świątynie i zbory pogańskie;"
        ru: "имела языческие храмы и капища;"
      - pl: "\nPierwszy zaniosłem na nią imię Pańskie,"
        ru: "я первым принёс на неё имя Господне,"
      - pl: "\nPierwszego prawdy wiekuistej posła,"
        ru: "имя первого посланца вечной истины,"
      - pl: "\nCo nas od ziemi tak wysoko wzniosła."
        ru: "что нас так высоко вознесла над землёй."
    words: { "Góra": gora, "świątynie": swiatynia, "zaniosłem": zaniesc, "imię": imie, "ziemi": ziemia, "wzniosła": wzniesc }
  - clean: "A promień łaski tak świecił nade mną,\nŻe z miast okólnych zdjąłem chmurę ciemną,\nMroczącą światłość tumanem pogaństwa,\nKtóry świat zwodził wiarą oszukaństwa.\nPatrz na tłum świateł, jaki tu migoce,\nByli to ludzie o marności swojej\nRozmyślający, którzy w życiu całem\nZapłomieniali duch takim zapałem,\nCo rodzi święte kwiaty i owoce."
    verse: true
    chunks:
      - pl: "A promień łaski tak świecił nade mną,"
        ru: "И луч благодати так светил надо мной,"
      - pl: "\nŻe z miast okólnych zdjąłem chmurę ciemną,"
        ru: "что я снял с окрестных городов тёмную тучу,"
      - pl: "\nMroczącą światłość tumanem pogaństwa,"
        ru: "омрачавшую свет туманом язычества,"
      - pl: "\nKtóry świat zwodził wiarą oszukaństwa."
        ru: "который обольщал мир лживой верой."
      - pl: "\nPatrz na tłum świateł, jaki tu migoce,"
        ru: "Смотри на толпу светил, что здесь мерцает:"
      - pl: "\nByli to ludzie o marności swojej"
        ru: "это были люди, размышлявшие"
      - pl: "\nRozmyślający, którzy w życiu całem"
        ru: "о своей бренности, которые всю жизнь"
      - pl: "\nZapłomieniali duch takim zapałem,"
        ru: "воспламеняли дух таким пылом,"
      - pl: "\nCo rodzi święte kwiaty i owoce."
        ru: "что рождает святые цветы и плоды."
    words: { "świecił": swiecic, "chmurę": chmura, "ciemną": ciemny, "wiarą": wiara, "kwiaty": kwiat, "owoce": owoc }
  - clean: "Tu jest Romuald, tu są bracia moi,\nCo się zamknęli po celach klasztornych,\nI w nich serc strzegli stałych i pokornych».\nA ja: — «Współczucie, jakie mówiąc do mnie,\nObjawiasz w słowach, ta życzliwość szczera\nWidna we wszystkich światłach wokoło mnie,\nTak rozwinęły mą ufność, jak słońce\nRozwija różę, gdy swój kwiat otwiera,\nŻe błagam ciebie przez prośby gorące,\nJeśli w twej łasce tak wysoko stoję,\nPokaż odkryte mi oblicze twoje»."
    verse: true
    chunks:
      - pl: "Tu jest Romuald, tu są bracia moi,"
        ru: "Здесь Ромуальд, здесь мои братья,"
      - pl: "\nCo się zamknęli po celach klasztornych,"
        ru: "что затворились в монастырских кельях"
      - pl: "\nI w nich serc strzegli stałych i pokornych»."
        ru: "и в них хранили стойкие и смиренные сердца»."
      - pl: "\nA ja: — «Współczucie, jakie mówiąc do mnie,"
        ru: "А я: — «Сочувствие, которое, говоря со мной,"
      - pl: "\nObjawiasz w słowach, ta życzliwość szczera"
        ru: "ты являешь в словах, и искренняя доброжелательность,"
      - pl: "\nWidna we wszystkich światłach wokoło mnie,"
        ru: "видная во всех светилах вокруг меня,"
      - pl: "\nTak rozwinęły mą ufność, jak słońce"
        ru: "так раскрыли моё доверие, как солнце"
      - pl: "\nRozwija różę, gdy swój kwiat otwiera,"
        ru: "раскрывает розу, когда она распускает цветок,"
      - pl: "\nŻe błagam ciebie przez prośby gorące,"
        ru: "что я горячими просьбами молю тебя:"
      - pl: "\nJeśli w twej łasce tak wysoko stoję,"
        ru: "если я стою так высоко в твоей милости,"
      - pl: "\nPokaż odkryte mi oblicze twoje»."
        ru: "покажи мне своё открытое лицо»."
    words: { "szczera": szczery, "rozwinęły": rozwinac, "różę": roza, "prośby": prosba, "łasce": laska-2, "oblicze": oblicze }
  - clean: "Duch na to: — «Żądz twoich otucha\nW ostatniej sferze spełni się dla ducha,\nGdzie się spełniają i drugich, i moje.\nTam jest chęć każda doskonale cała,\nBo w tamtej sferze każda część jej ciała\nNieporuszona tkwi, gdzie zawsze stała;\nSfera bez miejsca ponad przestrzeniami\nStoi nie krążąc między biegunami,\nNasza drabina aż do niej dotyka,\nPrzeto zakryta oczom śmiertelnika."
    verse: true
    chunks:
      - pl: "Duch na to: — «Żądz twoich otucha"
        ru: "Дух на это: — «Надежда твоих желаний"
        note: "otucha — надежда, ободрение"
      - pl: "\nW ostatniej sferze spełni się dla ducha,"
        ru: "исполнится для духа в последней сфере,"
      - pl: "\nGdzie się spełniają i drugich, i moje."
        ru: "где исполняются и чужие, и мои."
      - pl: "\nTam jest chęć każda doskonale cała,"
        ru: "Там всякое желание совершенно и цельно,"
      - pl: "\nBo w tamtej sferze każda część jej ciała"
        ru: "ибо в той сфере каждая её часть"
      - pl: "\nNieporuszona tkwi, gdzie zawsze stała;"
        ru: "неподвижно пребывает там, где стояла всегда;"
      - pl: "\nSfera bez miejsca ponad przestrzeniami"
        ru: "сфера без места, над пространствами,"
      - pl: "\nStoi nie krążąc między biegunami,"
        ru: "стоит, не вращаясь между полюсами;"
      - pl: "\nNasza drabina aż do niej dotyka,"
        ru: "наша лестница достигает до неё,"
      - pl: "\nPrzeto zakryta oczom śmiertelnika."
        ru: "поэтому скрыта от глаз смертного."
    words: { "otucha": otucha, "spełni": spelnic, "Nieporuszona": poruszyc, "tkwi": tkwic, "krążąc": krazyc, "drabina": drabina }
  - clean: "We śnie ją Jakub patriarcha zoczył\nAż po wierzchołek, co się zaobłoczył,\nSkroś obwieszoną gronami aniołów.\nDziś, by iść po niej, nikt z ziemskich padołów\nStopy nie ruszy, a moja reguła\nNa to tam służy, aby papier psuła."
    verse: true
    chunks:
      - pl: "We śnie ją Jakub patriarcha zoczył"
        ru: "Во сне её увидел патриарх Иаков"
        note: "zoczyć — увидеть"
      - pl: "\nAż po wierzchołek, co się zaobłoczył,"
        ru: "до самой вершины, что ушла за облака,"
      - pl: "\nSkroś obwieszoną gronami aniołów."
        ru: "сплошь увешанную гроздьями ангелов."
        note: "skroś — насквозь, сплошь"
      - pl: "\nDziś, by iść po niej, nikt z ziemskich padołów"
        ru: "Сегодня, чтобы идти по ней, никто из земной юдоли"
        note: "padół — юдоль"
      - pl: "\nStopy nie ruszy, a moja reguła"
        ru: "не сдвинет ноги, а мой устав"
      - pl: "\nNa to tam służy, aby papier psuła."
        ru: "служит там лишь на то, чтобы портить бумагу."
    words: { "śnie": sen, "ziemskich": ziemski, "reguła": regula, "służy": sluzyc, "papier": papier, "psuła": psuc }
  - clean: "Klasztorne w lochy zmieniły się mury,\nWorami stęchłej mąki są kaptury.\nNajcięższa lichwa nie tyle się sroży\nW grzechowym buncie przeciw woli bożej,\nJak owoc bogactw, który serca mnisze\nJak jad oszala w łakomstwie i pysze."
    verse: true
    chunks:
      - pl: "Klasztorne w lochy zmieniły się mury,"
        ru: "Монастырские стены превратились в притоны,"
        note: "loch — подземелье, вертеп"
      - pl: "\nWorami stęchłej mąki są kaptury."
        ru: "капюшоны — мешки затхлой муки."
        note: "stęchły — затхлый"
      - pl: "\nNajcięższa lichwa nie tyle się sroży"
        ru: "Тягчайшее ростовщичество не так свирепствует"
      - pl: "\nW grzechowym buncie przeciw woli bożej,"
        ru: "в греховном бунте против Божьей воли,"
      - pl: "\nJak owoc bogactw, który serca mnisze"
        ru: "как плод богатств, который монашеские сердца"
      - pl: "\nJak jad oszala w łakomstwie i pysze."
        ru: "словно ядом сводит с ума в алчности и гордыне."
    words: { "mury": mur, "Worami": wor, "mąki": maka, "buncie": bunt, "bożej": bozy, "bogactw": bogactwo }
  - clean: "Grosz, jaki Kościół na ziemi oszczędza,\nNiech ma żebrząca w imię Boga nędza,\nNie, żeby po nim brali spadki sporsze,\nKrewni, gamraty lub co jeszcze gorsze.\nMdłym ciałem waszym taka krewkość miota,\nŻe każda dobra ustawa zwietrzeje,\nNim dąb wyrośnie, a żołędź dojrzeje."
    verse: true
    chunks:
      - pl: "Grosz, jaki Kościół na ziemi oszczędza,"
