  - clean: "Znalazłem tam ławkę z jakiegoś żółtego metalu, którego nie rozpoznałem, miejscami przeżartą czymś w rodzaju różowawej rdzy i do połowy zarośniętą miękkim mchem, z poręczami odlanymi i opiłowanymi na kształt głów gryfów. Usiadłem na niej i ogarnąłem wzrokiem szeroki widok naszego starego świata w zachodzie słońca tego długiego dnia. Był to widok tak słodki i piękny, jak żaden, który kiedykolwiek widziałem. Słońce zaszło już za horyzont, a zachód płonął złotem, przeciętym kilkoma poziomymi pasami purpury i karmazynu."
