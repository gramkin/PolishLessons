level: B2
paragraphs:
  - clean: "Wkrótce odkryłem u moich małych gospodarzy coś osobliwego, a mianowicie brak zainteresowania. Podchodzili do mnie z gorliwymi okrzykami zdumienia, jak dzieci, ale jak dzieci szybko przestawali mnie oglądać i odchodzili za jakąś inną zabawką. Gdy skończył się obiad i moje pierwsze próby rozmowy, po raz pierwszy zauważyłem, że niemal wszyscy, którzy mnie z początku otaczali, odeszli."
    en: "“A queer thing I soon discovered about my little hosts, and that was their lack of interest. They would come to me with eager cries of astonishment, like children, but, like children they would soon stop examining me, and wander away after some other toy. The dinner and my conversational beginnings ended, I noted for the first time that almost all those who had surrounded me at first were gone."
    draft: true
    chunks:
      - pl: "Wkrótce odkryłem u moich małych gospodarzy coś osobliwego, a mianowicie brak zainteresowania."
        ru: "Вскоре я обнаружил у своих маленьких хозяев одну странность — отсутствие интереса."
      - pl: " Podchodzili do mnie z gorliwymi okrzykami zdumienia, jak dzieci, ale jak dzieci szybko przestawali mnie oglądać i odchodzili za jakąś inną zabawką."
        ru: "Они подходили ко мне с живыми возгласами удивления, как дети, но, как дети, скоро переставали меня разглядывать и уходили за какой-нибудь другой игрушкой."
        note: "gorliwy — рьяный, горячий"
      - pl: " Gdy skończył się obiad i moje pierwsze próby rozmowy, po raz pierwszy zauważyłem, że niemal wszyscy, którzy mnie z początku otaczali, odeszli."
        ru: "Когда кончился обед и мои первые попытки беседы, я впервые заметил, что почти все, кто окружал меня поначалу, ушли."
    words: { "gospodarzy": gospodarz, "Podchodzili": podchodzic, "przestawali": przestawac, "zabawką": zabawka, "otaczali": otaczac }
  - clean: "Dziwne też, jak szybko przestałem zważać na tych małych ludzi. Gdy tylko zaspokoiłem głód, wyszedłem przez wrota z powrotem w słoneczny świat. Ciągle spotykałem kolejnych ludzi przyszłości, którzy szli za mną kawałek, szczebiotali i śmiali się ze mnie, a uśmiechnąwszy się i pogestykulowawszy przyjaźnie, zostawiali mnie znów samemu sobie."
    en: "It is odd, too, how speedily I came to disregard these little people. I went out through the portal into the sunlit world again as soon as my hunger was satisfied. I was continually meeting more of these men of the future, who would follow me a little distance, chatter and laugh about me, and, having smiled and gesticulated in a friendly way, leave me again to my own devices."
    draft: true
    chunks:
      - pl: "Dziwne też, jak szybko przestałem zważać na tych małych ludzi."
        ru: "Странно и то, как быстро я перестал обращать внимание на этих маленьких людей."
        note: "zważać na coś — обращать внимание на что-л."
      - pl: " Gdy tylko zaspokoiłem głód, wyszedłem przez wrota z powrotem w słoneczny świat."
        ru: "Как только я утолил голод, я снова вышел через ворота в залитый солнцем мир."
        note: "zaspokoić — утолить"
      - pl: " Ciągle spotykałem kolejnych ludzi przyszłości, którzy szli za mną kawałek, szczebiotali i śmiali się ze mnie,"
        ru: "Я постоянно встречал всё новых людей будущего, которые немного шли за мной, щебетали и смеялись надо мной,"
      - pl: " a uśmiechnąwszy się i pogestykulowawszy przyjaźnie, zostawiali mnie znów samemu sobie."
        ru: "а улыбнувшись и дружелюбно пожестикулировав, снова оставляли меня самому себе."
    words: { "głód": glod, "wrota": wrota, "słoneczny": sloneczny, "uśmiechnąwszy": usmiechnac, "zostawiali": zostawiac }
  - clean: "Gdy wyszedłem z wielkiej sali, na świat spływał wieczorny spokój, a krajobraz oświetlał ciepły blask zachodzącego słońca. Z początku wszystko było bardzo mylące. Wszystko było tak zupełnie inne od świata, który znałem — nawet kwiaty. Wielki budynek, który opuściłem, stał na zboczu szerokiej doliny rzecznej, ale Tamiza przesunęła się może o milę od swego obecnego miejsca."
    en: "“The calm of evening was upon the world as I emerged from the great hall, and the scene was lit by the warm glow of the setting sun. At first things were very confusing. Everything was so entirely different from the world I had known—even the flowers. The big building I had left was situated on the slope of a broad river valley, but the Thames had shifted, perhaps, a mile from its present position."
    draft: true
    chunks:
      - pl: "Gdy wyszedłem z wielkiej sali, na świat spływał wieczorny spokój, a krajobraz oświetlał ciepły blask zachodzącego słońca."
        ru: "Когда я вышел из большого зала, на мир опускался вечерний покой, а пейзаж освещало тёплое сияние заходящего солнца."
      - pl: " Z początku wszystko było bardzo mylące."
        ru: "Поначалу всё сбивало с толку."
        note: "mylący — сбивающий с толку"
      - pl: " Wszystko było tak zupełnie inne od świata, który znałem — nawet kwiaty."
        ru: "Всё было так совершенно не похоже на мир, который я знал, — даже цветы."
      - pl: " Wielki budynek, który opuściłem, stał na zboczu szerokiej doliny rzecznej,"
        ru: "Большое здание, которое я покинул, стояло на склоне широкой речной долины,"
        note: "dolina — долина"
      - pl: " ale Tamiza przesunęła się może o milę od swego obecnego miejsca."
        ru: "но Темза сместилась, пожалуй, на милю от своего нынешнего места."
    words: { "ciepły": cieply, "blask": blask, "szerokiej": szeroki, "doliny": dolina, "przesunęła": przesunac, "obecnego": obecny }
  - clean: "Postanowiłem wejść na szczyt grzbietu oddalonego może o półtorej mili, skąd mógłbym ogarnąć szerszym spojrzeniem tę naszą planetę w roku osiemset dwa tysiące siedemset pierwszym naszej ery. Taką bowiem datę, muszę wyjaśnić, wskazywały małe tarcze mojej maszyny."
    en: "I resolved to mount to the summit of a crest, perhaps a mile and a half away, from which I could get a wider view of this our planet in the year Eight Hundred and Two Thousand Seven Hundred and One, A.D. For that, I should explain, was the date the little dials of my machine recorded."
    draft: true
    chunks:
      - pl: "Postanowiłem wejść na szczyt grzbietu oddalonego może o półtorej mili,"
        ru: "Я решил подняться на вершину гребня, отстоявшего, пожалуй, мили на полторы,"
        note: "grzbiet — хребет, гребень"
      - pl: " skąd mógłbym ogarnąć szerszym spojrzeniem tę naszą planetę w roku osiemset dwa tysiące siedemset pierwszym naszej ery."
        ru: "откуда я мог бы охватить более широким взглядом эту нашу планету в восемьсот две тысячи семьсот первом году нашей эры."
        note: "ogarnąć spojrzeniem — охватить взглядом"
      - pl: " Taką bowiem datę, muszę wyjaśnić, wskazywały małe tarcze mojej maszyny."
        ru: "Именно такую дату, должен пояснить, показывали маленькие циферблаты моей машины."
    words: { "szczyt": szczyt, "oddalonego": oddalic, "ogarnąć": ogarnac, "szerszym": szeroki, "datę": data, "tarcze": tarcza }
  - clean: "Idąc, wypatrywałem każdego wrażenia, które mogłoby pomóc wyjaśnić stan zrujnowanej wspaniałości, w jakim zastałem świat — bo był on zrujnowany. Kawałek wyżej na wzgórzu leżała na przykład wielka sterta granitu, spojonego bryłami aluminium, ogromny labirynt stromych ścian i zwalonych kup, wśród których rosły gęste kępy bardzo pięknych roślin podobnych do pagód — chyba pokrzyw, ale cudownie zabarwionych na brązowo wokół liści i niezdolnych do parzenia."
    en: "“As I walked I was watching for every impression that could possibly help to explain the condition of ruinous splendour in which I found the world—for ruinous it was. A little way up the hill, for instance, was a great heap of granite, bound together by masses of aluminium, a vast labyrinth of precipitous walls and crumpled heaps, amidst which were thick heaps of very beautiful pagoda-like plants—nettles possibly—but wonderfully tinted with brown about the leaves, and incapable of stinging."
    draft: true
    chunks:
      - pl: "Idąc, wypatrywałem każdego wrażenia, które mogłoby pomóc wyjaśnić stan zrujnowanej wspaniałości, w jakim zastałem świat — bo był on zrujnowany."
        ru: "По дороге я ловил каждое впечатление, которое могло бы помочь объяснить состояние разрушенного великолепия, в котором я застал мир, — ибо он был разрушен."
        note: "wypatrywać — высматривать"
      - pl: " Kawałek wyżej na wzgórzu leżała na przykład wielka sterta granitu, spojonego bryłami aluminium,"
        ru: "Чуть выше на холме, например, лежала огромная груда гранита, скреплённого глыбами алюминия,"
        note: "sterta — куча, груда; spojony — скреплённый"
      - pl: " ogromny labirynt stromych ścian i zwalonych kup, wśród których rosły gęste kępy bardzo pięknych roślin podobnych do pagód —"
        ru: "огромный лабиринт отвесных стен и обвалившихся груд, среди которых росли густые заросли очень красивых растений, похожих на пагоды, —"
        note: "stromy — крутой; kępa — куст, заросль"
      - pl: " chyba pokrzyw, ale cudownie zabarwionych na brązowo wokół liści i niezdolnych do parzenia."
        ru: "вероятно, крапивы, но чудесно окрашенной в бурый цвет по краям листьев и неспособной жалить."
        note: "pokrzywa — крапива; parzyć — жечь, жалить (о крапиве)"
    words: { "zrujnowanej": zrujnowac, "wzgórzu": wzgorze, "rosły": rosnac, "roślin": roslina, "pokrzyw": pokrzywa, "cudownie": cudownie }
  - clean: "Były to najwyraźniej opuszczone szczątki jakiejś ogromnej budowli; w jakim celu ją zbudowano, nie umiałem ustalić. Właśnie tutaj było mi pisane później przeżyć bardzo dziwne zdarzenie — pierwszą zapowiedź jeszcze dziwniejszego odkrycia — ale o tym opowiem we właściwym miejscu."
    en: "It was evidently the derelict remains of some vast structure, to what end built I could not determine. It was here that I was destined, at a later date, to have a very strange experience—the first intimation of a still stranger discovery—but of that I will speak in its proper place."
    draft: true
    chunks:
      - pl: "Były to najwyraźniej opuszczone szczątki jakiejś ogromnej budowli; w jakim celu ją zbudowano, nie umiałem ustalić."
        ru: "Это, очевидно, были заброшенные останки какого-то огромного сооружения; для какой цели его построили, я определить не мог."
        note: "szczątki — останки, обломки"
      - pl: " Właśnie tutaj było mi pisane później przeżyć bardzo dziwne zdarzenie — pierwszą zapowiedź jeszcze dziwniejszego odkrycia —"
        ru: "Именно здесь мне суждено было позднее пережить очень странное происшествие — первый намёк на ещё более странное открытие, —"
        note: "było mi pisane — мне было суждено"
      - pl: " ale o tym opowiem we właściwym miejscu."
        ru: "но об этом я расскажу в своё время."
    words: { "najwyraźniej": wyraznie, "ogromnej": ogromny, "zbudowano": zbudowac, "ustalić": ustalic, "właściwym": wlasciwy }
  - clean: "Rozglądając się z tarasu, na którym na chwilę przysiadłem, uświadomiłem sobie nagle, że nigdzie nie widać małych domów. Najwyraźniej pojedynczy dom, a może nawet i rodzina, zniknęły. Tu i ówdzie wśród zieleni stały budowle podobne do pałaców, ale dom i chata, tak charakterystyczne dla naszego angielskiego krajobrazu, zniknęły."
    en: "“Looking round, with a sudden thought, from a terrace on which I rested for a while, I realised that there were no small houses to be seen. Apparently the single house, and possibly even the household, had vanished. Here and there among the greenery were palace-like buildings, but the house and the cottage, which form such characteristic features of our own English landscape, had disappeared."
    draft: true
    chunks:
      - pl: "Rozglądając się z tarasu, na którym na chwilę przysiadłem, uświadomiłem sobie nagle, że nigdzie nie widać małych domów."
        ru: "Оглядываясь с террасы, где я ненадолго присел, я вдруг осознал, что нигде не видно маленьких домов."
      - pl: " Najwyraźniej pojedynczy dom, a może nawet i rodzina, zniknęły."
        ru: "По-видимому, отдельный дом, а возможно, и семья исчезли."
      - pl: " Tu i ówdzie wśród zieleni stały budowle podobne do pałaców,"
        ru: "Тут и там среди зелени стояли похожие на дворцы здания,"
        note: "tu i ówdzie — тут и там"
      - pl: " ale dom i chata, tak charakterystyczne dla naszego angielskiego krajobrazu, zniknęły."
        ru: "но дом и коттедж, столь характерные для нашего английского пейзажа, исчезли."
    words: { "tarasu": taras, "uświadomiłem": uswiadomic, "pojedynczy": pojedynczy, "pałaców": palac, "chata": chata, "angielskiego": angielski }
  - clean: "„Komunizm” — powiedziałem do siebie."
    en: "“‘Communism,’ said I to myself."
    draft: true
    chunks:
      - pl: "„Komunizm” — powiedziałem do siebie."
        ru: "«Коммунизм», — сказал я себе."
    words: { "powiedziałem": powiedziec }
  - clean: "A tuż za tą myślą przyszła następna. Spojrzałem na pół tuzina małych postaci, które szły za mną. I nagle, w jednym błysku, dostrzegłem, że wszyscy mają ten sam krój stroju, tę samą miękką, bezwłosą twarz i tę samą dziewczęcą krągłość członków. Może się wydawać dziwne, że nie zauważyłem tego wcześniej. Ale wszystko było tak dziwne. Teraz widziałem to wyraźnie."
    en: "“And on the heels of that came another thought. I looked at the half-dozen little figures that were following me. Then, in a flash, I perceived that all had the same form of costume, the same soft hairless visage, and the same girlish rotundity of limb. It may seem strange, perhaps, that I had not noticed this before. But everything was so strange. Now, I saw the fact plainly enough."
    draft: true
    chunks:
      - pl: "A tuż za tą myślą przyszła następna."
        ru: "А следом за этой мыслью пришла другая."
        note: "tuż za — сразу за"
      - pl: " Spojrzałem na pół tuzina małych postaci, które szły za mną."
        ru: "Я посмотрел на полдюжины маленьких фигурок, шедших за мной."
      - pl: " I nagle, w jednym błysku, dostrzegłem, że wszyscy mają ten sam krój stroju, tę samą miękką, bezwłosą twarz i tę samą dziewczęcą krągłość członków."
        ru: "И вдруг, в одно мгновение, я увидел, что у всех одинаковый покрой одежды, одинаковое мягкое безволосое лицо и одинаковая девичья округлость рук и ног."
        note: "krój — покрой; krągłość — округлость"
      - pl: " Może się wydawać dziwne, że nie zauważyłem tego wcześniej."
        ru: "Может показаться странным, что я не заметил этого раньше."
      - pl: " Ale wszystko było tak dziwne."
        ru: "Но всё было так странно."
      - pl: " Teraz widziałem to wyraźnie."
        ru: "Теперь я видел это ясно."
    words: { "tuzina": tuzin, "postaci": postac, "dostrzegłem": dostrzec, "stroju": stroj, "miękką": miekki, "członków": czlonek }
  - clean: "W stroju i we wszystkich różnicach budowy i postawy, które dziś odróżniają płcie od siebie, ci ludzie przyszłości byli do siebie podobni. A dzieci wydawały mi się tylko miniaturami swoich rodziców. Uznałem wtedy, że dzieci tamtych czasów są nadzwyczaj wcześnie dojrzałe, przynajmniej fizycznie, i później znalazłem obfite potwierdzenie tego mniemania."
    en: "In costume, and in all the differences of texture and bearing that now mark off the sexes from each other, these people of the future were alike. And the children seemed to my eyes to be but the miniatures of their parents. I judged then that the children of that time were extremely precocious, physically at least, and I found afterwards abundant verification of my opinion."
    draft: true
    chunks:
      - pl: "W stroju i we wszystkich różnicach budowy i postawy, które dziś odróżniają płcie od siebie, ci ludzie przyszłości byli do siebie podobni."
        ru: "В одежде и во всех различиях сложения и осанки, которые сегодня отличают полы друг от друга, эти люди будущего были одинаковы."
        note: "płeć — пол"
      - pl: " A dzieci wydawały mi się tylko miniaturami swoich rodziców."
        ru: "А дети казались мне лишь миниатюрами своих родителей."
      - pl: " Uznałem wtedy, że dzieci tamtych czasów są nadzwyczaj wcześnie dojrzałe, przynajmniej fizycznie,"
        ru: "Я решил тогда, что дети того времени чрезвычайно рано созревают, по крайней мере физически,"
        note: "wcześnie dojrzały — рано развитый"
      - pl: " i później znalazłem obfite potwierdzenie tego mniemania."
        ru: "и позднее нашёл обильное подтверждение своему мнению."
        note: "mniemanie — мнение"
    words: { "stroju": stroj, "budowy": budowa, "postawy": postawa, "płcie": plec, "fizycznie": fizycznie }
  - clean: "Widząc swobodę i bezpieczeństwo, w jakich żyli ci ludzie, poczułem, że to bliskie podobieństwo płci jest w końcu tym, czego należałoby się spodziewać; siła mężczyzny bowiem i miękkość kobiety, instytucja rodziny i zróżnicowanie zajęć to tylko wojenne konieczności epoki siły fizycznej. Tam, gdzie ludność jest zrównoważona i liczna, rodzenie wielu dzieci staje się dla Państwa raczej złem niż błogosławieństwem; tam, gdzie przemoc zdarza się rzadko, a potomstwo jest bezpieczne, mniej potrzeba — a właściwie wcale nie potrzeba — sprawnej rodziny, i specjalizacja płci ze względu na potrzeby dzieci zanika."
    en: "“Seeing the ease and security in which these people were living, I felt that this close resemblance of the sexes was after all what one would expect; for the strength of a man and the softness of a woman, the institution of the family, and the differentiation of occupations are mere militant necessities of an age of physical force. Where population is balanced and abundant, much childbearing becomes an evil rather than a blessing to the State; where violence comes but rarely and offspring are secure, there is less necessity—indeed there is no necessity—for an efficient family, and the specialisation of the sexes with reference to their children’s needs disappears."
    draft: true
    chunks:
      - pl: "Widząc swobodę i bezpieczeństwo, w jakich żyli ci ludzie, poczułem, że to bliskie podobieństwo płci jest w końcu tym, czego należałoby się spodziewać;"
        ru: "Видя непринуждённость и безопасность, в которых жили эти люди, я почувствовал, что это близкое сходство полов в конце концов именно то, чего следовало ожидать;"
      - pl: " siła mężczyzny bowiem i miękkość kobiety, instytucja rodziny i zróżnicowanie zajęć to tylko wojenne konieczności epoki siły fizycznej."
        ru: "ведь сила мужчины и мягкость женщины, институт семьи и разделение занятий — лишь воинственные необходимости эпохи физической силы."
        note: "zróżnicowanie — дифференциация"
      - pl: " Tam, gdzie ludność jest zrównoważona i liczna, rodzenie wielu dzieci staje się dla Państwa raczej złem niż błogosławieństwem;"
        ru: "Там, где население уравновешено и многочисленно, рождение многих детей становится для Государства скорее злом, чем благом;"
