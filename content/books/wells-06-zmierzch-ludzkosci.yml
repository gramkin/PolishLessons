  - clean: "Wydało mi się, że trafiłem na ludzkość w okresie schyłku. Czerwony zachód słońca nasunął mi myśl o zmierzchu ludzkości. Po raz pierwszy zacząłem zdawać sobie sprawę z dziwnego następstwa wysiłku społecznego, w który jesteśmy obecnie zaangażowani. A przecież, jak się zastanowić, jest to dość logiczne następstwo. Siła jest owocem potrzeby; bezpieczeństwo nagradza słabość. Praca nad polepszaniem warunków życia — prawdziwy proces cywilizacyjny, który czyni życie coraz bezpieczniejszym — postępowała stale aż do szczytu. Jeden triumf zjednoczonej ludzkości nad Naturą następował po drugim. Rzeczy, które dziś są tylko marzeniami, stały się projektami rozważnie podjętymi i doprowadzonymi do końca. A żniwem było to, co widziałem!"
