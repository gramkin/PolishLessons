  - clean: "Ulepszamy je stopniowo, bo nasze ideały są mgliste i niepewne, a nasza wiedza bardzo ograniczona; bo i Natura jest w naszych niezgrabnych rękach płochliwa i powolna. Pewnego dnia wszystko to będzie lepiej zorganizowane, i jeszcze lepiej. Taki jest kierunek prądu, mimo wirów. Cały świat będzie rozumny, wykształcony i współpracujący; sprawy będą postępować coraz szybciej ku ujarzmieniu Natury. W końcu mądrze i starannie przestawimy równowagę życia zwierzęcego i roślinnego tak, by służyła naszym ludzkim potrzebom."
