  - clean: "Nawet ten artystyczny zapał w końcu by wygasł — w Czasie, który oglądałem, niemal już wygasł. Zdobić się kwiatami, tańczyć, śpiewać w słońcu: tyle zostało z ducha artystycznego, i nic więcej. Nawet to w końcu przeszłoby w zadowoloną bezczynność. Ostrzy nas osełka bólu i konieczności, i wydawało mi się, że tu ta nienawistna osełka nareszcie się rozbiła!"
