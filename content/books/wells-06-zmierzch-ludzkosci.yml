  - clean: "To przestawienie, mówię, musiało zostać dokonane, i to dobrze; dokonane wręcz na cały Czas, w tej przestrzeni Czasu, przez którą przeskoczyła moja maszyna. Powietrze było wolne od komarów, ziemia od chwastów i grzybów; wszędzie były owoce i słodkie, zachwycające kwiaty; lśniące motyle latały tu i tam. Ideał medycyny zapobiegawczej został osiągnięty. Choroby wytępiono. Przez cały mój pobyt nie widziałem śladu żadnej choroby zakaźnej. A później będę musiał wam powiedzieć, że nawet procesy gnicia i rozkładu zostały głęboko zmienione przez te przemiany."
