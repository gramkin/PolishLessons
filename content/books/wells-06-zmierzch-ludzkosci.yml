  - clean: "Bo przecież dzisiejsza higiena i rolnictwo są wciąż w stadium zaczątkowym. Nauka naszych czasów zaatakowała zaledwie mały wycinek pola ludzkich chorób, ale nawet tak poszerza pole swego działania stale i wytrwale. Nasze rolnictwo i ogrodnictwo niszczą chwast tylko tu i ówdzie i uprawiają może dwadzieścia kilka pożytecznych roślin, zostawiając większość, by same wywalczyły sobie równowagę, jak potrafią. Ulepszamy ulubione rośliny i zwierzęta — a jakże ich mało — stopniowo, przez selektywną hodowlę; to nową i lepszą brzoskwinię, to winogrono bez pestek, to wonniejszy i większy kwiat, to wygodniejszą rasę bydła."
