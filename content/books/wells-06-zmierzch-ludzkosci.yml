  - clean: "W nowych warunkach doskonałej wygody i bezpieczeństwa ta niespokojna energia, która u nas jest siłą, stałaby się słabością. Nawet w naszych czasach pewne skłonności i pragnienia, niegdyś niezbędne do przetrwania, są stałym źródłem porażek. Odwaga fizyczna i zamiłowanie do walki, na przykład, nie są wielką pomocą — mogą nawet przeszkadzać — człowiekowi cywilizowanemu. A w stanie fizycznej równowagi i bezpieczeństwa siła, zarówno umysłowa, jak i fizyczna, byłaby nie na miejscu. Sądziłem, że przez niezliczone lata nie było niebezpieczeństwa wojny ani samotnej przemocy, niebezpieczeństwa ze strony dzikich zwierząt, wyniszczających chorób wymagających silnego organizmu, ani potrzeby trudu. Do takiego życia ci, których nazwalibyśmy słabymi, są przygotowani równie dobrze jak silni, a właściwie nie są już słabi."
