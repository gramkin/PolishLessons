  - clean: "Ale wraz z tą zmianą warunków nieuchronnie przychodzi przystosowanie do zmiany. Co jest przyczyną ludzkiej inteligencji i wigoru, jeśli nauka biologiczna nie jest stekiem błędów? Trudności i wolność: warunki, w których ludzie czynni, silni i bystrzy przeżywają, a słabsi idą pod mur; warunki, które nagradzają wierny sojusz zdolnych ludzi, panowanie nad sobą, cierpliwość i stanowczość. A instytucja rodziny i uczucia, które się w niej rodzą, zażarta zazdrość, czułość dla potomstwa, rodzicielskie poświęcenie — wszystko to znajdowało uzasadnienie i oparcie w groźnych niebezpieczeństwach, jakie czyhały na młodych."
