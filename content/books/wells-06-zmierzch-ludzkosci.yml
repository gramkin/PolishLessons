  - clean: "Są nawet lepiej przygotowani, bo silnych gnębiłaby energia, dla której nie byłoby ujścia. Bez wątpienia wyszukane piękno budowli, które widziałem, było owocem ostatnich porywów bezcelowej już energii ludzkości, zanim osiadła ona w doskonałej harmonii z warunkami, w których żyła — ostatnim zawijasem triumfu, który rozpoczął ostatni wielki pokój. Taki zawsze był los energii w bezpieczeństwie: zwraca się ku sztuce i erotyce, a potem przychodzą gnuśność i rozkład."
