  - clean: "Stojąc tam w gęstniejącym mroku, sądziłem, że w tym prostym wyjaśnieniu rozwiązałem zagadkę świata — poznałem całą tajemnicę tych uroczych ludzi. Może środki, jakie wymyślili przeciw wzrostowi ludności, okazały się zbyt skuteczne, i ich liczba raczej zmalała, niż utrzymała się na stałym poziomie. To tłumaczyłoby opuszczone ruiny. Bardzo proste było moje wyjaśnienie, i dość wiarygodne — jak większość błędnych teorii!"
    en: "“As I stood there in the gathering dark I thought that in this simple explanation I had mastered the problem of the world—mastered the whole secret of these delicious people. Possibly the checks they had devised for the increase of population had succeeded too well, and their numbers had rather diminished than kept stationary. That would account for the abandoned ruins. Very simple was my explanation, and plausible enough—as most wrong theories are!"
    draft: true
