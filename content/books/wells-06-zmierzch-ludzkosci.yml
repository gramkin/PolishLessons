  - clean: "Osiągnięto też triumfy społeczne. Widziałem ludzkość mieszkającą we wspaniałych schronieniach, wspaniale odzianą, i jak dotąd nie zastałem jej przy żadnym trudzie. Nie było śladów walki, ani społecznej, ani gospodarczej. Sklep, reklama, ruch handlowy, cały handel, który stanowi ciało naszego świata, zniknęły. Było naturalne, że tamtego złotego wieczoru uchwyciłem się myśli o raju społecznym. Problem wzrostu ludności został rozwiązany, jak przypuszczałem, i ludności przestało przybywać."
