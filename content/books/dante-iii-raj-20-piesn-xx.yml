# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 20
chapterTitle: "Pieśń XX"
chapterTitleRu: "Песнь XX. Глаз орла"
level: B2
paragraphs:
  - clean: "Orzeł kończy mowę. Duchy śpiewają. Przemawia orzeł powtórnie i wymienia niektóre duchy: Dawida, Trajana, Hiskię, Konstantyna, Wilhelma, Ryfeusza. Dalsze pouczenia o błogosławieństwie niechrześcijan."
    chunks:
      - pl: "Orzeł kończy mowę. Duchy śpiewają. Przemawia orzeł powtórnie i wymienia niektóre duchy: Dawida, Trajana, Hiskię, Konstantyna, Wilhelma, Ryfeusza. Dalsze pouczenia o błogosławieństwie niechrześcijan."
        ru: "Орёл кончает речь. Духи поют. Орёл говорит снова и называет некоторых духов: Давида, Траяна, Езекию, Константина, Гульельмо, Рифея. Дальнейшие поучения о блаженстве нехристиан."
    words: { "Orzeł": orzel, "mowę": mowa, "śpiewają": spiewac, "Przemawia": przemawiac, "Dalsze": daleki, "błogosławieństwie": blogoslawienstwo }
  - clean: "Gdy światło, które oświeca świat cały,\nSchodząc z półkuli naszej, dzień przetrawia,\nNiebo, co przezeń świeciło w dzień biały,\nNagle wieczorną poświatę roznieci\nPrzez wiele świateł, w których jedno świeci;\nTaki stan nieba pamięć mi przedstawia,\nGdy dziób swój godło zamknęło monarsze."
    verse: true
    chunks:
      - pl: "Gdy światło, które oświeca świat cały,"
        ru: "Когда свет, что освещает весь мир,"
      - pl: "\nSchodząc z półkuli naszej, dzień przetrawia,"
        ru: "сходя с нашего полушария, истребляет день,"
      - pl: "\nNiebo, co przezeń świeciło w dzień biały,"
        ru: "небо, что светилось им в белый день,"
      - pl: "\nNagle wieczorną poświatę roznieci"
        ru: "вдруг зажжёт вечернее сияние"
        note: "poświata — сияние"
      - pl: "\nPrzez wiele świateł, w których jedno świeci;"
        ru: "множеством светил, в которых светит одно;"
      - pl: "\nTaki stan nieba pamięć mi przedstawia,"
        ru: "такое состояние неба представляет мне память,"
      - pl: "\nGdy dziób swój godło zamknęło monarsze."
        ru: "когда царственный знак сомкнул свой клюв."
    words: { "Schodząc": schodzic, "Niebo": niebo, "świeciło": swiecic, "Nagle": nagle, "pamięć": pamiec, "przedstawia": przedstawiac }
  - clean: "Bo żywe światła miecąc blaski jarsze,\nUrocze pieśni znów śpiewać poczęły,\nKtóre z pamięci mej jak sen wionęły.\nZ jakim gorącem, o miłości słodka,\nPłoniesz w tych światłach, wybłyskasz z ich środka,\nSkąd ich duch iskrzy świętymi myślami!"
    verse: true
    chunks:
      - pl: "Bo żywe światła miecąc blaski jarsze,"
        ru: "Ибо живые светила, мечущие более яркие блески,"
        note: "jarszy — более яркий"
      - pl: "\nUrocze pieśni znów śpiewać poczęły,"
        ru: "снова начали петь прелестные песни,"
      - pl: "\nKtóre z pamięci mej jak sen wionęły."
        ru: "что развеялись из моей памяти, как сон."
      - pl: "\nZ jakim gorącem, o miłości słodka,"
        ru: "С каким жаром, о сладкая любовь,"
      - pl: "\nPłoniesz w tych światłach, wybłyskasz z ich środka,"
        ru: "ты пылаешь в этих светилах, вспыхиваешь из их середины,"
      - pl: "\nSkąd ich duch iskrzy świętymi myślami!"
        ru: "откуда их дух искрится святыми мыслями!"
    words: { "żywe": zywy, "blaski": blask, "pieśni": piesn, "poczęły": poczac, "Płoniesz": plonac, "myślami": mysl }
  - clean: "Gdy szóstej gwiazdy te drogie kamienie\nAnielskich dzwonków przerwały dzwonienie,\nZda się, słyszałem, szmer, łoskot strumyka,\nCo jasne wody staczając skałami,\nŚwiadczył dostatek źródła, skąd wynika.\nJak w szyi lutni dźwięk kształt swój odlewa,\nJak otworami wierzbowego drzewa\nWiatr wpadający całą fletnią śpiewa,\nTak nie czekając, wrzawa tonów taka\nZarazem w szyi zaszumiała ptaka,\nJakby ta była jak fletnia dziurawa."
    verse: true
    chunks:
      - pl: "Gdy szóstej gwiazdy te drogie kamienie"
        ru: "Когда эти драгоценные камни шестой звезды"
      - pl: "\nAnielskich dzwonków przerwały dzwonienie,"
        ru: "прервали звон ангельских колокольчиков,"
      - pl: "\nZda się, słyszałem, szmer, łoskot strumyka,"
        ru: "мне показалось, я слышал шелест, грохот ручья,"
      - pl: "\nCo jasne wody staczając skałami,"
        ru: "что, скатывая ясные воды по скалам,"
      - pl: "\nŚwiadczył dostatek źródła, skąd wynika."
        ru: "свидетельствовал об обилии источника, откуда течёт."
      - pl: "\nJak w szyi lutni dźwięk kształt swój odlewa,"
        ru: "Как в шейке лютни звук отливает свою форму,"
      - pl: "\nJak otworami wierzbowego drzewa"
        ru: "как сквозь отверстия ивового дерева"
      - pl: "\nWiatr wpadający całą fletnią śpiewa,"
        ru: "ветер, влетающий, поёт всей свирелью,"
        note: "fletnia — свирель"
      - pl: "\nTak nie czekając, wrzawa tonów taka"
        ru: "так, не дожидаясь, такой шум тонов"
      - pl: "\nZarazem w szyi zaszumiała ptaka,"
        ru: "разом зашумел в шее птицы,"
      - pl: "\nJakby ta była jak fletnia dziurawa."
        ru: "словно она была дырявой, как свирель."
    words: { "dzwonków": dzwonek, "szmer": szmer, "Świadczył": swiadczyc, "wynika": wynikac, "otworami": otwor, "wpadający": wpadac }
  - clean: "I przez dziób jego wyszła głosu wrzawa\nW kształcie słów takich, na jakie czekałem\nSpragnionym sercem, gdzie je zapisałem.\nPtak mówił: — «We mnie ta cząstka widząca,\nCo w ziemskich orłach znosi promień słońca,\nChce, abyś sam jej przypatrzył się bliżej."
    verse: true
    chunks:
      - pl: "I przez dziób jego wyszła głosu wrzawa"
        ru: "И через её клюв вышел шум голоса"
      - pl: "\nW kształcie słów takich, na jakie czekałem"
        ru: "в виде таких слов, каких я ждал"
      - pl: "\nSpragnionym sercem, gdzie je zapisałem."
        ru: "жаждущим сердцем, где я их записал."
      - pl: "\nPtak mówił: — «We mnie ta cząstka widząca,"
        ru: "Птица сказала: — «Та видящая частица во мне,"
      - pl: "\nCo w ziemskich orłach znosi promień słońca,"
        ru: "что у земных орлов выносит луч солнца,"
      - pl: "\nChce, abyś sam jej przypatrzył się bliżej."
        ru: "хочет, чтобы ты сам присмотрелся к ней ближе."
    words: { "kształcie": ksztalt, "Spragnionym": spragniony, "cząstka": czastka, "ziemskich": ziemski, "znosi": znosic, "promień": promien }
  - clean: "Patrz, z tylu świateł tej orlej budowy,\nTe, co oczyma iskrzą z mojej głowy,\nNa pierwszych szczeblach tu stoją najwyżej.\nPatrz, ten co błyszczy w środku mej powieki,\nŚwiętego Ducha piewcą był przed wieki,\nPo miastach arkę obnosił przymierza,\nTeraz tu wartość swych piesień odmierza\nMiarą nagrody i sam je ocenia\nWedle ich skutków i łaski natchnienia."
    verse: true
    chunks:
      - pl: "Patrz, z tylu świateł tej orlej budowy,"
        ru: "Смотри: из стольких светил этого орлиного строения"
      - pl: "\nTe, co oczyma iskrzą z mojej głowy,"
        ru: "те, что искрятся глазами из моей головы,"
      - pl: "\nNa pierwszych szczeblach tu stoją najwyżej."
        ru: "стоят здесь выше всех на первых ступенях."
      - pl: "\nPatrz, ten co błyszczy w środku mej powieki,"
        ru: "Смотри: тот, что сияет в середине моего века,"
        note: "зрачок — Давид"
      - pl: "\nŚwiętego Ducha piewcą był przed wieki,"
        ru: "был певцом Святого Духа в древности,"
      - pl: "\nPo miastach arkę obnosił przymierza,"
        ru: "по городам носил ковчег завета,"
      - pl: "\nTeraz tu wartość swych piesień odmierza"
        ru: "теперь здесь измеряет цену своих песен"
      - pl: "\nMiarą nagrody i sam je ocenia"
        ru: "мерой награды и сам их оценивает"
      - pl: "\nWedle ich skutków i łaski natchnienia."
        ru: "по их следствиям и благодати вдохновения."
    words: { "budowy": budowa, "błyszczy": blyszczec, "wartość": wartosc, "Miarą": miara, "ocenia": oceniac, "skutków": skutek }
  - clean: "Z pięciu tworzących świetny łuk brwi mojej,\nTen, co najbliżej mego dzioba stoi,\nPo stracie syna pocieszył żal wdowi,\nIle kosztuje, poznał z doświadczenia,\nNiebieskich uciech, ziemskiego cierpienia,\nNie być z owczarni miłej Chrystusowi."
    verse: true
    chunks:
      - pl: "Z pięciu tworzących świetny łuk brwi mojej,"
        ru: "Из пяти, образующих блестящую дугу моей брови,"
      - pl: "\nTen, co najbliżej mego dzioba stoi,"
        ru: "тот, кто стоит ближе всех к моему клюву,"
        note: "Траян"
      - pl: "\nPo stracie syna pocieszył żal wdowi,"
        ru: "после утраты сына утешил вдовью скорбь,"
      - pl: "\nIle kosztuje, poznał z doświadczenia,"
        ru: "узнал на опыте, чего стоит"
      - pl: "\nNiebieskich uciech, ziemskiego cierpienia,"
        ru: "небесных утех, земного страдания —"
      - pl: "\nNie być z owczarni miłej Chrystusowi."
        ru: "не быть из овчарни, милой Христу."
    words: { "tworzących": tworzyc, "najbliżej": blisko, "stracie": strata, "pocieszył": pocieszyc, "kosztuje": kosztowac, "Niebieskich": niebieski }
  - clean: "Patrz, ten, co świeci, gdzie brew łuk podnasza,\nSzczerą pokutą wobec Izajasza,\nZwlekł na lat wiele swój kres ostateczny,\nWie, że sąd nigdy nie zmienia się wieczny,\nChociaż na ziemi modlitwa gorąca\nPrzemienia czasem zachód na wschód słońca."
    verse: true
    chunks:
      - pl: "Patrz, ten, co świeci, gdzie brew łuk podnasza,"
        ru: "Смотри: тот, что светит там, где бровь поднимает дугу,"
        note: "Езекия"
      - pl: "\nSzczerą pokutą wobec Izajasza,"
        ru: "искренним покаянием перед Исаией"
      - pl: "\nZwlekł na lat wiele swój kres ostateczny,"
        ru: "отсрочил на много лет свой последний предел,"
      - pl: "\nWie, że sąd nigdy nie zmienia się wieczny,"
        ru: "знает, что вечный суд никогда не меняется,"
      - pl: "\nChociaż na ziemi modlitwa gorąca"
        ru: "хотя на земле горячая молитва"
      - pl: "\nPrzemienia czasem zachód na wschód słońca."
        ru: "иногда превращает закат в восход солнца."
    words: { "kres": kres, "ostateczny": ostateczny, "wieczny": wieczny, "modlitwa": modlitwa, "zachód": zachod, "wschód": wschod }
  - clean: "Trzeci z kolei, którego w tym sława,\nŻe przeniósł na wschód mnie, orła, i prawa\nZły zbierał owoc z najlepszych zamiarów:\nSamochcąc berło ustąpił Cezarów\nRzymskim pasterzom i sam stał się Grekiem,\nCzuje, że nie jest dla niego szkodliwym\nZło wywołane sercem dobrotliwym,\nChoć świat wstrząsnęło trzęsieniem dalekiem."
    verse: true
    chunks:
      - pl: "Trzeci z kolei, którego w tym sława,"
        ru: "Третий по порядку, чья слава в том,"
        note: "Константин"
      - pl: "\nŻe przeniósł na wschód mnie, orła, i prawa"
        ru: "что перенёс на восток меня, орла, и законы,"
      - pl: "\nZły zbierał owoc z najlepszych zamiarów:"
        ru: "собрал дурной плод с лучших намерений:"
      - pl: "\nSamochcąc berło ustąpił Cezarów"
        ru: "по своей воле уступил скипетр цезарей"
      - pl: "\nRzymskim pasterzom i sam stał się Grekiem,"
        ru: "римским пастырям и сам стал греком,"
      - pl: "\nCzuje, że nie jest dla niego szkodliwym"
        ru: "он чувствует, что для него не губительно"
      - pl: "\nZło wywołane sercem dobrotliwym,"
        ru: "зло, вызванное добросердечием,"
      - pl: "\nChoć świat wstrząsnęło trzęsieniem dalekiem."
        ru: "хоть оно потрясло мир далёким землетрясением."
    words: { "kolei": kolej, "sława": slawa, "zbierał": zbierac, "owoc": owoc, "wywołane": wywolac, "wstrząsnęło": wstrzasnac }
  - clean: "Ten, co na łuku pochyłości świeci,\nPatrz, oto Wilhelm! Jako ojca dzieci,\nPłacze go naród, którego zła dola\nSkarży żyjących Frydryka, Karola;\nJak sprawiedliwy król w niebie kochany,\nWidzisz po blasku, jakim jest odziany."
    verse: true
    chunks:
      - pl: "Ten, co na łuku pochyłości świeci,"
        ru: "Тот, кто светит на склоне дуги,"
      - pl: "\nPatrz, oto Wilhelm! Jako ojca dzieci,"
        ru: "смотри: вот Гульельмо! как дети — отца,"
      - pl: "\nPłacze go naród, którego zła dola"
        ru: "оплакивает его народ, чья злая доля"
      - pl: "\nSkarży żyjących Frydryka, Karola;"
        ru: "обвиняет живых Федериго, Карла;"
      - pl: "\nJak sprawiedliwy król w niebie kochany,"
        ru: "каким любимым на небе справедливым королём он был,"
      - pl: "\nWidzisz po blasku, jakim jest odziany."
        ru: "видишь по блеску, которым он одет."
    words: { "łuku": luk, "Patrz": patrzec, "ojca": ojciec, "naród": narod, "sprawiedliwy": sprawiedliwy, "król": krol }
  - clean: "Któż by uwierzył tam na waszej ziemi,\nWśród tylu błędów, że zrodzony w Troi\nRyfeusz oto na łuku brwi mojej\nJest piątym między światłami świętymi\nLepiej on od was wie, co łaska boża,\nChociaż nie widzi jeszcze dna jej morza»."
    verse: true
    chunks:
      - pl: "Któż by uwierzył tam na waszej ziemi,"
        ru: "Кто бы поверил там, на вашей земле,"
      - pl: "\nWśród tylu błędów, że zrodzony w Troi"
        ru: "среди стольких заблуждений, что рождённый в Трое"
      - pl: "\nRyfeusz oto na łuku brwi mojej"
        ru: "Рифей вот на дуге моей брови"
      - pl: "\nJest piątym między światłami świętymi"
        ru: "есть пятый среди святых светил."
      - pl: "\nLepiej on od was wie, co łaska boża,"
        ru: "Он лучше вас знает, что такое Божья милость,"
      - pl: "\nChociaż nie widzi jeszcze dna jej morza»."
        ru: "хоть не видит ещё дна её моря»."
    words: { "uwierzył": uwierzyc, "waszej": wasz, "ziemi": ziemia, "boża": bozy, "widzi": widziec, "morza": morze }
  - clean: "Skowronek śpiewa pod obłoki wzbity,\nA potem nagle swój akord urywa,\nOstatniej nuty melodyją syty.\nTakim zdał mi się wizerunek godła\nPrzedwiecznej woli, co z siebie wywiodła\nCały świat rzeczy, gdzie w danym zakresie,\nPrzez nią rzecz każda tym, czym jest, staje się."
    verse: true
    chunks:
      - pl: "Skowronek śpiewa pod obłoki wzbity,"
        ru: "Жаворонок поёт, взмыв под облака,"
        note: "skowronek — жаворонок"
      - pl: "\nA potem nagle swój akord urywa,"
        ru: "а потом вдруг обрывает свой аккорд,"
      - pl: "\nOstatniej nuty melodyją syty."
        ru: "сытый мелодией последнего напева."
      - pl: "\nTakim zdał mi się wizerunek godła"
        ru: "Таким мне показался образ знака"
      - pl: "\nPrzedwiecznej woli, co z siebie wywiodła"
        ru: "предвечной воли, что вывела из себя"
      - pl: "\nCały świat rzeczy, gdzie w danym zakresie,"
        ru: "весь мир вещей, где в данном пределе"
      - pl: "\nPrzez nią rzecz każda tym, czym jest, staje się."
        ru: "через неё каждая вещь становится тем, что она есть."
    words: { "Ostatniej": ostatni, "zdał": zdac, "wizerunek": wizerunek, "świat": swiat, "rzeczy": rzecz, "zakresie": zakres }
  - clean: "Choć była widna moja myśl wątpliwa,\nJak przez szkło farba, którym się nakrywa,\nChciała milczenie przerwać niecierpliwa;\nZ ust mych: «Co widzę, to dla mnie rzecz nowa!»\nWłasnym ciężarem wypadły te słowa,\nBo ja widziałem iskrami zapału\nRozpromienioną radość nie po mału."
    verse: true
    chunks:
      - pl: "Choć była widna moja myśl wątpliwa,"
        ru: "Хотя моя сомневающаяся мысль была видна,"
      - pl: "\nJak przez szkło farba, którym się nakrywa,"
        ru: "как краска сквозь стекло, которым покрыта,"
      - pl: "\nChciała milczenie przerwać niecierpliwa;"
        ru: "она нетерпеливо хотела прервать молчание;"
      - pl: "\nZ ust mych: «Co widzę, to dla mnie rzecz nowa!»"
        ru: "из моих уст: «Что я вижу, для меня ново!» —"
      - pl: "\nWłasnym ciężarem wypadły te słowa,"
        ru: "выпали эти слова собственной тяжестью,"
      - pl: "\nBo ja widziałem iskrami zapału"
        ru: "ибо я видел, как радость немало"
      - pl: "\nRozpromienioną radość nie po mału."
        ru: "озарилась искрами пыла."
    words: { "szkło": szklo, "farba": farba, "przerwać": przerwac, "ciężarem": ciezar, "wypadły": wypasc, "radość": radosc }
  - clean: "Błysnąwszy żywiej ze źrenic oboich,\nOrzeł odpowiedź dał mi w okamgnieniu,\nSnadź nie chciał dłużej trzymać mnie w zdumieniu.\n«Wierzysz w te rzeczy na wiarę słów moich;\nJak ten, co umie rzecz zwać po imieniu,\nNie wie, co ona i dlaczego znaczy,\nJeśli kto drugi jej nie wytłumaczy."
    verse: true
    chunks:
      - pl: "Błysnąwszy żywiej ze źrenic oboich,"
        ru: "Блеснув живее обоими зрачками,"
