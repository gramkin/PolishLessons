chapter: 2
chapterTitle: "Od Pasterki do Trzech Króli"
chapterTitleRu: "От Пастерки до Богоявления"
level: B2
paragraphs:
  - clean: "O północy z Wigilii na Boże Narodzenie w kościołach odprawia się Pasterkę. Nazwa pochodzi od pasterzy, którzy według Ewangelii jako pierwsi przyszli pokłonić się nowo narodzonemu Jezusowi. To jedna z najbardziej uroczystych mszy w roku i kościoły są wtedy pełne, także ludzi, którzy na co dzień rzadko do nich zaglądają. Ludzie wychodzą z ciepłych domów, prosto od wigilijnego stołu, w mróz albo w śnieg, i idą przez ciemne miasteczko czy wieś na dźwięk dzwonów. W wielu kościołach na początku mszy wnosi się figurkę Dzieciątka i kładzie ją w szopce przy ołtarzu. Wierni śpiewają kolędy, a organista gra je głośniej i radośniej niż w ciągu całego roku."
    draft: true
    chunks:
      - pl: "O północy z Wigilii na Boże Narodzenie w kościołach odprawia się Pasterkę."
        ru: "В полночь с Сочельника на Рождество в костёлах служат Пастерку."
      - pl: " Nazwa pochodzi od pasterzy, którzy według Ewangelii jako pierwsi przyszli pokłonić się nowo narodzonemu Jezusowi."
        ru: "Название происходит от пастухов, которые, согласно Евангелию, первыми пришли поклониться новорождённому Иисусу."
        note: "pokłonić się — поклониться"
      - pl: " To jedna z najbardziej uroczystych mszy w roku i kościoły są wtedy pełne, także ludzi, którzy na co dzień rzadko do nich zaglądają."
        ru: "Это одна из самых торжественных месс в году, и костёлы тогда полны, в том числе людьми, которые в обычные дни редко туда заглядывают."
        note: "uroczysty — торжественный"
      - pl: " Ludzie wychodzą z ciepłych domów, prosto od wigilijnego stołu, w mróz albo w śnieg, i idą przez ciemne miasteczko czy wieś na dźwięk dzwonów."
        ru: "Люди выходят из тёплых домов, прямо от сочельникового стола, в мороз или в снег, и идут через тёмный городок или деревню на звон колоколов."
        note: "mróz — мороз"
      - pl: " W wielu kościołach na początku mszy wnosi się figurkę Dzieciątka i kładzie ją w szopce przy ołtarzu."
        ru: "Во многих костёлах в начале мессы вносят фигурку Младенца и кладут её в вертеп у алтаря."
        note: "szopka — вертеп"
      - pl: " Wierni śpiewają kolędy, a organista gra je głośniej i radośniej niż w ciągu całego roku."
        ru: "Верующие поют колядки, а органист играет их громче и радостнее, чем в течение всего года."
    words: { "północy": polnoc, "kościołach": kosciol, "pochodzi": pochodzic, "według": wedlug, "narodzonemu": narodzic, "najbardziej": najbardziej, "kościoły": kosciol, "także": takze, "rzadko": rzadko, "ciepłych": cieply, "stołu": stol, "mróz": mroz, "śnieg": snieg, "ciemne": ciemny, "miasteczko": miasteczko, "wieś": wies, "dźwięk": dzwiek, "dzwonów": dzwon, "początku": poczatek, "kładzie": klasc, "ołtarzu": oltarz, "śpiewają": spiewac, "głośniej": glosno, "ciągu": ciag }
  - clean: "Na Podhalu górale przychodzą na Pasterkę w strojach regionalnych, a po mszy grają przed kościołem kapele ludowe. W dawnych czasach po powrocie z Pasterki gospodarze wybiegali do sadu, żeby obwiązać drzewa owocowe słomianymi powrósłami, bo miało to zapewnić obfite plony. Wierzono też, że kto pierwszy po Pasterce dotrze do domu, ten pierwszy zbierze w tym roku zboże z pola. Dlatego młodzi gospodarze ścigali się saniami, a cała wieś przyglądała się tym wyścigom z wielkim zainteresowaniem."
    draft: true
    chunks:
      - pl: "Na Podhalu górale przychodzą na Pasterkę w strojach regionalnych, a po mszy grają przed kościołem kapele ludowe."
        ru: "На Подгалье горцы приходят на Пастерку в народных костюмах, а после мессы перед костёлом играют народные капеллы."
        note: "góral — горец"
      - pl: " W dawnych czasach po powrocie z Pasterki gospodarze wybiegali do sadu, żeby obwiązać drzewa owocowe słomianymi powrósłami, bo miało to zapewnić obfite plony."
        ru: "В старые времена, вернувшись с Пастерки, хозяева выбегали в сад, чтобы обвязать фруктовые деревья соломенными жгутами, потому что это должно было обеспечить обильный урожай."
        note: "powrósło — соломенный жгут"
      - pl: " Wierzono też, że kto pierwszy po Pasterce dotrze do domu, ten pierwszy zbierze w tym roku zboże z pola."
        ru: "Верили также, что тот, кто первым после Пастерки доберётся до дома, первым в этом году соберёт хлеб с поля."
      - pl: " Dlatego młodzi gospodarze ścigali się saniami, a cała wieś przyglądała się tym wyścigom z wielkim zainteresowaniem."
        ru: "Поэтому молодые хозяева гонялись на санях, а вся деревня с большим интересом наблюдала за этими гонками."
        note: "sanie — сани"
    words: { "przychodzą": przychodzic, "strojach": stroj, "kościołem": kosciol, "dawnych": dawny, "powrocie": powrot, "gospodarze": gospodarz, "drzewa": drzewo, "owocowe": owocowa, "zapewnić": zapewnic, "dotrze": dotrzec, "zbierze": zebrac, "zboże": zboze, "pola": pole, "ścigali": scigac, "przyglądała": przygladac, "wyścigom": wyscig }
  - clean: "Pierwszy dzień świąt, dwudziesty piąty grudnia, jest dniem spokojnym. Dawniej nie wypadało tego dnia odwiedzać sąsiadów, sprzątać, gotować ani nawet ścielić łóżek, i wiele rodzin zachowuje to do dziś, przynajmniej w części. Je się to, co zostało z Wigilii, a na stół wracają mięso i wędliny, ciasta i sałatka jarzynowa. To czas spacerów, rodzinnych rozmów, gier planszowych i drzemek po obiedzie."
    draft: true
    chunks:
      - pl: "Pierwszy dzień świąt, dwudziesty piąty grudnia, jest dniem spokojnym."
        ru: "Первый день праздника, двадцать пятое декабря, — день спокойный."
      - pl: " Dawniej nie wypadało tego dnia odwiedzać sąsiadów, sprzątać, gotować ani nawet ścielić łóżek, i wiele rodzin zachowuje to do dziś, przynajmniej w części."
        ru: "Раньше в этот день не полагалось ходить в гости к соседям, убирать, готовить и даже застилать постели, и многие семьи сохраняют это до сих пор, хотя бы отчасти."
        note: "ścielić łóżko — застилать постель"
      - pl: " Je się to, co zostało z Wigilii, a na stół wracają mięso i wędliny, ciasta i sałatka jarzynowa."
        ru: "Едят то, что осталось с Сочельника, а на стол возвращаются мясо и колбасы, пироги и овощной салат."
        note: "sałatka jarzynowa — овощной салат (вроде оливье)"
      - pl: " To czas spacerów, rodzinnych rozmów, gier planszowych i drzemek po obiedzie."
        ru: "Это время прогулок, семейных разговоров, настольных игр и дремоты после обеда."
        note: "drzemka — дремота"
    words: { "świąt": swieto, "piąty": piaty, "grudnia": grudzien, "spokojnym": spokojny, "wypadało": wypadac, "odwiedzać": odwiedzac, "sąsiadów": sasiad, "sprzątać": sprzatac, "gotować": gotowac, "łóżek": lozko, "zachowuje": zachowywac, "przynajmniej": przynajmniej, "stół": stol, "mięso": mieso, "wędliny": wedlina, "ciasta": ciasto, "sałatka": salatka, "spacerów": spacer, "rodzinnych": rodzinny, "rozmów": rozmowa, "drzemek": drzemka, "obiedzie": obiad }
  - clean: "Drugi dzień świąt, dwudziesty szósty grudnia, to dzień świętego Szczepana, pierwszego chrześcijańskiego męczennika. Tego dnia odwiedza się rodzinę i znajomych, a święta stają się głośniejsze i bardziej towarzyskie. W wielu parafiach zachował się zwyczaj święcenia owsa, którym wierni obsypują potem księdza, a młodzi chłopcy także dziewczęta. Obsypywanie miało przypominać ukamienowanie świętego Szczepana, ale także wróżyć urodzaj, a dla dziewcząt rychłe zamążpójście. W dawnych dworach i majątkach drugi dzień świąt był dniem, w którym parobkowie i służba mogli zmienić pracę i przejść do innego gospodarza."
    draft: true
    chunks:
      - pl: "Drugi dzień świąt, dwudziesty szósty grudnia, to dzień świętego Szczepana, pierwszego chrześcijańskiego męczennika."
        ru: "Второй день праздника, двадцать шестое декабря, — день святого Стефана, первого христианского мученика."
        note: "męczennik — мученик"
      - pl: " Tego dnia odwiedza się rodzinę i znajomych, a święta stają się głośniejsze i bardziej towarzyskie."
        ru: "В этот день навещают родню и знакомых, и праздник становится шумнее и общительнее."
      - pl: " W wielu parafiach zachował się zwyczaj święcenia owsa, którym wierni obsypują potem księdza, a młodzi chłopcy także dziewczęta."
        ru: "Во многих приходах сохранился обычай освящения овса, которым верующие потом осыпают ксёндза, а молодые парни — ещё и девушек."
        note: "owies — овёс; obsypywać — осыпать"
      - pl: " Obsypywanie miało przypominać ukamienowanie świętego Szczepana, ale także wróżyć urodzaj, a dla dziewcząt rychłe zamążpójście."
        ru: "Осыпание должно было напоминать о побиении камнями святого Стефана, но и предвещать урожай, а девушкам — скорое замужество."
        note: "ukamienowanie — побиение камнями; zamążpójście — замужество"
      - pl: " W dawnych dworach i majątkach drugi dzień świąt był dniem, w którym parobkowie i służba mogli zmienić pracę i przejść do innego gospodarza."
        ru: "В старых усадьбах и поместьях второй день праздника был днём, когда батраки и прислуга могли сменить работу и перейти к другому хозяину."
        note: "parobek — батрак"
    words: { "szósty": szosty, "świętego": swiety, "odwiedza": odwiedzac, "znajomych": znajomy, "stają": stawac, "głośniejsze": glosny, "towarzyskie": towarzyski, "zachował": zachowac, "zwyczaj": zwyczaj, "wierni": wierny, "księdza": ksiadz, "dziewczęta": dziewcze, "przypominać": przypominac, "dziewcząt": dziewcze, "dworach": dwor, "majątkach": majatek, "służba": sluzba, "gospodarza": gospodarz }
  - clean: "Okres od Bożego Narodzenia do początku lutego to w Polsce czas kolęd. Kolęda to pieśń o narodzeniu Jezusa, a słowo pochodzi od łacińskich kalend, czyli pierwszych dni miesiąca, kiedy w starożytnym Rzymie obchodzono początek nowego roku. Polacy mają ich wyjątkowo dużo, setki, z różnych wieków i regionów, a wiele z nich znają na pamięć nawet ludzie, którzy nie chodzą do kościoła. Śpiewa się je w domach, w kościołach, w szkołach i na koncertach, a w ostatnich latach także na ulicach i w centrach handlowych."
    draft: true
    chunks:
      - pl: "Okres od Bożego Narodzenia do początku lutego to w Polsce czas kolęd."
        ru: "Период от Рождества до начала февраля в Польше — время колядок."
      - pl: " Kolęda to pieśń o narodzeniu Jezusa, a słowo pochodzi od łacińskich kalend, czyli pierwszych dni miesiąca, kiedy w starożytnym Rzymie obchodzono początek nowego roku."
        ru: "Колядка — это песня о рождении Иисуса, а слово происходит от латинских календ, то есть первых дней месяца, когда в Древнем Риме отмечали начало нового года."
        note: "kalendy — календы"
      - pl: " Polacy mają ich wyjątkowo dużo, setki, z różnych wieków i regionów, a wiele z nich znają na pamięć nawet ludzie, którzy nie chodzą do kościoła."
        ru: "У поляков их исключительно много, сотни, из разных веков и регионов, и многие из них знают наизусть даже люди, которые не ходят в костёл."
      - pl: " Śpiewa się je w domach, w kościołach, w szkołach i na koncertach, a w ostatnich latach także na ulicach i w centrach handlowych."
        ru: "Их поют дома, в костёлах, в школах и на концертах, а в последние годы и на улицах, и в торговых центрах."
    words: { "lutego": luty, "pieśń": piesn, "czyli": czyli, "starożytnym": starozytny, "obchodzono": obchodzic, "początek": poczatek, "różnych": rozny, "wieków": wiek, "pamięć": pamiec, "kościoła": kosciol, "koncertach": koncert, "ulicach": ulica, "centrach": centrum, "handlowych": handlowy }
  - clean: "Najbardziej znaną polską kolędą jest „Bóg się rodzi”, napisana pod koniec osiemnastego wieku przez poetę Franciszka Karpińskiego. Jej pierwsze słowa brzmią: „Bóg się rodzi, moc truchleje, Pan niebiosów obnażony”. Cała pieśń zbudowana jest z paradoksów: ogień krzepnie, blask ciemnieje, a nieskończony ma granice. Dzięki uroczystej, marszowej melodii bywała nazywana drugim hymnem narodowym, a w ostatniej zwrotce śpiewa się prośbę o błogosławieństwo dla ojczyzny."
    draft: true
    chunks:
      - pl: "Najbardziej znaną polską kolędą jest „Bóg się rodzi”, napisana pod koniec osiemnastego wieku przez poetę Franciszka Karpińskiego."
        ru: "Самая известная польская колядка — «Бог рождается», написанная в конце восемнадцатого века поэтом Францишеком Карпиньским."
      - pl: " Jej pierwsze słowa brzmią: „Bóg się rodzi, moc truchleje, Pan niebiosów obnażony”."
        ru: "Её первые слова звучат так: «Бог рождается, сила трепещет, Владыка небес обнажён»."
        note: "truchleć — трепетать от страха"
      - pl: " Cała pieśń zbudowana jest z paradoksów: ogień krzepnie, blask ciemnieje, a nieskończony ma granice."
        ru: "Вся песня построена на парадоксах: огонь застывает, сияние темнеет, а бесконечный обретает границы."
        note: "krzepnąć — застывать"
      - pl: " Dzięki uroczystej, marszowej melodii bywała nazywana drugim hymnem narodowym, a w ostatniej zwrotce śpiewa się prośbę o błogosławieństwo dla ojczyzny."
        ru: "Благодаря торжественной, маршевой мелодии её называли вторым национальным гимном, а в последнем куплете поётся просьба о благословении для родины."
        note: "zwrotka — куплет, строфа"
    words: { "napisana": napisac, "wieku": wiek, "poetę": poeta, "brzmią": brzmiec, "niebiosów": niebiosa, "zbudowana": zbudowac, "ogień": ogien, "blask": blask, "granice": granica, "melodii": melodia, "bywała": bywac, "narodowym": narodowy, "śpiewa": spiewac, "prośbę": prosba, "błogosławieństwo": blogoslawienstwo, "ojczyzny": ojczyzna }
  - clean: "Zupełnie inny charakter ma „Lulajże, Jezuniu”, czuła kołysanka, którą matka śpiewa dziecku. Fryderyk Chopin wplótł jej melodię w środkową część swojego Scherza h-moll, które zaczął pisać w Wiedniu, kiedy był daleko od domu i rodziny. Popularne są także „Wśród nocnej ciszy”, „Przybieżeli do Betlejem”, „Dzisiaj w Betlejem” i „Gdy się Chrystus rodzi”, które dzieci uczą się w przedszkolu. Obok kolęd istnieją pastorałki, piosenki o pasterzach, prostsze i weselsze, często żartobliwe, pełne ludowych słów i scenek z życia wsi. Pasterze przynoszą w nich Dzieciątku ser, masło, jabłka i baranka, kłócą się, kto zagra mu najładniej na fujarce, i budzą się przestraszeni, kiedy anioł zaczyna śpiewać. Kolędy śpiewa się zwyczajowo aż do drugiego lutego, ale dziś wiele osób słyszy pierwsze z nich w sklepach już w listopadzie, na co narzekają zarówno księża, jak i muzycy."
    draft: true
    chunks:
      - pl: "Zupełnie inny charakter ma „Lulajże, Jezuniu”, czuła kołysanka, którą matka śpiewa dziecku."
        ru: "Совсем другой характер у «Люляй же, Иисусик», нежной колыбельной, которую мать поёт ребёнку."
        note: "kołysanka — колыбельная"
      - pl: " Fryderyk Chopin wplótł jej melodię w środkową część swojego Scherza h-moll, które zaczął pisać w Wiedniu, kiedy był daleko od domu i rodziny."
        ru: "Фредерик Шопен вплёл её мелодию в среднюю часть своего скерцо си минор, которое он начал писать в Вене, когда он был далеко от дома и семьи."
        note: "wpleść — вплести"
      - pl: " Popularne są także „Wśród nocnej ciszy”, „Przybieżeli do Betlejem”, „Dzisiaj w Betlejem” i „Gdy się Chrystus rodzi”, które dzieci uczą się w przedszkolu."
        ru: "Популярны также «Среди ночной тишины», «Прибежали в Вифлеем», «Сегодня в Вифлееме» и «Когда Христос рождается», которые дети учат в детском саду."
      - pl: " Obok kolęd istnieją pastorałki, piosenki o pasterzach, prostsze i weselsze, często żartobliwe, pełne ludowych słów i scenek z życia wsi."
        ru: "Помимо колядок, существуют пасторалки, песенки о пастухах, более простые и весёлые, часто шуточные, полные народных слов и сценок из деревенской жизни."
        note: "żartobliwy — шуточный"
      - pl: " Pasterze przynoszą w nich Dzieciątku ser, masło, jabłka i baranka, kłócą się, kto zagra mu najładniej na fujarce, i budzą się przestraszeni, kiedy anioł zaczyna śpiewać."
        ru: "Пастухи приносят в них Младенцу сыр, масло, яблоки и ягнёнка, спорят, кто сыграет ему красивее всех на дудочке, и просыпаются испуганные, когда ангел начинает петь."
        note: "fujarka — дудочка"
      - pl: " Kolędy śpiewa się zwyczajowo aż do drugiego lutego, ale dziś wiele osób słyszy pierwsze z nich w sklepach już w listopadzie, na co narzekają zarówno księża, jak i muzycy."
