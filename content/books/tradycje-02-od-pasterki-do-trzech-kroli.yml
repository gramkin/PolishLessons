  - clean: "Wyjątkowa jest szopka krakowska. Nie przypomina ona wiejskiej stajenki, lecz kolorowy, błyszczący pałac, w którym łatwo rozpoznać wieże kościoła Mariackiego, Wawel i inne krakowskie zabytki. Budują ją z tektury, drewna i kolorowej folii rodziny szopkarzy, często od kilku pokoleń, a prace nad jedną szopką trwają nieraz cały rok. Od 1937 roku w pierwszy czwartek grudnia szopkarze przynoszą swoje dzieła na Rynek Główny, pod pomnik Adama Mickiewicza, gdzie rozpoczyna się konkurs na najpiękniejszą szopkę. Najlepsze trafiają potem do Muzeum Krakowa, a w 2018 roku krakowskie szopkarstwo wpisano na listę niematerialnego dziedzictwa kulturowego UNESCO. Dawniej w szopkach krakowskich grano też przedstawienia kukiełkowe, w których obok Świętej Rodziny występowali Krakowiacy, Żydzi, żołnierze i diabły, a na początku dwudziestego wieku artyści kabaretu Zielony Balonik robili szopki polityczne, kpiące z ówczesnych polityków. Od nich pochodzi zwyczaj nazywania szopką każdego satyrycznego przedstawienia o władzy, a także każdej sytuacji, która wydaje się absurdalna."
