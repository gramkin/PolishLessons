  - clean: "Okres bożonarodzeniowy kończy się w tradycji ludowej dopiero drugiego lutego, w święto Ofiarowania Pańskiego, nazywane Matki Bożej Gromnicznej. Tego dnia w kościołach święci się gromnice, czyli grube woskowe świece. Nazwa pochodzi od gromu, bo zapaloną gromnicę stawiano w oknie w czasie burzy, żeby piorun nie uderzył w dom. Według legendy Matka Boża chodziła z gromnicą po polach i odpędzała od wsi wilki, które w lutym, głodne po zimie, podchodziły pod same chaty. Gromnicę wkładano też do rąk umierającym, żeby światło towarzyszyło im w ostatniej drodze, i w wielu domach przechowuje się ją do dziś w szafie, na wszelki wypadek. Po tym dniu w wielu domach rozbiera się w końcu choinkę, która od dawna gubi igły, a karnawał, który zaczął się już w Trzech Króli, trwa w najlepsze."
