  - clean: "Gdy cisza wieczoru spłynęła na świat, a my szliśmy grzbietem wzgórza w stronę Wimbledonu, Weena się zmęczyła i chciała wrócić do domu z szarego kamienia. Ale wskazałem jej odległe iglice Pałacu z Zielonej Porcelany i zdołałem jej wytłumaczyć, że szukamy tam schronienia przed jej Strachem. Znacie tę wielką ciszę, która ogarnia wszystko przed zmierzchem? Nawet wietrzyk zamiera w drzewach. Dla mnie w tej wieczornej ciszy zawsze jest coś z oczekiwania. Niebo było czyste, dalekie i puste, poza kilkoma poziomymi pasmami nisko na zachodzie."
