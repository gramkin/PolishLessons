        note: "rozkwit — расцвет; groza — ужас"
      - pl: " Ja przynajmniej będę się bronił."
        ru: "Я-то по крайней мере буду защищаться."
      - pl: " Bez dalszej zwłoki postanowiłem zrobić sobie broń i twierdzę, w której mógłbym spać."
        ru: "Без дальнейшего промедления я решил сделать себе оружие и укрепление, где мог бы спать."
        note: "twierdza — крепость"
      - pl: " Mając to schronienie za podstawę, mógłbym stawić czoła temu dziwnemu światu z pewną częścią tej pewności siebie, którą straciłem,"
        ru: "Имея это убежище опорой, я мог бы встретить этот странный мир с долей той уверенности, которую утратил,"
      - pl: " gdy uświadomiłem sobie, na jakie stworzenia byłem noc w noc wystawiony."
        ru: "когда осознал, каким тварям я каждую ночь был открыт."
        note: "noc w noc — каждую ночь"
      - pl: " Czułem, że nigdy już nie zasnę, dopóki moje posłanie nie będzie przed nimi zabezpieczone."
        ru: "Я чувствовал, что больше не смогу уснуть, пока моё ложе не будет от них защищено."
        note: "posłanie — постель, ложе"
      - pl: " Drżałem z przerażenia na myśl, jak musiały mnie już oglądać."
        ru: "Я содрогался от ужаса при мысли о том, как они, должно быть, уже меня осматривали."
