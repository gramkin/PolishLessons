  - clean: "Po południu wędrowałem doliną Tamizy, ale nie znalazłem niczego, co wydawałoby mi się niedostępne. Wszystkie budowle i drzewa wydawały się łatwe do zdobycia dla takich zręcznych wspinaczy, jakimi Morlokowie, sądząc po ich studniach, musieli być. Wtedy przypomniały mi się wysokie iglice Pałacu z Zielonej Porcelany i polerowany połysk jego ścian; i wieczorem, biorąc Weenę jak dziecko na ramię, ruszyłem na wzgórza w stronę południowego zachodu. Odległość, jak obliczyłem, wynosiła siedem czy osiem mil, ale musiała być bliższa osiemnastu."
    en: "“I wandered during the afternoon along the valley of the Thames, but found nothing that commended itself to my mind as inaccessible. All the buildings and trees seemed easily practicable to such dexterous climbers as the Morlocks, to judge by their wells, must be. Then the tall pinnacles of the Palace of Green Porcelain and the polished gleam of its walls came back to my memory; and in the evening, taking Weena like a child upon my shoulder, I went up the hills towards the south-west. The distance, I had reckoned, was seven or eight miles, but it must have been nearer eighteen."
    draft: true
    chunks:
      - pl: "Po południu wędrowałem doliną Tamizy, ale nie znalazłem niczego, co wydawałoby mi się niedostępne."
        ru: "Днём я бродил по долине Темзы, но не нашёл ничего, что показалось бы мне неприступным."
      - pl: " Wszystkie budowle i drzewa wydawały się łatwe do zdobycia dla takich zręcznych wspinaczy, jakimi Morlokowie, sądząc po ich studniach, musieli być."
        ru: "Все здания и деревья казались легкодоступными для таких ловких верхолазов, какими, судя по их колодцам, должны были быть морлоки."
        note: "wspinacz — верхолаз, скалолаз"
