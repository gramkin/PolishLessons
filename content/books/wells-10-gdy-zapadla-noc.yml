chapter: 10
chapterTitle: "Gdy zapadła noc"
chapterTitleRu: "Когда наступила ночь"
level: B2
paragraphs:
  - clean: "Teraz doprawdy wydawało się, że jestem w gorszym położeniu niż przedtem. Dotąd, z wyjątkiem nocnej udręki po stracie Wehikułu Czasu, podtrzymywała mnie nadzieja, że w końcu się wydostanę, ale te nowe odkrycia zachwiały tą nadzieją. Dotąd sądziłem, że przeszkadza mi jedynie dziecinna prostota małych ludzi i jakieś nieznane siły, które wystarczyło zrozumieć, by je pokonać; ale w odrażającej naturze Morloków był zupełnie nowy pierwiastek — coś nieludzkiego i złowrogiego."
    en: "“Now, indeed, I seemed in a worse case than before. Hitherto, except during my night’s anguish at the loss of the Time Machine, I had felt a sustaining hope of ultimate escape, but that hope was staggered by these new discoveries. Hitherto I had merely thought myself impeded by the childish simplicity of the little people, and by some unknown forces which I had only to understand to overcome; but there was an altogether new element in the sickening quality of the Morlocks—a something inhuman and malign."
    draft: true
    chunks:
      - pl: "Teraz doprawdy wydawało się, że jestem w gorszym położeniu niż przedtem."
        ru: "Теперь моё положение и впрямь казалось хуже прежнего."
      - pl: " Dotąd, z wyjątkiem nocnej udręki po stracie Wehikułu Czasu, podtrzymywała mnie nadzieja, że w końcu się wydostanę,"
        ru: "До сих пор, если не считать ночных мук после потери Машины Времени, меня поддерживала надежда, что в конце концов я выберусь,"
      - pl: " ale te nowe odkrycia zachwiały tą nadzieją."
        ru: "но эти новые открытия поколебали эту надежду."
        note: "zachwiać — поколебать"
      - pl: " Dotąd sądziłem, że przeszkadza mi jedynie dziecinna prostota małych ludzi i jakieś nieznane siły, które wystarczyło zrozumieć, by je pokonać;"
        ru: "До сих пор я думал, что мне мешает лишь детская простота маленьких людей и какие-то неведомые силы, которые достаточно понять, чтобы их одолеть;"
      - pl: " ale w odrażającej naturze Morloków był zupełnie nowy pierwiastek — coś nieludzkiego i złowrogiego."
        ru: "но в омерзительной природе морлоков был совершенно новый элемент — нечто бесчеловечное и злобное."
        note: "pierwiastek — элемент, начало; złowrogi — зловещий"
    words: { "przedtem": przedtem, "Dotąd": dotad, "nocnej": nocny, "odrażającej": odrazajacy, "pierwiastek": pierwiastek, "złowrogiego": zlowrogi }
  - clean: "Instynktownie ich nienawidziłem. Przedtem czułem się jak człowiek, który wpadł do dołu: martwiłem się dołem i tym, jak się z niego wydostać. Teraz czułem się jak zwierzę w pułapce, na które wkrótce rzuci się wróg."
    en: "Instinctively I loathed them. Before, I had felt as a man might feel who had fallen into a pit: my concern was with the pit and how to get out of it. Now I felt like a beast in a trap, whose enemy would come upon him soon."
    draft: true
    chunks:
      - pl: "Instynktownie ich nienawidziłem."
        ru: "Я инстинктивно ненавидел их."
      - pl: " Przedtem czułem się jak człowiek, który wpadł do dołu: martwiłem się dołem i tym, jak się z niego wydostać."
        ru: "Раньше я чувствовал себя как человек, упавший в яму: меня занимала яма и то, как из неё выбраться."
        note: "dół — яма"
      - pl: " Teraz czułem się jak zwierzę w pułapce, na które wkrótce rzuci się wróg."
        ru: "Теперь я чувствовал себя как зверь в капкане, на которого скоро набросится враг."
    words: { "Przedtem": przedtem, "wydostać": wydostac, "zwierzę": zwierze, "pułapce": pulapka, "wkrótce": wkrotce, "wróg": wrog }
  - clean: "Wróg, którego się bałem, może was zaskoczyć. Była nim ciemność nowiu. Weena nasunęła mi tę myśl kilkoma z początku niezrozumiałymi uwagami o Ciemnych Nocach. Teraz nietrudno już było odgadnąć, co mogą oznaczać nadchodzące Ciemne Noce. Księżyc ubywał: z każdą nocą okres ciemności był dłuższy. I teraz przynajmniej w małym stopniu rozumiałem, skąd u małych ludzi z Górnego Świata strach przed ciemnością. Zastanawiałem się mgliście, jaką plugawą niegodziwość Morlokowie popełniają podczas nowiu."
    en: "“The enemy I dreaded may surprise you. It was the darkness of the new moon. Weena had put this into my head by some at first incomprehensible remarks about the Dark Nights. It was not now such a very difficult problem to guess what the coming Dark Nights might mean. The moon was on the wane: each night there was a longer interval of darkness. And I now understood to some slight degree at least the reason of the fear of the little Upperworld people for the dark. I wondered vaguely what foul villainy it might be that the Morlocks did under the new moon."
    draft: true
    chunks:
      - pl: "Wróg, którego się bałem, może was zaskoczyć."
        ru: "Враг, которого я боялся, может вас удивить."
      - pl: " Była nim ciemność nowiu."
        ru: "Это была темнота новолуния."
      - pl: " Weena nasunęła mi tę myśl kilkoma z początku niezrozumiałymi uwagami o Ciemnych Nocach."
        ru: "Уина навела меня на эту мысль несколькими поначалу непонятными замечаниями о Тёмных Ночах."
      - pl: " Teraz nietrudno już było odgadnąć, co mogą oznaczać nadchodzące Ciemne Noce."
        ru: "Теперь уже нетрудно было угадать, что могут означать наступающие Тёмные Ночи."
      - pl: " Księżyc ubywał: z każdą nocą okres ciemności był dłuższy."
        ru: "Луна убывала: с каждой ночью промежуток темноты становился длиннее."
        note: "ubywać — убывать"
      - pl: " I teraz przynajmniej w małym stopniu rozumiałem, skąd u małych ludzi z Górnego Świata strach przed ciemnością."
        ru: "И теперь я хоть в малой степени понимал, откуда у маленьких людей Верхнего Мира страх перед темнотой."
      - pl: " Zastanawiałem się mgliście, jaką plugawą niegodziwość Morlokowie popełniają podczas nowiu."
        ru: "Я смутно гадал, какое гнусное злодейство совершают морлоки в новолуние."
        note: "niegodziwość — злодейство, подлость"
    words: { "ciemność": ciemnosc, "Ciemnych": ciemny, "Księżyc": ksiezyc, "okres": okres, "Górnego": gorny, "popełniają": popelniac }
  - clean: "Byłem teraz dość pewien, że moja druga hipoteza była zupełnie błędna. Ludzie z Górnego Świata mogli niegdyś być uprzywilejowaną arystokracją, a Morlokowie ich mechanicznymi sługami; ale to dawno minęło. Dwa gatunki, które powstały z ewolucji człowieka, zsuwały się ku zupełnie nowemu stosunkowi albo już do niego doszły. Elojowie, jak królowie z dynastii Karolingów, zwyrodnieli w piękną bezużyteczność. Wciąż posiadali ziemię, ale tylko z łaski, bo Morlokowie, od niezliczonych pokoleń podziemni, doszli w końcu do tego, że nie znosili oświetlonej słońcem powierzchni. A Morlokowie, jak wywnioskowałem, szyli im szaty i zaspokajali ich codzienne potrzeby, może dzięki przetrwaniu dawnego nawyku służby."
    en: "I felt pretty sure now that my second hypothesis was all wrong. The Upperworld people might once have been the favoured aristocracy, and the Morlocks their mechanical servants: but that had long since passed away. The two species that had resulted from the evolution of man were sliding down towards, or had already arrived at, an altogether new relationship. The Eloi, like the Carlovignan kings, had decayed to a mere beautiful futility. They still possessed the earth on sufferance: since the Morlocks, subterranean for innumerable generations, had come at last to find the daylit surface intolerable. And the Morlocks made their garments, I inferred, and maintained them in their habitual needs, perhaps through the survival of an old habit of service."
    draft: true
    chunks:
      - pl: "Byłem teraz dość pewien, że moja druga hipoteza była zupełnie błędna."
        ru: "Теперь я был почти уверен, что моя вторая гипотеза совершенно ошибочна."
      - pl: " Ludzie z Górnego Świata mogli niegdyś być uprzywilejowaną arystokracją, a Morlokowie ich mechanicznymi sługami; ale to dawno minęło."
        ru: "Жители Верхнего Мира когда-то могли быть привилегированной аристократией, а морлоки — их механическими слугами; но это давно прошло."
        note: "uprzywilejowany — привилегированный"
      - pl: " Dwa gatunki, które powstały z ewolucji człowieka, zsuwały się ku zupełnie nowemu stosunkowi albo już do niego doszły."
        ru: "Два вида, возникшие в ходе эволюции человека, сползали к совершенно новым отношениям или уже пришли к ним."
        note: "stosunek — отношение"
      - pl: " Elojowie, jak królowie z dynastii Karolingów, zwyrodnieli w piękną bezużyteczność."
        ru: "Элои, как короли из династии Каролингов, выродились в красивую никчёмность."
        note: "zwyrodnieć — выродиться; bezużyteczność — бесполезность"
      - pl: " Wciąż posiadali ziemię, ale tylko z łaski,"
        ru: "Они всё ещё владели землёй, но лишь из милости,"
        note: "z łaski — из милости"
      - pl: " bo Morlokowie, od niezliczonych pokoleń podziemni, doszli w końcu do tego, że nie znosili oświetlonej słońcem powierzchni."
        ru: "потому что морлоки, бесчисленные поколения жившие под землёй, дошли наконец до того, что не выносили освещённой солнцем поверхности."
      - pl: " A Morlokowie, jak wywnioskowałem, szyli im szaty i zaspokajali ich codzienne potrzeby, może dzięki przetrwaniu dawnego nawyku służby."
        ru: "А морлоки, как я заключил, шили им одежду и удовлетворяли их повседневные нужды, быть может, по пережившей века старой привычке служить."
        note: "nawyk — привычка"
    words: { "Górnego": gorny, "uprzywilejowaną": uprzywilejowany, "ewolucji": ewolucja, "podziemni": podziemny, "codzienne": codzienny, "nawyku": nawyk }
  - clean: "Robili to tak, jak stojący koń grzebie kopytem albo jak człowiek lubi zabijać zwierzęta dla sportu: bo dawne, minione konieczności odcisnęły to na organizmie. Ale najwyraźniej dawny porządek był już po części odwrócony. Nemezis delikatnych zbliżała się szybkim krokiem. Przed wiekami, przed tysiącami pokoleń, człowiek wypchnął swego brata człowieka z wygody i słońca. A teraz ten brat wracał — odmieniony! Elojowie zaczęli już na nowo uczyć się pewnej dawnej lekcji. Na nowo poznawali Strach. I nagle przyszło mi na myśl mięso, które widziałem w Podziemnym Świecie."
    en: "They did it as a standing horse paws with his foot, or as a man enjoys killing animals in sport: because ancient and departed necessities had impressed it on the organism. But, clearly, the old order was already in part reversed. The Nemesis of the delicate ones was creeping on apace. Ages ago, thousands of generations ago, man had thrust his brother man out of the ease and the sunshine. And now that brother was coming back—changed! Already the Eloi had begun to learn one old lesson anew. They were becoming reacquainted with Fear. And suddenly there came into my head the memory of the meat I had seen in the Underworld."
    draft: true
    chunks:
      - pl: "Robili to tak, jak stojący koń grzebie kopytem albo jak człowiek lubi zabijać zwierzęta dla sportu:"
        ru: "Они делали это так, как стоящая лошадь бьёт копытом или как человек любит убивать животных ради забавы:"
        note: "grzebać kopytem — бить копытом"
      - pl: " bo dawne, minione konieczności odcisnęły to na organizmie."
        ru: "потому что давние, ушедшие в прошлое необходимости запечатлели это в организме."
        note: "odcisnąć — отпечатать"
      - pl: " Ale najwyraźniej dawny porządek był już po części odwrócony."
        ru: "Но, очевидно, старый порядок был уже отчасти перевёрнут."
      - pl: " Nemezis delikatnych zbliżała się szybkim krokiem."
        ru: "Немезида изнеженных быстро приближалась."
        note: "Nemezis — Немезида, богиня возмездия"
      - pl: " Przed wiekami, przed tysiącami pokoleń, człowiek wypchnął swego brata człowieka z wygody i słońca."
        ru: "Века назад, тысячи поколений назад, человек вытолкнул своего брата-человека из довольства и солнечного света."
      - pl: " A teraz ten brat wracał — odmieniony!"
        ru: "А теперь этот брат возвращался — изменившимся!"
      - pl: " Elojowie zaczęli już na nowo uczyć się pewnej dawnej lekcji."
        ru: "Элои уже начали заново усваивать один старый урок."
      - pl: " Na nowo poznawali Strach."
        ru: "Они снова знакомились со Страхом."
      - pl: " I nagle przyszło mi na myśl mięso, które widziałem w Podziemnym Świecie."
        ru: "И вдруг мне вспомнилось мясо, которое я видел в Подземном Мире."
    words: { "sportu": sport, "konieczności": koniecznosc, "organizmie": organizm, "delikatnych": delikatny, "pokoleń": pokolenie, "Podziemnym": podziemny }
  - clean: "Dziwne, jak to wypłynęło w moim umyśle: nie wywołane, by tak rzec, nurtem moich rozmyślań, lecz przychodzące niemal jak pytanie z zewnątrz. Próbowałem przypomnieć sobie jego kształt. Miałem niejasne poczucie czegoś znajomego, ale wtedy nie umiałem powiedzieć, co to było."
    en: "It seemed odd how it floated into my mind: not stirred up as it were by the current of my meditations, but coming in almost like a question from outside. I tried to recall the form of it. I had a vague sense of something familiar, but I could not tell what it was at the time."
    draft: true
    chunks:
      - pl: "Dziwne, jak to wypłynęło w moim umyśle: nie wywołane, by tak rzec, nurtem moich rozmyślań, lecz przychodzące niemal jak pytanie z zewnątrz."
        ru: "Странно, как оно всплыло у меня в уме: не вызванное, так сказать, течением моих размышлений, а пришедшее почти как вопрос извне."
        note: "wypłynąć — всплыть"
      - pl: " Próbowałem przypomnieć sobie jego kształt."
        ru: "Я пытался вспомнить его форму."
      - pl: " Miałem niejasne poczucie czegoś znajomego, ale wtedy nie umiałem powiedzieć, co to było."
        ru: "У меня было смутное чувство чего-то знакомого, но тогда я не мог сказать, что это было."
    words: { "wypłynęło": wyplynac, "umyśle": umysl, "wywołane": wywolac, "rzec": rzec, "przypomnieć": przypomniec, "kształt": ksztalt }
  - clean: "Jednak, choć mali ludzie byli bezradni wobec swego tajemniczego Strachu, ja byłem inaczej zbudowany. Przybyłem z naszej epoki, z tego dojrzałego rozkwitu rasy ludzkiej, gdy Strach nie paraliżuje, a tajemnica straciła swoją grozę. Ja przynajmniej będę się bronił. Bez dalszej zwłoki postanowiłem zrobić sobie broń i twierdzę, w której mógłbym spać. Mając to schronienie za podstawę, mógłbym stawić czoła temu dziwnemu światu z pewną częścią tej pewności siebie, którą straciłem, gdy uświadomiłem sobie, na jakie stworzenia byłem noc w noc wystawiony. Czułem, że nigdy już nie zasnę, dopóki moje posłanie nie będzie przed nimi zabezpieczone. Drżałem z przerażenia na myśl, jak musiały mnie już oglądać."
    en: "“Still, however helpless the little people in the presence of their mysterious Fear, I was differently constituted. I came out of this age of ours, this ripe prime of the human race, when Fear does not paralyse and mystery has lost its terrors. I at least would defend myself. Without further delay I determined to make myself arms and a fastness where I might sleep. With that refuge as a base, I could face this strange world with some of that confidence I had lost in realising to what creatures night by night I lay exposed. I felt I could never sleep again until my bed was secure from them. I shuddered with horror to think how they must already have examined me."
    draft: true
    chunks:
      - pl: "Jednak, choć mali ludzie byli bezradni wobec swego tajemniczego Strachu, ja byłem inaczej zbudowany."
        ru: "Однако, как бы ни были беспомощны маленькие люди перед своим таинственным Страхом, я был устроен иначе."
      - pl: " Przybyłem z naszej epoki, z tego dojrzałego rozkwitu rasy ludzkiej, gdy Strach nie paraliżuje, a tajemnica straciła swoją grozę."
