  - clean: "Najwyraźniej kiedyś, w Dawnych Czasach ludzkiego upadku, zabrakło Morlokom pożywienia. Może żywili się szczurami i podobnym robactwem. Nawet dziś człowiek jest o wiele mniej wybredny i wyłączny w jedzeniu niż kiedyś — o wiele mniej niż jakakolwiek małpa. Jego uprzedzenie do ludzkiego mięsa nie jest żadnym głęboko zakorzenionym instynktem. A więc ci nieludzcy synowie ludzi…! Próbowałem spojrzeć na to w duchu naukowym. W końcu byli mniej ludzcy i bardziej odlegli niż nasi przodkowie kanibale sprzed trzech czy czterech tysięcy lat."
    en: "Clearly, at some time in the Long-Ago of human decay the Morlocks’ food had run short. Possibly they had lived on rats and such-like vermin. Even now man is far less discriminating and exclusive in his food than he was—far less than any monkey. His prejudice against human flesh is no deep-seated instinct. And so these inhuman sons of men——! I tried to look at the thing in a scientific spirit. After all, they were less human and more remote than our cannibal ancestors of three or four thousand years ago."
