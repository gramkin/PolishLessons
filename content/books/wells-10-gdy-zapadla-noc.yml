  - clean: "Patrzenie na te gwiazdy nagle pomniejszyło moje własne kłopoty i całą powagę ziemskiego życia. Myślałem o ich niezgłębionej odległości i o powolnym, nieuniknionym dryfie ich ruchów z nieznanej przeszłości w nieznaną przyszłość. Myślałem o wielkim cyklu precesji, który zakreśla biegun Ziemi. Tylko czterdzieści razy dokonał się ten cichy obrót przez wszystkie lata, które przebyłem. A w ciągu tych kilku obrotów cała działalność, wszystkie tradycje, złożone organizacje, narody, języki, literatury, dążenia, nawet sama pamięć o Człowieku, jakiego znałem, zostały zmiecione z istnienia."
    en: "“Looking at these stars suddenly dwarfed my own troubles and all the gravities of terrestrial life. I thought of their unfathomable distance, and the slow inevitable drift of their movements out of the unknown past into the unknown future. I thought of the great precessional cycle that the pole of the earth describes. Only forty times had that silent revolution occurred during all the years that I had traversed. And during these few revolutions all the activity, all the traditions, the complex organisations, the nations, languages, literatures, aspirations, even the mere memory of Man as I knew him, had been swept out of existence."
