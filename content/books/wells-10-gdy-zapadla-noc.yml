  - clean: "Potem próbowałem uchronić się przed ogarniającą mnie grozą, uznając to za surową karę za ludzki egoizm. Człowiek zadowalał się życiem w wygodzie i rozkoszy z pracy swego bliźniego, uczynił Konieczność swoim hasłem i usprawiedliwieniem, i w pełni czasu Konieczność się o niego upomniała. Próbowałem nawet pogardy na wzór Carlyle'a dla tej nędznej, upadłej arystokracji. Ale taka postawa umysłu była niemożliwa. Jakkolwiek wielki był ich upadek umysłowy, Elojowie zachowali zbyt wiele z ludzkiej postaci, by nie budzić mojego współczucia i by nie uczynić mnie mimo woli uczestnikiem ich upadku i ich Strachu."
