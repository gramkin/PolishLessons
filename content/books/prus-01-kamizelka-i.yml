  - clean: "Było to już w nocy. Żona, utuliwszy go na łóżku, sprowadziła do pokoju stróżową, a sama pobiegła po doktora. Dowiadywała się o pięciu, ale znalazła ledwie jednego, i to wypadkiem, na ulicy."
