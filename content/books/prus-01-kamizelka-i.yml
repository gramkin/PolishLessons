# review
title: Nowele
titleRu: Новеллы
author: Bolesław Prus
source:
  name: "Wolne Lektury (Bolesław Prus, «Nowele wybrane», PIW 1976)"
  url: https://wolnelektury.pl/katalog/lektura/kamizelka/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 1
chapterTitle: "Kamizelka (I)"
chapterTitleRu: "Жилетка (I)"
level: B2
paragraphs:
  - clean: "Niektórzy ludzie mają pociąg do zbierania osobliwości kosztowniejszych lub mniej kosztownych, na jakie kogo stać. Ja także posiadam zbiorek, lecz skromny, jak zwykle w początkach."
    chunks:
      - pl: "Niektórzy ludzie mają pociąg do zbierania osobliwości"
        ru: "У некоторых людей есть страсть к собиранию редкостей"
        note: "mieć pociąg do czegoś — иметь тягу к чему-л.; pociąg — и «поезд», и «влечение»; osobliwość — книжное «диковина, редкость»"
      - pl: " kosztowniejszych lub mniej kosztownych,"
        ru: "подороже или подешевле,"
        note: "kosztowny — дорогостоящий; kosztowniejszy — сравнительная степень"
      - pl: " na jakie kogo stać."
        ru: "какие кому по средствам."
        note: "stać kogoś na coś — кто-то может себе это позволить; kogo здесь = kogoś «кого-нибудь», старое употребление"
      - pl: " Ja także posiadam zbiorek, lecz skromny,"
        ru: "У меня тоже есть коллекция, но скромная,"
        note: "zbiorek — уменьшительное от zbiór «собрание, коллекция»; lecz — книжное «но», в речи ale"
      - pl: " jak zwykle w początkach."
        ru: "как обычно бывает поначалу."
        note: "w początkach — устаревшее; сегодня na początku"
    words: { "ludzie": ludzie, "pociąg": pociag, "zbierania": zbierac, "posiadam": posiadac, "skromny": skromny }
  - clean: "Jest tam mój dramat, który pisałem jeszcze w gimnazjum na lekcjach języka łacińskiego… Jest kilka zasuszonych kwiatów, które trzeba będzie zastąpić nowymi, jest…"
    chunks:
      - pl: "Jest tam mój dramat,"
        ru: "Там есть моя драма,"
        note: "dramat — мужского рода (ten dramat), в отличие от русской «драмы»"
      - pl: " który pisałem jeszcze w gimnazjum"
        ru: "которую я писал ещё в гимназии"
      - pl: " na lekcjach języka łacińskiego…"
        ru: "на уроках латыни…"
        note: "język łaciński — латинский язык; lekcja języka — урок языка, родительный падеж"
      - pl: " Jest kilka zasuszonych kwiatów,"
        ru: "Есть несколько засушенных цветов,"
        note: "kilka + родительный множественного: kilka kwiatów"
      - pl: " które trzeba będzie zastąpić nowymi,"
        ru: "которые надо будет заменить новыми,"
        note: "zastąpić coś czymś — заменить что-л. чем-л.: творительный падеж"
      - pl: " jest…"
        ru: "есть…"
    words: { "pisałem": pisac, "lekcjach": lekcja, "języka": jezyk, "kwiatów": kwiat, "trzeba": trzeba, "zastąpić": zastapic, "nowymi": nowy }
  - clean: "Zdaje się, że nie ma nic więcej oprócz pewnej bardzo starej i zniszczonej kamizelki."
    chunks:
      - pl: "Zdaje się, że nie ma nic więcej"
        ru: "Кажется, больше там ничего нет,"
        note: "zdaje się — «кажется», то же, что wydaje się"
      - pl: " oprócz pewnej bardzo starej i zniszczonej kamizelki."
        ru: "кроме одной очень старой и поношенной жилетки."
        note: "oprócz + родительный — кроме; pewien здесь «некий, один», а не «уверенный»; zniszczony — истрёпанный"
    words: { "Zdaje": zdawac, "więcej": wiecej, "oprócz": oprocz, "pewnej": pewien, "starej": stary, "zniszczonej": zniszczyc, "kamizelki": kamizelka }
  - clean: "Oto ona. Przód spłowiały, a tył przetarty. Dużo plam, brak guzików, na brzegu dziurka, wypalona zapewne papierosem. Ale najciekawsze w niej są ściągacze. Ten, na którym znajduje się sprzączka, jest skrócony i przyszyty do kamizelki wcale nie po krawiecku, a ten drugi, prawie na całej długości, jest pokłuty zębami sprzączki."
    chunks:
      - pl: "Oto ona."
        ru: "Вот она."
      - pl: " Przód spłowiały, a tył przetarty."
        ru: "Перед выцвел, а спинка протёрта."
        note: "spłowiały — выцветший (от płowieć); przetarty — протёртый"
      - pl: " Dużo plam, brak guzików,"
        ru: "Много пятен, нет пуговиц,"
        note: "brak + родительный: brak guzików — не хватает пуговиц"
      - pl: " na brzegu dziurka,"
        ru: "на краю дырочка,"
      - pl: " wypalona zapewne papierosem."
        ru: "прожжённая, вероятно, папиросой."
        note: "zapewne — книжное «вероятно»; papieros — папироса, сигарета"
      - pl: " Ale najciekawsze w niej są ściągacze."
        ru: "Но самое любопытное в ней — хлястики."
        note: "ściągacz — здесь ремешок с пряжкой на спинке жилета; сегодня так называют и резинку-манжету"
      - pl: " Ten, na którym znajduje się sprzączka,"
        ru: "Тот, на котором пряжка,"
        note: "znajdować się — находиться"
      - pl: " jest skrócony i przyszyty do kamizelki"
        ru: "укорочен и пришит к жилетке"
      - pl: " wcale nie po krawiecku,"
        ru: "вовсе не по-портновски,"
        note: "po krawiecku — так, как сделал бы портной (krawiec); wcale nie — вовсе не"
      - pl: " a ten drugi, prawie na całej długości,"
        ru: "а второй почти по всей длине"
      - pl: " jest pokłuty zębami sprzączki."
        ru: "исколот зубцами пряжки."
        note: "ząb — «зуб»; здесь зубец (шпенёк) пряжки"
    words: { "plam": plama, "guzików": guzik, "brzegu": brzeg, "papierosem": papieros, "znajduje": znajdowac, "drugi": drugi, "długości": dlugosc, "zębami": zab }
  - clean: "Patrząc na to od razu domyślasz się, że właściciel odzienia zapewne co dzień chudnął i wreszcie dosięgnął tego stopnia, na którym kamizelka przestaje być niezbędna, ale natomiast okazuje się bardzo potrzebny zapięty pod szyję frak z magazynu pogrzebowego."
    chunks:
      - pl: "Patrząc na to od razu domyślasz się,"
        ru: "Глядя на это, сразу догадываешься,"
        note: "domyślać się — догадываться; od razu — сразу"
      - pl: " że właściciel odzienia zapewne co dzień chudnął"
        ru: "что владелец одежды, видимо, худел с каждым днём"
        note: "odzienie — устаревшее «одежда», сегодня ubranie; co dzień — каждый день"
      - pl: " i wreszcie dosięgnął tego stopnia,"
        ru: "и наконец дошёл до той степени,"
        note: "dosięgnąć czegoś — достичь чего-л., родительный падеж; сегодня чаще osiągnąć"
      - pl: " na którym kamizelka przestaje być niezbędna,"
        ru: "на которой жилетка перестаёт быть необходимой,"
      - pl: " ale natomiast okazuje się bardzo potrzebny"
        ru: "зато оказывается очень нужен"
        note: "natomiast — «зато, же»; ale natomiast — избыточное сочетание старого стиля"
      - pl: " zapięty pod szyję frak"
        ru: "застёгнутый под горло фрак"
      - pl: " z magazynu pogrzebowego."
        ru: "из похоронной лавки."
        note: "magazyn в XIX веке — «магазин, лавка»; сегодня magazyn — склад, а магазин — sklep. Во фраке из похоронного заведения хоронят"
    words: { "Patrząc": patrzec, "właściciel": wlasciciel, "dzień": dzien, "wreszcie": wreszcie, "przestaje": przestawac, "potrzebny": potrzebny, "szyję": szyja }
  - clean: "Wyznaję, że dziś chętnie odstąpiłbym komu ten szmat sukna, który mi robi trochę kłopotu. Szaf na zbiory jeszcze nie mam, a nie chciałbym znowu trzymać chorej kamizelczyny między własnymi rzeczami. Był jednak czas, żem ją kupił za cenę znakomicie wyższą od wartości, a dałbym nawet i drożej, gdyby umiano się targować. Człowiek miewa w życiu takie chwile, że lubi otaczać się przedmiotami, które przypominają smutek."
    chunks:
      - pl: "Wyznaję, że dziś chętnie odstąpiłbym komu"
        ru: "Признаюсь, сегодня я охотно уступил бы кому-нибудь"
        note: "odstąpić komuś coś — уступить, перепродать; komu здесь = komuś, старое употребление"
      - pl: " ten szmat sukna, który mi robi trochę kłopotu."
        ru: "этот кусок сукна, который доставляет мне немного хлопот."
        note: "szmat — устаревшее «кусок, лоскут»; сегодня szmata «тряпка»; robić komuś kłopot — доставлять хлопоты"
      - pl: " Szaf na zbiory jeszcze nie mam,"
        ru: "Шкафов для коллекций у меня ещё нет,"
        note: "при отрицании прямое дополнение в родительном: nie mam szaf"
      - pl: " a nie chciałbym znowu trzymać chorej kamizelczyny"
        ru: "а держать больную жилеточку мне, опять же, не хотелось бы"
        note: "kamizelczyna — жалостливое уменьшительное от kamizelka; znowu здесь «опять же, с другой стороны»"
      - pl: " między własnymi rzeczami."
        ru: "среди собственных вещей."
      - pl: " Był jednak czas, żem ją kupił"
        ru: "Было, однако, время, когда я купил её"
        note: "żem kupił = że kupiłem: личное окончание -m цепляется к союзу; сегодня так пишут только стилизуя старину"
      - pl: " za cenę znakomicie wyższą od wartości,"
        ru: "за цену значительно выше её стоимости,"
        note: "znakomicie — здесь устаревшее «значительно», сегодня «превосходно»; wyższy od czegoś — выше чего-л."
      - pl: " a dałbym nawet i drożej,"
        ru: "а дал бы и дороже,"
      - pl: " gdyby umiano się targować."
        ru: "если бы умели торговаться."
        note: "umiano — безличная форма на -no: «умели (люди)», без подлежащего"
      - pl: " Człowiek miewa w życiu takie chwile,"
        ru: "Бывают у человека в жизни такие минуты,"
        note: "miewać — многократный глагол от mieć: «иногда иметь, бывать»"
      - pl: " że lubi otaczać się przedmiotami,"
        ru: "когда он любит окружать себя предметами,"
        note: "otaczać się czymś — окружать себя чем-л.: творительный падеж"
      - pl: " które przypominają smutek."
        ru: "напоминающими о печали."
        note: "przypominać coś — напоминать о чём-л.: винительный без предлога"
    words: { "chętnie": chetnie, "kłopotu": klopot, "Szaf": szafa, "trzymać": trzymac, "cenę": cena, "wartości": wartosc, "życiu": zycie, "smutek": smutek }
  - clean: "Smutek ten nie gnieździł się we mnie, ale w mieszkaniu bliskich sąsiadów. Z okna mogłem co dzień spoglądać do wnętrza ich pokoiku."
    chunks:
      - pl: "Smutek ten nie gnieździł się we mnie,"
        ru: "Печаль эта гнездилась не во мне,"
        note: "gnieździć się — гнездиться; smutek ten — книжный порядок слов, обычно ten smutek"
      - pl: " ale w mieszkaniu bliskich sąsiadów."
        ru: "а в квартире ближайших соседей."
        note: "bliski здесь «живущий рядом», а не «родной»"
      - pl: " Z okna mogłem co dzień spoglądać"
        ru: "Из окна я мог каждый день заглядывать"
        note: "spoglądać — поглядывать, смотреть"
      - pl: " do wnętrza ich pokoiku."
        ru: "внутрь их комнатки."
        note: "pokoik — уменьшительное от pokój"
    words: { "Smutek": smutek, "sąsiadów": sasiad, "okna": okno, "mogłem": moc, "wnętrza": wnetrze }
  - clean: "Jeszcze w kwietniu było ich troje: pan, pani i mała służąca, która sypiała, o ile wiem, na kuferku za szafą. Szafa była ciemnowiśniowa. W lipcu, jeżeli mnie pamięć nie zwodzi, zostało ich tylko dwoje: pani i pan, bo służąca przeniosła się do takich państwa, którzy płacili jej trzy ruble na rok i co dzień gotowali obiady."
    chunks:
      - pl: "Jeszcze w kwietniu było ich troje:"
        ru: "Ещё в апреле их было трое:"
        note: "troje — собирательное числительное для группы мужчин и женщин"
      - pl: " pan, pani i mała służąca,"
        ru: "господин, госпожа и маленькая служанка,"
      - pl: " która sypiała, o ile wiem, na kuferku za szafą."
        ru: "которая спала, насколько я знаю, на сундучке за шкафом."
        note: "sypiać — многократный глагол от spać: «обычно спать»; o ile — насколько; kuferek — сундучок"
      - pl: " Szafa była ciemnowiśniowa."
        ru: "Шкаф был тёмно-вишнёвый."
        note: "szafa — женского рода"
      - pl: " W lipcu, jeżeli mnie pamięć nie zwodzi,"
        ru: "В июле, если мне не изменяет память,"
        note: "zwodzić — обманывать; сегодня говорят jeśli mnie pamięć nie myli"
      - pl: " zostało ich tylko dwoje: pani i pan,"
        ru: "их осталось только двое: госпожа и господин,"
      - pl: " bo służąca przeniosła się do takich państwa,"
        ru: "потому что служанка перешла к таким господам,"
        note: "państwo здесь «господа, супружеская пара», а не «государство»"
      - pl: " którzy płacili jej trzy ruble na rok"
        ru: "которые платили ей три рубля в год"
        note: "na rok — в год, сегодня чаще rocznie; рубль — деньги Царства Польского в составе Российской империи"
      - pl: " i co dzień gotowali obiady."
        ru: "и каждый день готовили обед."
    words: { "kwietniu": kwiecien, "wiem": wiedziec, "szafą": szafa, "lipcu": lipiec, "pamięć": pamiec, "płacili": placic, "gotowali": gotowac, "obiady": obiad }
  - clean: "W październiku została już tylko – pani, sama jedna. To jest niezupełnie sama, ponieważ w pokoju znajdowało się jeszcze dużo sprzętów: dwa łóżka, stół, szafa… Ale na początku listopada sprzedano z licytacji niepotrzebne rzeczy, a przy pani ze wszystkich pamiątek po mężu została tylko kamizelka, którą obecnie posiadam."
    chunks:
      - pl: "W październiku została już tylko – pani, sama jedna."
        ru: "В октябре осталась уже только госпожа, одна-одинёшенька."
        note: "sama jedna — совсем одна"
      - pl: " To jest niezupełnie sama,"
        ru: "То есть не совсем одна,"
        note: "to jest — «то есть», сегодня to znaczy или czyli"
      - pl: " ponieważ w pokoju znajdowało się jeszcze dużo sprzętów:"
        ru: "потому что в комнате находилось ещё много мебели:"
        note: "sprzęty здесь «мебель, утварь»; сегодня sprzęt — «оборудование, техника»"
      - pl: " dwa łóżka, stół, szafa…"
        ru: "две кровати, стол, шкаф…"
      - pl: " Ale na początku listopada sprzedano z licytacji"
        ru: "Но в начале ноября с торгов продали"
        note: "sprzedano — безличная форма на -no: «продали»; z licytacji — с аукциона"
      - pl: " niepotrzebne rzeczy,"
        ru: "ненужные вещи,"
      - pl: " a przy pani ze wszystkich pamiątek po mężu"
        ru: "а у госпожи из всех вещей, оставшихся на память о муже,"
        note: "pamiątka po kimś — память об умершем: po + предложный"
      - pl: " została tylko kamizelka, którą obecnie posiadam."
        ru: "осталась только жилетка, которая теперь у меня."
        note: "obecnie — книжное «ныне, теперь»"
    words: { "październiku": pazdziernik, "pokoju": pokoj, "łóżka": lozko, "początku": poczatek, "listopada": listopad, "pamiątek": pamiatka, "mężu": maz, "obecnie": obecnie }
  - clean: "Lecz w końcu listopada pewnego dnia pani zawołała do pustego mieszkania handlarza starzyzny i sprzedała mu swój parasol za dwa złote i kamizelkę po mężu za czterdzieści groszy. Potem zamknęła mieszkanie na klucz, powoli przeszła dziedziniec, w bramie oddała klucz stróżowi, chwilę popatrzyła w swoje niegdyś okno, na które padały drobne płatki śniegu, i — znikła za bramą."
    chunks:
      - pl: "Lecz w końcu listopada pewnego dnia"
        ru: "Но в конце ноября однажды"
        note: "pewnego dnia — однажды, родительный времени"
      - pl: " pani zawołała do pustego mieszkania"
        ru: "госпожа позвала в опустевшую квартиру"
      - pl: " handlarza starzyzny"
        ru: "старьёвщика"
        note: "handlarz starzyzny — торговец старьём; starzyzna — старьё"
      - pl: " i sprzedała mu swój parasol za dwa złote"
        ru: "и продала ему свой зонтик за два злотых"
        note: "parasol — зонт (и от дождя); złoty в те годы — счётная монета в 15 копеек"
      - pl: " i kamizelkę po mężu za czterdzieści groszy."
        ru: "и жилетку покойного мужа за сорок грошей."
        note: "po mężu — оставшуюся после мужа"
      - pl: " Potem zamknęła mieszkanie na klucz,"
        ru: "Потом заперла квартиру на ключ,"
      - pl: " powoli przeszła dziedziniec,"
        ru: "медленно прошла через двор,"
        note: "przejść coś — пройти что-л.: винительный без предлога; dziedziniec — двор дома"
      - pl: " w bramie oddała klucz stróżowi,"
        ru: "в воротах отдала ключ дворнику,"
        note: "brama — ворота, подворотня доходного дома; stróż — дворник, сторож"
      - pl: " chwilę popatrzyła w swoje niegdyś okno,"
        ru: "минуту смотрела на своё бывшее окно,"
        note: "niegdyś — книжное «некогда»; swoje niegdyś okno — «своё некогдашнее окно»"
      - pl: " na które padały drobne płatki śniegu,"
        ru: "на которое падали мелкие снежинки,"
        note: "płatki śniegu — снежинки, дословно «хлопья снега»"
      - pl: " i — znikła za bramą."
        ru: "и — исчезла за воротами."
        note: "znikła — сегодня чаще zniknęła"
    words: { "końcu": koniec, "zawołała": zawolac, "pustego": pusty, "sprzedała": sprzedac, "klucz": klucz, "bramie": brama, "śniegu": snieg, "znikła": zniknac }
  - clean: "Na dziedzińcu został handlarz starzyzny. Podniósł do góry wielki kołnierz kapoty, pod pachę wetknął dopiero co kupiony parasol i owinąwszy w kamizelkę ręce czerwone z zimna, mruczał:"
    chunks:
      - pl: "Na dziedzińcu został handlarz starzyzny."
        ru: "Во дворе остался старьёвщик."
