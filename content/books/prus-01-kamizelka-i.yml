  - clean: "Doktór, spojrzawszy na nią przy blasku migotliwej latarni, uznał za stosowne ją przede wszystkim uspokoić. A ponieważ chwilami zataczała się, zapewne ze zmęczenia, a dorożki na ulicy nie było, więc podał jej rękę i idąc tłumaczył, że krwotok jeszcze niczego nie dowodzi."
