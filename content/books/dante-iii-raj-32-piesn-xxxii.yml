# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 32
chapterTitle: "Pieśń XXXII"
chapterTitleRu: "Песнь XXXII. Устройство розы"
level: B2
paragraphs:
  - clean: "Ciąg dalszy. Św. Bernard objaśnia szczegóły róży niebiańskiej."
    chunks:
      - pl: "Ciąg dalszy. Św. Bernard objaśnia szczegóły róży niebiańskiej."
        ru: "Продолжение. Святой Бернард объясняет устройство небесной розы."
    words: { "Ciąg": ciag, "dalszy": daleki, "szczegóły": szczegol, "róży": roza }
  - clean: "Cały przedmiotem swej żądzy zajęty,\nSam urząd mistrza dowolnie wziął na się\nI począł mówić w te słowa ten święty\n«U stóp Maryi, co ranę zgoiła,\nA którą jątrząc z bólem otworzyła,\nSiedzi niewiasta w pełnej wdzięku krasie\nA niżej od niej, na trzecim siedzeniu\nSiedzą pospołu Rachel z Beatrycą,\nSara, Judyta z prababką psalmisty\nCo w skrusze wołał: Miserere mei!"
    verse: true
    chunks:
      - pl: "Cały przedmiotem swej żądzy zajęty,"
        ru: "Весь поглощённый предметом своего желания,"
      - pl: "\nSam urząd mistrza dowolnie wziął na się"
        ru: "этот святой сам по доброй воле взял на себя должность учителя"
      - pl: "\nI począł mówić w te słowa ten święty"
        ru: "и начал говорить такими словами:"
      - pl: "\n«U stóp Maryi, co ranę zgoiła,"
        ru: "«У ног Марии, что исцелила рану,"
      - pl: "\nA którą jątrząc z bólem otworzyła,"
        ru: "сидит в полной прелести и красе жена,"
        note: "Ева"
      - pl: "\nSiedzi niewiasta w pełnej wdzięku krasie"
        ru: "что, растравив, с болью открыла её;"
        note: "jątrzyć — растравлять"
      - pl: "\nA niżej od niej, na trzecim siedzeniu"
        ru: "а ниже её, на третьем сиденье,"
      - pl: "\nSiedzą pospołu Rachel z Beatrycą,"
        ru: "сидят вместе Рахиль с Беатриче,"
        note: "pospołu — вместе"
      - pl: "\nSara, Judyta z prababką psalmisty"
        ru: "Сарра, Юдифь с прабабкой псалмопевца,"
        note: "Руфь, прабабка Давида"
      - pl: "\nCo w skrusze wołał: Miserere mei!"
        ru: "что в сокрушении взывал: „Miserere mei!“"
        note: "«Помилуй меня»"
    words: { "przedmiotem": przedmiot, "począł": poczac, "bólem": bol, "niewiasta": niewiasta, "niżej": nisko, "wołał": wolac }
  - clean: "Z tronu na trony w dół schodząc źrenicą,\nMożesz je widzieć, gdy ja po kolei\nSzczeblując na wierzch róży wiekuistej,\nKażdy jej listek nazwę po imieniu,\nW dół do siódmego stopnia, jako z góry\nDo tegoż stopnia, izraelskie córy\nZajęły wszystkie tego kwiatu liście."
    verse: true
    chunks:
      - pl: "Z tronu na trony w dół schodząc źrenicą,"
        ru: "Спускаясь зрачком вниз с престола на престол,"
      - pl: "\nMożesz je widzieć, gdy ja po kolei"
        ru: "ты можешь их видеть, пока я по порядку,"
      - pl: "\nSzczeblując na wierzch róży wiekuistej,"
        ru: "восходя к вершине вечной розы,"
        note: "szczeblować — подниматься по ступеням"
      - pl: "\nKażdy jej listek nazwę po imieniu,"
        ru: "назову по имени каждый её листок."
      - pl: "\nW dół do siódmego stopnia, jako z góry"
        ru: "Вниз до седьмой ступени, как и сверху"
      - pl: "\nDo tegoż stopnia, izraelskie córy"
        ru: "до той же ступени, дочери Израиля"
      - pl: "\nZajęły wszystkie tego kwiatu liście."
        ru: "заняли все лепестки этого цветка."
    words: { "tronu": tron, "schodząc": schodzic, "imieniu": imie, "stopnia": stopien, "Zajęły": zajac, "kwiatu": kwiat }
  - clean: "Bo te niewiasty wedle wzroku siły,\nZ jaką swą wiarę w Chrystusie utkwiły,\nSą murem, który w znak ducha nagrody\nPrzegrodził różę na te święte schody.\nGdzie kwiat jej liściem najgęściej odziany,\nTworzą tych schodów gęstolistne ściany\nCi, co w Chrystusa uwierzyli przyjście;\nPo drugiej stronie, gdzie kwiatu korona\nŚwieci przerwami jakby wyszczerbiona,\nSiedzą ci tylko, co na ziemi w chwili,\nGdy Chrystus przyszedł, wzrok nań obrócili."
    verse: true
    chunks:
      - pl: "Bo te niewiasty wedle wzroku siły,"
        ru: "Ибо эти жёны, по силе взгляда,"
      - pl: "\nZ jaką swą wiarę w Chrystusie utkwiły,"
        ru: "с какой устремили свою веру во Христа,"
      - pl: "\nSą murem, który w znak ducha nagrody"
        ru: "образуют стену, что в знак награды духа"
      - pl: "\nPrzegrodził różę na te święte schody."
        ru: "разгородила розу на эти святые ступени."
      - pl: "\nGdzie kwiat jej liściem najgęściej odziany,"
        ru: "Где её цветок гуще всего одет лепестками,"
      - pl: "\nTworzą tych schodów gęstolistne ściany"
        ru: "густолистые стены этих ступеней образуют"
      - pl: "\nCi, co w Chrystusa uwierzyli przyjście;"
        ru: "те, кто уверовал в пришествие Христа;"
      - pl: "\nPo drugiej stronie, gdzie kwiatu korona"
        ru: "на другой стороне, где венец цветка"
      - pl: "\nŚwieci przerwami jakby wyszczerbiona,"
        ru: "светит пробелами, словно выщербленный,"
        note: "wyszczerbiony — выщербленный"
      - pl: "\nSiedzą ci tylko, co na ziemi w chwili,"
        ru: "сидят лишь те, кто на земле в то время,"
      - pl: "\nGdy Chrystus przyszedł, wzrok nań obrócili."
        ru: "когда пришёл Христос, обратил на него взгляд."
    words: { "wzroku": wzrok, "murem": mur, "schody": schody, "najgęściej": gesto, "korona": korona, "obrócili": obrocic }
  - clean: "A jak z tej strony tron niebieskiej Pani\nO całą przestrzeń najgłębszej otchłani\nOd innych tronów dzieli wielki przedział,\nNaprzeciw siedzi, patrz, wielki Jan Chrzciciel,\nKtóry, nim zstąpił do piekła Zbawiciel,\nTam nań czekając przez dwa roki siedział;\nPod nim z zamiarem nowy przedział tworzą\nTrzy najświetniejsze duchowe potęgi,\nI inni z kręgów zstępując na kręgi."
    verse: true
    chunks:
      - pl: "A jak z tej strony tron niebieskiej Pani"
        ru: "И как с этой стороны престол небесной Госпожи"
      - pl: "\nO całą przestrzeń najgłębszej otchłani"
        ru: "отделяет от других престолов великий раздел"
      - pl: "\nOd innych tronów dzieli wielki przedział,"
        ru: "на всё пространство глубочайшей бездны,"
        note: "у Данте — вниз по всей розе"
      - pl: "\nNaprzeciw siedzi, patrz, wielki Jan Chrzciciel,"
        ru: "так напротив, смотри, сидит великий Иоанн Креститель,"
      - pl: "\nKtóry, nim zstąpił do piekła Zbawiciel,"
        ru: "который, прежде чем Спаситель сошёл в ад,"
      - pl: "\nTam nań czekając przez dwa roki siedział;"
        ru: "сидел там, ожидая его, два года;"
      - pl: "\nPod nim z zamiarem nowy przedział tworzą"
        ru: "под ним с умыслом образуют новый раздел"
      - pl: "\nTrzy najświetniejsze duchowe potęgi,"
        ru: "три славнейшие духовные силы,"
        note: "Франциск, Бенедикт, Августин"
      - pl: "\nI inni z kręgów zstępując na kręgi."
        ru: "и другие, спускаясь с круга на круг."
    words: { "niebieskiej": niebieski, "przestrzeń": przestrzen, "tworzą": tworzyc, "duchowe": duchowy, "potęgi": potega, "kręgów": krag }
  - clean: "A więc podziwiaj tu Opatrzność Bożą,\nBo tu duch każdy doświadczonej wiary,\nWyznawcy nowej zarówno jak starej,\nTego ogrodu mogą być kwiatami.\nWiedz, że od stopnia, co te dwa przedziały\nW środku przerzyna liniją tak długą,\nDo najniższego orszak duchów cały,\nNie swoją własną, lecz drugich zasługą,\nI pod pewnymi siedzi warunkami."
    verse: true
    chunks:
      - pl: "A więc podziwiaj tu Opatrzność Bożą,"
        ru: "Итак, подивись здесь Божьему Провидению,"
      - pl: "\nBo tu duch każdy doświadczonej wiary,"
        ru: "ибо здесь всякий дух испытанной веры,"
      - pl: "\nWyznawcy nowej zarówno jak starej,"
        ru: "исповедник как новой, так и старой,"
      - pl: "\nTego ogrodu mogą być kwiatami."
        ru: "может быть цветами этого сада."
      - pl: "\nWiedz, że od stopnia, co te dwa przedziały"
        ru: "Знай, что от ступени, которая пересекает"
      - pl: "\nW środku przerzyna liniją tak długą,"
        ru: "посередине эти два раздела такой длинной линией,"
      - pl: "\nDo najniższego orszak duchów cały,"
        ru: "до самой нижней весь сонм духов"
      - pl: "\nNie swoją własną, lecz drugich zasługą,"
        ru: "сидит не по своей собственной, а по чужой заслуге"
      - pl: "\nI pod pewnymi siedzi warunkami."
        ru: "и на определённых условиях."
    words: { "podziwiaj": podziwiac, "doświadczonej": doswiadczyc, "zarówno": zarowno, "ogrodu": ogrod, "najniższego": niski, "zasługą": zasluga }
  - clean: "Dusze te z swojej śmiertelnej powłoki\nZa wcześnie wzbiły tu swój lot wysoki,\nWprzód nim prawdziwą mogły wybrać wiarę:\nŁatwo je poznasz po ich kształcie innym,\nPo drobnej twarzy, po głosie dziecinnym,\nGdy wzrok tam zwrócisz lub nakłonisz ucha,\nTeraz ty milczysz, wątpiąc w głębi ducha,\nLecz ja duszące z ciebie zdejmę węzły,\nW jakie twe myśli badawcze uwięzły."
    verse: true
    chunks:
      - pl: "Dusze te z swojej śmiertelnej powłoki"
        ru: "Эти души из своей смертной оболочки"
      - pl: "\nZa wcześnie wzbiły tu swój lot wysoki,"
        ru: "слишком рано вознесли сюда свой высокий полёт,"
      - pl: "\nWprzód nim prawdziwą mogły wybrać wiarę:"
        ru: "прежде чем могли избрать истинную веру:"
      - pl: "\nŁatwo je poznasz po ich kształcie innym,"
        ru: "ты легко узнаешь их по иному облику,"
      - pl: "\nPo drobnej twarzy, po głosie dziecinnym,"
        ru: "по маленькому лицу, по детскому голосу,"
      - pl: "\nGdy wzrok tam zwrócisz lub nakłonisz ucha,"
        ru: "когда обратишь туда взгляд или приклонишь ухо."
      - pl: "\nTeraz ty milczysz, wątpiąc w głębi ducha,"
        ru: "Теперь ты молчишь, сомневаясь в глубине духа,"
      - pl: "\nLecz ja duszące z ciebie zdejmę węzły,"
        ru: "но я сниму с тебя душащие узлы,"
      - pl: "\nW jakie twe myśli badawcze uwięzły."
        ru: "в которых застряли твои пытливые мысли."
        note: "badawczy — исследовательский"
    words: { "śmiertelnej": smiertelny, "kształcie": ksztalt, "milczysz": milczec, "głębi": glab, "duszące": dusic, "węzły": wezel }
  - clean: "Tu chęci mają swą wagę i miarę:\nWiedz, że tym państwem ślepy traf nie włada,\nBo w cichym prawu wiecznemu poddaństwie,\nWszystko do miejsca swojego w tym państwie\nŚciśle jak pierścień do palca przypada.\nDlatego z pieluch te dusze szczęśliwe\nWchodząc za wcześnie w to życie prawdziwe,\nNiżej lub wyżej są nie bez przyczyny."
    verse: true
    chunks:
      - pl: "Tu chęci mają swą wagę i miarę:"
        ru: "Здесь желания имеют свой вес и меру:"
      - pl: "\nWiedz, że tym państwem ślepy traf nie włada,"
        ru: "знай, что этим государством не правит слепой случай,"
        note: "traf — случай"
      - pl: "\nBo w cichym prawu wiecznemu poddaństwie,"
        ru: "ибо в тихом подчинении вечному закону"
      - pl: "\nWszystko do miejsca swojego w tym państwie"
        ru: "всё в этом государстве приходится к своему месту"
      - pl: "\nŚciśle jak pierścień do palca przypada."
        ru: "точно, как перстень к пальцу."
      - pl: "\nDlatego z pieluch te dusze szczęśliwe"
        ru: "Поэтому эти счастливые души, с пелёнок"
      - pl: "\nWchodząc za wcześnie w to życie prawdziwe,"
        ru: "входящие слишком рано в эту истинную жизнь,"
      - pl: "\nNiżej lub wyżej są nie bez przyczyny."
        ru: "находятся ниже или выше не без причины."
    words: { "wagę": waga, "miarę": miara, "wiecznemu": wieczny, "Ściśle": scisle, "pierścień": pierscien, "pieluch": pielucha }
  - clean: "Król tej bezmiernej, bez granic krainy,\nKtórego miłość szczęściem tak wysokim,\nTaką miłością jej mieszkańców poi,\nŻe każda żądza tu jest w pełni swojej:\nStwarzając wszystkie dusze pod swym okiem,\nSam je nierówną łaską uposażył,\nJak ją na szali swej woli odważył."
    verse: true
    chunks:
      - pl: "Król tej bezmiernej, bez granic krainy,"
        ru: "Царь этой безмерной, безграничной страны,"
      - pl: "\nKtórego miłość szczęściem tak wysokim,"
        ru: "чья любовь поит её жителей"
      - pl: "\nTaką miłością jej mieszkańców poi,"
        ru: "столь высоким счастьем, такой любовью,"
      - pl: "\nŻe każda żądza tu jest w pełni swojej:"
        ru: "что всякое желание здесь в своей полноте,"
      - pl: "\nStwarzając wszystkie dusze pod swym okiem,"
        ru: "создавая все души под своим оком,"
      - pl: "\nSam je nierówną łaską uposażył,"
        ru: "сам наделил их неравной благодатью,"
        note: "uposażyć — наделить"
      - pl: "\nJak ją na szali swej woli odważył."
        ru: "как отвесил её на весах своей воли."
    words: { "Król": krol, "granic": granica, "krainy": kraina, "miłość": milosc, "szczęściem": szczescie, "mieszkańców": mieszkaniec }
  - clean: "Pismo ci święte najwyraźniej mówi\nO dwojgu bliźniąt, jak niesforne dziatki\nTrzęsły się z gniewu w żywocie swej matki,\nBo niebo daje każdemu duchowi\nKoronę łaski wedle barwy włosa,\nRównie wybrani wstępują w niebiosa\nNa różne stopnie, różnica ich cała\nJest w treści, jaką pierwsza łaska dała."
    verse: true
    chunks:
      - pl: "Pismo ci święte najwyraźniej mówi"
        ru: "Священное Писание тебе яснее всего говорит"
      - pl: "\nO dwojgu bliźniąt, jak niesforne dziatki"
        ru: "о двух близнецах, как непослушные детки"
        note: "Иаков и Исав"
      - pl: "\nTrzęsły się z gniewu w żywocie swej matki,"
        ru: "тряслись от гнева во чреве своей матери,"
        note: "żywot — здесь чрево"
      - pl: "\nBo niebo daje każdemu duchowi"
        ru: "ибо небо даёт каждому духу"
      - pl: "\nKoronę łaski wedle barwy włosa,"
        ru: "венец благодати по цвету волос;"
        note: "Исав был рыжий"
      - pl: "\nRównie wybrani wstępują w niebiosa"
        ru: "так же избранные восходят на небеса"
      - pl: "\nNa różne stopnie, różnica ich cała"
        ru: "на разные ступени, и вся их разница"
      - pl: "\nJest w treści, jaką pierwsza łaska dała."
        ru: "в той сущности, какую дала первая благодать."
    words: { "Pismo": pismo, "Trzęsły": trzasc, "gniewu": gniew, "włosa": wlos, "Równie": rownie, "niebiosa": niebiosa }
  - clean: "Zrazu dość było dla nieba dziedziców\nPrzy niewinności mieć wiarę rodziców,\nA gdy się pierwsze wypełniły czasy,\nNa przyszłe życia trudy i zapasy\nKrzepiono męskie dzieci obrzezaniem.\nLecz gdy czas łaski przyszedł z zwiastowaniem\nWesołej wieści, nowo narodzeni\nBez chrztu pomarli, nie w imię Chrystusa,\nTrzymani byli w piekielnej przedsieni."
    verse: true
    chunks:
      - pl: "Zrazu dość było dla nieba dziedziców"
        ru: "Поначалу наследникам неба было достаточно"
      - pl: "\nPrzy niewinności mieć wiarę rodziców,"
        ru: "при невинности иметь веру родителей,"
      - pl: "\nA gdy się pierwsze wypełniły czasy,"
        ru: "а когда исполнились первые времена,"
      - pl: "\nNa przyszłe życia trudy i zapasy"
        ru: "для будущих трудов и борений жизни"
        note: "zapasy — борьба"
      - pl: "\nKrzepiono męskie dzieci obrzezaniem."
        ru: "мальчиков укрепляли обрезанием."
      - pl: "\nLecz gdy czas łaski przyszedł z zwiastowaniem"
        ru: "Но когда пришло время благодати с возвещением"
      - pl: "\nWesołej wieści, nowo narodzeni"
        ru: "радостной вести, новорождённые,"
      - pl: "\nBez chrztu pomarli, nie w imię Chrystusa,"
        ru: "умершие без крещения, не во имя Христа,"
      - pl: "\nTrzymani byli w piekielnej przedsieni."
        ru: "были удерживаемы в адской прихожей."
        note: "в Лимбе"
    words: { "dziedziców": dziedzic, "niewinności": niewinnosc, "trudy": trud, "męskie": meski, "narodzeni": narodzic, "piekielnej": piekielny }
  - clean: "Teraz w twarz spojrzyj, w ten obraz uroczy,\nNajpodobniejszy do twarzy Chrystusa,\nBlask jej oswoi z światłością twe oczy,\nŻe ujrzą w końcu samego Chrystusa».\nI na nią duchy lały deszcz radości.\nStworzone wzlatać do tej wysokości,\nŻe com wprzód widział, żadne tu widzenie\nMnie nie wtrąciło w takie zadziwienie,\nNie pokazało, jak ta światłość błoga\nTak zbliżonego podobieństwa Boga."
    verse: true
    chunks:
      - pl: "Teraz w twarz spojrzyj, w ten obraz uroczy,"
        ru: "Теперь взгляни в лицо, в этот прелестный образ,"
      - pl: "\nNajpodobniejszy do twarzy Chrystusa,"
        ru: "наиболее подобный лицу Христа,"
      - pl: "\nBlask jej oswoi z światłością twe oczy,"
        ru: "её блеск приучит твои глаза к свету,"
      - pl: "\nŻe ujrzą w końcu samego Chrystusa»."
        ru: "чтобы они наконец увидели самого Христа»."
      - pl: "\nI na nią duchy lały deszcz radości."
