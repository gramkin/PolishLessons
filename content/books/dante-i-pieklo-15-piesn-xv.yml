      - pl: "\nA wszyscy grzechem tym samym zbrukani."
        ru: "и все запятнаны одним и тем же грехом."
      - pl: "\nPrawnik z Akorso i mistrz Pryscyjani,"
        ru: "Юрист Аккорсо и магистр Присциан"
