      - pl: "\nMógłby twojemu przedstawić się oku"
        ru: "мог бы предстать твоему глазу"
      - pl: "\nÓw Andrzej z Mozzi, którego sług sługa"
        ru: "тот Андреа деи Моцци, которого слуга слуг"
