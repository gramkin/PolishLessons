  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 15
chapterTitle: "Pieśń XV"
chapterTitleRu: "Песнь XV. Брунетто Латини"
level: B2
paragraphs:
  - clean: "(Krąg VII. Koło 3. Sodomici. Brunetto, nauczyciel Dantego.)"
    chunks:
      - pl: "(Krąg VII. Koło 3. Sodomici. Brunetto, nauczyciel Dantego.)"
        ru: "(Круг VII. Пояс 3. Содомиты. Брунетто, учитель Данте.)"
        note: "nauczyciel — учитель"
    words: { "Krąg": krag, "Koło": kolo, "nauczyciel": nauczyciel }
  - clean: "Teraz idziemy wybrzeżem kamiennym,\nMgła powstająca z dymiących wód łoża,\nStrzeże od ognia wodę i jej brzegi.\nJak zatrwożony potopem wiosennym\nFlamand swe groble podnosi od morza\nLub jak Padwanie wzdłuż wybrzeża Brenty,\nBroniąc swych zamków, wodom czynią wstręty,\nChiarentana nim rozciepli śniegi:\nNa mniejszą skalę, lecz na wzór ten samy,\nZdrój ten zamknęła pomiędzy dwie tamy\nNieznajomego ręka budownika."
    verse: true
    chunks:
      - pl: "Teraz idziemy wybrzeżem kamiennym,"
        ru: "Теперь мы идём по каменному берегу,"
      - pl: "\nMgła powstająca z dymiących wód łoża,"
        ru: "туман, поднимающийся от дымящихся вод русла,"
        note: "łoże — русло"
      - pl: "\nStrzeże od ognia wodę i jej brzegi."
        ru: "бережёт от огня воду и её берега."
        note: "strzec — беречь"
      - pl: "\nJak zatrwożony potopem wiosennym"
        ru: "Как встревоженный весенним половодьем"
        note: "zatrwożony — встревоженный; potop — потоп, половодье"
      - pl: "\nFlamand swe groble podnosi od morza"
        ru: "фламандец поднимает свои плотины от моря,"
        note: "Flamand — фламандец; grobla — плотина, дамба"
      - pl: "\nLub jak Padwanie wzdłuż wybrzeża Brenty,"
        ru: "или как падуанцы вдоль берега Бренты,"
        note: "Padwanin — падуанец"
      - pl: "\nBroniąc swych zamków, wodom czynią wstręty,"
        ru: "защищая свои замки, ставят препоны водам,"
        note: "czynić wstręty — чинить препятствия"
      - pl: "\nChiarentana nim rozciepli śniegi:"
        ru: "прежде чем Карантания растопит снега:"
        note: "Chiarentana — Карантания (Каринтия); rozciepnąć — растопить"
      - pl: "\nNa mniejszą skalę, lecz na wzór ten samy,"
        ru: "в меньшем масштабе, но по тому же образцу,"
        note: "skala — масштаб; wzór — образец"
      - pl: "\nZdrój ten zamknęła pomiędzy dwie tamy"
        ru: "этот поток заключила между двумя плотинами"
        note: "zdrój — поток; tama — плотина"
      - pl: "\nNieznajomego ręka budownika."
        ru: "рука неизвестного строителя."
        note: "budownik — устар. «строитель»"
    words: { "wybrzeżem": wybrzeze, "Mgła": mgla, "Strzeże": strzec, "skalę": skala-2, "wzór": wzor, "Nieznajomego": nieznajomy }
  - clean: "Jużem za sobą las daleko rzucił,\nGdzie był, nie zgadłbym, gdybym się obrócił.\nI oto trzodę duchów spotykamy,\nDuchy idące wzdłuż tego strumyka.\nPatrzały na nas i oczyma strzygły,\nJak jedni w drugich wpatrujem się lica\nZmrokiem, przy blasku nowego księżyca;\nDuchy te pilno utkwiły w nas oczy,\nJak stary krawiec w ucho swojej igły."
    verse: true
    chunks:
      - pl: "Jużem za sobą las daleko rzucił,"
        ru: "Я уже далеко оставил позади лес,"
        note: "jużem = już + -m"
      - pl: "\nGdzie był, nie zgadłbym, gdybym się obrócił."
        ru: "где он был, не угадал бы, если бы обернулся."
      - pl: "\nI oto trzodę duchów spotykamy,"
        ru: "И вот мы встречаем стадо духов,"
      - pl: "\nDuchy idące wzdłuż tego strumyka."
        ru: "духов, идущих вдоль этого ручья."
      - pl: "\nPatrzały na nas i oczyma strzygły,"
        ru: "Они смотрели на нас и щурили глаза,"
        note: "strzyc oczyma — стрелять глазами, щуриться"
      - pl: "\nJak jedni w drugich wpatrujem się lica"
        ru: "как мы друг другу вглядываемся в лица"
        note: "wpatrujem — устар. «вглядываемся»; lica — лица"
      - pl: "\nZmrokiem, przy blasku nowego księżyca;"
        ru: "в сумерках, при свете новой луны;"
      - pl: "\nDuchy te pilno utkwiły w nas oczy,"
        ru: "эти духи пристально вперили в нас глаза,"
        note: "pilno — пристально"
      - pl: "\nJak stary krawiec w ucho swojej igły."
        ru: "как старый портной в ушко своей иглы."
        note: "krawiec — портной; igła — игла"
    words: { "obrócił": obrocic, "trzodę": trzoda, "Zmrokiem": zmrok, "blasku": blask, "pilno": pilno, "igły": igla }
  - clean: "Z gromady duchów, co tak patrząc kroczy,\nJeden mnie poznał, ułapił co żywo\nPołę mej sukni i krzyknął: «O dziwo!»\nW chwili, gdy do mnie wyciągał ramiona,\nSpojrzałem, chociaż twarz ogniem spalona\nŁatwom ją poznał, nie była zmieniona."
    verse: true
    chunks:
      - pl: "Z gromady duchów, co tak patrząc kroczy,"
        ru: "Из толпы духов, что так, глядя, шагает,"
      - pl: "\nJeden mnie poznał, ułapił co żywo"
        ru: "один меня узнал, ухватил живо"
        note: "ułapić — ухватить"
      - pl: "\nPołę mej sukni i krzyknął: «O dziwo!»"
        ru: "полу моей одежды и крикнул: «О чудо!»"
        note: "poła — пола; suknia — здесь «одежда»"
      - pl: "\nW chwili, gdy do mnie wyciągał ramiona,"
        ru: "В тот миг, когда он протягивал ко мне руки,"
      - pl: "\nSpojrzałem, chociaż twarz ogniem spalona"
        ru: "я взглянул и, хотя лицо было сожжено огнём,"
      - pl: "\nŁatwom ją poznał, nie była zmieniona."
        ru: "легко его узнал, оно не изменилось."
        note: "łatwom = łatwo + -m"
    words: { "duchów": duch, "sukni": suknia, "wyciągał": wyciagac, "ramiona": ramie, "twarz": twarz, "ogniem": ogien }
  - clean: "Podając jemu rękę, rzekłem: «Gdzie to?\nAzali jesteś tu, panie Brunetto?».\nA on: «Mój synu! I któż mię obwini,\nJeśli dla ciebie Brunetto Latini\nPozostał w tyle od swoich szeregu?».\n«Jeśli chcesz,» rzekłem, «nad brzegiem tej wody\nPrzysiądę z tobą; co mogę, to zrobię,\nSpędzim chwil kilka naszym sercom gwoli,\nTen, z którym idę, gdy na to przyzwoli»."
    verse: true
    chunks:
      - pl: "Podając jemu rękę, rzekłem: «Gdzie to?"
        ru: "Подавая ему руку, я сказал: «Как же это?"
      - pl: "\nAzali jesteś tu, panie Brunetto?»."
        ru: "Неужели ты здесь, мессер Брунетто?»"
        note: "azali — неужели"
      - pl: "\nA on: «Mój synu! I któż mię obwini,"
        ru: "А он: «Мой сын! И кто же меня обвинит,"
        note: "mię — устар. «меня»"
      - pl: "\nJeśli dla ciebie Brunetto Latini"
        ru: "если ради тебя Брунетто Латини"
      - pl: "\nPozostał w tyle od swoich szeregu?»."
        ru: "отстал от ряда своих?»"
        note: "szereg — ряд, строй"
      - pl: "\n«Jeśli chcesz,» rzekłem, «nad brzegiem tej wody"
        ru: "«Если хочешь, — сказал я, — у берега этой воды"
      - pl: "\nPrzysiądę z tobą; co mogę, to zrobię,"
        ru: "я присяду с тобой; что могу, то сделаю,"
      - pl: "\nSpędzim chwil kilka naszym sercom gwoli,"
        ru: "проведём несколько минут в угоду нашим сердцам,"
        note: "gwoli — ради, в угоду"
      - pl: "\nTen, z którym idę, gdy na to przyzwoli»."
        ru: "если тот, с кем я иду, на это согласится»."
        note: "przyzwolić — согласиться"
    words: { "Podając": podawac, "rzekłem": rzec, "Pozostał": pozostac, "szeregu": szereg, "brzegiem": brzeg, "wody": woda }
  - clean: "«Synu mój,» mówił, «wiedz, że z naszej trzody\nNa jedną chwilę kto wstrzyma się w biegu,\nSto lat pod ogniem przestoi w otchłani,\nNie mogąc strząsnąć żaru, co go rani.\nIdź, krok za krokiem iść będę przy tobie.\nPotem dogonię braci nierozdzielnych,\nCo idą, płacząc swych mąk nieśmiertelnych»."
    verse: true
    chunks:
      - pl: "«Synu mój,» mówił, «wiedz, że z naszej trzody"
        ru: "«Сын мой, — сказал он, — знай, что из нашего стада"
      - pl: "\nNa jedną chwilę kto wstrzyma się w biegu,"
        ru: "кто на одну минуту задержится в беге,"
      - pl: "\nSto lat pod ogniem przestoi w otchłani,"
        ru: "сто лет простоит в бездне под огнём,"
      - pl: "\nNie mogąc strząsnąć żaru, co go rani."
        ru: "не имея возможности стряхнуть жар, что его ранит."
      - pl: "\nIdź, krok za krokiem iść będę przy tobie."
        ru: "Иди, шаг за шагом я буду идти рядом с тобой."
      - pl: "\nPotem dogonię braci nierozdzielnych,"
        ru: "Потом догоню неразлучных братьев,"
        note: "nierozdzielny — неразлучный"
      - pl: "\nCo idą, płacząc swych mąk nieśmiertelnych»."
        ru: "что идут, оплакивая свои бессмертные муки»."
        note: "płakać czegoś — оплакивать"
    words: { "Synu": syn, "wstrzyma": wstrzymac, "biegu": bieg, "krok": krok, "dogonię": dogonic, "płacząc": plakac }
  - clean: "Nie śmiałem zstąpić, aby z nim iść społem.\nLecz szedłem ze czcią, z pochylonym czołem.\nOn mówił: «Losu czy wyroku władza\nCiebie przed czasem w tę otchłań sprowadza?\nKto jest wódz twoją kierujący drogą?»\n«Tam wyżej żyjąc wesoło i błogo,»\nOdpowiedziałem, «zbłądziłem w dolinę,\nPrzed kresem dni mych myślałem, że zginę;\nLecz zbłąkanego, drżącego od trwogi,\nWódz mnie wprowadził na tor mojej drogi»."
    verse: true
    chunks:
      - pl: "Nie śmiałem zstąpić, aby z nim iść społem."
        ru: "Я не смел спуститься, чтобы идти с ним вместе,"
      - pl: "\nLecz szedłem ze czcią, z pochylonym czołem."
        ru: "но шёл с почтением, со склонённым челом."
      - pl: "\nOn mówił: «Losu czy wyroku władza"
        ru: "Он говорил: «Власть судьбы или приговора"
      - pl: "\nCiebie przed czasem w tę otchłań sprowadza?"
        ru: "приводит тебя прежде времени в эту бездну?"
      - pl: "\nKto jest wódz twoją kierujący drogą?»"
        ru: "Кто вождь, направляющий твой путь?»"
      - pl: "\n«Tam wyżej żyjąc wesoło i błogo,»"
        ru: "«Там, наверху, живя весело и блаженно, —"
        note: "błogo — блаженно"
      - pl: "\nOdpowiedziałem, «zbłądziłem w dolinę,"
        ru: "ответил я, — я заблудился в долине,"
      - pl: "\nPrzed kresem dni mych myślałem, że zginę;"
        ru: "прежде конца моих дней я думал, что погибну;"
      - pl: "\nLecz zbłąkanego, drżącego od trwogi,"
        ru: "но заблудившегося, дрожащего от страха,"
      - pl: "\nWódz mnie wprowadził na tor mojej drogi»."
        ru: "вождь вывел меня на колею моего пути»."
        note: "tor — колея"
    words: { "pochylonym": pochylic, "wyroku": wyrok, "sprowadza": sprowadzac, "wódz": wodz, "dolinę": dolina, "kresem": kres }
  - clean: "A on: «Szczęśliwa twa gwiazda, licz na niej,\nDojdziesz do kresu twej świetnej przystani,\nJeślim się dobrze twej przyszłości radził.\nGdyby śmierć wcześnie ócz mych nie zamknęła.\nWiary twej we mnie pewnie bym nie zdradził,\nWidząc nad tobą niebo tak życzliwe,\nSam bym ci zagrzał twe serce do dzieła!"
    verse: true
    chunks:
      - pl: "A on: «Szczęśliwa twa gwiazda, licz na niej,"
        ru: "А он: «Счастлива твоя звезда, рассчитывай на неё,"
      - pl: "\nDojdziesz do kresu twej świetnej przystani,"
        ru: "ты дойдёшь до цели своей блестящей гавани,"
        note: "przystań — гавань"
      - pl: "\nJeślim się dobrze twej przyszłości radził."
        ru: "если я правильно рассудил о твоём будущем."
        note: "radzić się — советоваться, гадать"
      - pl: "\nGdyby śmierć wcześnie ócz mych nie zamknęła."
        ru: "Если бы смерть рано не закрыла моих очей,"
        note: "ócz — устар. «очей»"
      - pl: "\nWiary twej we mnie pewnie bym nie zdradził,"
        ru: "я наверняка не обманул бы твоей веры в меня,"
      - pl: "\nWidząc nad tobą niebo tak życzliwe,"
        ru: "видя над тобой столь благосклонное небо,"
        note: "życzliwy — благосклонный"
      - pl: "\nSam bym ci zagrzał twe serce do dzieła!"
        ru: "я сам согрел бы тебе сердце для дела!"
        note: "zagrzać — согреть, воодушевить"
    words: { "gwiazda": gwiazda, "radził": radzic, "Wiary": wiara, "zdradził": zdradzic, "niebo": niebo, "dzieła": dzielo }
  - clean: "Lecz to niewdzięczne plemię i złośliwe,\nLud, który wyszedł z Fijesoli z dawna,\nDziki jak skała jego nieuprawna,\nZa czyn twój dobry stanie się twym wrogiem;\nI słusznie, nie dziw, że cię klątwa ściga,\nBo nie przystoi, między cierpkim głogiem\nAżeby słodka dojrzewała figa."
    verse: true
    chunks:
      - pl: "Lecz to niewdzięczne plemię i złośliwe,"
        ru: "Но это неблагодарное и злобное племя,"
      - pl: "\nLud, który wyszedł z Fijesoli z dawna,"
        ru: "народ, что вышел издавна из Фьезоле,"
        note: "Fijesole — Фьезоле"
      - pl: "\nDziki jak skała jego nieuprawna,"
        ru: "дикий, как его невозделанная скала,"
        note: "nieuprawny — невозделанный"
      - pl: "\nZa czyn twój dobry stanie się twym wrogiem;"
        ru: "за твоё доброе дело станет твоим врагом;"
      - pl: "\nI słusznie, nie dziw, że cię klątwa ściga,"
        ru: "и справедливо — не диво, что тебя преследует проклятие,"
        note: "klątwa — проклятие"
      - pl: "\nBo nie przystoi, między cierpkim głogiem"
        ru: "ибо не подобает, чтобы среди терпкого боярышника"
        note: "głóg — боярышник"
      - pl: "\nAżeby słodka dojrzewała figa."
        ru: "созревала сладкая смоква."
        note: "figa — смоква"
    words: { "plemię": plemie, "złośliwe": zlosliwy, "skała": skala, "czyn": czyn, "słusznie": slusznie, "klątwa": klatwa }
  - clean: "Wieść stara ślepym nazywa go ludem.\nPlemię zawistne, dumne i łakome:\nObyś ich nigdy nie kalał się brudem!\nŁaski Fortuny tak w tobie widome,\nTwój przyszły zaszczyt, że stronnictwa oba,\nGdy swej zawiści stępią ostrze grotu,\nGłodne zapragną twojego powrotu."
    verse: true
    chunks:
      - pl: "Wieść stara ślepym nazywa go ludem."
        ru: "Старая молва называет его слепым народом."
      - pl: "\nPlemię zawistne, dumne i łakome:"
        ru: "Племя завистливое, гордое и жадное:"
      - pl: "\nObyś ich nigdy nie kalał się brudem!"
        ru: "о, если бы ты никогда не марался их грязью!"
        note: "obyś — о если бы ты; kalać się — мараться"
      - pl: "\nŁaski Fortuny tak w tobie widome,"
        ru: "Милости Фортуны так в тебе видны,"
        note: "widomy — видимый"
      - pl: "\nTwój przyszły zaszczyt, że stronnictwa oba,"
        ru: "твоя будущая слава такова, что обе партии,"
      - pl: "\nGdy swej zawiści stępią ostrze grotu,"
        ru: "когда притупят остриё своей зависти,"
      - pl: "\nGłodne zapragną twojego powrotu."
        ru: "голодные, возжаждут твоего возвращения."
    words: { "ludem": lud, "dumne": dumny, "brudem": brud, "Fortuny": fortuna, "zaszczyt": zaszczyt, "ostrze": ostrze }
  - clean: "Lecz bądź, roślino, z dala od ich dzioba,\nZwierz z Fijesoli drapieżnym nałogiem\nNiech się podściela ze swych ciał barłogiem;\nLecz niech roślinę zostawi w pokoju,\nGdy jeszcze jaka wyrasta z ich gnoju,\nW której odżywa to święte nasienie\nRzymian, co przyszli w tę stronę nie w gości,\nLecz zamieszkali gniazdo takiej złości»."
    verse: true
    chunks:
      - pl: "Lecz bądź, roślino, z dala od ich dzioba,"
        ru: "Но будь, росток, подальше от их клюва,"
        note: "dziób — клюв"
      - pl: "\nZwierz z Fijesoli drapieżnym nałogiem"
        ru: "пусть звери из Фьезоле в хищной своей привычке"
      - pl: "\nNiech się podściela ze swych ciał barłogiem;"
        ru: "стелют себе подстилку из собственных тел;"
        note: "podścielać — подстилать; barłóg — подстилка, логово"
      - pl: "\nLecz niech roślinę zostawi w pokoju,"
        ru: "но пусть оставят в покое росток,"
      - pl: "\nGdy jeszcze jaka wyrasta z ich gnoju,"
        ru: "если ещё какой-нибудь вырастает из их навоза,"
        note: "gnój — навоз"
      - pl: "\nW której odżywa to święte nasienie"
        ru: "в котором оживает то святое семя"
        note: "odżywać — оживать"
      - pl: "\nRzymian, co przyszli w tę stronę nie w gości,"
        ru: "римлян, что пришли в эту сторону не в гости,"
      - pl: "\nLecz zamieszkali gniazdo takiej złości»."
        ru: "а поселились в гнезде такой злобы»."
    words: { "roślino": roslina, "Zwierz": zwierz, "ciał": cialo, "nasienie": nasienie, "zamieszkali": zamieszkac, "gniazdo": gniazdo }
  - clean: "Odpowiedziałem: «Gdyby me życzenie,\nGdyby me chęci wysłuchano z góry,\nNie byłbyś pozwan przed sąd twej natury.\nWierzaj mi, zawsze w pamięci mej stoi\nDrogi ojcowski obraz twarzy twojej,\nGdy mnie uczyłeś, jak dzieły wielkiemi\nUnieśmiertelnia człek imię na ziemi."
    verse: true
    chunks:
      - pl: "Odpowiedziałem: «Gdyby me życzenie,"
        ru: "Я ответил: «Если бы моё желание,"
      - pl: "\nGdyby me chęci wysłuchano z góry,"
        ru: "если бы мои мольбы были услышаны свыше,"
      - pl: "\nNie byłbyś pozwan przed sąd twej natury."
        ru: "ты не был бы вызван на суд своей природы."
        note: "pozwan — краткая форма: «вызван (в суд)»; то есть ещё не умер бы"
      - pl: "\nWierzaj mi, zawsze w pamięci mej stoi"
