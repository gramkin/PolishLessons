        note: "wierzaj — устар. «верь»"
      - pl: "\nDrogi ojcowski obraz twarzy twojej,"
        ru: "дорогой отеческий образ твоего лица,"
      - pl: "\nGdy mnie uczyłeś, jak dzieły wielkiemi"
        ru: "когда ты учил меня, как великими делами"
        note: "dzieły — старое твор. мн. «делами»"
      - pl: "\nUnieśmiertelnia człek imię na ziemi."
        ru: "человек увековечивает имя на земле."
        note: "unieśmiertelniać — увековечивать"
    words: { "Odpowiedziałem": odpowiedziec, "chęci": chec, "wysłuchano": wysluchac, "natury": natura, "pamięci": pamiec, "uczyłeś": uczyc }
  - clean: "Za to ci wdzięczność serce me przechowa,\nRad, póki żyję, wyznam ją przez słowa.\nCo o mej gwieździe mówisz, będę baczył,\nAbym tekst drugi o niej wytłumaczył\nSłowami pani, która mi odsłoni\nCałą mą przyszłość, jeśli dojdę do niej."
    verse: true
    chunks:
      - pl: "Za to ci wdzięczność serce me przechowa,"
        ru: "За это сердце моё сохранит тебе благодарность,"
      - pl: "\nRad, póki żyję, wyznam ją przez słowa."
        ru: "охотно, пока жив, буду исповедовать её словами."
      - pl: "\nCo o mej gwieździe mówisz, będę baczył,"
        ru: "Что ты говоришь о моей звезде, я буду помнить,"
        note: "baczyć — помнить, следить"
      - pl: "\nAbym tekst drugi o niej wytłumaczył"
        ru: "чтобы второй текст о ней растолковать"
        note: "второе пророчество, после Фаринаты"
      - pl: "\nSłowami pani, która mi odsłoni"
        ru: "словами госпожи, что откроет мне"
        note: "Беатриче"
      - pl: "\nCałą mą przyszłość, jeśli dojdę do niej."
        ru: "всё моё будущее, если я дойду до неё."
    words: { "wdzięczność": wdziecznosc, "wyznam": wyznac, "tekst": tekst, "wytłumaczył": wytlumaczyc, "przyszłość": przyszlosc, "dojdę": dojsc }
  - clean: "Tylko ja chciałbym, byś wiedział, żem gotów\nZnieść cios Fortuny, pociski jej grotów,\nAbym w sumieniu był czystym aniołem.\nTreść wróżb nienowa dla mojego ucha;\nNiech więc Fortuna, jak chce, toczy kołem!»\nWtenczas na prawo zwrócił się Wirgili,\nPopatrzał na mnie i mówił po chwili:\n«Kto w swej pamięci bez błędu zapisze\nRzecz raz słyszaną, taki dobrze słucha»."
    verse: true
    chunks:
      - pl: "Tylko ja chciałbym, byś wiedział, żem gotów"
        ru: "Только я хотел бы, чтобы ты знал, что я готов"
      - pl: "\nZnieść cios Fortuny, pociski jej grotów,"
        ru: "снести удар Фортуны, метание её стрел,"
        note: "pocisk — снаряд"
      - pl: "\nAbym w sumieniu był czystym aniołem."
        ru: "лишь бы в совести быть чистым ангелом."
      - pl: "\nTreść wróżb nienowa dla mojego ucha;"
        ru: "Содержание пророчеств не ново для моего уха;"
        note: "wróżba — предсказание"
      - pl: "\nNiech więc Fortuna, jak chce, toczy kołem!»"
        ru: "пусть же Фортуна, как хочет, крутит колесо!»"
      - pl: "\nWtenczas na prawo zwrócił się Wirgili,"
        ru: "Тогда направо повернулся Вергилий,"
      - pl: "\nPopatrzał na mnie i mówił po chwili:"
        ru: "посмотрел на меня и сказал через минуту:"
      - pl: "\n«Kto w swej pamięci bez błędu zapisze"
        ru: "«Кто в своей памяти без ошибки запишет"
      - pl: "\nRzecz raz słyszaną, taki dobrze słucha»."
        ru: "однажды услышанное, тот хорошо слушает»."
    words: { "cios": cios, "pociski": pocisk, "sumieniu": sumienie, "aniołem": aniol, "toczy": toczyc, "zapisze": zapisac }
  - clean: "Idąc i mówiąc wciąż z panem Brunetto,\nPytałem, jacy jego towarzysze\nZnajomsi byli jakim czynem, chwałą,\nBlaskiem nauki czy własną zaletą.\nA on: «Niektórzy poznania są godni,\nO drugich będzie zamilczeć wygodniej,\nMówić tak długo czasu by nie stało."
