  - clean: "Czerwoni stworzyli tajną organizację obejmującą cały kraj, z własnym kierownictwem, nazywanym Komitetem Centralnym Narodowym. Jej członkowie składali przysięgę i płacili składki, a organizacja liczyła wkrótce dziesiątki tysięcy ludzi. Wśród przywódców czerwonych byli młody oficer armii rosyjskiej Jarosław Dąbrowski, później generał Komuny Paryskiej, i dwudziestojednoletni student Stefan Bobrowski. Bobrowski był wujem Józefa Konrada Korzeniowskiego, który jako dorosły człowiek wyemigrował do Anglii i stał się słynnym pisarzem angielskim, znanym jako Joseph Conrad. Rodzice przyszłego pisarza za udział w przygotowaniach do powstania zostali zesłani w głąb Rosji, gdzie oboje zmarli."
    draft: true
    chunks:
      - pl: "Czerwoni stworzyli tajną organizację obejmującą cały kraj, z własnym kierownictwem, nazywanym Komitetem Centralnym Narodowym."
