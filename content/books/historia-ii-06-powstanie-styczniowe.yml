  - clean: "Polskie społeczeństwo podzieliło się na dwa obozy. Umiarkowanych nazywano białymi. Byli wśród nich ziemianie, bogaci mieszczanie i bankierzy, jak Leopold Kronenberg, a ich przywódcą moralnym był hrabia Andrzej Zamoyski, prezes Towarzystwa Rolniczego. Biali chcieli autonomii i reform, ale uważali powstanie za szaleństwo, które może tylko zniszczyć to, co już osiągnięto. Radykałów nazywano czerwonymi. Byli to młodzi studenci, oficerowie, rzemieślnicy i urzędnicy, którzy wierzyli, że niepodległość można wywalczyć tylko orężem i że trzeba natychmiast dać chłopom ziemię."
