      - pl: " Kobiety ubierały się na czarno na znak żałoby narodowej i nosiły biżuterię w kształcie krzyży, kajdan i cierniowych koron."
        ru: "Женщины одевались в чёрное в знак национального траура и носили украшения в виде крестов, кандалов и терновых венцов."
        note: "kajdany — кандалы; cierniowy — терновый"
      - pl: " Mężczyźni nosili dawne polskie stroje i konfederatki, czyli czapki z kwadratowym denkiem."
        ru: "Мужчины носили старинную польскую одежду и конфедератки, то есть шапки с квадратным верхом."
      - pl: " W manifestacjach brało udział wielu Żydów, a rabin Ber Meisels razem z księżmi katolickimi wzywał do jedności."
        ru: "В манифестациях участвовало много евреев, а раввин Бер Мейзельс вместе с католическими священниками призывал к единству."
      - pl: " Mówiono wtedy o braterstwie Polaków i Żydów, i przez pewien czas wydawało się, że stare uprzedzenia odchodzą w przeszłość."
        ru: "Тогда говорили о братстве поляков и евреев, и некоторое время казалось, что старые предрассудки уходят в прошлое."
