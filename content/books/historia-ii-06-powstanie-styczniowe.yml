        ru: "Его считали предателем, помогающим царю управлять Польшей, а его реформы — попыткой подкупить народ."
      - pl: " Wielopolski z kolei pogardzał manifestacjami i spiskami, które uważał za dziecinadę prowadzącą do katastrofy."
        ru: "Велёпольский, в свою очередь, презирал манифестации и заговоры, считая их ребячеством, ведущим к катастрофе."
