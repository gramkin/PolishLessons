  - clean: "Wielopolski postanowił rozbić organizację czerwonych jednym ciosem. W styczniu 1863 roku przeprowadzono w Warszawie brankę, czyli pobór do wojska rosyjskiego. Listy rekrutów nie były przypadkowe: umieszczono na nich przede wszystkim młodych mieszkańców miast podejrzewanych o udział w konspiracji. Służba w armii carskiej trwała wtedy wiele lat, więc branka oznaczała w praktyce wywiezienie młodzieży daleko od kraju. Wielopolski liczył, że pozbawi w ten sposób konspirację jej żołnierzy. Osiągnął odwrotny skutek. Tysiące zagrożonych młodych ludzi uciekło do lasów, a Komitet Centralny musiał podjąć decyzję o natychmiastowym wybuchu powstania, choć nie był do niego przygotowany."
    draft: true
    chunks:
      - pl: "Wielopolski postanowił rozbić organizację czerwonych jednym ciosem."
        ru: "Велёпольский решил разгромить организацию красных одним ударом."
      - pl: " W styczniu 1863 roku przeprowadzono w Warszawie brankę, czyli pobór do wojska rosyjskiego."
        ru: "В январе 1863 года в Варшаве провели рекрутский набор в русскую армию."
        note: "branka — рекрутский набор"
      - pl: " Listy rekrutów nie były przypadkowe: umieszczono na nich przede wszystkim młodych mieszkańców miast podejrzewanych o udział w konspiracji."
        ru: "Списки рекрутов не были случайными: в них внесли прежде всего молодых горожан, подозреваемых в участии в подполье."
        note: "rekrut — рекрут"
      - pl: " Służba w armii carskiej trwała wtedy wiele lat, więc branka oznaczała w praktyce wywiezienie młodzieży daleko od kraju."
        ru: "Служба в царской армии длилась тогда много лет, так что набор фактически означал вывоз молодёжи далеко от родины."
