  - clean: "Car postanowił połączyć represje z ustępstwami. Na czele cywilnej administracji Królestwa postawił margrabiego Aleksandra Wielopolskiego, polskiego arystokratę, który był przekonany, że Polacy mogą coś osiągnąć tylko w porozumieniu z Rosją. Wielopolski był człowiekiem inteligentnym, energicznym, ale dumnym i pogardliwym wobec innych. Przeprowadził wiele ważnych reform. Spolszczył administrację i szkolnictwo, otworzył w Warszawie Szkołę Główną, czyli polski uniwersytet, i zamienił chłopom pańszczyznę na czynsz. W 1862 roku zrównał w prawach Żydów, którzy po raz pierwszy otrzymali prawo kupowania ziemi i swobodnego osiedlania się."
    draft: true
    chunks:
      - pl: "Car postanowił połączyć represje z ustępstwami."
        ru: "Царь решил сочетать репрессии с уступками."
        note: "ustępstwo — уступка"
      - pl: " Na czele cywilnej administracji Królestwa postawił margrabiego Aleksandra Wielopolskiego, polskiego arystokratę, który był przekonany, że Polacy mogą coś osiągnąć tylko w porozumieniu z Rosją."
        ru: "Во главе гражданской администрации Королевства он поставил маркиза Александра Велёпольского, польского аристократа, убеждённого, что поляки могут чего-то добиться лишь в согласии с Россией."
        note: "margrabia — здесь «маркиз»"
      - pl: " Wielopolski był człowiekiem inteligentnym, energicznym, ale dumnym i pogardliwym wobec innych."
        ru: "Велёпольский был человеком умным, энергичным, но гордым и презрительным к другим."
        note: "pogardliwy — презрительный"
      - pl: " Przeprowadził wiele ważnych reform."
        ru: "Он провёл много важных реформ."
      - pl: " Spolszczył administrację i szkolnictwo, otworzył w Warszawie Szkołę Główną, czyli polski uniwersytet, i zamienił chłopom pańszczyznę na czynsz."
        ru: "Он полонизировал администрацию и образование, открыл в Варшаве Главную школу, то есть польский университет, и заменил крестьянам барщину чиншем."
        note: "spolszczyć — полонизировать"
      - pl: " W 1862 roku zrównał w prawach Żydów, którzy po raz pierwszy otrzymali prawo kupowania ziemi i swobodnego osiedlania się."
        ru: "В 1862 году он уравнял в правах евреев, которые впервые получили право покупать землю и свободно селиться."
