      - pl: " Byli wśród nich ziemianie, bogaci mieszczanie i bankierzy, jak Leopold Kronenberg, a ich przywódcą moralnym był hrabia Andrzej Zamoyski, prezes Towarzystwa Rolniczego."
        ru: "Среди них были землевладельцы, богатые горожане и банкиры, как Леопольд Кроненберг, а их нравственным вождём был граф Анджей Замойский, председатель Земледельческого общества."
