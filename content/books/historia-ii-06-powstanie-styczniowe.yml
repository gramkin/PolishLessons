        note: "kierownictwo — руководство"
      - pl: " Jej członkowie składali przysięgę i płacili składki, a organizacja liczyła wkrótce dziesiątki tysięcy ludzi."
        ru: "Её члены приносили присягу и платили взносы, а организация вскоре насчитывала десятки тысяч человек."
