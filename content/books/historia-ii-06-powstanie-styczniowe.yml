      - pl: " Tysiące ludzi wychodziły na ulice, śpiewały pieśni religijne i patriotyczne, a w kościołach rozbrzmiewał hymn „Boże, coś Polskę”."
        ru: "Тысячи людей выходили на улицы, пели религиозные и патриотические песни, а в храмах звучал гимн «Боже, что Польшу»."
