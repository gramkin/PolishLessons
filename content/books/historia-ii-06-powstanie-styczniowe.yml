paragraphs:
  - clean: "Na początku lat sześćdziesiątych XIX wieku w Warszawie zaczęły się manifestacje patriotyczne. Pretekstem były pogrzeby zasłużonych ludzi i rocznice dawnych wydarzeń: bitwy pod Grochowem, powstania listopadowego, unii lubelskiej. Tysiące ludzi wychodziły na ulice, śpiewały pieśni religijne i patriotyczne, a w kościołach rozbrzmiewał hymn „Boże, coś Polskę”. W lutym 1861 roku wojsko rosyjskie strzelało do manifestantów i zabiło pięć osób. Ich pogrzeb zamienił się w ogromną manifestację, w której szli obok siebie księża katoliccy, pastorzy i rabini. W kwietniu żołnierze strzelali do tłumu na placu Zamkowym i zginęło już ponad sto osób. Wśród zabitych był młody żydowski uczeń Michał Landy, który podniósł krzyż upuszczony przez zastrzelonego zakonnika i niósł go dalej, aż sam padł od kuli. Jego śmierć stała się symbolem polsko-żydowskiego braterstwa tamtych dni."
    draft: true
    chunks:
      - pl: "Na początku lat sześćdziesiątych XIX wieku w Warszawie zaczęły się manifestacje patriotyczne."
