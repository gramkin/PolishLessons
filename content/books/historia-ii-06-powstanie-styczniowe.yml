  - clean: "Mimo to większość Polaków go nienawidziła. Uważano go za zdrajcę, który pomaga carowi rządzić Polską, a jego reformy za próbę przekupienia narodu. Wielopolski z kolei pogardzał manifestacjami i spiskami, które uważał za dziecinadę prowadzącą do katastrofy. Powiedział podobno: „Dla Polaków można czasem coś zrobić, ale z Polakami nigdy”. Latem 1862 roku namiestnikiem został brat cara, wielki książę Konstanty Mikołajewicz, zwolennik reform. Spiskowcy próbowali zabić zarówno jego, jak i Wielopolskiego, a zamachowców publicznie wieszano. Kraj szybko zmierzał ku nowemu wybuchowi."
    draft: true
    chunks:
