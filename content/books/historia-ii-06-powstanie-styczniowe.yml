  - clean: "Te wydarzenia wywołały falę patriotyzmu w całym kraju. Kobiety ubierały się na czarno na znak żałoby narodowej i nosiły biżuterię w kształcie krzyży, kajdan i cierniowych koron. Mężczyźni nosili dawne polskie stroje i konfederatki, czyli czapki z kwadratowym denkiem. W manifestacjach brało udział wielu Żydów, a rabin Ber Meisels razem z księżmi katolickimi wzywał do jedności. Mówiono wtedy o braterstwie Polaków i Żydów, i przez pewien czas wydawało się, że stare uprzedzenia odchodzą w przeszłość. Kiedy władze zamknęły kościoły, Meisels zamknął też synagogi na znak solidarności i został za to wydalony z kraju."
    draft: true
    chunks:
      - pl: "Te wydarzenia wywołały falę patriotyzmu w całym kraju."
