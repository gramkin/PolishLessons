# review
title: "Boska komedia. Czyściec"
titleRu: "Божественная комедия. Чистилище"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-czysciec/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 9
chapterTitle: "Pieśń IX"
chapterTitleRu: "Песнь IX. Врата Чистилища"
level: B2
paragraphs:
  - clean: "(Dante we śnie przeniesiony przed bramę właściwego czyśćca. Otrzymuje absolucję i wchodzi. Łucja. Siedem P.)"
    chunks:
      - pl: "(Dante we śnie przeniesiony przed bramę właściwego czyśćca. Otrzymuje absolucję i wchodzi. Łucja. Siedem P.)"
        ru: "(Данте во сне перенесён к воротам собственно Чистилища. Получает отпущение и входит. Лючия. Семь «P».)"
        note: "absolucja — отпущение грехов; P — peccatum, «грех»"
    words: { "śnie": sen, "przeniesiony": przeniesc, "bramę": brama, "właściwego": wlasciwy, "Otrzymuje": otrzymywac, "wchodzi": wchodzic }
  - clean: "Starożytnego kochanka Tytona,\nUchodząc z objęć swego nałożnika,\nJuż białym rąbkiem w wschodniej wiała bramie:\nDyjamentami swe czoło natyka,\nNa podobieństwo kształtu skorpiona,\nKtóry ogonem jako żądłem bodzie."
    verse: true
    chunks:
      - pl: "Starożytnego kochanka Tytona,"
        ru: "Старинного возлюбленного Тифона"
        note: "Аврора, супруга Тифона"
      - pl: "\nUchodząc z objęć swego nałożnika,"
        ru: "наложница, выходя из его объятий,"
        note: "nałożnik — устар. здесь «супруг»; у Korsaka смысл сбивчив"
      - pl: "\nJuż białym rąbkiem w wschodniej wiała bramie:"
        ru: "уже белым краем веяла в восточных вратах:"
      - pl: "\nDyjamentami swe czoło natyka,"
        ru: "алмазами она убирает своё чело,"
        note: "dyjament — алмаз; natykać — усыпать"
      - pl: "\nNa podobieństwo kształtu skorpiona,"
        ru: "наподобие очертаний скорпиона,"
      - pl: "\nKtóry ogonem jako żądłem bodzie."
        ru: "что жалит хвостом, как жалом."
    words: { "Starożytnego": starozytny, "Uchodząc": uchodzic, "wschodniej": wschodni, "podobieństwo": podobienstwo, "kształtu": ksztalt, "ogonem": ogon }
  - clean: "Tam, gdzieśmy byli, już noc w swym pochodzie\nDała dwa kroki, a za trzecim krokiem\nZ obwisłych skrzydeł potrząsała mrokiem.\nWłócząc proch z sobą wzięty po Adamie,\nSnem zwyciężony przyległem na trawie,\nGdzie nas samopięć siedziała drużyna."
    verse: true
    chunks:
      - pl: "Tam, gdzieśmy byli, już noc w swym pochodzie"
        ru: "Там, где мы были, ночь в своём шествии"
      - pl: "\nDała dwa kroki, a za trzecim krokiem"
        ru: "уже сделала два шага, а на третьем шагу"
      - pl: "\nZ obwisłych skrzydeł potrząsała mrokiem."
        ru: "с обвисших крыльев стряхивала мрак."
        note: "obwisły — обвисший"
      - pl: "\nWłócząc proch z sobą wzięty po Adamie,"
        ru: "Волоча с собой прах, взятый от Адама,"
        note: "то есть тело"
      - pl: "\nSnem zwyciężony przyległem na trawie,"
        ru: "побеждённый сном, я прилёг на траве,"
      - pl: "\nGdzie nas samopięć siedziała drużyna."
        ru: "где мы впятером сидели дружиной."
        note: "samopięć — устар. «впятером»"
    words: { "krokiem": krok, "skrzydeł": skrzydlo, "mrokiem": mrok, "proch": proch, "zwyciężony": zwyciezyc, "trawie": trawa }
  - clean: "Była to bliska przedświtu godzina,\nGdy smutnie kwilić jaskółka zaczyna,\nGodzina, w której wyzwolony prawie\nDuch nasz od ziemskich myśli, dziennej troski,\nW swoich widzeniach jest nieledwo boski.\nWidziałem we śnie, orzeł złotopióry\nWisiał pod niebem i skrzydła otwierał,\nJakby się spuścić na ziemię zabierał."
    verse: true
    chunks:
      - pl: "Była to bliska przedświtu godzina,"
        ru: "Был час, близкий к рассвету,"
      - pl: "\nGdy smutnie kwilić jaskółka zaczyna,"
        ru: "когда начинает печально щебетать ласточка,"
        note: "kwilić — щебетать жалобно; jaskółka — ласточка"
      - pl: "\nGodzina, w której wyzwolony prawie"
        ru: "час, в который почти освобождённый"
      - pl: "\nDuch nasz od ziemskich myśli, dziennej troski,"
        ru: "наш дух от земных мыслей, дневной заботы,"
      - pl: "\nW swoich widzeniach jest nieledwo boski."
        ru: "в своих видениях почти божествен."
        note: "nieledwo — почти"
      - pl: "\nWidziałem we śnie, orzeł złotopióry"
        ru: "Я видел во сне: орёл златопёрый"
      - pl: "\nWisiał pod niebem i skrzydła otwierał,"
        ru: "висел под небом и раскрывал крылья,"
      - pl: "\nJakby się spuścić na ziemię zabierał."
        ru: "будто собирался спуститься на землю."
    words: { "ziemskich": ziemski, "dziennej": dzienny, "troski": troska, "orzeł": orzel, "Wisiał": wisiec, "spuścić": spuscic }
  - clean: "Zda się, tam byłem, skąd on niespodzianie\nWzniósł Ganimeda w niebieskie zebranie.\nMyśliłem sobie: może ten król ptaszy\nW tym miejscu tylko rój lataczów straszy?\nWkrótce z łoskotem spadł jak piorun z chmury\nI w sferę ognia uniósł mię zarazem:\nŻar piekł mię jakby gorącym żelazem,\nAż sen mój cały znikł z swoim widziadłem."
    verse: true
    chunks:
      - pl: "Zda się, tam byłem, skąd on niespodzianie"
        ru: "Казалось, я был там, откуда он нечаянно"
      - pl: "\nWzniósł Ganimeda w niebieskie zebranie."
        ru: "вознёс Ганимеда в небесное собрание."
      - pl: "\nMyśliłem sobie: może ten król ptaszy"
        ru: "Я подумал про себя: может, этот птичий царь"
      - pl: "\nW tym miejscu tylko rój lataczów straszy?"
        ru: "лишь в этом месте пугает рой летунов?"
        note: "latacz — летун"
      - pl: "\nWkrótce z łoskotem spadł jak piorun z chmury"
        ru: "Вскоре он с грохотом пал, как молния из тучи,"
      - pl: "\nI w sferę ognia uniósł mię zarazem:"
        ru: "и разом унёс меня в сферу огня:"
      - pl: "\nŻar piekł mię jakby gorącym żelazem,"
        ru: "жар жёг меня, будто раскалённым железом,"
      - pl: "\nAż sen mój cały znikł z swoim widziadłem."
        ru: "пока весь мой сон не исчез со своим видением."
        note: "widziadło — видение"
    words: { "Wzniósł": wzniesc, "straszy": straszyc, "piorun": piorun, "chmury": chmura, "piekł": piec-2, "żelazem": zelazo }
  - clean: "Nie mniej Achilles drżał, gdy przebudzone\nOczy obracał w tę i ową stronę,\nKiedy śpiącego skradłszy od Chirona,\nNa Scyros matki zaniosły ramiona,\nGdzie jego bystre wyśledziły Greki:\nJak ja zbudzony tam drżałem i zbladłem,\nGdy sen w popłochu pierzchnął z mej powieki."
    verse: true
    chunks:
      - pl: "Nie mniej Achilles drżał, gdy przebudzone"
        ru: "Не меньше дрожал Ахилл, когда, пробуждённый,"
      - pl: "\nOczy obracał w tę i ową stronę,"
        ru: "поворачивал глаза туда и сюда,"
      - pl: "\nKiedy śpiącego skradłszy od Chirona,"
        ru: "когда, похитив спящего у Хирона,"
      - pl: "\nNa Scyros matki zaniosły ramiona,"
        ru: "руки матери отнесли его на Скирос,"
      - pl: "\nGdzie jego bystre wyśledziły Greki:"
        ru: "где его выследили проницательные греки:"
      - pl: "\nJak ja zbudzony tam drżałem i zbladłem,"
        ru: "чем я, проснувшись, там дрожал и побледнел,"
      - pl: "\nGdy sen w popłochu pierzchnął z mej powieki."
        ru: "когда сон в смятении улетел с моих век."
    words: { "stronę": strona, "śpiącego": spac, "skradłszy": skrasc, "matki": matka, "zaniosły": zaniesc, "ramiona": ramie }
  - clean: "Mój wódz ode mnie stał tam niedaleki.\nSłońce już weszło od dwóch godzin może,\nZwrócony twarzą patrzałem na morze.\nMistrz mówił: «Hamuj próżne niepokoje,\nJużeśmy przyszli w bezpieczną ostoję.\nTu zbierz, wytężaj wszystkie siły twoje."
    verse: true
    chunks:
      - pl: "Mój wódz ode mnie stał tam niedaleki."
        ru: "Мой вождь стоял там недалеко от меня."
      - pl: "\nSłońce już weszło od dwóch godzin może,"
        ru: "Солнце взошло уже, может быть, часа два назад,"
      - pl: "\nZwrócony twarzą patrzałem na morze."
        ru: "обратившись лицом, я смотрел на море."
      - pl: "\nMistrz mówił: «Hamuj próżne niepokoje,"
        ru: "Учитель сказал: «Сдержи напрасные тревоги,"
      - pl: "\nJużeśmy przyszli w bezpieczną ostoję."
        ru: "мы уже пришли в безопасное пристанище."
        note: "ostoja — пристанище"
      - pl: "\nTu zbierz, wytężaj wszystkie siły twoje."
        ru: "Здесь собери, напряги все свои силы."
    words: { "wódz": wodz, "Słońce": slonce, "Zwrócony": zwrocic, "morze": morze, "Mistrz": mistrz, "zbierz": zebrac }
  - clean: "Patrz, oto czyściec! wał, co go zamyka,\nW skale otwiera drzwi dla podróżnika.\nW chwili, gdy przedświt brzask dzienny spotyka,\nGdy w śnie na kwiatach twa dusza marzyła,\nPrzyszła niewiasta do mnie i mówiła:\n»Jestem Łucyja, pozwól mi wziąć jego,\nUlżę mu drogi, zaniosę sennego«."
    verse: true
    chunks:
      - pl: "Patrz, oto czyściec! wał, co go zamyka,"
        ru: "Смотри: вот Чистилище! Вал, что его замыкает,"
      - pl: "\nW skale otwiera drzwi dla podróżnika."
        ru: "открывает в скале дверь для путника."
      - pl: "\nW chwili, gdy przedświt brzask dzienny spotyka,"
        ru: "В тот миг, когда предрассветье встречает дневной свет,"
        note: "brzask — рассвет"
      - pl: "\nGdy w śnie na kwiatach twa dusza marzyła,"
        ru: "когда во сне на цветах твоя душа грезила,"
      - pl: "\nPrzyszła niewiasta do mnie i mówiła:"
        ru: "пришла ко мне жена и сказала:"
      - pl: "\n»Jestem Łucyja, pozwól mi wziąć jego,"
        ru: "„Я Лючия, позволь мне взять его,"
      - pl: "\nUlżę mu drogi, zaniosę sennego«."
        ru: "облегчу ему дорогу, понесу спящего“."
    words: { "zamyka": zamykac, "otwiera": otwierac, "kwiatach": kwiat, "marzyła": marzyc, "niewiasta": niewiasta, "Ulżę": ulzyc }
  - clean: "Sordello został wśród duchów gromady,\nOna szła wyżej, ja za nią w jej ślady.\nGdy dzień zaświtał, oto pod tym głazem\nZłożyła ciebie niebieska istota,\nPiękne jej oczy wskazały te wrota,\nOna i sen twój zniknęły zarazem»."
    verse: true
    chunks:
      - pl: "Sordello został wśród duchów gromady,"
        ru: "Сорделло остался среди толпы духов,"
      - pl: "\nOna szła wyżej, ja za nią w jej ślady."
        ru: "она шла выше, я за ней по её следам."
      - pl: "\nGdy dzień zaświtał, oto pod tym głazem"
        ru: "Когда день забрезжил, вот под этим камнем"
      - pl: "\nZłożyła ciebie niebieska istota,"
        ru: "положила тебя небесное существо,"
      - pl: "\nPiękne jej oczy wskazały te wrota,"
        ru: "её прекрасные глаза указали на эти ворота,"
      - pl: "\nOna i sen twój zniknęły zarazem»."
        ru: "она и твой сон исчезли разом»."
    words: { "duchów": duch, "Złożyła": zlozyc, "niebieska": niebieski, "istota": istota, "wskazały": wskazac, "wrota": wrota }
  - clean: "Jak człowiek walką znużony wątpienia,\nGdy widzi prawdę, strach w pokój zamienia,\nTak się zmieniłem; gdym ochłonął z trwogi,\nWódz mię prowadził na wyższe skał progi.\nMój czytelniku, zwróć uwagę wcześniej,\nNiech cię nie dziwi, że treść mojej pieśni\nPodnosząc, do niej dostrajam jej nutę."
    verse: true
    chunks:
      - pl: "Jak człowiek walką znużony wątpienia,"
        ru: "Как человек, утомлённый борьбой сомнений,"
      - pl: "\nGdy widzi prawdę, strach w pokój zamienia,"
        ru: "когда видит правду, меняет страх на покой,"
      - pl: "\nTak się zmieniłem; gdym ochłonął z trwogi,"
        ru: "так я изменился; когда я опомнился от страха,"
      - pl: "\nWódz mię prowadził na wyższe skał progi."
        ru: "вождь повёл меня на более высокие уступы скал."
      - pl: "\nMój czytelniku, zwróć uwagę wcześniej,"
        ru: "Мой читатель, обрати внимание заранее,"
      - pl: "\nNiech cię nie dziwi, że treść mojej pieśni"
        ru: "пусть тебя не удивляет, что, поднимая"
      - pl: "\nPodnosząc, do niej dostrajam jej nutę."
        ru: "содержание своей песни, я настраиваю к нему её лад."
        note: "dostrajać — подстраивать"
    words: { "zamienia": zamieniac, "skał": skala, "progi": prog, "dziwi": dziwic, "pieśni": piesn, "Podnosząc": podnosic }
  - clean: "Podszedłszy bliżej, ciekawością ginę,\nZrazu widziałem jak w murze szczelinę,\nBył to wprost otwór, drzwi w skale wykute:\nGdy mi wyraźniej odnosił wzrok wierny\nBliższe przedmioty, widziałem trzy stopnie,\nNad nimi siedział milczący odźwierny."
    verse: true
    chunks:
      - pl: "Podszedłszy bliżej, ciekawością ginę,"
        ru: "Подойдя ближе, я умираю от любопытства:"
      - pl: "\nZrazu widziałem jak w murze szczelinę,"
        ru: "сперва я видел будто трещину в стене,"
        note: "szczelina — трещина"
      - pl: "\nBył to wprost otwór, drzwi w skale wykute:"
        ru: "а это был прямо проём, дверь, высеченная в скале:"
      - pl: "\nGdy mi wyraźniej odnosił wzrok wierny"
        ru: "когда верный взгляд яснее донёс мне"
      - pl: "\nBliższe przedmioty, widziałem trzy stopnie,"
        ru: "ближние предметы, я увидел три ступени,"
      - pl: "\nNad nimi siedział milczący odźwierny."
        ru: "над ними сидел молчаливый привратник."
        note: "odźwierny — привратник"
    words: { "ciekawością": ciekawosc, "murze": mur, "otwór": otwor, "wzrok": wzrok, "wierny": wierny, "przedmioty": przedmiot }
  - clean: "Patrzeć mu w oczy nie miałem odwagi,\nA w jego ręku połyskał miecz nagi,\nOdbitym blaskiem wzrok raził okropnie.\nNiemy odźwierny przemówił nareszcie:\n«Stąd gdzie stoicie, mówcie, kto jesteście?»\nA mistrz: «Niewiasta, niebieska istota,\nNam powiedziała: idźcie, oto wrota!»"
    verse: true
    chunks:
      - pl: "Patrzeć mu w oczy nie miałem odwagi,"
        ru: "Смотреть ему в глаза у меня не было отваги,"
      - pl: "\nA w jego ręku połyskał miecz nagi,"
        ru: "а в его руке блестел обнажённый меч,"
      - pl: "\nOdbitym blaskiem wzrok raził okropnie."
        ru: "отражённым блеском страшно слепил взгляд."
      - pl: "\nNiemy odźwierny przemówił nareszcie:"
        ru: "Немой привратник наконец заговорил:"
      - pl: "\n«Stąd gdzie stoicie, mówcie, kto jesteście?»"
        ru: "«Оттуда, где стоите, скажите, кто вы?»"
      - pl: "\nA mistrz: «Niewiasta, niebieska istota,"
        ru: "А учитель: «Жена, небесное существо,"
      - pl: "\nNam powiedziała: idźcie, oto wrota!»"
        ru: "сказала нам: идите, вот ворота!»"
    words: { "odwagi": odwaga, "nagi": nagi, "Odbitym": odbic, "blaskiem": blask, "okropnie": okropnie, "przemówił": przemowic }
  - clean: "Odźwierny mówił łagodnymi słowy:\n«Oby krzepiła ona wasze kroki,\nIdźcie po stopniach tej mojej opoki!»\nSzliśmy przez stopień pierwszy marmurowy,\nBiały i gładki, patrząc prostopadle,\nW nim się przejrzałem cały jak w zwierciadle."
    verse: true
    chunks:
      - pl: "Odźwierny mówił łagodnymi słowy:"
        ru: "Привратник сказал кроткими словами:"
      - pl: "\n«Oby krzepiła ona wasze kroki,"
        ru: "«Да укрепит она ваши шаги,"
      - pl: "\nIdźcie po stopniach tej mojej opoki!»"
        ru: "идите по ступеням этой моей скалы!»"
      - pl: "\nSzliśmy przez stopień pierwszy marmurowy,"
        ru: "Мы прошли первую мраморную ступень,"
      - pl: "\nBiały i gładki, patrząc prostopadle,"
        ru: "белую и гладкую, глядя отвесно вниз,"
      - pl: "\nW nim się przejrzałem cały jak w zwierciadle."
        ru: "я весь отразился в ней, как в зеркале."
    words: { "łagodnymi": lagodny, "stopniach": stopien, "Biały": bialy, "gładki": gladki, "prostopadle": prostopadle, "przejrzałem": przejrzec }
  - clean: "Drugi był z głazu ciemniejszego kuty,\nJakby pożarem wzdłuż i w szerz rozkłuty.\nTrzeci był, zda się, z porfirowej bryły,\nJak krew czerwony, gdy wytryska z żyły.\nTen odźwiernemu służył za podnóże,\nSam zaś na progu siedział z dyjamentu."
    verse: true
    chunks:
      - pl: "Drugi był z głazu ciemniejszego kuty,"
        ru: "Вторая была высечена из более тёмного камня,"
      - pl: "\nJakby pożarem wzdłuż i w szerz rozkłuty."
        ru: "будто вдоль и поперёк растрескавшегося от пожара."
        note: "rozkłuty — расколотый"
      - pl: "\nTrzeci był, zda się, z porfirowej bryły,"
        ru: "Третья была, кажется, из порфировой глыбы,"
        note: "porfir — порфир"
      - pl: "\nJak krew czerwony, gdy wytryska z żyły."
        ru: "красная, как кровь, когда брызжет из жилы."
      - pl: "\nTen odźwiernemu służył za podnóże,"
        ru: "Она служила привратнику подножием,"
      - pl: "\nSam zaś na progu siedział z dyjamentu."
        ru: "сам же он сидел на пороге из алмаза."
    words: { "ciemniejszego": ciemny, "pożarem": pozar, "krew": krew, "czerwony": czerwony, "służył": sluzyc, "siedział": siedziec }
  - clean: "Promienny wieniec skroń jego okola,\nPrzez stopnie wiodła moja dobra wola.\nMistrz mówił: «Proś go, korzystaj z momentu,\nDrzwi te otworzyć pokora ci może.\nI do stóp świętych upadłem w pokorze.\nTrzy razy w piersi uderzywszy moje,\nMówiąc «Przez litość otwórz te podwoje!»"
