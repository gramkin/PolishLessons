      - pl: " trochę proszków, fiolka i zeszyt."
        ru: "несколько порошков, пузырёк и тетрадь."
        note: "proszek — порошок"
      - pl: " Tę szufladę błagam cię, zabierz ze sobą na Cavendish Square dokładnie w takim stanie, w jakim jest."
        ru: "Этот ящик, умоляю тебя, отвези с собой на Кавендиш-сквер в точности в том виде, в каком он есть."
    words: { "umysłu": umysl, "właściwą": wlasciwy, "szufladę": szuflada, "zawartości": zawartosc, "proszków": proszek, "błagam": blagac }
  - clean: "To pierwsza część przysługi; teraz druga. Jeśli wyruszysz natychmiast po otrzymaniu tego listu, wrócisz na długo przed północą; ale zostawiam ci taki zapas czasu, nie tylko z obawy przed jedną z tych przeszkód, których nie można ani uniknąć, ani przewidzieć, lecz także dlatego, że do tego, co pozostanie wtedy do zrobienia, lepsza jest godzina, gdy twoja służba śpi. O północy więc muszę cię prosić, żebyś był sam w swoim gabinecie lekarskim, żebyś własnoręcznie wpuścił do domu człowieka, który zgłosi się w moim imieniu, i oddał w jego ręce szufladę, którą przywieziesz z mojego gabinetu."
    en: "“That is the first part of the service: now for the second. You should be back, if you set out at once on the receipt of this, long before midnight; but I will leave you that amount of margin, not only in the fear of one of those obstacles that can neither be prevented nor foreseen, but because an hour when your servants are in bed is to be preferred for what will then remain to do. At midnight, then, I have to ask you to be alone in your consulting room, to admit with your own hand into the house a man who will present himself in my name, and to place in his hands the drawer that you will have brought with you from my cabinet."
    draft: true
    chunks:
      - pl: "To pierwsza część przysługi; teraz druga."
        ru: "Это первая часть услуги; теперь вторая."
      - pl: " Jeśli wyruszysz natychmiast po otrzymaniu tego listu, wrócisz na długo przed północą;"
        ru: "Если ты отправишься сразу по получении этого письма, ты вернёшься задолго до полуночи;"
      - pl: " ale zostawiam ci taki zapas czasu,"
        ru: "но я оставляю тебе такой запас времени"
      - pl: " nie tylko z obawy przed jedną z tych przeszkód, których nie można ani uniknąć, ani przewidzieć,"
        ru: "не только из страха перед одним из тех препятствий, которых нельзя ни избежать, ни предвидеть,"
        note: "przeszkoda — препятствие"
      - pl: " lecz także dlatego, że do tego, co pozostanie wtedy do zrobienia, lepsza jest godzina, gdy twoja służba śpi."
        ru: "но и потому, что для того, что останется сделать, лучше час, когда твои слуги уже спят."
      - pl: " O północy więc muszę cię prosić, żebyś był sam w swoim gabinecie lekarskim,"
        ru: "Итак, в полночь я должен просить тебя быть одному в твоём врачебном кабинете,"
      - pl: " żebyś własnoręcznie wpuścił do domu człowieka, który zgłosi się w moim imieniu,"
