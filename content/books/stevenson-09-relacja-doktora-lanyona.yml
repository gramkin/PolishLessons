  - clean: "P.S. Już zapieczętowałem ten list, gdy nowy strach ugodził mnie w duszę. Możliwe, że poczta mnie zawiedzie i list ten trafi w twoje ręce dopiero jutro rano. W takim razie, drogi Lanyonie, załatw moją sprawę, kiedy będzie ci najwygodniej w ciągu dnia; i jeszcze raz oczekuj mego posłańca o północy. Wtedy może już być za późno; a jeśli ta noc minie bez zdarzeń, będziesz wiedział, że widziałeś Henry'ego Jekylla po raz ostatni”."
    en: "“P.S.—I had already sealed this up when a fresh terror struck upon my soul. It is possible that the post-office may fail me, and this letter not come into your hands until to-morrow morning. In that case, dear Lanyon, do my errand when it shall be most convenient for you in the course of the day; and once more expect my messenger at midnight. It may then already be too late; and if that night passes without event, you will know that you have seen the last of Henry Jekyll.”"
    draft: true
    chunks:
      - pl: "P.S. Już zapieczętowałem ten list, gdy nowy strach ugodził mnie w duszę."
