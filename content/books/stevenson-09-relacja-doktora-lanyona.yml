paragraphs:
  - clean: "Dziewiątego stycznia, a więc cztery dni temu, otrzymałem wieczorną pocztą list polecony, zaadresowany ręką mego kolegi i dawnego szkolnego towarzysza, Henry'ego Jekylla. Bardzo mnie to zdziwiło; nie mieliśmy bowiem bynajmniej zwyczaju korespondować; widziałem się z nim, a nawet jadłem u niego obiad, poprzedniego wieczoru; i nie mogłem sobie wyobrazić niczego w naszych stosunkach, co usprawiedliwiałoby formalność listu poleconego. Treść jeszcze powiększyła moje zdumienie; bo oto jak brzmiał list:"
    en: "On the ninth of January, now four days ago, I received by the evening delivery a registered envelope, addressed in the hand of my colleague and old school companion, Henry Jekyll. I was a good deal surprised by this; for we were by no means in the habit of correspondence; I had seen the man, dined with him, indeed, the night before; and I could imagine nothing in our intercourse that should justify formality of registration. The contents increased my wonder; for this is how the letter ran:"
    draft: true
    chunks:
      - pl: "Dziewiątego stycznia, a więc cztery dni temu, otrzymałem wieczorną pocztą list polecony,"
        ru: "Девятого января, то есть четыре дня назад, я получил с вечерней почтой заказное письмо,"
        note: "list polecony — заказное письмо"
      - pl: " zaadresowany ręką mego kolegi i dawnego szkolnego towarzysza, Henry'ego Jekylla."
