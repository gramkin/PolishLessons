    words: { "cesarza": cesarz, "przyjazd": przyjazd, "szafę": szafa, "litera": litera, "zawartością": zawartosc, "szufladę": szuflada }
  - clean: "W skrajnym udręczeniu umysłu mam chorobliwy lęk, że źle cię pokieruję; ale nawet jeśli się mylę, poznasz właściwą szufladę po zawartości: trochę proszków, fiolka i zeszyt. Tę szufladę błagam cię, zabierz ze sobą na Cavendish Square dokładnie w takim stanie, w jakim jest."
    en: "In my extreme distress of mind, I have a morbid fear of misdirecting you; but even if I am in error, you may know the right drawer by its contents: some powders, a phial and a paper book. This drawer I beg of you to carry back with you to Cavendish Square exactly as it stands."
    draft: true
    chunks:
      - pl: "W skrajnym udręczeniu umysłu mam chorobliwy lęk, że źle cię pokieruję;"
        ru: "В крайнем душевном смятении я болезненно боюсь неверно тебя направить;"
        note: "udręczenie — мучение; pokierować — направить"
      - pl: " ale nawet jeśli się mylę, poznasz właściwą szufladę po zawartości:"
