  - clean: "— A teraz — rzekł — załatwmy resztę. Czy będzie pan rozsądny? Czy da się pan pokierować? Czy pozwoli mi pan wziąć tę menzurkę do ręki i wyjść z pańskiego domu bez dalszych rozmów? Czy też chciwość ciekawości ma nad panem zbyt wielką władzę? Niech się pan zastanowi, zanim odpowie, bo stanie się tak, jak pan zdecyduje. Jeśli pan tak zdecyduje, zostanie pan taki jak przedtem, ani bogatszy, ani mądrzejszy, chyba że poczucie przysługi oddanej człowiekowi w śmiertelnej udręce można uznać za rodzaj bogactwa duszy."
