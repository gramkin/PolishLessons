  - clean: "Chcę, żebyś odłożył na dziś wszystkie inne zajęcia… tak, nawet gdyby wezwano cię do łoża cesarza; żebyś wziął dorożkę, o ile twój powóz nie stoi akurat przed drzwiami; i z tym listem w ręku, do wglądu, pojechał prosto do mojego domu. Poole, mój kamerdyner, ma polecenia; zastaniesz go czekającego na twój przyjazd ze ślusarzem. Następnie trzeba wyłamać drzwi mojego gabinetu; a ty masz wejść sam; otworzyć oszkloną szafę (litera E) po lewej stronie, wyłamując zamek, jeśli będzie zamknięta; i wyciągnąć, z całą zawartością tak, jak jest, czwartą szufladę od góry albo (co na jedno wychodzi) trzecią od dołu."
    en: "“I want you to postpone all other engagements for to-night—ay, even if you were summoned to the bedside of an emperor; to take a cab, unless your carriage should be actually at the door; and with this letter in your hand for consultation, to drive straight to my house. Poole, my butler, has his orders; you will find him waiting your arrival with a locksmith. The door of my cabinet is then to be forced; and you are to go in alone; to open the glazed press (letter E) on the left hand, breaking the lock if it be shut; and to draw out, with all its contents as they stand, the fourth drawer from the top or (which is the same thing) the third from the bottom."
    draft: true
    chunks:
      - pl: "Chcę, żebyś odłożył na dziś wszystkie inne zajęcia…"
        ru: "Я хочу, чтобы ты отложил на сегодня все прочие дела…"
      - pl: " tak, nawet gdyby wezwano cię do łoża cesarza;"
