      - pl: " i oddał w jego ręce szufladę, którą przywieziesz z mojego gabinetu."
        ru: "и передать ему в руки ящик, который ты привезёшь из моего кабинета."
    words: { "wyruszysz": wyruszyc, "zapas": zapas, "przeszkód": przeszkoda, "przewidzieć": przewidziec, "szufladę": szuflada }
  - clean: "Wtedy odegrasz swoją rolę i w pełni zasłużysz na moją wdzięczność. Pięć minut później, jeśli będziesz nalegał na wyjaśnienie, zrozumiesz, że te ustalenia mają kapitalne znaczenie; i że zaniedbując którekolwiek z nich, choć muszą się wydawać fantastyczne, mógłbyś obciążyć sumienie moją śmiercią albo rozbiciem mego rozumu."
    en: "Then you will have played your part and earned my gratitude completely. Five minutes afterwards, if you insist upon an explanation, you will have understood that these arrangements are of capital importance; and that by the neglect of one of them, fantastic as they must appear, you might have charged your conscience with my death or the shipwreck of my reason."
    draft: true
    chunks:
      - pl: "Wtedy odegrasz swoją rolę i w pełni zasłużysz na moją wdzięczność."
        ru: "Тогда ты сыграешь свою роль и вполне заслужишь мою благодарность."
