  - clean: "Tego, co mi powiedział w ciągu następnej godziny, nie potrafię się zmusić przelać na papier. Widziałem, co widziałem, słyszałem, co słyszałem, i dusza moja zachorowała od tego; a jednak teraz, gdy ten widok zbladł mi w oczach, pytam sam siebie, czy w to wierzę, i nie umiem odpowiedzieć. Moje życie zostało wstrząśnięte do korzeni; sen mnie opuścił; najśmiertelniejszy strach siedzi przy mnie o każdej porze dnia i nocy; i czuję, że moje dni są policzone i że muszę umrzeć; a jednak umrę, nie dowierzając."
