        ru: "Пять минут спустя, если ты будешь настаивать на объяснении,"
        note: "nalegać — настаивать"
      - pl: " zrozumiesz, że te ustalenia mają kapitalne znaczenie;"
        ru: "ты поймёшь, что эти распоряжения имеют первостепенное значение;"
        note: "ustalenie — договорённость, распоряжение"
      - pl: " i że zaniedbując którekolwiek z nich, choć muszą się wydawać fantastyczne,"
        ru: "и что, пренебрёгши любым из них, как бы причудливо они ни выглядели,"
      - pl: " mógłbyś obciążyć sumienie moją śmiercią albo rozbiciem mego rozumu."
        ru: "ты мог бы отяготить свою совесть моей смертью или крушением моего рассудка."
        note: "obciążyć — отяготить; rozbicie — крушение"
    words: { "odegrasz": odegrac, "wdzięczność": wdziecznosc, "nalegał": nalegac, "fantastyczne": fantastyczny, "sumienie": sumienie, "rozumu": rozum }
  - clean: "Choć jestem pewien, że nie zlekceważysz tej prośby, serce mi zamiera i ręka drży na samą myśl o takiej możliwości. Pomyśl o mnie o tej godzinie, w obcym miejscu, zmagającym się z czarną rozpaczą, której żadna wyobraźnia nie zdoła przesadzić, a jednak dobrze świadomym, że jeśli tylko punktualnie mi usłużysz, moje kłopoty rozwieją się jak opowiedziana historia. Usłuż mi, mój drogi Lanyonie, i ocal"
    en: "“Confident as I am that you will not trifle with this appeal, my heart sinks and my hand trembles at the bare thought of such a possibility. Think of me at this hour, in a strange place, labouring under a blackness of distress that no fancy can exaggerate, and yet well aware that, if you will but punctually serve me, my troubles will roll away like a story that is told. Serve me, my dear Lanyon and save"
