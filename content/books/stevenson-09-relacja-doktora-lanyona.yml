  - clean: "Drogi Lanyonie! Jesteś jednym z moich najstarszych przyjaciół; i choć czasem różniliśmy się w kwestiach naukowych, nie pamiętam, przynajmniej z mojej strony, żadnego rozłamu w naszej przyjaźni. Nie było dnia, w którym, gdybyś mi powiedział: „Jekyllu, moje życie, mój honor, mój rozum zależą od ciebie”, nie poświęciłbym lewej ręki, by ci pomóc. Lanyonie, moje życie, mój honor, mój rozum są całkowicie w twoich rękach; jeśli zawiedziesz mnie dziś w nocy, jestem zgubiony. Mógłbyś przypuszczać po tym wstępie, że poproszę cię o coś niehonorowego. Osądź sam."
    en: "“Dear Lanyon,—You are one of my oldest friends; and although we may have differed at times on scientific questions, I cannot remember, at least on my side, any break in our affection. There was never a day when, if you had said to me, ‘Jekyll, my life, my honour, my reason, depend upon you,’ I would not have sacrificed my left hand to help you. Lanyon, my life, my honour, my reason, are all at your mercy; if you fail me to-night, I am lost. You might suppose, after this preface, that I am going to ask you for something dishonourable to grant. Judge for yourself."
    draft: true
    chunks:
      - pl: "Drogi Lanyonie! Jesteś jednym z moich najstarszych przyjaciół;"
        ru: "Дорогой Лэньон! Ты один из моих самых старых друзей;"
      - pl: " i choć czasem różniliśmy się w kwestiach naukowych,"
        ru: "и хотя мы порой расходились в научных вопросах,"
      - pl: " nie pamiętam, przynajmniej z mojej strony, żadnego rozłamu w naszej przyjaźni."
        ru: "я не помню, по крайней мере со своей стороны, никакого разлада в нашей привязанности."
        note: "rozłam — раскол, разлад"
      - pl: " Nie było dnia, w którym, gdybyś mi powiedział: „Jekyllu, moje życie, mój honor, mój rozum zależą od ciebie”,"
        ru: "Не было дня, когда, скажи ты мне: „Джекил, моя жизнь, моя честь, мой рассудок зависят от тебя“,"
      - pl: " nie poświęciłbym lewej ręki, by ci pomóc."
        ru: "я не пожертвовал бы левой рукой, чтобы тебе помочь."
        note: "poświęcić — пожертвовать"
      - pl: " Lanyonie, moje życie, mój honor, mój rozum są całkowicie w twoich rękach;"
        ru: "Лэньон, моя жизнь, моя честь, мой рассудок — всё в твоей власти;"
      - pl: " jeśli zawiedziesz mnie dziś w nocy, jestem zgubiony."
        ru: "если ты подведёшь меня сегодня ночью, я погиб."
        note: "zawieść kogoś — подвести кого-л.; zgubiony — погибший"
      - pl: " Mógłbyś przypuszczać po tym wstępie, że poproszę cię o coś niehonorowego."
        ru: "Ты мог бы подумать после такого вступления, что я попрошу тебя о чём-то бесчестном."
