        ru: "чтобы ты взял кеб, если только твой экипаж не стоит прямо у дверей;"
      - pl: " i z tym listem w ręku, do wglądu, pojechał prosto do mojego domu."
        ru: "и с этим письмом в руке, для справки, поехал прямо ко мне домой."
        note: "do wglądu — для ознакомления"
      - pl: " Poole, mój kamerdyner, ma polecenia; zastaniesz go czekającego na twój przyjazd ze ślusarzem."
        ru: "Пул, мой дворецкий, получил распоряжения; ты найдёшь его ожидающим твоего приезда со слесарем."
        note: "ślusarz — слесарь"
      - pl: " Następnie trzeba wyłamać drzwi mojego gabinetu;"
        ru: "Затем следует взломать дверь моего кабинета;"
      - pl: " a ty masz wejść sam;"
        ru: "а ты должен войти один;"
      - pl: " otworzyć oszkloną szafę (litera E) po lewej stronie, wyłamując zamek, jeśli będzie zamknięta;"
        ru: "открыть застеклённый шкаф (буква E) по левую руку, сломав замок, если он заперт;"
      - pl: " i wyciągnąć, z całą zawartością tak, jak jest,"
