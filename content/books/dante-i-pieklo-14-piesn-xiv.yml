# review
title: "Boska komedia. Piekło"
titleRu: "Божественная комедия. Ад"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-pieklo/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 14
chapterTitle: "Pieśń XIV"
chapterTitleRu: "Песнь XIV. Огненный песок"
level: B2
paragraphs:
  - clean: "(Krąg VII. Koło 3. Bluźniercy, lichwiarze, sodomici. Piasek rozpalony. Kapaneus. Starzec kreteński. Trzecia rzeka piekielna.)"
    chunks:
      - pl: "(Krąg VII. Koło 3. Bluźniercy, lichwiarze, sodomici. Piasek rozpalony. Kapaneus. Starzec kreteński. Trzecia rzeka piekielna.)"
        ru: "(Круг VII. Пояс 3. Богохульники, ростовщики, содомиты. Раскалённый песок. Капаней. Критский старец. Третья адская река.)"
        note: "rozpalony — раскалённый; kreteński — критский"
    words: { "Krąg": krag, "Koło": kolo, "Piasek": piasek, "Starzec": starzec, "rzeka": rzeka, "piekielna": piekielny }
  - clean: "Miłość rodzinnej skłoniła mnie strony,\nZebrać i oddać rozmiecione liście\nTemu, co chrypiał jękiem wysilony.\nI stamtąd nasze zwróciliśmy iście\nPod trzeci obwód, punkt, gdzie się odkrywa\nSprawiedliwości bożej moc straszliwa."
    verse: true
    chunks:
      - pl: "Miłość rodzinnej skłoniła mnie strony,"
        ru: "Любовь к родной стороне склонила меня"
        note: "skłonić — склонить"
      - pl: "\nZebrać i oddać rozmiecione liście"
        ru: "собрать и отдать разметанные листья"
        note: "rozmieciony — разметанный"
      - pl: "\nTemu, co chrypiał jękiem wysilony."
        ru: "тому, кто хрипел, обессиленный стоном."
        note: "chrypieć — хрипеть; wysilony — обессиленный"
      - pl: "\nI stamtąd nasze zwróciliśmy iście"
        ru: "И оттуда мы направились поистине"
        note: "iście — устар. «поистине»"
      - pl: "\nPod trzeci obwód, punkt, gdzie się odkrywa"
        ru: "к третьему поясу, месту, где открывается"
      - pl: "\nSprawiedliwości bożej moc straszliwa."
        ru: "страшная мощь Божьего правосудия."
    words: { "rodzinnej": rodzinny, "stamtąd": stamtad, "zwróciliśmy": zwrocic, "obwód": obwod, "Sprawiedliwości": sprawiedliwosc, "bożej": bozy }
  - clean: "Chcąc wiernie rzeczy opowiedzieć nowe,\nWeszliśmy, mówię, na błonia stepowe,\nBez żadnych roślin, puste i jałowe.\nStep ten opasan bolejącym lasem,\nJak ten las, fosy grodzi się opasem.\nTam krok wstrzymałem; jak martwego morza\nPowierzchnia piasku martwa i spalona;\nPo takim stopa deptała Katona."
    verse: true
    chunks:
      - pl: "Chcąc wiernie rzeczy opowiedzieć nowe,"
        ru: "Желая верно рассказать новые вещи,"
      - pl: "\nWeszliśmy, mówię, na błonia stepowe,"
        ru: "мы вступили, скажу, на степные равнины,"
        note: "błonia — равнина, луга"
      - pl: "\nBez żadnych roślin, puste i jałowe."
        ru: "без всяких растений, пустые и бесплодные."
        note: "jałowy — бесплодный"
      - pl: "\nStep ten opasan bolejącym lasem,"
        ru: "Эта степь опоясана скорбящим лесом,"
        note: "opasan — краткая форма: «опоясан»"
      - pl: "\nJak ten las, fosy grodzi się opasem."
        ru: "как этот лес огораживается кольцом рва."
        note: "opas — пояс, кольцо"
      - pl: "\nTam krok wstrzymałem; jak martwego morza"
        ru: "Там я остановил шаг; как мёртвого моря"
      - pl: "\nPowierzchnia piasku martwa i spalona;"
        ru: "поверхность, песок мёртвый и выжженный;"
      - pl: "\nPo takim stopa deptała Katona."
        ru: "по такому ступала нога Катона."
        note: "Катон Утический в Ливийской пустыне"
    words: { "roślin": roslina, "jałowe": jalowy, "lasem": las, "wstrzymałem": wstrzymac, "morza": morze, "stopa": stopa }
  - clean: "Jakże powinnaś być, o zemsto boża,\nPrzerażająca dla tego, kto czyta\nTo, co mojemu objawia się oku!\nWidziałem trzodę nagich dusz w natłoku,\nA wszystkie płaczą, lamenty zawodzą.\nSnadź według sądu kaźń ich rozmaita:\nJedni wznak leżą, drudzy jak nić zwita\nW kłąb się zwinęli członkami wszystkiemi,\nInni po stepie nieustannie chodzą."
    verse: true
    chunks:
      - pl: "Jakże powinnaś być, o zemsto boża,"
        ru: "Какой же ты должна быть, о месть Божья,"
        note: "zemsta — месть"
      - pl: "\nPrzerażająca dla tego, kto czyta"
        ru: "ужасающей для того, кто читает"
      - pl: "\nTo, co mojemu objawia się oku!"
        ru: "то, что открывается моему глазу!"
        note: "objawiać się — являться"
      - pl: "\nWidziałem trzodę nagich dusz w natłoku,"
        ru: "Я видел стадо нагих душ в толчее,"
        note: "natłok — давка, толчея"
      - pl: "\nA wszystkie płaczą, lamenty zawodzą."
        ru: "и все плачут, причитают жалобы."
        note: "lament — плач; zawodzić — причитать"
      - pl: "\nSnadź według sądu kaźń ich rozmaita:"
        ru: "Видно, по приговору их казнь различна:"
        note: "rozmaity — различный"
      - pl: "\nJedni wznak leżą, drudzy jak nić zwita"
        ru: "одни лежат навзничь, другие, как свитая нить,"
        note: "wznak — навзничь; zwity — свитый"
      - pl: "\nW kłąb się zwinęli członkami wszystkiemi,"
        ru: "свернулись в клубок всеми членами,"
        note: "kłąb — клубок; wszystkiemi — ныне wszystkimi"
      - pl: "\nInni po stepie nieustannie chodzą."
        ru: "иные непрестанно ходят по степи."
    words: { "Jakże": jakze, "zemsto": zemsta, "trzodę": trzoda, "nagich": nagi, "płaczą": plakac, "sądu": sad }
  - clean: "Ci najliczniejsi; leżących na ziemi\nByło niewielu, ale przez ich wargi\nNajwiększe żale jęczały i skargi.\nSzeroką kiścią dżdżył żar na pustkowie,\nJak śnieg bez wiatru w alpejskim parowie.\nJak Aleksander pod indyjskie słońce\nProwadząc lud swój, widział spadające\nOgnie na wojsko w piasku niegasnące,\nPo całym wojsku rozkazał z baczeniem\nDeptać nogami iskrę, gdy upadnie,\nBo jedna iskra da się zgasić snadnie;"
    verse: true
    chunks:
      - pl: "Ci najliczniejsi; leżących na ziemi"
        ru: "Этих больше всего; лежащих на земле"
      - pl: "\nByło niewielu, ale przez ich wargi"
        ru: "было немного, но сквозь их губы"
      - pl: "\nNajwiększe żale jęczały i skargi."
        ru: "стонали величайшие жалобы и сетования."
      - pl: "\nSzeroką kiścią dżdżył żar na pustkowie,"
        ru: "Широкими кистями сыпал жар на пустошь,"
        note: "kiść — кисть; dżdżyć — моросить, сыпать"
      - pl: "\nJak śnieg bez wiatru w alpejskim parowie."
        ru: "как снег без ветра в альпийском ущелье."
        note: "parów — ущелье, овраг"
      - pl: "\nJak Aleksander pod indyjskie słońce"
        ru: "Как Александр, под индийским солнцем"
      - pl: "\nProwadząc lud swój, widział spadające"
        ru: "ведя своё войско, видел, как падали"
      - pl: "\nOgnie na wojsko w piasku niegasnące,"
        ru: "огни на войско, не гаснущие в песке,"
      - pl: "\nPo całym wojsku rozkazał z baczeniem"
        ru: "и по всему войску приказал с осторожностью"
        note: "z baczeniem — осмотрительно"
      - pl: "\nDeptać nogami iskrę, gdy upadnie,"
        ru: "топтать ногами искру, когда упадёт,"
      - pl: "\nBo jedna iskra da się zgasić snadnie;"
        ru: "ибо одну искру легко погасить;"
        note: "snadnie — устар. «легко»"
    words: { "wargi": warga, "żale": zal, "skargi": skarga, "Szeroką": szeroki, "śnieg": snieg, "zgasić": zgasic }
  - clean: "Tak spadał ogień wieczny, a płomieniem\nZapalał piasek jak proch pod krzemieniem.\nPłomienia piasek w lot chwytał się suchy,\nDręczyć boleścią podwojoną duchy;\nIch nieszczęśliwe w ciągłym ruchu ręce\nI w nieustannym jak wachlarz powiewie,\nDo ich ciał lgnące strząsały zarzewie."
    verse: true
    chunks:
      - pl: "Tak spadał ogień wieczny, a płomieniem"
        ru: "так падал вечный огонь, а пламенем"
      - pl: "\nZapalał piasek jak proch pod krzemieniem."
        ru: "зажигал песок, как порох под кремнём."
        note: "proch — порох; krzemień — кремень"
      - pl: "\nPłomienia piasek w lot chwytał się suchy,"
        ru: "Сухой песок на лету хватался за пламя,"
        note: "w lot — на лету"
      - pl: "\nDręczyć boleścią podwojoną duchy;"
        ru: "чтобы мучить духов двойной болью;"
        note: "podwojony — удвоенный"
      - pl: "\nIch nieszczęśliwe w ciągłym ruchu ręce"
        ru: "их несчастные руки в непрестанном движении"
      - pl: "\nI w nieustannym jak wachlarz powiewie,"
        ru: "и в непрерывном, как веер, взмахе"
        note: "wachlarz — веер"
      - pl: "\nDo ich ciał lgnące strząsały zarzewie."
        ru: "стряхивали угли, что льнули к их телам."
        note: "lgnąć — льнуть; strząsać — стряхивать"
    words: { "wieczny": wieczny, "płomieniem": plomien, "proch": proch, "suchy": suchy, "nieszczęśliwe": nieszczesliwy, "ciągłym": ciagly }
  - clean: "«Mistrzu,» mówiłem, «coś wszystkie przeszkody\nUsunął, prócz tej, jaką potępieńce\nStawili hardo w progu Disa bramy:\nKto ten cień, powiedz, olbrzymiej urody,\nCo leżąc w piasku tak dziko spoziera,\nZda się, że jemu ogień nie doskwiera?"
    verse: true
    chunks:
      - pl: "«Mistrzu,» mówiłem, «coś wszystkie przeszkody"
        ru: "«Учитель, — сказал я, — ты, что все преграды"
      - pl: "\nUsunął, prócz tej, jaką potępieńce"
        ru: "устранил, кроме той, что осуждённые"
      - pl: "\nStawili hardo w progu Disa bramy:"
        ru: "дерзко поставили на пороге врат Дита:"
        note: "stawić — поставить"
      - pl: "\nKto ten cień, powiedz, olbrzymiej urody,"
        ru: "скажи, кто эта тень исполинского вида,"
        note: "uroda — облик, вид"
      - pl: "\nCo leżąc w piasku tak dziko spoziera,"
        ru: "что, лёжа в песке, так дико озирается,"
        note: "spozierać — поглядывать"
      - pl: "\nZda się, że jemu ogień nie doskwiera?"
        ru: "кажется, что ему огонь не досаждает?"
        note: "doskwierać — досаждать"
    words: { "przeszkody": przeszkoda, "Stawili": stawic, "progu": prog, "olbrzymiej": olbrzymi, "urody": uroda, "doskwiera": doskwierac }
  - clean: "Czy hardy własnej urąga się męce?»\nA cień spostrzegłszy, że o nim rozmowa\nToczy się z mistrzem, zakrzyknął w te słowa:\n«Jak byłem żywy, jam zmarły ten samy!\nGdyby sam Jowisz, gdy gniew go zapala,\nChoć raz zmordował swojego kowala,\nCo jemu ukuł strzałę piorunową,\nPod której ostrzem jam legł na skonanie;\nGdyby był czarnych robotników Etny\nWszystkich zmordował, stojąc nad ich głową,\nKrzycząc: »Dopomóż mi, dobry Wulkanie!«\nWprzód nim pod Flegrą zdobył triumf świetny;"
    verse: true
    chunks:
      - pl: "Czy hardy własnej urąga się męce?»"
        ru: "Неужели надменный глумится над собственной мукой?»"
        note: "urągać się — глумиться"
      - pl: "\nA cień spostrzegłszy, że o nim rozmowa"
        ru: "А тень, заметив, что о ней разговор"
      - pl: "\nToczy się z mistrzem, zakrzyknął w te słowa:"
        ru: "ведётся с учителем, закричала такими словами:"
      - pl: "\n«Jak byłem żywy, jam zmarły ten samy!"
        ru: "«Каким я был живым, таков я и мёртвый!"
        note: "samy — устар. «самый, тот же»"
      - pl: "\nGdyby sam Jowisz, gdy gniew go zapala,"
        ru: "Если бы сам Юпитер, когда гнев его зажигает,"
      - pl: "\nChoć raz zmordował swojego kowala,"
        ru: "хоть раз загонял своего кузнеца,"
        note: "zmordować — замучить, загнать; kowal — кузнец"
      - pl: "\nCo jemu ukuł strzałę piorunową,"
        ru: "что выковал ему громовую стрелу,"
        note: "ukuć — выковать; piorunowy — громовой"
      - pl: "\nPod której ostrzem jam legł na skonanie;"
        ru: "под чьим остриём я лёг насмерть;"
        note: "na skonanie — насмерть"
      - pl: "\nGdyby był czarnych robotników Etny"
        ru: "если бы он всех чёрных работников Этны"
        note: "киклопов"
      - pl: "\nWszystkich zmordował, stojąc nad ich głową,"
        ru: "загнал, стоя над их головой,"
      - pl: "\nKrzycząc: »Dopomóż mi, dobry Wulkanie!«"
        ru: "крича: „Помоги мне, добрый Вулкан!“ —"
      - pl: "\nWprzód nim pod Flegrą zdobył triumf świetny;"
        ru: "как прежде, при Флегре, одержал блестящую победу;"
        note: "Flegra — Флегры, место битвы богов с гигантами"
    words: { "spostrzegłszy": spostrzec, "Toczy": toczyc, "strzałę": strzala, "ostrzem": ostrze, "robotników": robotnik, "Dopomóż": dopomoc }
  - clean: "I gdyby wszystkie we mnie utkwił strzały,\nJeszcze z swej zemsty nie miałby dość chwały».\nA mistrz doń mówił z gniewem i zapałem,\nTak mówiącego nigdy nie słyszałem:\n«Kapaneusie! Czyliż twojej dumie\nTwa kara granic położyć nie umie?"
    verse: true
    chunks:
      - pl: "I gdyby wszystkie we mnie utkwił strzały,"
        ru: "и если бы все стрелы вонзил в меня,"
      - pl: "\nJeszcze z swej zemsty nie miałby dość chwały»."
        ru: "то и тогда от своей мести не имел бы довольно славы»."
      - pl: "\nA mistrz doń mówił z gniewem i zapałem,"
        ru: "А учитель сказал ему с гневом и жаром,"
      - pl: "\nTak mówiącego nigdy nie słyszałem:"
        ru: "таким говорящим я его никогда не слышал:"
      - pl: "\n«Kapaneusie! Czyliż twojej dumie"
        ru: "«Капаней! Неужели твоей гордыне"
        note: "czyliż — неужели"
      - pl: "\nTwa kara granic położyć nie umie?"
        ru: "твоя кара не умеет положить предела?"
    words: { "chwały": chwala, "mistrz": mistrz, "gniewem": gniew, "dumie": duma, "granic": granica, "położyć": polozyc }
  - clean: "Żadna nie może równać się męczarnia\nZ taką wściekłością, jaka cię ogarnia».\nA potem do mnie twarzą obrócony,\nSłodkimi usty przemówił najczulej:\n«On był z tych siedmiu szturmujących króli\nStubramne Teby; pychą zaślepiony,\nPogardził Bogiem, tak wieść o nim głosi,\nI wątpię teraz, czy go o co prosi."
    verse: true
    chunks:
      - pl: "Żadna nie może równać się męczarnia"
        ru: "Никакая мука не может сравниться"
      - pl: "\nZ taką wściekłością, jaka cię ogarnia»."
        ru: "с такой яростью, что тебя охватывает»."
        note: "wściekłość — ярость"
      - pl: "\nA potem do mnie twarzą obrócony,"
        ru: "А потом, обратив ко мне лицо,"
      - pl: "\nSłodkimi usty przemówił najczulej:"
        ru: "сладкими устами заговорил нежнейше:"
        note: "usty — старое твор. мн. «устами»; najczulej — нежнее всего"
      - pl: "\n«On był z tych siedmiu szturmujących króli"
        ru: "«Он был из тех семи царей, что штурмовали"
        note: "króli — устар. род. мн., ныне królów"
      - pl: "\nStubramne Teby; pychą zaślepiony,"
        ru: "стовратные Фивы; ослеплённый гордыней,"
        note: "stubramny — стовратный; zaślepiony — ослеплённый"
      - pl: "\nPogardził Bogiem, tak wieść o nim głosi,"
        ru: "он презрел Бога, так гласит о нём молва,"
        note: "pogardzić — презреть"
      - pl: "\nI wątpię teraz, czy go o co prosi."
        ru: "и я сомневаюсь теперь, просит ли он Его о чём-нибудь."
    words: { "obrócony": obrocic, "Słodkimi": slodki, "przemówił": przemowic, "króli": krol, "wieść": wiesc, "wątpię": watpic }
  - clean: "Lecz męka dumy, jak mówiłem jemu,\nBodaj największą karą jest dumnemu.\nIdź za mną, tylko strzeż się, abyś czasem\nGorącym piaskiem nie obraził nogi,\nPrzeto ostrożnie idź tuż poza lasem».\nMilcząc, przyszliśmy, ja i wódz mój drogi,\nNad brzeg krynicy, co z lasu wynika;\nRażąca tego czerwoność strumyka\nJeszcze mi dzisiaj włos na głowie jeży."
    verse: true
    chunks:
      - pl: "Lecz męka dumy, jak mówiłem jemu,"
        ru: "Но мука гордыни, как я ему говорил,"
      - pl: "\nBodaj największą karą jest dumnemu."
        ru: "пожалуй, величайшая кара для гордого."
        note: "bodaj — пожалуй"
      - pl: "\nIdź za mną, tylko strzeż się, abyś czasem"
        ru: "Иди за мной, только берегись, как бы ненароком"
        note: "czasem — ненароком"
      - pl: "\nGorącym piaskiem nie obraził nogi,"
        ru: "горячим песком не обжечь ногу,"
      - pl: "\nPrzeto ostrożnie idź tuż poza lasem»."
        ru: "поэтому осторожно иди у самого леса»."
      - pl: "\nMilcząc, przyszliśmy, ja i wódz mój drogi,"
        ru: "Молча мы пришли, я и мой дорогой вождь,"
      - pl: "\nNad brzeg krynicy, co z lasu wynika;"
        ru: "к берегу ручья, что вытекает из леса;"
      - pl: "\nRażąca tego czerwoność strumyka"
        ru: "режущая глаз краснота этого ручейка"
        note: "rażący — режущий глаз; czerwoność — краснота"
      - pl: "\nJeszcze mi dzisiaj włos na głowie jeży."
        ru: "и сегодня ещё поднимает мне волосы на голове."
        note: "jeżyć — ерошить, поднимать дыбом"
    words: { "strzeż": strzec, "obraził": obrazic, "Milcząc": milczec, "wódz": wodz, "brzeg": brzeg, "wynika": wynikac }
