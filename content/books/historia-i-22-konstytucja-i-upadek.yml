chapter: 22
chapterTitle: "Konstytucja i upadek"
chapterTitleRu: "Конституция и падение"
level: B2
paragraphs:
  - clean: "Jesienią 1788 roku w Warszawie zebrał się sejm, który przeszedł do historii jako Sejm Wielki albo Czteroletni, bo obradował aż do 1792 roku. Rosja była zajęta wojną z Turcją i Szwecją, a jej wojska opuściły Polskę. Posłowie postanowili wykorzystać tę chwilę. Sejm zawiązał się w konfederację, co oznaczało, że uchwały podejmowano większością głosów, a liberum veto nie obowiązywało. Na jego czele stanęli dwaj marszałkowie: koronny Stanisław Małachowski i litewski Kazimierz Nestor Sapieha."
    draft: true
    chunks:
      - pl: "Jesienią 1788 roku w Warszawie zebrał się sejm, który przeszedł do historii jako Sejm Wielki albo Czteroletni, bo obradował aż do 1792 roku."
        ru: "Осенью 1788 года в Варшаве собрался сейм, вошедший в историю как Великий, или Четырёхлетний, потому что заседал вплоть до 1792 года."
      - pl: " Rosja była zajęta wojną z Turcją i Szwecją, a jej wojska opuściły Polskę."
        ru: "Россия была занята войной с Турцией и Швецией, и её войска покинули Польшу."
      - pl: " Posłowie postanowili wykorzystać tę chwilę."
        ru: "Послы решили воспользоваться этим моментом."
      - pl: " Sejm zawiązał się w konfederację, co oznaczało, że uchwały podejmowano większością głosów, a liberum veto nie obowiązywało."
        ru: "Сейм был объявлен конфедерационным, что означало, что постановления принимались большинством голосов, а liberum veto не действовало."
      - pl: " Na jego czele stanęli dwaj marszałkowie: koronny Stanisław Małachowski i litewski Kazimierz Nestor Sapieha."
        ru: "Во главе его встали два маршала: коронный Станислав Малаховский и литовский Казимир Нестор Сапега."
        note: "marszałek — маршал (председатель сейма)"
    words: { "Jesienią": jesien, "wojska": wojsko, "podejmowano": podejmowac, "czele": czolo }
  - clean: "Atmosfera była niezwykła. Po raz pierwszy od dziesięcioleci sejm naprawdę obradował i podejmował decyzje. Już w pierwszych tygodniach uchwalono powiększenie armii do stu tysięcy żołnierzy, choć na tak dużą armię nigdy nie starczyło pieniędzy. Zniesiono Radę Nieustającą, narzuconą przez Rosję. Szlachta i duchowieństwo po raz pierwszy zgodzili się płacić stały podatek, nazwany ofiarą dziesiątego grosza. W 1790 roku Polska zawarła sojusz z Prusami, które obiecywały pomoc w razie ataku Rosji. Wielu patriotów wierzyło, że Prusy są szczerym sojusznikiem, choć Prusy myślały przede wszystkim o tym, jak zdobyć Gdańsk i Toruń."
    draft: true
    chunks:
      - pl: "Atmosfera była niezwykła."
        ru: "Атмосфера была необыкновенной."
      - pl: " Po raz pierwszy od dziesięcioleci sejm naprawdę obradował i podejmował decyzje."
        ru: "Впервые за десятилетия сейм действительно заседал и принимал решения."
      - pl: " Już w pierwszych tygodniach uchwalono powiększenie armii do stu tysięcy żołnierzy, choć na tak dużą armię nigdy nie starczyło pieniędzy."
        ru: "Уже в первые недели было решено увеличить армию до ста тысяч солдат, хотя на столь большую армию денег так и не хватило."
      - pl: " Zniesiono Radę Nieustającą, narzuconą przez Rosję."
        ru: "Был упразднён Постоянный совет, навязанный Россией."
        note: "znieść — упразднить"
      - pl: " Szlachta i duchowieństwo po raz pierwszy zgodzili się płacić stały podatek, nazwany ofiarą dziesiątego grosza."
        ru: "Шляхта и духовенство впервые согласились платить постоянный налог, названный «пожертвованием десятого гроша»."
        note: "ofiara — здесь «пожертвование»"
      - pl: " W 1790 roku Polska zawarła sojusz z Prusami, które obiecywały pomoc w razie ataku Rosji."
        ru: "В 1790 году Польша заключила союз с Пруссией, которая обещала помощь в случае нападения России."
      - pl: " Wielu patriotów wierzyło, że Prusy są szczerym sojusznikiem, choć Prusy myślały przede wszystkim o tym, jak zdobyć Gdańsk i Toruń."
        ru: "Многие патриоты верили, что Пруссия — искренний союзник, хотя Пруссия думала прежде всего о том, как заполучить Гданьск и Торунь."
    words: { "Atmosfera": atmosfera, "niezwykła": niezwykly, "podejmował": podejmowac, "starczyło": starczyc, "podatek": podatek, "grosza": grosz, "zawarła": zawrzec, "sojusz": sojusz, "sojusznikiem": sojusznik }
  - clean: "Sejm był areną gorących sporów między stronnictwem patriotycznym a konserwatystami, którzy bronili złotej wolności. Wśród patriotów wyróżniali się Ignacy Potocki, magnat i wielki mówca, oraz ksiądz Hugo Kołłątaj, energiczny reformator, który zgromadził wokół siebie grupę publicystów, nazywaną Kuźnicą. Ksiądz Stanisław Staszic, syn mieszczanina, wydał broszurę „Przestrogi dla Polski”, w której ostrzegał, że bez reform kraj zginie. Ulice Warszawy zalewały broszury, wiersze i karykatury, a ludzie spierali się o politykę w kawiarniach i na rynku. W teatrze grano komedię Juliana Ursyna Niemcewicza „Powrót posła”, która wyśmiewała przeciwników reform i miała ogromne powodzenie."
    draft: true
    chunks:
      - pl: "Sejm był areną gorących sporów między stronnictwem patriotycznym a konserwatystami, którzy bronili złotej wolności."
        ru: "Сейм был ареной горячих споров между патриотической партией и консерваторами, защищавшими золотую вольность."
      - pl: " Wśród patriotów wyróżniali się Ignacy Potocki, magnat i wielki mówca, oraz ksiądz Hugo Kołłątaj, energiczny reformator, który zgromadził wokół siebie grupę publicystów, nazywaną Kuźnicą."
        ru: "Среди патриотов выделялись Игнацы Потоцкий, магнат и великий оратор, и ксёндз Гуго Коллонтай, энергичный реформатор, собравший вокруг себя группу публицистов, называемую «Кузницей»."
        note: "mówca — оратор; publicysta — публицист; kuźnica — кузница"
      - pl: " Ksiądz Stanisław Staszic, syn mieszczanina, wydał broszurę „Przestrogi dla Polski”, w której ostrzegał, że bez reform kraj zginie."
        ru: "Ксёндз Станислав Сташиц, сын мещанина, издал брошюру «Предостережения для Польши», в которой предупреждал, что без реформ страна погибнет."
        note: "przestroga — предостережение"
      - pl: " Ulice Warszawy zalewały broszury, wiersze i karykatury, a ludzie spierali się o politykę w kawiarniach i na rynku."
        ru: "Улицы Варшавы наводняли брошюры, стихи и карикатуры, а люди спорили о политике в кофейнях и на рынке."
        note: "karykatura — карикатура"
      - pl: " W teatrze grano komedię Juliana Ursyna Niemcewicza „Powrót posła”, która wyśmiewała przeciwników reform i miała ogromne powodzenie."
        ru: "В театре шла комедия Юлиана Урсына Немцевича «Возвращение посла», высмеивавшая противников реформ и имевшая огромный успех."
        note: "powodzenie — успех"
    words: { "ksiądz": ksiadz, "ostrzegał": ostrzegac, "wiersze": wiersz, "politykę": polityka, "kawiarniach": kawiarnia, "rynku": rynek, "teatrze": teatr, "przeciwników": przeciwnik }
  - clean: "Głos podnieśli też mieszczanie. W grudniu 1789 roku przedstawiciele ponad stu czterdziestu miast przeszli ulicami Warszawy na zamek, ubrani na czarno, żeby wręczyć królowi memoriał z żądaniami. Pochód nazwano czarną procesją, a jego przywódcą był prezydent Warszawy Jan Dekert. Część szlachty była oburzona i straszyła rewolucją w stylu francuskim, bo właśnie w tym czasie we Francji zdobyto Bastylię. Polscy mieszczanie nie chcieli jednak rewolucji, tylko praw."
    draft: true
    chunks:
      - pl: "Głos podnieśli też mieszczanie."
        ru: "Голос подняли и горожане."
      - pl: " W grudniu 1789 roku przedstawiciele ponad stu czterdziestu miast przeszli ulicami Warszawy na zamek, ubrani na czarno, żeby wręczyć królowi memoriał z żądaniami."
        ru: "В декабре 1789 года представители более ста сорока городов прошли по улицам Варшавы к замку, одетые в чёрное, чтобы вручить королю петицию с требованиями."
        note: "memoriał — петиция, памятная записка"
      - pl: " Pochód nazwano czarną procesją, a jego przywódcą był prezydent Warszawy Jan Dekert."
        ru: "Шествие назвали «чёрной процессией», а его предводителем был президент Варшавы Ян Декерт."
        note: "pochód — шествие; prezydent miasta — президент (глава) города"
      - pl: " Część szlachty była oburzona i straszyła rewolucją w stylu francuskim, bo właśnie w tym czasie we Francji zdobyto Bastylię."
        ru: "Часть шляхты была возмущена и пугала революцией на французский манер, ведь как раз в это время во Франции взяли Бастилию."
      - pl: " Polscy mieszczanie nie chcieli jednak rewolucji, tylko praw."
        ru: "Но польские горожане хотели не революции, а прав."
    words: { "grudniu": grudzien, "przedstawiciele": przedstawiciel, "czterdziestu": czterdziesci, "zamek": zamek, "wręczyć": wreczyc, "przywódcą": przywodca, "straszyła": straszyc, "rewolucją": rewolucja, "francuskim": francuski, "Polscy": polski, "rewolucji": rewolucja }
  - clean: "W kwietniu 1791 roku sejm uchwalił prawo o miastach. Mieszczanie otrzymali gwarancję wolności osobistej, prawo kupowania ziemi, zajmowania urzędów i stopni oficerskich, a także prawo wysyłania przedstawicieli na sejm. Ułatwiono im także uzyskanie szlachectwa. Wielu szlachciców, na znak solidarności, zapisywało się demonstracyjnie do miejskich ksiąg obywatelskich. Była to wielka zmiana w państwie, w którym przez trzysta lat jedynymi obywatelami byli szlachcice."
    draft: true
    chunks:
      - pl: "W kwietniu 1791 roku sejm uchwalił prawo o miastach."
        ru: "В апреле 1791 года сейм принял закон о городах."
      - pl: " Mieszczanie otrzymali gwarancję wolności osobistej, prawo kupowania ziemi, zajmowania urzędów i stopni oficerskich, a także prawo wysyłania przedstawicieli na sejm."
        ru: "Горожане получили гарантию личной свободы, право покупать землю, занимать должности и офицерские чины, а также право посылать представителей на сейм."
        note: "stopień — чин, звание"
      - pl: " Ułatwiono im także uzyskanie szlachectwa."
        ru: "Им облегчили также получение шляхетства."
      - pl: " Wielu szlachciców, na znak solidarności, zapisywało się demonstracyjnie do miejskich ksiąg obywatelskich."
        ru: "Многие шляхтичи в знак солидарности демонстративно записывались в городские книги граждан."
        note: "solidarność — солидарность"
      - pl: " Była to wielka zmiana w państwie, w którym przez trzysta lat jedynymi obywatelami byli szlachcice."
        ru: "Это было большое изменение в государстве, где триста лет единственными гражданами были шляхтичи."
    words: { "kwietniu": kwiecien, "gwarancję": gwarancja, "urzędów": urzad, "przedstawicieli": przedstawiciel, "Ułatwiono": ulatwic, "miejskich": miejski, "ksiąg": ksiega, "obywatelami": obywatel }
  - clean: "Najważniejsza reforma przygotowywana była w tajemnicy. Król, Ignacy Potocki, Kołłątaj i Małachowski spotykali się wieczorami i pisali projekt nowej ustawy zasadniczej. Wiedzieli, że konserwatyści, wspierani przez Rosję, zrobią wszystko, żeby ją zablokować. Wybrali więc dzień, w którym wielu przeciwników nie wróciło jeszcze do Warszawy po świętach wielkanocnych. Zwolennikom reformy wysłano za to zaproszenia, żeby przybyli na czas."
    draft: true
    chunks:
      - pl: "Najważniejsza reforma przygotowywana była w tajemnicy."
        ru: "Важнейшая реформа готовилась втайне."
      - pl: " Król, Ignacy Potocki, Kołłątaj i Małachowski spotykali się wieczorami i pisali projekt nowej ustawy zasadniczej."
        ru: "Король, Игнацы Потоцкий, Коллонтай и Малаховский встречались по вечерам и писали проект нового основного закона."
        note: "ustawa zasadnicza — основной закон, конституция"
      - pl: " Wiedzieli, że konserwatyści, wspierani przez Rosję, zrobią wszystko, żeby ją zablokować."
        ru: "Они знали, что консерваторы, поддерживаемые Россией, сделают всё, чтобы её заблокировать."
      - pl: " Wybrali więc dzień, w którym wielu przeciwników nie wróciło jeszcze do Warszawy po świętach wielkanocnych."
        ru: "Поэтому они выбрали день, когда многие противники ещё не вернулись в Варшаву после пасхальных праздников."
      - pl: " Zwolennikom reformy wysłano za to zaproszenia, żeby przybyli na czas."
        ru: "А сторонникам реформы разослали приглашения, чтобы они прибыли вовремя."
    words: { "przeciwników": przeciwnik, "przygotowywana": przygotowywac, "ustawy": ustawa, "zasadniczej": zasadniczy, "wspierani": wspierac, "zablokować": zablokowac }
  - clean: "Rano 3 maja 1791 roku Zamek Królewski otoczył tłum warszawiaków, a w sali senatorskiej zebrali się posłowie i senatorowie. Odczytano raporty dyplomatyczne o planach nowego rozbioru, żeby przekonać wahających się. Przeciwnicy protestowali, a jeden z nich, według relacji, rzucił się na ziemię przed tronem, wzorem Rejtana. Po kilku godzinach burzliwych obrad król podniósł rękę i złożył przysięgę na nową konstytucję. Większość posłów i tłum na ulicach przyjęli ją okrzykami: „Wiwat król, wiwat naród, wiwat wszystkie stany!” Potem wszyscy przeszli do pobliskiego kościoła świętego Jana, gdzie odśpiewano dziękczynny hymn."
    draft: true
    chunks:
      - pl: "Rano 3 maja 1791 roku Zamek Królewski otoczył tłum warszawiaków, a w sali senatorskiej zebrali się posłowie i senatorowie."
        ru: "Утром 3 мая 1791 года Королевский замок окружила толпа варшавян, а в Сенаторском зале собрались послы и сенаторы."
      - pl: " Odczytano raporty dyplomatyczne o planach nowego rozbioru, żeby przekonać wahających się."
        ru: "Зачитали дипломатические донесения о планах нового раздела, чтобы убедить колеблющихся."
      - pl: " Przeciwnicy protestowali, a jeden z nich, według relacji, rzucił się na ziemię przed tronem, wzorem Rejtana."
        ru: "Противники протестовали, а один из них, по рассказам, бросился на пол перед троном по примеру Рейтана."
      - pl: " Po kilku godzinach burzliwych obrad król podniósł rękę i złożył przysięgę na nową konstytucję."
        ru: "После нескольких часов бурных заседаний король поднял руку и принёс присягу новой конституции."
      - pl: " Większość posłów i tłum na ulicach przyjęli ją okrzykami: „Wiwat król, wiwat naród, wiwat wszystkie stany!”"
        ru: "Большинство послов и толпа на улицах встретили её возгласами: «Да здравствует король, да здравствует народ, да здравствуют все сословия!»"
        note: "wiwat — да здравствует"
      - pl: " Potem wszyscy przeszli do pobliskiego kościoła świętego Jana, gdzie odśpiewano dziękczynny hymn."
        ru: "Затем все прошли в соседний костёл святого Иоанна, где был исполнен благодарственный гимн."
    words: { "maja": maj, "otoczył": otoczyc, "Odczytano": odczytac, "wahających": wahac, "Przeciwnicy": przeciwnik, "relacji": relacja, "tronem": tron, "wzorem": wzor, "obrad": obrada, "przysięgę": przysiega, "naród": narod }
  - clean: "Ustawa Rządowa z dnia 3 maja 1791 roku była pierwszą nowoczesną konstytucją w Europie i drugą na świecie, po konstytucji Stanów Zjednoczonych. Francja uchwaliła swoją kilka miesięcy później. Konstytucja znosiła liberum veto, wolną elekcję i prawo do zawiązywania konfederacji, czyli wszystko, co od dawna paraliżowało państwo. Tron miał być dziedziczny, a po śmierci Stanisława Augusta miał przejść na saską dynastię Wettinów. Władzę podzielono na trzy części: ustawodawczą, którą sprawował sejm, wykonawczą, którą sprawował król z rządem nazwanym Strażą Praw, i sądowniczą."
    draft: true
    chunks:
      - pl: "Ustawa Rządowa z dnia 3 maja 1791 roku była pierwszą nowoczesną konstytucją w Europie i drugą na świecie, po konstytucji Stanów Zjednoczonych."
        ru: "Правительственный закон от 3 мая 1791 года стал первой современной конституцией в Европе и второй в мире после конституции Соединённых Штатов."
      - pl: " Francja uchwaliła swoją kilka miesięcy później."
        ru: "Франция приняла свою несколько месяцев спустя."
      - pl: " Konstytucja znosiła liberum veto, wolną elekcję i prawo do zawiązywania konfederacji, czyli wszystko, co od dawna paraliżowało państwo."
        ru: "Конституция отменяла liberum veto, вольную элекцию и право создавать конфедерации, то есть всё, что давно парализовало государство."
        note: "paraliżować — парализовать"
      - pl: " Tron miał być dziedziczny, a po śmierci Stanisława Augusta miał przejść na saską dynastię Wettinów."
        ru: "Престол становился наследственным и после смерти Станислава Августа должен был перейти к саксонской династии Веттинов."
      - pl: " Władzę podzielono na trzy części: ustawodawczą, którą sprawował sejm, wykonawczą, którą sprawował król z rządem nazwanym Strażą Praw, i sądowniczą."
        ru: "Власть разделили на три части: законодательную, которую осуществлял сейм, исполнительную, которую осуществлял король с правительством, названным Стражей законов, и судебную."
