  - clean: "Państwo zniknęło, ale naród pozostał. Polacy żyli dalej pod trzema zaborami, mówili swoim językiem, modlili się w swoich kościołach i pamiętali o dawnej wielkości. Pokolenie wychowane przez Komisję Edukacji Narodowej, które walczyło w obronie konstytucji i w powstaniu Kościuszki, nie zamierzało się poddać. Już dwa lata po trzecim rozbiorze we Włoszech powstały polskie legiony, a ich żołnierze śpiewali pieśń, która zaczynała się od słów: „Jeszcze Polska nie umarła, kiedy my żyjemy”. Dziś, w trochę zmienionej formie, jest to hymn narodowy Polski. Od tej pieśni zaczyna się drugi tom naszej opowieści."
