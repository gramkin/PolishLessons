  - clean: "Dlaczego Rzeczpospolita upadła? Historycy dają na to pytanie różne odpowiedzi. Jedni podkreślają winę samych Polaków: egoizm magnatów, liberum veto, słabość władzy centralnej, brak armii i pieniędzy, ucisk chłopów. Inni zwracają uwagę, że Rzeczpospolita została zniszczona właśnie wtedy, kiedy zaczęła się reformować, przez trzech potężnych sąsiadów, którzy nie chcieli dopuścić do jej odrodzenia. Obie odpowiedzi są prawdziwe. Słabość pozwoliła na pierwszy rozbiór, a próba wyjścia ze słabości przyspieszyła dwa następne."
