  - clean: "W połowie XVIII wieku coraz więcej ludzi rozumiało, że Rzeczpospolita potrzebuje głębokich reform. Na ich czele stanął potężny ród Czartoryskich, którego zwolenników nazywano po prostu Familią. Czartoryscy chcieli wzmocnić władzę centralną, zreformować skarb i wojsko i ograniczyć liberum veto. Do realizacji tego planu potrzebowali jednak króla, który byłby po ich stronie, i poparcia potężnego sąsiada. Kiedy w 1763 roku zmarł August III, wydawało się, że ich czas nadszedł. Kandydatem Familii był młody, wykształcony siostrzeniec Czartoryskich, Stanisław August Poniatowski, a jego protektorką była caryca Katarzyna II."
