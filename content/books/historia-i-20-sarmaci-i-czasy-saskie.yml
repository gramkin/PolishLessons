  - clean: "Innym znakiem nowych czasów była Biblioteka Załuskich. Dwaj bracia, biskupi Józef Andrzej i Andrzej Stanisław Załuscy, przez całe życie kupowali książki w całej Europie. W 1747 roku otworzyli w Warszawie bibliotekę dla wszystkich, którzy chcieli z niej korzystać, jedną z pierwszych publicznych bibliotek w Europie. Pod koniec stulecia liczyła około czterystu tysięcy tomów i należała do największych na świecie. Po upadku Rzeczypospolitej w 1795 roku wojska rosyjskie wywiozły cały księgozbiór do Petersburga, gdzie stał się podstawą Cesarskiej Biblioteki Publicznej. Tylko część książek wróciła do Polski po 1921 roku, a znaczna ich część spłonęła w Warszawie w czasie II wojny światowej."
