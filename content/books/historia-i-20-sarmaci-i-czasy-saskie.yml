  - clean: "Sarmatę łatwo było rozpoznać po stroju. Nosił długi żupan, a na nim kontusz, czyli wierzchnie okrycie z rozciętymi rękawami, które zarzucano na plecy. Przepasywał się pięknym pasem z jedwabiu, najlepiej sprowadzonym ze Wschodu albo utkanym w słynnej manufakturze w Słucku. U boku miał karabelę, zakrzywioną szablę o ozdobnej rękojeści. Głowę golił wysoko, zostawiając tylko czuprynę na czubku, i nosił sumiaste wąsy. Strój ten był wzorowany na modzie tureckiej i perskiej, czyli na modzie wroga, z którym szlachta tak długo walczyła. Zachodnią modę francuską i niemiecką Sarmaci uważali za śmieszną i niemęską."
    draft: true
    chunks:
      - pl: "Sarmatę łatwo było rozpoznać po stroju."
        ru: "Сармата легко было узнать по одежде."
      - pl: " Nosił długi żupan, a na nim kontusz, czyli wierzchnie okrycie z rozciętymi rękawami, które zarzucano na plecy."
        ru: "Он носил длинный жупан, а поверх него кунтуш — верхнюю одежду с разрезными рукавами, которые закидывали за спину."
        note: "żupan — жупан; kontusz — кунтуш; wierzchni — верхний"
      - pl: " Przepasywał się pięknym pasem z jedwabiu, najlepiej sprowadzonym ze Wschodu albo utkanym w słynnej manufakturze w Słucku."
        ru: "Он подпоясывался красивым шёлковым поясом, лучше всего привезённым с Востока или вытканным на знаменитой мануфактуре в Слуцке."
        note: "przepasać się — подпоясаться; jedwab — шёлк; utkać — выткать"
      - pl: " U boku miał karabelę, zakrzywioną szablę o ozdobnej rękojeści."
        ru: "На боку у него висела карабела — изогнутая сабля с украшенной рукоятью."
        note: "zakrzywiony — изогнутый; rękojeść — рукоять"
      - pl: " Głowę golił wysoko, zostawiając tylko czuprynę na czubku, i nosił sumiaste wąsy."
        ru: "Голову он брил высоко, оставляя лишь чуб на макушке, и носил пышные усы."
        note: "czupryna — чуб; czubek — макушка; sumiasty — пышный, длинный (об усах)"
      - pl: " Strój ten był wzorowany na modzie tureckiej i perskiej, czyli na modzie wroga, z którym szlachta tak długo walczyła."
        ru: "Этот наряд был создан по образцу турецкой и персидской моды, то есть моды того самого врага, с которым шляхта так долго воевала."
      - pl: " Zachodnią modę francuską i niemiecką Sarmaci uważali za śmieszną i niemęską."
        ru: "Западную, французскую и немецкую моду сарматы считали смешной и немужественной."
    words: { "rozpoznać": rozpoznac, "stroju": stroj, "rękawami": rekaw, "pasem": pas, "słynnej": slynny, "wysoko": wysoko, "czubku": czubek, "Strój": stroj, "modzie": moda, "Zachodnią": zachodni, "modę": moda, "francuską": francuski, "niemiecką": niemiecki }
  - clean: "Szczególnym zjawiskiem sarmackiej kultury były portrety trumienne. Malowano je na blasze w kształcie sześciokąta i przybijano do trumny w czasie wystawnego pogrzebu. Zmarły patrzył z nich na żałobników, jakby żegnał się z nimi osobiście. Takich portretów nie znano nigdzie indziej w Europie. Pogrzeby magnatów trwały czasem kilka dni, z procesjami, mowami, ucztami i dramatycznym wjazdem rycerza, który w kościele spadał z konia na znak śmierci zmarłego. Szlachta lubiła teatralność i przepych, zarówno w życiu, jak i w śmierci."
    draft: true
    chunks:
      - pl: "Szczególnym zjawiskiem sarmackiej kultury były portrety trumienne."
        ru: "Особым явлением сарматской культуры были гробовые портреты."
        note: "zjawisko — явление; trumienny — гробовой"
      - pl: " Malowano je na blasze w kształcie sześciokąta i przybijano do trumny w czasie wystawnego pogrzebu."
        ru: "Их писали на жести в форме шестиугольника и прибивали к гробу во время пышных похорон."
        note: "blacha — жесть, листовой металл; sześciokąt — шестиугольник; przybijać — прибивать"
      - pl: " Zmarły patrzył z nich na żałobników, jakby żegnał się z nimi osobiście."
        ru: "Покойный смотрел с них на скорбящих, словно лично с ними прощался."
        note: "żałobnik — участник похорон"
      - pl: " Takich portretów nie znano nigdzie indziej w Europie."
        ru: "Таких портретов не знали больше нигде в Европе."
      - pl: " Pogrzeby magnatów trwały czasem kilka dni, z procesjami, mowami, ucztami i dramatycznym wjazdem rycerza, który w kościele spadał z konia na znak śmierci zmarłego."
        ru: "Похороны магнатов длились иногда несколько дней, с процессиями, речами, пирами и драматическим въездом рыцаря, который в храме падал с коня в знак смерти покойного."
        note: "procesja — процессия"
      - pl: " Szlachta lubiła teatralność i przepych, zarówno w życiu, jak i w śmierci."
        ru: "Шляхта любила театральность и роскошь — как в жизни, так и в смерти."
        note: "przepych — роскошь, пышность"
    words: { "Szczególnym": szczegolny, "kultury": kultura, "portrety": portret, "Malowano": malowac, "kształcie": ksztalt, "trumny": trumna, "pogrzebu": pogrzeb, "portretów": portret, "indziej": indziej, "Pogrzeby": pogrzeb, "rycerza": rycerz, "zarówno": zarowno }
  - clean: "Sarmata był gorliwym katolikiem. Wierzył, że Rzeczpospolita jest przedmurzem chrześcijaństwa, czyli twierdzą, która broni Europy przed Turkami, Tatarami i schizmatykami. Pielgrzymował do Częstochowy, fundował kościoły i klasztory, a w testamencie zapisywał pieniądze na msze za swoją duszę. Był gościnny, hojny, odważny i przywiązany do tradycji. Miał jednak także wady: był często zarozumiały, nieufny wobec obcych, niechętny wszelkim nowościom i przekonany, że Polska nie musi się niczego uczyć od innych. Słynne powiedzenie „Polska nierządem stoi” oznaczało, że słabość władzy jest gwarancją wolności, a Rzeczpospolita przetrwa dzięki opiece Bożej, nawet bez silnego rządu i armii."
    draft: true
    chunks:
      - pl: "Sarmata był gorliwym katolikiem."
        ru: "Сармат был ревностным католиком."
      - pl: " Wierzył, że Rzeczpospolita jest przedmurzem chrześcijaństwa, czyli twierdzą, która broni Europy przed Turkami, Tatarami i schizmatykami."
        ru: "Он верил, что Речь Посполитая — оплот христианства, то есть крепость, защищающая Европу от турок, татар и схизматиков."
        note: "przedmurze — оплот, передовая стена"
      - pl: " Pielgrzymował do Częstochowy, fundował kościoły i klasztory, a w testamencie zapisywał pieniądze na msze za swoją duszę."
        ru: "Он совершал паломничества в Ченстохову, строил на свои средства костёлы и монастыри, а в завещании отписывал деньги на мессы за упокой своей души."
        note: "fundować — строить на свои средства"
      - pl: " Był gościnny, hojny, odważny i przywiązany do tradycji."
        ru: "Он был гостеприимен, щедр, смел и привязан к традициям."
      - pl: " Miał jednak także wady: był często zarozumiały, nieufny wobec obcych, niechętny wszelkim nowościom i przekonany, że Polska nie musi się niczego uczyć od innych."
        ru: "Но были у него и недостатки: он часто был заносчив, недоверчив к чужим, враждебен всяким новшествам и убеждён, что Польше незачем ничему учиться у других."
        note: "zarozumiały — заносчивый; nieufny — недоверчивый"
      - pl: " Słynne powiedzenie „Polska nierządem stoi” oznaczało, że słabość władzy jest gwarancją wolności, a Rzeczpospolita przetrwa dzięki opiece Bożej, nawet bez silnego rządu i armii."
        ru: "Знаменитое выражение «Польша держится безвластием» означало, что слабость власти — гарантия свободы, а Речь Посполитая устоит благодаря Божьему покровительству даже без сильного правительства и армии."
        note: "nierząd — безвластие, беспорядок"
    words: { "klasztory": klasztor, "testamencie": testament, "hojny": hojny, "odważny": odwazny, "przywiązany": przywiazac, "tradycji": tradycja, "wady": wada, "nowościom": nowosc, "Słynne": slynny, "słabość": slabosc, "gwarancją": gwarancja }
  - clean: "Najbardziej zgubnym przejawem tej postawy było liberum veto. Od dawna przyjmowano, że uchwały sejmu powinny być podejmowane jednomyślnie, bo żaden szlachcic nie mógł być zmuszony do czegoś, na co się nie zgodził. Dawniej spory rozwiązywano jednak w drodze długich dyskusji i kompromisów. W 1652 roku poseł z Upity na Litwie, Władysław Siciński, jako pierwszy zerwał sejm swoim sprzeciwem i wyjechał z Warszawy, zanim można było go przekonać. Sejm musiał się rozejść, a wszystkie uchwały, które podjął wcześniej, straciły ważność. Precedens został ustanowiony."
    draft: true
    chunks:
      - pl: "Najbardziej zgubnym przejawem tej postawy było liberum veto."
        ru: "Самым губительным проявлением этой позиции было liberum veto."
        note: "zgubny — губительный; przejaw — проявление"
      - pl: " Od dawna przyjmowano, że uchwały sejmu powinny być podejmowane jednomyślnie, bo żaden szlachcic nie mógł być zmuszony do czegoś, na co się nie zgodził."
        ru: "Давно было принято, что постановления сейма должны приниматься единогласно, потому что ни одного шляхтича нельзя было принудить к тому, на что он не согласился."
        note: "jednomyślnie — единогласно"
      - pl: " Dawniej spory rozwiązywano jednak w drodze długich dyskusji i kompromisów."
        ru: "Прежде, однако, споры разрешали путём долгих обсуждений и компромиссов."
      - pl: " W 1652 roku poseł z Upity na Litwie, Władysław Siciński, jako pierwszy zerwał sejm swoim sprzeciwem i wyjechał z Warszawy, zanim można było go przekonać."
        ru: "В 1652 году посол из Упиты в Литве, Владислав Сициньский, первым сорвал сейм своим протестом и уехал из Варшавы, прежде чем его успели переубедить."
      - pl: " Sejm musiał się rozejść, a wszystkie uchwały, które podjął wcześniej, straciły ważność."
        ru: "Сейму пришлось разойтись, а все постановления, принятые им ранее, утратили силу."
        note: "ważność — сила, действительность"
      - pl: " Precedens został ustanowiony."
        ru: "Прецедент был создан."
        note: "precedens — прецедент"
    words: { "postawy": postawa, "przyjmowano": przyjmowac, "podejmowane": podejmowac, "Dawniej": dawno, "dyskusji": dyskusja, "sprzeciwem": sprzeciw, "rozejść": rozejsc }
  - clean: "Od tej chwili jeden poseł, krzycząc „Nie pozwalam!”, mógł unieważnić pracę całego sejmu. Szlachta uważała liberum veto za źrenicę wolności, czyli najcenniejszy skarb, którego trzeba strzec jak oka w głowie. W praktyce było ono narzędziem w rękach magnatów i obcych dworów, które przekupywały posłów, żeby zrywali sejmy, gdy uchwały były im nie na rękę. W pierwszej połowie XVIII wieku zrywano większość sejmów. Za panowania Augusta III, przez prawie trzydzieści lat, nie udało się przeprowadzić do końca prawie żadnego sejmu. Państwo nie mogło uchwalić nowych podatków, powiększyć armii ani przeprowadzić żadnych reform. Rzeczpospolita stawała się bezbronna wobec sąsiadów, którzy w tym samym czasie budowali silne państwa absolutne z wielkimi armiami."
    draft: true
    chunks:
      - pl: "Od tej chwili jeden poseł, krzycząc „Nie pozwalam!”, mógł unieważnić pracę całego sejmu."
        ru: "С этого момента один посол, крикнув «Не позволяю!», мог свести на нет работу всего сейма."
      - pl: " Szlachta uważała liberum veto za źrenicę wolności, czyli najcenniejszy skarb, którego trzeba strzec jak oka w głowie."
        ru: "Шляхта считала liberum veto зеницей вольности, то есть величайшим сокровищем, которое надо беречь как зеницу ока."
        note: "źrenica — зрачок, зеница; strzec — беречь"
      - pl: " W praktyce było ono narzędziem w rękach magnatów i obcych dworów, które przekupywały posłów, żeby zrywali sejmy, gdy uchwały były im nie na rękę."
        ru: "На практике оно было орудием в руках магнатов и иностранных дворов, которые подкупали послов, чтобы те срывали сеймы, когда постановления были им невыгодны."
        note: "przekupywać — подкупать; nie na rękę — невыгодно"
      - pl: " W pierwszej połowie XVIII wieku zrywano większość sejmów."
        ru: "В первой половине XVIII века срывалось большинство сеймов."
      - pl: " Za panowania Augusta III, przez prawie trzydzieści lat, nie udało się przeprowadzić do końca prawie żadnego sejmu."
        ru: "В правление Августа III, почти тридцать лет, почти ни один сейм не удалось довести до конца."
      - pl: " Państwo nie mogło uchwalić nowych podatków, powiększyć armii ani przeprowadzić żadnych reform."
        ru: "Государство не могло принять новых налогов, увеличить армию или провести какие-либо реформы."
      - pl: " Rzeczpospolita stawała się bezbronna wobec sąsiadów, którzy w tym samym czasie budowali silne państwa absolutne z wielkimi armiami."
        ru: "Речь Посполитая становилась беззащитной перед соседями, которые в то же время строили сильные абсолютистские государства с большими армиями."
        note: "bezbronny — беззащитный"
    words: { "najcenniejszy": cenny, "strzec": strzec, "praktyce": praktyka, "narzędziem": narzedzie, "dworów": dwor, "trzydzieści": trzydziesci, "podatków": podatek, "bezbronna": bezbronny, "budowali": budowac, "absolutne": absolutny }
  - clean: "Prawdziwymi panami kraju stali się magnaci. Kilka rodów, takich jak Radziwiłłowie, Potoccy, Sapiehowie, Czartoryscy czy Lubomirscy, posiadało ogromne majątki, setki wsi, dziesiątki miast i własne wojska. Ich dwory przypominały dwory królewskie, z orkiestrami, teatrami, bibliotekami i tłumami służby. Utrzymywali też szlachtę biedną, która żyła z ich łaski i głosowała na sejmikach tak, jak sobie tego życzyli. Biedny szlachcic, który nie miał ani ziemi, ani pieniędzy, był formalnie równy magnatowi, ale w praktyce był jego klientem. Mówiono o takich ludziach, że „szlachcic na zagrodzie” stał się „szlachcicem przy pańskim stole”."
    draft: true
    chunks:
      - pl: "Prawdziwymi panami kraju stali się magnaci."
        ru: "Настоящими хозяевами страны стали магнаты."
      - pl: " Kilka rodów, takich jak Radziwiłłowie, Potoccy, Sapiehowie, Czartoryscy czy Lubomirscy, posiadało ogromne majątki, setki wsi, dziesiątki miast i własne wojska."
        ru: "Несколько родов — такие как Радзивиллы, Потоцкие, Сапеги, Чарторыйские или Любомирские — владели огромными имениями, сотнями деревень, десятками городов и собственными войсками."
      - pl: " Ich dwory przypominały dwory królewskie, z orkiestrami, teatrami, bibliotekami i tłumami służby."
        ru: "Их дворы напоминали королевские, с оркестрами, театрами, библиотеками и толпами слуг."
        note: "służba — прислуга"
      - pl: " Utrzymywali też szlachtę biedną, która żyła z ich łaski i głosowała na sejmikach tak, jak sobie tego życzyli."
        ru: "Они содержали и бедную шляхту, которая жила их милостью и голосовала на сеймиках так, как им было угодно."
