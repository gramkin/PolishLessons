level: B2
paragraphs:
  - clean: "W XVII wieku polska szlachta wytworzyła własną, bardzo charakterystyczną kulturę, którą nazywamy sarmatyzmem. Jej podstawą był mit o pochodzeniu. Szlachta wierzyła, że wywodzi się od starożytnych Sarmatów, dzielnego ludu wojowników, który kiedyś zamieszkiwał stepy nad Morzem Czarnym. Chłopi i mieszczanie mieli według tej teorii zupełnie inne, gorsze pochodzenie. Mit uzasadniał więc podział społeczeństwa: szlachta była osobnym narodem, stworzonym do wolności i rządzenia. Sarmatyzm był też dumą z ustroju Rzeczypospolitej, który szlachta uważała za najdoskonalszy na świecie."
    draft: true
    chunks:
      - pl: "W XVII wieku polska szlachta wytworzyła własną, bardzo charakterystyczną kulturę, którą nazywamy sarmatyzmem."
        ru: "В XVII веке польская шляхта создала собственную, очень своеобразную культуру, которую мы называем сарматизмом."
        note: "wytworzyć — создать, выработать"
      - pl: " Jej podstawą był mit o pochodzeniu."
        ru: "Её основой был миф о происхождении."
      - pl: " Szlachta wierzyła, że wywodzi się od starożytnych Sarmatów, dzielnego ludu wojowników, który kiedyś zamieszkiwał stepy nad Morzem Czarnym."
        ru: "Шляхта верила, что происходит от древних сарматов, отважного народа воинов, когда-то населявшего степи у Чёрного моря."
      - pl: " Chłopi i mieszczanie mieli według tej teorii zupełnie inne, gorsze pochodzenie."
        ru: "Крестьяне и горожане, согласно этой теории, имели совсем иное, худшее происхождение."
      - pl: " Mit uzasadniał więc podział społeczeństwa: szlachta była osobnym narodem, stworzonym do wolności i rządzenia."
        ru: "Таким образом, миф обосновывал разделение общества: шляхта была особым народом, созданным для свободы и власти."
        note: "uzasadniać — обосновывать"
      - pl: " Sarmatyzm był też dumą z ustroju Rzeczypospolitej, który szlachta uważała za najdoskonalszy na świecie."
        ru: "Сарматизм был и гордостью за строй Речи Посполитой, который шляхта считала самым совершенным в мире."
