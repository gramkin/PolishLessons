chapter: 10
chapterTitle: "Pieśń X"
chapterTitleRu: "Песнь X. Солнце мудрецов"
level: B2
paragraphs:
  - clean: "(4. Na słońcu. Święci poznania tworzą dwa wieńce świateł. Teologowie: Tomasz, Albert, Lombardus, Salomon, Boecjusz, Beda, Izydor i inni.)"
    chunks:
      - pl: "(4. Na słońcu. Święci poznania tworzą dwa wieńce świateł. Teologowie: Tomasz, Albert, Lombardus, Salomon, Boecjusz, Beda, Izydor i inni.)"
        ru: "(4. На Солнце. Святые знания образуют два венца светил. Богословы: Фома, Альберт, Ломбардец, Соломон, Боэций, Беда, Исидор и другие.)"
    words: { "słońcu": slonce, "Święci": swiety, "poznania": poznac, "tworzą": tworzyc, "inni": inny }
  - clean: "Niewysłowiona a pierwsza potęga\nZ miłością w syna swojego patrząca,\nJaka z nich razem wiekuiście dysze,\nTakim porządkiem świat stworzony sprzęga,\nGdzie tylko wzrok nasz i nasz umysł sięga,\nŻe podziwiając takie dzieło boże,\nCzłowiek je wielbi i korzy się w pysze."
    verse: true
    chunks:
      - pl: "Niewysłowiona a pierwsza potęga"
        ru: "Невыразимая и первая мощь,"
        note: "Отец"
      - pl: "\nZ miłością w syna swojego patrząca,"
        ru: "с любовью глядящая на своего сына,"
      - pl: "\nJaka z nich razem wiekuiście dysze,"
        ru: "какую вместе с ними вечно дышит,"
        note: "Святой Дух"
      - pl: "\nTakim porządkiem świat stworzony sprzęga,"
        ru: "таким порядком сплетает сотворённый мир,"
      - pl: "\nGdzie tylko wzrok nasz i nasz umysł sięga,"
        ru: "где только достигает наш взгляд и наш ум,"
      - pl: "\nŻe podziwiając takie dzieło boże,"
        ru: "что, дивясь такому Божьему делу,"
      - pl: "\nCzłowiek je wielbi i korzy się w pysze."
        ru: "человек славит его и смиряется в гордыне."
        note: "korzyć się — смиряться"
    words: { "potęga": potega, "wzrok": wzrok, "umysł": umysl, "sięga": siegac, "podziwiając": podziwiac, "dzieło": dzielo }
  - clean: "Wznieś, czytelniku, ze mną wzrok zdziwiony\nKu wyższym sferom, a spojrzyj od strony,\nGdzie prąd przeciwnych ruchów się potrąca:\nByś sztuce tego mistrza się dziwował,\nKtóry ją w sobie tak sam ulubował,\nŻe od niej oka oderwać nie może."
    verse: true
    chunks:
      - pl: "Wznieś, czytelniku, ze mną wzrok zdziwiony"
        ru: "Подними, читатель, со мной удивлённый взгляд"
      - pl: "\nKu wyższym sferom, a spojrzyj od strony,"
        ru: "к высшим сферам и взгляни с той стороны,"
      - pl: "\nGdzie prąd przeciwnych ruchów się potrąca:"
        ru: "где сталкивается течение противоположных движений:"
        note: "точка равноденствия"
      - pl: "\nByś sztuce tego mistrza się dziwował,"
        ru: "чтобы ты дивился искусству того мастера,"
      - pl: "\nKtóry ją w sobie tak sam ulubował,"
        ru: "что так сам в себе его возлюбил,"
      - pl: "\nŻe od niej oka oderwać nie może."
        ru: "что не может оторвать от него глаза."
    words: { "Wznieś": wzniesc, "wyższym": wysoki, "prąd": prad, "przeciwnych": przeciwny, "sztuce": sztuka, "mistrza": mistrz }
  - clean: "Patrz, krąg ukośny jak stamtąd wylata,\nTocząc wzywane przez wszechświat planety,\nBy gwoli światu szły do swojej mety.\nGdyby ich droga nie tak była kosa,\nWpływ by niejeden straciły niebiosa,\nByłaby ziemia martwa, lodowata:\nGdyby tor skośny koła zodyjaku\nMniej albo więcej zboczył z swego szlaku,\nMógłby wyrodzić zaburzenie świata."
    verse: true
    chunks:
      - pl: "Patrz, krąg ukośny jak stamtąd wylata,"
        ru: "Смотри, как оттуда вылетает косой круг,"
        note: "эклиптика"
      - pl: "\nTocząc wzywane przez wszechświat planety,"
        ru: "катя планеты, призываемые вселенной,"
      - pl: "\nBy gwoli światu szły do swojej mety."
        ru: "чтобы ради мира они шли к своей цели."
      - pl: "\nGdyby ich droga nie tak była kosa,"
        ru: "Если бы их путь не был так кос,"
      - pl: "\nWpływ by niejeden straciły niebiosa,"
        ru: "небеса потеряли бы не одно влияние,"
      - pl: "\nByłaby ziemia martwa, lodowata:"
        ru: "земля была бы мёртвой, ледяной:"
      - pl: "\nGdyby tor skośny koła zodyjaku"
        ru: "если бы косой путь круга зодиака"
      - pl: "\nMniej albo więcej zboczył z swego szlaku,"
        ru: "больше или меньше уклонился от своего пути,"
      - pl: "\nMógłby wyrodzić zaburzenie świata."
        ru: "он мог бы породить возмущение мира."
    words: { "krąg": krag, "Tocząc": toczyc, "mety": meta, "niebiosa": niebiosa, "szlaku": szlak, "zaburzenie": zaburzenie }
  - clean: "Teraz na ławie twej siedź, czytelniku,\nJeżeli duch twój lubować się zechce\nW dziełach porządku i piękna bez liku,\nKtórych przedsmakiem twe łaknienie łechcę.\nStawię przed tobą pełną wina czaszę,\nSam gaś pragnienie, ja ci nie ugaszę:\nBo teraz przedmiot mojego pisania\nWszystkie me siły i duch mój pochłania."
    verse: true
    chunks:
      - pl: "Teraz na ławie twej siedź, czytelniku,"
        ru: "Теперь сиди на своей скамье, читатель,"
      - pl: "\nJeżeli duch twój lubować się zechce"
        ru: "если твой дух захочет наслаждаться"
      - pl: "\nW dziełach porządku i piękna bez liku,"
        ru: "делами порядка и красоты без счёта,"
      - pl: "\nKtórych przedsmakiem twe łaknienie łechcę."
        ru: "предвкушением которых я щекочу твой голод."
      - pl: "\nStawię przed tobą pełną wina czaszę,"
        ru: "Ставлю перед тобой чашу, полную вина,"
      - pl: "\nSam gaś pragnienie, ja ci nie ugaszę:"
        ru: "сам утоляй жажду, я тебе не утолю:"
      - pl: "\nBo teraz przedmiot mojego pisania"
        ru: "ибо теперь предмет моего писания"
      - pl: "\nWszystkie me siły i duch mój pochłania."
        ru: "поглощает все мои силы и мой дух."
    words: { "ławie": lawa, "łechcę": lechtac, "Stawię": stawic, "pragnienie": pragnienie, "przedmiot": przedmiot, "pochłania": pochlaniac }
  - clean: "Ten wielkorządca natury, co mierzy\nCzas swoim światłem, krążył z zodyjakiem,\nTam gdzie wóz godzin co najchyżej bieży.\nJak nie spostrzega człowiek, jakim szlakiem\nMyśli przychodzą, szybkie ducha gońce,\nTak nie postrzegłem, jak wstąpiłem w słońce."
    verse: true
    chunks:
      - pl: "Ten wielkorządca natury, co mierzy"
        ru: "Этот великий наместник природы, что меряет"
        note: "wielkorządca — великий правитель; солнце"
      - pl: "\nCzas swoim światłem, krążył z zodyjakiem,"
        ru: "время своим светом, кружил с зодиаком"
      - pl: "\nTam gdzie wóz godzin co najchyżej bieży."
        ru: "там, где колесница часов бежит быстрее всего."
      - pl: "\nJak nie spostrzega człowiek, jakim szlakiem"
        ru: "Как человек не замечает, каким путём"
      - pl: "\nMyśli przychodzą, szybkie ducha gońce,"
        ru: "приходят мысли, быстрые гонцы духа,"
      - pl: "\nTak nie postrzegłem, jak wstąpiłem w słońce."
        ru: "так я не заметил, как вступил в солнце."
    words: { "natury": natura, "mierzy": mierzyc, "krążył": krazyc, "przychodzą": przychodzic, "ducha": duch, "wstąpiłem": wstapic }
  - clean: "A Beatrycze, której postęp w czasie\nZ dobrego w lepsze wymierzyć nie da się,\nOna, co blask swój sama z siebie bierze,\nJakim świeciła blaskiem na tej sferze,\nNikt pojąć, ja bym opisać nie zdołał,\nGdybym duch w pomoc i sztukę przywołał."
    verse: true
    chunks:
      - pl: "A Beatrycze, której postęp w czasie"
        ru: "А Беатриче, чьё продвижение во времени"
      - pl: "\nZ dobrego w lepsze wymierzyć nie da się,"
        ru: "от доброго к лучшему не поддаётся измерению,"
      - pl: "\nOna, co blask swój sama z siebie bierze,"
        ru: "она, что берёт свой блеск сама из себя,"
      - pl: "\nJakim świeciła blaskiem na tej sferze,"
        ru: "каким блеском она сияла в этой сфере,"
      - pl: "\nNikt pojąć, ja bym opisać nie zdołał,"
        ru: "никто не постигнет, я не сумел бы описать,"
      - pl: "\nGdybym duch w pomoc i sztukę przywołał."
        ru: "даже если бы призвал на помощь дух и искусство."
    words: { "postęp": postep, "blask": blask, "świeciła": swiecic, "pojąć": pojac, "opisać": opisac, "zdołał": zdolac }
  - clean: "Lecz można wierzyć i przystoi żądać,\nAby na moją wiarę ją oglądać:\nA jeśli skrzydeł wyobraźnia nasza\nDo wysokości takiej nie podnasza,\nNic w tym dziwnego; nikt do tak wysoka,\nAż poza słońce nie wytężył oka."
    verse: true
    chunks:
      - pl: "Lecz można wierzyć i przystoi żądać,"
        ru: "Но можно верить и подобает желать"
      - pl: "\nAby na moją wiarę ją oglądać:"
        ru: "увидеть её, поверив мне на слово:"
      - pl: "\nA jeśli skrzydeł wyobraźnia nasza"
        ru: "а если наше воображение не поднимает"
      - pl: "\nDo wysokości takiej nie podnasza,"
        ru: "крыльев до такой высоты,"
      - pl: "\nNic w tym dziwnego; nikt do tak wysoka,"
        ru: "ничего в этом странного; никто так высоко,"
      - pl: "\nAż poza słońce nie wytężył oka."
        ru: "за самое солнце, не напрягал глаза."
    words: { "żądać": zadac-2, "wiarę": wiara, "skrzydeł": skrzydlo, "wyobraźnia": wyobraznia, "wysokości": wysokosc, "wytężył": wytezyc }
  - clean: "Była to czwarta rodzina, rodzina,\nKtórą jej Ojciec karmi bez łaknienia,\nIch oświecając światłem objawienia,\nJako się z Niego Duch i Syn poczyna,\nWtem Beatrycze mówiła: «Bez końca\nDziękuj i módl się do aniołów słońca\nŻe ciebie skrzydłem niecielesnej jazdy\nDo tej widzialnej raczył podnieść gwiazdy»."
    verse: true
    chunks:
      - pl: "Była to czwarta rodzina, rodzina,"
        ru: "Это была четвёртая семья, семья,"
        note: "блаженных"
      - pl: "\nKtórą jej Ojciec karmi bez łaknienia,"
        ru: "которую её Отец питает без голода,"
      - pl: "\nIch oświecając światłem objawienia,"
        ru: "озаряя их светом откровения,"
      - pl: "\nJako się z Niego Duch i Syn poczyna,"
        ru: "как от Него исходят Дух и Сын."
      - pl: "\nWtem Beatrycze mówiła: «Bez końca"
        ru: "Тут Беатриче сказала: «Без конца"
      - pl: "\nDziękuj i módl się do aniołów słońca"
        ru: "благодари и молись солнцу ангелов,"
        note: "то есть Богу"
      - pl: "\nŻe ciebie skrzydłem niecielesnej jazdy"
        ru: "что тебя крылом бестелесной езды"
      - pl: "\nDo tej widzialnej raczył podnieść gwiazdy»."
        ru: "соизволил поднять до этой видимой звезды»."
    words: { "karmi": karmic, "światłem": swiatlo, "módl": modlic, "jazdy": jazda, "podnieść": podniesc, "gwiazdy": gwiazda }
  - clean: "Nigdy tak żywo serce śmiertelnika\nModlitwa cześcią Boga nie przenika,\nGdy się doń modli z uczuciem głębokiem,\nJak mnie do głębi przenikły te słowa;\nDuch mój z miłością tak w Bogu utonął,\nAże jej obraz z pamięci mej wionął."
    verse: true
    chunks:
      - pl: "Nigdy tak żywo serce śmiertelnika"
        ru: "Никогда так живо сердце смертного"
      - pl: "\nModlitwa cześcią Boga nie przenika,"
        ru: "не проникает молитва почитания Бога,"
      - pl: "\nGdy się doń modli z uczuciem głębokiem,"
        ru: "когда он молится Ему с глубоким чувством,"
      - pl: "\nJak mnie do głębi przenikły te słowa;"
        ru: "как меня до глубины проникли эти слова;"
      - pl: "\nDuch mój z miłością tak w Bogu utonął,"
        ru: "мой дух так утонул с любовью в Боге,"
      - pl: "\nAże jej obraz z pamięci mej wionął."
        ru: "что её образ выветрился из моей памяти."
    words: { "serce": serce, "Modlitwa": modlitwa, "głębi": glab, "miłością": milosc, "utonął": utonac, "pamięci": pamiec }
  - clean: "Ją nie drażniła ta niepamięć nowa,\nTylko promiennym uśmiechem i wzrokiem\nMyśl moją w jednym uwięzłą przedmiocie,\nRozwiała nagle na przedmiotów krocie.\nWidziałem, światła snuły się, roiły,\nRobiąc w powietrzu, wkoło nas zwieszone,\nZ nas dwojga środek, a z siebie koronę."
    verse: true
    chunks:
      - pl: "Ją nie drażniła ta niepamięć nowa,"
        ru: "Её не раздражало это новое забвение,"
      - pl: "\nTylko promiennym uśmiechem i wzrokiem"
        ru: "только лучистой улыбкой и взглядом"
      - pl: "\nMyśl moją w jednym uwięzłą przedmiocie,"
        ru: "мою мысль, застрявшую в одном предмете,"
      - pl: "\nRozwiała nagle na przedmiotów krocie."
        ru: "она вдруг развеяла на тысячи предметов."
        note: "krocie — тьма, тысячи"
      - pl: "\nWidziałem, światła snuły się, roiły,"
        ru: "Я видел: светила вились, роились,"
      - pl: "\nRobiąc w powietrzu, wkoło nas zwieszone,"
        ru: "делая в воздухе, повиснув кругом нас,"
      - pl: "\nZ nas dwojga środek, a z siebie koronę."
        ru: "из нас двоих — середину, а из себя — венец."
    words: { "uśmiechem": usmiech, "nagle": nagle, "Widziałem": widziec, "powietrzu": powietrze, "środek": srodek, "koronę": korona }
  - clean: "Głos ich był milszy niż blask, jakim lśniły.\nTak czasem widzim otoczoną świetnie\nCórkę Latony, gdy powietrze letnie\nSyte wilgocią wstęgę utrzymuje,\nKtórą swe czoło ona koronuje.\nNa dworze niebios, skąd wracam, jest cudnych\nWiele klejnotów do wyjęcia trudnych\nZ tego królestwa. I z głosu, i z treści\nŚpiew był tych świateł jednym z tych klejnotów:\nKto na swych skrzydłach wzlecieć tam niegotów,\nTen od niemego czeka o nich wieści."
    verse: true
    chunks:
      - pl: "Głos ich był milszy niż blask, jakim lśniły."
        ru: "Голос их был милее, чем блеск, каким они сияли."
      - pl: "\nTak czasem widzim otoczoną świetnie"
        ru: "Так порой мы видим окружённую блистательно"
      - pl: "\nCórkę Latony, gdy powietrze letnie"
        ru: "дочь Латоны, когда летний воздух,"
        note: "Луна с гало"
      - pl: "\nSyte wilgocią wstęgę utrzymuje,"
        ru: "насыщенный влагой, держит ленту,"
      - pl: "\nKtórą swe czoło ona koronuje."
        ru: "которой она венчает своё чело."
      - pl: "\nNa dworze niebios, skąd wracam, jest cudnych"
        ru: "При дворе небес, откуда я возвращаюсь, много дивных"
      - pl: "\nWiele klejnotów do wyjęcia trudnych"
        ru: "драгоценностей, трудных для вынесения"
      - pl: "\nZ tego królestwa. I z głosu, i z treści"
        ru: "из этого царства. И голосом, и содержанием"
      - pl: "\nŚpiew był tych świateł jednym z tych klejnotów:"
        ru: "пение этих светил было одной из таких драгоценностей:"
      - pl: "\nKto na swych skrzydłach wzlecieć tam niegotów,"
        ru: "кто не готов взлететь туда на своих крыльях,"
      - pl: "\nTen od niemego czeka o nich wieści."
        ru: "тот ждёт о них вести от немого."
    words: { "otoczoną": otoczyc, "letnie": letni, "utrzymuje": utrzymywac, "dworze": dwor, "wyjęcia": wyjac, "królestwa": krolestwo }
  - clean: "Nucąc Hosannę te światła słoneczne\nWkoło nas kręgiem obiegły trzy razy,\nJak stałe gwiazdy wkoło swojej osi\nTak grono dziewic w tańcu się unosi,\nA nie wychodząc za koło taneczne\nStoją w milczeniu i stoją dopóty,\nAż się poruszą na dźwięk nowej nuty."
    verse: true
    chunks:
      - pl: "Nucąc Hosannę te światła słoneczne"
        ru: "Напевая «Осанну», эти солнечные светила"
      - pl: "\nWkoło nas kręgiem obiegły trzy razy,"
        ru: "кругом обежали нас трижды,"
      - pl: "\nJak stałe gwiazdy wkoło swojej osi"
        ru: "как постоянные звёзды вокруг своей оси;"
      - pl: "\nTak grono dziewic w tańcu się unosi,"
        ru: "так круг дев возносится в пляске"
      - pl: "\nA nie wychodząc za koło taneczne"
        ru: "и, не выходя за круг пляски,"
      - pl: "\nStoją w milczeniu i stoją dopóty,"
        ru: "стоят в молчании и стоят до тех пор,"
      - pl: "\nAż się poruszą na dźwięk nowej nuty."
        ru: "пока не двинутся под звук нового напева."
    words: { "słoneczne": sloneczny, "grono": grono, "dziewic": dziewica, "tańcu": taniec, "poruszą": poruszyc, "dźwięk": dzwiek }
  - clean: "Z jednego światła wyszły te wyrazy:\n«Ponieważ promień wiekuistej łaski,\nPrzez którą miłość wyiskrza swe blaski,\nJak sama stałym mężnieje kochaniem,\nTak świeci w tobie, że twe stopy wodzi\nPo tej drabinie z nadzieją, z ufaniem,\nJaką nie idąc w górę nikt nie schodzi."
    verse: true
    chunks:
      - pl: "Z jednego światła wyszły te wyrazy:"
        ru: "Из одного светила вышли эти слова:"
      - pl: "\n«Ponieważ promień wiekuistej łaski,"
        ru: "«Так как луч вечной милости,"
      - pl: "\nPrzez którą miłość wyiskrza swe blaski,"
        ru: "через которую любовь выискривает свои блески,"
      - pl: "\nJak sama stałym mężnieje kochaniem,"
