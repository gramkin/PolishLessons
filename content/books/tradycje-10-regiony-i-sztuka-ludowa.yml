paragraphs:
  - clean: "Po drugiej wojnie światowej Polska stała się krajem niemal jednolitym narodowo i religijnie, a mieszkańcy wszystkich jej części mówią dziś tym samym językiem literackim. Pod tą jednolitą powierzchnią kryje się jednak wielka różnorodność. Każdy region ma własną gwarę, własne stroje, potrawy, pieśni i tańce, a etnografowie wyróżniają w Polsce kilkadziesiąt regionów etnograficznych. Niektóre z nich są znane w całym kraju, inne tylko wśród specjalistów i samych mieszkańców. W tym ostatnim rozdziale odwiedzimy kilka z nich, a potem przyjrzymy się sztuce ludowej i tańcom, które stały się symbolem całej Polski."
    draft: true
    chunks:
      - pl: "Po drugiej wojnie światowej Polska stała się krajem niemal jednolitym narodowo i religijnie, a mieszkańcy wszystkich jej części mówią dziś tym samym językiem literackim."
        ru: "После Второй мировой войны Польша стала почти однородной в национальном и религиозном отношении страной, и жители всех её частей сегодня говорят на одном литературном языке."
      - pl: " Pod tą jednolitą powierzchnią kryje się jednak wielka różnorodność."
        ru: "Однако под этой однородной поверхностью скрывается большое разнообразие."
        note: "różnorodność — разнообразие"
      - pl: " Każdy region ma własną gwarę, własne stroje, potrawy, pieśni i tańce, a etnografowie wyróżniają w Polsce kilkadziesiąt regionów etnograficznych."
        ru: "У каждого региона свой говор, свои костюмы, блюда, песни и танцы, а этнографы выделяют в Польше несколько десятков этнографических регионов."
        note: "gwara — говор"
      - pl: " Niektóre z nich są znane w całym kraju, inne tylko wśród specjalistów i samych mieszkańców."
        ru: "Некоторые из них известны по всей стране, другие — только специалистам и самим жителям."
      - pl: " W tym ostatnim rozdziale odwiedzimy kilka z nich, a potem przyjrzymy się sztuce ludowej i tańcom, które stały się symbolem całej Polski."
        ru: "В этой последней главе мы посетим некоторые из них, а потом присмотримся к народному искусству и танцам, которые стали символом всей Польши."
