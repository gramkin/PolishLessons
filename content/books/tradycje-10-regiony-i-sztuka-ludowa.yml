        ru: "Мы надеемся, что эта книга поможет читателю не только понять эти обычаи, но и принять в них участие, когда однажды его пригласят в польский дом на Сочельник, свадьбу или именины."
      - pl: " A wtedy zostanie mu już tylko jedno: usiąść przy stole, podnieść kieliszek i powiedzieć razem ze wszystkimi: sto lat!"
