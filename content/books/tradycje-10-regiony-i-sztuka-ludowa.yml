  - clean: "Polska ma pięć tańców, które nazywa się narodowymi: poloneza, mazura, krakowiaka, oberka i kujawiaka. Polonez, uroczysty taniec korowodowy, otwiera bale i studniówki, o czym pisaliśmy w trzecim rozdziale. Mazur, szybki i dumny, z charakterystycznymi uderzeniami obcasów, był ulubionym tańcem szlachty, a jego rytmem napisany jest polski hymn narodowy, nazywany zresztą Mazurkiem Dąbrowskiego. Krakowiak pochodzi z okolic Krakowa i jest skoczny i wesoły, a tancerze w czerwonych czapkach z pawimi piórami tańczą go z przyśpiewkami. Oberek to szybki taniec wirowy, w którym pary obracają się w kółko coraz szybciej, a kujawiak, pochodzący z Kujaw, jest wolny, liryczny i trochę melancholijny. Wszystkie te rytmy wykorzystywał w swojej muzyce Fryderyk Chopin, który napisał kilkadziesiąt mazurków i kilkanaście polonezów, przenosząc wiejskie melodie do paryskich salonów."
