  - clean: "Na Mazowszu, między Warszawą a Łomżą, leży kraina Kurpiów, którzy przez wieki mieszkali w Puszczy Zielonej i żyli z lasu. Kurpie zajmowali się bartnictwem, czyli hodowlą dzikich pszczół w dziuplach drzew, polowaniem i zbieraniem bursztynu, który można było wydobywać w okolicznych lasach. W 2020 roku bartnictwo wpisano na listę niematerialnego dziedzictwa UNESCO jako wspólną tradycję Polski i Białorusi. Najbardziej znanym kurpiowskim rękodziełem są wycinanki, misterne wzory wycinane z kolorowego papieru nożycami do strzyżenia owiec. Kurpiowskie wycinanki są zwykle jednobarwne i symetryczne, a przedstawiają drzewka życia, ptaki i lilie, nazywane tu lelujami."
    draft: true
    chunks:
      - pl: "Na Mazowszu, między Warszawą a Łomżą, leży kraina Kurpiów, którzy przez wieki mieszkali w Puszczy Zielonej i żyli z lasu."
        ru: "В Мазовии, между Варшавой и Ломжей, лежит край курпей, которые веками жили в Зелёной пуще и кормились лесом."
      - pl: " Kurpie zajmowali się bartnictwem, czyli hodowlą dzikich pszczół w dziuplach drzew, polowaniem i zbieraniem bursztynu, który można było wydobywać w okolicznych lasach."
        ru: "Курпи занимались бортничеством, то есть разведением диких пчёл в дуплах деревьев, охотой и добычей янтаря, который можно было добывать в окрестных лесах."
        note: "bartnictwo — бортничество; dziupla — дупло; bursztyn — янтарь"
      - pl: " W 2020 roku bartnictwo wpisano na listę niematerialnego dziedzictwa UNESCO jako wspólną tradycję Polski i Białorusi."
