  - clean: "Najbardziej wyrazistym regionem jest Podhale, kraina u stóp Tatr, zamieszkana przez górali. Górale są dumni ze swojej odrębności i mówią gwarą, którą mieszkaniec Warszawy rozumie z trudem. Ich odświętny strój to dla mężczyzn białe wełniane spodnie ozdobione kolorowym haftem, zwanym parzenicą, skórzane kierpce na nogach i kapelusz z muszelkami, a dla kobiet kwieciste spódnice i gorsety wyszywane koralikami. Muzyka góralska, grana na skrzypcach i basach, ma ostry, przenikliwy dźwięk i charakterystyczne śpiewy, a jej rytmy zainspirowały Karola Szymanowskiego, który mieszkał w Zakopanem. Najsłynniejszym tańcem jest taniec zbójnicki, w którym mężczyźni skaczą wysoko z ciupagami, czyli siekierkami na długich trzonkach. Taniec przypomina o zbójnikach, góralskich rozbójnikach, z których najsłynniejszy, Janosik, według legendy zabierał bogatym i dawał biednym."
    draft: true
    chunks:
      - pl: "Najbardziej wyrazistym regionem jest Podhale, kraina u stóp Tatr, zamieszkana przez górali."
        ru: "Самый яркий регион — Подгалье, край у подножия Татр, населённый горцами."
        note: "wyrazisty — выразительный, яркий"
      - pl: " Górale są dumni ze swojej odrębności i mówią gwarą, którą mieszkaniec Warszawy rozumie z trudem."
        ru: "Горцы гордятся своей самобытностью и говорят на говоре, который житель Варшавы понимает с трудом."
        note: "odrębność — особость, самобытность"
      - pl: " Ich odświętny strój to dla mężczyzn białe wełniane spodnie ozdobione kolorowym haftem, zwanym parzenicą, skórzane kierpce na nogach i kapelusz z muszelkami, a dla kobiet kwieciste spódnice i gorsety wyszywane koralikami."
        ru: "Их праздничный костюм — для мужчин белые шерстяные брюки, украшенные цветной вышивкой под названием «паженица», кожаные кербцы на ногах и шляпа с ракушками, а для женщин — юбки в цветах и корсеты, расшитые бисером."
        note: "haft — вышивка; kierpce — горская кожаная обувь; koralik — бусина"
      - pl: " Muzyka góralska, grana na skrzypcach i basach, ma ostry, przenikliwy dźwięk i charakterystyczne śpiewy, a jej rytmy zainspirowały Karola Szymanowskiego, który mieszkał w Zakopanem."
        ru: "Горская музыка, которую играют на скрипках и басах, имеет резкое, пронзительное звучание и характерное пение, а её ритмы вдохновили Кароля Шимановского, жившего в Закопане."
        note: "przenikliwy — пронзительный"
      - pl: " Najsłynniejszym tańcem jest taniec zbójnicki, w którym mężczyźni skaczą wysoko z ciupagami, czyli siekierkami na długich trzonkach."
        ru: "Самый знаменитый танец — разбойничий, в котором мужчины высоко прыгают с чупагами, то есть топориками на длинных рукоятках."
        note: "ciupaga — горский топорик-трость; trzonek — рукоять"
      - pl: " Taniec przypomina o zbójnikach, góralskich rozbójnikach, z których najsłynniejszy, Janosik, według legendy zabierał bogatym i dawał biednym."
        ru: "Танец напоминает о разбойниках-збуйниках, самым знаменитым из которых был Яношик, который, по легенде, отнимал у богатых и отдавал бедным."
        note: "zbójnik — разбойник"
