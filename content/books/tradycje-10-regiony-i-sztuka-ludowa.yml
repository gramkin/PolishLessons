  - clean: "Pod koniec dziewiętnastego wieku Zakopane, wtedy mała góralska wieś, stało się ulubionym miejscem artystów i intelektualistów. Malarz i pisarz Stanisław Witkiewicz uznał, że góralska architektura i sztuka są najczystszym wyrazem dawnej kultury polskiej, i stworzył na ich podstawie styl zakopiański. Drewniane wille z wysokimi dachami, rzeźbionymi szczytami i góralskimi ornamentami stoją w Zakopanem do dziś i przyciągają turystów tak samo jak Tatry."
    draft: true
    chunks:
      - pl: "Pod koniec dziewiętnastego wieku Zakopane, wtedy mała góralska wieś, stało się ulubionym miejscem artystów i intelektualistów."
        ru: "В конце девятнадцатого века Закопане, тогда маленькая горская деревня, стало любимым местом художников и интеллектуалов."
      - pl: " Malarz i pisarz Stanisław Witkiewicz uznał, że góralska architektura i sztuka są najczystszym wyrazem dawnej kultury polskiej, i stworzył na ich podstawie styl zakopiański."
        ru: "Художник и писатель Станислав Виткевич решил, что горская архитектура и искусство — чистейшее выражение древней польской культуры, и создал на их основе закопанский стиль."
      - pl: " Drewniane wille z wysokimi dachami, rzeźbionymi szczytami i góralskimi ornamentami stoją w Zakopanem do dziś i przyciągają turystów tak samo jak Tatry."
        ru: "Деревянные виллы с высокими крышами, резными фронтонами и горскими орнаментами стоят в Закопане до сих пор и привлекают туристов так же, как Татры."
        note: "rzeźbiony — резной"
    words: { "wieku": wiek, "wieś": wies, "ulubionym": ulubiony, "artystów": artysta, "pisarz": pisarz, "uznał": uznac, "sztuka": sztuka, "najczystszym": czysty, "wyrazem": wyraz, "dawnej": dawny, "kultury": kultura, "polskiej": polski, "stworzył": stworzyc, "podstawie": podstawa, "styl": styl, "wille": willa, "dachami": dach, "szczytami": szczyt, "przyciągają": przyciagac, "turystów": turysta }
  - clean: "Zupełnie inny świat to Kaszuby, kraina jezior, lasów i pagórków na zachód od Gdańska. Kaszubi to grupa etniczna, która mówi własnym językiem, kaszubskim, uznanym w 2005 roku za jedyny w Polsce język regionalny. W wielu szkołach na Kaszubach dzieci uczą się kaszubskiego, a na tablicach z nazwami miejscowości są nazwy w dwóch językach. Kaszubski haft, w kilku odcieniach niebieskiego, z żółtymi, zielonymi i czerwonymi motywami kwiatowymi, zdobi obrusy, serwety i stroje regionalne. Kaszubi słyną też z tabaki, czyli tytoniu do wąchania, który starsi mężczyźni noszą w rogach bydlęcych i częstują nim gości, a w regionie odbywają się nawet mistrzostwa w zażywaniu tabaki. Dzieci uczą się piosenki o kaszubskich nutach, w której kolejne zwrotki wyliczają obrazki narysowane na specjalnej tablicy, przedstawiające proste przedmioty z codziennego życia i krajobrazu Kaszub. Kaszubi są dumni z tego, że przez wieki, mimo naporu kultury niemieckiej, zachowali swoją mowę i wiarę, a ich pisarz Aleksander Majkowski opisał losy kaszubskiego chłopa w powieści „Życie i przygody Remusa”, nazywanej kaszubską epopeją."
    draft: true
    chunks:
      - pl: "Zupełnie inny świat to Kaszuby, kraina jezior, lasów i pagórków na zachód od Gdańska."
        ru: "Совсем другой мир — Кашубы, край озёр, лесов и холмов к западу от Гданьска."
        note: "pagórek — холм"
      - pl: " Kaszubi to grupa etniczna, która mówi własnym językiem, kaszubskim, uznanym w 2005 roku za jedyny w Polsce język regionalny."
        ru: "Кашубы — этническая группа, говорящая на собственном языке, кашубском, который в 2005 году был признан единственным в Польше региональным языком."
      - pl: " W wielu szkołach na Kaszubach dzieci uczą się kaszubskiego, a na tablicach z nazwami miejscowości są nazwy w dwóch językach."
        ru: "Во многих школах на Кашубах дети учат кашубский, а на табличках с названиями населённых пунктов названия даны на двух языках."
      - pl: " Kaszubski haft, w kilku odcieniach niebieskiego, z żółtymi, zielonymi i czerwonymi motywami kwiatowymi, zdobi obrusy, serwety i stroje regionalne."
        ru: "Кашубская вышивка, в нескольких оттенках синего, с жёлтыми, зелёными и красными цветочными мотивами, украшает скатерти, салфетки и народные костюмы."
        note: "odcień — оттенок"
      - pl: " Kaszubi słyną też z tabaki, czyli tytoniu do wąchania, który starsi mężczyźni noszą w rogach bydlęcych i częstują nim gości, a w regionie odbywają się nawet mistrzostwa w zażywaniu tabaki."
        ru: "Кашубы славятся и табаком, то есть нюхательным табаком, который пожилые мужчины носят в коровьих рогах и угощают им гостей, а в регионе проводятся даже чемпионаты по нюханию табака."
        note: "tabaka — нюхательный табак"
      - pl: " Dzieci uczą się piosenki o kaszubskich nutach, w której kolejne zwrotki wyliczają obrazki narysowane na specjalnej tablicy, przedstawiające proste przedmioty z codziennego życia i krajobrazu Kaszub."
        ru: "Дети разучивают песню о кашубских нотах, куплеты которой перечисляют картинки, нарисованные на особой доске и изображающие простые предметы повседневной жизни и кашубского пейзажа."
      - pl: " Kaszubi są dumni z tego, że przez wieki, mimo naporu kultury niemieckiej, zachowali swoją mowę i wiarę, a ich pisarz Aleksander Majkowski opisał losy kaszubskiego chłopa w powieści „Życie i przygody Remusa”, nazywanej kaszubską epopeją."
        ru: "Кашубы гордятся тем, что веками, несмотря на натиск немецкой культуры, сохранили свою речь и веру, а их писатель Александр Майковский описал судьбу кашубского крестьянина в романе «Жизнь и приключения Ремуса», который называют кашубской эпопеей."
        note: "napór — натиск"
