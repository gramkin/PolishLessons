  - clean: "Na Śląsku, w największym regionie przemysłowym Polski, kultura ludowa splotła się z kulturą górniczą i robotniczą. W Nikiszowcu w Katowicach można zobaczyć familoki, ceglane domy dla rodzin górników z początku dwudziestego wieku, z czerwonymi ramami okien i wspólnymi podwórkami, gdzie dzieci bawiły się, a kobiety rozmawiały przy praniu. Ślązacy mówią po śląsku, mową, w której jest wiele słów pochodzenia niemieckiego, a spór o to, czy jest to dialekt polszczyzny, czy osobny język, trwa od lat i ma także wymiar polityczny. Silna jest tu tradycja rodzinna, pracowitości i porządku, a niedzielny obiad i barbórka mają na Śląsku szczególnie uroczysty charakter."
    draft: true
    chunks:
      - pl: "Na Śląsku, w największym regionie przemysłowym Polski, kultura ludowa splotła się z kulturą górniczą i robotniczą."
        ru: "В Силезии, крупнейшем промышленном регионе Польши, народная культура переплелась с шахтёрской и рабочей."
        note: "spleść się — переплестись"
      - pl: " W Nikiszowcu w Katowicach można zobaczyć familoki, ceglane domy dla rodzin górników z początku dwudziestego wieku, z czerwonymi ramami okien i wspólnymi podwórkami, gdzie dzieci bawiły się, a kobiety rozmawiały przy praniu."
        ru: "В Никишовце в Катовице можно увидеть фамилоки, кирпичные дома для шахтёрских семей начала двадцатого века, с красными оконными рамами и общими дворами, где играли дети, а женщины разговаривали за стиркой."
        note: "ceglany — кирпичный; podwórko — двор"
      - pl: " Ślązacy mówią po śląsku, mową, w której jest wiele słów pochodzenia niemieckiego, a spór o to, czy jest to dialekt polszczyzny, czy osobny język, trwa od lat i ma także wymiar polityczny."
        ru: "Силезцы говорят по-силезски, на наречии, где много слов немецкого происхождения, а спор о том, диалект ли это польского или отдельный язык, идёт годами и имеет также политическое измерение."
        note: "mowa — речь, наречие"
      - pl: " Silna jest tu tradycja rodzinna, pracowitości i porządku, a niedzielny obiad i barbórka mają na Śląsku szczególnie uroczysty charakter."
        ru: "Здесь сильна семейная традиция, трудолюбие и порядок, а воскресный обед и барбурка в Силезии имеют особенно торжественный характер."
