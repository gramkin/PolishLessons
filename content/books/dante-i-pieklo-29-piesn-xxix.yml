chapter: 29
chapterTitle: "Pieśń XXIX"
chapterTitleRu: "Песнь XXIX. Алхимики"
level: B2
paragraphs:
  - clean: "(Krąg VIII. Tłumok X. Fałszerze. Alchemiści.)"
    chunks:
      - pl: "(Krąg VIII. Tłumok X. Fałszerze. Alchemiści.)"
        ru: "(Круг VIII. Ров X. Подделыватели. Алхимики.)"
        note: "fałszerz — подделыватель"
    words: { "Krąg": krag }
  - clean: "Rozmaitymi tłum ludu ranami\nTak moje oczy upoił w tej chwili,\nŻe pragnął spocząć i trzeźwić je łzami.\n«Co tak spoglądasz?» przemówił Wirgili,\n«Czemu tak pilno patrzą twe powieki\nNa tłum tych cieniów tak smutnie kaleki?"
    verse: true
    chunks:
      - pl: "Rozmaitymi tłum ludu ranami"
        ru: "Разнообразными ранами толпа народа"
      - pl: "\nTak moje oczy upoił w tej chwili,"
        ru: "так опьянила мои глаза в этот миг,"
        note: "upoić — опьянить"
      - pl: "\nŻe pragnął spocząć i trzeźwić je łzami."
        ru: "что они жаждали отдохнуть и освежиться слезами."
        note: "trzeźwić — освежать, отрезвлять"
      - pl: "\n«Co tak spoglądasz?» przemówił Wirgili,"
        ru: "«Что ты так смотришь? — сказал Вергилий, —"
      - pl: "\n«Czemu tak pilno patrzą twe powieki"
        ru: "почему так пристально глядят твои веки"
      - pl: "\nNa tłum tych cieniów tak smutnie kaleki?"
        ru: "на толпу этих теней, столь печально искалеченных?"
    words: { "ludu": lud, "spocząć": spoczac, "łzami": lza, "spoglądasz": spogladac, "przemówił": przemowic, "pilno": pilno }
  - clean: "Tegoś nie robił przy drugich tłumokach:\nGdy chcesz policzyć, duchów tu jest ile,\nPomyśl; ta jama wykuta w opokach,\nMa w swym obwodzie dwadzieścia dwie mile.\nKsiężyc już zaszedł pod nasze podnóże,\nOdtąd dość krótki (szanuj lot chwil czynnych,)\nCzas dozwolony do pielgrzymki twojej;\nJeszcze masz widzieć wiele rzeczy innych,\nO których może myśl twa ani roi»."
    verse: true
    chunks:
      - pl: "Tegoś nie robił przy drugich tłumokach:"
        ru: "Ты этого не делал у других рвов:"
      - pl: "\nGdy chcesz policzyć, duchów tu jest ile,"
        ru: "если хочешь сосчитать, сколько тут духов,"
      - pl: "\nPomyśl; ta jama wykuta w opokach,"
        ru: "подумай: эта яма, вырубленная в скалах,"
        note: "wykuty — вырубленный"
      - pl: "\nMa w swym obwodzie dwadzieścia dwie mile."
        ru: "имеет в окружности двадцать две мили."
      - pl: "\nKsiężyc już zaszedł pod nasze podnóże,"
        ru: "Луна уже зашла под наше подножие,"
        note: "то есть полдень"
      - pl: "\nOdtąd dość krótki (szanuj lot chwil czynnych,)"
        ru: "отныне довольно короткое (цени полёт деятельных минут)"
      - pl: "\nCzas dozwolony do pielgrzymki twojej;"
        ru: "время, отпущенное на твоё паломничество;"
        note: "dozwolony — дозволенный; pielgrzymka — паломничество"
      - pl: "\nJeszcze masz widzieć wiele rzeczy innych,"
        ru: "тебе ещё предстоит видеть много иного,"
      - pl: "\nO których może myśl twa ani roi»."
        ru: "о чём твоя мысль, может, и не мечтает»."
    words: { "policzyć": policzyc, "jama": jama, "obwodzie": obwod, "Odtąd": odtad, "szanuj": szanowac, "czynnych": czynny }
  - clean: "Odpowiedziałem: «Gdybyś spojrzeć raczył\nNa powód, co tu wzrok mój tak zahaczył,\nDłużej mi patrzeć pozwoliłbyś może?»\nWódz szedł, ja za nim z wolna sunąc nogą,\nDodałem jeszcze, wciąż mówić ochoczy:\n«Tam, skąd utkwione odjąłem me oczy,\nW jamie, co w skał tych zapadła krawędzie,\nMyślę, swej winy płacze duch mój krewny,\nKtóra tam jego kosztuje tak drogo!»"
    verse: true
    chunks:
      - pl: "Odpowiedziałem: «Gdybyś spojrzeć raczył"
        ru: "Я ответил: «Если бы ты соизволил взглянуть"
      - pl: "\nNa powód, co tu wzrok mój tak zahaczył,"
        ru: "на причину, что так приковала здесь мой взгляд,"
        note: "zahaczyć — зацепить"
      - pl: "\nDłużej mi patrzeć pozwoliłbyś może?»"
        ru: "может, ты позволил бы мне дольше смотреть?»"
      - pl: "\nWódz szedł, ja za nim z wolna sunąc nogą,"
        ru: "Вождь шёл, я за ним, медленно волоча ногу,"
        note: "sunąć — двигать, волочить"
      - pl: "\nDodałem jeszcze, wciąż mówić ochoczy:"
        ru: "добавил ещё, всё охочий говорить:"
      - pl: "\n«Tam, skąd utkwione odjąłem me oczy,"
        ru: "«Там, откуда я отвёл вперённые глаза,"
      - pl: "\nW jamie, co w skał tych zapadła krawędzie,"
        ru: "в яме, что запала в края этих скал,"
        note: "krawędź — край, кромка"
      - pl: "\nMyślę, swej winy płacze duch mój krewny,"
        ru: "мне думается, мой родственный дух плачет о своей вине,"
      - pl: "\nKtóra tam jego kosztuje tak drogo!»"
        ru: "которая там обходится ему так дорого!»"
    words: { "wzrok": wzrok, "zahaczył": zahaczyc, "Wódz": wodz, "skał": skala, "krawędzie": krawedz, "krewny": krewny }
  - clean: "Mistrz odpowiedział: «Hamuj pociąg rzewny,\nDłużej tym duchem nie rozrzewniaj myśli,\nMarz o czym innym, gdzie on jest, niech będzie.\nWidziałem jego w chwili, gdyśmy przyszli\nNa łuk mostowy, on cię zauważał,\nWskazywał, żywo palcem ci pograżał;\nSłyszałem, jak nań jeden duch przeklęty:\nGeri del Bello, po imieniu krzyknął,\nLecz tyś był hrabią z Hetfortu zajęty,\nW to miejsce wtedy spojrzałeś, gdy zniknął»."
    verse: true
    chunks:
      - pl: "Mistrz odpowiedział: «Hamuj pociąg rzewny,"
        ru: "Учитель ответил: «Сдержи слезливое влечение,"
        note: "rzewny — слезливый, трогательный"
      - pl: "\nDłużej tym duchem nie rozrzewniaj myśli,"
        ru: "не растравляй дольше мыслей этим духом,"
        note: "rozrzewniać — растрогать"
      - pl: "\nMarz o czym innym, gdzie on jest, niech będzie."
        ru: "думай о другом; где он есть, пусть там и будет."
      - pl: "\nWidziałem jego w chwili, gdyśmy przyszli"
        ru: "Я видел его в тот миг, когда мы пришли"
      - pl: "\nNa łuk mostowy, on cię zauważał,"
        ru: "на дугу моста: он тебя заметил,"
      - pl: "\nWskazywał, żywo palcem ci pograżał;"
        ru: "указывал, живо грозил тебе пальцем;"
        note: "pograżać — грозить"
      - pl: "\nSłyszałem, jak nań jeden duch przeklęty:"
        ru: "я слышал, как его один проклятый дух"
      - pl: "\nGeri del Bello, po imieniu krzyknął,"
        ru: "окликнул по имени: Джери дель Белло,"
        note: "родственник Данте, убитый и не отомщённый"
      - pl: "\nLecz tyś był hrabią z Hetfortu zajęty,"
        ru: "но ты был занят графом из Альтафорте,"
        note: "Бертран де Борн"
      - pl: "\nW to miejsce wtedy spojrzałeś, gdy zniknął»."
        ru: "и взглянул в это место тогда, когда он исчез»."
    words: { "Mistrz": mistrz, "pociąg": pociag, "Marz": marzyc, "Wskazywał": wskazywac, "przeklęty": przeklety, "hrabią": hrabia }
  - clean: "A ja: «Śmierć jego, której wstyd podziela\nKrew nasza, od nas wygląda mściciela;\nDlatego, myślę, z uczuciem pogardy,\nNie mówiąc do mnie, odszedł duch ten hardy,\nCo go w mej duszy jeszcze droższym czyni».\nTak mówiąc szliśmy do pierwszej przystani,\nSkąd mógłbym widzieć dno innej otchłani,\nGdyby być mogło świetlej w tej jaskini."
    verse: true
    chunks:
      - pl: "A ja: «Śmierć jego, której wstyd podziela"
        ru: "А я: «Его смерть, стыд которой разделяет"
      - pl: "\nKrew nasza, od nas wygląda mściciela;"
        ru: "наша кровь, ждёт от нас мстителя;"
        note: "wyglądać — ждать, выглядывать"
      - pl: "\nDlatego, myślę, z uczuciem pogardy,"
        ru: "потому, думаю, с чувством презрения,"
      - pl: "\nNie mówiąc do mnie, odszedł duch ten hardy,"
        ru: "не говоря со мной, ушёл этот гордый дух,"
      - pl: "\nCo go w mej duszy jeszcze droższym czyni»."
        ru: "что делает его в моей душе ещё дороже»."
        note: "drogi — дорогой"
      - pl: "\nTak mówiąc szliśmy do pierwszej przystani,"
        ru: "Так говоря, мы шли к первой пристани,"
        note: "здесь — место на мосту"
      - pl: "\nSkąd mógłbym widzieć dno innej otchłani,"
        ru: "откуда я мог бы видеть дно другой бездны,"
      - pl: "\nGdyby być mogło świetlej w tej jaskini."
        ru: "если бы в этой пещере могло быть светлее."
        note: "świetlej — светлее"
    words: { "wstyd": wstyd, "Krew": krew, "duch": duch, "duszy": dusza, "czyni": czynic, "jaskini": jaskinia }
  - clean: "Gdym już od mostu stał o kilka kroków,\nGdzie był ostatni klasztor Złych Tłumoków,\nKrzyki boleści, co w mej czułej duszy,\nIle ich było, razem się zmieniły\nW żelazne strzały, tak serce raniły,\nTak, że rękoma zatykałem uszy."
    verse: true
    chunks:
      - pl: "Gdym już od mostu stał o kilka kroków,"
        ru: "Когда я стоял уже в нескольких шагах от моста,"
      - pl: "\nGdzie był ostatni klasztor Złych Tłumoków,"
        ru: "где была последняя обитель Злых Щелей,"
        note: "klasztor — монастырь, обитель"
      - pl: "\nKrzyki boleści, co w mej czułej duszy,"
        ru: "крики боли, что в моей чуткой душе,"
      - pl: "\nIle ich było, razem się zmieniły"
        ru: "сколько их было, разом превратились"
      - pl: "\nW żelazne strzały, tak serce raniły,"
        ru: "в железные стрелы, так ранили сердце,"
      - pl: "\nTak, że rękoma zatykałem uszy."
        ru: "что я затыкал руками уши."
        note: "zatykać — затыкать"
    words: { "mostu": most, "klasztor": klasztor, "uszy": ucho, "zmieniły": zmienic, "serce": serce, "rękoma": reka }
  - clean: "W miesiącu sierpniu społem tłum zebrany\nChorych z Maremmy i Waldikijany\nI co w sardyńskich szpitalach się mieści,\nDałby nam chyba obraz tych boleści.\nZ jamy buchały podobne wyziewy,\nJakimi dysze zgangreniałe ciało."
    verse: true
    chunks:
      - pl: "W miesiącu sierpniu społem tłum zebrany"
        ru: "Если бы в августе месяце собрать вместе толпу"
      - pl: "\nChorych z Maremmy i Waldikijany"
        ru: "больных из Мареммы и Вальдикьяны"
      - pl: "\nI co w sardyńskich szpitalach się mieści,"
        ru: "и тех, что помещаются в сардинских больницах,"
      - pl: "\nDałby nam chyba obraz tych boleści."
        ru: "она, пожалуй, дала бы нам образ этих мук."
      - pl: "\nZ jamy buchały podobne wyziewy,"
        ru: "Из ямы вырывались такие испарения,"
      - pl: "\nJakimi dysze zgangreniałe ciało."
        ru: "какими дышит гангренозное тело."
        note: "zgangreniały — поражённый гангреной"
    words: { "miesiącu": miesiac, "sierpniu": sierpien, "zebrany": zebrac, "szpitalach": szpital, "mieści": miescic, "podobne": podobny }
  - clean: "I zwróciliśmy krok nasz na brzeg lewy,\nKtóry się długo jedną ciągnie skałą;\nSpojrzałem w otchłań, gdzie na dnie jej łoża\nKarze fałszerzy sprawiedliwość boża.\nNie mógł smutniejszy być widok w Eginie,\nGdzie tysiącami chory lud wymierał,\nA mór zwierzęta i płazy pożerał;\nGdzie, jeśli wierzyć na poetów słowo,\nZ nasienia mrówek wylęgły na nowo\nLud ją zaludnił, zwany Mirmidony,\nJak widok duchów w tej ciemnej dolinie,\nJakby stos trupów bezładnie zrzucony."
    verse: true
    chunks:
      - pl: "I zwróciliśmy krok nasz na brzeg lewy,"
        ru: "И мы направили шаг на левый берег,"
      - pl: "\nKtóry się długo jedną ciągnie skałą;"
        ru: "что тянется долго одной скалой;"
      - pl: "\nSpojrzałem w otchłań, gdzie na dnie jej łoża"
        ru: "я взглянул в бездну, где на дне её ложа"
      - pl: "\nKarze fałszerzy sprawiedliwość boża."
        ru: "Божье правосудие карает подделывателей."
      - pl: "\nNie mógł smutniejszy być widok w Eginie,"
        ru: "Не мог быть печальнее вид на Эгине,"
      - pl: "\nGdzie tysiącami chory lud wymierał,"
        ru: "где тысячами вымирал больной народ,"
        note: "wymierać — вымирать"
      - pl: "\nA mór zwierzęta i płazy pożerał;"
        ru: "а мор пожирал зверей и гадов;"
        note: "mór — мор"
      - pl: "\nGdzie, jeśli wierzyć na poetów słowo,"
        ru: "где, если верить слову поэтов,"
      - pl: "\nZ nasienia mrówek wylęgły na nowo"
        ru: "из семени муравьёв вновь вылупившийся"
        note: "mrówka — муравей; wylęgły — вылупившийся"
      - pl: "\nLud ją zaludnił, zwany Mirmidony,"
        ru: "народ, называемый мирмидонянами, вновь заселил его,"
        note: "zaludnić — заселить"
      - pl: "\nJak widok duchów w tej ciemnej dolinie,"
        ru: "чем вид духов в этой тёмной долине,"
      - pl: "\nJakby stos trupów bezładnie zrzucony."
        ru: "как будто беспорядочно сброшенная груда трупов."
        note: "stos — груда; trup — труп"
    words: { "brzeg": brzeg, "poetów": poeta, "nasienia": nasienie, "dolinie": dolina, "stos": stos, "zrzucony": zrzucic }
  - clean: "Ten brzuchem cały do ziemi przypada,\nÓw głowę skłonił na ramię sąsiada,\nCi na czworakach pełzają jak gady.\nA szliśmy milcząc jako dwa niemowy,\nSłuchając, patrząc na chore gromady,\nNiezdolne dźwigać bezwładne tułowy."
    verse: true
    chunks:
      - pl: "Ten brzuchem cały do ziemi przypada,"
        ru: "Этот всем животом припадает к земле,"
      - pl: "\nÓw głowę skłonił na ramię sąsiada,"
        ru: "тот склонил голову на плечо соседа,"
      - pl: "\nCi na czworakach pełzają jak gady."
        ru: "те на четвереньках ползают, как гады."
        note: "na czworakach — на четвереньках; pełzać — ползать"
      - pl: "\nA szliśmy milcząc jako dwa niemowy,"
        ru: "А мы шли молча, как двое немых,"
      - pl: "\nSłuchając, patrząc na chore gromady,"
        ru: "слушая, глядя на больные толпы,"
      - pl: "\nNiezdolne dźwigać bezwładne tułowy."
        ru: "неспособные поднять бессильные туловища."
    words: { "brzuchem": brzuch, "ziemi": ziemia, "ramię": ramie, "sąsiada": sasiad, "milcząc": milczec, "bezwładne": bezwladny }
  - clean: "Dwóch wzajem na się opartych siedziało,\nStrupy im całe cętkowały ciało;\nJak zgrzebłem żywo pociąga stajenny\nPrzed przyjściem pana, choć ziewa półsenny,\nTak ci po strupach paznokciami wodzą,\nPrzez co bolesne swe świerzby łagodzą,\nPrzeciwko którym już nie było środka;\nJak pod kucharskim nożem pstrąg lub płotka\nMiece łuskami, tak strupów kawały\nSpod ich paznokci jak łuska leciały."
    verse: true
    chunks:
      - pl: "Dwóch wzajem na się opartych siedziało,"
        ru: "Двое сидели, опираясь друг о друга,"
      - pl: "\nStrupy im całe cętkowały ciało;"
        ru: "струпья покрывали пятнами всё их тело;"
        note: "strup — струп"
      - pl: "\nJak zgrzebłem żywo pociąga stajenny"
        ru: "как скребницей живо проводит конюх"
        note: "zgrzebło — скребница; stajenny — конюх"
      - pl: "\nPrzed przyjściem pana, choć ziewa półsenny,"
        ru: "перед приходом хозяина, хоть и зевает спросонья,"
      - pl: "\nTak ci po strupach paznokciami wodzą,"
        ru: "так эти водят ногтями по струпьям,"
      - pl: "\nPrzez co bolesne swe świerzby łagodzą,"
        ru: "чем облегчают свою мучительную чесотку,"
        note: "świerzb — чесотка"
      - pl: "\nPrzeciwko którym już nie było środka;"
        ru: "против которой уже не было средства;"
      - pl: "\nJak pod kucharskim nożem pstrąg lub płotka"
        ru: "как под поварским ножом форель или плотва"
        note: "pstrąg — форель; płotka — плотва"
      - pl: "\nMiece łuskami, tak strupów kawały"
        ru: "мечет чешую, так куски струпьев"
      - pl: "\nSpod ich paznokci jak łuska leciały."
        ru: "из-под их ногтей летели, как чешуя."
    words: { "opartych": oprzec, "paznokciami": paznokiec, "wodzą": wodzic, "bolesne": bolesny, "nożem": noz, "kawały": kawal }
  - clean: "«Ty, co jak garbarz przez smutną konieczność,»\nRzekł wódz mój, «skórę chropawą pryszczami\nWyprawiasz, gładząc paznokcia ostrzami,\nMów, czy się spotkam tutaj z Latynami?\nOby twój paznokć nie stępiał przez wieczność!»\n— «Tutaj w nas obu dwóch Latynów witasz!»"
    verse: true
    chunks:
      - pl: "«Ty, co jak garbarz przez smutną konieczność,»"
        ru: "«Ты, что, как дубильщик, по печальной необходимости, —"
        note: "garbarz — дубильщик кож"
      - pl: "\nRzekł wódz mój, «skórę chropawą pryszczami"
        ru: "сказал мой вождь, — кожу, шершавую от прыщей,"
        note: "chropawy — шершавый; pryszcz — прыщ"
      - pl: "\nWyprawiasz, gładząc paznokcia ostrzami,"
        ru: "выделываешь, скобля остриями ногтей,"
        note: "wyprawiać — выделывать (кожу)"
