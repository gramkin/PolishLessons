  - clean: "„Mokra jak zawsze”, odpowiedziała Alicja melancholijnym tonem. „Wygląda na to, że mnie to wcale nie suszy.”"
    en: "“As wet as ever,” said Alice in a melancholy tone: “it doesn’t seem to dry me at all.”"
    chunks:
      - pl: "„Mokra jak zawsze”, odpowiedziała Alicja melancholijnym tonem."
        ru: "«Мокрая, как и прежде», — ответила Алиса меланхоличным тоном."
      - pl: " „Wygląda na to, że mnie to wcale nie suszy.”"
        ru: "«Похоже, это меня совсем не сушит.»"
        note: "wygląda na to, że… — похоже, что…"
    words: { "tonem": ton, "wcale": wcale }
  - clean: "„W takim razie”, oświadczył uroczyście Dodo, wstając, „stawiam wniosek o odroczenie zebrania celem niezwłocznego przyjęcia bardziej energicznych środków…”"
    en: "“In that case,” said the Dodo solemnly, rising to its feet, “I move that the meeting adjourn, for the immediate adoption of more energetic remedies—”"
    chunks:
      - pl: "„W takim razie”, oświadczył uroczyście Dodo, wstając,"
        ru: "«В таком случае», — торжественно заявил Додо, вставая,"
        note: "w takim razie — в таком случае"
      - pl: " „stawiam wniosek o odroczenie zebrania"
        ru: "«вношу предложение отложить собрание"
        note: "stawiać wniosek o coś — вносить предложение о чём-л."
      - pl: " celem niezwłocznego przyjęcia bardziej energicznych środków…”"
        ru: "с целью безотлагательного принятия более энергичных мер…»"
        note: "celem + родительный — с целью: канцелярский оборот"
    words: { "oświadczył": oswiadczyc, "wstając": wstawac, "stawiam": stawiac, "wniosek": wniosek, "celem": cel, "przyjęcia": przyjecie, "bardziej": bardziej, "środków": srodek }
  - clean: "„Mów po ludzku!”, powiedziało Orlątko. „Nie znam znaczenia połowy tych długich słów, a co więcej, nie wierzę, żebyś ty je znał!” I Orlątko pochyliło głowę, żeby ukryć uśmiech; niektóre z pozostałych ptaków zachichotały głośno."
    en: "“Speak English!” said the Eaglet. “I don’t know the meaning of half those long words, and, what’s more, I don’t believe you do either!” And the Eaglet bent down its head to hide a smile: some of the other birds tittered audibly."
    chunks:
      - pl: "„Mów po ludzku!”, powiedziało Orlątko."
        ru: "«Говори по-человечески!» — сказал Орлёнок."
        note: "mówić po ludzku — говорить по-человечески; Orlątko среднего рода, отсюда powiedziało"
