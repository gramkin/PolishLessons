        note: "zuchwalstwo — дерзость, наглость"
      - pl: " Jak się teraz czujesz, moja droga?”,"
        ru: "Как ты теперь себя чувствуешь, моя дорогая?» —"
        note: "czuć się — чувствовать себя: всегда с się"
