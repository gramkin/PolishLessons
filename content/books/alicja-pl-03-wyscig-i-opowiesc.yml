chapter: 3
chapterTitle: Wyścig wyborczy i długa opowieść
chapterTitleRu: Выборный забег и длинный рассказ
level: B1
paragraphs:
  - clean: "Towarzystwo, które zebrało się na brzegu, wyglądało doprawdy osobliwie: ptaki z obwisłymi piórami, zwierzęta z sierścią przylepioną do ciała, wszyscy ociekający wodą, zirytowani i nieszczęśliwi."
    en: "They were indeed a queer-looking party that assembled on the bank—the birds with draggled feathers, the animals with their fur clinging close to them, and all dripping wet, cross, and uncomfortable."
    chunks:
      - pl: "Towarzystwo, które zebrało się na brzegu,"
        ru: "Компания, собравшаяся на берегу,"
        note: "zebrać się — собраться"
      - pl: " wyglądało doprawdy osobliwie:"
        ru: "выглядела поистине странно:"
        note: "wyglądać + наречие — выглядеть как-л."
      - pl: " ptaki z obwisłymi piórami,"
        ru: "птицы с обвисшими перьями,"
        note: "z + творительный — с, описывает признак"
      - pl: " zwierzęta z sierścią przylepioną do ciała,"
        ru: "звери со шерстью, прилипшей к телу,"
        note: "przylepiony do czegoś — прилипший к чему-л."
      - pl: " wszyscy ociekający wodą, zirytowani i nieszczęśliwi."
        ru: "все мокрые насквозь, раздражённые и несчастные."
        note: "ociekać czymś — стекать чем-л.: творительный падеж"
    words: { "Towarzystwo": towarzystwo, "zebrało": zebrac, "brzegu": brzeg, "ptaki": ptak, "zwierzęta": zwierze, "ciała": cialo, "wszyscy": wszyscy, "wodą": woda }
  - clean: "Pierwsze pytanie brzmiało oczywiście: jak znowu wyschnąć? Naradzali się nad tym i po kilku minutach Alicji wydało się zupełnie naturalne, że rozmawia z nimi poufale, jakby znała ich całe życie. Doprawdy, odbyła nawet długą sprzeczkę z Papużką, która w końcu się nadąsała i powtarzała tylko: „Jestem starsza od ciebie i muszę wiedzieć lepiej”. Na to Alicja nie chciała przystać, nie wiedząc, ile Papużka ma lat, a że ta stanowczo odmówiła podania swojego wieku, nie było już o czym mówić."
    en: "The first question of course was, how to get dry again: they had a consultation about this, and after a few minutes it seemed quite natural to Alice to find herself talking familiarly with them, as if she had known them all her life. Indeed, she had quite a long argument with the Lory, who at last turned sulky, and would only say, “I am older than you, and must know better;” and this Alice would not allow without knowing how old it was, and, as the Lory positively refused to tell its age, there was no more to be said."
    chunks:
      - pl: "Pierwsze pytanie brzmiało oczywiście: jak znowu wyschnąć?"
        ru: "Первый вопрос был, конечно: как снова высохнуть?"
        note: "brzmieć — звучать, гласить"
      - pl: " Naradzali się nad tym"
        ru: "Они совещались об этом"
        note: "naradzać się nad czymś — совещаться о чём-л.: nad и творительный"
      - pl: " i po kilku minutach Alicji wydało się zupełnie naturalne,"
        ru: "и через несколько минут Алисе показалось совершенно естественным,"
        note: "wydawać się komuś — казаться кому-л.: дательный падеж"
      - pl: " że rozmawia z nimi poufale,"
        ru: "что она разговаривает с ними запросто,"
        note: "poufale — запросто, фамильярно"
      - pl: " jakby znała ich całe życie."
        ru: "будто знала их всю жизнь."
        note: "jakby — будто, как будто"
      - pl: " Doprawdy, odbyła nawet długą sprzeczkę z Papużką,"
        ru: "Право же, у неё вышел даже долгий спор с Попугайчиком,"
        note: "odbyć sprzeczkę — вступить в спор"
      - pl: " która w końcu się nadąsała"
        ru: "который в конце концов надулся"
        note: "nadąsać się — надуться, обидеться"
      - pl: " i powtarzała tylko: „Jestem starsza od ciebie i muszę wiedzieć lepiej”."
        ru: "и только повторял: «Я старше тебя и должен знать лучше»."
        note: "starszy od kogoś — старше кого-л.: od и родительный"
      - pl: " Na to Alicja nie chciała przystać,"
        ru: "На это Алиса соглашаться не хотела,"
        note: "przystać na coś — согласиться на что-л."
      - pl: " nie wiedząc, ile Papużka ma lat,"
        ru: "не зная, сколько Попугайчику лет,"
        note: "ile lat — сколько лет"
      - pl: " a że ta stanowczo odmówiła podania swojego wieku,"
        ru: "а так как тот наотрез отказался назвать свой возраст,"
        note: "odmówić czegoś — отказать в чём-л.: родительный падеж"
      - pl: " nie było już o czym mówić."
        ru: "говорить было больше не о чем."
        note: "nie ma o czym mówić — не о чем говорить"
    words: { "pytanie": pytanie, "brzmiało": brzmiec, "znowu": znowu, "minutach": minuta, "wydało": wydac, "zupełnie": zupelnie, "rozmawia": rozmawiac, "życie": zycie, "długą": dlugi, "powtarzała": powtarzac, "stanowczo": stanowczo, "odmówiła": odmowic, "podania": podac, "wieku": wiek }
  - clean: "W końcu Mysz, która zdawała się być wśród nich osobą poważaną, zawołała: „Siadajcie wszyscy i słuchajcie mnie! Zaraz was porządnie osuszę!” Wszyscy natychmiast usiedli w wielkim kręgu, z Myszą pośrodku. Alicja nie spuszczała z niej niespokojnego wzroku, bo była pewna, że mocno się przeziębi, jeśli szybko nie wyschnie."
    en: "At last the Mouse, who seemed to be a person of authority among them, called out, “Sit down, all of you, and listen to me! _I’ll_ soon make you dry enough!” They all sat down at once, in a large ring, with the Mouse in the middle. Alice kept her eyes anxiously fixed on it, for she felt sure she would catch a bad cold if she did not get dry very soon."
    chunks:
      - pl: "W końcu Mysz, która zdawała się być wśród nich osobą poważaną,"
        ru: "Наконец Мышь, казавшаяся среди них особой уважаемой,"
        note: "osobą — творительный падеж при być"
      - pl: " zawołała: „Siadajcie wszyscy i słuchajcie mnie!"
        ru: "воскликнула: «Садитесь все и слушайте меня!"
        note: "słuchać kogoś — слушать кого-л.: родительный падеж"
      - pl: " Zaraz was porządnie osuszę!”"
        ru: "Сейчас я вас как следует высушу!»"
        note: "porządnie — как следует"
      - pl: " Wszyscy natychmiast usiedli w wielkim kręgu, z Myszą pośrodku."
        ru: "Все тотчас уселись большим кругом, с Мышью посередине."
        note: "pośrodku — посередине"
      - pl: " Alicja nie spuszczała z niej niespokojnego wzroku,"
        ru: "Алиса не спускала с неё встревоженного взгляда,"
        note: "spuszczać wzrok z kogoś — спускать взгляд с кого-л."
      - pl: " bo była pewna, że mocno się przeziębi, jeśli szybko nie wyschnie."
        ru: "потому что была уверена, что сильно простудится, если быстро не высохнет."
        note: "przeziębić się — простудиться"
    words: { "Mysz": mysz, "zdawała": zdawac, "osobą": osoba, "zawołała": zawolac, "Siadajcie": siadac, "porządnie": porzadnie, "natychmiast": natychmiast, "usiedli": usiasc, "niespokojnego": niespokojny, "wzroku": wzrok, "była": byly, "pewna": pewien, "mocno": mocno, "szybko": szybko }
  - clean: "„Ehem!”, powiedziała Mysz z ważną miną. „Czy wszyscy gotowi? Oto najbardziej sucha rzecz, jaką znam. Proszę o ciszę! «Wilhelm Zdobywca, którego sprawie sprzyjał papież, rychło został uznany przez Anglików, którzy potrzebowali przywódców i od dawna przywykli do uzurpacji i podbojów. Edwin i Morkar, hrabiowie Mercji i Northumbrii…»”"
    en: "“Ahem!” said the Mouse with an important air, “are you all ready? This is the driest thing I know. Silence all round, if you please! ‘William the Conqueror, whose cause was favoured by the pope, was soon submitted to by the English, who wanted leaders, and had been of late much accustomed to usurpation and conquest. Edwin and Morcar, the earls of Mercia and Northumbria—’”"
    chunks:
      - pl: "„Ehem!”, powiedziała Mysz z ważną miną."
        ru: "«Кхм!» — сказала Мышь с важным видом."
        note: "z ważną miną — с важным видом"
      - pl: " „Czy wszyscy gotowi?"
        ru: "«Все готовы?"
      - pl: " Oto najbardziej sucha rzecz, jaką znam."
        ru: "Вот самая сухая вещь, какую я знаю."
        note: "najbardziej — самый: аналитическая превосходная степень"
      - pl: " Proszę o ciszę!"
        ru: "Прошу тишины!"
        note: "prosić o coś — просить о чём-л.: o и винительный"
      - pl: " «Wilhelm Zdobywca, którego sprawie sprzyjał papież,"
        ru: "«Вильгельм Завоеватель, делу которого благоволил папа,"
        note: "sprzyjać czemuś — благоприятствовать чему-л.: дательный падеж"
      - pl: " rychło został uznany przez Anglików,"
        ru: "вскоре был признан англичанами,"
        note: "zostać uznanym przez kogoś — быть признанным кем-л."
      - pl: " którzy potrzebowali przywódców"
        ru: "которые нуждались в вождях"
        note: "potrzebować czegoś — нуждаться в чём-л.: родительный падеж"
      - pl: " i od dawna przywykli do uzurpacji i podbojów."
        ru: "и давно привыкли к узурпации и завоеваниям."
        note: "przywyknąć do czegoś — привыкнуть к чему-л."
      - pl: " Edwin i Morkar, hrabiowie Mercji i Northumbrii…»”"
        ru: "Эдвин и Моркар, графы Мерсии и Нортумбрии…»»"
    words: { "ważną": wazny, "miną": minac, "gotowi": gotowy, "Oto": oto, "najbardziej": najbardziej, "rzecz": rzec, "ciszę": cisza, "uznany": uznac, "przywódców": przywodca, "dawna": dawny }
  - clean: "„Brr!”, powiedziała Papużka, wzdrygając się."
    en: "“Ugh!” said the Lory, with a shiver."
    chunks:
      - pl: "„Brr!”, powiedziała Papużka, wzdrygając się."
        ru: "«Бр-р!» — сказал Попугайчик, вздрогнув."
        note: "wzdrygać się — вздрагивать"
  - clean: "„Przepraszam bardzo!”, powiedziała Mysz, marszcząc brwi, ale bardzo uprzejmie. „Czy pani coś mówiła?”"
    en: "“I beg your pardon!” said the Mouse, frowning, but very politely: “Did you speak?”"
    chunks:
      - pl: "„Przepraszam bardzo!”, powiedziała Mysz, marszcząc brwi, ale bardzo uprzejmie."
        ru: "«Прошу прощения!» — сказала Мышь, нахмурив брови, но очень вежливо."
        note: "marszczyć brwi — хмурить брови"
      - pl: " „Czy pani coś mówiła?”"
        ru: "«Вы что-то сказали?»"
        note: "pani — вежливое обращение к женщине"
  - clean: "„Ja? Nie!”, odparła pospiesznie Papużka."
    en: "“Not I!” said the Lory hastily."
    chunks:
      - pl: "„Ja? Nie!”, odparła pospiesznie Papużka."
        ru: "«Я? Нет!» — поспешно ответил Попугайчик."
        note: "odparła — ответила: книжный синоним odpowiedziała"
    words: { "odparła": odeprzec }
  - clean: "„Wydawało mi się, że tak”, powiedziała Mysz. „…Kontynuuję. «Edwin i Morkar, hrabiowie Mercji i Northumbrii, opowiedzieli się za nim; a nawet Stigand, patriotyczny arcybiskup Canterbury, uznał za stosowne…»”"
    en: "“I thought you did,” said the Mouse. “—I proceed. ‘Edwin and Morcar, the earls of Mercia and Northumbria, declared for him: and even Stigand, the patriotic archbishop of Canterbury, found it advisable—’”"
    chunks:
      - pl: "„Wydawało mi się, że tak”, powiedziała Mysz."
        ru: "«Мне показалось, что да», — сказала Мышь."
        note: "wydawało mi się — мне казалось: дательный падеж"
      - pl: " „…Kontynuuję."
        ru: "«…Продолжаю."
      - pl: " «Edwin i Morkar, hrabiowie Mercji i Northumbrii, opowiedzieli się za nim;"
        ru: "«Эдвин и Моркар, графы Мерсии и Нортумбрии, высказались за него;"
        note: "opowiedzieć się za kimś — высказаться за кого-л.: za и творительный"
      - pl: " a nawet Stigand, patriotyczny arcybiskup Canterbury, uznał za stosowne…»”"
        ru: "а даже Стиганд, патриотичный архиепископ Кентерберийский, счёл уместным…»»"
