  - clean: "„Żałuję, że wspomniałam o Dinie!”, powiedziała do siebie melancholijnym tonem. „Zdaje się, że nikt jej tu na dole nie lubi, a przecież jestem pewna, że to najlepsza kotka na świecie! Och, moja droga Dino! Ciekawe, czy jeszcze kiedyś cię zobaczę!” I tu biedna Alicja znów zaczęła płakać, bo czuła się bardzo samotna i przygnębiona. Po chwili jednak znów usłyszała w oddali drobne tupotanie i podniosła wzrok z nadzieją, na wpół licząc na to, że Mysz zmieniła zdanie i wraca, żeby dokończyć swoją opowieść."
    en: "“I wish I hadn’t mentioned Dinah!” she said to herself in a melancholy tone. “Nobody seems to like her, down here, and I’m sure she’s the best cat in the world! Oh, my dear Dinah! I wonder if I shall ever see you any more!” And here poor Alice began to cry again, for she felt very lonely and low-spirited. In a little while, however, she again heard a little pattering of footsteps in the distance, and she looked up eagerly, half hoping that the Mouse had changed his mind, and was coming back to finish his story."
