    words: { "Wydawało": wydawac, "Kontynuuję": kontynuowac, "opowiedzieli": opowiedziec }
  - clean: "„Uznał co?”, spytała Kaczka."
    en: "“Found _what_?” said the Duck."
    chunks:
      - pl: "„Uznał co?”, spytała Kaczka."
        ru: "«Счёл что?» — спросила Утка."
  - clean: "„Uznał to”, odpowiedziała Mysz dość opryskliwie. „Chyba wiesz, co znaczy «to».”"
    en: "“Found _it_,” the Mouse replied rather crossly: “of course you know what ‘it’ means.”"
    chunks:
      - pl: "„Uznał to”, odpowiedziała Mysz dość opryskliwie."
        ru: "«Счёл это», — ответила Мышь довольно резко."
        note: "opryskliwie — резко, грубовато"
      - pl: " „Chyba wiesz, co znaczy «to».”"
        ru: "«Ты ведь знаешь, что значит «это».»"
        note: "chyba — ведь, наверное"
    words: { "odpowiedziała": odpowiedziec }
  - clean: "„Ja doskonale wiem, co znaczy «to», kiedy sama coś znajdę”, powiedziała Kaczka. „Zwykle to żaba albo robak. Pytanie brzmi: co znalazł arcybiskup?”"
    en: "“I know what ‘it’ means well enough, when _I_ find a thing,” said the Duck: “it’s generally a frog or a worm. The question is, what did the archbishop find?”"
    chunks:
      - pl: "„Ja doskonale wiem, co znaczy «to»,"
        ru: "«Я прекрасно знаю, что значит «это»,"
        note: "doskonale — прекрасно, отлично"
      - pl: " kiedy sama coś znajdę”, powiedziała Kaczka."
        ru: "когда сама что-нибудь нахожу», — сказала Утка."
        note: "sama — сама: согласуется в роде с подлежащим"
      - pl: " „Zwykle to żaba albo robak."
        ru: "«Обычно это лягушка или червяк."
      - pl: " Pytanie brzmi: co znalazł arcybiskup?”"
        ru: "Вопрос в том: что нашёл архиепископ?»"
        note: "pytanie brzmi — вопрос звучит, вопрос в том"
    words: { "doskonale": doskonale, "Zwykle": zwykle, "żaba": zaba }
  - clean: "Mysz nie zwróciła uwagi na to pytanie i pospiesznie ciągnęła dalej: „«…uznał za stosowne udać się z Edgarem Atheling na spotkanie z Wilhelmem i ofiarować mu koronę. Postępowanie Wilhelma było z początku umiarkowane. Ale zuchwalstwo jego Normanów…» Jak się teraz czujesz, moja droga?”, dodała, zwracając się do Alicji."
    en: "The Mouse did not notice this question, but hurriedly went on, “‘—found it advisable to go with Edgar Atheling to meet William and offer him the crown. William’s conduct at first was moderate. But the insolence of his Normans—’ How are you getting on now, my dear?” it continued, turning to Alice as it spoke."
