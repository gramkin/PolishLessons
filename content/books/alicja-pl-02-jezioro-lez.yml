  - clean: "Alicja podniosła wachlarz i rękawiczki, a że w sali było bardzo gorąco, wachlowała się bez przerwy, mówiąc dalej: „Ojej, ojej! Jakie wszystko jest dziś dziwne! A wczoraj wszystko szło jak zwykle. Ciekawe, czy zmieniono mnie w nocy? Niech pomyślę: czy byłam tą samą, kiedy wstałam dziś rano? Chyba pamiętam, że czułam się trochę inaczej. Ale jeśli nie jestem tą samą, to następne pytanie brzmi: kim ja właściwie jestem? Ach, to dopiero zagadka!” I zaczęła rozmyślać o wszystkich dzieciach, które znała, w jej wieku, żeby sprawdzić, czy nie zamieniono jej w któreś z nich."
    en: "Alice took up the fan and gloves, and, as the hall was very hot, she kept fanning herself all the time she went on talking: “Dear, dear! How queer everything is to-day! And yesterday things went on just as usual. I wonder if I’ve been changed in the night? Let me think: was I the same when I got up this morning? I almost think I can remember feeling a little different. But if I’m not the same, the next question is, Who in the world am I? Ah, _that’s_ the great puzzle!” And she began thinking over all the children she knew that were of the same age as herself, to see if she could have been changed for any of them."
    chunks:
      - pl: "Alicja podniosła wachlarz i rękawiczki,"
        ru: "Алиса подняла веер и перчатки,"
      - pl: " a że w sali było bardzo gorąco, wachlowała się bez przerwy, mówiąc dalej:"
        ru: "а так как в зале было очень жарко, она без остановки обмахивалась, продолжая говорить:"
        note: "bez przerwy — без перерыва, беспрестанно"
      - pl: " „Ojej, ojej! Jakie wszystko jest dziś dziwne!"
        ru: "«Ой-ой! Какое всё сегодня странное!"
      - pl: " A wczoraj wszystko szło jak zwykle."
        ru: "А вчера всё шло как обычно."
        note: "jak zwykle — как обычно"
      - pl: " Ciekawe, czy zmieniono mnie w nocy?"
        ru: "Интересно, не подменили ли меня ночью?"
        note: "zmieniono — безличная форма: меня подменили"
      - pl: " Niech pomyślę: czy byłam tą samą, kiedy wstałam dziś rano?"
        ru: "Дай-ка подумаю: была ли я той же самой, когда встала сегодня утром?"
        note: "tą samą — творительный падеж в составном сказуемом"
      - pl: " Chyba pamiętam, że czułam się trochę inaczej."
        ru: "Кажется, я помню, что чувствовала себя немного иначе."
      - pl: " Ale jeśli nie jestem tą samą, to następne pytanie brzmi: kim ja właściwie jestem?"
        ru: "Но если я не та же самая, то следующий вопрос: кто же я такая?"
        note: "kim jestem — кто я: творительный падеж при być"
      - pl: " Ach, to dopiero zagadka!”"
        ru: "Ах, вот это загадка!»"
        note: "to dopiero — вот это, усиление"
