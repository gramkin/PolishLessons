      - pl: " ale muszę być dla nich miła”, pomyślała Alicja,"
        ru: "но я должна быть с ними милой», — подумала Алиса,"
        note: "miły dla kogoś — милый с кем-л.: dla и родительный"
      - pl: " „bo inaczej może nie zechcą chodzić tam, gdzie ja chcę!"
        ru: "«а то они, чего доброго, не захотят идти туда, куда я хочу!"
        note: "zechcieć — захотеть: совершенный вид от chcieć"
