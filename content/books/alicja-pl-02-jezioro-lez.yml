  - clean: "W tej właśnie chwili jej głowa uderzyła o sufit sali: miała teraz ponad dwa i pół metra wzrostu. Natychmiast chwyciła złoty kluczyk i pospieszyła do drzwiczek do ogrodu."
    en: "Just then her head struck against the roof of the hall: in fact she was now more than nine feet high, and she at once took up the little golden key and hurried off to the garden door."
    chunks:
      - pl: "W tej właśnie chwili jej głowa uderzyła o sufit sali:"
