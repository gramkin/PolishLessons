        ru: "«Они поедут посылкой», — подумала она,"
        note: "przesyłką — творительный падеж: способ отправки"
      - pl: " „a jakie to będzie zabawne — wysyłać prezenty własnym stopom!"
        ru: "«а как это будет забавно — посылать подарки собственным ногам!"
        note: "wysyłać komuś — посылать кому-л.: дательный падеж"
