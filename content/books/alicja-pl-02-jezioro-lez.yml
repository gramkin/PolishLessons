  - clean: "I dalej układała sobie w głowie, jak to urządzi. „Muszą pojechać przesyłką”, pomyślała, „a jakie to będzie zabawne — wysyłać prezenty własnym stopom! I jak dziwnie będzie wyglądał adres!"
    en: "And she went on planning to herself how she would manage it. “They must go by the carrier,” she thought; “and how funny it’ll seem, sending presents to one’s own feet! And how odd the directions will look!"
    chunks:
      - pl: "I dalej układała sobie w głowie, jak to urządzi."
        ru: "И она дальше прикидывала в уме, как это устроит."
