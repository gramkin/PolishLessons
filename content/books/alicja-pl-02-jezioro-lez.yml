      - pl: " miała teraz ponad dwa i pół metra wzrostu."
        ru: "в ней теперь было больше двух с половиной метров росту."
        note: "ponad + винительный — свыше, больше"
      - pl: " Natychmiast chwyciła złoty kluczyk"
