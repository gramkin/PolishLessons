  - clean: "„Już nie będę!”, powiedziała Alicja, bardzo się spiesząc, żeby zmienić temat rozmowy. „A czy… czy lubisz… psy?” Mysz nie odpowiedziała, więc Alicja ciągnęła z zapałem: „Niedaleko naszego domu jest taki miły piesek, chciałabym ci go pokazać! Mały terier o błyszczących oczach, wiesz, z takim długim, kręconym brązowym włosem! I aportuje, kiedy się coś rzuci, i siada słupka, prosząc o obiad, i robi mnóstwo innych rzeczy — nie pamiętam nawet połowy — i należy do pewnego gospodarza, wiesz, a on mówi, że jest tak pożyteczny, że wart sto funtów! Mówi, że zabija wszystkie szczury i… ojej!”, zawołała Alicja żałosnym tonem, „chyba znowu ją obraziłam!” Bo Mysz odpływała od niej co sił, robiąc przy tym w jeziorze niemałe zamieszanie."
    en: "“I won’t indeed!” said Alice, in a great hurry to change the subject of conversation. “Are you—are you fond—of—of dogs?” The Mouse did not answer, so Alice went on eagerly: “There is such a nice little dog near our house I should like to show you! A little bright-eyed terrier, you know, with oh, such long curly brown hair! And it’ll fetch things when you throw them, and it’ll sit up and beg for its dinner, and all sorts of things—I can’t remember half of them—and it belongs to a farmer, you know, and he says it’s so useful, it’s worth a hundred pounds! He says it kills all the rats and—oh dear!” cried Alice in a sorrowful tone, “I’m afraid I’ve offended it again!” For the Mouse was swimming away from her as hard as it could go, and making quite a commotion in the pool as it went."
