  - clean: "„Na pewno nie jestem Adą”, powiedziała, „bo jej włosy układają się w takie długie loki, a moje wcale się nie kręcą; i na pewno nie jestem Mabel, bo ja wiem mnóstwo rzeczy, a ona, och! ona wie tak niewiele! Zresztą ona to ona, a ja to ja, i… ojej, jakie to wszystko zagmatwane! Sprawdzę, czy wiem to wszystko, co dawniej wiedziałam. Niech pomyślę: cztery razy pięć to dwanaście, cztery razy sześć to trzynaście, a cztery razy siedem to… ojej! Tak nigdy nie dojdę do dwudziestu! Ale tabliczka mnożenia nic nie znaczy: spróbujmy geografii. Londyn jest stolicą Paryża, a Paryż jest stolicą Rzymu, a Rzym… nie, to wszystko źle, jestem pewna! Na pewno zamieniono mnie w Mabel! Spróbuję powiedzieć «Jakże mała…»” — i skrzyżowała ręce na kolanach, jakby odpowiadała lekcję, i zaczęła recytować, ale głos brzmiał chrapliwie i dziwnie, a słowa nie wychodziły takie jak dawniej:"
    en: "“I’m sure I’m not Ada,” she said, “for her hair goes in such long ringlets, and mine doesn’t go in ringlets at all; and I’m sure I can’t be Mabel, for I know all sorts of things, and she, oh! she knows such a very little! Besides, _she’s_ she, and _I’m_ I, and—oh dear, how puzzling it all is! I’ll try if I know all the things I used to know. Let me see: four times five is twelve, and four times six is thirteen, and four times seven is—oh dear! I shall never get to twenty at that rate! However, the Multiplication Table doesn’t signify: let’s try Geography. London is the capital of Paris, and Paris is the capital of Rome, and Rome—no, _that’s_ all wrong, I’m certain! I must have been changed for Mabel! I’ll try and say ‘_How doth the little_—’” and she crossed her hands on her lap as if she were saying lessons, and began to repeat it, but her voice sounded hoarse and strange, and the words did not come the same as they used to do:—"
