paragraphs:
  - clean: "„Coraz dziwniej i dziwaczniej!”, zawołała Alicja (była tak zaskoczona, że w tej chwili zupełnie zapomniała, jak się mówi poprawną polszczyzną); „teraz rozkładam się jak największy teleskop, jaki kiedykolwiek istniał! Do widzenia, stopy!” (bo kiedy spojrzała w dół na swoje stopy, ledwie je widziała, tak bardzo się oddaliły). „Ach, moje biedne stópki, ciekawe, kto wam teraz będzie wkładał buciki i pończoszki, kochane? Ja na pewno nie dam rady! Będę o wiele za daleko, żeby się wami zajmować: musicie radzić sobie same… ale muszę być dla nich miła”, pomyślała Alicja, „bo inaczej może nie zechcą chodzić tam, gdzie ja chcę! Niech pomyślę: będę im dawać nową parę butów na każde Boże Narodzenie.”"
    en: "“Curiouser and curiouser!” cried Alice (she was so much surprised, that for the moment she quite forgot how to speak good English); “now I’m opening out like the largest telescope that ever was! Good-bye, feet!” (for when she looked down at her feet, they seemed to be almost out of sight, they were getting so far off). “Oh, my poor little feet, I wonder who will put on your shoes and stockings for you now, dears? I’m sure _I_ shan’t be able! I shall be a great deal too far off to trouble myself about you: you must manage the best way you can;—but I must be kind to them,” thought Alice, “or perhaps they won’t walk the way I want to go! Let me see: I’ll give them a new pair of boots every Christmas.”"
    chunks:
