  - clean: "„To było o włos!”, powiedziała Alicja, mocno przestraszona nagłą zmianą, ale bardzo rada, że wciąż istnieje. „A teraz do ogrodu!” — i co sił popędziła z powrotem do drzwiczek. Ale niestety! Drzwiczki znów były zamknięte, a złoty kluczyk leżał na szklanym stoliku jak przedtem. „I jest gorzej niż kiedykolwiek”, pomyślało biedne dziecko, „bo nigdy jeszcze nie byłam taka mała, nigdy! I powiem wprost: to już naprawdę za wiele!”"
