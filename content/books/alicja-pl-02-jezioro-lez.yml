  - clean: "Gdy wypowiadała te słowa, noga się jej omsknęła i w następnej chwili — plusk! — była po brodę w słonej wodzie. Najpierw pomyślała, że jakimś sposobem wpadła do morza. „W takim razie wrócę koleją”, powiedziała sobie. (Alicja raz w życiu była nad morzem i doszła do ogólnego wniosku, że dokądkolwiek pojedzie się na angielskim wybrzeżu, znajdzie się tam kilka kabin kąpielowych w wodzie, trochę dzieci kopiących w piasku drewnianymi łopatkami, potem rząd pensjonatów, a za nimi stacja kolejowa.) Wkrótce jednak zorientowała się, że jest w jeziorze łez, które wypłakała, gdy miała prawie trzy metry wzrostu."
    en: "As she said these words her foot slipped, and in another moment, splash! she was up to her chin in salt water. Her first idea was that she had somehow fallen into the sea, “and in that case I can go back by railway,” she said to herself. (Alice had been to the seaside once in her life, and had come to the general conclusion, that wherever you go to on the English coast you find a number of bathing machines in the sea, some children digging in the sand with wooden spades, then a row of lodging houses, and behind them a railway station.) However, she soon made out that she was in the pool of tears which she had wept when she was nine feet high."
    chunks:
      - pl: "Gdy wypowiadała te słowa, noga się jej omsknęła"
