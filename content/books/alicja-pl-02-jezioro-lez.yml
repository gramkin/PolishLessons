  - clean: "„Na pewno to nie są właściwe słowa”, powiedziała biedna Alicja, a oczy znów napełniły się jej łzami, gdy mówiła dalej: „Jednak muszę być Mabel i będę musiała zamieszkać w tym ciasnym domku, prawie bez zabawek, i och! z tyloma lekcjami do odrobienia! Nie, postanowiłam: jeśli jestem Mabel, zostanę tu na dole! Na nic się zda, że będą zaglądać w dół i wołać: «Wracaj do nas, kochanie!» Spojrzę tylko w górę i powiem: «Kim więc jestem? Najpierw mi to powiedzcie, a potem, jeśli spodoba mi się być tą osobą, wrócę: jeśli nie, zostanę tu, aż będę kimś innym» — ale ojej!”, zawołała Alicja z nagłym wybuchem płaczu, „naprawdę chciałabym, żeby zajrzeli w dół! Tak bardzo mam już dość siedzenia tu samej!”"
    en: "“I’m sure those are not the right words,” said poor Alice, and her eyes filled with tears again as she went on, “I must be Mabel after all, and I shall have to go and live in that poky little house, and have next to no toys to play with, and oh! ever so many lessons to learn! No, I’ve made up my mind about it; if I’m Mabel, I’ll stay down here! It’ll be no use their putting their heads down and saying ‘Come up again, dear!’ I shall only look up and say ‘Who am I then? Tell me that first, and then, if I like being that person, I’ll come up: if not, I’ll stay down here till I’m somebody else’—but, oh dear!” cried Alice, with a sudden burst of tears, “I do wish they _would_ put their heads down! I am so _very_ tired of being all alone here!”"
