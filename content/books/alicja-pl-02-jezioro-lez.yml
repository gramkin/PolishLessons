  - clean: "Zawołała więc za nią łagodnie: „Myszko kochana! Wróć, proszę, a nie będziemy rozmawiać ani o kotach, ani o psach, jeśli ich nie lubisz!” Kiedy Mysz to usłyszała, zawróciła i powoli przypłynęła z powrotem: jej pyszczek był całkiem blady (z gniewu, pomyślała Alicja), a ona powiedziała cichym, drżącym głosem: „Wypłyńmy na brzeg, a wtedy opowiem ci moją historię i zrozumiesz, dlaczego nienawidzę kotów i psów.”"
    en: "So she called softly after it, “Mouse dear! Do come back again, and we won’t talk about cats or dogs either, if you don’t like them!” When the Mouse heard this, it turned round and swam slowly back to her: its face was quite pale (with passion, Alice thought), and it said in a low trembling voice, “Let us get to the shore, and then I’ll tell you my history, and you’ll understand why it is I hate cats and dogs.”"
