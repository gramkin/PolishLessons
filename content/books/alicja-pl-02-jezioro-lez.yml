      - pl: " i zajrzeć jednym okiem do ogrodu;"
        ru: "и заглянуть одним глазом в сад;"
        note: "zajrzeć do czegoś — заглянуть куда-л."
      - pl: " ale przecisnąć się tamtędy było teraz beznadziejniej niż kiedykolwiek."
