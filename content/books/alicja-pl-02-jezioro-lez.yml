  - clean: "Biedna Alicja! Najwięcej, co mogła zrobić, to położyć się na boku i zajrzeć jednym okiem do ogrodu; ale przecisnąć się tamtędy było teraz beznadziejniej niż kiedykolwiek. Usiadła i znów zaczęła płakać."
    en: "Poor Alice! It was as much as she could do, lying down on one side, to look through into the garden with one eye; but to get through was more hopeless than ever: she sat down and began to cry again."
    chunks:
      - pl: "Biedna Alicja!"
