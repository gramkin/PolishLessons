  - clean: "W końcu wszystko było gotowe i był bardzo zadowolony ze swojego wyglądu. Wielkie skórzane buty do konnej jazdy, które należały do stroju, były na niego odrobinę za duże, a z dwóch pistoletów kawaleryjskich zdołał odnaleźć tylko jeden, ale w sumie był zupełnie zadowolony i kwadrans po pierwszej wysunął się z boazerii i skradał korytarzem. Dotarłszy do pokoju zajmowanego przez bliźniaków, który, jak powinienem wspomnieć, nazywano Niebieską Sypialnią z powodu koloru zasłon, zastał drzwi lekko uchylone. Chcąc wejść efektownie, otworzył je na oścież, a wtedy spadł na niego ciężki dzbanek z wodą, przemoczył go do suchej nitki i o parę cali minął jego lewe ramię."
    en: "At last everything was ready, and he was very pleased with his appearance. The big leather riding-boots that went with the dress were just a little too large for him, and he could only find one of the two horse-pistols, but, on the whole, he was quite satisfied, and at a quarter-past one he glided out of the wainscoting and crept down the corridor. On reaching the room occupied by the twins, which I should mention was called the Blue Bed Chamber, on account of the colour of its hangings, he found the door just ajar. Wishing to make an effective entrance, he flung it wide open, when a heavy jug of water fell right down on him, wetting him to the skin, and just missing his left shoulder by a couple of inches."
    draft: true
    chunks:
      - pl: "W końcu wszystko było gotowe"
