  - clean: "W tej samej chwili usłyszał stłumione wybuchy śmiechu dochodzące z łóżka z baldachimem. Wstrząs dla jego układu nerwowego był tak wielki, że uciekł do swego pokoju, co sił w nogach, a następnego dnia złożyło go ciężkie przeziębienie. Jedyną rzeczą, która go w całej tej sprawie choć trochę pocieszyła, był fakt, że nie zabrał ze sobą głowy, bo gdyby to zrobił, skutki mogłyby być bardzo poważne."
    en: "At the same moment he heard stifled shrieks of laughter proceeding from the four-post bed. The shock to his nervous system was so great that he fled back to his room as hard as he could go, and the next day he was laid up with a severe cold. The only thing that at all consoled him in the whole affair was the fact that he had not brought his head with him, for, had he done so, the consequences might have been very serious."
