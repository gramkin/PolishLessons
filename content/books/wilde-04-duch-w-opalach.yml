  - clean: "Ogarnięty paniką, co w tych okolicznościach było całkiem naturalne, rzucił się ku schodom, ale tam czekał na niego Waszyngton Otis z wielką ogrodową sikawką; otoczony tak przez wrogów ze wszystkich stron i niemal przyparty do muru, zniknął w wielkim żelaznym piecu, który na szczęście nie był rozpalony, i musiał wracać do domu przewodami kominowymi i kominami, aż dotarł do swojego pokoju w strasznym stanie: brudny, potargany i pogrążony w rozpaczy."
