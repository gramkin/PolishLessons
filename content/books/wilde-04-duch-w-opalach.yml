  - clean: "Mimo wszystko nie dawano mu spokoju. Przez korytarz ciągle rozciągano sznurki, o które potykał się w ciemności, a raz, przebrany do roli „Czarnego Izaaka, czyli Myśliwego z Lasów Hogley”, dotkliwie upadł, nadepnąwszy na maślany ślizg, który bliźniacy zrobili od wejścia do Komnaty Gobelinów aż do szczytu dębowych schodów. Ta ostatnia zniewaga tak go rozwścieczyła, że postanowił podjąć ostatni wysiłek, by bronić swej godności i pozycji towarzyskiej, i zdecydował się następnej nocy odwiedzić zuchwałych młodych etończyków w swej słynnej roli „Lekkomyślnego Ruperta, czyli Hrabiego bez Głowy”."
    en: "Still in spite of everything he was not left unmolested. Strings were continually being stretched across the corridor, over which he tripped in the dark, and on one occasion, while dressed for the part of \"Black Isaac, or the Huntsman of Hogley Woods,\" he met with a severe fall, through treading on a butter-slide, which the twins had constructed from the entrance of the Tapestry Chamber to the top of the oak staircase. This last insult so enraged him, that he resolved to make one final effort to assert his dignity and social position, and determined to visit the insolent young Etonians the next night in his celebrated character of \"Reckless Rupert, or the Headless Earl.\""
    draft: true
