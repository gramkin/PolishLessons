  - clean: "Nie występował w tym przebraniu od ponad siedemdziesięciu lat; dokładnie od czasu, gdy tak nim przestraszył śliczną lady Barbarę Modish, że nagle zerwała zaręczyny z dziadkiem obecnego lorda Canterville i uciekła do Gretna Green z przystojnym Jackiem Castletownem, oświadczając, że nic na świecie nie skłoni jej do wejścia do rodziny, która pozwala tak okropnemu upiorowi przechadzać się o zmierzchu po tarasie. Biednego Jacka zastrzelił później w pojedynku lord Canterville na błoniach Wandsworth, a lady Barbara zmarła z rozdartym sercem w Tunbridge Wells przed końcem roku, był to więc pod każdym względem wielki sukces. Była to jednak niezwykle trudna „charakteryzacja”, jeśli wolno mi użyć tak teatralnego wyrażenia w związku z jedną z największych tajemnic świata nadprzyrodzonego czy, by użyć bardziej naukowego terminu, świata nadnaturalnego, i przygotowania zajęły mu pełne trzy godziny."
    en: "He had not appeared in this disguise for more than seventy years; in fact, not since he had so frightened pretty Lady Barbara Modish by means of it, that she suddenly broke off her engagement with the present Lord Canterville's grandfather, and ran away to Gretna Green with handsome Jack Castletown, declaring that nothing in the world would induce her to marry into a family that allowed such a horrible phantom to walk up and down the terrace at twilight. Poor Jack was afterwards shot in a duel by Lord Canterville on Wandsworth Common, and Lady Barbara died of a broken heart at Tunbridge Wells before the year was out, so, in every way, it had been a great success. It was, however an extremely difficult \"make-up,\" if I may use such a theatrical expression in connection with one of the greatest mysteries of the supernatural, or, to employ a more scientific term, the higher-natural world, and it took him fully three hours to make his preparations."
    draft: true
