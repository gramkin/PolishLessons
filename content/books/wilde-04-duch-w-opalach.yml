  - clean: "Odtąd nie widziano go już na żadnej nocnej wyprawie. Bliźniacy kilka razy czatowali na niego i co noc zasypywali korytarze łupinami orzechów, ku wielkiemu niezadowoleniu rodziców i służby, ale na próżno. Było zupełnie oczywiste, że jego uczucia zostały tak zranione, że nie chce się pokazać. Pan Otis wrócił więc do swego wielkiego dzieła o historii Partii Demokratycznej, nad którym pracował od kilku lat; pani Otis zorganizowała wspaniały piknik z pieczonymi małżami, który zadziwił całe hrabstwo; chłopcy zajęli się lacrosse'em, euchrem, pokerem i innymi amerykańskimi grami narodowymi, a Virginia jeździła na kucyku po wiejskich drogach w towarzystwie młodego księcia Cheshire, który przyjechał spędzić ostatni tydzień wakacji w Canterville Chase."
    en: "After this he was not seen again on any nocturnal expedition. The twins lay in wait for him on several occasions, and strewed the passages with nutshells every night to the great annoyance of their parents and the servants, but it was of no avail. It was quite evident that his feelings were so wounded that he would not appear. Mr. Otis consequently resumed his great work on the history of the Democratic Party, on which he had been engaged for some years; Mrs. Otis organized a wonderful clam-bake, which amazed the whole county; the boys took to lacrosse euchre, poker, and other American national games, and Virginia rode about the lanes on her pony, accompanied by the young Duke of Cheshire, who had come to spend the last week of his holidays at Canterville Chase."
