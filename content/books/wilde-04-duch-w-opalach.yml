  - clean: "Duch, rzecz jasna, bardzo chciał pokazać, że nie stracił wpływu na Stiltonów, z którymi zresztą był daleko spokrewniony, bo jego własna cioteczna siostra wyszła powtórnie za mąż za sieura de Bulkeley, od którego, jak wszyscy wiedzą, w prostej linii pochodzą książęta Cheshire. Postanowił więc ukazać się małemu wielbicielowi Virginii w swej słynnej kreacji „Mnicha Wampira, czyli Bezkrwistego Benedyktyna”, przedstawieniu tak strasznym, że gdy ujrzała je stara lady Startup — a stało się to pewnego feralnego sylwestra w roku 1764 — zaczęła przeraźliwie krzyczeć, co zakończyło się gwałtowną apopleksją, i zmarła po trzech dniach, wydziedziczywszy Canterville'ów, swoich najbliższych krewnych, i zapisawszy wszystkie pieniądze londyńskiemu aptekarzowi. W ostatniej chwili jednak strach przed bliźniakami nie pozwolił mu wyjść z pokoju, i mały książę spał spokojnie pod wielkim baldachimem z piór w Królewskiej Sypialni i śnił o Virginii."
    en: "The ghost, then, was naturally very anxious to show that he had not lost his influence over the Stiltons, with whom, indeed, he was distantly connected, his own first cousin having been married en secondes noces to the Sieur de Bulkeley, from whom, as every one knows, the Dukes of Cheshire are lineally descended. Accordingly, he made arrangements for appearing to Virginia's little lover in his celebrated impersonation of \"The Vampire Monk, or the Bloodless Benedictine,\" a performance so horrible that when old Lady Startup saw it, which she did on one fatal New Year's Eve, in the year 1764, she went off into the most piercing shrieks, which culminated in violent apoplexy, and died in three days, after disinheriting the Cantervilles, who were her nearest relations, and leaving all her money to her London apothecary. At the last moment, however, his terror of the twins prevented his leaving his room, and the little Duke slept in peace under the great feathered canopy in the Royal Bedchamber, and dreamed of Virginia."
    draft: true
