  - clean: "To prawda, że wiódł bardzo grzeszne życie, ale z drugiej strony we wszystkim, co dotyczyło nadprzyrodzoności, był niezwykle sumienny. Przez następne trzy soboty przemierzał więc jak zwykle korytarz między północą a trzecią, zachowując wszelkie możliwe środki ostrożności, żeby nikt go nie usłyszał ani nie zobaczył. Zdejmował buty, stąpał jak najlżej po starych, stoczonych przez robaki deskach, nosił wielki czarny aksamitny płaszcz i starannie oliwił łańcuchy Smarem Wschodzące Słońce. Muszę przyznać, że z niemałym trudem zmusił się do tego ostatniego środka ochrony. Pewnej nocy jednak, gdy rodzina jadła obiad, wśliznął się do sypialni pana Otisa i zabrał buteleczkę. Z początku czuł się nieco upokorzony, ale potem był na tyle rozsądny, by przyznać, że ten wynalazek ma wiele zalet i do pewnego stopnia spełnia swoje zadanie."
    en: "It is quite true that his life had been very evil, but, upon the other hand, he was most conscientious in all things connected with the supernatural. For the next three Saturdays, accordingly, he traversed the corridor as usual between midnight and three o'clock, taking every possible precaution against being either heard or seen. He removed his boots, trod as lightly as possible on the old worm-eaten boards, wore a large black velvet cloak, and was careful to use the Rising Sun Lubricator for oiling his chains. I am bound to acknowledge that it was with a good deal of difficulty that he brought himself to adopt this last mode of protection. However, one night, while the family were at dinner, he slipped into Mr. Otis's bedroom and carried off the bottle. He felt a little humiliated at first, but afterwards was sensible enough to see that there was a great deal to be said for the invention, and, to a certain degree, it served his purpose."
    draft: true
