  - clean: "Porzucił teraz wszelką nadzieję, że kiedykolwiek przestraszy tę grubiańską amerykańską rodzinę, i zazwyczaj zadowalał się skradaniem po korytarzach w filcowych kapciach, z grubym czerwonym szalikiem na szyi w obawie przed przeciągami i z małą arkebuzą na wypadek, gdyby napadli go bliźniacy. Ostateczny cios otrzymał 19 września. Zszedł na dół do wielkiego holu wejściowego, pewien, że tam przynajmniej nikt nie będzie mu przeszkadzał, i zabawiał się złośliwymi uwagami na temat wielkich fotografii Saroniego, przedstawiających ministra Stanów Zjednoczonych i jego żonę, które zajęły teraz miejsce rodzinnych portretów Canterville'ów. Był ubrany skromnie, lecz schludnie, w długi całun poplamiony cmentarną ziemią, podwiązał sobie szczękę pasem żółtego płótna i niósł małą latarnię oraz łopatę grabarza."
    en: "He now gave up all hope of ever frightening this rude American family, and contented himself, as a rule, with creeping about the passages in list slippers, with a thick red muffler round his throat for fear of draughts, and a small arquebuse, in case he should be attacked by the twins. The final blow he received occurred on the 19th of September. He had gone down-stairs to the great entrance-hall, feeling sure that there, at any rate, he would be quite unmolested, and was amusing himself by making satirical remarks on the large Saroni photographs of the United States Minister and his wife which had now taken the place of the Canterville family pictures. He was simply but neatly clad in a long shroud, spotted with churchyard mould, had tied up his jaw with a strip of yellow linen, and carried a small lantern and a sexton's spade."
