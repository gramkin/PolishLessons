  - clean: "Był bowiem przebrany za „Jonasza Bez Grobu, czyli Porywacza Zwłok z Chertsey Barn”, jedną ze swych najznakomitszych kreacji, i to taką, którą Cantervillowie mieli wszelkie powody pamiętać, bo właśnie ona była prawdziwą przyczyną ich kłótni z sąsiadem, lordem Ruffordem. Było mniej więcej kwadrans po drugiej w nocy i, o ile mógł stwierdzić, nikt się nie ruszał. Kiedy jednak przechadzał się w stronę biblioteki, żeby sprawdzić, czy zostały jakieś ślady plamy krwi, nagle z ciemnego kąta wyskoczyły na niego dwie postacie, które dziko wymachiwały rękami nad głowami i wrzasnęły mu do ucha: „BU!”."
    en: "In fact, he was dressed for the character of \"Jonas the Graveless, or the Corpse-Snatcher of Chertsey Barn,\" one of his most remarkable impersonations, and one which the Cantervilles had every reason to remember, as it was the real origin of their quarrel with their neighbour, Lord Rufford. It was about a quarter-past two o'clock in the morning, and, as far as he could ascertain, no one was stirring. As he was strolling towards the library, however, to see if there were any traces left of the blood-stain, suddenly there leaped out on him from a dark corner two figures, who waved their arms wildly above their heads, and shrieked out \"BOO!\" in his ear."
