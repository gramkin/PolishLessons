paragraphs:
  - clean: "Następnego dnia duch był bardzo słaby i zmęczony. Straszliwe przeżycia ostatnich czterech tygodni zaczynały dawać o sobie znać. Nerwy miał zupełnie zszargane i drżał na najmniejszy szelest. Przez pięć dni nie wychodził z pokoju i w końcu postanowił zrezygnować ze sprawy plamy krwi na podłodze biblioteki. Jeśli rodzina Otisów jej nie chciała, to najwyraźniej na nią nie zasługiwała. Byli to najwidoczniej ludzie z niskiego, materialnego poziomu istnienia, zupełnie niezdolni do docenienia symbolicznej wartości zjawisk zmysłowych. Sprawa upiornych zjawień i rozwoju ciał astralnych była oczywiście zupełnie czymś innym i naprawdę nie zależała od niego. Jego uroczystym obowiązkiem było ukazywać się na korytarzu raz w tygodniu i bełkotać z wielkiego wykuszowego okna w pierwszą i trzecią środę każdego miesiąca, i nie widział, jak mógłby z honorem uchylić się od swoich zobowiązań."
    en: "The next day the ghost was very weak and tired. The terrible excitement of the last four weeks was beginning to have its effect. His nerves were completely shattered, and he started at the slightest noise. For five days he kept his room, and at last made up his mind to give up the point of the blood-stain on the library floor. If the Otis family did not want it, they clearly did not deserve it. They were evidently people on a low, material plane of existence, and quite incapable of appreciating the symbolic value of sensuous phenomena. The question of phantasmic apparitions, and the development of astral bodies, was of course quite a different matter, and really not under his control. It was his solemn duty to appear in the corridor once a week, and to gibber from the large oriel window on the first and third Wednesdays in every month, and he did not see how he could honourably escape from his obligations."
    draft: true
    chunks:
