  - clean: "Otisowie jednak się mylili, bo duch wciąż był w domu i choć był teraz niemal inwalidą, wcale nie zamierzał dać spokoju, zwłaszcza że usłyszał, że wśród gości jest młody książę Cheshire, którego stryjeczny dziadek, lord Francis Stilton, założył się kiedyś z pułkownikiem Carburym o sto gwinei, że zagra w kości z duchem Canterville, a następnego ranka znaleziono go leżącego na podłodze pokoju karcianego w stanie tak bezradnego paraliżu, że choć dożył sędziwego wieku, nigdy już nie zdołał powiedzieć nic poza „Dwie szóstki”. Historia była w swoim czasie dobrze znana, choć oczywiście przez wzgląd na uczucia obu szlacheckich rodów starano się ją wszelkimi sposobami zatuszować, a pełny opis wszystkich związanych z nią okoliczności można znaleźć w trzecim tomie „Wspomnień o Księciu Regencie i jego Przyjaciołach” lorda Tattle'a."
    en: "The Otises, however, were deceived, for the ghost was still in the house, and though now almost an invalid, was by no means ready to let matters rest, particularly as he heard that among the guests was the young Duke of Cheshire, whose grand-uncle, Lord Francis Stilton, had once bet a hundred guineas with Colonel Carbury that he would play dice with the Canterville ghost, and was found the next morning lying on the floor of the card-room in such a helpless paralytic state that, though he lived on to a great age, he was never able to say anything again but \"Double Sixes.\" The story was well known at the time, though, of course, out of respect to the feelings of the two noble families, every attempt was made to hush it up, and a full account of all the circumstances connected with it will be found in the third volume of Lord Tattle's Recollections of the Prince Regent and his Friends."
