# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 1
chapterTitle: "Pieśń I"
chapterTitleRu: "Песнь I. Восхождение"
level: B2
paragraphs:
  - clean: "(Inwokacja. Siódmy poranek. Wzlot ku niebu. Pouczenie o wszechświecie)"
    chunks:
      - pl: "(Inwokacja. Siódmy poranek. Wzlot ku niebu. Pouczenie o wszechświecie)"
        ru: "(Воззвание. Седьмое утро. Взлёт к небу. Поучение о вселенной.)"
        note: "inwokacja — воззвание; wzlot — взлёт"
    words: { "poranek": poranek, "niebu": niebo, "wszechświecie": wszechswiat }
  - clean: "Cześć, chwała Tego, który świat porusza,\nNierówny rzuca blask w kole stworzenia;\nByłem ja w niebie, gdzie się rozpromienia\nBlask ten najwięcej i widziałem rzeczy,\nKtórych kto schodzi stamtąd nie powiada\nBo na to słowa nie ma głos człowieczy."
    verse: true
    chunks:
      - pl: "Cześć, chwała Tego, który świat porusza,"
        ru: "Честь, слава Того, кто движет мир,"
      - pl: "\nNierówny rzuca blask w kole stworzenia;"
        ru: "бросает неравный блеск в круге творения;"
      - pl: "\nByłem ja w niebie, gdzie się rozpromienia"
        ru: "я был на небе, где больше всего"
      - pl: "\nBlask ten najwięcej i widziałem rzeczy,"
        ru: "сияет этот блеск, и видел вещи,"
        note: "rozpromieniać się — сиять"
      - pl: "\nKtórych kto schodzi stamtąd nie powiada"
        ru: "о которых тот, кто сходит оттуда, не рассказывает,"
      - pl: "\nBo na to słowa nie ma głos człowieczy."
        ru: "ибо на то нет слов у человеческого голоса."
    words: { "chwała": chwala, "porusza": poruszac, "rzuca": rzucac, "blask": blask, "schodzi": schodzic, "stamtąd": stamtad }
  - clean: "Albowiem nasza zbliżając się dusza\nDo najdroższego swej żądzy przedmiotu,\nTak w nim głęboko i cała zapada,\nŻe pamięć traci, nadzieję powrotu,\nJednak z królestwa świętego zebrany\nSkarbiec piękności w ducha mego cieśni,\nOd dzisiaj będzie treścią mojej pieśni."
    verse: true
    chunks:
      - pl: "Albowiem nasza zbliżając się dusza"
        ru: "Ибо наша душа, приближаясь"
      - pl: "\nDo najdroższego swej żądzy przedmiotu,"
        ru: "к самому дорогому предмету своего желания,"
      - pl: "\nTak w nim głęboko i cała zapada,"
        ru: "так глубоко и вся в нём тонет,"
      - pl: "\nŻe pamięć traci, nadzieję powrotu,"
        ru: "что теряет память, надежду на возвращение."
      - pl: "\nJednak z królestwa świętego zebrany"
        ru: "Однако собранная из святого царства"
      - pl: "\nSkarbiec piękności w ducha mego cieśni,"
        ru: "сокровищница красоты в тесноте моего духа"
      - pl: "\nOd dzisiaj będzie treścią mojej pieśni."
        ru: "отныне будет содержанием моей песни."
    words: { "przedmiotu": przedmiot, "pamięć": pamiec, "królestwa": krolestwo, "Skarbiec": skarbiec, "piękności": pieknosc, "pieśni": piesn }
  - clean: "O! W tej ostatniej pracy, Apollinie,\nZrób ze mnie pełne twej łaski naczynie,\nTakie, by rósł w nim twój laur ukochany.\nDotąd wierzch jeden Parnasu, o Febe!\nStarczył mi, teraz dwóch czuję potrzebę,\nNa resztę drogi i trudów wędrowca."
    verse: true
    chunks:
      - pl: "O! W tej ostatniej pracy, Apollinie,"
        ru: "О! в этом последнем труде, Аполлон,"
      - pl: "\nZrób ze mnie pełne twej łaski naczynie,"
        ru: "сделай из меня сосуд, полный твоей милости,"
      - pl: "\nTakie, by rósł w nim twój laur ukochany."
        ru: "такой, чтобы в нём рос твой возлюбленный лавр."
      - pl: "\nDotąd wierzch jeden Parnasu, o Febe!"
        ru: "До сих пор одна вершина Парнаса, о Феб!"
        note: "у Парнаса две вершины"
      - pl: "\nStarczył mi, teraz dwóch czuję potrzebę,"
        ru: "хватала мне, теперь я чувствую нужду в двух"
      - pl: "\nNa resztę drogi i trudów wędrowca."
        ru: "для остатка пути и трудов странника."
    words: { "naczynie": naczynie, "rósł": rosnac, "ukochany": ukochany, "Dotąd": dotad, "Starczył": starczyc, "trudów": trud }
  - clean: "Znijdź do mnie, niech mnie twój zapał unosi,\nZ jakim hardego członki Marsyjasza\nRad dobywałeś żywe z ich pokrowca.\nO boska siło! Gdy mnie rzeczywiście\nNatchniesz do tyla, że pieśń moja z chwałą\nBłogosławionych królestwa wyśpiewa\nCień, który wrył się w moją duszę całą;\nUjrzysz, jak przyjdę do stóp twego drzewa,\nWieńczyć się w jego nieśmiertelne liście,\nKtórych mnie przedmiot i ty zrobisz godnym."
    verse: true
    chunks:
      - pl: "Znijdź do mnie, niech mnie twój zapał unosi,"
        ru: "Сойди ко мне, пусть меня уносит твой пыл,"
      - pl: "\nZ jakim hardego członki Marsyjasza"
        ru: "с каким ты охотно извлекал живыми"
      - pl: "\nRad dobywałeś żywe z ich pokrowca."
        ru: "члены надменного Марсия из их оболочки."
        note: "pokrowiec — чехол; с Марсия содрали кожу"
      - pl: "\nO boska siło! Gdy mnie rzeczywiście"
        ru: "О божественная сила! Если ты действительно"
      - pl: "\nNatchniesz do tyla, że pieśń moja z chwałą"
        ru: "вдохновишь меня настолько, что моя песнь со славой"
      - pl: "\nBłogosławionych królestwa wyśpiewa"
        ru: "воспоёт тень царства блаженных,"
      - pl: "\nCień, który wrył się w moją duszę całą;"
        ru: "что врезалась во всю мою душу;"
      - pl: "\nUjrzysz, jak przyjdę do stóp twego drzewa,"
        ru: "ты увидишь, как я приду к подножию твоего дерева"
      - pl: "\nWieńczyć się w jego nieśmiertelne liście,"
        ru: "венчаться его бессмертными листьями,"
      - pl: "\nKtórych mnie przedmiot i ty zrobisz godnym."
        ru: "которых меня сделают достойным предмет и ты."
    words: { "boska": boski, "rzeczywiście": rzeczywiscie, "Błogosławionych": blogoslawic, "Cień": cien, "Ujrzysz": ujrzec, "stóp": stopa }
  - clean: "Dzisiaj tak rzadko kto się uszczknąć stara\nLaur na poety triumf lub Cezara\n(Błąd i wstyd woli upadłego ducha) —\nŻe kiedy duch czyj dziś lauru jest głodnym,\nPenejska gałąź powinna wesoło\nRozjaśnić bóstwa delfickiego czoło."
    verse: true
    chunks:
      - pl: "Dzisiaj tak rzadko kto się uszczknąć stara"
        ru: "Ныне так редко кто старается сорвать"
      - pl: "\nLaur na poety triumf lub Cezara"
        ru: "лавр для триумфа поэта или цезаря"
      - pl: "\n(Błąd i wstyd woli upadłego ducha) —"
        ru: "(ошибка и стыд воли падшего духа), —"
      - pl: "\nŻe kiedy duch czyj dziś lauru jest głodnym,"
        ru: "что, когда чей-то дух сегодня голоден до лавра,"
      - pl: "\nPenejska gałąź powinna wesoło"
        ru: "пенейская ветвь должна весело"
        note: "лавр — Дафна, дочь Пенея"
      - pl: "\nRozjaśnić bóstwa delfickiego czoło."
        ru: "озарить чело дельфийского божества."
    words: { "Dzisiaj": dzisiaj, "poety": poeta, "Błąd": blad, "wstyd": wstyd, "ducha": duch, "czoło": czolo }
  - clean: "Za małą iskrą wielki płomień bucha;\nMoże kto po mnie w potężniejszej mowie\nWymodli, że mu Apollo odpowie.\nŚwiatło nam schodzi oknami różnemi,\nLecz jeśli ludziom przez to okno błyska,\nGdzie się w trzy krzyże wiążą cztery kręgi,\nBieg światła lepszy, wpływ jego potęgi\nCzynniej działając na wosk naszej ziemi,\nWyraźniej na nim swą pieczęć wyciska."
    verse: true
    chunks:
      - pl: "Za małą iskrą wielki płomień bucha;"
        ru: "За малой искрой вспыхивает большое пламя;"
      - pl: "\nMoże kto po mnie w potężniejszej mowie"
        ru: "может быть, кто-то после меня в более мощной речи"
      - pl: "\nWymodli, że mu Apollo odpowie."
        ru: "вымолит, что ему ответит Аполлон."
      - pl: "\nŚwiatło nam schodzi oknami różnemi,"
        ru: "Свет сходит к нам через разные окна,"
      - pl: "\nLecz jeśli ludziom przez to okno błyska,"
        ru: "но если людям он блещет через то окно,"
      - pl: "\nGdzie się w trzy krzyże wiążą cztery kręgi,"
        ru: "где четыре круга сплетаются в три креста,"
        note: "точка весеннего равноденствия"
      - pl: "\nBieg światła lepszy, wpływ jego potęgi"
        ru: "бег света лучше, влияние его мощи,"
      - pl: "\nCzynniej działając na wosk naszej ziemi,"
        ru: "деятельнее действуя на воск нашей земли,"
      - pl: "\nWyraźniej na nim swą pieczęć wyciska."
        ru: "отчётливее выдавливает на нём свою печать."
    words: { "płomień": plomien, "krzyże": krzyz, "wiążą": wiazac, "kręgi": krag, "Bieg": bieg, "potęgi": potega }
  - clean: "Ranek tym oknem schodził tam wysoko,\nA tu był wieczór; tam półkula cała,\nGdy nasza czarną, jak dzień była biała.\nA obrócona w lewo Beatryce\nTrzymała w słońcu utkwione źrenice,\nOrle na słońce tak nie patrzy oko."
    verse: true
    chunks:
      - pl: "Ranek tym oknem schodził tam wysoko,"
        ru: "Утро сходило этим окном там, наверху,"
      - pl: "\nA tu był wieczór; tam półkula cała,"
        ru: "а здесь был вечер; там всё полушарие,"
      - pl: "\nGdy nasza czarną, jak dzień była biała."
        ru: "тогда как наше было чёрным, было белым, как день."
      - pl: "\nA obrócona w lewo Beatryce"
        ru: "А Беатриче, обратившись влево,"
      - pl: "\nTrzymała w słońcu utkwione źrenice,"
        ru: "держала зрачки, вперённые в солнце,"
      - pl: "\nOrle na słońce tak nie patrzy oko."
        ru: "орлиный глаз так не смотрит на солнце."
    words: { "oknem": okno, "wieczór": wieczor, "obrócona": obrocic, "Trzymała": trzymac, "słońcu": slonce, "patrzy": patrzec }
  - clean: "Jak drugi promień z pierwszego przez chmurę\nBłyska i znowu podnosi się w górę,\nZ wracającego tęsknotą pielgrzyma;\nTak jej czyn wchodząc w myśl moją oczyma\nZapłodził czyn mój i oczy jak gońce\nPłodnej w czyn myśli posłałem na słońce."
    verse: true
    chunks:
      - pl: "Jak drugi promień z pierwszego przez chmurę"
        ru: "Как второй луч из первого сквозь тучу"
      - pl: "\nBłyska i znowu podnosi się w górę,"
        ru: "вспыхивает и снова поднимается вверх,"
        note: "отражённый луч"
      - pl: "\nZ wracającego tęsknotą pielgrzyma;"
        ru: "подобно возвращающемуся с тоской паломнику;"
      - pl: "\nTak jej czyn wchodząc w myśl moją oczyma"
        ru: "так её действие, входя в мою мысль через глаза,"
      - pl: "\nZapłodził czyn mój i oczy jak gońce"
        ru: "оплодотворило моё действие, и глаза, как гонцов"
      - pl: "\nPłodnej w czyn myśli posłałem na słońce."
        ru: "мысли, плодовитой делами, я послал на солнце."
    words: { "promień": promien, "chmurę": chmura, "podnosi": podnosic, "czyn": czyn, "wchodząc": wchodzic, "posłałem": poslac }
  - clean: "Wiele tam możem siłami naszemi,\nCo niepodobnym zdaje się na ziemi;\nTak działa miejsca dzielność i opieka\nPrzeznaczonego na gniazdo człowieka.\nDługo znieść słońca nie mogła powieka,\nWidziałem tylko jak ognie roznieca,\nJak war żelaza iskrzący się z pieca."
    verse: true
    chunks:
      - pl: "Wiele tam możem siłami naszemi,"
        ru: "Многое мы можем там своими силами,"
      - pl: "\nCo niepodobnym zdaje się na ziemi;"
        ru: "что кажется невозможным на земле;"
      - pl: "\nTak działa miejsca dzielność i opieka"
        ru: "так действует доблесть и опека места,"
      - pl: "\nPrzeznaczonego na gniazdo człowieka."
        ru: "предназначенного гнездом человеку."
        note: "земной рай"
      - pl: "\nDługo znieść słońca nie mogła powieka,"
        ru: "Недолго веко могло вынести солнце,"
      - pl: "\nWidziałem tylko jak ognie roznieca,"
        ru: "я видел лишь, как оно разжигает огни,"
      - pl: "\nJak war żelaza iskrzący się z pieca."
        ru: "как варево железа, искрящееся из печи."
    words: { "zdaje": zdawac, "opieka": opieka, "Przeznaczonego": przeznaczyc, "gniazdo": gniazdo, "znieść": zniesc, "żelaza": zelazo }
  - clean: "I zdało mi się, że od wschodniej strony\nZ dni wielu jeden wielki dzień się zrobił,\nJakby Bóg niebo drugim słońcem zdobił.\nGdy Beatrycze oczy promieniste\nWciąż zatapiała w sfery wiekuiste,\nWzrok mój padł na nią z wysoka zwrócony,\nA spoglądając na nią, jakby w niebie\nDuch mój utonął, wyszedłem sam z siebie,\nJak Glaukus, który skosztowawszy ziela,\nW morskiego boga cudownie się wciela."
    verse: true
    chunks:
      - pl: "I zdało mi się, że od wschodniej strony"
        ru: "И мне показалось, что с восточной стороны"
      - pl: "\nZ dni wielu jeden wielki dzień się zrobił,"
        ru: "из многих дней сделался один великий день,"
      - pl: "\nJakby Bóg niebo drugim słońcem zdobił."
        ru: "будто Бог украсил небо вторым солнцем."
      - pl: "\nGdy Beatrycze oczy promieniste"
        ru: "Пока Беатриче лучистые глаза"
      - pl: "\nWciąż zatapiała w sfery wiekuiste,"
        ru: "всё погружала в вечные сферы,"
      - pl: "\nWzrok mój padł na nią z wysoka zwrócony,"
        ru: "мой взгляд, обращённый с высоты, упал на неё,"
      - pl: "\nA spoglądając na nią, jakby w niebie"
        ru: "и, глядя на неё, будто в небе"
      - pl: "\nDuch mój utonął, wyszedłem sam z siebie,"
        ru: "утонул мой дух, я вышел из самого себя,"
      - pl: "\nJak Glaukus, który skosztowawszy ziela,"
        ru: "как Главк, что, вкусив травы,"
      - pl: "\nW morskiego boga cudownie się wciela."
        ru: "чудесно превращается в морского бога."
    words: { "wschodniej": wschodni, "Wzrok": wzrok, "padł": pasc, "spoglądając": spogladac, "utonął": utonac, "morskiego": morski }
  - clean: "Język słów nie ma, za słabe ich brzmienie,\nWydać naszego ducha przemienienie;\nNiech więc sam przykład starczy temu gwoli,\nKomu tak łaska doświadczać pozwoli.\nCzy tylko byłem, jak niegdyś, stworzoną\nPrzez ciebie duszą jeszcze niewcieloną?"
    verse: true
    chunks:
      - pl: "Język słów nie ma, za słabe ich brzmienie,"
        ru: "У языка нет слов, слишком слаб их звук,"
      - pl: "\nWydać naszego ducha przemienienie;"
        ru: "чтобы выразить преображение нашего духа;"
      - pl: "\nNiech więc sam przykład starczy temu gwoli,"
        ru: "пусть же самый пример будет достаточен тому,"
      - pl: "\nKomu tak łaska doświadczać pozwoli."
        ru: "кому милость позволит это испытать."
      - pl: "\nCzy tylko byłem, jak niegdyś, stworzoną"
        ru: "Был ли я лишь, как некогда, созданной"
      - pl: "\nPrzez ciebie duszą jeszcze niewcieloną?"
        ru: "тобой душой, ещё не воплощённой?"
    words: { "Język": jezyk, "brzmienie": brzmiec, "Wydać": wydac, "przykład": przyklad, "doświadczać": doswiadczac, "stworzoną": stworzyc }
  - clean: "Niebios Rządczyni! Ty wiesz, o Miłości!\nTy, coś mnie wzniosła do ich wysokości.\nO pożądana! Gdy ruch sfer na niebie\nCałą uwagę obrócił na siebie,\nPrzez harmoniję, jaką z nich wywodzisz,\nTony jej sprzęgasz, wznosisz, to łagodzisz."
    verse: true
    chunks:
      - pl: "Niebios Rządczyni! Ty wiesz, o Miłości!"
        ru: "Правительница небес! Ты знаешь, о Любовь!"
        note: "Rządczyni — правительница"
      - pl: "\nTy, coś mnie wzniosła do ich wysokości."
        ru: "Ты, что вознесла меня на их высоту."
      - pl: "\nO pożądana! Gdy ruch sfer na niebie"
        ru: "О желанная! когда движение сфер на небе"
      - pl: "\nCałą uwagę obrócił na siebie,"
        ru: "обратило на себя всё внимание"
      - pl: "\nPrzez harmoniję, jaką z nich wywodzisz,"
        ru: "гармонией, какую ты из них выводишь,"
      - pl: "\nTony jej sprzęgasz, wznosisz, to łagodzisz."
        ru: "ты сплетаешь её тона, возвышаешь, то смягчаешь."
    words: { "Niebios": niebiosa, "wzniosła": wzniesc, "wysokości": wysokosc, "ruch": ruch, "uwagę": uwaga, "wznosisz": wznosic }
  - clean: "Zdało się, niebo od końca do końca\nPłonęło ogniem od płomienia słońca,\nŻe nigdy deszcze lub rzeki gdy wzbiorą,\nWód swoich w szersze nie zlały jezioro.\nA nowość tonów i światłość niezwykła\nTak ich badania żądzą mnie paliła,\nNigdy jej ostrza nie czułem tak żywo!"
    verse: true
    chunks:
      - pl: "Zdało się, niebo od końca do końca"
        ru: "Казалось, небо от края до края"
      - pl: "\nPłonęło ogniem od płomienia słońca,"
        ru: "пылало огнём от пламени солнца,"
      - pl: "\nŻe nigdy deszcze lub rzeki gdy wzbiorą,"
        ru: "так что никогда дожди или реки, когда разольются,"
      - pl: "\nWód swoich w szersze nie zlały jezioro."
        ru: "не сливали своих вод в более широкое озеро."
      - pl: "\nA nowość tonów i światłość niezwykła"
        ru: "А новизна тонов и необычный свет"
      - pl: "\nTak ich badania żądzą mnie paliła,"
        ru: "так жгли меня желанием их исследовать,"
