level: B2
paragraphs:
  - clean: "(Krąg IX. 2. Antenora — ciąg dalszy. 3. Ptolomea. Zdrajcy przyjaciół.)"
    chunks:
      - pl: "(Krąg IX. 2. Antenora — ciąg dalszy. 3. Ptolomea. Zdrajcy przyjaciół.)"
        ru: "(Круг IX. 2. Антенора — продолжение. 3. Толомея. Предатели друзей.)"
    words: { "Krąg": krag, "ciąg": ciag, "dalszy": daleki, "Zdrajcy": zdrajca, "przyjaciół": przyjaciel }
  - clean: "Od strawy dzikiej oderwał paszczękę\nÓw potępieniec i krew z ust ocierał\nWłosami czaszki, której mózg pożerał.\nI mówi: «Srogą chcesz odnawiać mękę,\nSerce mi pęka, nim usta otwieram.\nLecz gdy ze słów mych jak z nasion dojrzeje\nHańba dla zdrajcy, którego pożeram,\nSłuchaj, wypowiem, wypłaczę me dzieje."
    verse: true
    chunks:
      - pl: "Od strawy dzikiej oderwał paszczękę"
        ru: "От дикой трапезы оторвал пасть"
        note: "strawa — пища, трапеза"
      - pl: "\nÓw potępieniec i krew z ust ocierał"
        ru: "тот осуждённый и кровь с губ отирал"
      - pl: "\nWłosami czaszki, której mózg pożerał."
        ru: "волосами черепа, чей мозг пожирал."
        note: "mózg — мозг"
      - pl: "\nI mówi: «Srogą chcesz odnawiać mękę,"
        ru: "И говорит: «Ты хочешь обновить жестокую муку,"
        note: "odnawiać — обновлять"
      - pl: "\nSerce mi pęka, nim usta otwieram."
        ru: "сердце у меня разрывается, прежде чем я открою уста."
      - pl: "\nLecz gdy ze słów mych jak z nasion dojrzeje"
        ru: "Но если из моих слов, как из семян, созреет"
      - pl: "\nHańba dla zdrajcy, którego pożeram,"
        ru: "позор для предателя, которого я пожираю,"
      - pl: "\nSłuchaj, wypowiem, wypłaczę me dzieje."
        ru: "слушай, я выскажу, выплачу свою историю."
        note: "wypłakać — выплакать"
    words: { "czaszki": czaszka, "usta": usta, "otwieram": otwierac, "nasion": nasienie, "Hańba": hanba, "wypowiem": wypowiedziec }
  - clean: "Nie wiem, kto jesteś, przez jaki cud nowy\nZaszedłeś do nas, lecz po dźwięku mowy\nPoznaję w tobie Włocha, florentyna.\nWidzisz przed sobą hrabię Ugolina\nA ten, co teraz jest mej zemsty łupem,\nZwał się Rudżieri, był arcybiskupem."
    verse: true
    chunks:
      - pl: "Nie wiem, kto jesteś, przez jaki cud nowy"
        ru: "Не знаю, кто ты, каким новым чудом"
      - pl: "\nZaszedłeś do nas, lecz po dźwięku mowy"
        ru: "зашёл к нам, но по звуку речи"
      - pl: "\nPoznaję w tobie Włocha, florentyna."
        ru: "узнаю в тебе итальянца, флорентийца."
      - pl: "\nWidzisz przed sobą hrabię Ugolina"
        ru: "Ты видишь перед собой графа Уголино,"
      - pl: "\nA ten, co teraz jest mej zemsty łupem,"
        ru: "а тот, кто теперь добыча моей мести,"
      - pl: "\nZwał się Rudżieri, był arcybiskupem."
        ru: "звался Руджери, был архиепископом."
        note: "arcybiskup — архиепископ"
    words: { "Zaszedłeś": zajsc, "dźwięku": dzwiek, "Poznaję": poznawac, "hrabię": hrabia, "zemsty": zemsta, "Zwał": zwac }
  - clean: "Jak mnie w zdradzieckie usidlono słowa,\nJak nieostrożnie wpadłem w jego ręce,\nNie warto mówić, bo rzecz nie jest nowa.\nLecz o mym zgonie, o mej strasznej męce,\nJeśli nikt wieścią uszu twych nie skaził,\nSłuchaj i osądź, czy on mnie obraził."
    verse: true
    chunks:
      - pl: "Jak mnie w zdradzieckie usidlono słowa,"
        ru: "Как меня опутали коварными словами,"
        note: "usidlić — опутать, поймать в силки"
      - pl: "\nJak nieostrożnie wpadłem w jego ręce,"
        ru: "как я неосторожно попал в его руки,"
      - pl: "\nNie warto mówić, bo rzecz nie jest nowa."
        ru: "не стоит говорить, ибо дело не ново."
      - pl: "\nLecz o mym zgonie, o mej strasznej męce,"
        ru: "Но о моей смерти, о моей страшной муке,"
      - pl: "\nJeśli nikt wieścią uszu twych nie skaził,"
        ru: "если никто вестью не осквернил твоих ушей,"
      - pl: "\nSłuchaj i osądź, czy on mnie obraził."
        ru: "слушай и суди, оскорбил ли он меня."
    words: { "zgonie": zgon, "strasznej": straszny, "wieścią": wiesc, "uszu": ucho, "osądź": osadzic, "obraził": obrazic }
  - clean: "Jest w głębi wieży podziemna pieczara,\nSławna mym zgonem; dziś może w niej jęczy\nNa nowo jaka niewinna ofiara.\nTam okiem witym z żelaznych obręczy,\nWidziałem mnogich księżyców oblicze,\nAż mnie raz we śnie przywidziana mara\nZdarła przyszłości chmury tajemnicze."
    verse: true
    chunks:
      - pl: "Jest w głębi wieży podziemna pieczara,"
        ru: "Есть в глубине башни подземная пещера,"
        note: "pieczara — пещера; «Башня голода» в Пизе"
      - pl: "\nSławna mym zgonem; dziś może w niej jęczy"
        ru: "славная моей смертью; сегодня, может, в ней стонет"
      - pl: "\nNa nowo jaka niewinna ofiara."
        ru: "вновь какая-нибудь невинная жертва."
      - pl: "\nTam okiem witym z żelaznych obręczy,"
        ru: "Там сквозь отверстие, свитое из железных обручей,"
        note: "obręcz — обруч"
      - pl: "\nWidziałem mnogich księżyców oblicze,"
        ru: "я видел лик многих лун,"
        note: "mnogi — многий"
      - pl: "\nAż mnie raz we śnie przywidziana mara"
        ru: "пока однажды во сне привидевшийся призрак"
        note: "przywidziany — привидевшийся"
      - pl: "\nZdarła przyszłości chmury tajemnicze."
        ru: "не сорвал таинственные тучи будущего."
    words: { "głębi": glab, "wieży": wieza, "podziemna": podziemny, "Sławna": slawny, "oblicze": oblicze, "chmury": chmura }
  - clean: "Przyśniło mi się, że biskup zawzięty\nPolował wilka z małymi wilczęty,\nNa owej górze, co wzniosłymi szranki\nZ pizańską ziemią i Lukką graniczy.\nJuż chudą psiarnię zemkniono ze smyczy,\nHrabia Gwalandi, Sismondi, Lanfranki\nSzczują na czele, zdobycz będzie łatwa:\nJuż wilk znużone zatrzymuje kroki,\nUpada wreszcie i ojciec, i dziatwa:\nI widzę kłami rozprute ich boki."
    verse: true
    chunks:
      - pl: "Przyśniło mi się, że biskup zawzięty"
        ru: "Мне приснилось, что ожесточённый епископ"
      - pl: "\nPolował wilka z małymi wilczęty,"
        ru: "охотился на волка с малыми волчатами"
        note: "wilczę — волчонок"
      - pl: "\nNa owej górze, co wzniosłymi szranki"
        ru: "на той горе, что высокими преградами"
        note: "szranki — преграды"
      - pl: "\nZ pizańską ziemią i Lukką graniczy."
        ru: "граничит с пизанской землёй и Луккой."
      - pl: "\nJuż chudą psiarnię zemkniono ze smyczy,"
        ru: "Уже тощую свору спустили со своры,"
        note: "zemknąć ze smyczy — спустить с поводка"
      - pl: "\nHrabia Gwalandi, Sismondi, Lanfranki"
        ru: "граф Гуаланди, Сисмонди, Ланфранки"
      - pl: "\nSzczują na czele, zdobycz będzie łatwa:"
        ru: "травят во главе, добыча будет лёгкой:"
        note: "szczuć — травить"
      - pl: "\nJuż wilk znużone zatrzymuje kroki,"
        ru: "уже волк останавливает усталые шаги,"
      - pl: "\nUpada wreszcie i ojciec, i dziatwa:"
        ru: "падают наконец и отец, и детвора:"
        note: "dziatwa — детвора"
      - pl: "\nI widzę kłami rozprute ich boki."
        ru: "и вижу — клыками вспороты их бока."
        note: "rozpruty — вспоротый"
    words: { "Polował": polowac, "wilka": wilk, "chudą": chudy, "czele": czolo, "zatrzymuje": zatrzymywac, "boki": bok }
  - clean: "Budzę się! Jeszcze noc nie zeszła z nieba,\nJuż moje dziatki, wspólniki niewoli,\nSzlochają przez sen i wołają: »chleba!«.\nO! Jeśli dotąd serce ci nie boli,\nKiedy pomyślisz, co się we mnie działo\nI co me serce nadal przeczuwało,\nJeśli nie płaczesz, któż ci łzy wyciśnie?"
    verse: true
    chunks:
      - pl: "Budzę się! Jeszcze noc nie zeszła z nieba,"
        ru: "Просыпаюсь! Ещё ночь не сошла с неба,"
      - pl: "\nJuż moje dziatki, wspólniki niewoli,"
        ru: "а мои детки, товарищи по неволе,"
        note: "dziatki — детки"
      - pl: "\nSzlochają przez sen i wołają: »chleba!«."
        ru: "рыдают во сне и зовут: „Хлеба!“"
      - pl: "\nO! Jeśli dotąd serce ci nie boli,"
        ru: "О! если до сих пор у тебя сердце не болит,"
      - pl: "\nKiedy pomyślisz, co się we mnie działo"
        ru: "когда подумаешь, что во мне происходило"
      - pl: "\nI co me serce nadal przeczuwało,"
        ru: "и что моё сердце ещё предчувствовало,"
        note: "przeczuwać — предчувствовать"
      - pl: "\nJeśli nie płaczesz, któż ci łzy wyciśnie?"
        ru: "если не плачешь, кто же у тебя выжмет слёзы?"
    words: { "Budzę": budzic, "nieba": niebo, "wołają": wolac, "chleba": chleb, "dotąd": dotad, "płaczesz": plakac }
  - clean: "Budzą się dzieci, wkrótce chwila błyśnie,\nW której nam zwykle udzielano strawy,\nLecz na sen pomnąc truchlałem z obawy.\nWtem z bram więzienia łoskot mnie doleci,\nZamurowano! — spojrzałem na dzieci,\nSpojrzałem z niemej wyrazem rozpaczy;\nA w głębi serca czułem mróz jak w grobie."
    verse: true
    chunks:
      - pl: "Budzą się dzieci, wkrótce chwila błyśnie,"
        ru: "Просыпаются дети, вскоре блеснёт минута,"
      - pl: "\nW której nam zwykle udzielano strawy,"
        ru: "когда нам обычно давали пищу,"
        note: "udzielać — уделять, давать"
      - pl: "\nLecz na sen pomnąc truchlałem z obawy."
        ru: "но, помня о сне, я трепетал от страха."
        note: "truchleć — трепетать"
      - pl: "\nWtem z bram więzienia łoskot mnie doleci,"
        ru: "Вдруг от ворот темницы долетает до меня грохот:"
      - pl: "\nZamurowano! — spojrzałem na dzieci,"
        ru: "замуровали! — я взглянул на детей,"
      - pl: "\nSpojrzałem z niemej wyrazem rozpaczy;"
        ru: "взглянул с выражением немого отчаяния;"
      - pl: "\nA w głębi serca czułem mróz jak w grobie."
        ru: "а в глубине сердца чувствовал мороз, как в могиле."
    words: { "bram": brama, "doleci": doleciec, "wyrazem": wyraz, "rozpaczy": rozpacz, "mróz": mroz, "grobie": grob }
  - clean: "Gwido mój mały wołał: »Co to znaczy,\nTak dziko patrzysz? Ojcze mój, co tobie?«\nNie mogłem mówić, ni łzy z oczu dostać,\nMilczałem długo — aż do nocy końca.\nNazajutrz do nas zbłądził promyk słońca\nI w twarzach dzieci ujrzałem mą postać."
    verse: true
    chunks:
      - pl: "Gwido mój mały wołał: »Co to znaczy,"
        ru: "Мой маленький Гвидо крикнул: „Что это значит,"
      - pl: "\nTak dziko patrzysz? Ojcze mój, co tobie?«"
        ru: "ты так дико смотришь? Отец мой, что с тобой?“"
      - pl: "\nNie mogłem mówić, ni łzy z oczu dostać,"
        ru: "Я не мог говорить, ни выдавить слезы из глаз,"
      - pl: "\nMilczałem długo — aż do nocy końca."
        ru: "я долго молчал — до конца ночи."
      - pl: "\nNazajutrz do nas zbłądził promyk słońca"
        ru: "Назавтра к нам забрёл лучик солнца,"
      - pl: "\nI w twarzach dzieci ujrzałem mą postać."
        ru: "и в лицах детей я увидел свой облик."
        note: "то есть их лица, иссохшие, как моё"
    words: { "Milczałem": milczec, "Nazajutrz": nazajutrz, "słońca": slonce, "twarzach": twarz, "ujrzałem": ujrzec, "postać": postac }
  - clean: "Natenczas z bólu gryzłem obie ręce.\nSynowie myśląc, że mnie głód tak pali,\nŁamiąc rączęta ze łzami wołali:\n»Ojcze kochany, ulżyj twojej męce,\nZjedz twoje dzieci, tyś nas ubrał w ciało,\nTobie nas biednych rozebrać przystało«. —\nMusiałem milczeć i ból w sobie morzyć,\nWkrótce i mowa w ustach nam zamarła!"
    verse: true
    chunks:
      - pl: "Natenczas z bólu gryzłem obie ręce."
        ru: "Тогда от боли я грыз обе руки."
      - pl: "\nSynowie myśląc, że mnie głód tak pali,"
        ru: "Сыновья, думая, что меня так жжёт голод,"
      - pl: "\nŁamiąc rączęta ze łzami wołali:"
        ru: "ломая ручонки, со слезами взывали:"
        note: "rączęta — ручонки"
      - pl: "\n»Ojcze kochany, ulżyj twojej męce,"
        ru: "„Отец дорогой, облегчи свою муку,"
      - pl: "\nZjedz twoje dzieci, tyś nas ubrał w ciało,"
        ru: "съешь своих детей, ты одел нас в плоть,"
      - pl: "\nTobie nas biednych rozebrać przystało«. —"
        ru: "тебе и подобает раздеть нас, бедных“. —"
      - pl: "\nMusiałem milczeć i ból w sobie morzyć,"
        ru: "Я должен был молчать и глушить в себе боль,"
        note: "morzyć — глушить, морить"
      - pl: "\nWkrótce i mowa w ustach nam zamarła!"
        ru: "вскоре и речь замерла у нас в устах!"
    words: { "głód": glod, "Łamiąc": lamac, "łzami": lza, "ulżyj": ulzyc, "rozebrać": rozebrac, "morzyć": morzyc }
  - clean: "Jęczeć nie śmiałem, by dzieci nie trwożyć.\nO ziemio, czemuś ty nas nie pożarła!\nWeszło czwartego dnia światło zabójcze,\nAnzelmek mały przywlekł się pod nogi\nI przerażony wolał: »Ojcze drogi!\nAch! Czemu ty nas nie ratujesz, ojcze?«\nWołał i skonał! — Jak mnie tu widzicie,\nTak ja widziałem wszystkie dzieci moje\nJedno po drugim — wszystkich było troje,\nWszystkie u nóg mych zakończyły życie."
    verse: true
    chunks:
      - pl: "Jęczeć nie śmiałem, by dzieci nie trwożyć."
        ru: "Стонать я не смел, чтобы не пугать детей."
      - pl: "\nO ziemio, czemuś ty nas nie pożarła!"
        ru: "О земля, почему ты нас не поглотила!"
      - pl: "\nWeszło czwartego dnia światło zabójcze,"
        ru: "Наступил четвёртого дня убийственный свет,"
      - pl: "\nAnzelmek mały przywlekł się pod nogi"
        ru: "маленький Ансельм приполз мне под ноги"
        note: "przywlec się — приползти"
      - pl: "\nI przerażony wolał: »Ojcze drogi!"
        ru: "и испуганно позвал: „Отец дорогой!"
      - pl: "\nAch! Czemu ty nas nie ratujesz, ojcze?«"
        ru: "Ах! Почему ты нас не спасаешь, отец?“"
      - pl: "\nWołał i skonał! — Jak mnie tu widzicie,"
        ru: "Позвал и умер! — Как вы видите меня здесь,"
      - pl: "\nTak ja widziałem wszystkie dzieci moje"
        ru: "так я видел всех моих детей,"
      - pl: "\nJedno po drugim — wszystkich było troje,"
        ru: "одного за другим — всех их было трое,"
        note: "у Данте — четверо"
      - pl: "\nWszystkie u nóg mych zakończyły życie."
        ru: "все у моих ног кончили жизнь."
    words: { "ziemio": ziemia, "światło": swiatlo, "zabójcze": zabojczy, "nogi": noga, "ratujesz": ratowac, "zakończyły": zakonczyc }
  - clean: "Od zwłok jednego do drugiego biegłem,\nŚlepy na trupach potknąwszy się ległem.\nDzień jeszcze siódmy do słońca zachodu,\nKrzyczałem z żalu, a na koniec — z głodu,\nBo głód był jeszcze sroższy od żałości».\nSkończył i dziko wywróciwszy oczy,\nNa nowo usta w krwawą czaszkę broczy,\nI jak pies zębem zgrzytając, rwie kości."
    verse: true
    chunks:
      - pl: "Od zwłok jednego do drugiego biegłem,"
        ru: "От тела одного к другому я бежал,"
        note: "zwłoki — тело умершего"
      - pl: "\nŚlepy na trupach potknąwszy się ległem."
        ru: "слепой, споткнувшись о трупы, я упал."
        note: "potknąć się — споткнуться"
      - pl: "\nDzień jeszcze siódmy do słońca zachodu,"
        ru: "Ещё седьмой день до захода солнца"
      - pl: "\nKrzyczałem z żalu, a na koniec — z głodu,"
        ru: "я кричал от горя, а под конец — от голода,"
      - pl: "\nBo głód był jeszcze sroższy od żałości»."
        ru: "ибо голод был ещё сильнее скорби»."
        note: "żałość — скорбь"
      - pl: "\nSkończył i dziko wywróciwszy oczy,"
        ru: "Он кончил и, дико закатив глаза,"
      - pl: "\nNa nowo usta w krwawą czaszkę broczy,"
        ru: "снова впился зубами в окровавленный череп"
        note: "broczyć — здесь «вгрызаться в кровь»"
      - pl: "\nI jak pies zębem zgrzytając, rwie kości."
        ru: "и, как пёс, скрежеща зубом, рвёт кости."
    words: { "biegłem": biec, "Ślepy": slepy, "zachodu": zachod, "żalu": zal, "krwawą": krwawy, "zębem": zab }
  - clean: "O Pizo! hańbo pięknej ziemi włoskiej,\nKędy si dźwięczy tak miękkimi głoski;\nGdy cię nie karzą leniwe sąsiady,\nNiechaj się nagle wzruszą z swej posady\nSąsiednie wyspy, Kapraja, Gorgona,\nZahaczą Arnę, gdzie jej ujście kona;\nNiech tak szeroko roztoczy swe tonie,\nAż wszystkich twoich mieszkańców pochłonie."
    verse: true
    chunks:
      - pl: "O Pizo! hańbo pięknej ziemi włoskiej,"
