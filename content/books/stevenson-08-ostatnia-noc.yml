  - clean: "— Zna pan zwyczaje doktora, proszę pana — odparł Poole — i to, jak się zamyka. Otóż znowu zamknął się w gabinecie; i nie podoba mi się to, proszę pana… niech skonam, jeśli mi się to podoba. Panie Utterson, proszę pana, ja się boję."
    en: "“You know the doctor’s ways, sir,” replied Poole, “and how he shuts himself up. Well, he’s shut up again in the cabinet; and I don’t like it, sir—I wish I may die if I like it. Mr. Utterson, sir, I’m afraid.”"
