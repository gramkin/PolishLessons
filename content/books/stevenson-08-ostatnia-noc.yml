  - clean: "Jedyną odpowiedzią pana Uttersona było to, że wstał i sięgnął po kapelusz i płaszcz; ale ze zdziwieniem zauważył, jak wielka ulga odmalowała się na twarzy kamerdynera, i, być może, z nie mniejszym, że wino wciąż było nietknięte, gdy ten odstawiał kieliszek, by pójść za nim."
