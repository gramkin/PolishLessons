  - clean: "— Boję się już od tygodnia — odparł Poole, uparcie pomijając pytanie — i nie mogę już tego znieść."
    en: "“I’ve been afraid for about a week,” returned Poole, doggedly disregarding the question, “and I can bear it no more.”"
    draft: true
    chunks:
