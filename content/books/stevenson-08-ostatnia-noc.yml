  - clean: "— Na Boga, Poole, co cię tu sprowadza? — zawołał; a potem, przyjrzawszy mu się powtórnie, dodał: — Co ci jest? Czy doktor zachorował?"
    en: "“Bless me, Poole, what brings you here?” he cried; and then taking a second look at him, “What ails you?” he added; “is the doctor ill?”"
    draft: true
    chunks:
      - pl: "— Na Boga, Poole, co cię tu sprowadza? — zawołał;"
