  - clean: "Na placu, gdy tam dotarli, było pełno wiatru i kurzu, a cienkie drzewa w ogrodzie smagały się o ogrodzenie. Poole, który przez całą drogę szedł krok czy dwa z przodu, zatrzymał się teraz na środku chodnika i mimo przenikliwego zimna zdjął kapelusz i otarł czoło czerwoną chusteczką. Ale choć szedł pospiesznie, nie był to pot z wysiłku, który ocierał, lecz wilgoć jakiejś dławiącej trwogi; bo twarz miał białą, a głos, gdy się odezwał, szorstki i łamiący się."
    en: "The square, when they got there, was full of wind and dust, and the thin trees in the garden were lashing themselves along the railing. Poole, who had kept all the way a pace or two ahead, now pulled up in the middle of the pavement, and in spite of the biting weather, took off his hat and mopped his brow with a red pocket-handkerchief. But for all the hurry of his coming, these were not the dews of exertion that he wiped away, but the moisture of some strangling anguish; for his face was white and his voice, when he spoke, harsh and broken."
    draft: true
    chunks:
      - pl: "Na placu, gdy tam dotarli, było pełno wiatru i kurzu,"
        ru: "На площади, когда они туда добрались, было полно ветра и пыли,"
      - pl: " a cienkie drzewa w ogrodzie smagały się o ogrodzenie."
