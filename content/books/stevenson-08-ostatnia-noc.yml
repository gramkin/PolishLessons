  - clean: "— Siadaj, a tu masz kieliszek wina — rzekł adwokat. — A teraz nie spiesz się i powiedz mi jasno, czego chcesz."
    en: "“Take a seat, and here is a glass of wine for you,” said the lawyer. “Now, take your time, and tell me plainly what you want.”"
    draft: true
    chunks:
