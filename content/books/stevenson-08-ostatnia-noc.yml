      - pl: " i mimo przenikliwego zimna zdjął kapelusz i otarł czoło czerwoną chusteczką."
        ru: "и, несмотря на пронизывающий холод, снял шляпу и вытер лоб красным платком."
        note: "otrzeć — вытереть"
