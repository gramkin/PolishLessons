  - clean: "Była to dzika, zimna, prawdziwie marcowa noc, z bladym księżycem, leżącym na plecach, jakby go przechylił wiatr, i z pędzącymi strzępami chmur najdelikatniejszej, przejrzystej jak batyst tkanki. Wiatr utrudniał rozmowę i napędzał krew do twarzy. Zdawało się też, że wymiótł ulice z przechodniów bardziej niż zwykle; bo pan Utterson pomyślał, że nigdy nie widział tej części Londynu tak opustoszałej. Wolałby, żeby było inaczej; nigdy w życiu nie czuł tak ostrego pragnienia, by widzieć i dotykać bliźnich; bo choć walczył ze sobą, jak mógł, w jego umysł wdzierało się przytłaczające przeczucie nieszczęścia."
    en: "It was a wild, cold, seasonable night of March, with a pale moon, lying on her back as though the wind had tilted her, and flying wrack of the most diaphanous and lawny texture. The wind made talking difficult, and flecked the blood into the face. It seemed to have swept the streets unusually bare of passengers, besides; for Mr. Utterson thought he had never seen that part of London so deserted. He could have wished it otherwise; never in his life had he been conscious of so sharp a wish to see and touch his fellow-creatures; for struggle as he might, there was borne in upon his mind a crushing anticipation of calamity."
    draft: true
