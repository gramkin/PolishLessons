    words: { "Boję": bac, "tygodnia": tydzien, "odparł": odeprzec, "pomijając": pomijac, "mogę": moc, "znieść": zniesc }
  - clean: "Wygląd tego człowieka w pełni potwierdzał jego słowa; jego zachowanie zmieniło się na gorsze; i poza chwilą, gdy po raz pierwszy oznajmił swój strach, ani razu nie spojrzał adwokatowi w twarz. Nawet teraz siedział z nietkniętym kieliszkiem wina na kolanie, z oczami wbitymi w kąt podłogi. — Nie mogę już tego znieść — powtórzył."
    en: "The man’s appearance amply bore out his words; his manner was altered for the worse; and except for the moment when he had first announced his terror, he had not once looked the lawyer in the face. Even now, he sat with the glass of wine untasted on his knee, and his eyes directed to a corner of the floor. “I can bear it no more,” he repeated."
    draft: true
    chunks:
      - pl: "Wygląd tego człowieka w pełni potwierdzał jego słowa;"
        ru: "Вид этого человека вполне подтверждал его слова;"
