  - clean: "Pewnego wieczoru po obiedzie pan Utterson siedział przy kominku, gdy ku swemu zdziwieniu otrzymał wizytę Poole'a."
    en: "Mr. Utterson was sitting by his fireside one evening after dinner, when he was surprised to receive a visit from Poole."
    draft: true
    chunks:
      - pl: "Pewnego wieczoru po obiedzie pan Utterson siedział przy kominku,"
        ru: "Однажды вечером после обеда мистер Аттерсон сидел у камина,"
      - pl: " gdy ku swemu zdziwieniu otrzymał wizytę Poole'a."
