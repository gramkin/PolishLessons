  - clean: "Tak Beatrycze, jak piszę, mówiła:\nI pełna żądzy potem się zwróciła\nW stronę, gdzie więcej płomieni się słońce,\nA jej milczenie, twarz zmieniona cała,\nKazały milczeć, spuściłem w dół głowę,\nW której już snuła myśl pytania nowe."
    verse: true
    chunks:
      - pl: "Tak Beatrycze, jak piszę, mówiła:"
        ru: "Так Беатриче, как я пишу, говорила:"
