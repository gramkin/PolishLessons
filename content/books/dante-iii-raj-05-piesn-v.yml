    words: { "Dodatek": dodatek, "ślubach": slub }
  - clean: "«Gdy tu, w tym środku gorącej miłości,\nJa świecę tobie płomienniej i żywiej\nNad wszystkie ziemskich blasków wielmożności,\nTak, że zwyciężam twoich oczu siłę;\nNie dziw się, robi to wzrok doskonały,\nKtóry pochwyca szybko przedmiot cały,\nA raz schwyciwszy, bada nie leniwiej."
    verse: true
    chunks:
      - pl: "«Gdy tu, w tym środku gorącej miłości,"
        ru: "«Если здесь, в этом средоточии горячей любви,"
      - pl: "\nJa świecę tobie płomienniej i żywiej"
        ru: "я свечу тебе пламеннее и живее"
      - pl: "\nNad wszystkie ziemskich blasków wielmożności,"
        ru: "превыше всех величий земных блесков,"
        note: "wielmożność — величие"
      - pl: "\nTak, że zwyciężam twoich oczu siłę;"
        ru: "так что побеждаю силу твоих глаз;"
      - pl: "\nNie dziw się, robi to wzrok doskonały,"
        ru: "не удивляйся: это делает совершенное зрение,"
      - pl: "\nKtóry pochwyca szybko przedmiot cały,"
        ru: "что быстро схватывает весь предмет"
      - pl: "\nA raz schwyciwszy, bada nie leniwiej."
        ru: "и, раз схватив, исследует неленивее."
    words: { "żywiej": zywo, "ziemskich": ziemski, "blasków": blask, "wzrok": wzrok, "doskonały": doskonaly, "przedmiot": przedmiot }
  - clean: "Już widzę jasno, jak w tym duchu świta\nJasność od światła wiecznego odbita,\nKtórego widok w nas miłość zapala.\nA jeśli inne rzeczy tobie miłe\nPorwą twe serce jako łódkę fala,\nBlask tegoż światła, ale źle poznany,\nBędzie ci świecił przez przedmiot kochany."
    verse: true
    chunks:
      - pl: "Już widzę jasno, jak w tym duchu świta"
        ru: "Я уже ясно вижу, как в этом духе брезжит"
      - pl: "\nJasność od światła wiecznego odbita,"
        ru: "ясность, отражённая от вечного света,"
      - pl: "\nKtórego widok w nas miłość zapala."
        ru: "вид которого зажигает в нас любовь."
      - pl: "\nA jeśli inne rzeczy tobie miłe"
        ru: "А если иные вещи, тебе милые,"
      - pl: "\nPorwą twe serce jako łódkę fala,"
        ru: "увлекут твоё сердце, как волна лодку,"
      - pl: "\nBlask tegoż światła, ale źle poznany,"
        ru: "то блеск этого же света, но дурно познанный,"
      - pl: "\nBędzie ci świecił przez przedmiot kochany."
        ru: "будет светить тебе через любимый предмет."
    words: { "Jasność": jasnosc, "wiecznego": wieczny, "odbita": odbic, "łódkę": lodka, "fala": fala, "świecił": swiecic }
  - clean: "Chcesz wiedzieć, można li przez inne dzieła,\nPrzez żal, modlitwę, jaką wolno prosić,\nZłamanym ślubom uczynić zadosyć,\nAżeby duszę ustrzec od zgryzoty?»\nTak Beatrycze, tak tę pieśń poczęła,\nI jak mówiący człowiek nieprzerwanie,\nCiągle swe święte snuła nauczanie."
    verse: true
    chunks:
      - pl: "Chcesz wiedzieć, można li przez inne dzieła,"
        ru: "Ты хочешь знать, можно ли иными делами,"
      - pl: "\nPrzez żal, modlitwę, jaką wolno prosić,"
        ru: "сожалением, молитвой, какой позволено просить,"
      - pl: "\nZłamanym ślubom uczynić zadosyć,"
        ru: "удовлетворить за нарушенные обеты,"
      - pl: "\nAżeby duszę ustrzec od zgryzoty?»"
        ru: "чтобы уберечь душу от угрызений?»"
      - pl: "\nTak Beatrycze, tak tę pieśń poczęła,"
        ru: "Так Беатриче начала эту песнь"
      - pl: "\nI jak mówiący człowiek nieprzerwanie,"
        ru: "и, как человек, говорящий без перерыва,"
      - pl: "\nCiągle swe święte snuła nauczanie."
        ru: "непрестанно вела своё святое поучение."
    words: { "dzieła": dzielo, "modlitwę": modlitwa, "uczynić": uczynic, "zgryzoty": zgryzota, "pieśń": piesn, "poczęła": poczac }
  - clean: "«Największym darem, jaki z swej szczodroty\nBóg dał, nas tworząc, który jako zgodny\nZ jego dobrocią sam najwyżej ceni,\nJest wolna wola; dar istot przyrodny\nMających rozum. Teraz rzutem oka\nW głąb tej zasady zajrzyj do jej rdzeni,\nA poznasz, wartość ślubu jak wysoka!"
    verse: true
    chunks:
      - pl: "«Największym darem, jaki z swej szczodroty"
        ru: "«Величайший дар, какой по своей щедрости"
      - pl: "\nBóg dał, nas tworząc, który jako zgodny"
        ru: "Бог дал, создавая нас, который, как согласный"
      - pl: "\nZ jego dobrocią sam najwyżej ceni,"
        ru: "с его добротой, он сам ценит выше всего,"
      - pl: "\nJest wolna wola; dar istot przyrodny"
        ru: "есть свободная воля; природный дар существ,"
      - pl: "\nMających rozum. Teraz rzutem oka"
        ru: "имеющих разум. Теперь взглядом"
      - pl: "\nW głąb tej zasady zajrzyj do jej rdzeni,"
        ru: "загляни в глубину этого начала до его сердцевины,"
      - pl: "\nA poznasz, wartość ślubu jak wysoka!"
        ru: "и ты узнаешь, как высока цена обета!"
    words: { "zgodny": zgodny, "dobrocią": dobroc, "ceni": cenic, "rzutem": rzut, "głąb": glab, "rdzeni": rdzen }
  - clean: "Jeśli go w tobie tak wola uchwala,\nŻe sam przyzwalasz i Bóg nań przyzwala,\nZ Bogiem gdy staje umowa człowieka,\nWtedy się człowiek skarbu woli zrzeka:\nPo tej ofierze cóż ma dać w zamianę?\nGdy dary przez cię raz ofiarowane\nMyślisz używać jak godziwą własność,\nTo jedno, jakbyś zły bogactw nabytek\nPragnął obrócić na dobry pożytek."
    verse: true
    chunks:
      - pl: "Jeśli go w tobie tak wola uchwala,"
        ru: "Если воля в тебе принимает его так,"
      - pl: "\nŻe sam przyzwalasz i Bóg nań przyzwala,"
        ru: "что ты сам соглашаешься и Бог на него соглашается,"
      - pl: "\nZ Bogiem gdy staje umowa człowieka,"
        ru: "когда заключается договор человека с Богом,"
      - pl: "\nWtedy się człowiek skarbu woli zrzeka:"
        ru: "тогда человек отрекается от сокровища воли:"
      - pl: "\nPo tej ofierze cóż ma dać w zamianę?"
        ru: "после этой жертвы что дать в замену?"
      - pl: "\nGdy dary przez cię raz ofiarowane"
        ru: "Если дары, однажды тобой пожертвованные,"
      - pl: "\nMyślisz używać jak godziwą własność,"
        ru: "ты думаешь употреблять как законную собственность,"
      - pl: "\nTo jedno, jakbyś zły bogactw nabytek"
        ru: "то это всё равно, как если бы дурное приобретение богатств"
      - pl: "\nPragnął obrócić na dobry pożytek."
        ru: "ты хотел обратить на доброе дело."
    words: { "zamianę": zamiana, "dary": dar, "własność": wlasnosc, "bogactw": bogactwo, "Pragnął": pragnac, "obrócić": obrocic }
  - clean: "Głównego punktu widzisz całą jasność,\nLecz ci tej prawdzie przeczy Kościół święty,\nRozwiązujący ślub z woli poczęty.\nZaczekaj chwilę, nie wstawaj od stołu,\nAbym ci pokarm ciężki od strawienia\nPomogła przeżuć i strawić pospołu."
    verse: true
    chunks:
      - pl: "Głównego punktu widzisz całą jasność,"
        ru: "Ты видишь всю ясность главного пункта,"
      - pl: "\nLecz ci tej prawdzie przeczy Kościół święty,"
        ru: "но этой истине тебе противоречит святая Церковь,"
      - pl: "\nRozwiązujący ślub z woli poczęty."
        ru: "разрешающая обет, зачатый по воле."
      - pl: "\nZaczekaj chwilę, nie wstawaj od stołu,"
        ru: "Подожди немного, не вставай из-за стола,"
      - pl: "\nAbym ci pokarm ciężki od strawienia"
        ru: "чтобы я помогла тебе пережевать и переварить"
      - pl: "\nPomogła przeżuć i strawić pospołu."
        ru: "пищу, тяжёлую для пищеварения."
    words: { "Głównego": glowny, "przeczy": przeczyc, "Kościół": kosciol, "święty": swiety, "wstawaj": wstawac, "stołu": stol }
  - clean: "Otwórz na ścieżaj myśli furtki obie\nPrzy wejściu słów mych, a zamknij je w sobie:\nNie dość, że wchodzi nauka uszami,\nZwietrzeje, gdy ją pamięć nie zatrzyma.\nTreść ślubu wiążą dwie rzeczy koniecznie,\nPierwszą, naszego przedmiot poświęcenia,\nDrugą jest w sobie żyjąca umowa:\nOstatnia nigdy niestarta trwa wiecznie,\nJak cię objaśnia wyżej moja mowa."
    verse: true
    chunks:
      - pl: "Otwórz na ścieżaj myśli furtki obie"
        ru: "Открой настежь обе калитки мысли"
        note: "furtka — калитка"
      - pl: "\nPrzy wejściu słów mych, a zamknij je w sobie:"
        ru: "при входе моих слов и запри их в себе:"
      - pl: "\nNie dość, że wchodzi nauka uszami,"
        ru: "недостаточно, что наука входит в уши,"
      - pl: "\nZwietrzeje, gdy ją pamięć nie zatrzyma."
        ru: "она выветрится, если память её не удержит."
      - pl: "\nTreść ślubu wiążą dwie rzeczy koniecznie,"
        ru: "Суть обета связывают непременно две вещи:"
      - pl: "\nPierwszą, naszego przedmiot poświęcenia,"
        ru: "первая — предмет нашего посвящения,"
        note: "poświęcenie — посвящение, жертва"
      - pl: "\nDrugą jest w sobie żyjąca umowa:"
        ru: "вторая — живущий в себе договор:"
      - pl: "\nOstatnia nigdy niestarta trwa wiecznie,"
        ru: "последний никогда не стирается и длится вечно,"
      - pl: "\nJak cię objaśnia wyżej moja mowa."
        ru: "как выше объясняет тебе моя речь."
    words: { "nauka": nauka, "uszami": ucho, "pamięć": pamiec, "wiążą": wiazac, "koniecznie": koniecznie, "wiecznie": wiecznie }
  - clean: "Stąd u Hebreów konieczność ofiary,\nTaki Lewitów był obyczaj stary,\nChoć ich ofiara dość często się zmienia.\nCo do przedmiotu ofiary niezdrożna\nZamiana, jeśli zastąpić ją można\nDrugą ofiarą, gdy jest równie święta."
    verse: true
    chunks:
      - pl: "Stąd u Hebreów konieczność ofiary,"
        ru: "Отсюда у евреев необходимость жертвы,"
      - pl: "\nTaki Lewitów był obyczaj stary,"
        ru: "таков был древний обычай левитов,"
      - pl: "\nChoć ich ofiara dość często się zmienia."
        ru: "хоть их жертва довольно часто меняется."
      - pl: "\nCo do przedmiotu ofiary niezdrożna"
        ru: "Что до предмета жертвы, не беззаконна"
      - pl: "\nZamiana, jeśli zastąpić ją można"
        ru: "замена, если её можно заменить"
      - pl: "\nDrugą ofiarą, gdy jest równie święta."
        ru: "другой жертвой, когда та столь же свята."
    words: { "konieczność": koniecznosc, "ofiary": ofiara, "często": czesto, "zmienia": zmieniac, "zastąpić": zastapic, "równie": rownie }
  - clean: "Lecz nikt nie może, jak Kościół poucza,\nCiężaru z ramion swą własną powagą\nZdjąć bez srebrnego i złotego klucza.\nZamianę płochą zważ co do litery,\nCzy rzecz rzucona nie jest tak zamknięta\nW nowo przyjętej, jak w liczbie sześć cztery."
    verse: true
    chunks:
      - pl: "Lecz nikt nie może, jak Kościół poucza,"
        ru: "Но никто не может, как учит Церковь,"
      - pl: "\nCiężaru z ramion swą własną powagą"
        ru: "снять тяжесть с плеч своей собственной властью"
      - pl: "\nZdjąć bez srebrnego i złotego klucza."
        ru: "без серебряного и золотого ключа."
      - pl: "\nZamianę płochą zważ co do litery,"
        ru: "Взвесь до буквы легкомысленную замену:"
      - pl: "\nCzy rzecz rzucona nie jest tak zamknięta"
        ru: "не заключена ли оставленная вещь"
      - pl: "\nW nowo przyjętej, jak w liczbie sześć cztery."
        ru: "в новой, принятой, как четыре в шести."
    words: { "Ciężaru": ciezar, "ramion": ramie, "powagą": powaga, "srebrnego": srebrny, "litery": litera, "liczbie": liczba }
  - clean: "Bo każdy przedmiot, jeżeli swą wagą\nKu sobie szalę przychyli zasługi,\nJuż się nie daje wymienić na drugi.\nO ludzie! Ślubów nie miejcie za marę,\nBądźcie im wierni, lecz dla nich nieślepi,\nJak Jefte pierwszą robiący ofiarę."
    verse: true
    chunks:
      - pl: "Bo każdy przedmiot, jeżeli swą wagą"
        ru: "Ибо каждый предмет, если своим весом"
      - pl: "\nKu sobie szalę przychyli zasługi,"
        ru: "склонит к себе чашу заслуги,"
      - pl: "\nJuż się nie daje wymienić na drugi."
        ru: "уже не даёт себя заменить на другой."
      - pl: "\nO ludzie! Ślubów nie miejcie za marę,"
        ru: "О люди! не считайте обеты призраком,"
      - pl: "\nBądźcie im wierni, lecz dla nich nieślepi,"
        ru: "будьте им верны, но не слепы ради них,"
      - pl: "\nJak Jefte pierwszą robiący ofiarę."
        ru: "как Иеффай, приносивший первую жертву."
        note: "принёс в жертву дочь"
    words: { "wagą": waga, "zasługi": zasluga, "daje": dawac, "wymienić": wymienic, "drugi": drugi, "wierni": wierny }
  - clean: "Byłoby mówić «źle zrobiłem» lepiej,\nNiż robić gorzej, wypełniając śluby:\nWielki wódz Greków rażony tym błędem.\nZmusza swą córkę, aby pod żelazem\nOdżałowała swoich wdzięków chluby.\nGłupcy i mędrcy płakali zarazem\nI nad ofiarą, i dzikim obrzędem."
    verse: true
    chunks:
      - pl: "Byłoby mówić «źle zrobiłem» lepiej,"
        ru: "Лучше было бы сказать «я плохо сделал»,"
      - pl: "\nNiż robić gorzej, wypełniając śluby:"
        ru: "чем делать хуже, исполняя обеты:"
      - pl: "\nWielki wódz Greków rażony tym błędem."
        ru: "великий вождь греков, поражённый этой ошибкой,"
        note: "Агамемнон"
      - pl: "\nZmusza swą córkę, aby pod żelazem"
        ru: "заставляет свою дочь под железом"
      - pl: "\nOdżałowała swoich wdzięków chluby."
        ru: "оплакать гордость своих прелестей."
        note: "odżałować — оплакать"
      - pl: "\nGłupcy i mędrcy płakali zarazem"
        ru: "Глупцы и мудрецы плакали разом"
      - pl: "\nI nad ofiarą, i dzikim obrzędem."
        ru: "и над жертвой, и над диким обрядом."
    words: { "wypełniając": wypelniac, "wódz": wodz, "Zmusza": zmuszac, "żelazem": zelazo, "Głupcy": glupiec, "dzikim": dziki }
  - clean: "Większą powagę miejcie, chrześcijanie,\nNie bądźcie wiotcy jako puch w tej wierze,\nŻe każda woda was z brudu opierze.\nMacie Testament i Stary, i Nowy,\nMacie pasterza trzody Chrystusowej,\nAby prostował wasze obłąkanie;\nDość dla waszego zaiste zbawienia."
