      - pl: "\nMacie Testament i Stary, i Nowy,"
        ru: "У вас есть Завет и Ветхий, и Новый,"
      - pl: "\nMacie pasterza trzody Chrystusowej,"
        ru: "у вас есть пастырь стада Христова,"
      - pl: "\nAby prostował wasze obłąkanie;"
        ru: "чтобы выпрямлять ваше заблуждение;"
      - pl: "\nDość dla waszego zaiste zbawienia."
        ru: "довольно, воистину, для вашего спасения."
    words: { "chrześcijanie": chrzescijanin, "wierze": wiara, "woda": woda, "brudu": brud, "Testament": testament, "trzody": trzoda }
  - clean: "Gdy was gdzie indziej zwrócą złe pragnienia,\nŻeście nie owce, pamiętać wypada,\nBy was nie ugryzł żart Żyda sąsiada.\nNie róbcie jak to jagnię igrające,\nKtóre porzucić mleko matki woli\nDla płochej z sobą tryksy i swawoli»."
