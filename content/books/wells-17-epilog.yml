paragraphs:
  - clean: "Nie sposób się nie zastanawiać. Czy kiedykolwiek wróci? Może pomknął w przeszłość i trafił między pijących krew, owłosionych dzikusów Epoki Kamienia Łupanego; w otchłanie Morza Kredowego; albo między groteskowe jaszczury, ogromne gadzie bestie czasów jurajskich. Może nawet teraz — jeśli wolno mi użyć tego wyrażenia — wędruje po jakiejś rafie koralowej z oolitu, nawiedzanej przez plezjozaury, albo nad samotnymi słonymi morzami triasu. A może ruszył naprzód, w którąś z bliższych epok, w której ludzie są jeszcze ludźmi, ale zagadki naszych czasów są już rozwiązane, a ich nużące problemy rozstrzygnięte?"
    en: "One cannot choose but wonder. Will he ever return? It may be that he swept back into the past, and fell among the blood-drinking, hairy savages of the Age of Unpolished Stone; into the abysses of the Cretaceous Sea; or among the grotesque saurians, the huge reptilian brutes of the Jurassic times. He may even now—if I may use the phrase—be wandering on some plesiosaurus-haunted Oolitic coral reef, or beside the lonely saline seas of the Triassic Age. Or did he go forward, into one of the nearer ages, in which men are still men, but with the riddles of our own time answered and its wearisome problems solved?"
    draft: true
    chunks:
      - pl: "Nie sposób się nie zastanawiać."
        ru: "Невозможно не задаваться вопросом."
      - pl: " Czy kiedykolwiek wróci?"
        ru: "Вернётся ли он когда-нибудь?"
      - pl: " Może pomknął w przeszłość i trafił między pijących krew, owłosionych dzikusów Epoki Kamienia Łupanego;"
        ru: "Может быть, он умчался в прошлое и попал к пьющим кровь косматым дикарям Эпохи Неотёсанного Камня;"
        note: "owłosiony — волосатый; kamień łupany — колотый камень (палеолит)"
      - pl: " w otchłanie Morza Kredowego;"
        ru: "в пучины Мелового моря;"
        note: "otchłań — бездна, пучина"
      - pl: " albo między groteskowe jaszczury, ogromne gadzie bestie czasów jurajskich."
        ru: "или к нелепым ящерам, огромным рептилиям юрского периода."
        note: "jaszczur — ящер; gadzi — пресмыкающийся"
      - pl: " Może nawet teraz — jeśli wolno mi użyć tego wyrażenia — wędruje po jakiejś rafie koralowej z oolitu, nawiedzanej przez plezjozaury,"
        ru: "Может быть, даже сейчас — если позволительно так выразиться — он бродит по какому-нибудь оолитовому коралловому рифу, где водятся плезиозавры,"
        note: "nawiedzany — посещаемый (призраками, чудищами)"
      - pl: " albo nad samotnymi słonymi morzami triasu."
        ru: "или у пустынных солёных морей триаса."
      - pl: " A może ruszył naprzód, w którąś z bliższych epok, w której ludzie są jeszcze ludźmi,"
        ru: "Или он отправился вперёд, в одну из ближайших эпох, где люди ещё остаются людьми,"
      - pl: " ale zagadki naszych czasów są już rozwiązane, a ich nużące problemy rozstrzygnięte?"
        ru: "но загадки нашего времени уже разгаданы, а его утомительные задачи решены?"
        note: "nużący — утомительный; rozstrzygnąć — разрешить"
    words: { "Morza": morze, "bestie": bestia, "wolno": wolno, "naprzód": naprzod, "zagadki": zagadka }
  - clean: "W wiek męski rasy: bo ja ze swej strony nie potrafię uwierzyć, że te ostatnie czasy słabych eksperymentów, fragmentarycznych teorii i wzajemnej niezgody są naprawdę szczytem ludzkich dziejów! Mówię: ze swej strony. On — wiem o tym, bo rozmawialiśmy o tym długo przed zbudowaniem Wehikułu Czasu — myślał niewesoło o Postępie Ludzkości i widział w rosnącym stosie cywilizacji tylko głupie nagromadzenie, które musi nieuchronnie runąć i w końcu zniszczyć swych twórców. Jeśli tak jest, pozostaje nam żyć tak, jakby tak nie było."
    en: "Into the manhood of the race: for I, for my own part, cannot think that these latter days of weak experiment, fragmentary theory, and mutual discord are indeed man’s culminating time! I say, for my own part. He, I know—for the question had been discussed among us long before the Time Machine was made—thought but cheerlessly of the Advancement of Mankind, and saw in the growing pile of civilisation only a foolish heaping that must inevitably fall back upon and destroy its makers in the end. If that is so, it remains for us to live as though it were not so."
    draft: true
    chunks:
      - pl: "W wiek męski rasy: bo ja ze swej strony nie potrafię uwierzyć, że te ostatnie czasy słabych eksperymentów, fragmentarycznych teorii i wzajemnej niezgody są naprawdę szczytem ludzkich dziejów!"
        ru: "В зрелую пору рода: ибо я со своей стороны не могу поверить, что эти последние дни робких опытов, отрывочных теорий и взаимных раздоров и есть вершина человеческой истории!"
        note: "wiek męski — зрелый возраст; niezgoda — раздор; dzieje — история"
      - pl: " Mówię: ze swej strony."
        ru: "Говорю: со своей стороны."
      - pl: " On — wiem o tym, bo rozmawialiśmy o tym długo przed zbudowaniem Wehikułu Czasu — myślał niewesoło o Postępie Ludzkości"
        ru: "Он — я знаю это, потому что мы обсуждали этот вопрос задолго до того, как была построена Машина Времени, — невесело думал о Прогрессе Человечества"
      - pl: " i widział w rosnącym stosie cywilizacji tylko głupie nagromadzenie, które musi nieuchronnie runąć i w końcu zniszczyć swych twórców."
        ru: "и видел в растущей груде цивилизации лишь глупое нагромождение, которое неизбежно должно рухнуть и в конце концов погубить своих создателей."
        note: "nagromadzenie — нагромождение; runąć — рухнуть"
      - pl: " Jeśli tak jest, pozostaje nam żyć tak, jakby tak nie było."
        ru: "Если это так, нам остаётся жить так, будто это не так."
    words: { "rasy": rasa, "eksperymentów": eksperyment, "Ludzkości": ludzkosc, "stosie": stos, "cywilizacji": cywilizacja, "nieuchronnie": nieuchronnie }
  - clean: "Ale dla mnie przyszłość jest wciąż czarna i pusta — jest ogromną niewiedzą, rozjaśnioną w kilku przypadkowych miejscach wspomnieniem jego opowieści. A mam przy sobie, na pociechę, dwa dziwne białe kwiaty — teraz zeschnięte, brązowe, płaskie i kruche — na świadectwo, że nawet wtedy, gdy rozum i siła odeszły, wdzięczność i wzajemna czułość wciąż żyły w sercu człowieka."
    en: "But to me the future is still black and blank—is a vast ignorance, lit at a few casual places by the memory of his story. And I have by me, for my comfort, two strange white flowers—shrivelled now, and brown and flat and brittle—to witness that even when mind and strength had gone, gratitude and a mutual tenderness still lived on in the heart of man."
    draft: true
    chunks:
      - pl: "Ale dla mnie przyszłość jest wciąż czarna i pusta — jest ogromną niewiedzą, rozjaśnioną w kilku przypadkowych miejscach wspomnieniem jego opowieści."
        ru: "Но для меня будущее всё ещё черно и пусто — это огромное неведение, освещённое в нескольких случайных местах воспоминанием о его рассказе."
        note: "niewiedza — неведение"
      - pl: " A mam przy sobie, na pociechę, dwa dziwne białe kwiaty — teraz zeschnięte, brązowe, płaskie i kruche —"
        ru: "А у меня есть, для утешения, два странных белых цветка — теперь засохших, бурых, плоских и ломких, —"
        note: "kruchy — ломкий"
      - pl: " na świadectwo, że nawet wtedy, gdy rozum i siła odeszły, wdzięczność i wzajemna czułość wciąż żyły w sercu człowieka."
        ru: "как свидетельство того, что даже когда ум и сила ушли, благодарность и взаимная нежность всё ещё жили в сердце человека."
        note: "świadectwo — свидетельство"
    words: { "przypadkowych": przypadkowy, "opowieści": opowiesc, "kwiaty": kwiat, "brązowe": brazowy, "rozum": rozum, "wdzięczność": wdziecznosc }
