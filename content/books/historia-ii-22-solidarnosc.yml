  - clean: "Do Solidarności zapisało się w ciągu kilku miesięcy prawie dziesięć milionów ludzi, czyli mniej więcej co trzeci dorosły Polak. Należeli do niej robotnicy i inżynierowie, nauczyciele i lekarze, pisarze i studenci, a nawet członkowie partii. Chłopi utworzyli własny związek, Solidarność Rolników Indywidualnych, a studenci Niezależne Zrzeszenie Studentów. Nie był to zwykły związek zawodowy, ale ogromny ruch społeczny, który domagał się prawdy, godności i sprawiedliwości."
    draft: true
    chunks:
      - pl: "Do Solidarności zapisało się w ciągu kilku miesięcy prawie dziesięć milionów ludzi, czyli mniej więcej co trzeci dorosły Polak."
        ru: "В «Солидарность» за несколько месяцев вступили почти десять миллионов человек, то есть примерно каждый третий взрослый поляк."
      - pl: " Należeli do niej robotnicy i inżynierowie, nauczyciele i lekarze, pisarze i studenci, a nawet członkowie partii."
