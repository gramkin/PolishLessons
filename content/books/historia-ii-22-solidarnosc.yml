  - clean: "W stoczni powstał Międzyzakładowy Komitet Strajkowy, który reprezentował setki zakładów z całego Wybrzeża. Komitet ogłosił dwadzieścia jeden postulatów, wypisanych na drewnianych tablicach powieszonych na bramie stoczni. Pierwszy z nich domagał się utworzenia wolnych związków zawodowych, niezależnych od partii. Robotnicy żądali też prawa do strajku, wolności słowa, uwolnienia więźniów politycznych i transmisji mszy w radiu. Tablice z postulatami znajdują się dziś na liście UNESCO Pamięć Świata."
    draft: true
    chunks:
      - pl: "W stoczni powstał Międzyzakładowy Komitet Strajkowy, który reprezentował setki zakładów z całego Wybrzeża."
