        ru: "Первый из них требовал создания свободных профсоюзов, независимых от партии."
      - pl: " Robotnicy żądali też prawa do strajku, wolności słowa, uwolnienia więźniów politycznych i transmisji mszy w radiu."
        ru: "Рабочие требовали также права на забастовку, свободы слова, освобождения политических заключённых и трансляции мессы по радио."
      - pl: " Tablice z postulatami znajdują się dziś na liście UNESCO Pamięć Świata."
        ru: "Доски с требованиями сегодня внесены в список ЮНЕСКО «Память мира»."
