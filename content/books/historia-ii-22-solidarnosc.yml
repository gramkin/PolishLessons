      - pl: " Kilka dni później Gierek stracił stanowisko, a nowym pierwszym sekretarzem został Stanisław Kania."
        ru: "Через несколько дней Герек лишился поста, а новым первым секретарём стал Станислав Каня."
      - pl: " We wrześniu przedstawiciele komitetów strajkowych z całego kraju utworzyli w Gdańsku Niezależny Samorządny Związek Zawodowy „Solidarność”."
        ru: "В сентябре представители забастовочных комитетов со всей страны создали в Гданьске Независимый самоуправляемый профсоюз «Солидарность»."
      - pl: " Jego przewodniczącym został Wałęsa."
        ru: "Его председателем стал Валенса."
      - pl: " Logo Solidarności, z czerwonymi literami, które wyglądają jak tłum ludzi idących razem, zaprojektował gdański grafik Jerzy Janiszewski."
        ru: "Логотип «Солидарности» с красными буквами, похожими на толпу людей, идущих вместе, разработал гданьский график Ежи Янишевский."
