paragraphs:
  - clean: "16 października 1978 roku z Watykanu nadeszła wiadomość, która zaskoczyła cały świat. Kardynałowie wybrali na papieża arcybiskupa krakowskiego Karola Wojtyłę, który przyjął imię Jan Paweł II. Był pierwszym od ponad czterystu pięćdziesięciu lat papieżem, który nie był Włochem, i pierwszym w historii papieżem z Polski. W Polsce ludzie płakali ze szczęścia, biły dzwony, a nawet władze komunistyczne musiały złożyć gratulacje. Krążył dowcip, że partia zaproponowała Wojtyłę na papieża, żeby pozbyć się go z Krakowa."
    draft: true
    chunks:
      - pl: "16 października 1978 roku z Watykanu nadeszła wiadomość, która zaskoczyła cały świat."
        ru: "16 октября 1978 года из Ватикана пришла новость, которая поразила весь мир."
      - pl: " Kardynałowie wybrali na papieża arcybiskupa krakowskiego Karola Wojtyłę, który przyjął imię Jan Paweł II."
        ru: "Кардиналы избрали папой римским краковского архиепископа Кароля Войтылу, который принял имя Иоанн Павел II."
      - pl: " Był pierwszym od ponad czterystu pięćdziesięciu lat papieżem, który nie był Włochem, i pierwszym w historii papieżem z Polski."
        ru: "Он был первым за более чем четыреста пятьдесят лет папой, который не был итальянцем, и первым в истории папой из Польши."
      - pl: " W Polsce ludzie płakali ze szczęścia, biły dzwony, a nawet władze komunistyczne musiały złożyć gratulacje."
        ru: "В Польше люди плакали от счастья, звонили колокола, и даже коммунистические власти были вынуждены выразить поздравления."
      - pl: " Krążył dowcip, że partia zaproponowała Wojtyłę na papieża, żeby pozbyć się go z Krakowa."
        ru: "Ходил анекдот, что партия предложила Войтылу в папы, чтобы избавиться от него в Кракове."
    words: { "października": pazdziernik, "papieża": papiez, "pięćdziesięciu": piecdziesiat, "papieżem": papiez, "dzwony": dzwon, "Krążył": krazyc, "dowcip": dowcip, "partia": partia, "zaproponowała": zaproponowac }
  - clean: "W czerwcu 1979 roku Jan Paweł II przyjechał z pielgrzymką do ojczyzny. Na mszach, które odprawiał w Warszawie, Gnieźnie, Częstochowie i Krakowie, gromadziły się miliony ludzi. Porządku pilnowali nie milicjanci, ale wolontariusze z parafii, i wszystko przebiegało spokojnie. Na placu Zwycięstwa w Warszawie papież modlił się, żeby Duch Święty odnowił oblicze ziemi, i dodał: „Tej ziemi”. Ludzie zobaczyli, ilu ich jest, i przestali się bać. Wielu historyków uważa, że bez tej pielgrzymki nie byłoby Solidarności."
    draft: true
    chunks:
      - pl: "W czerwcu 1979 roku Jan Paweł II przyjechał z pielgrzymką do ojczyzny."
        ru: "В июне 1979 года Иоанн Павел II приехал на родину с паломничеством."
        note: "pielgrzymka — паломничество"
      - pl: " Na mszach, które odprawiał w Warszawie, Gnieźnie, Częstochowie i Krakowie, gromadziły się miliony ludzi."
        ru: "На мессы, которые он служил в Варшаве, Гнезно, Ченстохове и Кракове, собирались миллионы людей."
      - pl: " Porządku pilnowali nie milicjanci, ale wolontariusze z parafii, i wszystko przebiegało spokojnie."
        ru: "Порядок поддерживали не милиционеры, а добровольцы из приходов, и всё проходило спокойно."
      - pl: " Na placu Zwycięstwa w Warszawie papież modlił się, żeby Duch Święty odnowił oblicze ziemi, i dodał: „Tej ziemi”."
        ru: "На площади Победы в Варшаве папа молился о том, чтобы Святой Дух обновил лицо земли, и добавил: «Этой земли»."
        note: "oblicze — лицо, облик"
      - pl: " Ludzie zobaczyli, ilu ich jest, i przestali się bać."
        ru: "Люди увидели, сколько их, и перестали бояться."
      - pl: " Wielu historyków uważa, że bez tej pielgrzymki nie byłoby Solidarności."
        ru: "Многие историки считают, что без этого паломничества не было бы «Солидарности»."
