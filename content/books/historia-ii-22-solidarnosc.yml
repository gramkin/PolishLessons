  - clean: "Brama stoczni była udekorowana kwiatami, obrazem Matki Boskiej i portretem papieża. Księża odprawiali msze dla strajkujących, a mieszkańcy Gdańska przynosili im jedzenie przez płot. Do stoczni przyjechali intelektualiści z Warszawy, wśród nich Tadeusz Mazowiecki i Bronisław Geremek, którzy zostali doradcami komitetu. Strajki rozlały się na cały kraj, od Szczecina po kopalnie na Śląsku. Władze nie odważyły się użyć siły, bo strajkujących było zbyt wielu, a pamięć grudnia 1970 roku była wciąż żywa."
