  - clean: "Po raz pierwszy w historii bloku radzieckiego władza komunistyczna zgodziła się na istnienie organizacji, której nie kontrolowała. Kilka dni później Gierek stracił stanowisko, a nowym pierwszym sekretarzem został Stanisław Kania. We wrześniu przedstawiciele komitetów strajkowych z całego kraju utworzyli w Gdańsku Niezależny Samorządny Związek Zawodowy „Solidarność”. Jego przewodniczącym został Wałęsa. Logo Solidarności, z czerwonymi literami, które wyglądają jak tłum ludzi idących razem, zaprojektował gdański grafik Jerzy Janiszewski. Na literze „n” powiewa biało-czerwona flaga."
