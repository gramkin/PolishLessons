        ru: "На верфь приехали интеллектуалы из Варшавы, среди них Тадеуш Мазовецкий и Бронислав Геремек, которые стали советниками комитета."
      - pl: " Strajki rozlały się na cały kraj, od Szczecina po kopalnie na Śląsku."
        ru: "Забастовки распространились по всей стране, от Щецина до шахт Силезии."
      - pl: " Władze nie odważyły się użyć siły, bo strajkujących było zbyt wielu, a pamięć grudnia 1970 roku była wciąż żywa."
