  - clean: "Latem 1980 roku władze znów podniosły ceny mięsa. W lipcu zastrajkowały zakłady w Lublinie i Świdniku, a władze szybko spełniały postulaty płacowe, żeby uspokoić sytuację. 14 sierpnia 1980 roku zastrajkowała Stocznia Gdańska imienia Lenina. Bezpośrednim powodem było zwolnienie z pracy suwnicowej Anny Walentynowicz, działaczki Wolnych Związków Zawodowych, na kilka miesięcy przed emeryturą. Robotnicy domagali się jej przywrócenia do pracy, podwyżki płac i pomnika ofiar grudnia 1970 roku."
    draft: true
    chunks:
      - pl: "Latem 1980 roku władze znów podniosły ceny mięsa."
        ru: "Летом 1980 года власти снова подняли цены на мясо."
      - pl: " W lipcu zastrajkowały zakłady w Lublinie i Świdniku, a władze szybko spełniały postulaty płacowe, żeby uspokoić sytuację."
        ru: "В июле забастовали предприятия в Люблине и Свиднике, а власти быстро удовлетворяли требования о зарплате, чтобы успокоить обстановку."
        note: "postulat — требование"
      - pl: " 14 sierpnia 1980 roku zastrajkowała Stocznia Gdańska imienia Lenina."
        ru: "14 августа 1980 года забастовала Гданьская судоверфь имени Ленина."
      - pl: " Bezpośrednim powodem było zwolnienie z pracy suwnicowej Anny Walentynowicz, działaczki Wolnych Związków Zawodowych, na kilka miesięcy przed emeryturą."
        ru: "Непосредственной причиной стало увольнение крановщицы Анны Валентинович, активистки Свободных профсоюзов, за несколько месяцев до пенсии."
        note: "emerytura — пенсия"
      - pl: " Robotnicy domagali się jej przywrócenia do pracy, podwyżki płac i pomnika ofiar grudnia 1970 roku."
        ru: "Рабочие требовали её восстановления на работе, повышения зарплаты и памятника жертвам декабря 1970 года."
    words: { "mięsa": mieso, "lipcu": lipiec, "zakłady": zaklad, "sierpnia": sierpien, "Bezpośrednim": bezposredni, "emeryturą": emerytura, "Robotnicy": robotnik, "pomnika": pomnik, "grudnia": grudzien }
  - clean: "Przywódcą strajku został elektryk Lech Wałęsa, który wcześniej został zwolniony ze stoczni za działalność opozycyjną. Według legendy przeskoczył przez stoczniowy płot, żeby dostać się do strajkujących. Po dwóch dniach dyrekcja zgodziła się na żądania stoczniowców i strajk miał się zakończyć. Wtedy kilka kobiet, wśród nich Walentynowicz, zatrzymało wychodzących robotników i przekonało ich, że nie mogą zostawić bez wsparcia innych zakładów, które strajkowały razem z nimi. Strajk płacowy zamienił się w strajk solidarnościowy. Od tego słowa wzięła później nazwę cała wielka organizacja."
    draft: true
    chunks:
      - pl: "Przywódcą strajku został elektryk Lech Wałęsa, który wcześniej został zwolniony ze stoczni za działalność opozycyjną."
        ru: "Руководителем забастовки стал электрик Лех Валенса, которого прежде уволили с верфи за оппозиционную деятельность."
      - pl: " Według legendy przeskoczył przez stoczniowy płot, żeby dostać się do strajkujących."
        ru: "По легенде, он перепрыгнул через забор верфи, чтобы попасть к бастующим."
        note: "płot — забор"
      - pl: " Po dwóch dniach dyrekcja zgodziła się na żądania stoczniowców i strajk miał się zakończyć."
        ru: "Через два дня дирекция согласилась на требования судостроителей, и забастовка должна была закончиться."
      - pl: " Wtedy kilka kobiet, wśród nich Walentynowicz, zatrzymało wychodzących robotników i przekonało ich, że nie mogą zostawić bez wsparcia innych zakładów, które strajkowały razem z nimi."
        ru: "Тогда несколько женщин, среди них Валентинович, остановили уходивших рабочих и убедили их, что они не могут оставить без поддержки другие предприятия, которые бастовали вместе с ними."
      - pl: " Strajk płacowy zamienił się w strajk solidarnościowy."
        ru: "Забастовка за зарплату превратилась в забастовку солидарности."
      - pl: " Od tego słowa wzięła później nazwę cała wielka organizacja."
        ru: "От этого слова позже получила название вся большая организация."
