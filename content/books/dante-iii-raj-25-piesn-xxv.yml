# review
title: "Boska komedia. Raj"
titleRu: "Божественная комедия. Рай"
author: Dante Alighieri
translator: "Julian Korsak"
source:
  name: "Wolne Lektury (Dante Alighieri, «Boska komedia», tłum. Julian Korsak, 1860)"
  url: https://wolnelektury.pl/katalog/lektura/boska-komedia-raj/
  license: Public domain
  licenseUrl: https://wolnelektury.pl/info/zasady-wykorzystania/
chapter: 25
chapterTitle: "Pieśń XXV"
chapterTitleRu: "Песнь XXV. Испытание в надежде"
level: B2
paragraphs:
  - clean: "Ciąg dalszy. Poeta wspomina o swym dziele; wyraża nadzieję powrotu do Florencji i koronacji. Św. Jakub wypytuje poetę o nadziei chrześcijańskiej. Św. Jan zjawia się. Beatrycze na czas jakiś znika."
    chunks:
      - pl: "Ciąg dalszy. Poeta wspomina o swym dziele; wyraża nadzieję powrotu do Florencji i koronacji. Św. Jakub wypytuje poetę o nadziei chrześcijańskiej. Św. Jan zjawia się. Beatrycze na czas jakiś znika."
        ru: "Продолжение. Поэт вспоминает о своём труде; выражает надежду вернуться во Флоренцию и быть увенчанным. Святой Иаков расспрашивает поэта о христианской надежде. Является святой Иоанн. Беатриче на какое-то время исчезает."
    words: { "Ciąg": ciag, "Poeta": poeta, "wspomina": wspominac, "dziele": dzielo, "wyraża": wyrazac, "znika": znikac }
  - clean: "O! Jeśli kiedy dożyję dnia tego,\nŻe to poema święte, do którego\nNiebo i ziemia przykładały rękę,\nNad którym ślęcząc, przez lat wiele schudłem,\nRozbroi srogość i dziką niewdziękę,\nCo mnie wyłącza z tej pięknej owczarni,\nGdzie z dziecka spałem, baranek szczęśliwy,\nWróg wilków, co ją wojują bezkarnie,\nWrócę poeta, nad chrztu mego źródłem\nKoroną z lauru wieńczyć włos już siwy:"
    verse: true
    chunks:
      - pl: "O! Jeśli kiedy dożyję dnia tego,"
        ru: "О! Если когда-нибудь я доживу до того дня,"
      - pl: "\nŻe to poema święte, do którego"
        ru: "когда эта священная поэма, к которой"
      - pl: "\nNiebo i ziemia przykładały rękę,"
        ru: "приложили руку небо и земля,"
      - pl: "\nNad którym ślęcząc, przez lat wiele schudłem,"
        ru: "над которой, корпя, я исхудал за много лет,"
        note: "ślęczeć — корпеть"
      - pl: "\nRozbroi srogość i dziką niewdziękę,"
        ru: "обезоружит суровость и дикую неблагодарность,"
        note: "niewdzięka — неблагодарность"
      - pl: "\nCo mnie wyłącza z tej pięknej owczarni,"
        ru: "что изгоняет меня из той прекрасной овчарни,"
      - pl: "\nGdzie z dziecka spałem, baranek szczęśliwy,"
        ru: "где я с детства спал счастливым ягнёнком,"
      - pl: "\nWróg wilków, co ją wojują bezkarnie,"
        ru: "враг волков, что безнаказанно воюют с ней,"
      - pl: "\nWrócę poeta, nad chrztu mego źródłem"
        ru: "я вернусь поэтом и над купелью моего крещения"
      - pl: "\nKoroną z lauru wieńczyć włos już siwy:"
        ru: "увенчаю уже седые волосы лавровым венком:"
    words: { "Niebo": niebo, "Wróg": wrog, "bezkarnie": bezkarnie, "źródłem": zrodlo, "Koroną": korona, "włos": wlos }
  - clean: "Bo tam w dni moich przyjęła mnie progu\nWiara, co dusze daje poznać Bogu,\nDla której Piotr mnie tak objął dokoła.\nI szła wprost ku nam światłość ze świeczników,\nZ których zszedł do nas pierwszy z namiestników,\nKtórego Chrystus zostawił na ziemi."
    verse: true
    chunks:
      - pl: "Bo tam w dni moich przyjęła mnie progu"
        ru: "ибо там в мои дни приняла меня на пороге"
      - pl: "\nWiara, co dusze daje poznać Bogu,"
        ru: "вера, что даёт душам познать Бога,"
      - pl: "\nDla której Piotr mnie tak objął dokoła."
        ru: "ради которой Пётр так обвил меня кругом."
      - pl: "\nI szła wprost ku nam światłość ze świeczników,"
        ru: "И прямо к нам шёл свет из того круга,"
        note: "świecznik — светильник"
      - pl: "\nZ których zszedł do nas pierwszy z namiestników,"
        ru: "из которого сошёл к нам первый из наместников,"
      - pl: "\nKtórego Chrystus zostawił na ziemi."
        ru: "которых Христос оставил на земле."
    words: { "przyjęła": przyjac, "progu": prog, "Wiara": wiara, "objął": objac, "dokoła": dokola, "zszedł": zejsc }
  - clean: "A Pani moja mówiła wesoła:\n«Patrz, oto święty! którego, wiesz z wieści,\nRojem pielgrzymów Galicyja cześci».\nGołąb z gołąbką gruchoty czułemi\nWzajemną czułość wylewają z siebie,\nPodobnie czule dwaj apostołowie\nJeden drugiego witał i w rozmowie\nChwalili pokarm żywiący ich w niebie."
    verse: true
    chunks:
      - pl: "A Pani moja mówiła wesoła:"
        ru: "А моя Госпожа говорила, весёлая:"
      - pl: "\n«Patrz, oto święty! którego, wiesz z wieści,"
        ru: "«Смотри, вот святой! которого, ты знаешь по слухам,"
        note: "апостол Иаков"
      - pl: "\nRojem pielgrzymów Galicyja cześci»."
        ru: "чтит Галисия роем паломников»."
        note: "Сантьяго-де-Компостела"
      - pl: "\nGołąb z gołąbką gruchoty czułemi"
        ru: "Как голубь с голубкой нежным воркованием"
        note: "gruchot — воркование"
      - pl: "\nWzajemną czułość wylewają z siebie,"
        ru: "изливают друг на друга взаимную нежность,"
      - pl: "\nPodobnie czule dwaj apostołowie"
        ru: "так же нежно два апостола"
      - pl: "\nJeden drugiego witał i w rozmowie"
        ru: "приветствовали друг друга и в беседе"
      - pl: "\nChwalili pokarm żywiący ich w niebie."
        ru: "хвалили пищу, питающую их на небе."
    words: { "wesoła": wesoly, "wieści": wiesc, "Gołąb": golab, "Podobnie": podobnie, "Chwalili": chwalic, "żywiący": zywic }
  - clean: "Skończywszy mówić, do mnie się zbliżyli,\nTak płomieniejąc, aż wzrok mój razili.\n«Duchu» z uśmiechem rzekła Beatryce,\n«Ty, coś o naszej pisząc Bazylice,\nOpowiedziałeś jej triumfu dzieje,\nW tej wzniosłej sferze daj słyszeć nadzieję!"
    verse: true
    chunks:
      - pl: "Skończywszy mówić, do mnie się zbliżyli,"
        ru: "Кончив говорить, они приблизились ко мне,"
      - pl: "\nTak płomieniejąc, aż wzrok mój razili."
        ru: "пламенея так, что слепили мой взгляд."
      - pl: "\n«Duchu» z uśmiechem rzekła Beatryce,"
        ru: "«Дух, — с улыбкой сказала Беатриче, —"
      - pl: "\n«Ty, coś o naszej pisząc Bazylice,"
        ru: "ты, что, описывая щедрость нашей Базилики,"
        note: "у Данте: щедрость нашего двора; Послание Иакова"
      - pl: "\nOpowiedziałeś jej triumfu dzieje,"
        ru: "поведал историю её торжества,"
      - pl: "\nW tej wzniosłej sferze daj słyszeć nadzieję!"
        ru: "дай услышать о надежде в этой высокой сфере!"
    words: { "zbliżyli": zblizyc, "wzrok": wzrok, "Duchu": duch, "uśmiechem": usmiech, "rzekła": rzec, "Opowiedziałeś": opowiedziec }
  - clean: "Bo każdą razą tyś ją wyobrażał,\nGdy Jezus trzech was w swym blasku przerażał».\n— «Uspokój siebie, podnieś oczy śmiało,\nW błogosławione tu duch wchodząc chóry,\nDojrzewa grzany naszych ogni żarem».\nTaką pociechą drugie światło wiało:\nWtenczas podniosłem oczy na te góry,\nCo przytłaczały mnie swoim ciężarem."
    verse: true
    chunks:
      - pl: "Bo każdą razą tyś ją wyobrażał,"
        ru: "Ибо всякий раз ты её изображал,"
      - pl: "\nGdy Jezus trzech was w swym blasku przerażał»."
        ru: "когда Иисус ужасал вас троих своим блеском»."
        note: "Преображение"
      - pl: "\n— «Uspokój siebie, podnieś oczy śmiało,"
        ru: "— «Успокойся, смело подними глаза:"
      - pl: "\nW błogosławione tu duch wchodząc chóry,"
        ru: "дух, входя сюда в благословенные хоры,"
      - pl: "\nDojrzewa grzany naszych ogni żarem»."
        ru: "дозревает, согретый жаром наших огней»."
      - pl: "\nTaką pociechą drugie światło wiało:"
        ru: "Таким утешением повеял второй свет;"
      - pl: "\nWtenczas podniosłem oczy na te góry,"
        ru: "тогда я поднял глаза на эти горы,"
        note: "апостолов"
      - pl: "\nCo przytłaczały mnie swoim ciężarem."
        ru: "что подавляли меня своей тяжестью."
    words: { "blasku": blask, "błogosławione": blogoslawic, "chóry": chor, "grzany": grzac, "przytłaczały": przytlaczac, "ciężarem": ciezar }
  - clean: "— «Ponieważ chce nasz Monarcha ze swej łaski,,\nAbyś przed śmiercią jego dworu blaski\nOglądał z jego pierwszymi dworzany,\nAżebyś widząc obraz niekłamany\nPrzepychu, jakim Jego dwór jaśnieje,\nW sobie i drugich ośmielał nadzieję,\nMów, czym jest ona, skąd ci przyszła ona?"
    verse: true
    chunks:
      - pl: "— «Ponieważ chce nasz Monarcha ze swej łaski,,"
        ru: "— «Поскольку наш Монарх по своей милости хочет,"
      - pl: "\nAbyś przed śmiercią jego dworu blaski"
        ru: "чтобы ты перед смертью блески его двора"
      - pl: "\nOglądał z jego pierwszymi dworzany,"
        ru: "созерцал с его первыми придворными,"
        note: "dworzanin — придворный"
      - pl: "\nAżebyś widząc obraz niekłamany"
        ru: "чтобы, видя неподдельный образ"
      - pl: "\nPrzepychu, jakim Jego dwór jaśnieje,"
        ru: "великолепия, которым сияет Его двор,"
      - pl: "\nW sobie i drugich ośmielał nadzieję,"
        ru: "ты ободрял надежду в себе и в других,"
      - pl: "\nMów, czym jest ona, skąd ci przyszła ona?"
        ru: "скажи, что она такое, откуда она пришла к тебе?"
    words: { "śmiercią": smierc, "dworu": dwor, "Oglądał": ogladac, "niekłamany": klamac, "jakim": jaki, "nadzieję": nadzieja }
  - clean: "Mów, jak wykwita z głębi twego łona?»\nTak druga światłość jeszcze przemówiła.\nA ta, co lot mój tak wysoko wzbiła.\nOdpowiedź moją sama uprzedziła:\n«Wojującego żaden syn Kościoła\nOdeń czuć więcej nadziei nie zdoła;\nJak na tym słońcu zapisano stoi,\nCo nas ubiera w blask światłości swojej."
    verse: true
    chunks:
      - pl: "Mów, jak wykwita z głębi twego łona?»"
        ru: "Скажи, как она расцветает в глубине твоей груди?»"
      - pl: "\nTak druga światłość jeszcze przemówiła."
        ru: "Так ещё сказал второй свет."
      - pl: "\nA ta, co lot mój tak wysoko wzbiła."
        ru: "А та, что вознесла мой полёт так высоко,"
      - pl: "\nOdpowiedź moją sama uprzedziła:"
        ru: "сама опередила мой ответ:"
      - pl: "\n«Wojującego żaden syn Kościoła"
        ru: "«Ни один сын воинствующей Церкви"
      - pl: "\nOdeń czuć więcej nadziei nie zdoła;"
        ru: "не может чувствовать больше надежды, чем он;"
      - pl: "\nJak na tym słońcu zapisano stoi,"
        ru: "как стоит записанным на этом солнце,"
        note: "в Боге"
      - pl: "\nCo nas ubiera w blask światłości swojej."
        ru: "что облекает нас блеском своего света."
    words: { "głębi": glab, "przemówiła": przemowic, "uprzedziła": uprzedzic, "zdoła": zdolac, "zapisano": zapisac, "ubiera": ubierac }
  - clean: "Przeto z Egiptu przyjść mu dozwolono,\nAby tu święte Jeruzalem witał,\nZa życia, jeszcze przed służbą skończoną.\nDwa inne punkty, o któreś go pytał,\nNie, żeby wiedzieć, lecz abyś wyczytał\nZ jego słów, ile ta cnota ci droga,\nNiech sam objaśni; treść ich dosyć łatwa\nGłowy mu próżną chlubą nie zagmatwa,\nI niech przyzwoli na to łaska Boga»."
    verse: true
    chunks:
      - pl: "Przeto z Egiptu przyjść mu dozwolono,"
        ru: "Поэтому ему дозволено прийти из Египта,"
      - pl: "\nAby tu święte Jeruzalem witał,"
        ru: "чтобы здесь приветствовать святой Иерусалим"
      - pl: "\nZa życia, jeszcze przed służbą skończoną."
        ru: "при жизни, ещё до окончания службы."
      - pl: "\nDwa inne punkty, o któreś go pytał,"
        ru: "Два других пункта, о которых ты его спросил,"
      - pl: "\nNie, żeby wiedzieć, lecz abyś wyczytał"
        ru: "не для того, чтобы знать, а чтобы ты вычитал"
      - pl: "\nZ jego słów, ile ta cnota ci droga,"
        ru: "из его слов, как дорога тебе эта добродетель,"
      - pl: "\nNiech sam objaśni; treść ich dosyć łatwa"
        ru: "пусть объяснит сам; их смысл довольно лёгок,"
      - pl: "\nGłowy mu próżną chlubą nie zagmatwa,"
        ru: "не запутает ему головы пустой похвальбой,"
      - pl: "\nI niech przyzwoli na to łaska Boga»."
        ru: "и пусть на то соизволит милость Божья»."
    words: { "witał": witac, "służbą": sluzba, "punkty": punkt, "pytał": pytac, "łatwa": latwy, "Głowy": glowa }
  - clean: "Jak uczeń w szkole, gdy mistrz jego bada.\nWesół mistrzowi na to odpowiada,\nDo czego długim ćwiczeniem się wprawił,\nAby mu swoją zasługę objawił,\nRzekłem: — «Nadzieja jest oczekiwaniem\nPrzyszłej błogości, wiarą rzeczywistą\nWynikłą z łaski i zasług uprzednich;\nŚwiatłość ta z gwiazd mi wybłysła niejednych;\nLecz pierwszy w serce wlał ją swym śpiewaniem\nWszechmocny śpiewak Wszechmocnego Pana."
    verse: true
    chunks:
      - pl: "Jak uczeń w szkole, gdy mistrz jego bada."
        ru: "Как ученик в школе, когда учитель его испытывает,"
      - pl: "\nWesół mistrzowi na to odpowiada,"
        ru: "весело отвечает учителю"
      - pl: "\nDo czego długim ćwiczeniem się wprawił,"
        ru: "на то, в чём набил руку долгим упражнением,"
        note: "wprawić się — навыкнуть"
      - pl: "\nAby mu swoją zasługę objawił,"
        ru: "чтобы явить ему свою заслугу,"
      - pl: "\nRzekłem: — «Nadzieja jest oczekiwaniem"
        ru: "я сказал: — «Надежда есть ожидание"
      - pl: "\nPrzyszłej błogości, wiarą rzeczywistą"
        ru: "будущего блаженства, истинная вера,"
      - pl: "\nWynikłą z łaski i zasług uprzednich;"
        ru: "вытекающая из благодати и прежних заслуг;"
      - pl: "\nŚwiatłość ta z gwiazd mi wybłysła niejednych;"
        ru: "этот свет блеснул мне не от одной звезды;"
      - pl: "\nLecz pierwszy w serce wlał ją swym śpiewaniem"
        ru: "но первым влил её в сердце своим пением"
      - pl: "\nWszechmocny śpiewak Wszechmocnego Pana."
        ru: "всемогущий певец Всемогущего Господа."
        note: "Давид"
    words: { "uczeń": uczen, "bada": badac, "ćwiczeniem": cwiczyc, "zasługę": zasluga, "Przyszłej": przyszly, "śpiewaniem": spiewac }
  - clean: "»Cześć Imieniowi Twemu!« na kolana\nPadając śpiewam rad w duchu z psalmistą,\n»Kto z moją wiarą w tobie ma ufanie,\nKomuż jest obce twoje imię, Panie!«\nDeszcz jego z pism twych tak zalał mi duszę,\nŻe w drugich potop ten przelewać muszę»."
    verse: true
    chunks:
      - pl: "»Cześć Imieniowi Twemu!« na kolana"
        ru: "„Слава имени Твоему!“ — падая на колени,"
      - pl: "\nPadając śpiewam rad w duchu z psalmistą,"
        ru: "охотно пою я в духе с псалмопевцем,"
        note: "psalmista — псалмопевец"
      - pl: "\n»Kto z moją wiarą w tobie ma ufanie,"
        ru: "„Кто с моей верой уповает на тебя,"
      - pl: "\nKomuż jest obce twoje imię, Panie!«"
        ru: "кому чуждо твоё имя, Господи!“"
      - pl: "\nDeszcz jego z pism twych tak zalał mi duszę,"
        ru: "Его дождь из твоих писаний так залил мне душу,"
      - pl: "\nŻe w drugich potop ten przelewać muszę»."
        ru: "что я должен переливать этот потоп в других»."
    words: { "kolana": kolano, "Padając": padac, "ufanie": ufac, "obce": obcy, "Deszcz": deszcz, "pism": pismo }
  - clean: "Gdy to mówiłem, sferą ognia całą\nJak błyskawicą święte światło drżało;\nPo chwili rzekło: — «Miłość dla tej cnoty,\nKtóra szła ze mną w obozów namioty,\nAż do męczeństwa, na miecze i groty,\nKtórą ty kochasz, te ci słowa wieje;\nLubię, żeś taką pokochał nadzieję»."
    verse: true
    chunks:
      - pl: "Gdy to mówiłem, sferą ognia całą"
        ru: "Пока я это говорил, всей огненной сферой,"
      - pl: "\nJak błyskawicą święte światło drżało;"
        ru: "как молнией, дрожал святой свет;"
      - pl: "\nPo chwili rzekło: — «Miłość dla tej cnoty,"
        ru: "через миг он сказал: — «Любовь к этой добродетели,"
      - pl: "\nKtóra szła ze mną w obozów namioty,"
        ru: "что шла со мной в шатры станов,"
        note: "obóz — лагерь"
      - pl: "\nAż do męczeństwa, na miecze i groty,"
        ru: "до самого мученичества, на мечи и копья,"
      - pl: "\nKtórą ty kochasz, te ci słowa wieje;"
        ru: "которую ты любишь, навевает тебе эти слова;"
      - pl: "\nLubię, żeś taką pokochał nadzieję»."
        ru: "мне мило, что ты полюбил такую надежду»."
    words: { "ognia": ogien, "światło": swiatlo, "obozów": oboz, "namioty": namiot, "miecze": miecz, "pokochał": pokochac }
  - clean: "A ja: — «Z Pism Starych i Nowych jest droga\nDla dusz wskazana wybranych przez Boga,\nWidzę ją jasno: wszak Izajasz mówi:\nW ojczyźnie swojej każdemu duchowi\nPrzydane będzie dwoiste pokrycie;\nOjczyzną jego jest to wieczne życie."
    verse: true
    chunks:
      - pl: "A ja: — «Z Pism Starych i Nowych jest droga"
        ru: "А я: — «Из Ветхого и Нового Писания указан"
      - pl: "\nDla dusz wskazana wybranych przez Boga,"
        ru: "путь для душ, избранных Богом,"
