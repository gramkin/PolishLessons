paragraphs:
  - clean: "Zygmunt August, jedyny syn Zygmunta Starego i Bony, objął samodzielne rządy w 1548 roku. Był człowiekiem wykształconym, wrażliwym i skrytym. Kochał książki, klejnoty, piękne tkaniny i konie, a w polityce był ostrożny i cierpliwy. Często odkładał decyzje na później, dlatego szlachta przezwała go królem „Jutro”. Kiedy jednak raz coś postanowił, potrafił być nieustępliwy. Najlepiej pokazała to historia jego miłości."
    draft: true
    chunks:
      - pl: "Zygmunt August, jedyny syn Zygmunta Starego i Bony, objął samodzielne rządy w 1548 roku."
        ru: "Сигизмунд Август, единственный сын Сигизмунда Старого и Боны, начал самостоятельно править в 1548 году."
      - pl: " Był człowiekiem wykształconym, wrażliwym i skrytym."
        ru: "Он был человеком образованным, чувствительным и скрытным."
        note: "wrażliwy — чувствительный; skryty — скрытный"
      - pl: " Kochał książki, klejnoty, piękne tkaniny i konie, a w polityce był ostrożny i cierpliwy."
        ru: "Он любил книги, драгоценности, красивые ткани и коней, а в политике был осторожен и терпелив."
      - pl: " Często odkładał decyzje na później, dlatego szlachta przezwała go królem „Jutro”."
        ru: "Он часто откладывал решения на потом, поэтому шляхта прозвала его королём «Завтра»."
        note: "odkładać — откладывать"
      - pl: " Kiedy jednak raz coś postanowił, potrafił być nieustępliwy."
        ru: "Но когда он что-то решал, то мог быть непреклонным."
        note: "nieustępliwy — непреклонный"
      - pl: " Najlepiej pokazała to historia jego miłości."
        ru: "Лучше всего это показала история его любви."
    words: { "objął": objac, "wykształconym": wyksztalcic, "wrażliwym": wrazliwy, "klejnoty": klejnot, "polityce": polityka, "cierpliwy": cierpliwy }
  - clean: "Jako młody wdowiec, jeszcze za życia ojca, Zygmunt August zakochał się w Barbarze Radziwiłłównie, pięknej wdowie z potężnego rodu litewskich magnatów. W 1547 roku poślubił ją potajemnie w Wilnie, bez zgody rodziców i senatorów. Kiedy sprawa wyszła na jaw, wybuchł skandal. Bona nienawidziła synowej, a szlachta uważała, że król powinien był poślubić zagraniczną księżniczkę, która przyniesie państwu korzyści, a nie córkę litewskiego magnata. Krążyły też plotki o rzekomo rozwiązłym życiu Barbary."
    draft: true
    chunks:
      - pl: "Jako młody wdowiec, jeszcze za życia ojca, Zygmunt August zakochał się w Barbarze Radziwiłłównie, pięknej wdowie z potężnego rodu litewskich magnatów."
        ru: "Будучи молодым вдовцом, ещё при жизни отца, Сигизмунд Август влюбился в Барбару Радзивилл, красивую вдову из могущественного рода литовских магнатов."
        note: "zakochać się — влюбиться"
      - pl: " W 1547 roku poślubił ją potajemnie w Wilnie, bez zgody rodziców i senatorów."
        ru: "В 1547 году он тайно обвенчался с ней в Вильно, без согласия родителей и сенаторов."
      - pl: " Kiedy sprawa wyszła na jaw, wybuchł skandal."
        ru: "Когда дело вышло наружу, разразился скандал."
        note: "wyjść na jaw — обнаружиться"
      - pl: " Bona nienawidziła synowej, a szlachta uważała, że król powinien był poślubić zagraniczną księżniczkę, która przyniesie państwu korzyści, a nie córkę litewskiego magnata."
        ru: "Бона ненавидела невестку, а шляхта считала, что король должен был жениться на иностранной принцессе, которая принесёт государству выгоду, а не на дочери литовского магната."
        note: "synowa — невестка (жена сына)"
      - pl: " Krążyły też plotki o rzekomo rozwiązłym życiu Barbary."
        ru: "Ходили и сплетни о якобы распутной жизни Барбары."
        note: "rzekomo — якобы; rozwiązły — распутный"
    words: { "wdowie": wdowa, "potężnego": potezny, "rodu": rod-2, "poślubił": poslubic, "wybuchł": wybuchnac, "skandal": skandal, "poślubić": poslubic, "zagraniczną": zagraniczny, "księżniczkę": ksiezniczka, "korzyści": korzysc, "Krążyły": krazyc, "plotki": plotka }
  - clean: "Na sejmie w Piotrkowie w 1548 roku posłowie na kolanach błagali króla, żeby unieważnił małżeństwo. Zygmunt August odmówił. Oświadczył, że dał słowo i nie złamie go, bo kto by mu potem uwierzył, skoro nie dotrzymał wiary własnej żonie. Po dwóch latach walki Barbara została koronowana na królową w katedrze wawelskiej. Szczęście nie trwało jednak długo. Kilka miesięcy po koronacji Barbara ciężko zachorowała i w maju 1551 roku zmarła."
    draft: true
    chunks:
      - pl: "Na sejmie w Piotrkowie w 1548 roku posłowie na kolanach błagali króla, żeby unieważnił małżeństwo."
        ru: "На сейме в Петркове в 1548 году послы на коленях умоляли короля расторгнуть брак."
        note: "błagać — умолять"
      - pl: " Zygmunt August odmówił."
        ru: "Сигизмунд Август отказался."
      - pl: " Oświadczył, że dał słowo i nie złamie go, bo kto by mu potem uwierzył, skoro nie dotrzymał wiary własnej żonie."
        ru: "Он заявил, что дал слово и не нарушит его, ибо кто бы ему потом поверил, если бы он не сдержал верности собственной жене."
        note: "oświadczyć — заявить; dotrzymać — сдержать"
      - pl: " Po dwóch latach walki Barbara została koronowana na królową w katedrze wawelskiej."
        ru: "После двух лет борьбы Барбара была коронована королевой в Вавельском соборе."
      - pl: " Szczęście nie trwało jednak długo."
        ru: "Но счастье длилось недолго."
      - pl: " Kilka miesięcy po koronacji Barbara ciężko zachorowała i w maju 1551 roku zmarła."
        ru: "Через несколько месяцев после коронации Барбара тяжело заболела и в мае 1551 года умерла."
    words: { "kolanach": kolano, "Oświadczył": oswiadczyc, "dotrzymał": dotrzymac, "ciężko": ciezko, "zachorowała": zachorowac, "maju": maj }
  - clean: "Plotkarze od razu oskarżyli Bonę o otrucie synowej, ale współcześni lekarze sądzą, że Barbara chorowała na raka. Zrozpaczony król towarzyszył trumnie żony w długiej drodze do Wilna, gdzie ją pochowano. Do końca życia nosił czarne szaty i otaczał się pamiątkami po Barbarze. Legenda opowiada, że czarnoksiężnik Twardowski wywołał dla niego w lustrze ducha zmarłej królowej. Historia miłości króla i Barbary stała się jednym z najpopularniejszych tematów polskiej literatury, malarstwa i filmu."
    draft: true
    chunks:
      - pl: "Plotkarze od razu oskarżyli Bonę o otrucie synowej, ale współcześni lekarze sądzą, że Barbara chorowała na raka."
        ru: "Сплетники сразу обвинили Бону в отравлении невестки, но современные врачи полагают, что Барбара болела раком."
        note: "plotkarz — сплетник; rak — рак"
      - pl: " Zrozpaczony król towarzyszył trumnie żony w długiej drodze do Wilna, gdzie ją pochowano."
        ru: "Отчаявшийся король сопровождал гроб жены в долгом пути в Вильно, где её похоронили."
        note: "trumna — гроб"
      - pl: " Do końca życia nosił czarne szaty i otaczał się pamiątkami po Barbarze."
        ru: "До конца жизни он носил чёрные одежды и окружал себя памятными вещами Барбары."
        note: "pamiątka — памятная вещь"
      - pl: " Legenda opowiada, że czarnoksiężnik Twardowski wywołał dla niego w lustrze ducha zmarłej królowej."
        ru: "Легенда рассказывает, что чернокнижник Твардовский вызвал для него в зеркале призрак умершей королевы."
        note: "czarnoksiężnik — чернокнижник; lustro — зеркало; duch — призрак"
      - pl: " Historia miłości króla i Barbary stała się jednym z najpopularniejszych tematów polskiej literatury, malarstwa i filmu."
        ru: "История любви короля и Барбары стала одной из самых популярных тем польской литературы, живописи и кино."
        note: "malarstwo — живопись"
    words: { "współcześni": wspolczesny, "chorowała": chorowac, "raka": rak, "towarzyszył": towarzyszyc, "trumnie": trumna, "pochowano": pochowac, "otaczał": otaczac, "pamiątkami": pamiatka, "Legenda": legenda, "wywołał": wywolac, "lustrze": lustro, "najpopularniejszych": popularny, "polskiej": polski, "literatury": literatura }
  - clean: "Trzecie małżeństwo Zygmunta Augusta, z Katarzyną Habsburżanką, siostrą pierwszej żony, było nieszczęśliwe i bezdzietne. Król szybko się z nią rozstał. Stało się jasne, że ostatni z Jagiellonów nie będzie miał następcy. Sprawa ta miała ogromne znaczenie polityczne. Dopóki Polska i Litwa miały wspólnego władcę z jednej dynastii, unia trzymała się mocno. Po jego śmierci oba państwa mogły się rozejść, a każde z nich wybrałoby sobie innego monarchę."
    draft: true
    chunks:
      - pl: "Trzecie małżeństwo Zygmunta Augusta, z Katarzyną Habsburżanką, siostrą pierwszej żony, było nieszczęśliwe i bezdzietne."
        ru: "Третий брак Сигизмунда Августа — с Екатериной Габсбург, сестрой первой жены, — был несчастливым и бездетным."
        note: "bezdzietny — бездетный"
      - pl: " Król szybko się z nią rozstał."
        ru: "Король быстро с ней расстался."
      - pl: " Stało się jasne, że ostatni z Jagiellonów nie będzie miał następcy."
        ru: "Стало ясно, что у последнего из Ягеллонов не будет наследника."
      - pl: " Sprawa ta miała ogromne znaczenie polityczne."
        ru: "Это дело имело огромное политическое значение."
      - pl: " Dopóki Polska i Litwa miały wspólnego władcę z jednej dynastii, unia trzymała się mocno."
        ru: "Пока у Польши и Литвы был общий правитель из одной династии, уния держалась крепко."
      - pl: " Po jego śmierci oba państwa mogły się rozejść, a każde z nich wybrałoby sobie innego monarchę."
        ru: "После его смерти оба государства могли разойтись, и каждое выбрало бы себе другого монарха."
    words: { "nieszczęśliwe": nieszczesliwy, "rozstał": rozstac, "następcy": nastepca, "polityczne": polityczny, "władcę": wladca, "rozejść": rozejsc }
  - clean: "Tymczasem w Koronie rósł w siłę ruch, który historycy nazywają ruchem egzekucyjnym. Jego nazwa pochodzi od łacińskiego słowa oznaczającego wykonanie: szlachta średnia domagała się wykonania, czyli egzekucji, praw, które istniały, ale nie były przestrzegane. Najważniejszym żądaniem był zwrot królewszczyzn, czyli dóbr królewskich, które dawni królowie oddali w zastaw albo w dzierżawę magnatom. Magnaci czerpali z nich ogromne dochody, a skarb państwa był pusty. Szlachta średnia chciała, żeby dobra te wróciły do króla i służyły na potrzeby państwa, zwłaszcza na obronę granic."
    draft: true
    chunks:
      - pl: "Tymczasem w Koronie rósł w siłę ruch, który historycy nazywają ruchem egzekucyjnym."
        ru: "Тем временем в Короне набирало силу движение, которое историки называют экзекуционным."
      - pl: " Jego nazwa pochodzi od łacińskiego słowa oznaczającego wykonanie: szlachta średnia domagała się wykonania, czyli egzekucji, praw, które istniały, ale nie były przestrzegane."
        ru: "Его название происходит от латинского слова, означающего исполнение: средняя шляхта требовала исполнения, то есть экзекуции, законов, которые существовали, но не соблюдались."
        note: "wykonanie — исполнение"
      - pl: " Najważniejszym żądaniem był zwrot królewszczyzn, czyli dóbr królewskich, które dawni królowie oddali w zastaw albo w dzierżawę magnatom."
        ru: "Главным требованием был возврат королевщин, то есть королевских имений, которые прежние короли отдали в залог или в аренду магнатам."
        note: "królewszczyzna — королевщина, королевское имение; dzierżawa — аренда"
      - pl: " Magnaci czerpali z nich ogromne dochody, a skarb państwa był pusty."
        ru: "Магнаты извлекали из них огромные доходы, а государственная казна была пуста."
      - pl: " Szlachta średnia chciała, żeby dobra te wróciły do króla i służyły na potrzeby państwa, zwłaszcza na obronę granic."
        ru: "Средняя шляхта хотела, чтобы эти имения вернулись к королю и служили нуждам государства, особенно обороне границ."
    words: { "Tymczasem": tymczasem, "rósł": rosnac, "nazwa": nazwa, "średnia": sredni, "egzekucji": egzekucja, "zwrot": zwrot, "królewskich": krolewski, "dochody": dochod }
  - clean: "Przez wiele lat Zygmunt August wahał się, czy poprzeć szlachtę, czy magnatów. W końcu, na sejmie w Piotrkowie w latach 1562–1563, przyszedł na obrady nie w królewskim stroju, ale w szarym stroju posła, i stanął po stronie ruchu egzekucyjnego. Sejm uchwalił, że nielegalnie zastawione dobra mają wrócić do skarbu. Jedna czwarta dochodów z królewszczyzn, nazwana kwartą, miała odtąd iść na utrzymanie stałego wojska, które od tej nazwy zwano wojskiem kwarcianym. Ruch egzekucyjny był jedną z najważniejszych prób naprawy państwa w dawnej Polsce, choć nie wszystkie jego postulaty udało się zrealizować."
    draft: true
    chunks:
      - pl: "Przez wiele lat Zygmunt August wahał się, czy poprzeć szlachtę, czy magnatów."
        ru: "Много лет Сигизмунд Август колебался, поддержать ли шляхту или магнатов."
      - pl: " W końcu, na sejmie w Piotrkowie w latach 1562–1563, przyszedł na obrady nie w królewskim stroju, ale w szarym stroju posła, i stanął po stronie ruchu egzekucyjnego."
        ru: "Наконец на сейме в Петркове в 1562–1563 годах он явился на заседания не в королевском облачении, а в сером платье посла и встал на сторону экзекуционного движения."
      - pl: " Sejm uchwalił, że nielegalnie zastawione dobra mają wrócić do skarbu."
        ru: "Сейм постановил, что незаконно заложенные имения должны вернуться в казну."
        note: "nielegalnie — незаконно"
      - pl: " Jedna czwarta dochodów z królewszczyzn, nazwana kwartą, miała odtąd iść na utrzymanie stałego wojska, które od tej nazwy zwano wojskiem kwarcianym."
        ru: "Четверть доходов с королевщин, названная квартой, отныне должна была идти на содержание постоянного войска, которое по этому названию звалось кварцяным."
        note: "kwarta — кварта, четвёртая часть"
      - pl: " Ruch egzekucyjny był jedną z najważniejszych prób naprawy państwa w dawnej Polsce, choć nie wszystkie jego postulaty udało się zrealizować."
        ru: "Экзекуционное движение было одной из самых значительных попыток исправить государство в старой Польше, хотя не все его требования удалось осуществить."
        note: "postulat — требование, постулат"
    words: { "wahał": wahac, "poprzeć": poprzec, "obrady": obrada, "królewskim": krolewski, "stroju": stroj, "szarym": szary, "czwarta": czwarty, "dochodów": dochod, "odtąd": odtad, "wojska": wojsko, "nazwy": nazwa, "zwano": zwac, "wojskiem": wojsko, "naprawy": naprawa }
  - clean: "Najważniejszym postulatem ruchu była jednak ściślejsza unia z Litwą. Polska szlachta zazdrościła wielkich majątków litewskim magnatom i chciała, by na Litwie obowiązywały te same zasady co w Koronie. Litewska szlachta średnia z kolei chciała mieć takie same prawa jak polska, bo u siebie była zdominowana przez kilka wielkich rodów, takich jak Radziwiłłowie. Magnaci litewscy bronili natomiast odrębności Wielkiego Księstwa, bo to ona zapewniała im władzę. Rozstrzygnęła jednak nie dyskusja, lecz wojna."
    draft: true
    chunks:
      - pl: "Najważniejszym postulatem ruchu była jednak ściślejsza unia z Litwą."
        ru: "Но важнейшим требованием движения была более тесная уния с Литвой."
      - pl: " Polska szlachta zazdrościła wielkich majątków litewskim magnatom i chciała, by na Litwie obowiązywały te same zasady co w Koronie."
        ru: "Польская шляхта завидовала большим имениям литовских магнатов и хотела, чтобы в Литве действовали те же правила, что и в Короне."
        note: "zazdrościć — завидовать"
      - pl: " Litewska szlachta średnia z kolei chciała mieć takie same prawa jak polska, bo u siebie była zdominowana przez kilka wielkich rodów, takich jak Radziwiłłowie."
        ru: "Литовская средняя шляхта, в свою очередь, хотела иметь такие же права, как польская, потому что у себя она была подавлена несколькими великими родами, такими как Радзивиллы."
        note: "z kolei — в свою очередь; zdominowany — подавленный, оттеснённый"
      - pl: " Magnaci litewscy bronili natomiast odrębności Wielkiego Księstwa, bo to ona zapewniała im władzę."
        ru: "Литовские магнаты, напротив, отстаивали обособленность Великого княжества, потому что именно она обеспечивала им власть."
        note: "odrębność — обособленность, самостоятельность"
      - pl: " Rozstrzygnęła jednak nie dyskusja, lecz wojna."
        ru: "Но решил дело не спор, а война."
    words: { "średnia": sredni, "ściślejsza": scisly, "zazdrościła": zazdroscic, "majątków": majatek, "polska": polski, "rodów": rod-2, "natomiast": natomiast, "zapewniała": zapewniac, "dyskusja": dyskusja }
  - clean: "W połowie XVI wieku rozpadało się państwo zakonu inflanckiego, czyli gałęzi Krzyżaków w Inflantach. Jego bogate miasta, takie jak Ryga, Dorpat czy Rewel, kusiły sąsiadów. W 1558 roku car Iwan IV Groźny najechał Inflanty, chcąc zdobyć dostęp do Bałtyku. Zakon zwrócił się o pomoc do Zygmunta Augusta i w 1561 roku poddał mu się. Inflanty przyłączono do Litwy i Polski, a ostatni mistrz zakonu został świeckim księciem Kurlandii, lennikiem króla. Zaczęła się długa wojna inflancka, w której Litwa musiała stawić czoła potężnej armii moskiewskiej."
    draft: true
    chunks:
      - pl: "W połowie XVI wieku rozpadało się państwo zakonu inflanckiego, czyli gałęzi Krzyżaków w Inflantach."
        ru: "В середине XVI века распадалось государство Ливонского ордена, то есть ветви крестоносцев в Инфлянтах."
