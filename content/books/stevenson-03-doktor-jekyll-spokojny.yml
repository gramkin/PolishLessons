paragraphs:
  - clean: "Dwa tygodnie później, szczęśliwym trafem, doktor wydał jeden ze swoich miłych obiadów dla pięciu czy sześciu starych kompanów, samych inteligentnych, szanowanych ludzi i znawców dobrego wina; a pan Utterson tak to urządził, że został, gdy inni już wyszli. Nie był to żaden nowy układ, lecz rzecz, która zdarzała się dziesiątki razy. Tam, gdzie Uttersona lubiano, lubiano go bardzo. Gospodarze chętnie zatrzymywali suchego adwokata, gdy beztroscy i gadatliwi stawiali już nogę na progu; lubili posiedzieć chwilę w jego dyskretnym towarzystwie, ćwicząc się w samotności i trzeźwiejąc w bogatym milczeniu tego człowieka po wydatkach i wysiłku wesołości."
    en: "A fortnight later, by excellent good fortune, the doctor gave one of his pleasant dinners to some five or six old cronies, all intelligent, reputable men and all judges of good wine; and Mr. Utterson so contrived that he remained behind after the others had departed. This was no new arrangement, but a thing that had befallen many scores of times. Where Utterson was liked, he was liked well. Hosts loved to detain the dry lawyer, when the light-hearted and loose-tongued had already their foot on the threshold; they liked to sit a while in his unobtrusive company, practising for solitude, sobering their minds in the man’s rich silence after the expense and strain of gaiety."
    draft: true
