  - clean: "— Mój dobry Uttersonie — rzekł doktor — to bardzo ładnie z twojej strony, to po prostu wspaniale z twojej strony, i nie umiem znaleźć słów, żeby ci podziękować. Wierzę ci w zupełności; zaufałbym ci prędzej niż komukolwiek z żyjących, ba, prędzej niż sobie, gdybym mógł wybierać; ale doprawdy to nie jest to, co sobie wyobrażasz; nie jest aż tak źle; i żeby uspokoić twoje dobre serce, powiem ci jedno: w chwili, gdy tylko zechcę, mogę się pozbyć pana Hyde'a."
    en: "“My good Utterson,” said the doctor, “this is very good of you, this is downright good of you, and I cannot find words to thank you in. I believe you fully; I would trust you before any man alive, ay, before myself, if I could make the choice; but indeed it isn’t what you fancy; it is not as bad as that; and just to put your good heart at rest, I will tell you one thing: the moment I choose, I can be rid of Mr. Hyde."
    draft: true
