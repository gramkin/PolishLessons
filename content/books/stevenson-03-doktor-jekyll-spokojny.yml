  - clean: "— To nic nie zmieni. Nie rozumiesz mojego położenia — odparł doktor z pewną bezładnością. — Jestem w przykrej sytuacji, Uttersonie; moje położenie jest bardzo dziwne… bardzo dziwne. To jedna z tych spraw, których nie da się naprawić gadaniem."
    en: "“It can make no change. You do not understand my position,” returned the doctor, with a certain incoherency of manner. “I am painfully situated, Utterson; my position is a very strange—a very strange one. It is one of those affairs that cannot be mended by talking.”"
