  - clean: "Uważny obserwator mógłby wywnioskować, że temat jest nieprzyjemny; ale doktor zbył to wesoło. — Mój biedny Uttersonie — rzekł — masz pecha, że trafił ci się taki klient. Nigdy nie widziałem człowieka tak zmartwionego jak ty moim testamentem; chyba że tego skostniałego pedanta Lanyona tym, co nazywał moimi naukowymi herezjami. Och, wiem, że to porządny człowiek… nie musisz marszczyć brwi… znakomity człowiek, i zawsze zamierzam widywać go częściej; ale mimo to skostniały pedant; nieuk i krzykliwy pedant. Nikim nigdy nie byłem bardziej rozczarowany niż Lanyonem."
    en: "A close observer might have gathered that the topic was distasteful; but the doctor carried it off gaily. “My poor Utterson,” said he, “you are unfortunate in such a client. I never saw a man so distressed as you were by my will; unless it were that hide-bound pedant, Lanyon, at what he called my scientific heresies. O, I know he’s a good fellow—you needn’t frown—an excellent fellow, and I always mean to see more of him; but a hide-bound pedant for all that; an ignorant, blatant pedant. I was never more disappointed in any man than Lanyon.”"
    draft: true
    chunks:
      - pl: "Uważny obserwator mógłby wywnioskować, że temat jest nieprzyjemny;"
        ru: "Внимательный наблюдатель мог бы заключить, что тема неприятна;"
        note: "wywnioskować — заключить, сделать вывод"
      - pl: " ale doktor zbył to wesoło."
        ru: "но доктор весело отшутился."
        note: "zbyć coś — отделаться от чего-л."
      - pl: " — Mój biedny Uttersonie — rzekł — masz pecha, że trafił ci się taki klient."
