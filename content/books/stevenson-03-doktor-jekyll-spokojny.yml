      - pl: " chyba że tego skostniałego pedanta Lanyona tym, co nazywał moimi naukowymi herezjami."
        ru: "разве что этого закоснелого педанта Лэньона тем, что он называл моими научными ересями."
        note: "skostniały — закостенелый"
