  - clean: "Doktor Jekyll nie był wyjątkiem od tej reguły; i gdy siedział teraz po drugiej stronie kominka — rosły, dobrze zbudowany mężczyzna lat pięćdziesięciu o gładkiej twarzy, z nieco może chytrym wyrazem, ale ze wszystkimi znamionami zdolności i dobroci — po jego spojrzeniu widać było, że żywi dla pana Uttersona szczere i gorące przywiązanie."
    en: "To this rule, Dr. Jekyll was no exception; and as he now sat on the opposite side of the fire—a large, well-made, smooth-faced man of fifty, with something of a slyish cast perhaps, but every mark of capacity and kindness—you could see by his looks that he cherished for Mr. Utterson a sincere and warm affection."
    draft: true
    chunks:
      - pl: "Doktor Jekyll nie był wyjątkiem od tej reguły;"
        ru: "Доктор Джекил не был исключением из этого правила;"
      - pl: " i gdy siedział teraz po drugiej stronie kominka"
        ru: "и когда он сидел теперь по другую сторону камина"
      - pl: " — rosły, dobrze zbudowany mężczyzna lat pięćdziesięciu o gładkiej twarzy,"
        ru: "— рослый, хорошо сложённый пятидесятилетний мужчина с гладким лицом,"
      - pl: " z nieco może chytrym wyrazem, ale ze wszystkimi znamionami zdolności i dobroci —"
        ru: "с выражением, может быть, немного лукавым, но со всеми признаками ума и доброты, —"
        note: "znamię — признак, печать"
