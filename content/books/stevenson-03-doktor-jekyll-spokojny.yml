        ru: "О, я знаю, он славный малый… не хмурься… превосходный малый,"
        note: "marszczyć brwi — хмуриться"
      - pl: " i zawsze zamierzam widywać go częściej;"
        ru: "и я всегда собираюсь видеться с ним почаще;"
      - pl: " ale mimo to skostniały pedant; nieuk i krzykliwy pedant."
        ru: "но всё-таки закоснелый педант; невежественный, крикливый педант."
        note: "nieuk — невежда"
      - pl: " Nikim nigdy nie byłem bardziej rozczarowany niż Lanyonem."
