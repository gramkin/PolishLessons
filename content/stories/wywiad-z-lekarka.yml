    ru: — Тогда, пожалуйста, не лежите часами и не смотрите на часы.
    words: { proszę: prosze, leżeć: lezec, godzinami: godzina, patrzeć: patrzec }
  - pl: – Lepiej wstać, przejść do innego pokoju i poczytać coś spokojnego przy słabym świetle, aż przyjdzie senność.
    ru: — Лучше встать, перейти в другую комнату и почитать что-нибудь спокойное при слабом свете, пока не придёт сонливость.
