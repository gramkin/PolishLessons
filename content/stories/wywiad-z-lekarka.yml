    ru: — Может быть, сразу ничего не изменится, но я думаю, что через неделю многие из вас заметят разницу.
    words: { nic: nic, myślę: myslec, tydzień: tydzien, państwa: panstwo-wy, zauważy: zauwazyc }
  - pl: – Dziękuję pani bardzo za rozmowę. Moim i państwa gościem była doktor Anna Kowalczyk.
    ru: — Большое вам спасибо за беседу. Нашей с вами гостьей была доктор Анна Ковальчик.
    words: { Dziękuję: dziekuje, pani: pani, rozmowę: rozmowa, państwa: panstwo-wy, gościem: gosc }
  - pl: – Dziękuję, panie redaktorze. Dobrej nocy państwu, choć jest dopiero dziewiąta rano.
    ru: — Спасибо, пан редактор. Спокойной вам ночи, хотя сейчас только девять утра.
    words: { Dziękuję: dziekuje, panie: pan, redaktorze: redaktor, nocy: noc, państwu: panstwo-wy, rano: rano }
questions:
  - type: choice
    q: Сколько спит сама доктор Ковальчик по будням?
    options:
      - Около шести часов
      - Около семи часов
      - Четыре часа в сутки
      - Девять часов
    answer: 1
    explain: "«…w tygodniu sypiam około siedmiu godzin, a w weekendy trochę dłużej.» По четыре часа она спала (sypiałam), когда работала в больнице."
  - type: choice
    q: Что, по словам врача, чаще всего говорят ей пациенты?
    options:
      - Что спят слишком долго
      - Что не могут проснуться без будильника
      - Что не могут заснуть и всё равно не заснут раньше двух
      - Что видят страшные сны
    answer: 2
    explain: "«Że nie mogą zasnąć.» и «i tak nie zasnę przed drugą» — совершенный вид в форме будущего с отрицанием: «не засну, не получится»."
  - type: choice
    q: Что врач советует тем, кто использует телефон как будильник?
    options:
      - Ставить телефон в беззвучный режим
      - Купить обычный будильник
      - Класть телефон под подушку
      - Вообще не ставить будильник
    answer: 1
    explain: "«Wtedy radzę kupić zwykły budzik. Kosztuje niewiele, a nie wysyła powiadomień.»"
  - type: choice
    q: Сколько, по мнению врача, можно спать днём?
    options:
      - Двадцать — самое большее тридцать минут
      - Час
      - Два часа
      - Днём спать нельзя
    answer: 0
    explain: "«Wolno, a nawet warto, ale krótko: dwadzieścia, najwyżej trzydzieści minut.» Wolno — «можно, разрешено»."
  - type: choice
    q: Можно ли, по словам врача, отоспаться за всю неделю в субботу?
    options:
      - Да, если спать до обеда
      - Да, если лечь пораньше в пятницу
      - Нет, лучше каждый день ложиться и вставать примерно в одно время
      - Нет, в выходные надо вставать раньше, чем в будни
    answer: 2
    explain: "«Niestety, nie da się odespać tygodnia w jedną noc.» Nie da się + совершенный вид — «невозможно». «Lepiej codziennie kłaść się i wstawać o podobnej porze»."
