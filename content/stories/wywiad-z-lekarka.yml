    words: { pani: pani, odpowiada: odpowiadac }
  - pl: – Że to błędne koło. Jeśli ktoś przez kilka tygodni kładzie się coraz później, organizm się do tego przyzwyczaja i rano nie da się wstać.
    ru: — Что это порочный круг. Если человек несколько недель ложится всё позже, организм к этому привыкает, и утром невозможно встать.
    words: { Jeśli: jesli, ktoś: ktos, kilka: kilka, tygodni: tydzien, kładzie: klasc, rano: rano, wstać: wstac }
  - pl: – Brzmi znajomo. Ja też miewam takie tygodnie.
    ru: — Звучит знакомо. У меня тоже бывают такие недели.
    words: { miewam: miewac, tygodnie: tydzien }
  - pl: – Większość z nas je miewa. Problem zaczyna się wtedy, kiedy taki tydzień trwa trzy miesiące.
    ru: — У большинства из нас они бывают. Проблема начинается тогда, когда такая неделя длится три месяца.
    words: { Większość: wiekszosc, miewa: miewac, Problem: problem, kiedy: kiedy, tydzień: tydzien, miesiące: miesiac }
  - pl: – Przejdźmy do rad. Co pani radzi słuchaczom, którzy źle sypiają?
    ru: — Перейдём к советам. Что вы советуете слушателям, которые плохо спят?
