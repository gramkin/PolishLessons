  - pl: "– Wielu mi mówi: „Pani doktor, i tak nie zasnę przed drugą, więc po co się kłaść?”"
    ru: "— Многие говорят мне: «Пани доктор, я всё равно не засну раньше двух, так зачем ложиться?»"
