  - pl: – Po pierwsze, proszę nie pić kawy po południu. Wiem, że to trudne, ale filiżanka kawy o piątej to nie jest dobry pomysł.
    ru: — Во-первых, пожалуйста, не пейте кофе после обеда. Знаю, что это трудно, но чашка кофе в пять часов — не очень хорошая идея.
    words: { proszę: prosze, pić: pic, kawy: kawa, Wiem: wiedziec, trudne: trudny, filiżanka: filizanka, dobry: dobry, pomysł: pomysl }
  - pl: "– Mojemu synowi powtarzam to prawie codziennie: nie pij kawy wieczorem! Oczywiście bez skutku."
    ru: "— Своему сыну я повторяю это почти каждый день: не пей кофе вечером! Разумеется, безрезультатно."
    words: { synowi: syn, powtarzam: powtarzac, codziennie: codziennie, pij: pic, kawy: kawa, skutku: skutek }
  - pl: – A jeśli ktoś po kawie zasypia bez problemu?
    ru: — А если кто-то после кофе засыпает без проблем?
    words: { jeśli: jesli, ktoś: ktos, kawie: kawa, problemu: problem }
  - pl: – Bywa i tak. Ale wielu moich pacjentów mówi, że odkąd przestali pić kawę wieczorem, śpią spokojniej.
    ru: — Бывает и так. Но многие мои пациенты говорят, что с тех пор, как перестали пить кофе вечером, спят спокойнее.
    words: { Bywa: bywac, pacjentów: pacjent, mówi: mowic, przestali: przestac, pić: pic, kawę: kawa, śpią: spac }
  - pl: – Po drugie, na godzinę przed snem warto wyłączyć telefon.
    ru: — Во-вторых, за час до сна стоит выключить телефон.
    words: { drugie: drugi, godzinę: godzina, snem: sen, warto: warto, wyłączyć: wylaczyc, telefon: telefon }
  - pl: – Wyłączyć, a nie tylko wyciszyć?
    ru: — Выключить, а не просто отключить звук?
