  - pl: – Mam wrażenie, że pani mówi teraz bezpośrednio do mnie.
    ru: — У меня такое впечатление, что вы сейчас обращаетесь прямо ко мне.
    words: { pani: pani, mówi: mowic, teraz: teraz }
  - pl: – Nie jest pan wyjątkiem, panie redaktorze. Sama czasem łapię się na tym, że czytam w łóżku maile.
    ru: — Вы не исключение, пан редактор. Я сама иногда ловлю себя на том, что читаю в постели письма.
    words: { pan: pan, panie: pan, redaktorze: redaktor, Sama: sam, czasem: czasem, czytam: czytac, łóżku: lozko }
  - pl: – A co z drzemką w ciągu dnia? Wolno się zdrzemnąć po obiedzie?
    ru: — А как насчёт короткого сна днём? Можно вздремнуть после обеда?
    words: { drzemką: drzemka, dnia: dzien, Wolno: wolno, obiedzie: obiad }
  - pl: "– Wolno, a nawet warto, ale krótko: dwadzieścia, najwyżej trzydzieści minut."
    ru: "— Можно и даже стоит, но недолго: двадцать, самое большее тридцать минут."
