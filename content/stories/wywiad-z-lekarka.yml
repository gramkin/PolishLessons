  - pl: – To pocieszające. Co pani słyszy najczęściej od pacjentów?
    ru: — Это утешает. Что вы чаще всего слышите от пациентов?
    words: { pani: pani, słyszy: slyszec, pacjentów: pacjent }
  - pl: – Że nie mogą zasnąć. Kładą się o jedenastej, a o pierwszej w nocy wciąż patrzą w sufit.
    ru: — Что не могут заснуть. Ложатся в одиннадцать, а в час ночи всё ещё смотрят в потолок.
