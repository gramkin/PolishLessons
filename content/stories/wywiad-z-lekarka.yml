  - pl: – Najlepiej wyłączyć i wynieść do innego pokoju. Kto ma telefon przy łóżku, ten „tylko na chwilę” sprawdza wiadomości i nagle jest północ.
    ru: — Лучше всего выключить и вынести в другую комнату. Кто держит телефон у кровати, тот «только на минутку» проверяет сообщения, и вдруг уже полночь.
    words: { wyłączyć: wylaczyc, wynieść: wyniesc, pokoju: pokoj, telefon: telefon, łóżku: lozko, chwilę: chwila, wiadomości: wiadomosc, nagle: nagle }
  - pl: – Ale wielu ludzi używa telefonu jako budzika.
