  - pl: – Nie musi pan nastawiać budzika. Jeśli przez cały tydzień kładzie się pan o stałej porze, obudzi się pan sam.
    ru: — Вам не обязательно ставить будильник. Если всю неделю вы ложитесь в одно и то же время, вы проснётесь сами.
    words: { musi: musiec, pan: pan, budzika: budzik, Jeśli: jesli, tydzień: tydzien, kładzie: klasc, obudzi: obudzic, sam: sam }
  - pl: – Pani doktor, a jeśli ktoś leży w łóżku i naprawdę nie może zasnąć? Co wtedy?
    ru: — Пани доктор, а если человек лежит в кровати и действительно не может заснуть? Что тогда?
    words: { Pani: pani, jeśli: jesli, ktoś: ktos, leży: lezec, łóżku: lozko, może: moc, zasnąć: zasnac }
