  - pl: – Niestety, nie da się odespać tygodnia w jedną noc. Można trochę odpocząć, ale zaległego snu nie odzyskamy w jeden weekend.
    ru: — К сожалению, отоспаться за неделю за одну ночь невозможно. Можно немного отдохнуть, но недоспанное мы за одни выходные не вернём.
    words: { Niestety: niestety, odespać: odespac, tygodnia: tydzien, noc: noc, Można: mozna, snu: sen, weekend: weekend }
  - pl: – Lepiej codziennie kłaść się i wstawać o podobnej porze, także w sobotę i w niedzielę.
