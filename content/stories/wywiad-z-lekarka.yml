  - pl: – A pani ile sypia?
    ru: — А вы сколько спите?
    words: { pani: pani, ile: ile, sypia: sypiac }
  - pl: – Przyznam się, że w tygodniu sypiam około siedmiu godzin, a w weekendy trochę dłużej.
    ru: — Признаюсь, по будням я сплю около семи часов, а по выходным немного дольше.
