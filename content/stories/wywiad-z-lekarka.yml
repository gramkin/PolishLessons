  - pl: – Wytrzyma pan. Pierwsze trzy wieczory bywają trudne, potem robi się łatwiej.
    ru: — Выдержите. Первые три вечера бывают трудными, потом становится легче.
    words: { Wytrzyma: wytrzymac, pan: pan, Pierwsze: pierwszy, wieczory: wieczor, bywają: bywac, trudne: trudny }
  - pl: – A kiedy z bezsennością trzeba iść do lekarza?
    ru: — А когда с бессонницей нужно идти к врачу?
    words: { kiedy: kiedy, bezsennością: bezsennosc, trzeba: trzeba, iść: isc, lekarza: lekarz }
  - pl: – Jeśli źle pan sypia od kilku tygodni, a zmiana nawyków nic nie daje, nie warto czekać. Trzeba porozmawiać z lekarzem.
    ru: — Если вы плохо спите уже несколько недель, а изменение привычек ничего не даёт, ждать не стоит. Нужно поговорить с врачом.
