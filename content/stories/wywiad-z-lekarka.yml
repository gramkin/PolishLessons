  - pl: – Kto śpi po obiedzie dwie godziny, ten wieczorem nie zaśnie i koło się zamyka.
    ru: — Кто спит после обеда два часа, тот вечером не заснёт, и круг замыкается.
    words: { śpi: spac, obiedzie: obiad, godziny: godzina, zaśnie: zasnac }
  - pl: – Słuchacze często pytają też o weekendy. Czy można odespać cały tydzień w sobotę?
    ru: — Слушатели часто спрашивают и о выходных. Можно ли отоспаться за всю неделю в субботу?
