    words: { używa: uzywac, telefonu: telefon, budzika: budzik }
  - pl: – Wtedy radzę kupić zwykły budzik. Kosztuje niewiele, a nie wysyła powiadomień.
    ru: — Тогда советую купить обычный будильник. Стоит недорого, а уведомлений не присылает.
