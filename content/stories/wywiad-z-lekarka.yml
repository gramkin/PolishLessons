  - pl: – Kiedy pracowałam w szpitalu, bywały tygodnie, kiedy sypiałam po cztery godziny na dobę. Lekarze też bywają niekonsekwentni.
    ru: — Когда я работала в больнице, бывали недели, когда я спала по четыре часа в сутки. Врачи тоже бывают непоследовательными.
