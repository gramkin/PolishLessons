  - pl: – Nie ma jednej odpowiedzi dla wszystkich. Moim zdaniem większości dorosłych wystarcza siedem, osiem godzin.
    ru: — Одного ответа для всех нет. По-моему, большинству взрослых хватает семи-восьми часов.
    words: { odpowiedzi: odpowiedz, większości: wiekszosc, dorosłych: dorosly, siedem: siedem, osiem: osiem, godzin: godzina }
  - pl: – Ale bywają osoby, które sypiają po sześć godzin i czują się świetnie.
    ru: — Но бывают люди, которые спят по шесть часов и чувствуют себя прекрасно.
