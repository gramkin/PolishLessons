# review
title: Wywiad z lekarką
titleRu: Интервью с врачом
level: B2
chapter: 31
description: "Утренняя радиопередача: ведущий расспрашивает врача о сне — многократные sypiać, bywać, miewać, вид в советах и запретах (proszę nie pić kawy, warto wyłączyć telefon), nie da się и nie zasnę в значении «не смогу»."
sentences:
  - pl: – Dzień dobry, witam państwa w porannej audycji. Moim gościem jest dziś doktor Anna Kowalczyk, lekarka, która od lat zajmuje się problemami ze snem.
    ru: — Доброе утро, приветствую вас в утренней передаче. Моя гостья сегодня — доктор Анна Ковальчик, врач, которая много лет занимается проблемами со сном.
    words: { Dzień dobry: dzien-dobry, państwa: panstwo-wy, audycji: audycja, gościem: gosc, lekarka: lekarka, zajmuje: zajmowac, problemami: problem, snem: sen }
  - pl: – Dzień dobry, panie redaktorze, dzień dobry państwu.
    ru: — Здравствуйте, пан редактор, здравствуйте, уважаемые слушатели.
    words: { Dzień dobry: dzien-dobry, panie: pan, redaktorze: redaktor, dzień dobry: dzien-dobry, państwu: panstwo-wy }
  - pl: – Pani doktor, zacznijmy od pytania, które słuchacze zadają nam najczęściej. Ile godzin powinien spać dorosły człowiek?
    ru: — Пани доктор, начнём с вопроса, который слушатели задают нам чаще всего. Сколько часов должен спать взрослый человек?
