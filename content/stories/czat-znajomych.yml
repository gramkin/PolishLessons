  - pl: "Ola: Moja ciocia ma domek nad jeziorem i mówi, że możemy z niego korzystać od piątku do niedzieli."
    ru: "Ола: У моей тёти есть домик на озере, и она говорит, что мы можем пользоваться им с пятницы до воскресенья."
