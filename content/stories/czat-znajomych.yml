# review
title: Czat znajomych
titleRu: Чат друзей
level: B2
chapter: 35
description: "Четверо друзей в групповом чате планируют выходные в домике на озере, а Войтек пишет им канцелярским языком; разговорная речь: spoko, serio, sorki, luz, no co ty, w sumie, np., мягкий отказ с raczej и chyba."
sentences:
  - pl: "Ola: Hej, ludzie! Macie jakieś plany na weekend?"
