questions:
  - type: choice
    q: Где друзья собираются провести выходные?
    options:
      - В домике тёти Олы на озере
      - В палатках в лесу
      - В гостинице у моря
      - Дома у Войтека
    answer: 0
    explain: "«Moja ciocia ma domek nad jeziorem i mówi, że możemy z niego korzystać od piątku do niedzieli.» Nad jeziorem — творительный после nad."
  - type: choice
    q: Почему Магда просит выехать позже?
    options:
      - Она боится ездить днём
      - В пятницу она работает до пяти
      - Ей нужно испечь пирог
      - У неё нет водительских прав
    answer: 1
    explain: "«Sorki, ale ja w piątek pracuję do siedemnastej. Dałoby się wyjechać trochę później?» Dałoby się — мягкая безличная просьба: «нельзя ли было бы»."
  - type: choice
    q: Почему над ответом Войтека про палатку смеются?
    options:
      - У него нет палатки
      - Палатка слишком маленькая для четверых
      - Он говорит о своей палатке канцелярским «dysponuję» — «располагаю»
      - Он предлагает спать в палатке всем вместе
    answer: 2
    explain: "«Owszem, dysponuję namiotem dwuosobowym.» — «„Dysponuję”… No nie mogę.» Между друзьями сказали бы просто: Mam namiot."
  - type: choice
    q: Как Магда отказывается учиться плавать на байдарке?
    options:
      - "Резко: «Nie.»"
      - Говорит, что у неё нет времени
      - Просит Войтека её заменить
      - "Мягко: «Ja raczej nie», благодарит и предлагает «может, в другой раз»"
    answer: 3
    explain: "«Ja raczej nie. Trochę się boję głębokiej wody.» и «Dzięki, ale chyba wolę poleżeć na pomoście. Może innym razem.» Raczej, trochę, chyba смягчают отказ."
  - type: choice
    q: Почему Войтек не может вести машину на обратном пути?
    options:
      - У него нет водительских прав
      - Он устанет после выходных
      - Он не любит ездить в темноте
      - Машина принадлежит отцу Кубы
    answer: 0
    explain: "«Z przykrością informuję, że nie posiadam prawa jazdy.» — «Czyli po prostu nie masz, tak?» Posiadać — книжное «обладать»; в разговоре — mieć."
  - type: choice
    q: Что делает Магда, когда Войтек впервые пишет по-простому?
    options:
      - Предлагает ему повести машину
      - Делает скриншот, чтобы им поверили
      - Отвечает ему официальным письмом
      - Удаляет его из чата
    answer: 1
    explain: "«Robię zrzut ekranu, bo nikt nam nie uwierzy!» Zrzut ekranu — «скриншот», буквально «сброс экрана»."
  - type: listen
    text: "Dałoby się wyjechać trochę później?"
    explain: "Czy dałoby się…? — вежливая безличная просьба; trochę później — «чуть позже»."
