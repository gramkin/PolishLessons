# review
title: Znowu w sklepie
titleRu: Снова в магазине
level: B2
chapter: 36
description: "Марта закупается к приезду родителей мужа в магазинчике у дома: числительные при взвешивании (półtora kilograma, dwadzieścia deka, w pięć osób), претензия к прокисшему молоку, акция и оплата картой, а продавщица и постоянный покупатель пан Юзеф не скупятся на поговорки — kupować kota w worku, mieć węża w kieszeni, nie taki diabeł straszny."
sentences:
  - pl: "Pani Halina: Dzień dobry, pani Marto! Dawno pani u nas nie było."
    ru: "Пани Галина: Добрый день, пани Марта! Давно вы к нам не заходили."
    words: { Dzień dobry: dzien-dobry, pani: pani, Dawno: dawno }
  - pl: "Marta: Dzień dobry! Wie pani, ostatnio mam w pracy urwanie głowy."
    ru: "Марта: Здравствуйте! Знаете, у меня последнее время на работе дел невпроворот."
    words: { Dzień dobry: dzien-dobry, pracy: praca, urwanie głowy: urwanie-glowy }
  - pl: "Pani Halina: Rozumiem. To w czym mogę dziś pomóc?"
    ru: "Пани Галина: Понимаю. Так чем могу сегодня помочь?"
    words: { Rozumiem: rozumiec, pomóc: pomoc }
  - pl: "Marta: W sobotę przychodzą do mnie teściowie, więc chcę ich ugościć jak należy."
    ru: "Марта: В субботу ко мне приходят родители мужа, так что я хочу принять их как следует."
    words: { sobotę: sobota, teściowie: tesciowie }
  - pl: "Pan Józef: Teściowie? No to gratuluję odwagi."
    ru: "Пан Юзеф: Родители мужа? Ну, поздравляю с храбростью."
    words: { Teściowie: tesciowie, gratuluję: gratulowac }
  - pl: "Marta: Dziękuję, panie Józefie, przyda mi się."
    ru: "Марта: Спасибо, пан Юзеф, она мне пригодится."
  - pl: "Pani Halina: Niech pan nie straszy klientki! Co podać na początek?"
    ru: "Пани Галина: Не пугайте покупательницу! Что вам дать для начала?"
    words: { pan: pan }
  - pl: "Marta: Poproszę półtora kilograma ziemniaków i dwadzieścia deka szynki."
    ru: "Марта: Дайте, пожалуйста, полтора килограмма картошки и двести граммов ветчины."
    words: { półtora: poltora, kilograma: kilogram, ziemniaków: ziemniak, dwadzieścia: dwadziescia, deka: deka, szynki: szynka }
  - pl: "Pani Halina: Szynka jest dziś w promocji: przy dwóch opakowaniach trzecie dostaje pani gratis."
    ru: "Пани Галина: Ветчина сегодня по акции: при покупке двух упаковок третью вы получаете бесплатно."
    words: { Szynka: szynka, promocji: promocja, opakowaniach: opakowanie, trzecie: trzeci, dostaje: dostawac }
  - pl: "Marta: Kusząca oferta, ale trzech opakowań nie zjemy nawet w pięć osób."
    ru: "Марта: Заманчивое предложение, но три упаковки мы не съедим даже впятером."
    words: { oferta: oferta, opakowań: opakowanie, zjemy: zjesc, pięć: piec, osób: osoba }
  - pl: "Pan Józef: Co za dużo, to niezdrowo."
    ru: "Пан Юзеф: Всё хорошо в меру."
    words: { "Co za dużo, to niezdrowo": co-za-duzo-to-niezdrowo }
  - pl: "Marta: A ser? Ten żółty, który brałam ostatnio, był wyśmienity."
    ru: "Марта: А сыр? Тот жёлтый, который я брала в прошлый раз, был превосходный."
    words: { ser: ser, żółty: zolty }
  - pl: "Pani Halina: Niestety, już się skończył. Hurtownia przywiezie nową dostawę dopiero w piątek."
    ru: "Пани Галина: К сожалению, он уже закончился. С оптового склада привезут новую партию только в пятницу."
    words: { Niestety: niestety, Hurtownia: hurtownia, dopiero: dopiero, piątek: piatek }
  - pl: "Marta: Dopiero w piątek? A ja chciałam zrobić zapiekankę już w czwartek."
    ru: "Марта: Только в пятницу? А я хотела приготовить запеканку уже в четверг."
    words: { Dopiero: dopiero, piątek: piatek, czwartek: czwartek }
  - pl: "Pani Halina: To może ten wędzony, z gór? Proszę spróbować, dam pani kawałek."
    ru: "Пани Галина: Тогда, может, вот этот копчёный, с гор? Попробуйте, я дам вам кусочек."
    words: { wędzony: wedzony, gór: gora, spróbować: sprobowac, kawałek: kawalek }
  - pl: "Marta: Mmm, rzeczywiście pyszny. Niech będzie trzydzieści deka."
    ru: "Марта: Ммм, действительно вкусный. Пусть будет триста граммов."
    words: { pyszny: pyszny, trzydzieści: trzydziesci, deka: deka }
  - pl: "Pan Józef: Dobrze, że pani spróbowała. Nie ma co kupować kota w worku."
    ru: "Пан Юзеф: Хорошо, что вы попробовали. Нечего покупать кота в мешке."
    words: { spróbowała: sprobowac, kupować kota w worku: kupowac-kota-w-worku }
  - pl: "Marta: A właśnie, przy okazji: muszę coś u pani reklamować."
    ru: "Марта: Ах да, кстати: мне нужно предъявить вам претензию."
    words: { reklamować: reklamowac }
  - pl: "Marta: Mleko, które kupiłam przedwczoraj, było kwaśne, choć termin ważności jeszcze nie minął."
    ru: "Марта: Молоко, которое я купила позавчера, было кислым, хотя срок годности ещё не истёк."
    words: { Mleko: mleko, kwaśne: kwasny, choć: choc, termin ważności: termin-waznosci }
  - pl: "Pani Halina: Naprawdę? Bardzo przepraszam. Ma pani może paragon?"
    ru: "Пани Галина: Правда? Прошу прощения. У вас, случайно, есть чек?"
    words: { Naprawdę: naprawde, przepraszam: przepraszac, paragon: paragon }
  - pl: "Marta: Mam, zachowałam na wszelki wypadek."
    ru: "Марта: Есть, я сохранила на всякий случай."
  - pl: "Pani Halina: Świetnie. Zwrócę pani pieniądze albo wymienię mleko na świeże, jak pani woli."
    ru: "Пани Галина: Отлично. Я верну вам деньги или поменяю молоко на свежее, как вам удобнее."
    words: { Zwrócę: zwrocic, pieniądze: pieniadz, wymienię: wymienic, mleko: mleko, woli: wolec }
  - pl: "Marta: Wolę wymianę, i tak muszę kupić dwa litry."
    ru: "Марта: Лучше поменять, мне всё равно нужно купить два литра."
    words: { Wolę: wolec, wymianę: wymiana, litry: litr }
  - pl: "Pan Józef: Za moich czasów mleko przynosiło się prosto od krowy i nikt nie narzekał."
    ru: "Пан Юзеф: В мои времена молоко приносили прямо от коровы, и никто не жаловался."
    words: { mleko: mleko, krowy: krowa }
  - pl: "Pani Halina: Panie Józefie, za pana czasów to i chleb kosztował grosze."
    ru: "Пани Галина: Пан Юзеф, в ваши времена и хлеб стоил гроши."
    words: { chleb: chleb, kosztował: kosztowac, grosze: grosz }
  - pl: "Pan Józef: Święta prawda. Dziś za bochenek płaci się prawie dziesięć złotych."
    ru: "Пан Юзеф: Святая правда. Сегодня за буханку платишь почти десять злотых."
    words: { Święta: swiety, prawda: prawda, bochenek: bochenek, płaci: placic, dziesięć: dziesiec, złotych: zloty }
  - pl: "Marta: Skoro o chlebie mowa, poproszę jeszcze dwa bochenki razowego."
    ru: "Марта: Раз уж речь о хлебе, дайте ещё, пожалуйста, две буханки цельнозернового."
    words: { chlebie: chleb, mowa: mowa, bochenki: bochenek, razowego: razowy }
  - pl: "Pani Halina: Razowego zostały tylko dwa, ma pani szczęście."
    ru: "Пани Галина: Цельнозерновых осталось только две, вам повезло."
    words: { Razowego: razowy, szczęście: szczescie }
  - pl: "Marta: To jeszcze wino. Teść jest koneserem, więc nie mogę kupić byle czego."
    ru: "Марта: Тогда ещё вино. Свёкор — знаток, так что я не могу купить что попало."
    words: { wino: wino, Teść: tesc, koneserem: koneser }
  - pl: "Pani Halina: Proszę wziąć to czerwone z Węgier. Mało kto o nim wie, ale jest warte swojej ceny."
    ru: "Пани Галина: Возьмите вот это красное из Венгрии. Мало кто о нём знает, но оно стоит своих денег."
    words: { czerwone: czerwony, ceny: cena }
  - pl: "Marta: Ile kosztuje butelka?"
    ru: "Марта: Сколько стоит бутылка?"
    words: { kosztuje: kosztowac, butelka: butelka }
  - pl: "Pani Halina: Czterdzieści dziewięć dziewięćdziesiąt dziewięć."
    ru: "Пани Галина: Сорок девять девяносто девять."
    words: { Czterdzieści: czterdziesci, dziewięćdziesiąt: dziewiecdziesiat }
  - pl: "Pan Józef: Pięćdziesiąt złotych za butelkę? Toż to rozbój w biały dzień!"
    ru: "Пан Юзеф: Пятьдесят злотых за бутылку? Да это же грабёж средь бела дня!"
    words: { Pięćdziesiąt: piecdziesiat, złotych: zloty, butelkę: butelka, rozbój w biały dzień: rozboj-w-bialy-dzien }
  - pl: "Pani Halina: Pan Józef ma węża w kieszeni, niech pani go nie słucha."
    ru: "Пани Галина: Пан Юзеф у нас скуповат, не слушайте его."
    words: { ma węża w kieszeni: miec-weza-w-kieszeni, słucha: sluchac }
  - pl: "Pan Józef: Nie skąpię, tylko liczę każdy grosz. To różnica!"
    ru: "Пан Юзеф: Я не скуплюсь, я просто считаю каждый грош. Это разные вещи!"
    words: { skąpię: skapic, liczę: liczyc, grosz: grosz }
  - pl: "Marta: Wezmę dwie butelki. Na teściach się nie oszczędza."
    ru: "Марта: Возьму две бутылки. На родителях мужа не экономят."
    words: { butelki: butelka, teściach: tesciowie, oszczędza: oszczedzac }
  - pl: "Pani Halina: I słusznie. Coś jeszcze?"
    ru: "Пани Галина: И правильно. Что-нибудь ещё?"
  - pl: "Marta: Chyba wszystko. A nie, jeszcze ciasto! Prawie zapomniałam o deserze."
    ru: "Марта: Кажется, всё. Ах нет, ещё пирог! Чуть не забыла про десерт."
    words: { Chyba: chyba, ciasto: ciasto, zapomniałam: zapomniec, deserze: deser }
  - pl: "Pani Halina: Sernik przywieźli dziś rano, jeszcze ciepły. Ile pani dać?"
    ru: "Пани Галина: Сырник привезли сегодня утром, ещё тёплый. Сколько вам дать?"
    words: { Sernik: sernik, rano: rano }
  - pl: "Marta: Pół kilo wystarczy. Teściowa i tak przyniesie swoje ciasto."
    ru: "Марта: Полкило хватит. Свекровь всё равно принесёт свой пирог."
    words: { Pół: pol, Teściowa: tesciowa, ciasto: ciasto }
  - pl: "Pan Józef: Jak każda teściowa. Nie od dziś wiadomo, że jej ciasto jest zawsze najlepsze."
    ru: "Пан Юзеф: Как любая свекровь. Давно известно, что её пирог всегда самый лучший."
    words: { teściowa: tesciowa, ciasto: ciasto }
  - pl: "Pani Halina: Razem będzie sto osiemdziesiąt sześć złotych i czterdzieści groszy."
    ru: "Пани Галина: Итого с вас сто восемьдесят шесть злотых сорок грошей."
    words: { Razem: razem, sto: sto, sześć: szesc, złotych: zloty, czterdzieści: czterdziesci, groszy: grosz }
  - pl: "Marta: Zapłacę kartą, jeśli można."
    ru: "Марта: Я заплачу картой, если можно."
    words: { Zapłacę: zaplacic, kartą: karta }
  - pl: "Pani Halina: Oczywiście. Proszę przyłożyć kartę do terminala."
    ru: "Пани Галина: Конечно. Приложите карту к терминалу."
    words: { kartę: karta }
  - pl: "Pani Halina: Gotowe. Paragon włożę pani do torby."
    ru: "Пани Галина: Готово. Чек положу вам в сумку."
    words: { Paragon: paragon, torby: torba }
  - pl: "Marta: Dziękuję za pomoc. Bez pani byłabym jak bez ręki."
    ru: "Марта: Спасибо за помощь. Без вас я была бы как без рук."
    words: { Dziękuję: dziekowac, jak bez ręki: jak-bez-reki }
  - pl: "Pani Halina: Drobiazg. Proszę potem opowiedzieć, jak poszło z teściami."
    ru: "Пани Галина: Пустяки. Расскажите потом, как всё прошло с родителями мужа."
    words: { teściami: tesciowie }
  - pl: "Pan Józef: I proszę się nie przejmować. Nie taki diabeł straszny, jak go malują."
    ru: "Пан Юзеф: И не переживайте. Не так страшен чёрт, как его малюют."
    words: { "Nie taki diabeł straszny, jak go malują": nie-taki-diabel-straszny }
  - pl: "Marta: Mam nadzieję, że ma pan rację. Do widzenia!"
    ru: "Марта: Надеюсь, вы правы. До свидания!"
    words: { rację: racja, Do widzenia: do-widzenia }
  - pl: "Pani Halina: Do widzenia, powodzenia w sobotę!"
    ru: "Пани Галина: До свидания, удачи в субботу!"
    words: { Do widzenia: do-widzenia, sobotę: sobota }
  - pl: "Pan Józef: No, to teraz moja kolej. Pani Halinko, poproszę jedną bułkę."
    ru: "Пан Юзеф: Ну, теперь моя очередь. Пани Галинка, одну булочку, пожалуйста."
    words: { teraz: teraz, bułkę: bulka }
  - pl: "Pani Halina: Jedną? Panie Józefie, przy takich zakupach to ja zbankrutuję."
    ru: "Пани Галина: Одну? Пан Юзеф, с такими покупками я разорюсь."
    words: { zakupach: zakupy }
questions:
  - type: choice
    q: Зачем Марта пришла за покупками?
    options:
      - В субботу к ней придут родители мужа
      - У неё день рождения
      - Она вернулась из долгой командировки
      - Она устраивает праздник на работе
    answer: 0
    explain: "«W sobotę przychodzą do mnie teściowie, więc chcę ich ugościć jak należy.» Teściowie — родители мужа или жены, сразу оба."
  - type: choice
    q: Почему Марта не пользуется акцией на ветчину?
    options:
      - Ветчина по акции несвежая
      - Три упаковки им не съесть даже впятером
      - Акция уже закончилась
      - Она не ест ветчину
    answer: 1
    explain: "«Kusząca oferta, ale trzech opakowań nie zjemy nawet w pięć osób.» W pięć osób — «впятером»: предлог w с винительным числительного и osób."
  - type: choice
    q: Почему Марта берёт копчёный сыр, а не жёлтый?
    options:
      - Копчёный дешевле
      - Жёлтый закончился, а копчёный ей понравился на пробу
      - Свёкор любит только копчёный
      - Жёлтый сыр оказался кислым
    answer: 1
    explain: "«Niestety, już się skończył.» — «Proszę spróbować, dam pani kawałek.» — «Mmm, rzeczywiście pyszny.» Пан Юзеф одобряет: nie ma co kupować kota w worku."
  - type: choice
    q: Что не так было с молоком?
    options:
      - Его продали без чека
      - У него истёк срок годности
      - Оно скисло, хотя срок годности не истёк
      - Марта купила не то молоко
    answer: 2
    explain: "«Mleko, które kupiłam przedwczoraj, było kwaśne, choć termin ważności jeszcze nie minął.» Reklamować — предъявить претензию к товару, а не «рекламировать»."
  - type: choice
    q: Что пани Галина говорит о пане Юзефе словами «ma węża w kieszeni»?
    options:
      - Что он носит с собой что-то опасное
      - Что он хитрый
      - Что он скупой
      - Что он всегда торопится
    answer: 2
    explain: "«Pan Józef ma węża w kieszeni, niech pani go nie słucha.» Змея в кармане кусает того, кто тянется за деньгами. Сам он спорит: «Nie skąpię, tylko liczę każdy grosz.»"
  - type: choice
    q: Почему пани Галина шутит, что разорится?
    options:
      - Марта заплатила картой
      - Пан Юзеф покупает одну булочку
      - Она вернула Марте деньги за молоко
      - Ветчину отдают даром
    answer: 1
    explain: "«Pani Halinko, poproszę jedną bułkę.» — «Jedną? Panie Józefie, przy takich zakupach to ja zbankrutuję.» Halinko — ласковый звательный падеж от Halinka."
  - type: listen
    text: Nie ma co kupować kota w worku.
    explain: "Nie ma co + инфинитив — «нечего, незачем»: nie ma co płakać. W перед глухим k оглушается: «ф во́рку»."
