questions:
  - type: choice
    q: Зачем пан Новак пришёл к Ане?
    options:
      - Он уезжает и просит кормить его кота
      - Он потерял ключ от дома
      - Он хочет подарить Ане кота
      - Он ищет её брата Марека
    answer: 0
    explain: "Он едет в Краков к сестре на пять дней и спрашивает: «Czy mogłaby pani karmić mojego kota?»"
  - type: choice
    q: Почему Аня не может сама кормить кота?
    options:
      - Она боится котов
      - Утром она на работе
      - Она тоже уезжает в Краков
      - Филип её не любит
    answer: 1
    explain: "Аня говорит: «rano jestem w pracy» — утром она на работе. Котов она не боится: Филипа она очень любит."
  - type: choice
    q: Где Марек искал кота?
    options:
      - В парке и на улице
      - У Ани дома
      - Под столом, под стулом и у окна
      - На вокзале
    answer: 2
    explain: "«Szukał pod stołem, pod krzesłem i przy oknie» — pod + творительный (stołem, krzesłem), przy + предложный (oknie)."
  - type: choice
    q: Где на самом деле был Филип?
    options:
      - Под кроватью в доме пана Новака
      - У Ани
      - У соседей
      - В чемодане пана Новака, в Кракове
    answer: 3
    explain: "Пан Новак звонит: «Spał w mojej walizce! Zobaczyłem go w pociągu» — кот уехал с ним в Краков."
  - type: choice
    q: "Какая форма стоит в тексте? «Czy ___ pani karmić mojego kota?»"
    options: [mogłaby, mógłby, mogłabyś]
    answer: 0
    explain: "Вежливое pani — третье лицо женского рода: mogła + by = mogłaby. Mógłby — с pan, mogłabyś — на «ты» женщине."
  - type: listen
    text: Marek czekał godzinę, ale Filip nie przyszedł.
    explain: "czekał godzinę — винительный падеж срока, как русское «ждал час»; przyszedł — прошедшее от przyjść."
  - type: translate
    q: Если бы я (ж.) работала дома, проблемы бы не было.
    answer:
      - Gdybym pracowała w domu, nie byłoby problemu.
      - Gdybym pracowała w domu, to nie byłoby problemu.
      - Nie byłoby problemu, gdybym pracowała w domu.
    explain: "by уже сидит в gdybym, поэтому глагол рядом в простом прошедшем: pracowała. В главной части — byłoby, а после отрицания родительный: problemu."
  - type: translate
    q: Я (м.) бы тоже так сделал.
    answer:
      - Ja też bym tak zrobił.
      - Też bym tak zrobił.
      - Ja bym też tak zrobił.
      - Ja też zrobiłbym tak.
      - Też zrobiłbym tak.
    explain: "bym можно поставить вперёд, после też, или оставить на глаголе (zrobiłbym), но только в одном месте."
