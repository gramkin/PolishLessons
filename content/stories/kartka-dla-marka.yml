questions:
  - type: choice
    q: Почему Марек присматривает за котом?
    options: ["Аня уезжает на три дня в Гданьск", "Аня заболела", "Кот живёт у Марека"]
    answer: 0
    explain: "Ania jedzie na trzy dni do Gdańska. Kotem będzie się zajmował Marek, kolega z pracy."
  - type: choice
    q: Что, по записке, нельзя давать коту?
    options: ["молоко", "воду", "еду вечером"]
    answer: 0
    explain: "Nie dawaj mu mleka, tylko wodę. После nie — несовершенный вид dawaj и родительный mleka."
  - type: choice
    q: Почему Марек открывает окно?
    options: ["Дома очень тепло", "Кот просится на улицу", "Так написано в записке"]
    answer: 0
    explain: "W domu jest bardzo ciepło, więc Marek otwiera okno. А в записке как раз стояло: Nie otwieraj okna!"
  - type: choice
    q: Где был кот?
    options: ["у пани Новак", "под столом", "в Гданьске с Аней"]
    answer: 0
    explain: "Przyszedł do mnie przez okno — говорит пани Новак. Под столом Марек его искал, но не нашёл."
  - type: choice
    q: О чём пани Новак просит Марека?
    options: ["не говорить Ане, что она даёт коту молоко", "закрыть окно", "позвонить Ане"]
    answer: 0
    explain: "Tylko proszę nie mówić o tym Ani! Вежливая просьба — proszę + инфинитив, и nie стоит перед инфинитивом."
  - type: choice
    q: "Как написать в записке «Не открывай окно!»?"
    options: ["Nie otwieraj okna!", "Nie otwórz okna!", "Nie otwieraj okno!"]
    answer: 0
    explain: "Запрет — несовершенный вид: nie otwieraj. Nie otwórz звучит как «смотри не открой случайно». После отрицания дополнение в родительном: okna."
  - type: listen
    text: Zawsze zamykaj dom na klucz.
    explain: "zamykaj — форма «ты» от zamykać: zamyka + -j, как czyta → czytaj."
  - type: translate
    q: Не волнуйтесь (мужчине).
    answer: ["Niech pan się nie martwi.", "Niech się pan nie martwi.", "Proszę się nie martwić."]
    explain: "Незнакомому — не форма на -cie, а niech pan + 3-е лицо: niech pan się nie martwi. Можно и proszę + инфинитив: proszę się nie martwić."
  - type: translate
    q: Позвони мне завтра.
    answer: ["Zadzwoń do mnie jutro.", "Zadzwoń jutro do mnie.", "Jutro do mnie zadzwoń."]
    explain: "Одно действие — совершенный вид: zadzwoń. «Позвонить кому-то» — zadzwonić do + родительный: do mnie."
