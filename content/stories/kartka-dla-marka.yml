# review
title: Kartka dla Marka
titleRu: Записка для Марека
level: A2
chapter: 15
description: "Аня уезжает и оставляет Мареку записку о своём коте, но у кота свои планы. Повелительное наклонение: daj, nie dawaj, nie otwieraj, zadzwoń, а вежливо — niech pan… и proszę + инфинитив."
