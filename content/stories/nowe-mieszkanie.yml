# review
title: Nowe mieszkanie
titleRu: Новая квартира
level: B1
chapter: 26
description: "Молодая пара переезжает в первую собственную квартиру, где прежний хозяин оставил всё сломанным, а помогает им сосед — электрик на пенсии; словообразование: pakowanie, po przeprowadzce, wnieść, wynieść, przemalować, dokręcić, pokoik, kartonowy, kuchenny."
sentences:
  - pl: Ola i Kuba przez dwa lata mieszkali w małym pokoiku u ciotki Kuby, a w maju w końcu kupili swoje pierwsze mieszkanie.
    ru: Оля и Куба два года жили в маленькой комнатке у тёти Кубы, а в мае наконец купили свою первую квартиру.
    words: { mieszkali: mieszkac, małym: maly, pokoiku: pokoik, kupili: kupic, pierwsze: pierwszy, mieszkanie: mieszkanie }
  - pl: Pakowanie zajęło im cały tydzień.
    ru: Сборы заняли у них целую неделю.
    words: { Pakowanie: pakowanie, tydzień: tydzien }
  - pl: Książki, kubki i ubrania trafiły do kartonowych pudeł, a na każdym pudle Ola napisała flamastrem, co jest w środku.
    ru: Книги, кружки и одежда отправились в картонные коробки, и на каждой коробке Оля написала фломастером, что внутри.
    words: { Książki: ksiazka, kubki: kubek, ubrania: ubranie, kartonowych: kartonowy, pudeł: pudlo, pudle: pudlo }
  - pl: W dniu przeprowadzki padał deszcz, a winda w nowym bloku nie działała.
    ru: В день переезда шёл дождь, а лифт в новом доме не работал.
    words: { dniu: dzien, przeprowadzki: przeprowadzka, deszcz: deszcz, winda: winda, nowym: nowy, bloku: blok }
  - pl: – Wszystko trzeba wnieść na ostatnie piętro po schodach – westchnął Kuba.
    ru: — Всё придётся занести на последний этаж по лестнице, — вздохнул Куба.
    words: { Wszystko: wszystko, wnieść: wniesc, piętro: pietro, schodach: schody }
  - pl: Pomagali im brat Oli i jego dwaj koledzy. Wnieśli na górę szafę, łóżko, kanapę i mały kuchenny stolik.
    ru: Им помогали брат Оли и двое его друзей. Они занесли наверх шкаф, кровать, диван и маленький кухонный столик.
    words: { brat: brat, koledzy: kolega, Wnieśli: wniesc, szafę: szafa, łóżko: lozko, kanapę: kanapa, mały: maly, kuchenny: kuchenny, stolik: stolik }
  - pl: W łazience stała stara pralka, której poprzedni właściciel nie chciał zabrać, więc najpierw trzeba ją było wynieść.
    ru: В ванной стояла старая стиральная машина, которую прежний владелец не захотел забрать, так что сначала её нужно было вынести.
    words: { łazience: lazienka, stara: stary, pralka: pralka, poprzedni: poprzedni, właściciel: wlasciciel, chciał: chciec, wynieść: wyniesc }
  - pl: Przeniesienie kanapy przez wąski korytarz zajęło im pół godziny i kosztowało jedną porysowaną ścianę.
    ru: Чтобы пронести диван через узкий коридор, им понадобилось полчаса, и это стоило одной поцарапанной стены.
    words: { kanapy: kanapa, ścianę: sciana }
  - pl: Wieczorem, gdy koledzy poszli do domu, Ola i Kuba usiedli na podłodze wśród pudeł.
    ru: Вечером, когда друзья ушли домой, Оля и Куба сели на пол среди коробок.
    words: { Wieczorem: wieczor, koledzy: kolega, domu: dom, podłodze: podloga, pudeł: pudlo }
  - pl: Dopiero teraz, po przeprowadzce, zaczęli zauważać, w jakim stanie jest mieszkanie.
    ru: Только теперь, после переезда, они начали замечать, в каком состоянии квартира.
    words: { teraz: teraz, przeprowadzce: przeprowadzka, mieszkanie: mieszkanie }
  - pl: Kran w kuchni ciekł, w łazience nie świeciła lampa, a w sypialni z gniazdka wystawały kable.
    ru: Кран на кухне подтекал, в ванной не горела лампа, а в спальне из розетки торчали провода.
    words: { kuchni: kuchnia, ciekł: cieknac, łazience: lazienka, lampa: lampa, sypialni: sypialnia, gniazdka: gniazdko }
  - pl: – Przy oglądaniu wszystko wyglądało dobrze – powiedziała Ola.
    ru: — Когда мы смотрели квартиру, всё выглядело хорошо, — сказала Оля.
    words: { wszystko: wszystko, powiedziała: powiedziec }
  - pl: – Bo poprzedni właściciel przed sprzedażą tylko pomalował ściany na biało – odpowiedział Kuba.
    ru: — Потому что прежний владелец перед продажей только покрасил стены в белый цвет, — ответил Куба.
    words: { poprzedni: poprzedni, właściciel: wlasciciel, ściany: sciana }
  - pl: Następnego dnia rano ktoś zapukał do drzwi.
    ru: На следующее утро кто-то постучал в дверь.
    words: { dnia: dzien, rano: rano, ktoś: ktos, zapukał: zapukac, drzwi: drzwi }
  - pl: Na progu stał starszy pan z drewnianą skrzynką na narzędzia.
    ru: На пороге стоял пожилой мужчина с деревянным ящиком для инструментов.
    words: { starszy: starszy, pan: pan, drewnianą: drewniany, skrzynką: skrzynka, narzędzia: narzedzie }
  - pl: – Dzień dobry, jestem Henryk Kowalczyk, mieszkam naprzeciwko. Wczoraj widziałem, jak wnosiliście meble, i pomyślałem, że może się przydam.
    ru: — Добрый день, я Хенрик Ковальчик, живу напротив. Вчера я видел, как вы заносили мебель, и подумал, что, может быть, пригожусь.
    words: { mieszkam: mieszkac, naprzeciwko: naprzeciwko, widziałem: widziec, pomyślałem: pomyslec }
  - pl: Okazało się, że pan Henryk jest emerytem, a przez czterdzieści lat pracował jako elektryk.
    ru: Оказалось, что пан Хенрик — пенсионер, а сорок лет он проработал электриком.
    words: { pan: pan, emerytem: emeryt, czterdzieści: czterdziesci, pracował: pracowac, elektryk: elektryk }
  - pl: – Najpierw wyłączymy prąd – powiedział i poszedł do skrzynki z bezpiecznikami na klatce schodowej.
    ru: — Сначала отключим электричество, — сказал он и пошёл к щитку с пробками на лестничной клетке.
    words: { prąd: prad, powiedział: powiedziec, skrzynki: skrzynka }
  - pl: Potem odkręcił gniazdko, obejrzał kable i pokręcił głową.
    ru: Потом он открутил розетку, осмотрел провода и покачал головой.
    words: { odkręcił: odkrecic, gniazdko: gniazdko, głową: glowa }
  - pl: – Kto to podłączał? Na pewno nie elektryk, raczej jakaś złota rączka po trzech piwach.
    ru: — Кто это подключал? Точно не электрик, скорее какой-нибудь мастер на все руки после трёх кружек пива.
    words: { Kto: kto, elektryk: elektryk, rączka: raczka, piwach: piwo }
  - pl: Nowe gniazdko założył w dwadzieścia minut, a potem wkręcił w łazience nową żarówkę.
    ru: Новую розетку он поставил за двадцать минут, а потом вкрутил в ванной новую лампочку.
    words: { Nowe: nowy, gniazdko: gniazdko, dwadzieścia: dwadziescia, minut: minuta, łazience: lazienka, nową: nowy, żarówkę: zarowka }
  - pl: Kuba w tym czasie próbował dokręcić kran w kuchni, ale woda wciąż kapała.
    ru: Куба тем временем пытался подтянуть кран на кухне, но вода всё равно капала.
    words: { próbował: probowac, dokręcić: dokrecic, kuchni: kuchnia, woda: woda }
  - pl: – Nie dokręcaj tak mocno, bo zerwiesz gwint. Tu trzeba wymienić uszczelkę – powiedział pan Henryk.
    ru: — Не закручивай так сильно, а то сорвёшь резьбу. Здесь нужно поменять прокладку, — сказал пан Хенрик.
    words: { mocno: mocno, wymienić: wymienic, uszczelkę: uszczelka, powiedział: powiedziec, pan: pan }
  - pl: Wyjął ze skrzynki nową uszczelkę – miał ich tam chyba ze sto – i po pięciu minutach kran przestał cieknąć.
    ru: Он достал из ящика новую прокладку — их у него там было, наверное, штук сто, — и через пять минут кран перестал течь.
    words: { skrzynki: skrzynka, nową: nowy, uszczelkę: uszczelka, sto: sto, pięciu: piec, minutach: minuta, cieknąć: cieknac }
  - pl: Ola zaparzyła kawę, a przy kawie opowiedziała sąsiadowi o swoich planach.
    ru: Оля сварила кофе и за кофе рассказала соседу о своих планах.
    words: { kawę: kawa, kawie: kawa, sąsiadowi: sasiad }
  - pl: – Chcemy przemalować sypialnię na zielono, a z małego pokoiku zrobić gabinet.
    ru: — Мы хотим перекрасить спальню в зелёный цвет, а из маленькой комнатки сделать кабинет.
    words: { Chcemy: chciec, przemalować: przemalowac, sypialnię: sypialnia, małego: maly, pokoiku: pokoik, zrobić: zrobic }
  - pl: – Do malowania pożyczę wam drabinę – powiedział sąsiad. – Tylko najpierw rozpakujcie pudła, bo w takim bałaganie nie da się pracować.
    ru: — Для покраски я одолжу вам стремянку, — сказал сосед. — Только сначала распакуйте коробки, а то в таком беспорядке работать невозможно.
    words: { malowania: malowanie, drabinę: drabina, powiedział: powiedziec, sąsiad: sasiad, rozpakujcie: rozpakowac, pudła: pudlo, pracować: pracowac }
  - pl: Rozpakowywanie trwało jeszcze tydzień.
    ru: Распаковка заняла ещё неделю.
    words: { Rozpakowywanie: rozpakowywanie, tydzień: tydzien }
  - pl: "Codziennie po pracy wyjmowali z pudeł kolejne rzeczy i szukali dla nich miejsca: książki na półki, kubki do szafki kuchennej, ubrania do szafy."
    ru: "Каждый день после работы они доставали из коробок очередные вещи и искали для них место: книги — на полки, кружки — в кухонный шкафчик, одежду — в шкаф."
    words: { Codziennie: codziennie, pracy: praca, pudeł: pudlo, rzeczy: rzecz, szukali: szukac, miejsca: miejsce, książki: ksiazka, półki: polka, kubki: kubek, szafki: szafka, kuchennej: kuchenny, ubrania: ubranie, szafy: szafa }
  - pl: Biurko Kuby przenieśli z sypialni do małego pokoiku, który miał zostać gabinetem.
    ru: Письменный стол Кубы перенесли из спальни в маленькую комнатку, которая должна была стать кабинетом.
    words: { Biurko: biurko, przenieśli: przeniesc, sypialni: sypialnia, małego: maly, pokoiku: pokoik }
  - pl: Niektórych pudeł w ogóle nie rozpakowali, tylko od razu wynieśli do piwnicy.
    ru: Некоторые коробки они вообще не стали распаковывать, а сразу вынесли в подвал.
    words: { pudeł: pudlo, rozpakowali: rozpakowac, wynieśli: wyniesc, piwnicy: piwnica }
  - pl: W następną sobotę urządzili parapetówkę.
    ru: В следующую субботу они устроили новоселье.
    words: { sobotę: sobota, parapetówkę: parapetowka }
  - pl: Przyszli rodzice, brat Oli, koledzy, którzy nosili meble, i oczywiście pan Henryk z żoną.
    ru: Пришли родители, брат Оли, друзья, которые таскали мебель, и, конечно, пан Хенрик с женой.
    words: { Przyszli: przyjsc, rodzice: rodzice, brat: brat, koledzy: kolega, nosili: nosic, pan: pan, żoną: zona }
  - pl: Goście przynieśli kwiaty, wino, ciasto i bardzo praktyczny prezent – wiertarkę.
    ru: Гости принесли цветы, вино, пирог и очень практичный подарок — дрель.
    words: { Goście: gosc, kwiaty: kwiat, wino: wino, ciasto: ciasto, prezent: prezent, wiertarkę: wiertarka }
  - pl: Kieliszków jeszcze nie rozpakowali, więc wino pili z kubków.
    ru: Бокалы они ещё не распаковали, поэтому вино пили из кружек.
    words: { Kieliszków: kieliszek, rozpakowali: rozpakowac, wino: wino, pili: pic, kubków: kubek }
  - pl: – Za nowe mieszkanie i za sąsiadów! – powiedział brat Oli, podnosząc kubek.
    ru: — За новую квартиру и за соседей! — сказал брат Оли, поднимая кружку.
    words: { nowe: nowy, mieszkanie: mieszkanie, sąsiadów: sasiad, powiedział: powiedziec, brat: brat, kubek: kubek }
  - pl: – I za złote rączki – dodał pan Henryk i mrugnął do Kuby.
    ru: — И за золотые руки, — добавил пан Хенрик и подмигнул Кубе.
    words: { rączki: raczka, pan: pan }
  - pl: Sprzątanie po imprezie zostawili na niedzielę.
    ru: Уборку после вечеринки они оставили на воскресенье.
    words: { Sprzątanie: sprzatanie, imprezie: impreza, niedzielę: niedziela }
  - pl: Ola rozejrzała się po pokoju. Ściany wciąż były białe, ale pierwszy raz od tygodnia poczuła się tu jak w domu.
    ru: Оля оглядела комнату. Стены всё ещё были белыми, но впервые за неделю она почувствовала себя здесь как дома.
    words: { pokoju: pokoj, Ściany: sciana, białe: bialy, pierwszy: pierwszy, tygodnia: tydzien, domu: dom }
questions:
  - type: choice
    q: Где жили Оля и Куба до покупки квартиры?
    options:
      - В общежитии
      - В маленькой комнатке у тёти Кубы
      - У родителей Оли
      - В съёмной квартире на последнем этаже
    answer: 1
    explain: "«…mieszkali w małym pokoiku u ciotki Kuby…» Pokoik — уменьшительное от pokój, как «комнатка»; w pokoiku — предложный падеж."
  - type: choice
    q: Почему в день переезда было особенно тяжело?
    options:
      - Не приехала машина с вещами
      - Друзья опоздали на три часа
      - Шёл дождь, а лифт не работал
      - Ключи от квартиры остались у прежнего владельца
    answer: 2
    explain: "«W dniu przeprowadzki padał deszcz, a winda w nowym bloku nie działała.» Поэтому всё пришлось wnieść — занести — по лестнице."
  - type: choice
    q: Что пара обнаружила в квартире после переезда?
    options:
      - Протекающий кран, неработающую лампу и торчащие из розетки провода
      - Сломанный холодильник и разбитое окно
      - Мокрый потолок в спальне
      - Что стены покрашены в зелёный цвет
    answer: 0
    explain: "«Kran w kuchni ciekł, w łazience nie świeciła lampa, a w sypialni z gniazdka wystawały kable.» Gniazdko — «розетка», буквально «гнёздышко»."
  - type: choice
    q: Кем раньше работал пан Хенрик?
    options:
      - Сантехником
      - Строителем
      - Продавцом в магазине инструментов
      - Электриком
    answer: 3
    explain: "«…pan Henryk jest emerytem, a przez czterdzieści lat pracował jako elektryk.» Emeryt — «пенсионер»."
  - type: choice
    q: Почему кран продолжал капать, хотя Куба его подтягивал?
    options:
      - Кран был закрыт не до конца
      - Нужно было поменять прокладку
      - В доме отключили воду
      - Куба крутил его не в ту сторону
    answer: 1
    explain: "«Nie dokręcaj tak mocno, bo zerwiesz gwint. Tu trzeba wymienić uszczelkę.» Do- в dokręcić — «до конца», как русское «докрутить»."
  - type: choice
    q: Из чего гости пили вино на новоселье?
    options:
      - Из бокалов, которые подарил пан Хенрик
      - Из бутылки
      - Из кружек, потому что бокалы ещё не распаковали
      - Гости не пили вина
    answer: 2
    explain: "«Kieliszków jeszcze nie rozpakowali, więc wino pili z kubków.» Отрицание требует родительного падежа: nie rozpakowali kieliszków."
  - type: listen
    text: "Pakowanie zajęło im cały tydzień."
    explain: "Pakowanie — отглагольное существительное от pakować (-ać → -anie), среднего рода: zajęło."
