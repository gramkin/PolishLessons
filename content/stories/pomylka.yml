questions:
  - type: choice
    q: Зачем Марек звонил в пятницу?
    options:
      - Чтобы заказать торт в пекарне
      - Чтобы пригласить пани Зофью
      - Чтобы поздравить сестру
      - Чтобы узнать адрес пекарни
    answer: 0
    explain: "«W piątek dzwoni pod numer piekarni, żeby zamówić tort.» Dzwonić pod numer — звонить по номеру."
  - type: choice
    q: Куда Марек попал на самом деле?
    options:
      - В другую пекарню
      - Домой к пожилой женщине
      - В ресторан
      - К своей сестре
    answer: 1
    explain: "Пани Зофья отвечает: «to nie jest piekarnia. Jestem w domu!»"
  - type: choice
    q: Почему Марек не заказал торт в пекарне на своей улице?
    options:
      - Там невкусные торты
      - Там нет шоколадных тортов
      - В субботу она закрыта
      - Он не знает её номера
    answer: 2
    explain: "«Piekarnia przy naszej ulicy jest w sobotę zamknięta.» Zamknięta — женский род, как piekarnia."
  - type: choice
    q: Что пани Зофья попросила вместо денег?
    options:
      - Купить ей шоколад
      - Позвонить ей в воскресенье
      - Ничего не просила
      - Пригласить её на кусочек торта
    answer: 3
    explain: "«Nie musi pan płacić… Proszę mnie tylko zaprosić na kawałek!» Proszę + инфинитив — вежливая просьба."
  - type: choice
    q: "Какая форма стоит в тексте? «Zadzwoniłem do niej przez ___!»"
    options: [pomyłkę, pomyłka, pomyłki]
    answer: 0
    explain: "przez требует винительного падежа: pomyłka → przez pomyłkę, «по ошибке»."
  - type: listen
    text: Jestem na emeryturze i mam dużo czasu.
    explain: "na emeryturze — na + предложный: emerytura → emeryturze (r → rz перед -e). После dużo — родительный: czasu."
  - type: translate
    q: Извините, это, наверное, ошибка.
    answer:
      - Przepraszam, to chyba pomyłka.
      - Przepraszam, to pewnie pomyłka.
      - Przepraszam, chyba to pomyłka.
    explain: "Ошибка набора номера — pomyłka, а не błąd: błąd — ошибка в тексте или в расчёте. «Наверное» в таком предположении — chyba."
  - type: translate
    q: Я (м.) позвонил ей по ошибке.
    answer:
      - Zadzwoniłem do niej przez pomyłkę.
      - Przez pomyłkę zadzwoniłem do niej.
    explain: "Русское «позвонить кому» — по-польски zadzwonić do kogo, с родительным: do niej. «По ошибке» — przez pomyłkę."
