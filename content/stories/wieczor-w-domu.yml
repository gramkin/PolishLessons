questions:
  - type: choice
    q: "Почему Марек не может читать?"
    options: ["Аня очень громко поёт", "Папа включил музыку", "Собака лает", "Мама просит его помочь"]
    answer: 0
    explain: "«Ania śpiewa bardzo głośno» — «Аня поёт очень громко». głośno — «громко», а cicho — «тихо»."
  - type: choice
    q: "Что делает папа в начале истории?"
    options: ["Читает книгу", "Пишет письмо", "Танцует", "Спит"]
    answer: 0
    explain: "«Tata czyta książkę» — папа читает книгу, а письмо пишет мама: «mama pisze list». czytać — третье спряжение: czytam, czytasz, czyta."
  - type: choice
    q: "Что у Марека завтра?"
    options: ["Математика", "Урок польского", "Концерт", "День рождения"]
    answer: 0
    explain: "«Marek ma jutro matematykę» — дословно «Марек имеет завтра математику». Польский и здесь говорит через mieć, где русский говорит «у него»."
  - type: choice
    q: "Что придумала мама?"
    options: ["Петь всем вместе", "Отправить Аню спать", "Помочь Мареку с математикой", "Вывести собаку на улицу"]
    answer: 0
    explain: "«Śpiewamy razem?» — «Поём вместе?». razem — «вместе»; форма śpiewamy — «он» śpiewa + -my."
  - type: choice
    q: "«Mama i Ania ___, a tata tańczy.» Какая форма стоит в тексте?"
    options: ["śpiewają", "śpiewa", "śpiewamy"]
    answer: 0
    explain: "Мама и Аня — это «они», а у глаголов на -am / -asz «они» оканчивается на -ają: śpiewają, czytają. śpiewa — «он, она», śpiewamy — «мы»."
  - type: choice
    q: "Чем заканчивается история?"
    options: ["Марек тоже начинает петь", "Марек уходит читать в другую комнату", "Аня перестаёт петь", "Папа сердится"]
    answer: 0
    explain: "«Teraz on też śpiewa» — «Теперь он тоже поёт», а математика «może czekać» — «может подождать»."
  - type: listen
    text: "Pies też nie może spać."
    explain: "może — «может», от móc: mogę, możesz, może. В «я» и «они» основа на g (mogę, mogą), в остальных формах — на ż."
  - type: translate
    q: "Я не могу читать!"
    answer: ["Nie mogę czytać!", "Ja nie mogę czytać!"]
    explain: "móc + инфинитив, как в русском: nie mogę czytać. Местоимение ja обычно опускают: форма mogę и так говорит, кто «я»."
  - type: translate
    q: "Ты умеешь петь тихо?"
    answer: ["Umiesz śpiewać cicho?", "Umiesz cicho śpiewać?", "Czy umiesz śpiewać cicho?", "Czy umiesz cicho śpiewać?", "Ty umiesz śpiewać cicho?"]
    explain: "Навык — umieć: umiem, umiesz, umie. Вопрос можно начать с czy, а можно задать одной интонацией, как в русском."
