# review
title: Wieczór w domu
titleRu: Вечер дома
level: A1
chapter: 5
description: "Марек хочет читать, а Аня громко поёт — история о семейном вечере на глаголах всех четырёх спряжений в настоящем времени."
sentences:
  - pl: "Jest wieczór."
