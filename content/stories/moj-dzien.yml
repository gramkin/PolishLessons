# review
title: Mój dzień
titleRu: Мой день
level: B2
chapter: 31
description: "Дневник педантичного бухгалтера пана Игнация: вторник с точностью до минуты, от восхода до заката. Время по часам словами (o szóstej trzydzieści dwie), многократные глаголы (jadam, bywam, bywają), вид в паре «процесс — результат» (sprawdzałem — sprawdziłem, zastanowię się — zastanawiałem się) и nie zdążyłem. Опоздавший трамвай и прогулка по парку ломают расписание — и оказываются лучшим, что случилось за долгое время."
sentences:
  - pl: "Wtorek, dwudziesty pierwszy października."
    ru: "Вторник, двадцать первое октября."
    words: { Wtorek: wtorek, października: pazdziernik }
  - pl: "Drogi pamiętniku, dziś znów zapiszę wszystko po kolei i co do minuty, bo inaczej nie umiem."
    ru: "Дорогой дневник, сегодня я снова запишу всё по порядку и с точностью до минуты, потому что иначе не умею."
    words: { pamiętniku: pamietnik, zapiszę: zapisac, minuty: minuta, umiem: umiec }
  - pl: "Budzik dzwoni u mnie zawsze o szóstej trzydzieści, ale dziś obudziłem się cztery minuty wcześniej."
    ru: "Будильник у меня всегда звонит в шесть тридцать, но сегодня я проснулся на четыре минуты раньше."
    words: { Budzik: budzik, dzwoni: dzwonic, zawsze: zawsze, obudziłem się: obudzic, wcześniej: wczesnie }
  - pl: "Leżałem więc i patrzyłem na wskazówki, aż wreszcie zadzwonił."
    ru: "Так что я лежал и смотрел на стрелки, пока он наконец не зазвонил."
    words: { wskazówki: wskazowka, zadzwonił: zadzwonic }
  - pl: "O szóstej trzydzieści dwie wstałem, a o szóstej trzydzieści pięć stałem już pod prysznicem."
    ru: "В шесть тридцать две я встал, а в шесть тридцать пять уже стоял под душем."
    words: { wstałem: wstac, prysznicem: prysznic }
  - pl: "Przez pierwsze dwadzieścia sekund woda była lodowata, jak co rano, bo piecyk gazowy w naszej kamienicy rozgrzewa się wolniej niż ja."
    ru: "Первые двадцать секунд вода была ледяной, как каждое утро: газовая колонка в нашем доме разогревается медленнее, чем я."
    words: { woda: woda, lodowata: lodowaty, rano: rano, piecyk gazowy: piecyk-gazowy, kamienicy: kamienica }
  - pl: "O szóstej pięćdziesiąt usiadłem do śniadania: dwa jajka na miękko, gotowane dokładnie cztery minuty, kromka chleba i herbata."
    ru: "В шесть пятьдесят я сел завтракать: два яйца всмятку, варённые ровно четыре минуты, ломтик хлеба и чай."
    words: { śniadania: sniadanie, jajka na miękko: jajko-na-miekko, dokładnie: dokladnie, chleba: chleb, herbata: herbata }
  - pl: "Śniadanie jadam zawsze przy oknie, bo stamtąd widać wschód słońca."
    ru: "Завтракаю я всегда у окна, потому что оттуда виден восход солнца."
    words: { Śniadanie: sniadanie, oknie: okno, wschód słońca: wschod-slonca }
  - pl: "Według kalendarza słońce miało wzejść o siódmej dwanaście i wzeszło punktualnie, w przeciwieństwie do wielu ludzi."
    ru: "По календарю солнце должно было взойти в семь двенадцать и взошло точно вовремя — в отличие от многих людей."
    words: { Według: wedlug, słońce: slonce, punktualnie: punktualnie, ludzi: ludzie }
  - pl: "O siódmej dwadzieścia pięć wyszedłem z domu z teczką i parasolem, choć nie zapowiadano deszczu."
    ru: "В семь двадцать пять я вышел из дома с портфелем и зонтом, хотя дождя не обещали."
    words: { wyszedłem: wyjsc, domu: dom, teczką: teczka, parasolem: parasol, deszczu: deszcz }
  - pl: "Parasol noszę zawsze, bo prognozy bywają omylne."
    ru: "Зонт я ношу всегда, потому что прогнозы порой ошибаются."
    words: { Parasol: parasol, noszę: nosic, prognozy: prognoza, bywają: bywac, omylne: omylny }
  - pl: "Na przystanku byłem o siódmej trzydzieści jeden, czyli z dwuminutowym zapasem."
    ru: "На остановке я был в семь тридцать одну, то есть с запасом в две минуты."
    words: { przystanku: przystanek }
  - pl: "Tramwaj numer siedemnaście powinien był przyjechać o siódmej trzydzieści trzy, ale przyjechał dopiero o siódmej czterdzieści."
    ru: "Трамвай номер семнадцать должен был прийти в семь тридцать три, а пришёл только в семь сорок."
    words: { Tramwaj: tramwaj, numer: numer, przyjechać: przyjechac, przyjechał: przyjechac }
  - pl: "Siedem minut spóźnienia!"
    ru: "Семь минут опоздания!"
    words: { minut: minuta, spóźnienia: spoznienie }
  - pl: "Zapisałem to w notesie, który zawsze noszę przy sobie."
    ru: "Я записал это в блокнот, который всегда ношу с собой."
    words: { Zapisałem: zapisac, notesie: notes, noszę: nosic }
  - pl: "Stojąca obok pani uśmiechnęła się i powiedziała, że przecież nic się nie stało."
    ru: "Женщина, стоявшая рядом, улыбнулась и сказала, что ничего ведь не случилось."
    words: { obok: obok, pani: pani, przecież: przeciez }
  - pl: "Nie zdążyłem jej wytłumaczyć, że siedem minut dziennie to w skali roku prawie trzydzieści godzin, bo tramwaj ruszył i zrobił się tłok."
    ru: "Я не успел ей объяснить, что семь минут в день — это почти тридцать часов в год, потому что трамвай тронулся и началась давка."
    words: { zdążyłem: zdazyc, wytłumaczyć: wytlumaczyc, godzin: godzina, tramwaj: tramwaj, tłok: tlok }
  - pl: "Do biura dotarłem o ósmej zero cztery, pierwszy raz od trzech lat po ósmej."
    ru: "До конторы я добрался в восемь ноль четыре — впервые за три года позже восьми."
    words: { biura: biuro, pierwszy: pierwszy }
  - pl: "Portier, pan Stefan, spojrzał na zegarek, potem na mnie i zapytał: „Panie Ignacy, dobrze się pan czuje?”"
    ru: "Вахтёр, пан Стефан, посмотрел на часы, потом на меня и спросил: «Пан Игнаций, вы хорошо себя чувствуете?»"
    words: { Portier: portier, spojrzał: spojrzec, zapytał: zapytac }
  - pl: "Odpowiedziałem, że ja czuję się dobrze, gorzej z tramwajem."
    ru: "Я ответил, что сам я чувствую себя хорошо, а вот с трамваем дела хуже."
    words: { Odpowiedziałem: odpowiedziec, dobrze: dobrze }
  - pl: "Od ósmej piętnaście do jedenastej sprawdzałem faktury i sprawdziłem ich czterdzieści dwie."
    ru: "С восьми пятнадцати до одиннадцати я проверял счета и проверил сорок два."
    words: { faktury: faktura, sprawdziłem: sprawdzic }
  - pl: "Szef poprosił, żebym przejrzał jeszcze raport kwartalny, ale przed obiadem nie zdążyłem go nawet otworzyć."
    ru: "Начальник попросил меня просмотреть ещё квартальный отчёт, но до обеда я не успел его даже открыть."
    words: { Szef: szef, poprosił: poprosic, raport: raport, kwartalny: kwartalny, obiadem: obiad, zdążyłem: zdazyc, otworzyć: otworzyc }
  - pl: "Obiad jadam o dwunastej trzydzieści, ani minuty wcześniej, ani minuty później."
    ru: "Обедаю я в двенадцать тридцать, ни минутой раньше, ни минутой позже."
    words: { Obiad: obiad, minuty: minuta, wcześniej: wczesnie, później: pozno }
  - pl: "Dziś w stołówce była pomidorowa i kotlet mielony, czyli wtorkowy zestaw, na którym zawsze można polegać."
    ru: "Сегодня в столовой был томатный суп и котлета — вторничный комплекс, на который всегда можно положиться."
    words: { stołówce: stolowka, pomidorowa: pomidorowa, kotlet mielony: kotlet-mielony, polegać: polegac }
  - pl: "Pani Ewa z działu kadr przysiadła się do mnie i spytała, czy nie nudzi mnie takie życie."
    ru: "Пани Ева из отдела кадров подсела ко мне и спросила, не скучно ли мне так жить."
    words: { działu kadr: dzial-kadr, życie: zycie }
  - pl: "Odpowiedziałem, że nuda to cena spokoju, a spokój cenię ponad wszystko."
    ru: "Я ответил, что скука — цена покоя, а покой я ценю превыше всего."
    words: { cena: cena }
  - pl: "Roześmiała się i powiedziała, że w piątek cały dział idzie na kręgle i że mam iść z nimi."
    ru: "Она рассмеялась и сказала, что в пятницу весь отдел идёт в боулинг и что я должен пойти с ними."
    words: { piątek: piatek, dział: dzial, kręgle: kregle }
  - pl: "Nie odmówiłem od razu, co samo w sobie jest dla mnie wydarzeniem."
    ru: "Я не отказался сразу, что само по себе для меня событие."
    words: { odmówiłem: odmowic, wydarzeniem: wydarzenie }
  - pl: "Powiedziałem, że się zastanowię, i rzeczywiście zastanawiałem się przez całe popołudnie."
    ru: "Я сказал, что подумаю, и действительно думал об этом весь день."
    words: { zastanowię: zastanowic }
  - pl: "W przerwach przejrzałem wreszcie raport i znalazłem w nim trzy błędy w obliczeniach."
    ru: "В перерывах я наконец просмотрел отчёт и нашёл в нём три ошибки в расчётах."
    words: { raport: raport, znalazłem: znalezc, błędy: blad, obliczeniach: obliczenie }
  - pl: "Szef podziękował mi i stwierdził, że bez mnie dział by się rozsypał."
    ru: "Начальник поблагодарил меня и сказал, что без меня отдел бы развалился."
    words: { Szef: szef, dział: dzial, rozsypał: rozsypac }
  - pl: "Z pracy wyszedłem o szesnastej, jak zwykle, ale tym razem nie poszedłem prosto na przystanek."
    ru: "С работы я ушёл в шестнадцать, как обычно, но в этот раз пошёл не прямо на остановку."
    words: { pracy: praca, zwykle: zwykle, przystanek: przystanek }
  - pl: "Nie wiem, co mnie podkusiło, ale skręciłem w stronę parku, choć to nadkłada czternaście minut drogi."
    ru: "Не знаю, что меня дёрнуло, но я свернул к парку, хотя это лишних четырнадцать минут пути."
    words: { podkusiło: podkusic, skręciłem: skrecic, parku: park, nadkłada: nadkladac, drogi: droga }
  - pl: "W parku bywam rzadko, najwyżej raz w miesiącu, w niedzielę po południu."
    ru: "В парке я бываю редко, самое большее раз в месяц, в воскресенье после обеда."
    words: { parku: park, bywam: bywac, rzadko: rzadko, niedzielę: niedziela }
  - pl: "Liście na kasztanowcach były już złote i rdzawe, a pod butami szeleściło."
    ru: "Листья на каштанах были уже золотыми и рыжими, а под ногами шуршало."
    words: { kasztanowcach: kasztanowiec, rdzawe: rdzawy, szeleściło: szelescic }
  - pl: "Usiadłem na ławce przy stawie i, sam nie wiem kiedy, przestałem zerkać na zegarek."
    ru: "Я сел на скамейку у пруда и сам не заметил, как перестал поглядывать на часы."
    words: { stawie: staw, zerkać: zerkac }
  - pl: "Obok mnie starszy pan karmił kaczki i opowiadał o wnuku, który studiuje w Gdańsku."
    ru: "Рядом со мной пожилой мужчина кормил уток и рассказывал о внуке, который учится в Гданьске."
    words: { kaczki: kaczka, wnuku: wnuk, studiuje: studiowac }
  - pl: "Okazało się, że on też przez czterdzieści lat pracował w księgowości i też liczył każdą minutę."
    ru: "Оказалось, что он тоже сорок лет проработал в бухгалтерии и тоже считал каждую минуту."
    words: { księgowości: ksiegowosc, liczył: liczyc }
  - pl: "Powiedział, że dopiero na emeryturze zrozumiał, że minut nie trzeba liczyć, wystarczy je mieć."
    ru: "Он сказал, что только на пенсии понял: минуты не нужно считать, достаточно их иметь."
    words: { emeryturze: emerytura, zrozumiał: zrozumiec, trzeba: trzeba, liczyć: liczyc }
  - pl: "Słuchałem go i ani razu mu nie przerwałem, choć zwykle przerywam ludziom, którzy mówią nie na temat."
    ru: "Я слушал его и ни разу не перебил, хотя обычно перебиваю тех, кто говорит не по делу."
    words: { Słuchałem: sluchac, zwykle: zwykle, temat: temat }
  - pl: "Słońce schodziło coraz niżej, a woda w stawie zrobiła się różowa."
    ru: "Солнце опускалось всё ниже, а вода в пруду стала розовой."
    words: { Słońce: slonce, schodziło: schodzic, stawie: staw, różowa: rozowy }
  - pl: "Według kalendarza zachód słońca miał nastąpić o siedemnastej cztery."
    ru: "По календарю закат должен был наступить в семнадцать ноль четыре."
    words: { zachód słońca: zachod-slonca }
  - pl: "Chciałem to sprawdzić, ale kiedy wreszcie spojrzałem na zegarek, słońca już nie było."
    ru: "Я хотел это проверить, но, когда наконец взглянул на часы, солнца уже не было."
    words: { sprawdzić: sprawdzic, spojrzałem: spojrzec, słońca: slonce }
  - pl: "Pierwszy raz w życiu nie wiem, o której dokładnie zaszło słońce."
    ru: "Впервые в жизни я не знаю, во сколько точно село солнце."
    words: { życiu: zycie, dokładnie: dokladnie, słońce: slonce }
  - pl: "Do domu wróciłem o siedemnastej czterdzieści, a może czterdzieści trzy, nie jestem pewien."
    ru: "Домой я вернулся в семнадцать сорок, а может, в сорок три — не уверен."
    words: { domu: dom, wróciłem: wrocic }
  - pl: "Zjadłem kolację, pozmywałem i usiadłem do tego zeszytu."
    ru: "Я поужинал, помыл посуду и сел за эту тетрадь."
    words: { kolację: kolacja, pozmywałem: pozmywac, zeszytu: zeszyt }
  - pl: "Jest dwudziesta pierwsza dziesięć, a ja kładę się spać zawsze o dwudziestej drugiej, więc czas kończyć."
    ru: "Сейчас двадцать один десять, а спать я ложусь всегда в двадцать два, так что пора заканчивать."
    words: { spać: spac, czas: czas, kończyć: konczyc }
  - pl: "Ale zanim skończę, muszę coś przyznać."
    ru: "Но прежде чем закончить, я должен кое в чём признаться."
    words: { skończę: skonczyc, przyznać: przyznac }
  - pl: "Dzień, w którym spóźnił się tramwaj, a ja przegapiłem zachód słońca, był najlepszym dniem od bardzo dawna."
    ru: "День, когда опоздал трамвай, а я пропустил закат, был лучшим днём за очень долгое время."
    words: { Dzień: dzien, tramwaj: tramwaj, przegapiłem: przegapic, zachód słońca: zachod-slonca }
  - pl: "Jutro powiem pani Ewie, że w piątek pójdę z nimi na kręgle."
    ru: "Завтра скажу пани Еве, что в пятницу пойду с ними в боулинг."
    words: { Jutro: jutro, piątek: piatek, kręgle: kregle }
  - pl: "A siedem minut spóźnienia tramwaju wykreślę z notesu, niech mu będzie."
    ru: "А семь минут опоздания трамвая вычеркну из блокнота — так уж и быть."
    words: { spóźnienia: spoznienie, wykreślę: wykreslic, notesu: notes, niech mu będzie: niech-mu-bedzie }
  - pl: "Dobranoc, pamiętniku."
    ru: "Спокойной ночи, дневник."
    words: { Dobranoc: dobranoc, pamiętniku: pamietnik }
  - pl: "Dwudziesta pierwsza dwanaście."
    ru: "Двадцать один двенадцать."
  - pl: "PS W środę słońce zachodzi o siedemnastej dwie."
    ru: "P.S. В среду солнце заходит в семнадцать ноль две."
    words: { środę: sroda, słońce: slonce }
  - pl: "Wyjdę z biura punktualnie o szesnastej i tym razem będę patrzył na słońce, a nie na zegarek."
    ru: "Уйду из конторы ровно в шестнадцать и в этот раз буду смотреть на солнце, а не на часы."
    words: { biura: biuro, punktualnie: punktualnie, słońce: slonce }
questions:
  - type: choice
    q: Почему пан Игнаций лежал в постели, хотя уже проснулся?
    options:
      - Ему не хотелось вставать
      - Он ждал, когда зазвонит будильник
      - У него болела голова
      - Вода в душе была ледяной
    answer: 1
    explain: "«Budzik dzwoni u mnie zawsze o szóstej trzydzieści, ale dziś obudziłem się cztery minuty wcześniej. Leżałem więc i patrzyłem na wskazówki, aż wreszcie zadzwonił.» Leżałem, patrzyłem — несовершенный вид: длительное ожидание; zadzwonił — совершенный: результат."
  - type: choice
    q: Почему он всегда носит с собой зонт?
    options:
      - Каждый день идёт дождь
      - Прогнозы иногда ошибаются
      - Это подарок жены
      - В тот день обещали дождь
    answer: 1
    explain: "«Parasol noszę zawsze, bo prognozy bywają omylne.» Bywać — многократный глагол: «бывать, случаться время от времени». А дождя в тот день как раз не обещали: nie zapowiadano deszczu."
  - type: choice
    q: Что пан Игнаций не успел объяснить соседке в трамвае?
    options:
      - Что он опаздывает на работу
      - Что трамвай номер семнадцать идёт не туда
      - Что семь минут в день за год складываются почти в тридцать часов
      - Что он бухгалтер
    answer: 2
    explain: "«Nie zdążyłem jej wytłumaczyć, że siedem minut dziennie to w skali roku prawie trzydzieści godzin.» Nie zdążyć + совершенный инфинитив — «не успеть сделать»."
  - type: choice
    q: Что значат слова «sprawdzałem faktury i sprawdziłem ich czterdzieści dwie»?
    options:
      - Он начал проверять счета, но бросил
      - Он проверял счета, и результат — сорок два проверенных
      - Он проверил сорок два счёта дважды
      - Он попросил коллег проверить счета
    answer: 1
    explain: "Sprawdzałem — несовершенный вид: процесс «с восьми пятнадцати до одиннадцати». Sprawdziłem — совершенный: результат, который можно сосчитать. Числительное czterdzieści dwie требует родительного падежа: ich, faktur."
  - type: choice
    q: Что понял пожилой мужчина в парке, выйдя на пенсию?
    options:
      - Что надо было больше работать
      - Что минуты не нужно считать — достаточно их иметь
      - Что бухгалтерия — скучная работа
      - Что внуку лучше учиться в Варшаве
    answer: 1
    explain: "«Dopiero na emeryturze zrozumiał, że minut nie trzeba liczyć, wystarczy je mieć.» После отрицания (nie trzeba liczyć) прямое дополнение ставится в родительный: minut, а не minuty."
  - type: choice
    q: Что впервые в жизни случилось с паном Игнацием?
    options:
      - Он опоздал на работу
      - Он не знает, во сколько точно село солнце
      - Он отказался от обеда
      - Он пошёл в боулинг
    answer: 1
    explain: "«Pierwszy raz w życiu nie wiem, o której dokładnie zaszło słońce.» Он смотрел на пруд, а не на часы. А в боулинг он только собирается — в пятницу."
  - type: listen
    text: Parasol noszę zawsze, bo prognozy bywają omylne.
    explain: "Noszę — «ношу» (постоянно, по привычке); bywają — «бывают» (иногда). Omylny — «способный ошибаться», от mylić się."
