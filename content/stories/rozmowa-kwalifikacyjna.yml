# review
title: Rozmowa kwalifikacyjna
titleRu: Собеседование
level: B2
chapter: 27
description: "Программист, десять лет проработавший в Берлине, Лиссабоне, Торонто и Сингапуре, проходит собеседование, на котором его расспрашивают о каждой детали биографии; деловая лексика: CV, przełożony, złożyć wypowiedzenie, z dokumentów wynika, rozmowa kwalifikacyjna."
sentences:
  - pl: Andrzej Wiśniewski przyszedł do biura dziesięć minut przed czasem, ubrany w jedyną porządną marynarkę, jaką miał.
    ru: Анджей Вишневский пришёл в офис на десять минут раньше назначенного времени, одетый в единственный приличный пиджак, который у него был.
    words: { przyszedł: przyjsc, biura: biuro, dziesięć: dziesiec, marynarkę: marynarka }
  - pl: Firma szukała programisty z doświadczeniem międzynarodowym, a doświadczenia Andrzejowi nie brakowało.
    ru: Фирма искала программиста с международным опытом, а опыта Анджею было не занимать.
    words: { Firma: firma, szukała: szukac, programisty: programista, doświadczeniem: doswiadczenie }
  - pl: W sali konferencyjnej czekały na niego dwie osoby – kierowniczka działu kadr, pani Ewa Zielińska, i szef zespołu technicznego, Tomasz Wrona.
    ru: В переговорной его ждали два человека — начальница отдела кадров пани Эва Зелиньская и руководитель технической команды Томаш Врона.
    words: { czekały: czekac, pani: pani, szef: szef, zespołu: zespol }
  - pl: – Proszę usiąść. Przeczytaliśmy pańskie CV bardzo uważnie – zaczęła pani Zielińska, otwierając gruby segregator.
    ru: — Садитесь, пожалуйста. Мы очень внимательно прочитали ваше резюме, — начала пани Зелиньская, открывая толстую папку.
    words: { Proszę: prosze, usiąść: usiasc, Przeczytaliśmy: przeczytac, zaczęła: zaczac, pani: pani }
  - pl: – Na tyle uważnie, że mamy do pana sporo pytań – dodał Wrona z uśmiechem.
    ru: — Настолько внимательно, что у нас к вам немало вопросов, — с улыбкой добавил Врона.
    words: { pana: pan, pytań: pytanie, dodał: dodac }
  - pl: – Zacznijmy od początku. Urodził się pan w Gdańsku, studiował we Wrocławiu, a pierwszą pracę dostał pan w Berlinie. Dlaczego akurat tam?
    ru: — Начнём с начала. Вы родились в Гданьске, учились во Вроцлаве, а первую работу получили в Берлине. Почему именно там?
    words: { Urodził: urodzic, studiował: studiowac, pracę: praca, Dlaczego: dlaczego }
  - pl: – Mój promotor współpracował z berlińską firmą, która otwierała biuro w Polsce i szukała programisty mówiącego po polsku.
    ru: — Мой научный руководитель сотрудничал с берлинской фирмой, которая открывала офис в Польше и искала программиста, говорящего по-польски.
    words: { firmą: firma, biuro: biuro, Polsce: polska, szukała: szukac, programisty: programista, mówiącego: mowic }
  - pl: – Ile lat pan tam pracował?
    ru: — Сколько лет вы там проработали?
    words: { Ile: ile, pracował: pracowac }
  - pl: – Prawie trzy lata. Potem firmę kupiła większa spółka i połowę zespołu zwolniono.
    ru: — Почти три года. Потом фирму купила более крупная компания, и половину команды уволили.
    words: { firmę: firma, kupiła: kupic, zespołu: zespol, zwolniono: zwolnic }
  - pl: – Pana też? – zapytał Wrona.
    ru: — Вас тоже? — спросил Врона.
    words: { Pana: pan, zapytał: zapytac }
  - pl: – Nie, sam złożyłem wypowiedzenie. Nowy właściciel chciał, żebyśmy pisali wszystko od nowa, a ja nie widziałem w tym sensu.
    ru: — Нет, я сам подал заявление об уходе. Новый владелец хотел, чтобы мы писали всё заново, а я не видел в этом смысла.
    words: { wypowiedzenie: wypowiedzenie, właściciel: wlasciciel, chciał: chciec, wszystko: wszystko, widziałem: widziec }
  - pl: Pani Zielińska coś zanotowała i przewróciła kartkę.
    ru: Пани Зелиньская что-то записала и перевернула страницу.
    words: { Pani: pani, kartkę: kartka }
  - pl: – Następnie Lizbona. W CV ma pan tylko pół roku. Dlaczego tak krótko?
    ru: — Далее Лиссабон. В резюме у вас всего полгода. Почему так недолго?
    words: { pan: pan, roku: rok, Dlaczego: dlaczego, krótko: krotko }
  - pl: – To był kontrakt na jeden projekt, system rezerwacji dla sieci hoteli. Skończyliśmy go przed terminem.
    ru: — Это был контракт на один проект, систему бронирования для сети отелей. Мы закончили его раньше срока.
    words: { Skończyliśmy: skonczyc }
  - pl: – A mówi pan po portugalsku?
    ru: — А вы говорите по-португальски?
    words: { mówi: mowic, pan: pan }
  - pl: – Na tyle, żeby zamówić kawę i pokłócić się z właścicielem mieszkania.
    ru: — Настолько, чтобы заказать кофе и поругаться с хозяином квартиры.
    words: { zamówić: zamowic, kawę: kawa, właścicielem: wlasciciel, mieszkania: mieszkanie }
  - pl: Wrona się roześmiał, ale pani Zielińska nawet nie podniosła wzroku.
    ru: Врона рассмеялся, но пани Зелиньская даже не подняла глаз.
    words: { pani: pani }
  - pl: – Z dokumentów wynika, że między Lizboną a Toronto była czteromiesięczna przerwa. Co pan wtedy robił?
    ru: — Из документов следует, что между Лиссабоном и Торонто был четырёхмесячный перерыв. Что вы тогда делали?
    words: { wynika: wynikac, przerwa: przerwa, pan: pan }
  - pl: Andrzej spodziewał się tego pytania.
    ru: Анджей ожидал этого вопроса.
    words: { pytania: pytanie }
  - pl: – Ojciec zachorował, więc wróciłem do Gdańska, żeby się nim opiekować. Kiedy jego stan się poprawił, przyjąłem ofertę z Kanady.
    ru: — Отец заболел, поэтому я вернулся в Гданьск, чтобы за ним ухаживать. Когда его состояние улучшилось, я принял предложение из Канады.
    words: { Ojciec: ojciec, zachorował: zachorowac, wróciłem: wrocic, opiekować: opiekowac }
  - pl: – Mam nadzieję, że pański ojciec czuje się już lepiej.
    ru: — Надеюсь, вашему отцу уже лучше.
    words: { ojciec: ojciec, czuje: czuc }
  - pl: – Dziękuję, tak. Już nawet jeździ na rowerze.
    ru: — Спасибо, да. Он уже даже ездит на велосипеде.
    words: { jeździ: jezdzic, rowerze: rower }
  - pl: – W Toronto spędził pan cztery lata w firmie obsługującej płatności internetowe. Kto był pana bezpośrednim przełożonym?
    ru: — В Торонто вы провели четыре года в компании, которая обслуживает интернет-платежи. Кто был вашим непосредственным начальником?
    words: { pan: pan, cztery: cztery, firmie: firma, pana: pan, przełożonym: przelozony }
  - pl: – Michał Zieliński. Wymagający szef, ale wiele się od niego nauczyłem.
    ru: — Михал Зелиньский. Требовательный начальник, но я многому у него научился.
    words: { szef: szef }
  - pl: Pani Zielińska znowu coś zanotowała.
    ru: Пани Зелиньская снова что-то записала.
    words: { Pani: pani }
  - pl: – Jaki był najpoważniejszy błąd, który popełnił pan w tamtej pracy? – zapytał Wrona.
    ru: — Какую самую серьёзную ошибку вы совершили на той работе? — спросил Врона.
    words: { błąd: blad, popełnił: popelnic, pan: pan, pracy: praca, zapytał: zapytac }
  - pl: Andrzej zawahał się, ale tylko przez chwilę.
    ru: Анджей замялся, но лишь на мгновение.
  - pl: – Pewnego piątku wgrałem poprawkę na serwer, nie sprawdziwszy jej wcześniej. Przez dwie godziny klienci nie mogli płacić za zakupy.
    ru: — Однажды в пятницу я выложил исправление на сервер, не проверив его заранее. Два часа клиенты не могли оплатить покупки.
    words: { piątku: piatek, poprawkę: poprawka, godziny: godzina, klienci: klient, mogli: moc, płacić: placic, zakupy: zakupy }
  - pl: – I co pan zrobił?
    ru: — И что вы сделали?
    words: { pan: pan }
  - pl: – Od razu zadzwoniłem do szefa, przyznałem się do błędu i do rana naprawiałem system. Od tamtej pory nie wdrażam niczego w piątki.
    ru: — Сразу позвонил начальнику, признался в ошибке и до утра чинил систему. С тех пор я ничего не выкладываю по пятницам.
    words: { zadzwoniłem: zadzwonic, szefa: szef, przyznałem: przyznac, błędu: blad, rana: rano }
  - pl: – Potem przez dwa lata kierował pan zespołem w Singapurze. Ile osób liczył ten zespół?
    ru: — Потом вы два года руководили командой в Сингапуре. Сколько человек было в этой команде?
    words: { dwa: dwa, pan: pan, zespołem: zespol, Ile: ile, zespół: zespol }
  - pl: – Siedem osób z sześciu krajów. Jedynym wspólnym językiem był angielski, a jedyną rzeczą, co do której wszyscy się zgadzali, było to, że kawa w biurze jest okropna.
    ru: — Семь человек из шести стран. Единственным общим языком был английский, а единственным, в чём все сходились, было то, что кофе в офисе ужасный.
    words: { Siedem: siedem, sześciu: szesc, językiem: jezyk, kawa: kawa, biurze: biuro }
  - pl: – Dlaczego zrezygnował pan z tak dobrze płatnej pracy i chce pan wrócić do Polski?
    ru: — Почему вы отказались от такой хорошо оплачиваемой работы и хотите вернуться в Польшу?
    words: { Dlaczego: dlaczego, pan: pan, dobrze: dobrze, pracy: praca, chce: chciec, wrócić: wrocic, Polski: polska }
  - pl: – Przez dziesięć lat mieszkałem w czterech krajach i wszędzie byłem trochę obcy. Chciałbym w końcu żyć tam, gdzie nikt mnie nie pyta, skąd jestem.
    ru: — Десять лет я жил в четырёх странах и везде был немного чужим. Мне бы хотелось наконец жить там, где никто не спрашивает, откуда я.
    words: { dziesięć: dziesiec, mieszkałem: mieszkac, obcy: obcy, Chciałbym: chciec, żyć: zyc, pyta: pytac, skąd: skad }
  - pl: Pani Zielińska zamknęła segregator i po raz pierwszy się uśmiechnęła.
    ru: Пани Зелиньская закрыла папку и впервые улыбнулась.
    words: { Pani: pani, zamknęła: zamknac }
  - pl: – Czy teraz ja mogę o coś zapytać? – odezwał się Andrzej. – Dlaczego pytali mnie państwo o tyle szczegółów? Na żadnej rozmowie kwalifikacyjnej nie opowiadałem o chorobie ojca.
    ru: — Можно теперь я кое-что спрошу? — подал голос Анджей. — Почему вы расспрашивали меня о стольких подробностях? Ни на одном собеседовании я не рассказывал о болезни отца.
    words: { mogę: moc, zapytać: zapytac, Dlaczego: dlaczego, pytali: pytac, szczegółów: szczegol, rozmowie: rozmowa, ojca: ojciec }
  - pl: – Chcieliśmy sprawdzić, czy powie pan prawdę – odpowiedziała. – Odpowiedzi znaliśmy wcześniej.
    ru: — Мы хотели проверить, скажете ли вы правду, — ответила она. — Ответы мы знали заранее.
    words: { Chcieliśmy: chciec, pan: pan, odpowiedziała: odpowiedziec, znaliśmy: znac }
  - pl: – Skąd? – zdziwił się Andrzej.
    ru: — Откуда? — удивился Анджей.
    words: { Skąd: skad }
  - pl: – Michał Zieliński to mój starszy brat. Zadzwonił do mnie, kiedy się dowiedział, że wysłał pan do nas CV.
    ru: — Михал Зелиньский — мой старший брат. Он позвонил мне, когда узнал, что вы отправили нам резюме.
    words: { starszy: starszy, brat: brat, Zadzwonił: zadzwonic, pan: pan }
  - pl: Andrzej poczuł, że się czerwieni.
    ru: Анджей почувствовал, что краснеет.
  - pl: – Opowiedział mi też o tamtym piątku – dodała. – Podobno był to jedyny raz, kiedy pracownik sam przyszedł do niego z własnym błędem, zanim ktokolwiek go zauważył.
    ru: — Он рассказал мне и о той пятнице, — добавила она. — По его словам, это был единственный раз, когда сотрудник сам пришёл к нему со своей ошибкой, прежде чем её кто-нибудь заметил.
    words: { piątku: piatek, dodała: dodac, Podobno: podobno, pracownik: pracownik, przyszedł: przyjsc, błędem: blad }
  - pl: – To kiedy może pan zacząć? – zapytał Wrona, wyciągając rękę.
    ru: — Так когда вы можете приступить? — спросил Врона, протягивая руку.
    words: { może: moc, pan: pan, zacząć: zaczac, zapytał: zapytac, rękę: reka }
questions:
  - type: choice
    q: Почему Анджей попал на первую работу в Берлин?
    options:
      - Берлинская фирма открывала офис в Польше и искала программиста, говорящего по-польски
      - Он учился в Берлине и остался там после университета
      - Его отец работал в этой фирме
      - Он хотел выучить немецкий
    answer: 0
    explain: "«…z berlińską firmą, która otwierała biuro w Polsce i szukała programisty mówiącego po polsku.» Mówiącego — причастие на -ący в родительном падеже, как programisty."
  - type: choice
    q: Почему Анджей ушёл из берлинской фирмы?
    options:
      - Его уволили вместе с половиной команды
      - Он сам подал заявление, потому что новый владелец хотел переписать всё заново
      - Он получил предложение из Лиссабона
      - Фирма закрылась
    answer: 1
    explain: "«Nie, sam złożyłem wypowiedzenie.» Złożyć wypowiedzenie — подать заявление об уходе. Уволили (zwolniono) других."
  - type: choice
    q: Что Анджей делал в четырёхмесячном перерыве между Лиссабоном и Торонто?
    options:
      - Путешествовал по Португалии
      - Искал работу в Польше
      - Ухаживал за заболевшим отцом в Гданьске
      - Учил английский
    answer: 2
    explain: "«Ojciec zachorował, więc wróciłem do Gdańska, żeby się nim opiekować.» Opiekować się требует творительного: nim."
  - type: choice
    q: Какую ошибку Анджей совершил в Торонто?
    options:
      - Опоздал на важную встречу
      - Удалил базу данных клиентов
      - Поругался с начальником
      - Выложил исправление на сервер, не проверив его, и клиенты два часа не могли платить
    answer: 3
    explain: "«…wgrałem poprawkę na serwer, nie sprawdziwszy jej wcześniej.» Nie sprawdziwszy — деепричастие на -wszy: «не проверив»."
  - type: choice
    q: Почему Анджей хочет вернуться в Польшу?
    options:
      - В Сингапуре ему мало платили
      - Он хочет жить там, где его не спрашивают, откуда он
      - Его команда в Сингапуре распалась
      - Ему не нравился кофе в офисе
    answer: 1
    explain: "«Chciałbym w końcu żyć tam, gdzie nikt mnie nie pyta, skąd jestem.» А о кофе он говорил в шутку, и работа была dobrze płatna — хорошо оплачиваемая."
  - type: choice
    q: Почему на собеседовании задавали такие подробные вопросы?
    options:
      - Фирма всегда так проверяет кандидатов из-за границы
      - Томаш Врона не поверил резюме
      - Пани Зелиньская уже знала ответы от своего брата, бывшего начальника Анджея, и проверяла, скажет ли он правду
      - В резюме было много ошибок
    answer: 2
    explain: "«Chcieliśmy sprawdzić, czy powie pan prawdę… Michał Zieliński to mój starszy brat.» Czy в косвенном вопросе — «ли»."
  - type: listen
    text: "Z dokumentów wynika, że między Lizboną a Toronto była przerwa."
    explain: "Z czegoś wynika, że… — «из чего-то следует, что…», типичный оборот официальной речи."
