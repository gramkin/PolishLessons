# review
title: Na pole czy na dwór?
titleRu: «На поле» или «на двор»?
level: B2
chapter: 34
description: "Ведущий воскресной радиопередачи и его гостья-лингвистка, быстро перешедшие на «ты», говорят о том, как по-разному говорят в Кракове, Варшаве, Познани и Силезии; частицы przecież, chyba, właśnie, aż, dopiero, no, вынос вперёд и энклитики."
sentences:
  - pl: – Dzień dobry, witam państwa w naszej niedzielnej audycji.
    ru: — Добрый день, приветствую вас в нашей воскресной передаче.
    words: { Dzień: dzien, audycji: audycja }
  - pl: Moim gościem jest dzisiaj językoznawczyni, pani doktor Joanna Wilk. Dzień dobry, pani doktor.
    ru: Моя гостья сегодня — лингвист, доктор Иоанна Вильк. Добрый день, пани доктор.
    words: { gościem: gosc, dzisiaj: dzisiaj, pani: pani, Dzień: dzien }
  - pl: – Dzień dobry. Ale może mówmy sobie po imieniu, bo przy „pani doktor” czuję się jak u dentysty.
    ru: — Добрый день. Но, может, будем звать друг друга по имени, а то от «пани доктор» я чувствую себя как у зубного врача.
    words: { Dzień: dzien, mówmy: mowic, imieniu: imie, czuję: czuc, dentysty: dentysta }
  - pl: – No to świetnie. Jestem Tomek.
    ru: — Ну и отлично. Я Томек.
    words: { No: "no" }
  - pl: – A ja Asia. To od czego zaczynamy?
    ru: — А я Ася. Так с чего начинаем?
    words: { zaczynamy: zaczynac }
  - pl: – Od pytania, które przysłała nam słuchaczka z Warszawy.
    ru: — С вопроса, который прислала нам слушательница из Варшавы.
    words: { pytania: pytanie }
  - pl: Przeprowadziła się do Krakowa i już pierwszego dnia sąsiadka powiedziała jej, że dzieci są „na polu”.
    ru: Она переехала в Краков, и уже в первый день соседка сказала ей, что дети «на поле».
    words: { Przeprowadziła: przeprowadzic, pierwszego: pierwszy, dnia: dzien, sąsiadka: sasiadka, powiedziała: powiedziec, dzieci: dzieci, polu: pole }
  - pl: Pomyślała, że chodzi o jakieś pole za miastem, a dzieci po prostu bawiły się na podwórku.
    ru: Она подумала, что речь идёт о каком-то поле за городом, а дети просто играли во дворе.
    words: { Pomyślała: pomyslec, pole: pole, miastem: miasto, dzieci: dzieci, podwórku: podworko }
  - pl: – No właśnie, to klasyczny przykład.
    ru: — Вот именно, это классический пример.
    words: { No: "no", właśnie: wlasnie, przykład: przyklad }
  - pl: W Krakowie i w ogóle w Małopolsce wychodzi się „na pole”, a w Warszawie i w większej części Polski – „na dwór”.
    ru: В Кракове и вообще в Малопольше выходят «на поле», а в Варшаве и в большей части Польши — «на двор».
    words: { w ogóle: w-ogole, wychodzi: wychodzic, pole: pole, Polski: polska, dwór: dwor }
  - pl: "I jedno, i drugie znaczy po prostu: wyjść z domu na zewnątrz."
    ru: "И то и другое значит просто: выйти из дома на улицу."
    words: { wyjść: wyjsc, domu: dom }
  - pl: – Czyli ktoś tu się myli?
    ru: — То есть кто-то здесь ошибается?
    words: { myli: mylic }
  - pl: – Ależ skąd! Przecież to nie są błędy, tylko różne zwyczaje.
    ru: — Да что ты! Это же не ошибки, а просто разные привычки.
    words: { Przecież: przeciez, błędy: blad }
  - pl: Ale przyznam ci, że krakowianie i warszawiacy potrafią się o to spierać godzinami.
    ru: Но признаюсь тебе, краковяне и варшавяне способны спорить об этом часами.
    words: { przyznam: przyznac, godzinami: godzina }
  - pl: – Myśmy się o to kiedyś w redakcji kłócili aż przez tydzień!
    ru: — А мы однажды в редакции спорили об этом целую неделю!
    words: { kiedyś: kiedys, redakcji: redakcja, aż: az, tydzień: tydzien }
  - pl: – I kto wygrał?
    ru: — И кто победил?
  - pl: – Nikt. Szef jest z Poznania, więc uznał, że wszyscy się mylimy.
    ru: — Никто. Шеф из Познани, так что он решил, что мы все ошибаемся.
    words: { Nikt: nikt, Szef: szef, uznał: uznac, mylimy: mylic }
  - pl: – Ach, Poznań! Tam z kolei na ziemniaki mówi się „pyry”.
    ru: — А, Познань! А там, в свою очередь, картошку называют «пыры».
    words: { ziemniaki: ziemniak, mówi: mowic }
  - pl: A kiedy ktoś chce zawołać kolegę, może powiedzieć „tej!”, mniej więcej tak, jak gdzie indziej mówi się „ej!”.
    ru: А когда кто-то хочет окликнуть приятеля, он может сказать «тей!» — примерно так, как в других местах говорят «эй!».
    words: { chce: chciec, kolegę: kolega, powiedzieć: powiedziec, mówi: mowic }
  - pl: – „Tej”? Chyba pierwszy raz to słyszę.
    ru: — «Тей»? Кажется, я слышу это впервые.
    words: { Chyba: chyba, pierwszy: pierwszy, słyszę: slyszec }
  - pl: – No to musisz częściej jeździć do Poznania.
    ru: — Ну, значит, тебе надо почаще ездить в Познань.
    words: { No: "no", jeździć: jezdzic }
  - pl: "– Pojadę, obiecuję. A teraz poważniej: słyszałem, że na Śląsku mówi się zupełnie inaczej."
    ru: "— Поеду, обещаю. А теперь серьёзнее: я слышал, что в Силезии говорят совсем по-другому."
    words: { Pojadę: pojechac, obiecuję: obiecac, słyszałem: slyszec, mówi: mowic }
  - pl: – Śląsk to rzeczywiście osobny temat.
    ru: — Силезия — это действительно отдельная тема.
    words: { temat: temat }
  - pl: Mowa śląska różni się od ogólnej polszczyzny nie tylko słowami, ale też wymową, a częściowo także gramatyką.
    ru: Силезская речь отличается от общепольского языка не только словами, но и произношением, а отчасти и грамматикой.
    words: { Mowa: mowa, tylko: tylko, słowami: slowo, też: tez, wymową: wymowa, także: takze }
  - pl: Jedni uważają ją za gwarę, inni za osobny język, i ten spór wciąż trwa.
    ru: Одни считают её говором, другие — отдельным языком, и этот спор всё ещё продолжается.
    words: { uważają: uwazac, gwarę: gwara, język: jezyk, spór: spor, wciąż: wciaz }
  - pl: Tego sporu ja tu na pewno nie rozstrzygnę.
    ru: Этот спор я здесь точно не разрешу.
    words: { sporu: spor }
  - pl: "Ale jedno wiem: kto pierwszy raz słyszy, jak Ślązacy rozmawiają między sobą, ten może niewiele zrozumieć."
    ru: "Но одно я знаю: кто впервые слышит, как силезцы разговаривают между собой, тот может мало что понять."
    words: { wiem: wiedziec, pierwszy: pierwszy, słyszy: slyszec, rozmawiają: rozmawiac, zrozumieć: zrozumiec }
  - pl: – Aż tak?
    ru: — Неужели настолько?
    words: { Aż: az }
  - pl: – Aż tak. Wiem, bo sama dopiero po kilku latach w Katowicach zaczęłam rozumieć prawie wszystko.
    ru: — Настолько. Я знаю, потому что сама только через несколько лет в Катовице начала понимать почти всё.
    words: { Aż: az, Wiem: wiedziec, dopiero: dopiero, kilku: kilka, zaczęłam: zaczac, rozumieć: rozumiec }
  - pl: – Mieszkałaś tam?
    ru: — Ты там жила?
    words: { Mieszkałaś: mieszkac }
  - pl: – Tak, aż osiem lat. Pracowałam na uniwersytecie.
    ru: — Да, целых восемь лет. Я работала в университете.
    words: { aż: az, osiem: osiem, Pracowałam: pracowac, uniwersytecie: uniwersytet }
  - pl: – A sama mówisz jakąś gwarą?
    ru: — А сама ты говоришь на каком-нибудь говоре?
    words: { mówisz: mowic, gwarą: gwara }
  - pl: – Ja chyba nie. Wychowałam się w Warszawie, więc mówię tak, jak mówiło się w domu i w szkole.
    ru: — Я, пожалуй, нет. Я выросла в Варшаве, так что говорю так, как говорили дома и в школе.
    words: { chyba: chyba, mówię: mowic, domu: dom, szkole: szkola }
  - pl: Ale babcia była góralką i jej mowy jako dziecko w ogóle nie rozumiałam.
    ru: Но бабушка была горянкой, и её речи я в детстве вообще не понимала.
    words: { babcia: babcia, mowy: mowa, dziecko: dziecko, w ogóle: w-ogole, rozumiałam: rozumiec }
  - pl: – Coś ty! Babcia z gór, a wnuczka z Warszawy?
    ru: — Да ты что! Бабушка с гор, а внучка из Варшавы?
    words: { Babcia: babcia, gór: gora, wnuczka: wnuczka }
  - pl: – No a co w tym dziwnego? Takich rodzin jest w Polsce mnóstwo.
    ru: — Ну а что в этом странного? Таких семей в Польше множество.
    words: { No: "no", dziwnego: dziwny, rodzin: rodzina, Polsce: polska }
  - pl: Ludzie się przeprowadzają, wyjeżdżają do pracy, biorą śluby, i mowa się miesza.
    ru: Люди переезжают, уезжают на работу, женятся, и речь смешивается.
    words: { Ludzie: ludzie, pracy: praca, mowa: mowa }
  - pl: – Czy to znaczy, że gwary znikają?
    ru: — Значит ли это, что говоры исчезают?
    words: { gwary: gwara }
  - pl: – Niektóre słabną, to prawda, ale przesadzać bym nie chciała.
    ru: — Некоторые слабеют, это правда, но преувеличивать я бы не хотела.
    words: { prawda: prawda, chciała: chciec }
  - pl: Młodzi ludzie w Krakowie dalej wychodzą „na pole”, a w Poznaniu dalej jedzą pyry.
    ru: Молодые люди в Кракове по-прежнему выходят «на поле», а в Познани по-прежнему едят «пыры».
    words: { Młodzi: mlody, ludzie: ludzie, wychodzą: wychodzic, pole: pole, jedzą: jesc }
  - pl: – A może są z tego nawet dumni?
    ru: — А может, они этим даже гордятся?
    words: { nawet: nawet, dumni: dumny }
  - pl: – Często tak. I dobrze, bo własnej mowy nikt nie powinien się wstydzić.
    ru: — Часто да. И хорошо, потому что своей речи никто не должен стыдиться.
    words: { Często: czesto, mowy: mowa, nikt: nikt, wstydzić: wstydzic }
  - pl: – Słuchaczka z Warszawy pyta jeszcze, czy w Krakowie powinna mówić „na pole”.
    ru: — Слушательница из Варшавы ещё спрашивает, стоит ли ей в Кракове говорить «на поле».
    words: { pyta: pytac, mówić: mowic, pole: pole }
  - pl: – Niech mówi tak, jak jej wygodnie.
    ru: — Пусть говорит так, как ей удобно.
    words: { mówi: mowic }
  - pl: Jeśli powie „na dwór”, krakowianie i tak ją zrozumieją, najwyżej się uśmiechną.
    ru: Если она скажет «на двор», краковяне её всё равно поймут, самое большее — улыбнутся.
    words: { dwór: dwor, zrozumieją: zrozumiec }
  - pl: "A gdyby mnie ktoś zapytał o radę, to powiedziałabym jej tak: najpierw posłuchaj sąsiadów."
    ru: "А если бы кто-нибудь спросил моего совета, я бы сказала ей так: сначала послушай соседей."
    words: { zapytał: zapytac, powiedziałabym: powiedziec, sąsiadów: sasiad }
  - pl: – No cóż, czas nam się kończy.
    ru: — Ну что ж, наше время подходит к концу.
    words: { No: "no", czas: czas, kończy: konczyc }
  - pl: – Już? Przecież dopiero zaczęliśmy!
    ru: — Уже? Мы же только начали!
    words: { Już: juz, Przecież: przeciez, dopiero: dopiero, zaczęliśmy: zaczac }
  - pl: – Właśnie dlatego zapraszam cię za tydzień. Porozmawiamy o gwarze góralskiej.
    ru: — Именно поэтому я приглашаю тебя через неделю. Поговорим о гуральском говоре.
    words: { Właśnie: wlasnie, tydzień: tydzien, gwarze: gwara }
  - pl: – Chętnie. Tylko nie każ mi mówić po góralsku, bo babcia by się za mnie wstydziła.
    ru: — С удовольствием. Только не заставляй меня говорить по-гуральски, а то бабушке было бы за меня стыдно.
    words: { Chętnie: chetnie, Tylko: tylko, każ: kazac, mówić: mowic, babcia: babcia, wstydziła: wstydzic }
  - pl: – Obiecuję. A państwa, drodzy słuchacze, zapraszam za tydzień o tej samej porze.
    ru: — Обещаю. А вас, дорогие слушатели, приглашаю через неделю в то же время.
    words: { Obiecuję: obiecac, słuchacze: sluchacz, tydzień: tydzien }
  - pl: Do usłyszenia!
    ru: До встречи в эфире!
    words: { Do usłyszenia: do-uslyszenia }
questions:
  - type: choice
    q: Что случилось со слушательницей из Варшавы в первый день в Кракове?
    options:
      - Соседка сказала, что дети «на поле», и она решила, что речь о поле за городом
      - Она заблудилась и вышла в поле за городом
      - Соседка не поняла её варшавского произношения
      - Дети соседки позвали её «тей!»
    answer: 0
    explain: "«Pomyślała, że chodzi o jakieś pole za miastem, a dzieci po prostu bawiły się na podwórku.» В Кракове «na polu» значит просто «на улице»."
  - type: choice
    q: Что Ася говорит о краковском «na pole» и варшавском «na dwór»?
    options:
      - Правильно только «na dwór», «na pole» — ошибка
      - Это не ошибки, а разные привычки, и значат они одно и то же
      - «Na pole» говорят только пожилые краковяне
      - «Na dwór» в Кракове никто не поймёт
    answer: 1
    explain: "«Ależ skąd! Przecież to nie są błędy, tylko różne zwyczaje.» Przecież — «ведь, же»: Ася ссылается на то, что должно быть очевидно."
  - type: choice
    q: Чем закончился спор в редакции Томека?
    options:
      - Победили краковяне
      - Победили варшавяне
      - "Никто не победил: шеф из Познани решил, что все ошибаются"
      - Спор разрешила Ася
    answer: 2
    explain: "«Nikt. Szef jest z Poznania, więc uznał, że wszyscy się mylimy.» А спорили они aż przez tydzień — целую неделю."
  - type: choice
    q: Что Ася говорит о силезской речи?
    options:
      - Это точно отдельный язык
      - Это обычный польский с несколькими особыми словами
      - Её одни считают говором, другие отдельным языком, и спор продолжается
      - Её больше никто не использует
    answer: 2
    explain: "«Jedni uważają ją za gwarę, inni za osobny język, i ten spór wciąż trwa.» Сама Ася этот спор разрешать не берётся: «Tego sporu ja tu na pewno nie rozstrzygnę.»"
  - type: choice
    q: Сколько времени Ася понадобилось в Катовице, чтобы понимать почти всё?
    options:
      - Несколько недель
      - Несколько лет
      - Целых восемь лет
      - Она понимала всё с самого начала
    answer: 1
    explain: "«…sama dopiero po kilku latach w Katowicach zaczęłam rozumieć prawie wszystko.» Dopiero — «только», позже, чем хотелось бы. Восемь лет (aż osiem lat) — это сколько она там прожила."
  - type: choice
    q: Какой совет Ася дала бы слушательнице?
    options:
      - Обязательно говорить «na pole», чтобы её приняли
      - Никогда не говорить «na pole»
      - Говорить, как ей удобно, а сначала послушать соседей
      - Записаться на курсы краковского говора
    answer: 2
    explain: "«Niech mówi tak, jak jej wygodnie… najpierw posłuchaj sąsiadów.» Powiedziałabym — «я бы сказала»: -bym остаётся на глаголе."
  - type: listen
    text: "Przecież to nie są błędy, tylko różne zwyczaje."
    explain: "Przecież — «ведь, же»; nie…, tylko… — «не…, а…»."
