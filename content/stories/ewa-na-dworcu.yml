questions:
  - type: choice
    q: Почему Марек должен встретить Эву?
    options:
      - Томек на работе и не может поехать на вокзал
      - Эва — сестра Марека
      - Томек заболел
      - Марек работает на вокзале
    answer: 0
    explain: "Томек говорит: «a ja muszę być w pracy». Эва — его сестра, не Марека."
  - type: choice
    q: Как, по словам Томека, Марек узнает Эву?
    options:
      - Она будет стоять у кассы
      - У неё белый чемодан и собака
      - Она высокая, у неё чёрный чемодан, и она читает книгу
      - Она позвонит Мареку
    answer: 2
    explain: "«Ewa jest wysoka i ma czarną walizkę. I zawsze czyta książkę, kiedy czeka.»"
  - type: choice
    q: Кто такая Ола?
    options:
      - Подруга Эвы
      - Высокая девушка с чёрным чемоданом, но не Эва
      - Сестра Томека
      - Девушка, которая стояла у окна
    answer: 1
    explain: "Марек увидел «wysoką dziewczynę, która miała czarną walizkę», но она ответила: «Nie, jestem Ola»."
  - type: choice
    q: Почему Томек сказал, что Эва высокая?
    options:
      - Она правда самая высокая в семье
      - Он перепутал её с Олой
      - Он пошутил
      - Он сам невысокий
    answer: 3
    explain: "Эва объясняет: «Tomek zawsze tak mówi, bo sam nie jest wysoki!» Bo вводит причину после главного предложения, как русское «потому что»."
  - type: choice
    q: "Какая форма стоит в тексте? «A ty jesteś Marek, o ___ Tomek mi mówił?»"
    options: [który, którym, którego]
    answer: 1
    explain: "Mówić o kim? — предложный падеж: o którym, как русское «о котором». Род — мужской, от слова Marek."
  - type: listen
    text: Marek czekał jeszcze pół godziny.
    explain: "pół godziny — после pół родительный падеж: godziny, как русское «полчаса»."
  - type: translate
    q: Ты (м.) не мог бы встретить её на вокзале?
    answer:
      - Czy mógłbyś ją spotkać na dworcu?
      - Mógłbyś ją spotkać na dworcu?
      - Czy mógłbyś spotkać ją na dworcu?
      - Czy mógłbyś odebrać ją z dworca?
    explain: "mógł + by + ś — вежливая просьба, русское «не» не переводится. Безударное ją стоит рано: mógłbyś ją spotkać."
  - type: translate
    q: Я (ж.) тебя видела, но не знала, что это ты.
    answer:
      - Widziałam cię, ale nie wiedziałam, że to ty.
      - Widziałam cię, ale nie wiedziałam, że to jesteś ty.
    explain: "Безударное cię стоит сразу после глагола. Перед ale и że — запятые, как в русском. «Знать, что» — wiedzieć, а не znać."
