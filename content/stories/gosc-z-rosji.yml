questions:
  - type: choice
    q: "Кто такой Игорь?"
    options: ["Друг Марека из России", "Брат Марека", "Учитель польского", "Продавец из магазина"]
    answer: 0
    explain: "«To Igor, przyjaciel z Rosji» — друг из России. После z «из» — родительный: Rosja → z Rosji."
  - type: choice
    q: "Чего нет у Марека дома?"
    options: ["Кофе, молока и хлеба", "Только хлеба", "Чая и кофе", "Всё есть"]
    answer: 0
    explain: "«W domu nie ma kawy» и «Nie ma też mleka ani chleba». После nie ma — родительный: kawa → kawy, mleko → mleka, chleb → chleba. А чай дома есть: «jest tylko herbata»."
  - type: choice
    q: "Что есть в магазине вместо кофе?"
    options: ["Только чай", "Сок", "Вода", "Только молоко"]
    answer: 0
    explain: "«Nie ma kawy. Jest tylko herbata» — кофе нет, есть только чай."
  - type: choice
    q: "Что Игорь привёз Мареку?"
    options: ["Кофе", "Чай", "Хлеб", "Книгу"]
    answer: 0
    explain: "«Mam coś dla ciebie… Proszę, to kawa!» — у Игоря был кофе с собой. dla «для» требует родительного: dla ciebie."
  - type: choice
    q: "Как Игорь пьёт кофе?"
    options: ["Без молока", "С молоком", "С сахаром", "Со льдом"]
    answer: 0
    explain: "«Igor pije kawę bez mleka». bez — «без» и, как в русском, с родительным: mleko → bez mleka."
  - type: choice
    q: "«Marek szuka ___.» Какая форма стоит в тексте?"
    options: ["kawy", "kawę", "kawa"]
    answer: 0
    explain: "szukać требует родительного: szukam kawy, szukam chleba. Русское «ищу кофе» звучит с винительным, поэтому тянет сказать kawę — это ошибка."
  - type: listen
    text: "Igor pije kawę bez mleka."
    explain: "kawę — винительный после pić (-a → -ę), mleka — родительный после bez."
  - type: translate
    q: "Дома нет кофе."
    answer: ["W domu nie ma kawy.", "Nie ma kawy w domu."]
    explain: "«Нет чего-то» — nie ma + родительный, как в русском: nie ma kawy. «Дома» — w domu."
  - type: translate
    q: "Мне не нужен кофе."
    answer: ["Nie potrzebuję kawy.", "Ja nie potrzebuję kawy."]
    explain: "Русское «мне не нужен» польский строит лично: «я не нуждаюсь» — nie potrzebuję. potrzebować требует родительного: kawy."
