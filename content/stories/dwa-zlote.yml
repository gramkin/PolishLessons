# review
title: Dwa złote
titleRu: Два злотых
level: A2
chapter: 13
description: "Ане не хватает двух злотых в магазине, и ей помогает незнакомый сосед. Цены, возраст и время: числа с существительными, złoty / złote / złotych, lata / lat, o której."
