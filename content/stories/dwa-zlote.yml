questions:
  - type: choice
    q: Сколько денег мама даёт Ане?
    options: ["двадцать злотых", "двадцать два злотых", "пятнадцать злотых"]
    answer: 0
    explain: "Mama daje Ani dwadzieścia złotych. После 20 — родительный множественного złotych, как «двадцать рублей». Двадцать два злотых стоят все покупки."
  - type: choice
    q: Сколько стоят шесть яблок?
    options: ["четырнадцать злотых", "пять злотых", "три злотых"]
    answer: 0
    explain: "Sześć jabłek kosztuje czternaście złotych. Пять злотых стоит хлеб, три — молоко. Глагол после «шесть яблок» в единственном числе: kosztuje."
  - type: choice
    q: Почему Аня не знает, что делать?
    options: ["У неё на два злотых меньше, чем нужно", "В магазине нет яблок", "Магазин уже закрыт"]
    answer: 0
    explain: "Всё вместе стоит dwadzieścia dwa złote, а у Ани только dwadzieścia złotych."
  - type: choice
    q: Кто помогает Ане?
    options: ["пан с белой бородой", "продавщица", "мама"]
    answer: 0
    explain: "Za Anią stoi pan z białą brodą — он и даёт ей dwa złote."
  - type: choice
    q: Когда Аня возвращает деньги?
    options: ["на следующий день в час", "в тот же вечер", "через неделю"]
    answer: 0
    explain: "Na drugi dzień o pierwszej — «на следующий день в час». O pierwszej — порядковое числительное женского рода, как во всех часах."
  - type: choice
    q: "Как пан говорит «Мне девяносто два года»?"
    options: ["Mam dziewięćdziesiąt dwa lata.", "Mam dziewięćdziesiąt dwa lat.", "Mnie dziewięćdziesiąt dwa lata."]
    answer: 0
    explain: "Возраст «имеют»: mam. Число кончается на 2 (но не на 12), поэтому lata, как «года»; lat — после 5–21 и чисел, кончающихся на 0, 1, 5–9. Дательного «мне» здесь нет."
  - type: listen
    text: Ania ma tylko dwadzieścia złotych.
    explain: "dwadzieścia — с -ścia на конце; złotych — родительный множественного после двадцати."
  - type: translate
    q: Хлеб стоит пять злотых.
    answer: ["Chleb kosztuje pięć złotych."]
    explain: "kosztować спрягается как kupować: kosztuje. После пяти — złotych, как «пять рублей»."
  - type: translate
    q: Мне пятнадцать лет.
    answer: ["Mam piętnaście lat.", "Ja mam piętnaście lat."]
    explain: "Возраст выражают глаголом mieć: mam. После 15 — lat, как «лет»."
