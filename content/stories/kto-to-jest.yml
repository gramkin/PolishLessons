questions:
  - type: choice
    q: "Где Марек видит девушку?"
    options: ["В школе", "В магазине", "Дома", "На улице"]
    answer: 0
    explain: "«Marek i Tomek są w szkole» — Марек и Томек в школе, там он и видит девушку."
  - type: choice
    q: "Что делает девушка?"
    options: ["Стоит и читает книгу", "Поёт", "Пишет письмо", "Говорит по телефону"]
    answer: 0
    explain: "«Dziewczyna stoi i czyta książkę» — стоит и читает книгу. И Марек вечером говорит о ней: «Ciągle czyta książkę» — «всё время читает книгу»."
  - type: choice
    q: "Почему Томек советует спросить Аню?"
    options: ["Аня всё знает", "Аня — сестра этой девушки", "Аня учится с девушкой в одном классе", "Сам Томек не говорит по-польски"]
    answer: 0
    explain: "«Ale Ania wie wszystko!» — «Но Аня знает всё!». Знание фактов — wiedzieć: wiem, wiesz, wie."
  - type: choice
    q: "Как зовут девушку?"
    options: ["Оля", "Аня", "Эва", "Марта"]
    answer: 0
    explain: "«To Ola» — «Это Оля». Аня — сестра Марека."
  - type: choice
    q: "Что хочет знать Оля?"
    options: ["Как зовут Марека", "Где живёт Марек", "Умеет ли Марек петь", "Сколько Мареку лет"]
    answer: 0
    explain: "«Ola też chce wiedzieć, jak masz na imię!» — Оля тоже хочет знать, как его зовут. Jak masz na imię? — дословно «как ты имеешь на имя?»."
  - type: choice
    q: "«Wiesz, kto to jest?» — «Znasz Olę?». Почему во втором вопросе znać?"
    options: ["После znać идёт человек, а после wiedzieć — факт или вопрос", "znać — вежливая форма wiedzieć", "znać употребляют только в вопросах"]
    answer: 0
    explain: "Русское «знать» делится надвое: wiedzieć — факт (Wiesz, kto to jest? Nie wiem), znać — человек или вещь, которые мы знаем (Znasz Olę?). Проверка: «ведаешь Олю?» не скажешь — значит, znać."
  - type: listen
    text: "Marek nie wie, co robić."
    explain: "wie — «знает», от wiedzieć: wiem, wiesz, wie. Здесь речь о факте, поэтому не zna."
  - type: translate
    q: "Ты знаешь Олю?"
    answer: ["Znasz Olę?", "Czy znasz Olę?", "Ty znasz Olę?", "Czy ty znasz Olę?"]
    explain: "Знать человека — znać, и человек стоит в винительном: Ola → Olę, как książka → książkę."
  - type: translate
    q: "Я хочу знать, как её зовут."
    answer: ["Chcę wiedzieć, jak ona ma na imię.", "Chcę wiedzieć, jak ma na imię.", "Ja chcę wiedzieć, jak ona ma na imię.", "Ja chcę wiedzieć, jak ma na imię."]
    explain: "После chcieć — инфинитив: chcę wiedzieć. Знать факт — wiedzieć, а имя спрашивают через mieć: jak ona ma na imię."
