title: W sklepie
titleRu: В магазине
level: A1
chapter: 3
description: "Покупаем хлеб и кофе. Помните: sklep — это магазин, а не склеп."
sentences:
  - pl: Dzień dobry!
    ru: Здравствуйте!
    words: { Dzień dobry: dzien-dobry }
  - pl: Dzień dobry! W czym mogę pomóc?
    ru: Здравствуйте! Чем могу помочь?
    words: { Dzień dobry: dzien-dobry }
  - pl: Poproszę chleb i mleko.
    ru: Дайте, пожалуйста, хлеб и молоко.
    words: { chleb: chleb, mleko: mleko }
  - pl: Czy ma pan też kawę?
    ru: А кофе у вас есть?
    words: { ma: miec, pan: pan, kawę: kawa }
  - pl: Tak, mamy kawę i herbatę.
    ru: Да, у нас есть кофе и чай.
    words: { Tak: tak, mamy: miec, kawę: kawa, herbatę: herbata }
  - pl: To poproszę jedną kawę. Ile płacę?
    ru: Тогда один кофе, пожалуйста. Сколько с меня?
    words: { kawę: kawa }
  - pl: Dwanaście złotych.
    ru: Двенадцать злотых.
  - pl: Proszę bardzo.
    ru: Пожалуйста.
    words: { Proszę: prosze, bardzo: bardzo }
  - pl: Dziękuję! Do widzenia!
    ru: Спасибо! До свидания!
    words: { Dziękuję: dziekuje, Do widzenia: do-widzenia }
  - pl: Do widzenia!
    ru: До свидания!
    words: { Do widzenia: do-widzenia }
questions:
  - type: choice
    q: Что покупатель просит сначала?
    options: ["Хлеб и молоко.", "Кофе и чай.", "Хлеб и чай."]
    answer: 0
    explain: "«Poproszę chleb i mleko.» Poproszę — вежливое «я попрошу», так в магазине и говорят."
  - type: choice
    q: Что ещё есть в магазине?
    options: ["Кофе и чай.", "Только молоко.", "Ничего больше нет."]
    answer: 0
    explain: "«Tak, mamy kawę i herbatę.» herbata — чай, а kawa — кофе, в польском она женского рода: kawę."
  - type: choice
    q: Сколько стоит покупка?
    options: ["Двенадцать злотых.", "Два злотых.", "Двадцать злотых."]
    answer: 0
    explain: "dwanaście — «двенадцать»: -naście соответствует русскому «-надцать». Двадцать — dwadzieścia."
  - type: choice
    q: Как продавец предлагает помощь?
    options: ["W czym mogę pomóc?", "Ile płacę?", "Proszę bardzo."]
    answer: 0
    explain: "W czym mogę pomóc? — «Чем могу помочь?», дословно «в чём могу помочь». Ile płacę? спрашивает покупатель."
  - type: choice
    q: Что значит sklep?
    options: [магазин, склеп, склад]
    answer: 0
    explain: "sklep — магазин, ложный друг. Склеп по-польски grobowiec."
  - type: listen
    text: Poproszę chleb i mleko.
    explain: "ę в конце слова почти не слышно: poproszę — «попро́шэ». ch звучит как русское «х»."
  - type: translate
    q: Хлеб и молоко, пожалуйста.
    answer: ["Poproszę chleb i mleko.", "Proszę chleb i mleko.", "Chleb i mleko, proszę."]
    explain: "В магазине вежливо говорят poproszę и называют, что нужно: poproszę chleb."
  - type: translate
    q: Сколько с меня?
    answer: ["Ile płacę?"]
    explain: "Поляк спрашивает «сколько я плачу?»: Ile płacę? Русского «с меня» здесь нет."
