    words: { Jak: jak, dobrze: dobrze, już: juz, jesteś: byc }
  - pl: "– Co ty niesiesz w tej walizce?"
    ru: "— Что ты несёшь в этом чемодане?"
    words: { Co: co, ty: ty, niesiesz: niesc, tej: ten, walizce: walizka }
  - pl: "– Książki dla ciebie, babciu! Wiem, że lubisz czytać."
    ru: "— Книги для тебя, бабушка! Я знаю, что ты любишь читать."
    words: { Książki: ksiazka, ciebie: ty, babciu: babcia, Wiem: wiedziec, lubisz: lubic, czytać: czytac }
  - pl: "– Dziesięć książek! Niosłeś je trzy kilometry?"
    ru: "— Десять книг! Ты нёс их три километра?"
    words: { Dziesięć: dziesiec, książek: ksiazka, Niosłeś: niesc, je: one, trzy: trzy, kilometry: kilometr }
  - pl: "– Nie, tylko dwa. Potem jechałem samochodem z mlekiem."
    ru: "— Нет, только два. Потом я ехал на машине с молоком."
    words: { dwa: dwa, Potem: potem, jechałem: jechac, samochodem: samochod, mlekiem: mleko }
  - pl: Babcia zaczęła się śmiać.
    ru: Бабушка засмеялась.
    words: { Babcia: babcia, zaczęła: zaczac, śmiać: smiac }
  - pl: "– A ja często chodzę do miasta pieszo – i bez walizki!"
    ru: "— А я часто хожу в город пешком — и без чемодана!"
    words: { ja: ja, często: czesto, chodzę: chodzic, miasta: miasto, pieszo: pieszo, walizki: walizka }
  - pl: Wieczorem babcia czytała pierwszą książkę, a Marek już spał.
    ru: Вечером бабушка читала первую книгу, а Марек уже спал.
    words: { Wieczorem: wieczor, babcia: babcia, czytała: czytac, pierwszą: pierwszy, książkę: ksiazka, już: juz, spał: spac }
questions:
  - type: choice
    q: Как Марек добирается до вокзала?
    options: ["пешком", "на автобусе", "на машине"]
    answer: 0
    explain: "Na dworzec szedł pieszo — szedł от iść: пешком, в одну сторону, как «шёл»."
  - type: choice
    q: Почему от городка Марек идёт пешком?
    options: ["В бабушкину деревню не ходит автобус", "Он любит гулять", "Поезд не доехал до деревни из-за моста"]
    answer: 0
    explain: "Do babci nie jeździ autobus. Регулярные рейсы — jeździć, а не jechać; и автобус по-польски не «идёт», а ездит."
  - type: choice
    q: Кто такой пан Ковальский?
    options: ["бабушкин сосед", "дедушка Марека", "водитель автобуса"]
    answer: 0
    explain: "To był pan Kowalski, sąsiad babci. Kierowca — «водитель»: он ехал на своей машине."
  - type: choice
    q: Что везёт пан Ковальский?
    options: ["молоко в магазин", "книги для бабушки", "хлеб в магазин"]
    answer: 0
    explain: "Wiozę mleko do sklepu. wieźć — везти на транспорте; книги в чемодане нёс сам Марек (nieść)."
  - type: choice
    q: Что лежит в чемодане?
    options: ["десять книг для бабушки", "молоко", "одежда Марека"]
    answer: 0
    explain: "Książki dla ciebie, babciu! — и бабушка считает: Dziesięć książek!"
  - type: choice
    q: "Как сказать «Марек вошёл в поезд»?"
    options: ["Marek wszedł do pociągu.", "Marek wszedł w pociąg.", "Marek weszedł do pociągu."]
    answer: 0
    explain: "wejść требует do + родительный, а не w, как в русском «в поезд». В wszedł гласная e уже есть внутри szedł, вторая не нужна."
  - type: listen
    text: Do babci nie jeździ autobus.
    explain: "babci — родительный после do; jeździ пишется с ź, как «ездит»."
  - type: translate
    q: Я еду к бабушке в деревню.
    answer: ["Jadę do babci na wieś.", "Jadę na wieś do babci.", "Ja jadę do babci na wieś."]
    explain: "Одна поездка сейчас — jechać: jadę. «К бабушке» — do babci, «в деревню» — na wieś."
  - type: translate
    q: Что ты несёшь?
    answer: ["Co niesiesz?", "Co ty niesiesz?"]
    explain: "nieść — нести в руках, идя пешком. В «ты» гласная e: niesiesz; o только в niosę и niosą."
