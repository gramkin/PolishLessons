# review
title: Walizka dla babci
titleRu: Чемодан для бабушки
level: A2
chapter: 14
description: "Марек везёт бабушке в деревню тяжёлый чемодан: пешком, поездом и на чужой машине. Глаголы движения в прошедшем времени: szedł, jechał, wszedł, przyjechał, niósł, wiózł."
sentences:
  - pl: Rano Marek wyszedł z domu z ciężką walizką.
    ru: Утром Марек вышел из дома с тяжёлым чемоданом.
    words: { Rano: rano, wyszedł: wyjsc, domu: dom, ciężką: ciezki, walizką: walizka }
  - pl: Jechał do babci na wieś.
    ru: Он ехал к бабушке в деревню.
    words: { Jechał: jechac, babci: babcia, wieś: wies }
  - pl: Na dworzec szedł pieszo, bo to tylko dziesięć minut.
    ru: На вокзал он шёл пешком, потому что это всего десять минут.
    words: { dworzec: dworzec, szedł: isc, pieszo: pieszo, dziesięć: dziesiec, minut: minuta }
  - pl: Walizka była bardzo ciężka.
    ru: Чемодан был очень тяжёлый.
    words: { Walizka: walizka, była: byc, bardzo: bardzo, ciężka: ciezki }
  - pl: Na dworcu czekał już pociąg.
    ru: На вокзале уже ждал поезд.
    words: { dworcu: dworzec, czekał: czekac, już: juz, pociąg: pociag }
  - pl: Marek wszedł do pociągu i przez dwie godziny czytał książkę.
    ru: Марек вошёл в поезд и два часа читал книгу.
    words: { wszedł: wejsc, pociągu: pociag, dwie: dwa, godziny: godzina, czytał: czytac, książkę: ksiazka }
  - pl: Pociąg jechał przez pola i małe wsie.
    ru: Поезд ехал через поля и маленькие деревни.
    words: { Pociąg: pociag, jechał: jechac, pola: pole, małe: maly, wsie: wies }
  - pl: Marek przyjechał do małego miasta.
    ru: Марек приехал в маленький город.
    words: { przyjechał: przyjechac, małego: maly, miasta: miasto }
  - pl: Do babci nie jeździ autobus.
    ru: До бабушки автобус не ходит.
    words: { babci: babcia, jeździ: jezdzic, autobus: autobus }
  - pl: Marek musiał iść pieszo trzy kilometry.
    ru: Мареку пришлось идти пешком три километра.
    words: { musiał: musiec, iść: isc, pieszo: pieszo, trzy: trzy, kilometry: kilometr }
  - pl: Szedł drogą przez pole, potem przez most nad rzeką.
    ru: Он шёл по дороге через поле, потом через мост над рекой.
    words: { Szedł: isc, drogą: droga, pole: pole, potem: potem, most: most, rzeką: rzeka }
  - pl: Za nim jechał samochód.
    ru: За ним ехала машина.
    words: { nim: on, jechał: jechac, samochód: samochod }
  - pl: "Kierowca znał Marka: to był pan Kowalski, sąsiad babci."
    ru: "Водитель знал Марека: это был пан Ковальский, бабушкин сосед."
    words: { Kierowca: kierowca, znał: znac, był: byc, pan: pan, sąsiad: sasiad, babci: babcia }
  - pl: "– Dzień dobry! Dokąd idziesz z tą walizką?"
    ru: "— Добрый день! Куда ты идёшь с этим чемоданом?"
    words: { Dzień dobry: dzien-dobry, Dokąd: dokad, idziesz: isc, tą: ten, walizką: walizka }
  - pl: "– Do babci!"
    ru: "— К бабушке!"
    words: { babci: babcia }
  - pl: "– Ja też jadę do wsi. Wiozę mleko do sklepu. Jedziemy razem!"
    ru: "— Я тоже еду в деревню. Везу молоко в магазин. Поехали вместе!"
    words: { Ja: ja, jadę: jechac, wsi: wies, Wiozę: wiezc, mleko: mleko, sklepu: sklep, Jedziemy: jechac, razem: razem }
  - pl: Do babci Marek przyjechał samochodem, razem z mlekiem.
    ru: К бабушке Марек приехал на машине, вместе с молоком.
