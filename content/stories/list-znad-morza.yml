questions:
  - type: choice
    q: Кому пишет Марек?
    options: [Бабушке., Маме., Кубе.]
    answer: 0
    explain: "«Kochana babciu!» — обращение в звательном падеже: babcia → babciu, как в письме «Дорогая бабушка!»."
  - type: choice
    q: Что делали родители утром на пляже?
    options: ["Папа спал, а мама читала книгу.", "Папа и мама искали янтарь.", "Они пили кофе в ресторане."]
    answer: 0
    explain: "«Tata spał, a mama czytała książkę.» Кофе родители пили вечером в ресторане."
  - type: choice
    q: Кто нашёл янтарь?
    options: ["Куба, мальчик из Кракова.", "Марек.", "Папа Марека."]
    answer: 0
    explain: "«I nagle Kuba powiedział: – Mam bursztyn!» Марек искал весь день, но янтарь нашёл Куба и подарил его Мареку."
  - type: choice
    q: Для кого теперь янтарь?
    options: [Для бабушки., Для Кубы., Для мамы.]
    answer: 0
    explain: "«A bursztyn jest dla ciebie, babciu!» Марек дарит янтарь бабушке."
  - type: choice
    q: "«Mama i tata ___ kawę.»"
    options: [pili, piły, pił]
    answer: 0
    explain: "В группе есть мужчина (tata), поэтому -li: pili. piły — только женщины, дети или предметы; pił — один он."
  - type: listen
    text: Rano byliśmy na plaży.
    explain: "byliśmy — «мы были», в группе есть мужчина. na plaży — предложный падеж от plaża."
  - type: translate
    q: Я (м.) искал янтарь.
    answer: ["Szukałem bursztynu.", "Ja szukałem bursztynu."]
    explain: "Мужчина о себе — -łem. szukać требует родительного: bursztynu, хотя по-русски «искал янтарь» — винительный."
  - type: translate
    q: Вечером мы ели рыбу в ресторане.
    answer: ["Wieczorem jedliśmy rybę w restauracji.", "Wieczorem w restauracji jedliśmy rybę.", "Jedliśmy wieczorem rybę w restauracji."]
    explain: "jeść в прошедшем меняет основу: jadł, но jedliśmy (a → e перед l). В ресторане — w restauracji, предложный падеж."
