questions:
  - type: choice
    q: Где Аня нашла собаку?
    options:
      - У дома пана Новака
      - Под мостом в парке
      - На вокзале
      - У себя в комнате
    answer: 1
    explain: "«Pod mostem zobaczyła małego psa» — по дороге с работы через парк, под мостом."
  - type: choice
    q: Почему Аня взяла собаку домой, хотя у неё маленькая комната?
    options:
      - Пан Новак попросил её об этом
      - Она давно хотела собаку
      - Была ночь, и она не хотела оставлять пса одного в парке
      - Собака была голодная
    answer: 2
    explain: "«Chociaż miała tylko mały pokój, nie chciała, żeby pies został sam w parku. Była już noc, więc wzięła go do domu.» Chociaż — «хотя», więc — «поэтому»."
  - type: choice
    q: Что Аня и пан Новак делали утром в парке?
    options:
      - Спрашивали людей, знают ли они этого пса
      - Гуляли с котом Филипом
      - Искали мальчика Кубу
      - Покупали собаке еду
    answer: 0
    explain: "«pytali ludzi, czy znają tego psa» — czy вводит косвенный вопрос, как русское «ли»."
  - type: choice
    q: Как Бурек потерялся?
    options:
      - Он убежал от Ани
      - Мальчик оставил его в парке
      - Он уехал с паном Новаком
      - Он побежал за котом и не вернулся
    answer: 3
    explain: "Куба говорит: «Wczoraj Burek pobiegł za kotem i nie wrócił.» Pobiec za kim — побежать за кем-то, za + творительный: za kotem."
  - type: choice
    q: Что Куба предлагает Ане в конце?
    options:
      - Взять Бурека себе
      - Приходить к ним и гулять с Буреком в парке
      - Купить ей собаку
      - Познакомить её со своей мамой
    answer: 1
    explain: "«Jeśli pani chce, może pani do nas przychodzić i chodzić z Burkiem do parku.» Jeśli — реальное условие, с обычным временем."
  - type: choice
    q: "Какая форма стоит в тексте? «Ale ludzie, z ___ rozmawiali, nie znali psa.»"
    options: [którymi, którzy, których]
    answer: 0
    explain: "Падеж который берёт из своего предложения: rozmawiać z kim? — творительный, во множественном z którymi. Którzy — именительный, których — родительный."
  - type: listen
    text: Pan Nowak, który mieszka obok, otworzył okno.
    explain: "Придаточное с który выделяется запятыми с двух сторон, как в русском: «Пан Новак, который живёт рядом, открыл окно»."
  - type: translate
    q: Мне кажется, что хозяин его ищет.
    answer:
      - Wydaje mi się, że jego pan go szuka.
      - Wydaje mi się, że jego właściciel go szuka.
      - Wydaje mi się, że właściciel go szuka.
    explain: "mi и się стоят рано, сразу после первого слова: Wydaje mi się. Перед że — запятая, как перед русским «что»."
  - type: translate
    q: Когда пёс увидел мальчика, он побежал к нему.
    answer:
      - Kiedy pies zobaczył chłopca, pobiegł do niego.
      - Gdy pies zobaczył chłopca, pobiegł do niego.
    explain: "После kiedy — прошедшее совершенного вида: zobaczył, pobiegł. Местоимение после предлога — в n-форме: do niego."
