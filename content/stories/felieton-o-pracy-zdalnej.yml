# review
title: Biuro w kapciach
titleRu: Офис в тапочках
level: B2
chapter: 33
description: "Фельетон об удалённой работе: автор отстаивает свой тезис, честно разбирает доводы противников и подводит итог, связывая мысли через natomiast, zaś, mimo że, jednak, skoro, o ile, w rezultacie, z jednej strony… z drugiej strony и podsumowując."
sentences:
  - pl: Od trzech lat pracuję w domu i co jakiś czas ktoś mnie pyta, czy nie tęsknię za biurem.
    ru: Уже три года я работаю дома, и время от времени кто-нибудь спрашивает меня, не скучаю ли я по офису.
    words: { pracuję: pracowac, domu: dom, czas: czas, pyta: pytac, tęsknię: tesknic, biurem: biuro }
  - pl: "Odpowiadam uczciwie: tęsknię, ale tylko za ekspresem do kawy."
    ru: "Я честно отвечаю: скучаю, но только по кофемашине."
    words: { Odpowiadam: odpowiadac, tęsknię: tesknic, kawy: kawa }
  - pl: Za resztą biura, z całym szacunkiem dla kolegów, wcale nie tęsknię.
    ru: По остальному офису, при всём уважении к коллегам, я совсем не скучаю.
    words: { resztą: reszta, biura: biuro, szacunkiem: szacunek, kolegów: kolega, tęsknię: tesknic }
  - pl: Moim zdaniem praca zdalna to jeden z najlepszych wynalazków naszych czasów, choć wymaga więcej dyscypliny, niż się wydaje.
    ru: По-моему, удалённая работа — одно из лучших изобретений нашего времени, хотя она требует больше дисциплины, чем кажется.
    words: { zdaniem: zdanie, praca: praca, zdalna: zdalny, czasów: czas, choć: choc, wymaga: wymagac, wydaje: wydawac }
  - pl: Wiem, że nie wszyscy się ze mną zgodzą, dlatego spróbuję tę tezę obronić.
    ru: Я знаю, что не все со мной согласятся, поэтому попробую этот тезис защитить.
    words: { zgodzą: zgodzic, dlatego: dlatego, tezę: teza }
  - pl: Po pierwsze, nie tracę już dwóch godzin dziennie w korkach.
    ru: Во-первых, я больше не теряю по два часа в день в пробках.
    words: { godzin: godzina, korkach: korek }
  - pl: Mój sąsiad natomiast codziennie jeździ do biura na drugim końcu miasta i wraca wieczorem tak zmęczony, że ledwo mówi „dobry wieczór”.
    ru: А мой сосед каждый день ездит в офис на другом конце города и возвращается вечером таким усталым, что еле выговаривает «добрый вечер».
    words: { sąsiad: sasiad, natomiast: natomiast, codziennie: codziennie, jeździ: jezdzic, biura: biuro, miasta: miasto, wraca: wracac, zmęczony: zmeczony, wieczór: wieczor }
  - pl: Ja zaś o tej porze jestem już po spacerze z psem i po kolacji.
    ru: Я же в это время уже погулял с собакой и поужинал.
    words: { zaś: zas, spacerze: spacer, psem: pies, kolacji: kolacja }
  - pl: Po drugie, w domu nikt mi nie przerywa.
    ru: Во-вторых, дома меня никто не прерывает.
    words: { domu: dom, przerywa: przerywac }
  - pl: W biurze co kwadrans ktoś zaglądał do mojego pokoju „tylko na chwilkę”, a każda taka chwilka kończyła się półgodzinną rozmową o niczym.
    ru: В офисе каждые четверть часа кто-нибудь заглядывал ко мне в кабинет «всего на минутку», а каждая такая минутка заканчивалась получасовым разговором ни о чём.
    words: { biurze: biuro, kwadrans: kwadrans, pokoju: pokoj, rozmową: rozmowa }
  - pl: Teraz mogę skupić się na pracy od rana do południa i w rezultacie kończę zadania szybciej niż kiedyś.
    ru: Теперь я могу сосредоточиться на работе с утра до полудня и в результате заканчиваю задачи быстрее, чем раньше.
    words: { skupić: skupic, pracy: praca, rezultacie: rezultat, kończę: konczyc, zadania: zadanie }
  - pl: Mój szef, choć początkowo był nieufny, przyznał niedawno, że nigdy wcześniej nie oddawałem raportów tak punktualnie.
    ru: Мой начальник, хотя поначалу относился к этому с недоверием, недавно признал, что никогда раньше я не сдавал отчёты так пунктуально.
    words: { szef: szef, choć: choc, przyznał: przyznac }
  - pl: Po trzecie, sam decyduję, kiedy zrobić przerwę.
    ru: В-третьих, я сам решаю, когда сделать перерыв.
    words: { przerwę: przerwa }
  - pl: Skoro i tak siedzę przy komputerze osiem godzin, wolę to robić przy własnym oknie niż w sali bez okien.
    ru: Раз уж я всё равно сижу за компьютером восемь часов, я предпочитаю делать это у собственного окна, а не в зале без окон.
    words: { Skoro: skoro, komputerze: komputer, godzin: godzina, wolę: wolec, oknie: okno, okien: okno }
  - pl: Gdy boli mnie głowa, mogę się położyć na kwadrans, nie tłumacząc się nikomu.
    ru: Когда у меня болит голова, я могу прилечь на четверть часа, ни перед кем не оправдываясь.
    words: { boli: bolec, głowa: glowa, kwadrans: kwadrans }
  - pl: Oczywiście nie jestem naiwny.
    ru: Конечно, я не наивен.
    words: { Oczywiście: oczywiscie }
  - pl: Krytycy pracy zdalnej mają kilka mocnych argumentów i warto ich uczciwie wysłuchać.
    ru: У критиков удалённой работы есть несколько сильных доводов, и их стоит честно выслушать.
    words: { pracy: praca, zdalnej: zdalny, argumentów: argument, warto: warto, wysłuchać: wysluchac }
  - pl: Z jednej strony praca w domu daje wolność, z drugiej strony łatwo w niej zatrzeć granicę między obowiązkami a odpoczynkiem.
    ru: С одной стороны, работа дома даёт свободу, с другой стороны, в ней легко стереть границу между обязанностями и отдыхом.
    words: { strony: strona, praca: praca, domu: dom, wolność: wolnosc, granicę: granica, obowiązkami: obowiazek, odpoczynkiem: odpoczynek }
  - pl: Przyznaję, że nieraz odpisywałem na maile o jedenastej w nocy, w kapciach, z talerzem zupy na kolanach.
    ru: Признаюсь, что не раз отвечал на письма в одиннадцать ночи, в тапочках, с тарелкой супа на коленях.
    words: { nocy: noc, talerzem: talerz, zupy: zupa, kolanach: kolano }
  - pl: Nie da się też ukryć, że człowiek w domu bywa samotny.
    ru: Нельзя также не признать, что дома человеку бывает одиноко.
    words: { człowiek: czlowiek, domu: dom, samotny: samotny }
  - pl: Kolega z działu sprzedaży twierdzi, że od kiedy pracuje zdalnie, najdłuższe rozmowy prowadzi z kotem.
    ru: Коллега из отдела продаж утверждает, что с тех пор, как он работает удалённо, самые длинные разговоры он ведёт с котом.
    words: { Kolega: kolega, działu: dzial, twierdzi: twierdzic, pracuje: pracowac, rozmowy: rozmowa, kotem: kot }
  - pl: Kot podobno słucha uważnie, jednak rzadko odpowiada na temat.
    ru: Кот, по его словам, слушает внимательно, однако редко отвечает по существу.
    words: { Kot: kot, podobno: podobno, słucha: sluchac, jednak: jednak, rzadko: rzadko, odpowiada: odpowiadac, temat: temat }
  - pl: Najpoważniejszy zarzut dotyczy jednak młodych pracowników.
    ru: Самое серьёзное возражение касается, однако, молодых сотрудников.
    words: { zarzut: zarzut, dotyczy: dotyczyc, jednak: jednak, młodych: mlody, pracowników: pracownik }
  - pl: Mówi się, że bez codziennego kontaktu ze starszymi kolegami trudniej im się nauczyć zawodu.
    ru: Говорят, что без ежедневного общения со старшими коллегами им труднее научиться профессии.
    words: { starszymi: starszy, kolegami: kolega, zawodu: zawod }
  - pl: Mimo że sam zaczynałem w biurze i wiele zawdzięczam tamtym rozmowom przy kawie, nie uważam, że to argument przeciwko pracy zdalnej.
    ru: Несмотря на то что я сам начинал в офисе и многим обязан тем разговорам за кофе, я не считаю, что это довод против удалённой работы.
    words: { Mimo: mimo, zaczynałem: zaczynac, biurze: biuro, zawdzięczam: zawdzieczac, rozmowom: rozmowa, kawie: kawa, uważam: uwazac, argument: argument, pracy: praca, zdalnej: zdalny }
  - pl: To raczej argument przeciwko złej organizacji.
    ru: Это скорее довод против плохой организации.
    words: { argument: argument, organizacji: organizacja }
  - pl: Nauczyć się można także przez ekran, o ile ktoś znajdzie czas, żeby odpowiadać nowej osobie na pytania.
    ru: Научиться можно и через экран, если только кто-то найдёт время отвечать новому человеку на вопросы.
    words: { znajdzie: znalezc, czas: czas, odpowiadać: odpowiadac, pytania: pytanie }
  - pl: Problem polega na tym, że w biurze taki czas sam się znajdował, a w domu trzeba go zaplanować.
    ru: Проблема в том, что в офисе такое время находилось само, а дома его нужно запланировать.
    words: { biurze: biuro, czas: czas, domu: dom }
  - pl: Kierownicy natomiast często wolą widzieć pracowników przy biurkach, bo wtedy łatwiej ich kontrolować.
    ru: Руководители же часто предпочитают видеть сотрудников за столами, потому что тогда их легче контролировать.
    words: { Kierownicy: kierownik, natomiast: natomiast, wolą: wolec, pracowników: pracownik, biurkach: biurko }
  - pl: "Znam szefa, który co godzinę wysyła zespołowi wiadomość z jednym słowem: „Jesteście?”."
    ru: "Я знаю начальника, который каждый час отправляет команде сообщение из одного слова: «Вы на месте?»."
    words: { szefa: szef, godzinę: godzina, zespołowi: zespol, wiadomość: wiadomosc, słowem: slowo }
  - pl: "W rezultacie jego ludzie, zamiast pracować, przez cały dzień odpowiadają mu: „Jesteśmy”."
    ru: "В результате его люди вместо того, чтобы работать, весь день отвечают ему: «На месте»."
    words: { rezultacie: rezultat, ludzie: ludzie, pracować: pracowac, odpowiadają: odpowiadac }
  - pl: Tymczasem obecność przy komputerze nie mówi nic o wynikach.
    ru: А между тем присутствие за компьютером ничего не говорит о результатах.
    words: { Tymczasem: tymczasem, komputerze: komputer, wynikach: wynik }
  - pl: Skoro oceniamy pracę po efektach, a nie po godzinach spędzonych na krześle, miejsce jej wykonywania przestaje mieć znaczenie.
    ru: Раз мы оцениваем работу по результатам, а не по часам, проведённым на стуле, место, где её выполняют, перестаёт иметь значение.
    words: { Skoro: skoro, oceniamy: oceniac, pracę: praca, godzinach: godzina, krześle: krzeslo, miejsce: miejsce }
  - pl: "Jest jeszcze jeden argument, który słyszę najczęściej: w domu nie da się pracować, bo są dzieci."
    ru: "Есть ещё один довод, который я слышу чаще всего: дома работать невозможно, потому что там дети."
    words: { argument: argument, słyszę: slyszec, domu: dom, pracować: pracowac, dzieci: dziecko }
  - pl: Trudno z tym dyskutować, zwłaszcza w czasie wakacji.
    ru: С этим трудно спорить, особенно во время каникул.
    words: { czasie: czas }
  - pl: Sam pamiętam tydzień, w którym prowadziłem ważne spotkanie przez internet, a mój siostrzeniec za ścianą uczył się grać na trąbce.
    ru: Я сам помню неделю, когда я вёл важную встречу по интернету, а мой племянник за стеной учился играть на трубе.
    words: { spotkanie: spotkanie, internet: internet, ścianą: sciana, uczył: uczyc, grać: grac }
  - pl: Klient zapytał na koniec, czy mamy w firmie orkiestrę.
    ru: Клиент в конце спросил, нет ли у нас в фирме оркестра.
    words: { Klient: klient, zapytał: zapytac, firmie: firma }
  - pl: Nie twierdzę więc, że praca zdalna jest dla wszystkich.
    ru: Поэтому я не утверждаю, что удалённая работа подходит всем.
    words: { twierdzę: twierdzic, praca: praca, zdalna: zdalny }
  - pl: Jedni potrzebują biura, żeby oddzielić dom od pracy, drudzy zaś potrzebują domu, żeby w ogóle cokolwiek zrobić.
    ru: Одним нужен офис, чтобы отделить дом от работы, другим же нужен дом, чтобы вообще хоть что-нибудь сделать.
    words: { potrzebują: potrzebowac, biura: biuro, dom: dom, pracy: praca, zaś: zas, domu: dom }
  - pl: "Najrozsądniejszy wydaje mi się model mieszany: dwa dni w biurze, trzy w domu."
    ru: "Самой разумной мне кажется смешанная модель: два дня в офисе, три дома."
    words: { wydaje: wydawac, biurze: biuro, domu: dom }
  - pl: W biurze rozmawiamy, planujemy i kłócimy się o projekty, w domu zaś spokojnie robimy to, co ustaliliśmy.
    ru: В офисе мы разговариваем, планируем и спорим о проектах, дома же спокойно делаем то, о чём договорились.
    words: { biurze: biuro, planujemy: planowac, projekty: projekt, domu: dom, zaś: zas }
  - pl: Taki układ ma sens, o ile obie strony trzymają się zasad.
    ru: Такой порядок имеет смысл, если только обе стороны соблюдают правила.
    words: { strony: strona }
  - pl: Pracownik nie może znikać na pół dnia, szef zaś nie powinien dzwonić w niedzielę wieczorem.
    ru: Сотрудник не может пропадать на полдня, начальник же не должен звонить в воскресенье вечером.
    words: { Pracownik: pracownik, szef: szef, zaś: zas, dzwonić: dzwonic, niedzielę: niedziela }
  - pl: Mimo wszystko nie zamienię swojej kanapy na biurowe krzesło.
    ru: И всё же я не променяю свой диван на офисный стул.
    words: { Mimo: mimo, kanapy: kanapa, krzesło: krzeslo }
  - pl: "Podsumowując: praca zdalna nie jest ani rajem, ani karą, tylko narzędziem."
    ru: "Подводя итог: удалённая работа — не рай и не наказание, а инструмент."
    words: { Podsumowując: podsumowac, praca: praca, zdalna: zdalny, narzędziem: narzedzie }
  - pl: Jak każde narzędzie, w dobrych rękach przynosi korzyści, w złych zaś szkodzi.
    ru: Как любой инструмент, в хороших руках она приносит пользу, а в плохих вредит.
    words: { narzędzie: narzedzie, rękach: reka, zaś: zas }
  - pl: Jestem przekonany, że za kilka lat nikt nie będzie pytał, czy można pracować z domu, lecz jak to robić dobrze.
    ru: Я убеждён, что через несколько лет никто не будет спрашивать, можно ли работать из дома, — будут спрашивать, как делать это хорошо.
    words: { przekonany: przekonany, pytał: pytac, pracować: pracowac, domu: dom }
  - pl: A teraz przepraszam, ale muszę kończyć.
    ru: А теперь прошу прощения, но мне пора заканчивать.
    words: { przepraszam: przepraszac, kończyć: konczyc }
  - pl: Pies domaga się spaceru, a w odróżnieniu od mojego szefa mailem się nie zadowoli.
    ru: Собака требует прогулки, а в отличие от моего начальника письмом не удовлетворится.
    words: { Pies: pies, spaceru: spacer, szefa: szef }
questions:
  - type: choice
    q: По чему из офиса автор, по его словам, скучает?
    options:
      - По коллегам
      - По разговорам за кофе
      - Только по кофемашине
      - По дороге на работу
    answer: 2
    explain: "«Odpowiadam uczciwie: tęsknię, ale tylko za ekspresem do kawy.» Tęsknić za + творительный — «скучать по»."
  - type: choice
    q: Почему дома автор заканчивает задачи быстрее?
    options:
      - Дома его никто не прерывает, и он может сосредоточиться
      - Дома у него компьютер быстрее
      - Начальник дал ему меньше задач
      - Он работает дома и по ночам
    answer: 0
    explain: "«Po drugie, w domu nikt mi nie przerywa.» — «…mogę skupić się na pracy od rana do południa i w rezultacie kończę zadania szybciej niż kiedyś.»"
  - type: choice
    q: С кем, по его словам, ведёт самые длинные разговоры коллега из отдела продаж?
    options:
      - С клиентами
      - С котом
      - С соседом
      - С начальником
    answer: 1
    explain: "«…od kiedy pracuje zdalnie, najdłuższe rozmowy prowadzi z kotem.»"
  - type: choice
    q: Как автор отвечает на довод, что молодым сотрудникам без офиса труднее научиться профессии?
    options:
      - Соглашается и предлагает молодым работать только в офисе
      - Говорит, что молодым не нужны старшие коллеги
      - Считает это доводом не против удалённой работы, а против плохой организации
      - Говорит, что сам учился только через экран
    answer: 2
    explain: "«…nie uważam, że to argument przeciwko pracy zdalnej. To raczej argument przeciwko złej organizacji.»"
  - type: choice
    q: К чему приводят сообщения «Jesteście?», которые начальник каждый час шлёт команде?
    options:
      - Люди начинают работать быстрее
      - Люди возвращаются в офис
      - Команда перестаёт отвечать
      - Люди весь день отвечают ему «Jesteśmy» вместо того, чтобы работать
    answer: 3
    explain: "«W rezultacie jego ludzie, zamiast pracować, przez cały dzień odpowiadają mu: „Jesteśmy”.» W rezultacie — «в результате»."
  - type: choice
    q: Какой вариант автор считает самым разумным?
    options:
      - Работать только дома
      - Два дня в офисе, три дома
      - Три дня в офисе, два дома
      - Работать только в офисе
    answer: 1
    explain: "«Najrozsądniejszy wydaje mi się model mieszany: dwa dni w biurze, trzy w domu.»"
  - type: listen
    text: "Taki układ ma sens, o ile obie strony trzymają się zasad."
    explain: "O ile — «если только, при условии что»: условие, без которого всё не работает."
