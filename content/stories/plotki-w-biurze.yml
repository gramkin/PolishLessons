# review
title: Plotki w biurze
titleRu: Сплетни в офисе
level: B1
chapter: 25
description: "Кася и Пётр за кофе обсуждают слух, что начальница уходит из фирмы, — кто кому что сказал, кто о чём спросил и о чём она всех попросила; косвенная речь с że, czy и żeby, podobno, według и «ma odejść»."
sentences:
  - pl: Był poniedziałek rano i w biurowej kuchni pachniało kawą.
    ru: Было утро понедельника, и на офисной кухне пахло кофе.
    words: { poniedziałek: poniedzialek, rano: rano, kuchni: kuchnia, kawą: kawa }
  - pl: Kasia nalała sobie kawy i usiadła obok Piotra.
    ru: Кася налила себе кофе и села рядом с Петром.
    words: { kawy: kawa, usiadła: usiasc }
  - pl: — Słyszałeś? Podobno szefowa odchodzi z firmy — szepnęła.
    ru: — Слышал? Говорят, начальница уходит из фирмы, — прошептала она.
    words: { Słyszałeś: slyszec, Podobno: podobno, szefowa: szefowa, firmy: firma }
  - pl: — Co? Kto ci to powiedział?
    ru: — Что? Кто тебе это сказал?
    words: { Kto: kto, powiedział: powiedziec }
  - pl: — Marta z księgowości. Według niej szefowa ma odejść jeszcze w tym miesiącu.
    ru: — Марта из бухгалтерии. По её словам, начальница уйдёт ещё в этом месяце.
    words: { księgowości: ksiegowosc, Według: wedlug, szefowa: szefowa, ma: miec, odejść: odejsc, miesiącu: miesiac }
  - pl: — A skąd Marta to wie?
    ru: — А откуда Марта это знает?
    words: { skąd: skad, wie: wiedziec }
  - pl: — Twierdzi, że w piątek słyszała, jak szefowa rozmawiała przez telefon z kimś z kadr.
    ru: — Утверждает, что в пятницу слышала, как начальница говорила по телефону с кем-то из отдела кадров.
    words: { Twierdzi: twierdzic, piątek: piatek, słyszała: slyszec, szefowa: szefowa, rozmawiała: rozmawiac, telefon: telefon }
  - pl: — I co mówiła?
    ru: — И что она говорила?
    words: { mówiła: mowic }
  - pl: — Powiedziała, że od przyszłego miesiąca nie będzie jej w biurze i że ktoś musi ją zastąpić.
    ru: — Сказала, что со следующего месяца её не будет в офисе и что кто-то должен её заменить.
    words: { Powiedziała: powiedziec, miesiąca: miesiac, biurze: biuro, musi: musiec, zastąpić: zastapic }
  - pl: Piotr odstawił kubek i przez chwilę milczał.
    ru: Пётр поставил кружку и с минуту молчал.
    words: { chwilę: chwila }
  - pl: — To dziwne. W piątek zapytała mnie, czy skończę raport przed jej wyjazdem.
    ru: — Странно. В пятницу она спросила меня, закончу ли я отчёт до её отъезда.
    words: { dziwne: dziwny, piątek: piatek, zapytała: zapytac, skończę: skonczyc, raport: raport }
  - pl: — Widzisz! A mnie kazała, żebym przygotowała listę wszystkich naszych klientów.
    ru: — Видишь! А мне она велела, чтобы я подготовила список всех наших клиентов.
    words: { Widzisz: widziec, kazała: kazac, przygotowała: przygotowac, listę: lista, klientów: klient }
  - pl: — Po co jej taka lista?
    ru: — Зачем ей такой список?
    words: { lista: lista }
  - pl: — Ponoć dla nowego szefa. Marta mówi, że szefowa ma przejść do konkurencji.
    ru: — Говорят, для нового начальника. Марта говорит, что начальница якобы переходит к конкурентам.
    words: { Ponoć: ponoc, nowego: nowy, szefa: szef, mówi: mowic, szefowa: szefowa, ma: miec, przejść: przejsc, konkurencji: konkurencja }
  - pl: — Do konkurencji? Nie wierzę. Przecież ona pracuje tu od dwudziestu lat.
    ru: — К конкурентам? Не верю. Она же работает здесь двадцать лет.
    words: { konkurencji: konkurencja, wierzę: wierzyc, Przecież: przeciez, pracuje: pracowac, dwudziestu: dwadziescia, lat: rok }
  - pl: — Marta pytała mnie nawet, czy wiem, kto przyjdzie na jej miejsce.
    ru: — Марта даже спрашивала меня, не знаю ли я, кто придёт на её место.
    words: { pytała: pytac, wiem: wiedziec, kto: kto, przyjdzie: przyjsc, miejsce: miejsce }
  - pl: W tej chwili do kuchni wszedł informatyk Tomek.
    ru: В эту минуту на кухню вошёл айтишник Томек.
    words: { chwili: chwila, kuchni: kuchnia, wszedł: wejsc }
  - pl: — O czym rozmawiacie? — zapytał, sięgając po cukier.
    ru: — О чём разговариваете? — спросил он, протягивая руку за сахаром.
    words: { rozmawiacie: rozmawiac, zapytał: zapytac, cukier: cukier }
  - pl: — O szefowej. Podobno odchodzi — odpowiedziała Kasia.
    ru: — О начальнице. Говорят, она уходит, — ответила Кася.
    words: { szefowej: szefowa, Podobno: podobno, odpowiedziała: odpowiedziec }
  - pl: — Ciekawe. Mnie poprosiła, żebym ustawił jej automatyczną odpowiedź w poczcie.
    ru: — Интересно. А меня она попросила, чтобы я настроил ей автоответ в почте.
    words: { Ciekawe: ciekawy, poprosiła: poprosic, odpowiedź: odpowiedz, poczcie: poczta }
  - pl: — Na jak długo? — zapytał Piotr.
    ru: — На сколько? — спросил Пётр.
    words: { długo: dlugo, zapytał: zapytac }
  - pl: — Nie powiedziała. Zapytałem tylko, od kiedy ma działać, a ona odpowiedziała, że od pierwszego.
    ru: — Не сказала. Я спросил только, с какого числа он должен работать, а она ответила, что с первого.
    words: { powiedziała: powiedziec, Zapytałem: zapytac, ma: miec, odpowiedziała: odpowiedziec, pierwszego: pierwszy }
  - pl: Kasia spojrzała na Piotra znacząco.
    ru: Кася многозначительно посмотрела на Петра.
    words: { spojrzała: spojrzec }
  - pl: — Widzisz? Wszystko się zgadza.
    ru: — Видишь? Всё сходится.
    words: { Widzisz: widziec, Wszystko: wszystko }
  - pl: Nagle w drzwiach stanęła sama szefowa, uśmiechnięta, z teczką w ręku.
    ru: Вдруг в дверях появилась сама начальница, улыбающаяся, с папкой в руке.
    words: { Nagle: nagle, drzwiach: drzwi, sama: sam, szefowa: szefowa, uśmiechnięta: usmiechniety, ręku: reka }
  - pl: — Dobrze, że was widzę. Chciałam was prosić, żebyście w piątek przyszli na krótkie spotkanie.
    ru: — Хорошо, что я вас вижу. Я хотела вас попросить, чтобы вы в пятницу пришли на короткое собрание.
    words: { Dobrze: dobrze, widzę: widziec, Chciałam: chciec, prosić: prosic, piątek: piatek, przyszli: przyjsc, krótkie: krotki, spotkanie: spotkanie }
  - pl: — Czy coś się stało? — zapytała ostrożnie Kasia.
    ru: — Что-то случилось? — осторожно спросила Кася.
    words: { zapytała: zapytac }
  - pl: — Nic złego. Od pierwszego biorę trzy miesiące urlopu. Lecę z mężem do Ameryki Południowej.
    ru: — Ничего плохого. С первого числа я беру три месяца отпуска. Лечу с мужем в Южную Америку.
    words: { złego: zly, pierwszego: pierwszy, miesiące: miesiac, urlopu: urlop, Lecę: leciec, mężem: maz }
  - pl: — Trzy miesiące? — powtórzył Piotr.
    ru: — Три месяца? — повторил Пётр.
    words: { miesiące: miesiac }
  - pl: — Tak, czekałam na to dwadzieścia lat. Pan Nowak będzie mnie zastępował, więc proszę, żebyście mu pomagali.
    ru: — Да, я ждала этого двадцать лет. Меня будет замещать пан Новак, так что прошу вас ему помогать.
    words: { czekałam: czekac, dwadzieścia: dwadziescia, lat: rok, Pan: pan, proszę: prosic, pomagali: pomagac }
  - pl: — A lista klientów? — zapytała Kasia.
    ru: — А список клиентов? — спросила Кася.
    words: { lista: lista, klientów: klient, zapytała: zapytac }
  - pl: — Dla pana Nowaka, oczywiście. Musi wiedzieć, do kogo dzwonić.
    ru: — Для пана Новака, конечно. Ему нужно знать, кому звонить.
    words: { pana: pan, oczywiście: oczywiscie, Musi: musiec, wiedzieć: wiedziec, dzwonić: dzwonic }
  - pl: Kiedy szefowa wyszła, Tomek się roześmiał.
    ru: Когда начальница вышла, Томек рассмеялся.
    words: { szefowa: szefowa, wyszła: wyjsc }
  - pl: — No to już wiemy, kto ma odejść z firmy. Nikt.
    ru: — Ну вот, теперь мы знаем, кто якобы уходит из фирмы. Никто.
    words: { wiemy: wiedziec, kto: kto, ma: miec, odejść: odejsc, firmy: firma, Nikt: nikt }
  - pl: — A ty powiedz Marcie, żeby następnym razem słuchała uważniej — powiedział Piotr do Kasi.
    ru: — А ты скажи Марте, чтобы в следующий раз слушала внимательнее, — сказал Пётр Касе.
    words: { powiedz: powiedziec, słuchała: sluchac, powiedział: powiedziec }
  - pl: — Powiem jej — zaśmiała się Kasia. — Ale ona i tak mi nie uwierzy.
    ru: — Скажу, — засмеялась Кася. — Но она мне всё равно не поверит.
    words: { Powiem: powiedziec, jej: jej, uwierzy: uwierzyc }
questions:
  - type: choice
    q: От кого Кася узнала слух об уходе начальницы?
    options:
      - От самой начальницы
      - От Марты из бухгалтерии
      - От айтишника Томека
      - От пана Новака
    answer: 1
    explain: "«Marta z księgowości. Według niej szefowa ma odejść jeszcze w tym miesiącu.» Według + родительный: według niej — «по её словам»; ma odejść — «говорят, уйдёт»."
  - type: choice
    q: Что начальница велела сделать Касе?
    options:
      - Закончить отчёт
      - Настроить автоответ в почте
      - Подготовить список всех клиентов
      - Найти себе замену
    answer: 2
    explain: "«A mnie kazała, żebym przygotowała listę wszystkich naszych klientów.» Приказ пересказан с żeby + прошедшее: żebym przygotowała, «чтобы я подготовила»."
  - type: choice
    q: Что, по словам Марты, начальница собирается делать?
    options:
      - Перейти к конкурентам
      - Выйти на пенсию
      - Открыть свою фирму
      - Переехать в другой город
    answer: 0
    explain: "«Marta mówi, że szefowa ma przejść do konkurencji.» Mieć + инфинитив пересказывает чужие сведения: ma przejść — «якобы переходит»."
  - type: choice
    q: О чём Пётр спросил Томека и что тот ответил?
    options:
      - Куда уезжает начальница — в Америку
      - Надолго ли автоответ — Томек не знает, начальница только сказала, что с первого числа
      - Кто заменит начальницу — пан Новак
      - Когда собрание — в пятницу
    answer: 1
    explain: "«Na jak długo?» — «Nie powiedziała. Zapytałem tylko, od kiedy ma działać, a ona odpowiedziała, że od pierwszego.» Пересказанный вопрос с вопросительным словом: od kiedy, без czy."
  - type: choice
    q: Почему на самом деле начальницы не будет в офисе?
    options:
      - Она переходит к конкурентам
      - Она болеет
      - Её уволили
      - Она берёт три месяца отпуска и летит с мужем в Южную Америку
    answer: 3
    explain: "«Od pierwszego biorę trzy miesiące urlopu. Lecę z mężem do Ameryki Południowej.» Так что Томек прав: «No to już wiemy, kto ma odejść z firmy. Nikt.»"
  - type: choice
    q: Для кого предназначен список клиентов?
    options:
      - Для нового начальника из другой фирмы
      - Для пана Новака, который будет замещать начальницу
      - Для бухгалтерии
      - Для самой начальницы в отпуске
    answer: 1
    explain: "«Dla pana Nowaka, oczywiście. Musi wiedzieć, do kogo dzwonić.» Слух «ponoć dla nowego szefa» оказался наполовину верен: заместитель, а не новый начальник."
  - type: listen
    text: Według niej szefowa ma odejść jeszcze w tym miesiącu.
    explain: "według + родительный: niej (от ona после предлога); ma odejść — mieć + инфинитив, «говорят, уйдёт»."
