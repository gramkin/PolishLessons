# review
title: Wycieczka w góry
titleRu: Поход в горы
level: B1
chapter: 23
description: "Рассказчик с подругой идёт в Татры, теряет тропу в тумане и в сумерках добирается до горного приюта; деепричастия на -ąc (idąc, patrząc, nie mając) и книжные -wszy/-łszy (wstawszy, zjadłszy, doszedłszy)."
sentences:
  - pl: W zeszłą sobotę pojechałem z przyjaciółką Kasią w Tatry.
    ru: В прошлую субботу я поехал с подругой Касей в Татры.
    words: { sobotę: sobota, pojechałem: pojechac, przyjaciółką: przyjaciolka }
  - pl: Wstawszy o czwartej rano, zjadłem szybkie śniadanie i jeszcze raz sprawdziłem plecak.
    ru: Встав в четыре утра, я наскоро позавтракал и ещё раз проверил рюкзак.
    words: { Wstawszy: wstac, rano: rano, zjadłem: zjesc, śniadanie: sniadanie, sprawdziłem: sprawdzic, plecak: plecak }
  - pl: Kasia czekała już na mnie przed domem, trzymając w ręku termos z gorącą herbatą.
    ru: Кася уже ждала меня перед домом, держа в руке термос с горячим чаем.
    words: { czekała: czekac, domem: dom, trzymając: trzymac, ręku: reka, gorącą: goracy, herbatą: herbata }
  - pl: Z Krakowa do Zakopanego jechaliśmy dwie godziny i dojechaliśmy na miejsce, kiedy było jeszcze ciemno.
    ru: Из Кракова до Закопане мы ехали два часа и добрались до места, когда было ещё темно.
    words: { jechaliśmy: jechac, godziny: godzina, dojechaliśmy: dojechac, ciemno: ciemno }
  - pl: Zostawiwszy samochód na parkingu, ruszyliśmy szlakiem w stronę schroniska.
    ru: Оставив машину на парковке, мы двинулись по тропе в сторону приюта.
    words: { Zostawiwszy: zostawic, samochód: samochod, szlakiem: szlak, stronę: strona, schroniska: schronisko }
  - pl: "Idąc przez las, rozmawialiśmy o wszystkim: o pracy, o rodzinie, o planach na wakacje."
    ru: "Идя через лес, мы разговаривали обо всём: о работе, о семье, о планах на отпуск."
    words: { Idąc: isc, las: las, rozmawialiśmy: rozmawiac, wszystkim: wszystko, pracy: praca, rodzinie: rodzina }
  - pl: Rozmawiając, nawet nie zauważyliśmy, kiedy zrobiło się jasno.
    ru: Разговаривая, мы даже не заметили, как рассвело.
    words: { Rozmawiając: rozmawiac, zauważyliśmy: zauwazyc }
  - pl: – Kiedy byłam mała, chodziłam tu z tatą co roku – powiedziała Kasia.
    ru: — Когда я была маленькой, я ходила сюда с папой каждый год, — сказала Кася.
    words: { Kiedy: kiedy, mała: maly, chodziłam: chodzic, tatą: tata, roku: rok, powiedziała: powiedziec }
  - pl: – A ja, szczerze mówiąc, jestem w górach pierwszy raz – przyznałem.
    ru: — А я, честно говоря, в горах первый раз, — признался я.
    words: { szczerze: szczerze, mówiąc: mowic, górach: gora, pierwszy: pierwszy }
  - pl: Po trzech godzinach doszliśmy do dużej polany.
    ru: Через три часа мы дошли до большой поляны.
    words: { godzinach: godzina, doszliśmy: dojsc }
  - pl: Usiedliśmy na kamieniu i wypiliśmy herbatę z termosu.
    ru: Мы сели на камень и выпили чаю из термоса.
    words: { Usiedliśmy: usiasc, kamieniu: kamien, wypiliśmy: wypic, herbatę: herbata }
  - pl: Patrząc na szczyty dookoła, nie mogłem uwierzyć, że jest tak pięknie.
    ru: Глядя на вершины вокруг, я не мог поверить, что здесь так красиво.
    words: { Patrząc: patrzec, szczyty: szczyt, mogłem: moc }
  - pl: Zjadłszy kanapki, ruszyliśmy dalej w stronę przełęczy.
    ru: Съев бутерброды, мы двинулись дальше в сторону перевала.
    words: { Zjadłszy: zjesc, kanapki: kanapka, stronę: strona }
  - pl: Niestety pogoda szybko się zmieniła.
    ru: К сожалению, погода быстро изменилась.
    words: { Niestety: niestety, pogoda: pogoda, szybko: szybko }
  - pl: Z doliny nadciągnęła gęsta mgła i po kilku minutach nie widzieliśmy nawet drzew obok szlaku.
    ru: Из долины надвинулся густой туман, и через несколько минут мы не видели даже деревьев рядом с тропой.
    words: { doliny: dolina, mgła: mgla, minutach: minuta, widzieliśmy: widziec, drzew: drzewo, szlaku: szlak }
  - pl: Zrobiłem Kasi zdjęcie, żartując, że wygląda jak duch.
    ru: Я сфотографировал Касю, приговаривая в шутку, что она похожа на привидение.
    words: { Zrobiłem: zrobic, zdjęcie: zdjecie, żartując: zartowac, duch: duch }
  - pl: – Gdzie są znaki? – zapytała nagle Kasia. – Przed chwilą jeszcze je widziałam.
    ru: — Где метки? — вдруг спросила Кася. — Минуту назад я их ещё видела.
    words: { Gdzie: gdzie, znaki: znak, zapytała: zapytac, chwilą: chwila, widziałam: widziec }
  - pl: Szliśmy dalej, nie wiedząc, czy idziemy w dobrą stronę.
    ru: Мы шли дальше, не зная, в правильную ли сторону идём.
    words: { Szliśmy: isc, wiedząc: wiedziec, idziemy: isc, dobrą: dobry, stronę: strona }
  - pl: Po pół godzinie zrozumieliśmy, że zgubiliśmy szlak.
    ru: Через полчаса мы поняли, что потеряли тропу.
    words: { godzinie: godzina, zrozumieliśmy: zrozumiec, zgubiliśmy: zgubic, szlak: szlak }
  - pl: Telefony nie miały zasięgu, a wokół nie było nikogo.
    ru: Телефоны не ловили сеть, а вокруг никого не было.
    words: { Telefony: telefon, miały: miec }
  - pl: – Spokojnie – powiedziała Kasia. – Po tym, jak tata zgubił się kiedyś we mgle, nigdy nie chodzi w góry bez papierowej mapy. Ja też nie.
    ru: — Спокойно, — сказала Кася. — После того как папа однажды заблудился в тумане, он никогда не ходит в горы без бумажной карты. И я тоже.
    words: { powiedziała: powiedziec, tata: tata, zgubił: zgubic, mgle: mgla, nigdy: nigdy, chodzi: chodzic, mapy: mapa }
  - pl: Wyjąwszy mapę z plecaka, Kasia rozłożyła ją na kamieniu.
    ru: Достав карту из рюкзака, Кася разложила её на камне.
    words: { Wyjąwszy: wyjac, mapę: mapa, plecaka: plecak, kamieniu: kamien }
  - pl: – Słyszysz ten strumień? – zapytała. – Jeśli pójdziemy wzdłuż niego, dojdziemy do niebieskiego szlaku.
    ru: — Слышишь этот ручей? — спросила она. — Если пойдём вдоль него, то выйдем на синюю тропу.
    words: { strumień: strumien, zapytała: zapytac, Jeśli: jesli, pójdziemy: pojsc, dojdziemy: dojsc, niebieskiego: niebieski, szlaku: szlak }
  - pl: Nie mając lepszego pomysłu, zgodziłem się.
    ru: Не имея лучшей идеи, я согласился.
    words: { mając: miec, pomysłu: pomysl, zgodziłem: zgodzic }
  - pl: Schodząc powoli w dół, trzymaliśmy się blisko wody.
    ru: Медленно спускаясь вниз, мы держались поближе к воде.
    words: { Schodząc: schodzic, powoli: powoli, trzymaliśmy: trzymac, blisko: blisko, wody: woda }
  - pl: Mniej więcej po godzinie zobaczyłem między drzewami znak niebieskiego szlaku.
    ru: Примерно через час я увидел между деревьями метку синего маршрута.
    words: { godzinie: godzina, zobaczyłem: zobaczyc, drzewami: drzewo, znak: znak, niebieskiego: niebieski, szlaku: szlak }
  - pl: – Jest! – krzyknąłem tak głośno, że Kasia się roześmiała.
    ru: — Есть! — крикнул я так громко, что Кася рассмеялась.
    words: { głośno: glosno, roześmiała: rozesmiac }
  - pl: "Doszedłszy do znaku, jeszcze raz spojrzeliśmy na mapę: do schroniska była już tylko godzina drogi."
    ru: "Дойдя до метки, мы ещё раз посмотрели на карту: до приюта оставался всего час пути."
    words: { Doszedłszy: dojsc, znaku: znak, mapę: mapa, schroniska: schronisko, godzina: godzina, drogi: droga }
  - pl: Mgła powoli się podnosiła, ale robiło się już ciemno.
    ru: Туман постепенно поднимался, но уже темнело.
    words: { Mgła: mgla, powoli: powoli, robiło: robic, ciemno: ciemno }
  - pl: Do schroniska doszliśmy o zmierzchu, zmęczeni i mokrzy, ale bardzo szczęśliwi.
    ru: До приюта мы дошли в сумерках, усталые и мокрые, но очень счастливые.
    words: { schroniska: schronisko, doszliśmy: dojsc, zmęczeni: zmeczony, mokrzy: mokry, szczęśliwi: szczesliwy }
  - pl: Zdjąwszy mokre buty, usiedliśmy przy kominku i zamówiliśmy gorącą zupę.
    ru: Сняв мокрые ботинки, мы сели у камина и заказали горячий суп.
    words: { Zdjąwszy: zdjac, mokre: mokry, buty: but, usiedliśmy: usiasc, kominku: kominek, zamówiliśmy: zamowic, gorącą: goracy, zupę: zupa }
  - pl: – Wiesz co? – powiedziała Kasia, kiedy zjedliśmy. – Kiedy zgubiliśmy szlak, myślałam, że już nigdy nie pojedziesz ze mną w góry.
    ru: — Знаешь что? — сказала Кася, когда мы поели. — Когда мы потеряли тропу, я думала, что ты больше никогда не поедешь со мной в горы.
    words: { Wiesz: wiedziec, powiedziała: powiedziec, zjedliśmy: zjesc, zgubiliśmy: zgubic, myślałam: myslec, nigdy: nigdy, pojedziesz: pojechac, góry: gora }
  - pl: – Żartujesz? Kiedy wrócimy do domu, od razu kupię sobie własną mapę – odpowiedziałem.
    ru: — Шутишь? Когда вернёмся домой, я сразу куплю себе собственную карту, — ответил я.
    words: { Żartujesz: zartowac, wrócimy: wrocic, domu: dom, kupię: kupic, mapę: mapa }
  - pl: Wróciwszy następnego dnia do Krakowa, rzeczywiście poszedłem do księgarni i kupiłem mapę Tatr.
    ru: Вернувшись на следующий день в Краков, я действительно пошёл в книжный магазин и купил карту Татр.
    words: { Wróciwszy: wrocic, dnia: dzien, poszedłem: pojsc, kupiłem: kupic, mapę: mapa }
  - pl: Teraz wisi na ścianie w moim pokoju, a obok niej – zdjęcie Kasi we mgle.
    ru: Теперь она висит на стене в моей комнате, а рядом с ней — фотография Каси в тумане.
    words: { Teraz: teraz, wisi: wisiec, ścianie: sciana, pokoju: pokoj, obok: obok, zdjęcie: zdjecie, mgle: mgla }
questions:
  - type: choice
    q: Что рассказчик сделал сразу после того, как встал в четыре утра?
    options:
      - Позвонил Касе
      - Позавтракал и ещё раз проверил рюкзак
      - Сразу поехал в Закопане
      - Заварил чай в термос
    answer: 1
    explain: "«Wstawszy o czwartej rano, zjadłem szybkie śniadanie i jeszcze raz sprawdziłem plecak.» Wstawszy — от совершенного wstać: «встав», сначала одно, потом другое."
  - type: choice
    q: Почему рассказчик и Кася не заметили, как рассвело?
    options:
      - Они спали в машине
      - Шли по тёмному лесу с фонариками
      - Были заняты разговором
      - Смотрели на карту
    answer: 2
    explain: "«Rozmawiając, nawet nie zauważyliśmy, kiedy zrobiło się jasno.» Rozmawiając — от несовершенного rozmawiać: действие одновременно с главным."
  - type: choice
    q: Как рассказчик и Кася поняли, что потеряли тропу?
    options:
      - Кася перестала видеть метки на тропе
      - Телефон показал, что они ушли в сторону
      - Они встретили других туристов
      - Тропа закончилась у ручья
    answer: 0
    explain: "«– Gdzie są znaki? … Przed chwilą jeszcze je widziałam.» А дальше: «Szliśmy dalej, nie wiedząc, czy idziemy w dobrą stronę.»"
  - type: choice
    q: Почему у Каси с собой была бумажная карта?
    options:
      - Карту ей подарил рассказчик
      - Её отец однажды заблудился в тумане и с тех пор не ходит в горы без карты
      - Телефоны в Татрах запрещены
      - Она купила её в приюте
    answer: 1
    explain: "«Po tym, jak tata zgubił się kiedyś we mgle, nigdy nie chodzi w góry bez papierowej mapy.» В разговоре Кася говорит po tym, jak, а не книжное -wszy."
  - type: choice
    q: Почему рассказчик согласился идти вдоль ручья?
    options:
      - Он узнал это место
      - Ручей был виден на телефоне
      - У него не было идеи лучше
      - Кася пообещала ему горячий суп
    answer: 2
    explain: "«Nie mając lepszego pomysłu, zgodziłem się.» Nie с деепричастием пишется раздельно, а дополнение после отрицания стоит в родительном: lepszego pomysłu."
  - type: choice
    q: Что висит теперь на стене в комнате рассказчика?
    options:
      - Карта Татр и фотография Каси в тумане
      - Метка с тропы
      - Фотография приюта в сумерках
      - Карта Закопане
    answer: 0
    explain: "«Wróciwszy następnego dnia do Krakowa… kupiłem mapę Tatr. Teraz wisi na ścianie… a obok niej – zdjęcie Kasi we mgle.»"
  - type: listen
    text: "Nie mając lepszego pomysłu, zgodziłem się."
    explain: "Nie mając — «не имея»: nie отдельно, после отрицания родительный lepszego pomysłu."
