# review
title: Wiadomości z miasta
titleRu: Городские новости
level: B1
chapter: 22
description: "Репортаж с затопленной после ночного ливня улицы: закрытый мост, пожарные с насосами, владелец магазина и пенсионерка, которой помогли студенты; причастия на -ący (mieszkający, czekający, pracujący) и на -ny/-ty (zalany, zamknięty, uszkodzony, zaskoczony)."
sentences:
  - pl: – Dzień dobry państwu. Jesteśmy na ulicy Nadrzecznej, zalanej po nocnej ulewie.
    ru: — Добрый день. Мы находимся на улице Надречной, затопленной после ночного ливня.
    words: { ulicy: ulica, zalanej: zalany }
  - pl: Deszcz padał bez przerwy od wieczora do szóstej rano.
    ru: Дождь шёл без перерыва с вечера до шести утра.
    words: { Deszcz: deszcz, przerwy: przerwa, wieczora: wieczor, rano: rano }
  - pl: Około trzeciej w nocy rzeka płynąca przez centrum miasta wystąpiła z brzegów i zalała ulice.
    ru: Около трёх часов ночи река, протекающая через центр города, вышла из берегов и залила улицы.
    words: { nocy: noc, rzeka: rzeka, przez: przez, centrum: centrum, miasta: miasto, brzegów: brzeg, ulice: ulica }
  - pl: Rano mieszkańcy zobaczyli zalane piwnice, garaże i samochody stojące w wodzie.
    ru: Утром жители увидели затопленные подвалы, гаражи и машины, стоящие в воде.
    words: { Rano: rano, mieszkańcy: mieszkaniec, zobaczyli: zobaczyc, zalane: zalany, piwnice: piwnica, samochody: samochod, stojące: stac, wodzie: woda }
  - pl: Most na Nadrzecznej jest od rana zamknięty.
    ru: Мост на Надречной закрыт с утра.
    words: { Most: most, rana: rano, zamknięty: zamkniety }
  - pl: Na razie nie wiadomo, czy woda go nie uszkodziła.
    ru: Пока неизвестно, не повредила ли его вода.
    words: { woda: woda }
  - pl: Kierowcy jadący do centrum muszą jechać objazdem przez sąsiednią dzielnicę.
    ru: Водители, едущие в центр, должны ехать в объезд через соседний район.
    words: { Kierowcy: kierowca, jadący: jechac, centrum: centrum, muszą: musiec, jechać: jechac, objazdem: objazd, przez: przez, dzielnicę: dzielnica }
  - pl: Od siódmej rano na ulicy pracują strażacy.
    ru: С семи утра на улице работают пожарные.
    words: { rano: rano, ulicy: ulica, pracują: pracowac, strażacy: strazak }
  - pl: Pompy pracujące od świtu wypompowały już większość wody z piwnic i mieszkań na parterze.
    ru: Насосы, работающие с рассвета, уже откачали большую часть воды из подвалов и квартир на первом этаже.
    words: { Pompy: pompa, pracujące: pracujacy, już: juz, wody: woda, piwnic: piwnica, mieszkań: mieszkanie, parterze: parter }
  - pl: – Pracujemy bez przerwy od czterech godzin – mówi zmęczony strażak. – Ale najgorsze już za nami.
    ru: — Работаем без перерыва уже четыре часа, — говорит уставший пожарный. — Но худшее уже позади.
    words: { Pracujemy: pracowac, przerwy: przerwa, czterech: cztery, godzin: godzina, mówi: mowic, zmęczony: zmeczony, strażak: strazak, już: juz }
  - pl: Pod blokiem stoi grupa ludzi czekających na pomoc.
    ru: У дома стоит группа людей, ждущих помощи.
    words: { blokiem: blok, stoi: stac, ludzi: ludzie, czekających: czekac }
  - pl: Niektórzy spędzili noc u rodziny, inni w szkole, którą miasto otworzyło dla nich w nocy.
    ru: Одни провели ночь у родственников, другие — в школе, которую город открыл для них ночью.
    words: { noc: noc, rodziny: rodzina, szkole: szkola, miasto: miasto, nocy: noc }
  - pl: Ludzie mieszkający na parterze stracili prawie wszystko.
    ru: Люди, живущие на первом этаже, потеряли почти всё.
    words: { Ludzie: ludzie, mieszkający: mieszkac, parterze: parter, stracili: stracic, wszystko: wszystko }
  - pl: Rozmawiamy z panem Jerzym Wolskim, właścicielem sklepu spożywczego na rogu.
    ru: Мы разговариваем с паном Ежи Вольским, владельцем продуктового магазина на углу.
    words: { Rozmawiamy: rozmawiac, panem: pan, właścicielem: wlasciciel, sklepu: sklep, rogu: rog }
  - pl: "Sklep jest zamknięty, a na drzwiach wisi kartka napisana flamastrem: „Nieczynne do odwołania”."
    ru: "Магазин закрыт, а на двери висит записка, написанная фломастером: «Закрыто до особого распоряжения»."
    words: { Sklep: sklep, zamknięty: zamkniety, drzwiach: drzwi, kartka: kartka }
  - pl: – Przyszedłem o piątej i zobaczyłem wodę w całym sklepie – mówi pan Jerzy.
    ru: — Я пришёл в пять и увидел воду во всём магазине, — говорит пан Ежи.
    words: { Przyszedłem: przyjsc, zobaczyłem: zobaczyc, wodę: woda, sklepie: sklep, mówi: mowic, pan: pan }
  - pl: – Lodówki są zalane, a cały towar z piwnicy jest zniszczony.
    ru: — Холодильники залиты, а весь товар из подвала испорчен.
    words: { Lodówki: lodowka, zalane: zalany, towar: towar, piwnicy: piwnica, zniszczony: zniszczony }
  - pl: – Prowadzę ten sklep od dwudziestu lat i jeszcze nigdy czegoś takiego nie widziałem.
    ru: — Я держу этот магазин двадцать лет и ещё никогда такого не видел.
    words: { sklep: sklep, dwudziestu: dwadziescia, nigdy: nigdy, widziałem: widziec }
  - pl: Pytamy, czy sklep był ubezpieczony.
    ru: Мы спрашиваем, был ли магазин застрахован.
    words: { Pytamy: pytac, sklep: sklep, był: byc }
  - pl: – Na szczęście tak. Ale żadne pieniądze nie oddadzą mi klientów, którzy przez miesiąc będą robić zakupy gdzie indziej.
    ru: — К счастью, да. Но никакие деньги не вернут мне покупателей, которые месяц будут делать покупки в другом месте.
    words: { szczęście: szczescie, pieniądze: pieniadz, klientów: klient, przez: przez, miesiąc: miesiac, robić: robic, zakupy: zakupy }
  - pl: W najtrudniejszej sytuacji była pani Helena Mazur, osiemdziesięcioletnia emerytka mieszkająca samotnie na parterze.
    ru: В самом трудном положении оказалась пани Хелена Мазур, восьмидесятилетняя пенсионерка, которая живёт одна на первом этаже.
    words: { była: byc, pani: pani, emerytka: emerytka, mieszkająca: mieszkac, parterze: parter }
  - pl: W nocy woda weszła do jej mieszkania, a ona nie mogła sama wyjść na ulicę.
    ru: Ночью вода зашла в её квартиру, а она не могла сама выйти на улицу.
    words: { nocy: noc, woda: woda, weszła: wejsc, mieszkania: mieszkanie, mogła: moc, sama: sam, wyjść: wyjsc, ulicę: ulica }
  - pl: Pomogli jej studenci mieszkający w akademiku po drugiej stronie ulicy.
    ru: Ей помогли студенты, живущие в общежитии на другой стороне улицы.
    words: { Pomogli: pomoc, studenci: student, mieszkający: mieszkac, akademiku: akademik, ulicy: ulica }
  - pl: Przenieśli ją na rękach na pierwsze piętro, do sąsiadów, a potem wynieśli z mieszkania jej najważniejsze rzeczy.
    ru: Они перенесли её на руках на второй этаж, к соседям, а потом вынесли из квартиры её самые важные вещи.
    words: { rękach: reka, pierwsze: pierwszy, piętro: pietro, sąsiadów: sasiad, mieszkania: mieszkanie, rzeczy: rzecz }
  - pl: – Usłyszeliśmy, że ktoś woła o pomoc, i po prostu przybiegliśmy – mówi Michał, student trzeciego roku medycyny.
    ru: — Мы услышали, что кто-то зовёт на помощь, и просто прибежали, — говорит Михал, студент-медик третьего курса.
    words: { woła: wolac, mówi: mowic, student: student, trzeciego: trzeci, roku: rok }
  - pl: – Pani Helena była przestraszona, ale bardzo spokojna. To ona mówiła nam, co mamy wynosić.
    ru: — Пани Хелена была напугана, но очень спокойна. Это она говорила нам, что выносить.
    words: { Pani: pani, była: byc, bardzo: bardzo, mówiła: mowic }
  - pl: Sama pani Helena jest zaskoczona tym, ile osób chciało jej pomóc.
    ru: Сама пани Хелена удивлена тем, сколько людей хотели ей помочь.
    words: { Sama: sam, pani: pani, zaskoczona: zaskoczony, ile: ile, chciało: chciec, pomóc: pomoc }
  - pl: – Mieszkam tu od pięćdziesięciu lat i myślałam, że już nikt mnie nie zna – mówi z uśmiechem.
    ru: — Я живу здесь пятьдесят лет и думала, что меня уже никто не знает, — говорит она с улыбкой.
    words: { Mieszkam: mieszkac, pięćdziesięciu: piecdziesiat, myślałam: myslec, już: juz, zna: znac, mówi: mowic }
  - pl: – A ci młodzi ludzie przynieśli mi nawet gorącą herbatę i koc.
    ru: — А эти молодые люди даже принесли мне горячий чай и плед.
    words: { młodzi: mlody, ludzie: ludzie, herbatę: herbata, koc: koc }
  - pl: Według strażaków woda powinna zejść z ulicy do wieczora.
    ru: По словам пожарных, вода должна сойти с улицы к вечеру.
    words: { strażaków: strazak, woda: woda, zejść: zejsc, ulicy: ulica, wieczora: wieczor }
  - pl: Most pozostanie jednak zamknięty co najmniej do jutra, dopóki nie sprawdzą go inżynierowie.
    ru: Однако мост останется закрытым как минимум до завтра, пока его не проверят инженеры.
    words: { Most: most, zamknięty: zamkniety, jutra: jutro, inżynierowie: inzynier }
  - pl: Mieszkańcy zalanych domów mogą zgłaszać szkody w urzędzie miasta.
    ru: Жители затопленных домов могут сообщать об ущербе в городскую администрацию.
    words: { Mieszkańcy: mieszkaniec, zalanych: zalany, domów: dom, mogą: moc, urzędzie: urzad, miasta: miasto }
  - pl: Właściciele uszkodzonych samochodów powinni zrobić zdjęcia i zgłosić szkodę ubezpieczycielowi.
    ru: Владельцам повреждённых машин следует сфотографировать их и сообщить об ущербе страховой компании.
    words: { Właściciele: wlasciciel, uszkodzonych: uszkodzony, samochodów: samochod, zrobić: zrobic }
  - pl: Z ulicy Nadrzecznej relacjonowała Katarzyna Lis.
    ru: С улицы Надречной вела репортаж Катажина Лис.
    words: { ulicy: ulica }
questions:
  - type: choice
    q: Почему водители не могут ехать по мосту на Надречной?
    options:
      - Мост рухнул ночью
      - Мост закрыт с утра, и пока неизвестно, не повредила ли его вода
      - По мосту работают пожарные насосы
      - Мост ремонтируют уже месяц
    answer: 1
    explain: "«Most na Nadrzecznej jest od rana zamknięty. Na razie nie wiadomo, czy woda go nie uszkodziła.» Zamknięty — страдательное причастие от zamknąć."
  - type: choice
    q: Кто, по словам репортёра, потерял почти всё?
    options:
      - Водители, едущие в центр
      - Пожарные
      - Люди, живущие на первом этаже
      - Студенты из общежития
    answer: 2
    explain: "«Ludzie mieszkający na parterze stracili prawie wszystko.» Mieszkający — причастие на -ący от mieszkają; оборот указывает, какие люди, поэтому без запятых."
  - type: choice
    q: Что случилось с магазином пана Ежи?
    options:
      - Холодильники залиты, а товар из подвала испорчен
      - Его ограбили ночью
      - Он сгорел
      - Вода не дошла до магазина
    answer: 0
    explain: "«Lodówki są zalane, a cały towar z piwnicy jest zniszczony.» Zalane — мн. ч. от zalany, как lodówki."
  - type: choice
    q: Чего, по словам пана Ежи, не вернут никакие деньги?
    options:
      - Его магазина
      - Покупателей, которые месяц будут ходить в другие магазины
      - Двадцати лет работы
      - Товара из подвала
    answer: 1
    explain: "«Ale żadne pieniądze nie oddadzą mi klientów, którzy przez miesiąc będą robić zakupy gdzie indziej.» Магазин был застрахован — ubezpieczony."
  - type: choice
    q: Как студенты помогли пани Хелене?
    options:
      - Вызвали скорую помощь
      - Откачали воду из её квартиры
      - Отвезли её к родственникам
      - Перенесли её на руках к соседям на второй этаж и вынесли её вещи
    answer: 3
    explain: "«Przenieśli ją na rękach na pierwsze piętro, do sąsiadów…» Pierwsze piętro — по-русски второй этаж: parter — это первый."
  - type: choice
    q: Чему удивлена пани Хелена?
    options:
      - Тому, сколько людей хотели ей помочь
      - Тому, что вода зашла в квартиру
      - Тому, что мост закрыли
      - Тому, что студенты изучают медицину
    answer: 0
    explain: "«Sama pani Helena jest zaskoczona tym, ile osób chciało jej pomóc.» Zaskoczona — женский род: pani Helena."
  - type: listen
    text: "Pod blokiem stoi grupa ludzi czekających na pomoc."
    explain: "Czekających — причастие на -ący в родительном падеже множественного числа, как ludzi: grupa ludzi czekających."
