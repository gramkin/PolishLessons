# review
title: U lekarza specjalisty
titleRu: У врача-специалиста
level: B1
chapter: 28
description: "Пан Адам неделями мучается от боли в спине и головных болей, получает направление к специалисту и на анализы и узнаёт, что виноваты стресс и компьютер; лексика урока о здоровье: skierowanie, rejestracja, badanie, ciśnienie, zwolnienie lekarskie."
sentences:
  - pl: Od kilku tygodni pan Adam źle się czuł. Bolały go plecy, a wieczorami często bolała go głowa.
    ru: Уже несколько недель пан Адам плохо себя чувствовал. У него болела спина, а по вечерам часто болела голова.
    words: { kilku: kilka, źle: zle, czuł: czuc, Bolały: bolec, plecy: plecy, bolała: bolec, głowa: glowa }
  - pl: Najpierw myślał, że to samo minie, ale ból nie mijał.
    ru: Сначала он думал, что это пройдёт само, но боль не проходила.
    words: { myślał: myslec, ból: bol }
  - pl: W końcu żona przekonała go, żeby poszedł do lekarza rodzinnego.
    ru: В конце концов жена убедила его пойти к семейному врачу.
    words: { żona: zona, poszedł: pojsc, lekarza: lekarz }
  - pl: – Co panu dolega? – zapytała lekarka, kiedy usiadł w jej gabinecie.
    ru: — Что вас беспокоит? — спросила врач, когда он сел у неё в кабинете.
    words: { dolega: dolegac, zapytała: zapytac, lekarka: lekarka, usiadł: usiasc, gabinecie: gabinet }
  - pl: Adam opisał swoje objawy – ból pleców, częste bóle głowy i ciągłe zmęczenie.
    ru: Адам описал свои симптомы — боль в спине, частые головные боли и постоянную усталость.
    words: { opisał: opisac, swoje: swoj, objawy: objaw, ból: bol, pleców: plecy, bóle: bol, głowy: glowa }
  - pl: Lekarka dokładnie go zbadała, ale nie chciała stawiać diagnozy bez dodatkowych badań.
    ru: Врач тщательно его осмотрела, но не хотела ставить диагноз без дополнительного обследования.
    words: { Lekarka: lekarka, zbadała: zbadac, diagnozy: diagnoza, badań: badanie }
  - pl: – Dam panu skierowanie na badanie krwi i do specjalisty – powiedziała. – Proszę się nie martwić, to tylko dla pewności.
    ru: — Я дам вам направление на анализ крови и к специалисту, — сказала она. — Не волнуйтесь, это просто на всякий случай.
    words: { Dam: dac, skierowanie: skierowanie, badanie: badanie, krwi: krew, specjalisty: specjalista, powiedziała: powiedziec, martwić: martwic }
  - pl: Następnego dnia Adam zadzwonił do rejestracji przychodni specjalistycznej.
    ru: На следующий день Адам позвонил в регистратуру специализированной поликлиники.
    words: { dnia: dzien, zadzwonił: zadzwonic, rejestracji: rejestracja, przychodni: przychodnia }
  - pl: Pani w rejestracji zapytała, czy ma skierowanie, i zapisała go na najbliższy wolny termin.
    ru: Женщина в регистратуре спросила, есть ли у него направление, и записала его на ближайшее свободное время.
    words: { rejestracji: rejestracja, zapytała: zapytac, skierowanie: skierowanie, zapisała: zapisac, termin: termin }
  - pl: Krew oddał kilka dni później, rano i na czczo.
    ru: Кровь он сдал через несколько дней, утром и натощак.
    words: { Krew: krew, oddał: oddac, kilka: kilka, rano: rano }
  - pl: W dniu wizyty poczekalnia była pełna, a lekarz przyjmował z opóźnieniem.
    ru: В день приёма приёмная была полна, а врач принимал с опозданием.
    words: { wizyty: wizyta, poczekalnia: poczekalnia, pełna: pelny, lekarz: lekarz, przyjmował: przyjmowac }
  - pl: Adam czekał na swoją kolej, przeglądając stare gazety leżące na stoliku.
    ru: Адам ждал своей очереди, листая старые газеты, лежавшие на столике.
    words: { czekał: czekac, stare: stary, gazety: gazeta, leżące: lezec, stoliku: stolik }
  - pl: W końcu pielęgniarka wyczytała jego nazwisko i zaprowadziła go do gabinetu.
    ru: Наконец медсестра вызвала его по фамилии и проводила в кабинет.
    words: { pielęgniarka: pielegniarka, gabinetu: gabinet }
  - pl: Najpierw zmierzyła mu ciśnienie. – Trochę podwyższone, ale to nic groźnego – powiedziała.
    ru: Сначала она измерила ему давление. — Немного повышенное, но ничего страшного, — сказала она.
    words: { zmierzyła: zmierzyc, ciśnienie: cisnienie, nic: nic, powiedziała: powiedziec }
  - pl: Specjalista, starszy pan w okularach, przeczytał skierowanie i obejrzał wyniki badań przysłane z laboratorium.
    ru: Специалист, пожилой мужчина в очках, прочитал направление и просмотрел результаты анализов, присланные из лаборатории.
    words: { Specjalista: specjalista, starszy: starszy, okularach: okulary, przeczytał: przeczytac, skierowanie: skierowanie, wyniki: wynik, badań: badanie }
  - pl: – Wyniki badania krwi są dobre – powiedział. – Proszę zdjąć koszulę i głęboko oddychać.
    ru: — Результаты анализа крови хорошие, — сказал он. — Снимите, пожалуйста, рубашку и глубоко дышите.
    words: { Wyniki: wynik, badania: badanie, krwi: krew, powiedział: powiedziec, zdjąć: zdjac, koszulę: koszula, oddychać: oddychac }
  - pl: Lekarz zbadał mu plecy, a potem zapytał, ile godzin dziennie siedzi przy komputerze.
    ru: Врач осмотрел ему спину, а потом спросил, сколько часов в день он сидит за компьютером.
    words: { Lekarz: lekarz, zbadał: zbadac, plecy: plecy, zapytał: zapytac, godzin: godzina, siedzi: siedziec, komputerze: komputer }
  - pl: – Osiem, czasem dziesięć – przyznał Adam. – A wieczorem jeszcze oglądam seriale.
    ru: — Восемь, иногда десять, — признался Адам. — А вечером я ещё смотрю сериалы.
    words: { przyznał: przyznac, oglądam: ogladac, seriale: serial }
  - pl: – A jak w pracy? Dużo stresu?
    ru: — А как на работе? Много стресса?
    words: { pracy: praca, stresu: stres }
  - pl: – Odkąd zmieniono nam kierownika, więcej niż zwykle.
    ru: — С тех пор как нам сменили начальника, больше, чем обычно.
    words: { kierownika: kierownik }
  - pl: Specjalista pokiwał głową i usiadł przy biurku.
    ru: Специалист кивнул и сел за стол.
    words: { Specjalista: specjalista, głową: glowa, usiadł: usiasc, biurku: biurko }
  - pl: – Nie widzę niczego poważnego. Pana bóle są spowodowane stresem i zbyt długim siedzeniem przy komputerze.
    ru: — Я не вижу ничего серьёзного. Ваши боли вызваны стрессом и слишком долгим сидением за компьютером.
    words: { widzę: widziec, poważnego: powazny, bóle: bol, spowodowane: spowodowac, stresem: stres, długim: dlugi, komputerze: komputer }
  - pl: – Mięśnie pleców są bardzo napięte, a od takiego napięcia często boli też głowa.
    ru: — Мышцы спины очень напряжены, а от такого напряжения часто болит и голова.
    words: { Mięśnie: miesien, pleców: plecy, boli: bolec, głowa: glowa }
  - pl: – Skieruję pana na fizjoterapię. Fizjoterapeuta pokaże panu ćwiczenia, które trzeba będzie robić codziennie w domu.
    ru: — Я направлю вас на физиотерапию. Физиотерапевт покажет вам упражнения, которые нужно будет делать каждый день дома.
    words: { Skieruję: skierowac, fizjoterapię: fizjoterapia, ćwiczenia: cwiczenie, codziennie: codziennie, domu: dom }
  - pl: – Poza tym proszę co godzinę wstawać od komputera i trochę się poruszać.
    ru: — Кроме того, пожалуйста, каждый час вставайте из-за компьютера и немного двигайтесь.
    words: { godzinę: godzina, komputera: komputer }
  - pl: – A leki? – zapytał Adam.
    ru: — А лекарства? — спросил Адам.
    words: { leki: lek, zapytał: zapytac }
  - pl: – Na razie nie są potrzebne. Jeśli bóle nie miną, proszę przyjść ponownie.
    ru: — Пока они не нужны. Если боли не пройдут, приходите снова.
    words: { bóle: bol, przyjść: przyjsc }
  - pl: Na koniec lekarz wystawił mu zwolnienie lekarskie na kilka dni, żeby mógł odpocząć.
    ru: Напоследок врач выписал ему больничный на несколько дней, чтобы он мог отдохнуть.
    words: { lekarz: lekarz, wystawił: wystawic, zwolnienie: zwolnienie, kilka: kilka }
  - pl: Wieczorem żona zapytała go, co powiedział lekarz.
    ru: Вечером жена спросила его, что сказал врач.
    words: { żona: zona, zapytała: zapytac, powiedział: powiedziec, lekarz: lekarz }
  - pl: – Powiedział, że to nic poważnego i że wszystko jest spowodowane stresem i siedzeniem przy komputerze.
    ru: — Он сказал, что это ничего серьёзного и что всё вызвано стрессом и сидением за компьютером.
    words: { Powiedział: powiedziec, nic: nic, poważnego: powazny, wszystko: wszystko, spowodowane: spowodowac, stresem: stres, komputerze: komputer }
  - pl: – A dał ci jakieś leki?
    ru: — А он дал тебе какие-нибудь лекарства?
    words: { dał: dac, leki: lek }
  - pl: – Nie. Powiedział, że na razie nie są mi potrzebne, ale skierował mnie na fizjoterapię.
    ru: — Нет. Он сказал, что пока они мне не нужны, но направил меня на физиотерапию.
    words: { Powiedział: powiedziec, skierował: skierowac, fizjoterapię: fizjoterapia }
  - pl: – Kazał mi też codziennie ćwiczyć i co godzinę wstawać od biurka.
    ru: — А ещё он велел мне каждый день делать упражнения и каждый час вставать из-за стола.
    words: { Kazał: kazac, codziennie: codziennie, ćwiczyć: cwiczyc, godzinę: godzina, biurka: biurko }
  - pl: – I wystawił mi zwolnienie na kilka dni – dodał Adam z uśmiechem.
    ru: — И выписал мне больничный на несколько дней, — добавил Адам с улыбкой.
    words: { wystawił: wystawic, zwolnienie: zwolnienie, kilka: kilka, dodał: dodac }
  - pl: – W takim razie jutro, zamiast leżeć przed telewizorem, idziemy razem na długi spacer – odpowiedziała żona.
    ru: — В таком случае завтра, вместо того чтобы лежать перед телевизором, мы вместе идём на долгую прогулку, — ответила жена.
    words: { jutro: jutro, leżeć: lezec, telewizorem: telewizor, idziemy: isc, razem: razem, długi: dlugi, spacer: spacer, odpowiedziała: odpowiedziec, żona: zona }
  - pl: Adam westchnął, ale musiał przyznać, że lekarz powiedziałby to samo.
    ru: Адам вздохнул, но должен был признать, что врач сказал бы то же самое.
    words: { przyznać: przyznac, lekarz: lekarz, powiedziałby: powiedziec }
questions:
  - type: choice
    q: На что жаловался пан Адам?
    options:
      - На кашель и высокую температуру
      - На боль в спине, головные боли и постоянную усталость
      - На боль в горле и насморк
      - На аллергию и сыпь
    answer: 1
    explain: "«Adam opisał swoje objawy – ból pleców, częste bóle głowy i ciągłe zmęczenie.» Ból pleców — буквально «боль спины»: родительный от plecy."
  - type: choice
    q: Что Адам получил от семейного врача?
    options:
      - Рецепт на антибиотик
      - Больничный на неделю
      - Направление на анализ крови и к специалисту
      - Мазь для спины
    answer: 2
    explain: "«Dam panu skierowanie na badanie krwi i do specjalisty.» На процедуру — na + винительный, к человеку — do + родительный."
  - type: choice
    q: Что сделала медсестра перед приёмом у специалиста?
    options:
      - Взяла у Адама кровь
      - Измерила ему давление
      - Сделала ему укол
      - Записала его на следующий приём
    answer: 1
    explain: "«Najpierw zmierzyła mu ciśnienie.» Zmierzyć komuś ciśnienie — «измерить кому-то давление», с дательным: mu."
  - type: choice
    q: Чем, по словам специалиста, вызваны боли Адама?
    options:
      - Стрессом и слишком долгим сидением за компьютером
      - Инфекцией
      - Травмой спины
      - Плохими результатами анализа крови
    answer: 0
    explain: "«Pana bóle są spowodowane stresem i zbyt długim siedzeniem przy komputerze.» Są spowodowane — страдательный залог: «вызваны» чем — творительный без предлога."
  - type: choice
    q: Что Адам рассказал жене о лекарствах?
    options:
      - Врач прописал ему обезболивающее
      - Врач велел купить лекарства в частной аптеке
      - Врач сказал, что пока лекарства ему не нужны, и направил на физиотерапию
      - Он забыл спросить о лекарствах
    answer: 2
    explain: "«Powiedział, że na razie nie są mi potrzebne, ale skierował mnie na fizjoterapię.» Косвенная речь: после że время не сдвигается, как и в русском."
  - type: choice
    q: Что предлагает жена на завтра?
    options:
      - Вместе пойти на долгую прогулку
      - Посмотреть сериал
      - Снова пойти к врачу
      - Поехать на работу
    answer: 0
    explain: "«…zamiast leżeć przed telewizorem, idziemy razem na długi spacer.» Zamiast + инфинитив — «вместо того чтобы»."
  - type: listen
    text: "Specjalista pokiwał głową i usiadł przy biurku."
    explain: "Pokiwać głową — «кивнуть»: творительный падеж, буквально «покивать головой». Usiąść przy biurku — сесть за стол (przy + местный)."
