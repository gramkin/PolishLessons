questions:
  - type: choice
    q: "Где живёт бабушка?"
    options: ["В деревне у реки", "В большом городе", "Рядом с Аней", "У моря"]
    answer: 0
    explain: "«Babcia mieszka na wsi, nad rzeką». na wsi — предложный падеж (wieś → wsi), nad rzeką — творительный, как русское «над рекой»."
  - type: choice
    q: "Кого боится Бурек?"
    options: ["Кота", "Бабушку", "Мышь", "Аню"]
    answer: 0
    explain: "«Burek boi się kota». bać się требует родительного, как русское «бояться кота»."
  - type: choice
    q: "Где спит Бурек?"
    options: ["Под столом", "На столе", "У окна", "У реки"]
    answer: 0
    explain: "«Burek śpi pod stołem». pod «под» на вопрос «где?» требует творительного: stół → pod stołem, как «под столом»."
  - type: choice
    q: "Чего хочет Аня, услышав про Бурека?"
    options: ["Тоже завести собаку", "Поехать к бабушке в гости", "Подарить бабушке кота", "Ничего, она боится собак"]
    answer: 0
    explain: "«Mamo, ja też chcę mieć psa!» — «Мама, я тоже хочу собаку!». Mamo — звательная форма от mama."
  - type: choice
    q: "Что отвечает мама?"
    options: ["Что собака — это много работы", "Что у бабушки уже две собаки", "Что Бурек очень большой", "Что собаки опасны"]
    answer: 0
    explain: "«Pies to dużo pracy, Aniu». После dużo — родительный: praca → pracy. Aniu — звательная форма от Ania."
  - type: choice
    q: "«Kochana ___!» Как Аня обращается к бабушке в письме?"
    options: ["Babciu", "Babcia", "Babci"]
    answer: 0
    explain: "В обращении польский ставит звательный падеж: babcia → babciu, Ania → Aniu, mama → mamo. В письме без него не обойтись."
  - type: listen
    text: "Babcia mieszka na wsi, nad rzeką."
    explain: "wsi — от wieś: в предложном выпадает e. rzeką — творительный от rzeka, носовое ą на конце."
  - type: translate
    q: "Ты помогаешь маме?"
    answer: ["Pomagasz mamie?", "Czy pomagasz mamie?", "Ty pomagasz mamie?", "Czy ty pomagasz mamie?"]
    explain: "pomagać, как «помогать», требует дательного: mama → mamie. Окончание -ie с той же мягкостью, что в предложном: o mamie."
  - type: translate
    q: "Я часто думаю о тебе."
    answer: ["Często myślę o tobie.", "Myślę o tobie często.", "Ja często myślę o tobie.", "Często o tobie myślę."]
    explain: "myśleć o + предложный, как «думать о»: o tobie. Ударная форма tobie нужна после предлога, как русское «о тебе»."
