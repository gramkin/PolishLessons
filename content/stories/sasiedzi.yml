# review
title: Sąsiedzi
titleRu: Соседи
level: A2
chapter: 11
description: "В соседний дом к пани Новак въезжает шумная семья, а через день она уже читает их детям книги; множественное число существительных и прилагательных в разных падежах (sąsiedzi, dużo książek, dzieciom, o dzieciach, miłych sąsiadów)."
sentences:
  - pl: Pani Nowak mieszka w małym domu nad rzeką.
    ru: Пани Новак живёт в маленьком доме у реки.
    words: { Pani: pani, mieszka: mieszkac, małym: maly, domu: dom, rzeką: rzeka }
  - pl: Od wczoraj w domu obok mieszkają sąsiedzi.
    ru: Со вчерашнего дня в доме рядом живут соседи.
    words: { wczoraj: wczoraj, domu: dom, obok: obok, mieszkają: mieszkac, sąsiedzi: sasiad }
  - pl: "To młoda rodzina: mąż, żona i dzieci."
    ru: "Это молодая семья: муж, жена и дети."
    words: { młoda: mlody, rodzina: rodzina, mąż: maz, żona: zona, dzieci: dzieci }
  - pl: Mają też psy i koty.
    ru: У них есть и собаки, и кошки.
    words: { Mają: miec, psy: pies, koty: kot }
  - pl: Rano pani Nowak widziała przez okno krzesła, stoły, obrazy i lustra.
    ru: Утром пани Новак видела в окно стулья, столы, картины и зеркала.
    words: { Rano: rano, pani: pani, widziała: widziec, okno: okno, krzesła: krzeslo, stoły: stol, obrazy: obraz, lustra: lustro }
  - pl: Widziała też dużo książek.
    ru: Видела она и много книг.
    words: { Widziała: widziec, dużo: duzo, książek: ksiazka }
  - pl: – Kim oni są? – myślała.
    ru: «Кто они такие?» — думала она.
    words: { Kim: kto, oni: oni, są: byc, myślała: myslec }
  - pl: Wieczorem w domu obok było bardzo głośno.
    ru: Вечером в соседнем доме было очень шумно.
    words: { Wieczorem: wieczor, domu: dom, obok: obok, było: byc, bardzo: bardzo, głośno: glosno }
  - pl: Ludzie śpiewali, dzieci się śmiały, a psy szczekały.
    ru: Люди пели, дети смеялись, а собаки лаяли.
    words: { Ludzie: ludzie, śpiewali: spiewac, dzieci: dzieci, śmiały: smiac, psy: pies, szczekały: szczekac }
  - pl: Pani Nowak długo nie mogła spać.
    ru: Пани Новак долго не могла уснуть.
    words: { Pani: pani, długo: dlugo, mogła: moc, spać: spac }
  - pl: Rano spotkała sąsiadów przed domem.
    ru: Утром она встретила соседей перед домом.
    words: { Rano: rano, spotkała: spotkac, sąsiadów: sasiad, domem: dom }
  - pl: – Dzień dobry! Jesteśmy pani sąsiadami z domu obok.
    ru: — Здравствуйте! Мы ваши соседи из дома рядом.
    words: { Dzień dobry: dzien-dobry, Jesteśmy: byc, pani: pani, sąsiadami: sasiad, domu: dom, obok: obok }
  - pl: – Ja jestem Ola, a to Piotr.
    ru: — Я Оля, а это Пётр.
    words: { Ja: ja, jestem: byc }
  - pl: – Przepraszamy za wczoraj. Mieliśmy gości.
    ru: — Простите за вчерашнее. У нас были гости.
    words: { Przepraszamy: przepraszac, wczoraj: wczoraj, Mieliśmy: miec, gości: gosc }
  - pl: – Byli u nas przyjaciele i koledzy z pracy.
    ru: — У нас были друзья и коллеги с работы.
    words: { Byli: byc, nas: my, przyjaciele: przyjaciel, koledzy: kolega, pracy: praca }
  - pl: – Nic się nie stało – powiedziała pani Nowak.
    ru: — Ничего страшного, — сказала пани Новак.
    words: { Nic: nic, powiedziała: powiedziec, pani: pani }
  - pl: – Lubię ludzi, psy i koty.
    ru: — Я люблю людей, собак и кошек.
    words: { Lubię: lubic, ludzi: ludzie, psy: pies, koty: kot }
  - pl: – A dzieci? – zapytała Ola.
    ru: — А детей? — спросила Оля.
    words: { dzieci: dzieci, zapytała: zapytac }
  - pl: – Dzieci też! Mam w domu dużo książek dla dzieci.
    ru: — И детей тоже! У меня дома много книг для детей.
    words: { Dzieci: dzieci, Mam: miec, domu: dom, dużo: duzo, książek: ksiazka, dzieci: dzieci }
  - pl: Wieczorem pani Nowak czytała dzieciom książki.
    ru: Вечером пани Новак читала детям книги.
    words: { Wieczorem: wieczor, pani: pani, czytała: czytac, dzieciom: dzieci, książki: ksiazka }
  - pl: Dzieci słuchały i jadły jabłka.
    ru: Дети слушали и ели яблоки.
    words: { Dzieci: dzieci, słuchały: sluchac, jadły: jesc, jabłka: jablko }
  - pl: Potem śpiewały polskie piosenki.
    ru: Потом они пели польские песни.
    words: { Potem: potem, śpiewały: spiewac, polskie: polski, piosenki: piosenka }
  - pl: Pani Nowak też śpiewała.
    ru: Пани Новак тоже пела.
    words: { Pani: pani, śpiewała: spiewac }
  - pl: W nocy w domu obok było cicho.
    ru: Ночью в соседнем доме было тихо.
    words: { nocy: noc, domu: dom, obok: obok, było: byc, cicho: cicho }
  - pl: Ale pani Nowak długo nie spała.
    ru: Но пани Новак долго не спала.
    words: { pani: pani, długo: dlugo, spała: spac }
  - pl: Myślała o dzieciach i o piosenkach.
    ru: Она думала о детях и о песнях.
    words: { Myślała: myslec, dzieciach: dzieci, piosenkach: piosenka }
  - pl: Teraz ma bardzo miłych sąsiadów.
    ru: Теперь у неё очень милые соседи.
    words: { Teraz: teraz, ma: miec, bardzo: bardzo, miłych: mily, sąsiadów: sasiad }
questions:
  - type: choice
    q: Кто живёт в соседнем доме?
    options: ["Молодая семья: муж, жена и дети.", "Студенты из Кракова.", "Брат пани Новак."]
    answer: 0
    explain: "«To młoda rodzina: mąż, żona i dzieci.» rodzina — «семья», ложный друг: «родина» по-польски ojczyzna."
  - type: choice
    q: Почему пани Новак не могла уснуть?
    options: ["У соседей было очень шумно.", "Под окном мяукал кот.", "Она до ночи читала книги."]
    answer: 0
    explain: "«Wieczorem w domu obok było bardzo głośno.» Люди пели, дети смеялись, собаки лаяли."
  - type: choice
    q: Почему у соседей было шумно?
    options: ["У них были гости: друзья и коллеги.", "Дети играли с собаками.", "Соседи переносили мебель."]
    answer: 0
    explain: "«Mieliśmy gości. Byli u nas przyjaciele i koledzy z pracy.» koledzy — множественное от kolega с чередованием g → dz."
  - type: choice
    q: Что пани Новак делала вечером с детьми?
    options: ["Читала им книги и пела с ними.", "Учила их польскому.", "Гуляла с ними у реки."]
    answer: 0
    explain: "«Wieczorem pani Nowak czytała dzieciom książki.» Потом дети пели польские песни, и пани Новак тоже пела."
  - type: choice
    q: "«Lubię ___, psy i koty.»"
    options: [ludzi, ludzie, ludźmi]
    answer: 0
    explain: "Винительный мужско-личных существительных совпадает с родительным: ludzi. ludzie — именительный, ludźmi — творительный. psy и koty — не люди, их винительный равен именительному."
  - type: listen
    text: Dzieci słuchały i jadły jabłka.
    explain: "dzieci — не мужско-личное, поэтому глагол на -ły: słuchały, jadły. jabłka — множественное от jabłko."
  - type: translate
    q: У меня дома много книг.
    answer: ["Mam w domu dużo książek.", "W domu mam dużo książek.", "Mam dużo książek w domu."]
    explain: "После dużo — родительный множественного. У książka окончания нет, а между согласными появляется беглое e: książek."
  - type: translate
    q: Вечером она читала детям книги.
    answer: ["Wieczorem czytała dzieciom książki.", "Wieczorem ona czytała dzieciom książki.", "Wieczorem czytała książki dzieciom."]
    explain: "Кому — дательный множественного на -om: dzieciom, как русское «детям». Что — винительный: książki."
