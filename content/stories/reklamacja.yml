questions:
  - type: choice
    q: Что случилось со стиральной машиной?
    options:
      - Она не включается
      - Из неё при каждой стирке вытекает вода
      - Она слишком громко работает
      - Её привезли с разбитым корпусом
    answer: 1
    explain: "«…od tygodnia przy każdym praniu wycieka z niej woda.» Wyciekać — «вытекать», а od tygodnia — «уже неделю»."
  - type: choice
    q: Почему Марте пришлось выключить машину?
    options:
      - Вода залила всю ванную
      - Пропало электричество
      - Так велел магазин
      - Машина начала дымить
    answer: 0
    explain: "«Dzisiaj rano woda zalała całą łazienkę i musiałam wyłączyć urządzenie.»"
  - type: choice
    q: Что магазин попросил прислать в первом ответе?
    options:
      - Только номер заказа
      - Паспорт и адрес
      - Скан чека, фотографию места протечки и серийный номер
      - Саму машину обратно
    answer: 2
    explain: "«…potrzebujemy jednak skanu paragonu oraz zdjęcia miejsca, z którego wycieka woda.» и «Prosimy również o podanie numeru seryjnego pralki…»"
  - type: choice
    q: Что видно на третьей фотографии?
    options:
      - Лужа под машиной
      - Треснувший уплотнитель
      - Чек из магазина
      - Табличка с серийным номером
    answer: 3
    explain: "«…a na trzecim tabliczkę z numerem seryjnym.» После widać — винительный: kałużę, uszczelkę, tabliczkę."
  - type: choice
    q: Что будет, если машину не удастся починить на месте?
    options:
      - Марте вернут деньги
      - Машину заменят на новую без дополнительной платы
      - Марте придётся заплатить за ремонт
      - Машину увезут в сервис на месяц
    answer: 1
    explain: "«Jeżeli naprawa na miejscu okaże się niemożliwa, wymienimy pralkę na nową bez dodatkowych opłat.» Wymienić coś na coś — «заменить что-то на что-то»."
  - type: choice
    q: Почему второе письмо Марта заканчивает словом «Pozdrawiam», а не «Z poważaniem»?
    options:
      - Она рассердилась на магазин
      - Она уже переписывается с этим адресатом, и обычная деловая формула уместна
      - «Pozdrawiam» официальнее, чем «Z poważaniem»
      - Так требует магазин
    answer: 1
    explain: "Первое письмо — «Z poważaniem», нейтральная формула для незнакомого адресата. Во втором, ответном, хватает «Pozdrawiam» — обычной формулы для того, с кем уже переписываешься."
  - type: listen
    text: "W załączeniu przesyłam skan paragonu oraz trzy zdjęcia."
    explain: "w załączeniu — «во вложении»; przesyłać + винительный: skan, zdjęcia. Oraz — книжное «и»."
