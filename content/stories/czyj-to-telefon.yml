questions:
  - type: choice
    q: Где Марек нашёл телефон?
    options: ["В ресторане, на соседнем столе.", "В автобусе.", "У пани Новак дома."]
    answer: 0
    explain: "«Na stole obok leżał telefon.» Потом Марек говорит: «W restauracji przy dworcu»."
  - type: choice
    q: Как Марек узнал, чей это телефон?
    options: ["На телефоне была фотография собаки пани Новак.", "Ему сказала женщина у окна.", "Телефон зазвонил, и он ответил."]
    answer: 0
    explain: "«Na telefonie było zdjęcie psa.» Марек узнал Бурека, пса своей соседки."
  - type: choice
    q: Что пани Новак делала утром в ресторане?
    options: ["Пила кофе с подругой.", "Искала свою собаку.", "Обедала с Мареком."]
    answer: 0
    explain: "«Rano piłam tam kawę z koleżanką.» z koleżanką — творительный после z, как «с подругой»."
  - type: choice
    q: Что сделал Бурек в конце?
    options: ["Дал Мареку лапу.", "Залаял на Марека.", "Убежал под стол."]
    answer: 0
    explain: "«Burek dał Markowi łapę.» Markowi — дательный от Marek: кому дал."
  - type: choice
    q: "Пани Новак любит собственную собаку: «Pani Nowak kocha ___ psa.»"
    options: [swojego, jej, jego]
    answer: 0
    explain: "Собака принадлежит подлежащему, поэтому swojego, как русское «свою». jej psa значило бы собаку какой-то другой женщины, jego psa — какого-то мужчины."
  - type: listen
    text: Marek pił kawę w restauracji.
    explain: "pił — «пил», ł звучит как «у»: «пиу». w restauracji — предложный падеж."
  - type: translate
    q: Это ваш телефон? (женщине)
    answer: ["Czy to pani telefon?", "To pani telefon?"]
    explain: "Вежливое «ваш» при обращении к женщине — pani, она не склоняется: pani telefon, pani książka. Мужчине — pana telefon."
  - type: translate
    q: Я (ж.) искала его с утра.
    answer: ["Szukałam go od rana.", "Od rana go szukałam."]
    explain: "«С утра» — od rana, родительный после od. Безударное «его» — короткая форма go, она не стоит в начале фразы."
