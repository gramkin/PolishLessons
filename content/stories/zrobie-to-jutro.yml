questions:
  - type: choice
    q: Какая проблема у Марека?
    options: ["Он всё откладывает на завтра.", "Он не умеет читать.", "Он всегда опаздывает на урок."]
    answer: 0
    explain: "«Zawsze mówi: „Zrobię to jutro”.» zrobię — совершенный вид в форме настоящего времени, поэтому значит будущее: «сделаю»."
  - type: choice
    q: Почему утром Марек не поел хлеба?
    options: ["Хлеба не было: Марек его не купил.", "Мама съела весь хлеб.", "Хлеб лежал на стуле."]
    answer: 0
    explain: "Вчера Марек сказал «Kupię jutro!», и утром «chleba nie było». После nie było — родительный, как «не было хлеба»."
  - type: choice
    q: Что мама написала в первой записке?
    options: ["Хлеб купишь завтра, сегодня съешь яблоко.", "Купи хлеб и напиши бабушке.", "Сегодня не ходи на урок."]
    answer: 0
    explain: "«Chleb kupisz jutro. Dzisiaj zjesz jabłko.» Мама отвечает Мареку его же словами: «завтра»."
  - type: choice
    q: Что Марек сделал после урока?
    options: ["Купил хлеб и написал письмо бабушке.", "Долго слушал музыку.", "Прочитал книгу у бабушки."]
    answer: 0
    explain: "«Po lekcji kupił chleb. Potem napisał list do babci.» kupił, napisał — совершенный вид: дело сделано."
  - type: choice
    q: "«Книгу прочитаешь завтра» — Książkę ___ jutro."
    options: [przeczytasz, czytasz, przeczytałeś]
    answer: 0
    explain: "Одно законченное действие в будущем — совершенный вид с окончаниями настоящего: przeczytasz, как «прочитаешь». czytasz — «читаешь» сейчас, przeczytałeś — прошедшее."
  - type: listen
    text: Dzisiaj nie mam czasu.
    explain: "После nie mam — родительный: czas → czasu, как «нет времени»."
  - type: translate
    q: Я напишу письмо завтра.
    answer: ["Napiszę list jutro.", "Jutro napiszę list.", "Napiszę jutro list."]
    explain: "napisać — совершенный вид, поэтому napiszę уже значит «напишу». Będę napisać сказать нельзя: będę соединяется только с несовершенным видом."
  - type: translate
    q: Сегодня на уроке ты будешь слушать учителя (мальчику).
    answer: ["Dzisiaj na lekcji będziesz słuchać nauczyciela.", "Dzisiaj na lekcji będziesz słuchał nauczyciela.", "Dziś na lekcji będziesz słuchać nauczyciela.", "Dziś na lekcji będziesz słuchał nauczyciela."]
    explain: "Длительное действие в будущем — będziesz + инфинитив или форма на -ł (мальчику słuchał, девочке słuchała). słuchać требует родительного: nauczyciela."
