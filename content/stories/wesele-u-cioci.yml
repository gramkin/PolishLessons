# review
title: Wesele u cioci
titleRu: Свадьба у тёти
level: B2
chapter: 36
description: "Племянница рассказывает о деревенской свадьбе двоюродной сестры — с тётей, которая хочет, чтобы всё было идеально, дядиной речью, упавшим тортом и очепинами; идиомы и пословицы: mieć głowę na karku, gdzie kucharek sześć, nie ma tego złego, wziąć udział, złożyć życzenia."
sentences:
  - pl: "W sierpniu moja kuzynka Kasia wyszła za mąż, a wesele odbyło się u cioci Haliny, na wsi, w której wychowała się moja mama."
    ru: "В августе моя двоюродная сестра Кася вышла замуж, а свадьба прошла у тёти Халины, в деревне, где выросла моя мама."
    words: { sierpniu: sierpien, kuzynka: kuzynka, wyszła: wyjsc, mąż: maz, wesele: wesele, cioci: ciocia, wsi: wies, mama: mama }
  - pl: "Ciocia przygotowywała je przez cały rok, bo chciała, żeby wszystko było dopięte na ostatni guzik."
    ru: "Тётя готовила её целый год, потому что хотела, чтобы всё было продумано до последней мелочи."
    words: { Ciocia: ciocia, rok: rok, chciała: chciec, wszystko: wszystko }
  - pl: "Cała rodzina wzięła udział w przygotowaniach, ale nie zawsze to pomagało."
    ru: "Вся семья приняла участие в подготовке, но это не всегда помогало."
    words: { rodzina: rodzina, wzięła: wziac, udział: udzial, zawsze: zawsze, pomagało: pomagac }
  - pl: "W piątek do kuchni weszły naraz trzy ciotki, dwie sąsiadki i babcia, a każda gotowała bigos po swojemu."
    ru: "В пятницу на кухню одновременно вошли три тётки, две соседки и бабушка, и каждая готовила бигос по-своему."
    words: { piątek: piatek, kuchni: kuchnia, trzy: trzy, babcia: babcia, gotowała: gotowac }
  - pl: "Tata zajrzał do kuchni, policzył je i powiedział: „Gdzie kucharek sześć, tam nie ma co jeść”."
    ru: "Папа заглянул на кухню, пересчитал их и сказал: «Где шесть кухарок, там нечего есть»."
    words: { Tata: tata, kuchni: kuchnia, powiedział: powiedziec, jeść: jesc }
  - pl: "Miał rację: bigos wyszedł tak słony, że trzeba było ugotować nowy."
    ru: "Он был прав: бигос получился таким солёным, что пришлось варить новый."
    words: { rację: racja, słony: slony }
  - pl: "Ciocia miała oczy dookoła głowy: liczyła krzesła, poprawiała obrusy i sprawdzała każdy talerz."
    ru: "Тётя следила за всем сразу: пересчитывала стулья, поправляла скатерти и проверяла каждую тарелку."
    words: { Ciocia: ciocia, oczy: oko, głowy: glowa, liczyła: liczyc, krzesła: krzeslo, talerz: talerz }
  - pl: "Ja miałam pełne ręce roboty, bo ciocia ciągle wysyłała mnie po kwiaty, po lód albo po wujka Zenka, który znowu gdzieś zniknął."
    ru: "А у меня было дел по горло, потому что тётя всё время посылала меня то за цветами, то за льдом, то за дядей Зенеком, который опять куда-то исчез."
    words: { ręce: reka, ciocia: ciocia, kwiaty: kwiat, wujka: wujek }
  - pl: "Wujek przez cały tydzień pisał przemówienie i ćwiczył je przed lustrem w łazience."
    ru: "Дядя целую неделю писал речь и репетировал её перед зеркалом в ванной."
    words: { Wujek: wujek, tydzień: tydzien, pisał: pisac, przemówienie: przemowienie, lustrem: lustro, łazience: lazienka }
  - pl: "W sobotę rano ciocia stwierdziła, że wszystko idzie idealnie."
    ru: "В субботу утром тётя заявила, что всё идёт идеально."
    words: { sobotę: sobota, rano: rano, ciocia: ciocia, wszystko: wszystko, idzie: isc }
  - pl: "– Nie chwal dnia przed zachodem słońca – mruknęła babcia, ale nikt jej nie słuchał."
    ru: "— Не хвали день до заката, — проворчала бабушка, но никто её не слушал."
