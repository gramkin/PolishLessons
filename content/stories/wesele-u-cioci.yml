  - pl: "Ślub w kościele poszedł jak po maśle, chociaż Kuba był tak zdenerwowany, że w połowie przysięgi zapomniał słów."
    ru: "Венчание в костёле прошло как по маслу, хотя Куба так волновался, что на середине клятвы забыл слова."
