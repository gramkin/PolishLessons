  - pl: "Cały namiot wybuchnął śmiechem i nawet ciocia w końcu się uśmiechnęła."
    ru: "Весь шатёр расхохотался, и даже тётя в конце концов улыбнулась."
    words: { ciocia: ciocia }
  - pl: "Kasia zwróciła uwagę, że na dolnym piętrze zostały ich imiona, a to przecież najważniejsze."
    ru: "Кася обратила внимание, что на нижнем ярусе остались их имена, а это ведь самое главное."
    words: { uwagę: uwaga, imiona: imie }
  - pl: "– Co się stało, to się nie odstanie – dodał wujek Zenek. – Jemy, póki jest co jeść!"
    ru: "— Что случилось, того не воротишь, — добавил дядя Зенек. — Едим, пока есть что есть!"
    words: { dodał: dodac, wujek: wujek, Jemy: jesc, jeść: jesc }
  - pl: "Mądry Polak po szkodzie: kelner od razu przykleił kabel taśmą do podłogi."
    ru: "Поляк умён после беды: официант тут же приклеил провод скотчем к полу."
    words: { kelner: kelner, podłogi: podloga }
  - pl: "Około północy zaczęły się oczepiny – stary obrzęd, podczas którego panna młoda zdejmuje welon."
    ru: "Около полуночи начались очепины — старинный обряд, во время которого невеста снимает фату."
