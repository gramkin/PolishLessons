  - pl: "Przed namiotem w ogrodzie cioci rodzice przywitali młodą parę chlebem i solą, jak każe tradycja."
    ru: "Перед шатром в саду у тёти родители встретили молодых хлебом и солью, как велит традиция."
    words: { cioci: ciocia, rodzice: rodzice, przywitali: przywitac, młodą: mlody, chlebem: chleb, solą: sol, tradycja: tradycja }
  - pl: "Ledwo goście usiedli przy stołach, a ktoś już zawołał: „Gorzko, gorzko!”."
    ru: "Едва гости сели за столы, как кто-то уже закричал: «Горько, горько!»"
    words: { goście: gosc, usiedli: usiasc, stołach: stol }
  - pl: "Młodzi wstali i musieli się pocałować, a cały namiot bił brawo."
    ru: "Молодые встали и должны были поцеловаться, а весь шатёр аплодировал."
