  - pl: "– Nie ma tego złego, co by na dobre nie wyszło – powiedziała spokojnie. – Dwa piętra zostały, a kalorii będzie mniej."
    ru: "— Нет худа без добра, — спокойно сказала она. — Два яруса остались, а калорий будет меньше."
