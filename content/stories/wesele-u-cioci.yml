  - pl: "Podobno ta, która go złapie, pierwsza wyjdzie za mąż."
    ru: "Говорят, та, кто её поймает, первой выйдет замуж."
    words: { złapie: zlapac, pierwsza: pierwszy, wyjdzie: wyjsc, mąż: maz }
  - pl: "Kuba rzucił kawalerom swoją muszkę, a złapał ją Bartek, syn sąsiadów, który od godziny tańczył z Olą."
    ru: "Куба бросил холостякам свою бабочку, а поймал её Бартек, сын соседей, который уже час танцевал с Олей."
    words: { rzucił: rzucic, kawalerom: kawaler, muszkę: muszka, złapał: zlapac, syn: syn, sąsiadów: sasiad, godziny: godzina, tańczył: tanczyc }
  - pl: "Ciocia spojrzała na nich znacząco i od razu zaczęła liczyć, ilu gości zmieści się w namiocie następnym razem."
    ru: "Тётя многозначительно посмотрела на них и сразу начала считать, сколько гостей поместится в шатре в следующий раз."
    words: { Ciocia: ciocia, spojrzała: spojrzec, zaczęła: zaczac, liczyć: liczyc, gości: gosc, następnym: nastepny }
  - pl: "W pewnej chwili zauważyłam, że wujka Zenka znowu nigdzie nie ma."
    ru: "В какой-то момент я заметила, что дяди Зенека опять нигде нет."
    words: { zauważyłam: zauwazyc, wujka: wujek }
  - pl: "Zastanawiałyśmy się z mamą, gdzie mógł się podziać, kiedy nagle stanął przy wejściu z akordeonem."
    ru: "Мы с мамой гадали, куда он мог деться, как вдруг он появился у входа с аккордеоном."
