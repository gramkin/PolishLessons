  - pl: "Miał je na końcu języka, a ksiądz szeptem mu podpowiedział."
    ru: "Они вертелись у него на языке, а ксёндз шёпотом ему подсказал."
    words: { języka: jezyk }
  - pl: "Po mszy goście złożyli młodej parze życzenia i wręczyli jej kwiaty i koperty."
    ru: "После мессы гости поздравили молодых и вручили им цветы и конверты."
