  - pl: "Zapadła cisza. Ciocia zbladła, a ja odniosłam wrażenie, że zaraz się rozpłacze."
    ru: "Повисла тишина. Тётя побледнела, и мне показалось, что она сейчас расплачется."
    words: { cisza: cisza, Ciocia: ciocia, odniosłam: odniesc, wrażenie: wrazenie }
  - pl: "Wtedy wstała babcia, która ma osiemdziesiąt lat i jest zdrowa jak ryba."
    ru: "Тогда встала бабушка, которой восемьдесят лет и которая здорова как бык."
