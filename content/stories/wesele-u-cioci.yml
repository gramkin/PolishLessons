  - pl: "– O wilku mowa! – zaśmiała się mama."
    ru: "— Лёгок на помине! — засмеялась мама."
    words: { wilku: wilk, mama: mama }
  - pl: "Wujek grał i śpiewał do białego rana i czuł się jak ryba w wodzie."
    ru: "Дядя играл и пел до самого утра и чувствовал себя как рыба в воде."
    words: { Wujek: wujek, grał: grac, śpiewał: spiewac, czuł: czuc, ryba: ryba }
  - pl: "Ja tańczyłam tak długo, że następnego dnia nie czułam nóg."
    ru: "А я танцевала так долго, что на следующий день не чувствовала ног."
    words: { tańczyłam: tanczyc, następnego: nastepny, dnia: dzien, nóg: noga }
  - pl: "W niedzielę były jeszcze poprawiny, ale o nich opowiem innym razem."
    ru: "В воскресенье были ещё поправины — второй день свадьбы, но о них я расскажу в другой раз."
    words: { niedzielę: niedziela }
  - pl: "Ciocia wyciągnęła wnioski z tego wesela i podjęła decyzję: na następnym tortem zajmie się sama."
    ru: "Тётя сделала выводы из этой свадьбы и приняла решение: на следующей она сама займётся тортом."
    words: { Ciocia: ciocia, wyciągnęła: wyciagnac, wnioski: wniosek, wesela: wesele, podjęła: podjac, decyzję: decyzja, następnym: nastepny }
  - pl: "Ola twierdzi, że z tym welonem to tylko przesąd, ale ciocia na wszelki wypadek już trzyma kciuki."
    ru: "Оля утверждает, что примета с фатой — просто суеверие, но тётя на всякий случай уже держит кулаки."
    words: { welonem: welon, tylko: tylko, ciocia: ciocia, trzyma: trzymac, kciuki: kciuk }
  - pl: "A Kasi i Kubie życzę jednego: żeby już nigdy nie żyli ze sobą jak pies z kotem."
    ru: "А Касе и Кубе я желаю одного: чтобы они больше никогда не жили как кошка с собакой."
    words: { życzę: zyczyc, pies: pies, kotem: kot }
questions:
  - type: choice
    q: Почему папа вспомнил пословицу «Gdzie kucharek sześć, tam nie ma co jeść»?
    options:
      - На кухне не хватало продуктов для бигоса
      - Шесть женщин одновременно готовили бигос, каждая по-своему
      - Тётя наняла шесть поваров из ресторана
      - Гости пришли раньше, чем был готов обед
    answer: 1
    explain: "«…weszły naraz trzy ciotki, dwie sąsiadki i babcia, a każda gotowała bigos po swojemu.» Три плюс две плюс бабушка — как раз шесть кухарок, и бигос пришлось варить заново."
  - type: choice
    q: Что случилось с Кубой во время венчания?
    options:
      - Он опоздал в костёл
      - Он потерял кольца
      - От волнения он забыл слова клятвы, и ксёндз ему подсказал
      - Он произнёс длинную речь
    answer: 2
    explain: "«…był tak zdenerwowany, że w połowie przysięgi zapomniał słów. Miał je na końcu języka, a ksiądz szeptem mu podpowiedział.» Mieć coś na końcu języka — «вертеться на языке»."
  - type: choice
    q: Что дядя Зенек рассказал в своей речи о детстве Каси и Кубы?
    options:
      - Что они в школе ссорились и жили как кошка с собакой
      - Что они были лучшими друзьями с первого класса
      - Что они познакомились только на свадьбе соседей
      - Что Кася помогала Кубе с уроками
    answer: 0
    explain: "«…przypomniał wszystkim, że w podstawówce żyli ze sobą jak pies z kotem.» Польская идиома — «как собака с котом»."
  - type: choice
    q: Почему упал торт?
    options:
      - Его уронила тётя Халина
      - Официант споткнулся о провод от колонок
      - Его толкнул танцующий дядя
      - Он растаял на солнце
    answer: 1
    explain: "«Kiedy kelner wnosił go do namiotu, potknął się o kabel od głośników.» Потом, «mądry Polak po szkodzie», провод приклеили к полу."
  - type: choice
    q: Как бабушка отнеслась к случаю с тортом?
    options:
      - Она расплакалась
      - Она отругала официанта
      - Она пошла печь новый торт
      - "Она сказала, что нет худа без добра: два яруса остались, а калорий будет меньше"
    answer: 3
    explain: "«Nie ma tego złego, co by na dobre nie wyszło… Dwa piętra zostały, a kalorii będzie mniej.» Расплакаться собиралась тётя, а не бабушка."
  - type: choice
    q: Кто поймал фату на очепинах?
    options:
      - Младшая сестра рассказчицы Оля
      - Сама рассказчица
      - Тётя Халина
      - Бартек, сын соседей
    answer: 0
    explain: "«Kasia rzuciła welon za siebie… a złapała go moja młodsza siostra Ola.» Бартек поймал не фату, а бабочку жениха (muszkę)."
  - type: listen
    text: "Przemówienie trwało dwadzieścia minut, ale nikt nie miał serca mu przerwać."
    explain: "Nie mieć serca czegoś zrobić — «не хватает духу», «рука не поднимается»."
