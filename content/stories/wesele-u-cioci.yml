  - pl: "Potem zaśpiewaliśmy im „Sto lat” i zaczęły się toasty."
    ru: "Потом мы спели им «Сто лят», и начались тосты."
    words: { toasty: toast }
  - pl: "Pierwszy wstał wujek Zenek, postukał widelcem w kieliszek i zaczął swoje przemówienie."
    ru: "Первым встал дядя Зенек, постучал вилкой по рюмке и начал свою речь."
    words: { Pierwszy: pierwszy, wstał: wstac, wujek: wujek, widelcem: widelec, kieliszek: kieliszek, zaczął: zaczac, przemówienie: przemowienie }
  - pl: "Mówił prosto z mostu, jak to on: – Kasiu, Kuba ma głowę na karku, a ty masz serce na dłoni, więc będzie wam dobrze."
    ru: "Говорил он, как всегда, без обиняков: — Кася, у Кубы голова на плечах, а у тебя доброе сердце, так что вам будет хорошо."
    words: { Mówił: mowic, mostu: most, głowę: glowa, karku: kark, serce: serce }
  - pl: "Potem przypomniał wszystkim, że w podstawówce żyli ze sobą jak pies z kotem."
    ru: "Потом он напомнил всем, что в начальной школе они жили как кошка с собакой."
    words: { przypomniał: przypomniec, pies: pies, kotem: kot }
  - pl: "Kuba ciągnął Kasię za warkocze, a ona przez trzy lata nie chciała z nim rozmawiać."
    ru: "Куба дёргал Касю за косы, а она три года не хотела с ним разговаривать."
    words: { trzy: trzy, chciała: chciec, rozmawiać: rozmawiac }
  - pl: "– A potem stracił dla niej głowę i, jak widać, opłaciło się! – zakończył wujek, a goście śmiali się do łez."
    ru: "— А потом потерял от неё голову и, как видите, не прогадал! — закончил дядя, и гости смеялись до слёз."
    words: { stracił: stracic, głowę: glowa, wujek: wujek, goście: gosc, śmiali: smiac, łez: lza }
  - pl: "Przemówienie trwało dwadzieścia minut, ale nikt nie miał serca mu przerwać."
    ru: "Речь длилась двадцать минут, но ни у кого не хватило духу его прервать."
    words: { Przemówienie: przemowienie, dwadzieścia: dwadziescia, minut: minuta, serca: serce }
  - pl: "Najwięcej emocji wzbudził jednak tort."
    ru: "Но больше всего эмоций вызвал торт."
    words: { tort: tort }
  - pl: "Był trzypiętrowy, biały, z kwiatami z cukru, a ciocia zamówiła go w najlepszej cukierni w okolicy."
    ru: "Он был трёхъярусный, белый, с цветами из сахара, и тётя заказала его в лучшей кондитерской в округе."
    words: { biały: bialy, kwiatami: kwiat, cukru: cukier, ciocia: ciocia, zamówiła: zamowic, okolicy: okolica }
  - pl: "Kiedy kelner wnosił go do namiotu, potknął się o kabel od głośników."
    ru: "Когда официант вносил его в шатёр, он споткнулся о провод от колонок."
