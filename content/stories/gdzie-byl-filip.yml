questions:
  - type: choice
    q: Почему Аня испугалась?
    options: ["Филип утром не вернулся домой.", "Филип съел её рыбу.", "Марек не вернулся с работы."]
    answer: 0
    explain: "«Filip zawsze wracał do domu rano. Ale wczoraj nie wrócił.» Обычно возвращался (wracał), а вчера не вернулся (wrócił)."
  - type: choice
    q: Что пани Новак слышала ночью?
    options: ["Под окном мяукал кот.", "Кто-то стучал в дверь.", "Лаяла собака."]
    answer: 0
    explain: "«Ale w nocy pod oknem miauczał kot.» miauczeć — «мяукать»; прошедшее время мужского рода: miauczał."
  - type: choice
    q: Как Филип вернулся домой?
    options: ["Ночью мяукнул под окном.", "Утром его принёс Марек.", "Его привела пани Новак."]
    answer: 0
    explain: "«Nagle pod oknem ktoś powiedział: „Miau!”» — и это был Филип."
  - type: choice
    q: Что поняла Аня в конце?
    options: ["Ночью под окном у пани Новак мяукал Филип.", "Пани Новак прятала кота у себя.", "Филип был у Марека на работе."]
    answer: 0
    explain: "«A Ania już wiedziała, kto miauczał pod oknem pani Nowak.» Кот, который мяукал у соседки, — это Филип."
  - type: choice
    q: "Марек спрашивает сестру: «Gdzie go ___?»"
    options: [szukałaś, szukałeś, szukała]
    answer: 0
    explain: "Марек говорит с сестрой на «ты», а она женщина: -łaś. szukałeś — так спрашивают мужчину, szukała — «она искала»."
  - type: listen
    text: W nocy Ania nie mogła spać.
    explain: "mogła — прошедшее от móc, женский род: ó в основе меняется на o (mógł, но mogła)."
  - type: translate
    q: Я (ж.) искала кота.
    answer: ["Szukałam kota.", "Ja szukałam kota."]
    explain: "Женщина о себе — -łam. szukać требует родительного: kota (у одушевлённых он совпадает с винительным)."
  - type: translate
    q: Вчера кот не вернулся домой.
    answer: ["Wczoraj kot nie wrócił do domu.", "Kot wczoraj nie wrócił do domu.", "Kot nie wrócił wczoraj do domu."]
    explain: "«Домой» — do domu, родительный после do. Не вернулся один раз — совершенный вид wrócił."
