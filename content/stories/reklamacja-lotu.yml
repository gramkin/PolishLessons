# review
title: Reklamacja lotu
titleRu: Жалоба на отменённый рейс
level: B2
chapter: 32
description: "Пассажирка, опоздавшая из-за отменённого рейса на свадьбу сестры, пишет авиакомпании жалобу, а та отвечает официальным письмом; книжные предлоги w związku z, ze względu na, w wyniku, na skutek, wobec, w celu, w ramach и управление domagać się czegoś, zwracać się z prośbą o, dziękować za."
sentences:
  - pl: Pani Katarzyna Malinowska mieszka w Krakowie, a jej młodsza siostra od kilku lat pracuje w Lizbonie.
