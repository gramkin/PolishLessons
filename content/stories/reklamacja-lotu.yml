questions:
  - type: choice
    q: Почему пани Катажина не попала на свадьбу сестры?
    options:
      - Она перепутала дату свадьбы
      - Её рейс отменили, а место в следующем самолёте она получила только на субботу на 14 часов
      - Она опоздала на самолёт из-за пробок
      - Свадьбу перенесли на другой день
    answer: 1
    explain: "«Miejsce w następnym samolocie do Lizbony dostałam dopiero na sobotę na godzinę czternastą.» А свадьба была «w sobotę o jedenastej»."
  - type: choice
    q: Где пани Катажина провела ночь после отмены рейса?
    options:
      - В зале вылета
      - В гостинице, которую оплатила авиакомпания
      - Дома в Кракове
      - В гостинице возле аэропорта, за свой счёт
    answer: 3
    explain: "«W związku z tym musiałam na własny koszt zarezerwować pokój w hotelu przy lotnisku.» Na własny koszt — «за свой счёт»."
  - type: choice
    q: Чего пани Катажина требует в письме?
    options:
      - Возмещения расходов на ночлег и компенсации за отменённый рейс
      - Бесплатного билета для всей семьи
      - Увольнения сотрудника у выхода на посадку
      - Только извинений
    answer: 0
    explain: "«Wobec powyższego domagam się zwrotu kosztów noclegu oraz odszkodowania za odwołany lot.» Domagać się требует родительного: zwrotu, odszkodowania."
  - type: choice
    q: Почему, по словам авиакомпании, рейс был отменён?
    options:
      - Из-за тумана
      - Из-за забастовки экипажа
      - Из-за неисправности гидравлической системы, обнаруженной перед взлётом
      - Из-за нехватки пассажиров
    answer: 2
    explain: "«…lot odwołano na skutek usterki układu hydraulicznego, wykrytej podczas przeglądu przed startem.» Na skutek + родительный — «вследствие»."
  - type: choice
    q: При каком условии авиакомпания вернёт деньги за гостиницу?
    options:
      - Если пани Катажина откажется от ваучера
      - После того как она пришлёт счёт из гостиницы и номер банковского счёта
      - После завершения служебной проверки
      - Деньги за гостиницу не вернут
    answer: 1
    explain: "«Zwrot kosztów noclegu będzie możliwy po otrzymaniu od Pani rachunku z hotelu oraz numeru konta bankowego.» Rachunek и konto — оба по-русски «счёт»."
  - type: choice
    q: Как пани Катажина воспользовалась ваучером?
    options:
      - Подарила его сестре
      - "Не воспользовалась: срок истёк"
      - Слетала в октябре в Лиссабон посмотреть с сестрой свадебные фотографии
      - Полетела в отпуск в Варшаву
    answer: 2
    explain: "«Z vouchera skorzystała w październiku i poleciała do Lizbony, żeby obejrzeć z siostrą zdjęcia ze ślubu.» Skorzystać z + родительный: z vouchera."
  - type: listen
    text: "W wyniku odwołania lotu nie zdążyłam na ślub mojej jedynej siostry."
    explain: "W wyniku + родительный — «в результате»: w wyniku odwołania. Zdążyć na coś — «успеть на что-то»."
