  - pl: Brakujące osiem milionów zostanie pokryte z kredytu, który gmina zamierza spłacić w ciągu dziesięciu lat.
    ru: Недостающие восемь миллионов будут покрыты за счёт кредита, который гмина намерена погасить в течение десяти лет.
