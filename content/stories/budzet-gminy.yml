# review
title: Budżet Lipowca na przyszły rok
titleRu: Бюджет Липовца на будущий год
level: B2
chapter: 30
description: "Заметка местной газеты о бюджете вымышленного городка: миллионы злотых, проценты, дроби, даты и собирательные числительные во всех падежах, а ещё газетный пассив и безличные формы на -no/-to."
sentences:
  - pl: Rada Miejska Lipowca przyjęła we wtorek, ósmego grudnia, budżet miasta na dwa tysiące dwudziesty siódmy rok.
    ru: Городской совет Липовца во вторник, восьмого декабря, принял бюджет города на две тысячи двадцать седьмой год.
    words: { Rada: rada, przyjęła: przyjac, grudnia: grudzien, budżet: budzet, miasta: miasto, rok: rok }
  - pl: Za uchwałą głosowało piętnastu radnych, przeciw było czterech, a dwóch wstrzymało się od głosu.
    ru: За постановление проголосовали пятнадцать советников, против были четверо, а двое воздержались.
    words: { uchwałą: uchwala, głosowało: glosowac, piętnastu: pietnascie, radnych: radny, czterech: cztery, dwóch: dwa, głosu: glos }
  - pl: Dochody miasta zaplanowano na poziomie stu osiemdziesięciu czterech milionów złotych, a wydatki – na poziomie stu dziewięćdziesięciu dwóch milionów.
    ru: Доходы города запланированы на уровне ста восьмидесяти четырёх миллионов злотых, а расходы — на уровне ста девяноста двух миллионов.
