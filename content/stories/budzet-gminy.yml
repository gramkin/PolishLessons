  - pl: Część radnych opozycji uważa, że to o wiele za dużo jak na miasto liczące niespełna czterdzieści tysięcy mieszkańców.
    ru: Часть оппозиционных советников считает, что это слишком много для города, в котором неполных сорок тысяч жителей.
    words: { Część: czesc-noun, radnych: radny, miasto: miasto, tysięcy: tysiac, mieszkańców: mieszkaniec }
  - pl: – Za te pieniądze można by wyremontować wszystkie drogi gminne – mówił podczas sesji radny Marek Kowal.
    ru: — На эти деньги можно было бы отремонтировать все муниципальные дороги, — говорил во время сессии советник Марек Коваль.
