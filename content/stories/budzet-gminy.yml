  - pl: Pierwsi lokatorzy mają odebrać klucze w drugiej połowie dwa tysiące dwudziestego ósmego roku.
    ru: Первые жильцы должны получить ключи во второй половине две тысячи двадцать восьмого года.
    words: { Pierwsi: pierwszy, klucze: klucz, drugiej: drugi, połowie: polowa, roku: rok }
  - pl: Koszt inwestycji oszacowano na trzydzieści sześć milionów złotych.
