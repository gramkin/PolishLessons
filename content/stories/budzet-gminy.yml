  - pl: Drugie miejsce zajęło nocne oświetlenie ścieżki rowerowej, a trzecie – zakup książek dla trzech bibliotek osiedlowych.
    ru: Второе место заняло ночное освещение велодорожки, а третье — закупка книг для трёх районных библиотек.
