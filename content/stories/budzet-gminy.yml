  - pl: Teraz uchwałę sprawdzą jeszcze urzędnicy wojewódzcy, co zajmie im około miesiąca.
    ru: Теперь постановление ещё проверят чиновники воеводства, что займёт у них около месяца.
    words: { uchwałę: uchwala, urzędnicy: urzednik, miesiąca: miesiac }
