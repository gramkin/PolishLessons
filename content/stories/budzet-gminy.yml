  - pl: Burmistrz Agnieszka Lis odpowiedziała, że w kolejce po mieszkanie komunalne czeka obecnie ponad trzysta rodzin.
    ru: Бургомистр Агнешка Лис ответила, что в очереди на муниципальную квартиру сейчас стоят более трёхсот семей.
