  - pl: Jak dodała, z trzystu dwudziestu wniosków złożonych w ubiegłym roku pozytywnie rozpatrzono zaledwie czternaście.
    ru: Как она добавила, из трёхсот двадцати заявлений, поданных в прошлом году, положительно рассмотрено лишь четырнадцать.
