    words: { budżecie: budzet, roku: rok, oświata: oswiata }
  - pl: Na utrzymanie sześciu szkół podstawowych i dwóch przedszkoli przeznaczono ponad pięćdziesiąt jeden milionów złotych, czyli ponad jedną czwartą wszystkich wydatków.
