  - pl: Na działce po dawnej cukrowni ma powstać sto dwadzieścia mieszkań na wynajem, z czego trzydzieści trafi do młodych rodzin.
    ru: На участке бывшего сахарного завода должны появиться сто двадцать квартир для сдачи в аренду, из которых тридцать достанутся молодым семьям.
