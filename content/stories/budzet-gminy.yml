    words: { sześciu: szesc, szkół: szkola, dwóch: dwa, przedszkoli: przedszkole, przeznaczono: przeznaczyc, milionów: milion, złotych: zloty, wydatków: wydatek }
  - pl: W jednej z tych szkół, przy ulicy Słonecznej, zostanie wymieniony dach i wyremontowana sala gimnastyczna.
