    words: { budżetu: budzet, opublikowano: opublikowac, stronie: strona, urzędu: urzad, gazety: gazeta }
questions:
  - type: choice
    q: Как проголосовали городские советники за бюджет?
    options:
      - Единогласно
      - Пятнадцать «за», четверо «против», двое воздержались
      - Четверо «за», пятнадцать «против»
      - Голосование перенесли на январь
    answer: 1
    explain: "«Za uchwałą głosowało piętnastu radnych, przeciw było czterech, a dwóch wstrzymało się od głosu.» Piętnastu radnych — мужско-личная форма с родительным, поэтому глагол в среднем роде: głosowało."
  - type: choice
    q: Как город покроет разницу между доходами и расходами?
    options:
      - Повысит налог на недвижимость
      - Продаст участок бывшего сахарного завода
      - Возьмёт кредит, который погасит за десять лет
      - Сократит расходы на школы
    answer: 2
    explain: "«Brakujące osiem milionów zostanie pokryte z kredytu, który gmina zamierza spłacić w ciągu dziesięciu lat.» W ciągu dziesięciu lat — числительное в родительном после w ciągu."
