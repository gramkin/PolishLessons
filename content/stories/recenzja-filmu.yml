  - pl: "Skoro potrafiła tak wiele powiedzieć o rodzinie za pomocą milczenia, z ciekawością czekam na jej następny film."
    ru: "Раз она сумела так много сказать о семье с помощью молчания, я с интересом жду её следующего фильма."
