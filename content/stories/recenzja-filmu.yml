  - pl: "Wystarczy powiedzieć, że każdy z gości przywozi ze sobą jakiś sekret, a stary dom nad jeziorem z trudem je wszystkie pomieści."
    ru: "Достаточно сказать, что каждый из гостей привозит с собой какую-то тайну, и старый дом у озера с трудом вмещает их все."
