  - pl: "Scena, w której Halina sama zmywa naczynia po kolacji, choć wszyscy proponują jej pomoc, należy do najbardziej wzruszających w tym roku."
    ru: "Сцена, в которой Халина сама моет посуду после ужина, хотя все предлагают ей помощь, — одна из самых трогательных в этом году."
    words: { Scena: scena, kolacji: kolacja, choć: choc, wzruszających: wzruszajacy, roku: rok }
  - pl: "Kinga Wolska jako Ola gra natomiast zupełnie inaczej: głośno, nerwowo, czasem wręcz przesadnie."
