  - pl: "Ola mówi dużo, ponieważ boi się ciszy, w której musiałaby odpowiedzieć na pytanie, dlaczego tak długo nie przyjeżdżała."
    ru: "Оля много говорит, потому что боится тишины, в которой ей пришлось бы ответить на вопрос, почему она так долго не приезжала."
    words: { mówi: mowic, ponieważ: poniewaz, boi: bac, ciszy: cisza, odpowiedzieć: odpowiedziec, pytanie: pytanie, długo: dlugo }
  - pl: "Najtrudniejsze zadanie miał jednak Paweł Sosnowski, który gra Kubę."
    ru: "Самая трудная задача, однако, досталась Павлу Сосновскому, который играет Кубу."
