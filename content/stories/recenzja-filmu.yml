  - pl: "Skoro mowa o dźwięku, warto docenić także ciszę: w kilku scenach słychać tylko wiatr i krople deszczu na szybie."
    ru: "Раз уж речь зашла о звуке, стоит оценить и тишину: в нескольких сценах слышны только ветер и капли дождя на стекле."
