  - pl: "„Wszyscy przy stole” to film mądry i uczciwy, który nie udaje, że rodzinne rany goją się przy jednym obiedzie."
    ru: "«Все за столом» — фильм умный и честный, который не делает вид, будто семейные раны заживают за одним обедом."
