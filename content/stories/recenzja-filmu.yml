  - pl: "Jednak pod powierzchnią każdej sceny narasta napięcie, które widz wyczuwa, zanim bohaterowie odważą się cokolwiek powiedzieć."
    ru: "Однако под поверхностью каждой сцены нарастает напряжение, которое зритель чувствует раньше, чем герои решатся что-либо сказать."
    words: { Jednak: jednak, sceny: scena, napięcie: napiecie, widz: widz, bohaterowie: bohater, powiedzieć: powiedziec }
  - pl: "Najmocniejszym punktem filmu jest bez wątpienia aktorstwo."
