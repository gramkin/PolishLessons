  - pl: "Kompozytor Adam Kret zrezygnował z wielkiej orkiestry i postawił na fortepian, wiolonczelę i dźwięki natury."
    ru: "Композитор Адам Крет отказался от большого оркестра и сделал ставку на фортепиано, виолончель и звуки природы."
