  - pl: "Rozmowy przy obiedzie, spacer nad jezioro, wspólne oglądanie starych zdjęć – na pozór nic się nie dzieje."
    ru: "Разговоры за обедом, прогулка к озеру, совместный просмотр старых фотографий — на первый взгляд ничего не происходит."
