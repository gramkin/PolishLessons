  - pl: "To o tyle dziwne, że w kilku scenach nastoletnia córka Marka zapowiada się na bardzo ciekawą postać."
    ru: "Это тем более странно, что в нескольких сценах дочь-подросток Марека обещает стать очень интересным персонажем."
