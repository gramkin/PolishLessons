  - pl: "Środkowa część, w której Marek kłóci się z żoną o pieniądze, niewiele wnosi do historii, natomiast skutecznie spowalnia akcję."
    ru: "Средняя часть, в которой Марек ссорится с женой из-за денег, мало что добавляет к истории, а вот действие она успешно замедляет."
