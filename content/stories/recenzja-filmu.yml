    words: { drugie: drugi, przewidywalny: przewidywalny }
  - pl: "Choć nie zdradzę, jak kończy się rodzinny weekend, uważny widz domyśli się tego mniej więcej w połowie filmu."
    ru: "Хотя я не раскрою, чем заканчиваются семейные выходные, внимательный зритель догадается об этом примерно на середине фильма."
