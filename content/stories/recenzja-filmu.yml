# review
title: "Recenzja: Wszyscy przy stole"
titleRu: "Рецензия: «Все за столом»"
level: B2
chapter: 33
description: "Журнальная рецензия на вымышленный польский фильм о семейной встрече: сюжет без спойлеров, игра актёров, музыка, недостатки и вердикт; лексика оценки (przekonujący, przewidywalny, wzruszający, rozczarować) и связки mimo że, choć, jednak, ponieważ, skoro, natomiast."
sentences:
  - pl: "Wszyscy przy stole. Reżyseria i scenariusz: Agnieszka Rudnicka. Występują: Barbara Lisowska, Kinga Wolska, Paweł Sosnowski, Tomasz Bielecki."
    ru: "«Все за столом». Режиссёр и автор сценария — Агнешка Рудницкая. В ролях: Барбара Лисовская, Кинга Вольская, Павел Сосновский, Томаш Белецкий."
    words: { scenariusz: scenariusz }
  - pl: "Czas trwania: 128 minut."
    ru: "Продолжительность: 128 минут."
    words: { Czas: czas, minut: minuta }
  - pl: "„Wszyscy przy stole” to drugi film fabularny Agnieszki Rudnickiej i, mimo że nie jest pozbawiony wad, należy do najciekawszych polskich premier tej jesieni."
    ru: "«Все за столом» — второй художественный фильм Агнешки Рудницкой, и, несмотря на то что он не лишён недостатков, это одна из самых интересных польских премьер этой осени."
    words: { drugi: drugi, film: film, mimo: mimo, najciekawszych: ciekawy, polskich: polski, jesieni: jesien }
  - pl: "Rudnicka zadebiutowała pięć lat temu kameralnym dramatem o dwóch siostrach, który zebrał dobre recenzje, choć widzów miał niewielu."
    ru: "Рудницкая дебютировала пять лет назад камерной драмой о двух сёстрах, которая собрала хорошие рецензии, хотя зрителей у неё было немного."
    words: { pięć: piec, siostrach: siostra, dobre: dobry, recenzje: recenzja, choć: choc, widzów: widz }
  - pl: "Tym razem reżyserka sięga po temat, który zna chyba każdy z nas: rodzinny zjazd po latach."
    ru: "На этот раз режиссёр берётся за тему, которая знакома, пожалуй, каждому из нас: семейная встреча спустя годы."
    words: { reżyserka: rezyserka, temat: temat }
  - pl: "Halina, emerytowana nauczycielka z małego miasteczka na Mazurach, kończy siedemdziesiąt lat."
    ru: "Халине, учительнице на пенсии из маленького городка на Мазурах, исполняется семьдесят лет."
    words: { nauczycielka: nauczycielka }
  - pl: "Z tej okazji zaprasza do domu troje dorosłych dzieci, które od dawna nie siedziały razem przy jednym stole."
    ru: "По этому случаю она приглашает домой троих взрослых детей, которые давно не сидели вместе за одним столом."
    words: { okazji: okazja, domu: dom, troje: troje, dzieci: dziecko, siedziały: siedziec, razem: razem, przy: przy, stole: stol }
  - pl: "Najstarszy, Marek, przyjeżdża z Warszawy z żoną i dwójką nastolatków."
    ru: "Старший, Марек, приезжает из Варшавы с женой и двумя подростками."
    words: { żoną: zona, dwójką: dwojka }
  - pl: "Średnia, Ola, wraca z Irlandii po raz pierwszy od ośmiu lat."
