  - pl: "Komu go polecam? Każdemu, kto choć raz siedział przy świątecznym stole i liczył minuty do końca kolacji."
    ru: "Кому я его рекомендую? Каждому, кто хоть раз сидел за праздничным столом и считал минуты до конца ужина."
    words: { polecam: polecac, choć: choc, siedział: siedziec, stole: stol, liczył: liczyc, minuty: minuta, kolacji: kolacja }
  - pl: "Warto jednak zabrać ze sobą chusteczki, ponieważ trudno wyjść z kina z suchymi oczami."
    ru: "Стоит, однако, взять с собой носовые платки, потому что трудно выйти из кинотеатра с сухими глазами."
    words: { Warto: warto, jednak: jednak, ponieważ: poniewaz, wyjść: wyjsc, kina: kino, oczami: oko }
  - pl: "Ocena: cztery na sześć."
    ru: "Оценка: четыре из шести."
    words: { Ocena: ocena, cztery: cztery, sześć: szesc }
questions:
  - type: choice
    q: По какому случаю Халина собирает семью?
    options:
      - Ей исполняется семьдесят лет
      - Она продаёт старый дом у озера
      - Её дочь возвращается из Ирландии насовсем
      - Наступает Рождество
    answer: 0
    explain: "«Halina… kończy siedemdziesiąt lat. Z tej okazji zaprasza do domu troje dorosłych dzieci.» Kończyć … lat — «исполняется … лет»; troje dzieci — собирательное числительное."
  - type: choice
    q: Почему рецензент не рассказывает о сюжете подробнее?
    options:
      - Он не досмотрел фильм до конца
      - Главная сила фильма — недосказанность
      - Сюжет слишком запутанный
      - Режиссёр попросила не раскрывать сюжет
    answer: 1
    explain: "«Więcej o fabule nie zdradzę, ponieważ największą siłą filmu są właśnie niedopowiedzenia.» Ponieważ вводит причину: «потому что, поскольку»."
  - type: choice
    q: Как рецензент в итоге оценивает громкую, нервную игру Кинги Вольской?
    options:
      - Считает её главной ошибкой фильма
      - Не замечает разницы с другими актёрами
      - Сначала она его раздражала, но потом он понял, что это сознательный выбор
      - Хвалит её за сдержанность
    answer: 2
    explain: "«Na początku ta przesada mnie drażniła, ale z czasem zrozumiałem, że to świadomy wybór.» Ola говорит много, ponieważ boi się ciszy."
  - type: choice
    q: Чего НЕТ среди недостатков, которые называет рецензент?
    options:
      - Фильм слишком длинный
      - Финал предсказуем
      - Второстепенные персонажи плохо проработаны
      - Музыка звучит слишком часто и громко
    answer: 3
    explain: "Наоборот: «Muzyka pojawia się rzadko, za to zawsze w odpowiednim momencie.» Недостатки названы так: trwa za długo, finał jest zbyt przewidywalny, nie wszystkie postacie są równie dopracowane."
  - type: choice
    q: Кого может разочаровать конец фильма?
    options:
      - Тех, кто рассчитывал на более смелую концовку
      - Тех, кто не любит грустные фильмы
      - Поклонников первого фильма Рудницкой
      - Тех, кто ждал комедию
    answer: 0
    explain: "«Ostatnie dziesięć minut może więc rozczarować tych, którzy liczyli na odważniejsze zakończenie.» Rozczarować — «разочаровать»; liczyć na + вин. — «рассчитывать на»."
  - type: choice
    q: Почему рецензент с интересом ждёт следующего фильма Рудницкой?
    options:
