    words: { wraca: wracac, pierwszy: pierwszy, ośmiu: osiem }
  - pl: "Najmłodszy, Kuba, w ogóle nie odpowiedział na zaproszenie, a mimo to pewnego wieczoru staje w drzwiach."
    ru: "Младший, Куба, вообще не ответил на приглашение, и тем не менее однажды вечером появляется на пороге."
