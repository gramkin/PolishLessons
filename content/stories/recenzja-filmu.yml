  - pl: "Temat grany na wiolonczeli wraca kilka razy i za każdym razem brzmi trochę inaczej, jakby dojrzewał razem z bohaterami."
    ru: "Тема, которую играет виолончель, возвращается несколько раз и каждый раз звучит немного иначе, словно взрослеет вместе с героями."
