  - pl: "– Zasady są proste: każda ze stron ma pięć minut na przedstawienie swoich argumentów, a potem dwie minuty na odpowiedź."
    ru: "— Правила простые: у каждой из сторон пять минут на изложение своих доводов, а потом две минуты на ответ."
