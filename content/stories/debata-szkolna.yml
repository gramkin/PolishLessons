questions:
  - type: choice
    q: Какой, по словам Зузанны, стала тишина в школьных коридорах?
    options:
      - Тишиной библиотеки, потому что ученики читают на переменах
      - Тишиной людей, которые листают экран
      - Тишиной, которую требуют учителя
      - Тишиной пустых коридоров, потому что все уходят во двор
    answer: 1
    explain: "«…to nie jest cisza biblioteki, tylko cisza ludzi, którzy przewijają ekran.» Nie…, tylko… — «не…, а…»."
  - type: choice
    q: Какой довод противника Зузанна предугадала и сразу опровергла?
    options:
      - Что телефон нужен на уроках как словарь
      - Что запреты в школе не работают
      - Что телефон нужен на случай опасности
      - Что правила должны устанавливать сами ученики
    answer: 2
    explain: "«Wiem, co za chwilę usłyszę: że telefon jest potrzebny w razie niebezpieczeństwa.» Её ответ: в секретариате тоже есть телефон."
  - type: choice
    q: Чем, по словам Кацпера, телефон служит на уроках?
    options:
      - На уроках языков в нём проверяют слова, а на физике снимают опыты
      - На нём пишут контрольные работы
      - По нему учителя рассылают домашние задания
      - Им пользуются только на переменах
    answer: 0
    explain: "«Na lekcjach języków sprawdzamy w nim słowa, a na fizyce nagrywamy doświadczenia.» Doświadczenie здесь — «опыт, эксперимент», а не «жизненный опыт»."
  - type: choice
    q: Почему, по мнению Кацпера, нынешние школьные правила не работают?
    options:
      - Потому что их никто не знает
      - Потому что учителя сами их нарушают
      - Потому что они слишком мягкие
      - Потому что их установили без учеников и никто не спросил их мнения
    answer: 3
    explain: "«Ale te zasady ktoś ustalił za nas i nikt nie zapytał nas o zdanie.» Zapytać kogoś o zdanie — спросить чьё-то мнение: zdanie здесь «мнение», а не «предложение»."
  - type: choice
    q: Как пани Коваль пересказала предложение Кацпера?
    options:
      - «Он предложил оставить всё как есть»
      - «Он предложил, чтобы мы вместе установили новые правила»
      - «Он предложил провести голосование сразу»
      - «Он предложил разрешить телефоны на уроках»
    answer: 1
    explain: "«Zaproponował też, żebyśmy wspólnie ustalili nowe zasady.» После zaproponować просьба и предложение передаются через żeby + прошедшее время: żebyśmy ustalili."
  - type: choice
    q: Что хотел сказать Кацпер, ответив «nie wylewajmy dziecka z kąpielą»?
    options:
      - Что вместе с плохим не нужно выбрасывать и полезное
      - Что спор слишком затянулся
      - Что младших учеников нужно защищать от телефонов
      - Что решать нужно быстро, пока не поздно
    answer: 0
    explain: "Wylać dziecko z kąpielą — как русское «выплеснуть ребёнка вместе с водой»: «Telefon to narzędzie, a z narzędziem trzeba się nauczyć obchodzić.» А «пока не поздно» — это довод Зузанны: «Lepiej zapobiegać niż leczyć»."
  - type: listen
    text: "Telefon to narzędzie, a z narzędziem trzeba się nauczyć obchodzić."
    explain: "Obchodzić się z czymś — обращаться с чем-то. Одно się служит обоим глаголам — nauczyć się и obchodzić się — и стоит рядом с trzeba."
