# review
title: Debata szkolna
titleRu: Школьные дебаты
level: B2
chapter: 36
description: "Старшеклассники спорят о запрете телефонов в школе: учительница ведёт дебаты по всем правилам, каждая сторона приводит доводы и отвечает оппоненту, ведущая пересказывает обе позиции косвенной речью, а в конце спорщики отвечают друг другу пословицей и идиомой."
sentences:
  - pl: W piątek po lekcjach w auli liceum odbyła się debata, na którą przyszła prawie cała szkoła.
    ru: В пятницу после уроков в актовом зале лицея прошли дебаты, на которые пришла почти вся школа.
    words: { piątek: piatek, lekcjach: lekcja, debata: debata, przyszła: przyjsc, szkoła: szkola }
  - pl: "Tematem było pytanie, które od miesięcy dzieliło uczniów, nauczycieli i rodziców: czy w szkole należy zakazać telefonów komórkowych?"
    ru: "Темой был вопрос, который уже несколько месяцев разделял учеников, учителей и родителей: нужно ли запретить в школе мобильные телефоны?"
    words: { pytanie: pytanie, miesięcy: miesiac, uczniów: uczen, nauczycieli: nauczyciel, szkole: szkola, zakazać: zakazac, telefonów: telefon }
  - pl: Debatę prowadziła pani Barbara Kowal, nauczycielka historii i wychowawczyni klasy maturalnej.
