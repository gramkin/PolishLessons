# review
title: Kto jest lepszy?
titleRu: Кто лучше?
level: A2
chapter: 16
description: "Две сестры спорят, у кого всё лучше, а бабушка находит ответ. Степени сравнения: nowszy, ładniejszy, najszybsza, неправильные lepszy и więcej, сравнение с niż и od, bardziej."
sentences:
  - pl: Ola i Zosia są siostrami.
    ru: Оля и Зося — сёстры.
    words: { są: byc, siostrami: siostra }
  - pl: Ola ma dziesięć lat, a Zosia osiem.
    ru: Оле десять лет, а Зосе восемь.
    words: { ma: miec, dziesięć: dziesiec, lat: rok, osiem: osiem }
  - pl: Ola jest starsza i wyższa od Zosi.
    ru: Оля старше и выше Зоси.
    words: { jest: byc, starsza: stary, wyższa: wysoki }
  - pl: Ola bardziej lubi biegać niż czytać, a Zosia woli książki.
    ru: Оля больше любит бегать, чем читать, а Зося предпочитает книги.
    words: { bardziej: bardziej, lubi: lubic, biegać: biegac, niż: niz, czytać: czytac, woli: wolec, książki: ksiazka }
  - pl: Ola lubi mówić, że jest we wszystkim lepsza.
    ru: Оля любит говорить, что она во всём лучше.
    words: { lubi: lubic, mówić: mowic, jest: byc, wszystkim: wszystko, lepsza: dobry }
  - pl: "– Mój rower jest nowszy niż twój – mówi Ola."
    ru: "— Мой велосипед новее, чем твой, — говорит Оля."
    words: { Mój: moj, rower: rower, jest: byc, nowszy: nowy, niż: niz, twój: twoj, mówi: mowic }
  - pl: "– Ale mój jest ładniejszy! – mówi Zosia."
    ru: "— Зато мой красивее! — говорит Зося."
    words: { mój: moj, jest: byc, ładniejszy: ladny, mówi: mowic }
  - pl: "– Moja książka jest trudniejsza i ciekawsza od twojej."
    ru: "— Моя книга труднее и интереснее твоей."
    words: { Moja: moj, książka: ksiazka, jest: byc, trudniejsza: trudny, ciekawsza: ciekawy, twojej: twoj }
  - pl: "– A moja jest łatwiejsza, więc czytam więcej!"
    ru: "— А моя легче, поэтому я читаю больше!"
    words: { moja: moj, jest: byc, łatwiejsza: latwy, czytam: czytac, więcej: duzo }
  - pl: Babcia słucha i śmieje się.
    ru: Бабушка слушает и смеётся.
    words: { Babcia: babcia, słucha: sluchac, śmieje: smiac }
  - pl: Potem siostry idą z babcią do parku.
    ru: Потом сёстры идут с бабушкой в парк.
    words: { Potem: potem, siostry: siostra, idą: isc, babcią: babcia, parku: park }
  - pl: "– Kto pierwszy do mostu? – woła Ola i biegnie."
    ru: "— Кто первым добежит до моста? — кричит Оля и бежит."
    words: { Kto: kto, pierwszy: pierwszy, mostu: most, woła: wolac, biegnie: biec }
  - pl: Zosia też biegnie, ale Ola biegnie szybciej.
    ru: Зося тоже бежит, но Оля бежит быстрее.
    words: { biegnie: biec, szybciej: szybko }
  - pl: "– Jestem najszybsza! – woła Ola przy moście."
    ru: "— Я самая быстрая! — кричит Оля у моста."
    words: { Jestem: byc, najszybsza: szybki, woła: wolac, moście: most }
  - pl: Ale gdzie jest Zosia?
    ru: Но где же Зося?
    words: { gdzie: gdzie, jest: byc }
  - pl: Ola czeka i czeka.
    ru: Оля ждёт и ждёт.
