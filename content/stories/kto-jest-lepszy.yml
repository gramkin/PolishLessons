  - pl: Babcia bierze kwiaty i dziękuje Zosi.
    ru: Бабушка берёт цветы и благодарит Зосю.
    words: { Babcia: babcia, bierze: brac, kwiaty: kwiat, dziękuje: dziekowac }
  - pl: "Wieczorem Ola pyta babcię:"
    ru: "Вечером Оля спрашивает бабушку:"
    words: { Wieczorem: wieczor, pyta: pytac, babcię: babcia }
  - pl: "– Babciu, która z nas jest lepsza?"
    ru: "— Бабушка, кто из нас лучше?"
    words: { Babciu: babcia, która: ktory, nas: my, jest: byc, lepsza: dobry }
  - pl: "– Ty jesteś szybsza, a Zosia ma więcej czasu na kwiaty – mówi babcia."
    ru: "— Ты быстрее, а у Зоси больше времени на цветы, — говорит бабушка."
    words: { Ty: ty, jesteś: byc, szybsza: szybki, ma: miec, więcej: duzo, czasu: czas, kwiaty: kwiat, mówi: mowic, babcia: babcia }
  - pl: "– Ale dla mnie jesteście najlepsze."
    ru: "— Но для меня вы обе самые лучшие."
    words: { mnie: ja, jesteście: byc, najlepsze: dobry }
  - pl: "– A ty, babciu? – pyta Zosia."
    ru: "— А ты, бабушка? — спрашивает Зося."
    words: { ty: ty, babciu: babcia, pyta: pytac }
  - pl: "– Ja? Ja jestem najszczęśliwszą babcią na świecie!"
    ru: "— Я? Я самая счастливая бабушка на свете!"
    words: { Ja: ja, jestem: byc, najszczęśliwszą: szczesliwy, babcią: babcia, świecie: swiat }
questions:
  - type: choice
    q: Кто из сестёр старше?
    options: ["Оля", "Зося", "Они ровесницы"]
    answer: 0
    explain: "Ola ma dziesięć lat, a Zosia osiem. Ola jest starsza i wyższa od Zosi — после od родительный: od Zosi."
  - type: choice
    q: Что Зося говорит о своём велосипеде?
    options: ["Что он красивее", "Что он новее", "Что он быстрее"]
    answer: 0
    explain: "Ale mój jest ładniejszy! Новее — велосипед Оли: nowszy niż twój."
  - type: choice
    q: Почему Зося читает больше?
    options: ["Её книга легче", "Её книга интереснее", "Она не любит бегать"]
    answer: 0
    explain: "A moja jest łatwiejsza, więc czytam więcej! Интереснее, по словам Оли, её собственная книга. więcej — неправильная сравнительная степень от dużo."
  - type: choice
    q: Почему Зося приходит к мосту позже?
    options: ["Она приходит с цветами для бабушки", "Она упала", "Она читала книгу"]
    answer: 0
    explain: "Zosia przychodzi dużo później, z kwiatami w ręce. — To kwiaty dla babci."
  - type: choice
    q: Что бабушка отвечает на вопрос «кто из нас лучше»?
    options: ["Что для неё обе самые лучшие", "Что лучше Оля, потому что она быстрее", "Что лучше Зося, потому что у неё цветы"]
    answer: 0
    explain: "Ale dla mnie jesteście najlepsze. najlepszy — превосходная от dobry, с тем же корнем, что lepszy."
  - type: choice
    q: "Moja książka jest ___ od twojej."
    options: ["trudniejsza", "bardziej trudniejsza", "trudnejsza"]
    answer: 0
    explain: "trudny берёт суффикс -iejszy: trudniejsza. Суффикс и bardziej вместе не ставят, как в русском нельзя «более труднее»."
  - type: listen
    text: Ola jest starsza i wyższa od Zosi.
    explain: "wyższa — от wysoki, с ż перед -sza; od Zosi — родительный."
  - type: translate
    q: Мой велосипед новее, чем твой.
    answer: ["Mój rower jest nowszy niż twój.", "Mój rower jest nowszy od twojego."]
    explain: "nowy → nowszy. После niż — тот же падеж, что у первого предмета (twój), после od — родительный (twojego)."
  - type: translate
    q: Я (ж.) самая быстрая!
    answer: ["Jestem najszybsza!", "Ja jestem najszybsza!"]
    explain: "szybki → szybszy → najszybszy; приставка naj- просто прибавляется к сравнительной форме. Женский род: najszybsza."
