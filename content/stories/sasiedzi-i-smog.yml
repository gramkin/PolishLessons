# review
title: Sąsiedzi i smog
titleRu: Соседи и смог
level: B1
chapter: 28
description: "Зимнее собрание жителей микрорайона: смог от старых угольных печей, план гмины вырубить деревья в парке под парковку, спор соседей, депутат совета и голосование за петицию; косвенная речь, страдательный залог, причастия и вежливое Pan/Pani."
sentences:
  - pl: W styczniu w osiedlowej świetlicy odbyło się zebranie mieszkańców.
    ru: В январе в клубе микрорайона прошло собрание жителей.
    words: { styczniu: styczen, świetlicy: swietlica, zebranie: zebranie, mieszkańców: mieszkaniec }
  - pl: Przyszło ponad czterdzieści osób, chociaż na dworze był mróz, a nad dachami wisiał gęsty smog.
    ru: Пришло больше сорока человек, хотя на улице был мороз, а над крышами висел густой смог.
    words: { Przyszło: przyjsc, czterdzieści: czterdziesci, osób: osoba, dworze: dwor, mróz: mroz, dachami: dach, wisiał: wisiec, smog: smog }
  - pl: Zebranie prowadziła pani Halina, przewodnicząca rady osiedla.
    ru: Собрание вела пани Галина, председатель совета микрорайона.
    words: { Zebranie: zebranie, pani: pani, przewodnicząca: przewodniczacy, rady: rada, osiedla: osiedle }
  - pl: – Dobry wieczór Państwu. Mamy dziś dwie sprawy – smog i plan gminy dotyczący parku przy ulicy Lipowej.
    ru: — Добрый вечер. Сегодня у нас два вопроса — смог и план гмины, касающийся парка на Липовой улице.
    words: { sprawy: sprawa, smog: smog, gminy: gmina, parku: park, ulicy: ulica }
  - pl: – Na zebranie został zaproszony radny, pan Marek, który odpowie na Państwa pytania.
    ru: — На собрание приглашён депутат совета, пан Марек, который ответит на ваши вопросы.
    words: { zebranie: zebranie, zaproszony: zaprosic, radny: radny, pan: pan, odpowie: odpowiedziec, pytania: pytanie }
  - pl: Pierwsza zabrała głos pani Agata, młoda mama z sąsiedniej klatki.
    ru: Первой взяла слово пани Агата, молодая мама из соседнего подъезда.
    words: { Pierwsza: pierwszy, głos: glos, pani: pani, młoda: mlody, mama: mama, klatki: klatka }
  - pl: – Mój synek ma trzy lata i od listopada ciągle kaszle.
    ru: — Моему сыночку три года, и с ноября он постоянно кашляет.
    words: { synek: synek, listopada: listopad, kaszle: kaszlec }
  - pl: – Lekarka powiedziała, że w dni, kiedy jest smog, nie powinien w ogóle wychodzić na dwór.
    ru: — Врач сказала, что в дни, когда стоит смог, ему вообще не следует выходить на улицу.
    words: { Lekarka: lekarka, powiedziała: powiedziec, dni: dzien, smog: smog, wychodzić: wychodzic, dwór: dwor }
  - pl: – Wieczorem z kominów domów za osiedlem leci czarny dym i czuć go nawet przy zamkniętych oknach.
    ru: — Вечером из труб домов за микрорайоном валит чёрный дым, и его чувствуешь даже при закрытых окнах.
    words: { kominów: komin, domów: dom, osiedlem: osiedle, czarny: czarny, dym: dym, oknach: okno }
  - pl: Wtedy wstał starszy pan w grubym swetrze.
    ru: Тогда встал пожилой мужчина в толстом свитере.
    words: { wstał: wstac, starszy: starszy, pan: pan, swetrze: sweter }
  - pl: – Mieszkam w jednym z tych domów – powiedział pan Stanisław.
    ru: — Я живу в одном из этих домов, — сказал пан Станислав.
    words: { Mieszkam: mieszkac, domów: dom, powiedział: powiedziec, pan: pan }
  - pl: – Palę węglem od czterdziestu lat, bo to najtańszy sposób, żeby ogrzać dom.
    ru: — Я топлю углём уже сорок лет, потому что это самый дешёвый способ обогреть дом.
    words: { węglem: wegiel, sposób: sposob, dom: dom }
  - pl: – Mam emeryturę, a nie pensję ministra. Na nowy piec mnie po prostu nie stać.
    ru: — У меня пенсия, а не зарплата министра. Новую печь я просто не могу себе позволить.
    words: { emeryturę: emerytura, pensję: pensja, ministra: minister, piec: piec-noun }
  - pl: – Nie palę śmieci, tylko węgiel, i nie lubię, kiedy się mówi, że truję cudze dzieci.
    ru: — Я не жгу мусор, только уголь, и мне не нравится, когда говорят, что я травлю чужих детей.
    words: { śmieci: smieci, węgiel: wegiel, lubię: lubic, mówi: mowic, truję: truc, cudze: cudzy, dzieci: dziecko }
  - pl: Pani Agata odpowiedziała spokojnie, że nikogo nie oskarża.
    ru: Пани Агата спокойно ответила, что никого не обвиняет.
    words: { Pani: pani, odpowiedziała: odpowiedziec, oskarża: oskarzac }
  - pl: – Rozumiem pana. Ale powietrze jest wspólne i wszyscy nim oddychamy, pan też.
    ru: — Я вас понимаю. Но воздух общий, и мы все им дышим, вы тоже.
    words: { Rozumiem: rozumiec, pana: pan, powietrze: powietrze, wspólne: wspolny, oddychamy: oddychac, pan: pan }
  - pl: – Gmina nie może nikomu zabronić palenia węglem z dnia na dzień – wyjaśnił radny.
    ru: — Гмина не может никому запретить топить углём в одночасье, — объяснил депутат.
    words: { Gmina: gmina, zabronić: zabronic, węglem: wegiel, wyjaśnił: wyjasnic, radny: radny }
  - pl: – Może jednak pomóc mieszkańcom w wymianie starych pieców na ekologiczne ogrzewanie.
    ru: — Но она может помочь жителям заменить старые печи экологичным отоплением.
    words: { pomóc: pomoc, mieszkańcom: mieszkaniec, wymianie: wymiana, starych: stary, pieców: piec-noun, ekologiczne: ekologiczny, ogrzewanie: ogrzewanie }
  - pl: – Wnioski mieszkańców są rozpatrywane przez urząd gminy po kolei, ale pieniędzy jest mniej niż chętnych.
    ru: — Заявления жителей рассматриваются управлением гмины по очереди, но денег меньше, чем желающих.
    words: { Wnioski: wniosek, mieszkańców: mieszkaniec, urząd: urzad, gminy: gmina, pieniędzy: pieniadz, chętnych: chetny }
  - pl: Pan Stanisław zapytał, czy ktoś pomoże mu wypełnić te wszystkie papiery.
    ru: Пан Станислав спросил, поможет ли ему кто-нибудь заполнить все эти бумаги.
    words: { Pan: pan, zapytał: zapytac, pomoże: pomoc, wypełnić: wypelnic, papiery: papier }
  - pl: – Ja panu pomogę – zaproponowała pani Agata, ku zdziwieniu wszystkich.
    ru: — Я вам помогу, — к всеобщему удивлению предложила пани Агата.
    words: { panu: pan, pomogę: pomoc, zaproponowała: zaproponowac, pani: pani, zdziwieniu: zdziwienie }
  - pl: Potem przewodnicząca przeszła do drugiej sprawy.
    ru: Потом председатель перешла ко второму вопросу.
    words: { przewodnicząca: przewodniczacy, przeszła: przejsc, drugiej: drugi, sprawy: sprawa }
  - pl: – Dowiedzieliśmy się, że gmina planuje wycinkę drzew w parku przy Lipowej, bo ma tam powstać parking.
    ru: — Мы узнали, что гмина планирует вырубку деревьев в парке на Липовой, потому что там должна появиться парковка.
    words: { Dowiedzieliśmy: dowiedziec, gmina: gmina, planuje: planowac, wycinkę: wycinka, drzew: drzewo, parku: park, powstać: powstac, parking: parking }
  - pl: – Czy to prawda, panie radny?
    ru: — Это правда, пан депутат?
    words: { prawda: prawda, panie: pan, radny: radny }
  - pl: – Taki projekt rzeczywiście został przygotowany, ale decyzja jeszcze nie zapadła – odpowiedział radny.
    ru: — Такой проект действительно подготовлен, но решение ещё не принято, — ответил депутат.
    words: { projekt: projekt, przygotowany: przygotowac, decyzja: decyzja, odpowiedział: odpowiedziec, radny: radny }
  - pl: – Kierowcy od lat skarżą się, że wieczorem nie ma gdzie zaparkować.
    ru: — Водители уже много лет жалуются, что вечером негде припарковаться.
    words: { Kierowcy: kierowca, skarżą: skarzyc, zaparkować: zaparkowac }
  - pl: Młody mężczyzna z tylnego rzędu przyznał, że sam codziennie krąży po osiedlu w poszukiwaniu miejsca.
    ru: Молодой мужчина из заднего ряда признался, что сам каждый день кружит по микрорайону в поисках места.
    words: { Młody: mlody, mężczyzna: mezczyzna, rzędu: rzad, przyznał: przyznac, codziennie: codziennie, krąży: krazyc, osiedlu: osiedle, miejsca: miejsce }
  - pl: – Parking można zbudować gdzie indziej, a stuletnich drzew nikt nam nie odda – zauważyła starsza pani siedząca przy oknie.
    ru: — Парковку можно построить в другом месте, а столетних деревьев нам никто не вернёт, — заметила пожилая женщина, сидевшая у окна.
    words: { Parking: parking, zbudować: zbudowac, drzew: drzewo, nikt: nikt, odda: oddac, zauważyła: zauwazyc, starsza: starszy, pani: pani, siedząca: siedziec, oknie: okno }
  - pl: – Te drzewa dają cień w upały, a w parku bawią się dzieci z całego osiedla.
    ru: — Эти деревья дают тень в жару, а в парке играют дети со всего микрорайона.
    words: { drzewa: drzewo, cień: cien, upały: upal, parku: park, dzieci: dziecko, osiedla: osiedle }
  - pl: – Co więc możemy zrobić? – zapytała pani Halina.
    ru: — Так что же мы можем сделать? — спросила пани Галина.
    words: { zrobić: zrobic, zapytała: zapytac, pani: pani }
  - pl: Radny odpowiedział, że radni zawsze biorą pod uwagę zdanie mieszkańców, zwłaszcza gdy pod wnioskiem podpisze się wielu ludzi.
    ru: Депутат ответил, что депутаты совета всегда учитывают мнение жителей, особенно когда под заявлением подпишется много людей.
    words: { Radny: radny, odpowiedział: odpowiedziec, radni: radny, biorą: brac, zdanie: zdanie, mieszkańców: mieszkaniec, wnioskiem: wniosek, podpisze: podpisac, wielu: wiele, ludzi: ludzie }
  - pl: – W tym parku spaceruję codziennie, więc proponuję petycję – odezwał się niespodziewanie pan Stanisław.
    ru: — Я гуляю в этом парке каждый день, поэтому предлагаю петицию, — неожиданно отозвался пан Станислав.
    words: { parku: park, codziennie: codziennie, petycję: petycja, pan: pan }
  - pl: – Najpierw jednak zagłosujmy, czy w ogóle chcemy zbierać podpisy – dodała przewodnicząca.
    ru: — Но сначала давайте проголосуем, хотим ли мы вообще собирать подписи, — добавила председатель.
    words: { zagłosujmy: glosowac, zbierać: zbierac, podpisy: podpis, dodała: dodac, przewodnicząca: przewodniczacy }
  - pl: Za zbieraniem podpisów głosowało trzydzieści osiem osób, dwie były przeciw, a jedna wstrzymała się od głosu.
    ru: За сбор подписей проголосовали тридцать восемь человек, двое были против, а один человек воздержался.
    words: { podpisów: podpis, głosowało: glosowac, osób: osoba, przeciw: przeciw, wstrzymała: wstrzymac, głosu: glos }
  - pl: Jednym z głosujących przeciw był młody kierowca, ale obiecał, że i tak przyjdzie na następne zebranie.
    ru: Одним из проголосовавших против был молодой водитель, но он пообещал, что всё равно придёт на следующее собрание.
    words: { głosujących: glosowac, przeciw: przeciw, młody: mlody, kierowca: kierowca, obiecał: obiecac, przyjdzie: przyjsc, następne: nastepny, zebranie: zebranie }
  - pl: Radny obiecał, że na najbliższej sesji rady poruszy sprawę wymiany starych pieców.
    ru: Депутат пообещал, что на ближайшей сессии совета поднимет вопрос о замене старых печей.
    words: { Radny: radny, obiecał: obiecac, sesji: sesja, rady: rada, poruszy: poruszyc, sprawę: sprawa, wymiany: wymiana, starych: stary, pieców: piec-noun }
  - pl: Wychodząc, pan Stanisław i pani Agata umówili się na sobotę, żeby razem wypełnić wniosek.
    ru: Уходя, пан Станислав и пани Агата договорились на субботу, чтобы вместе заполнить заявление.
    words: { Wychodząc: wychodzic, pan: pan, pani: pani, umówili: umowic, sobotę: sobota, razem: razem, wypełnić: wypelnic, wniosek: wniosek }
  - pl: Na dworze wciąż wisiał smog, ale sąsiedzi po raz pierwszy od dawna wracali do domów, rozmawiając ze sobą.
    ru: На улице всё ещё висел смог, но соседи впервые за долгое время возвращались домой, разговаривая друг с другом.
    words: { dworze: dwor, wciąż: wciaz, wisiał: wisiec, smog: smog, sąsiedzi: sasiad, wracali: wracac, domów: dom, rozmawiając: rozmawiac }
questions:
  - type: choice
    q: Почему пани Агата беспокоится из-за смога?
    options:
      - Её сын с ноября постоянно кашляет, и врач велела ему не выходить на улицу в дни смога
      - У неё самой астма
      - Дым из труб мешает ей сушить бельё
      - Её квартира стоит рядом с электростанцией
    answer: 0
    explain: "«Lekarka powiedziała, że w dni, kiedy jest smog, nie powinien w ogóle wychodzić na dwór.» Косвенная речь с że: в польском время не сдвигается, как и в русском."
  - type: choice
    q: Почему пан Станислав топит углём?
    options:
      - Он не знает о вреде смога
      - Это самый дешёвый способ обогреть дом, а на новую печь у него нет денег
      - Ему нравится запах угольного дыма
      - Гмина запретила ему менять печь
    answer: 1
    explain: "«…bo to najtańszy sposób, żeby ogrzać dom.» и «Na nowy piec mnie po prostu nie stać.» Nie stać mnie na coś — «не могу себе позволить»."
  - type: choice
    q: Что, по словам депутата, может сделать гмина со старыми печами?
    options:
      - Сразу запретить топить углём
      - Ничего, это не её дело
      - Помочь жителям заменить старые печи, хотя денег на всех желающих не хватает
      - Бесплатно привезти всем газ
    answer: 2
    explain: "«Może jednak pomóc mieszkańcom w wymianie starych pieców…» и «…pieniędzy jest mniej niż chętnych.» Wnioski są rozpatrywane — страдательный залог: заявления рассматриваются."
  - type: choice
    q: Решено ли уже строить парковку на месте парка?
    options:
      - Да, деревья вырубят весной
      - Нет, проект подготовлен, но решение ещё не принято
      - Нет, проекта парковки вообще не существует
      - Да, жители сами за это проголосовали
    answer: 1
    explain: "«Taki projekt rzeczywiście został przygotowany, ale decyzja jeszcze nie zapadła.» Został przygotowany — страдательный залог с zostać: «был подготовлен»."
  - type: choice
    q: Кто неожиданно предложил петицию?
    options:
      - Пани Агата
      - Депутат пан Марек
      - Молодой водитель
      - Пан Станислав, который каждый день гуляет в этом парке
    answer: 3
    explain: "«W tym parku spaceruję codziennie, więc proponuję petycję – odezwał się niespodziewanie pan Stanisław.»"
  - type: choice
    q: Чем закончилось собрание?
    options:
      - Жители проголосовали за сбор подписей, а депутат обещал поднять вопрос о замене печей на сессии совета
      - Собрание сорвалось из-за ссоры
      - Жители решили сами вырубить деревья
      - Депутат отказался что-либо обещать
    answer: 0
    explain: "«Za zbieraniem podpisów głosowało trzydzieści osiem osób…» и «Radny obiecał, że na najbliższej sesji rady poruszy sprawę wymiany starych pieców.»"
  - type: listen
    text: "Taki projekt rzeczywiście został przygotowany, ale decyzja jeszcze nie zapadła."
    explain: "Decyzja zapadła — «решение принято», буквально «решение выпало»; został przygotowany — страдательный залог с zostać."
