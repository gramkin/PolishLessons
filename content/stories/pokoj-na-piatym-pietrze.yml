# review
title: Pokój na piątym piętrze
titleRu: Комната на шестом этаже
level: A2
chapter: 20
description: "Аня и Марек приезжают в гостиницу, а бронь оказывается на другой месяц; разговор на ресепшене: rezerwacja, wolne pokoje, piętro, winda, śniadanie."
sentences:
  - pl: W lipcu Ania i Marek przyjechali do Zakopanego.
