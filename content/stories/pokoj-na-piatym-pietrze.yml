questions:
  - type: choice
    q: Что случилось на ресепшене?
    options:
      - Марек забыл паспорт
      - Бронь была не на июль, а на август
      - Гостиница была закрыта
      - Аня потеряла чемодан
    answer: 1
    explain: "«Tak, ma pan rezerwację, ale na sierpień.» Марек забронировал номер в мае, но не на тот месяц."
  - type: choice
    q: Почему гости не любят комнату на шестом этаже?
    options:
      - Там холодно
      - Там нет окна
      - Она маленькая, а в гостинице нет лифта
      - Она очень дорогая
    answer: 2
    explain: "«bo jest bardzo mały, a w hotelu nie ma windy». Na piątym piętrze — это русский шестой этаж: первый этаж по-польски parter, счёт этажей начинается над ним."
  - type: choice
    q: Что увидела Аня утром?
    options:
      - Горы, зелёные поля и маленькие дома
      - Море и пляж
      - Большой город
      - Двор и парковку
    answer: 0
    explain: "«Za oknem były wysokie góry, zielone pola i małe domy.» Za oknem — za + творительный, «за окном»."
  - type: choice
    q: Почему Марек говорит, что они приедут сюда и в августе?
    options:
      - Аня хочет снова увидеть горы
      - Им вернули деньги
      - Им обещали большую комнату
      - У них уже есть бронь на август
    answer: 3
    explain: "«A w sierpniu też tu przyjedziemy… Przecież mamy rezerwację!» Ошибка Марека в конце оказалась удачей, и Аня соглашается: «Dobrze, ale tylko do tego pokoju!»"
  - type: choice
    q: "Какая форма стоит в тексте? «Niestety, w lipcu nie mamy wolnych ___.»"
    options: [pokoje, pokoi, pokojów]
    answer: 1
    explain: "После отрицания — родительный падеж, во множественном: pokoi (pokojów — реже, в разговорной речи). Pokoje — именительный."
  - type: listen
    text: Ania otworzyła drzwi na balkon i zobaczyła góry.
    explain: "drzwi — слово только множественного числа, даже когда дверь одна: drzwi na balkon — «дверь на балкон»; пишется с rz."
  - type: translate
    q: У нас бронь на август.
    answer:
      - Mamy rezerwację na sierpień.
    explain: "«У нас есть» — mamy. Бронь «на август» — na + винительный: na sierpień. Названия месяцев пишутся со строчной буквы."
  - type: translate
    q: К сожалению, у нас нет свободных номеров.
    answer:
      - Niestety, nie mamy wolnych pokoi.
      - Niestety, nie mamy wolnych pokojów.
      - Niestety, nie ma wolnych pokoi.
    explain: "«Номер» в гостинице — pokój. После nie mamy — родительный множественного: wolnych pokoi."
