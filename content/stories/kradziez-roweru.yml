questions:
  - type: choice
    q: Где и когда украли велосипед Марты?
    options:
      - В понедельник утром у полицейского участка
      - В пятницу вечером у университетской библиотеки
      - В четверг в гараже за вокзалом
      - В пятницу утром у её дома
    answer: 1
    explain: "«W piątek wieczorem, przed biblioteką uniwersytecką.» Przed + творительный: przed biblioteką."
  - type: choice
    q: Что случилось с замком?
    options:
      - Вор его открыл ключом
      - Марта забыла пристегнуть велосипед
      - Замок перерезали, и он лежал у стойки
      - Замок унесли вместе с велосипедом
    answer: 2
    explain: "«Leżało przy stojaku. Było przecięte.» Było przecięte — состояние (być + причастие): замок был перерезан."
  - type: choice
    q: Как опознали вора?
    options:
      - По записи с камеры перед библиотекой
      - По отпечаткам пальцев на замке
      - По объявлению о продаже в газете
      - Его узнала Марта
    answer: 0
    explain: "«Sprawca został rozpoznany na nagraniu z kamery przed biblioteką uniwersytecką.» Został rozpoznany — событие: zostać + причастие совершенного вида."
  - type: choice
    q: Что делал мужчина, когда его задержали?
    options:
      - Перерезал замок у библиотеки
      - Пытался продать очередной велосипед через интернет
      - Прятал велосипеды в гараже
      - Ехал на велосипеде Марты
    answer: 1
    explain: "«Mężczyzna został zatrzymany przez policję w piątek, kiedy próbował sprzedać kolejny rower przez internet.» Деятель — przez + винительный: przez policję."
  - type: choice
    q: Что стало с большинством найденных велосипедов?
    options:
      - Их продали на аукционе
      - Они до сих пор хранятся в участке
      - Их уже вернули владельцам
      - Их сфотографировали и выставили в интернете
    answer: 2
    explain: "«Większość rowerów oddano już właścicielom.» Oddano — безличная форма на -no: «вернули», без названного деятеля."
  - type: choice
    q: Что изменилось в велосипеде Марты?
    options:
      - Его перекрасили в чёрный цвет
      - Корзинка была погнута, а седло заменили на чёрное
      - С рамы сорвали наклейку с котом
      - Он больше не ездит
    answer: 1
    explain: "«Koszyk był wygięty, a siodełko zostało wymienione na czarne.» Był wygięty — состояние, zostało wymienione — событие."
  - type: listen
    text: "Większość rowerów oddano już właścicielom."
    explain: "Oddano — безличная форма от oddać: «вернули», без подлежащего."
