    words: { biegnie: biec, most: most, psa: pies, już: juz, widzi: widziec }
  - pl: Za mostem są tylko pola.
    ru: За мостом только поля.
    words: { mostem: most, są: byc, pola: pole }
  - pl: Ania szuka Burka przez godzinę.
    ru: Аня ищет Бурека целый час.
    words: { szuka: szukac, godzinę: godzina }
  - pl: "Pyta pana z rowerem: – Przepraszam, czy pan widział małego czarnego psa?"
    ru: "Она спрашивает пана с велосипедом: — Простите, вы не видели маленькую чёрную собаку?"
    words: { Pyta: pytac, pana: pan, rowerem: rower, Przepraszam: przepraszam, pan: pan, widział: widziec, małego: maly, czarnego: czarny, psa: pies }
  - pl: "– Tak! Biegł za kotem nad rzekę."
    ru: "— Да! Он бежал за котом к реке."
    words: { Tak: tak, Biegł: biec, kotem: kot, rzekę: rzeka }
  - pl: Ania idzie nad rzekę, ale nad rzeką nie ma psa.
    ru: Аня идёт к реке, но у реки собаки нет.
    words: { idzie: isc, rzekę: rzeka, rzeką: rzeka, ma: miec, psa: pies }
  - pl: Jest już piąta. Ania wraca do domu bez psa.
    ru: Уже пять часов. Аня возвращается домой без собаки.
    words: { Jest: byc, już: juz, piąta: piaty, wraca: wracac, domu: dom, psa: pies }
  - pl: Idzie przez most i myśli o Burku.
    ru: Она идёт через мост и думает о Буреке.
    words: { Idzie: isc, most: most, myśli: myslec }
  - pl: Przed domem stoi mama.
    ru: Перед домом стоит мама.
    words: { domem: dom, stoi: stac, mama: mama }
  - pl: "– Ania! Gdzie byłaś?"
    ru: "— Аня! Где ты была?"
    words: { Gdzie: gdzie, byłaś: byc }
  - pl: "– Szukałam Burka w parku i nad rzeką! Nie ma go!"
    ru: "— Я искала Бурека в парке и у реки! Его нет!"
    words: { Szukałam: szukac, parku: park, rzeką: rzeka, ma: miec, go: on }
  - pl: "– Burek jest w domu. Przyszedł sam godzinę temu."
    ru: "— Бурек дома. Он пришёл сам час назад."
    words: { jest: byc, domu: dom, Przyszedł: przyjsc, sam: sam, godzinę: godzina }
  - pl: "– Sam? Przez most i przez ulicę?"
    ru: "— Сам? Через мост и через улицу?"
    words: { Sam: sam, most: most, ulicę: ulica }
  - pl: "– Tak. Teraz śpi pod stołem."
    ru: "— Да. Сейчас он спит под столом."
    words: { Tak: tak, Teraz: teraz, śpi: spac, stołem: stol }
  - pl: Ania biegnie do domu.
    ru: Аня бежит в дом.
    words: { biegnie: biec, domu: dom }
  - pl: Pod stołem naprawdę śpi Burek.
    ru: Под столом и правда спит Бурек.
    words: { stołem: stol, naprawdę: naprawde, śpi: spac }
  - pl: "– Jutro też idziemy do parku – mówi Ania. – Ale bez kotów!"
    ru: "— Завтра мы тоже идём в парк, — говорит Аня. — Но без котов!"
    words: { Jutro: jutro, idziemy: isc, parku: park, mówi: mowic, kotów: kot }
