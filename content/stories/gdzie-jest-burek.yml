  - type: choice
    q: Где Аня ищет собаку?
    options: ["в парке и у реки", "дома под столом", "в магазине и на улице"]
    answer: 0
    explain: "Szukałam Burka w parku i nad rzeką! Под столом Бурек как раз и спит — но там Аня не искала."
  - type: choice
    q: Как Бурек попал домой?
    options: ["Пришёл сам", "Его привела мама", "Его принёс пан с велосипедом"]
    answer: 0
    explain: "Przyszedł sam godzinę temu. przyjść — «прийти», прошедшее przyszedł с той же основой, что szedł."
  - type: choice
    q: "Kot biegnie przez park, a Burek ___ za nim."
    options: ["biegnie", "biega", "biegną"]
    answer: 0
    explain: "Бурек бежит в одну сторону, за котом, — biec: biegnie, как «бежит». biega — «бегает» без направления, а biegną — «они бегут»."
  - type: listen
    text: Ania codziennie chodzi z psem do parku.
    explain: "chodzi — с dz перед i; psem — творительный от pies, гласная e выпадает, как в русском «пёс — псом»."
  - type: translate
    q: Я каждый день хожу в парк.
    answer: ["Codziennie chodzę do parku.", "Chodzę codziennie do parku.", "Chodzę do parku codziennie.", "Ja codziennie chodzę do parku."]
