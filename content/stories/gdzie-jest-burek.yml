# review
title: Gdzie jest Burek?
titleRu: Где Бурек?
level: A2
chapter: 14
description: "Пёс Бурек убегает за котом, и Аня ищет его по всему парку. Пары глаголов движения: biec / biegać, iść / chodzić, а ещё wychodzić, przyjść и przez most."
sentences:
  - pl: Ania codziennie chodzi z psem do parku.
    ru: Аня каждый день ходит с собакой в парк.
    words: { codziennie: codziennie, chodzi: chodzic, psem: pies, parku: park }
  - pl: Pies nazywa się Burek i bardzo lubi biegać.
    ru: Пса зовут Бурек, и он очень любит бегать.
    words: { Pies: pies, nazywa: nazywac, bardzo: bardzo, lubi: lubic, biegać: biegac }
  - pl: Dzisiaj też wychodzą z domu o trzeciej.
    ru: Сегодня они тоже выходят из дома в три.
    words: { Dzisiaj: dzisiaj, wychodzą: wychodzic, domu: dom, trzeciej: trzeci }
  - pl: W parku Burek biega, a Ania czyta książkę.
    ru: В парке Бурек бегает, а Аня читает книгу.
    words: { parku: park, biega: biegac, czyta: czytac, książkę: ksiazka }
  - pl: Nagle Burek widzi kota.
    ru: Вдруг Бурек видит кота.
    words: { Nagle: nagle, widzi: widziec, kota: kot }
  - pl: Kot biegnie przez park, a Burek biegnie za nim.
    ru: Кот бежит через парк, а Бурек бежит за ним.
    words: { Kot: kot, biegnie: biec, park: park, nim: on }
  - pl: "– Burek, do mnie! – woła Ania."
    ru: "— Бурек, ко мне! — зовёт Аня."
