  - pl: Ale pies nie słucha.
    ru: Но пёс не слушается.
    words: { pies: pies, słucha: sluchac }
  - pl: Kot i pies biegną przez most nad rzeką.
    ru: Кот и пёс бегут через мост над рекой.
    words: { Kot: kot, pies: pies, biegną: biec, most: most, rzeką: rzeka }
  - pl: Ania też biegnie przez most, ale psa już nie widzi.
